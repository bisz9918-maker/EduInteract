<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scene 1 - 等腰直角三角形外接圆</title>
<style>
body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
#scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
#scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
#scene1-controls button { padding: 6px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: #f5f5f5; }
#scene1-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
#scene1-step-indicator { font-size: 14px; color: #333; min-width: 80px; text-align: center; }
svg { display: block; }
.step-element { transition: opacity 0.3s ease, stroke 0.3s ease, stroke-width 0.3s ease, fill-opacity 0.3s ease; }
.hidden { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="scene1-container">
<svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
  <!-- 圆O -->
  <circle id="scene1-circle-o" cx="400" cy="250" r="150" fill="none" stroke="#000000" stroke-width="1.5"/>

  <!-- 弦 -->
  <line id="scene1-chord-ab" x1="250" y1="250" x2="550" y2="250" stroke="#000000" stroke-width="1.5"/>
  <line id="scene1-chord-ac" x1="250" y1="250" x2="400" y2="100" stroke="#000000" stroke-width="1.5"/>
  <line id="scene1-chord-bc" x1="400" y1="100" x2="550" y2="250" stroke="#000000" stroke-width="1.5"/>
  <line id="scene1-chord-ad" x1="250" y1="250" x2="256" y2="208" stroke="#000000" stroke-width="1.5"/>
  <line id="scene1-chord-bd" x1="550" y1="250" x2="256" y2="208" stroke="#000000" stroke-width="1.5"/>

  <!-- 点 -->
  <circle id="scene1-point-a" cx="250" cy="250" r="4" fill="#000000"/>
  <circle id="scene1-point-b" cx="550" cy="250" r="4" fill="#000000"/>
  <circle id="scene1-point-c" cx="400" cy="100" r="4" fill="#000000"/>
  <circle id="scene1-point-d" cx="256" cy="208" r="4" fill="#000000"/>
  <circle id="scene1-point-e" cx="288" cy="213" r="4" fill="#000000"/>
  <circle id="scene1-point-o" cx="400" cy="250" r="3" fill="#000000"/>

  <!-- 直角标记C -->
  <path id="scene1-right-angle-c" d="M391.5,108.5 L400,100 L408.5,108.5" fill="none" stroke="#2e7d32" stroke-width="1.5" class="step-element hidden"/>

  <!-- 直角标记D -->
  <path id="scene1-right-angle-d" d="M254.6,217.9 L256,208 L265.9,209.4" fill="none" stroke="#2e7d32" stroke-width="1.5" class="step-element hidden"/>

  <!-- 等长标记 -->
  <line id="scene1-tick-ac" x1="322.2" y1="172.2" x2="327.8" y2="177.8" stroke="#000000" stroke-width="1.5" class="step-element hidden"/>
  <line id="scene1-tick-bc" x1="472.2" y1="177.8" x2="477.8" y2="172.2" stroke="#000000" stroke-width="1.5" class="step-element hidden"/>

  <!-- △ADB填充 -->
  <polygon id="scene1-fill-adb" points="250,250 256,208 550,250" fill="#c62828" fill-opacity="0" class="step-element"/>

  <!-- △ADB虚线框 -->
  <path id="scene1-dashed-adb" d="M250,250 L256,208 L550,250 Z" fill="none" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="5,5" opacity="0" class="step-element"/>

  <!-- 顶点标签 -->
  <text id="scene1-label-a" x="220" y="270" font-size="16" fill="#000000" text-anchor="middle">A</text>
  <text id="scene1-label-b" x="570" y="270" font-size="16" fill="#000000" text-anchor="middle">B</text>
  <text id="scene1-label-c" x="400" y="80" font-size="16" fill="#000000" text-anchor="middle">C</text>
  <text id="scene1-label-d" x="220" y="200" font-size="16" fill="#000000" text-anchor="middle">D</text>
  <text id="scene1-label-e" x="245" y="220" font-size="16" fill="#000000" text-anchor="middle">E</text>
  <text id="scene1-label-o" x="570" y="210" font-size="14" fill="#000000" text-anchor="start">O</text>

  <!-- 步骤标签 -->
  <text id="scene1-label-bc" x="620" y="150" font-size="14" fill="#1565c0" text-anchor="start" class="step-element hidden">BC = 4</text>
  <text id="scene1-label-ad" x="140" y="130" font-size="14" fill="#1565c0" text-anchor="start" class="step-element hidden">AD = 4/5</text>
  <text id="scene1-label-angle-c" x="480" y="80" font-size="14" fill="#000000" text-anchor="start" class="step-element hidden">∠C = 90°</text>
  <text id="scene1-label-ab-diam" x="450" y="420" font-size="14" fill="#c62828" text-anchor="start" class="step-element hidden">AB为直径</text>
  <text id="scene1-label-ab-val" x="300" y="420" font-size="14" fill="#c62828" text-anchor="start" class="step-element hidden">AB = 4√2</text>
  <text id="scene1-label-angle-d" x="620" y="275" font-size="14" fill="#000000" text-anchor="start" class="step-element hidden">∠ADB = 90°</text>
  <text id="scene1-label-bd" x="620" y="210" font-size="14" fill="#c62828" text-anchor="start" class="step-element hidden">BD = 28/5</text>
</svg>

<div id="scene1-controls">
  <button id="scene1-btn-prev">◀ 上一步</button>
  <span id="scene1-step-indicator">步骤 0 / 4</span>
  <button id="scene1-btn-next">下一步 ▶</button>
</div>
</div>

<script>
(function() {
  // Scene 1 状态机
  let currentStep = 0;
  const totalSteps = 4;

  // 缓存所有交互元素
  const els = {
    circleO: document.getElementById('scene1-circle-o'),
    chordAB: document.getElementById('scene1-chord-ab'),
    chordAC: document.getElementById('scene1-chord-ac'),
    chordBC: document.getElementById('scene1-chord-bc'),
    chordAD: document.getElementById('scene1-chord-ad'),
    chordBD: document.getElementById('scene1-chord-bd'),
    pointC: document.getElementById('scene1-point-c'),
    pointE: document.getElementById('scene1-point-e'),
    rightAngleC: document.getElementById('scene1-right-angle-c'),
    rightAngleD: document.getElementById('scene1-right-angle-d'),
    tickAC: document.getElementById('scene1-tick-ac'),
    tickBC: document.getElementById('scene1-tick-bc'),
    fillADB: document.getElementById('scene1-fill-adb'),
    dashedADB: document.getElementById('scene1-dashed-adb'),
    labelBC: document.getElementById('scene1-label-bc'),
    labelAD: document.getElementById('scene1-label-ad'),
    labelAngleC: document.getElementById('scene1-label-angle-c'),
    labelABDiam: document.getElementById('scene1-label-ab-diam'),
    labelABVal: document.getElementById('scene1-label-ab-val'),
    labelAngleD: document.getElementById('scene1-label-angle-d'),
    labelBD: document.getElementById('scene1-label-bd'),
    indicator: document.getElementById('scene1-step-indicator'),
    btnPrev: document.getElementById('scene1-btn-prev'),
    btnNext: document.getElementById('scene1-btn-next')
  };

  function show(el) { el.classList.remove('hidden'); }
  function hide(el) { el.classList.add('hidden'); }

  function resetStyles() {
    // 重置所有弦为黑色主线
    els.chordAB.style.stroke = '#000000'; els.chordAB.style.strokeWidth = '1.5';
    els.chordAC.style.stroke = '#000000'; els.chordAC.style.strokeWidth = '1.5';
    els.chordBC.style.stroke = '#000000'; els.chordBC.style.strokeWidth = '1.5';
    els.chordAD.style.stroke = '#000000'; els.chordAD.style.strokeWidth = '1.5';
    els.chordBD.style.stroke = '#000000'; els.chordBD.style.strokeWidth = '1.5';

    // 重置淡化效果
    els.circleO.style.opacity = '1';
    els.chordAC.style.opacity = '1';
    els.chordBC.style.opacity = '1';
    els.pointC.style.opacity = '1';
    els.pointE.style.opacity = '1';

    // 重置△ADB填充和虚线框
    els.fillADB.style.fillOpacity = '0';
    els.dashedADB.style.opacity = '0';
  }

  function renderStep() {
    resetStyles();

    // 隐藏所有步骤专属元素
    hide(els.rightAngleC); hide(els.rightAngleD);
    hide(els.tickAC); hide(els.tickBC);
    hide(els.labelBC); hide(els.labelAD); hide(els.labelAngleC);
    hide(els.labelABDiam); hide(els.labelABVal);
    hide(els.labelAngleD); hide(els.labelBD);

    // 更新指示器和按钮状态
    els.indicator.textContent = '步骤 ' + currentStep + ' / ' + totalSteps;
    els.btnPrev.disabled = (currentStep === 0);
    els.btnNext.disabled = (currentStep === totalSteps);

    if (currentStep >= 1) {
      // 步骤1：标注已知条件
      els.chordBC.style.stroke = '#1565c0'; els.chordBC.style.strokeWidth = '2.5';
      els.chordAD.style.stroke = '#1565c0'; els.chordAD.style.strokeWidth = '2.5';
      show(els.labelBC); show(els.labelAD); show(els.labelAngleC);
      show(els.rightAngleC); show(els.tickAC); show(els.tickBC);
    }

    if (currentStep >= 2) {
      // 步骤2：推导AB为直径
      els.chordAB.style.stroke = '#c62828'; els.chordAB.style.strokeWidth = '2.5';
      show(els.labelABDiam); show(els.labelABVal);
    }

    if (currentStep >= 3) {
      // 步骤3：圆周角性质，聚焦△ADB
      els.circleO.style.opacity = '0.25';
      els.chordAC.style.opacity = '0.25';
      els.chordBC.style.opacity = '0.25';
      els.pointC.style.opacity = '0.25';
      els.pointE.style.opacity = '0.25';

      els.chordAB.style.stroke = '#c62828'; els.chordAB.style.strokeWidth = '2.5';
      els.chordAD.style.stroke = '#c62828'; els.chordAD.style.strokeWidth = '2.5';
      els.chordBD.style.stroke = '#c62828'; els.chordBD.style.strokeWidth = '2.5';

      els.fillADB.style.fillOpacity = '0.2';
      els.dashedADB.style.opacity = '1';
      show(els.rightAngleD); show(els.labelAngleD);
    }

    if (currentStep >= 4) {
      // 步骤4：计算BD
      els.circleO.style.opacity = '1';
      els.chordAC.style.opacity = '1';
      els.chordBC.style.opacity = '1';
      els.pointC.style.opacity = '1';
      els.pointE.style.opacity = '1';

      show(els.labelBD);
      els.chordBD.style.stroke = '#c62828'; els.chordBD.style.strokeWidth = '2.5';
    }
  }

  els.btnPrev.addEventListener('click', function() {
    if (currentStep > 0) { currentStep--; renderStep(); }
  });

  els.btnNext.addEventListener('click', function() {
    if (currentStep < totalSteps) { currentStep++; renderStep(); }
  });

  // 初始渲染
  renderStep();
})();
</script>
</body>
</html>
