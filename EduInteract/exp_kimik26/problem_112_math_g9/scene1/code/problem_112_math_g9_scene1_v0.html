<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旋转全等三角形角度推导</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            padding: 6px 16px; font-size: 14px; cursor: pointer;
            border: 1px solid #ccc; border-radius: 4px; background: #f5f5f5;
        }
        #scene1-controls button:hover { background: #e0e0e0; }
        #scene1-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 14px; color: #333; min-width: 70px; text-align: center; }
        .scene1-fade { transition: opacity 300ms ease; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" viewBox="0 0 800 500">
            <!-- 坐标表参考：
                 O(280,380), A(370,273), B(449,318)
                 C(210,259), D(280,200)
            -->

            <!-- === 三角形填充（步骤2显示） === -->
            <polygon id="scene1-fill-oab" points="280,380 370,273 449,318" fill="#1565c0" opacity="0" class="scene1-fade"/>
            <polygon id="scene1-fill-ocd" points="280,380 210,259 280,200" fill="#c62828" opacity="0" class="scene1-fade"/>

            <!-- === 边线 === -->
            <!-- △OAB 蓝边 -->
            <line id="scene1-side-oa" x1="280" y1="380" x2="370" y2="273" stroke="#1565c0" stroke-width="2"/>
            <line id="scene1-side-ab" x1="370" y1="273" x2="449" y2="318" stroke="#1565c0" stroke-width="2"/>
            <line id="scene1-side-bo" x1="449" y1="318" x2="280" y2="380" stroke="#1565c0" stroke-width="2"/>
            <!-- △OCD 红边 -->
            <line id="scene1-side-oc" x1="280" y1="380" x2="210" y2="259" stroke="#c62828" stroke-width="2"/>
            <line id="scene1-side-cd" x1="210" y1="259" x2="280" y2="200" stroke="#c62828" stroke-width="2"/>
            <line id="scene1-side-do" x1="280" y1="200" x2="280" y2="380" stroke="#c62828" stroke-width="2"/>

            <!-- === 顶点圆点 === -->
            <circle id="scene1-vertex-o" cx="280" cy="380" r="3" fill="#000"/>
            <circle id="scene1-vertex-a" cx="370" cy="273" r="3" fill="#000"/>
            <circle id="scene1-vertex-b" cx="449" cy="318" r="3" fill="#000"/>
            <circle id="scene1-vertex-c" cx="210" cy="259" r="3" fill="#000"/>
            <circle id="scene1-vertex-d" cx="280" cy="200" r="3" fill="#000"/>

            <!-- === 顶点标签 === -->
            <text id="scene1-label-o" x="250" y="410" font-size="16" fill="#000" font-weight="bold">O</text>
            <text id="scene1-label-a" x="385" y="258" font-size="16" fill="#000" font-weight="bold">A</text>
            <text id="scene1-label-b" x="464" y="333" font-size="16" fill="#000" font-weight="bold">B</text>
            <text id="scene1-label-c" x="190" y="244" font-size="16" fill="#000" font-weight="bold">C</text>
            <text id="scene1-label-d" x="295" y="180" font-size="16" fill="#000" font-weight="bold">D</text>

            <!-- === 角度弧线 === -->
            <!-- ∠AOC 旋转角 70°，红，r=50，步骤1显示
                 O中心，从OA方向(-50°)到OC方向(-120°)，数学逆时针70°，SVG sweep-flag=1 -->
            <path id="scene1-angle-aoc" d="M 312 342 A 50 50 0 0 1 255 337" fill="none" stroke="#c62828" stroke-width="2.5" opacity="0" class="scene1-fade"/>
            <text id="scene1-text-aoc" x="170" y="290" font-size="14" fill="#c62828" opacity="0" class="scene1-fade">70°</text>

            <!-- ∠A 100°，蓝，r=25，A点处，步骤1显示
                 A中心，从AO方向(130°)到AB方向(30°)，数学顺时针100°，SVG sweep-flag=0 -->
            <path id="scene1-angle-a" d="M 354 292 A 25 25 0 0 0 392 286" fill="none" stroke="#1565c0" stroke-width="2.5" opacity="0" class="scene1-fade"/>
            <text id="scene1-text-a" x="330" y="250" font-size="14" fill="#1565c0" opacity="0" class="scene1-fade">100°</text>

            <!-- ∠D 50°，红，r=25，D点处，步骤1显示
                 D中心，从DC方向(140°)到DO方向(90°)，数学顺时针50°，SVG sweep-flag=0 -->
            <path id="scene1-angle-d" d="M 261 216 A 25 25 0 0 0 280 225" fill="none" stroke="#c62828" stroke-width="2.5" opacity="0" class="scene1-fade"/>
            <text id="scene1-text-d" x="310" y="195" font-size="14" fill="#c62828" opacity="0" class="scene1-fade">50°</text>

            <!-- ∠AOB 30°，绿，r=35，O点OB→OA，步骤3显示
                 O中心，从OB方向(-20°)到OA方向(-50°)，数学顺时针30°，SVG sweep-flag=0 -->
            <path id="scene1-angle-aob" d="M 313 368 A 35 35 0 0 0 303 353" fill="none" stroke="#2e7d32" stroke-width="2.5" opacity="0" class="scene1-fade"/>
            <text id="scene1-text-aob" x="460" y="430" font-size="14" fill="#2e7d32" opacity="0" class="scene1-fade">30°</text>

            <!-- ∠COD 30°，绿，r=35，O点OD→OC，步骤3显示
                 O中心，从OD方向(-90°)到OC方向(-120°)，数学顺时针30°，SVG sweep-flag=0 -->
            <path id="scene1-angle-cod" d="M 280 345 A 35 35 0 0 0 263 350" fill="none" stroke="#2e7d32" stroke-width="2.5" opacity="0" class="scene1-fade"/>
            <text id="scene1-text-cod" x="160" y="390" font-size="14" fill="#2e7d32" opacity="0" class="scene1-fade">30°</text>

            <!-- ∠BOD 70°，红，r=45，O点OB→OD，步骤4显示
                 O中心，从OB方向(-20°)到OD方向(-90°)，数学顺时针70°，SVG sweep-flag=0 -->
            <path id="scene1-angle-bod" d="M 322 365 A 45 45 0 0 0 280 335" fill="none" stroke="#c62828" stroke-width="2.5" opacity="0" class="scene1-fade"/>
            <text id="scene1-text-bod" x="460" y="280" font-size="14" fill="#c62828" opacity="0" class="scene1-fade">70°</text>

            <!-- ∠AOD 40°，绿，r=55，O点OA→OD，步骤4显示，加粗高亮
                 O中心，从OA方向(-50°)到OD方向(-90°)，数学顺时针40°，SVG sweep-flag=0 -->
            <path id="scene1-angle-aod" d="M 315 338 A 55 55 0 0 0 280 325" fill="none" stroke="#2e7d32" stroke-width="3" opacity="0" class="scene1-fade"/>
            <text id="scene1-text-aod" x="340" y="170" font-size="14" fill="#2e7d32" font-weight="bold" opacity="0" class="scene1-fade">40°</text>

            <!-- === 右侧说明文本 === -->
            <!-- 步骤1：已知条件（拆行避免截断） -->
            <text id="scene1-text-known1" x="500" y="220" font-size="14" fill="#000" opacity="0" class="scene1-fade">已知：旋转角 ∠AOC = 70°</text>
            <text id="scene1-text-known2" x="500" y="242" font-size="14" fill="#000" opacity="0" class="scene1-fade">∠A = 100°，∠D = 50°</text>

            <!-- 步骤2：全等式 -->
            <text id="scene1-text-cong" x="500" y="280" font-size="15" opacity="0" class="scene1-fade">
                <tspan fill="#1565c0">△OAB</tspan><tspan fill="#000"> ≌ </tspan><tspan fill="#c62828">△OCD</tspan>
            </text>
            <text id="scene1-text-b-eq-d" x="500" y="305" font-size="14" fill="#000" opacity="0" class="scene1-fade">∴ ∠B = ∠D = 50°</text>
            <text id="scene1-text-c-eq-a" x="500" y="328" font-size="14" fill="#000" opacity="0" class="scene1-fade">∠C = ∠A = 100°</text>

            <!-- 步骤3：计算∠AOB -->
            <text id="scene1-text-calc-aob" x="500" y="365" font-size="14" fill="#2e7d32" opacity="0" class="scene1-fade">∠AOB = 180° − 100° − 50° = 30°</text>

            <!-- 步骤4：推导∠AOD（拆行避免截断） -->
            <text id="scene1-text-calc-aod1" x="500" y="400" font-size="14" fill="#2e7d32" opacity="0" class="scene1-fade">∠AOD = ∠BOD − ∠AOB</text>
            <text id="scene1-text-calc-aod2" x="500" y="422" font-size="14" fill="#2e7d32" opacity="0" class="scene1-fade">= 70° − 30° = 40°</text>
            <text id="scene1-text-answer" x="500" y="450" font-size="18" fill="#2e7d32" font-weight="bold" opacity="0" class="scene1-fade">答案：C. 40°</text>
        </svg>

        <div id="scene1-controls">
            <span id="scene1-step-indicator">步骤 0/4</span>
            <button id="scene1-btn-prev">◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现：旋转全等三角形角度推导
        let currentStep = 0;
        const totalSteps = 4;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const indicator = document.getElementById('scene1-step-indicator');

        // 各步骤需要显示的元素ID列表
        const stepElements = {
            0: [], // 初始状态只显示基础图形
            1: ['scene1-angle-aoc','scene1-text-aoc','scene1-angle-a','scene1-text-a','scene1-angle-d','scene1-text-d','scene1-text-known1','scene1-text-known2'],
            2: ['scene1-fill-oab','scene1-fill-ocd','scene1-text-cong','scene1-text-b-eq-d','scene1-text-c-eq-a'],
            3: ['scene1-angle-aob','scene1-text-aob','scene1-angle-cod','scene1-text-cod','scene1-text-calc-aob'],
            4: ['scene1-angle-bod','scene1-text-bod','scene1-angle-aod','scene1-text-aod','scene1-text-calc-aod1','scene1-text-calc-aod2','scene1-text-answer']
        };

        function setOpacity(id, value) {
            const el = document.getElementById(id);
            if (el) el.setAttribute('opacity', value);
        }

        function renderStep() {
            // 更新指示器
            indicator.textContent = '步骤 ' + currentStep + '/' + totalSteps;
            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps);

            // 先全部隐藏
            for (let s = 1; s <= totalSteps; s++) {
                const ids = stepElements[s] || [];
                ids.forEach(id => setOpacity(id, 0));
            }

            // 再按当前步骤显示
            for (let s = 1; s <= currentStep; s++) {
                const ids = stepElements[s] || [];
                ids.forEach(id => setOpacity(id, 1));
            }
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                renderStep();
            }
        });

        // 初始渲染
        renderStep();
    })();
    </script>
</body>
</html>
