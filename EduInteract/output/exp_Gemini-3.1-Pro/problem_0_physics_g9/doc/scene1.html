<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .transition-all { transition: all 0.5s ease-in-out; }
        .fade { transition: opacity 0.5s ease-in-out; }
        
        /* SVG Text Styles */
        text { font-family: sans-serif; font-size: 16px; }
        .math-text { font-family: 'Times New Roman', Times, serif; font-style: italic; }
        .chart-text { font-size: 14px; text-anchor: middle; dominant-baseline: middle; }
        .label-text { text-anchor: middle; dominant-baseline: middle; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <defs>
                <marker id="scene1-arrow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0" />
                </marker>
                <marker id="scene1-arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828" />
                </marker>
            </defs>

            <!-- Chart Area (Step 2) -->
            <g id="scene1-chart-group" class="fade" style="opacity: 0;">
                <!-- Adult Torque -->
                <rect x="240" y="60" width="80" height="90" fill="#2e7d32" fill-opacity="0.3" stroke="#1565c0" stroke-width="2" />
                <text x="280" y="40" class="chart-text math-text">ΔM_{大人}</text>
                <text x="200" y="105" class="chart-text math-text">G_{大人}</text>
                <text x="280" y="175" class="chart-text math-text">ΔL</text>
                
                <!-- Child Torque -->
                <rect x="480" y="105" width="80" height="45" fill="#2e7d32" fill-opacity="0.3" stroke="#c62828" stroke-width="2" />
                <text x="520" y="85" class="chart-text math-text">ΔM_{小孩}</text>
                <text x="440" y="127" class="chart-text math-text">G_{小孩}</text>
                <text x="520" y="175" class="chart-text math-text">ΔL</text>
                
                <!-- Compare Symbol -->
                <text x="400" y="127" class="chart-text" style="font-size: 30px; font-weight: bold;">&gt;</text>
            </g>

            <!-- Conclusion Area (Step 3) -->
            <g id="scene1-conclusion-group" class="fade" style="opacity: 0;">
                <text x="400" y="215" class="label-text" style="font-size: 18px; font-weight: bold; fill: #333;">剩余力矩：小孩端 &gt; 大人端，小孩端下沉</text>
            </g>

            <!-- Lever System (Rotates in Step 3) -->
            <g id="scene1-lever-system" class="transition-all" style="transform-origin: 350px 300px;">
                <!-- Lever -->
                <line x1="100" y1="300" x2="700" y2="300" stroke="#000" stroke-width="6" />
                
                <!-- Delta L (Step 1) -->
                <g id="scene1-deltal-group" class="fade" style="opacity: 0;">
                    <line x1="200" y1="296" x2="280" y2="296" stroke="#2e7d32" stroke-width="4" />
                    <text x="240" y="240" class="label-text math-text" fill="#2e7d32">ΔL</text>
                    
                    <line x1="570" y1="296" x2="650" y2="296" stroke="#2e7d32" stroke-width="4" />
                    <text x="610" y="240" class="label-text math-text" fill="#2e7d32">ΔL</text>
                </g>

                <!-- Adult -->
                <g id="scene1-adult" class="transition-all" transform="translate(200, 300)">
                    <!-- Stick figure -->
                    <circle cx="0" cy="-60" r="10" fill="none" stroke="#1565c0" stroke-width="3" />
                    <line x1="0" y1="-50" x2="0" y2="-25" stroke="#1565c0" stroke-width="3" />
                    <line x1="0" y1="-40" x2="-15" y2="-30" stroke="#1565c0" stroke-width="3" />
                    <line x1="0" y1="-40" x2="15" y2="-30" stroke="#1565c0" stroke-width="3" />
                    <line x1="0" y1="-25" x2="-10" y2="0" stroke="#1565c0" stroke-width="3" />
                    <line x1="0" y1="-25" x2="10" y2="0" stroke="#1565c0" stroke-width="3" />
                </g>

                <!-- Child -->
                <g id="scene1-child" class="transition-all" transform="translate(650, 300)">
                    <!-- Stick figure -->
                    <circle cx="0" cy="-35" r="7" fill="none" stroke="#c62828" stroke-width="3" />
                    <line x1="0" y1="-28" x2="0" y2="-15" stroke="#c62828" stroke-width="3" />
                    <line x1="0" y1="-22" x2="-10" y2="-15" stroke="#c62828" stroke-width="3" />
                    <line x1="0" y1="-22" x2="10" y2="-15" stroke="#c62828" stroke-width="3" />
                    <line x1="0" y1="-15" x2="-7" y2="0" stroke="#c62828" stroke-width="3" />
                    <line x1="0" y1="-15" x2="7" y2="0" stroke="#c62828" stroke-width="3" />
                </g>
            </g>

            <!-- Fulcrum (Static) -->
            <polygon points="350,300 330,340 370,340" fill="#fff" stroke="#000" stroke-width="3" />
            <text x="350" y="360" class="label-text math-text">O</text>

            <!-- Gravity Arrows (Independent of lever rotation to stay vertical) -->
            <g id="scene1-gravity-adult-group" class="transition-all">
                <line id="scene1-gravity-adult-line" x1="180" y1="250" x2="180" y2="340" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-blue)" class="transition-all" />
                <text id="scene1-gravity-adult-text" x="145" y="365" class="label-text math-text" fill="#1565c0" class="transition-all">G_{大人}</text>
            </g>
            
            <g id="scene1-gravity-child-group" class="transition-all">
                <line id="scene1-gravity-child-line" x1="670" y1="275" x2="670" y2="340" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrow-red)" class="transition-all" />
                <text id="scene1-gravity-child-text" x="735" y="365" class="label-text math-text" fill="#c62828" class="transition-all">G_{小孩}</text>
            </g>

            <!-- Lever Arms (Step 0 & 1, fade out in Step 3) -->
            <g id="scene1-arms-group" class="fade" style="opacity: 1;">
                <!-- Adult Arm -->
                <line id="scene1-arm-adult-line" x1="200" y1="380" x2="350" y2="380" stroke="#1565c0" stroke-width="2" stroke-dasharray="5,5" class="transition-all" />
                <line id="scene1-arm-adult-tick1" x1="200" y1="375" x2="200" y2="385" stroke="#1565c0" stroke-width="2" class="transition-all" />
                <line x1="350" y1="375" x2="350" y2="385" stroke="#1565c0" stroke-width="2" />
                <text id="scene1-arm-adult-text" x="275" y="400" class="label-text math-text" fill="#1565c0" class="transition-all">L_{大人}</text>
                
                <!-- Child Arm -->
                <line id="scene1-arm-child-line" x1="350" y1="380" x2="650" y2="380" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5" class="transition-all" />
                <line x1="350" y1="375" x2="350" y2="385" stroke="#c62828" stroke-width="2" />
                <line id="scene1-arm-child-tick2" x1="650" y1="375" x2="650" y2="385" stroke="#c62828" stroke-width="2" class="transition-all" />
                <text id="scene1-arm-child-text" x="500" y="400" class="label-text math-text" fill="#c62828" class="transition-all">L_{小孩}</text>
            </g>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 3;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');

        const adult = document.getElementById('scene1-adult');
        const child = document.getElementById('scene1-child');
        const deltalGroup = document.getElementById('scene1-deltal-group');
        const chartGroup = document.getElementById('scene1-chart-group');
        const conclusionGroup = document.getElementById('scene1-conclusion-group');
        const leverSystem = document.getElementById('scene1-lever-system');
        const armsGroup = document.getElementById('scene1-arms-group');

        // Gravity elements
        const gravAdultLine = document.getElementById('scene1-gravity-adult-line');
        const gravAdultText = document.getElementById('scene1-gravity-adult-text');
        const gravChildLine = document.getElementById('scene1-gravity-child-line');
        const gravChildText = document.getElementById('scene1-gravity-child-text');

        // Arm elements
        const armAdultLine = document.getElementById('scene1-arm-adult-line');
        const armAdultTick1 = document.getElementById('scene1-arm-adult-tick1');
        const armAdultText = document.getElementById('scene1-arm-adult-text');
        const armChildLine = document.getElementById('scene1-arm-child-line');
        const armChildTick2 = document.getElementById('scene1-arm-child-tick2');
        const armChildText = document.getElementById('scene1-arm-child-text');

        function updateStep() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;

            // Step 0: Initial
            if (currentStep === 0) {
                adult.setAttribute('transform', 'translate(200, 300)');
                child.setAttribute('transform', 'translate(650, 300)');
                
                deltalGroup.style.opacity = '0';
                chartGroup.style.opacity = '0';
                conclusionGroup.style.opacity = '0';
                leverSystem.style.transform = 'rotate(0deg)';
                armsGroup.style.opacity = '1';

                // Gravity arrows
                gravAdultLine.setAttribute('x1', '180'); gravAdultLine.setAttribute('x2', '180');
                gravAdultLine.setAttribute('y1', '250'); gravAdultLine.setAttribute('y2', '340');
                gravAdultText.setAttribute('x', '145'); gravAdultText.setAttribute('y', '365');

                gravChildLine.setAttribute('x1', '670'); gravChildLine.setAttribute('x2', '670');
                gravChildLine.setAttribute('y1', '275'); gravChildLine.setAttribute('y2', '340');
                gravChildText.setAttribute('x', '735'); gravChildText.setAttribute('y', '365');

                // Arms
                armAdultLine.setAttribute('x1', '200');
                armAdultTick1.setAttribute('x1', '200'); armAdultTick1.setAttribute('x2', '200');
                armAdultText.setAttribute('x', '275');

                armChildLine.setAttribute('x2', '650');
                armChildTick2.setAttribute('x1', '650'); armChildTick2.setAttribute('x2', '650');
                armChildText.setAttribute('x', '500');
            }
            // Step 1: Move
            else if (currentStep === 1) {
                adult.setAttribute('transform', 'translate(280, 300)');
                child.setAttribute('transform', 'translate(570, 300)');
                
                deltalGroup.style.opacity = '1';
                chartGroup.style.opacity = '0';
                conclusionGroup.style.opacity = '0';
                leverSystem.style.transform = 'rotate(0deg)';
                armsGroup.style.opacity = '1';

                // Gravity arrows follow
                gravAdultLine.setAttribute('x1', '260'); gravAdultLine.setAttribute('x2', '260');
                gravAdultLine.setAttribute('y1', '250'); gravAdultLine.setAttribute('y2', '340');
                gravAdultText.setAttribute('x', '225'); gravAdultText.setAttribute('y', '365');

                gravChildLine.setAttribute('x1', '590'); gravChildLine.setAttribute('x2', '590');
                gravChildLine.setAttribute('y1', '275'); gravChildLine.setAttribute('y2', '340');
                gravChildText.setAttribute('x', '665'); gravChildText.setAttribute('y', '365');

                // Arms shorten
                armAdultLine.setAttribute('x1', '280');
                armAdultTick1.setAttribute('x1', '280'); armAdultTick1.setAttribute('x2', '280');
                armAdultText.setAttribute('x', '315');

                armChildLine.setAttribute('x2', '570');
                armChildTick2.setAttribute('x1', '570'); armChildTick2.setAttribute('x2', '570');
                armChildText.setAttribute('x', '460');
            }
            // Step 2: Chart
            else if (currentStep === 2) {
                adult.setAttribute('transform', 'translate(280, 300)');
                child.setAttribute('transform', 'translate(570, 300)');
                
                deltalGroup.style.opacity = '1';
                chartGroup.style.opacity = '1';
                conclusionGroup.style.opacity = '0';
                leverSystem.style.transform = 'rotate(0deg)';
                armsGroup.style.opacity = '1';

                // Gravity arrows same as step 1
                gravAdultLine.setAttribute('x1', '260'); gravAdultLine.setAttribute('x2', '260');
                gravAdultLine.setAttribute('y1', '250'); gravAdultLine.setAttribute('y2', '340');
                gravAdultText.setAttribute('x', '225'); gravAdultText.setAttribute('y', '365');

                gravChildLine.setAttribute('x1', '590'); gravChildLine.setAttribute('x2', '590');
                gravChildLine.setAttribute('y1', '275'); gravChildLine.setAttribute('y2', '340');
                gravChildText.setAttribute('x', '665'); gravChildText.setAttribute('y', '365');
            }
            // Step 3: Rotate
            else if (currentStep === 3) {
                chartGroup.style.opacity = '1';
                conclusionGroup.style.opacity = '1';
                leverSystem.style.transform = 'rotate(8deg)';
                armsGroup.style.opacity = '0';

                // Calculate new positions for gravity arrows
                gravAdultLine.setAttribute('x1', '260.9'); gravAdultLine.setAttribute('x2', '260.9');
                gravAdultLine.setAttribute('y1', '237.5'); gravAdultLine.setAttribute('y2', '327.5');
                gravAdultText.setAttribute('x', '225.9'); gravAdultText.setAttribute('y', '365');

                gravChildLine.setAttribute('x1', '587.7'); gravChildLine.setAttribute('x2', '587.7');
                gravChildLine.setAttribute('y1', '308.4'); gravChildLine.setAttribute('y2', '353.4');
                gravChildText.setAttribute('x', '662.7'); gravChildText.setAttribute('y', '380');
            }
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateStep();
            }
        });

        // Initialize
        updateStep();
    })();
    </script>
</body>
</html>
