<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* 动画过渡 */
        #scene1-top-right {
            transform-origin: 250px 70px;
            transition: transform 0.8s ease-in-out;
        }
        .fade {
            transition: opacity 0.5s ease-in-out;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <!-- SVG 图示区：固定 800×500px -->
        <svg width="800" height="500" viewBox="0 0 800 500">
            <!-- 折痕 -->
            <line x1="250" y1="70" x2="550" y2="370" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" />
            
            <!-- 左下三角形 -->
            <polygon points="250,70 250,370 550,370" fill="#1565c0" fill-opacity="0.2" stroke="#000000" stroke-width="2" />
            
            <!-- 左下洞 -->
            <g id="scene1-holes-bottom-left" class="fade" opacity="0">
                <circle cx="265" cy="105" r="10" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
                <circle cx="515" cy="355" r="10" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
                <circle cx="275" cy="345" r="10" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
            </g>

            <!-- 右上三角形及其洞 (包裹在 g 中以实现翻折) -->
            <g id="scene1-top-right">
                <polygon points="250,70 550,70 550,370" fill="#1565c0" fill-opacity="0.2" stroke="#000000" stroke-width="2" />
                <g id="scene1-holes-top-right" class="fade" opacity="0">
                    <circle cx="285" cy="85" r="10" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
                    <circle cx="535" cy="335" r="10" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
                    <circle cx="525" cy="95" r="10" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
                </g>
            </g>

            <!-- 辅助线和直角标记 -->
            <g id="scene1-aux-lines" class="fade" opacity="0">
                <!-- 左上辅助线 -->
                <line x1="272.1" y1="97.9" x2="277.9" y2="92.1" stroke="#c62828" stroke-width="1.5" stroke-dasharray="4,4" />
                <!-- 右下辅助线 -->
                <line x1="522.1" y1="347.9" x2="527.9" y2="342.1" stroke="#c62828" stroke-width="1.5" stroke-dasharray="4,4" />
                
                <!-- 左上直角标记 -->
                <polyline points="280.7,100.7 286.3,95 280.7,89.3" fill="none" stroke="#c62828" stroke-width="2" />
                <!-- 右下直角标记 -->
                <polyline points="519.3,339.3 513.7,345 519.3,350.7" fill="none" stroke="#c62828" stroke-width="2" />
            </g>
        </svg>
        
        <!-- 控件栏叠在 SVG 底部 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 4;
        
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        
        const topRightGroup = document.getElementById('scene1-top-right');
        const holesBottomLeft = document.getElementById('scene1-holes-bottom-left');
        const holesTopRight = document.getElementById('scene1-holes-top-right');
        const auxLines = document.getElementById('scene1-aux-lines');
        
        function updateState() {
            // 按钮状态
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
            
            // 步骤0：初始状态，无洞，无辅助线，未折叠
            if (currentStep === 0) {
                topRightGroup.style.transform = 'rotate3d(1, 1, 0, 0deg)';
                holesBottomLeft.setAttribute('opacity', '0');
                holesTopRight.setAttribute('opacity', '0');
                auxLines.setAttribute('opacity', '0');
            }
            // 步骤1：折叠
            else if (currentStep === 1) {
                topRightGroup.style.transform = 'rotate3d(1, -1, 0, 180deg)'; // 沿对角线翻折
                holesBottomLeft.setAttribute('opacity', '0');
                holesTopRight.setAttribute('opacity', '0');
                auxLines.setAttribute('opacity', '0');
            }
            // 步骤2：挖洞
            else if (currentStep === 2) {
                topRightGroup.style.transform = 'rotate3d(1, -1, 0, 180deg)';
                holesBottomLeft.setAttribute('opacity', '1');
                holesTopRight.setAttribute('opacity', '1');
                auxLines.setAttribute('opacity', '0');
            }
            // 步骤3：展开
            else if (currentStep === 3) {
                topRightGroup.style.transform = 'rotate3d(1, -1, 0, 0deg)';
                holesBottomLeft.setAttribute('opacity', '1');
                holesTopRight.setAttribute('opacity', '1');
                auxLines.setAttribute('opacity', '0');
            }
            // 步骤4：对称分析
            else if (currentStep === 4) {
                topRightGroup.style.transform = 'rotate3d(1, -1, 0, 0deg)';
                holesBottomLeft.setAttribute('opacity', '1');
                holesTopRight.setAttribute('opacity', '1');
                auxLines.setAttribute('opacity', '1');
            }
        }
        
        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateState();
            }
        });
        
        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateState();
            }
        });
        
        // 初始化
        updateState();
    })();
    </script>
</body>
</html>
