<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button:hover:not(:disabled) { background: #e9e9e9; }
        
        .scene2-element { transition: opacity 0.5s ease; }
        .scene2-hidden { opacity: 0; pointer-events: none; }
        
        #scene2-triangle-acd-rot {
            transform-origin: 400px 130px;
            transition: transform 1s ease-in-out;
        }
        .scene2-rotated {
            transform: rotate(90deg);
        }
        
        .scene2-text { font-size: 16px; font-style: italic; font-family: "Times New Roman", Times, serif; user-select: none; }
        .scene2-conclusion { font-size: 18px; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" id="scene2-svg">
            <defs>
                <marker id="scene2-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#888888" />
                </marker>
            </defs>

            <!-- Base Lines -->
            <g stroke="black" stroke-width="2" fill="none">
                <path d="M 400 130 L 200 330 L 600 330 Z" /> <!-- ABC -->
                <line x1="400" y1="130" x2="500" y2="330" /> <!-- AD -->
                <line x1="400" y1="130" x2="333.3" y2="330" /> <!-- AE -->
                <line x1="400" y1="130" x2="200" y2="230" /> <!-- AF -->
                <line x1="200" y1="230" x2="333.3" y2="330" /> <!-- FE -->
                <line x1="200" y1="230" x2="200" y2="330" /> <!-- FB -->
            </g>

            <!-- Step 1: Right angles and arcs -->
            <g id="scene2-step1-elements" class="scene2-element scene2-hidden">
                <!-- ∠BAC = 90 -->
                <path d="M 380 150 L 400 170 L 420 150" fill="none" stroke="black" stroke-width="2" />
                <!-- ∠DAF = 90 -->
                <path d="M 380 140 L 390 160 L 410 150" fill="none" stroke="black" stroke-width="2" /> <!-- Need to calculate exact points later -->
                
                <!-- ∠BAF red arc -->
                <path d="M 360 170 A 50 50 0 0 1 355 152.5" fill="none" stroke="#c62828" stroke-width="2" />
                <!-- ∠CAD blue arc -->
                <path d="M 440 170 A 50 50 0 0 0 422.3 219.4" fill="none" stroke="#1565c0" stroke-width="2" />
            </g>

            <!-- Step 2: Trajectories and Rotating Triangle -->
            <g id="scene2-step2-trajectories" class="scene2-element scene2-hidden">
                <!-- C to B arc -->
                <path d="M 600 330 A 282.8 282.8 0 0 1 200 330" fill="none" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#scene2-arrow)" />
                <!-- D to F arc -->
                <path d="M 500 330 A 223.6 223.6 0 0 1 200 230" fill="none" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#scene2-arrow)" />
            </g>

            <g id="scene2-triangle-acd-rot" class="scene2-element scene2-hidden">
                <polygon points="400,130 600,330 500,330" fill="#1565c0" opacity="0.2" />
                <polygon points="400,130 600,330 500,330" fill="none" stroke="#1565c0" stroke-width="2" />
            </g>

            <!-- Step 3: Highlight ABF, Tick marks, 45 deg -->
            <g id="scene2-step3-elements" class="scene2-element scene2-hidden">
                <polygon points="400,130 200,330 200,230" fill="#c62828" opacity="0.2" />
                <!-- Tick marks on BF and CD -->
                <line x1="195" y1="280" x2="205" y2="280" stroke="black" stroke-width="2" />
                <line x1="550" y1="325" x2="550" y2="335" stroke="black" stroke-width="2" />
                
                <!-- 45 deg marks -->
                <path d="M 570 330 A 30 30 0 0 0 578.8 308.8" fill="none" stroke="black" stroke-width="1" />
                <text x="600" y="310" font-size="12">45°</text>
                
                <path d="M 200 300 A 30 30 0 0 1 221.2 308.8" fill="none" stroke="black" stroke-width="1" />
                <text x="150" y="315" font-size="12">45°</text>
            </g>

            <!-- Step 4: Highlight EBF, Conclusion -->
            <g id="scene2-step4-elements" class="scene2-element scene2-hidden">
                <!-- ∠EBF right angle -->
                <path d="M 200 310 L 220 310 L 220 330" fill="none" stroke="#2e7d32" stroke-width="2" />
                <polygon points="200,330 333.3,330 200,230" fill="#2e7d32" opacity="0.2" />
            </g>

            <!-- Labels -->
            <text x="395" y="120" class="scene2-text">A</text>
            <text x="185" y="360" class="scene2-text">B</text>
            <text x="610" y="360" class="scene2-text">C</text>
            <text x="495" y="360" class="scene2-text">D</text>
            <text x="328" y="360" class="scene2-text">E</text>
            <text x="185" y="235" class="scene2-text">F</text>
        </svg>

        <!-- Conclusion Text (HTML overlay for MathJax) -->
        <div id="scene2-conclusion-text" class="scene2-element scene2-hidden" style="position: absolute; left: 550px; top: 150px; width: 220px;">
            <div class="scene2-conclusion">
                <p>\( 	riangle ABF \cong 	riangle ACD \)</p>
                <p>\( BF = CD \)</p>
                <p>\( \angle ABF = \angle C = 45^\circ \)</p>
                <p>\( \angle EBF = 45^\circ + 45^\circ = 90^\circ \)</p>
                <p>\( BE^2 + BF^2 = EF^2 \)</p>
                <p>\( 	herefore BE^2 + CD^2 = EF^2 \)</p>
            </div>
        </div>

        <div id="scene2-controls">
            <button id="scene2-btn-prev" disabled>◀ 上一步</button>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 4;
        
        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        
        const step1Elements = document.getElementById('scene2-step1-elements');
        const step2Trajectories = document.getElementById('scene2-step2-trajectories');
        const triangleRot = document.getElementById('scene2-triangle-acd-rot');
        const step3Elements = document.getElementById('scene2-step3-elements');
        const step4Elements = document.getElementById('scene2-step4-elements');
        const conclusionText = document.getElementById('scene2-conclusion-text');
        
        function updateState() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
            
            // Step 1
            if (currentStep >= 1) {
                step1Elements.classList.remove('scene2-hidden');
            } else {
                step1Elements.classList.add('scene2-hidden');
            }
            
            // Step 2
            if (currentStep >= 2) {
                step2Trajectories.classList.remove('scene2-hidden');
                triangleRot.classList.remove('scene2-hidden');
                // Trigger rotation after a tiny delay if moving forward
                setTimeout(() => {
                    triangleRot.classList.add('scene2-rotated');
                }, 50);
            } else {
                step2Trajectories.classList.add('scene2-hidden');
                triangleRot.classList.remove('scene2-rotated');
                triangleRot.classList.add('scene2-hidden');
            }
            
            // Step 3
            if (currentStep >= 3) {
                step3Elements.classList.remove('scene2-hidden');
            } else {
                step3Elements.classList.add('scene2-hidden');
            }
            
            // Step 4
            if (currentStep >= 4) {
                step4Elements.classList.remove('scene2-hidden');
                conclusionText.classList.remove('scene2-hidden');
            } else {
                step4Elements.classList.add('scene2-hidden');
                conclusionText.classList.add('scene2-hidden');
            }
        }
        
        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateState();
            }
        });
        
        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateState();
            }
        });
        
        // Initial state
        updateState();
    })();
    </script>
</body>
</html>
