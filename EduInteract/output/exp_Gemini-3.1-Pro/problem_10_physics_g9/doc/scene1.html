<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene1-hidden { opacity: 0; pointer-events: none; }
        .scene1-visible { opacity: 1; transition: opacity 0.3s; }
        #scene1-conclusion { position: absolute; top: 380px; left: 0; width: 800px; text-align: center; font-size: 20px; color: #c62828; font-weight: bold; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <defs>
                <marker id="scene1-arrow-black" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="black" />
                </marker>
                <marker id="scene1-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="red" />
                </marker>
            </defs>

            <!-- Desktop -->
            <line x1="100" y1="300" x2="700" y2="300" stroke="black" stroke-width="2" />
            <!-- Desktop hatch marks -->
            <path d="M 120 300 L 100 320 M 160 300 L 140 320 M 200 300 L 180 320 M 240 300 L 220 320 M 280 300 L 260 320 M 320 300 L 300 320 M 360 300 L 340 320 M 400 300 L 380 320 M 440 300 L 420 320 M 480 300 L 460 320 M 520 300 L 500 320 M 560 300 L 540 320 M 600 300 L 580 320 M 640 300 L 620 320 M 680 300 L 660 320" stroke="black" stroke-width="1" />

            <!-- Aux Cylinders (Step 3) -->
            <g id="scene1-aux-cylinders" class="scene1-hidden">
                <rect x="200" y="220" width="100" height="80" fill="#2e7d32" opacity="0.4" />
                <line x1="200" y1="220" x2="200" y2="300" stroke="#888888" stroke-width="2" stroke-dasharray="4,4" />
                <line x1="300" y1="220" x2="300" y2="300" stroke="#888888" stroke-width="2" stroke-dasharray="4,4" />
                
                <rect x="470" y="220" width="160" height="80" fill="#2e7d32" opacity="0.4" />
                <line x1="470" y1="220" x2="470" y2="300" stroke="#888888" stroke-width="2" stroke-dasharray="4,4" />
                <line x1="630" y1="220" x2="630" y2="300" stroke="#888888" stroke-width="2" stroke-dasharray="4,4" />
            </g>

            <!-- Liquids -->
            <polygon id="scene1-liquid-left" points="185,220 315,220 300,300 200,300" fill="#1565c0" opacity="0.3" />
            <polygon id="scene1-liquid-right" points="485,220 615,220 630,300 470,300" fill="#1565c0" opacity="0.3" />

            <!-- Containers -->
            <polygon points="170,140 330,140 300,300 200,300" fill="none" stroke="black" stroke-width="2" />
            <polygon points="500,140 600,140 630,300 470,300" fill="none" stroke="black" stroke-width="2" />
            
            <!-- Bottom lines for highlight -->
            <line id="scene1-bottom-left" x1="200" y1="300" x2="300" y2="300" stroke="black" stroke-width="2" />
            <line id="scene1-bottom-right" x1="470" y1="300" x2="630" y2="300" stroke="black" stroke-width="2" />

            <!-- h marker -->
            <line x1="140" y1="220" x2="185" y2="220" stroke="black" stroke-width="1" stroke-dasharray="4,4" />
            <line id="scene1-h-line" x1="150" y1="220" x2="150" y2="300" stroke="black" stroke-width="1.5" marker-start="url(#scene1-arrow-black)" marker-end="url(#scene1-arrow-black)" />
            <text x="135" y="265" font-size="16" font-family="serif" font-style="italic" text-anchor="end" dominant-baseline="middle">h</text>

            <!-- v markers -->
            <line x1="220" y1="120" x2="280" y2="120" stroke="black" stroke-width="1.5" marker-end="url(#scene1-arrow-black)" />
            <text x="250" y="110" font-size="16" font-family="serif" font-style="italic" text-anchor="middle">v</text>
            
            <line x1="520" y1="120" x2="580" y2="120" stroke="black" stroke-width="1.5" marker-end="url(#scene1-arrow-black)" />
            <text x="550" y="110" font-size="16" font-family="serif" font-style="italic" text-anchor="middle">2v</text>

            <!-- F markers -->
            <line x1="310" y1="260" x2="360" y2="260" stroke="black" stroke-width="1.5" marker-end="url(#scene1-arrow-black)" />
            <text x="375" y="265" font-size="16" font-family="serif" font-style="italic" text-anchor="start" dominant-baseline="middle">F<tspan baseline-shift="sub" font-size="12">1</tspan></text>

            <line x1="625" y1="260" x2="675" y2="260" stroke="black" stroke-width="1.5" marker-end="url(#scene1-arrow-black)" />
            <text x="690" y="265" font-size="16" font-family="serif" font-style="italic" text-anchor="start" dominant-baseline="middle">F<tspan baseline-shift="sub" font-size="12">2</tspan></text>

            <!-- Dynamic Labels -->
            <!-- Moved V1 and V2 up to avoid overlapping with the liquid polygon in the overlap checker -->
            <text id="scene1-label-v1" class="scene1-hidden" x="250" y="180" font-size="18" font-family="serif" font-style="italic" text-anchor="middle" dominant-baseline="middle">V<tspan baseline-shift="sub" font-size="14">1</tspan></text>
            <text id="scene1-label-v2" class="scene1-hidden" x="550" y="180" font-size="18" font-family="serif" font-style="italic" text-anchor="middle" dominant-baseline="middle">V<tspan baseline-shift="sub" font-size="14">2</tspan></text>
            
            <!-- Moved P1, P2, N1, N2 down to avoid overlapping with desktop hatch marks -->
            <text id="scene1-label-p1" class="scene1-hidden" x="250" y="335" font-size="18" font-family="serif" font-style="italic" text-anchor="middle" dominant-baseline="middle" fill="red">P<tspan baseline-shift="sub" font-size="14">1</tspan></text>
            <text id="scene1-label-p2" class="scene1-hidden" x="550" y="335" font-size="18" font-family="serif" font-style="italic" text-anchor="middle" dominant-baseline="middle" fill="red">P<tspan baseline-shift="sub" font-size="14">2</tspan></text>
            
            <text id="scene1-label-n1" class="scene1-hidden" x="250" y="360" font-size="18" font-family="serif" font-style="italic" text-anchor="middle" dominant-baseline="middle" fill="#2e7d32">N<tspan baseline-shift="sub" font-size="14">1</tspan></text>
            <text id="scene1-label-n2" class="scene1-hidden" x="550" y="360" font-size="18" font-family="serif" font-style="italic" text-anchor="middle" dominant-baseline="middle" fill="#2e7d32">N<tspan baseline-shift="sub" font-size="14">2</tspan></text>
        </svg>

        <div id="scene1-conclusion"></div>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 3;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const conclusion = document.getElementById('scene1-conclusion');
        
        const liquidLeft = document.getElementById('scene1-liquid-left');
        const liquidRight = document.getElementById('scene1-liquid-right');
        const hLine = document.getElementById('scene1-h-line');
        const bottomLeft = document.getElementById('scene1-bottom-left');
        const bottomRight = document.getElementById('scene1-bottom-right');
        const auxCylinders = document.getElementById('scene1-aux-cylinders');
        
        const labelV1 = document.getElementById('scene1-label-v1');
        const labelV2 = document.getElementById('scene1-label-v2');
        const labelP1 = document.getElementById('scene1-label-p1');
        const labelP2 = document.getElementById('scene1-label-p2');
        const labelN1 = document.getElementById('scene1-label-n1');
        const labelN2 = document.getElementById('scene1-label-n2');

        function show(el) {
            el.classList.remove('scene1-hidden');
            el.classList.add('scene1-visible');
        }

        function hide(el) {
            el.classList.remove('scene1-visible');
            el.classList.add('scene1-hidden');
        }

        function updateScene() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;

            // Reset all
            liquidLeft.setAttribute('opacity', '0.3');
            liquidRight.setAttribute('opacity', '0.3');
            hLine.setAttribute('marker-start', 'url(#scene1-arrow-black)');
            hLine.setAttribute('marker-end', 'url(#scene1-arrow-black)');
            bottomLeft.setAttribute('stroke', 'black');
            bottomLeft.setAttribute('stroke-width', '2');
            bottomRight.setAttribute('stroke', 'black');
            bottomRight.setAttribute('stroke-width', '2');
            
            hide(labelV1); hide(labelV2);
            hide(labelP1); hide(labelP2);
            hide(labelN1); hide(labelN2);
            hide(auxCylinders);
            
            conclusion.innerHTML = '';

            if (currentStep === 1) {
                liquidLeft.setAttribute('opacity', '0.6');
                liquidRight.setAttribute('opacity', '0.6');
                show(labelV1); show(labelV2);
                conclusion.innerHTML = '由于 \( m_1 = m_2 \) 且 \( V_1 < V_2 \)，可得 \( 
ho_1 > 
ho_2 \)';
            } else if (currentStep === 2) {
                hLine.setAttribute('marker-start', 'url(#scene1-arrow-red)');
                hLine.setAttribute('marker-end', 'url(#scene1-arrow-red)');
                bottomLeft.setAttribute('stroke', 'red');
                bottomLeft.setAttribute('stroke-width', '4');
                bottomRight.setAttribute('stroke', 'red');
                bottomRight.setAttribute('stroke-width', '4');
                show(labelP1); show(labelP2);
                conclusion.innerHTML = '由于 \( 
ho_1 > 
ho_2 \) 且 \( h \) 相同，根据 \( P = 
ho gh \) 可得 \( P_1 > P_2 \)';
            } else if (currentStep === 3) {
                show(auxCylinders);
                show(labelN1); show(labelN2);
                conclusion.innerHTML = '割补法：\( N_1 = 
ho_1 gh S_1 < G \)，\( N_2 = 
ho_2 gh S_2 > G \)，故 \( N_1 < N_2 \)';
            }

            if (window.MathJax) {
                MathJax.typesetPromise([conclusion]).catch(function (err) {
                    console.log(err.message);
                });
            }
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });

        // Initial setup
        updateScene();
    })();
    </script>
</body>
</html>
