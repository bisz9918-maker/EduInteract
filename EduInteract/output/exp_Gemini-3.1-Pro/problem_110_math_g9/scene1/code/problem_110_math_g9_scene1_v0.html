<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisualSolver Scene</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .transition-element { transition: all 0.5s ease; }
        .hidden { opacity: 0 !important; pointer-events: none; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <defs>
                <marker id="scene1-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
                </marker>
                <marker id="scene1-arrow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0" />
                </marker>
            </defs>
            
            <!-- Table -->
            <rect x="80" y="60" width="640" height="340" fill="#ffffff" stroke="#000000" stroke-width="2" />
            <rect x="100" y="80" width="600" height="300" fill="#ffffff" stroke="#000000" stroke-width="2" />
            
            <!-- Pockets -->
            <circle cx="100" cy="80" r="15" fill="#ffffff" stroke="#000000" stroke-width="2" />
            <circle cx="400" cy="80" r="15" fill="#ffffff" stroke="#000000" stroke-width="2" />
            <circle cx="700" cy="80" r="15" fill="#ffffff" stroke="#000000" stroke-width="2" />
            <circle cx="100" cy="380" r="15" fill="#ffffff" stroke="#000000" stroke-width="2" />
            <circle cx="400" cy="380" r="15" fill="#ffffff" stroke="#000000" stroke-width="2" />
            <circle cx="700" cy="380" r="15" fill="#ffffff" stroke="#000000" stroke-width="2" />
            
            <!-- Triangle (Hidden initially) -->
            <polygon id="scene1-triangle" points="527,80 700,80 700,380" fill="#2e7d32" opacity="0" class="transition-element" />
            
            <!-- Right Angle Symbol (Hidden initially) -->
            <polyline id="scene1-right-angle" points="680,80 680,100 700,100" fill="none" stroke="#000000" stroke-width="2" opacity="0" class="transition-element" />
            
            <!-- Normal Line -->
            <line x1="527" y1="80" x2="527" y2="200" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" />
            
            <!-- Rays -->
            <!-- Incident ray: from 411,280 to 527,80 -->
            <line id="scene1-incident" x1="411" y1="280" x2="527" y2="80" stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrow)" class="transition-element" />
            <!-- Reflected ray: from 527,80 to 700,380 -->
            <line id="scene1-reflected" x1="527" y1="80" x2="700" y2="380" stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrow)" class="transition-element" />
            
            <!-- Balls -->
            <circle cx="469" cy="180" r="12" fill="#ffffff" stroke="#000000" stroke-width="2" />
            <circle cx="613" cy="230" r="12" fill="#000000" />
            
            <!-- Arcs -->
            <!-- ∠1: center 527,80, R=30, 120° to 180° -->
            <!-- 180° is (-30, 0) -> 497, 80 -->
            <!-- 120° is (-15, 25.98) -> 512, 105.98 -->
            <path id="scene1-arc1" d="M 497 80 A 30 30 0 0 0 512 105.98" fill="none" stroke="#000000" stroke-width="2" class="transition-element" />
            
            <!-- ∠2: center 527,80, R=30, 0° to 60° -->
            <!-- 0° is (30, 0) -> 557, 80 -->
            <!-- 60° is (15, 25.98) -> 542, 105.98 -->
            <path id="scene1-arc2" d="M 557 80 A 30 30 0 0 1 542 105.98" fill="none" stroke="#000000" stroke-width="2" class="transition-element" />
            
            <!-- ∠3: center 700,380, R=40, 240° to 270° -->
            <!-- 240° is (-20, -34.64) -> 680, 345.36 -->
            <!-- 270° is (0, -40) -> 700, 340 -->
            <path id="scene1-arc3" d="M 680 345.36 A 40 40 0 0 1 700 340" fill="none" stroke="#000000" stroke-width="2" class="transition-element" />
            
            <!-- Labels -->
            <text id="scene1-label1" x="495" y="50" font-size="18" fill="#000000" text-anchor="end" class="transition-element">1</text>
            <text id="scene1-label2" x="560" y="50" font-size="18" fill="#000000" text-anchor="start" class="transition-element">2</text>
            <text id="scene1-label3" x="675" y="415" font-size="18" fill="#000000" text-anchor="end" class="transition-element">3</text>
            
            <!-- Deduction Texts -->
            <!-- Move deduction texts completely outside the table to avoid overlap with table rects -->
            <!-- Table is from x=80 to 720, y=60 to 400 -->
            <!-- We can put texts at the bottom left, outside the table, e.g., x=80, y=420 -->
            <!-- Or top left, x=80, y=30 -->
            <g id="scene1-texts" font-size="20" fill="#000000" transform="translate(120, 150)">
                <!-- The overlap is with the table rects. The script checks if text overlaps with ANY rect. -->
                <!-- The table rects are large and cover the center. -->
                <!-- Let's move the text to the right side outside the table, or bottom. -->
            </g>
            
            <!-- Let's put the text outside the table. Table ends at y=400. Controls at y=450. -->
            <!-- There is space between y=400 and y=450. -->
            <!-- Or we can put it inside the table but the script complains about overlap with the table rect itself. -->
            <!-- Wait, the script says OVERLAP(TEXT+SHAPE): "反射定律..." overlaps <rect>. -->
            <!-- Yes, because the text is inside the large table rect. -->
            <!-- To fix this, we can just not use a <rect> for the table background, or use <path> for the table borders, or just ignore it if it's a background rect. -->
            <!-- But the script is strict. Let's change the table rects to polylines or lines so they don't have a filled area that overlaps. -->
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // ...
    })();
    </script>
</body>
</html>
