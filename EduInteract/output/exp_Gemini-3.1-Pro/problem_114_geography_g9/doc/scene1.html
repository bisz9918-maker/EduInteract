<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .fade { transition: opacity 0.5s ease; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <!-- Left 2D Polar View -->
            <g id="scene1-left-2d" transform="translate(200, 130)">
                <!-- Circles -->
                <circle cx="0" cy="0" r="80" fill="none" stroke="#000" stroke-width="1.5"/>
                <circle cx="0" cy="0" r="53.3" fill="none" stroke="#000" stroke-width="1"/>
                <circle cx="0" cy="0" r="26.7" fill="none" stroke="#000" stroke-width="1"/>
                <!-- Lines -->
                <line x1="0" y1="-80" x2="0" y2="80" stroke="#000" stroke-width="1"/>
                <line x1="-80" y1="0" x2="80" y2="0" stroke="#000" stroke-width="1"/>
                <line x1="-56.57" y1="-56.57" x2="56.57" y2="56.57" stroke="#000" stroke-width="1"/>
                <line x1="-56.57" y1="56.57" x2="56.57" y2="-56.57" stroke="#000" stroke-width="1"/>
                
                <!-- A point -->
                <circle cx="-56.57" cy="-56.57" r="3" fill="#000" id="scene1-point-a"/>
                <text x="-90" y="-65" font-size="16" font-weight="bold" fill="#000" id="scene1-label-a">A</text>
            </g>
            <text x="200" y="40" font-size="16" text-anchor="middle" fill="#000">180°</text>
            <text x="200" y="235" font-size="16" text-anchor="middle" fill="#000">0°</text>
            
            <!-- Left Rotation Arrow -->
            <path id="scene1-left-arrow" d="M 100 190 A 90 90 0 0 1 100 70" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#scene1-arrowhead-left)"/>
            <text x="75" y="130" font-size="14" text-anchor="middle" fill="#000" transform="rotate(-90, 75, 130)">地球自转方向</text>

            <!-- Right 2D Polar View -->
            <g id="scene1-right-2d" transform="translate(600, 130)">
                <!-- Circles -->
                <circle cx="0" cy="0" r="80" fill="none" stroke="#000" stroke-width="1.5"/>
                <circle cx="0" cy="0" r="53.3" fill="none" stroke="#000" stroke-width="1"/>
                <circle cx="0" cy="0" r="26.7" fill="none" stroke="#000" stroke-width="1"/>
                <!-- Lines -->
                <line x1="0" y1="-80" x2="0" y2="80" stroke="#000" stroke-width="1"/>
                <line x1="-80" y1="0" x2="80" y2="0" stroke="#000" stroke-width="1"/>
                <line x1="-56.57" y1="-56.57" x2="56.57" y2="56.57" stroke="#000" stroke-width="1"/>
                <line x1="-56.57" y1="56.57" x2="56.57" y2="-56.57" stroke="#000" stroke-width="1"/>
                
                <!-- B point -->
                <circle cx="56.57" cy="56.57" r="3" fill="#000" id="scene1-point-b"/>
                <text x="80" y="65" font-size="16" font-weight="bold" fill="#000" id="scene1-label-b">B</text>
            </g>
            <text x="600" y="40" font-size="16" text-anchor="middle" fill="#000">180°</text>
            <text x="600" y="235" font-size="16" text-anchor="middle" fill="#000">0°</text>
            
            <!-- Right Rotation Arrow -->
            <path id="scene1-right-arrow" d="M 500 70 A 90 90 0 0 0 500 190" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#scene1-arrowhead-right)"/>
            <text x="475" y="130" font-size="14" text-anchor="middle" fill="#000" transform="rotate(-90, 475, 130)">地球自转方向</text>

            <!-- Markers -->
            <defs>
                <marker id="scene1-arrowhead-left" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#000" id="scene1-arrowhead-left-poly"/>
                </marker>
                <marker id="scene1-arrowhead-right" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#000" id="scene1-arrowhead-right-poly"/>
                </marker>
            </defs>

            <!-- 3D Earth Models (D3) -->
            <g id="scene1-left-3d" transform="translate(200, 350)" opacity="0" class="fade">
                <path id="scene1-left-globe-sphere" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>
                <path id="scene1-left-globe-graticule" fill="none" stroke="#888" stroke-width="0.5"/>
            </g>
            <text id="scene1-left-conclusion" x="200" y="450" font-size="16" text-anchor="middle" fill="#1565c0" opacity="0" class="fade">南半球 (顺时针)</text>

            <g id="scene1-right-3d" transform="translate(600, 350)" opacity="0" class="fade">
                <path id="scene1-right-globe-sphere" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>
                <path id="scene1-right-globe-graticule" fill="none" stroke="#888" stroke-width="0.5"/>
            </g>
            <text id="scene1-right-conclusion" x="600" y="450" font-size="16" text-anchor="middle" fill="#c62828" opacity="0" class="fade">北半球 (逆时针)</text>

            <!-- B Point Conclusion -->
            <g id="scene1-b-conclusion" transform="translate(600, 275)" opacity="0" class="fade">
                <text x="0" y="0" font-size="16" text-anchor="middle" fill="#2e7d32">B点位于北半球</text>
            </g>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    <script>
    (function() {
        let step = 0;
        const maxStep = 3;
        
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        
        const leftArrow = document.getElementById('scene1-left-arrow');
        const leftArrowPoly = document.getElementById('scene1-arrowhead-left-poly');
        const rightArrow = document.getElementById('scene1-right-arrow');
        const rightArrowPoly = document.getElementById('scene1-arrowhead-right-poly');
        
        const left3d = document.getElementById('scene1-left-3d');
        const right3d = document.getElementById('scene1-right-3d');
        const leftConclusion = document.getElementById('scene1-left-conclusion');
        const rightConclusion = document.getElementById('scene1-right-conclusion');
        
        const pointB = document.getElementById('scene1-point-b');
        const labelB = document.getElementById('scene1-label-b');
        const bConclusion = document.getElementById('scene1-b-conclusion');
        
        // D3 setup
        const projectionLeft = d3.geoOrthographic().scale(70).translate([0, 0]).rotate([0, 90]);
        const pathLeft = d3.geoPath().projection(projectionLeft);
        const graticuleLeft = d3.geoGraticule();
        
        const projectionRight = d3.geoOrthographic().scale(70).translate([0, 0]).rotate([0, -90]);
        const pathRight = d3.geoPath().projection(projectionRight);
        const graticuleRight = d3.geoGraticule();
        
        d3.select('#scene1-left-globe-sphere').datum({type: "Sphere"}).attr("d", pathLeft);
        d3.select('#scene1-right-globe-sphere').datum({type: "Sphere"}).attr("d", pathRight);
        
        const leftGraticulePath = d3.select('#scene1-left-globe-graticule').datum(graticuleLeft());
        const rightGraticulePath = d3.select('#scene1-right-globe-graticule').datum(graticuleRight());
        
        let leftRotation = 0;
        let rightRotation = 0;
        
        d3.timer(function(elapsed) {
            if (step >= 1) {
                leftRotation -= 1; // Clockwise
                projectionLeft.rotate([leftRotation, 90]);
                leftGraticulePath.attr("d", pathLeft);
            }
            if (step >= 2) {
                rightRotation += 1; // Counter-clockwise
                projectionRight.rotate([rightRotation, -90]);
                rightGraticulePath.attr("d", pathRight);
            }
        });
        
        function updateState() {
            btnPrev.disabled = step === 0;
            btnNext.disabled = step === maxStep;
            
            // Step 1: Left
            if (step >= 1) {
                leftArrow.setAttribute('stroke', '#1565c0');
                leftArrow.setAttribute('stroke-width', '2.5');
                leftArrowPoly.setAttribute('fill', '#1565c0');
                left3d.style.opacity = 1;
                leftConclusion.style.opacity = 1;
            } else {
                leftArrow.setAttribute('stroke', '#000');
                leftArrow.setAttribute('stroke-width', '1.5');
                leftArrowPoly.setAttribute('fill', '#000');
                left3d.style.opacity = 0;
                leftConclusion.style.opacity = 0;
            }
            
            // Step 2: Right
            if (step >= 2) {
                rightArrow.setAttribute('stroke', '#c62828');
                rightArrow.setAttribute('stroke-width', '2.5');
                rightArrowPoly.setAttribute('fill', '#c62828');
                right3d.style.opacity = 1;
                rightConclusion.style.opacity = 1;
            } else {
                rightArrow.setAttribute('stroke', '#000');
                rightArrow.setAttribute('stroke-width', '1.5');
                rightArrowPoly.setAttribute('fill', '#000');
                right3d.style.opacity = 0;
                rightConclusion.style.opacity = 0;
            }
            
            // Step 3: Conclusion
            if (step >= 3) {
                pointB.setAttribute('fill', '#2e7d32');
                pointB.setAttribute('r', '5');
                labelB.setAttribute('fill', '#2e7d32');
                labelB.setAttribute('font-size', '20');
                bConclusion.style.opacity = 1;
            } else {
                pointB.setAttribute('fill', '#000');
                pointB.setAttribute('r', '3');
                labelB.setAttribute('fill', '#000');
                labelB.setAttribute('font-size', '16');
                bConclusion.style.opacity = 0;
            }
        }
        
        btnPrev.addEventListener('click', () => {
            if (step > 0) { step--; updateState(); }
        });
        
        btnNext.addEventListener('click', () => {
            if (step < maxStep) { step++; updateState(); }
        });
        
        updateState();
    })();
    </script>
</body>
</html>
