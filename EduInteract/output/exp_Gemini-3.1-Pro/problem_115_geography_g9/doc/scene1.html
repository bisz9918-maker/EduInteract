<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>对跖点空间位置推导</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button:hover:not(:disabled) { background: #e9e9e9; }
        
        /* SVG Elements */
        .scene1-element { transition: opacity 0.5s ease; }
        .scene1-hidden { opacity: 0; pointer-events: none; }
        .scene1-visible { opacity: 1; }
        
        text { font-size: 14px; user-select: none; }
        .scene1-bold { font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <!-- 3D地球基础 (Step 0) -->
            <g id="scene1-step0-group" class="scene1-element scene1-visible">
                <!-- 地球轮廓 -->
                <circle cx="300" cy="250" r="160" fill="none" stroke="#000000" stroke-width="1.5" />
                <!-- 赤道 -->
                <path d="M 140 250 A 160 41.4 0 0 0 460 250" fill="none" stroke="#000000" stroke-width="1.5" />
                <path d="M 460 250 A 160 41.4 0 0 0 140 250" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,5" />
                <text x="90" y="255" fill="#000000">赤道</text>
                
                <!-- 本初子午线 -->
                <path d="M 300 90 A 50 160 0 0 0 300 410" fill="none" stroke="#000000" stroke-width="1.5" />
                <path d="M 300 410 A 50 160 0 0 0 300 90" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,5" />
                <text x="280" y="430" fill="#000000">0°经线</text>
                
                <!-- 地心O -->
                <circle cx="300" cy="250" r="3" fill="#000000" />
                <text x="315" y="275" fill="#000000" style="paint-order: stroke; stroke: #ffffff; stroke-width: 3px;">O</text>
                
                <!-- 点A -->
                <circle cx="438.6" cy="172.7" r="4" fill="#1565c0" />
                <text x="445" y="160" fill="#1565c0">A(30°N, 120°E)</text>
            </g>

            <!-- 遁地路线 (Step 1) -->
            <g id="scene1-step1-group" class="scene1-element scene1-hidden">
                <!-- 穿心线 -->
                <line x1="438.6" y1="172.7" x2="161.4" y2="327.3" stroke="#888888" stroke-width="2" stroke-dasharray="6,4" />
                <!-- 点B -->
                <circle cx="161.4" cy="327.3" r="4" fill="#c62828" />
                <text id="scene1-label-b" x="150" y="345" fill="#c62828" text-anchor="end">B(?, ?)</text>
            </g>

            <!-- 纬度推导 (Step 2) -->
            <g id="scene1-step2-group" class="scene1-element scene1-hidden">
                <!-- 经线圈剖面 -->
                <ellipse cx="300" cy="250" rx="158.3" ry="160" fill="#1565c0" fill-opacity="0.2" stroke="#1565c0" stroke-width="1" />
                <!-- 赤道面连线 -->
                <line x1="141.7" y1="250" x2="458.3" y2="250" stroke="#888888" stroke-width="1.5" stroke-dasharray="4,4" />
                
                <!-- 30°角(A) -->
                <path d="M 340 250 A 40 40 0 0 0 334.6 230" fill="none" stroke="#1565c0" stroke-width="1.5" />
                <text x="365" y="225" fill="#1565c0" style="paint-order: stroke; stroke: #ffffff; stroke-width: 3px;">30°</text>
                
                <!-- 30°角(B) -->
                <path d="M 260 250 A 40 40 0 0 0 265.4 270" fill="none" stroke="#c62828" stroke-width="1.5" />
                <text x="215" y="285" fill="#c62828" style="paint-order: stroke; stroke: #ffffff; stroke-width: 3px;">30°</text>
            </g>

            <!-- 经度推导 (Step 3) -->
            <g id="scene1-step3-group" class="scene1-element scene1-hidden">
                <!-- 2D俯视图外圈 -->
                <circle cx="650" cy="250" r="100" fill="none" stroke="#000000" stroke-width="1.5" />
                <text x="650" y="100" fill="#000000" text-anchor="middle">赤道</text>
                
                <!-- 北极点N -->
                <circle cx="650" cy="250" r="3" fill="#000000" />
                <text x="665" y="230" fill="#000000" style="paint-order: stroke; stroke: #ffffff; stroke-width: 3px;">N</text>
                
                <!-- 0°经线(2D) -->
                <line x1="650" y1="250" x2="650" y2="350" stroke="#000000" stroke-width="1.5" />
                <text x="650" y="365" fill="#000000" text-anchor="middle">0°</text>
                
                <!-- 120°E经线(2D) -->
                <line x1="650" y1="250" x2="736.6" y2="200" stroke="#1565c0" stroke-width="1.5" />
                <text x="765" y="170" fill="#1565c0" text-anchor="end">120°E (A)</text>
                
                <!-- 60°W经线(2D) -->
                <line id="scene1-line-60w" x1="650" y1="250" x2="563.4" y2="300" stroke="#c62828" stroke-width="1.5" />
                <text x="545" y="310" fill="#c62828" text-anchor="end">60°W (B)</text>
                
                <!-- 180°弧线 -->
                <path d="M 710 215.4 A 69.3 69.3 0 0 0 590 284.6" fill="none" stroke="#888888" stroke-width="1.5" stroke-dasharray="4,4" />
                <text x="650" y="135" fill="#888888" text-anchor="middle" style="paint-order: stroke; stroke: #ffffff; stroke-width: 3px;">180°</text>
            </g>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 4;
        
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        
        const step1Group = document.getElementById('scene1-step1-group');
        const step2Group = document.getElementById('scene1-step2-group');
        const step3Group = document.getElementById('scene1-step3-group');
        
        const labelB = document.getElementById('scene1-label-b');
        const line60W = document.getElementById('scene1-line-60w');
        
        function updateState() {
            // Prev/Next buttons
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
            
            // Step 1: 遁地路线
            if (currentStep >= 1) {
                step1Group.classList.remove('scene1-hidden');
                step1Group.classList.add('scene1-visible');
            } else {
                step1Group.classList.remove('scene1-visible');
                step1Group.classList.add('scene1-hidden');
            }
            
            // Step 2: 纬度推导
            if (currentStep >= 2) {
                step2Group.classList.remove('scene1-hidden');
                step2Group.classList.add('scene1-visible');
                if (currentStep === 2) {
                    labelB.textContent = "B(30°S, ?)";
                    labelB.classList.remove('scene1-bold');
                }
            } else {
                step2Group.classList.remove('scene1-visible');
                step2Group.classList.add('scene1-hidden');
                if (currentStep === 1) {
                    labelB.textContent = "B(?, ?)";
                    labelB.classList.remove('scene1-bold');
                }
            }
            
            // Step 3: 经度推导
            if (currentStep >= 3) {
                step3Group.classList.remove('scene1-hidden');
                step3Group.classList.add('scene1-visible');
                if (currentStep === 3) {
                    labelB.textContent = "B(30°S, 60°W)";
                    labelB.classList.remove('scene1-bold');
                    line60W.setAttribute('stroke-width', '1.5');
                }
            } else {
                step3Group.classList.remove('scene1-visible');
                step3Group.classList.add('scene1-hidden');
            }
            
            // Step 4: 结论
            if (currentStep === 4) {
                labelB.textContent = "B(30°S, 60°W)";
                labelB.classList.add('scene1-bold');
                line60W.setAttribute('stroke-width', '3');
            }
        }
        
        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateState();
            }
        });
        
        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateState();
            }
        });
        
        // Initialize
        updateState();
    })();
    </script>
</body>
</html>
