<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .fade { transition: opacity 0.3s ease; }
        .coord-box {
            position: absolute;
            width: 160px;
            height: 40px;
            background: rgba(0,0,0,0.05);
            border: 1px solid #000;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #000;
        }
        #scene1-box-jia { left: 180px; top: 370px; }
        #scene1-box-yi { left: 460px; top: 370px; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <defs>
                <marker id="arrow-red-down" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828" />
                </marker>
                <marker id="arrow-blue-left" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 10 0 L 0 5 L 10 10 z" fill="#1565c0" />
                </marker>
                <marker id="arrow-red-up" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 10 L 5 0 L 10 10 z" fill="#c62828" />
                </marker>
                <marker id="arrow-blue-right" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0" />
                </marker>
            </defs>
            
            <!-- Base Grids -->
            <g id="scene1-base">
                <!-- Left Grid -->
                <line x1="140" y1="150" x2="380" y2="150" stroke="#000" stroke-width="1.5" />
                <line x1="140" y1="230" x2="380" y2="230" stroke="#000" stroke-width="1.5" />
                <line x1="140" y1="310" x2="380" y2="310" stroke="#000" stroke-width="1.5" />
                <line x1="140" y1="150" x2="140" y2="310" stroke="#000" stroke-width="1.5" />
                <line x1="220" y1="150" x2="220" y2="310" stroke="#000" stroke-width="1.5" />
                <line x1="300" y1="150" x2="300" y2="310" stroke="#000" stroke-width="1.5" />
                <line x1="380" y1="150" x2="380" y2="310" stroke="#000" stroke-width="1.5" />
                
                <!-- Right Grid -->
                <line x1="420" y1="150" x2="660" y2="150" stroke="#000" stroke-width="1.5" />
                <line x1="420" y1="230" x2="660" y2="230" stroke="#000" stroke-width="1.5" />
                <line x1="420" y1="310" x2="660" y2="310" stroke="#000" stroke-width="1.5" />
                <line x1="420" y1="150" x2="420" y2="310" stroke="#000" stroke-width="1.5" />
                <line x1="500" y1="150" x2="500" y2="310" stroke="#000" stroke-width="1.5" />
                <line x1="580" y1="150" x2="580" y2="310" stroke="#000" stroke-width="1.5" />
                <line x1="660" y1="150" x2="660" y2="310" stroke="#000" stroke-width="1.5" />
                
                <!-- Points and Labels -->
                <circle cx="300" cy="230" r="4" fill="#000" />
                <text x="285" y="220" font-size="16" text-anchor="end" fill="#000">甲</text>
                
                <circle cx="500" cy="230" r="4" fill="#000" />
                <text x="485" y="220" font-size="16" text-anchor="end" fill="#000">乙</text>
                
                <!-- Left Grid Labels -->
                <text id="scene1-left-y1" x="130" y="150" font-size="14" text-anchor="end" dominant-baseline="middle" fill="#000">20°</text>
                <text id="scene1-left-y2" x="130" y="230" font-size="14" text-anchor="end" dominant-baseline="middle" fill="#000">30°</text>
                <text id="scene1-left-y3" x="130" y="310" font-size="14" text-anchor="end" dominant-baseline="middle" fill="#000">40°</text>
                
                <text id="scene1-left-x1" x="220" y="135" font-size="14" text-anchor="middle" fill="#000">50°</text>
                <text id="scene1-left-x2" x="380" y="135" font-size="14" text-anchor="middle" fill="#000">30°</text>
                
                <!-- Right Grid Labels -->
                <text id="scene1-right-y1" x="670" y="150" font-size="14" text-anchor="start" dominant-baseline="middle" fill="#000">40°</text>
                <text id="scene1-right-y2" x="670" y="230" font-size="14" text-anchor="start" dominant-baseline="middle" fill="#000">30°</text>
                <text id="scene1-right-y3" x="670" y="310" font-size="14" text-anchor="start" dominant-baseline="middle" fill="#000">20°</text>
                
                <text id="scene1-right-x1" x="420" y="135" font-size="14" text-anchor="middle" fill="#000">30°</text>
                <text id="scene1-right-x2" x="580" y="135" font-size="14" text-anchor="middle" fill="#000">50°</text>
            </g>
            
            <!-- Step 1: 甲地纬度 -->
            <g id="scene1-step1" class="fade" style="opacity: 0; display: none;">
                <line x1="90" y1="150" x2="90" y2="320" stroke="#c62828" stroke-width="2" marker-end="url(#arrow-red-down)" />
                <text x="90" y="350" font-size="14" text-anchor="middle" fill="#c62828">向南递增 → 南纬(S)</text>
            </g>
            
            <!-- Step 2: 甲地经度 -->
            <g id="scene1-step2" class="fade" style="opacity: 0; display: none;">
                <line x1="360" y1="90" x2="170" y2="90" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-blue-left)" />
                <text x="260" y="75" font-size="14" text-anchor="middle" fill="#1565c0">向西递增 → 西经(W)</text>
                <text x="300" y="135" font-size="14" text-anchor="middle" fill="#1565c0" font-weight="bold">40°</text>
            </g>
            
            <!-- Step 3: 乙地纬度 -->
            <g id="scene1-step3" class="fade" style="opacity: 0; display: none;">
                <line x1="710" y1="310" x2="710" y2="140" stroke="#c62828" stroke-width="2" marker-end="url(#arrow-red-up)" />
                <text x="710" y="120" font-size="14" text-anchor="middle" fill="#c62828">向北递增 → 北纬(N)</text>
            </g>
            
            <!-- Step 4: 乙地经度 -->
            <g id="scene1-step4" class="fade" style="opacity: 0; display: none;">
                <line x1="440" y1="90" x2="630" y2="90" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-blue-right)" />
                <text x="540" y="75" font-size="14" text-anchor="middle" fill="#1565c0">向东递增 → 东经(E)</text>
                <text x="500" y="135" font-size="14" text-anchor="middle" fill="#1565c0" font-weight="bold">40°</text>
            </g>
        </svg>
        
        <!-- Coordinate Boxes -->
        <div id="scene1-box-jia" class="coord-box">甲坐标: ( ? , ? )</div>
        <div id="scene1-box-yi" class="coord-box">乙坐标: ( ? , ? )</div>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 4;
        
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        
        const step1Group = document.getElementById('scene1-step1');
        const step2Group = document.getElementById('scene1-step2');
        const step3Group = document.getElementById('scene1-step3');
        const step4Group = document.getElementById('scene1-step4');
        
        const leftY1 = document.getElementById('scene1-left-y1');
        const leftY2 = document.getElementById('scene1-left-y2');
        const leftY3 = document.getElementById('scene1-left-y3');
        
        const leftX1 = document.getElementById('scene1-left-x1');
        const leftX2 = document.getElementById('scene1-left-x2');
        
        const rightY1 = document.getElementById('scene1-right-y1');
        const rightY2 = document.getElementById('scene1-right-y2');
        const rightY3 = document.getElementById('scene1-right-y3');
        
        const rightX1 = document.getElementById('scene1-right-x1');
        const rightX2 = document.getElementById('scene1-right-x2');
        
        const boxJia = document.getElementById('scene1-box-jia');
        const boxYi = document.getElementById('scene1-box-yi');
        
        function show(el) {
            el.style.display = '';
            // trigger reflow
            void el.offsetWidth;
            el.style.opacity = '1';
        }
        
        function hide(el) {
            el.style.opacity = '0';
            setTimeout(() => {
                if (el.style.opacity === '0') {
                    el.style.display = 'none';
                }
            }, 300);
        }
        
        function updateView() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
            
            // Step 1
            if (currentStep >= 1) {
                show(step1Group);
                leftY1.setAttribute('fill', '#c62828');
                leftY2.setAttribute('fill', '#c62828');
                leftY3.setAttribute('fill', '#c62828');
                leftY1.setAttribute('font-weight', 'bold');
                leftY2.setAttribute('font-weight', 'bold');
                leftY3.setAttribute('font-weight', 'bold');
            } else {
                hide(step1Group);
                leftY1.setAttribute('fill', '#000');
                leftY2.setAttribute('fill', '#000');
                leftY3.setAttribute('fill', '#000');
                leftY1.setAttribute('font-weight', 'normal');
                leftY2.setAttribute('font-weight', 'normal');
                leftY3.setAttribute('font-weight', 'normal');
            }
            
            // Step 2
            if (currentStep >= 2) {
                show(step2Group);
                leftX1.setAttribute('fill', '#1565c0');
                leftX2.setAttribute('fill', '#1565c0');
                leftX1.setAttribute('font-weight', 'bold');
                leftX2.setAttribute('font-weight', 'bold');
            } else {
                hide(step2Group);
                leftX1.setAttribute('fill', '#000');
                leftX2.setAttribute('fill', '#000');
                leftX1.setAttribute('font-weight', 'normal');
                leftX2.setAttribute('font-weight', 'normal');
            }
            
            // Step 3
            if (currentStep >= 3) {
                show(step3Group);
                rightY1.setAttribute('fill', '#c62828');
                rightY2.setAttribute('fill', '#c62828');
                rightY3.setAttribute('fill', '#c62828');
                rightY1.setAttribute('font-weight', 'bold');
                rightY2.setAttribute('font-weight', 'bold');
                rightY3.setAttribute('font-weight', 'bold');
            } else {
                hide(step3Group);
                rightY1.setAttribute('fill', '#000');
                rightY2.setAttribute('fill', '#000');
                rightY3.setAttribute('fill', '#000');
                rightY1.setAttribute('font-weight', 'normal');
                rightY2.setAttribute('font-weight', 'normal');
                rightY3.setAttribute('font-weight', 'normal');
            }
            
            // Step 4
            if (currentStep >= 4) {
                show(step4Group);
                rightX1.setAttribute('fill', '#1565c0');
                rightX2.setAttribute('fill', '#1565c0');
                rightX1.setAttribute('font-weight', 'bold');
                rightX2.setAttribute('font-weight', 'bold');
            } else {
                hide(step4Group);
                rightX1.setAttribute('fill', '#000');
                rightX2.setAttribute('fill', '#000');
                rightX1.setAttribute('font-weight', 'normal');
                rightX2.setAttribute('font-weight', 'normal');
            }
            
            // Update Coordinate Boxes
            if (currentStep === 0) {
                boxJia.innerHTML = '甲坐标: ( ? , ? )';
                boxYi.innerHTML = '乙坐标: ( ? , ? )';
            } else if (currentStep === 1) {
                boxJia.innerHTML = '甲坐标: ( <span style="color:#c62828">30°S</span> , ? )';
                boxYi.innerHTML = '乙坐标: ( ? , ? )';
            } else if (currentStep === 2) {
                boxJia.innerHTML = '甲坐标: ( <span style="color:#c62828">30°S</span> , <span style="color:#1565c0">40°W</span> )';
                boxYi.innerHTML = '乙坐标: ( ? , ? )';
            } else if (currentStep === 3) {
                boxJia.innerHTML = '甲坐标: ( <span style="color:#c62828">30°S</span> , <span style="color:#1565c0">40°W</span> )';
                boxYi.innerHTML = '乙坐标: ( <span style="color:#c62828">30°N</span> , ? )';
            } else if (currentStep === 4) {
                boxJia.innerHTML = '甲坐标: ( <span style="color:#c62828">30°S</span> , <span style="color:#1565c0">40°W</span> )';
                boxYi.innerHTML = '乙坐标: ( <span style="color:#c62828">30°N</span> , <span style="color:#1565c0">40°E</span> )';
            }
        }
        
        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateView();
            }
        });
        
        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateView();
            }
        });
        
        // Initialize
        updateView();
    })();
    </script>
</body>
</html>
