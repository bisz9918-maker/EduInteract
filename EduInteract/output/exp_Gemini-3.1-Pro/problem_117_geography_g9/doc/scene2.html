<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>相对方位判定</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* SVG Elements */
        .scene2-step1, .scene2-step2, .scene2-step3 { opacity: 0; transition: opacity 0.5s ease-in-out; }
        
        text { font-family: sans-serif; }
        .axis-label { font-size: 14px; fill: #000000; }
        .coord-label { font-size: 12px; fill: #000000; }
        .point-label { font-size: 14px; fill: #000000; font-weight: bold; }
        .local-label { font-size: 14px; fill: #2e7d32; }
        .result-label { font-size: 16px; fill: #c62828; font-weight: bold; }
        .comp-label { font-size: 14px; fill: #1565c0; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500">
            <defs>
                <marker id="scene2-arrow-black" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
                </marker>
                <marker id="scene2-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828" />
                </marker>
                <marker id="scene2-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0" />
                </marker>
            </defs>

            <!-- Step 0: Global Axes -->
            <g id="scene2-step0">
                <!-- X-axis (Equator) -->
                <line x1="100" y1="220" x2="700" y2="220" stroke="#000000" stroke-width="2" marker-end="url(#scene2-arrow-black)" marker-start="url(#scene2-arrow-black)" />
                <text x="680" y="205" class="axis-label" text-anchor="end">赤道</text>
                
                <!-- Y-axis (Prime Meridian) -->
                <line x1="400" y1="400" x2="400" y2="40" stroke="#000000" stroke-width="2" marker-end="url(#scene2-arrow-black)" marker-start="url(#scene2-arrow-black)" />
                <text x="415" y="70" class="axis-label">本初子午线</text>

                <!-- Global Directions -->
                <text x="400" y="35" class="axis-label" text-anchor="middle">N</text>
                <text x="400" y="425" class="axis-label" text-anchor="middle">S</text>
                <text x="80" y="225" class="axis-label" text-anchor="middle">W</text>
                <text x="720" y="225" class="axis-label" text-anchor="middle">E</text>
            </g>

            <!-- Step 1: Points and Coordinates -->
            <g id="scene2-step1-group" class="scene2-step1">
                <!-- Jia Point -->
                <line x1="280" y1="310" x2="280" y2="220" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" />
                <line x1="280" y1="310" x2="400" y2="310" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" />
                <circle cx="280" cy="310" r="4" fill="#000000" />
                <text x="220" y="335" class="point-label" text-anchor="middle">甲(40°W, 30°S)</text>
                <text x="260" y="210" class="coord-label" text-anchor="middle">40°W</text>
                <text x="410" y="325" class="coord-label">30°S</text>

                <!-- Yi Point -->
                <line x1="520" y1="130" x2="520" y2="220" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" />
                <line x1="520" y1="130" x2="400" y2="130" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" />
                <circle cx="520" cy="130" r="4" fill="#000000" />
                <text x="610" y="105" class="point-label" text-anchor="middle">乙(40°E, 30°N)</text>
                <text x="540" y="240" class="coord-label" text-anchor="middle">40°E</text>
                <text x="390" y="125" class="coord-label" text-anchor="end">30°N</text>
            </g>

            <!-- Step 2: Local Cross at Yi -->
            <g id="scene2-step2-group" class="scene2-step2">
                <line x1="470" y1="130" x2="570" y2="130" stroke="#2e7d32" stroke-width="2" />
                <line x1="520" y1="80" x2="520" y2="180" stroke="#2e7d32" stroke-width="2" />
                <text x="535" y="75" class="local-label">北</text>
                <text x="535" y="185" class="local-label">南</text>
                <text x="580" y="145" class="local-label">东</text>
                <text x="460" y="120" class="local-label">西</text>
            </g>

            <!-- Step 3: Arrows and Result -->
            <g id="scene2-step3-group" class="scene2-step3">
                <!-- South Component -->
                <line x1="520" y1="130" x2="520" y2="310" stroke="#1565c0" stroke-width="2" marker-end="url(#scene2-arrow-blue)" />
                <text x="530" y="280" class="comp-label">向南</text>
                
                <!-- West Component -->
                <line x1="520" y1="310" x2="280" y2="310" stroke="#1565c0" stroke-width="2" marker-end="url(#scene2-arrow-blue)" />
                <text x="400" y="360" class="comp-label" text-anchor="middle">向西</text>

                <!-- Main Arrow -->
                <line x1="520" y1="130" x2="280" y2="310" stroke="#c62828" stroke-width="3" marker-end="url(#scene2-arrow-red)" />
                <text x="320" y="100" class="result-label">西南</text>
            </g>
        </svg>

        <div id="scene2-controls">
            <button id="scene2-btn-prev" disabled>◀ 上一步</button>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 3;
        
        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        
        const step1Group = document.getElementById('scene2-step1-group');
        const step2Group = document.getElementById('scene2-step2-group');
        const step3Group = document.getElementById('scene2-step3-group');

        function updateScene() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;

            step1Group.style.opacity = currentStep >= 1 ? '1' : '0';
            step2Group.style.opacity = currentStep >= 2 ? '1' : '0';
            step3Group.style.opacity = currentStep >= 3 ? '1' : '0';
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });

        // Initialize
        updateScene();
    })();
    </script>
</body>
</html>
