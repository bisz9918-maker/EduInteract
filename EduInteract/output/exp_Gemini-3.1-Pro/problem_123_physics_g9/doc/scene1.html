<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 1</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* SVG Styles */
        .container-line { fill: none; stroke: #000000; stroke-width: 2; }
        .water { fill: #1565c0; opacity: 0.3; transition: all 0.3s; }
        .water.highlight { opacity: 0.6; stroke: #c62828; stroke-width: 2; }
        .gas-pipe { fill: none; stroke: #000000; stroke-width: 2; transition: all 0.3s; }
        .gas-pipe.highlight { stroke: #c62828; stroke-width: 3; }
        .seal { fill: #888888; stroke: #000000; stroke-width: 2; }
        .aux-line { fill: none; stroke: #888888; stroke-width: 1.5; stroke-dasharray: 5,5; }
        .arrow { fill: none; stroke: #c62828; stroke-width: 2; marker-end: url(#arrowhead); marker-start: url(#arrowhead-start); }
        .text-label { font-size: 16px; fill: #000000; }
        .text-red { fill: #c62828; }
        
        /* Step visibility */
        .step-element { opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        .step-element.visible { opacity: 1; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <defs>
                <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#c62828" />
                </marker>
                <marker id="arrowhead-start" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
                    <polygon points="10 0, 0 3.5, 10 7" fill="#c62828" />
                </marker>
                <!-- Pattern for seals -->
                <pattern id="hatch" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
                    <line x1="0" y1="0" x2="0" y2="10" stroke="#000000" stroke-width="2" />
                </pattern>
            </defs>

            <!-- Seals -->
            <rect x="380" y="140" width="40" height="60" class="seal" fill="url(#hatch)" />
            <rect x="380" y="280" width="40" height="60" class="seal" fill="url(#hatch)" />

            <!-- Water bodies -->
            <rect id="scene1-water-jia" x="320" y="90" width="160" height="50" class="water" />
            <rect id="scene1-water-yi" x="320" y="240" width="160" height="40" class="water" />
            <rect id="scene1-water-bing" x="320" y="380" width="160" height="40" class="water" />
            
            <!-- Right pipe water -->
            <polygon id="scene1-water-right" points="480,120 560,120 560,410 480,410 480,400 550,400 550,130 480,130" class="water" />

            <!-- Center pipe water -->
            <rect id="scene1-water-center" x="392" y="90" width="16" height="170" class="water" />

            <!-- Containers and Pipes (Lines) -->
            <!-- Jia -->
            <line x1="320" y1="60" x2="320" y2="140" class="container-line" />
            <line x1="320" y1="140" x2="480" y2="140" class="container-line" />
            <line x1="480" y1="140" x2="480" y2="60" class="container-line" />
            <!-- Yi -->
            <line x1="320" y1="200" x2="480" y2="200" class="container-line" />
            <line x1="320" y1="280" x2="480" y2="280" class="container-line" />
            <line x1="320" y1="200" x2="320" y2="280" class="container-line" />
            <line x1="480" y1="200" x2="480" y2="280" class="container-line" />
            <!-- Bing -->
            <line x1="320" y1="340" x2="480" y2="340" class="container-line" />
            <line x1="320" y1="420" x2="480" y2="420" class="container-line" />
            <line x1="320" y1="340" x2="320" y2="420" class="container-line" />
            <line x1="480" y1="340" x2="480" y2="420" class="container-line" />

            <!-- Right pipe -->
            <line x1="480" y1="120" x2="560" y2="120" class="container-line" />
            <line x1="560" y1="120" x2="560" y2="410" class="container-line" />
            <line x1="560" y1="410" x2="480" y2="410" class="container-line" />
            <line x1="480" y1="130" x2="550" y2="130" class="container-line" />
            <line x1="550" y1="130" x2="550" y2="400" class="container-line" />
            <line x1="550" y1="400" x2="480" y2="400" class="container-line" />

            <!-- Left pipe -->
            <g id="scene1-pipe-left-outer">
                <line x1="320" y1="210" x2="240" y2="210" class="gas-pipe" />
                <line x1="240" y1="210" x2="240" y2="360" class="gas-pipe" />
                <line x1="240" y1="360" x2="320" y2="360" class="gas-pipe" />
            </g>
            <g id="scene1-pipe-left-inner">
                <line x1="320" y1="220" x2="250" y2="220" class="gas-pipe" />
                <line x1="250" y1="220" x2="250" y2="350" class="gas-pipe" />
                <line x1="250" y1="350" x2="320" y2="350" class="gas-pipe" />
            </g>

            <!-- Center pipe -->
            <rect x="392" y="40" width="16" height="220" class="container-line" fill="#ffffff" />
            <!-- Redraw center pipe water over the white background -->
            <rect id="scene1-water-center-overlay" x="392" y="90" width="16" height="170" class="water" />
            <line x1="392" y1="40" x2="392" y2="260" class="container-line" />
            <line x1="408" y1="40" x2="408" y2="260" class="container-line" />

            <!-- Switch M -->
            <rect x="385" y="85" width="7" height="10" class="container-line" fill="#ffffff" />
            <text x="360" y="85" class="text-label">M</text>

            <!-- Basic Labels -->
            <text x="280" y="100" class="text-label">甲</text>
            <text x="280" y="240" class="text-label">乙</text>
            <text x="280" y="380" class="text-label">丙</text>
            <text x="430" y="50" class="text-label">P<tspan dy="4" font-size="0.8em">0</tspan><tspan dy="-4"></tspan></text>

            <!-- Step 1 Elements -->
            <g id="scene1-step1-group" class="step-element">
                <line x1="480" y1="90" x2="610" y2="90" class="aux-line" />
                <line x1="480" y1="380" x2="610" y2="380" class="aux-line" />
                <line x1="590" y1="90" x2="590" y2="380" class="arrow" />
                <text x="600" y="240" class="text-label text-red">h<tspan dy="4" font-size="0.8em">甲丙</tspan><tspan dy="-4"></tspan></text>
                <text x="620" y="365" class="text-label">P<tspan dy="4" font-size="0.8em">gas(丙)</tspan><tspan dy="-4"></tspan> = P<tspan dy="4" font-size="0.8em">0</tspan><tspan dy="-4"></tspan> + ρgh<tspan dy="4" font-size="0.8em">甲丙</tspan><tspan dy="-4"></tspan></text>
            </g>

            <!-- Step 2 Elements -->
            <g id="scene1-step2-group" class="step-element">
                <text x="60" y="225" class="text-label">P<tspan dy="4" font-size="0.8em">gas(乙)</tspan><tspan dy="-4"></tspan> = P<tspan dy="4" font-size="0.8em">gas(丙)</tspan><tspan dy="-4"></tspan></text>
            </g>

            <!-- Step 3 Elements -->
            <g id="scene1-step3-group" class="step-element">
                <line x1="210" y1="240" x2="320" y2="240" class="aux-line" />
                <line x1="210" y1="380" x2="320" y2="380" class="aux-line" />
                <line x1="220" y1="240" x2="220" y2="380" class="arrow" />
                <text x="160" y="315" class="text-label text-red">h<tspan dy="4" font-size="0.8em">乙丙</tspan><tspan dy="-4"></tspan></text>
                <text x="40" y="80" class="text-label">P<tspan dy="4" font-size="0.8em">M</tspan><tspan dy="-4"></tspan> = P<tspan dy="4" font-size="0.8em">gas(乙)</tspan><tspan dy="-4"></tspan> - ρgh<tspan dy="4" font-size="0.8em">乙丙</tspan><tspan dy="-4"></tspan></text>
            </g>

        </svg>
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 3;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');

        const waterJia = document.getElementById('scene1-water-jia');
        const waterBing = document.getElementById('scene1-water-bing');
        const waterRight = document.getElementById('scene1-water-right');
        const waterCenter = document.getElementById('scene1-water-center-overlay');
        const pipeLeftOuterLines = document.querySelectorAll('#scene1-pipe-left-outer line');
        const pipeLeftInnerLines = document.querySelectorAll('#scene1-pipe-left-inner line');

        const step1Group = document.getElementById('scene1-step1-group');
        const step2Group = document.getElementById('scene1-step2-group');
        const step3Group = document.getElementById('scene1-step3-group');

        function updateScene() {
            // Reset highlights
            waterJia.classList.remove('highlight');
            waterBing.classList.remove('highlight');
            waterRight.classList.remove('highlight');
            waterCenter.classList.remove('highlight');
            pipeLeftOuterLines.forEach(l => l.classList.remove('highlight'));
            pipeLeftInnerLines.forEach(l => l.classList.remove('highlight'));

            // Reset visibility
            step1Group.classList.remove('visible');
            step2Group.classList.remove('visible');
            step3Group.classList.remove('visible');

            if (currentStep >= 1) {
                step1Group.classList.add('visible');
            }
            if (currentStep >= 2) {
                step2Group.classList.add('visible');
            }
            if (currentStep >= 3) {
                step3Group.classList.add('visible');
            }

            if (currentStep === 1) {
                waterJia.classList.add('highlight');
                waterBing.classList.add('highlight');
                waterRight.classList.add('highlight');
            } else if (currentStep === 2) {
                pipeLeftOuterLines.forEach(l => l.classList.add('highlight'));
                pipeLeftInnerLines.forEach(l => l.classList.add('highlight'));
            } else if (currentStep === 3) {
                waterCenter.classList.add('highlight');
            }

            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });

        updateScene();
    })();
    </script>
</body>
</html>
