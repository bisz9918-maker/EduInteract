<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisualSolver Scene 3</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button.active { background: #e0e0e0; border-color: #999; font-weight: bold; }
        .fade { transition: opacity 0.5s ease, fill-opacity 1s ease, stroke 0.5s ease, stroke-width 0.5s ease; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg width="800" height="500">
            <!-- Title -->
            <text x="400" y="50" font-size="24" text-anchor="middle" fill="#000">选项C解析：烃C的芳香族同分异构体</text>

            <!-- Cubane Model -->
            <g id="scene3-cubane" stroke="#000" stroke-width="2" fill="none">
                <!-- Back square visible lines -->
                <polyline points="170,200 170,130 240,130 240,200" />
                <!-- Back square hidden lines -->
                <polyline points="170,130 170,200 240,200" stroke-dasharray="5,5" />
                <!-- Connecting lines visible -->
                <line x1="150" y1="150" x2="170" y2="130" />
                <line x1="220" y1="150" x2="240" y2="130" />
                <line x1="220" y1="220" x2="240" y2="200" />
                <!-- Connecting line hidden -->
                <line x1="150" y1="220" x2="170" y2="200" stroke-dasharray="5,5" />
                <!-- Front square -->
                <rect x="150" y="150" width="70" height="70" />
            </g>
            <text x="195" y="260" font-size="16" text-anchor="middle" fill="#000">烃C</text>
            <text x="195" y="300" font-size="16" text-anchor="middle" fill="#000">C8H8</text>

            <!-- Conversion Arrow -->
            <g id="scene3-conversion-arrow">
                <line x1="290" y1="175" x2="410" y2="175" stroke="#000" stroke-width="2" />
                <polygon points="410,175 400,170 400,180" fill="#000" />
                <text x="350" y="160" font-size="16" text-anchor="middle" fill="#000">同分异构体</text>
            </g>

            <!-- Styrene -->
            <g id="scene3-styrene" stroke="#000" stroke-width="2" fill="none">
                <!-- Benzene ring -->
                <polygon points="520,135 554.64,155 554.64,195 520,215 485.36,195 485.36,155" />
                <circle cx="520" cy="175" r="25" />
                <!-- Vinyl group -->
                <line x1="554.64" y1="155" x2="595" y2="135" />
                <!-- Double bond -->
                <g id="scene3-double-bond" class="fade">
                    <line x1="595" y1="135" x2="635" y2="155" />
                    <line x1="597" y1="131" x2="637" y2="151" />
                </g>
            </g>
            <text x="550" y="260" font-size="16" text-anchor="middle" fill="#000">苯乙烯 (芳香烃)</text>
            <text x="550" y="300" font-size="16" text-anchor="middle" fill="#000">C8H8</text>

            <!-- State 2 Elements -->
            <g id="scene3-state2-elements" class="fade" opacity="0">
                <!-- Double bond annotation -->
                <text x="615" y="100" font-size="14" text-anchor="middle" fill="#c62828">碳碳双键</text>
                <line x1="615" y1="105" x2="615" y2="135" stroke="#c62828" stroke-width="1" stroke-dasharray="4,2" />

                <!-- Reaction Arrow -->
                <line x1="650" y1="165" x2="680" y2="210" stroke="#000" stroke-width="2" />
                <polygon points="680,210 672,205 678,201" fill="#000" transform="rotate(56 680 210)" />

                <!-- Beaker -->
                <path d="M 675 220 L 675 275 A 5 5 0 0 0 680 280 L 710 280 A 5 5 0 0 0 715 275 L 715 220" stroke="#000" stroke-width="2" fill="none" />
                <!-- Liquid -->
                <path id="scene3-liquid" class="fade" d="M 675 240 L 675 275 A 5 5 0 0 0 680 280 L 710 280 A 5 5 0 0 0 715 275 L 715 240 Z" fill="#8e24aa" fill-opacity="0.6" stroke="none" />
                
                <text x="695" y="295" font-size="14" text-anchor="middle" fill="#000">酸性KMnO4溶液</text>
                <text id="scene3-decolorize-text" class="fade" x="695" y="330" font-size="14" text-anchor="middle" fill="#888" opacity="0">褪色</text>

                <!-- Conclusion -->
                <g id="scene3-conclusion" class="fade" opacity="0">
                    <path d="M 385 350 L 395 360 L 415 340" stroke="#2e7d32" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
                    <text x="400" y="390" font-size="20" text-anchor="middle" fill="#2e7d32">选项C 正确</text>
                </g>
            </g>
        </svg>

        <div id="scene3-controls">
            <button id="scene3-btn-state1" class="active">状态1：同分异构体</button>
            <button id="scene3-btn-state2">状态2：化学性质</button>
        </div>
    </div>

    <script>
    (function() {
        const btnState1 = document.getElementById('scene3-btn-state1');
        const btnState2 = document.getElementById('scene3-btn-state2');
        const state2Elements = document.getElementById('scene3-state2-elements');
        const doubleBond = document.getElementById('scene3-double-bond');
        const liquid = document.getElementById('scene3-liquid');
        const decolorizeText = document.getElementById('scene3-decolorize-text');
        const conclusion = document.getElementById('scene3-conclusion');

        function setState1() {
            btnState1.classList.add('active');
            btnState2.classList.remove('active');
            
            state2Elements.setAttribute('opacity', '0');
            
            doubleBond.setAttribute('stroke', '#000');
            doubleBond.setAttribute('stroke-width', '2');
            
            liquid.setAttribute('fill-opacity', '0.6');
            decolorizeText.setAttribute('opacity', '0');
            conclusion.setAttribute('opacity', '0');
        }

        function setState2() {
            btnState1.classList.remove('active');
            btnState2.classList.add('active');
            
            state2Elements.setAttribute('opacity', '1');
            
            doubleBond.setAttribute('stroke', '#c62828');
            doubleBond.setAttribute('stroke-width', '3');
            
            // Trigger decolorization animation after a short delay
            setTimeout(() => {
                liquid.setAttribute('fill-opacity', '0');
                decolorizeText.setAttribute('opacity', '1');
                
                // Show conclusion after decolorization
                setTimeout(() => {
                    conclusion.setAttribute('opacity', '1');
                }, 1000);
            }, 500);
        }

        btnState1.addEventListener('click', setState1);
        btnState2.addEventListener('click', setState2);
    })();
    </script>
</body>
</html>
