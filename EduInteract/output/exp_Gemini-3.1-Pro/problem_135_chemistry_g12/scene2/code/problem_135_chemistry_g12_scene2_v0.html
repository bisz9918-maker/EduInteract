<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene2-element { transition: opacity 0.5s ease; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500">
            <!-- 坐标系 -->
            <line x1="100" y1="400" x2="700" y2="400" stroke="#000000" stroke-width="2" marker-end="url(#scene2-arrow)" />
            <line x1="100" y1="400" x2="100" y2="50" stroke="#000000" stroke-width="2" marker-end="url(#scene2-arrow)" />
            <text x="690" y="420" font-size="14" fill="#000000" text-anchor="end">加入溶液体积 V</text>
            <text x="100" y="40" font-size="14" fill="#000000" text-anchor="middle">导电性 I</text>
            <text x="85" y="415" font-size="14" fill="#000000" text-anchor="end">O</text>
            
            <!-- 等当点 -->
            <line x1="400" y1="400" x2="400" y2="80" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" />
            <text x="400" y="420" font-size="14" fill="#000000" text-anchor="middle">V0</text>

            <!-- 曲线A -->
            <g id="scene2-group-a" class="scene2-element" style="opacity: 0; display: none;">
                <path d="M 100 380 Q 250 380 400 80 Q 525 110 650 140" fill="none" stroke="#c62828" stroke-width="3" />
                <text x="400" y="65" font-size="14" fill="#c62828" text-anchor="middle">A: 弱变强</text>
            </g>

            <!-- 曲线B -->
            <g id="scene2-group-b" class="scene2-element" style="opacity: 0; display: none;">
                <path d="M 100 150 Q 250 135 400 120 Q 525 160 650 200" fill="none" stroke="#1565c0" stroke-width="2" />
                <text x="450" y="105" font-size="14" fill="#1565c0" style="paint-order: stroke; stroke: #ffffff; stroke-width: 3px; stroke-linecap: round; stroke-linejoin: round;" transform="translate(0, -30)">B: 强变强</text>
            </g>

            <!-- 曲线C -->
            <g id="scene2-group-c" class="scene2-element" style="opacity: 0; display: none;">
                <path d="M 100 150 Q 375 190 650 230" fill="none" stroke="#2e7d32" stroke-width="2" />
                <text x="660" y="235" font-size="14" fill="#2e7d32">C: 混合稀释</text>
            </g>

            <!-- 曲线D -->
            <g id="scene2-group-d" class="scene2-element" style="opacity: 0; display: none;">
                <path d="M 100 150 Q 250 155 400 160 Q 525 210 650 260" fill="none" stroke="#888888" stroke-width="2" />
                <text x="450" y="185" font-size="14" fill="#888888" style="paint-order: stroke; stroke: #ffffff; stroke-width: 3px; stroke-linecap: round; stroke-linejoin: round;" transform="translate(0, 220)">D: 强变强</text>
            </g>

            <defs>
                <marker id="scene2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
                </marker>
            </defs>
        </svg>
        <div id="scene2-controls">
            <button id="scene2-btn-prev" disabled>◀ 上一步</button>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>
    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 4;
        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        const groups = [
            null, // step 0
            document.getElementById('scene2-group-a'),
            document.getElementById('scene2-group-b'),
            document.getElementById('scene2-group-c'),
            document.getElementById('scene2-group-d')
        ];

        function updateScene() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;

            for (let i = 1; i <= maxStep; i++) {
                if (i <= currentStep) {
                    groups[i].style.display = 'inline';
                    // Force reflow
                    void groups[i].offsetWidth;
                    groups[i].style.opacity = '1';
                } else {
                    groups[i].style.opacity = '0';
                    setTimeout(() => {
                        if (i > currentStep) {
                            groups[i].style.display = 'none';
                        }
                    }, 500);
                }
            }
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });

        updateScene();
    })();
    </script>
</body>
</html>
