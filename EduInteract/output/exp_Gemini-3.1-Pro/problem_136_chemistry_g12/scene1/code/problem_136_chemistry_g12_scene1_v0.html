<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星际有机分子结构与化学键推导</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .hint-text { font-size: 14px; text-anchor: middle; font-weight: bold; }
        .label-text { font-size: 14px; text-anchor: middle; }
        .bond-line { stroke-width: 2; transition: all 0.3s; }
        .atom { transition: all 0.3s; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <defs>
                <pattern id="scene1-stripe" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
                    <rect width="8" height="8" fill="#ffffff"/>
                    <line x1="0" y1="0" x2="0" y2="8" stroke="#000000" stroke-width="2"/>
                </pattern>
                <filter id="scene1-glow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="3" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
            </defs>

            <!-- Bonds Group -->
            <g id="scene1-bonds">
                <!-- Bonds will be generated by JS -->
            </g>

            <!-- Highlight Boxes -->
            <rect id="scene1-box1" x="410" y="235" width="40" height="30" fill="none" stroke="#2e7d32" stroke-width="2" opacity="0" />
            <rect id="scene1-box2" x="590" y="235" width="40" height="30" fill="none" stroke="#2e7d32" stroke-width="2" opacity="0" />

            <!-- Indicator Lines -->
            <line x1="100" y1="265" x2="100" y2="290" stroke="#000000" stroke-width="1" />
            <line x1="220" y1="265" x2="220" y2="290" stroke="#000000" stroke-width="1" />
            <line x1="430" y1="255" x2="430" y2="290" stroke="#000000" stroke-width="1" />
            <line x1="610" y1="255" x2="610" y2="290" stroke="#000000" stroke-width="1" />
            <line x1="700" y1="265" x2="700" y2="290" stroke="#000000" stroke-width="1" />

            <!-- Labels -->
            <text x="100" y="310" class="label-text">氢原子</text>
            <text x="220" y="310" class="label-text">碳原子</text>
            <text x="430" y="310" class="label-text">①</text>
            <text x="610" y="310" class="label-text">②</text>
            <text x="700" y="310" class="label-text">③</text>

            <!-- Atoms Group -->
            <g id="scene1-atoms">
                <!-- H -->
                <circle id="scene1-atom-0" cx="100" cy="250" r="12" fill="#ffffff" stroke="#000000" stroke-width="1.5" class="atom" />
                <!-- C1 to C9 -->
                <circle id="scene1-atom-1" cx="160" cy="250" r="12" fill="#000000" class="atom" />
                <circle id="scene1-atom-2" cx="220" cy="250" r="12" fill="#000000" class="atom" />
                <circle id="scene1-atom-3" cx="280" cy="250" r="12" fill="#000000" class="atom" />
                <circle id="scene1-atom-4" cx="340" cy="250" r="12" fill="#000000" class="atom" />
                <circle id="scene1-atom-5" cx="400" cy="250" r="12" fill="#000000" class="atom" />
                <circle id="scene1-atom-6" cx="460" cy="250" r="12" fill="#000000" class="atom" />
                <circle id="scene1-atom-7" cx="520" cy="250" r="12" fill="#000000" class="atom" />
                <circle id="scene1-atom-8" cx="580" cy="250" r="12" fill="#000000" class="atom" />
                <circle id="scene1-atom-9" cx="640" cy="250" r="12" fill="#000000" class="atom" />
                <!-- ③ -->
                <circle id="scene1-atom-10" cx="700" cy="250" r="12" fill="url(#scene1-stripe)" stroke="#000000" stroke-width="1.5" class="atom" />
            </g>

            <!-- Hints -->
            <text id="scene1-hint-1" x="130" y="180" class="hint-text" fill="#1565c0" opacity="0">氢(H)化合价为1</text>
            <text id="scene1-hint-2" x="250" y="180" class="hint-text" fill="#1565c0" opacity="0">碳(C)化合价为4，需再形成3个键</text>
            <text id="scene1-hint-3" x="400" y="180" class="hint-text" fill="#1565c0" opacity="0">单键-三键-单键-三键...交替</text>
            <text id="scene1-hint-4a" x="430" y="180" class="hint-text" fill="#c62828" opacity="0">①为三键（排除B）</text>
            <text id="scene1-hint-4b" x="610" y="180" class="hint-text" fill="#2e7d32" opacity="0">②为单键（确认C正确）</text>
            <text id="scene1-hint-5a" x="550" y="150" class="hint-text" fill="#c62828" opacity="0">原子③需形成三键，而Cl/F只能形成单键（排除D）</text>
            <text id="scene1-hint-5b" x="400" y="100" class="hint-text" fill="#c62828" opacity="0">分子含杂原子，非烃类（排除A）</text>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        const bondsGroup = document.getElementById('scene1-bonds');
        const bonds = [];
        
        // Initialize bonds
        for (let i = 0; i < 10; i++) {
            const x1 = 100 + i * 60 + 12;
            const x2 = 100 + (i + 1) * 60 - 12;
            
            const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            g.id = `scene1-bond-${i}`;
            
            // Default single gray line
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', x1);
            line.setAttribute('y1', 250);
            line.setAttribute('x2', x2);
            line.setAttribute('y2', 250);
            line.setAttribute('stroke', '#999999');
            line.setAttribute('class', 'bond-line');
            g.appendChild(line);
            
            bondsGroup.appendChild(g);
            bonds.push(g);
        }

        let currentStep = 0;
        const maxStep = 5;
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');

        function setBond(index, type, color) {
            const g = bonds[index];
            g.innerHTML = '';
            const x1 = 100 + index * 60 + 12;
            const x2 = 100 + (index + 1) * 60 - 12;
            
            if (type === 1) {
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', x1);
                line.setAttribute('y1', 250);
                line.setAttribute('x2', x2);
                line.setAttribute('y2', 250);
                line.setAttribute('stroke', color);
                line.setAttribute('class', 'bond-line');
                g.appendChild(line);
            } else if (type === 3) {
                [-4, 0, 4].forEach(dy => {
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', x1);
                    line.setAttribute('y1', 250 + dy);
                    line.setAttribute('x2', x2);
                    line.setAttribute('y2', 250 + dy);
                    line.setAttribute('stroke', color);
                    line.setAttribute('class', 'bond-line');
                    g.appendChild(line);
                });
            }
        }

        function show(id) {
            document.getElementById(id).style.opacity = '1';
        }

        function hide(id) {
            document.getElementById(id).style.opacity = '0';
        }

        function highlightAtom(index, color) {
            const atom = document.getElementById(`scene1-atom-${index}`);
            if (color) {
                atom.setAttribute('stroke', color);
                atom.setAttribute('stroke-width', '3');
                atom.setAttribute('filter', 'url(#scene1-glow)');
            } else {
                if (index === 0 || index === 10) {
                    atom.setAttribute('stroke', '#000000');
                    atom.setAttribute('stroke-width', '1.5');
                } else {
                    atom.removeAttribute('stroke');
                    atom.removeAttribute('stroke-width');
                }
                atom.removeAttribute('filter');
            }
        }

        function updateScene() {
            // Reset all
            for (let i = 0; i < 10; i++) {
                setBond(i, 1, '#999999');
                highlightAtom(i, null);
            }
            highlightAtom(10, null);
            hide('scene1-hint-1');
            hide('scene1-hint-2');
            hide('scene1-hint-3');
            hide('scene1-hint-4a');
            hide('scene1-hint-4b');
            hide('scene1-hint-5a');
            hide('scene1-hint-5b');
            hide('scene1-box1');
            hide('scene1-box2');

            if (currentStep >= 1) {
                setBond(0, 1, '#1565c0');
                highlightAtom(0, '#1565c0');
                highlightAtom(1, '#1565c0');
                if (currentStep === 1) show('scene1-hint-1');
            }
            if (currentStep >= 2) {
                setBond(1, 3, '#1565c0');
                highlightAtom(0, null);
                highlightAtom(1, '#1565c0');
                highlightAtom(2, '#1565c0');
                if (currentStep === 2) show('scene1-hint-2');
            }
            if (currentStep >= 3) {
                highlightAtom(1, null);
                highlightAtom(2, null);
                for (let i = 2; i < 10; i++) {
                    setBond(i, i % 2 === 0 ? 1 : 3, '#1565c0');
                }
                if (currentStep === 3) show('scene1-hint-3');
            }
            if (currentStep >= 4) {
                if (currentStep === 4) {
                    show('scene1-hint-4a');
                    show('scene1-hint-4b');
                    show('scene1-box1');
                    show('scene1-box2');
                }
            }
            if (currentStep >= 5) {
                highlightAtom(9, '#c62828');
                highlightAtom(10, '#c62828');
                show('scene1-hint-5a');
                show('scene1-hint-5b');
            }

            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });

        // Initial render
        updateScene();
    })();
    </script>
</body>
</html>
