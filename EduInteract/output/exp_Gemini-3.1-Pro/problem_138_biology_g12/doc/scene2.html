<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button:hover:not(:disabled) { background: #eee; }
        .step-group { transition: opacity 0.4s ease; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" id="scene2-svg">
            <defs>
                <marker id="scene2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#888888" />
                </marker>
            </defs>

            <!-- Step 0: Initial State -->
            <g id="scene2-step0-group" class="step-group">
                <!-- 花药 -->
                <path d="M 60 250 C 50 230, 90 230, 80 250 C 90 270, 50 270, 60 250 Z" fill="#2e7d32" fill-opacity="0.1" stroke="#2e7d32" stroke-width="2" />
                <text x="70" y="310" text-anchor="middle" font-size="14" fill="#000">花药</text>

                <!-- 提取箭头 -->
                <line x1="100" y1="260" x2="140" y2="260" stroke="#888888" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#scene2-arrow)" />

                <!-- 花粉 -->
                <circle cx="170" cy="260" r="15" fill="#2e7d32" fill-opacity="0.1" stroke="#2e7d32" stroke-width="2" />
                
                <text x="170" y="310" text-anchor="middle" font-size="14" fill="#1565c0">花粉(AB)</text>
            </g>

            <!-- Step 1: 处理③ -->
            <g id="scene2-step1-group" class="step-group" style="opacity: 0; display: none;">
                <!-- 脱分化箭头 -->
                <line x1="200" y1="260" x2="270" y2="260" stroke="#888888" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#scene2-arrow)" />
                <text x="235" y="245" text-anchor="middle" font-size="14" fill="#000">脱分化</text>

                <!-- 愈伤组织 -->
                <path d="M 295 260 Q 300 240 310 245 T 325 260 T 310 275 T 295 260" fill="#2e7d32" fill-opacity="0.1" stroke="#2e7d32" stroke-width="2" />
                <path d="M 290 275 Q 310 285 330 275" fill="none" stroke="#000" stroke-width="2" /> <!-- 培养皿 -->
                <text x="310" y="310" text-anchor="middle" font-size="14" fill="#000">愈伤组织</text>

                <!-- 再分化箭头 -->
                <line x1="350" y1="260" x2="410" y2="260" stroke="#888888" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#scene2-arrow)" />
                <text x="380" y="245" text-anchor="middle" font-size="14" fill="#000">再分化</text>

                <!-- 单倍体植株 -->
                <line x1="450" y1="280" x2="450" y2="240" stroke="#2e7d32" stroke-width="3" />
                <path d="M 450 260 Q 430 250 440 240 Q 450 250 450 260" fill="#2e7d32" />
                <path d="M 450 250 Q 470 240 460 230 Q 450 240 450 250" fill="#2e7d32" />
                <text x="450" y="330" text-anchor="middle" font-size="14" fill="#1565c0">单倍体植株(AB)</text>
            </g>

            <!-- Step 2: 处理④ -->
            <g id="scene2-step2-group" class="step-group" style="opacity: 0; display: none;">
                <!-- 秋水仙素滴管 -->
                <path d="M 445 150 L 455 150 L 455 180 L 452 190 L 448 190 L 445 180 Z" fill="none" stroke="#000" stroke-width="1.5" />
                <path d="M 443 135 C 443 125, 457 125, 457 135 L 457 150 L 443 150 Z" fill="#c62828" />
                <circle cx="450" cy="198" r="3" fill="#c62828" />
                <text x="450" y="115" text-anchor="middle" font-size="14" fill="#c62828">秋水仙素</text>

                <!-- 气泡指示线 -->
                <line x1="460" y1="220" x2="520" y2="180" stroke="#888888" stroke-width="1.5" stroke-dasharray="4,4" />

                <!-- 细胞分裂气泡 -->
                <circle cx="565" cy="140" r="65" fill="#ffffff" stroke="#c62828" stroke-width="2" stroke-dasharray="6,4" />
                <text x="565" y="60" text-anchor="middle" font-size="14" fill="#c62828">抑制纺锤体形成</text>

                <!-- 染色体 -->
                <g stroke="#1565c0" stroke-width="3" stroke-linecap="round">
                    <line x1="535" y1="130" x2="555" y2="150" />
                    <line x1="555" y1="130" x2="535" y2="150" />
                    <circle cx="545" cy="140" r="2" fill="#1565c0" stroke="none" />
                    
                    <line x1="575" y1="130" x2="595" y2="150" />
                    <line x1="595" y1="130" x2="575" y2="150" />
                    <circle cx="585" cy="140" r="2" fill="#1565c0" stroke="none" />
                </g>

                <!-- 纺锤丝及红叉 -->
                <g stroke="#888888" stroke-width="1" stroke-dasharray="2,2">
                    <line x1="545" y1="90" x2="545" y2="130" />
                    <line x1="545" y1="150" x2="545" y2="190" />
                    <line x1="585" y1="90" x2="585" y2="130" />
                    <line x1="585" y1="150" x2="585" y2="190" />
                </g>
                <g stroke="#c62828" stroke-width="4" stroke-linecap="round">
                    <line x1="535" y1="100" x2="555" y2="120" />
                    <line x1="555" y1="100" x2="535" y2="120" />
                    
                    <line x1="575" y1="160" x2="595" y2="180" />
                    <line x1="595" y1="160" x2="575" y2="180" />
                </g>
            </g>

            <!-- Step 3: 结果 -->
            <g id="scene2-step3-group" class="step-group" style="opacity: 0; display: none;">
                <!-- 处理④箭头 -->
                <line x1="490" y1="260" x2="640" y2="260" stroke="#888888" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#scene2-arrow)" />
                <text x="565" y="280" text-anchor="middle" font-size="14" fill="#000">处理④</text>

                <!-- 二倍体植株 -->
                <line x1="700" y1="290" x2="700" y2="210" stroke="#2e7d32" stroke-width="5" />
                <path d="M 700 270 Q 670 250 680 230 Q 700 250 700 270" fill="#2e7d32" />
                <path d="M 700 250 Q 730 230 720 210 Q 700 230 700 250" fill="#2e7d32" />
                <path d="M 700 230 Q 670 210 680 190 Q 700 210 700 230" fill="#2e7d32" />
                <path d="M 700 210 Q 730 190 720 170 Q 700 190 700 210" fill="#2e7d32" />
                <text x="700" y="340" text-anchor="middle" font-size="14" fill="#1565c0">二倍体植株(AABB)</text>
            </g>
        </svg>

        <div id="scene2-controls">
            <button id="scene2-btn-prev" disabled>◀ 上一步</button>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 3;
        
        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        
        const steps = [
            document.getElementById('scene2-step0-group'),
            document.getElementById('scene2-step1-group'),
            document.getElementById('scene2-step2-group'),
            document.getElementById('scene2-step3-group')
        ];

        function show(el) {
            el.style.display = 'block';
            // Trigger reflow
            void el.offsetWidth;
            el.style.opacity = '1';
        }

        function hide(el) {
            el.style.opacity = '0';
            setTimeout(() => {
                if (el.style.opacity === '0') {
                    el.style.display = 'none';
                }
            }, 400);
        }

        function updateScene() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;

            for (let i = 0; i <= maxStep; i++) {
                if (i <= currentStep) {
                    if (steps[i].style.display === 'none' || steps[i].style.opacity === '0') {
                        show(steps[i]);
                    }
                } else {
                    if (steps[i].style.display !== 'none') {
                        hide(steps[i]);
                    }
                }
            }
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });

        // Initialize
        updateScene();
    })();
    </script>
</body>
</html>
