<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 20px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .fade { transition: opacity 0.5s ease; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg width="800" height="500">
            <defs>
                <marker id="scene3-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#888888" />
                </marker>
            </defs>

            <!-- Step 0 Elements -->
            <g id="scene3-step0-elements">
                <!-- 目的基因DNA -->
                <line x1="110" y1="100" x2="190" y2="100" stroke="#2e7d32" stroke-width="10" stroke-linecap="round" />
                <text x="150" y="75" text-anchor="middle" font-size="14" fill="#000000">目的基因(b)</text>

                <!-- 细菌细胞 -->
                <ellipse cx="150" cy="320" rx="60" ry="35" stroke="#888888" stroke-width="2" fill="rgba(136,136,136,0.1)" />
                <text x="150" y="375" text-anchor="middle" font-size="14" fill="#000000">细菌</text>

                <!-- 质粒 -->
                <circle cx="150" cy="320" r="15" stroke="#1565c0" stroke-width="4" fill="none" />
                <line x1="165" y1="320" x2="200" y2="345" stroke="#888888" stroke-width="1" />
                <text x="240" y="350" text-anchor="middle" font-size="14" fill="#000000">质粒(运载体)</text>

                <!-- 花菜体细胞 -->
                <rect x="580" y="130" width="140" height="160" rx="20" ry="20" stroke="#888888" stroke-width="2" fill="rgba(136,136,136,0.1)" />
                <text x="650" y="310" text-anchor="middle" font-size="14" fill="#000000">花菜体细胞</text>

                <!-- 细胞核 -->
                <circle cx="650" cy="210" r="40" stroke="#888888" stroke-width="2" fill="none" />
                
                <!-- 宿主DNA -->
                <g id="scene3-host-dna" class="fade">
                    <path d="M 630 200 Q 640 180 650 210 T 670 220" stroke="#888888" stroke-width="3" fill="none" />
                </g>
            </g>

            <!-- Step 1 Elements -->
            <g id="scene3-step1-elements" class="fade" style="opacity: 0; display: none;">
                <!-- 过程箭头1 -->
                <line x1="200" y1="110" x2="360" y2="190" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#scene3-arrow)" />
                <!-- 过程箭头2 -->
                <line x1="210" y1="310" x2="360" y2="230" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#scene3-arrow)" />
                
                <!-- 重组质粒 -->
                <circle cx="400" cy="210" r="30" stroke="#1565c0" stroke-width="6" fill="none" />
                <path d="M 400 180 A 30 30 0 0 1 426 195" stroke="#2e7d32" stroke-width="6" fill="none" />
                <text x="400" y="260" text-anchor="middle" font-size="14" fill="#000000">重组质粒</text>
            </g>

            <!-- Step 2 Elements -->
            <g id="scene3-step2-elements" class="fade" style="opacity: 0; display: none;">
                <!-- 过程箭头3 -->
                <line x1="440" y1="210" x2="570" y2="210" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#scene3-arrow)" />
                
                <!-- 整合后DNA -->
                <path d="M 630 200 Q 640 180 650 210 T 670 220" stroke="#888888" stroke-width="3" fill="none" />
                <path d="M 640 195 Q 645 195 650 210" stroke="#2e7d32" stroke-width="4" fill="none" />
                
                <!-- 整合标签 -->
                <text x="650" y="115" text-anchor="middle" font-size="14" fill="#000000">整合</text>
            </g>
        </svg>

        <div id="scene3-controls">
            <button id="scene3-btn-prev" disabled>◀ 上一步</button>
            <button id="scene3-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 2;

        const btnPrev = document.getElementById('scene3-btn-prev');
        const btnNext = document.getElementById('scene3-btn-next');
        
        const step1Elements = document.getElementById('scene3-step1-elements');
        const step2Elements = document.getElementById('scene3-step2-elements');
        const hostDna = document.getElementById('scene3-host-dna');

        function show(el) {
            el.style.display = '';
            // trigger reflow
            void el.offsetWidth;
            el.style.opacity = '1';
        }

        function hide(el) {
            el.style.opacity = '0';
            setTimeout(() => {
                if (el.style.opacity === '0') {
                    el.style.display = 'none';
                }
            }, 500);
        }

        function updateScene() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;

            if (currentStep >= 1) {
                show(step1Elements);
            } else {
                hide(step1Elements);
            }

            if (currentStep >= 2) {
                show(step2Elements);
                hide(hostDna);
            } else {
                hide(step2Elements);
                show(hostDna);
            }
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });

        // Initialize
        updateScene();
    })();
    </script>
</body>
</html>
