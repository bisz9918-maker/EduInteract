<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F2代性状分离比及白花株系筛选</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .box { fill: #ffffff; stroke: #000000; stroke-width: 2; }
        .box-white { fill: #ffffff; stroke: #888888; stroke-width: 2; }
        .box-purple { fill: rgba(128, 0, 128, 0.3); stroke: #800080; stroke-width: 2; }
        .box-blue { fill: rgba(21, 101, 192, 0.3); stroke: #1565c0; stroke-width: 2; }
        .box-highlight { stroke: #c62828; stroke-width: 3; fill: rgba(198, 40, 40, 0.1); }
        .text-center { text-anchor: middle; dominant-baseline: middle; font-size: 14px; }
        .text-title { text-anchor: middle; dominant-baseline: middle; font-size: 18px; font-weight: bold; }
        .arrow { stroke: #000000; stroke-width: 2; fill: none; }
        .arrow-head { fill: #000000; }
        .line { stroke: #000000; stroke-width: 2; fill: none; }
        .step-element { transition: opacity 0.3s ease; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500">
            <defs>
                <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" class="arrow-head" />
                </marker>
            </defs>
            
            <!-- Step 0: Initial -->
            <g id="scene2-step0">
                <text x="400" y="40" class="text-title">F2代性状分离比及白花株系筛选</text>
                <text x="400" y="80" class="text-center">F1 (AaBb) 自交</text>
                
                <!-- 9 A_B_ -->
                <rect x="100" y="120" width="100" height="40" rx="4" class="box" />
                <text x="150" y="140" class="text-center">9 A_B_</text>
                
                <!-- 3 A_bb -->
                <rect x="270" y="120" width="100" height="40" rx="4" class="box" />
                <text x="320" y="140" class="text-center">3 A_bb</text>
                
                <!-- 3 aaB_ -->
                <rect x="430" y="120" width="100" height="40" rx="4" class="box" />
                <text x="480" y="140" class="text-center">3 aaB_</text>
                
                <!-- 1 aabb -->
                <rect x="600" y="120" width="100" height="40" rx="4" class="box" />
                <text x="650" y="140" class="text-center">1 aabb</text>
            </g>

            <!-- Step 1: Phenotypes -->
            <g id="scene2-step1" class="step-element" style="opacity: 0; display: none;">
                <line x1="150" y1="160" x2="150" y2="175" class="arrow" marker-end="url(#arrowhead)" />
                <line x1="320" y1="160" x2="320" y2="175" class="arrow" marker-end="url(#arrowhead)" />
                <line x1="480" y1="160" x2="480" y2="175" class="arrow" marker-end="url(#arrowhead)" />
                <line x1="650" y1="160" x2="650" y2="175" class="arrow" marker-end="url(#arrowhead)" />
                
                <rect x="100" y="180" width="100" height="40" rx="4" class="box-white" />
                <text x="150" y="200" class="text-center">9 白花</text>
                
                <rect x="270" y="180" width="100" height="40" rx="4" class="box-purple" />
                <text x="320" y="200" class="text-center">3 紫花</text>
                
                <rect x="430" y="180" width="100" height="40" rx="4" class="box-blue" />
                <text x="480" y="200" class="text-center">3 蓝花</text>
                
                <rect x="600" y="180" width="100" height="40" rx="4" class="box-white" />
                <text x="650" y="200" class="text-center">1 白花</text>
            </g>

            <!-- Step 2: 10 White Flowers -->
            <g id="scene2-step2" class="step-element" style="opacity: 0; display: none;">
                <polyline points="150,220 150,240 400,240" class="line" />
                <polyline points="650,220 650,240 400,240" class="line" />
                <line x1="400" y1="240" x2="400" y2="250" class="arrow" marker-end="url(#arrowhead)" />
                
                <text x="400" y="265" class="text-center" font-weight="bold">10 份白花</text>
                
                <line x1="400" y1="280" x2="400" y2="295" class="arrow" marker-end="url(#arrowhead)" />
                
                <rect x="80" y="310" width="100" height="40" rx="4" class="box" />
                <text x="130" y="330" class="text-center">1 AABB</text>
                
                <rect x="215" y="310" width="100" height="40" rx="4" class="box" />
                <text x="265" y="330" class="text-center">2 AABb</text>
                
                <rect id="scene2-aabb-box" x="350" y="310" width="100" height="40" rx="4" class="box" />
                <text x="400" y="330" class="text-center">4 AaBb</text>
                
                <rect x="485" y="310" width="100" height="40" rx="4" class="box" />
                <text x="535" y="330" class="text-center">2 AaBB</text>
                
                <rect x="620" y="310" width="100" height="40" rx="4" class="box" />
                <text x="670" y="330" class="text-center">1 aabb</text>
            </g>

            <!-- Step 3: Conclusion -->
            <g id="scene2-step3" class="step-element" style="opacity: 0; display: none;">
                <text x="400" y="380" class="text-center">自交后代呈 3:3:10 比例的株系，其基因型必为 <tspan font-weight="bold" fill="#c62828">AaBb</tspan></text>
                <text x="400" y="420" class="text-center">所占比例 = 4 / 10 = <tspan font-weight="bold" fill="#c62828">2/5</tspan></text>
            </g>
        </svg>
        
        <div id="scene2-controls">
            <button id="scene2-btn-prev" disabled>◀ 上一步</button>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 3;
        
        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        
        const step1 = document.getElementById('scene2-step1');
        const step2 = document.getElementById('scene2-step2');
        const step3 = document.getElementById('scene2-step3');
        const aabbBox = document.getElementById('scene2-aabb-box');
        
        function show(el) {
            el.style.display = '';
            // small delay to allow display to apply before opacity transition
            setTimeout(() => {
                el.style.opacity = '1';
            }, 10);
        }
        
        function hide(el) {
            el.style.opacity = '0';
            setTimeout(() => {
                if (el.style.opacity === '0') {
                    el.style.display = 'none';
                }
            }, 300);
        }
        
        function updateScene() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
            
            if (currentStep >= 1) show(step1); else hide(step1);
            if (currentStep >= 2) show(step2); else hide(step2);
            if (currentStep >= 3) {
                show(step3);
                aabbBox.classList.add('box-highlight');
                aabbBox.classList.remove('box');
            } else {
                hide(step3);
                aabbBox.classList.remove('box-highlight');
                aabbBox.classList.add('box');
            }
        }
        
        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });
        
        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });
        
        // Initial setup
        updateScene();
    })();
    </script>
</body>
</html>
