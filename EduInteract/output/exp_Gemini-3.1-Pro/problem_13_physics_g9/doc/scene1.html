<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>隔离法分析木块A与B之间的静摩擦力</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* SVG Styles */
        .scene1-element { transition: opacity 0.5s ease, transform 0.5s ease; }
        .scene1-dimmed { opacity: 0.3; }
        .scene1-hidden { opacity: 0; pointer-events: none; }
        
        /* Animations */
        @keyframes moveWeight5 {
            0% { transform: translate(0, 0); }
            30% { transform: translate(0, -210px); } /* y=150, dy = 150 - 360 = -210 */
            70% { transform: translate(265px, -210px); } /* x=385, dx = 385 - 120 = 265 */
            100% { transform: translate(265px, -170px); } /* y=190, dy = 190 - 360 = -170 */
        }
        .scene1-animate-weight5 {
            animation: moveWeight5 2s forwards;
        }
        
        .label-div {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-family: sans-serif;
        }
        .label-div-italic {
            font-size: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <defs>
                <marker id="scene1-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0" />
                </marker>
                <marker id="scene1-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828" />
                </marker>
                <pattern id="scene1-hatch" patternUnits="userSpaceOnUse" width="20" height="10">
                    <line x1="0" y1="0" x2="10" y2="10" stroke="#000" stroke-width="1" />
                </pattern>
            </defs>

            <!-- Background Elements (will be dimmed in step 1) -->
            <g id="scene1-bg-group" class="scene1-element">
                <!-- 实验台 -->
                <line x1="180" y1="320" x2="620" y2="320" stroke="#000" stroke-width="2" />
                <rect x="180" y="320" width="440" height="10" fill="url(#scene1-hatch)" />
                <line x1="180" y1="320" x2="180" y2="350" stroke="#000" stroke-width="2" />
                <line x1="620" y1="320" x2="620" y2="350" stroke="#000" stroke-width="2" />

                <!-- 木块B -->
                <rect x="320" y="260" width="160" height="60" fill="#fff" stroke="#000" stroke-width="2" />
                <foreignObject x="320" y="260" width="160" height="60">
                    <div xmlns="http://www.w3.org/1999/xhtml" class="label-div label-div-italic">B</div>
                </foreignObject>

                <!-- 左滑轮及支架 -->
                <line x1="150" y1="240" x2="180" y2="320" stroke="#000" stroke-width="2" />
                <circle cx="150" cy="240" r="15" fill="#fff" stroke="#000" stroke-width="2" />
                <circle cx="150" cy="240" r="2" fill="#000" />

                <!-- 右滑轮及支架 -->
                <line x1="650" y1="290" x2="620" y2="320" stroke="#000" stroke-width="2" />
                <circle cx="650" cy="290" r="15" fill="#fff" stroke="#000" stroke-width="2" />
                <circle cx="650" cy="290" r="2" fill="#000" />

                <!-- 绳子 -->
                <line x1="340" y1="225" x2="150" y2="225" stroke="#000" stroke-width="2" />
                <line x1="135" y1="240" x2="135" y2="330" stroke="#000" stroke-width="2" />
                <line x1="480" y1="275" x2="650" y2="275" stroke="#000" stroke-width="2" />
                <line x1="665" y1="290" x2="665" y2="330" stroke="#000" stroke-width="2" />

                <!-- 钩码4 -->
                <rect x="120" y="330" width="30" height="20" fill="#fff" stroke="#000" stroke-width="2" />
                <foreignObject x="120" y="330" width="30" height="20">
                    <div xmlns="http://www.w3.org/1999/xhtml" class="label-div">4</div>
                </foreignObject>
                <line x1="135" y1="350" x2="135" y2="360" stroke="#000" stroke-width="2" />

                <!-- 钩码1, 2, 3 -->
                <rect x="650" y="330" width="30" height="20" fill="#fff" stroke="#000" stroke-width="2" />
                <foreignObject x="650" y="330" width="30" height="20">
                    <div xmlns="http://www.w3.org/1999/xhtml" class="label-div">1</div>
                </foreignObject>
                <line x1="665" y1="350" x2="665" y2="360" stroke="#000" stroke-width="2" />

                <rect x="650" y="360" width="30" height="20" fill="#fff" stroke="#000" stroke-width="2" />
                <foreignObject x="650" y="360" width="30" height="20">
                    <div xmlns="http://www.w3.org/1999/xhtml" class="label-div">2</div>
                </foreignObject>
                <line x1="665" y1="380" x2="665" y2="390" stroke="#000" stroke-width="2" />

                <rect x="650" y="390" width="30" height="20" fill="#fff" stroke="#000" stroke-width="2" />
                <foreignObject x="650" y="390" width="30" height="20">
                    <div xmlns="http://www.w3.org/1999/xhtml" class="label-div">3</div>
                </foreignObject>
            </g>

            <!-- 木块A (Always visible) -->
            <g id="scene1-blockA-group" class="scene1-element">
                <rect x="340" y="210" width="120" height="50" fill="#fff" stroke="#000" stroke-width="2" />
                <foreignObject x="340" y="210" width="120" height="50">
                    <div xmlns="http://www.w3.org/1999/xhtml" class="label-div label-div-italic">A</div>
                </foreignObject>
            </g>

            <!-- 钩码5 (Moves in step 2) -->
            <g id="scene1-weight5-group" class="scene1-element">
                <rect x="120" y="360" width="30" height="20" fill="#fff" stroke="#000" stroke-width="2" />
                <foreignObject x="120" y="360" width="30" height="20">
                    <div xmlns="http://www.w3.org/1999/xhtml" class="label-div">5</div>
                </foreignObject>
            </g>

            <!-- 隔离框 (Step 1-3) -->
            <rect id="scene1-isolation-box" class="scene1-element scene1-hidden" x="335" y="185" width="130" height="80" fill="#1565c0" fill-opacity="0.1" stroke="#1565c0" stroke-width="2" stroke-dasharray="5,5" />

            <!-- 拉力 T_A (Step 1, 2) -->
            <g id="scene1-force-TA" class="scene1-element scene1-hidden">
                <line x1="400" y1="245" x2="300" y2="245" stroke="#1565c0" stroke-width="3" marker-end="url(#scene1-arrow-blue)" />
                <foreignObject x="320" y="210" width="50" height="30">
                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 16px; color: #1565c0;">\(T_A\)</div>
                </foreignObject>
            </g>

            <!-- 摩擦力 f_BA (Step 1, 2) -->
            <g id="scene1-force-fBA" class="scene1-element scene1-hidden">
                <line x1="400" y1="245" x2="500" y2="245" stroke="#c62828" stroke-width="3" marker-end="url(#scene1-arrow-red)" />
                <foreignObject x="450" y="210" width="50" height="30">
                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 16px; color: #c62828;">\(f_{BA}\)</div>
                </foreignObject>
            </g>

            <!-- 拉力 T_A' (Step 3) -->
            <g id="scene1-force-TA-prime" class="scene1-element scene1-hidden">
                <line x1="400" y1="245" x2="350" y2="245" stroke="#1565c0" stroke-width="3" marker-end="url(#scene1-arrow-blue)" />
                <foreignObject x="345" y="210" width="50" height="30">
                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 16px; color: #1565c0;">\(T_A'\)</div>
                </foreignObject>
            </g>

            <!-- 摩擦力 f_BA' (Step 3) -->
            <g id="scene1-force-fBA-prime" class="scene1-element scene1-hidden">
                <line x1="400" y1="245" x2="450" y2="245" stroke="#c62828" stroke-width="3" marker-end="url(#scene1-arrow-red)" />
                <foreignObject x="425" y="210" width="50" height="30">
                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 16px; color: #c62828;">\(f_{BA}'\)</div>
                </foreignObject>
            </g>

            <!-- 结论文本 (Step 3) -->
            <text id="scene1-conclusion" class="scene1-element scene1-hidden" x="400" y="100" font-size="24" fill="#c62828" text-anchor="middle" font-weight="bold">A、B间静摩擦力减小</text>

        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 3;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');

        const bgGroup = document.getElementById('scene1-bg-group');
        const weight5Group = document.getElementById('scene1-weight5-group');
        const isolationBox = document.getElementById('scene1-isolation-box');
        const forceTA = document.getElementById('scene1-force-TA');
        const forceFBA = document.getElementById('scene1-force-fBA');
        const forceTAPrime = document.getElementById('scene1-force-TA-prime');
        const forceFBAPrime = document.getElementById('scene1-force-fBA-prime');
        const conclusion = document.getElementById('scene1-conclusion');

        function updateScene() {
            // Reset all
            bgGroup.classList.remove('scene1-dimmed');
            weight5Group.classList.remove('scene1-dimmed');
            weight5Group.classList.remove('scene1-animate-weight5');
            weight5Group.style.transform = '';
            
            isolationBox.classList.add('scene1-hidden');
            forceTA.classList.add('scene1-hidden');
            forceFBA.classList.add('scene1-hidden');
            forceTAPrime.classList.add('scene1-hidden');
            forceFBAPrime.classList.add('scene1-hidden');
            conclusion.classList.add('scene1-hidden');

            if (currentStep >= 1) {
                bgGroup.classList.add('scene1-dimmed');
                isolationBox.classList.remove('scene1-hidden');
                if (currentStep === 1) {
                    weight5Group.classList.add('scene1-dimmed');
                }
            }

            if (currentStep === 1) {
                forceTA.classList.remove('scene1-hidden');
                forceFBA.classList.remove('scene1-hidden');
            }

            if (currentStep >= 2) {
                weight5Group.classList.add('scene1-animate-weight5');
            }

            if (currentStep === 2) {
                forceTA.classList.remove('scene1-hidden');
                forceFBA.classList.remove('scene1-hidden');
            }

            if (currentStep === 3) {
                forceTAPrime.classList.remove('scene1-hidden');
                forceFBAPrime.classList.remove('scene1-hidden');
                conclusion.classList.remove('scene1-hidden');
            }

            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });

        // Initialize
        updateScene();
    })();
    </script>
</body>
</html>
