<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 15px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene2-step-indicator { font-size: 14px; font-weight: bold; }
        
        /* SVG Elements */
        .scene2-element { transition: all 0.5s ease; }
        .scene2-bg-element { transition: opacity 0.5s ease; }
        .scene2-force { transition: all 0.5s ease; opacity: 0; }
        .scene2-highlight { transition: opacity 0.5s ease; opacity: 0; }
        .scene2-conclusion { transition: opacity 0.5s ease; opacity: 0; font-size: 20px; font-weight: bold; fill: #c62828; text-anchor: middle; }
        
        /* Specific elements */
        #scene2-weight5 { transition: transform 1s ease, opacity 0.5s ease; }
        #scene2-force-t-left, #scene2-force-t-right, #scene2-force-f { transition: all 0.5s ease; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500">
            <defs>
                <marker id="scene2-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0" />
                </marker>
                <marker id="scene2-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828" />
                </marker>
                <pattern id="scene2-hatch" patternUnits="userSpaceOnUse" width="10" height="10">
                    <path d="M-1,1 l2,-2 M0,10 l10,-10 M9,11 l2,-2" stroke="#000000" stroke-width="1" />
                </pattern>
            </defs>

            <!-- Background Elements (dimmable) -->
            <g id="scene2-bg-group" class="scene2-bg-element">
                <!-- Table -->
                <line x1="150" y1="300" x2="650" y2="300" stroke="#000000" stroke-width="2" />
                <rect x="150" y="300" width="500" height="10" fill="url(#scene2-hatch)" />
                <line x1="150" y1="300" x2="150" y2="330" stroke="#000000" stroke-width="2" />
                <line x1="650" y1="300" x2="650" y2="330" stroke="#000000" stroke-width="2" />

                <!-- Left Pulley & Bracket -->
                <line x1="150" y1="190" x2="170" y2="300" stroke="#000000" stroke-width="2" />
                <line x1="150" y1="190" x2="150" y2="300" stroke="#000000" stroke-width="2" />
                <circle cx="150" cy="190" r="15" fill="#ffffff" stroke="#000000" stroke-width="2" />
                <circle cx="150" cy="190" r="2" fill="#000000" />

                <!-- Right Pulley & Bracket -->
                <line x1="650" y1="260" x2="630" y2="300" stroke="#000000" stroke-width="2" />
                <line x1="650" y1="260" x2="650" y2="300" stroke="#000000" stroke-width="2" />
                <circle cx="650" cy="260" r="15" fill="#ffffff" stroke="#000000" stroke-width="2" />
                <circle cx="650" cy="260" r="2" fill="#000000" />

                <!-- Ropes -->
                <polyline points="340,175 150,175" stroke="#000000" stroke-width="2" fill="none" />
                <path d="M 150 175 A 15 15 0 0 0 135 190" stroke="#000000" stroke-width="2" fill="none" />
                <line x1="135" y1="190" x2="135" y2="320" stroke="#000000" stroke-width="2" />

                <polyline points="500,245 650,245" stroke="#000000" stroke-width="2" fill="none" />
                <path d="M 650 245 A 15 15 0 0 1 665 260" stroke="#000000" stroke-width="2" fill="none" />
                <line x1="665" y1="260" x2="665" y2="320" stroke="#000000" stroke-width="2" />

                <!-- Weights (except 5) -->
                <!-- Weight 4 -->
                <rect x="125" y="320" width="20" height="20" fill="#ffffff" stroke="#000000" stroke-width="2" />
                <text x="110" y="335" font-size="16" text-anchor="end" dominant-baseline="middle">4</text>
                
                <!-- Weight 1, 2, 3 -->
                <rect x="655" y="320" width="20" height="20" fill="#ffffff" stroke="#000000" stroke-width="2" />
                <text x="685" y="335" font-size="16" text-anchor="start" dominant-baseline="middle">1</text>
                
                <line x1="665" y1="340" x2="665" y2="350" stroke="#000000" stroke-width="2" />
                <rect x="655" y="350" width="20" height="20" fill="#ffffff" stroke="#000000" stroke-width="2" />
                <text x="685" y="365" font-size="16" text-anchor="start" dominant-baseline="middle">2</text>
                
                <line x1="665" y1="370" x2="665" y2="380" stroke="#000000" stroke-width="2" />
                <rect x="655" y="380" width="20" height="20" fill="#ffffff" stroke="#000000" stroke-width="2" />
                <text x="685" y="395" font-size="16" text-anchor="start" dominant-baseline="middle">3</text>
            </g>

            <!-- Weight 5 (moves) -->
            <g id="scene2-weight5-group" class="scene2-element">
                <line id="scene2-weight5-link" x1="135" y1="340" x2="135" y2="350" stroke="#000000" stroke-width="2" />
                <g id="scene2-weight5">
                    <rect x="125" y="350" width="20" height="20" fill="#ffffff" stroke="#000000" stroke-width="2" />
                    <text x="110" y="365" font-size="16" text-anchor="end" dominant-baseline="middle">5</text>
                </g>
            </g>

            <!-- Highlight Box -->
            <rect id="scene2-highlight-box" class="scene2-highlight" x="290" y="130" width="220" height="180" fill="#2e7d32" fill-opacity="0.1" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5,5" />

            <!-- Blocks A and B -->
            <g id="scene2-blocks-group">
                <rect x="300" y="220" width="200" height="80" fill="#ffffff" stroke="#000000" stroke-width="2" />
                <text x="400" y="260" font-size="24" font-style="italic" text-anchor="middle" dominant-baseline="middle">B</text>
                
                <rect x="340" y="160" width="120" height="60" fill="#ffffff" stroke="#000000" stroke-width="2" />
                <text x="400" y="190" font-size="24" font-style="italic" text-anchor="middle" dominant-baseline="middle">A</text>
            </g>

            <!-- Forces -->
            <g id="scene2-forces-group">
                <!-- T_left -->
                <line id="scene2-force-t-left" class="scene2-force" x1="290" y1="190" x2="230" y2="190" stroke="#1565c0" stroke-width="3" marker-end="url(#scene2-arrow-blue)" />
                <foreignObject id="scene2-label-t-left" class="scene2-force" x="220" y="155" width="60" height="30">
                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 16px; color: #1565c0; text-align: center;">\(T_左\)</div>
                </foreignObject>

                <!-- T_right -->
                <line id="scene2-force-t-right" class="scene2-force" x1="510" y1="260" x2="600" y2="260" stroke="#1565c0" stroke-width="3" marker-end="url(#scene2-arrow-blue)" />
                <foreignObject id="scene2-label-t-right" class="scene2-force" x="530" y="225" width="60" height="30">
                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 16px; color: #1565c0; text-align: center;">\(T_右\)</div>
                </foreignObject>

                <!-- f_ground -->
                <line id="scene2-force-f" class="scene2-force" x1="400" y1="315" x2="370" y2="315" stroke="#c62828" stroke-width="3" marker-end="url(#scene2-arrow-red)" />
                <foreignObject id="scene2-label-f" class="scene2-force" x="340" y="325" width="60" height="30">
                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 16px; color: #c62828; text-align: center;">\(f_{地}\)</div>
                </foreignObject>
            </g>

            <!-- Conclusion Text -->
            <text id="scene2-conclusion-text" class="scene2-conclusion" x="400" y="80">实验台与B间静摩擦力增大</text>
        </svg>

        <div id="scene2-controls">
            <button id="scene2-btn-prev" disabled>◀ 上一步</button>
            <span id="scene2-step-indicator">步骤 0 / 3</span>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 3;

        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        const stepIndicator = document.getElementById('scene2-step-indicator');

        const bgGroup = document.getElementById('scene2-bg-group');
        const weight5Link = document.getElementById('scene2-weight5-link');
        const weight5 = document.getElementById('scene2-weight5');
        const highlightBox = document.getElementById('scene2-highlight-box');
        
        const forceTLeft = document.getElementById('scene2-force-t-left');
        const labelTLeft = document.getElementById('scene2-label-t-left');
        const forceTRight = document.getElementById('scene2-force-t-right');
        const labelTRight = document.getElementById('scene2-label-t-right');
        const forceF = document.getElementById('scene2-force-f');
        const labelF = document.getElementById('scene2-label-f');
        
        const conclusionText = document.getElementById('scene2-conclusion-text');

        function updateScene() {
            // Update buttons
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
            stepIndicator.textContent = `步骤 ${currentStep} / ${maxStep}`;

            // Step 0: Initial
            if (currentStep === 0) {
                bgGroup.style.opacity = '1';
                weight5Link.style.opacity = '1';
                weight5.style.opacity = '1';
                weight5.style.transform = 'translate(0px, 0px)';
                
                highlightBox.style.opacity = '0';
                
                forceTLeft.style.opacity = '0';
                labelTLeft.style.opacity = '0';
                forceTRight.style.opacity = '0';
                labelTRight.style.opacity = '0';
                forceF.style.opacity = '0';
                labelF.style.opacity = '0';
                
                conclusionText.style.opacity = '0';
            }
            
            // Step 1: Highlight whole system, show forces
            if (currentStep === 1) {
                bgGroup.style.opacity = '0.3';
                weight5Link.style.opacity = '0.3';
                weight5.style.opacity = '0.3';
                weight5.style.transform = 'translate(0px, 0px)';
                
                highlightBox.style.opacity = '1';
                
                forceTLeft.style.opacity = '1';
                forceTLeft.setAttribute('x2', '230');
                labelTLeft.style.opacity = '1';
                labelTLeft.innerHTML = '<div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 16px; color: #1565c0; text-align: center;">\(T_左\)</div>';
                
                forceTRight.style.opacity = '1';
                labelTRight.style.opacity = '1';
                
                forceF.style.opacity = '1';
                forceF.setAttribute('x2', '370');
                labelF.style.opacity = '1';
                labelF.setAttribute('x', '340');
                labelF.innerHTML = '<div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 16px; color: #c62828; text-align: center;">\(f_{地}\)</div>';
                
                conclusionText.style.opacity = '0';
                
                if (window.MathJax) {
                    MathJax.typesetPromise([labelTLeft, labelF]);
                }
            }
            
            // Step 2: Move weight 5 to block A
            if (currentStep === 2) {
                bgGroup.style.opacity = '0.3';
                weight5Link.style.opacity = '0';
                weight5.style.opacity = '1';
                // Original pos: x=125, y=350. Target pos: x=390, y=140.
                // dx = 390 - 125 = 265, dy = 140 - 350 = -210
                weight5.style.transform = 'translate(265px, -210px)';
                
                highlightBox.style.opacity = '1';
                
                forceTLeft.style.opacity = '1';
                forceTLeft.setAttribute('x2', '230');
                labelTLeft.style.opacity = '1';
                labelTLeft.innerHTML = '<div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 16px; color: #1565c0; text-align: center;">\(T_左\)</div>';
                
                forceTRight.style.opacity = '1';
                labelTRight.style.opacity = '1';
                
                forceF.style.opacity = '1';
                forceF.setAttribute('x2', '370');
                labelF.style.opacity = '1';
                labelF.setAttribute('x', '340');
                labelF.innerHTML = '<div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 16px; color: #c62828; text-align: center;">\(f_{地}\)</div>';
                
                conclusionText.style.opacity = '0';
                
                if (window.MathJax) {
                    MathJax.typesetPromise([labelTLeft, labelF]);
                }
            }
            
            // Step 3: Change forces and show conclusion
            if (currentStep === 3) {
                bgGroup.style.opacity = '0.3';
                weight5Link.style.opacity = '0';
                weight5.style.opacity = '1';
                weight5.style.transform = 'translate(265px, -210px)';
                
                highlightBox.style.opacity = '1';
                
                forceTLeft.style.opacity = '1';
                forceTLeft.setAttribute('x2', '260'); // Shorter
                labelTLeft.style.opacity = '1';
                labelTLeft.innerHTML = '<div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 16px; color: #1565c0; text-align: center;">\((T_左')\)</div>';
                
                forceTRight.style.opacity = '1';
                labelTRight.style.opacity = '1';
                
                forceF.style.opacity = '1';
                forceF.setAttribute('x2', '340'); // Longer
                labelF.style.opacity = '1';
                labelF.setAttribute('x', '310');
                labelF.innerHTML = '<div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 16px; color: #c62828; text-align: center;">\(f_{地}'\)</div>';
                
                conclusionText.style.opacity = '1';
                
                if (window.MathJax) {
                    MathJax.typesetPromise([labelTLeft, labelF]);
                }
            }
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });

        // Initialize
        updateScene();
    })();
    </script>
</body>
</html>
