<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>果蝇染色体组成及基因定位</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button:hover:not(:disabled) { background: #e9e9e9; }
        .transition { transition: all 0.3s ease; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <!-- Definitions -->
            <defs>
                <marker id="scene1-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828" />
                </marker>
                <marker id="scene1-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0" />
                </marker>
            </defs>

            <!-- Chromosomes Background (Black outline) -->
            <g stroke="#000000" stroke-width="22" stroke-linecap="round" fill="none">
                <path d="M 300 100 Q 280 180 200 240" /> <!-- 3 -->
                <path d="M 340 120 Q 320 200 240 260" /> <!-- 4 -->
                <path d="M 460 120 Q 480 200 560 260" /> <!-- 5 -->
                <path d="M 500 100 Q 520 180 600 240" /> <!-- 6 -->
                <path d="M 380 280 L 350 400" /> <!-- 1 -->
                <path d="M 420 280 L 440 380 Q 450 410 470 380 L 480 350" /> <!-- 2 -->
            </g>
            <g fill="#000000">
                <circle cx="370" cy="230" r="11" /> <!-- 7 -->
                <circle cx="430" cy="230" r="11" /> <!-- 8 -->
            </g>

            <!-- Chromosomes Foreground -->
            <g stroke-width="20" stroke-linecap="round" fill="none" class="transition">
                <path id="scene1-chr3" d="M 300 100 Q 280 180 200 240" stroke="#dbdbdb" />
                <path id="scene1-chr4" d="M 340 120 Q 320 200 240 260" stroke="#dbdbdb" />
                <path id="scene1-chr5" d="M 460 120 Q 480 200 560 260" stroke="#dbdbdb" />
                <path id="scene1-chr6" d="M 500 100 Q 520 180 600 240" stroke="#dbdbdb" />
                <path id="scene1-chr1" d="M 380 280 L 350 400" stroke="#dbdbdb" />
                <path id="scene1-chr2" d="M 420 280 L 440 380 Q 450 410 470 380 L 480 350" stroke="#dbdbdb" />
            </g>
            <g class="transition">
                <circle id="scene1-chr7" cx="370" cy="230" r="10" fill="#dbdbdb" />
                <circle id="scene1-chr8" cx="430" cy="230" r="10" fill="#dbdbdb" />
            </g>

            <!-- Gene Highlights -->
            <circle id="scene1-hl-E" cx="372.5" cy="310" r="15" fill="none" stroke="#fbc02d" stroke-width="3" opacity="0" class="transition" />

            <!-- Genes (White lines) -->
            <g stroke="#ffffff" stroke-width="2" stroke-linecap="round">
                <line x1="277" y1="135" x2="295" y2="143" /> <!-- B -->
                <line x1="229" y1="202" x2="243" y2="216" /> <!-- v -->
                <line x1="317" y1="155" x2="335" y2="163" /> <!-- b -->
                <line x1="269" y1="222" x2="283" y2="236" /> <!-- V -->
                <line x1="465" y1="163" x2="483" y2="155" /> <!-- R -->
                <line x1="505" y1="143" x2="523" y2="135" /> <!-- r -->
                <line x1="362.5" y1="307.5" x2="382.5" y2="312.5" /> <!-- E -->
            </g>

            <!-- Base Labels -->
            <g font-size="16" fill="#000000" font-family="sans-serif" text-anchor="middle" dominant-baseline="middle">
                <text x="180" y="250">3</text>
                <text x="220" y="280">4</text>
                <text x="580" y="280">5</text>
                <text x="620" y="250">6</text>
                <text x="370" y="210">7</text>
                <text x="430" y="210">8</text>
                <text x="340" y="420">1</text>
                <text x="460" y="420">2</text>
                
                <text x="226" y="95">B</text>
                <text x="196" y="185">v</text>
                <text x="346" y="165">b</text>
                <text x="336" y="275">V</text>
                <text x="454" y="155">R</text>
                <text x="584" y="95">r</text>
                <text x="340" y="315">E</text>
            </g>

            <!-- Step 1 Annotations -->
            <g id="scene1-step1-anno" opacity="0" class="transition">
                <text x="280" y="400" font-size="16" fill="#c62828" text-anchor="middle">X染色体</text>
                <line x1="315" y1="400" x2="345" y2="400" stroke="#c62828" stroke-width="1.5" stroke-dasharray="4,2" />
                
                <text x="520" y="400" font-size="16" fill="#c62828" text-anchor="middle">Y染色体</text>
                <line x1="485" y1="400" x2="455" y2="400" stroke="#c62828" stroke-width="1.5" stroke-dasharray="4,2" />
                
                <text x="400" y="460" font-size="16" fill="#c62828" text-anchor="middle">同源染色体</text>
                <path d="M 360 430 Q 400 440 440 430" fill="none" stroke="#c62828" stroke-width="1.5" />
            </g>

            <!-- Step 2 Annotations -->
            <g id="scene1-step2-anno" opacity="0" class="transition">
                <text x="150" y="315" font-size="16" fill="#c62828" text-anchor="middle">伴性遗传基因</text>
                <line x1="310" y1="315" x2="350" y2="315" stroke="#c62828" stroke-width="1.5" marker-end="url(#scene1-arrow-red)" />
            </g>

            <!-- Step 3 Annotations -->
            <g id="scene1-step3-anno" opacity="0" class="transition">
                <text x="400" y="70" font-size="16" fill="#1565c0" text-anchor="middle">常染色体</text>
                <path d="M 360 70 Q 300 70 280 100" fill="none" stroke="#1565c0" stroke-width="1.5" marker-end="url(#scene1-arrow-blue)" />
                <path d="M 440 70 Q 500 70 520 100" fill="none" stroke="#1565c0" stroke-width="1.5" marker-end="url(#scene1-arrow-blue)" />
            </g>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let state = 0;
        const maxState = 3;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');

        const chr1 = document.getElementById('scene1-chr1');
        const chr2 = document.getElementById('scene1-chr2');
        const chr3 = document.getElementById('scene1-chr3');
        const chr4 = document.getElementById('scene1-chr4');
        const chr5 = document.getElementById('scene1-chr5');
        const chr6 = document.getElementById('scene1-chr6');
        const chr7 = document.getElementById('scene1-chr7');
        const chr8 = document.getElementById('scene1-chr8');

        const hlE = document.getElementById('scene1-hl-E');
        
        const step1Anno = document.getElementById('scene1-step1-anno');
        const step2Anno = document.getElementById('scene1-step2-anno');
        const step3Anno = document.getElementById('scene1-step3-anno');

        function update() {
            // Reset all
            [chr1, chr2, chr3, chr4, chr5, chr6].forEach(el => el.setAttribute('stroke', '#dbdbdb'));
            [chr7, chr8].forEach(el => el.setAttribute('fill', '#dbdbdb'));
            
            hlE.style.opacity = '0';
            step1Anno.style.opacity = '0';
            step2Anno.style.opacity = '0';
            step3Anno.style.opacity = '0';

            if (state === 1 || state === 2) {
                chr1.setAttribute('stroke', '#c62828');
                chr2.setAttribute('stroke', '#c62828');
                step1Anno.style.opacity = '1';
            }
            if (state === 2) {
                hlE.style.opacity = '1';
                step2Anno.style.opacity = '1';
            }
            if (state === 3) {
                chr3.setAttribute('stroke', '#1565c0');
                chr4.setAttribute('stroke', '#1565c0');
                chr5.setAttribute('stroke', '#1565c0');
                chr6.setAttribute('stroke', '#1565c0');
                chr7.setAttribute('fill', '#1565c0');
                chr8.setAttribute('fill', '#1565c0');
                step3Anno.style.opacity = '1';
            }

            btnPrev.disabled = state === 0;
            btnNext.disabled = state === maxState;
        }

        btnPrev.addEventListener('click', () => {
            if (state > 0) {
                state--;
                update();
            }
        });

        btnNext.addEventListener('click', () => {
            if (state < maxState) {
                state++;
                update();
            }
        });

        update();
    })();
    </script>
</body>
</html>
