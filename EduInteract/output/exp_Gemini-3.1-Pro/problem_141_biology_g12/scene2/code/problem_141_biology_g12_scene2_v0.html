<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 6px 12px; font-size: 14px; cursor: pointer; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .step-element { transition: opacity 0.3s ease; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500">
            <!-- 基础定义 -->
            <defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#000" />
                </marker>
                <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0" />
                </marker>
                <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828" />
                </marker>
            </defs>

            <!-- 步骤0：初始状态 -->
            <g id="scene2-step0" class="step-element">
                <!-- 细胞a -->
                <circle cx="120" cy="60" r="25" fill="none" stroke="#000" stroke-width="1"/>
                <line x1="112" y1="45" x2="112" y2="65" stroke="#000" stroke-width="1.5"/>
                <circle cx="112" cy="55" r="2" fill="#000"/>
                <line x1="128" y1="45" x2="128" y2="65" stroke="#000" stroke-width="1.5"/>
                <circle cx="128" cy="55" r="2" fill="#000"/>
                <circle cx="120" cy="75" r="4" fill="none" stroke="#000" stroke-width="1"/>
                <circle cx="120" cy="71" r="1.5" fill="#000"/>
                <text x="120" y="100" text-anchor="middle" font-size="14">a</text>

                <!-- 细胞b -->
                <circle cx="260" cy="60" r="25" fill="none" stroke="#000" stroke-width="1"/>
                <line x1="252" y1="45" x2="252" y2="65" stroke="#000" stroke-width="1.5"/>
                <circle cx="252" cy="55" r="2" fill="#000"/>
                <line x1="268" y1="45" x2="268" y2="65" stroke="#000" stroke-width="1.5"/>
                <circle cx="260" cy="75" r="4" fill="none" stroke="#000" stroke-width="1"/>
                <circle cx="260" cy="71" r="1.5" fill="#000"/>
                <text x="260" y="100" text-anchor="middle" font-size="14">b</text>

                <!-- 细胞c -->
                <circle cx="400" cy="60" r="25" fill="none" stroke="#000" stroke-width="1"/>
                <line x1="392" y1="45" x2="392" y2="65" stroke="#000" stroke-width="1.5"/>
                <line x1="408" y1="45" x2="408" y2="65" stroke="#000" stroke-width="1.5"/>
                <circle cx="400" cy="75" r="4" fill="none" stroke="#000" stroke-width="1"/>
                <circle cx="400" cy="71" r="1.5" fill="#000"/>
                <text x="400" y="100" text-anchor="middle" font-size="14">c</text>

                <!-- 细胞d -->
                <circle cx="540" cy="60" r="25" fill="none" stroke="#000" stroke-width="1"/>
                <line x1="532" y1="45" x2="532" y2="65" stroke="#000" stroke-width="1.5"/>
                <circle cx="532" cy="55" r="2" fill="#000"/>
                <line x1="548" y1="45" x2="548" y2="65" stroke="#000" stroke-width="1.5"/>
                <circle cx="548" cy="55" r="2" fill="#000"/>
                <circle cx="540" cy="75" r="4" fill="none" stroke="#000" stroke-width="1"/>
                <text x="540" y="100" text-anchor="middle" font-size="14">d</text>

                <!-- 细胞e -->
                <circle cx="680" cy="60" r="25" fill="none" stroke="#000" stroke-width="1"/>
                <line x1="672" y1="45" x2="672" y2="65" stroke="#000" stroke-width="1.5"/>
                <circle cx="672" cy="55" r="2" fill="#000"/>
                <line x1="688" y1="45" x2="688" y2="65" stroke="#000" stroke-width="1.5"/>
                <circle cx="680" cy="75" r="4" fill="none" stroke="#000" stroke-width="1"/>
                <text x="680" y="100" text-anchor="middle" font-size="14">e</text>

                <!-- 标题 -->
                <text x="200" y="140" text-anchor="middle" font-size="16" font-weight="bold">实验① (自交)</text>
                <text x="600" y="140" text-anchor="middle" font-size="16" font-weight="bold">实验② (作父本杂交)</text>
            </g>

            <!-- 步骤1：实验①左侧分支 -->
            <g id="scene2-step1" class="step-element" style="opacity: 0; display: none;">
                <path d="M 200 150 L 130 165" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
                <text x="130" y="180" text-anchor="middle" font-size="14">a, b, c (含线粒体S基因)</text>
                
                <path d="M 130 190 L 130 220" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
                <text x="130" y="235" text-anchor="middle" font-size="14" fill="#1565c0">母系遗传</text>
                
                <path d="M 130 245 L 130 280" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
                <rect x="90" y="285" width="80" height="30" fill="#ffffff" stroke="#2e7d32" stroke-width="1"/>
                
            </g>

            <!-- 步骤2：实验①右侧分支 -->
            <g id="scene2-step2" class="step-element" style="opacity: 0; display: none;">
                <path d="M 200 150 L 310 165" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
                <text x="310" y="180" text-anchor="middle" font-size="14">d, e (无线粒体S基因)</text>
                
                <path d="M 310 190 L 260 230" stroke="#c62828" stroke-width="1.5" marker-end="url(#arrow-red)"/>
                <text x="260" y="245" text-anchor="middle" font-size="14" fill="#c62828">d (SS)</text>
                <path d="M 260 255 L 260 280" stroke="#c62828" stroke-width="1.5" marker-end="url(#arrow-red)"/>
                <rect x="220" y="285" width="80" height="30" fill="#ffffff" stroke="#2e7d32" stroke-width="1"/>
                <text x="260" y="305" text-anchor="middle" font-size="14">100%抗病</text>

                <path d="M 310 190 L 360 230" stroke="#c62828" stroke-width="1.5" marker-end="url(#arrow-red)"/>
                <text x="360" y="245" text-anchor="middle" font-size="14" fill="#c62828">e (S-)</text>
                <path d="M 360 255 L 360 280" stroke="#c62828" stroke-width="1.5" marker-end="url(#arrow-red)"/>
                <rect x="320" y="285" width="80" height="30" fill="#ffffff" stroke="#888888" stroke-width="1"/>
                <text x="360" y="305" text-anchor="middle" font-size="14">3:1分离</text>
                
                <text x="360" y="335" text-anchor="middle" font-size="12" fill="#c62828">区分出 e</text>
            </g>

            <!-- 步骤3：实验②精卵结合图 -->
            <g id="scene2-step3" class="step-element" style="opacity: 0; display: none;">
                <path d="M 600 150 L 600 165" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
                
                <!-- 精子 -->
                <ellipse cx="570" cy="180" rx="10" ry="6" fill="none" stroke="#000" stroke-width="1"/>
                <path d="M 580 180 Q 590 175 600 180" fill="none" stroke="#000" stroke-width="1"/>
                <!-- 精子线粒体红叉 -->
                <line x1="575" y1="175" x2="585" y2="185" stroke="#c62828" stroke-width="2"/>
                <line x1="585" y1="175" x2="575" y2="185" stroke="#c62828" stroke-width="2"/>
                
                <!-- 卵子 -->
                <circle cx="620" cy="180" r="15" fill="none" stroke="#000" stroke-width="1"/>
                
                <text x="640" y="185" text-anchor="start" font-size="12" fill="#c62828">精子线粒体不进入卵细胞</text>
            </g>

            <!-- 步骤4：实验②核基因传递分支 -->
            <g id="scene2-step4" class="step-element" style="opacity: 0; display: none;">
                <path d="M 600 200 L 600 210" stroke="#c62828" stroke-width="1.5" marker-end="url(#arrow-red)"/>
                <text x="600" y="225" text-anchor="middle" font-size="14" fill="#c62828">仅核基因传递</text>
                
                <path d="M 600 235 L 500 260" stroke="#c62828" stroke-width="1.5" marker-end="url(#arrow-red)"/>
                <text x="500" y="275" text-anchor="middle" font-size="14" fill="#c62828">a, d (SS)</text>
                <path d="M 500 285 L 500 310" stroke="#c62828" stroke-width="1.5" marker-end="url(#arrow-red)"/>
                <rect x="460" y="315" width="80" height="30" fill="#ffffff" stroke="#2e7d32" stroke-width="1"/>
                <text x="500" y="335" text-anchor="middle" font-size="14">100%抗病</text>

                <path d="M 600 235 L 600 260" stroke="#c62828" stroke-width="1.5" marker-end="url(#arrow-red)"/>
                <text x="600" y="275" text-anchor="middle" font-size="14" fill="#c62828">b, e (S-)</text>
                <path d="M 600 285 L 600 310" stroke="#c62828" stroke-width="1.5" marker-end="url(#arrow-red)"/>
                <rect x="560" y="315" width="80" height="30" fill="#ffffff" stroke="#888888" stroke-width="1"/>
                <text x="600" y="335" text-anchor="middle" font-size="14">1:1分离</text>

                <path d="M 600 235 L 700 260" stroke="#c62828" stroke-width="1.5" marker-end="url(#arrow-red)"/>
                <text x="700" y="275" text-anchor="middle" font-size="14" fill="#c62828">c (--)</text>
                <path d="M 700 285 L 700 310" stroke="#c62828" stroke-width="1.5" marker-end="url(#arrow-red)"/>
                <rect x="660" y="315" width="80" height="30" fill="#ffffff" stroke="#888888" stroke-width="1"/>
                <text x="700" y="335" text-anchor="middle" font-size="14">0%抗病</text>
            </g>

            <!-- 步骤5：交集筛选结论 -->
            <g id="scene2-step5" class="step-element" style="opacity: 0; display: none;">
                <rect x="85" y="280" width="90" height="40" fill="none" stroke="#2e7d32" stroke-width="3" rx="4"/>
                <rect x="215" y="280" width="90" height="40" fill="none" stroke="#2e7d32" stroke-width="3" rx="4"/>
                <rect x="455" y="310" width="90" height="40" fill="none" stroke="#2e7d32" stroke-width="3" rx="4"/>
                
                <text x="400" y="400" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e7d32">交集筛选: 两次实验均表现为 100%抗病 的株系为 a, d</text>
            </g>
        </svg>

        <div id="scene2-controls">
            <button id="scene2-prevBtn" disabled>◀ 上一步</button>
            <button id="scene2-nextBtn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const totalSteps = 5;
        
        const prevBtn = document.getElementById('scene2-prevBtn');
        const nextBtn = document.getElementById('scene2-nextBtn');
        
        function show(el) {
            if (!el) return;
            el.style.display = 'block';
            // 强制重绘以触发过渡
            el.getBoundingClientRect();
            el.style.opacity = '1';
        }
        
        function hide(el) {
            if (!el) return;
            el.style.opacity = '0';
            setTimeout(() => {
                if (el.style.opacity === '0') {
                    el.style.display = 'none';
                }
            }, 300);
        }

        function updateStep() {
            prevBtn.disabled = currentStep === 0;
            nextBtn.disabled = currentStep === totalSteps;
            
            for (let i = 1; i <= totalSteps; i++) {
                const el = document.getElementById(`scene2-step${i}`);
                if (i <= currentStep) {
                    show(el);
                } else {
                    hide(el);
                }
            }
        }

        prevBtn.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentStep < totalSteps) {
                currentStep++;
                updateStep();
            }
        });
        
        // 初始化显示
        updateStep();
    })();
    </script>
</body>
</html>
