<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .node-rect { fill: #f0f0f0; stroke: #000; stroke-width: 1.5; rx: 5; ry: 5; }
        .node-rect.grass { fill: #e8f5e9; }
        .node-text { font-size: 14px; text-anchor: middle; dominant-baseline: central; fill: #000; }
        .edge { fill: none; stroke: #000; stroke-width: 1.5; marker-end: url(#arrow); transition: stroke 0.3s; }
        .energy-label { font-size: 14px; font-weight: bold; text-anchor: middle; dominant-baseline: central; opacity: 0; transition: opacity 0.3s; }
        .energy-label.green { fill: #2e7d32; }
        .energy-label.blue { fill: #1565c0; }
        .energy-label.red { fill: #c62828; }
        .formula-panel { position: absolute; top: 380px; left: 50px; width: 700px; height: 60px; display: flex; flex-direction: column; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s; font-size: 16px; }
        .formula-panel.blue { color: #1565c0; }
        .formula-panel.red { color: #c62828; }
        .highlight-blue { stroke: #1565c0; stroke-width: 2.5; }
        .highlight-red { stroke: #c62828; stroke-width: 2.5; }
        .node-highlight-green { stroke: #2e7d32; stroke-width: 3; }
        .node-highlight-red { stroke: #c62828; stroke-width: 3; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#000" />
                </marker>
                <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0" />
                </marker>
                <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828" />
                </marker>
            </defs>

            <!-- Edges -->
            <path id="edge-grass-antelope" class="edge" d="M 100 200 L 215 80" />
            <path id="edge-grass-zebra" class="edge" d="M 100 200 L 215 200" />
            <path id="edge-grass-mouse" class="edge" d="M 100 200 L 220 320" />
            
            <path id="edge-antelope-dog" class="edge" d="M 265 80 L 425 140" />
            <path id="edge-antelope-lion" class="edge" d="M 265 80 Q 470 20 675 200" />
            
            <path id="edge-zebra-dog" class="edge" d="M 265 200 L 425 140" />
            <path id="edge-zebra-lion" class="edge" d="M 265 200 Q 470 280 675 200" />
            
            <path id="edge-mouse-snake" class="edge" d="M 260 320 L 380 320" />
            <path id="edge-snake-eater" class="edge" d="M 420 320 L 510 320" />
            <path id="edge-eater-lion" class="edge" d="M 590 320 L 675 200" />
            <path id="edge-dog-lion" class="edge" d="M 475 140 L 675 200" />

            <!-- Nodes -->
            <g id="node-grass" transform="translate(80, 200)">
                <rect x="-20" y="-15" width="40" height="30" class="node-rect grass" id="rect-grass" />
                <text class="node-text">草</text>
            </g>
            <g id="node-antelope" transform="translate(240, 80)">
                <rect x="-25" y="-15" width="50" height="30" class="node-rect" />
                <text class="node-text">羚羊</text>
            </g>
            <g id="node-zebra" transform="translate(240, 200)">
                <rect x="-25" y="-15" width="50" height="30" class="node-rect" />
                <text class="node-text">斑马</text>
            </g>
            <g id="node-mouse" transform="translate(240, 320)">
                <rect x="-20" y="-15" width="40" height="30" class="node-rect" id="rect-mouse" />
                <text class="node-text">鼠</text>
            </g>
            <g id="node-dog" transform="translate(450, 140)">
                <rect x="-25" y="-15" width="50" height="30" class="node-rect" />
                <text class="node-text">野狗</text>
            </g>
            <g id="node-snake" transform="translate(400, 320)">
                <rect x="-20" y="-15" width="40" height="30" class="node-rect" />
                <text class="node-text">蛇</text>
            </g>
            <g id="node-eater" transform="translate(550, 320)">
                <rect x="-40" y="-15" width="80" height="30" class="node-rect" />
                <text class="node-text">食蛇动物</text>
            </g>
            <g id="node-lion" transform="translate(700, 200)">
                <rect x="-25" y="-15" width="50" height="30" class="node-rect" />
                <text class="node-text">狮子</text>
            </g>

            <!-- Energy Labels -->
            <text id="energy-grass" class="energy-label green" x="80" y="235">300</text>
            
            <text id="energy-antelope" class="energy-label blue" x="240" y="45">10</text>
            <text id="energy-zebra" class="energy-label blue" x="240" y="165">10</text>
            <text id="energy-mouse" class="energy-label blue" x="240" y="355">10</text>
            
            <text id="energy-dog" class="energy-label blue" x="450" y="50">1</text>
            <text id="energy-snake" class="energy-label blue" x="400" y="355">1</text>
            <text id="energy-eater" class="energy-label blue" x="550" y="355">0.1</text>
            <text id="energy-lion" class="energy-label blue" x="750" y="200">1.11</text>

        </svg>

        <div id="formula-panel" class="formula-panel">
            <div id="formula-text"></div>
            <div id="formula-conclusion" style="margin-top: 5px; font-weight: bold; display: none;"></div>
        </div>

        <div id="scene1-controls">
            <button id="btn-prev" disabled>◀ 上一步</button>
            <button id="btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 4;

        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const formulaPanel = document.getElementById('formula-panel');
        const formulaText = document.getElementById('formula-text');
        const formulaConclusion = document.getElementById('formula-conclusion');

        const rectGrass = document.getElementById('rect-grass');
        const rectMouse = document.getElementById('rect-mouse');

        const edges = {
            primary: ['edge-grass-antelope', 'edge-grass-zebra', 'edge-grass-mouse'],
            secondary: ['edge-antelope-dog', 'edge-antelope-lion', 'edge-zebra-dog', 'edge-zebra-lion', 'edge-mouse-snake', 'edge-snake-eater', 'edge-eater-lion', 'edge-dog-lion']
        };

        const energies = {
            grass: document.getElementById('energy-grass'),
            antelope: document.getElementById('energy-antelope'),
            zebra: document.getElementById('energy-zebra'),
            mouse: document.getElementById('energy-mouse'),
            dog: document.getElementById('energy-dog'),
            snake: document.getElementById('energy-snake'),
            eater: document.getElementById('energy-eater'),
            lion: document.getElementById('energy-lion')
        };

        function setEdgeStyle(id, styleClass, marker) {
            const el = document.getElementById(id);
            el.className.baseVal = `edge ${styleClass}`;
            el.setAttribute('marker-end', `url(#${marker})`);
        }

        function updateEnergy(id, text, colorClass) {
            const el = energies[id];
            el.textContent = text;
            el.className.baseVal = `energy-label ${colorClass}`;
            el.style.opacity = 1;
        }

        function hideEnergy(id) {
            energies[id].style.opacity = 0;
        }

        function renderStep(step) {
            // Reset all
            rectGrass.classList.remove('node-highlight-green');
            rectMouse.classList.remove('node-highlight-red');
            
            [...edges.primary, ...edges.secondary].forEach(id => setEdgeStyle(id, '', 'arrow'));
            
            Object.keys(energies).forEach(hideEnergy);
            formulaPanel.style.opacity = 0;
            formulaConclusion.style.display = 'none';

            if (step >= 0) {
                rectGrass.classList.add('node-highlight-green');
                updateEnergy('grass', '300', 'green');
            }

            if (step === 1) {
                edges.primary.forEach(id => setEdgeStyle(id, 'highlight-blue', 'arrow-blue'));
                updateEnergy('antelope', '10', 'blue');
                updateEnergy('zebra', '10', 'blue');
                updateEnergy('mouse', '10', 'blue');
            }

            if (step === 2) {
                edges.primary.forEach(id => setEdgeStyle(id, 'highlight-blue', 'arrow-blue'));
                edges.secondary.forEach(id => setEdgeStyle(id, 'highlight-blue', 'arrow-blue'));
                
                updateEnergy('antelope', '10', 'blue');
                updateEnergy('zebra', '10', 'blue');
                updateEnergy('mouse', '10', 'blue');
                
                updateEnergy('dog', '1', 'blue');
                updateEnergy('snake', '1', 'blue');
                updateEnergy('eater', '0.1', 'blue');
                updateEnergy('lion', '1.11', 'blue');

                formulaPanel.className = 'formula-panel blue';
                formulaText.innerHTML = '狮子获得能量 = 0.5(羚羊) + 0.5(斑马) + 0.1(野狗) + 0.01(食蛇动物) = 1.11 万千焦';
                formulaPanel.style.opacity = 1;
            }

            if (step === 3) {
                rectMouse.classList.add('node-highlight-red');
                edges.primary.forEach(id => setEdgeStyle(id, 'highlight-red', 'arrow-red'));
                
                updateEnergy('antelope', '5', 'red');
                updateEnergy('zebra', '5', 'red');
                updateEnergy('mouse', '20', 'red');
            }

            if (step === 4) {
                rectMouse.classList.add('node-highlight-red');
                edges.primary.forEach(id => setEdgeStyle(id, 'highlight-red', 'arrow-red'));
                edges.secondary.forEach(id => setEdgeStyle(id, 'highlight-red', 'arrow-red'));
                
                updateEnergy('antelope', '5', 'red');
                updateEnergy('zebra', '5', 'red');
                updateEnergy('mouse', '20', 'red');
                
                updateEnergy('dog', '0.5', 'red');
                updateEnergy('snake', '2', 'red');
                updateEnergy('eater', '0.2', 'red');
                updateEnergy('lion', '0.57', 'red');

                formulaPanel.className = 'formula-panel red';
                formulaText.innerHTML = '狮子获得能量 = 0.25(羚羊) + 0.25(斑马) + 0.05(野狗) + 0.02(食蛇动物) = 0.57 万千焦';
                formulaConclusion.innerHTML = '面积需求 = 1.11 / 0.57 &approx; 1.95 倍';
                formulaConclusion.style.display = 'block';
                formulaPanel.style.opacity = 1;
            }

            btnPrev.disabled = step === 0;
            btnNext.disabled = step === maxStep;
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                renderStep(currentStep);
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                renderStep(currentStep);
            }
        });

        // Init
        renderStep(0);
    })();
    </script>
</body>
</html>
