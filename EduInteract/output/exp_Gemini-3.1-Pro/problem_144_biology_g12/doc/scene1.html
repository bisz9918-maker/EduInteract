<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .step-element { transition: opacity 0.5s ease; }
        .hidden { opacity: 0; pointer-events: none; }
        .visible { opacity: 1; pointer-events: auto; }
        
        text { font-size: 16px; fill: #000; }
        .text-red { fill: #c62828; }
        .text-blue { fill: #1565c0; }
        .text-bold { font-weight: bold; }
        .text-large { font-size: 24px; }
        
        .line-main { stroke: #000; stroke-width: 2; fill: none; }
        .line-blue { stroke: #1565c0; stroke-width: 2; fill: none; }
        .line-dash { stroke: #888; stroke-width: 1; stroke-dasharray: 5,5; fill: none; }
        
        .box-red { stroke: #c62828; stroke-width: 2; fill: none; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500">
            <defs>
                <marker id="arrow-black" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#000" />
                </marker>
                <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0" />
                </marker>
                
                <!-- 果蝇图标 -->
                <g id="scene1-icon-bar">
                    <ellipse cx="10" cy="10" rx="6" ry="10" fill="#ccc" />
                    <ellipse cx="4" cy="10" rx="8" ry="4" fill="#e0e0e0" opacity="0.7" transform="rotate(-30 4 10)" />
                    <ellipse cx="16" cy="10" rx="8" ry="4" fill="#e0e0e0" opacity="0.7" transform="rotate(30 16 10)" />
                    <rect x="6" y="2" width="2" height="6" fill="#c62828" />
                    <rect x="12" y="2" width="2" height="6" fill="#c62828" />
                </g>
                <g id="scene1-icon-round">
                    <ellipse cx="10" cy="10" rx="6" ry="10" fill="#ccc" />
                    <ellipse cx="4" cy="10" rx="8" ry="4" fill="#e0e0e0" opacity="0.7" transform="rotate(-30 4 10)" />
                    <ellipse cx="16" cy="10" rx="8" ry="4" fill="#e0e0e0" opacity="0.7" transform="rotate(30 16 10)" />
                    <circle cx="7" cy="5" r="2.5" fill="#c62828" />
                    <circle cx="13" cy="5" r="2.5" fill="#c62828" />
                </g>
            </defs>

            <!-- 分隔线 -->
            <line x1="400" y1="40" x2="400" y2="360" class="line-dash" />

            <!-- Step 0: 左侧内容 -->
            <g id="scene1-step0" class="step-element visible">
                <text x="60" y="100" text-anchor="middle">P</text>
                <use href="#scene1-icon-bar" x="130" y="85" />
                <text x="175" y="100" text-anchor="middle">♀棒眼</text>
                <text x="220" y="100" text-anchor="middle">×</text>
                <text x="265" y="100" text-anchor="middle">♂圆眼</text>
                <use href="#scene1-icon-round" x="300" y="85" />
                
                <line x1="220" y1="110" x2="220" y2="150" class="line-main" marker-end="url(#arrow-black)" />
                
                <text x="60" y="180" text-anchor="middle">F1</text>
                <text x="220" y="180" text-anchor="middle">___眼(♀ ♂)</text>
                
                <line x1="220" y1="190" x2="220" y2="250" class="line-main" marker-end="url(#arrow-black)" />
                <text x="230" y="225" text-anchor="start">F1 雌雄交配</text>
                
                <text x="60" y="280" text-anchor="middle">F2</text>
                <text x="120" y="280" text-anchor="middle">♀圆眼</text>
                <text x="185" y="280" text-anchor="middle">♀棒眼</text>
                <text x="250" y="280" text-anchor="middle">♂圆眼</text>
                <text x="315" y="280" text-anchor="middle">♂棒眼</text>
                
                <text x="120" y="320" text-anchor="middle">1</text>
                <text x="152" y="320" text-anchor="middle">:</text>
                <text x="185" y="320" text-anchor="middle">1</text>
                <text x="217" y="320" text-anchor="middle">:</text>
                <text x="250" y="320" text-anchor="middle">1</text>
                <text x="282" y="320" text-anchor="middle">:</text>
                <text x="315" y="320" text-anchor="middle">1</text>
                
                <text x="220" y="40" text-anchor="middle" class="text-red">已知条件：纯种亲本</text>
                <rect x="100" y="300" width="235" height="25" class="box-red" transform="translate(0, -20)" />
            </g>

            <!-- Step 1: 右侧标题及P代 -->
            <g id="scene1-step1" class="step-element hidden">
                <text x="600" y="50" text-anchor="middle" class="text-blue text-bold">假设：控制眼型的基因位于常染色体</text>
                <text x="430" y="100" text-anchor="middle" class="text-blue">P</text>
                <use href="#scene1-icon-bar" x="490" y="85" />
                <text x="535" y="100" text-anchor="middle" class="text-blue">AA</text>
                <text x="600" y="100" text-anchor="middle" class="text-blue">×</text>
                <text x="665" y="100" text-anchor="middle" class="text-blue">aa</text>
                <use href="#scene1-icon-round" x="690" y="85" />
            </g>

            <!-- Step 2: 右侧F1代 -->
            <g id="scene1-step2" class="step-element hidden">
                <line x1="535" y1="110" x2="590" y2="150" class="line-blue" marker-end="url(#arrow-blue)" />
                <line x1="665" y1="110" x2="610" y2="150" class="line-blue" marker-end="url(#arrow-blue)" />
                <text x="430" y="180" text-anchor="middle" class="text-blue">F1</text>
                <text x="600" y="180" text-anchor="middle" class="text-blue">Aa (表型一致)</text>
            </g>

            <!-- Step 3: 右侧F2代 -->
            <g id="scene1-step3" class="step-element hidden">
                <line x1="600" y1="190" x2="600" y2="250" class="line-blue" marker-end="url(#arrow-blue)" />
                <text x="610" y="225" text-anchor="start" class="text-blue">雌雄交配</text>
                <text x="430" y="280" text-anchor="middle" class="text-blue">F2</text>
                <text x="600" y="280" text-anchor="middle" class="text-blue">1AA : 2Aa : 1aa</text>
                <text x="600" y="320" text-anchor="middle" class="text-blue">理论表型比例 3 : 1</text>
            </g>

            <!-- Step 4: 底部对比与结论 -->
            <g id="scene1-step4" class="step-element hidden">
                <text x="220" y="400" text-anchor="middle" class="text-red">实际比例 1:1:1:1</text>
                <text x="600" y="400" text-anchor="middle" class="text-blue">理论比例 3:1</text>
                <text x="400" y="405" text-anchor="middle" class="text-red text-large">❌</text>
                <text x="400" y="460" text-anchor="middle" class="text-red text-bold">结论：假设不成立，不可能位于常染色体</text>
            </g>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 4;
        
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        
        function updateSteps() {
            for (let i = 1; i <= maxStep; i++) {
                const el = document.getElementById(`scene1-step${i}`);
                if (i <= currentStep) {
                    el.classList.remove('hidden');
                    el.classList.add('visible');
                } else {
                    el.classList.remove('visible');
                    el.classList.add('hidden');
                }
            }
            
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
        }
        
        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateSteps();
            }
        });
        
        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateSteps();
            }
        });
    })();
    </script>
</body>
</html>
