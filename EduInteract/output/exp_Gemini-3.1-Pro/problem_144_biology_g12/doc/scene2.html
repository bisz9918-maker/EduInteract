<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        button { padding: 6px 12px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene2-hidden { opacity: 0; pointer-events: none; }
        .scene2-element { transition: opacity 0.3s ease; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500">
            <defs>
                <marker id="scene2-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
                </marker>
            </defs>
            
            <!-- 静态元素 -->
            <text x="400" y="50" font-size="24" text-anchor="middle" fill="#000000">假设基因位于X染色体，推导显隐性</text>
            <line x1="400" y1="85" x2="400" y2="435" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" />
            <text x="230" y="95" font-size="20" text-anchor="middle" fill="#000000">假设一：棒眼显性</text>
            <text x="620" y="95" font-size="20" text-anchor="middle" fill="#000000">假设二：圆眼显性</text>

            <!-- 步骤1：左侧 P -->
            <g id="scene2-step1" class="scene2-element scene2-hidden">
                <text x="60" y="155" font-size="18" text-anchor="middle" fill="#000000">P</text>
                <text x="230" y="155" font-size="18" text-anchor="middle" fill="#000000">♀ 棒眼(X<tspan dy="-8" font-size="0.7em">B</tspan><tspan dy="8"> </tspan>X<tspan dy="-8" font-size="0.7em">B</tspan><tspan dy="8"> </tspan>) × ♂ 圆眼(X<tspan dy="-8" font-size="0.7em">b</tspan><tspan dy="8"> </tspan>Y)</text>
            </g>

            <!-- 步骤2：左侧 F1, F2, 结论 -->
            <g id="scene2-step2" class="scene2-element scene2-hidden">
                <line x1="230" y1="170" x2="230" y2="200" stroke="#000000" stroke-width="2" marker-end="url(#scene2-arrow)" />
                <text x="60" y="225" font-size="18" text-anchor="middle" fill="#000000">F₁</text>
                <text x="230" y="225" font-size="18" text-anchor="middle" fill="#000000">♀ 棒眼(X<tspan dy="-8" font-size="0.7em">B</tspan><tspan dy="8"> </tspan>X<tspan dy="-8" font-size="0.7em">b</tspan><tspan dy="8"> </tspan>) ♂ 棒眼(X<tspan dy="-8" font-size="0.7em">B</tspan><tspan dy="8"> </tspan>Y)</text>
                
                <line x1="230" y1="240" x2="230" y2="270" stroke="#000000" stroke-width="2" marker-end="url(#scene2-arrow)" />
                <text x="60" y="295" font-size="18" text-anchor="middle" fill="#000000">F₂</text>
                <text x="230" y="295" font-size="16" text-anchor="middle" fill="#1565c0">X<tspan dy="-8" font-size="0.7em">B</tspan><tspan dy="8"> </tspan>X<tspan dy="-8" font-size="0.7em">B</tspan><tspan dy="8"> </tspan> : X<tspan dy="-8" font-size="0.7em">B</tspan><tspan dy="8"> </tspan>X<tspan dy="-8" font-size="0.7em">b</tspan><tspan dy="8"> </tspan> : X<tspan dy="-8" font-size="0.7em">B</tspan><tspan dy="8"> </tspan>Y : X<tspan dy="-8" font-size="0.7em">b</tspan><tspan dy="8"> </tspan>Y</text>
                <text x="230" y="335" font-size="16" text-anchor="middle" fill="#000000">♀棒眼 : ♂棒眼 : ♂圆眼 = 2 : 1 : 1</text>
                <text x="230" y="385" font-size="18" text-anchor="middle" fill="#c62828">❌ 与实际F₂比例不符</text>
            </g>

            <!-- 步骤3：右侧 P -->
            <g id="scene2-step3" class="scene2-element scene2-hidden">
                <text x="440" y="155" font-size="18" text-anchor="middle" fill="#000000">P</text>
                <text x="620" y="155" font-size="18" text-anchor="middle" fill="#000000">♀ 棒眼(X<tspan dy="-8" font-size="0.7em">b</tspan><tspan dy="8"> </tspan>X<tspan dy="-8" font-size="0.7em">b</tspan><tspan dy="8"> </tspan>) × ♂ 圆眼(X<tspan dy="-8" font-size="0.7em">B</tspan><tspan dy="8"> </tspan>Y)</text>
            </g>

            <!-- 步骤4：右侧 F1 -->
            <g id="scene2-step4" class="scene2-element scene2-hidden">
                <line x1="620" y1="170" x2="620" y2="200" stroke="#000000" stroke-width="2" marker-end="url(#scene2-arrow)" />
                <text x="440" y="225" font-size="18" text-anchor="middle" fill="#000000">F₁</text>
                <text x="620" y="225" font-size="18" text-anchor="middle" fill="#000000">♀ 圆眼(X<tspan dy="-8" font-size="0.7em">B</tspan><tspan dy="8"> </tspan>X<tspan dy="-8" font-size="0.7em">b</tspan><tspan dy="8"> </tspan>) ♂ 棒眼(X<tspan dy="-8" font-size="0.7em">b</tspan><tspan dy="8"> </tspan>Y)</text>
            </g>

            <!-- 步骤5：右侧 F2, 结论 -->
            <g id="scene2-step5" class="scene2-element scene2-hidden">
                <line x1="620" y1="240" x2="620" y2="270" stroke="#000000" stroke-width="2" marker-end="url(#scene2-arrow)" />
                <text x="440" y="295" font-size="18" text-anchor="middle" fill="#000000">F₂</text>
                <text x="620" y="295" font-size="16" text-anchor="middle" fill="#1565c0">X<tspan dy="-8" font-size="0.7em">B</tspan><tspan dy="8"> </tspan>X<tspan dy="-8" font-size="0.7em">b</tspan><tspan dy="8"> </tspan> : X<tspan dy="-8" font-size="0.7em">b</tspan><tspan dy="8"> </tspan>X<tspan dy="-8" font-size="0.7em">b</tspan><tspan dy="8"> </tspan> : X<tspan dy="-8" font-size="0.7em">B</tspan><tspan dy="8"> </tspan>Y : X<tspan dy="-8" font-size="0.7em">b</tspan><tspan dy="8"> </tspan>Y</text>
                <text x="620" y="335" font-size="16" text-anchor="middle" fill="#000000">♀圆眼 : ♀棒眼 : ♂圆眼 : ♂棒眼 = 1:1:1:1</text>
                <text x="620" y="385" font-size="18" text-anchor="middle" fill="#2e7d32">✅ 与实际F₂比例相符，棒眼为隐性</text>
            </g>
        </svg>

        <div id="scene2-controls">
            <button id="scene2-btn-prev" disabled>◀ 上一步</button>
            <span id="scene2-step-indicator">步骤 0 / 5</span>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>
    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 5;
        
        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        const stepIndicator = document.getElementById('scene2-step-indicator');
        
        function updateScene() {
            stepIndicator.textContent = `步骤 ${currentStep} / ${maxStep}`;
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
            
            for (let i = 1; i <= maxStep; i++) {
                const el = document.getElementById(`scene2-step${i}`);
                if (el) {
                    if (i <= currentStep) {
                        el.classList.remove('scene2-hidden');
                    } else {
                        el.classList.add('scene2-hidden');
                    }
                }
            }
        }
        
        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });
        
        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });
        
        // 初始化
        updateScene();
    })();
    </script>
</body>
</html>
