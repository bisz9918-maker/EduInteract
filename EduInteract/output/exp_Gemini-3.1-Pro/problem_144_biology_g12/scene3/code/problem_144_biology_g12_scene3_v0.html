<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        
        .scene3-box { fill: #ffffff; stroke: #888888; stroke-width: 2; transition: all 0.3s; }
        .scene3-box-active { fill: rgba(21, 101, 192, 0.1); stroke: #1565c0; }
        
        .scene3-text { font-size: 16px; fill: #333333; text-anchor: middle; }
        .scene3-text-title { font-size: 20px; font-weight: bold; fill: #333333; text-anchor: middle; }
        .scene3-text-concl { font-size: 16px; font-weight: bold; fill: #2e7d32; text-anchor: middle; }
        .scene3-text-main-concl { font-size: 18px; font-weight: bold; fill: #1565c0; text-anchor: middle; }
        
        .scene3-line { fill: none; stroke: #1565c0; stroke-width: 2; }
        .scene3-line-child { fill: none; stroke: #000000; stroke-width: 2; }
        
        button {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #ccc;
            background: #f8f9fa;
            border-radius: 4px;
            transition: all 0.2s;
        }
        button:hover { background: #e2e6ea; }
        button.active { background: #1565c0; color: white; border-color: #1565c0; }
        
        .state-group { transition: opacity 0.3s; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg width="800" height="500">
            <defs>
                <marker id="scene3-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0" />
                </marker>
                <marker id="scene3-arrow-black" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
                </marker>
                <rect id="base-box" width="120" height="60" rx="5" />
            </defs>
            
            <!-- Title -->
            <text x="400" y="45" class="scene3-text-title">F2代果蝇候选亲本</text>
            
            <!-- Boxes -->
            <g id="scene3-box1-group">
                <use href="#base-box" id="scene3-box1" x="100" y="60" class="scene3-box" />
                <text x="160" y="82" class="scene3-text" pointer-events="none">♀ 圆眼</text>
                <text x="160" y="108" class="scene3-text" pointer-events="none">X<tspan baseline-shift="super" font-size="0.7em">B</tspan> X<tspan baseline-shift="super" font-size="0.7em">b</tspan></text>
            </g>
            
            <g id="scene3-box2-group">
                <use href="#base-box" id="scene3-box2" x="260" y="60" class="scene3-box" />
                <text x="320" y="82" class="scene3-text" pointer-events="none">♀ 棒眼</text>
                <text x="320" y="108" class="scene3-text" pointer-events="none">X<tspan baseline-shift="super" font-size="0.7em">b</tspan> X<tspan baseline-shift="super" font-size="0.7em">b</tspan></text>
            </g>
            
            <g id="scene3-box3-group">
                <use href="#base-box" id="scene3-box3" x="420" y="60" class="scene3-box" />
                <text x="480" y="82" class="scene3-text" pointer-events="none">♂ 圆眼</text>
                <text x="480" y="108" class="scene3-text" pointer-events="none">X<tspan baseline-shift="super" font-size="0.7em">B</tspan> Y</text>
            </g>
            
            <g id="scene3-box4-group">
                <use href="#base-box" id="scene3-box4" x="580" y="60" class="scene3-box" />
                <text x="640" y="82" class="scene3-text" pointer-events="none">♂ 棒眼</text>
                <text x="640" y="108" class="scene3-text" pointer-events="none">X<tspan baseline-shift="super" font-size="0.7em">b</tspan> Y</text>
            </g>
            
            <!-- Common Cross Arrow -->
            <text x="400" y="215" class="scene3-text">×</text>
            <polyline points="400,230 400,270" class="scene3-line-child" marker-end="url(#scene3-arrow-black)" />
            
            <!-- State 1 Group -->
            <g id="scene3-state1" class="state-group" style="opacity: 1; display: block;">
                <!-- Parent Lines -->
                <polyline points="320,120 320,150 300,150 300,190" class="scene3-line" marker-end="url(#scene3-arrow-blue)" />
                <polyline points="480,120 480,150 500,150 500,190" class="scene3-line" marker-end="url(#scene3-arrow-blue)" />
                
                <!-- Parents -->
                <text x="300" y="215" class="scene3-text">♀ 棒眼 (X<tspan baseline-shift="super" font-size="0.7em">b</tspan> X<tspan baseline-shift="super" font-size="0.7em">b</tspan>)</text>
                <text x="500" y="215" class="scene3-text">♂ 圆眼 (X<tspan baseline-shift="super" font-size="0.7em">B</tspan> Y)</text>
                
                <!-- Child Lines -->
                <polyline points="400,270 400,285 300,285 300,300" class="scene3-line-child" marker-end="url(#scene3-arrow-black)" />
                <polyline points="400,270 400,285 500,285 500,300" class="scene3-line-child" marker-end="url(#scene3-arrow-black)" />
                
                <!-- Children -->
                <text x="300" y="320" class="scene3-text">♀ 圆眼 (X<tspan baseline-shift="super" font-size="0.7em">B</tspan> X<tspan baseline-shift="super" font-size="0.7em">b</tspan>)</text>
                <text x="300" y="360" class="scene3-text-concl">全为圆眼</text>
                
                <text x="500" y="320" class="scene3-text">♂ 棒眼 (X<tspan baseline-shift="super" font-size="0.7em">b</tspan> Y)</text>
                <text x="500" y="360" class="scene3-text-concl">全为棒眼</text>
                
                <!-- Conclusion -->
                <text x="400" y="415" class="scene3-text-main-concl">结论：交叉遗传验证</text>
            </g>
            
            <!-- State 2 Group -->
            <g id="scene3-state2" class="state-group" style="opacity: 0; display: none;">
                <!-- Parent Lines -->
                <polyline points="160,120 160,150 300,150 300,190" class="scene3-line" marker-end="url(#scene3-arrow-blue)" />
                <polyline points="480,120 480,150 500,150 500,190" class="scene3-line" marker-end="url(#scene3-arrow-blue)" />
                
                <!-- Parents -->
                <text x="300" y="215" class="scene3-text">♀ 圆眼 (X<tspan baseline-shift="super" font-size="0.7em">B</tspan> X<tspan baseline-shift="super" font-size="0.7em">b</tspan>)</text>
                <text x="500" y="215" class="scene3-text">♂ 圆眼 (X<tspan baseline-shift="super" font-size="0.7em">B</tspan> Y)</text>
                
                <!-- Child Lines -->
                <polyline points="400,270 400,285 220,285 220,300" class="scene3-line-child" marker-end="url(#scene3-arrow-black)" />
                <polyline points="400,270 400,285 430,285 430,300" class="scene3-line-child" marker-end="url(#scene3-arrow-black)" />
                <polyline points="400,270 400,285 570,285 570,300" class="scene3-line-child" marker-end="url(#scene3-arrow-black)" />
                
                <!-- Children -->
                <text x="220" y="320" class="scene3-text">♀ 圆眼 (X<tspan baseline-shift="super" font-size="0.7em">B</tspan> X<tspan baseline-shift="super" font-size="0.7em">B</tspan>, X<tspan baseline-shift="super" font-size="0.7em">B</tspan> X<tspan baseline-shift="super" font-size="0.7em">b</tspan>)</text>
                <text x="220" y="360" class="scene3-text-concl">全为圆眼</text>
                
                <text x="430" y="320" class="scene3-text">♂ 圆眼 (X<tspan baseline-shift="super" font-size="0.7em">B</tspan> Y)</text>
                <text x="570" y="320" class="scene3-text">♂ 棒眼 (X<tspan baseline-shift="super" font-size="0.7em">b</tspan> Y)</text>
                <text x="500" y="360" class="scene3-text-concl">圆眼 : 棒眼 = 1 : 1</text>
                
                <!-- Conclusion -->
                <text x="400" y="415" class="scene3-text-main-concl">结论：性状分离验证</text>
            </g>
        </svg>
        
        <div id="scene3-controls">
            <button id="scene3-btn-state1" class="active">组合一 (交叉遗传)</button>
            <button id="scene3-btn-state2">组合二 (性状分离)</button>
        </div>
    </div>
    <script>
    (function() {
        const btnState1 = document.getElementById('scene3-btn-state1');
        const btnState2 = document.getElementById('scene3-btn-state2');
        const state1Group = document.getElementById('scene3-state1');
        const state2Group = document.getElementById('scene3-state2');
        
        const box1 = document.getElementById('scene3-box1');
        const box2 = document.getElementById('scene3-box2');
        const box3 = document.getElementById('scene3-box3');
        const box4 = document.getElementById('scene3-box4');
        
        function showState(state) {
            if (state === 1) {
                btnState1.classList.add('active');
                btnState2.classList.remove('active');
                
                state2Group.style.opacity = '0';
                setTimeout(() => {
                    state2Group.style.display = 'none';
                    state1Group.style.display = 'block';
                    // trigger reflow
                    void state1Group.offsetWidth;
                    state1Group.style.opacity = '1';
                }, 300);
                
                box1.classList.remove('scene3-box-active');
                box2.classList.add('scene3-box-active');
                box3.classList.add('scene3-box-active');
                box4.classList.remove('scene3-box-active');
            } else {
                btnState2.classList.add('active');
                btnState1.classList.remove('active');
                
                state1Group.style.opacity = '0';
                setTimeout(() => {
                    state1Group.style.display = 'none';
                    state2Group.style.display = 'block';
                    // trigger reflow
                    void state2Group.offsetWidth;
                    state2Group.style.opacity = '1';
                }, 300);
                
                box1.classList.add('scene3-box-active');
                box2.classList.remove('scene3-box-active');
                box3.classList.add('scene3-box-active');
                box4.classList.remove('scene3-box-active');
            }
        }
        
        btnState1.addEventListener('click', () => showState(1));
        btnState2.addEventListener('click', () => showState(2));
        
        // Initialize
        showState(1);
    })();
    </script>
</body>
</html>
