<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .step-group { display: none; opacity: 0; transition: opacity 0.3s; }
        .step-group.active { display: block; opacity: 1; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <!-- Step 0 -->
            <g id="scene1-step0" class="step-group active">
                <circle cx="400" cy="220" r="150" fill="none" stroke="#000" stroke-width="2"/>
                <!-- Autosomes -->
                <path d="M 380 120 Q 400 100 420 120" fill="none" stroke="#999" stroke-width="6" stroke-linecap="round"/>
                <path d="M 380 140 Q 400 160 420 140" fill="none" stroke="#999" stroke-width="6" stroke-linecap="round"/>
                
                <path d="M 300 200 Q 280 220 300 240" fill="none" stroke="#999" stroke-width="6" stroke-linecap="round"/>
                <path d="M 320 200 Q 340 220 320 240" fill="none" stroke="#999" stroke-width="6" stroke-linecap="round"/>
                
                <path d="M 500 200 Q 520 220 500 240" fill="none" stroke="#999" stroke-width="6" stroke-linecap="round"/>
                <path d="M 480 200 Q 460 220 480 240" fill="none" stroke="#999" stroke-width="6" stroke-linecap="round"/>
                
                <!-- Sex chromosomes (XX) -->
                <line x1="380" y1="320" x2="380" y2="280" stroke="#1565c0" stroke-width="6" stroke-linecap="round"/>
                <line x1="420" y1="320" x2="420" y2="280" stroke="#1565c0" stroke-width="6" stroke-linecap="round"/>
                
                <!-- Chromosome sets highlight -->
                <rect x="260" y="80" width="130" height="280" fill="none" stroke="#888" stroke-width="2" stroke-dasharray="5,5" rx="10"/>
                <rect x="410" y="80" width="130" height="280" fill="none" stroke="#888" stroke-width="2" stroke-dasharray="5,5" rx="10"/>
                
                <text x="400" y="400" text-anchor="middle" font-size="16">正常果蝇体细胞 (2n=8)</text>
            </g>

            <!-- Step 1 -->
            <g id="scene1-step1" class="step-group">
                <!-- Meiosis I -->
                <circle cx="250" cy="220" r="120" fill="none" stroke="#000" stroke-width="2"/>
                <line x1="250" y1="100" x2="250" y2="340" stroke="#ccc" stroke-width="1" stroke-dasharray="4,4"/>
                <!-- Chromosomes aligned at metaphase plate -->
                <path d="M 230 140 Q 210 150 230 160" fill="none" stroke="#999" stroke-width="6" stroke-linecap="round"/>
                <path d="M 270 140 Q 290 150 270 160" fill="none" stroke="#999" stroke-width="6" stroke-linecap="round"/>
                
                <path d="M 230 190 Q 210 200 230 210" fill="none" stroke="#999" stroke-width="6" stroke-linecap="round"/>
                <path d="M 270 190 Q 290 200 270 210" fill="none" stroke="#999" stroke-width="6" stroke-linecap="round"/>
                
                <path d="M 230 240 Q 210 250 230 260" fill="none" stroke="#999" stroke-width="6" stroke-linecap="round"/>
                <path d="M 270 240 Q 290 250 270 260" fill="none" stroke="#999" stroke-width="6" stroke-linecap="round"/>
                
                <line x1="230" y1="290" x2="230" y2="310" stroke="#1565c0" stroke-width="6" stroke-linecap="round"/>
                <line x1="270" y1="290" x2="270" y2="310" stroke="#1565c0" stroke-width="6" stroke-linecap="round"/>
                
                <text x="250" y="370" text-anchor="middle" font-size="16">减I中期 (2个染色体组)</text>

                <!-- Meiosis II -->
                <circle cx="550" cy="220" r="120" fill="none" stroke="#000" stroke-width="2"/>
                <!-- Chromosomes moving to poles -->
                <path d="M 500 140 Q 480 150 500 160" fill="none" stroke="#999" stroke-width="6" stroke-linecap="round"/>
                <path d="M 600 140 Q 620 150 600 160" fill="none" stroke="#999" stroke-width="6" stroke-linecap="round"/>
                
                <path d="M 500 190 Q 480 200 500 210" fill="none" stroke="#999" stroke-width="6" stroke-linecap="round"/>
                <path d="M 600 190 Q 620 200 600 210" fill="none" stroke="#999" stroke-width="6" stroke-linecap="round"/>
                
                <path d="M 500 240 Q 480 250 500 260" fill="none" stroke="#999" stroke-width="6" stroke-linecap="round"/>
                <path d="M 600 240 Q 620 250 600 260" fill="none" stroke="#999" stroke-width="6" stroke-linecap="round"/>
                
                <line x1="500" y1="290" x2="500" y2="310" stroke="#1565c0" stroke-width="6" stroke-linecap="round"/>
                <line x1="600" y1="290" x2="600" y2="310" stroke="#1565c0" stroke-width="6" stroke-linecap="round"/>
                
                <text x="550" y="370" text-anchor="middle" font-size="16">减II后期 (8条染色体)</text>
            </g>

            <!-- Step 2 -->
            <g id="scene1-step2" class="step-group">
                <circle cx="400" cy="220" r="120" fill="none" stroke="#000" stroke-width="2"/>
                <!-- X1 -->
                <line x1="360" y1="200" x2="360" y2="240" stroke="#1565c0" stroke-width="6" stroke-linecap="round"/>
                <!-- Move text outside the circle to avoid overlap -->
                <text x="260" y="225" text-anchor="end" font-size="16">X<tspan dy="-5" font-size="12">r</tspan></text>
                <line x1="270" y1="220" x2="350" y2="220" stroke="#000" stroke-width="1" stroke-dasharray="2,2"/>
                <!-- X2 -->
                <line x1="400" y1="200" x2="400" y2="240" stroke="#1565c0" stroke-width="6" stroke-linecap="round"/>
                <text x="400" y="80" text-anchor="middle" font-size="16">X<tspan dy="-5" font-size="12">r</tspan></text>
                <line x1="400" y1="90" x2="400" y2="190" stroke="#000" stroke-width="1" stroke-dasharray="2,2"/>
                <!-- Y -->
                <path d="M 440 200 L 440 230 Q 440 240 450 240" fill="none" stroke="#c62828" stroke-width="6" stroke-linecap="round"/>
                <text x="540" y="225" text-anchor="start" font-size="16">Y</text>
                <line x1="460" y1="220" x2="530" y2="220" stroke="#000" stroke-width="1" stroke-dasharray="2,2"/>
                
                <text x="400" y="370" text-anchor="middle" font-size="16">XXY白眼雌果蝇性染色体联会</text>
            </g>

            <!-- Step 3 -->
            <g id="scene1-step3" class="step-group">
                <text x="400" y="40" text-anchor="middle" font-size="16">情况1：两条X染色体配对分离，Y随机移向一极</text>
                <circle cx="400" cy="140" r="80" fill="none" stroke="#000" stroke-width="2"/>
                <circle cx="300" cy="310" r="60" fill="none" stroke="#000" stroke-width="2"/>
                <circle cx="500" cy="310" r="60" fill="none" stroke="#000" stroke-width="2"/>
                
                <line x1="380" y1="220" x2="320" y2="250" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
                <line x1="420" y1="220" x2="480" y2="250" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
                
                <!-- Mother cell chromosomes -->
                <g id="scene1-step3-chroms">
                    <line id="scene1-s3-x1" x1="380" y1="120" x2="380" y2="160" stroke="#1565c0" stroke-width="6" stroke-linecap="round"/>
                    <line id="scene1-s3-x2" x1="420" y1="120" x2="420" y2="160" stroke="#1565c0" stroke-width="6" stroke-linecap="round"/>
                    <path id="scene1-s3-y" d="M 400 120 L 400 150 Q 400 160 410 160" fill="none" stroke="#c62828" stroke-width="6" stroke-linecap="round"/>
                </g>
                
                <!-- Gamete 1 -->
                <text x="300" y="400" text-anchor="middle" font-size="16">X<tspan dy="-5" font-size="12">r</tspan></text>
                <!-- Gamete 2 -->
                <text x="500" y="400" text-anchor="middle" font-size="16">X<tspan dy="-5" font-size="12">r</tspan>Y</text>
            </g>

            <!-- Step 4 -->
            <g id="scene1-step4" class="step-group">
                <text x="400" y="40" text-anchor="middle" font-size="16">情况2：一条X与Y配对分离，另一条X随机移向一极</text>
                <circle cx="400" cy="140" r="80" fill="none" stroke="#000" stroke-width="2"/>
                <circle cx="300" cy="310" r="60" fill="none" stroke="#000" stroke-width="2"/>
                <circle cx="500" cy="310" r="60" fill="none" stroke="#000" stroke-width="2"/>
                
                <line x1="380" y1="220" x2="320" y2="250" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
                <line x1="420" y1="220" x2="480" y2="250" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
                
                <!-- Mother cell chromosomes -->
                <g id="scene1-step4-chroms">
                    <line id="scene1-s4-x1" x1="380" y1="120" x2="380" y2="160" stroke="#1565c0" stroke-width="6" stroke-linecap="round"/>
                    <line id="scene1-s4-x2" x1="400" y1="120" x2="400" y2="160" stroke="#1565c0" stroke-width="6" stroke-linecap="round"/>
                    <path id="scene1-s4-y" d="M 420 120 L 420 150 Q 420 160 430 160" fill="none" stroke="#c62828" stroke-width="6" stroke-linecap="round"/>
                </g>

                <!-- Gamete 3 -->
                <text x="300" y="400" text-anchor="middle" font-size="16">X<tspan dy="-5" font-size="12">r</tspan>X<tspan dy="-5" font-size="12">r</tspan></text>
                <!-- Gamete 4 -->
                <text x="500" y="400" text-anchor="middle" font-size="16">Y</text>
            </g>

            <!-- Step 5 -->
            <g id="scene1-step5" class="step-group">
                <text x="400" y="60" text-anchor="middle" font-size="16">测交棋盘：X<tspan dy="-5" font-size="12">r</tspan>X<tspan dy="-5" font-size="12">r</tspan>Y × X<tspan dy="-5" font-size="12">R</tspan>Y</text>
                
                <!-- Eggs -->
                <circle cx="100" cy="160" r="35" fill="none" stroke="#000" stroke-width="2"/>
                <text x="100" y="220" text-anchor="middle" font-size="16">X<tspan dy="-5" font-size="12">r</tspan></text>
                
                <circle cx="220" cy="160" r="35" fill="none" stroke="#000" stroke-width="2"/>
                <text x="220" y="220" text-anchor="middle" font-size="16">X<tspan dy="-5" font-size="12">r</tspan>Y</text>
                
                <circle cx="100" cy="280" r="35" fill="none" stroke="#000" stroke-width="2"/>
                <text x="100" y="340" text-anchor="middle" font-size="16">X<tspan dy="-5" font-size="12">r</tspan>X<tspan dy="-5" font-size="12">r</tspan></text>
                
                <circle cx="220" cy="280" r="35" fill="none" stroke="#000" stroke-width="2"/>
                <text x="220" y="340" text-anchor="middle" font-size="16">Y</text>
                
                <!-- Checkerboard -->
                <!-- Highlight behind text -->
                <!-- Use lines instead of rect to avoid text overlap with rect -->
                <line x1="340" y1="150" x2="740" y2="150" stroke="#000" stroke-width="2"/>
                <line x1="340" y1="310" x2="740" y2="310" stroke="#000" stroke-width="2"/>
                <line x1="340" y1="150" x2="340" y2="310" stroke="#000" stroke-width="2"/>
                <line x1="740" y1="150" x2="740" y2="310" stroke="#000" stroke-width="2"/>
                
                <line x1="340" y1="230" x2="740" y2="230" stroke="#000" stroke-width="2"/>
                <line x1="440" y1="150" x2="440" y2="310" stroke="#000" stroke-width="2"/>
                <line x1="540" y1="150" x2="540" y2="310" stroke="#000" stroke-width="2"/>
                <line x1="640" y1="150" x2="640" y2="310" stroke="#000" stroke-width="2"/>
                
                <!-- Headers -->
                <text x="390" y="130" text-anchor="middle" font-size="16">X<tspan dy="-5" font-size="12">r</tspan></text>
                <text x="490" y="130" text-anchor="middle" font-size="16">X<tspan dy="-5" font-size="12">r</tspan>Y</text>
                <text x="590" y="130" text-anchor="middle" font-size="16">X<tspan dy="-5" font-size="12">r</tspan>X<tspan dy="-5" font-size="12">r</tspan></text>
                <text x="690" y="130" text-anchor="middle" font-size="16">Y</text>
                
                <text x="310" y="195" text-anchor="end" font-size="16">X<tspan dy="-5" font-size="12">R</tspan></text>
                <text x="310" y="275" text-anchor="end" font-size="16">Y</text>
                
                <!-- Cells -->
                <text x="390" y="195" text-anchor="middle" font-size="16">X<tspan dy="-5" font-size="12">R</tspan>X<tspan dy="-5" font-size="12">r</tspan></text>
                <text x="490" y="195" text-anchor="middle" font-size="16">X<tspan dy="-5" font-size="12">R</tspan>X<tspan dy="-5" font-size="12">r</tspan>Y</text>
                <text x="590" y="195" text-anchor="middle" font-size="16">X<tspan dy="-5" font-size="12">R</tspan>X<tspan dy="-5" font-size="12">r</tspan>X<tspan dy="-5" font-size="12">r</tspan></text>
                <text x="690" y="195" text-anchor="middle" font-size="16">X<tspan dy="-5" font-size="12">R</tspan>Y</text>
                
                <text x="390" y="275" text-anchor="middle" font-size="16">X<tspan dy="-5" font-size="12">r</tspan>Y</text>
                <text x="490" y="275" text-anchor="middle" font-size="16">X<tspan dy="-5" font-size="12">r</tspan>YY</text>
                <text x="590" y="275" text-anchor="middle" font-size="16">X<tspan dy="-5" font-size="12">r</tspan>X<tspan dy="-5" font-size="12">r</tspan>Y</text>
                <text x="690" y="275" text-anchor="middle" font-size="16">YY</text>
                
                <text x="440" y="350" text-anchor="middle" font-size="16" fill="#c62828">红眼雌果蝇</text>
            </g>

            <defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#000" />
                </marker>
            </defs>
        </svg>
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    <script>
    (function() {
        let currentStep = 0;
        const totalSteps = 5;
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        
        function updateStep() {
            for (let i = 0; i <= totalSteps; i++) {
                const group = document.getElementById(`scene1-step${i}`);
                if (i === currentStep) {
                    group.style.display = 'block';
                    // trigger reflow
                    void group.offsetWidth;
                    group.style.opacity = '1';
                } else {
                    group.style.opacity = '0';
                    setTimeout(() => {
                        if (currentStep !== i) group.style.display = 'none';
                    }, 300);
                }
            }
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps;
            
            // Trigger animations for step 3 and 4
            if (currentStep === 3) {
                animateStep3();
            } else if (currentStep === 4) {
                animateStep4();
            } else {
                resetAnimations();
            }
        }
        
        function animateStep3() {
            const x1 = document.getElementById('scene1-s3-x1');
            const x2 = document.getElementById('scene1-s3-x2');
            const y = document.getElementById('scene1-s3-y');
            
            x1.style.transition = 'transform 1s ease';
            x2.style.transition = 'transform 1s ease';
            y.style.transition = 'transform 1s ease';
            
            // Reset first
            x1.style.transform = 'translate(0, 0)';
            x2.style.transform = 'translate(0, 0)';
            y.style.transform = 'translate(0, 0)';
            
            setTimeout(() => {
                // Move X1 to left gamete (cx=300, cy=310) from (380, 140) -> dx=-80, dy=170
                x1.style.transform = 'translate(-80px, 170px)';
                // Move X2 to right gamete (cx=500, cy=310) from (420, 140) -> dx=80, dy=170
                x2.style.transform = 'translate(80px, 170px)';
                // Move Y to right gamete (cx=500, cy=310) from (400, 140) -> dx=100, dy=170
                y.style.transform = 'translate(100px, 170px)';
            }, 100);
        }
        
        function animateStep4() {
            const x1 = document.getElementById('scene1-s4-x1');
            const x2 = document.getElementById('scene1-s4-x2');
            const y = document.getElementById('scene1-s4-y');
            
            x1.style.transition = 'transform 1s ease';
            x2.style.transition = 'transform 1s ease';
            y.style.transition = 'transform 1s ease';
            
            // Reset first
            x1.style.transform = 'translate(0, 0)';
            x2.style.transform = 'translate(0, 0)';
            y.style.transform = 'translate(0, 0)';
            
            setTimeout(() => {
                // Move X1 to left gamete (cx=300, cy=310) from (380, 140) -> dx=-80, dy=170
                x1.style.transform = 'translate(-80px, 170px)';
                // Move X2 to left gamete (cx=300, cy=310) from (400, 140) -> dx=-100, dy=170
                x2.style.transform = 'translate(-100px, 170px)';
                // Move Y to right gamete (cx=500, cy=310) from (420, 140) -> dx=80, dy=170
                y.style.transform = 'translate(80px, 170px)';
            }, 100);
        }
        
        function resetAnimations() {
            const x1_3 = document.getElementById('scene1-s3-x1');
            const x2_3 = document.getElementById('scene1-s3-x2');
            const y_3 = document.getElementById('scene1-s3-y');
            if(x1_3) x1_3.style.transform = 'translate(0, 0)';
            if(x2_3) x2_3.style.transform = 'translate(0, 0)';
            if(y_3) y_3.style.transform = 'translate(0, 0)';
            
            const x1_4 = document.getElementById('scene1-s4-x1');
            const x2_4 = document.getElementById('scene1-s4-x2');
            const y_4 = document.getElementById('scene1-s4-y');
            if(x1_4) x1_4.style.transform = 'translate(0, 0)';
            if(x2_4) x2_4.style.transform = 'translate(0, 0)';
            if(y_4) y_4.style.transform = 'translate(0, 0)';
        }
        
        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });
        
        btnNext.addEventListener('click', () => {
            if (currentStep < totalSteps) {
                currentStep++;
                updateStep();
            }
        });
        
        // Initialize
        updateStep();
    })();
    </script>
</body>
</html>
