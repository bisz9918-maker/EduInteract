<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .scene1-element { transition: opacity 0.3s ease; opacity: 0; pointer-events: none; }
        .scene1-visible { opacity: 1; }
        
        .scene1-highlight-blue { stroke: #1565c0; stroke-width: 2; }
        .scene1-text-blue { fill: #1565c0; }
        .scene1-text-red { fill: #c62828; }
        .scene1-text-green { fill: #2e7d32; }
        
        .scene1-box-bg { fill: #1565c0; fill-opacity: 0.1; stroke: #1565c0; stroke-width: 1; rx: 4; ry: 4; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <defs>
                <pattern id="scene1-stripe" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
                    <line x1="0" y1="0" x2="0" y2="6" stroke="#000000" stroke-width="1.5" />
                </pattern>
                <marker id="scene1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
                </marker>
            </defs>

            <!-- Legend -->
            <line x1="600" y1="20" x2="720" y2="20" stroke="#000000" stroke-width="1" />
   <line x1="720" y1="20" x2="720" y2="135" stroke="#000000" stroke-width="1" />
   <line x1="720" y1="135" x2="600" y2="135" stroke="#000000" stroke-width="1" />
   <line x1="600" y1="135" x2="600" y2="20" stroke="#000000" stroke-width="1" />
            <circle cx="620" cy="40" r="8" fill="#ffffff" stroke="#000000" stroke-width="1" />
            <text x="640" y="45" font-size="14" fill="#000000" dominant-baseline="middle">氢原子</text>
            <circle cx="620" cy="75" r="12" fill="#000000" stroke="#000000" stroke-width="1" />
            <text x="640" y="80" font-size="14" fill="#000000" dominant-baseline="middle">氧原子</text>
            <circle cx="620" cy="110" r="12" fill="url(#scene1-stripe)" stroke="#000000" stroke-width="1" />
            <text x="640" y="115" font-size="14" fill="#000000" dominant-baseline="middle">碳原子</text>

            <!-- Reactants Box -->
            <line x1="50" y1="120" x2="350" y2="120" stroke="#000000" stroke-width="1" />
   <line x1="350" y1="120" x2="350" y2="260" stroke="#000000" stroke-width="1" />
   <line x1="350" y1="260" x2="50" y2="260" stroke="#000000" stroke-width="1" />
   <line x1="50" y1="260" x2="50" y2="120" stroke="#000000" stroke-width="1" />
            <text x="200" y="280" font-size="16" fill="#000000" text-anchor="middle">反应前</text>

            <!-- Molecule Jia (CH4) -->
            <g id="scene1-mol-jia">
                <circle cx="140" cy="180" r="16" fill="url(#scene1-stripe)" stroke="#000000" stroke-width="1" />
                <circle cx="140" cy="156" r="8" fill="#ffffff" stroke="#000000" stroke-width="1" />
                <circle cx="140" cy="204" r="8" fill="#ffffff" stroke="#000000" stroke-width="1" />
                <circle cx="116" cy="180" r="8" fill="#ffffff" stroke="#000000" stroke-width="1" />
                <circle cx="164" cy="180" r="8" fill="#ffffff" stroke="#000000" stroke-width="1" />
                <text x="140" y="250" font-size="16" fill="#000000" text-anchor="middle">甲</text>
            </g>

            <!-- Molecule Yi (H2O) -->
            <g id="scene1-mol-yi">
                <circle cx="260" cy="180" r="16" fill="#000000" stroke="#000000" stroke-width="1" />
                <circle cx="245" cy="200" r="8" fill="#ffffff" stroke="#000000" stroke-width="1" />
                <circle cx="275" cy="200" r="8" fill="#ffffff" stroke="#000000" stroke-width="1" />
                <text x="260" y="250" font-size="16" fill="#000000" text-anchor="middle">乙</text>
            </g>

            <!-- Arrow -->
            <line x1="360" y1="190" x2="440" y2="190" stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrow)" />
            <text x="400" y="180" font-size="14" fill="#000000" text-anchor="middle">高温</text>

            <!-- Products Box -->
            <line x1="450" y1="120" x2="750" y2="120" stroke="#000000" stroke-width="1" />
   <line x1="750" y1="120" x2="750" y2="260" stroke="#000000" stroke-width="1" />
   <line x1="750" y1="260" x2="450" y2="260" stroke="#000000" stroke-width="1" />
   <line x1="450" y1="260" x2="450" y2="120" stroke="#000000" stroke-width="1" />
            <text x="600" y="280" font-size="16" fill="#000000" text-anchor="middle">反应后</text>

            <!-- Molecule Bing (CO) -->
            <g id="scene1-mol-bing">
                <circle cx="530" cy="180" r="16" fill="#000000" stroke="#000000" stroke-width="1" />
                <circle cx="560" cy="180" r="16" fill="url(#scene1-stripe)" stroke="#000000" stroke-width="1" />
                <text x="545" y="250" font-size="16" fill="#000000" text-anchor="middle">丙</text>
            </g>

            <!-- Molecule Ding (H2) original -->
            <g id="scene1-mol-ding-orig">
                <circle cx="660" cy="165" r="8" fill="#ffffff" stroke="#000000" stroke-width="1" />
                <circle cx="660" cy="195" r="8" fill="#ffffff" stroke="#000000" stroke-width="1" />
                <text x="660" y="250" font-size="16" fill="#000000" text-anchor="middle">丁</text>
            </g>

            <!-- Step 1 Elements -->
            <g id="scene1-step1-elements" class="scene1-element">
                <path d="M 630 40 Q 385 40 140 148" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="4 4" />
                <path d="M 630 70 Q 445 70 260 164" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="4 4" />
                <path d="M 630 100 Q 385 100 140 164" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="4 4" />
                
                <text x="140" y="270" font-size="14" fill="#000000" text-anchor="middle">CH₄</text>
                <text x="260" y="270" font-size="14" fill="#000000" text-anchor="middle">H₂O</text>
                <text x="545" y="270" font-size="14" fill="#000000" text-anchor="middle">CO</text>
                <text x="660" y="270" font-size="14" fill="#000000" text-anchor="middle">H₂</text>
                
                <text x="400" y="340" font-size="18" fill="#000000" text-anchor="middle" id="scene1-eq-text">
                    <tspan x="140">CH₄</tspan>
                    <tspan x="200">+</tspan>
                    <tspan x="260">H₂O</tspan>
                    <tspan x="400" id="scene1-eq-arrow">→</tspan>
                    <tspan x="545">CO</tspan>
                    <tspan x="600">+</tspan>
                    <tspan x="660" id="scene1-eq-h2">H₂</tspan>
                </text>
            </g>

            <!-- Step 2 Elements -->
            <g id="scene1-step2-elements" class="scene1-element">
                <!-- New Ding 1 -->
                <g id="scene1-mol-ding-new1">
                    <circle cx="620" cy="165" r="8" fill="#ffffff" stroke="#1565c0" stroke-width="2" />
                    <circle cx="620" cy="195" r="8" fill="#ffffff" stroke="#1565c0" stroke-width="2" />
                </g>
                <!-- New Ding 2 -->
                <g id="scene1-mol-ding-new2">
                    <circle cx="700" cy="165" r="8" fill="#ffffff" stroke="#1565c0" stroke-width="2" />
                    <circle cx="700" cy="195" r="8" fill="#ffffff" stroke="#1565c0" stroke-width="2" />
                </g>
            </g>

            <!-- Step 3 Elements -->
            <g id="scene1-step3-elements" class="scene1-element">
                <text x="140" y="315" font-size="14" fill="#c62828" text-anchor="middle">
                    <tspan dx="-10">-4</tspan><tspan dx="10">+1</tspan>
                </text>
                <text x="260" y="315" font-size="14" fill="#c62828" text-anchor="middle">
                    <tspan dx="-10">+1</tspan><tspan dx="10">-2</tspan>
                </text>
                <text x="545" y="315" font-size="14" fill="#c62828" text-anchor="middle">
                    <tspan dx="-10">+2</tspan><tspan dx="10">-2</tspan>
                </text>
                <text x="660" y="315" font-size="14" fill="#c62828" text-anchor="middle">0</text>
                
                <text x="730" y="315" font-size="16" fill="#c62828" font-weight="bold">A ✗</text>

                <line x1="110" y1="355" x2="290" y2="355" stroke="#1565c0" stroke-width="1" />
   <line x1="290" y1="355" x2="290" y2="385" stroke="#1565c0" stroke-width="1" />
   <line x1="290" y1="385" x2="110" y2="385" stroke="#1565c0" stroke-width="1" />
   <line x1="110" y1="385" x2="110" y2="355" stroke="#1565c0" stroke-width="1" />
                <text x="200" y="375" font-size="14" fill="#1565c0" text-anchor="middle">化合物</text>
                
                <line x1="640" y1="355" x2="690" y2="355" stroke="#1565c0" stroke-width="1" />
   <line x1="690" y1="355" x2="690" y2="385" stroke="#1565c0" stroke-width="1" />
   <line x1="690" y1="385" x2="640" y2="385" stroke="#1565c0" stroke-width="1" />
   <line x1="640" y1="385" x2="640" y2="355" stroke="#1565c0" stroke-width="1" />
                <text x="665" y="375" font-size="14" fill="#1565c0" text-anchor="middle">单质</text>
                
                <text x="730" y="370" font-size="16" fill="#c62828" font-weight="bold">B ✗</text>
            </g>

            <!-- Step 4 Elements -->
            <g id="scene1-step4-elements" class="scene1-element">
                <text x="400" y="415" font-size="16" fill="#000000" text-anchor="middle">乙(H₂O)与丁(3H₂)质量比 = 18 : (3×2) = 3 : 1</text>
                <text x="650" y="415" font-size="16" fill="#2e7d32" font-weight="bold">C ✓</text>
                
                <text x="400" y="455" font-size="16" fill="#000000" text-anchor="middle">丙(CO)与丁(3H₂)分子数比 = 1 : 3</text>
                <text x="650" y="455" font-size="16" fill="#2e7d32" font-weight="bold">D ✓</text>
            </g>

        </svg>
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 4;
        
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        
        const step1Els = document.getElementById('scene1-step1-elements');
        const step2Els = document.getElementById('scene1-step2-elements');
        const step3Els = document.getElementById('scene1-step3-elements');
        const step4Els = document.getElementById('scene1-step4-elements');
        
        const eqArrow = document.getElementById('scene1-eq-arrow');
        const eqH2 = document.getElementById('scene1-eq-h2');
        
        function updateStep() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
            
            // Step 1
            if (currentStep >= 1) {
                step1Els.classList.add('scene1-visible');
            } else {
                step1Els.classList.remove('scene1-visible');
            }
            
            // Step 2
            if (currentStep >= 2) {
                step2Els.classList.add('scene1-visible');
                eqArrow.textContent = '=';
                eqH2.innerHTML = '<tspan fill="#1565c0">3</tspan>H₂';
            } else {
                step2Els.classList.remove('scene1-visible');
                eqArrow.textContent = '→';
                eqH2.textContent = 'H₂';
            }
            
            // Step 3
            if (currentStep >= 3) {
                step3Els.classList.add('scene1-visible');
            } else {
                step3Els.classList.remove('scene1-visible');
            }
            
            // Step 4
            if (currentStep >= 4) {
                step4Els.classList.add('scene1-visible');
            } else {
                step4Els.classList.remove('scene1-visible');
            }
        }
        
        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });
        
        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateStep();
            }
        });
        
        updateStep();
    })();
    </script>
</body>
</html>
