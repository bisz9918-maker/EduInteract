<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .hidden { display: none; opacity: 0; pointer-events: none; }
        .transition { transition: opacity 0.5s ease; }
        .highlight-blue { fill: #1565c0; color: #1565c0; font-weight: bold; }
        .highlight-red { fill: #c62828; color: #c62828; font-weight: bold; }
        .highlight-green { fill: #2e7d32; color: #2e7d32; font-weight: bold; }
        .glow-blue { filter: drop-shadow(0 0 5px #1565c0); }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500">
            <defs>
                <pattern id="scene1-carbon-pattern" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
                    <rect width="8" height="8" fill="#e0e0e0" />
                    <line x1="0" y1="0" x2="0" y2="8" stroke="#000000" stroke-width="1" />
                </pattern>
                <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
                </marker>
            </defs>

            <!-- 图例区 -->
            <line x1="620" y1="30" x2="760" y2="30" stroke="#000000" stroke-width="1" /><line x1="760" y1="30" x2="760" y2="160" stroke="#000000" stroke-width="1" /><line x1="760" y1="160" x2="620" y2="160" stroke="#000000" stroke-width="1" /><line x1="620" y1="160" x2="620" y2="30" stroke="#000000" stroke-width="1" />
            <circle cx="640" cy="40" r="8" fill="#ffffff" stroke="#000000" stroke-width="1" />
            <text x="660" y="45" font-size="14" fill="#000000">氢原子</text>
            <circle cx="640" cy="75" r="16" fill="#333333" stroke="#000000" stroke-width="1" />
            <text x="660" y="80" font-size="14" fill="#000000">氧原子</text>
            <circle cx="640" cy="140" r="18" fill="url(#scene1-carbon-pattern)" stroke="#000000" stroke-width="1" />
            <text x="660" y="120" font-size="14" fill="#000000">碳原子</text>

            <!-- 反应前外框 -->
            <line x1="60" y1="100" x2="320" y2="100" stroke="#000000" stroke-width="1" /><line x1="320" y1="100" x2="320" y2="240" stroke="#000000" stroke-width="1" /><line x1="320" y1="240" x2="60" y2="240" stroke="#000000" stroke-width="1" /><line x1="60" y1="240" x2="60" y2="100" stroke="#000000" stroke-width="1" />
            <text x="190" y="255" font-size="16" fill="#000000" text-anchor="middle">反应前</text>

            <!-- 反应后外框 -->
            <line x1="420" y1="100" x2="740" y2="100" stroke="#000000" stroke-width="1" /><line x1="740" y1="100" x2="740" y2="240" stroke="#000000" stroke-width="1" /><line x1="740" y1="240" x2="420" y2="240" stroke="#000000" stroke-width="1" /><line x1="420" y1="240" x2="420" y2="100" stroke="#000000" stroke-width="1" />
            <text x="580" y="255" font-size="16" fill="#000000" text-anchor="middle">反应后</text>

            <!-- 反应箭头 -->
            <line x1="330" y1="165" x2="410" y2="165" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />
            <text x="370" y="155" font-size="14" fill="#000000" text-anchor="middle">点燃</text>

            <!-- 模型 A (CH4) -->
            <g id="scene1-model-a" transform="translate(130, 150)">
                <circle cx="0" cy="-26" r="8" fill="#ffffff" stroke="#000000" stroke-width="1" />
                <circle cx="0" cy="26" r="8" fill="#ffffff" stroke="#000000" stroke-width="1" />
                <circle cx="-26" cy="0" r="8" fill="#ffffff" stroke="#000000" stroke-width="1" />
                <circle cx="26" cy="0" r="8" fill="#ffffff" stroke="#000000" stroke-width="1" />
                <circle cx="0" cy="0" r="18" fill="url(#scene1-carbon-pattern)" stroke="#000000" stroke-width="1" />
            </g>
            <text x="130" y="220" font-size="16" fill="#000000" text-anchor="middle">A</text>

            <!-- 反应前加号 -->
            <text x="190" y="155" font-size="20" fill="#000000" text-anchor="middle">+</text>

            <!-- 模型 B1 (O2) -->
            <g id="scene1-model-b1" transform="translate(250, 150)">
                <circle cx="-16" cy="0" r="16" fill="#333333" stroke="#000000" stroke-width="1" />
                <circle cx="16" cy="0" r="16" fill="#333333" stroke="#000000" stroke-width="1" />
            </g>
            <text x="250" y="220" font-size="16" fill="#000000" text-anchor="middle">B</text>

            <!-- 模型 B2 (O2) - 初始隐藏 -->
            <g id="scene1-model-b2" class="transition hidden" transform="translate(250, 190)">
                <circle cx="-16" cy="0" r="16" fill="#333333" stroke="#1565c0" stroke-width="2" class="glow-blue" />
                <circle cx="16" cy="0" r="16" fill="#333333" stroke="#1565c0" stroke-width="2" class="glow-blue" />
            </g>

            <!-- 模型 C (CO2) -->
            <g id="scene1-model-c" transform="translate(510, 150)">
                <circle cx="-34" cy="0" r="16" fill="#333333" stroke="#000000" stroke-width="1" />
                <circle cx="34" cy="0" r="16" fill="#333333" stroke="#000000" stroke-width="1" />
                <circle cx="0" cy="0" r="18" fill="url(#scene1-carbon-pattern)" stroke="#000000" stroke-width="1" />
            </g>
            <text x="510" y="220" font-size="16" fill="#000000" text-anchor="middle">C</text>

            <!-- 反应后加号 -->
            <text x="590" y="155" font-size="20" fill="#000000" text-anchor="middle">+</text>

            <!-- 模型 D1 (H2O) -->
            <g id="scene1-model-d1" transform="translate(660, 145)">
                <circle cx="-19" cy="15" r="8" fill="#ffffff" stroke="#000000" stroke-width="1" />
                <circle cx="19" cy="15" r="8" fill="#ffffff" stroke="#000000" stroke-width="1" />
                <circle cx="0" cy="0" r="16" fill="#333333" stroke="#000000" stroke-width="1" />
            </g>
            <text x="660" y="220" font-size="16" fill="#000000" text-anchor="middle">D</text>

            <!-- 模型 D2 (H2O) - 初始隐藏 -->
            <g id="scene1-model-d2" class="transition hidden" transform="translate(660, 185)">
                <circle cx="-19" cy="15" r="8" fill="#ffffff" stroke="#1565c0" stroke-width="2" class="glow-blue" />
                <circle cx="19" cy="15" r="8" fill="#ffffff" stroke="#1565c0" stroke-width="2" class="glow-blue" />
                <circle cx="0" cy="0" r="16" fill="#333333" stroke="#1565c0" stroke-width="2" class="glow-blue" />
            </g>

            <!-- 化学式 - 初始隐藏 -->
            <text id="scene1-formula-a" class="transition hidden" x="130" y="260" font-size="16" fill="#000000" text-anchor="middle">CH<tspan baseline-shift="sub" font-size="0.7em">4</tspan></text>
            <text id="scene1-formula-b" class="transition hidden" x="250" y="260" font-size="16" fill="#000000" text-anchor="middle">O<tspan baseline-shift="sub" font-size="0.7em">2</tspan></text>
            <text id="scene1-formula-c" class="transition hidden" x="510" y="260" font-size="16" fill="#000000" text-anchor="middle">CO<tspan baseline-shift="sub" font-size="0.7em">2</tspan></text>
            <text id="scene1-formula-d" class="transition hidden" x="660" y="260" font-size="16" fill="#000000" text-anchor="middle">H<tspan baseline-shift="sub" font-size="0.7em">2</tspan>O</text>

            <!-- 化学方程式 - 初始隐藏 -->
            <g id="scene1-equation" class="transition hidden" transform="translate(400, 310)">
                <text x="0" y="0" font-size="18" fill="#000000" text-anchor="middle">
                    CH<tspan baseline-shift="sub" font-size="0.7em">4</tspan> + 
                    <tspan id="scene1-eq-coef-b" class="transition hidden highlight-blue">2</tspan>O<tspan baseline-shift="sub" font-size="0.7em">2</tspan> 
                    <tspan font-size="14"> ──点燃── </tspan> 
                    CO<tspan baseline-shift="sub" font-size="0.7em">2</tspan> + 
                    <tspan id="scene1-eq-coef-d" class="transition hidden highlight-blue">2</tspan>H<tspan baseline-shift="sub" font-size="0.7em">2</tspan>O
                </text>
            </g>

            <!-- 相对分子质量 - 初始隐藏 -->
            <g id="scene1-mass" class="transition hidden" transform="translate(400, 355)">
                <text x="-140" y="0" font-size="14" fill="#000000" text-anchor="middle">16</text>
                <text x="-60" y="0" font-size="14" fill="#000000" text-anchor="middle">2×32=64</text>
            </g>

            <!-- 底部信息面板 -->
            <line x1="50" y1="370" x2="750" y2="370" stroke="#cccccc" stroke-width="2" />
            <g id="scene1-panel-content" class="transition hidden">
                <!-- 步骤3内容 -->
                <g id="scene1-panel-step3" class="transition hidden">
                    <text x="200" y="390" font-size="16" fill="#000000" text-anchor="middle">反应前：C=<tspan class="highlight-green">1</tspan>, H=<tspan class="highlight-green">4</tspan>, O=<tspan class="highlight-green">4</tspan></text>
                    <text x="600" y="390" font-size="16" fill="#000000" text-anchor="middle">反应后：C=<tspan class="highlight-green">1</tspan>, H=<tspan class="highlight-green">4</tspan>, O=<tspan class="highlight-green">4</tspan></text>
                    <text x="400" y="430" font-size="16" fill="#000000" text-anchor="middle">反应前后原子数目不变，选项A<tspan class="highlight-blue">正确</tspan></text>
                </g>
                <!-- 步骤4内容 -->
                <g id="scene1-panel-step4" class="transition hidden">
                    <text x="400" y="390" font-size="16" fill="#000000" text-anchor="middle">m(A) : m(B) = 16 : 64 = 1 : 4</text>
                    <text x="400" y="430" font-size="16" fill="#000000" text-anchor="middle">选项B<tspan class="highlight-red">错误</tspan> (非 <tspan class="highlight-red">8:1</tspan>)</text>
                </g>
                <!-- 步骤5内容 -->
                <g id="scene1-panel-step5" class="transition hidden">
                    <text x="400" y="390" font-size="16" fill="#000000" text-anchor="middle">选项C：方程式<tspan class="highlight-red">未配平</tspan>，错误</text>
                    <text x="400" y="430" font-size="14" fill="#000000" text-anchor="middle">选项D：反应物含化合物和单质，生成物均为化合物，不符合<tspan class="highlight-red">置换反应</tspan>定义，错误</text>
                </g>
            </g>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 5;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');

        const elements = {
            formulas: [
                document.getElementById('scene1-formula-a'),
                document.getElementById('scene1-formula-b'),
                document.getElementById('scene1-formula-c'),
                document.getElementById('scene1-formula-d')
            ],
            equation: document.getElementById('scene1-equation'),
            modelB2: document.getElementById('scene1-model-b2'),
            modelD2: document.getElementById('scene1-model-d2'),
            eqCoefB: document.getElementById('scene1-eq-coef-b'),
            eqCoefD: document.getElementById('scene1-eq-coef-d'),
            mass: document.getElementById('scene1-mass'),
            panelContent: document.getElementById('scene1-panel-content'),
            panelStep3: document.getElementById('scene1-panel-step3'),
            panelStep4: document.getElementById('scene1-panel-step4'),
            panelStep5: document.getElementById('scene1-panel-step5')
        };

        function show(el) {
            if (Array.isArray(el)) {
                el.forEach(e => e.classList.remove('hidden'));
            } else {
                el.classList.remove('hidden');
            }
        }

        function hide(el) {
            if (Array.isArray(el)) {
                el.forEach(e => e.classList.add('hidden'));
            } else {
                el.classList.add('hidden');
            }
        }

        function updateScene() {
            // Reset all
            hide(elements.formulas);
            hide(elements.equation);
            hide(elements.modelB2);
            hide(elements.modelD2);
            hide(elements.eqCoefB);
            hide(elements.eqCoefD);
            hide(elements.mass);
            hide(elements.panelContent);
            hide(elements.panelStep3);
            hide(elements.panelStep4);
            hide(elements.panelStep5);

            if (currentStep >= 1) {
                show(elements.formulas);
            }
            if (currentStep >= 2) {
                show(elements.equation);
                show(elements.modelB2);
                show(elements.modelD2);
                show(elements.eqCoefB);
                show(elements.eqCoefD);
            }
            if (currentStep >= 3) {
                show(elements.panelContent);
                if (currentStep === 3) show(elements.panelStep3);
                if (currentStep === 4) {
                    show(elements.mass);
                    show(elements.panelStep4);
                }
                if (currentStep === 5) {
                    show(elements.mass);
                    show(elements.panelStep5);
                }
            }

            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });

        // Initialize
        updateScene();
    })();
    </script>
</body>
</html>
