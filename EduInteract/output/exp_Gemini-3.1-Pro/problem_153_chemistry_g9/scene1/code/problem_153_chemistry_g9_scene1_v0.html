<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene1-gas { transition: all 0.8s ease-in-out; }
        .scene1-device { transition: all 0.3s ease; }
        .scene1-highlight { stroke: #1565c0; stroke-width: 4px; filter: drop-shadow(0 0 5px #1565c0); }
        #scene1-text-area { position: absolute; top: 390px; left: 100px; width: 600px; height: 50px; text-align: center; font-size: 16px; line-height: 1.5; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- Pipes -->
            <g stroke="#333" stroke-width="4" fill="none">
                <!-- A in -->
                <polyline points="20,180 60,180 60,160 105,160 105,310" />
                <!-- A out to B in -->
                <polyline points="135,240 135,160 180,160 180,180 260,180" />
                <!-- B out to C in -->
                <polyline points="400,180 460,180 460,160 505,160 505,310" />
                <!-- C out to D in -->
                <polyline points="535,240 535,160 620,160 620,180 630,180 630,160 665,160 665,310" />
                <!-- D out -->
                <polyline points="695,240 695,160 760,160 760,180 780,180" />
            </g>

            <!-- Device A -->
            <g id="scene1-device-a" class="scene1-device">
                <rect x="90" y="230" width="60" height="100" rx="5" fill="none" stroke="#333" stroke-width="2" />
                <rect x="100" y="210" width="40" height="20" fill="none" stroke="#333" stroke-width="2" />
                <rect x="95" y="210" width="50" height="10" fill="#333" /> <!-- stopper -->
                <rect x="92" y="270" width="56" height="58" fill="rgba(200,200,200,0.5)" /> <!-- liquid -->
                <text x="120" y="350" text-anchor="middle" font-size="14">A</text>
                <text x="120" y="370" text-anchor="middle" font-size="14">碳酸氢钠</text>
            </g>

            <!-- Device B -->
            <g id="scene1-device-b" class="scene1-device">
                <!-- Iron stand -->
                <rect x="200" y="310" width="80" height="10" fill="#666" />
                <rect x="235" y="170" width="10" height="140" fill="#666" />
                <rect x="245" y="175" width="15" height="10" fill="#666" />
                
                <!-- Spirit lamp -->
                <rect x="300" y="280" width="60" height="40" fill="#d7ccc8" stroke="#8d6e63" stroke-width="2" /> <!-- wooden block -->
                <polygon points="310,280 350,280 360,250 300,250" fill="rgba(200,200,200,0.3)" stroke="#333" stroke-width="2" />
                <path d="M325,250 Q330,230 335,250" fill="orange" />
                
                <!-- Glass tube -->
                <rect x="260" y="170" width="140" height="20" fill="none" stroke="#333" stroke-width="2" />
                <rect x="250" y="170" width="10" height="20" fill="#333" /> <!-- left stopper -->
                <rect x="400" y="170" width="10" height="20" fill="#333" /> <!-- right stopper -->
                
                <!-- CuO -->
                <ellipse cx="330" cy="185" rx="30" ry="5" fill="#333" />
                
                <text x="330" y="350" text-anchor="middle" font-size="14">B</text>
                <text x="330" y="140" text-anchor="middle" font-size="14">氧化铜</text>
            </g>

            <!-- Device C -->
            <g id="scene1-device-c" class="scene1-device">
                <rect x="490" y="230" width="60" height="100" rx="5" fill="none" stroke="#333" stroke-width="2" />
                <rect x="500" y="210" width="40" height="20" fill="none" stroke="#333" stroke-width="2" />
                <rect x="495" y="210" width="50" height="10" fill="#333" /> <!-- stopper -->
                <rect x="492" y="270" width="56" height="58" fill="rgba(200,200,200,0.5)" /> <!-- liquid -->
                <text x="520" y="350" text-anchor="middle" font-size="14">C</text>
                <text x="520" y="370" text-anchor="middle" font-size="14">澄清石灰水</text>
            </g>

            <!-- Device D -->
            <g id="scene1-device-d" class="scene1-device">
                <rect x="650" y="230" width="60" height="100" rx="5" fill="none" stroke="#333" stroke-width="2" />
                <rect x="660" y="210" width="40" height="20" fill="none" stroke="#333" stroke-width="2" />
                <rect x="655" y="210" width="50" height="10" fill="#333" /> <!-- stopper -->
                <rect x="652" y="270" width="56" height="58" fill="rgba(173,216,230,0.5)" /> <!-- liquid -->
                <text x="680" y="350" text-anchor="middle" font-size="14">D</text>
                <text x="680" y="370" text-anchor="middle" font-size="14">浓硫酸</text>
            </g>

            <!-- Gas Labels -->
            <g id="scene1-gas-h2" class="scene1-gas" transform="translate(40,50)">
                <text x="0" y="0" text-anchor="middle" fill="#f57c00" font-size="18" font-weight="bold">H₂</text>
            </g>
            <g id="scene1-gas-n2" class="scene1-gas" transform="translate(90,50)">
                <text x="0" y="0" text-anchor="middle" fill="#888888" font-size="18" font-weight="bold">N₂</text>
            </g>
            <g id="scene1-gas-hcl" class="scene1-gas" transform="translate(40,90)">
                <text x="0" y="0" text-anchor="middle" fill="#c62828" font-size="18" font-weight="bold">HCl</text>
            </g>
            <g id="scene1-gas-h2o" class="scene1-gas" transform="translate(90,90)">
                <text x="0" y="0" text-anchor="middle" fill="#1565c0" font-size="18" font-weight="bold">H₂O</text>
            </g>
            <g id="scene1-gas-co" class="scene1-gas" transform="translate(40,130)">
                <text x="0" y="0" text-anchor="middle" fill="#f57c00" font-size="18" font-weight="bold">CO</text>
            </g>
            <g id="scene1-gas-co2" class="scene1-gas" transform="translate(90,130)">
                <text x="0" y="0" text-anchor="middle" fill="#2e7d32" font-size="18" font-weight="bold">CO₂</text>
            </g>
        </svg>

        <div id="scene1-text-area">
            初始混合气体：H₂、N₂、HCl、H₂O、CO、CO₂
        </div>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 4;
        
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const textArea = document.getElementById('scene1-text-area');
        
        const gases = {
            h2: document.getElementById('scene1-gas-h2'),
            n2: document.getElementById('scene1-gas-n2'),
            hcl: document.getElementById('scene1-gas-hcl'),
            h2o: document.getElementById('scene1-gas-h2o'),
            co: document.getElementById('scene1-gas-co'),
            co2: document.getElementById('scene1-gas-co2')
        };
        
        const devices = {
            a: document.getElementById('scene1-device-a'),
            b: document.getElementById('scene1-device-b'),
            c: document.getElementById('scene1-device-c'),
            d: document.getElementById('scene1-device-d')
        };
        
        const steps = [
            {
                text: "初始混合气体：H₂、N₂、HCl、H₂O、CO、CO₂",
                highlight: null,
                positions: {
                    h2: {x: 40, y: 50, opacity: 1},
                    n2: {x: 90, y: 50, opacity: 1},
                    hcl: {x: 40, y: 90, opacity: 1},
                    h2o: {x: 90, y: 90, opacity: 1},
                    co: {x: 40, y: 130, opacity: 1},
                    co2: {x: 90, y: 130, opacity: 1}
                }
            },
            {
                text: "装置A：碳酸氢钠溶液吸收 HCl 气体<br>NaHCO₃ + HCl = NaCl + H₂O + CO₂↑",
                highlight: 'a',
                positions: {
                    h2: {x: 180, y: 50, opacity: 1},
                    n2: {x: 230, y: 50, opacity: 1},
                    hcl: {x: 120, y: 200, opacity: 0},
                    h2o: {x: 180, y: 90, opacity: 1},
                    co: {x: 230, y: 90, opacity: 1},
                    co2: {x: 180, y: 130, opacity: 1}
                }
            },
            {
                text: "装置B：氧化铜与 H₂、CO 发生还原反应<br>CuO + H₂ = Cu + H₂O, CuO + CO = Cu + CO₂",
                highlight: 'b',
                positions: {
                    h2: {x: 280, y: 150, opacity: 0},
                    n2: {x: 440, y: 50, opacity: 1},
                    hcl: {x: 120, y: 200, opacity: 0},
                    h2o: {x: 440, y: 90, opacity: 1},
                    co: {x: 380, y: 150, opacity: 0},
                    co2: {x: 440, y: 130, opacity: 1}
                }
            },
            {
                text: "装置C：澄清石灰水吸收 CO₂ 气体<br>Ca(OH)₂ + CO₂ = CaCO₃↓ + H₂O",
                highlight: 'c',
                positions: {
                    h2: {x: 280, y: 150, opacity: 0},
                    n2: {x: 580, y: 50, opacity: 1},
                    hcl: {x: 120, y: 200, opacity: 0},
                    h2o: {x: 580, y: 90, opacity: 1},
                    co: {x: 380, y: 150, opacity: 0},
                    co2: {x: 520, y: 200, opacity: 0}
                }
            },
            {
                text: "装置D：浓硫酸吸收水分（干燥气体）。最后得到的气体是 N₂",
                highlight: 'd',
                positions: {
                    h2: {x: 280, y: 150, opacity: 0},
                    n2: {x: 750, y: 100, opacity: 1},
                    hcl: {x: 120, y: 200, opacity: 0},
                    h2o: {x: 680, y: 200, opacity: 0},
                    co: {x: 380, y: 150, opacity: 0},
                    co2: {x: 520, y: 200, opacity: 0}
                }
            }
        ];
        
        let hideTimeouts = {};

        function updateScene() {
            const step = steps[currentStep];
            
            // Update text
            textArea.innerHTML = step.text;
            
            // Update buttons
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
            
            // Update highlights
            Object.keys(devices).forEach(key => {
                const rect = devices[key].querySelector('rect');
                if (step.highlight === key) {
                    rect.classList.add('scene1-highlight');
                } else {
                    rect.classList.remove('scene1-highlight');
                }
            });
            
            // Update gas positions
            Object.keys(gases).forEach(key => {
                const pos = step.positions[key];
                const el = gases[key];
                
                // Clear any pending hide timeouts
                if (hideTimeouts[key]) {
                    clearTimeout(hideTimeouts[key]);
                    hideTimeouts[key] = null;
                }

                el.style.transform = `translate(${pos.x}px, ${pos.y}px)`;
                
                if (pos.opacity === 0) {
                    el.style.opacity = '0';
                    // Wait for transition to finish before hiding
                    hideTimeouts[key] = setTimeout(() => {
                        if (el.style.opacity === '0') {
                            el.style.visibility = 'hidden';
                        }
                    }, 800);
                } else {
                    el.style.visibility = 'visible';
                    // Force reflow to ensure visibility is applied before opacity transition
                    void el.offsetWidth;
                    el.style.opacity = '1';
                }
            });
        }
        
        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });
        
        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });
        
        // Initialize
        updateScene();
    })();
    </script>
</body>
</html>
