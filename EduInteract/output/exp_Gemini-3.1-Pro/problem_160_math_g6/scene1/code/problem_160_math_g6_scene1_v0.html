<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:hover { background: #e9e9e9; }
        button:disabled { cursor: not-allowed; opacity: 0.5; }
        .math { font-family: "Times New Roman", Times, serif; font-style: italic; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <defs>
                <polygon id="scene1-poly-fill" points="150,310 150,190 270,190 270,270 430,270 430,70 550,70 550,310" />
            </defs>
            <use href="#scene1-poly-fill" fill="#1565c0" fill-opacity="0.1" />
            
            <!-- Original Lines (for highlighting) -->
            <line id="scene1-line-a" x1="150" y1="310" x2="150" y2="190" stroke="#000" stroke-width="2" />
            <line id="scene1-line-h" x1="150" y1="190" x2="270" y2="190" stroke="#000" stroke-width="2" />
            <line id="scene1-line-g" x1="270" y1="190" x2="270" y2="270" stroke="#000" stroke-width="2" />
            <line id="scene1-line-f" x1="270" y1="270" x2="430" y2="270" stroke="#000" stroke-width="2" />
            <line id="scene1-line-e" x1="430" y1="270" x2="430" y2="70" stroke="#000" stroke-width="2" />
            <line id="scene1-line-d" x1="430" y1="70" x2="550" y2="70" stroke="#000" stroke-width="2" />
            <line id="scene1-line-c" x1="550" y1="70" x2="550" y2="310" stroke="#000" stroke-width="2" />
            <line id="scene1-line-b" x1="550" y1="310" x2="150" y2="310" stroke="#000" stroke-width="2" />

            <!-- Labels -->
            <text id="scene1-label-a" x="135" y="255" font-size="18" text-anchor="end" class="math">a</text>
            <text id="scene1-label-h" x="210" y="180" font-size="18" text-anchor="middle" class="math">h</text>
            <text id="scene1-label-g" x="260" y="235" font-size="18" text-anchor="end" class="math">g=10</text>
            <text id="scene1-label-f" x="350" y="290" font-size="18" text-anchor="middle" class="math">f</text>
            <text id="scene1-label-e" x="440" y="175" font-size="18" text-anchor="start" class="math">e</text>
            <text id="scene1-label-d" x="490" y="60" font-size="18" text-anchor="middle" class="math">d</text>
            <text id="scene1-label-c" x="560" y="195" font-size="18" text-anchor="start" class="math">c=30</text>
            <text id="scene1-label-b" x="350" y="335" font-size="18" text-anchor="middle" class="math">b=50</text>

            <!-- Step 1: Horizontal Translation -->
            <g id="scene1-step1-group" opacity="0" display="none">
                <!-- Trajectories -->
                <line x1="150" y1="190" x2="150" y2="310" stroke="#888" stroke-width="1" stroke-dasharray="4 4" />
                <line x1="270" y1="190" x2="270" y2="310" stroke="#888" stroke-width="1" stroke-dasharray="4 4" />
                <line x1="430" y1="270" x2="430" y2="310" stroke="#888" stroke-width="1" stroke-dasharray="4 4" />
                <line x1="550" y1="70" x2="550" y2="310" stroke="#888" stroke-width="1" stroke-dasharray="4 4" />
                
                <!-- Clones -->
                <line id="scene1-clone-h" x1="150" y1="190" x2="270" y2="190" stroke="#1565c0" stroke-width="4" />
                <line id="scene1-clone-f" x1="270" y1="270" x2="430" y2="270" stroke="#1565c0" stroke-width="4" />
                <line id="scene1-clone-d" x1="430" y1="70" x2="550" y2="70" stroke="#1565c0" stroke-width="4" />
                
                <!-- Clone Labels -->
                <text id="scene1-clone-label-h" x="210" y="180" font-size="18" text-anchor="middle" fill="#1565c0" class="math">h</text>
                <text id="scene1-clone-label-f" x="350" y="290" font-size="18" text-anchor="middle" fill="#1565c0" class="math">f</text>
                <text id="scene1-clone-label-d" x="490" y="60" font-size="18" text-anchor="middle" fill="#1565c0" class="math">d</text>
            </g>

            <!-- Step 2: Vertical Translation -->
            <g id="scene1-step2-group" opacity="0" display="none">
                <!-- Vertical Auxiliary Line -->
                <line x1="650" y1="10" x2="650" y2="350" stroke="#888" stroke-width="1" stroke-dasharray="4 4" />
                
                <!-- Trajectories -->
                <line x1="150" y1="190" x2="640" y2="220" stroke="#888" stroke-width="1" stroke-dasharray="4 4" />
                <line x1="150" y1="310" x2="640" y2="340" stroke="#888" stroke-width="1" stroke-dasharray="4 4" />
                <line x1="430" y1="70" x2="640" y2="20" stroke="#888" stroke-width="1" stroke-dasharray="4 4" />
                <line x1="430" y1="270" x2="640" y2="220" stroke="#888" stroke-width="1" stroke-dasharray="4 4" />
                
                <line x1="270" y1="190" x2="660" y2="20" stroke="#888" stroke-width="1" stroke-dasharray="4 4" />
                <line x1="270" y1="270" x2="660" y2="100" stroke="#888" stroke-width="1" stroke-dasharray="4 4" />
                <line x1="550" y1="70" x2="660" y2="100" stroke="#888" stroke-width="1" stroke-dasharray="4 4" />
                <line x1="550" y1="310" x2="660" y2="340" stroke="#888" stroke-width="1" stroke-dasharray="4 4" />

                <!-- Clones -->
                <line id="scene1-clone-a" x1="150" y1="310" x2="150" y2="190" stroke="#c62828" stroke-width="4" />
                <line id="scene1-clone-e" x1="430" y1="270" x2="430" y2="70" stroke="#c62828" stroke-width="4" />
                <line id="scene1-clone-g" x1="270" y1="190" x2="270" y2="270" stroke="#2e7d32" stroke-width="4" />
                <line id="scene1-clone-c" x1="550" y1="70" x2="550" y2="310" stroke="#2e7d32" stroke-width="4" />

                <!-- Clone Labels -->
                <text id="scene1-clone-label-a" x="140" y="255" font-size="18" text-anchor="end" fill="#c62828" class="math">a</text>
                <text id="scene1-clone-label-e" x="420" y="175" font-size="18" text-anchor="end" fill="#c62828" class="math">e</text>
                <text id="scene1-clone-label-g" x="280" y="235" font-size="18" text-anchor="start" fill="#2e7d32" class="math">g</text>
                <text id="scene1-clone-label-c" x="560" y="195" font-size="18" text-anchor="start" fill="#2e7d32" class="math">c</text>
            </g>

            <!-- Conclusions -->
            <text id="scene1-text-step1" x="350" y="375" font-size="18" text-anchor="middle" fill="#1565c0" opacity="0" display="none" class="math">h + f + d = b = 50</text>
            
            <text id="scene1-text-step2" x="650" y="375" font-size="18" text-anchor="middle" opacity="0" display="none">
                <tspan fill="#c62828" class="math">a + e</tspan> = <tspan fill="#2e7d32" class="math">g + c</tspan> = 10 + 30 = 40
            </text>

            <g id="scene1-text-step3" opacity="0" display="none" font-size="18" text-anchor="middle">
                <text x="400" y="375" class="math">P = a + b + c + d + e + f + g + h</text>
                <text x="400" y="407">
                    <tspan class="math">P = (</tspan><tspan fill="#1565c0" class="math">h + f + d</tspan><tspan class="math">) + </tspan><tspan fill="#1565c0" class="math">b</tspan><tspan class="math"> + (</tspan><tspan fill="#c62828" class="math">a + e</tspan><tspan class="math">) + (</tspan><tspan fill="#2e7d32" class="math">g + c</tspan><tspan class="math">)</tspan>
                </text>
                <text x="400" y="439">
                    <tspan class="math">P = </tspan><tspan fill="#1565c0">50</tspan> + <tspan fill="#1565c0">50</tspan> + <tspan fill="#c62828">40</tspan> + <tspan fill="#2e7d32">40</tspan> = <tspan font-weight="bold">180</tspan>
                </text>
            </g>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
            <button id="scene1-btn-reset">↺ 重置</button>
        </div>
    </div>
    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 3;
        
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const btnReset = document.getElementById('scene1-btn-reset');
        
        function show(el) {
            if (typeof el === 'string') el = document.getElementById(el);
            if (!el) return;
            el.style.display = '';
            gsap.to(el, { opacity: 1, duration: 0.5 });
        }
        
        function hide(el) {
            if (typeof el === 'string') el = document.getElementById(el);
            if (!el) return;
            gsap.to(el, { opacity: 0, duration: 0.3, onComplete: () => { el.style.display = 'none'; } });
        }
        
        function hideImmediate(el) {
            if (typeof el === 'string') el = document.getElementById(el);
            if (!el) return;
            gsap.killTweensOf(el);
            el.style.opacity = 0;
            el.style.display = 'none';
        }

        function updateState() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
            
            // Reset all highlights
            gsap.to(['#scene1-line-h', '#scene1-line-f', '#scene1-line-d', '#scene1-line-b'], { stroke: '#000', strokeWidth: 2, duration: 0.3 });
            gsap.to(['#scene1-line-a', '#scene1-line-e', '#scene1-line-g', '#scene1-line-c'], { stroke: '#000', strokeWidth: 2, duration: 0.3 });
            
            if (currentStep === 0) {
                hideImmediate('scene1-step1-group');
                hideImmediate('scene1-step2-group');
                hideImmediate('scene1-text-step1');
                hideImmediate('scene1-text-step2');
                hideImmediate('scene1-text-step3');
            } else if (currentStep === 1) {
                hide('scene1-step2-group');
                hide('scene1-text-step2');
                hide('scene1-text-step3');
                
                gsap.to(['#scene1-line-h', '#scene1-line-f', '#scene1-line-d', '#scene1-line-b'], { stroke: '#1565c0', strokeWidth: 4, duration: 0.3 });
                
                const step1Group = document.getElementById('scene1-step1-group');
                step1Group.style.display = '';
                gsap.to(step1Group, { opacity: 1, duration: 0.5 });
                
                // Reset clones position
                gsap.set('#scene1-clone-h', { attr: { y1: 190, y2: 190 } });
                gsap.set('#scene1-clone-f', { attr: { y1: 270, y2: 270 } });
                gsap.set('#scene1-clone-d', { attr: { y1: 70, y2: 70 } });
                
                gsap.set('#scene1-clone-label-h', { attr: { y: 180 } });
                gsap.set('#scene1-clone-label-f', { attr: { y: 290 } });
                gsap.set('#scene1-clone-label-d', { attr: { y: 60 } });
                
                // Animate clones
                gsap.to('#scene1-clone-h', { attr: { y1: 310, y2: 310 }, duration: 1, delay: 0.5 });
                gsap.to('#scene1-clone-label-h', { attr: { y: 300 }, duration: 1, delay: 0.5 });
                
                gsap.to('#scene1-clone-f', { attr: { y1: 310, y2: 310 }, duration: 1, delay: 0.5 });
                gsap.to('#scene1-clone-label-f', { attr: { y: 300 }, duration: 1, delay: 0.5 });
                
                gsap.to('#scene1-clone-d', { attr: { y1: 310, y2: 310 }, duration: 1, delay: 0.5 });
                gsap.to('#scene1-clone-label-d', { attr: { y: 300 }, duration: 1, delay: 0.5 });
                
                setTimeout(() => show('scene1-text-step1'), 1500);
                
            } else if (currentStep === 2) {
                hide('scene1-step1-group');
                hide('scene1-text-step1');
                hide('scene1-text-step3');
                
                gsap.to(['#scene1-line-a', '#scene1-line-e'], { stroke: '#c62828', strokeWidth: 4, duration: 0.3 });
                gsap.to(['#scene1-line-g', '#scene1-line-c'], { stroke: '#2e7d32', strokeWidth: 4, duration: 0.3 });
                
                const step2Group = document.getElementById('scene1-step2-group');
                step2Group.style.display = '';
                gsap.to(step2Group, { opacity: 1, duration: 0.5 });
                
                // Reset clones position
                gsap.set('#scene1-clone-a', { attr: { x1: 150, y1: 310, x2: 150, y2: 190 } });
                gsap.set('#scene1-clone-e', { attr: { x1: 430, y1: 270, x2: 430, y2: 70 } });
                gsap.set('#scene1-clone-g', { attr: { x1: 270, y1: 190, x2: 270, y2: 270 } });
                gsap.set('#scene1-clone-c', { attr: { x1: 550, y1: 70, x2: 550, y2: 310 } });
                
                gsap.set('#scene1-clone-label-a', { attr: { x: 140, y: 255 } });
                gsap.set('#scene1-clone-label-e', { attr: { x: 420, y: 175 } });
                gsap.set('#scene1-clone-label-g', { attr: { x: 280, y: 235 } });
                gsap.set('#scene1-clone-label-c', { attr: { x: 560, y: 195 } });
                
                // Animate clones
                gsap.to('#scene1-clone-a', { attr: { x1: 640, y1: 340, x2: 640, y2: 220 }, duration: 1, delay: 0.5 });
                gsap.to('#scene1-clone-label-a', { attr: { x: 630, y: 285 }, duration: 1, delay: 0.5 });
                
                gsap.to('#scene1-clone-e', { attr: { x1: 640, y1: 220, x2: 640, y2: 20 }, duration: 1, delay: 0.5 });
                gsap.to('#scene1-clone-label-e', { attr: { x: 630, y: 125 }, duration: 1, delay: 0.5 });
                
                gsap.to('#scene1-clone-g', { attr: { x1: 660, y1: 20, x2: 660, y2: 100 }, duration: 1, delay: 0.5 });
                gsap.to('#scene1-clone-label-g', { attr: { x: 670, y: 65 }, duration: 1, delay: 0.5 });
                
                gsap.to('#scene1-clone-c', { attr: { x1: 660, y1: 100, x2: 660, y2: 340 }, duration: 1, delay: 0.5 });
                gsap.to('#scene1-clone-label-c', { attr: { x: 670, y: 225 }, duration: 1, delay: 0.5 });
                
                setTimeout(() => show('scene1-text-step2'), 1500);
                
            } else if (currentStep === 3) {
                hide('scene1-step1-group');
                hide('scene1-step2-group');
                hide('scene1-text-step1');
                hide('scene1-text-step2');
                
                gsap.to(['#scene1-line-h', '#scene1-line-f', '#scene1-line-d', '#scene1-line-b'], { stroke: '#1565c0', strokeWidth: 4, duration: 0.3 });
                gsap.to(['#scene1-line-a', '#scene1-line-e'], { stroke: '#c62828', strokeWidth: 4, duration: 0.3 });
                gsap.to(['#scene1-line-g', '#scene1-line-c'], { stroke: '#2e7d32', strokeWidth: 4, duration: 0.3 });
                
                show('scene1-text-step3');
            }
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateState();
            }
        });
        
        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateState();
            }
        });
        
        btnReset.addEventListener('click', () => {
            currentStep = 0;
            updateState();
        });
        
        // Initialize
        updateState();
    })();
    </script>
</body>
</html>
