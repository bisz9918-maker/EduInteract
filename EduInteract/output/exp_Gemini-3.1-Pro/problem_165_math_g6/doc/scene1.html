<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button:hover:not(:disabled) { background: #e9e9e9; }
        .fade { transition: opacity 0.3s ease-in-out; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500">
            <defs>
                <pattern id="scene1-grid-3dm" width="40" height="40" patternUnits="userSpaceOnUse">
                    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1565c0" stroke-width="1" opacity="0.3"/>
                </pattern>
                <pattern id="scene1-grid-2dm" width="26.66" height="26.66" patternUnits="userSpaceOnUse">
                    <path d="M 26.66 0 L 0 0 0 26.66" fill="none" stroke="#2e7d32" stroke-width="1" opacity="0.3"/>
                </pattern>
            </defs>

            <!-- 健身房 -->
            <text x="520" y="70" font-size="16" text-anchor="middle" fill="#000000">健身房</text>
            <rect id="scene1-gym" x="320" y="80" width="400" height="240" fill="#f5f5f5" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" />
            
            <!-- 3dm地砖 -->
            <rect id="scene1-tile-3dm" x="100" y="80" width="90" height="90" fill="none" stroke="#000000" stroke-width="2" class="fade" />
            <text x="90" y="130" font-size="16" text-anchor="end" fill="#000000">3dm</text>
            <text id="scene1-formula-3dm" x="200" y="130" font-size="16" text-anchor="start" fill="#000000" class="fade" opacity="0">3 × 3 = 9 dm²</text>

            <!-- 2dm地砖 -->
            <rect id="scene1-tile-2dm" x="115" y="250" width="60" height="60" fill="none" stroke="#000000" stroke-width="2" class="fade" />
            <text x="105" y="285" font-size="16" text-anchor="end" fill="#000000">2dm</text>
            <text id="scene1-formula-2dm" x="185" y="285" font-size="16" text-anchor="start" fill="#000000" class="fade" opacity="0">2 × 2 = 4 dm²</text>

            <!-- 结论公式 -->
            <text id="scene1-formula-total" x="520" y="360" font-size="18" text-anchor="middle" fill="#1565c0" class="fade" opacity="0">总面积 = 9 × 400 = 3600 dm²</text>
            <text id="scene1-formula-final" x="520" y="400" font-size="18" text-anchor="middle" fill="#2e7d32" class="fade" opacity="0">所需块数 = 3600 ÷ 4 = 900 块</text>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 3;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        
        const tile3dm = document.getElementById('scene1-tile-3dm');
        const formula3dm = document.getElementById('scene1-formula-3dm');
        const tile2dm = document.getElementById('scene1-tile-2dm');
        const formula2dm = document.getElementById('scene1-formula-2dm');
        const gym = document.getElementById('scene1-gym');
        const formulaTotal = document.getElementById('scene1-formula-total');
        const formulaFinal = document.getElementById('scene1-formula-final');

        function updateScene() {
            // 按钮状态
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;

            // 步骤 0: 初始状态
            if (currentStep === 0) {
                tile3dm.setAttribute('fill', 'none');
                formula3dm.style.opacity = '0';
                
                tile2dm.setAttribute('fill', 'none');
                formula2dm.style.opacity = '0';
                
                gym.setAttribute('fill', '#f5f5f5');
                formulaTotal.style.opacity = '0';
                formulaFinal.style.opacity = '0';
            }
            // 步骤 1: 3dm地砖高亮，显示面积，健身房显示3dm网格，显示总面积
            else if (currentStep === 1) {
                tile3dm.setAttribute('fill', 'rgba(21, 101, 192, 0.2)');
                formula3dm.style.opacity = '1';
                
                tile2dm.setAttribute('fill', 'none');
                formula2dm.style.opacity = '0';
                
                gym.setAttribute('fill', 'url(#scene1-grid-3dm)');
                formulaTotal.style.opacity = '1';
                formulaFinal.style.opacity = '0';
            }
            // 步骤 2: 2dm地砖高亮，显示面积
            else if (currentStep === 2) {
                tile3dm.setAttribute('fill', 'rgba(21, 101, 192, 0.2)');
                formula3dm.style.opacity = '1';
                
                tile2dm.setAttribute('fill', 'rgba(46, 125, 50, 0.2)');
                formula2dm.style.opacity = '1';
                
                gym.setAttribute('fill', 'url(#scene1-grid-3dm)');
                formulaTotal.style.opacity = '1';
                formulaFinal.style.opacity = '0';
            }
            // 步骤 3: 健身房切换为2dm网格，显示最终计算
            else if (currentStep === 3) {
                tile3dm.setAttribute('fill', 'rgba(21, 101, 192, 0.2)');
                formula3dm.style.opacity = '1';
                
                tile2dm.setAttribute('fill', 'rgba(46, 125, 50, 0.2)');
                formula2dm.style.opacity = '1';
                
                gym.setAttribute('fill', 'url(#scene1-grid-2dm)');
                formulaTotal.style.opacity = '1';
                formulaFinal.style.opacity = '1';
            }
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });

        // 初始化
        updateScene();
    })();
    </script>
</body>
</html>
