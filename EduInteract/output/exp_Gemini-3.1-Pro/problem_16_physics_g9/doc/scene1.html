<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电路分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .text-label { font-size: 14px; user-select: none; }
        .hint-text { font-size: 18px; fill: #666; text-anchor: middle; transition: opacity 0.5s ease; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500">
            <defs>
                <marker id="scene1-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828" />
                </marker>
            </defs>
            
            <!-- Divider -->
            <line x1="460" y1="20" x2="460" y2="440" stroke="#ccc" stroke-width="1" stroke-dasharray="5 5" />
            
            <!-- Left Side (Physical) -->
            <g id="scene1-left-group">
                <!-- Main Wires -->
                <path id="scene1-wire-main-1" d="M230,190 C230,150 65,200 65,260" fill="none" stroke="#000" stroke-width="2" style="transition: stroke 0.5s ease;" />
                <path id="scene1-wire-main-2" d="M95,260 C120,260 125,350 125,410" fill="none" stroke="#000" stroke-width="2" style="transition: stroke 0.5s ease;" />
                <path id="scene1-wire-main-3" d="M155,410 C250,410 410,350 410,255" fill="none" stroke="#000" stroke-width="2" style="transition: stroke 0.5s ease;" />
                <path id="scene1-wire-main-4" d="M430,255 C460,255 460,85 380,85" fill="none" stroke="#000" stroke-width="2" style="transition: stroke 0.5s ease;" />
                <path id="scene1-wire-main-5" d="M340,115 C340,150 250,150 250,190" fill="none" stroke="#000" stroke-width="2" style="transition: stroke 0.5s ease;" />
                
                <!-- V1 Wires -->
                <path id="scene1-wire-v1-1" d="M70,115 C50,115 50,260 95,260" fill="none" stroke="#000" stroke-width="2" style="transition: stroke 0.5s ease;" />
                <path id="scene1-wire-v1-2" d="M90,115 C150,115 180,350 155,410" fill="none" stroke="#000" stroke-width="2" style="transition: stroke 0.5s ease;" />
                
                <!-- V2 Wires -->
                <path id="scene1-wire-v2-1" d="M330,415 C330,450 410,450 410,255" fill="none" stroke="#000" stroke-width="2" style="transition: stroke 0.5s ease;" />
                <path id="scene1-wire-v2-2" d="M350,415 C350,350 250,250 250,190" fill="none" stroke="#000" stroke-width="2" style="transition: stroke 0.5s ease;" />

                <!-- Components -->
                <g id="scene1-comp-e" style="color: #000; transition: color 0.5s ease;">
                    <rect x="220" y="190" width="40" height="60" rx="5" fill="#eee" stroke="currentColor" stroke-width="2" />
                    <circle cx="230" cy="190" r="3" fill="currentColor"/>
                    <circle cx="250" cy="190" r="3" fill="currentColor"/>
                    <text x="240" y="180" text-anchor="middle" fill="currentColor" class="text-label">E</text>
                </g>
                <g id="scene1-comp-s" style="color: #000; transition: color 0.5s ease;">
                    <rect x="60" y="250" width="40" height="20" fill="#eee" stroke="currentColor" stroke-width="2" />
                    <circle cx="65" cy="260" r="3" fill="currentColor"/>
                    <circle cx="95" cy="260" r="3" fill="currentColor"/>
                    <line x1="65" y1="260" x2="90" y2="250" stroke="currentColor" stroke-width="2" />
                    <text x="80" y="290" text-anchor="middle" fill="currentColor" class="text-label">S</text>
                </g>
                <g id="scene1-comp-l" style="color: #000; transition: color 0.5s ease;">
                    <rect x="120" y="400" width="40" height="15" fill="#eee" stroke="currentColor" stroke-width="2" />
                    <circle cx="140" cy="385" r="15" fill="none" stroke="currentColor" stroke-width="2" />
                    <path d="M135,395 Q140,375 145,395" fill="none" stroke="currentColor" stroke-width="2" />
                    <circle cx="125" cy="410" r="3" fill="currentColor"/>
                    <circle cx="155" cy="410" r="3" fill="currentColor"/>
                    <text x="140" y="435" text-anchor="middle" fill="currentColor" class="text-label">L</text>
                </g>
                <g id="scene1-comp-r" style="color: #000; transition: color 0.5s ease;">
                    <rect x="330" y="90" width="60" height="25" fill="#eee" stroke="currentColor" stroke-width="2" />
                    <line x1="340" y1="102.5" x2="380" y2="102.5" stroke="#555" stroke-width="15" />
                    <line id="scene1-phys-r-active" x1="340" y1="102.5" x2="350" y2="102.5" stroke="transparent" stroke-width="15" style="transition: stroke 0.5s ease;" />
                    <line x1="335" y1="85" x2="385" y2="85" stroke="currentColor" stroke-width="2" />
                    <polygon points="345,80 355,80 350,95" fill="currentColor" />
                    <circle cx="340" cy="115" r="3" fill="currentColor"/>
                    <circle cx="380" cy="115" r="3" fill="currentColor"/>
                    <circle cx="340" cy="85" r="3" fill="currentColor"/>
                    <circle cx="380" cy="85" r="3" fill="currentColor"/>
                    <text x="395" y="75" text-anchor="middle" fill="currentColor" class="text-label">R</text>
                </g>
                <g id="scene1-comp-a" style="color: #000; transition: color 0.5s ease;">
                    <rect x="400" y="220" width="40" height="40" rx="5" fill="#eee" stroke="currentColor" stroke-width="2" />
                    <rect x="405" y="225" width="30" height="15" fill="#fff" stroke="currentColor" stroke-width="1" />
                    <circle cx="410" cy="255" r="3" fill="currentColor"/>
                    <circle cx="430" cy="255" r="3" fill="currentColor"/>
                    <text x="420" y="280" text-anchor="middle" fill="currentColor" class="text-label">A</text>
                </g>
                <g id="scene1-comp-v1" style="color: #000; transition: color 0.5s ease;">
                    <rect x="60" y="80" width="40" height="40" rx="5" fill="#eee" stroke="currentColor" stroke-width="2" />
                    <rect x="65" y="85" width="30" height="15" fill="#fff" stroke="currentColor" stroke-width="1" />
                    <circle cx="70" cy="115" r="3" fill="currentColor"/>
                    <circle cx="90" cy="115" r="3" fill="currentColor"/>
                    <text x="80" y="65" text-anchor="middle" fill="currentColor" class="text-label">V₁</text>
                </g>
                <g id="scene1-comp-v2" style="color: #000; transition: color 0.5s ease;">
                    <rect x="320" y="380" width="40" height="40" rx="5" fill="#eee" stroke="currentColor" stroke-width="2" />
                    <rect x="325" y="385" width="30" height="15" fill="#fff" stroke="currentColor" stroke-width="1" />
                    <circle cx="330" cy="415" r="3" fill="currentColor"/>
                    <circle cx="350" cy="415" r="3" fill="currentColor"/>
                    <text x="340" y="445" text-anchor="middle" fill="currentColor" class="text-label">V₂</text>
                </g>
            </g>
            
            <!-- Right Side (Schematic) -->
            <g id="scene1-right-group">
                <text id="scene1-hint-text" x="630" y="200" class="hint-text" style="opacity: 1;">点击「下一步」开始分析电路</text>
                
                <!-- Main Circuit -->
                <g id="scene1-sch-main" style="opacity: 0; transition: opacity 0.5s ease; color: #c62828;">
                    <!-- Wires -->
                    <path d="M610,120 L530,120 L530,235" fill="none" stroke="currentColor" stroke-width="2" />
                    <path d="M530,255 L530,360 L565,360" fill="none" stroke="currentColor" stroke-width="2" />
                    <path d="M595,360 L660,360" fill="none" stroke="currentColor" stroke-width="2" />
                    <path d="M680,352.5 L680,335 L730,335 L730,255" fill="none" stroke="currentColor" stroke-width="2" />
                    <path d="M730,225 L730,120 L650,120" fill="none" stroke="currentColor" stroke-width="2" />
                    
                    <!-- E -->
                    <path d="M610,120 L625,120 M625,110 L625,130 M635,100 L635,140 M635,120 L650,120" fill="none" stroke="currentColor" stroke-width="2" />
                    <text x="630" y="90" text-anchor="middle" fill="currentColor" class="text-label">E</text>
                    
                    <!-- S -->
                    <circle cx="530" cy="235" r="2" fill="currentColor" />
                    <circle cx="530" cy="255" r="2" fill="currentColor" />
                    <line x1="530" y1="235" x2="515" y2="250" stroke="currentColor" stroke-width="2" />
                    <text x="500" y="250" text-anchor="middle" fill="currentColor" class="text-label">S</text>
                    
                    <!-- L -->
                    <circle cx="580" cy="360" r="15" fill="none" stroke="currentColor" stroke-width="2" />
                    <path d="M570,350 L590,370 M570,370 L590,350" fill="none" stroke="currentColor" stroke-width="2" />
                    <text x="580" y="335" text-anchor="middle" fill="currentColor" class="text-label">L</text>
                    
                    <!-- R -->
                    <rect x="660" y="352.5" width="40" height="15" fill="none" stroke="currentColor" stroke-width="2" />
                    <path d="M680,335 L680,352.5 L675,347.5 M680,352.5 L685,347.5" fill="none" stroke="currentColor" stroke-width="2" />
                    <text x="680" y="390" text-anchor="middle" fill="currentColor" class="text-label">R</text>
                    
                    <!-- A -->
                    <circle cx="730" cy="240" r="15" fill="none" stroke="currentColor" stroke-width="2" />
                    <text x="760" y="245" text-anchor="middle" fill="currentColor" class="text-label">A</text>
                </g>
                
                <!-- R Active Coil Highlight -->
                <g id="scene1-sch-r-active" style="opacity: 0; transition: opacity 0.5s ease; color: #c62828;">
                    <line x1="660" y1="360" x2="680" y2="360" stroke="currentColor" stroke-width="6" />
                    <text x="670" y="260" text-anchor="middle" fill="currentColor" font-size="12">有效阻值段</text>
                    <path d="M670,265 L670,340" fill="none" stroke="currentColor" stroke-width="1" />
                    <path d="M665,335 L670,340 L675,335" fill="none" stroke="currentColor" stroke-width="1" />
                </g>
                
                <!-- V1 Branch -->
                <g id="scene1-sch-v1" style="opacity: 0; transition: opacity 0.5s ease; color: #1565c0;">
                    <path d="M550,360 L550,420 L565,420" fill="none" stroke="currentColor" stroke-width="2" />
                    <path d="M610,360 L610,420 L595,420" fill="none" stroke="currentColor" stroke-width="2" />
                    <circle cx="580" cy="420" r="15" fill="none" stroke="currentColor" stroke-width="2" />
                    <text x="580" y="460" text-anchor="middle" fill="currentColor" class="text-label">V₁</text>
                    <!-- Connection dots -->
                    <circle cx="550" cy="360" r="3" fill="currentColor" />
                    <circle cx="610" cy="360" r="3" fill="currentColor" />
                </g>
                
                <!-- V2 Branch -->
                <g id="scene1-sch-v2" style="opacity: 0; transition: opacity 0.5s ease; color: #2e7d32;">
                    <path d="M645,360 L645,420 L665,420" fill="none" stroke="currentColor" stroke-width="2" />
                    <path d="M715,335 L715,420 L695,420" fill="none" stroke="currentColor" stroke-width="2" />
                    <circle cx="680" cy="420" r="15" fill="none" stroke="currentColor" stroke-width="2" />
                    <text x="680" y="460" text-anchor="middle" fill="currentColor" class="text-label">V₂</text>
                    <!-- Connection dots -->
                    <circle cx="645" cy="360" r="3" fill="currentColor" />
                    <circle cx="715" cy="335" r="3" fill="currentColor" />
                </g>
            </g>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 4;
        
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        
        function updateScene() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
            
            // Reset all colors to black
            const mainWires = ['scene1-wire-main-1', 'scene1-wire-main-2', 'scene1-wire-main-3', 'scene1-wire-main-4', 'scene1-wire-main-5'];
            const v1Wires = ['scene1-wire-v1-1', 'scene1-wire-v1-2'];
            const v2Wires = ['scene1-wire-v2-1', 'scene1-wire-v2-2'];
            const mainComps = ['scene1-comp-e', 'scene1-comp-s', 'scene1-comp-l', 'scene1-comp-r', 'scene1-comp-a'];
            
            mainWires.forEach(id => document.getElementById(id).style.stroke = '#000');
            v1Wires.forEach(id => document.getElementById(id).style.stroke = '#000');
            v2Wires.forEach(id => document.getElementById(id).style.stroke = '#000');
            mainComps.forEach(id => document.getElementById(id).style.color = '#000');
            document.getElementById('scene1-comp-v1').style.color = '#000';
            document.getElementById('scene1-comp-v2').style.color = '#000';
            
            document.getElementById('scene1-phys-r-active').style.stroke = 'transparent';
            
            // Reset schematic opacities
            document.getElementById('scene1-hint-text').style.display = 'block';
            document.getElementById('scene1-hint-text').style.opacity = '1';
            document.getElementById('scene1-sch-main').style.display = 'none';
            document.getElementById('scene1-sch-main').style.opacity = '0';
            document.getElementById('scene1-sch-r-active').style.display = 'none';
            document.getElementById('scene1-sch-r-active').style.opacity = '0';
            document.getElementById('scene1-sch-v1').style.display = 'none';
            document.getElementById('scene1-sch-v1').style.opacity = '0';
            document.getElementById('scene1-sch-v2').style.display = 'none';
            document.getElementById('scene1-sch-v2').style.opacity = '0';
            
            if (currentStep >= 1) {
                mainWires.forEach(id => document.getElementById(id).style.stroke = '#c62828');
                mainComps.forEach(id => document.getElementById(id).style.color = '#c62828');
                document.getElementById('scene1-hint-text').style.display = 'none';
                document.getElementById('scene1-hint-text').style.opacity = '0';
                document.getElementById('scene1-sch-main').style.display = 'block';
                // Small delay to allow display:block to apply before opacity transition
                setTimeout(() => document.getElementById('scene1-sch-main').style.opacity = '1', 10);
            }
            
            if (currentStep >= 2) {
                document.getElementById('scene1-phys-r-active').style.stroke = '#c62828';
                document.getElementById('scene1-sch-r-active').style.display = 'block';
                setTimeout(() => document.getElementById('scene1-sch-r-active').style.opacity = '1', 10);
            }
            
            if (currentStep >= 3) {
                v1Wires.forEach(id => document.getElementById(id).style.stroke = '#1565c0');
                document.getElementById('scene1-comp-v1').style.color = '#1565c0';
                document.getElementById('scene1-sch-v1').style.display = 'block';
                setTimeout(() => document.getElementById('scene1-sch-v1').style.opacity = '1', 10);
            }
            
            if (currentStep >= 4) {
                v2Wires.forEach(id => document.getElementById(id).style.stroke = '#2e7d32');
                document.getElementById('scene1-comp-v2').style.color = '#2e7d32';
                document.getElementById('scene1-sch-v2').style.display = 'block';
                setTimeout(() => document.getElementById('scene1-sch-v2').style.opacity = '1', 10);
            }
        }
        
        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });
        
        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });
        
        // Initialize
        updateScene();
    })();
    </script>
</body>
</html>
