<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene2-draggable { cursor: pointer; }
        .scene2-draggable:hover { fill: #666; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" id="scene2-svg">
            <!-- 主电路导线 -->
            <line x1="100" y1="120" x2="380" y2="120" stroke="#000000" stroke-width="2" />
            <line x1="380" y1="120" x2="380" y2="380" stroke="#000000" stroke-width="2" />
            <line x1="380" y1="380" x2="100" y2="380" stroke="#000000" stroke-width="2" />
            <line x1="100" y1="380" x2="100" y2="120" stroke="#000000" stroke-width="2" />
            
            <!-- 电源 -->
            <rect x="220" y="370" width="40" height="20" fill="#ffffff" stroke="#000000" stroke-width="2" />
            <line x1="220" y1="370" x2="220" y2="390" stroke="#000000" stroke-width="2" />
            <line x1="260" y1="375" x2="260" y2="385" stroke="#000000" stroke-width="4" />
            <text x="240" y="420" text-anchor="middle" font-size="16">$U$</text>

            <!-- 开关 -->
            <line x1="300" y1="380" x2="340" y2="380" stroke="#000000" stroke-width="2" />
            <circle cx="300" cy="380" r="3" fill="#000000" />
            <circle cx="340" cy="380" r="3" fill="#000000" />
            <text x="320" y="420" text-anchor="middle" font-size="16">$S$</text>

            <!-- 灯泡L -->
            <circle cx="100" cy="250" r="35" fill="#fbc02d" opacity="0.5" id="scene2-bulb-glow" />
            <circle cx="100" cy="250" r="20" fill="#ffffff" stroke="#000000" stroke-width="2" />
            <line x1="86" y1="236" x2="114" y2="264" stroke="#000000" stroke-width="2" />
            <line x1="114" y1="236" x2="86" y2="264" stroke="#000000" stroke-width="2" />
            <text x="140" y="255" font-size="16">$L$</text>

            <!-- 滑动变阻器 -->
            <rect x="180" y="110" width="120" height="20" fill="#e0e0e0" stroke="#000000" stroke-width="1" />
            <rect x="180" y="110" width="60" height="20" fill="#333333" id="scene2-resistor-active" />
            <text x="240" y="155" text-anchor="middle" font-size="16">$R$</text>
            
            <!-- 滑片 -->
            <g id="scene2-slider-group" class="scene2-draggable" transform="translate(240, 110)">
                <polygon points="-8,0 8,0 0,16" fill="#000000" />
                <rect x="-15" y="-20" width="30" height="40" fill="transparent" />
            </g>
            <text x="240" y="80" text-anchor="middle" font-size="14" fill="#666666" id="scene2-drag-hint">向右拖拽 ➔</text>

            <!-- 电流表A -->
            <circle cx="380" cy="250" r="25" fill="#ffffff" stroke="#000000" stroke-width="2" />
            <polyline points="375,265 380,255 385,265" fill="none" stroke="#000000" stroke-width="1.5" />
            <line x1="376.5" y1="262" x2="383.5" y2="262" stroke="#000000" stroke-width="1.5" />
            <line x1="380" y1="260" x2="380" y2="235" stroke="#000000" stroke-width="2" id="scene2-a-pointer" transform="rotate(30, 380, 260)" />
            <text x="420" y="255" font-size="16">$I$</text>

            <!-- 电压表V1 -->
            <line x1="100" y1="210" x2="50" y2="210" stroke="#1565c0" stroke-width="2" />
            <line x1="50" y1="210" x2="50" y2="225" stroke="#1565c0" stroke-width="2" />
            <line x1="100" y1="290" x2="50" y2="290" stroke="#1565c0" stroke-width="2" />
            <line x1="50" y1="290" x2="50" y2="275" stroke="#1565c0" stroke-width="2" />
            <circle cx="50" cy="250" r="25" fill="#ffffff" stroke="#1565c0" stroke-width="2" />
            <polyline points="45,255 50,265 55,255" fill="none" stroke="#1565c0" stroke-width="1.5" />
            <line x1="50" y1="260" x2="50" y2="235" stroke="#1565c0" stroke-width="2" id="scene2-v1-pointer" transform="rotate(30, 50, 260)" />
            <text x="50" y="210" text-anchor="middle" font-size="16" fill="#1565c0">$U_1$</text>

            <!-- 电压表V2 -->
            <line x1="180" y1="120" x2="180" y2="75" stroke="#2e7d32" stroke-width="2" />
            <line x1="180" y1="75" x2="215" y2="75" stroke="#2e7d32" stroke-width="2" />
            <line x1="300" y1="120" x2="300" y2="75" stroke="#2e7d32" stroke-width="2" />
            <line x1="300" y1="75" x2="265" y2="75" stroke="#2e7d32" stroke-width="2" />
            <circle cx="240" cy="75" r="25" fill="#ffffff" stroke="#2e7d32" stroke-width="2" />
            <polyline points="235,80 240,90 245,80" fill="none" stroke="#2e7d32" stroke-width="1.5" />
            <line x1="240" y1="85" x2="240" y2="60" stroke="#2e7d32" stroke-width="2" id="scene2-v2-pointer" transform="rotate(30, 240, 85)" />
            <text x="240" y="45" text-anchor="middle" font-size="16" fill="#2e7d32">$U_2$</text>

            <!-- V1+V2柱状图 -->
            <line x1="500" y1="100" x2="600" y2="100" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" />
            <text x="480" y="105" text-anchor="end" font-size="16" fill="#888888">$U$</text>
            
            <rect x="520" y="100" width="60" height="150" fill="#2e7d32" id="scene2-bar-v2" />
            <text x="590" y="175" text-anchor="start" font-size="16" fill="#2e7d32" id="scene2-label-v2">$U_2$</text>
            
            <rect x="520" y="250" width="60" height="150" fill="#1565c0" id="scene2-bar-v1" />
            <text x="590" y="325" text-anchor="start" font-size="16" fill="#1565c0" id="scene2-label-v1">$U_1$</text>
            
            <line x1="500" y1="400" x2="600" y2="400" stroke="#000000" stroke-width="2" />

            <!-- 总功率柱状图 -->
            <line x1="640" y1="100" x2="720" y2="100" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" />
            <text x="715" y="95" text-anchor="end" font-size="14" fill="#888888">最大功率</text>
            
            <rect x="660" y="300" width="40" height="100" fill="#e65100" id="scene2-bar-p" />
            <text x="680" y="425" text-anchor="middle" font-size="16" fill="#e65100">$P_{总}$</text>
            
            <line x1="640" y1="400" x2="720" y2="400" stroke="#000000" stroke-width="2" />
        </svg>
    </div>
    <script>
    (function() {
        const sliderGroup = document.getElementById('scene2-slider-group');
        const resistorActive = document.getElementById('scene2-resistor-active');
        const bulbGlow = document.getElementById('scene2-bulb-glow');
        const aPointer = document.getElementById('scene2-a-pointer');
        const v1Pointer = document.getElementById('scene2-v1-pointer');
        const v2Pointer = document.getElementById('scene2-v2-pointer');
        const barV1 = document.getElementById('scene2-bar-v1');
        const barV2 = document.getElementById('scene2-bar-v2');
        const labelV1 = document.getElementById('scene2-label-v1');
        const labelV2 = document.getElementById('scene2-label-v2');
        const barP = document.getElementById('scene2-bar-p');
        const dragHint = document.getElementById('scene2-drag-hint');

        let isDragging = false;
        let sliderX = 240; // 180 to 300
        const minX = 180;
        const maxX = 300;

        // Physics model
        const U = 12;
        const RL = 10;
        const Rmax = 50;

        function updateSimulation() {
            // Update slider position
            sliderGroup.setAttribute('transform', `translate(${sliderX}, 110)`);
            resistorActive.setAttribute('width', sliderX - minX);

            // Calculate physics
            const Rslider = Rmax * (sliderX - minX) / (maxX - minX);
            const I = U / (RL + Rslider);
            const U1 = I * RL;
            const U2 = U - U1;
            const P = U * I;

            // Max values for scaling
            const Imax = U / RL;
            const Pmax = U * Imax;

            // Update pointers (angle from -45 to 45)
            const angleA = -45 + (I / Imax) * 90;
            aPointer.setAttribute('transform', `rotate(${angleA}, 380, 260)`);

            const angleV1 = -45 + (U1 / U) * 90;
            v1Pointer.setAttribute('transform', `rotate(${angleV1}, 50, 260)`);

            const angleV2 = -45 + (U2 / U) * 90;
            v2Pointer.setAttribute('transform', `rotate(${angleV2}, 240, 85)`);

            // Update bulb glow
            bulbGlow.setAttribute('opacity', 0.2 + 0.6 * (I / Imax));

            // Update bars
            const totalHeight = 300; // 400 - 100
            const hV1 = totalHeight * (U1 / U);
            const hV2 = totalHeight * (U2 / U);

            barV1.setAttribute('height', hV1);
            barV1.setAttribute('y', 400 - hV1);
            labelV1.setAttribute('y', 400 - hV1 / 2 + 5);
            labelV1.setAttribute('opacity', hV1 > 20 ? 1 : 0);

            barV2.setAttribute('height', hV2);
            barV2.setAttribute('y', 100);
            labelV2.setAttribute('y', 100 + hV2 / 2 + 5);
            labelV2.setAttribute('opacity', hV2 > 20 ? 1 : 0);

            const hP = totalHeight * (P / Pmax);
            barP.setAttribute('height', hP);
            barP.setAttribute('y', 400 - hP);
        }

        // Drag events
        function startDrag(e) {
            isDragging = true;
            dragHint.setAttribute('opacity', '0');
            e.preventDefault();
        }

        function doDrag(e) {
            if (!isDragging) return;
            
            const svg = document.getElementById('scene2-svg');
            const pt = svg.createSVGPoint();
            
            if (e.touches) {
                pt.x = e.touches[0].clientX;
                pt.y = e.touches[0].clientY;
            } else {
                pt.x = e.clientX;
                pt.y = e.clientY;
            }
            
            const svgP = pt.matrixTransform(svg.getScreenCTM().inverse());
            
            sliderX = Math.max(minX, Math.min(maxX, svgP.x));
            updateSimulation();
        }

        function endDrag() {
            isDragging = false;
        }

        sliderGroup.addEventListener('mousedown', startDrag);
        sliderGroup.addEventListener('touchstart', startDrag, {passive: false});
        
        window.addEventListener('mousemove', doDrag);
        window.addEventListener('touchmove', doDrag, {passive: false});
        
        window.addEventListener('mouseup', endDrag);
        window.addEventListener('touchend', endDrag);

        // Initial update
        updateSimulation();
    })();
    </script>
</body>
</html>
