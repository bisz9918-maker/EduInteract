<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button:hover:not(:disabled) { background: #e9e9e9; }
        
        .scene1-group { transition: opacity 0.3s ease; }
        .scene1-text { font-size: 14px; fill: #333333; text-anchor: middle; dominant-baseline: middle; }
        .scene1-text-conclusion { font-size: 16px; fill: #333333; text-anchor: middle; font-weight: bold; }
        .scene1-circle { stroke: #000000; stroke-width: 2px; transition: fill 0.3s ease; }
        .scene1-line { stroke: #666666; stroke-width: 1px; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500">
            <!-- 分割线 -->
            <line x1="350" y1="50" x2="350" y2="400" stroke="#cccccc" stroke-width="1" stroke-dasharray="5,5" />
            
            <!-- 左侧原图 -->
            <g id="scene1-group-left" class="scene1-group">
                <circle id="scene1-left-c1" class="scene1-circle" cx="175" cy="220" r="120" fill="#1565c0" fill-opacity="0.2" />
                <circle id="scene1-left-c2" class="scene1-circle" cx="225" cy="150" r="35" fill="#1565c0" fill-opacity="0.2" />
                <circle id="scene1-left-c3" class="scene1-circle" cx="125" cy="250" r="35" fill="#1565c0" fill-opacity="0.2" />
                <circle id="scene1-left-c4" class="scene1-circle" cx="225" cy="250" r="35" fill="#1565c0" fill-opacity="0.2" />
                
                <!-- 标签与指示线 -->
                <text class="scene1-text" x="175" y="70">Ⅰ</text>
                <line class="scene1-line" x1="175" y1="85" x2="175" y2="100" />
                
                <text class="scene1-text" x="320" y="150">Ⅱ</text>
                <line class="scene1-line" x1="305" y1="150" x2="260" y2="150" />
                
                <text class="scene1-text" x="30" y="250">Ⅲ</text>
                <line class="scene1-line" x1="45" y1="250" x2="90" y2="250" />
                
                <text class="scene1-text" x="320" y="250">Ⅳ</text>
                <line class="scene1-line" x1="305" y1="250" x2="260" y2="250" />
                
                <text id="scene1-left-conclusion1" class="scene1-text-conclusion" x="175" y="370">逻辑：Ⅰ包含Ⅱ、Ⅲ、Ⅳ</text>
                <text id="scene1-left-conclusion2" class="scene1-text-conclusion" x="175" y="410">且Ⅱ、Ⅲ、Ⅳ并列</text>
            </g>

            <!-- 右侧 A 选项 -->
            <g id="scene1-group-a" class="scene1-group" style="opacity: 0; display: none;">
                <circle class="scene1-circle" cx="425" cy="220" r="35" fill="#c62828" fill-opacity="0.2" />
                <circle class="scene1-circle" cx="525" cy="220" r="35" fill="#c62828" fill-opacity="0.2" />
                <circle class="scene1-circle" cx="625" cy="220" r="35" fill="#c62828" fill-opacity="0.2" />
                <circle class="scene1-circle" cx="725" cy="220" r="35" fill="#c62828" fill-opacity="0.2" />
                
                <text class="scene1-text" x="425" y="160">鱼类</text>
                <line class="scene1-line" x1="425" y1="175" x2="425" y2="185" />
                
                <text class="scene1-text" x="525" y="160">爬行类</text>
                <line class="scene1-line" x1="525" y1="175" x2="525" y2="185" />
                
                <text class="scene1-text" x="625" y="160">鸟类</text>
                <line class="scene1-line" x1="625" y1="175" x2="625" y2="185" />
                
                <text class="scene1-text" x="725" y="160">哺乳类</text>
                <line class="scene1-line" x1="725" y1="175" x2="725" y2="185" />
                
                <text class="scene1-text-conclusion" x="575" y="380">A选项：纯并列关系，无包含</text>
            </g>

            <!-- 右侧 B 选项 -->
            <g id="scene1-group-b" class="scene1-group" style="opacity: 0; display: none;">
                <circle class="scene1-circle" cx="575" cy="220" r="120" fill="#c62828" fill-opacity="0.2" />
                <circle class="scene1-circle" cx="575" cy="220" r="90" fill="#c62828" fill-opacity="0.2" />
                <circle class="scene1-circle" cx="575" cy="220" r="60" fill="#c62828" fill-opacity="0.2" />
                <circle class="scene1-circle" cx="575" cy="220" r="30" fill="#c62828" fill-opacity="0.2" />
                
                <text class="scene1-text" x="575" y="70">细胞核</text>
                <line class="scene1-line" x1="575" y1="85" x2="575" y2="100" />
                
                <text class="scene1-text" x="740" y="130">染色体</text>
                <line class="scene1-line" x1="715" y1="130" x2="645" y2="160" />
                
                <text class="scene1-text" x="740" y="220">DNA</text>
                <line class="scene1-line" x1="715" y1="220" x2="635" y2="220" />
                
                <text class="scene1-text" x="740" y="310">基因</text>
                <line class="scene1-line" x1="715" y1="310" x2="595" y2="235" />
                
                <text class="scene1-text-conclusion" x="575" y="380">B选项：层级包含关系</text>
            </g>

            <!-- 右侧 C 选项 -->
            <g id="scene1-group-c" class="scene1-group" style="opacity: 0; display: none;">
                <circle class="scene1-circle" cx="575" cy="220" r="120" fill="#c62828" fill-opacity="0.2" />
                <circle class="scene1-circle" cx="510" cy="230" r="45" fill="#c62828" fill-opacity="0.2" />
                <circle class="scene1-circle" cx="630" cy="220" r="60" fill="#c62828" fill-opacity="0.2" />
                <circle class="scene1-circle" cx="630" cy="235" r="35" fill="#c62828" fill-opacity="0.2" />
                
                <text class="scene1-text" x="575" y="70">种子</text>
                <line class="scene1-line" x1="575" y1="85" x2="575" y2="100" />
                
                <text class="scene1-text" x="410" y="230">种皮</text>
                <line class="scene1-line" x1="435" y1="230" x2="465" y2="230" />
                
                <text class="scene1-text" x="740" y="160">胚</text>
                <line class="scene1-line" x1="720" y1="160" x2="670" y2="180" />
                
                <text class="scene1-text" x="740" y="260">子叶</text>
                <line class="scene1-line" x1="720" y1="260" x2="660" y2="245" />
                
                <text class="scene1-text-conclusion" x="575" y="380">C选项：内部存在嵌套，非纯并列</text>
            </g>

            <!-- 右侧 D 选项 -->
            <g id="scene1-group-d" class="scene1-group" style="opacity: 0; display: none;">
                <circle class="scene1-circle" cx="575" cy="220" r="120" fill="#2e7d32" fill-opacity="0.2" />
                <circle class="scene1-circle" cx="625" cy="150" r="35" fill="#2e7d32" fill-opacity="0.2" />
                <circle class="scene1-circle" cx="525" cy="250" r="35" fill="#2e7d32" fill-opacity="0.2" />
                <circle class="scene1-circle" cx="625" cy="250" r="35" fill="#2e7d32" fill-opacity="0.2" />
                
                <text class="scene1-text" x="575" y="70">微生物</text>
                <line class="scene1-line" x1="575" y1="85" x2="575" y2="100" />
                
                <text class="scene1-text" x="740" y="150">病毒</text>
                <line class="scene1-line" x1="715" y1="150" x2="660" y2="150" />
                
                <text class="scene1-text" x="410" y="250">细菌</text>
                <line class="scene1-line" x1="435" y1="250" x2="490" y2="250" />
                
                <text class="scene1-text" x="740" y="250">真菌</text>
                <line class="scene1-line" x1="715" y1="250" x2="660" y2="250" />
                
                <text class="scene1-text-conclusion" x="575" y="380">D选项：完全符合原图逻辑</text>
            </g>
            
            <!-- 初始提示 -->
            <g id="scene1-group-init" class="scene1-group">
                <text class="scene1-text-conclusion" x="575" y="220" fill="#666666">请点击「下一步」逐一解析选项</text>
            </g>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 4;
        
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        
        const groupInit = document.getElementById('scene1-group-init');
        const groupA = document.getElementById('scene1-group-a');
        const groupB = document.getElementById('scene1-group-b');
        const groupC = document.getElementById('scene1-group-c');
        const groupD = document.getElementById('scene1-group-d');
        
        const leftCircles = [
            document.getElementById('scene1-left-c1'),
            document.getElementById('scene1-left-c2'),
            document.getElementById('scene1-left-c3'),
            document.getElementById('scene1-left-c4')
        ];
        const leftConclusion1 = document.getElementById('scene1-left-conclusion1');
        const leftConclusion2 = document.getElementById('scene1-left-conclusion2');
        
        const rightGroups = [groupInit, groupA, groupB, groupC, groupD];
        
        function showGroup(group) {
            group.style.display = 'block';
            // 强制重绘以触发过渡
            group.getBoundingClientRect();
            group.style.opacity = '1';
        }
        
        function hideGroup(group) {
            group.style.opacity = '0';
            setTimeout(() => {
                if (group.style.opacity === '0') {
                    group.style.display = 'none';
                }
            }, 300);
        }
        
        function updateScene() {
            // 更新按钮状态
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
            
            // 更新左侧样式
            if (currentStep === 0) {
                leftCircles.forEach(c => {
                    c.setAttribute('fill', '#1565c0');
                    c.setAttribute('fill-opacity', '0.2');
                });
                leftConclusion1.style.opacity = '1';
                leftConclusion2.style.opacity = '1';
            } else {
                leftCircles.forEach(c => {
                    c.setAttribute('fill', '#f5f5f5');
                    c.setAttribute('fill-opacity', '0.3');
                });
                leftConclusion1.style.opacity = '0.5';
                leftConclusion2.style.opacity = '0.5';
            }
            
            // 更新右侧显示
            rightGroups.forEach((g, index) => {
                if (index === currentStep) {
                    showGroup(g);
                } else {
                    hideGroup(g);
                }
            });
        }
        
        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });
        
        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });
        
        // 初始化
        updateScene();
    })();
    </script>
</body>
</html>
