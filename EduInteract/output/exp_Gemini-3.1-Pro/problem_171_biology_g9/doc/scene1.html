<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .hidden { opacity: 0; display: none; }
        .fade-in { transition: opacity 0.3s ease-in-out; }
        .highlight { stroke: #1565c0 !important; stroke-width: 3px !important; }
        
        #scene1-options {
            position: absolute;
            left: 450px;
            top: 230px;
            width: 320px;
            height: 180px;
            font-size: 16px;
            line-height: 1.8;
            opacity: 0;
            display: none;
            transition: opacity 0.3s;
        }
        .strike { text-decoration: line-through; color: #000; }
        .correct-text { color: #c62828; font-weight: bold; margin-left: 4px; }
        .correct-mark { color: #2e7d32; font-weight: bold; margin-left: 8px; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- Definitions -->
            <defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#000" />
                </marker>
            </defs>

            <!-- 辅助虚线 -->
            <g id="scene1-step2-lines" class="hidden fade-in">
                <line x1="105" y1="120" x2="105" y2="295" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" />
                <line x1="195" y1="120" x2="195" y2="285" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" />
                <line x1="295" y1="120" x2="295" y2="295" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" />
            </g>

            <!-- 概念图框 -->
            <g id="scene1-boxes">
                <!-- A框 -->
                
        <line id="scene1-box-a-top" x1="75" y1="60" x2="135" y2="60" stroke="#000" stroke-width="1.5" class="box-line-a" />
        <line id="scene1-box-a-right" x1="135" y1="60" x2="135" y2="120" stroke="#000" stroke-width="1.5" class="box-line-a" />
        <line id="scene1-box-a-bottom" x1="75" y1="120" x2="135" y2="120" stroke="#000" stroke-width="1.5" class="box-line-a" />
        <line id="scene1-box-a-left" x1="75" y1="60" x2="75" y2="120" stroke="#000" stroke-width="1.5" class="box-line-a" />
    
                <text x="105" y="96" font-size="24" text-anchor="middle" font-family="serif">A</text>
                
                <!-- 加号1 -->
                <text x="150" y="96" font-size="24" text-anchor="middle">+</text>

                <!-- B框 -->
                
        <line id="scene1-box-b-top" x1="165" y1="60" x2="225" y2="60" stroke="#000" stroke-width="1.5" class="box-line-b" />
        <line id="scene1-box-b-right" x1="225" y1="60" x2="225" y2="120" stroke="#000" stroke-width="1.5" class="box-line-b" />
        <line id="scene1-box-b-bottom" x1="165" y1="120" x2="225" y2="120" stroke="#000" stroke-width="1.5" class="box-line-b" />
        <line id="scene1-box-b-left" x1="165" y1="60" x2="165" y2="120" stroke="#000" stroke-width="1.5" class="box-line-b" />
    
                <text x="195" y="82" font-size="20" text-anchor="middle" font-family="serif">B</text>
                <text x="195" y="108" font-size="18" text-anchor="middle">糖</text>

                <!-- 加号2 -->
                <text x="240" y="96" font-size="24" text-anchor="middle">+</text>

                <!-- C框 -->
                
        <line id="scene1-box-c-top" x1="255" y1="60" x2="335" y2="60" stroke="#000" stroke-width="1.5" class="box-line-c" />
        <line id="scene1-box-c-right" x1="335" y1="60" x2="335" y2="120" stroke="#000" stroke-width="1.5" class="box-line-c" />
        <line id="scene1-box-c-bottom" x1="255" y1="120" x2="335" y2="120" stroke="#000" stroke-width="1.5" class="box-line-c" />
        <line id="scene1-box-c-left" x1="255" y1="60" x2="255" y2="120" stroke="#000" stroke-width="1.5" class="box-line-c" />
    
                <text x="295" y="82" font-size="20" text-anchor="middle" font-family="serif">C</text>
                <text x="295" y="108" font-size="18" text-anchor="middle">磷酸</text>

                <!-- 箭头1 -->
                <line x1="345" y1="90" x2="385" y2="90" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />

                <!-- D框 -->
                
        <line id="scene1-box-d-top" x1="395" y1="60" x2="525" y2="60" stroke="#000" stroke-width="1.5" class="box-line-d" />
        <line id="scene1-box-d-right" x1="525" y1="60" x2="525" y2="120" stroke="#000" stroke-width="1.5" class="box-line-d" />
        <line id="scene1-box-d-bottom" x1="395" y1="120" x2="525" y2="120" stroke="#000" stroke-width="1.5" class="box-line-d" />
        <line id="scene1-box-d-left" x1="395" y1="60" x2="395" y2="120" stroke="#000" stroke-width="1.5" class="box-line-d" />
    
                <text x="460" y="82" font-size="20" text-anchor="middle" font-family="serif">D</text>
                <text x="460" y="108" font-size="18" text-anchor="middle">(　　　)</text>

                <!-- 箭头2 -->
                <line x1="535" y1="90" x2="575" y2="90" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />

                <!-- E框 -->
                
        <line id="scene1-box-e-top" x1="585" y1="60" x2="675" y2="60" stroke="#000" stroke-width="1.5" class="box-line-e" />
        <line id="scene1-box-e-right" x1="675" y1="60" x2="675" y2="120" stroke="#000" stroke-width="1.5" class="box-line-e" />
        <line id="scene1-box-e-bottom" x1="585" y1="120" x2="675" y2="120" stroke="#000" stroke-width="1.5" class="box-line-e" />
        <line id="scene1-box-e-left" x1="585" y1="60" x2="585" y2="120" stroke="#000" stroke-width="1.5" class="box-line-e" />
    
                <text x="630" y="82" font-size="20" text-anchor="middle" font-family="serif">E</text>
                <text x="630" y="108" font-size="18" text-anchor="middle">DNA</text>
            </g>

            <!-- 模式图 -->
            <g id="scene1-model" class="hidden fade-in">
                <!-- 模式图连线 -->
                <line x1="135" y1="315" x2="165" y2="305" stroke="#000" stroke-width="2" />
                <line x1="225" y1="305" x2="270" y2="315" stroke="#000" stroke-width="2" />

                <!-- 碱基 -->
                <rect x="75" y="295" width="60" height="50" fill="rgba(46,125,50,0.2)" stroke="#000" stroke-width="1.5" />
                
                <!-- 脱氧核糖 (五边形) -->
                <polygon points="195,285 165,305 175,345 215,345 225,305" fill="rgba(21,101,192,0.2)" stroke="#000" stroke-width="1.5" />
                
                <!-- 磷酸 -->
                <circle cx="295" cy="320" r="25" fill="rgba(136,136,136,0.2)" stroke="#000" stroke-width="1.5" />
            </g>

            <!-- 标签 -->
            <g id="scene1-labels">
                <!-- Step 1 标签 -->
                <text id="scene1-label-d1" x="460" y="160" font-size="18" fill="#1565c0" text-anchor="middle" class="hidden fade-in">脱氧核苷酸</text>
                
                <!-- Step 2 标签 -->
                <g id="scene1-label-a1" class="hidden fade-in">
                    
                    <text x="105" y="180" font-size="18" fill="#1565c0" text-anchor="middle">含氮碱基</text>
                </g>
                <g id="scene1-label-b1" class="hidden fade-in">
                    
                    <text x="195" y="180" font-size="18" fill="#1565c0" text-anchor="middle">脱氧核糖</text>
                </g>

                <!-- Step 3 标签 -->
                <text id="scene1-label-a2" x="105" y="220" font-size="18" fill="#1565c0" text-anchor="middle" class="hidden fade-in">4种 (A, T, C, G)</text>
                <text id="scene1-label-d2" x="460" y="200" font-size="18" fill="#1565c0" text-anchor="middle" class="hidden fade-in">4种</text>
            </g>
        </svg>

        <!-- 选项判定区 -->
        <div id="scene1-options">
            <div>A．A表示的碱基有<span class="strike">5</span><span class="correct-text">4</span>种</div>
            <div>B．D表示脱氧核苷酸<span class="correct-mark">✔</span></div>
            <div>C．D表示的结构有<span class="strike">8</span><span class="correct-text">4</span>种</div>
            <div>D．B表示的是<span class="strike">核糖</span><span class="correct-text">脱氧核糖</span></div>
        </div>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 4;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');

        // Elements
        const boxA = document.querySelectorAll('.box-line-a');
        const boxB = document.querySelectorAll('.box-line-b');
        const boxC = document.querySelectorAll('.box-line-c');
        const boxD = document.querySelectorAll('.box-line-d');
        const boxE = document.querySelectorAll('.box-line-e');
        
        const model = document.getElementById('scene1-model');
        const step2Lines = document.getElementById('scene1-step2-lines');
        
        const labelD1 = document.getElementById('scene1-label-d1');
        const labelA1 = document.getElementById('scene1-label-a1');
        const labelB1 = document.getElementById('scene1-label-b1');
        const labelA2 = document.getElementById('scene1-label-a2');
        const labelD2 = document.getElementById('scene1-label-d2');
        
        const options = document.getElementById('scene1-options');

        function show(el) {
            if (!el) return;
            el.style.display = el.tagName.toLowerCase() === 'g' || el.tagName.toLowerCase() === 'text' ? 'block' : 'block';
            // Force reflow
            void el.offsetWidth;
            el.style.opacity = '1';
            el.classList.remove('hidden');
        }

        function hide(el) {
            if (!el) return;
            el.style.opacity = '0';
            setTimeout(() => {
                if (el.style.opacity === '0') {
                    el.style.display = 'none';
                    el.classList.add('hidden');
                }
            }, 300);
        }

        function updateState() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;

            // Reset highlights
            boxA.forEach(l => l.classList.remove('highlight'));
            boxB.forEach(l => l.classList.remove('highlight'));
            boxC.forEach(l => l.classList.remove('highlight'));
            boxD.forEach(l => l.classList.remove('highlight'));
            boxE.forEach(l => l.classList.remove('highlight'));

            // Step 0: Initial
            if (currentStep < 1) {
                hide(model);
                hide(labelD1);
            }
            
            // Step 1
            if (currentStep === 1) {
                boxD.forEach(l => l.classList.add('highlight'));
                boxE.forEach(l => l.classList.add('highlight'));
                show(model);
                show(labelD1);
                hide(step2Lines);
                hide(labelA1);
                hide(labelB1);
            } else if (currentStep > 1) {
                show(model);
                show(labelD1);
            }

            // Step 2
            if (currentStep === 2) {
                boxA.forEach(l => l.classList.add('highlight'));
                boxB.forEach(l => l.classList.add('highlight'));
                boxC.forEach(l => l.classList.add('highlight'));
                show(step2Lines);
                show(labelA1);
                show(labelB1);
                hide(labelA2);
                hide(labelD2);
            } else if (currentStep > 2) {
                show(step2Lines);
                show(labelA1);
                show(labelB1);
            }

            // Step 3
            if (currentStep === 3) {
                show(labelA2);
                show(labelD2);
                hide(options);
            } else if (currentStep > 3) {
                show(labelA2);
                show(labelD2);
            }

            // Step 4
            if (currentStep === 4) {
                show(options);
            } else if (currentStep < 4) {
                hide(options);
            }
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateState();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateState();
            }
        });

        // Initialize
        updateState();
    })();
    </script>
</body>
</html>
