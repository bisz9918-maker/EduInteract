<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: none; border-radius: 4px; background: #f0f0f0; color: #333; transition: background 0.3s, color 0.3s; }
        button.active { background: #1565c0; color: #ffffff; }
        .fade { transition: opacity 0.4s ease; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" id="scene2-svg">
            <defs>
                <marker id="scene2-arrow-down" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#888888" />
                </marker>
                <marker id="scene2-arrow-up" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#888888" />
                </marker>
                <marker id="scene2-arrow-energy" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828" />
                </marker>
            </defs>

            <!-- 全局元素 -->
            <text x="80" y="80" fill="#333333" font-size="16" text-anchor="middle">细胞外</text>
            <text x="80" y="420" fill="#333333" font-size="16" text-anchor="middle">细胞内</text>

            <!-- 状态1：被动运输 -->
            <g id="scene2-group-passive" class="fade">
                <!-- 浓度梯度 -->
                <line x1="150" y1="120" x2="150" y2="360" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#scene2-arrow-down)" />
                <text x="150" y="100" fill="#333333" font-size="16" text-anchor="middle">高浓度</text>
                <text x="150" y="380" fill="#333333" font-size="16" text-anchor="middle">低浓度</text>

                <!-- 磷脂双分子层 -->
                <rect x="200" y="210" width="550" height="60" fill="rgba(0,0,0,0.15)" stroke="#000000" stroke-width="2" />

                <!-- 自由扩散 -->
                <text x="350" y="120" fill="#333333" font-size="16" text-anchor="middle">自由扩散</text>
                <!-- 自由扩散分子 (外多内少) -->
                <circle cx="340" cy="140" r="6" fill="#2e7d32" />
                <circle cx="360" cy="150" r="6" fill="#2e7d32" />
                <circle cx="330" cy="160" r="6" fill="#2e7d32" />
                <circle cx="370" cy="170" r="6" fill="#2e7d32" />
                <circle cx="350" cy="180" r="6" fill="#2e7d32" />
                <circle cx="340" cy="190" r="6" fill="#2e7d32" />
                
                <circle cx="350" cy="240" r="6" fill="#2e7d32" /> <!-- 膜内 -->
                
                <circle cx="340" cy="300" r="6" fill="#2e7d32" />
                <circle cx="360" cy="320" r="6" fill="#2e7d32" />

                <!-- 协助扩散 -->
                <text x="550" y="120" fill="#333333" font-size="16" text-anchor="middle">协助扩散</text>
                <!-- 通道蛋白 -->
                <rect x="530" y="210" width="15" height="60" fill="#1565c0" rx="5" />
                <rect x="555" y="210" width="15" height="60" fill="#1565c0" rx="5" />
                <text x="580" y="295" fill="#333333" font-size="16" text-anchor="start">通道蛋白</text>
                
                <!-- 协助扩散分子 (外多内少) -->
                <circle cx="540" cy="140" r="6" fill="#2e7d32" />
                <circle cx="560" cy="150" r="6" fill="#2e7d32" />
                <circle cx="530" cy="160" r="6" fill="#2e7d32" />
                <circle cx="570" cy="170" r="6" fill="#2e7d32" />
                <circle cx="550" cy="180" r="6" fill="#2e7d32" />
                <circle cx="540" cy="190" r="6" fill="#2e7d32" />
                
                <circle cx="550" cy="240" r="6" fill="#2e7d32" /> <!-- 通道内 -->
                
                <circle cx="540" cy="300" r="6" fill="#2e7d32" />
                <circle cx="560" cy="320" r="6" fill="#2e7d32" />
            </g>

            <!-- 状态2：主动运输 -->
            <g id="scene2-group-active" class="fade" style="opacity: 0; display: none;">
                <!-- 浓度梯度 -->
                <line x1="150" y1="360" x2="150" y2="120" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#scene2-arrow-up)" />
                <text x="150" y="100" fill="#333333" font-size="16" text-anchor="middle">低浓度</text>
                <text x="150" y="380" fill="#333333" font-size="16" text-anchor="middle">高浓度</text>

                <!-- 磷脂双分子层 -->
                <rect x="200" y="210" width="550" height="60" fill="rgba(0,0,0,0.15)" stroke="#000000" stroke-width="2" />

                <!-- 主动运输 -->
                <text x="450" y="120" fill="#333333" font-size="16" text-anchor="middle">主动运输</text>
                <!-- 载体蛋白 -->
                <path d="M 430 210 L 470 210 L 470 230 L 455 240 L 470 250 L 470 270 L 430 270 L 430 250 L 445 240 L 430 230 Z" fill="#1565c0" />
                <text x="480" y="295" fill="#333333" font-size="16" text-anchor="start">载体蛋白</text>
                
                <!-- 主动运输分子 (外少内多) -->
                <circle cx="440" cy="150" r="6" fill="#c62828" />
                <circle cx="460" cy="170" r="6" fill="#c62828" />
                
                <circle cx="450" cy="240" r="6" fill="#c62828" /> <!-- 载体内 -->
                
                <circle cx="440" cy="300" r="6" fill="#c62828" />
                <circle cx="460" cy="310" r="6" fill="#c62828" />
                <circle cx="430" cy="320" r="6" fill="#c62828" />
                <circle cx="470" cy="330" r="6" fill="#c62828" />
                <circle cx="450" cy="340" r="6" fill="#c62828" />
                <circle cx="440" cy="350" r="6" fill="#c62828" />

                <!-- ATP -->
                <text x="580" y="300" fill="#c62828" font-size="14" font-weight="bold" text-anchor="middle">ATP</text>
                <text x="580" y="350" fill="#333333" font-size="14" text-anchor="middle">ADP+Pi</text>
                <path d="M 580 315 Q 600 325 580 335" fill="none" stroke="#c62828" stroke-width="2" marker-end="url(#scene2-arrow-energy)" />
            </g>

            <!-- 状态3：胞吞 -->
            <g id="scene2-group-endocytosis" class="fade" style="opacity: 0; display: none;">
                <!-- 胞吞 -->
                <text x="450" y="100" fill="#333333" font-size="16" text-anchor="middle">胞吞</text>
                
                <!-- 凹陷的磷脂双分子层 -->
                <path d="M 200 210 L 380 210 C 410 210, 410 270, 450 270 C 490 270, 490 210, 520 210 L 750 210 L 750 270 L 520 270 C 490 270, 490 330, 450 330 C 410 330, 410 270, 380 270 L 200 270 Z" fill="rgba(0,0,0,0.15)" stroke="#000000" stroke-width="2" />
                
                <!-- 囊泡 -->
                <path d="M 450 350 A 30 30 0 1 0 450 410 A 30 30 0 1 0 450 350 Z M 450 360 A 20 20 0 1 1 450 400 A 20 20 0 1 1 450 360 Z" fill="rgba(0,0,0,0.15)" stroke="#000000" stroke-width="2" />
                <text x="490" y="385" fill="#333333" font-size="16" text-anchor="start">囊泡</text>

                <!-- 大分子物质 -->
                <polygon points="450,165 465,180 450,195 435,180" fill="#e65100" />
                <polygon points="450,365 465,380 450,395 435,380" fill="#e65100" />
                <text x="520" y="180" fill="#333333" font-size="16" text-anchor="start">大分子物质</text>

                <!-- ATP -->
                <!-- 移到右侧避免与囊泡重叠 -->
                <text x="620" y="300" fill="#c62828" font-size="14" font-weight="bold" text-anchor="middle">ATP</text>
                <text x="620" y="350" fill="#333333" font-size="14" text-anchor="middle">ADP+Pi</text>
                <!-- 调整能量箭头位置，避免与囊泡路径重叠 -->
                <path d="M 620 315 Q 640 325 620 335" fill="none" stroke="#c62828" stroke-width="2" marker-end="url(#scene2-arrow-energy)" />
            </g>
        </svg>

        <div id="scene2-controls">
            <button id="scene2-btn-passive" class="active">被动运输</button>
            <button id="scene2-btn-active">主动运输</button>
            <button id="scene2-btn-endocytosis">胞吞</button>
        </div>
    </div>
    <script>
    (function() {
        const btnPassive = document.getElementById('scene2-btn-passive');
        const btnActive = document.getElementById('scene2-btn-active');
        const btnEndocytosis = document.getElementById('scene2-btn-endocytosis');
        
        const groupPassive = document.getElementById('scene2-group-passive');
        const groupActive = document.getElementById('scene2-group-active');
        const groupEndocytosis = document.getElementById('scene2-group-endocytosis');

        function showGroup(groupToShow, btnToActivate) {
            // Hide all
            [groupPassive, groupActive, groupEndocytosis].forEach(g => {
                g.style.opacity = '0';
                setTimeout(() => {
                    if (g !== groupToShow) g.style.display = 'none';
                }, 400); // match transition time
            });
            
            // Deactivate all buttons
            [btnPassive, btnActive, btnEndocytosis].forEach(b => b.classList.remove('active'));
            
            // Show target
            setTimeout(() => {
                groupToShow.style.display = 'block';
                // trigger reflow
                void groupToShow.offsetWidth;
                groupToShow.style.opacity = '1';
            }, 400);
            
            // Activate target button
            btnToActivate.classList.add('active');
        }

        btnPassive.addEventListener('click', () => showGroup(groupPassive, btnPassive));
        btnActive.addEventListener('click', () => showGroup(groupActive, btnActive));
        btnEndocytosis.addEventListener('click', () => showGroup(groupEndocytosis, btnEndocytosis));
    })();
    </script>
</body>
</html>
