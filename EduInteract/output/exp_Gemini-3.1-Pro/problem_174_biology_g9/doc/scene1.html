<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; z-index: 10; }
        #scene1-prompt { font-size: 16px; color: #333; height: 24px; text-align: center; }
        #scene1-buttons { display: flex; gap: 12px; }
        button { padding: 6px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* SVG Styles */
        .neuron { stroke: #000; stroke-width: 2; fill: transparent; transition: fill 0.5s, fill-opacity 0.5s; }
        .wire { stroke: #000; stroke-width: 1.5; fill: none; }
        .galvanometer { stroke: #000; stroke-width: 1.5; fill: #fff; }
        .label { font-size: 18px; fill: #000; font-family: serif; }
        .vesicle { fill: #000; transition: fill 0.5s, r 0.5s; }
        .synapse-box { stroke: #888; stroke-width: 2; stroke-dasharray: 5,5; fill: none; }
        .synapse-label { font-size: 16px; fill: #555; }
        .fade-elem { transition: opacity 0.3s; }
        
        #scene1-zoom-group { transition: transform 0.8s ease; transform-origin: 400px 300px; }
        .zoomed { transform: scale(1.3); }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <g id="scene1-zoom-group">
                <!-- Neurons -->
                <path id="scene1-neuron-b" class="neuron" d="M 150 210 L 330 210 C 350 170, 390 160, 420 180 C 450 200, 450 260, 420 280 C 390 300, 350 290, 330 250 L 150 250 Z" />
                <path id="scene1-neuron-c" class="neuron" d="M 460 150 C 430 190, 430 270, 460 310 C 480 320, 500 280, 550 260 L 700 260 L 700 220 L 550 220 C 500 200, 480 140, 460 150 Z" />
                <path id="scene1-neuron-a" class="neuron" d="M 150 380 L 280 310 C 290 280, 320 270, 340 280 C 360 290, 360 320, 340 330 C 320 340, 290 350, 270 350 L 150 420 Z" />
                
                <!-- Neuron Labels -->
                <text x="250" y="435" class="label">A</text>
                <text x="290" y="150" class="label">B</text>
                <text x="550" y="350" class="label">C</text>
                
                <!-- Vesicles B -->
                <circle cx="410" cy="210" r="3" class="vesicle scene1-vesicle-b" />
                <circle cx="425" cy="230" r="3" class="vesicle scene1-vesicle-b" />
                <circle cx="415" cy="250" r="3" class="vesicle scene1-vesicle-b" />
                <circle cx="395" cy="220" r="3" class="vesicle scene1-vesicle-b" />
                <circle cx="400" cy="240" r="3" class="vesicle scene1-vesicle-b" />
                <circle cx="390" cy="260" r="3" class="vesicle scene1-vesicle-b" />
                <circle cx="405" cy="270" r="3" class="vesicle scene1-vesicle-b" />
                
                <!-- Vesicles A -->
                <circle cx="330" cy="295" r="3" class="vesicle scene1-vesicle-a" />
                <circle cx="345" cy="310" r="3" class="vesicle scene1-vesicle-a" />
                <circle cx="325" cy="320" r="3" class="vesicle scene1-vesicle-a" />
                
                <!-- Synapse Boxes and Labels (Step 2) -->
                <g id="scene1-synapse-group" class="fade-elem" style="opacity: 0; display: none;">
                    <rect id="scene1-synapse1-box" class="synapse-box" x="310" y="260" width="70" height="80" />
                    <text id="scene1-synapse1-label" class="synapse-label" x="80" y="300">突触1</text>
                    <line id="scene1-synapse1-line" class="synapse-box" x1="130" y1="295" x2="310" y2="300" />
                    
                    <rect id="scene1-synapse2-box" class="synapse-box" x="410" y="160" width="70" height="140" />
                    <text id="scene1-synapse2-label" class="synapse-label" x="550" y="60">突触2</text>
                    <line id="scene1-synapse2-line" class="synapse-box" x1="550" y1="65" x2="470" y2="160" />
                </g>
                
                <!-- Vesicle Label (Step 3) -->
                <g id="scene1-vesicle-group" class="fade-elem" style="opacity: 0; display: none;">
                    <text id="scene1-vesicle-label" class="synapse-label" x="400" y="120">突触小泡</text>
                    <line id="scene1-vesicle-line" class="synapse-box" x1="400" y1="125" x2="415" y2="200" />
                </g>
            </g>
            
            <!-- Galvanometer and Wires -->
            <g id="scene1-circuit" class="fade-elem">
                <line class="wire" x1="200" y1="210" x2="200" y2="80" />
                <line class="wire" x1="200" y1="80" x2="400" y2="80" />
                
                <line class="wire" x1="650" y1="220" x2="650" y2="80" />
                <line class="wire" x1="650" y1="80" x2="450" y2="80" />
                
                <circle class="galvanometer" cx="425" cy="80" r="25" />
                <line class="wire" x1="425" y1="95" x2="425" y2="65" />
                <polygon points="425,65 420,75 430,75" fill="#000" />
                
                <text x="170" y="150" class="label">a</text>
                <text x="670" y="130" class="label">d</text>
                
                <text x="350" y="110" class="label">b</text>
                <line class="wire" x1="355" y1="115" x2="365" y2="165" />
                <polygon points="365,165 360,155 370,155" fill="#000" transform="rotate(-18 365 165)" />
                
                <text x="550" y="110" class="label">c</text>
                <line class="wire" x1="545" y1="115" x2="500" y2="165" />
                <polygon points="500,165 495,155 505,155" fill="#000" transform="rotate(26 500 165)" />
            </g>
        </svg>
        
        <div id="scene1-controls">
            <div id="scene1-prompt">观察突触结构图，判断各选项的正误。</div>
            <div id="scene1-buttons">
                <button id="scene1-btn-prev" disabled>◀ 上一步</button>
                <button id="scene1-btn-next">下一步 ▶</button>
            </div>
        </div>
    </div>
    
    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 3;
        
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const prompt = document.getElementById('scene1-prompt');
        
        const neuronA = document.getElementById('scene1-neuron-a');
        const neuronB = document.getElementById('scene1-neuron-b');
        const neuronC = document.getElementById('scene1-neuron-c');
        
        const synapseGroup = document.getElementById('scene1-synapse-group');
        const vesicleGroup = document.getElementById('scene1-vesicle-group');
        const circuit = document.getElementById('scene1-circuit');
        const zoomGroup = document.getElementById('scene1-zoom-group');
        const vesicles = document.querySelectorAll('.vesicle');
        
        const prompts = [
            "观察突触结构图，判断各选项的正误。",
            "图示包含3个神经元：神经元A、神经元B、神经元C。",
            "图示包含2个突触：A与B形成突触1，B与C形成突触2。因此说法①错误。",
            "放大观察：A、B末端膨大且含有突触小泡，为轴突末梢；C为细胞体或树突。因此说法⑤正确。"
        ];
        
        function show(el) {
            el.style.display = '';
            void el.offsetWidth; // force reflow
            el.style.opacity = '1';
        }
        
        function hide(el) {
            el.style.opacity = '0';
            setTimeout(() => {
                if (el.style.opacity === '0') {
                    el.style.display = 'none';
                }
            }, 300);
        }
        
        function updateView() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
            prompt.textContent = prompts[currentStep];
            
            // Step 1: Highlight neurons
            if (currentStep >= 1) {
                neuronA.style.fill = '#1565c0';
                neuronA.style.fillOpacity = '0.2';
                neuronB.style.fill = '#2e7d32';
                neuronB.style.fillOpacity = '0.2';
                neuronC.style.fill = '#c62828';
                neuronC.style.fillOpacity = '0.2';
            } else {
                neuronA.style.fill = 'transparent';
                neuronB.style.fill = 'transparent';
                neuronC.style.fill = 'transparent';
            }
            
            // Step 2: Show synapse boxes
            if (currentStep === 2) {
                show(synapseGroup);
            } else {
                hide(synapseGroup);
            }
            
            // Step 3: Zoom and highlight vesicles
            if (currentStep === 3) {
                zoomGroup.classList.add('zoomed');
                hide(circuit);
                show(vesicleGroup);
                vesicles.forEach(v => {
                    v.style.fill = '#ff9800';
                    v.setAttribute('r', '4');
                });
            } else {
                zoomGroup.classList.remove('zoomed');
                show(circuit);
                hide(vesicleGroup);
                vesicles.forEach(v => {
                    v.style.fill = '#000';
                    v.setAttribute('r', '3');
                });
            }
        }
        
        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateView();
            }
        });
        
        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateView();
            }
        });
        
        // Init
        updateView();
    })();
    </script>
</body>
</html>
