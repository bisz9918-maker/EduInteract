<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; }
        .scene3-hidden { opacity: 0; pointer-events: none; }
        .scene3-visible { opacity: 1; }
        .scene3-transition { transition: opacity 0.5s ease, fill 0.5s ease; }
        .scene3-highlight { fill: rgba(198, 40, 40, 0.3) !important; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg width="800" height="500" id="scene3-svg">
            <!-- Definitions -->
            <defs>
                <marker id="scene3-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#000" />
                </marker>
            </defs>

            <!-- Magnification Lines -->
            <g id="scene3-mag-lines" class="scene3-hidden scene3-transition">
                <line x1="270" y1="150" x2="450" y2="100" stroke="#888" stroke-width="1.5" stroke-dasharray="5,5" />
                <line x1="270" y1="240" x2="450" y2="400" stroke="#888" stroke-width="1.5" stroke-dasharray="5,5" />
            </g>

            <!-- Neurons (Macro) -->
            <!-- Neuron B: (50,160)-(270,240) -->
            <path id="scene3-neuron-b" d="M 50 180 L 180 180 C 200 150, 250 150, 270 190 C 280 220, 240 250, 200 240 C 190 230, 180 220, 180 220 L 50 220 Z" fill="#ffffff" stroke="#000000" stroke-width="2" class="scene3-transition" />
            
            <!-- Neuron C: (280,140)-(400,260) -->
            <path id="scene3-neuron-c" d="M 400 180 L 330 180 C 310 150, 280 160, 280 190 C 280 230, 310 250, 330 220 L 400 220 Z" fill="#ffffff" stroke="#000000" stroke-width="2" class="scene3-transition" />
            
            <!-- Neuron A: (50,250)-(190,335) -->
            <path id="scene3-neuron-a" d="M 50 290 L 120 260 C 140 240, 180 260, 190 290 C 190 320, 150 340, 130 320 L 50 330 Z" fill="#ffffff" stroke="#000000" stroke-width="2" class="scene3-transition" />

            <!-- Labels -->
            <text x="150" y="140" font-size="16" font-family="sans-serif">B</text>
            <text x="350" y="100" font-size="16" font-family="sans-serif">C</text>
            <text x="100" y="360" font-size="16" font-family="sans-serif">A</text>

            <!-- Stimulus Arrows -->
            <g id="scene3-stim-b" class="scene3-hidden scene3-transition">
                <line x1="100" y1="110" x2="100" y2="150" stroke="#000" stroke-width="2" marker-end="url(#scene3-arrow)" />
                <text x="105" y="125" font-size="14">刺激</text>
            </g>
            <g id="scene3-stim-a" class="scene3-hidden scene3-transition">
                <line x1="60" y1="220" x2="80" y2="250" stroke="#000" stroke-width="2" marker-end="url(#scene3-arrow)" />
                <text x="20" y="220" font-size="14">刺激</text>
            </g>

            <!-- Neurotransmitters (Macro) -->
            <g id="scene3-nt-b" class="scene3-hidden">
                <circle cx="260" cy="200" r="3" fill="#2e7d32" />
                <circle cx="265" cy="190" r="3" fill="#2e7d32" />
                <circle cx="255" cy="210" r="3" fill="#2e7d32" />
            </g>
            <g id="scene3-nt-a" class="scene3-hidden">
                <rect x="170" y="290" width="6" height="6" fill="#1565c0" />
                <rect x="175" y="280" width="6" height="6" fill="#1565c0" />
                <rect x="165" y="300" width="6" height="6" fill="#1565c0" />
            </g>

            <!-- Microscopic View -->
            <g id="scene3-micro" class="scene3-hidden scene3-transition">
                <!-- Presynaptic Membrane -->
                <path d="M 450 100 C 550 100, 650 100, 750 100 L 750 180 C 650 200, 550 200, 450 180 Z" fill="#ffffff" stroke="#000" stroke-width="2" />
                
                <!-- Postsynaptic Membrane -->
                <path d="M 450 400 C 550 400, 650 400, 750 400 L 750 320 C 650 300, 550 300, 450 320 Z" fill="#ffffff" stroke="#000" stroke-width="2" />
                
                <!-- Receptors -->
                <path d="M 510 310 L 520 330 L 530 310 M 520 330 L 520 350" stroke="#000" stroke-width="3" fill="none" />
                <path d="M 590 302 L 600 322 L 610 302 M 600 322 L 600 342" stroke="#000" stroke-width="3" fill="none" />
                <path d="M 670 310 L 680 330 L 690 310 M 680 330 L 680 350" stroke="#000" stroke-width="3" fill="none" />

                <!-- Receptor Label -->
                <text x="550" y="420" font-size="14">受体(糖蛋白)</text>
                <line x1="600" y1="405" x2="600" y2="350" stroke="#000" stroke-width="1" stroke-dasharray="2,2" />

                <!-- Micro Neurotransmitter -->
                <circle id="scene3-micro-nt" cx="600" cy="190" r="8" fill="#2e7d32" class="scene3-hidden" />
            </g>
        </svg>
        <div id="scene3-controls">
            <button id="scene3-btn-prev" disabled>◀ 上一步</button>
            <button id="scene3-btn-next">下一步 ▶</button>
        </div>
    </div>
    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 3;

        const btnPrev = document.getElementById('scene3-btn-prev');
        const btnNext = document.getElementById('scene3-btn-next');

        const neuronB = document.getElementById('scene3-neuron-b');
        const neuronC = document.getElementById('scene3-neuron-c');
        const neuronA = document.getElementById('scene3-neuron-a');
        const stimB = document.getElementById('scene3-stim-b');
        const stimA = document.getElementById('scene3-stim-a');
        const ntB = document.getElementById('scene3-nt-b');
        const ntA = document.getElementById('scene3-nt-a');
        const micro = document.getElementById('scene3-micro');
        const magLines = document.getElementById('scene3-mag-lines');
        const microNt = document.getElementById('scene3-micro-nt');

        function show(el) {
            el.classList.remove('scene3-hidden');
            el.classList.add('scene3-visible');
        }

        function hide(el) {
            el.classList.remove('scene3-visible');
            el.classList.add('scene3-hidden');
        }

        function updateStep() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;

            // Reset all
            neuronB.classList.remove('scene3-highlight');
            neuronC.classList.remove('scene3-highlight');
            neuronA.classList.remove('scene3-highlight');
            hide(stimB);
            hide(stimA);
            hide(ntB);
            hide(ntA);
            hide(micro);
            hide(magLines);
            hide(microNt);
            ntB.style.transform = 'translate(0, 0)';
            ntA.style.transform = 'translate(0, 0)';
            microNt.style.transform = 'translate(0, 0)';

            if (currentStep === 0) {
                // Initial state
            } else if (currentStep === 1) {
                show(stimB);
                neuronB.classList.add('scene3-highlight');
                show(ntB);
                
                // Animate NT B
                ntB.animate([
                    { transform: 'translate(0, 0)' },
                    { transform: 'translate(15px, 0)' }
                ], { duration: 800, fill: 'forwards' }).onfinish = () => {
                    neuronC.classList.add('scene3-highlight');
                };
            } else if (currentStep === 2) {
                show(stimB);
                show(stimA);
                neuronA.classList.add('scene3-highlight');
                show(ntA);
                
                // Animate NT A
                ntA.animate([
                    { transform: 'translate(0, 0)' },
                    { transform: 'translate(15px, -15px)' }
                ], { duration: 800, fill: 'forwards' });
                // B and C do not highlight
            } else if (currentStep === 3) {
                show(magLines);
                show(micro);
                show(microNt);
                
                // Animate Micro NT
                microNt.animate([
                    { transform: 'translate(0, 0)' },
                    { transform: 'translate(0, 105px)' }
                ], { duration: 1000, fill: 'forwards' });
            }
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateStep();
            }
        });

        updateStep();
    })();
    </script>
</body>
</html>
