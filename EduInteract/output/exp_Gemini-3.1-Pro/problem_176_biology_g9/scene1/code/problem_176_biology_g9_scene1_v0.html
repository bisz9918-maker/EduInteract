<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .vessel {
            fill: rgba(0,0,0,0.05);
            stroke: #000000;
            stroke-width: 2;
            transition: d 0.8s ease, fill 0.8s ease;
        }
        
        .fade-text {
            opacity: 0;
            transition: opacity 0.8s ease;
            font-size: 18px;
            text-anchor: middle;
        }
        
        .label-text {
            font-size: 20px;
            text-anchor: middle;
            dominant-baseline: middle;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500">
            <!-- 丝带 -->
            <line x1="200" y1="230" x2="600" y2="230" stroke="#000000" stroke-width="4" />
            <text x="630" y="235" class="label-text" text-anchor="start">丝带</text>
            
            <!-- 左侧血管 -->
            <path id="scene1-left-vessel" class="vessel" d="M 290 100 L 290 220 L 290 230 L 290 240 L 290 360 L 310 360 L 310 240 L 310 230 L 310 220 L 310 100 Z" />
            <!-- 右侧血管 -->
            <path id="scene1-right-vessel" class="vessel" d="M 490 100 L 490 220 L 490 230 L 490 240 L 490 360 L 510 360 L 510 240 L 510 230 L 510 220 L 510 100 Z" />
            
            <!-- 左血管箭头 -->
            <line x1="300" y1="100" x2="300" y2="60" stroke="#000000" stroke-width="2" />
            <polygon points="300,50 295,65 305,65" fill="#000000" />
            
            <!-- 右血管箭头 -->
            <line x1="500" y1="360" x2="500" y2="400" stroke="#000000" stroke-width="2" />
            <polygon points="500,410 495,395 505,395" fill="#000000" />
            
            <!-- 标签 -->
            <text x="240" y="295" class="label-text">①</text>
            <text x="240" y="165" class="label-text">④</text>
            <text x="560" y="295" class="label-text">②</text>
            <text x="560" y="165" class="label-text">③</text>
            
            <!-- 动态标签 -->
            <text id="scene1-label-vein" x="300" y="45" class="fade-text">静脉</text>
            <text id="scene1-label-artery" x="500" y="45" class="fade-text">动脉</text>
            <text id="scene1-label-low-o2" x="300" y="390" class="fade-text" fill="#1565c0">含氧量低</text>
            <text id="scene1-label-high-o2" x="500" y="440" class="fade-text" fill="#c62828">含氧量高</text>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 3;
        
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        
        const leftVessel = document.getElementById('scene1-left-vessel');
        const rightVessel = document.getElementById('scene1-right-vessel');
        
        const labelVein = document.getElementById('scene1-label-vein');
        const labelArtery = document.getElementById('scene1-label-artery');
        const labelLowO2 = document.getElementById('scene1-label-low-o2');
        const labelHighO2 = document.getElementById('scene1-label-high-o2');
        
        const pathLeftNormal = "M 290 100 L 290 220 L 290 230 L 290 240 L 290 360 L 310 360 L 310 240 L 310 230 L 310 220 L 310 100 Z";
        const pathLeftTied = "M 295 100 L 295 220 L 298 230 L 280 240 L 280 360 L 320 360 L 320 240 L 302 230 L 305 220 L 305 100 Z";
        
        const pathRightNormal = "M 490 100 L 490 220 L 490 230 L 490 240 L 490 360 L 510 360 L 510 240 L 510 230 L 510 220 L 510 100 Z";
        const pathRightTied = "M 480 100 L 480 220 L 498 230 L 495 240 L 495 360 L 505 360 L 505 240 L 502 230 L 520 220 L 520 100 Z";
        
        function updateState() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
            
            // Step 1: 左侧静脉形变
            if (currentStep >= 1) {
                leftVessel.setAttribute('d', pathLeftTied);
                labelVein.style.opacity = 1;
            } else {
                leftVessel.setAttribute('d', pathLeftNormal);
                labelVein.style.opacity = 0;
            }
            
            // Step 2: 右侧动脉形变
            if (currentStep >= 2) {
                rightVessel.setAttribute('d', pathRightTied);
                labelArtery.style.opacity = 1;
            } else {
                rightVessel.setAttribute('d', pathRightNormal);
                labelArtery.style.opacity = 0;
            }
            
            // Step 3: 含氧量
            if (currentStep >= 3) {
                leftVessel.style.fill = '#1565c0';
                rightVessel.style.fill = '#c62828';
                labelLowO2.style.opacity = 1;
                labelHighO2.style.opacity = 1;
            } else {
                leftVessel.style.fill = 'rgba(0,0,0,0.05)';
                rightVessel.style.fill = 'rgba(0,0,0,0.05)';
                labelLowO2.style.opacity = 0;
                labelHighO2.style.opacity = 0;
            }
        }
        
        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateState();
            }
        });
        
        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateState();
            }
        });
        
        // Init
        updateState();
    })();
    </script>
</body>
</html>
