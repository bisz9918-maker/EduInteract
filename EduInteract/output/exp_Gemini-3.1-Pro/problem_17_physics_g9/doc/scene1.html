<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .wire { fill: none; stroke: #000000; stroke-width: 2px; transition: stroke 0.3s, stroke-width 0.3s; }
        .wire.main-active { stroke: #c62828; stroke-width: 4px; }
        .wire.l2-active { stroke: #2e7d32; stroke-width: 4px; }
        .wire.l1-active { stroke: #1565c0; stroke-width: 4px; }
        
        .component { fill: none; stroke: #000000; stroke-width: 2px; }
        .component-fill { fill: #ffffff; stroke: #000000; stroke-width: 2px; }
        .label { font-size: 14px; fill: #000000; text-anchor: middle; dominant-baseline: middle; }
        
        .node-glow { fill: none; stroke-width: 4px; opacity: 0; transition: opacity 0.3s; }
        .node-glow.active { opacity: 1; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { r: 8px; opacity: 0.8; } 50% { r: 12px; opacity: 0.4; } 100% { r: 8px; opacity: 0.8; } }
        
        .arrow { display: none; }
        .arrow.active { display: block; }
        
        .schematic { opacity: 0; transition: opacity 0.5s; }
        .schematic.active { opacity: 1; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <!-- Definitions for arrows -->
            <defs>
                <marker id="arrow-main" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828" />
                </marker>
                <marker id="arrow-l2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32" />
                </marker>
                <marker id="arrow-l1" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0" />
                </marker>
            </defs>

            <!-- Physical Wires -->
            <path id="scene1-wire-main1" class="wire" d="M 280,60 C 350,60 400,90 400,140" />
            <path id="scene1-wire-l2-out" class="wire" d="M 360,140 C 420,180 450,250 410,315" />
            <path id="scene1-wire-l1-out" class="wire" d="M 360,140 C 320,180 270,250 270,315" />
            <path id="scene1-wire-l2-in" class="wire" d="M 350,315 C 350,380 75,380 75,250" />
            <path id="scene1-wire-l1-in" class="wire" d="M 210,315 C 210,350 100,320 100,250" />
            <path id="scene1-wire-main2" class="wire" d="M 75,250 C 20,250 50,60 200,60" />

            <!-- Physical Components -->
            <!-- Battery -->
            <rect x="190" y="40" width="100" height="40" class="component-fill" />
            <line x1="240" y1="40" x2="240" y2="80" class="component" />
            <text x="240" y="25" class="label">电源</text>
            <circle cx="280" cy="60" r="3" fill="#000" />
            <circle cx="200" cy="60" r="3" fill="#000" />
            <text x="280" y="90" class="label" style="font-size:12px">+</text>
            <text x="200" y="90" class="label" style="font-size:12px">-</text>

            <!-- Switch S -->
            <rect x="350" y="130" width="60" height="20" class="component-fill" />
            <line x1="360" y1="140" x2="395" y2="125" class="component" />
            <text x="380" y="110" class="label">S</text>
            <circle cx="400" cy="140" r="3" fill="#000" />
            <circle cx="360" cy="140" r="3" fill="#000" />

            <!-- Lamp L1 -->
            <rect x="220" y="295" width="40" height="20" class="component-fill" />
            <circle cx="240" cy="285" r="15" class="component-fill" />
            <path d="M 230,285 Q 240,275 250,285" class="component" />
            <text x="240" y="255" class="label">L1</text>
            <circle cx="210" cy="315" r="3" fill="#000" />
            <circle cx="270" cy="315" r="3" fill="#000" />
            <line x1="210" y1="315" x2="220" y2="305" class="component" />
            <line x1="270" y1="315" x2="260" y2="305" class="component" />

            <!-- Lamp L2 -->
            <rect x="360" y="295" width="40" height="20" class="component-fill" />
            <circle cx="380" cy="285" r="15" class="component-fill" />
            <path d="M 370,285 Q 380,275 390,285" class="component" />
            <text x="380" y="255" class="label">L2</text>
            <circle cx="350" cy="315" r="3" fill="#000" />
            <circle cx="410" cy="315" r="3" fill="#000" />
            <line x1="350" y1="315" x2="360" y2="305" class="component" />
            <line x1="410" y1="315" x2="400" y2="305" class="component" />

            <!-- Ammeter A -->
            <rect x="65" y="180" width="70" height="80" class="component-fill" />
            <path d="M 75,220 A 25 25 0 0 1 125 220" class="component" />
            <line x1="100" y1="220" x2="90" y2="195" class="component" />
            <text x="100" y="165" class="label">A</text>
            <circle cx="75" cy="250" r="3" fill="#000" />
            <circle cx="100" cy="250" r="3" fill="#000" />
            <circle cx="125" cy="250" r="3" fill="#000" />
            <text x="75" y="275" class="label" style="font-size:12px">-</text>
            <text x="100" y="275" class="label" style="font-size:12px">0.6</text>
            <text x="125" y="275" class="label" style="font-size:12px">3</text>

            <!-- Nodes -->
            <circle id="scene1-node-split" cx="360" cy="140" r="8" class="node-glow" stroke="#c62828" />
            <text id="scene1-label-split" x="320" y="140" class="label" style="opacity:0; transition: opacity 0.3s; fill: #c62828;">分流点</text>
            
            <circle id="scene1-node-merge" cx="75" cy="250" r="8" class="node-glow" stroke="#2e7d32" />
            <text id="scene1-label-merge" x="40" y="250" class="label" style="opacity:0; transition: opacity 0.3s; fill: #2e7d32;">汇流点</text>

            <!-- Schematic Circuit -->
            <g id="scene1-schematic" class="schematic">
                <!-- Schematic Wires -->
                <polyline id="scene1-sch-main-right" points="655,80 740,80 740,240" class="wire" />
                <polyline id="scene1-sch-main-left" points="540,240 540,80 625,80" class="wire" />
                <line id="scene1-sch-l1" x1="740" y1="240" x2="540" y2="240" class="wire" />
                <polyline id="scene1-sch-l2" points="740,240 740,340 540,340 540,240" class="wire" />

                <!-- Schematic Components -->
                <!-- Battery -->
                <line x1="625" y1="80" x2="655" y2="80" class="component" />
                <line x1="635" y1="70" x2="635" y2="90" class="component" />
                <line x1="645" y1="60" x2="645" y2="100" class="component" />
                <text x="640" y="45" class="label">电源</text>

                <!-- Switch S -->
                <circle cx="740" cy="140" r="3" fill="#000" />
                <circle cx="740" cy="180" r="3" fill="#000" />
                <line x1="740" y1="140" x2="755" y2="175" class="component" />
                <text x="765" y="160" class="label">S</text>

                <!-- Lamp L1 -->
                <circle cx="680" cy="240" r="15" class="component-fill" />
                <line x1="670" y1="230" x2="690" y2="250" class="component" />
                <line x1="670" y1="250" x2="690" y2="230" class="component" />
                <text x="680" y="210" class="label">L1</text>

                <!-- Ammeter A -->
                <circle cx="600" cy="240" r="15" class="component-fill" />
                <text x="600" y="210" class="label">A</text>

                <!-- Lamp L2 -->
                <circle cx="640" cy="340" r="15" class="component-fill" />
                <line x1="630" y1="330" x2="650" y2="350" class="component" />
                <line x1="630" y1="350" x2="650" y2="330" class="component" />
                <text x="640" y="310" class="label">L2</text>

                <!-- Nodes -->
                <circle cx="740" cy="240" r="4" fill="#000" />
                <text x="775" y="240" class="label">分流点</text>
                <circle cx="540" cy="240" r="4" fill="#000" />
                <text x="500" y="240" class="label">汇流点</text>
            </g>

            <!-- Arrows -->
            <g id="scene1-arrows">
                <!-- Main out arrow -->
                <polygon points="-5,-5 5,0 -5,5" fill="#c62828" id="scene1-arrow-main1" class="arrow">
                    <animateMotion dur="2s" repeatCount="indefinite" rotate="auto">
                        <mpath href="#scene1-wire-main1" />
                    </animateMotion>
                </polygon>
                <!-- Main return arrow -->
                <polygon points="-5,-5 5,0 -5,5" fill="#c62828" id="scene1-arrow-main2" class="arrow">
                    <animateMotion dur="2s" repeatCount="indefinite" rotate="auto">
                        <mpath href="#scene1-wire-main2" />
                    </animateMotion>
                </polygon>
                <!-- L2 out arrow -->
                <polygon points="-5,-5 5,0 -5,5" fill="#2e7d32" id="scene1-arrow-l2-out" class="arrow">
                    <animateMotion dur="2s" repeatCount="indefinite" rotate="auto">
                        <mpath href="#scene1-wire-l2-out" />
                    </animateMotion>
                </polygon>
                <!-- L2 return arrow -->
                <polygon points="-5,-5 5,0 -5,5" fill="#2e7d32" id="scene1-arrow-l2-in" class="arrow">
                    <animateMotion dur="2s" repeatCount="indefinite" rotate="auto">
                        <mpath href="#scene1-wire-l2-in" />
                    </animateMotion>
                </polygon>
                <!-- L1 out arrow -->
                <polygon points="-5,-5 5,0 -5,5" fill="#1565c0" id="scene1-arrow-l1-out" class="arrow">
                    <animateMotion dur="2s" repeatCount="indefinite" rotate="auto">
                        <mpath href="#scene1-wire-l1-out" />
                    </animateMotion>
                </polygon>
                <!-- L1 return arrow -->
                <polygon points="-5,-5 5,0 -5,5" fill="#1565c0" id="scene1-arrow-l1-in" class="arrow">
                    <animateMotion dur="2s" repeatCount="indefinite" rotate="auto">
                        <mpath href="#scene1-wire-l1-in" />
                    </animateMotion>
                </polygon>

                <!-- Schematic arrows -->
                <polygon points="-5,-5 5,0 -5,5" fill="#c62828" id="scene1-sch-arrow-main-right" class="arrow">
                    <animateMotion dur="2s" repeatCount="indefinite" rotate="auto">
                        <mpath href="#scene1-sch-main-right" />
                    </animateMotion>
                </polygon>
                <polygon points="-5,-5 5,0 -5,5" fill="#c62828" id="scene1-sch-arrow-main-left" class="arrow">
                    <animateMotion dur="2s" repeatCount="indefinite" rotate="auto">
                        <mpath href="#scene1-sch-main-left" />
                    </animateMotion>
                </polygon>
                <polygon points="-5,-5 5,0 -5,5" fill="#1565c0" id="scene1-sch-arrow-l1" class="arrow">
                    <animateMotion dur="2s" repeatCount="indefinite" rotate="auto">
                        <mpath href="#scene1-sch-l1" />
                    </animateMotion>
                </polygon>
                <polygon points="-5,-5 5,0 -5,5" fill="#2e7d32" id="scene1-sch-arrow-l2" class="arrow">
                    <animateMotion dur="2s" repeatCount="indefinite" rotate="auto">
                        <mpath href="#scene1-sch-l2" />
                    </animateMotion>
                </polygon>
            </g>
        </svg>
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 5;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');

        const wires = {
            main1: document.getElementById('scene1-wire-main1'),
            main2: document.getElementById('scene1-wire-main2'),
            l2Out: document.getElementById('scene1-wire-l2-out'),
            l2In: document.getElementById('scene1-wire-l2-in'),
            l1Out: document.getElementById('scene1-wire-l1-out'),
            l1In: document.getElementById('scene1-wire-l1-in'),
            schMainR: document.getElementById('scene1-sch-main-right'),
            schMainL: document.getElementById('scene1-sch-main-left'),
            schL1: document.getElementById('scene1-sch-l1'),
            schL2: document.getElementById('scene1-sch-l2')
        };

        const arrows = {
            main1: document.getElementById('scene1-arrow-main1'),
            main2: document.getElementById('scene1-arrow-main2'),
            l2Out: document.getElementById('scene1-arrow-l2-out'),
            l2In: document.getElementById('scene1-arrow-l2-in'),
            l1Out: document.getElementById('scene1-arrow-l1-out'),
            l1In: document.getElementById('scene1-arrow-l1-in'),
            schMainR: document.getElementById('scene1-sch-arrow-main-right'),
            schMainL: document.getElementById('scene1-sch-arrow-main-left'),
            schL1: document.getElementById('scene1-sch-arrow-l1'),
            schL2: document.getElementById('scene1-sch-arrow-l2')
        };

        const nodes = {
            split: document.getElementById('scene1-node-split'),
            merge: document.getElementById('scene1-node-merge')
        };

        const labels = {
            split: document.getElementById('scene1-label-split'),
            merge: document.getElementById('scene1-label-merge')
        };

        const schematic = document.getElementById('scene1-schematic');

        function updateScene() {
            // Reset all
            Object.values(wires).forEach(w => {
                w.classList.remove('main-active', 'l2-active', 'l1-active');
            });
            Object.values(arrows).forEach(a => {
                a.classList.remove('active');
            });
            Object.values(nodes).forEach(n => {
                n.classList.remove('active');
            });
            Object.values(labels).forEach(l => {
                l.style.opacity = '0';
            });
            schematic.classList.remove('active');

            // Apply states based on step
            if (currentStep >= 1) {
                wires.main1.classList.add('main-active');
                wires.main2.classList.add('main-active');
                arrows.main1.classList.add('active');
                arrows.main2.classList.add('active');
            }
            if (currentStep >= 2) {
                nodes.split.classList.add('active');
                labels.split.style.opacity = '1';
            }
            if (currentStep >= 3) {
                wires.l2Out.classList.add('l2-active');
                wires.l2In.classList.add('l2-active');
                arrows.l2Out.classList.add('active');
                arrows.l2In.classList.add('active');
                nodes.merge.classList.add('active');
                labels.merge.style.opacity = '1';
            }
            if (currentStep >= 4) {
                wires.l1Out.classList.add('l1-active');
                wires.l1In.classList.add('l1-active');
                arrows.l1Out.classList.add('active');
                arrows.l1In.classList.add('active');
            }
            if (currentStep >= 5) {
                schematic.classList.add('active');
                wires.schMainR.classList.add('main-active');
                wires.schMainL.classList.add('main-active');
                wires.schL2.classList.add('l2-active');
                wires.schL1.classList.add('l1-active');
                
                arrows.schMainR.classList.add('active');
                arrows.schMainL.classList.add('active');
                arrows.schL2.classList.add('active');
                arrows.schL1.classList.add('active');
            }

            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });

        // Initialize
        updateScene();
    })();
    </script>
</body>
</html>
