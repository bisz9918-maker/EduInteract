<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { cursor: not-allowed; opacity: 0.5; }
        .earth-group { transition: all 0.3s ease; }
        .earth-circle { fill: rgba(21, 101, 192, 0.2); stroke: #1565c0; stroke-width: 2; transition: all 0.3s ease; }
        .earth-axis { stroke: #888888; stroke-width: 2; stroke-dasharray: 4,4; }
        .earth-equator { stroke: #1565c0; stroke-width: 2; }
        .sun-circle { fill: #c62828; }
        .sun-ray { stroke: #c62828; stroke-width: 2; }
        .orbit { fill: none; stroke: #000000; stroke-width: 1.5; }
        .orbit-arrow { fill: none; stroke: #000000; stroke-width: 1.5; }
        .label { font-size: 16px; fill: #000000; text-anchor: middle; dominant-baseline: middle; }
        .dynamic-label { font-size: 16px; fill: #2e7d32; text-anchor: middle; dominant-baseline: middle; opacity: 0; transition: opacity 0.3s ease; }
        .sun-light { stroke: #c62828; stroke-width: 2; opacity: 0; transition: opacity 0.3s ease; }
        .sun-light-arrow { fill: #c62828; opacity: 0; transition: opacity 0.3s ease; }
        
        /* Highlight styles */
        .earth-highlight .earth-circle { fill: rgba(46, 125, 50, 0.2); stroke: #2e7d32; stroke-width: 3; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <!-- Orbit will be generated by JS to avoid bounding box overlap issues -->
            
            <!-- Orbit Arrows (Counter-clockwise) -->
            <path class="orbit-arrow" d="M 598 145 L 590 135 L 602 130" />
            <path class="orbit-arrow" d="M 202 145 L 198 130 L 210 135" />
            <path class="orbit-arrow" d="M 202 315 L 210 325 L 198 330" />
            <path class="orbit-arrow" d="M 598 315 L 602 330 L 590 325" />

            <!-- Sun -->
            <g id="scene1-sun">
                <circle class="sun-circle" cx="520" cy="230" r="20" />
                <line class="sun-ray" x1="520" y1="200" x2="520" y2="190" />
                <line class="sun-ray" x1="520" y1="260" x2="520" y2="270" />
                <line class="sun-ray" x1="490" y1="230" x2="480" y2="230" />
                <line class="sun-ray" x1="550" y1="230" x2="560" y2="230" />
                <line class="sun-ray" x1="498" y1="208" x2="491" y2="201" />
                <line class="sun-ray" x1="542" y1="252" x2="549" y2="259" />
                <line class="sun-ray" x1="498" y1="252" x2="491" y2="259" />
                <line class="sun-ray" x1="542" y1="208" x2="549" y2="201" />
                <text class="label" x="520" y="285">太阳</text>
            </g>

            <!-- Earth A -->
            <g id="scene1-earth-a" class="earth-group">
                <circle class="earth-circle" cx="400" cy="110" r="25" />
                <line class="earth-axis" x1="386" y1="142" x2="414" y2="78" />
                <line class="earth-equator" x1="377" y1="100" x2="423" y2="120" />
                <text class="label" x="400" y="65">A</text>
            </g>

            <!-- Earth B -->
            <g id="scene1-earth-b" class="earth-group">
                <circle class="earth-circle" cx="120" cy="230" r="25" />
                <line class="earth-axis" x1="106" y1="262" x2="134" y2="198" />
                <line class="earth-equator" x1="97" y1="220" x2="143" y2="240" />
                <text class="label" x="70" y="230">B</text>
            </g>

            <!-- Earth C -->
            <g id="scene1-earth-c" class="earth-group">
                <circle class="earth-circle" cx="400" cy="350" r="25" />
                <line class="earth-axis" x1="386" y1="382" x2="414" y2="318" />
                <line class="earth-equator" x1="377" y1="340" x2="423" y2="360" />
                <text class="label" x="400" y="395">C</text>
            </g>

            <!-- Earth D -->
            <g id="scene1-earth-d" class="earth-group">
                <circle class="earth-circle" cx="680" cy="230" r="25" />
                <line class="earth-axis" x1="666" y1="262" x2="694" y2="198" />
                <line class="earth-equator" x1="657" y1="220" x2="703" y2="240" />
                <text class="label" x="730" y="230">D</text>
            </g>

            <!-- Dynamic Elements -->
            <g id="scene1-rays-d">
                <line class="sun-light" x1="545" y1="230" x2="650" y2="230" />
                <polygon class="sun-light-arrow" points="650,226 655,230 650,234" />
                
                <line class="sun-light" x1="545" y1="220" x2="650" y2="220" />
                <polygon class="sun-light-arrow" points="650,216 655,220 650,224" />
                
                <line class="sun-light" x1="545" y1="240" x2="650" y2="240" />
                <polygon class="sun-light-arrow" points="650,236 655,240 650,244" />
            </g>

            <g id="scene1-rays-b">
                <line class="sun-light" x1="495" y1="230" x2="150" y2="230" />
                <polygon class="sun-light-arrow" points="150,226 145,230 150,234" />
                
                <line class="sun-light" x1="495" y1="220" x2="150" y2="220" />
                <polygon class="sun-light-arrow" points="150,216 145,220 150,224" />
                
                <line class="sun-light" x1="495" y1="240" x2="150" y2="240" />
                <polygon class="sun-light-arrow" points="150,236 145,240 150,244" />
            </g>

            <!-- Dynamic Labels -->
            <text id="scene1-label-d" class="dynamic-label" x="670" y="280">冬至 (12月22日前后)</text>
            <text id="scene1-label-a" class="dynamic-label" x="400" y="35">春分 (3月21日前后)</text>
            <text id="scene1-label-b" class="dynamic-label" x="130" y="280">夏至 (6月22日前后)</text>
            <text id="scene1-label-c" class="dynamic-label" x="400" y="435">秋分 (9月23日前后)</text>

        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">0 / 4</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Generate orbit using small line segments to avoid large bounding box overlap issues
        const svg = document.getElementById('scene1-svg');
        const orbitGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        const segments = 180;
        for (let i = 0; i < segments; i++) {
            const theta1 = (i / segments) * 2 * Math.PI;
            const theta2 = ((i + 1) / segments) * 2 * Math.PI;
            const x1 = 400 + 280 * Math.cos(theta1);
            const y1 = 230 + 120 * Math.sin(theta1);
            const x2 = 400 + 280 * Math.cos(theta2);
            const y2 = 230 + 120 * Math.sin(theta2);
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', x1);
            line.setAttribute('y1', y1);
            line.setAttribute('x2', x2);
            line.setAttribute('y2', y2);
            line.setAttribute('class', 'orbit');
            orbitGroup.appendChild(line);
        }
        svg.insertBefore(orbitGroup, svg.firstChild);

        let currentStep = 0;
        const totalSteps = 4;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');

        const earths = {
            a: document.getElementById('scene1-earth-a'),
            b: document.getElementById('scene1-earth-b'),
            c: document.getElementById('scene1-earth-c'),
            d: document.getElementById('scene1-earth-d')
        };

        const labels = {
            a: document.getElementById('scene1-label-a'),
            b: document.getElementById('scene1-label-b'),
            c: document.getElementById('scene1-label-c'),
            d: document.getElementById('scene1-label-d')
        };

        const rays = {
            b: document.getElementById('scene1-rays-b'),
            d: document.getElementById('scene1-rays-d')
        };

        function setOpacity(el, opacity) {
            if (!el) return;
            const elements = el.querySelectorAll ? el.querySelectorAll('*') : [];
            if (el.style) el.style.opacity = opacity;
            elements.forEach(child => {
                if (child.style) child.style.opacity = opacity;
            });
        }

        function updateScene() {
            // Reset all
            Object.values(earths).forEach(e => e.classList.remove('earth-highlight'));
            Object.values(labels).forEach(l => setOpacity(l, 0));
            setOpacity(rays.b, 0);
            setOpacity(rays.d, 0);

            // Apply step
            if (currentStep === 1) {
                earths.d.classList.add('earth-highlight');
                setOpacity(labels.d, 1);
                setOpacity(rays.d, 1);
            } else if (currentStep === 2) {
                earths.a.classList.add('earth-highlight');
                setOpacity(labels.a, 1);
            } else if (currentStep === 3) {
                earths.b.classList.add('earth-highlight');
                setOpacity(labels.b, 1);
                setOpacity(rays.b, 1);
            } else if (currentStep === 4) {
                earths.c.classList.add('earth-highlight');
                setOpacity(labels.c, 1);
            }

            // Update controls
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps;
            stepIndicator.textContent = `${currentStep} / ${totalSteps}`;
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < totalSteps) {
                currentStep++;
                updateScene();
            }
        });

        // Initialize
        updateScene();
    })();
    </script>
</body>
</html>
