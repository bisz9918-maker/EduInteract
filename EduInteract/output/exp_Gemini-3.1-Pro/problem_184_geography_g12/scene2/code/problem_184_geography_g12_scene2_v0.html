<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>北极俯视日照图的综合判读</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* SVG Elements */
        .scene2-base-line { stroke: #000000; stroke-width: 1.5; fill: none; }
        .scene2-dashed-line { stroke: #000000; stroke-width: 1.5; fill: none; stroke-dasharray: 5,5; }
        .scene2-terminator { stroke: #888888; stroke-width: 1.5; fill: none; }
        .scene2-night { fill: #888888; opacity: 0.3; }
        .scene2-sun-ray { stroke: #c62828; stroke-width: 1.5; fill: none; }
        .scene2-point { fill: #1565c0; }
        .scene2-text { font-size: 14px; fill: #000; user-select: none; }
        .scene2-text-small { font-size: 12px; fill: #000; user-select: none; }
        
        /* Dynamic Elements */
        .scene2-anim { transition: all 0.3s ease; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500">
            <defs>
                <marker id="scene2-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828" />
                </marker>
                <marker id="scene2-arrow-black" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
                </marker>
                <marker id="scene2-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32" />
                </marker>
                <marker id="scene2-arrow-green-rev" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 10 0 L 0 5 L 10 10 z" fill="#2e7d32" />
                </marker>
            </defs>

            <!-- Step 1: Polar Day Highlight -->
            <circle id="scene2-polar-day" cx="400" cy="240" r="60" fill="#ffee58" opacity="0" class="scene2-anim" />

            <!-- Base Grid -->
            <circle cx="400" cy="240" r="180" class="scene2-base-line" id="scene2-equator" />
            <circle cx="400" cy="240" r="120" class="scene2-dashed-line" id="scene2-tropic" />
            <circle cx="400" cy="240" r="60" class="scene2-base-line" id="scene2-arctic" />
            
            <line x1="220" y1="240" x2="400" y2="240" class="scene2-base-line" />
            <line x1="400" y1="240" x2="580" y2="240" class="scene2-base-line" id="scene2-line-180" class="scene2-anim" />
            <line x1="400" y1="60" x2="400" y2="240" class="scene2-base-line" />
            <line x1="400" y1="240" x2="400" y2="420" class="scene2-base-line" />

            <!-- Terminator and Night -->
            <path d="M 400 60 A 60 180 0 0 0 400 420" class="scene2-terminator" />
            <path d="M 400 60 A 60 180 0 0 0 400 420 A 180 180 0 0 1 400 60 Z" class="scene2-night" />

            <!-- Sun Rays -->
            <line x1="700" y1="160" x2="600" y2="160" class="scene2-sun-ray" marker-end="url(#scene2-arrow-red)" />
            <line x1="700" y1="240" x2="600" y2="240" class="scene2-sun-ray scene2-anim" id="scene2-sun-ray-mid" marker-end="url(#scene2-arrow-red)" />
            <line x1="700" y1="320" x2="600" y2="320" class="scene2-sun-ray" marker-end="url(#scene2-arrow-red)" />

            <!-- Rotation Arrow -->
            <path id="scene2-rotation-arrow" d="M 202 311 A 210 210 0 0 1 202 168" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#scene2-arrow-black)" class="scene2-anim" />

            <!-- Points -->
            <circle cx="400" cy="240" r="3" fill="#000" />
            <circle cx="580" cy="240" r="3" class="scene2-point" />
            <circle cx="400" cy="120" r="3" class="scene2-point" />
            <circle cx="400" cy="180" r="3" class="scene2-point" />

            <!-- Base Labels -->
            <text x="425" y="275" class="scene2-text-small">N</text>
            <text x="190" y="245" class="scene2-text-small" text-anchor="end">0°</text>
            <text x="565" y="225" class="scene2-text-small" text-anchor="end">180°</text>
            <text x="590" y="235" class="scene2-text-small">G</text>
            <text x="430" y="115" class="scene2-text-small">E</text>
            <text x="430" y="175" class="scene2-text-small">F</text>
            <text x="660" y="235" class="scene2-text-small" fill="#c62828">太阳光线</text>

            <!-- Step 1 Elements -->
            <text id="scene2-label-step1" x="580" y="60" class="scene2-text scene2-anim" fill="#c62828" opacity="0">极昼现象 → 夏至日 (6月22日)</text>

            <!-- Step 2 Elements -->
            <text id="scene2-label-direct" x="590" y="275" class="scene2-text-small scene2-anim" fill="#c62828" opacity="0">直射点</text>
            <text id="scene2-label-1200" x="565" y="210" class="scene2-text-small scene2-anim" fill="#c62828" text-anchor="end" opacity="0">12:00</text>
            <line id="scene2-line-120e" x1="400" y1="240" x2="490" y2="396" stroke="#c62828" stroke-width="1.5" stroke-dasharray="5,5" class="scene2-anim" opacity="0" />
            <path id="scene2-arc-time" d="M 460 240 A 60 60 0 0 1 430 292" stroke="#c62828" stroke-width="1.5" fill="none" marker-end="url(#scene2-arrow-red)" class="scene2-anim" opacity="0" />
            <text id="scene2-label-time-diff" x="485" y="295" class="scene2-text-small scene2-anim" fill="#c62828" opacity="0">-4小时</text>
            <text id="scene2-label-120e-text" x="520" y="430" class="scene2-text-small scene2-anim" fill="#c62828" opacity="0">120°E (北京时间 8:00)</text>

            <!-- Step 3 Elements -->
            <line id="scene2-arrow-sh-left" x1="520" y1="240" x2="460" y2="240" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene2-arrow-green)" class="scene2-anim" opacity="0" />
            <line id="scene2-arrow-sh-right" x1="520" y1="240" x2="580" y2="240" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene2-arrow-green)" class="scene2-anim" opacity="0" />
            <text id="scene2-label-sh" x="520" y="280" class="scene2-text-small scene2-anim" fill="#2e7d32" text-anchor="middle" opacity="0">正午太阳高度向南北递减</text>
            <circle id="scene2-point-foshan" cx="447" cy="350" r="3" fill="#1565c0" class="scene2-anim" opacity="0" />
            <text id="scene2-label-foshan" x="400" y="385" class="scene2-text-small scene2-anim" fill="#1565c0" text-anchor="end" opacity="0">佛山 (昼长夜短)</text>

            <!-- Step 4 Elements -->
            <text id="scene2-label-v-large" x="585" y="130" class="scene2-text scene2-anim" fill="#1565c0" opacity="0">大</text>
            <text id="scene2-label-v-mid" x="540" y="145" class="scene2-text scene2-anim" fill="#1565c0" opacity="0">中</text>
            <text id="scene2-label-v-small" x="490" y="175" class="scene2-text scene2-anim" fill="#1565c0" opacity="0">小</text>
            <text id="scene2-label-v-result" x="50" y="420" class="scene2-text scene2-anim" fill="#1565c0" opacity="0">自转线速度：G > E > F</text>
        </svg>
        <div id="scene2-controls">
            <button id="scene2-btn-prev" disabled>◀ 上一步</button>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>
    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 4;

        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');

        function show(id) {
            const el = document.getElementById(id);
            if (el) el.style.opacity = '1';
        }

        function hide(id) {
            const el = document.getElementById(id);
            if (el) el.style.opacity = '0';
        }

        function setStyle(id, styles) {
            const el = document.getElementById(id);
            if (el) {
                for (let key in styles) {
                    el.style[key] = styles[key];
                }
            }
        }

        function updateState() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;

            // Reset all dynamic styles
            setStyle('scene2-rotation-arrow', { stroke: '#000000', strokeWidth: '1.5' });
            setStyle('scene2-line-180', { stroke: '#000000', strokeWidth: '1.5' });
            setStyle('scene2-sun-ray-mid', { strokeWidth: '1.5' });
            setStyle('scene2-tropic', { stroke: '#000000', strokeWidth: '1.5' });
            setStyle('scene2-equator', { stroke: '#000000', strokeWidth: '1.5' });
            setStyle('scene2-arctic', { stroke: '#000000', strokeWidth: '1.5' });

            // Hide all step elements
            hide('scene2-polar-day');
            hide('scene2-label-step1');
            hide('scene2-label-direct');
            hide('scene2-label-1200');
            hide('scene2-line-120e');
            hide('scene2-arc-time');
            hide('scene2-label-time-diff');
            hide('scene2-label-120e-text');
            hide('scene2-arrow-sh-left');
            hide('scene2-arrow-sh-right');
            hide('scene2-label-sh');
            hide('scene2-point-foshan');
            hide('scene2-label-foshan');
            hide('scene2-label-v-large');
            hide('scene2-label-v-mid');
            hide('scene2-label-v-small');
            hide('scene2-label-v-result');

            if (currentStep >= 1) {
                setStyle('scene2-rotation-arrow', { stroke: '#c62828', strokeWidth: '3' });
                show('scene2-polar-day');
                show('scene2-label-step1');
            }

            if (currentStep >= 2) {
                setStyle('scene2-line-180', { stroke: '#c62828', strokeWidth: '3' });
                setStyle('scene2-sun-ray-mid', { strokeWidth: '3' });
                show('scene2-label-direct');
                show('scene2-label-1200');
                show('scene2-line-120e');
                show('scene2-arc-time');
                show('scene2-label-time-diff');
                show('scene2-label-120e-text');
            }

            if (currentStep === 3) {
                setStyle('scene2-tropic', { stroke: '#c62828', strokeWidth: '3' });
                show('scene2-arrow-sh-left');
                show('scene2-arrow-sh-right');
                show('scene2-label-sh');
                show('scene2-point-foshan');
                show('scene2-label-foshan');
            }

            if (currentStep >= 4) {
                setStyle('scene2-equator', { stroke: '#1565c0', strokeWidth: '3' });
                setStyle('scene2-tropic', { stroke: '#1565c0', strokeWidth: '3' });
                setStyle('scene2-arctic', { stroke: '#1565c0', strokeWidth: '3' });
                show('scene2-label-v-large');
                show('scene2-label-v-mid');
                show('scene2-label-v-small');
                show('scene2-label-v-result');
            }
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateState();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateState();
            }
        });

        // Initialize
        updateState();
    })();
    </script>
</body>
</html>
