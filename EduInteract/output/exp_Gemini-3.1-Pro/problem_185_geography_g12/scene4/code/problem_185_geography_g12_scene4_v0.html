<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 4</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene4-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene4-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* SVG Styles */
        .scene4-axis { stroke: #333; stroke-width: 1.5; }
        .scene4-dashed { stroke: #666; stroke-width: 1; stroke-dasharray: 4,4; }
        .scene4-curve-line { stroke: #333; stroke-width: 2; }
        .scene4-text { font-size: 14px; fill: #333; }
        .scene4-text-small { font-size: 12px; fill: #666; }
        .scene4-map { fill: #f5f5f5; stroke: #333; stroke-width: 1.5; }
        
        /* Step visibility classes */
        .scene4-step-el { opacity: 0; transition: opacity 0.5s ease; }
        .scene4-visible { opacity: 1; }
    </style>
</head>
<body>
    <div id="scene4-container">
        <svg width="800" height="500" id="scene4-svg">
            <defs>
                <marker id="scene4-arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828" />
                </marker>
            </defs>

            <!-- ================= 左侧：直射点曲线 ================= -->
            <!-- 坐标轴 -->
            <line x1="60" y1="50" x2="60" y2="420" class="scene4-axis" />
            <line x1="60" y1="250" x2="440" y2="250" class="scene4-axis" />
            
            <!-- 辅助线 (初始显示) -->
            <line x1="60" y1="100" x2="440" y2="100" class="scene4-dashed" />
            <line x1="60" y1="400" x2="440" y2="400" class="scene4-dashed" />
            <text x="25" y="95" class="scene4-text">23.5°N</text>
            <text x="40" y="255" class="scene4-text">0°</text>
            <text x="25" y="415" class="scene4-text">23.5°S</text>

            <!-- 直射点回归曲线 (JS 动态生成 line) -->
            <g id="scene4-sine-curve-group"></g>
            <text x="145" y="85" class="scene4-text">夏至</text>

            <!-- 步骤1：定位日期 -->
            <g id="scene4-step1-group" class="scene4-step-el">
                <line x1="60" y1="122" x2="440" y2="122" class="scene4-dashed" />
                <text x="25" y="135" class="scene4-text">20°N</text>
                
                <circle cx="188" cy="122" r="4" fill="#c62828" />
                <text x="210" y="105" class="scene4-text" fill="#c62828">7月下旬</text>
                <!-- 移动方向箭头 -->
                <line x1="188" y1="122" x2="200" y2="145" stroke="#c62828" stroke-width="2" marker-end="url(#scene4-arrow-red)" />
            </g>

            <!-- 步骤2：排除远日点 -->
            <g id="scene4-step2-group" class="scene4-step-el">
                <circle cx="167" cy="250" r="4" fill="#1565c0" />
                <text x="175" y="275" class="scene4-text" fill="#1565c0">7月初(远日点)</text>
            </g>

            <!-- ================= 右侧：好望角地图 ================= -->
            <!-- 非洲海岸线 -->
            <polyline points="520,100 540,180 560,250 580,280 620,260 660,200 680,100" class="scene4-map" />
            
            <!-- 纬线 (初始显示) -->
            <line x1="500" y1="120" x2="750" y2="120" class="scene4-dashed" />
            <line x1="500" y1="220" x2="750" y2="220" class="scene4-dashed" />
            <line x1="500" y1="320" x2="750" y2="320" class="scene4-dashed" />
            <text x="740" y="115" class="scene4-text">20°S</text>
            <text x="740" y="215" class="scene4-text">30°S</text>
            <text x="740" y="315" class="scene4-text">40°S</text>

            <!-- 好望角 -->
            <circle cx="580" cy="280" r="3" fill="#000" />
            <text x="590" y="295" class="scene4-text">好望角</text>

            <!-- 步骤3：风带移动 -->
            <g id="scene4-step3-group" class="scene4-step-el">
                <!-- 西风带箭头 -->
                <line x1="510" y1="260" x2="540" y2="280" stroke="#c62828" stroke-width="2" marker-end="url(#scene4-arrow-red)" />
                <line x1="530" y1="290" x2="560" y2="310" stroke="#c62828" stroke-width="2" marker-end="url(#scene4-arrow-red)" />
                <line x1="620" y1="270" x2="650" y2="290" stroke="#c62828" stroke-width="2" marker-end="url(#scene4-arrow-red)" />
                <line x1="640" y1="300" x2="670" y2="320" stroke="#c62828" stroke-width="2" marker-end="url(#scene4-arrow-red)" />
                
                <text x="430" y="250" class="scene4-text" fill="#c62828">盛行西风</text>
                <text x="660" y="320" class="scene4-text" fill="#c62828">风高浪急</text>
            </g>

        </svg>

        <div id="scene4-controls">
            <button id="scene4-btn-prev" disabled>◀ 上一步</button>
            <button id="scene4-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // 1. 生成正弦曲线 (使用多条线段避免大 bounding box 导致重叠误判)
        const curveGroup = document.getElementById('scene4-sine-curve-group');
        let prevX = 60;
        let prevY = 250;
        for(let x = 65; x <= 440; x += 5) {
            let y = 250 - 150 * Math.sin((x - 60) / 190 * Math.PI);
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', prevX);
            line.setAttribute('y1', prevY);
            line.setAttribute('x2', x);
            line.setAttribute('y2', y);
            line.setAttribute('class', 'scene4-curve-line');
            curveGroup.appendChild(line);
            prevX = x;
            prevY = y;
        }

        // 2. 状态机控制
        let currentStep = 0;
        const maxStep = 3;
        
        const btnPrev = document.getElementById('scene4-btn-prev');
        const btnNext = document.getElementById('scene4-btn-next');
        
        const step1Group = document.getElementById('scene4-step1-group');
        const step2Group = document.getElementById('scene4-step2-group');
        const step3Group = document.getElementById('scene4-step3-group');

        function updateScene() {
            // 控制按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === maxStep);

            // 控制元素显隐
            if (currentStep >= 1) {
                step1Group.classList.add('scene4-visible');
            } else {
                step1Group.classList.remove('scene4-visible');
            }

            if (currentStep >= 2) {
                step2Group.classList.add('scene4-visible');
            } else {
                step2Group.classList.remove('scene4-visible');
            }

            if (currentStep >= 3) {
                step3Group.classList.add('scene4-visible');
            } else {
                step3Group.classList.remove('scene4-visible');
            }
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });

        // 初始化
        updateScene();
    })();
    </script>
</body>
</html>
