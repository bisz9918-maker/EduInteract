<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene2-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #fff; border-radius: 4px; }
        .scene2-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene2-panel { position: absolute; left: 520px; top: 80px; width: 210px; height: 290px; background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 8px; padding: 15px; font-size: 14px; line-height: 1.5; color: #333; overflow-y: auto; }
        .scene2-fade { transition: opacity 0.5s ease; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" id="scene2-svg">
            <defs>
                <marker id="scene2-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#f57f17" />
                </marker>
            </defs>
            <!-- 经纬网底图 -->
            <line x1="100" y1="80" x2="460" y2="80" stroke="#333" stroke-width="1" /><line x1="100" y1="380" x2="460" y2="380" stroke="#333" stroke-width="1" /><line x1="100" y1="80" x2="100" y2="380" stroke="#333" stroke-width="1" /><line x1="460" y1="80" x2="460" y2="380" stroke="#333" stroke-width="1" />
            <!-- 浅色虚线网格 -->
            <g id="scene2-grid" stroke="#eeeeee" stroke-width="1" stroke-dasharray="4,4">
                <!-- 经线网格 30度一根 -->
                <line x1="160" y1="80" x2="160" y2="380" />
                <line x1="220" y1="80" x2="220" y2="380" />
                <line x1="280" y1="80" x2="280" y2="380" />
                <line x1="340" y1="80" x2="340" y2="380" />
                <line x1="400" y1="80" x2="400" y2="380" />
                <!-- 纬线网格 10度一根 -->
                <line x1="100" y1="130" x2="460" y2="130" />
                <line x1="100" y1="180" x2="460" y2="180" />
                <line x1="100" y1="230" x2="460" y2="230" />
                <line x1="100" y1="280" x2="460" y2="280" />
                <line x1="100" y1="330" x2="460" y2="330" />
            </g>
            
            <!-- 赤道 -->
            <line x1="100" y1="380" x2="460" y2="380" stroke="#000" stroke-width="2" />
            <text x="80" y="385" font-size="14" fill="#333" text-anchor="end" dominant-baseline="middle">0°</text>

            <!-- 步骤0：经线 -->
            <g id="scene2-step0-elements" class="scene2-fade" style="opacity: 0; display: none;">
                <line x1="100" y1="80" x2="100" y2="380" stroke="#1565c0" stroke-width="2" />
                <text x="100" y="405" font-size="14" fill="#333" text-anchor="middle">0°</text>
                
                <line x1="220" y1="80" x2="220" y2="380" stroke="#1565c0" stroke-width="2" />
                <text x="220" y="400" font-size="14" fill="#333" text-anchor="middle">60°E</text>
                
                <line x1="340" y1="80" x2="340" y2="380" stroke="#1565c0" stroke-width="2" />
                <text x="340" y="400" font-size="14" fill="#333" text-anchor="middle">120°E</text>
                
                <line x1="460" y1="80" x2="460" y2="380" stroke="#1565c0" stroke-width="2" />
                <text x="460" y="400" font-size="14" fill="#333" text-anchor="middle">180°</text>
            </g>

            <!-- 步骤1：纬线和点 -->
            <g id="scene2-step1-elements" class="scene2-fade" style="opacity: 0; display: none;">
                <line x1="100" y1="230" x2="460" y2="230" stroke="#c62828" stroke-width="2" />
                <text x="95" y="235" font-size="14" fill="#333" text-anchor="end" dominant-baseline="middle">30°N</text>
                
                <line x1="100" y1="195" x2="460" y2="195" stroke="#c62828" stroke-width="2" />
                <text x="95" y="200" font-size="14" fill="#333" text-anchor="end" dominant-baseline="middle">37°N</text>
                
                <line x1="100" y1="130" x2="460" y2="130" stroke="#c62828" stroke-width="2" />
                <text x="95" y="150" font-size="14" fill="#333" text-anchor="end" dominant-baseline="middle">50°N</text>
                
                <line x1="100" y1="120" x2="460" y2="120" stroke="#c62828" stroke-width="2" />
                <text x="95" y="110" font-size="14" fill="#333" text-anchor="end" dominant-baseline="middle">52°N</text>

                <!-- 点 -->
                <circle cx="340" cy="230" r="5" fill="#2e7d32" stroke="#fff" stroke-width="1" />
                <text x="330" y="215" font-size="14" fill="#333">①</text>
                
                <circle cx="220" cy="130" r="5" fill="#2e7d32" stroke="#fff" stroke-width="1" />
                <text x="210" y="115" font-size="14" fill="#333">②</text>
                
                <circle cx="100" cy="120" r="5" fill="#2e7d32" stroke="#fff" stroke-width="1" />
                <text x="110" y="105" font-size="14" fill="#333">③</text>
                
                <circle cx="460" cy="195" r="5" fill="#2e7d32" stroke="#fff" stroke-width="1" />
                <text x="450" y="185" font-size="14" fill="#333">④</text>
            </g>

            <!-- 步骤2：H值标签 -->
            <g id="scene2-step2-elements" class="scene2-fade" style="opacity: 0; display: none;">
                <text x="360" y="260" font-size="14" fill="#333">H=83°26'</text>
                <text x="240" y="160" font-size="14" fill="#333">H=63°26'</text>
                <text x="120" y="150" font-size="14" fill="#333">H=61°26'</text>
                <text x="480" y="225" font-size="14" fill="#333">H=76°26'</text>
            </g>

            <!-- 步骤3：昼长指示箭头 -->
            <g id="scene2-step3-elements" class="scene2-fade" style="opacity: 0; display: none;">
                <line x1="40" y1="300" x2="40" y2="100" stroke="#f57f17" stroke-width="3" marker-end="url(#scene2-arrow)" />
                <text x="36" y="200" font-size="14" fill="#f57f17" text-anchor="middle" transform="rotate(-90, 36, 200)">昼长逐渐增加</text>
            </g>
        </svg>

        <div id="scene2-panel"></div>

        <div id="scene2-controls">
            <button id="scene2-btn-prev" class="scene2-btn">◀ 上一步</button>
            <button id="scene2-btn-next" class="scene2-btn">下一步 ▶</button>
        </div>
    </div>
    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 3;
        
        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        const panel = document.getElementById('scene2-panel');
        
        const step0Els = document.getElementById('scene2-step0-elements');
        const step1Els = document.getElementById('scene2-step1-elements');
        const step2Els = document.getElementById('scene2-step2-elements');
        const step3Els = document.getElementById('scene2-step3-elements');

        const panelContents = [
            "<b>【经度计算】</b><br><br>根据世界时（0°经线地方时）和当地正午（地方时12时）的时间差计算经度。<br><br>①地：世界时4时，经度120°E。<br>②地：世界时8时，经度60°E。<br>③地：世界时12时，经度0°。<br>④地：世界时0时，经度180°。",
            "<b>【纬度计算】</b><br><br>6月22日太阳直射23°26'N。根据太阳能热水器倾角（与正午太阳高度互余）计算纬度。<br><br>①地：倾角6°34'，纬度30°N。<br>②地：倾角26°34'，纬度50°N。<br>③地：倾角28°34'，纬度52°N。<br>④地：倾角13°34'，纬度37°N。",
            "<b>【正午太阳高度比较】</b><br><br>正午太阳高度 H = 90° - |当地纬度 - 直射点纬度|。<br><br>距离23°26'N越近，正午太阳高度越大。<br><br>排序：① > ④ > ② > ③",
            "<b>【昼长比较】</b><br><br>6月22日为夏至日，北半球各地昼长夜短。<br><br>纬度越高，昼越长。<br><br>排序：③ > ② > ④ > ①"
        ];

        function show(el) {
            el.style.display = '';
            // trigger reflow
            void el.offsetWidth;
            el.style.opacity = '1';
        }

        function hide(el) {
            el.style.opacity = '0';
            setTimeout(() => {
                if (el.style.opacity === '0') {
                    el.style.display = 'none';
                }
            }, 500);
        }

        function updateScene() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
            
            panel.innerHTML = panelContents[currentStep];
            if (window.MathJax) {
                MathJax.typesetPromise([panel]).catch(function (err) {
                    console.log(err.message);
                });
            }

            if (currentStep >= 0) show(step0Els); else hide(step0Els);
            if (currentStep >= 1) show(step1Els); else hide(step1Els);
            if (currentStep === 2) show(step2Els); else hide(step2Els);
            if (currentStep === 3) show(step3Els); else hide(step3Els);
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });

        // Initialize
        updateScene();
    })();
    </script>
</body>
</html>
