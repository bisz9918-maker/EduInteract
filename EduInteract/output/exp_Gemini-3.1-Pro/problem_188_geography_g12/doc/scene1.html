<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 20px; z-index: 10; }
        .slider-container { display: flex; flex-direction: column; align-items: center; }
        .slider-labels { display: flex; justify-content: space-between; width: 300px; font-size: 12px; color: #555; margin-top: 4px; }
        input[type="range"] { width: 300px; cursor: pointer; }
        .toggle-container { display: flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer; }
        
        /* SVG Styles */
        .axis-line { stroke: #888; stroke-width: 1; stroke-dasharray: 4,4; }
        .equator { stroke: #888; stroke-width: 1; }
        .trajectory { stroke: #888; stroke-width: 1; stroke-dasharray: 4,4; fill: none; }
        .node { fill: #000; }
        .active-node { fill: #c62828; }
        .earth-outline { stroke: #000; stroke-width: 1.5; fill: none; }
        .terminator { stroke: #000; stroke-width: 1.5; }
        .night-hemisphere { fill: #1565c0; opacity: 0.3; }
        .sun-ray { stroke: #888; stroke-width: 1; }
        .center-ray { stroke: #c62828; stroke-width: 2; }
        .baicheng-night { stroke: #555; stroke-width: 3; }
        .baicheng-day { stroke: #2e7d32; stroke-width: 3; }
        .label { font-size: 12px; fill: #333; }
        .label-bold { font-size: 12px; fill: #000; font-weight: bold; }
        .label-red { font-size: 14px; fill: #c62828; font-weight: bold; }
        .arrow { stroke: #c62828; stroke-width: 2; fill: none; }
        .arrow-head { fill: #c62828; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- Left Side: Trajectory -->
            <g id="scene1-left-group">
                <!-- Latitudes -->
                <line x1="40" y1="120" x2="320" y2="120" class="axis-line" />
                <text x="330" y="115" class="label" text-anchor="start">北回归线</text>
                
                <line x1="40" y1="220" x2="320" y2="220" class="equator" />
                <text x="330" y="215" class="label" text-anchor="start">赤道</text>
                
                <line x1="40" y1="320" x2="320" y2="320" class="axis-line" />
                <text x="330" y="315" class="label" text-anchor="start">南回归线</text>
                
                <!-- Trajectory Line -->
                <polyline points="60,220 120,120 180,220 240,320 300,220" class="trajectory" />
                
                <!-- Nodes -->
                <circle cx="60" cy="220" r="3" class="node" />
                <text x="45" y="225" class="label-bold" text-anchor="middle">①</text>
                
                <circle cx="120" cy="120" r="3" class="node" />
                <text x="120" y="108" class="label-bold" text-anchor="middle">②</text>
                
                <circle cx="180" cy="220" r="3" class="node" />
                <text x="180" y="335" class="label-bold" text-anchor="middle">③</text>
                
                <circle cx="240" cy="320" r="3" class="node" />
                <text x="240" y="338" class="label-bold" text-anchor="middle">④</text>
                
                <!-- Active Node -->
                <circle id="scene1-active-node" cx="60" cy="220" r="5" class="active-node" />
            </g>
            
            <!-- Right Side: Earth -->
            <g id="scene1-right-group">
                <!-- Sun Rays -->
                <line x1="780" y1="120" x2="730" y2="120" class="sun-ray" />
                <line x1="780" y1="170" x2="730" y2="170" class="sun-ray" />
                <line x1="780" y1="270" x2="730" y2="270" class="sun-ray" />
                <line x1="780" y1="320" x2="730" y2="320" class="sun-ray" />
                
                <!-- Center Ray (Dynamic) -->
                <g id="scene1-center-ray-group">
                    <line id="scene1-center-ray" x1="780" y1="220" x2="710" y2="220" class="center-ray" />
                    <polygon id="scene1-center-ray-arrow" points="710,220 718,216 718,224" fill="#c62828" />
                </g>
                
                <!-- Earth Base -->
                <circle cx="560" cy="220" r="150" class="earth-outline" />
                
                <!-- Latitudes on Earth -->
                <line x1="410" y1="220" x2="710" y2="220" class="equator" />
                <text x="725" y="225" class="label" text-anchor="start">赤道</text>
                
                <line x1="422.5" y1="160" x2="697.5" y2="160" class="axis-line" />
                <text x="725" y="165" class="label" text-anchor="start">北回归线</text>
                
                <line x1="422.5" y1="280" x2="697.5" y2="280" class="axis-line" />
                <text x="725" y="285" class="label" text-anchor="start">南回归线</text>
                
                <line x1="500.2" y1="82.5" x2="619.8" y2="82.5" class="axis-line" />
                <text x="725" y="87" class="label" text-anchor="start">北极圈</text>
                
                <line x1="500.2" y1="357.5" x2="619.8" y2="357.5" class="axis-line" />
                <text x="725" y="362" class="label" text-anchor="start">南极圈</text>
                
                <!-- Baicheng Latitude -->
                <line id="scene1-baicheng-night" x1="454" y1="114" x2="560" y2="114" class="baicheng-night" />
                <line id="scene1-baicheng-day" x1="560" y1="114" x2="666" y2="114" class="baicheng-day" />
                <text x="725" y="118" class="label" text-anchor="start">白城</text>
                
                <!-- Night Hemisphere (Dynamic) -->
                <path id="scene1-night-path" d="M 560 70 A 150 150 0 0 0 560 370 L 560 70 Z" class="night-hemisphere" />
                
                <!-- Terminator Line (Dynamic) -->
                <line id="scene1-terminator" x1="560" y1="70" x2="560" y2="370" class="terminator" />
                
                <!-- Terminator Label -->
                <text x="480" y="50" class="label" text-anchor="middle">晨昏线</text>
                <line id="scene1-terminator-pointer" x1="480" y1="55" x2="560" y2="70" stroke="#888" stroke-width="1" />
                
                <!-- Polar Labels (Dynamic) -->
                <text id="scene1-north-polar-label" x="560" y="50" class="label-red" text-anchor="middle" opacity="0">极昼</text>
                <text id="scene1-south-polar-label" x="560" y="390" class="label-red" text-anchor="middle" opacity="0">极夜</text>
                
                <!-- Altitude Arrows (Dynamic, initially hidden) -->
                <g id="scene1-altitude-group" style="display: none;">
                    <!-- North Arrow -->
                    <line id="scene1-alt-arrow-n" x1="710" y1="220" x2="710" y2="170" class="arrow" />
                    <polygon id="scene1-alt-head-n" points="710,170 706,178 714,178" class="arrow-head" />
                    <text id="scene1-alt-text-n" x="715" y="195" class="label-red" text-anchor="start">递减</text>
                    
                    <!-- South Arrow -->
                    <line id="scene1-alt-arrow-s" x1="710" y1="220" x2="710" y2="270" class="arrow" />
                    <polygon id="scene1-alt-head-s" points="710,270 706,262 714,262" class="arrow-head" />
                    <text id="scene1-alt-text-s" x="715" y="245" class="label-red" text-anchor="start">递减</text>
                </g>
            </g>
        </svg>
        
        <div id="scene1-controls">
            <div class="slider-container">
                <input type="range" id="scene1-time-slider" min="0" max="360" value="0" step="1">
                <div class="slider-labels">
                    <span>春分①</span>
                    <span>夏至②</span>
                    <span>秋分③</span>
                    <span>冬至④</span>
                    <span>春分①</span>
                </div>
            </div>
            <label class="toggle-container">
                <input type="checkbox" id="scene1-altitude-toggle">
                显示正午太阳高度递减
            </label>
        </div>
    </div>

    <script>
    (function() {
        const slider = document.getElementById('scene1-time-slider');
        const toggle = document.getElementById('scene1-altitude-toggle');
        
        const activeNode = document.getElementById('scene1-active-node');
        const centerRay = document.getElementById('scene1-center-ray');
        const centerRayArrow = document.getElementById('scene1-center-ray-arrow');
        const nightPath = document.getElementById('scene1-night-path');
        const terminator = document.getElementById('scene1-terminator');
        const terminatorPointer = document.getElementById('scene1-terminator-pointer');
        const baichengNight = document.getElementById('scene1-baicheng-night');
        const baichengDay = document.getElementById('scene1-baicheng-day');
        
        const northPolarLabel = document.getElementById('scene1-north-polar-label');
        const southPolarLabel = document.getElementById('scene1-south-polar-label');
        
        const altitudeGroup = document.getElementById('scene1-altitude-group');
        const altArrowN = document.getElementById('scene1-alt-arrow-n');
        const altHeadN = document.getElementById('scene1-alt-head-n');
        const altTextN = document.getElementById('scene1-alt-text-n');
        const altArrowS = document.getElementById('scene1-alt-arrow-s');
        const altHeadS = document.getElementById('scene1-alt-head-s');
        const altTextS = document.getElementById('scene1-alt-text-s');

        function updateScene() {
            const theta = parseFloat(slider.value);
            const rad = theta * Math.PI / 180;
            
            // 1. Left Graph Active Node
            // theta 0->360 maps to x 60->300
            const cx = 60 + theta * (240 / 360);
            // y: 220 is equator, amplitude is 100. sin(0)=0 -> 220. sin(90)=1 -> 120.
            const cy = 220 - 100 * Math.sin(rad);
            activeNode.setAttribute('cx', cx);
            activeNode.setAttribute('cy', cy);
            
            // 2. Right Graph Calculations
            // alpha is the declination angle (tilt of terminator)
            // max tilt is 23.5 deg. We use sin(rad) to map 0->1->0->-1
            const alphaDeg = 23.5 * Math.sin(rad);
            const alphaRad = alphaDeg * Math.PI / 180;
            
            // Terminator endpoints
            const r = 150;
            const cxEarth = 560;
            const cyEarth = 220;
            
            // Top point of terminator
            const tx1 = cxEarth - r * Math.sin(alphaRad);
            const ty1 = cyEarth - r * Math.cos(alphaRad);
            
            // Bottom point of terminator
            const tx2 = cxEarth + r * Math.sin(alphaRad);
            const ty2 = cyEarth + r * Math.cos(alphaRad);
            
            terminator.setAttribute('x1', tx1);
            terminator.setAttribute('y1', ty1);
            terminator.setAttribute('x2', tx2);
            terminator.setAttribute('y2', ty2);
            
            // Pointer to terminator top
            terminatorPointer.setAttribute('x2', tx1);
            terminatorPointer.setAttribute('y2', ty1);
            
            // Night Hemisphere Path
            // Arc from top to bottom along the left edge, then line back to top
            // M tx1 ty1 A r r 0 0 0 tx2 ty2 L tx1 ty1 Z (Wait, we need the terminator line)
            // Actually, the path should be:
            // Arc from (tx1, ty1) to (tx2, ty2) along the left side of the circle
            // Then straight line from (tx2, ty2) back to (tx1, ty1)
            // sweep-flag 0 means counter-clockwise? Let's check.
            // Left arc from top to bottom: sweep-flag 0
            const pathD = `M ${tx1} ${ty1} A ${r} ${r} 0 0 0 ${tx2} ${ty2} L ${tx1} ${ty1} Z`;
            nightPath.setAttribute('d', pathD);
            
            // Center Ray
            // Declination y offset on earth is r * sin(declination)
            // Wait, declination is angle from equator.
            // y offset = - r * sin(declination_angle)
            // Actually, the latitude y is cyEarth - r * sin(declination_angle)
            // Let's use the same mapping as left graph: 100px = 23.5 deg.
            // So y = 220 - 100 * Math.sin(rad)
            const rayY = 220 - 100 * Math.sin(rad);
            // x on the surface of earth
            const rayX = cxEarth + Math.sqrt(r*r - (rayY - cyEarth)*(rayY - cyEarth));
            
            centerRay.setAttribute('y1', rayY);
            centerRay.setAttribute('y2', rayY);
            centerRay.setAttribute('x2', rayX);
            
            centerRayArrow.setAttribute('points', `${rayX},${rayY} ${rayX+8},${rayY-4} ${rayX+8},${rayY+4}`);
            
            // Baicheng Latitude (y = 114)
            // Intersection of terminator and y=114
            // terminator line: passes through (560, 220), angle alphaRad with vertical
            // dx = - (y - 220) * tan(alphaRad)
            const baichengY = 114;
            const intersectX = cxEarth - (baichengY - cyEarth) * Math.tan(alphaRad);
            
            baichengNight.setAttribute('x2', intersectX);
            baichengDay.setAttribute('x1', intersectX);
            
            // Polar Labels
            if (theta > 45 && theta < 135) {
                northPolarLabel.setAttribute('opacity', '1');
                northPolarLabel.textContent = '极昼';
                southPolarLabel.setAttribute('opacity', '1');
                southPolarLabel.textContent = '极夜';
            } else if (theta > 225 && theta < 315) {
                northPolarLabel.setAttribute('opacity', '1');
                northPolarLabel.textContent = '极夜';
                southPolarLabel.setAttribute('opacity', '1');
                southPolarLabel.textContent = '极昼';
            } else {
                northPolarLabel.setAttribute('opacity', '0');
                southPolarLabel.setAttribute('opacity', '0');
            }
            
            // Altitude Arrows
            if (toggle.checked) {
                altitudeGroup.style.display = 'block';
                
                // Tangent vectors
                // Normal vector at (rayX, rayY) is (cos(decl), sin(decl))
                // Tangent vector pointing North: (-sin(decl), -cos(decl))
                // Tangent vector pointing South: (sin(decl), cos(decl))
                // Wait, declination angle is alphaRad.
                // Normal angle is alphaRad (0 at equator, positive towards North)
                // Let's just use the derivative of the circle.
                const nx = (rayX - cxEarth) / r;
                const ny = (rayY - cyEarth) / r;
                
                // Tangent North (up and left/right)
                const txN = ny;
                const tyN = -nx;
                
                // Tangent South (down and left/right)
                const txS = -ny;
                const tyS = nx;
                
                const arrowLen = 50;
                
                const nEndX = rayX + txN * arrowLen;
                const nEndY = rayY + tyN * arrowLen;
                
                const sEndX = rayX + txS * arrowLen;
                const sEndY = rayY + tyS * arrowLen;
                
                altArrowN.setAttribute('x1', rayX);
                altArrowN.setAttribute('y1', rayY);
                altArrowN.setAttribute('x2', nEndX);
                altArrowN.setAttribute('y2', nEndY);
                
                // Arrow head N
                const headLen = 10;
                const headW = 4;
                // Vector from end to start
                const dirNX = -txN;
                const dirNY = -tyN;
                // Normal to dirN
                const normNX = -dirNY;
                const normNY = dirNX;
                
                const p1NX = nEndX + dirNX * headLen + normNX * headW;
                const p1NY = nEndY + dirNY * headLen + normNY * headW;
                const p2NX = nEndX + dirNX * headLen - normNX * headW;
                const p2NY = nEndY + dirNY * headLen - normNY * headW;
                
                altHeadN.setAttribute('points', `${nEndX},${nEndY} ${p1NX},${p1NY} ${p2NX},${p2NY}`);
                
                // Text N
                altTextN.setAttribute('x', nEndX + 10);
                altTextN.setAttribute('y', nEndY - 40);
                
                // Arrow S
                altArrowS.setAttribute('x1', rayX);
                altArrowS.setAttribute('y1', rayY);
                altArrowS.setAttribute('x2', sEndX);
                altArrowS.setAttribute('y2', sEndY);
                
                // Arrow head S
                const dirSX = -txS;
                const dirSY = -tyS;
                const normSX = -dirSY;
                const normSY = dirSX;
                
                const p1SX = sEndX + dirSX * headLen + normSX * headW;
                const p1SY = sEndY + dirSY * headLen + normSY * headW;
                const p2SX = sEndX + dirSX * headLen - normSX * headW;
                const p2SY = sEndY + dirSY * headLen - normSY * headW;
                
                altHeadS.setAttribute('points', `${sEndX},${sEndY} ${p1SX},${p1SY} ${p2SX},${p2SY}`);
                
                // Text S
                altTextS.setAttribute('x', sEndX + 10);
                altTextS.setAttribute('y', sEndY + 50);
                
            } else {
                altitudeGroup.style.display = 'none';
            }
        }

        slider.addEventListener('input', updateScene);
        toggle.addEventListener('change', updateScene);
        
        // Initial render
        updateScene();
    })();
    </script>
</body>
</html>
