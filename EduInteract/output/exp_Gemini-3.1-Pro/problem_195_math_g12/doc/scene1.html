<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f8f9fa; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button:hover:not(:disabled) { background: #e2e6ea; }
        
        /* SVG Styles */
        .scene1-point { fill: #000; }
        .scene1-line { stroke: #000; stroke-width: 2; fill: none; transition: all 0.3s ease; }
        .scene1-circle { stroke: #000; stroke-width: 2; fill: none; }
        .scene1-text { font-size: 16px; fill: #000; user-select: none; transition: opacity 0.3s ease; }
        .scene1-text-italic { font-style: italic; }
        .scene1-fill { transition: opacity 0.3s ease; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- 填充层 -->
            <polygon id="scene1-poly-pac" points="371,370 510,370 510,130" fill="#1565c0" opacity="0" class="scene1-fill" />
            
            <!-- 图形层 -->
            <circle cx="510" cy="250" r="120" class="scene1-circle" />
            
            <!-- 线段层 -->
            <line id="scene1-line-ac" x1="510" y1="370" x2="510" y2="130" class="scene1-line" />
            <line id="scene1-line-pa" x1="371" y1="370" x2="510" y2="370" class="scene1-line" />
            <line id="scene1-line-pc" x1="371" y1="370" x2="510" y2="130" class="scene1-line" />
            <line id="scene1-line-oa" x1="510" y1="250" x2="510" y2="370" stroke="#2e7d32" stroke-width="4" opacity="0" class="scene1-line" />
            
            <!-- 直角符号 -->
            <polyline id="scene1-right-angle" points="510,355 495,355 495,370" stroke="#c62828" stroke-width="2" fill="none" opacity="0" class="scene1-line" />
            
            <!-- 点层 -->
            <circle cx="510" cy="250" r="3" class="scene1-point" /> <!-- O -->
            <circle cx="510" cy="370" r="3" class="scene1-point" /> <!-- A -->
            <circle cx="510" cy="130" r="3" class="scene1-point" /> <!-- C -->
            <circle cx="371" cy="370" r="3" class="scene1-point" /> <!-- P -->
            <circle cx="406" cy="310" r="3" class="scene1-point" /> <!-- B -->
            
            <!-- 文本层 -->
            <!-- 字母标签 -->
            <!-- 调整 O 的位置，移到圆外 -->
            <text x="525" y="255" class="scene1-text scene1-text-italic">O</text>
            <text x="510" y="390" class="scene1-text scene1-text-italic" text-anchor="middle">A</text>
            <text x="510" y="120" class="scene1-text scene1-text-italic" text-anchor="middle">C</text>
            <text x="350" y="375" class="scene1-text scene1-text-italic">P</text>
            <!-- 调整 B 的位置，移到线段和圆外 -->
            <text x="385" y="300" class="scene1-text scene1-text-italic">B</text>
            
            <!-- 数值标签 -->
            <text id="scene1-val-pa" x="440" y="390" class="scene1-text" text-anchor="middle">PA=2</text>
            <!-- 调整 PB=1 的位置 -->
            <text id="scene1-val-pb" x="375" y="330" class="scene1-text" text-anchor="end">PB=1</text>
            <!-- 调整 PC=4 的位置，移到线段和圆外 -->
            <text id="scene1-val-pc" x="420" y="240" class="scene1-text" text-anchor="end" opacity="0">PC=4</text>
            <!-- 调整 AC=2√3 的位置，移到圆外 -->
            <text id="scene1-val-ac" x="535" y="190" class="scene1-text" opacity="0">AC=2√3</text>
            <!-- 调整 R=√3 的位置，移到圆外 -->
            <text id="scene1-val-r" x="535" y="310" class="scene1-text" opacity="0">R=√3</text>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 4;
        
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        
        // Elements
        const linePA = document.getElementById('scene1-line-pa');
        const linePC = document.getElementById('scene1-line-pc');
        const lineAC = document.getElementById('scene1-line-ac');
        const lineOA = document.getElementById('scene1-line-oa');
        const polyPAC = document.getElementById('scene1-poly-pac');
        const rightAngle = document.getElementById('scene1-right-angle');
        
        const valPC = document.getElementById('scene1-val-pc');
        const valAC = document.getElementById('scene1-val-ac');
        const valR = document.getElementById('scene1-val-r');
        
        function updateStep(step) {
            // Reset all styles
            linePA.style.stroke = '#000';
            linePA.style.strokeWidth = '2';
            linePC.style.stroke = '#000';
            linePC.style.strokeWidth = '2';
            lineAC.style.stroke = '#000';
            lineAC.style.strokeWidth = '2';
            
            lineOA.style.opacity = '0';
            polyPAC.style.opacity = '0';
            rightAngle.style.opacity = '0';
            
            valPC.style.opacity = '0';
            valAC.style.opacity = '0';
            valR.style.opacity = '0';
            
            switch(step) {
                case 0:
                    // Initial state
                    break;
                case 1:
                    // Step 1: 切割线定理
                    linePA.style.stroke = '#1565c0';
                    linePA.style.strokeWidth = '4';
                    linePC.style.stroke = '#1565c0';
                    linePC.style.strokeWidth = '4';
                    valPC.style.opacity = '1';
                    break;
                case 2:
                    // Step 2: 切线性质
                    linePA.style.stroke = '#c62828';
                    linePA.style.strokeWidth = '4';
                    lineAC.style.stroke = '#c62828';
                    lineAC.style.strokeWidth = '4';
                    rightAngle.style.opacity = '1';
                    valPC.style.opacity = '1';
                    break;
                case 3:
                    // Step 3: 勾股定理
                    polyPAC.style.opacity = '0.15';
                    linePA.style.stroke = '#1565c0';
                    linePA.style.strokeWidth = '3';
                    linePC.style.stroke = '#1565c0';
                    linePC.style.strokeWidth = '3';
                    lineAC.style.stroke = '#1565c0';
                    lineAC.style.strokeWidth = '3';
                    rightAngle.style.opacity = '1';
                    valPC.style.opacity = '1';
                    valAC.style.opacity = '1';
                    break;
                case 4:
                    // Step 4: 得出结论
                    polyPAC.style.opacity = '0.15';
                    linePA.style.stroke = '#1565c0';
                    linePA.style.strokeWidth = '3';
                    linePC.style.stroke = '#1565c0';
                    linePC.style.strokeWidth = '3';
                    lineAC.style.stroke = '#1565c0';
                    lineAC.style.strokeWidth = '3';
                    rightAngle.style.opacity = '1';
                    valPC.style.opacity = '1';
                    valAC.style.opacity = '1';
                    
                    lineOA.style.opacity = '1';
                    valR.style.opacity = '1';
                    break;
            }
            
            btnPrev.disabled = step === 0;
            btnNext.disabled = step === maxStep;
        }
        
        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateStep(currentStep);
            }
        });
        
        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateStep(currentStep);
            }
        });
        
        // Initialize
        updateStep(0);
    })();
    </script>
</body>
</html>
