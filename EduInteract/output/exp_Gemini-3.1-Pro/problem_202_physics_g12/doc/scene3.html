<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button.active { background: #1565c0; color: white; border-color: #1565c0; }
        
        .scene3-path { fill: none; transition: all 0.3s ease; }
        .scene3-path.active { stroke: #1565c0; stroke-width: 3; stroke-dasharray: none; }
        .scene3-path.inactive { stroke: #888888; stroke-width: 1.5; stroke-dasharray: 4 4; }
        
        .scene3-vertex { fill: #c62828; transition: opacity 0.3s ease; }
        
        .scene3-label { font-size: 14px; fill: #000; }
        .scene3-efield { stroke: #888888; stroke-width: 1.5; }
        .scene3-axis { stroke: #000; stroke-width: 2; }
        .scene3-mag { fill: #888888; font-size: 16px; text-anchor: middle; dominant-baseline: middle; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg width="800" height="500">
            <!-- Definitions for arrows -->
            <defs>
                <marker id="scene3-arrow-down" viewBox="0 0 10 10" refX="5" refY="10" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 5 10 L 10 0 z" fill="#888888" />
                </marker>
                <marker id="scene3-arrow-up" viewBox="0 0 10 10" refX="5" refY="0" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 10 L 5 0 L 10 10 z" fill="#888888" />
                </marker>
                <marker id="scene3-arrow-axis" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#000" />
                </marker>
            </defs>

            <!-- Magnetic Field -->
            <g id="scene3-magnetic-field">
                <!-- Will be populated by JS -->
            </g>

            <!-- Electric Field Lines -->
            <g id="scene3-electric-field">
                <!-- Top (downwards) -->
                <line x1="330" y1="50" x2="330" y2="240" class="scene3-efield" marker-end="url(#scene3-arrow-down)" />
                <line x1="430" y1="50" x2="430" y2="240" class="scene3-efield" marker-end="url(#scene3-arrow-down)" />
                <line x1="530" y1="50" x2="530" y2="240" class="scene3-efield" marker-end="url(#scene3-arrow-down)" />
                <line x1="610" y1="50" x2="610" y2="240" class="scene3-efield" marker-end="url(#scene3-arrow-down)" />
                <text x="340" y="120" class="scene3-label" fill="#888888">E</text>
                
                <!-- Bottom (upwards) -->
                <line x1="330" y1="450" x2="330" y2="260" class="scene3-efield" marker-end="url(#scene3-arrow-up)" />
                <line x1="430" y1="450" x2="430" y2="260" class="scene3-efield" marker-end="url(#scene3-arrow-up)" />
                <line x1="530" y1="450" x2="530" y2="260" class="scene3-efield" marker-end="url(#scene3-arrow-up)" />
                <line x1="610" y1="450" x2="610" y2="260" class="scene3-efield" marker-end="url(#scene3-arrow-up)" />
                <text x="340" y="380" class="scene3-label" fill="#888888">E</text>
            </g>

            <!-- Axes -->
            <line x1="150" y1="250" x2="780" y2="250" class="scene3-axis" marker-end="url(#scene3-arrow-axis)" />
            <line x1="650" y1="470" x2="650" y2="30" class="scene3-axis" marker-end="url(#scene3-arrow-axis)" />
            <line x1="250" y1="470" x2="250" y2="30" class="scene3-axis" />
            
            <!-- Axis Labels -->
            <text x="770" y="235" class="scene3-label">x</text>
            <text x="635" y="40" class="scene3-label">y</text>
            <text x="250" y="25" class="scene3-label" text-anchor="middle">x=-2L</text>
            <text x="665" y="235" class="scene3-label">O</text>
            <text x="235" y="265" class="scene3-label">C</text>

            <!-- Paths -->
            <path id="scene3-path-k1" class="scene3-path active" d="M 250 50 Q 350 50 450 250 Q 550 450 650 450" />
            <path id="scene3-path-k2" class="scene3-path inactive" d="M 250 200 Q 300 200 350 250 Q 400 300 450 300 Q 500 300 550 250 Q 600 200 650 200" />
            <path id="scene3-path-k3" class="scene3-path inactive" d="M 250 227.78 Q 283.33 227.78 316.67 250 Q 350 272.22 383.33 272.22 Q 416.67 272.22 450 250 Q 483.33 227.78 516.67 227.78 Q 550 227.78 583.33 250 Q 616.67 272.22 650 272.22" />

            <!-- Path Labels -->
            <text x="230" y="55" class="scene3-label" text-anchor="end">y<tspan dy="4" font-size="10">0</tspan><tspan dy="-4">=L</tspan></text>
            <text x="230" y="195" class="scene3-label" text-anchor="end">y<tspan dy="4" font-size="10">0</tspan><tspan dy="-4">=L/4</tspan></text>
            <text x="230" y="235" class="scene3-label" text-anchor="end">y<tspan dy="4" font-size="10">0</tspan><tspan dy="-4">=L/9</tspan></text>

            <!-- Vertices -->
            <g id="scene3-vertices-k1">
                <circle cx="650" cy="450" r="4" class="scene3-vertex" />
            </g>
            <g id="scene3-vertices-k2" style="opacity: 0; display: none;">
                <circle cx="450" cy="300" r="4" class="scene3-vertex" />
                <circle cx="650" cy="200" r="4" class="scene3-vertex" />
            </g>
            <g id="scene3-vertices-k3" style="opacity: 0; display: none;">
                <circle cx="383.33" cy="272.22" r="4" class="scene3-vertex" />
                <circle cx="516.67" cy="227.78" r="4" class="scene3-vertex" />
                <circle cx="650" cy="272.22" r="4" class="scene3-vertex" />
            </g>
        </svg>

        <div id="scene3-controls">
            <button id="scene3-btn-k1" class="active">k=1 (y₀=L)</button>
            <button id="scene3-btn-k2">k=2 (y₀=L/4)</button>
            <button id="scene3-btn-k3">k=3 (y₀=L/9)</button>
        </div>
    </div>

    <script>
    (function() {
        // Generate magnetic field
        const magGroup = document.getElementById('scene3-magnetic-field');
        const xs = [690, 725, 760];
        const ys = [100, 140, 180, 220, 280, 320, 360, 400];
        
        xs.forEach(x => {
            ys.forEach(y => {
                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('x', x);
                text.setAttribute('y', y);
                text.setAttribute('class', 'scene3-mag');
                text.textContent = '×';
                magGroup.appendChild(text);
            });
        });

        // State management
        const states = [1, 2, 3];
        
        function setState(k) {
            states.forEach(state => {
                const btn = document.getElementById(`scene3-btn-k${state}`);
                const path = document.getElementById(`scene3-path-k${state}`);
                const vertices = document.getElementById(`scene3-vertices-k${state}`);
                
                if (state === k) {
                    btn.classList.add('active');
                    path.classList.remove('inactive');
                    path.classList.add('active');
                    vertices.style.display = 'block';
                    // small delay to allow display:block to apply before opacity transition
                    setTimeout(() => {
                        vertices.style.opacity = '1';
                    }, 10);
                } else {
                    btn.classList.remove('active');
                    path.classList.remove('active');
                    path.classList.add('inactive');
                    vertices.style.opacity = '0';
                    setTimeout(() => {
                        if (vertices.style.opacity === '0') {
                            vertices.style.display = 'none';
                        }
                    }, 300);
                }
            });
        }

        document.getElementById('scene3-btn-k1').addEventListener('click', () => setState(1));
        document.getElementById('scene3-btn-k2').addEventListener('click', () => setState(2));
        document.getElementById('scene3-btn-k3').addEventListener('click', () => setState(3));
    })();
    </script>
</body>
</html>
