<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button:hover:not(:disabled) { background: #e9e9e9; }
        .math { font-family: 'Times New Roman', Times, serif; font-style: italic; }
        
        /* SVG Elements */
        .efield { stroke: #000000; stroke-width: 1; }
        .track { stroke: #000000; stroke-width: 3; fill: none; }
        .block { fill: #ff00ff; stroke: #000000; stroke-width: 1.5; }
        .block-ghost { fill: none; stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4,4; }
        .force { stroke: #c62828; stroke-width: 2; }
        .velocity { stroke: #1565c0; stroke-width: 2; }
        .trajectory { stroke: #1565c0; stroke-width: 7; opacity: 0.3; fill: none; }
        .dim-line { stroke: #2e7d32; stroke-width: 1.5; }
        .dim-bound { stroke: #888888; stroke-width: 1; stroke-dasharray: 4,4; }
        .text-label { font-size: 16px; fill: #000; user-select: none; }
        .text-force { font-size: 16px; fill: #c62828; user-select: none; }
        .text-velocity { font-size: 16px; fill: #1565c0; user-select: none; }
        .text-dim { font-size: 16px; fill: #2e7d32; user-select: none; }
        
        /* Step visibility */
        .step-el { transition: opacity 0.3s; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <defs>
                <marker id="arrow-efield" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 10 0 L 0 5 L 10 10 z" fill="#000000" />
                </marker>
                <marker id="arrow-force" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828" />
                </marker>
                <marker id="arrow-velocity" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0" />
                </marker>
                <marker id="arrow-dim-start" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 10 0 L 0 5 L 10 10 z" fill="#2e7d32" />
                </marker>
                <marker id="arrow-dim-end" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32" />
                </marker>
            </defs>

            <!-- Step 0: Base Elements -->
            <g id="scene1-step0">
                <!-- Electric Field Lines -->
                <line x1="750" y1="70" x2="50" y2="70" class="efield" marker-end="url(#arrow-efield)" />
                <line x1="750" y1="120" x2="50" y2="120" class="efield" marker-end="url(#arrow-efield)" />
                <line x1="750" y1="170" x2="50" y2="170" class="efield" marker-end="url(#arrow-efield)" />
                <line x1="750" y1="220" x2="50" y2="220" class="efield" marker-end="url(#arrow-efield)" />
                <line x1="750" y1="270" x2="50" y2="270" class="efield" marker-end="url(#arrow-efield)" />
                <line x1="750" y1="320" x2="50" y2="320" class="efield" marker-end="url(#arrow-efield)" />
                <text x="80" y="55" class="text-label math">E</text>

                <!-- Track -->
                <line x1="300" y1="320" x2="700" y2="320" class="track" />
                <!-- Split track arc to avoid bounding box overlap with R -->
                <path d="M 300 320 A 100 100 0 0 1 229.3 290.7" class="track" />
                <path d="M 229.3 290.7 A 100 100 0 0 1 200 220" class="track" />
                <path d="M 200 220 A 100 100 0 0 1 229.3 149.3" class="track" />
                <path d="M 229.3 149.3 A 100 100 0 0 1 300 120" class="track" />
                
                <!-- Labels -->
                <text x="650" y="340" class="text-label math" text-anchor="middle">M</text>
                <text x="300" y="340" class="text-label math" text-anchor="middle">N</text>
                <text x="185" y="240" class="text-label math" text-anchor="end">P</text>
                <text x="300" y="100" class="text-label math" text-anchor="middle">L</text>
                
                <!-- Center O and Radius -->
                <circle cx="300" cy="220" r="2" fill="#000" />
                <text x="310" y="215" class="text-label math">O</text>
                <!-- Split dashed line to avoid bounding box overlap with R -->
                <line x1="300" y1="220" x2="280" y2="240" stroke="#000" stroke-width="1" stroke-dasharray="4,4" />
                <line x1="250" y1="270" x2="229.3" y2="290.7" stroke="#000" stroke-width="1" stroke-dasharray="4,4" />
                <text x="265" y="260" class="text-label math" text-anchor="middle">R</text>

                <!-- Block M -->
                <rect x="640" y="300" width="20" height="20" class="block" />
                <text x="670" y="300" class="text-label math">m</text>
            </g>

            <!-- Step 1: L point critical condition -->
            <g id="scene1-step1" class="step-el" style="opacity: 0; display: none;">
                <!-- Block L -->
                <rect x="290" y="120" width="20" height="20" class="block" />
                <text x="330" y="110" class="text-label math">N=0</text>
                
                <!-- Forces and Velocity -->
                <line x1="300" y1="130" x2="300" y2="190" class="force" marker-end="url(#arrow-force)" />
                <text x="315" y="165" class="text-force math">mg</text>
                
                <line x1="300" y1="130" x2="240" y2="130" class="velocity" marker-end="url(#arrow-velocity)" />
                <text x="250" y="115" class="text-velocity math">v_L</text>
            </g>

            <!-- Step 2: M to L work-energy -->
            <g id="scene1-step2" class="step-el" style="opacity: 0; display: none;">
                <!-- Trajectory M to L (split to avoid bounding box overlap) -->
                <line x1="650" y1="310" x2="300" y2="310" class="trajectory" />
                <path d="M 300 310 A 90 90 0 0 1 236.4 283.6" class="trajectory" />
                <path d="M 236.4 283.6 A 90 90 0 0 1 210 220" class="trajectory" />
                <path d="M 210 220 A 90 90 0 0 1 236.4 156.4" class="trajectory" />
                <path d="M 236.4 156.4 A 90 90 0 0 1 300 130" class="trajectory" />
                
                <!-- Ghost Block MN -->
                <rect x="490" y="300" width="20" height="20" class="block-ghost" />
                
                <!-- Forces on Ghost Block -->
                <line x1="500" y1="310" x2="440" y2="310" class="force" marker-end="url(#arrow-force)" />
                <text x="440" y="290" class="text-force math">qE</text>
                
                <line x1="500" y1="310" x2="550" y2="310" class="force" marker-end="url(#arrow-force)" />
                <text x="550" y="290" class="text-force math">f</text>
                
                <!-- Displacements -->
                <!-- S -->
                <line x1="300" y1="330" x2="300" y2="390" class="dim-bound" />
                <line x1="650" y1="330" x2="650" y2="390" class="dim-bound" />
                <line x1="300" y1="380" x2="650" y2="380" class="dim-line" marker-start="url(#arrow-dim-start)" marker-end="url(#arrow-dim-end)" />
                <text x="475" y="370" class="text-dim math" text-anchor="middle">S</text>
                
                <!-- 2R -->
                <line x1="310" y1="120" x2="390" y2="120" class="dim-bound" />
                <line x1="310" y1="320" x2="390" y2="320" class="dim-bound" />
                <line x1="380" y1="120" x2="380" y2="320" class="dim-line" marker-start="url(#arrow-dim-start)" marker-end="url(#arrow-dim-end)" />
                <text x="400" y="215" class="text-dim math">2R</text>
            </g>

            <!-- Step 3: P point forces -->
            <g id="scene1-step3" class="step-el" style="opacity: 0; display: none;">
                <!-- Block P -->
                <rect x="200" y="210" width="20" height="20" class="block" />
                
                <!-- Forces and Velocity -->
                <line x1="210" y1="220" x2="270" y2="220" class="force" marker-end="url(#arrow-force)" />
                <text x="250" y="205" class="text-force math">N_P</text>
                
                <line x1="210" y1="220" x2="150" y2="220" class="force" marker-end="url(#arrow-force)" />
                <text x="140" y="210" class="text-force math">qE</text>
                
                <line x1="210" y1="220" x2="210" y2="160" class="velocity" marker-end="url(#arrow-velocity)" />
                <text x="225" y="165" class="text-velocity math">v_P</text>
            </g>

            <!-- Step 4: M to P work-energy -->
            <g id="scene1-step4" class="step-el" style="opacity: 0; display: none;">
                <!-- Trajectory M to P (split to avoid bounding box overlap) -->
                <line x1="650" y1="310" x2="300" y2="310" class="trajectory" />
                <path d="M 300 310 A 90 90 0 0 1 236.4 283.6" class="trajectory" />
                <path d="M 236.4 283.6 A 90 90 0 0 1 210 220" class="trajectory" />
                
                <!-- Displacements -->
                <!-- S+R -->
                <line x1="200" y1="230" x2="200" y2="430" class="dim-bound" />
                <line x1="650" y1="390" x2="650" y2="430" class="dim-bound" />
                <line x1="200" y1="420" x2="650" y2="420" class="dim-line" marker-start="url(#arrow-dim-start)" marker-end="url(#arrow-dim-end)" />
                <text x="425" y="410" class="text-dim math" text-anchor="middle">S+R</text>
                
                <!-- R -->
                <line x1="220" y1="220" x2="390" y2="220" class="dim-bound" />
                <line x1="380" y1="220" x2="380" y2="320" class="dim-line" marker-start="url(#arrow-dim-start)" marker-end="url(#arrow-dim-end)" />
                <text x="400" y="265" class="text-dim math">R</text>
            </g>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 4;
        
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        
        const steps = [
            [], // Step 0: Base only
            ['scene1-step1'], // Step 1
            ['scene1-step1', 'scene1-step2'], // Step 2
            ['scene1-step3'], // Step 3
            ['scene1-step3', 'scene1-step4'] // Step 4
        ];
        
        function updateScene() {
            // Hide all step elements first
            for (let i = 1; i <= maxStep; i++) {
                const el1 = document.getElementById(`scene1-step${i}`);
                if (el1) {
                    el1.style.opacity = '0';
                    setTimeout(() => {
                        if (steps[currentStep].indexOf(`scene1-step${i}`) === -1) {
                            el1.style.display = 'none';
                        }
                    }, 300);
                }
            }
            
            // Show current step elements
            steps[currentStep].forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.style.display = 'block';
                    // Trigger reflow
                    void el.offsetWidth;
                    el.style.opacity = '1';
                }
            });
            
            // Update buttons
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
            
            // Render MathJax if needed
            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }
        
        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });
        
        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });
        
        // Initial setup
        updateScene();
    })();
    </script>
</body>
</html>
