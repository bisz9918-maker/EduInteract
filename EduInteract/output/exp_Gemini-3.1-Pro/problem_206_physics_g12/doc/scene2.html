<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .step-group { transition: opacity 0.3s ease; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500">
            <!-- Step 0: Base -->
            <g id="scene2-step0" class="step-group">
                <!-- Axes -->
                <line x1="100" y1="400" x2="100" y2="50" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
                <line x1="100" y1="400" x2="750" y2="400" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
                <text x="90" y="415" font-size="14" text-anchor="end">0</text>
                <text x="80" y="60" font-size="14" text-anchor="end">v</text>
                <text x="740" y="420" font-size="14" text-anchor="middle">t</text>
                
                <!-- Legend -->
                <line x1="655" y1="90" x2="675" y2="90" stroke="#c62828" stroke-width="3" />
                <text x="685" y="95" font-size="14">A球</text>
                <line x1="655" y1="130" x2="675" y2="130" stroke="#1565c0" stroke-width="3" />
                <text x="685" y="135" font-size="14">B球</text>
            </g>

            <!-- Step 1 -->
            <g id="scene2-step1" class="step-group" style="opacity: 0; display: none;">
                <!-- Scales and Guides -->
                <text x="180" y="420" font-size="14" text-anchor="middle">t<tspan baseline-shift="sub" font-size="0.8em">1</tspan></text>
                <text x="75" y="345" font-size="14" text-anchor="end">v<tspan baseline-shift="sub" font-size="0.8em">1</tspan></text>
                <line x1="180" y1="400" x2="180" y2="340" stroke="#888" stroke-width="1" stroke-dasharray="4,4" />
                <line x1="100" y1="340" x2="180" y2="340" stroke="#888" stroke-width="1" stroke-dasharray="4,4" />
                
                <!-- Areas -->
                <polygon points="100,400 180,400 180,340" fill="#c62828" fill-opacity="0.2" />
                <text x="140" y="330" font-size="16" font-weight="bold" text-anchor="middle">L</text>
                
                <!-- Lines -->
                <line x1="100" y1="400" x2="180" y2="340" stroke="#c62828" stroke-width="3" />
                <line x1="100" y1="400" x2="180" y2="400" stroke="#1565c0" stroke-width="3" />
            </g>

            <!-- Step 2 -->
            <g id="scene2-step2" class="step-group" style="opacity: 0; display: none;">
                <!-- Scales and Guides -->
                <text x="340" y="420" font-size="14" text-anchor="middle">3t<tspan baseline-shift="sub" font-size="0.8em">1</tspan></text>
                <text x="75" y="285" font-size="14" text-anchor="end">2v<tspan baseline-shift="sub" font-size="0.8em">1</tspan></text>
                <line x1="340" y1="400" x2="340" y2="280" stroke="#888" stroke-width="1" stroke-dasharray="4,4" />
                <line x1="100" y1="280" x2="340" y2="280" stroke="#888" stroke-width="1" stroke-dasharray="4,4" />
                
                <!-- Areas -->
                <polygon points="180,400 340,400 340,280" fill="#c62828" fill-opacity="0.2" />
                <polygon points="180,400 340,400 340,340 180,340" fill="#1565c0" fill-opacity="0.2" />
                <text x="260" y="270" font-size="16" font-weight="bold" text-anchor="middle">4L</text>
                
                <!-- Lines -->
                <line x1="180" y1="400" x2="340" y2="280" stroke="#c62828" stroke-width="3" />
                <line x1="180" y1="340" x2="340" y2="340" stroke="#1565c0" stroke-width="3" />
            </g>

            <!-- Step 3 -->
            <g id="scene2-step3" class="step-group" style="opacity: 0; display: none;">
                <!-- Scales and Guides -->
                <text x="500" y="420" font-size="14" text-anchor="middle">5t<tspan baseline-shift="sub" font-size="0.8em">1</tspan></text>
                <text x="75" y="225" font-size="14" text-anchor="end">3v<tspan baseline-shift="sub" font-size="0.8em">1</tspan></text>
                <line x1="500" y1="400" x2="500" y2="220" stroke="#888" stroke-width="1" stroke-dasharray="4,4" />
                <line x1="100" y1="220" x2="500" y2="220" stroke="#888" stroke-width="1" stroke-dasharray="4,4" />
                
                <!-- Areas -->
                <polygon points="340,400 500,400 500,220 340,340" fill="#c62828" fill-opacity="0.2" />
                <polygon points="340,400 500,400 500,280 340,280" fill="#1565c0" fill-opacity="0.2" />
                <text x="420" y="210" font-size="16" font-weight="bold" text-anchor="middle">8L</text>
                
                <!-- Lines -->
                <line x1="340" y1="340" x2="500" y2="220" stroke="#c62828" stroke-width="3" />
                <line x1="340" y1="280" x2="500" y2="280" stroke="#1565c0" stroke-width="3" />
            </g>

            <!-- Step 4 -->
            <g id="scene2-step4" class="step-group" style="opacity: 0; display: none;">
                <!-- Scales and Guides -->
                <text x="660" y="420" font-size="14" text-anchor="middle">7t<tspan baseline-shift="sub" font-size="0.8em">1</tspan></text>
                <text x="75" y="165" font-size="14" text-anchor="end">4v<tspan baseline-shift="sub" font-size="0.8em">1</tspan></text>
                <line x1="660" y1="400" x2="660" y2="160" stroke="#888" stroke-width="1" stroke-dasharray="4,4" />
                <line x1="100" y1="160" x2="660" y2="160" stroke="#888" stroke-width="1" stroke-dasharray="4,4" />
                
                <!-- Areas -->
                <polygon points="500,400 660,400 660,160 500,280" fill="#c62828" fill-opacity="0.2" />
                <polygon points="500,400 660,400 660,220 500,220" fill="#1565c0" fill-opacity="0.2" />
                <text x="580" y="150" font-size="16" font-weight="bold" text-anchor="middle">12L</text>
                
                <!-- Lines -->
                <line x1="500" y1="280" x2="660" y2="160" stroke="#c62828" stroke-width="3" />
                <line x1="500" y1="220" x2="660" y2="220" stroke="#1565c0" stroke-width="3" />
                
                <!-- Formula -->
                <g transform="translate(150, 60)">
                    <text x="0" y="0" font-size="16" font-weight="bold">第 n 次碰撞 (n≥2):</text>
                    <text x="0" y="45" font-size="16">碰撞时刻: t = (2n-1)t<tspan baseline-shift="sub" font-size="0.8em">1</tspan></text>
                    <text x="0" y="90" font-size="16">该段位移: Δx = 4(n-1)L</text>
                    <text x="0" y="135" font-size="16">总位移: x = (2n²-2n+1)L</text>
                </g>
            </g>

            <defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#000" />
                </marker>
            </defs>
        </svg>
        <div id="scene2-controls">
            <button id="scene2-prevBtn" disabled>◀ 上一步</button>
            <button id="scene2-nextBtn">下一步 ▶</button>
        </div>
    </div>
    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 4;
        const prevBtn = document.getElementById('scene2-prevBtn');
        const nextBtn = document.getElementById('scene2-nextBtn');
        
        function updateScene() {
            for (let i = 1; i <= maxStep; i++) {
                const el = document.getElementById(`scene2-step${i}`);
                if (i <= currentStep) {
                    el.style.display = 'block';
                    // Small delay to allow display:block to apply before changing opacity
                    setTimeout(() => {
                        el.style.opacity = '1';
                    }, 10);
                } else {
                    el.style.opacity = '0';
                    setTimeout(() => {
                        if (i > currentStep) el.style.display = 'none';
                    }, 300);
                }
            }
            
            prevBtn.disabled = currentStep === 0;
            nextBtn.disabled = currentStep === maxStep;
        }
        
        prevBtn.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });
        
        nextBtn.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });
        
        // Initialize
        updateScene();
    })();
    </script>
</body>
</html>
