<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .step-indicator { font-size: 14px; color: #333; min-width: 60px; text-align: center; }
        
        /* SVG Elements */
        .transition-transform { transition: transform 1s ease; }
        .transition-opacity { transition: opacity 0.5s ease, visibility 0.5s ease; }
        
        .ground { stroke: #000; stroke-width: 2; }
        .block-b { fill: #f5f5f5; stroke: #000; stroke-width: 1.5; }
        .block-a { fill: #e0e0e0; stroke: #000; stroke-width: 1.5; }
        .vector-v { stroke: #1565c0; stroke-width: 2; fill: none; }
        .vector-f { stroke: #c62828; stroke-width: 2; fill: none; }
        .text-v { fill: #1565c0; font-size: 14px; font-style: italic; }
        .text-f { fill: #c62828; font-size: 14px; font-style: italic; }
        .text-label { fill: #000; font-size: 14px; }
        
        .dash-line { stroke: #888; stroke-width: 1.5; stroke-dasharray: 5,5; }
        .text-alert { fill: #c62828; font-size: 14px; font-weight: bold; }
        
        .dim-arrow-b { stroke: #1565c0; stroke-width: 1.5; fill: none; }
        .dim-arrow-l { stroke: #2e7d32; stroke-width: 1.5; fill: none; }
        .dim-arrow-a { stroke: #1565c0; stroke-width: 1.5; fill: none; }
        .dim-text-b { fill: #1565c0; font-size: 14px; }
        .dim-text-l { fill: #2e7d32; font-size: 14px; }
        .dim-text-a { fill: #1565c0; font-size: 14px; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" id="scene2-svg">
            <defs>
                <marker id="scene2-arrow-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0" />
                </marker>
                <marker id="scene2-arrow-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828" />
                </marker>
                <marker id="scene2-arrow-dim-b-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 10 0 L 0 5 L 10 10 z" fill="#1565c0" />
                </marker>
                <marker id="scene2-arrow-dim-b-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0" />
                </marker>
                <marker id="scene2-arrow-dim-l-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 10 0 L 0 5 L 10 10 z" fill="#2e7d32" />
                </marker>
                <marker id="scene2-arrow-dim-l-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32" />
                </marker>
                <marker id="scene2-arrow-dim-a-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 10 0 L 0 5 L 10 10 z" fill="#1565c0" />
                </marker>
                <marker id="scene2-arrow-dim-a-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0" />
                </marker>
            </defs>

            <!-- Ground -->
            <line x1="50" y1="250" x2="750" y2="250" class="ground" />

            <!-- Step 4: Vertical dashed lines -->
            <g id="scene2-step4-lines" class="transition-opacity" style="opacity: 0; visibility: hidden;">
                <line x1="200" y1="250" x2="200" y2="380" class="dash-line" />
                <line x1="320" y1="250" x2="320" y2="380" class="dash-line" />
                <line x1="560" y1="250" x2="560" y2="380" class="dash-line" />
            </g>

            <!-- Step 4: Dimensions -->
            <g id="scene2-step4-dims" class="transition-opacity" style="opacity: 0; visibility: hidden;">
                <!-- xB -->
                <line x1="200" y1="300" x2="320" y2="300" class="dim-arrow-b" marker-start="url(#scene2-arrow-dim-b-start)" marker-end="url(#scene2-arrow-dim-b-end)" />
                <text x="260" y="290" class="dim-text-b" text-anchor="middle">x_B</text>
                <!-- L -->
                <line x1="320" y1="300" x2="560" y2="300" class="dim-arrow-l" marker-start="url(#scene2-arrow-dim-l-start)" marker-end="url(#scene2-arrow-dim-l-end)" />
                <text x="440" y="290" class="dim-text-l" text-anchor="middle">L = 3m</text>
                <!-- xA -->
                <line x1="200" y1="340" x2="560" y2="340" class="dim-arrow-a" marker-start="url(#scene2-arrow-dim-a-start)" marker-end="url(#scene2-arrow-dim-a-end)" />
                <text x="380" y="330" class="dim-text-a" text-anchor="middle">x_A</text>
            </g>

            <!-- Step 1: Hypothesis A shadow -->
            <g id="scene2-step1-shadow" class="transition-opacity" style="opacity: 0; visibility: hidden;">
                <line x1="210" y1="170" x2="498" y2="170" class="dash-line" />
                <text x="354" y="160" class="dash-line" style="stroke:none; fill:#888; font-size:14px;" text-anchor="middle">3.6m</text>
                <text x="498" y="140" class="text-alert" text-anchor="middle">3.6m > 3m, 滑出木板!</text>
            </g>

            <!-- Block B Group -->
            <g id="scene2-group-b" class="transition-transform" transform="translate(0,0)">
                <rect x="200" y="220" width="240" height="30" class="block-b" />
                <text x="455" y="240" class="text-label" dominant-baseline="middle">B</text>
                
                <!-- Step 2: Forces on B -->
                <g id="scene2-step2-forces-b" class="transition-opacity" style="opacity: 0; visibility: hidden;">
                    <line x1="250" y1="210" x2="300" y2="210" class="vector-f" marker-end="url(#scene2-arrow-f)" />
                    <text x="275" y="200" class="text-f" text-anchor="middle">f_1'</text>
                    
                    <line x1="250" y1="265" x2="200" y2="265" class="vector-f" marker-end="url(#scene2-arrow-f)" />
                    <text x="225" y="280" class="text-f" text-anchor="middle">f_2</text>
                </g>
            </g>

            <!-- Block A Group -->
            <g id="scene2-group-a" class="transition-transform" transform="translate(0,0)">
                <rect x="200" y="190" width="20" height="30" class="block-a" id="scene2-rect-a" />
                <text x="210" y="180" class="text-label" text-anchor="middle">A</text>
                
                <!-- Step 0: Initial velocity -->
                <g id="scene2-step0-v1" class="transition-opacity" style="opacity: 1; visibility: visible;">
                    <line x1="220" y1="205" x2="270" y2="205" class="vector-v" marker-end="url(#scene2-arrow-v)" />
                    <text x="245" y="195" class="text-v" text-anchor="middle">v_1</text>
                </g>
                
                <!-- Step 1 & 2: Force on A -->
                <g id="scene2-step1-force-a" class="transition-opacity" style="opacity: 0; visibility: hidden;">
                    <line x1="200" y1="205" x2="150" y2="205" class="vector-f" marker-end="url(#scene2-arrow-f)" />
                    <text x="175" y="195" class="text-f" text-anchor="middle">f_1</text>
                </g>
                
                <!-- Step 3: Final velocity -->
                <g id="scene2-step3-v-common" class="transition-opacity" style="opacity: 0; visibility: hidden;">
                    <line x1="220" y1="205" x2="270" y2="205" class="vector-v" marker-end="url(#scene2-arrow-v)" />
                    <text x="245" y="195" class="text-v" text-anchor="middle">v_{共}</text>
                </g>
            </g>
        </svg>

        <div id="scene2-controls">
            <button id="scene2-btn-prev" disabled>◀ 上一步</button>
            <div class="step-indicator" id="scene2-step-text">1 / 5</div>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 4;
        
        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        const stepText = document.getElementById('scene2-step-text');
        
        const groupA = document.getElementById('scene2-group-a');
        const groupB = document.getElementById('scene2-group-b');
        const rectA = document.getElementById('scene2-rect-a');
        
        const step0V1 = document.getElementById('scene2-step0-v1');
        const step1Shadow = document.getElementById('scene2-step1-shadow');
        const step1ForceA = document.getElementById('scene2-step1-force-a');
        const step2ForcesB = document.getElementById('scene2-step2-forces-b');
        const step3VCommon = document.getElementById('scene2-step3-v-common');
        const step4Lines = document.getElementById('scene2-step4-lines');
        const step4Dims = document.getElementById('scene2-step4-dims');
        
        function setOpacity(el, val) {
            el.style.opacity = val;
            el.style.visibility = val === 0 ? 'hidden' : 'visible';
        }
        
        function setTransform(el, tx) {
            el.style.transform = `translate(${tx}px, 0)`;
        }

        function renderStep(step) {
            stepText.textContent = `${step + 1} / ${maxStep + 1}`;
            btnPrev.disabled = step === 0;
            btnNext.disabled = step === maxStep;
            
            // Reset all
            setOpacity(step0V1, 0);
            setOpacity(step1Shadow, 0);
            setOpacity(step1ForceA, 0);
            setOpacity(step2ForcesB, 0);
            setOpacity(step3VCommon, 0);
            setOpacity(step4Lines, 0);
            setOpacity(step4Dims, 0);
            
            setTransform(groupA, 0);
            setTransform(groupB, 0);
            rectA.style.opacity = 1;
            
            if (step === 0) {
                setOpacity(step0V1, 1);
            } 
            else if (step === 1) {
                setOpacity(step1ForceA, 1);
                setOpacity(step1Shadow, 1);
                setTransform(groupA, 288);
                rectA.style.opacity = 0.5;
            }
            else if (step === 2) {
                setOpacity(step1ForceA, 1);
                setOpacity(step2ForcesB, 1);
                setTransform(groupA, 0);
            }
            else if (step === 3) {
                setTransform(groupA, 340);
                setTransform(groupB, 120);
                setOpacity(step3VCommon, 1);
            }
            else if (step === 4) {
                setTransform(groupA, 340);
                setTransform(groupB, 120);
                setOpacity(step3VCommon, 1);
                setOpacity(step4Lines, 1);
                setOpacity(step4Dims, 1);
            }
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                renderStep(currentStep);
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                renderStep(currentStep);
            }
        });

        // Initial render
        renderStep(0);
        
        // Render subscripts
        const fixSubscripts = () => {
            const texts = document.querySelectorAll('text');
            texts.forEach(t => {
                if(t.textContent.includes('_')) {
                    const parts = t.textContent.split('_');
                    if(parts.length === 2) {
                        let sub = parts[1];
                        let rest = '';
                        if(sub.startsWith('{') && sub.includes('}')) {
                            rest = sub.substring(sub.indexOf('}')+1);
                            sub = sub.substring(1, sub.indexOf('}'));
                        }
                        t.innerHTML = `${parts[0]}<tspan dy="4" font-size="10">${sub}</tspan><tspan dy="-4">${rest}</tspan>`;
                    }
                }
            });
        };
        fixSubscripts();
    })();
    </script>
</body>
</html>
