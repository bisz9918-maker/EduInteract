<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二次函数综合分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-step-text { font-size: 14px; font-weight: bold; min-width: 120px; text-align: center; }
        
        /* SVG Elements */
        .axis { stroke: #000; stroke-width: 1.5; }
        .curve { fill: none; stroke: #000; stroke-width: 2; }
        .point { fill: #000; }
        .label { font-size: 16px; fill: #000; }
        .line { stroke: #000; stroke-width: 1.5; }
        
        /* Step 1 */
        .step1-highlight { stroke: #1565c0; stroke-width: 3; }
        .step1-text { fill: #1565c0; font-size: 16px; font-weight: bold; }
        
        /* Step 2 */
        .step2-highlight { stroke: #c62828; stroke-width: 3; }
        .step2-fill { fill: #c62828; opacity: 0.2; }
        .step2-text { fill: #c62828; font-size: 16px; font-weight: bold; }
        
        /* Step 3 */
        .step3-highlight { stroke: #2e7d32; stroke-width: 3; }
        .step3-dash { stroke: #2e7d32; stroke-width: 1.5; stroke-dasharray: 5,5; }
        .step3-text { fill: #2e7d32; font-size: 16px; font-weight: bold; }
        
        /* Step 4 */
        .step4-highlight { stroke: #1565c0; stroke-width: 3; }
        .step4-dash { stroke: #888888; stroke-width: 1.5; stroke-dasharray: 5,5; }
        .step4-text { fill: #1565c0; font-size: 16px; font-weight: bold; }
        
        /* Transitions */
        .animatable { transition: opacity 0.3s ease; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <!-- Definitions -->
            <defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#000" />
                </marker>
                <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0" />
                </marker>
            </defs>

            <!-- Base Coordinate System -->
            <g id="scene1-base">
                <line class="axis" x1="100" y1="200" x2="700" y2="200" marker-end="url(#arrow)" />
                <line class="axis" x1="400" y1="430" x2="400" y2="50" marker-end="url(#arrow)" />
                <text class="label" x="690" y="180">x</text>
                <text class="label" x="380" y="40">y</text>
                <text class="label" x="380" y="185">O</text>
                <circle class="point" cx="400" cy="200" r="4" />
                
                <!-- Parabola -->
                <path id="scene1-parabola" class="curve" d="" />
                
                <!-- Line BC -->
                <line class="line" x1="400" y1="350" x2="550" y2="200" />
                
                <!-- Points A, B, C -->
                <circle class="point" cx="350" cy="200" r="4" />
                <circle class="point" cx="550" cy="200" r="4" />
                <circle class="point" cx="400" cy="350" r="4" />
                
                <!-- Dynamic Labels for A, B, C -->
                <text id="scene1-label-A" class="label" x="330" y="185">A</text>
                <text id="scene1-label-B" class="label" x="560" y="185">B</text>
                <text id="scene1-label-C" class="label" x="370" y="365">C</text>
            </g>

            <!-- Step 1: AB = 4 -->
            <g id="scene1-step1" class="animatable" style="opacity: 0; display: none;">
                <line class="step1-highlight" x1="350" y1="200" x2="550" y2="200" />
                <circle class="point" cx="350" cy="200" r="4" fill="#1565c0" />
                <circle class="point" cx="550" cy="200" r="4" fill="#1565c0" />
                <!-- Dimension line -->
                <line class="step1-highlight" x1="350" y1="170" x2="550" y2="170" />
                <line class="step1-highlight" x1="350" y1="165" x2="350" y2="175" />
                <line class="step1-highlight" x1="550" y1="165" x2="550" y2="175" />
                <text class="step1-text" x="445" y="160">4</text>
            </g>

            <!-- Step 2: Angle ABC = 45 -->
            <g id="scene1-step2" class="animatable" style="opacity: 0; display: none;">
                <polygon class="step2-fill" points="400,200 550,200 400,350" />
                <line class="step2-highlight" x1="400" y1="200" x2="550" y2="200" />
                <line class="step2-highlight" x1="400" y1="200" x2="400" y2="350" />
                <!-- Right angle -->
                <polyline class="step2-highlight" points="400,215 415,215 415,200" fill="none" />
                <!-- 45 deg arc -->
                <path class="step2-highlight" d="M 520 200 A 30 30 0 0 0 528.7 221.2" fill="none" />
                <text class="step2-text" x="500" y="235">45°</text>
                <text class="step2-text" x="470" y="190">3</text>
                <text class="step2-text" x="385" y="280">3</text>
            </g>

            <!-- Step 3: 0 < x < 2 => -4 <= y < -3 -->
            <g id="scene1-step3" class="animatable" style="opacity: 0; display: none;">
                <!-- Highlight x axis (0,2) -->
                <line class="step3-highlight" x1="400" y1="200" x2="500" y2="200" />
                <!-- Highlight y axis [-4,-3) -->
                <line class="step3-highlight" x1="400" y1="350" x2="400" y2="400" />
                <!-- Highlight curve -->
                <path id="scene1-curve-step3" class="step3-highlight" fill="none" d="" />
                <!-- Projection lines -->
                <line class="step3-dash" x1="450" y1="200" x2="450" y2="400" />
                <line class="step3-dash" x1="400" y1="400" x2="450" y2="400" />
                <line class="step3-dash" x1="500" y1="200" x2="500" y2="350" />
                <line class="step3-dash" x1="400" y1="350" x2="500" y2="350" />
                
                <!-- Points V, D -->
                <circle class="point" cx="450" cy="400" r="4" fill="#2e7d32" />
                <circle class="point" cx="500" cy="350" r="4" fill="#2e7d32" />
                <text class="step3-text" x="420" y="420">V(1,-4)</text>
                <text class="step3-text" x="510" y="365">D(2,-3)</text>
            </g>

            <!-- Step 4: x > 1 => y increases -->
            <g id="scene1-step4" class="animatable" style="opacity: 0; display: none;">
                <!-- Symmetry axis -->
                <line class="step4-dash" x1="450" y1="80" x2="450" y2="430" />
                <text class="step4-text" x="460" y="90" fill="#888888">x=1</text>
                
                <!-- Highlight curve x > 1 -->
                <path id="scene1-curve-step4" class="step4-highlight" fill="none" d="" />
                
                <!-- Animated arrow -->
                <g id="scene1-arrow-group">
                    <path d="M -10 0 L 0 0" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow-blue)" />
                    <animateMotion id="scene1-anim-motion" dur="2s" repeatCount="indefinite" rotate="auto">
                        <mpath href="#scene1-curve-step4" />
                    </animateMotion>
                </g>
                
                <text class="step4-text" x="550" y="100">y随x增大而增大</text>
            </g>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <div id="scene1-step-text">初始状态</div>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Coordinate mapping
        function sx(x) { return 400 + x * 50; }
        function sy(y) { return 200 - y * 50; }
        
        // Generate parabola path
        function generateParabolaPath(xStart, xEnd) {
            let d = "";
            for (let x = xStart; x <= xEnd; x += 0.1) {
                let y = x * x - 2 * x - 3;
                let px = sx(x);
                let py = sy(y);
                if (x === xStart) {
                    d += `M ${px} ${py} `;
                } else {
                    d += `L ${px} ${py} `;
                }
            }
            return d;
        }

        // Set paths
        document.getElementById('scene1-parabola').setAttribute('d', generateParabolaPath(-2.2, 4.2));
        document.getElementById('scene1-curve-step3').setAttribute('d', generateParabolaPath(0, 2));
        document.getElementById('scene1-curve-step4').setAttribute('d', generateParabolaPath(1, 4.2));

        let currentStep = 0;
        const maxStep = 4;
        
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepText = document.getElementById('scene1-step-text');
        
        const labelA = document.getElementById('scene1-label-A');
        const labelB = document.getElementById('scene1-label-B');
        const labelC = document.getElementById('scene1-label-C');
        
        const stepTexts = [
            "初始状态",
            "步骤 1/4: 结论①",
            "步骤 2/4: 结论②",
            "步骤 3/4: 结论③",
            "步骤 4/4: 结论④"
        ];

        function show(el) {
            el.style.display = '';
            // trigger reflow
            void el.offsetWidth;
            el.style.opacity = '1';
        }

        function hide(el) {
            el.style.opacity = '0';
            setTimeout(() => {
                if (el.style.opacity === '0') {
                    el.style.display = 'none';
                }
            }, 300);
        }

        function updateScene() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
            stepText.textContent = stepTexts[currentStep];
            
            // Reset labels
            labelA.textContent = "A";
            labelA.setAttribute("x", "330");
            labelA.setAttribute("y", "185");
            
            labelB.textContent = "B";
            labelB.setAttribute("x", "560");
            labelB.setAttribute("y", "185");
            
            labelC.textContent = "C";
            labelC.setAttribute("x", "370");
            labelC.setAttribute("y", "365");

            // Hide all steps
            for (let i = 1; i <= 4; i++) {
                const el = document.getElementById(`scene1-step${i}`);
                if (i === currentStep) {
                    show(el);
                } else {
                    hide(el);
                }
            }

            // Step specific label updates
            if (currentStep >= 1) {
                labelA.textContent = "A(-1,0)";
                labelA.setAttribute("x", "290");
                labelA.setAttribute("y", "185");
                
                labelB.textContent = "B(3,0)";
                labelB.setAttribute("x", "560");
                labelB.setAttribute("y", "185");
            }
            
            if (currentStep >= 3) {
                labelC.textContent = "C(0,-3)";
                labelC.setAttribute("x", "320");
                labelC.setAttribute("y", "365");
            }
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });

        // Init
        updateScene();
    })();
    </script>
</body>
</html>
