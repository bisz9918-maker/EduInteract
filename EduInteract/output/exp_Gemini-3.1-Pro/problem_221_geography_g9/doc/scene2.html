<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisualSolver Scene 2</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button:hover:not(:disabled) { background: #e9e9e9; }
        
        .step-element { transition: opacity 0.4s ease; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500">
            <defs>
                <marker id="scene2-arrow-sun" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#fbc02d" />
                </marker>
                <marker id="scene2-arrow-rot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
                </marker>
            </defs>

            <!-- Step 0: Base elements -->
            <g id="scene2-step0" class="step-element">
                <!-- Sun rays -->
                <g stroke="#fbc02d" stroke-width="2" marker-end="url(#scene2-arrow-sun)">
                    <line x1="50" y1="150" x2="150" y2="150" />
                    <line x1="50" y1="250" x2="150" y2="250" />
                    <line x1="50" y1="350" x2="150" y2="350" />
                </g>
                <text x="100" y="130" fill="#fbc02d" font-size="16" text-anchor="middle">太阳光</text>

                <!-- Earth -->
                <!-- Day hemisphere -->
                <path d="M 400 100 A 150 150 0 0 0 400 400 Z" fill="#fbc02d" opacity="0.2" />
                <!-- Night hemisphere -->
                <path d="M 400 100 A 150 150 0 0 1 400 400 Z" fill="#000000" opacity="0.2" />
                <!-- Earth outline -->
                <circle cx="400" cy="250" r="150" fill="none" stroke="#000000" stroke-width="2" />
                
                <!-- North pole -->
                <circle cx="400" cy="250" r="3" fill="#000000" />
                <!-- Move N label completely outside the earth circle to avoid overlap -->
                <!-- Earth circle is at cx=400, cy=250, r=150. So right edge is at x=550. -->
                <text x="560" y="255" fill="#000000" font-size="16">N</text>

                <!-- Full moon -->
                <circle cx="700" cy="250" r="30" fill="#fbc02d" stroke="#f57f17" stroke-width="2" />
                <text x="700" y="210" fill="#f57f17" font-size="16" text-anchor="middle">满月</text>
            </g>

            <!-- Step 1: 60E and 150E -->
            <g id="scene2-step1" class="step-element" style="opacity: 0; display: none;">
                <!-- 60E -->
                <line x1="400" y1="250" x2="250" y2="250" stroke="#000000" stroke-width="2" stroke-dasharray="4 4" />
                <text x="190" y="255" fill="#000000" font-size="14" text-anchor="end">60°E (12:00)</text>
                
                <!-- 150E -->
                <line x1="400" y1="250" x2="400" y2="400" stroke="#c62828" stroke-width="2" />
                <text x="400" y="425" fill="#c62828" font-size="14" text-anchor="middle">150°E (月出 18:00)</text>
            </g>

            <!-- Step 2: 120E -->
            <g id="scene2-step2" class="step-element" style="opacity: 0; display: none;">
                <!-- 120E -->
                <line x1="400" y1="250" x2="325" y2="380" stroke="#1565c0" stroke-width="2" />
                <text x="280" y="405" fill="#1565c0" font-size="14" text-anchor="end">120°E (上海 16:00)</text>
            </g>

            <!-- Step 3: Rotation and 30 deg sector -->
            <g id="scene2-step3" class="step-element" style="opacity: 0; display: none;">
                <!-- 30 deg sector -->
                <path d="M 400 250 L 325 380 A 150 150 0 0 0 400 400 Z" fill="#2e7d32" opacity="0.3" />
                <!-- Move 30° label completely outside the sector path/lines -->
                <!-- Sector is between 120E and 150E, roughly x=325 to 400, y=380 to 400 -->
                <text x="300" y="430" fill="#2e7d32" font-size="14" font-weight="bold">30°</text>

                <!-- Rotation arrow -->
                <!-- M 520.2 129.8 A 170 170 0 0 0 279.8 129.8 -->
                <path d="M 520.2 129.8 A 170 170 0 0 0 279.8 129.8" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#scene2-arrow-rot)" />
                <text x="400" y="60" fill="#000000" font-size="14" text-anchor="middle">自转方向</text>

                <!-- Calculation formula -->
                <text x="600" y="380" fill="#2e7d32" font-size="16" text-anchor="middle">等待时间: 30° ÷ 15°/小时 = 2 小时</text>
            </g>
        </svg>

        <div id="scene2-controls">
            <button id="scene2-btn-prev" disabled>◀ 上一步</button>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 3;
        
        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        
        const steps = [
            document.getElementById('scene2-step1'),
            document.getElementById('scene2-step2'),
            document.getElementById('scene2-step3')
        ];

        function updateView() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
            
            steps.forEach((stepEl, index) => {
                if (index < currentStep) {
                    stepEl.style.display = 'block';
                    // small delay to allow display:block to apply before opacity transition
                    setTimeout(() => {
                        stepEl.style.opacity = '1';
                    }, 10);
                } else {
                    stepEl.style.opacity = '0';
                    setTimeout(() => {
                        if (index >= currentStep) {
                            stepEl.style.display = 'none';
                        }
                    }, 400);
                }
            });
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateView();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateView();
            }
        });
        
        // Initialize
        updateView();
    })();
    </script>
</body>
</html>
