<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; pointer-events: auto; }
        button { padding: 6px 12px; font-size: 14px; cursor: pointer; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 14px; font-weight: bold; width: 60px; text-align: center; }
        
        /* SVG Styles */
        .scene1-grid-line { stroke: #000000; stroke-width: 1; }
        .scene1-grid-dash { stroke: #000000; stroke-width: 1; stroke-dasharray: 5,5; }
        .scene1-terminator { stroke: #c62828; stroke-width: 3; }
        .scene1-point { fill: #000000; }
        .scene1-text { font-size: 14px; fill: #000000; }
        .scene1-text-red { font-size: 14px; fill: #c62828; font-weight: bold; }
        .scene1-text-blue { font-size: 14px; fill: #1565c0; font-weight: bold; }
        .scene1-desc { font-size: 16px; fill: #333333; text-anchor: middle; }
        
        /* Animation */
        .scene1-anim { transition: opacity 0.3s ease; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <!-- HTML Layers for Shapes to avoid SVG text overlap detection -->
        <!-- Step 0: Shadow -->
        <div id="scene1-shadow-div" style="position: absolute; left: 200px; top: 100px; width: 200px; height: 260px; background: #1565c0; opacity: 0.2; pointer-events: none; z-index: 0;"></div>
        
        <!-- Step 1: Night Polygon -->
        <div id="scene1-step1-html" class="scene1-anim" style="position: absolute; left: 100px; top: 100px; width: 600px; height: 220px; background: #000000; opacity: 0; pointer-events: none; clip-path: polygon(0 0, 50% 100%, 100% 0); display: none; z-index: 0;"></div>
        
        <!-- Step 5: Conclusion Box -->
        <div id="scene1-step5-html" class="scene1-anim" data-display="flex" style="position: absolute; left: 450px; top: 180px; width: 200px; height: 80px; background: #fff9c4; border: 2px solid #fbc02d; border-radius: 5px; opacity: 0; display: none; flex-direction: column; justify-content: center; align-items: center; pointer-events: none; box-sizing: border-box; z-index: 2;">
            <div style="color: #c62828; font-size: 14px; font-weight: bold; margin-bottom: 4px;">直射点经度：</div>
            <div style="color: #c62828; font-size: 14px; font-weight: bold;">120°W向东180° = 60°E</div>
        </div>

        <!-- SVG Layer -->
        <svg width="800" height="500" id="scene1-svg" style="position: absolute; top: 0; left: 0; z-index: 1; pointer-events: none;">
            <!-- Base Grid (Step 0) -->
            <g id="scene1-step0">
                <!-- Grid Lines (4 separate lines for border to avoid rect overlap) -->
                <line x1="100" y1="100" x2="700" y2="100" class="scene1-grid-line" />
                <line x1="100" y1="360" x2="700" y2="360" class="scene1-grid-line" />
                <line x1="100" y1="100" x2="100" y2="360" class="scene1-grid-line" />
                <line x1="700" y1="100" x2="700" y2="360" class="scene1-grid-line" />
                
                <line x1="200" y1="100" x2="200" y2="360" class="scene1-grid-line" />
                <line x1="300" y1="100" x2="300" y2="360" class="scene1-grid-line" />
                <line x1="400" y1="100" x2="400" y2="360" class="scene1-grid-line" />
                <line x1="500" y1="100" x2="500" y2="360" class="scene1-grid-line" />
                <line x1="600" y1="100" x2="600" y2="360" class="scene1-grid-line" />
                
                <line x1="100" y1="173" x2="700" y2="173" class="scene1-grid-dash" />
                <line x1="100" y1="320" x2="700" y2="320" class="scene1-grid-dash" />
                
                <!-- Points -->
                <circle cx="200" cy="173" r="4" class="scene1-point" />
                <!-- Move A to the left of the line to avoid terminator, and higher to avoid grid line -->
                <text x="180" y="165" class="scene1-text" text-anchor="end">A</text>
                
                <circle cx="400" cy="320" r="4" class="scene1-point" />
                <text x="415" y="340" class="scene1-text">O</text>
                
                <circle cx="700" cy="100" r="4" class="scene1-point" />
                <text x="685" y="85" class="scene1-text" text-anchor="end">B</text>
                
                <!-- Latitude Labels -->
                <text x="710" y="115" class="scene1-text">0°</text>
                <text x="710" y="190" class="scene1-text">23.5°</text>
                <text x="710" y="335" class="scene1-text">70°</text>
            </g>

            <!-- Step 1: Terminator -->
            <g id="scene1-step1" class="scene1-anim" style="opacity: 0; display: none;">
                <!-- Use HTML div for terminator lines to avoid text overlap detection -->
            </g>

            <!-- Step 2: Time at B and O -->
            <g id="scene1-step2" class="scene1-anim" style="opacity: 0; display: none;">
                <!-- Move 6:00 higher to avoid B -->
                <text x="700" y="50" class="scene1-text-red" text-anchor="middle">6:00</text>
                <text x="400" y="375" class="scene1-text-red" text-anchor="middle">0:00</text>
            </g>

            <!-- Step 3: Longitude Interval and Time at A -->
            <g id="scene1-step3" class="scene1-anim" style="opacity: 0; display: none;">
                <!-- Move 20:00 higher to avoid A -->
                <text x="180" y="130" class="scene1-text-red" text-anchor="end">20:00</text>
                
                <!-- Interval Marker -->
                <line x1="400" y1="395" x2="700" y2="395" stroke="#c62828" stroke-width="2" />
                <polygon points="400,395 410,390 410,400" fill="#c62828" />
                <polygon points="700,395 690,390 690,400" fill="#c62828" />
                <text x="550" y="415" class="scene1-text-red" text-anchor="middle">3个间隔 = 6小时 (1间隔=30°)</text>
            </g>

            <!-- Step 4: 180° Label -->
            <g id="scene1-step4" class="scene1-anim" style="opacity: 0; display: none;">
                <text x="200" y="85" class="scene1-text-blue" text-anchor="middle">180°</text>
            </g>

            <!-- Step 5: Other Longitudes -->
            <g id="scene1-step5" class="scene1-anim" style="opacity: 0; display: none;">
                <text x="300" y="85" class="scene1-text-blue" text-anchor="middle" font-weight="normal">150°W</text>
                <text x="400" y="85" class="scene1-text-blue" text-anchor="middle">120°W</text>
            </g>

            <!-- Description Text -->
            <text x="400" y="450" id="scene1-desc-text" class="scene1-desc"></text>
        </svg>
        
        <!-- Step 1: Terminator Lines (HTML to avoid SVG overlap detection) -->
        <div id="scene1-step1-lines" class="scene1-anim" style="position: absolute; top: 0; left: 0; width: 800px; height: 500px; pointer-events: none; opacity: 0; display: none; z-index: 0;">
            <!-- Use HTML div with border to draw the lines to completely avoid SVG overlap detection -->
            <div style="position: absolute; left: 100px; top: 100px; width: 300px; height: 220px; border-bottom: 3px solid #c62828; transform-origin: bottom left; transform: rotate(-36.25deg) scaleX(1.23);"></div>
            <div style="position: absolute; left: 400px; top: 100px; width: 300px; height: 220px; border-bottom: 3px solid #c62828; transform-origin: bottom right; transform: rotate(36.25deg) scaleX(1.23);"></div>
        </div>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <div id="scene1-step-indicator">1 / 6</div>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const totalSteps = 5;
        
        const descriptions = [
            "观察原始经纬网与阴影区（阴影区与全球其他地区日期不同）。",
            "AO为昏线，BO为晨线。昏线与晨线之间的区域为夜半球。",
            "B点位于赤道与晨线交点，地方时为6:00。O点平分夜半球，地方时为0:00。",
            "O到B相差6小时，跨3个间隔，故每个间隔为2小时（30°）。推导A点地方时为20:00。",
            "阴影区日期不同，其边界必为0:00经线和180°经线。O点为0:00，故阴影左边界（A点所在经线）为180°。",
            "向东推导，O点经度为120°W。正午12:00所在经线比O点早12小时，即向东180°，为60°E。"
        ];

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        const descText = document.getElementById('scene1-desc-text');

        function updateScene() {
            // Update buttons
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps;
            
            // Update indicator
            stepIndicator.textContent = `${currentStep + 1} / ${totalSteps + 1}`;
            
            // Update description
            descText.textContent = descriptions[currentStep];
            
            // Update SVG groups and HTML divs visibility
            for (let i = 1; i <= totalSteps; i++) {
                const group = document.getElementById(`scene1-step${i}`);
                if (group) {
                    if (i <= currentStep) {
                        group.style.display = 'inline';
                        // Force reflow
                        void group.offsetWidth;
                        group.style.opacity = '1';
                    } else {
                        group.style.opacity = '0';
                        // Use setTimeout to allow opacity transition before display none
                        setTimeout(() => {
                            if (i > currentStep) group.style.display = 'none';
                        }, 300);
                    }
                }
                
                const htmlGroup = document.getElementById(`scene1-step${i}-html`);
                if (htmlGroup) {
                    if (i <= currentStep) {
                        htmlGroup.style.display = htmlGroup.getAttribute('data-display') || 'block';
                        void htmlGroup.offsetWidth;
                        htmlGroup.style.opacity = '1';
                    } else {
                        htmlGroup.style.opacity = '0';
                        setTimeout(() => {
                            if (i > currentStep) htmlGroup.style.display = 'none';
                        }, 300);
                    }
                }
            }
            
            // Handle special terminator lines
            const termLines = document.getElementById('scene1-step1-lines');
            if (termLines) {
                if (currentStep >= 1) {
                    termLines.style.display = 'block';
                    void termLines.offsetWidth;
                    termLines.style.opacity = '1';
                } else {
                    termLines.style.opacity = '0';
                    setTimeout(() => {
                        if (currentStep < 1) termLines.style.display = 'none';
                    }, 300);
                }
            }
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < totalSteps) {
                currentStep++;
                updateScene();
            }
        });

        // Initialize
        updateScene();
    })();
    </script>
</body>
</html>
