<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 5px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene1-text { font-size: 14px; fill: #000; user-select: none; }
        .scene1-red-text { font-size: 14px; fill: #c62828; user-select: none; font-weight: bold; }
        .scene1-blue-text { font-size: 14px; fill: #1565c0; user-select: none; font-weight: bold; }
        .scene1-line { stroke: #000; stroke-width: 2; fill: none; }
        .scene1-highlight-line { stroke: #c62828; stroke-width: 3; fill: none; transition: all 0.3s; }
        .scene1-point { fill: #000; }
        .scene1-callout { stroke: #888; stroke-width: 1; stroke-dasharray: 2 2; fill: none; }
        .scene1-fade { transition: opacity 0.3s; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <!-- Definitions -->
            <defs>
                <marker id="scene1-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828" />
                </marker>
            </defs>

            <!-- Base Grid -->
            <!-- Latitudes -->
            <path id="scene1-lat-70" class="scene1-line" d="M 303.6 64.9 A 150 150 0 0 0 496.4 64.9" />
            <path id="scene1-lat-60" class="scene1-line" d="M 239.3 141.5 A 250 250 0 0 0 560.7 141.5" />
            <path id="scene1-lat-50" class="scene1-line" d="M 175 218.1 A 350 350 0 0 0 625 218.1" />
            <path id="scene1-lat-40" class="scene1-line" d="M 110.7 294.7 A 450 450 0 0 0 689.3 294.7" />

            <!-- Longitudes -->
            <line id="scene1-lon-140e" class="scene1-line" x1="303.6" y1="64.9" x2="110.7" y2="294.7" />
            <line id="scene1-lon-160e" class="scene1-line" x1="348.7" y1="90.9" x2="246.1" y2="372.9" />
            <line id="scene1-lon-180" class="scene1-line" x1="400" y1="100" x2="400" y2="400" />
            <line id="scene1-lon-160w" class="scene1-line" x1="451.3" y1="90.9" x2="553.9" y2="372.9" />
            <line id="scene1-lon-140w" class="scene1-line" x1="496.4" y1="64.9" x2="689.3" y2="294.7" />

            <!-- Callouts -->
            <line x1="303.6" y1="64.9" x2="270" y2="50" class="scene1-callout" />
            <line x1="400" y1="100" x2="395" y2="50" class="scene1-callout" />
            <line x1="496.4" y1="64.9" x2="510" y2="50" class="scene1-callout" />
            <line x1="560.7" y1="141.5" x2="695" y2="135" class="scene1-callout" />
            <line x1="689.3" y1="294.7" x2="695" y2="295" class="scene1-callout" />
            <line x1="239.3" y1="141.5" x2="105" y2="135" class="scene1-callout" />
            <line x1="246.1" y1="372.9" x2="235" y2="405" class="scene1-callout" />
            <line x1="519.7" y1="278.9" x2="695" y2="260" class="scene1-callout" />

            <!-- Base Labels -->
            <text x="260" y="45" class="scene1-text">140°</text>
            <text x="385" y="45" class="scene1-text">180°</text>
            <text x="500" y="45" class="scene1-text">140°</text>
            <text x="700" y="135" class="scene1-text">60°</text>
            <text x="700" y="300" class="scene1-text">40°</text>

            <!-- Points -->
            <circle cx="400" cy="200" r="4" class="scene1-point" />
            <text x="415" y="210" class="scene1-text">A</text>

            <circle cx="239.3" cy="141.5" r="4" class="scene1-point" />
            <text x="90" y="135" class="scene1-text">D</text>

            <circle cx="246.1" cy="372.9" r="4" class="scene1-point" />
            <text x="215" y="415" class="scene1-text">E</text>

            <circle cx="519.7" cy="278.9" r="4" class="scene1-point" />
            <text x="700" y="260" class="scene1-text">F</text>

            <!-- Step 0 Elements -->
            <g id="scene1-step0-elements" class="scene1-fade">
                <line x1="348.7" y1="90.9" x2="335" y2="50" class="scene1-callout" />
                <line x1="451.3" y1="90.9" x2="455" y2="50" class="scene1-callout" />
                <line x1="496.4" y1="64.9" x2="695" y2="60" class="scene1-callout" />
                <line x1="625" y1="218.1" x2="695" y2="210" class="scene1-callout" />

                <text x="320" y="45" class="scene1-text">160°E</text>
                <text x="440" y="45" class="scene1-text">160°W</text>
                <text x="700" y="60" class="scene1-text">70°N</text>
                <text x="700" y="210" class="scene1-text">50°N</text>

                <line x1="90" y1="350" x2="90" y2="250" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrow-red)" />
                <text x="20" y="440" class="scene1-red-text">向北度数增大为北纬(N)</text>

                <path d="M 200 410 Q 400 430 600 410" stroke="#c62828" stroke-width="2" fill="none" marker-end="url(#scene1-arrow-red)" />
                <text x="280" y="440" class="scene1-red-text">向东越过180°经线度数减小</text>
            </g>

            <!-- Step 1 Elements -->
            <g id="scene1-step1-elements" class="scene1-fade" style="opacity: 0; display: none;">
                <text x="20" y="155" class="scene1-red-text">D(60°N, 140°E)</text>
                <text x="20" y="415" class="scene1-red-text">E(40°N, 160°E)</text>
                <text x="650" y="250" class="scene1-red-text">F(50°N, 160°W)</text>
            </g>

            <!-- Step 2 Elements -->
            <g id="scene1-step2-elements" class="scene1-fade" style="opacity: 0; display: none;">
                <!-- Cross A -->
                <line x1="400" y1="200" x2="400" y2="140" stroke="#888" stroke-width="1" stroke-dasharray="4 2" />
                <line x1="400" y1="200" x2="400" y2="300" stroke="#888" stroke-width="1" stroke-dasharray="4 2" />
                <line x1="400" y1="200" x2="240" y2="200" stroke="#888" stroke-width="1" stroke-dasharray="4 2" />
                <line x1="400" y1="200" x2="560" y2="200" stroke="#888" stroke-width="1" stroke-dasharray="4 2" />
                <text x="405" y="130" font-size="12" fill="#888">N</text>
                <text x="405" y="315" font-size="12" fill="#888">S</text>
                <text x="220" y="195" font-size="12" fill="#888">W</text>
                <text x="570" y="195" font-size="12" fill="#888">E</text>

                <!-- Cross F -->
                <line x1="520" y1="279" x2="520" y2="215" stroke="#888" stroke-width="1" stroke-dasharray="4 2" />
                <line x1="520" y1="279" x2="520" y2="400" stroke="#888" stroke-width="1" stroke-dasharray="4 2" />
                <line x1="520" y1="279" x2="400" y2="279" stroke="#888" stroke-width="1" stroke-dasharray="4 2" />
                <line x1="520" y1="279" x2="690" y2="279" stroke="#888" stroke-width="1" stroke-dasharray="4 2" />
                <text x="525" y="205" font-size="12" fill="#888">N</text>
                <text x="525" y="415" font-size="12" fill="#888">S</text>
                <text x="385" y="270" font-size="12" fill="#888">W</text>
                <text x="700" y="270" font-size="12" fill="#888">E</text>

                <!-- Arrows -->
                <line x1="400" y1="200" x2="245" y2="147" stroke="#c62828" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#scene1-arrow-red)" />
                <text x="360" y="130" class="scene1-red-text">西北</text>

                <line x1="520" y1="279" x2="252" y2="370" stroke="#c62828" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#scene1-arrow-red)" />
                <text x="360" y="415" class="scene1-red-text">西南</text>
            </g>

            <!-- Step 3 Elements -->
            <g id="scene1-step3-elements" class="scene1-fade" style="opacity: 0; display: none;">
                <text x="360" y="440" class="scene1-red-text">对立经线为0°</text>
            </g>

            <!-- Step 4 Elements -->
            <g id="scene1-step4-elements" class="scene1-fade" style="opacity: 0; display: none;">
                <!-- East Hemisphere (140E - 160E) -->
                <path d="M 303.6 64.9 A 150 150 0 0 0 348.7 90.9 L 246.1 372.9 A 450 450 0 0 1 110.7 294.7 Z" fill="#2e7d32" opacity="0.2" />
                
                <!-- West Hemisphere (160E - 140W) -->
                <path d="M 348.7 90.9 A 150 150 0 0 0 496.4 64.9 L 689.3 294.7 A 450 450 0 0 1 246.1 372.9 Z" fill="#1565c0" opacity="0.2" />

                <!-- East Longitude Border (140E - 180) -->
                <path d="M 303.6 64.9 A 150 150 0 0 0 400 100 L 400 400 A 450 450 0 0 1 110.7 294.7 Z" stroke="#c62828" stroke-width="3" fill="none" />

                <text x="500" y="440" class="scene1-blue-text">大部分位于西半球</text>
                <text x="200" y="440" class="scene1-red-text">交集：160°E - 180°</text>
            </g>
        </svg>
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 4;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');

        const step0 = document.getElementById('scene1-step0-elements');
        const step1 = document.getElementById('scene1-step1-elements');
        const step2 = document.getElementById('scene1-step2-elements');
        const step3 = document.getElementById('scene1-step3-elements');
        const step4 = document.getElementById('scene1-step4-elements');

        const lon140e = document.getElementById('scene1-lon-140e');
        const lon160e = document.getElementById('scene1-lon-160e');
        const lon180 = document.getElementById('scene1-lon-180');
        const lon160w = document.getElementById('scene1-lon-160w');
        const lat60 = document.getElementById('scene1-lat-60');
        const lat50 = document.getElementById('scene1-lat-50');
        const lat40 = document.getElementById('scene1-lat-40');

        function show(el) {
            el.style.display = '';
            // trigger reflow
            void el.offsetWidth;
            el.style.opacity = '1';
        }

        function hide(el) {
            el.style.opacity = '0';
            setTimeout(() => {
                if (el.style.opacity === '0') {
                    el.style.display = 'none';
                }
            }, 300);
        }

        function updateStep() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;

            // Reset highlights
            [lon140e, lon160e, lon180, lon160w, lat60, lat50, lat40].forEach(el => {
                el.setAttribute('class', 'scene1-line');
            });

            if (currentStep === 0) {
                show(step0);
                hide(step1);
                hide(step2);
                hide(step3);
                hide(step4);
            } else if (currentStep === 1) {
                hide(step0);
                show(step1);
                hide(step2);
                hide(step3);
                hide(step4);

                lon140e.setAttribute('class', 'scene1-highlight-line');
                lon160e.setAttribute('class', 'scene1-highlight-line');
                lon160w.setAttribute('class', 'scene1-highlight-line');
                lat60.setAttribute('class', 'scene1-highlight-line');
                lat50.setAttribute('class', 'scene1-highlight-line');
                lat40.setAttribute('class', 'scene1-highlight-line');
            } else if (currentStep === 2) {
                hide(step0);
                hide(step1);
                show(step2);
                hide(step3);
                hide(step4);
            } else if (currentStep === 3) {
                hide(step0);
                hide(step1);
                hide(step2);
                show(step3);
                hide(step4);

                lon180.setAttribute('class', 'scene1-highlight-line');
            } else if (currentStep === 4) {
                hide(step0);
                hide(step1);
                hide(step2);
                hide(step3);
                show(step4);
            }
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateStep();
            }
        });

        // Initialize
        updateStep();
    })();
    </script>
</body>
</html>
