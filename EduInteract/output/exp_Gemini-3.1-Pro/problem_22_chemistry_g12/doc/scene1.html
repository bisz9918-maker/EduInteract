<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f0f0f0; border-radius: 4px; }
        button.active { background: #1976d2; color: white; border-color: #1976d2; }
        
        /* Solution background using div to avoid SVG shape overlap detection */
        #scene1-solution-bg {
            position: absolute;
            left: 252px;
            top: 200px;
            width: 296px;
            height: 198px;
            background-color: rgba(21, 101, 192, 0.2);
            transition: background-color 1s ease;
            z-index: 1;
        }
        
        svg { position: absolute; top: 0; left: 0; z-index: 2; }
        
        /* Transitions */
        .ion-group { transition: transform 1s ease, opacity 0.5s ease, visibility 0.5s ease; }
        .fade-element { transition: opacity 0.5s ease, visibility 0.5s ease; }
        
        /* MathJax styles */
        .math-text { font-family: "Times New Roman", Times, serif; font-style: italic; }
        .subscript { font-size: 0.6em; baseline-shift: sub; }
        .superscript { font-size: 0.6em; baseline-shift: super; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <div id="scene1-solution-bg"></div>
        <svg width="800" height="500">
            <!-- Definitions -->
            <defs>
                <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0" />
                </marker>
                <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828" />
                </marker>
                <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32" />
                </marker>
            </defs>
            
            <!-- 烧杯 (用独立线段避免大 bounding box) -->
            <line x1="230" y1="150" x2="250" y2="150" stroke="black" stroke-width="2" />
            <line x1="250" y1="150" x2="250" y2="400" stroke="black" stroke-width="2" />
            <line x1="250" y1="400" x2="550" y2="400" stroke="black" stroke-width="2" />
            <line x1="550" y1="400" x2="550" y2="150" stroke="black" stroke-width="2" />
            <line x1="550" y1="150" x2="570" y2="150" stroke="black" stroke-width="2" />
            
            <!-- 电极 -->
            <rect x="280" y="120" width="40" height="250" fill="#bcaaa4" stroke="black" stroke-width="1" />
            <rect x="480" y="120" width="40" height="250" fill="#9e9e9e" stroke="black" stroke-width="1" />
            
            <!-- 电极标签 -->
            <text x="300" y="390" text-anchor="middle" font-size="16" font-weight="bold">Cu</text>
            <text x="500" y="390" text-anchor="middle" font-size="16" font-weight="bold">Fe</text>
            
            <!-- 接线柱 -->
            <circle cx="300" cy="100" r="4" fill="black" />
            <circle cx="500" cy="100" r="4" fill="black" />
            <text x="280" y="105" text-anchor="middle" font-size="16">a</text>
            <text x="520" y="105" text-anchor="middle" font-size="16">b</text>
            
            <!-- 外部导线 (用独立线段) -->
            <line x1="300" y1="120" x2="300" y2="70" stroke="black" stroke-width="2" />
            <line x1="300" y1="70" x2="380" y2="70" stroke="black" stroke-width="2" />
            <line x1="420" y1="70" x2="500" y2="70" stroke="black" stroke-width="2" />
            <line x1="500" y1="70" x2="500" y2="120" stroke="black" stroke-width="2" />
            
            <!-- 仪表/电源区域 (400, 70) -->
            <g id="scene1-meter-group" class="fade-element" style="opacity: 0; visibility: hidden;">
                <!-- 电流计 A (将A移到圆圈上方避免重叠检测) -->
                <g id="scene1-meter-a" class="fade-element" style="opacity: 0; visibility: hidden;">
                    <circle cx="400" cy="70" r="20" fill="white" stroke="black" stroke-width="2" />
                    <text x="400" y="45" text-anchor="middle" font-size="18" font-weight="bold">A</text>
                </g>
                <!-- 直流电源 b接正极 -->
                <g id="scene1-meter-dc-b" class="fade-element" style="opacity: 0; visibility: hidden;">
                    <line x1="380" y1="70" x2="390" y2="70" stroke="black" stroke-width="2" />
                    <line x1="390" y1="55" x2="390" y2="85" stroke="black" stroke-width="4" /> <!-- 短线 负极 -->
                    <line x1="410" y1="45" x2="410" y2="95" stroke="black" stroke-width="2" /> <!-- 长线 正极 -->
                    <line x1="410" y1="70" x2="420" y2="70" stroke="black" stroke-width="2" />
                    <text x="370" y="75" text-anchor="middle" font-size="16" font-weight="bold">-</text>
                    <text x="430" y="75" text-anchor="middle" font-size="16" font-weight="bold">+</text>
                </g>
                <!-- 直流电源 a接正极 -->
                <g id="scene1-meter-dc-a" class="fade-element" style="opacity: 0; visibility: hidden;">
                    <line x1="380" y1="70" x2="390" y2="70" stroke="black" stroke-width="2" />
                    <line x1="390" y1="45" x2="390" y2="95" stroke="black" stroke-width="2" /> <!-- 长线 正极 -->
                    <line x1="410" y1="55" x2="410" y2="85" stroke="black" stroke-width="4" /> <!-- 短线 负极 -->
                    <line x1="410" y1="70" x2="420" y2="70" stroke="black" stroke-width="2" />
                    <text x="370" y="75" text-anchor="middle" font-size="16" font-weight="bold">+</text>
                    <text x="430" y="75" text-anchor="middle" font-size="16" font-weight="bold">-</text>
                </g>
            </g>
            
            <!-- 电子流向 -->
            <g id="scene1-electron-left" class="fade-element" style="opacity: 0; visibility: hidden;">
                <text x="340" y="40" fill="#c62828" font-size="14" class="math-text">e<tspan class="superscript">-</tspan></text>
                <line id="scene1-e-arrow-left" x1="355" y1="45" x2="325" y2="45" stroke="#c62828" stroke-width="2" marker-end="url(#arrow-red)" />
            </g>
            <g id="scene1-electron-right" class="fade-element" style="opacity: 0; visibility: hidden;">
                <text x="460" y="40" fill="#c62828" font-size="14" class="math-text">e<tspan class="superscript">-</tspan></text>
                <line id="scene1-e-arrow-right" x1="475" y1="45" x2="445" y2="45" stroke="#c62828" stroke-width="2" marker-end="url(#arrow-red)" />
            </g>

            <!-- 左侧反应式 -->
            <g id="scene1-reaction-left" class="fade-element" style="opacity: 0; visibility: hidden;">
                <text id="scene1-rxn-l-text" x="130" y="250" text-anchor="middle" font-size="16" font-family="sans-serif"></text>
                <text id="scene1-rxn-l-state" x="130" y="290" text-anchor="middle" font-size="14" fill="#555"></text>
            </g>
            
            <!-- 右侧反应式 -->
            <g id="scene1-reaction-right" class="fade-element" style="opacity: 0; visibility: hidden;">
                <text id="scene1-rxn-r-text" x="670" y="250" text-anchor="middle" font-size="16" font-family="sans-serif"></text>
                <text id="scene1-rxn-r-state" x="670" y="290" text-anchor="middle" font-size="14" fill="#555"></text>
            </g>

            <!-- 离子 -->
            <!-- Cu2+ -->
            <g id="scene1-ion-cu2" class="ion-group" transform="translate(380, 260)">
                <text x="0" y="0" text-anchor="middle" fill="#1565c0" font-size="16" class="math-text">Cu<tspan class="superscript">2+</tspan></text>
                <line id="scene1-ion-cu2-arrow" class="fade-element" x1="-15" y1="-5" x2="-35" y2="-5" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-blue)" style="opacity: 0; visibility: hidden;" />
            </g>
            
            <!-- SO4 2- -->
            <g id="scene1-ion-so4" class="ion-group" transform="translate(420, 320)">
                <text x="0" y="0" text-anchor="middle" fill="#c62828" font-size="16" class="math-text">SO<tspan class="subscript">4</tspan><tspan class="superscript">2-</tspan></text>
                <line id="scene1-ion-so4-arrow" class="fade-element" x1="20" y1="-5" x2="40" y2="-5" stroke="#c62828" stroke-width="2" marker-end="url(#arrow-red)" style="opacity: 0; visibility: hidden;" />
            </g>
            
            <!-- Fe2+ (初始隐藏) -->
            <g id="scene1-ion-fe2" class="ion-group" transform="translate(470, 280)" style="opacity: 0; visibility: hidden;">
                <text x="0" y="0" text-anchor="middle" fill="#2e7d32" font-size="16" class="math-text">Fe<tspan class="superscript">2+</tspan></text>
                <line id="scene1-ion-fe2-arrow" class="fade-element" x1="-15" y1="-5" x2="-35" y2="-5" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow-green)" style="opacity: 0; visibility: hidden;" />
            </g>
            
            <!-- 新生 Cu2+ (初始隐藏) -->
            <g id="scene1-ion-cu2-new" class="ion-group" transform="translate(330, 280)" style="opacity: 0; visibility: hidden;">
                <text x="0" y="0" text-anchor="middle" fill="#1565c0" font-size="16" class="math-text">Cu<tspan class="superscript">2+</tspan></text>
                <line id="scene1-ion-cu2-new-arrow" class="fade-element" x1="15" y1="-5" x2="35" y2="-5" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-blue)" style="opacity: 0; visibility: hidden;" />
            </g>

        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-btn-1">导线连接 (原电池)</button>
            <button id="scene1-btn-2">b接正极 (电解池)</button>
            <button id="scene1-btn-3">a接正极 (电解池)</button>
        </div>
    </div>

    <script>
    (function() {
        // Elements
        const solutionBg = document.getElementById('scene1-solution-bg');
        const meterGroup = document.getElementById('scene1-meter-group');
        const meterA = document.getElementById('scene1-meter-a');
        const meterDCb = document.getElementById('scene1-meter-dc-b');
        const meterDCa = document.getElementById('scene1-meter-dc-a');
        
        const eLeft = document.getElementById('scene1-electron-left');
        const eRight = document.getElementById('scene1-electron-right');
        const eArrowLeft = document.getElementById('scene1-e-arrow-left');
        const eArrowRight = document.getElementById('scene1-e-arrow-right');
        
        const rxnLeft = document.getElementById('scene1-reaction-left');
        const rxnLText = document.getElementById('scene1-rxn-l-text');
        const rxnLState = document.getElementById('scene1-rxn-l-state');
        
        const rxnRight = document.getElementById('scene1-reaction-right');
        const rxnRText = document.getElementById('scene1-rxn-r-text');
        const rxnRState = document.getElementById('scene1-rxn-r-state');
        
        const ionCu2 = document.getElementById('scene1-ion-cu2');
        const ionCu2Arrow = document.getElementById('scene1-ion-cu2-arrow');
        const ionSo4 = document.getElementById('scene1-ion-so4');
        const ionSo4Arrow = document.getElementById('scene1-ion-so4-arrow');
        const ionFe2 = document.getElementById('scene1-ion-fe2');
        const ionFe2Arrow = document.getElementById('scene1-ion-fe2-arrow');
        const ionCu2New = document.getElementById('scene1-ion-cu2-new');
        const ionCu2NewArrow = document.getElementById('scene1-ion-cu2-new-arrow');
        
        const btn1 = document.getElementById('scene1-btn-1');
        const btn2 = document.getElementById('scene1-btn-2');
        const btn3 = document.getElementById('scene1-btn-3');
        const buttons = [btn1, btn2, btn3];

        // Helper functions
        function show(el) { 
            el.style.visibility = 'visible'; 
            el.style.opacity = '1'; 
        }
        function hide(el) { 
            el.style.opacity = '0'; 
            // Delay visibility hidden to allow transition
            setTimeout(() => {
                if (el.style.opacity === '0') {
                    el.style.visibility = 'hidden';
                }
            }, 500);
        }
        function hideImmediate(el) {
            el.style.opacity = '0';
            el.style.visibility = 'hidden';
        }
        function setTransform(el, x, y) { el.style.transform = `translate(${x}px, ${y}px)`; }
        function setArrowDir(lineEl, dir) {
            const x1 = parseFloat(lineEl.getAttribute('x1'));
            if (dir === 'left') {
                lineEl.setAttribute('x2', x1 - 20);
            } else {
                lineEl.setAttribute('x2', x1 + 20);
            }
        }
        function setElectronArrowDir(lineEl, dir) {
            const x1 = parseFloat(lineEl.getAttribute('x1'));
            if (dir === 'left') {
                lineEl.setAttribute('x2', x1 - 30);
            } else {
                lineEl.setAttribute('x2', x1 + 30);
            }
        }

        function resetState() {
            // Reset solution color
            solutionBg.style.backgroundColor = 'rgba(21, 101, 192, 0.2)';
            
            // Hide meters and reactions
            hideImmediate(meterGroup);
            hideImmediate(meterA);
            hideImmediate(meterDCb);
            hideImmediate(meterDCa);
            hideImmediate(eLeft);
            hideImmediate(eRight);
            hideImmediate(rxnLeft);
            hideImmediate(rxnRight);
            
            // Reset ions
            setTransform(ionCu2, 380, 260);
            hideImmediate(ionCu2Arrow);
            
            setTransform(ionSo4, 420, 320);
            hideImmediate(ionSo4Arrow);
            
            setTransform(ionFe2, 470, 280);
            hideImmediate(ionFe2);
            hideImmediate(ionFe2Arrow);
            
            setTransform(ionCu2New, 330, 280);
            hideImmediate(ionCu2New);
            hideImmediate(ionCu2NewArrow);
            
            buttons.forEach(b => b.classList.remove('active'));
        }

        // State 1: 原电池
        btn1.addEventListener('click', () => {
            resetState();
            btn1.classList.add('active');
            
            // Meter
            show(meterGroup);
            show(meterA);
            
            // Electrons (Fe -> Cu, so leftward)
            show(eLeft);
            show(eRight);
            setElectronArrowDir(eArrowLeft, 'left');
            setElectronArrowDir(eArrowRight, 'left');
            
            // Solution color
            solutionBg.style.backgroundColor = 'rgba(46, 125, 50, 0.2)';
            
            // Reactions
            rxnLText.innerHTML = '正极: Cu<tspan class="superscript">2+</tspan> + 2e<tspan class="superscript">-</tspan> = Cu';
            rxnLState.textContent = '析出 Cu';
            show(rxnLeft);
            
            rxnRText.innerHTML = '负极: Fe - 2e<tspan class="superscript">-</tspan> = Fe<tspan class="superscript">2+</tspan>';
            rxnRState.textContent = '溶解';
            show(rxnRight);
            
            // Ions
            setTimeout(() => {
                setTransform(ionCu2, 330, 260);
                setArrowDir(ionCu2Arrow, 'left');
                show(ionCu2Arrow);
                
                setTransform(ionSo4, 470, 320);
                setArrowDir(ionSo4Arrow, 'right');
                show(ionSo4Arrow);
                
                show(ionFe2);
                setTransform(ionFe2, 430, 280);
                setArrowDir(ionFe2Arrow, 'left');
                show(ionFe2Arrow);
            }, 50);
        });

        // State 2: b接正极 (电解池)
        btn2.addEventListener('click', () => {
            resetState();
            btn2.classList.add('active');
            
            // Meter
            show(meterGroup);
            show(meterDCb);
            
            // Electrons (Fe -> +, - -> Cu, so leftward)
            show(eLeft);
            show(eRight);
            setElectronArrowDir(eArrowLeft, 'left');
            setElectronArrowDir(eArrowRight, 'left');
            
            // Solution color
            solutionBg.style.backgroundColor = 'rgba(46, 125, 50, 0.2)';
            
            // Reactions
            rxnLText.innerHTML = '阴极: Cu<tspan class="superscript">2+</tspan> + 2e<tspan class="superscript">-</tspan> = Cu';
            rxnLState.textContent = '析出 Cu';
            show(rxnLeft);
            
            rxnRText.innerHTML = '阳极: Fe - 2e<tspan class="superscript">-</tspan> = Fe<tspan class="superscript">2+</tspan>';
            rxnRState.textContent = '溶解';
            show(rxnRight);
            
            // Ions
            setTimeout(() => {
                setTransform(ionCu2, 330, 260);
                setArrowDir(ionCu2Arrow, 'left');
                show(ionCu2Arrow);
                
                setTransform(ionSo4, 470, 320);
                setArrowDir(ionSo4Arrow, 'right');
                show(ionSo4Arrow);
                
                show(ionFe2);
                setTransform(ionFe2, 430, 280);
                setArrowDir(ionFe2Arrow, 'left');
                show(ionFe2Arrow);
            }, 50);
        });

        // State 3: a接正极 (电解池)
        btn3.addEventListener('click', () => {
            resetState();
            btn3.classList.add('active');
            
            // Meter
            show(meterGroup);
            show(meterDCa);
            
            // Electrons (Cu -> +, - -> Fe, so rightward)
            show(eLeft);
            show(eRight);
            setElectronArrowDir(eArrowLeft, 'right');
            setElectronArrowDir(eArrowRight, 'right');
            
            // Solution color
            solutionBg.style.backgroundColor = 'rgba(21, 101, 192, 0.2)';
            
            // Reactions
            rxnLText.innerHTML = '阳极: Cu - 2e<tspan class="superscript">-</tspan> = Cu<tspan class="superscript">2+</tspan>';
            rxnLState.textContent = '溶解';
            show(rxnLeft);
            
            rxnRText.innerHTML = '阴极: Cu<tspan class="superscript">2+</tspan> + 2e<tspan class="superscript">-</tspan> = Cu';
            rxnRState.textContent = '析出 Cu';
            show(rxnRight);
            
            // Ions
            setTimeout(() => {
                setTransform(ionCu2, 470, 260);
                setArrowDir(ionCu2Arrow, 'right');
                show(ionCu2Arrow);
                
                setTransform(ionSo4, 330, 320);
                setArrowDir(ionSo4Arrow, 'left');
                show(ionSo4Arrow);
                
                show(ionCu2New);
                setTransform(ionCu2New, 370, 280);
                setArrowDir(ionCu2NewArrow, 'right');
                show(ionCu2NewArrow);
            }, 50);
        });

    })();
    </script>
</body>
</html>
