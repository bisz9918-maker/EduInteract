<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button.active { background: #e0e0e0; border-color: #999; font-weight: bold; }
        text { font-family: sans-serif; }
        .title-x { fill: #1565c0; font-weight: bold; font-size: 18px; }
        .title-auto { fill: #2e7d32; font-weight: bold; font-size: 18px; }
        .label { fill: #333; font-size: 16px; }
        .phenotype { fill: #333; font-size: 14px; }
        .genotype { fill: #000; font-size: 16px; }
        .ratio { fill: #000; font-size: 16px; }
        .conclusion { fill: #c62828; font-weight: bold; font-size: 18px; }
        .line-x { stroke: #1565c0; stroke-width: 1.5; }
        .line-auto { stroke: #2e7d32; stroke-width: 1.5; }
        .highlight-box { fill: none; stroke: #c62828; stroke-width: 2; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500">
            <defs>
                <marker id="scene2-arrow-x" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0" />
                </marker>
                <marker id="scene2-arrow-auto" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32" />
                </marker>
            </defs>

            <!-- 伴X假说组 -->
            <g id="scene2-group-x">
                <text x="220" y="45" text-anchor="middle" class="title-x">伴X假说</text>
                
                <!-- 行标签 -->
                <text x="30" y="110" class="label">测交</text>
                <text x="30" y="180" class="label">配子</text>
                <text x="30" y="220" class="label">测交后代</text>
                <text x="30" y="365" class="label">比例</text>

                <!-- 亲本 -->
                <text x="150" y="65" text-anchor="middle" class="phenotype">F<tspan baseline-shift="sub" font-size="0.7em">1</tspan>直刚毛雌果蝇</text>
                <text x="290" y="65" text-anchor="middle" class="phenotype">F<tspan baseline-shift="sub" font-size="0.7em">2</tspan>卷刚毛雄果蝇</text>
                
                <text x="150" y="110" text-anchor="middle" class="genotype">X<tspan baseline-shift="super" font-size="0.7em">A</tspan>X<tspan baseline-shift="super" font-size="0.7em">a</tspan></text>
                <text x="290" y="110" text-anchor="middle" class="genotype">X<tspan baseline-shift="super" font-size="0.7em">a</tspan>Y</text>
                <text x="220" y="110" text-anchor="middle" class="genotype">×</text>

                <!-- 配子 -->
                <text x="105" y="180" text-anchor="middle" class="genotype">X<tspan baseline-shift="super" font-size="0.7em">A</tspan></text>
                <text x="185" y="180" text-anchor="middle" class="genotype">X<tspan baseline-shift="super" font-size="0.7em">a</tspan></text>
                <text x="255" y="180" text-anchor="middle" class="genotype">X<tspan baseline-shift="super" font-size="0.7em">a</tspan></text>
                <text x="335" y="180" text-anchor="middle" class="genotype">Y</text>

                <!-- 子代 -->
                <text x="105" y="270" text-anchor="middle" class="genotype">X<tspan baseline-shift="super" font-size="0.7em">A</tspan>X<tspan baseline-shift="super" font-size="0.7em">a</tspan></text>
                <text x="185" y="270" text-anchor="middle" class="genotype">X<tspan baseline-shift="super" font-size="0.7em">A</tspan>Y</text>
                <text x="255" y="270" text-anchor="middle" class="genotype">X<tspan baseline-shift="super" font-size="0.7em">a</tspan>X<tspan baseline-shift="super" font-size="0.7em">a</tspan></text>
                <text x="335" y="270" text-anchor="middle" class="genotype">X<tspan baseline-shift="super" font-size="0.7em">a</tspan>Y</text>

                <text x="105" y="305" text-anchor="middle" class="phenotype">直刚毛</text>
                <text x="185" y="305" text-anchor="middle" class="phenotype">直刚毛</text>
                <text x="255" y="305" text-anchor="middle" class="phenotype">卷刚毛</text>
                <text x="335" y="305" text-anchor="middle" class="phenotype">卷刚毛</text>

                <text x="105" y="325" text-anchor="middle" class="phenotype">雌果蝇</text>
                <text x="185" y="325" text-anchor="middle" class="phenotype">雄果蝇</text>
                <text x="255" y="325" text-anchor="middle" class="phenotype">雌果蝇</text>
                <text x="335" y="325" text-anchor="middle" class="phenotype">雄果蝇</text>

                <!-- 比例 -->
                <text x="105" y="365" text-anchor="middle" class="ratio">1</text>
                <text x="145" y="365" text-anchor="middle" class="ratio">:</text>
                <text x="185" y="365" text-anchor="middle" class="ratio">1</text>
                <text x="220" y="365" text-anchor="middle" class="ratio">:</text>
                <text x="255" y="365" text-anchor="middle" class="ratio">1</text>
                <text x="295" y="365" text-anchor="middle" class="ratio">:</text>
                <text x="335" y="365" text-anchor="middle" class="ratio">1</text>

                <!-- 连线 -->
                <!-- 亲本到配子 -->
                <line x1="150" y1="120" x2="105" y2="160" class="line-x" marker-end="url(#scene2-arrow-x)" />
                <line x1="150" y1="120" x2="185" y2="160" class="line-x" marker-end="url(#scene2-arrow-x)" />
                <line x1="290" y1="120" x2="255" y2="160" class="line-x" marker-end="url(#scene2-arrow-x)" />
                <line x1="290" y1="120" x2="335" y2="160" class="line-x" marker-end="url(#scene2-arrow-x)" />

                <!-- 配子到子代 -->
                <line x1="105" y1="190" x2="105" y2="250" class="line-x" marker-end="url(#scene2-arrow-x)" />
                <line x1="105" y1="190" x2="185" y2="250" class="line-x" marker-end="url(#scene2-arrow-x)" />
                <line x1="185" y1="190" x2="255" y2="250" class="line-x" marker-end="url(#scene2-arrow-x)" />
                <line x1="185" y1="190" x2="335" y2="250" class="line-x" marker-end="url(#scene2-arrow-x)" />
                
                <line x1="255" y1="190" x2="105" y2="250" class="line-x" marker-end="url(#scene2-arrow-x)" />
                <line x1="255" y1="190" x2="255" y2="250" class="line-x" marker-end="url(#scene2-arrow-x)" />
                <line x1="335" y1="190" x2="185" y2="250" class="line-x" marker-end="url(#scene2-arrow-x)" />
                <line x1="335" y1="190" x2="335" y2="250" class="line-x" marker-end="url(#scene2-arrow-x)" />
            </g>

            <!-- 常染色体假说组 -->
            <g id="scene2-group-auto" style="display: none; opacity: 0;">
                <text x="620" y="45" text-anchor="middle" class="title-auto">常染色体假说</text>
                
                <!-- 行标签 -->
                <text x="430" y="110" class="label">测交</text>
                <text x="430" y="180" class="label">配子</text>
                <text x="430" y="220" class="label">测交后代</text>
                <text x="430" y="365" class="label">比例</text>

                <!-- 亲本 -->
                <text x="550" y="65" text-anchor="middle" class="phenotype">F<tspan baseline-shift="sub" font-size="0.7em">1</tspan>直刚毛雌果蝇</text>
                <text x="690" y="65" text-anchor="middle" class="phenotype">F<tspan baseline-shift="sub" font-size="0.7em">2</tspan>卷刚毛雄果蝇</text>
                
                <text x="550" y="110" text-anchor="middle" class="genotype">AaXX</text>
                <text x="690" y="110" text-anchor="middle" class="genotype">aaXY</text>
                <text x="620" y="110" text-anchor="middle" class="genotype">×</text>

                <!-- 配子 -->
                <text x="505" y="180" text-anchor="middle" class="genotype">AX</text>
                <text x="585" y="180" text-anchor="middle" class="genotype">aX</text>
                <text x="655" y="180" text-anchor="middle" class="genotype">aX</text>
                <text x="735" y="180" text-anchor="middle" class="genotype">aY</text>

                <!-- 子代 -->
                <text x="505" y="270" text-anchor="middle" class="genotype">AaXX</text>
                <text x="585" y="270" text-anchor="middle" class="genotype">AaXY</text>
                <text x="655" y="270" text-anchor="middle" class="genotype">aaXX</text>
                <text x="735" y="270" text-anchor="middle" class="genotype">aaXY</text>

                <text x="505" y="305" text-anchor="middle" class="phenotype">直刚毛</text>
                <text x="585" y="305" text-anchor="middle" class="phenotype">直刚毛</text>
                <text x="655" y="305" text-anchor="middle" class="phenotype">卷刚毛</text>
                <text x="735" y="305" text-anchor="middle" class="phenotype">卷刚毛</text>

                <text x="505" y="325" text-anchor="middle" class="phenotype">雌果蝇</text>
                <text x="585" y="325" text-anchor="middle" class="phenotype">雄果蝇</text>
                <text x="655" y="325" text-anchor="middle" class="phenotype">雌果蝇</text>
                <text x="735" y="325" text-anchor="middle" class="phenotype">雄果蝇</text>

                <!-- 比例 -->
                <text x="505" y="365" text-anchor="middle" class="ratio">1</text>
                <text x="545" y="365" text-anchor="middle" class="ratio">:</text>
                <text x="585" y="365" text-anchor="middle" class="ratio">1</text>
                <text x="620" y="365" text-anchor="middle" class="ratio">:</text>
                <text x="655" y="365" text-anchor="middle" class="ratio">1</text>
                <text x="695" y="365" text-anchor="middle" class="ratio">:</text>
                <text x="735" y="365" text-anchor="middle" class="ratio">1</text>

                <!-- 连线 -->
                <!-- 亲本到配子 -->
                <line x1="550" y1="120" x2="505" y2="160" class="line-auto" marker-end="url(#scene2-arrow-auto)" />
                <line x1="550" y1="120" x2="585" y2="160" class="line-auto" marker-end="url(#scene2-arrow-auto)" />
                <line x1="690" y1="120" x2="655" y2="160" class="line-auto" marker-end="url(#scene2-arrow-auto)" />
                <line x1="690" y1="120" x2="735" y2="160" class="line-auto" marker-end="url(#scene2-arrow-auto)" />

                <!-- 配子到子代 -->
                <line x1="505" y1="190" x2="505" y2="250" class="line-auto" marker-end="url(#scene2-arrow-auto)" />
                <line x1="505" y1="190" x2="585" y2="250" class="line-auto" marker-end="url(#scene2-arrow-auto)" />
                <line x1="585" y1="190" x2="655" y2="250" class="line-auto" marker-end="url(#scene2-arrow-auto)" />
                <line x1="585" y1="190" x2="735" y2="250" class="line-auto" marker-end="url(#scene2-arrow-auto)" />
                
                <line x1="655" y1="190" x2="505" y2="250" class="line-auto" marker-end="url(#scene2-arrow-auto)" />
                <line x1="655" y1="190" x2="655" y2="250" class="line-auto" marker-end="url(#scene2-arrow-auto)" />
                <line x1="735" y1="190" x2="585" y2="250" class="line-auto" marker-end="url(#scene2-arrow-auto)" />
                <line x1="735" y1="190" x2="735" y2="250" class="line-auto" marker-end="url(#scene2-arrow-auto)" />
            </g>

            <!-- 结论与高亮 -->
            <g id="scene2-group-conclusion" style="display: none; opacity: 0;">
                <line x1="85" y1="345" x2="355" y2="345" class="highlight-box" /><line x1="355" y1="345" x2="355" y2="375" class="highlight-box" /><line x1="355" y1="375" x2="85" y2="375" class="highlight-box" /><line x1="85" y1="375" x2="85" y2="345" class="highlight-box" />
                <line x1="485" y1="345" x2="755" y2="345" class="highlight-box" /><line x1="755" y1="345" x2="755" y2="375" class="highlight-box" /><line x1="755" y1="375" x2="485" y2="375" class="highlight-box" /><line x1="485" y1="375" x2="485" y2="345" class="highlight-box" />
                <text x="400" y="415" text-anchor="middle" class="conclusion">结论：两种假说下，测交后代均出现 1:1:1:1 的性状分离比，</text><text x="400" y="440" text-anchor="middle" class="conclusion">因此该测交实验无法区分基因位置。</text>
            </g>
        </svg>

        <div id="scene2-controls">
            <button id="scene2-btn-x" class="active">伴X假说</button>
            <button id="scene2-btn-auto">常染色体假说</button>
            <button id="scene2-btn-conclusion">对比结论</button>
        </div>
    </div>

    <script>
    (function() {
        const btnX = document.getElementById('scene2-btn-x');
        const btnAuto = document.getElementById('scene2-btn-auto');
        const btnConclusion = document.getElementById('scene2-btn-conclusion');
        
        const groupX = document.getElementById('scene2-group-x');
        const groupAuto = document.getElementById('scene2-group-auto');
        const groupConclusion = document.getElementById('scene2-group-conclusion');

        function show(el) {
            el.style.display = 'block';
            el.style.opacity = '1';
        }

        function hide(el) {
            el.style.display = 'none';
            el.style.opacity = '0';
        }

        btnX.addEventListener('click', () => {
            btnX.classList.add('active');
            btnAuto.classList.remove('active');
            btnConclusion.classList.remove('active');
            
            show(groupX);
            hide(groupAuto);
            hide(groupConclusion);
        });

        btnAuto.addEventListener('click', () => {
            btnX.classList.remove('active');
            btnAuto.classList.add('active');
            btnConclusion.classList.remove('active');
            
            hide(groupX);
            show(groupAuto);
            hide(groupConclusion);
        });

        btnConclusion.addEventListener('click', () => {
            btnX.classList.remove('active');
            btnAuto.classList.remove('active');
            btnConclusion.classList.add('active');
            
            show(groupX);
            show(groupAuto);
            show(groupConclusion);
        });
    })();
    </script>
</body>
</html>
