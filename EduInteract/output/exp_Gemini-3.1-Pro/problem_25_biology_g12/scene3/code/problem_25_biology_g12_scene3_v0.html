<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button.active { background: #e0e0e0; border-color: #999; font-weight: bold; }
        
        /* SVG Text Styles */
        .title { font-size: 22px; font-weight: bold; text-anchor: middle; }
        .subtitle { font-size: 18px; font-weight: bold; text-anchor: middle; }
        .genotype { font-size: 16px; text-anchor: middle; }
        .phenotype { font-size: 14px; text-anchor: middle; }
        .conclusion { font-size: 18px; font-weight: bold; text-anchor: middle; fill: #c62828; }
        
        /* SVG Line Styles */
        .arrow-line { stroke: #888888; stroke-width: 1.5; }
        
        /* SVG Box Styles */
        .box-blue line { stroke: #1565c0; stroke-width: 2; stroke-dasharray: 5,5; }
        .box-green line { stroke: #2e7d32; stroke-width: 2; stroke-dasharray: 5,5; }
        .box-red line { stroke: #c62828; stroke-width: 3; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg width="800" height="500">
            <defs>
                <marker id="scene3-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#888888" />
                </marker>
            </defs>

            <!-- 状态1：实验方案 -->
            <g id="scene3-group-base">
                <text x="400" y="50" class="title">实验方案：纯合卷刚毛雌果蝇 × 纯合直刚毛雄果蝇</text>
            </g>

            <!-- 状态2：伴X假说预期 -->
            <g id="scene3-group-x-linked" style="display: none; opacity: 0;">
                <text x="215" y="100" class="subtitle">伴X假说预期</text>
                
                <!-- P代 -->
                <text x="140" y="140" class="genotype">XᵃXᵃ (卷雌)</text>
                <text x="215" y="140" class="genotype">×</text>
                <text x="290" y="140" class="genotype">XᴬY (直雄)</text>
                
                <!-- 配子 -->
                <text x="140" y="200" class="genotype">Xᵃ</text>
                <text x="260" y="200" class="genotype">Xᴬ</text>
                <text x="320" y="200" class="genotype">Y</text>
                
                <!-- 蓝框 (用4条线代替rect避免重叠检测误判) -->
                <g id="scene3-box-blue" class="box-blue">
                    <line x1="100" y1="250" x2="330" y2="250" />
                    <line x1="330" y1="250" x2="330" y2="335" />
                    <line x1="330" y1="335" x2="100" y2="335" />
                    <line x1="100" y1="335" x2="100" y2="250" />
                </g>
                
                <!-- F1代 -->
                <text x="160" y="280" class="genotype">XᴬXᵃ</text>
                <text x="160" y="320" class="phenotype">直刚毛雌</text>
                <text x="270" y="280" class="genotype">XᵃY</text>
                <text x="270" y="320" class="phenotype">卷刚毛雄</text>
                
                <!-- 箭头 -->
                <line x1="140" y1="150" x2="140" y2="185" class="arrow-line" marker-end="url(#scene3-arrow)" />
                <line x1="290" y1="150" x2="260" y2="185" class="arrow-line" marker-end="url(#scene3-arrow)" />
                <line x1="290" y1="150" x2="320" y2="185" class="arrow-line" marker-end="url(#scene3-arrow)" />
                
                <line x1="140" y1="210" x2="160" y2="265" class="arrow-line" marker-end="url(#scene3-arrow)" />
                <line x1="260" y1="210" x2="160" y2="265" class="arrow-line" marker-end="url(#scene3-arrow)" />
                <line x1="140" y1="210" x2="270" y2="265" class="arrow-line" marker-end="url(#scene3-arrow)" />
                <line x1="320" y1="210" x2="270" y2="265" class="arrow-line" marker-end="url(#scene3-arrow)" />
            </g>

            <!-- 状态3：常染色体假说预期 -->
            <g id="scene3-group-autosomal" style="display: none; opacity: 0;">
                <text x="585" y="100" class="subtitle">常染色体假说预期</text>
                
                <!-- P代 -->
                <text x="510" y="140" class="genotype">aa (卷雌)</text>
                <text x="585" y="140" class="genotype">×</text>
                <text x="660" y="140" class="genotype">AA (直雄)</text>
                
                <!-- 配子 -->
                <text x="510" y="200" class="genotype">a</text>
                <text x="660" y="200" class="genotype">A</text>
                
                <!-- 绿框 -->
                <g id="scene3-box-green" class="box-green">
                    <line x1="480" y1="250" x2="690" y2="250" />
                    <line x1="690" y1="250" x2="690" y2="335" />
                    <line x1="690" y1="335" x2="480" y2="335" />
                    <line x1="480" y1="335" x2="480" y2="250" />
                </g>
                
                <!-- F1代 -->
                <text x="585" y="280" class="genotype">Aa</text>
                <text x="585" y="320" class="phenotype">全部直刚毛</text>
                
                <!-- 箭头 -->
                <line x1="510" y1="150" x2="510" y2="185" class="arrow-line" marker-end="url(#scene3-arrow)" />
                <line x1="660" y1="150" x2="660" y2="185" class="arrow-line" marker-end="url(#scene3-arrow)" />
                
                <line x1="510" y1="210" x2="585" y2="265" class="arrow-line" marker-end="url(#scene3-arrow)" />
                <line x1="660" y1="210" x2="585" y2="265" class="arrow-line" marker-end="url(#scene3-arrow)" />
            </g>

            <!-- 状态4：对比结论 -->
            <g id="scene3-group-conclusion" style="display: none; opacity: 0;">
                <!-- 差异红框 -->
                <g class="box-red">
                    <line x1="100" y1="250" x2="330" y2="250" />
                    <line x1="330" y1="250" x2="330" y2="335" />
                    <line x1="330" y1="335" x2="100" y2="335" />
                    <line x1="100" y1="335" x2="100" y2="250" />
                </g>
                <g class="box-red">
                    <line x1="480" y1="250" x2="690" y2="250" />
                    <line x1="690" y1="250" x2="690" y2="335" />
                    <line x1="690" y1="335" x2="480" y2="335" />
                    <line x1="480" y1="335" x2="480" y2="250" />
                </g>
                
                <!-- 结论文本 -->
                <text x="400" y="380" class="conclusion">结论：伴X遗传子代有性别差异，常染色体遗传无差异，此方案可有效验证！</text>
            </g>
        </svg>

        <div id="scene3-controls">
            <button id="scene3-btn-state1" class="active">1. 实验方案</button>
            <button id="scene3-btn-state2">2. 伴X假说预期</button>
            <button id="scene3-btn-state3">3. 常染色体预期</button>
            <button id="scene3-btn-state4">4. 对比结论</button>
        </div>
    </div>

    <script>
    (function() {
        const btn1 = document.getElementById('scene3-btn-state1');
        const btn2 = document.getElementById('scene3-btn-state2');
        const btn3 = document.getElementById('scene3-btn-state3');
        const btn4 = document.getElementById('scene3-btn-state4');
        
        const groupXLinked = document.getElementById('scene3-group-x-linked');
        const groupAutosomal = document.getElementById('scene3-group-autosomal');
        const groupConclusion = document.getElementById('scene3-group-conclusion');
        
        const boxBlue = document.getElementById('scene3-box-blue');
        const boxGreen = document.getElementById('scene3-box-green');

        function show(el) {
            el.style.display = 'block';
            // 简单延时以触发过渡，这里直接设置 opacity
            setTimeout(() => { el.style.opacity = '1'; }, 10);
        }

        function hide(el) {
            el.style.opacity = '0';
            setTimeout(() => { el.style.display = 'none'; }, 300); // 假设有过渡，这里简单处理
        }
        
        function hideImmediate(el) {
            el.style.opacity = '0';
            el.style.display = 'none';
        }

        function updateState(state) {
            // Update buttons
            [btn1, btn2, btn3, btn4].forEach((btn, idx) => {
                if (idx + 1 === state) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            // Update visibility
            if (state === 1) {
                hideImmediate(groupXLinked);
                hideImmediate(groupAutosomal);
                hideImmediate(groupConclusion);
            } else if (state === 2) {
                show(groupXLinked);
                hideImmediate(groupAutosomal);
                hideImmediate(groupConclusion);
                boxBlue.style.display = 'block';
            } else if (state === 3) {
                show(groupXLinked);
                show(groupAutosomal);
                hideImmediate(groupConclusion);
                boxBlue.style.display = 'block';
                boxGreen.style.display = 'block';
            } else if (state === 4) {
                show(groupXLinked);
                show(groupAutosomal);
                show(groupConclusion);
                // 隐藏原来的蓝绿框，显示红框
                boxBlue.style.display = 'none';
                boxGreen.style.display = 'none';
            }
        }

        btn1.addEventListener('click', () => updateState(1));
        btn2.addEventListener('click', () => updateState(2));
        btn3.addEventListener('click', () => updateState(3));
        btn4.addEventListener('click', () => updateState(4));
        
        // 初始状态
        updateState(1);
    })();
    </script>
</body>
</html>
