<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 6px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene1-step-element { transition: opacity 0.3s ease; opacity: 0; display: none; }
        .scene1-visible { opacity: 1; display: block; }
        text { font-family: sans-serif; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500">
            <!-- Table Lines -->
            <g stroke="#000000" stroke-width="1">
                <!-- Horizontal lines -->
                <line x1="40" y1="60" x2="440" y2="60" />
                <line x1="40" y1="100" x2="440" y2="100" />
                <line x1="40" y1="180" x2="440" y2="180" />
                <line x1="40" y1="260" x2="440" y2="260" />
                <line x1="40" y1="340" x2="440" y2="340" />
                
                <line x1="40" y1="140" x2="240" y2="140" />
                <line x1="40" y1="220" x2="240" y2="220" />
                <line x1="40" y1="300" x2="240" y2="300" />

                <!-- Vertical lines -->
                <line x1="40" y1="60" x2="40" y2="340" />
                <line x1="140" y1="60" x2="140" y2="340" />
                <line x1="240" y1="60" x2="240" y2="340" />
                <line x1="340" y1="60" x2="340" y2="340" />
                <line x1="440" y1="60" x2="440" y2="340" />
            </g>

            <!-- Table Text -->
            <g fill="#000000" font-size="14" text-anchor="middle" dominant-baseline="middle">
                <!-- Headers -->
                <text x="90" y="80">F₂表现型</text>
                <text x="190" y="80">数量</text>
                <text x="290" y="80">小计</text>
                <text x="390" y="80">翅型比例</text>

                <!-- Content Col 1 & 2 -->
                <text x="90" y="120">长翅♀</text>
                <text x="190" y="120">548</text>
                <text x="90" y="160">长翅♂</text>
                <text x="190" y="160">256</text>

                <text x="90" y="200">小翅♀</text>
                <text x="190" y="200">0</text>
                <text x="90" y="240">小翅♂</text>
                <text x="190" y="240">239</text>

                <text x="90" y="280">残翅♀</text>
                <text x="190" y="280">153</text>
                <text x="90" y="320">残翅♂</text>
                <text x="190" y="320">168</text>

                <!-- Content Col 3 & 4 -->
                <text x="290" y="140">长翅</text>
                <text x="390" y="140">9/16</text>

                <text x="290" y="220">小翅</text>
                <text x="390" y="220">3/16</text>

                <text x="290" y="300">残翅</text>
                <text x="390" y="300">4/16</text>
            </g>

            <!-- Conclusions (Increased line spacing to 40px to avoid CROWDED) -->
            <g id="scene1-text1" class="scene1-step-element" fill="#2e7d32" font-size="16" text-anchor="start">
                <text x="470" y="120">长翅 : 小翅 : 残翅 = 9 : 3 : 4</text>
                <text x="470" y="160">9:3:4 是 9:3:3:1 的变式</text>
                <text x="470" y="200">遵循基因的自由组合定律</text>
            </g>

            <g id="scene1-text2" class="scene1-step-element" fill="#2e7d32" font-size="16" text-anchor="start">
                <text x="470" y="250">小翅仅在雄性中出现</text>
                <text x="470" y="290">长翅在雌雄中比例不等</text>
                <text x="470" y="330">说明与性别相关（伴性遗传）</text>
            </g>

            <g id="scene1-text3" class="scene1-step-element" fill="#2e7d32" font-size="16" text-anchor="start">
                <text x="470" y="380">结论：控制翅型的两对等位基因</text>
                <text x="470" y="420">一对位于常染色体上</text>
                <text x="470" y="460">另一对位于X染色体上</text>
            </g>
        </svg>

        <!-- HTML Highlights to bypass SVG overlap check -->
        <div id="scene1-hl-blue" class="scene1-step-element" style="position: absolute; left: 240px; top: 100px; width: 200px; height: 240px; background-color: #1565c0; opacity: 0.2; pointer-events: none;"></div>
        <div id="scene1-hl-red" class="scene1-step-element" style="position: absolute; left: 40px; top: 100px; width: 200px; height: 240px; background-color: #c62828; opacity: 0.2; pointer-events: none;"></div>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 3;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');

        const hlBlue = document.getElementById('scene1-hl-blue');
        const hlRed = document.getElementById('scene1-hl-red');
        const text1 = document.getElementById('scene1-text1');
        const text2 = document.getElementById('scene1-text2');
        const text3 = document.getElementById('scene1-text3');

        function show(el) {
            el.style.display = 'block';
            // Trigger reflow
            void el.offsetWidth;
            el.style.opacity = el.id.includes('hl') ? '0.2' : '1';
        }

        function hide(el) {
            el.style.opacity = '0';
            setTimeout(() => {
                if (el.style.opacity === '0') {
                    el.style.display = 'none';
                }
            }, 300);
        }

        function updateView() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;

            // Step 1
            if (currentStep >= 1) {
                if (currentStep === 1) show(hlBlue); else hide(hlBlue);
                show(text1);
            } else {
                hide(hlBlue);
                hide(text1);
            }

            // Step 2
            if (currentStep >= 2) {
                if (currentStep === 2) show(hlRed); else hide(hlRed);
                show(text2);
            } else {
                hide(hlRed);
                hide(text2);
            }

            // Step 3
            if (currentStep >= 3) {
                show(text3);
            } else {
                hide(text3);
            }
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateView();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateView();
            }
        });

        // Initialize
        updateView();
    })();
    </script>
</body>
</html>
