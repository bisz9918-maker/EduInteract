<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .scene3-element { transition: opacity 0.5s ease, transform 1s ease; }
        .scene3-hidden { opacity: 0; pointer-events: none; }
        
        .scene3-cell { stroke: #000000; stroke-width: 2; fill: rgba(0,0,0,0.1); }
        .scene3-x-chrom { stroke: #1565c0; stroke-width: 2; fill: rgba(21,101,192,0.1); rx: 8; ry: 8; }
        .scene3-y-chrom { stroke: #000000; stroke-width: 2; fill: rgba(0,0,0,0.1); rx: 8; ry: 8; }
        .scene3-sry { fill: #c62828; rx: 8; ry: 8; }
        .scene3-gene { fill: #2e7d32; font-weight: bold; font-size: 16px; font-family: monospace; }
        .scene3-text { fill: #000000; font-size: 14px; }
        .scene3-arrow { stroke: #888888; stroke-width: 2; fill: none; marker-end: url(#scene3-arrowhead); }
        .scene3-highlight { stroke: #c62828; stroke-width: 2; fill: none; }
        
        .scene3-line-sry { stroke: #c62828; stroke-width: 1; stroke-dasharray: 2,2; }
        .scene3-line-gene { stroke: #2e7d32; stroke-width: 1; stroke-dasharray: 2,2; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg width="800" height="500" id="scene3-svg">
            <defs>
                <marker id="scene3-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#888888" />
                </marker>
            </defs>

            <!-- Step 0: I2 Cell -->
            <g id="scene3-step0-group" class="scene3-element">
                <text x="150" y="130" text-anchor="middle" class="scene3-text">Ⅰ2 初级精母细胞</text>
                <circle cx="150" cy="220" r="70" class="scene3-cell" />
                <rect x="115" y="170" width="16" height="100" class="scene3-x-chrom" />
                <line x1="40" y1="220" x2="115" y2="220" class="scene3-line-gene" />
                <text x="35" y="225" text-anchor="end" class="scene3-gene">R</text>
                <rect x="165" y="230" width="16" height="40" class="scene3-y-chrom" />
                
                <!-- SRY Segment (will move) -->
                <g id="scene3-sry-group" class="scene3-element">
                    <rect x="165" y="210" width="16" height="20" class="scene3-sry" />
                    <line x1="181" y1="220" x2="240" y2="220" class="scene3-line-sry" />
                    <text x="245" y="225" class="scene3-text" fill="#c62828">SRY</text>
                </g>
            </g>

            <!-- Step 1: Translocation -->
            <g id="scene3-step1-group" class="scene3-element scene3-hidden">
                <path d="M 165 200 Q 145 180 125 160" class="scene3-arrow" />
                <text x="145" y="150" text-anchor="middle" class="scene3-text" fill="#888888">易位</text>
            </g>

            <!-- Step 2: Meiosis & Eggs -->
            <g id="scene3-step2-group" class="scene3-element scene3-hidden">
                <!-- Meiosis Arrow -->
                <path d="M 240 280 L 330 280" class="scene3-arrow" />
                <text x="285" y="270" text-anchor="middle" class="scene3-text" fill="#888888">减数分裂</text>

                <!-- Abnormal Sperm -->
                <text x="375" y="165" text-anchor="middle" class="scene3-text">异常精子</text>
                <ellipse cx="375" cy="220" rx="35" ry="45" class="scene3-cell" />
                <path d="M 375 265 Q 375 300 400 320" stroke="#000" stroke-width="2" fill="none" opacity="0.1" />
                <rect x="367" y="190" width="16" height="60" class="scene3-x-chrom" />
                <rect x="367" y="175" width="16" height="15" class="scene3-sry" />
                <line x1="383" y1="182" x2="410" y2="182" class="scene3-line-sry" />
                <text x="415" y="187" class="scene3-text" fill="#c62828">SRY</text>
                <line x1="340" y1="220" x2="367" y2="220" class="scene3-line-gene" />
                <text x="335" y="225" text-anchor="end" class="scene3-gene">R</text>

                <!-- Egg 1 -->
                <text x="550" y="90" text-anchor="middle" class="scene3-text">Ⅰ1 卵细胞</text>
                <circle cx="550" cy="140" r="40" class="scene3-cell" />
                <rect x="542" y="120" width="16" height="40" class="scene3-x-chrom" />
                <line x1="510" y1="140" x2="542" y2="140" class="scene3-line-gene" />
                <text x="505" y="145" text-anchor="end" class="scene3-gene">R</text>

                <!-- Egg 2 -->
                <text x="700" y="90" text-anchor="middle" class="scene3-text">Ⅰ1 卵细胞</text>
                <circle cx="700" cy="140" r="40" class="scene3-cell" />
                <rect x="692" y="120" width="16" height="40" class="scene3-x-chrom" />
                <line x1="660" y1="140" x2="692" y2="140" class="scene3-line-gene" />
                <text x="655" y="145" text-anchor="end" class="scene3-gene">r</text>
            </g>

            <!-- Step 3: Fertilization -->
            <g id="scene3-step3-group" class="scene3-element scene3-hidden">
                <!-- Fertilization Arrows -->
                <path d="M 410 220 Q 480 220 520 280" class="scene3-arrow" />
                <path d="M 550 190 L 550 260" class="scene3-arrow" />
                <path d="M 410 220 Q 550 220 670 280" class="scene3-arrow" />
                <path d="M 700 190 L 700 260" class="scene3-arrow" />
                
                <text x="480" y="210" text-anchor="middle" class="scene3-text" fill="#888888">受精</text>

                <!-- Zygote 1 -->
                <text x="550" y="410" text-anchor="middle" class="scene3-text">受精卵 (Ⅱ4)</text>
                <circle cx="550" cy="340" r="50" class="scene3-cell" />
                <rect x="530" y="310" width="16" height="60" class="scene3-x-chrom" />
                <line x1="500" y1="340" x2="530" y2="340" class="scene3-line-gene" />
                <text x="495" y="345" text-anchor="end" class="scene3-gene">R</text>
                <rect x="560" y="310" width="16" height="60" class="scene3-x-chrom" />
                <rect x="560" y="295" width="16" height="15" class="scene3-sry" />
                <line x1="576" y1="302" x2="600" y2="302" class="scene3-line-sry" />
                <text x="605" y="307" class="scene3-text" fill="#c62828">SRY</text>
                <line x1="576" y1="340" x2="600" y2="340" class="scene3-line-gene" />
                <text x="605" y="345" text-anchor="start" class="scene3-gene">R</text>
                <rect x="558" y="330" width="20" height="20" class="scene3-highlight" />

                <!-- Zygote 2 -->
                <text x="700" y="410" text-anchor="middle" class="scene3-text">受精卵 (Ⅱ4)</text>
                <circle cx="700" cy="340" r="50" class="scene3-cell" />
                <rect x="680" y="310" width="16" height="60" class="scene3-x-chrom" />
                <line x1="650" y1="340" x2="680" y2="340" class="scene3-line-gene" />
                <text x="645" y="345" text-anchor="end" class="scene3-gene">r</text>
                <rect x="710" y="310" width="16" height="60" class="scene3-x-chrom" />
                <rect x="710" y="295" width="16" height="15" class="scene3-sry" />
                <line x1="726" y1="302" x2="740" y2="302" class="scene3-line-sry" />
                <text x="745" y="307" class="scene3-text" fill="#c62828">SRY</text>
                <line x1="726" y1="340" x2="740" y2="340" class="scene3-line-gene" />
                <text x="745" y="345" text-anchor="start" class="scene3-gene">R</text>
                <rect x="708" y="330" width="20" height="20" class="scene3-highlight" />

                <!-- Conclusion -->
                <text x="400" y="460" text-anchor="middle" class="scene3-text" font-weight="bold">
                    结论：Ⅱ4 必然获得父亲的 X<tspan dy="-5" font-size="10">R</tspan><tspan dy="5"> 基因，患色盲概率为 0</tspan>
                </text>
            </g>
        </svg>

        <div id="scene3-controls">
            <button id="scene3-prev-btn" disabled>◀ 上一步</button>
            <button id="scene3-next-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 3;

        const prevBtn = document.getElementById('scene3-prev-btn');
        const nextBtn = document.getElementById('scene3-next-btn');
        
        const step1Group = document.getElementById('scene3-step1-group');
        const step2Group = document.getElementById('scene3-step2-group');
        const step3Group = document.getElementById('scene3-step3-group');
        const sryGroup = document.getElementById('scene3-sry-group');

        function updateScene() {
            prevBtn.disabled = currentStep === 0;
            nextBtn.disabled = currentStep === maxStep;

            if (currentStep >= 1) {
                step1Group.classList.remove('scene3-hidden');
                sryGroup.style.transform = 'translate(-50px, -60px)';
            } else {
                step1Group.classList.add('scene3-hidden');
                sryGroup.style.transform = 'translate(0px, 0px)';
            }

            if (currentStep >= 2) {
                step2Group.classList.remove('scene3-hidden');
            } else {
                step2Group.classList.add('scene3-hidden');
            }

            if (currentStep >= 3) {
                step3Group.classList.remove('scene3-hidden');
            } else {
                step3Group.classList.add('scene3-hidden');
            }
        }

        prevBtn.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });

        updateScene();
    })();
    </script>
</body>
</html>
