<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .scene2-text { font-size: 16px; text-anchor: middle; dominant-baseline: middle; fill: #333; }
        .scene2-label { font-size: 18px; font-weight: bold; text-anchor: middle; dominant-baseline: middle; fill: #000; }
        .scene2-genotype { font-size: 16px; text-anchor: middle; dominant-baseline: middle; fill: #1565c0; font-family: "Times New Roman", Times, serif; font-style: italic; }
        .scene2-genotype tspan { font-size: 12px; font-style: normal; }
        
        .scene2-box { fill: rgba(255, 255, 255, 0.9); stroke: #888; stroke-width: 1; rx: 8; ry: 8; }
        .scene2-box-text { font-size: 16px; text-anchor: middle; dominant-baseline: middle; fill: #333; }
        
        .scene2-arrow { fill: none; stroke-width: 2; marker-end: url(#scene2-arrowhead-red); }
        .scene2-arrow-blue { fill: none; stroke-width: 2; marker-end: url(#scene2-arrowhead-blue); stroke: #1565c0; }
        .scene2-arrow-red { fill: none; stroke-width: 2; marker-end: url(#scene2-arrowhead-red); stroke: #c62828; }
        
        .scene2-line-red { fill: none; stroke: #c62828; stroke-width: 2; }
        .scene2-line-blue { fill: none; stroke: #1565c0; stroke-width: 2; }
        .scene2-line-gray { fill: none; stroke: #888888; stroke-width: 2; stroke-dasharray: 5,5; }
        
        .scene2-anim-line { stroke-dasharray: 1000; stroke-dashoffset: 1000; }
        .scene2-anim-line.active { animation: scene2-draw 1.5s forwards linear; }
        
        @keyframes scene2-draw {
            to { stroke-dashoffset: 0; }
        }
        
        .scene2-hidden { display: none !important; opacity: 0 !important; }
        .scene2-fade { transition: opacity 0.3s ease; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500">
            <defs>
                <marker id="scene2-arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#c62828" />
                </marker>
                <marker id="scene2-arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0" />
                </marker>
                
                <g id="scene2-mouse-white">
                    <ellipse cx="0" cy="0" rx="20" ry="12" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
                    <circle cx="-15" cy="-5" r="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
                    <circle cx="-20" cy="-10" r="4" fill="#ffffff" stroke="#000000" stroke-width="1"/>
                    <circle cx="-10" cy="-12" r="4" fill="#ffffff" stroke="#000000" stroke-width="1"/>
                    <path d="M 20 0 Q 35 -10 40 5" fill="none" stroke="#000000" stroke-width="1.5"/>
                </g>
                
                <g id="scene2-mouse-black">
                    <ellipse cx="0" cy="0" rx="20" ry="12" fill="#424242" stroke="#000000" stroke-width="1.5"/>
                    <circle cx="-15" cy="-5" r="8" fill="#424242" stroke="#000000" stroke-width="1.5"/>
                    <circle cx="-20" cy="-10" r="4" fill="#424242" stroke="#000000" stroke-width="1"/>
                    <circle cx="-10" cy="-12" r="4" fill="#424242" stroke="#000000" stroke-width="1"/>
                    <path d="M 20 0 Q 35 -10 40 5" fill="none" stroke="#000000" stroke-width="1.5"/>
                </g>
            </defs>

            <!-- Step 0: Base Elements -->
            <g id="scene2-step0">
                <text x="100" y="50" class="scene2-label">P</text>
                
                <use href="#scene2-mouse-white" x="250" y="40" />
                <text x="250" y="75" class="scene2-text">白毛♂</text>
                
                <text x="400" y="50" class="scene2-label">×</text>
                
                <use href="#scene2-mouse-black" x="550" y="40" />
                <text x="550" y="75" class="scene2-text">黑毛♀</text>
            </g>

            <!-- Step 1: F1 and Cross Inheritance -->
            <g id="scene2-step1" class="scene2-hidden scene2-fade">
                <text x="100" y="410" class="scene2-label">F1</text>
                
                <use href="#scene2-mouse-white" x="300" y="390" />
                <text x="300" y="425" class="scene2-text">白毛♀</text>
                
                <use href="#scene2-mouse-black" x="500" y="390" />
                <text x="500" y="425" class="scene2-text">黑毛♂</text>
                
                <!-- Cross inheritance arrows -->
                <path d="M 250 105 Q 150 230 280 370" class="scene2-arrow-red" />
                <path d="M 550 105 Q 650 230 520 370" class="scene2-arrow-blue" />
                
                <!-- Step 1 Text Box -->
                <rect x="180" y="180" width="440" height="100" class="scene2-box" />
                <text x="400" y="210" class="scene2-box-text" font-weight="bold">交叉遗传现象</text>
                <text x="400" y="250" class="scene2-box-text">父亲的性状传给女儿，母亲的性状传给儿子</text>
            </g>

            <!-- Step 2: Genotypes and Deduction -->
            <g id="scene2-step2" class="scene2-hidden scene2-fade">
                <!-- Genotypes -->
                <text x="250" y="105" class="scene2-genotype">X<tspan dy="-5">B</tspan><tspan dy="5"> Y</tspan></text>
                <text x="550" y="105" class="scene2-genotype">X<tspan dy="-5">b</tspan><tspan dy="5"> X</tspan><tspan dy="-5">b</tspan></text>
                
                <text x="300" y="455" class="scene2-genotype">X<tspan dy="-5">B</tspan><tspan dy="5"> X</tspan><tspan dy="-5">b</tspan></text>
                <text x="500" y="455" class="scene2-genotype">X<tspan dy="-5">b</tspan><tspan dy="5"> Y</tspan></text>
                
                <!-- Step 2 Text Box -->
                <rect x="150" y="180" width="500" height="120" class="scene2-box" />
                <text x="400" y="210" class="scene2-box-text" font-weight="bold">基因型推导</text>
                <text x="400" y="245" class="scene2-box-text">白毛♂(X<tspan dy="-5">B</tspan><tspan dy="5">Y) 将 X</tspan><tspan dy="-5">B</tspan><tspan dy="5"> 传给女儿，表现为白毛♀</tspan></text>
                <text x="400" y="275" class="scene2-box-text">黑毛♀(X<tspan dy="-5">b</tspan><tspan dy="5">X</tspan><tspan dy="-5">b</tspan><tspan dy="5">) 将 X</tspan><tspan dy="-5">b</tspan><tspan dy="5"> 传给儿子，表现为黑毛♂</tspan></text>
            </g>

            <!-- Step 3: Gametes and Inheritance Lines -->
            <g id="scene2-step3" class="scene2-hidden scene2-fade">
                <text x="100" y="240" class="scene2-label">配子</text>
                
                <!-- Gametes -->
                <circle cx="200" cy="240" r="25" fill="#ffffff" stroke="#c62828" stroke-width="1.5" />
                <text x="200" y="240" class="scene2-genotype">X<tspan dy="-5">B</tspan></text>
                
                <circle cx="300" cy="240" r="25" fill="#ffffff" stroke="#1565c0" stroke-width="1.5" />
                <text x="300" y="240" class="scene2-genotype">Y</text>
                
                <circle cx="500" cy="240" r="25" fill="#ffffff" stroke="#888888" stroke-width="1.5" />
                <text x="500" y="240" class="scene2-genotype">X<tspan dy="-5">b</tspan></text>
                
                <circle cx="600" cy="240" r="25" fill="#ffffff" stroke="#888888" stroke-width="1.5" />
                <text x="600" y="240" class="scene2-genotype">X<tspan dy="-5">b</tspan></text>
                
                <!-- Lines P to Gametes -->
                <path d="M 240 120 L 200 215" class="scene2-line-red scene2-anim-line" />
                <path d="M 260 120 L 300 215" class="scene2-line-blue scene2-anim-line" />
                
                <path d="M 540 120 L 500 215" class="scene2-line-gray scene2-anim-line" />
                <path d="M 560 120 L 600 215" class="scene2-line-gray scene2-anim-line" />
                
                <!-- Lines Gametes to F1 -->
                <path d="M 200 265 L 290 385" class="scene2-line-red scene2-anim-line" />
                <path d="M 500 265 L 310 385" class="scene2-line-gray scene2-anim-line" />
                
                <path d="M 600 265 L 510 385" class="scene2-line-gray scene2-anim-line" />
                <path d="M 300 265 L 490 385" class="scene2-line-blue scene2-anim-line" />
            </g>
        </svg>

        <div id="scene2-controls">
            <button id="scene2-btn-prev" disabled>◀ 上一步</button>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 3;
        
        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        
        const step1 = document.getElementById('scene2-step1');
        const step2 = document.getElementById('scene2-step2');
        const step3 = document.getElementById('scene2-step3');
        
        const animLines = document.querySelectorAll('.scene2-anim-line');
        
        function updateScene() {
            // Reset all
            step1.classList.add('scene2-hidden');
            step2.classList.add('scene2-hidden');
            step3.classList.add('scene2-hidden');
            
            animLines.forEach(line => line.classList.remove('active'));
            
            if (currentStep >= 1) {
                step1.classList.remove('scene2-hidden');
            }
            if (currentStep >= 2) {
                // Hide step 1 arrows and box when in step 2 or 3
                const step1Arrows = step1.querySelectorAll('path');
                const step1Box = step1.querySelectorAll('rect, text.scene2-box-text');
                step1Arrows.forEach(el => el.style.display = 'none');
                step1Box.forEach(el => el.style.display = 'none');
                
                step2.classList.remove('scene2-hidden');
            } else {
                // Restore step 1 elements
                const step1Arrows = step1.querySelectorAll('path');
                const step1Box = step1.querySelectorAll('rect, text.scene2-box-text');
                step1Arrows.forEach(el => el.style.display = '');
                step1Box.forEach(el => el.style.display = '');
            }
            
            if (currentStep >= 3) {
                // Hide step 2 box when in step 3
                const step2Box = step2.querySelectorAll('rect, text.scene2-box-text');
                step2Box.forEach(el => el.style.display = 'none');
                
                step3.classList.remove('scene2-hidden');
                // Trigger animation
                setTimeout(() => {
                    animLines.forEach(line => line.classList.add('active'));
                }, 50);
            } else {
                // Restore step 2 box
                const step2Box = step2.querySelectorAll('rect, text.scene2-box-text');
                step2Box.forEach(el => el.style.display = '');
            }
            
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
        }
        
        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });
        
        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });
        
        // Initialize
        updateScene();
    })();
    </script>
</body>
</html>
