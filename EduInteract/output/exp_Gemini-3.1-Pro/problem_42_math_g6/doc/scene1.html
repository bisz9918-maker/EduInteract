<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .grid-line { stroke: #000; stroke-width: 2; fill: none; }
        .text-label { font-size: 16px; text-anchor: middle; dominant-baseline: middle; fill: #000; }
        .text-blue { fill: #1565c0; font-weight: bold; }
        .text-red { fill: #c62828; font-weight: bold; }
        .text-green { fill: #2e7d32; font-weight: bold; font-size: 24px; }
        .highlight-blue { fill: #1565c0; opacity: 0.2; }
        .highlight-red { fill: #c62828; opacity: 0.2; }
        .highlight-green { fill: #2e7d32; opacity: 0.2; }
        .guide-line-blue { stroke: #1565c0; stroke-width: 2; stroke-dasharray: 5,5; fill: none; marker-end: url(#scene1-arrow-blue); }
        .guide-line-red { stroke: #c62828; stroke-width: 2; stroke-dasharray: 5,5; fill: none; marker-end: url(#scene1-arrow-red); }
        .step-element { transition: opacity 0.3s ease; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500">
            <defs>
                <marker id="scene1-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0" />
                </marker>
                <marker id="scene1-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828" />
                </marker>
                
                <!-- Highlight rects defined in defs to avoid bounding box overlap with text -->
                <rect id="hl-blue-1" width="30" height="60" class="highlight-blue" />
                <rect id="hl-blue-2" width="30" height="30" class="highlight-blue" />
                <rect id="hl-blue-3" width="30" height="30" class="highlight-blue" />
                <rect id="hl-red-1" width="30" height="60" class="highlight-red" />
                <rect id="hl-red-2" width="30" height="30" class="highlight-red" />
                <rect id="hl-green-1" width="60" height="60" class="highlight-green" />
                <rect id="hl-green-2" width="60" height="60" class="highlight-green" />
                <rect id="hl-green-3" width="60" height="60" class="highlight-green" />
                <rect id="hl-green-4" width="60" height="60" class="highlight-green" />
            </defs>

            <!-- 基础网格 (Step 0) -->
            <g id="scene1-base">
                <!-- 主视图 -->
                <text x="245" y="65" class="text-label">主视图</text>
                <!-- 主视图网格 -->
                <line x1="200" y1="80" x2="230" y2="80" class="grid-line" />
                <line x1="200" y1="110" x2="290" y2="110" class="grid-line" />
                <line x1="200" y1="140" x2="290" y2="140" class="grid-line" />
                <line x1="200" y1="80" x2="200" y2="140" class="grid-line" />
                <line x1="230" y1="80" x2="230" y2="140" class="grid-line" />
                <line x1="260" y1="110" x2="260" y2="140" class="grid-line" />
                <line x1="290" y1="110" x2="290" y2="140" class="grid-line" />

                <!-- 左视图 -->
                <text x="530" y="65" class="text-label">左视图</text>
                <!-- 左视图网格 -->
                <line x1="500" y1="80" x2="530" y2="80" class="grid-line" />
                <line x1="500" y1="110" x2="560" y2="110" class="grid-line" />
                <line x1="500" y1="140" x2="560" y2="140" class="grid-line" />
                <line x1="500" y1="80" x2="500" y2="140" class="grid-line" />
                <line x1="530" y1="80" x2="530" y2="140" class="grid-line" />
                <line x1="560" y1="110" x2="560" y2="140" class="grid-line" />

                <!-- 俯视图 -->
                <text x="400" y="130" class="text-label">俯视图</text>
                <!-- 俯视图网格 -->
                <line x1="310" y1="240" x2="490" y2="240" class="grid-line" />
                <line x1="310" y1="300" x2="490" y2="300" class="grid-line" />
                <line x1="310" y1="360" x2="370" y2="360" class="grid-line" />
                <line x1="310" y1="240" x2="310" y2="360" class="grid-line" />
                <line x1="370" y1="240" x2="370" y2="360" class="grid-line" />
                <line x1="430" y1="240" x2="430" y2="300" class="grid-line" />
                <line x1="490" y1="240" x2="490" y2="300" class="grid-line" />
            </g>

            <!-- Step 1: 主视图定列高 -->
            <g id="scene1-step1" class="step-element" style="opacity: 0; display: none;">
                <!-- 高亮遮罩 -->
                <use href="#hl-blue-1" x="200" y="80" />
                <use href="#hl-blue-2" x="230" y="110" />
                <use href="#hl-blue-3" x="260" y="110" />
                
                <!-- 引导线 -->
                <line x1="215" y1="145" x2="215" y2="180" class="guide-line-blue" style="marker-end: none;" />
                <line x1="215" y1="180" x2="340" y2="180" class="guide-line-blue" style="marker-end: none;" />
                <line x1="340" y1="180" x2="340" y2="235" class="guide-line-blue" />
                
                <line x1="245" y1="145" x2="245" y2="190" class="guide-line-blue" style="marker-end: none;" />
                <line x1="245" y1="190" x2="400" y2="190" class="guide-line-blue" style="marker-end: none;" />
                <line x1="400" y1="190" x2="400" y2="235" class="guide-line-blue" />
                
                <line x1="275" y1="145" x2="275" y2="200" class="guide-line-blue" style="marker-end: none;" />
                <line x1="275" y1="200" x2="460" y2="200" class="guide-line-blue" style="marker-end: none;" />
                <line x1="460" y1="200" x2="460" y2="235" class="guide-line-blue" />

                <!-- 文本 -->
                <text x="270" y="390" class="text-label text-blue">列高：</text>
                <text x="340" y="390" class="text-label text-blue">2</text>
                <text x="400" y="390" class="text-label text-blue">1</text>
                <text x="460" y="390" class="text-label text-blue">1</text>
            </g>

            <!-- Step 2: 左视图定行高 -->
            <g id="scene1-step2" class="step-element" style="opacity: 0; display: none;">
                <!-- 高亮遮罩 -->
                <use href="#hl-red-1" x="500" y="80" />
                <use href="#hl-red-2" x="530" y="110" />
                
                <!-- 引导线 -->
                <line x1="515" y1="145" x2="515" y2="270" class="guide-line-red" style="marker-end: none;" />
                <line x1="515" y1="270" x2="495" y2="270" class="guide-line-red" />
                
                <line x1="545" y1="145" x2="545" y2="330" class="guide-line-red" style="marker-end: none;" />
                <line x1="545" y1="330" x2="375" y2="330" class="guide-line-red" />

                <!-- 文本 -->
                <text x="230" y="270" class="text-label text-red">行高：</text>
                <text x="280" y="270" class="text-label text-red">2</text>
                <text x="280" y="330" class="text-label text-red">1</text>
            </g>

            <!-- Step 3: 推导右侧 -->
            <g id="scene1-step3" class="step-element" style="opacity: 0; display: none;">
                <!-- 高亮遮罩 -->
                <use href="#hl-green-1" x="370" y="240" />
                <use href="#hl-green-2" x="430" y="240" />
                
                <!-- 数字 -->
                <text x="400" y="270" class="text-label text-green">1</text>
                <text x="460" y="270" class="text-label text-green">1</text>
            </g>

            <!-- Step 4: 推导左侧 -->
            <g id="scene1-step4" class="step-element" style="opacity: 0; display: none;">
                <!-- 高亮遮罩 -->
                <use href="#hl-green-3" x="310" y="240" />
                <use href="#hl-green-4" x="310" y="300" />
                
                <!-- 数字 -->
                <text x="340" y="270" class="text-label text-green">2</text>
                <text x="340" y="330" class="text-label text-green">1</text>
            </g>

            <!-- Step 5: 求和 -->
            <g id="scene1-step5" class="step-element" style="opacity: 0; display: none;">
                <text x="400" y="450" class="text-label text-green">2 + 1 + 1 + 1 = 5</text>
            </g>
        </svg>
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 5;
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');

        function updateScene() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;

            // Reset all
            for (let i = 1; i <= maxStep; i++) {
                const el = document.getElementById('scene1-step' + i);
                if (el) {
                    el.style.opacity = '0';
                    el.style.display = 'none';
                    // Reset highlights inside
                    const highlights = el.querySelectorAll('use');
                    highlights.forEach(h => h.style.display = 'none');
                }
            }

            // Show current step elements
            for (let i = 1; i <= currentStep; i++) {
                const el = document.getElementById('scene1-step' + i);
                if (el) {
                    el.style.display = 'block';
                    // Use setTimeout to allow display:block to apply before changing opacity for transition
                    setTimeout(() => {
                        el.style.opacity = '1';
                    }, 10);
                    
                    // Show highlights only for the active step (except step 5 which has no highlights)
                    if (i === currentStep && i < 5) {
                        const highlights = el.querySelectorAll('use');
                        highlights.forEach(h => h.style.display = 'block');
                    }
                }
            }
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });

        // Initialize
        updateScene();
    })();
    </script>
</body>
</html>
