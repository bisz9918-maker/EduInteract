<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 20px; left: 0; right: 0; display: flex; justify-content: center; gap: 20px; z-index: 10; }
        button { padding: 8px 16px; font-size: 16px; cursor: pointer; border: 1px solid #ccc; background: #f0f0f0; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .text-bold { font-weight: bold; }
        .fade { transition: opacity 0.3s ease, fill 0.3s ease; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500">
            <defs>
                <linearGradient id="scene1-grad-mixed" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="50%" stop-color="#c62828" />
                    <stop offset="50%" stop-color="#1565c0" />
                </linearGradient>
                <linearGradient id="scene1-grad-blue-red" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#1565c0" />
                    <stop offset="100%" stop-color="#c62828" />
                </linearGradient>
                <linearGradient id="scene1-grad-red-blue" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#c62828" />
                    <stop offset="100%" stop-color="#1565c0" />
                </linearGradient>
            </defs>

            <!-- 标题 -->
            <text id="scene1-title" x="400" y="60" font-size="24" text-anchor="middle" class="text-bold">血液流经某器官的示意图</text>

            <!-- 填充区域 (底层) -->
            <polygon id="scene1-fill-a" points="150,220 304.6,220 304.6,280 150,280" fill="transparent" opacity="0.3" class="fade" />
            <path id="scene1-fill-b" d="M 304.6 220 A 100 100 0 0 1 495.4 220 L 495.4 280 A 100 100 0 0 1 304.6 280 Z" fill="transparent" opacity="0.3" class="fade" />
            <polygon id="scene1-fill-c" points="495.4,220 650,220 650,280 495.4,280" fill="transparent" opacity="0.3" class="fade" />

            <!-- 管道轮廓 -->
            <line x1="150" y1="220" x2="304.6" y2="220" stroke="#000" stroke-width="2" />
            <line x1="150" y1="280" x2="304.6" y2="280" stroke="#000" stroke-width="2" />
            <path d="M 304.6 220 A 100 100 0 0 1 495.4 220" fill="none" stroke="#000" stroke-width="2" />
            <path d="M 304.6 280 A 100 100 0 0 0 495.4 280" fill="none" stroke="#000" stroke-width="2" />
            <line x1="495.4" y1="220" x2="650" y2="220" stroke="#000" stroke-width="2" />
            <line x1="495.4" y1="280" x2="650" y2="280" stroke="#000" stroke-width="2" />

            <!-- 箭头 -->
            <line x1="170" y1="250" x2="250" y2="250" stroke="#000" stroke-width="2" marker-end="url(#scene1-arrow)" />
            <line x1="550" y1="250" x2="630" y2="250" stroke="#000" stroke-width="2" marker-end="url(#scene1-arrow)" />
            <defs>
                <marker id="scene1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#000" />
                </marker>
            </defs>

            <!-- 静态标签 -->
            <text x="225" y="205" font-size="20" text-anchor="middle">a</text>
            <text x="400" y="140" font-size="20" text-anchor="middle">b</text>
            <text x="575" y="205" font-size="20" text-anchor="middle">c</text>

            <!-- 动态文本 -->
            <text id="scene1-vessel-a-name" x="225" y="310" font-size="16" text-anchor="middle" class="fade" opacity="0"></text>
            <text id="scene1-blood-a-type" x="225" y="350" font-size="16" text-anchor="middle" class="fade" opacity="0"></text>
            
            <text id="scene1-organ-b-name" x="400" y="380" font-size="20" text-anchor="middle" class="fade" opacity="0"></text>
            
            <text id="scene1-vessel-c-name" x="575" y="310" font-size="16" text-anchor="middle" class="fade" opacity="0"></text>
            <text id="scene1-blood-c-type" x="575" y="350" font-size="16" text-anchor="middle" class="fade" opacity="0"></text>

            <!-- 判定结果 -->
            <text id="scene1-result" x="720" y="270" font-size="60" text-anchor="middle" class="text-bold fade" opacity="0"></text>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        const steps = [
            {
                title: "血液流经某器官的示意图",
                fillA: "transparent", fillB: "transparent", fillC: "transparent",
                vesselAName: "", bloodAType: "", bloodAColor: "#000",
                organBName: "",
                vesselCName: "", bloodCType: "", bloodCColor: "#000",
                result: "", resultColor: "#000"
            },
            {
                title: "选项A：若b为心脏",
                fillA: "url(#scene1-grad-mixed)", fillB: "url(#scene1-grad-mixed)", fillC: "url(#scene1-grad-mixed)",
                vesselAName: "静脉", bloodAType: "静脉血 或 动脉血", bloodAColor: "#000",
                organBName: "心脏",
                vesselCName: "动脉", bloodCType: "静脉血 或 动脉血", bloodCColor: "#000",
                result: "×", resultColor: "#c62828"
            },
            {
                title: "选项B：若b为肺",
                fillA: "#1565c0", fillB: "url(#scene1-grad-blue-red)", fillC: "#c62828",
                vesselAName: "肺动脉", bloodAType: "静脉血", bloodAColor: "#1565c0",
                organBName: "肺 (肺泡毛细血管)",
                vesselCName: "肺静脉", bloodCType: "动脉血", bloodCColor: "#c62828",
                result: "×", resultColor: "#c62828"
            },
            {
                title: "选项C：若b为小肠",
                fillA: "#c62828", fillB: "url(#scene1-grad-red-blue)", fillC: "#1565c0",
                vesselAName: "肠动脉", bloodAType: "动脉血", bloodAColor: "#c62828",
                organBName: "小肠 (毛细血管)",
                vesselCName: "肠静脉", bloodCType: "静脉血", bloodCColor: "#1565c0",
                result: "×", resultColor: "#c62828"
            },
            {
                title: "选项D：若b为组织细胞",
                fillA: "#c62828", fillB: "url(#scene1-grad-red-blue)", fillC: "#1565c0",
                vesselAName: "体动脉", bloodAType: "动脉血", bloodAColor: "#c62828",
                organBName: "组织细胞",
                vesselCName: "体静脉", bloodCType: "静脉血", bloodCColor: "#1565c0",
                result: "√", resultColor: "#2e7d32"
            }
        ];

        let currentStep = 0;

        const els = {
            title: document.getElementById('scene1-title'),
            fillA: document.getElementById('scene1-fill-a'),
            fillB: document.getElementById('scene1-fill-b'),
            fillC: document.getElementById('scene1-fill-c'),
            vesselAName: document.getElementById('scene1-vessel-a-name'),
            bloodAType: document.getElementById('scene1-blood-a-type'),
            organBName: document.getElementById('scene1-organ-b-name'),
            vesselCName: document.getElementById('scene1-vessel-c-name'),
            bloodCType: document.getElementById('scene1-blood-c-type'),
            result: document.getElementById('scene1-result'),
            btnPrev: document.getElementById('scene1-btn-prev'),
            btnNext: document.getElementById('scene1-btn-next')
        };

        function updateScene() {
            const step = steps[currentStep];
            
            els.title.textContent = step.title;
            
            els.fillA.setAttribute('fill', step.fillA);
            els.fillB.setAttribute('fill', step.fillB);
            els.fillC.setAttribute('fill', step.fillC);

            const updateText = (el, text, color) => {
                el.textContent = text;
                if (color) el.setAttribute('fill', color);
                el.style.opacity = text ? "1" : "0";
            };

            updateText(els.vesselAName, step.vesselAName);
            updateText(els.bloodAType, step.bloodAType, step.bloodAColor);
            updateText(els.organBName, step.organBName);
            updateText(els.vesselCName, step.vesselCName);
            updateText(els.bloodCType, step.bloodCType, step.bloodCColor);
            updateText(els.result, step.result, step.resultColor);

            els.btnPrev.disabled = currentStep === 0;
            els.btnNext.disabled = currentStep === steps.length - 1;
        }

        els.btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        els.btnNext.addEventListener('click', () => {
            if (currentStep < steps.length - 1) {
                currentStep++;
                updateScene();
            }
        });

        // Initialize
        updateScene();
    })();
    </script>
</body>
</html>
