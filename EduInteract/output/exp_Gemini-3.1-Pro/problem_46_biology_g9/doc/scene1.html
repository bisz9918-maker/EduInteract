<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 6px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene1-text { font-size: 16px; font-family: sans-serif; text-anchor: middle; dominant-baseline: middle; transition: all 0.3s; }
        .scene1-label { font-size: 18px; font-weight: bold; text-anchor: middle; dominant-baseline: middle; }
        .scene1-line { stroke: #000; stroke-width: 2; transition: all 0.3s; }
        .scene1-dashed { stroke: #888; stroke-width: 2; stroke-dasharray: 5,5; transition: all 0.3s; }
        .scene1-arrow { fill: none; stroke: #000; stroke-width: 1.5; marker-end: url(#scene1-arrowhead); }
        .scene1-anim { transition: all 0.8s ease-in-out; }
        .scene1-step-text { opacity: 0; transition: opacity 0.3s; font-size: 16px; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <defs>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#000" />
                </marker>
            </defs>
            
            <!-- Left DNA (Fixed) -->
            <g id="scene1-dna-left">
                <!-- Top backbone -->
                <g id="scene1-bond-intact">
                    <line x1="60" y1="210" x2="205" y2="210" class="scene1-line top-strand-line" />
                </g>
                <g id="scene1-bond-broken" style="display: none; opacity: 0;" class="scene1-anim">
                    <line x1="60" y1="210" x2="92" y2="210" class="scene1-line top-strand-line" />
                    <line x1="103" y1="210" x2="205" y2="210" class="scene1-line top-strand-line" />
                </g>
                
                <!-- Bottom backbone -->
                <line x1="60" y1="290" x2="205" y2="290" class="scene1-line" />
                
                <!-- Hydrogen bonds -->
                <line x1="80" y1="210" x2="80" y2="290" class="scene1-line" />
                <line x1="115" y1="210" x2="115" y2="290" class="scene1-line" />
                <line x1="150" y1="210" x2="150" y2="290" class="scene1-line" />
                <line x1="185" y1="210" x2="185" y2="290" class="scene1-line" />
                
                <!-- Top bases -->
                <text x="80" y="175" class="scene1-text top-strand-text base-cg">C</text>
                <text x="115" y="175" class="scene1-text top-strand-text">T</text>
                <text x="150" y="175" class="scene1-text top-strand-text base-cg">G</text>
                <text x="185" y="175" class="scene1-text top-strand-text base-cg">C</text>
                
                <!-- Bottom bases -->
                <text x="80" y="325" class="scene1-text base-cg">G</text>
                <text x="115" y="325" class="scene1-text">A</text>
                <text x="150" y="325" class="scene1-text base-cg">C</text>
                <text x="185" y="325" class="scene1-text base-cg">G</text>
            </g>

            <!-- Middle DNA (Dashed) -->
            <g id="scene1-dna-mid" class="scene1-anim">
                <line x1="205" y1="210" x2="275" y2="210" class="scene1-dashed top-strand-line" />
                <line x1="205" y1="290" x2="275" y2="290" class="scene1-dashed" />
            </g>

            <!-- Right DNA Top (Animatable) -->
            <g id="scene1-dna-right-top" class="scene1-anim">
                <line x1="275" y1="210" x2="420" y2="210" class="scene1-line top-strand-line" />
                <line x1="295" y1="210" x2="295" y2="250" class="scene1-line" />
                <line x1="330" y1="210" x2="330" y2="250" class="scene1-line" />
                <line x1="365" y1="210" x2="365" y2="250" class="scene1-line" />
                <line x1="400" y1="210" x2="400" y2="250" class="scene1-line" />
                
                <text x="295" y="175" class="scene1-text top-strand-text base-cg">C</text>
                <text x="330" y="175" class="scene1-text top-strand-text">T</text>
                <text x="365" y="175" class="scene1-text top-strand-text">T</text>
                <text x="400" y="175" class="scene1-text top-strand-text">A</text>
            </g>

            <!-- Right DNA Bottom (Animatable) -->
            <g id="scene1-dna-right-bottom" class="scene1-anim">
                <line x1="275" y1="290" x2="420" y2="290" class="scene1-line" />
                <line x1="295" y1="250" x2="295" y2="290" class="scene1-line" />
                <line x1="330" y1="250" x2="330" y2="290" class="scene1-line" />
                <line x1="365" y1="250" x2="365" y2="290" class="scene1-line" />
                <line x1="400" y1="250" x2="400" y2="290" class="scene1-line" />
                
                <text x="295" y="325" class="scene1-text base-cg">G</text>
                <text x="330" y="325" class="scene1-text">A</text>
                <text x="365" y="325" class="scene1-text">A</text>
                <text x="400" y="325" class="scene1-text">T</text>
            </g>

            <!-- Labels -->
            <g id="scene1-labels">
                <text x="97.5" y="130" class="scene1-label">①</text>
                <line x1="97.5" y1="145" x2="97.5" y2="200" class="scene1-arrow" />
                
                <text x="205" y="250" class="scene1-label">②</text>
                <line x1="215" y1="250" x2="255" y2="250" class="scene1-arrow" />
            </g>

            <!-- Enzymes -->
            <g id="scene1-enzymes" style="opacity: 0; display: none;" class="scene1-anim">
                <text x="97.5" y="225" class="scene1-text" style="fill: #c62828; font-size: 20px;">✂️</text>
                <text x="240" y="250" class="scene1-text" style="fill: #1565c0; font-size: 20px;">✂️</text>
            </g>

            <!-- Right Text Area -->
            <foreignObject x="460" y="160" width="320" height="260">
                <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 16px; line-height: 1.5;">
                    <div id="scene1-text-step1" class="scene1-step-text" style="display: none;">
                        <strong>【选项A分析】</strong><br/>
                        ①处为磷酸二酯键，是限制酶的作用位点。<br/>
                        ②处为氢键，是解旋酶的作用位点。<br/>
                        <span style="color: #c62828;">结论：A错误</span>
                    </div>
                    <div id="scene1-text-step2" class="scene1-step-text" style="display: none; margin-top: 10px;">
                        <strong>【双链碱基比例】</strong><br/>
                        已知全部碱基中 C 占 30%。<br/>
                        根据双链DNA碱基互补配对原则：<br/>
                        C = G = 30%<br/>
                        A = T = 50% - 30% = 20%
                    </div>
                    <div id="scene1-text-step3" class="scene1-step-text" style="display: none; margin-top: 10px;">
                        <strong>【单链碱基比例】</strong><br/>
                        双链中 (C+G)/(A+T) = (30%+30%)/(20%+20%) = 60%/40% = 3:2。<br/>
                        由于单链的 (C+G)/(A+T) 比例等于双链的该比例，<br/>
                        因此该基因的一条核苷酸链中 (C+G)/(A+T) 为 3:2。<br/>
                        <span style="color: #1565c0;">结论：B正确</span>
                    </div>
                </div>
            </foreignObject>
        </svg>
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator" style="line-height: 30px; font-size: 14px;">1 / 4</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    <script>
    (function() {
        let currentStep = 0;
        const totalSteps = 3;
        
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        
        const enzymes = document.getElementById('scene1-enzymes');
        const bondIntact = document.getElementById('scene1-bond-intact');
        const bondBroken = document.getElementById('scene1-bond-broken');
        const dnaMid = document.getElementById('scene1-dna-mid');
        const dnaRightTop = document.getElementById('scene1-dna-right-top');
        const dnaRightBottom = document.getElementById('scene1-dna-right-bottom');
        
        const textStep1 = document.getElementById('scene1-text-step1');
        const textStep2 = document.getElementById('scene1-text-step2');
        const textStep3 = document.getElementById('scene1-text-step3');

        function updateScene() {
            stepIndicator.textContent = `${currentStep + 1} / ${totalSteps + 1}`;
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps;
            
            // Reset animations and visibility
            enzymes.style.opacity = '0';
            setTimeout(() => { if(currentStep === 0 || currentStep >= 2) enzymes.style.display = 'none'; }, 300);
            
            dnaMid.style.opacity = '1';
            dnaRightTop.setAttribute('transform', 'translate(0,0)');
            dnaRightBottom.setAttribute('transform', 'translate(0,0)');
            
            bondIntact.style.display = 'block';
            bondIntact.style.opacity = '1';
            bondBroken.style.opacity = '0';
            setTimeout(() => { if(currentStep === 0 || currentStep >= 2) bondBroken.style.display = 'none'; }, 300);
            
            // Reset highlights
            document.querySelectorAll('.scene1-text').forEach(el => {
                el.style.fill = '';
                el.style.fontWeight = '';
            });
            document.querySelectorAll('.scene1-line, .scene1-dashed').forEach(el => {
                el.style.stroke = '';
                el.style.strokeWidth = '';
            });
            
            // Reset texts
            textStep1.style.display = 'none';
            textStep1.style.opacity = '0';
            textStep2.style.display = 'none';
            textStep2.style.opacity = '0';
            textStep3.style.display = 'none';
            textStep3.style.opacity = '0';
            
            // Apply step states
            if (currentStep >= 1) {
                enzymes.style.display = 'block';
                setTimeout(() => enzymes.style.opacity = '1', 50);
                
                dnaMid.style.opacity = '0';
                dnaRightTop.setAttribute('transform', 'translate(0,-30)');
                dnaRightBottom.setAttribute('transform', 'translate(0,30)');
                
                bondIntact.style.display = 'none';
                bondIntact.style.opacity = '0';
                bondBroken.style.display = 'block';
                setTimeout(() => bondBroken.style.opacity = '1', 50);
                
                textStep1.style.display = 'block';
                setTimeout(() => textStep1.style.opacity = '1', 50);
            }
            
            if (currentStep >= 2) {
                // Revert DNA split and hide enzymes
                enzymes.style.opacity = '0';
                dnaMid.style.opacity = '1';
                dnaRightTop.setAttribute('transform', 'translate(0,0)');
                dnaRightBottom.setAttribute('transform', 'translate(0,0)');
                
                bondIntact.style.display = 'block';
                bondIntact.style.opacity = '1';
                bondBroken.style.opacity = '0';
                
                // Highlight C/G bases
                document.querySelectorAll('.base-cg').forEach(el => {
                    el.style.fill = '#f57c00';
                    el.style.fontWeight = 'bold';
                });
                
                textStep2.style.display = 'block';
                setTimeout(() => textStep2.style.opacity = '1', 50);
            }
            
            if (currentStep >= 3) {
                // Highlight top strand
                document.querySelectorAll('.top-strand-text').forEach(el => {
                    el.style.fill = '#1565c0';
                    el.style.fontWeight = 'bold';
                });
                document.querySelectorAll('.top-strand-line').forEach(el => {
                    el.style.stroke = '#1565c0';
                    el.style.strokeWidth = '3';
                });
                
                textStep3.style.display = 'block';
                setTimeout(() => textStep3.style.opacity = '1', 50);
            }
        }
        
        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });
        
        btnNext.addEventListener('click', () => {
            if (currentStep < totalSteps) {
                currentStep++;
                updateScene();
            }
        });
        
        updateScene();
    })();
    </script>
</body>
</html>
