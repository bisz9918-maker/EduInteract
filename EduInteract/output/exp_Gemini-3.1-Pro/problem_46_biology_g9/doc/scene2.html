<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f8f9fa; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button:hover:not(:disabled) { background: #e2e6ea; }
        
        /* SVG 样式 */
        .dna-line { stroke-width: 2; }
        .dna-base-pair { stroke-width: 1; stroke: #888; }
        .text-label { font-size: 14px; text-anchor: middle; dominant-baseline: middle; }
        .text-label-left { font-size: 14px; text-anchor: end; dominant-baseline: middle; }
        .text-label-right { font-size: 14px; text-anchor: start; dominant-baseline: middle; }
        .text-conclusion { font-size: 18px; font-weight: bold; text-anchor: middle; dominant-baseline: middle; }
        .arrow-line { stroke: #888; stroke-width: 2; marker-end: url(#arrow); }
        .triangle-area { stroke-dasharray: 5,5; stroke-width: 1; }
        
        /* 颜色类 */
        .color-normal { stroke: #1565c0; fill: #1565c0; }
        .color-mutant { stroke: #c62828; fill: #c62828; }
        .color-text { fill: #333; }
        
        /* 动画过渡 */
        .fade { transition: opacity 0.4s ease; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" id="scene2-svg">
            <defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#888" />
                </marker>
            </defs>

            <!-- 初始DNA -->
            <g id="scene2-init-dna" class="fade">
                <!-- 碱基对连线 -->
                <line x1="320" y1="80" x2="320" y2="110" class="dna-base-pair" />
                <line x1="340" y1="80" x2="340" y2="110" class="dna-base-pair" />
                <line x1="360" y1="80" x2="360" y2="110" class="dna-base-pair" />
                <line x1="380" y1="80" x2="380" y2="110" class="dna-base-pair" />
                <line x1="420" y1="80" x2="420" y2="110" class="dna-base-pair" />
                <line x1="440" y1="80" x2="440" y2="110" class="dna-base-pair" />
                <line x1="460" y1="80" x2="460" y2="110" class="dna-base-pair" />
                <line x1="480" y1="80" x2="480" y2="110" class="dna-base-pair" />
                
                <!-- 链 -->
                <line id="scene2-init-top-chain" x1="300" y1="80" x2="500" y2="80" class="dna-line color-normal" />
                <line id="scene2-init-bottom-chain" x1="300" y1="110" x2="500" y2="110" class="dna-line color-normal" />
                
                <!-- 碱基文本 -->
                <text id="scene2-init-top-base" x="400" y="70" class="text-label color-normal">T</text>
                <text id="scene2-init-bottom-base" x="400" y="120" class="text-label color-normal">A</text>
                
                <!-- 标签 -->
                <text x="290" y="95" class="text-label-left color-text">初始DNA</text>
            </g>

            <!-- 单点突变标签 -->
            <g id="scene2-mutant-label" class="fade" style="opacity: 0;">
                <text x="510" y="75" class="text-label-right color-mutant">单点突变</text>
            </g>

            <!-- 第1次复制 -->
            <g id="scene2-rep1" class="fade" style="opacity: 0;">
                <!-- 箭头 -->
                <line x1="350" y1="120" x2="200" y2="180" class="arrow-line" />
                <line x1="450" y1="120" x2="600" y2="180" class="arrow-line" />
                <text x="400" y="160" class="text-label color-text">第1次复制</text>

                <!-- 左子代DNA (正常) -->
                <g id="scene2-child-left">
                    <line x1="160" y1="200" x2="160" y2="230" class="dna-base-pair" />
                    <line x1="180" y1="200" x2="180" y2="230" class="dna-base-pair" />
                    <line x1="220" y1="200" x2="220" y2="230" class="dna-base-pair" />
                    <line x1="240" y1="200" x2="240" y2="230" class="dna-base-pair" />
                    
                    <line x1="150" y1="200" x2="250" y2="200" class="dna-line color-normal" />
                    <line x1="150" y1="230" x2="250" y2="230" class="dna-line color-normal" />
                    <text x="200" y="190" class="text-label color-normal">T</text>
                    <text x="200" y="240" class="text-label color-normal">A</text>
                </g>

                <!-- 右子代DNA (突变) -->
                <g id="scene2-child-right">
                    <line x1="560" y1="200" x2="560" y2="230" class="dna-base-pair" />
                    <line x1="580" y1="200" x2="580" y2="230" class="dna-base-pair" />
                    <line x1="620" y1="200" x2="620" y2="230" class="dna-base-pair" />
                    <line x1="640" y1="200" x2="640" y2="230" class="dna-base-pair" />
                    
                    <line x1="550" y1="200" x2="650" y2="200" class="dna-line color-mutant" />
                    <line x1="550" y1="230" x2="650" y2="230" class="dna-line color-mutant" />
                    <text x="600" y="190" class="text-label color-mutant">A</text>
                    <text x="600" y="240" class="text-label color-mutant">T</text>
                </g>
            </g>

            <!-- 第n次复制 -->
            <g id="scene2-rep-n" class="fade" style="opacity: 0;">
                <text x="400" y="300" class="text-label color-text">第n次复制</text>
                
                <!-- 左区域 -->
                <polygon points="200,260 120,340 280,340" class="triangle-area color-normal" fill-opacity="0.1" />
                <text x="200" y="360" class="text-label color-normal">正常DNA</text>
                
                <!-- 右区域 -->
                <polygon points="600,260 520,340 680,340" class="triangle-area color-mutant" fill-opacity="0.1" />
                <text x="600" y="360" class="text-label color-mutant">突变DNA</text>
                
                <!-- 结论 -->
                <text x="400" y="410" class="text-conclusion color-text">
                    经过 n 次复制，突变DNA占总数的 <tspan class="color-mutant">1/2</tspan>，选项C<tspan class="color-mutant">错误</tspan>
                </text>
            </g>
        </svg>

        <div id="scene2-controls">
            <button id="scene2-btn-prev" disabled>◀ 上一步</button>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 3;
        
        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        
        const initTopChain = document.getElementById('scene2-init-top-chain');
        const initTopBase = document.getElementById('scene2-init-top-base');
        const mutantLabel = document.getElementById('scene2-mutant-label');
        const rep1 = document.getElementById('scene2-rep1');
        const repN = document.getElementById('scene2-rep-n');
        
        function show(el) {
            el.style.display = '';
            // 强制重绘以确保过渡动画生效
            el.getBoundingClientRect();
            el.style.opacity = '1';
        }
        
        function hide(el) {
            el.style.opacity = '0';
            // 延迟隐藏以等待过渡动画完成
            setTimeout(() => {
                if (el.style.opacity === '0') {
                    el.style.display = 'none';
                }
            }, 400);
        }

        function updateScene() {
            // 按钮状态
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
            
            // 步骤 0: 初始状态
            if (currentStep === 0) {
                initTopChain.setAttribute('class', 'dna-line color-normal');
                initTopBase.setAttribute('class', 'text-label color-normal');
                initTopBase.textContent = 'T';
                hide(mutantLabel);
                hide(rep1);
                hide(repN);
            }
            
            // 步骤 1: 单点突变
            if (currentStep === 1) {
                initTopChain.setAttribute('class', 'dna-line color-mutant');
                initTopBase.setAttribute('class', 'text-label color-mutant');
                initTopBase.textContent = 'A';
                show(mutantLabel);
                hide(rep1);
                hide(repN);
            }
            
            // 步骤 2: 第1次复制
            if (currentStep === 2) {
                initTopChain.setAttribute('class', 'dna-line color-mutant');
                initTopBase.setAttribute('class', 'text-label color-mutant');
                initTopBase.textContent = 'A';
                hide(mutantLabel);
                show(rep1);
                hide(repN);
            }
            
            // 步骤 3: 第n次复制
            if (currentStep === 3) {
                initTopChain.setAttribute('class', 'dna-line color-mutant');
                initTopBase.setAttribute('class', 'text-label color-mutant');
                initTopBase.textContent = 'A';
                hide(mutantLabel);
                show(rep1);
                show(repN);
            }
        }
        
        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });
        
        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });
        
        // 初始化
        updateScene();
    })();
    </script>
</body>
</html>
