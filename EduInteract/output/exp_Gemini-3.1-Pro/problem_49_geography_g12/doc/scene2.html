<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; transition: all 0.2s; }
        button.active { background: #1565c0; color: white; border-color: #1565c0; }
        .math { font-family: 'Times New Roman', Times, serif; }
        g { transition: opacity 0.3s ease; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500">
            <defs>
                <marker id="scene2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828" />
                </marker>
                <marker id="scene2-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32" />
                </marker>
            </defs>

            <!-- State 1: Solar Elevation -->
            <g id="scene2-state1">
                <!-- Formulas -->
                <text x="50" y="80" font-size="16" fill="#000">正午太阳高度角计算公式：</text>
                <text x="50" y="120" font-size="16" fill="#000">H = 90° - |当地纬度 ± 直射点纬度|</text>
                <text x="50" y="160" font-size="16" fill="#000">H = 90° - (30.5° + 20°) = 39.5°</text>

                <!-- Earth Profile -->
                <circle cx="450" cy="250" r="160" fill="#1565c0" fill-opacity="0.1" stroke="#000" stroke-width="2" />
                
                <!-- Equator -->
                <line x1="281" y1="312" x2="619" y2="188" stroke="#888" stroke-width="2" stroke-dasharray="5,5" />
                <text x="250" y="320" font-size="14" fill="#888">赤道</text>

                <!-- Subsolar point S line -->
                <line x1="450" y1="250" x2="610" y2="250" stroke="#c62828" stroke-width="2" />
                <text x="620" y="255" font-size="14" fill="#c62828">20°S</text>

                <!-- Target point T line -->
                <line x1="450" y1="250" x2="552" y2="126" stroke="#1565c0" stroke-width="2" />
                <!-- Moved text to avoid overlapping with circle and line -->
                <text x="480" y="100" font-size="14" fill="#1565c0">30.5°N</text>

                <!-- Horizon -->
                <line x1="459" y1="50" x2="645" y2="202" stroke="#000" stroke-width="2" />
                <text x="450" y="45" font-size="14" fill="#000">地平面</text>

                <!-- Solar ray T -->
                <line x1="750" y1="126" x2="552" y2="126" stroke="#c62828" stroke-width="2" marker-end="url(#scene2-arrow)" />
                <text x="700" y="115" font-size="14" fill="#c62828">太阳光</text>

                <!-- Solar ray S -->
                <line x1="750" y1="250" x2="610" y2="250" stroke="#c62828" stroke-width="2" marker-end="url(#scene2-arrow)" />
                <text x="700" y="240" font-size="14" fill="#c62828">太阳光</text>

                <!-- Elevation angle H -->
                <path d="M 592 126 A 40 40 0 0 1 582.8 151.4" fill="none" stroke="#2e7d32" stroke-width="2" />
                <!-- Moved text to avoid overlapping with line -->
                <text x="620" y="135" font-size="14" fill="#2e7d32">H=39.5°</text>

                <!-- Latitude diff 20° -->
                <path d="M 490 250 A 40 40 0 0 0 487.6 236.3" fill="none" stroke="#2e7d32" stroke-width="2" />
                <!-- Moved text to avoid overlapping with circle and line -->
                <text x="495" y="235" font-size="14" fill="#2e7d32">20°</text>

                <!-- Latitude diff 30.5° -->
                <path d="M 506.4 229.5 A 60 60 0 0 0 488.2 203.7" fill="none" stroke="#2e7d32" stroke-width="2" />
                <!-- Moved text to avoid overlapping with circle and line -->
                <text x="515" y="210" font-size="14" fill="#2e7d32">30.5°</text>
            </g>

            <!-- State 2: Local Time -->
            <g id="scene2-state2" style="display: none; opacity: 0;">
                <!-- Formulas -->
                <text x="100" y="80" font-size="16" fill="#000">经度差计算：</text>
                <text x="100" y="120" font-size="16" fill="#000">Δλ = 114.5°E - 60°E = 54.5°</text>

                <text x="100" y="370" font-size="16" fill="#000">时间差计算：</text>
                <text x="100" y="410" font-size="16" fill="#000">Δt = 54.5° × 4分钟/° = 218分钟 = 3小时38分钟</text>
                <text x="100" y="450" font-size="16" fill="#000">地方时 = 12:00 + 3小时38分钟 = 15:38</text>

                <!-- Longitude axis -->
                <line x1="100" y1="250" x2="700" y2="250" stroke="#888" stroke-width="2" />
                
                <!-- Axis ticks -->
                <line x1="150" y1="245" x2="150" y2="255" stroke="#888" stroke-width="2" />
                <text x="150" y="270" font-size="14" fill="#888" text-anchor="middle">0°</text>
                
                <line x1="250" y1="245" x2="250" y2="255" stroke="#888" stroke-width="2" />
                <text x="250" y="270" font-size="14" fill="#888" text-anchor="middle">30°E</text>
                
                <line x1="350" y1="245" x2="350" y2="255" stroke="#888" stroke-width="2" />
                <text x="350" y="270" font-size="14" fill="#888" text-anchor="middle">60°E</text>
                
                <line x1="450" y1="245" x2="450" y2="255" stroke="#888" stroke-width="2" />
                <text x="450" y="270" font-size="14" fill="#888" text-anchor="middle">90°E</text>
                
                <line x1="550" y1="245" x2="550" y2="255" stroke="#888" stroke-width="2" />
                <text x="550" y="270" font-size="14" fill="#888" text-anchor="middle">120°E</text>
                
                <line x1="650" y1="245" x2="650" y2="255" stroke="#888" stroke-width="2" />
                <text x="650" y="270" font-size="14" fill="#888" text-anchor="middle">150°E</text>

                <!-- Subsolar point S (axis) -->
                <circle cx="350" cy="250" r="5" fill="#c62828" />
                <text x="350" y="220" font-size="14" fill="#c62828" text-anchor="middle">直射点 (60°E)</text>
                <text x="350" y="290" font-size="14" fill="#c62828" text-anchor="middle">12:00</text>

                <!-- Target point T (axis) -->
                <circle cx="532" cy="250" r="5" fill="#1565c0" />
                <text x="532" y="220" font-size="14" fill="#1565c0" text-anchor="middle">目标地 (114.5°E)</text>
                <text x="532" y="290" font-size="14" fill="#1565c0" text-anchor="middle">15:38</text>

                <!-- Longitude diff arrow -->
                <line x1="355" y1="170" x2="527" y2="170" stroke="#2e7d32" stroke-width="2" marker-start="url(#scene2-arrow-green)" marker-end="url(#scene2-arrow-green)" />
                <text x="441" y="155" font-size="14" fill="#2e7d32" text-anchor="middle">Δλ = 54.5°</text>

                <!-- Time diff arrow -->
                <line x1="355" y1="330" x2="527" y2="330" stroke="#2e7d32" stroke-width="2" marker-start="url(#scene2-arrow-green)" marker-end="url(#scene2-arrow-green)" />
                <text x="441" y="350" font-size="14" fill="#2e7d32" text-anchor="middle">Δt = 3小时38分钟</text>
            </g>
        </svg>

        <div id="scene2-controls">
            <button id="scene2-btn-state1" class="active">正午太阳高度计算</button>
            <button id="scene2-btn-state2">地方时计算</button>
        </div>
    </div>

    <script>
    (function() {
        const btnState1 = document.getElementById('scene2-btn-state1');
        const btnState2 = document.getElementById('scene2-btn-state2');
        const state1 = document.getElementById('scene2-state1');
        const state2 = document.getElementById('scene2-state2');

        function show(el) {
            el.style.display = '';
            // trigger reflow
            void el.offsetWidth;
            el.style.opacity = '1';
        }

        function hide(el) {
            el.style.opacity = '0';
            setTimeout(() => {
                if (el.style.opacity === '0') {
                    el.style.display = 'none';
                }
            }, 300);
        }

        btnState1.addEventListener('click', () => {
            btnState1.classList.add('active');
            btnState2.classList.remove('active');
            show(state1);
            hide(state2);
        });

        btnState2.addEventListener('click', () => {
            btnState2.classList.add('active');
            btnState1.classList.remove('active');
            show(state2);
            hide(state1);
        });
    })();
    </script>
</body>
</html>
