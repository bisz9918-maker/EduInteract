<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        button { padding: 6px 12px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene2-step-indicator { font-size: 14px; font-weight: bold; width: 80px; text-align: center; }
        
        /* Transitions */
        .fade { transition: opacity 0.3s ease-in-out; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500">
            <defs>
                <marker id="scene2-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828" />
                </marker>
                <marker id="scene2-arrow-global" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828" opacity="0.4" />
                </marker>
            </defs>

            <!-- Step 0: Base Map -->
            <g id="scene2-step0-group">
                <!-- Earth -->
                <circle cx="350" cy="230" r="180" fill="#e3f2fd" fill-opacity="0.3" stroke="#000000" stroke-width="1.5" />
                <!-- Night Hemisphere -->
                <path d="M 350 50 A 180 180 0 0 0 350 410 Z" fill="#000000" fill-opacity="0.1" />
                
                <!-- Axis -->
                <line x1="401.8" y1="36.8" x2="298.2" y2="423.2" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5" />
                <text x="380" y="40" font-size="14" fill="#888888">地轴</text>
                
                <!-- Equator -->
                <line x1="176.1" y1="183.4" x2="523.9" y2="276.6" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5" />
                <text x="140" y="180" font-size="14" fill="#888888">赤道</text>
                
                <!-- Terminator -->
                <line x1="350" y1="50" x2="350" y2="410" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5" />
                <text x="260" y="45" font-size="14" fill="#888888">晨昏线</text>
                
                <!-- Global Solar Rays -->
                <g id="scene2-global-rays" class="fade">
                    <line x1="700" y1="80" x2="550" y2="80" stroke="#c62828" stroke-width="1.5" stroke-opacity="0.4" marker-end="url(#scene2-arrow-global)" />
                    <line x1="700" y1="155" x2="550" y2="155" stroke="#c62828" stroke-width="1.5" stroke-opacity="0.4" marker-end="url(#scene2-arrow-global)" />
                    <line x1="700" y1="230" x2="550" y2="230" stroke="#c62828" stroke-width="1.5" stroke-opacity="0.4" marker-end="url(#scene2-arrow-global)" />
                    <line x1="700" y1="305" x2="550" y2="305" stroke="#c62828" stroke-width="1.5" stroke-opacity="0.4" marker-end="url(#scene2-arrow-global)" />
                    <line x1="700" y1="380" x2="550" y2="380" stroke="#c62828" stroke-width="1.5" stroke-opacity="0.4" marker-end="url(#scene2-arrow-global)" />
                    <text x="710" y="235" font-size="14" fill="#c62828" fill-opacity="0.6">太阳光线</text>
                </g>
            </g>

            <!-- Step 1: Points -->
            <g id="scene2-step1-group" class="fade" style="opacity: 0; display: none;">
                <!-- Point A -->
                <circle cx="530" cy="230" r="4" fill="#c62828" />
                <text x="550" y="220" font-size="14" fill="#000000">A</text>
                <text x="540" y="255" font-size="14" fill="#000000">15°N</text>
                
                <!-- Point B -->
                <circle cx="350" cy="410" r="4" fill="#c62828" />
                <text x="335" y="435" font-size="14" fill="#000000">B</text>
                <text x="365" y="435" font-size="14" fill="#000000">75°S</text>
                
                <!-- Point C -->
                <circle cx="440" cy="74.1" r="4" fill="#c62828" />
                <text x="425" y="45" font-size="14" fill="#000000">C</text>
                <text x="450" y="50" font-size="14" fill="#000000">75°N</text>
            </g>

            <!-- Step 2: Linear Velocity -->
            <g id="scene2-step2-group" class="fade" style="opacity: 0; display: none;">
                <!-- Rotation Radii -->
                <line x1="362.1" y1="185.0" x2="530" y2="230" stroke="#1565c0" stroke-width="2" />
                <line x1="305.0" y1="397.9" x2="350" y2="410" stroke="#1565c0" stroke-width="2" />
                <line x1="395.0" y1="62.1" x2="440" y2="74.1" stroke="#1565c0" stroke-width="2" />
                
                <!-- Conclusion Text -->
                <text x="50" y="380" font-size="16" font-weight="bold" fill="#1565c0">线速度 A &gt; B = C</text>
            </g>

            <!-- Step 3: Solar Altitude -->
            <g id="scene2-step3-group" class="fade" style="opacity: 0; display: none;">
                <!-- Ground Planes -->
                <line x1="530" y1="170" x2="530" y2="290" stroke="#2e7d32" stroke-width="2" />
                <line x1="290" y1="410" x2="410" y2="410" stroke="#2e7d32" stroke-width="2" />
                <line x1="405.4" y1="54.1" x2="474.6" y2="94.1" stroke="#2e7d32" stroke-width="2" />
                
                <!-- Noon Rays -->
                <line x1="630" y1="230" x2="534" y2="230" stroke="#c62828" stroke-width="2" marker-end="url(#scene2-arrow-red)" />
                <line x1="450" y1="410" x2="354" y2="410" stroke="#c62828" stroke-width="2" marker-end="url(#scene2-arrow-red)" />
                <line x1="540" y1="74.1" x2="444" y2="74.1" stroke="#c62828" stroke-width="2" marker-end="url(#scene2-arrow-red)" />
                
                <!-- Angle Arcs -->
                <path d="M 530 210 A 20 20 0 0 1 550 230" fill="none" stroke="#2e7d32" stroke-width="1.5" />
                <text x="545" y="200" font-size="14" fill="#2e7d32">H=90°</text>
                
                <path d="M 470 74.1 A 30 30 0 0 1 466 89.1" fill="none" stroke="#2e7d32" stroke-width="1.5" />
                <text x="520" y="125" font-size="14" fill="#2e7d32">H=30°</text>
                
                <text x="540" y="400" font-size="14" fill="#2e7d32">H=0°</text>
                
                <!-- Conclusion Text -->
                <text x="50" y="410" font-size="16" font-weight="bold" fill="#2e7d32">正午太阳高度 A &gt; C &gt; B</text>
            </g>
        </svg>

        <div id="scene2-controls">
            <button id="scene2-btn-prev" disabled>◀ 上一步</button>
            <div id="scene2-step-indicator">步骤 1 / 4</div>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const totalSteps = 4;
        
        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        const stepIndicator = document.getElementById('scene2-step-indicator');
        
        const step1Group = document.getElementById('scene2-step1-group');
        const step2Group = document.getElementById('scene2-step2-group');
        const step3Group = document.getElementById('scene2-step3-group');
        const globalRays = document.getElementById('scene2-global-rays');
        
        function show(el) {
            el.style.display = '';
            // trigger reflow
            void el.offsetWidth;
            el.style.opacity = '1';
        }
        
        function hide(el) {
            el.style.opacity = '0';
            setTimeout(() => {
                if (el.style.opacity === '0') {
                    el.style.display = 'none';
                }
            }, 300);
        }
        
        function updateScene() {
            stepIndicator.textContent = `步骤 ${currentStep + 1} / ${totalSteps}`;
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps - 1;
            
            // Step 1
            if (currentStep >= 1) {
                show(step1Group);
            } else {
                hide(step1Group);
            }
            
            // Step 2
            if (currentStep === 2) {
                show(step2Group);
            } else {
                hide(step2Group);
            }
            
            // Step 3
            if (currentStep === 3) {
                show(step3Group);
                globalRays.style.opacity = '0.1';
            } else {
                hide(step3Group);
                globalRays.style.opacity = '1';
            }
        }
        
        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });
        
        btnNext.addEventListener('click', () => {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateScene();
            }
        });
        
        // Initialize
        updateScene();
    })();
    </script>
</body>
</html>
