<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f8f9fa; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button:hover:not(:disabled) { background: #e2e6ea; }
        
        /* 结论面板 */
        #scene1-conclusion {
            position: absolute;
            top: 30px;
            left: 30px;
            width: 280px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            font-size: 14px;
            line-height: 1.6;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        
        /* SVG 样式 */
        .scene1-text { font-size: 14px; fill: #000; user-select: none; }
        .scene1-text-shadow { text-shadow: 1px 1px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff; }
        
        /* 动画和过渡 */
        .scene1-fade { transition: opacity 0.3s, fill 0.3s, stroke 0.3s, stroke-width 0.3s; }
        
        @keyframes scene1-swing {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(3deg); }
            100% { transform: rotate(0deg); }
        }
        .scene1-anim-swing {
            transform-origin: 650px 420px;
            animation: scene1-swing 1s ease-in-out;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <div id="scene1-conclusion"></div>
        
        <svg width="800" height="500" id="scene1-svg">
            <!-- 极昼高亮区 (Step 3) -->
            <path id="scene1-polar-day" class="scene1-fade" d="M 650 420 L 250 420 A 400 400 0 0 1 367 137 Z" fill="#1565c0" opacity="0" />
            
            <!-- 黑夜阴影 -->
            <path id="scene1-shadow" class="scene1-fade" d="M 650 420 L 250 420 A 400 400 0 0 1 367 137 L 530 420 Z" fill="#000000" opacity="0.2" />
            
            <!-- 经纬网基础 -->
            <!-- 纬线弧 -->
            <path id="scene1-equator" d="M 250 420 A 400 400 0 0 1 367 137" fill="none" stroke="#000" stroke-width="1.5" />
            <path id="scene1-tropic" d="M 390 420 A 260 260 0 0 1 466 236" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="5,5" />
            <path id="scene1-polar-circle" d="M 530 420 A 120 120 0 0 1 565 335" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="5,5" />
            
            <!-- 经线 -->
            <line id="scene1-meridian-0" x1="650" y1="420" x2="367" y2="137" stroke="#000" stroke-width="1.5" />
            <line id="scene1-meridian-00" x1="650" y1="420" x2="250" y2="420" stroke="#000" stroke-width="1.5" />
            <line id="scene1-meridian-12" class="scene1-fade" x1="650" y1="420" x2="650" y2="100" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="5,5" opacity="0" />
            
            <!-- 晨线 ABC -->
            <line id="scene1-terminator" class="scene1-fade" x1="367" y1="137" x2="530" y2="420" stroke="#000" stroke-width="1.5" />
            
            <!-- 自转箭头 -->
            <g id="scene1-rotation-arrow" class="scene1-fade">
                <path d="M 226 345 A 430 430 0 0 1 298 173" fill="none" stroke="#000" stroke-width="1.5" />
                <polygon points="298,173 290,180 302,185" fill="#000" />
            </g>
            
            <!-- 太阳图标 (Step 5) -->
            <circle id="scene1-sun" class="scene1-fade" cx="650" cy="80" r="8" fill="#fbc02d" opacity="0" />
            
            <!-- 点 -->
            <circle id="scene1-pt-o" cx="650" cy="420" r="4" fill="#000" />
            <circle id="scene1-pt-a" class="scene1-fade" cx="367" cy="137" r="4" fill="#000" />
            <circle id="scene1-pt-b" cx="441" cy="265" r="4" fill="#000" />
            <circle id="scene1-pt-c" class="scene1-fade" cx="530" cy="420" r="4" fill="#000" />
            
            <!-- 基础标签 -->
            <text x="665" y="435" class="scene1-text">O</text>
            <text x="340" y="110" class="scene1-text">A</text>
            <text x="610" y="100" class="scene1-text scene1-text-shadow">B</text>
            <text x="670" y="260" class="scene1-text scene1-text-shadow">C</text>
            <text id="scene1-lbl-0deg" class="scene1-text scene1-fade" x="310" y="90">0°</text>
            
            <!-- 推导标签 (初始隐藏) -->
            <text id="scene1-lbl-pole" class="scene1-text scene1-fade" x="665" y="455" opacity="0">南极点(90°S)</text>
            <text id="scene1-lbl-equator" class="scene1-text scene1-text-shadow scene1-fade" x="380" y="80" opacity="0">赤道</text>
            <text id="scene1-lbl-tropic" class="scene1-text scene1-text-shadow scene1-fade" x="530" y="110" opacity="0">南回归线</text>
            <text id="scene1-lbl-polar-circle" class="scene1-text scene1-text-shadow scene1-fade" x="720" y="140" opacity="0">南极圈</text>
            
            <text id="scene1-lbl-terminator" class="scene1-text scene1-text-shadow scene1-fade" x="440" y="70" fill="#c62828" opacity="0">晨线(日出)</text>
            
            <text id="scene1-lbl-600" class="scene1-text scene1-fade" x="380" y="120" fill="#c62828" opacity="0">6:00</text>
            <text id="scene1-lbl-000" class="scene1-text scene1-fade" x="530" y="440" fill="#c62828" opacity="0">0:00(24:00)</text>
            
            <text id="scene1-lbl-90w" class="scene1-text scene1-fade" x="250" y="440" fill="#2e7d32" opacity="0">90°W</text>
            <text id="scene1-lbl-1200" class="scene1-text scene1-fade" x="670" y="100" fill="#2e7d32" opacity="0">12:00</text>
            <text id="scene1-lbl-90e" class="scene1-text scene1-fade" x="670" y="120" fill="#2e7d32" opacity="0">90°E</text>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 5;
        
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const conclusion = document.getElementById('scene1-conclusion');
        
        // Elements
        const rotArrow = document.getElementById('scene1-rotation-arrow');
        const lblPole = document.getElementById('scene1-lbl-pole');
        const lblEquator = document.getElementById('scene1-lbl-equator');
        const lblTropic = document.getElementById('scene1-lbl-tropic');
        const lblPolarCircle = document.getElementById('scene1-lbl-polar-circle');
        
        const shadow = document.getElementById('scene1-shadow');
        const terminator = document.getElementById('scene1-terminator');
        const lblTerminator = document.getElementById('scene1-lbl-terminator');
        
        const ptC = document.getElementById('scene1-pt-c');
        const polarDay = document.getElementById('scene1-polar-day');
        
        const ptA = document.getElementById('scene1-pt-a');
        const lbl600 = document.getElementById('scene1-lbl-600');
        const lbl000 = document.getElementById('scene1-lbl-000');
        
        const lbl0deg = document.getElementById('scene1-lbl-0deg');
        const lbl90w = document.getElementById('scene1-lbl-90w');
        const meridian12 = document.getElementById('scene1-meridian-12');
        const sun = document.getElementById('scene1-sun');
        const lbl1200 = document.getElementById('scene1-lbl-1200');
        const lbl90e = document.getElementById('scene1-lbl-90e');
        
        function updateScene() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
            
            // Reset all
            rotArrow.querySelector('path').setAttribute('stroke', '#000');
            rotArrow.querySelector('path').setAttribute('stroke-width', '1.5');
            rotArrow.querySelector('polygon').setAttribute('fill', '#000');
            lblPole.style.opacity = 0;
            lblEquator.style.opacity = 0;
            lblTropic.style.opacity = 0;
            lblPolarCircle.style.opacity = 0;
            
            shadow.classList.remove('scene1-anim-swing');
            terminator.setAttribute('stroke', '#000');
            terminator.setAttribute('stroke-width', '1.5');
            lblTerminator.style.opacity = 0;
            
            ptC.setAttribute('fill', '#000');
            polarDay.style.opacity = 0;
            conclusion.style.opacity = 0;
            conclusion.innerHTML = '';
            
            ptA.setAttribute('fill', '#000');
            lbl600.style.opacity = 0;
            lbl000.style.opacity = 0;
            
            lbl0deg.setAttribute('fill', '#000');
            lbl0deg.style.fontSize = '14px';
            lbl90w.style.opacity = 0;
            meridian12.style.opacity = 0;
            sun.style.opacity = 0;
            lbl1200.style.opacity = 0;
            lbl90e.style.opacity = 0;
            
            // Apply steps cumulatively
            if (currentStep >= 1) {
                rotArrow.querySelector('path').setAttribute('stroke', '#1565c0');
                rotArrow.querySelector('path').setAttribute('stroke-width', '2.5');
                rotArrow.querySelector('polygon').setAttribute('fill', '#1565c0');
                lblPole.style.opacity = 1;
                lblEquator.style.opacity = 1;
                lblTropic.style.opacity = 1;
                lblPolarCircle.style.opacity = 1;
            }
            
            if (currentStep >= 2) {
                if (currentStep === 2) {
                    // Trigger animation only when entering step 2
                    void shadow.offsetWidth; // trigger reflow
                    shadow.classList.add('scene1-anim-swing');
                }
                terminator.setAttribute('stroke', '#c62828');
                terminator.setAttribute('stroke-width', '2.5');
                lblTerminator.style.opacity = 1;
            }
            
            if (currentStep >= 3) {
                ptC.setAttribute('fill', '#c62828');
                polarDay.style.opacity = 1;
                conclusion.style.opacity = 1;
                conclusion.innerHTML = '<strong>节气判定：</strong><br>南极圈及其以南出现极昼<br>→ 冬至日 (12月22日)';
            }
            
            if (currentStep >= 4) {
                ptA.setAttribute('fill', '#c62828');
                lbl600.style.opacity = 1;
                lbl000.style.opacity = 1;
            }
            
            if (currentStep >= 5) {
                lbl0deg.setAttribute('fill', '#2e7d32');
                lbl0deg.style.fontSize = '18px';
                lbl90w.style.opacity = 1;
                meridian12.style.opacity = 1;
                sun.style.opacity = 1;
                lbl1200.style.opacity = 1;
                lbl90e.style.opacity = 1;
                conclusion.innerHTML += '<br><br><strong>直射点坐标：</strong><br>(23.5°S, 90°E)';
            }
        }
        
        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });
        
        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });
        
        // Initial setup
        updateScene();
    })();
    </script>
</body>
</html>
