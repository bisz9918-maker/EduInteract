<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>纬度与地转偏向力、线速度的关系对比</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #f0f0f0;
            transition: all 0.3s;
        }
        button.active-blue {
            background: #1565c0;
            color: white;
            border-color: #1565c0;
        }
        button.active-green {
            background: #2e7d32;
            color: white;
            border-color: #2e7d32;
        }
        .panel-text { font-size: 16px; }
        .panel-title { font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500">
            <defs>
                <marker id="scene2-arrow-black" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
                </marker>
                <marker id="scene2-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0" />
                </marker>
                <marker id="scene2-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32" />
                </marker>
            </defs>

            <!-- Base Layer -->
            <g id="scene2-base">
                <!-- Night hemisphere -->
                <path d="M 350 350 L 70 350 A 280 280 0 0 1 210 108 Z" fill="rgba(0,0,0,0.1)" />
                
                <!-- Morning line OA -->
                <line x1="350" y1="350" x2="210" y2="108" stroke="#000000" stroke-width="2" />
                
                <!-- Equator arc -->
                <path d="M 70 350 A 280 280 0 0 1 210 108" stroke="#000000" stroke-width="2" fill="none" />
                
                <!-- Tropic of Capricorn arc -->
                <path d="M 143 350 A 207 207 0 0 1 247 171" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" fill="none" />
                
                <!-- Antarctic Circle arc -->
                <path d="M 277 350 A 73 73 0 0 1 314 287" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" fill="none" />
                
                <!-- Rotation direction -->
                <path d="M 40 350 A 310 310 0 0 1 160 105" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#scene2-arrow-black)" />
                <text x="145" y="95" fill="#000000" font-size="14" font-weight="bold">自转方向</text>
                
                <!-- Points -->
                <circle cx="350" cy="350" r="4" fill="#000000" />
                <text x="355" y="365" fill="#000000" font-size="14" font-weight="bold">O</text>
                
                <circle cx="210" cy="108" r="6" fill="#c62828" />
                <text x="220" y="95" fill="#000000" font-size="14" font-weight="bold">A(赤道)</text>
                
                <circle cx="247" cy="171" r="4" fill="#000000" />
                <text x="290" y="80" fill="#000000" font-size="14" font-weight="bold">B(南回归线)</text>
                
                <circle cx="314" cy="287" r="4" fill="#000000" />
                <text x="340" y="250" fill="#000000" font-size="14" font-weight="bold">C(南极圈)</text>
            </g>

            <!-- State 1: Coriolis Force -->
            <g id="scene2-state1">
                <text x="195" y="75" fill="#1565c0" font-size="14" font-weight="bold">0</text>
                
                <line x1="255" y1="171" x2="315" y2="171" stroke="#1565c0" stroke-width="2" marker-end="url(#scene2-arrow-blue)" />
                <text x="345" y="185" fill="#1565c0" font-size="14" font-weight="bold">较小</text>
                
                <line x1="322" y1="287" x2="458" y2="287" stroke="#1565c0" stroke-width="2" marker-end="url(#scene2-arrow-blue)" />
                <text x="473" y="292" fill="#1565c0" font-size="14" font-weight="bold">最大</text>
                
                <!-- Right Panel State 1 -->
                <text x="520" y="150" fill="#1565c0" class="panel-title">地转偏向力大小对比</text>
                <text x="520" y="190" fill="#1565c0" class="panel-text">规律：由赤道向两极递增</text>
                <text x="520" y="230" fill="#1565c0" class="panel-text">A(赤道)：最小 (0)</text>
                <text x="520" y="270" fill="#1565c0" class="panel-text">B(南回归线)：较小</text>
                <text x="520" y="310" fill="#1565c0" class="panel-text">C(南极圈)：最大</text>
            </g>

            <!-- State 2: Linear Velocity -->
            <g id="scene2-state2" style="display: none; opacity: 0;">
                <line x1="218" y1="108" x2="368" y2="108" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene2-arrow-green)" />
                <text x="383" y="113" fill="#2e7d32" font-size="14" font-weight="bold">最大</text>
                
                <line x1="255" y1="171" x2="391" y2="171" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene2-arrow-green)" />
                <text x="406" y="176" fill="#2e7d32" font-size="14" font-weight="bold">较大</text>
                
                <line x1="322" y1="287" x2="382" y2="287" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene2-arrow-green)" />
                <text x="410" y="300" fill="#2e7d32" font-size="14" font-weight="bold">最小</text>
                
                <!-- Right Panel State 2 -->
                <text x="520" y="150" fill="#2e7d32" class="panel-title">自转线速度大小对比</text>
                <text x="520" y="190" fill="#2e7d32" class="panel-text">规律：由赤道向两极递减</text>
                <text x="520" y="230" fill="#2e7d32" class="panel-text">A(赤道)：最大</text>
                <text x="520" y="270" fill="#2e7d32" class="panel-text">B(南回归线)：较大</text>
                <text x="520" y="310" fill="#2e7d32" class="panel-text">C(南极圈)：最小</text>
            </g>
        </svg>

        <div id="scene2-controls">
            <button id="scene2-btn-coriolis" class="active-blue">地转偏向力</button>
            <button id="scene2-btn-velocity">自转线速度</button>
        </div>
    </div>

    <script>
    (function() {
        const btnCoriolis = document.getElementById('scene2-btn-coriolis');
        const btnVelocity = document.getElementById('scene2-btn-velocity');
        const state1 = document.getElementById('scene2-state1');
        const state2 = document.getElementById('scene2-state2');

        function show(el) {
            el.style.display = '';
            el.style.opacity = '1';
        }

        function hide(el) {
            el.style.display = 'none';
            el.style.opacity = '0';
        }

        btnCoriolis.addEventListener('click', () => {
            show(state1);
            hide(state2);
            btnCoriolis.classList.add('active-blue');
            btnVelocity.classList.remove('active-green');
        });

        btnVelocity.addEventListener('click', () => {
            hide(state1);
            show(state2);
            btnCoriolis.classList.remove('active-blue');
            btnVelocity.classList.add('active-green');
        });
    })();
    </script>
</body>
</html>
