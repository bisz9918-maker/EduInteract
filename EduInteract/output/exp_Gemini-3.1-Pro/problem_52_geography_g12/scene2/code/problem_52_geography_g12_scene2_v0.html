<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f8f9fa; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button:hover:not(:disabled) { background: #e2e6ea; }
        .scene2-step-element { transition: opacity 0.3s ease; opacity: 0; }
        .scene2-text-step { font-size: 16px; line-height: 1.6; fill: #333; }
        .scene2-highlight { fill: #2e7d32; font-weight: bold; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500">
            <defs>
                <clipPath id="scene2-hemisphere-clip">
                    <path d="M 50 200 A 180 180 0 0 0 410 200 Z" />
                </clipPath>
                <marker id="scene2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828" />
                </marker>
            </defs>

            <!-- 极夜区域 (Step 3) -->
            <path id="scene2-polar-night" class="scene2-step-element" d="M 50 365.1 L 410 365.1 L 410 400 L 50 400 Z" fill="#1565c0" fill-opacity="0.4" clip-path="url(#scene2-hemisphere-clip)" />

            <!-- 阴影区域 -->
            <path d="M 290 200 A 180 165.1 0 0 1 410 360.8 L 410 400 L 50 400 L 50 200 Z" fill="rgba(0,0,0,0.2)" clip-path="url(#scene2-hemisphere-clip)" />

            <!-- 经纬网 -->
            <path d="M 50 200 A 180 180 0 0 0 230 380" fill="none" stroke="#000000" stroke-width="1" />
            <path d="M 110 200 A 120 180 0 0 0 230 380" fill="none" stroke="#000000" stroke-width="1" />
            <path d="M 170 200 A 60 180 0 0 0 230 380" fill="none" stroke="#000000" stroke-width="1" />
            <path d="M 230 200 L 230 380" fill="none" stroke="#000000" stroke-width="1" />
            <path d="M 290 200 A 60 180 0 0 1 230 380" fill="none" stroke="#000000" stroke-width="1" />
            <path d="M 350 200 A 120 180 0 0 1 230 380" fill="none" stroke="#000000" stroke-width="1" />
            <path d="M 410 200 A 180 180 0 0 1 230 380" fill="none" stroke="#000000" stroke-width="1" />

            <!-- 纬线 -->
            <path d="M 65 271.8 L 395 271.8" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" />
            <path d="M 158.3 365.1 L 301.7 365.1" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" />

            <!-- 南半球轮廓与赤道 -->
            <path d="M 50 200 A 180 180 0 0 0 410 200 Z" fill="none" stroke="#000000" stroke-width="1.5" />
            <line x1="50" y1="200" x2="410" y2="200" stroke="#000000" stroke-width="1.5" />

            <!-- 晨昏线高亮 (Step 1) -->
            <path id="scene2-terminator-hl" class="scene2-step-element" d="M 290 200 A 180 165.1 0 0 1 410 360.8" fill="none" stroke="#c62828" stroke-width="3" clip-path="url(#scene2-hemisphere-clip)" />

            <!-- 自转方向箭头 (Step 2) -->
            <path id="scene2-rotation-arrow" class="scene2-step-element" d="M 130 150 Q 230 120 330 150" fill="none" stroke="#c62828" stroke-width="2" marker-end="url(#scene2-arrow)" />
            <text id="scene2-rotation-label" class="scene2-step-element" x="230" y="135" font-size="14" text-anchor="middle" fill="#c62828">自转方向</text>

            <!-- 10°E 经线 (Step 4) -->
            <line id="scene2-10e-line" class="scene2-step-element" x1="470" y1="200" x2="470" y2="380" stroke="#1565c0" stroke-width="2" stroke-dasharray="6,4" />

            <!-- 基础标签 -->
            <circle cx="290" cy="200" r="3" fill="#000" />
            <text x="275" y="190" font-size="14" text-anchor="end">B</text>
            <text x="290" y="185" font-size="14" text-anchor="middle">80°W</text>
            <text x="410" y="185" font-size="14" text-anchor="middle">20°W</text>
            <text x="50" y="185" font-size="14" text-anchor="middle">160°E</text>
            <text x="230" y="425" font-size="14" text-anchor="middle">S</text>

            <!-- 动态标签 -->
            <text id="scene2-terminator-label" class="scene2-step-element" x="415" y="270" font-size="14" fill="#c62828">晨线</text>
            <text id="scene2-time-6" class="scene2-step-element" x="305" y="190" font-size="14" fill="#2e7d32">6:00</text>
            <text id="scene2-polar-night-label" class="scene2-step-element" x="150" y="420" font-size="14" text-anchor="middle" fill="#1565c0">极夜区域</text>
            <text id="scene2-10e-label" class="scene2-step-element" x="470" y="185" font-size="14" text-anchor="middle" fill="#1565c0">10°E</text>
            <text id="scene2-time-12" class="scene2-step-element" x="480" y="225" font-size="14" fill="#2e7d32">12:00</text>
            <text id="scene2-sun-meridian-label" class="scene2-step-element" x="470" y="395" font-size="14" text-anchor="middle" fill="#1565c0">太阳直射经线</text>

            <!-- 右侧文字区 -->
            <g id="scene2-text-group" transform="translate(530, 100)">
                <text id="scene2-text-step1" class="scene2-step-element scene2-text-step" y="0">
                    <tspan x="0" dy="0">1. 观察晨昏线，交赤道于B点。</tspan>
                </text>
                <text id="scene2-text-step2" class="scene2-step-element scene2-text-step" y="40">
                    <tspan x="0" dy="0">2. 顺自转方向进入白昼，</tspan>
                    <tspan x="0" dy="25">判定为</tspan><tspan class="scene2-highlight">晨线</tspan>
                    <tspan>，赤道交点</tspan><tspan class="scene2-highlight">6:00</tspan>。
                </text>
                <text id="scene2-text-step3" class="scene2-step-element scene2-text-step" y="105">
                    <tspan x="0" dy="0">3. 南极圈及其以南出现</tspan><tspan class="scene2-highlight">极夜</tspan>，
                    <tspan x="0" dy="25">说明太阳直射</tspan><tspan class="scene2-highlight">北回归线</tspan>，
                    <tspan x="0" dy="25">日期为</tspan><tspan class="scene2-highlight">夏至日 (6月22日)</tspan>。
                </text>
                <text id="scene2-text-step4" class="scene2-step-element scene2-text-step" y="195">
                    <tspan x="0" dy="0">4. 计算直射点经度 (12:00)：</tspan>
                    <tspan x="0" dy="25">80°W (6:00) 向东 90° (6小时)</tspan>
                    <tspan x="0" dy="25">即为 </tspan><tspan class="scene2-highlight">10°E</tspan>。
                </text>
            </g>
        </svg>
        <div id="scene2-controls">
            <button id="scene2-btn-prev" disabled>◀ 上一步</button>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>
    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 4;

        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');

        const elements = {
            step1: [
                document.getElementById('scene2-terminator-hl'),
                document.getElementById('scene2-terminator-label'),
                document.getElementById('scene2-text-step1')
            ],
            step2: [
                document.getElementById('scene2-rotation-arrow'),
                document.getElementById('scene2-rotation-label'),
                document.getElementById('scene2-time-6'),
                document.getElementById('scene2-text-step2')
            ],
            step3: [
                document.getElementById('scene2-polar-night'),
                document.getElementById('scene2-polar-night-label'),
                document.getElementById('scene2-text-step3')
            ],
            step4: [
                document.getElementById('scene2-10e-line'),
                document.getElementById('scene2-10e-label'),
                document.getElementById('scene2-time-12'),
                document.getElementById('scene2-sun-meridian-label'),
                document.getElementById('scene2-text-step4')
            ]
        };

        function updateState() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;

            for (let i = 1; i <= maxStep; i++) {
                const isVisible = i <= currentStep;
                elements[`step${i}`].forEach(el => {
                    if (el) {
                        el.style.opacity = isVisible ? '1' : '0';
                    }
                });
            }
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateState();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateState();
            }
        });

        // Initialize
        updateState();
    })();
    </script>
</body>
</html>
