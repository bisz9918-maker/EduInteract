<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisualSolver Scene 3</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:hover { background: #e9e9e9; }
        button:disabled { cursor: not-allowed; opacity: 0.5; }
        
        /* SVG Elements */
        .grid-line { fill: none; stroke: #000000; stroke-width: 1.5; }
        .grid-dashed { fill: none; stroke: #888888; stroke-width: 1.5; stroke-dasharray: 4 4; }
        .highlight-blue { fill: none; stroke: #1565c0; stroke-width: 2.5; }
        .highlight-red { fill: none; stroke: #c62828; stroke-width: 2.5; }
        .text-label { font-size: 14px; fill: #000000; font-family: sans-serif; }
        .text-time { font-size: 12px; fill: #2e7d32; }
        .text-red { fill: #c62828; }
        .text-blue { fill: #1565c0; }
        
        /* Transitions */
        .fade { transition: opacity 0.5s ease; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg id="scene3-svg" width="800" height="500">
            <!-- Base Grid -->
            <!-- Equator -->
            <line x1="120" y1="400" x2="680" y2="400" class="grid-line" />
            <!-- 70E -->
            <line x1="400" y1="120" x2="400" y2="400" class="grid-line" />
            <!-- 20W -->
            <path d="M 400 120 A 280 280 0 0 0 120 400" class="grid-line" />
            <!-- 160E -->
            <path d="M 400 120 A 280 280 0 0 1 680 400" class="grid-line" />
            <!-- 40E -->
            <path d="M 400 120 A 140 280 0 0 0 260 400" class="grid-line" />
            <!-- 130E -->
            <path d="M 400 120 A 242.5 280 0 0 1 642.5 400" class="grid-line" />
            
            <!-- Tropic of Cancer -->
            <line x1="143" y1="288" x2="657" y2="288" class="grid-dashed" />
            
            <!-- Step 0 Elements -->
            <!-- 10E (Subsolar) -->
            <path d="M 400 120 A 242.5 280 0 0 0 157.5 400" class="highlight-blue" />
            <!-- Arctic Circle -->
            <line x1="288" y1="143" x2="512" y2="143" class="highlight-blue" stroke-dasharray="4 4" />
            
            <!-- Labels Step 0 -->
            <text x="400" y="100" class="text-label" text-anchor="middle">N</text>
            <text x="157.5" y="420" class="text-label text-blue" text-anchor="middle">10°E</text>
            <text x="157.5" y="445" class="text-time" text-anchor="middle">12:00</text>
            
            <!-- Base Grid 100E (when not highlighted) -->
            <path id="scene3-100e-base" d="M 400 120 A 140 280 0 0 1 540 400" class="grid-line" />
            
            <!-- Step 1 Elements -->
            <g id="scene3-step1" class="fade" style="opacity: 0; display: none;">
                <!-- 100E -->
                <path d="M 400 120 A 140 280 0 0 1 540 400" class="highlight-red" />
                <!-- Intersection Point -->
                <circle cx="540" cy="400" r="4" fill="#c62828" />
                <!-- Arrow -->
                <defs>
                    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                        <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828" />
                    </marker>
                </defs>
                <line x1="180" y1="460" x2="520" y2="460" stroke="#c62828" stroke-width="2" marker-end="url(#arrow-red)" />
                <text x="350" y="450" class="text-label text-red" text-anchor="middle">+90° (+6小时)</text>
                <text x="540" y="420" class="text-label text-red" text-anchor="middle">100°E</text>
                <text x="540" y="445" class="text-time" text-anchor="middle">18:00</text>
            </g>
            
            <!-- Step 2 Elements -->
            <g id="scene3-step2" class="fade" style="opacity: 0; display: none;">
                <!-- Dusk Line -->
                <path d="M 540 400 C 590 330, 590 200, 526 150" class="highlight-red" />
                <text x="610" y="260" class="text-label text-red" text-anchor="middle" style="paint-order: stroke; stroke: #ffffff; stroke-width: 6px; stroke-linecap: round; stroke-linejoin: round;">昏线</text>
            </g>
            
            <!-- Step 3 Elements -->
            <g id="scene3-step3" class="fade" style="opacity: 0; display: none;">
                <!-- Shadow Area -->
                <path d="M 540 400 C 590 330, 590 200, 526 150 A 280 280 0 0 1 680 400 Z" fill="#000000" opacity="0.2" />
                <text x="620" y="350" class="text-label" text-anchor="middle" style="paint-order: stroke; stroke: #ffffff; stroke-width: 6px; stroke-linecap: round; stroke-linejoin: round;">黑夜</text>
            </g>
            
            <!-- Put 极昼 label on top so it's not covered by shadow, wait, it's not covered by shadow anyway -->
            <text x="400" y="135" class="text-label text-blue" text-anchor="middle" style="paint-order: stroke; stroke: #ffffff; stroke-width: 6px; stroke-linecap: round; stroke-linejoin: round;">极昼</text>
        </svg>
        <div id="scene3-controls">
            <button id="scene3-btn-prev" disabled>◀ 上一步</button>
            <button id="scene3-btn-next">下一步 ▶</button>
        </div>
    </div>
    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 3;
        
        const btnPrev = document.getElementById('scene3-btn-prev');
        const btnNext = document.getElementById('scene3-btn-next');
        
        const step1 = document.getElementById('scene3-step1');
        const step2 = document.getElementById('scene3-step2');
        const step3 = document.getElementById('scene3-step3');
        const base100e = document.getElementById('scene3-100e-base');
        
        function show(el) {
            el.style.display = '';
            // trigger reflow
            void el.offsetWidth;
            el.style.opacity = '1';
        }
        
        function hide(el) {
            el.style.opacity = '0';
            setTimeout(() => {
                if (el.style.opacity === '0') {
                    el.style.display = 'none';
                }
            }, 500);
        }
        
        function updateState() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
            
            if (currentStep >= 1) {
                show(step1);
                hide(base100e);
            } else {
                hide(step1);
                show(base100e);
            }
            
            if (currentStep >= 2) {
                show(step2);
            } else {
                hide(step2);
            }
            
            if (currentStep >= 3) {
                show(step3);
            } else {
                hide(step3);
            }
        }
        
        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateState();
            }
        });
        
        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateState();
            }
        });
        
        // Initialize
        updateState();
    })();
    </script>
</body>
</html>
