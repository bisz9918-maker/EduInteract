<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisualSolver Scene</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .step-text { line-height: 34px; font-size: 14px; user-select: none; }
        
        /* SVG Elements */
        .fade { transition: opacity 0.3s ease; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#000" />
                </marker>
            </defs>
            
            <!-- Base Elements -->
            <g id="scene1-base">
                <!-- Axes -->
                <line x1="100" y1="380" x2="700" y2="380" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)" />
                <line x1="350" y1="450" x2="350" y2="100" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)" />
                <text x="690" y="370" font-size="16" font-style="italic">x</text>
                <text x="335" y="110" font-size="16" font-style="italic">y</text>
                
                <!-- Parabola -->
                <path id="scene1-parabola" fill="none" stroke="#000" stroke-width="2" />
                
                <!-- Circle F -->
                <circle cx="410" cy="380" r="60" fill="none" stroke="#000" stroke-width="1.5" />
                
                <!-- Lines -->
                <line x1="530" y1="172" x2="410" y2="380" stroke="#000" stroke-width="1.5" /> <!-- AF -->
                <line x1="530" y1="172" x2="350" y2="172" stroke="#000" stroke-width="1.5" /> <!-- AN -->
                <line x1="350" y1="172" x2="440" y2="328" stroke="#000" stroke-width="1.5" /> <!-- NB -->
                
                <!-- Points -->
                <circle cx="350" cy="380" r="3" fill="#000" /> <!-- O -->
                <text x="325" y="405" font-size="16" font-style="italic">O</text>
                
                <circle cx="410" cy="380" r="3" fill="#000" /> <!-- F -->
                <text x="425" y="405" font-size="16" font-style="italic">F</text>
                
                <circle cx="530" cy="172" r="3" fill="#000" /> <!-- A -->
                <text x="545" y="165" font-size="16" font-style="italic">A</text>
                
                <circle cx="440" cy="328" r="3" fill="#000" /> <!-- B -->
                <text x="455" y="335" font-size="16" font-style="italic">B</text>
                
                <circle cx="350" cy="172" r="3" fill="#000" /> <!-- N -->
                <text x="330" y="157" font-size="16" font-style="italic">N</text>
                
                <!-- Angle AFx -->
                <path d="M 440 380 A 30 30 0 0 0 425 354" fill="none" stroke="#000" stroke-width="1.5" />
                <text x="445" y="365" font-size="14">60°</text>
            </g>
            
            <!-- Step 1 Elements -->
            <g id="scene1-step1" class="fade" style="opacity: 0;">
                <line x1="290" y1="100" x2="290" y2="450" stroke="#888" stroke-width="1.5" stroke-dasharray="5,5" /> <!-- Directrix -->
                <line x1="530" y1="172" x2="290" y2="172" stroke="#888" stroke-width="1.5" stroke-dasharray="5,5" /> <!-- AM -->
                <circle cx="290" cy="172" r="3" fill="#000" /> <!-- M -->
                <text x="270" y="172" font-size="16" font-style="italic">M</text>
                
                <!-- Highlights -->
                <line id="scene1-hl-af" x1="530" y1="172" x2="410" y2="380" stroke="#1565c0" stroke-width="4" class="fade" style="opacity: 0;" />
                <line id="scene1-hl-am" x1="530" y1="172" x2="290" y2="172" stroke="#1565c0" stroke-width="4" class="fade" style="opacity: 0;" />
            </g>
            
            <!-- Step 2 Elements -->
            <g id="scene1-step2" class="fade" style="opacity: 0;">
                <line id="scene1-hl-an" x1="530" y1="172" x2="350" y2="172" stroke="#1565c0" stroke-width="4" class="fade" style="opacity: 0;" />
                <line id="scene1-hl-nm" x1="350" y1="172" x2="290" y2="172" stroke="#1565c0" stroke-width="4" class="fade" style="opacity: 0;" />
                <text id="scene1-lbl-p2-nm" x="310" y="150" font-size="14" fill="#1565c0" class="fade" style="opacity: 0;">p/2</text>
            </g>
            
            <!-- Step 3 Elements -->
            <g id="scene1-step3" class="fade" style="opacity: 0;">
                <line id="scene1-hl-fb" x1="410" y1="380" x2="440" y2="328" stroke="#1565c0" stroke-width="4" class="fade" style="opacity: 0;" />
                <text id="scene1-lbl-p2-fb" x="395" y="345" font-size="14" fill="#1565c0" class="fade" style="opacity: 0;">p/2</text>
                
                <line id="scene1-hl-ab" x1="530" y1="172" x2="440" y2="328" stroke="#c62828" stroke-width="4" class="fade" style="opacity: 0;" />
                <line id="scene1-hl-an-red" x1="530" y1="172" x2="350" y2="172" stroke="#c62828" stroke-width="4" class="fade" style="opacity: 0;" />
                
                <!-- Tick marks -->
                <line x1="475" y1="245" x2="495" y2="255" stroke="#c62828" stroke-width="2" class="fade" id="scene1-tick-ab" style="opacity: 0;" />
                <line x1="440" y1="162" x2="440" y2="182" stroke="#c62828" stroke-width="2" class="fade" id="scene1-tick-an" style="opacity: 0;" />
            </g>
            
            <!-- Step 4 Elements -->
            <g id="scene1-step4" class="fade" style="opacity: 0;">
                <line id="scene1-hl-an-blue2" x1="530" y1="172" x2="350" y2="172" stroke="#1565c0" stroke-width="4" class="fade" style="opacity: 0;" />
                <line id="scene1-hl-x-blue" x1="530" y1="380" x2="350" y2="380" stroke="#1565c0" stroke-width="4" class="fade" style="opacity: 0;" />
                
                <!-- Angle NAB -->
                <path d="M 500 172 A 30 30 0 0 0 515 198" fill="none" stroke="#000" stroke-width="1.5" />
                <text x="485" y="215" font-size="14">60°</text>
            </g>
            
            <!-- Step 5 Elements -->
            <g id="scene1-step5" class="fade" style="opacity: 0;">
                <polygon points="530,172 350,172 440,328" fill="#c62828" opacity="0.1" />
                <!-- Angle ANB -->
                <path d="M 376 217 A 30 30 0 0 0 380 172" fill="none" stroke="#000" stroke-width="1.5" />
                <text x="395" y="195" font-size="14">60°</text>
            </g>
            
            <!-- Step 6 Elements -->
            <g id="scene1-step6" class="fade" style="opacity: 0;">
                <!-- Right angle ANO -->
                <polyline points="350,187 365,187 365,172" fill="none" stroke="#000" stroke-width="1.5" />
                <!-- Angle ONB -->
                <path d="M 350 172 L 350 212 A 40 40 0 0 0 370 206 Z" fill="#2e7d32" opacity="0.3" />
                <text x="365" y="235" font-size="14" fill="#2e7d32">30°</text>
            </g>
            
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <div class="step-text" id="scene1-step-text">步骤 0 / 6</div>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Generate Parabola Path
        const parabola = document.getElementById('scene1-parabola');
        let pathD = "";
        for (let y = 100; y <= 500; y += 5) {
            const x = 350 + Math.pow(y - 380, 2) / 240;
            if (y === 100) {
                pathD += `M ${x} ${y} `;
            } else {
                pathD += `L ${x} ${y} `;
            }
        }
        parabola.setAttribute('d', pathD);

        let currentStep = 0;
        const totalSteps = 6;
        
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepText = document.getElementById('scene1-step-text');
        
        function show(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.display = '';
                // force reflow
                void el.offsetWidth;
                el.style.opacity = '1';
            }
        }
        
        function hide(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.opacity = '0';
            }
        }

        function updateStep() {
            stepText.textContent = `步骤 ${currentStep} / ${totalSteps}`;
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps;
            
            // Reset all steps
            for (let i = 1; i <= 6; i++) {
                hide(`scene1-step${i}`);
            }
            hide('scene1-hl-af'); hide('scene1-hl-am');
            hide('scene1-hl-an'); hide('scene1-hl-nm'); hide('scene1-lbl-p2-nm');
            hide('scene1-hl-fb'); hide('scene1-lbl-p2-fb'); hide('scene1-hl-ab'); hide('scene1-hl-an-red');
            hide('scene1-tick-ab'); hide('scene1-tick-an');
            hide('scene1-hl-an-blue2'); hide('scene1-hl-x-blue');
            
            // Apply current step logic
            if (currentStep >= 1) {
                show('scene1-step1');
                if (currentStep === 1) {
                    show('scene1-hl-af'); show('scene1-hl-am');
                }
            }
            if (currentStep >= 2) {
                show('scene1-step2');
                if (currentStep === 2) {
                    show('scene1-hl-an'); show('scene1-hl-nm'); show('scene1-lbl-p2-nm');
                }
            }
            if (currentStep >= 3) {
                show('scene1-step3');
                if (currentStep === 3) {
                    show('scene1-hl-fb'); show('scene1-lbl-p2-fb'); 
                    show('scene1-hl-ab'); show('scene1-hl-an-red');
                    show('scene1-tick-ab'); show('scene1-tick-an');
                }
            }
            if (currentStep >= 4) {
                show('scene1-step4');
                if (currentStep === 4) {
                    show('scene1-hl-an-blue2'); show('scene1-hl-x-blue');
                }
            }
            if (currentStep >= 5) {
                show('scene1-step5');
            }
            if (currentStep >= 6) {
                show('scene1-step6');
            }
        }
        
        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });
        
        btnNext.addEventListener('click', () => {
            if (currentStep < totalSteps) {
                currentStep++;
                updateStep();
            }
        });
        
        // Initialize
        updateStep();
    })();
    </script>
</body>
</html>
