<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .label { position: absolute; font-size: 16px; color: #000; pointer-events: none; transition: opacity 0.3s; }
        .math-label { position: absolute; font-size: 16px; color: #000; pointer-events: none; transition: opacity 0.3s; }
        .step-element { transition: opacity 0.3s; opacity: 0; }
        .step-visible { opacity: 1; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <!-- Step 0: Initial State -->
            <!-- Sphere -->
            <circle cx="400" cy="200" r="160" fill="none" stroke="#000" stroke-width="2"/>
            <!-- Equator -->
            <path d="M 240 200 A 160 48 0 0 0 560 200" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="5,5"/>
            <path d="M 560 200 A 160 48 0 0 0 240 200" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="5,5"/>
            
            <!-- Step 1: Section Circle -->
            <ellipse id="scene1-section-circle" class="step-element" cx="400" cy="313" rx="113" ry="34" fill="#1565c0" fill-opacity="0.1" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="5,5"/>
            <path id="scene1-section-front" class="step-element" d="M 287 313 A 113 34 0 0 0 513 313" fill="none" stroke="#1565c0" stroke-width="1.5"/>
            
            <!-- Step 2: Triangle OO'A -->
            <polygon id="scene1-tri-ooa" class="step-element" points="400,200 400,313 302,296" fill="#1565c0" fill-opacity="0.2"/>
            
            <!-- Step 4: Triangle OBC -->
            <polygon id="scene1-tri-obc" class="step-element" points="400,200 343,342 498,330" fill="#c62828" fill-opacity="0.2"/>
            
            <!-- Lines -->
            <!-- Step 0 -->
            <line x1="302" y1="296" x2="343" y2="342" stroke="#888" stroke-width="1.5" stroke-dasharray="5,5"/>
            <line x1="343" y1="342" x2="498" y2="330" stroke="#888" stroke-width="1.5" stroke-dasharray="5,5"/>
            <line x1="498" y1="330" x2="302" y2="296" stroke="#888" stroke-width="1.5" stroke-dasharray="5,5"/>
            
            <!-- Step 1 -->
            <line id="scene1-line-oo" class="step-element" x1="400" y1="200" x2="400" y2="313" stroke="#000" stroke-width="1.5" stroke-dasharray="5,5"/>
            <line id="scene1-line-oa" class="step-element" x1="400" y1="200" x2="302" y2="296" stroke="#000" stroke-width="1.5" stroke-dasharray="5,5"/>
            
            <!-- Step 2 -->
            <line id="scene1-line-oa-prime" class="step-element" x1="400" y1="313" x2="302" y2="296" stroke="#000" stroke-width="1.5" stroke-dasharray="5,5"/>
            
            <!-- Step 3 -->
            <line id="scene1-line-ac" class="step-element" x1="302" y1="296" x2="498" y2="330" stroke="#000" stroke-width="1.5" stroke-dasharray="5,5"/>
            
            <!-- Step 4 -->
            <line id="scene1-line-ob" class="step-element" x1="400" y1="200" x2="343" y2="342" stroke="#000" stroke-width="1.5" stroke-dasharray="5,5"/>
            <line id="scene1-line-oc" class="step-element" x1="400" y1="200" x2="498" y2="330" stroke="#000" stroke-width="1.5" stroke-dasharray="5,5"/>
            
            <!-- Step 5: Arc BC -->
            <path id="scene1-arc-bc" class="step-element" d="M 343 342 Q 420 370 498 330" fill="none" stroke="#c62828" stroke-width="3"/>
            
            <!-- Points -->
            <circle cx="400" cy="200" r="3" fill="#000"/>
            <circle id="scene1-pt-oprime" class="step-element" cx="400" cy="313" r="3" fill="#000"/>
            <circle cx="302" cy="296" r="3" fill="#000"/>
            <circle cx="343" cy="342" r="3" fill="#000"/>
            <circle cx="498" cy="330" r="3" fill="#000"/>
        </svg>
        
        <!-- Labels -->
        <div class="label" style="left: 385px; top: 170px;">\(O\)</div>
        <div id="scene1-lbl-oprime" class="label step-element" style="left: 410px; top: 315px;">\(O'\)</div>
        <div class="label" style="left: 280px; top: 270px;">\(A\)</div>
        <div class="label" style="left: 320px; top: 345px;">\(B\)</div>
        <div class="label" style="left: 510px; top: 325px;">\(C\)</div>
        
        <div id="scene1-lbl-d" class="math-label step-element" style="left: 415px; top: 230px;">\(d=rac{3\sqrt{2}}{2}\)</div>
        <div id="scene1-lbl-R" class="math-label step-element" style="left: 320px; top: 220px;">\(R=3\)</div>
        <div id="scene1-lbl-r" class="math-label step-element" style="left: 280px; top: 315px;">\(r=rac{3\sqrt{2}}{2}\)</div>
        <div id="scene1-lbl-ac" class="math-label step-element" style="left: 385px; top: 250px;">\(AC=3\sqrt{2}\)</div>
        <div id="scene1-lbl-bc" class="math-label step-element" style="left: 440px; top: 345px;">\(BC=3\)</div>
        <div id="scene1-lbl-angle" class="math-label step-element" style="left: 415px; top: 280px;">\(60^\circ\)</div>
        <div id="scene1-lbl-pi" class="math-label step-element" style="left: 420px; top: 380px;">\(\pi\)</div>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 5;
        
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        
        const steps = [
            [], // Step 0
            ['scene1-section-circle', 'scene1-section-front', 'scene1-line-oo', 'scene1-line-oa', 'scene1-pt-oprime', 'scene1-lbl-oprime', 'scene1-lbl-d', 'scene1-lbl-R'], // Step 1
            ['scene1-tri-ooa', 'scene1-line-oa-prime', 'scene1-lbl-r'], // Step 2
            ['scene1-line-ac', 'scene1-lbl-ac', 'scene1-lbl-bc'], // Step 3
            ['scene1-tri-obc', 'scene1-line-ob', 'scene1-line-oc', 'scene1-lbl-angle'], // Step 4
            ['scene1-arc-bc', 'scene1-lbl-pi'] // Step 5
        ];
        
        function updateStep() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
            
            // Hide all step elements first
            document.querySelectorAll('.step-element').forEach(el => {
                el.classList.remove('step-visible');
            });
            
            // Show elements up to current step
            for (let i = 1; i <= currentStep; i++) {
                steps[i].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.classList.add('step-visible');
                });
            }
        }
        
        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });
        
        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateStep();
            }
        });
        
        updateStep();
    })();
    </script>
</body>
</html>
