<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisualSolver Scene 2</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:hover { background: #e9e9e9; }
        button:disabled { cursor: not-allowed; opacity: 0.5; }
        
        #scene2-text-panel {
            position: absolute;
            top: 50px;
            right: 20px;
            width: 280px;
            height: 250px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            box-sizing: border-box;
            font-size: 14px;
            line-height: 1.5;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            z-index: 5;
            overflow-y: auto;
        }

        .scene2-element {
            transition: opacity 0.5s ease;
        }
        
        text {
            font-family: sans-serif;
            font-size: 16px;
            fill: #000000;
            user-select: none;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" id="scene2-svg">
            <defs>
                <marker id="scene2-arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0" />
                </marker>
                <marker id="scene2-arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828" />
                </marker>
                <marker id="scene2-arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#888888" />
                </marker>
                <marker id="scene2-arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32" />
                </marker>
            </defs>

            <!-- 阴影三角形 -->
            <polygon id="scene2-poly-efg" class="scene2-element" points="250,215 240,371 550,370" fill="#1565c0" opacity="0" style="opacity: 0;" />
            <polygon id="scene2-poly-efh" class="scene2-element" points="250,215 550,370 440,152" fill="#c62828" opacity="0" style="opacity: 0;" />
            
            <!-- 全等三角形高亮 -->
            <polygon id="scene2-poly-mgg" class="scene2-element" points="340,262 240,371 306,244" fill="#fbc02d" opacity="0" style="opacity: 0;" />
            <polygon id="scene2-poly-mhh" class="scene2-element" points="340,262 440,152 374,279" fill="#fbc02d" opacity="0" style="opacity: 0;" />

            <!-- 四面体线框 -->
            <line x1="350" y1="80" x2="150" y2="350" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5" /> <!-- AB -->
            <line x1="350" y1="80" x2="450" y2="420" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5" /> <!-- AC -->
            <line x1="350" y1="80" x2="650" y2="320" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5" /> <!-- AD -->
            <line x1="150" y1="350" x2="450" y2="420" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5" /> <!-- BC -->
            <line x1="150" y1="350" x2="650" y2="320" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5" /> <!-- BD -->
            <line x1="450" y1="420" x2="650" y2="320" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5" /> <!-- CD -->

            <!-- 截面多边形 -->
            <polygon points="250,215 240,371 550,370 440,152" fill="none" stroke="#888888" stroke-width="1" /> <!-- EGFH -->

            <!-- 核心向量 AD, BC -->
            <line x1="350" y1="80" x2="650" y2="320" stroke="#1565c0" stroke-width="3" marker-end="url(#scene2-arrow-blue)" />
            <line x1="150" y1="350" x2="450" y2="420" stroke="#1565c0" stroke-width="3" marker-end="url(#scene2-arrow-blue)" />

            <!-- 辅助向量 EA, DF, EB, CF -->
            <g id="scene2-vec-aux" class="scene2-element" style="opacity: 0;">
                <line x1="250" y1="215" x2="350" y2="80" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#scene2-arrow-gray)" />
                <line x1="650" y1="320" x2="550" y2="370" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#scene2-arrow-gray)" />
                <line x1="250" y1="215" x2="150" y2="350" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#scene2-arrow-gray)" />
                <line x1="450" y1="420" x2="550" y2="370" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#scene2-arrow-gray)" />
            </g>

            <!-- 核心向量 EF -->
            <line id="scene2-vec-ef" class="scene2-element" x1="250" y1="215" x2="550" y2="370" stroke="#c62828" stroke-width="3" marker-end="url(#scene2-arrow-red)" style="opacity: 0;" />

            <!-- 推导向量 EG, EH -->
            <g id="scene2-vec-egeh" class="scene2-element" style="opacity: 0;">
                <line x1="250" y1="215" x2="240" y2="371" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#scene2-arrow-green)" />
                <line x1="250" y1="215" x2="440" y2="152" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#scene2-arrow-green)" />
            </g>

            <!-- 辅助线段 GH -->
            <line id="scene2-line-gh" class="scene2-element" x1="240" y1="371" x2="440" y2="152" stroke="#333333" stroke-width="1.5" style="opacity: 0;" />

            <!-- 推导向量 EM -->
            <line id="scene2-vec-em" class="scene2-element" x1="250" y1="215" x2="340" y2="262" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#scene2-arrow-green)" style="opacity: 0;" />

            <!-- 垂线段 GG', HH' -->
            <g id="scene2-lines-perp" class="scene2-element" style="opacity: 0;">
                <line x1="240" y1="371" x2="306" y2="244" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5" />
                <line x1="440" y1="152" x2="374" y2="279" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5" />
                <!-- 直角符号 -->
                <!-- G' 处 -->
                <polyline points="298,240 302,232 310,236" fill="none" stroke="#c62828" stroke-width="1.5" />
                <!-- H' 处 -->
                <polyline points="382,283 378,291 370,287" fill="none" stroke="#c62828" stroke-width="1.5" />
            </g>

            <!-- 点 -->
            <circle cx="350" cy="80" r="3" fill="#000" /> <!-- A -->
            <circle cx="150" cy="350" r="3" fill="#000" /> <!-- B -->
            <circle cx="450" cy="420" r="3" fill="#000" /> <!-- C -->
            <circle cx="650" cy="320" r="3" fill="#000" /> <!-- D -->
            <circle cx="250" cy="215" r="3" fill="#000" /> <!-- E -->
            <circle cx="550" cy="370" r="3" fill="#000" /> <!-- F -->
            <circle cx="240" cy="371" r="3" fill="#000" /> <!-- G -->
            <circle cx="440" cy="152" r="3" fill="#000" /> <!-- H -->
            
            <g id="scene2-pts-m" class="scene2-element" style="opacity: 0;">
                <circle cx="340" cy="262" r="3" fill="#000" /> <!-- M -->
            </g>
            
            <g id="scene2-pts-perp" class="scene2-element" style="opacity: 0;">
                <circle cx="306" cy="244" r="3" fill="#000" /> <!-- G' -->
                <circle cx="374" cy="279" r="3" fill="#000" /> <!-- H' -->
            </g>

            <!-- 标签 -->
            <text x="350" y="65" text-anchor="middle">A</text>
            <text x="135" y="365" text-anchor="end">B</text>
            <text x="450" y="440" text-anchor="middle">C</text>
            <text x="665" y="325" text-anchor="start">D</text>
            <text x="225" y="200" text-anchor="end">E</text>
            <text x="575" y="385" text-anchor="start">F</text>
            <text x="215" y="395" text-anchor="end">G</text>
            <text x="465" y="135" text-anchor="start">H</text>
            
            <g id="scene2-labels-m" class="scene2-element" style="opacity: 0;">
                <text x="315" y="255" text-anchor="end">M</text>
            </g>
            
            <g id="scene2-labels-perp" class="scene2-element" style="opacity: 0;">
                <text x="280" y="225" text-anchor="end">G'</text>
                <text x="400" y="300" text-anchor="start">H'</text>
            </g>
        </svg>

        <div id="scene2-text-panel"></div>

        <div id="scene2-controls">
            <button id="scene2-btn-prev" disabled>◀ 上一步</button>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 4;

        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        const textPanel = document.getElementById('scene2-text-panel');

        const elements = {
            vecAux: document.getElementById('scene2-vec-aux'),
            vecEf: document.getElementById('scene2-vec-ef'),
            vecEgEh: document.getElementById('scene2-vec-egeh'),
            lineGh: document.getElementById('scene2-line-gh'),
            vecEm: document.getElementById('scene2-vec-em'),
            ptsM: document.getElementById('scene2-pts-m'),
            labelsM: document.getElementById('scene2-labels-m'),
            linesPerp: document.getElementById('scene2-lines-perp'),
            ptsPerp: document.getElementById('scene2-pts-perp'),
            labelsPerp: document.getElementById('scene2-labels-perp'),
            polyEfg: document.getElementById('scene2-poly-efg'),
            polyEfh: document.getElementById('scene2-poly-efh'),
            polyMgg: document.getElementById('scene2-poly-mgg'),
            polyMhh: document.getElementById('scene2-poly-mhh')
        };

        const texts = [
            "初始状态：四面体 ABCD 中，E, F 为中点。截面 EGFH 交 BC 于 G，交 AD 于 H。",
            "向量 EF 的分解：<br>$\overrightarrow{EF} = \overrightarrow{EA} + \overrightarrow{AD} + \overrightarrow{DF}$<br>$\overrightarrow{EF} = \overrightarrow{EB} + \overrightarrow{BC} + \overrightarrow{CF}$<br>相加得：$2\overrightarrow{EF} = (\overrightarrow{EA}+\overrightarrow{EB}) + (\overrightarrow{AD}+\overrightarrow{BC}) + (\overrightarrow{DF}+\overrightarrow{CF})$<br>因 E, F 为中点，$\overrightarrow{EA}+\overrightarrow{EB}=\vec{0}$, $\overrightarrow{DF}+\overrightarrow{CF}=\vec{0}$<br>故 $\overrightarrow{EF} = rac{1}{2}(\overrightarrow{AD} + \overrightarrow{BC})$",
            "设 $\overrightarrow{BG} = \lambda \overrightarrow{BC}$, $\overrightarrow{AH} = \mu \overrightarrow{AD}$<br>$\overrightarrow{EG} = \overrightarrow{EB} + \overrightarrow{BG} = rac{1}{2} \overrightarrow{AB} + \lambda \overrightarrow{BC}$<br>$\overrightarrow{EH} = \overrightarrow{EA} + \overrightarrow{AH} = -rac{1}{2} \overrightarrow{AB} + \mu \overrightarrow{AD}$<br>因 E, G, F, H 共面，存在 x, y 使 $\overrightarrow{EF} = x \overrightarrow{EG} + y \overrightarrow{EH}$<br>代入推导可得 $\lambda = \mu$。",
            "取 GH 中点 M。<br>$\overrightarrow{EM} = rac{1}{2}(\overrightarrow{EG} + \overrightarrow{EH})$<br>代入 EG 和 EH 表达式：<br>$\overrightarrow{EM} = rac{1}{2}(\lambda \overrightarrow{BC} + \mu \overrightarrow{AD})$<br>因 $\lambda = \mu$，$\overrightarrow{EM} = \lambda \cdot rac{1}{2}(\overrightarrow{BC} + \overrightarrow{AD}) = \lambda \overrightarrow{EF}$<br>结论：点 M 在直线 EF 上。",
            "作 GG' ⊥ EF, HH' ⊥ EF。<br>在 △MGG' 和 △MHH' 中：<br>∠G'MG = ∠H'MH, ∠MG'G = ∠MH'H = 90°<br>MG = MH<br>所以 △MGG' ≌ △MHH'，得 GG' = HH'。<br>结论：$S_{	riangle EFG} = S_{	riangle EFH}$ (等底等高)。"
        ];

        function setOpacity(el, val) {
            if(el) el.style.opacity = val;
        }

        function updateScene() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;

            textPanel.innerHTML = texts[currentStep];
            if (window.MathJax) {
                MathJax.typesetPromise([textPanel]).catch(function (err) {
                    console.error(err.message);
                });
            }

            // Step 0: 初始
            setOpacity(elements.vecAux, currentStep === 1 ? '1' : '0');
            setOpacity(elements.vecEf, currentStep >= 1 ? '1' : '0');
            
            setOpacity(elements.vecEgEh, currentStep >= 2 ? '1' : '0');
            
            setOpacity(elements.lineGh, currentStep >= 3 ? '1' : '0');
            setOpacity(elements.vecEm, currentStep >= 3 ? '1' : '0');
            setOpacity(elements.ptsM, currentStep >= 3 ? '1' : '0');
            setOpacity(elements.labelsM, currentStep >= 3 ? '1' : '0');
            
            setOpacity(elements.linesPerp, currentStep >= 4 ? '1' : '0');
            setOpacity(elements.ptsPerp, currentStep >= 4 ? '1' : '0');
            setOpacity(elements.labelsPerp, currentStep >= 4 ? '1' : '0');
            setOpacity(elements.polyEfg, currentStep >= 4 ? '0.2' : '0');
            setOpacity(elements.polyEfh, currentStep >= 4 ? '0.2' : '0');
            setOpacity(elements.polyMgg, currentStep >= 4 ? '0.4' : '0');
            setOpacity(elements.polyMhh, currentStep >= 4 ? '0.4' : '0');
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });

        // 初始化
        updateScene();
    })();
    </script>
</body>
</html>
