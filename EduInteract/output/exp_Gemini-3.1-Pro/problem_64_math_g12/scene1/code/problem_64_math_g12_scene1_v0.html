<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; user-select: none; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button:hover:not(:disabled) { background: #e9e9e9; }
        .math-label { position: absolute; font-size: 16px; pointer-events: none; transform: translate(-50%, -50%); }
        .hidden { display: none !important; opacity: 0 !important; }
        .fade { transition: opacity 0.5s ease; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" style="position: absolute; top: 0; left: 0; cursor: grab;">
            <!-- 3D Prism Elements -->
            <g id="scene1-prism-group">
                <!-- Auxiliary Plane -->
                <polygon id="scene1-plane-bb1d1d" fill="#1565c0" opacity="0" />
                <!-- Translation Trajectory -->
                <polygon id="scene1-plane-traj" fill="#1565c0" opacity="0" />
                
                <!-- Hidden Lines (Dashed) -->
                <path id="scene1-line-a1a" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" fill="none" />
                <path id="scene1-line-ab" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" fill="none" />
                <path id="scene1-line-ad" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" fill="none" />
                
                <!-- Solid Lines -->
                <path id="scene1-line-a1b1" stroke="#000000" stroke-width="2" fill="none" />
                <path id="scene1-line-b1c1" stroke="#000000" stroke-width="2" fill="none" />
                <path id="scene1-line-c1d1" stroke="#000000" stroke-width="2" fill="none" />
                <path id="scene1-line-d1a1" stroke="#000000" stroke-width="2" fill="none" />
                <path id="scene1-line-b1b" stroke="#000000" stroke-width="2" fill="none" />
                <path id="scene1-line-c1c" stroke="#000000" stroke-width="2" fill="none" />
                <path id="scene1-line-d1d" stroke="#000000" stroke-width="2" fill="none" />
                <path id="scene1-line-bc" stroke="#000000" stroke-width="2" fill="none" />
                <path id="scene1-line-cd" stroke="#000000" stroke-width="2" fill="none" />
                
                <!-- Target Lines -->
                <path id="scene1-line-ac" stroke="#c62828" stroke-width="3" fill="none" />
                <path id="scene1-line-b1d1" stroke="#1565c0" stroke-width="3" fill="none" />
                <path id="scene1-line-bd" stroke="#1565c0" stroke-width="3" fill="none" opacity="0" />
                <path id="scene1-line-b1d1-moving" stroke="#1565c0" stroke-width="3" fill="none" opacity="0" />
                
                <!-- Highlights & Aux Lines -->
                <path id="scene1-line-bb1-hl" stroke="#2e7d32" stroke-width="4" fill="none" opacity="0" />
                <path id="scene1-line-oo1" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5,5" fill="none" opacity="0" />
                
                <!-- Right Angle Symbols -->
                <path id="scene1-ra1" stroke="#000000" stroke-width="1.5" fill="none" opacity="0" />
                <path id="scene1-ra2" stroke="#c62828" stroke-width="1.5" fill="none" opacity="0" />
            </g>

            <!-- 2D View Elements -->
            <g id="scene1-2d-group" opacity="0" transform="translate(660, 350)">
                <polygon points="0,-80 -80,0 0,80 80,0" stroke="#000000" stroke-width="2" fill="none" />
                <line x1="0" y1="-80" x2="0" y2="80" stroke="#c62828" stroke-width="2" />
                <line x1="-80" y1="0" x2="80" y2="0" stroke="#1565c0" stroke-width="2" />
                <polyline points="10,0 10,10 0,10" stroke="#000000" stroke-width="1.5" fill="none" />
                <text x="0" y="-130" text-anchor="middle" font-size="16">底面 ABCD</text>
            </g>
        </svg>

        <!-- 3D Labels -->
        <div id="scene1-label-a" class="math-label">\(A\)</div>
        <div id="scene1-label-b" class="math-label">\(B\)</div>
        <div id="scene1-label-c" class="math-label">\(C\)</div>
        <div id="scene1-label-d" class="math-label">\(D\)</div>
        <div id="scene1-label-a1" class="math-label">\(A_1\)</div>
        <div id="scene1-label-b1" class="math-label">\(B_1\)</div>
        <div id="scene1-label-c1" class="math-label">\(C_1\)</div>
        <div id="scene1-label-d1" class="math-label">\(D_1\)</div>
        <div id="scene1-label-o" class="math-label fade" style="opacity: 0;">\(O\)</div>

        <!-- 2D Labels -->
        <div id="scene1-label-2d-a" class="math-label fade" style="opacity: 0; left: 660px; top: 250px;">\(A\)</div>
        <div id="scene1-label-2d-b" class="math-label fade" style="opacity: 0; left: 560px; top: 350px;">\(B\)</div>
        <div id="scene1-label-2d-c" class="math-label fade" style="opacity: 0; left: 660px; top: 450px;">\(C\)</div>
        <div id="scene1-label-2d-d" class="math-label fade" style="opacity: 0; left: 760px; top: 350px;">\(D\)</div>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // State
        let currentStep = 0;
        let angleY = 0;
        let isDragging = false;
        let lastMouseX = 0;
        let movingY = 180; // For translation animation
        let animationFrameId = null;

        // 3D Coordinates
        const pts3d = {
            O: {x: 0, y: 0, z: 0},
            A: {x: 0, y: 0, z: -100},
            B: {x: -100, y: 0, z: 0},
            C: {x: 0, y: 0, z: 100},
            D: {x: 100, y: 0, z: 0},
            A1: {x: 0, y: 180, z: -100},
            B1: {x: -100, y: 180, z: 0},
            C1: {x: 0, y: 180, z: 100},
            D1: {x: 100, y: 180, z: 0},
            O1: {x: 0, y: 180, z: 0}
        };

        // Projection function
        function project(x, y, z) {
            let rx = x * Math.cos(angleY) - z * Math.sin(angleY);
            let rz = x * Math.sin(angleY) + z * Math.cos(angleY);
            return {
                x: 380 + rx - rz * 0.5,
                y: 330 - y + rz * 0.3
            };
        }

        // Update SVG paths and labels
        function updatePaths() {
            const p = {};
            for (let key in pts3d) {
                p[key] = project(pts3d[key].x, pts3d[key].y, pts3d[key].z);
            }

            // Helper to set path d
            const setD = (id, d) => document.getElementById(id).setAttribute('d', d);

            // Hidden lines
            setD('scene1-line-a1a', `M ${p.A1.x} ${p.A1.y} L ${p.A.x} ${p.A.y}`);
            setD('scene1-line-ab', `M ${p.A.x} ${p.A.y} L ${p.B.x} ${p.B.y}`);
            setD('scene1-line-ad', `M ${p.A.x} ${p.A.y} L ${p.D.x} ${p.D.y}`);

            // Solid lines
            setD('scene1-line-a1b1', `M ${p.A1.x} ${p.A1.y} L ${p.B1.x} ${p.B1.y}`);
            setD('scene1-line-b1c1', `M ${p.B1.x} ${p.B1.y} L ${p.C1.x} ${p.C1.y}`);
            setD('scene1-line-c1d1', `M ${p.C1.x} ${p.C1.y} L ${p.D1.x} ${p.D1.y}`);
            setD('scene1-line-d1a1', `M ${p.D1.x} ${p.D1.y} L ${p.A1.x} ${p.A1.y}`);
            setD('scene1-line-b1b', `M ${p.B1.x} ${p.B1.y} L ${p.B.x} ${p.B.y}`);
            setD('scene1-line-c1c', `M ${p.C1.x} ${p.C1.y} L ${p.C.x} ${p.C.y}`);
            setD('scene1-line-d1d', `M ${p.D1.x} ${p.D1.y} L ${p.D.x} ${p.D.y}`);
            setD('scene1-line-bc', `M ${p.B.x} ${p.B.y} L ${p.C.x} ${p.C.y}`);
            setD('scene1-line-cd', `M ${p.C.x} ${p.C.y} L ${p.D.x} ${p.D.y}`);

            // Target lines
            setD('scene1-line-ac', `M ${p.A.x} ${p.A.y} L ${p.C.x} ${p.C.y}`);
            setD('scene1-line-b1d1', `M ${p.B1.x} ${p.B1.y} L ${p.D1.x} ${p.D1.y}`);
            setD('scene1-line-bd', `M ${p.B.x} ${p.B.y} L ${p.D.x} ${p.D.y}`);

            // Moving line
            const pBm = project(-100, movingY, 0);
            const pDm = project(100, movingY, 0);
            setD('scene1-line-b1d1-moving', `M ${pBm.x} ${pBm.y} L ${pDm.x} ${pDm.y}`);

            // Trajectory plane
            document.getElementById('scene1-plane-traj').setAttribute('points', 
                `${p.B1.x},${p.B1.y} ${p.D1.x},${p.D1.y} ${pDm.x},${pDm.y} ${pBm.x},${pBm.y}`);

            // Auxiliary plane BB1D1D
            document.getElementById('scene1-plane-bb1d1d').setAttribute('points', 
                `${p.B1.x},${p.B1.y} ${p.D1.x},${p.D1.y} ${p.D.x},${p.D.y} ${p.B.x},${p.B.y}`);

            // Highlights & Aux lines
            setD('scene1-line-bb1-hl', `M ${p.B1.x} ${p.B1.y} L ${p.B.x} ${p.B.y}`);
            setD('scene1-line-oo1', `M ${p.O.x} ${p.O.y} L ${p.O1.x} ${p.O1.y}`);

            // Right Angle 1 (BB1 perp AC) -> OO1 perp OC
            const ra1_1 = project(0, 20, 0);
            const ra1_2 = project(0, 20, 20);
            const ra1_3 = project(0, 0, 20);
            setD('scene1-ra1', `M ${ra1_1.x} ${ra1_1.y} L ${ra1_2.x} ${ra1_2.y} L ${ra1_3.x} ${ra1_3.y}`);

            // Right Angle 2 (AC perp BD)
            const ra2_1 = project(0, 0, 20);
            const ra2_2 = project(20, 0, 20);
            const ra2_3 = project(20, 0, 0);
            setD('scene1-ra2', `M ${ra2_1.x} ${ra2_1.y} L ${ra2_2.x} ${ra2_2.y} L ${ra2_3.x} ${ra2_3.y}`);

            // Update Labels
            const setLabel = (id, x, y, dx, dy) => {
                const el = document.getElementById(id);
                if(el) {
                    el.style.left = (x + dx) + 'px';
                    el.style.top = (y + dy) + 'px';
                }
            };
            setLabel('scene1-label-a', p.A.x, p.A.y, 65, -75);
            setLabel('scene1-label-b', p.B.x, p.B.y, -25, 0);
            setLabel('scene1-label-c', p.C.x, p.C.y, 0, 20);
            setLabel('scene1-label-d', p.D.x, p.D.y, 25, 0);
            setLabel('scene1-label-a1', p.A1.x, p.A1.y, 0, -25);
            setLabel('scene1-label-b1', p.B1.x, p.B1.y, -25, 0);
            setLabel('scene1-label-c1', p.C1.x, p.C1.y, 85, 85);
            setLabel('scene1-label-d1', p.D1.x, p.D1.y, 25, 0);
            setLabel('scene1-label-o', p.O.x, p.O.y, -95, 95);
        }

        // Initialize
        updatePaths();

        // Dragging logic
        const svg = document.getElementById('scene1-svg');
        svg.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastMouseX = e.clientX;
            svg.style.cursor = 'grabbing';
        });
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const dx = e.clientX - lastMouseX;
            angleY += dx * 0.01;
            // Limit angle to [-0.5, 0.5]
            angleY = Math.max(-0.5, Math.min(0.5, angleY));
            lastMouseX = e.clientX;
            updatePaths();
        });
        window.addEventListener('mouseup', () => {
            isDragging = false;
            svg.style.cursor = 'grab';
        });

        // Step logic
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');

        function setOpacity(id, opacity) {
            const el = document.getElementById(id);
            if(el) el.style.opacity = opacity;
        }

        function animateTranslation(targetY, duration, callback) {
            const startY = movingY;
            const startTime = performance.now();
            
            function step(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                // Ease in out
                const ease = progress < 0.5 ? 2 * progress * progress : -1 + (4 - 2 * progress) * progress;
                movingY = startY + (targetY - startY) * ease;
                updatePaths();
                
                if (progress < 1) {
                    animationFrameId = requestAnimationFrame(step);
                } else if (callback) {
                    callback();
                }
            }
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            animationFrameId = requestAnimationFrame(step);
        }

        function updateStep() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === 4;

            // Reset all dynamic elements
            setOpacity('scene1-line-bd', 0);
            setOpacity('scene1-line-b1d1-moving', 0);
            setOpacity('scene1-plane-traj', 0);
            setOpacity('scene1-line-bb1-hl', 0);
            setOpacity('scene1-line-oo1', 0);
            setOpacity('scene1-ra1', 0);
            setOpacity('scene1-plane-bb1d1d', 0);
            setOpacity('scene1-ra2', 0);
            setOpacity('scene1-2d-group', 0);
            setOpacity('scene1-label-o', 0);
            setOpacity('scene1-label-2d-a', 0);
            setOpacity('scene1-label-2d-b', 0);
            setOpacity('scene1-label-2d-c', 0);
            setOpacity('scene1-label-2d-d', 0);

            if (animationFrameId) cancelAnimationFrame(animationFrameId);

            if (currentStep === 0) {
                movingY = 180;
                updatePaths();
            } else if (currentStep === 1) {
                setOpacity('scene1-line-b1d1-moving', 1);
                setOpacity('scene1-plane-traj', 0.1);
                animateTranslation(0, 800, () => {
                    setOpacity('scene1-line-bd', 1);
                    setOpacity('scene1-line-b1d1-moving', 0);
                    setOpacity('scene1-plane-traj', 0);
                });
            } else if (currentStep >= 2) {
                movingY = 0;
                updatePaths();
                setOpacity('scene1-line-bd', 1);
                
                if (currentStep === 2) {
                    setOpacity('scene1-line-bb1-hl', 1);
                    setOpacity('scene1-line-oo1', 1);
                    setOpacity('scene1-ra1', 1);
                    setOpacity('scene1-label-o', 1);
                } else if (currentStep === 3) {
                    setOpacity('scene1-line-bb1-hl', 1);
                    setOpacity('scene1-line-oo1', 1);
                    setOpacity('scene1-plane-bb1d1d', 0.2);
                    setOpacity('scene1-ra2', 1);
                    setOpacity('scene1-label-o', 1);
                    // Blinking effect for ra2 could be added here
                } else if (currentStep === 4) {
                    setOpacity('scene1-line-bb1-hl', 1);
                    setOpacity('scene1-line-oo1', 1);
                    setOpacity('scene1-plane-bb1d1d', 0.2);
                    setOpacity('scene1-ra2', 1);
                    setOpacity('scene1-label-o', 1);
                    setOpacity('scene1-2d-group', 1);
                    setOpacity('scene1-label-2d-a', 1);
                    setOpacity('scene1-label-2d-b', 1);
                    setOpacity('scene1-label-2d-c', 1);
                    setOpacity('scene1-label-2d-d', 1);
                }
            }
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < 4) {
                currentStep++;
                updateStep();
            }
        });

    })();
    </script>
</body>
</html>
