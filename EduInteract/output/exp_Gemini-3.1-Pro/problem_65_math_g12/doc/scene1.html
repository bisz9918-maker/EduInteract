<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisualSolver Scene</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button:hover:not(:disabled) { background: #e9e9e9; }
        
        /* SVG Elements */
        .scene1-text { font-size: 16px; font-family: serif; user-select: none; }
        .scene1-math { font-style: italic; }
        
        /* Transitions */
        .scene1-transition { transition: all 0.3s ease; }
        
        /* Specific styles */
        #scene1-cd { stroke-dasharray: 5, 5; }
    </style>
    <!-- MathJax -->
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <!-- Base Shapes -->
            <!-- Triangle ABC split into lines to avoid bounding box overlaps with texts -->
            <line id="scene1-line-ac" x1="500" y1="110" x2="500" y2="350" stroke="#000" stroke-width="1.5" class="scene1-transition" />
            <line id="scene1-line-bc" x1="180" y1="350" x2="500" y2="350" stroke="#000" stroke-width="1.5" class="scene1-transition" />
            <line id="scene1-line-ad" x1="500" y1="110" x2="384.8" y2="196.4" stroke="#000" stroke-width="1.5" class="scene1-transition" />
            <!-- Line DB split at Y=260 (X=300) -->
            <line id="scene1-line-db1" x1="384.8" y1="196.4" x2="300" y2="260" stroke="#000" stroke-width="1.5" class="scene1-transition" />
            <line id="scene1-line-db2" x1="300" y1="260" x2="180" y2="350" stroke="#000" stroke-width="1.5" class="scene1-transition" />

            <!-- Circle O split into 8 arcs to avoid bounding box overlaps with center text O -->
            <path d="M 620 230 A 120 120 0 0 1 584.85 314.85" fill="none" stroke="#000" stroke-width="1.5" />
            <path d="M 584.85 314.85 A 120 120 0 0 1 500 350" fill="none" stroke="#000" stroke-width="1.5" />
            <path d="M 500 350 A 120 120 0 0 1 415.15 314.85" fill="none" stroke="#000" stroke-width="1.5" />
            <path d="M 415.15 314.85 A 120 120 0 0 1 380 230" fill="none" stroke="#000" stroke-width="1.5" />
            <path d="M 380 230 A 120 120 0 0 1 415.15 145.15" fill="none" stroke="#000" stroke-width="1.5" />
            <path d="M 415.15 145.15 A 120 120 0 0 1 500 110" fill="none" stroke="#000" stroke-width="1.5" />
            <path d="M 500 110 A 120 120 0 0 1 584.85 145.15" fill="none" stroke="#000" stroke-width="1.5" />
            <path d="M 584.85 145.15 A 120 120 0 0 1 620 230" fill="none" stroke="#000" stroke-width="1.5" />
            
            <!-- Right Angle C -->
            <polyline points="500,335 485,335 485,350" fill="none" stroke="#000" stroke-width="1.5" />

            <!-- Step 1 Elements -->
            <g id="scene1-step1-group" class="scene1-transition" style="opacity: 0; display: none;">
                <!-- Annotation line split at Y=185 (X=350) -->
                <polyline points="488,94 482,86 350,185" fill="none" stroke="#000" stroke-width="1" />
                <polyline points="350,185 162,326 168,334" fill="none" stroke="#000" stroke-width="1" />
                <text x="280" y="175" class="scene1-text scene1-math">AB=10</text>
            </g>

            <!-- Step 2 Elements -->
            <g id="scene1-step2-group" class="scene1-transition" style="opacity: 0; display: none;">
                <line id="scene1-cd" x1="500" y1="350" x2="384.8" y2="196.4" stroke="#888" stroke-width="1.5" />
                <polyline points="396.8,187.4 405.8,199.4 393.8,208.4" fill="none" stroke="#000" stroke-width="1.5" />
            </g>

            <!-- Step 3 Elements -->
            <g id="scene1-step3-group" class="scene1-transition" style="opacity: 0; display: none;">
                <!-- Filled Triangle BCD split into two polygons to avoid text BD=? -->
                <polygon points="384.8,196.4 436.25,265 293.33,265" fill="#1565c0" opacity="0.2" />
                <polygon points="293.33,265 436.25,265 500,350 180,350" fill="#1565c0" opacity="0.2" />
                <path d="M 210 350 A 30 30 0 0 0 204 332" fill="none" stroke="#2e7d32" stroke-width="3" />
                <text x="240" y="250" class="scene1-text scene1-math">BD=?</text>
                <text x="150" y="100" class="scene1-text scene1-math">△BCD ∼ △BAC</text>
            </g>

            <!-- Highlights (Dynamic) -->
            <g id="scene1-highlight-abc" class="scene1-transition" style="opacity: 0; display: none;">
                <line x1="500" y1="110" x2="500" y2="350" stroke="#1565c0" stroke-width="3" />
                <line x1="180" y1="350" x2="500" y2="350" stroke="#1565c0" stroke-width="3" />
                <line x1="500" y1="110" x2="384.8" y2="196.4" stroke="#1565c0" stroke-width="3" />
                <line x1="384.8" y1="196.4" x2="300" y2="260" stroke="#1565c0" stroke-width="3" />
                <line x1="300" y1="260" x2="180" y2="350" stroke="#1565c0" stroke-width="3" />
            </g>
            <g id="scene1-highlight-acd" class="scene1-transition" style="opacity: 0; display: none;">
                <line x1="500" y1="110" x2="500" y2="350" stroke="#1565c0" stroke-width="3" />
                <line x1="500" y1="110" x2="384.8" y2="196.4" stroke="#1565c0" stroke-width="3" />
                <line x1="500" y1="350" x2="384.8" y2="196.4" stroke="#1565c0" stroke-width="3" />
            </g>

            <!-- Points -->
            <circle cx="500" cy="110" r="4" fill="#000" />
            <circle cx="180" cy="350" r="4" fill="#000" />
            <circle cx="500" cy="350" r="4" fill="#000" />
            <circle cx="500" cy="230" r="4" fill="#000" />
            <circle cx="384.8" cy="196.4" r="4" fill="#000" />

            <!-- Labels -->
            <text x="510" y="95" class="scene1-text scene1-math">A</text>
            <text x="160" y="365" class="scene1-text scene1-math">B</text>
            <text x="515" y="365" class="scene1-text scene1-math">C</text>
            <text x="515" y="235" class="scene1-text scene1-math">O</text>
            <text x="365" y="185" class="scene1-text scene1-math">D</text>

            <!-- Known Conditions -->
            <text x="520" y="290" class="scene1-text scene1-math">AC=6</text>
            <text x="340" y="375" class="scene1-text scene1-math">BC=8</text>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 3;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');

        const step1Group = document.getElementById('scene1-step1-group');
        const step2Group = document.getElementById('scene1-step2-group');
        const step3Group = document.getElementById('scene1-step3-group');
        
        const highlightAbc = document.getElementById('scene1-highlight-abc');
        const highlightAcd = document.getElementById('scene1-highlight-acd');
        
        const baseLines = [
            document.getElementById('scene1-line-ac'),
            document.getElementById('scene1-line-bc'),
            document.getElementById('scene1-line-ad'),
            document.getElementById('scene1-line-db1'),
            document.getElementById('scene1-line-db2')
        ];

        function show(el) {
            el.style.display = '';
            // Small delay to allow display to apply before opacity transition
            setTimeout(() => { el.style.opacity = '1'; }, 10);
        }

        function hide(el) {
            el.style.opacity = '0';
            setTimeout(() => { el.style.display = 'none'; }, 300);
        }

        function updateState() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;

            // Reset all dynamic states
            hide(step1Group);
            hide(step2Group);
            hide(step3Group);
            hide(highlightAbc);
            hide(highlightAcd);
            baseLines.forEach(line => line.setAttribute('stroke-width', '1.5'));

            if (currentStep >= 1) {
                show(step1Group);
            }
            if (currentStep === 1) {
                show(highlightAbc);
            }

            if (currentStep >= 2) {
                show(step2Group);
            }
            if (currentStep === 2) {
                show(highlightAcd);
            }

            if (currentStep >= 3) {
                show(step3Group);
                baseLines.forEach(line => line.setAttribute('stroke-width', '3'));
            }
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateState();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateState();
            }
        });

        // Initialize
        updateState();
    })();
    </script>
</body>
</html>
