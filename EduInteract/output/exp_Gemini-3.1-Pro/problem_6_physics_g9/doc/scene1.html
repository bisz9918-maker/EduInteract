<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        .wire { fill: none; stroke: #000000; stroke-width: 2; }
        .component { fill: #ffffff; stroke: #000000; stroke-width: 2; }
        .highlight { fill: #c62828; opacity: 0.3; }
        .label { font-size: 16px; fill: #000000; text-anchor: middle; dominant-baseline: middle; }
        .label-left { font-size: 16px; fill: #000000; text-anchor: end; dominant-baseline: middle; }
        .label-right { font-size: 16px; fill: #000000; text-anchor: start; dominant-baseline: middle; }
        .arrow { fill: none; stroke-width: 2; marker-end: url(#scene1-arrowhead); }
        .arrow-g { stroke: #2e7d32; marker-end: url(#scene1-arrowhead-g); }
        .arrow-mag { stroke: #1565c0; marker-end: url(#scene1-arrowhead-mag); }
        .arrow-pull { stroke: #c62828; marker-end: url(#scene1-arrowhead-pull); }
        .mag-line { fill: none; stroke: #1565c0; stroke-width: 1.5; stroke-dasharray: 4 2; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <defs>
                <marker id="scene1-arrowhead" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
                </marker>
                <marker id="scene1-arrowhead-g" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32" />
                </marker>
                <marker id="scene1-arrowhead-mag" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0" />
                </marker>
                <marker id="scene1-arrowhead-pull" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828" />
                </marker>
            </defs>

            <!-- 导线 -->
            <path class="wire" d="M 300 410 L 150 410 L 150 260" />
            <path class="wire" d="M 150 200 L 150 130 L 250 130" />
            <path class="wire" d="M 400 130 L 600 130 L 600 260" />
            <path class="wire" d="M 600 380 L 600 410 L 450 410" />
            <path class="wire" d="M 400 410 L 350 410" />
            <path class="wire" d="M 250 330 L 200 330 L 200 290 L 260 290" id="scene1-wire-slider" />

            <!-- 电源 -->
            <line x1="300" y1="390" x2="300" y2="430" stroke="#000" stroke-width="2" />
            <line x1="315" y1="400" x2="315" y2="420" stroke="#000" stroke-width="4" />
            <line x1="335" y1="390" x2="335" y2="430" stroke="#000" stroke-width="2" />
            <line x1="350" y1="400" x2="350" y2="420" stroke="#000" stroke-width="4" />
            <line x1="315" y1="410" x2="335" y2="410" stroke="#000" stroke-width="2" />
            <text x="325" y="445" class="label">E</text>

            <!-- 开关 -->
            <circle cx="400" cy="410" r="3" fill="#000" />
            <circle cx="450" cy="410" r="3" fill="#000" />
            <line x1="400" y1="410" x2="440" y2="390" stroke="#000" stroke-width="2" />
            <text x="425" y="445" class="label">S</text>

            <!-- 定值电阻 -->
            <rect x="250" y="110" width="150" height="40" class="component" />
            <text x="325" y="95" class="label">R</text>

            <!-- 电流表 -->
            <circle cx="150" cy="230" r="30" class="component" />
            <text x="110" y="230" class="label">A</text>
            <line x1="150" y1="230" x2="150" y2="205" stroke="#c62828" stroke-width="2" id="scene1-ammeter-pointer" transform="rotate(45, 150, 230)" />

            <!-- 滑动变阻器 -->
            <rect x="250" y="310" width="150" height="40" class="component" />
            <rect x="250" y="310" width="10" height="40" class="highlight" id="scene1-resistor-highlight" />
            <text x="325" y="370" class="label">R'</text>
            
            <!-- 滑片 -->
            <polygon points="260,290 270,310 250,310" fill="#000" id="scene1-slider-head" />
            <line x1="260" y1="290" x2="260" y2="270" stroke="#000" stroke-width="2" id="scene1-slider-stem" />

            <!-- 电磁铁 -->
            <rect x="580" y="260" width="40" height="120" class="component" />
            <path d="M 580 270 Q 620 280 580 290 Q 620 300 580 310 Q 620 320 580 330 Q 620 340 580 350 Q 620 360 580 370" fill="none" stroke="#000" stroke-width="2" />
            <text x="660" y="320" class="label-right">电磁铁</text>
            
            <!-- 磁感线 -->
            <g id="scene1-mag-lines" opacity="1">
                <path d="M 590 260 C 550 200, 550 440, 590 380" class="mag-line" />
                <path d="M 610 260 C 650 200, 650 440, 610 380" class="mag-line" />
                <path d="M 585 260 C 520 180, 520 460, 585 380" class="mag-line" />
                <path d="M 615 260 C 680 180, 680 460, 615 380" class="mag-line" />
            </g>

            <!-- 弹簧测力计 -->
            <rect x="580" y="30" width="40" height="120" class="component" />
            <text x="630" y="90" class="label-right">弹簧测力计</text>
            <!-- 刻度 -->
            <line x1="580" y1="50" x2="590" y2="50" stroke="#000" stroke-width="1" />
            <line x1="580" y1="70" x2="590" y2="70" stroke="#000" stroke-width="1" />
            <line x1="580" y1="90" x2="590" y2="90" stroke="#000" stroke-width="1" />
            <line x1="580" y1="110" x2="590" y2="110" stroke="#000" stroke-width="1" />
            <line x1="580" y1="130" x2="590" y2="130" stroke="#000" stroke-width="1" />
            <!-- 弹簧 -->
            <path d="M 600 30 L 595 40 L 605 50 L 595 60 L 605 70 L 595 80 L 605 90 L 595 100 L 600 110" fill="none" stroke="#000" stroke-width="2" id="scene1-spring" />
            <!-- 指针 -->
            <line x1="580" y1="110" x2="620" y2="110" stroke="#c62828" stroke-width="3" id="scene1-spring-pointer" />
            <!-- 挂钩 -->
            <line x1="600" y1="110" x2="600" y2="185" stroke="#000" stroke-width="2" id="scene1-hook" />

            <!-- 铁球 -->
            <circle cx="600" cy="200" r="15" fill="#9e9e9e" stroke="#000" stroke-width="2" id="scene1-ball" />
            <text x="440" y="200" class="label-left">铁球</text>

            <!-- 受力箭头 -->
            <!-- 重力 G -->
            <line x1="595" y1="200" x2="595" y2="240" class="arrow arrow-g" />
            <text x="460" y="230" class="label-left" fill="#2e7d32">G</text>
            
            <!-- 磁力 F_磁 -->
            <line x1="605" y1="200" x2="605" y2="240" class="arrow arrow-mag" id="scene1-f-mag" />
            <text x="615" y="220" class="label-right" fill="#1565c0" id="scene1-f-mag-label">F_磁</text>
            
            <!-- 拉力 F_拉 -->
            <line x1="600" y1="200" x2="600" y2="120" class="arrow arrow-pull" id="scene1-f-pull" />
            <text x="460" y="160" class="label-left" fill="#c62828" id="scene1-f-pull-label">F_拉</text>

        </svg>
        <div id="scene1-controls">
            <label for="scene1-slider" style="font-size: 14px;">调节滑片：</label>
            <input type="range" id="scene1-slider" min="0" max="100" value="0" style="width: 300px;">
        </div>
    </div>
    <script>
    (function() {
        const slider = document.getElementById('scene1-slider');
        const sliderHead = document.getElementById('scene1-slider-head');
        const sliderStem = document.getElementById('scene1-slider-stem');
        const wireSlider = document.getElementById('scene1-wire-slider');
        const resistorHighlight = document.getElementById('scene1-resistor-highlight');
        const ammeterPointer = document.getElementById('scene1-ammeter-pointer');
        const magLines = document.getElementById('scene1-mag-lines');
        const fMag = document.getElementById('scene1-f-mag');
        const fMagLabel = document.getElementById('scene1-f-mag-label');
        const fPull = document.getElementById('scene1-f-pull');
        const fPullLabel = document.getElementById('scene1-f-pull-label');
        const spring = document.getElementById('scene1-spring');
        const springPointer = document.getElementById('scene1-spring-pointer');
        const hook = document.getElementById('scene1-hook');
        const ball = document.getElementById('scene1-ball');

        function updateScene() {
            const t = parseInt(slider.value) / 100; // 0 to 1
            
            // 滑片位置 x: 260 到 390
            const x = 260 + 130 * t;
            sliderHead.setAttribute('points', `${x},290 ${x+10},310 ${x-10},310`);
            sliderStem.setAttribute('x1', x);
            sliderStem.setAttribute('x2', x);
            
            // 导线连接滑片
            wireSlider.setAttribute('d', `M 250 330 L 200 330 L 200 290 L ${x} 290`);
            
            // 有效电阻高亮宽度
            resistorHighlight.setAttribute('width', x - 250);
            
            // 电流 I: 1 到 0.4 (随电阻增大而减小)
            const I = 1 - 0.6 * t;
            
            // 电流表指针角度: 15 + 30 * I (45 到 27)
            const angle = 15 + 30 * I;
            ammeterPointer.setAttribute('transform', `rotate(${angle}, 150, 230)`);
            
            // 磁感线透明度: 0.2 + 0.8 * I (1.0 到 0.52)
            magLines.setAttribute('opacity', 0.2 + 0.8 * I);
            
            // 磁力 F_磁 长度: 40 * I (40 到 16)
            const L_mag = 40 * I;
            fMag.setAttribute('y2', 200 + L_mag);
            fMagLabel.setAttribute('y', 200 + L_mag / 2);
            
            // 拉力 F_拉 长度: 40 (重力) + L_mag (80 到 56)
            const L_pull = 40 + L_mag;
            fPull.setAttribute('y2', 200 - L_pull);
            fPullLabel.setAttribute('y', 200 - L_pull / 2);
            
            // 弹簧指针位置: 110 (最大拉力) 到 86 (最小拉力)
            // 假设拉力80对应y=110，拉力56对应y=86 (y = 30 + L_pull)
            const pointerY = 30 + L_pull;
            springPointer.setAttribute('y1', pointerY);
            springPointer.setAttribute('y2', pointerY);
            
            // 弹簧形变
            // 弹簧顶部固定在 y=30，底部在 pointerY
            const springH = pointerY - 30;
            const dy = springH / 8;
            spring.setAttribute('d', `M 600 30 L 595 ${30+dy} L 605 ${30+2*dy} L 595 ${30+3*dy} L 605 ${30+4*dy} L 595 ${30+5*dy} L 605 ${30+6*dy} L 595 ${30+7*dy} L 600 ${pointerY}`);
            
            // 挂钩和铁球位置
            // 铁球中心 y = pointerY + 90
            const ballY = pointerY + 90;
            ball.setAttribute('cy', ballY);
            hook.setAttribute('y1', pointerY);
            hook.setAttribute('y2', ballY - 15);
            
            // 更新受力箭头和标签的起点
            document.querySelector('.arrow-g').setAttribute('y1', ballY);
            document.querySelector('.arrow-g').setAttribute('y2', ballY + 40);
            document.querySelector('.arrow-g').nextElementSibling.setAttribute('y', ballY + 30);
            
            fMag.setAttribute('y1', ballY);
            fMag.setAttribute('y2', ballY + L_mag);
            fMagLabel.setAttribute('y', ballY + L_mag / 2);
            
            fPull.setAttribute('y1', ballY);
            fPull.setAttribute('y2', ballY - L_pull);
            fPullLabel.setAttribute('y', ballY - L_pull / 2);
            
            document.querySelector('text.label-left[fill="#000000"]').setAttribute('y', ballY); // 铁球标签
        }

        slider.addEventListener('input', updateScene);
        updateScene(); // 初始化
    })();
    </script>
</body>
</html>
