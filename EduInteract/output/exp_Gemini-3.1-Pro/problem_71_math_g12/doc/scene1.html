<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        .scene1-label { position: absolute; font-size: 14px; color: #333333; pointer-events: none; transform: translate(-50%, -50%); }
        .scene1-axis { stroke: #000000; stroke-width: 1; }
        .scene1-bar { fill: #1565c0; transition: height 0.1s, y 0.1s, fill 0.3s; }
        .scene1-bar-text { position: absolute; font-size: 12px; color: #333333; pointer-events: none; transform: translate(-50%, -100%); transition: top 0.1s; }
        .scene1-bar-text.highlight { color: #c62828; font-weight: bold; font-size: 14px; }
        .scene1-bar.highlight { fill: #c62828; }
        .scene1-bar.success { fill: #2e7d32; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <defs>
                <marker id="scene1-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
                </marker>
                <marker id="scene1-arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828" />
                </marker>
            </defs>
            
            <!-- Left Geometric Area -->
            <circle cx="200" cy="220" r="140" fill="none" stroke="#000000" stroke-width="2" />
            <polygon points="340,220 270,98.76 130,98.76 60,220 130,341.24 270,341.24" fill="none" stroke="#000000" stroke-width="2" />
            
            <!-- Vectors OA_i -->
            <line x1="200" y1="220" x2="340" y2="220" stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrow)" />
            <line x1="200" y1="220" x2="270" y2="98.76" stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrow)" />
            <line x1="200" y1="220" x2="130" y2="98.76" stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrow)" />
            <line x1="200" y1="220" x2="60" y2="220" stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrow)" />
            <line x1="200" y1="220" x2="130" y2="341.24" stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrow)" />
            <line x1="200" y1="220" x2="270" y2="341.24" stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrow)" />
            
            <!-- Points -->
            <circle cx="200" cy="220" r="3" fill="#000000" />
            <circle cx="340" cy="220" r="3" fill="#000000" />
            <circle cx="270" cy="98.76" r="3" fill="#000000" />
            <circle cx="130" cy="98.76" r="3" fill="#000000" />
            <circle cx="60" cy="220" r="3" fill="#000000" />
            <circle cx="130" cy="341.24" r="3" fill="#000000" />
            <circle cx="270" cy="341.24" r="3" fill="#000000" />
            
            <!-- Dynamic Elements -->
            <path id="scene1-angle-arc" d="" fill="#1565c0" fill-opacity="0.2" stroke="#1565c0" stroke-width="1" />
            
            <line id="scene1-vector-op" x1="200" y1="220" x2="340" y2="220" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrow-red)" />
            <circle id="scene1-point-p" cx="340" cy="220" r="4" fill="#c62828" />
            
            <!-- Right Chart Area -->
            <line x1="450" y1="380" x2="750" y2="380" class="scene1-axis" marker-end="url(#scene1-arrow)" />
            <line x1="450" y1="380" x2="450" y2="60" class="scene1-axis" marker-end="url(#scene1-arrow)" />
            
            <!-- Bars -->
            <g id="scene1-bars-group">
                <!-- Will be populated by JS -->
            </g>
            
            <line id="scene1-trend-line" x1="485" y1="380" x2="735" y2="380" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" opacity="0" />
            
        </svg>
        
        <!-- HTML Labels -->
        <div class="scene1-label" style="left: 185px; top: 235px;">O</div>
        <div class="scene1-label" style="left: 355px; top: 220px;">A₁</div>
        <div class="scene1-label" style="left: 285px; top: 83.76px;">A₂</div>
        <div class="scene1-label" style="left: 115px; top: 83.76px;">A₃</div>
        <div class="scene1-label" style="left: 45px; top: 220px;">A₄</div>
        <div class="scene1-label" style="left: 115px; top: 356.24px;">A₅</div>
        <div class="scene1-label" style="left: 285px; top: 356.24px;">A₆</div>
        
        <div id="scene1-angle-label" class="scene1-label" style="color: #1565c0; display: none;">α</div>
        <div id="scene1-label-p" class="scene1-label" style="color: #c62828;">P</div>
        
        <div class="scene1-label" style="left: 430px; top: 380px;">0°</div>
        <div class="scene1-label" style="left: 430px; top: 230px;">90°</div>
        <div class="scene1-label" style="left: 430px; top: 80px;">180°</div>
        <div class="scene1-label" style="left: 450px; top: 40px;">夹角大小</div>
        <div class="scene1-label" style="left: 700px; top: 410px;">从小到大排序</div>
        
        <div id="scene1-html-bars-group">
            <!-- Will be populated by JS -->
        </div>
        
        <div id="scene1-controls">
            <label for="scene1-slider" style="font-size: 14px; color: #333;">点P位置 (α):</label>
            <input type="range" id="scene1-slider" min="0" max="60" step="1" value="0" style="width: 400px;">
            <span id="scene1-slider-val" style="font-size: 14px; color: #333; width: 40px;">0°</span>
        </div>
    </div>
    <script>
    (function() {
        const slider = document.getElementById('scene1-slider');
        const sliderVal = document.getElementById('scene1-slider-val');
        const vectorOP = document.getElementById('scene1-vector-op');
        const pointP = document.getElementById('scene1-point-p');
        const labelP = document.getElementById('scene1-label-p');
        const angleArc = document.getElementById('scene1-angle-arc');
        const angleLabel = document.getElementById('scene1-angle-label');
        const barsGroup = document.getElementById('scene1-bars-group');
        const htmlBarsGroup = document.getElementById('scene1-html-bars-group');
        const trendLine = document.getElementById('scene1-trend-line');
        
        const cx = 200, cy = 220, R = 140;
        const barXs = [470, 520, 570, 620, 670, 720];
        const barWidth = 30;
        const yAxisBottom = 380;
        const yAxisTop = 80;
        const maxAngle = 180;
        
        // Initialize bars
        const bars = [];
        const barTexts = [];
        
        for (let i = 0; i < 6; i++) {
            const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            rect.setAttribute('x', barXs[i]);
            rect.setAttribute('width', barWidth);
            rect.setAttribute('class', 'scene1-bar');
            barsGroup.appendChild(rect);
            bars.push(rect);
            
            const text = document.createElement('div');
            text.className = 'scene1-bar-text';
            text.style.left = (barXs[i] + barWidth / 2) + 'px';
            htmlBarsGroup.appendChild(text);
            barTexts.push(text);
            
            const xLabel = document.createElement('div');
            xLabel.className = 'scene1-label';
            xLabel.style.left = (barXs[i] + barWidth / 2) + 'px';
            xLabel.style.top = '400px';
            xLabel.textContent = i + 1;
            htmlBarsGroup.appendChild(xLabel);
        }
        
        function updateScene() {
            const alpha = parseInt(slider.value, 10);
            sliderVal.textContent = alpha + '°';
            
            // Update P position
            const alphaRad = alpha * Math.PI / 180;
            const px = cx + R * Math.cos(alphaRad);
            const py = cy - R * Math.sin(alphaRad);
            
            vectorOP.setAttribute('x2', px);
            vectorOP.setAttribute('y2', py);
            pointP.setAttribute('cx', px);
            pointP.setAttribute('cy', py);
            
            // Label P position (offset along radius)
            const labelR = R + 25;
            labelP.style.left = (cx + labelR * Math.cos(alphaRad)) + 'px';
            labelP.style.top = (cy - labelR * Math.sin(alphaRad)) + 'px';
            
            // Update angle arc
            if (alpha > 0) {
                const arcR = 30;
                const arcX = cx + arcR * Math.cos(alphaRad);
                const arcY = cy - arcR * Math.sin(alphaRad);
                const d = `M ${cx} ${cy} L ${cx + arcR} ${cy} A ${arcR} ${arcR} 0 0 0 ${arcX} ${arcY} Z`;
                angleArc.setAttribute('d', d);
                angleArc.style.display = 'block';
                
                const labelArcR = 45;
                const midAlphaRad = alphaRad / 2;
                angleLabel.style.left = (cx + labelArcR * Math.cos(midAlphaRad)) + 'px';
                angleLabel.style.top = (cy - labelArcR * Math.sin(midAlphaRad)) + 'px';
                angleLabel.style.display = 'block';
            } else {
                angleArc.style.display = 'none';
                angleLabel.style.display = 'none';
            }
            
            // Calculate angles
            const angles = [];
            for (let i = 0; i < 6; i++) {
                const aiAngle = i * 60;
                let diff = Math.abs(aiAngle - alpha);
                if (diff > 180) diff = 360 - diff;
                angles.push(diff);
            }
            
            angles.sort((a, b) => a - b);
            
            const isArithmetic = (alpha === 15 || alpha === 45);
            
            for (let i = 0; i < 6; i++) {
                const angle = angles[i];
                const height = (angle / maxAngle) * (yAxisBottom - yAxisTop);
                const y = yAxisBottom - height;
                
                bars[i].setAttribute('y', y);
                bars[i].setAttribute('height', height);
                
                barTexts[i].style.top = (y - 5) + 'px';
                barTexts[i].textContent = angle + '°';
                
                // Reset classes
                bars[i].setAttribute('class', 'scene1-bar');
                barTexts[i].className = 'scene1-bar-text';
                
                if (isArithmetic) {
                    bars[i].classList.add('success');
                    if (i === 2) { // 3rd term
                        bars[i].classList.remove('success');
                        bars[i].classList.add('highlight');
                        barTexts[i].classList.add('highlight');
                    }
                }
            }
            
            if (isArithmetic) {
                const y1 = yAxisBottom - (angles[0] / maxAngle) * (yAxisBottom - yAxisTop);
                const y6 = yAxisBottom - (angles[5] / maxAngle) * (yAxisBottom - yAxisTop);
                trendLine.setAttribute('y1', y1);
                trendLine.setAttribute('y2', y6);
                trendLine.style.opacity = 1;
            } else {
                trendLine.style.opacity = 0;
            }
        }
        
        slider.addEventListener('input', updateScene);
        updateScene();
    })();
    </script>
</body>
</html>
