<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:hover { background: #e9e9e9; }
        button:disabled { cursor: not-allowed; opacity: 0.5; }
        
        .scene3-step { opacity: 0; transition: opacity 0.3s ease; }
        .scene3-step.active { opacity: 1; }
        
        .scene3-highlight { transition: all 0.3s ease; }
        .scene3-highlight.active { stroke: #c62828 !important; fill: #ffebee !important; }
        .scene3-highlight-text.active { fill: #c62828 !important; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg width="800" height="500">
            <defs>
                <marker id="scene3-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32" />
                </marker>
                <marker id="scene3-arrow-black" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
                </marker>
            </defs>

            <!-- Step 0: Base Circuit -->
            <g id="scene3-step0">
                <!-- Wires -->
                <line x1="100" y1="100" x2="100" y2="300" stroke="#000000" stroke-width="2" />
                <line x1="300" y1="100" x2="300" y2="300" stroke="#000000" stroke-width="2" />
                
                <!-- Top Branch -->
                <line x1="100" y1="100" x2="180" y2="100" stroke="#000000" stroke-width="2" />
                <line x1="220" y1="100" x2="300" y2="100" stroke="#000000" stroke-width="2" />
                <rect id="scene3-rect-R" class="scene3-highlight" x="180" y="92" width="40" height="16" fill="#ffffff" stroke="#000000" stroke-width="2" />
                <text id="scene3-text-R" class="scene3-highlight-text" x="200" y="75" text-anchor="middle" font-size="16" fill="#000000">R=3Ω</text>

                <!-- Middle Branch -->
                <line x1="100" y1="200" x2="180" y2="200" stroke="#000000" stroke-width="2" />
                <line x1="220" y1="200" x2="300" y2="200" stroke="#000000" stroke-width="2" />
                <rect x="180" y="192" width="40" height="16" fill="#ffffff" stroke="#000000" stroke-width="2" />
                <text x="200" y="175" text-anchor="middle" font-size="16" fill="#000000">R<tspan baseline-shift="sub" font-size="0.7em">a</tspan>=3Ω</text>
                
                <!-- Nodes -->
                <circle cx="100" cy="200" r="4" fill="#000000" />
                <circle cx="300" cy="200" r="4" fill="#000000" />

                <!-- Bottom Branch -->
                <line x1="100" y1="300" x2="135" y2="300" stroke="#000000" stroke-width="2" />
                <line x1="145" y1="300" x2="200" y2="300" stroke="#000000" stroke-width="2" />
                <line x1="240" y1="300" x2="300" y2="300" stroke="#000000" stroke-width="2" />
                
                <!-- Battery Eb -->
                <line x1="135" y1="292" x2="135" y2="308" stroke="#000000" stroke-width="2" />
                <line x1="145" y1="285" x2="145" y2="315" stroke="#000000" stroke-width="2" />
                <text x="140" y="335" text-anchor="middle" font-size="16" fill="#000000">E<tspan baseline-shift="sub" font-size="0.7em">b</tspan></text>

                <!-- Resistor Rb -->
                <rect x="200" y="292" width="40" height="16" fill="#ffffff" stroke="#000000" stroke-width="2" />
                <text x="220" y="275" text-anchor="middle" font-size="16" fill="#000000">R<tspan baseline-shift="sub" font-size="0.7em">b</tspan>=6Ω</text>

                <!-- Current Ib -->
                <line x1="260" y1="300" x2="280" y2="300" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene3-arrow-green)" />
                <text x="270" y="325" text-anchor="middle" font-size="16" fill="#2e7d32">I<tspan baseline-shift="sub" font-size="0.7em">b</tspan></text>
            </g>

            <!-- Step 1: Energy Boxes -->
            <g id="scene3-step1" class="scene3-step">
                <rect x="500" y="80" width="150" height="40" fill="rgba(21,101,192,0.1)" stroke="#1565c0" stroke-width="2" />
                <text x="575" y="105" text-anchor="middle" font-size="16" fill="#1565c0">重力做功 m<tspan baseline-shift="sub" font-size="0.7em">b</tspan>gd</text>
                
                <line x1="575" y1="120" x2="575" y2="155" stroke="#000000" stroke-width="2" marker-end="url(#scene3-arrow-black)" />
                
                <rect x="500" y="160" width="150" height="40" fill="rgba(21,101,192,0.1)" stroke="#1565c0" stroke-width="2" />
                <text x="575" y="185" text-anchor="middle" font-size="16" fill="#1565c0">总热量 Q<tspan baseline-shift="sub" font-size="0.7em">总</tspan> = 0.5J</text>
            </g>

            <!-- Step 2: Branch Currents & Conclusion -->
            <g id="scene3-step2" class="scene3-step">
                <!-- Current Ia -->
                <line x1="160" y1="200" x2="140" y2="200" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene3-arrow-green)" />
                <text x="150" y="185" text-anchor="middle" font-size="16" fill="#2e7d32">I<tspan baseline-shift="sub" font-size="0.7em">a</tspan></text>
                
                <!-- Current IR -->
                <line x1="160" y1="100" x2="140" y2="100" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene3-arrow-green)" />
                <text x="150" y="85" text-anchor="middle" font-size="16" fill="#2e7d32">I<tspan baseline-shift="sub" font-size="0.7em">R</tspan></text>

                <!-- Circuit Conclusion -->
                <text x="200" y="410" text-anchor="middle" font-size="16" fill="#000000">R = R<tspan baseline-shift="sub" font-size="0.7em">a</tspan> = 3Ω ⇒ I<tspan baseline-shift="sub" font-size="0.7em">R</tspan> = I<tspan baseline-shift="sub" font-size="0.7em">a</tspan></text>
            </g>

            <!-- Step 3: Bar Chart & Final Conclusion -->
            <g id="scene3-step3" class="scene3-step">
                <!-- Axes -->
                <line x1="450" y1="370" x2="700" y2="370" stroke="#000000" stroke-width="2" />
                <line x1="450" y1="240" x2="450" y2="370" stroke="#000000" stroke-width="2" />
                
                <!-- X-axis labels -->
                <text x="500" y="410" text-anchor="middle" font-size="14" fill="#000000">b棒</text>
                <text x="570" y="410" text-anchor="middle" font-size="14" fill="#000000">a棒</text>
                <text x="640" y="410" text-anchor="middle" font-size="14" fill="#000000">电阻R</text>

                <!-- Bars -->
                <rect x="480" y="270" width="40" height="100" fill="#90caf9" stroke="#1565c0" stroke-width="1" />
                <text x="500" y="260" text-anchor="middle" font-size="14" fill="#000000">80%</text>

                <rect x="550" y="357.5" width="40" height="12.5" fill="#90caf9" stroke="#1565c0" stroke-width="1" />
                <text x="570" y="347.5" text-anchor="middle" font-size="14" fill="#000000">10%</text>

                <rect x="620" y="357.5" width="40" height="12.5" fill="#ef9a9a" stroke="#c62828" stroke-width="1" />
                <text x="640" y="347.5" text-anchor="middle" font-size="14" fill="#000000">10%</text>

                <!-- Final Conclusion -->
                <text x="575" y="445" text-anchor="middle" font-size="16" fill="#000000">Q<tspan baseline-shift="sub" font-size="0.7em">R</tspan> = 10% Q<tspan baseline-shift="sub" font-size="0.7em">总</tspan> = 0.05J</text>
            </g>
        </svg>

        <div id="scene3-controls">
            <button id="scene3-btn-prev" disabled>◀ 上一步</button>
            <button id="scene3-btn-next">下一步 ▶</button>
            <button id="scene3-btn-reset">重置</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 3;

        const btnPrev = document.getElementById('scene3-btn-prev');
        const btnNext = document.getElementById('scene3-btn-next');
        const btnReset = document.getElementById('scene3-btn-reset');

        const step1 = document.getElementById('scene3-step1');
        const step2 = document.getElementById('scene3-step2');
        const step3 = document.getElementById('scene3-step3');
        
        const rectR = document.getElementById('scene3-rect-R');
        const textR = document.getElementById('scene3-text-R');

        function updateScene() {
            // Step 1
            if (currentStep >= 1) {
                step1.classList.add('active');
            } else {
                step1.classList.remove('active');
            }

            // Step 2
            if (currentStep >= 2) {
                step2.classList.add('active');
            } else {
                step2.classList.remove('active');
            }

            // Step 3
            if (currentStep >= 3) {
                step3.classList.add('active');
                rectR.classList.add('active');
                textR.classList.add('active');
            } else {
                step3.classList.remove('active');
                rectR.classList.remove('active');
                textR.classList.remove('active');
            }

            // Buttons
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });

        btnReset.addEventListener('click', () => {
            currentStep = 0;
            updateScene();
        });

        // Initialize
        updateScene();
    })();
    </script>
</body>
</html>
