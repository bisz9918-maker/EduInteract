<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-step-text { font-size: 14px; user-select: none; min-width: 80px; text-align: center; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500">
            <defs>
                <marker id="scene1-arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32" />
                </marker>
                <marker id="scene1-arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828" />
                </marker>
                <marker id="scene1-arrow-gray-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 10 0 L 0 5 L 10 10 z" fill="#888" />
                </marker>
                <marker id="scene1-arrow-gray-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#888" />
                </marker>
                <pattern id="scene1-hatch" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
                    <line x1="0" y1="0" x2="0" y2="10" stroke="#000" stroke-width="1" />
                </pattern>
            </defs>

            <!-- Ground -->
            <line x1="50" y1="350" x2="750" y2="350" stroke="#000" stroke-width="2" />
            <rect x="50" y="350" width="700" height="10" fill="url(#scene1-hatch)" />

            <!-- Displacement d -->
            <g id="scene1-displacement" opacity="0">
                <line id="scene1-d-line1" x1="380" y1="250" x2="380" y2="190" stroke="#888" stroke-dasharray="4 4"/>
                <line id="scene1-d-line2" x1="510" y1="250" x2="510" y2="190" stroke="#888" stroke-dasharray="4 4"/>
                <line id="scene1-d-arrow" x1="380" y1="200" x2="510" y2="200" stroke="#888" stroke-width="2" marker-start="url(#scene1-arrow-gray-start)" marker-end="url(#scene1-arrow-gray-end)"/>
                <text id="scene1-d-text" x="445" y="190" fill="#888" font-size="16" text-anchor="middle">d</text>
            </g>

            <!-- Spring -->
            <path id="scene1-spring" fill="none" stroke="#000" stroke-width="2" />

            <!-- Cart M -->
            <g id="scene1-cart" transform="translate(150, 0)">
                <rect x="0" y="200" width="20" height="100" fill="rgba(224,224,224,0.3)" stroke="#000" stroke-width="2" />
                <rect x="0" y="300" width="300" height="20" fill="rgba(224,224,224,0.3)" stroke="#000" stroke-width="2" />
                <circle cx="50" cy="335" r="15" fill="#fff" stroke="#000" stroke-width="2"/>
                <circle cx="250" cy="335" r="15" fill="#fff" stroke="#000" stroke-width="2"/>
                <text x="-15" y="250" font-size="18" font-family="sans-serif">M</text>
                
                <g id="scene1-v1-cart">
                    <line x1="125" y1="170" x2="175" y2="170" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene1-arrow-green)"/>
                    <text x="150" y="160" fill="#2e7d32" font-size="16" text-anchor="middle">v<tspan dy="5" font-size="12">1</tspan></text>
                </g>
                <g id="scene1-v3-cart" opacity="0">
                    <line x1="125" y1="170" x2="165" y2="170" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene1-arrow-green)"/>
                    <text x="145" y="160" fill="#2e7d32" font-size="16" text-anchor="middle">v<tspan dy="5" font-size="12">3</tspan></text>
                </g>
            </g>

            <!-- Block m -->
            <g id="scene1-block" transform="translate(380, 0)">
                <rect x="0" y="250" width="50" height="50" fill="rgba(21,101,192,0.3)" stroke="#1565c0" stroke-width="2" />
                <text x="25" y="240" font-size="18" text-anchor="middle">m</text>
                
                <rect id="scene1-bullet-embedded" x="15" y="270" width="20" height="10" fill="#c62828" opacity="0" />
                
                <g id="scene1-v1-block">
                    <line x1="5" y1="170" x2="45" y2="170" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene1-arrow-green)"/>
                    <text x="25" y="160" fill="#2e7d32" font-size="16" text-anchor="middle">v<tspan dy="5" font-size="12">1</tspan></text>
                </g>
                <g id="scene1-v2-block" opacity="0">
                    <line x1="5" y1="170" x2="35" y2="170" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene1-arrow-green)"/>
                    <text x="20" y="160" fill="#2e7d32" font-size="16" text-anchor="middle">v<tspan dy="5" font-size="12">2</tspan></text>
                </g>
                <g id="scene1-v3-block" opacity="0">
                    <line x1="5" y1="170" x2="40" y2="170" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene1-arrow-green)"/>
                    <text x="22" y="160" fill="#2e7d32" font-size="16" text-anchor="middle">v<tspan dy="5" font-size="12">3</tspan></text>
                </g>
                <g id="scene1-f-block" opacity="0" transform="translate(0, 40)">
                    <line x1="25" y1="315" x2="65" y2="315" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrow-red)"/>
                    <text x="45" y="335" fill="#c62828" font-size="16" text-anchor="middle">f</text>
                </g>
            </g>

            <!-- Friction f' on cart (positioned dynamically) -->
            <g id="scene1-f-cart" transform="translate(380, 40)" opacity="0">
                <line x1="25" y1="315" x2="-15" y2="315" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrow-red)"/>
                <text x="5" y="335" fill="#c62828" font-size="16" text-anchor="middle">f'</text>
            </g>

            <!-- Bullet m0 -->
            <g id="scene1-bullet" transform="translate(600, 0)">
                <rect x="0" y="270" width="20" height="10" fill="#c62828" />
                <text x="10" y="295" font-size="16" text-anchor="middle">m<tspan dy="5" font-size="12">0</tspan></text>
                <g id="scene1-v0-bullet">
                    <line x1="10" y1="240" x2="-40" y2="240" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene1-arrow-green)"/>
                    <text x="-15" y="230" fill="#2e7d32" font-size="16" text-anchor="middle">v<tspan dy="5" font-size="12">0</tspan></text>
                </g>
            </g>

        </svg>
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <div id="scene1-step-text">步骤 0 / 3</div>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    <script>
    (function() {
        const cart = document.getElementById('scene1-cart');
        const block = document.getElementById('scene1-block');
        const bullet = document.getElementById('scene1-bullet');
        const fCart = document.getElementById('scene1-f-cart');
        const spring = document.getElementById('scene1-spring');
        
        const bulletEmbedded = document.getElementById('scene1-bullet-embedded');
        const v1Cart = document.getElementById('scene1-v1-cart');
        const v3Cart = document.getElementById('scene1-v3-cart');
        const v1Block = document.getElementById('scene1-v1-block');
        const v2Block = document.getElementById('scene1-v2-block');
        const v3Block = document.getElementById('scene1-v3-block');
        const fBlock = document.getElementById('scene1-f-block');
        const v0Bullet = document.getElementById('scene1-v0-bullet');
        const displacement = document.getElementById('scene1-displacement');
        
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepText = document.getElementById('scene1-step-text');

        let currentStep = 0;
        const totalSteps = 3;
        let animationFrame;
        let startTime;
        let startState = {};
        let endState = {};
        const duration = 800;

        const states = [
            { // Step 0
                cartX: 150, blockX: 380, bulletX: 600,
                bulletOp: 1, bulletEmbOp: 0,
                v1CartOp: 1, v3CartOp: 0,
                v1BlockOp: 1, v2BlockOp: 0, v3BlockOp: 0,
                fBlockOp: 0, fCartOp: 0, v0BulletOp: 1, dispOp: 0
            },
            { // Step 1
                cartX: 150, blockX: 380, bulletX: 380,
                bulletOp: 0, bulletEmbOp: 1,
                v1CartOp: 1, v3CartOp: 0,
                v1BlockOp: 0, v2BlockOp: 1, v3BlockOp: 0,
                fBlockOp: 0, fCartOp: 0, v0BulletOp: 0, dispOp: 0
            },
            { // Step 2
                cartX: 250, blockX: 450, bulletX: 450,
                bulletOp: 0, bulletEmbOp: 1,
                v1CartOp: 1, v3CartOp: 0,
                v1BlockOp: 0, v2BlockOp: 1, v3BlockOp: 0,
                fBlockOp: 1, fCartOp: 1, v0BulletOp: 0, dispOp: 0
            },
            { // Step 3
                cartX: 350, blockX: 510, bulletX: 510,
                bulletOp: 0, bulletEmbOp: 1,
                v1CartOp: 0, v3CartOp: 1,
                v1BlockOp: 0, v2BlockOp: 0, v3BlockOp: 1,
                fBlockOp: 0, fCartOp: 0, v0BulletOp: 0, dispOp: 1
            }
        ];

        function drawSpring(x1, x2, y) {
            const coils = 10;
            const width = x2 - x1;
            const coilWidth = width / coils;
            const amplitude = 10;
            let d = `M ${x1} ${y} `;
            for (let i = 0; i < coils; i++) {
                const cx = x1 + i * coilWidth + coilWidth / 2;
                const sign = i % 2 === 0 ? 1 : -1;
                d += `L ${cx} ${y + sign * amplitude} `;
            }
            d += `L ${x2} ${y}`;
            spring.setAttribute('d', d);
        }

        function setOpacity(el, val) {
            el.style.opacity = val;
            el.style.display = val === 0 ? 'none' : '';
        }

        function renderState(state) {
            cart.setAttribute('transform', `translate(${state.cartX}, 0)`);
            block.setAttribute('transform', `translate(${state.blockX}, 0)`);
            bullet.setAttribute('transform', `translate(${state.bulletX}, 0)`);
            fCart.setAttribute('transform', `translate(${state.blockX}, 0)`);
            
            drawSpring(state.cartX + 20, state.blockX, 275);
            
            setOpacity(bullet, state.bulletOp);
            setOpacity(bulletEmbedded, state.bulletEmbOp);
            setOpacity(v1Cart, state.v1CartOp);
            setOpacity(v3Cart, state.v3CartOp);
            setOpacity(v1Block, state.v1BlockOp);
            setOpacity(v2Block, state.v2BlockOp);
            setOpacity(v3Block, state.v3BlockOp);
            setOpacity(fBlock, state.fBlockOp);
            setOpacity(fCart, state.fCartOp);
            setOpacity(v0Bullet, state.v0BulletOp);
            setOpacity(displacement, state.dispOp);
        }

        function interpolate(start, end, progress) {
            return start + (end - start) * progress;
        }

        function animate(timestamp) {
            if (!startTime) startTime = timestamp;
            const elapsed = timestamp - startTime;
            let progress = elapsed / duration;
            if (progress > 1) progress = 1;
            
            // Easing function (ease-in-out)
            const ease = progress < 0.5 ? 2 * progress * progress : -1 + (4 - 2 * progress) * progress;

            const currentState = {
                cartX: interpolate(startState.cartX, endState.cartX, ease),
                blockX: interpolate(startState.blockX, endState.blockX, ease),
                bulletX: interpolate(startState.bulletX, endState.bulletX, ease),
                bulletOp: endState.bulletOp,
                bulletEmbOp: endState.bulletEmbOp,
                v1CartOp: endState.v1CartOp,
                v3CartOp: endState.v3CartOp,
                v1BlockOp: endState.v1BlockOp,
                v2BlockOp: endState.v2BlockOp,
                v3BlockOp: endState.v3BlockOp,
                fBlockOp: endState.fBlockOp,
                fCartOp: endState.fCartOp,
                v0BulletOp: endState.v0BulletOp,
                dispOp: endState.dispOp
            };

            renderState(currentState);

            if (progress < 1) {
                animationFrame = requestAnimationFrame(animate);
            }
        }

        function goToStep(step) {
            if (step < 0 || step > totalSteps) return;
            
            startState = states[currentStep];
            endState = states[step];
            currentStep = step;
            
            stepText.textContent = `步骤 ${currentStep} / ${totalSteps}`;
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps;

            if (animationFrame) cancelAnimationFrame(animationFrame);
            startTime = null;
            animationFrame = requestAnimationFrame(animate);
        }

        btnPrev.addEventListener('click', () => goToStep(currentStep - 1));
        btnNext.addEventListener('click', () => goToStep(currentStep + 1));

        // Initial render
        renderState(states[0]);
    })();
    </script>
</body>
</html>
