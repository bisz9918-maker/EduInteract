<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; }
        .scene1-text-area { position: absolute; top: 30px; left: 30px; width: 320px; font-size: 18px; line-height: 1.5; }
        .scene1-element { transition: opacity 0.3s, transform 0.5s; }
        .scene1-hidden { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <div class="scene1-text-area" id="scene1-text"></div>
        <svg width="800" height="500" id="scene1-svg">
            <defs>
                <marker id="scene1-arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#888888" />
                </marker>
                <marker id="scene1-arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32" />
                </marker>
                <marker id="scene1-arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0" />
                </marker>
                <marker id="scene1-arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828" />
                </marker>
                <marker id="scene1-arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8f00" />
                </marker>
            </defs>
            
            <!-- Electric Field -->
            <g id="scene1-efield">
                <line x1="100" y1="100" x2="700" y2="100" stroke="#888888" stroke-width="2" marker-end="url(#scene1-arrow-gray)" />
                <line x1="100" y1="160" x2="700" y2="160" stroke="#888888" stroke-width="2" marker-end="url(#scene1-arrow-gray)" />
                <line x1="100" y1="220" x2="700" y2="220" stroke="#888888" stroke-width="2" marker-end="url(#scene1-arrow-gray)" />
                <line x1="100" y1="280" x2="700" y2="280" stroke="#888888" stroke-width="2" marker-end="url(#scene1-arrow-gray)" />
                <line x1="100" y1="340" x2="700" y2="340" stroke="#888888" stroke-width="2" marker-end="url(#scene1-arrow-gray)" />
                <text x="710" y="105" font-size="16" fill="#888888">E</text>
            </g>

            <!-- Incline -->
            <polygon points="200,380 600,380 600,80" fill="rgba(0,0,0,0.1)" stroke="#000000" stroke-width="2" />
            <text x="240" y="360" font-size="16">37°</text>

            <!-- L Bracket -->
            <g id="scene1-l-bracket">
                <line x1="296" y1="258" x2="456" y2="138" stroke="#000000" stroke-width="1" />
                <line x1="320" y1="290" x2="296" y2="258" stroke="#000000" stroke-width="1" stroke-dasharray="4,4" />
                <line x1="480" y1="170" x2="456" y2="138" stroke="#000000" stroke-width="1" stroke-dasharray="4,4" />
                <text x="360" y="190" font-size="16">L</text>
            </g>

            <!-- Ball B -->
            <circle cx="320" cy="290" r="15" fill="rgba(0,0,0,0.1)" stroke="#000000" stroke-width="2" />
            <text x="320" y="265" font-size="16" text-anchor="middle" id="scene1-b-label">B</text>

            <!-- Ball A -->
            <circle cx="480" cy="170" r="15" fill="rgba(0,0,0,0.1)" stroke="#000000" stroke-width="2" />
            <text x="480" y="145" font-size="16" text-anchor="middle" id="scene1-a-label">A</text>

            <!-- Step 1: A forces (mg, F_E) -->
            <g id="scene1-step1-forces" class="scene1-element scene1-hidden">
                <line x1="480" y1="170" x2="480" y2="230" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene1-arrow-green)" />
                <text x="490" y="235" font-size="14" fill="#2e7d32">mg</text>
                
                <line x1="480" y1="170" x2="451" y2="192" stroke="#2e7d32" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#scene1-arrow-green)" />
                <text x="410" y="215" font-size="14" fill="#2e7d32">mg sin 37°</text>

                <line x1="480" y1="170" x2="400" y2="170" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-blue)" />
                <text x="380" y="165" font-size="14" fill="#1565c0">F_E</text>

                <line x1="480" y1="170" x2="429" y2="208" stroke="#1565c0" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#scene1-arrow-blue)" />
                <text x="390" y="235" font-size="14" fill="#1565c0">qE cos 37°</text>
            </g>

            <!-- Step 2: A force (F_c) -->
            <g id="scene1-step2-forces" class="scene1-element scene1-hidden">
                <line x1="480" y1="170" x2="560" y2="110" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrow-red)" />
                <text x="565" y="105" font-size="14" fill="#c62828">F_c</text>
            </g>

            <!-- Step 3 & 4: B forces -->
            <g id="scene1-step3-forces" class="scene1-element scene1-hidden">
                <g id="scene1-b-mg-sin" class="scene1-element">
                    <line x1="316" y1="285" x2="288" y2="307" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene1-arrow-green)" />
                    <text x="250" y="300" font-size="14" fill="#2e7d32">mg sin 37°</text>
                </g>
                <g id="scene1-b-qe-cos" class="scene1-element">
                    <line x1="320" y1="290" x2="269" y2="328" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-blue)" />
                    <text x="220" y="330" font-size="14" fill="#1565c0">qE cos 37°</text>
                </g>
                <g id="scene1-b-fc" class="scene1-element">
                    <line x1="324" y1="295" x2="244" y2="355" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrow-red)" />
                    <text x="210" y="370" font-size="14" fill="#c62828">F_c'</text>
                </g>
            </g>

            <!-- Step 4: B net force -->
            <g id="scene1-step4-forces" class="scene1-element scene1-hidden">
                <line x1="326" y1="298" x2="166" y2="418" stroke="#ff8f00" stroke-width="4" marker-end="url(#scene1-arrow-orange)" />
                <text x="140" y="445" font-size="16" fill="#ff8f00" font-weight="bold">F_合</text>
            </g>

        </svg>
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 4;
        
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const textArea = document.getElementById('scene1-text');
        
        const step1Forces = document.getElementById('scene1-step1-forces');
        const step2Forces = document.getElementById('scene1-step2-forces');
        const step3Forces = document.getElementById('scene1-step3-forces');
        const step4Forces = document.getElementById('scene1-step4-forces');
        
        const bMgSin = document.getElementById('scene1-b-mg-sin');
        const bQeCos = document.getElementById('scene1-b-qe-cos');
        const bFc = document.getElementById('scene1-b-fc');
        
        const aLabel = document.getElementById('scene1-a-label');
        const bLabel = document.getElementById('scene1-b-label');

        const texts = [
            "初始状态：A球静止，B球固定",
            "A球受重力与电场力，均有沿斜面向下的分力",
            "A球静止，必受B球沿斜面向上的库仑斥力<br>结论：B球带负电<br>平衡方程：\( F_c = mg \sin 37^\circ + qE \cos 37^\circ \)",
            "释放B球瞬间，B球受三个沿斜面向下的力<br>(重力分力、电场力分力、A对B的库仑斥力)",
            "B球合力：\( F_合 = mg \sin 37^\circ + qE \cos 37^\circ + F_c' \)<br>由于 \( F_c' = F_c \)<br>所以 \( F_合 = 2F_c \)<br>加速度 \( a = rac{2kq^2}{mL^2} \)"
        ];

        function updateMathJax() {
            if (window.MathJax) {
                MathJax.typesetPromise([textArea]).catch(function (err) {
                    console.log(err.message);
                });
            }
        }

        function show(el) {
            el.classList.remove('scene1-hidden');
        }

        function hide(el) {
            el.classList.add('scene1-hidden');
        }

        function updateScene() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
            
            textArea.innerHTML = texts[currentStep];
            updateMathJax();

            // Reset all
            hide(step1Forces);
            hide(step2Forces);
            hide(step3Forces);
            hide(step4Forces);
            
            aLabel.textContent = "A";
            bLabel.textContent = "B";
            
            // Reset transforms
            bMgSin.style.transform = "translate(0px, 0px)";
            bQeCos.style.transform = "translate(0px, 0px)";
            bFc.style.transform = "translate(0px, 0px)";

            if (currentStep >= 1) {
                show(step1Forces);
            }
            if (currentStep >= 2) {
                show(step2Forces);
                aLabel.textContent = "A(-q)";
                bLabel.textContent = "B(-q)";
            }
            if (currentStep >= 3) {
                show(step3Forces);
                if (currentStep === 3) {
                    // Dim A forces
                    step1Forces.style.opacity = "0.3";
                    step2Forces.style.opacity = "0.3";
                }
            } else {
                step1Forces.style.opacity = "1";
                step2Forces.style.opacity = "1";
            }
            
            if (currentStep === 4) {
                step1Forces.style.opacity = "0.1";
                step2Forces.style.opacity = "0.1";
                show(step3Forces);
                
                // Animate vectors to head-to-tail
                // bMgSin: (316,285)->(288,307) (length 36)
                // bQeCos: (320,290)->(269,328) (length 64)
                // bFc: (324,295)->(244,355) (length 100)
                
                // Target for bQeCos: start at end of bMgSin (288,307)
                // Original start: (320,290)
                // Translate: dx = 288 - 320 = -32, dy = 307 - 290 = 17
                bQeCos.style.transform = "translate(-32px, 17px)";
                
                // Target for bFc: start at end of translated bQeCos
                // Translated bQeCos end: (269-32, 328+17) = (237, 345)
                // Original start: (324,295)
                // Translate: dx = 237 - 324 = -87, dy = 345 - 295 = 50
                bFc.style.transform = "translate(-87px, 50px)";
                
                setTimeout(() => {
                    if (currentStep === 4) {
                        show(step4Forces);
                    }
                }, 600);
            }
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });

        // Initialize
        updateScene();
    })();
    </script>
</body>
</html>
