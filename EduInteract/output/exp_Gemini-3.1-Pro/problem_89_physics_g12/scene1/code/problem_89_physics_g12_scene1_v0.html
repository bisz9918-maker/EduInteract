<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f8f9fa; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button:hover:not(:disabled) { background: #e2e6ea; }
        
        /* SVG Styles */
        .axis { stroke: #000000; stroke-width: 1.5; }
        .dashed-line { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 5,5; }
        .e1-line { stroke: #1565c0; stroke-width: 1.5; }
        .e2-line { stroke: #2e7d32; stroke-width: 1.5; }
        .particle { fill: #c62828; }
        .trajectory { stroke: #c62828; stroke-width: 2; fill: none; }
        .vector { stroke: #c62828; stroke-width: 2; }
        .aux-line { stroke: #888888; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; }
        .dim-line { stroke: #000000; stroke-width: 1; }
        
        text { font-size: 14px; font-family: sans-serif; }
        .text-black { fill: #000000; }
        .text-e1 { fill: #1565c0; }
        .text-e2 { fill: #2e7d32; }
        .text-red { fill: #c62828; }
        
        /* Animation classes */
        .hidden { display: none; opacity: 0; }
        .fade-in { opacity: 1; transition: opacity 0.3s; }
        .highlight-e1 { stroke-width: 2.5; opacity: 1; }
        .highlight-e2 { stroke-width: 2.5; opacity: 1; }
        .dimmed { opacity: 0.3; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <defs>
                <marker id="arrow-black" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
                </marker>
                <marker id="arrow-e1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0" />
                </marker>
                <marker id="arrow-e2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32" />
                </marker>
                <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828" />
                </marker>
                <marker id="arrow-dim-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
                </marker>
                <marker id="arrow-dim-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
                </marker>
            </defs>

            <!-- E1 Electric Field -->
            <g id="scene1-e1-group">
                <line class="e1-line" x1="100" y1="90" x2="290" y2="90" marker-end="url(#arrow-e1)" />
                <line class="e1-line" x1="100" y1="130" x2="290" y2="130" marker-end="url(#arrow-e1)" />
                <line class="e1-line" x1="100" y1="170" x2="290" y2="170" marker-end="url(#arrow-e1)" />
                <line class="e1-line" x1="100" y1="210" x2="290" y2="210" marker-end="url(#arrow-e1)" />
                <line class="e1-line" x1="100" y1="250" x2="290" y2="250" marker-end="url(#arrow-e1)" />
                <line class="e1-line" x1="100" y1="290" x2="290" y2="290" marker-end="url(#arrow-e1)" />
                <line class="e1-line" x1="100" y1="330" x2="290" y2="330" marker-end="url(#arrow-e1)" />
                <text class="text-e1" x="200" y="70" text-anchor="middle">E₁</text>
            </g>

            <!-- E2 Electric Field -->
            <g id="scene1-e2-group">
                <line class="e2-line" x1="330" y1="50" x2="330" y2="340" marker-end="url(#arrow-e2)" />
                <line class="e2-line" x1="380" y1="50" x2="380" y2="340" marker-end="url(#arrow-e2)" />
                <line class="e2-line" x1="430" y1="50" x2="430" y2="340" marker-end="url(#arrow-e2)" />
                <line class="e2-line" x1="480" y1="50" x2="480" y2="340" marker-end="url(#arrow-e2)" />
                <line class="e2-line" x1="530" y1="50" x2="530" y2="340" marker-end="url(#arrow-e2)" />
                <line class="e2-line" x1="580" y1="50" x2="580" y2="340" marker-end="url(#arrow-e2)" />
                <line class="e2-line" x1="630" y1="50" x2="630" y2="340" marker-end="url(#arrow-e2)" />
                <line class="e2-line" x1="680" y1="50" x2="680" y2="340" marker-end="url(#arrow-e2)" />
                <line class="e2-line" x1="730" y1="50" x2="730" y2="340" marker-end="url(#arrow-e2)" />
                <text class="text-e2" x="405" y="70" text-anchor="middle">E₂</text>
            </g>

            <!-- Axes and Boundaries -->
            <line class="axis" x1="100" y1="350" x2="750" y2="350" marker-end="url(#arrow-black)" />
            <text class="text-black" x="740" y="370">x</text>
            
            <line class="axis" x1="100" y1="350" x2="100" y2="50" marker-end="url(#arrow-black)" />
            <text class="text-black" x="80" y="60">y</text>
            
            <text class="text-black" x="85" y="365">O</text>

            <line class="dashed-line" x1="300" y1="50" x2="300" y2="350" />
            <text class="text-black" x="300" y="40" text-anchor="middle">a</text>
            <text class="text-black" x="300" y="365" text-anchor="middle">b</text>

            <!-- Dimensions -->
            <g id="scene1-dim-h">
                <line class="dim-line" x1="70" y1="150" x2="70" y2="350" marker-start="url(#arrow-dim-start)" marker-end="url(#arrow-dim-end)" />
                <line class="dim-line" x1="65" y1="150" x2="100" y2="150" stroke-dasharray="2,2" />
                <text class="text-black" x="55" y="255" text-anchor="end" dominant-baseline="middle">h</text>
            </g>

            <g id="scene1-dim-L">
                <line class="dim-line" x1="100" y1="390" x2="300" y2="390" marker-start="url(#arrow-dim-start)" marker-end="url(#arrow-dim-end)" />
                <line class="dim-line" x1="100" y1="350" x2="100" y2="395" stroke-dasharray="2,2" />
                <line class="dim-line" x1="300" y1="350" x2="300" y2="395" stroke-dasharray="2,2" />
                <text class="text-black" x="200" y="410" text-anchor="middle">L</text>
            </g>

            <g id="scene1-dim-dx" class="hidden">
                <line class="dim-line" x1="300" y1="390" x2="600" y2="390" marker-start="url(#arrow-dim-start)" marker-end="url(#arrow-dim-end)" />
                <line class="dim-line" x1="600" y1="350" x2="600" y2="395" stroke-dasharray="2,2" />
                <text class="text-black" x="450" y="410" text-anchor="middle">Δx</text>
            </g>

            <!-- Trajectories -->
            <line id="scene1-traj1" class="trajectory hidden" x1="100" y1="150" x2="300" y2="150" />
            <path id="scene1-traj2" class="trajectory hidden" d="M 300 150 Q 450 150 600 350" />

            <!-- Vectors -->
            <g id="scene1-vec-v1" class="hidden">
                <line class="vector" x1="300" y1="150" x2="345" y2="150" marker-end="url(#arrow-red)" />
                <text class="text-red" x="320" y="140" text-anchor="middle">v₁</text>
            </g>

            <g id="scene1-vec-vq" class="hidden">
                <line class="vector" x1="600" y1="350" x2="645" y2="410" marker-end="url(#arrow-red)" />
                <text class="text-red" x="655" y="420">v_Q</text>
                
                <line class="vector" x1="600" y1="350" x2="645" y2="350" marker-end="url(#arrow-red)" />
                <text class="text-red" x="625" y="340" text-anchor="middle">v_x</text>
                
                <line class="vector" x1="600" y1="350" x2="600" y2="410" marker-end="url(#arrow-red)" />
                <text class="text-red" x="575" y="385" text-anchor="end">v_y</text>
                
                <polyline class="aux-line" points="645,350 645,410 600,410" />
            </g>

            <!-- Points -->
            <circle id="scene1-point-p" class="particle" cx="100" cy="150" r="4" />
            <text class="text-black" x="80" y="155" text-anchor="end">P</text>
            
            <g id="scene1-point-q-group" class="hidden">
                <circle class="particle" cx="600" cy="350" r="4" />
                <text class="text-black" x="585" y="365" text-anchor="end">Q</text>
            </g>

            <!-- Moving Particle -->
            <circle id="scene1-particle" class="particle" cx="100" cy="150" r="5" />
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        
        const e1Group = document.getElementById('scene1-e1-group');
        const e2Group = document.getElementById('scene1-e2-group');
        
        const traj1 = document.getElementById('scene1-traj1');
        const traj2 = document.getElementById('scene1-traj2');
        const vecV1 = document.getElementById('scene1-vec-v1');
        const vecVq = document.getElementById('scene1-vec-vq');
        const dimDx = document.getElementById('scene1-dim-dx');
        const pointQGroup = document.getElementById('scene1-point-q-group');
        const particle = document.getElementById('scene1-particle');
        
        let currentStep = 0;
        const maxStep = 3;
        let animationFrameId = null;

        function show(el) {
            el.classList.remove('hidden');
            el.style.display = '';
            el.style.opacity = '1';
        }

        function hide(el) {
            el.classList.add('hidden');
            el.style.display = 'none';
            el.style.opacity = '0';
        }

        function updateState(step, animate = true) {
            // Cancel any ongoing animation
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }

            // Reset all dynamic elements
            hide(traj1);
            hide(traj2);
            hide(vecV1);
            hide(vecVq);
            hide(dimDx);
            hide(pointQGroup);
            
            e1Group.classList.remove('dimmed');
            e2Group.classList.remove('dimmed');
            e1Group.classList.remove('highlight-e1');
            e2Group.classList.remove('highlight-e2');

            if (step === 0) {
                particle.setAttribute('cx', 100);
                particle.setAttribute('cy', 150);
            } 
            else if (step === 1) {
                e1Group.classList.add('highlight-e1');
                e2Group.classList.add('dimmed');
                show(traj1);
                
                if (animate) {
                    let start = null;
                    const duration = 1000;
                    function anim1(timestamp) {
                        if (!start) start = timestamp;
                        const progress = Math.min((timestamp - start) / duration, 1);
                        const x = 100 + 200 * progress;
                        particle.setAttribute('cx', x);
                        particle.setAttribute('cy', 150);
                        
                        // Animate trajectory line
                        traj1.setAttribute('x2', x);
                        
                        if (progress < 1) {
                            animationFrameId = requestAnimationFrame(anim1);
                        } else {
                            show(vecV1);
                        }
                    }
                    animationFrameId = requestAnimationFrame(anim1);
                } else {
                    particle.setAttribute('cx', 300);
                    particle.setAttribute('cy', 150);
                    traj1.setAttribute('x2', 300);
                    show(vecV1);
                }
            }
            else if (step === 2) {
                e1Group.classList.add('dimmed');
                e2Group.classList.add('highlight-e2');
                show(traj1);
                traj1.setAttribute('x2', 300);
                show(vecV1);
                show(traj2);
                
                if (animate) {
                    let start = null;
                    const duration = 1000;
                    function anim2(timestamp) {
                        if (!start) start = timestamp;
                        const progress = Math.min((timestamp - start) / duration, 1);
                        
                        // Parabolic motion: x = v0*t, y = 1/2*a*t^2
                        // Map progress 0->1 to x: 300->600, y: 150->350
                        const x = 300 + 300 * progress;
                        const y = 150 + 200 * progress * progress;
                        
                        particle.setAttribute('cx', x);
                        particle.setAttribute('cy', y);
                        
                        // Animate trajectory path
                        // We need to draw a partial parabola.
                        // A quadratic bezier from (300,150) to (x,y) with control point (cx, cy)
                        // For a parabola y = k*x^2, the control point x_c is halfway between x0 and x1, and y_c is on the tangent.
                        // Actually, for a parabola starting with horizontal velocity, the control point is at (x, 150).
                        const pathD = `M 300 150 Q ${x} 150 ${x} ${y}`;
                        traj2.setAttribute('d', pathD);
                        
                        if (progress < 1) {
                            animationFrameId = requestAnimationFrame(anim2);
                        } else {
                            show(pointQGroup);
                        }
                    }
                    animationFrameId = requestAnimationFrame(anim2);
                } else {
                    particle.setAttribute('cx', 600);
                    particle.setAttribute('cy', 350);
                    traj2.setAttribute('d', "M 300 150 Q 450 150 600 350");
                    show(pointQGroup);
                }
            }
            else if (step === 3) {
                show(traj1);
                traj1.setAttribute('x2', 300);
                show(vecV1);
                show(traj2);
                traj2.setAttribute('d', "M 300 150 Q 450 150 600 350");
                show(pointQGroup);
                particle.setAttribute('cx', 600);
                particle.setAttribute('cy', 350);
                
                show(vecVq);
                show(dimDx);
            }

            btnPrev.disabled = (step === 0);
            btnNext.disabled = (step === maxStep);
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateState(currentStep, false); // No animation when going back
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateState(currentStep, true);
            }
        });

        // Initialize
        updateState(0, false);
    })();
    </script>
</body>
</html>
