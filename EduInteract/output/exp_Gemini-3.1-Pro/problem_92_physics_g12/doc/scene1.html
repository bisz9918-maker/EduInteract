<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene1-element { transition: opacity 0.5s, visibility 0.5s; visibility: visible; }
        .scene1-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <defs>
                <marker id="scene1-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0" />
                </marker>
                <marker id="scene1-arrow-black" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
                </marker>
                <pattern id="scene1-hatch" patternUnits="userSpaceOnUse" width="10" height="10">
                    <path d="M-1,1 l2,-2 M0,10 l10,-10 M9,11 l2,-2" stroke="#000000" stroke-width="1" />
                </pattern>
            </defs>

            <!-- Step 0: Initial State -->
            <g id="scene1-step0">
                <!-- Center line RO -->
                <line x1="30" y1="130" x2="750" y2="130" stroke="#000000" stroke-width="1" stroke-dasharray="5,5" />
                <text x="20" y="135" font-size="14" fill="#000000">R</text>
                <text x="485" y="115" font-size="14" fill="#000000">O</text>
                
                <!-- Plates A, B -->
                <line x1="50" y1="70" x2="170" y2="70" stroke="#000000" stroke-width="4" />
                <text x="35" y="75" font-size="14" fill="#000000">A</text>
                <line x1="50" y1="190" x2="170" y2="190" stroke="#000000" stroke-width="4" />
                <text x="35" y="195" font-size="14" fill="#000000">B</text>

                <!-- Interfaces MN, PS -->
                <line x1="170" y1="30" x2="170" y2="380" stroke="#000000" stroke-width="1" stroke-dasharray="5,5" />
                <text x="170" y="25" font-size="14" fill="#000000" text-anchor="middle">M</text>
                <text x="170" y="400" font-size="14" fill="#000000" text-anchor="middle">N</text>
                
                <line x1="350" y1="30" x2="350" y2="380" stroke="#000000" stroke-width="1" stroke-dasharray="5,5" />
                <text x="350" y="25" font-size="14" fill="#000000" text-anchor="middle">P</text>
                <text x="350" y="400" font-size="14" fill="#000000" text-anchor="middle">S</text>

                <!-- Point charge O -->
                <circle cx="485" cy="130" r="4" fill="#000000" />

                <!-- Screen EF -->
                <line x1="650" y1="130" x2="750" y2="130" stroke="#000000" stroke-width="4" />
                <rect x="650" y="130" width="100" height="10" fill="url(#scene1-hatch)" />
                <text x="650" y="115" font-size="14" fill="#000000" text-anchor="middle">E</text>
                <text x="750" y="115" font-size="14" fill="#000000" text-anchor="middle">F</text>

                <!-- Particle start R -->
                <circle cx="50" cy="130" r="4" fill="#c62828" id="scene1-particle" />
            </g>

            <!-- Step 1: Deflection -->
            <g id="scene1-step1" class="scene1-element scene1-hidden">
                <path d="M 50 130 Q 110 130 170 175" fill="none" stroke="#c62828" stroke-width="2" />
                <circle cx="170" cy="175" r="4" fill="#c62828" />
                <text x="150" y="165" font-size="14" fill="#000000">M'</text>
                
                <!-- Velocity v0 -->
                <line x1="50" y1="130" x2="90" y2="130" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-blue)" />
                <text x="70" y="120" font-size="14" fill="#1565c0">v₀</text>

                <!-- Velocity v(M') -->
                <line x1="170" y1="175" x2="210" y2="205" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-blue)" />
                <text x="215" y="220" font-size="14" fill="#1565c0">v</text>
                
                <!-- Deflection y1 -->
                <line x1="170" y1="130" x2="170" y2="175" stroke="#888888" stroke-width="1" />
                <text x="175" y="157" font-size="14" fill="#000000">y₁</text>
            </g>

            <!-- Step 2: Linear motion -->
            <g id="scene1-step2" class="scene1-element scene1-hidden">
                <line x1="170" y1="175" x2="350" y2="310" stroke="#c62828" stroke-width="2" />
                <circle cx="350" cy="310" r="4" fill="#c62828" />
                <text x="360" y="330" font-size="14" fill="#000000">C</text>

                <!-- Deflection y2 -->
                <line x1="350" y1="175" x2="350" y2="310" stroke="#888888" stroke-width="1" />
                <text x="365" y="247" font-size="14" fill="#000000">y₂</text>

                <!-- Total deflection y -->
                <line x1="350" y1="130" x2="350" y2="310" stroke="#888888" stroke-width="1" />
                <text x="325" y="225" font-size="14" fill="#000000">y</text>
                
                <!-- Horizontal line for y2 -->
                <line x1="170" y1="175" x2="350" y2="175" stroke="#888888" stroke-width="1" stroke-dasharray="3,3" />
            </g>

            <!-- Step 3: Arc motion -->
            <g id="scene1-step3" class="scene1-element scene1-hidden">
                <path d="M 350 310 A 225 225 0 0 0 710 130" fill="none" stroke="#c62828" stroke-width="2" />
                <circle cx="710" cy="130" r="4" fill="#c62828" />
                <text x="720" y="120" font-size="14" fill="#000000">D</text>

                <!-- Velocity v(C) -->
                <line x1="350" y1="310" x2="390" y2="340" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-blue)" />
                <text x="395" y="355" font-size="14" fill="#1565c0">v</text>

                <!-- Radius OC -->
                <line x1="350" y1="310" x2="485" y2="130" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" />
                <text x="435" y="230" font-size="14" fill="#000000">r</text>
                
                <!-- Radius OD -->
                <line x1="710" y1="130" x2="485" y2="130" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" />
                
                <!-- Perpendicular symbol at C -->
                <path d="M 350 310 L 358 316 L 364 308 L 356 302 Z" fill="none" stroke="#000000" stroke-width="1" />
            </g>

            <!-- Step 4: Geometry analysis -->
            <g id="scene1-step4" class="scene1-element scene1-hidden">
                <!-- Highlight triangle OCC' -->
                <polygon points="485,130 350,130 350,310" fill="#2e7d32" opacity="0.2" />
                
                <!-- Angle theta at O -->
                <path d="M 455 130 A 30 30 0 0 0 461 162" fill="none" stroke="#000000" stroke-width="1" />
                <text x="440" y="155" font-size="14" fill="#000000">θ</text>
                
                <!-- Formula -->
                <foreignObject x="420" y="280" width="150" height="50">
                    <div xmlns="http://www.w3.org/1999/xhtml" style="color: #2e7d32; font-size: 16px;">
                        $$ r = rac{y}{\cos	heta} $$
                    </div>
                </foreignObject>
            </g>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 4;
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');

        function updateStep() {
            for (let i = 1; i <= maxStep; i++) {
                const el = document.getElementById('scene1-step' + i);
                if (i <= currentStep) {
                    el.classList.remove('scene1-hidden');
                } else {
                    el.classList.add('scene1-hidden');
                }
            }
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateStep();
            }
        });
        
        // MathJax rendering
        if (window.MathJax) {
            MathJax.typesetPromise();
        }
    })();
    </script>
</body>
</html>
