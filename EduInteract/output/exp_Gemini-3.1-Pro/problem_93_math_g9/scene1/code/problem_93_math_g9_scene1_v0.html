<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene1-element { transition: opacity 0.3s ease, stroke 0.3s ease, stroke-width 0.3s ease; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- 交互高亮图形 -->
            <!-- 扇形 ∠ACD -->
            <path id="scene1-arc-acd" class="scene1-element" d="M 420 380 A 30 30 0 0 1 435 354 L 450 380 Z" fill="#1565c0" opacity="0" />
            <!-- 扇形 ∠CBE -->
            <path id="scene1-arc-cbe" class="scene1-element" d="M 620 380 A 30 30 0 0 1 635 354 L 650 380 Z" fill="#1565c0" opacity="0" />
            <!-- 扇形 ∠DAC -->
            <path id="scene1-arc-dac" class="scene1-element" d="M 180 380 A 30 30 0 0 0 165 354 L 150 380 Z" fill="#c62828" opacity="0" />
            <!-- 扇形 ∠ECB -->
            <path id="scene1-arc-ecb" class="scene1-element" d="M 480 380 A 30 30 0 0 0 465 354 L 450 380 Z" fill="#c62828" opacity="0" />
            
            <!-- 多边形 △ACG -->
            <polygon id="scene1-poly-acg" class="scene1-element" points="150,380 450,380 420,328" fill="#1565c0" opacity="0" />
            <!-- 多边形 △ABF -->
            <polygon id="scene1-poly-abf" class="scene1-element" points="150,380 650,380 600,294" fill="#1565c0" opacity="0" />
            <!-- 多边形 △ADG -->
            <polygon id="scene1-poly-adg" class="scene1-element" points="150,380 300,120 420,328" fill="#c62828" opacity="0" />
            <!-- 多边形 △CHG -->
            <polygon id="scene1-poly-chg" class="scene1-element" points="450,380 488,315 420,328" fill="#c62828" opacity="0" />

            <!-- 基础图形 -->
            <line id="scene1-line-ab" x1="150" y1="380" x2="650" y2="380" stroke="#000000" stroke-width="1.5" />
            <line id="scene1-line-ad" class="scene1-element" x1="150" y1="380" x2="300" y2="120" stroke="#000000" stroke-width="1.5" />
            <line id="scene1-line-dc" class="scene1-element" x1="300" y1="120" x2="450" y2="380" stroke="#000000" stroke-width="1.5" />
            <line id="scene1-line-ce" class="scene1-element" x1="450" y1="380" x2="550" y2="207" stroke="#000000" stroke-width="1.5" />
            <line id="scene1-line-eb" class="scene1-element" x1="550" y1="207" x2="650" y2="380" stroke="#000000" stroke-width="1.5" />
            <line id="scene1-line-de" x1="300" y1="120" x2="550" y2="207" stroke="#000000" stroke-width="1.5" />
            <line id="scene1-line-af" x1="150" y1="380" x2="600" y2="294" stroke="#000000" stroke-width="1.5" />

            <!-- 点 -->
            <circle cx="150" cy="380" r="3" fill="#000000" />
            <circle cx="650" cy="380" r="3" fill="#000000" />
            <circle cx="450" cy="380" r="3" fill="#000000" />
            <circle cx="300" cy="120" r="3" fill="#000000" />
            <circle cx="550" cy="207" r="3" fill="#000000" />
            <circle cx="425" cy="164" r="3" fill="#000000" />
            <circle cx="600" cy="294" r="3" fill="#000000" />
            <circle cx="420" cy="328" r="3" fill="#000000" />
            <circle cx="488" cy="315" r="3" fill="#000000" />

            <!-- 标签 -->
            <text x="135" y="400" font-size="16" fill="#000000">A</text>
            <text x="655" y="400" font-size="16" fill="#000000">B</text>
            <text x="445" y="405" font-size="16" fill="#000000">C</text>
            <text x="295" y="110" font-size="16" fill="#000000">D</text>
            <text x="560" y="200" font-size="16" fill="#000000">E</text>
            <text x="420" y="140" font-size="16" fill="#000000">P</text>
            <text x="615" y="315" font-size="16" fill="#000000">F</text>
            <text x="380" y="315" font-size="16" fill="#000000">G</text>
            <text x="500" y="300" font-size="16" fill="#000000">H</text>
        </svg>
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 4;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');

        const arcAcd = document.getElementById('scene1-arc-acd');
        const arcCbe = document.getElementById('scene1-arc-cbe');
        const arcDac = document.getElementById('scene1-arc-dac');
        const arcEcb = document.getElementById('scene1-arc-ecb');

        const polyAcg = document.getElementById('scene1-poly-acg');
        const polyAbf = document.getElementById('scene1-poly-abf');
        const polyAdg = document.getElementById('scene1-poly-adg');
        const polyChg = document.getElementById('scene1-poly-chg');

        const lineDc = document.getElementById('scene1-line-dc');
        const lineEb = document.getElementById('scene1-line-eb');
        const lineAd = document.getElementById('scene1-line-ad');
        const lineCe = document.getElementById('scene1-line-ce');

        function updateState() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;

            // Reset all
            arcAcd.style.opacity = '0';
            arcCbe.style.opacity = '0';
            arcDac.style.opacity = '0';
            arcEcb.style.opacity = '0';
            
            polyAcg.style.opacity = '0';
            polyAbf.style.opacity = '0';
            polyAdg.style.opacity = '0';
            polyChg.style.opacity = '0';

            lineDc.setAttribute('stroke', '#000000');
            lineDc.setAttribute('stroke-width', '1.5');
            lineEb.setAttribute('stroke', '#000000');
            lineEb.setAttribute('stroke-width', '1.5');
            lineAd.setAttribute('stroke', '#000000');
            lineAd.setAttribute('stroke-width', '1.5');
            lineCe.setAttribute('stroke', '#000000');
            lineCe.setAttribute('stroke-width', '1.5');

            if (currentStep === 1) {
                arcAcd.style.opacity = '0.3';
                arcCbe.style.opacity = '0.3';
                lineDc.setAttribute('stroke', '#1565c0');
                lineDc.setAttribute('stroke-width', '3');
                lineEb.setAttribute('stroke', '#1565c0');
                lineEb.setAttribute('stroke-width', '3');
            } else if (currentStep === 2) {
                lineDc.setAttribute('stroke', '#1565c0');
                lineDc.setAttribute('stroke-width', '3');
                lineEb.setAttribute('stroke', '#1565c0');
                lineEb.setAttribute('stroke-width', '3');
                polyAcg.style.opacity = '0.2';
                polyAbf.style.opacity = '0.2';
            } else if (currentStep === 3) {
                arcDac.style.opacity = '0.3';
                arcEcb.style.opacity = '0.3';
                lineAd.setAttribute('stroke', '#c62828');
                lineAd.setAttribute('stroke-width', '3');
                lineCe.setAttribute('stroke', '#c62828');
                lineCe.setAttribute('stroke-width', '3');
            } else if (currentStep === 4) {
                lineAd.setAttribute('stroke', '#c62828');
                lineAd.setAttribute('stroke-width', '3');
                lineCe.setAttribute('stroke', '#c62828');
                lineCe.setAttribute('stroke-width', '3');
                polyAdg.style.opacity = '0.2';
                polyChg.style.opacity = '0.2';
            }
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateState();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateState();
            }
        });

        updateState();
    })();
    </script>
</body>
</html>
