<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisualSolver Scene 3</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-3d { position: absolute; left: 0; top: 0; width: 400px; height: 450px; }
        #scene3-svg-container { position: absolute; left: 0; top: 0; width: 800px; height: 500px; pointer-events: none; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; pointer-events: auto; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <!-- Three.js -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div id="scene3-container">
        <div id="scene3-3d"></div>
        
        <svg id="scene3-svg-container" width="800" height="500">
            <defs>
                <pattern id="scene3-hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
                    <line x1="0" y1="0" x2="0" y2="6" stroke="#666" stroke-width="1"/>
                </pattern>
            </defs>
            
            <!-- Option A -->
            <g id="scene3-optA" transform="translate(500, 120)">
                <polygon points="0,0 39,-22.5 0,-45 -39,-22.5" fill="#fff" stroke="#000" stroke-width="1.5"/>
                <ellipse cx="0" cy="-22.5" rx="15" ry="8.66" fill="none" stroke="#000" stroke-width="1.5"/>
                <polygon points="0,0 -39,-22.5 -39,22.5 0,45" fill="#fff" stroke="#000" stroke-width="1.5"/>
                <polygon points="-39,-22.5 -39,22.5 0,45" fill="url(#scene3-hatch)" stroke="none"/>
                <line x1="-39" y1="-22.5" x2="0" y2="45" stroke="#000" stroke-width="1.5"/>
                <polygon points="0,0 0,45 39,22.5 39,-22.5" fill="#fff" stroke="#000" stroke-width="1.5"/>
                <polygon points="39,-22.5 39,22.5 0,0" fill="url(#scene3-hatch)" stroke="none"/>
                <line x1="39" y1="-22.5" x2="0" y2="0" stroke="#000" stroke-width="1.5"/>
            </g>
            <text x="500" y="190" text-anchor="middle" font-size="16" fill="#333">选项A</text>
            <g id="scene3-markA" transform="translate(500, 120)" opacity="0">
                <path d="M-15,-15 L15,15 M15,-15 L-15,15" stroke="#c62828" stroke-width="6" stroke-linecap="round"/>
            </g>

            <!-- Option B -->
            <g id="scene3-optB" transform="translate(700, 120)">
                <polygon points="0,0 39,-22.5 0,-45 -39,-22.5" fill="#fff" stroke="#000" stroke-width="1.5"/>
                <polygon points="0,0 -39,-22.5 -39,22.5 0,45" fill="#fff" stroke="#000" stroke-width="1.5"/>
                <polygon points="-39,-22.5 -39,22.5 0,45" fill="url(#scene3-hatch)" stroke="none"/>
                <line x1="-39" y1="-22.5" x2="0" y2="45" stroke="#000" stroke-width="1.5"/>
                <polygon points="0,0 0,45 39,22.5 39,-22.5" fill="#fff" stroke="#000" stroke-width="1.5"/>
                <polygon points="39,-22.5 39,22.5 0,0" fill="url(#scene3-hatch)" stroke="none"/>
                <line x1="39" y1="-22.5" x2="0" y2="0" stroke="#000" stroke-width="1.5"/>
            </g>
            <text x="700" y="190" text-anchor="middle" font-size="16" fill="#333">选项B</text>
            <g id="scene3-markB" transform="translate(700, 120)" opacity="0">
                <path d="M-15,-15 L15,15 M15,-15 L-15,15" stroke="#c62828" stroke-width="6" stroke-linecap="round"/>
            </g>

            <!-- Option C -->
            <g id="scene3-optC" transform="translate(500, 320)">
                <polygon points="0,0 39,-22.5 0,-45 -39,-22.5" fill="#fff" stroke="#000" stroke-width="1.5"/>
                <polygon points="0,0 -39,-22.5 -39,22.5 0,45" fill="#fff" stroke="#000" stroke-width="1.5"/>
                <ellipse cx="-19.5" cy="11.25" rx="12" ry="16" transform="rotate(-30 -19.5 11.25)" fill="none" stroke="#000" stroke-width="1.5"/>
                <polygon points="0,0 0,45 39,22.5 39,-22.5" fill="#fff" stroke="#000" stroke-width="1.5"/>
                <polygon points="0,0 0,45 39,22.5" fill="url(#scene3-hatch)" stroke="none"/>
                <line x1="0" y1="0" x2="39" y2="22.5" stroke="#000" stroke-width="1.5"/>
            </g>
            <text x="500" y="390" text-anchor="middle" font-size="16" fill="#333">选项C</text>
            <g id="scene3-markC" transform="translate(500, 320)" opacity="0">
                <path d="M-15,-15 L15,15 M15,-15 L-15,15" stroke="#c62828" stroke-width="6" stroke-linecap="round"/>
            </g>

            <!-- Option D -->
            <g id="scene3-optD" transform="translate(700, 320)">
                <polygon points="0,0 39,-22.5 0,-45 -39,-22.5" fill="#fff" stroke="#000" stroke-width="1.5"/>
                <polygon points="0,0 39,-22.5 0,-45" fill="url(#scene3-hatch)" stroke="none"/>
                <line x1="0" y1="0" x2="0" y2="-45" stroke="#000" stroke-width="1.5"/>
                <polygon points="0,0 -39,-22.5 -39,22.5 0,45" fill="#fff" stroke="#000" stroke-width="1.5"/>
                <polygon points="-39,-22.5 -39,22.5 0,45" fill="url(#scene3-hatch)" stroke="none"/>
                <line x1="-39" y1="-22.5" x2="0" y2="45" stroke="#000" stroke-width="1.5"/>
                <polygon points="0,0 0,45 39,22.5 39,-22.5" fill="#fff" stroke="#000" stroke-width="1.5"/>
                <ellipse cx="19.5" cy="11.25" rx="12" ry="16" transform="rotate(30 19.5 11.25)" fill="none" stroke="#000" stroke-width="1.5"/>
            </g>
            <text x="700" y="390" text-anchor="middle" font-size="16" fill="#333">选项D</text>
            <g id="scene3-markD" transform="translate(700, 320)" opacity="0">
                <path d="M-15,0 L-5,10 L15,-15" stroke="#2e7d32" stroke-width="6" stroke-linecap="round" fill="none"/>
            </g>
        </svg>

        <div id="scene3-controls">
            <button id="scene3-prev-btn" disabled>◀ 上一步</button>
            <button id="scene3-next-btn">下一步 ▶</button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';

        let currentState = 0;
        const totalStates = 3;
        let cube;

        function createTexture(type) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, 256, 256);

            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 4;
            ctx.strokeRect(0, 0, 256, 256);

            if (type === 'circle') {
                ctx.beginPath();
                ctx.arc(128, 128, 60, 0, Math.PI * 2);
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 4;
                ctx.stroke();
            } else if (type === 'left') {
                // 左下到右上，右下阴影
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(0, 256);
                ctx.lineTo(256, 0);
                ctx.lineTo(256, 256);
                ctx.closePath();
                ctx.clip();
                ctx.strokeStyle = '#666666';
                ctx.lineWidth = 3;
                for (let i = -256; i < 512; i += 16) {
                    ctx.beginPath();
                    ctx.moveTo(i, 0);
                    ctx.lineTo(i + 256, 256);
                    ctx.stroke();
                }
                ctx.restore();

                ctx.beginPath();
                ctx.moveTo(0, 256);
                ctx.lineTo(256, 0);
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 6;
                ctx.stroke();
            } else if (type === 'back') {
                // 左上到右下，左下阴影
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(256, 256);
                ctx.lineTo(0, 256);
                ctx.closePath();
                ctx.clip();
                ctx.strokeStyle = '#666666';
                ctx.lineWidth = 3;
                for (let i = -256; i < 512; i += 16) {
                    ctx.beginPath();
                    ctx.moveTo(i, 256);
                    ctx.lineTo(i + 256, 0);
                    ctx.stroke();
                }
                ctx.restore();

                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(256, 256);
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 6;
                ctx.stroke();
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.anisotropy = 16;
            return new THREE.MeshBasicMaterial({ map: texture });
        }

        function init3D() {
            const container = document.getElementById('scene3-3d');
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0xffffff);

            const camera = new THREE.PerspectiveCamera(45, 400 / 450, 1, 1000);
            camera.position.set(150, 150, 250);
            camera.lookAt(0, 0, 0);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(400, 450);
            container.appendChild(renderer.domElement);

            const materials = [
                createTexture('blank'), // 0: Right
                createTexture('left'),  // 1: Left
                createTexture('circle'),// 2: Top
                createTexture('blank'), // 3: Bottom
                createTexture('blank'), // 4: Front
                createTexture('back')   // 5: Back
            ];

            const geometry = new THREE.BoxGeometry(100, 100, 100);
            cube = new THREE.Mesh(geometry, materials);
            scene.add(cube);

            // Add edges
            const edges = new THREE.EdgesGeometry(geometry);
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 2 }));
            cube.add(line);

            function animate() {
                requestAnimationFrame(animate);
                renderer.render(scene, camera);
            }
            animate();
        }

        function renderState() {
            document.getElementById('scene3-prev-btn').disabled = (currentState === 0);
            document.getElementById('scene3-next-btn').disabled = (currentState === totalStates);

            if (currentState === 0) {
                gsap.to(cube.rotation, {x: 0, y: 0, z: 0, duration: 1.5, ease: "power2.inOut"});
                gsap.to('#scene3-markA', {opacity: 0, duration: 0.5});
                gsap.to('#scene3-markB', {opacity: 0, duration: 0.5});
                gsap.to('#scene3-markC', {opacity: 0, duration: 0.5});
                gsap.to('#scene3-markD', {opacity: 0, duration: 0.5});
            } else if (currentState === 1) {
                gsap.to(cube.rotation, {x: 0, y: Math.PI, z: 0, duration: 1.5, ease: "power2.inOut"});
                gsap.to('#scene3-markA', {opacity: 1, duration: 0.5, delay: 1.0});
                gsap.to('#scene3-markB', {opacity: 1, duration: 0.5, delay: 1.0});
                gsap.to('#scene3-markC', {opacity: 0, duration: 0.5});
                gsap.to('#scene3-markD', {opacity: 0, duration: 0.5});
            } else if (currentState === 2) {
                // Corrected Euler angles to match "正面为圆圈、右面为阴影"
                gsap.to(cube.rotation, {x: -Math.PI/2, y: 0, z: -Math.PI/2, duration: 1.5, ease: "power2.inOut"});
                gsap.to('#scene3-markA', {opacity: 1, duration: 0.5});
                gsap.to('#scene3-markB', {opacity: 1, duration: 0.5});
                gsap.to('#scene3-markC', {opacity: 1, duration: 0.5, delay: 1.0});
                gsap.to('#scene3-markD', {opacity: 0, duration: 0.5});
            } else if (currentState === 3) {
                gsap.to(cube.rotation, {x: -Math.PI/2, y: Math.PI/2, z: 0, duration: 1.5, ease: "power2.inOut"});
                gsap.to('#scene3-markA', {opacity: 1, duration: 0.5});
                gsap.to('#scene3-markB', {opacity: 1, duration: 0.5});
                gsap.to('#scene3-markC', {opacity: 1, duration: 0.5});
                gsap.to('#scene3-markD', {opacity: 1, duration: 0.5, delay: 1.0});
            }
        }

        document.getElementById('scene3-prev-btn').addEventListener('click', () => {
            if (currentState > 0) {
                currentState--;
                renderState();
            }
        });

        document.getElementById('scene3-next-btn').addEventListener('click', () => {
            if (currentState < totalStates) {
                currentState++;
                renderState();
            }
        });

        init3D();
        renderState();
    </script>
</body>
</html>
