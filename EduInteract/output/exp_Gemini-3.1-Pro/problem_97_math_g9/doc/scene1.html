<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\(', '\)']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .step-text { opacity: 0; transition: opacity 0.5s; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <!-- Quadrant highlights -->
            <rect id="scene1-q2" x="50" y="50" width="250" height="200" fill="#2e7d32" opacity="0"></rect>
            <rect id="scene1-q3" x="50" y="250" width="250" height="200" fill="#2e7d32" opacity="0"></rect>
            <rect id="scene1-q4" x="300" y="250" width="250" height="200" fill="#2e7d32" opacity="0"></rect>
            <rect id="scene1-q1" x="300" y="50" width="250" height="200" fill="#888888" opacity="0"></rect>
            
            <foreignObject id="scene1-q1-label" x="375" y="135" width="100" height="30" opacity="0">
                <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 20px; text-align: center; color: #000;">第一象限</div>
            </foreignObject>

            <!-- Axes -->
            <g id="scene1-axes">
                <line x1="50" y1="250" x2="550" y2="250" stroke="#000" stroke-width="2" marker-end="url(#scene1-arrow)"></line>
                <line x1="300" y1="450" x2="300" y2="50" stroke="#000" stroke-width="2" marker-end="url(#scene1-arrow)"></line>
                <foreignObject x="275" y="255" width="20" height="20">
                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 16px; font-style: italic; line-height: 1;">O</div>
                </foreignObject>
                <foreignObject x="535" y="225" width="20" height="20">
                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 16px; font-style: italic; line-height: 1;">x</div>
                </foreignObject>
                <foreignObject x="275" y="50" width="20" height="20">
                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 16px; font-style: italic; line-height: 1;">y</div>
                </foreignObject>
            </g>

            <!-- Parabola -->
            <path id="scene1-parabola" fill="none" stroke="#1565c0" stroke-width="2"></path>
            <foreignObject x="100" y="350" width="120" height="40" id="scene1-parabola-label">
                <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 14px;">$y=ax^2+bx+1$</div>
            </foreignObject>

            <!-- y-axis intersection 1 -->
            <circle cx="300" cy="200" r="3" fill="#000"></circle>
            <foreignObject x="310" y="185" width="20" height="20">
                <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 14px; line-height: 1;">1</div>
            </foreignObject>

            <!-- Axis of symmetry -->
            <line id="scene1-sym-axis" x1="225" y1="50" x2="225" y2="450" stroke="#888" stroke-width="2" stroke-dasharray="5,5" opacity="0"></line>
            <circle id="scene1-sym-intersect" cx="225" cy="250" r="4" fill="#888" opacity="0"></circle>
            <foreignObject id="scene1-sym-label" x="235" y="80" width="80" height="40" opacity="0">
                <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 14px;">$x=-rac{b}{2a}$</div>
            </foreignObject>

            <!-- Intercept point (0,b) -->
            <circle id="scene1-intercept" cx="300" cy="250" r="4" fill="#c62828" opacity="0"></circle>
            <foreignObject id="scene1-intercept-label" x="310" y="360" width="60" height="30" opacity="0">
                <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 14px; color: #c62828;">$(0, b)$</div>
            </foreignObject>

            <!-- Linear function line -->
            <line id="scene1-line" x1="50" y1="183.33" x2="50" y2="183.33" stroke="#c62828" stroke-width="2" opacity="0"></line>
            <foreignObject id="scene1-line-label" x="80" y="140" width="80" height="30" opacity="0">
                <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 14px; color: #c62828;">$y=ax+b$</div>
            </foreignObject>

            <!-- Right Panel -->
            <foreignObject x="580" y="80" width="200" height="370">
                <div xmlns="http://www.w3.org/1999/xhtml" id="scene1-text-panel" style="font-size: 14px; line-height: 1.5;">
                    <div id="scene1-step1-text" class="step-text">1. 抛物线开口向下<br/>$\Rightarrow a &lt; 0$</div>
                    <div id="scene1-step2-text" class="step-text">2. 对称轴在y轴左侧<br/>$\Rightarrow x = -rac{b}{2a} &lt; 0$<br/>$\Rightarrow b &lt; 0$</div>
                    <div id="scene1-step3-text" class="step-text">3. 一次函数截距 $b &lt; 0$<br/>$\Rightarrow$ 交于y轴负半轴</div>
                    <div id="scene1-step4-text" class="step-text">4. 一次函数斜率 $a &lt; 0$<br/>$\Rightarrow$ 直线从左上到右下</div>
                    <div id="scene1-step5-text" class="step-text">5. 图象不经过第一象限</div>
                </div>
            </foreignObject>

            <defs>
                <marker id="scene1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#000" />
                </marker>
            </defs>
        </svg>
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    <script>
    (function() {
        // Generate parabola path
        const path = d3.select("#scene1-parabola");
        const points = [];
        for (let x = 50; x <= 550; x += 5) {
            const mx = (x - 300) / 50;
            const my = - (2/3) * mx * mx - 2 * mx + 1;
            const y = 250 - my * 50;
            if (y >= 0 && y <= 500) {
                points.push([x, y]);
            }
        }
        const lineGen = d3.line().curve(d3.curveBasis);
        path.attr("d", lineGen(points));

        let currentStep = 0;
        const maxStep = 5;

        const btnPrev = document.getElementById("scene1-btn-prev");
        const btnNext = document.getElementById("scene1-btn-next");

        function updateScene() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;

            // Step 1: Parabola highlight
            d3.select("#scene1-parabola")
                .transition().duration(500)
                .attr("stroke-width", currentStep >= 1 ? 4 : 2)
                .attr("stroke", currentStep >= 1 ? "#1976d2" : "#1565c0");
            d3.select("#scene1-step1-text").style("opacity", currentStep >= 1 ? 1 : 0);

            // Step 2: Axis of symmetry
            d3.select("#scene1-sym-axis").transition().duration(500).style("opacity", currentStep >= 2 ? 1 : 0);
            d3.select("#scene1-sym-intersect").transition().duration(500).style("opacity", currentStep >= 2 ? 1 : 0);
            d3.select("#scene1-sym-label").transition().duration(500).style("opacity", currentStep >= 2 ? 1 : 0);
            d3.select("#scene1-step2-text").style("opacity", currentStep >= 2 ? 1 : 0);

            // Step 3: Intercept point
            if (currentStep >= 3) {
                d3.select("#scene1-intercept")
                    .style("opacity", 1)
                    .transition().duration(800)
                    .attr("cy", 350);
                d3.select("#scene1-intercept-label").transition().delay(800).duration(500).style("opacity", 1);
            } else {
                d3.select("#scene1-intercept")
                    .transition().duration(500)
                    .attr("cy", 250)
                    .style("opacity", 0);
                d3.select("#scene1-intercept-label").transition().duration(500).style("opacity", 0);
            }
            d3.select("#scene1-step3-text").style("opacity", currentStep >= 3 ? 1 : 0);

            // Step 4: Line
            if (currentStep >= 4) {
                d3.select("#scene1-line")
                    .style("opacity", 1)
                    .transition().duration(800)
                    .attr("x2", 500)
                    .attr("y2", 483.33);
                d3.select("#scene1-line-label").transition().delay(800).duration(500).style("opacity", 1);
            } else {
                d3.select("#scene1-line")
                    .transition().duration(500)
                    .attr("x2", 50)
                    .attr("y2", 183.33)
                    .style("opacity", 0);
                d3.select("#scene1-line-label").transition().duration(500).style("opacity", 0);
            }
            d3.select("#scene1-step4-text").style("opacity", currentStep >= 4 ? 1 : 0);

            // Step 5: Quadrants
            const qOpacity = currentStep >= 5 ? 0.15 : 0;
            d3.select("#scene1-q2").transition().duration(500).style("opacity", qOpacity);
            d3.select("#scene1-q3").transition().delay(200).duration(500).style("opacity", qOpacity);
            d3.select("#scene1-q4").transition().delay(400).duration(500).style("opacity", qOpacity);
            
            if (currentStep >= 5) {
                d3.select("#scene1-q1").transition().delay(800).duration(500).style("opacity", 0.1);
                d3.select("#scene1-q1-label").transition().delay(800).duration(500).style("opacity", 1);
            } else {
                d3.select("#scene1-q1").transition().duration(500).style("opacity", 0);
                d3.select("#scene1-q1-label").transition().duration(500).style("opacity", 0);
            }
            d3.select("#scene1-step5-text").style("opacity", currentStep >= 5 ? 1 : 0);
        }

        btnPrev.addEventListener("click", () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        btnNext.addEventListener("click", () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });

        // Initialize
        updateScene();
    })();
    </script>
</body>
</html>
