<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* SVG Styles */
        .line-default { stroke: #000000; stroke-width: 2; fill: none; }
        .point-default { fill: #000000; }
        .text-default { fill: #000000; font-size: 16px; user-select: none; }
        .text-math { font-family: 'Times New Roman', Times, serif; font-style: italic; }
        
        /* Transitions */
        .anim-element { transition: all 0.5s ease; }
        
        /* Highlights */
        .hl-blue-fill { fill: #1565c0; opacity: 0; }
        .hl-blue-fill.show { opacity: 0.2; }
        
        .hl-yellow-fill { fill: #f9a825; opacity: 0; }
        .hl-yellow-fill.show { opacity: 0.2; }
        
        .hl-blue-stroke { stroke: #1565c0; opacity: 0; }
        .hl-blue-stroke.show { opacity: 1; }
        
        .hl-red-stroke { stroke: #c62828; opacity: 0; }
        .hl-red-stroke.show { opacity: 1; }
        
        .hl-green-stroke { stroke: #2e7d32; opacity: 0; }
        .hl-green-stroke.show { opacity: 1; }
        
        .hl-text-blue { fill: #1565c0; opacity: 0; }
        .hl-text-blue.show { opacity: 1; }
        
        .hl-text-red { fill: #c62828; opacity: 0; }
        .hl-text-red.show { opacity: 1; }
        
        .hl-text-red-bold { fill: #c62828; font-weight: bold; opacity: 0; }
        .hl-text-red-bold.show { opacity: 1; }
        
        /* Specific elements */
        #scene1-arc-ab { stroke-width: 4; fill: none; stroke: #c62828; opacity: 0; transition: opacity 0.5s ease; }
        #scene1-arc-ab.show { opacity: 1; }
        
        #scene1-line-ad-hl { stroke-width: 4; fill: none; stroke: #2e7d32; opacity: 0; transition: opacity 0.5s ease; }
        #scene1-line-ad-hl.show { opacity: 1; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- Polygons for highlight -->
            <polygon id="scene1-poly-abc" points="279,290 400,360 521,290" class="anim-element hl-blue-fill" />
            <polygon id="scene1-poly-abd" points="279,290 400,360 521,150" class="anim-element hl-yellow-fill" />
            
            <!-- Circle -->
            <circle cx="400" cy="220" r="140" class="line-default" />
            
            <!-- Highlight Arcs and Lines (under default lines) -->
            <!-- Arc AB: from A(279,290) to B(400,360) -->
            <path id="scene1-arc-ab" d="M 279 290 A 140 140 0 0 0 400 360" />
            <line id="scene1-line-ad-hl" x1="279" y1="290" x2="521" y2="150" />
            
            <!-- Lines -->
            <line x1="279" y1="290" x2="400" y2="360" class="line-default" /> <!-- AB -->
            <line x1="400" y1="360" x2="521" y2="290" class="line-default" /> <!-- BC -->
            <line x1="521" y1="290" x2="279" y2="290" class="line-default" /> <!-- CA -->
            <line x1="279" y1="290" x2="521" y2="150" class="line-default" /> <!-- AD -->
            <line x1="400" y1="360" x2="521" y2="150" class="line-default" /> <!-- BD -->
            <line x1="521" y1="290" x2="521" y2="150" class="line-default" /> <!-- CD -->
            
            <!-- Tick marks for AB and BC -->
            <line x1="334.5" y1="333.66" x2="344.5" y2="316.34" class="line-default" />
            <line x1="455.5" y1="316.34" x2="465.5" y2="333.66" class="line-default" />
            
            <!-- Angles -->
            <!-- ∠ABC 120° -->
            <path d="M 382.68 350 A 20 20 0 0 1 417.32 350" class="line-default" />
            
            <!-- ∠ACB 30° -->
            <path id="scene1-arc-acb" d="M 496 290 A 25 25 0 0 0 499.35 302.5" class="anim-element hl-blue-stroke line-default" />
            
            <!-- ∠ADB 30° -->
            <path id="scene1-arc-adb" d="M 499.35 162.5 A 25 25 0 0 0 508.5 171.65" class="anim-element hl-red-stroke line-default" />
            
            <!-- ∠ABD Right Angle -->
            <polyline id="scene1-angle-abd" points="387,352.5 394.5,339.5 407.5,347" class="anim-element hl-green-stroke line-default" />
            
            <!-- Points -->
            <circle cx="400" cy="220" r="3" class="point-default" /> <!-- O -->
            <circle cx="279" cy="290" r="3" class="point-default" /> <!-- A -->
            <circle cx="400" cy="360" r="3" class="point-default" /> <!-- B -->
            <circle cx="521" cy="290" r="3" class="point-default" /> <!-- C -->
            <circle cx="521" cy="150" r="3" class="point-default" /> <!-- D -->
            
            <!-- Labels -->
            <!-- Adjusted positions to avoid overlap with shapes -->
            <text x="400" y="335" class="text-default" text-anchor="middle">120°</text>
            <text id="scene1-text-acb-blue" x="575" y="325" class="anim-element hl-text-blue text-default" text-anchor="end">30°</text>
            <text id="scene1-text-acb-red" x="575" y="325" class="anim-element hl-text-red text-default" text-anchor="end">30°</text>
            <text id="scene1-text-adb" x="565" y="185" class="anim-element hl-text-red text-default" text-anchor="end">30°</text>
            
            <text x="380" y="200" class="text-default text-math">O</text>
            <text x="250" y="295" class="text-default text-math">A</text>
            <text x="400" y="385" class="text-default text-math" text-anchor="middle">B</text>
            <text x="540" y="295" class="text-default text-math">C</text>
            <text x="540" y="145" class="text-default text-math">D</text>
            
            <text x="410" y="165" class="text-default">6</text>
            
            <!-- Conclusion -->
            <text id="scene1-text-ab-len" x="260" y="345" class="anim-element hl-text-red-bold text-default text-math" text-anchor="end">AB = 3</text>
            
        </svg>
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 4;
        
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        
        // Elements
        const polyAbc = document.getElementById('scene1-poly-abc');
        const polyAbd = document.getElementById('scene1-poly-abd');
        const arcAcb = document.getElementById('scene1-arc-acb');
        const textAcbBlue = document.getElementById('scene1-text-acb-blue');
        const textAcbRed = document.getElementById('scene1-text-acb-red');
        const arcAb = document.getElementById('scene1-arc-ab');
        const arcAdb = document.getElementById('scene1-arc-adb');
        const textAdb = document.getElementById('scene1-text-adb');
        const lineAdHl = document.getElementById('scene1-line-ad-hl');
        const angleAbd = document.getElementById('scene1-angle-abd');
        const textAbLen = document.getElementById('scene1-text-ab-len');
        
        function updateScene() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
            
            // Reset all
            polyAbc.classList.remove('show');
            polyAbd.classList.remove('show');
            arcAcb.classList.remove('show', 'hl-blue-stroke', 'hl-red-stroke');
            textAcbBlue.classList.remove('show');
            textAcbRed.classList.remove('show');
            arcAb.classList.remove('show');
            arcAdb.classList.remove('show');
            textAdb.classList.remove('show');
            lineAdHl.classList.remove('show');
            angleAbd.classList.remove('show');
            textAbLen.classList.remove('show');
            
            // Step 1
            if (currentStep >= 1) {
                polyAbc.classList.add('show');
                if (currentStep === 1) {
                    arcAcb.classList.add('show', 'hl-blue-stroke');
                    textAcbBlue.classList.add('show');
                }
            }
            
            // Step 2
            if (currentStep >= 2) {
                arcAb.classList.add('show');
                arcAcb.classList.add('show', 'hl-red-stroke');
                textAcbRed.classList.add('show');
                arcAdb.classList.add('show');
                textAdb.classList.add('show');
            }
            
            // Step 3
            if (currentStep >= 3) {
                lineAdHl.classList.add('show');
                angleAbd.classList.add('show');
            }
            
            // Step 4
            if (currentStep >= 4) {
                polyAbd.classList.add('show');
                textAbLen.classList.add('show');
            }
        }
        
        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });
        
        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });
        
        updateScene();
    })();
    </script>
</body>
</html>
