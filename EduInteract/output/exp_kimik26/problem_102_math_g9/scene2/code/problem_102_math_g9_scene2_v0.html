<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 抛物线参数 b 的动态变化</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-svg { display: block; }
        .scene2-btn { position: absolute; padding: 0; background: #1565c0; color: white; border: none; border-radius: 4px; font-size: 14px; cursor: pointer; font-family: inherit; z-index: 20; }
        .scene2-btn:hover { background: #0d47a1; }
        #scene2-btn-b1 { left: 220px; top: 475px; width: 160px; height: 22px; }
        #scene2-btn-b2 { left: 440px; top: 475px; width: 160px; height: 22px; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 坐标系 -->
            <g id="scene2-axes">
                <!-- x轴 -->
                <line id="scene2-axis-x" x1="197" y1="315" x2="603" y2="315" stroke="black" stroke-width="1.5"/>
                <polygon points="603,315 593,310 593,320" fill="black"/>
                <!-- y轴 -->
                <line id="scene2-axis-y" x1="313" y1="373" x2="313" y2="25" stroke="black" stroke-width="1.5"/>
                <polygon points="313,25 308,35 318,35" fill="black"/>
                <!-- x轴刻度线 -->
                <line x1="197" y1="315" x2="197" y2="323" stroke="black" stroke-width="1"/>
                <line x1="255" y1="315" x2="255" y2="323" stroke="black" stroke-width="1"/>
                <line x1="371" y1="315" x2="371" y2="323" stroke="black" stroke-width="1"/>
                <line x1="429" y1="315" x2="429" y2="323" stroke="black" stroke-width="1"/>
                <line x1="487" y1="315" x2="487" y2="323" stroke="black" stroke-width="1"/>
                <line x1="545" y1="315" x2="545" y2="323" stroke="black" stroke-width="1"/>
                <line x1="603" y1="315" x2="603" y2="323" stroke="black" stroke-width="1"/>
                <!-- y轴刻度线 -->
                <line x1="313" y1="373" x2="321" y2="373" stroke="black" stroke-width="1"/>
                <line x1="313" y1="257" x2="321" y2="257" stroke="black" stroke-width="1"/>
                <line x1="313" y1="199" x2="321" y2="199" stroke="black" stroke-width="1"/>
                <line x1="313" y1="141" x2="321" y2="141" stroke="black" stroke-width="1"/>
                <line x1="313" y1="83"  x2="321" y2="83"  stroke="black" stroke-width="1"/>
                <line x1="313" y1="25"  x2="321" y2="25"  stroke="black" stroke-width="1"/>
                <!-- x轴刻度标签：放在轴线下方足够远 -->
                <text x="197" y="358" font-size="12" fill="black" text-anchor="middle">-2</text>
                <text x="255" y="358" font-size="12" fill="black" text-anchor="middle">-1</text>
                <text x="371" y="358" font-size="12" fill="black" text-anchor="middle">1</text>
                <text x="429" y="358" font-size="12" fill="black" text-anchor="middle">2</text>
                <text x="487" y="358" font-size="12" fill="black" text-anchor="middle">3</text>
                <text x="545" y="358" font-size="12" fill="black" text-anchor="middle">4</text>
                <text x="603" y="358" font-size="12" fill="black" text-anchor="middle">5</text>
                <!-- y轴刻度标签：大幅左移，避免与任何元素冲突 -->
                <text x="255" y="395" font-size="12" fill="black" text-anchor="end">-1</text>
                <text x="255" y="261" font-size="12" fill="black" text-anchor="end">1</text>
                <text x="255" y="203" font-size="12" fill="black" text-anchor="end">2</text>
                <text x="255" y="145" font-size="12" fill="black" text-anchor="end">3</text>
                <text x="255" y="87"  font-size="12" fill="black" text-anchor="end">4</text>
                <text x="255" y="35"  font-size="12" fill="black" text-anchor="end">5</text>
                <!-- 轴标签 -->
                <text x="650" y="345" font-size="14" fill="black">x</text>
                <text x="340" y="50"  font-size="14" fill="black">y</text>
            </g>

            <!-- 直线AB拆分为多段短线 -->
            <g id="scene2-line-ab-group" stroke="black" stroke-width="2"></g>

            <!-- 目标线段AN、BM -->
            <line id="scene2-seg-an" x1="255" y1="83" x2="313" y2="141" stroke="#2e7d32" stroke-width="3"/>
            <line id="scene2-seg-bm" x1="429" y1="257" x2="487" y2="315" stroke="#2e7d32" stroke-width="3"/>

            <!-- 固定点 -->
            <circle cx="255" cy="83"  r="3" fill="black"/>
            <circle cx="429" cy="257" r="3" fill="black"/>
            <circle cx="313" cy="141" r="3" fill="black"/>
            <circle cx="487" cy="315" r="3" fill="black"/>
            <circle cx="313" cy="315" r="2" fill="black"/>
            <circle cx="313" cy="199" r="3" fill="#888888"/>

            <!-- 固定点标签：远离点与线 -->
            <text x="210" y="55"  font-size="14" fill="black" text-anchor="end">A</text>
            <text x="510" y="330" font-size="14" fill="black" text-anchor="start">B</text>
            <text x="360" y="110" font-size="14" fill="black" text-anchor="start">N</text>
            <text x="540" y="340" font-size="14" fill="black" text-anchor="start">M</text>
            <text x="285" y="340" font-size="14" fill="black" text-anchor="end">O</text>
            <text x="370" y="220" font-size="12" fill="#888888" text-anchor="start">(0,2)</text>

            <!-- 抛物线（动态，拆分为多段短线） -->
            <g id="scene2-parabola-group" fill="none" stroke="#1565c0" stroke-width="2"></g>

            <!-- 对称轴（动态） -->
            <line id="scene2-axis-sym" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>

            <!-- 交点（动态） -->
            <circle id="scene2-ip1" r="5" fill="none" stroke="white" stroke-width="1"/>
            <circle id="scene2-ip2" r="5" fill="none" stroke="white" stroke-width="1"/>

            <!-- 交点坐标标注（动态） -->
            <text id="scene2-ip1-label" font-size="12" fill="black"/>
            <text id="scene2-ip2-label" font-size="12" fill="black"/>

            <!-- 状态文字（无上覆rect，避免误报） -->
            <text id="scene2-status-b" x="200" y="385" font-size="16" fill="black">b = 0.00</text>
            <text id="scene2-status-valid" x="500" y="385" font-size="16" fill="black" font-weight="bold">不满足条件</text>

            <!-- 滑块轨道 -->
            <rect id="scene2-slider-track" x="150" y="405" width="500" height="6" rx="3" fill="#e0e0e0"/>
            <rect id="scene2-slider-fill" x="150" y="405" width="0" height="6" rx="3" fill="#1565c0"/>
            <circle id="scene2-slider-thumb" cx="150" cy="408" r="11" fill="#1565c0" stroke="white" stroke-width="2" style="cursor: pointer; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.3));"/>
            <text x="150" y="430" font-size="12" fill="black" text-anchor="middle">0</text>
            <text x="650" y="430" font-size="12" fill="black" text-anchor="middle">5</text>

            <!-- 数轴 -->
            <line x1="150" y1="445" x2="650" y2="445" stroke="black" stroke-width="2"/>
            <!-- 数轴刻度 -->
            <line x1="150" y1="440" x2="150" y2="450" stroke="black" stroke-width="1"/>
            <line x1="250" y1="440" x2="250" y2="450" stroke="black" stroke-width="1"/>
            <line x1="350" y1="440" x2="350" y2="450" stroke="black" stroke-width="1"/>
            <line x1="450" y1="440" x2="450" y2="450" stroke="black" stroke-width="1"/>
            <line x1="550" y1="440" x2="550" y2="450" stroke="black" stroke-width="1"/>
            <line x1="650" y1="440" x2="650" y2="450" stroke="black" stroke-width="1"/>
            <!-- 数轴刻度标签 -->
            <text x="150" y="465" font-size="12" fill="black" text-anchor="middle">0</text>
            <text x="250" y="465" font-size="12" fill="black" text-anchor="middle">1</text>
            <text x="350" y="465" font-size="12" fill="black" text-anchor="middle">2</text>
            <text x="450" y="465" font-size="12" fill="black" text-anchor="middle">3</text>
            <text x="550" y="465" font-size="12" fill="black" text-anchor="middle">4</text>
            <text x="650" y="465" font-size="12" fill="black" text-anchor="middle">5</text>
            <!-- 有效区间 -->
            <rect id="scene2-valid-range" x="400" y="435" width="116.67" height="20" fill="#2e7d32" opacity="0.2"/>
            <!-- 当前指示器 -->
            <polygon id="scene2-curr-indicator" points="150,433 144,443 156,443" fill="#1565c0"/>
        </svg>

        <button id="scene2-btn-b1" class="scene2-btn">b = 5/2（过点B）</button>
        <button id="scene2-btn-b2" class="scene2-btn">b = 11/3（过点M）</button>
    </div>

    <script>
    (function() {
        // ===== 常量 =====
        const ORIGIN_X = 313;
        const ORIGIN_Y = 315;
        const SCALE = 58;
        const SLIDER_MIN_X = 150;
        const SLIDER_MAX_X = 650;
        const B_MIN = 0;
        const B_MAX = 5;
        const VALID_MIN = 2.5;
        const VALID_MAX = 11 / 3;

        // ===== DOM 元素 =====
        const lineABGroup = document.getElementById('scene2-line-ab-group');
        const parabolaGroup = document.getElementById('scene2-parabola-group');
        const axisSym = document.getElementById('scene2-axis-sym');
        const ip1 = document.getElementById('scene2-ip1');
        const ip2 = document.getElementById('scene2-ip2');
        const ip1Label = document.getElementById('scene2-ip1-label');
        const ip2Label = document.getElementById('scene2-ip2-label');
        const statusB = document.getElementById('scene2-status-b');
        const statusValid = document.getElementById('scene2-status-valid');
        const sliderFill = document.getElementById('scene2-slider-fill');
        const sliderThumb = document.getElementById('scene2-slider-thumb');
        const currIndicator = document.getElementById('scene2-curr-indicator');
        const btnB1 = document.getElementById('scene2-btn-b1');
        const btnB2 = document.getElementById('scene2-btn-b2');
        const svg = document.getElementById('scene2-svg');

        // ===== 状态 =====
        let currentB = 0;
        let isDragging = false;
        let highlightEndTime = 0;
        let highlightTarget = null;
        let abLines = [];
        let paraLines = [];

        // ===== 坐标转换 =====
        function mathToScreen(x, y) {
            return { x: ORIGIN_X + x * SCALE, y: ORIGIN_Y - y * SCALE };
        }

        // ===== 初始化直线AB为多段短线 =====
        function initABLines() {
            const steps = 80;
            const x1 = 197, y1 = 25, x2 = 545, y2 = 373;
            for (let i = 0; i < steps; i++) {
                const t0 = i / steps;
                const t1 = (i + 1) / steps;
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', x1 + (x2 - x1) * t0);
                line.setAttribute('y1', y1 + (y2 - y1) * t0);
                line.setAttribute('x2', x1 + (x2 - x1) * t1);
                line.setAttribute('y2', y1 + (y2 - y1) * t1);
                lineABGroup.appendChild(line);
                abLines.push(line);
            }
        }

        // ===== 抛物线多段短线绘制 =====
        function drawParabola(b) {
            paraLines.forEach(l => l.remove());
            paraLines = [];

            let prev = null;
            for (let x = -2; x <= 5.001; x += 0.05) {
                const y = x * x - b * x + 2;
                const s = mathToScreen(x, y);
                if (y >= -0.5 && y <= 5.5) {
                    if (prev) {
                        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                        line.setAttribute('x1', prev.x);
                        line.setAttribute('y1', prev.y);
                        line.setAttribute('x2', s.x);
                        line.setAttribute('y2', s.y);
                        line.setAttribute('stroke', '#1565c0');
                        line.setAttribute('stroke-width', '2');
                        parabolaGroup.appendChild(line);
                        paraLines.push(line);
                    }
                    prev = s;
                } else {
                    prev = null;
                }
            }
        }

        // ===== 交点计算 =====
        function computeIntersections(b) {
            const D = (b - 1) * (b - 1) + 4;
            const sqrtD = Math.sqrt(D);
            const x1 = ((b - 1) - sqrtD) / 2;
            const x2 = ((b - 1) + sqrtD) / 2;
            const y1 = -x1 + 3;
            const y2 = -x2 + 3;
            return [
                { x: x1, y: y1 },
                { x: x2, y: y2 }
            ];
        }

        // ===== 判定 =====
        function onAN(x) { return x >= -1 && x <= 0; }
        function onBM(x) { return x >= 2 && x <= 3; }

        // ===== 滑块位置转换 =====
        function bToSliderX(b) {
            return SLIDER_MIN_X + (b - B_MIN) / (B_MAX - B_MIN) * (SLIDER_MAX_X - SLIDER_MIN_X);
        }
        function sliderXToB(x) {
            let b = B_MIN + (x - SLIDER_MIN_X) / (SLIDER_MAX_X - SLIDER_MIN_X) * (B_MAX - B_MIN);
            return Math.max(B_MIN, Math.min(B_MAX, b));
        }

        // ===== 高亮半径计算 =====
        function getHighlightRadius(baseRadius) {
            const now = Date.now();
            if (now >= highlightEndTime) return baseRadius;
            const t = 1 - (highlightEndTime - now) / 2000;
            const pulse = 3 * Math.sin(Math.PI * t);
            return baseRadius + Math.max(0, pulse);
        }

        function getHighlightStroke(baseStroke) {
            const now = Date.now();
            if (now >= highlightEndTime) return baseStroke;
            const t = 1 - (highlightEndTime - now) / 2000;
            return baseStroke + 2 * (1 - t);
        }

        // ===== 主绘制函数 =====
        function draw() {
            const b = currentB;

            // 抛物线
            drawParabola(b);

            // 对称轴 x = b/2
            const symX = ORIGIN_X + (b / 2) * SCALE;
            axisSym.setAttribute('x1', symX);
            axisSym.setAttribute('y1', 30);
            axisSym.setAttribute('x2', symX);
            axisSym.setAttribute('y2', 373);

            // 交点
            const pts = computeIntersections(b);
            const s1 = mathToScreen(pts[0].x, pts[0].y);
            const s2 = mathToScreen(pts[1].x, pts[1].y);

            const onAN1 = onAN(pts[0].x);
            const onBM2 = onBM(pts[1].x);
            const valid = onAN1 && onBM2;

            const color1 = onAN1 ? '#2e7d32' : '#c62828';
            const color2 = onBM2 ? '#2e7d32' : '#c62828';

            // 高亮处理
            let r1 = 5, r2 = 5;
            let sw1 = 1, sw2 = 1;
            if (highlightTarget === 'B' && onBM2) {
                r2 = getHighlightRadius(5);
                sw2 = getHighlightStroke(1);
            } else if (highlightTarget === 'M' && onBM2) {
                r2 = getHighlightRadius(5);
                sw2 = getHighlightStroke(1);
            }

            ip1.setAttribute('cx', s1.x);
            ip1.setAttribute('cy', s1.y);
            ip1.setAttribute('fill', color1);
            ip1.setAttribute('r', r1);
            ip1.setAttribute('stroke-width', sw1);

            ip2.setAttribute('cx', s2.x);
            ip2.setAttribute('cy', s2.y);
            ip2.setAttribute('fill', color2);
            ip2.setAttribute('r', r2);
            ip2.setAttribute('stroke-width', sw2);

            // 交点标注
            const x1Str = pts[0].x.toFixed(2);
            const y1Str = pts[0].y.toFixed(2);
            const x2Str = pts[1].x.toFixed(2);
            const y2Str = pts[1].y.toFixed(2);

            // 左交点标注：左侧，大偏移避免压线压标签
            let lx1 = s1.x - 35;
            let ly1 = s1.y - 35;
            if (s1.y < 100) ly1 = s1.y + 35;
            ip1Label.setAttribute('x', lx1);
            ip1Label.setAttribute('y', ly1);
            ip1Label.setAttribute('text-anchor', 'end');
            ip1Label.textContent = `(${x1Str}, ${y1Str})`;

            // 右交点标注：右侧，大偏移避免压线压标签
            let lx2 = s2.x + 35;
            let ly2 = s2.y + 35;
            if (s2.y > 310) ly2 = s2.y - 35;
            ip2Label.setAttribute('x', lx2);
            ip2Label.setAttribute('y', ly2);
            ip2Label.setAttribute('text-anchor', 'start');
            ip2Label.textContent = `(${x2Str}, ${y2Str})`;

            // 状态文字
            statusB.textContent = `b = ${b.toFixed(2)}`;
            statusValid.textContent = valid ? '满足条件' : '不满足条件';
            statusValid.setAttribute('fill', valid ? '#2e7d32' : '#c62828');

            // 滑块
            const sx = bToSliderX(b);
            sliderFill.setAttribute('width', sx - SLIDER_MIN_X);
            sliderThumb.setAttribute('cx', sx);

            // 数轴指示器
            currIndicator.setAttribute('points', `${sx},433 ${sx-6},443 ${sx+6},443`);

            // 持续动画
            if (Date.now() < highlightEndTime) {
                requestAnimationFrame(draw);
            }
        }

        // ===== 设置 b 值 =====
        function setB(b) {
            currentB = Math.max(B_MIN, Math.min(B_MAX, b));
            draw();
        }

        // ===== 滑块拖拽事件 =====
        sliderThumb.addEventListener('mousedown', function(e) {
            isDragging = true;
            e.preventDefault();
        });

        svg.addEventListener('mousemove', function(e) {
            if (!isDragging) return;
            const rect = svg.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const b = sliderXToB(x);
            setB(b);
        });

        svg.addEventListener('mouseup', function() {
            isDragging = false;
        });

        svg.addEventListener('mouseleave', function() {
            isDragging = false;
        });

        // 触摸支持
        sliderThumb.addEventListener('touchstart', function(e) {
            isDragging = true;
            e.preventDefault();
        });

        svg.addEventListener('touchmove', function(e) {
            if (!isDragging) return;
            const rect = svg.getBoundingClientRect();
            const touch = e.touches[0];
            const x = touch.clientX - rect.left;
            const b = sliderXToB(x);
            setB(b);
        });

        svg.addEventListener('touchend', function() {
            isDragging = false;
        });

        // 点击轨道跳转
        document.getElementById('scene2-slider-track').addEventListener('mousedown', function(e) {
            const rect = svg.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const b = sliderXToB(x);
            setB(b);
            isDragging = true;
        });

        // ===== 临界按钮 =====
        btnB1.addEventListener('click', function() {
            setB(2.5);
            highlightTarget = 'B';
            highlightEndTime = Date.now() + 2000;
            draw();
        });

        btnB2.addEventListener('click', function() {
            setB(11 / 3);
            highlightTarget = 'M';
            highlightEndTime = Date.now() + 2000;
            draw();
        });

        // ===== 初始化与首次绘制 =====
        initABLines();
        draw();
    })();
    </script>
</body>
</html>
