<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>几何结论验证 - 场景2</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene2-controls button {
            padding: 8px 20px;
            font-size: 14px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            background: #f5f5f5;
            color: #333333;
            cursor: pointer;
            min-width: 100px;
            height: 36px;
        }
        #scene2-controls button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #scene2-step-indicator {
            font-size: 14px;
            color: #666666;
            min-width: 70px;
            text-align: center;
        }
        #scene2-conclusion-panel {
            position: absolute;
            top: 100px;
            right: 30px;
            width: 220px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            background: #ffffff;
            padding: 12px 16px;
            z-index: 5;
        }
        .scene2-concl-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            font-size: 15px;
            color: #333333;
            min-height: 28px;
        }
        .scene2-concl-row + .scene2-concl-row {
            border-top: 1px solid #f0f0f0;
        }
        .scene2-concl-mark {
            font-size: 18px;
            font-weight: bold;
            min-width: 24px;
            text-align: right;
        }
        .scene2-deduce-box {
            margin-top: 6px;
            padding: 6px 0;
            font-size: 13px;
            line-height: 1.6;
            min-height: 20px;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 基础图形：三角形和连线 -->
            <line id="scene2-line-ab" x1="400" y1="90" x2="80" y2="410" stroke="#000000" stroke-width="2"/>
            <line id="scene2-line-ac" x1="400" y1="90" x2="720" y2="410" stroke="#000000" stroke-width="2"/>
            <line id="scene2-line-bc" x1="80" y1="410" x2="720" y2="410" stroke="#000000" stroke-width="2"/>
            <line id="scene2-line-ae" x1="400" y1="90" x2="200" y2="410" stroke="#000000" stroke-width="2"/>
            <line id="scene2-line-ad" x1="400" y1="90" x2="474" y2="410" stroke="#000000" stroke-width="2"/>
            <line id="scene2-line-af" x1="400" y1="90" x2="80" y2="164" stroke="#000000" stroke-width="2"/>
            <line id="scene2-line-ef" x1="200" y1="410" x2="80" y2="164" stroke="#000000" stroke-width="2"/>
            <line id="scene2-line-bf" x1="80" y1="410" x2="80" y2="164" stroke="#000000" stroke-width="2"/>

            <!-- 三角形填充（初始隐藏） -->
            <path id="scene2-tri-aed" d="M 400 90 L 200 410 L 474 410 Z" fill="#1565c0" fill-opacity="0.2" stroke="#1565c0" stroke-width="3" opacity="0"/>
            <path id="scene2-tri-aef" d="M 400 90 L 200 410 L 80 164 Z" fill="#c62828" fill-opacity="0.2" stroke="#c62828" stroke-width="3" opacity="0"/>
            <path id="scene2-tri-fbe" d="M 80 164 L 80 410 L 200 410 Z" fill="#2e7d32" fill-opacity="0.2" stroke="#2e7d32" stroke-width="3" opacity="0"/>

            <!-- 步骤2虚线三角形 -->
            <path id="scene2-tri-abe-dash" d="M 400 90 L 80 410 L 200 410 Z" fill="none" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" opacity="0"/>
            <path id="scene2-tri-acd-dash" d="M 400 90 L 720 410 L 474 410 Z" fill="none" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" opacity="0"/>

            <!-- AE公共边高亮（步骤1） -->
            <line id="scene2-line-ae-highlight" x1="400" y1="90" x2="200" y2="410" stroke="#2e7d32" stroke-width="4" opacity="0"/>

            <!-- 等长标记（步骤1） -->
            <g id="scene2-mark-ad" opacity="0">
                <line x1="433" y1="244" x2="441" y2="256" stroke="#000000" stroke-width="1.5"/>
                <line x1="441" y1="244" x2="449" y2="256" stroke="#000000" stroke-width="1.5"/>
            </g>
            <g id="scene2-mark-af" opacity="0">
                <line x1="236" y1="121" x2="244" y2="133" stroke="#000000" stroke-width="1.5"/>
                <line x1="244" y1="121" x2="252" y2="133" stroke="#000000" stroke-width="1.5"/>
            </g>

            <!-- 角度弧与标注（全部放在线段bounding box之外，文字间距≥30px） -->
            <!-- ∠BAC=90°弧 -->
            <path id="scene2-arc-bac" d="M 420 105 A 25 25 0 0 1 415 115" fill="none" stroke="#000000" stroke-width="1.5"/>
            <text id="scene2-text-bac" x="520" y="78" font-size="14" fill="#000000">90°</text>

            <!-- ∠DAF=90°弧 -->
            <path id="scene2-arc-daf" d="M 380 105 A 25 25 0 0 0 385 115" fill="none" stroke="#000000" stroke-width="1.5"/>
            <text id="scene2-text-daf" x="240" y="78" font-size="14" fill="#000000">90°</text>

            <!-- ∠DAE=45°弧（步骤1） -->
            <path id="scene2-arc-dae" d="M 415 108 A 18 18 0 0 1 412 120" fill="none" stroke="#000000" stroke-width="1.5" opacity="0"/>
            <text id="scene2-text-dae" x="450" y="78" font-size="14" fill="#000000" opacity="0">45°</text>

            <!-- ∠FAE=45°弧（步骤1） -->
            <path id="scene2-arc-fae" d="M 385 108 A 18 18 0 0 0 388 120" fill="none" stroke="#000000" stroke-width="1.5" opacity="0"/>
            <text id="scene2-text-fae" x="310" y="78" font-size="14" fill="#000000" opacity="0">45°</text>

            <!-- ∠B=45°弧（步骤2） -->
            <path id="scene2-arc-b" d="M 95 410 A 18 18 0 0 0 98 398" fill="none" stroke="#888888" stroke-width="1.5" opacity="0"/>
            <text id="scene2-text-b" x="50" y="395" font-size="13" fill="#888888" opacity="0">45°</text>

            <!-- ∠C=45°弧（步骤2） -->
            <path id="scene2-arc-c" d="M 705 410 A 18 18 0 0 1 702 398" fill="none" stroke="#888888" stroke-width="1.5" opacity="0"/>
            <text id="scene2-text-c" x="750" y="395" font-size="13" fill="#888888" opacity="0">45°</text>

            <!-- ∠FBE=90°直角符号（步骤4） -->
            <path id="scene2-right-fbe" d="M 80 398 L 92 398 L 92 410" fill="none" stroke="#000000" stroke-width="1.5" opacity="0"/>

            <!-- 顶点标签 -->
            <text id="scene2-label-a" x="400" y="72" font-size="16" fill="#000000" text-anchor="middle" font-weight="bold">A</text>
            <text id="scene2-label-b" x="80" y="432" font-size="16" fill="#000000" text-anchor="middle" font-weight="bold">B</text>
            <text id="scene2-label-c" x="720" y="432" font-size="16" fill="#000000" text-anchor="middle" font-weight="bold">C</text>
            <text id="scene2-label-d" x="474" y="432" font-size="16" fill="#000000" text-anchor="middle" font-weight="bold">D</text>
            <text id="scene2-label-e" x="200" y="432" font-size="16" fill="#000000" text-anchor="middle" font-weight="bold">E</text>
            <text id="scene2-label-f" x="62" y="168" font-size="16" fill="#000000" text-anchor="end" font-weight="bold">F</text>

            <!-- 底部边标注（在BC线下方，y>410，不压线） -->
            <text id="scene2-label-be" x="140" y="445" font-size="14" fill="#000000" text-anchor="middle">BE</text>
            <text id="scene2-label-ed" x="337" y="445" font-size="14" fill="#000000" text-anchor="middle">ED</text>
            <text id="scene2-label-dc" x="597" y="445" font-size="14" fill="#000000" text-anchor="middle">DC</text>
        </svg>

        <!-- 结论列表面板（HTML overlay） -->
        <div id="scene2-conclusion-panel">
            <div class="scene2-concl-row">
                <span>① △AED ≌ △AEF</span>
                <span id="scene2-mark-1" class="scene2-concl-mark" style="color:#2e7d32; opacity:0;">√</span>
            </div>
            <div class="scene2-concl-row">
                <span>② △ABE ∽ △ACD</span>
                <span id="scene2-mark-2" class="scene2-concl-mark" style="color:#888888; opacity:0;">×</span>
            </div>
            <div class="scene2-concl-row">
                <span>③ BE + DC > DE</span>
                <span id="scene2-mark-3" class="scene2-concl-mark" style="color:#2e7d32; opacity:0;">√</span>
            </div>
            <div class="scene2-concl-row">
                <span>④ BE² + DC² = DE²</span>
                <span id="scene2-mark-4" class="scene2-concl-mark" style="color:#2e7d32; opacity:0;">√</span>
            </div>
            <div id="scene2-deduce-area" class="scene2-deduce-box" style="color:#2e7d32;"></div>
            <div id="scene2-answer" style="font-size:18px; color:#1565c0; font-weight:bold; padding-top:8px; opacity:0;">正确答案：C（3个）</div>
        </div>

        <div id="scene2-controls">
            <button id="scene2-btn-prev" disabled>◀ 上一步</button>
            <span id="scene2-step-indicator">步骤 0/5</span>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const totalSteps = 5;

        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        const stepIndicator = document.getElementById('scene2-step-indicator');
        const deduceArea = document.getElementById('scene2-deduce-area');
        const answerEl = document.getElementById('scene2-answer');

        const els = {
            triAed: document.getElementById('scene2-tri-aed'),
            triAef: document.getElementById('scene2-tri-aef'),
            triFbe: document.getElementById('scene2-tri-fbe'),
            triAbeDash: document.getElementById('scene2-tri-abe-dash'),
            triAcdDash: document.getElementById('scene2-tri-acd-dash'),
            aeHighlight: document.getElementById('scene2-line-ae-highlight'),
            markAd: document.getElementById('scene2-mark-ad'),
            markAf: document.getElementById('scene2-mark-af'),
            arcDae: document.getElementById('scene2-arc-dae'),
            textDae: document.getElementById('scene2-text-dae'),
            arcFae: document.getElementById('scene2-arc-fae'),
            textFae: document.getElementById('scene2-text-fae'),
            arcB: document.getElementById('scene2-arc-b'),
            textB: document.getElementById('scene2-text-b'),
            arcC: document.getElementById('scene2-arc-c'),
            textC: document.getElementById('scene2-text-c'),
            rightFbe: document.getElementById('scene2-right-fbe'),
        };

        const marks = {
            mark1: document.getElementById('scene2-mark-1'),
            mark2: document.getElementById('scene2-mark-2'),
            mark3: document.getElementById('scene2-mark-3'),
            mark4: document.getElementById('scene2-mark-4'),
        };

        function setOpacity(el, val) {
            if (el) el.style.opacity = val;
        }

        function setSvgOpacity(el, val) {
            if (el) el.setAttribute('opacity', val);
        }

        function hideAllHighlights() {
            setSvgOpacity(els.triAed, 0);
            setSvgOpacity(els.triAef, 0);
            setSvgOpacity(els.triFbe, 0);
            setSvgOpacity(els.triAbeDash, 0);
            setSvgOpacity(els.triAcdDash, 0);
            setSvgOpacity(els.aeHighlight, 0);
            setSvgOpacity(els.markAd, 0);
            setSvgOpacity(els.markAf, 0);
            setSvgOpacity(els.arcDae, 0);
            setSvgOpacity(els.textDae, 0);
            setSvgOpacity(els.arcFae, 0);
            setSvgOpacity(els.textFae, 0);
            setSvgOpacity(els.arcB, 0);
            setSvgOpacity(els.textB, 0);
            setSvgOpacity(els.arcC, 0);
            setSvgOpacity(els.textC, 0);
            setSvgOpacity(els.rightFbe, 0);
            deduceArea.innerHTML = '';
            deduceArea.style.color = '#2e7d32';
            setOpacity(answerEl, 0);
        }

        function renderStep(step) {
            hideAllHighlights();

            if (step >= 1) setOpacity(marks.mark1, 1);
            if (step >= 2) setOpacity(marks.mark2, 1);
            if (step >= 3) setOpacity(marks.mark3, 1);
            if (step >= 4) setOpacity(marks.mark4, 1);

            switch (step) {
                case 0:
                    break;
                case 1:
                    setSvgOpacity(els.triAed, 1);
                    setSvgOpacity(els.triAef, 1);
                    setSvgOpacity(els.aeHighlight, 1);
                    setSvgOpacity(els.markAd, 1);
                    setSvgOpacity(els.markAf, 1);
                    setSvgOpacity(els.arcDae, 1);
                    setSvgOpacity(els.textDae, 1);
                    setSvgOpacity(els.arcFae, 1);
                    setSvgOpacity(els.textFae, 1);
                    deduceArea.innerHTML = '<div style="color:#2e7d32; font-weight:bold;">SAS</div>';
                    break;
                case 2:
                    setSvgOpacity(els.triAbeDash, 1);
                    setSvgOpacity(els.triAcdDash, 1);
                    setSvgOpacity(els.arcB, 1);
                    setSvgOpacity(els.textB, 1);
                    setSvgOpacity(els.arcC, 1);
                    setSvgOpacity(els.textC, 1);
                    deduceArea.innerHTML = '<div style="color:#888888;">∠BAE ≠ ∠CAD</div>';
                    break;
                case 3:
                    setSvgOpacity(els.triFbe, 1);
                    deduceArea.innerHTML = '<div>BE + BF > FE</div><div>⇒ BE + DC > DE</div><div style="margin-top:4px; color:#666;">(BF = DC, FE = DE)</div>';
                    break;
                case 4:
                    setSvgOpacity(els.triFbe, 1);
                    setSvgOpacity(els.rightFbe, 1);
                    deduceArea.innerHTML = '<div>∠FBE = 90°</div><div>BE² + BF² = FE²</div><div>⇒ BE² + DC² = DE²</div><div style="margin-top:4px; color:#666;">(BF = DC, FE = DE)</div>';
                    break;
                case 5:
                    setOpacity(answerEl, 1);
                    break;
            }

            btnPrev.disabled = step === 0;
            btnNext.disabled = step === totalSteps;
            stepIndicator.textContent = '步骤 ' + step + '/' + totalSteps;
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep(currentStep);
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                renderStep(currentStep);
            }
        });

        renderStep(0);
    })();
    </script>
</body>
</html>
