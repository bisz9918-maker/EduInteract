<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 1 - 角平分线与角度关系</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            padding: 6px 16px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #f5f5f5;
        }
        #scene1-controls button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #scene1-step-indicator {
            font-size: 14px;
            color: #333;
            min-width: 70px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" viewBox="0 0 800 500" style="display: block;">
            <!-- 基础图形（步骤0始终显示） -->
            <!-- MN底边 -->
            <line x1="200" y1="380" x2="600" y2="380" stroke="#000" stroke-width="2"/>
            <!-- AM -->
            <line x1="200" y1="380" x2="300" y2="120" stroke="#000" stroke-width="2"/>
            <!-- AN -->
            <line x1="300" y1="120" x2="600" y2="380" stroke="#000" stroke-width="2"/>
            <!-- BM -->
            <line x1="500" y1="120" x2="200" y2="380" stroke="#000" stroke-width="2"/>
            <!-- BN -->
            <line x1="500" y1="120" x2="600" y2="380" stroke="#000" stroke-width="2"/>

            <!-- 点 -->
            <circle cx="200" cy="380" r="3" fill="#000"/>
            <circle cx="600" cy="380" r="3" fill="#000"/>
            <circle cx="300" cy="120" r="3" fill="#000"/>
            <circle cx="500" cy="120" r="3" fill="#000"/>
            <circle cx="400" cy="210" r="3" fill="#000"/>

            <!-- 点标签 -->
            <text x="185" y="400" font-size="18" fill="#000" text-anchor="middle">M</text>
            <text x="615" y="400" font-size="18" fill="#000" text-anchor="middle">N</text>
            <text x="295" y="105" font-size="18" fill="#000" text-anchor="middle">A</text>
            <text x="495" y="105" font-size="18" fill="#000" text-anchor="middle">B</text>
            <text x="420" y="95" font-size="18" fill="#000" text-anchor="middle">C</text>

            <!-- 步骤1：α、β标注 + 角平分线标记 -->
            <g id="scene1-step1" style="display: none;">
                <text x="250" y="100" font-size="18" fill="#000" text-anchor="middle">α</text>
                <text x="550" y="100" font-size="18" fill="#000" text-anchor="middle">β</text>
                <!-- ∠AMN角平分线弧线（蓝色） -->
                <path d="M 220 380 A 20 20 0 0 0 207.1 360.5" stroke="#1565c0" stroke-width="2" fill="none"/>
                <!-- ∠AMN双短杠1 -->
                <line x1="216.8" y1="368.5" x2="220.0" y2="375.9" stroke="#1565c0" stroke-width="2"/>
                <!-- ∠AMN双短杠2 -->
                <line x1="211.0" y1="362.8" x2="216.8" y2="368.4" stroke="#1565c0" stroke-width="2"/>
                <!-- ∠BNM角平分线弧线（红色） -->
                <path d="M 580 380 A 20 20 0 0 1 592.9 360.5" stroke="#c62828" stroke-width="2" fill="none"/>
                <!-- ∠BNM双短杠1 -->
                <line x1="583.2" y1="368.5" x2="580.0" y2="375.9" stroke="#c62828" stroke-width="2"/>
                <!-- ∠BNM双短杠2 -->
                <line x1="589.0" y1="362.8" x2="583.2" y2="368.4" stroke="#c62828" stroke-width="2"/>
            </g>

            <!-- 步骤2：x、y标注 -->
            <g id="scene1-step2" style="display: none;">
                <text x="150" y="360" font-size="18" fill="#1565c0" text-anchor="middle">x</text>
                <text x="630" y="360" font-size="18" fill="#c62828" text-anchor="middle">y</text>
            </g>

            <!-- 步骤3：三角形填充 + 方程 -->
            <g id="scene1-step3" style="display: none;">
                <!-- △AMN淡蓝填充 -->
                <polygon points="300,120 200,380 600,380" fill="#1565c0" opacity="0.15"/>
                <!-- △BMN淡红填充 -->
                <polygon points="500,120 200,380 600,380" fill="#c62828" opacity="0.15"/>
                <!-- 方程① -->
                <text x="580" y="190" font-size="13" fill="#1565c0" text-anchor="start">α + 2x + y = 180° ①</text>
                <!-- 方程② -->
                <text x="580" y="225" font-size="13" fill="#c62828" text-anchor="start">β + x + 2y = 180° ②</text>
                <!-- 推导x+y -->
                <text x="580" y="265" font-size="13" fill="#000" text-anchor="start">x + y = 120° − (α+β)/3</text>
            </g>

            <!-- 步骤4：△CMN填充 + ∠MCN标注 + 结论 -->
            <g id="scene1-step4" style="display: none;">
                <!-- △CMN淡绿填充 -->
                <polygon points="400,210 200,380 600,380" fill="#2e7d32" opacity="0.15"/>
                <!-- ∠MCN标注 -->
                <text x="580" y="145" font-size="13" fill="#2e7d32" text-anchor="start">∠MCN = 180° − (x+y)</text>
                <!-- 结论文本 -->
                <text x="580" y="320" font-size="13" fill="#2e7d32" text-anchor="start" font-weight="bold">∠MCN = (α+β)/3 + 60°</text>
            </g>

            <!-- 步骤5：MN中垂线 + 等腰标记 + 推导 -->
            <g id="scene1-step5" style="display: none;">
                <!-- MN中垂线 -->
                <line x1="400" y1="100" x2="400" y2="420" stroke="#888" stroke-width="1" stroke-dasharray="5,5"/>
                <text x="410" y="405" font-size="10" fill="#888" text-anchor="start">MN的中垂线</text>
                <!-- 推导文本 -->
                <text x="640" y="185" font-size="13" fill="#000" text-anchor="start">α = β</text>
                <text x="640" y="220" font-size="13" fill="#000" text-anchor="start">∴ x = y</text>
                <text x="640" y="255" font-size="13" fill="#2e7d32" text-anchor="start">CM = CN</text>
                <text x="640" y="290" font-size="13" fill="#2e7d32" text-anchor="start">C在MN中垂线上</text>
                <!-- 等腰标记CM -->
                <line x1="366.8" y1="232.9" x2="372.0" y2="239.1" stroke="#000" stroke-width="2"/>
                <!-- 等腰标记CN -->
                <line x1="428.0" y1="239.1" x2="433.2" y2="232.9" stroke="#000" stroke-width="2"/>
            </g>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/6</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        var currentStep = 0;
        var totalSteps = 6;

        var btnPrev = document.getElementById('scene1-btn-prev');
        var btnNext = document.getElementById('scene1-btn-next');
        var indicator = document.getElementById('scene1-step-indicator');

        var stepGroups = [
            null, // step0 has no group (base graphics always shown)
            document.getElementById('scene1-step1'),
            document.getElementById('scene1-step2'),
            document.getElementById('scene1-step3'),
            document.getElementById('scene1-step4'),
            document.getElementById('scene1-step5')
        ];

        function hideTextsInGroup(group) {
            if (!group) return;
            var texts = group.querySelectorAll('text');
            texts.forEach(function(t) {
                t.style.display = 'none';
            });
        }

        function showTextsInGroup(group) {
            if (!group) return;
            var texts = group.querySelectorAll('text');
            texts.forEach(function(t) {
                t.style.display = 'block';
            });
        }

        function updateDisplay() {
            // Update step indicator
            indicator.textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;

            // Update button states
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps - 1);

            // Show/hide step groups
            for (var i = 1; i < stepGroups.length; i++) {
                if (i <= currentStep) {
                    stepGroups[i].style.display = 'block';
                } else {
                    stepGroups[i].style.display = 'none';
                }
            }

            // Step 5 special handling: hide step3 and step4 texts when step5 is shown
            if (currentStep === 5) {
                hideTextsInGroup(stepGroups[3]);
                hideTextsInGroup(stepGroups[4]);
            } else {
                showTextsInGroup(stepGroups[3]);
                showTextsInGroup(stepGroups[4]);
            }
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateDisplay();
            }
        });

        // Initialize
        updateDisplay();
    })();
    </script>
</body>
</html>
