<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圆台容器液体密度比较</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; align-items: center; }
        #scene1-controls button { padding: 6px 16px; font-size: 14px; cursor: pointer; border: 1px solid #999; border-radius: 4px; background: #f0f0f0; color: #333; }
        #scene1-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene1-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 13px; color: #666; min-width: 70px; text-align: center; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <defs>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#aaaaaa" />
                </marker>
                <marker id="scene1-arrowhead-black" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#000000" />
                </marker>
                <pattern id="scene1-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
                    <line x1="0" y1="0" x2="0" y2="8" stroke="#cccccc" stroke-width="1.2" />
                </pattern>
            </defs>

            <!-- 桌面 -->
            <line x1="100" y1="350" x2="700" y2="350" stroke="#000000" stroke-width="2" />
            <rect x="100" y="350" width="600" height="6" fill="url(#scene1-hatch)" />

            <!-- 左侧容器轮廓（上宽下窄，反放） -->
            <polygon id="scene1-container-left" points="180,200 320,200 290,350 210,350" fill="none" stroke="#000000" stroke-width="2" />

            <!-- 右侧容器轮廓（上窄下宽，正放） -->
            <polygon id="scene1-container-right" points="510,200 590,200 620,350 480,350" fill="none" stroke="#000000" stroke-width="2" />

            <!-- 左侧液体 -->
            <polygon id="scene1-liquid-left" points="190,250 310,250 290,350 210,350" fill="#1565c0" fill-opacity="0.2" stroke="#1565c0" stroke-width="1.5" />

            <!-- 右侧液体 -->
            <polygon id="scene1-liquid-right" points="500,250 600,250 620,350 480,350" fill="#1565c0" fill-opacity="0.2" stroke="#1565c0" stroke-width="1.5" />

            <!-- 液面线 -->
            <line id="scene1-surface-left" x1="190" y1="250" x2="310" y2="250" stroke="#1565c0" stroke-width="1.5" />
            <line id="scene1-surface-right" x1="500" y1="250" x2="600" y2="250" stroke="#1565c0" stroke-width="1.5" />

            <!-- 液面高度标注 h（双向箭头） -->
            <line x1="170" y1="350" x2="170" y2="250" stroke="#000000" stroke-width="1.5" marker-end="url(#scene1-arrowhead-black)" marker-start="url(#scene1-arrowhead-black)" />
            <text id="scene1-label-h" x="145" y="305" font-size="16" fill="#000000" text-anchor="middle">h</text>

            <!-- 质量标签 m（放在容器外侧，避免与容器多边形重叠） -->
            <text id="scene1-label-m-left" x="340" y="235" font-size="16" fill="#000000" text-anchor="middle">m</text>
            <text id="scene1-label-m-right" x="460" y="235" font-size="16" fill="#000000" text-anchor="middle">m</text>

            <!-- 速度箭头（灰色，淡化） -->
            <line id="scene1-arrow-v" x1="280" y1="180" x2="220" y2="180" stroke="#aaaaaa" stroke-width="1.5" marker-end="url(#scene1-arrowhead)" />
            <text id="scene1-label-v" x="250" y="170" font-size="14" fill="#aaaaaa" text-anchor="middle">v</text>

            <line id="scene1-arrow-2v" x1="580" y1="180" x2="520" y2="180" stroke="#aaaaaa" stroke-width="1.5" marker-end="url(#scene1-arrowhead)" />
            <text id="scene1-label-2v" x="550" y="170" font-size="14" fill="#aaaaaa" text-anchor="middle">2v</text>

            <!-- 拉力箭头（灰色，淡化） -->
            <line id="scene1-arrow-F1" x1="330" y1="300" x2="390" y2="300" stroke="#aaaaaa" stroke-width="1.5" marker-end="url(#scene1-arrowhead)" />
            <text id="scene1-label-F1" x="360" y="290" font-size="14" fill="#aaaaaa" text-anchor="middle">F₁</text>

            <line id="scene1-arrow-F2" x1="630" y1="300" x2="690" y2="300" stroke="#aaaaaa" stroke-width="1.5" marker-end="url(#scene1-arrowhead)" />
            <text id="scene1-label-F2" x="660" y="290" font-size="14" fill="#aaaaaa" text-anchor="middle">F₂</text>

            <!-- 体积辅助框（步骤1出现） -->
            <polygon id="scene1-volume-box-left" points="185,245 315,245 315,355 185,355" fill="#888888" fill-opacity="0.1" stroke="#888888" stroke-width="1" stroke-dasharray="5,3" style="display:none;opacity:0" />
            <polygon id="scene1-volume-box-right" points="475,245 625,245 625,355 475,355" fill="#888888" fill-opacity="0.1" stroke="#888888" stroke-width="1" stroke-dasharray="5,3" style="display:none;opacity:0" />

            <!-- 体积标签（步骤2出现） -->
            <text id="scene1-label-V1" x="150" y="385" font-size="16" fill="#000000" text-anchor="middle" style="display:none;opacity:0">V₁</text>
            <text id="scene1-label-V2" x="690" y="385" font-size="16" fill="#000000" text-anchor="middle" style="display:none;opacity:0">V₂</text>
            <text id="scene1-label-Vcompare" x="400" y="380" font-size="16" fill="#000000" text-anchor="middle" style="display:none;opacity:0">V₁ &lt; V₂</text>

            <!-- 公式（步骤2出现，纯文字无背景卡片，避免与文字重叠误报） -->
            <text id="scene1-formula-text" x="595" y="415" font-size="16" fill="#000000" text-anchor="middle" style="display:none;opacity:0">ρ = <tspan fill="#2e7d32" font-weight="bold">m</tspan> / V</text>

            <!-- 密度标签（步骤2出现，放在容器外侧避免重叠） -->
            <text id="scene1-label-rho1" x="340" y="325" font-size="16" fill="#000000" text-anchor="middle" style="display:none;opacity:0">ρ₁</text>
            <text id="scene1-label-rho2" x="460" y="325" font-size="16" fill="#000000" text-anchor="middle" style="display:none;opacity:0">ρ₂</text>

            <!-- 结论（步骤3出现） -->
            <text id="scene1-conclusion" x="400" y="450" font-size="18" fill="#2e7d32" text-anchor="middle" font-weight="bold" style="display:none;opacity:0">① ρ₁ &gt; ρ₂</text>
            <path id="scene1-checkmark" d="M 475 445 L 480 455 L 495 440" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="display:none;opacity:0" />
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/4</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const totalSteps = 4;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');

        const liquidLeft = document.getElementById('scene1-liquid-left');
        const liquidRight = document.getElementById('scene1-liquid-right');
        const volumeBoxLeft = document.getElementById('scene1-volume-box-left');
        const volumeBoxRight = document.getElementById('scene1-volume-box-right');
        const labelV1 = document.getElementById('scene1-label-V1');
        const labelV2 = document.getElementById('scene1-label-V2');
        const labelVcompare = document.getElementById('scene1-label-Vcompare');
        const formulaText = document.getElementById('scene1-formula-text');
        const labelRho1 = document.getElementById('scene1-label-rho1');
        const labelRho2 = document.getElementById('scene1-label-rho2');
        const conclusion = document.getElementById('scene1-conclusion');
        const checkmark = document.getElementById('scene1-checkmark');

        function show(el) {
            if (!el) return;
            el.style.display = '';
            requestAnimationFrame(function() {
                el.style.transition = 'opacity 300ms ease';
                el.style.opacity = '1';
            });
        }

        function hide(el) {
            if (!el) return;
            el.style.transition = 'opacity 200ms ease';
            el.style.opacity = '0';
            setTimeout(function() {
                if (el.style.opacity === '0') {
                    el.style.display = 'none';
                }
            }, 200);
        }

        function renderStep() {
            stepIndicator.textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps - 1);

            if (currentStep >= 1) {
                liquidLeft.setAttribute('fill-opacity', '0.35');
                liquidRight.setAttribute('fill-opacity', '0.35');
                liquidLeft.setAttribute('stroke-width', '2');
                liquidRight.setAttribute('stroke-width', '2');
            } else {
                liquidLeft.setAttribute('fill-opacity', '0.2');
                liquidRight.setAttribute('fill-opacity', '0.2');
                liquidLeft.setAttribute('stroke-width', '1.5');
                liquidRight.setAttribute('stroke-width', '1.5');
            }

            if (currentStep >= 1) {
                show(volumeBoxLeft);
                show(volumeBoxRight);
            } else {
                hide(volumeBoxLeft);
                hide(volumeBoxRight);
            }

            if (currentStep >= 2) {
                show(labelV1);
                show(labelV2);
                show(labelVcompare);
                show(formulaText);
                show(labelRho1);
                show(labelRho2);
            } else {
                hide(labelV1);
                hide(labelV2);
                hide(labelVcompare);
                hide(formulaText);
                hide(labelRho1);
                hide(labelRho2);
            }

            if (currentStep >= 3) {
                show(conclusion);
                show(checkmark);
            } else {
                hide(conclusion);
                hide(checkmark);
            }
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                renderStep();
            }
        });

        renderStep();
    })();
    </script>
</body>
</html>
