<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极地投影图的综合判读</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            padding: 6px 16px; font-size: 14px; cursor: pointer;
            border: 1px solid #ccc; border-radius: 4px; background: #f5f5f5;
        }
        #scene1-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 14px; color: #333; min-width: 70px; text-align: center; }

        /* 步骤元素显隐控制 */
        .scene1-hidden { display: none; }

        /* 高亮过渡 */
        .scene1-highlight { transition: stroke 0.3s ease, stroke-width 0.3s ease, fill 0.3s ease, r 0.3s ease; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 定义 -->
            <defs>
                <marker id="scene1-arrowhead-ccw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#000"/>
                </marker>
                <marker id="scene1-arrowhead-cw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#000"/>
                </marker>
                <marker id="scene1-arrowhead-ccw-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#1565c0"/>
                </marker>
                <marker id="scene1-arrowhead-cw-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#2e7d32"/>
                </marker>
            </defs>

            <!-- 标题 -->
            <text id="scene1-title-north" x="200" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">北极俯视图（逆时针）</text>
            <text id="scene1-title-south" x="600" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">南极俯视图（顺时针）</text>

            <!-- ===== 左图：北极俯视图 ===== -->
            <g id="scene1-map-north">
                <!-- 同心圆 -->
                <circle cx="200" cy="180" r="110" fill="none" stroke="#000" stroke-width="1"/>
                <circle cx="200" cy="180" r="65" fill="none" stroke="#000" stroke-width="1"/>
                <circle cx="200" cy="180" r="20" fill="none" stroke="#000" stroke-width="1"/>

                <!-- 8条经线 -->
                <line x1="200" y1="180" x2="200" y2="70" stroke="#000" stroke-width="1"/>
                <line x1="200" y1="180" x2="278" y2="102" stroke="#000" stroke-width="1"/>
                <line x1="200" y1="180" x2="310" y2="180" stroke="#000" stroke-width="1"/>
                <line x1="200" y1="180" x2="278" y2="258" stroke="#000" stroke-width="1"/>
                <line x1="200" y1="180" x2="200" y2="290" stroke="#000" stroke-width="1"/>
                <line x1="200" y1="180" x2="122" y2="258" stroke="#000" stroke-width="1"/>
                <line x1="200" y1="180" x2="90" y2="180" stroke="#000" stroke-width="1"/>
                <line x1="200" y1="180" x2="122" y2="102" stroke="#000" stroke-width="1"/>

                <!-- 自转箭头（逆时针） -->
                <path id="scene1-arrow-north" class="scene1-highlight"
                      d="M 80,130 A 130,130 0 0,1 80,230"
                      fill="none" stroke="#000" stroke-width="1.5"
                      marker-end="url(#scene1-arrowhead-ccw)"/>

                <!-- A点 -->
                <circle id="scene1-point-a" class="scene1-highlight" cx="154" cy="134" r="4" fill="#000" stroke="none"/>
                <!-- A标签移到左外侧，避免与图形bbox重叠 -->
                <text id="scene1-label-a" x="80" y="100" text-anchor="middle" font-size="14" fill="#000">A</text>

                <!-- 基础标注 -->
                <text id="scene1-label-0-north" x="200" y="305" text-anchor="middle" font-size="14" fill="#000">0°</text>
                <text id="scene1-label-180-north" x="200" y="80" text-anchor="middle" font-size="14" fill="#000">180°</text>
                <text id="scene1-rotation-north" x="70" y="180" text-anchor="middle" font-size="12" fill="#000">地球自转方向</text>
            </g>

            <!-- ===== 右图：南极俯视图 ===== -->
            <g id="scene1-map-south">
                <!-- 同心圆 -->
                <circle cx="600" cy="180" r="110" fill="none" stroke="#000" stroke-width="1"/>
                <circle cx="600" cy="180" r="65" fill="none" stroke="#000" stroke-width="1"/>
                <circle cx="600" cy="180" r="20" fill="none" stroke="#000" stroke-width="1"/>

                <!-- 8条经线 -->
                <line x1="600" y1="180" x2="600" y2="70" stroke="#000" stroke-width="1"/>
                <line x1="600" y1="180" x2="678" y2="102" stroke="#000" stroke-width="1"/>
                <line x1="600" y1="180" x2="710" y2="180" stroke="#000" stroke-width="1"/>
                <line x1="600" y1="180" x2="678" y2="258" stroke="#000" stroke-width="1"/>
                <line x1="600" y1="180" x2="600" y2="290" stroke="#000" stroke-width="1"/>
                <line x1="600" y1="180" x2="522" y2="258" stroke="#000" stroke-width="1"/>
                <line x1="600" y1="180" x2="490" y2="180" stroke="#000" stroke-width="1"/>
                <line x1="600" y1="180" x2="522" y2="102" stroke="#000" stroke-width="1"/>

                <!-- 自转箭头（顺时针） -->
                <path id="scene1-arrow-south" class="scene1-highlight"
                      d="M 480,230 A 130,130 0 0,1 480,130"
                      fill="none" stroke="#000" stroke-width="1.5"
                      marker-end="url(#scene1-arrowhead-cw)"/>

                <!-- B点 -->
                <circle id="scene1-point-b" class="scene1-highlight" cx="646" cy="226" r="4" fill="#000" stroke="none"/>
                <!-- B标签移到右外侧，避免与图形bbox重叠 -->
                <text id="scene1-label-b" x="720" y="205" text-anchor="start" font-size="14" fill="#000">B</text>

                <!-- 基础标注 -->
                <text id="scene1-label-0-south" x="600" y="305" text-anchor="middle" font-size="14" fill="#000">0°</text>
                <text id="scene1-label-180-south" x="600" y="80" text-anchor="middle" font-size="14" fill="#000">180°</text>
                <text id="scene1-rotation-south" x="470" y="180" text-anchor="middle" font-size="12" fill="#000">地球自转方向</text>
            </g>

            <!-- ===== 步骤1元素：南北极判断 ===== -->
            <g id="scene1-step-1" class="scene1-hidden">
                <text id="scene1-pole-north" x="200" y="80" text-anchor="middle" font-size="14" fill="#1565c0" font-weight="bold">北极（北半球）</text>
                <text id="scene1-pole-south" x="600" y="80" text-anchor="middle" font-size="14" fill="#2e7d32" font-weight="bold">南极（南半球）</text>
            </g>

            <!-- ===== 步骤2元素：南北半球判断 ===== -->
            <g id="scene1-step-2" class="scene1-hidden">
                <text id="scene1-hemi-north" x="120" y="100" text-anchor="middle" font-size="14" fill="#1565c0" font-weight="bold">北半球</text>
                <text id="scene1-hemi-south" x="680" y="260" text-anchor="middle" font-size="14" fill="#2e7d32" font-weight="bold">南半球</text>
                <!-- 选项C对勾 -->
                <text id="scene1-mark-c" x="35" y="410" font-size="18" fill="#2e7d32" font-weight="bold">✓</text>
            </g>

            <!-- ===== 步骤3元素：经度判读 ===== -->
            <g id="scene1-step-3" class="scene1-hidden">
                <!-- 左图经线标注（从0°开始逆时针，北极为逆时针，所以0°下方，向东逆时针） -->
                <text x="200" y="320" text-anchor="middle" font-size="12" fill="#1565c0">0°</text>
                <text x="285" y="265" text-anchor="start" font-size="12" fill="#1565c0">45°E</text>
                <text x="320" y="185" text-anchor="start" font-size="12" fill="#1565c0">90°E</text>
                <text x="285" y="105" text-anchor="start" font-size="12" fill="#1565c0">135°E</text>
                <text x="200" y="80" text-anchor="middle" font-size="12" fill="#1565c0">180°</text>
                <text x="115" y="105" text-anchor="end" font-size="12" fill="#2e7d32">135°W</text>
                <text x="80" y="185" text-anchor="end" font-size="12" fill="#2e7d32">90°W</text>
                <text x="115" y="265" text-anchor="end" font-size="12" fill="#2e7d32">45°W</text>

                <!-- 右图经线标注（南极顺时针，0°下方，顺时针为东经） -->
                <text x="600" y="320" text-anchor="middle" font-size="12" fill="#1565c0">0°</text>
                <text x="685" y="265" text-anchor="start" font-size="12" fill="#2e7d32">45°W</text>
                <text x="720" y="185" text-anchor="start" font-size="12" fill="#2e7d32">90°W</text>
                <text x="685" y="105" text-anchor="start" font-size="12" fill="#2e7d32">135°W</text>
                <text x="600" y="80" text-anchor="middle" font-size="12" fill="#1565c0">180°</text>
                <text x="515" y="105" text-anchor="end" font-size="12" fill="#1565c0">135°E</text>
                <text x="480" y="185" text-anchor="end" font-size="12" fill="#1565c0">90°E</text>
                <text x="515" y="265" text-anchor="end" font-size="12" fill="#1565c0">45°E</text>

                <!-- A点经度 -->
                <text id="scene1-lon-a" x="120" y="145" text-anchor="middle" font-size="13" fill="#1565c0" font-weight="bold">135°W</text>
                <!-- B点经度 -->
                <text id="scene1-lon-b" x="665" y="240" text-anchor="start" font-size="13" fill="#2e7d32" font-weight="bold">45°W</text>
            </g>

            <!-- ===== 步骤4元素：东西半球划分 ===== -->
            <g id="scene1-step-4" class="scene1-hidden">
                <!-- 20°W虚线弧（左图） -->
                <path d="M 200,180 L 290,258" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" fill="none"/>
                <!-- 160°E虚线弧（左图） -->
                <path d="M 200,180 L 110,258" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" fill="none"/>
                <!-- 20°W虚线弧（右图） -->
                <path d="M 600,180 L 510,258" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" fill="none"/>
                <!-- 160°E虚线弧（右图） -->
                <path d="M 600,180 L 690,258" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" fill="none"/>

                <text x="290" y="270" text-anchor="middle" font-size="12" fill="#888">20°W</text>
                <text x="110" y="270" text-anchor="middle" font-size="12" fill="#888">160°E</text>
                <text x="510" y="270" text-anchor="middle" font-size="12" fill="#888">160°E</text>
                <text x="690" y="270" text-anchor="middle" font-size="12" fill="#888">20°W</text>

                <text x="150" y="100" text-anchor="middle" font-size="14" fill="#1565c0" font-weight="bold">东半球</text>
                <text x="250" y="100" text-anchor="middle" font-size="14" fill="#c62828" font-weight="bold">西半球</text>
                <text x="550" y="100" text-anchor="middle" font-size="14" fill="#1565c0" font-weight="bold">东半球</text>
                <text x="650" y="100" text-anchor="middle" font-size="14" fill="#c62828" font-weight="bold">西半球</text>

                <!-- 选项D叉号 -->
                <text id="scene1-mark-d" x="35" y="445" font-size="18" fill="#c62828" font-weight="bold">✗</text>
            </g>

            <!-- ===== 步骤5元素：纬度与太阳直射 ===== -->
            <g id="scene1-step-5" class="scene1-hidden">
                <text x="265" y="125" text-anchor="start" font-size="13" fill="#000">45°N</text>
                <text x="535" y="235" text-anchor="end" font-size="13" fill="#000">45°S</text>
                <text x="320" y="295" text-anchor="start" font-size="13" fill="#000">赤道</text>
                <text x="680" y="295" text-anchor="start" font-size="13" fill="#000">赤道</text>

                <!-- 太阳直射带（赤道到23.5°之间） -->
                <!-- 23.5°对应的半径 = 110 - (23.5/90)*(110-20) ≈ 110 - 23.5 = 86.5，取约87 -->
                <path d="M 200,93 A 87,87 0 0,1 200,267 A 87,87 0 0,1 200,93 M 200,110 A 110,110 0 0,0 200,250 A 110,110 0 0,0 200,110"
                      fill="#ffeb3b" fill-opacity="0.2" fill-rule="evenodd" stroke="none"/>
                <path d="M 600,93 A 87,87 0 0,1 600,267 A 87,87 0 0,1 600,93 M 600,110 A 110,110 0 0,0 600,250 A 110,110 0 0,0 600,110"
                      fill="#ffeb3b" fill-opacity="0.2" fill-rule="evenodd" stroke="none"/>

                <text x="400" y="310" text-anchor="middle" font-size="13" fill="#666">太阳直射范围：23.5°N — 23.5°S</text>

                <!-- 选项A、B叉号 -->
                <text id="scene1-mark-a" x="35" y="340" font-size="18" fill="#c62828" font-weight="bold">✗</text>
                <text id="scene1-mark-b" x="35" y="375" font-size="18" fill="#c62828" font-weight="bold">✗</text>
            </g>

            <!-- ===== 步骤6元素：总结 ===== -->
            <g id="scene1-step-6" class="scene1-hidden">
                <text x="50" y="330" font-size="13" fill="#333">
                    <tspan x="50" dy="0">判读口诀：</tspan>
                    <tspan x="50" dy="18">①北逆南顺定极点</tspan>
                    <tspan x="50" dy="18">②自转方向定东西</tspan>
                    <tspan x="50" dy="18">③20°W-160°E分东西半球</tspan>
                    <tspan x="50" dy="18">④回归线之间有直射</tspan>
                </text>
            </g>

            <!-- ===== 选项区（始终显示） ===== -->
            <g id="scene1-options">
                <text id="scene1-option-a" x="55" y="340" font-size="15" fill="#000">A. A点一年只有一次太阳直射</text>
                <text id="scene1-option-b" x="55" y="375" font-size="15" fill="#000">B. B点一年可能有两次直射现象</text>
                <text id="scene1-option-c" x="55" y="410" font-size="15" fill="#000">C. 从南北半球位置看，B点在南半球</text>
                <text id="scene1-option-d" x="55" y="445" font-size="15" fill="#000">D. 从东西半球位置看，A点在东半球，B点在西半球</text>
            </g>
        </svg>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 0/6</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        let currentStep = 0;
        const totalSteps = 6;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');

        const arrowNorth = document.getElementById('scene1-arrow-north');
        const arrowSouth = document.getElementById('scene1-arrow-south');
        const pointA = document.getElementById('scene1-point-a');
        const pointB = document.getElementById('scene1-point-b');

        function show(el) {
            if (!el) return;
            el.style.display = '';
            el.style.opacity = '1';
        }
        function hide(el) {
            if (!el) return;
            el.style.display = 'none';
            el.style.opacity = '0';
        }

        function renderStep() {
            // 更新指示器
            stepIndicator.textContent = '步骤 ' + currentStep + '/' + totalSteps;
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps;

            // 重置高亮
            arrowNorth.setAttribute('stroke', '#000');
            arrowNorth.setAttribute('stroke-width', '1.5');
            arrowNorth.setAttribute('marker-end', 'url(#scene1-arrowhead-ccw)');
            arrowSouth.setAttribute('stroke', '#000');
            arrowSouth.setAttribute('stroke-width', '1.5');
            arrowSouth.setAttribute('marker-end', 'url(#scene1-arrowhead-cw)');
            pointA.setAttribute('fill', '#000');
            pointA.setAttribute('r', '4');
            pointB.setAttribute('fill', '#000');
            pointB.setAttribute('r', '4');

            // 隐藏所有步骤组
            for (let i = 1; i <= totalSteps; i++) {
                const g = document.getElementById('scene1-step-' + i);
                if (g) hide(g);
            }

            // 步骤0：基础状态，无额外高亮
            if (currentStep >= 1) {
                // 步骤1：南北极判断
                show(document.getElementById('scene1-step-1'));
                arrowNorth.setAttribute('stroke', '#1565c0');
                arrowNorth.setAttribute('stroke-width', '3');
                arrowNorth.setAttribute('marker-end', 'url(#scene1-arrowhead-ccw-blue)');
                arrowSouth.setAttribute('stroke', '#2e7d32');
                arrowSouth.setAttribute('stroke-width', '3');
                arrowSouth.setAttribute('marker-end', 'url(#scene1-arrowhead-cw-green)');
            }

            if (currentStep >= 2) {
                show(document.getElementById('scene1-step-2'));
                pointA.setAttribute('fill', '#1565c0');
                pointA.setAttribute('r', '6');
                pointB.setAttribute('fill', '#2e7d32');
                pointB.setAttribute('r', '6');
            }

            if (currentStep >= 3) {
                show(document.getElementById('scene1-step-3'));
            }

            if (currentStep >= 4) {
                show(document.getElementById('scene1-step-4'));
            }

            if (currentStep >= 5) {
                show(document.getElementById('scene1-step-5'));
            }

            if (currentStep >= 6) {
                show(document.getElementById('scene1-step-6'));
            }
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                renderStep();
            }
        });

        // 初始化
        renderStep();
    })();
    </script>
</body>
</html>
