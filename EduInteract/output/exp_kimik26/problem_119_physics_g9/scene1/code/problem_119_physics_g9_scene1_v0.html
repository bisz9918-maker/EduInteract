<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动态电路分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-panel { position: absolute; left: 500px; top: 50px; width: 280px; height: 370px; background: #f5f5f5; border-radius: 8px; padding: 16px; box-sizing: border-box; }
        #scene1-panel-title { font-size: 16px; font-weight: bold; color: #333; margin-bottom: 12px; }
        #scene1-panel-content { font-size: 14px; color: #555; line-height: 1.6; }
        .scene1-btn { padding: 6px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: #fff; }
        .scene1-btn:hover { background: #e0e0e0; }
        .scene1-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .scene1-dot { width: 12px; height: 12px; border-radius: 50%; background: #bdbdbd; cursor: pointer; display: inline-block; margin: 0 4px; }
        .scene1-dot.active { background: #1565c0; }
        /* 公式框 HTML 覆盖层 */
        #scene1-formula-overlay { position: absolute; left: 420px; top: 170px; width: 140px; background: #e3f2fd; border: 1.5px solid #1565c0; border-radius: 4px; padding: 10px; font-size: 13px; color: #000; line-height: 1.8; opacity: 0; transition: opacity 0.5s ease; z-index: 5; }
        /* 结论文字 HTML 覆盖层 */
        #scene1-conclusion-overlay { position: absolute; left: 200px; top: 335px; font-size: 20px; color: #2e7d32; font-weight: bold; opacity: 0; transition: opacity 0.5s ease; z-index: 5; }
        /* SVG transitions */
        .scene1-transition { transition: all 0.5s ease; }
        .scene1-fade { transition: opacity 0.5s ease; }
        .scene1-glow-transition { transition: opacity 0.8s ease; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <!-- SVG 图示区：固定 800×500px -->
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <defs>
                <!-- 箭头标记 -->
                <marker id="scene1-arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#1565c0"/>
                </marker>
                <marker id="scene1-arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#c62828"/>
                </marker>
            </defs>

            <!-- 导线 -->
            <!-- 上方导线 (120,60)-(360,60) -->
            <line id="scene1-wire-top" x1="120" y1="60" x2="360" y2="60" stroke="#000000" stroke-width="2.5"/>
            <!-- 左侧竖线 (120,60)-(120,260) -->
            <line id="scene1-wire-left" x1="120" y1="60" x2="120" y2="260" stroke="#000000" stroke-width="2.5"/>
            <!-- 右侧竖线 (360,60)-(360,260) -->
            <line id="scene1-wire-right" x1="360" y1="60" x2="360" y2="260" stroke="#000000" stroke-width="2.5"/>
            <!-- 上支路左段 (120,140)-(210,140) -->
            <line id="scene1-wire-upper-left" x1="120" y1="140" x2="210" y2="140" stroke="#000000" stroke-width="2.5"/>
            <!-- 上支路右段 (260,140)-(360,140) -->
            <line id="scene1-wire-upper-right" x1="260" y1="140" x2="360" y2="140" stroke="#000000" stroke-width="2.5"/>
            <!-- 下支路导线 (120,260)-(360,260) -->
            <line id="scene1-wire-lower" x1="120" y1="260" x2="360" y2="260" stroke="#000000" stroke-width="2.5"/>
            <!-- 电源连接横线 (360,60)-(380,60) -->
            <line id="scene1-wire-power-conn" x1="360" y1="60" x2="380" y2="60" stroke="#000000" stroke-width="2.5"/>

            <!-- 电源 -->
            <!-- 正极长线 (380,35)-(380,60) -->
            <line id="scene1-power-pos" x1="380" y1="35" x2="380" y2="60" stroke="#000000" stroke-width="2.5"/>
            <!-- 负极短线 (360,40)-(360,60) -->
            <line id="scene1-power-neg" x1="360" y1="40" x2="360" y2="60" stroke="#000000" stroke-width="2.5"/>
            <!-- 电源标签 -->
            <text id="scene1-label-plus" x="390" y="48" font-size="14" fill="#000000">+</text>
            <text id="scene1-label-minus" x="345" y="48" font-size="14" fill="#000000">−</text>

            <!-- 开关 S -->
            <g id="scene1-switch-group">
                <!-- 开关触点 -->
                <circle cx="120" cy="60" r="3" fill="#000000"/>
                <!-- 闸刀 -->
                <line id="scene1-switch-blade" x1="120" y1="60" x2="140" y2="50" stroke="#000000" stroke-width="2.5"/>
                <!-- 开关标签 -->
                <text id="scene1-label-s" x="120" y="45" font-size="14" fill="#000000" text-anchor="middle">S</text>
            </g>

            <!-- 滑动变阻器 -->
            <g id="scene1-rheostat-group">
                <!-- 外框 (150,125)-(270,155) -->
                <rect id="scene1-rheostat-box" x="150" y="125" width="120" height="30" fill="none" stroke="#000000" stroke-width="2"/>
                <!-- 电阻丝 (160,140)-(260,140) -->
                <line id="scene1-rheostat-wire" x1="160" y1="140" x2="260" y2="140" stroke="#795548" stroke-width="3"/>
                <!-- 滑片 P -->
                <g id="scene1-slider-p" class="scene1-transition">
                    <line x1="210" y1="105" x2="210" y2="140" stroke="#000000" stroke-width="2"/>
                    <polygon points="205,105 215,105 210,95" fill="#000000"/>
                    <circle cx="210" cy="140" r="3" fill="#000000"/>
                </g>
                <!-- 滑片标签 -->
                <text id="scene1-label-p" x="210" y="85" font-size="14" fill="#000000" text-anchor="middle" class="scene1-transition">P</text>
                <!-- 接入段高亮（初始 P到右端） -->
                <line id="scene1-rheostat-highlight" x1="210" y1="140" x2="260" y2="140" stroke="#f57c00" stroke-width="4" opacity="0"/>
            </g>

            <!-- L₂ 灯泡 -->
            <g id="scene1-lamp-l2-group">
                <!-- 光晕 -->
                <circle id="scene1-l2-glow" cx="330" cy="140" r="30" fill="#ffeb3b" opacity="0.3" class="scene1-glow-transition"/>
                <!-- 外框 -->
                <circle id="scene1-l2-circle" cx="330" cy="140" r="18" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                <!-- 灯丝 -->
                <polyline id="scene1-l2-filament" points="322,140 330,132 338,140" fill="none" stroke="#c62828" stroke-width="2"/>
                <!-- 标签 -->
                <text id="scene1-label-l2" x="330" y="110" font-size="14" fill="#000000" text-anchor="middle">L₂</text>
            </g>

            <!-- L₁ 灯泡 -->
            <g id="scene1-lamp-l1-group">
                <!-- 光晕 -->
                <circle id="scene1-l1-glow" cx="330" cy="260" r="30" fill="#ffeb3b" opacity="0.3" class="scene1-glow-transition"/>
                <!-- 外框 -->
                <circle id="scene1-l1-circle" cx="330" cy="260" r="18" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                <!-- 灯丝 -->
                <polyline id="scene1-l1-filament" points="322,260 330,252 338,260" fill="none" stroke="#c62828" stroke-width="2"/>
                <!-- 标签 -->
                <text id="scene1-label-l1" x="330" y="315" font-size="14" fill="#000000" text-anchor="middle">L₁</text>
            </g>

            <!-- 电流箭头（步骤1出现） -->
            <!-- L₁支路蓝色箭头 (160,260)-(280,260) -->
            <line id="scene1-arrow-l1" x1="160" y1="260" x2="280" y2="260" stroke="#1565c0" stroke-width="4" marker-end="url(#scene1-arrow-blue)" opacity="0" class="scene1-fade"/>
            <!-- L₂支路红色箭头 (160,140)-(280,140) -->
            <line id="scene1-arrow-l2" x1="160" y1="140" x2="280" y2="140" stroke="#c62828" stroke-width="4" marker-end="url(#scene1-arrow-red)" opacity="0" class="scene1-fade"/>

            <!-- 电流标签（步骤1出现） -->
            <text id="scene1-label-i1" x="220" y="275" font-size="14" fill="#1565c0" opacity="0" class="scene1-fade">I₁</text>
            <text id="scene1-label-i2" x="190" y="125" font-size="14" fill="#c62828" opacity="0" class="scene1-fade">I₂</text>

            <!-- R变标签（步骤2出现） -->
            <text id="scene1-label-r" x="235" y="170" font-size="14" fill="#f57c00" opacity="0" class="scene1-fade">R变↓</text>

            <!-- 公式引线（SVG中保留，指向公式框） -->
            <line id="scene1-formula-lead" x1="420" y1="220" x2="400" y2="220" stroke="#888888" stroke-width="1" stroke-dasharray="4,2" opacity="0" class="scene1-fade"/>
        </svg>

        <!-- 公式框 HTML 覆盖层 -->
        <div id="scene1-formula-overlay">
            <div id="scene1-formula-content">U₁ = U电源<br>P₁ = U₁² / R₁</div>
        </div>

        <!-- 结论文字 HTML 覆盖层 -->
        <div id="scene1-conclusion-overlay">灯L₂变亮，灯L₁亮度不变</div>

        <!-- 右侧面板 -->
        <div id="scene1-panel">
            <div id="scene1-panel-title">分析面板</div>
            <div id="scene1-panel-content">请观察电路，判断各元件连接方式</div>
        </div>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn">◀ 上一步</button>
            <div id="scene1-dots">
                <span class="scene1-dot active" data-step="0"></span>
                <span class="scene1-dot" data-step="1"></span>
                <span class="scene1-dot" data-step="2"></span>
                <span class="scene1-dot" data-step="3"></span>
                <span class="scene1-dot" data-step="4"></span>
                <span class="scene1-dot" data-step="5"></span>
            </div>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        let currentStep = 0;
        const totalSteps = 6;

        // 获取元素
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const dots = document.querySelectorAll('.scene1-dot');
        const panelContent = document.getElementById('scene1-panel-content');

        // SVG 元素
        const sliderP = document.getElementById('scene1-slider-p');
        const labelP = document.getElementById('scene1-label-p');
        const rheostatHighlight = document.getElementById('scene1-rheostat-highlight');
        const arrowL1 = document.getElementById('scene1-arrow-l1');
        const arrowL2 = document.getElementById('scene1-arrow-l2');
        const labelI1 = document.getElementById('scene1-label-i1');
        const labelI2 = document.getElementById('scene1-label-i2');
        const labelR = document.getElementById('scene1-label-r');
        const formulaLead = document.getElementById('scene1-formula-lead');
        const l1Glow = document.getElementById('scene1-l1-glow');
        const l2Glow = document.getElementById('scene1-l2-glow');
        const l1Group = document.getElementById('scene1-lamp-l1-group');
        const l2Group = document.getElementById('scene1-lamp-l2-group');
        const rheostatGroup = document.getElementById('scene1-rheostat-group');

        // HTML 覆盖层
        const formulaOverlay = document.getElementById('scene1-formula-overlay');
        const formulaContent = document.getElementById('scene1-formula-content');
        const conclusionOverlay = document.getElementById('scene1-conclusion-overlay');

        // 面板内容
        const panelTexts = [
            "请观察电路，判断各元件连接方式",
            "L₁单独一条支路；L₂与滑动变阻器串联后构成另一条支路；两支路并联",
            "滑片P向右滑动 → 接入电阻丝变短 → 接入电阻减小",
            "并联电路：各支路电压 = 电源电压；L₁电阻不变 → 功率不变 → 亮度不变",
            "R变减小 → 支路总电阻减小 → 电流增大 → L₂实际功率增大 → L₂变亮",
            "正确答案：B"
        ];

        // 公式内容
        const formulaContents = [
            "U₁ = U电源<br>P₁ = U₁² / R₁",
            "R总 = R变 + R_L₂ ↓<br>I₂ = U / R总 ↑<br>P₂ = I₂²·R_L₂ ↑"
        ];

        function updateButtons() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps - 1;
            dots.forEach((dot, idx) => {
                dot.classList.toggle('active', idx === currentStep);
            });
        }

        function setOpacity(el, val) {
            if (el) el.style.opacity = val;
        }

        function renderStep() {
            panelContent.textContent = panelTexts[currentStep];
            updateButtons();

            // 步骤0：初始状态
            if (currentStep === 0) {
                setOpacity(arrowL1, '0');
                setOpacity(arrowL2, '0');
                setOpacity(labelI1, '0');
                setOpacity(labelI2, '0');
                setOpacity(labelR, '0');
                setOpacity(formulaLead, '0');
                setOpacity(formulaOverlay, '0');
                setOpacity(conclusionOverlay, '0');
                setOpacity(rheostatHighlight, '0');
                sliderP.style.transform = 'translate(0,0)';
                labelP.style.transform = 'translate(0,0)';
                rheostatHighlight.setAttribute('x1', '210');
                l1Glow.style.opacity = '0.3';
                l2Glow.style.opacity = '0.3';
                l1Group.style.opacity = '1';
                l2Group.style.opacity = '1';
                rheostatGroup.style.opacity = '1';
                panelContent.style.color = '#555';
                panelContent.style.fontWeight = 'normal';
            }

            // 步骤1：电流路径
            if (currentStep === 1) {
                setOpacity(arrowL1, '1');
                setOpacity(arrowL2, '1');
                setOpacity(labelI1, '1');
                setOpacity(labelI2, '1');
                setOpacity(labelR, '0');
                setOpacity(formulaLead, '0');
                setOpacity(formulaOverlay, '0');
                setOpacity(conclusionOverlay, '0');
                setOpacity(rheostatHighlight, '0');
                sliderP.style.transform = 'translate(0,0)';
                labelP.style.transform = 'translate(0,0)';
                rheostatHighlight.setAttribute('x1', '210');
                l1Glow.style.opacity = '0.3';
                l2Glow.style.opacity = '0.3';
                l1Group.style.opacity = '1';
                l2Group.style.opacity = '1';
                rheostatGroup.style.opacity = '1';
                panelContent.style.color = '#555';
                panelContent.style.fontWeight = 'normal';
            }

            // 步骤2：滑片移动
            if (currentStep === 2) {
                setOpacity(arrowL1, '1');
                setOpacity(arrowL2, '1');
                setOpacity(labelI1, '1');
                setOpacity(labelI2, '1');
                setOpacity(labelR, '1');
                setOpacity(formulaLead, '0');
                setOpacity(formulaOverlay, '0');
                setOpacity(conclusionOverlay, '0');
                setOpacity(rheostatHighlight, '1');
                sliderP.style.transform = 'translate(40px,0)';
                labelP.style.transform = 'translate(40px,0)';
                rheostatHighlight.setAttribute('x1', '250');
                l1Glow.style.opacity = '0.3';
                l2Glow.style.opacity = '0.3';
                l1Group.style.opacity = '1';
                l2Group.style.opacity = '1';
                rheostatGroup.style.opacity = '1';
                panelContent.style.color = '#555';
                panelContent.style.fontWeight = 'normal';
            }

            // 步骤3：L₁支路分析
            if (currentStep === 3) {
                setOpacity(arrowL1, '1');
                setOpacity(arrowL2, '0');
                setOpacity(labelI1, '1');
                setOpacity(labelI2, '0');
                setOpacity(labelR, '0');
                setOpacity(formulaLead, '1');
                setOpacity(formulaOverlay, '1');
                setOpacity(conclusionOverlay, '0');
                setOpacity(rheostatHighlight, '0');
                sliderP.style.transform = 'translate(40px,0)';
                labelP.style.transform = 'translate(40px,0)';
                rheostatHighlight.setAttribute('x1', '250');
                l1Glow.style.opacity = '0.3';
                l2Glow.style.opacity = '0.3';
                l1Group.style.opacity = '1';
                l2Group.style.opacity = '0.3';
                rheostatGroup.style.opacity = '0.3';
                formulaContent.innerHTML = formulaContents[0];
                formulaLead.setAttribute('y1', '220');
                formulaLead.setAttribute('y2', '220');
                panelContent.style.color = '#555';
                panelContent.style.fontWeight = 'normal';
            }

            // 步骤4：L₂支路分析
            if (currentStep === 4) {
                setOpacity(arrowL1, '0');
                setOpacity(arrowL2, '1');
                setOpacity(labelI1, '0');
                setOpacity(labelI2, '1');
                setOpacity(labelR, '0');
                setOpacity(formulaLead, '1');
                setOpacity(formulaOverlay, '1');
                setOpacity(conclusionOverlay, '0');
                setOpacity(rheostatHighlight, '0');
                sliderP.style.transform = 'translate(40px,0)';
                labelP.style.transform = 'translate(40px,0)';
                rheostatHighlight.setAttribute('x1', '250');
                l1Glow.style.opacity = '0.3';
                l2Glow.style.opacity = '0.6';
                l1Group.style.opacity = '0.3';
                l2Group.style.opacity = '1';
                rheostatGroup.style.opacity = '1';
                formulaContent.innerHTML = formulaContents[1];
                formulaLead.setAttribute('y1', '140');
                formulaLead.setAttribute('y2', '140');
                panelContent.style.color = '#555';
                panelContent.style.fontWeight = 'normal';
            }

            // 步骤5：得出结论
            if (currentStep === 5) {
                setOpacity(arrowL1, '1');
                setOpacity(arrowL2, '1');
                setOpacity(labelI1, '1');
                setOpacity(labelI2, '1');
                setOpacity(labelR, '0');
                setOpacity(formulaLead, '0');
                setOpacity(formulaOverlay, '0');
                setOpacity(conclusionOverlay, '1');
                setOpacity(rheostatHighlight, '0');
                sliderP.style.transform = 'translate(40px,0)';
                labelP.style.transform = 'translate(40px,0)';
                rheostatHighlight.setAttribute('x1', '250');
                l1Glow.style.opacity = '0.3';
                l2Glow.style.opacity = '0.6';
                l1Group.style.opacity = '1';
                l2Group.style.opacity = '1';
                rheostatGroup.style.opacity = '1';
                panelContent.style.color = '#2e7d32';
                panelContent.style.fontWeight = 'bold';
            }
        }

        function updateStep(delta) {
            const newStep = currentStep + delta;
            if (newStep >= 0 && newStep < totalSteps) {
                currentStep = newStep;
                renderStep();
            }
        }

        function goToStep(index) {
            if (index >= 0 && index < totalSteps) {
                currentStep = index;
                renderStep();
            }
        }

        // 事件绑定
        btnPrev.addEventListener('click', () => updateStep(-1));
        btnNext.addEventListener('click', () => updateStep(1));
        dots.forEach(dot => {
            dot.addEventListener('click', () => {
                const step = parseInt(dot.getAttribute('data-step'));
                goToStep(step);
            });
        });

        // 初始化
        renderStep();
    })();
    </script>
</body>
</html>
