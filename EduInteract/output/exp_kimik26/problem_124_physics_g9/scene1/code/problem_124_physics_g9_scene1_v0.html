<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电磁铁与永磁体磁极判断</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "SimHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        .scene1-btn { padding: 6px 16px; font-size: 14px; border: 1px solid #333; border-radius: 4px; background: #f5f5f5; cursor: pointer; }
        .scene1-btn:hover { background: #e0e0e0; }
        .scene1-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500" style="position:absolute; top:0; left:0;">
            <defs>
                <!-- 箭头标记 -->
                <marker id="scene1-arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0"/>
                </marker>
                <marker id="scene1-arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#c62828"/>
                </marker>
                <marker id="scene1-arrowhead-black" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
                </marker>
            </defs>

            <!-- 导线（在底层） -->
            <g id="scene1-wires">
                <!-- 导线1：正极→螺线管下端 -->
                <path id="scene1-wire1" d="M120,315 L120,325 L80,325 L80,255 L190,255 L190,205" fill="none" stroke="#000000" stroke-width="1.5"/>
                <!-- 导线2：螺线管上端→负极 -->
                <path id="scene1-wire2" d="M190,155 L190,140 L120,140 L120,315" fill="none" stroke="#000000" stroke-width="1.5"/>
            </g>

            <!-- 开关 -->
            <g id="scene1-switch">
                <line x1="70" y1="270" x2="80" y2="270" stroke="#000000" stroke-width="1.5"/>
                <line x1="80" y1="270" x2="90" y2="260" stroke="#000000" stroke-width="1.5"/>
            </g>

            <!-- 电池符号 -->
            <g id="scene1-battery">
                <!-- 正极（长线，下方） -->
                <line x1="105" y1="315" x2="135" y2="315" stroke="#000000" stroke-width="2"/>
                <!-- 负极（短线，上方） -->
                <line x1="115" y1="295" x2="125" y2="295" stroke="#000000" stroke-width="2"/>
            </g>

            <!-- 螺线管（电磁铁甲） -->
            <g id="scene1-solenoid">
                <!-- 高亮背景（步骤3显示） -->
                <path id="scene1-solenoid-highlight" d="M190,155 L370,155 A25,25 0 0,0 370,205 L190,205 A25,25 0 0,1 190,155 Z" fill="#1565c0" fill-opacity="0" stroke="#1565c0" stroke-width="0"/>
                <!-- 主体轮廓 -->
                <path id="scene1-solenoid-body" d="M190,155 L370,155 A25,25 0 0,0 370,205 L190,205 A25,25 0 0,1 190,155 Z" fill="none" stroke="#000000" stroke-width="2"/>
                <!-- 左端面内侧虚线（背面线圈） -->
                <line x1="190" y1="170" x2="200" y2="180" stroke="#888888" stroke-width="1" stroke-dasharray="4,3"/>
                <!-- 正面线圈斜线 -->
                <line x1="200" y1="205" x2="250" y2="155" stroke="#000000" stroke-width="1.5"/>
                <line x1="230" y1="205" x2="280" y2="155" stroke="#000000" stroke-width="1.5"/>
                <line x1="260" y1="205" x2="310" y2="155" stroke="#000000" stroke-width="1.5"/>
                <line x1="290" y1="205" x2="340" y2="155" stroke="#000000" stroke-width="1.5"/>
                <line x1="320" y1="205" x2="370" y2="155" stroke="#000000" stroke-width="1.5"/>
            </g>

            <!-- 永磁体乙 -->
            <g id="scene1-magnet">
                <!-- 高亮背景（步骤2显示） -->
                <rect id="scene1-magnet-highlight" x="460" y="160" width="120" height="40" rx="2" fill="#c62828" fill-opacity="0" stroke="#c62828" stroke-width="0"/>
                <!-- 主体 -->
                <rect id="scene1-magnet-body" x="460" y="160" width="120" height="40" rx="2" fill="none" stroke="#000000" stroke-width="2"/>
            </g>

            <!-- 磁感线 -->
            <g id="scene1-field-lines">
                <!-- 上线 -->
                <path id="scene1-field-top" d="M375,165 Q415,125 455,165" fill="none" stroke="#888888" stroke-width="1"/>
                <!-- 中线 -->
                <line id="scene1-field-mid" x1="375" y1="180" x2="455" y2="180" stroke="#888888" stroke-width="1"/>
                <!-- 下线 -->
                <path id="scene1-field-bottom" d="M375,195 Q415,235 455,195" fill="none" stroke="#888888" stroke-width="1"/>
            </g>

            <!-- 磁感线箭头（步骤1显示） -->
            <g id="scene1-field-arrows" style="display:none;">
                <!-- 中线箭头 -->
                <line x1="385" y1="180" x2="445" y2="180" stroke="#1565c0" stroke-width="2.5" marker-end="url(#scene1-arrowhead-blue)"/>
                <!-- 上线箭头 -->
                <line x1="385" y1="172" x2="445" y2="158" stroke="#1565c0" stroke-width="2.5" marker-end="url(#scene1-arrowhead-blue)"/>
                <!-- 下线箭头 -->
                <line x1="385" y1="188" x2="445" y2="202" stroke="#1565c0" stroke-width="2.5" marker-end="url(#scene1-arrowhead-blue)"/>
            </g>

            <!-- 标签 -->
            <g id="scene1-labels">
                <text x="190" y="145" text-anchor="middle" font-size="14" fill="#000000">a</text>
                <text x="370" y="145" text-anchor="middle" font-size="14" fill="#000000">b</text>
                <text x="460" y="145" text-anchor="middle" font-size="14" fill="#000000">c</text>
                <text x="580" y="145" text-anchor="middle" font-size="14" fill="#000000">d</text>
                <text x="280" y="248" text-anchor="middle" font-size="16" fill="#000000">甲</text>
                <text x="520" y="248" text-anchor="middle" font-size="16" fill="#000000">乙</text>
                <text x="45" y="265" text-anchor="middle" font-size="14" fill="#000000">S</text>
                <text x="155" y="335" text-anchor="middle" font-size="14" fill="#000000">+</text>
                <text x="155" y="295" text-anchor="middle" font-size="14" fill="#000000">−</text>
            </g>

            <!-- 极性标注：圆点和文字分离，放在端面外侧避免与磁感线重叠 -->
            <g id="scene1-pole-b-n" style="display:none;">
                <circle cx="385" cy="145" r="5" fill="#c62828" stroke="none"/>
                <text x="395" y="120" text-anchor="start" font-size="14" font-weight="bold" fill="#c62828">N</text>
            </g>
            <g id="scene1-pole-c-s" style="display:none;">
                <circle cx="435" cy="240" r="5" fill="#1565c0" stroke="none"/>
                <text x="445" y="270" text-anchor="start" font-size="14" font-weight="bold" fill="#1565c0">S</text>
            </g>
            <g id="scene1-pole-d-n" style="display:none;">
                <circle cx="595" cy="145" r="5" fill="#c62828" stroke="none"/>
                <text x="605" y="120" text-anchor="start" font-size="14" font-weight="bold" fill="#c62828">N</text>
            </g>
            <g id="scene1-pole-a-s" style="display:none;">
                <circle cx="155" cy="145" r="5" fill="#1565c0" stroke="none"/>
                <text x="165" y="120" text-anchor="start" font-size="14" font-weight="bold" fill="#1565c0">S</text>
            </g>

            <!-- 提示框：蓝色横线+下方文字，避免text与rect重叠 -->
            <g id="scene1-hint-group" style="display:none;">
                <line x1="140" y1="30" x2="660" y2="30" stroke="#1565c0" stroke-width="3" stroke-linecap="round"/>
                <text id="scene1-hint-text" x="400" y="55" text-anchor="middle" font-size="14" fill="#000000"></text>
            </g>

            <!-- 右手示意图（步骤3显示） -->
            <g id="scene1-hand-group" style="display:none;">
                <!-- 手掌椭圆 -->
                <ellipse cx="280" cy="100" rx="22" ry="32" fill="#000000" fill-opacity="0.15" stroke="#000000" stroke-width="1.5"/>
                <!-- 四指弧线 -->
                <path d="M258,80 Q235,90 248,110" fill="none" stroke="#000000" stroke-width="1.5"/>
                <path d="M258,92 Q235,102 248,122" fill="none" stroke="#000000" stroke-width="1.5"/>
                <path d="M258,104 Q235,114 248,134" fill="none" stroke="#000000" stroke-width="1.5"/>
                <path d="M258,116 Q235,126 248,146" fill="none" stroke="#000000" stroke-width="1.5"/>
                <!-- 大拇指 -->
                <line x1="300" y1="85" x2="345" y2="85" stroke="#c62828" stroke-width="4" marker-end="url(#scene1-arrowhead-red)"/>
            </g>

            <!-- 电流方向箭头（步骤3显示） -->
            <g id="scene1-current-arrow" style="display:none;">
                <line x1="280" y1="192" x2="280" y2="168" stroke="#1565c0" stroke-width="2.5" marker-end="url(#scene1-arrowhead-blue)"/>
            </g>

            <!-- 选项区域（步骤4显示）：文字放在矩形下方，避免重叠 -->
            <g id="scene1-options" style="display:none;">
                <rect id="scene1-option-a-bg" x="40" y="360" width="160" height="18" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1"/>
                <text x="120" y="395" text-anchor="middle" font-size="13" fill="#000000">A、a、c都是N极</text>

                <rect id="scene1-option-b-bg" x="215" y="360" width="160" height="18" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1"/>
                <text x="295" y="395" text-anchor="middle" font-size="13" fill="#000000">B、a、d都是N极</text>

                <rect id="scene1-option-c-bg" x="390" y="360" width="160" height="18" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1"/>
                <text x="470" y="395" text-anchor="middle" font-size="13" fill="#000000">C、b、c都是N极</text>

                <rect id="scene1-option-d-bg" x="565" y="360" width="160" height="18" rx="4" fill="#2e7d32" fill-opacity="0.2" stroke="#2e7d32" stroke-width="2"/>
                <text x="645" y="395" text-anchor="middle" font-size="13" fill="#000000" font-weight="bold">D、b、d都是N极</text>
            </g>

            <!-- 步骤指示器 -->
            <text id="scene1-step-text" x="400" y="445" text-anchor="middle" font-size="14" fill="#666666">步骤 1 / 5</text>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn">◀ 上一步</button>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        var currentStep = 0;
        var totalSteps = 5;

        // 元素引用
        var elFieldTop = document.getElementById('scene1-field-top');
        var elFieldMid = document.getElementById('scene1-field-mid');
        var elFieldBottom = document.getElementById('scene1-field-bottom');
        var elFieldArrows = document.getElementById('scene1-field-arrows');
        var elPoleBN = document.getElementById('scene1-pole-b-n');
        var elPoleCS = document.getElementById('scene1-pole-c-s');
        var elPoleDN = document.getElementById('scene1-pole-d-n');
        var elPoleAS = document.getElementById('scene1-pole-a-s');
        var elMagnetHighlight = document.getElementById('scene1-magnet-highlight');
        var elSolenoidHighlight = document.getElementById('scene1-solenoid-highlight');
        var elHandGroup = document.getElementById('scene1-hand-group');
        var elCurrentArrow = document.getElementById('scene1-current-arrow');
        var elHintGroup = document.getElementById('scene1-hint-group');
        var elHintText = document.getElementById('scene1-hint-text');
        var elOptions = document.getElementById('scene1-options');
        var elStepText = document.getElementById('scene1-step-text');
        var btnPrev = document.getElementById('scene1-btn-prev');
        var btnNext = document.getElementById('scene1-btn-next');

        // 提示文字
        var hints = [
            "", // 步骤0无提示
            "磁感线从N极发出，进入S极",
            "永磁体两端极性相反",
            "右手握住螺线管，四指指向电流方向，大拇指指向N极",
            "正确答案：D、b、d两端都是N极"
        ];

        function updateStep(step) {
            currentStep = step;

            // 更新步骤指示器
            elStepText.textContent = '步骤 ' + (currentStep + 1) + ' / ' + totalSteps;

            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps - 1);

            // 重置所有动态元素
            // 磁感线颜色
            var fieldColor = (currentStep >= 1) ? '#1565c0' : '#888888';
            var fieldWidth = (currentStep >= 1) ? '2.5' : '1';
            elFieldTop.setAttribute('stroke', fieldColor);
            elFieldTop.setAttribute('stroke-width', fieldWidth);
            elFieldMid.setAttribute('stroke', fieldColor);
            elFieldMid.setAttribute('stroke-width', fieldWidth);
            elFieldBottom.setAttribute('stroke', fieldColor);
            elFieldBottom.setAttribute('stroke-width', fieldWidth);

            // 磁感线箭头
            elFieldArrows.style.display = (currentStep >= 1) ? 'block' : 'none';

            // 极性标注
            elPoleBN.style.display = (currentStep >= 1) ? 'block' : 'none';
            elPoleCS.style.display = (currentStep >= 1) ? 'block' : 'none';
            elPoleDN.style.display = (currentStep >= 2) ? 'block' : 'none';
            elPoleAS.style.display = (currentStep >= 3) ? 'block' : 'none';

            // 高亮
            elMagnetHighlight.setAttribute('fill-opacity', (currentStep >= 2) ? '0.2' : '0');
            elMagnetHighlight.setAttribute('stroke-width', (currentStep >= 2) ? '2' : '0');
            elSolenoidHighlight.setAttribute('fill-opacity', (currentStep >= 3) ? '0.2' : '0');
            elSolenoidHighlight.setAttribute('stroke-width', (currentStep >= 3) ? '2' : '0');

            // 右手示意图和电流箭头
            elHandGroup.style.display = (currentStep >= 3) ? 'block' : 'none';
            elCurrentArrow.style.display = (currentStep >= 3) ? 'block' : 'none';

            // 提示框
            if (currentStep >= 1) {
                elHintGroup.style.display = 'block';
                elHintText.textContent = hints[currentStep];
            } else {
                elHintGroup.style.display = 'none';
            }

            // 选项
            elOptions.style.display = (currentStep >= 4) ? 'block' : 'none';
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) updateStep(currentStep - 1);
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) updateStep(currentStep + 1);
        });

        // 初始化
        updateStep(0);
    })();
    </script>
</body>
</html>
