<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>凸透镜成像规律</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 主光轴 -->
            <line id="scene2-axis" x1="50" y1="250" x2="750" y2="250" stroke="#888888" stroke-width="2" stroke-dasharray="6,4"/>

            <!-- 凸透镜 -->
            <path id="scene2-lens" d="M 390 210 Q 400 250 390 290 M 410 210 Q 400 250 410 290" fill="none" stroke="#000000" stroke-width="2"/>
            <text id="scene2-lens-label" x="400" y="200" text-anchor="middle" font-size="14" fill="#000000" font-weight="bold">O</text>

            <!-- 焦点标记 -->
            <circle cx="240" cy="250" r="4" fill="#2e7d32"/>
            <text x="240" y="275" text-anchor="middle" font-size="14" fill="#000000">2F</text>

            <circle cx="320" cy="250" r="4" fill="#2e7d32"/>
            <text x="320" y="275" text-anchor="middle" font-size="14" fill="#000000">F</text>

            <circle cx="480" cy="250" r="4" fill="#2e7d32"/>
            <text x="480" y="275" text-anchor="middle" font-size="14" fill="#000000">F</text>

            <circle cx="560" cy="250" r="4" fill="#2e7d32"/>
            <text x="560" y="275" text-anchor="middle" font-size="14" fill="#000000">2F</text>

            <!-- 蜡烛（物体） -->
            <g id="scene2-candle-group">
                <!-- 蜡烛主体 -->
                <rect x="150" y="210" width="20" height="40" fill="none" stroke="#1565c0" stroke-width="2"/>
                <!-- 蜡烛火焰 -->
                <path d="M 160 210 Q 155 200 160 190 Q 165 200 160 210" fill="none" stroke="#1565c0" stroke-width="2"/>
                <!-- 烛台底座 -->
                <line x1="155" y1="250" x2="165" y2="250" stroke="#1565c0" stroke-width="2"/>
            </g>

            <!-- 光屏 -->
            <rect id="scene2-screen" x="510" y="190" width="20" height="60" fill="none" stroke="#2e7d32" stroke-width="2"/>

            <!-- 实像 -->
            <g id="scene2-real-image" style="display:block;opacity:1">
                <path id="scene2-real-image-path" d="M 517 250 L 517 225 L 523 225 L 523 250 M 520 225 Q 517 218 520 212 Q 523 218 520 225" fill="none" stroke="#c62828" stroke-width="2"/>
            </g>

            <!-- 虚像 -->
            <g id="scene2-virtual-image" style="display:none;opacity:0">
                <path id="scene2-virtual-image-path" d="M 315 245 L 315 220 L 325 220 L 325 245 M 320 220 Q 315 213 320 207 Q 325 213 320 220" fill="none" stroke="#c62828" stroke-width="2" stroke-dasharray="4,3"/>
            </g>

            <!-- 不成像提示 -->
            <text id="scene2-no-image-text" x="520" y="280" font-size="14" fill="#c62828" style="display:none;opacity:0">不成像（像在无穷远处）</text>

            <!-- 信息面板边框 -->
            <line x1="50" y1="355" x2="750" y2="355" stroke="#000000" stroke-width="1"/>
            <line x1="50" y1="430" x2="750" y2="430" stroke="#000000" stroke-width="1"/>
            <line x1="50" y1="355" x2="50" y2="430" stroke="#000000" stroke-width="1"/>
            <line x1="750" y1="355" x2="750" y2="430" stroke="#000000" stroke-width="1"/>
            <!-- 信息面板内部竖分隔线 -->
            <line x1="270" y1="355" x2="270" y2="430" stroke="#cccccc" stroke-width="1"/>
            <line x1="530" y1="355" x2="530" y2="430" stroke="#cccccc" stroke-width="1"/>

            <!-- 信息文本 -->
            <text id="scene2-info-u" x="80" y="382" font-size="14" fill="#000000">物距 u = 240 mm</text>
            <text id="scene2-info-v" x="80" y="418" font-size="14" fill="#000000">像距 v = 120 mm</text>

            <text x="400" y="382" text-anchor="middle" font-size="14" fill="#000000" font-weight="bold">成像性质</text>
            <text id="scene2-info-nature" x="400" y="418" text-anchor="middle" font-size="14" fill="#000000">倒立缩小实像</text>

            <text x="650" y="382" text-anchor="middle" font-size="14" fill="#000000" font-weight="bold">实际应用</text>
            <text id="scene2-info-app" x="650" y="418" text-anchor="middle" font-size="14" fill="#000000">照相机</text>

            <!-- 滑块轨道 -->
            <line id="scene2-slider-track" x1="160" y1="455" x2="360" y2="455" stroke="#888888" stroke-width="4"/>

            <!-- 滑块刻度线 -->
            <line x1="160" y1="450" x2="160" y2="460" stroke="#888888" stroke-width="2"/>
            <line x1="240" y1="450" x2="240" y2="460" stroke="#888888" stroke-width="2"/>
            <line x1="320" y1="450" x2="320" y2="460" stroke="#888888" stroke-width="2"/>
            <line x1="360" y1="450" x2="360" y2="460" stroke="#888888" stroke-width="2"/>

            <!-- 刻度标签 -->
            <text x="160" y="475" text-anchor="middle" font-size="12" fill="#000000">3f</text>
            <text x="240" y="475" text-anchor="middle" font-size="12" fill="#000000">2f</text>
            <text x="320" y="475" text-anchor="middle" font-size="12" fill="#000000">f</text>
            <text x="360" y="475" text-anchor="middle" font-size="12" fill="#000000">0.5f</text>

            <!-- 滑块手柄 -->
            <circle id="scene2-slider-handle" cx="160" cy="455" r="9" fill="#1565c0" stroke="#ffffff" stroke-width="2" style="cursor: pointer;"/>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 2 实现：凸透镜成像规律交互演示
        // 坐标表参考（来自 spec）：
        // 主光轴: (50,250)-(750,250)
        // 透镜中心 O: (400,250), 标签 (400,200) [上移避免重叠]
        // 左2F: (240,250), 标签 (240,275)
        // 左F: (320,250), 标签 (320,275)
        // 右F: (480,250), 标签 (480,275)
        // 右2F: (560,250), 标签 (560,275)
        // 蜡烛初始: x=160 (u=240=3f)
        // 光屏初始: x=520 (v=120=1.5f)
        // 滑块轨道: (160,455)-(360,455)
        // 信息面板边框: (50,355)-(750,430)

        const f = 80; // 焦距 80px
        const lensX = 400;
        const lensY = 250;
        const sliderMin = 160;
        const sliderMax = 360;
        const sliderY = 455;
        const candleBaseHeight = 50; // 蜡烛物高（从主轴到火焰顶端）

        // DOM 元素
        const candleGroup = document.getElementById('scene2-candle-group');
        const screen = document.getElementById('scene2-screen');
        const realImage = document.getElementById('scene2-real-image');
        const realImagePath = document.getElementById('scene2-real-image-path');
        const virtualImage = document.getElementById('scene2-virtual-image');
        const virtualImagePath = document.getElementById('scene2-virtual-image-path');
        const noImageText = document.getElementById('scene2-no-image-text');
        const sliderHandle = document.getElementById('scene2-slider-handle');
        const infoU = document.getElementById('scene2-info-u');
        const infoV = document.getElementById('scene2-info-v');
        const infoNature = document.getElementById('scene2-info-nature');
        const infoApp = document.getElementById('scene2-info-app');
        const svg = document.getElementById('scene2-svg');

        // 工具函数：显示/隐藏元素
        function show(el) {
            el.style.display = 'block';
            el.style.opacity = '1';
        }
        function hide(el) {
            el.style.display = 'none';
            el.style.opacity = '0';
        }

        // 更新光学系统
        function updateOptics(candleX) {
            // 物距 u = 透镜中心 - 蜡烛中心
            const u = lensX - candleX;
            // 像距 v = u*f/(u-f)
            let v = 0;
            let m = 0;
            if (Math.abs(u - f) > 0.5) {
                v = u * f / (u - f);
                m = v / u;
            }

            // 更新蜡烛位置
            // 蜡烛主体中心在 candleX，主体宽20，所以 rect x = candleX - 10
            const candleRectX = candleX - 10;
            // 重新绘制蜡烛：主体 rect, 火焰 path, 底座 line
            // 清除旧内容
            candleGroup.innerHTML = '';
            // 蜡烛主体
            const bodyRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            bodyRect.setAttribute('x', candleRectX);
            bodyRect.setAttribute('y', '210');
            bodyRect.setAttribute('width', '20');
            bodyRect.setAttribute('height', '40');
            bodyRect.setAttribute('fill', 'none');
            bodyRect.setAttribute('stroke', '#1565c0');
            bodyRect.setAttribute('stroke-width', '2');
            candleGroup.appendChild(bodyRect);
            // 火焰
            const flamePath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            flamePath.setAttribute('d', `M ${candleX} 210 Q ${candleX - 5} 200 ${candleX} 190 Q ${candleX + 5} 200 ${candleX} 210`);
            flamePath.setAttribute('fill', 'none');
            flamePath.setAttribute('stroke', '#1565c0');
            flamePath.setAttribute('stroke-width', '2');
            candleGroup.appendChild(flamePath);
            // 底座
            const baseLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            baseLine.setAttribute('x1', candleX - 5);
            baseLine.setAttribute('y1', '250');
            baseLine.setAttribute('x2', candleX + 5);
            baseLine.setAttribute('y2', '250');
            baseLine.setAttribute('stroke', '#1565c0');
            baseLine.setAttribute('stroke-width', '2');
            candleGroup.appendChild(baseLine);

            // 更新滑块位置
            sliderHandle.setAttribute('cx', candleX);
            sliderHandle.setAttribute('cy', sliderY);

            // 更新信息面板
            infoU.textContent = `物距 u = ${u.toFixed(0)} mm`;

            if (Math.abs(u - f) <= 1) {
                // u = f，不成像
                hide(screen);
                hide(realImage);
                hide(virtualImage);
                show(noImageText);
                infoV.textContent = '像距 v = ∞';
                infoNature.textContent = '不成像';
                infoApp.textContent = '探照灯';
                return;
            }

            hide(noImageText);

            if (u > f) {
                // 实像
                const imageX = lensX + v;
                const imageHeight = candleBaseHeight * Math.abs(m);
                const imageWidth = 15;
                const imageRectX = imageX - imageWidth / 2;
                const imageTopY = lensY - imageHeight;

                // 更新光屏位置
                const screenX = Math.min(imageX - 10, 760);
                screen.setAttribute('x', screenX);
                screen.setAttribute('y', '190');
                screen.setAttribute('width', '20');
                screen.setAttribute('height', '60');
                show(screen);

                // 绘制倒立实像（火焰向下）
                const realPathStr = `M ${imageRectX} ${lensY} L ${imageRectX} ${imageTopY + imageHeight * 0.2} L ${imageRectX + imageWidth} ${imageTopY + imageHeight * 0.2} L ${imageRectX + imageWidth} ${lensY} M ${imageX} ${imageTopY + imageHeight * 0.2} Q ${imageX - 4} ${imageTopY + imageHeight * 0.5} ${imageX} ${imageTopY + imageHeight} Q ${imageX + 4} ${imageTopY + imageHeight * 0.5} ${imageX} ${imageTopY + imageHeight * 0.2}`;
                realImagePath.setAttribute('d', realPathStr);
                show(realImage);
                hide(virtualImage);

                infoV.textContent = `像距 v = ${v.toFixed(0)} mm`;

                // 成像性质
                if (u > 2 * f) {
                    infoNature.textContent = '倒立缩小实像';
                    infoApp.textContent = '照相机';
                } else if (Math.abs(u - 2 * f) <= 1) {
                    infoNature.textContent = '倒立等大实像';
                    infoApp.textContent = '测焦距';
                } else {
                    infoNature.textContent = '倒立放大实像';
                    infoApp.textContent = '投影仪';
                }
            } else {
                // u < f，虚像
                const imageX = lensX + v; // v 为负值，所以虚像在透镜左侧
                const imageHeight = candleBaseHeight * Math.abs(m);
                const imageWidth = 10;
                const imageRectX = imageX - imageWidth / 2;
                const imageTopY = lensY - imageHeight - 5; // 略高于主轴，避免与焦点圆点重叠

                hide(screen);
                hide(realImage);

                // 绘制正立虚像（火焰向上）
                const virtualPathStr = `M ${imageRectX} ${lensY - 5} L ${imageRectX} ${imageTopY + imageHeight * 0.8} L ${imageRectX + imageWidth} ${imageTopY + imageHeight * 0.8} L ${imageRectX + imageWidth} ${lensY - 5} M ${imageX} ${imageTopY + imageHeight * 0.8} Q ${imageX - 3} ${imageTopY + imageHeight * 0.4} ${imageX} ${imageTopY} Q ${imageX + 3} ${imageTopY + imageHeight * 0.4} ${imageX} ${imageTopY + imageHeight * 0.8}`;
                virtualImagePath.setAttribute('d', virtualPathStr);
                show(virtualImage);

                infoV.textContent = `像距 v = ${Math.abs(v).toFixed(0)} mm（虚像）`;
                infoNature.textContent = '正立放大虚像';
                infoApp.textContent = '放大镜';
            }
        }

        // 拖拽逻辑
        let isDragging = false;
        let dragOffsetX = 0;

        sliderHandle.addEventListener('mousedown', function(e) {
            isDragging = true;
            const rect = svg.getBoundingClientRect();
            dragOffsetX = e.clientX - rect.left - parseFloat(sliderHandle.getAttribute('cx'));
            e.preventDefault();
        });

        sliderHandle.addEventListener('touchstart', function(e) {
            isDragging = true;
            const rect = svg.getBoundingClientRect();
            dragOffsetX = e.touches[0].clientX - rect.left - parseFloat(sliderHandle.getAttribute('cx'));
            e.preventDefault();
        }, { passive: false });

        window.addEventListener('mousemove', function(e) {
            if (!isDragging) return;
            const rect = svg.getBoundingClientRect();
            let newX = e.clientX - rect.left - dragOffsetX;
            newX = Math.max(sliderMin, Math.min(sliderMax, newX));
            updateOptics(newX);
        });

        window.addEventListener('touchmove', function(e) {
            if (!isDragging) return;
            const rect = svg.getBoundingClientRect();
            let newX = e.touches[0].clientX - rect.left - dragOffsetX;
            newX = Math.max(sliderMin, Math.min(sliderMax, newX));
            updateOptics(newX);
            e.preventDefault();
        }, { passive: false });

        window.addEventListener('mouseup', function() {
            isDragging = false;
        });

        window.addEventListener('touchend', function() {
            isDragging = false;
        });

        // 初始化
        updateOptics(160);
    })();
    </script>
</body>
</html>
