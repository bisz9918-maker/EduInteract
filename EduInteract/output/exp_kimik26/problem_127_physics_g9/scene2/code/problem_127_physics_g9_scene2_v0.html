<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>光通过玻璃砖的折射</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene2-controls button { padding: 6px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: #f5f5f5; }
        #scene2-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene2-step-indicator { font-size: 14px; color: #666; min-width: 50px; text-align: center; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500">
            <defs>
                <marker id="scene2-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0" />
                </marker>
                <marker id="scene2-arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#c62828" />
                </marker>
                <marker id="scene2-arrowhead-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#888888" />
                </marker>
            </defs>

            <!-- 玻璃砖 -->
            <g id="scene2-bricks">
                <rect id="scene2-brick-a" x="120" y="80" width="180" height="60" fill="#e3f2fd" fill-opacity="0.15" stroke="#000000" stroke-width="1.5"/>
                <rect id="scene2-brick-b" x="480" y="80" width="180" height="60" fill="#e3f2fd" fill-opacity="0.15" stroke="#000000" stroke-width="1.5"/>
                <rect id="scene2-brick-c" x="120" y="240" width="180" height="60" fill="#e3f2fd" fill-opacity="0.15" stroke="#000000" stroke-width="1.5"/>
                <rect id="scene2-brick-d" x="480" y="240" width="180" height="60" fill="#e3f2fd" fill-opacity="0.15" stroke="#000000" stroke-width="1.5"/>
            </g>

            <!-- 法线 -->
            <g id="scene2-normals" stroke="#888888" stroke-width="1" stroke-dasharray="4,3">
                <!-- A 法线 -->
                <line x1="170" y1="40" x2="170" y2="120"/>
                <line x1="260" y1="135" x2="340" y2="135"/>
                <!-- B 法线 -->
                <line x1="530" y1="40" x2="530" y2="120"/>
                <line x1="620" y1="140" x2="700" y2="140"/>
                <!-- C 法线 -->
                <line x1="170" y1="200" x2="170" y2="280"/>
                <line x1="274" y1="260" x2="274" y2="340"/>
                <!-- D 法线 -->
                <line x1="530" y1="200" x2="530" y2="280"/>
                <line x1="620" y1="300" x2="700" y2="300"/>
            </g>

            <!-- A 光路 -->
            <g id="scene2-group-a" class="scene2-ray-group">
                <line id="scene2-ray-a-incident" x1="140" y1="30" x2="170" y2="80" stroke="#1565c0" stroke-width="2" marker-end="url(#scene2-arrowhead)"/>
                <line id="scene2-ray-a-internal" x1="170" y1="80" x2="300" y2="135" stroke="#1565c0" stroke-width="2" marker-end="url(#scene2-arrowhead)"/>
                <line id="scene2-ray-a-exit" x1="300" y1="135" x2="340" y2="175" stroke="#1565c0" stroke-width="2" marker-end="url(#scene2-arrowhead)"/>
            </g>

            <!-- B 光路 -->
            <g id="scene2-group-b" class="scene2-ray-group">
                <line id="scene2-ray-b-incident" x1="500" y1="30" x2="530" y2="80" stroke="#1565c0" stroke-width="2" marker-end="url(#scene2-arrowhead)"/>
                <line id="scene2-ray-b-internal" x1="530" y1="80" x2="660" y2="140" stroke="#1565c0" stroke-width="2" marker-end="url(#scene2-arrowhead)"/>
                <line id="scene2-ray-b-exit" x1="660" y1="140" x2="700" y2="207" stroke="#1565c0" stroke-width="2" marker-end="url(#scene2-arrowhead)"/>
            </g>

            <!-- C 光路 -->
            <g id="scene2-group-c" class="scene2-ray-group">
                <line id="scene2-ray-c-incident" x1="140" y1="190" x2="170" y2="240" stroke="#1565c0" stroke-width="2" marker-end="url(#scene2-arrowhead)"/>
                <line id="scene2-ray-c-internal" x1="170" y1="240" x2="274" y2="300" stroke="#1565c0" stroke-width="2" marker-end="url(#scene2-arrowhead)"/>
                <line id="scene2-ray-c-exit" x1="274" y1="300" x2="300" y2="335" stroke="#1565c0" stroke-width="2" marker-end="url(#scene2-arrowhead)"/>
            </g>

            <!-- D 光路 -->
            <g id="scene2-group-d" class="scene2-ray-group">
                <line id="scene2-ray-d-incident" x1="500" y1="190" x2="530" y2="240" stroke="#1565c0" stroke-width="2" marker-end="url(#scene2-arrowhead)"/>
                <line id="scene2-ray-d-internal" x1="530" y1="240" x2="660" y2="300" stroke="#1565c0" stroke-width="2" marker-end="url(#scene2-arrowhead)"/>
                <line id="scene2-ray-d-exit" x1="660" y1="300" x2="700" y2="320" stroke="#1565c0" stroke-width="2" marker-end="url(#scene2-arrowhead)"/>
            </g>

            <!-- 选项标签 -->
            <g id="scene2-labels" font-size="13" font-family="sans-serif" fill="#000000">
                <text x="120" y="155">A</text>
                <text x="480" y="155">B</text>
                <text x="120" y="315">C</text>
                <text x="480" y="325">D</text>
            </g>

            <!-- 步骤 1 辅助标注 (A) -->
            <g id="scene2-annotations-a" style="display:none">
                <line x1="300" y1="135" x2="340" y2="202" stroke="#c62828" stroke-width="1.5" stroke-dasharray="5,3"/>
                <text x="350" y="170" font-size="12" fill="#c62828" font-family="sans-serif">不平行</text>
            </g>

            <!-- 步骤 2 辅助标注 (B) -->
            <g id="scene2-annotations-b" style="display:none">
                <!-- 平行符号 // 入射光侧 -->
                <line x1="152" y1="55" x2="158" y2="61" stroke="#1565c0" stroke-width="1.5"/>
                <line x1="157" y1="52" x2="163" y2="58" stroke="#1565c0" stroke-width="1.5"/>
                <!-- 平行符号 // 出射光侧 -->
                <line x1="672" y1="150" x2="678" y2="156" stroke="#1565c0" stroke-width="1.5"/>
                <line x1="677" y1="147" x2="683" y2="153" stroke="#1565c0" stroke-width="1.5"/>
                <!-- 侧移双箭头 -->
                <line x1="690" y1="145" x2="690" y2="175" stroke="#1565c0" stroke-width="1.5" marker-end="url(#scene2-arrowhead)" marker-start="url(#scene2-arrowhead)"/>
                <text x="705" y="162" font-size="12" fill="#1565c0" font-family="sans-serif">d</text>
            </g>

            <!-- 步骤 3 辅助标注 (C) -->
            <g id="scene2-annotations-c" style="display:none">
                <!-- 红色粗箭头覆盖错误光路 -->
                <line x1="274" y1="300" x2="300" y2="335" stroke="#c62828" stroke-width="4" marker-end="url(#scene2-arrowhead-red)"/>
            </g>

            <!-- 步骤 4 辅助标注 (D) -->
            <g id="scene2-annotations-d" style="display:none">
                <line x1="530" y1="240" x2="660" y2="290" stroke="#c62828" stroke-width="1.5" stroke-dasharray="5,3"/>
                <text x="675" y="268" font-size="12" fill="#c62828" font-family="sans-serif">应发生折射</text>
            </g>

            <!-- 分析图标 -->
            <text id="scene2-analysis-icon" x="210" y="385" font-size="24" font-family="sans-serif" style="display:none"></text>

            <!-- 分析文字 -->
            <text id="scene2-analysis-text" x="245" y="385" font-size="16" font-family="sans-serif" style="display:none"></text>

            <!-- 结论文字 -->
            <text id="scene2-conclusion" x="400" y="380" text-anchor="middle" font-size="18" font-weight="bold" fill="#1565c0" font-family="sans-serif" style="display:none">正确答案：B</text>
        </svg>

        <div id="scene2-controls">
            <button id="scene2-btn-prev" disabled>◀ 上一步</button>
            <span id="scene2-step-indicator">0 / 5</span>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const totalSteps = 5;

        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        const stepIndicator = document.getElementById('scene2-step-indicator');

        const groups = {
            a: document.getElementById('scene2-group-a'),
            b: document.getElementById('scene2-group-b'),
            c: document.getElementById('scene2-group-c'),
            d: document.getElementById('scene2-group-d')
        };

        const bricks = {
            a: document.getElementById('scene2-brick-a'),
            b: document.getElementById('scene2-brick-b'),
            c: document.getElementById('scene2-brick-c'),
            d: document.getElementById('scene2-brick-d')
        };

        const annotations = {
            a: document.getElementById('scene2-annotations-a'),
            b: document.getElementById('scene2-annotations-b'),
            c: document.getElementById('scene2-annotations-c'),
            d: document.getElementById('scene2-annotations-d')
        };

        const analysisIcon = document.getElementById('scene2-analysis-icon');
        const analysisText = document.getElementById('scene2-analysis-text');
        const conclusion = document.getElementById('scene2-conclusion');

        function setRayStyle(group, color, width, opacity) {
            const lines = group.querySelectorAll('line');
            lines.forEach(function(line) {
                line.setAttribute('stroke', color);
                line.setAttribute('stroke-width', width);
                line.setAttribute('stroke-opacity', opacity);
                if (color === '#c62828') {
                    line.setAttribute('marker-end', 'url(#scene2-arrowhead-red)');
                } else if (color === '#888888') {
                    line.setAttribute('marker-end', 'url(#scene2-arrowhead-gray)');
                } else {
                    line.setAttribute('marker-end', 'url(#scene2-arrowhead)');
                }
            });
        }

        function show(el) {
            el.style.display = 'block';
            el.style.opacity = '1';
        }

        function hide(el) {
            el.style.display = 'none';
            el.style.opacity = '0';
        }

        function updateScene(step) {
            // Reset all annotations and texts
            Object.values(annotations).forEach(hide);
            hide(analysisIcon);
            hide(analysisText);
            hide(conclusion);

            // Reset all rays to default blue
            setRayStyle(groups.a, '#1565c0', 2, 1);
            setRayStyle(groups.b, '#1565c0', 2, 1);
            setRayStyle(groups.c, '#1565c0', 2, 1);
            setRayStyle(groups.d, '#1565c0', 2, 1);

            // Reset brick strokes
            Object.values(bricks).forEach(function(brick) {
                brick.setAttribute('stroke', '#000000');
                brick.setAttribute('stroke-opacity', '1');
                brick.setAttribute('stroke-width', '1.5');
            });

            switch(step) {
                case 0:
                    // 总览：全部显示，无高亮
                    break;
                case 1:
                    // 分析 A：A 高亮红色，其他淡化
                    setRayStyle(groups.b, '#888888', 1, 0.3);
                    setRayStyle(groups.c, '#888888', 1, 0.3);
                    setRayStyle(groups.d, '#888888', 1, 0.3);
                    bricks.b.setAttribute('stroke-opacity', '0.3');
                    bricks.c.setAttribute('stroke-opacity', '0.3');
                    bricks.d.setAttribute('stroke-opacity', '0.3');

                    setRayStyle(groups.a, '#c62828', 2, 1);
                    show(annotations.a);

                    show(analysisIcon);
                    show(analysisText);
                    analysisIcon.textContent = '✗';
                    analysisIcon.setAttribute('fill', '#c62828');
                    analysisText.textContent = '出射光与入射光不平行，错误';
                    analysisText.setAttribute('fill', '#c62828');
                    break;
                case 2:
                    // 分析 B：B 高亮蓝色，其他淡化
                    setRayStyle(groups.a, '#888888', 1, 0.3);
                    setRayStyle(groups.c, '#888888', 1, 0.3);
                    setRayStyle(groups.d, '#888888', 1, 0.3);
                    bricks.a.setAttribute('stroke-opacity', '0.3');
                    bricks.c.setAttribute('stroke-opacity', '0.3');
                    bricks.d.setAttribute('stroke-opacity', '0.3');

                    setRayStyle(groups.b, '#1565c0', 2, 1);
                    show(annotations.b);

                    show(analysisIcon);
                    show(analysisText);
                    analysisIcon.textContent = '✓';
                    analysisIcon.setAttribute('fill', '#2e7d32');
                    analysisText.textContent = '符合折射定律，出射光∥入射光，正确';
                    analysisText.setAttribute('fill', '#2e7d32');
                    break;
                case 3:
                    // 分析 C：C 高亮红色，其他淡化
                    setRayStyle(groups.a, '#888888', 1, 0.3);
                    setRayStyle(groups.b, '#888888', 1, 0.3);
                    setRayStyle(groups.d, '#888888', 1, 0.3);
                    bricks.a.setAttribute('stroke-opacity', '0.3');
                    bricks.b.setAttribute('stroke-opacity', '0.3');
                    bricks.d.setAttribute('stroke-opacity', '0.3');

                    setRayStyle(groups.c, '#c62828', 2, 1);
                    show(annotations.c);

                    show(analysisIcon);
                    show(analysisText);
                    analysisIcon.textContent = '✗';
                    analysisIcon.setAttribute('fill', '#c62828');
                    analysisText.textContent = '一般斜入射时入射角小于临界角，不会发生全反射，错误';
                    analysisText.setAttribute('fill', '#c62828');
                    break;
                case 4:
                    // 分析 D：D 高亮红色，其他淡化
                    setRayStyle(groups.a, '#888888', 1, 0.3);
                    setRayStyle(groups.b, '#888888', 1, 0.3);
                    setRayStyle(groups.c, '#888888', 1, 0.3);
                    bricks.a.setAttribute('stroke-opacity', '0.3');
                    bricks.b.setAttribute('stroke-opacity', '0.3');
                    bricks.c.setAttribute('stroke-opacity', '0.3');

                    setRayStyle(groups.d, '#c62828', 2, 1);
                    show(annotations.d);

                    show(analysisIcon);
                    show(analysisText);
                    analysisIcon.textContent = '✗';
                    analysisIcon.setAttribute('fill', '#c62828');
                    analysisText.textContent = '光从空气进入玻璃必须发生折射，错误';
                    analysisText.setAttribute('fill', '#c62828');
                    break;
                case 5:
                    // 结论：B 高亮，其他置灰
                    setRayStyle(groups.a, '#888888', 1, 0.3);
                    setRayStyle(groups.c, '#888888', 1, 0.3);
                    setRayStyle(groups.d, '#888888', 1, 0.3);
                    setRayStyle(groups.b, '#1565c0', 2, 1);

                    show(conclusion);
                    break;
            }

            stepIndicator.textContent = step + ' / ' + totalSteps;
            btnPrev.disabled = step === 0;
            btnNext.disabled = step === totalSteps;
            if (step === totalSteps) {
                btnNext.textContent = '完成';
            } else {
                btnNext.textContent = '下一步 ▶';
            }
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateScene(currentStep);
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateScene(currentStep);
            }
        });

        // Initialize
        updateScene(0);
    })();
    </script>
</body>
</html>
