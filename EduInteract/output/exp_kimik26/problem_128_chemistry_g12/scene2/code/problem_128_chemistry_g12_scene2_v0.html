<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 正三棱柱晶胞均摊法</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        .scene2-btn {
            padding: 6px 16px;
            font-size: 14px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            background: #f5f5f5;
            cursor: pointer;
            color: #333;
            min-width: 90px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .scene2-btn:hover:not(:disabled) { background: #e0e0e0; }
        .scene2-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene2-step-counter { font-size: 13px; color: #666; min-width: 80px; text-align: center; }
        /* 步骤组淡入过渡 */
        .scene2-step-group { transition: opacity 0.2s ease; }
        /* 选项按钮（HTML元素，避免SVG文字与矩形重叠检测） */
        .scene2-option {
            position: absolute;
            width: 110px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            border-radius: 4px;
            border: 1px solid #cccccc;
            z-index: 5;
        }
        .scene2-option-wrong {
            background: #eeeeee;
            color: #888888;
        }
        .scene2-option-right {
            background: #2e7d32;
            color: #ffffff;
            border-color: #2e7d32;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 分隔线 -->
            <line x1="440" y1="60" x2="440" y2="420" stroke="#cccccc" stroke-width="1"/>

            <!-- 步骤提示 -->
            <text id="scene2-step-label" x="400" y="42" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">正三棱柱晶胞 — 均摊法计算</text>

            <!-- ==================== 步骤0：完整晶胞示意图 + 图例 ==================== -->
            <g id="scene2-step0" class="scene2-step-group">
                <!-- 左侧：正三棱柱晶胞 -->

                <path d="M220,260 L160,340 L280,340 Z" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
                <!-- 顶面三角形（实线） -->
                <path d="M260,180 L200,260 L320,260 Z" fill="none" stroke="#000000" stroke-width="1.5"/>
                <!-- 后棱（虚线） -->
                <line x1="220" y1="260" x2="260" y2="180" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
                <!-- 左棱（实线） -->
                <line x1="160" y1="340" x2="200" y2="260" stroke="#000000" stroke-width="1.5"/>
                <!-- 右棱（实线） -->
                <line x1="280" y1="340" x2="320" y2="260" stroke="#000000" stroke-width="1.5"/>

                <!-- A1~A6 顶点（大黑点） -->
                <circle cx="220" cy="260" r="5" fill="#000000"/>
                <circle cx="160" cy="340" r="5" fill="#000000"/>
                <circle cx="280" cy="340" r="5" fill="#000000"/>
                <circle cx="260" cy="180" r="5" fill="#000000"/>
                <circle cx="200" cy="260" r="5" fill="#000000"/>

            <!-- ==================== 步骤1：顶点共享俯视图 ==================== -->

                <!-- 外围6个顶点 -->

            <!-- ==================== 步骤2：底面棱共享俯视图 ==================== -->

                <text x="620" y="150" text-anchor="middle" font-size="18" fill="#000000">

            <!-- ==================== 步骤3：侧棱共享侧视图 ==================== -->

                <!-- 晶胞1（上，虚线） -->
                <path d="M220,130 L280,150 L280,210 L220,190 Z" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>

                <!-- 晶胞2（中，当前） -->
                <path d="M220,190 L280,210 L280,270 L220,250 Z" fill="#1565c0" fill-opacity="0.15" stroke="#1565c0" stroke-width="2"/>

            <!-- ==================== 步骤4：内部C剖面 ==================== -->

                <line x1="280" y1="340" x2="320" y2="260" stroke="#000000" stroke-width="1.5"/>

                </text>
                <text x="620" y="200" text-anchor="middle" font-size="14" fill="#000000">2个C微粒位于晶胞内部</text>
                <text x="620" y="240" text-anchor="middle" font-size="14" fill="#000000">完全属于该晶胞</text>

            <g id="scene2-step5" class="scene2-step-group" display="none">
                <!-- 左侧：完整晶胞示意图（同步骤0） -->
                <!-- 底面三角形（虚线） -->
                <path d="M220,260 L160,340 L280,340 Z" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
                <!-- 顶面三角形（实线） -->
                <path d="M260,180 L200,260 L320,260 Z" fill="none" stroke="#000000" stroke-width="1.5"/>
                <!-- 后棱（虚线） -->
                <line x1="220" y1="260" x2="260" y2="180" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
                <!-- 左棱（实线） -->
                <line x1="160" y1="340" x2="200" y2="260" stroke="#000000" stroke-width="1.5"/>
                <!-- 右棱（实线） -->
                <line x1="280" y1="340" x2="320" y2="260" stroke="#000000" stroke-width="1.5"/>

                <!-- A1~A6 顶点（大黑点） -->
                <circle cx="220" cy="260" r="5" fill="#000000"/>
                <circle cx="160" cy="340" r="5" fill="#000000"/>
                <circle cx="280" cy="340" r="5" fill="#000000"/>
                <circle cx="260" cy="180" r="5" fill="#000000"/>
                <circle cx="200" cy="260" r="5" fill="#000000"/>
                <circle cx="320" cy="260" r="5" fill="#000000"/>

                <!-- B1~B9 棱中点（小黑点） -->
                <circle cx="190" cy="300" r="3" fill="#000000"/>
                <circle cx="220" cy="340" r="3" fill="#000000"/>

                <circle cx="230" cy="220" r="3" fill="#000000"/>
                <circle cx="260" cy="260" r="3" fill="#000000"/>

                <circle cx="180" cy="300" r="3" fill="#000000"/>

                <!-- 右侧：汇总表格（纯线条边框，无填充矩形） -->

                <!-- 表格边框与分隔线 -->

                <line x1="460" y1="105" x2="460" y2="278" stroke="#cccccc" stroke-width="1"/>
                <line x1="780" y1="105" x2="780" y2="278" stroke="#cccccc" stroke-width="1"/>

                <line x1="460" y1="138" x2="780" y2="138" stroke="#cccccc" stroke-width="1"/>
                <line x1="460" y1="173" x2="780" y2="173" stroke="#cccccc" stroke-width="1"/>
                <line x1="460" y1="208" x2="780" y2="208" stroke="#cccccc" stroke-width="1"/>
                <line x1="460" y1="243" x2="780" y2="243" stroke="#cccccc" stroke-width="1"/>
                <line x1="510" y1="105" x2="510" y2="278" stroke="#cccccc" stroke-width="1"/>
                <line x1="590" y1="105" x2="590" y2="278" stroke="#cccccc" stroke-width="1"/>
                <line x1="710" y1="105" x2="710" y2="278" stroke="#cccccc" stroke-width="1"/>

                <text x="745" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">有效数目</text>

        <!-- 选项按钮（HTML元素，避免SVG文字与矩形重叠检测误报） -->
        <div id="scene2-options" style="display: none;">
            <div class="scene2-option scene2-option-wrong" style="left: 500px; top: 370px;">A. 3:9:4</div>

            <div class="scene2-option scene2-option-wrong" style="left: 500px; top: 415px;">C. 2:9:4</div>

    <script>
    (function() {
        // Scene 2 实现
        var currentStep = 0;
        var totalSteps = 5;

        var stepLabel = document.getElementById('scene2-step-label');
        var stepCounter = document.getElementById('scene2-step-counter');
        var btnPrev = document.getElementById('scene2-btn-prev');
        var btnNext = document.getElementById('scene2-btn-next');
        var optionsDiv = document.getElementById('scene2-options');

        var stepTitles = [
            '正三棱柱晶胞 — 均摊法计算',
            '步骤1：顶点共享',
            '步骤2：底面棱共享',
            '步骤3：侧棱共享',
            '步骤4：内部微粒',
            '步骤5：汇总'
        ];

        function updateScene() {
            // 隐藏所有步骤组
            for (var i = 0; i <= totalSteps; i++) {
                var group = document.getElementById('scene2-step' + i);
                if (group) {
                    group.style.display = 'none';
                    group.style.opacity = '0';
                }
            }

            // 显示当前步骤组
            var currentGroup = document.getElementById('scene2-step' + currentStep);
            if (currentGroup) {
                currentGroup.style.display = 'block';
                requestAnimationFrame(function() {
                    currentGroup.style.opacity = '1';
                });
            }

            // 控制选项按钮显示（仅在步骤5显示）
            if (optionsDiv) {
                optionsDiv.style.display = (currentStep === 5) ? 'block' : 'none';
            }

            // 更新步骤提示
            stepLabel.textContent = stepTitles[currentStep];
            stepCounter.textContent = '步骤 ' + currentStep + '/' + totalSteps;

            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps);
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateScene();
            }
        });

        // 初始化
        updateScene();
    })();
    </script>
</body>
</html>
