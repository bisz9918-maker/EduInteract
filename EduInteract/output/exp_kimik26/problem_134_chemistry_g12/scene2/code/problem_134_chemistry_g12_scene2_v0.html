<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 正四面体烷二氯代物分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene2-controls button {
            padding: 6px 16px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #f5f5f5;
            transition: opacity 0.2s;
        }
        #scene2-controls button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        #scene2-step-indicator {
            font-size: 14px;
            color: #666;
            min-width: 50px;
            text-align: center;
        }
        .scene2-step-group {
            transition: opacity 0.3s ease-in-out;
        }
        .scene2-text-item {
            transition: opacity 0.3s ease-in-out;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500">
            <defs>
                <!-- 箭头标记 -->
                <marker id="scene2-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
                </marker>
            </defs>

            <!-- 步骤0：基础结构（始终显示） -->
            <g id="scene2-step0-group">
                <!-- 棱：实线 -->
                <line x1="300" y1="90" x2="200" y2="260" stroke="#000000" stroke-width="2"/>
                <line x1="300" y1="90" x2="400" y2="260" stroke="#000000" stroke-width="2"/>
                <line x1="300" y1="90" x2="300" y2="190" stroke="#000000" stroke-width="2"/>
                <line x1="200" y1="260" x2="400" y2="260" stroke="#000000" stroke-width="2"/>
                <!-- 棱：虚线 -->
                <line x1="200" y1="260" x2="300" y2="190" stroke="#888888" stroke-width="1.5" stroke-dasharray="6,4"/>
                <line x1="400" y1="260" x2="300" y2="190" stroke="#888888" stroke-width="1.5" stroke-dasharray="6,4"/>

                <!-- 顶点圆点 -->
                <circle cx="300" cy="90" r="5" fill="#1565c0"/>
                <circle cx="200" cy="260" r="5" fill="#1565c0"/>
                <circle cx="400" cy="260" r="5" fill="#1565c0"/>
                <circle cx="300" cy="190" r="5" fill="#1565c0"/>

                <!-- 顶点编号标签 -->
                <text x="300" y="72" text-anchor="middle" fill="#1565c0" font-size="16" font-weight="bold">①</text>
                <text x="185" y="250" text-anchor="middle" fill="#1565c0" font-size="16" font-weight="bold">②</text>
                <text x="410" y="250" text-anchor="middle" fill="#1565c0" font-size="16" font-weight="bold">③</text>
                <!-- ④标签左移至x=180，避免与任何棱的bbox重叠 -->
                <text x="180" y="190" text-anchor="middle" fill="#1565c0" font-size="16" font-weight="bold">④</text>
            </g>

            <!-- 步骤1：一氯代物 - 绿色Cl -->
            <g id="scene2-step1-group" class="scene2-step-group" style="opacity: 0;">
                <circle cx="300" cy="90" r="8" fill="#2e7d32"/>
                <!-- Cl标签右上移避免与棱重叠 -->
                <text x="345" y="75" fill="#2e7d32" font-size="16" font-weight="bold">Cl</text>
            </g>

            <!-- 步骤2：二氯代物候选 - 红色Cl在②③④ -->
            <g id="scene2-step2-group" class="scene2-step-group" style="opacity: 0;">
                <circle cx="200" cy="260" r="8" fill="#c62828"/>
                <!-- Cl标签左下移避免与②标签拥挤 -->
                <text x="145" y="290" fill="#c62828" font-size="16" font-weight="bold">Cl</text>

                <circle cx="400" cy="260" r="8" fill="#c62828"/>
                <!-- Cl标签右移避免与右侧文字拥挤 -->
                <text x="440" y="290" fill="#c62828" font-size="16" font-weight="bold">Cl</text>

                <circle cx="300" cy="190" r="8" fill="#c62828"/>
                <!-- Cl标签左上移，完全避开所有棱的bbox -->
                <text x="220" y="80" fill="#c62828" font-size="16" font-weight="bold">Cl</text>
            </g>

            <!-- 步骤3：旋转对称证明 - 旋转轴+箭头 -->
            <g id="scene2-step3-group" class="scene2-step-group" style="opacity: 0;">
                <line x1="300" y1="70" x2="300" y2="260" stroke="#888888" stroke-width="1.5" stroke-dasharray="6,4"/>
                <!-- 旋转轴标签左上移，避开所有棱bbox -->
                <text x="290" y="50" fill="#666666" font-size="14">旋转轴</text>

                <path d="M 220 290 Q 300 350 380 290" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#scene2-arrowhead)"/>
                <text x="300" y="365" text-anchor="middle" fill="#000000" font-size="16">120°</text>
            </g>

            <!-- 步骤4：最终结论 - 绿色Cl+红色Cl② -->
            <g id="scene2-step4-group" class="scene2-step-group" style="opacity: 0;">
                <circle cx="300" cy="90" r="8" fill="#2e7d32"/>
                <text x="345" y="75" fill="#2e7d32" font-size="16" font-weight="bold">Cl</text>

                <circle cx="200" cy="260" r="8" fill="#c62828"/>
                <text x="145" y="290" fill="#c62828" font-size="16" font-weight="bold">Cl</text>
            </g>

            <!-- 文字面板：所有结论文字统一放置，通过data-step控制显隐 -->
            <g id="scene2-text-group">
                <text class="scene2-text-item" data-step="1" x="480" y="130" fill="#2e7d32" font-size="18" font-weight="bold">一氯代物：1种</text>
                <text class="scene2-text-item" data-step="1" x="480" y="165" fill="#666666" font-size="14">（4个顶点完全等价）</text>

                <text class="scene2-text-item" data-step="2" x="480" y="205" fill="#000000" font-size="16">固定Cl在①，第二个Cl可在②③④</text>

                <text class="scene2-text-item" data-step="3" x="480" y="260" fill="#000000" font-size="16">绕轴旋转120°</text>
                <text class="scene2-text-item" data-step="3" x="480" y="300" fill="#1565c0" font-size="18" font-weight="bold">②→③→④ 完全等价</text>

                <text class="scene2-text-item" data-step="4" x="480" y="355" fill="#2e7d32" font-size="20" font-weight="bold">二氯代物：1种</text>
                <text class="scene2-text-item" data-step="4" x="480" y="395" fill="#c62828" font-size="16">选项A：二氯代物有两种</text>
                <text class="scene2-text-item" data-step="4" x="690" y="395" fill="#c62828" font-size="20" font-weight="bold">✗</text>
            </g>
        </svg>

        <div id="scene2-controls">
            <button id="scene2-btn-prev" disabled>◀ 上一步</button>
            <span id="scene2-step-indicator">1 / 5</span>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        const TOTAL_STEPS = 5;
        let currentStep = 0;

        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        const indicator = document.getElementById('scene2-step-indicator');

        const stepGroups = [];
        for (let i = 0; i < TOTAL_STEPS; i++) {
            stepGroups.push(document.getElementById('scene2-step' + i + '-group'));
        }

        const textItems = document.querySelectorAll('#scene2-text-group .scene2-text-item');

        function setVisible(el, visible) {
            if (visible) {
                el.style.opacity = '1';
                el.style.display = 'block';
            } else {
                el.style.opacity = '0';
                el.style.display = 'none';
            }
        }

        function renderStep() {
            // 更新步骤指示器
            indicator.textContent = (currentStep + 1) + ' / ' + TOTAL_STEPS;

            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === TOTAL_STEPS - 1);

            // 步骤0始终显示
            setVisible(stepGroups[0], true);

            // 步骤1图形：显示在步骤1-3
            setVisible(stepGroups[1], currentStep >= 1 && currentStep < 4);

            // 步骤2图形：显示在步骤2-3
            setVisible(stepGroups[2], currentStep >= 2 && currentStep < 4);

            // 步骤3图形：显示在步骤3
            setVisible(stepGroups[3], currentStep === 3);

            // 步骤4图形：显示在步骤4
            setVisible(stepGroups[4], currentStep >= 4);

            // 文字元素：根据data-step显示
            textItems.forEach(el => {
                const minStep = parseInt(el.getAttribute('data-step')) || 0;
                setVisible(el, currentStep >= minStep);
            });
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < TOTAL_STEPS - 1) {
                currentStep++;
                renderStep();
            }
        });

        // 初始渲染
        renderStep();
    })();
    </script>
</body>
</html>
