<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 醋酸与氨水反应导电性变化</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene2-controls button {
            padding: 6px 16px; font-size: 14px; cursor: pointer;
            border: 1px solid #333; border-radius: 4px; background: #f5f5f5;
        }
        #scene2-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene2-step-indicator { font-size: 14px; color: #333; min-width: 70px; text-align: center; }
        .hidden { opacity: 0; pointer-events: none; }
        .visible { opacity: 1; }
        .particle { transition: opacity 0.3s ease; }
        .curve-highlight { stroke: #1565c0 !important; stroke-width: 3px !important; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 烧杯口 -->
            <line id="scene2-beaker-rim" x1="110" y1="150" x2="270" y2="150" stroke="#000" stroke-width="2"/>
            <!-- 烧杯外轮廓 -->
            <path id="scene2-beaker-body" d="M 120 150 L 120 260 Q 120 280 140 280 L 240 280 Q 260 280 260 260 L 260 150" fill="none" stroke="#000" stroke-width="2"/>
            <!-- 溶液填充区 -->
            <path id="scene2-solution" d="M 125 175 L 125 260 Q 125 275 140 275 L 240 275 Q 255 275 255 260 L 255 175 Z" fill="#1565c0" fill-opacity="0.2" stroke="none"/>

            <!-- 左电极 -->
            <rect id="scene2-electrode-left" x="163" y="90" width="4" height="120" fill="#555" stroke="#000" stroke-width="1"/>
            <!-- 右电极 -->
            <rect id="scene2-electrode-right" x="213" y="90" width="4" height="120" fill="#555" stroke="#000" stroke-width="1"/>

            <!-- 导线 L1: 电池→右电极 -->
            <path id="scene2-wire-l1" d="M 340 65 L 215 65 L 215 90" fill="none" stroke="#000" stroke-width="2"/>
            <!-- 导线 L2: 左电极→灯泡 -->
            <path id="scene2-wire-l2" d="M 165 90 L 165 120 L 320 120" fill="none" stroke="#000" stroke-width="2"/>
            <!-- 导线 L3: 灯泡→电池 -->
            <path id="scene2-wire-l3" d="M 360 120 L 380 120 L 380 65 L 390 65" fill="none" stroke="#000" stroke-width="2"/>

            <!-- 电池 -->
            <rect id="scene2-battery" x="340" y="55" width="50" height="20" fill="#e0e0e0" stroke="#000" stroke-width="1.5"/>
            <line id="scene2-battery-pos" x1="365" y1="55" x2="365" y2="75" stroke="#000" stroke-width="2"/>
            <line id="scene2-battery-neg" x1="365" y1="60" x2="365" y2="70" stroke="#000" stroke-width="1"/>
            <text id="scene2-battery-label" x="365" y="50" text-anchor="middle" font-size="12" fill="#000">电池</text>

            <!-- 灯泡外框 -->
            <circle id="scene2-bulb" cx="340" cy="120" r="20" fill="#f9a825" fill-opacity="0.3" stroke="#000" stroke-width="1.5"/>
            <!-- 灯丝 -->
            <path id="scene2-filament" d="M 332 120 L 340 110 L 348 120" fill="none" stroke="#000" stroke-width="1.5"/>

            <!-- 溶液标题 (上移避免与导线重叠) -->
            <text id="scene2-title" x="190" y="48" text-anchor="middle" font-size="14" fill="#000">CH₃COOH 溶液</text>
            <!-- 状态说明 -->
            <text id="scene2-status" x="190" y="305" text-anchor="middle" font-size="13" fill="#333">弱电解质，离子少</text>

            <!-- 图例 -->
            <circle id="scene2-legend-blue1" cx="310" cy="195" r="8" fill="#1565c0"/>
            <text id="scene2-legend-blue1-text" x="325" y="198" font-size="12" fill="#000">CH₃COOH</text>
            <circle id="scene2-legend-blue2" cx="310" cy="225" r="8" fill="#1565c0"/>
            <text id="scene2-legend-blue2-text" x="325" y="228" font-size="12" fill="#000">NH₃·H₂O</text>
            <circle id="scene2-legend-red" cx="310" cy="255" r="6" fill="#c62828"/>
            <text id="scene2-legend-red-text" x="325" y="258" font-size="12" fill="#000">H⁺, NH₄⁺</text>
            <circle id="scene2-legend-green" cx="310" cy="285" r="6" fill="#2e7d32"/>
            <text id="scene2-legend-green-text" x="325" y="288" font-size="12" fill="#000">CH₃COO⁻, OH⁻</text>

            <!-- 粒子预设位置池（16个位置） -->
            <!-- CH₃COOH 蓝球 r=10 -->
            <circle id="scene2-p-ch3cooh-1" class="particle" cx="140" cy="190" r="10" fill="#1565c0" opacity="1"/>
            <circle id="scene2-p-ch3cooh-2" class="particle" cx="170" cy="185" r="10" fill="#1565c0" opacity="1"/>
            <circle id="scene2-p-ch3cooh-3" class="particle" cx="200" cy="195" r="10" fill="#1565c0" opacity="1"/>
            <circle id="scene2-p-ch3cooh-4" class="particle" cx="150" cy="210" r="10" fill="#1565c0" opacity="1"/>
            <circle id="scene2-p-ch3cooh-5" class="particle" cx="180" cy="220" r="10" fill="#1565c0" opacity="0"/>
            <circle id="scene2-p-ch3cooh-6" class="particle" cx="210" cy="210" r="10" fill="#1565c0" opacity="0"/>
            <circle id="scene2-p-ch3cooh-7" class="particle" cx="160" cy="240" r="10" fill="#1565c0" opacity="0"/>
            <circle id="scene2-p-ch3cooh-8" class="particle" cx="190" cy="250" r="10" fill="#1565c0" opacity="0"/>

            <!-- NH₃·H₂O 蓝球 r=10 -->
            <circle id="scene2-p-nh3-1" class="particle" cx="135" cy="260" r="10" fill="#1565c0" opacity="0"/>
            <circle id="scene2-p-nh3-2" class="particle" cx="220" cy="260" r="10" fill="#1565c0" opacity="0"/>
            <circle id="scene2-p-nh3-3" class="particle" cx="175" cy="270" r="10" fill="#1565c0" opacity="0"/>
            <circle id="scene2-p-nh3-4" class="particle" cx="195" cy="230" r="10" fill="#1565c0" opacity="0"/>

            <!-- H⁺ 红球 r=6 -->
            <circle id="scene2-p-h-1" class="particle" cx="165" cy="200" r="6" fill="#c62828" opacity="0"/>
            <circle id="scene2-p-h-2" class="particle" cx="185" cy="205" r="6" fill="#c62828" opacity="0"/>
            <circle id="scene2-p-h-3" class="particle" cx="185" cy="250" r="6" fill="#c62828" opacity="0"/>

            <!-- NH₄⁺ 红球 r=6 -->
            <circle id="scene2-p-nh4-1" class="particle" cx="210" cy="210" r="6" fill="#c62828" opacity="0"/>
            <circle id="scene2-p-nh4-2" class="particle" cx="160" cy="240" r="6" fill="#c62828" opacity="0"/>
            <circle id="scene2-p-nh4-3" class="particle" cx="190" cy="250" r="6" fill="#c62828" opacity="0"/>
            <circle id="scene2-p-nh4-4" class="particle" cx="230" cy="230" r="6" fill="#c62828" opacity="0"/>
            <circle id="scene2-p-nh4-5" class="particle" cx="165" cy="200" r="6" fill="#c62828" opacity="0"/>
            <circle id="scene2-p-nh4-6" class="particle" cx="195" cy="230" r="6" fill="#c62828" opacity="0"/>

            <!-- CH₃COO⁻ 绿球 r=6 -->
            <circle id="scene2-p-ch3coo-1" class="particle" cx="165" cy="200" r="6" fill="#2e7d32" opacity="0"/>
            <circle id="scene2-p-ch3coo-2" class="particle" cx="195" cy="230" r="6" fill="#2e7d32" opacity="0"/>
            <circle id="scene2-p-ch3coo-3" class="particle" cx="185" cy="205" r="6" fill="#2e7d32" opacity="0"/>
            <circle id="scene2-p-ch3coo-4" class="particle" cx="185" cy="250" r="6" fill="#2e7d32" opacity="0"/>
            <circle id="scene2-p-ch3coo-5" class="particle" cx="140" cy="190" r="6" fill="#2e7d32" opacity="0"/>
            <circle id="scene2-p-ch3coo-6" class="particle" cx="170" cy="185" r="6" fill="#2e7d32" opacity="0"/>

            <!-- OH⁻ 绿球 r=6 -->
            <circle id="scene2-p-oh-1" class="particle" cx="220" cy="260" r="6" fill="#2e7d32" opacity="0"/>
            <circle id="scene2-p-oh-2" class="particle" cx="185" cy="250" r="6" fill="#2e7d32" opacity="0"/>

            <!-- 曲线图区 -->
            <!-- Y轴 -->
            <line id="scene2-axis-y" x1="420" y1="420" x2="420" y2="320" stroke="#000" stroke-width="1.5"/>
            <!-- X轴 -->
            <line id="scene2-axis-x" x1="420" y1="420" x2="760" y2="420" stroke="#000" stroke-width="1.5"/>
            <!-- 横坐标标签 -->
            <text id="scene2-xlabel" x="590" y="438" text-anchor="middle" font-size="12" fill="#000">加入氨水体积</text>
            <!-- 纵坐标标签 -->
            <text id="scene2-ylabel" x="395" y="365" text-anchor="middle" font-size="12" fill="#000" transform="rotate(-90, 395, 365)">导电性（相对）</text>

            <!-- 导电性曲线 -->
            <path id="scene2-curve-path" d="M 440 400 Q 520 365 600 330 Q 660 355 720 380" fill="none" stroke="#888" stroke-width="2"/>

            <!-- 中和点垂线 -->
            <line id="scene2-neutral-line" x1="600" y1="330" x2="600" y2="420" stroke="#888" stroke-width="1.5" stroke-dasharray="4,4" opacity="0"/>
            <!-- 中和点标签 -->
            <text id="scene2-neutral-label" x="600" y="308" text-anchor="middle" font-size="12" fill="#000" opacity="0">中和点</text>

            <!-- 当前步骤点 -->
            <circle id="scene2-curve-dot" cx="440" cy="400" r="5" fill="#c62828"/>

            <!-- 关键点标记（步骤4显示） -->
            <circle id="scene2-key-start" class="particle" cx="440" cy="400" r="4" fill="#1565c0" opacity="0"/>
            <circle id="scene2-key-peak" class="particle" cx="600" cy="330" r="5" fill="#c62828" opacity="0"/>
            <circle id="scene2-key-end" class="particle" cx="720" cy="380" r="4" fill="#1565c0" opacity="0"/>
        </svg>

        <div id="scene2-controls">
            <button id="scene2-btn-prev" disabled>◀ 上一步</button>
            <span id="scene2-step-indicator">步骤 0 / 4</span>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2 实现
        var currentStep = 0;
        var totalSteps = 4;

        // 粒子ID映射
        var particleMap = {
            ch3cooh: ['scene2-p-ch3cooh-1','scene2-p-ch3cooh-2','scene2-p-ch3cooh-3','scene2-p-ch3cooh-4','scene2-p-ch3cooh-5','scene2-p-ch3cooh-6','scene2-p-ch3cooh-7','scene2-p-ch3cooh-8'],
            nh3: ['scene2-p-nh3-1','scene2-p-nh3-2','scene2-p-nh3-3','scene2-p-nh3-4'],
            h: ['scene2-p-h-1','scene2-p-h-2','scene2-p-h-3'],
            nh4: ['scene2-p-nh4-1','scene2-p-nh4-2','scene2-p-nh4-3','scene2-p-nh4-4','scene2-p-nh4-5','scene2-p-nh4-6'],
            ch3coo: ['scene2-p-ch3coo-1','scene2-p-ch3coo-2','scene2-p-ch3coo-3','scene2-p-ch3coo-4','scene2-p-ch3coo-5','scene2-p-ch3coo-6'],
            oh: ['scene2-p-oh-1','scene2-p-oh-2']
        };

        // 各步骤配置
        var stepConfig = [
            { // 步骤0
                particles: {
                    ch3cooh: [0,1,2,3,4,5,6,7],
                    nh3: [],
                    h: [1,2],
                    nh4: [],
                    ch3coo: [0,1],
                    oh: []
                },
                bulbOpacity: 0.3,
                title: 'CH₃COOH 溶液',
                status: '弱电解质，离子少',
                dotPos: {x: 440, y: 400},
                showNeutral: false,
                curveColor: '#888',
                curveWidth: 2,
                showKeys: false
            },
            { // 步骤1
                particles: {
                    ch3cooh: [0,1,2,3],
                    nh3: [0,1],
                    h: [1],
                    nh4: [0,1,2,3],
                    ch3coo: [0,1,2,3],
                    oh: []
                },
                bulbOpacity: 0.6,
                title: 'CH₃COOH + NH₃·H₂O',
                status: '生成强电解质盐',
                dotPos: {x: 520, y: 355},
                showNeutral: false,
                curveColor: '#888',
                curveWidth: 2,
                showKeys: false
            },
            { // 步骤2
                particles: {
                    ch3cooh: [],
                    nh3: [],
                    h: [1],
                    nh4: [0,1,2,3,4,5],
                    ch3coo: [0,1,2,3,4,5],
                    oh: [0]
                },
                bulbOpacity: 1.0,
                title: 'CH₃COONH₄ 溶液',
                status: '离子浓度最大',
                dotPos: {x: 600, y: 330},
                showNeutral: true,
                curveColor: '#888',
                curveWidth: 2,
                showKeys: false
            },
            { // 步骤3
                particles: {
                    ch3cooh: [],
                    nh3: [0,1,2,3],
                    h: [1],
                    nh4: [0,1,2,3,4],
                    ch3coo: [0,1,2,3,4],
                    oh: [0]
                },
                bulbOpacity: 0.5,
                title: 'CH₃COONH₄ + NH₃·H₂O',
                status: '过量稀释',
                dotPos: {x: 680, y: 355},
                showNeutral: true,
                curveColor: '#888',
                curveWidth: 2,
                showKeys: false
            },
            { // 步骤4
                particles: {
                    ch3cooh: [],
                    nh3: [0,1,2,3],
                    h: [1],
                    nh4: [0,1,2,3,4],
                    ch3coo: [0,1,2,3,4],
                    oh: [0]
                },
                bulbOpacity: 0.5,
                title: '导电性变化总结',
                status: '导电性先增大后减小',
                dotPos: {x: 600, y: 330},
                showNeutral: true,
                curveColor: '#1565c0',
                curveWidth: 3,
                showKeys: true
            }
        ];

        function setOpacity(id, val) {
            var el = document.getElementById(id);
            if (el) el.setAttribute('opacity', val);
        }

        function setDisplay(id, show) {
            var el = document.getElementById(id);
            if (el) el.style.display = show ? 'block' : 'none';
        }

        function updateScene(step) {
            var cfg = stepConfig[step];

            // 更新粒子
            for (var type in particleMap) {
                var ids = particleMap[type];
                var active = cfg.particles[type] || [];
                for (var i = 0; i < ids.length; i++) {
                    setOpacity(ids[i], active.indexOf(i) >= 0 ? 1 : 0);
                }
            }

            // 更新灯泡
            var bulb = document.getElementById('scene2-bulb');
            if (bulb) bulb.setAttribute('fill-opacity', cfg.bulbOpacity);

            // 更新标题和状态
            var title = document.getElementById('scene2-title');
            if (title) title.textContent = cfg.title;
            var status = document.getElementById('scene2-status');
            if (status) status.textContent = cfg.status;

            // 更新曲线点
            var dot = document.getElementById('scene2-curve-dot');
            if (dot) {
                dot.setAttribute('cx', cfg.dotPos.x);
                dot.setAttribute('cy', cfg.dotPos.y);
            }

            // 中和点垂线和标签
            setDisplay('scene2-neutral-line', cfg.showNeutral);
            setDisplay('scene2-neutral-label', cfg.showNeutral);

            // 曲线样式
            var curve = document.getElementById('scene2-curve-path');
            if (curve) {
                curve.setAttribute('stroke', cfg.curveColor);
                curve.setAttribute('stroke-width', cfg.curveWidth);
            }

            // 关键点标记
            setDisplay('scene2-key-start', cfg.showKeys);
            setDisplay('scene2-key-peak', cfg.showKeys);
            setDisplay('scene2-key-end', cfg.showKeys);

            // 按钮状态
            document.getElementById('scene2-btn-prev').disabled = (step === 0);
            document.getElementById('scene2-btn-next').disabled = (step === totalSteps);

            // 步骤指示器
            document.getElementById('scene2-step-indicator').textContent = '步骤 ' + step + ' / ' + totalSteps;
        }

        document.getElementById('scene2-btn-prev').addEventListener('click', function() {
            if (currentStep > 0) { currentStep--; updateScene(currentStep); }
        });
        document.getElementById('scene2-btn-next').addEventListener('click', function() {
            if (currentStep < totalSteps) { currentStep++; updateScene(currentStep); }
        });

        // 初始化
        updateScene(0);
    })();
    </script>
</body>
</html>
