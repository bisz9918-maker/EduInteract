<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 3 - F₂白花株系分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }

        .scene3-btn {
            padding: 6px 18px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #f8f8f8;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .scene3-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .scene3-btn:hover:not(:disabled) {
            background: #e8e8e8;
        }

        #scene3-step-indicator {
            font-size: 13px;
            color: #666;
            min-width: 60px;
            text-align: center;
        }

        .step-group { display: none; opacity: 0; transition: opacity 0.25s ease-in-out; }
        .step-group.active { display: block; opacity: 1; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <!-- 全局箭头定义 -->
            <defs>
                <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
                    <path d="M0,0 L10,5 L0,10 L2,5 Z" fill="#7b1fa2"/>
                </marker>
                <marker id="arrow-black" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
                    <path d="M0,0 L10,5 L0,10 L2,5 Z" fill="#000"/>
                </marker>
                <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
                    <path d="M0,0 L10,5 L0,10 L2,5 Z" fill="#c62828"/>
                </marker>
            </defs>

            <!-- 步骤标题 -->
            <text id="scene3-title" x="400" y="38" text-anchor="middle" font-size="15" font-weight="bold" fill="#000">F₂白花5种基因型及其比例</text>

            <!-- ========== 步骤1：F₂白花基因型比例表（纯线框表格，无rect） ========== -->
            <g id="scene3-step1-group" class="step-group active">
                <!-- 外框线 -->
                <line x1="190" y1="60" x2="610" y2="60" stroke="#000" stroke-width="1.5"/>
                <line x1="190" y1="305" x2="610" y2="305" stroke="#000" stroke-width="1.5"/>
                <line x1="190" y1="60" x2="190" y2="305" stroke="#000" stroke-width="1.5"/>
                <line x1="610" y1="60" x2="610" y2="305" stroke="#000" stroke-width="1.5"/>
                <!-- 列分隔线 -->
                <line x1="320" y1="60" x2="320" y2="305" stroke="#000" stroke-width="1"/>
                <line x1="470" y1="60" x2="470" y2="305" stroke="#000" stroke-width="1"/>
                <!-- 行分隔线 -->
                <line x1="190" y1="95" x2="610" y2="95" stroke="#000" stroke-width="1"/>
                <line x1="190" y1="135" x2="610" y2="135" stroke="#888" stroke-width="0.5"/>
                <line x1="190" y1="175" x2="610" y2="175" stroke="#888" stroke-width="0.5"/>
                <line x1="190" y1="215" x2="610" y2="215" stroke="#888" stroke-width="0.5"/>
                <line x1="190" y1="255" x2="610" y2="255" stroke="#888" stroke-width="0.5"/>
                <line x1="190" y1="295" x2="610" y2="295" stroke="#888" stroke-width="0.5"/>

                <!-- 表头文字 -->
                <text x="255" y="83" text-anchor="middle" font-size="13" fill="#000">基因型</text>
                <text x="395" y="83" text-anchor="middle" font-size="13" fill="#000">比例</text>
                <text x="540" y="83" text-anchor="middle" font-size="13" fill="#000">表现型</text>

                <!-- 数据行 -->
                <text x="255" y="118" text-anchor="middle" font-size="13" fill="#000">AABB</text>
                <text x="395" y="118" text-anchor="middle" font-size="13" fill="#000">1/10</text>
                <text x="540" y="118" text-anchor="middle" font-size="13" fill="#000">白花</text>

                <text x="255" y="158" text-anchor="middle" font-size="13" fill="#000">AABb</text>
                <text x="395" y="158" text-anchor="middle" font-size="13" fill="#000">2/10</text>
                <text x="540" y="158" text-anchor="middle" font-size="13" fill="#000">白花</text>

                <text x="255" y="198" text-anchor="middle" font-size="13" fill="#000">AaBB</text>
                <text x="395" y="198" text-anchor="middle" font-size="13" fill="#000">2/10</text>
                <text x="540" y="198" text-anchor="middle" font-size="13" fill="#000">白花</text>

                <text x="255" y="238" text-anchor="middle" font-size="13" fill="#1565c0" font-weight="bold">AaBb</text>
                <text x="395" y="238" text-anchor="middle" font-size="13" fill="#1565c0" font-weight="bold">4/10</text>
                <text x="540" y="238" text-anchor="middle" font-size="13" fill="#000">白花</text>

                <text x="255" y="278" text-anchor="middle" font-size="13" fill="#000">aabb</text>
                <text x="395" y="278" text-anchor="middle" font-size="13" fill="#000">1/10</text>
                <text x="540" y="278" text-anchor="middle" font-size="13" fill="#000">白花</text>
            </g>

            <!-- ========== 步骤2：自交结果对比 + AaBb自交分支图 ========== -->
            <g id="scene3-step2-group" class="step-group">
                <!-- 左侧表格（纯线框，无rect） -->
                <line x1="40" y1="55" x2="400" y2="55" stroke="#000" stroke-width="1.5"/>
                <line x1="40" y1="255" x2="400" y2="255" stroke="#000" stroke-width="1.5"/>
                <line x1="40" y1="55" x2="40" y2="255" stroke="#000" stroke-width="1.5"/>
                <line x1="400" y1="55" x2="400" y2="255" stroke="#000" stroke-width="1.5"/>
                <line x1="40" y1="85" x2="400" y2="85" stroke="#000" stroke-width="1"/>
                <line x1="150" y1="55" x2="150" y2="255" stroke="#000" stroke-width="1"/>
                <line x1="250" y1="55" x2="250" y2="255" stroke="#000" stroke-width="1"/>
                <line x1="40" y1="115" x2="400" y2="115" stroke="#888" stroke-width="0.5"/>
                <line x1="40" y1="147" x2="400" y2="147" stroke="#888" stroke-width="0.5"/>
                <line x1="40" y1="179" x2="400" y2="179" stroke="#888" stroke-width="0.5"/>
                <line x1="40" y1="211" x2="400" y2="211" stroke="#888" stroke-width="0.5"/>
                <line x1="40" y1="243" x2="400" y2="243" stroke="#888" stroke-width="0.5"/>

                <text x="95" y="76" text-anchor="middle" font-size="12" fill="#000">基因型</text>
                <text x="200" y="76" text-anchor="middle" font-size="12" fill="#000">比例</text>
                <text x="325" y="76" text-anchor="middle" font-size="12" fill="#000">自交结果</text>

                <text x="95" y="106" text-anchor="middle" font-size="12" fill="#000">AABB</text>
                <text x="200" y="106" text-anchor="middle" font-size="12" fill="#000">1/10</text>
                <text x="325" y="106" text-anchor="middle" font-size="12" fill="#000">全白花</text>

                <text x="95" y="138" text-anchor="middle" font-size="12" fill="#000">AABb</text>
                <text x="200" y="138" text-anchor="middle" font-size="12" fill="#000">2/10</text>
                <text x="325" y="138" text-anchor="middle" font-size="12" fill="#000">3白:1紫</text>

                <text x="95" y="170" text-anchor="middle" font-size="12" fill="#000">AaBB</text>
                <text x="200" y="170" text-anchor="middle" font-size="12" fill="#000">2/10</text>
                <text x="325" y="170" text-anchor="middle" font-size="12" fill="#000">3白:1蓝</text>

                <text x="95" y="202" text-anchor="middle" font-size="12" fill="#1565c0" font-weight="bold">AaBb</text>
                <text x="200" y="202" text-anchor="middle" font-size="12" fill="#1565c0" font-weight="bold">4/10</text>
                <text x="325" y="202" text-anchor="middle" font-size="12" fill="#1565c0" font-weight="bold">3紫:3蓝:10白</text>

                <text x="95" y="234" text-anchor="middle" font-size="12" fill="#000">aabb</text>
                <text x="200" y="234" text-anchor="middle" font-size="12" fill="#000">1/10</text>
                <text x="325" y="234" text-anchor="middle" font-size="12" fill="#000">全白花</text>

                <!-- 右侧 AaBb 自交分支图（文字在线外，无rect） -->
                <text x="600" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#000">AaBb ⊗</text>
                <circle cx="600" cy="95" r="4" fill="#000"/>

                <!-- 分支1 A_B_ 白花（左上） -->
                <line x1="600" y1="95" x2="530" y2="105" stroke="#888" stroke-width="1" stroke-dasharray="4,2"/>
                <text x="500" y="100" text-anchor="middle" font-size="12" fill="#000">A_B_</text>
                <text x="500" y="132" text-anchor="middle" font-size="12" fill="#9e9e9e">白花 10/16</text>

                <!-- 分支2 A_bb 紫花（右上） -->
                <line x1="600" y1="95" x2="670" y2="105" stroke="#888" stroke-width="1" stroke-dasharray="4,2"/>
                <text x="700" y="100" text-anchor="middle" font-size="12" fill="#000">A_bb</text>
                <text x="700" y="132" text-anchor="middle" font-size="12" fill="#7b1fa2">紫花 3/16</text>

                <!-- 分支3 aaB_ 蓝花（左下） -->
                <line x1="600" y1="95" x2="530" y2="170" stroke="#888" stroke-width="1" stroke-dasharray="4,2"/>
                <text x="500" y="165" text-anchor="middle" font-size="12" fill="#000">aaB_</text>
                <text x="500" y="197" text-anchor="middle" font-size="12" fill="#00838f">蓝花 3/16</text>

                <!-- 分支4 aabb 白花（右下） -->
                <line x1="600" y1="95" x2="670" y2="170" stroke="#888" stroke-width="1" stroke-dasharray="4,2"/>
                <text x="700" y="165" text-anchor="middle" font-size="12" fill="#000">aabb</text>
                <text x="700" y="197" text-anchor="middle" font-size="12" fill="#9e9e9e">白花 1/16</text>
            </g>

            <!-- ========== 步骤3：紫花基因型拆解（文字在块外） ========== -->
            <g id="scene3-step3-group" class="step-group">
                <!-- 四色块（文字在块下方） -->
                <rect x="120" y="75" width="120" height="30" fill="rgba(158,158,158,0.15)" stroke="#9e9e9e" stroke-width="1.5"/>
                <text x="180" y="125" text-anchor="middle" font-size="13" fill="#000">白花 10/16</text>

                <rect x="280" y="75" width="120" height="30" fill="rgba(123,31,162,0.15)" stroke="#7b1fa2" stroke-width="2"/>
                <text x="340" y="125" text-anchor="middle" font-size="13" fill="#000">紫花 3/16</text>

                <rect x="440" y="75" width="120" height="30" fill="rgba(0,131,143,0.15)" stroke="#00838f" stroke-width="1.5"/>
                <text x="500" y="125" text-anchor="middle" font-size="13" fill="#000">蓝花 3/16</text>

                <rect x="600" y="75" width="120" height="30" fill="rgba(158,158,158,0.15)" stroke="#9e9e9e" stroke-width="1.5"/>
                <text x="660" y="125" text-anchor="middle" font-size="13" fill="#000">白花 1/16</text>

                <!-- 聚焦箭头 -->
                <line x1="340" y1="138" x2="340" y2="175" stroke="#7b1fa2" stroke-width="2" marker-end="url(#arrow-purple)"/>

                <!-- 说明文字 -->
                <text x="400" y="200" text-anchor="middle" font-size="13" fill="#000">紫花植株基因型及比例</text>

                <!-- 基因型（纯文字，无rect） -->
                <text x="260" y="240" text-anchor="middle" font-size="14" fill="#7b1fa2" font-weight="bold">AAbb 占 1/3</text>
                <text x="420" y="240" text-anchor="middle" font-size="14" fill="#7b1fa2" font-weight="bold">Aabb 占 2/3</text>
            </g>

            <!-- ========== 步骤4：测交推导（无rect外框，加大行距） ========== -->
            <g id="scene3-step4-group" class="step-group">
                <!-- 左侧测交 -->
                <text x="250" y="60" text-anchor="middle" font-size="13" fill="#000">1/3</text>
                <text x="250" y="95" text-anchor="middle" font-size="13" fill="#000">AAbb</text>
                <text x="250" y="130" text-anchor="middle" font-size="13" fill="#000">×</text>
                <text x="250" y="165" text-anchor="middle" font-size="13" fill="#000">aabb</text>
                <line x1="190" y1="182" x2="310" y2="182" stroke="#000" stroke-width="1"/>
                <text x="250" y="212" text-anchor="middle" font-size="13" fill="#000">Aabb</text>
                <text x="250" y="247" text-anchor="middle" font-size="13" fill="#7b1fa2">(全紫花)</text>

                <!-- 右侧测交 -->
                <text x="550" y="60" text-anchor="middle" font-size="13" fill="#000">2/3</text>
                <text x="550" y="95" text-anchor="middle" font-size="13" fill="#000">Aabb</text>
                <text x="550" y="130" text-anchor="middle" font-size="13" fill="#000">×</text>
                <text x="550" y="165" text-anchor="middle" font-size="13" fill="#000">aabb</text>
                <line x1="490" y1="182" x2="610" y2="182" stroke="#000" stroke-width="1"/>
                <text x="550" y="212" text-anchor="middle" font-size="13" fill="#000">1/2 Aabb</text>
                <text x="550" y="247" text-anchor="middle" font-size="13" fill="#000">1/2 aabb</text>
                <text x="550" y="282" text-anchor="middle" font-size="13" fill="#7b1fa2">(1紫:1白)</text>

                <!-- 汇总箭头（终点在汇总文字上方） -->
                <line x1="250" y1="302" x2="400" y2="332" stroke="#000" stroke-width="1.5" marker-end="url(#arrow-black)"/>
                <line x1="550" y1="302" x2="400" y2="332" stroke="#000" stroke-width="1.5" marker-end="url(#arrow-black)"/>

                <text x="400" y="360" text-anchor="middle" font-size="13" fill="#000">汇总</text>
                <text x="400" y="395" text-anchor="middle" font-size="13" fill="#000">紫花 = 1/3×1 + 2/3×1/2 = 2/3</text>
                <text x="400" y="430" text-anchor="middle" font-size="13" fill="#000">白花 = 2/3×1/2 = 1/3</text>
                <text x="400" y="470" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e7d32">紫花 : 白花 = 2 : 1</text>
            </g>

            <!-- ========== 步骤5：体细胞突变分析 ========== -->
            <g id="scene3-step5-group" class="step-group">
                <text x="400" y="73" text-anchor="middle" font-size="13" fill="#000">白花植株体细胞突变→蓝色斑点（aaB_）</text>

                <!-- 第一列 AaBb -->
                <text x="200" y="105" text-anchor="middle" font-size="13" fill="#000">AaBb</text>
                <line x1="200" y1="115" x2="200" y2="145" stroke="#000" stroke-width="1.5" marker-end="url(#arrow-red)"/>
                <text x="200" y="163" text-anchor="middle" font-size="13" fill="#c62828">A→a</text>
                <line x1="200" y1="175" x2="200" y2="200" stroke="#000" stroke-width="1.5" marker-end="url(#arrow-red)"/>
                <text x="200" y="220" text-anchor="middle" font-size="13" fill="#000">aaBb（蓝斑）</text>

                <!-- 第二列 AaBB -->
                <text x="400" y="105" text-anchor="middle" font-size="13" fill="#000">AaBB</text>
                <line x1="400" y1="115" x2="400" y2="145" stroke="#000" stroke-width="1.5" marker-end="url(#arrow-red)"/>
                <text x="400" y="163" text-anchor="middle" font-size="13" fill="#c62828">A→a</text>
                <line x1="400" y1="175" x2="400" y2="200" stroke="#000" stroke-width="1.5" marker-end="url(#arrow-red)"/>
                <text x="400" y="220" text-anchor="middle" font-size="13" fill="#000">aaBB（蓝斑）</text>

                <!-- 第三列 aabb -->
                <text x="600" y="105" text-anchor="middle" font-size="13" fill="#000">aabb</text>
                <line x1="600" y1="115" x2="600" y2="145" stroke="#000" stroke-width="1.5" marker-end="url(#arrow-red)"/>
                <text x="600" y="163" text-anchor="middle" font-size="13" fill="#c62828">b→B</text>
                <line x1="600" y1="175" x2="600" y2="200" stroke="#000" stroke-width="1.5" marker-end="url(#arrow-red)"/>
                <text x="600" y="220" text-anchor="middle" font-size="13" fill="#000">aaBb（蓝斑）</text>

                <!-- 结论 -->
                <text x="400" y="275" text-anchor="middle" font-size="13" fill="#000">该白花植株可能基因型：</text>
                <text x="400" y="315" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e7d32">AaBb、AaBB、aabb</text>
            </g>
        </svg>

        <!-- 控件栏 -->
        <div id="scene3-controls">
            <button id="scene3-btn-prev" class="scene3-btn">◀ 上一步</button>
            <span id="scene3-step-indicator">步骤 1/5</span>
            <button id="scene3-btn-next" class="scene3-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        var currentStep = 1;
        var totalSteps = 5;

        var titles = [
            "F₂白花5种基因型及其比例",
            "各基因型自交结果对比",
            "紫花植株基因型拆解",
            "紫花植株测交推导",
            "体细胞突变分析"
        ];

        var titleEl = document.getElementById("scene3-title");
        var indicatorEl = document.getElementById("scene3-step-indicator");
        var prevBtn = document.getElementById("scene3-btn-prev");
        var nextBtn = document.getElementById("scene3-btn-next");

        function updateUI() {
            titleEl.textContent = titles[currentStep - 1];
            indicatorEl.textContent = "步骤 " + currentStep + "/" + totalSteps;
            prevBtn.disabled = (currentStep === 1);
            nextBtn.disabled = (currentStep === totalSteps);

            for (var i = 1; i <= totalSteps; i++) {
                var group = document.getElementById("scene3-step" + i + "-group");
                if (group) {
                    if (i === currentStep) {
                        group.classList.add("active");
                    } else {
                        group.classList.remove("active");
                    }
                }
            }
        }

        function goToStep(step) {
            if (step < 1 || step > totalSteps) return;
            currentStep = step;
            updateUI();
        }

        prevBtn.addEventListener("click", function() {
            goToStep(currentStep - 1);
        });

        nextBtn.addEventListener("click", function() {
            goToStep(currentStep + 1);
        });

        updateUI();
    })();
    </script>
</body>
</html>
