    <style>

        #scene3-btn-prev:disabled, #scene3-btn-next:disabled {
            opacity: 0.4; cursor: not-allowed;

        #scene3-step-indicator { font-size: 14px; color: #555; min-width: 80px; text-align: center; }
        .scene3-group { transition: opacity 200ms ease-in-out; }
        .scene3-hidden { opacity: 0; pointer-events: none; }

                    <text x="350" y="335" text-anchor="middle" font-size="11" fill="#000">Vvrr</text>
                    <text x="410" y="335" text-anchor="middle" font-size="11" fill="#000">vvRr</text>
                    <text x="470" y="335" text-anchor="middle" font-size="11" fill="#000">vvrr</text>
                </g>

                <!-- 右侧对比标题 -->
                <text x="660" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">理论 → 实际</text>

                <!-- 长翅细眼，增大间距避免拥挤 -->

    <script>
    (function() {
        // Scene 3 实现
        let currentStep = 0;
        const totalSteps = 6;

        const btnPrev = document.getElementById('scene3-btn-prev');
        const btnNext = document.getElementById('scene3-btn-next');
        const indicator = document.getElementById('scene3-step-indicator');

        const stepGroups = [
            document.getElementById('scene3-step0-group'),
            document.getElementById('scene3-step1-group'),
            document.getElementById('scene3-step2-group'),
            document.getElementById('scene3-step3-group'),
            document.getElementById('scene3-step4-group'),
            document.getElementById('scene3-step5-group')
        ];
        const leftInfo = document.getElementById('scene3-left-info');

        function updateUI() {
            // 更新步骤指示器
            indicator.textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;

            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps - 1);

            // 切换分组显示
            stepGroups.forEach(function(g, idx) {
                if (idx === currentStep) {
                    g.classList.remove('scene3-hidden');
                    g.classList.add('scene3-visible');
                    g.style.display = 'block';
                } else {
                    g.classList.remove('scene3-visible');
                    g.classList.add('scene3-hidden');
                    g.style.display = 'none';
                }
            });

            // 左侧简化信息在步骤1-4显示
            if (currentStep >= 1 && currentStep <= 4) {
                leftInfo.classList.remove('scene3-hidden');
                leftInfo.classList.add('scene3-visible');
                leftInfo.style.display = 'block';
            } else {
                leftInfo.classList.remove('scene3-visible');
                leftInfo.classList.add('scene3-hidden');
                leftInfo.style.display = 'none';
            }
        }

        function goToStep(n) {
            if (n < 0 || n >= totalSteps) return;
            currentStep = n;
            updateUI();
        }

        btnPrev.addEventListener('click', function() {
            goToStep(currentStep - 1);
        });

        btnNext.addEventListener('click', function() {
            goToStep(currentStep + 1);
        });

        // 初始化：确保所有非当前步骤组都隐藏
        stepGroups.forEach(function(g, idx) {
            if (idx !== currentStep) {
                g.style.display = 'none';
            }
        });
        leftInfo.style.display = 'none';
        updateUI();
    })();
    </script>
