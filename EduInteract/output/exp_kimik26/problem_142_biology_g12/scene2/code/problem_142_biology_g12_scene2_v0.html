<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 黑青毛突变体染色体组成与杂交鉴定</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene2-step-indicator { position: absolute; bottom: 6px; left: 0; right: 0; text-align: center; font-size: 12px; color: #666666; z-index: 10; }
        .scene2-btn { padding: 6px 16px; font-size: 14px; border: none; border-radius: 4px; cursor: pointer; color: #ffffff; background: #1565c0; }
        .scene2-btn:disabled { background: #cccccc; cursor: not-allowed; }
        .scene2-step-group { transition: opacity 0.25s ease-in; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 步骤标题 -->
            <text id="scene2-title" x="400" y="45" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">三种黑青毛突变体的染色体组成对比</text>

            <!-- ===== 步骤0：三种突变体染色体组成对比 ===== -->
            <g id="scene2-step0-group" class="scene2-step-group">
                <!-- 突变体甲 -->
                <line x1="50" y1="100" x2="250" y2="100" stroke="#000000" stroke-width="1.5"/>
                <line x1="250" y1="100" x2="250" y2="340" stroke="#000000" stroke-width="1.5"/>
                <line x1="250" y1="340" x2="50" y2="340" stroke="#000000" stroke-width="1.5"/>
                <line x1="50" y1="340" x2="50" y2="100" stroke="#000000" stroke-width="1.5"/>
                <text x="150" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">突变体甲</text>
                <!-- 三条染色体 -->
                <rect x="90" y="150" width="10" height="120" fill="#ffffff" stroke="#1565c0" stroke-width="2.5" rx="3"/>
                <rect x="120" y="150" width="10" height="120" fill="#ffffff" stroke="#1565c0" stroke-width="2.5" rx="3"/>
                <rect x="150" y="150" width="10" height="120" fill="#ffffff" stroke="#1565c0" stroke-width="2.5" rx="3"/>
                <!-- 基因标记 -->
                <circle cx="95" cy="142" r="4" fill="#1565c0"/>
                <circle cx="125" cy="142" r="4" fill="#888888"/>
                <circle cx="155" cy="142" r="4" fill="#888888"/>
                <text x="95" y="128" text-anchor="middle" font-size="10" fill="#1565c0" font-weight="bold">C</text>
                <text x="125" y="128" text-anchor="middle" font-size="10" fill="#888888" font-weight="bold">c</text>
                <text x="155" y="128" text-anchor="middle" font-size="10" fill="#888888" font-weight="bold">c</text>
                <text x="150" y="365" text-anchor="middle" font-size="12" fill="#333333">三条染色体分别携带C、c、c</text>

                <!-- 突变体乙 -->
                <line x1="300" y1="100" x2="500" y2="100" stroke="#000000" stroke-width="1.5"/>
                <line x1="500" y1="100" x2="500" y2="340" stroke="#000000" stroke-width="1.5"/>
                <line x1="500" y1="340" x2="300" y2="340" stroke="#000000" stroke-width="1.5"/>
                <line x1="300" y1="340" x2="300" y2="100" stroke="#000000" stroke-width="1.5"/>
                <text x="400" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">突变体乙</text>
                <!-- 两条染色体 -->
                <rect x="370" y="150" width="10" height="120" fill="#ffffff" stroke="#1565c0" stroke-width="2.5" rx="3"/>
                <rect x="430" y="150" width="10" height="120" fill="#ffffff" stroke="#1565c0" stroke-width="2.5" rx="3"/>
                <!-- 基因标记 -->
                <circle cx="375" cy="175" r="4" fill="#1565c0"/>
                <circle cx="375" cy="245" r="4" fill="#888888"/>
                <circle cx="435" cy="142" r="4" fill="#888888"/>
                <text x="360" y="178" text-anchor="end" font-size="10" fill="#1565c0" font-weight="bold">C</text>
                <text x="360" y="248" text-anchor="end" font-size="10" fill="#888888" font-weight="bold">c</text>
                <text x="435" y="128" text-anchor="middle" font-size="10" fill="#888888" font-weight="bold">c</text>
                <text x="400" y="365" text-anchor="middle" font-size="12" fill="#333333">C与c位于同一条染色体</text>

                <!-- 突变体丙 -->
                <line x1="550" y1="100" x2="750" y2="100" stroke="#000000" stroke-width="1.5"/>
                <line x1="750" y1="100" x2="750" y2="340" stroke="#000000" stroke-width="1.5"/>
                <line x1="750" y1="340" x2="550" y2="340" stroke="#000000" stroke-width="1.5"/>
                <line x1="550" y1="340" x2="550" y2="100" stroke="#000000" stroke-width="1.5"/>
                <text x="650" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">突变体丙</text>
                <!-- 两条染色体 -->
                <rect x="590" y="150" width="10" height="120" fill="#ffffff" stroke="#1565c0" stroke-width="2.5" rx="3"/>
                <rect x="650" y="150" width="10" height="120" fill="#ffffff" stroke="#1565c0" stroke-width="2.5" rx="3"/>
                <!-- 基因标记 -->
                <circle cx="595" cy="142" r="4" fill="#1565c0"/>
                <circle cx="655" cy="175" r="4" fill="#888888"/>
                <circle cx="655" cy="245" r="4" fill="#888888"/>
                <text x="595" y="128" text-anchor="middle" font-size="10" fill="#1565c0" font-weight="bold">C</text>
                <text x="670" y="178" text-anchor="start" font-size="10" fill="#888888" font-weight="bold">c</text>
                <text x="670" y="248" text-anchor="start" font-size="10" fill="#888888" font-weight="bold">c</text>
                <text x="650" y="365" text-anchor="middle" font-size="12" fill="#333333">c与c位于同一条染色体</text>
            </g>

            <!-- ===== 步骤1：实验设计 ===== -->
            <g id="scene2-step1-group" class="scene2-step-group" style="display:none">
                <!-- 左侧亲本框 -->
                <line x1="80" y1="120" x2="280" y2="120" stroke="#c62828" stroke-width="2"/>
                <line x1="280" y1="120" x2="280" y2="320" stroke="#c62828" stroke-width="2"/>
                <line x1="280" y1="320" x2="80" y2="320" stroke="#c62828" stroke-width="2"/>
                <line x1="80" y1="320" x2="80" y2="120" stroke="#c62828" stroke-width="2"/>
                <text x="180" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#c62828">aaBbCcc</text>
                <text x="180" y="345" text-anchor="middle" font-size="12" fill="#333333">待鉴定突变体</text>
                <!-- 左侧染色体 -->
                <rect x="130" y="160" width="10" height="120" fill="#ffffff" stroke="#1565c0" stroke-width="2.5" rx="3"/>
                <rect x="160" y="160" width="10" height="120" fill="#ffffff" stroke="#1565c0" stroke-width="2.5" rx="3"/>
                <rect x="190" y="160" width="10" height="120" fill="#ffffff" stroke="#1565c0" stroke-width="2.5" rx="3"/>
                <circle cx="135" cy="152" r="4" fill="#1565c0"/>
                <circle cx="165" cy="152" r="4" fill="#888888"/>
                <circle cx="195" cy="152" r="4" fill="#888888"/>
                <text x="135" y="138" text-anchor="middle" font-size="10" fill="#1565c0" font-weight="bold">C</text>
                <text x="165" y="138" text-anchor="middle" font-size="10" fill="#888888" font-weight="bold">c</text>
                <text x="195" y="138" text-anchor="middle" font-size="10" fill="#888888" font-weight="bold">c</text>

                <!-- 右侧亲本框 -->
                <line x1="520" y1="120" x2="720" y2="120" stroke="#2e7d32" stroke-width="2"/>
                <line x1="720" y1="120" x2="720" y2="320" stroke="#2e7d32" stroke-width="2"/>
                <line x1="720" y1="320" x2="520" y2="320" stroke="#2e7d32" stroke-width="2"/>
                <line x1="520" y1="320" x2="520" y2="120" stroke="#2e7d32" stroke-width="2"/>
                <text x="620" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e7d32">aaBBcc</text>
                <text x="620" y="345" text-anchor="middle" font-size="12" fill="#333333">纯种棕色猪</text>
                <!-- 右侧染色体 -->
                <rect x="570" y="160" width="10" height="120" fill="#ffffff" stroke="#1565c0" stroke-width="2.5" rx="3"/>
                <rect x="600" y="160" width="10" height="120" fill="#ffffff" stroke="#1565c0" stroke-width="2.5" rx="3"/>
                <circle cx="575" cy="152" r="4" fill="#888888"/>
                <circle cx="605" cy="152" r="4" fill="#888888"/>
                <text x="575" y="138" text-anchor="middle" font-size="10" fill="#888888" font-weight="bold">c</text>
                <text x="605" y="138" text-anchor="middle" font-size="10" fill="#888888" font-weight="bold">c</text>

                <!-- 杂交符号 -->
                <text x="400" y="190" text-anchor="middle" font-size="24" fill="#000000">×</text>
                <line x1="400" y1="210" x2="400" y2="250" stroke="#000000" stroke-width="2"/>
                <polygon points="395,245 400,255 405,245" fill="#000000"/>
                <text x="400" y="275" text-anchor="middle" font-size="14" fill="#000000">杂交实验</text>
                <text x="400" y="330" text-anchor="middle" font-size="13" fill="#666666">观察子代表现型及比例</text>
            </g>

            <!-- ===== 步骤2：突变体甲详细分析 ===== -->
            <g id="scene2-step2-group" class="scene2-step-group" style="display:none">
                <!-- 左栏：减数分裂示意 -->
                <line x1="50" y1="100" x2="230" y2="100" stroke="#000000" stroke-width="1.5"/>
                <line x1="230" y1="100" x2="230" y2="320" stroke="#000000" stroke-width="1.5"/>
                <line x1="230" y1="320" x2="50" y2="320" stroke="#000000" stroke-width="1.5"/>
                <line x1="50" y1="320" x2="50" y2="100" stroke="#000000" stroke-width="1.5"/>
                <rect x="90" y="150" width="10" height="120" fill="#ffffff" stroke="#1565c0" stroke-width="2.5" rx="3"/>
                <rect x="120" y="150" width="10" height="120" fill="#ffffff" stroke="#1565c0" stroke-width="2.5" rx="3"/>
                <rect x="150" y="150" width="10" height="120" fill="#ffffff" stroke="#1565c0" stroke-width="2.5" rx="3"/>
                <circle cx="95" cy="142" r="4" fill="#1565c0"/>
                <circle cx="125" cy="142" r="4" fill="#888888"/>
                <circle cx="155" cy="142" r="4" fill="#888888"/>
                <text x="95" y="128" text-anchor="middle" font-size="10" fill="#1565c0" font-weight="bold">C</text>
                <text x="125" y="128" text-anchor="middle" font-size="10" fill="#888888" font-weight="bold">c</text>
                <text x="155" y="128" text-anchor="middle" font-size="10" fill="#888888" font-weight="bold">c</text>
                <!-- 纺锤丝 -->
                <line x1="95" y1="150" x2="95" y2="105" stroke="#888888" stroke-width="1" stroke-dasharray="4,3"/>
                <line x1="125" y1="150" x2="125" y2="105" stroke="#888888" stroke-width="1" stroke-dasharray="4,3"/>
                <line x1="155" y1="150" x2="155" y2="105" stroke="#888888" stroke-width="1" stroke-dasharray="4,3"/>
                <line x1="95" y1="270" x2="95" y2="315" stroke="#888888" stroke-width="1" stroke-dasharray="4,3"/>
                <line x1="125" y1="270" x2="125" y2="315" stroke="#888888" stroke-width="1" stroke-dasharray="4,3"/>
                <line x1="155" y1="270" x2="155" y2="315" stroke="#888888" stroke-width="1" stroke-dasharray="4,3"/>
                <text x="140" y="345" text-anchor="middle" font-size="12" fill="#333333">三条染色体随机分离</text>

                <!-- 中栏：配子 -->
                <ellipse cx="330" cy="155" rx="35" ry="25" fill="#e3f2fd" fill-opacity="0.3" stroke="#1565c0" stroke-width="1.5"/>
                <ellipse cx="430" cy="155" rx="35" ry="25" fill="#e3f2fd" fill-opacity="0.3" stroke="#1565c0" stroke-width="1.5"/>
                <ellipse cx="330" cy="255" rx="35" ry="25" fill="#e3f2fd" fill-opacity="0.3" stroke="#1565c0" stroke-width="1.5"/>
                <ellipse cx="430" cy="255" rx="35" ry="25" fill="#e3f2fd" fill-opacity="0.3" stroke="#1565c0" stroke-width="1.5"/>
                <text x="330" y="125" text-anchor="middle" font-size="14" fill="#000000">C</text>
                <text x="430" y="125" text-anchor="middle" font-size="14" fill="#000000">c</text>
                <text x="330" y="225" text-anchor="middle" font-size="14" fill="#000000">Cc</text>
                <text x="430" y="225" text-anchor="middle" font-size="14" fill="#000000">cc</text>
                <text x="330" y="190" text-anchor="middle" font-size="12" fill="#666666">1</text>
                <text x="430" y="190" text-anchor="middle" font-size="12" fill="#666666">2</text>
                <text x="330" y="310" text-anchor="middle" font-size="12" fill="#666666">2</text>
                <text x="430" y="310" text-anchor="middle" font-size="12" fill="#666666">1</text>
                <text x="380" y="345" text-anchor="middle" font-size="13" fill="#000000">配子比例 1:2:2:1</text>

                <!-- 右栏：子代 -->
                <rect x="530" y="145" width="50" height="30" fill="#000000" fill-opacity="0.15" stroke="#000000" stroke-width="1"/>
                <rect x="530" y="215" width="50" height="30" fill="#c62828" fill-opacity="0.15" stroke="#c62828" stroke-width="1"/>
                <rect x="530" y="285" width="50" height="30" fill="#8d6e63" fill-opacity="0.2" stroke="#8d6e63" stroke-width="1"/>
                <text x="595" y="155" text-anchor="start" font-size="13" fill="#000000">黑色</text>
                <text x="595" y="225" text-anchor="start" font-size="13" fill="#000000">黑青色</text>
                <text x="595" y="295" text-anchor="start" font-size="13" fill="#000000">棕色</text>
                <text x="595" y="190" text-anchor="start" font-size="11" fill="#666666">Cc</text>
                <text x="595" y="260" text-anchor="start" font-size="11" fill="#666666">Ccc</text>
                <text x="595" y="330" text-anchor="start" font-size="11" fill="#666666">cc, ccc</text>
                <text x="680" y="165" text-anchor="start" font-size="13" fill="#000000">1/6</text>
                <text x="680" y="235" text-anchor="start" font-size="13" fill="#000000">2/6</text>
                <text x="680" y="305" text-anchor="start" font-size="13" fill="#000000">3/6</text>
                <text x="640" y="365" text-anchor="middle" font-size="13" fill="#000000">黑色:黑青色:棕色 = 1:2:3</text>
            </g>

            <!-- ===== 步骤3：突变体乙详细分析 ===== -->
            <g id="scene2-step3-group" class="scene2-step-group" style="display:none">
                <!-- 左栏 -->
                <line x1="50" y1="100" x2="230" y2="100" stroke="#000000" stroke-width="1.5"/>
                <line x1="230" y1="100" x2="230" y2="320" stroke="#000000" stroke-width="1.5"/>
                <line x1="230" y1="320" x2="50" y2="320" stroke="#000000" stroke-width="1.5"/>
                <line x1="50" y1="320" x2="50" y2="100" stroke="#000000" stroke-width="1.5"/>
                <rect x="100" y="150" width="10" height="120" fill="#ffffff" stroke="#1565c0" stroke-width="2.5" rx="3"/>
                <rect x="140" y="150" width="10" height="120" fill="#ffffff" stroke="#1565c0" stroke-width="2.5" rx="3"/>
                <circle cx="105" cy="175" r="4" fill="#1565c0"/>
                <circle cx="105" cy="245" r="4" fill="#888888"/>
                <circle cx="145" cy="142" r="4" fill="#888888"/>
                <text x="90" y="178" text-anchor="end" font-size="10" fill="#1565c0" font-weight="bold">C</text>
                <text x="90" y="248" text-anchor="end" font-size="10" fill="#888888" font-weight="bold">c</text>
                <text x="145" y="128" text-anchor="middle" font-size="10" fill="#888888" font-weight="bold">c</text>
                <!-- 纺锤丝 -->
                <line x1="100" y1="150" x2="100" y2="105" stroke="#888888" stroke-width="1" stroke-dasharray="4,3"/>
                <line x1="140" y1="150" x2="140" y2="105" stroke="#888888" stroke-width="1" stroke-dasharray="4,3"/>
                <line x1="100" y1="270" x2="100" y2="315" stroke="#888888" stroke-width="1" stroke-dasharray="4,3"/>
                <line x1="140" y1="270" x2="140" y2="315" stroke="#888888" stroke-width="1" stroke-dasharray="4,3"/>
                <text x="140" y="345" text-anchor="middle" font-size="12" fill="#333333">两条染色体分离</text>

                <!-- 中栏：配子 -->
                <ellipse cx="350" cy="160" rx="40" ry="30" fill="#e3f2fd" fill-opacity="0.3" stroke="#1565c0" stroke-width="1.5"/>
                <ellipse cx="350" cy="300" rx="40" ry="30" fill="#e3f2fd" fill-opacity="0.3" stroke="#1565c0" stroke-width="1.5"/>
                <text x="350" y="130" text-anchor="middle" font-size="14" fill="#000000">Cc</text>
                <text x="350" y="270" text-anchor="middle" font-size="14" fill="#000000">c</text>
                <text x="350" y="210" text-anchor="middle" font-size="12" fill="#666666">1</text>
                <text x="350" y="350" text-anchor="middle" font-size="12" fill="#666666">1</text>
                <text x="380" y="390" text-anchor="middle" font-size="13" fill="#000000">配子比例 1:1</text>

                <!-- 右栏：子代 -->
                <rect x="530" y="180" width="50" height="30" fill="#c62828" fill-opacity="0.15" stroke="#c62828" stroke-width="1"/>
                <rect x="530" y="280" width="50" height="30" fill="#8d6e63" fill-opacity="0.2" stroke="#8d6e63" stroke-width="1"/>
                <text x="595" y="190" text-anchor="start" font-size="13" fill="#000000">黑青色</text>
                <text x="595" y="290" text-anchor="start" font-size="13" fill="#000000">棕色</text>
                <text x="595" y="225" text-anchor="start" font-size="11" fill="#666666">Ccc</text>
                <text x="595" y="325" text-anchor="start" font-size="11" fill="#666666">cc</text>
                <text x="680" y="200" text-anchor="start" font-size="13" fill="#000000">1/2</text>
                <text x="680" y="300" text-anchor="start" font-size="13" fill="#000000">1/2</text>
                <text x="640" y="365" text-anchor="middle" font-size="13" fill="#000000">黑青色:棕色 = 1:1</text>
            </g>

            <!-- ===== 步骤4：突变体丙详细分析 ===== -->
            <g id="scene2-step4-group" class="scene2-step-group" style="display:none">
                <!-- 左栏 -->
                <line x1="50" y1="100" x2="230" y2="100" stroke="#000000" stroke-width="1.5"/>
                <line x1="230" y1="100" x2="230" y2="320" stroke="#000000" stroke-width="1.5"/>
                <line x1="230" y1="320" x2="50" y2="320" stroke="#000000" stroke-width="1.5"/>
                <line x1="50" y1="320" x2="50" y2="100" stroke="#000000" stroke-width="1.5"/>
                <rect x="100" y="150" width="10" height="120" fill="#ffffff" stroke="#1565c0" stroke-width="2.5" rx="3"/>
                <rect x="140" y="150" width="10" height="120" fill="#ffffff" stroke="#1565c0" stroke-width="2.5" rx="3"/>
                <circle cx="105" cy="142" r="4" fill="#1565c0"/>
                <circle cx="145" cy="175" r="4" fill="#888888"/>
                <circle cx="145" cy="245" r="4" fill="#888888"/>
                <text x="105" y="128" text-anchor="middle" font-size="10" fill="#1565c0" font-weight="bold">C</text>
                <text x="160" y="178" text-anchor="start" font-size="10" fill="#888888" font-weight="bold">c</text>
                <text x="160" y="248" text-anchor="start" font-size="10" fill="#888888" font-weight="bold">c</text>
                <!-- 纺锤丝 -->
                <line x1="100" y1="150" x2="100" y2="105" stroke="#888888" stroke-width="1" stroke-dasharray="4,3"/>
                <line x1="140" y1="150" x2="140" y2="105" stroke="#888888" stroke-width="1" stroke-dasharray="4,3"/>
                <line x1="100" y1="270" x2="100" y2="315" stroke="#888888" stroke-width="1" stroke-dasharray="4,3"/>
                <line x1="140" y1="270" x2="140" y2="315" stroke="#888888" stroke-width="1" stroke-dasharray="4,3"/>
                <text x="140" y="345" text-anchor="middle" font-size="12" fill="#333333">两条染色体分离</text>

                <!-- 中栏：配子 -->
                <ellipse cx="350" cy="160" rx="40" ry="30" fill="#e3f2fd" fill-opacity="0.3" stroke="#1565c0" stroke-width="1.5"/>
                <ellipse cx="350" cy="300" rx="40" ry="30" fill="#e3f2fd" fill-opacity="0.3" stroke="#1565c0" stroke-width="1.5"/>
                <text x="350" y="130" text-anchor="middle" font-size="14" fill="#000000">C</text>
                <text x="350" y="270" text-anchor="middle" font-size="14" fill="#000000">cc</text>
                <text x="350" y="210" text-anchor="middle" font-size="12" fill="#666666">1</text>
                <text x="350" y="350" text-anchor="middle" font-size="12" fill="#666666">1</text>
                <text x="380" y="390" text-anchor="middle" font-size="13" fill="#000000">配子比例 1:1</text>

                <!-- 右栏：子代 -->
                <rect x="530" y="180" width="50" height="30" fill="#000000" fill-opacity="0.15" stroke="#000000" stroke-width="1"/>
                <rect x="530" y="280" width="50" height="30" fill="#8d6e63" fill-opacity="0.2" stroke="#8d6e63" stroke-width="1"/>
                <text x="595" y="190" text-anchor="start" font-size="13" fill="#000000">黑色</text>
                <text x="595" y="290" text-anchor="start" font-size="13" fill="#000000">棕色</text>

        </div>
        <div id="scene2-step-indicator">步骤 1 / 6</div>
    </div>

    <script>
    (function() {
        // Scene 2 实现
        var currentStep = 0;
        var totalSteps = 6;
        var titles = [
            "图2 三种黑青毛突变体的染色体组成对比",
            "实验设计：待鉴定突变体 × 纯种棕色猪",
            "突变体甲（C/c/c）详细分析",
            "突变体乙（Cc/c）详细分析",
            "突变体丙（C/cc）详细分析",
            "三种突变体杂交结果汇总对比"
        ];

        var btnPrev = document.getElementById('scene2-btn-prev');
        var btnNext = document.getElementById('scene2-btn-next');
        var indicator = document.getElementById('scene2-step-indicator');
        var titleEl = document.getElementById('scene2-title');

        function updateStep() {
            // 隐藏所有步骤组
            for (var i = 0; i < totalSteps; i++) {
                var group = document.getElementById('scene2-step' + i + '-group');
                if (group) {
                    group.style.display = 'none';
                    group.style.opacity = '0';
                }
            }
            // 显示当前步骤组
            var currentGroup = document.getElementById('scene2-step' + currentStep + '-group');
            if (currentGroup) {
                currentGroup.style.display = 'block';
                // 淡入效果
                requestAnimationFrame(function() {
                    currentGroup.style.opacity = '1';
                });
            }
            // 更新标题
            titleEl.textContent = titles[currentStep];
            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps - 1);
            // 更新指示器
            indicator.textContent = '步骤 ' + (currentStep + 1) + ' / ' + totalSteps;
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateStep();
            }
        });

        // 初始化
        updateStep();
    })();
    </script>
</body>
