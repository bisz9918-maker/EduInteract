<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>草原生态系统食物网能量流动</title>
<style>
body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
#scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
#scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
#scene2-step-indicator { font-size: 12px; color: #888888; position: absolute; bottom: 52px; left: 0; right: 0; text-align: center; }
.scene2-btn { width: 80px; height: 36px; border-radius: 4px; font-size: 14px; cursor: pointer; border: 1px solid #cccccc; background: #ffffff; color: #333333; transition: all 0.2s ease; }
.scene2-btn:hover:not(:disabled) { background: #f5f5f5; }
.scene2-btn:disabled { opacity: 0.4; cursor: not-allowed; }
#scene2-btn-next { background: #1565c0; color: #ffffff; border-color: #1565c0; }
#scene2-btn-next:hover:not(:disabled) { background: #0d47a1; }
.scene2-node { transition: all 0.4s ease-in-out; }
.scene2-link { transition: stroke 0.25s ease, stroke-width 0.25s ease; }
.scene2-value-box { transition: opacity 0.3s ease-out; }
.scene2-label { transition: opacity 0.3s ease-out; }
.scene2-conclusion { transition: opacity 0.3s ease-out; }
</style>
</head>
<body>
<div id="scene2-container">
<svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500">
<defs>
<marker id="scene2-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#000000"/></marker>
<marker id="scene2-arrow-highlight" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#1565c0"/></marker>
</defs>

<!-- 连线 -->
<line id="scene2-link-grass-antelope" class="scene2-link" x1="90" y1="250" x2="130" y2="120" stroke="#cccccc" stroke-width="1" marker-end="url(#scene2-arrow)"/>
<line id="scene2-link-grass-zebra" class="scene2-link" x1="90" y1="250" x2="130" y2="250" stroke="#cccccc" stroke-width="1" marker-end="url(#scene2-arrow)"/>
<line id="scene2-link-grass-mouse" class="scene2-link" x1="90" y1="250" x2="130" y2="380" stroke="#cccccc" stroke-width="1" marker-end="url(#scene2-arrow)"/>
<line id="scene2-link-antelope-wilddog" class="scene2-link" x1="210" y1="120" x2="290" y2="150" stroke="#cccccc" stroke-width="1" marker-end="url(#scene2-arrow)"/>
<line id="scene2-link-antelope-lion" class="scene2-link" x1="210" y1="120" x2="520" y2="250" stroke="#cccccc" stroke-width="1" marker-end="url(#scene2-arrow)"/>
<line id="scene2-link-zebra-wilddog" class="scene2-link" x1="210" y1="250" x2="290" y2="170" stroke="#cccccc" stroke-width="1" marker-end="url(#scene2-arrow)"/>
<line id="scene2-link-zebra-lion" class="scene2-link" x1="210" y1="250" x2="520" y2="250" stroke="#cccccc" stroke-width="1" marker-end="url(#scene2-arrow)"/>
<line id="scene2-link-mouse-snake" class="scene2-link" x1="210" y1="380" x2="290" y2="380" stroke="#cccccc" stroke-width="1" marker-end="url(#scene2-arrow)"/>
<line id="scene2-link-snake-snakeeater" class="scene2-link" x1="370" y1="380" x2="430" y2="380" stroke="#cccccc" stroke-width="1" marker-end="url(#scene2-arrow)"/>
<line id="scene2-link-snakeeater-lion" class="scene2-link" x1="510" y1="380" x2="560" y2="270" stroke="#cccccc" stroke-width="1" marker-end="url(#scene2-arrow)"/>
<line id="scene2-link-wilddog-lion" class="scene2-link" x1="370" y1="170" x2="520" y2="250" stroke="#cccccc" stroke-width="1" marker-end="url(#scene2-arrow)"/>

<!-- 节点 -->
<g id="scene2-node-grass" class="scene2-node"><rect x="10" y="230" width="80" height="40" rx="6" ry="6" fill="#2e7d32" stroke="#000000" stroke-width="2"/><text x="50" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">草</text></g>
<g id="scene2-node-antelope" class="scene2-node"><rect x="130" y="100" width="80" height="40" rx="6" ry="6" fill="rgba(21,101,192,0.15)" stroke="#000000" stroke-width="2"/><text x="170" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">羚羊</text></g>
<g id="scene2-node-zebra" class="scene2-node"><rect x="130" y="230" width="80" height="40" rx="6" ry="6" fill="rgba(21,101,192,0.15)" stroke="#000000" stroke-width="2"/><text x="170" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">斑马</text></g>
<g id="scene2-node-mouse" class="scene2-node"><rect x="130" y="360" width="80" height="40" rx="6" ry="6" fill="rgba(21,101,192,0.15)" stroke="#000000" stroke-width="2"/><text x="170" y="385" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">鼠</text></g>
<g id="scene2-node-wilddog" class="scene2-node"><rect x="290" y="130" width="80" height="40" rx="6" ry="6" fill="rgba(198,40,40,0.15)" stroke="#000000" stroke-width="2"/><text x="330" y="155" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">野狗</text></g>
<g id="scene2-node-snake" class="scene2-node"><rect x="290" y="360" width="80" height="40" rx="6" ry="6" fill="rgba(198,40,40,0.15)" stroke="#000000" stroke-width="2"/><text x="330" y="385" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">蛇</text></g>
<g id="scene2-node-snakeeater" class="scene2-node"><rect x="430" y="360" width="80" height="40" rx="6" ry="6" fill="rgba(255,143,0,0.15)" stroke="#000000" stroke-width="2"/><text x="470" y="385" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">食蛇动物</text></g>
<g id="scene2-node-lion" class="scene2-node"><rect id="scene2-lion-rect" x="520" y="230" width="80" height="40" rx="6" ry="6" fill="rgba(106,27,154,0.15)" stroke="#000000" stroke-width="2"/><text id="scene2-lion-text" x="560" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">狮子</text></g>

<!-- 数值框 -->
<g id="scene2-value-grass" class="scene2-value-box"><rect x="15" y="280" width="70" height="24" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1"/><text x="50" y="297" text-anchor="middle" font-size="14" fill="#000000">300万</text></g>
<g id="scene2-value-antelope" class="scene2-value-box" style="display:none;opacity:0"><rect x="220" y="70" width="60" height="24" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1"/><text id="scene2-text-antelope" x="250" y="87" text-anchor="middle" font-size="14" fill="#000000">10万</text></g>
<g id="scene2-value-zebra" class="scene2-value-box" style="display:none;opacity:0"><rect x="220" y="195" width="60" height="24" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1"/><text id="scene2-text-zebra" x="250" y="212" text-anchor="middle" font-size="14" fill="#000000">10万</text></g>
<g id="scene2-value-mouse" class="scene2-value-box" style="display:none;opacity:0"><rect x="220" y="405" width="80" height="24" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1"/><text id="scene2-text-mouse" x="260" y="422" text-anchor="middle" font-size="14" fill="#000000">10万</text></g>
<g id="scene2-value-wilddog" class="scene2-value-box" style="display:none;opacity:0"><rect x="380" y="105" width="60" height="24" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1"/><text id="scene2-text-wilddog" x="410" y="122" text-anchor="middle" font-size="14" fill="#000000">1万</text></g>
<g id="scene2-value-snake" class="scene2-value-box" style="display:none;opacity:0"><rect x="380" y="405" width="60" height="24" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1"/><text id="scene2-text-snake" x="410" y="422" text-anchor="middle" font-size="14" fill="#000000">1万</text></g>
<g id="scene2-value-snakeeater" class="scene2-value-box" style="display:none;opacity:0"><rect x="520" y="405" width="70" height="24" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1"/><text id="scene2-text-snakeeater" x="555" y="422" text-anchor="middle" font-size="14" fill="#000000">0.1万</text></g>
<g id="scene2-value-lion" class="scene2-value-box" style="display:none;opacity:0"><rect x="520" y="290" width="80" height="24" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1"/><text id="scene2-text-lion" x="560" y="307" text-anchor="middle" font-size="14" fill="#000000">1.11万</text></g>

<!-- 标签 -->
<text id="scene2-label-note" class="scene2-label" x="120" y="65" font-size="13" fill="#333333">传递效率10%</text>
<text id="scene2-label-30w" class="scene2-label" x="120" y="160" font-size="13" fill="#333333" style="display:none;opacity:0">草出射：30万</text>
<text id="scene2-label-avg1" class="scene2-label" x="290" y="105" font-size="12" fill="#888888" font-style="italic" style="display:none;opacity:0">平均摄食：1/2</text>
<text id="scene2-label-avg2" class="scene2-label" x="290" y="280" font-size="12" fill="#888888" font-style="italic" style="display:none;opacity:0">平均摄食：1/2</text>
<text id="scene2-label-mouse10" class="scene2-label" x="250" y="355" font-size="12" fill="#888888" font-style="italic" style="display:none;opacity:0">10%</text>
<text id="scene2-label-direct" class="scene2-label" x="640" y="225" font-size="13" fill="#333333" style="display:none;opacity:0">直接：1万</text>

<line id="scene2-dashed1" class="scene2-label" x1="600" y1="250" x2="640" y2="255" stroke="#888888" stroke-width="1" stroke-dasharray="4,3" style="display:none;opacity:0"/>
<line id="scene2-dashed2" class="scene2-label" x1="600" y1="250" x2="640" y2="290" stroke="#888888" stroke-width="1" stroke-dasharray="4,3" style="display:none;opacity:0"/>
<text id="scene2-label-indirect1" class="scene2-label" x="640" y="255" font-size="13" fill="#333333" style="display:none;opacity:0">野狗→狮子：0.1万</text>
<text id="scene2-label-indirect2" class="scene2-label" x="640" y="290" font-size="13" fill="#333333" style="display:none;opacity:0">食蛇动物→狮子：0.01万</text>

<text id="scene2-label-total-formula" class="scene2-label" x="560" y="365" text-anchor="middle" font-size="14" fill="#000000" style="display:none;opacity:0">总能量 = 0.5 + 0.5 + 0.1 + 0.01 = 1.11万千焦</text>
<text id="scene2-label-survive" class="scene2-label" x="560" y="390" text-anchor="middle" font-size="13" fill="#666666" style="display:none;opacity:0">维持种群生存所需能量</text>

<!-- 结论信息框 -->
<g id="scene2-conclusion-box" class="scene2-conclusion" style="display:none;opacity:0">
<rect x="620" y="140" width="130" height="120" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<rect x="620" y="140" width="4" height="120" rx="2" fill="#2e7d32"/>
<text x="630" y="170" font-size="12" fill="#000000">面积倍数 ≈ 1.11÷0.57</text>
<text x="630" y="200" font-size="12" fill="#000000">≈ 2倍</text>
<text x="630" y="230" font-size="12" fill="#000000">草原面积有限时，</text>
<text x="630" y="260" font-size="12" fill="#000000">狮子种群密度将下降</text>
</g>
</svg>

<div id="scene2-step-indicator">步骤 0/7</div>
<div id="scene2-controls">
<button id="scene2-btn-prev" class="scene2-btn" disabled>◀ 上一步</button>
<button id="scene2-btn-next" class="scene2-btn">下一步 ▶</button>
</div>
</div>

<script>
(function() {
let currentStep = 0;
const totalSteps = 7;

const els = {
prevBtn: document.getElementById('scene2-btn-prev'),
nextBtn: document.getElementById('scene2-btn-next'),
indicator: document.getElementById('scene2-step-indicator'),
lionRect: document.getElementById('scene2-lion-rect'),
lionText: document.getElementById('scene2-lion-text'),
links: {
'grass-antelope': document.getElementById('scene2-link-grass-antelope'),
'grass-zebra': document.getElementById('scene2-link-grass-zebra'),
'grass-mouse': document.getElementById('scene2-link-grass-mouse'),
'antelope-wilddog': document.getElementById('scene2-link-antelope-wilddog'),
'antelope-lion': document.getElementById('scene2-link-antelope-lion'),
'zebra-wilddog': document.getElementById('scene2-link-zebra-wilddog'),
'zebra-lion': document.getElementById('scene2-link-zebra-lion'),
'mouse-snake': document.getElementById('scene2-link-mouse-snake'),
'snake-snakeeater': document.getElementById('scene2-link-snake-snakeeater'),
'snakeeater-lion': document.getElementById('scene2-link-snakeeater-lion'),
'wilddog-lion': document.getElementById('scene2-link-wilddog-lion')
},
values: {
grass: document.getElementById('scene2-value-grass'),
antelope: document.getElementById('scene2-value-antelope'),
zebra: document.getElementById('scene2-value-zebra'),
mouse: document.getElementById('scene2-value-mouse'),
wilddog: document.getElementById('scene2-value-wilddog'),
snake: document.getElementById('scene2-value-snake'),
snakeeater: document.getElementById('scene2-value-snakeeater'),
lion: document.getElementById('scene2-value-lion')
},
texts: {
antelope: document.getElementById('scene2-text-antelope'),
zebra: document.getElementById('scene2-text-zebra'),
mouse: document.getElementById('scene2-text-mouse'),
wilddog: document.getElementById('scene2-text-wilddog'),
snake: document.getElementById('scene2-text-snake'),
snakeeater: document.getElementById('scene2-text-snakeeater'),
lion: document.getElementById('scene2-text-lion')
},
labels: {
note: document.getElementById('scene2-label-note'),
'30w': document.getElementById('scene2-label-30w'),
avg1: document.getElementById('scene2-label-avg1'),
avg2: document.getElementById('scene2-label-avg2'),
mouse10: document.getElementById('scene2-label-mouse10'),
direct: document.getElementById('scene2-label-direct'),
indirect1: document.getElementById('scene2-label-indirect1'),
indirect2: document.getElementById('scene2-label-indirect2'),
totalFormula: document.getElementById('scene2-label-total-formula'),
survive: document.getElementById('scene2-label-survive')
},
dashed: {
d1: document.getElementById('scene2-dashed1'),
d2: document.getElementById('scene2-dashed2')
},
conclusion: document.getElementById('scene2-conclusion-box')
};

function show(el) {
if (!el) return;
el.style.display = '';
el.style.opacity = '1';
el.setAttribute('opacity', '1');
}

function hide(el) {
if (!el) return;
el.style.display = 'none';
el.style.opacity = '0';
el.setAttribute('opacity', '0');
}

function setLinkHighlight(linkIds, highlight) {
linkIds.forEach(id => {
const link = els.links[id];
if (!link) return;
if (highlight) {
link.setAttribute('stroke', '#1565c0');
link.setAttribute('stroke-width', '3');
link.setAttribute('marker-end', 'url(#scene2-arrow-highlight)');
} else {
link.setAttribute('stroke', '#cccccc');
link.setAttribute('stroke-width', '1');
link.setAttribute('marker-end', 'url(#scene2-arrow)');
}
});
}

function resetLion() {
els.lionRect.setAttribute('x', '520');
els.lionRect.setAttribute('y', '230');
els.lionRect.setAttribute('width', '80');
els.lionRect.setAttribute('height', '40');
els.lionRect.setAttribute('stroke', '#000000');
els.lionRect.setAttribute('stroke-width', '2');
els.lionRect.style.filter = 'none';
els.lionText.setAttribute('x', '560');
els.lionText.setAttribute('y', '255');
}

function highlightLion() {
els.lionRect.setAttribute('x', '510');
els.lionRect.setAttribute('y', '225');
els.lionRect.setAttribute('width', '100');
els.lionRect.setAttribute('height', '50');
els.lionRect.setAttribute('stroke', '#c62828');
els.lionRect.setAttribute('stroke-width', '4');
els.lionRect.style.filter = 'drop-shadow(0 0 4px rgba(198,40,40,0.4))';
els.lionText.setAttribute('x', '560');
els.lionText.setAttribute('y', '257');
}

function hideAllDynamic() {
Object.keys(els.values).forEach(k => { if (k !== 'grass') hide(els.values[k]); });
Object.keys(els.labels).forEach(k => hide(els.labels[k]));
hide(els.dashed.d1);
hide(els.dashed.d2);
hide(els.conclusion);
resetLion();
Object.keys(els.links).forEach(k => {
const link = els.links[k];
link.setAttribute('stroke', '#cccccc');
link.setAttribute('stroke-width', '1');
link.setAttribute('marker-end', 'url(#scene2-arrow)');
});
}

function renderStep(step) {
hideAllDynamic();
els.indicator.textContent = '步骤 ' + step + '/7';
els.prevBtn.disabled = (step === 0);
els.nextBtn.disabled = (step === totalSteps);
show(els.values.grass);

switch (step) {
case 0:
els.labels.note.textContent = '传递效率10%';
show(els.labels.note);
break;
case 1:
setLinkHighlight(['grass-antelope', 'grass-zebra', 'grass-mouse'], true);
els.labels.note.textContent = '三种生物平均分配';
show(els.labels.note);
show(els.labels['30w']);
show(els.values.antelope);
show(els.values.zebra);
show(els.values.mouse);
els.texts.antelope.textContent = '10万';
els.texts.zebra.textContent = '10万';
els.texts.mouse.textContent = '10万';
break;
case 2:
setLinkHighlight(['antelope-wilddog', 'antelope-lion', 'zebra-wilddog', 'zebra-lion', 'mouse-snake'], true);
show(els.labels.avg1);
show(els.labels.avg2);
show(els.labels.mouse10);
show(els.values.antelope);
show(els.values.zebra);
show(els.values.mouse);
show(els.values.wilddog);
show(els.values.snake);
show(els.labels.direct);
els.texts.antelope.textContent = '10万';
els.texts.zebra.textContent = '10万';
els.texts.mouse.textContent = '10万';
els.texts.wilddog.textContent = '1万';
els.texts.snake.textContent = '1万';
break;
case 3:
setLinkHighlight(['wilddog-lion', 'snake-snakeeater', 'snakeeater-lion'], true);
show(els.values.antelope);
show(els.values.zebra);
show(els.values.mouse);
show(els.values.wilddog);
show(els.values.snake);
show(els.values.snakeeater);
show(els.dashed.d1);
show(els.dashed.d2);
show(els.labels.indirect1);
show(els.labels.indirect2);
els.texts.antelope.textContent = '10万';
els.texts.zebra.textContent = '10万';
els.texts.mouse.textContent = '10万';
els.texts.wilddog.textContent = '1万';
els.texts.snake.textContent = '1万';
els.texts.snakeeater.textContent = '0.1万';
break;
case 4:
highlightLion();
show(els.values.antelope);
show(els.values.zebra);
show(els.values.mouse);
show(els.values.wilddog);
show(els.values.snake);
show(els.values.snakeeater);
show(els.values.lion);
show(els.labels.totalFormula);
show(els.labels.survive);
els.texts.antelope.textContent = '10万';
els.texts.zebra.textContent = '10万';
els.texts.mouse.textContent = '10万';
els.texts.wilddog.textContent = '1万';
els.texts.snake.textContent = '1万';
els.texts.snakeeater.textContent = '0.1万';
els.texts.lion.textContent = '1.11万';
break;
case 5:
els.labels.note.textContent = '鼠类爆发，其他生物量被平均摄食';
show(els.labels.note);
show(els.values.antelope);
show(els.values.zebra);
show(els.values.mouse);
els.texts.antelope.textContent = '5万';
els.texts.zebra.textContent = '5万';
els.texts.mouse.textContent = '20万（占2/3）';
break;
case 6:
setLinkHighlight(['antelope-wilddog', 'antelope-lion', 'zebra-wilddog', 'zebra-lion', 'mouse-snake'], true);
show(els.labels.avg1);
show(els.labels.avg2);
show(els.labels.mouse10);
show(els.values.antelope);
show(els.values.zebra);
show(els.values.mouse);
show(els.values.wilddog);
show(els.values.snake);
show(els.labels.direct);
els.texts.antelope.textContent = '5万';
els.texts.zebra.textContent = '5万';
els.texts.mouse.textContent = '20万（占2/3）';
els.texts.wilddog.textContent = '0.5万';
els.texts.snake.textContent = '2万';
els.labels.direct.textContent = '直接：0.5万';
break;
case 7:
setLinkHighlight(['wilddog-lion', 'snake-snakeeater', 'snakeeater-lion'], true);
highlightLion();
show(els.values.antelope);
show(els.values.zebra);
show(els.values.mouse);
show(els.values.wilddog);
show(els.values.snake);
show(els.values.snakeeater);
show(els.values.lion);
show(els.conclusion);
els.texts.antelope.textContent = '5万';
els.texts.zebra.textContent = '5万';
els.texts.mouse.textContent = '20万（占2/3）';
els.texts.wilddog.textContent = '0.5万';
els.texts.snake.textContent = '2万';
els.texts.snakeeater.textContent = '0.2万';
els.texts.lion.textContent = '0.57万';
break;
}
}

els.prevBtn.addEventListener('click', function() {
if (currentStep > 0) { currentStep--; renderStep(currentStep); }
});
els.nextBtn.addEventListener('click', function() {
if (currentStep < totalSteps) { currentStep++; renderStep(currentStep); }
});

renderStep(0);
})();
</script>
</body>
</html>
