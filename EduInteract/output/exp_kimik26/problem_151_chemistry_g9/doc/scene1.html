<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>甲烷燃烧微观反应</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }

        /* 控件栏 */
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 16px; z-index: 10; }
        #scene1-controls button {
            padding: 6px 16px; font-size: 14px; cursor: pointer;
            border: 1px solid #333; border-radius: 4px; background: #f5f5f5;
            transition: opacity 0.2s;
        }
        #scene1-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 14px; color: #333; min-width: 160px; text-align: center; }

        /* SVG 步骤组显隐 */
        .scene1-svg-group { display: none; }
        .scene1-svg-group.active { display: block; }

        /* 追踪线 */
        .scene1-tracker { stroke-dasharray: 4,4; opacity: 0; transition: opacity 0.3s; }
        .scene1-tracker.active { opacity: 0.55; }
        .scene1-tracker.dim { opacity: 0.2; }

        /* HTML 绝对定位元素显隐 */
        .scene1-html-group { display: none; }
        .scene1-html-group.active { display: block; }

        /* 图例 */
        #scene1-legend {
            position: absolute; right: 15px; top: 15px;
            width: 115px; padding: 8px 10px;
            border: 1px solid #ccc; border-radius: 4px;
            font-size: 12px; background: #fff; line-height: 1.4;
        }
        .scene1-legend-row { display: flex; align-items: center; margin-bottom: 6px; }
        .scene1-legend-row:last-child { margin-bottom: 0; }
        .scene1-legend-icon { width: 14px; height: 14px; border-radius: 50%; margin-right: 8px; flex-shrink: 0; }
        .scene1-legend-h { border: 1.5px solid #000; background: #fff; }
        .scene1-legend-o { background: #000; }
        .scene1-legend-c {
            border: 1.5px solid #000;
            background: repeating-linear-gradient(45deg, #fff, #fff 2px, #888 2px, #888 4px);
        }

        /* 数量框 */
        .scene1-count-box {
            position: absolute; background: rgba(21,101,192,0.12);
            border-radius: 4px; pointer-events: none;
        }
        .scene1-count-label {
            position: absolute; font-size: 14px; color: #1565c0;
            font-weight: bold; text-align: center; width: 30px;
        }

        /* 计数表 */
        #scene1-count-table-wrap {
            position: absolute; left: 40px; top: 280px;
            width: 240px; font-size: 14px;
        }
        #scene1-count-table-title {
            text-align: center; font-weight: bold; margin-bottom: 4px; font-size: 14px;
        }
        #scene1-count-table {
            width: 100%; border-collapse: collapse;
            border: 1px solid #000; border-radius: 5px;
        }
        #scene1-count-table th, #scene1-count-table td {
            text-align: center; padding: 5px 8px;
        }
        #scene1-count-table thead tr { border-bottom: 1px solid #000; }
        #scene1-count-table tbody tr { height: 26px; }
        #scene1-count-table td:first-child, #scene1-count-table th:first-child { text-align: left; padding-left: 12px; }
        #scene1-count-hint {
            text-align: center; margin-top: 6px; font-size: 13px; font-weight: bold; min-height: 18px;
        }

        /* 方程式 */
        #scene1-equation-wrap {
            position: absolute; left: 300px; top: 280px;
            width: 260px; text-align: center; font-size: 16px;
        }
        #scene1-equation-ignite { font-size: 12px; margin-bottom: 2px; }
        #scene1-equation-text { font-size: 16px; }
        .scene1-coef { color: #1565c0; font-weight: bold; }

        /* 选项 */
        #scene1-options-wrap {
            position: absolute; left: 440px; top: 340px;
            width: 340px; font-size: 12px; line-height: 1.5;
        }
        .scene1-option {
            padding: 5px 10px; margin-bottom: 10px; border-radius: 4px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .scene1-option-a { background: rgba(46,125,50,0.08); color: #2e7d32; }
        .scene1-option-bcd { background: rgba(198,40,40,0.08); color: #c62828; }
        .scene1-option-mark { font-weight: bold; margin-left: 8px; white-space: nowrap; }

        /* 标签 */
        .scene1-label {
            position: absolute; font-size: 14px; color: #000;
            text-align: center; width: 40px;
        }
        .scene1-plus {
            position: absolute; font-size: 18px; color: #000;
            font-weight: bold; text-align: center; width: 20px;
        }
        .scene1-ignite {
            position: absolute; font-size: 14px; color: #000;
            text-align: center; width: 40px;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <!-- SVG 图示区 -->
        <svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <pattern id="scene1-carbon-pattern" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
                    <line x1="0" y1="0" x2="0" y2="6" stroke="#888888" stroke-width="1.5"/>
                </pattern>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
                </marker>
            </defs>

            <!-- ===== 反应物区 ===== -->
            <!-- CH₄ -->
            <g id="scene1-ch4">
                <line x1="140" y1="115" x2="140" y2="88" stroke="#000" stroke-width="2"/>
                <line x1="140" y1="115" x2="113" y2="115" stroke="#000" stroke-width="2"/>
                <line x1="140" y1="115" x2="167" y2="115" stroke="#000" stroke-width="2"/>
                <line x1="140" y1="115" x2="140" y2="142" stroke="#000" stroke-width="2"/>
                <circle cx="140" cy="115" r="13" fill="url(#scene1-carbon-pattern)" stroke="#000" stroke-width="1.5"/>
                <circle cx="140" cy="88" r="10" fill="#fff" stroke="#000" stroke-width="1.5"/>
                <circle cx="113" cy="115" r="10" fill="#fff" stroke="#000" stroke-width="1.5"/>
                <circle cx="167" cy="115" r="10" fill="#fff" stroke="#000" stroke-width="1.5"/>
                <circle cx="140" cy="142" r="10" fill="#fff" stroke="#000" stroke-width="1.5"/>
            </g>

            <!-- O₂ 初始（步骤0-2） -->
            <g id="scene1-o2-initial" class="scene1-svg-group active">
                <line x1="265" y1="115" x2="295" y2="115" stroke="#000" stroke-width="2"/>
                <circle cx="265" cy="115" r="12" fill="#000"/>
                <circle cx="295" cy="115" r="12" fill="#000"/>
            </g>

            <!-- O₂ 配平后（步骤3+） -->
            <g id="scene1-o2-balanced" class="scene1-svg-group">
                <line x1="265" y1="95" x2="295" y2="95" stroke="#000" stroke-width="2"/>
                <circle cx="265" cy="95" r="12" fill="#000"/>
                <circle cx="295" cy="95" r="12" fill="#000"/>
                <line x1="265" y1="135" x2="295" y2="135" stroke="#000" stroke-width="2"/>
                <circle cx="265" cy="135" r="12" fill="#000"/>
                <circle cx="295" cy="135" r="12" fill="#000"/>
            </g>

            <!-- 反应箭头 -->
            <line x1="340" y1="115" x2="430" y2="115" stroke="#000" stroke-width="3" marker-end="url(#scene1-arrowhead)"/>

            <!-- ===== 生成物区 ===== -->
            <!-- CO₂ -->
            <g id="scene1-co2">
                <line x1="490" y1="115" x2="520" y2="115" stroke="#000" stroke-width="2"/>
                <line x1="520" y1="115" x2="550" y2="115" stroke="#000" stroke-width="2"/>
                <circle cx="490" cy="115" r="12" fill="#000"/>
                <circle cx="520" cy="115" r="13" fill="url(#scene1-carbon-pattern)" stroke="#000" stroke-width="1.5"/>
                <circle cx="550" cy="115" r="12" fill="#000"/>
            </g>

            <!-- H₂O 初始（步骤0-2） -->
            <g id="scene1-h2o-initial" class="scene1-svg-group active">
                <line x1="660" y1="110" x2="640" y2="140" stroke="#000" stroke-width="2"/>
                <line x1="660" y1="110" x2="680" y2="140" stroke="#000" stroke-width="2"/>
                <circle cx="660" cy="110" r="12" fill="#000"/>
                <circle cx="640" cy="140" r="10" fill="#fff" stroke="#000" stroke-width="1.5"/>
                <circle cx="680" cy="140" r="10" fill="#fff" stroke="#000" stroke-width="1.5"/>
            </g>

            <!-- H₂O 配平后（步骤3+） -->
            <g id="scene1-h2o-balanced" class="scene1-svg-group">
                <line x1="640" y1="110" x2="620" y2="140" stroke="#000" stroke-width="2"/>
                <line x1="640" y1="110" x2="660" y2="140" stroke="#000" stroke-width="2"/>
                <circle cx="640" cy="110" r="12" fill="#000"/>
                <circle cx="620" cy="140" r="10" fill="#fff" stroke="#000" stroke-width="1.5"/>
                <circle cx="660" cy="140" r="10" fill="#fff" stroke="#000" stroke-width="1.5"/>
                <line x1="720" y1="110" x2="700" y2="140" stroke="#000" stroke-width="2"/>
                <line x1="720" y1="110" x2="740" y2="140" stroke="#000" stroke-width="2"/>
                <circle cx="720" cy="110" r="12" fill="#000"/>
                <circle cx="700" cy="140" r="10" fill="#fff" stroke="#000" stroke-width="1.5"/>
                <circle cx="740" cy="140" r="10" fill="#fff" stroke="#000" stroke-width="1.5"/>
            </g>

            <!-- 区域标签 -->
            <text x="210" y="250" font-size="16" fill="#000" text-anchor="middle">反应前</text>
            <text x="590" y="250" font-size="16" fill="#000" text-anchor="middle">反应后</text>

            <!-- 原子追踪线（步骤3-4） -->
            <g id="scene1-trackers" class="scene1-svg-group">
                <line class="scene1-tracker" x1="140" y1="115" x2="520" y2="115" stroke="#888" stroke-width="1.5"/>
                <line class="scene1-tracker" x1="140" y1="88" x2="620" y2="140" stroke="#888" stroke-width="1.5"/>
                <line class="scene1-tracker" x1="113" y1="115" x2="660" y2="140" stroke="#888" stroke-width="1.5"/>
                <line class="scene1-tracker" x1="167" y1="115" x2="700" y2="140" stroke="#888" stroke-width="1.5"/>
                <line class="scene1-tracker" x1="140" y1="142" x2="740" y2="140" stroke="#888" stroke-width="1.5"/>
                <line class="scene1-tracker" x1="265" y1="95" x2="490" y2="115" stroke="#888" stroke-width="1.5"/>
                <line class="scene1-tracker" x1="295" y1="95" x2="550" y2="115" stroke="#888" stroke-width="1.5"/>
                <line class="scene1-tracker" x1="265" y1="135" x2="640" y2="110" stroke="#888" stroke-width="1.5"/>
                <line class="scene1-tracker" x1="295" y1="135" x2="720" y2="110" stroke="#888" stroke-width="1.5"/>
            </g>
        </svg>

        <!-- ===== HTML 绝对定位元素 ===== -->
        <!-- 图例（始终显示） -->
        <div id="scene1-legend">
            <div class="scene1-legend-row"><div class="scene1-legend-icon scene1-legend-h"></div><span>— 氢原子</span></div>
            <div class="scene1-legend-row"><div class="scene1-legend-icon scene1-legend-o"></div><span>— 氧原子</span></div>
            <div class="scene1-legend-row"><div class="scene1-legend-icon scene1-legend-c"></div><span>— 碳原子</span></div>
        </div>

        <!-- 加号（始终显示） -->
        <div class="scene1-plus" style="left:195px; top:101px;">+</div>
        <div class="scene1-plus" style="left:575px; top:101px;">+</div>

        <!-- 点燃标签（始终显示） -->
        <div class="scene1-ignite" style="left:365px; top:78px;">点燃</div>

        <!-- 字母标签（步骤1+） -->
        <div id="scene1-letters" class="scene1-html-group">
            <div class="scene1-label" style="left:120px; top:158px;">A</div>
            <div class="scene1-label" style="left:260px; top:158px;">B</div>
            <div class="scene1-label" style="left:500px; top:158px;">C</div>
            <div class="scene1-label" style="left:660px; top:158px;">D</div>
        </div>

        <!-- 化学式标签（步骤1+） -->
        <div id="scene1-formulas" class="scene1-html-group">
            <div class="scene1-label" style="left:120px; top:200px;">CH₄</div>
            <div class="scene1-label" style="left:260px; top:200px;">O₂</div>
            <div class="scene1-label" style="left:500px; top:200px;">CO₂</div>
            <div class="scene1-label" style="left:660px; top:200px;">H₂O</div>
        </div>

        <!-- O₂ 数量框（步骤3+） -->
        <div id="scene1-o2-count" class="scene1-html-group scene1-count-box" style="left:248px; top:78px; width:64px; height:82px;">
            <div class="scene1-count-label" style="left:17px; top:-18px;">×2</div>
        </div>

        <!-- H₂O 数量框（步骤3+） -->
        <div id="scene1-h2o-count" class="scene1-html-group scene1-count-box" style="left:605px; top:85px; width:155px; height:65px;">
            <div class="scene1-count-label" style="left:62px; top:-18px;">×2</div>
        </div>

        <!-- 原子计数表（步骤2+） -->
        <div id="scene1-count-table-wrap" class="scene1-html-group">
            <div id="scene1-count-table-title">原子数目统计</div>
            <table id="scene1-count-table">
                <thead>
                    <tr><th style="width:40%"></th><th style="width:30%">反应前</th><th style="width:30%">反应后</th></tr>
                </thead>
                <tbody>
                    <tr><td>C</td><td id="scene1-tb-cb">1</td><td id="scene1-tb-ca">1</td></tr>
                    <tr><td>H</td><td id="scene1-tb-hb">4</td><td id="scene1-tb-ha">2</td></tr>
                    <tr><td>O</td><td id="scene1-tb-ob">2</td><td id="scene1-tb-oa">3</td></tr>
                </tbody>
            </table>
            <div id="scene1-count-hint"></div>
        </div>

        <!-- 化学方程式（步骤5+） -->
        <div id="scene1-equation-wrap" class="scene1-html-group">
            <div id="scene1-equation-ignite">点燃</div>
            <div id="scene1-equation-text">
                CH₄ + <span class="scene1-coef">2</span>O₂ → CO₂ + <span class="scene1-coef">2</span>H₂O
            </div>
        </div>

        <!-- 选项辨析（步骤6） -->
        <div id="scene1-options-wrap" class="scene1-html-group">
            <div class="scene1-option scene1-option-a">
                <span>A. 反应前后原子数目不变</span>
                <span class="scene1-option-mark">✓ 正确（原子守恒）</span>
            </div>
            <div class="scene1-option scene1-option-bcd">
                <span>B. 参加反应的A和B的质量比为8:1</span>
                <span class="scene1-option-mark">✗ 应为1:4</span>
            </div>
            <div class="scene1-option scene1-option-bcd">
                <span>C. 方程式未配平，缺系数2</span>
                <span class="scene1-option-mark">✗ 未配平</span>
            </div>
            <div class="scene1-option scene1-option-bcd">
                <span>D. 该反应属于置换反应</span>
                <span class="scene1-option-mark">✗ 无单质生成</span>
            </div>
        </div>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 0/6：题目原图</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const totalSteps = 6;
        const stepNames = ["题目原图","识别分子","原子初算","配平修正","守恒验证","正确方程式","选项辨析"];

        const btnPrev = document.getElementById("scene1-btn-prev");
        const btnNext = document.getElementById("scene1-btn-next");
        const indicator = document.getElementById("scene1-step-indicator");

        // SVG 元素组
        const o2Initial = document.getElementById("scene1-o2-initial");
        const o2Balanced = document.getElementById("scene1-o2-balanced");
        const h2oInitial = document.getElementById("scene1-h2o-initial");
        const h2oBalanced = document.getElementById("scene1-h2o-balanced");
        const trackers = document.getElementById("scene1-trackers");

        // HTML 元素组
        const letters = document.getElementById("scene1-letters");
        const formulas = document.getElementById("scene1-formulas");
        const o2Count = document.getElementById("scene1-o2-count");
        const h2oCount = document.getElementById("scene1-h2o-count");
        const countTable = document.getElementById("scene1-count-table-wrap");
        const equation = document.getElementById("scene1-equation-wrap");
        const options = document.getElementById("scene1-options-wrap");

        // 计数表数值和提示
        const tbCb = document.getElementById("scene1-tb-cb");
        const tbHb = document.getElementById("scene1-tb-hb");
        const tbOb = document.getElementById("scene1-tb-ob");
        const tbCa = document.getElementById("scene1-tb-ca");
        const tbHa = document.getElementById("scene1-tb-ha");
        const tbOa = document.getElementById("scene1-tb-oa");
        const countHint = document.getElementById("scene1-count-hint");

        function setActive(el, active) {
            if (!el) return;
            if (active) el.classList.add("active");
            else el.classList.remove("active");
        }

        function setTrackerState(state) {
            const lines = trackers.querySelectorAll(".scene1-tracker");
            lines.forEach(line => {
                line.classList.remove("active", "dim");
                if (state === "active") line.classList.add("active");
                else if (state === "dim") line.classList.add("dim");
            });
        }

        function setCountTableColor(color) {
            [tbCb, tbHb, tbOb, tbCa, tbHa, tbOa].forEach(el => { el.style.color = color; });
        }

        function renderStep() {
            // 步骤1：字母标签+化学式
            setActive(letters, currentStep >= 1);
            setActive(formulas, currentStep >= 1);

            // 步骤2：计数表（未配平数值）
            setActive(countTable, currentStep >= 2);
            if (currentStep === 2) {
                tbCb.textContent = "1"; tbCa.textContent = "1";
                tbHb.textContent = "4"; tbHa.textContent = "2";
                tbOb.textContent = "2"; tbOa.textContent = "3";
                setCountTableColor("#000");
                tbHa.style.color = "#c62828";
                tbOa.style.color = "#c62828";
                countHint.textContent = "未配平";
                countHint.style.color = "#c62828";
            }

            // 步骤3：配平修正
            setActive(o2Initial, currentStep <= 2);
            setActive(o2Balanced, currentStep >= 3);
            setActive(o2Count, currentStep >= 3);
            setActive(h2oInitial, currentStep <= 2);
            setActive(h2oBalanced, currentStep >= 3);
            setActive(h2oCount, currentStep >= 3);
            setActive(trackers, currentStep >= 3 && currentStep <= 4);
            if (currentStep === 3) setTrackerState("active");
            else if (currentStep === 4) setTrackerState("dim");

            // 步骤4：守恒验证
            if (currentStep >= 4) {
                tbCb.textContent = "1"; tbCa.textContent = "1";
                tbHb.textContent = "4"; tbHa.textContent = "4";
                tbOb.textContent = "4"; tbOa.textContent = "4";
                setCountTableColor("#2e7d32");
                countHint.textContent = "✓ 反应前后原子数目相等";
                countHint.style.color = "#2e7d32";
            }

            // 步骤5：正确方程式
            setActive(equation, currentStep >= 5);

            // 步骤6：选项辨析
            setActive(options, currentStep >= 6);

            indicator.textContent = "步骤 " + currentStep + "/" + totalSteps + "：" + stepNames[currentStep];
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps;
        }

        btnPrev.addEventListener("click", function() {
            if (currentStep > 0) { currentStep--; renderStep(); }
        });
        btnNext.addEventListener("click", function() {
            if (currentStep < totalSteps) { currentStep++; renderStep(); }
        });

        renderStep();
    })();
    </script>
</body>
</html>
