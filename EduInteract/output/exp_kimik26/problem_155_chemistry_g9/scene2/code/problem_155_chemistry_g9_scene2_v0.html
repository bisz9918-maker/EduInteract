<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 化学装置原理分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene2-controls button { padding: 6px 16px; font-size: 14px; border: none; border-radius: 4px; cursor: pointer; color: #fff; background: #1565c0; }
        #scene2-controls button:disabled { background: #cccccc; cursor: not-allowed; }
        #scene2-step-indicator { font-size: 14px; color: #333; min-width: 60px; text-align: center; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" viewBox="0 0 800 500">
            <defs>
                <marker id="scene2-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
                </marker>
            </defs>

            <!-- ==================== 左侧装置区 ==================== -->
            <!-- 入口管道 -->
            <rect x="30" y="168" width="40" height="10" fill="none" stroke="#000" stroke-width="1.5"/>
            <!-- 容器1 -->
            <rect x="70" y="135" width="100" height="80" rx="8" fill="none" stroke="#000" stroke-width="1.5"/>
            <!-- 连接管道 -->
            <rect x="170" y="168" width="40" height="10" fill="none" stroke="#000" stroke-width="1.5"/>
            <!-- 容器2 -->
            <rect x="210" y="135" width="100" height="80" rx="8" fill="none" stroke="#000" stroke-width="1.5"/>
            <!-- 出口管道 -->
            <rect x="310" y="168" width="40" height="10" fill="none" stroke="#000" stroke-width="1.5"/>

            <!-- 入口箭头 -->
            <line x1="22" y1="173" x2="34" y2="173" stroke="#000" stroke-width="1.5" marker-end="url(#scene2-arrowhead)"/>
            <!-- 出口箭头 -->
            <line x1="346" y1="173" x2="358" y2="173" stroke="#000" stroke-width="1.5" marker-end="url(#scene2-arrowhead)"/>

            <!-- 气体Y入口标签 -->
            <text x="22" y="160" font-size="12" fill="#000" dominant-baseline="middle">气体Y</text>
            <!-- 气体Y出口标签 -->
            <text x="370" y="160" font-size="12" fill="#000" dominant-baseline="middle">气体Y</text>

            <!-- 容器1标签 -->
            <text x="120" y="125" font-size="13" fill="#000" font-weight="bold" text-anchor="middle">容器1</text>
            <!-- 容器2标签 -->
            <text x="260" y="125" font-size="13" fill="#000" font-weight="bold" text-anchor="middle">容器2</text>

            <!-- 容器1温度（放在反应器下方足够远，避免重叠） -->
            <text id="scene2-label-900c" x="120" y="250" font-size="14" fill="#c62828" text-anchor="middle">900℃</text>
            <!-- 容器2温度 -->
            <text id="scene2-label-600c" x="260" y="250" font-size="14" fill="#c62828" text-anchor="middle">600℃</text>

            <!-- 容器1固体颗粒（8棕+4橙黄=杂质） -->
            <g id="scene2-particles-1">
                <circle cx="85" cy="205" r="4" fill="#5d4037"/><circle cx="95" cy="200" r="4" fill="#5d4037"/>
                <circle cx="105" cy="208" r="4" fill="#5d4037"/><circle cx="115" cy="202" r="4" fill="#5d4037"/>
                <circle cx="125" cy="206" r="4" fill="#5d4037"/><circle cx="135" cy="201" r="4" fill="#5d4037"/>
                <circle cx="145" cy="207" r="4" fill="#5d4037"/><circle cx="155" cy="203" r="4" fill="#5d4037"/>
                <circle cx="90" cy="210" r="4" fill="#ff8f00"/><circle cx="100" cy="212" r="4" fill="#ff8f00"/>
                <circle cx="110" cy="198" r="4" fill="#ff8f00"/><circle cx="120" cy="211" r="4" fill="#ff8f00"/>
            </g>
            <!-- 容器2固体颗粒（8棕=纯净） -->
            <g id="scene2-particles-2">
                <circle cx="225" cy="205" r="4" fill="#5d4037"/><circle cx="235" cy="200" r="4" fill="#5d4037"/>
                <circle cx="245" cy="208" r="4" fill="#5d4037"/><circle cx="255" cy="202" r="4" fill="#5d4037"/>
                <circle cx="265" cy="206" r="4" fill="#5d4037"/><circle cx="275" cy="201" r="4" fill="#5d4037"/>
                <circle cx="285" cy="207" r="4" fill="#5d4037"/><circle cx="295" cy="203" r="4" fill="#5d4037"/>
            </g>

            <!-- 反应方程式 -->
            <text x="30" y="390" font-size="13" fill="#000">Co（固）+ 2HCl（气）⇌ CoCl₂（气）+ H₂（气）</text>
            <!-- 方程式上900℃ -->
            <text id="scene2-eq-900" x="135" y="350" font-size="14" fill="#c62828" text-anchor="middle">900℃</text>
            <!-- 方程式下600℃ -->
            <text id="scene2-eq-600" x="135" y="445" font-size="14" fill="#c62828" text-anchor="middle">600℃</text>

            <!-- ==================== 步骤专属高亮元素（初始隐藏） ==================== -->
            <!-- 步骤1：虚线箭头 -->
            <path id="scene2-highlight-path" d="M 120 235 L 260 235" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" opacity="0"/>
            <polygon id="scene2-highlight-path-arrow" points="260,235 252,231 252,239" fill="#888" opacity="0"/>
            <text id="scene2-highlight-path-text" x="190" y="265" font-size="11" fill="#333" text-anchor="middle" opacity="0">Co(固) → CoCl₂(气) → Co(固)</text>

            <!-- 步骤2：容器2高亮框 -->
            <rect id="scene2-highlight-reactor2" x="210" y="135" width="100" height="80" rx="8" fill="#e8f5e9" fill-opacity="0.3" stroke="#2e7d32" stroke-width="3" opacity="0"/>
            <text id="scene2-highlight-pure-text" x="260" y="290" font-size="11" fill="#2e7d32" text-anchor="middle" opacity="0">纯净Co（无杂质）</text>

            <!-- 步骤3：出口高亮 -->
            <rect id="scene2-highlight-outlet" x="310" y="168" width="40" height="10" fill="none" stroke="#1565c0" stroke-width="3" opacity="0"/>
            <text id="scene2-highlight-hcl" x="370" y="210" font-size="12" fill="#1565c0" opacity="0">HCl</text>
            <g id="scene2-highlight-hcl-dots" opacity="0">
                <circle cx="325" cy="165" r="3" fill="#1565c0"/><circle cx="335" cy="162" r="3" fill="#1565c0"/><circle cx="345" cy="165" r="3" fill="#1565c0"/>
            </g>

            <!-- 步骤4：温度高亮 -->
            <text id="scene2-highlight-temp-text" x="190" y="470" font-size="11" fill="#333" text-anchor="middle" opacity="0">温度条件对应</text>

            <!-- ==================== 右侧选项卡片（foreignObject） ==================== -->
            <!-- 卡片A -->
            <foreignObject id="scene2-card-a" x="340" y="65" width="440" height="85" opacity="1">
                <div id="scene2-card-a-inner" style="width:100%; height:100%; border:1px solid #000; border-radius:6px; background:#fff; display:flex; align-items:center; padding:0 12px; box-sizing:border-box; font-family:Microsoft YaHei, PingFang SC, sans-serif;">
                    <div style="width:28px; height:28px; border:1px solid #000; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:bold; flex-shrink:0;">A</div>
                    <div style="margin-left:10px; flex:1;">
                        <div style="font-size:14px; color:#000; line-height:1.4;">固体Co从容器1到容器2的过程为物理变化</div>
                        <div id="scene2-reason-a" style="font-size:13px; color:#333; margin-top:6px; display:none;">经历了化合与分解两次化学反应，不是物理变化</div>
                    </div>
                    <div id="scene2-mark-a" style="display:none; background:#ffebee; color:#c62828; padding:3px 10px; border-radius:4px; font-size:13px; font-weight:bold; white-space:nowrap; margin-left:8px;">✗ 错误</div>
                </div>
            </foreignObject>

            <!-- 卡片B -->
            <foreignObject id="scene2-card-b" x="340" y="160" width="440" height="85" opacity="1">
                <div id="scene2-card-b-inner" style="width:100%; height:100%; border:1px solid #000; border-radius:6px; background:#fff; display:flex; align-items:center; padding:0 12px; box-sizing:border-box; font-family:Microsoft YaHei, PingFang SC, sans-serif;">
                    <div style="width:28px; height:28px; border:1px solid #000; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:bold; flex-shrink:0;">B</div>
                    <div style="margin-left:10px; flex:1;">
                        <div style="font-size:14px; color:#000; line-height:1.4;">容器2中的固体是纯净的Co</div>
                        <div id="scene2-reason-b" style="font-size:13px; color:#333; margin-top:6px; display:none;">杂质留在容器1，逆反应生成的Co纯净</div>
                    </div>
                    <div id="scene2-mark-b" style="display:none; background:#e8f5e9; color:#2e7d32; padding:3px 10px; border-radius:4px; font-size:13px; font-weight:bold; white-space:nowrap; margin-left:8px;">✓ 正确</div>
                </div>
            </foreignObject>

            <!-- 卡片C -->
            <foreignObject id="scene2-card-c" x="340" y="255" width="440" height="85" opacity="1">
                <div id="scene2-card-c-inner" style="width:100%; height:100%; border:1px solid #000; border-radius:6px; background:#fff; display:flex; align-items:center; padding:0 12px; box-sizing:border-box; font-family:Microsoft YaHei, PingFang SC, sans-serif;">
                    <div style="width:28px; height:28px; border:1px solid #000; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:bold; flex-shrink:0;">C</div>
                    <div style="margin-left:10px; flex:1;">
                        <div style="font-size:14px; color:#000; line-height:1.4;">该装置最终导出的气体是CoCl₂和H₂</div>
                        <div id="scene2-reason-c" style="font-size:13px; color:#333; margin-top:6px; display:none;">CoCl₂在容器2分解，导出HCl可循环</div>
                    </div>
                    <div id="scene2-mark-c" style="display:none; background:#ffebee; color:#c62828; padding:3px 10px; border-radius:4px; font-size:13px; font-weight:bold; white-space:nowrap; margin-left:8px;">✗ 错误</div>
                </div>
            </foreignObject>

            <!-- 卡片D -->
            <foreignObject id="scene2-card-d" x="340" y="350" width="440" height="85" opacity="1">
                <div id="scene2-card-d-inner" style="width:100%; height:100%; border:1px solid #000; border-radius:6px; background:#fff; display:flex; align-items:center; padding:0 12px; box-sizing:border-box; font-family:Microsoft YaHei, PingFang SC, sans-serif;">
                    <div style="width:28px; height:28px; border:1px solid #000; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:bold; flex-shrink:0;">D</div>
                    <div style="margin-left:10px; flex:1;">
                        <div style="font-size:14px; color:#000; line-height:1.4;">容器1中的温度为900℃，容器2中的温度为600℃</div>
                        <div id="scene2-reason-d" style="font-size:13px; color:#333; margin-top:6px; display:none;">正向反应需900℃，逆向反应需600℃</div>
                    </div>
                    <div id="scene2-mark-d" style="display:none; background:#e8f5e9; color:#2e7d32; padding:3px 10px; border-radius:4px; font-size:13px; font-weight:bold; white-space:nowrap; margin-left:8px;">✓ 正确</div>
                </div>
            </foreignObject>
        </svg>

        <div id="scene2-controls">
            <button id="scene2-btn-prev" disabled>◀ 上一步</button>
            <span id="scene2-step-indicator">准备</span>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2 实现
        let currentStep = 0; // 0=准备, 1=A, 2=B, 3=C, 4=D

        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        const indicator = document.getElementById('scene2-step-indicator');

        const cardA = document.getElementById('scene2-card-a');
        const cardB = document.getElementById('scene2-card-b');
        const cardC = document.getElementById('scene2-card-c');
        const cardD = document.getElementById('scene2-card-d');

        const cardInnerA = document.getElementById('scene2-card-a-inner');
        const cardInnerB = document.getElementById('scene2-card-b-inner');
        const cardInnerC = document.getElementById('scene2-card-c-inner');
        const cardInnerD = document.getElementById('scene2-card-d-inner');

        const markA = document.getElementById('scene2-mark-a');
        const markB = document.getElementById('scene2-mark-b');
        const markC = document.getElementById('scene2-mark-c');
        const markD = document.getElementById('scene2-mark-d');

        const reasonA = document.getElementById('scene2-reason-a');
        const reasonB = document.getElementById('scene2-reason-b');
        const reasonC = document.getElementById('scene2-reason-c');
        const reasonD = document.getElementById('scene2-reason-d');

        const hlPath = document.getElementById('scene2-highlight-path');
        const hlPathArrow = document.getElementById('scene2-highlight-path-arrow');
        const hlPathText = document.getElementById('scene2-highlight-path-text');
        const hlReactor2 = document.getElementById('scene2-highlight-reactor2');
        const hlPureText = document.getElementById('scene2-highlight-pure-text');
        const hlOutlet = document.getElementById('scene2-highlight-outlet');
        const hlHcl = document.getElementById('scene2-highlight-hcl');
        const hlHclDots = document.getElementById('scene2-highlight-hcl-dots');
        const hlTempText = document.getElementById('scene2-highlight-temp-text');

        const label900c = document.getElementById('scene2-label-900c');
        const label600c = document.getElementById('scene2-label-600c');
        const eq900 = document.getElementById('scene2-eq-900');
        const eq600 = document.getElementById('scene2-eq-600');

        function setOpacity(el, val) {
            if (el) el.setAttribute('opacity', val);
        }
        function setDisplay(el, val) {
            if (el) el.style.display = val;
        }
        function setFont(el, size, weight) {
            if (el) {
                el.setAttribute('font-size', size);
                if (weight) el.setAttribute('font-weight', weight);
                else el.removeAttribute('font-weight');
            }
        }

        function renderStep() {
            // 重置所有卡片
            [cardA, cardB, cardC, cardD].forEach(c => { if (c) c.setAttribute('opacity', '1'); });
            [cardInnerA, cardInnerB, cardInnerC, cardInnerD].forEach(inner => {
                if (inner) { inner.style.border = '1px solid #000'; inner.style.opacity = '1'; }
            });
            [markA, markB, markC, markD].forEach(m => { if (m) m.style.display = 'none'; });
            [reasonA, reasonB, reasonC, reasonD].forEach(r => { if (r) r.style.display = 'none'; });

            // 重置高亮元素
            setOpacity(hlPath, '0');
            setOpacity(hlPathArrow, '0');
            setOpacity(hlPathText, '0');
            setOpacity(hlReactor2, '0');
            setOpacity(hlPureText, '0');
            setOpacity(hlOutlet, '0');
            setOpacity(hlHcl, '0');
            setOpacity(hlHclDots, '0');
            setOpacity(hlTempText, '0');

            // 重置温度标签
            setFont(label900c, '14', null);
            setFont(label600c, '14', null);
            setFont(eq900, '14', null);
            setFont(eq600, '14', null);

            // 按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === 4);

            // 步骤指示
            indicator.textContent = (currentStep === 0) ? '准备' : '步骤 ' + currentStep + '/4';

            if (currentStep === 0) return;

            if (currentStep === 1) {
                if (cardInnerA) cardInnerA.style.border = '3px solid #1565c0';
                setDisplay(markA, 'inline-block');
                setDisplay(reasonA, 'block');
                [cardB, cardC, cardD].forEach(c => { if (c) c.setAttribute('opacity', '0.4'); });
                setOpacity(hlPath, '1');
                setOpacity(hlPathArrow, '1');
                setOpacity(hlPathText, '1');
            } else if (currentStep === 2) {
                if (cardInnerB) cardInnerB.style.border = '3px solid #1565c0';
                setDisplay(markB, 'inline-block');
                setDisplay(reasonB, 'block');
                [cardA, cardC, cardD].forEach(c => { if (c) c.setAttribute('opacity', '0.4'); });
                setOpacity(hlReactor2, '1');
                setOpacity(hlPureText, '1');
            } else if (currentStep === 3) {
                if (cardInnerC) cardInnerC.style.border = '3px solid #1565c0';
                setDisplay(markC, 'inline-block');
                setDisplay(reasonC, 'block');
                [cardA, cardB, cardD].forEach(c => { if (c) c.setAttribute('opacity', '0.4'); });
                setOpacity(hlOutlet, '1');
                setOpacity(hlHcl, '1');
                setOpacity(hlHclDots, '1');
            } else if (currentStep === 4) {
                if (cardInnerD) cardInnerD.style.border = '3px solid #1565c0';
                setDisplay(markD, 'inline-block');
                setDisplay(reasonD, 'block');
                [cardA, cardB, cardC].forEach(c => { if (c) c.setAttribute('opacity', '0.4'); });
                setFont(label900c, '16', 'bold');
                setFont(label600c, '16', 'bold');
                setFont(eq900, '16', 'bold');
                setFont(eq600, '16', 'bold');
                setOpacity(hlTempText, '1');
            }
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) { currentStep--; renderStep(); }
        });
        btnNext.addEventListener('click', function() {
            if (currentStep < 4) { currentStep++; renderStep(); }
        });

        renderStep();
    })();
    </script>
</body>
</html>
