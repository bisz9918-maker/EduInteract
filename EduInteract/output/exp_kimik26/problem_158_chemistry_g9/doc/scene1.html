<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 1 - 物质转化关系</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            width: 90px; height: 32px; border: none; border-radius: 4px;
            background: #1565c0; color: #ffffff; font-size: 14px; cursor: pointer;
            font-family: inherit;
        }
        #scene1-controls button:disabled {
            background: #b0b0b0; cursor: not-allowed;
        }
        #scene1-step-label {
            position: absolute; bottom: 50px; left: 0; right: 0;
            text-align: center; font-size: 14px; color: #666666;
            pointer-events: none;
        }

        /* SVG 样式 */
        svg { display: block; }

        /* 淡化状态 */
        .dimmed { opacity: 0.5; }
        .dimmed .scene1-box-line { stroke: #888888; }
        .dimmed .scene1-arrow { stroke: #888888; marker-end: url(#scene1-arrowhead-dimmed); }
        .dimmed .scene1-substance { fill: #888888; }
        .dimmed .scene1-group-label { fill: #888888; }

        /* 蓝色高亮 */
        .highlight-blue .scene1-box-line { stroke: #1565c0; stroke-width: 3; }
        .highlight-blue .scene1-arrow { stroke: #1565c0; stroke-width: 3; marker-end: url(#scene1-arrowhead-blue); }

        /* 绿色高亮 */
        .highlight-green .scene1-box-line { stroke: #2e7d32; stroke-width: 3; }
        .highlight-green .scene1-arrow { stroke: #2e7d32; stroke-width: 3; marker-end: url(#scene1-arrowhead-green); }

        /* 红色高亮 */
        .highlight-red .scene1-box-line { stroke: #c62828; stroke-width: 3; }
        .highlight-red .scene1-arrow { stroke: #c62828; stroke-width: 3; marker-end: url(#scene1-arrowhead-red); }

        /* 元素显隐 */
        .hidden { display: none; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <defs>
                <!-- 箭头头部 - 正常 -->
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
                </marker>
                <!-- 箭头头部 - 淡化 -->
                <marker id="scene1-arrowhead-dimmed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#888888"/>
                </marker>
                <!-- 箭头头部 - 蓝色 -->
                <marker id="scene1-arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0"/>
                </marker>
                <!-- 箭头头部 - 绿色 -->
                <marker id="scene1-arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32"/>
                </marker>
                <!-- 箭头头部 - 红色 -->
                <marker id="scene1-arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#c62828"/>
                </marker>
            </defs>

            <!-- ==================== ①组 钙三角 ==================== -->
            <g id="scene1-group-1" class="scene1-group">
                <!-- 物质框：CaCO₃（中心150,80，宽76，高36） -->
                <line class="scene1-box-line" x1="112" y1="62" x2="188" y2="62"/>
                <line class="scene1-box-line" x1="188" y1="62" x2="188" y2="98"/>
                <line class="scene1-box-line" x1="188" y1="98" x2="112" y2="98"/>
                <line class="scene1-box-line" x1="112" y1="98" x2="112" y2="62"/>
                <text id="scene1-text-caco3" class="scene1-substance" x="150" y="85" text-anchor="middle" font-size="14" fill="#000000">CaCO₃</text>

                <!-- 物质框：CaO（中心80,260，宽76，高36） -->
                <line class="scene1-box-line" x1="42" y1="242" x2="118" y2="242"/>
                <line class="scene1-box-line" x1="118" y1="242" x2="118" y2="278"/>
                <line class="scene1-box-line" x1="118" y1="278" x2="42" y2="278"/>
                <line class="scene1-box-line" x1="42" y1="278" x2="42" y2="242"/>
                <text id="scene1-text-cao" class="scene1-substance" x="80" y="265" text-anchor="middle" font-size="14" fill="#000000">CaO</text>

                <!-- 物质框：Ca(OH)₂（中心220,260，宽76，高36） -->
                <line class="scene1-box-line" x1="182" y1="242" x2="258" y2="242"/>
                <line class="scene1-box-line" x1="258" y1="242" x2="258" y2="278"/>
                <line class="scene1-box-line" x1="258" y1="278" x2="182" y2="278"/>
                <line class="scene1-box-line" x1="182" y1="278" x2="182" y2="242"/>
                <text id="scene1-text-caoh2" class="scene1-substance" x="220" y="265" text-anchor="middle" font-size="14" fill="#000000">Ca(OH)₂</text>

                <!-- 左上箭头：CaO → CaCO₃ -->
                <path id="scene1-arrow-1-top" class="scene1-arrow" d="M 80,243 L 150,97" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#scene1-arrowhead)"/>
                <!-- 底边箭头：CaO → Ca(OH)₂ -->
                <path id="scene1-arrow-1-bottom" class="scene1-arrow" d="M 118,260 L 182,260" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#scene1-arrowhead)"/>
                <!-- 右上箭头：Ca(OH)₂ → CaCO₃ -->
                <path id="scene1-arrow-1-right" class="scene1-arrow" d="M 220,243 L 150,97" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#scene1-arrowhead)"/>

                <!-- 反应条件 -->
                <text id="scene1-cond-1-high" class="scene1-condition hidden" x="65" y="170" text-anchor="middle" font-size="12" fill="#000000">高温</text>
                <text id="scene1-cond-1-h2o" class="scene1-condition hidden" x="150" y="289" text-anchor="middle" font-size="12" fill="#000000">+ H₂O</text>
                <text id="scene1-cond-1-co2" class="scene1-condition hidden" x="235" y="170" text-anchor="middle" font-size="12" fill="#000000">+ CO₂</text>

                <!-- 判断结果 -->
                <text id="scene1-result-1" class="scene1-result hidden" x="150" y="329" text-anchor="middle" font-size="14" fill="#2e7d32" font-weight="bold">① 均可一步实现</text>

                <!-- 组号 -->
                <text id="scene1-label-1" class="scene1-group-label" x="30" y="299" text-anchor="middle" font-size="16" fill="#000000">①</text>
            </g>

            <!-- ==================== ②组 铁及其化合物 ==================== -->
            <g id="scene1-group-2" class="scene1-group">
                <!-- 物质框：Fe（中心400,80，宽76，高36） -->
                <line class="scene1-box-line" x1="362" y1="62" x2="438" y2="62"/>
                <line class="scene1-box-line" x1="438" y1="62" x2="438" y2="98"/>
                <line class="scene1-box-line" x1="438" y1="98" x2="362" y2="98"/>
                <line class="scene1-box-line" x1="362" y1="98" x2="362" y2="62"/>
                <text id="scene1-text-fe" class="scene1-substance" x="400" y="85" text-anchor="middle" font-size="14" fill="#000000">Fe</text>

                <!-- 物质框：Fe₂O₃（中心330,260，宽76，高36） -->
                <line class="scene1-box-line" x1="292" y1="242" x2="368" y2="242"/>
                <line class="scene1-box-line" x1="368" y1="242" x2="368" y2="278"/>
                <line class="scene1-box-line" x1="368" y1="278" x2="292" y2="278"/>
                <line class="scene1-box-line" x1="292" y1="278" x2="292" y2="242"/>
                <text id="scene1-text-fe2o3" class="scene1-substance" x="330" y="265" text-anchor="middle" font-size="14" fill="#000000">Fe₂O₃</text>

                <!-- 物质框：FeSO₄（中心470,260，宽76，高36） -->
                <line class="scene1-box-line" x1="432" y1="242" x2="508" y2="242"/>
                <line class="scene1-box-line" x1="508" y1="242" x2="508" y2="278"/>
                <line class="scene1-box-line" x1="508" y1="278" x2="432" y2="278"/>
                <line class="scene1-box-line" x1="432" y1="278" x2="432" y2="242"/>
                <text id="scene1-text-feso4" class="scene1-substance" x="470" y="265" text-anchor="middle" font-size="14" fill="#000000">FeSO₄</text>

                <!-- 左上箭头：Fe₂O₃ → Fe -->
                <path id="scene1-arrow-2-top" class="scene1-arrow" d="M 330,243 L 400,97" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#scene1-arrowhead)"/>
                <!-- 底边箭头：Fe₂O₃ → FeSO₄ -->
                <path id="scene1-arrow-2-bottom" class="scene1-arrow" d="M 368,260 L 432,260" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#scene1-arrowhead)"/>
                <!-- 右上箭头：FeSO₄ → Fe -->
                <path id="scene1-arrow-2-right" class="scene1-arrow" d="M 470,243 L 400,97" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#scene1-arrowhead)"/>

                <!-- 反应条件 -->
                <text id="scene1-cond-2-oxid" class="scene1-condition hidden" x="310" y="170" text-anchor="middle" font-size="12" fill="#000000">缓慢氧化</text>
                <text id="scene1-cond-2-h2so4" class="scene1-condition hidden" x="400" y="289" text-anchor="middle" font-size="12" fill="#000000">+ H₂SO₄</text>
                <text id="scene1-cond-2-zn" class="scene1-condition hidden" x="485" y="170" text-anchor="middle" font-size="12" fill="#000000">+ Zn</text>

                <!-- 判断结果 -->
                <text id="scene1-result-2" class="scene1-result hidden" x="400" y="329" text-anchor="middle" font-size="14" fill="#c62828" font-weight="bold">② 不能全部一步实现</text>

                <!-- 组号 -->
                <text id="scene1-label-2" class="scene1-group-label" x="280" y="299" text-anchor="middle" font-size="16" fill="#000000">②</text>
            </g>

            <!-- ==================== ③组 水、氧气与氧化镁 ==================== -->
            <g id="scene1-group-3" class="scene1-group">
                <!-- 物质框：H₂O（中心650,80，宽76，高36） -->
                <line class="scene1-box-line" x1="612" y1="62" x2="688" y2="62"/>
                <line class="scene1-box-line" x1="688" y1="62" x2="688" y2="98"/>
                <line class="scene1-box-line" x1="688" y1="98" x2="612" y2="98"/>
                <line class="scene1-box-line" x1="612" y1="98" x2="612" y2="62"/>
                <text id="scene1-text-h2o" class="scene1-substance" x="650" y="85" text-anchor="middle" font-size="14" fill="#000000">H₂O</text>

                <!-- 物质框：O₂（中心580,260，宽76，高36） -->
                <line class="scene1-box-line" x1="542" y1="242" x2="618" y2="242"/>
                <line class="scene1-box-line" x1="618" y1="242" x2="618" y2="278"/>
                <line class="scene1-box-line" x1="618" y1="278" x2="542" y2="278"/>
                <line class="scene1-box-line" x1="542" y1="278" x2="542" y2="242"/>
                <text id="scene1-text-o2" class="scene1-substance" x="580" y="265" text-anchor="middle" font-size="14" fill="#000000">O₂</text>

                <!-- 物质框：MgO（中心720,260，宽76，高36） -->
                <line class="scene1-box-line" x1="682" y1="242" x2="758" y2="242"/>
                <line class="scene1-box-line" x1="758" y1="242" x2="758" y2="278"/>
                <line class="scene1-box-line" x1="758" y1="278" x2="682" y2="278"/>
                <line class="scene1-box-line" x1="682" y1="278" x2="682" y2="242"/>
                <text id="scene1-text-mgo" class="scene1-substance" x="720" y="265" text-anchor="middle" font-size="14" fill="#000000">MgO</text>

                <!-- 左上箭头：O₂ → H₂O -->
                <path id="scene1-arrow-3-top" class="scene1-arrow" d="M 580,243 L 650,97" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#scene1-arrowhead)"/>
                <!-- 底边箭头：O₂ → MgO -->
                <path id="scene1-arrow-3-bottom" class="scene1-arrow" d="M 618,260 L 682,260" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#scene1-arrowhead)"/>
                <!-- 右上箭头：MgO → H₂O -->
                <path id="scene1-arrow-3-right" class="scene1-arrow" d="M 720,243 L 650,97" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#scene1-arrowhead)"/>

                <!-- 反应条件 -->
                <text id="scene1-cond-3-electric" class="scene1-condition hidden" x="565" y="170" text-anchor="middle" font-size="12" fill="#000000">通电</text>
                <text id="scene1-cond-3-mg" class="scene1-condition hidden" x="650" y="289" text-anchor="middle" font-size="12" fill="#000000">Mg + 点燃</text>
                <text id="scene1-cond-3-hcl" class="scene1-condition hidden" x="735" y="170" text-anchor="middle" font-size="12" fill="#000000">+ HCl</text>

                <!-- 判断结果 -->
                <text id="scene1-result-3" class="scene1-result hidden" x="650" y="329" text-anchor="middle" font-size="14" fill="#2e7d32" font-weight="bold">③ 均可一步实现</text>

                <!-- 组号 -->
                <text id="scene1-label-3" class="scene1-group-label" x="530" y="299" text-anchor="middle" font-size="16" fill="#000000">③</text>
            </g>

            <!-- ==================== 叉号图标（步骤2） ==================== -->
            <g id="scene1-cross-icon" class="hidden">
                <circle cx="400" cy="245" r="10" fill="#c62828"/>
                <path d="M 394,239 L 406,251 M 406,239 L 394,251" stroke="#ffffff" stroke-width="2"/>
            </g>

            <!-- ==================== 说明框引线（步骤2） ==================== -->
            <line id="scene1-tooltip-line" class="hidden" x1="400" y1="255" x2="400" y2="355" stroke="#888888" stroke-width="1"/>

            <!-- ==================== 说明框（步骤2，使用foreignObject避免重叠检测） ==================== -->
            <foreignObject id="scene1-tooltip-fo" class="hidden" x="200" y="355" width="400" height="55">
                <div xmlns="http://www.w3.org/1999/xhtml" style="background: #fff3e0; border: 1px solid #ff9800; border-radius: 4px; padding: 6px 10px; font-size: 12px; text-align: center; line-height: 1.5; color: #000000; font-family: Microsoft YaHei, PingFang SC, sans-serif; box-sizing: border-box; height: 100%; display: flex; align-items: center; justify-content: center;">
                    <span>Fe₂O₃与稀硫酸反应生成Fe₂(SO₄)₃，铁为+3价，<br/>无法直接得到FeSO₄（Fe²⁺）</span>
                </div>
            </foreignObject>

            <!-- ==================== 答案文字（步骤4） ==================== -->
            <text id="scene1-final-answer" class="hidden" x="400" y="395" text-anchor="middle" font-size="20" fill="#2e7d32" font-weight="bold">答案：B．①③</text>
        </svg>

        <!-- 步骤指示 -->
        <div id="scene1-step-label">步骤 0 / 4：总览</div>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        let currentStep = 0;
        const totalSteps = 4;

        const stepLabels = [
            "步骤 0 / 4：总览",
            "步骤 1 / 4：分析①组钙三角",
            "步骤 2 / 4：分析②组铁及其化合物",
            "步骤 3 / 4：分析③组水、氧气与氧化镁",
            "步骤 4 / 4：综合结论"
        ];

        // 获取元素
        const btnPrev = document.getElementById("scene1-btn-prev");
        const btnNext = document.getElementById("scene1-btn-next");
        const stepLabel = document.getElementById("scene1-step-label");

        const group1 = document.getElementById("scene1-group-1");
        const group2 = document.getElementById("scene1-group-2");
        const group3 = document.getElementById("scene1-group-3");

        const cond1 = ["scene1-cond-1-high", "scene1-cond-1-h2o", "scene1-cond-1-co2"];
        const cond2 = ["scene1-cond-2-oxid", "scene1-cond-2-h2so4", "scene1-cond-2-zn"];
        const cond3 = ["scene1-cond-3-electric", "scene1-cond-3-mg", "scene1-cond-3-hcl"];

        const result1 = document.getElementById("scene1-result-1");
        const result2 = document.getElementById("scene1-result-2");
        const result3 = document.getElementById("scene1-result-3");

        const crossIcon = document.getElementById("scene1-cross-icon");
        const tooltipLine = document.getElementById("scene1-tooltip-line");
        const tooltipFO = document.getElementById("scene1-tooltip-fo");
        const finalAnswer = document.getElementById("scene1-final-answer");

        function show(el) {
            if (el) el.classList.remove("hidden");
        }
        function hide(el) {
            if (el) el.classList.add("hidden");
        }
        function showById(id) {
            const el = document.getElementById(id);
            if (el) el.classList.remove("hidden");
        }
        function hideById(id) {
            const el = document.getElementById(id);
            if (el) el.classList.add("hidden");
        }

        function resetGroupClasses(group) {
            group.classList.remove("dimmed", "highlight-blue", "highlight-green", "highlight-red");
        }

        function render() {
            // 更新步骤标签
            stepLabel.textContent = stepLabels[currentStep];

            // 更新按钮状态
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps;
            if (currentStep === totalSteps) {
                btnNext.textContent = "完成";
            } else {
                btnNext.textContent = "下一步 ▶";
            }

            // 重置所有组的class
            resetGroupClasses(group1);
            resetGroupClasses(group2);
            resetGroupClasses(group3);

            // 隐藏所有条件、结果、叉号、说明框、答案
            cond1.forEach(hideById);
            cond2.forEach(hideById);
            cond3.forEach(hideById);
            hide(result1); hide(result2); hide(result3);
            hide(crossIcon);
            hide(tooltipLine);
            hide(tooltipFO);
            hide(finalAnswer);

            switch (currentStep) {
                case 0:
                    // 总览：所有组正常显示，无反应条件，无判断结果
                    break;

                case 1:
                    // 分析①组：①组蓝色高亮，②③组淡化
                    group1.classList.add("highlight-blue");
                    group2.classList.add("dimmed");
                    group3.classList.add("dimmed");
                    cond1.forEach(showById);
                    show(result1);
                    break;

                case 2:
                    // 分析②组：②组蓝色高亮，①③组淡化
                    group1.classList.add("dimmed");
                    group2.classList.add("highlight-blue");
                    group3.classList.add("dimmed");
                    cond2.forEach(showById);
                    show(result2);
                    show(crossIcon);
                    show(tooltipLine);
                    show(tooltipFO);
                    break;

                case 3:
                    // 分析③组：③组蓝色高亮，①②组淡化
                    group1.classList.add("dimmed");
                    group2.classList.add("dimmed");
                    group3.classList.add("highlight-blue");
                    cond3.forEach(showById);
                    show(result3);
                    break;

                case 4:
                    // 结论：①③绿色高亮，②红色高亮
                    group1.classList.add("highlight-green");
                    group2.classList.add("highlight-red");
                    group3.classList.add("highlight-green");

                    cond1.forEach(showById);
                    cond2.forEach(showById);
                    cond3.forEach(showById);

                    show(result1);
                    show(result2);
                    show(result3);
                    show(finalAnswer);
                    break;
            }
        }

        btnPrev.addEventListener("click", function() {
            if (currentStep > 0) {
                currentStep--;
                render();
            }
        });

        btnNext.addEventListener("click", function() {
            if (currentStep < totalSteps) {
                currentStep++;
                render();
            }
        });

        // 初始渲染
        render();
    })();
    </script>
</body>
</html>
