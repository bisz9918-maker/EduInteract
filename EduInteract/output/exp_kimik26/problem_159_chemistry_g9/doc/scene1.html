<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>化学实验图像判断</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-btn-prev, #scene1-btn-next {
            padding: 6px 16px; font-size: 14px; border: 1px solid #ccc; border-radius: 6px;
            background: #f5f5f5; cursor: pointer; user-select: none;
        }
        #scene1-btn-prev:disabled, #scene1-btn-next:disabled {
            opacity: 0.4; cursor: not-allowed;
        }
        #scene1-step-label { font-size: 13px; color: #555; min-width: 100px; text-align: center; }
        .scene1-dot { fill: #bdbdbd; }
        .scene1-dot.active { fill: #1565c0; }
        .step-group { display: none; }
        .step-group.active { display: block; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 步骤标题 -->
            <text id="scene1-title" x="400" y="40" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">题目总览</text>

            <!-- ==================== 步骤0：题目总览（2×2网格） ==================== -->
            <g id="scene1-step0-group" class="step-group active">
                <!-- A区 -->
                <rect x="40" y="65" width="340" height="150" fill="none" stroke="#ddd" stroke-width="1"/>
                <text x="210" y="58" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">A</text>
                <line x1="80" y1="200" x2="220" y2="200" stroke="#000" stroke-width="1"/>
                <line x1="80" y1="200" x2="80" y2="110" stroke="#000" stroke-width="1"/>
                <text x="150" y="230" text-anchor="middle" font-size="11" fill="#000">氧化钙质量/g</text>
                <text x="20" y="155" text-anchor="middle" font-size="11" fill="#000" transform="rotate(-90,20,155)">溶质质量/g</text>
                <line x1="100" y1="135" x2="200" y2="135" stroke="#888" stroke-width="2" stroke-dasharray="6,4"/>

                <!-- B区 -->
                <rect x="420" y="65" width="340" height="150" fill="none" stroke="#ddd" stroke-width="1"/>
                <text x="590" y="58" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">B</text>
                <line x1="480" y1="200" x2="620" y2="200" stroke="#000" stroke-width="1"/>
                <line x1="480" y1="200" x2="480" y2="110" stroke="#000" stroke-width="1"/>
                <text x="550" y="230" text-anchor="middle" font-size="11" fill="#000">反应时间/min</text>
                <text x="420" y="155" text-anchor="middle" font-size="11" fill="#000" transform="rotate(-90,420,155)">固体质量/g</text>
                <line x1="500" y1="110" x2="600" y2="200" stroke="#888" stroke-width="2" stroke-dasharray="6,4"/>

                <!-- C区 -->
                <rect x="40" y="270" width="340" height="145" fill="none" stroke="#ddd" stroke-width="1"/>
                <text x="210" y="262" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">C</text>
                <line x1="80" y1="395" x2="220" y2="395" stroke="#000" stroke-width="1"/>
                <line x1="80" y1="395" x2="80" y2="305" stroke="#000" stroke-width="1"/>
                <text x="150" y="425" text-anchor="middle" font-size="11" fill="#000">时间</text>
                <text x="20" y="350" text-anchor="middle" font-size="11" fill="#000" transform="rotate(-90,20,350)">固体质量(g)</text>
                <path d="M 100,330 L 140,330 L 180,375 L 220,375" fill="none" stroke="#888" stroke-width="2" stroke-dasharray="6,4"/>

                <!-- D区 -->
                <rect x="420" y="270" width="340" height="145" fill="none" stroke="#ddd" stroke-width="1"/>
                <text x="590" y="262" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">D</text>
                <line x1="480" y1="395" x2="620" y2="395" stroke="#000" stroke-width="1"/>
                <line x1="480" y1="395" x2="480" y2="305" stroke="#000" stroke-width="1"/>
                <text x="550" y="425" text-anchor="middle" font-size="11" fill="#000">温度</text>
                <text x="420" y="350" text-anchor="middle" font-size="11" fill="#000" transform="rotate(-90,420,350)">溶解度(L)</text>
                <line x1="500" y1="370" x2="600" y2="325" stroke="#888" stroke-width="2" stroke-dasharray="6,4"/>
            </g>

            <!-- ==================== 步骤1：分析A ==================== -->
            <g id="scene1-step1-group" class="step-group">
                <!-- 左栏：烧杯装置 -->
                <path d="M 130,200 L 130,280 L 190,280 L 190,200 L 180,185 L 140,185 Z" fill="none" stroke="#000" stroke-width="1.5"/>
                <path d="M 132,240 L 132,278 L 188,278 L 188,240 L 180,228 L 140,228 Z" fill="#e3f2fd" opacity="0.4"/>
                <rect x="150" y="165" width="20" height="20" fill="#bdbdbd" stroke="#000" stroke-width="1"/>
                <text x="160" y="158" text-anchor="middle" font-size="12" fill="#000">CaO</text>
                <text x="230" y="240" text-anchor="start" font-size="12" fill="#000">饱和石灰水</text>
                <text x="160" y="390" text-anchor="middle" font-size="14" fill="#000">
                    CaO + H<tspan baseline-shift="sub" font-size="10">2</tspan>O = Ca(OH)<tspan baseline-shift="sub" font-size="10">2</tspan>
                </text>

                <!-- 右栏：坐标系 -->
                <line x1="450" y1="380" x2="700" y2="380" stroke="#000" stroke-width="1"/>
                <line x1="450" y1="380" x2="450" y2="180" stroke="#000" stroke-width="1"/>
                <polygon points="700,380 692,376 692,384" fill="#000"/>
                <polygon points="450,180 446,188 454,188" fill="#000"/>
                <text x="575" y="400" text-anchor="middle" font-size="12" fill="#000">氧化钙质量/g</text>
                <text x="418" y="280" text-anchor="middle" font-size="12" fill="#000" transform="rotate(-90,418,280)">溶质质量/g</text>
                <line x1="480" y1="230" x2="680" y2="230" stroke="#888" stroke-width="2" stroke-dasharray="6,4"/>
                <path d="M 480,230 L 520,200 L 680,200" fill="none" stroke="#1565c0" stroke-width="2.5"/>
                <text x="480" y="150" font-size="13" fill="#c62828">溶剂减少、温度升高导致溶质析出</text>
            </g>

            <!-- ==================== 步骤2：分析B ==================== -->
            <g id="scene1-step2-group" class="step-group">
                <!-- 左栏：试管+酒精灯 -->
                <rect x="145" y="190" width="30" height="100" rx="4" fill="none" stroke="#000" stroke-width="1.5" transform="rotate(-15,160,240)"/>
                <rect x="148" y="250" width="24" height="35" rx="2" fill="#f5f5f5" opacity="0.5" transform="rotate(-15,160,240)"/>
                <rect x="150" y="325" width="20" height="30" fill="none" stroke="#000" stroke-width="1"/>
                <ellipse cx="160" cy="312" rx="8" ry="10" fill="#ff9800" opacity="0.8"/>
                <text x="210" y="240" text-anchor="start" font-size="12" fill="#000">KMnO<tspan baseline-shift="sub" font-size="10">4</tspan></text>
                <text x="160" y="390" text-anchor="middle" font-size="13" fill="#000">
                    2KMnO<tspan baseline-shift="sub" font-size="10">4</tspan> → K<tspan baseline-shift="sub" font-size="10">2</tspan>MnO<tspan baseline-shift="sub" font-size="10">4</tspan> + MnO<tspan baseline-shift="sub" font-size="10">2</tspan> + O<tspan baseline-shift="sub" font-size="10">2</tspan>↑
                </text>

                <!-- 右栏：坐标系 -->
                <line x1="450" y1="380" x2="700" y2="380" stroke="#000" stroke-width="1"/>
                <line x1="450" y1="380" x2="450" y2="180" stroke="#000" stroke-width="1"/>
                <polygon points="700,380 692,376 692,384" fill="#000"/>
                <polygon points="450,180 446,188 454,188" fill="#000"/>
                <text x="575" y="400" text-anchor="middle" font-size="12" fill="#000">反应时间/min</text>
                <text x="418" y="280" text-anchor="middle" font-size="12" fill="#000" transform="rotate(-90,418,280)">固体质量/g</text>
                <line x1="480" y1="200" x2="680" y2="380" stroke="#888" stroke-width="2" stroke-dasharray="6,4"/>
                <line x1="480" y1="200" x2="680" y2="280" stroke="#1565c0" stroke-width="2.5"/>
                <text x="480" y="150" font-size="13" fill="#c62828">反应后仍有固体剩余，质量不可能为零</text>
            </g>

            <!-- ==================== 步骤3：分析C ==================== -->
            <g id="scene1-step3-group" class="step-group">
                <!-- 左栏：坩埚+高温 -->
                <path d="M 130,250 Q 160,290 190,250" fill="none" stroke="#000" stroke-width="1.5"/>
                <line x1="130" y1="250" x2="190" y2="250" stroke="#000" stroke-width="1.5"/>
                <path d="M 135,250 Q 160,275 185,250 Z" fill="#f5f5f5" opacity="0.5"/>
                <path d="M 145,300 Q 160,270 175,300 Q 160,285 145,300" fill="#ff9800" opacity="0.7"/>
                <line x1="160" y1="220" x2="160" y2="170" stroke="#000" stroke-width="1.5" marker-end="url(#arrowhead)"/>
                <text x="180" y="180" font-size="12" fill="#000">CO<tspan baseline-shift="sub" font-size="10">2</tspan></text>
                <text x="220" y="240" text-anchor="start" font-size="12" fill="#000">CaCO<tspan baseline-shift="sub" font-size="10">3</tspan></text>
                <text x="160" y="390" text-anchor="middle" font-size="14" fill="#000">
                    CaCO<tspan baseline-shift="sub" font-size="10">3</tspan> → CaO + CO<tspan baseline-shift="sub" font-size="10">2</tspan>↑
                </text>

                <!-- 右栏：坐标系 -->
                <line x1="450" y1="380" x2="700" y2="380" stroke="#000" stroke-width="1"/>
                <line x1="450" y1="380" x2="450" y2="180" stroke="#000" stroke-width="1"/>
                <polygon points="700,380 692,376 692,384" fill="#000"/>
                <polygon points="450,180 446,188 454,188" fill="#000"/>
                <text x="575" y="400" text-anchor="middle" font-size="12" fill="#000">时间</text>
                <text x="418" y="280" text-anchor="middle" font-size="12" fill="#000" transform="rotate(-90,418,280)">固体质量(g)</text>
                <line x1="480" y1="220" x2="560" y2="220" stroke="#1565c0" stroke-width="2.5"/>
                <line x1="560" y1="220" x2="640" y2="300" stroke="#1565c0" stroke-width="2.5"/>
                <line x1="640" y1="300" x2="680" y2="300" stroke="#1565c0" stroke-width="2.5"/>
                <text x="600" y="150" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e7d32">正确</text>
                <text x="520" y="240" text-anchor="middle" font-size="11" fill="#000">预热</text>
                <text x="600" y="320" text-anchor="middle" font-size="11" fill="#000">分解</text>
                <text x="660" y="320" text-anchor="middle" font-size="11" fill="#000">反应完全</text>
            </g>

            <!-- ==================== 步骤4：分析D ==================== -->
            <g id="scene1-step4-group" class="step-group">
                <!-- 左栏：水槽+集气瓶 -->
                <rect x="110" y="260" width="100" height="60" fill="none" stroke="#000" stroke-width="1.5"/>
                <rect x="112" y="290" width="96" height="28" fill="#e3f2fd" opacity="0.3"/>
                <rect x="140" y="210" width="40" height="70" fill="none" stroke="#000" stroke-width="1.5"/>
                <line x1="140" y1="260" x2="180" y2="260" stroke="#000" stroke-width="1"/>
                <text x="160" y="195" text-anchor="middle" font-size="12" fill="#000">O<tspan baseline-shift="sub" font-size="10">2</tspan></text>
                <text x="160" y="390" text-anchor="middle" font-size="13" fill="#000">气体溶解度随温度升高而减小</text>

                <!-- 右栏：坐标系 -->
                <line x1="450" y1="380" x2="700" y2="380" stroke="#000" stroke-width="1"/>
                <line x1="450" y1="380" x2="450" y2="180" stroke="#000" stroke-width="1"/>
                <polygon points="700,380 692,376 692,384" fill="#000"/>
                <polygon points="450,180 446,188 454,188" fill="#000"/>
                <text x="575" y="400" text-anchor="middle" font-size="12" fill="#000">温度</text>
                <text x="418" y="280" text-anchor="middle" font-size="12" fill="#000" transform="rotate(-90,418,280)">溶解度(L)</text>
                <line x1="480" y1="340" x2="680" y2="240" stroke="#888" stroke-width="2" stroke-dasharray="6,4"/>
                <line x1="480" y1="240" x2="680" y2="340" stroke="#1565c0" stroke-width="2.5"/>
                <text x="480" y="150" font-size="13" fill="#c62828">气体溶解度随温度升高而减小</text>
            </g>

            <!-- ==================== 步骤5：结论 ==================== -->
            <g id="scene1-step5-group" class="step-group">
                <!-- A区 -->
                <rect x="40" y="65" width="340" height="150" fill="#ffebee" opacity="0.15" stroke="#ddd" stroke-width="1"/>
                <text x="210" y="58" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">A</text>
                <text x="55" y="75" text-anchor="middle" font-size="20" font-weight="bold" fill="#c62828">✗</text>
                <line x1="80" y1="200" x2="220" y2="200" stroke="#000" stroke-width="1"/>
                <line x1="80" y1="200" x2="80" y2="110" stroke="#000" stroke-width="1"/>
                <text x="150" y="230" text-anchor="middle" font-size="11" fill="#000">氧化钙质量/g</text>
                <text x="20" y="155" text-anchor="middle" font-size="11" fill="#000" transform="rotate(-90,20,155)">溶质质量/g</text>
                <line x1="100" y1="135" x2="200" y2="135" stroke="#888" stroke-width="2" stroke-dasharray="6,4"/>

                <!-- B区 -->
                <rect x="420" y="65" width="340" height="150" fill="#ffebee" opacity="0.15" stroke="#ddd" stroke-width="1"/>
                <text x="590" y="58" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">B</text>
                <text x="435" y="75" text-anchor="middle" font-size="20" font-weight="bold" fill="#c62828">✗</text>
                <line x1="480" y1="200" x2="620" y2="200" stroke="#000" stroke-width="1"/>
                <line x1="480" y1="200" x2="480" y2="110" stroke="#000" stroke-width="1"/>
                <text x="550" y="230" text-anchor="middle" font-size="11" fill="#000">反应时间/min</text>
                <text x="420" y="155" text-anchor="middle" font-size="11" fill="#000" transform="rotate(-90,420,155)">固体质量/g</text>
                <line x1="500" y1="110" x2="600" y2="200" stroke="#888" stroke-width="2" stroke-dasharray="6,4"/>

                <!-- C区（高亮） -->
                <rect x="40" y="270" width="340" height="145" fill="#e8f5e9" opacity="0.2" stroke="#2e7d32" stroke-width="3"/>
                <text x="210" y="262" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">C</text>
                <text x="55" y="278" text-anchor="middle" font-size="20" font-weight="bold" fill="#2e7d32">✓</text>
                <line x1="80" y1="395" x2="220" y2="395" stroke="#000" stroke-width="1"/>
                <line x1="80" y1="395" x2="80" y2="305" stroke="#000" stroke-width="1"/>
                <text x="150" y="425" text-anchor="middle" font-size="11" fill="#000">时间</text>
                <text x="20" y="350" text-anchor="middle" font-size="11" fill="#000" transform="rotate(-90,20,350)">固体质量(g)</text>
                <path d="M 100,330 L 140,330 L 180,375 L 220,375" fill="none" stroke="#1565c0" stroke-width="2.5"/>

                <!-- D区 -->
                <rect x="420" y="270" width="340" height="145" fill="#ffebee" opacity="0.15" stroke="#ddd" stroke-width="1"/>
                <text x="590" y="262" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">D</text>
                <text x="435" y="278" text-anchor="middle" font-size="20" font-weight="bold" fill="#c62828">✗</text>
                <line x1="480" y1="395" x2="620" y2="395" stroke="#000" stroke-width="1"/>
                <line x1="480" y1="395" x2="480" y2="305" stroke="#000" stroke-width="1"/>
                <text x="550" y="425" text-anchor="middle" font-size="11" fill="#000">温度</text>
                <text x="420" y="350" text-anchor="middle" font-size="11" fill="#000" transform="rotate(-90,420,350)">溶解度(L)</text>
                <line x1="500" y1="370" x2="600" y2="325" stroke="#888" stroke-width="2" stroke-dasharray="6,4"/>

                <!-- 结论文字 -->
                <text x="400" y="448" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">正确选项：C</text>
            </g>

            <!-- 箭头标记定义 -->
            <defs>
                <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
                </marker>
            </defs>
        </svg>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <svg width="120" height="24">
                <circle id="scene1-dot-0" class="scene1-dot active" cx="14" cy="12" r="6"/>
                <circle id="scene1-dot-1" class="scene1-dot" cx="34" cy="12" r="6"/>
                <circle id="scene1-dot-2" class="scene1-dot" cx="54" cy="12" r="6"/>
                <circle id="scene1-dot-3" class="scene1-dot" cx="74" cy="12" r="6"/>
                <circle id="scene1-dot-4" class="scene1-dot" cx="94" cy="12" r="6"/>
                <circle id="scene1-dot-5" class="scene1-dot" cx="114" cy="12" r="6"/>
            </svg>
            <span id="scene1-step-label">题目总览</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        var currentStep = 0;
        var totalSteps = 6;
        var stepTitles = ['题目总览', '选项A：饱和石灰水 + CaO', '选项B：加热高锰酸钾', '选项C：高温煅烧碳酸钙', '选项D：氧气溶解性', '正确答案'];
        var stepLabels = ['题目总览', '分析A', '分析B', '分析C', '分析D', '结论'];

        var titleEl = document.getElementById('scene1-title');
        var stepLabelEl = document.getElementById('scene1-step-label');
        var prevBtn = document.getElementById('scene1-btn-prev');
        var nextBtn = document.getElementById('scene1-btn-next');

        function updateStep(step) {
            currentStep = step;
            titleEl.textContent = stepTitles[currentStep];
            stepLabelEl.textContent = stepLabels[currentStep];

            for (var i = 0; i < totalSteps; i++) {
                var group = document.getElementById('scene1-step' + i + '-group');
                if (group) {
                    if (i === currentStep) {
                        group.style.display = 'block';
                        group.style.opacity = '1';
                    } else {
                        group.style.display = 'none';
                        group.style.opacity = '0';
                    }
                }
            }

            for (var i = 0; i < totalSteps; i++) {
                var dot = document.getElementById('scene1-dot-' + i);
                if (dot) {
                    if (i === currentStep) {
                        dot.setAttribute('fill', '#1565c0');
                        dot.classList.add('active');
                    } else {
                        dot.setAttribute('fill', '#bdbdbd');
                        dot.classList.remove('active');
                    }
                }
            }

            prevBtn.disabled = (currentStep === 0);
            nextBtn.disabled = (currentStep === totalSteps - 1);
        }

        prevBtn.addEventListener('click', function() {
            if (currentStep > 0) {
                updateStep(currentStep - 1);
            }
        });

        nextBtn.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                updateStep(currentStep + 1);
            }
        });

        updateStep(0);
    })();
    </script>
</body>
</html>
