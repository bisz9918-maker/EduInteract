<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>概念层级关系验证</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene2-controls button {
            width: 80px; height: 28px; border: none; border-radius: 4px;
            background: #1565c0; color: #fff; font-size: 13px; cursor: pointer;
            transition: background 0.2s;
        }
        #scene2-controls button:disabled {
            background: #cccccc; cursor: not-allowed;
        }
        #scene2-step-indicator {
            font-size: 14px; color: #000; min-width: 80px; text-align: center;
        }
        /* 步骤分组显隐控制 */
        .scene2-step-group {
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            pointer-events: none;
        }
        .scene2-step-group.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }
        /* 结论区显隐 */
        .scene2-conclusion {
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .scene2-conclusion.active {
            opacity: 1;
            visibility: visible;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" viewBox="0 0 800 500" style="display:block;">
            <!-- 定义 -->
            <defs>
                <style>
                    .concept-box { fill: rgba(21,101,192,0.1); stroke: #1565c0; stroke-width: 3; rx: 8; }
                    .concept-circle { fill: rgba(21,101,192,0.1); stroke: #1565c0; stroke-width: 3; }
                    .concept-label { font-size: 14px; fill: #000; text-anchor: middle; dominant-baseline: middle; }
                    .thumb-box { fill: #f5f5f5; stroke: #000; stroke-width: 1; }
                    .thumb-circle { fill: none; stroke: #000; stroke-width: 1; }
                    .thumb-label { font-size: 14px; fill: #000; text-anchor: middle; dominant-baseline: middle; }
                    .thumb-label-small { font-size: 12px; fill: #000; text-anchor: middle; dominant-baseline: middle; }
                    .mark-x { stroke: #c62828; stroke-width: 4; stroke-linecap: round; fill: none; }
                    .mark-check { stroke: #2e7d32; stroke-width: 4; stroke-linecap: round; fill: none; }
                    .result-wrong { font-size: 16px; fill: #c62828; font-weight: bold; }
                    .result-correct { font-size: 16px; fill: #2e7d32; font-weight: bold; }
                    .reason-text { font-size: 14px; fill: #000; }
                    .guide-text { font-size: 16px; fill: #000; text-anchor: middle; dominant-baseline: middle; }
                </style>
            </defs>

            <!-- ===== 步骤0：引导 ===== -->
            <g id="scene2-step0-group" class="scene2-step-group active">
                <text x="260" y="240" class="guide-text">请观察各选项概念的真实关系，并与原图结构对比</text>
            </g>

            <!-- ===== 步骤1：选项A（鱼类/爬行类/鸟类/哺乳类） ===== -->
            <g id="scene2-step1-group" class="scene2-step-group">
                <!-- 四个并列矩形 -->
                <rect x="70" y="190" width="80" height="50" class="concept-box" rx="8"/>
                <rect x="170" y="190" width="80" height="50" class="concept-box" rx="8"/>
                <rect x="270" y="190" width="80" height="50" class="concept-box" rx="8"/>
                <rect x="370" y="190" width="80" height="50" class="concept-box" rx="8"/>
                <!-- 标签（位于矩形上方，避免与图形重叠） -->
                <text x="110" y="180" class="concept-label">鱼类</text>
                <text x="210" y="180" class="concept-label">爬行类</text>
                <text x="310" y="180" class="concept-label">鸟类</text>
                <text x="410" y="180" class="concept-label">哺乳类</text>
            </g>

            <!-- ===== 步骤2：选项B（细胞核→染色体→DNA→基因） ===== -->
            <g id="scene2-step2-group" class="scene2-step-group">
                <!-- 细胞核(IV) 最外层 -->
                <rect x="130" y="150" width="260" height="180" class="concept-box" rx="8"/>
                <text x="260" y="135" class="concept-label">细胞核</text>
                <!-- 染色体(I) 第二层 -->
                <rect x="160" y="180" width="200" height="120" class="concept-box" rx="8"/>
                <text x="95" y="240" class="concept-label">染色体</text>
                <!-- DNA(II) 第三层 -->
                <rect x="190" y="205" width="140" height="70" class="concept-box" rx="8"/>
                <text x="420" y="210" class="concept-label">DNA</text>
                <!-- 基因(III) 最内层 -->
                <rect x="220" y="220" width="80" height="40" class="concept-box" rx="8"/>
                <text x="420" y="270" class="concept-label">基因</text>
            </g>

            <!-- ===== 步骤3：选项C（种子→胚/种皮，胚→子叶） ===== -->
            <g id="scene2-step3-group" class="scene2-step-group">
                <!-- 种子(I) 最外层 -->
                <rect x="130" y="150" width="260" height="180" class="concept-box" rx="8"/>
                <text x="260" y="135" class="concept-label">种子</text>
                <!-- 胚(II) 左侧 -->
                <rect x="150" y="180" width="120" height="120" class="concept-box" rx="8"/>
                <text x="110" y="240" class="concept-label">胚</text>
                <!-- 种皮(IV) 右侧 -->
                <rect x="290" y="180" width="80" height="120" class="concept-box" rx="8"/>
                <text x="420" y="240" class="concept-label">种皮</text>
                <!-- 子叶(III) 胚内部 -->
                <rect x="180" y="210" width="60" height="60" class="concept-box" rx="8"/>
                <text x="210" y="345" class="concept-label">子叶</text>
            </g>

            <!-- ===== 步骤4：选项D（微生物→病毒/细菌/真菌） ===== -->
            <g id="scene2-step4-group" class="scene2-step-group">
                <!-- 微生物(I) 大圆 -->
                <circle cx="260" cy="240" r="110" class="concept-circle" style="fill:rgba(21,101,192,0.05);"/>
                <text x="120" y="240" class="concept-label">微生物</text>
                <!-- 病毒(II) 上方小圆 -->
                <circle cx="260" cy="170" r="35" class="concept-circle"/>
                <text x="260" y="120" class="concept-label">病毒</text>
                <!-- 细菌(III) 左下小圆 -->
                <circle cx="190" cy="300" r="35" class="concept-circle"/>
                <text x="140" y="355" class="concept-label">细菌</text>
                <!-- 真菌(IV) 右下小圆 -->
                <circle cx="330" cy="300" r="35" class="concept-circle"/>
                <text x="380" y="355" class="concept-label">真菌</text>
            </g>

            <!-- ===== 右侧：原题缩略图（所有步骤均显示） ===== -->
            <g id="scene2-thumbnail-group">
                <!-- 外框 -->
                <rect x="550" y="70" width="140" height="140" class="thumb-box" rx="4"/>
                <!-- 大圆 I -->
                <circle cx="620" cy="140" r="60" class="thumb-circle"/>
                <text x="540" y="130" class="thumb-label">I</text>
                <!-- 小圆 II 上方 -->
                <circle cx="620" cy="95" r="22" class="thumb-circle"/>
                <text x="620" y="55" class="thumb-label-small">II</text>
                <!-- 小圆 III 左下 -->
                <circle cx="585" cy="170" r="22" class="thumb-circle"/>
                <text x="540" y="180" class="thumb-label-small">III</text>
                <!-- 小圆 IV 右下 -->
                <circle cx="655" cy="170" r="22" class="thumb-circle"/>
                <text x="700" y="180" class="thumb-label-small">IV</text>
            </g>

            <!-- ===== 结论区：错误（步骤1-3） ===== -->
            <g id="scene2-conclusion-wrong" class="scene2-conclusion">
                <!-- 红叉 -->
                <path d="M 710 100 L 760 150 M 760 100 L 710 150" class="mark-x"/>
                <!-- 原因文字 -->
                <text id="scene2-wrong-reason" x="575" y="240" class="reason-text">四类并列，无包含关系</text>
                <!-- 结果文字 -->
                <text x="575" y="300" class="result-wrong">不符合</text>
            </g>

            <!-- ===== 结论区：正确（步骤4） ===== -->
            <g id="scene2-conclusion-correct" class="scene2-conclusion">
                <!-- 绿勾 -->
                <path d="M 710 125 L 725 140 L 760 105" class="mark-check"/>
                <!-- 原因文字 -->
                <text x="575" y="240" class="reason-text">一大类包含三个并列子类</text>
                <!-- 结果文字 -->
                <text x="575" y="300" class="result-correct">符合</text>
            </g>
        </svg>

        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-btn-prev" disabled>◀ 上一步</button>
            <span id="scene2-step-indicator">准备</span>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2 实现
        var currentStep = 0;
        var totalSteps = 4;

        var btnPrev = document.getElementById('scene2-btn-prev');
        var btnNext = document.getElementById('scene2-btn-next');
        var indicator = document.getElementById('scene2-step-indicator');

        var stepGroups = [];
        for (var i = 0; i <= totalSteps; i++) {
            stepGroups.push(document.getElementById('scene2-step' + i + '-group'));
        }

        var conclusionWrong = document.getElementById('scene2-conclusion-wrong');
        var conclusionCorrect = document.getElementById('scene2-conclusion-correct');
        var wrongReason = document.getElementById('scene2-wrong-reason');

        var stepLabels = ['准备', '选项 A / 4', '选项 B / 4', '选项 C / 4', '选项 D / 4'];
        var wrongReasons = [
            '',
            '四类并列，无包含关系',
            '层级嵌套，且 I 非最大',
            'II 包含 III，非并列',
            ''
        ];

        function updateView() {
            // 更新步骤分组显隐
            for (var i = 0; i <= totalSteps; i++) {
                if (i === currentStep) {
                    stepGroups[i].classList.add('active');
                } else {
                    stepGroups[i].classList.remove('active');
                }
            }

            // 更新结论区
            if (currentStep >= 1 && currentStep <= 3) {
                conclusionWrong.classList.add('active');
                conclusionCorrect.classList.remove('active');
                if (wrongReason) wrongReason.textContent = wrongReasons[currentStep];
            } else if (currentStep === 4) {
                conclusionWrong.classList.remove('active');
                conclusionCorrect.classList.add('active');
            } else {
                conclusionWrong.classList.remove('active');
                conclusionCorrect.classList.remove('active');
            }

            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps);
            if (currentStep === totalSteps) {
                btnNext.textContent = '完成';
            } else {
                btnNext.textContent = '下一步 ▶';
            }

            // 更新指示器
            indicator.textContent = stepLabels[currentStep];
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateView();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateView();
            }
        });

        // 初始化
        updateView();
    })();
    </script>
</body>
</html>
