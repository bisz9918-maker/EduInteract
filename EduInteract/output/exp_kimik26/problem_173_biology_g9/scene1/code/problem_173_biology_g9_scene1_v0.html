<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>碳循环图示 - Scene 1</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-svg { position: absolute; top: 0; left: 0; z-index: 1; }

        /* 节点文字覆盖层 */
        .scene1-node-text {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #333;
            pointer-events: none;
            z-index: 2;
        }

        /* 过程标签 */
        .scene1-label {
            position: absolute;
            font-size: 13px;
            color: #1565c0;
            transform: translateX(-50%);
            line-height: 1;
            white-space: nowrap;
            z-index: 2;
            background: rgba(255,255,255,0.85);
            padding: 2px 4px;
            border-radius: 3px;
        }

        /* 身份标签 */
        .scene1-identity {
            position: absolute;
            font-size: 14px;
            font-weight: bold;
            transform: translateX(-50%);
            line-height: 1;
            white-space: nowrap;
            z-index: 2;
            background: rgba(255,255,255,0.85);
            padding: 2px 4px;
            border-radius: 3px;
        }

        /* 提示文字 */
        .scene1-hint {
            position: absolute;
            left: 50px;
            width: 700px;
            text-align: center;
            font-size: 14px;
            color: #1565c0;
            line-height: 1.4;
            z-index: 2;
            background: rgba(255,255,255,0.95);
            padding: 6px 10px;
            border-radius: 4px;
            box-sizing: border-box;
        }

        /* 选项 */
        .scene1-option {
            position: absolute;
            left: 250px;
            font-size: 14px;
            color: #333;
            line-height: 1;
            white-space: nowrap;
            z-index: 2;
        }

        /* 控件栏 */
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }
        .scene1-btn {
            padding: 6px 16px;
            font-size: 14px;
            border: 1px solid #333;
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
            transition: all 0.2s;
        }
        .scene1-btn:hover:not(:disabled) { background: #f0f0f0; }
        .scene1-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene1-step-indicator {
            font-size: 13px;
            color: #666;
            min-width: 50px;
            text-align: center;
        }

        /* 过渡效果 */
        .scene1-transition {
            transition: opacity 0.3s ease, stroke-width 0.3s ease, fill-opacity 0.3s ease, stroke 0.3s ease, fill 0.3s ease;
        }
        .scene1-dimmed { opacity: 0.3; }
        .scene1-highlight-stroke { stroke-width: 3px !important; }
        .scene1-hidden { opacity: 0; pointer-events: none; }
        .scene1-visible { opacity: 1; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <!-- SVG: 箭头在 rects 之前绘制，使箭头位于节点下方 -->
        <svg id="scene1-svg" width="800" height="500">
            <defs>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
                </marker>
                <marker id="scene1-arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32"/>
                </marker>
                <marker id="scene1-arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#c62828"/>
                </marker>
                <marker id="scene1-arrowhead-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#616161"/>
                </marker>
            </defs>

            <!-- ==================== 箭头 (先绘制，位于节点下方) ==================== -->
            <path id="scene1-arrow-atm-jia" class="scene1-transition" d="M 360 80 L 230 200" stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#scene1-arrowhead)"/>
            <path id="scene1-arrow-jia-atm" class="scene1-transition" d="M 210 200 L 340 80" stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#scene1-arrowhead)"/>
            <path id="scene1-arrow-yi-atm" class="scene1-transition" d="M 400 200 L 400 80" stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#scene1-arrowhead)"/>
            <path id="scene1-arrow-bing-atm" class="scene1-transition" d="M 580 200 L 440 80" stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#scene1-arrowhead)"/>
            <path id="scene1-arrow-jia-yi" class="scene1-transition" d="M 250 220 L 350 220" stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#scene1-arrowhead)"/>
            <path id="scene1-arrow-bing-yi" class="scene1-transition" d="M 550 220 L 450 220" stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#scene1-arrowhead)"/>
            <path id="scene1-arrow-jia-bing" class="scene1-transition" d="M 200 240 Q 400 320 600 240" stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#scene1-arrowhead)"/>

            <!-- ==================== 节点矩形 (后绘制，覆盖箭头末端) ==================== -->
            <rect id="scene1-atmosphere-node" class="scene1-transition" x="325" y="40" width="150" height="40" rx="8" ry="8"
                  fill="rgba(21,101,192,0.15)" stroke="#1565c0" stroke-width="2"/>
            <rect id="scene1-jia-node" class="scene1-transition" x="150" y="200" width="100" height="40" rx="8" ry="8"
                  fill="#fff" stroke="#000" stroke-width="2"/>
            <rect id="scene1-yi-node" class="scene1-transition" x="350" y="200" width="100" height="40" rx="8" ry="8"
                  fill="#fff" stroke="#000" stroke-width="2"/>
            <rect id="scene1-bing-node" class="scene1-transition" x="550" y="200" width="100" height="40" rx="8" ry="8"
                  fill="#fff" stroke="#000" stroke-width="2"/>
        </svg>

        <!-- ==================== HTML 文字覆盖层 ==================== -->
        <!-- 节点文字 -->
        <div id="scene1-atmosphere-text" class="scene1-node-text scene1-transition" style="left:325px;top:40px;width:150px;height:40px;">大气中的二氧化碳</div>
        <div id="scene1-jia-text" class="scene1-node-text scene1-transition" style="left:150px;top:200px;width:100px;height:40px;">甲</div>
        <div id="scene1-yi-text" class="scene1-node-text scene1-transition" style="left:350px;top:200px;width:100px;height:40px;">乙</div>
        <div id="scene1-bing-text" class="scene1-node-text scene1-transition" style="left:550px;top:200px;width:100px;height:40px;">丙</div>

        <!-- 过程标签 -->
        <div id="scene1-label-photosynthesis" class="scene1-label scene1-transition scene1-hidden" style="left:230px;top:175px;">光合作用</div>
        <div id="scene1-label-respiration-jia" class="scene1-label scene1-transition scene1-hidden" style="left:310px;top:175px;">呼吸作用</div>
        <div id="scene1-label-decomposition" class="scene1-label scene1-transition scene1-hidden" style="left:400px;top:175px;">分解作用</div>
        <div id="scene1-label-respiration-bing" class="scene1-label scene1-transition scene1-hidden" style="left:510px;top:175px;">呼吸作用</div>
        <div id="scene1-label-feeding" class="scene1-label scene1-transition scene1-hidden" style="left:400px;top:292px;">摄食</div>

        <!-- 身份标签 -->
        <div id="scene1-label-producer" class="scene1-identity scene1-transition scene1-hidden" style="left:200px;top:239px;color:#2e7d32;">生产者</div>
        <div id="scene1-label-decomposer" class="scene1-identity scene1-transition scene1-hidden" style="left:400px;top:239px;color:#616161;">分解者</div>
        <div id="scene1-label-consumer" class="scene1-identity scene1-transition scene1-hidden" style="left:600px;top:239px;color:#c62828;">消费者</div>

        <!-- 提示文字 -->
        <div id="scene1-hint-text" class="scene1-hint scene1-transition scene1-hidden" style="top:95px;"></div>

        <!-- 选项 -->
        <div id="scene1-option-a" class="scene1-option scene1-transition scene1-hidden" style="top:335px;">A．甲为生产者，乙为分解者，丙为消费者</div>
        <div id="scene1-option-b" class="scene1-option scene1-transition scene1-hidden" style="top:365px;">B．甲为消费者，乙为分解者，丙为生产者</div>
        <div id="scene1-option-c" class="scene1-option scene1-transition scene1-hidden" style="top:395px;">C．甲为分解者，乙为生产者，丙为消费者</div>
        <div id="scene1-option-d" class="scene1-option scene1-transition scene1-hidden" style="top:425px;">D．甲为生产者，乙为消费者，丙为分解者</div>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn">◀ 上一步</button>
            <span id="scene1-step-indicator">1 / 6</span>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        let currentStep = 0;
        const totalSteps = 6;

        // DOM 元素引用
        const els = {
            // SVG 节点矩形
            atmosphereNode: document.getElementById('scene1-atmosphere-node'),
            jiaNode: document.getElementById('scene1-jia-node'),
            yiNode: document.getElementById('scene1-yi-node'),
            bingNode: document.getElementById('scene1-bing-node'),

            // HTML 节点文字
            atmosphereText: document.getElementById('scene1-atmosphere-text'),
            jiaText: document.getElementById('scene1-jia-text'),
            yiText: document.getElementById('scene1-yi-text'),
            bingText: document.getElementById('scene1-bing-text'),

            // SVG 箭头
            arrowAtmJia: document.getElementById('scene1-arrow-atm-jia'),
            arrowJiaAtm: document.getElementById('scene1-arrow-jia-atm'),
            arrowYiAtm: document.getElementById('scene1-arrow-yi-atm'),
            arrowBingAtm: document.getElementById('scene1-arrow-bing-atm'),
            arrowJiaYi: document.getElementById('scene1-arrow-jia-yi'),
            arrowBingYi: document.getElementById('scene1-arrow-bing-yi'),
            arrowJiaBing: document.getElementById('scene1-arrow-jia-bing'),

            // HTML 标签
            labelPhotosynthesis: document.getElementById('scene1-label-photosynthesis'),
            labelRespirationJia: document.getElementById('scene1-label-respiration-jia'),
            labelDecomposition: document.getElementById('scene1-label-decomposition'),
            labelRespirationBing: document.getElementById('scene1-label-respiration-bing'),
            labelFeeding: document.getElementById('scene1-label-feeding'),

            labelProducer: document.getElementById('scene1-label-producer'),
            labelConsumer: document.getElementById('scene1-label-consumer'),
            labelDecomposer: document.getElementById('scene1-label-decomposer'),

            hintText: document.getElementById('scene1-hint-text'),

            optionA: document.getElementById('scene1-option-a'),
            optionB: document.getElementById('scene1-option-b'),
            optionC: document.getElementById('scene1-option-c'),
            optionD: document.getElementById('scene1-option-d'),

            btnPrev: document.getElementById('scene1-btn-prev'),
            btnNext: document.getElementById('scene1-btn-next'),
            stepIndicator: document.getElementById('scene1-step-indicator')
        };

        // 工具函数
        function show(el) {
            if (!el) return;
            el.classList.remove('scene1-hidden');
            el.classList.add('scene1-visible');
        }
        function hide(el) {
            if (!el) return;
            el.classList.remove('scene1-visible');
            el.classList.add('scene1-hidden');
        }
        function dim(el) {
            if (!el) return;
            el.classList.add('scene1-dimmed');
        }
        function undim(el) {
            if (!el) return;
            el.classList.remove('scene1-dimmed');
        }
        function highlightStroke(el, color, markerId) {
            if (!el) return;
            el.classList.add('scene1-highlight-stroke');
            if (color) el.setAttribute('stroke', color);
            if (markerId) el.setAttribute('marker-end', 'url(#' + markerId + ')');
        }
        function unhighlightStroke(el, color, markerId) {
            if (!el) return;
            el.classList.remove('scene1-highlight-stroke');
            if (color) el.setAttribute('stroke', color);
            if (markerId) el.setAttribute('marker-end', 'url(#' + markerId + ')');
        }
        function setNodeStyle(node, stroke, fill) {
            if (!node) return;
            if (stroke) node.setAttribute('stroke', stroke);
            if (fill) node.setAttribute('fill', fill);
        }
        function resetNodeStyle(node) {
            if (!node) return;
            node.setAttribute('stroke', '#000');
            node.setAttribute('fill', '#fff');
        }
        function resetArrowStyle(arrow) {
            if (!arrow) return;
            arrow.setAttribute('stroke', '#000');
            arrow.setAttribute('stroke-width', '1.5');
            arrow.setAttribute('marker-end', 'url(#scene1-arrowhead)');
        }

        // 重置所有元素到默认状态
        function resetAll() {
            // 重置所有节点和箭头的淡化/高亮
            const allEls = [
                els.atmosphereNode, els.jiaNode, els.yiNode, els.bingNode,
                els.atmosphereText, els.jiaText, els.yiText, els.bingText,
                els.arrowAtmJia, els.arrowJiaAtm, els.arrowYiAtm,
                els.arrowBingAtm, els.arrowJiaYi, els.arrowBingYi, els.arrowJiaBing
            ];
            allEls.forEach(el => {
                undim(el);
                if (el.tagName === 'path') {
                    unhighlightStroke(el);
                    resetArrowStyle(el);
                } else if (el.tagName === 'rect') {
                    resetNodeStyle(el);
                }
            });

            // 恢复大气节点默认样式
            setNodeStyle(els.atmosphereNode, '#1565c0', 'rgba(21,101,192,0.15)');

            // 隐藏所有标签
            hide(els.labelPhotosynthesis);
            hide(els.labelRespirationJia);
            hide(els.labelDecomposition);
            hide(els.labelRespirationBing);
            hide(els.labelFeeding);
            hide(els.labelProducer);
            hide(els.labelConsumer);
            hide(els.labelDecomposer);
            hide(els.hintText);
            hide(els.optionA);
            hide(els.optionB);
            hide(els.optionC);
            hide(els.optionD);

            // 重置选项样式
            els.optionA.style.color = '#333';
            els.optionA.style.fontWeight = 'normal';
            els.optionB.style.color = '#333';
            els.optionB.style.fontWeight = 'normal';
            els.optionC.style.color = '#333';
            els.optionC.style.fontWeight = 'normal';
            els.optionD.style.color = '#333';
            els.optionD.style.fontWeight = 'normal';
        }

        // 渲染指定步骤
        function renderStep(step) {
            resetAll();

            switch (step) {
                case 0:
                    // 步骤0：初始状态，展示原图框架
                    break;

                case 1:
                    // 步骤1：判定生产者（甲）
                    {
                        const dimEls = [
                            els.yiNode, els.yiText, els.bingNode, els.bingText,
                            els.arrowYiAtm, els.arrowBingAtm, els.arrowJiaYi, els.arrowBingYi, els.arrowJiaBing
                        ];
                        dimEls.forEach(el => dim(el));

                        setNodeStyle(els.jiaNode, '#2e7d32', 'rgba(46,125,50,0.15)');
                        highlightStroke(els.arrowAtmJia, '#2e7d32', 'scene1-arrowhead-green');
                        highlightStroke(els.arrowJiaAtm, '#2e7d32', 'scene1-arrowhead-green');

                        els.hintText.textContent = '甲与大气存在双向碳交换：吸收CO₂（光合作用）、释放CO₂（呼吸作用）→ 确定甲为生产者';
                        show(els.hintText);
                        show(els.labelProducer);
                    }
                    break;

                case 2:
                    // 步骤2：判定消费者（丙）
                    {
                        const dimEls = [
                            els.jiaNode, els.jiaText, els.yiNode, els.yiText,
                            els.arrowAtmJia, els.arrowJiaAtm, els.arrowYiAtm, els.arrowJiaYi, els.arrowBingYi
                        ];
                        dimEls.forEach(el => dim(el));

                        setNodeStyle(els.bingNode, '#c62828', 'rgba(198,40,40,0.15)');
                        highlightStroke(els.arrowJiaBing, '#c62828', 'scene1-arrowhead-red');
                        highlightStroke(els.arrowBingAtm, '#c62828', 'scene1-arrowhead-red');

                        els.hintText.textContent = '丙直接以甲为食，并通过呼吸作用向大气释放CO₂ → 确定丙为消费者';
                        show(els.hintText);
                        show(els.labelConsumer);
                    }
                    break;

                case 3:
                    // 步骤3：判定分解者（乙）
                    {
                        const dimEls = [
                            els.jiaNode, els.jiaText, els.bingNode, els.bingText,
                            els.arrowAtmJia, els.arrowJiaAtm, els.arrowBingAtm, els.arrowJiaBing
                        ];
                        dimEls.forEach(el => dim(el));

                        setNodeStyle(els.yiNode, '#616161', 'rgba(97,97,97,0.15)');
                        highlightStroke(els.arrowJiaYi, '#616161', 'scene1-arrowhead-gray');
                        highlightStroke(els.arrowBingYi, '#616161', 'scene1-arrowhead-gray');
                        highlightStroke(els.arrowYiAtm, '#616161', 'scene1-arrowhead-gray');

                        els.hintText.textContent = '乙分解动植物遗体，将有机物中的碳以CO₂形式归还大气 → 确定乙为分解者';
                        show(els.hintText);
                        show(els.labelDecomposer);
                    }
                    break;

                case 4:
                    // 步骤4：完整标注
                    setNodeStyle(els.jiaNode, '#2e7d32', 'rgba(46,125,50,0.15)');
                    setNodeStyle(els.yiNode, '#616161', 'rgba(97,97,97,0.15)');
                    setNodeStyle(els.bingNode, '#c62828', 'rgba(198,40,40,0.15)');

                    show(els.labelPhotosynthesis);
                    show(els.labelRespirationJia);
                    show(els.labelDecomposition);
                    show(els.labelRespirationBing);
                    show(els.labelFeeding);
                    show(els.labelProducer);
                    show(els.labelConsumer);
                    show(els.labelDecomposer);
                    break;

                case 5:
                    // 步骤5：得出结论
                    setNodeStyle(els.jiaNode, '#2e7d32', 'rgba(46,125,50,0.15)');
                    setNodeStyle(els.yiNode, '#616161', 'rgba(97,97,97,0.15)');
                    setNodeStyle(els.bingNode, '#c62828', 'rgba(198,40,40,0.15)');

                    show(els.labelPhotosynthesis);
                    show(els.labelRespirationJia);
                    show(els.labelDecomposition);
                    show(els.labelRespirationBing);
                    show(els.labelFeeding);
                    show(els.labelProducer);
                    show(els.labelConsumer);
                    show(els.labelDecomposer);

                    show(els.optionA);
                    show(els.optionB);
                    show(els.optionC);
                    show(els.optionD);

                    // 正确答案A高亮
                    els.optionA.style.color = '#2e7d32';
                    els.optionA.style.fontWeight = 'bold';
                    break;
            }

            // 更新按钮状态
            els.btnPrev.disabled = (step === 0);
            els.btnNext.disabled = (step === totalSteps - 1);
            els.stepIndicator.textContent = (step + 1) + ' / ' + totalSteps;
        }

        // 事件绑定
        els.btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep(currentStep);
            }
        });
        els.btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                renderStep(currentStep);
            }
        });

        // 初始化
        renderStep(currentStep);
    })();
    </script>
</body>
</html>
