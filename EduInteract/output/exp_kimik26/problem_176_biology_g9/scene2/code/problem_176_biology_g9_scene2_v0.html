<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 血管含氧量对比与选项判断</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene2-btn {
            width: 130px; height: 32px; border: 1px solid #888888; border-radius: 4px;
            font-size: 14px; cursor: pointer; transition: all 0.2s ease;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }
        .scene2-btn-active-blue { background: #1565c0; color: #ffffff; border-color: #1565c0; }
        .scene2-btn-active-green { background: #2e7d32; color: #ffffff; border-color: #2e7d32; }
        .scene2-btn-inactive { background: #ffffff; color: #333333; border-color: #888888; }
        #scene2-state2-overlay {
            position: absolute; top: 0; left: 0; width: 800px; height: 440px;
            display: none; pointer-events: none;
        }
        .scene2-option-box {
            position: absolute; left: 80px; width: 640px; height: 70px;
            border-radius: 4px; border: 1px solid #000000; background: #ffffff;
            box-sizing: border-box; pointer-events: auto;
        }
        .scene2-option-letter {
            position: absolute; left: 20px; top: 16px;
            font-size: 16px; font-weight: bold; color: #000000;
        }
        .scene2-option-text {
            position: absolute; left: 50px; top: 16px;
            font-size: 14px; color: #000000;
        }
        .scene2-option-mark {
            position: absolute; right: 20px; top: 14px;
            font-size: 20px; font-weight: bold;
        }
        .scene2-mark-wrong { color: #c62828; }
        .scene2-mark-correct { color: #2e7d32; }
        .scene2-option-reason {
            position: absolute; left: 50px; top: 44px;
            font-size: 12px; color: #555555;
        }
        #scene2-option-c-box {
            background: rgba(46,125,50,0.15); border-color: #2e7d32;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500">
            <g id="scene2-state1-group">
                <text id="scene2-title-state1" x="400" y="50" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="bold" fill="#000000">含氧量对比</text>
                <text id="scene2-label-1" x="100" y="140" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#000000">①</text>
                <rect id="scene2-bar-1" x="140" y="125" width="70" height="30" rx="4" fill="#1565c0"/>
                <text id="scene2-label-2" x="100" y="220" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#000000">②</text>
                <rect id="scene2-bar-2" x="140" y="205" width="210" height="30" rx="4" fill="#c62828"/>
                <text id="scene2-label-3" x="100" y="300" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#000000">③</text>
                <rect id="scene2-bar-3" x="140" y="285" width="210" height="30" rx="4" fill="#c62828"/>
                <text id="scene2-label-4" x="100" y="380" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#000000">④</text>
                <rect id="scene2-bar-4" x="140" y="365" width="70" height="30" rx="4" fill="#1565c0"/>
                <rect id="scene2-legend-blue" x="450" y="200" width="60" height="20" rx="3" fill="#1565c0"/>
                <text id="scene2-legend-blue-text" x="520" y="212" text-anchor="start" dominant-baseline="middle" font-size="14" fill="#000000">静脉血（含氧低）</text>
                <rect id="scene2-legend-red" x="450" y="280" width="60" height="20" rx="3" fill="#c62828"/>
                <text id="scene2-legend-red-text" x="520" y="292" text-anchor="start" dominant-baseline="middle" font-size="14" fill="#000000">动脉血（含氧高）</text>
            </g>
            <g id="scene2-state2-svg-group" style="display: none;">
                <text id="scene2-title-state2" x="400" y="50" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="bold" fill="#000000">选项判断</text>
            </g>
            <line id="scene2-separator" x1="40" y1="430" x2="760" y2="430" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
        </svg>
        <div id="scene2-state2-overlay">
            <div class="scene2-option-box" id="scene2-option-a-box" style="top: 85px;">
                <span class="scene2-option-letter">A</span>
                <span class="scene2-option-text">血管①、④是动脉</span>
                <span class="scene2-option-mark scene2-mark-wrong">×</span>
                <span class="scene2-option-reason">①④为静脉</span>
            </div>
            <div class="scene2-option-box" id="scene2-option-b-box" style="top: 162px;">
                <span class="scene2-option-letter">B</span>
                <span class="scene2-option-text">血管②、③是静脉</span>
                <span class="scene2-option-mark scene2-mark-wrong">×</span>
                <span class="scene2-option-reason">②③为动脉</span>
            </div>
            <div class="scene2-option-box" id="scene2-option-c-box" style="top: 239px;">
                <span class="scene2-option-letter">C</span>
                <span class="scene2-option-text">血管①中血液的含氧量比血管③低</span>
                <span class="scene2-option-mark scene2-mark-correct">√</span>
                <span class="scene2-option-reason">①为静脉血，③为动脉血</span>
            </div>
            <div class="scene2-option-box" id="scene2-option-d-box" style="top: 316px;">
                <span class="scene2-option-letter">D</span>
                <span class="scene2-option-text">血管④中血液的含氧量比血管②高</span>
                <span class="scene2-option-mark scene2-mark-wrong">×</span>
                <span class="scene2-option-reason">④为静脉血，②为动脉血，静脉血含氧量低于动脉血</span>
            </div>
        </div>
        <div id="scene2-controls">
            <button id="scene2-btn-state1" class="scene2-btn scene2-btn-active-blue">含氧量对比</button>
            <button id="scene2-btn-state2" class="scene2-btn scene2-btn-inactive">选项判断</button>
        </div>
    </div>
    <script>
    (function() {
        var currentState = 1;
        var state1Group = document.getElementById('scene2-state1-group');
        var state2SvgGroup = document.getElementById('scene2-state2-svg-group');
        var state2Overlay = document.getElementById('scene2-state2-overlay');
        var btnState1 = document.getElementById('scene2-btn-state1');
        var btnState2 = document.getElementById('scene2-btn-state2');
        function show(el) { el.style.display = 'block'; el.style.opacity = '1'; }
        function hide(el) { el.style.display = 'none'; el.style.opacity = '0'; }
        function render() {
            if (currentState === 1) {
                show(state1Group); hide(state2SvgGroup); hide(state2Overlay);
                btnState1.className = 'scene2-btn scene2-btn-active-blue';
                btnState2.className = 'scene2-btn scene2-btn-inactive';
            } else {
                hide(state1Group); show(state2SvgGroup); show(state2Overlay);
                btnState1.className = 'scene2-btn scene2-btn-inactive';
                btnState2.className = 'scene2-btn scene2-btn-active-green';
            }
        }
        btnState1.addEventListener('click', function() { if (currentState !== 1) { currentState = 1; render(); } });
        btnState2.addEventListener('click', function() { if (currentState !== 2) { currentState = 2; render(); } });
        render();
    })();
    </script>
</body>
</html>
