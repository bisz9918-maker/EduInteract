<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 极地投影气压带风带模式图</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene2-controls button {
            padding: 6px 16px; font-size: 14px; cursor: pointer;
            border: 1px solid #ccc; border-radius: 4px; background: #f5f5f5;
        }
        #scene2-controls button:hover { background: #e0e0e0; }
        #scene2-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        .scene2-hidden { display: none !important; }

        /* HTML 层元素 */
        #scene2-step-title {
            position: absolute; top: 8px; left: 0; right: 0;
            text-align: center; font-size: 15px; font-weight: bold; color: #000; z-index: 10;
        }
        .scene2-annotation {
            position: absolute; font-size: 13px; z-index: 5; display: none;
        }
        #scene2-annotation-grad { left: 0; right: 0; bottom: 70px; text-align: center; color: #333; }
        #scene2-annotation-nh { left: 10px; top: 200px; width: 220px; color: #1565c0; }
        #scene2-annotation-sh { left: 10px; top: 250px; color: #666; }
        #scene2-annotation-north { left: 270px; top: 200px; color: #2e7d32; }
        #scene2-annotation-south { left: 270px; top: 200px; color: #2e7d32; }
        #scene2-annotation-season-n { left: 0; right: 0; bottom: 70px; text-align: center; color: #2e7d32; }
        #scene2-annotation-season-s { left: 0; right: 0; bottom: 70px; text-align: center; color: #2e7d32; }

        #scene2-conclusion-box {
            position: absolute; left: 40px; top: 80px; width: 200px;
            background: #ffebee; border: 1.5px solid #c62828; border-radius: 4px;
            padding: 10px; font-size: 12px; color: #000; z-index: 5; display: none;
            line-height: 1.8;
        }
        #scene2-conclusion-box .title { font-weight: bold; margin-bottom: 6px; }

        #scene2-legend {
            position: absolute; right: 10px; bottom: 55px; width: 150px;
            background: #fafafa; border: 1px solid #ccc; border-radius: 3px;
            padding: 8px; font-size: 11px; z-index: 5; line-height: 22px;
        }
        #scene2-legend .item { display: flex; align-items: center; gap: 6px; }
        #scene2-legend .line { width: 20px; height: 3px; display: inline-block; }
        #scene2-legend .line-red { background: #c62828; }
        #scene2-legend .line-blue { background: #1565c0; }
        #scene2-legend .arrow-blue {
            width: 0; height: 0; border-left: 6px solid #1565c0;
            border-top: 3px solid transparent; border-bottom: 3px solid transparent;
            display: inline-block;
        }
        #scene2-legend .arrow-gray {
            width: 0; height: 0; border-left: 6px solid #9e9e9e;
            border-top: 3px solid transparent; border-bottom: 3px solid transparent;
            display: inline-block; opacity: 0.5;
        }
        #scene2-legend .arrow-green {
            width: 0; height: 0; border-left: 6px solid #2e7d32;
            border-top: 3px solid transparent; border-bottom: 3px solid transparent;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <div id="scene2-step-title">步骤0：基础模式图</div>

        <svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500">
            <defs>
                <marker id="scene2-arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#1565c0"/>
                </marker>
                <marker id="scene2-arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#888888"/>
                </marker>
                <marker id="scene2-arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#2e7d32"/>
                </marker>
            </defs>

            <!-- 经纬网底图 -->
            <g id="scene2-grid">
                <circle cx="400" cy="220" r="160" fill="none" stroke="#000" stroke-width="1.5"/>
                <circle cx="400" cy="220" r="120" fill="none" stroke="#000" stroke-width="1"/>
                <circle cx="400" cy="220" r="80" fill="none" stroke="#000" stroke-width="1"/>
                <circle cx="400" cy="220" r="10" fill="none" stroke="#000" stroke-width="1.5"/>
                <line x1="400" y1="220" x2="400" y2="60" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
                <line x1="400" y1="220" x2="560" y2="220" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
                <line x1="400" y1="220" x2="400" y2="380" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
                <line x1="400" y1="220" x2="240" y2="220" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
            </g>

            <!-- 气压带圆环 -->
            <g id="scene2-pressure-bands">
                <circle id="scene2-band-equator" cx="400" cy="220" r="160" fill="none" stroke="#c62828" stroke-width="12" opacity="0.35"/>
                <circle id="scene2-band-subtropical" cx="400" cy="220" r="120" fill="none" stroke="#1565c0" stroke-width="12" opacity="0.35"/>
                <circle id="scene2-band-subpolar" cx="400" cy="220" r="80" fill="none" stroke="#c62828" stroke-width="12" opacity="0.35"/>
                <circle id="scene2-band-polar" cx="400" cy="220" r="35" fill="none" stroke="#1565c0" stroke-width="18" opacity="0.35"/>
            </g>

            <!-- a/b 位置标记 -->
            <g id="scene2-markers">
                <circle id="scene2-marker-a" cx="499" cy="319" r="5" fill="#c62828" stroke="#fff" stroke-width="2"/>
                <circle id="scene2-marker-b" cx="471" cy="291" r="5" fill="#c62828" stroke="#fff" stroke-width="2"/>
            </g>

            <!-- 水平气压梯度力箭头（灰色虚线） -->
            <g id="scene2-gradient-arrows" class="scene2-hidden">
                <line id="scene2-grad-a" x1="485" y1="305" x2="513" y2="333" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#scene2-arrow-gray)"/>
                <line id="scene2-grad-b" x1="485" y1="305" x2="457" y2="277" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#scene2-arrow-gray)"/>
                <line id="scene2-grad-polar" x1="375" y1="195" x2="336" y2="156" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#scene2-arrow-gray)"/>
            </g>

            <!-- 北半球风向箭头（蓝色实线） -->
            <g id="scene2-nh-arrows" class="scene2-hidden">
                <line id="scene2-nh-a" x1="525" y1="305" x2="485" y2="355" stroke="#1565c0" stroke-width="2.5" marker-end="url(#scene2-arrow-blue)"/>
                <line id="scene2-nh-b" x1="445" y1="325" x2="505" y2="265" stroke="#1565c0" stroke-width="2.5" marker-end="url(#scene2-arrow-blue)"/>
                <line id="scene2-nh-polar" x1="360" y1="140" x2="330" y2="175" stroke="#1565c0" stroke-width="2.5" marker-end="url(#scene2-arrow-blue)"/>
            </g>

            <!-- 南半球风向箭头（灰色半透明） -->
            <g id="scene2-sh-arrows" class="scene2-hidden">
                <line id="scene2-sh-a" x1="525" y1="345" x2="485" y2="305" stroke="#9e9e9e" stroke-width="1.5" opacity="0.5" marker-end="url(#scene2-arrow-gray)"/>
                <line id="scene2-sh-b" x1="505" y1="325" x2="445" y2="265" stroke="#9e9e9e" stroke-width="1.5" opacity="0.5" marker-end="url(#scene2-arrow-gray)"/>
            </g>

            <!-- 季节移动指示箭头 -->
            <g id="scene2-shift-arrows" class="scene2-hidden">
                <line id="scene2-shift-north" x1="260" y1="240" x2="260" y2="180" stroke="#2e7d32" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#scene2-arrow-green)"/>
                <line id="scene2-shift-south" x1="260" y1="180" x2="260" y2="240" stroke="#2e7d32" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#scene2-arrow-green)"/>
            </g>

            <!-- 标签引线 -->
            <g id="scene2-leaders" stroke="#999" stroke-width="0.8">
                <!-- 右侧引线 -->
                <line x1="460" y1="116" x2="585" y2="35"/>
                <line x1="480" y1="130" x2="585" y2="65"/>
                <line x1="560" y1="220" x2="585" y2="225"/>
                <line x1="445" y1="325" x2="585" y2="255"/>
                <line x1="485" y1="270" x2="585" y2="288"/>
                <line x1="471" y1="291" x2="585" y2="321"/>
                <line x1="525" y1="305" x2="585" y2="354"/>
                <line x1="499" y1="319" x2="585" y2="387"/>
                <line x1="520" y1="340" x2="585" y2="420"/>
                <!-- 左侧引线 -->
                <line x1="343" y1="163" x2="215" y2="115"/>
                <line x1="331" y1="180" x2="215" y2="145"/>
                <line x1="360" y1="140" x2="215" y2="175"/>
                <line x1="240" y1="220" x2="215" y2="225"/>
                <line x1="365" y1="240" x2="215" y2="255"/>
                <line x1="240" y1="355" x2="215" y2="355"/>
            </g>

            <!-- 经纬度与位置标签 -->
            <g id="scene2-labels-base" font-size="12" fill="#000">
                <!-- 上方 -->
                <text x="400" y="48" text-anchor="middle">0°</text>
                <!-- 右侧 (x=585, 间距33px) -->
                <text x="585" y="35" text-anchor="start">副热带高气压带</text>
                <text x="585" y="65" text-anchor="start">30°</text>
                <text x="585" y="225" text-anchor="start">90°E</text>
                <text x="585" y="255" text-anchor="start">西南风</text>
                <text x="585" y="288" text-anchor="start">西风带</text>
                <text x="585" y="321" text-anchor="start">b</text>
                <text x="585" y="354" text-anchor="start">东北风</text>
                <text x="585" y="387" text-anchor="start">a</text>
                <text x="585" y="420" text-anchor="start">信风带</text>
                <!-- 左侧 (x=215, 间距30px) -->
                <text x="215" y="115" text-anchor="end">副极地低气压带</text>
                <text x="215" y="145" text-anchor="end">60°</text>
                <text x="215" y="175" text-anchor="end">极地东风带</text>
                <text x="215" y="225" text-anchor="end">90°W</text>
                <text x="215" y="255" text-anchor="end">极地高气压带</text>
                <text x="215" y="355" text-anchor="end">赤道低气压带</text>
                <!-- 下方 -->
                <text x="400" y="410" text-anchor="middle">180°</text>
                <text x="420" y="442" text-anchor="start">90°/N</text>
            </g>
        </svg>

        <!-- 步骤注释 -->
        <div id="scene2-annotation-grad" class="scene2-annotation">水平气压梯度力：由高压指向低压</div>
        <div id="scene2-annotation-nh" class="scene2-annotation">风向相对于水平气压梯度力向右偏转 → 北半球</div>
        <div id="scene2-annotation-sh" class="scene2-annotation">北右南左</div>
        <div id="scene2-annotation-north" class="scene2-annotation">气压带北移</div>
        <div id="scene2-annotation-south" class="scene2-annotation">气压带南移</div>
        <div id="scene2-annotation-season-n" class="scene2-annotation">太阳直射点北移 → 气压带风带北移 → 北半球夏季</div>
        <div id="scene2-annotation-season-s" class="scene2-annotation">太阳直射点南移 → 气压带风带南移 → 北半球冬季</div>

        <!-- 结论框 -->
        <div id="scene2-conclusion-box">
            <div class="title">综合判断</div>
            <div>半球：北半球（风向右偏）</div>
            <div>季节：夏季（气压带北移）</div>
            <div>a处 = 图甲B处（东北信风带）</div>
        </div>

        <!-- 图例 -->
        <div id="scene2-legend">
            <div class="item"><span class="line line-red"></span>低压带</div>
            <div class="item"><span class="line line-blue"></span>高压带</div>
            <div class="item"><span class="arrow-blue"></span>北半球风向</div>
            <div class="item"><span class="arrow-gray"></span>南半球风向</div>
            <div class="item"><span class="arrow-green"></span>季节移动</div>
        </div>

        <div id="scene2-controls">
            <button id="scene2-btn-prev">◀ 上一步</button>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const totalSteps = 6;

        const stepTitles = [
            "步骤0：基础模式图",
            "步骤1：水平气压梯度力",
            "步骤2：北半球风向与判断",
            "步骤3：南北半球对比",
            "步骤4：季节移动 — 北半球夏季",
            "步骤5：季节移动 — 北半球冬季",
            "步骤6：综合判断"
        ];

        const originalRadii = {
            equator: 160,
            subtropical: 120,
            subpolar: 80,
            polar: 35
        };

        const mobileElements = [
            { id: 'scene2-marker-a', cx: 499, cy: 319 },
            { id: 'scene2-marker-b', cx: 471, cy: 291 },
            { id: 'scene2-grad-a', x1: 485, y1: 305, x2: 513, y2: 333 },
            { id: 'scene2-grad-b', x1: 485, y1: 305, x2: 457, y2: 277 },
            { id: 'scene2-grad-polar', x1: 375, y1: 195, x2: 336, y2: 156 },
            { id: 'scene2-nh-a', x1: 525, y1: 305, x2: 485, y2: 355 },
            { id: 'scene2-nh-b', x1: 445, y1: 325, x2: 505, y2: 265 },
            { id: 'scene2-nh-polar', x1: 360, y1: 140, x2: 330, y2: 175 },
            { id: 'scene2-sh-a', x1: 525, y1: 345, x2: 485, y2: 305 },
            { id: 'scene2-sh-b', x1: 505, y1: 325, x2: 445, y2: 265 }
        ];

        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        const titleEl = document.getElementById('scene2-step-title');

        function setVisible(id, visible) {
            const el = document.getElementById(id);
            if (!el) return;
            if (visible) {
                el.classList.remove('scene2-hidden');
                el.style.display = '';
                el.style.opacity = '1';
            } else {
                el.classList.add('scene2-hidden');
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }

        function setOpacity(id, opacity) {
            const el = document.getElementById(id);
            if (!el) return;
            el.style.opacity = String(opacity);
        }

        function updatePressureBands(factor) {
            document.getElementById('scene2-band-equator').setAttribute('r', String(originalRadii.equator * factor));
            document.getElementById('scene2-band-subtropical').setAttribute('r', String(originalRadii.subtropical * factor));
            document.getElementById('scene2-band-subpolar').setAttribute('r', String(originalRadii.subpolar * factor));
            document.getElementById('scene2-band-polar').setAttribute('r', String(originalRadii.polar * factor));
        }

        function updateMobilePositions(factor) {
            const cx = 400, cy = 220;
            mobileElements.forEach(item => {
                const el = document.getElementById(item.id);
                if (!el) return;
                if ('cx' in item) {
                    const dx = item.cx - cx;
                    const dy = item.cy - cy;
                    el.setAttribute('cx', String(cx + dx * factor));
                    el.setAttribute('cy', String(cy + dy * factor));
                } else {
                    const dx1 = item.x1 - cx, dy1 = item.y1 - cy;
                    const dx2 = item.x2 - cx, dy2 = item.y2 - cy;
                    el.setAttribute('x1', String(cx + dx1 * factor));
                    el.setAttribute('y1', String(cy + dy1 * factor));
                    el.setAttribute('x2', String(cx + dx2 * factor));
                    el.setAttribute('y2', String(cy + dy2 * factor));
                }
            });
        }

        function renderStep() {
            titleEl.textContent = stepTitles[currentStep];
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps;

            setVisible('scene2-gradient-arrows', false);
            setVisible('scene2-nh-arrows', false);
            setVisible('scene2-sh-arrows', false);
            setVisible('scene2-shift-arrows', false);
            setVisible('scene2-conclusion-box', false);
            setVisible('scene2-annotation-grad', false);
            setVisible('scene2-annotation-nh', false);
            setVisible('scene2-annotation-sh', false);
            setVisible('scene2-annotation-north', false);
            setVisible('scene2-annotation-south', false);
            setVisible('scene2-annotation-season-n', false);
            setVisible('scene2-annotation-season-s', false);

            updatePressureBands(1.0);
            updateMobilePositions(1.0);
            setOpacity('scene2-gradient-arrows', 1);

            document.getElementById('scene2-shift-north').style.display = '';
            document.getElementById('scene2-shift-south').style.display = '';

            switch (currentStep) {
                case 0:
                    break;
                case 1:
                    setVisible('scene2-gradient-arrows', true);
                    setVisible('scene2-annotation-grad', true);
                    break;
                case 2:
                    setVisible('scene2-gradient-arrows', true);
                    setOpacity('scene2-gradient-arrows', 0.3);
                    setVisible('scene2-nh-arrows', true);
                    setVisible('scene2-annotation-nh', true);
                    break;
                case 3:
                    setVisible('scene2-gradient-arrows', true);
                    setOpacity('scene2-gradient-arrows', 0.3);
                    setVisible('scene2-nh-arrows', true);
                    setVisible('scene2-sh-arrows', true);
                    setVisible('scene2-annotation-nh', true);
                    setVisible('scene2-annotation-sh', true);
                    break;
                case 4:
                    updatePressureBands(150/160);
                    updateMobilePositions(150/160);
                    setVisible('scene2-gradient-arrows', true);
                    setOpacity('scene2-gradient-arrows', 0.3);
                    setVisible('scene2-nh-arrows', true);
                    setVisible('scene2-shift-arrows', true);
                    setVisible('scene2-annotation-north', true);
                    setVisible('scene2-annotation-season-n', true);
                    document.getElementById('scene2-shift-south').style.display = 'none';
                    break;
                case 5:
                    updatePressureBands(170/160);
                    updateMobilePositions(170/160);
                    setVisible('scene2-gradient-arrows', true);
                    setOpacity('scene2-gradient-arrows', 0.3);
                    setVisible('scene2-nh-arrows', true);
                    setVisible('scene2-shift-arrows', true);
                    setVisible('scene2-annotation-south', true);
                    setVisible('scene2-annotation-season-s', true);
                    document.getElementById('scene2-shift-north').style.display = 'none';
                    break;
                case 6:
                    setVisible('scene2-gradient-arrows', true);
                    setOpacity('scene2-gradient-arrows', 0.3);
                    setVisible('scene2-nh-arrows', true);
                    setVisible('scene2-conclusion-box', true);
                    setVisible('scene2-annotation-nh', true);
                    break;
            }
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) { currentStep--; renderStep(); }
        });
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) { currentStep++; renderStep(); }
        });

        renderStep();
    })();
    </script>
</body>
</html>
