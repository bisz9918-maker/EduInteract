<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scene 3 - 经纬线飞行距离与地方时</title>
<style>
body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
#scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
#scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
#scene3-controls button { padding: 6px 18px; font-size: 14px; border: 1px solid #888; border-radius: 4px; cursor: pointer; background: #f0f0f0; color: #333; }
#scene3-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
#scene3-controls button.primary { background: #1565c0; color: #fff; border-color: #1565c0; }
#scene3-step-text { font-size: 13px; color: #666; min-width: 70px; text-align: center; }
.scene3-fade { transition: opacity 0.3s ease; }
</style>
</head>
<body>
<div id="scene3-container">
<svg id="scene3-svg" width="800" height="500" viewBox="0 0 800 500">
<!-- 外框用线段 -->
<line x1="120" y1="60" x2="720" y2="60" stroke="#000" stroke-width="1"/>
<line x1="120" y1="390" x2="720" y2="390" stroke="#000" stroke-width="1"/>
<line x1="120" y1="60" x2="120" y2="390" stroke="#000" stroke-width="1"/>
<line x1="720" y1="60" x2="720" y2="390" stroke="#000" stroke-width="1"/>
<!-- 经线 -->
<line x1="120" y1="60" x2="120" y2="390" stroke="#000" stroke-width="1"/>
<line x1="220" y1="60" x2="220" y2="390" stroke="#000" stroke-width="1"/>
<line x1="320" y1="60" x2="320" y2="390" stroke="#000" stroke-width="1"/>
<line x1="420" y1="60" x2="420" y2="390" stroke="#000" stroke-width="1"/>
<line x1="520" y1="60" x2="520" y2="390" stroke="#000" stroke-width="1"/>
<line x1="620" y1="60" x2="620" y2="390" stroke="#000" stroke-width="1"/>
<line x1="720" y1="60" x2="720" y2="390" stroke="#000" stroke-width="1"/>
<!-- 纬线 -->
<line x1="120" y1="60" x2="720" y2="60" stroke="#000" stroke-width="1" stroke-dasharray="4,4"/>
<line x1="120" y1="115" x2="720" y2="115" stroke="#000" stroke-width="1" stroke-dasharray="4,4"/>
<line x1="120" y1="170" x2="720" y2="170" stroke="#000" stroke-width="1" stroke-dasharray="4,4"/>
<line x1="120" y1="225" x2="720" y2="225" stroke="#000" stroke-width="1"/>
<line x1="120" y1="280" x2="720" y2="280" stroke="#000" stroke-width="1" stroke-dasharray="4,4"/>
<line x1="120" y1="335" x2="720" y2="335" stroke="#000" stroke-width="1" stroke-dasharray="4,4"/>
<line x1="120" y1="390" x2="720" y2="390" stroke="#000" stroke-width="1" stroke-dasharray="4,4"/>
<!-- 顶部经度 -->
<text x="120" y="45" text-anchor="middle" font-size="13" fill="#000">180°</text>
<text x="220" y="45" text-anchor="middle" font-size="13" fill="#000">120°</text>
<text x="320" y="45" text-anchor="middle" font-size="13" fill="#000">60°</text>
<text x="420" y="45" text-anchor="middle" font-size="13" fill="#000">0°</text>
<text x="520" y="45" text-anchor="middle" font-size="13" fill="#000">60°</text>
<text x="620" y="45" text-anchor="middle" font-size="13" fill="#000">120°</text>
<text x="720" y="45" text-anchor="middle" font-size="13" fill="#000">180°</text>
<!-- 左侧纬度 -->
<text x="90" y="65" text-anchor="end" font-size="13" fill="#000">90°N</text>
<text x="100" y="120" text-anchor="end" font-size="13" fill="#000">60°N</text>
<text x="100" y="175" text-anchor="end" font-size="13" fill="#000">30°N</text>
<text x="100" y="230" text-anchor="end" font-size="13" fill="#000">0°</text>
<text x="100" y="285" text-anchor="end" font-size="13" fill="#000">30°S</text>
<text x="100" y="340" text-anchor="end" font-size="13" fill="#000">60°S</text>
<text x="100" y="395" text-anchor="end" font-size="13" fill="#000">90°S</text>
<!-- 地理点 -->
<circle cx="270" cy="170" r="4" fill="#c62828"/>
<text x="255" y="162" font-size="14" font-weight="bold" fill="#c62828">A</text>
<circle cx="420" cy="280" r="4" fill="#c62828"/>
<text x="432" y="292" font-size="14" font-weight="bold" fill="#c62828">B</text>
<circle cx="420" cy="225" r="4" fill="#c62828"/>
<text x="432" y="237" font-size="14" font-weight="bold" fill="#c62828">C</text>
<circle cx="520" cy="115" r="4" fill="#c62828"/>
<text x="505" y="107" font-size="14" font-weight="bold" fill="#c62828">D</text>
<circle cx="620" cy="115" r="4" fill="#c62828"/>
<text x="632" y="107" font-size="14" font-weight="bold" fill="#c62828">E</text>
<!-- B→C -->
<g id="scene3-group-bc" class="scene3-fade">
<line x1="420" y1="280" x2="420" y2="225" stroke="#c62828" stroke-width="3"/>
<polygon points="420,225 416,233 424,233" fill="#c62828"/>
<text x="460" y="255" font-size="14" fill="#000">30°</text>
<text x="330" y="255" font-size="16" font-weight="bold" fill="#2e7d32">3330km</text>
</g>
<!-- 卡片1 -->
<g id="scene3-card-1" class="scene3-fade" style="opacity:0">
<foreignObject x="520" y="235" width="170" height="80">
<div xmlns="http://www.w3.org/1999/xhtml" style="background:#f5f5f5;border:1px solid #888;border-radius:3px;padding:8px 10px;font-size:13px;color:#333;line-height:1.8;font-family:'Microsoft YaHei','PingFang SC',sans-serif;">
<div>速度 = 3330÷3</div>
<div>= 1110 km/h</div>
<div>30°×111 = 3330 km</div>
</div>
</foreignObject>
</g>
<!-- D→E -->
<g id="scene3-group-de" class="scene3-fade" style="opacity:0">
<line x1="520" y1="115" x2="620" y2="115" stroke="#1565c0" stroke-width="3"/>
<polygon points="620,115 612,111 612,119" fill="#1565c0"/>
<text x="565" y="100" text-anchor="middle" font-size="14" fill="#000">60°</text>
<text x="660" y="135" font-size="13" fill="#666">1°≈55.5km</text>
<text x="565" y="145" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e7d32">3330km</text>
</g>
<!-- 卡片2 -->
<g id="scene3-card-2" class="scene3-fade" style="opacity:0">
<foreignObject x="520" y="155" width="170" height="55">
<div xmlns="http://www.w3.org/1999/xhtml" style="background:#f5f5f5;border:1px solid #888;border-radius:3px;padding:8px 10px;font-size:13px;color:#333;line-height:1.8;font-family:'Microsoft YaHei','PingFang SC',sans-serif;">
<div>60°×55.5 = 3330 km</div>
<div>飞行时间 = 3小时</div>
</div>
</foreignObject>
</g>
<!-- 时间轴 -->
<g id="scene3-timeline" class="scene3-fade" style="opacity:0">
<foreignObject x="120" y="402" width="560" height="30">
<div xmlns="http://www.w3.org/1999/xhtml" style="background:#f5f5f5;border:1px solid #888;border-radius:3px;height:28px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:13px;color:#333;font-family:'Microsoft YaHei','PingFang SC',sans-serif;">
<span>D地12:00</span>
<span style="color:#1565c0;font-size:12px;">→ 3h →</span>
<span>15:00</span>
<span>E地+4h</span>
<span style="color:#1565c0;font-size:12px;">→ →</span>
<span>19:00</span>
</div>
</foreignObject>
</g>
</svg>
<div id="scene3-controls">
<button id="scene3-btn-prev">◀ 上一步</button>
<span id="scene3-step-text">步骤 1/5</span>
<button id="scene3-btn-next" class="primary">下一步 ▶</button>
</div>
</div>
<script>
(function(){
var currentStep=0,totalSteps=5;
var btnPrev=document.getElementById('scene3-btn-prev');
var btnNext=document.getElementById('scene3-btn-next');
var stepText=document.getElementById('scene3-step-text');
var groupBC=document.getElementById('scene3-group-bc');
var card1=document.getElementById('scene3-card-1');
var groupDE=document.getElementById('scene3-group-de');
var card2=document.getElementById('scene3-card-2');
var timeline=document.getElementById('scene3-timeline');
function updateButtons(){btnPrev.disabled=currentStep===0;btnNext.disabled=currentStep===totalSteps-1;stepText.textContent='步骤 '+(currentStep+1)+'/'+totalSteps;}
function renderStep(){
if(currentStep===0){groupBC.style.opacity='1';card1.style.opacity='0';groupDE.style.opacity='0';card2.style.opacity='0';timeline.style.opacity='0';}
else if(currentStep===1){groupBC.style.opacity='1';card1.style.opacity='1';groupDE.style.opacity='0';card2.style.opacity='0';timeline.style.opacity='0';}
else if(currentStep===2){groupBC.style.opacity='0.15';card1.style.opacity='0';groupDE.style.opacity='1';card2.style.opacity='0';timeline.style.opacity='0';}
else if(currentStep===3){groupBC.style.opacity='0.15';card1.style.opacity='0';groupDE.style.opacity='1';card2.style.opacity='1';timeline.style.opacity='0';}
else if(currentStep===4){groupBC.style.opacity='0.15';card1.style.opacity='0';groupDE.style.opacity='1';card2.style.opacity='1';timeline.style.opacity='1';}
updateButtons();
}
btnPrev.addEventListener('click',function(){if(currentStep>0){currentStep--;renderStep();}});
btnNext.addEventListener('click',function(){if(currentStep<totalSteps-1){currentStep++;renderStep();}});
renderStep();
})();
</script>
</body>
</html>
