<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地球公转与两分两至</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            padding: 6px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc;
            border-radius: 4px; background: #f5f5f5; transition: background 0.2s;
        }
        #scene1-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene1-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 13px; color: #555; min-width: 70px; text-align: center; }

        /* SVG 元素样式 */
        .scene1-step-item { display: none; }
        .scene1-step-item.visible { display: block; }
        .scene1-earth { fill: #ffffff; stroke: #1565c0; stroke-width: 1; transition: all 0.3s ease; }
        .scene1-earth.highlighted { fill: rgba(46,125,50,0.15); stroke: #2e7d32; stroke-width: 2; }
        .scene1-ray { stroke: #888888; stroke-width: 1; stroke-dasharray: 5,5; display: none; }
        .scene1-ray.visible { display: block; }
        .scene1-spot { fill: #c62828; display: none; }
        .scene1-spot.visible { display: block; }
        .scene1-tropic { stroke: #888888; stroke-width: 1; stroke-dasharray: 4,4; display: none; }
        .scene1-tropic.visible { display: block; }
        .scene1-orbit-arrow { stroke: #2e7d32; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); display: none; }
        .scene1-orbit-arrow.visible { display: block; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" viewBox="0 0 800 500">
            <defs>
                <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32" />
                </marker>
            </defs>

            <!-- 标题 -->
            <text x="400" y="40" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">地球公转与两分两至</text>

            <!-- 椭圆轨道 -->
            <ellipse cx="400" cy="240" rx="255" ry="128" stroke="#000000" stroke-width="1.5" fill="none" />

            <!-- 太阳 -->
            <circle cx="621" cy="240" r="18" fill="#c62828" />
            <!-- 太阳光芒 -->
            <g stroke="#c62828" stroke-dasharray="3,3" stroke-width="1">
                <line x1="621" y1="215" x2="621" y2="205" />
                <line x1="621" y1="265" x2="621" y2="275" />
                <line x1="596" y1="240" x2="586" y2="240" />
                <line x1="646" y1="240" x2="656" y2="240" />
                <line x1="603" y1="222" x2="596" y2="215" />
                <line x1="639" y1="258" x2="646" y2="265" />
                <line x1="603" y1="258" x2="596" y2="265" />
                <line x1="639" y1="222" x2="646" y2="215" />
                <line x1="610" y1="216" x2="604" y2="208" />
                <line x1="632" y1="264" x2="638" y2="272" />
                <line x1="610" y1="264" x2="604" y2="272" />
                <line x1="632" y1="216" x2="638" y2="208" />
            </g>
            <text x="621" y="400" text-anchor="middle" font-size="14" fill="#000">太阳</text>

            <!-- 地球A -->
            <circle id="scene1-earth-a" class="scene1-earth" cx="400" cy="112" r="17" />
            <line x1="390" y1="135" x2="410" y2="89" stroke="#000" stroke-width="1" />
            <circle cx="410" cy="89" r="2" fill="#000" />
            <line x1="384" y1="105" x2="416" y2="119" stroke="#000" stroke-width="1" />
            <text x="400" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#000">A</text>

            <!-- 地球B -->
            <circle id="scene1-earth-b" class="scene1-earth" cx="145" cy="235" r="17" />
            <line x1="135" y1="258" x2="155" y2="212" stroke="#000" stroke-width="1" />
            <circle cx="155" cy="212" r="2" fill="#000" />
            <line x1="129" y1="228" x2="161" y2="242" stroke="#000" stroke-width="1" />
            <text x="110" y="235" text-anchor="middle" font-size="14" font-weight="bold" fill="#000" dominant-baseline="middle">B</text>

            <!-- 地球C -->
            <circle id="scene1-earth-c" class="scene1-earth" cx="400" cy="368" r="17" />
            <line x1="390" y1="391" x2="410" y2="345" stroke="#000" stroke-width="1" />
            <circle cx="410" cy="345" r="2" fill="#000" />
            <line x1="384" y1="361" x2="416" y2="375" stroke="#000" stroke-width="1" />
            <text x="400" y="405" text-anchor="middle" font-size="14" font-weight="bold" fill="#000">C</text>

            <!-- 地球D -->
            <circle id="scene1-earth-d" class="scene1-earth" cx="655" cy="235" r="17" />
            <line x1="645" y1="258" x2="665" y2="212" stroke="#000" stroke-width="1" />
            <circle cx="665" cy="212" r="2" fill="#000" />
            <line x1="639" y1="228" x2="671" y2="242" stroke="#000" stroke-width="1" />
            <text x="690" y="235" text-anchor="middle" font-size="14" font-weight="bold" fill="#000" dominant-baseline="middle">D</text>

            <!-- 回归线 -->
            <line id="scene1-tropic-n" class="scene1-tropic" x1="132" y1="221" x2="164" y2="235" />
            <line id="scene1-tropic-s" class="scene1-tropic" x1="636" y1="235" x2="668" y2="249" />

            <!-- 直射点 -->
            <circle id="scene1-spot-a" class="scene1-spot" cx="416" cy="119" r="4" />
            <circle id="scene1-spot-b" class="scene1-spot" cx="164" cy="235" r="4" />
            <circle id="scene1-spot-c" class="scene1-spot" cx="416" cy="375" r="4" />
            <circle id="scene1-spot-d" class="scene1-spot" cx="636" cy="235" r="4" />

            <!-- 光线 -->
            <line id="scene1-ray-a" class="scene1-ray" x1="621" y1="240" x2="400" y2="112" />
            <line id="scene1-ray-b" class="scene1-ray" x1="621" y1="240" x2="145" y2="235" />
            <line id="scene1-ray-c" class="scene1-ray" x1="621" y1="240" x2="400" y2="368" />
            <line id="scene1-ray-d" class="scene1-ray" x1="621" y1="240" x2="655" y2="235" />

            <!-- 步骤1标签：春分 -->
            <g id="scene1-group-spring" class="scene1-step-item">
                <text x="300" y="70" text-anchor="middle" font-size="14" fill="#2e7d32" font-weight="bold">春分</text>
                <text x="300" y="105" text-anchor="middle" font-size="14" fill="#000">3月21日</text>
                <text x="440" y="95" text-anchor="start" font-size="14" fill="#000">0°</text>
            </g>

            <!-- 步骤2标签：夏至 -->
            <g id="scene1-group-summer" class="scene1-step-item">
                <text x="55" y="175" text-anchor="middle" font-size="14" fill="#2e7d32" font-weight="bold">夏至</text>
                <text x="55" y="215" text-anchor="middle" font-size="14" fill="#000">6月22日</text>
                <text x="55" y="135" text-anchor="middle" font-size="14" fill="#000">23°26′N</text>
            </g>

            <!-- 步骤3标签：秋分 -->
            <g id="scene1-group-autumn" class="scene1-step-item">
                <text x="300" y="390" text-anchor="middle" font-size="14" fill="#2e7d32" font-weight="bold">秋分</text>
                <text x="300" y="430" text-anchor="middle" font-size="14" fill="#000">9月23日</text>
                <text x="440" y="400" text-anchor="start" font-size="14" fill="#000">0°</text>
            </g>

            <!-- 步骤4标签：冬至 -->
            <g id="scene1-group-winter" class="scene1-step-item">
                <text x="750" y="250" text-anchor="middle" font-size="14" fill="#2e7d32" font-weight="bold">冬至</text>
                <text x="750" y="295" text-anchor="middle" font-size="14" fill="#000">12月22日</text>
                <text x="750" y="205" text-anchor="middle" font-size="14" fill="#000">23°26′S</text>
            </g>

            <!-- 步骤5：公转方向 -->
            <g id="scene1-group-orbit" class="scene1-step-item">
                <path class="scene1-orbit-arrow" d="M 580,180 A 280,140 0 0,1 480,120" />
                <text x="530" y="95" text-anchor="middle" font-size="14" fill="#2e7d32">公转方向</text>
            </g>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 0/5</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let state = 0;

        const earthA = document.getElementById('scene1-earth-a');
        const earthB = document.getElementById('scene1-earth-b');
        const earthC = document.getElementById('scene1-earth-c');
        const earthD = document.getElementById('scene1-earth-d');

        const spotA = document.getElementById('scene1-spot-a');
        const spotB = document.getElementById('scene1-spot-b');
        const spotC = document.getElementById('scene1-spot-c');
        const spotD = document.getElementById('scene1-spot-d');

        const rayA = document.getElementById('scene1-ray-a');
        const rayB = document.getElementById('scene1-ray-b');
        const rayC = document.getElementById('scene1-ray-c');
        const rayD = document.getElementById('scene1-ray-d');

        const tropicN = document.getElementById('scene1-tropic-n');
        const tropicS = document.getElementById('scene1-tropic-s');

        const groupSpring = document.getElementById('scene1-group-spring');
        const groupSummer = document.getElementById('scene1-group-summer');
        const groupAutumn = document.getElementById('scene1-group-autumn');
        const groupWinter = document.getElementById('scene1-group-winter');
        const groupOrbit = document.getElementById('scene1-group-orbit');

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const indicator = document.getElementById('scene1-step-indicator');

        function setVisible(el, visible) {
            if (!el) return;
            if (visible) {
                el.classList.add('visible');
            } else {
                el.classList.remove('visible');
            }
        }

        function setHighlight(el, highlighted) {
            if (!el) return;
            if (highlighted) {
                el.classList.add('highlighted');
            } else {
                el.classList.remove('highlighted');
            }
        }

        function render() {
            // 重置所有高亮
            setHighlight(earthA, false);
            setHighlight(earthB, false);
            setHighlight(earthC, false);
            setHighlight(earthD, false);

            // 隐藏所有步骤元素
            setVisible(spotA, false);
            setVisible(spotB, false);
            setVisible(spotC, false);
            setVisible(spotD, false);
            setVisible(rayA, false);
            setVisible(rayB, false);
            setVisible(rayC, false);
            setVisible(rayD, false);
            setVisible(tropicN, false);
            setVisible(tropicS, false);
            setVisible(groupSpring, false);
            setVisible(groupSummer, false);
            setVisible(groupAutumn, false);
            setVisible(groupWinter, false);
            setVisible(groupOrbit, false);

            if (state === 1) {
                setHighlight(earthA, true);
                setVisible(rayA, true);
                setVisible(spotA, true);
                setVisible(groupSpring, true);
            } else if (state === 2) {
                setHighlight(earthB, true);
                setVisible(rayB, true);
                setVisible(spotB, true);
                setVisible(tropicN, true);
                setVisible(groupSummer, true);
            } else if (state === 3) {
                setHighlight(earthC, true);
                setVisible(rayC, true);
                setVisible(spotC, true);
                setVisible(groupAutumn, true);
            } else if (state === 4) {
                setHighlight(earthD, true);
                setVisible(rayD, true);
                setVisible(spotD, true);
                setVisible(tropicS, true);
                setVisible(groupWinter, true);
            } else if (state === 5) {
                setVisible(groupOrbit, true);
            }

            indicator.textContent = '步骤 ' + state + '/5';
            btnPrev.disabled = state === 0;
            btnNext.disabled = state === 5;
        }

        btnPrev.addEventListener('click', function() {
            if (state > 0) { state--; render(); }
        });
        btnNext.addEventListener('click', function() {
            if (state < 5) { state++; render(); }
        });

        render();
    })();
    </script>
</body>
</html>
