<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太阳直射点移动轨迹图</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "SimHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            padding: 6px 14px; font-size: 13px; cursor: pointer;
            border: 1px solid #333; border-radius: 4px; background: #f5f5f5;
        }
        #scene1-controls button:hover { background: #e0e0e0; }
        #scene1-controls button.active { background: #1565c0; color: #fff; border-color: #1565c0; }
        #scene1-controls button.active-red { background: #c62828; color: #fff; border-color: #c62828; }
        #scene1-controls button.active-green { background: #2e7d32; color: #fff; border-color: #2e7d32; }
        #scene1-step-indicator { position: absolute; bottom: 48px; left: 0; right: 0; text-align: center; font-size: 13px; color: #333; z-index: 10; }
        .scene1-hidden { display: none; }
        .scene1-fade { transition: opacity 0.25s ease; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 经纬网 -->
            <g id="scene1-grid">
                <!-- 左半球轮廓 -->
                <circle cx="230" cy="235" r="140" fill="none" stroke="#000" stroke-width="1.5"/>
                <!-- 右半球轮廓 -->
                <circle cx="570" cy="235" r="140" fill="none" stroke="#000" stroke-width="1.5"/>

                <!-- 左半球经线 -->
                <path d="M230,95 Q-50,235 230,375" fill="none" stroke="#000" stroke-width="1"/>
                <path d="M230,95 Q44,235 230,375" fill="none" stroke="#000" stroke-width="1"/>
                <path d="M230,95 Q138,235 230,375" fill="none" stroke="#000" stroke-width="1"/>
                <line x1="230" y1="95" x2="230" y2="375" stroke="#000" stroke-width="1"/>
                <path d="M230,95 Q324,235 230,375" fill="none" stroke="#000" stroke-width="1"/>
                <path d="M230,95 Q418,235 230,375" fill="none" stroke="#000" stroke-width="1"/>
                <path d="M230,95 Q510,235 230,375" fill="none" stroke="#000" stroke-width="1"/>

                <!-- 右半球经线 -->
                <path d="M570,95 Q290,235 570,375" fill="none" stroke="#000" stroke-width="1"/>
                <path d="M570,95 Q384,235 570,375" fill="none" stroke="#000" stroke-width="1"/>
                <path d="M570,95 Q476,235 570,375" fill="none" stroke="#000" stroke-width="1"/>
                <line x1="570" y1="95" x2="570" y2="375" stroke="#000" stroke-width="1"/>
                <path d="M570,95 Q664,235 570,375" fill="none" stroke="#000" stroke-width="1"/>
                <path d="M570,95 Q758,235 570,375" fill="none" stroke="#000" stroke-width="1"/>
                <path d="M570,95 Q850,235 570,375" fill="none" stroke="#000" stroke-width="1"/>

                <!-- 左半球纬线 -->
                <line x1="173" y1="107" x2="287" y2="107" stroke="#000" stroke-width="1" stroke-dasharray="4,3"/>
                <line x1="102" y1="179" x2="358" y2="179" stroke="#000" stroke-width="1" stroke-dasharray="4,3"/>
                <line x1="90" y1="235" x2="370" y2="235" stroke="#000" stroke-width="1.5"/>
                <line x1="102" y1="291" x2="358" y2="291" stroke="#000" stroke-width="1" stroke-dasharray="4,3"/>
                <line x1="173" y1="363" x2="287" y2="363" stroke="#000" stroke-width="1" stroke-dasharray="4,3"/>

                <!-- 右半球纬线 -->
                <line x1="513" y1="107" x2="627" y2="107" stroke="#000" stroke-width="1" stroke-dasharray="4,3"/>
                <line x1="442" y1="179" x2="698" y2="179" stroke="#000" stroke-width="1" stroke-dasharray="4,3"/>
                <line x1="430" y1="235" x2="710" y2="235" stroke="#000" stroke-width="1.5"/>
                <line x1="442" y1="291" x2="698" y2="291" stroke="#000" stroke-width="1" stroke-dasharray="4,3"/>
                <line x1="513" y1="363" x2="627" y2="363" stroke="#000" stroke-width="1" stroke-dasharray="4,3"/>
            </g>

            <!-- 轨迹折线 -->
            <polyline id="scene1-track" points="112,291 230,235 348,179 452,179 570,235 688,291" fill="none" stroke="#000" stroke-width="2"/>

            <!-- 高亮轨迹（默认隐藏） -->
            <polyline id="scene1-track-jan" points="112,291 230,235 348,179 452,179 570,235" fill="none" stroke="#1565c0" stroke-width="4" class="scene1-hidden"/>
            <line id="scene1-track-jun" x1="570" y1="235" x2="452" y2="179" stroke="#1565c0" stroke-width="4" class="scene1-hidden"/>
            <line id="scene1-track-aphelion" x1="348" y1="179" x2="230" y2="235" stroke="#2e7d32" stroke-width="4" class="scene1-hidden"/>

            <!-- 移动方向箭头 -->
            <g id="scene1-arrows">
                <!-- F→E 段中点 (629,263) -->
                <polygon points="629,263 635,258 635,268" fill="#000"/>
                <!-- E→D 段中点 (511,207) -->
                <polygon points="511,207 517,202 517,212" fill="#000"/>
                <!-- D→C 段中点 (400,179) -->
                <polygon points="400,179 405,174 405,184" fill="#000"/>
                <!-- C→B 段中点 (289,207) -->
                <polygon points="289,207 294,202 294,212" fill="#000"/>
                <!-- B→A 段中点 (171,263) -->
                <polygon points="171,263 176,258 176,268" fill="#000"/>
            </g>

            <!-- 极昼极夜填充 -->
            <g id="scene1-fills">
                <!-- 左半球极夜 (红色) -->
                <path id="scene1-fill-polarnight-left" d="M173,107 L287,107 A140,140 0 0,1 173,107 Z" fill="#c62828" fill-opacity="0.2" class="scene1-hidden"/>
                <!-- 右半球极夜 (红色) -->
                <path id="scene1-fill-polarnight-right" d="M513,107 L627,107 A140,140 0 0,1 513,107 Z" fill="#c62828" fill-opacity="0.2" class="scene1-hidden"/>
                <!-- 左半球极昼 (绿色) -->
                <path id="scene1-fill-polarday-left" d="M173,107 L287,107 A140,140 0 0,1 173,107 Z" fill="#2e7d32" fill-opacity="0.2" class="scene1-hidden"/>
                <!-- 右半球极昼 (绿色) -->
                <path id="scene1-fill-polarday-right" d="M513,107 L627,107 A140,140 0 0,1 513,107 Z" fill="#2e7d32" fill-opacity="0.2" class="scene1-hidden"/>
            </g>

            <!-- 点标记 -->
            <g id="scene1-points">
                <circle id="scene1-point-a" cx="112" cy="291" r="6" fill="#000"/>
                <circle id="scene1-point-b" cx="230" cy="235" r="6" fill="#000"/>
                <circle id="scene1-point-c" cx="348" cy="179" r="6" fill="#000"/>
                <circle id="scene1-point-d" cx="452" cy="179" r="6" fill="#000"/>
                <circle id="scene1-point-e" cx="570" cy="235" r="6" fill="#000"/>
                <circle id="scene1-point-f" cx="688" cy="291" r="6" fill="#000"/>
            </g>

            <!-- 固定标签 -->
            <g id="scene1-labels-fixed" font-size="13" fill="#000" text-anchor="middle">
                <!-- N/S -->
                <text x="230" y="82">N</text>
                <text x="570" y="82">N</text>
                <text x="230" y="388">S</text>
                <text x="570" y="388">S</text>

                <!-- 半球标题 -->
                <text x="230" y="405">东半球</text>
                <text x="570" y="405">西半球</text>

                <!-- A-F 点标签 -->
                <text x="82" y="291" text-anchor="end">A</text>
                <text x="245" y="185">B</text>
                <text x="370" y="179" text-anchor="start">C</text>
                <text x="430" y="179" text-anchor="end">D</text>
                <text x="555" y="185">E</text>
                <text x="718" y="291" text-anchor="start">F</text>

                <!-- 纬度标签 (左侧列) -->
                <text x="25" y="107" text-anchor="start" font-size="12">66°34′N</text>
                <text x="25" y="179" text-anchor="start" font-size="12">23°26′N</text>
                <text x="25" y="242" text-anchor="start" font-size="12">赤道</text>
                <text x="25" y="291" text-anchor="start" font-size="12">23°26′S</text>
                <text x="25" y="363" text-anchor="start" font-size="12">66°34′S</text>

                <!-- 经度标签 -->
                <text x="112" y="415" font-size="12">20°W</text>
                <text x="348" y="415" font-size="12">160°E</text>
                <text x="452" y="415" font-size="12">160°E</text>
                <text x="688" y="415" font-size="12">20°W</text>

                <!-- 方向总标注 -->
                <text id="scene1-direction-text" x="400" y="128" font-size="14">太阳直射点移动方向：F→E→D→C→B→A</text>
            </g>

            <!-- 动态信息标签（分步显示） -->
            <g id="scene1-labels-dynamic" font-size="13" fill="#000">
                <!-- A点信息（两行） -->
                <text id="scene1-info-a1" x="30" y="365" class="scene1-hidden" fill="#c62828" font-size="11">冬至 12月22日前后</text>
                <text id="scene1-info-a2" x="30" y="380" class="scene1-hidden" fill="#c62828" font-size="11">23°26′S</text>

                <text id="scene1-info-b" x="280" y="155" class="scene1-hidden" fill="#1565c0" font-size="11">秋分 9月23日前后 赤道</text>

                <text id="scene1-info-c" x="330" y="152" class="scene1-hidden" fill="#2e7d32" font-size="10">夏至 6月22日前后 23°26′N</text>
                <text id="scene1-info-d" x="460" y="152" class="scene1-hidden" fill="#2e7d32" font-size="10" text-anchor="end">夏至 6月22日前后 23°26′N</text>

                <text id="scene1-info-e" x="640" y="215" class="scene1-hidden" fill="#1565c0" font-size="11">春分 3月21日前后 赤道</text>

                <!-- F点信息（两行） -->
                <text id="scene1-info-f1" x="620" y="365" class="scene1-hidden" fill="#c62828" font-size="11">冬至 12月22日前后</text>
                <text id="scene1-info-f2" x="620" y="380" class="scene1-hidden" fill="#c62828" font-size="11">23°26′S</text>

                <text id="scene1-label-polarnight" x="400" y="88" text-anchor="middle" fill="#c62828" font-size="14" class="scene1-hidden">极夜范围</text>
                <text id="scene1-label-polarday" x="400" y="88" text-anchor="middle" fill="#2e7d32" font-size="14" class="scene1-hidden">极昼范围</text>

                <text id="scene1-exam-jan" x="400" y="113" text-anchor="middle" fill="#1565c0" font-size="12" class="scene1-hidden">1月考试期间：直射点位于A→E之间（南回归线→赤道）</text>
                <text id="scene1-exam-jun" x="520" y="113" text-anchor="middle" fill="#1565c0" font-size="12" class="scene1-hidden">6月考试期间：直射点位于E→D之间（赤道→北回归线）</text>
                <text id="scene1-aphelion" x="300" y="113" text-anchor="middle" fill="#2e7d32" font-size="12" class="scene1-hidden">7月初 远日点：直射点位于C→B之间（北回归线→赤道）</text>
            </g>
        </svg>

        <div id="scene1-step-indicator">步骤 0 / 7</div>
        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
            <button id="scene1-btn-jan" class="scene1-hidden">1月考试</button>
            <button id="scene1-btn-jun" class="scene1-hidden">6月考试</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        let currentStep = 0;
        let examMode = 'jan';

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const btnJan = document.getElementById('scene1-btn-jan');
        const btnJun = document.getElementById('scene1-btn-jun');
        const stepIndicator = document.getElementById('scene1-step-indicator');

        // 点元素
        const points = {
            a: document.getElementById('scene1-point-a'),
            b: document.getElementById('scene1-point-b'),
            c: document.getElementById('scene1-point-c'),
            d: document.getElementById('scene1-point-d'),
            e: document.getElementById('scene1-point-e'),
            f: document.getElementById('scene1-point-f'),
        };

        // 动态标签
        const labels = {
            infoA1: document.getElementById('scene1-info-a1'),
            infoA2: document.getElementById('scene1-info-a2'),
            infoB: document.getElementById('scene1-info-b'),
            infoC: document.getElementById('scene1-info-c'),
            infoD: document.getElementById('scene1-info-d'),
            infoE: document.getElementById('scene1-info-e'),
            infoF1: document.getElementById('scene1-info-f1'),
            infoF2: document.getElementById('scene1-info-f2'),
            polarNight: document.getElementById('scene1-label-polarnight'),
            polarDay: document.getElementById('scene1-label-polarday'),
            examJan: document.getElementById('scene1-exam-jan'),
            examJun: document.getElementById('scene1-exam-jun'),
            aphelion: document.getElementById('scene1-aphelion'),
            direction: document.getElementById('scene1-direction-text'),
        };

        // 填充
        const fills = {
            pnLeft: document.getElementById('scene1-fill-polarnight-left'),
            pnRight: document.getElementById('scene1-fill-polarnight-right'),
            pdLeft: document.getElementById('scene1-fill-polarday-left'),
            pdRight: document.getElementById('scene1-fill-polarday-right'),
        };

        // 高亮轨迹
        const tracks = {
            jan: document.getElementById('scene1-track-jan'),
            jun: document.getElementById('scene1-track-jun'),
            aphelion: document.getElementById('scene1-track-aphelion'),
        };

        function show(el) {
            if (!el) return;
            el.classList.remove('scene1-hidden');
            el.style.display = '';
            el.style.opacity = '1';
        }
        function hide(el) {
            if (!el) return;
            el.classList.add('scene1-hidden');
            el.style.display = 'none';
            el.style.opacity = '0';
        }

        function resetPoints() {
            Object.values(points).forEach(p => {
                p.setAttribute('r', '6');
                p.setAttribute('stroke', 'none');
                p.setAttribute('stroke-width', '0');
                p.setAttribute('fill', '#000');
            });
        }

        function highlightPoint(key, color) {
            const p = points[key];
            if (!p) return;
            p.setAttribute('r', '8');
            p.setAttribute('stroke', color);
            p.setAttribute('stroke-width', '2');
            p.setAttribute('fill', '#000');
        }

        function updateView() {
            stepIndicator.textContent = '步骤 ' + currentStep + ' / 7';

            // 重置所有动态元素
            resetPoints();
            Object.values(labels).forEach(hide);
            Object.values(fills).forEach(hide);
            Object.values(tracks).forEach(hide);
            hide(btnJan);
            hide(btnJun);
            btnJan.classList.remove('active');
            btnJun.classList.remove('active');

            // 方向标注仅在步骤0显示
            if (currentStep === 0) {
                show(labels.direction);
            }

            if (currentStep === 0) {
                // 初始状态：全部默认
            } else if (currentStep === 1) {
                // A点冬至
                highlightPoint('a', '#c62828');
                show(labels.infoA1);
                show(labels.infoA2);
                show(fills.pnLeft);
                show(fills.pnRight);
                show(labels.polarNight);
            } else if (currentStep === 2) {
                // B点秋分
                highlightPoint('b', '#1565c0');
                show(labels.infoB);
            } else if (currentStep === 3) {
                // C、D夏至
                highlightPoint('c', '#2e7d32');
                highlightPoint('d', '#2e7d32');
                show(labels.infoC);
                show(labels.infoD);
                show(fills.pdLeft);
                show(fills.pdRight);
                show(labels.polarDay);
            } else if (currentStep === 4) {
                // E点春分
                highlightPoint('e', '#1565c0');
                show(labels.infoE);
            } else if (currentStep === 5) {
                // F点冬至
                highlightPoint('f', '#c62828');
                show(labels.infoF1);
                show(labels.infoF2);
                show(fills.pnLeft);
                show(fills.pnRight);
                show(labels.polarNight);
            } else if (currentStep === 6) {
                // 考试期间
                show(btnJan);
                show(btnJun);
                if (examMode === 'jan') {
                    btnJan.classList.add('active');
                    show(tracks.jan);
                    highlightPoint('a', '#1565c0');
                    highlightPoint('e', '#1565c0');
                    show(labels.examJan);
                } else {
                    btnJun.classList.add('active');
                    show(tracks.jun);
                    highlightPoint('e', '#1565c0');
                    highlightPoint('d', '#1565c0');
                    show(labels.examJun);
                }
            } else if (currentStep === 7) {
                // 远日点
                show(tracks.aphelion);
                highlightPoint('c', '#2e7d32');
                highlightPoint('b', '#2e7d32');
                show(labels.aphelion);
            }
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateView();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < 7) {
                currentStep++;
                updateView();
            }
        });

        btnJan.addEventListener('click', function() {
            examMode = 'jan';
            updateView();
        });

        btnJun.addEventListener('click', function() {
            examMode = 'jun';
            updateView();
        });

        // 初始化
        updateView();
    })();
    </script>
</body>
</html>
