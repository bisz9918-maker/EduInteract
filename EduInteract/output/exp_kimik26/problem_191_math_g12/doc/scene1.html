<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圆的切线、割线与角平分线综合角度计算</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            padding: 6px 16px; font-size: 14px; cursor: pointer;
            border: 1px solid #ccc; border-radius: 4px; background: #f5f5f5;
        }
        #scene1-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 14px; color: #333; min-width: 70px; text-align: center; }
        .scene1-formula { font-size: 13px; fill: #333; }
        .scene1-label { font-size: 14px; fill: #000; }
        .scene1-angle-label { font-size: 12px; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 圆O -->
            <circle id="scene1-circle-o" cx="420" cy="250" r="150" fill="none" stroke="#000" stroke-width="2"/>
            <text id="scene1-label-o" x="572" y="280" text-anchor="start" dominant-baseline="middle" class="scene1-label">O</text>

            <!-- 点 -->
            <circle id="scene1-point-p" cx="500" cy="55" r="3" fill="#000"/>
            <text id="scene1-label-p" x="500" y="48" text-anchor="middle" class="scene1-label">P</text>

            <circle id="scene1-point-a" cx="570" cy="250" r="3" fill="#000"/>
            <text id="scene1-label-a" x="595" y="250" text-anchor="start" dominant-baseline="middle" class="scene1-label">A</text>

            <circle id="scene1-point-b" cx="540" cy="160" r="3" fill="#000"/>
            <text id="scene1-label-b" x="572" y="170" text-anchor="start" dominant-baseline="middle" class="scene1-label">B</text>

            <circle id="scene1-point-e" cx="351" cy="117" r="3" fill="#000"/>
            <text id="scene1-label-e" x="250" y="105" text-anchor="end" dominant-baseline="middle" class="scene1-label">E</text>

            <circle id="scene1-point-c" cx="446" cy="175" r="3" fill="#000"/>
            <text id="scene1-label-c" x="572" y="245" text-anchor="start" class="scene1-label">C</text>

            <circle id="scene1-point-d" cx="459" cy="142" r="3" fill="#000"/>
            <text id="scene1-label-d" x="572" y="110" text-anchor="start" dominant-baseline="middle" class="scene1-label">D</text>

            <!-- 主线 -->
            <line id="scene1-line-pe" x1="500" y1="55" x2="351" y2="117" stroke="#000" stroke-width="2"/>
            <line id="scene1-line-pba" x1="500" y1="55" x2="570" y2="250" stroke="#000" stroke-width="2"/>
            <line id="scene1-line-ae" x1="570" y1="250" x2="351" y2="117" stroke="#000" stroke-width="2"/>
            <line id="scene1-line-be" x1="540" y1="160" x2="351" y2="117" stroke="#000" stroke-width="2"/>
            <line id="scene1-line-pdc" x1="500" y1="55" x2="446" y2="175" stroke="#aaa" stroke-width="1" stroke-dasharray="4,3"/>

            <!-- 三角形高亮（初始隐藏） -->
            <polygon id="scene1-highlight-aeb" points="570,250 540,160 351,117" fill="#1565c0" fill-opacity="0" stroke="none"/>
            <polygon id="scene1-highlight-pbe" points="500,55 540,160 351,117" fill="#1565c0" fill-opacity="0" stroke="none"/>
            <polygon id="scene1-highlight-pce" points="500,55 446,175 351,117" fill="#2e7d32" fill-opacity="0" stroke="none"/>

            <!-- 角度弧线 -->
            <!-- ∠AEB = 40° 红色 -->
            <path id="scene1-arc-aeb" d="M 383 132 A 18 18 0 0 1 365 114" fill="none" stroke="#c62828" stroke-width="2.5" opacity="1"/>
            <text id="scene1-label-aeb" x="250" y="140" class="scene1-angle-label" fill="#c62828">40°</text>

            <!-- ∠PEB = 50° 蓝色 -->
            <path id="scene1-arc-peb" d="M 379 110 A 14 14 0 0 1 365 104" fill="none" stroke="#1565c0" stroke-width="2" opacity="0"/>
            <text id="scene1-label-peb" x="250" y="80" class="scene1-angle-label" fill="#1565c0" opacity="0">50°</text>

            <!-- ∠PEA = 90° 蓝色 -->
            <path id="scene1-arc-pea" d="M 395 145 A 20 20 0 0 1 375 125" fill="none" stroke="#1565c0" stroke-width="2" opacity="0"/>
            <text id="scene1-label-pea" x="250" y="165" class="scene1-angle-label" fill="#1565c0" opacity="0">90°</text>

            <!-- ∠EAB = 50° 蓝色 -->
            <path id="scene1-arc-eab" d="M 571 234 A 16 16 0 0 1 555 238" fill="none" stroke="#1565c0" stroke-width="2" opacity="0"/>
            <text id="scene1-label-eab" x="570" y="285" class="scene1-angle-label" fill="#1565c0" opacity="0">50°</text>

            <!-- ∠EBA = 90° 蓝色 -->
            <path id="scene1-arc-eba" d="M 540 176 A 16 16 0 0 1 524 168" fill="none" stroke="#1565c0" stroke-width="2" opacity="0"/>
            <text id="scene1-label-eba" x="560" y="210" class="scene1-angle-label" fill="#1565c0" opacity="0">90°</text>

            <!-- ∠APE = 40° 蓝色 -->
            <path id="scene1-arc-ape" d="M 516 73 A 16 16 0 0 1 500 57" fill="none" stroke="#1565c0" stroke-width="2" opacity="0"/>
            <text id="scene1-label-ape" x="500" y="85" class="scene1-angle-label" fill="#1565c0" opacity="0">40°</text>

            <!-- ∠CPE = 20° 蓝色 -->
            <path id="scene1-arc-cpe" d="M 499 67 A 14 14 0 0 1 485 61" fill="none" stroke="#1565c0" stroke-width="2" opacity="0"/>
            <text id="scene1-label-cpe" x="490" y="60" class="scene1-angle-label" fill="#1565c0" opacity="0">20°</text>

            <!-- ∠PCE = 70° 绿色 -->
            <path id="scene1-arc-pce" d="M 449 168 A 14 14 0 0 1 435 162" fill="none" stroke="#2e7d32" stroke-width="3" opacity="0"/>
            <text id="scene1-label-pce" x="570" y="145" class="scene1-angle-label" fill="#2e7d32" opacity="0">70°</text>

            <!-- 直角标记 -->
            <rect id="scene1-right-eba" x="532" y="168" width="8" height="8" fill="none" stroke="#000" stroke-width="1.5" opacity="0"/>
            <rect id="scene1-right-pea" x="358" y="125" width="8" height="8" fill="none" stroke="#000" stroke-width="1.5" opacity="0"/>

            <!-- 弦切角等号标注 -->
            <text id="scene1-text-peb-eab" x="260" y="65" class="scene1-formula" opacity="0">∠PEB = ∠EAB</text>
            <text id="scene1-text-pea-eba" x="260" y="195" class="scene1-formula" opacity="0">∠PEA = ∠EBA</text>

            <!-- 公式区 -->
            <text id="scene1-formula" x="400" y="465" text-anchor="middle" class="scene1-formula" opacity="0"></text>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/7</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        let currentStep = 0;
        const totalSteps = 7;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        const formulaText = document.getElementById('scene1-formula');

        // 元素引用
        const linePE = document.getElementById('scene1-line-pe');
        const lineBE = document.getElementById('scene1-line-be');
        const lineAE = document.getElementById('scene1-line-ae');
        const linePDC = document.getElementById('scene1-line-pdc');

        const highlightAEB = document.getElementById('scene1-highlight-aeb');
        const highlightPBE = document.getElementById('scene1-highlight-pbe');
        const highlightPCE = document.getElementById('scene1-highlight-pce');

        const arcPEB = document.getElementById('scene1-arc-peb');
        const labelPEB = document.getElementById('scene1-label-peb');
        const arcPEA = document.getElementById('scene1-arc-pea');
        const labelPEA = document.getElementById('scene1-label-pea');
        const arcEAB = document.getElementById('scene1-arc-eab');
        const labelEAB = document.getElementById('scene1-label-eab');
        const arcEBA = document.getElementById('scene1-arc-eba');
        const labelEBA = document.getElementById('scene1-label-eba');
        const arcAPE = document.getElementById('scene1-arc-ape');
        const labelAPE = document.getElementById('scene1-label-ape');
        const arcCPE = document.getElementById('scene1-arc-cpe');
        const labelCPE = document.getElementById('scene1-label-cpe');
        const arcPCE = document.getElementById('scene1-arc-pce');
        const labelPCE = document.getElementById('scene1-label-pce');

        const rightEBA = document.getElementById('scene1-right-eba');
        const rightPEA = document.getElementById('scene1-right-pea');

        const textPEB_EAB = document.getElementById('scene1-text-peb-eab');
        const textPEA_EBA = document.getElementById('scene1-text-pea-eba');

        function setOpacity(el, val) {
            if (el) el.setAttribute('opacity', val);
        }
        function setDisplay(el, val) {
            if (el) el.style.display = val;
        }
        function setStrokeWidth(el, val) {
            if (el) el.setAttribute('stroke-width', val);
        }
        function setStroke(el, val) {
            if (el) el.setAttribute('stroke', val);
        }
        function setStrokeDash(el, val) {
            if (el) {
                if (val) el.setAttribute('stroke-dasharray', val);
                else el.removeAttribute('stroke-dasharray');
            }
        }
        function setFillOpacity(el, val) {
            if (el) el.setAttribute('fill-opacity', val);
        }

        function render() {
            stepIndicator.textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps - 1;

            // 重置所有动态元素
            setStrokeWidth(linePE, 2);
            setStrokeWidth(lineBE, 2);
            setStrokeWidth(lineAE, 2);
            setStroke(linePDC, '#aaa');
            setStrokeWidth(linePDC, 1);
            setStrokeDash(linePDC, '4,3');

            setFillOpacity(highlightAEB, 0);
            setFillOpacity(highlightPBE, 0);
            setFillOpacity(highlightPCE, 0);

            setOpacity(arcPEB, 0);
            setOpacity(labelPEB, 0);
            setOpacity(arcPEA, 0);
            setOpacity(labelPEA, 0);
            setOpacity(arcEAB, 0);
            setOpacity(labelEAB, 0);
            setOpacity(arcEBA, 0);
            setOpacity(labelEBA, 0);
            setOpacity(arcAPE, 0);
            setOpacity(labelAPE, 0);
            setOpacity(arcCPE, 0);
            setOpacity(labelCPE, 0);
            setOpacity(arcPCE, 0);
            setOpacity(labelPCE, 0);

            setOpacity(rightEBA, 0);
            setOpacity(rightPEA, 0);

            setOpacity(textPEB_EAB, 0);
            setOpacity(textPEA_EBA, 0);

            formulaText.textContent = '';
            setOpacity(formulaText, 0);

            // 按步骤显示
            if (currentStep >= 1) {
                // 步骤1：弦切角定理
                setStrokeWidth(linePE, 3);
                setStrokeWidth(lineBE, 3);
                setStrokeWidth(lineAE, 3);
                setOpacity(arcPEB, 1);
                setOpacity(labelPEB, 1);
                setOpacity(textPEB_EAB, 1);
                setOpacity(textPEA_EBA, 1);
            }

            if (currentStep >= 2) {
                // 步骤2：△AEB内角和
                setFillOpacity(highlightAEB, 0.15);
                setOpacity(arcEAB, 1);
                setOpacity(labelEAB, 1);
                setOpacity(arcEBA, 1);
                setOpacity(labelEBA, 1);
                formulaText.textContent = '∠EAB + ∠EBA = 180° − 40° = 140°';
                setOpacity(formulaText, 1);
            }

            if (currentStep >= 3) {
                // 步骤3：E点角度关系与求解
                setOpacity(arcPEA, 1);
                setOpacity(labelPEA, 1);
                setOpacity(labelPEB, 1);
                setOpacity(labelEAB, 1);
                setOpacity(labelEBA, 1);
                setOpacity(rightEBA, 1);
                setOpacity(rightPEA, 1);
                formulaText.textContent = '设∠PEB = x，则∠PEA = x + 40°；x + (x + 40°) = 140°，∴ x = 50°';
                setOpacity(formulaText, 1);
            }

            if (currentStep >= 4) {
                // 步骤4：△PBE邻补角
                setFillOpacity(highlightPBE, 0.15);
                setOpacity(arcAPE, 1);
                setOpacity(labelAPE, 1);
                setOpacity(rightEBA, 1);
                formulaText.textContent = '△PBE中，∠PBE = 90°，∠PEB = 50°，∴ ∠APE = 40°';
                setOpacity(formulaText, 1);
            }

            if (currentStep >= 5) {
                // 步骤5：角平分线分角
                setStroke(linePDC, '#2e7d32');
                setStrokeWidth(linePDC, 2.5);
                setStrokeDash(linePDC, null);
                setOpacity(arcCPE, 1);
                setOpacity(labelCPE, 1);
                formulaText.textContent = 'PC平分∠APE，∴ ∠CPE = 20°';
                setOpacity(formulaText, 1);
            }

            if (currentStep >= 6) {
                // 步骤6：最终求解∠PCE
                setFillOpacity(highlightPCE, 0.20);
                setStroke(linePDC, '#2e7d32');
                setStrokeWidth(linePDC, 2.5);
                setStrokeDash(linePDC, null);
                setOpacity(arcPCE, 1);
                setOpacity(labelPCE, 1);
                setOpacity(rightPEA, 1);
                formulaText.textContent = '△PCE中，∠PEC = 90°，∠CPE = 20°，∴ ∠PCE = 70°';
                setOpacity(formulaText, 1);
            }
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                render();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                render();
            }
        });

        render();
    })();
    </script>
</body>
</html>
