<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>牛顿调和三角形</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }

        /* SVG 样式 */
        #scene2-svg { position: absolute; top: 0; left: 0; z-index: 1; }
        .pascal-node { fill: #e3f2fd; stroke: #000000; stroke-width: 2; transition: all 0.3s ease; }
        .pascal-node-highlight { fill: #1565c0; stroke: #0d47a1; stroke-width: 3; transition: all 0.3s ease; }
        .newton-node { fill: #fff3e0; stroke: #000000; stroke-width: 2; transition: all 0.3s ease; }
        .newton-node-highlight { fill: #c62828; stroke: #b71c1c; stroke-width: 3; transition: all 0.3s ease; }
        .link-line { stroke: #888888; stroke-width: 1.5; stroke-dasharray: 4,4; opacity: 0.35; transition: all 0.3s ease; }
        .link-line-active { stroke: #2e7d32; stroke-width: 2; opacity: 1; stroke-dasharray: none; transition: all 0.3s ease; }
        .formula-bg { fill: #f5f5f5; stroke: #888888; stroke-width: 1; rx: 8; }

        /* HTML 文字标签 - 绝对定位覆盖在 SVG 上 */
        .label-overlay {
            position: absolute;
            transform: translate(-50%, -50%);
            font-family: "Microsoft YaHei", sans-serif;
            pointer-events: none;
            z-index: 5;
            transition: color 0.3s ease;
        }
        .pascal-label { font-size: 14px; color: #000000; }
        .pascal-label.highlight { color: #ffffff; }
        .newton-label { font-size: 13px; color: #000000; }
        .newton-label.highlight { color: #ffffff; }
        .title-label { font-size: 16px; font-weight: bold; color: #000000; }
        .row-label-html { font-size: 14px; color: #000000; }
        .formula-html {
            position: absolute;
            transform: translate(-50%, -50%);
            font-family: "Microsoft YaHei", sans-serif;
            font-size: 15px;
            color: #000000;
            pointer-events: none;
            z-index: 5;
            white-space: nowrap;
        }
        .answer-label-html {
            position: absolute;
            transform: translate(-50%, -50%);
            font-family: "Microsoft YaHei", sans-serif;
            font-size: 13px;
            color: #c62828;
            font-weight: bold;
            pointer-events: none;
            z-index: 5;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .answer-label-html.show { opacity: 1; }
        .formula-green { color: #2e7d32; }
        .formula-blue { color: #1565c0; }
        .formula-red { color: #c62828; }

        /* 按钮样式 */
        .ctrl-btn { padding: 6px 16px; font-size: 14px; border: 1px solid #9e9e9e; border-radius: 6px; background: #e0e0e0; cursor: pointer; font-family: "Microsoft YaHei", sans-serif; transition: background 0.2s; }
        .ctrl-btn:hover:not(:disabled) { background: #bdbdbd; }
        .ctrl-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* 步骤指示器 */
        .step-indicator { position: absolute; bottom: 2px; left: 0; right: 0; font-size: 12px; color: #666; text-align: center; z-index: 10; }
    </style>
</head>

    <script>
    (function() {
        // Scene 2 实现
        let currentStep = 0;
        const totalSteps = 4;

        const prevBtn = document.getElementById('scene2-btn-prev');
        const nextBtn = document.getElementById('scene2-btn-next');
        const stepIndicator = document.getElementById('scene2-step-indicator');
        const answerLabel = document.getElementById('scene2-answer-label');

        // 高亮配置
        const highlightGroups = {
            1: [
                { pascal: 'scene2-pascal-r2c1', newton: 'scene2-newton-r2c1', link: 'scene2-link-r2c1' },
                { pascal: 'scene2-pascal-r3c2', newton: 'scene2-newton-r3c2', link: 'scene2-link-r3c2' },
                { pascal: 'scene2-pascal-r4c2', newton: 'scene2-newton-r4c2', link: 'scene2-link-r4c2' },
                { pascal: 'scene2-pascal-r5c3', newton: 'scene2-newton-r5c3', link: 'scene2-link-r5c3' }
            ],
            2: [
                { pascal: 'scene2-pascal-r2c1', newton: 'scene2-newton-r2c1', link: 'scene2-link-r2c1' },
                { pascal: 'scene2-pascal-r3c2', newton: 'scene2-newton-r3c2', link: 'scene2-link-r3c2' },
                { pascal: 'scene2-pascal-r4c2', newton: 'scene2-newton-r4c2', link: 'scene2-link-r4c2' },
                { pascal: 'scene2-pascal-r5c3', newton: 'scene2-newton-r5c3', link: 'scene2-link-r5c3' }
            ],
            3: [
                { pascal: 'scene2-pascal-r5c3', newton: 'scene2-newton-r5c3', link: 'scene2-link-r5c3' }
            ]
        };

        function setNodeHighlight(nodeId, isHighlight, isPascal) {
            const el = document.getElementById(nodeId);
            if (!el) return;
            const baseClass = isPascal ? 'pascal-node' : 'newton-node';
            const highlightClass = isPascal ? 'pascal-node-highlight' : 'newton-node-highlight';
            const labelId = nodeId.replace('scene2-', 'scene2-label-');
            const label = document.getElementById(labelId);
            if (isHighlight) {
                el.classList.remove(baseClass);
                el.classList.add(highlightClass);
                if (label) label.classList.add('highlight');
                if (isPascal) {
                    el.querySelector('circle').setAttribute('r', '20');
                } else {
                    const rect = el.querySelector('rect');
                    const cx = parseFloat(rect.getAttribute('x')) + parseFloat(rect.getAttribute('width'))/2;
                    const cy = parseFloat(rect.getAttribute('y')) + parseFloat(rect.getAttribute('height'))/2;
                    rect.setAttribute('x', cx - 22);
                    rect.setAttribute('y', cy - 15);
                    rect.setAttribute('width', '44');
                    rect.setAttribute('height', '30');
                }
            } else {
                el.classList.remove(highlightClass);
                el.classList.add(baseClass);
                if (label) label.classList.remove('highlight');
                if (isPascal) {
                    el.querySelector('circle').setAttribute('r', '18');
                } else {
                    const row = parseInt(el.getAttribute('data-row'));
                    const col = parseInt(el.getAttribute('data-col'));
                    const rect = el.querySelector('rect');
                    const baseX = 610 - (row - 1) * 30;
                    const baseY = 88 + (row - 1) * 50 - 13;
                    const x = baseX + (col - 1) * 60 - 20;
                    rect.setAttribute('x', x);
                    rect.setAttribute('y', baseY);
                    rect.setAttribute('width', '40');
                    rect.setAttribute('height', '26');
                }
            }
        }

        function setLinkHighlight(linkId, isActive) {
            const el = document.getElementById(linkId);
            if (!el) return;
            if (isActive) {
                el.classList.remove('link-line');
                el.classList.add('link-line-active');
            } else {
                el.classList.remove('link-line-active');
                el.classList.add('link-line');
            }
        }

        function resetAllHighlights() {
            for (let r = 1; r <= 5; r++) {
                for (let c = 1; c <= r; c++) {
                    setNodeHighlight('scene2-pascal-r' + r + 'c' + c, false, true);
                    setNodeHighlight('scene2-newton-r' + r + 'c' + c, false, false);
                }
            }
            for (let r = 1; r <= 5; r++) {
                for (let c = 1; c <= r; c++) {
                    setLinkHighlight('scene2-link-r' + r + 'c' + c, false);
                }
            }
        }

        function applyHighlights(step) {
            const groups = highlightGroups[step];
            if (!groups) return;
            groups.forEach(g => {
                setNodeHighlight(g.pascal, true, true);
                setNodeHighlight(g.newton, true, false);
                setLinkHighlight(g.link, true);
            });
        }

        function showFormulaGroup(step) {
            for (let i = 0; i < totalSteps; i++) {
                const g = document.getElementById('scene2-formula-step' + i);
                if (g) {
                    if (i === step) {
                        g.style.display = 'block';
                        requestAnimationFrame(function() {
                            g.style.opacity = '1';
                        });
                    } else {
                        g.style.opacity = '0';
                        g.style.display = 'none';
                    }
                }
            }
        }

        function renderStep(step) {
            currentStep = step;
            resetAllHighlights();
            if (step > 0) {
                applyHighlights(step);
            }
            showFormulaGroup(step);
            if (step === 3) {
                answerLabel.classList.add('show');
            } else {
                answerLabel.classList.remove('show');
            }
            prevBtn.disabled = (step === 0);
            if (step === totalSteps - 1) {
                nextBtn.textContent = '完成';
                nextBtn.disabled = true;
            } else {
                nextBtn.textContent = '下一步 ▶';
                nextBtn.disabled = false;
            }
            stepIndicator.textContent = '步骤 ' + (step + 1) + ' / ' + totalSteps;
        }

        prevBtn.addEventListener('click', function() {
            if (currentStep > 0) {
                renderStep(currentStep - 1);
            }
        });

        nextBtn.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                renderStep(currentStep + 1);
            }
        });

        renderStep(0);
    })();
    </script>
</body>
</html>
