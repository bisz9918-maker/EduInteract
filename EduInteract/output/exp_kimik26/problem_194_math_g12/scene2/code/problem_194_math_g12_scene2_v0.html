<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 四面体体积最大值</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene2-controls button {
            padding: 4px 14px; font-size: 13px; cursor: pointer; border: 1px solid #ccc;
            border-radius: 4px; background: #f5f5f5; color: #333;
        }
        #scene2-controls button:hover { background: #e0e0e0; }
        #scene2-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene2-step-indicator { font-size: 13px; color: #555; min-width: 60px; text-align: center; }
        svg { display: block; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500">
            <defs>
                <marker id="scene2-arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#1565c0" />
                </marker>
            </defs>

            <!-- ==================== 坐标系（始终显示） ==================== -->
            <line id="scene2-axis-x" x1="220" y1="360" x2="340" y2="420" stroke="#888888" stroke-width="1.5"/>
            <line id="scene2-axis-y" x1="220" y1="360" x2="120" y2="420" stroke="#888888" stroke-width="1.5"/>
            <line id="scene2-axis-z" x1="220" y1="360" x2="220" y2="140" stroke="#1565c0" stroke-width="2" marker-end="url(#scene2-arrow-blue)"/>

            <!-- 坐标系标签 -->
            <text id="scene2-label-a" x="90" y="375" font-size="14" fill="#000000" font-weight="bold">A</text>
            <text id="scene2-label-d" x="195" y="155" font-size="14" fill="#000000" font-weight="bold">D</text>
            <text id="scene2-label-x" x="345" y="425" font-size="12" fill="#888888">x</text>
            <text id="scene2-label-y" x="105" y="425" font-size="12" fill="#888888">y</text>
            <text id="scene2-label-z" x="235" y="140" font-size="12" fill="#1565c0">z</text>

            <!-- AD 边（始终显示） -->
            <line id="scene2-edge-ad" x1="220" y1="360" x2="220" y2="160" stroke="#1565c0" stroke-width="2"/>

            <!-- ==================== 步骤 0-5 几何组 ==================== -->
            <g id="scene2-group-normal">
                <!-- 水平平面 z=z₀ -->
                <polygon id="scene2-plane-normal" points="240,380 330,310 200,240 110,310" fill="#1565c0" fill-opacity="0.1" stroke="#1565c0" stroke-width="1"/>
                <text id="scene2-label-plane-normal" x="380" y="300" font-size="12" fill="#1565c0">z=z₀</text>

                <!-- 截面圆 -->
                <ellipse id="scene2-circle-normal" cx="220" cy="310" rx="69" ry="38" fill="#2e7d32" fill-opacity="0.1" stroke="#2e7d32" stroke-width="1.5" transform="rotate(11.6, 220, 310)"/>
                <text id="scene2-label-rho-normal" x="340" y="280" font-size="12" fill="#2e7d32">ρ</text>

                <!-- 四面体边 -->
                <line id="scene2-edge-ab-normal" x1="220" y1="360" x2="288" y2="324" stroke="#000000" stroke-width="1" stroke-dasharray="4,3"/>
                <line id="scene2-edge-ac-normal" x1="220" y1="360" x2="256" y2="348" stroke="#000000" stroke-width="1" stroke-dasharray="4,3"/>
                <line id="scene2-edge-bd-normal" x1="288" y1="324" x2="220" y2="160" stroke="#000000" stroke-width="1.5"/>
                <line id="scene2-edge-cd-normal" x1="256" y1="348" x2="220" y2="160" stroke="#000000" stroke-width="1.5"/>
                <line id="scene2-edge-bc-normal" x1="288" y1="324" x2="256" y2="348" stroke="#c62828" stroke-width="2"/>
                <text id="scene2-label-bc-normal" x="335" y="345" font-size="12" fill="#c62828">BC=2</text>

                <!-- 顶点 -->
                <circle id="scene2-point-b-normal" cx="288" cy="324" r="3" fill="#000000"/>
                <circle id="scene2-point-c-normal" cx="256" cy="348" r="3" fill="#000000"/>
                <circle id="scene2-point-oz-normal" cx="220" cy="310" r="3" fill="#000000"/>
                <circle id="scene2-point-f-normal" cx="272" cy="336" r="3" fill="#000000"/>

                <!-- 顶点标签 -->
                <text id="scene2-label-b-normal" x="340" y="315" font-size="14" fill="#000000" font-weight="bold">B</text>
                <text id="scene2-label-c-normal" x="210" y="395" font-size="14" fill="#000000" font-weight="bold">C</text>
                <text id="scene2-label-oz-normal" x="75" y="305" font-size="12" fill="#000000">O_z</text>
                <text id="scene2-label-f-normal" x="340" y="395" font-size="12" fill="#000000">F</text>

                <!-- 弦心距 O_zF（红色） -->
                <line id="scene2-line-ozf-normal" x1="220" y1="310" x2="272" y2="336" stroke="#c62828" stroke-width="1.5"/>
                <text id="scene2-label-ozf-normal" x="60" y="335" font-size="11" fill="#c62828">O_zF</text>

                <!-- 半径 O_zB（示意） -->
                <line id="scene2-line-ozb-normal" x1="220" y1="310" x2="288" y2="324" stroke="#2e7d32" stroke-width="1"/>

                <!-- 公垂线 EF（绿色，与 O_zF 同线段，步骤4起显示） -->
                <line id="scene2-line-ef-normal" x1="220" y1="310" x2="272" y2="336" stroke="#2e7d32" stroke-width="2"/>
                <text id="scene2-label-ef-normal" x="60" y="365" font-size="11" fill="#2e7d32">EF</text>
                <circle id="scene2-point-e-normal" cx="220" cy="310" r="3" fill="#000000"/>
                <text id="scene2-label-e-normal" x="60" y="395" font-size="12" fill="#000000">E</text>
            </g>

            <!-- ==================== 步骤 6 几何组（最大值位置） ==================== -->
            <g id="scene2-group-max">
                <!-- 水平平面 z=z₀ -->
                <polygon id="scene2-plane-max" points="240,330 330,260 200,190 110,260" fill="#1565c0" fill-opacity="0.1" stroke="#1565c0" stroke-width="1"/>
                <text id="scene2-label-plane-max" x="365" y="255" font-size="12" fill="#1565c0">z=z₀</text>

                <!-- 截面圆 -->
                <ellipse id="scene2-circle-max" cx="220" cy="260" rx="63" ry="38" fill="#2e7d32" fill-opacity="0.1" stroke="#2e7d32" stroke-width="1.5" transform="rotate(26.6, 220, 260)"/>
                <text id="scene2-label-rho-max" x="340" y="220" font-size="12" fill="#2e7d32">ρ</text>

                <!-- 四面体边 -->
                <line id="scene2-edge-ab-max" x1="220" y1="360" x2="277" y2="288" stroke="#000000" stroke-width="1" stroke-dasharray="4,3"/>
                <line id="scene2-edge-ac-max" x1="220" y1="360" x2="233" y2="304" stroke="#000000" stroke-width="1" stroke-dasharray="4,3"/>
                <line id="scene2-edge-bd-max" x1="277" y1="288" x2="220" y2="160" stroke="#000000" stroke-width="1.5"/>
                <line id="scene2-edge-cd-max" x1="233" y1="304" x2="220" y2="160" stroke="#000000" stroke-width="1.5"/>
                <line id="scene2-edge-bc-max" x1="277" y1="288" x2="233" y2="304" stroke="#c62828" stroke-width="2"/>
                <text id="scene2-label-bc-max" x="340" y="320" font-size="12" fill="#c62828">BC=2</text>

                <!-- 顶点 -->
                <circle id="scene2-point-b-max" cx="277" cy="288" r="3" fill="#000000"/>
                <circle id="scene2-point-c-max" cx="233" cy="304" r="3" fill="#000000"/>
                <circle id="scene2-point-oz-max" cx="220" cy="260" r="3" fill="#000000"/>
                <circle id="scene2-point-f-max" cx="255" cy="296" r="3" fill="#000000"/>

                <!-- 顶点标签 -->
                <text id="scene2-label-b-max" x="340" y="250" font-size="14" fill="#000000" font-weight="bold">B</text>
                <text id="scene2-label-c-max" x="150" y="355" font-size="14" fill="#000000" font-weight="bold">C</text>
                <text id="scene2-label-oz-max" x="75" y="255" font-size="12" fill="#000000">O_z</text>
                <text id="scene2-label-f-max" x="340" y="350" font-size="12" fill="#000000">F</text>

                <!-- 弦心距 O_zF（红色） -->
                <line id="scene2-line-ozf-max" x1="220" y1="260" x2="255" y2="296" stroke="#c62828" stroke-width="1.5"/>
                <text id="scene2-label-ozf-max" x="60" y="285" font-size="11" fill="#c62828">O_zF</text>

                <!-- 半径 O_zB（示意） -->
                <line id="scene2-line-ozb-max" x1="220" y1="260" x2="277" y2="288" stroke="#2e7d32" stroke-width="1"/>

                <!-- 公垂线 EF（绿色） -->
                <line id="scene2-line-ef-max" x1="220" y1="260" x2="255" y2="296" stroke="#2e7d32" stroke-width="2"/>
                <text id="scene2-label-ef-max" x="60" y="315" font-size="11" fill="#2e7d32">EF</text>
                <circle id="scene2-point-e-max" cx="220" cy="260" r="3" fill="#000000"/>
                <text id="scene2-label-e-max" x="60" y="345" font-size="12" fill="#000000">E</text>
            </g>

            <!-- ==================== 右侧公式面板 ==================== -->
            <foreignObject x="550" y="30" width="220" height="90">
                <div id="scene2-formula-panel" xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px; line-height:1.6; color:#000000; font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;">
                    A(0,0,0), D(0,0,2c)，z轴沿AD
                </div>
            </foreignObject>

            <!-- ==================== 右侧直角三角形示意图（步骤3-4） ==================== -->
            <g id="scene2-triangle-group">
                <line x1="600" y1="220" x2="680" y2="220" stroke="#c62828" stroke-width="1.5"/>
                <line x1="680" y1="220" x2="680" y2="160" stroke="#c62828" stroke-width="1.5"/>
                <line x1="600" y1="220" x2="680" y2="160" stroke="#2e7d32" stroke-width="1.5"/>
                <polyline points="680,210 670,210 670,220" fill="none" stroke="#c62828" stroke-width="1"/>
                <text x="590" y="225" font-size="12" fill="#000000">O_z</text>
                <text x="685" y="225" font-size="12" fill="#000000">F</text>
                <text x="685" y="155" font-size="12" fill="#000000">B</text>
                <text x="635" y="245" font-size="11" fill="#c62828">O_zF</text>
                <text x="685" y="195" font-size="11" fill="#c62828">FB=1</text>
                <text x="630" y="185" font-size="11" fill="#2e7d32">ρ</text>
            </g>

            <!-- ==================== 右侧抛物线图（步骤5-6） ==================== -->
            <g id="scene2-parabola-group">
                <line x1="580" y1="380" x2="760" y2="380" stroke="#000000" stroke-width="1"/>
                <line x1="580" y1="380" x2="580" y2="220" stroke="#000000" stroke-width="1"/>
                <text x="765" y="385" font-size="11" fill="#000000">z₀</text>
                <text x="570" y="215" font-size="11" fill="#000000">ρ²</text>

                <path d="M580,380 Q625,260 670,220 Q715,260 760,380" fill="none" stroke="#2e7d32" stroke-width="2"/>

                <circle cx="670" cy="220" r="4" fill="#c62828"/>
                <text x="690" y="210" font-size="11" fill="#c62828">(c,b²)</text>

                <text x="670" y="395" font-size="10" fill="#000000" text-anchor="middle">c</text>
                <line x1="670" y1="380" x2="670" y2="385" stroke="#000000" stroke-width="1"/>
            </g>
        </svg>

        <div id="scene2-controls">
            <button id="scene2-btn-prev">◀ 上一步</button>
            <span id="scene2-step-indicator">步骤 0/6</span>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const totalSteps = 6;

        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        const stepIndicator = document.getElementById('scene2-step-indicator');
        const formulaPanel = document.getElementById('scene2-formula-panel');

        const groupNormal = document.getElementById('scene2-group-normal');
        const groupMax = document.getElementById('scene2-group-max');
        const triangleGroup = document.getElementById('scene2-triangle-group');
        const parabolaGroup = document.getElementById('scene2-parabola-group');

        const normalEls = {
            plane: ['scene2-plane-normal', 'scene2-label-plane-normal'],
            circle: ['scene2-circle-normal', 'scene2-label-rho-normal'],
            edges: ['scene2-edge-ab-normal', 'scene2-edge-ac-normal', 'scene2-edge-bd-normal', 'scene2-edge-cd-normal', 'scene2-edge-bc-normal', 'scene2-label-bc-normal'],
            points: ['scene2-point-b-normal', 'scene2-point-c-normal', 'scene2-point-oz-normal', 'scene2-point-f-normal'],
            labels: ['scene2-label-b-normal', 'scene2-label-c-normal', 'scene2-label-oz-normal', 'scene2-label-f-normal'],
            ozf: ['scene2-line-ozf-normal', 'scene2-label-ozf-normal'],
            ozb: ['scene2-line-ozb-normal'],
            ef: ['scene2-line-ef-normal', 'scene2-label-ef-normal', 'scene2-point-e-normal', 'scene2-label-e-normal']
        };

        const maxEls = {
            plane: ['scene2-plane-max', 'scene2-label-plane-max'],
            circle: ['scene2-circle-max', 'scene2-label-rho-max'],
            edges: ['scene2-edge-ab-max', 'scene2-edge-ac-max', 'scene2-edge-bd-max', 'scene2-edge-cd-max', 'scene2-edge-bc-max', 'scene2-label-bc-max'],
            points: ['scene2-point-b-max', 'scene2-point-c-max', 'scene2-point-oz-max', 'scene2-point-f-max'],
            labels: ['scene2-label-b-max', 'scene2-label-c-max', 'scene2-label-oz-max', 'scene2-label-f-max'],
            ozf: ['scene2-line-ozf-max', 'scene2-label-ozf-max'],
            ozb: ['scene2-line-ozb-max'],
            ef: ['scene2-line-ef-max', 'scene2-label-ef-max', 'scene2-point-e-max', 'scene2-label-e-max']
        };

        function show(id) {
            const el = document.getElementById(id);
            if (el) { el.style.display = ''; el.style.opacity = '1'; }
        }
        function hide(id) {
            const el = document.getElementById(id);
            if (el) { el.style.display = 'none'; el.style.opacity = '0'; }
        }
        function showGroup(ids) { ids.forEach(show); }
        function hideGroup(ids) { ids.forEach(hide); }

        const formulas = [
            "A(0,0,0), D(0,0,2c)，z轴沿AD",
            "AD·BC = 0  ⇒  z₁ = z₂ = z₀",
            "B,C 在椭球面上，截面为圆，圆心 O_z(0,0,z₀)，半径 ρ(z₀)",
            "BC = 2,  FB = 1,  O_zF = √(ρ² − 1)",
            "V = (1/3)·S△BCD·AD = (2c/3)·√(ρ² − 1)",
            "ρ² = (b²/a²)[a² − (z₀−c)²],  b² = a² − c²",
            "z₀ = c 时，ρ²_max = b²,  V_max = (2c/3)·√(a² − c² − 1)"
        ];

        function render() {
            stepIndicator.textContent = '步骤 ' + currentStep + '/' + totalSteps;
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps;
            formulaPanel.textContent = formulas[currentStep];

            hide('scene2-group-normal');
            hide('scene2-group-max');
            hide('scene2-triangle-group');
            hide('scene2-parabola-group');

            if (currentStep === 0) {
                // 仅坐标系和AD
            } else if (currentStep >= 1 && currentStep <= 5) {
                show('scene2-group-normal');
                Object.values(normalEls).forEach(hideGroup);

                if (currentStep >= 1) {
                    showGroup(normalEls.edges);
                    showGroup(normalEls.points);
                    showGroup(normalEls.labels);
                }
                if (currentStep >= 2) {
                    showGroup(normalEls.plane);
                    showGroup(normalEls.circle);
                }
                if (currentStep >= 3) {
                    showGroup(normalEls.ozf);
                    showGroup(normalEls.ozb);
                    show('scene2-triangle-group');
                }
                if (currentStep >= 4) {
                    hideGroup(normalEls.ozf);
                    showGroup(normalEls.ef);
                }
                if (currentStep >= 5) {
                    show('scene2-parabola-group');
                }
            } else if (currentStep === 6) {
                show('scene2-group-max');
                Object.values(maxEls).forEach(hideGroup);

                showGroup(maxEls.edges);
                showGroup(maxEls.points);
                showGroup(maxEls.labels);
                showGroup(maxEls.plane);
                showGroup(maxEls.circle);
                showGroup(maxEls.ef);
                showGroup(maxEls.ozb);

                show('scene2-parabola-group');
            }
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) { currentStep--; render(); }
        });
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) { currentStep++; render(); }
        });

        render();
    })();
    </script>
</body>
</html>
