<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 正六边形与直线截距面积</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 16px; z-index: 10; }
        #scene2-slider-t { width: 280px; }
        #scene2-btn-symmetric {
            padding: 6px 14px; font-size: 14px; cursor: pointer;
            background: #f5f5f5; border: 1px solid #ccc; border-radius: 4px;
        }
        #scene2-btn-symmetric.active {
            background: #e3f2fd; border-color: #1565c0; color: #1565c0;
        }
        .scene2-label { font-size: 14px; fill: #000; }
        .scene2-axis { stroke: #000; stroke-width: 1.5; }
        .scene2-hexagon { stroke: #000; stroke-width: 2; fill: none; }
        .scene2-line-L { stroke: #1565c0; stroke-width: 2; }
        .scene2-line-Lp { stroke: #c62828; stroke-width: 2; }
        .scene2-point-blue { fill: #1565c0; }
        .scene2-point-red { fill: #c62828; }
        .scene2-seg-blue { stroke: #1565c0; stroke-width: 1.5; }
        .scene2-seg-red { stroke: #c62828; stroke-width: 1.5; }
        .scene2-tri-blue { fill: #1565c0; fill-opacity: 0.25; }
        .scene2-tri-red { fill: #c62828; fill-opacity: 0.25; }
        .scene2-dash { stroke: #888; stroke-width: 1; stroke-dasharray: 5,5; }
        .scene2-text-blue { fill: #1565c0; font-size: 14px; }
        .scene2-text-red { fill: #c62828; font-size: 14px; }
        .scene2-text-green { fill: #2e7d32; font-size: 18px; font-weight: bold; }
        .scene2-area-text { font-size: 14px; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500">
            <!-- 坐标轴 -->
            <line id="scene2-xaxis" class="scene2-axis" x1="150" y1="260" x2="650" y2="260"/>
            <polygon points="650,260 640,255 640,265" fill="#000"/>
            <line id="scene2-yaxis" class="scene2-axis" x1="400" y1="420" x2="400" y2="80"/>
            <polygon points="400,80 395,90 405,90" fill="#000"/>

            <!-- 轴标签 -->
            <text id="scene2-label-x" class="scene2-label" x="665" y="250" text-anchor="start" dominant-baseline="middle">x</text>
            <text id="scene2-label-y" class="scene2-label" x="240" y="70" text-anchor="end" dominant-baseline="middle">y</text>

            <!-- 正六边形 -->
            <polygon id="scene2-hexagon" class="scene2-hexagon" points="335,373 465,373 530,260 465,147 335,147 270,260"/>

            <!-- 顶点标签 -->
            <text id="scene2-label-A" class="scene2-label" x="335" y="420" text-anchor="middle" dominant-baseline="hanging">A</text>
            <text id="scene2-label-B" class="scene2-label" x="465" y="420" text-anchor="middle" dominant-baseline="hanging">B</text>
            <text id="scene2-label-C" class="scene2-label" x="590" y="265" text-anchor="start" dominant-baseline="middle">C</text>
            <text id="scene2-label-D" class="scene2-label" x="525" y="105" text-anchor="start" dominant-baseline="middle">D</text>
            <text id="scene2-label-E" class="scene2-label" x="275" y="105" text-anchor="end" dominant-baseline="middle">E</text>
            <text id="scene2-label-F" class="scene2-label" x="215" y="265" text-anchor="end" dominant-baseline="middle">F</text>

            <!-- 原点 O -->
            <circle id="scene2-point-O" cx="400" cy="260" r="3" fill="#000"/>
            <text id="scene2-label-O" class="scene2-label" x="435" y="295" text-anchor="start" dominant-baseline="middle">O</text>

            <!-- 直线 L: 三段式绘制，缩小各段包围盒以避免标签重叠 -->
            <line id="scene2-line-L1" class="scene2-line-L" x1="0" y1="0" x2="0" y2="0"/>
            <line id="scene2-line-L2" class="scene2-line-L" x1="0" y1="0" x2="0" y2="0"/>
            <line id="scene2-line-L3" class="scene2-line-L" x1="0" y1="0" x2="0" y2="0"/>
            <text id="scene2-label-L" class="scene2-text-blue" x="570" y="140" text-anchor="start" dominant-baseline="middle">L: y = kx + t</text>

            <!-- 直线 L' (初始隐藏): 三段式绘制 -->
            <line id="scene2-line-Lp1" class="scene2-line-Lp" x1="0" y1="0" x2="0" y2="0" style="display:none"/>
            <line id="scene2-line-Lp2" class="scene2-line-Lp" x1="0" y1="0" x2="0" y2="0" style="display:none"/>
            <line id="scene2-line-Lp3" class="scene2-line-Lp" x1="0" y1="0" x2="0" y2="0" style="display:none"/>
            <text id="scene2-label-Lp" class="scene2-text-red" x="220" y="340" text-anchor="end" dominant-baseline="middle" style="display:none">L': y = kx − t</text>

            <!-- 三角形 OMN -->
            <polygon id="scene2-tri-OMN" class="scene2-tri-blue" points="400,260 400,260 400,260"/>

            <!-- 三角形 OM'N' (初始隐藏) -->
            <polygon id="scene2-tri-OMNp" class="scene2-tri-red" points="400,260 400,260 400,260" style="display:none"/>

            <!-- 线段 OM, ON -->
            <line id="scene2-seg-OM" class="scene2-seg-blue" x1="400" y1="260" x2="400" y2="260"/>
            <line id="scene2-seg-ON" class="scene2-seg-blue" x1="400" y1="260" x2="400" y2="260"/>

            <!-- 线段 OM', ON' (初始隐藏) -->
            <line id="scene2-seg-OMp" class="scene2-seg-red" x1="400" y1="260" x2="400" y2="260" style="display:none"/>
            <line id="scene2-seg-ONp" class="scene2-seg-red" x1="400" y1="260" x2="400" y2="260" style="display:none"/>

            <!-- 辅助虚线 MM', NN' (初始隐藏) -->
            <line id="scene2-dash-MMp" class="scene2-dash" x1="0" y1="0" x2="0" y2="0" style="display:none"/>
            <line id="scene2-dash-NNp" class="scene2-dash" x1="0" y1="0" x2="0" y2="0" style="display:none"/>

            <!-- 交点 M, N -->
            <circle id="scene2-point-M" class="scene2-point-blue" cx="400" cy="260" r="4"/>
            <circle id="scene2-point-N" class="scene2-point-blue" cx="400" cy="260" r="4"/>
            <text id="scene2-label-M" class="scene2-text-blue" x="240" y="315" text-anchor="end" dominant-baseline="middle">M</text>
            <text id="scene2-label-N" class="scene2-text-blue" x="525" y="165" text-anchor="start" dominant-baseline="middle">N</text>

            <!-- 交点 M', N' (初始隐藏) -->
            <circle id="scene2-point-Mp" class="scene2-point-red" cx="400" cy="260" r="4" style="display:none"/>
            <circle id="scene2-point-Np" class="scene2-point-red" cx="400" cy="260" r="4" style="display:none"/>
            <text id="scene2-label-Mp" class="scene2-text-red" x="560" y="220" text-anchor="start" dominant-baseline="middle" style="display:none">M'</text>
            <text id="scene2-label-Np" class="scene2-text-red" x="240" y="380" text-anchor="end" dominant-baseline="middle" style="display:none">N'</text>

            <!-- 面积标签 -->
            <text id="scene2-area-S" class="scene2-area-text scene2-text-blue" x="560" y="85" text-anchor="start" dominant-baseline="middle">S = f(t) ≈ —</text>
            <text id="scene2-area-Sp" class="scene2-area-text scene2-text-red" x="560" y="125" text-anchor="start" dominant-baseline="middle" style="display:none">S = f(−t) ≈ —</text>

            <!-- 结论文字 (初始隐藏) -->
            <text id="scene2-conclusion" class="scene2-text-green" x="500" y="30" text-anchor="start" dominant-baseline="middle" style="display:none">f(−t) = f(t)，故 f(t) 为偶函数</text>
        </svg>

        <div id="scene2-controls">
            <span style="font-size:14px;">t =</span>
            <input id="scene2-slider-t" type="range" min="-140" max="140" value="50" step="1"/>
            <span id="scene2-t-value" style="font-size:14px; min-width:40px;">50</span>
            <button id="scene2-btn-symmetric">显示对称直线 L'</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2 实现
        // 坐标系：画布 (400,260) 对应数学原点；画布x = 400 + mathX, 画布y = 260 - mathY
        // 正六边形边长 a = 130，中心在原点，AB ∥ Ox

        const a = 130;
        const h = a * Math.sqrt(3) / 2;
        const k = 0.6;
        const cx = 400, cy = 260;

        // 获取直线 y = kx + t 与正六边形的交点（数学坐标）
        function getIntersectionsDirect(t) {
            const pts = [];
            const sqrt3 = Math.sqrt(3);
            const candidates = [];

            let x = (-h - t) / k;
            if (x >= -a/2 - 1e-6 && x <= a/2 + 1e-6) candidates.push({x, y: -h});

            x = (-sqrt3*a - t) / (k - sqrt3);
            if (x >= a/2 - 1e-6 && x <= a + 1e-6) candidates.push({x, y: k*x + t});

            x = (sqrt3*a - t) / (k + sqrt3);
            if (x >= a/2 - 1e-6 && x <= a + 1e-6) candidates.push({x, y: k*x + t});

            x = (h - t) / k;
            if (x >= -a/2 - 1e-6 && x <= a/2 + 1e-6) candidates.push({x, y: h});

            x = (sqrt3*a - t) / (k - sqrt3);
            if (x >= -a - 1e-6 && x <= -a/2 + 1e-6) candidates.push({x, y: k*x + t});

            x = (-sqrt3*a - t) / (k + sqrt3);
            if (x >= -a - 1e-6 && x <= -a/2 + 1e-6) candidates.push({x, y: k*x + t});

            const seen = new Set();
            for (const p of candidates) {
                const key = Math.round(p.x * 1000) + ',' + Math.round(p.y * 1000);
                if (!seen.has(key)) {
                    seen.add(key);
                    pts.push(p);
                }
            }
            pts.sort((a, b) => a.x - b.x);
            return pts.slice(0, 2);
        }

        function toCanvas(mx, my) {
            return { x: cx + mx, y: cy - my };
        }

        function computeArea(mx, my, nx, ny) {
            return 0.5 * Math.abs(mx * ny - nx * my) / (a * a);
        }

        // 更新场景
        function updateScene(t) {
            const pts = getIntersectionsDirect(t);

            if (pts.length >= 2) {
                const M = pts[0];
                const N = pts[1];
                const cM = toCanvas(M.x, M.y);
                const cN = toCanvas(N.x, N.y);

                // 直线 L 三段式：左延伸、中弦、右延伸
                // 画布坐标系斜率为 -0.6，故 Δx=-30 时 Δy=+18，Δx=+30 时 Δy=-18
                const extLeft = { x: cM.x - 30, y: cM.y + 18 };
                const extRight = { x: cN.x + 30, y: cN.y - 18 };

                document.getElementById('scene2-line-L1').setAttribute('x1', extLeft.x);
                document.getElementById('scene2-line-L1').setAttribute('y1', extLeft.y);
                document.getElementById('scene2-line-L1').setAttribute('x2', cM.x);
                document.getElementById('scene2-line-L1').setAttribute('y2', cM.y);
                document.getElementById('scene2-line-L2').setAttribute('x1', cM.x);
                document.getElementById('scene2-line-L2').setAttribute('y1', cM.y);
                document.getElementById('scene2-line-L2').setAttribute('x2', cN.x);
                document.getElementById('scene2-line-L2').setAttribute('y2', cN.y);
                document.getElementById('scene2-line-L3').setAttribute('x1', cN.x);
                document.getElementById('scene2-line-L3').setAttribute('y1', cN.y);
                document.getElementById('scene2-line-L3').setAttribute('x2', extRight.x);
                document.getElementById('scene2-line-L3').setAttribute('y2', extRight.y);

                // 更新点 M, N
                document.getElementById('scene2-point-M').setAttribute('cx', cM.x);
                document.getElementById('scene2-point-M').setAttribute('cy', cM.y);
                document.getElementById('scene2-point-N').setAttribute('cx', cN.x);
                document.getElementById('scene2-point-N').setAttribute('cy', cN.y);

                // 更新线段 OM, ON
                document.getElementById('scene2-seg-OM').setAttribute('x2', cM.x);
                document.getElementById('scene2-seg-OM').setAttribute('y2', cM.y);
                document.getElementById('scene2-seg-ON').setAttribute('x2', cN.x);
                document.getElementById('scene2-seg-ON').setAttribute('y2', cN.y);

                // 更新三角形 OMN
                document.getElementById('scene2-tri-OMN').setAttribute('points',
                    `400,260 ${cM.x},${cM.y} ${cN.x},${cN.y}`);

                // 更新面积标签
                const area = computeArea(M.x, M.y, N.x, N.y);
                document.getElementById('scene2-area-S').textContent =
                    `S = f(t) ≈ ${area.toFixed(2)}a²`;

                // 更新 M, N 标签位置（动态偏移，保持在安全区）
                document.getElementById('scene2-label-M').setAttribute('x', cM.x - 50);
                document.getElementById('scene2-label-M').setAttribute('y', cM.y);
                document.getElementById('scene2-label-N').setAttribute('x', cN.x + 50);
                document.getElementById('scene2-label-N').setAttribute('y', cN.y);

                // 如果显示对称状态，更新对称元素
                if (showSymmetric) {
                    const Mp = {x: -M.x, y: -M.y};
                    const Np = {x: -N.x, y: -N.y};
                    const cMp = toCanvas(Mp.x, Mp.y);
                    const cNp = toCanvas(Np.x, Np.y);

                    // 直线 L' 三段式（注意 M' 在右侧，N' 在左侧）
                    const extLeftP = { x: cNp.x - 30, y: cNp.y + 18 };
                    const extRightP = { x: cMp.x + 30, y: cMp.y - 18 };

                    document.getElementById('scene2-line-Lp1').setAttribute('x1', extLeftP.x);
                    document.getElementById('scene2-line-Lp1').setAttribute('y1', extLeftP.y);
                    document.getElementById('scene2-line-Lp1').setAttribute('x2', cNp.x);
                    document.getElementById('scene2-line-Lp1').setAttribute('y2', cNp.y);
                    document.getElementById('scene2-line-Lp2').setAttribute('x1', cNp.x);
                    document.getElementById('scene2-line-Lp2').setAttribute('y1', cNp.y);
                    document.getElementById('scene2-line-Lp2').setAttribute('x2', cMp.x);
                    document.getElementById('scene2-line-Lp2').setAttribute('y2', cMp.y);
                    document.getElementById('scene2-line-Lp3').setAttribute('x1', cMp.x);
                    document.getElementById('scene2-line-Lp3').setAttribute('y1', cMp.y);
                    document.getElementById('scene2-line-Lp3').setAttribute('x2', extRightP.x);
                    document.getElementById('scene2-line-Lp3').setAttribute('y2', extRightP.y);

                    // 点 M', N'
                    document.getElementById('scene2-point-Mp').setAttribute('cx', cMp.x);
                    document.getElementById('scene2-point-Mp').setAttribute('cy', cMp.y);
                    document.getElementById('scene2-point-Np').setAttribute('cx', cNp.x);
                    document.getElementById('scene2-point-Np').setAttribute('cy', cNp.y);

                    // 线段 OM', ON'
                    document.getElementById('scene2-seg-OMp').setAttribute('x2', cMp.x);
                    document.getElementById('scene2-seg-OMp').setAttribute('y2', cMp.y);
                    document.getElementById('scene2-seg-ONp').setAttribute('x2', cNp.x);
                    document.getElementById('scene2-seg-ONp').setAttribute('y2', cNp.y);

                    // 三角形 OM'N'
                    document.getElementById('scene2-tri-OMNp').setAttribute('points',
                        `400,260 ${cMp.x},${cMp.y} ${cNp.x},${cNp.y}`);

                    // 辅助虚线
                    document.getElementById('scene2-dash-MMp').setAttribute('x1', cM.x);
                    document.getElementById('scene2-dash-MMp').setAttribute('y1', cM.y);
                    document.getElementById('scene2-dash-MMp').setAttribute('x2', cMp.x);
                    document.getElementById('scene2-dash-MMp').setAttribute('y2', cMp.y);
                    document.getElementById('scene2-dash-NNp').setAttribute('x1', cN.x);
                    document.getElementById('scene2-dash-NNp').setAttribute('y1', cN.y);
                    document.getElementById('scene2-dash-NNp').setAttribute('x2', cNp.x);
                    document.getElementById('scene2-dash-NNp').setAttribute('y2', cNp.y);

                    // 面积 S(-t)
                    document.getElementById('scene2-area-Sp').textContent =
                        `S = f(−t) ≈ ${area.toFixed(2)}a²`;

                    // M', N' 标签位置
                    document.getElementById('scene2-label-Mp').setAttribute('x', cMp.x + 50);
                    document.getElementById('scene2-label-Mp').setAttribute('y', cMp.y);
                    document.getElementById('scene2-label-Np').setAttribute('x', cNp.x - 50);
                    document.getElementById('scene2-label-Np').setAttribute('y', cNp.y);
                }
            }
        }

        // 状态管理
        let showSymmetric = false;

        // 切换对称显示
        function toggleSymmetric() {
            showSymmetric = !showSymmetric;
            const btn = document.getElementById('scene2-btn-symmetric');
            const ids = [
                'scene2-line-Lp1', 'scene2-line-Lp2', 'scene2-line-Lp3', 'scene2-label-Lp',
                'scene2-tri-OMNp',
                'scene2-seg-OMp', 'scene2-seg-ONp',
                'scene2-dash-MMp', 'scene2-dash-NNp',
                'scene2-point-Mp', 'scene2-point-Np',
                'scene2-label-Mp', 'scene2-label-Np',
                'scene2-area-Sp', 'scene2-conclusion'
            ];

            if (showSymmetric) {
                btn.textContent = '隐藏对称直线 L\'';
                btn.classList.add('active');
                ids.forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.style.display = '';
                });
            } else {
                btn.textContent = '显示对称直线 L\'';
                btn.classList.remove('active');
                ids.forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.style.display = 'none';
                });
            }

            const t = parseInt(document.getElementById('scene2-slider-t').value, 10);
            updateScene(t);
        }

        // 事件绑定
        document.getElementById('scene2-slider-t').addEventListener('input', function(e) {
            const t = parseInt(e.target.value, 10);
            document.getElementById('scene2-t-value').textContent = t;
            updateScene(t);
        });

        document.getElementById('scene2-btn-symmetric').addEventListener('click', toggleSymmetric);

        // 初始更新
        updateScene(50);
    })();
    </script>
</body>
</html>
