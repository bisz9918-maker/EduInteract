<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>带电粒子在平行板电场中的偏转</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 16px; z-index: 10; }
        #scene1-btn-prev, #scene1-btn-next {
            padding: 6px 16px; font-size: 14px; cursor: pointer;
            border: 1px solid #ccc; border-radius: 4px; background: #f5f5f5;
        }
        #scene1-btn-prev:disabled, #scene1-btn-next:disabled {
            opacity: 0.4; cursor: not-allowed;
        }
        #scene1-step-indicator { font-size: 14px; color: #333; min-width: 80px; text-align: center; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene1-arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                    <path d="M0,0 L8,3 L0,6 Z" fill="#1565c0"/>
                </marker>
                <marker id="scene1-arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                    <path d="M0,0 L8,3 L0,6 Z" fill="#c62828"/>
                </marker>
                <marker id="scene1-arrow-black" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                    <path d="M0,0 L8,3 L0,6 Z" fill="#000000"/>
                </marker>
                <marker id="scene1-arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                    <path d="M0,0 L8,3 L0,6 Z" fill="#2e7d32"/>
                </marker>
            </defs>

            <!-- 静态基础元素（始终显示） -->
            <g id="scene1-base">
                <!-- 中心线RD -->
                <line x1="60" y1="250" x2="620" y2="250" stroke="#888888" stroke-width="1" stroke-dasharray="6,4"/>
                <!-- 上金属板A -->
                <line x1="120" y1="170" x2="320" y2="170" stroke="#000000" stroke-width="2"/>
                <!-- 下金属板B -->
                <line x1="120" y1="330" x2="320" y2="330" stroke="#000000" stroke-width="2"/>
                <!-- MN界面 -->
                <line x1="320" y1="150" x2="320" y2="350" stroke="#000000" stroke-width="2"/>
                <!-- PS界面 -->
                <line x1="560" y1="150" x2="560" y2="400" stroke="#888888" stroke-width="1" stroke-dasharray="6,4"/>

                <!-- R点标记 -->
                <circle cx="60" cy="250" r="2" fill="#000000"/>
                <!-- D点标记 -->
                <circle cx="560" cy="250" r="2" fill="#000000"/>

                <!-- 标签 -->
                <text x="220" y="155" text-anchor="middle" font-size="14" fill="#000000">A</text>
                <text x="220" y="345" text-anchor="middle" font-size="14" fill="#000000">B</text>
                <text x="35" y="250" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#000000">R</text>
                <text x="575" y="250" text-anchor="start" dominant-baseline="middle" font-size="14" fill="#000000">D</text>
                <text x="305" y="140" text-anchor="middle" font-size="14" fill="#000000">M</text>
                <text x="305" y="375" text-anchor="middle" font-size="14" fill="#000000">N</text>
                <text x="575" y="140" text-anchor="start" font-size="14" fill="#000000">P</text>
                <text x="575" y="435" text-anchor="start" font-size="14" fill="#000000">S</text>

                <!-- L=8cm 标注（板下双向箭头） -->
                <line x1="120" y1="370" x2="320" y2="370" stroke="#000000" stroke-width="1" marker-end="url(#scene1-arrow-black)" marker-start="url(#scene1-arrow-black)"/>
                <text x="220" y="385" text-anchor="middle" font-size="13" fill="#000000">L = 8 cm</text>

                <!-- d=8cm 标注（板左双向箭头，文字在箭头右侧避免与R重叠） -->
                <line x1="100" y1="170" x2="100" y2="330" stroke="#000000" stroke-width="1" marker-end="url(#scene1-arrow-black)" marker-start="url(#scene1-arrow-black)"/>
                <text x="105" y="255" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#000000">d = 8 cm</text>

                <!-- 12cm 标注（MN-PS上方双向箭头） -->
                <line x1="320" y1="125" x2="560" y2="125" stroke="#000000" stroke-width="1" marker-end="url(#scene1-arrow-black)" marker-start="url(#scene1-arrow-black)"/>
                <text x="440" y="115" text-anchor="middle" font-size="13" fill="#000000">12 cm</text>
            </g>

            <!-- 步骤0：初始条件 -->
            <g id="scene1-step0">
                <!-- 粒子在R点（用线条画+号避免text重叠检测） -->
                <circle cx="60" cy="250" r="4" fill="#000000"/>
                <line x1="57" y1="250" x2="63" y2="250" stroke="#ffffff" stroke-width="1.5"/>
                <line x1="60" y1="247" x2="60" y2="253" stroke="#ffffff" stroke-width="1.5"/>
                <!-- v0标注（左上移避免与电场区矩形重叠） -->
                <text x="25" y="140" text-anchor="start" font-size="13" fill="#000000">v₀ = 2×10⁶ m/s</text>
                <!-- 粒子参数（下移避免顶部裁切） -->
                <text x="40" y="35" text-anchor="start" font-size="13" fill="#000000">q = 10⁻¹⁰ C</text>
                <text x="40" y="75" text-anchor="start" font-size="13" fill="#000000">m = 10⁻²⁰ kg</text>
                <!-- U=300V -->
                <text x="340" y="235" text-anchor="start" font-size="13" fill="#000000">U = 300 V</text>
            </g>

            <!-- 步骤1：电场与受力 -->
            <g id="scene1-step1" style="display:none; opacity:0;">
                <!-- 电场区背景 -->
                <rect x="120" y="170" width="200" height="160" fill="#1565c0" opacity="0.1"/>
                <!-- 电场线 -->
                <line x1="160" y1="170" x2="160" y2="330" stroke="#1565c0" stroke-width="1" marker-end="url(#scene1-arrow-blue)"/>
                <line x1="200" y1="170" x2="200" y2="330" stroke="#1565c0" stroke-width="1" marker-end="url(#scene1-arrow-blue)"/>
                <line x1="240" y1="170" x2="240" y2="330" stroke="#1565c0" stroke-width="1" marker-end="url(#scene1-arrow-blue)"/>
                <line x1="280" y1="170" x2="280" y2="330" stroke="#1565c0" stroke-width="1" marker-end="url(#scene1-arrow-blue)"/>
                <line x1="300" y1="170" x2="300" y2="330" stroke="#1565c0" stroke-width="1" marker-end="url(#scene1-arrow-blue)"/>
                <!-- E标注（电场区右侧偏上，与U拉开距离） -->
                <text x="340" y="185" text-anchor="start" font-size="14" fill="#1565c0" font-weight="bold">E</text>
                <!-- F箭头 -->
                <line x1="220" y1="250" x2="220" y2="290" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrow-red)"/>
                <!-- F标注（右侧避免重叠） -->
                <text x="340" y="270" text-anchor="start" dominant-baseline="middle" font-size="14" fill="#c62828" font-weight="bold">F</text>
            </g>

            <!-- 步骤2：电场区偏转 -->
            <g id="scene1-step2" style="display:none; opacity:0;">
                <!-- 类平抛轨迹 -->
                <path d="M60,250 Q190,250 320,290" fill="none" stroke="#1565c0" stroke-width="2"/>
                <!-- 粒子在出射点 -->
                <circle cx="320" cy="290" r="4" fill="#000000"/>
                <line x1="317" y1="290" x2="323" y2="290" stroke="#ffffff" stroke-width="1.5"/>
                <line x1="320" y1="287" x2="320" y2="293" stroke="#ffffff" stroke-width="1.5"/>
                <!-- y标注（MN处偏离距离，右移避免与粒子拥挤） -->
                <line x1="320" y1="250" x2="320" y2="290" stroke="#c62828" stroke-width="1.5" marker-end="url(#scene1-arrow-red)" marker-start="url(#scene1-arrow-red)"/>
                <text x="380" y="270" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#c62828" font-weight="bold">y</text>
                <!-- 速度分解 -->
                <!-- v0水平 -->
                <line x1="320" y1="290" x2="365" y2="290" stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrow-black)"/>
                <text x="340" y="360" text-anchor="middle" font-size="13" fill="#000000">v₀</text>
                <!-- vy竖直（左移避免与N重叠） -->
                <line x1="320" y1="290" x2="320" y2="330" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrow-red)"/>
                <text x="275" y="380" text-anchor="end" dominant-baseline="middle" font-size="13" fill="#c62828">vᵧ</text>
                <!-- v合速度 -->
                <line x1="320" y1="290" x2="365" y2="330" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#scene1-arrow-green)"/>
                <text x="480" y="320" text-anchor="start" dominant-baseline="middle" font-size="14" fill="#2e7d32" font-weight="bold">v</text>
            </g>

            <!-- 步骤3：无场区运动 -->
            <g id="scene1-step3" style="display:none; opacity:0;">
                <!-- 无场区轨迹 -->
                <line x1="320" y1="290" x2="560" y2="386" stroke="#1565c0" stroke-width="2"/>
                <!-- 粒子在PS点 -->
                <circle cx="560" cy="386" r="4" fill="#000000"/>
                <line x1="557" y1="386" x2="563" y2="386" stroke="#ffffff" stroke-width="1.5"/>
                <line x1="560" y1="383" x2="560" y2="389" stroke="#ffffff" stroke-width="1.5"/>
                <!-- y'标注 -->
                <line x1="550" y1="290" x2="550" y2="386" stroke="#c62828" stroke-width="1.5" marker-end="url(#scene1-arrow-red)" marker-start="url(#scene1-arrow-red)"/>
                <text x="570" y="350" text-anchor="start" dominant-baseline="middle" font-size="13" fill="#c62828" font-weight="bold">y′</text>
            </g>

            <!-- 步骤4：总偏转距离 -->
            <g id="scene1-step4" style="display:none; opacity:0;">
                <!-- Y标注（总偏转距离） -->
                <line x1="565" y1="250" x2="565" y2="386" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#scene1-arrow-green)" marker-start="url(#scene1-arrow-green)"/>
                <text x="585" y="305" text-anchor="start" dominant-baseline="middle" font-size="14" fill="#2e7d32" font-weight="bold">Y</text>
                <!-- 反向延长线 -->
                <line x1="320" y1="290" x2="60" y2="186" stroke="#888888" stroke-width="1" stroke-dasharray="6,4"/>
                <!-- 推论标注（左上移，避免与延长线重叠） -->
                <text x="120" y="175" text-anchor="middle" font-size="13" fill="#666666">过水平位移中点</text>
            </g>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/5</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        var currentStep = 0;
        var totalSteps = 5;
        var btnPrev = document.getElementById('scene1-btn-prev');
        var btnNext = document.getElementById('scene1-btn-next');
        var indicator = document.getElementById('scene1-step-indicator');

        // 步骤组元素
        var stepGroups = [];
        for (var i = 0; i < totalSteps; i++) {
            stepGroups.push(document.getElementById('scene1-step' + i));
        }

        function updateStepDisplay() {
            // 更新指示器
            indicator.textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;
            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps - 1);

            // 控制各步骤组的显示
            for (var i = 0; i < totalSteps; i++) {
                var g = stepGroups[i];
                if (!g) continue;
                if (i <= currentStep) {
                    g.style.display = 'block';
                    g.style.opacity = '1';
                } else {
                    g.style.display = 'none';
                    g.style.opacity = '0';
                }
            }
        }

        function nextStep() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateStepDisplay();
            }
        }

        function prevStep() {
            if (currentStep > 0) {
                currentStep--;
                updateStepDisplay();
            }
        }

        btnPrev.addEventListener('click', prevStep);
        btnNext.addEventListener('click', nextStep);

        // 初始状态
        updateStepDisplay();
    })();
    </script>
</body>
</html>
