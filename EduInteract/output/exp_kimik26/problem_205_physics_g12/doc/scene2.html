<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 动能定理与功-能关系</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "SimHei", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }

        /* 按钮样式 */
        .scene2-btn {
            position: absolute;
            font-size: 14px;
            font-family: "Microsoft YaHei", "SimHei", sans-serif;
            border: 2px solid;
            border-radius: 4px;
            cursor: pointer;
            z-index: 20;
            transition: all 0.2s ease;
        }

        #scene2-btn-state1 {
            left: 230px;
            top: 12px;
            width: 160px;
            height: 34px;
        }
        #scene2-btn-state2 {
            left: 410px;
            top: 12px;
            width: 160px;
            height: 34px;
        }
        #scene2-btn-reset {
            left: 360px;
            top: 455px;
            width: 80px;
            height: 30px;
            font-size: 13px;
        }

        /* 激活状态 */
        .active-blue {
            background: #1565c0;
            color: #ffffff;
            border-color: #1565c0;
        }
        .inactive-blue {
            background: #ffffff;
            color: #000000;
            border-color: #1565c0;
        }
        .active-red {
            background: #c62828;
            color: #ffffff;
            border-color: #c62828;
        }
        .inactive-red {
            background: #ffffff;
            color: #000000;
            border-color: #c62828;
        }
        .reset-style {
            background: #f5f5f5;
            color: #333333;
            border-color: #cccccc;
        }
        .reset-style:hover {
            background: #e0e0e0;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <button id="scene2-btn-state1" class="scene2-btn active-blue">第一问 M→L</button>
        <button id="scene2-btn-state2" class="scene2-btn inactive-red">第二问 M→P</button>
        <button id="scene2-btn-reset" class="scene2-btn reset-style">重置</button>

        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- 向左箭头 marker -->
                <marker id="scene2-arrow-left" markerWidth="10" markerHeight="10" refX="0" refY="5" orient="auto-start-reverse">
                    <path d="M 10 0 L 0 5 L 10 10 z" fill="#888888"/>
                </marker>
            </defs>

            <!-- 电场线（4条水平向左虚线箭头） -->
            <line x1="520" y1="80" x2="180" y2="80" stroke="#888888" stroke-width="1" stroke-dasharray="6,4" marker-start="url(#scene2-arrow-left)"/>
            <line x1="520" y1="100" x2="180" y2="100" stroke="#888888" stroke-width="1" stroke-dasharray="6,4" marker-start="url(#scene2-arrow-left)"/>
            <line x1="520" y1="120" x2="180" y2="120" stroke="#888888" stroke-width="1" stroke-dasharray="6,4" marker-start="url(#scene2-arrow-left)"/>
            <line x1="520" y1="140" x2="180" y2="140" stroke="#888888" stroke-width="1" stroke-dasharray="6,4" marker-start="url(#scene2-arrow-left)"/>

            <!-- E 标签 -->
            <text id="scene2-label-e" x="150" y="100" font-size="16" fill="#000000" font-style="italic">E</text>

            <!-- 水平轨道 MN -->
            <line id="scene2-path-mn" x1="300" y1="170" x2="480" y2="170" stroke="#000000" stroke-width="3"/>

            <!-- 半圆弧 NP (N到P) -->
            <path id="scene2-arc-np" d="M 300 170 A 40 40 0 0 1 260 130" fill="none" stroke="#cccccc" stroke-width="1"/>

            <!-- 半圆弧 PL (P到L) -->
            <path id="scene2-arc-pl" d="M 260 130 A 40 40 0 0 1 300 90" fill="none" stroke="#000000" stroke-width="3"/>

            <!-- P 点标记 -->
            <circle id="scene2-point-p" cx="260" cy="130" r="3" fill="#000000" visibility="hidden"/>

            <!-- 物块 -->
            <rect id="scene2-block" x="473" y="158" width="14" height="12" fill="#d500f9" stroke="#000000" stroke-width="1"/>

            <!-- 标签 -->
            <text id="scene2-label-m" x="480" y="188" font-size="14" fill="#000000" text-anchor="middle">M</text>
            <text id="scene2-label-n" x="300" y="188" font-size="14" fill="#000000" text-anchor="middle">N</text>
            <text id="scene2-label-p" x="245" y="134" font-size="14" fill="#000000" text-anchor="end" visibility="hidden">P</text>
            <text id="scene2-label-l" x="300" y="82" font-size="14" fill="#000000" text-anchor="middle">L</text>
            <text id="scene2-label-mass" x="480" y="152" font-size="12" fill="#000000" text-anchor="middle">m</text>

            <!-- 功的表达式区域（使用彩色指示方块+文字，避免文字与背景矩形重叠） -->
            <!-- W_E 指示方块 -->
            <rect x="40" y="222" width="10" height="10" fill="#1565c0" rx="2"/>
            <!-- 状态1 W_E -->
            <text id="scene2-text-we-1" x="60" y="232" font-size="16" fill="#1565c0" font-family="serif">
                W<tspan baseline-shift="sub" font-size="11">E</tspan> = +qES
            </text>
            <!-- 状态2 W_E -->
            <text id="scene2-text-we-2" x="60" y="232" font-size="16" fill="#1565c0" font-family="serif" visibility="hidden">
                W<tspan baseline-shift="sub" font-size="11">E</tspan> = +qE(S+R)
            </text>

            <!-- W_f 指示方块 -->
            <rect x="40" y="280" width="10" height="10" fill="#c62828" rx="2"/>
            <text id="scene2-text-wf" x="60" y="290" font-size="16" fill="#c62828" font-family="serif">
                W<tspan baseline-shift="sub" font-size="11">f</tspan> = −μmgS
            </text>

            <!-- W_g 指示方块 -->
            <rect x="40" y="338" width="10" height="10" fill="#c62828" rx="2"/>
            <!-- 状态1 W_g -->
            <text id="scene2-text-wg-1" x="60" y="348" font-size="16" fill="#c62828" font-family="serif">
                W<tspan baseline-shift="sub" font-size="11">g</tspan> = −mg·2R
            </text>
            <!-- 状态2 W_g -->
            <text id="scene2-text-wg-2" x="60" y="348" font-size="16" fill="#c62828" font-family="serif" visibility="hidden">
                W<tspan baseline-shift="sub" font-size="11">g</tspan> = −mgR
            </text>

            <!-- 等号 -->
            <text id="scene2-equals" x="395" y="294" font-size="32" fill="#2e7d32" text-anchor="middle" font-family="serif">=</text>

            <!-- ΔE_k 指示方块 -->
            <rect x="430" y="284" width="10" height="10" fill="#2e7d32" rx="2"/>
            <!-- 状态1 ΔE_k -->
            <text id="scene2-text-ek-1" x="450" y="294" font-size="20" fill="#2e7d32" font-family="serif">
                ΔE<tspan baseline-shift="sub" font-size="13">k</tspan> = ½mv<tspan baseline-shift="sub" font-size="13">L</tspan><tspan baseline-shift="super" font-size="13">2</tspan>
            </text>
            <!-- 状态2 ΔE_k -->
            <text id="scene2-text-ek-2" x="450" y="294" font-size="20" fill="#2e7d32" font-family="serif" visibility="hidden">
                ΔE<tspan baseline-shift="sub" font-size="13">k</tspan> = ½mv<tspan baseline-shift="sub" font-size="13">P</tspan><tspan baseline-shift="super" font-size="13">2</tspan>
            </text>

            <!-- 底部方程（无背景矩形，直接显示文字，增加行间距避免重叠） -->
            <!-- 状态1 方程行1 -->
            <text id="scene2-eq-line1-1" x="400" y="392" font-size="16" fill="#000000" text-anchor="middle" font-family="serif">
                (qE − μmg)S − 2mgR = ½mv<tspan baseline-shift="sub" font-size="11">L</tspan><tspan baseline-shift="super" font-size="11">2</tspan>
            </text>
            <!-- 状态2 方程行1 -->
            <text id="scene2-eq-line1-2" x="400" y="392" font-size="16" fill="#000000" text-anchor="middle" font-family="serif" visibility="hidden">
                qE(S+R) − μmgS − mgR = ½mv<tspan baseline-shift="sub" font-size="11">P</tspan><tspan baseline-shift="super" font-size="11">2</tspan>
            </text>
            <!-- 状态1 方程行2 -->
            <text id="scene2-eq-line2-1" x="400" y="422" font-size="16" fill="#2e7d32" text-anchor="middle" font-family="serif">
                v<tspan baseline-shift="sub" font-size="11">L</tspan><tspan baseline-shift="super" font-size="11">2</tspan> = gR
            </text>
            <!-- 状态2 方程行2 -->
            <text id="scene2-eq-line2-2" x="400" y="422" font-size="16" fill="#2e7d32" text-anchor="middle" font-family="serif" visibility="hidden">
                v<tspan baseline-shift="sub" font-size="11">P</tspan><tspan baseline-shift="super" font-size="11">2</tspan> = 14 m²/s²
            </text>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 2 实现 - 动能定理与功-能关系（多状态切换）

        // 元素引用
        const btnState1 = document.getElementById('scene2-btn-state1');
        const btnState2 = document.getElementById('scene2-btn-state2');
        const btnReset = document.getElementById('scene2-btn-reset');

        const arcNP = document.getElementById('scene2-arc-np');
        const arcPL = document.getElementById('scene2-arc-pl');
        const pointP = document.getElementById('scene2-point-p');
        const labelP = document.getElementById('scene2-label-p');
        const labelL = document.getElementById('scene2-label-l');

        const textWE1 = document.getElementById('scene2-text-we-1');
        const textWE2 = document.getElementById('scene2-text-we-2');
        const textWG1 = document.getElementById('scene2-text-wg-1');
        const textWG2 = document.getElementById('scene2-text-wg-2');
        const textEK1 = document.getElementById('scene2-text-ek-1');
        const textEK2 = document.getElementById('scene2-text-ek-2');
        const eqLine1_1 = document.getElementById('scene2-eq-line1-1');
        const eqLine1_2 = document.getElementById('scene2-eq-line1-2');
        const eqLine2_1 = document.getElementById('scene2-eq-line2-1');
        const eqLine2_2 = document.getElementById('scene2-eq-line2-2');

        let currentState = 1;

        function show(el) {
            el.setAttribute('visibility', 'visible');
            el.style.display = '';
            el.style.opacity = '1';
        }

        function hide(el) {
            el.setAttribute('visibility', 'hidden');
        }

        function setState(state) {
            currentState = state;

            if (state === 1) {
                // 按钮样式
                btnState1.className = 'scene2-btn active-blue';
                btnState2.className = 'scene2-btn inactive-red';

                // 路径高亮：NL 粗黑，NP 灰细
                arcNP.setAttribute('stroke', '#cccccc');
                arcNP.setAttribute('stroke-width', '1');
                arcPL.setAttribute('stroke', '#000000');
                arcPL.setAttribute('stroke-width', '3');

                // 标签显隐
                hide(pointP);
                hide(labelP);
                show(labelL);

                // 功的表达式
                show(textWE1);
                hide(textWE2);
                show(textWG1);
                hide(textWG2);
                show(textEK1);
                hide(textEK2);

                // 底部方程
                show(eqLine1_1);
                hide(eqLine1_2);
                show(eqLine2_1);
                hide(eqLine2_2);

            } else {
                // 按钮样式
                btnState1.className = 'scene2-btn inactive-blue';
                btnState2.className = 'scene2-btn active-red';

                // 路径高亮：NP 粗黑，PL 灰细
                arcNP.setAttribute('stroke', '#000000');
                arcNP.setAttribute('stroke-width', '3');
                arcPL.setAttribute('stroke', '#cccccc');
                arcPL.setAttribute('stroke-width', '1');

                // 标签显隐
                show(pointP);
                show(labelP);
                hide(labelL);

                // 功的表达式
                hide(textWE1);
                show(textWE2);
                hide(textWG1);
                show(textWG2);
                hide(textEK1);
                show(textEK2);

                // 底部方程
                hide(eqLine1_1);
                show(eqLine1_2);
                hide(eqLine2_1);
                show(eqLine2_2);
            }
        }

        btnState1.addEventListener('click', function() { setState(1); });
        btnState2.addEventListener('click', function() { setState(2); });
        btnReset.addEventListener('click', function() { setState(1); });

    })();
    </script>
</body>
</html>
