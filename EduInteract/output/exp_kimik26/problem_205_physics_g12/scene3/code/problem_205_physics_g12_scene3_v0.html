<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 3 - 圆周运动临界条件与动力学分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 20px; z-index: 10; }
        .scene3-btn {
            width: 130px; height: 36px; font-size: 14px; font-weight: bold;
            border-radius: 4px; cursor: pointer; transition: all 0.2s ease;
            display: flex; align-items: center; justify-content: center;
        }
        .scene3-btn-inactive {
            background: #ffffff; color: #000000; border: 1px solid #000000;
        }
        .scene3-btn-inactive:hover { background: #f5f5f5; }
        .scene3-btn-active-red {
            background: #c62828; color: #ffffff; border: 1px solid #c62828;
        }
        .scene3-btn-active-blue {
            background: #1565c0; color: #ffffff; border: 1px solid #1565c0;
        }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg id="scene3-svg" width="800" height="500" viewBox="0 0 800 500">
            <defs>
                <!-- Arrow markers -->
                <marker id="scene3-arrow-black" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
                    <path d="M0,0 L10,4 L0,8 L2,4 Z" fill="#000000"/>
                </marker>
                <marker id="scene3-arrow-red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
                    <path d="M0,0 L10,4 L0,8 L2,4 Z" fill="#c62828"/>
                </marker>
                <marker id="scene3-arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
                    <path d="M0,0 L10,4 L0,8 L2,4 Z" fill="#1565c0"/>
                </marker>
                <marker id="scene3-arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
                    <path d="M0,0 L10,4 L0,8 L2,4 Z" fill="#2e7d32"/>
                </marker>
            </defs>

            <!-- State Title -->
            <text id="scene3-state-title" x="400" y="42" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000">
                状态1：L点临界条件（N = 0）
            </text>

            <!-- ==================== STATE 1 GROUP ==================== -->
            <g id="scene3-state1-group">
                <!-- Arc: center(400,340), R=120, 45°~135° -->
                <path d="M 485 255 A 120 120 0 0 0 315 255" fill="none" stroke="#000000" stroke-width="2"/>

                <!-- Block at top center -->
                <rect x="392" y="212" width="16" height="16" fill="#000000" stroke="#000000"/>

                <!-- Radius OL -->
                <line x1="400" y1="340" x2="400" y2="228" stroke="#2e7d32" stroke-width="1"/>

                <!-- Center O -->
                <circle cx="400" cy="340" r="3" fill="#2e7d32"/>
                <text x="385" y="342" text-anchor="start" font-size="14" fill="#2e7d32">O</text>

                <!-- Gravity mg arrow (red, solid) -->
                <line x1="400" y1="228" x2="400" y2="290" stroke="#c62828" stroke-width="2.5" marker-end="url(#scene3-arrow-red)"/>
                <text x="340" y="275" text-anchor="middle" font-size="14" fill="#c62828" font-weight="bold">mg</text>

                <!-- Centripetal force F_向 arrow (green, dashed) -->
                <line x1="415" y1="228" x2="415" y2="300" stroke="#2e7d32" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#scene3-arrow-green)"/>
                <text x="445" y="275" text-anchor="start" font-size="14" fill="#2e7d32" font-weight="bold">Fₙ</text>

                <!-- R label -->
                <text x="420" y="330" text-anchor="start" font-size="14" fill="#2e7d32" font-weight="bold">R</text>

                <!-- N=0 annotation -->
                <text x="400" y="195" text-anchor="middle" font-size="16" fill="#c62828" font-weight="bold">N = 0（临界）</text>

                <!-- Equation text -->
                <text x="250" y="395" font-size="16" fill="#000000">mg = mv<sub>L</sub>²/R</text>
                <text x="250" y="425" font-size="16" fill="#000000">v<sub>L</sub>² = gR = </text>
                <text x="370" y="425" font-size="16" fill="#2e7d32" font-weight="bold">4 m²/s²</text>
            </g>

            <!-- ==================== STATE 2 GROUP ==================== -->
            <g id="scene3-state2-group" style="display: none;">
                <!-- Arc: center(520,300), R=120, 135°~225° -->
                <path d="M 435 215 A 120 120 0 0 1 435 385" fill="none" stroke="#000000" stroke-width="2"/>

                <!-- Block at left center -->
                <rect x="392" y="292" width="16" height="16" fill="#000000" stroke="#000000"/>

                <!-- Radius OP -->
                <line x1="520" y1="300" x2="408" y2="300" stroke="#2e7d32" stroke-width="1"/>

                <!-- Center O -->
                <circle cx="520" cy="300" r="3" fill="#2e7d32"/>
                <text x="535" y="305" text-anchor="start" font-size="14" fill="#2e7d32">O</text>

                <!-- Gravity mg arrow (red, solid, downward) -->
                <line x1="400" y1="308" x2="400" y2="370" stroke="#c62828" stroke-width="2.5" marker-end="url(#scene3-arrow-red)"/>
                <text x="365" y="342" text-anchor="middle" font-size="14" fill="#c62828" font-weight="bold">mg</text>

                <!-- Electric force qE arrow (blue, solid, leftward) -->
                <line x1="392" y1="300" x2="320" y2="300" stroke="#1565c0" stroke-width="2.5" marker-end="url(#scene3-arrow-blue)"/>
                <text x="350" y="285" text-anchor="middle" font-size="14" fill="#1565c0" font-weight="bold">qE</text>

                <!-- Normal force N arrow (green, solid, rightward) -->
                <line x1="408" y1="300" x2="480" y2="300" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#scene3-arrow-green)"/>
                <text x="445" y="285" text-anchor="middle" font-size="14" fill="#2e7d32" font-weight="bold">N</text>

                <!-- Centripetal force F_向 arrow (green, dashed, rightward) -->
                <line x1="408" y1="318" x2="480" y2="318" stroke="#2e7d32" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#scene3-arrow-green)"/>
                <text x="445" y="355" text-anchor="middle" font-size="14" fill="#2e7d32" font-weight="bold">Fₙ</text>

                <!-- R label -->
                <text x="460" y="315" text-anchor="start" font-size="14" fill="#2e7d32" font-weight="bold">R</text>

                <!-- Equation text on right side -->
                <text x="570" y="220" font-size="16" fill="#000000" font-weight="bold">受力方程：</text>
                <text x="570" y="250" font-size="16" fill="#000000">N − qE = mv<sub>P</sub>²/R</text>
                <text x="570" y="280" font-size="16" fill="#000000">N = 2.8 + 0.2 = </text>
                <text x="730" y="280" font-size="16" fill="#2e7d32" font-weight="bold">3.0 N</text>

                <!-- Conclusion box -->
                <rect x="560" y="310" width="200" height="70" fill="rgba(46,125,50,0.15)" stroke="#2e7d32" stroke-width="1"/>
                <text x="570" y="340" font-size="16" fill="#c62828" font-weight="bold">N′ = 3.0 N</text>
                <text x="570" y="365" font-size="16" fill="#000000">方向水平向左</text>
            </g>
        </svg>

        <!-- Controls -->
        <div id="scene3-controls">
            <button id="scene3-btn-l" class="scene3-btn scene3-btn-active-red">L点临界</button>
            <button id="scene3-btn-p" class="scene3-btn scene3-btn-inactive">P点受力</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 3 implementation
        var currentState = 1;

        var state1Group = document.getElementById('scene3-state1-group');
        var state2Group = document.getElementById('scene3-state2-group');
        var stateTitle = document.getElementById('scene3-state-title');
        var btnL = document.getElementById('scene3-btn-l');
        var btnP = document.getElementById('scene3-btn-p');

        function showState(state) {
            currentState = state;
            if (state === 1) {
                state1Group.style.display = 'block';
                state2Group.style.display = 'none';
                stateTitle.textContent = '状态1：L点临界条件（N = 0）';
                btnL.className = 'scene3-btn scene3-btn-active-red';
                btnP.className = 'scene3-btn scene3-btn-inactive';
            } else {
                state1Group.style.display = 'none';
                state2Group.style.display = 'block';
                stateTitle.textContent = '状态2：P点受力分析';
                btnL.className = 'scene3-btn scene3-btn-inactive';
                btnP.className = 'scene3-btn scene3-btn-active-blue';
            }
        }

        btnL.addEventListener('click', function() { showState(1); });
        btnP.addEventListener('click', function() { showState(2); });
    })();
    </script>
</body>
</html>
