<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 3 - x-t 图像与位移规律</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene3-controls button {
            padding: 6px 16px; font-size: 14px; cursor: pointer;
            border: 1px solid #ccc; border-radius: 4px; background: #f5f5f5;
            transition: opacity 0.2s;
        }
        #scene3-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene3-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene3-step-indicator { font-size: 14px; color: #555; min-width: 80px; text-align: center; }
        .scene3-highlight-text { fill: #1565c0; font-weight: bold; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg id="scene3-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 坐标系 -->
            <line x1="120" y1="380" x2="580" y2="380" stroke="#000" stroke-width="2"/>
            <polygon points="580,380 570,375 570,385" fill="#000"/>
            <line x1="120" y1="380" x2="120" y2="80" stroke="#000" stroke-width="2"/>
            <polygon points="120,80 115,90 125,90" fill="#000"/>

            <!-- 轴标签 -->
            <text id="scene3-label-t" x="610" y="385" font-size="16" fill="#000">t</text>
            <text id="scene3-label-x" x="105" y="75" font-size="16" fill="#000">x</text>
            <text id="scene3-label-0" x="105" y="402" font-size="14" fill="#000">0</text>

            <!-- 横轴刻度线 -->
            <line id="scene3-tick-t1" x1="212" y1="380" x2="212" y2="388" stroke="#000" stroke-width="1.5"/>
            <line id="scene3-tick-t3" x1="396" y1="380" x2="396" y2="388" stroke="#000" stroke-width="1.5"/>
            <line id="scene3-tick-t5" x1="580" y1="380" x2="580" y2="388" stroke="#000" stroke-width="1.5"/>

            <!-- 纵轴刻度线 -->
            <line id="scene3-tick-L" x1="112" y1="360" x2="120" y2="360" stroke="#000" stroke-width="1.5"/>
            <line id="scene3-tick-5L" x1="112" y1="280" x2="120" y2="280" stroke="#000" stroke-width="1.5"/>
            <line id="scene3-tick-13L" x1="112" y1="120" x2="120" y2="120" stroke="#000" stroke-width="1.5"/>

            <!-- 横轴刻度标签 -->
            <text id="scene3-txt-t1" x="202" y="405" font-size="14" fill="#000">t₁</text>
            <text id="scene3-txt-t3" x="382" y="405" font-size="14" fill="#000">3t₁</text>
            <text id="scene3-txt-t5" x="566" y="405" font-size="14" fill="#000">5t₁</text>

            <!-- 纵轴刻度标签 -->
            <text id="scene3-txt-L" x="95" y="365" font-size="14" fill="#000">L</text>
            <text id="scene3-txt-5L" x="90" y="285" font-size="14" fill="#000">5L</text>
            <text id="scene3-txt-13L" x="85" y="125" font-size="14" fill="#000">13L</text>

            <!-- 辅助虚线 (步骤4显示) -->
            <line id="scene3-dash-p2" x1="396" y1="280" x2="120" y2="280" stroke="#888" stroke-width="1" stroke-dasharray="4,4" opacity="0"/>
            <line id="scene3-dash-p3" x1="580" y1="120" x2="120" y2="120" stroke="#888" stroke-width="1" stroke-dasharray="4,4" opacity="0"/>

            <!-- A球曲线 (蓝色) -->
            <polyline id="scene3-curve-a1" points="120,380 129,380 139,379 148,378 157,376 166,375 175,372 184,369 193,365 202,360 212,360" fill="none" stroke="#1565c0" stroke-width="2.5" opacity="0"/>
            <polyline id="scene3-curve-a2" points="212,360 230,359 249,357 267,353 286,347 304,340 322,331 341,321 359,309 378,295 396,280" fill="none" stroke="#1565c0" stroke-width="2.5" opacity="0"/>
            <polyline id="scene3-curve-a3" points="396,280 414,271 433,261 451,249 470,235 488,220 506,203 525,185 543,165 562,143 580,120" fill="none" stroke="#1565c0" stroke-width="2.5" opacity="0"/>

            <!-- B球曲线 (红色) -->
            <line id="scene3-curve-b1" x1="120" y1="360" x2="212" y2="360" stroke="#c62828" stroke-width="2.5" opacity="0"/>
            <line id="scene3-curve-b2" x1="212" y1="360" x2="396" y2="280" stroke="#c62828" stroke-width="2.5" opacity="0"/>
            <line id="scene3-curve-b3" x1="396" y1="280" x2="580" y2="120" stroke="#c62828" stroke-width="2.5" opacity="0"/>

            <!-- 碰撞点 -->
            <circle id="scene3-point-p1" cx="212" cy="360" r="4" fill="#2e7d32" opacity="0"/>
            <circle id="scene3-point-p2" cx="396" cy="280" r="4" fill="#2e7d32" opacity="0"/>
            <circle id="scene3-point-p3" cx="580" cy="120" r="4" fill="#2e7d32" opacity="0"/>

            <!-- 碰撞点标签 -->
            <text id="scene3-label-p1" x="195" y="348" font-size="14" fill="#2e7d32" opacity="0">P₁</text>
            <text id="scene3-label-p2" x="375" y="268" font-size="14" fill="#2e7d32" opacity="0">P₂</text>
            <text id="scene3-label-p3" x="540" y="108" font-size="14" fill="#2e7d32" opacity="0">P₃</text>

            <!-- 位移增量标签 (放在曲线bbox安全区) -->
            <text id="scene3-delta-L" x="160" y="340" font-size="14" fill="#1565c0" opacity="0">+L</text>
            <text id="scene3-delta-4L" x="300" y="260" font-size="14" fill="#1565c0" opacity="0">+4L</text>
            <text id="scene3-delta-8L" x="480" y="100" font-size="14" fill="#1565c0" opacity="0">+8L</text>

            <!-- 图例 (水平排列在顶部安全区) -->
            <line id="scene3-legend-a-line" x1="500" y1="70" x2="515" y2="70" stroke="#1565c0" stroke-width="2.5"/>
            <text id="scene3-legend-a-text" x="520" y="75" font-size="14" fill="#000">A球</text>
            <line id="scene3-legend-b-line" x1="570" y1="70" x2="585" y2="70" stroke="#c62828" stroke-width="2.5"/>
            <text id="scene3-legend-b-text" x="590" y="75" font-size="14" fill="#000">B球</text>

            <!-- 顶部进程文字 (步骤4显示) -->
            <text id="scene3-top-process" x="350" y="50" font-size="16" fill="#1565c0" opacity="0">0 → L → 5L → 13L</text>

            <!-- A位移填充区 (步骤4显示) -->
            <path id="scene3-fill-1" d="M120,380 L129,380 L139,379 L148,378 L157,376 L166,375 L175,372 L184,369 L193,365 L202,360 L212,360 L212,380 Z" fill="#1565c0" opacity="0"/>
            <path id="scene3-fill-2" d="M212,380 L230,359 L249,357 L267,353 L286,347 L304,340 L322,331 L341,321 L359,309 L378,295 L396,280 L396,380 Z" fill="#1565c0" opacity="0"/>
            <path id="scene3-fill-3" d="M396,380 L414,271 L433,261 L451,249 L470,235 L488,220 L506,203 L525,185 L543,165 L562,143 L580,120 L580,380 Z" fill="#1565c0" opacity="0"/>

            <!-- 右侧数据区 -->
            <text id="scene3-right-title" x="700" y="90" font-size="16" fill="#000" text-anchor="middle">位移规律</text>
            <line id="scene3-right-sep" x1="620" y1="100" x2="780" y2="100" stroke="#000" stroke-width="1"/>

            <text id="scene3-s1" x="700" y="140" font-size="14" fill="#000" text-anchor="middle" opacity="0">s₁ = L</text>
            <text id="scene3-s2" x="700" y="180" font-size="14" fill="#000" text-anchor="middle" opacity="0">s₂ = 4L</text>
            <text id="scene3-s3" x="700" y="220" font-size="14" fill="#000" text-anchor="middle" opacity="0">s₃ = 8L</text>
            <text id="scene3-total" x="700" y="260" font-size="14" fill="#000" text-anchor="middle" opacity="0">总位移 = 13L</text>
            <text id="scene3-s4" x="700" y="260" font-size="14" fill="#000" text-anchor="middle" opacity="0">s₄ = 12L, …</text>

            <!-- 公式框 (步骤5显示) -->
            <foreignObject id="scene3-formula-box" x="620" y="300" width="160" height="70" opacity="0">
                <div xmlns="http://www.w3.org/1999/xhtml" style="width:156px;height:66px;background:#e8f5e9;border:2px solid #2e7d32;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:13px;font-family:'Microsoft YaHei','PingFang SC',sans-serif;color:#000;text-align:center;padding:2px;">
                    xₐ = (2n² − 2n + 1)L
                </div>
            </foreignObject>
        </svg>

        <div id="scene3-controls">
            <button id="scene3-btn-prev" disabled>◀ 上一步</button>
            <span id="scene3-step-indicator">步骤 1 / 6</span>
            <button id="scene3-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const totalSteps = 6;

        const btnPrev = document.getElementById('scene3-btn-prev');
        const btnNext = document.getElementById('scene3-btn-next');
        const stepIndicator = document.getElementById('scene3-step-indicator');

        const els = {
            curveA1: document.getElementById('scene3-curve-a1'),
            curveA2: document.getElementById('scene3-curve-a2'),
            curveA3: document.getElementById('scene3-curve-a3'),
            curveB1: document.getElementById('scene3-curve-b1'),
            curveB2: document.getElementById('scene3-curve-b2'),
            curveB3: document.getElementById('scene3-curve-b3'),
            pointP1: document.getElementById('scene3-point-p1'),
            pointP2: document.getElementById('scene3-point-p2'),
            pointP3: document.getElementById('scene3-point-p3'),
            labelP1: document.getElementById('scene3-label-p1'),
            labelP2: document.getElementById('scene3-label-p2'),
            labelP3: document.getElementById('scene3-label-p3'),
            deltaL: document.getElementById('scene3-delta-L'),
            delta4L: document.getElementById('scene3-delta-4L'),
            delta8L: document.getElementById('scene3-delta-8L'),
            dashP2: document.getElementById('scene3-dash-p2'),
            dashP3: document.getElementById('scene3-dash-p3'),
            topProcess: document.getElementById('scene3-top-process'),
            fill1: document.getElementById('scene3-fill-1'),
            fill2: document.getElementById('scene3-fill-2'),
            fill3: document.getElementById('scene3-fill-3'),
            s1: document.getElementById('scene3-s1'),
            s2: document.getElementById('scene3-s2'),
            s3: document.getElementById('scene3-s3'),
            total: document.getElementById('scene3-total'),
            s4: document.getElementById('scene3-s4'),
            formulaBox: document.getElementById('scene3-formula-box'),
            txtL: document.getElementById('scene3-txt-L'),
            txt5L: document.getElementById('scene3-txt-5L'),
            txt13L: document.getElementById('scene3-txt-13L'),
        };

        function setOpacity(el, val) {
            if (el) el.setAttribute('opacity', val);
        }
        function setStrokeWidth(el, val) {
            if (el) el.setAttribute('stroke-width', val);
        }
        function setClass(el, cls, add) {
            if (!el) return;
            if (add) el.classList.add(cls);
            else el.classList.remove(cls);
        }

        function updateStep(step) {
            currentStep = step;
            stepIndicator.textContent = '步骤 ' + (currentStep + 1) + ' / ' + totalSteps;
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps - 1;

            setOpacity(els.curveA1, 0);
            setOpacity(els.curveA2, 0);
            setOpacity(els.curveA3, 0);
            setOpacity(els.curveB1, 0);
            setOpacity(els.curveB2, 0);
            setOpacity(els.curveB3, 0);
            setOpacity(els.pointP1, 0);
            setOpacity(els.pointP2, 0);
            setOpacity(els.pointP3, 0);
            setOpacity(els.labelP1, 0);
            setOpacity(els.labelP2, 0);
            setOpacity(els.labelP3, 0);
            setOpacity(els.deltaL, 0);
            setOpacity(els.delta4L, 0);
            setOpacity(els.delta8L, 0);
            setOpacity(els.dashP2, 0);
            setOpacity(els.dashP3, 0);
            setOpacity(els.topProcess, 0);
            setOpacity(els.fill1, 0);
            setOpacity(els.fill2, 0);
            setOpacity(els.fill3, 0);
            setOpacity(els.s1, 0);
            setOpacity(els.s2, 0);
            setOpacity(els.s3, 0);
            setOpacity(els.total, 0);
            setOpacity(els.s4, 0);
            setOpacity(els.formulaBox, 0);

            setStrokeWidth(els.curveA1, 2.5);
            setStrokeWidth(els.curveA2, 2.5);
            setStrokeWidth(els.curveA3, 2.5);
            setStrokeWidth(els.curveB1, 2.5);
            setStrokeWidth(els.curveB2, 2.5);
            setStrokeWidth(els.curveB3, 2.5);

            els.txtL.removeAttribute('class');
            els.txt5L.removeAttribute('class');
            els.txt13L.removeAttribute('class');

            if (step >= 1) {
                setOpacity(els.curveA1, 1);
                setOpacity(els.curveB1, 1);
                setOpacity(els.pointP1, 1);
                setOpacity(els.labelP1, 1);
                setOpacity(els.deltaL, 1);
                setOpacity(els.s1, 1);
            }
            if (step >= 2) {
                setOpacity(els.curveA2, 1);
                setOpacity(els.curveB2, 1);
                setOpacity(els.pointP2, 1);
                setOpacity(els.labelP2, 1);
                setOpacity(els.delta4L, 1);
                setOpacity(els.s2, 1);
            }
            if (step >= 3) {
                setOpacity(els.curveA3, 1);
                setOpacity(els.curveB3, 1);
                setOpacity(els.pointP3, 1);
                setOpacity(els.labelP3, 1);
                setOpacity(els.delta8L, 1);
                setOpacity(els.s3, 1);
            }
            if (step >= 4) {
                setStrokeWidth(els.curveA1, 3.5);
                setStrokeWidth(els.curveA2, 3.5);
                setStrokeWidth(els.curveA3, 3.5);
                setOpacity(els.fill1, 0.1);
                setOpacity(els.fill2, 0.1);
                setOpacity(els.fill3, 0.1);
                setOpacity(els.topProcess, 1);
                setOpacity(els.dashP2, 1);
                setOpacity(els.dashP3, 1);
                setOpacity(els.total, 1);
                setClass(els.txtL, 'scene3-highlight-text', true);
                setClass(els.txt5L, 'scene3-highlight-text', true);
                setClass(els.txt13L, 'scene3-highlight-text', true);
            }
            if (step >= 5) {
                setStrokeWidth(els.curveA1, 2.5);
                setStrokeWidth(els.curveA2, 2.5);
                setStrokeWidth(els.curveA3, 2.5);
                setOpacity(els.topProcess, 0);
                setOpacity(els.total, 0);
                setOpacity(els.s4, 1);
                setOpacity(els.formulaBox, 1);
            }
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) updateStep(currentStep - 1);
        });
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) updateStep(currentStep + 1);
        });

        updateStep(0);
    })();
    </script>
</body>
</html>
