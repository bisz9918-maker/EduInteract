<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 带电粒子在磁场中的圆周运动</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene2-controls button {
            padding: 6px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc;
            border-radius: 4px; background: #f5f5f5; transition: background 0.2s;
        }
        #scene2-controls button:hover { background: #e0e0e0; }
        #scene2-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene2-step-indicator { font-size: 14px; color: #333; min-width: 80px; text-align: center; }
        #scene2-formula-panel {
            position: absolute; right: 20px; top: 50px; width: 280px; min-height: 350px;
            background: rgba(255,255,255,0.95); border: 1px solid #e0e0e0; border-radius: 6px;
            padding: 16px; font-size: 14px; line-height: 1.8; color: #333; z-index: 5;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .scene2-fade-in { animation: scene2FadeIn 0.3s ease-in; }
        @keyframes scene2FadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div id="scene2-container">
        <!-- SVG 图示区：固定 800×500px -->
        <svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500" style="position:absolute; top:0; left:0;">
            <defs>
                <!-- 黑色箭头 -->
                <marker id="scene2-arrowhead-black" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
                </marker>
                <!-- 红色箭头 -->
                <marker id="scene2-arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#c62828"/>
                </marker>
            </defs>

            <!-- ========== 步骤0：基础元素（始终显示） ========== -->
            <!-- 上极板 -->
            <line x1="80" y1="55" x2="200" y2="55" stroke="#000000" stroke-width="2"/>
            <!-- 下极板 -->
            <line x1="80" y1="95" x2="200" y2="95" stroke="#000000" stroke-width="2"/>
            <!-- 正极标签 -->
            <text x="90" y="45" font-size="14" fill="#000000" text-anchor="middle">+</text>
            <!-- 负极标签 -->
            <text x="90" y="110" font-size="14" fill="#000000" text-anchor="middle">−</text>
            <!-- 电源连线（虚线） -->
            <line x1="140" y1="30" x2="140" y2="55" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
            <line x1="140" y1="95" x2="140" y2="120" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>

            <!-- 磁场矩形 -->
            <rect x="200" y="120" width="280" height="200" fill="#e3f2fd" fill-opacity="0.2" stroke="#000000" stroke-width="1" stroke-dasharray="4,4"/>

            <!-- 磁场点阵（垂直纸面向外） -->
            <g id="scene2-field-dots">
                <circle cx="220" cy="140" r="2" fill="#1565c0"/><circle cx="260" cy="140" r="2" fill="#1565c0"/>
                <circle cx="300" cy="140" r="2" fill="#1565c0"/><circle cx="340" cy="140" r="2" fill="#1565c0"/>
                <circle cx="380" cy="140" r="2" fill="#1565c0"/><circle cx="420" cy="140" r="2" fill="#1565c0"/>
                <circle cx="460" cy="140" r="2" fill="#1565c0"/>
                <circle cx="220" cy="180" r="2" fill="#1565c0"/><circle cx="260" cy="180" r="2" fill="#1565c0"/>
                <circle cx="300" cy="180" r="2" fill="#1565c0"/><circle cx="340" cy="180" r="2" fill="#1565c0"/>
                <circle cx="380" cy="180" r="2" fill="#1565c0"/><circle cx="420" cy="180" r="2" fill="#1565c0"/>
                <circle cx="460" cy="180" r="2" fill="#1565c0"/>
                <circle cx="220" cy="220" r="2" fill="#1565c0"/><circle cx="260" cy="220" r="2" fill="#1565c0"/>
                <circle cx="300" cy="220" r="2" fill="#1565c0"/><circle cx="340" cy="220" r="2" fill="#1565c0"/>
                <circle cx="380" cy="220" r="2" fill="#1565c0"/><circle cx="420" cy="220" r="2" fill="#1565c0"/>
                <circle cx="460" cy="220" r="2" fill="#1565c0"/>
                <circle cx="220" cy="260" r="2" fill="#1565c0"/><circle cx="260" cy="260" r="2" fill="#1565c0"/>
                <circle cx="300" cy="260" r="2" fill="#1565c0"/><circle cx="340" cy="260" r="2" fill="#1565c0"/>
                <circle cx="380" cy="260" r="2" fill="#1565c0"/><circle cx="420" cy="260" r="2" fill="#1565c0"/>
                <circle cx="460" cy="260" r="2" fill="#1565c0"/>
                <circle cx="220" cy="300" r="2" fill="#1565c0"/><circle cx="260" cy="300" r="2" fill="#1565c0"/>
                <circle cx="300" cy="300" r="2" fill="#1565c0"/><circle cx="340" cy="300" r="2" fill="#1565c0"/>
                <circle cx="380" cy="300" r="2" fill="#1565c0"/><circle cx="420" cy="300" r="2" fill="#1565c0"/>
                <circle cx="460" cy="300" r="2" fill="#1565c0"/>
            </g>

            <!-- 顶点标签 -->
            <text x="188" y="118" font-size="14" fill="#000000" text-anchor="end" dominant-baseline="middle">M</text>
            <text x="485" y="118" font-size="14" fill="#000000" text-anchor="start" dominant-baseline="middle">N</text>
            <text x="188" y="318" font-size="14" fill="#000000" text-anchor="end" dominant-baseline="middle">P</text>
            <text x="485" y="318" font-size="14" fill="#000000" text-anchor="start" dominant-baseline="middle">Q</text>

            <!-- 边界名称 -->
            <text x="340" y="110" font-size="14" fill="#000000" text-anchor="middle" dominant-baseline="auto">MN</text>
            <text x="160" y="240" font-size="14" fill="#000000" text-anchor="end" dominant-baseline="middle">MP</text>
            <text x="340" y="330" font-size="14" fill="#000000" text-anchor="middle" dominant-baseline="hanging">PQ</text>

            <!-- 宽度d标注 -->
            <line x1="500" y1="120" x2="500" y2="320" stroke="#000000" stroke-width="1"/>
            <line x1="495" y1="120" x2="505" y2="120" stroke="#000000" stroke-width="1"/>
            <line x1="495" y1="320" x2="505" y2="320" stroke="#000000" stroke-width="1"/>
            <text x="510" y="220" font-size="14" fill="#000000" text-anchor="start" dominant-baseline="middle">d</text>

            <!-- 入射速度v箭头 -->
            <line x1="200" y1="120" x2="248" y2="148" stroke="#000000" stroke-width="2" marker-end="url(#scene2-arrowhead-black)"/>
            <text x="270" y="105" font-size="14" fill="#000000" text-anchor="start" dominant-baseline="middle">v</text>

            <!-- 入射角30°弧线 -->
            <path d="M 222 120 A 22 22 0 0 1 219.1 130.9" stroke="#1565c0" stroke-width="1" fill="none"/>
            <text x="220" y="105" font-size="14" fill="#1565c0" text-anchor="start" dominant-baseline="middle">30°</text>

            <!-- ========== 步骤1：圆心定位 ========== -->
            <g id="scene2-step1-group" style="display:none; opacity:0;">
                <!-- 洛伦兹力F箭头 -->
                <line x1="200" y1="120" x2="178" y2="159" stroke="#c62828" stroke-width="2" marker-end="url(#scene2-arrowhead-red)"/>
                <text x="100" y="225" font-size="14" fill="#c62828" text-anchor="end" dominant-baseline="middle">F</text>
                <!-- 圆心O -->
                <circle cx="140" cy="224" r="4" fill="#c62828"/>
                <text x="128" y="285" font-size="14" fill="#c62828" text-anchor="end" dominant-baseline="middle">O</text>
                <!-- MO半径线 -->
                <line x1="140" y1="224" x2="200" y2="120" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
                <text x="240" y="105" font-size="14" fill="#888888" text-anchor="start" dominant-baseline="middle">R</text>
                <!-- MO与竖直方向30°角弧 -->
                <path d="M 200 102 A 18 18 0 0 0 188.5 111.4" stroke="#1565c0" stroke-width="1" fill="none"/>
                <text x="160" y="100" font-size="14" fill="#1565c0" text-anchor="end" dominant-baseline="middle">30°</text>
            </g>

            <!-- ========== 步骤2：轨迹绘制 ========== -->
            <g id="scene2-step2-group" style="display:none; opacity:0;">
                <!-- 圆弧轨迹（步骤2画到约30°） -->
                <path id="scene2-arc-traj" d="M 200 120 A 120 120 0 0 1 244 284" stroke="#2e7d32" stroke-width="2.5" fill="none"/>
            </g>

            <!-- ========== 步骤3：几何分析 ========== -->
            <g id="scene2-step3-group" style="display:none; opacity:0;">
                <!-- 辅助垂线 -->
                <line x1="140" y1="120" x2="140" y2="224" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
                <line x1="140" y1="224" x2="200" y2="224" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
                <line x1="140" y1="224" x2="140" y2="320" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
                <!-- R√3/2标注 -->
                <line x1="125" y1="120" x2="125" y2="224" stroke="#000000" stroke-width="1"/>
                <line x1="120" y1="120" x2="130" y2="120" stroke="#000000" stroke-width="1"/>
                <line x1="120" y1="224" x2="130" y2="224" stroke="#000000" stroke-width="1"/>
                <text x="105" y="172" font-size="13" fill="#000000" text-anchor="end" dominant-baseline="middle">R√3/2</text>
                <!-- R/2标注 -->
                <line x1="140" y1="234" x2="200" y2="234" stroke="#000000" stroke-width="1"/>
                <line x1="140" y1="229" x2="140" y2="239" stroke="#000000" stroke-width="1"/>
                <line x1="200" y1="229" x2="200" y2="239" stroke="#000000" stroke-width="1"/>
                <text x="170" y="248" font-size="13" fill="#000000" text-anchor="middle" dominant-baseline="hanging">R/2</text>
                <!-- d-R√3/2标注 -->
                <line x1="125" y1="224" x2="125" y2="320" stroke="#000000" stroke-width="1"/>
                <line x1="120" y1="224" x2="130" y2="224" stroke="#000000" stroke-width="1"/>
                <line x1="120" y1="320" x2="130" y2="320" stroke="#000000" stroke-width="1"/>
                <text x="100" y="272" font-size="13" fill="#000000" text-anchor="end" dominant-baseline="middle">d−R√3/2</text>
            </g>

            <!-- ========== 步骤4：边界讨论 ========== -->
            <g id="scene2-step4-group" style="display:none; opacity:0;">
                <!-- 轨迹延伸到射出点S(212,320) -->
                <path id="scene2-arc-traj-full" d="M 200 120 A 120 120 0 0 1 212 320" stroke="#2e7d32" stroke-width="2.5" fill="none"/>
                <!-- 射出点S -->
                <circle cx="212" cy="320" r="4" fill="#c62828"/>
                <text x="220" y="335" font-size="14" fill="#c62828" text-anchor="start" dominant-baseline="middle">S</text>
                <!-- 延伸虚轨迹（情况A示意） -->
                <path id="scene2-arc-ext" d="M 212 320 A 120 120 0 0 1 200 327.9" stroke="#2e7d32" stroke-width="1" stroke-dasharray="4,4" fill="none" opacity="0.4"/>
                <!-- 临界参考P点 -->
                <circle cx="200" cy="320" r="3" fill="#f9a825"/>
            </g>

            <!-- ========== 步骤5：公式求解（无新增图形，保持步骤4状态） ========== -->
        </svg>

        <!-- 推导面板 -->
        <div id="scene2-formula-panel"></div>

        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-btn-prev">◀ 上一步</button>
            <span id="scene2-step-indicator">步骤 0/5</span>
            <button id="scene2-btn-next">下一步 ▶</button>
            <button id="scene2-btn-reset">重置</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2 实现
        let currentStep = 0;
        const totalSteps = 6; // 步骤0~5

        const panel = document.getElementById('scene2-formula-panel');
        const indicator = document.getElementById('scene2-step-indicator');
        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        const btnReset = document.getElementById('scene2-btn-reset');

        // 各步骤推导面板内容
        const stepContents = [
            "正离子以速度 v 从 M 点射入磁场，与水平方向成 30° 角。磁场方向垂直纸面向外，区域宽度为 d。",
            "左手定则：正电荷，v 向右下，B 垂直向外，洛伦兹力 F 垂直 v 指向左下方。圆心 O 位于 M 点沿 F 方向距离 R 处。",
            "洛伦兹力提供向心力，离子做匀速圆周运动。<br>qvB = mv²/R<br>半径 R = mv/(qB)",
            "几何关系：<br>O 到 MN 距离 = R·cos30° = R√3/2<br>O 到 MP 距离 = R·sin30° = R/2<br>O 到 PQ 距离 = d − R√3/2",
            "边界讨论：<br>若 R√3 < d：从左边界 MP 射出<br>若 R√3 > d：从下边界 PQ 射出（本例）<br>若 R√3 = d：轨迹恰好过 P 点（临界）",
            "qvB = mv²/R  →  R = mv/(qB)<br>代入几何边界条件（本例：R√3 > d）<br>联立求解磁感应强度 B。"
        ];

        function show(el) {
            el.style.display = 'block';
            el.style.opacity = '1';
        }
        function hide(el) {
            el.style.display = 'none';
            el.style.opacity = '0';
        }

        function renderStep() {
            // 更新指示器
            indicator.textContent = '步骤 ' + currentStep + '/' + (totalSteps - 1);
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps - 1);

            // 更新推导面板
            panel.innerHTML = stepContents[currentStep];

            // 获取各步骤组
            const g1 = document.getElementById('scene2-step1-group');
            const g2 = document.getElementById('scene2-step2-group');
            const g3 = document.getElementById('scene2-step3-group');
            const g4 = document.getElementById('scene2-step4-group');

            // 步骤0：只显示基础元素
            if (currentStep === 0) {
                hide(g1); hide(g2); hide(g3); hide(g4);
            }
            // 步骤1：显示步骤1元素
            else if (currentStep === 1) {
                show(g1); hide(g2); hide(g3); hide(g4);
                g1.classList.add('scene2-fade-in');
                setTimeout(() => g1.classList.remove('scene2-fade-in'), 300);
            }
            // 步骤2：显示步骤1+2元素
            else if (currentStep === 2) {
                show(g1); show(g2); hide(g3); hide(g4);
                g2.classList.add('scene2-fade-in');
                setTimeout(() => g2.classList.remove('scene2-fade-in'), 300);
            }
            // 步骤3：显示步骤1+2+3元素
            else if (currentStep === 3) {
                show(g1); show(g2); show(g3); hide(g4);
                g3.classList.add('scene2-fade-in');
                setTimeout(() => g3.classList.remove('scene2-fade-in'), 300);
            }
            // 步骤4：显示步骤1+3+4元素（步骤2的短轨迹被步骤4的完整轨迹替代）
            else if (currentStep === 4) {
                show(g1); hide(g2); show(g3); show(g4);
                g4.classList.add('scene2-fade-in');
                setTimeout(() => g4.classList.remove('scene2-fade-in'), 300);
            }
            // 步骤5：保持步骤4的图形状态
            else if (currentStep === 5) {
                show(g1); hide(g2); show(g3); show(g4);
            }
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) { currentStep--; renderStep(); }
        });
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) { currentStep++; renderStep(); }
        });
        btnReset.addEventListener('click', function() {
            currentStep = 0; renderStep();
        });

        // 初始渲染
        renderStep();
    })();
    </script>
</body>
</html>
