<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 重合面积函数图象</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene2-controls button {
            padding: 8px 18px; font-size: 14px; cursor: pointer; border: 1px solid #333;
            background: #f5f5f5; border-radius: 4px; min-width: 100px; height: 36px;
        }
        #scene2-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene2-step-indicator { font-size: 13px; color: #555; min-width: 80px; text-align: center; }
        .hidden { display: none; }
        /* 步骤4绿色曲线描绘动画 */
        .draw-anim {
            stroke-dasharray: 500;
            stroke-dashoffset: 500;
            animation: draw 600ms ease forwards;
        }
        @keyframes draw {
            to { stroke-dashoffset: 0; }
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                    <path d="M0,0 L8,3 L0,6 Z" fill="#000"/>
                </marker>
            </defs>

            <!-- ========== A 区域 ========== -->
            <g id="scene2-graph-A">
                <!-- 坐标轴 -->
                <line x1="70" y1="175" x2="340" y2="175" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
                <line x1="70" y1="175" x2="70" y2="35" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
                <!-- 曲线：线性三角 -->
                <polyline points="70,175 205,45 340,175" fill="none" stroke="#000" stroke-width="1.5"/>
                <!-- 标签 -->
                <text x="205" y="42" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">A</text>
                <text x="55" y="34" text-anchor="middle" font-size="12" fill="#000">S</text>
                <text x="350" y="195" text-anchor="start" font-size="12" fill="#000">t</text>
                <text x="60" y="192" text-anchor="middle" font-size="12" fill="#000">O</text>
            </g>

            <!-- ========== B 区域 ========== -->
            <g id="scene2-graph-B">
                <line x1="460" y1="175" x2="730" y2="175" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
                <line x1="460" y1="175" x2="460" y2="35" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
                <!-- 曲线：光滑二次贝塞尔 -->
                <path d="M460,175 Q595,40 730,175" fill="none" stroke="#000" stroke-width="1.5"/>
                <!-- 标签 -->
                <text x="595" y="42" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">B</text>
                <text x="445" y="34" text-anchor="middle" font-size="12" fill="#000">S</text>
                <text x="735" y="190" text-anchor="start" font-size="12" fill="#000">t</text>
                <text x="450" y="188" text-anchor="middle" font-size="12" fill="#000">O</text>
            </g>

            <!-- ========== C 区域 ========== -->
            <g id="scene2-graph-C">
                <line x1="70" y1="385" x2="340" y2="385" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
                <line x1="70" y1="385" x2="70" y2="245" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
                <!-- 曲线：梯形折线 -->
                <polyline points="70,385 140,245 270,245 340,385" fill="none" stroke="#000" stroke-width="1.5"/>
                <!-- 标签 -->
                <text x="205" y="232" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">C</text>
                <text x="55" y="238" text-anchor="middle" font-size="12" fill="#000">S</text>
                <text x="345" y="400" text-anchor="start" font-size="12" fill="#000">t</text>
                <text x="60" y="398" text-anchor="middle" font-size="12" fill="#000">O</text>
            </g>

            <!-- ========== D 区域 ========== -->
            <g id="scene2-graph-D">
                <line x1="460" y1="385" x2="730" y2="385" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
                <line x1="460" y1="385" x2="460" y2="245" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
                <!-- 曲线：尖峰三次贝塞尔（调整至D区域内） -->
                <path d="M460,385 C480,350 520,320 595,300 C670,320 710,350 730,385" fill="none" stroke="#000" stroke-width="1.5"/>
                <!-- 标签 -->
                <text x="595" y="232" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">D</text>
                <text x="445" y="238" text-anchor="middle" font-size="12" fill="#000">S</text>
                <text x="735" y="400" text-anchor="start" font-size="12" fill="#000">t</text>
                <text x="450" y="398" text-anchor="middle" font-size="12" fill="#000">O</text>
            </g>

            <!-- ========== 步骤1：排除A的动态元素 ========== -->
            <g id="scene2-step1-group" class="hidden">
                <!-- A 遮罩（不覆盖标签区域） -->
                <rect id="scene2-mask-A" x="30" y="45" width="350" height="135" fill="rgba(198,40,40,0.15)" stroke="none"/>
                <!-- 红色批注 -->
                <text id="scene2-label-linear" x="205" y="195" text-anchor="middle" font-size="13" fill="#c62828" font-weight="bold">线性增长错误</text>
            </g>

            <!-- ========== 步骤2：排除C的动态元素 ========== -->
            <g id="scene2-step2-group" class="hidden">
                <!-- C 遮罩（高度140，底部382，与O标签顶部保持间距） -->
                <rect id="scene2-mask-C" x="30" y="242" width="350" height="140" fill="rgba(198,40,40,0.15)" stroke="none"/>
                <!-- 红色叉号 -->
                <g id="scene2-cross-C" stroke="#c62828" stroke-width="2" stroke-linecap="round">
                    <line x1="170" y1="285" x2="240" y2="355"/>
                    <line x1="240" y1="285" x2="170" y2="355"/>
                </g>
                <!-- 红色批注 -->
                <text id="scene2-label-platform" x="205" y="405" text-anchor="middle" font-size="13" fill="#c62828" font-weight="bold">不存在平台期</text>
            </g>

            <!-- ========== 步骤3：排除D的动态元素 ========== -->
            <g id="scene2-step3-group" class="hidden">
                <!-- D 遮罩（高度140，底部382） -->
                <rect id="scene2-mask-D" x="420" y="242" width="350" height="140" fill="rgba(198,40,40,0.15)" stroke="none"/>
                <!-- 红色批注 S'(0)≠0 -->
                <text id="scene2-label-slope" x="500" y="400" text-anchor="middle" font-size="13" fill="#c62828" font-weight="bold">S'(0)≠0</text>
                <!-- 起点红色斜切线 -->
                <line id="scene2-tangent-D" x1="460" y1="385" x2="500" y2="340" stroke="#c62828" stroke-width="1.8" stroke-linecap="round"/>
                <!-- 峰值红色尖角 -->
                <polyline id="scene2-peak-D" points="565,330 595,300 625,330" fill="none" stroke="#c62828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                <!-- 红色批注 顶部尖锐 -->
                <text id="scene2-label-sharp" x="650" y="400" text-anchor="middle" font-size="13" fill="#c62828" font-weight="bold">顶部尖锐</text>
            </g>

            <!-- ========== 步骤4：确认B的动态元素 ========== -->
            <g id="scene2-step4-group" class="hidden">
                <!-- B 蓝色高亮边框（用4条线代替rect，避免bounding box与文字重叠） -->
                <line id="scene2-border-B-top" x1="417" y1="17" x2="773" y2="17" stroke="#1565c0" stroke-width="3" stroke-linecap="round"/>
                <line id="scene2-border-B-right" x1="773" y1="17" x2="773" y2="193" stroke="#1565c0" stroke-width="3" stroke-linecap="round"/>
                <line id="scene2-border-B-bottom" x1="773" y1="193" x2="417" y2="193" stroke="#1565c0" stroke-width="3" stroke-linecap="round"/>
                <line id="scene2-border-B-left" x1="417" y1="193" x2="417" y2="17" stroke="#1565c0" stroke-width="3" stroke-linecap="round"/>
                <!-- 绿色确认曲线（叠加在B原曲线上） -->
                <path id="scene2-curve-green" d="M460,175 Q595,40 730,175" fill="none" stroke="#2e7d32" stroke-width="3" class="draw-anim"/>
                <!-- 绿色对勾 -->
                <polyline id="scene2-check-B" points="720,50 735,65 760,35" fill="none" stroke="#2e7d32" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                <!-- 绿色批注（左移避免与D标签拥挤） -->
                <text id="scene2-label-correct" x="480" y="205" text-anchor="middle" font-size="13" fill="#2e7d32" font-weight="bold">光滑 · 对称 · 水平相切</text>
                <text id="scene2-label-round" x="670" y="205" text-anchor="middle" font-size="13" fill="#2e7d32" font-weight="bold">顶部圆滑</text>
            </g>
        </svg>

        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-btn-prev">◀ 上一步</button>
            <span id="scene2-step-indicator">步骤 0/4</span>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2 实现
        let currentStep = 0;
        const maxStep = 4;

        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        const indicator = document.getElementById('scene2-step-indicator');

        const stepGroups = [
            null, // step 0 has no dynamic group
            document.getElementById('scene2-step1-group'),
            document.getElementById('scene2-step2-group'),
            document.getElementById('scene2-step3-group'),
            document.getElementById('scene2-step4-group')
        ];

        function updateUI() {
            // 更新指示器
            indicator.textContent = '步骤 ' + currentStep + '/4';
            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === maxStep);
            // 控制各步骤组的显隐
            for (let i = 1; i <= maxStep; i++) {
                if (stepGroups[i]) {
                    if (i <= currentStep) {
                        stepGroups[i].classList.remove('hidden');
                        stepGroups[i].style.display = 'inline';
                    } else {
                        stepGroups[i].classList.add('hidden');
                        stepGroups[i].style.display = 'none';
                    }
                }
            }
            // 步骤4动画重触发：先隐藏再显示以重启动画
            if (currentStep === 4) {
                const greenCurve = document.getElementById('scene2-curve-green');
                if (greenCurve) {
                    greenCurve.classList.remove('draw-anim');
                    void greenCurve.offsetWidth; // 强制重排
                    greenCurve.classList.add('draw-anim');
                }
            }
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateUI();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < maxStep) {
                currentStep++;
                updateUI();
            }
        });

        // 初始化
        updateUI();
    })();
    </script>
</body>
</html>
