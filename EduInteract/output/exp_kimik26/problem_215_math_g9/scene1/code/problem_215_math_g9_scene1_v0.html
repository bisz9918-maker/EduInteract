<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 1 - 正方形一线三垂直模型</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Times New Roman", serif, sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-controls button { padding: 6px 14px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: #f5f5f5; }
        #scene1-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 14px; color: #333; min-width: 70px; text-align: center; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <!-- 坐标表参考
                正方形顶点: A(400,280), B(366,385), C(471,419), D(505,314)
                直线a: (295,354) 到 (487,219)
                垂足: E(454,242), F(328,331)
            -->

            <!-- 直线a（两端延伸） -->
            <line id="scene1-line-a" x1="295" y1="354" x2="487" y2="219" stroke="#000000" stroke-width="2"/>

            <!-- 正方形ABCD -->
            <line id="scene1-square-ab" x1="400" y1="280" x2="366" y2="385" stroke="#000000" stroke-width="2"/>
            <line id="scene1-square-bc" x1="366" y1="385" x2="471" y2="419" stroke="#000000" stroke-width="2"/>
            <line id="scene1-square-cd" x1="471" y1="419" x2="505" y2="314" stroke="#000000" stroke-width="2"/>
            <line id="scene1-square-da" x1="505" y1="314" x2="400" y2="280" stroke="#000000" stroke-width="2"/>

            <!-- 垂线段DE -->
            <line id="scene1-de" x1="505" y1="314" x2="454" y2="242" stroke="#000000" stroke-width="2"/>
            <!-- 垂线段BF -->
            <line id="scene1-bf" x1="366" y1="385" x2="328" y2="331" stroke="#000000" stroke-width="2"/>

            <!-- 直角符号 ∠DAB -->
            <path id="scene1-right-dab" d="M 408 276 L 403 285 L 394 280" fill="none" stroke="#000000" stroke-width="1"/>
            <!-- 直角符号 ∠AED -->
            <path id="scene1-right-aed" d="M 462 236 L 452 248 L 440 242" fill="none" stroke="#000000" stroke-width="1"/>
            <!-- 直角符号 ∠BFA -->
            <path id="scene1-right-bfa" d="M 336 325 L 335 332 L 328 333" fill="none" stroke="#000000" stroke-width="1"/>

            <!-- 步骤2：角度弧 -->
            <path id="scene1-arc-dae" d="M 418 267 A 22 22 0 0 0 421 293" fill="none" stroke="#1565c0" stroke-width="2" style="display:none"/>
            <path id="scene1-arc-baf" d="M 392 307 A 28 28 0 0 1 377 263" fill="none" stroke="#c62828" stroke-width="2" style="display:none"/>
            <path id="scene1-arc-ade" d="M 487 301 A 22 22 0 0 1 492 329" fill="none" stroke="#2e7d32" stroke-width="2" style="display:none"/>

            <!-- 步骤3：三角形填充 -->
            <polygon id="scene1-fill-ade" points="400,280 505,314 454,242" fill="#1565c0" fill-opacity="0.2" style="display:none"/>
            <polygon id="scene1-fill-baf" points="366,385 400,280 328,331" fill="#c62828" fill-opacity="0.2" style="display:none"/>

            <!-- 步骤3：对应顶点虚线 -->
            <line id="scene1-dash-db" x1="505" y1="314" x2="366" y2="385" stroke="#888888" stroke-width="1.5" stroke-dasharray="6,4" style="display:none"/>
            <line id="scene1-dash-ef" x1="449" y1="236" x2="323" y2="325" stroke="#888888" stroke-width="1.5" stroke-dasharray="6,4" style="display:none"/>

            <!-- 步骤4：结论EF高亮 -->
            <line id="scene1-highlight-ef" x1="454" y1="242" x2="328" y2="331" stroke="#2e7d32" stroke-width="4" style="display:none"/>

            <!-- 顶点标签 -->
            <text id="scene1-label-a" x="390" y="210" font-size="16" fill="#000000" font-family="Times New Roman, serif">A</text>
            <text id="scene1-label-b" x="340" y="410" font-size="16" fill="#000000" font-family="Times New Roman, serif">B</text>
            <text id="scene1-label-c" x="480" y="435" font-size="16" fill="#000000" font-family="Times New Roman, serif">C</text>
            <text id="scene1-label-d" x="520" y="290" font-size="16" fill="#000000" font-family="Times New Roman, serif">D</text>
            <text id="scene1-label-e" x="470" y="220" font-size="16" fill="#000000" font-family="Times New Roman, serif">E</text>
            <text id="scene1-label-f" x="260" y="380" font-size="16" fill="#000000" font-family="Times New Roman, serif">F</text>
            <text id="scene1-label-a-line" x="510" y="200" font-size="16" fill="#000000" font-family="Times New Roman, serif" font-style="italic">a</text>

            <!-- 步骤0：长度标注（始终显示） -->
            <text id="scene1-de-val" x="560" y="230" font-size="14" fill="#000000" font-family="Times New Roman, serif">DE=4</text>
            <text id="scene1-bf-val" x="250" y="445" font-size="14" fill="#000000" font-family="Times New Roman, serif">BF=3</text>

            <!-- 步骤2：角度标签和等式 -->
            <text id="scene1-angle1" x="440" y="190" font-size="14" fill="#1565c0" font-family="Times New Roman, serif" style="display:none">∠1</text>
            <text id="scene1-angle2" x="180" y="460" font-size="14" fill="#c62828" font-family="Times New Roman, serif" style="display:none">∠2</text>
            <text id="scene1-angle3" x="600" y="260" font-size="14" fill="#2e7d32" font-family="Times New Roman, serif" style="display:none">∠3</text>
            <text id="scene1-eq1" x="520" y="370" font-size="14" fill="#000000" font-family="Times New Roman, serif" style="display:none">∠1+∠3=90°</text>
            <text id="scene1-eq2" x="230" y="200" font-size="14" fill="#000000" font-family="Times New Roman, serif" style="display:none">∠1+∠2=90°</text>
            <text id="scene1-deduce" x="560" y="200" font-size="14" fill="#000000" font-family="Times New Roman, serif" style="display:none">∴ ∠2=∠3</text>

            <!-- 步骤3：边长标注和全等 -->
            <text id="scene1-ae-val" x="650" y="220" font-size="14" fill="#000000" font-family="Times New Roman, serif" style="display:none">AE=3</text>
            <text id="scene1-af-val" x="250" y="240" font-size="14" fill="#000000" font-family="Times New Roman, serif" style="display:none">AF=4</text>
            <text id="scene1-congruent" x="545" y="320" font-size="16" fill="#000000" font-family="Times New Roman, serif" style="display:none">△ADE ≌ △BAF (AAS)</text>

            <!-- 步骤4：结论 -->
            <text id="scene1-ef-val" x="340" y="185" font-size="14" fill="#2e7d32" font-family="Times New Roman, serif" font-weight="bold" style="display:none">EF=7</text>
            <text id="scene1-answer1" x="540" y="410" font-size="16" fill="#2e7d32" font-family="Times New Roman, serif" font-weight="bold" style="display:none">EF = AE + AF = 7</text>
            <text id="scene1-answer2" x="540" y="440" font-size="16" fill="#2e7d32" font-family="Times New Roman, serif" font-weight="bold" style="display:none">选 C</text>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/5</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        let currentStep = 0;
        const totalSteps = 5;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');

        // 直角符号元素
        const rightDab = document.getElementById('scene1-right-dab');
        const rightAed = document.getElementById('scene1-right-aed');
        const rightBfa = document.getElementById('scene1-right-bfa');

        // 步骤2元素
        const step2Elements = [
            'scene1-arc-dae', 'scene1-arc-baf', 'scene1-arc-ade',
            'scene1-angle1', 'scene1-angle2', 'scene1-angle3',
            'scene1-eq1', 'scene1-eq2', 'scene1-deduce'
        ].map(function(id) { return document.getElementById(id); });

        // 步骤3元素
        const step3Elements = [
            'scene1-fill-ade', 'scene1-fill-baf',
            'scene1-dash-db', 'scene1-dash-ef',
            'scene1-ae-val', 'scene1-af-val', 'scene1-congruent'
        ].map(function(id) { return document.getElementById(id); });

        // 步骤4元素
        const step4Elements = [
            'scene1-highlight-ef', 'scene1-ef-val',
            'scene1-answer1', 'scene1-answer2'
        ].map(function(id) { return document.getElementById(id); });

        function setDisplay(elements, show) {
            elements.forEach(function(el) {
                if (el) el.style.display = show ? 'inline' : 'none';
            });
        }

        function renderStep() {
            stepIndicator.textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps - 1;

            // 步骤1：直角高亮（加粗直角符号）
            if (currentStep >= 1) {
                rightDab.setAttribute('stroke-width', '3');
                rightAed.setAttribute('stroke-width', '3');
                rightBfa.setAttribute('stroke-width', '3');
            } else {
                rightDab.setAttribute('stroke-width', '1');
                rightAed.setAttribute('stroke-width', '1');
                rightBfa.setAttribute('stroke-width', '1');
            }

            // 步骤2：角度弧和等式
            setDisplay(step2Elements, currentStep >= 2);

            // 步骤3：三角形填充、虚线、边长标注、全等
            setDisplay(step3Elements, currentStep >= 3);

            // 步骤4：EF高亮、结论
            setDisplay(step4Elements, currentStep >= 4);
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                renderStep();
            }
        });

        // 初始渲染
        renderStep();
    })();
    </script>
</body>
</html>
