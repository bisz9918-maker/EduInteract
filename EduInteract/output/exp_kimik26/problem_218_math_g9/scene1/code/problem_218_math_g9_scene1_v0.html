<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双三角板角度推导 - 场景1</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 16px; z-index: 10; }
        #scene1-controls button {
            padding: 6px 18px; font-size: 14px; cursor: pointer; border: 1px solid #ccc;
            border-radius: 4px; background: #f5f5f5; transition: background 0.2s;
        }
        #scene1-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene1-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 14px; color: #333; min-width: 70px; text-align: center; }

        /* 公式区样式 */
        .scene1-formula { font-size: 15px; opacity: 0; transition: opacity 0.4s ease; }
        .scene1-formula.show { opacity: 1; }
        .scene1-answer-box {
            fill: #e3f2fd; stroke: #1565c0; stroke-width: 1.5px; rx: 4; ry: 4;
            opacity: 0; transition: opacity 0.4s ease;
        }
        .scene1-answer-box.show { opacity: 1; }
        .scene1-answer-text {
            font-size: 17px; font-weight: bold; fill: #1565c0;
            opacity: 0; transition: opacity 0.4s ease;
        }
        .scene1-answer-text.show { opacity: 1; }

        /* 高亮填充过渡 */
        .scene1-fill { opacity: 0; transition: opacity 0.4s ease; }
        .scene1-fill.show { opacity: 1; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- ===== 基础图形（步骤0始终显示） ===== -->
            <!-- 三角形ABC边线 -->
            <line id="scene1-seg-ab" x1="182" y1="178" x2="382" y2="160" stroke="#000" stroke-width="2"/>
            <line id="scene1-seg-bc" x1="182" y1="178" x2="400" y2="360" stroke="#000" stroke-width="2"/>
            <line id="scene1-seg-ca" x1="400" y1="360" x2="382" y2="160" stroke="#000" stroke-width="2"/>

            <!-- 三角形EDF边线 -->
            <line id="scene1-seg-ed" x1="172" y1="360" x2="389" y2="234" stroke="#000" stroke-width="2"/>
            <line id="scene1-seg-df" x1="389" y1="234" x2="462" y2="360" stroke="#000" stroke-width="2"/>
            <line id="scene1-seg-ef" x1="172" y1="360" x2="462" y2="360" stroke="#000" stroke-width="2"/>

            <!-- 顶点标签 -->
            <text id="scene1-lbl-a" x="392" y="145" font-size="15" fill="#000" font-weight="bold">A</text>
            <text id="scene1-lbl-b" x="168" y="165" font-size="15" fill="#000" font-weight="bold">B</text>
            <text id="scene1-lbl-c" x="400" y="382" font-size="15" fill="#000" font-weight="bold" text-anchor="middle">C</text>
            <text id="scene1-lbl-d" x="400" y="222" font-size="15" fill="#000" font-weight="bold">D</text>
            <text id="scene1-lbl-e" x="160" y="382" font-size="15" fill="#000" font-weight="bold" text-anchor="middle">E</text>
            <text id="scene1-lbl-f" x="470" y="382" font-size="15" fill="#000" font-weight="bold" text-anchor="middle">F</text>

            <!-- 直角符号 A -->
            <path id="scene1-rt-a" d="M 372.0 160.9 L 372.9 170.9 L 382.9 170.0" fill="none" stroke="#000" stroke-width="1.2"/>
            <!-- 直角符号 D -->
            <path id="scene1-rt-d" d="M 380.4 239.0 L 385.4 247.7 L 394.0 242.7" fill="none" stroke="#000" stroke-width="1.2"/>

            <!-- ===== 步骤1 元素（已知条件标注） ===== -->
            <g id="scene1-group-step1" style="display:none; opacity:0;">
                <!-- 填充 -->
                <polygon id="scene1-fill-abc" class="scene1-fill" points="182,178 382,160 400,360" fill="rgba(21,101,192,0.15)"/>
                <polygon id="scene1-fill-edf" class="scene1-fill" points="172,360 389,234 462,360" fill="rgba(198,40,40,0.15)"/>

                <!-- 等长标记 AB -->
                <line x1="281.5" y1="163.0" x2="282.5" y2="175.0" stroke="#000" stroke-width="1.5"/>
                <!-- 等长标记 AC -->
                <line x1="385.0" y1="260.5" x2="397.0" y2="259.5" stroke="#000" stroke-width="1.5"/>

                <!-- AB=AC 标签 -->
                <text x="270" y="140" font-size="13" fill="#000" text-anchor="middle">AB=AC</text>

                <!-- 直角标注 -->
                <text x="355" y="155" font-size="12" fill="#1565c0">90°</text>
                <text x="425" y="215" font-size="12" fill="#c62828">90°</text>

                <!-- ∠E=30° 弧 -->
                <path d="M 202,360 A 30,30 0 0,0 197.9,344.9" fill="none" stroke="#c62828" stroke-width="2"/>
                <text x="155" y="325" font-size="13" fill="#c62828" font-weight="bold">30°</text>

                <!-- ∠F=60° 弧 -->
                <path d="M 432,360 A 30,30 0 0,1 447.2,333.9" fill="none" stroke="#c62828" stroke-width="2"/>
                <text x="480" y="325" font-size="13" fill="#c62828" font-weight="bold">60°</text>

                <!-- ∠BCE=40° 弧 -->
                <path d="M 370,360 A 30,30 0 0,1 377.0,340.7" fill="none" stroke="#c62828" stroke-width="2"/>
                <text x="310" y="375" font-size="13" fill="#c62828" font-weight="bold">40°</text>
            </g>

            <!-- ===== 步骤2 元素（∠ACB=45°） ===== -->
            <g id="scene1-group-step2" style="display:none; opacity:0;">
                <!-- ABC 加深填充 -->
                <polygon id="scene1-fill-abc2" class="scene1-fill" points="182,178 382,160 400,360" fill="rgba(21,101,192,0.25)"/>

                <!-- ∠ACB=45° 弧 -->
                <path d="M 373.2,337.5 A 35,35 0 0,1 396.9,325.1" fill="none" stroke="#1565c0" stroke-width="2.5"/>
                <text x="360" y="375" font-size="13" fill="#1565c0" font-weight="bold">45°</text>

                <!-- 公式 -->
                <text id="scene1-formula-step2" class="scene1-formula" x="640" y="180" fill="#1565c0">∠ACB = (180°−90°)/2 = 45°</text>
            </g>

            <!-- ===== 步骤3 元素（∠ACF=95°） ===== -->
            <g id="scene1-group-step3" style="display:none; opacity:0;">
                <!-- ECF 虚线高亮 -->
                <line x1="172" y1="360" x2="462" y2="360" stroke="#888" stroke-width="1.5" stroke-dasharray="6,4"/>

                <!-- ∠ACF=95° 弧（大弧，绿） -->
                <path d="M 430,360 A 30,30 0 0,0 397.4,330.1" fill="none" stroke="#2e7d32" stroke-width="2.5"/>
                <text x="500" y="260" font-size="13" fill="#2e7d32" font-weight="bold">95°</text>

                <!-- 公式 -->
                <text id="scene1-formula-step3" class="scene1-formula" x="640" y="240" fill="#2e7d32">∠ACF = 180°−40°−45° = 95°</text>
            </g>

            <!-- ===== 步骤4 元素（∠CDF=25° 结论） ===== -->
            <g id="scene1-group-step4" style="display:none; opacity:0;">
                <!-- △CDF 填充 -->
                <polygon id="scene1-fill-cdf" class="scene1-fill" points="400,360 389,234 462,360" fill="rgba(46,125,50,0.20)"/>

                <!-- ∠CDF=25° 弧（蓝，加粗） -->
                <path d="M 391.2,258.9 A 25,25 0 0,1 401.5,255.6" fill="none" stroke="#1565c0" stroke-width="3"/>
                <text x="540" y="280" font-size="13" fill="#1565c0" font-weight="bold">25°</text>

                <!-- 公式 -->
                <text id="scene1-formula-step4" class="scene1-formula" x="640" y="300" fill="#1565c0">∠CDF = 180°−60°−95° = 25°</text>

                <!-- 答案框 -->
                <rect id="scene1-answer-box" class="scene1-answer-box" x="635" y="350" width="130" height="32"/>
                <text id="scene1-answer-text" class="scene1-answer-text" x="700" y="372" text-anchor="middle">B．25°</text>
            </g>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 0/4</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        var currentStep = 0;
        var maxStep = 4;

        var btnPrev = document.getElementById('scene1-btn-prev');
        var btnNext = document.getElementById('scene1-btn-next');
        var indicator = document.getElementById('scene1-step-indicator');

        var groupStep1 = document.getElementById('scene1-group-step1');
        var groupStep2 = document.getElementById('scene1-group-step2');
        var groupStep3 = document.getElementById('scene1-group-step3');
        var groupStep4 = document.getElementById('scene1-group-step4');

        var segAB = document.getElementById('scene1-seg-ab');
        var segBC = document.getElementById('scene1-seg-bc');
        var segCA = document.getElementById('scene1-seg-ca');
        var segED = document.getElementById('scene1-seg-ed');
        var segDF = document.getElementById('scene1-seg-df');
        var segEF = document.getElementById('scene1-seg-ef');

        function setStep(n) {
            if (n < 0 || n > maxStep) return;
            currentStep = n;
            indicator.textContent = '步骤 ' + currentStep + '/4';
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === maxStep);
            renderStep(currentStep);
        }

        function showGroup(el) {
            if (!el) return;
            el.style.display = 'block';
            requestAnimationFrame(function() {
                el.style.opacity = '1';
            });
        }

        function hideGroup(el) {
            if (!el) return;
            el.style.opacity = '0';
            setTimeout(function() {
                if (parseFloat(el.style.opacity) < 0.1) {
                    el.style.display = 'none';
                }
            }, 400);
        }

        function resetStrokes() {
            segAB.setAttribute('stroke', '#000'); segAB.setAttribute('stroke-width', '2');
            segBC.setAttribute('stroke', '#000'); segBC.setAttribute('stroke-width', '2');
            segCA.setAttribute('stroke', '#000'); segCA.setAttribute('stroke-width', '2');
            segED.setAttribute('stroke', '#000'); segED.setAttribute('stroke-width', '2');
            segDF.setAttribute('stroke', '#000'); segDF.setAttribute('stroke-width', '2');
            segEF.setAttribute('stroke', '#000'); segEF.setAttribute('stroke-width', '2');
        }

        function highlightABC(color, width) {
            segAB.setAttribute('stroke', color); segAB.setAttribute('stroke-width', width);
            segBC.setAttribute('stroke', color); segBC.setAttribute('stroke-width', width);
            segCA.setAttribute('stroke', color); segCA.setAttribute('stroke-width', width);
        }

        function highlightEDF(color, width) {
            segED.setAttribute('stroke', color); segED.setAttribute('stroke-width', width);
            segDF.setAttribute('stroke', color); segDF.setAttribute('stroke-width', width);
            segEF.setAttribute('stroke', color); segEF.setAttribute('stroke-width', width);
        }

        function renderStep(step) {
            resetStrokes();
            hideGroup(groupStep1);
            hideGroup(groupStep2);
            hideGroup(groupStep3);
            hideGroup(groupStep4);

            if (step >= 1) {
                showGroup(groupStep1);
                highlightABC('#1565c0', '2.5');
                highlightEDF('#c62828', '2.5');
            }
            if (step >= 2) {
                showGroup(groupStep2);
                highlightABC('#1565c0', '2.5');
                highlightEDF('#c62828', '2.5');
            }
            if (step >= 3) {
                showGroup(groupStep3);
                highlightABC('#1565c0', '2.5');
                highlightEDF('#c62828', '2.5');
            }
            if (step >= 4) {
                showGroup(groupStep4);
                highlightABC('#1565c0', '2.5');
                highlightEDF('#c62828', '2.5');
            }
        }

        btnPrev.addEventListener('click', function() { setStep(currentStep - 1); });
        btnNext.addEventListener('click', function() { setStep(currentStep + 1); });

        setStep(0);
    })();
    </script>
</body>
</html>
