<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 原电池-电解池串联装置</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene2-controls button {
            padding: 6px 16px; font-size: 14px; cursor: pointer; border: 1px solid #333;
            background: #f5f5f5; border-radius: 4px; min-width: 80px;
        }
        #scene2-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene2-step-indicator { font-size: 13px; color: #666; min-width: 60px; text-align: center; }
        .scene2-hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <!-- SVG 图示区：仅几何图形，无文字 -->
        <svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <!-- ===== 左侧：原电池（烧杯+稀硫酸+Zn+Cu） ===== -->
            <rect id="scene2-beaker-liquid" x="100" y="100" width="120" height="140" fill="#e3f2fd" fill-opacity="0.25" stroke="none"/>
            <path id="scene2-beaker" d="M100,100 L100,230 Q100,240 110,240 L210,240 Q220,240 220,230 L220,100" fill="none" stroke="#000000" stroke-width="1.5"/>
            <line id="scene2-liquid-surface" x1="100" y1="100" x2="220" y2="100" stroke="#000000" stroke-width="1"/>
            <rect id="scene2-zn-rod" x="130" y="60" width="15" height="160" fill="#aaaaaa" stroke="#000000" stroke-width="1"/>
            <rect id="scene2-cu-rod" x="185" y="60" width="15" height="160" fill="#b87333" stroke="#000000" stroke-width="1"/>

            <!-- ===== 右侧：电解池（滤纸+a+b） ===== -->
            <ellipse id="scene2-filter-paper" cx="570" cy="170" rx="110" ry="65" fill="#fafafa" stroke="#333333" stroke-width="1.5" stroke-dasharray="4,3"/>
            <rect id="scene2-rod-a" x="510" y="60" width="15" height="160" fill="#333333" stroke="#000000" stroke-width="1"/>
            <rect id="scene2-rod-b" x="630" y="60" width="15" height="160" fill="#333333" stroke="#000000" stroke-width="1"/>

            <!-- ===== 导线 ===== -->
            <polyline id="scene2-wire-zn-b" points="137,55 137,30 637,30 637,55" fill="none" stroke="#000000" stroke-width="2"/>
            <polyline id="scene2-wire-cu-a" points="192,55 192,45 517,45 517,55" fill="none" stroke="#000000" stroke-width="2"/>

            <!-- ===== 气泡 ===== -->
            <circle id="scene2-bubble-cu" cx="210" cy="90" r="7" fill="#90caf9" fill-opacity="0.6" class="scene2-hidden"/>
            <circle id="scene2-bubble-a" cx="500" cy="90" r="7" fill="#cddc39" fill-opacity="0.6" class="scene2-hidden"/>
            <circle id="scene2-bubble-b" cx="655" cy="90" r="7" fill="#90caf9" fill-opacity="0.6" class="scene2-hidden"/>

            <!-- ===== 引线（指向 HTML 反应框顶部） ===== -->
            <g id="scene2-lead-zn" class="scene2-hidden">
                <polyline points="130,68 60,55 60,295 105,295" fill="none" stroke="#999999" stroke-width="1.5"/>
            </g>
            <g id="scene2-lead-cu" class="scene2-hidden">
                <polyline points="200,68 270,55 270,295 295,295" fill="none" stroke="#999999" stroke-width="1.5"/>
            </g>
            <g id="scene2-lead-a" class="scene2-hidden">
                <polyline points="510,68 450,55 450,295 485,295" fill="none" stroke="#999999" stroke-width="1.5"/>
            </g>
            <g id="scene2-lead-b" class="scene2-hidden">
                <polyline points="645,68 720,55 720,295 685,295" fill="none" stroke="#999999" stroke-width="1.5"/>
            </g>

            <!-- ===== 步骤4：D选项特写图形 ===== -->
            <g id="scene2-closeup-group" class="scene2-hidden">
                <ellipse cx="400" cy="350" rx="130" ry="55" fill="url(#scene2-phenolphthalein-gradient)" stroke="#333333" stroke-width="1.5" stroke-dasharray="4,3"/>
                <rect x="395" y="290" width="10" height="70" fill="#333333" stroke="#000000" stroke-width="1"/>
            </g>

            <!-- 渐变定义 -->
            <defs>
                <radialGradient id="scene2-phenolphthalein-gradient" cx="430" cy="350" r="80" gradientUnits="userSpaceOnUse">
                    <stop offset="0%" stop-color="#ffcdd2" stop-opacity="0.5"/>
                    <stop offset="60%" stop-color="#ffcdd2" stop-opacity="0.2"/>
                    <stop offset="100%" stop-color="#ffcdd2" stop-opacity="0"/>
                </radialGradient>
            </defs>
        </svg>

        <!-- HTML 文字与卡片覆盖层 -->
        <div id="scene2-overlay" style="position: absolute; top: 0; left: 0; width: 800px; height: 500px; pointer-events: none;">
            <!-- 标题 -->
            <div style="position: absolute; top: 8px; left: 0; right: 0; text-align: center; font-size: 16px; font-weight: bold; color: #000; line-height: 20px;">原电池-电解池串联装置分析</div>

            <!-- 电极标签 -->
            <div style="position: absolute; left: 127px; top: 36px; width: 20px; text-align: center; font-size: 14px; color: #000;">Zn</div>
            <div style="position: absolute; left: 182px; top: 36px; width: 20px; text-align: center; font-size: 14px; color: #000;">Cu</div>
            <div style="position: absolute; left: 507px; top: 36px; width: 20px; text-align: center; font-size: 14px; color: #000;">a</div>
            <div style="position: absolute; left: 627px; top: 36px; width: 20px; text-align: center; font-size: 14px; color: #000;">b</div>

            <!-- 容器标签 -->
            <div style="position: absolute; left: 130px; top: 248px; width: 60px; text-align: center; font-size: 13px; color: #000;">稀硫酸</div>
            <div style="position: absolute; left: 490px; top: 248px; width: 160px; text-align: center; font-size: 12px; color: #000;">用饱和食盐水浸湿的滤纸</div>

            <!-- 步骤1：原电池反应框 -->
            <div id="scene2-html-rxn-zn" class="scene2-hidden" style="position: absolute; left: 20px; top: 295px; width: 170px; height: 55px; border: 1.5px solid #c62828; border-radius: 4px; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #c62828;">Zn − 2e⁻ → Zn²⁺</div>
            <div id="scene2-html-rxn-zn-tag" class="scene2-hidden" style="position: absolute; left: 20px; top: 355px; width: 170px; text-align: center; font-size: 13px; color: #c62828;">氧化</div>

            <div id="scene2-html-rxn-cu" class="scene2-hidden" style="position: absolute; left: 210px; top: 295px; width: 170px; height: 55px; border: 1.5px solid #2e7d32; border-radius: 4px; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #2e7d32;">2H⁺ + 2e⁻ → H₂↑</div>
            <div id="scene2-html-rxn-cu-tag" class="scene2-hidden" style="position: absolute; left: 210px; top: 355px; width: 170px; text-align: center; font-size: 13px; color: #2e7d32;">还原</div>

            <!-- 步骤2：电解池反应框 -->
            <div id="scene2-html-rxn-a" class="scene2-hidden" style="position: absolute; left: 400px; top: 295px; width: 170px; height: 55px; border: 1.5px solid #c62828; border-radius: 4px; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #c62828;">2Cl⁻ − 2e⁻ → Cl₂↑</div>
            <div id="scene2-html-rxn-a-tag" class="scene2-hidden" style="position: absolute; left: 400px; top: 355px; width: 170px; text-align: center; font-size: 13px; color: #c62828;">氧化</div>

            <div id="scene2-html-rxn-b" class="scene2-hidden" style="position: absolute; left: 590px; top: 295px; width: 190px; height: 55px; border: 1.5px solid #2e7d32; border-radius: 4px; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #2e7d32;">2H₂O + 2e⁻ → H₂↑ + 2OH⁻</div>
            <div id="scene2-html-rxn-b-tag" class="scene2-hidden" style="position: absolute; left: 590px; top: 355px; width: 190px; text-align: center; font-size: 13px; color: #2e7d32;">还原</div>

            <!-- 步骤3：选项卡片 -->
            <div id="scene2-html-opt-a" class="scene2-hidden" style="position: absolute; left: 40px; top: 300px; width: 165px; height: 45px; border: 1.5px solid #c62828; border-radius: 4px; background: #fff; display: flex; align-items: center; padding: 0 8px; box-sizing: border-box; font-size: 12px; color: #000;">
                <span style="flex: 1; line-height: 1.2;">A．a为阳极，发生氧化反应</span>
                <span style="font-size: 16px; color: #c62828; font-weight: bold; margin-left: 4px;">×</span>
            </div>
            <div id="scene2-html-opt-a-reason" class="scene2-hidden" style="position: absolute; left: 40px; top: 350px; width: 165px; text-align: center; font-size: 11px; color: #c62828;">锌被氧化而非还原</div>

            <div id="scene2-html-opt-b" class="scene2-hidden" style="position: absolute; left: 225px; top: 300px; width: 165px; height: 45px; border: 1.5px solid #c62828; border-radius: 4px; background: #fff; display: flex; align-items: center; padding: 0 8px; box-sizing: border-box; font-size: 12px; color: #000;">
                <span style="flex: 1; line-height: 1.2;">B．电子流动：锌→b→a→铜</span>
                <span style="font-size: 16px; color: #c62828; font-weight: bold; margin-left: 4px;">×</span>
            </div>
            <div id="scene2-html-opt-b-reason" class="scene2-hidden" style="position: absolute; left: 225px; top: 350px; width: 165px; text-align: center; font-size: 11px; color: #c62828;">电子不经过溶液</div>

            <div id="scene2-html-opt-c" class="scene2-hidden" style="position: absolute; left: 410px; top: 300px; width: 165px; height: 45px; border: 1.5px solid #c62828; border-radius: 4px; background: #fff; display: flex; align-items: center; padding: 0 8px; box-sizing: border-box; font-size: 12px; color: #000;">
                <span style="flex: 1; line-height: 1.2;">C．0.2mol电子→2.24L气体</span>
                <span style="font-size: 16px; color: #c62828; font-weight: bold; margin-left: 4px;">×</span>
            </div>
            <div id="scene2-html-opt-c-reason" class="scene2-hidden" style="position: absolute; left: 410px; top: 350px; width: 165px; text-align: center; font-size: 11px; color: #c62828;">未指明标准状况</div>

            <div id="scene2-html-opt-d" class="scene2-hidden" style="position: absolute; left: 595px; top: 300px; width: 165px; height: 45px; border: 1.5px solid #2e7d32; border-radius: 4px; background: #fff; display: flex; align-items: center; padding: 0 8px; box-sizing: border-box; font-size: 12px; color: #000;">
                <span style="flex: 1; line-height: 1.2;">D．b极附近酚酞变红</span>
                <span style="font-size: 16px; color: #2e7d32; font-weight: bold; margin-left: 4px;">✓</span>
            </div>
            <div id="scene2-html-opt-d-reason" class="scene2-hidden" style="position: absolute; left: 595px; top: 350px; width: 165px; text-align: center; font-size: 11px; color: #2e7d32;">b极附近OH⁻↑，酚酞变红</div>

            <!-- 步骤4：D选项特写文字 -->
            <div id="scene2-html-closeup-oh" class="scene2-hidden" style="position: absolute; left: 545px; top: 330px; font-size: 16px; color: #1565c0; font-weight: bold;">OH⁻</div>
            <div id="scene2-html-closeup-note" class="scene2-hidden" style="position: absolute; left: 545px; top: 355px; font-size: 13px; color: #000;">碱性增强 → 酚酞变红</div>
            <div id="scene2-html-closeup-label" class="scene2-hidden" style="position: absolute; left: 340px; top: 415px; width: 120px; text-align: center; font-size: 13px; color: #000;">饱和食盐水滤纸</div>
        </div>

        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-btn-prev" onclick="scene2PrevStep()">◀ 上一步</button>
            <span id="scene2-step-indicator">步骤 1/5</span>
            <button id="scene2-btn-next" onclick="scene2NextStep()">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2 实现
        let currentStep = 0;
        const totalSteps = 5;

        // SVG 元素引用
        const el = {
            bubbleCu: document.getElementById('scene2-bubble-cu'),
            bubbleA: document.getElementById('scene2-bubble-a'),
            bubbleB: document.getElementById('scene2-bubble-b'),
            leadZn: document.getElementById('scene2-lead-zn'),
            leadCu: document.getElementById('scene2-lead-cu'),
            leadA: document.getElementById('scene2-lead-a'),
            leadB: document.getElementById('scene2-lead-b'),
            closeup: document.getElementById('scene2-closeup-group'),
            znRod: document.getElementById('scene2-zn-rod'),
            cuRod: document.getElementById('scene2-cu-rod'),
            rodA: document.getElementById('scene2-rod-a'),
            rodB: document.getElementById('scene2-rod-b'),
            btnPrev: document.getElementById('scene2-btn-prev'),
            btnNext: document.getElementById('scene2-btn-next'),
            indicator: document.getElementById('scene2-step-indicator'),
            // HTML 覆盖层元素
            rxnZn: document.getElementById('scene2-html-rxn-zn'),
            rxnZnTag: document.getElementById('scene2-html-rxn-zn-tag'),
            rxnCu: document.getElementById('scene2-html-rxn-cu'),
            rxnCuTag: document.getElementById('scene2-html-rxn-cu-tag'),
            rxnA: document.getElementById('scene2-html-rxn-a'),
            rxnATag: document.getElementById('scene2-html-rxn-a-tag'),
            rxnB: document.getElementById('scene2-html-rxn-b'),
            rxnBTag: document.getElementById('scene2-html-rxn-b-tag'),
            optA: document.getElementById('scene2-html-opt-a'),
            optAReason: document.getElementById('scene2-html-opt-a-reason'),
            optB: document.getElementById('scene2-html-opt-b'),
            optBReason: document.getElementById('scene2-html-opt-b-reason'),
            optC: document.getElementById('scene2-html-opt-c'),
            optCReason: document.getElementById('scene2-html-opt-c-reason'),
            optD: document.getElementById('scene2-html-opt-d'),
            optDReason: document.getElementById('scene2-html-opt-d-reason'),
            closeupOh: document.getElementById('scene2-html-closeup-oh'),
            closeupNote: document.getElementById('scene2-html-closeup-note'),
            closeupLabel: document.getElementById('scene2-html-closeup-label')
        };

        function show(elem) {
            if (elem) elem.classList.remove('scene2-hidden');
        }
        function hide(elem) {
            if (elem) elem.classList.add('scene2-hidden');
        }
        function setStroke(elem, color, width) {
            if (elem) {
                elem.setAttribute('stroke', color);
                elem.setAttribute('stroke-width', width);
            }
        }
        function resetStroke(elem) {
            if (elem) {
                elem.setAttribute('stroke', '#000000');
                elem.setAttribute('stroke-width', '1');
            }
        }

        function renderStep() {
            // 更新指示器
            el.indicator.textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;
            // 更新按钮状态
            el.btnPrev.disabled = (currentStep <= 0);
            el.btnNext.disabled = (currentStep >= totalSteps - 1);

            // 先隐藏所有动态元素
            hide(el.bubbleCu); hide(el.bubbleA); hide(el.bubbleB);
            hide(el.leadZn); hide(el.leadCu); hide(el.leadA); hide(el.leadB);
            hide(el.rxnZn); hide(el.rxnZnTag);
            hide(el.rxnCu); hide(el.rxnCuTag);
            hide(el.rxnA); hide(el.rxnATag);
            hide(el.rxnB); hide(el.rxnBTag);
            hide(el.optA); hide(el.optAReason);
            hide(el.optB); hide(el.optBReason);
            hide(el.optC); hide(el.optCReason);
            hide(el.optD); hide(el.optDReason);
            hide(el.closeup);
            hide(el.closeupOh); hide(el.closeupNote); hide(el.closeupLabel);
            resetStroke(el.znRod); resetStroke(el.cuRod);
            resetStroke(el.rodA); resetStroke(el.rodB);

            switch (currentStep) {
                case 0:
                    // 步骤0：仅装置简图
                    break;
                case 1:
                    // 步骤1：原电池反应
                    show(el.leadZn); show(el.leadCu);
                    show(el.rxnZn); show(el.rxnZnTag);
                    show(el.rxnCu); show(el.rxnCuTag);
                    show(el.bubbleCu);
                    setStroke(el.znRod, '#c62828', '3');
                    setStroke(el.cuRod, '#2e7d32', '3');
                    break;
                case 2:
                    // 步骤2：电解池反应（保留步骤1）
                    show(el.leadZn); show(el.leadCu);
                    show(el.leadA); show(el.leadB);
                    show(el.rxnZn); show(el.rxnZnTag);
                    show(el.rxnCu); show(el.rxnCuTag);
                    show(el.rxnA); show(el.rxnATag);
                    show(el.rxnB); show(el.rxnBTag);
                    show(el.bubbleCu); show(el.bubbleA); show(el.bubbleB);
                    setStroke(el.znRod, '#c62828', '3');
                    setStroke(el.cuRod, '#2e7d32', '3');
                    setStroke(el.rodA, '#c62828', '3');
                    setStroke(el.rodB, '#2e7d32', '3');
                    break;
                case 3:
                    // 步骤3：选项分析
                    show(el.optA); show(el.optAReason);
                    show(el.optB); show(el.optBReason);
                    show(el.optC); show(el.optCReason);
                    show(el.optD); show(el.optDReason);
                    break;
                case 4:
                    // 步骤4：D选项特写
                    show(el.closeup);
                    show(el.closeupOh); show(el.closeupNote); show(el.closeupLabel);
                    break;
            }
        }

        window.scene2PrevStep = function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        };
        window.scene2NextStep = function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                renderStep();
            }
        };

        // 初始化
        renderStep();
    })();
    </script>
</body>
</html>
