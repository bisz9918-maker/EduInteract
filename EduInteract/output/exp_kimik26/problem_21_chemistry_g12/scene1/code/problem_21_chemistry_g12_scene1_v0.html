<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>原电池-电解池组合装置</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            padding: 6px 16px; font-size: 14px; cursor: pointer;
            border: 1px solid #cccccc; border-radius: 4px;
            background: #f5f5f5; color: #333;
        }
        #scene1-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 13px; color: #666; min-width: 80px; text-align: center; }
        .scene1-step-group { opacity: 0; transition: opacity 0.2s ease; }
        .scene1-step-group.active { opacity: 1; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- 红色箭头标记（电子流向） -->
                <marker id="scene1-arrow-red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
                    <path d="M0,0 L10,4 L0,8 Z" fill="#c62828"/>
                </marker>
                <!-- 蓝色箭头标记（离子移动） -->
                <marker id="scene1-arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                    <path d="M0,0 L8,3 L0,6 Z" fill="#1565c0"/>
                </marker>
            </defs>

            <!-- ========== 基础元素（始终显示） ========== -->
            <g id="scene1-base-group">
                <!-- 烧杯轮廓：梯形 -->
                <path d="M75,220 L225,220 L215,380 L85,380 Z" fill="#e3f2fd" stroke="#000" stroke-width="1.5"/>
                <!-- 液面线 -->
                <line x1="85" y1="220" x2="215" y2="220" stroke="#000" stroke-width="1"/>

                <!-- Zn电极 -->
                <rect x="115" y="120" width="20" height="180" fill="#aaaaaa" stroke="#000" stroke-width="1"/>
                <!-- Cu电极 -->
                <rect x="185" y="120" width="20" height="180" fill="#b87333" stroke="#000" stroke-width="1"/>

                <!-- 滤纸（椭圆） -->
                <ellipse cx="620" cy="290" rx="100" ry="65" fill="none" stroke="#000" stroke-width="1.5"/>

                <!-- 石墨棒a -->
                <rect x="565" y="140" width="18" height="160" fill="#333333" stroke="#000" stroke-width="1"/>
                <ellipse cx="574" cy="140" rx="9" ry="4" fill="#333333" stroke="#000" stroke-width="1"/>
                <!-- 石墨棒b -->
                <rect x="677" y="140" width="18" height="160" fill="#333333" stroke="#000" stroke-width="1"/>
                <ellipse cx="686" cy="140" rx="9" ry="4" fill="#333333" stroke="#000" stroke-width="1"/>

                <!-- 上导线：Zn → b，拆分为多段独立 line -->
                <line x1="125" y1="120" x2="125" y2="55" stroke="#000" stroke-width="2"/>
                <line x1="125" y1="55" x2="675" y2="55" stroke="#000" stroke-width="2"/>
                <line x1="675" y1="55" x2="675" y2="140" stroke="#000" stroke-width="2"/>
                <!-- 下导线：Cu → a，拆分为多段独立 line -->
                <line x1="195" y1="120" x2="195" y2="85" stroke="#000" stroke-width="2"/>
                <line x1="195" y1="85" x2="565" y2="85" stroke="#000" stroke-width="2"/>
                <line x1="565" y1="85" x2="565" y2="140" stroke="#000" stroke-width="2"/>

                <!-- 基础标签（位置经调整避免与图形 bounding box 重叠） -->
                <text x="65" y="210" text-anchor="end" font-size="14" fill="#000">锌</text>
                <text x="250" y="210" text-anchor="start" font-size="14" fill="#000">铜</text>
                <text x="150" y="400" text-anchor="middle" font-size="14" fill="#000">稀硫酸</text>
                <text x="555" y="125" text-anchor="end" font-size="14" fill="#000">a</text>
                <text x="700" y="125" text-anchor="start" font-size="14" fill="#000">b</text>
                <text x="620" y="375" text-anchor="middle" font-size="14" fill="#000">饱和食盐水</text>
            </g>

            <!-- ========== 步骤1：原电池判断 ========== -->
            <g id="scene1-step1-group" class="scene1-step-group" style="display:none">
                <!-- 原电池高亮（向右缩进，避免与左侧标签重叠） -->
                <rect x="95" y="120" width="140" height="260" fill="#2e7d32" fill-opacity="0.15" rx="5" stroke="none"/>
                <text x="150" y="105" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e7d32">原电池</text>
                <text x="90" y="140" text-anchor="end" font-size="14" fill="#c62828">负极(−)</text>
                <text x="90" y="160" text-anchor="end" font-size="14" fill="#c62828">氧化</text>
                <text x="240" y="140" text-anchor="start" font-size="14" fill="#2e7d32">正极(+)</text>
                <text x="240" y="160" text-anchor="start" font-size="14" fill="#2e7d32">还原</text>
            </g>

            <!-- ========== 步骤2：电解池判断 ========== -->
            <g id="scene1-step2-group" class="scene1-step-group" style="display:none">
                <!-- 电解池高亮 -->
                <ellipse cx="620" cy="290" rx="100" ry="65" fill="#1565c0" fill-opacity="0.15" stroke="none"/>
                <text x="620" y="105" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565c0">电解池</text>
                <text x="515" y="125" text-anchor="end" font-size="14" fill="#c62828">阳极</text>
                <text x="725" y="125" text-anchor="start" font-size="14" fill="#1565c0">阴极</text>
            </g>

            <!-- ========== 步骤3：电子流向 ========== -->
            <g id="scene1-step3-group" class="scene1-step-group" style="display:none">
                <!-- 上电子箭头：从左到右 -->
                <line x1="150" y1="48" x2="650" y2="48" stroke="#c62828" stroke-width="3" marker-end="url(#scene1-arrow-red)"/>
                <text x="400" y="38" text-anchor="middle" font-size="14" fill="#c62828">e⁻</text>
                <!-- 下电子箭头：从右到左 -->
                <line x1="550" y1="95" x2="210" y2="95" stroke="#c62828" stroke-width="3" marker-end="url(#scene1-arrow-red)"/>
                <text x="380" y="118" text-anchor="middle" font-size="14" fill="#c62828">e⁻</text>
            </g>

            <!-- ========== 步骤4：离子移动 ========== -->
            <g id="scene1-step4-group" class="scene1-step-group" style="display:none">
                <!-- 原电池 H⁺ 箭头：从左侧指向Cu极 -->
                <line x1="130" y1="260" x2="180" y2="260" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#scene1-arrow-blue)"/>
                <text x="60" y="260" text-anchor="end" font-size="14" fill="#1565c0">H⁺</text>
                <!-- 电解池 Cl⁻ 箭头：指向a极 -->
                <line x1="670" y1="270" x2="590" y2="270" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#scene1-arrow-blue)"/>
                <text x="500" y="270" text-anchor="end" font-size="14" fill="#1565c0">Cl⁻</text>
                <!-- 电解池 Na⁺ 箭头：指向b极 -->
                <line x1="560" y1="300" x2="665" y2="300" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#scene1-arrow-blue)"/>
                <text x="735" y="300" text-anchor="start" font-size="14" fill="#1565c0">Na⁺</text>
                <!-- 电解池 H⁺ 箭头：指向b极 -->
                <line x1="560" y1="320" x2="665" y2="320" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#scene1-arrow-blue)"/>
                <text x="735" y="320" text-anchor="start" font-size="14" fill="#1565c0">H⁺</text>
            </g>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1 / 5</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现：原电池-电解池组合装置分步导航
        var currentStep = 0;
        var totalSteps = 5;
        var btnPrev = document.getElementById('scene1-btn-prev');
        var btnNext = document.getElementById('scene1-btn-next');
        var indicator = document.getElementById('scene1-step-indicator');

        function updateControls() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps - 1;
            indicator.textContent = '步骤 ' + (currentStep + 1) + ' / ' + totalSteps;
        }

        function showGroup(id, show) {
            var el = document.getElementById(id);
            if (!el) return;
            if (show) {
                el.style.display = 'block';
                requestAnimationFrame(function() {
                    el.classList.add('active');
                });
            } else {
                el.classList.remove('active');
                el.style.display = 'none';
            }
        }

        function goToStep(step) {
            if (step < 0 || step >= totalSteps) return;
            currentStep = step;
            for (var i = 1; i <= 4; i++) {
                showGroup('scene1-step' + i + '-group', false);
            }
            for (var i = 1; i <= currentStep; i++) {
                showGroup('scene1-step' + i + '-group', true);
            }
            updateControls();
        }

        function prevStep() {
            goToStep(currentStep - 1);
        }

        function nextStep() {
            goToStep(currentStep + 1);
        }

        btnPrev.addEventListener('click', prevStep);
        btnNext.addEventListener('click', nextStep);

        goToStep(0);
    })();
    </script>
</body>
</html>
