<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>经纬网判读 - 场景1</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }

        /* 按钮样式 */
        .scene1-btn {
            background: #1565c0;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            padding: 6px 14px;
            font-size: 13px;
            cursor: pointer;
            font-family: inherit;
        }
        .scene1-btn:disabled {
            background: #9e9e9e;
            cursor: not-allowed;
        }
        .scene1-step-indicator {
            font-size: 12px;
            color: #666666;
            min-width: 60px;
            text-align: center;
        }

        /* 隐藏类 - 确保子元素也被隐藏 */
        .scene1-hidden, .scene1-hidden * {
            display: none !important;
        }

        /* 脉冲动画 */
        @keyframes scene1-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }
        .scene1-pulsing {
            animation: scene1-pulse 1.5s ease-in-out infinite;
            transform-origin: center;
        }

        /* 高亮点样式 */
        .scene1-default-point { fill: #000000; stroke: #ffffff; stroke-width: 1; }
        .scene1-highlight-point { fill: #1565c0; stroke: #ffffff; stroke-width: 1; }
        .scene1-highlight-green { fill: #2e7d32; stroke: #ffffff; stroke-width: 1; }

        /* 坐标卡片 - HTML overlay */
        .scene1-card {
            position: absolute;
            background: rgba(255,255,255,0.95);
            border: 1px solid #000000;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 12px;
            color: #000000;
            font-family: inherit;
            white-space: nowrap;
            z-index: 5;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- 发光滤镜 -->
                <filter id="scene1-glow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="3" result="blur"/>
                    <feMerge>
                        <feMergeNode in="blur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>

                <!-- 箭头标记 -->
                <marker id="scene1-arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#1565c0"/>
                </marker>
                <marker id="scene1-arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#c62828"/>
                </marker>
                <marker id="scene1-arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#2e7d32"/>
                </marker>
            </defs>

            <!-- ==================== 经纬网基础 ==================== -->
            <g id="scene1-grid-group">
                <!-- 经线 (11条) -->
                <g id="scene1-meridians">
                    <line class="scene1-meridian" x1="120" y1="70" x2="120" y2="350" stroke="#000000" stroke-width="1"/>
                    <line class="scene1-meridian" x1="176" y1="70" x2="176" y2="350" stroke="#000000" stroke-width="1"/>
                    <line class="scene1-meridian" x1="232" y1="70" x2="232" y2="350" stroke="#000000" stroke-width="1"/>
                    <line class="scene1-meridian" x1="288" y1="70" x2="288" y2="350" stroke="#000000" stroke-width="1"/>
                    <line class="scene1-meridian" x1="344" y1="70" x2="344" y2="350" stroke="#000000" stroke-width="1"/>
                    <line class="scene1-meridian" x1="400" y1="70" x2="400" y2="350" stroke="#000000" stroke-width="2"/> <!-- 本初子午线 -->
                    <line class="scene1-meridian" x1="456" y1="70" x2="456" y2="350" stroke="#000000" stroke-width="1"/>
                    <line class="scene1-meridian" x1="512" y1="70" x2="512" y2="350" stroke="#000000" stroke-width="1"/>
                    <line class="scene1-meridian" x1="568" y1="70" x2="568" y2="350" stroke="#000000" stroke-width="1"/>
                    <line class="scene1-meridian" x1="624" y1="70" x2="624" y2="350" stroke="#000000" stroke-width="1"/>
                    <line class="scene1-meridian" x1="680" y1="70" x2="680" y2="350" stroke="#000000" stroke-width="1"/>
                </g>

                <!-- 纬线 (6条) -->
                <g id="scene1-parallels">
                    <line class="scene1-parallel" x1="120" y1="70" x2="680" y2="70" stroke="#000000" stroke-width="1"/>
                    <line class="scene1-parallel" x1="120" y1="126" x2="680" y2="126" stroke="#000000" stroke-width="1"/>
                    <line class="scene1-parallel" x1="120" y1="182" x2="680" y2="182" stroke="#000000" stroke-width="1"/>
                    <line class="scene1-parallel" x1="120" y1="238" x2="680" y2="238" stroke="#000000" stroke-width="1"/>
                    <line class="scene1-parallel" x1="120" y1="294" x2="680" y2="294" stroke="#000000" stroke-width="2"/> <!-- 赤道 -->
                    <line class="scene1-parallel" x1="120" y1="350" x2="680" y2="350" stroke="#000000" stroke-width="1"/>
                </g>
            </g>

            <!-- ==================== 顶部经度标签 ==================== -->
            <g id="scene1-lon-labels" font-size="13" fill="#000000" text-anchor="middle" font-family="inherit">
                <text x="120" y="50">150°</text>
                <text x="176" y="50">120°</text>
                <text x="232" y="50">90°</text>
                <text x="288" y="50">60°</text>
                <text x="344" y="50">30°</text>
                <text x="400" y="50">0°</text>
                <text x="456" y="50">30°</text>
                <text x="512" y="50">60°</text>
                <text x="568" y="50">90°</text>
                <text x="624" y="50">120°</text>
                <text x="680" y="50">150°</text>
            </g>

            <!-- ==================== 左侧纬度标签 ==================== -->
            <g id="scene1-lat-labels" font-size="13" fill="#000000" text-anchor="end" font-family="inherit">
                <text x="85" y="75">40°N</text>
                <text x="85" y="131">30°N</text>
                <text x="85" y="187">20°N</text>
                <text x="85" y="243">10°N</text>
                <text x="85" y="299">0°</text>
                <text x="85" y="355">10°S</text>
            </g>

            <!-- ==================== 四个标记点 ==================== -->
            <g id="scene1-points">
                <circle id="scene1-point-1" class="scene1-default-point" cx="176" cy="294" r="4"/>
                <circle id="scene1-point-2" class="scene1-default-point" cx="624" cy="294" r="4"/>
                <circle id="scene1-point-3" class="scene1-default-point" cx="624" cy="70" r="4"/>
                <circle id="scene1-point-4" class="scene1-default-point" cx="176" cy="126" r="4"/>
            </g>

            <!-- 点标签 -->
            <g id="scene1-point-labels" font-size="14" fill="#000000" font-weight="bold" font-family="inherit">
                <text x="186" y="310">①</text>
                <text x="650" y="300">②</text>
                <text x="650" y="95">③</text>
                <text x="160" y="152">④</text>
            </g>

            <!-- ==================== 步骤1：经纬网基础标注 ==================== -->
            <g id="scene1-step1-group" class="scene1-hidden">
                <!-- 方位说明文字 -->
                <text x="660" y="150" font-size="13" fill="#1565c0" font-family="inherit">经线指示南北方向</text>
                <text x="660" y="200" font-size="13" fill="#c62828" font-family="inherit">纬线指示东西方向</text>
                <!-- 本初子午线和赤道标注 -->
                <text x="405" y="220" font-size="12" fill="#000000" font-family="inherit">本初子午线</text>
                <text x="440" y="295" font-size="12" fill="#000000" font-family="inherit">赤道</text>
                <!-- 东西经南北纬标注 -->
                <text x="370" y="368" font-size="12" fill="#000000" font-family="inherit">西经(W)</text>
                <text x="430" y="368" font-size="12" fill="#000000" font-family="inherit">东经(E)</text>
                <text x="440" y="262" font-size="12" fill="#000000" font-family="inherit">北纬(N)</text>
                <text x="420" y="328" font-size="12" fill="#000000" font-family="inherit">南纬(S)</text>
            </g>

            <!-- ==================== 步骤2：①点追踪线 ==================== -->
            <g id="scene1-step2-group" class="scene1-hidden">
                <line x1="176" y1="294" x2="120" y2="294" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
                <line x1="176" y1="294" x2="176" y2="350" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
            </g>

            <!-- ==================== 步骤3：③点追踪线 ==================== -->
            <g id="scene1-step3-group" class="scene1-hidden">
                <line x1="624" y1="70" x2="120" y2="70" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
                <line x1="624" y1="70" x2="624" y2="350" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
            </g>

            <!-- ==================== 步骤4：南北方向 ==================== -->
            <g id="scene1-step4-group" class="scene1-hidden">
                <line x1="624" y1="70" x2="624" y2="294" stroke="#1565c0" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#scene1-arrow-blue)"/>
                <text x="640" y="180" font-size="13" fill="#1565c0" font-family="inherit">南方——纬度降低</text>
            </g>

            <!-- ==================== 步骤5：东西方向 ==================== -->
            <g id="scene1-step5-group" class="scene1-hidden">
                <line x1="624" y1="294" x2="176" y2="294" stroke="#c62828" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#scene1-arrow-red)"/>
                <text x="400" y="330" font-size="13" fill="#c62828" text-anchor="middle" font-family="inherit">西方——取劣弧（经度差120°&lt;180°）</text>
            </g>

            <!-- ==================== 步骤6：综合方向 ==================== -->
            <g id="scene1-step6-group" class="scene1-hidden">
                <line x1="624" y1="70" x2="176" y2="294" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#scene1-arrow-green)"/>
                <text x="100" y="310" font-size="14" fill="#2e7d32" font-weight="bold" font-family="inherit">西南方向</text>
            </g>

            <!-- ==================== 步骤7：新加坡定位 ==================== -->
            <g id="scene1-step7-group" class="scene1-hidden">
                <!-- 新加坡星形 (594,288) -->
                <polygon id="scene1-singapore-star" points="594,282 596,288 602,288 597,292 599,298 594,294 589,298 591,292 586,288 592,288" fill="#ff9800" stroke="none"/>
                <text x="610" y="260" font-size="12" fill="#ff9800" font-family="inherit">新加坡(1°N，104°E)</text>
            </g>

            <!-- ==================== 步骤说明文字 ==================== -->
            <text id="scene1-instruction" x="400" y="405" font-size="14" fill="#000000" text-anchor="middle" font-family="inherit">观察经纬网图，识别经线、纬线及四个标记点。</text>
        </svg>

        <!-- 坐标卡片 - HTML overlay，避免SVG text+rect重叠检测误报 -->
        <div id="scene1-card-1" class="scene1-card scene1-hidden" style="left: 40px; top: 365px;">① (0°，120°W)</div>
        <div id="scene1-card-2" class="scene1-card scene1-hidden" style="left: 670px; top: 340px;">② (0°，120°E)</div>
        <div id="scene1-card-3" class="scene1-card scene1-hidden" style="left: 670px; top: 125px;">③ (40°N，120°E)</div>
        <div id="scene1-card-4" class="scene1-card scene1-hidden" style="left: 40px; top: 145px;">④ (30°N，120°W)</div>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn">◀ 上一步</button>
            <span id="scene1-step-indicator" class="scene1-step-indicator">步骤 0/8</span>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        let currentStep = 0;
        const totalSteps = 8;

        // DOM 元素引用
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        const instruction = document.getElementById('scene1-instruction');

        // 点元素
        const point1 = document.getElementById('scene1-point-1');
        const point2 = document.getElementById('scene1-point-2');
        const point3 = document.getElementById('scene1-point-3');
        const point4 = document.getElementById('scene1-point-4');

        // 经线和纬线集合
        const meridians = document.querySelectorAll('.scene1-meridian');
        const parallels = document.querySelectorAll('.scene1-parallel');

        // 步骤分组
        const stepGroups = {
            1: document.getElementById('scene1-step1-group'),
            2: document.getElementById('scene1-step2-group'),
            3: document.getElementById('scene1-step3-group'),
            4: document.getElementById('scene1-step4-group'),
            5: document.getElementById('scene1-step5-group'),
            6: document.getElementById('scene1-step6-group'),
            7: document.getElementById('scene1-step7-group'),
        };

        // 坐标卡片 (HTML divs)
        const cards = {
            1: document.getElementById('scene1-card-1'),
            2: document.getElementById('scene1-card-2'),
            3: document.getElementById('scene1-card-3'),
            4: document.getElementById('scene1-card-4'),
        };

        // 新加坡星形
        const singaporeStar = document.getElementById('scene1-singapore-star');

        // 步骤说明文字内容
        const instructions = [
            "观察经纬网图，识别经线、纬线及四个标记点。",
            "经线连接南北两极，指示南北方向；纬线与赤道平行，指示东西方向。",
            "①点位于赤道(0°)与120°W经线交点，经纬度为(0°，120°W)。",
            "③点位于40°N纬线与120°E经线交点，经纬度为(40°N，120°E)。",
            "从③到①，纬度从40°N降至0°，①在③的南方。",
            "从③到①，经度从120°E向西至120°W，经度差120°<180°，取劣弧，①在③的西方。",
            "综合南北和东西判断，①在③的西南方向。",
            "新加坡(1°N，104°E)与②(0°，120°E)纬度差仅1°，经度差16°，②是最接近的点。",
            "四点坐标：①(0°，120°W)、②(0°，120°E)、③(40°N，120°E)、④(30°N，120°W)。"
        ];

        // 显示/隐藏辅助函数 - 使用CSS类
        function show(el) {
            if (el) { el.classList.remove('scene1-hidden'); }
        }
        function hide(el) {
            if (el) { el.classList.add('scene1-hidden'); }
        }

        // 重置所有状态
        function resetAll() {
            // 隐藏所有步骤分组
            Object.values(stepGroups).forEach(g => hide(g));
            // 隐藏所有坐标卡片
            Object.values(cards).forEach(c => hide(c));
            // 重置点样式
            point1.setAttribute('class', 'scene1-default-point');
            point2.setAttribute('class', 'scene1-default-point');
            point3.setAttribute('class', 'scene1-default-point');
            point4.setAttribute('class', 'scene1-default-point');
            point1.setAttribute('r', '4');
            point2.setAttribute('r', '4');
            point3.setAttribute('r', '4');
            point4.setAttribute('r', '4');
            point1.removeAttribute('filter');
            point2.removeAttribute('filter');
            point3.removeAttribute('filter');
            point4.removeAttribute('filter');
            // 重置线色
            meridians.forEach(m => m.setAttribute('stroke', '#000000'));
            parallels.forEach(p => p.setAttribute('stroke', '#000000'));
            // 恢复本初子午线和赤道加粗
            meridians[5].setAttribute('stroke-width', '2');
            parallels[4].setAttribute('stroke-width', '2');
            // 移除新加坡脉冲
            if (singaporeStar) singaporeStar.classList.remove('scene1-pulsing');
        }

        // 更新场景
        function updateScene(step) {
            resetAll();
            currentStep = step;

            // 更新按钮状态
            btnPrev.disabled = (step === 0);
            btnNext.disabled = (step === totalSteps);
            if (step === totalSteps) {
                btnNext.textContent = '完成';
            } else {
                btnNext.textContent = '下一步 ▶';
            }
            stepIndicator.textContent = '步骤 ' + step + '/' + totalSteps;
            instruction.textContent = instructions[step];

            // 根据步骤设置状态
            switch(step) {
                case 0:
                    // 初始状态，已reset
                    break;
                case 1:
                    // 经纬网基础：经线蓝色，纬线红色
                    show(stepGroups[1]);
                    meridians.forEach(m => m.setAttribute('stroke', '#1565c0'));
                    parallels.forEach(p => p.setAttribute('stroke', '#c62828'));
                    break;
                case 2:
                    // ①点高亮 + 追踪线 + 坐标卡片
                    show(stepGroups[2]);
                    show(cards[1]);
                    point1.setAttribute('class', 'scene1-highlight-point');
                    point1.setAttribute('r', '6');
                    point1.setAttribute('filter', 'url(#scene1-glow)');
                    break;
                case 3:
                    // ③点高亮 + 追踪线 + 坐标卡片
                    show(stepGroups[3]);
                    show(cards[3]);
                    point3.setAttribute('class', 'scene1-highlight-point');
                    point3.setAttribute('r', '6');
                    point3.setAttribute('filter', 'url(#scene1-glow)');
                    break;
                case 4:
                    // ①③高亮 + 南北方向线
                    show(stepGroups[4]);
                    point1.setAttribute('class', 'scene1-highlight-point');
                    point1.setAttribute('r', '6');
                    point1.setAttribute('filter', 'url(#scene1-glow)');
                    point3.setAttribute('class', 'scene1-highlight-point');
                    point3.setAttribute('r', '6');
                    point3.setAttribute('filter', 'url(#scene1-glow)');
                    break;
                case 5:
                    // ①③高亮 + 南北线 + 东西方向线
                    show(stepGroups[4]);
                    show(stepGroups[5]);
                    point1.setAttribute('class', 'scene1-highlight-point');
                    point1.setAttribute('r', '6');
                    point1.setAttribute('filter', 'url(#scene1-glow)');
                    point3.setAttribute('class', 'scene1-highlight-point');
                    point3.setAttribute('r', '6');
                    point3.setAttribute('filter', 'url(#scene1-glow)');
                    break;
                case 6:
                    // ①③高亮 + 综合方向线
                    show(stepGroups[6]);
                    point1.setAttribute('class', 'scene1-highlight-point');
                    point1.setAttribute('r', '6');
                    point1.setAttribute('filter', 'url(#scene1-glow)');
                    point3.setAttribute('class', 'scene1-highlight-point');
                    point3.setAttribute('r', '6');
                    point3.setAttribute('filter', 'url(#scene1-glow)');
                    break;
                case 7:
                    // 新加坡定位 + ②高亮
                    show(stepGroups[7]);
                    show(cards[2]);
                    point2.setAttribute('class', 'scene1-highlight-green');
                    point2.setAttribute('r', '6');
                    point2.setAttribute('filter', 'url(#scene1-glow)');
                    if (singaporeStar) singaporeStar.classList.add('scene1-pulsing');
                    break;
                case 8:
                    // 回顾所有点，显示全部坐标卡片
                    show(cards[1]);
                    show(cards[2]);
                    show(cards[3]);
                    show(cards[4]);
                    break;
            }
        }

        // 事件绑定
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) updateScene(currentStep - 1);
        });
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) updateScene(currentStep + 1);
        });

        // 初始化
        updateScene(0);
    })();
    </script>
</body>
</html>
