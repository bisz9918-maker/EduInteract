<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>经纬网半球判定</title>
<style>
body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
#scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
#scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
#scene1-controls button { padding: 6px 16px; font-size: 14px; cursor: pointer; border: 1px solid #333; border-radius: 4px; background: #f5f5f5; color: #333; }
#scene1-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
#scene1-step-indicator { font-size: 14px; color: #333; min-width: 60px; text-align: center; }
</style>
</head>
<body>
<div id="scene1-container">
<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
<!-- 底层填充区域 -->
<rect id="scene1-fill-north" x="120" y="110" width="480" height="240" fill="#1565c0" opacity="0.20" style="display:none;opacity:0"/>
<rect id="scene1-fill-west" x="120" y="110" width="480" height="240" fill="#c62828" opacity="0.15" style="display:none;opacity:0"/>
<rect id="scene1-fill-east" x="80" y="110" width="40" height="240" fill="#2e7d32" opacity="0.15" style="display:none;opacity:0"/>
<!-- 经纬网基础线条 -->
<line id="scene1-lat-40" x1="260" y1="110" x2="580" y2="110" stroke="#000000" stroke-width="1.5"/>
<line id="scene1-lat-30" x1="260" y1="190" x2="580" y2="190" stroke="#000000" stroke-width="1.5"/>
<line id="scene1-lat-20" x1="260" y1="270" x2="580" y2="270" stroke="#000000" stroke-width="1.5"/>
<line id="scene1-meridian-170e" x1="260" y1="110" x2="260" y2="350" stroke="#000000" stroke-width="1.5"/>
<line id="scene1-meridian-180" x1="420" y1="110" x2="420" y2="350" stroke="#000000" stroke-width="1.5"/>
<line id="scene1-meridian-170w" x1="580" y1="110" x2="580" y2="350" stroke="#000000" stroke-width="1.5"/>
<line id="scene1-bd-dashed" x1="260" y1="270" x2="580" y2="270" stroke="#888888" stroke-width="1" stroke-dasharray="6,4"/>
<!-- 辅助线 -->
<line id="scene1-line-equator" x1="120" y1="355" x2="720" y2="355" stroke="#888888" stroke-width="1" stroke-dasharray="6,4" style="display:none;opacity:0"/>
<line id="scene1-line-160e" x1="120" y1="110" x2="120" y2="350" stroke="#888888" stroke-width="1" stroke-dasharray="6,4" style="display:none;opacity:0"/>
<line id="scene1-line-20w" x1="720" y1="110" x2="720" y2="350" stroke="#888888" stroke-width="1" stroke-dasharray="6,4" style="display:none;opacity:0"/>
<!-- 高亮经线 -->
<line id="scene1-highlight-170e" x1="260" y1="110" x2="260" y2="350" stroke="#c62828" stroke-width="2.5" style="display:none;opacity:0"/>
<line id="scene1-highlight-170w" x1="580" y1="110" x2="580" y2="350" stroke="#c62828" stroke-width="2.5" style="display:none;opacity:0"/>
<!-- 四点标记 -->
<circle id="scene1-point-a" cx="260" cy="150" r="4" fill="#ffffff" stroke="#000000" stroke-width="1"/>
<circle id="scene1-point-b" cx="260" cy="270" r="4" fill="#ffffff" stroke="#000000" stroke-width="1"/>
<circle id="scene1-point-c" cx="580" cy="150" r="4" fill="#ffffff" stroke="#000000" stroke-width="1"/>
<circle id="scene1-point-d" cx="580" cy="270" r="4" fill="#ffffff" stroke="#000000" stroke-width="1"/>
<!-- 点标签 -->
<text id="scene1-label-a" x="70" y="150" text-anchor="end" font-size="14" fill="#000000" font-family="Microsoft YaHei, sans-serif">A</text>
<text id="scene1-label-b" x="70" y="270" text-anchor="end" font-size="14" fill="#000000" font-family="Microsoft YaHei, sans-serif">B</text>
<text id="scene1-label-c" x="620" y="150" text-anchor="start" font-size="14" fill="#000000" font-family="Microsoft YaHei, sans-serif">C</text>
<text id="scene1-label-d" x="620" y="270" text-anchor="start" font-size="14" fill="#000000" font-family="Microsoft YaHei, sans-serif">D</text>
<!-- 纬度标注 -->
<text id="scene1-label-40" x="650" y="115" text-anchor="start" font-size="14" fill="#000000" font-family="Microsoft YaHei, sans-serif">40°</text>
<text id="scene1-label-30" x="650" y="195" text-anchor="start" font-size="14" fill="#000000" font-family="Microsoft YaHei, sans-serif">30°</text>
<text id="scene1-label-20" x="650" y="275" text-anchor="start" font-size="14" fill="#000000" font-family="Microsoft YaHei, sans-serif">20°</text>
<!-- 经度标注 -->
<text id="scene1-label-170e" x="260" y="380" text-anchor="middle" font-size="14" fill="#000000" font-family="Microsoft YaHei, sans-serif">170°E</text>
<text id="scene1-label-180" x="420" y="380" text-anchor="middle" font-size="14" fill="#000000" font-family="Microsoft YaHei, sans-serif">180°</text>
<text id="scene1-label-170w" x="580" y="380" text-anchor="middle" font-size="14" fill="#000000" font-family="Microsoft YaHei, sans-serif">170°W</text>
<!-- 步骤1标注 -->
<text id="scene1-label-equator" x="520" y="368" text-anchor="middle" font-size="14" fill="#000000" font-family="Microsoft YaHei, sans-serif" style="display:none;opacity:0">0° 赤道</text>
<text id="scene1-label-north" x="420" y="85" text-anchor="middle" font-size="14" fill="#000000" font-family="Microsoft YaHei, sans-serif" style="display:none;opacity:0">北半球</text>
<!-- 步骤2标注 -->
<text id="scene1-label-160e" x="120" y="380" text-anchor="middle" font-size="14" fill="#000000" font-family="Microsoft YaHei, sans-serif" style="display:none;opacity:0">160°E</text>
<text id="scene1-label-20w" x="720" y="380" text-anchor="middle" font-size="14" fill="#000000" font-family="Microsoft YaHei, sans-serif" style="display:none;opacity:0">20°W</text>
<text id="scene1-label-west" x="420" y="85" text-anchor="middle" font-size="14" fill="#000000" font-family="Microsoft YaHei, sans-serif" style="display:none;opacity:0">西半球</text>
<text id="scene1-label-east" x="60" y="220" text-anchor="middle" font-size="14" fill="#000000" font-family="Microsoft YaHei, sans-serif" style="display:none;opacity:0">东半球</text>
<!-- 步骤3标注 -->
<text id="scene1-label-desc" x="400" y="85" text-anchor="middle" font-size="14" fill="#000000" font-family="Microsoft YaHei, sans-serif" style="display:none;opacity:0">A、B在170°E，C、D在170°W，均位于西半球</text>
<!-- 步骤4标注 -->
<text id="scene1-label-conclusion" x="400" y="420" text-anchor="middle" font-size="16" fill="#000000" font-family="Microsoft YaHei, sans-serif" font-weight="bold" style="display:none;opacity:0">四点都位于北半球，但均在西半球，故小题1错误（×）</text>
</svg>
<div id="scene1-controls">
<button id="scene1-btn-prev">◀ 上一步</button>
<span id="scene1-step-indicator">步骤 1/5</span>
<button id="scene1-btn-next">下一步 ▶</button>
</div>
</div>
<script>
(function() {
var currentStep = 0;
var totalSteps = 5;
var btnPrev = document.getElementById('scene1-btn-prev');
var btnNext = document.getElementById('scene1-btn-next');
var stepIndicator = document.getElementById('scene1-step-indicator');
var stepConfig = {
0: [],
1: ['scene1-fill-north','scene1-line-equator','scene1-label-equator','scene1-label-north'],
2: ['scene1-fill-west','scene1-fill-east','scene1-line-160e','scene1-line-20w','scene1-label-160e','scene1-label-20w','scene1-label-west','scene1-label-east'],
3: ['scene1-highlight-170e','scene1-highlight-170w','scene1-label-desc'],
4: ['scene1-label-conclusion']
};
var allStepElements = [];
for (var s = 1; s <= 4; s++) { allStepElements = allStepElements.concat(stepConfig[s]); }
function updateScene() {
allStepElements.forEach(function(id) {
var el = document.getElementById(id);
if (el) { el.style.display = 'none'; el.style.opacity = '0'; }
});
for (var s = 1; s <= currentStep; s++) {
stepConfig[s].forEach(function(id) {
var el = document.getElementById(id);
if (el) { el.style.display = 'block'; el.style.opacity = '1'; }
});
}
if (currentStep >= 2) {
var el = document.getElementById('scene1-label-north');
if (el) { el.style.display = 'none'; el.style.opacity = '0'; }
}
if (currentStep >= 3) {
var el1 = document.getElementById('scene1-label-west');
var el2 = document.getElementById('scene1-label-east');
if (el1) { el1.style.display = 'none'; el1.style.opacity = '0'; }
if (el2) { el2.style.display = 'none'; el2.style.opacity = '0'; }
}
btnPrev.disabled = (currentStep === 0);
btnNext.disabled = (currentStep === totalSteps - 1);
stepIndicator.textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;
}
function prevStep() { if (currentStep > 0) { currentStep--; updateScene(); } }
function nextStep() { if (currentStep < totalSteps - 1) { currentStep++; updateScene(); } }
btnPrev.addEventListener('click', prevStep);
btnNext.addEventListener('click', nextStep);
updateScene();
})();
</script>
</body>
</html>
