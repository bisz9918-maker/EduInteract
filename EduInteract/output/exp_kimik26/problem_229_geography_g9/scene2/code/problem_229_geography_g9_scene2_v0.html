<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>经线圈与东西半球划分</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 16px; z-index: 10; }
        #scene2-controls button {
            padding: 6px 18px; font-size: 14px; cursor: pointer;
            border: 1px solid #ccc; border-radius: 4px; background: #f5f5f5;
            transition: background 0.2s;
        }
        #scene2-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene2-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene2-step-indicator { font-size: 14px; color: #555; min-width: 80px; text-align: center; }
        .scene2-step-group { display: none; }
        .scene2-step-group.active { display: block; }
        .scene2-fill-region { transition: opacity 0.3s ease; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" viewBox="0 0 800 500">
            <!-- 经纬网底图（始终显示） -->
            <g id="scene2-base">
                <!-- 纬线 -->
                <path d="M 183 110 Q 280 140 377 110" fill="none" stroke="#000000" stroke-width="1.5"/>
                <path d="M 160 185 Q 280 210 400 185" fill="none" stroke="#000000" stroke-width="1.5"/>
                <path d="M 130 280 Q 280 310 430 280" fill="none" stroke="#000000" stroke-width="1.5"/>
                <!-- 经线：分段绘制 -->
                <!-- 140°E经线 -->
                <line x1="280" y1="-200" x2="250" y2="-100" stroke="#000000" stroke-width="1.5"/>
                <line x1="250" y1="-100" x2="220" y2="0" stroke="#000000" stroke-width="1.5"/>
                <line x1="220" y1="0" x2="190" y2="100" stroke="#000000" stroke-width="1.5"/>
                <line x1="190" y1="100" x2="160" y2="200" stroke="#000000" stroke-width="1.5"/>
                <line x1="160" y1="200" x2="130" y2="280" stroke="#000000" stroke-width="1.5"/>
                <!-- 180°经线 -->
                <line id="scene2-meridian-180-seg1" x1="280" y1="-200" x2="280" y2="-100" stroke="#000000" stroke-width="1.5"/>
                <line id="scene2-meridian-180-seg2" x1="280" y1="-100" x2="280" y2="0" stroke="#000000" stroke-width="1.5"/>
                <line id="scene2-meridian-180-seg3" x1="280" y1="0" x2="280" y2="100" stroke="#000000" stroke-width="1.5"/>
                <line id="scene2-meridian-180-seg4" x1="280" y1="100" x2="280" y2="200" stroke="#000000" stroke-width="1.5"/>
                <line id="scene2-meridian-180-seg5" x1="280" y1="200" x2="280" y2="280" stroke="#000000" stroke-width="1.5"/>
                <!-- 140°W经线 -->
                <line x1="280" y1="-200" x2="310" y2="-100" stroke="#000000" stroke-width="1.5"/>
                <line x1="310" y1="-100" x2="340" y2="0" stroke="#000000" stroke-width="1.5"/>
                <line x1="340" y1="0" x2="370" y2="100" stroke="#000000" stroke-width="1.5"/>
                <line x1="370" y1="100" x2="400" y2="200" stroke="#000000" stroke-width="1.5"/>
                <line x1="400" y1="200" x2="430" y2="280" stroke="#000000" stroke-width="1.5"/>
                <!-- 点 -->
                <circle cx="183" cy="110" r="4" fill="#000000"/>
                <circle cx="280" cy="185" r="4" fill="#000000"/>
                <circle cx="144" cy="235" r="4" fill="#000000"/>
                <circle cx="400" cy="185" r="4" fill="#000000"/>
                <!-- 标签 -->
                <text x="50" y="60" font-size="14" fill="#000000">140°E</text>
                <text x="305" y="38" font-size="14" fill="#000000">180°</text>
                <text x="465" y="60" font-size="14" fill="#000000">140°W</text>
                <text x="465" y="95" font-size="14" fill="#000000">60°</text>
                <text x="465" y="315" font-size="14" fill="#000000">40°</text>
                <text x="135" y="85" font-size="14" fill="#000000" font-weight="bold">D</text>
                <text x="305" y="230" font-size="14" fill="#000000" font-weight="bold">A</text>
                <text x="105" y="250" font-size="14" fill="#000000" font-weight="bold">E</text>
                <text x="425" y="230" font-size="14" fill="#000000" font-weight="bold">F</text>
            </g>

            <!-- 步骤1：经线圈概念 -->
            <g id="scene2-step1-group" class="scene2-step-group">
                <!-- 0°经线虚线：分段绘制 -->
                <line x1="280" y1="-200" x2="234" y2="-100" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5"/>
                <line x1="234" y1="-100" x2="188" y2="0" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5"/>
                <line x1="188" y1="0" x2="142" y2="100" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5"/>
                <line x1="142" y1="100" x2="96" y2="200" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5"/>
                <line x1="96" y1="200" x2="50" y2="280" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5"/>
                <text x="25" y="290" font-size="12" fill="#555555">0°经线（本初子午线）</text>
                <text x="530" y="295" font-size="14" fill="#333333">经线圈：180°与0°经线（经度和为180°）</text>
            </g>

            <!-- 步骤2：南北半球 -->
            <g id="scene2-step2-group" class="scene2-step-group">
                <!-- 赤道虚线 -->
                <line x1="80" y1="340" x2="480" y2="340" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5"/>
                <text x="490" y="355" font-size="13" fill="#555555">赤道（0°）</text>
                <text x="530" y="335" font-size="16" fill="#2e7d32" font-weight="bold">全部位于北半球</text>
            </g>

            <!-- 步骤3：东西半球分界线 -->
            <g id="scene2-step3-group" class="scene2-step-group">
                <!-- 160°E虚线：分段绘制 -->
                <line x1="280" y1="-200" x2="265" y2="-100" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5"/>
                <line x1="265" y1="-100" x2="250" y2="0" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5"/>
                <line x1="250" y1="0" x2="235" y2="100" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5"/>
                <line x1="235" y1="100" x2="220" y2="200" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5"/>
                <line x1="220" y1="200" x2="205" y2="280" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5"/>
                <text x="150" y="50" font-size="13" fill="#555555">160°E</text>
                <text x="480" y="170" font-size="13" fill="#555555">20°W</text>
                <!-- 东半球填充区 -->
                <path d="M 183 110 L 232 110 L 205 280 L 130 280 Z" fill="#1565c0" fill-opacity="0.2" class="scene2-fill-region"/>
                <!-- 西半球填充区 -->
                <path d="M 232 110 L 377 110 L 430 280 L 205 280 Z" fill="#c62828" fill-opacity="0.2" class="scene2-fill-region"/>
                <text x="50" y="160" font-size="14" fill="#1565c0" font-weight="bold">东半球</text>
                <text x="455" y="160" font-size="14" fill="#c62828" font-weight="bold">西半球</text>
                <!-- 图例 -->
                <rect x="60" y="395" width="15" height="15" fill="#1565c0" fill-opacity="0.4"/>
                <text x="80" y="407" font-size="12" fill="#333">东半球</text>
                <rect x="150" y="395" width="15" height="15" fill="#c62828" fill-opacity="0.4"/>
                <text x="170" y="407" font-size="12" fill="#333">西半球</text>
            </g>

            <!-- 步骤4：范围统计 -->
            <g id="scene2-step4-group" class="scene2-step-group">
                <text x="70" y="140" font-size="15" fill="#1565c0" font-weight="bold">20°</text>
                <text x="465" y="140" font-size="15" fill="#c62828" font-weight="bold">60°</text>
                <text x="530" y="355" font-size="16" fill="#2e7d32" font-weight="bold">大部分位于西半球</text>
            </g>

            <!-- 步骤5：特殊范围判断 -->
            <g id="scene2-step5-group" class="scene2-step-group">
                <!-- 东经度描边区 -->
                <path d="M 183 110 L 280 110 L 280 280 L 130 280 Z" fill="none" stroke="#1565c0" stroke-width="3"/>
                <!-- 西半球描边区 -->
                <path d="M 232 110 L 377 110 L 430 280 L 205 280 Z" fill="none" stroke="#c62828" stroke-width="3"/>
                <!-- 交集填充区 -->
                <path d="M 232 110 L 280 110 L 280 280 L 205 280 Z" fill="#2e7d32" fill-opacity="0.3" class="scene2-fill-region"/>
                <text x="160" y="340" font-size="13" fill="#1565c0" font-weight="bold">东经度范围</text>
                <text x="340" y="340" font-size="13" fill="#c62828" font-weight="bold">西半球范围</text>
                <text x="230" y="360" font-size="13" fill="#2e7d32" font-weight="bold">交集（160°E-180°）</text>
                <!-- 图例-交集 -->
                <rect x="240" y="395" width="15" height="15" fill="#2e7d32" fill-opacity="0.5"/>
                <text x="260" y="407" font-size="12" fill="#333">交集</text>
                <text x="530" y="395" font-size="16" fill="#2e7d32" font-weight="bold">正确答案：C</text>
            </g>

            <!-- 选项面板（始终显示） -->
            <g id="scene2-options">
                <text x="530" y="105" font-size="15" fill="#333" font-weight="bold">第(5)题选项</text>
                <text x="530" y="145" font-size="14" fill="#333">A、140°E向东至180°</text>
                <text x="530" y="185" font-size="14" fill="#333">B、140°W向东至180°</text>
                <text id="scene2-option-c" x="530" y="225" font-size="14" fill="#333">C、160°E向东至180°</text>
                <text x="530" y="265" font-size="14" fill="#333">D、160°W向西至180°</text>
            </g>
        </svg>

        <div id="scene2-controls">
            <button id="scene2-btn-prev">◀ 上一步</button>
            <span id="scene2-step-indicator">步骤 1 / 6</span>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2 实现
        let currentStep = 0;
        const totalSteps = 6;

        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        const indicator = document.getElementById('scene2-step-indicator');
        const optionC = document.getElementById('scene2-option-c');

        // 180°经线各段
        const meridian180Segs = [
            document.getElementById('scene2-meridian-180-seg1'),
            document.getElementById('scene2-meridian-180-seg2'),
            document.getElementById('scene2-meridian-180-seg3'),
            document.getElementById('scene2-meridian-180-seg4'),
            document.getElementById('scene2-meridian-180-seg5')
        ];

        const stepGroups = [
            null,
            document.getElementById('scene2-step1-group'),
            document.getElementById('scene2-step2-group'),
            document.getElementById('scene2-step3-group'),
            document.getElementById('scene2-step4-group'),
            document.getElementById('scene2-step5-group')
        ];

        function updateButtons() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps - 1;
            indicator.textContent = '步骤 ' + (currentStep + 1) + ' / ' + totalSteps;
        }

        function renderStep() {
            // 180°经线样式：步骤1起加粗变蓝
            meridian180Segs.forEach(function(seg) {
                if (currentStep >= 1) {
                    seg.setAttribute('stroke', '#1565c0');
                    seg.setAttribute('stroke-width', '2.5');
                } else {
                    seg.setAttribute('stroke', '#000000');
                    seg.setAttribute('stroke-width', '1.5');
                }
            });

            // 选项C高亮：步骤5时变绿色加粗
            if (currentStep >= 5) {
                optionC.setAttribute('fill', '#2e7d32');
                optionC.setAttribute('font-weight', 'bold');
            } else {
                optionC.setAttribute('fill', '#333');
                optionC.setAttribute('font-weight', 'normal');
            }

            // 控制各步骤组的显隐
            for (let i = 1; i < stepGroups.length; i++) {
                if (stepGroups[i]) {
                    if (i <= currentStep) {
                        stepGroups[i].style.display = 'block';
                        stepGroups[i].classList.add('active');
                    } else {
                        stepGroups[i].style.display = 'none';
                        stepGroups[i].classList.remove('active');
                    }
                }
            }

            updateButtons();
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                renderStep();
            }
        });

        // 初始渲染
        renderStep();
    })();
    </script>
</body>
</html>
