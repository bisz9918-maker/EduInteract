<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>遗传系谱图分步解析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            padding: 6px 16px; font-size: 14px; border-radius: 4px; cursor: pointer;
            border: 1px solid #888; background: #fff; color: #333; transition: all 0.2s;
        }
        #scene1-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-controls button.primary { background: #1565c0; color: #fff; border-color: #1565c0; }
        #scene1-controls button.active { background: #e3f2fd; border-color: #1565c0; color: #1565c0; }
        #scene1-step-indicator { font-size: 14px; color: #333; min-width: 80px; text-align: center; }
        .dimmed { opacity: 0.4; }
        .dimmed-line { opacity: 0.4; stroke-dasharray: 4,2; }
        .highlight { stroke: #1565c0; stroke-width: 2.5px; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <defs>
                <style>
                    .ind-label { font-size: 12px; fill: #333; text-anchor: middle; }
                    .gen-label { font-size: 14px; fill: #333; font-weight: bold; }
                    .genotype { font-size: 12px; font-weight: bold; }
                    .genotype-normal { fill: #1565c0; }
                    .genotype-disease { fill: #c62828; }
                    .note-text { font-size: 13px; fill: #333; }
                    .confirm-text { font-size: 14px; fill: #2e7d32; font-weight: bold; }
                    .answer-text { font-size: 24px; fill: #2e7d32; font-weight: bold; }
                    .legend-text { font-size: 12px; fill: #333; }
                    .step-desc { font-size: 13px; fill: #333; }
                    .cross-mark { font-size: 20px; fill: #c62828; }
                </style>
            </defs>

            <!-- ==================== 系谱图主体 ==================== -->
            <!-- 世代标签 -->
            <text x="20" y="85" class="gen-label">Ⅰ</text>
            <text x="20" y="215" class="gen-label">Ⅱ</text>
            <text x="20" y="355" class="gen-label">Ⅲ</text>

            <!-- ===== Ⅰ1-Ⅰ2 家庭 ===== -->
            <g id="scene1-ind-I1">
                <circle cx="90" cy="80" r="10" fill="none" stroke="#000" stroke-width="1.5"/>
            </g>
            <text x="90" y="102" class="ind-label" id="scene1-label-I1">Ⅰ1</text>

            <g id="scene1-ind-I2">
                <rect x="140" y="70" width="20" height="20" fill="none" stroke="#000" stroke-width="1.5"/>
            </g>
            <text x="150" y="102" class="ind-label" id="scene1-label-I2">Ⅰ2</text>

            <line x1="100" y1="80" x2="140" y2="80" stroke="#000" stroke-width="1.5" id="scene1-line-marriage-I1I2"/>
            <line x1="120" y1="80" x2="120" y2="150" stroke="#000" stroke-width="1.5" id="scene1-line-vertical-I1I2"/>
            <line x1="60" y1="150" x2="180" y2="150" stroke="#000" stroke-width="1.5" id="scene1-line-branch-I1I2"/>

            <line x1="60" y1="150" x2="60" y2="200" stroke="#000" stroke-width="1.5" id="scene1-line-child1-I1I2"/>
            <line x1="100" y1="150" x2="100" y2="200" stroke="#000" stroke-width="1.5" id="scene1-line-child2-I1I2"/>
            <line x1="140" y1="150" x2="140" y2="200" stroke="#000" stroke-width="1.5" id="scene1-line-child3-I1I2"/>
            <line x1="180" y1="150" x2="180" y2="200" stroke="#000" stroke-width="1.5" id="scene1-line-child4-I1I2"/>

            <!-- ===== Ⅰ3-Ⅰ4 家庭 ===== -->
            <g id="scene1-ind-I3">
                <rect x="380" y="70" width="20" height="20" fill="#000" stroke="#000" stroke-width="1.5"/>
            </g>
            <text x="390" y="102" class="ind-label" id="scene1-label-I3">Ⅰ3</text>

            <g id="scene1-ind-I4">
                <circle cx="450" cy="80" r="10" fill="#000" stroke="#000" stroke-width="1.5"/>
            </g>
            <text x="450" y="102" class="ind-label" id="scene1-label-I4">Ⅰ4</text>

            <line x1="400" y1="80" x2="440" y2="80" stroke="#000" stroke-width="1.5" id="scene1-line-marriage-I3I4"/>
            <line x1="420" y1="80" x2="420" y2="150" stroke="#000" stroke-width="1.5" id="scene1-line-vertical-I3I4"/>
            <line x1="360" y1="150" x2="480" y2="150" stroke="#000" stroke-width="1.5" id="scene1-line-branch-I3I4"/>

            <line x1="360" y1="150" x2="360" y2="200" stroke="#000" stroke-width="1.5" id="scene1-line-child1-I3I4"/>
            <line x1="420" y1="150" x2="420" y2="200" stroke="#000" stroke-width="1.5" id="scene1-line-child2-I3I4"/>
            <line x1="480" y1="150" x2="480" y2="200" stroke="#000" stroke-width="1.5" id="scene1-line-child3-I3I4"/>

            <!-- ===== Ⅱ代个体 ===== -->
            <g id="scene1-ind-II1">
                <rect x="50" y="200" width="20" height="20" fill="none" stroke="#000" stroke-width="1.5"/>
            </g>
            <text x="60" y="232" class="ind-label" id="scene1-label-II1">Ⅱ1</text>

            <g id="scene1-ind-II2">
                <circle cx="100" cy="210" r="10" fill="none" stroke="#000" stroke-width="1.5"/>
            </g>
            <text x="100" y="232" class="ind-label" id="scene1-label-II2">Ⅱ2</text>

            <line x1="70" y1="210" x2="90" y2="210" stroke="#000" stroke-width="1.5" id="scene1-line-marriage-II1II2"/>
            <line x1="80" y1="210" x2="80" y2="280" stroke="#000" stroke-width="1.5" id="scene1-line-vertical-II1II2"/>
            <line x1="60" y1="280" x2="100" y2="280" stroke="#000" stroke-width="1.5" id="scene1-line-branch-II1II2"/>
            <line x1="60" y1="280" x2="60" y2="340" stroke="#000" stroke-width="1.5" id="scene1-line-child-II1II2"/>

            <g id="scene1-ind-II3">
                <rect x="130" y="200" width="20" height="20" fill="#000" stroke="#000" stroke-width="1.5"/>
            </g>
            <text x="140" y="232" class="ind-label" id="scene1-label-II3">Ⅱ3</text>

            <g id="scene1-ind-II4">
                <circle cx="180" cy="210" r="10" fill="none" stroke="#000" stroke-width="1.5"/>
                <line x1="173" y1="203" x2="187" y2="217" stroke="#1565c0" stroke-width="1.5"/>
                <line x1="187" y1="203" x2="173" y2="217" stroke="#1565c0" stroke-width="1.5"/>
            </g>
            <text x="180" y="232" class="ind-label" id="scene1-label-II4">Ⅱ4</text>

            <g id="scene1-ind-II5">
                <rect x="240" y="200" width="20" height="20" fill="none" stroke="#000" stroke-width="1.5"/>
            </g>
            <text x="250" y="232" class="ind-label" id="scene1-label-II5">Ⅱ5</text>

            <g id="scene1-ind-II6">
                <circle cx="310" cy="210" r="10" fill="none" stroke="#000" stroke-width="1.5"/>
            </g>
            <text x="310" y="232" class="ind-label" id="scene1-label-II6">Ⅱ6</text>

            <line x1="260" y1="210" x2="300" y2="210" stroke="#000" stroke-width="1.5" id="scene1-line-marriage-II5II6"/>
            <line x1="280" y1="210" x2="280" y2="280" stroke="#000" stroke-width="1.5" id="scene1-line-vertical-II5II6"/>
            <line x1="250" y1="280" x2="310" y2="280" stroke="#000" stroke-width="1.5" id="scene1-line-branch-II5II6"/>

            <line x1="250" y1="280" x2="250" y2="340" stroke="#000" stroke-width="1.5" id="scene1-line-child1-II5II6"/>
            <line x1="310" y1="280" x2="310" y2="340" stroke="#000" stroke-width="1.5" id="scene1-line-child2-II5II6"/>

            <g id="scene1-ind-II7">
                <circle cx="360" cy="210" r="10" fill="none" stroke="#000" stroke-width="1.5"/>
            </g>
            <text x="360" y="232" class="ind-label" id="scene1-label-II7">Ⅱ7</text>

            <g id="scene1-ind-II8">
                <rect x="390" y="200" width="20" height="20" fill="none" stroke="#000" stroke-width="1.5"/>
            </g>
            <text x="400" y="232" class="ind-label" id="scene1-label-II8">Ⅱ8</text>

            <g id="scene1-ind-II9">
                <circle cx="440" cy="210" r="10" fill="#000" stroke="#000" stroke-width="1.5"/>
            </g>
            <text x="440" y="232" class="ind-label" id="scene1-label-II9">Ⅱ9</text>

            <g id="scene1-ind-II10">
                <rect x="470" y="200" width="20" height="20" fill="#c62828" fill-opacity="0.25" stroke="#000" stroke-width="1.5"/>
            </g>
            <text x="480" y="232" class="ind-label" id="scene1-label-II10">Ⅱ10</text>

            <g id="scene1-ind-II11">
                <circle cx="540" cy="210" r="10" fill="none" stroke="#000" stroke-width="1.5"/>
            </g>
            <text x="540" y="232" class="ind-label" id="scene1-label-II11">Ⅱ11</text>

            <line x1="490" y1="210" x2="530" y2="210" stroke="#000" stroke-width="1.5" id="scene1-line-marriage-II10II11"/>
            <line x1="510" y1="210" x2="510" y2="280" stroke="#000" stroke-width="1.5" id="scene1-line-vertical-II10II11"/>
            <line x1="510" y1="280" x2="570" y2="280" stroke="#000" stroke-width="1.5" id="scene1-line-branch-II10II11"/>

            <line x1="510" y1="280" x2="510" y2="340" stroke="#000" stroke-width="1.5" id="scene1-line-child1-II10II11"/>
            <line x1="570" y1="280" x2="570" y2="340" stroke="#000" stroke-width="1.5" id="scene1-line-child2-II10II11"/>

            <!-- ===== Ⅲ代个体 ===== -->
            <g id="scene1-ind-III1">
                <circle cx="60" cy="350" r="10" fill="none" stroke="#000" stroke-width="1.5"/>
            </g>
            <text x="60" y="372" class="ind-label" id="scene1-label-III1">Ⅲ1</text>

            <g id="scene1-ind-III2">
                <rect x="240" y="340" width="20" height="20" fill="#c62828" fill-opacity="0.25" stroke="#000" stroke-width="1.5"/>
            </g>
            <text x="250" y="372" class="ind-label" id="scene1-label-III2">Ⅲ2</text>

            <g id="scene1-ind-III3">
                <circle cx="310" cy="350" r="10" fill="#c62828" fill-opacity="0.25" stroke="#000" stroke-width="1.5"/>
            </g>
            <text x="310" y="372" class="ind-label" id="scene1-label-III3">Ⅲ3</text>

            <g id="scene1-ind-III4">
                <rect x="500" y="340" width="20" height="20" fill="#c62828" fill-opacity="0.25" stroke="#000" stroke-width="1.5"/>
            </g>
            <text x="510" y="372" class="ind-label" id="scene1-label-III4">Ⅲ4</text>

            <g id="scene1-ind-III5">
                <circle cx="570" cy="350" r="10" fill="none" stroke="#000" stroke-width="1.5"/>
            </g>
            <text x="570" y="372" class="ind-label" id="scene1-label-III5">Ⅲ5</text>

            <!-- ==================== 图例面板（增大间距） ==================== -->
            <text x="690" y="35" class="legend-text" style="font-weight:bold;" text-anchor="middle">图例</text>

            <rect x="625" y="50" width="20" height="20" fill="none" stroke="#000" stroke-width="1.5"/>
            <text x="655" y="65" class="legend-text">正常男</text>

            <circle cx="635" cy="92" r="10" fill="none" stroke="#000" stroke-width="1.5"/>
            <text x="655" y="97" class="legend-text">正常女</text>

            <rect x="625" y="124" width="20" height="20" fill="#000" stroke="#000" stroke-width="1.5"/>
            <text x="655" y="139" class="legend-text">患甲病男</text>

            <circle cx="635" cy="166" r="10" fill="#000" stroke="#000" stroke-width="1.5"/>
            <text x="655" y="171" class="legend-text">患甲病女</text>

            <rect x="625" y="198" width="20" height="20" fill="#c62828" fill-opacity="0.25" stroke="#000" stroke-width="1.5"/>
            <text x="655" y="213" class="legend-text">患乙病男</text>

            <circle cx="635" cy="240" r="10" fill="#c62828" fill-opacity="0.25" stroke="#000" stroke-width="1.5"/>
            <text x="655" y="245" class="legend-text">患乙病女</text>

            <circle cx="635" cy="272" r="10" fill="none" stroke="#000" stroke-width="1.5"/>
            <line x1="628" y1="265" x2="642" y2="279" stroke="#1565c0" stroke-width="1.5"/>
            <line x1="642" y1="265" x2="628" y2="279" stroke="#1565c0" stroke-width="1.5"/>
            <text x="655" y="277" class="legend-text">XX的男性</text>

            <!-- ==================== 临时标注 ==================== -->
            <!-- 步骤1-2：甲病"无中生有" -->
            <g id="scene1-note-wns-jia" style="display:none; opacity:0;">
                <text x="120" y="55" class="note-text" text-anchor="middle">无中生有</text>
            </g>

            <!-- 步骤1-2：甲病患儿（右移避免与Ⅱ4、Ⅱ5重叠） -->
            <g id="scene1-note-patient-II3" style="display:none; opacity:0;">
                <line x1="150" y1="220" x2="230" y2="228" stroke="#888" stroke-width="1" stroke-dasharray="3,2"/>
                <text x="230" y="228" class="note-text">甲病患儿</text>
            </g>

            <!-- 步骤4：乙病"无中生有" -->
            <g id="scene1-note-wns-yi" style="display:none; opacity:0;">
                <text x="280" y="185" class="note-text" text-anchor="middle">无中生有</text>
            </g>

            <!-- 步骤4：乙病患儿（左移避免与Ⅲ3重叠） -->
            <g id="scene1-note-patient-III2" style="display:none; opacity:0;">
                <line x1="255" y1="360" x2="200" y2="385" stroke="#888" stroke-width="1" stroke-dasharray="3,2"/>
                <text x="200" y="385" class="note-text">乙病患儿</text>
            </g>

            <!-- ==================== 条件卡片 ==================== -->
            <g id="scene1-card-condition" style="display:none; opacity:0;">
                <foreignObject x="620" y="270" width="160" height="90">
                    <div xmlns="http://www.w3.org/1999/xhtml" style="width:100%; height:100%; background:#e3f2fd; border:1.5px solid #1565c0; border-radius:4px; padding:8px; box-sizing:border-box; font-size:12px; color:#1565c0; line-height:1.6; font-family:Microsoft YaHei, sans-serif;">
                        <div style="font-weight:bold;">已知：</div>
                        <div>Ⅱ6携带甲病基因</div>
                        <div>Ⅰ3、Ⅱ7均无甲病基因</div>
                    </div>
                </foreignObject>
            </g>

            <!-- 红色叉号（排除X隐）- 移到左侧避免与说明面板重叠 -->
            <g id="scene1-cross-mark" style="display:none; opacity:0;">
                <text x="520" y="120" class="cross-mark">✗</text>
                <text x="520" y="140" class="note-text" style="font-size:11px;">Ⅰ3无法提供Xᵃ</text>
                <text x="520" y="155" class="note-text" style="font-size:11px;">与Ⅱ9患病矛盾</text>
            </g>

            <!-- 绿色确认箭头 -->
            <g id="scene1-confirm-arrow" style="display:none; opacity:0;">
                <text x="520" y="100" class="confirm-text">常染色体隐性遗传</text>
            </g>

            <!-- ==================== 基因型标签 ==================== -->
            <!-- 甲病基因型标签（右上方） -->
            <g id="scene1-gen-group-jia" style="display:none; opacity:0;">
                <text x="110" y="65" class="genotype genotype-normal">Aa</text>
                <text x="170" y="65" class="genotype genotype-normal">Aa</text>
                <text x="410" y="65" class="genotype genotype-normal">AA</text>
                <text x="160" y="195" class="genotype genotype-disease">aa</text>
                <text x="330" y="195" class="genotype genotype-normal">Aa</text>
                <text x="380" y="195" class="genotype genotype-normal">AA</text>
                <text x="460" y="195" class="genotype genotype-disease">aa</text>
            </g>

            <!-- 乙病基因型标签 - 常隐假设 -->
            <g id="scene1-gen-group-yi-auto" style="display:none; opacity:0;">
                <text x="230" y="195" class="genotype genotype-normal">Bb</text>
                <text x="290" y="195" class="genotype genotype-normal">Bb</text>
                <text x="230" y="335" class="genotype genotype-disease">bb</text>
                <text x="290" y="335" class="genotype genotype-disease">bb</text>
                <text x="490" y="335" class="genotype genotype-disease">bb</text>
            </g>

            <!-- 乙病基因型标签 - X隐假设 -->
            <g id="scene1-gen-group-yi-xlink" style="display:none; opacity:0;">
                <text x="215" y="195" class="genotype genotype-normal">XᴮY</text>
                <text x="270" y="195" class="genotype genotype-normal">XᴮXᵇ</text>
                <text x="215" y="335" class="genotype genotype-disease">XᵇY</text>
                <text x="270" y="335" class="genotype genotype-disease">XᵇXᵇ</text>
                <text x="455" y="195" class="genotype genotype-disease">XᵇY</text>
                <text x="515" y="195" class="genotype genotype-normal">XᴮXᵇ</text>
                <text x="490" y="335" class="genotype genotype-disease">XᵇY</text>
            </g>

            <!-- ==================== 答案标记（上移避免与图例重叠） ==================== -->
            <g id="scene1-answer-mark" style="display:none; opacity:0;">
                <text x="690" y="220" class="answer-text" text-anchor="middle">A、C</text>
            </g>

            <!-- ==================== 步骤说明面板 ==================== -->
            <rect x="620" y="290" width="160" height="140" fill="#fff" stroke="#e0e0e0" stroke-width="1" rx="4" id="scene1-desc-bg"/>
            <foreignObject x="625" y="295" width="150" height="130" id="scene1-desc-fo">
                <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:12px; color:#333; line-height:1.5; font-family:Microsoft YaHei, sans-serif;" id="scene1-step-desc">
                    步骤0：观察系谱图整体结构，识别三代人及各个体的表型。
                </div>
            </foreignObject>
        </svg>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 0 / 6</span>
            <button id="scene1-btn-next" class="primary">下一步 ▶</button>
            <button id="scene1-btn-auto" style="display:none;">常隐假设</button>
            <button id="scene1-btn-xlink" style="display:none;">X隐假设</button>
        </div>
    </div>

    <script>
    (function() {
        var currentStep = 0;
        var currentHypothesis = 'auto';
        var totalSteps = 6;

        var btnPrev = document.getElementById('scene1-btn-prev');
        var btnNext = document.getElementById('scene1-btn-next');
        var btnAuto = document.getElementById('scene1-btn-auto');
        var btnXlink = document.getElementById('scene1-btn-xlink');
        var stepIndicator = document.getElementById('scene1-step-indicator');
        var stepDesc = document.getElementById('scene1-step-desc');

        var stepDescriptions = [
            "步骤0：观察系谱图整体结构，识别三代人及各个体的表型。",
            "步骤1：甲病显隐判断。Ⅰ1与Ⅰ2表现正常，子代Ⅱ3患甲病，符合'无中生有'→甲病为隐性遗传病。",
            "步骤2：甲病染色体定位。已知Ⅱ6携带甲病基因，Ⅰ3、Ⅱ7均无甲病基因。若为伴X隐性，Ⅰ3(XᴬY)无法提供Xᵃ，与Ⅱ9(aa)患病矛盾→排除伴X，确认为常染色体隐性遗传。",
            "步骤3：甲病基因型标注。根据遗传方式推导关键个体基因型。",
            "步骤4：乙病显隐判断。Ⅱ5与Ⅱ6正常，子代Ⅲ2患乙病→乙病为隐性遗传病。",
            "步骤5：乙病两种假设。常隐假设与X隐假设均与系谱图不矛盾，点击按钮切换查看。",
            "步骤6：最终结论。甲病为常染色体隐性遗传；乙病可能为常染色体隐性（A）或X染色体隐性（C）遗传。"
        ];

        var allInds = ['I1','I2','I3','I4','II1','II2','II3','II4','II5','II6','II7','II8','II9','II10','II11','III1','III2','III3','III4','III5'];
        var allLines = [
            'scene1-line-marriage-I1I2','scene1-line-vertical-I1I2','scene1-line-branch-I1I2',
            'scene1-line-child1-I1I2','scene1-line-child2-I1I2','scene1-line-child3-I1I2','scene1-line-child4-I1I2',
            'scene1-line-marriage-I3I4','scene1-line-vertical-I3I4','scene1-line-branch-I3I4',
            'scene1-line-child1-I3I4','scene1-line-child2-I3I4','scene1-line-child3-I3I4',
            'scene1-line-marriage-II1II2','scene1-line-vertical-II1II2','scene1-line-branch-II1II2','scene1-line-child-II1II2',
            'scene1-line-marriage-II5II6','scene1-line-vertical-II5II6','scene1-line-branch-II5II6',
            'scene1-line-child1-II5II6','scene1-line-child2-II5II6',
            'scene1-line-marriage-II10II11','scene1-line-vertical-II10II11','scene1-line-branch-II10II11',
            'scene1-line-child1-II10II11','scene1-line-child2-II10II11'
        ];

        function show(el) {
            if (!el) return;
            el.style.display = '';
            el.style.opacity = '1';
        }
        function hide(el) {
            if (!el) return;
            el.style.display = 'none';
            el.style.opacity = '0';
        }
        function fadeIn(el) {
            if (!el) return;
            el.style.display = '';
            requestAnimationFrame(function() {
                el.style.opacity = '1';
            });
        }

        function clearHighlights() {
            allInds.forEach(function(id) {
                var g = document.getElementById('scene1-ind-' + id);
                if (g) {
                    g.classList.remove('highlight');
                    g.classList.remove('dimmed');
                }
            });
            allLines.forEach(function(id) {
                var line = document.getElementById(id);
                if (line) {
                    line.classList.remove('dimmed-line');
                }
            });
        }

        function highlightInds(ids) {
            ids.forEach(function(id) {
                var g = document.getElementById('scene1-ind-' + id);
                if (g) g.classList.add('highlight');
            });
        }

        function dimInds(ids) {
            ids.forEach(function(id) {
                var g = document.getElementById('scene1-ind-' + id);
                if (g) g.classList.add('dimmed');
            });
        }

        function dimLines(ids) {
            ids.forEach(function(id) {
                var line = document.getElementById(id);
                if (line) line.classList.add('dimmed-line');
            });
        }

        function renderState() {
            btnPrev.disabled = currentStep === 0;
            if (currentStep === totalSteps) {
                btnNext.textContent = '重新开始';
            } else {
                btnNext.textContent = '下一步 ▶';
            }
            stepIndicator.textContent = '步骤 ' + currentStep + ' / ' + totalSteps;
            stepDesc.textContent = stepDescriptions[currentStep] || '';

            clearHighlights();
            hide(document.getElementById('scene1-note-wns-jia'));
            hide(document.getElementById('scene1-note-patient-II3'));
            hide(document.getElementById('scene1-note-wns-yi'));
            hide(document.getElementById('scene1-note-patient-III2'));
            hide(document.getElementById('scene1-card-condition'));
            hide(document.getElementById('scene1-cross-mark'));
            hide(document.getElementById('scene1-confirm-arrow'));
            hide(document.getElementById('scene1-gen-group-jia'));
            hide(document.getElementById('scene1-gen-group-yi-auto'));
            hide(document.getElementById('scene1-gen-group-yi-xlink'));
            hide(document.getElementById('scene1-answer-mark'));

            if (currentStep === 5) {
                btnAuto.style.display = '';
                btnXlink.style.display = '';
                btnNext.style.display = '';
                if (currentHypothesis === 'auto') {
                    btnAuto.classList.add('active');
                    btnXlink.classList.remove('active');
                } else {
                    btnAuto.classList.remove('active');
                    btnXlink.classList.add('active');
                }
            } else {
                btnAuto.style.display = 'none';
                btnXlink.style.display = 'none';
                btnNext.style.display = '';
            }

            switch (currentStep) {
                case 0:
                    break;
                case 1:
                    highlightInds(['I1','I2','II3']);
                    dimInds(['I3','I4','II1','II2','II4','II5','II6','II7','II8','II9','II10','II11','III1','III2','III3','III4','III5']);
                    dimLines([
                        'scene1-line-marriage-I3I4','scene1-line-vertical-I3I4','scene1-line-branch-I3I4',
                        'scene1-line-child1-I3I4','scene1-line-child2-I3I4','scene1-line-child3-I3I4',
                        'scene1-line-marriage-II1II2','scene1-line-vertical-II1II2','scene1-line-branch-II1II2','scene1-line-child-II1II2',
                        'scene1-line-marriage-II5II6','scene1-line-vertical-II5II6','scene1-line-branch-II5II6',
                        'scene1-line-child1-II5II6','scene1-line-child2-II5II6',
                        'scene1-line-marriage-II10II11','scene1-line-vertical-II10II11','scene1-line-branch-II10II11',
                        'scene1-line-child1-II10II11','scene1-line-child2-II10II11'
                    ]);
                    fadeIn(document.getElementById('scene1-note-wns-jia'));
                    fadeIn(document.getElementById('scene1-note-patient-II3'));
                    break;
                case 2:
                    highlightInds(['I3','II6','II7','II9']);
                    dimInds(['I1','I2','II1','II2','II3','II4','II5','II8','II10','II11','III1','III2','III3','III4','III5']);
                    dimLines([
                        'scene1-line-marriage-I1I2','scene1-line-vertical-I1I2','scene1-line-branch-I1I2',
                        'scene1-line-child1-I1I2','scene1-line-child2-I1I2','scene1-line-child3-I1I2','scene1-line-child4-I1I2',
                        'scene1-line-marriage-II1II2','scene1-line-vertical-II1II2','scene1-line-branch-II1II2','scene1-line-child-II1II2',
                        'scene1-line-marriage-II5II6','scene1-line-vertical-II5II6','scene1-line-branch-II5II6',
                        'scene1-line-child1-II5II6','scene1-line-child2-II5II6',
                        'scene1-line-marriage-II10II11','scene1-line-vertical-II10II11','scene1-line-branch-II10II11',
                        'scene1-line-child1-II10II11','scene1-line-child2-II10II11'
                    ]);
                    fadeIn(document.getElementById('scene1-card-condition'));
                    fadeIn(document.getElementById('scene1-cross-mark'));
                    fadeIn(document.getElementById('scene1-confirm-arrow'));
                    break;
                case 3:
                    fadeIn(document.getElementById('scene1-gen-group-jia'));
                    break;
                case 4:
                    highlightInds(['II5','II6','III2']);
                    dimInds(['I1','I2','I3','I4','II1','II2','II3','II4','II7','II8','II9','II10','II11','III1','III3','III4','III5']);
                    dimLines([
                        'scene1-line-marriage-I1I2','scene1-line-vertical-I1I2','scene1-line-branch-I1I2',
                        'scene1-line-child1-I1I2','scene1-line-child2-I1I2','scene1-line-child3-I1I2','scene1-line-child4-I1I2',
                        'scene1-line-marriage-I3I4','scene1-line-vertical-I3I4','scene1-line-branch-I3I4',
                        'scene1-line-child1-I3I4','scene1-line-child2-I3I4','scene1-line-child3-I3I4',
                        'scene1-line-marriage-II1II2','scene1-line-vertical-II1II2','scene1-line-branch-II1II2','scene1-line-child-II1II2',
                        'scene1-line-marriage-II10II11','scene1-line-vertical-II10II11','scene1-line-branch-II10II11',
                        'scene1-line-child1-II10II11','scene1-line-child2-II10II11'
                    ]);
                    fadeIn(document.getElementById('scene1-note-wns-yi'));
                    fadeIn(document.getElementById('scene1-note-patient-III2'));
                    break;
                case 5:
                    highlightInds(['II5','II6','III2','III3','II10','II11','III4']);
                    dimInds(['I1','I2','I3','I4','II1','II2','II3','II4','II7','II8','II9','III1','III5']);
                    dimLines([
                        'scene1-line-marriage-I1I2','scene1-line-vertical-I1I2','scene1-line-branch-I1I2',
                        'scene1-line-child1-I1I2','scene1-line-child2-I1I2','scene1-line-child3-I1I2','scene1-line-child4-I1I2',
                        'scene1-line-marriage-I3I4','scene1-line-vertical-I3I4','scene1-line-branch-I3I4',
                        'scene1-line-child1-I3I4','scene1-line-child2-I3I4','scene1-line-child3-I3I4',
                        'scene1-line-marriage-II1II2','scene1-line-vertical-II1II2','scene1-line-branch-II1II2','scene1-line-child-II1II2'
                    ]);
                    if (currentHypothesis === 'auto') {
                        fadeIn(document.getElementById('scene1-gen-group-yi-auto'));
                    } else {
                        fadeIn(document.getElementById('scene1-gen-group-yi-xlink'));
                    }
                    break;
                case 6:
                    fadeIn(document.getElementById('scene1-gen-group-jia'));
                    fadeIn(document.getElementById('scene1-gen-group-yi-auto'));
                    fadeIn(document.getElementById('scene1-answer-mark'));
                    break;
            }
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderState();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                renderState();
            } else {
                currentStep = 0;
                renderState();
            }
        });

        btnAuto.addEventListener('click', function() {
            currentHypothesis = 'auto';
            renderState();
        });

        btnXlink.addEventListener('click', function() {
            currentHypothesis = 'xlink';
            renderState();
        });

        renderState();
    })();
    </script>
</body>
</html>
