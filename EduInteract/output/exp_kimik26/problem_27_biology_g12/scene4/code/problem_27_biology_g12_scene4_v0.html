<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图2 细胞分裂时期判断与基因型推导</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene4-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene4-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene4-controls button { padding: 6px 16px; font-size: 14px; border: none; border-radius: 4px; cursor: pointer; transition: opacity 0.2s; }
        #scene4-btn-prev { background: #e0e0e0; color: #333; }
        #scene4-btn-next { background: #1565c0; color: #fff; }
        #scene4-step-indicator { font-size: 14px; color: #333; min-width: 70px; text-align: center; }
        .scene4-fade { transition: opacity 0.3s ease, fill 0.3s ease, stroke 0.3s ease; }
    </style>
</head>
<body>
    <div id="scene4-container">
        <svg id="scene4-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 标题 -->
            <text id="scene4-title" x="400" y="42" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">图2 细胞分裂时期判断与基因型推导</text>

            <!-- 细胞分裂大图 -->
            <g id="scene4-cell-group">
                <!-- 细胞质填充 -->
                <circle id="scene4-cell-fill" cx="420" cy="215" r="98" fill="#1565c0" fill-opacity="0.05" class="scene4-fade"/>
                <!-- 细胞轮廓 -->
                <circle id="scene4-cell-membrane" cx="420" cy="215" r="100" fill="none" stroke="#000" stroke-width="2"/>
                <!-- 赤道板虚线 -->
                <line id="scene4-equator" x1="320" y1="215" x2="520" y2="215" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>

                <!-- 常染色体对-左1 -->
                <g id="scene4-chr-pair1">
                    <line x1="385" y1="185" x2="385" y2="215" stroke="#1565c0" stroke-width="3" class="scene4-fade"/>
                    <line x1="385" y1="215" x2="385" y2="245" stroke="#1565c0" stroke-width="3" class="scene4-fade"/>
                    <circle cx="385" cy="215" r="3" fill="#000"/>
                </g>
                <!-- 常染色体对-左2 -->
                <g id="scene4-chr-pair2">
                    <line x1="400" y1="185" x2="400" y2="215" stroke="#1565c0" stroke-width="3" class="scene4-fade"/>
                    <line x1="400" y1="215" x2="400" y2="245" stroke="#1565c0" stroke-width="3" class="scene4-fade"/>
                    <circle cx="400" cy="215" r="3" fill="#000"/>
                </g>
                <!-- 性染色体X -->
                <g id="scene4-chr-x">
                    <line x1="445" y1="185" x2="445" y2="215" stroke="#1565c0" stroke-width="3" class="scene4-fade"/>
                    <line x1="445" y1="215" x2="445" y2="245" stroke="#1565c0" stroke-width="3" class="scene4-fade"/>
                    <circle cx="445" cy="215" r="3" fill="#000"/>
                </g>
                <!-- 性染色体Y -->
                <g id="scene4-chr-y">
                    <line x1="465" y1="195" x2="465" y2="215" stroke="#c62828" stroke-width="3" class="scene4-fade"/>
                    <line x1="465" y1="215" x2="465" y2="235" stroke="#c62828" stroke-width="3" class="scene4-fade"/>
                    <circle cx="465" cy="215" r="3" fill="#000"/>
                </g>
            </g>

            <!-- 标签与标注线 -->
            <g id="scene4-labels">
                <!-- 细胞膜 -->
                <line id="scene4-label-line-membrane" x1="520" y1="285" x2="510" y2="265" stroke="#888" stroke-width="1" stroke-dasharray="3,3" opacity="0"/>
                <text id="scene4-label-membrane" x="530" y="305" font-size="12" fill="#333" opacity="0">细胞膜</text>

                <!-- 赤道板 -->
                <line id="scene4-label-line-equator" x1="520" y1="215" x2="540" y2="210" stroke="#888" stroke-width="1" stroke-dasharray="3,3" opacity="0"/>
                <text id="scene4-label-equator" x="545" y="210" font-size="12" fill="#333" opacity="0">赤道板</text>

                <!-- 同源染色体 -->
                <line id="scene4-label-line-homologous" x1="370" y1="185" x2="330" y2="160" stroke="#888" stroke-width="1" stroke-dasharray="3,3" opacity="0"/>
                <text id="scene4-label-homologous" x="320" y="155" font-size="12" fill="#333" opacity="0" text-anchor="end">同源染色体</text>

                <!-- 四分体 -->
                <line id="scene4-label-line-tetrad" x1="392" y1="185" x2="350" y2="135" stroke="#888" stroke-width="1" stroke-dasharray="3,3" opacity="0"/>
                <text id="scene4-label-tetrad" x="340" y="130" font-size="12" fill="#333" opacity="0" text-anchor="end">四分体</text>

                <!-- 姐妹染色单体 -->
                <line id="scene4-label-line-sister" x1="370" y1="215" x2="330" y2="215" stroke="#888" stroke-width="1" stroke-dasharray="3,3" opacity="0"/>
                <text id="scene4-label-sister" x="320" y="219" font-size="12" fill="#333" opacity="0" text-anchor="end">染色单体</text>

                <!-- 着丝点 -->
                <line id="scene4-label-line-centromere" x1="370" y1="215" x2="340" y2="245" stroke="#888" stroke-width="1" stroke-dasharray="3,3" opacity="0"/>
                <text id="scene4-label-centromere" x="330" y="255" font-size="12" fill="#333" opacity="0" text-anchor="end">着丝点</text>

                <!-- X标注 -->
                <text id="scene4-label-x" x="445" y="168" font-size="13" fill="#1565c0" font-weight="bold" opacity="0" text-anchor="middle">X</text>
                <!-- Y标注 -->
                <text id="scene4-label-y" x="475" y="168" font-size="13" fill="#c62828" font-weight="bold" opacity="0" text-anchor="middle">Y</text>

                <!-- 时期名称 -->
                <text id="scene4-label-stage" x="420" y="345" font-size="15" fill="#2e7d32" font-weight="bold" opacity="0" text-anchor="middle">减数第一次分裂中期</text>
                <text id="scene4-label-substage" x="420" y="370" font-size="13" fill="#2e7d32" opacity="0" text-anchor="middle">（四分体时期）</text>

                <!-- 观察提示 -->
                <text id="scene4-hint-observe" x="420" y="395" font-size="13" fill="#2e7d32" opacity="0" text-anchor="middle">观察：该细胞具有哪些特征？</text>
            </g>

            <!-- 左侧三时期特征对比表 -->
            <g id="scene4-comparison-table">
                <!-- 外框 -->
                <rect x="10" y="55" width="165" height="185" fill="none" stroke="#000" stroke-width="1"/>
                <!-- 表头 -->
                <text x="92" y="72" font-size="12" font-weight="bold" fill="#000" text-anchor="middle">时期特征对比</text>
                <!-- 分隔线 -->
                <line x1="10" y1="80" x2="175" y2="80" stroke="#000" stroke-width="1"/>
                <line x1="10" y1="141" x2="175" y2="141" stroke="#ccc" stroke-width="1"/>
                <line x1="10" y1="202" x2="175" y2="202" stroke="#ccc" stroke-width="1"/>
                <line x1="65" y1="80" x2="65" y2="240" stroke="#ccc" stroke-width="1"/>
                <line x1="102" y1="80" x2="102" y2="240" stroke="#ccc" stroke-width="1"/>
                <line x1="138" y1="80" x2="138" y2="240" stroke="#ccc" stroke-width="1"/>

                <!-- 列标题 -->
                <text x="83" y="96" font-size="9" fill="#666" text-anchor="middle">同源染色体</text>
                <text x="120" y="96" font-size="9" fill="#666" text-anchor="middle">四分体</text>
                <text x="156" y="96" font-size="9" fill="#666" text-anchor="middle">单体</text>

                <!-- 有丝分裂中期行 -->
                <g id="scene4-row-mitosis">
                    <text x="22" y="128" font-size="10" fill="#333">有丝中期</text>
                    <text id="scene4-mitosis-homologous" x="83" y="128" font-size="13" fill="#888" text-anchor="middle" opacity="0">?</text>
                    <text id="scene4-mitosis-tetrad" x="120" y="128" font-size="13" fill="#c62828" text-anchor="middle" opacity="0">✗</text>
                    <text id="scene4-mitosis-sister" x="156" y="128" font-size="13" fill="#888" text-anchor="middle" opacity="0">?</text>
                </g>

                <!-- 减Ⅰ中期行 -->
                <g id="scene4-row-meiosis1">
                    <text x="22" y="189" font-size="10" fill="#333">减Ⅰ中期</text>
                    <text id="scene4-meiosis1-homologous" x="83" y="189" font-size="13" fill="#2e7d32" text-anchor="middle" opacity="0">✓</text>
                    <text id="scene4-meiosis1-tetrad" x="120" y="189" font-size="13" fill="#2e7d32" text-anchor="middle" opacity="0">✓</text>
                    <text id="scene4-meiosis1-sister" x="156" y="189" font-size="13" fill="#2e7d32" text-anchor="middle" opacity="0">✓</text>
                </g>

                <!-- 减Ⅱ中期行 -->
                <g id="scene4-row-meiosis2">
                    <text x="22" y="230" font-size="10" fill="#333">减Ⅱ中期</text>
                    <text id="scene4-meiosis2-homologous" x="83" y="230" font-size="13" fill="#c62828" text-anchor="middle" opacity="0">✗</text>
                    <text id="scene4-meiosis2-tetrad" x="120" y="230" font-size="13" fill="#888" text-anchor="middle" opacity="0">?</text>
                    <text id="scene4-meiosis2-sister" x="156" y="230" font-size="13" fill="#888" text-anchor="middle" opacity="0">?</text>
                </g>

                <!-- 行背景高亮（用于步骤3） -->
                <rect id="scene4-row-mitosis-bg" x="10" y="81" width="165" height="60" fill="#f5f5f5" fill-opacity="0" class="scene4-fade"/>
                <rect id="scene4-row-meiosis1-bg" x="10" y="142" width="165" height="60" fill="#e8f5e9" fill-opacity="0" class="scene4-fade"/>
                <rect id="scene4-row-meiosis2-bg" x="10" y="203" width="165" height="37" fill="#f5f5f5" fill-opacity="0" class="scene4-fade"/>
            </g>

            <!-- 右侧四分体放大框 -->
            <g id="scene4-tetrad-panel">
                <rect x="570" y="55" width="200" height="130" fill="none" stroke="#000" stroke-width="1"/>
                <text x="670" y="72" font-size="13" font-weight="bold" fill="#000" text-anchor="middle">四分体结构</text>
                <!-- 四分体放大图 -->
                <g id="scene4-tetrad-zoom" opacity="0" class="scene4-fade">
                    <!-- 4条染色单体 -->
                    <line x1="650" y1="100" x2="650" y2="150" stroke="#1565c0" stroke-width="3"/>
                    <line x1="660" y1="100" x2="660" y2="150" stroke="#1565c0" stroke-width="3"/>
                    <line x1="680" y1="100" x2="680" y2="150" stroke="#1565c0" stroke-width="3"/>
                    <line x1="690" y1="100" x2="690" y2="150" stroke="#1565c0" stroke-width="3"/>
                    <!-- 着丝点 -->
                    <circle cx="655" cy="125" r="3" fill="#000"/>
                    <circle cx="685" cy="125" r="3" fill="#000"/>
                    <!-- 交叉示意 -->
                    <path d="M 650 120 Q 670 130 690 120" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="2,2"/>
                </g>
            </g>

            <!-- 右侧基因型推导框 -->
            <g id="scene4-genotype-panel">
                <rect x="570" y="200" width="200" height="180" fill="none" stroke="#000" stroke-width="1"/>
                <text x="670" y="218" font-size="13" font-weight="bold" fill="#000" text-anchor="middle">Ⅱ10 基因型推导</text>

                <!-- 步骤4内容 -->
                <text id="scene4-genotype-info" x="580" y="242" font-size="11" fill="#333" opacity="0">Ⅱ10：男性，患乙病，不患甲病</text>

                <!-- 步骤5内容 -->
                <text id="scene4-genotype-module-a" x="580" y="266" font-size="11" fill="#1565c0" opacity="0">甲病：不患甲病 → A_</text>
                <text id="scene4-genotype-module-b" x="580" y="290" font-size="11" fill="#c62828" opacity="0">乙病：患乙病 → bb 或 XᵇY</text>
                <text id="scene4-genotype-hint" x="580" y="318" font-size="10" fill="#666" opacity="0">结合系谱图讨论乙病遗传方式</text>

                <!-- 步骤6内容 -->
                <text id="scene4-genotype-final" x="670" y="348" font-size="13" fill="#2e7d32" font-weight="bold" opacity="0" text-anchor="middle">基因型：Aabb 或 AaXᵇY</text>
            </g>

            <!-- 右上角系谱缩略图 -->
            <g id="scene4-pedigree-mini">
                <rect x="690" y="10" width="100" height="70" fill="none" stroke="#000" stroke-width="1"/>
                <text x="740" y="32" font-size="11" fill="#000" text-anchor="middle">系谱图</text>
                <!-- 简化系谱：只画Ⅱ10位置 -->
                <circle cx="730" cy="52" r="6" fill="#fff" stroke="#000" stroke-width="1"/>
                <text x="730" y="55" font-size="8" fill="#000" text-anchor="middle">10</text>
                <!-- 高亮圈 -->
                <circle id="scene4-pedigree-highlight" cx="730" cy="52" r="10" fill="none" stroke="#c62828" stroke-width="2" opacity="0" class="scene4-fade"/>
            </g>

            <!-- 细胞图中基因标注（步骤5） -->
            <text id="scene4-gene-aa" x="392" y="172" font-size="10" fill="#1565c0" opacity="0" text-anchor="middle">A/a</text>
            <text id="scene4-gene-bb" x="475" y="172" font-size="10" fill="#c62828" opacity="0" text-anchor="middle">B/b</text>
        </svg>

        <div id="scene4-controls">
            <button id="scene4-btn-prev">◀ 上一步</button>
            <span id="scene4-step-indicator">步骤 0/6</span>
            <button id="scene4-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 4 实现
        let currentStep = 0;
        const totalSteps = 6;

        const btnPrev = document.getElementById('scene4-btn-prev');
        const btnNext = document.getElementById('scene4-btn-next');
        const stepIndicator = document.getElementById('scene4-step-indicator');

        function setOpacity(id, value) {
            const el = document.getElementById(id);
            if (el) el.setAttribute('opacity', value);
        }

        function updateScene(step) {
            currentStep = step;
            stepIndicator.textContent = '步骤 ' + step + '/' + totalSteps;
            btnPrev.disabled = (step === 0);
            btnPrev.style.opacity = (step === 0) ? '0.4' : '1';
            if (step === totalSteps) {
                btnNext.textContent = '完成';
                btnNext.disabled = true;
                btnNext.style.opacity = '0.4';
            } else {
                btnNext.textContent = '下一步 ▶';
                btnNext.disabled = false;
                btnNext.style.opacity = '1';
            }

            const labelIds = [
                'scene4-label-line-membrane','scene4-label-membrane',
                'scene4-label-line-equator','scene4-label-equator',
                'scene4-label-line-homologous','scene4-label-homologous',
                'scene4-label-line-tetrad','scene4-label-tetrad',
                'scene4-label-line-sister','scene4-label-sister',
                'scene4-label-line-centromere','scene4-label-centromere',
                'scene4-label-x','scene4-label-y',
                'scene4-label-stage','scene4-label-substage',
                'scene4-hint-observe'
            ];
            labelIds.forEach(id => setOpacity(id, 0));

            const checkIds = [
                'scene4-mitosis-homologous','scene4-mitosis-tetrad','scene4-mitosis-sister',
                'scene4-meiosis1-homologous','scene4-meiosis1-tetrad','scene4-meiosis1-sister',
                'scene4-meiosis2-homologous','scene4-meiosis2-tetrad','scene4-meiosis2-sister'
            ];
            checkIds.forEach(id => setOpacity(id, 0));

            setOpacity('scene4-row-mitosis-bg', 0);
            setOpacity('scene4-row-meiosis1-bg', 0);
            setOpacity('scene4-row-meiosis2-bg', 0);
            setOpacity('scene4-tetrad-zoom', 0);
            setOpacity('scene4-genotype-info', 0);
            setOpacity('scene4-genotype-module-a', 0);
            setOpacity('scene4-genotype-module-b', 0);
            setOpacity('scene4-genotype-hint', 0);
            setOpacity('scene4-genotype-final', 0);
            setOpacity('scene4-pedigree-highlight', 0);
            setOpacity('scene4-gene-aa', 0);
            setOpacity('scene4-gene-bb', 0);

            const chrPairs = ['scene4-chr-pair1','scene4-chr-pair2','scene4-chr-x','scene4-chr-y'];
            chrPairs.forEach(id => {
                const g = document.getElementById(id);
                if (g) {
                    Array.from(g.querySelectorAll('line')).forEach(line => {
                        line.setAttribute('stroke-width', '3');
                    });
                }
            });

            if (step >= 1) {
                setOpacity('scene4-label-homologous', 0.4);
                setOpacity('scene4-label-line-homologous', 0.4);
                setOpacity('scene4-label-sister', 0.4);
                setOpacity('scene4-label-line-sister', 0.4);
                setOpacity('scene4-label-equator', 0.4);
                setOpacity('scene4-label-line-equator', 0.4);
                setOpacity('scene4-hint-observe', 1);
                setOpacity('scene4-mitosis-homologous', 0.3);
                setOpacity('scene4-mitosis-sister', 0.3);
                setOpacity('scene4-meiosis1-homologous', 0.3);
                setOpacity('scene4-meiosis1-tetrad', 0.3);
                setOpacity('scene4-meiosis1-sister', 0.3);
                setOpacity('scene4-meiosis2-tetrad', 0.3);
                setOpacity('scene4-meiosis2-sister', 0.3);
            }

            if (step >= 2) {
                setOpacity('scene4-label-homologous', 1);
                setOpacity('scene4-label-line-homologous', 1);
                setOpacity('scene4-label-sister', 1);
                setOpacity('scene4-label-line-sister', 1);
                setOpacity('scene4-label-equator', 1);
                setOpacity('scene4-label-line-equator', 1);
                setOpacity('scene4-label-tetrad', 1);
                setOpacity('scene4-label-line-tetrad', 1);
                setOpacity('scene4-label-centromere', 1);
                setOpacity('scene4-label-line-centromere', 1);
                setOpacity('scene4-tetrad-zoom', 1);
                chrPairs.forEach(id => {
                    const g = document.getElementById(id);
                    if (g) {
                        Array.from(g.querySelectorAll('line')).forEach(line => {
                            line.setAttribute('stroke-width', '5');
                        });
                    }
                });
                setOpacity('scene4-mitosis-homologous', 0.3);
                setOpacity('scene4-mitosis-sister', 0.3);
                setOpacity('scene4-meiosis1-homologous', 0.3);
                setOpacity('scene4-meiosis1-tetrad', 0.3);
                setOpacity('scene4-meiosis1-sister', 0.3);
                setOpacity('scene4-meiosis2-tetrad', 0.3);
                setOpacity('scene4-meiosis2-sister', 0.3);
            }

            if (step >= 3) {
                setOpacity('scene4-mitosis-tetrad', 1);
                setOpacity('scene4-meiosis2-homologous', 1);
                setOpacity('scene4-meiosis1-homologous', 1);
                setOpacity('scene4-meiosis1-tetrad', 1);
                setOpacity('scene4-meiosis1-sister', 1);
                setOpacity('scene4-row-meiosis1-bg', 0.6);
                setOpacity('scene4-row-mitosis-bg', 0.3);
                setOpacity('scene4-row-meiosis2-bg', 0.3);
                setOpacity('scene4-label-stage', 1);
                setOpacity('scene4-label-substage', 1);
            }

            if (step >= 4) {
                setOpacity('scene4-label-x', 1);
                setOpacity('scene4-label-y', 1);
                setOpacity('scene4-genotype-info', 1);
                setOpacity('scene4-pedigree-highlight', 1);
                setOpacity('scene4-label-stage', 1);
                setOpacity('scene4-label-substage', 1);
                setOpacity('scene4-row-meiosis1-bg', 0.6);
            }

            if (step >= 5) {
                setOpacity('scene4-genotype-module-a', 1);
                setOpacity('scene4-genotype-module-b', 1);
                setOpacity('scene4-genotype-hint', 1);
                setOpacity('scene4-gene-aa', 1);
                setOpacity('scene4-gene-bb', 1);
                setOpacity('scene4-genotype-info', 1);
                setOpacity('scene4-pedigree-highlight', 1);
                setOpacity('scene4-label-x', 1);
                setOpacity('scene4-label-y', 1);
                setOpacity('scene4-label-stage', 1);
                setOpacity('scene4-label-substage', 1);
                setOpacity('scene4-row-meiosis1-bg', 0.6);
            }

            if (step >= 6) {
                setOpacity('scene4-genotype-final', 1);
                setOpacity('scene4-genotype-module-a', 1);
                setOpacity('scene4-genotype-module-b', 1);
                setOpacity('scene4-genotype-hint', 1);
                setOpacity('scene4-gene-aa', 1);
                setOpacity('scene4-gene-bb', 1);
                setOpacity('scene4-genotype-info', 1);
                setOpacity('scene4-pedigree-highlight', 1);
                setOpacity('scene4-label-x', 1);
                setOpacity('scene4-label-y', 1);
                setOpacity('scene4-label-stage', 1);
                setOpacity('scene4-label-substage', 1);
                setOpacity('scene4-row-meiosis1-bg', 0.6);
            }
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) updateScene(currentStep - 1);
        });
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) updateScene(currentStep + 1);
        });

        updateScene(0);
    })();
    </script>
</body>
</html>
