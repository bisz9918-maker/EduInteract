<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 4 - 两对相对性状的遗传分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene4-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene4-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene4-btn-prev, #scene4-btn-next {
            padding: 6px 16px; font-size: 14px; border: none; border-radius: 4px;
            background: #1565c0; color: #fff; cursor: pointer; min-width: 100px;
        }
        #scene4-btn-prev:disabled, #scene4-btn-next:disabled {
            opacity: 0.3; cursor: not-allowed;
        }
        #scene4-step-indicator { font-size: 14px; color: #333; min-width: 80px; text-align: center; }
        .scene4-step-group { display: none; }
        .scene4-step-group.active { display: block; }
    </style>
</head>
<body>
    <div id="scene4-container">
        <svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <!-- 步骤0：总览 -->
            <g id="scene4-step0" class="scene4-step-group active">
                <text x="400" y="45" text-anchor="middle" font-size="20" font-weight="bold" fill="#000">两对相对性状的遗传分析</text>
                <text x="200" y="82" text-anchor="middle" font-size="16" fill="#1565c0" font-weight="bold">第(6)问：伴X连锁遗传</text>
                <text x="600" y="82" text-anchor="middle" font-size="16" fill="#2e7d32" font-weight="bold">第(7)问：自由组合定律</text>
                <!-- 中间分隔线 -->
                <line x1="400" y1="40" x2="400" y2="430" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
                <!-- 细胞核 -->
                <ellipse cx="400" cy="220" rx="90" ry="70" fill="#1565c0" fill-opacity="0.1" stroke="#1565c0" stroke-width="2"/>
                <!-- 常染色体1 -->
                <line x1="370" y1="200" x2="390" y2="210" stroke="#888888" stroke-width="3" stroke-linecap="round"/>
                <!-- 常染色体2 -->
                <line x1="410" y1="200" x2="430" y2="210" stroke="#888888" stroke-width="3" stroke-linecap="round"/>
                <!-- X示意 -->
                <path d="M375,240 L385,255 M385,240 L375,255" stroke="#1565c0" stroke-width="3" fill="none" stroke-linecap="round"/>
                <!-- Y示意 -->
                <line x1="415" y1="240" x2="415" y2="255" stroke="#c62828" stroke-width="3" stroke-linecap="round"/>
                <text x="400" y="400" text-anchor="middle" font-size="14" fill="#888888">点击「下一步」开始逐步分析</text>
            </g>

            <!-- 步骤1：第(6)问亲本基因型与染色体定位 -->
            <g id="scene4-step1" class="scene4-step-group">
                <text x="180" y="45" text-anchor="middle" font-size="16" fill="#1565c0" font-weight="bold">第(6)问：伴X连锁遗传</text>
                <!-- 父本 -->
                <text x="80" y="84" text-anchor="middle" font-size="18" fill="#c62828">♂</text>
                <text x="80" y="120" text-anchor="middle" font-size="14" fill="#000">白毛雄性</text>
                <text x="80" y="138" text-anchor="middle" font-size="12" fill="#666">X<sup>ab</sup>Y</text>
                <!-- 父本X染色体 -->
                <line x1="80" y1="138" x2="80" y2="238" stroke="#1565c0" stroke-width="4" stroke-linecap="round"/>
                <line x1="75" y1="178" x2="80" y2="178" stroke="#1565c0" stroke-width="2"/>
                <line x1="75" y1="208" x2="80" y2="208" stroke="#1565c0" stroke-width="2"/>
                <text x="62" y="182" text-anchor="end" font-size="12" fill="#000">a</text>
                <text x="62" y="212" text-anchor="end" font-size="12" fill="#000">b</text>
                <!-- 父本Y染色体 -->
                <line x1="110" y1="138" x2="110" y2="188" stroke="#c62828" stroke-width="4" stroke-linecap="round"/>
                <!-- 母本 -->
                <text x="280" y="84" text-anchor="middle" font-size="18" fill="#1565c0">♀</text>
                <text x="280" y="120" text-anchor="middle" font-size="14" fill="#000">有毛雌性</text>
                <text x="280" y="138" text-anchor="middle" font-size="12" fill="#666">X<sup>aB</sup>X<sup>ab</sup></text>
                <!-- 母本X1染色体 -->
                <line x1="260" y1="138" x2="260" y2="238" stroke="#1565c0" stroke-width="4" stroke-linecap="round"/>
                <line x1="255" y1="178" x2="260" y2="178" stroke="#1565c0" stroke-width="2"/>
                <line x1="255" y1="208" x2="260" y2="208" stroke="#1565c0" stroke-width="2"/>
                <text x="242" y="182" text-anchor="end" font-size="12" fill="#000">a</text>
                <text x="242" y="212" text-anchor="end" font-size="12" fill="#000">B</text>
                <!-- 母本X2染色体 -->
                <line x1="300" y1="138" x2="300" y2="238" stroke="#1565c0" stroke-width="4" stroke-linecap="round"/>
                <line x1="300" y1="178" x2="305" y2="178" stroke="#1565c0" stroke-width="2"/>
                <line x1="300" y1="208" x2="305" y2="208" stroke="#1565c0" stroke-width="2"/>
                <text x="318" y="182" text-anchor="start" font-size="12" fill="#000">a</text>
                <text x="318" y="212" text-anchor="start" font-size="12" fill="#000">b</text>
                <!-- 杂交符号 -->
                <text x="180" y="204" text-anchor="middle" font-size="20" fill="#000">×</text>
            </g>

            <!-- 步骤2：配子与子代比例 -->
            <g id="scene4-step2" class="scene4-step-group">
                <text x="180" y="45" text-anchor="middle" font-size="16" fill="#1565c0" font-weight="bold">配子与子代</text>
                <!-- 母本配子1 -->
                <circle cx="140" cy="200" r="18" fill="#1565c0" fill-opacity="0.2" stroke="#1565c0" stroke-width="1"/>
                <text x="140" y="204" text-anchor="middle" font-size="10" fill="#000">X<sup>aB</sup></text>
                <!-- 母本配子2 -->
                <circle cx="200" cy="200" r="18" fill="#c62828" fill-opacity="0.2" stroke="#c62828" stroke-width="1"/>
                <text x="200" y="204" text-anchor="middle" font-size="10" fill="#000">X<sup>ab</sup></text>
                <!-- 父本配子标签 -->
                <text x="65" y="290" text-anchor="middle" font-size="12" fill="#000">X<sup>ab</sup></text>
                <text x="65" y="350" text-anchor="middle" font-size="12" fill="#000">Y</text>
                <!-- 母本配子标签 -->
                <text x="140" y="245" text-anchor="middle" font-size="12" fill="#000">X<sup>aB</sup></text>
                <text x="200" y="245" text-anchor="middle" font-size="12" fill="#000">X<sup>ab</sup></text>
                <!-- Punnett方格外框 -->
                <rect x="110" y="260" width="120" height="120" fill="none" stroke="#000" stroke-width="2"/>
                <line x1="170" y1="260" x2="170" y2="380" stroke="#000" stroke-width="1"/>
                <line x1="110" y1="320" x2="230" y2="320" stroke="#000" stroke-width="1"/>
                <!-- 格1 -->
                <text x="140" y="275" text-anchor="middle" font-size="10" fill="#000">X<sup>aB</sup>X<sup>ab</sup></text>
                <text x="140" y="292" text-anchor="middle" font-size="10" fill="#1565c0">♀黑毛有毛</text>
                <!-- 格2 -->
                <text x="200" y="275" text-anchor="middle" font-size="10" fill="#000">X<sup>ab</sup>X<sup>ab</sup></text>
                <text x="200" y="292" text-anchor="middle" font-size="10" fill="#c62828">♀白毛无毛</text>
                <!-- 格3 -->
                <text x="140" y="335" text-anchor="middle" font-size="10" fill="#000">X<sup>aB</sup>Y</text>
                <text x="140" y="352" text-anchor="middle" font-size="10" fill="#1565c0">♂黑毛有毛</text>
                <!-- 格4 -->
                <text x="200" y="335" text-anchor="middle" font-size="10" fill="#000">X<sup>ab</sup>Y</text>
                <text x="200" y="352" text-anchor="middle" font-size="10" fill="#c62828">♂白毛无毛</text>
                <!-- 比例标注 -->
                <text x="170" y="400" text-anchor="middle" font-size="14" fill="#000">比例 1:1:1:1</text>
            </g>

            <!-- 步骤3：第(7)问亲本基因型与染色体定位 -->
            <g id="scene4-step3" class="scene4-step-group">
                <text x="600" y="55" text-anchor="middle" font-size="16" fill="#2e7d32" font-weight="bold">第(7)问：自由组合定律</text>
                <!-- 常染色体 -->
                <line x1="520" y1="100" x2="520" y2="200" stroke="#888888" stroke-width="4" stroke-linecap="round"/>
                <circle cx="520" cy="150" r="4" fill="#888888"/>
                <text x="540" y="153" text-anchor="start" font-size="14" fill="#000">C/c</text>
                <text x="520" y="220" text-anchor="middle" font-size="14" fill="#666">常染色体</text>
                <!-- X染色体 -->
                <line x1="640" y1="100" x2="640" y2="200" stroke="#1565c0" stroke-width="4" stroke-linecap="round"/>
                <circle cx="640" cy="150" r="4" fill="#1565c0"/>
                <text x="660" y="153" text-anchor="start" font-size="14" fill="#000">A/a</text>
                <text x="640" y="220" text-anchor="middle" font-size="14" fill="#666">X染色体</text>
                <!-- Y染色体 -->
                <line x1="700" y1="100" x2="700" y2="150" stroke="#c62828" stroke-width="4" stroke-linecap="round"/>
                <text x="700" y="168" text-anchor="middle" font-size="14" fill="#c62828">Y</text>
                <!-- 亲本杂交 -->
                <text x="600" y="280" text-anchor="middle" font-size="16" fill="#000">卷毛 × 直毛</text>
                <text x="600" y="300" text-anchor="middle" font-size="12" fill="#666">ccX<sup>A</sup>X<sup>a</sup> × CCX<sup>A</sup>Y</text>
            </g>

            <!-- 步骤4：自由组合验证 -->
            <g id="scene4-step4" class="scene4-step-group">
                <text x="600" y="45" text-anchor="middle" font-size="16" fill="#2e7d32" font-weight="bold">自由组合验证</text>
                <text x="600" y="80" text-anchor="middle" font-size="14" fill="#000">P: 卷毛 × 直毛</text>
                <!-- 分支线 -->
                <line x1="600" y1="93" x2="480" y2="135" stroke="#000" stroke-width="1"/>
                <line x1="600" y1="93" x2="720" y2="135" stroke="#000" stroke-width="1"/>
                <!-- 节点1 -->
                <text x="480" y="147" text-anchor="middle" font-size="12" fill="#000">Cc 直毛 1</text>
                <!-- 节点2 -->
                <text x="720" y="147" text-anchor="middle" font-size="12" fill="#000">X<sup>A</sup>X<sup>a</sup>×X<sup>A</sup>Y</text>
                <!-- 子分支 -->
                <line x1="480" y1="160" x2="480" y2="205" stroke="#000" stroke-width="1"/>
                <line x1="720" y1="160" x2="660" y2="205" stroke="#000" stroke-width="1"/>
                <line x1="720" y1="160" x2="780" y2="205" stroke="#000" stroke-width="1"/>
                <!-- 中间节点 -->
                <text x="480" y="217" text-anchor="middle" font-size="12" fill="#000">直毛 1</text>
                <text x="660" y="217" text-anchor="middle" font-size="12" fill="#000">有毛 3/4</text>
                <text x="780" y="217" text-anchor="middle" font-size="12" fill="#000">无毛 1/4</text>
                <!-- 交叉线 -->
                <line x1="480" y1="230" x2="570" y2="275" stroke="#000" stroke-width="1"/>
                <line x1="660" y1="230" x2="570" y2="275" stroke="#000" stroke-width="1"/>
                <line x1="480" y1="230" x2="690" y2="275" stroke="#000" stroke-width="1"/>
                <line x1="780" y1="230" x2="690" y2="275" stroke="#000" stroke-width="1"/>
                <!-- 结果 -->
                <text x="570" y="287" text-anchor="middle" font-size="12" fill="#2e7d32">直毛有毛 3/4</text>
                <text x="690" y="287" text-anchor="middle" font-size="12" fill="#2e7d32">直毛无毛 1/4</text>
                <!-- 结论 -->
                <text x="600" y="345" text-anchor="middle" font-size="16" fill="#2e7d32" font-weight="bold">遵循基因的自由组合定律</text>
            </g>

            <!-- 步骤5：总结对比 -->
            <g id="scene4-step5" class="scene4-step-group">
                <!-- 中间分隔线 -->
                <line x1="400" y1="40" x2="400" y2="430" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
                <!-- 左栏 -->
                <text x="200" y="55" text-anchor="middle" font-size="16" fill="#1565c0" font-weight="bold">连锁遗传</text>
                <line x1="200" y1="110" x2="200" y2="180" stroke="#1565c0" stroke-width="4" stroke-linecap="round"/>
                <text x="182" y="135" text-anchor="end" font-size="12" fill="#000">A</text>
                <text x="182" y="160" text-anchor="end" font-size="12" fill="#000">B</text>
                <text x="200" y="210" text-anchor="middle" font-size="12" fill="#000">两基因在同一条X上</text>
                <text x="200" y="235" text-anchor="middle" font-size="12" fill="#1565c0" font-weight="bold">连锁遗传</text>
                <text x="200" y="270" text-anchor="middle" font-size="12" fill="#000">子代比例由配子决定</text>
                <text x="200" y="310" text-anchor="middle" font-size="14" fill="#000">例：1:1:1:1</text>
                <!-- 右栏 -->
                <text x="600" y="55" text-anchor="middle" font-size="16" fill="#2e7d32" font-weight="bold">自由组合</text>
                <line x1="560" y1="110" x2="560" y2="170" stroke="#888888" stroke-width="4" stroke-linecap="round"/>
                <line x1="640" y1="110" x2="640" y2="180" stroke="#1565c0" stroke-width="4" stroke-linecap="round"/>
                <line x1="670" y1="110" x2="670" y2="140" stroke="#c62828" stroke-width="4" stroke-linecap="round"/>
                <text x="600" y="210" text-anchor="middle" font-size="12" fill="#000">两基因位于非同源染色体</text>
                <text x="600" y="235" text-anchor="middle" font-size="12" fill="#2e7d32" font-weight="bold">自由组合定律</text>
                <text x="600" y="270" text-anchor="middle" font-size="12" fill="#000">子代比例=各自比例乘积</text>
                <text x="600" y="310" text-anchor="middle" font-size="12" fill="#000">3/4 × 1 = 3/4</text>
                <text x="600" y="335" text-anchor="middle" font-size="12" fill="#000">1/4 × 1 = 1/4</text>
                <!-- VS标志 -->
                <text x="400" y="200" text-anchor="middle" font-size="18" fill="#888888" font-weight="bold">VS</text>
                <!-- 核心区别 -->
                <text x="400" y="400" text-anchor="middle" font-size="14" fill="#000">基因是否位于非同源染色体上</text>
            </g>
        </svg>

        <div id="scene4-controls">
            <button id="scene4-btn-prev" disabled>◀ 上一步</button>
            <span id="scene4-step-indicator">步骤 0/5</span>
            <button id="scene4-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const totalSteps = 5;
        const prevBtn = document.getElementById('scene4-btn-prev');
        const nextBtn = document.getElementById('scene4-btn-next');
        const indicator = document.getElementById('scene4-step-indicator');

        function updateStep() {
            // 隐藏所有步骤
            for (let i = 0; i <= totalSteps; i++) {
                const group = document.getElementById('scene4-step' + i);
                if (group) {
                    group.classList.remove('active');
                }
            }
            // 显示当前步骤
            const currentGroup = document.getElementById('scene4-step' + currentStep);
            if (currentGroup) {
                currentGroup.classList.add('active');
            }
            // 更新按钮状态
            prevBtn.disabled = currentStep === 0;
            nextBtn.disabled = currentStep === totalSteps;
            // 更新指示器
            indicator.textContent = '步骤 ' + currentStep + '/' + totalSteps;
        }

        prevBtn.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });

        nextBtn.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateStep();
            }
        });

        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
