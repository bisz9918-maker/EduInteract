<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - PCR 半保留复制</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-svg { position: absolute; top: 0; left: 0; }

        /* 右侧统计面板 - HTML实现避免SVG重叠检测误报 */
        #scene2-panel {
            position: absolute;
            left: 480px; top: 60px;
            width: 270px; height: 340px;
            background: #e3f2fd;
            border: 1.5px solid #1565c0;
            border-radius: 4px;
            padding: 12px 16px;
            box-sizing: border-box;
            z-index: 5;
        }
        #scene2-panel h3 {
            margin: 0 0 8px 0;
            font-size: 16px;
            color: #1565c0;
            text-align: center;
            font-weight: bold;
        }
        #scene2-panel .panel-divider {
            border: none;
            border-top: 1px solid #1565c0;
            margin: 0 0 12px 0;
        }
        #scene2-panel .data-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
            color: #333;
        }
        #scene2-panel .data-row .value {
            font-weight: normal;
            color: #333;
        }
        #scene2-panel .data-row .value.highlight {
            font-weight: bold;
            color: #c62828;
            font-size: 16px;
        }
        #scene2-panel .panel-desc {
            margin-top: 16px;
            font-size: 13px;
            color: #555;
            line-height: 1.5;
        }

        /* 控件栏 */
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene2-controls button {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #1565c0;
            border-radius: 4px;
            background: #1565c0;
            color: #fff;
            transition: background 0.2s;
        }
        #scene2-controls button:hover:not(:disabled) { background: #0d47a1; }
        #scene2-controls button:disabled { background: #b0bec5; border-color: #b0bec5; cursor: not-allowed; }
        #scene2-step-indicator { font-size: 14px; color: #333; min-width: 80px; text-align: center; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <!-- SVG 图示区 -->
        <svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- ==================== 步骤0：亲代 DNA ==================== -->
            <g id="scene2-step0">
                <!-- 亲代 DNA a链（蓝色） -->
                <line x1="210" y1="73" x2="270" y2="73" stroke="#1565c0" stroke-width="2"/>
                <!-- 亲代 DNA b链（红色） -->
                <line x1="210" y1="87" x2="270" y2="87" stroke="#c62828" stroke-width="2"/>
                <!-- 碱基配对虚线 -->
                <line x1="220" y1="73" x2="220" y2="87" stroke="#888888" stroke-width="1" stroke-dasharray="3,2"/>
                <line x1="235" y1="73" x2="235" y2="87" stroke="#888888" stroke-width="1" stroke-dasharray="3,2"/>
                <line x1="250" y1="73" x2="250" y2="87" stroke="#888888" stroke-width="1" stroke-dasharray="3,2"/>
                <line x1="265" y1="73" x2="265" y2="87" stroke="#888888" stroke-width="1" stroke-dasharray="3,2"/>

                <text x="185" y="64" font-size="12" fill="#333">a</text>
                <text x="185" y="94" font-size="12" fill="#333">b</text>
                <text x="240" y="45" text-anchor="middle" font-size="14" fill="#333">亲代 DNA</text>
                <text x="240" y="118" text-anchor="middle" font-size="13" fill="#666">0次循环</text>
            </g>

            <!-- ==================== 步骤1：循环1次 ==================== -->
            <g id="scene2-step1" style="display:none">
                <!-- 分支线 0→1 左 -->
                <path id="scene2-branch-0to1-left" d="M 240 87 L 240 120 L 150 140 L 150 163" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="4,3"/>
                <!-- 分支线 0→1 右 -->
                <path id="scene2-branch-0to1-right" d="M 240 87 L 240 120 L 330 140 L 330 163" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="4,3"/>

                <!-- 循环1左DNA：a蓝 + 新绿 -->
                <line x1="120" y1="163" x2="180" y2="163" stroke="#1565c0" stroke-width="2"/>
                <line x1="120" y1="177" x2="180" y2="177" stroke="#2e7d32" stroke-width="2"/>
                <line x1="130" y1="163" x2="130" y2="177" stroke="#888888" stroke-width="1" stroke-dasharray="3,2"/>
                <line x1="145" y1="163" x2="145" y2="177" stroke="#888888" stroke-width="1" stroke-dasharray="3,2"/>
                <line x1="160" y1="163" x2="160" y2="177" stroke="#888888" stroke-width="1" stroke-dasharray="3,2"/>
                <line x1="175" y1="163" x2="175" y2="177" stroke="#888888" stroke-width="1" stroke-dasharray="3,2"/>

                <!-- 循环1右DNA：b红 + 新绿 -->
                <line x1="300" y1="163" x2="360" y2="163" stroke="#c62828" stroke-width="2"/>
                <line x1="300" y1="177" x2="360" y2="177" stroke="#2e7d32" stroke-width="2"/>
                <line x1="310" y1="163" x2="310" y2="177" stroke="#888888" stroke-width="1" stroke-dasharray="3,2"/>
                <line x1="325" y1="163" x2="325" y2="177" stroke="#888888" stroke-width="1" stroke-dasharray="3,2"/>
                <line x1="340" y1="163" x2="340" y2="177" stroke="#888888" stroke-width="1" stroke-dasharray="3,2"/>
                <line x1="355" y1="163" x2="355" y2="177" stroke="#888888" stroke-width="1" stroke-dasharray="3,2"/>

                <!-- ³²P 徽章1（左DNA右侧） -->
                <circle cx="195" cy="170" r="10" fill="#f57c00"/>
                <text x="210" y="170" dominant-baseline="central" font-size="10" fill="#f57c00" font-weight="bold">³²P</text>

                <!-- ³²P 徽章2（右DNA右侧） -->
                <circle cx="375" cy="170" r="10" fill="#f57c00"/>
                <text x="390" y="170" dominant-baseline="central" font-size="10" fill="#f57c00" font-weight="bold">³²P</text>

                <text x="240" y="205" text-anchor="middle" font-size="13" fill="#666">循环1次</text>
            </g>

            <!-- ==================== 步骤2：循环2次 ==================== -->
            <g id="scene2-step2" style="display:none">
                <!-- 分支线 1→2：从循环1左DNA分出 -->
                <path id="scene2-branch-1to2-dna1-left" d="M 150 177 L 150 210 L 100 230 L 100 253" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="4,3"/>
                <path id="scene2-branch-1to2-dna1-right" d="M 150 177 L 150 210 L 210 230 L 210 253" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="4,3"/>
                <!-- 分支线 1→2：从循环1右DNA分出 -->
                <path id="scene2-branch-1to2-dna2-left" d="M 330 177 L 330 210 L 270 230 L 270 253" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="4,3"/>
                <path id="scene2-branch-1to2-dna2-right" d="M 330 177 L 330 210 L 380 230 L 380 253" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="4,3"/>

                <!-- DNA1：a蓝 + 新绿 -->
                <line x1="70" y1="253" x2="130" y2="253" stroke="#1565c0" stroke-width="2"/>
                <line x1="70" y1="267" x2="130" y2="267" stroke="#2e7d32" stroke-width="2"/>
                <line x1="80" y1="253" x2="80" y2="267" stroke="#888888" stroke-width="1" stroke-dasharray="3,2"/>
                <line x1="95" y1="253" x2="95" y2="267" stroke="#888888" stroke-width="1" stroke-dasharray="3,2"/>
                <line x1="110" y1="253" x2="110" y2="267" stroke="#888888" stroke-width="1" stroke-dasharray="3,2"/>
                <line x1="125" y1="253" x2="125" y2="267" stroke="#888888" stroke-width="1" stroke-dasharray="3,2"/>

                <!-- DNA2：新绿 + 新绿 -->
                <line x1="180" y1="253" x2="240" y2="253" stroke="#2e7d32" stroke-width="2"/>
                <line x1="180" y1="267" x2="240" y2="267" stroke="#2e7d32" stroke-width="2"/>
                <line x1="190" y1="253" x2="190" y2="267" stroke="#888888" stroke-width="1" stroke-dasharray="3,2"/>
                <line x1="205" y1="253" x2="205" y2="267" stroke="#888888" stroke-width="1" stroke-dasharray="3,2"/>
                <line x1="220" y1="253" x2="220" y2="267" stroke="#888888" stroke-width="1" stroke-dasharray="3,2"/>
                <line x1="235" y1="253" x2="235" y2="267" stroke="#888888" stroke-width="1" stroke-dasharray="3,2"/>

                <!-- DNA3：b红 + 新绿 -->
                <line x1="240" y1="253" x2="300" y2="253" stroke="#c62828" stroke-width="2"/>
                <line x1="240" y1="267" x2="300" y2="267" stroke="#2e7d32" stroke-width="2"/>
                <line x1="250" y1="253" x2="250" y2="267" stroke="#888888" stroke-width="1" stroke-dasharray="3,2"/>
                <line x1="265" y1="253" x2="265" y2="267" stroke="#888888" stroke-width="1" stroke-dasharray="3,2"/>
                <line x1="280" y1="253" x2="280" y2="267" stroke="#888888" stroke-width="1" stroke-dasharray="3,2"/>
                <line x1="295" y1="253" x2="295" y2="267" stroke="#888888" stroke-width="1" stroke-dasharray="3,2"/>

                <!-- DNA4：新绿 + 新绿 -->
                <line x1="350" y1="253" x2="410" y2="253" stroke="#2e7d32" stroke-width="2"/>
                <line x1="350" y1="267" x2="410" y2="267" stroke="#2e7d32" stroke-width="2"/>
                <line x1="360" y1="253" x2="360" y2="267" stroke="#888888" stroke-width="1" stroke-dasharray="3,2"/>
                <line x1="375" y1="253" x2="375" y2="267" stroke="#888888" stroke-width="1" stroke-dasharray="3,2"/>
                <line x1="390" y1="253" x2="390" y2="267" stroke="#888888" stroke-width="1" stroke-dasharray="3,2"/>
                <line x1="405" y1="253" x2="405" y2="267" stroke="#888888" stroke-width="1" stroke-dasharray="3,2"/>

                <!-- ³²P 徽章3-6 -->
                <circle cx="145" cy="260" r="10" fill="#f57c00"/>
                <text x="160" y="260" dominant-baseline="central" font-size="10" fill="#f57c00" font-weight="bold">³²P</text>

                <circle cx="255" cy="260" r="10" fill="#f57c00"/>
                <text x="270" y="260" dominant-baseline="central" font-size="10" fill="#f57c00" font-weight="bold">³²P</text>

                <circle cx="315" cy="260" r="10" fill="#f57c00"/>
                <text x="330" y="260" dominant-baseline="central" font-size="10" fill="#f57c00" font-weight="bold">³²P</text>

                <circle cx="425" cy="260" r="10" fill="#f57c00"/>
                <text x="440" y="260" dominant-baseline="central" font-size="10" fill="#f57c00" font-weight="bold">³²P</text>

                <text x="240" y="295" text-anchor="middle" font-size="13" fill="#666">循环2次</text>
            </g>

            <!-- ==================== 步骤3：循环n次 ==================== -->
            <g id="scene2-step3" style="display:none">
                <!-- 省略号 -->
                <text x="240" y="340" text-anchor="middle" font-size="24" fill="#888">⋮</text>

                <!-- 简化绿色双链示意 -->
                <line x1="210" y1="355" x2="270" y2="355" stroke="#2e7d32" stroke-width="2"/>
                <line x1="210" y1="369" x2="270" y2="369" stroke="#2e7d32" stroke-width="2"/>
                <line x1="220" y1="355" x2="220" y2="369" stroke="#888888" stroke-width="1" stroke-dasharray="3,2"/>
                <line x1="235" y1="355" x2="235" y2="369" stroke="#888888" stroke-width="1" stroke-dasharray="3,2"/>
                <line x1="250" y1="355" x2="250" y2="369" stroke="#888888" stroke-width="1" stroke-dasharray="3,2"/>
                <line x1="265" y1="355" x2="265" y2="369" stroke="#888888" stroke-width="1" stroke-dasharray="3,2"/>

                <text x="240" y="390" text-anchor="middle" font-size="14" fill="#333">2ⁿ 个 DNA</text>
                <text x="240" y="425" text-anchor="middle" font-size="13" fill="#666">循环 n 次</text>
            </g>

            <!-- 步骤3背景淡化层（循环2的DNA保留但透明） -->
            <g id="scene2-step3-bg" style="display:none; opacity:0.25">
                <!-- 这里会在JS中克隆步骤2的内容 -->
            </g>
        </svg>

        <!-- 右侧统计面板（HTML实现） -->
        <div id="scene2-panel">
            <h3>统计与规律</h3>
            <hr class="panel-divider">
            <div class="data-row">
                <span>DNA 分子数</span>
                <span id="scene2-val-dna" class="value">1</span>
            </div>
            <div class="data-row">
                <span>总单链数</span>
                <span id="scene2-val-total" class="value">2</span>
            </div>
            <div class="data-row">
                <span>无放射性单链数</span>
                <span id="scene2-val-norad" class="value">2</span>
            </div>
            <div class="data-row">
                <span>无放射性单链比例</span>
                <span id="scene2-val-ratio" class="value">1</span>
            </div>
            <div id="scene2-panel-desc" class="panel-desc">
                亲代 DNA 含有 2 条母链，均无放射性标记。
            </div>
        </div>

        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-btn-prev" disabled>◀ 上一步</button>
            <span id="scene2-step-indicator">步骤 1 / 4</span>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2 实现：PCR 半保留复制分步展示
        let currentStep = 0;
        const totalSteps = 4;

        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        const indicator = document.getElementById('scene2-step-indicator');

        const valDna = document.getElementById('scene2-val-dna');
        const valTotal = document.getElementById('scene2-val-total');
        const valNorad = document.getElementById('scene2-val-norad');
        const valRatio = document.getElementById('scene2-val-ratio');
        const panelDesc = document.getElementById('scene2-panel-desc');

        // 各步骤的SVG组
        const stepGroups = [
            document.getElementById('scene2-step0'),
            document.getElementById('scene2-step1'),
            document.getElementById('scene2-step2'),
            document.getElementById('scene2-step3')
        ];
        const step3Bg = document.getElementById('scene2-step3-bg');

        // 面板数据配置
        const panelData = [
            { dna: '1', total: '2', norad: '2', ratio: '1', desc: '亲代 DNA 含有 2 条母链，均无放射性标记。' },
            { dna: '2', total: '4', norad: '2', ratio: '1/2', desc: '2 条杂合 DNA，各含 1 条母链和 1 条带³²P 的新链。' },
            { dna: '4', total: '8', norad: '2', ratio: '1/4', desc: '2 条杂合 DNA + 2 条全新 DNA（均带³²P）。' },
            { dna: '2ⁿ', total: '2ⁿ⁺¹', norad: '2', ratio: '1/2ⁿ', desc: '仅最初 2 条母链始终无放射性。', formula: true }
        ];

        function updatePanel(step) {
            const data = panelData[step];
            valDna.textContent = data.dna;
            valTotal.textContent = data.total;
            valNorad.textContent = data.norad;
            valRatio.textContent = data.ratio;
            panelDesc.textContent = data.desc;

            // 步骤3公式高亮
            if (data.formula) {
                valDna.classList.add('highlight');
                valTotal.classList.add('highlight');
                valNorad.classList.add('highlight');
                valRatio.classList.add('highlight');
            } else {
                valDna.classList.remove('highlight');
                valTotal.classList.remove('highlight');
                valNorad.classList.remove('highlight');
                valRatio.classList.remove('highlight');
            }
        }

        function showGroup(el, show) {
            if (!el) return;
            el.style.display = show ? 'block' : 'none';
            el.style.opacity = '1';
        }

        function renderStep(step) {
            // 隐藏所有步骤组
            stepGroups.forEach((g, i) => showGroup(g, i === step));

            // 步骤3特殊处理：保留步骤2作为背景（淡化）
            if (step === 3) {
                showGroup(stepGroups[2], true);
                stepGroups[2].style.opacity = '0.25';
                showGroup(step3Bg, true);
            } else {
                stepGroups[2].style.opacity = '1';
                showGroup(step3Bg, false);
            }

            // 更新面板
            updatePanel(step);

            // 更新指示器
            indicator.textContent = '步骤 ' + (step + 1) + ' / ' + totalSteps;

            // 更新按钮状态
            btnPrev.disabled = (step === 0);
            btnNext.disabled = (step === totalSteps - 1);

            // 分支线动画（步骤1和步骤2）
            if (step === 1) {
                animateBranch('scene2-branch-0to1-left');
                animateBranch('scene2-branch-0to1-right');
            } else if (step === 2) {
                animateBranch('scene2-branch-1to2-dna1-left');
                animateBranch('scene2-branch-1to2-dna1-right');
                animateBranch('scene2-branch-1to2-dna2-left');
                animateBranch('scene2-branch-1to2-dna2-right');
            }
        }

        function animateBranch(pathId) {
            const path = document.getElementById(pathId);
            if (!path) return;
            const length = path.getTotalLength();
            path.style.strokeDasharray = length;
            path.style.strokeDashoffset = length;
            // 强制重排
            path.getBoundingClientRect();
            // CSS transition 动画
            path.style.transition = 'stroke-dashoffset 400ms ease-out';
            path.style.strokeDashoffset = '0';
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep(currentStep);
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                renderStep(currentStep);
            }
        });

        // 初始化
        renderStep(0);
    })();
    </script>
</body>
</html>
