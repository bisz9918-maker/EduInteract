<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 1 - 周长比较</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            padding: 6px 16px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #f5f5f5;
            font-family: inherit;
        }
        #scene1-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene1-controls button:disabled { opacity: 0.4; cursor: not-allowed; }

        #scene1-step1-group, #scene1-step2-group, #scene1-step3-group {
            transition: opacity 300ms ease;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <defs>
                <!-- 斜线填充 pattern -->
                <pattern id="scene1-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
                    <line x1="0" y1="0" x2="0" y2="10" stroke="#000000" stroke-width="1" opacity="0.2"/>
                </pattern>
                <!-- 蓝色箭头 marker -->
                <marker id="scene1-arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
                    <path d="M0,0 L10,5 L0,10 L3,5 Z" fill="#1565c0"/>
                </marker>
                <!-- 红色箭头 marker (起点方向) -->
                <marker id="scene1-arrow-red-start" markerWidth="10" markerHeight="10" refX="0" refY="5" orient="auto">
                    <path d="M10,0 L0,5 L10,10 L7,5 Z" fill="#c62828"/>
                </marker>
                <!-- 红色箭头 marker (终点方向) -->
                <marker id="scene1-arrow-red-end" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
                    <path d="M0,0 L10,5 L0,10 L3,5 Z" fill="#c62828"/>
                </marker>
            </defs>

            <!-- 基础元素（始终显示） -->
            <g id="scene1-base-group">
                <!-- 甲外框 -->
                <rect id="scene1-jia-outline" x="100" y="160" width="200" height="140" fill="none" stroke="#888888" stroke-width="1.5" stroke-dasharray="6,4"/>
                <!-- 乙外框 -->
                <rect id="scene1-yi-outline" x="450" y="160" width="200" height="140" fill="none" stroke="#888888" stroke-width="1.5" stroke-dasharray="6,4"/>

                <!-- 甲图形 -->
                <polygon id="scene1-jia-shape" points="100,160 140,160 140,195 180,195 180,160 220,160 220,195 260,195 260,160 300,160 300,300 100,300" fill="url(#scene1-hatch)" stroke="#000000" stroke-width="2"/>
                <!-- 乙图形 -->
                <polygon id="scene1-yi-shape" points="450,160 490,160 490,230 610,230 610,160 650,160 650,300 450,300" fill="url(#scene1-hatch)" stroke="#000000" stroke-width="2"/>

                <!-- 内部标签：放在图形上方，避免与图形重叠 -->
                <text id="scene1-jia-label" x="200" y="150" text-anchor="middle" font-size="20" font-weight="bold" fill="#000000">甲</text>
                <text id="scene1-yi-label" x="550" y="150" text-anchor="middle" font-size="20" font-weight="bold" fill="#000000">乙</text>

                <!-- 尺寸标注 -->
                <text id="scene1-jia-length" x="200" y="320" text-anchor="middle" font-size="16" fill="#000000">长</text>
                <text id="scene1-yi-length" x="550" y="320" text-anchor="middle" font-size="16" fill="#000000">长</text>
                <text id="scene1-jia-width" x="82" y="235" text-anchor="middle" font-size="16" fill="#000000">宽</text>
                <text id="scene1-yi-width" x="432" y="235" text-anchor="middle" font-size="16" fill="#000000">宽</text>
            </g>

            <!-- 步骤1：水平边平移 -->
            <g id="scene1-step1-group" style="display:none; opacity:0;">
                <!-- 甲的水平边高亮 -->
                <line class="scene1-h-edge" x1="100" y1="160" x2="140" y2="160" stroke="#1565c0" stroke-width="3"/>
                <line class="scene1-h-edge" x1="140" y1="195" x2="180" y2="195" stroke="#1565c0" stroke-width="3"/>
                <line class="scene1-h-edge" x1="180" y1="160" x2="220" y2="160" stroke="#1565c0" stroke-width="3"/>
                <line class="scene1-h-edge" x1="220" y1="195" x2="260" y2="195" stroke="#1565c0" stroke-width="3"/>
                <line class="scene1-h-edge" x1="260" y1="160" x2="300" y2="160" stroke="#1565c0" stroke-width="3"/>
                <line class="scene1-h-edge" x1="100" y1="300" x2="300" y2="300" stroke="#1565c0" stroke-width="3"/>

                <!-- 乙的水平边高亮 -->
                <line class="scene1-h-edge" x1="450" y1="160" x2="490" y2="160" stroke="#1565c0" stroke-width="3"/>
                <line class="scene1-h-edge" x1="490" y1="230" x2="610" y2="230" stroke="#1565c0" stroke-width="3"/>
                <line class="scene1-h-edge" x1="610" y1="160" x2="650" y2="160" stroke="#1565c0" stroke-width="3"/>
                <line class="scene1-h-edge" x1="450" y1="300" x2="650" y2="300" stroke="#1565c0" stroke-width="3"/>

                <!-- 平移目标线 -->
                <line id="scene1-jia-target-line" x1="100" y1="125" x2="300" y2="125" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="6,4"/>
                <line id="scene1-yi-target-line" x1="450" y1="125" x2="650" y2="125" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="6,4"/>

                <!-- 平移箭头 -->
                <line class="scene1-translate-arrow" x1="120" y1="160" x2="120" y2="130" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#scene1-arrow-blue)"/>
                <line class="scene1-translate-arrow" x1="160" y1="195" x2="160" y2="130" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#scene1-arrow-blue)"/>
                <line class="scene1-translate-arrow" x1="200" y1="160" x2="200" y2="130" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#scene1-arrow-blue)"/>
                <line class="scene1-translate-arrow" x1="240" y1="195" x2="240" y2="130" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#scene1-arrow-blue)"/>
                <line class="scene1-translate-arrow" x1="280" y1="160" x2="280" y2="130" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#scene1-arrow-blue)"/>
                <line class="scene1-translate-arrow" x1="470" y1="160" x2="470" y2="130" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#scene1-arrow-blue)"/>
                <line class="scene1-translate-arrow" x1="550" y1="230" x2="550" y2="130" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#scene1-arrow-blue)"/>
                <line class="scene1-translate-arrow" x1="630" y1="160" x2="630" y2="130" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#scene1-arrow-blue)"/>

                <!-- 公式1 -->
                <text id="scene1-formula-h" x="400" y="345" text-anchor="middle" font-size="16" fill="#1565c0">水平边总长 = 2×长</text>
            </g>

            <!-- 步骤2：竖直边分析 -->
            <g id="scene1-step2-group" style="display:none; opacity:0;">
                <!-- 甲的竖直边高亮 -->
                <line class="scene1-v-edge" x1="100" y1="160" x2="100" y2="300" stroke="#c62828" stroke-width="3"/>
                <line class="scene1-v-edge" x1="140" y1="160" x2="140" y2="195" stroke="#c62828" stroke-width="3"/>
                <line class="scene1-v-edge" x1="180" y1="160" x2="180" y2="195" stroke="#c62828" stroke-width="3"/>
                <line class="scene1-v-edge" x1="220" y1="160" x2="220" y2="195" stroke="#c62828" stroke-width="3"/>
                <line class="scene1-v-edge" x1="260" y1="160" x2="260" y2="195" stroke="#c62828" stroke-width="3"/>
                <line class="scene1-v-edge" x1="300" y1="160" x2="300" y2="300" stroke="#c62828" stroke-width="3"/>

                <!-- 乙的竖直边高亮 -->
                <line class="scene1-v-edge" x1="450" y1="160" x2="450" y2="300" stroke="#c62828" stroke-width="3"/>
                <line class="scene1-v-edge" x1="490" y1="160" x2="490" y2="230" stroke="#c62828" stroke-width="3"/>
                <line class="scene1-v-edge" x1="610" y1="160" x2="610" y2="230" stroke="#c62828" stroke-width="3"/>
                <line class="scene1-v-edge" x1="650" y1="160" x2="650" y2="300" stroke="#c62828" stroke-width="3"/>

                <!-- 深度双向箭头 -->
                <line id="scene1-depth-arrow-d" x1="122" y1="160" x2="122" y2="195" stroke="#c62828" stroke-width="2" marker-start="url(#scene1-arrow-red-start)" marker-end="url(#scene1-arrow-red-end)"/>
                <line id="scene1-depth-arrow-2d" x1="472" y1="160" x2="472" y2="230" stroke="#c62828" stroke-width="2" marker-start="url(#scene1-arrow-red-start)" marker-end="url(#scene1-arrow-red-end)"/>

                <!-- 深度标注：移到图形左侧，避免重叠 -->
                <text id="scene1-label-d" x="95" y="178" text-anchor="end" font-size="16" fill="#c62828">d</text>
                <text id="scene1-label-2d" x="445" y="195" text-anchor="end" font-size="16" fill="#c62828">2d</text>

                <!-- 公式2：下移避免与"长"拥挤 -->
                <text id="scene1-formula-v-jia" x="200" y="365" text-anchor="middle" font-size="16" fill="#c62828">竖直边 = 2×宽 + 4d</text>
                <text id="scene1-formula-v-yi" x="550" y="365" text-anchor="middle" font-size="16" fill="#c62828">竖直边 = 2×宽 + 4d</text>
            </g>

            <!-- 步骤3：得出结论 -->
            <g id="scene1-step3-group" style="display:none; opacity:0;">
                <!-- 公式3：上移 -->
                <text id="scene1-formula-final" x="400" y="335" text-anchor="middle" font-size="16" fill="#2e7d32">周长 = 2×长 + 2×宽 + 4d</text>

                <!-- 结论：下移增加间距 -->
                <text id="scene1-conclusion-text" x="400" y="390" text-anchor="middle" font-size="18" fill="#2e7d32" font-weight="bold">C．甲＝乙</text>
            </g>

            <!-- 步骤指示器 -->
            <text id="scene1-step-indicator" x="400" y="442" text-anchor="middle" font-size="14" fill="#000000">步骤 1/4：原图观察</text>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        let currentStep = 0;
        const totalSteps = 4;
        const stepNames = ['原图观察', '水平边平移', '竖直边分析', '得出结论'];

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');

        const stepGroups = [
            null, // step0 没有专属 group，使用 base-group
            document.getElementById('scene1-step1-group'),
            document.getElementById('scene1-step2-group'),
            document.getElementById('scene1-step3-group')
        ];

        function showGroup(g) {
            if (!g) return;
            g.style.display = 'block';
            requestAnimationFrame(function() {
                g.style.opacity = '1';
            });
        }

        function hideGroup(g) {
            if (!g) return;
            g.style.opacity = '0';
            setTimeout(function() {
                g.style.display = 'none';
            }, 300);
        }

        function renderStep() {
            // 更新步骤指示器
            stepIndicator.textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps + '：' + stepNames[currentStep];

            // 更新按钮状态
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps - 1;

            // 显示/隐藏各步骤专属组
            for (let i = 1; i < stepGroups.length; i++) {
                if (i === currentStep) {
                    showGroup(stepGroups[i]);
                } else {
                    hideGroup(stepGroups[i]);
                }
            }
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                renderStep();
            }
        });

        // 初始渲染
        renderStep();
    })();
    </script>
</body>
</html>
