<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>观察物体 - 场景1</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }

        .scene1-btn {
            min-width: 80px;
            height: 28px;
            padding: 0 12px;
            background: #1565c0;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
            line-height: 28px;
        }
        .scene1-btn:disabled {
            background: #90a4ae;
            cursor: not-allowed;
        }

        .scene1-option-btn {
            min-width: 60px;
            height: 24px;
            padding: 0 8px;
            background: #f5f5f5;
            color: #000000;
            border: 1px solid #cccccc;
            border-radius: 4px;
            font-size: 12px;
            cursor: default;
            font-family: inherit;
            line-height: 22px;
        }
        .scene1-option-btn.correct {
            background: #2e7d32;
            color: #ffffff;
            border-color: #2e7d32;
        }

        #scene1-controls {
            position: absolute;
            bottom: 7px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 12px;
            z-index: 10;
        }

        #scene1-options-bar {
            position: absolute;
            bottom: 43px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 16px;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 300ms ease;
        }
        #scene1-options-bar.show {
            opacity: 1;
            pointer-events: auto;
        }

        .scene1-fade {
            transition: opacity 300ms ease;
        }
        .scene1-hidden { opacity: 0; pointer-events: none; }
        .scene1-show { opacity: 1; }

        .scene1-view-expand {
            transition: all 400ms ease-out;
        }
        .scene1-hidden.scene1-view-expand {
            transform: translateY(-20px);
            opacity: 0;
        }
        .scene1-show.scene1-view-expand {
            transform: translateY(0);
            opacity: 1;
        }

        .scene1-highlight-rect {
            fill: none;
            stroke: #2e7d32;
            stroke-width: 2;
            rx: 4;
        }

        @keyframes scene1-dash {
            from { stroke-dashoffset: 600; }
            to { stroke-dashoffset: 0; }
        }
        .scene1-dash-animate {
            stroke-dasharray: 600;
            stroke-dashoffset: 600;
            animation: scene1-dash 500ms forwards;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" viewBox="0 0 800 500">
            <!-- 图1立体图形 -->
            <g id="scene1-fig1-solid"></g>
            <!-- 图2立体图形 -->
            <g id="scene1-fig2-solid"></g>

            <!-- 标签 -->
            <text id="scene1-label-fig1" x="280" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">图1</text>
            <text id="scene1-label-fig2" x="460" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">图2</text>

            <!-- 观察方向箭头 -->
            <g id="scene1-dir-arrow" class="scene1-fade scene1-hidden">
                <text id="scene1-dir-text" x="160" y="255" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565c0">前面→</text>
            </g>

            <!-- 图1平面视图 -->
            <g id="scene1-fig1-view" class="scene1-fade scene1-hidden scene1-view-expand"></g>
            <!-- 图2平面视图 -->
            <g id="scene1-fig2-view" class="scene1-fade scene1-hidden scene1-view-expand"></g>

            <!-- 结果标注 -->
            <text id="scene1-result-diff" x="400" y="375" text-anchor="middle" font-size="16" font-weight="bold" fill="#c62828" class="scene1-fade scene1-hidden">形状不同</text>
            <text id="scene1-result-same" x="400" y="386" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e7d32" class="scene1-fade scene1-hidden">形状相同</text>

            <!-- 高亮框 -->
            <rect id="scene1-highlight-box" x="240" y="328" width="260" height="40" class="scene1-highlight-rect scene1-hidden" style="opacity:0"/>

            <!-- 答案 -->
            <text id="scene1-answer-text" x="400" y="430" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e7d32" class="scene1-fade scene1-hidden">答案：C</text>
        </svg>

        <!-- 选项栏（HTML按钮，避免SVG text+rect重叠） -->
        <div id="scene1-options-bar">
            <button class="scene1-option-btn">A.左面</button>
            <button class="scene1-option-btn">B.前面</button>
            <button class="scene1-option-btn correct">C.上面</button>
        </div>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn" style="display:none">◀ 上一步</button>
            <button id="scene1-btn-next" class="scene1-btn">下一步：前面观察</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        // 等轴测投影参数：x向量(20,10)，y向量(-20,10)，z向量(0,-25)

        function isoProject(x, y, z, baseX, baseY) {
            return {
                x: baseX + 20*x - 20*y,
                y: baseY + 10*x + 10*y - 25*z
            };
        }

        // 绘制单个立方体的三个可见面（顶面、前面、右侧面）
        function drawCube(group, i, k, baseX, baseY, fillColor, opacity) {
            // 顶面（z=k+1）：(i,1,k+1) → (i+1,1,k+1) → (i+1,0,k+1) → (i,0,k+1)
            const topPts = [
                isoProject(i, 1, k+1, baseX, baseY),
                isoProject(i+1, 1, k+1, baseX, baseY),
                isoProject(i+1, 0, k+1, baseX, baseY),
                isoProject(i, 0, k+1, baseX, baseY)
            ];

            // 前面（y=0）：(i,0,k) → (i+1,0,k) → (i+1,0,k+1) → (i,0,k+1)
            const frontPts = [
                isoProject(i, 0, k, baseX, baseY),
                isoProject(i+1, 0, k, baseX, baseY),
                isoProject(i+1, 0, k+1, baseX, baseY),
                isoProject(i, 0, k+1, baseX, baseY)
            ];

            // 右侧面（x=i+1）：(i+1,1,k) → (i+1,0,k) → (i+1,0,k+1) → (i+1,1,k+1)
            const rightPts = [
                isoProject(i+1, 1, k, baseX, baseY),
                isoProject(i+1, 0, k, baseX, baseY),
                isoProject(i+1, 0, k+1, baseX, baseY),
                isoProject(i+1, 1, k+1, baseX, baseY)
            ];

            [topPts, frontPts, rightPts].forEach(pts => {
                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                const d = `M${pts[0].x.toFixed(1)},${pts[0].y.toFixed(1)} L${pts[1].x.toFixed(1)},${pts[1].y.toFixed(1)} L${pts[2].x.toFixed(1)},${pts[2].y.toFixed(1)} L${pts[3].x.toFixed(1)},${pts[3].y.toFixed(1)} Z`;
                path.setAttribute('d', d);
                path.setAttribute('fill', fillColor);
                path.setAttribute('fill-opacity', opacity);
                path.setAttribute('stroke', '#000000');
                path.setAttribute('stroke-width', '1.5');
                path.setAttribute('stroke-linejoin', 'round');
                group.appendChild(path);
            });
        }

        // 绘制组合体：按x从小到大、z从小到大排序，确保遮挡关系正确
        function drawSolid(group, cubes, baseX, baseY, fillColor, opacity) {
            const sorted = cubes.slice().sort((a, b) => {
                if (a[0] !== b[0]) return a[0] - b[0];
                return a[2] - b[2];
            });
            sorted.forEach(cube => {
                drawCube(group, cube[0], cube[2], baseX, baseY, fillColor, opacity);
            });
        }

        // 绘制平面视图网格（列高度数组）
        function drawGridView(group, centerX, bottomY, cols, heights, fillColor, opacity) {
            group.innerHTML = '';
            const cellSize = 20;
            const maxH = Math.max(...heights);
            const totalW = cols * cellSize;
            const leftX = centerX - totalW / 2;

            // 绘制每个填充格子
            for (let c = 0; c < cols; c++) {
                const h = heights[c];
                for (let r = 0; r < h; r++) {
                    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                    rect.setAttribute('x', leftX + c * cellSize);
                    rect.setAttribute('y', bottomY - (r + 1) * cellSize);
                    rect.setAttribute('width', cellSize);
                    rect.setAttribute('height', cellSize);
                    rect.setAttribute('fill', fillColor);
                    rect.setAttribute('fill-opacity', opacity);
                    rect.setAttribute('stroke', '#888888');
                    rect.setAttribute('stroke-width', '0.5');
                    group.appendChild(rect);
                }
            }

            // 外轮廓路径（跟随各列高度）
            const outline = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            let d = `M${leftX},${bottomY} `;
            d += `L${leftX + totalW},${bottomY} `;
            d += `L${leftX + totalW},${bottomY - heights[cols-1] * cellSize} `;
            for (let c = cols - 1; c > 0; c--) {
                d += `L${leftX + c * cellSize},${bottomY - heights[c] * cellSize} `;
                d += `L${leftX + c * cellSize},${bottomY - heights[c-1] * cellSize} `;
            }
            d += `L${leftX},${bottomY - heights[0] * cellSize} `;
            d += `Z`;

            outline.setAttribute('d', d);
            outline.setAttribute('fill', 'none');
            outline.setAttribute('stroke', '#000000');
            outline.setAttribute('stroke-width', '1.5');
            group.appendChild(outline);
        }

        // 初始化立体图形
        // 图1（阶梯状）：6个正方体
        const fig1Cubes = [[0,0,0],[1,0,0],[2,0,0],[1,0,1],[2,0,1],[2,0,2]];
        // 图2（凹形状）：5个正方体
        const fig2Cubes = [[0,0,0],[1,0,0],[2,0,0],[0,0,1],[2,0,1]];

        drawSolid(document.getElementById('scene1-fig1-solid'), fig1Cubes, 260, 210, '#e3f2fd', 0.2);
        drawSolid(document.getElementById('scene1-fig2-solid'), fig2Cubes, 440, 210, '#f5f5f5', 0.2);

        // 分步状态配置
        let currentStep = 0;

        const stepConfig = [
            { // 步骤0：初始状态
                nextText: '下一步：前面观察',
                prevShow: false,
                nextDisabled: false
            },
            { // 步骤1：前面观察
                nextText: '下一步：左面观察',
                prevShow: true,
                nextDisabled: false,
                dirText: '前面→',
                fig1Heights: [1,2,3],
                fig2Heights: [2,1,2],
                result: 'diff'
            },
            { // 步骤2：左面观察
                nextText: '下一步：上面观察',
                prevShow: true,
                nextDisabled: false,
                dirText: '左面→',
                fig1Heights: [3],
                fig2Heights: [2],
                result: 'diff'
            },
            { // 步骤3：上面观察
                nextText: '查看结论',
                prevShow: true,
                nextDisabled: false,
                dirText: '上面↓',
                fig1Heights: [1,1,1],
                fig2Heights: [1,1,1],
                result: 'same',
                highlight: true
            },
            { // 步骤4：结论
                nextText: '重新开始',
                prevShow: true,
                nextDisabled: false,
                dirText: '上面↓',
                fig1Heights: [1,1,1],
                fig2Heights: [1,1,1],
                result: 'same',
                highlight: true,
                options: true,
                answer: true
            }
        ];

        function show(el) {
            el.classList.remove('scene1-hidden');
            el.classList.add('scene1-show');
            if (el.id === 'scene1-highlight-box') {
                el.style.opacity = '1';
            }
        }

        function hide(el) {
            el.classList.remove('scene1-show');
            el.classList.add('scene1-hidden');
            if (el.id === 'scene1-highlight-box') {
                el.style.opacity = '0';
            }
        }

        function renderStep() {
            const cfg = stepConfig[currentStep];
            const prevBtn = document.getElementById('scene1-btn-prev');
            const nextBtn = document.getElementById('scene1-btn-next');

            // 更新按钮状态
            prevBtn.style.display = cfg.prevShow ? 'block' : 'none';
            nextBtn.textContent = cfg.nextText;
            nextBtn.disabled = cfg.nextDisabled || false;

            // 观察方向箭头
            const arrow = document.getElementById('scene1-dir-arrow');
            const dirText = document.getElementById('scene1-dir-text');
            if (currentStep >= 1) {
                dirText.textContent = cfg.dirText;
                show(arrow);
            } else {
                hide(arrow);
            }

            // 平面视图
            const fig1View = document.getElementById('scene1-fig1-view');
            const fig2View = document.getElementById('scene1-fig2-view');
            if (currentStep >= 1 && cfg.fig1Heights) {
                drawGridView(fig1View, 280, 360, cfg.fig1Heights.length, cfg.fig1Heights, '#e3f2fd', 0.3);
                drawGridView(fig2View, 460, 360, cfg.fig2Heights.length, cfg.fig2Heights, '#f5f5f5', 0.3);
                show(fig1View);
                show(fig2View);
            } else {
                hide(fig1View);
                hide(fig2View);
            }

            // 结果标注
            const resultDiff = document.getElementById('scene1-result-diff');
            const resultSame = document.getElementById('scene1-result-same');
            if (cfg.result === 'diff') {
                show(resultDiff);
                hide(resultSame);
            } else if (cfg.result === 'same') {
                hide(resultDiff);
                show(resultSame);
            } else {
                hide(resultDiff);
                hide(resultSame);
            }

            // 高亮框
            const highlight = document.getElementById('scene1-highlight-box');
            if (cfg.highlight) {
                show(highlight);
                if (currentStep === 3) {
                    highlight.classList.add('scene1-dash-animate');
                }
            } else {
                hide(highlight);
                highlight.classList.remove('scene1-dash-animate');
            }

            // 选项栏（HTML按钮）
            const optionsBar = document.getElementById('scene1-options-bar');
            if (cfg.options) {
                optionsBar.classList.add('show');
            } else {
                optionsBar.classList.remove('show');
            }

            // 答案
            const answer = document.getElementById('scene1-answer-text');
            if (cfg.answer) {
                show(answer);
            } else {
                hide(answer);
            }
        }

        function goNext() {
            if (currentStep < 4) {
                currentStep++;
            } else {
                currentStep = 0;
            }
            renderStep();
        }

        function goPrev() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        }

        document.getElementById('scene1-btn-next').addEventListener('click', goNext);
        document.getElementById('scene1-btn-prev').addEventListener('click', goPrev);

        // 初始渲染
        renderStep();

        // 暴露到window（供外部调用）
        window.scene1GoNext = goNext;
        window.scene1GoPrev = goPrev;
    })();
    </script>
</body>
</html>
