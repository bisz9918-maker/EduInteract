<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正方体展开图相对面分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; align-items: center; }
        #scene2-btn-prev, #scene2-btn-next {
            width: 100px; height: 36px; border-radius: 4px; font-size: 14px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        #scene2-btn-prev { background: #f5f5f5; border: 1px solid #ccc; color: #333; }
        #scene2-btn-next { background: #2196f3; border: 1px solid #2196f3; color: white; }
        #scene2-btn-prev:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene2-btn-next:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene2-step-indicator { font-size: 12px; color: #666; min-width: 60px; text-align: center; }

        /* 高亮样式 */
        .scene2-hl-red { fill: #ffcdd2; fill-opacity: 0.3; stroke: #c62828; stroke-width: 1; stroke-dasharray: 4,2; }
        .scene2-hl-blue { fill: #bbdefb; fill-opacity: 0.3; stroke: #1565c0; stroke-width: 1; stroke-dasharray: 4,2; }
        .scene2-hl-green { fill: #c8e6c9; fill-opacity: 0.3; stroke: #2e7d32; stroke-width: 1; stroke-dasharray: 4,2; }
        .scene2-square { fill: #ffffff; stroke: #000000; stroke-width: 1; }
        .scene2-border { fill: none; stroke: #000000; stroke-width: 1; }
        .scene2-border-thick { stroke-width: 2; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" viewBox="0 0 800 500">
            <!-- 图案定义 -->
            <defs>
                <!-- 心形 -->
                <g id="scene2-heart">
                    <path d="M 25 38 C 12 28, 8 20, 8 16 C 8 10, 14 7, 18 7 C 21 7, 24 10, 25 13 C 26 10, 29 7, 32 7 C 36 7, 42 10, 42 16 C 42 20, 38 28, 25 38 Z" fill="#e53935"/>
                </g>
                <!-- 笑脸 -->
                <g id="scene2-smile">
                    <circle cx="25" cy="25" r="14" fill="#ffeb3b"/>
                    <ellipse cx="19" cy="21" rx="2" ry="3" fill="#000000"/>
                    <ellipse cx="31" cy="21" rx="2" ry="3" fill="#000000"/>
                    <path d="M 18 28 Q 25 35 32 28" stroke="#000000" fill="none" stroke-width="2" stroke-linecap="round"/>
                </g>
                <!-- 太阳花 -->
                <g id="scene2-flower">
                    <g transform="translate(25,25)">
                        <ellipse cx="0" cy="-10" rx="3" ry="8" fill="#ff9800"/>
                        <ellipse cx="0" cy="-10" rx="3" ry="8" fill="#ff9800" transform="rotate(45)"/>
                        <ellipse cx="0" cy="-10" rx="3" ry="8" fill="#ff9800" transform="rotate(90)"/>
                        <ellipse cx="0" cy="-10" rx="3" ry="8" fill="#ff9800" transform="rotate(135)"/>
                        <ellipse cx="0" cy="-10" rx="3" ry="8" fill="#ff9800" transform="rotate(180)"/>
                        <ellipse cx="0" cy="-10" rx="3" ry="8" fill="#ff9800" transform="rotate(225)"/>
                        <ellipse cx="0" cy="-10" rx="3" ry="8" fill="#ff9800" transform="rotate(270)"/>
                        <ellipse cx="0" cy="-10" rx="3" ry="8" fill="#ff9800" transform="rotate(315)"/>
                        <circle cx="0" cy="0" r="5" fill="#ff9800"/>
                    </g>
                </g>
            </defs>

            <!-- ========== 选项A ========== -->
            <g id="scene2-opt-a">
                <!-- 外框 -->
                <rect id="scene2-a-border" class="scene2-border" x="163" y="52" width="212" height="158"/>
                <!-- 上：太阳花 -->
                <rect id="scene2-a-top" class="scene2-square" x="217" y="52" width="50" height="50"/>
                <use href="#scene2-flower" x="217" y="52"/>
                <!-- 中1：心形 -->
                <rect id="scene2-a-m1" class="scene2-square" x="163" y="106" width="50" height="50"/>
                <use href="#scene2-heart" x="163" y="106"/>
                <!-- 中2：笑脸 -->
                <rect id="scene2-a-m2" class="scene2-square" x="217" y="106" width="50" height="50"/>
                <use href="#scene2-smile" x="217" y="106"/>
                <!-- 中3：笑脸 -->
                <rect id="scene2-a-m3" class="scene2-square" x="271" y="106" width="50" height="50"/>
                <use href="#scene2-smile" x="271" y="106"/>
                <!-- 中4：心形 -->
                <rect id="scene2-a-m4" class="scene2-square" x="325" y="106" width="50" height="50"/>
                <use href="#scene2-heart" x="325" y="106"/>
                <!-- 下：太阳花 -->
                <rect id="scene2-a-bottom" class="scene2-square" x="217" y="160" width="50" height="50"/>
                <use href="#scene2-flower" x="217" y="160"/>

                <!-- 标签 -->
                <text x="163" y="46" font-size="16" font-weight="bold" fill="#000000">A</text>
                <text id="scene2-a-label1" x="188" y="228" font-size="12" fill="#000000" visibility="hidden">相对面1</text>
                <text id="scene2-a-label2" x="300" y="228" font-size="12" fill="#000000" visibility="hidden">相对面2</text>
                <text id="scene2-a-label3" x="269" y="46" font-size="12" fill="#000000" visibility="hidden">相对面3</text>
                <text id="scene2-a-mark" x="380" y="130" font-size="24" fill="#c62828" visibility="hidden" font-weight="bold">✗</text>
            </g>

            <!-- ========== 选项B ========== -->
            <g id="scene2-opt-b">
                <rect id="scene2-b-border" class="scene2-border" x="425" y="52" width="212" height="158"/>
                <!-- 上：笑脸 -->
                <rect id="scene2-b-top" class="scene2-square" x="479" y="52" width="50" height="50"/>
                <use href="#scene2-smile" x="479" y="52"/>
                <!-- 中1：心形 -->
                <rect id="scene2-b-m1" class="scene2-square" x="425" y="106" width="50" height="50"/>
                <use href="#scene2-heart" x="425" y="106"/>
                <!-- 中2：太阳花 -->
                <rect id="scene2-b-m2" class="scene2-square" x="479" y="106" width="50" height="50"/>
                <use href="#scene2-flower" x="479" y="106"/>
                <!-- 中3：心形 -->
                <rect id="scene2-b-m3" class="scene2-square" x="533" y="106" width="50" height="50"/>
                <use href="#scene2-heart" x="533" y="106"/>
                <!-- 中4：太阳花 -->
                <rect id="scene2-b-m4" class="scene2-square" x="587" y="106" width="50" height="50"/>
                <use href="#scene2-flower" x="587" y="106"/>
                <!-- 下：笑脸 -->
                <rect id="scene2-b-bottom" class="scene2-square" x="479" y="160" width="50" height="50"/>
                <use href="#scene2-smile" x="479" y="160"/>

                <text x="425" y="46" font-size="16" font-weight="bold" fill="#000000">B</text>
                <text id="scene2-b-label1" x="450" y="228" font-size="12" fill="#000000" visibility="hidden">相对面1</text>
                <text id="scene2-b-label2" x="562" y="228" font-size="12" fill="#000000" visibility="hidden">相对面2</text>
                <text id="scene2-b-label3" x="531" y="46" font-size="12" fill="#000000" visibility="hidden">相对面3</text>
                <text id="scene2-b-mark" x="642" y="130" font-size="24" fill="#2e7d32" visibility="hidden" font-weight="bold">✓</text>
            </g>

            <!-- ========== 选项C ========== -->
            <g id="scene2-opt-c">
                <rect id="scene2-c-border" class="scene2-border" x="163" y="240" width="212" height="158"/>
                <!-- 上：笑脸 -->
                <rect id="scene2-c-top" class="scene2-square" x="217" y="240" width="50" height="50"/>
                <use href="#scene2-smile" x="217" y="240"/>
                <!-- 中1：心形 -->
                <rect id="scene2-c-m1" class="scene2-square" x="163" y="294" width="50" height="50"/>
                <use href="#scene2-heart" x="163" y="294"/>
                <!-- 中2：笑脸 -->
                <rect id="scene2-c-m2" class="scene2-square" x="217" y="294" width="50" height="50"/>
                <use href="#scene2-smile" x="217" y="294"/>
                <!-- 中3：心形 -->
                <rect id="scene2-c-m3" class="scene2-square" x="271" y="294" width="50" height="50"/>
                <use href="#scene2-heart" x="271" y="294"/>
                <!-- 中4：太阳花 -->
                <rect id="scene2-c-m4" class="scene2-square" x="325" y="294" width="50" height="50"/>
                <use href="#scene2-flower" x="325" y="294"/>
                <!-- 下：太阳花 -->
                <rect id="scene2-c-bottom" class="scene2-square" x="217" y="348" width="50" height="50"/>
                <use href="#scene2-flower" x="217" y="348"/>

                <text x="163" y="234" font-size="16" font-weight="bold" fill="#000000">C</text>
                <text id="scene2-c-label1" x="188" y="416" font-size="12" fill="#000000" visibility="hidden">相对面1</text>
                <text id="scene2-c-label2" x="300" y="416" font-size="12" fill="#000000" visibility="hidden">相对面2</text>
                <text id="scene2-c-label3" x="269" y="234" font-size="12" fill="#000000" visibility="hidden">相对面3</text>
                <text id="scene2-c-mark" x="380" y="319" font-size="24" fill="#c62828" visibility="hidden" font-weight="bold">✗</text>
            </g>

            <!-- ========== 选项D ========== -->
            <g id="scene2-opt-d">
                <rect id="scene2-d-border" class="scene2-border" x="425" y="240" width="212" height="158"/>
                <!-- 上：太阳花 -->
                <rect id="scene2-d-top" class="scene2-square" x="479" y="240" width="50" height="50"/>
                <use href="#scene2-flower" x="479" y="240"/>
                <!-- 中1：心形 -->
                <rect id="scene2-d-m1" class="scene2-square" x="425" y="294" width="50" height="50"/>
                <use href="#scene2-heart" x="425" y="294"/>
                <!-- 中2：笑脸 -->
                <rect id="scene2-d-m2" class="scene2-square" x="479" y="294" width="50" height="50"/>
                <use href="#scene2-smile" x="479" y="294"/>
                <!-- 中3：太阳花 -->
                <rect id="scene2-d-m3" class="scene2-square" x="533" y="294" width="50" height="50"/>
                <use href="#scene2-flower" x="533" y="294"/>
                <!-- 中4：笑脸 -->
                <rect id="scene2-d-m4" class="scene2-square" x="587" y="294" width="50" height="50"/>
                <use href="#scene2-smile" x="587" y="294"/>
                <!-- 下：心形 -->
                <rect id="scene2-d-bottom" class="scene2-square" x="479" y="348" width="50" height="50"/>
                <use href="#scene2-heart" x="479" y="348"/>

                <text x="425" y="234" font-size="16" font-weight="bold" fill="#000000">D</text>
                <text id="scene2-d-label1" x="450" y="416" font-size="12" fill="#000000" visibility="hidden">相对面1</text>
                <text id="scene2-d-label2" x="562" y="416" font-size="12" fill="#000000" visibility="hidden">相对面2</text>
                <text id="scene2-d-label3" x="531" y="234" font-size="12" fill="#000000" visibility="hidden">相对面3</text>
                <text id="scene2-d-mark" x="642" y="319" font-size="24" fill="#c62828" visibility="hidden" font-weight="bold">✗</text>
            </g>

            <!-- 结论文字 -->
            <text id="scene2-conclusion" x="400" y="420" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle" visibility="hidden">
                正确答案：<tspan fill="#2e7d32" text-decoration="underline">B</tspan>
            </text>
        </svg>

        <div id="scene2-controls">
            <button id="scene2-btn-prev">◀ 上一步</button>
            <span id="scene2-step-indicator">步骤 0/5</span>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // 状态机
        let currentStep = 0;
        const totalSteps = 5;

        // 元素引用
        const optA = document.getElementById('scene2-opt-a');
        const optB = document.getElementById('scene2-opt-b');
        const optC = document.getElementById('scene2-opt-c');
        const optD = document.getElementById('scene2-opt-d');

        const borderA = document.getElementById('scene2-a-border');
        const borderB = document.getElementById('scene2-b-border');
        const borderC = document.getElementById('scene2-c-border');
        const borderD = document.getElementById('scene2-d-border');

        const conclusion = document.getElementById('scene2-conclusion');
        const stepIndicator = document.getElementById('scene2-step-indicator');
        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');

        // 选项配置：正方形ID列表、标注ID列表、标记ID
        const optionConfig = {
            a: {
                squares: ['scene2-a-top', 'scene2-a-m1', 'scene2-a-m2', 'scene2-a-m3', 'scene2-a-m4', 'scene2-a-bottom'],
                labels: ['scene2-a-label1', 'scene2-a-label2', 'scene2-a-label3'],
                mark: 'scene2-a-mark',
                border: borderA,
                group: optA,
                pairs: [
                    { ids: ['scene2-a-m1', 'scene2-a-m3'], cls: 'scene2-hl-red' },   // 相对面1
                    { ids: ['scene2-a-m2', 'scene2-a-m4'], cls: 'scene2-hl-blue' },  // 相对面2
                    { ids: ['scene2-a-top', 'scene2-a-bottom'], cls: 'scene2-hl-green' } // 相对面3
                ]
            },
            b: {
                squares: ['scene2-b-top', 'scene2-b-m1', 'scene2-b-m2', 'scene2-b-m3', 'scene2-b-m4', 'scene2-b-bottom'],
                labels: ['scene2-b-label1', 'scene2-b-label2', 'scene2-b-label3'],
                mark: 'scene2-b-mark',
                border: borderB,
                group: optB,
                pairs: [
                    { ids: ['scene2-b-m1', 'scene2-b-m3'], cls: 'scene2-hl-red' },
                    { ids: ['scene2-b-m2', 'scene2-b-m4'], cls: 'scene2-hl-blue' },
                    { ids: ['scene2-b-top', 'scene2-b-bottom'], cls: 'scene2-hl-green' }
                ]
            },
            c: {
                squares: ['scene2-c-top', 'scene2-c-m1', 'scene2-c-m2', 'scene2-c-m3', 'scene2-c-m4', 'scene2-c-bottom'],
                labels: ['scene2-c-label1', 'scene2-c-label2', 'scene2-c-label3'],
                mark: 'scene2-c-mark',
                border: borderC,
                group: optC,
                pairs: [
                    { ids: ['scene2-c-m1', 'scene2-c-m3'], cls: 'scene2-hl-red' },
                    { ids: ['scene2-c-m2', 'scene2-c-m4'], cls: 'scene2-hl-blue' },
                    { ids: ['scene2-c-top', 'scene2-c-bottom'], cls: 'scene2-hl-green' }
                ]
            },
            d: {
                squares: ['scene2-d-top', 'scene2-d-m1', 'scene2-d-m2', 'scene2-d-m3', 'scene2-d-m4', 'scene2-d-bottom'],
                labels: ['scene2-d-label1', 'scene2-d-label2', 'scene2-d-label3'],
                mark: 'scene2-d-mark',
                border: borderD,
                group: optD,
                pairs: [
                    { ids: ['scene2-d-m1', 'scene2-d-m3'], cls: 'scene2-hl-red' },
                    { ids: ['scene2-d-m2', 'scene2-d-m4'], cls: 'scene2-hl-blue' },
                    { ids: ['scene2-d-top', 'scene2-d-bottom'], cls: 'scene2-hl-green' }
                ]
            }
        };

        // 工具函数：显示/隐藏
        function show(el) {
            if (typeof el === 'string') el = document.getElementById(el);
            if (el) el.setAttribute('visibility', 'visible');
        }
        function hide(el) {
            if (typeof el === 'string') el = document.getElementById(el);
            if (el) el.setAttribute('visibility', 'hidden');
        }

        // 重置所有选项到初始状态
        function resetAll() {
            ['a', 'b', 'c', 'd'].forEach(key => {
                const cfg = optionConfig[key];
                // 恢复透明度
                cfg.group.style.opacity = '1';
                // 恢复边框
                cfg.border.classList.remove('scene2-border-thick');
                // 恢复所有正方形样式
                cfg.squares.forEach(sid => {
                    const sq = document.getElementById(sid);
                    sq.classList.remove('scene2-hl-red', 'scene2-hl-blue', 'scene2-hl-green');
                    sq.classList.add('scene2-square');
                });
                // 隐藏标注
                cfg.labels.forEach(lid => hide(lid));
                // 隐藏标记
                hide(cfg.mark);
            });
            // 隐藏结论
            hide(conclusion);
        }

        // 高亮指定选项的相对面
        function highlightOption(key) {
            const cfg = optionConfig[key];
            cfg.pairs.forEach(pair => {
                pair.ids.forEach(sid => {
                    const sq = document.getElementById(sid);
                    sq.classList.remove('scene2-square');
                    sq.classList.add(pair.cls);
                });
            });
        }

        // 激活指定选项（边框加粗，其余变暗）
        function activateOption(activeKey) {
            ['a', 'b', 'c', 'd'].forEach(key => {
                const cfg = optionConfig[key];
                if (key === activeKey) {
                    cfg.group.style.opacity = '1';
                    cfg.border.classList.add('scene2-border-thick');
                } else {
                    cfg.group.style.opacity = '0.3';
                    cfg.border.classList.remove('scene2-border-thick');
                }
            });
        }

        // 显示指定选项的标注和标记
        function showOptionLabels(key) {
            const cfg = optionConfig[key];
            cfg.labels.forEach(lid => show(lid));
            show(cfg.mark);
        }

        // 渲染当前步骤
        function renderStep() {
            resetAll();
            stepIndicator.textContent = '步骤 ' + currentStep + '/' + totalSteps;
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps;

            switch (currentStep) {
                case 0:
                    // 四选项总览：全部正常显示
                    break;
                case 1:
                    // 分析A
                    activateOption('a');
                    highlightOption('a');
                    showOptionLabels('a');
                    break;
                case 2:
                    // 分析B
                    activateOption('b');
                    highlightOption('b');
                    showOptionLabels('b');
                    break;
                case 3:
                    // 分析C
                    activateOption('c');
                    highlightOption('c');
                    showOptionLabels('c');
                    break;
                case 4:
                    // 分析D
                    activateOption('d');
                    highlightOption('d');
                    showOptionLabels('d');
                    break;
                case 5:
                    // 结论：聚焦B，隐藏A/C/D的标注和标记
                    activateOption('b');
                    highlightOption('b');
                    showOptionLabels('b');
                    show(conclusion);
                    break;
            }
        }

        // 事件绑定
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                renderStep();
            }
        });

        // 初始渲染
        renderStep();
    })();
    </script>
</body>
</html>
