<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>路灯下的影子</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-svg { position: absolute; top: 0; left: 0; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 16px; z-index: 10; }
        #scene1-controls span { font-size: 14px; color: #000000; white-space: nowrap; }
        #scene1-slider { width: 400px; cursor: pointer; }
        #scene1-aux-btn { padding: 6px 16px; font-size: 14px; border: 1px solid #cccccc; border-radius: 4px; background: #f5f5f5; cursor: pointer; white-space: nowrap; }
        #scene1-aux-btn:hover { background: #e0e0e0; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <line id="scene1-ground" x1="0" y1="360" x2="800" y2="360" stroke="#000000" stroke-width="2"/>
            <line id="scene1-lamp-pole" x1="480" y1="360" x2="480" y2="100" stroke="#000000" stroke-width="3"/>
            <circle id="scene1-lamp-bulb" cx="480" cy="100" r="8" fill="#ffeb3b" stroke="#000000" stroke-width="1.5"/>
            <line id="scene1-mark-a" x1="140" y1="355" x2="140" y2="365" stroke="#000000" stroke-width="2"/>
            <line id="scene1-mark-b" x1="660" y1="355" x2="660" y2="365" stroke="#000000" stroke-width="2"/>
            <rect id="scene1-person-body" x="128" y="290" width="24" height="70" rx="4" fill="#e3f2fd" stroke="#000000" stroke-width="1.5"/>
            <circle id="scene1-person-head" cx="140" cy="280" r="10" fill="#ffccbc" stroke="#000000" stroke-width="1.5"/>
            <line id="scene1-light-ray" x1="480" y1="100" x2="15" y2="360" stroke="#1565c0" stroke-width="2"/>
            <line id="scene1-shadow" x1="140" y1="360" x2="15" y2="360" stroke="#c62828" stroke-width="4"/>
            <line id="scene1-aux-h" x1="140" y1="290" x2="480" y2="290" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" display="none"/>
            <line id="scene1-aux-v" x1="480" y1="290" x2="480" y2="360" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" display="none"/>
            <text id="scene1-label-lamp" x="500" y="85" font-size="14" fill="#000000">路灯</text>
            <text id="scene1-label-height" x="465" y="420" font-size="14" fill="#000000" text-anchor="end">灯高 H</text>
            <text id="scene1-label-person-h" x="170" y="390" font-size="14" fill="#000000">人高 h</text>
            <text id="scene1-shadow-label" x="77" y="405" font-size="14" fill="#c62828" text-anchor="middle">影长 l≈125</text>
            <text id="scene1-label-a" x="140" y="380" font-size="14" fill="#000000" text-anchor="middle">A</text>
            <text id="scene1-label-b" x="660" y="380" font-size="14" fill="#000000" text-anchor="middle">B</text>
        </svg>
        <div id="scene1-controls">
            <span>小亮位置</span>
            <input type="range" id="scene1-slider" min="0" max="100" value="0">
            <span id="scene1-percent">0%</span>
            <button id="scene1-aux-btn">显示辅助线</button>
        </div>
    </div>
    <script>
    (function() {
        const slider = document.getElementById('scene1-slider');
        const percentLabel = document.getElementById('scene1-percent');
        const auxBtn = document.getElementById('scene1-aux-btn');
        const personBody = document.getElementById('scene1-person-body');
        const personHead = document.getElementById('scene1-person-head');
        const lightRay = document.getElementById('scene1-light-ray');
        const shadow = document.getElementById('scene1-shadow');
        const shadowLabel = document.getElementById('scene1-shadow-label');
        const personHLabel = document.getElementById('scene1-label-person-h');
        const auxH = document.getElementById('scene1-aux-h');
        const auxV = document.getElementById('scene1-aux-v');
        let showAux = false;
        function update(val) {
            const px = 140 + 5.2 * val;
            const sx = 480 + (26 / 19) * (px - 480);
            const mx = (px + sx) / 2;
            const L = Math.abs(sx - px);
            personBody.setAttribute('x', px - 12);
            personHead.setAttribute('cx', px);
            lightRay.setAttribute('x2', sx);
            shadow.setAttribute('x1', px);
            shadow.setAttribute('x2', sx);
            shadowLabel.setAttribute('x', mx);
            shadowLabel.textContent = L < 1 ? '影长 l=0' : '影长 l≈' + Math.round(L);
            personHLabel.setAttribute('x', px + 30);
            auxH.setAttribute('x1', px);
            percentLabel.textContent = Math.round(val) + '%';
        }
        slider.addEventListener('input', function() { update(parseFloat(this.value)); });
        auxBtn.addEventListener('click', function() {
            showAux = !showAux;
            auxBtn.textContent = showAux ? '隐藏辅助线' : '显示辅助线';
            auxH.style.display = showAux ? 'inline' : 'none';
            auxV.style.display = showAux ? 'inline' : 'none';
        });
        update(0);
    })();
    </script>
</body>
</html>
