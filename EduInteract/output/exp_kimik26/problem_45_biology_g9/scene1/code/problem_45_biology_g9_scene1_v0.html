<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>血液流经某器官示意图</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "SimHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            padding: 6px 16px;
            font-size: 14px;
            background: #f5f5f5;
            border: 1px solid #000000;
            border-radius: 4px;
            cursor: pointer;
            font-family: "Microsoft YaHei", "SimHei", sans-serif;
        }
        #scene1-controls button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        #scene1-step-indicator {
            font-size: 13px;
            color: #333;
            min-width: 70px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- ==================== 固定原图区（所有步骤显示） ==================== -->
            <g id="scene1-fixed-group">
                <!-- 标题 -->
                <text x="400" y="42" text-anchor="middle" font-size="18" font-weight="bold" fill="#000">血液流经某器官示意图</text>

                <!-- 血管a双线 -->
                <line x1="220" y1="78" x2="372" y2="78" stroke="#000" stroke-width="3"/>
                <line x1="220" y1="86" x2="372" y2="86" stroke="#000" stroke-width="3"/>

                <!-- 血管c双线 -->
                <line x1="428" y1="78" x2="580" y2="78" stroke="#000" stroke-width="3"/>
                <line x1="428" y1="86" x2="580" y2="86" stroke="#000" stroke-width="3"/>

                <!-- 器官b圆 -->
                <circle cx="400" cy="85" r="28" fill="#ffffff" stroke="#000" stroke-width="2"/>

                <!-- a内箭头 -->
                <path d="M 250 82 L 270 82 M 265 77 L 270 82 L 265 87" fill="none" stroke="#000" stroke-width="2"/>

                <!-- c内箭头 -->
                <path d="M 460 82 L 480 82 M 475 77 L 480 82 L 475 87" fill="none" stroke="#000" stroke-width="2"/>

                <!-- 标签a -->
                <text x="190" y="87" text-anchor="middle" font-size="16" fill="#000">a</text>
                <!-- 标签b（圆右侧，避免与动态区冲突） -->
                <text x="440" y="90" text-anchor="start" font-size="16" fill="#000">b</text>
                <!-- 标签c -->
                <text x="600" y="87" text-anchor="middle" font-size="16" fill="#000">c</text>

                <!-- 流入血管 / 流出血管 -->
                <text x="270" y="100" text-anchor="middle" font-size="13" fill="#888">流入血管</text>
                <text x="530" y="100" text-anchor="middle" font-size="13" fill="#888">流出血管</text>
            </g>

            <!-- ==================== 步骤0：题目原图 ==================== -->
            <g id="scene1-step0-group">
                <text x="400" y="162" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">题目原图</text>
                <text x="400" y="228" text-anchor="middle" font-size="15" fill="#000">A．b表示心脏，则C血管里流的是静脉血</text>
                <text x="400" y="278" text-anchor="middle" font-size="15" fill="#000">B．b表示肺，则C血管里流的是静脉血</text>
                <text x="400" y="328" text-anchor="middle" font-size="15" fill="#000">C．b表示小肠，则C血管里流的是动脉血</text>
                <text x="400" y="378" text-anchor="middle" font-size="15" fill="#000">D．b表示组织细胞，则C血管里流的是静脉血</text>
            </g>

            <!-- ==================== 步骤1：选项A 心脏 ==================== -->
            <g id="scene1-step1-group" visibility="hidden">
                <text x="400" y="162" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">选项A：b表示心脏</text>

                <!-- 右心房 RA -->
                <rect x="320" y="205" width="60" height="40" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
                <text x="350" y="198" text-anchor="middle" font-size="13" fill="#1565c0">RA</text>

                <!-- 右心室 RV -->
                <rect x="320" y="265" width="60" height="40" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
                <text x="350" y="355" text-anchor="middle" font-size="13" fill="#1565c0">RV</text>

                <!-- 左心房 LA -->
                <rect x="420" y="205" width="60" height="40" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
                <text x="450" y="198" text-anchor="middle" font-size="13" fill="#c62828">LA</text>

                <!-- 左心室 LV -->
                <rect x="420" y="265" width="60" height="40" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
                <text x="450" y="322" text-anchor="middle" font-size="13" fill="#c62828">LV</text>

                <!-- 上方蓝色路径：腔静脉→RA→RV→肺动脉c -->
                <line x1="180" y1="225" x2="320" y2="225" stroke="#1565c0" stroke-width="6"/>
                <line x1="350" y1="245" x2="350" y2="265" stroke="#1565c0" stroke-width="2"/>
                <polygon points="350,268 346,260 354,260" fill="#1565c0"/>
                <line x1="380" y1="265" x2="620" y2="265" stroke="#1565c0" stroke-width="6"/>
                <line x1="380" y1="285" x2="380" y2="265" stroke="#1565c0" stroke-width="2"/>

                <!-- 下方红色路径：肺静脉→LA→LV→主动脉c -->
                <line x1="180" y1="345" x2="420" y2="225" stroke="#c62828" stroke-width="6"/>
                <line x1="450" y1="245" x2="450" y2="265" stroke="#c62828" stroke-width="2"/>
                <polygon points="450,268 446,260 454,260" fill="#c62828"/>
                <line x1="480" y1="305" x2="620" y2="305" stroke="#c62828" stroke-width="6"/>
                <line x1="480" y1="285" x2="480" y2="305" stroke="#c62828" stroke-width="2"/>

                <!-- 标签 -->
                <text x="140" y="225" text-anchor="middle" font-size="13" fill="#1565c0">a（腔静脉）</text>
                <text x="640" y="265" text-anchor="middle" font-size="13" fill="#1565c0">c（肺动脉）</text>
                <text x="140" y="345" text-anchor="middle" font-size="13" fill="#c62828">a（肺静脉）</text>
                <text x="640" y="305" text-anchor="middle" font-size="13" fill="#c62828">c（主动脉）</text>

                <!-- 血性质标注 -->
                <text x="520" y="248" text-anchor="middle" font-size="13" fill="#1565c0">静脉血</text>
                <text x="520" y="330" text-anchor="middle" font-size="13" fill="#c62828">动脉血</text>

                <!-- 提示 -->
                <text x="400" y="373" text-anchor="middle" font-size="14" fill="#000">c血管性质取决于具体心腔</text>
            </g>

            <!-- ==================== 步骤2：选项B 肺 ==================== -->
            <g id="scene1-step2-group" visibility="hidden">
                <text x="400" y="162" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">选项B：b表示肺</text>

                <!-- 肺叶 -->
                <circle cx="360" cy="295" r="55" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
                <circle cx="440" cy="295" r="55" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>

                <!-- 毛细血管虚线 -->
                <line x1="330" y1="295" x2="470" y2="295" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>

                <!-- a肺动脉（蓝色） -->
                <line x1="180" y1="295" x2="330" y2="295" stroke="#1565c0" stroke-width="8"/>
                <path d="M 240 295 L 260 295 M 255 290 L 260 295 L 255 300" fill="none" stroke="#000" stroke-width="2"/>

                <!-- c肺静脉（红色） -->
                <line x1="470" y1="295" x2="620" y2="295" stroke="#c62828" stroke-width="8"/>
                <path d="M 540 295 L 560 295 M 555 290 L 560 295 L 555 300" fill="none" stroke="#000" stroke-width="2"/>

                <!-- 标签 -->
                <text x="140" y="300" text-anchor="middle" font-size="13" fill="#1565c0">a（肺动脉）</text>
                <text x="640" y="300" text-anchor="middle" font-size="13" fill="#c62828">c（肺静脉）</text>

                <!-- 血性质 -->
                <text x="250" y="330" text-anchor="middle" font-size="13" fill="#1565c0">静脉血</text>
                <text x="550" y="330" text-anchor="middle" font-size="13" fill="#c62828">动脉血</text>

                <!-- 错误标记 -->
                <text x="600" y="255" text-anchor="middle" font-size="28" fill="#c62828" font-weight="bold">×</text>
            </g>

            <!-- ==================== 步骤3：选项C 小肠 ==================== -->
            <g id="scene1-step3-group" visibility="hidden">
                <text x="400" y="162" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">选项C：b表示小肠</text>

                <!-- 小肠轮廓 -->
                <ellipse cx="400" cy="295" rx="85" ry="60" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>

                <!-- 绒毛 -->
                <line x1="370" y1="255" x2="370" y2="335" stroke="#888" stroke-width="1"/>
                <line x1="400" y1="245" x2="400" y2="345" stroke="#888" stroke-width="1"/>
                <line x1="430" y1="255" x2="430" y2="335" stroke="#888" stroke-width="1"/>

                <!-- a肠动脉（红色） -->
                <line x1="180" y1="295" x2="330" y2="295" stroke="#c62828" stroke-width="8"/>
                <path d="M 240 295 L 260 295 M 255 290 L 260 295 L 255 300" fill="none" stroke="#000" stroke-width="2"/>

                <!-- c肠静脉（蓝色） -->
                <line x1="470" y1="295" x2="620" y2="295" stroke="#1565c0" stroke-width="8"/>
                <path d="M 540 295 L 560 295 M 555 290 L 560 295 L 555 300" fill="none" stroke="#000" stroke-width="2"/>

                <!-- 标签 -->
                <text x="140" y="300" text-anchor="middle" font-size="13" fill="#c62828">a（肠动脉）</text>
                <text x="640" y="300" text-anchor="middle" font-size="13" fill="#1565c0">c（肠静脉）</text>

                <!-- 血性质 -->
                <text x="250" y="330" text-anchor="middle" font-size="13" fill="#c62828">动脉血</text>
                <text x="550" y="330" text-anchor="middle" font-size="13" fill="#1565c0">静脉血</text>

                <!-- 错误标记 -->
                <text x="600" y="255" text-anchor="middle" font-size="28" fill="#c62828" font-weight="bold">×</text>
            </g>

            <!-- ==================== 步骤4：选项D 组织细胞 ==================== -->
            <g id="scene1-step4-group" visibility="hidden">
                <text x="400" y="162" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">选项D：b表示组织细胞</text>

                <!-- 细胞 -->
                <rect x="350" y="275" width="60" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
                <rect x="390" y="275" width="60" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
                <rect x="370" y="305" width="60" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>

                <!-- a小动脉（红色） -->
                <line x1="180" y1="295" x2="340" y2="295" stroke="#c62828" stroke-width="8"/>
                <path d="M 240 295 L 260 295 M 255 290 L 260 295 L 255 300" fill="none" stroke="#000" stroke-width="2"/>

                <!-- c小静脉（蓝色） -->
                <line x1="460" y1="295" x2="620" y2="295" stroke="#1565c0" stroke-width="8"/>
                <path d="M 540 295 L 560 295 M 555 290 L 560 295 L 555 300" fill="none" stroke="#000" stroke-width="2"/>

                <!-- 标签 -->
                <text x="140" y="300" text-anchor="middle" font-size="13" fill="#c62828">a（小动脉）</text>
                <text x="640" y="300" text-anchor="middle" font-size="13" fill="#1565c0">c（小静脉）</text>

                <!-- 血性质 -->
                <text x="250" y="330" text-anchor="middle" font-size="13" fill="#c62828">动脉血</text>
                <text x="550" y="330" text-anchor="middle" font-size="13" fill="#1565c0">静脉血</text>

                <!-- 正确标记 -->
                <text x="600" y="255" text-anchor="middle" font-size="28" fill="#2e7d32" font-weight="bold">√</text>
            </g>

            <!-- ==================== 步骤5：总结规律 ==================== -->
            <g id="scene1-step5-group" visibility="hidden">
                <text x="400" y="162" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">总结规律</text>

                <text x="400" y="237" text-anchor="middle" font-size="15" fill="#000">① 体循环：动脉血 → 组织器官 → 静脉血</text>
                <text x="400" y="307" text-anchor="middle" font-size="15" fill="#000">② 肺循环：静脉血 → 肺部 → 动脉血</text>
                <text x="400" y="377" text-anchor="middle" font-size="15" fill="#000">③ 心脏：流出血管性质取决于流入心腔</text>
            </g>
        </svg>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1 / 6</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        var currentStep = 0;
        var totalSteps = 6;

        var btnPrev = document.getElementById('scene1-btn-prev');
        var btnNext = document.getElementById('scene1-btn-next');
        var indicator = document.getElementById('scene1-step-indicator');

        function updateScene() {
            // 隐藏所有步骤组（使用 visibility:hidden，SVG中visibility可继承）
            for (var i = 0; i < totalSteps; i++) {
                var group = document.getElementById('scene1-step' + i + '-group');
                if (group) {
                    group.setAttribute('visibility', 'hidden');
                    group.style.opacity = '0';
                }
            }

            // 显示当前步骤组
            var currentGroup = document.getElementById('scene1-step' + currentStep + '-group');
            if (currentGroup) {
                currentGroup.setAttribute('visibility', 'visible');
                // 淡入效果
                requestAnimationFrame(function() {
                    currentGroup.style.transition = 'opacity 200ms ease';
                    currentGroup.style.opacity = '1';
                });
            }

            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps - 1);

            // 更新指示器
            indicator.textContent = '步骤 ' + (currentStep + 1) + ' / ' + totalSteps;
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateScene();
            }
        });

        // 初始化
        updateScene();
    })();
    </script>
</body>
</html>
