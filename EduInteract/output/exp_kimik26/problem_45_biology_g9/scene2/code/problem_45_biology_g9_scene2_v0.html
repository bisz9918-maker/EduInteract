<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>血液与器官间物质交换</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }

        /* 状态切换按钮样式 - HTML按钮 */
        #scene2-btn-bar {
            position: absolute;
            top: 22px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 20px;
            z-index: 10;
        }
        .scene2-btn {
            padding: 8px 24px;
            font-size: 15px;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            border: 1.5px solid #9e9e9e;
            border-radius: 4px;
            background: #ffffff;
            color: #333333;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .scene2-btn.active {
            background: #e3f2fd;
            border-color: #1565c0;
            color: #1565c0;
            font-weight: bold;
            border-width: 2px;
        }

        /* 隐藏类 */
        .scene2-hidden { display: none; }

        /* 血球颜色 */
        .scene2-oxygenated { fill: #c62828; }
        .scene2-deoxygenated { fill: #1565c0; }
        .scene2-mixed { fill: #7b1fa2; }

        /* 组织细胞 */
        .scene2-cell { fill: #fff3e0; opacity: 0.35; stroke: #ffcc80; stroke-width: 1; }

        /* 肺泡 */
        .scene2-alveolus { fill: #e8f5e9; opacity: 0.35; stroke: #a5d6a7; stroke-width: 1; }

        /* 分子动画 */
        @keyframes scene2-flow-down {
            0% { transform: translate(0, 0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translate(0, 22px); opacity: 0; }
        }
        @keyframes scene2-flow-up {
            0% { transform: translate(0, 0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translate(0, -22px); opacity: 0; }
        }
        .scene2-molecule {
            animation-duration: 2s;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }
        .scene2-molecule-down {
            animation-name: scene2-flow-down;
        }
        .scene2-molecule-up {
            animation-name: scene2-flow-up;
        }
        .scene2-molecule-delay1 { animation-delay: 0s; }
        .scene2-molecule-delay2 { animation-delay: 0.7s; }
        .scene2-molecule-delay3 { animation-delay: 1.4s; }

        /* 标签样式 */
        .scene2-label {
            fill: #000000;
            font-size: 14px;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            text-anchor: middle;
            dominant-baseline: middle;
        }
        .scene2-label-left {
            text-anchor: end;
        }
        .scene2-label-right {
            text-anchor: start;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <!-- HTML 状态切换按钮 -->
        <div id="scene2-btn-bar">
            <button id="scene2-btn-systemic" class="scene2-btn active">体循环交换</button>
            <button id="scene2-btn-pulmonary" class="scene2-btn">肺循环交换</button>
        </div>

        <svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene2-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
                </marker>
            </defs>

            <!-- ===== 肺泡（状态2）===== -->
            <g id="scene2-alveoli-group" class="scene2-hidden">
                <circle class="scene2-alveolus" cx="300" cy="175" r="45"/>
                <circle class="scene2-alveolus" cx="500" cy="170" r="50"/>
            </g>

            <!-- ===== 毛细血管壁 ===== -->
            <line x1="120" y1="220" x2="680" y2="220" stroke="#000000" stroke-width="2"/>
            <line x1="120" y1="280" x2="680" y2="280" stroke="#000000" stroke-width="2"/>

            <!-- ===== 血流方向箭头 ===== -->
            <g>
                <line x1="135" y1="250" x2="155" y2="250" stroke="#000000" stroke-width="2" marker-end="url(#scene2-arrowhead)"/>
                <line x1="645" y1="250" x2="665" y2="250" stroke="#000000" stroke-width="2" marker-end="url(#scene2-arrowhead)"/>
            </g>

            <!-- ===== 血球 ===== -->
            <g id="scene2-rbc-group">
                <circle id="scene2-rbc-1" cx="180" cy="250" r="12" class="scene2-oxygenated"/>
                <circle id="scene2-rbc-2" cx="280" cy="250" r="12" class="scene2-oxygenated"/>
                <circle id="scene2-rbc-3" cx="380" cy="250" r="12" class="scene2-mixed"/>
                <circle id="scene2-rbc-4" cx="480" cy="250" r="12" class="scene2-deoxygenated"/>
                <circle id="scene2-rbc-5" cx="580" cy="250" r="12" class="scene2-deoxygenated"/>
            </g>

            <!-- ===== 组织细胞（状态1）===== -->
            <g id="scene2-cells-group">
                <polygon class="scene2-cell" points="170,360 230,355 220,390 180,395"/>
                <polygon class="scene2-cell" points="305,360 375,365 365,405 315,400"/>
                <polygon class="scene2-cell" points="448,358 512,363 505,400 455,395"/>
                <polygon class="scene2-cell" points="575,355 625,360 615,390 585,385"/>
            </g>

            <!-- ===== 状态1：体循环交换箭头 ===== -->
            <g id="scene2-arrows-systemic">
                <!-- O₂ 向下 -->
                <line x1="240" y1="280" x2="240" y2="300" stroke="#000000" stroke-width="1.5" marker-end="url(#scene2-arrowhead)"/>
                <!-- 营养 向下 -->
                <line x1="380" y1="280" x2="380" y2="300" stroke="#000000" stroke-width="1.5" marker-end="url(#scene2-arrowhead)"/>
                <!-- CO₂ 向上 -->
                <line x1="520" y1="300" x2="520" y2="280" stroke="#000000" stroke-width="1.5" marker-end="url(#scene2-arrowhead)"/>
                <!-- 废物 向上 -->
                <line x1="620" y1="300" x2="620" y2="280" stroke="#000000" stroke-width="1.5" marker-end="url(#scene2-arrowhead)"/>
            </g>

            <!-- ===== 状态2：肺循环交换箭头 ===== -->
            <g id="scene2-arrows-pulmonary" class="scene2-hidden">
                <!-- CO₂ 向上（血液→肺泡） -->
                <line x1="370" y1="220" x2="370" y2="195" stroke="#000000" stroke-width="1.5" marker-end="url(#scene2-arrowhead)"/>
                <!-- O₂ 向下（肺泡→血液） -->
                <line x1="430" y1="195" x2="430" y2="220" stroke="#000000" stroke-width="1.5" marker-end="url(#scene2-arrowhead)"/>
            </g>

            <!-- ===== 状态1：分子动画 ===== -->
            <g id="scene2-molecules-systemic">
                <!-- O₂ 分子（红色，向下） -->
                <g>
                    <circle cx="240" cy="282" r="4" fill="#c62828" class="scene2-molecule scene2-molecule-down scene2-molecule-delay1"/>
                    <circle cx="240" cy="282" r="4" fill="#c62828" class="scene2-molecule scene2-molecule-down scene2-molecule-delay2"/>
                    <circle cx="240" cy="282" r="4" fill="#c62828" class="scene2-molecule scene2-molecule-down scene2-molecule-delay3"/>
                </g>
                <!-- 营养分子（绿色，向下） -->
                <g>
                    <circle cx="380" cy="282" r="4" fill="#2e7d32" class="scene2-molecule scene2-molecule-down scene2-molecule-delay1"/>
                    <circle cx="380" cy="282" r="4" fill="#2e7d32" class="scene2-molecule scene2-molecule-down scene2-molecule-delay2"/>
                    <circle cx="380" cy="282" r="4" fill="#2e7d32" class="scene2-molecule scene2-molecule-down scene2-molecule-delay3"/>
                </g>
                <!-- CO₂ 分子（蓝色，向上） -->
                <g>
                    <circle cx="520" cy="298" r="4" fill="#1565c0" class="scene2-molecule scene2-molecule-up scene2-molecule-delay1"/>
                    <circle cx="520" cy="298" r="4" fill="#1565c0" class="scene2-molecule scene2-molecule-up scene2-molecule-delay2"/>
                    <circle cx="520" cy="298" r="4" fill="#1565c0" class="scene2-molecule scene2-molecule-up scene2-molecule-delay3"/>
                </g>
                <!-- 废物分子（灰色，向上） -->
                <g>
                    <circle cx="620" cy="298" r="4" fill="#9e9e9e" class="scene2-molecule scene2-molecule-up scene2-molecule-delay1"/>
                    <circle cx="620" cy="298" r="4" fill="#9e9e9e" class="scene2-molecule scene2-molecule-up scene2-molecule-delay2"/>
                    <circle cx="620" cy="298" r="4" fill="#9e9e9e" class="scene2-molecule scene2-molecule-up scene2-molecule-delay3"/>
                </g>
            </g>

            <!-- ===== 状态2：分子动画 ===== -->
            <g id="scene2-molecules-pulmonary" class="scene2-hidden">
                <!-- CO₂ 分子（蓝色，向上） -->
                <g>
                    <circle cx="370" cy="218" r="4" fill="#1565c0" class="scene2-molecule scene2-molecule-up scene2-molecule-delay1"/>
                    <circle cx="370" cy="218" r="4" fill="#1565c0" class="scene2-molecule scene2-molecule-up scene2-molecule-delay2"/>
                    <circle cx="370" cy="218" r="4" fill="#1565c0" class="scene2-molecule scene2-molecule-up scene2-molecule-delay3"/>
                </g>
                <!-- O₂ 分子（红色，向下） -->
                <g>
                    <circle cx="430" cy="197" r="4" fill="#c62828" class="scene2-molecule scene2-molecule-down scene2-molecule-delay1"/>
                    <circle cx="430" cy="197" r="4" fill="#c62828" class="scene2-molecule scene2-molecule-down scene2-molecule-delay2"/>
                    <circle cx="430" cy="197" r="4" fill="#c62828" class="scene2-molecule scene2-molecule-down scene2-molecule-delay3"/>
                </g>
            </g>

            <!-- ===== 标签 ===== -->
            <!-- 毛细血管标签（始终显示） -->
            <text x="400" y="305" class="scene2-label">毛细血管</text>

            <!-- 组织细胞标签（状态1） -->
            <text id="scene2-label-cells" x="400" y="470" class="scene2-label">组织细胞</text>

            <!-- 肺泡标签（状态2） -->
            <text id="scene2-label-alveoli" x="400" y="105" class="scene2-label scene2-hidden">肺泡</text>

            <!-- 左侧血液标签 -->
            <text id="scene2-label-left-blood" x="110" y="255" class="scene2-label scene2-label-left">动脉血</text>

            <!-- 右侧血液标签 -->
            <text id="scene2-label-right-blood" x="690" y="255" class="scene2-label scene2-label-right">静脉血</text>

            <!-- 状态1 交换标签 -->
            <g id="scene2-labels-systemic">
                <text x="240" y="435" class="scene2-label" style="font-size:13px;">O₂</text>
                <text x="380" y="435" class="scene2-label" style="font-size:13px;">营养物质</text>
                <text x="520" y="435" class="scene2-label" style="font-size:13px;">CO₂</text>
                <text x="620" y="435" class="scene2-label" style="font-size:13px;">代谢废物</text>
            </g>

            <!-- 状态2 交换标签 -->
            <g id="scene2-labels-pulmonary" class="scene2-hidden">
                <text x="370" y="188" class="scene2-label" style="font-size:13px;">CO₂</text>
                <text x="430" y="188" class="scene2-label" style="font-size:13px;">O₂</text>
            </g>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 2 实现：血液与器官间物质交换
        var currentState = 'systemic';

        var btnSys = document.getElementById('scene2-btn-systemic');
        var btnPul = document.getElementById('scene2-btn-pulmonary');

        function scene2SwitchState(newState) {
            if (newState === currentState) return;
            currentState = newState;

            // 按钮样式切换
            if (newState === 'systemic') {
                btnSys.classList.add('active');
                btnPul.classList.remove('active');
            } else {
                btnPul.classList.add('active');
                btnSys.classList.remove('active');
            }

            // 元素显隐切换
            var sysElements = [
                'scene2-cells-group',
                'scene2-arrows-systemic',
                'scene2-molecules-systemic',
                'scene2-label-cells',
                'scene2-labels-systemic'
            ];
            var pulElements = [
                'scene2-alveoli-group',
                'scene2-arrows-pulmonary',
                'scene2-molecules-pulmonary',
                'scene2-label-alveoli',
                'scene2-labels-pulmonary'
            ];

            sysElements.forEach(function(id) {
                var el = document.getElementById(id);
                if (el) {
                    if (newState === 'systemic') {
                        el.style.display = '';
                        el.style.opacity = '1';
                    } else {
                        el.style.display = 'none';
                        el.style.opacity = '0';
                    }
                }
            });

            pulElements.forEach(function(id) {
                var el = document.getElementById(id);
                if (el) {
                    if (newState === 'pulmonary') {
                        el.style.display = '';
                        el.style.opacity = '1';
                    } else {
                        el.style.display = 'none';
                        el.style.opacity = '0';
                    }
                }
            });

            // 血球颜色切换
            var rbc1 = document.getElementById('scene2-rbc-1');
            var rbc2 = document.getElementById('scene2-rbc-2');
            var rbc3 = document.getElementById('scene2-rbc-3');
            var rbc4 = document.getElementById('scene2-rbc-4');
            var rbc5 = document.getElementById('scene2-rbc-5');

            if (newState === 'systemic') {
                rbc1.setAttribute('class', 'scene2-oxygenated');
                rbc2.setAttribute('class', 'scene2-oxygenated');
                rbc3.setAttribute('class', 'scene2-mixed');
                rbc4.setAttribute('class', 'scene2-deoxygenated');
                rbc5.setAttribute('class', 'scene2-deoxygenated');
            } else {
                rbc1.setAttribute('class', 'scene2-deoxygenated');
                rbc2.setAttribute('class', 'scene2-deoxygenated');
                rbc3.setAttribute('class', 'scene2-mixed');
                rbc4.setAttribute('class', 'scene2-oxygenated');
                rbc5.setAttribute('class', 'scene2-oxygenated');
            }

            // 左右血液标签文字切换
            var leftLabel = document.getElementById('scene2-label-left-blood');
            var rightLabel = document.getElementById('scene2-label-right-blood');
            if (newState === 'systemic') {
                leftLabel.textContent = '动脉血';
                rightLabel.textContent = '静脉血';
            } else {
                leftLabel.textContent = '静脉血';
                rightLabel.textContent = '动脉血';
            }
        }

        // 绑定按钮点击事件
        btnSys.addEventListener('click', function() { scene2SwitchState('systemic'); });
        btnPul.addEventListener('click', function() { scene2SwitchState('pulmonary'); });
    })();
    </script>
</body>
</html>
