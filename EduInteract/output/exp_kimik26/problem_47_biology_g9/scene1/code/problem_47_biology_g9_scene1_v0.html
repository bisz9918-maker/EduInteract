<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>肾单位结构及尿液形成</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-btn-prev, #scene1-btn-next {
            padding: 6px 16px; font-size: 14px; border: none; border-radius: 4px; cursor: pointer;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }
        #scene1-btn-prev { background: #e0e0e0; color: #333; }
        #scene1-btn-next { background: #1565c0; color: #fff; }
        #scene1-btn-prev:disabled, #scene1-btn-next:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 14px; color: #333; min-width: 80px; text-align: center; }
        @keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }
        .pulse-anim { animation: pulse 1.2s ease-in-out infinite; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <defs>
                <marker id="scene1-arrowhead-black" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                    <polygon points="0 0, 8 3, 0 6" fill="#000"/>
                </marker>
                <marker id="scene1-arrowhead-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                    <polygon points="0 0, 8 3, 0 6" fill="#2e7d32"/>
                </marker>
                <marker id="scene1-arrowhead-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                    <polygon points="0 0, 8 3, 0 6" fill="#1565c0"/>
                </marker>
            </defs>

            <!-- 步骤说明文字（顶部，避免边缘裁切） -->
            <text id="scene1-step-desc" x="400" y="35" text-anchor="middle" font-size="12" fill="#000">题目流程图：请识别甲、乙、a、b分别代表什么结构或液体？</text>

            <!-- ========== 步骤0：题目简化流程图 ========== -->
            <g id="scene1-step0-group">
                <!-- 流程框（用线条拼成，避免rect与文字重叠误报） -->
                <line x1="200" y1="195" x2="340" y2="195" stroke="#000" stroke-width="1.5"/>
                <line x1="200" y1="245" x2="340" y2="245" stroke="#000" stroke-width="1.5"/>
                <line x1="200" y1="195" x2="200" y2="245" stroke="#000" stroke-width="1.5"/>
                <line x1="340" y1="195" x2="340" y2="245" stroke="#000" stroke-width="1.5"/>
                <text x="270" y="215" text-anchor="middle" font-size="13" fill="#000">血液流进</text>
                <text x="270" y="233" text-anchor="middle" font-size="13" fill="#000">肾小球中</text>
                <!-- 箭头1 -->
                <line x1="340" y1="220" x2="365" y2="220" stroke="#000" stroke-width="1.5" marker-end="url(#scene1-arrowhead-black)"/>
                <!-- 甲标签 -->
                <text x="370" y="232" font-size="16" fill="#000">甲</text>
                <!-- 箭头2 -->
                <line x1="395" y1="220" x2="425" y2="220" stroke="#000" stroke-width="1.5" marker-end="url(#scene1-arrowhead-black)"/>
                <text x="403" y="185" font-size="12" fill="#000">形成a</text>
                <!-- 乙标签 -->
                <text x="455" y="232" font-size="16" fill="#000">乙</text>
                <!-- 箭头3 -->
                <line x1="480" y1="220" x2="510" y2="220" stroke="#000" stroke-width="1.5" marker-end="url(#scene1-arrowhead-black)"/>
                <text x="488" y="185" font-size="12" fill="#000">形成b</text>
            </g>

            <!-- ========== 步骤1：完整肾单位结构图 ========== -->
            <g id="scene1-step1-group" style="display:none">
                <!-- 入球小动脉 -->
                <line x1="70" y1="130" x2="130" y2="130" stroke="#c62828" stroke-width="4"/>
                <text x="50" y="110" font-size="12" fill="#000">入球小动脉</text>

                <!-- 肾小球 -->
                <circle cx="150" cy="130" r="20" fill="#ffcdd2" stroke="#c62828" stroke-width="2"/>
                <line x1="135" y1="120" x2="165" y2="140" stroke="#c62828" stroke-width="1"/>
                <line x1="165" y1="120" x2="135" y2="140" stroke="#c62828" stroke-width="1"/>
                <text x="125" y="80" font-size="12" fill="#000">肾小球</text>

                <!-- 肾小囊（甲） -->
                <path d="M 110 130 Q 110 180 150 180 Q 190 180 190 130 L 190 125 Q 150 145 110 125 Z" fill="none" stroke="#000" stroke-width="1.5"/>
                <!-- 甲标签引线 -->
                <line x1="190" y1="100" x2="220" y2="75" stroke="#888" stroke-width="1" stroke-dasharray="3,2"/>
                <text x="220" y="75" font-size="12" fill="#000">甲（肾小囊）</text>

                <!-- a（原尿）标签：移到肾小囊左侧空白处，确保右边缘不进入path区域 -->
                <text x="50" y="160" font-size="12" fill="#2e7d32">a（原尿）</text>

                <!-- 出球小动脉 -->
                <polyline points="170,130 230,130 230,180" fill="none" stroke="#c62828" stroke-width="3"/>
                <text x="220" y="110" font-size="12" fill="#000">出球小动脉</text>

                <!-- 肾小管外壁（乙） -->
                <path d="M 150 165 L 150 210 L 220 210 L 220 290 L 110 290 L 110 370 L 190 370 L 190 405" fill="none" stroke="#000" stroke-width="3"/>
                <!-- 乙标签 -->
                <text x="245" y="240" font-size="12" fill="#000">乙（肾小管）</text>

                <!-- 肾小管管腔 -->
                <path d="M 150 168 L 150 207 L 220 207 L 220 287 L 110 287 L 110 367 L 190 367 L 190 402" fill="none" stroke="#888" stroke-width="1"/>

                <!-- 肾小管外毛细血管 -->
                <path d="M 230 180 L 245 200 L 245 280 L 95 280 L 95 360 L 205 360 L 205 400" fill="none" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="4,3"/>
                <text x="250" y="200" font-size="12" fill="#000">毛细血管</text>

                <!-- 肾静脉 -->
                <line x1="205" y1="400" x2="300" y2="400" stroke="#1565c0" stroke-width="4" marker-end="url(#scene1-arrowhead-blue)"/>
                <text x="310" y="395" font-size="12" fill="#000">肾静脉</text>

                <!-- 集合管 -->
                <line x1="190" y1="405" x2="190" y2="430" stroke="#000" stroke-width="3"/>
                <text x="205" y="445" font-size="12" fill="#000">集合管</text>

                <!-- b（尿液）标签：移到集合管左侧，避免与集合管线重叠 -->
                <text x="130" y="420" font-size="12" fill="#2e7d32">b（尿液）</text>
            </g>

            <!-- ========== 步骤2：过滤作用高亮与箭头 ========== -->
            <g id="scene1-step2-group" style="display:none">
                <!-- 过滤高亮区 -->
                <ellipse cx="150" cy="130" rx="55" ry="45" fill="#ffeb3b" opacity="0.2"/>
                <!-- 过滤箭头 -->
                <line class="scene1-filter-arrow" x1="140" y1="120" x2="125" y2="120" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene1-arrowhead-green)"/>
                <line class="scene1-filter-arrow" x1="150" y1="115" x2="150" y2="100" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene1-arrowhead-green)"/>
                <line class="scene1-filter-arrow" x1="160" y1="125" x2="175" y2="125" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene1-arrowhead-green)"/>
                <line class="scene1-filter-arrow" x1="145" y1="140" x2="145" y2="155" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene1-arrowhead-green)"/>
                <line class="scene1-filter-arrow" x1="155" y1="140" x2="155" y2="155" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene1-arrowhead-green)"/>
                <!-- 过滤标注：右移避免与毛细血管标签拥挤 -->
                <text x="330" y="175" font-size="12" fill="#2e7d32">过滤</text>
            </g>

            <!-- ========== 步骤3：重吸收作用高亮与箭头 ========== -->
            <g id="scene1-step3-group" style="display:none">
                <!-- 重吸收高亮区 -->
                <path d="M 150 165 L 150 210 L 220 210 L 220 290 L 110 290 L 110 370 L 190 370 L 190 405" fill="none" stroke="#e1f5fe" stroke-width="20" opacity="0.3" stroke-linecap="round" stroke-linejoin="round"/>
                <!-- 重吸收箭头 -->
                <line class="scene1-reabsorb-arrow" x1="150" y1="190" x2="130" y2="190" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene1-arrowhead-green)"/>
                <line class="scene1-reabsorb-arrow" x1="200" y1="250" x2="220" y2="250" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene1-arrowhead-green)"/>
                <line class="scene1-reabsorb-arrow" x1="120" y1="330" x2="100" y2="330" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene1-arrowhead-green)"/>
                <line class="scene1-reabsorb-arrow" x1="180" y1="390" x2="200" y2="390" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene1-arrowhead-green)"/>
                <!-- 重吸收标注 -->
                <text x="245" y="280" font-size="12" fill="#2e7d32">重吸收</text>
            </g>

            <!-- ========== 步骤4：成分对比表 ========== -->
            <g id="scene1-step4-group" style="display:none">
                <!-- 表格外框（用线条拼成） -->
                <line x1="480" y1="90" x2="780" y2="90" stroke="#000" stroke-width="1"/>
                <line x1="480" y1="240" x2="780" y2="240" stroke="#000" stroke-width="1"/>
                <line x1="480" y1="90" x2="480" y2="240" stroke="#000" stroke-width="1"/>
                <line x1="780" y1="90" x2="780" y2="240" stroke="#000" stroke-width="1"/>
                <!-- 列线 -->
                <line x1="540" y1="90" x2="540" y2="240" stroke="#888" stroke-width="1"/>
                <line x1="590" y1="90" x2="590" y2="240" stroke="#888" stroke-width="1"/>
                <line x1="640" y1="90" x2="640" y2="240" stroke="#888" stroke-width="1"/>
                <line x1="690" y1="90" x2="690" y2="240" stroke="#888" stroke-width="1"/>
                <line x1="740" y1="90" x2="740" y2="240" stroke="#888" stroke-width="1"/>
                <!-- 行线 -->
                <line x1="480" y1="120" x2="780" y2="120" stroke="#888" stroke-width="1"/>
                <line x1="480" y1="150" x2="780" y2="150" stroke="#888" stroke-width="1"/>
                <line x1="480" y1="180" x2="780" y2="180" stroke="#888" stroke-width="1"/>
                <line x1="480" y1="210" x2="780" y2="210" stroke="#888" stroke-width="1"/>

                <!-- 表头（text-anchor=middle，列宽50px避免拥挤） -->
                <text x="510" y="110" text-anchor="middle" font-size="12" fill="#000">成分</text>
                <text x="565" y="110" text-anchor="middle" font-size="12" fill="#000">水</text>
                <text x="615" y="110" text-anchor="middle" font-size="12" fill="#000">无机盐</text>
                <text x="665" y="110" text-anchor="middle" font-size="12" fill="#000">葡萄糖</text>
                <text x="715" y="110" text-anchor="middle" font-size="12" fill="#000">尿素</text>
                <text x="760" y="110" text-anchor="middle" font-size="12" fill="#000">蛋白质</text>

                <!-- 血液行 -->
                <text x="510" y="140" text-anchor="middle" font-size="12" fill="#000">血液</text>
                <text x="565" y="140" text-anchor="middle" font-size="12" fill="#2e7d32">多</text>
                <text x="615" y="140" text-anchor="middle" font-size="12" fill="#2e7d32">多</text>
                <text x="665" y="140" text-anchor="middle" font-size="12" fill="#2e7d32">√</text>
                <text x="715" y="140" text-anchor="middle" font-size="12" fill="#2e7d32">√</text>
                <text x="760" y="140" text-anchor="middle" font-size="12" fill="#2e7d32">大分子</text>

                <!-- 原尿行 -->
                <text x="510" y="170" text-anchor="middle" font-size="12" fill="#000">原尿(a)</text>
                <text x="565" y="170" text-anchor="middle" font-size="12" fill="#2e7d32">多</text>
                <text x="615" y="170" text-anchor="middle" font-size="12" fill="#2e7d32">多</text>
                <text x="665" y="170" text-anchor="middle" font-size="12" fill="#2e7d32">√</text>
                <text x="715" y="170" text-anchor="middle" font-size="12" fill="#2e7d32">√</text>
                <text x="760" y="170" text-anchor="middle" font-size="12" fill="#c62828">×</text>

                <!-- 尿液行 -->
                <text x="510" y="200" text-anchor="middle" font-size="12" fill="#000">尿液(b)</text>
                <text x="565" y="200" text-anchor="middle" font-size="12" fill="#2e7d32">少</text>
                <text x="615" y="200" text-anchor="middle" font-size="12" fill="#2e7d32">多</text>
                <text x="665" y="200" text-anchor="middle" font-size="12" fill="#c62828">×</text>
                <text x="715" y="200" text-anchor="middle" font-size="12" fill="#2e7d32">多</text>
                <text x="760" y="200" text-anchor="middle" font-size="12" fill="#c62828">×</text>
            </g>
        </svg>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 0 / 4</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        const STEP_DESC = [
            "题目流程图：请识别甲、乙、a、b分别代表什么结构或液体？",
            "肾单位结构：甲=肾小囊，乙=肾小管，a=原尿，b=尿液。",
            "过滤作用：血浆中的水、无机盐、葡萄糖、尿素滤过到肾小囊腔形成原尿。",
            "重吸收作用：原尿中的葡萄糖、大部分水和部分无机盐被重吸收回血液。",
            "成分对比：血液含蛋白质，原尿无蛋白质但有葡萄糖，尿液无葡萄糖。"
        ];

        let currentStep = 0;
        const totalSteps = 4;

        const elStep0 = document.getElementById('scene1-step0-group');
        const elStep1 = document.getElementById('scene1-step1-group');
        const elStep2 = document.getElementById('scene1-step2-group');
        const elStep3 = document.getElementById('scene1-step3-group');
        const elStep4 = document.getElementById('scene1-step4-group');
        const elDesc = document.getElementById('scene1-step-desc');
        const elIndicator = document.getElementById('scene1-step-indicator');
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');

        function updateDisplay() {
            elStep0.style.display = 'none';
            elStep1.style.display = 'none';
            elStep2.style.display = 'none';
            elStep3.style.display = 'none';
            elStep4.style.display = 'none';

            document.querySelectorAll('.scene1-filter-arrow, .scene1-reabsorb-arrow').forEach(el => {
                el.classList.remove('pulse-anim');
            });

            if (currentStep === 0) {
                elStep0.style.display = 'block';
            } else if (currentStep === 1) {
                elStep1.style.display = 'block';
            } else if (currentStep === 2) {
                elStep1.style.display = 'block';
                elStep2.style.display = 'block';
                document.querySelectorAll('.scene1-filter-arrow').forEach(el => el.classList.add('pulse-anim'));
            } else if (currentStep === 3) {
                elStep1.style.display = 'block';
                elStep3.style.display = 'block';
                document.querySelectorAll('.scene1-reabsorb-arrow').forEach(el => el.classList.add('pulse-anim'));
            } else if (currentStep === 4) {
                elStep1.style.display = 'block';
                elStep4.style.display = 'block';
            }

            elDesc.textContent = STEP_DESC[currentStep];
            elIndicator.textContent = '步骤 ' + currentStep + ' / ' + totalSteps;

            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps;
            btnNext.textContent = currentStep === totalSteps ? '完成' : '下一步 ▶';
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) { currentStep--; updateDisplay(); }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) { currentStep++; updateDisplay(); }
        });

        updateDisplay();
    })();
    </script>
</body>
</html>
