<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 1 - 大圆航线</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            padding: 6px 16px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #333;
            background: #fff;
            border-radius: 4px;
        }
        #scene1-controls button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        #scene1-step-indicator {
            font-size: 14px;
            min-width: 80px;
            text-align: center;
        }
        .scene1-option {
            position: absolute;
            left: 580px;
            width: 200px;
            height: 30px;
            line-height: 30px;
            padding-left: 10px;
            border: 1px solid #000;
            background: #fff;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .scene1-option.dimmed {
            opacity: 0.4;
        }
        .scene1-option.highlight-correct {
            background: rgba(46, 125, 50, 0.2);
            border-color: #2e7d32;
            border-width: 2px;
        }
        .scene1-fade-in {
            opacity: 0;
            transition: opacity 0.3s ease-out;
        }
        .scene1-fade-in.visible {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" viewBox="0 0 800 500" style="position:absolute; top:0; left:0;">
            <defs>
                <marker id="scene1-arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0"/>
                </marker>
                <marker id="scene1-arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#c62828"/>
                </marker>
                <marker id="scene1-arrowhead-black" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
                </marker>
            </defs>

            <line id="scene1-meridian-80" x1="200" y1="120" x2="200" y2="320" stroke="#000000" stroke-width="2"/>
            <line id="scene1-meridian-120" x1="450" y1="120" x2="450" y2="320" stroke="#000000" stroke-width="2"/>
            <line id="scene1-parallel-60" x1="170" y1="150" x2="480" y2="150" stroke="#000000" stroke-width="2"/>
            <line id="scene1-parallel-40" x1="170" y1="300" x2="480" y2="300" stroke="#000000" stroke-width="2"/>

            <text id="scene1-label-80" x="200" y="90" text-anchor="middle" font-size="14" fill="#000000">80°</text>
            <text id="scene1-label-120" x="450" y="90" text-anchor="middle" font-size="14" fill="#000000">120°</text>
            <text id="scene1-label-60" x="495" y="155" text-anchor="start" font-size="14" fill="#000000">60°</text>
            <text id="scene1-label-40" x="495" y="305" text-anchor="start" font-size="14" fill="#000000">40°</text>

            <circle id="scene1-point-m" cx="200" cy="150" r="5" fill="#1565c0"/>
            <circle id="scene1-point-n" cx="450" cy="150" r="5" fill="#c62828"/>

            <text id="scene1-label-m" x="175" y="145" text-anchor="middle" font-size="14" fill="#000000">M</text>
            <text id="scene1-label-n" x="465" y="145" text-anchor="middle" font-size="14" fill="#000000">N</text>

            <text id="scene1-coord-m" x="120" y="210" text-anchor="start" font-size="14" fill="#000000" class="scene1-fade-in">(60°N, 80°E)</text>
            <text id="scene1-coord-n" x="470" y="210" text-anchor="start" font-size="14" fill="#000000" class="scene1-fade-in">(60°N, 120°E)</text>

            <line id="scene1-lon-arrow" x1="200" y1="215" x2="450" y2="215" stroke="#000000" stroke-width="1.5" marker-end="url(#scene1-arrowhead-black)" marker-start="url(#scene1-arrowhead-black)" class="scene1-fade-in"/>
            <text id="scene1-lon-diff" x="325" y="235" text-anchor="middle" font-size="14" fill="#000000" class="scene1-fade-in">经度差 40°</text>

            <line id="scene1-lat-path" x1="200" y1="150" x2="450" y2="150" stroke="#c62828" stroke-width="2" stroke-dasharray="6,4" class="scene1-fade-in"/>
            <text id="scene1-lat-label" x="325" y="172" text-anchor="middle" font-size="14" fill="#c62828" class="scene1-fade-in">沿纬线：一直向东</text>
            <text id="scene1-lat-note" x="325" y="190" text-anchor="middle" font-size="14" fill="#c62828" class="scene1-fade-in">（非最短）</text>

            <path id="scene1-great-circle" d="M 200 150 Q 325 35 450 150" stroke="#1565c0" stroke-width="3" fill="none" class="scene1-fade-in"/>
            <text id="scene1-gc-label" x="20" y="60" text-anchor="start" font-size="14" fill="#1565c0" class="scene1-fade-in">最短航线（大圆劣弧）</text>
            <text id="scene1-gc-note" x="325" y="42" text-anchor="middle" font-size="14" fill="#1565c0" class="scene1-fade-in">向北凸出</text>

            <line id="scene1-arrow-ne" x1="205" y1="95" x2="220" y2="85" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrowhead-blue)" class="scene1-fade-in"/>
            <text id="scene1-label-ne" x="50" y="100" text-anchor="middle" font-size="14" fill="#1565c0" font-weight="bold" class="scene1-fade-in">东北</text>
            <line id="scene1-arrow-se" x1="435" y1="95" x2="450" y2="105" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrowhead-red)" class="scene1-fade-in"/>
            <text id="scene1-label-se" x="500" y="55" text-anchor="middle" font-size="14" fill="#c62828" font-weight="bold" class="scene1-fade-in">东南</text>
            <circle id="scene1-turning-point" cx="325" cy="70" r="6" fill="#2e7d32" class="scene1-fade-in"/>
        </svg>

        <div id="scene1-option-a" class="scene1-option" style="top:130px;">A. 一直向东</div>
        <div id="scene1-option-b" class="scene1-option" style="top:180px;">B. 先东南再东北</div>
        <div id="scene1-option-c" class="scene1-option" style="top:230px;">C. 一直向西</div>
        <div id="scene1-option-d" class="scene1-option" style="top:280px;">D. 先东北再东南</div>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/6</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const totalSteps = 6;
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        const coordM = document.getElementById('scene1-coord-m');
        const coordN = document.getElementById('scene1-coord-n');
        const lonArrow = document.getElementById('scene1-lon-arrow');
        const lonDiff = document.getElementById('scene1-lon-diff');
        const latPath = document.getElementById('scene1-lat-path');
        const latLabel = document.getElementById('scene1-lat-label');
        const latNote = document.getElementById('scene1-lat-note');
        const greatCircle = document.getElementById('scene1-great-circle');
        const gcLabel = document.getElementById('scene1-gc-label');
        const gcNote = document.getElementById('scene1-gc-note');
        const arrowNE = document.getElementById('scene1-arrow-ne');
        const labelNE = document.getElementById('scene1-label-ne');
        const arrowSE = document.getElementById('scene1-arrow-se');
        const labelSE = document.getElementById('scene1-label-se');
        const turningPoint = document.getElementById('scene1-turning-point');
        const optionA = document.getElementById('scene1-option-a');
        const optionB = document.getElementById('scene1-option-b');
        const optionC = document.getElementById('scene1-option-c');
        const optionD = document.getElementById('scene1-option-d');
        const pointM = document.getElementById('scene1-point-m');
        const pointN = document.getElementById('scene1-point-n');

        function setVisible(el, visible) {
            if (visible) {
                el.classList.add('visible');
                el.style.display = '';
            } else {
                el.classList.remove('visible');
                el.style.display = 'none';
            }
        }

        function renderStep() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps - 1;
            stepIndicator.textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;

            if (currentStep === 0) {
                setVisible(coordM, false); setVisible(coordN, false);
                setVisible(lonArrow, false); setVisible(lonDiff, false);
                setVisible(latPath, false); setVisible(latLabel, false); setVisible(latNote, false);
                setVisible(greatCircle, false); setVisible(gcLabel, false); setVisible(gcNote, false);
                setVisible(arrowNE, false); setVisible(labelNE, false);
                setVisible(arrowSE, false); setVisible(labelSE, false);
                setVisible(turningPoint, false);
                pointM.setAttribute('r', '5'); pointN.setAttribute('r', '5');
                optionA.classList.remove('dimmed', 'highlight-correct');
                optionB.classList.remove('dimmed', 'highlight-correct');
                optionC.classList.remove('dimmed', 'highlight-correct');
                optionD.classList.remove('dimmed', 'highlight-correct');
            } else if (currentStep === 1) {
                setVisible(coordM, true); setVisible(coordN, true);
                setVisible(lonArrow, true); setVisible(lonDiff, true);
                setVisible(latPath, false); setVisible(latLabel, false); setVisible(latNote, false);
                setVisible(greatCircle, false); setVisible(gcLabel, false); setVisible(gcNote, false);
                setVisible(arrowNE, false); setVisible(labelNE, false);
                setVisible(arrowSE, false); setVisible(labelSE, false);
                setVisible(turningPoint, false);
                pointM.setAttribute('r', '7'); pointN.setAttribute('r', '7');
                optionA.classList.remove('dimmed', 'highlight-correct');
                optionB.classList.remove('dimmed', 'highlight-correct');
                optionC.classList.remove('dimmed', 'highlight-correct');
                optionD.classList.remove('dimmed', 'highlight-correct');
            } else if (currentStep === 2) {
                setVisible(coordM, true); setVisible(coordN, true);
                setVisible(lonArrow, true); setVisible(lonDiff, true);
                setVisible(latPath, true); setVisible(latLabel, true); setVisible(latNote, true);
                setVisible(greatCircle, false); setVisible(gcLabel, false); setVisible(gcNote, false);
                setVisible(arrowNE, false); setVisible(labelNE, false);
                setVisible(arrowSE, false); setVisible(labelSE, false);
                setVisible(turningPoint, false);
                pointM.setAttribute('r', '7'); pointN.setAttribute('r', '7');
                optionA.classList.remove('dimmed', 'highlight-correct');
                optionB.classList.remove('dimmed', 'highlight-correct');
                optionC.classList.remove('dimmed', 'highlight-correct');
                optionD.classList.remove('dimmed', 'highlight-correct');
            } else if (currentStep === 3) {
                setVisible(coordM, true); setVisible(coordN, true);
                setVisible(lonArrow, true); setVisible(lonDiff, true);
                setVisible(latPath, true); setVisible(latLabel, true); setVisible(latNote, true);
                setVisible(greatCircle, true); setVisible(gcLabel, true); setVisible(gcNote, true);
                setVisible(arrowNE, false); setVisible(labelNE, false);
                setVisible(arrowSE, false); setVisible(labelSE, false);
                setVisible(turningPoint, false);
                pointM.setAttribute('r', '7'); pointN.setAttribute('r', '7');
                optionA.classList.remove('dimmed', 'highlight-correct');
                optionB.classList.remove('dimmed', 'highlight-correct');
                optionC.classList.remove('dimmed', 'highlight-correct');
                optionD.classList.remove('dimmed', 'highlight-correct');
            } else if (currentStep === 4) {
                setVisible(coordM, true); setVisible(coordN, true);
                setVisible(lonArrow, true); setVisible(lonDiff, true);
                setVisible(latPath, true); setVisible(latLabel, true); setVisible(latNote, true);
                setVisible(greatCircle, true); setVisible(gcLabel, true); setVisible(gcNote, true);
                setVisible(arrowNE, true); setVisible(labelNE, true);
                setVisible(arrowSE, true); setVisible(labelSE, true);
                setVisible(turningPoint, true);
                pointM.setAttribute('r', '7'); pointN.setAttribute('r', '7');
                optionA.classList.remove('dimmed', 'highlight-correct');
                optionB.classList.remove('dimmed', 'highlight-correct');
                optionC.classList.remove('dimmed', 'highlight-correct');
                optionD.classList.remove('dimmed', 'highlight-correct');
            } else if (currentStep === 5) {
                setVisible(coordM, true); setVisible(coordN, true);
                setVisible(lonArrow, true); setVisible(lonDiff, true);
                setVisible(latPath, true); setVisible(latLabel, true); setVisible(latNote, true);
                setVisible(greatCircle, true); setVisible(gcLabel, true); setVisible(gcNote, true);
                setVisible(arrowNE, true); setVisible(labelNE, true);
                setVisible(arrowSE, true); setVisible(labelSE, true);
                setVisible(turningPoint, true);
                pointM.setAttribute('r', '7'); pointN.setAttribute('r', '7');
                optionA.classList.add('dimmed');
                optionB.classList.add('dimmed');
                optionC.classList.add('dimmed');
                optionD.classList.add('highlight-correct');
            }
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) { currentStep--; renderStep(); }
        });
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) { currentStep++; renderStep(); }
        });
        renderStep();
    })();
    </script>
</body>
</html>
