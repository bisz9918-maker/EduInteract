<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>南极点俯视图 - 晨昏线与日期分界线</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            padding: 6px 16px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #f5f5f5;
        }
        #scene1-controls button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #scene1-step-indicator {
            font-size: 14px;
            color: #333;
            min-width: 70px;
            text-align: center;
        }
        .scene1-step-group {
            display: none;
            opacity: 0;
        }
        .scene1-step-group.active {
            display: block;
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene1-arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#1565c0" />
                </marker>
                <marker id="scene1-arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#c62828" />
                </marker>
            </defs>

            <!-- ========== 步骤0：基础元素（始终显示） ========== -->
            <g id="scene1-step-0" class="scene1-step-group active">
                <!-- 外框半圆：圆心(350,380), R=240, 从0°到180° -->
                <path d="M 590 380 A 240 240 0 0 0 110 380" fill="none" stroke="#000000" stroke-width="1.5" />

                <!-- 经线网（7条射线） -->
                <!-- 0°经线 -->
                <line x1="350" y1="380" x2="590" y2="380" stroke="#000000" stroke-width="1.5" />
                <!-- 30°W经线 -->
                <line x1="350" y1="380" x2="558" y2="260" stroke="#000000" stroke-width="1.5" />
                <!-- 60°W经线 -->
                <line x1="350" y1="380" x2="470" y2="172" stroke="#000000" stroke-width="1.5" />
                <!-- 90°W经线 -->
                <line x1="350" y1="380" x2="350" y2="140" stroke="#000000" stroke-width="1.5" />
                <!-- 120°W经线 -->
                <line x1="350" y1="380" x2="230" y2="172" stroke="#000000" stroke-width="1.5" />
                <!-- 150°W经线 -->
                <line x1="350" y1="380" x2="142" y2="260" stroke="#000000" stroke-width="1.5" />
                <!-- 180°经线 -->
                <line x1="350" y1="380" x2="110" y2="380" stroke="#000000" stroke-width="1.5" />

                <!-- 晨昏线MA -->
                <line x1="305" y1="302" x2="540" y2="270" stroke="#1565c0" stroke-width="2.5" />

                <!-- 阴影扇形：120°W到180° -->
                <path d="M 350 380 L 230 172 A 240 240 0 0 0 110 380 Z" fill="#c62828" opacity="0.2" />

                <!-- 点O（南极点） -->
                <circle cx="350" cy="380" r="3" fill="#000000" />
                <!-- 点A -->
                <circle cx="540" cy="270" r="3" fill="#000000" />
                <!-- 点M -->
                <circle cx="305" cy="302" r="3" fill="#000000" />
                <!-- 点B -->
                <circle cx="160" cy="270" r="3" fill="#000000" />

                <!-- 基础标签 -->
                <text x="340" y="405" font-family="sans-serif" font-size="14" fill="#000000">O</text>
                <text x="600" y="280" font-family="sans-serif" font-size="14" fill="#000000">A</text>
                <text x="280" y="395" font-family="sans-serif" font-size="14" fill="#000000">M</text>
                <text x="80" y="275" font-family="sans-serif" font-size="14" fill="#000000">B</text>
                <text x="450" y="420" font-family="sans-serif" font-size="14" fill="#000000">70°</text>
            </g>

            <!-- ========== 步骤1：自转方向 ========== -->
            <g id="scene1-step-1" class="scene1-step-group">
                <!-- 顺时针箭头：圆心(350,380), r=35, 从约385,346顺时针到约385,414 -->
                <path d="M 385 346 A 35 35 0 1 1 385 414" fill="none" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-blue)" />
                <text x="620" y="365" font-family="sans-serif" font-size="14" fill="#1565c0">顺时针</text>
            </g>

            <!-- ========== 步骤2：切点与纬线 ========== -->
            <g id="scene1-step-2" class="scene1-step-group">
                <!-- 70°S纬线：圆心(350,380), r=90, 虚线圆弧 -->
                <path d="M 440 380 A 90 90 0 0 0 260 380" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" />
                <text x="30" y="180" font-family="sans-serif" font-size="14" fill="#000000">晨昏线与70°S相切</text>
                <text x="620" y="170" font-family="sans-serif" font-size="14" fill="#000000">90° - 70° = 20°</text>
            </g>

            <!-- ========== 步骤3：日期分界线 ========== -->
            <g id="scene1-step-3" class="scene1-step-group">
                <!-- 0时经线高亮（120°W） -->
                <line x1="350" y1="380" x2="230" y2="172" stroke="#c62828" stroke-width="3" />
                <!-- 180°经线高亮 -->
                <line x1="350" y1="380" x2="110" y2="380" stroke="#c62828" stroke-width="3" />
                <!-- 阴影加深 -->
                <path d="M 350 380 L 230 172 A 240 240 0 0 0 110 380 Z" fill="#c62828" opacity="0.25" />
                <!-- 标签 -->
                <text x="80" y="130" font-family="sans-serif" font-size="14" fill="#c62828">0时经线</text>
                <text x="60" y="360" font-family="sans-serif" font-size="14" fill="#c62828">180°经线</text>
                <!-- 旧的一天箭头：圆心(350,380), r=180, 弧线 -->
                <path d="M 170 380 A 180 180 0 0 1 260 224" fill="none" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrow-red)" />
                <text x="50" y="320" font-family="sans-serif" font-size="14" fill="#c62828">旧的一天</text>
            </g>

            <!-- ========== 步骤4：直射纬度 ========== -->
            <g id="scene1-step-4" class="scene1-step-group">
                <text x="620" y="150" font-family="sans-serif" font-size="14" fill="#000000">太阳直射 20°S</text>
                <text x="50" y="380" font-family="sans-serif" font-size="14" fill="#000000">南极附近极昼</text>
            </g>

            <!-- ========== 步骤5：直射经线与坐标 ========== -->
            <g id="scene1-step-5" class="scene1-step-group">
                <!-- 0时标签（靠近M） -->
                <text x="620" y="220" font-family="sans-serif" font-size="14" fill="#000000">0时</text>
                <!-- 60°E虚线：从O(350,380)到(400,420) -->
                <line x1="350" y1="380" x2="400" y2="420" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" />
                <text x="500" y="430" font-family="sans-serif" font-size="14" fill="#000000">12时经线(60°E)</text>
                <!-- 太阳直射点五角星：中心(650,300), r=15 -->
                <polygon points="650,285 654,295 665,295 656,302 660,313 650,306 640,313 644,302 635,295 646,295" fill="#2e7d32" />
                <text x="670" y="300" font-family="sans-serif" font-size="14" fill="#2e7d32">太阳直射点</text>
                <text x="670" y="320" font-family="sans-serif" font-size="14" fill="#2e7d32">(20°S, 60°E)</text>
            </g>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 0/5</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        var currentStep = 0;
        var totalSteps = 5;

        var btnPrev = document.getElementById('scene1-btn-prev');
        var btnNext = document.getElementById('scene1-btn-next');
        var indicator = document.getElementById('scene1-step-indicator');

        function updateUI() {
            // 更新步骤指示器
            indicator.textContent = '步骤 ' + currentStep + '/' + totalSteps;

            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps);

            // 更新各步骤组的显隐
            for (var i = 0; i <= totalSteps; i++) {
                var group = document.getElementById('scene1-step-' + i);
                if (group) {
                    if (i <= currentStep) {
                        group.style.display = 'block';
                        group.style.opacity = '1';
                    } else {
                        group.style.display = 'none';
                        group.style.opacity = '0';
                    }
                }
            }
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateUI();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateUI();
            }
        });

        // 初始化
        updateUI();
    })();
    </script>
</body>
</html>
