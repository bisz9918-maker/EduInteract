<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scene 3</title>
<style>
body{margin:0;padding:0;background:#fff;font-family:"Microsoft YaHei",sans-serif;}
#scene3-container{position:relative;width:800px;height:500px;background:#fff;margin:0 auto;overflow:hidden;}
#scene3-controls{position:absolute;bottom:0;left:0;right:0;height:50px;display:flex;justify-content:center;align-items:center;gap:12px;z-index:10;background:#f5f5f5;}
#scene3-controls button{padding:6px 16px;font-size:14px;cursor:pointer;border:1px solid #ccc;border-radius:4px;background:#fff;}
#scene3-controls button:disabled{opacity:0.5;cursor:not-allowed;}
#scene3-step-indicator{font-size:14px;color:#333;min-width:80px;text-align:center;}
@keyframes s3s{from{transform:translateX(20px);opacity:0;}to{transform:translateX(0);opacity:1;}}
.s3si{animation:s3s 0.3s ease forwards;}
@keyframes s3p{0%{transform:scale(1);opacity:0.3;}50%{transform:scale(1.3);opacity:0.15;}100%{transform:scale(1);opacity:0;}}
.s3pu{animation:s3p 1s ease forwards;transform-origin:center;}
</style>
</head>
<body>
<div id="scene3-container">
<svg width="800" height="500" viewBox="0 0 800 500" style="display:block;">
<rect x="0" y="450" width="800" height="50" fill="#f5f5f5"/>
<g id="scene3-base">
<circle cx="180" cy="240" r="126" fill="none" stroke="#000" stroke-width="2"/>
<path d="M 60.4,279.8 A 126,126 0 0,0 299.6,200.2 L 180,240 Z" fill="#e0e0e0" opacity="0.4"/>
<line x1="140" y1="120" x2="220" y2="360" stroke="#000" stroke-width="1"/>
<text x="25" y="340" font-size="12" fill="#000" font-family="sans-serif">地轴</text>
<line x1="66" y1="278" x2="294" y2="202" stroke="#888" stroke-width="1.5" stroke-dasharray="5,5"/>
<text x="305" y="195" font-size="12" fill="#888" font-family="sans-serif">赤道</text>
<line x1="48" y1="162" x2="144" y2="130" stroke="#888" stroke-width="1.5" stroke-dasharray="5,5"/>
<text x="20" y="115" font-size="12" fill="#888" font-family="sans-serif">北极圈</text>
<line x1="258" y1="267" x2="354" y2="235" stroke="#888" stroke-width="1.5" stroke-dasharray="5,5"/>
<text x="365" y="200" font-size="12" fill="#888" font-family="sans-serif">南回归线</text>
<circle cx="140" cy="120" r="6" fill="#c62828"/>
<text x="118" y="112" font-size="14" fill="#000" font-family="sans-serif" font-weight="bold">A</text>
<circle cx="96" cy="146" r="6" fill="#1565c0"/>
<text x="35" y="150" font-size="14" fill="#000" font-family="sans-serif" font-weight="bold">B</text>
<circle cx="306" cy="251" r="6" fill="#2e7d32"/>
<text x="360" y="255" font-size="14" fill="#000" font-family="sans-serif" font-weight="bold">C</text>
</g>
<g id="scene3-step-1" display="none">
<text x="150" y="95" font-size="12" fill="#c62828" font-family="sans-serif">90°N</text>
<text x="20" y="195" font-size="12" fill="#1565c0" font-family="sans-serif">66°34′N</text>
<text x="318" y="285" font-size="12" fill="#2e7d32" font-family="sans-serif">23°26′S</text>
<text x="520" y="80" font-size="14" font-weight="bold" fill="#000" font-family="sans-serif">纬度位置对比</text>
<line x1="520" y1="220" x2="700" y2="220" stroke="#000" stroke-width="1"/>
<rect x="535" y="130" width="30" height="90" fill="#c62828" opacity="0.7"/>
<rect x="595" y="153.5" width="30" height="66.5" fill="#1565c0" opacity="0.7"/>
<rect x="655" y="196.5" width="30" height="23.5" fill="#2e7d32" opacity="0.7"/>
<text x="548" y="235" font-size="12" fill="#000" font-family="sans-serif" text-anchor="middle">A</text>
<text x="608" y="235" font-size="12" fill="#000" font-family="sans-serif" text-anchor="middle">B</text>
<text x="668" y="235" font-size="12" fill="#000" font-family="sans-serif" text-anchor="middle">C</text>
</g>
<g id="scene3-step-2" display="none">
<text x="520" y="80" font-size="14" font-weight="bold" fill="#000" font-family="sans-serif">地转偏向力</text>
<text x="390" y="115" font-size="11" fill="#000" font-family="sans-serif">北半球</text>
<line x1="435" y1="130" x2="475" y2="130" stroke="#c62828" stroke-width="2" marker-end="url(#ar)"/>
<text x="480" y="133" font-size="11" fill="#c62828" font-family="sans-serif">向右偏</text>
<text x="390" y="165" font-size="11" fill="#000" font-family="sans-serif">南半球</text>
<line x1="475" y1="180" x2="435" y2="180" stroke="#1565c0" stroke-width="2" marker-end="url(#ab)"/>
<text x="435" y="195" font-size="11" fill="#1565c0" font-family="sans-serif">向左偏</text>
<text x="395" y="255" font-size="12" fill="#888" font-family="sans-serif">赤道：无偏转</text>
<line x1="520" y1="220" x2="700" y2="220" stroke="#000" stroke-width="1"/>
<rect x="535" y="140" width="30" height="80" fill="#c62828" opacity="0.8"/>
<rect x="595" y="170" width="30" height="50" fill="#1565c0" opacity="0.8"/>
<rect x="655" y="215" width="30" height="5" fill="#2e7d32" opacity="0.8"/>
<text x="548" y="235" font-size="12" fill="#000" font-family="sans-serif" text-anchor="middle">A</text>
<text x="608" y="235" font-size="12" fill="#000" font-family="sans-serif" text-anchor="middle">B</text>
<text x="668" y="235" font-size="12" fill="#000" font-family="sans-serif" text-anchor="middle">C</text>
<circle cx="140" cy="120" r="10" fill="none" stroke="#c62828" stroke-width="2" class="s3pu"/>
<circle cx="96" cy="146" r="10" fill="none" stroke="#1565c0" stroke-width="2" class="s3pu"/>
</g>
<g id="scene3-step-3" display="none">
<text x="520" y="200" font-size="16" font-weight="bold" fill="#2e7d32" font-family="sans-serif" class="s3si">地转偏向力最小的是 C</text>
<rect x="655" y="215" width="30" height="5" fill="none" stroke="#2e7d32" stroke-width="2"/>
</g>
<g id="scene3-step-4" display="none">
<line x1="360" y1="240" x2="780" y2="240" stroke="#ccc" stroke-width="1"/>
<text x="520" y="270" font-size="14" font-weight="bold" fill="#000" font-family="sans-serif">自转线速度</text>
<text x="390" y="305" font-size="11" fill="#000" font-family="sans-serif">A点（极点）</text>
<line x1="465" y1="302" x2="470" y2="302" stroke="#c62828" stroke-width="3"/>
<text x="475" y="305" font-size="11" fill="#c62828" font-family="sans-serif">≈0</text>
<text x="390" y="335" font-size="11" fill="#000" font-family="sans-serif">B点（北极圈）</text>
<line x1="465" y1="332" x2="495" y2="332" stroke="#1565c0" stroke-width="2" marker-end="url(#ab)"/>
<text x="390" y="365" font-size="11" fill="#000" font-family="sans-serif">C点（南回归线）</text>
<line x1="465" y1="362" x2="515" y2="362" stroke="#2e7d32" stroke-width="2" marker-end="url(#ag)"/>
<line x1="520" y1="410" x2="700" y2="410" stroke="#000" stroke-width="1"/>
<rect x="535" y="405" width="30" height="5" fill="#c62828" opacity="0.8"/>
<rect x="595" y="360" width="30" height="50" fill="#1565c0" opacity="0.8"/>
<rect x="655" y="330" width="30" height="80" fill="#2e7d32" opacity="0.8"/>
<text x="548" y="425" font-size="12" fill="#000" font-family="sans-serif" text-anchor="middle">A</text>
<text x="608" y="425" font-size="12" fill="#000" font-family="sans-serif" text-anchor="middle">B</text>
<text x="668" y="425" font-size="12" fill="#000" font-family="sans-serif" text-anchor="middle">C</text>
<circle cx="306" cy="251" r="10" fill="none" stroke="#2e7d32" stroke-width="2" class="s3pu"/>
</g>
<g id="scene3-step-5" display="none">
<text x="520" y="390" font-size="16" font-weight="bold" fill="#2e7d32" font-family="sans-serif" class="s3si">自转线速度最快的是 C</text>
<rect x="655" y="330" width="30" height="80" fill="none" stroke="#2e7d32" stroke-width="2"/>
</g>
<defs>
<marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#c62828"/></marker>
<marker id="ab" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#1565c0"/></marker>
<marker id="ag" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2e7d32"/></marker>
</defs>
</svg>
<div id="scene3-controls">
<button id="scene3-btn-prev">◀ 上一步</button>
<span id="scene3-step-indicator">步骤 0 / 5</span>
<button id="scene3-btn-next">下一步 ▶</button>
</div>
</div>
<script>
(function(){
var cs=0,ts=5;
var bp=document.getElementById('scene3-btn-prev');
var bn=document.getElementById('scene3-btn-next');
var ind=document.getElementById('scene3-step-indicator');
function sd(id,v){var g=document.getElementById(id);if(g)g.setAttribute('display',v);}
function us(ns){
cs=ns;ind.textContent='步骤 '+cs+' / '+ts;
bp.disabled=(cs<=0);bn.disabled=(cs>=ts);
for(var i=1;i<=ts;i++)sd('scene3-step-'+i,'none');
if(cs===1)sd('scene3-step-1','inline');
else if(cs===2)sd('scene3-step-2','inline');
else if(cs===3){sd('scene3-step-2','inline');sd('scene3-step-3','inline');}
else if(cs===4){sd('scene3-step-2','inline');sd('scene3-step-4','inline');}
else if(cs===5){sd('scene3-step-2','inline');sd('scene3-step-4','inline');sd('scene3-step-5','inline');}
}
bp.addEventListener('click',function(){if(cs>0)us(cs-1);});
bn.addEventListener('click',function(){if(cs<ts)us(cs+1);});
us(0);
})();
</script>
</body>
</html>
