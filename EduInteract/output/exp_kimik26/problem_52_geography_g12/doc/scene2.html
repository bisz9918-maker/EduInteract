<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scene 2</title>
<style>
body { margin:0; padding:0; background:#fff; font-family:"Microsoft YaHei",sans-serif; }
#scene2-container { position:relative; width:800px; height:500px; background:#fff; margin:0 auto; overflow:hidden; }
#scene2-controls { position:absolute; bottom:10px; left:0; right:0; display:flex; justify-content:center; align-items:center; gap:12px; z-index:10; }
#scene2-controls button { padding:6px 16px; font-size:14px; color:#fff; background:#1565c0; border:none; border-radius:4px; cursor:pointer; font-family:inherit; }
#scene2-controls button:disabled { background:#90a4ae; cursor:not-allowed; }
#scene2-step-indicator { font-size:12px; color:#666; min-width:60px; text-align:center; }
#scene2-conclusion-card { position:absolute; top:120px; left:20px; width:190px; padding:14px; background:#fff; border:1.5px solid #1565c0; border-radius:8px; box-shadow:2px 2px 4px rgba(0,0,0,0.2); display:none; z-index:5; text-align:center; }
#scene2-conclusion-card h3 { margin:0 0 10px 0; font-size:15px; color:#1565c0; font-weight:bold; }
#scene2-conclusion-card p { margin:5px 0; font-size:13px; color:#000; line-height:1.4; }
#scene2-conclusion-card .highlight { color:#2e7d32; font-weight:bold; font-size:14px; }
</style>
</head>
<body>
<div id="scene2-container">
<svg id="scene2-svg" width="800" height="500">
<defs>
<pattern id="scene2-hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
<line x1="0" y1="0" x2="0" y2="6" stroke="#37474f" stroke-width="1" />
</pattern>
<marker id="scene2-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,6 L9,3 z" fill="#ff8f00" />
</marker>
</defs>

<circle cx="400" cy="250" r="150" fill="none" stroke="#000" stroke-width="1.5" />

<line x1="400" y1="100" x2="325" y2="250" stroke="#000" stroke-width="0.8" />
<line x1="400" y1="100" x2="400" y2="250" stroke="#000" stroke-width="0.8" />
<line x1="400" y1="100" x2="475" y2="250" stroke="#000" stroke-width="0.8" />
<line x1="400" y1="400" x2="325" y2="250" stroke="#000" stroke-width="0.8" />
<line x1="400" y1="400" x2="400" y2="250" stroke="#000" stroke-width="0.8" />
<line x1="400" y1="400" x2="475" y2="250" stroke="#000" stroke-width="0.8" />

<line x1="250" y1="250" x2="550" y2="250" stroke="#000" stroke-width="1" />

<path id="scene2-arctic-circle" d="M 360,140 A 150,150 0 0,1 440,140" fill="none" stroke="#c62828" stroke-width="1.5" stroke-dasharray="5,3" style="display:none" />
<path id="scene2-antarctic-circle" d="M 360,360 A 150,150 0 0,0 440,360" fill="none" stroke="#c62828" stroke-width="1.5" stroke-dasharray="5,3" style="display:none" />

<path id="scene2-terminator-south" d="M 320,250 C 360,395 440,395 480,250" fill="none" stroke="#c62828" stroke-width="3" style="display:none" />
<path id="scene2-terminator-north" d="M 320,250 C 360,105 440,105 480,250" fill="none" stroke="#c62828" stroke-width="3" style="display:none" />

<path id="scene2-south-shadow" d="M 320,250 C 360,395 440,395 480,250 A 150,150 0 0,0 320,250 Z" fill="url(#scene2-hatch)" opacity="0.3" />
<path id="scene2-north-shadow" d="M 320,250 C 360,105 440,105 480,250 A 150,150 0 0,1 320,250 Z" fill="url(#scene2-hatch)" opacity="0.3" style="display:none" />

<path id="scene2-polar-day-area" d="M 400,100 L 360,140 L 440,140 Z" fill="#fff3e0" opacity="0.5" style="display:none" />

<line id="scene2-sun-ray" x1="620" y1="150" x2="500" y2="150" stroke="#ff8f00" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#scene2-arrow)" />

<circle id="scene2-tangent-dot" cx="400" cy="360" r="5" fill="#c62828" stroke="#fff" stroke-width="2" style="display:none" />

<text id="scene2-label-N" x="400" y="85" text-anchor="middle" font-size="14" fill="#000">N</text>
<text id="scene2-label-S" x="400" y="418" text-anchor="middle" font-size="14" fill="#000">S</text>
<text id="scene2-label-A" x="565" y="245" text-anchor="start" font-size="14" fill="#000">A</text>
<text id="scene2-label-B" x="210" y="245" text-anchor="start" font-size="14" fill="#000">B</text>
<text id="scene2-label-C" x="565" y="280" text-anchor="start" font-size="14" fill="#000">C</text>
<text id="scene2-label-jia" x="210" y="333" text-anchor="start" font-size="14" fill="#000">甲</text>
<text id="scene2-label-yi" x="565" y="165" text-anchor="start" font-size="14" fill="#000">乙</text>
<text id="scene2-label-20w" x="210" y="265" text-anchor="start" font-size="14" fill="#000">20°W</text>
<text id="scene2-label-equator" x="565" y="215" text-anchor="start" font-size="14" fill="#000">赤道</text>
<text id="scene2-label-arctic" x="565" y="138" text-anchor="start" font-size="12" fill="#c62828">北极圈</text>
<text id="scene2-label-antarctic" x="565" y="355" text-anchor="start" font-size="12" fill="#c62828">南极圈</text>

<text id="scene2-label-terminator-south" x="565" y="333" text-anchor="start" font-size="14" fill="#c62828" style="display:none">晨昏线</text>
<text id="scene2-label-terminator-north" x="565" y="145" text-anchor="start" font-size="14" fill="#c62828" style="display:none">晨昏线</text>
<text id="scene2-label-polar-night" x="565" y="410" text-anchor="start" font-size="13" fill="#c62828" style="display:none">南极圈内极夜</text>
<text id="scene2-label-polar-day" x="565" y="122" text-anchor="start" font-size="13" fill="#c62828" style="display:none">极昼</text>
<text id="scene2-label-night-hemisphere" x="210" y="178" text-anchor="start" font-size="13" fill="#37474f" style="display:none">夜半球</text>
<text id="scene2-label-day-hemisphere" x="565" y="198" text-anchor="start" font-size="13" fill="#37474f" style="display:none">昼半球</text>
<text id="scene2-label-sun-ray" x="565" y="190" text-anchor="start" font-size="14" fill="#ff8f00">太阳光线</text>
<text id="scene2-label-tangent" x="565" y="385" text-anchor="start" font-size="13" fill="#c62828" style="display:none">相切</text>
</svg>

<div id="scene2-conclusion-card">
<h3>日期判读结论</h3>
<p>南极圈出现极夜</p>
<p>↓</p>
<p>太阳直射北回归线</p>
<p>↓</p>
<p class="highlight">6月22日（夏至）</p>
</div>

<div id="scene2-controls">
<button id="scene2-btn-prev">◀ 上一步</button>
<div id="scene2-step-indicator">步骤 1/5</div>
<button id="scene2-btn-next">下一步 ▶</button>
</div>
</div>

<script>
(function() {
let currentStep = 0;
const totalSteps = 5;

const els = {
terminatorSouth: document.getElementById('scene2-terminator-south'),
terminatorNorth: document.getElementById('scene2-terminator-north'),
arcticCircle: document.getElementById('scene2-arctic-circle'),
antarcticCircle: document.getElementById('scene2-antarctic-circle'),
northShadow: document.getElementById('scene2-north-shadow'),
polarDayArea: document.getElementById('scene2-polar-day-area'),
tangentDot: document.getElementById('scene2-tangent-dot'),
conclusionCard: document.getElementById('scene2-conclusion-card'),
labelTerminatorSouth: document.getElementById('scene2-label-terminator-south'),
labelTerminatorNorth: document.getElementById('scene2-label-terminator-north'),
labelPolarNight: document.getElementById('scene2-label-polar-night'),
labelPolarDay: document.getElementById('scene2-label-polar-day'),
labelNightHemisphere: document.getElementById('scene2-label-night-hemisphere'),
labelDayHemisphere: document.getElementById('scene2-label-day-hemisphere'),
labelTangent: document.getElementById('scene2-label-tangent'),
btnPrev: document.getElementById('scene2-btn-prev'),
btnNext: document.getElementById('scene2-btn-next'),
stepIndicator: document.getElementById('scene2-step-indicator')
};

function setDisplay(el, show) { if(!el) return; el.style.display = show ? 'block' : 'none'; }

function renderStep() {
setDisplay(els.terminatorSouth, currentStep >= 1);
setDisplay(els.labelTerminatorSouth, currentStep >= 1);
setDisplay(els.antarcticCircle, currentStep >= 2);
setDisplay(els.tangentDot, currentStep >= 2);
setDisplay(els.labelTangent, currentStep >= 2);
setDisplay(els.labelPolarNight, currentStep >= 2);
setDisplay(els.conclusionCard, currentStep >= 3);
setDisplay(els.terminatorNorth, currentStep >= 4);
setDisplay(els.arcticCircle, currentStep >= 4);
setDisplay(els.northShadow, currentStep >= 4);
setDisplay(els.polarDayArea, currentStep >= 4);
setDisplay(els.labelTerminatorNorth, currentStep >= 4);
setDisplay(els.labelPolarDay, currentStep >= 4);
setDisplay(els.labelNightHemisphere, currentStep >= 4);
setDisplay(els.labelDayHemisphere, currentStep >= 4);
els.stepIndicator.textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;
els.btnPrev.disabled = currentStep === 0;
els.btnNext.disabled = currentStep === totalSteps - 1;
}

els.btnPrev.addEventListener('click', function() { if(currentStep > 0) { currentStep--; renderStep(); } });
els.btnNext.addEventListener('click', function() { if(currentStep < totalSteps - 1) { currentStep++; renderStep(); } });
renderStep();
})();
</script>
</body>
</html>
