<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 1 - 圆周角定理应用</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }

        /* 推导面板 - HTML实现，避免SVG内文字与背景rect重叠 */
        #scene1-panel {
            position: absolute; right: 20px; top: 20px; width: 260px; height: 400px;
            background: #f5f5f5; border: 1px solid #dddddd; border-radius: 4px;
            padding: 20px; box-sizing: border-box; z-index: 5;
        }
        #scene1-panel-title { font-size: 16px; font-weight: bold; color: #333333; margin-bottom: 18px; }
        .scene1-panel-line {
            font-size: 14px; margin-bottom: 16px; line-height: 1.4;
            transition: opacity 0.3s ease;
        }
        .scene1-panel-line.hidden { opacity: 0; }
        .panel-blue { color: #1565c0; }
        .panel-red { color: #c62828; }
        .panel-green { color: #2e7d32; }
        .panel-bold { font-weight: bold; color: #333333; }

        /* 控件栏 */
        #scene1-controls {
            position: absolute; bottom: 10px; left: 0; right: 0;
            display: flex; justify-content: center; gap: 12px; z-index: 10;
        }
        #scene1-controls button {
            padding: 8px 20px; font-size: 14px; cursor: pointer;
            background: #1565c0; color: #ffffff; border: none; border-radius: 4px;
            min-width: 110px; height: 36px;
        }
        #scene1-controls button:disabled { background: #9e9e9e; cursor: not-allowed; }

        /* SVG元素过渡 */
        .scene1-elem { transition: opacity 0.3s ease; }
        .dimmed { opacity: 0.35; }
        .hidden { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <!-- 推导面板 -->
        <div id="scene1-panel">
            <div id="scene1-panel-title">推导过程</div>
            <div id="scene1-panel-step0" class="scene1-panel-line panel-blue">已知：AB = 4，∠ACB = 37°</div>
            <div id="scene1-panel-step1" class="scene1-panel-line panel-red hidden">∠AOB = 2∠ACB = 74°</div>
            <div id="scene1-panel-step2" class="scene1-panel-line panel-green hidden">OD ⊥ AB，AD = DB = 2</div>
            <div id="scene1-panel-step3a" class="scene1-panel-line panel-green hidden">在 Rt△AOD 中：</div>
            <div id="scene1-panel-step3b" class="scene1-panel-line panel-green hidden">sin37° = AD/OA = 2/r</div>
            <div id="scene1-panel-step4a" class="scene1-panel-line panel-bold hidden">r = 2/sin37°</div>
            <div id="scene1-panel-step4b" class="scene1-panel-line panel-bold hidden">S = πr² = 4π/sin²37°</div>
        </div>

        <!-- SVG图示区 -->
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 圆O -->
            <circle id="scene1-circle-o" cx="280" cy="240" r="130" fill="none" stroke="#000000" stroke-width="2"/>

            <!-- 弦AB -->
            <line id="scene1-line-ab" x1="384" y1="162" x2="384" y2="318" stroke="#000000" stroke-width="2"/>

            <!-- 弦AC -->
            <line id="scene1-line-ac" x1="257" y1="368" x2="384" y2="318" stroke="#000000" stroke-width="2"/>

            <!-- 弦BC -->
            <line id="scene1-line-bc" x1="257" y1="368" x2="384" y2="162" stroke="#000000" stroke-width="2"/>

            <!-- 半径OA (步骤1起) -->
            <line id="scene1-line-oa" class="scene1-elem hidden" x1="280" y1="240" x2="384" y2="318" stroke="#000000" stroke-width="2"/>

            <!-- 半径OB (步骤1起) -->
            <line id="scene1-line-ob" class="scene1-elem hidden" x1="280" y1="240" x2="384" y2="162" stroke="#000000" stroke-width="2"/>

            <!-- 垂线OD (步骤2起) -->
            <line id="scene1-line-od" class="scene1-elem hidden" x1="280" y1="240" x2="384" y2="240" stroke="#2e7d32" stroke-width="2"/>

            <!-- 直角符号 (步骤2起) -->
            <path id="scene1-right-angle" class="scene1-elem hidden" d="M 374 240 L 374 250 L 384 250" fill="none" stroke="#000000" stroke-width="1.5"/>

            <!-- 等长标记AD (步骤2起) -->
            <line id="scene1-tick-ad" class="scene1-elem hidden" x1="374" y1="279" x2="394" y2="279" stroke="#000000" stroke-width="1.5"/>

            <!-- 等长标记DB (步骤2起) -->
            <line id="scene1-tick-db" class="scene1-elem hidden" x1="374" y1="201" x2="394" y2="201" stroke="#000000" stroke-width="1.5"/>

            <!-- ∠ACB角度弧 (步骤0起，蓝色) -->
            <path id="scene1-angle-acb" d="M 268.5 349.2 A 22 22 0 0 0 277.4 360.1" fill="none" stroke="#1565c0" stroke-width="2"/>
            <path id="scene1-angle-acb-fill" d="M 268.5 349.2 A 22 22 0 0 0 277.4 360.1 L 257 368 Z" fill="#1565c0" opacity="0.15"/>

            <!-- ∠AOB角度弧 (步骤1起，红色) -->
            <path id="scene1-angle-aob" class="scene1-elem hidden" d="M 304 222 A 30 30 0 0 1 304 258" fill="none" stroke="#c62828" stroke-width="2"/>
            <path id="scene1-angle-aob-fill" class="scene1-elem hidden" d="M 304 222 A 30 30 0 0 1 304 258 L 280 240 Z" fill="#c62828" opacity="0.15"/>

            <!-- ∠AOD角度弧 (步骤3起，绿色) -->
            <path id="scene1-angle-aod" class="scene1-elem hidden" d="M 305 240 A 25 25 0 0 1 300 255" fill="none" stroke="#2e7d32" stroke-width="2"/>
            <path id="scene1-angle-aod-fill" class="scene1-elem hidden" d="M 305 240 A 25 25 0 0 1 300 255 L 280 240 Z" fill="#2e7d32" opacity="0.15"/>

            <!-- 点O -->
            <circle id="scene1-point-o" cx="280" cy="240" r="3" fill="#000000"/>
            <text id="scene1-label-o" x="145" y="240" text-anchor="end" font-size="14" fill="#000000">O</text>

            <!-- 点A -->
            <circle id="scene1-point-a" cx="384" cy="318" r="3" fill="#000000"/>
            <text id="scene1-label-a" x="412" y="318" font-size="14" fill="#000000">A</text>

            <!-- 点B -->
            <circle id="scene1-point-b" cx="384" cy="162" r="3" fill="#000000"/>
            <text id="scene1-label-b" x="412" y="162" font-size="14" fill="#000000">B</text>

            <!-- 点C -->
            <circle id="scene1-point-c" cx="257" cy="368" r="3" fill="#1565c0"/>
            <text id="scene1-label-c" x="257" y="398" text-anchor="middle" font-size="14" fill="#000000">C</text>

            <!-- 点D (步骤2起) -->
            <circle id="scene1-point-d" class="scene1-elem hidden" cx="384" cy="240" r="3" fill="#2e7d32"/>
            <text id="scene1-label-d" class="scene1-elem hidden" x="412" y="240" font-size="14" fill="#2e7d32">D</text>

            <!-- 标签 AB = 4 -->
            <text id="scene1-label-ab" x="445" y="240" font-size="14" fill="#000000">AB = 4</text>

            <!-- 标签 AD = 2 (步骤2起) -->
            <text id="scene1-label-ad" class="scene1-elem hidden" x="445" y="285" font-size="14" fill="#000000">AD = 2</text>

            <!-- 标签 DB = 2 (步骤2起) -->
            <text id="scene1-label-db" class="scene1-elem hidden" x="445" y="188" font-size="14" fill="#000000">DB = 2</text>

            <!-- 标签 ∠ACB = 37° -->
            <text id="scene1-label-acb" x="310" y="440" font-size="14" fill="#1565c0">∠ACB = 37°</text>

            <!-- 标签 ∠AOB = 74° (步骤1起) -->
            <text id="scene1-label-aob" class="scene1-elem hidden" x="380" y="95" font-size="14" fill="#c62828">∠AOB = 74°</text>

            <!-- 标签 ∠AOD = 37° (步骤3起) -->
            <text id="scene1-label-aod" class="scene1-elem hidden" x="400" y="400" font-size="14" fill="#2e7d32">∠AOD = 37°</text>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        let currentStep = 0;
        const maxStep = 4;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');

        // 每步对应的元素显隐配置
        const stepConfig = [
            // Step 0: 初始状态
            {
                show: [],
                highlight: ['scene1-circle-o','scene1-line-ab','scene1-line-ac','scene1-line-bc',
                            'scene1-angle-acb','scene1-angle-acb-fill',
                            'scene1-point-o','scene1-point-a','scene1-point-b','scene1-point-c',
                            'scene1-label-o','scene1-label-a','scene1-label-b','scene1-label-c',
                            'scene1-label-ab','scene1-label-acb'],
                dimmed: [],
                panel: ['scene1-panel-step0']
            },
            // Step 1: 圆周角定理
            {
                show: ['scene1-line-oa','scene1-line-ob','scene1-angle-aob','scene1-angle-aob-fill',
                       'scene1-label-aob'],
                highlight: ['scene1-line-oa','scene1-line-ob','scene1-angle-aob','scene1-angle-aob-fill',
                            'scene1-label-aob'],
                dimmed: ['scene1-line-ac','scene1-line-bc','scene1-angle-acb','scene1-angle-acb-fill',
                         'scene1-point-c','scene1-label-c','scene1-label-acb'],
                panel: ['scene1-panel-step0','scene1-panel-step1']
            },
            // Step 2: 垂径定理
            {
                show: ['scene1-line-od','scene1-right-angle','scene1-tick-ad','scene1-tick-db',
                       'scene1-point-d','scene1-label-d','scene1-label-ad','scene1-label-db'],
                highlight: ['scene1-line-od','scene1-right-angle','scene1-tick-ad','scene1-tick-db',
                            'scene1-point-d','scene1-label-d','scene1-label-ad','scene1-label-db',
                            'scene1-line-ab','scene1-label-ab'],
                dimmed: ['scene1-line-oa','scene1-line-ob','scene1-angle-aob','scene1-angle-aob-fill',
                         'scene1-label-aob','scene1-angle-acb','scene1-angle-acb-fill',
                         'scene1-point-c','scene1-label-c','scene1-label-acb'],
                panel: ['scene1-panel-step0','scene1-panel-step1','scene1-panel-step2']
            },
            // Step 3: 直角三角形求解
            {
                show: ['scene1-angle-aod','scene1-angle-aod-fill','scene1-label-aod'],
                highlight: ['scene1-line-oa','scene1-line-od','scene1-line-ab',
                            'scene1-right-angle','scene1-tick-ad','scene1-tick-db',
                            'scene1-point-d','scene1-label-d','scene1-label-ad','scene1-label-db',
                            'scene1-angle-aod','scene1-angle-aod-fill','scene1-label-aod'],
                dimmed: ['scene1-line-ob','scene1-angle-aob','scene1-angle-aob-fill','scene1-label-aob',
                         'scene1-angle-acb','scene1-angle-acb-fill','scene1-point-c','scene1-label-c',
                         'scene1-label-acb','scene1-label-ab','scene1-label-db'],
                panel: ['scene1-panel-step0','scene1-panel-step1','scene1-panel-step2',
                        'scene1-panel-step3a','scene1-panel-step3b']
            },
            // Step 4: 最终结果
            {
                show: [],
                highlight: [],
                dimmed: ['scene1-circle-o','scene1-line-ab','scene1-line-ac','scene1-line-bc',
                         'scene1-line-oa','scene1-line-ob','scene1-line-od',
                         'scene1-right-angle','scene1-tick-ad','scene1-tick-db',
                         'scene1-angle-acb','scene1-angle-acb-fill',
                         'scene1-angle-aob','scene1-angle-aob-fill',
                         'scene1-angle-aod','scene1-angle-aod-fill',
                         'scene1-point-o','scene1-point-a','scene1-point-b','scene1-point-c','scene1-point-d',
                         'scene1-label-o','scene1-label-a','scene1-label-b','scene1-label-c','scene1-label-d',
                         'scene1-label-ab','scene1-label-ad','scene1-label-db',
                         'scene1-label-acb','scene1-label-aob','scene1-label-aod'],
                panel: ['scene1-panel-step0','scene1-panel-step1','scene1-panel-step2',
                        'scene1-panel-step3a','scene1-panel-step3b',
                        'scene1-panel-step4a','scene1-panel-step4b']
            }
        ];

        // 所有可能参与显隐控制的SVG元素ID
        const allSvgIds = [
            'scene1-line-oa','scene1-line-ob','scene1-line-od',
            'scene1-right-angle','scene1-tick-ad','scene1-tick-db',
            'scene1-angle-aob','scene1-angle-aob-fill',
            'scene1-angle-aod','scene1-angle-aod-fill',
            'scene1-point-d','scene1-label-d',
            'scene1-label-ad','scene1-label-db','scene1-label-aob','scene1-label-aod'
        ];

        // 所有面板行ID
        const allPanelIds = [
            'scene1-panel-step1','scene1-panel-step2',
            'scene1-panel-step3a','scene1-panel-step3b',
            'scene1-panel-step4a','scene1-panel-step4b'
        ];

        function showElem(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.display = '';
                el.style.opacity = '1';
                el.classList.remove('hidden');
            }
        }

        function hideElem(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.opacity = '0';
                el.classList.add('hidden');
            }
        }

        function setDimmed(id, dim) {
            const el = document.getElementById(id);
            if (el) {
                if (dim) el.classList.add('dimmed');
                else el.classList.remove('dimmed');
            }
        }

        function renderStep() {
            const cfg = stepConfig[currentStep];

            // 1. 隐藏所有动态SVG元素（基础元素始终显示）
            allSvgIds.forEach(id => hideElem(id));

            // 2. 显示当前步需要显示的元素
            cfg.show.forEach(id => showElem(id));
            cfg.highlight.forEach(id => showElem(id));

            // 3. 设置dimmed状态：先清除所有，再按需设置
            const baseIds = stepConfig[0].highlight;
            const allIds = [...baseIds, ...allSvgIds];
            allIds.forEach(id => setDimmed(id, false));
            cfg.highlight.forEach(id => setDimmed(id, false));
            cfg.dimmed.forEach(id => setDimmed(id, true));

            // 4. 更新面板显隐
            allPanelIds.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.classList.add('hidden');
            });
            cfg.panel.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.classList.remove('hidden');
            });

            // 5. 更新按钮状态
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < maxStep) {
                currentStep++;
                renderStep();
            }
        });

        // 初始渲染
        renderStep();
    })();
    </script>
</body>
</html>
