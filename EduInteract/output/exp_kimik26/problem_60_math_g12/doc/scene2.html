<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>椭圆切线截距乘积类比推导</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene2-controls button {
            padding: 6px 16px; font-size: 14px; border: none; border-radius: 4px;
            background: #1565c0; color: #fff; cursor: pointer; min-width: 90px;
        }
        #scene2-controls button:disabled { background: #90a4ae; cursor: not-allowed; }
        #scene2-step-indicator { font-size: 14px; color: #333; min-width: 80px; text-align: center; }
        #scene2-hint { font-size: 12px; color: #666; position: absolute; bottom: 8px; left: 0; right: 0; text-align: center; pointer-events: none; }
        .scene2-hidden { display: none; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" style="display:block;">
            <!-- 坐标轴 -->
            <line id="scene2-axis-x" x1="100" y1="250" x2="600" y2="250" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
            <line id="scene2-axis-y" x1="350" y1="150" x2="350" y2="420" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>

            <!-- 椭圆 -->
            <ellipse id="scene2-ellipse" cx="350" cy="250" rx="200" ry="100" stroke="#000000" stroke-width="2" fill="#2e7d32" fill-opacity="0.15"/>

            <!-- 长轴AB -->
            <line id="scene2-line-ab" x1="150" y1="250" x2="550" y2="250" stroke="#000000" stroke-width="2"/>

            <!-- 切线 -->
            <line id="scene2-line-ac" x1="150" y1="250" x2="150" y2="192.3" stroke="#000000" stroke-width="1.5"/>
            <line id="scene2-line-bd" x1="550" y1="250" x2="550" y2="76.8" stroke="#000000" stroke-width="1.5"/>
            <line id="scene2-line-cd" x1="150" y1="192.3" x2="550" y2="76.8" stroke="#000000" stroke-width="1.5"/>

            <!-- OP连线（步骤1显示） -->
            <line id="scene2-line-op" x1="350" y1="250" x2="250" y2="163.4" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="4,4" class="scene2-hidden"/>

            <!-- θ角弧线（步骤1显示） -->
            <path id="scene2-arc-theta" d="" stroke="#1565c0" stroke-width="1.5" fill="none" class="scene2-hidden"/>

            <!-- PC、PD线段（步骤3+显示） -->
            <line id="scene2-line-pc" x1="250" y1="163.4" x2="150" y2="192.3" stroke="#c62828" stroke-width="2" class="scene2-hidden"/>
            <line id="scene2-line-pd" x1="250" y1="163.4" x2="550" y2="76.8" stroke="#c62828" stroke-width="2" class="scene2-hidden"/>

            <!-- PF1、PF2线段（步骤5+显示） -->
            <line id="scene2-line-pf1" x1="250" y1="163.4" x2="523" y2="250" stroke="#2e7d32" stroke-width="2" class="scene2-hidden"/>
            <line id="scene2-line-pf2" x1="250" y1="163.4" x2="177" y2="250" stroke="#2e7d32" stroke-width="2" class="scene2-hidden"/>

            <!-- 点标记 -->
            <circle id="scene2-point-a" cx="150" cy="250" r="3" fill="#000000" stroke="#ffffff" stroke-width="1.5"/>
            <circle id="scene2-point-b" cx="550" cy="250" r="3" fill="#000000" stroke="#ffffff" stroke-width="1.5"/>
            <circle id="scene2-point-o" cx="350" cy="250" r="3" fill="#000000" stroke="#ffffff" stroke-width="1.5"/>
            <circle id="scene2-point-f1" cx="523" cy="250" r="3" fill="#2e7d32" stroke="#ffffff" stroke-width="1.5"/>
            <circle id="scene2-point-f2" cx="177" cy="250" r="3" fill="#2e7d32" stroke="#ffffff" stroke-width="1.5"/>
            <circle id="scene2-point-p" cx="250" cy="163.4" r="4" fill="#000000" stroke="#ffffff" stroke-width="1.5" style="cursor: pointer;"/>
            <circle id="scene2-point-c" cx="150" cy="192.3" r="3" fill="#000000" stroke="#ffffff" stroke-width="1.5"/>
            <circle id="scene2-point-d" cx="550" cy="76.8" r="3" fill="#000000" stroke="#ffffff" stroke-width="1.5"/>

            <!-- 标签：位置经调整避免与图形/线段重叠 -->
            <text id="scene2-label-a" x="140" y="268" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">A</text>
            <text id="scene2-label-b" x="560" y="268" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">B</text>
            <!-- O 移至椭圆上方，远离 y 轴与 CD 线 bounding box -->
            <text id="scene2-label-o" x="350" y="65" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">O</text>
            <!-- F₁/F₂ 移至椭圆左右外侧，避免与椭圆填充重叠 -->
            <text id="scene2-label-f1" x="560" y="235" font-size="14" font-weight="bold" fill="#2e7d32" text-anchor="middle">F₁</text>
            <text id="scene2-label-f2" x="140" y="235" font-size="14" font-weight="bold" fill="#2e7d32" text-anchor="middle">F₂</text>
            <!-- P 标签大幅上移，避开 CD 线对角 bounding box -->
            <text id="scene2-label-p" x="230" y="73" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">P</text>
            <text id="scene2-label-c" x="130" y="192" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">C</text>
            <text id="scene2-label-d" x="565" y="77" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">D</text>

            <!-- 坐标标注（步骤1显示）：下移至椭圆下方，避免拥挤 -->
            <text id="scene2-coord-na" x="120" y="380" font-size="13" fill="#1565c0" text-anchor="middle" class="scene2-hidden">(−a, 0)</text>
            <text id="scene2-coord-a" x="580" y="380" font-size="13" fill="#1565c0" text-anchor="middle" class="scene2-hidden">(a, 0)</text>
            <text id="scene2-coord-nc" x="200" y="380" font-size="13" fill="#2e7d32" text-anchor="middle" class="scene2-hidden">(−c, 0)</text>
            <text id="scene2-coord-c" x="500" y="380" font-size="13" fill="#2e7d32" text-anchor="middle" class="scene2-hidden">(c, 0)</text>

            <!-- 右侧面板 -->
            <foreignObject x="620" y="50" width="160" height="350">
                <div id="scene2-panel-content" style="width:160px;height:350px;background:#fafafa;border:1px solid #ddd;border-radius:6px;padding:10px;box-sizing:border-box;font-size:13px;line-height:1.6;color:#333;overflow-y:auto;">
                    <div style="font-weight:bold;margin-bottom:8px;font-size:14px;">椭圆参数</div>
                    <div>x²/a² + y²/b² = 1</div>
                    <div style="margin-top:6px;">a = 200</div>
                    <div>b = 100</div>
                    <div>c ≈ 173.2</div>
                    <div>e ≈ 0.866</div>
                </div>
            </foreignObject>
        </svg>

        <div id="scene2-controls">
            <button id="scene2-btn-prev">◀ 上一步</button>
            <span id="scene2-step-indicator">步骤 0 / 6</span>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
        <div id="scene2-hint">拖动点 P 验证结论</div>
    </div>

    <script>
    (function() {
        // Scene 2 实现
        // 椭圆参数
        var OX = 350, OY = 250;
        var a = 200, b = 100;
        var c = Math.sqrt(a*a - b*b); // ≈173.205
        var e = c / a; // ≈0.866

        // 当前状态
        var currentStep = 0;
        var theta = 2 * Math.PI / 3; // 120°
        var minTheta = Math.PI / 3;  // 60°
        var maxTheta = 2 * Math.PI / 3; // 120°
        var isDragging = false;

        // DOM 元素缓存
        var svg = document.getElementById('scene2-svg');
        var panel = document.getElementById('scene2-panel-content');
        var btnPrev = document.getElementById('scene2-btn-prev');
        var btnNext = document.getElementById('scene2-btn-next');
        var stepIndicator = document.getElementById('scene2-step-indicator');

        // 动态元素
        var elLineOP = document.getElementById('scene2-line-op');
        var elArcTheta = document.getElementById('scene2-arc-theta');
        var elLinePC = document.getElementById('scene2-line-pc');
        var elLinePD = document.getElementById('scene2-line-pd');
        var elLinePF1 = document.getElementById('scene2-line-pf1');
        var elLinePF2 = document.getElementById('scene2-line-pf2');
        var elPointP = document.getElementById('scene2-point-p');
        var elPointC = document.getElementById('scene2-point-c');
        var elPointD = document.getElementById('scene2-point-d');
        var elLineAC = document.getElementById('scene2-line-ac');
        var elLineBD = document.getElementById('scene2-line-bd');
        var elLineCD = document.getElementById('scene2-line-cd');
        var elLabelP = document.getElementById('scene2-label-p');
        var elLabelC = document.getElementById('scene2-label-c');
        var elLabelD = document.getElementById('scene2-label-d');
        var elCoordNA = document.getElementById('scene2-coord-na');
        var elCoordA = document.getElementById('scene2-coord-a');
        var elCoordNC = document.getElementById('scene2-coord-nc');
        var elCoordC = document.getElementById('scene2-coord-c');

        // 辅助函数
        function show(el) { if(el) { el.classList.remove('scene2-hidden'); el.style.display = ''; el.style.opacity = '1'; } }
        function hide(el) { if(el) { el.classList.add('scene2-hidden'); el.style.display = 'none'; el.style.opacity = '0'; } }
        function setLine(el, x1, y1, x2, y2) { if(el) { el.setAttribute('x1', x1); el.setAttribute('y1', y1); el.setAttribute('x2', x2); el.setAttribute('y2', y2); } }
        function setCircle(el, cx, cy) { if(el) { el.setAttribute('cx', cx); el.setAttribute('cy', cy); } }
        function setText(el, x, y) { if(el) { el.setAttribute('x', x); el.setAttribute('y', y); } }

        // 根据 theta 计算所有动态几何
        function updateGeometry() {
            var cosT = Math.cos(theta);
            var sinT = Math.sin(theta);
            var px = OX + a * cosT;
            var py = OY - b * sinT;
            var halfTan = Math.tan(theta / 2);
            var halfCot = 1 / Math.tan(theta / 2);
            var cy = OY - b * halfCot;
            var dy = OY - b * halfTan;

            // 更新点位置
            setCircle(elPointP, px, py);
            setCircle(elPointC, OX - a, cy);
            setCircle(elPointD, OX + a, dy);

            // 更新切线
            setLine(elLineAC, OX - a, OY, OX - a, cy);
            setLine(elLineBD, OX + a, OY, OX + a, dy);
            setLine(elLineCD, OX - a, cy, OX + a, dy);

            // 更新线段
            setLine(elLineOP, OX, OY, px, py);
            setLine(elLinePC, px, py, OX - a, cy);
            setLine(elLinePD, px, py, OX + a, dy);
            setLine(elLinePF1, px, py, OX + c, OY);
            setLine(elLinePF2, px, py, OX - c, OY);

            // 更新标签位置（偏移确保不压线/图形）
            // P 标签大幅上移 (-20, -90)，避开 CD 线对角 bounding box [150,550]×[77,192]
            setText(elLabelP, px - 20, py - 90);
            setText(elLabelC, OX - a - 20, cy);
            setText(elLabelD, OX + a + 15, dy);

            // 更新θ弧线
            var arcR = 30;
            var sx = OX + arcR;
            var sy = OY;
            var ex = OX + arcR * cosT;
            var ey = OY - arcR * sinT;
            // 小弧，SVG 顺时针(sweep=1)对应数学上半平面
            var d = 'M ' + sx + ' ' + sy + ' A ' + arcR + ' ' + arcR + ' 0 0 1 ' + ex + ' ' + ey;
            elArcTheta.setAttribute('d', d);

            // 更新右侧面板
            updatePanel(cosT, sinT, px, py, cy, dy);
        }

        function updatePanel(cosT, sinT, px, py, cy, dy) {
            var deg = (theta * 180 / Math.PI).toFixed(1);
            var pc = Math.sqrt(Math.pow(px - (OX - a), 2) + Math.pow(py - cy, 2));
            var pd = Math.sqrt(Math.pow(px - (OX + a), 2) + Math.pow(py - dy, 2));
            var pc_pd = pc * pd;
            var pf1 = a * (1 - e * cosT);
            var pf2 = a * (1 + e * cosT);
            var pf1_pf2 = pf1 * pf2;

            var html = '';
            if (currentStep === 0) {
                html = '<div style="font-weight:bold;margin-bottom:8px;font-size:14px;">椭圆参数</div>' +
                       '<div>x²/a² + y²/b² = 1</div>' +
                       '<div style="margin-top:6px;">a = ' + a + '</div>' +
                       '<div>b = ' + b + '</div>' +
                       '<div>c ≈ ' + c.toFixed(1) + '</div>' +
                       '<div>e ≈ ' + e.toFixed(3) + '</div>';
            } else if (currentStep === 1) {
                html = '<div style="font-weight:bold;margin-bottom:8px;font-size:14px;">点 P 的参数</div>' +
                       '<div>P(a·cosθ, b·sinθ)</div>' +
                       '<div style="margin-top:6px;">θ = ' + deg + '°</div>' +
                       '<div>P ≈ (' + (a*cosT).toFixed(1) + ', ' + (b*sinT).toFixed(1) + ')</div>' +
                       '<div style="margin-top:6px;color:#1565c0;">OP 连线与 θ 角</div>';
            } else if (currentStep === 2) {
                html = '<div style="font-weight:bold;margin-bottom:8px;font-size:14px;">切线方程</div>' +
                       '<div>x·cosθ/a + y·sinθ/b = 1</div>' +
                       '<div style="margin-top:6px;">即：</div>' +
                       '<div>' + (cosT/a).toFixed(4) + 'x + ' + (sinT/b).toFixed(4) + 'y = 1</div>';
            } else if (currentStep === 3) {
                html = '<div style="font-weight:bold;margin-bottom:8px;font-size:14px;">交点坐标</div>' +
                       '<div>C(−a, b·cot(θ/2))</div>' +
                       '<div>C ≈ (−' + a + ', ' + (OY - cy).toFixed(1) + ')</div>' +
                       '<div style="margin-top:4px;">D(a, b·tan(θ/2))</div>' +
                       '<div>D ≈ (' + a + ', ' + (OY - dy).toFixed(1) + ')</div>' +
                       '<div style="margin-top:6px;color:#c62828;">|PC| ≈ ' + pc.toFixed(1) + '</div>' +
                       '<div style="color:#c62828;">|PD| ≈ ' + pd.toFixed(1) + '</div>';
            } else if (currentStep === 4) {
                html = '<div style="font-weight:bold;margin-bottom:8px;font-size:14px;">PC·PD 计算</div>' +
                       '<div>PC·PD = a²sin²θ + b²cos²θ</div>' +
                       '<div style="margin-top:6px;">= ' + (a*a*sinT*sinT).toFixed(0) + ' + ' + (b*b*cosT*cosT).toFixed(0) + '</div>' +
                       '<div style="margin-top:4px;color:#c62828;font-weight:bold;">≈ ' + pc_pd.toFixed(1) + '</div>';
            } else if (currentStep === 5) {
                html = '<div style="font-weight:bold;margin-bottom:8px;font-size:14px;">焦半径</div>' +
                       '<div>PF₁ = a − e·x = ' + pf1.toFixed(1) + '</div>' +
                       '<div>PF₂ = a + e·x = ' + pf2.toFixed(1) + '</div>' +
                       '<div style="margin-top:6px;">PF₁·PF₂ = a² − e²x²</div>' +
                       '<div style="margin-top:4px;color:#2e7d32;font-weight:bold;">≈ ' + pf1_pf2.toFixed(1) + '</div>';
            } else if (currentStep === 6) {
                html = '<div style="font-weight:bold;margin-bottom:8px;font-size:14px;color:#1565c0;">最终结论</div>' +
                       '<div style="font-size:15px;font-weight:bold;margin:8px 0;">PC·PD = PF₁·PF₂</div>' +
                       '<div style="color:#c62828;">PC·PD ≈ ' + pc_pd.toFixed(1) + '</div>' +
                       '<div style="color:#2e7d32;">PF₁·PF₂ ≈ ' + pf1_pf2.toFixed(1) + '</div>' +
                       '<div style="margin-top:6px;font-size:12px;color:#666;">拖动 P 点验证等式恒成立</div>';
            }
            panel.innerHTML = html;
        }

        function applyStep() {
            stepIndicator.textContent = '步骤 ' + currentStep + ' / 6';
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === 6;

            // 重置所有高亮
            elLineAC.setAttribute('stroke-width', '1.5');
            elLineBD.setAttribute('stroke-width', '1.5');
            elLineCD.setAttribute('stroke-width', '1.5');
            elPointP.setAttribute('stroke-width', '1.5');
            elPointC.setAttribute('stroke-width', '1.5');
            elPointD.setAttribute('stroke-width', '1.5');
            elPointP.setAttribute('stroke', '#ffffff');
            elPointC.setAttribute('stroke', '#ffffff');
            elPointD.setAttribute('stroke', '#ffffff');

            // 步骤显隐控制
            if (currentStep >= 1) {
                show(elLineOP); show(elArcTheta);
                show(elCoordNA); show(elCoordA); show(elCoordNC); show(elCoordC);
            } else {
                hide(elLineOP); hide(elArcTheta);
                hide(elCoordNA); hide(elCoordA); hide(elCoordNC); hide(elCoordC);
            }

            if (currentStep === 2) {
                elLineAC.setAttribute('stroke-width', '2');
                elLineBD.setAttribute('stroke-width', '2');
                elLineCD.setAttribute('stroke-width', '2.5');
            }

            if (currentStep >= 3) {
                show(elLinePC); show(elLinePD);
                elPointC.setAttribute('stroke', '#c62828');
                elPointD.setAttribute('stroke', '#c62828');
                elPointC.setAttribute('stroke-width', '2');
                elPointD.setAttribute('stroke-width', '2');
            } else {
                hide(elLinePC); hide(elLinePD);
            }

            if (currentStep >= 5) {
                show(elLinePF1); show(elLinePF2);
            } else {
                hide(elLinePF1); hide(elLinePF2);
            }

            if (currentStep === 1) {
                elPointP.setAttribute('stroke', '#1565c0');
                elPointP.setAttribute('stroke-width', '2.5');
            }

            updateGeometry();
        }

        // 拖拽逻辑
        elPointP.addEventListener('mousedown', function(e) {
            isDragging = true;
            e.preventDefault();
        });

        svg.addEventListener('mousemove', function(e) {
            if (!isDragging) return;
            var rect = svg.getBoundingClientRect();
            var mx = e.clientX - rect.left;
            var my = e.clientY - rect.top;
            var dx = mx - OX;
            var dy = OY - my; // 翻转y轴为数学坐标系
            var newTheta = Math.atan2(dy * a, dx * b); // 参数角
            if (newTheta < 0) newTheta += 2 * Math.PI;
            if (newTheta < minTheta) newTheta = minTheta;
            if (newTheta > maxTheta) newTheta = maxTheta;
            theta = newTheta;
            updateGeometry();
        });

        svg.addEventListener('mouseup', function() { isDragging = false; });
        svg.addEventListener('mouseleave', function() { isDragging = false; });

        // 触摸支持
        elPointP.addEventListener('touchstart', function(e) {
            isDragging = true;
            e.preventDefault();
        });
        svg.addEventListener('touchmove', function(e) {
            if (!isDragging) return;
            var touch = e.touches[0];
            var rect = svg.getBoundingClientRect();
            var mx = touch.clientX - rect.left;
            var my = touch.clientY - rect.top;
            var dx = mx - OX;
            var dy = OY - my;
            var newTheta = Math.atan2(dy * a, dx * b);
            if (newTheta < 0) newTheta += 2 * Math.PI;
            if (newTheta < minTheta) newTheta = minTheta;
            if (newTheta > maxTheta) newTheta = maxTheta;
            theta = newTheta;
            updateGeometry();
        });
        svg.addEventListener('touchend', function() { isDragging = false; });

        // 按钮事件
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) { currentStep--; applyStep(); }
        });
        btnNext.addEventListener('click', function() {
            if (currentStep < 6) { currentStep++; applyStep(); }
        });

        // 初始化
        applyStep();
    })();
    </script>
</body>
</html>
