<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四面体截面性质分析 - 场景1</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-step-text { position: absolute; bottom: 50px; left: 0; right: 0; text-align: center; font-size: 12px; color: #666666; pointer-events: none; }
        .scene1-btn {
            padding: 6px 16px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            background: #1565c0;
            color: #ffffff;
            cursor: pointer;
            font-family: inherit;
        }
        .scene1-btn:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }
        .scene1-btn:hover:not(:disabled) {
            background: #0d47a1;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- ===== 基础结构（步骤0始终显示） ===== -->
            <!-- 棱AC（虚线，被遮挡） -->
            <line id="scene1-edge-AC" x1="400" y1="70" x2="430" y2="400" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5"/>
            <!-- 棱AB -->
            <line id="scene1-edge-AB" x1="400" y1="70" x2="150" y2="330" stroke="#000000" stroke-width="2"/>
            <!-- 棱BC -->
            <line id="scene1-edge-BC" x1="150" y1="330" x2="430" y2="400" stroke="#000000" stroke-width="2"/>
            <!-- 棱CD -->
            <line id="scene1-edge-CD" x1="430" y1="400" x2="650" y2="250" stroke="#000000" stroke-width="2"/>
            <!-- 棱DA -->
            <line id="scene1-edge-DA" x1="650" y1="250" x2="400" y2="70" stroke="#000000" stroke-width="2"/>
            <!-- 棱BD -->
            <line id="scene1-edge-BD" x1="150" y1="330" x2="650" y2="250" stroke="#000000" stroke-width="2"/>

            <!-- 顶点 -->
            <circle id="scene1-vertex-A" cx="400" cy="70" r="3" fill="#000000"/>
            <circle id="scene1-vertex-B" cx="150" cy="330" r="3" fill="#000000"/>
            <circle id="scene1-vertex-C" cx="430" cy="400" r="3" fill="#000000"/>
            <circle id="scene1-vertex-D" cx="650" cy="250" r="3" fill="#000000"/>

            <!-- 中点 -->
            <circle id="scene1-midpoint-E" cx="275" cy="200" r="3" fill="#000000"/>
            <circle id="scene1-midpoint-F" cx="540" cy="325" r="3" fill="#000000"/>

            <!-- 顶点标签 —— 放在远离所有棱bounding box的安全区 -->
            <!-- A: 顶部安全区 y<70 -->
            <text id="scene1-label-A" x="385" y="55" font-size="14" fill="#000000" font-weight="bold">A</text>
            <!-- B: 左侧安全区 x<150 -->
            <text id="scene1-label-B" x="125" y="335" font-size="14" fill="#000000" font-weight="bold">B</text>
            <!-- C: 底部安全区 y>423 (步骤2多边形最大y) -->
            <text id="scene1-label-C" x="420" y="450" font-size="14" fill="#000000" font-weight="bold">C</text>
            <!-- D: 右侧安全区 x>733 (步骤2多边形最大x) -->
            <text id="scene1-label-D" x="750" y="240" font-size="14" fill="#000000" font-weight="bold">D</text>
            <!-- E: 左侧安全区 x<150 -->
            <text id="scene1-label-E" x="130" y="200" font-size="14" fill="#000000" font-weight="bold">E</text>
            <!-- F: 右侧安全区 x>733 -->
            <text id="scene1-label-F" x="750" y="360" font-size="14" fill="#000000" font-weight="bold">F</text>

            <!-- ===== 动态元素（步骤1+显示） ===== -->
            <!-- 平面α填充 -->
            <polygon id="scene1-fill-alpha" style="display:none" points="275,200 540,325 360,383 588,205" fill="#7b1fa2" fill-opacity="0.15" stroke="none"/>

            <!-- 截面边 -->
            <line id="scene1-section-EF" style="display:none" x1="275" y1="200" x2="540" y2="325" stroke="#7b1fa2" stroke-width="1.5" stroke-dasharray="5,5"/>
            <line id="scene1-section-FG" style="display:none" x1="540" y1="325" x2="360" y2="383" stroke="#7b1fa2" stroke-width="1.5"/>
            <line id="scene1-section-GH" style="display:none" x1="360" y1="383" x2="588" y2="205" stroke="#7b1fa2" stroke-width="1.5"/>
            <line id="scene1-section-HE" style="display:none" x1="588" y1="205" x2="275" y2="200" stroke="#7b1fa2" stroke-width="1.5"/>

            <!-- 动点G、H -->
            <circle id="scene1-point-G" style="display:none" cx="360" cy="383" r="3" fill="#000000"/>
            <circle id="scene1-point-H" style="display:none" cx="588" cy="205" r="3" fill="#000000"/>
            <!-- G标签: 底部安全区 y>423 -->
            <text id="scene1-label-G" style="display:none" x="340" y="440" font-size="14" fill="#000000" font-weight="bold">G</text>
            <!-- H标签: 右侧安全区 x>733 -->
            <text id="scene1-label-H" style="display:none" x="750" y="200" font-size="14" fill="#000000" font-weight="bold">H</text>

            <!-- α标记: 右下安全区 x>733, y>423 -->
            <text id="scene1-label-alpha" style="display:none" x="750" y="440" font-size="14" fill="#7b1fa2" font-weight="bold">α</text>

            <!-- ===== 步骤2元素 ===== -->
            <!-- 高亮线 GF、EH、BD -->
            <line id="scene1-highlight-GF" style="display:none" x1="360" y1="383" x2="540" y2="325" stroke="#c62828" stroke-width="2.5"/>
            <line id="scene1-highlight-EH" style="display:none" x1="275" y1="200" x2="588" y2="205" stroke="#1565c0" stroke-width="2.5"/>
            <line id="scene1-highlight-BD" style="display:none" x1="150" y1="330" x2="650" y2="250" stroke="#2e7d32" stroke-width="2.5"/>

            <!-- 共点P -->
            <circle id="scene1-point-P" style="display:none" cx="550" cy="266" r="4" fill="#2e7d32"/>
            <!-- P标签: 右侧安全区 x>733 -->
            <text id="scene1-label-P" style="display:none" x="750" y="260" font-size="14" fill="#2e7d32" font-weight="bold">P</text>

            <!-- 延长线 -->
            <line id="scene1-ext-CG" style="display:none" x1="430" y1="400" x2="523" y2="423" stroke="#c62828" stroke-width="1.5" stroke-dasharray="3,3"/>
            <line id="scene1-ext-DH" style="display:none" x1="650" y1="250" x2="733" y2="310" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="3,3"/>

            <!-- ===== 步骤3元素: 平行符号已移除 ===== -->
            <!-- 结论标记: 右上角安全区 -->
            <text id="scene1-conclusion-1" style="display:none" x="720" y="45" font-size="16" fill="#c62828" font-weight="bold">① ✗</text>
            <text id="scene1-conclusion-2" style="display:none" x="720" y="90" font-size="16" fill="#2e7d32" font-weight="bold">② ✓</text>
            <text id="scene1-conclusion-3" style="display:none" x="720" y="45" font-size="16" fill="#2e7d32" font-weight="bold">③ ✓</text>
            <text id="scene1-conclusion-4" style="display:none" x="720" y="45" font-size="16" fill="#2e7d32" font-weight="bold">④ ✓</text>

            <!-- ===== 步骤4元素 ===== -->
            <line id="scene1-ext-DH4" style="display:none" x1="650" y1="250" x2="720" y2="300" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="3,3"/>

            <!-- ===== 步骤5元素 ===== -->
            <!-- 三角形填充 -->
            <polygon id="scene1-fill-EFG" style="display:none" points="275,200 540,325 318,372" fill="#c62828" fill-opacity="0.2" stroke="none"/>
            <polygon id="scene1-fill-EFH" style="display:none" points="275,200 540,325 550,178" fill="#1565c0" fill-opacity="0.2" stroke="none"/>

            <!-- 垂线 -->
            <line id="scene1-perp-G" style="display:none" x1="318" y1="372" x2="376" y2="248" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="3,3"/>
            <line id="scene1-perp-H" style="display:none" x1="550" y1="178" x2="491" y2="302" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="3,3"/>

            <!-- 垂足 -->
            <circle id="scene1-foot-QG" style="display:none" cx="376" cy="248" r="2" fill="#2e7d32"/>
            <circle id="scene1-foot-QH" style="display:none" cx="491" cy="302" r="2" fill="#2e7d32"/>

            <!-- 直角符号 -->
            <path id="scene1-right-QG" style="display:none" d="M 376 256 L 384 256 L 384 248" stroke="#2e7d32" stroke-width="1.5" fill="none"/>
            <path id="scene1-right-QH" style="display:none" d="M 491 294 L 483 294 L 483 302" stroke="#2e7d32" stroke-width="1.5" fill="none"/>

            <!-- 面积等式: 右上安全区，确保不超出右边界 -->
            <text id="scene1-label-Seq" style="display:none" x="660" y="100" font-size="14" fill="#000000" font-weight="bold">S₁ = S₂</text>
        </svg>

        <div id="scene1-step-text">步骤0：四面体基础结构</div>
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn" disabled>◀ 上一步</button>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        var currentStep = 0;
        var totalSteps = 5;

        // 所有动态元素ID列表（用于批量隐藏）
        var dynamicIds = [
            "scene1-fill-alpha",
            "scene1-section-EF", "scene1-section-FG", "scene1-section-GH", "scene1-section-HE",
            "scene1-point-G", "scene1-point-H",
            "scene1-label-G", "scene1-label-H", "scene1-label-alpha",
            "scene1-highlight-GF", "scene1-highlight-EH", "scene1-highlight-BD",
            "scene1-point-P", "scene1-label-P",
            "scene1-ext-CG", "scene1-ext-DH", "scene1-ext-DH4",
            "scene1-conclusion-1", "scene1-conclusion-2", "scene1-conclusion-3", "scene1-conclusion-4",
            "scene1-fill-EFG", "scene1-fill-EFH",
            "scene1-perp-G", "scene1-perp-H",
            "scene1-foot-QG", "scene1-foot-QH",
            "scene1-right-QG", "scene1-right-QH",
            "scene1-label-Seq"
        ];

        // 步骤配置：每个步骤定义要显示的元素ID列表，以及各元素的坐标/属性更新
        var steps = [
            // 步骤0：基础结构
            {
                show: [],
                text: "步骤0：四面体基础结构",
                coords: {}
            },
            // 步骤1：截面四边形EFGH的形成
            {
                show: [
                    "scene1-fill-alpha",
                    "scene1-section-EF", "scene1-section-FG", "scene1-section-GH", "scene1-section-HE",
                    "scene1-point-G", "scene1-point-H",
                    "scene1-label-G", "scene1-label-H",
                    "scene1-label-alpha"
                ],
                text: "步骤1：截面四边形EFGH的形成",
                coords: {
                    "scene1-point-G": { cx: 360, cy: 383 },
                    "scene1-point-H": { cx: 588, cy: 205 },
                    "scene1-section-FG": { x1: 540, y1: 325, x2: 360, y2: 383 },
                    "scene1-section-GH": { x1: 360, y1: 383, x2: 588, y2: 205 },
                    "scene1-section-HE": { x1: 588, y1: 205, x2: 275, y2: 200 },
                    "scene1-fill-alpha": { points: "275,200 540,325 360,383 588,205" }
                }
            },
            // 步骤2：一般情形——GF、EH、BD三线共点
            {
                show: [
                    "scene1-fill-alpha",
                    "scene1-section-EF", "scene1-section-FG", "scene1-section-GH", "scene1-section-HE",
                    "scene1-point-G", "scene1-point-H",
                    "scene1-label-G", "scene1-label-H",
                    "scene1-label-alpha",
                    "scene1-highlight-GF", "scene1-highlight-EH", "scene1-highlight-BD",
                    "scene1-point-P", "scene1-label-P",
                    "scene1-ext-CG", "scene1-ext-DH"
                ],
                text: "步骤2：一般情形——GF、EH、BD三线共点",
                coords: {
                    "scene1-point-G": { cx: 523, cy: 423 },
                    "scene1-point-H": { cx: 733, cy: 310 },
                    "scene1-section-FG": { x1: 540, y1: 325, x2: 523, y2: 423 },
                    "scene1-section-GH": { x1: 523, y1: 423, x2: 733, y2: 310 },
                    "scene1-section-HE": { x1: 733, y1: 310, x2: 275, y2: 200 },
                    "scene1-fill-alpha": { points: "275,200 540,325 523,423 733,310" },
                    "scene1-highlight-GF": { x1: 523, y1: 423, x2: 540, y2: 325 },
                    "scene1-highlight-EH": { x1: 275, y1: 200, x2: 733, y2: 310 },
                    "scene1-label-G": { x: 540, y: 440 },
                    "scene1-label-H": { x: 750, y: 310 }
                }
            },
            // 步骤3：特殊情形——GF∥EH∥BD
            {
                show: [
                    "scene1-fill-alpha",
                    "scene1-section-EF", "scene1-section-FG", "scene1-section-GH", "scene1-section-HE",
                    "scene1-point-G", "scene1-point-H",
                    "scene1-label-G", "scene1-label-H",
                    "scene1-label-alpha",
                    "scene1-highlight-GF", "scene1-highlight-EH", "scene1-highlight-BD",
                    "scene1-conclusion-1", "scene1-conclusion-2"
                ],
                text: "步骤3：特殊情形——GF∥EH∥BD",
                coords: {
                    "scene1-point-G": { cx: 290, cy: 365 },
                    "scene1-point-H": { cx: 525, cy: 160 },
                    "scene1-section-FG": { x1: 540, y1: 325, x2: 290, y2: 365 },
                    "scene1-section-GH": { x1: 290, y1: 365, x2: 525, y2: 160 },
                    "scene1-section-HE": { x1: 525, y1: 160, x2: 275, y2: 200 },
                    "scene1-fill-alpha": { points: "275,200 540,325 290,365 525,160" },
                    "scene1-highlight-GF": { x1: 290, y1: 365, x2: 540, y2: 325 },
                    "scene1-highlight-EH": { x1: 275, y1: 200, x2: 525, y2: 160 },
                    "scene1-label-G": { x: 270, y: 440 },
                    "scene1-label-H": { x: 750, y: 145 }
                }
            },
            // 步骤4：存在性——G在线段BC上，H在AD延长线上
            {
                show: [
                    "scene1-fill-alpha",
                    "scene1-section-EF", "scene1-section-FG", "scene1-section-GH", "scene1-section-HE",
                    "scene1-point-G", "scene1-point-H",
                    "scene1-label-G", "scene1-label-H",
                    "scene1-label-alpha",
                    "scene1-ext-DH4",
                    "scene1-conclusion-3"
                ],
                text: "步骤4：存在性——G在线段BC上，H在AD延长线上",
                coords: {
                    "scene1-point-G": { cx: 360, cy: 383 },
                    "scene1-point-H": { cx: 720, cy: 300 },
                    "scene1-section-FG": { x1: 540, y1: 325, x2: 360, y2: 383 },
                    "scene1-section-GH": { x1: 360, y1: 383, x2: 720, y2: 300 },
                    "scene1-section-HE": { x1: 720, y1: 300, x2: 275, y2: 200 },
                    "scene1-fill-alpha": { points: "275,200 540,325 360,383 720,300" },
                    "scene1-label-G": { x: 320, y: 440 },
                    "scene1-label-H": { x: 740, y: 300 }
                }
            },
            // 步骤5：面积恒等——同底等高
            {
                show: [
                    "scene1-fill-alpha",
                    "scene1-section-EF", "scene1-section-FG", "scene1-section-GH", "scene1-section-HE",
                    "scene1-point-G", "scene1-point-H",
                    "scene1-label-G", "scene1-label-H",
                    "scene1-label-alpha",
                    "scene1-fill-EFG", "scene1-fill-EFH",
                    "scene1-perp-G", "scene1-perp-H",
                    "scene1-foot-QG", "scene1-foot-QH",
                    "scene1-right-QG", "scene1-right-QH",
                    "scene1-label-Seq",
                    "scene1-conclusion-4"
                ],
                text: "步骤5：面积恒等——同底等高",
                coords: {
                    "scene1-point-G": { cx: 318, cy: 372 },
                    "scene1-point-H": { cx: 550, cy: 178 },
                    "scene1-section-FG": { x1: 540, y1: 325, x2: 318, y2: 372 },
                    "scene1-section-GH": { x1: 318, y1: 372, x2: 550, y2: 178 },
                    "scene1-section-HE": { x1: 550, y1: 178, x2: 275, y2: 200 },
                    "scene1-fill-alpha": { points: "275,200 540,325 318,372 550,178" },
                    "scene1-fill-EFG": { points: "275,200 540,325 318,372" },
                    "scene1-fill-EFH": { points: "275,200 540,325 550,178" },
                    "scene1-label-G": { x: 300, y: 440 },
                    "scene1-label-H": { x: 750, y: 165 }
                }
            }
        ];

        function setAttr(el, attrs) {
            for (var key in attrs) {
                if (key === 'text') {
                    el.textContent = attrs[key];
                } else {
                    el.setAttribute(key, attrs[key]);
                }
            }
        }

        function showElement(id) {
            var el = document.getElementById(id);
            if (el) {
                el.style.display = '';
                el.style.opacity = '1';
            }
        }

        function hideElement(id) {
            var el = document.getElementById(id);
            if (el) {
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }

        function updateScene(step) {
            currentStep = step;
            var config = steps[step];

            // 隐藏所有动态元素
            for (var i = 0; i < dynamicIds.length; i++) {
                hideElement(dynamicIds[i]);
            }

            // 显示当前步骤需要的元素
            for (var j = 0; j < config.show.length; j++) {
                showElement(config.show[j]);
            }

            // 更新坐标/属性
            for (var id in config.coords) {
                var el = document.getElementById(id);
                if (el) {
                    setAttr(el, config.coords[id]);
                }
            }

            // 更新步骤提示文字
            document.getElementById('scene1-step-text').textContent = config.text;

            // 更新按钮状态
            document.getElementById('scene1-btn-prev').disabled = (step === 0);
            document.getElementById('scene1-btn-next').disabled = (step === totalSteps);
        }

        document.getElementById('scene1-btn-prev').addEventListener('click', function() {
            if (currentStep > 0) {
                updateScene(currentStep - 1);
            }
        });

        document.getElementById('scene1-btn-next').addEventListener('click', function() {
            if (currentStep < totalSteps) {
                updateScene(currentStep + 1);
            }
        });

        // 初始化
        updateScene(0);
    })();
    </script>
</body>
</html>
