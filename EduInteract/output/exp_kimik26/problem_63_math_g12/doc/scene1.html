<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双曲线焦点切线中点问题 - 场景1</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 16px; z-index: 10; }
        #scene1-controls button {
            padding: 6px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc;
            border-radius: 4px; background: #f5f5f5; color: #333; transition: background 0.2s;
        }
        #scene1-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene1-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 14px; color: #666; min-width: 70px; text-align: center; }

        /* 步骤组的过渡动画 */
        .scene1-step-group { transition: opacity 0.3s ease; }
        .scene1-hidden { opacity: 0; pointer-events: none; }
        .scene1-visible { opacity: 1; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" viewBox="0 0 800 500" style="display:block;">
            <!-- 定义箭头 -->
            <defs>
                <marker id="scene1-arrow-x" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#000"/>
                </marker>
                <marker id="scene1-arrow-y" markerWidth="10" markerHeight="10" refX="3" refY="1" orient="auto">
                    <path d="M0,6 L6,6 L3,0 z" fill="#000"/>
                </marker>
            </defs>

            <!-- ========== 步骤0：基本图形 ========== -->
            <g id="scene1-step0-group" class="scene1-step-group scene1-visible">
                <!-- 坐标轴 -->
                <line x1="80" y1="280" x2="720" y2="280" stroke="#000" stroke-width="1" marker-end="url(#scene1-arrow-x)"/>
                <line x1="300" y1="400" x2="300" y2="100" stroke="#000" stroke-width="1" marker-end="url(#scene1-arrow-y)"/>
                <!-- 原点标记 -->
                <path d="M297,280 L303,280 M300,277 L300,283" stroke="#000" stroke-width="1.5"/>
                <!-- 双曲线右支 (a=35, b=70)，缩小纵向范围 -->
                <path id="scene1-hyperbola-right" d="M335,280 C354,210 382,165 400,150 C418,165 446,210 465,280 C446,350 418,395 400,410 C382,395 354,350 335,280" fill="none" stroke="#000" stroke-width="1.5"/>
                <!-- 双曲线左支 -->
                <path id="scene1-hyperbola-left" d="M265,280 C246,210 218,165 200,150 C182,165 154,210 135,280 C154,350 182,395 200,410 C218,395 246,350 265,280" fill="none" stroke="#000" stroke-width="1.5"/>
                <!-- 圆 x²+y²=b²，半径70 -->
                <circle cx="300" cy="280" r="70" fill="none" stroke="#000" stroke-width="1.5"/>
                <!-- 右焦点 F (c≈78.26) -->
                <circle cx="378" cy="280" r="3" fill="#000"/>
                <!-- 渐近线 y=±2x（像素斜率∓2） -->
                <line id="scene1-asymptote-up" x1="230" y1="420" x2="390" y2="100" stroke="#888" stroke-width="1" stroke-dasharray="5,5"/>
                <line id="scene1-asymptote-down" x1="230" y1="140" x2="370" y2="420" stroke="#888" stroke-width="1" stroke-dasharray="5,5"/>
                <!-- 标签：放在空白处避免与图形重叠 -->
                <text x="330" y="390" font-size="16" fill="#000" font-family="sans-serif">O</text>
                <text x="730" y="290" font-size="16" fill="#000" font-family="sans-serif">x</text>
                <text x="290" y="95" font-size="16" fill="#000" font-family="sans-serif">y</text>
                <text x="480" y="275" font-size="16" fill="#000" font-family="sans-serif">F</text>
            </g>

            <!-- ========== 步骤1：题意展示 ========== -->
            <g id="scene1-step1-group" class="scene1-step-group scene1-hidden">
                <!-- 直线 l 过F(378,280)与P(347,217) -->
                <line x1="320" y1="163" x2="400" y2="323" stroke="#000" stroke-width="1.5"/>
                <!-- 点 M (中点) -->
                <circle cx="363" cy="249" r="3" fill="#000"/>
                <!-- 点 P -->
                <circle cx="347" cy="217" r="3" fill="#000"/>
                <!-- 线段 MF -->
                <line x1="363" y1="249" x2="378" y2="280" stroke="#000" stroke-width="1.5"/>
                <!-- 中点标记（垂直于PF过M的短线） -->
                <line x1="357.6" y1="251.7" x2="368.4" y2="246.3" stroke="#000" stroke-width="1"/>
                <!-- 标签：放在空白处 -->
                <text x="500" y="240" font-size="14" fill="#000" font-family="sans-serif">M</text>
                <text x="250" y="200" font-size="14" fill="#000" font-family="sans-serif">P</text>
                <text x="480" y="185" font-size="14" fill="#000" font-family="sans-serif">l</text>
            </g>

            <!-- ========== 步骤2：切线性质 ========== -->
            <g id="scene1-step2-group" class="scene1-step-group scene1-hidden">
                <!-- 线段 OM（蓝色） -->
                <line x1="300" y1="280" x2="363" y2="249" stroke="#1565c0" stroke-width="2"/>
                <!-- M处直角标记 OM⊥l -->
                <polyline points="354.8,253.3 363,249 367.4,258.2" fill="none" stroke="#1565c0" stroke-width="1.5"/>
                <!-- Rt△OMF 蓝色填充 -->
                <path d="M300,280 L363,249 L378,280 Z" fill="#1565c0" fill-opacity="0.15" stroke="none"/>
                <!-- 推导文字与长度标注：放在右侧空白区，间距充足 -->
                <text x="560" y="125" font-size="16" fill="#000" font-family="sans-serif" font-weight="bold">c²-b²=a²</text>
                <text x="560" y="355" font-size="14" fill="#1565c0" font-family="sans-serif">|OM|=b</text>
                <text x="560" y="385" font-size="14" fill="#000" font-family="sans-serif">|OF|=c</text>
                <text x="560" y="415" font-size="14" fill="#000" font-family="sans-serif">|MF|=a</text>
            </g>

            <!-- ========== 步骤3：中位线构造 ========== -->
            <g id="scene1-step3-group" class="scene1-step-group scene1-hidden">
                <!-- 左焦点 F'（绿色） -->
                <circle cx="222" cy="280" r="3" fill="#2e7d32"/>
                <!-- 线段 PF'（绿色） -->
                <line x1="347" y1="217" x2="222" y2="280" stroke="#2e7d32" stroke-width="2"/>
                <!-- 线段 FF'（黑色） -->
                <line x1="222" y1="280" x2="378" y2="280" stroke="#000" stroke-width="1.5"/>
                <!-- 标签 -->
                <text x="105" y="270" font-size="16" fill="#2e7d32" font-family="sans-serif">F'</text>
                <text x="580" y="445" font-size="14" fill="#2e7d32" font-family="sans-serif">|PF'|=2b</text>
                <text x="560" y="160" font-size="12" fill="#000" font-family="sans-serif">|PF'|=2b，PF'∥OM</text>
                <text x="560" y="190" font-size="12" fill="#000" font-family="sans-serif">PF'⊥PF</text>
            </g>

            <!-- ========== 步骤4：双曲线定义 ========== -->
            <g id="scene1-step4-group" class="scene1-step-group scene1-hidden">
                <!-- 线段 PF（红色高亮） -->
                <line x1="347" y1="217" x2="378" y2="280" stroke="#c62828" stroke-width="2.5"/>
                <!-- Rt△PFF' 绿色填充 -->
                <path d="M347,217 L378,280 L222,280 Z" fill="#2e7d32" fill-opacity="0.15" stroke="none"/>
                <!-- P处直角标记 -->
                <polyline points="351.5,225.9 347,217 338.1,221.5" fill="none" stroke="#c62828" stroke-width="1.5"/>
                <!-- 标签：分散排列避免重叠 -->
                <text x="560" y="220" font-size="12" fill="#000" font-family="sans-serif">|PF'|-|PF|=2a</text>
                <text x="560" y="250" font-size="12" fill="#000" font-family="sans-serif">→ 2b-2a=2a</text>
                <text x="560" y="280" font-size="12" fill="#000" font-family="sans-serif">→ b=2a</text>
                <text x="560" y="320" font-size="14" fill="#c62828" font-family="sans-serif">|PF|=2a</text>
                <text x="560" y="350" font-size="14" fill="#c62828" font-family="sans-serif">∠FPF'=90°</text>
            </g>

            <!-- ========== 步骤5：结论 ========== -->
            <g id="scene1-step5-group" class="scene1-step-group scene1-hidden">
                <!-- 渐近线高亮（绿色实线） -->
                <line x1="230" y1="420" x2="390" y2="100" stroke="#2e7d32" stroke-width="2"/>
                <line x1="230" y1="140" x2="370" y2="420" stroke="#2e7d32" stroke-width="2"/>
                <!-- 标签 -->
                <text x="480" y="115" font-size="14" fill="#2e7d32" font-family="sans-serif">k=2</text>
                <text x="470" y="445" font-size="14" fill="#2e7d32" font-family="sans-serif">k=-2</text>
                <text x="560" y="315" font-size="18" fill="#2e7d32" font-family="sans-serif" font-weight="bold">y=±2x</text>
            </g>
        </svg>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" onclick="scene1PrevStep()">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 0/5</span>
            <button id="scene1-btn-next" onclick="scene1NextStep()">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        var currentStep = 0;
        var totalSteps = 5;

        var btnPrev = document.getElementById('scene1-btn-prev');
        var btnNext = document.getElementById('scene1-btn-next');
        var indicator = document.getElementById('scene1-step-indicator');

        function updateScene(step) {
            currentStep = step;
            indicator.textContent = '步骤 ' + currentStep + '/' + totalSteps;
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps);

            // 控制各步骤组的显示/隐藏
            for (var i = 0; i <= totalSteps; i++) {
                var group = document.getElementById('scene1-step' + i + '-group');
                if (!group) continue;
                if (i <= currentStep) {
                    group.classList.remove('scene1-hidden');
                    group.classList.add('scene1-visible');
                    group.style.display = 'block';
                } else {
                    group.classList.remove('scene1-visible');
                    group.classList.add('scene1-hidden');
                    setTimeout((function(g) {
                        return function() {
                            if (g.classList.contains('scene1-hidden')) {
                                g.style.display = 'none';
                            }
                        };
                    })(group), 300);
                }
            }

            // 步骤5时，隐藏原来的虚线渐近线，避免重叠
            var asymUp = document.getElementById('scene1-asymptote-up');
            var asymDown = document.getElementById('scene1-asymptote-down');
            if (asymUp && asymDown) {
                if (currentStep === 5) {
                    asymUp.style.opacity = '0';
                    asymDown.style.opacity = '0';
                } else {
                    asymUp.style.opacity = '1';
                    asymDown.style.opacity = '1';
                }
            }
        }

        window.scene1PrevStep = function() {
            if (currentStep > 0) {
                updateScene(currentStep - 1);
            }
        };

        window.scene1NextStep = function() {
            if (currentStep < totalSteps) {
                updateScene(currentStep + 1);
            }
        };

        // 初始化
        updateScene(0);
    })();
    </script>
</body>
</html>
