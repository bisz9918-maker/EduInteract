<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>直四棱柱中的线线垂直</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Times New Roman", serif, sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            background: #f5f5f5;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            padding: 6px 16px;
            cursor: pointer;
            min-width: 80px;
        }
        #scene1-controls button:disabled {
            background: #e0e0e0;
            color: #999;
            cursor: not-allowed;
        }
        #scene1-controls button:hover:not(:disabled) {
            background: #e8e8e8;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <!-- 底面 ABCD 填充 -->
            <polygon id="scene1-base-fill" points="300,260 240,360 520,400 580,300" fill="#1565c0" opacity="0.15" />

            <!-- 上底面 A₁B₁C₁D₁ (无填充，仅轮廓) -->
            <polygon id="scene1-top-face" points="300,100 240,200 520,240 580,140" fill="none" stroke="#000000" stroke-width="1.5" />

            <!-- 基础棱线：被遮挡的用虚线 -->
            <!-- AA₁ 虚线 -->
            <line id="scene1-edge-AA1" x1="300" y1="260" x2="300" y2="100" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" />
            <!-- AB 虚线 -->
            <line id="scene1-edge-AB" x1="300" y1="260" x2="240" y2="360" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" />
            <!-- AD 虚线 -->
            <line id="scene1-edge-AD" x1="300" y1="260" x2="580" y2="300" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" />

            <!-- 基础棱线：可见的用实线 -->
            <!-- BB₁ -->
            <line id="scene1-edge-BB1" x1="240" y1="360" x2="240" y2="200" stroke="#000000" stroke-width="1.5" />
            <!-- CC₁ -->
            <line id="scene1-edge-CC1" x1="520" y1="400" x2="520" y2="240" stroke="#000000" stroke-width="1.5" />
            <!-- DD₁ -->
            <line id="scene1-edge-DD1" x1="580" y1="300" x2="580" y2="140" stroke="#000000" stroke-width="1.5" />
            <!-- BC -->
            <line id="scene1-edge-BC" x1="240" y1="360" x2="520" y2="400" stroke="#000000" stroke-width="1.5" />
            <!-- CD -->
            <line id="scene1-edge-CD" x1="520" y1="400" x2="580" y2="300" stroke="#000000" stroke-width="1.5" />
            <!-- A₁B₁ -->
            <line id="scene1-edge-A1B1" x1="300" y1="100" x2="240" y2="200" stroke="#000000" stroke-width="1.5" />
            <!-- B₁C₁ -->
            <line id="scene1-edge-B1C1" x1="240" y1="200" x2="520" y2="240" stroke="#000000" stroke-width="1.5" />
            <!-- C₁D₁ -->
            <line id="scene1-edge-C1D1" x1="520" y1="240" x2="580" y2="140" stroke="#000000" stroke-width="1.5" />
            <!-- D₁A₁ -->
            <line id="scene1-edge-D1A1" x1="580" y1="140" x2="300" y2="100" stroke="#000000" stroke-width="1.5" />

            <!-- 顶点标签 -->
            <text id="scene1-label-A" x="285" y="255" font-size="16" font-family="Times New Roman, serif" fill="#000000" text-anchor="end">A</text>
            <text id="scene1-label-B" x="225" y="370" font-size="16" font-family="Times New Roman, serif" fill="#000000" text-anchor="end">B</text>
            <!-- C 标签右下移，远离棱线 -->
            <text id="scene1-label-C" x="545" y="415" font-size="16" font-family="Times New Roman, serif" fill="#000000" text-anchor="start">C</text>
            <text id="scene1-label-D" x="590" y="295" font-size="16" font-family="Times New Roman, serif" fill="#000000" text-anchor="start">D</text>
            <text id="scene1-label-A1" x="285" y="90" font-size="16" font-family="Times New Roman, serif" fill="#000000" text-anchor="end">A₁</text>
            <text id="scene1-label-B1" x="225" y="195" font-size="16" font-family="Times New Roman, serif" fill="#000000" text-anchor="end">B₁</text>
            <!-- C₁ 标签移到 polygon 右侧空白处，彻底避免重叠 -->
            <text id="scene1-label-C1" x="590" y="250" font-size="16" font-family="Times New Roman, serif" fill="#000000" text-anchor="start">C₁</text>
            <text id="scene1-label-D1" x="590" y="135" font-size="16" font-family="Times New Roman, serif" fill="#000000" text-anchor="start">D₁</text>

            <!-- 步骤1：侧棱高亮层（绿色，覆盖在基础棱线上方） -->
            <line id="scene1-hl-lateral-AA1" x1="300" y1="260" x2="300" y2="100" stroke="#2e7d32" stroke-width="2.5" stroke-dasharray="5,5" display="none" />
            <line id="scene1-hl-lateral-BB1" x1="240" y1="360" x2="240" y2="200" stroke="#2e7d32" stroke-width="2.5" display="none" />
            <line id="scene1-hl-lateral-CC1" x1="520" y1="400" x2="520" y2="240" stroke="#2e7d32" stroke-width="2.5" display="none" />
            <line id="scene1-hl-lateral-DD1" x1="580" y1="300" x2="580" y2="140" stroke="#2e7d32" stroke-width="2.5" display="none" />

            <!-- 步骤1：侧棱垂直标注 -->
            <text id="scene1-anno-lateral" x="130" y="160" font-size="15" font-family="sans-serif" fill="#2e7d32" text-anchor="middle" display="none">侧棱⊥底面</text>

            <!-- 步骤2：辅助线 BD（灰色虚线） -->
            <line id="scene1-aux-BD" x1="240" y1="360" x2="580" y2="300" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" display="none" />

            <!-- 步骤2：B₁D₁ 和 BD 蓝色高亮 -->
            <line id="scene1-hl-blue-B1D1" x1="240" y1="200" x2="580" y2="140" stroke="#1565c0" stroke-width="2.5" display="none" />
            <line id="scene1-hl-blue-BD" x1="240" y1="360" x2="580" y2="300" stroke="#1565c0" stroke-width="2.5" display="none" />

            <!-- 步骤2：平行标注（右移避免与 D₁ 拥挤） -->
            <text id="scene1-anno-parallel" x="670" y="165" font-size="15" font-family="sans-serif" fill="#2e7d32" text-anchor="middle" display="none">B₁D₁∥BD</text>

            <!-- 步骤3：AC 蓝色高亮 -->
            <line id="scene1-hl-blue-AC" x1="300" y1="260" x2="520" y2="400" stroke="#1565c0" stroke-width="2.5" display="none" />

            <!-- 步骤3：直角标记（AC与BD交点右上方） -->
            <line id="scene1-right-angle-h" x1="410" y1="325" x2="425" y2="325" stroke="#c62828" stroke-width="2.5" display="none" />
            <line id="scene1-right-angle-v" x1="425" y1="325" x2="425" y2="310" stroke="#c62828" stroke-width="2.5" display="none" />

            <!-- 步骤3：垂直标注（放在右侧空白处，避免压线） -->
            <text id="scene1-anno-perp" x="620" y="380" font-size="15" font-family="sans-serif" fill="#c62828" text-anchor="start" display="none">AC⊥BD</text>

            <!-- 步骤3：推导文字（放在左下角空白处，避免与底面重叠） -->
            <text id="scene1-anno-deduce" x="60" y="425" font-size="15" font-family="sans-serif" fill="#c62828" text-anchor="start" display="none">AC⊥BD 且 B₁D₁∥BD ⇒ AC⊥B₁D₁</text>

            <!-- 步骤4：结论文字（与推导文字同位置） -->
            <text id="scene1-anno-answer" x="60" y="425" font-size="16" font-family="sans-serif" fill="#c62828" text-anchor="start" font-weight="bold" display="none">答案：AC⊥BD（或菱形、正方形等）</text>

            <!-- 步骤指示器（右上角，下移避免顶部裁切） -->
            <text id="scene1-step-indicator" x="720" y="38" font-size="14" font-family="sans-serif" fill="#666666" text-anchor="end">初始状态</text>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        let currentStep = 0;
        const totalSteps = 4;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');

        // 步骤1元素
        const hlLateralAA1 = document.getElementById('scene1-hl-lateral-AA1');
        const hlLateralBB1 = document.getElementById('scene1-hl-lateral-BB1');
        const hlLateralCC1 = document.getElementById('scene1-hl-lateral-CC1');
        const hlLateralDD1 = document.getElementById('scene1-hl-lateral-DD1');
        const annoLateral = document.getElementById('scene1-anno-lateral');

        // 步骤2元素
        const auxBD = document.getElementById('scene1-aux-BD');
        const hlBlueB1D1 = document.getElementById('scene1-hl-blue-B1D1');
        const hlBlueBD = document.getElementById('scene1-hl-blue-BD');
        const annoParallel = document.getElementById('scene1-anno-parallel');

        // 步骤3元素
        const hlBlueAC = document.getElementById('scene1-hl-blue-AC');
        const rightAngleH = document.getElementById('scene1-right-angle-h');
        const rightAngleV = document.getElementById('scene1-right-angle-v');
        const annoPerp = document.getElementById('scene1-anno-perp');
        const annoDeduce = document.getElementById('scene1-anno-deduce');

        // 步骤4元素
        const annoAnswer = document.getElementById('scene1-anno-answer');

        function setDisplay(el, show) {
            if (!el) return;
            el.style.display = show ? 'block' : 'none';
        }

        function updateScene() {
            // 更新按钮状态
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps;

            // 更新步骤指示器
            if (currentStep === 0) {
                stepIndicator.textContent = '初始状态';
            } else if (currentStep === totalSteps) {
                stepIndicator.textContent = '步骤 ' + currentStep + '/' + totalSteps + '（结论）';
            } else {
                stepIndicator.textContent = '步骤 ' + currentStep + '/' + totalSteps;
            }

            // 步骤0：仅显示基础框架
            if (currentStep === 0) {
                setDisplay(hlLateralAA1, false);
                setDisplay(hlLateralBB1, false);
                setDisplay(hlLateralCC1, false);
                setDisplay(hlLateralDD1, false);
                setDisplay(annoLateral, false);
                setDisplay(auxBD, false);
                setDisplay(hlBlueB1D1, false);
                setDisplay(hlBlueBD, false);
                setDisplay(annoParallel, false);
                setDisplay(hlBlueAC, false);
                setDisplay(rightAngleH, false);
                setDisplay(rightAngleV, false);
                setDisplay(annoPerp, false);
                setDisplay(annoDeduce, false);
                setDisplay(annoAnswer, false);
            }
            // 步骤1：侧棱高亮
            else if (currentStep === 1) {
                setDisplay(hlLateralAA1, true);
                setDisplay(hlLateralBB1, true);
                setDisplay(hlLateralCC1, true);
                setDisplay(hlLateralDD1, true);
                setDisplay(annoLateral, true);
                setDisplay(auxBD, false);
                setDisplay(hlBlueB1D1, false);
                setDisplay(hlBlueBD, false);
                setDisplay(annoParallel, false);
                setDisplay(hlBlueAC, false);
                setDisplay(rightAngleH, false);
                setDisplay(rightAngleV, false);
                setDisplay(annoPerp, false);
                setDisplay(annoDeduce, false);
                setDisplay(annoAnswer, false);
            }
            // 步骤2：平行关系
            else if (currentStep === 2) {
                setDisplay(hlLateralAA1, false);
                setDisplay(hlLateralBB1, false);
                setDisplay(hlLateralCC1, false);
                setDisplay(hlLateralDD1, false);
                setDisplay(annoLateral, false);
                setDisplay(auxBD, true);
                setDisplay(hlBlueB1D1, true);
                setDisplay(hlBlueBD, true);
                setDisplay(annoParallel, true);
                setDisplay(hlBlueAC, false);
                setDisplay(rightAngleH, false);
                setDisplay(rightAngleV, false);
                setDisplay(annoPerp, false);
                setDisplay(annoDeduce, false);
                setDisplay(annoAnswer, false);
            }
            // 步骤3：垂直转化
            else if (currentStep === 3) {
                setDisplay(hlLateralAA1, false);
                setDisplay(hlLateralBB1, false);
                setDisplay(hlLateralCC1, false);
                setDisplay(hlLateralDD1, false);
                setDisplay(annoLateral, false);
                setDisplay(auxBD, true);
                setDisplay(hlBlueB1D1, true);
                setDisplay(hlBlueBD, true);
                setDisplay(annoParallel, true);
                setDisplay(hlBlueAC, true);
                setDisplay(rightAngleH, true);
                setDisplay(rightAngleV, true);
                setDisplay(annoPerp, true);
                setDisplay(annoDeduce, true);
                setDisplay(annoAnswer, false);
            }
            // 步骤4：结论
            else if (currentStep === 4) {
                setDisplay(hlLateralAA1, false);
                setDisplay(hlLateralBB1, false);
                setDisplay(hlLateralCC1, false);
                setDisplay(hlLateralDD1, false);
                setDisplay(annoLateral, false);
                setDisplay(auxBD, true);
                setDisplay(hlBlueB1D1, true);
                setDisplay(hlBlueBD, true);
                setDisplay(annoParallel, true);
                setDisplay(hlBlueAC, true);
                setDisplay(rightAngleH, true);
                setDisplay(rightAngleV, true);
                setDisplay(annoPerp, true);
                setDisplay(annoDeduce, false);
                setDisplay(annoAnswer, true);
            }
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateScene();
            }
        });

        // 初始化
        updateScene();
    })();
    </script>
</body>
</html>
