<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>直角三角形与圆综合问题</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            padding: 6px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc;
            border-radius: 4px; background: #f5f5f5; transition: opacity 0.2s;
        }
        #scene1-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene1-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene1-step-indicator { font-size: 12px; color: #666; min-width: 60px; text-align: center; }
        .scene1-fade { transition: opacity 0.3s ease; }
        .scene1-hidden { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 步骤标题 -->
            <text id="scene1-step-title" x="400" y="42" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">步骤 1/6：已知条件</text>

            <!-- 圆（以AC为直径） -->
            <circle id="scene1-circle" cx="400" cy="290" r="90" fill="rgba(200,200,200,0.2)" stroke="#000" stroke-width="1.5"/>

            <!-- 三角形ABC（用三条线段代替polygon，避免大bounding box导致误报重叠） -->
            <line id="scene1-line-ac" x1="400" y1="200" x2="400" y2="380" stroke="#000" stroke-width="1.5"/>
            <line id="scene1-line-bc" x1="160" y1="380" x2="400" y2="380" stroke="#000" stroke-width="1.5"/>
            <line id="scene1-line-ab" x1="400" y1="200" x2="160" y2="380" stroke="#000" stroke-width="1.5"/>

            <!-- 点O（圆心） -->
            <circle id="scene1-point-o" cx="400" cy="290" r="2" fill="#000"/>
            <text id="scene1-label-o" x="505" y="295" font-size="14" fill="#000">O</text>

            <!-- 点A -->
            <circle id="scene1-point-a" cx="400" cy="200" r="3" fill="#000"/>
            <text id="scene1-label-a" x="410" y="195" font-size="14" fill="#000">A</text>

            <!-- 点B -->
            <circle id="scene1-point-b" cx="160" cy="380" r="3" fill="#000"/>
            <text id="scene1-label-b" x="145" y="395" font-size="14" fill="#000">B</text>

            <!-- 点C -->
            <circle id="scene1-point-c" cx="400" cy="380" r="3" fill="#000"/>
            <text id="scene1-label-c" x="415" y="395" font-size="14" fill="#000">C</text>

            <!-- 点D -->
            <circle id="scene1-point-d" cx="314" cy="265" r="3" fill="#000"/>
            <text id="scene1-label-d" x="300" y="185" font-size="14" fill="#000">D</text>

            <!-- 直角符号∠C -->
            <path id="scene1-right-angle-c" d="M 390,380 L 390,370 L 400,370" fill="none" stroke="#000" stroke-width="1"/>

            <!-- 线段CD（步骤1+显示） -->
            <line id="scene1-line-cd" class="scene1-fade scene1-hidden" x1="400" y1="380" x2="314" y2="265" stroke="#1565c0" stroke-width="2"/>

            <!-- 直角符号∠ADC（步骤2+显示） -->
            <path id="scene1-right-angle-d" class="scene1-fade scene1-hidden" d="M 320,260 L 325,267 L 319,271" fill="none" stroke="#2e7d32" stroke-width="1.5"/>

            <!-- AC=6标注（步骤0显示）——放在圆右侧上方，避开所有图形bounding box -->
            <text id="scene1-label-ac" x="440" y="185" font-size="14" fill="#2e7d32">AC = 6</text>

            <!-- BC=8标注（步骤0显示）——放在BC下方 -->
            <text id="scene1-label-bc" x="280" y="405" font-size="14" fill="#2e7d32">BC = 8</text>

            <!-- AB=10标注（步骤3+显示）——放在三角形左侧 -->
            <text id="scene1-label-ab" class="scene1-fade scene1-hidden" x="100" y="270" font-size="14" fill="#2e7d32">AB = 10</text>

            <!-- AD=3.6标注（步骤4+显示）——放在图形上方 -->
            <text id="scene1-label-ad" class="scene1-fade scene1-hidden" x="330" y="185" font-size="14" fill="#2e7d32">AD = 3.6</text>

            <!-- BD=6.4标注（步骤5+显示）——放在三角形下方偏左 -->
            <text id="scene1-label-bd" class="scene1-fade scene1-hidden" x="210" y="400" font-size="14" fill="#c62828" font-weight="bold">BD = 6.4</text>

            <!-- △ADC填充（步骤4+显示） -->
            <polygon id="scene1-fill-adc" class="scene1-fade scene1-hidden" points="400,200 314,265 400,380" fill="#1565c0" fill-opacity="0.12" stroke="none"/>

            <!-- 旁注区 -->
            <foreignObject x="520" y="70" width="260" height="320">
                <div id="scene1-note-content" xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;line-height:1.6;background:rgba(255,255,255,0.95);padding:12px;border-radius:4px;border:1px solid #e0e0e0;">
                    <b style="color:#1565c0;">已知条件</b><br>
                    在Rt△ABC中，∠C = 90°<br>
                    AC = 6 cm，BC = 8 cm<br>
                    以AC为直径作圆，交斜边AB于点D
                </div>
            </foreignObject>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/6</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        var currentStep = 0;
        var totalSteps = 6;

        var btnPrev = document.getElementById('scene1-btn-prev');
        var btnNext = document.getElementById('scene1-btn-next');
        var stepIndicator = document.getElementById('scene1-step-indicator');
        var stepTitle = document.getElementById('scene1-step-title');
        var noteContent = document.getElementById('scene1-note-content');

        // 各步骤需要显示/隐藏的元素
        var elLineCd = document.getElementById('scene1-line-cd');
        var elRightAngleD = document.getElementById('scene1-right-angle-d');
        var elLabelAb = document.getElementById('scene1-label-ab');
        var elLabelAd = document.getElementById('scene1-label-ad');
        var elLabelBd = document.getElementById('scene1-label-bd');
        var elFillAdc = document.getElementById('scene1-fill-adc');

        var stepTitles = [
            '步骤 1/6：已知条件',
            '步骤 2/6：连接辅助线',
            '步骤 3/6：发现隐含直角',
            '步骤 4/6：计算斜边',
            '步骤 5/6：求AD',
            '步骤 6/6：得出结论'
        ];

        var stepNotes = [
            '<b style="color:#1565c0;">已知条件</b><br>在Rt△ABC中，∠C = 90°<br>AC = 6 cm，BC = 8 cm<br>以AC为直径作圆，交斜边AB于点D',
            '<b style="color:#1565c0;">辅助线</b><br>连接CD<br>为利用圆的性质做准备',
            '<b style="color:#1565c0;">发现隐含直角</b><br>∵ AC是直径<br>∴ ∠ADC = 90°<br><span style="color:#2e7d32">（直径所对圆周角为直角）</span>',
            '<b style="color:#1565c0;">计算斜边AB</b><br>由勾股定理：<br>AB² = AC² + BC²<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;= 6² + 8² = 100<br>∴ AB = 10 cm',
            '<b style="color:#1565c0;">求AD</b><br>∵ Rt△ADC ∽ Rt△ACB<br>∴ AC² = AD · AB<br>&nbsp;&nbsp;&nbsp;36 = AD × 10<br>∴ AD = 3.6 cm',
            '<b style="color:#1565c0;">结论</b><br>BD = AB − AD<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;= 10 − 3.6<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;= <span style="color:#c62828;font-size:1.2em"><b>6.4 cm</b></span>'
        ];

        function show(el) {
            el.classList.remove('scene1-hidden');
        }

        function hide(el) {
            el.classList.add('scene1-hidden');
        }

        function updateScene(step) {
            // 更新标题和旁注
            stepTitle.textContent = stepTitles[step];
            stepIndicator.textContent = '步骤 ' + (step + 1) + '/' + totalSteps;
            noteContent.innerHTML = stepNotes[step];

            // 按钮状态
            btnPrev.disabled = (step === 0);
            btnNext.disabled = (step === totalSteps - 1);

            // 元素显隐控制
            if (step >= 1) {
                show(elLineCd);
            } else {
                hide(elLineCd);
            }

            if (step >= 2) {
                show(elRightAngleD);
            } else {
                hide(elRightAngleD);
            }

            if (step >= 3) {
                show(elLabelAb);
            } else {
                hide(elLabelAb);
            }

            if (step >= 4) {
                show(elLabelAd);
                show(elFillAdc);
            } else {
                hide(elLabelAd);
                hide(elFillAdc);
            }

            if (step >= 5) {
                show(elLabelBd);
            } else {
                hide(elLabelBd);
            }
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateScene(currentStep);
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateScene(currentStep);
            }
        });

        // 键盘支持
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') {
                if (currentStep > 0) {
                    currentStep--;
                    updateScene(currentStep);
                }
            } else if (e.key === 'ArrowRight') {
                if (currentStep < totalSteps - 1) {
                    currentStep++;
                    updateScene(currentStep);
                }
            }
        });

        // 初始化
        updateScene(currentStep);
    })();
    </script>
</body>
</html>
