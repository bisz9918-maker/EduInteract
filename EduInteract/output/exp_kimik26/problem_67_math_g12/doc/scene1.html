<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>椭圆几何关系 - 场景1</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-hint-text { font-size: 14px; color: #333; }
        #scene1-btn-reset { padding: 4px 12px; font-size: 13px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: #f5f5f5; }
        #scene1-btn-reset:hover { background: #e0e0e0; }
        svg { display: block; }
        .draggable { cursor: grab; }
        .draggable:active { cursor: grabbing; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <!-- 椭圆 Γ -->
            <ellipse id="scene1-ellipse-gamma" cx="400" cy="260" rx="210" ry="130" stroke="#000000" stroke-width="1.5" fill="none"/>
            
            <!-- 坐标轴 -->
            <line id="scene1-axis-x" x1="120" y1="260" x2="680" y2="260" stroke="#000000" stroke-width="1.5"/>
            <line id="scene1-axis-y" x1="400" y1="80" x2="400" y2="440" stroke="#000000" stroke-width="1.5"/>
            
            <!-- 切线 l: x = 610 -->
            <line id="scene1-line-l" x1="610" y1="80" x2="610" y2="440" stroke="#000000" stroke-width="1.5"/>
            
            <!-- 线段 AP (A→P→D 延长) -->
            <line id="scene1-line-ap" x1="190" y1="260" x2="630" y2="187" stroke="#000000" stroke-width="1.5"/>
            
            <!-- 线段 BD -->
            <line id="scene1-segment-bd" x1="610" y1="260" x2="610" y2="190" stroke="#000000" stroke-width="1.5"/>
            
            <!-- 线段 PB -->
            <line id="scene1-segment-pb" x1="582" y1="195" x2="610" y2="260" stroke="#000000" stroke-width="1.5"/>
            
            <!-- 线段 FD -->
            <line id="scene1-segment-fd" x1="565" y1="260" x2="610" y2="190" stroke="#000000" stroke-width="1.5"/>
            
            <!-- 线段 FM (蓝色强调) -->
            <line id="scene1-segment-fm" x1="565" y1="260" x2="610" y2="225" stroke="#1565c0" stroke-width="2.5"/>
            
            <!-- 线段 PM (蓝色强调) -->
            <line id="scene1-segment-pm" x1="582" y1="195" x2="610" y2="225" stroke="#1565c0" stroke-width="2.5"/>
            
            <!-- 静态点 -->
            <circle id="scene1-point-a" cx="190" cy="260" r="3" fill="#2e7d32"/>
            <circle id="scene1-point-b" cx="610" cy="260" r="3" fill="#2e7d32"/>
            <circle id="scene1-point-f" cx="565" cy="260" r="3" fill="#1565c0"/>
            <circle id="scene1-point-o" cx="400" cy="260" r="3" fill="#000000"/>
            
            <!-- 动态点 -->
            <circle id="scene1-point-p" class="draggable" cx="582" cy="195" r="4" fill="#c62828"/>
            <circle id="scene1-point-d" cx="610" cy="190" r="4" fill="#c62828"/>
            <circle id="scene1-point-m" cx="610" cy="225" r="4" fill="#c62828"/>
            
            <!-- 静态标签 -->
            <text id="scene1-label-a" x="175" y="278" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#000000">A</text>
            <text id="scene1-label-b" x="625" y="278" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#000000">B</text>
            <text id="scene1-label-f" x="625" y="310" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#000000">F</text>
            <text id="scene1-label-o" x="400" y="420" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#000000">O</text>
            <text id="scene1-label-l" x="625" y="400" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#000000">l</text>
            <text id="scene1-label-x-eq-a" x="625" y="70" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#000000">x=a</text>
            <text id="scene1-label-equation" x="220" y="70" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#000000">Γ: x²/a² + y²/b² = 1</text>
            
            <!-- 动态标签 -->
            <text id="scene1-label-p" x="607" y="115" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#000000">P</text>
            <text id="scene1-label-d" x="628" y="160" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#000000">D</text>
            <text id="scene1-label-m" x="650" y="230" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#000000">M</text>
        </svg>
        
        <div id="scene1-controls">
            <span id="scene1-hint-text">拖动点 P 观察 D、M 的生成与线段关系</span>
            <button id="scene1-btn-reset">重置</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现
        
        // 椭圆参数（画布坐标）
        const CX = 400, CY = 260;   // 中心
        const RX = 210, RY = 130;   // 半轴
        const A_X = 190;            // 左顶点 A 的 x 坐标
        const B_X = 610;            // 右顶点 B 的 x 坐标（也是切线 l 的 x）
        const F_X = 565;            // 右焦点 F 的 x 坐标
        
        // 初始参数角（约 30°）
        const INITIAL_THETA = Math.PI / 6;
        const THETA_MIN = 0.35;     // 约 20°
        const THETA_MAX = 2.79;     // 约 160°
        
        // 当前状态
        let currentTheta = INITIAL_THETA;
        let isDragging = false;
        let isAnimating = false;
        
        // 获取元素
        const svg = document.getElementById('scene1-svg');
        const pointP = document.getElementById('scene1-point-p');
        const pointD = document.getElementById('scene1-point-d');
        const pointM = document.getElementById('scene1-point-m');
        const lineAP = document.getElementById('scene1-line-ap');
        const segBD = document.getElementById('scene1-segment-bd');
        const segPB = document.getElementById('scene1-segment-pb');
        const segFD = document.getElementById('scene1-segment-fd');
        const segFM = document.getElementById('scene1-segment-fm');
        const segPM = document.getElementById('scene1-segment-pm');
        const labelP = document.getElementById('scene1-label-p');
        const labelD = document.getElementById('scene1-label-d');
        const labelM = document.getElementById('scene1-label-m');
        const btnReset = document.getElementById('scene1-btn-reset');
        
        // 根据参数角 theta 计算 P 点画布坐标
        function getPFromTheta(theta) {
            return {
                x: CX + RX * Math.cos(theta),
                y: CY - RY * Math.sin(theta)
            };
        }
        
        // 计算 D 点：直线 AP 与切线 l (x = B_X) 的交点
        function computeD(px, py) {
            // A = (A_X, CY), P = (px, py)
            // 参数 t: x = A_X + t*(px - A_X) = B_X
            const t = (B_X - A_X) / (px - A_X);
            const dy = CY + t * (py - CY);
            return { x: B_X, y: dy };
        }
        
        // 计算 M 点：BD 中点
        function computeM(dy) {
            return { x: B_X, y: (CY + dy) / 2 };
        }
        
        // 更新所有几何元素
        function updateGeometry(theta) {
            const p = getPFromTheta(theta);
            const d = computeD(p.x, p.y);
            const m = computeM(d.y);
            
            // 更新点 P
            pointP.setAttribute('cx', p.x);
            pointP.setAttribute('cy', p.y);
            
            // 更新点 D
            pointD.setAttribute('cx', d.x);
            pointD.setAttribute('cy', d.y);
            
            // 更新点 M
            pointM.setAttribute('cx', m.x);
            pointM.setAttribute('cy', m.y);
            
            // 更新直线 AP：从 A 经过 P 延长到 D 之外一点
            // 延长到 x = 630（D 的右侧）
            const tExtend = (630 - A_X) / (p.x - A_X);
            const extendY = CY + tExtend * (p.y - CY);
            lineAP.setAttribute('x1', A_X);
            lineAP.setAttribute('y1', CY);
            lineAP.setAttribute('x2', 630);
            lineAP.setAttribute('y2', extendY);
            
            // 更新线段 BD
            segBD.setAttribute('x1', B_X);
            segBD.setAttribute('y1', CY);
            segBD.setAttribute('x2', d.x);
            segBD.setAttribute('y2', d.y);
            
            // 更新线段 PB
            segPB.setAttribute('x1', p.x);
            segPB.setAttribute('y1', p.y);
            segPB.setAttribute('x2', B_X);
            segPB.setAttribute('y2', CY);
            
            // 更新线段 FD
            segFD.setAttribute('x1', F_X);
            segFD.setAttribute('y1', CY);
            segFD.setAttribute('x2', d.x);
            segFD.setAttribute('y2', d.y);
            
            // 更新线段 FM
            segFM.setAttribute('x1', F_X);
            segFM.setAttribute('y1', CY);
            segFM.setAttribute('x2', m.x);
            segFM.setAttribute('y2', m.y);
            
            // 更新线段 PM
            segPM.setAttribute('x1', p.x);
            segPM.setAttribute('y1', p.y);
            segPM.setAttribute('x2', m.x);
            segPM.setAttribute('y2', m.y);
            
            // 更新 P 标签：根据 P 在左/右半椭圆选择偏移方向，确保在椭圆 bbox 之外
            if (p.x >= CX) {
                // 右半：向右上偏移，x > 610 避开椭圆 bbox
                labelP.setAttribute('x', p.x + 25);
                labelP.setAttribute('y', p.y - 80);
            } else {
                // 左半：向左上偏移，y < 130 避开椭圆 bbox
                labelP.setAttribute('x', p.x - 25);
                labelP.setAttribute('y', p.y - 95);
            }
            
            // 更新 D 标签
            labelD.setAttribute('x', d.x + 18);
            labelD.setAttribute('y', d.y - 30);
            
            // 更新 M 标签
            labelM.setAttribute('x', m.x + 40);
            labelM.setAttribute('y', m.y + 5);
        }
        
        // 鼠标/触摸坐标转 SVG 坐标
        function getSVGPoint(clientX, clientY) {
            const pt = svg.createSVGPoint();
            pt.x = clientX;
            pt.y = clientY;
            return pt.matrixTransform(svg.getScreenCTM().inverse());
        }
        
        // 开始拖拽
        function startDrag(evt) {
            if (isAnimating) return;
            isDragging = true;
            evt.preventDefault();
        }
        
        // 拖拽中
        function onDrag(evt) {
            if (!isDragging) return;
            evt.preventDefault();
            
            const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
            const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
            const pt = getSVGPoint(clientX, clientY);
            
            // 计算参数角 theta，限制范围
            let theta = Math.atan2(CY - pt.y, pt.x - CX);
            if (theta < 0) theta += 2 * Math.PI;
            
            // 限制在 [THETA_MIN, THETA_MAX]
            theta = Math.max(THETA_MIN, Math.min(THETA_MAX, theta));
            
            currentTheta = theta;
            updateGeometry(currentTheta);
        }
        
        // 结束拖拽
        function endDrag(evt) {
            isDragging = false;
        }
        
        // 重置动画
        function resetPosition() {
            if (isAnimating) return;
            isAnimating = true;
            
            const startTheta = currentTheta;
            const endTheta = INITIAL_THETA;
            const duration = 300;
            const startTime = performance.now();
            
            function animate(now) {
                const elapsed = now - startTime;
                const t = Math.min(elapsed / duration, 1);
                // ease-out
                const ease = 1 - Math.pow(1 - t, 3);
                
                currentTheta = startTheta + (endTheta - startTheta) * ease;
                updateGeometry(currentTheta);
                
                if (t < 1) {
                    requestAnimationFrame(animate);
                } else {
                    isAnimating = false;
                }
            }
            
            requestAnimationFrame(animate);
        }
        
        // 事件绑定
        pointP.addEventListener('mousedown', startDrag);
        pointP.addEventListener('touchstart', startDrag, { passive: false });
        
        svg.addEventListener('mousemove', onDrag);
        svg.addEventListener('touchmove', onDrag, { passive: false });
        
        svg.addEventListener('mouseup', endDrag);
        svg.addEventListener('mouseleave', endDrag);
        svg.addEventListener('touchend', endDrag);
        
        btnReset.addEventListener('click', resetPosition);
        
        // 初始化
        updateGeometry(currentTheta);
        
    })();
    </script>
</body>
</html>
