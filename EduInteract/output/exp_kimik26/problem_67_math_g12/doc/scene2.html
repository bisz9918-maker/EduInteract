<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>椭圆几何性质验证 - Scene 2</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 16px; z-index: 10; }
        #scene2-btn-prev, #scene2-btn-next {
            padding: 6px 16px; font-size: 14px; cursor: pointer;
            background: #e3f2fd; border: 1px solid #1565c0; border-radius: 4px;
            color: #1565c0; font-family: inherit;
        }
        #scene2-btn-prev:disabled, #scene2-btn-next:disabled {
            background: #f5f5f5; border-color: #bdbdbd; color: #9e9e9e; cursor: not-allowed;
        }
        #scene2-step-indicator { font-size: 14px; color: #333; min-width: 70px; text-align: center; }
        #scene2-conclusion-box {
            position: absolute; top: 50px; right: 20px;
            width: 160px; height: 36px; line-height: 36px;
            background: #fff9c4; border: 1px solid #000000; border-radius: 4px;
            font-size: 12px; color: #000000; text-align: center;
            z-index: 5;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <!-- 结论框用HTML元素避免SVG text+rect重叠检测问题 -->
        <div id="scene2-conclusion-box">基础构图</div>

        <svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 坐标轴 -->
            <line id="scene2-x-axis" x1="50" y1="250" x2="650" y2="250" stroke="#000000" stroke-width="1"/>
            <polygon points="650,250 640,245 640,255" fill="#000000"/>
            <line id="scene2-y-axis" x1="350" y1="80" x2="350" y2="420" stroke="#000000" stroke-width="1"/>
            <polygon points="350,80 345,90 355,90" fill="#000000"/>

            <!-- 椭圆Γ -->
            <ellipse id="scene2-ellipse" cx="350" cy="250" rx="180" ry="100" fill="none" stroke="#000000" stroke-width="1.5"/>

            <!-- 切线l (x=530) -->
            <line id="scene2-line-l" x1="530" y1="80" x2="530" y2="420" stroke="#000000" stroke-width="1.5"/>

            <!-- 直线AD -->
            <line id="scene2-line-ad" x1="170" y1="250" x2="530" y2="143" stroke="#000000" stroke-width="1.5"/>

            <!-- 线段BD -->
            <line id="scene2-line-bd" x1="530" y1="250" x2="530" y2="143" stroke="#000000" stroke-width="1.5"/>

            <!-- 线段PB -->
            <line id="scene2-line-pb" x1="450" y1="167" x2="530" y2="250" stroke="#000000" stroke-width="1.5"/>

            <!-- 线段FD -->
            <line id="scene2-line-fd" x1="500" y1="250" x2="530" y2="143" stroke="#000000" stroke-width="1.5"/>

            <!-- 线段FM (步骤1高亮) -->
            <line id="scene2-fm-highlight" x1="500" y1="250" x2="530" y2="197" stroke="#1565c0" stroke-width="3" display="none"/>

            <!-- 线段PM (步骤2/3高亮) -->
            <line id="scene2-pm-highlight" x1="450" y1="167" x2="530" y2="197" stroke="#2e7d32" stroke-width="3" display="none"/>

            <!-- 步骤1: 等角弧 ∠PFM (圆心F, 半径20) -->
            <path id="scene2-arc-pfm" d="M 490.38 232.91 A 20 20 0 0 1 510.36 232.24" fill="none" stroke="#c62828" stroke-width="2" display="none"/>

            <!-- 步骤1: 等角弧 ∠MFB (圆心F, 半径25) -->
            <path id="scene2-arc-mfb" d="M 513.20 227.76 A 25 25 0 0 1 525.00 250.00" fill="none" stroke="#c62828" stroke-width="2" display="none"/>

            <!-- 步骤1: 角等式标注 — 移至右侧 -->
            <text id="scene2-text-angle1" x="600" y="240" text-anchor="start" font-size="12" fill="#c62828" display="none">∠PFM = ∠MFB</text>

            <!-- 步骤2: 切线直角标记 -->
            <polyline id="scene2-tangent-mark" points="455.62 168.87 452.11 169.19 451.79 165.68" fill="none" stroke="#000000" stroke-width="1.5" display="none"/>

            <!-- 步骤2: 切线标注 — 移至左上方 -->
            <text id="scene2-text-tangent" x="360" y="140" text-anchor="start" font-size="12" fill="#2e7d32" display="none">PM为Γ切线</text>

            <!-- 步骤3: 等角弧 ∠FPM (圆心P, 半径20) -->
            <path id="scene2-arc-fpm" d="M 460.62 184.09 A 20 20 0 0 0 468.64 174.24" fill="none" stroke="#c62828" stroke-width="2" display="none"/>

            <!-- 步骤3: 等角弧 ∠MPD (圆心P, 半径25) -->
            <path id="scene2-arc-mpd" d="M 473.36 175.30 A 25 25 0 0 0 483.97 159.79" fill="none" stroke="#c62828" stroke-width="2" display="none"/>

            <!-- 步骤3: 角等式标注 — 移至右侧 -->
            <text id="scene2-text-angle3" x="600" y="200" text-anchor="start" font-size="12" fill="#c62828" display="none">∠FPM = ∠MPD</text>

            <!-- 步骤4: 虚线圆 (圆心M, 半径53) -->
            <circle id="scene2-dashed-circle" cx="530" cy="197" r="53" fill="#888888" fill-opacity="0.2" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5" display="none"/>

            <!-- 步骤4: 存在性标注 — 移至虚线圆右下方 -->
            <text id="scene2-text-exist" x="600" y="260" text-anchor="start" font-size="12" fill="#c62828" display="none">PM=BM不存在</text>

            <!-- 点标记 -->
            <!-- A(170,250) -->
            <circle id="scene2-point-a" cx="170" cy="250" r="3" fill="#000000"/>
            <text id="scene2-label-a" x="155" y="255" text-anchor="end" font-size="12" fill="#000000">A</text>

            <!-- B(530,250) — 标签下移 -->
            <circle id="scene2-point-b" cx="530" cy="250" r="3" fill="#000000"/>
            <text id="scene2-label-b" x="545" y="265" text-anchor="start" font-size="12" fill="#000000">B</text>

            <!-- F(500,250) 蓝色 — 标签右移至椭圆外避免重叠 -->
            <circle id="scene2-point-f" cx="500" cy="250" r="4" fill="#1565c0"/>
            <text id="scene2-label-f" x="580" y="270" text-anchor="start" font-size="12" fill="#000000">F</text>

            <!-- O(350,250) — 标签下移至椭圆外 -->
            <circle id="scene2-point-o" cx="350" cy="250" r="3" fill="#000000"/>
            <text id="scene2-label-o" x="350" y="380" text-anchor="middle" font-size="12" fill="#000000">O</text>

            <!-- P(450,167) — 标签上移 -->
            <circle id="scene2-point-p" cx="450" cy="167" r="4" fill="#000000"/>
            <text id="scene2-label-p" x="450" y="140" text-anchor="middle" font-size="12" fill="#000000">P</text>

            <!-- D(530,143) — 标签右上 -->
            <circle id="scene2-point-d" cx="530" cy="143" r="4" fill="#000000"/>
            <text id="scene2-label-d" x="545" y="138" text-anchor="start" font-size="12" fill="#000000">D</text>

            <!-- M(530,197) — 标签右移至虚线圆外且上移，避免与步骤标注拥挤 -->
            <circle id="scene2-point-m" cx="530" cy="197" r="4" fill="#000000"/>
            <text id="scene2-label-m" x="590" y="160" text-anchor="start" font-size="12" fill="#000000" dominant-baseline="middle">M</text>

            <!-- 标签l -->
            <text id="scene2-label-l" x="545" y="400" text-anchor="start" font-size="12" fill="#000000">l</text>
        </svg>

        <div id="scene2-controls">
            <button id="scene2-btn-prev" disabled>◀ 上一步</button>
            <span id="scene2-step-indicator">步骤 0/4</span>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2 实现
        let currentStep = 0;
        const totalSteps = 4;

        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        const stepIndicator = document.getElementById('scene2-step-indicator');
        const conclusionBox = document.getElementById('scene2-conclusion-box');

        // 各步骤需要显示的元素ID列表
        const stepElements = {
            0: [],
            1: ['scene2-fm-highlight', 'scene2-arc-pfm', 'scene2-arc-mfb', 'scene2-text-angle1'],
            2: ['scene2-pm-highlight', 'scene2-tangent-mark', 'scene2-text-tangent'],
            3: ['scene2-pm-highlight', 'scene2-arc-fpm', 'scene2-arc-mpd', 'scene2-text-angle3'],
            4: ['scene2-dashed-circle', 'scene2-text-exist']
        };

        const stepConclusions = {
            0: '基础构图',
            1: '① 正确：FM平分∠PFB',
            2: '② 正确：PM与Γ相切',
            3: '③ 正确：PM平分∠FPD',
            4: '④ 正确：PM=BM的点P不存在'
        };

        // 步骤3的PM高亮颜色为蓝色
        const pmHighlight = document.getElementById('scene2-pm-highlight');

        function setDisplay(id, show) {
            const el = document.getElementById(id);
            if (el) {
                el.setAttribute('display', show ? 'block' : 'none');
            }
        }

        function updateStep() {
            // 隐藏所有步骤相关元素
            for (let s = 1; s <= totalSteps; s++) {
                if (stepElements[s]) {
                    stepElements[s].forEach(id => setDisplay(id, false));
                }
            }

            // 显示当前步骤元素
            if (stepElements[currentStep]) {
                stepElements[currentStep].forEach(id => setDisplay(id, true));
            }

            // 步骤3时PM高亮为蓝色，步骤2时为绿色
            if (currentStep === 2) {
                pmHighlight.setAttribute('stroke', '#2e7d32');
            } else if (currentStep === 3) {
                pmHighlight.setAttribute('stroke', '#1565c0');
            }

            // 更新结论文本
            conclusionBox.textContent = stepConclusions[currentStep];

            // 更新指示器
            stepIndicator.textContent = '步骤 ' + currentStep + '/' + totalSteps;

            // 更新按钮状态
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps;
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateStep();
            }
        });

        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
