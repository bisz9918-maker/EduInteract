<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三棱柱结构识别与底面直角三角形边长计算</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            padding: 6px 16px; font-size: 14px; border: 1px solid #cccccc; border-radius: 4px;
            background: #f5f5f5; cursor: pointer; transition: background 0.2s;
        }
        #scene1-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene1-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene1-step-text { font-size: 12px; color: #666666; min-width: 60px; text-align: center; }

        /* 步骤相关元素过渡 */
        .scene1-step-el { transition: opacity 0.3s ease; }
        .scene1-hidden { opacity: 0; pointer-events: none; }
        .scene1-visible { opacity: 1; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" viewBox="0 0 800 500">
            <!-- ==================== 三棱柱主图 ==================== -->
            <!-- 被遮挡棱（虚线） -->
            <line id="scene1-edge-ac" x1="380" y1="205" x2="210" y2="35" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,3" />
            <line id="scene1-edge-a1c1" x1="380" y1="370" x2="210" y2="200" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,3" />

            <!-- 侧棱 -->
            <line id="scene1-edge-aa1" x1="380" y1="205" x2="380" y2="370" stroke="#000000" stroke-width="2" />
            <line id="scene1-edge-bb1" x1="260" y1="235" x2="260" y2="400" stroke="#000000" stroke-width="2" />
            <line id="scene1-edge-cc1" x1="210" y1="35" x2="210" y2="200" stroke="#000000" stroke-width="2" />

            <!-- 上底面 -->
            <line id="scene1-edge-ab" x1="380" y1="205" x2="260" y2="235" stroke="#000000" stroke-width="2" />
            <line id="scene1-edge-bc" x1="260" y1="235" x2="210" y2="35" stroke="#000000" stroke-width="2" />

            <!-- 下底面 -->
            <line id="scene1-edge-a1b1" x1="380" y1="370" x2="260" y2="400" stroke="#000000" stroke-width="2" />
            <line id="scene1-edge-b1c1" x1="260" y1="400" x2="210" y2="200" stroke="#000000" stroke-width="2" />

            <!-- 底面高亮填充（步骤2显示） -->
            <polygon id="scene1-base-highlight" class="scene1-step-el scene1-hidden" points="380,370 260,400 210,200" fill="#1565c0" fill-opacity="0.15" stroke="#1565c0" stroke-width="2" />

            <!-- 顶点标签 -->
            <text id="scene1-label-a" x="395" y="200" font-size="14" fill="#000000" font-family="sans-serif">A</text>
            <!-- B 标签左移，避开 AB、BC、BB₁ 线段 -->
            <text id="scene1-label-b" x="200" y="235" font-size="14" fill="#000000" font-family="sans-serif">B</text>
            <text id="scene1-label-c" x="195" y="40" font-size="14" fill="#000000" font-family="sans-serif">C</text>
            <text id="scene1-label-a1" x="395" y="385" font-size="14" fill="#000000" font-family="sans-serif">A₁</text>
            <text id="scene1-label-b1" x="245" y="415" font-size="14" fill="#000000" font-family="sans-serif">B₁</text>
            <!-- C₁ 标签左上移，避开 B₁C₁ 线段 -->
            <text id="scene1-label-c1" x="185" y="185" font-size="14" fill="#000000" font-family="sans-serif">C₁</text>

            <!-- 步骤1：AA₁=8 标注 -->
            <text id="scene1-label-aa1" class="scene1-step-el scene1-hidden" x="395" y="287" font-size="13" fill="#c62828" font-family="sans-serif">AA₁ = 8</text>

            <!-- 步骤1：A₁ 处直角符号（AA₁ ⊥ 底面） -->
            <path id="scene1-rightangle-a1" class="scene1-step-el scene1-hidden" d="M 365 355 L 365 370 L 380 370" fill="none" stroke="#2e7d32" stroke-width="1.5" />

            <!-- 步骤2：A₁B₁=6 标注 -->
            <text id="scene1-label-a1b1" class="scene1-step-el scene1-hidden" x="320" y="410" font-size="13" fill="#c62828" font-family="sans-serif">A₁B₁ = 6</text>

            <!-- 步骤2：A₁C₁=2√34 标注 — 移至棱柱右侧，避开底面三角形 -->
            <text id="scene1-label-a1c1" class="scene1-step-el scene1-hidden" x="420" y="320" font-size="13" fill="#c62828" font-family="sans-serif">A₁C₁ = 2√34</text>

            <!-- 步骤2：B₁ 处直角符号（A₁B₁ ⊥ B₁C₁） -->
            <path id="scene1-rightangle-b1" class="scene1-step-el scene1-hidden" d="M 270 385 L 270 400 L 260 400" fill="none" stroke="#2e7d32" stroke-width="1.5" />

            <!-- ==================== 放大示意图（步骤3显示） ==================== -->
            <!-- 放大图背景框 -->
            <rect id="scene1-magnify-bg" class="scene1-step-el scene1-hidden" x="470" y="110" width="260" height="290" fill="#fafafa" stroke="#e0e0e0" stroke-width="1" rx="4" />

            <!-- 放大图三角形 -->
            <line id="scene1-mag-edge-a1b1" class="scene1-step-el scene1-hidden" x1="710" y1="340" x2="560" y2="380" stroke="#1565c0" stroke-width="2" />
            <line id="scene1-mag-edge-b1c1" class="scene1-step-el scene1-hidden" x1="560" y1="380" x2="493" y2="130" stroke="#1565c0" stroke-width="2" />
            <line id="scene1-mag-edge-a1c1" class="scene1-step-el scene1-hidden" x1="710" y1="340" x2="493" y2="130" stroke="#1565c0" stroke-width="2" />

            <!-- 放大图顶点标签 — 全部移至背景框外侧，避免与 rect/line 重叠 -->
            <text id="scene1-mag-label-a1" class="scene1-step-el scene1-hidden" x="740" y="335" font-size="14" fill="#000000" font-family="sans-serif">A₁</text>
            <text id="scene1-mag-label-b1" class="scene1-step-el scene1-hidden" x="545" y="410" font-size="14" fill="#000000" font-family="sans-serif">B₁</text>
            <text id="scene1-mag-label-c1" class="scene1-step-el scene1-hidden" x="478" y="105" font-size="14" fill="#000000" font-family="sans-serif">C₁</text>

            <!-- 放大图标注 — 移至三角形外侧，避开所有线条与背景框 -->
            <text id="scene1-mag-label-a1b1-val" class="scene1-step-el scene1-hidden" x="635" y="410" font-size="13" fill="#c62828" font-family="sans-serif">A₁B₁ = 6</text>
            <text id="scene1-mag-label-b1c1-val" class="scene1-step-el scene1-hidden" x="450" y="255" font-size="14" fill="#c62828" font-family="sans-serif" font-weight="bold">B₁C₁ = 10</text>
            <text id="scene1-mag-label-a1c1-val" class="scene1-step-el scene1-hidden" x="620" y="105" font-size="13" fill="#c62828" font-family="sans-serif">A₁C₁ = 2√34</text>

            <!-- 放大图直角符号 B₁' -->
            <path id="scene1-mag-rightangle-b1" class="scene1-step-el scene1-hidden" d="M 575 365 L 575 380 L 560 380" fill="none" stroke="#2e7d32" stroke-width="1.5" />

            <!-- 推导公式 — 下移至控件栏上方，避免与放大图元素拥挤 -->
            <text id="scene1-formula" class="scene1-step-el scene1-hidden" x="480" y="435" font-size="13" fill="#000000" font-family="sans-serif">
                B₁C₁ = √((2√34)² − 6²) = <tspan fill="#2e7d32" font-weight="bold">10</tspan>
            </text>
        </svg>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <span id="scene1-step-text">步骤 1/4</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        let currentStep = 0;
        const maxStep = 3;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepText = document.getElementById('scene1-step-text');

        // 各步骤需要显示的元素 ID 列表
        const stepElements = {
            0: [], // 初始状态只显示基础图形
            1: ['scene1-label-aa1', 'scene1-rightangle-a1'],
            2: ['scene1-label-aa1', 'scene1-rightangle-a1', 'scene1-base-highlight', 'scene1-label-a1b1', 'scene1-label-a1c1', 'scene1-rightangle-b1'],
            3: ['scene1-label-aa1', 'scene1-rightangle-a1', 'scene1-base-highlight', 'scene1-label-a1b1', 'scene1-label-a1c1', 'scene1-rightangle-b1',
                'scene1-magnify-bg', 'scene1-mag-edge-a1b1', 'scene1-mag-edge-b1c1', 'scene1-mag-edge-a1c1',
                'scene1-mag-label-a1', 'scene1-mag-label-b1', 'scene1-mag-label-c1',
                'scene1-mag-label-a1b1-val', 'scene1-mag-label-b1c1-val', 'scene1-mag-label-a1c1-val',
                'scene1-mag-rightangle-b1', 'scene1-formula']
        };

        function renderStep() {
            // 更新步骤文本
            stepText.textContent = '步骤 ' + (currentStep + 1) + '/4';

            // 更新按钮状态
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;

            // 先隐藏所有步骤元素
            const allStepEls = document.querySelectorAll('.scene1-step-el');
            allStepEls.forEach(function(el) {
                el.classList.remove('scene1-visible');
                el.classList.add('scene1-hidden');
            });

            // 显示当前步骤对应的元素
            const idsToShow = stepElements[currentStep] || [];
            idsToShow.forEach(function(id) {
                const el = document.getElementById(id);
                if (el) {
                    el.classList.remove('scene1-hidden');
                    el.classList.add('scene1-visible');
                }
            });

            // 步骤2时，A₁C₁ 虚线变为蓝色
            const edgeA1C1 = document.getElementById('scene1-edge-a1c1');
            if (edgeA1C1) {
                if (currentStep >= 2) {
                    edgeA1C1.setAttribute('stroke', '#1565c0');
                } else {
                    edgeA1C1.setAttribute('stroke', '#888888');
                }
            }
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < maxStep) {
                currentStep++;
                renderStep();
            }
        });

        // 初始渲染
        renderStep();
    })();
    </script>
</body>
</html>
