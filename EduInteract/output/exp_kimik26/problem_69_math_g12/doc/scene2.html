<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>直三棱柱外接球 - 场景2</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene2-controls button {
            padding: 6px 16px; font-size: 14px; cursor: pointer;
            border: 1px solid #ccc; border-radius: 4px; background: #f5f5f5;
            transition: opacity 0.15s;
        }
        #scene2-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene2-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 定义 -->
            <defs>
                <marker id="scene2-arrow" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
                    <circle cx="3" cy="3" r="2" fill="#c62828"/>
                </marker>
            </defs>

            <!-- ===== 第1层：外接球填充与网格 ===== -->
            <g id="scene2-sphere-group" data-step="0">
                <!-- 球填充 -->
                <circle cx="234" cy="304" r="78" fill="#1565c0" opacity="0.08"/>
                <!-- 球轮廓 -->
                <circle cx="234" cy="304" r="78" fill="none" stroke="#1565c0" stroke-width="1" opacity="0.5"/>
                <!-- 经线弧1（竖直） -->
                <path d="M 234 226 A 78 78 0 0 1 234 382" fill="none" stroke="#1565c0" stroke-width="1" opacity="0.35"/>
                <!-- 经线弧2（水平） -->
                <path d="M 156 304 A 78 78 0 0 1 312 304" fill="none" stroke="#1565c0" stroke-width="1" opacity="0.35"/>
                <!-- 纬线弧1（上） -->
                <ellipse cx="234" cy="270" rx="60" ry="18" fill="none" stroke="#1565c0" stroke-width="1" opacity="0.3"/>
                <!-- 纬线弧2（下） -->
                <ellipse cx="234" cy="338" rx="60" ry="18" fill="none" stroke="#1565c0" stroke-width="1" opacity="0.3"/>
            </g>

            <!-- ===== 第2层：三棱柱隐藏棱 ===== -->
            <g id="scene2-prism-hidden" data-step="0">
                <!-- 下底面 AC（隐藏棱，虚线） -->
                <line x1="181" y1="335" x2="286" y2="360" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.6"/>
            </g>

            <!-- ===== 第3层：三棱柱可见棱 ===== -->
            <g id="scene2-prism-visible" data-step="0">
                <!-- 上底面 -->
                <line x1="286" y1="272" x2="220" y2="272" stroke="#000000" stroke-width="1.5" opacity="0.5"/>
                <line x1="220" y1="272" x2="181" y2="247" stroke="#000000" stroke-width="1.5" opacity="0.5"/>
                <line x1="181" y1="247" x2="286" y2="272" stroke="#000000" stroke-width="1.5" opacity="0.5"/>
                <!-- 下底面 -->
                <line x1="286" y1="360" x2="220" y2="360" stroke="#000000" stroke-width="1.5" opacity="0.5"/>
                <line x1="220" y1="360" x2="181" y2="335" stroke="#000000" stroke-width="1.5" opacity="0.5"/>
                <!-- 侧棱 -->
                <line x1="286" y1="360" x2="286" y2="272" stroke="#000000" stroke-width="1.5" opacity="0.5"/>
                <line x1="220" y1="360" x2="220" y2="272" stroke="#000000" stroke-width="1.5" opacity="0.5"/>
                <line x1="181" y1="335" x2="181" y2="247" stroke="#000000" stroke-width="1.5" opacity="0.5"/>
            </g>

            <!-- ===== 第4层：外接圆与辅助连线 ===== -->
            <!-- 上底面外接圆（步骤1显示） -->
            <g id="scene2-circle-top" data-step="1" style="display:none; opacity:0;">
                <ellipse cx="234" cy="260" rx="64" ry="27" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="5,3" transform="rotate(33 234 260)"/>
            </g>
            <!-- 下底面外接圆（步骤2显示） -->
            <g id="scene2-circle-bottom" data-step="2" style="display:none; opacity:0;">
                <ellipse cx="234" cy="348" rx="64" ry="27" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="5,3" transform="rotate(33 234 348)"/>
            </g>
            <!-- O₁O₂ 连线（步骤2显示） -->
            <g id="scene2-line-O1O2" data-step="2" style="display:none; opacity:0;">
                <line x1="234" y1="260" x2="234" y2="348" stroke="#888888" stroke-width="1.5" stroke-dasharray="6,4"/>
            </g>

            <!-- ===== 第5层：高亮半径连线（步骤3显示） ===== -->
            <g id="scene2-radius-lines" data-step="3" style="display:none; opacity:0;">
                <line x1="234" y1="304" x2="286" y2="272" stroke="#1565c0" stroke-width="2" opacity="0.8"/>
                <line x1="234" y1="304" x2="220" y2="272" stroke="#1565c0" stroke-width="2" opacity="0.8"/>
                <line x1="234" y1="304" x2="181" y2="247" stroke="#1565c0" stroke-width="2" opacity="0.8"/>
                <!-- OO₁ 红色实线 -->
                <line x1="234" y1="304" x2="234" y2="260" stroke="#c62828" stroke-width="2" opacity="0.9"/>
            </g>

            <!-- ===== 第6层：顶点/外心/球心圆点 ===== -->
            <!-- 顶点（步骤0显示） -->
            <g id="scene2-vertices" data-step="0">
                <circle cx="286" cy="360" r="2.5" fill="#000000"/>
                <circle cx="220" cy="360" r="2.5" fill="#000000"/>
                <circle cx="181" cy="335" r="2.5" fill="#000000"/>
                <circle cx="286" cy="272" r="2.5" fill="#000000"/>
                <circle cx="220" cy="272" r="2.5" fill="#000000"/>
                <circle cx="181" cy="247" r="2.5" fill="#000000"/>
            </g>
            <!-- 外心 O₁（步骤1显示） -->
            <g id="scene2-center-O1" data-step="1" style="display:none; opacity:0;">
                <circle cx="234" cy="260" r="4" fill="#c62828" stroke="#ffffff" stroke-width="1"/>
            </g>
            <!-- 外心 O₂（步骤2显示） -->
            <g id="scene2-center-O2" data-step="2" style="display:none; opacity:0;">
                <circle cx="234" cy="348" r="4" fill="#c62828" stroke="#ffffff" stroke-width="1"/>
            </g>
            <!-- 球心 O（步骤3显示） -->
            <g id="scene2-center-O" data-step="3" style="display:none; opacity:0;">
                <circle cx="234" cy="304" r="4" fill="#c62828" stroke="#ffffff" stroke-width="1"/>
            </g>

            <!-- ===== 第7层：文字标签 ===== -->
            <!-- 顶点标签（步骤0显示） —— 全部置于球外避免重叠 -->
            <g id="scene2-labels-vertices" data-step="0">
                <text x="320" y="375" font-size="13" fill="#000000" font-style="italic">A</text>
                <text x="200" y="420" font-size="13" fill="#000000" font-style="italic">B</text>
                <text x="140" y="330" font-size="13" fill="#000000" font-style="italic">C</text>
                <text x="335" y="278" font-size="13" fill="#000000" font-style="italic">A<tspan font-size="10" baseline-shift="sub">1</tspan></text>
                <text x="125" y="255" font-size="13" fill="#000000" font-style="italic">B<tspan font-size="10" baseline-shift="sub">1</tspan></text>
                <text x="125" y="195" font-size="13" fill="#000000" font-style="italic">C<tspan font-size="10" baseline-shift="sub">1</tspan></text>
            </g>
            <!-- O₁ 标签（步骤1显示） -->
            <g id="scene2-label-O1" data-step="1" style="display:none; opacity:0;">
                <text x="125" y="310" font-size="13" fill="#c62828" font-style="italic">O<tspan font-size="10" baseline-shift="sub">1</tspan></text>
            </g>
            <!-- r=√34 标签（步骤1显示） -->
            <g id="scene2-label-r" data-step="1" style="display:none; opacity:0;">
                <text x="340" y="220" font-size="13" fill="#c62828">r = √34</text>
            </g>
            <!-- O₂ 标签（步骤2显示） -->
            <g id="scene2-label-O2" data-step="2" style="display:none; opacity:0;">
                <text x="120" y="365" font-size="13" fill="#c62828" font-style="italic">O<tspan font-size="10" baseline-shift="sub">2</tspan></text>
            </g>
            <!-- O₁O₂=8 标签（步骤2显示） —— 移到球体左侧外部 -->
            <g id="scene2-label-O1O2" data-step="2" style="display:none; opacity:0;">
                <text x="60" y="260" font-size="13" fill="#c62828">O<tspan font-size="10" baseline-shift="sub">1</tspan>O<tspan font-size="10" baseline-shift="sub">2</tspan> = 8</text>
            </g>
            <!-- O 标签（步骤3显示） —— 移到右侧避免与A重叠 -->
            <g id="scene2-label-O" data-step="3" style="display:none; opacity:0;">
                <text x="340" y="330" font-size="13" fill="#c62828" font-style="italic">O</text>
            </g>
            <!-- OO₁=4 标签（步骤3显示） —— 移到右侧避免与A1重叠 -->
            <g id="scene2-label-OO1" data-step="3" style="display:none; opacity:0;">
                <text x="390" y="320" font-size="13" fill="#c62828">OO<tspan font-size="10" baseline-shift="sub">1</tspan> = 4</text>
            </g>
            <!-- R=5√2 标签（步骤3显示） -->
            <g id="scene2-label-R" data-step="3" style="display:none; opacity:0;">
                <text x="340" y="260" font-size="13" fill="#c62828">R = 5√2</text>
            </g>

            <!-- ===== 右侧直角三角形（步骤4显示） ===== -->
            <g id="scene2-right-tri" data-step="4" style="display:none; opacity:0;">
                <!-- 填充 -->
                <polygon points="520,300 520,220 636,300" fill="#2e7d32" opacity="0.12"/>
                <!-- 三边 -->
                <line x1="520" y1="300" x2="520" y2="220" stroke="#2e7d32" stroke-width="2.5"/>
                <line x1="520" y1="300" x2="636" y2="300" stroke="#2e7d32" stroke-width="2.5"/>
                <line x1="520" y1="220" x2="636" y2="300" stroke="#2e7d32" stroke-width="2.5"/>
                <!-- 直角符号 -->
                <path d="M 520 292 L 528 292 L 528 300" fill="none" stroke="#2e7d32" stroke-width="1.5"/>
                <!-- 顶点 -->
                <circle cx="520" cy="300" r="3" fill="#2e7d32"/>
                <circle cx="520" cy="220" r="3" fill="#2e7d32"/>
                <circle cx="636" cy="300" r="3" fill="#2e7d32"/>
                <!-- 顶点标签 -->
                <text x="520" y="318" font-size="13" fill="#2e7d32" text-anchor="middle" font-style="italic">O<tspan font-size="10" baseline-shift="sub">1</tspan></text>
                <text x="502" y="220" font-size="13" fill="#2e7d32" text-anchor="end" font-style="italic">O</text>
                <text x="654" y="300" font-size="13" fill="#2e7d32" font-style="italic">B<tspan font-size="10" baseline-shift="sub">1</tspan></text>
                <!-- 边标注 -->
                <text x="502" y="260" font-size="13" fill="#2e7d32" text-anchor="end">OO<tspan font-size="10" baseline-shift="sub">1</tspan> = 4</text>
                <text x="578" y="318" font-size="13" fill="#2e7d32" text-anchor="middle">O<tspan font-size="10" baseline-shift="sub">1</tspan>B<tspan font-size="10" baseline-shift="sub">1</tspan> = √34</text>
                <text x="665" y="225" font-size="13" fill="#2e7d32">OB<tspan font-size="10" baseline-shift="sub">1</tspan> = 5√2</text>
            </g>

            <!-- ===== 公式（步骤5显示） ===== -->
            <g id="scene2-formula" data-step="5" style="display:none; opacity:0;">
                <text x="500" y="360" font-size="15" fill="#000000">V = (4/3)πR³ = (4/3)π(5√2)³</text>
                <text x="500" y="395" font-size="15" fill="#000000">= (4/3)π · 250√2</text>
                <text x="500" y="430" font-size="16" fill="#c62828" font-weight="bold">= 1000√2π / 3</text>
            </g>
        </svg>

        <div id="scene2-controls">
            <button id="scene2-btn-prev">◀ 上一步</button>
            <button id="scene2-btn-next">下一步 ▶</button>
            <button id="scene2-btn-reset">重置</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2 实现
        var currentStep = 0;
        var maxStep = 5;

        var btnPrev = document.getElementById('scene2-btn-prev');
        var btnNext = document.getElementById('scene2-btn-next');
        var btnReset = document.getElementById('scene2-btn-reset');

        function show(el) {
            if (!el) return;
            el.style.display = '';
            requestAnimationFrame(function() {
                el.style.opacity = '1';
            });
        }

        function hide(el) {
            if (!el) return;
            el.style.opacity = '0';
            setTimeout(function() {
                if (el.style.opacity === '0') {
                    el.style.display = 'none';
                }
            }, 150);
        }

        function renderStep() {
            var elements = document.querySelectorAll('#scene2-svg [data-step]');
            elements.forEach(function(el) {
                var stepFrom = parseInt(el.getAttribute('data-step'), 10);
                if (stepFrom <= currentStep) {
                    show(el);
                } else {
                    hide(el);
                }
            });

            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
        }

        function nextStep() {
            if (currentStep < maxStep) {
                currentStep++;
                renderStep();
            }
        }

        function prevStep() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        }

        function resetStep() {
            currentStep = 0;
            renderStep();
        }

        btnPrev.addEventListener('click', prevStep);
        btnNext.addEventListener('click', nextStep);
        btnReset.addEventListener('click', resetStep);

        renderStep();
    })();
    </script>
</body>
</html>
