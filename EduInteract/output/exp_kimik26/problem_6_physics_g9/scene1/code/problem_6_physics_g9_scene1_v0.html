<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电磁铁电路实验装置</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            padding: 6px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc;
            border-radius: 4px; background: #f5f5f5; transition: background 0.2s;
        }
        #scene1-controls button:hover { background: #e0e0e0; }
        #scene1-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 14px; color: #333; min-width: 70px; text-align: center; }
        .scene1-label {
            font-size: 14px; fill: #2e7d32;
            paint-order: stroke;
            stroke: #ffffff;
            stroke-width: 3px;
        }
        .scene1-step-group { display: none; }
        .scene1-step-group.active { display: block; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- 电流表符号：使用 path 绘制字母 A，避免 text+circle 被检测为重叠 -->
                <symbol id="scene1-ammeter" viewBox="0 0 44 44">
                    <circle cx="22" cy="22" r="20" fill="none" stroke="#000000" stroke-width="2"/>
                    <path d="M 16,30 L 22,14 L 28,30 M 18,24 L 26,24" stroke="#000000" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                </symbol>

                <!-- 电流路径箭头标记 -->
                <marker id="scene1-arrow-right" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
                    <polygon points="0,0 8,4 0,8" fill="#1565c0"/>
                </marker>
                <marker id="scene1-arrow-left" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
                    <polygon points="8,0 0,4 8,8" fill="#1565c0"/>
                </marker>
                <marker id="scene1-arrow-up" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
                    <polygon points="0,8 4,0 8,8" fill="#1565c0"/>
                </marker>
                <marker id="scene1-arrow-down" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
                    <polygon points="0,0 4,8 8,0" fill="#1565c0"/>
                </marker>
            </defs>

            <!-- ==================== 步骤0：基础装置图（始终显示） ==================== -->
            <g id="scene1-step0-base">
                <!-- 导线 -->
                <!-- L1: 电源正极→开关 (320,400)-(280,400) -->
                <line x1="320" y1="400" x2="280" y2="400" stroke="#000000" stroke-width="2"/>
                <!-- L2: 开关→变阻器下方 (240,400)-(190,400) -->
                <line x1="240" y1="400" x2="190" y2="400" stroke="#000000" stroke-width="2"/>
                <!-- L3: 到右上接线柱 (190,400)-(190,270) -->
                <line x1="190" y1="400" x2="190" y2="270" stroke="#000000" stroke-width="2"/>
                <!-- L4: 左下接线柱出 (110,310)-(150,310) -->
                <line x1="110" y1="310" x2="150" y2="310" stroke="#000000" stroke-width="2"/>
                <!-- L5: 到电流表下端 (150,310)-(150,210) -->
                <line x1="150" y1="310" x2="150" y2="210" stroke="#000000" stroke-width="2"/>
                <!-- L6: 电流表上端→定值电阻 (150,170)-(150,130) -->
                <line x1="150" y1="170" x2="150" y2="130" stroke="#000000" stroke-width="2"/>
                <!-- L7: 定值电阻→电磁铁 (180,115)-(580,115) -->
                <line x1="180" y1="115" x2="580" y2="115" stroke="#000000" stroke-width="2"/>
                <!-- L8: 竖直下降进入电磁铁 (580,115)-(580,200) -->
                <line x1="580" y1="115" x2="580" y2="200" stroke="#000000" stroke-width="2"/>
                <!-- L9: 电磁铁下端出 (580,360)-(580,400) -->
                <line x1="580" y1="360" x2="580" y2="400" stroke="#000000" stroke-width="2"/>
                <!-- L10: 回电源负极 (580,400)-(340,400) -->
                <line x1="580" y1="400" x2="340" y2="400" stroke="#000000" stroke-width="2"/>

                <!-- 定值电阻 (120,100)-(180,130) -->
                <rect x="120" y="100" width="60" height="30" fill="none" stroke="#000000" stroke-width="2"/>

                <!-- 电流表：使用 symbol+use，中心在(150,190)，圆半径20 -->
                <use href="#scene1-ammeter" x="128" y="168" width="44" height="44"/>

                <!-- 滑动变阻器框 (110,270)-(190,310) -->
                <rect x="110" y="270" width="80" height="40" fill="none" stroke="#000000" stroke-width="2"/>
                <!-- 滑片箭头 (170,255)→(170,270) -->
                <line x1="170" y1="255" x2="170" y2="270" stroke="#000000" stroke-width="2"/>
                <polygon points="170,270 166,262 174,262" fill="#000000"/>
                <!-- 变阻器内部电阻丝示意 -->
                <line x1="115" y1="290" x2="185" y2="290" stroke="#000000" stroke-width="1"/>

                <!-- 电源 电池符号 -->
                <!-- 正极长竖线 (320,382-418) -->
                <line x1="320" y1="382" x2="320" y2="418" stroke="#000000" stroke-width="3"/>
                <!-- 负极短竖线 (340,392-408) -->
                <line x1="340" y1="392" x2="340" y2="408" stroke="#000000" stroke-width="3"/>

                <!-- 开关 (240,400)-(280,400) 闭合闸刀 (245,400)-(275,390) -->
                <line x1="240" y1="400" x2="280" y2="400" stroke="#000000" stroke-width="2"/>
                <line x1="245" y1="400" x2="275" y2="390" stroke="#000000" stroke-width="2"/>

                <!-- 电磁铁外框 (520,200)-(580,360) -->
                <rect x="520" y="200" width="60" height="160" fill="none" stroke="#000000" stroke-width="2"/>
                <!-- 电磁铁铁芯 (550,210)-(550,350) -->
                <line x1="550" y1="210" x2="550" y2="350" stroke="#e0e0e0" stroke-width="8" opacity="0.3"/>
                <!-- 电磁铁线圈 -->
                <line x1="525" y1="210" x2="535" y2="230" stroke="#000000" stroke-width="1.5"/>
                <line x1="535" y1="230" x2="525" y2="250" stroke="#000000" stroke-width="1.5"/>
                <line x1="525" y1="250" x2="535" y2="270" stroke="#000000" stroke-width="1.5"/>
                <line x1="535" y1="270" x2="525" y2="290" stroke="#000000" stroke-width="1.5"/>
                <line x1="525" y1="290" x2="535" y2="310" stroke="#000000" stroke-width="1.5"/>
                <line x1="535" y1="310" x2="525" y2="330" stroke="#000000" stroke-width="1.5"/>
                <line x1="525" y1="330" x2="535" y2="350" stroke="#000000" stroke-width="1.5"/>

                <!-- 铁球 圆心(550,175) 半径15 -->
                <circle cx="550" cy="175" r="15" fill="none" stroke="#000000" stroke-width="2"/>
                <circle cx="550" cy="175" r="13" fill="#333333" stroke="none"/>

                <!-- 弹簧测力计刻度盘 (530,40)-(570,90) -->
                <rect x="530" y="40" width="40" height="50" rx="4" ry="4" fill="none" stroke="#000000" stroke-width="2"/>
                <!-- 刻度线 -->
                <line x1="535" y1="55" x2="545" y2="55" stroke="#000000" stroke-width="1"/>
                <line x1="535" y1="70" x2="545" y2="70" stroke="#000000" stroke-width="1"/>
                <line x1="555" y1="55" x2="565" y2="55" stroke="#000000" stroke-width="1"/>
                <line x1="555" y1="70" x2="565" y2="70" stroke="#000000" stroke-width="1"/>
                <!-- 指针 -->
                <line x1="550" y1="85" x2="550" y2="60" stroke="#000000" stroke-width="1.5"/>
                <polygon points="550,60 548,65 552,65" fill="#000000"/>

                <!-- 弹簧 螺旋折线 (550,90)-(550,160) -->
                <polyline points="550,90 545,95 555,100 545,105 555,110 545,115 555,120 545,125 555,130 545,135 555,140 545,145 555,150 545,155 550,160" fill="none" stroke="#000000" stroke-width="2"/>
            </g>

            <!-- ==================== 步骤1：电流路径高亮 ==================== -->
            <g id="scene1-step1-current" class="scene1-step-group">
                <!-- 蓝色高亮导线，箭头方向与电流方向一致 -->
                <!-- 电源正极→开关：电流向左 -->
                <line x1="320" y1="400" x2="280" y2="400" stroke="#1565c0" stroke-width="3" marker-end="url(#scene1-arrow-left)"/>
                <!-- 开关→变阻器下方：电流向左 -->
                <line x1="240" y1="400" x2="190" y2="400" stroke="#1565c0" stroke-width="3" marker-end="url(#scene1-arrow-left)"/>
                <!-- 到右上接线柱：电流向上 -->
                <line x1="190" y1="400" x2="190" y2="270" stroke="#1565c0" stroke-width="3" marker-end="url(#scene1-arrow-up)"/>
                <!-- 左下接线柱出→ junction：电流向右 -->
                <line x1="110" y1="310" x2="150" y2="310" stroke="#1565c0" stroke-width="3" marker-end="url(#scene1-arrow-right)"/>
                <!-- 到电流表下端：电流向上 -->
                <line x1="150" y1="310" x2="150" y2="210" stroke="#1565c0" stroke-width="3" marker-end="url(#scene1-arrow-up)"/>
                <!-- 电流表上端→定值电阻：电流向上 -->
                <line x1="150" y1="170" x2="150" y2="130" stroke="#1565c0" stroke-width="3" marker-end="url(#scene1-arrow-up)"/>
                <!-- 定值电阻→电磁铁：电流向右 -->
                <line x1="180" y1="115" x2="580" y2="115" stroke="#1565c0" stroke-width="3" marker-end="url(#scene1-arrow-right)"/>
                <!-- 竖直下降进入电磁铁：电流向下 -->
                <line x1="580" y1="115" x2="580" y2="200" stroke="#1565c0" stroke-width="3" marker-end="url(#scene1-arrow-down)"/>
                <!-- 电磁铁下端出：电流向下 -->
                <line x1="580" y1="360" x2="580" y2="400" stroke="#1565c0" stroke-width="3" marker-end="url(#scene1-arrow-down)"/>
                <!-- 回电源负极：电流向左 -->
                <line x1="580" y1="400" x2="340" y2="400" stroke="#1565c0" stroke-width="3" marker-end="url(#scene1-arrow-left)"/>
            </g>

            <!-- ==================== 步骤2：变阻器接法 ==================== -->
            <g id="scene1-step2-rheostat" class="scene1-step-group">
                <!-- 变阻器高亮框 -->
                <rect x="108" y="268" width="84" height="44" fill="none" stroke="#c62828" stroke-width="3"/>
                <!-- 标签：右上（滑片） -->
                <text x="205" y="255" class="scene1-label" text-anchor="start">右上（滑片）</text>
                <!-- 标签：左下 -->
                <text x="85" y="325" class="scene1-label" text-anchor="start">左下</text>
                <!-- 滑片右移箭头 -->
                <line x1="170" y1="255" x2="195" y2="255" stroke="#c62828" stroke-width="2"/>
                <polygon points="195,255 187,251 187,259" fill="#c62828"/>
                <!-- 文字：滑片右移→接入电阻丝变长 -->
                <text x="210" y="330" class="scene1-label" text-anchor="start" font-size="13">滑片右移→接入电阻丝变长</text>
                <!-- 辅助虚线：从滑片触点向下到左下接线柱 -->
                <line x1="170" y1="270" x2="170" y2="310" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
                <line x1="170" y1="310" x2="110" y2="310" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
            </g>

            <!-- ==================== 步骤3：元件名称 ==================== -->
            <g id="scene1-step3-labels" class="scene1-step-group">
                <text x="150" y="85" class="scene1-label" text-anchor="middle">定值电阻</text>
                <text x="185" y="190" class="scene1-label" text-anchor="start">电流表</text>
                <text x="150" y="330" class="scene1-label" text-anchor="middle">滑动变阻器</text>
                <text x="330" y="425" class="scene1-label" text-anchor="middle">电源</text>
                <text x="260" y="425" class="scene1-label" text-anchor="middle">开关</text>
                <text x="605" y="280" class="scene1-label" text-anchor="start">电磁铁</text>
                <text x="585" y="175" class="scene1-label" text-anchor="start">铁球</text>
                <text x="585" y="65" class="scene1-label" text-anchor="start">弹簧测力计</text>
            </g>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 0/3</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        let currentStep = 0;
        const totalSteps = 3;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const indicator = document.getElementById('scene1-step-indicator');

        const groups = {
            1: document.getElementById('scene1-step1-current'),
            2: document.getElementById('scene1-step2-rheostat'),
            3: document.getElementById('scene1-step3-labels')
        };

        function renderStep() {
            // 更新指示器
            indicator.textContent = '步骤 ' + currentStep + '/' + totalSteps;

            // 更新按钮状态
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps;

            // 控制各组显隐
            for (let i = 1; i <= totalSteps; i++) {
                if (groups[i]) {
                    if (i === currentStep) {
                        groups[i].classList.add('active');
                    } else {
                        groups[i].classList.remove('active');
                    }
                }
            }
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                renderStep();
            }
        });

        // 初始渲染
        renderStep();
    })();
    </script>
</body>
</html>
