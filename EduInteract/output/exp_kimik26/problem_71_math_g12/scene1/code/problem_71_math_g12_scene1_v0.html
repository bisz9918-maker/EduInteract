<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正六边形内接圆 - 向量夹角探索</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            padding: 6px 14px; font-size: 13px; cursor: pointer;
            border: 1px solid #888; border-radius: 4px; background: #fff;
        }
        #scene1-controls button:hover { background: #f0f0f0; }
        #scene1-panel {
            position: absolute; left: 560px; top: 40px; width: 220px; height: 360px;
            background: #f5f5f5; border: 1px solid #cccccc; border-radius: 4px;
            padding: 10px; box-sizing: border-box; font-size: 13px; z-index: 5;
        }
        #scene1-panel h4 { margin: 0 0 12px 0; font-size: 14px; }
        #scene1-panel table { width: 100%; border-collapse: collapse; font-size: 13px; }
        #scene1-panel td { padding: 3px 0; }
        #scene1-panel td:nth-child(2) { text-align: right; }
        #scene1-sorted-seq {
            margin: 12px 0 0 0;
            padding: 6px 8px; border: 1px solid #ccc; border-radius: 3px; background: #fff;
            font-size: 13px; text-align: center; letter-spacing: 1px;
        }
        #scene1-ap-hint { margin-top: 12px; color: #c62828; font-weight: bold; display: none; }
        .ap-active { border: 2px solid #c62828 !important; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" style="position:absolute; left:0; top:0;">
            <!-- 圆 O -->
            <circle id="scene1-circle-o" cx="280" cy="220" r="160" stroke="#000000" stroke-width="2" fill="none"/>
            <!-- 正六边形 -->
            <polygon id="scene1-hexagon" points="440,220 360,81.4 200,81.4 120,220 200,358.6 360,358.6" stroke="#000000" stroke-width="2" fill="none"/>
            <!-- 圆心 O -->
            <circle id="scene1-point-o" cx="280" cy="220" r="3" fill="#000000"/>
            <!-- 半径 OA1~OA6 -->
            <line id="scene1-radius-a1" x1="280" y1="220" x2="440" y2="220" stroke="#000000" stroke-width="1.5"/>
            <line id="scene1-radius-a2" x1="280" y1="220" x2="360" y2="81.4" stroke="#000000" stroke-width="1.5"/>
            <line id="scene1-radius-a3" x1="280" y1="220" x2="200" y2="81.4" stroke="#000000" stroke-width="1.5"/>
            <line id="scene1-radius-a4" x1="280" y1="220" x2="120" y2="220" stroke="#000000" stroke-width="1.5"/>
            <line id="scene1-radius-a5" x1="280" y1="220" x2="200" y2="358.6" stroke="#000000" stroke-width="1.5"/>
            <line id="scene1-radius-a6" x1="280" y1="220" x2="360" y2="358.6" stroke="#000000" stroke-width="1.5"/>
            <!-- 顶点 A1~A6 -->
            <circle id="scene1-vertex-a1" cx="440" cy="220" r="4" fill="#000000"/>
            <circle id="scene1-vertex-a2" cx="360" cy="81.4" r="4" fill="#000000"/>
            <circle id="scene1-vertex-a3" cx="200" cy="81.4" r="4" fill="#000000"/>
            <circle id="scene1-vertex-a4" cx="120" cy="220" r="4" fill="#000000"/>
            <circle id="scene1-vertex-a5" cx="200" cy="358.6" r="4" fill="#000000"/>
            <circle id="scene1-vertex-a6" cx="360" cy="358.6" r="4" fill="#000000"/>
            <!-- 扇形填充 (初始隐藏，由JS控制) -->
            <path id="scene1-sector-1" fill="#1565c0" opacity="0.1" style="display:none"/>
            <path id="scene1-sector-2" fill="#1565c0" opacity="0.1" style="display:none"/>
            <path id="scene1-sector-3" fill="#1565c0" opacity="0.1" style="display:none"/>
            <path id="scene1-sector-4" fill="#1565c0" opacity="0.1" style="display:none"/>
            <path id="scene1-sector-5" fill="#1565c0" opacity="0.1" style="display:none"/>
            <path id="scene1-sector-6" fill="#1565c0" opacity="0.1" style="display:none"/>
            <!-- 夹角弧线 (初始显示) -->
            <path id="scene1-arc-1" stroke="#1565c0" stroke-width="1.5" fill="none" opacity="0.4"/>
            <path id="scene1-arc-2" stroke="#1565c0" stroke-width="1.5" fill="none" opacity="0.4"/>
            <path id="scene1-arc-3" stroke="#1565c0" stroke-width="1.5" fill="none" opacity="0.4"/>
            <path id="scene1-arc-4" stroke="#1565c0" stroke-width="1.5" fill="none" opacity="0.4"/>
            <path id="scene1-arc-5" stroke="#1565c0" stroke-width="1.5" fill="none" opacity="0.4"/>
            <path id="scene1-arc-6" stroke="#1565c0" stroke-width="1.5" fill="none" opacity="0.4"/>
            <!-- 动向量 OP -->
            <line id="scene1-radius-op" x1="280" y1="220" x2="440" y2="220" stroke="#1565c0" stroke-width="2.5"/>
            <!-- 动点 P -->
            <circle id="scene1-point-p" cx="440" cy="220" r="6" fill="#1565c0" cursor="pointer"/>
            <!-- 标签 -->
            <text x="280" y="410" font-family="sans-serif" font-size="14" fill="#000000" text-anchor="middle">O</text>
            <text x="470" y="200" font-family="sans-serif" font-size="14" fill="#000000">A₁</text>
            <text x="375" y="40" font-family="sans-serif" font-size="14" fill="#000000">A₂</text>
            <text x="180" y="40" font-family="sans-serif" font-size="14" fill="#000000">A₃</text>
            <text x="95" y="220" font-family="sans-serif" font-size="14" fill="#000000">A₄</text>
            <text x="175" y="410" font-family="sans-serif" font-size="14" fill="#000000">A₅</text>
            <text x="380" y="415" font-family="sans-serif" font-size="14" fill="#000000">A₆</text>
            <text id="scene1-label-p" x="500" y="220" font-family="sans-serif" font-size="14" fill="#000000">P</text>
        </svg>

        <div id="scene1-panel">
            <h4>当前夹角 θᵢ</h4>
            <table>
                <tr><td>θ₁ =</td><td id="scene1-theta-1">0.0°</td></tr>
                <tr><td>θ₂ =</td><td id="scene1-theta-2">60.0°</td></tr>
                <tr><td>θ₃ =</td><td id="scene1-theta-3">120.0°</td></tr>
                <tr><td>θ₄ =</td><td id="scene1-theta-4">180.0°</td></tr>
                <tr><td>θ₅ =</td><td id="scene1-theta-5">120.0°</td></tr>
                <tr><td>θ₆ =</td><td id="scene1-theta-6">60.0°</td></tr>
            </table>
            <hr style="border-color:#cccccc; margin:12px 0;">
            <h4>排序后数列</h4>
            <div id="scene1-sorted-seq">0, 60, 60, 120, 120, 180</div>
            <div id="scene1-ap-hint">✓ 构成等差数列</div>
        </div>

        <div id="scene1-controls">
            <button id="scene1-btn-align-a1">对齐A₁</button>
            <button id="scene1-btn-align-15">对齐15°</button>
            <button id="scene1-btn-align-30">对齐30°</button>
            <button id="scene1-btn-toggle-arcs">隐藏弧线</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        const CX = 280, CY = 220, R = 160, ARC_R = 50;
        const LABEL_R = 225; // P标签半径，确保在圆外
        const vertexAngles = [0, 60, 120, 180, 240, 300];
        const vertexCoords = vertexAngles.map(a => ({
            x: CX + R * Math.cos(a * Math.PI / 180),
            y: CY - R * Math.sin(a * Math.PI / 180)
        }));

        let state = { phi: 0, showArcs: true, isDragging: false, animating: false };

        const els = {
            op: document.getElementById('scene1-radius-op'),
            p: document.getElementById('scene1-point-p'),
            labelP: document.getElementById('scene1-label-p'),
            arcs: [1,2,3,4,5,6].map(i => document.getElementById('scene1-arc-' + i)),
            sectors: [1,2,3,4,5,6].map(i => document.getElementById('scene1-sector-' + i)),
            thetas: [1,2,3,4,5,6].map(i => document.getElementById('scene1-theta-' + i)),
            sortedSeq: document.getElementById('scene1-sorted-seq'),
            apHint: document.getElementById('scene1-ap-hint'),
            btnToggle: document.getElementById('scene1-btn-toggle-arcs'),
            svg: document.getElementById('scene1-svg')
        };

        function toRad(deg) { return deg * Math.PI / 180; }
        function toDeg(rad) { return rad * 180 / Math.PI; }
        function normAngle(deg) {
            let a = deg % 360;
            if (a < 0) a += 360;
            return a;
        }
        function angleDiff(a, b) {
            let d = Math.abs(normAngle(a) - normAngle(b));
            if (d > 180) d = 360 - d;
            return d;
        }
        function show(el) { el.style.display = ''; el.style.opacity = '1'; }
        function hide(el) { el.style.display = 'none'; }

        function render() {
            const phi = state.phi;
            const phiRad = toRad(phi);
            const px = CX + R * Math.cos(phiRad);
            const py = CY - R * Math.sin(phiRad);

            els.op.setAttribute('x2', px);
            els.op.setAttribute('y2', py);
            els.p.setAttribute('cx', px);
            els.p.setAttribute('cy', py);

            // P标签放在圆外，避免与圆/多边形重叠
            const lx = CX + LABEL_R * Math.cos(phiRad);
            const ly = CY - LABEL_R * Math.sin(phiRad);
            els.labelP.setAttribute('x', lx);
            els.labelP.setAttribute('y', ly);

            const thetas = vertexAngles.map(va => angleDiff(phi, va));
            const sorted = thetas.slice().sort((a, b) => a - b);

            // 更新 theta 显示
            for (let i = 0; i < 6; i++) {
                els.thetas[i].textContent = thetas[i].toFixed(1) + '°';
            }

            // 更新排序数列（单文本，避免span拥挤）
            els.sortedSeq.textContent = sorted.map(v => v.toFixed(0)).join(', ');

            // 等差数列检测
            let isAP = false;
            if (sorted.length === 6) {
                const diffs = [];
                for (let i = 1; i < 6; i++) diffs.push(sorted[i] - sorted[i - 1]);
                const firstDiff = diffs[0];
                isAP = diffs.every(d => Math.abs(d - firstDiff) < 0.5);
            }

            if (isAP) {
                els.sortedSeq.classList.add('ap-active');
                els.apHint.style.display = 'block';
            } else {
                els.sortedSeq.classList.remove('ap-active');
                els.apHint.style.display = 'none';
            }

            // 绘制弧线和扇形
            for (let i = 0; i < 6; i++) {
                const va = vertexAngles[i];
                const theta = thetas[i];
                if (theta < 1 || !state.showArcs) {
                    hide(els.arcs[i]);
                    hide(els.sectors[i]);
                    continue;
                }
                show(els.arcs[i]);
                show(els.sectors[i]);

                const startAngle = toRad(va);
                const endAngle = toRad(phi);
                const sx = CX + ARC_R * Math.cos(startAngle);
                const sy = CY - ARC_R * Math.sin(startAngle);
                const ex = CX + ARC_R * Math.cos(endAngle);
                const ey = CY - ARC_R * Math.sin(endAngle);

                // 计算 sweep-flag：取较小夹角方向
                let diff = normAngle(phi - va);
                if (diff > 180) diff -= 360;
                const sweep = diff > 0 ? 1 : 0;
                const largeArc = Math.abs(diff) > 180 ? 1 : 0;

                const dArc = `M ${sx} ${sy} A ${ARC_R} ${ARC_R} 0 ${largeArc} ${sweep} ${ex} ${ey}`;
                els.arcs[i].setAttribute('d', dArc);

                const dSector = `M ${CX} ${CY} L ${sx} ${sy} A ${ARC_R} ${ARC_R} 0 ${largeArc} ${sweep} ${ex} ${ey} Z`;
                els.sectors[i].setAttribute('d', dSector);
            }
        }

        // 拖拽
        els.p.addEventListener('mousedown', function(e) {
            state.isDragging = true;
            e.preventDefault();
        });
        els.svg.addEventListener('mousemove', function(e) {
            if (!state.isDragging) return;
            const rect = els.svg.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;
            let angle = toDeg(Math.atan2(CY - my, mx - CX));
            state.phi = normAngle(angle);
            render();
        });
        window.addEventListener('mouseup', function() {
            state.isDragging = false;
        });

        // 动画
        function animateTo(targetPhi) {
            if (state.animating) return;
            state.animating = true;
            const startPhi = state.phi;
            let diff = normAngle(targetPhi - startPhi);
            if (diff > 180) diff -= 360;
            const duration = 400;
            const t0 = performance.now();

            function frame(now) {
                const p = Math.min((now - t0) / duration, 1);
                state.phi = normAngle(startPhi + diff * p);
                render();
                if (p < 1) {
                    requestAnimationFrame(frame);
                } else {
                    state.animating = false;
                }
            }
            requestAnimationFrame(frame);
        }

        document.getElementById('scene1-btn-align-a1').addEventListener('click', function() { animateTo(0); });
        document.getElementById('scene1-btn-align-15').addEventListener('click', function() { animateTo(15); });
        document.getElementById('scene1-btn-align-30').addEventListener('click', function() { animateTo(30); });

        els.btnToggle.addEventListener('click', function() {
            state.showArcs = !state.showArcs;
            els.btnToggle.textContent = state.showArcs ? '隐藏弧线' : '显示弧线';
            render();
        });

        // 初始渲染
        render();
    })();
    </script>
</body>
</html>
