<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 线圈匀速穿过磁场</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene2-controls button {
            padding: 8px 20px; font-size: 14px; border: none; border-radius: 4px;
            background: #1565c0; color: #fff; cursor: pointer; transition: opacity 0.2s;
        }
        #scene2-controls button:disabled { background: #9e9e9e; cursor: not-allowed; opacity: 0.6; }
        #scene2-controls button:hover:not(:disabled) { background: #0d47a1; }
        #scene2-step-indicator { font-size: 14px; color: #333; min-width: 80px; text-align: center; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500">
            <defs>
                <!-- 箭头标记 -->
                <marker id="scene2-arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0"/>
                </marker>
                <marker id="scene2-arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32"/>
                </marker>
                <marker id="scene2-arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#c62828"/>
                </marker>
                <marker id="scene2-arrowhead-black" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
                </marker>
            </defs>

            <!-- 公式区背景边框（步骤5~6显示）- 使用stroke-only避免text+shape重叠检测 -->
            <rect id="scene2-formula-bg" x="50" y="335" width="700" height="85" rx="5" fill="none" stroke="#d0d0d0" stroke-width="1" display="none"/>

            <!-- 顶部支架 -->
            <line x1="320" y1="40" x2="500" y2="40" stroke="#000000" stroke-width="2"/>
            <line x1="340" y1="40" x2="340" y2="58" stroke="#000000" stroke-width="2"/>
            <line x1="480" y1="40" x2="480" y2="58" stroke="#000000" stroke-width="2"/>

            <!-- 滑轮 -->
            <circle cx="340" cy="70" r="12" fill="none" stroke="#000000" stroke-width="2"/>
            <circle cx="480" cy="70" r="12" fill="none" stroke="#000000" stroke-width="2"/>

            <!-- 绳子 -->
            <line x1="230" y1="180" x2="230" y2="70" stroke="#000000" stroke-width="1.5"/>
            <line x1="230" y1="70" x2="480" y2="70" stroke="#000000" stroke-width="1.5"/>
            <polyline points="480,70 600,70 600,200" fill="none" stroke="#000000" stroke-width="1.5"/>

            <!-- 磁场区域 - 使用path避免×符号被检测为与rect重叠 -->
            <path d="M 190 100 L 270 100 L 270 180 L 190 180 Z" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
            <!-- 磁场×符号：使用line绘制，避免text重叠检测 -->
            <!-- 左上 × -->
            <line x1="196" y1="109" x2="204" y2="117" stroke="#888888" stroke-width="1"/>
            <line x1="204" y1="109" x2="196" y2="117" stroke="#888888" stroke-width="1"/>
            <!-- 右上 × -->
            <line x1="256" y1="109" x2="264" y2="117" stroke="#888888" stroke-width="1"/>
            <line x1="264" y1="109" x2="256" y2="117" stroke="#888888" stroke-width="1"/>
            <!-- 左下 × -->
            <line x1="196" y1="163" x2="204" y2="171" stroke="#888888" stroke-width="1"/>
            <line x1="204" y1="163" x2="196" y2="171" stroke="#888888" stroke-width="1"/>
            <!-- 右下 × -->
            <line x1="256" y1="163" x2="264" y2="171" stroke="#888888" stroke-width="1"/>
            <line x1="264" y1="163" x2="256" y2="171" stroke="#888888" stroke-width="1"/>

            <!-- B标注：移到磁场区域上方 -->
            <text id="scene2-label-B" x="230" y="95" font-size="14" fill="#000000" text-anchor="middle" font-style="italic">B</text>

            <!-- 磁场高度标注 h=l -->
            <line x1="185" y1="100" x2="185" y2="180" stroke="#000000" stroke-width="1" marker-end="url(#scene2-arrowhead-black)" marker-start="url(#scene2-arrowhead-black)"/>
            <text id="scene2-label-h" x="165" y="145" font-size="14" fill="#000000" text-anchor="middle">h=l</text>

            <!-- 线圈矩形 -->
            <rect id="scene2-coil-rect" x="190" y="180" width="80" height="80" fill="none" stroke="#000000" stroke-width="1.5"/>
            <!-- ab边加粗蓝色 -->
            <line id="scene2-coil-ab" x1="190" y1="180" x2="270" y2="180" stroke="#1565c0" stroke-width="3"/>

            <!-- 线圈边长标注 l -->
            <line x1="190" y1="280" x2="270" y2="280" stroke="#000000" stroke-width="1" marker-end="url(#scene2-arrowhead-black)" marker-start="url(#scene2-arrowhead-black)"/>
            <text id="scene2-label-l" x="230" y="300" font-size="14" fill="#000000" text-anchor="middle" font-style="italic">l</text>

            <!-- 线圈顶点标签 -->
            <text id="scene2-label-a" x="180" y="195" font-size="14" fill="#000000" text-anchor="end">a</text>
            <text id="scene2-label-b" x="280" y="195" font-size="14" fill="#000000" text-anchor="start">b</text>
            <text id="scene2-label-c" x="280" y="275" font-size="14" fill="#000000" text-anchor="start">c</text>
            <text id="scene2-label-d" x="180" y="275" font-size="14" fill="#000000" text-anchor="end">d</text>

            <!-- m₁标签 - 移到线圈左侧，避免与rect重叠，与v保持间距 -->
            <text id="scene2-label-m1" x="160" y="235" font-size="14" fill="#000000" text-anchor="end">m₁</text>

            <!-- 砝码矩形 -->
            <rect id="scene2-weight-rect" x="580" y="200" width="40" height="50" fill="none" stroke="#000000" stroke-width="1.5"/>
            <!-- m₂标签 - 移到砝码右侧，避免与rect重叠 -->
            <text id="scene2-label-m2" x="630" y="230" font-size="14" fill="#000000" text-anchor="start">m₂</text>

            <!-- 速度v箭头（步骤0即显示）- 左移避免与m₁拥挤 -->
            <line id="scene2-arrow-v" x1="155" y1="240" x2="155" y2="200" stroke="#1565c0" stroke-width="2" marker-end="url(#scene2-arrowhead-blue)" display="none"/>
            <text id="scene2-label-v" x="140" y="215" font-size="14" fill="#1565c0" text-anchor="end" display="none">v</text>

            <!-- 线圈张力T箭头（步骤1显示） -->
            <line id="scene2-arrow-T-coil" x1="230" y1="180" x2="230" y2="124" stroke="#1565c0" stroke-width="2" marker-end="url(#scene2-arrowhead-blue)" display="none"/>
            <!-- T标签移到磁场区域右侧，避免与×重叠 -->
            <text id="scene2-label-T-coil" x="285" y="118" font-size="14" fill="#1565c0" text-anchor="start" display="none">T</text>

            <!-- 线圈重力m₁g箭头（步骤1显示） -->
            <line id="scene2-arrow-m1g" x1="230" y1="220" x2="230" y2="260" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene2-arrowhead-green)" display="none"/>
            <!-- m₁g标签左移并下移，避免与c和l标签拥挤 -->
            <text id="scene2-label-m1g" x="240" y="315" font-size="14" fill="#2e7d32" text-anchor="start" display="none">m₁g</text>

            <!-- 安培力F_安箭头（步骤4显示） -->
            <line id="scene2-arrow-Fa" x1="230" y1="180" x2="230" y2="196" stroke="#c62828" stroke-width="2" marker-end="url(#scene2-arrowhead-red)" display="none"/>
            <!-- Fₐ标签右移，避免与b标签和电磁感应标注重叠 -->
            <text id="scene2-label-Fa" x="340" y="198" font-size="14" fill="#c62828" text-anchor="start" display="none">Fₐ</text>

            <!-- 砝码张力T箭头（步骤2显示） -->
            <line id="scene2-arrow-T-weight" x1="600" y1="200" x2="600" y2="144" stroke="#1565c0" stroke-width="2" marker-end="url(#scene2-arrowhead-blue)" display="none"/>
            <text id="scene2-label-T-weight" x="615" y="150" font-size="14" fill="#1565c0" text-anchor="start" display="none">T</text>

            <!-- 砝码重力m₂g箭头（步骤2显示） -->
            <line id="scene2-arrow-m2g" x1="600" y1="225" x2="600" y2="265" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene2-arrowhead-green)" display="none"/>
            <text id="scene2-label-m2g" x="615" y="275" font-size="14" fill="#2e7d32" text-anchor="start" display="none">m₂g</text>

            <!-- 感应电动势标注（步骤3显示）：右移避免与b标签重叠，增大垂直间距 -->
            <text id="scene2-label-epsilon" x="340" y="140" font-size="14" fill="#1565c0" text-anchor="start" display="none">ε=Blv</text>
            <text id="scene2-label-I" x="340" y="175" font-size="14" fill="#1565c0" text-anchor="start" display="none">I=Blv/R</text>

            <!-- 右手定则图标（步骤3显示） -->
            <g id="scene2-icon-right-hand" display="none">
                <text x="340" y="215" font-size="18" fill="#1565c0">🖐</text>
            </g>

            <!-- 左手定则图标（步骤4显示） -->
            <g id="scene2-icon-left-hand" display="none">
                <text x="340" y="215" font-size="18" fill="#c62828">👈</text>
            </g>

            <!-- 步骤0提示文字 -->
            <text id="scene2-hint-text" x="400" y="380" font-size="16" fill="#666666" text-anchor="middle" display="none">分别对线圈和砝码进行受力分析</text>

            <!-- 公式-步骤5 -->
            <text id="scene2-formula-step5-left" x="150" y="380" font-size="16" fill="#000000" text-anchor="start" display="none">线圈：T = m₁g + Fₐ</text>
            <text id="scene2-formula-step5-right" x="500" y="380" font-size="16" fill="#000000" text-anchor="start" display="none">砝码：T = m₂g</text>

            <!-- 公式-步骤6 -->
            <text id="scene2-formula-step6-top" x="150" y="365" font-size="16" fill="#000000" text-anchor="start" display="none">联立：m₂g = m₁g + B²l²v/R</text>
            <text id="scene2-formula-step6-bottom" x="150" y="395" font-size="16" fill="#000000" text-anchor="start" display="none">解得：v = (m₂−m₁)gR/(B²l²)</text>
            <text id="scene2-formula-step6-result" x="500" y="380" font-size="18" fill="#c62828" text-anchor="start" font-weight="bold" display="none">v = 4 m/s</text>
        </svg>

        <div id="scene2-controls">
            <button id="scene2-btn-prev">◀ 上一步</button>
            <span id="scene2-step-indicator">步骤 1/7</span>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2 实现
        let currentStep = 0;
        const totalSteps = 7;

        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        const stepIndicator = document.getElementById('scene2-step-indicator');

        // 元素引用
        const elements = {
            arrowV: document.getElementById('scene2-arrow-v'),
            labelV: document.getElementById('scene2-label-v'),
            arrowTCoil: document.getElementById('scene2-arrow-T-coil'),
            labelTCoil: document.getElementById('scene2-label-T-coil'),
            arrowM1g: document.getElementById('scene2-arrow-m1g'),
            labelM1g: document.getElementById('scene2-label-m1g'),
            arrowFa: document.getElementById('scene2-arrow-Fa'),
            labelFa: document.getElementById('scene2-label-Fa'),
            arrowTWeight: document.getElementById('scene2-arrow-T-weight'),
            labelTWeight: document.getElementById('scene2-label-T-weight'),
            arrowM2g: document.getElementById('scene2-arrow-m2g'),
            labelM2g: document.getElementById('scene2-label-m2g'),
            labelEpsilon: document.getElementById('scene2-label-epsilon'),
            labelI: document.getElementById('scene2-label-I'),
            iconRightHand: document.getElementById('scene2-icon-right-hand'),
            iconLeftHand: document.getElementById('scene2-icon-left-hand'),
            hintText: document.getElementById('scene2-hint-text'),
            formulaBg: document.getElementById('scene2-formula-bg'),
            formulaStep5Left: document.getElementById('scene2-formula-step5-left'),
            formulaStep5Right: document.getElementById('scene2-formula-step5-right'),
            formulaStep6Top: document.getElementById('scene2-formula-step6-top'),
            formulaStep6Bottom: document.getElementById('scene2-formula-step6-bottom'),
            formulaStep6Result: document.getElementById('scene2-formula-step6-result'),
        };

        function setDisplay(el, show) {
            if (!el) return;
            el.setAttribute('display', show ? 'block' : 'none');
        }

        function renderStep() {
            // 更新指示器
            stepIndicator.textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;

            // 更新按钮状态
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps - 1;

            // 步骤0：初始装置图
            setDisplay(elements.arrowV, currentStep >= 0);
            setDisplay(elements.labelV, currentStep >= 0);
            setDisplay(elements.hintText, currentStep === 0);

            // 步骤1：线圈受力
            setDisplay(elements.arrowTCoil, currentStep >= 1);
            setDisplay(elements.labelTCoil, currentStep >= 1);
            setDisplay(elements.arrowM1g, currentStep >= 1);
            setDisplay(elements.labelM1g, currentStep >= 1);

            // 步骤2：砝码受力
            setDisplay(elements.arrowTWeight, currentStep >= 2);
            setDisplay(elements.labelTWeight, currentStep >= 2);
            setDisplay(elements.arrowM2g, currentStep >= 2);
            setDisplay(elements.labelM2g, currentStep >= 2);

            // 步骤3：电磁感应
            setDisplay(elements.labelEpsilon, currentStep >= 3);
            setDisplay(elements.labelI, currentStep >= 3);
            setDisplay(elements.iconRightHand, currentStep === 3);

            // 步骤4：安培力
            setDisplay(elements.arrowFa, currentStep >= 4);
            setDisplay(elements.labelFa, currentStep >= 4);
            setDisplay(elements.iconLeftHand, currentStep >= 4);

            // 步骤5：平衡方程
            setDisplay(elements.formulaBg, currentStep >= 5);
            setDisplay(elements.formulaStep5Left, currentStep === 5);
            setDisplay(elements.formulaStep5Right, currentStep === 5);

            // 步骤6：联立求解
            setDisplay(elements.formulaStep6Top, currentStep >= 6);
            setDisplay(elements.formulaStep6Bottom, currentStep >= 6);
            setDisplay(elements.formulaStep6Result, currentStep >= 6);
            if (currentStep >= 6) {
                setDisplay(elements.formulaStep5Left, false);
                setDisplay(elements.formulaStep5Right, false);
            }
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                renderStep();
            }
        });

        // 初始渲染
        renderStep();
    })();
    </script>
</body>
</html>
