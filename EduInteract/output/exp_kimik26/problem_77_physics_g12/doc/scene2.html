<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 带电粒子在方波电场中的偏转</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene2-slider { width: 500px; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 装置图区域 -->
            <!-- A板 -->
            <line id="scene2-plate-a" x1="50" y1="70" x2="450" y2="70" stroke="#1565c0" stroke-width="3"/>
            <!-- B板 -->
            <line id="scene2-plate-b" x1="50" y1="330" x2="450" y2="330" stroke="#c62828" stroke-width="3"/>
            <!-- 靶MN -->
            <line id="scene2-target" x1="450" y1="70" x2="450" y2="330" stroke="#000000" stroke-width="4"/>
            <!-- OO'装置线 -->
            <line id="scene2-center-line" x1="50" y1="200" x2="450" y2="200" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
            <!-- O点 -->
            <circle id="scene2-point-o" cx="50" cy="200" r="4" fill="#000000"/>
            <!-- O'点 -->
            <circle id="scene2-point-op" cx="450" cy="200" r="4" fill="#2e7d32"/>
            <!-- 参考轨迹1 (t0=0) -->
            <path id="scene2-trajectory-ref1" fill="none" stroke="#888888" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>
            <!-- 参考轨迹2 (t0=2T/3) -->
            <path id="scene2-trajectory-ref2" fill="none" stroke="#888888" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>
            <!-- 当前轨迹 -->
            <path id="scene2-trajectory-current" fill="none" stroke="#c62828" stroke-width="2"/>
            <!-- 击中点 -->
            <circle id="scene2-hit-point" r="5" fill="#c62828" stroke="#000000" stroke-width="1"/>

            <!-- 装置图标签 -->
            <text id="scene2-label-a" x="38" y="75" font-size="14" fill="#000000" text-anchor="end">A</text>
            <text id="scene2-label-b" x="38" y="335" font-size="14" fill="#000000" text-anchor="end">B</text>
            <text id="scene2-label-o" x="38" y="205" font-size="14" fill="#000000" text-anchor="end">O</text>
            <text id="scene2-label-op" x="465" y="205" font-size="14" fill="#000000" text-anchor="start">O′</text>
            <text id="scene2-label-m" x="470" y="65" font-size="14" fill="#000000" text-anchor="start">M</text>
            <text id="scene2-label-n" x="470" y="340" font-size="14" fill="#000000" text-anchor="start">N</text>

            <!-- v-t图区域 -->
            <!-- v-t外框 -->
            <rect id="scene2-vt-frame" x="490" y="30" width="290" height="175" fill="none" stroke="#cccccc" stroke-width="1"/>
            <!-- v-t横轴 -->
            <line id="scene2-vt-axis-x" x1="520" y1="205" x2="760" y2="205" stroke="#000000" stroke-width="1"/>
            <!-- v-t纵轴 -->
            <line id="scene2-vt-axis-y" x1="520" y1="45" x2="520" y2="205" stroke="#000000" stroke-width="1"/>
            <!-- v-t 0线 -->
            <line id="scene2-vt-zero" x1="520" y1="145" x2="760" y2="145" stroke="#2e7d32" stroke-width="1" stroke-dasharray="4,4"/>
            <!-- v-t末速线 -->
            <line id="scene2-vt-final" x1="520" y1="185" x2="760" y2="185" stroke="#2e7d32" stroke-width="1" stroke-dasharray="4,4"/>
            <!-- v-t参考曲线1 -->
            <path id="scene2-vt-ref1" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>
            <!-- v-t参考曲线2 -->
            <path id="scene2-vt-ref2" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>
            <!-- v-t当前填充 -->
            <path id="scene2-vt-fill" fill="#c62828" opacity="0.15"/>
            <!-- v-t当前曲线 -->
            <path id="scene2-vt-curve" fill="none" stroke="#c62828" stroke-width="2"/>
            <!-- v-t标签 -->
            <text id="scene2-vt-label-t" x="775" y="210" font-size="12" fill="#000000" text-anchor="start">t</text>
            <text id="scene2-vt-label-vy" x="470" y="50" font-size="12" fill="#000000" text-anchor="end">v_y</text>
            <text id="scene2-vt-label-final" x="525" y="38" font-size="11" fill="#2e7d32" text-anchor="start">v_y(T)</text>
            <!-- v-t刻度 -->
            <text x="520" y="220" font-size="11" fill="#000000" text-anchor="middle">0</text>
            <text x="600" y="220" font-size="11" fill="#000000" text-anchor="middle">T/3</text>
            <text x="680" y="220" font-size="11" fill="#000000" text-anchor="middle">2T/3</text>
            <text x="760" y="220" font-size="11" fill="#000000" text-anchor="middle">T</text>
            <!-- v-t刻度线 -->
            <line x1="600" y1="205" x2="600" y2="210" stroke="#000000" stroke-width="1"/>
            <line x1="680" y1="205" x2="680" y2="210" stroke="#000000" stroke-width="1"/>
            <line x1="760" y1="205" x2="760" y2="210" stroke="#000000" stroke-width="1"/>

            <!-- y-t图区域 -->
            <!-- y-t外框 -->
            <rect id="scene2-yt-frame" x="490" y="250" width="290" height="175" fill="none" stroke="#cccccc" stroke-width="1"/>
            <!-- y-t横轴 -->
            <line id="scene2-yt-axis-x" x1="520" y1="425" x2="760" y2="425" stroke="#000000" stroke-width="1"/>
            <!-- y-t纵轴 -->
            <line id="scene2-yt-axis-y" x1="520" y1="265" x2="520" y2="425" stroke="#000000" stroke-width="1"/>
            <!-- y-t 0线 -->
            <line id="scene2-yt-zero" x1="520" y1="345" x2="760" y2="345" stroke="#2e7d32" stroke-width="1" stroke-dasharray="4,4"/>
            <!-- y-t参考曲线1 -->
            <path id="scene2-yt-ref1" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>
            <!-- y-t参考曲线2 -->
            <path id="scene2-yt-ref2" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>
            <!-- y-t当前曲线 -->
            <path id="scene2-yt-curve" fill="none" stroke="#c62828" stroke-width="2"/>
            <!-- y-t末位移标签 -->
            <text id="scene2-yt-label-yt" x="700" y="240" font-size="11" fill="#c62828" text-anchor="middle">y(T)</text>
            <!-- y-t标签 -->
            <text id="scene2-yt-label-t" x="775" y="430" font-size="12" fill="#000000" text-anchor="start">t</text>
            <text id="scene2-yt-label-y" x="470" y="270" font-size="12" fill="#000000" text-anchor="end">y</text>
            <!-- y-t刻度 -->
            <text x="520" y="440" font-size="11" fill="#000000" text-anchor="middle">0</text>
            <text x="600" y="440" font-size="11" fill="#000000" text-anchor="middle">T/3</text>
            <text x="680" y="440" font-size="11" fill="#000000" text-anchor="middle">2T/3</text>
            <text x="760" y="440" font-size="11" fill="#000000" text-anchor="middle">T</text>
            <!-- y-t刻度线 -->
            <line x1="600" y1="425" x2="600" y2="430" stroke="#000000" stroke-width="1"/>
            <line x1="680" y1="425" x2="680" y2="430" stroke="#000000" stroke-width="1"/>
            <line x1="760" y1="425" x2="760" y2="430" stroke="#000000" stroke-width="1"/>

            <!-- 滑块轨道 -->
            <line id="scene2-slider-track" x1="150" y1="470" x2="650" y2="470" stroke="#cccccc" stroke-width="4" stroke-linecap="round"/>
            <!-- 滑块刻度 -->
            <text x="155" y="460" font-size="11" fill="#000000" text-anchor="middle">0</text>
            <text x="317" y="460" font-size="11" fill="#000000" text-anchor="middle">T/3</text>
            <text x="483" y="460" font-size="11" fill="#000000" text-anchor="middle">2T/3</text>
            <text x="645" y="460" font-size="11" fill="#000000" text-anchor="middle">T</text>
            <!-- 滑块刻度线 -->
            <line x1="150" y1="468" x2="150" y2="472" stroke="#888888" stroke-width="2"/>
            <line x1="317" y1="468" x2="317" y2="472" stroke="#888888" stroke-width="2"/>
            <line x1="483" y1="468" x2="483" y2="472" stroke="#888888" stroke-width="2"/>
            <line x1="650" y1="468" x2="650" y2="472" stroke="#888888" stroke-width="2"/>
            <!-- 当前值显示 -->
            <text id="scene2-slider-value" x="400" y="445" font-size="14" fill="#333333" text-anchor="middle" font-weight="bold">t₀ = 0.00T</text>
            <!-- 滑块指针 -->
            <circle id="scene2-slider-thumb" cx="150" cy="470" r="8" fill="#2e7d32" stroke="#ffffff" stroke-width="2"/>
        </svg>

        <div id="scene2-controls">
            <input type="range" id="scene2-slider" min="0" max="1000" value="0" step="1">
        </div>
    </div>

    <script>
    (function() {
        // Scene 2 实现
        // 物理参数
        const T = 1.0; // 归一化周期
        const k = 0.8; // 归一化参数 k = q*U0*T^2/(m*d^2)
        const d = 260; // 板间距（像素）
        const a0 = k * d / (T * T); // 加速度幅值（像素/时间^2）

        // 坐标映射参数
        const deviceX0 = 50, deviceX1 = 450; // 装置图水平范围
        const deviceY0 = 200; // 中点y坐标
        const vtX0 = 520, vtX1 = 760; // v-t图水平范围
        const vtY0 = 145; // v-t图0线
        const vtScaleV = 120 / (a0 * T); // v-t图速度到像素缩放
        const vtFinalY = 185; // 末速线y坐标 (v_y = -a0*T/3)
        const ytX0 = 520, ytX1 = 760; // y-t图水平范围
        const ytY0 = 345; // y-t图0线
        const ytScaleY = 260 / d; // y-t图位移到像素缩放

        // DOM元素
        const slider = document.getElementById('scene2-slider');
        const sliderThumb = document.getElementById('scene2-slider-thumb');
        const sliderValue = document.getElementById('scene2-slider-value');
        const trajCurrent = document.getElementById('scene2-trajectory-current');
        const trajRef1 = document.getElementById('scene2-trajectory-ref1');
        const trajRef2 = document.getElementById('scene2-trajectory-ref2');
        const hitPoint = document.getElementById('scene2-hit-point');
        const vtCurve = document.getElementById('scene2-vt-curve');
        const vtFill = document.getElementById('scene2-vt-fill');
        const vtRef1 = document.getElementById('scene2-vt-ref1');
        const vtRef2 = document.getElementById('scene2-vt-ref2');
        const ytCurve = document.getElementById('scene2-yt-curve');
        const ytRef1 = document.getElementById('scene2-yt-ref1');
        const ytRef2 = document.getElementById('scene2-yt-ref2');
        const ytLabelYt = document.getElementById('scene2-yt-label-yt');

        // 获取加速度方向
        function getAcc(t0, tau) {
            const phase = (t0 + tau) % T;
            return phase < 2 * T / 3 ? -a0 : a0;
        }

        // 计算轨迹、v-t、y-t数据
        function computePhysics(t0) {
            const n = 120; // 采样点数
            const dt = T / n;
            const trajPoints = [];
            const vtPoints = [];
            const ytPoints = [];
            let vy = 0, y = 0;

            for (let i = 0; i <= n; i++) {
                const tau = i * dt;
                const x = deviceX0 + (deviceX1 - deviceX0) * (tau / T);
                const ySvg = deviceY0 - y * ytScaleY;
                trajPoints.push({x, y: ySvg});

                const vtX = vtX0 + (vtX1 - vtX0) * (tau / T);
                const vtY = vtY0 - vy * vtScaleV;
                vtPoints.push({x: vtX, y: vtY});

                const ytX = ytX0 + (ytX1 - ytX0) * (tau / T);
                const ytY = ytY0 - y * ytScaleY;
                ytPoints.push({x: ytX, y: ytY});

                if (i < n) {
                    const a = getAcc(t0, tau + dt / 2);
                    vy += a * dt;
                    y += vy * dt;
                }
            }

            return { trajPoints, vtPoints, ytPoints, vyFinal: vy, yFinal: y };
        }

        // 生成path d属性
        function pathD(points) {
            if (points.length === 0) return '';
            let d = 'M ' + points[0].x.toFixed(1) + ',' + points[0].y.toFixed(1);
            for (let i = 1; i < points.length; i++) {
                d += ' L ' + points[i].x.toFixed(1) + ',' + points[i].y.toFixed(1);
            }
            return d;
        }

        // 生成v-t填充区域path
        function vtFillD(vtPoints) {
            if (vtPoints.length === 0) return '';
            const yAxis = 205; // 横轴位置
            let d = 'M ' + vtPoints[0].x.toFixed(1) + ',' + yAxis.toFixed(1);
            for (let i = 0; i < vtPoints.length; i++) {
                d += ' L ' + vtPoints[i].x.toFixed(1) + ',' + vtPoints[i].y.toFixed(1);
            }
            d += ' L ' + vtPoints[vtPoints.length - 1].x.toFixed(1) + ',' + yAxis.toFixed(1) + ' Z';
            return d;
        }

        // 更新场景
        function updateScene() {
            const ratio = parseInt(slider.value) / 1000;
            const t0 = ratio * T;

            // 更新滑块指针
            const thumbX = 150 + ratio * 500;
            sliderThumb.setAttribute('cx', thumbX);
            sliderValue.textContent = 't₀ = ' + ratio.toFixed(2) + 'T';

            // 计算当前状态
            const current = computePhysics(t0);

            // 更新装置轨迹
            trajCurrent.setAttribute('d', pathD(current.trajPoints));

            // 更新击中点
            const lastTraj = current.trajPoints[current.trajPoints.length - 1];
            hitPoint.setAttribute('cx', lastTraj.x);
            hitPoint.setAttribute('cy', lastTraj.y);

            // 更新v-t图
            vtCurve.setAttribute('d', pathD(current.vtPoints));
            vtFill.setAttribute('d', vtFillD(current.vtPoints));

            // 更新y-t图
            ytCurve.setAttribute('d', pathD(current.ytPoints));

            // 更新y(T)标签位置 - 放在y-t图上方固定位置
            const lastYt = current.ytPoints[current.ytPoints.length - 1];
            ytLabelYt.setAttribute('x', lastYt.x);
            ytLabelYt.setAttribute('y', 240);
        }

        // 初始化参考轨迹
        function initRefTrajectories() {
            const ref1 = computePhysics(0);
            const ref2 = computePhysics(2 * T / 3);

            trajRef1.setAttribute('d', pathD(ref1.trajPoints));
            trajRef2.setAttribute('d', pathD(ref2.trajPoints));
            vtRef1.setAttribute('d', pathD(ref1.vtPoints));
            vtRef2.setAttribute('d', pathD(ref2.vtPoints));
            ytRef1.setAttribute('d', pathD(ref1.ytPoints));
            ytRef2.setAttribute('d', pathD(ref2.ytPoints));
        }

        // 事件绑定
        slider.addEventListener('input', updateScene);

        // 初始化
        initRefTrajectories();
        updateScene();
    })();
    </script>
</body>
</html>
