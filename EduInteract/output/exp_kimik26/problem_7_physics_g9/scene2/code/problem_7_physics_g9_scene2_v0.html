<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scene 2 - 平衡方程推导与选项验证</title>
<style>
body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
#scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
#scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
#scene2-controls button { width: 90px; height: 30px; border-radius: 6px; border: 1px solid #888888; background: #f5f5f5; font-size: 14px; cursor: pointer; font-family: inherit; }
#scene2-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
#scene2-step-indicator { font-size: 14px; color: #333; width: 70px; text-align: center; }
</style>
</head>
<body>
<div id="scene2-container">
<svg width="800" height="500" viewBox="0 0 800 500">
  <!-- 场景标题 -->
  <text x="400" y="42" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000">平衡方程推导与选项验证</text>

  <!-- 左栏边框（4条虚线） -->
  <line x1="35" y1="62" x2="365" y2="62" stroke="#888888" stroke-width="1" stroke-dasharray="4,2"/>
  <line x1="35" y1="275" x2="365" y2="275" stroke="#888888" stroke-width="1" stroke-dasharray="4,2"/>
  <line x1="35" y1="62" x2="35" y2="275" stroke="#888888" stroke-width="1" stroke-dasharray="4,2"/>
  <line x1="365" y1="62" x2="365" y2="275" stroke="#888888" stroke-width="1" stroke-dasharray="4,2"/>

  <!-- 左栏标题 -->
  <text x="200" y="87" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">左图（甲+乙）</text>

  <!-- 左公式①：F_甲1 = G_甲 + T -->
  <text id="scene2-formula-left-1" x="200" y="125" text-anchor="middle" font-size="18">
    <tspan fill="#1565c0">F</tspan>
    <tspan fill="#1565c0" font-size="11" dy="3">甲1</tspan>
    <tspan dy="-3"> = </tspan>
    <tspan fill="#c62828">G</tspan>
    <tspan fill="#c62828" font-size="11" dy="3">甲</tspan>
    <tspan dy="-3"> + </tspan>
    <tspan fill="#2e7d32">T</tspan>
  </text>

  <!-- 左公式②：G_乙 = F_乙 + T -->
  <text id="scene2-formula-left-2" x="200" y="170" text-anchor="middle" font-size="18">
    <tspan fill="#c62828">G</tspan>
    <tspan fill="#c62828" font-size="11" dy="3">乙</tspan>
    <tspan dy="-3"> = </tspan>
    <tspan fill="#1565c0">F</tspan>
    <tspan fill="#1565c0" font-size="11" dy="3">乙</tspan>
    <tspan dy="-3"> + </tspan>
    <tspan fill="#2e7d32">T</tspan>
  </text>

  <!-- 左公式③：G_乙 = F_乙 + G_丙（步骤2显示） -->
  <text id="scene2-formula-left-3" x="200" y="215" text-anchor="middle" font-size="18" opacity="0" style="transition: opacity 0.3s ease;">
    <tspan fill="#c62828">G</tspan>
    <tspan fill="#c62828" font-size="11" dy="3">乙</tspan>
    <tspan dy="-3"> = </tspan>
    <tspan fill="#1565c0">F</tspan>
    <tspan fill="#1565c0" font-size="11" dy="3">乙</tspan>
    <tspan dy="-3"> + </tspan>
    <tspan fill="#c62828">G</tspan>
    <tspan fill="#c62828" font-size="11" dy="3">丙</tspan>
    <tspan dy="-3"></tspan>
  </text>

  <!-- 左公式④：G_乙 > F_乙（步骤3显示） -->
  <text id="scene2-formula-left-4" x="200" y="260" text-anchor="middle" font-size="18" opacity="0" style="transition: opacity 0.3s ease;">
    <tspan fill="#c62828">G</tspan>
    <tspan fill="#c62828" font-size="11" dy="3">乙</tspan>
    <tspan dy="-3"> &gt; </tspan>
    <tspan fill="#1565c0">F</tspan>
    <tspan fill="#1565c0" font-size="11" dy="3">乙</tspan>
    <tspan dy="-3"></tspan>
  </text>

  <!-- 右栏边框（4条虚线） -->
  <line x1="435" y1="62" x2="765" y2="62" stroke="#888888" stroke-width="1" stroke-dasharray="4,2"/>
  <line x1="435" y1="275" x2="765" y2="275" stroke="#888888" stroke-width="1" stroke-dasharray="4,2"/>
  <line x1="435" y1="62" x2="435" y2="275" stroke="#888888" stroke-width="1" stroke-dasharray="4,2"/>
  <line x1="765" y1="62" x2="765" y2="275" stroke="#888888" stroke-width="1" stroke-dasharray="4,2"/>

  <!-- 右栏标题 -->
  <text x="600" y="87" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">右图（甲+丙）</text>

  <!-- 右公式①：F_甲2 = G_甲 + G_丙 -->
  <text id="scene2-formula-right-1" x="600" y="145" text-anchor="middle" font-size="18">
    <tspan fill="#1565c0">F</tspan>
    <tspan fill="#1565c0" font-size="11" dy="3">甲2</tspan>
    <tspan dy="-3"> = </tspan>
    <tspan fill="#c62828">G</tspan>
    <tspan fill="#c62828" font-size="11" dy="3">甲</tspan>
    <tspan dy="-3"> + </tspan>
    <tspan fill="#c62828">G</tspan>
    <tspan fill="#c62828" font-size="11" dy="3">丙</tspan>
    <tspan dy="-3"></tspan>
  </text>

  <!-- 步骤0提示文字 -->
  <text id="scene2-hint-text" x="400" y="310" text-anchor="middle" font-size="16" fill="#888888">点击「下一步」开始推导</text>

  <!-- 推导结论1：∵ F_甲1 = F_甲2  ∴ T = G_丙（步骤1显示） -->
  <text id="scene2-derivation-1" x="400" y="290" text-anchor="middle" font-size="18" opacity="0" style="transition: opacity 0.3s ease;">
    <tspan>∵ </tspan>
    <tspan fill="#1565c0">F</tspan>
    <tspan fill="#1565c0" font-size="11" dy="3">甲1</tspan>
    <tspan dy="-3"> = </tspan>
    <tspan fill="#1565c0">F</tspan>
    <tspan fill="#1565c0" font-size="11" dy="3">甲2</tspan>
    <tspan dy="-3">  ∴ </tspan>
    <tspan fill="#2e7d32">T</tspan>
    <tspan> = </tspan>
    <tspan fill="#c62828">G</tspan>
    <tspan fill="#c62828" font-size="11" dy="3">丙</tspan>
    <tspan dy="-3"></tspan>
  </text>

  <!-- 推导结论2：∵ F_乙 > 0  ∴ G_乙 > G_丙，即 m_乙 > m_丙（步骤2显示） -->
  <text id="scene2-derivation-2" x="400" y="325" text-anchor="middle" font-size="18" opacity="0" style="transition: opacity 0.3s ease;">
    <tspan>∵ </tspan>
    <tspan fill="#1565c0">F</tspan>
    <tspan fill="#1565c0" font-size="11" dy="3">乙</tspan>
    <tspan dy="-3"> &gt; 0  ∴ </tspan>
    <tspan fill="#c62828">G</tspan>
    <tspan fill="#c62828" font-size="11" dy="3">乙</tspan>
    <tspan dy="-3"> &gt; </tspan>
    <tspan fill="#c62828">G</tspan>
    <tspan fill="#c62828" font-size="11" dy="3">丙</tspan>
    <tspan dy="-3">，即 </tspan>
    <tspan>m</tspan>
    <tspan font-size="11" dy="3">乙</tspan>
    <tspan dy="-3"> &gt; </tspan>
    <tspan>m</tspan>
    <tspan font-size="11" dy="3">丙</tspan>
    <tspan dy="-3"></tspan>
  </text>

  <!-- 推导结论3：∵ T > 0  ∴ G_乙 > F_乙，即 ρ_乙 > ρ_水（步骤3显示） -->
  <text id="scene2-derivation-3" x="400" y="360" text-anchor="middle" font-size="18" opacity="0" style="transition: opacity 0.3s ease;">
    <tspan>∵ </tspan>
    <tspan fill="#2e7d32">T</tspan>
    <tspan> &gt; 0  ∴ </tspan>
    <tspan fill="#c62828">G</tspan>
    <tspan fill="#c62828" font-size="11" dy="3">乙</tspan>
    <tspan dy="-3"> &gt; </tspan>
    <tspan fill="#1565c0">F</tspan>
    <tspan fill="#1565c0" font-size="11" dy="3">乙</tspan>
    <tspan dy="-3">，即 </tspan>
    <tspan>ρ</tspan>
    <tspan font-size="11" dy="3">乙</tspan>
    <tspan dy="-3"> &gt; </tspan>
    <tspan>ρ</tspan>
    <tspan font-size="11" dy="3">水</tspan>
    <tspan dy="-3"></tspan>
  </text>

  <!-- 推导总结（步骤4显示） -->
  <text id="scene2-derivation-summary" x="400" y="300" text-anchor="middle" font-size="18" opacity="0" style="transition: opacity 0.3s ease;">
    <tspan x="400" dy="0">A ✓    B ✓    C ✗    D ✓</tspan>
    <tspan x="400" dy="35" font-weight="bold">本题选 </tspan>
    <tspan fill="#c62828" font-weight="bold">C</tspan>
  </text>

  <!-- 选项卡片 A -->
  <text x="120" y="415" text-anchor="middle" font-size="22" font-weight="bold" fill="#000000">A</text>
  <text id="scene2-card-A-status" x="120" y="460" text-anchor="middle" font-size="14" fill="#2e7d32" opacity="0" style="transition: opacity 0.3s ease;">✓ 正确</text>

  <!-- 选项卡片 B -->
  <text x="306" y="415" text-anchor="middle" font-size="22" font-weight="bold" fill="#000000">B</text>
  <text id="scene2-card-B-status" x="306" y="460" text-anchor="middle" font-size="14" fill="#2e7d32" opacity="0" style="transition: opacity 0.3s ease;">✓ 正确</text>

  <!-- 选项卡片 C -->
  <g id="scene2-card-C-group">
    <text x="492" y="415" text-anchor="middle" font-size="22" font-weight="bold" fill="#000000">C</text>
    <text id="scene2-card-C-status" x="492" y="460" text-anchor="middle" font-size="14" fill="#c62828" opacity="0" style="transition: opacity 0.3s ease;">✗ 错误</text>
  </g>

  <!-- 选项卡片 D -->
  <text x="678" y="415" text-anchor="middle" font-size="22" font-weight="bold" fill="#000000">D</text>
  <text id="scene2-card-D-status" x="678" y="460" text-anchor="middle" font-size="14" fill="#2e7d32" opacity="0" style="transition: opacity 0.3s ease;">✓ 正确</text>
</svg>

<!-- 控件栏 -->
<div id="scene2-controls">
  <button id="scene2-btn-prev" disabled>◀ 上一步</button>
  <span id="scene2-step-indicator">步骤 1 / 5</span>
  <button id="scene2-btn-next">下一步 ▶</button>
</div>
</div>

<script>
(function() {
  var currentStep = 0;
  var totalSteps = 5;

  var els = {
    formulaLeft3: document.getElementById('scene2-formula-left-3'),
    formulaLeft4: document.getElementById('scene2-formula-left-4'),
    derivation1: document.getElementById('scene2-derivation-1'),
    derivation2: document.getElementById('scene2-derivation-2'),
    derivation3: document.getElementById('scene2-derivation-3'),
    derivationSummary: document.getElementById('scene2-derivation-summary'),
    hintText: document.getElementById('scene2-hint-text'),
    cardAStatus: document.getElementById('scene2-card-A-status'),
    cardBStatus: document.getElementById('scene2-card-B-status'),
    cardCStatus: document.getElementById('scene2-card-C-status'),
    cardDStatus: document.getElementById('scene2-card-D-status'),
    cardCGroup: document.getElementById('scene2-card-C-group'),
    btnPrev: document.getElementById('scene2-btn-prev'),
    btnNext: document.getElementById('scene2-btn-next'),
    indicator: document.getElementById('scene2-step-indicator')
  };

  function setOpacity(el, val) {
    if (el) el.setAttribute('opacity', val);
  }

  function setCardCorrect(status) {
    if (status) {
      status.textContent = '✓ 正确';
      status.setAttribute('fill', '#2e7d32');
      setOpacity(status, 1);
    }
  }

  function setCardWrong(status) {
    if (status) {
      status.textContent = '✗ 错误';
      status.setAttribute('fill', '#c62828');
      setOpacity(status, 1);
    }
  }

  function resetCard(status) {
    if (status) {
      setOpacity(status, 0);
    }
  }

  function pulseCardC() {
    var start = performance.now();
    var duration = 600;
    var cx = 492, cy = 437;
    function animate(now) {
      var t = Math.min((now - start) / duration, 1);
      var scale = 1 + 0.03 * Math.sin(t * Math.PI);
      var tx = cx - cx * scale;
      var ty = cy - cy * scale;
      els.cardCGroup.setAttribute('transform', 'translate(' + tx + ',' + ty + ') scale(' + scale + ')');
      if (t < 1) {
        requestAnimationFrame(animate);
      } else {
        els.cardCGroup.setAttribute('transform', '');
      }
    }
    requestAnimationFrame(animate);
  }

  function updateScene(step) {
    // 重置所有动态元素
    setOpacity(els.formulaLeft3, 0);
    setOpacity(els.formulaLeft4, 0);
    setOpacity(els.derivation1, 0);
    setOpacity(els.derivation2, 0);
    setOpacity(els.derivation3, 0);
    setOpacity(els.derivationSummary, 0);
    setOpacity(els.hintText, step === 0 ? 1 : 0);

    // 重置所有卡片状态
    resetCard(els.cardAStatus);
    resetCard(els.cardBStatus);
    resetCard(els.cardCStatus);
    resetCard(els.cardDStatus);

    // 更新按钮状态
    els.indicator.textContent = '步骤 ' + (step + 1) + ' / ' + totalSteps;
    els.btnPrev.disabled = (step === 0);
    els.btnNext.disabled = (step === totalSteps - 1);

    switch(step) {
      case 0:
        // 初始状态：只显示基础方程和提示
        break;
      case 1:
        // 步骤1：消元得 T = G_丙
        setOpacity(els.derivation1, 1);
        setCardCorrect(els.cardBStatus);
        break;
      case 2:
        // 步骤2：比较乙丙质量
        setOpacity(els.formulaLeft3, 1);
        setOpacity(els.derivation2, 1);
        setCardCorrect(els.cardBStatus);
        setCardCorrect(els.cardDStatus);
        break;
      case 3:
        // 步骤3：比较乙的密度与水
        setOpacity(els.formulaLeft3, 1);
        setOpacity(els.formulaLeft4, 1);
        setOpacity(els.derivation3, 1);
        setCardCorrect(els.cardBStatus);
        setCardCorrect(els.cardDStatus);
        setCardWrong(els.cardCStatus);
        break;
      case 4:
        // 步骤4：最终总结
        setOpacity(els.formulaLeft3, 1);
        setOpacity(els.formulaLeft4, 1);
        setOpacity(els.derivationSummary, 1);
        setCardCorrect(els.cardAStatus);
        setCardCorrect(els.cardBStatus);
        setCardCorrect(els.cardDStatus);
        setCardWrong(els.cardCStatus);
        pulseCardC();
        break;
    }
  }

  els.btnPrev.addEventListener('click', function() {
    if (currentStep > 0) {
      currentStep--;
      updateScene(currentStep);
    }
  });

  els.btnNext.addEventListener('click', function() {
    if (currentStep < totalSteps - 1) {
      currentStep++;
      updateScene(currentStep);
    }
  });

  // 初始化
  updateScene(0);
})();
</script>
</body>
</html>
