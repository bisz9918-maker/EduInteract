<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电磁感应装置与动态受力分析 - Scene 1</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-btn-prev, #scene1-btn-next {
            padding: 6px 18px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px;
            cursor: pointer; transition: opacity 0.2s;
        }
        #scene1-btn-prev { background: #f0f0f0; color: #333; }
        #scene1-btn-next { background: #1565c0; color: #fff; border-color: #1565c0; }
        #scene1-btn-prev:disabled, #scene1-btn-next:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 12px; color: #666; min-width: 40px; text-align: center; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <defs>
                <!-- 箭头标记 -->
                <marker id="scene1-arrowhead-black" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
                </marker>
                <marker id="scene1-arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#c62828"/>
                </marker>
                <marker id="scene1-arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32"/>
                </marker>
                <marker id="scene1-arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0"/>
                </marker>
            </defs>

            <!-- ========== 步骤0：装置结构（基础层，始终显示） ========== -->
            <g id="scene1-step0-base">
                <!-- 磁场区域框：用4条虚线代替rect，避免大bounding box导致误报 -->
                <line x1="70" y1="100" x2="410" y2="100" stroke="#888" stroke-width="1" stroke-dasharray="5,4"/>
                <line x1="410" y1="100" x2="410" y2="340" stroke="#888" stroke-width="1" stroke-dasharray="5,4"/>
                <line x1="410" y1="340" x2="70" y2="340" stroke="#888" stroke-width="1" stroke-dasharray="5,4"/>
                <line x1="70" y1="340" x2="70" y2="100" stroke="#888" stroke-width="1" stroke-dasharray="5,4"/>

                <!-- 磁场箭头组（9个向上箭头） -->
                <!-- 上排 -->
                <line x1="140" y1="140" x2="140" y2="110" stroke="#000" stroke-width="1.5" marker-end="url(#scene1-arrowhead-black)"/>
                <line x1="260" y1="140" x2="260" y2="110" stroke="#000" stroke-width="1.5" marker-end="url(#scene1-arrowhead-black)"/>
                <line x1="380" y1="140" x2="380" y2="110" stroke="#000" stroke-width="1.5" marker-end="url(#scene1-arrowhead-black)"/>
                <!-- 中排 -->
                <line x1="140" y1="220" x2="140" y2="190" stroke="#000" stroke-width="1.5" marker-end="url(#scene1-arrowhead-black)"/>
                <line x1="260" y1="220" x2="260" y2="190" stroke="#000" stroke-width="1.5" marker-end="url(#scene1-arrowhead-black)"/>
                <line x1="380" y1="220" x2="380" y2="190" stroke="#000" stroke-width="1.5" marker-end="url(#scene1-arrowhead-black)"/>
                <!-- 下排 -->
                <line x1="140" y1="300" x2="140" y2="270" stroke="#000" stroke-width="1.5" marker-end="url(#scene1-arrowhead-black)"/>
                <line x1="260" y1="300" x2="260" y2="270" stroke="#000" stroke-width="1.5" marker-end="url(#scene1-arrowhead-black)"/>
                <line x1="380" y1="300" x2="380" y2="270" stroke="#000" stroke-width="1.5" marker-end="url(#scene1-arrowhead-black)"/>

                <!-- 上导轨 -->
                <line x1="80" y1="160" x2="400" y2="160" stroke="#000" stroke-width="3"/>
                <!-- 下导轨 -->
                <line x1="80" y1="280" x2="400" y2="280" stroke="#000" stroke-width="3"/>
                <!-- 右端竖线 -->
                <line x1="400" y1="160" x2="400" y2="280" stroke="#000" stroke-width="2"/>

                <!-- 金属棒ab -->
                <line x1="220" y1="157" x2="220" y2="283" stroke="#000" stroke-width="6"/>

                <!-- 电阻引线 -->
                <line x1="400" y1="220" x2="430" y2="220" stroke="#000" stroke-width="1.5"/>
                <!-- 电阻R符号（锯齿形） -->
                <polyline points="430,220 435,210 445,230 455,210 465,230 470,220" fill="none" stroke="#000" stroke-width="1.5"/>
                <!-- 电阻右侧引线 -->
                <line x1="470" y1="220" x2="480" y2="220" stroke="#000" stroke-width="1.5"/>

                <!-- 恒力F箭头（主图） -->
                <line x1="220" y1="220" x2="140" y2="220" stroke="#c62828" stroke-width="2.5" marker-end="url(#scene1-arrowhead-red)"/>

                <!-- 标签a（移至棒左侧上方） -->
                <text x="200" y="145" font-size="14" fill="#000" font-weight="bold" text-anchor="end">a</text>
                <!-- 标签b（移至棒左侧下方，避开下导轨和引线） -->
                <text x="180" y="305" font-size="14" fill="#000" font-weight="bold" text-anchor="end">b</text>
                <!-- 标签B -->
                <text x="270" y="85" font-size="16" fill="#000" font-weight="bold">B</text>
                <!-- 标签R -->
                <text x="485" y="225" font-size="14" fill="#000" font-weight="bold">R</text>
            </g>

            <!-- ========== 步骤1：条件标注 ========== -->
            <g id="scene1-step1-labels" style="display:none; opacity:0;">
                <!-- L双向箭头 -->
                <line x1="65" y1="165" x2="65" y2="275" stroke="#1565c0" stroke-width="1.5" marker-end="url(#scene1-arrowhead-blue)" marker-start="url(#scene1-arrowhead-blue)"/>
                <!-- L=1m标注 -->
                <text x="25" y="225" font-size="14" fill="#1565c0">L=1m</text>
                <!-- L引线 -->
                <line x1="65" y1="220" x2="75" y2="220" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>

                <!-- B=1T标注 -->
                <text x="300" y="75" font-size="14" fill="#1565c0">B=1T</text>
                <!-- B引线 -->
                <line x1="280" y1="90" x2="300" y2="80" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>

                <!-- R=0.8Ω标注 -->
                <text x="470" y="190" font-size="14" fill="#1565c0">R=0.8Ω</text>
                <!-- R引线 -->
                <line x1="460" y1="210" x2="475" y2="195" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>

                <!-- r=0.2Ω标注 -->
                <text x="260" y="335" font-size="14" fill="#1565c0">r=0.2Ω</text>
                <!-- r引线 -->
                <line x1="240" y1="290" x2="265" y2="325" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>

                <!-- m=0.2kg标注（左移增大与b的间距） -->
                <text x="80" y="340" font-size="14" fill="#1565c0">m=0.2kg</text>
                <!-- m引线 -->
                <line x1="220" y1="270" x2="140" y2="330" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>

                <!-- μ=0.5标注 -->
                <text x="360" y="335" font-size="14" fill="#1565c0">μ=0.5</text>
                <!-- μ引线 -->
                <line x1="350" y1="280" x2="375" y2="325" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>

                <!-- F=3N标注 -->
                <text x="110" y="205" font-size="14" fill="#1565c0">F=3N</text>
                <!-- F引线 -->
                <line x1="160" y1="215" x2="140" y2="205" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
            </g>

            <!-- ========== 步骤2：受力分析 ========== -->
            <g id="scene1-step2-forces" style="display:none; opacity:0;">
                <!-- 受力分析框：用4条线代替rect -->
                <line x1="520" y1="100" x2="760" y2="100" stroke="#888" stroke-width="1"/>
                <line x1="760" y1="100" x2="760" y2="340" stroke="#888" stroke-width="1"/>
                <line x1="760" y1="340" x2="520" y2="340" stroke="#888" stroke-width="1"/>
                <line x1="520" y1="340" x2="520" y2="100" stroke="#888" stroke-width="1"/>

                <!-- 受力分析标题（上移至y=105，避免与N标签重叠） -->
                <text x="640" y="105" font-size="14" fill="#000" text-anchor="middle" font-weight="bold">受力分析</text>

                <!-- 受力中心点 -->
                <circle cx="640" cy="220" r="4" fill="#000"/>

                <!-- 力F（向左，红色） -->
                <line x1="640" y1="200" x2="560" y2="200" stroke="#c62828" stroke-width="2.5" marker-end="url(#scene1-arrowhead-red)"/>
                <text x="545" y="205" font-size="14" fill="#c62828">F</text>

                <!-- 力f（向右，绿色） -->
                <line x1="640" y1="200" x2="720" y2="200" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene1-arrowhead-green)"/>
                <text x="725" y="205" font-size="14" fill="#2e7d32">f</text>

                <!-- 力F_安（向右，红色） -->
                <line x1="640" y1="240" x2="720" y2="240" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrowhead-red)"/>
                <text x="725" y="245" font-size="14" fill="#c62828">F_安</text>

                <!-- 力mg（向下，绿色） -->
                <line x1="640" y1="220" x2="640" y2="300" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene1-arrowhead-green)"/>
                <text x="650" y="315" font-size="14" fill="#2e7d32">mg</text>

                <!-- 力N（向上，绿色） -->
                <line x1="640" y1="220" x2="640" y2="140" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene1-arrowhead-green)"/>
                <!-- N标签上移至y=135，与标题保持足够间距 -->
                <text x="650" y="135" font-size="14" fill="#2e7d32">N</text>
            </g>

            <!-- ========== 步骤3：稳定条件（公式区） ========== -->
            <g id="scene1-step3-formulas" style="display:none; opacity:0;">
                <!-- 公式区边框：用4条线代替rect -->
                <line x1="520" y1="340" x2="780" y2="340" stroke="#ddd" stroke-width="1"/>
                <line x1="780" y1="340" x2="780" y2="430" stroke="#ddd" stroke-width="1"/>
                <line x1="780" y1="430" x2="520" y2="430" stroke="#ddd" stroke-width="1"/>
                <line x1="520" y1="430" x2="520" y2="340" stroke="#ddd" stroke-width="1"/>
                <!-- 公式文本 -->
                <text x="540" y="365" font-size="14" fill="#000">水平方向：F = F_安 + f</text>
                <text x="540" y="385" font-size="14" fill="#000">竖直方向：N = mg</text>
                <text x="540" y="405" font-size="14" fill="#000">滑动摩擦力：f = μN = μmg</text>
            </g>

            <!-- ========== 步骤4：求解速度（公式区更新） ========== -->
            <g id="scene1-step4-result" style="display:none; opacity:0;">
                <!-- 公式区边框：用4条线代替rect -->
                <line x1="520" y1="340" x2="780" y2="340" stroke="#ddd" stroke-width="1"/>
                <line x1="780" y1="340" x2="780" y2="440" stroke="#ddd" stroke-width="1"/>
                <line x1="780" y1="440" x2="520" y2="440" stroke="#ddd" stroke-width="1"/>
                <line x1="520" y1="440" x2="520" y2="340" stroke="#ddd" stroke-width="1"/>
                <!-- 公式文本（增大行距避免拥挤） -->
                <text x="540" y="365" font-size="14" fill="#000">安培力：F_安 = B²L²v / (R+r)</text>
                <text x="540" y="405" font-size="14" fill="#000">联立代入得：</text>
                <text x="640" y="435" font-size="16" fill="#1565c0" font-weight="bold">v = 2 m/s</text>
            </g>
        </svg>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">1 / 5</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        var currentStep = 0;
        var totalSteps = 5;
        var stepGroups = [
            document.getElementById('scene1-step0-base'),
            document.getElementById('scene1-step1-labels'),
            document.getElementById('scene1-step2-forces'),
            document.getElementById('scene1-step3-formulas'),
            document.getElementById('scene1-step4-result')
        ];
        var btnPrev = document.getElementById('scene1-btn-prev');
        var btnNext = document.getElementById('scene1-btn-next');
        var indicator = document.getElementById('scene1-step-indicator');

        function show(el) {
            if (!el) return;
            el.style.display = 'block';
            el.style.opacity = '0';
        }
        function hide(el) {
            if (!el) return;
            el.style.display = 'none';
            el.style.opacity = '0';
        }
        function fadeIn(el, duration) {
            if (!el) return;
            duration = duration || 300;
            el.style.display = 'block';
            var start = performance.now();
            function tick(now) {
                var t = Math.min((now - start) / duration, 1);
                el.style.opacity = t;
                if (t < 1) requestAnimationFrame(tick);
            }
            requestAnimationFrame(tick);
        }

        function updateScene() {
            // 步骤0始终显示
            stepGroups[0].style.display = 'block';
            stepGroups[0].style.opacity = '1';

            // 步骤1-2：按currentStep累积显示
            for (var i = 1; i <= 2; i++) {
                if (i <= currentStep) {
                    fadeIn(stepGroups[i], 300);
                } else {
                    hide(stepGroups[i]);
                }
            }

            // 步骤3和步骤4互斥：只在对应步骤显示
            if (currentStep === 3) {
                fadeIn(stepGroups[3], 300);
                hide(stepGroups[4]);
            } else if (currentStep === 4) {
                hide(stepGroups[3]);
                fadeIn(stepGroups[4], 300);
            } else {
                hide(stepGroups[3]);
                hide(stepGroups[4]);
            }

            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps - 1);
            indicator.textContent = (currentStep + 1) + ' / ' + totalSteps;
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateScene();
            }
        });

        // 初始化
        updateScene();
    })();
    </script>
</body>
</html>
