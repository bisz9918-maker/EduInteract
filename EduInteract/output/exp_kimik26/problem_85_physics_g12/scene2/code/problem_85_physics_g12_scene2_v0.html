<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 气体状态参数对比与推导</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene2-controls button {
            padding: 8px 18px; font-size: 14px; cursor: pointer; border: 1px solid #ccc;
            border-radius: 4px; background: #f0f0f0; transition: opacity 0.2s;
        }
        #scene2-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene2-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene2-step-indicator { font-size: 13px; color: #666; min-width: 70px; text-align: center; }
        .scene2-diagram-group { display: none; }
        .scene2-diagram-group.active { display: block; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <!-- 参数表格：使用 foreignObject 内嵌 HTML 表格 -->
            <foreignObject x="50" y="40" width="700" height="160">
                <div xmlns="http://www.w3.org/1999/xhtml" style="width:100%; height:100%;">
                    <table id="scene2-table" style="width:100%; height:100%; border-collapse:collapse; font-family:sans-serif; font-size:14px; text-align:center; table-layout:fixed; border:1px solid #000;">
                        <colgroup>
                            <col style="width:100px;">
                            <col style="width:100px; background:#e3f2fd;">
                            <col style="width:100px; background:#e3f2fd;">
                            <col style="width:100px; background:#e3f2fd;">
                            <col style="width:100px; background:#ffebee;">
                            <col style="width:100px; background:#ffebee;">
                            <col style="width:100px; background:#ffebee;">
                        </colgroup>
                        <thead>
                            <tr style="background:#f5f5f5; height:45px; font-weight:bold; font-size:15px;">
                                <th style="border:1px solid #000; color:#333;">状态</th>
                                <th style="border:1px solid #000; color:#1565c0;">P<sub style="font-size:11px;">N</sub></th>
                                <th style="border:1px solid #000; color:#1565c0;">V<sub style="font-size:11px;">N</sub></th>
                                <th style="border:1px solid #000; color:#1565c0;">T<sub style="font-size:11px;">N</sub></th>
                                <th style="border:1px solid #000; color:#c62828;">P<sub style="font-size:11px;">O</sub></th>
                                <th style="border:1px solid #000; color:#c62828;">V<sub style="font-size:11px;">O</sub></th>
                                <th style="border:1px solid #000; color:#c62828;">T<sub style="font-size:11px;">O</sub></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr id="scene2-row-1" style="height:38px;">
                                <td style="border:1px solid #000; color:#333;">初态</td>
                                <td style="border:1px solid #000; color:#333;">P₀</td>
                                <td style="border:1px solid #000; color:#333;">7SH/2</td>
                                <td style="border:1px solid #000; color:#333;">280 K</td>
                                <td style="border:1px solid #000; color:#333;">P₀</td>
                                <td style="border:1px solid #000; color:#333;">SH</td>
                                <td style="border:1px solid #000; color:#333;">280 K</td>
                            </tr>
                            <tr id="scene2-row-2" style="height:38px;">
                                <td style="border:1px solid #000; color:#333;">过程(1)末态</td>
                                <td style="border:1px solid #000; color:#333;">P₀</td>
                                <td style="border:1px solid #000; color:#333;">4SH</td>
                                <td style="border:1px solid #000; color:#2e7d32; font-weight:bold; font-size:16px;">320 K</td>
                                <td style="border:1px solid #000; color:#333;">P₀</td>
                                <td style="border:1px solid #000; color:#333;">SH</td>
                                <td style="border:1px solid #000; color:#333;">280 K</td>
                            </tr>
                            <tr id="scene2-row-3" style="height:39px;">
                                <td style="border:1px solid #000; color:#333;">过程(2)末态</td>
                                <td style="border:1px solid #000; color:#999;">—</td>
                                <td style="border:1px solid #000; color:#999;">—</td>
                                <td style="border:1px solid #000; color:#999;">—</td>
                                <td style="border:1px solid #000; color:#2e7d32; font-weight:bold; font-size:16px;">4P₀/3</td>
                                <td style="border:1px solid #000; color:#2e7d32; font-weight:bold; font-size:16px;">3SH/4</td>
                                <td style="border:1px solid #000; color:#333;">280 K</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </foreignObject>

            <!-- 公式推导区：使用 foreignObject 内嵌 HTML -->
            <foreignObject x="370" y="220" width="380" height="180">
                <div xmlns="http://www.w3.org/1999/xhtml" style="width:100%; height:100%; font-family:sans-serif;">
                    <!-- 步骤0 提示 -->
                    <div id="scene2-hint" style="display:flex; align-items:center; justify-content:center; height:100%; color:#888; font-size:15px;">
                        点击「下一步」查看推导过程
                    </div>
                    <!-- 步骤1 公式 -->
                    <div id="scene2-formula-1" style="display:none; height:100%; padding:12px; box-sizing:border-box; border-left:4px solid #1565c0; background:#fafafa;">
                        <div style="font-size:16px; font-weight:bold; color:#1565c0; margin-bottom:10px;">过程(1)：氮气等压膨胀</div>
                        <div style="font-size:14px; color:#333; margin-bottom:8px;">查理定律：<span style="font-size:18px; color:#1565c0; margin-left:8px;">V₁/T₁ = V₂/T₂</span></div>
                        <div style="font-size:14px; color:#333; margin-bottom:6px;">初态：V₁ = 7SH/2，T₁ = 280 K</div>
                        <div style="font-size:14px; color:#333; margin-bottom:8px;">末态：V₂ = 4SH</div>
                        <div style="font-size:15px; color:#333; margin-bottom:8px;">(7SH/2) / 280 = 4SH / T₂</div>
                        <div style="font-size:16px; font-weight:bold; color:#2e7d32;">⇒ T₂ = 320 K</div>
                    </div>
                    <!-- 步骤2 公式 -->
                    <div id="scene2-formula-2" style="display:none; height:100%; padding:12px; box-sizing:border-box; border-left:4px solid #c62828; background:#fafafa;">
                        <div style="font-size:16px; font-weight:bold; color:#c62828; margin-bottom:10px;">过程(2)：氧气等温压缩</div>
                        <div style="font-size:14px; color:#333; margin-bottom:8px;">玻意耳定律：<span style="font-size:18px; color:#c62828; margin-left:8px;">P₁V₁ = P₂V₂</span></div>
                        <div style="font-size:14px; color:#333; margin-bottom:6px;">初态：P₁ = P₀，V₁ = SH</div>
                        <div style="font-size:14px; color:#333; margin-bottom:8px;">末态：V₂ = 3SH/4</div>
                        <div style="font-size:15px; color:#333; margin-bottom:8px;">P₀ · SH = P₂ · (3SH/4)</div>
                        <div style="font-size:16px; font-weight:bold; color:#2e7d32;">⇒ P₂ = 4P₀/3</div>
                    </div>
                </div>
            </foreignObject>

            <!-- 步骤1示意图：氮气初末态体积对比 -->
            <g id="scene2-diagram-1" class="scene2-diagram-group">
                <!-- 初态标签 -->
                <text x="110" y="258" text-anchor="middle" font-size="13" fill="#666">初态</text>
                <!-- 初态A气缸 -->
                <rect x="60" y="270" width="45" height="110" fill="none" stroke="#000" stroke-width="1"/>
                <rect x="60" y="297" width="45" height="83" fill="#e3f2fd" stroke="#1565c0" stroke-width="1"/>
                <line x1="60" y1="297" x2="105" y2="297" stroke="#333" stroke-width="3"/>
                <!-- 初态B气缸 -->
                <rect x="120" y="270" width="22" height="110" fill="none" stroke="#000" stroke-width="1"/>
                <rect x="120" y="325" width="22" height="55" fill="#e3f2fd" stroke="#1565c0" stroke-width="1"/>
                <line x1="120" y1="325" x2="142" y2="325" stroke="#333" stroke-width="3"/>
                <!-- 初态右侧标注（移出气柱范围避免重叠） -->
                <text x="30" y="340" font-size="12" fill="#1565c0">3H/4</text>
                <text x="155" y="370" font-size="12" fill="#1565c0">H/2</text>
                <!-- 初态总体积 -->
                <text x="110" y="395" text-anchor="middle" font-size="13" fill="#1565c0">7SH/2</text>

                <!-- 过渡箭头 -->
                <path d="M 185 330 L 215 330 M 208 324 L 215 330 L 208 336" fill="none" stroke="#666" stroke-width="1.5"/>
                <text x="200" y="315" text-anchor="middle" font-size="11" fill="#666">等压加热</text>

                <!-- 末态标签 -->
                <text x="280" y="258" text-anchor="middle" font-size="13" fill="#666">末态</text>
                <!-- 末态A气缸 -->
                <rect x="230" y="270" width="45" height="110" fill="none" stroke="#000" stroke-width="1"/>
                <rect x="230" y="297" width="45" height="83" fill="#e3f2fd" stroke="#1565c0" stroke-width="1"/>
                <line x1="230" y1="297" x2="275" y2="297" stroke="#333" stroke-width="3"/>
                <!-- 末态B气缸 -->
                <rect x="290" y="270" width="22" height="110" fill="none" stroke="#000" stroke-width="1"/>
                <rect x="290" y="270" width="22" height="110" fill="#e3f2fd" stroke="#1565c0" stroke-width="1"/>
                <line x1="290" y1="270" x2="312" y2="270" stroke="#333" stroke-width="3"/>
                <!-- 末态右侧标注（移出气柱范围避免重叠） -->
                <text x="150" y="355" font-size="12" fill="#1565c0">3H/4</text>
                <text x="330" y="355" font-size="12" fill="#1565c0">H</text>
                <!-- 末态总体积 -->
                <text x="280" y="395" text-anchor="middle" font-size="13" fill="#1565c0">4SH</text>
            </g>

            <!-- 步骤2示意图：氧气体积变化 -->
            <g id="scene2-diagram-2" class="scene2-diagram-group">
                <!-- 示意图标题 -->
                <text x="175" y="225" text-anchor="middle" font-size="12" fill="#666">氧气被压缩</text>
                <!-- A气缸轮廓 -->
                <rect x="140" y="240" width="70" height="140" fill="none" stroke="#000" stroke-width="1"/>
                <!-- 氧气初态填充（H/4 = 35px） -->
                <rect x="140" y="240" width="70" height="35" fill="#c62828" fill-opacity="0.2" stroke="none"/>
                <!-- 活塞a初态 -->
                <line x1="140" y1="275" x2="210" y2="275" stroke="#333" stroke-width="3"/>
                <!-- 氧气末态填充（3H/16 ≈ 26px） -->
                <rect x="140" y="240" width="70" height="26" fill="#c62828" fill-opacity="0.35" stroke="none"/>
                <!-- 活塞a末态 -->
                <line x1="140" y1="266" x2="210" y2="266" stroke="#333" stroke-width="3"/>
                <!-- 上升箭头 -->
                <path d="M 120 275 L 120 266 M 116 271 L 120 266 L 124 271" fill="none" stroke="#c62828" stroke-width="2"/>
                <!-- 上升距离标注 -->
                <text x="110" y="272" text-anchor="end" font-size="12" fill="#c62828">H/16</text>
                <!-- 右侧高度标注 -->
                <text x="220" y="258" font-size="12" fill="#c62828">H/4</text>
                <text x="220" y="290" font-size="12" fill="#c62828">3H/16</text>
            </g>
        </svg>

        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-btn-prev" disabled>◀ 上一步</button>
            <span id="scene2-step-indicator">步骤 0/2</span>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2 状态机实现
        var scene2State = 0; // 0, 1, 2
        var maxStep = 2;

        var btnPrev = document.getElementById('scene2-btn-prev');
        var btnNext = document.getElementById('scene2-btn-next');
        var indicator = document.getElementById('scene2-step-indicator');

        var hintDiv = document.getElementById('scene2-hint');
        var formula1Div = document.getElementById('scene2-formula-1');
        var formula2Div = document.getElementById('scene2-formula-2');
        var diagram1Group = document.getElementById('scene2-diagram-1');
        var diagram2Group = document.getElementById('scene2-diagram-2');

        var row1 = document.getElementById('scene2-row-1');
        var row2 = document.getElementById('scene2-row-2');
        var row3 = document.getElementById('scene2-row-3');

        function setDisplay(el, show) {
            if (!el) return;
            el.style.display = show ? 'block' : 'none';
        }

        function setDiagramActive(group, active) {
            if (!group) return;
            if (active) {
                group.classList.add('active');
            } else {
                group.classList.remove('active');
            }
        }

        function highlightRows(rows) {
            [row1, row2, row3].forEach(function(row, idx) {
                if (!row) return;
                var rowNum = idx + 1;
                row.style.backgroundColor = rows.indexOf(rowNum) >= 0 ? '#fff9c4' : '';
            });
        }

        function renderScene2() {
            // 按钮状态
            btnPrev.disabled = (scene2State === 0);
            btnNext.disabled = (scene2State === maxStep);
            indicator.textContent = '步骤 ' + scene2State + '/2';

            // 重置所有显示元素
            setDisplay(hintDiv, false);
            setDisplay(formula1Div, false);
            setDisplay(formula2Div, false);
            setDiagramActive(diagram1Group, false);
            setDiagramActive(diagram2Group, false);
            highlightRows([]);

            if (scene2State === 0) {
                // 步骤0：仅显示表格和提示
                setDisplay(hintDiv, true);
            } else if (scene2State === 1) {
                // 步骤1：氮气等压膨胀推导
                highlightRows([1, 2]);
                setDisplay(formula1Div, true);
                setDiagramActive(diagram1Group, true);
            } else if (scene2State === 2) {
                // 步骤2：氧气等温压缩推导
                highlightRows([1, 3]);
                setDisplay(formula2Div, true);
                setDiagramActive(diagram2Group, true);
            }
        }

        btnPrev.addEventListener('click', function() {
            if (scene2State > 0) {
                scene2State--;
                renderScene2();
            }
        });

        btnNext.addEventListener('click', function() {
            if (scene2State < maxStep) {
                scene2State++;
                renderScene2();
            }
        });

        // 初始渲染
        renderScene2();
    })();
    </script>
</body>
</html>
