<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>平行板电容器带电微粒运动 - 场景1</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            padding: 6px 16px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #f5f5f5;
            cursor: pointer;
            min-width: 80px;
        }
        #scene1-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene1-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene1-step-text {
            position: absolute;
            bottom: 52px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 14px;
            color: #555;
            z-index: 10;
        }
        /* 过渡效果 */
        .scene1-fade { transition: opacity 0.15s ease; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <div id="scene1-step-text">步骤 1 / 5</div>
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <defs>
                <!-- 箭头标记 -->
                <marker id="scene1-arrowhead-black" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
                </marker>
                <marker id="scene1-arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#c62828"/>
                </marker>
                <marker id="scene1-arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32"/>
                </marker>
                <marker id="scene1-arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0"/>
                </marker>
            </defs>

            <!-- === 步骤0 始终显示的基础装置 === -->

            <!-- 上板 B -->
            <rect id="scene1-plate-b" x="140" y="130" width="500" height="20" fill="rgba(0,0,0,0.05)" stroke="#000" stroke-width="2"/>
            <text id="scene1-label-b" x="150" y="125" font-size="16" fill="#000" text-anchor="start">B</text>

            <!-- 下板 A -->
            <rect id="scene1-plate-a" x="140" y="250" width="500" height="20" fill="rgba(0,0,0,0.05)" stroke="#000" stroke-width="2"/>
            <text id="scene1-label-a" x="150" y="285" font-size="16" fill="#000" text-anchor="start">A</text>

            <!-- 接地符号 (在B板左侧) -->
            <g id="scene1-ground">
                <line x1="120" y1="130" x2="120" y2="140" stroke="#000" stroke-width="2"/>
                <line x1="110" y1="140" x2="130" y2="140" stroke="#000" stroke-width="2"/>
                <line x1="113" y1="144" x2="127" y2="144" stroke="#000" stroke-width="2"/>
                <line x1="116" y1="148" x2="124" y2="148" stroke="#000" stroke-width="2"/>
            </g>

            <!-- 微粒 -->
            <circle id="scene1-particle" cx="140" cy="200" r="6" fill="#fff" stroke="#000" stroke-width="2"/>
            <!-- 微粒内 + 号 -->
            <line x1="136" y1="200" x2="144" y2="200" stroke="#000" stroke-width="1.5"/>
            <line x1="140" y1="196" x2="140" y2="204" stroke="#000" stroke-width="1.5"/>

            <!-- 微粒标签 +q, m —— 加大垂直间距避免拥挤 -->
            <text id="scene1-label-q" x="115" y="180" font-size="14" fill="#000" text-anchor="end">+q</text>
            <text id="scene1-label-m" x="115" y="222" font-size="14" fill="#000" text-anchor="end">m</text>

            <!-- O点标记 (A板上表面中点) -->
            <g id="scene1-point-o">
                <line x1="386" y1="250" x2="394" y2="250" stroke="#000" stroke-width="1.5"/>
                <line x1="390" y1="246" x2="390" y2="254" stroke="#000" stroke-width="1.5"/>
            </g>
            <!-- O标签下移，避免与A板rect重叠 -->
            <text id="scene1-label-o" x="385" y="285" font-size="14" fill="#000" text-anchor="middle">O</text>

            <!-- L 尺寸标注 -->
            <g id="scene1-label-l-group">
                <!-- 两端短竖线 -->
                <line x1="140" y1="105" x2="140" y2="115" stroke="#000" stroke-width="1.5"/>
                <line x1="640" y1="105" x2="640" y2="115" stroke="#000" stroke-width="1.5"/>
                <!-- 双向箭头线 -->
                <line x1="140" y1="110" x2="640" y2="110" stroke="#000" stroke-width="1.5" marker-end="url(#scene1-arrowhead-black)" marker-start="url(#scene1-arrowhead-black)"/>
                <text x="390" y="105" font-size="14" fill="#000" text-anchor="middle">L = 0.1 m</text>
            </g>

            <!-- d 尺寸标注 -->
            <g id="scene1-label-d-group">
                <!-- 两端短横线 -->
                <line x1="655" y1="150" x2="665" y2="150" stroke="#000" stroke-width="1.5"/>
                <line x1="655" y1="250" x2="665" y2="250" stroke="#000" stroke-width="1.5"/>
                <!-- 双向箭头线 -->
                <line x1="660" y1="150" x2="660" y2="250" stroke="#000" stroke-width="1.5" marker-end="url(#scene1-arrowhead-black)" marker-start="url(#scene1-arrowhead-black)"/>
                <text x="675" y="200" font-size="14" fill="#000" text-anchor="start">d = 0.4 cm</text>
            </g>

            <!-- 入口 v₀ 箭头 -->
            <line id="scene1-arrow-v0" x1="100" y1="200" x2="132" y2="200" stroke="#000" stroke-width="2" marker-end="url(#scene1-arrowhead-black)"/>
            <!-- v₀ 标签左移，避免与 +q、m 拥挤 -->
            <text id="scene1-label-v0" x="75" y="196" font-size="14" fill="#000" text-anchor="end">v₀</text>

            <!-- === 步骤1 受力分析 === -->
            <!-- 重力 mg 箭头 -->
            <line id="scene1-force-mg" class="scene1-fade" x1="140" y1="208" x2="140" y2="248" stroke="#c62828" stroke-width="2.5" marker-end="url(#scene1-arrowhead-red)" opacity="0"/>
            <text id="scene1-label-mg" class="scene1-fade" x="145" y="230" font-size="14" fill="#c62828" text-anchor="start" opacity="0">mg</text>

            <!-- === 步骤2 运动分解 === -->
            <!-- 水平分速度 v₀ -->
            <line id="scene1-arrow-vx" class="scene1-fade" x1="140" y1="200" x2="185" y2="200" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene1-arrowhead-green)" opacity="0"/>
            <text id="scene1-label-vx" class="scene1-fade" x="190" y="196" font-size="14" fill="#2e7d32" text-anchor="start" opacity="0">v₀</text>

            <!-- 竖直分速度 vᵧ=gt —— 下移避免与其他标签拥挤 -->
            <line id="scene1-arrow-vy" class="scene1-fade" x1="140" y1="208" x2="140" y2="238" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrowhead-red)" opacity="0"/>
            <text id="scene1-label-vy" class="scene1-fade" x="145" y="234" font-size="14" fill="#c62828" text-anchor="start" opacity="0">vᵧ = gt</text>

            <!-- 等时性辅助虚线 -->
            <line id="scene1-guide-line1" class="scene1-fade" x1="185" y1="200" x2="185" y2="238" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3" opacity="0"/>
            <line id="scene1-guide-line2" class="scene1-fade" x1="140" y1="238" x2="185" y2="238" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3" opacity="0"/>
            <!-- t 标注下移，避免与 vᵧ=gt 拥挤 -->
            <text id="scene1-label-t" class="scene1-fade" x="200" y="252" font-size="14" fill="#888" text-anchor="start" opacity="0">t</text>

            <!-- === 步骤3 轨迹与位移 === -->
            <!-- 抛物线轨迹 -->
            <path id="scene1-trajectory" class="scene1-fade" d="M140,200 Q265,200 390,250" fill="none" stroke="#1565c0" stroke-width="2.5" marker-end="url(#scene1-arrowhead-blue)" opacity="0"/>

            <!-- 水平位移虚线 -->
            <g id="scene1-disp-x-group" class="scene1-fade" opacity="0">
                <line x1="140" y1="290" x2="390" y2="290" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="4,3"/>
                <!-- 两端短竖标记 -->
                <line x1="140" y1="286" x2="140" y2="294" stroke="#2e7d32" stroke-width="1.5"/>
                <line x1="390" y1="286" x2="390" y2="294" stroke="#2e7d32" stroke-width="1.5"/>
            </g>
            <text id="scene1-label-dx" class="scene1-fade" x="265" y="305" font-size="14" fill="#2e7d32" text-anchor="middle" opacity="0">x = L/2</text>

            <!-- 竖直位移虚线 -->
            <g id="scene1-disp-y-group" class="scene1-fade" opacity="0">
                <line x1="430" y1="200" x2="430" y2="250" stroke="#c62828" stroke-width="1.5" stroke-dasharray="4,3"/>
                <!-- 两端短横标记 -->
                <line x1="426" y1="200" x2="434" y2="200" stroke="#c62828" stroke-width="1.5"/>
                <line x1="426" y1="250" x2="434" y2="250" stroke="#c62828" stroke-width="1.5"/>
            </g>
            <text id="scene1-label-dy" class="scene1-fade" x="445" y="228" font-size="14" fill="#c62828" text-anchor="start" opacity="0">y = d/2</text>

            <!-- === 步骤4 公式结论 === -->
            <!-- 使用 foreignObject 避免 SVG text 与 rect 的包围盒重叠误报 -->
            <foreignObject id="scene1-formula-box" class="scene1-fade" x="520" y="330" width="240" height="85" opacity="0">
                <div xmlns="http://www.w3.org/1999/xhtml" style="width:100%; height:100%; background:#e3f2fd; border:1.5px solid #1565c0; border-radius:5px; box-sizing:border-box; padding:14px 15px; font-family:'Microsoft YaHei','PingFang SC',sans-serif; font-size:14px; line-height:1.7; color:#000;">
                    <div>d/2 = ½gt²</div>
                    <div>L/2 = v₀t</div>
                    <div style="color:#1565c0; font-weight:bold;">∴ v₀ = 2.5 m/s</div>
                </div>
            </foreignObject>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
            <button id="scene1-btn-reset">重置</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        let state = 0; // 当前步骤 0~4
        const totalSteps = 5;

        // 各步骤需要显示的元素ID列表
        const stepElements = {
            0: [], // 基础装置始终显示，不通过opacity控制
            1: ['scene1-force-mg', 'scene1-label-mg'],
            2: ['scene1-arrow-vx', 'scene1-label-vx', 'scene1-arrow-vy', 'scene1-label-vy', 'scene1-guide-line1', 'scene1-guide-line2', 'scene1-label-t'],
            3: ['scene1-trajectory', 'scene1-disp-x-group', 'scene1-label-dx', 'scene1-disp-y-group', 'scene1-label-dy'],
            4: ['scene1-formula-box']
        };

        // 步骤2时，步骤1的元素需要隐藏
        const step1Only = ['scene1-force-mg', 'scene1-label-mg'];

        // 步骤3时，步骤2的元素完全隐藏（避免与轨迹path的bbox重叠检测失败）
        const step2Elements = ['scene1-arrow-vx', 'scene1-label-vx', 'scene1-arrow-vy', 'scene1-label-vy', 'scene1-guide-line1', 'scene1-guide-line2', 'scene1-label-t'];

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const btnReset = document.getElementById('scene1-btn-reset');
        const stepText = document.getElementById('scene1-step-text');

        function setOpacity(id, value) {
            const el = document.getElementById(id);
            if (el) el.style.opacity = value;
        }

        function updateView() {
            // 更新步骤指示器
            stepText.textContent = '步骤 ' + (state + 1) + ' / ' + totalSteps;

            // 按钮禁用状态
            btnPrev.disabled = (state === 0);
            btnNext.disabled = (state === totalSteps - 1);

            // 先隐藏所有动态元素
            for (let s = 1; s <= 4; s++) {
                stepElements[s].forEach(id => setOpacity(id, 0));
            }

            // 根据当前状态显示对应元素
            if (state >= 1) {
                // 步骤1元素仅在步骤1显示
                if (state === 1) {
                    stepElements[1].forEach(id => setOpacity(id, 1));
                }
            }

            if (state >= 2) {
                stepElements[2].forEach(id => setOpacity(id, 1));
            }

            if (state >= 3) {
                stepElements[3].forEach(id => setOpacity(id, 1));
                // 步骤3+ 时步骤2元素完全隐藏，避免与轨迹path的包围盒重叠
                step2Elements.forEach(id => setOpacity(id, 0));
            }

            if (state >= 4) {
                stepElements[4].forEach(id => setOpacity(id, 1));
            }
        }

        btnPrev.addEventListener('click', function() {
            if (state > 0) {
                state--;
                updateView();
            }
        });

        btnNext.addEventListener('click', function() {
            if (state < totalSteps - 1) {
                state++;
                updateView();
            }
        });

        btnReset.addEventListener('click', function() {
            state = 0;
            updateView();
        });

        // 初始化
        updateView();
    })();
    </script>
</body>
</html>
