<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>带电粒子在组合电场中的运动</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            padding: 6px 16px; font-size: 14px; cursor: pointer;
            border: 1px solid #ccc; border-radius: 4px; background: #f5f5f5;
        }
        #scene1-controls button:hover { background: #e0e0e0; }
        #scene1-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 14px; color: #333; min-width: 70px; text-align: center; }
        .scene1-hidden { display: none; }
        .scene1-formula { font-size: 15px; fill: #333; }
        .scene1-desc { font-size: 14px; fill: #555; }
        .scene1-highlight-text { font-weight: bold; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene1-arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
                    <path d="M0,0 L10,4 L0,8 Z" fill="#1565c0"/>
                </marker>
                <marker id="scene1-arrow-red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
                    <path d="M0,0 L10,4 L0,8 Z" fill="#c62828"/>
                </marker>
                <marker id="scene1-arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
                    <path d="M0,0 L10,4 L0,8 Z" fill="#2e7d32"/>
                </marker>
                <marker id="scene1-arrow-black" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
                    <path d="M0,0 L10,4 L0,8 Z" fill="#000000"/>
                </marker>
            </defs>

            <!-- 坐标轴 -->
            <line id="scene1-axis-x" x1="100" y1="430" x2="750" y2="430" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-blue)"/>
            <line id="scene1-axis-y" x1="100" y1="430" x2="100" y2="50" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrow-red)"/>

            <!-- 原点O -->
            <circle id="scene1-point-o" cx="100" cy="430" r="3" fill="#000"/>
            <text id="scene1-label-o" x="90" y="445" font-size="16" fill="#000" text-anchor="middle">O</text>

            <!-- 轴标签 -->
            <text id="scene1-label-x" x="760" y="435" font-size="16" fill="#1565c0" text-anchor="start">x</text>
            <text id="scene1-label-y" x="90" y="45" font-size="16" fill="#c62828" text-anchor="middle">y</text>

            <!-- ab虚线 -->
            <line id="scene1-line-ab" x1="340" y1="50" x2="340" y2="430" stroke="#888888" stroke-width="2" stroke-dasharray="6,4"/>
            <text id="scene1-label-a" x="350" y="45" font-size="16" fill="#000" text-anchor="start">a</text>
            <text id="scene1-label-b" x="350" y="450" font-size="16" fill="#000" text-anchor="start">b</text>

            <!-- P点 -->
            <circle id="scene1-point-p" cx="100" cy="190" r="4" fill="#000"/>
            <text id="scene1-label-p" x="85" y="190" font-size="16" fill="#000" text-anchor="end" dominant-baseline="middle">P</text>

            <!-- Q点 -->
            <circle id="scene1-point-q" cx="580" cy="430" r="4" fill="#000"/>
            <text id="scene1-label-q" x="600" y="475" font-size="16" fill="#000" text-anchor="start">Q</text>

            <!-- E₁电场箭头（水平向右） -->
            <line id="scene1-arrow-e1-1" x1="140" y1="130" x2="200" y2="130" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-blue)"/>
            <line id="scene1-arrow-e1-2" x1="140" y1="190" x2="200" y2="190" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-blue)"/>
            <line id="scene1-arrow-e1-3" x1="140" y1="250" x2="200" y2="250" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-blue)"/>
            <text id="scene1-label-e1" x="200" y="45" font-size="16" fill="#1565c0" text-anchor="start">E₁</text>

            <!-- E₂电场箭头（竖直向下，y增加方向） -->
            <line id="scene1-arrow-e2-1" x1="400" y1="120" x2="400" y2="180" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrow-red)"/>
            <line id="scene1-arrow-e2-2" x1="480" y1="120" x2="480" y2="180" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrow-red)"/>
            <line id="scene1-arrow-e2-3" x1="560" y1="120" x2="560" y2="180" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrow-red)"/>
            <text id="scene1-label-e2" x="520" y="45" font-size="16" fill="#c62828" text-anchor="start">E₂</text>

            <!-- L标注 -->
            <line id="scene1-mark-l-left" x1="100" y1="440" x2="100" y2="450" stroke="#000" stroke-width="1.5"/>
            <line id="scene1-mark-l-right" x1="340" y1="440" x2="340" y2="450" stroke="#000" stroke-width="1.5"/>
            <line id="scene1-line-l" x1="100" y1="445" x2="340" y2="445" stroke="#000" stroke-width="1.5"/>
            <text id="scene1-label-l" x="220" y="470" font-size="16" fill="#000" text-anchor="middle">L</text>

            <!-- h标注 -->
            <line id="scene1-mark-h-top" x1="80" y1="190" x2="90" y2="190" stroke="#000" stroke-width="1.5"/>
            <line id="scene1-mark-h-bottom" x1="80" y1="430" x2="90" y2="430" stroke="#000" stroke-width="1.5"/>
            <line id="scene1-line-h" x1="85" y1="190" x2="85" y2="430" stroke="#000" stroke-width="1.5"/>
            <text id="scene1-label-h" x="70" y="310" font-size="16" fill="#000" text-anchor="middle" dominant-baseline="middle">h</text>

            <!-- m, q 标注 -->
            <text id="scene1-label-mq" x="720" y="80" font-size="15" fill="#000" text-anchor="start">m, +q</text>

            <!-- 步骤1元素：P→ab轨迹 -->
            <line id="scene1-traj-seg1" class="scene1-hidden" x1="100" y1="190" x2="340" y2="190" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#scene1-arrow-green)"/>

            <!-- v₁矢量 -->
            <line id="scene1-vec-v1" class="scene1-hidden" x1="340" y1="190" x2="390" y2="190" stroke="#1565c0" stroke-width="2.5" marker-end="url(#scene1-arrow-blue)"/>
            <text id="scene1-label-v1" class="scene1-hidden" x="400" y="175" font-size="16" fill="#1565c0" text-anchor="start">v₁</text>

            <!-- 步骤2元素：ab→Q抛物线轨迹 -->
            <path id="scene1-traj-seg2" class="scene1-hidden" d="M340,190 Q460,190 580,430" fill="none" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#scene1-arrow-green)"/>

            <!-- v_Q矢量 -->
            <line id="scene1-vec-vq" class="scene1-hidden" x1="580" y1="430" x2="610" y2="480" stroke="#c62828" stroke-width="2.5" marker-end="url(#scene1-arrow-red)"/>
            <text id="scene1-label-vq" class="scene1-hidden" x="630" y="470" font-size="16" fill="#c62828" text-anchor="start">v_Q</text>

            <!-- 右侧公式/说明 -->
            <text id="scene1-formula-1" class="scene1-formula scene1-hidden" x="620" y="200" text-anchor="start">qE₁L = ½mv₁²</text>
            <text id="scene1-desc-1" class="scene1-desc scene1-hidden" x="620" y="260" text-anchor="start">水平方向：匀速直线运动</text>
            <text id="scene1-desc-2a" class="scene1-desc scene1-hidden" x="620" y="295" text-anchor="start">竖直方向：初速为零的</text>
            <text id="scene1-desc-2b" class="scene1-desc scene1-hidden" x="620" y="330" text-anchor="start">匀加速直线运动</text>
            <text id="scene1-qcoord" class="scene1-desc scene1-hidden" x="620" y="370" text-anchor="start">Q(x_Q, 0)</text>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/4</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        var currentStep = 0;
        var totalSteps = 4;

        var btnPrev = document.getElementById('scene1-btn-prev');
        var btnNext = document.getElementById('scene1-btn-next');
        var indicator = document.getElementById('scene1-step-indicator');

        // 各步骤需要显示的元素ID列表
        var stepElements = [
            // 步骤0：初始条件
            [],
            // 步骤1：E₁区域运动
            ['scene1-traj-seg1', 'scene1-vec-v1', 'scene1-label-v1', 'scene1-formula-1'],
            // 步骤2：E₂区域运动
            ['scene1-traj-seg1', 'scene1-vec-v1', 'scene1-label-v1', 'scene1-formula-1',
             'scene1-traj-seg2', 'scene1-vec-vq', 'scene1-label-vq', 'scene1-desc-1', 'scene1-desc-2a', 'scene1-desc-2b'],
            // 步骤3：完整总结
            ['scene1-traj-seg1', 'scene1-vec-v1', 'scene1-label-v1', 'scene1-formula-1',
             'scene1-traj-seg2', 'scene1-vec-vq', 'scene1-label-vq', 'scene1-desc-1', 'scene1-desc-2a', 'scene1-desc-2b',
             'scene1-qcoord']
        ];

        // 步骤3高亮元素
        var highlightIds = ['scene1-label-v1', 'scene1-label-vq', 'scene1-qcoord'];

        function updateUI() {
            // 更新指示器
            indicator.textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;

            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps - 1);

            // 隐藏所有步骤相关元素
            var allIds = [];
            for (var i = 0; i < stepElements.length; i++) {
                allIds = allIds.concat(stepElements[i]);
            }
            // 去重
            var uniqueIds = [];
            for (var j = 0; j < allIds.length; j++) {
                if (uniqueIds.indexOf(allIds[j]) === -1) {
                    uniqueIds.push(allIds[j]);
                }
            }
            for (var k = 0; k < uniqueIds.length; k++) {
                var el = document.getElementById(uniqueIds[k]);
                if (el) {
                    el.classList.add('scene1-hidden');
                    el.style.display = 'none';
                    el.style.opacity = '0';
                    // 移除高亮样式
                    if (highlightIds.indexOf(uniqueIds[k]) !== -1) {
                        el.classList.remove('scene1-highlight-text');
                    }
                }
            }

            // 显示当前步骤元素
            var showIds = stepElements[currentStep];
            for (var m = 0; m < showIds.length; m++) {
                var el2 = document.getElementById(showIds[m]);
                if (el2) {
                    el2.classList.remove('scene1-hidden');
                    el2.style.display = 'block';
                    el2.style.opacity = '1';
                    // 步骤3添加高亮样式
                    if (currentStep === 3 && highlightIds.indexOf(showIds[m]) !== -1) {
                        el2.classList.add('scene1-highlight-text');
                    }
                }
            }
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateUI();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateUI();
            }
        });

        // 初始化
        updateUI();
    })();
    </script>
</body>
</html>
