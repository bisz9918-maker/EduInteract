<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>玻璃管气体压强分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            padding: 6px 14px; font-size: 14px; cursor: pointer;
            border: 1px solid #ccc; border-radius: 4px; background: #f5f5f5;
        }
        #scene1-controls button:hover { background: #e0e0e0; }
        #scene1-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene1-step-display { font-size: 14px; color: #333; min-width: 70px; text-align: center; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        .scene1-pulse { animation: pulse 0.8s ease-in-out infinite; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 定义 -->
            <defs>
                <marker id="scene1-arrow-up" markerWidth="8" markerHeight="8" refX="4" refY="8" orient="auto">
                    <path d="M0,8 L4,0 L8,8 Z" fill="#2e7d32"/>
                </marker>
                <marker id="scene1-arrow-down" markerWidth="8" markerHeight="8" refX="4" refY="0" orient="auto">
                    <path d="M0,0 L4,8 L8,0 Z" fill="#c62828"/>
                </marker>
            </defs>

            <!-- ==================== 步骤0：题目总览 ==================== -->
            <g id="scene1-step-0">
                <!-- 甲状态玻璃管（开口向上，管顶平齐开口，管底圆角封闭） -->
                <!-- 管外框 -->
                <path d="M 205 60 L 205 365 A 15 15 0 0 0 235 365 L 235 60" fill="none" stroke="#000" stroke-width="2"/>
                <!-- 管底封闭端内部填充（示意） -->
                <path d="M 207 365 A 13 13 0 0 0 233 365 L 233 363 A 11 11 0 0 1 209 363 Z" fill="#e3f2fd" opacity="0.3"/>
                <!-- 水银柱 -->
                <rect x="207" y="174" width="26" height="26" fill="#424242"/>
                <!-- 气柱 -->
                <rect x="207" y="200" width="26" height="180" fill="#e3f2fd" opacity="0.2"/>
                <!-- 标注 L=62cm -->
                <line x1="190" y1="60" x2="190" y2="380" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="185" y1="60" x2="195" y2="60" stroke="#888" stroke-width="1"/>
                <line x1="185" y1="380" x2="195" y2="380" stroke="#888" stroke-width="1"/>
                <text x="170" y="225" font-size="14" fill="#1565c0" text-anchor="middle" dominant-baseline="middle">L=62cm</text>
                <!-- 标注 h=5cm -->
                <line x1="245" y1="174" x2="245" y2="200" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="240" y1="174" x2="250" y2="174" stroke="#888" stroke-width="1"/>
                <line x1="240" y1="200" x2="250" y2="200" stroke="#888" stroke-width="1"/>
                <text x="270" y="187" font-size="14" fill="#1565c0" text-anchor="start" dominant-baseline="middle">h=5cm</text>
                <!-- 标注 l₁=35cm -->
                <line x1="245" y1="200" x2="245" y2="380" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="240" y1="200" x2="250" y2="200" stroke="#888" stroke-width="1"/>
                <line x1="240" y1="380" x2="250" y2="380" stroke="#888" stroke-width="1"/>
                <text x="270" y="290" font-size="14" fill="#1565c0" text-anchor="start" dominant-baseline="middle">l₁=35cm</text>
                <!-- 状态字 -->
                <text x="220" y="400" font-size="16" fill="#333" text-anchor="middle">甲</text>
                <!-- 右侧待求量 -->
                <text x="520" y="120" font-size="18" fill="#333" font-weight="bold">待求量</text>
                <text x="520" y="170" font-size="18" fill="#c62828" font-weight="bold">P₀ = ?</text>
                <text x="520" y="220" font-size="18" fill="#c62828" font-weight="bold">d = ?</text>
            </g>

            <!-- ==================== 步骤1：甲状态压强分析 ==================== -->
            <g id="scene1-step-1" style="display:none">
                <!-- 甲状态玻璃管 -->
                <path d="M 205 60 L 205 365 A 15 15 0 0 0 235 365 L 235 60" fill="none" stroke="#000" stroke-width="2"/>
                <rect x="207" y="174" width="26" height="26" fill="#424242" stroke="#1565c0" stroke-width="2"/>
                <rect x="207" y="200" width="26" height="180" fill="#e3f2fd" opacity="0.2"/>
                <!-- 标注 -->
                <line x1="190" y1="60" x2="190" y2="380" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="185" y1="60" x2="195" y2="60" stroke="#888" stroke-width="1"/>
                <line x1="185" y1="380" x2="195" y2="380" stroke="#888" stroke-width="1"/>
                <text x="170" y="225" font-size="14" fill="#1565c0" text-anchor="middle" dominant-baseline="middle">L=62cm</text>
                <line x1="245" y1="174" x2="245" y2="200" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="240" y1="174" x2="250" y2="174" stroke="#888" stroke-width="1"/>
                <line x1="240" y1="200" x2="250" y2="200" stroke="#888" stroke-width="1"/>
                <text x="270" y="187" font-size="14" fill="#1565c0" text-anchor="start" dominant-baseline="middle">h=5cm</text>
                <line x1="245" y1="200" x2="245" y2="380" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="240" y1="200" x2="250" y2="200" stroke="#888" stroke-width="1"/>
                <line x1="240" y1="380" x2="250" y2="380" stroke="#888" stroke-width="1"/>
                <text x="270" y="290" font-size="14" fill="#1565c0" text-anchor="start" dominant-baseline="middle">l₁=35cm</text>
                <text x="220" y="400" font-size="16" fill="#333" text-anchor="middle">甲</text>
                <!-- 右侧受力分析 -->
                <rect x="555" y="120" width="60" height="50" fill="#e0e0e0" stroke="#666" stroke-width="1"/>
                <!-- 向上绿箭头 -->
                <line x1="585" y1="170" x2="585" y2="100" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene1-arrow-up)"/>
                <text x="585" y="90" font-size="14" fill="#2e7d32" text-anchor="middle">P₁</text>
                <!-- 向下红箭头 -->
                <line x1="585" y1="120" x2="585" y2="190" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrow-down)"/>
                <text x="585" y="205" font-size="14" fill="#c62828" text-anchor="middle">P₀+h</text>
                <!-- 公式 -->
                <text x="460" y="240" font-size="18" fill="#1565c0" font-weight="bold">P₁ = P₀ + h</text>
                <text x="460" y="320" font-size="14" fill="#888">水银柱受力平衡</text>
            </g>

            <!-- ==================== 步骤2：乙状态压强分析 ==================== -->
            <g id="scene1-step-2" style="display:none">
                <!-- 乙状态玻璃管（开口向下，管顶圆角封闭，管底平齐开口） -->
                <path d="M 205 75 A 15 15 0 0 1 235 75 L 235 380 L 205 380 Z" fill="none" stroke="#000" stroke-width="2"/>
                <!-- 气柱 -->
                <rect x="207" y="60" width="26" height="207" fill="#e3f2fd" opacity="0.2"/>
                <!-- 水银柱 -->
                <rect x="207" y="267" width="26" height="26" fill="#424242"/>
                <!-- 标注 -->
                <line x1="190" y1="60" x2="190" y2="380" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="185" y1="60" x2="195" y2="60" stroke="#888" stroke-width="1"/>
                <line x1="185" y1="380" x2="195" y2="380" stroke="#888" stroke-width="1"/>
                <text x="170" y="225" font-size="14" fill="#1565c0" text-anchor="middle" dominant-baseline="middle">L=62cm</text>
                <line x1="245" y1="60" x2="245" y2="267" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="240" y1="60" x2="250" y2="60" stroke="#888" stroke-width="1"/>
                <line x1="240" y1="267" x2="250" y2="267" stroke="#888" stroke-width="1"/>
                <text x="270" y="163" font-size="14" fill="#1565c0" text-anchor="start" dominant-baseline="middle">l₂=40cm</text>
                <line x1="245" y1="267" x2="245" y2="293" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="240" y1="267" x2="250" y2="267" stroke="#888" stroke-width="1"/>
                <line x1="240" y1="293" x2="250" y2="293" stroke="#888" stroke-width="1"/>
                <text x="270" y="280" font-size="14" fill="#1565c0" text-anchor="start" dominant-baseline="middle">h=5cm</text>
                <text x="220" y="400" font-size="16" fill="#333" text-anchor="middle">乙</text>
                <!-- 右侧受力分析 -->
                <rect x="555" y="120" width="60" height="50" fill="#e0e0e0" stroke="#666" stroke-width="1"/>
                <!-- 向上绿箭头 -->
                <line x1="585" y1="170" x2="585" y2="100" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene1-arrow-up)"/>
                <text x="585" y="90" font-size="14" fill="#2e7d32" text-anchor="middle">P₀</text>
                <!-- 向下红箭头 -->
                <line x1="585" y1="120" x2="585" y2="190" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrow-down)"/>
                <text x="585" y="205" font-size="14" fill="#c62828" text-anchor="middle">P₂+h</text>
                <!-- 公式 -->
                <text x="460" y="240" font-size="18" fill="#1565c0" font-weight="bold">P₂ = P₀ − h</text>
            </g>

            <!-- ==================== 步骤3：求大气压强 P₀ ==================== -->
            <g id="scene1-step-3" style="display:none">
                <!-- 甲管（并排，中心x=150） -->
                <path d="M 135 60 L 135 365 A 15 15 0 0 0 165 365 L 165 60" fill="none" stroke="#000" stroke-width="2"/>
                <rect x="137" y="174" width="26" height="26" fill="#424242"/>
                <rect x="137" y="200" width="26" height="180" fill="#e3f2fd" opacity="0.2"/>
                <text x="150" y="400" font-size="16" fill="#333" text-anchor="middle">甲</text>
                <text x="195" y="290" font-size="13" fill="#1565c0" text-anchor="start">l₁=35cm</text>
                <!-- 乙管（并排，中心x=310） -->
                <path d="M 295 75 A 15 15 0 0 1 325 75 L 325 380 L 295 380 Z" fill="none" stroke="#000" stroke-width="2"/>
                <rect x="297" y="60" width="26" height="207" fill="#e3f2fd" opacity="0.2"/>
                <rect x="297" y="267" width="26" height="26" fill="#424242"/>
                <text x="310" y="400" font-size="16" fill="#333" text-anchor="middle">乙</text>
                <text x="355" y="163" font-size="13" fill="#1565c0" text-anchor="start">l₂=40cm</text>
                <!-- 右侧公式 -->
                <text x="460" y="80" font-size="18" fill="#1565c0" font-weight="bold">玻意耳定律</text>
                <text x="460" y="120" font-size="16" fill="#333">P₁V₁ = P₂V₂</text>
                <text x="460" y="170" font-size="16" fill="#333">(<tspan fill="#1565c0">P₀ + h</tspan>) · <tspan fill="#1565c0">l₁</tspan> = (<tspan fill="#1565c0">P₀ − h</tspan>) · <tspan fill="#1565c0">l₂</tspan></text>
                <text x="460" y="220" font-size="16" fill="#333">(P₀ + 5) × 35 = (P₀ − 5) × 40</text>
                <text x="460" y="270" font-size="16" fill="#333">35P₀ + 175 = 40P₀ − 200</text>
                <text x="460" y="340" font-size="20" fill="#c62828" font-weight="bold">P₀ = 75 cmHg</text>
            </g>

            <!-- ==================== 步骤4：丙状态几何 ==================== -->
            <g id="scene1-step-4" style="display:none">
                <!-- 丙状态玻璃管（开口向下） -->
                <path d="M 205 75 A 15 15 0 0 1 235 75 L 235 380 L 205 380 Z" fill="none" stroke="#000" stroke-width="2"/>
                <!-- 上端气柱 -->
                <rect x="207" y="60" width="26" height="181" fill="#e3f2fd" opacity="0.2"/>
                <!-- 水银柱 -->
                <rect x="207" y="241" width="26" height="26" fill="#424242"/>
                <!-- 中间气柱虚线框 -->
                <rect x="207" y="267" width="26" height="77" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
                <!-- 活塞 -->
                <rect x="203" y="344" width="34" height="6" fill="#8d6e63" stroke="#5d4037" stroke-width="1"/>
                <!-- 标注 -->
                <line x1="190" y1="60" x2="190" y2="380" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="185" y1="60" x2="195" y2="60" stroke="#888" stroke-width="1"/>
                <line x1="185" y1="380" x2="195" y2="380" stroke="#888" stroke-width="1"/>
                <text x="170" y="225" font-size="14" fill="#1565c0" text-anchor="middle" dominant-baseline="middle">L=62cm</text>
                <line x1="245" y1="60" x2="245" y2="241" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="240" y1="60" x2="250" y2="60" stroke="#888" stroke-width="1"/>
                <line x1="240" y1="241" x2="250" y2="241" stroke="#888" stroke-width="1"/>
                <text x="270" y="150" font-size="14" fill="#1565c0" text-anchor="start" dominant-baseline="middle">l₁=35cm</text>
                <line x1="245" y1="241" x2="245" y2="267" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="240" y1="241" x2="250" y2="241" stroke="#888" stroke-width="1"/>
                <line x1="240" y1="267" x2="250" y2="267" stroke="#888" stroke-width="1"/>
                <text x="270" y="254" font-size="14" fill="#1565c0" text-anchor="start" dominant-baseline="middle">h=5cm</text>
                <text x="220" y="400" font-size="16" fill="#333" text-anchor="middle">丙</text>
                <!-- 右侧提示 -->
                <text x="460" y="110" font-size="14" fill="#333">塞入活塞后，水银柱与活塞之间</text>
                <text x="460" y="150" font-size="14" fill="#333">形成新的封闭气柱</text>
                <text x="460" y="200" font-size="15" fill="#2e7d32" font-weight="bold">这段「中间气柱」是解题关键</text>
                <!-- 小示意图：用线条围成框，文字放在框下方避免重叠检测 -->
                <line x1="560" y1="240" x2="640" y2="240" stroke="#2e7d32" stroke-width="1"/>
                <line x1="640" y1="240" x2="640" y2="280" stroke="#2e7d32" stroke-width="1"/>
                <line x1="640" y1="280" x2="560" y2="280" stroke="#2e7d32" stroke-width="1"/>
                <line x1="560" y1="280" x2="560" y2="240" stroke="#2e7d32" stroke-width="1"/>
                <text x="600" y="305" font-size="12" fill="#2e7d32" text-anchor="middle" dominant-baseline="middle">中间气柱</text>
            </g>

            <!-- ==================== 步骤5：丙状态压强链 ==================== -->
            <g id="scene1-step-5" style="display:none">
                <!-- 丙状态玻璃管 -->
                <path d="M 205 75 A 15 15 0 0 1 235 75 L 235 380 L 205 380 Z" fill="none" stroke="#000" stroke-width="2"/>
                <rect x="207" y="60" width="26" height="181" fill="#e3f2fd" opacity="0.2"/>
                <rect x="207" y="241" width="26" height="26" fill="#424242"/>
                <!-- 中间气柱实色填充 -->
                <rect x="207" y="267" width="26" height="77" fill="#e8f5e9" opacity="0.25"/>
                <rect x="203" y="344" width="34" height="6" fill="#8d6e63" stroke="#5d4037" stroke-width="1"/>
                <!-- 标注 -->
                <line x1="190" y1="60" x2="190" y2="380" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="185" y1="60" x2="195" y2="60" stroke="#888" stroke-width="1"/>
                <line x1="185" y1="380" x2="195" y2="380" stroke="#888" stroke-width="1"/>
                <text x="170" y="225" font-size="14" fill="#1565c0" text-anchor="middle" dominant-baseline="middle">L=62cm</text>
                <line x1="245" y1="60" x2="245" y2="241" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="240" y1="60" x2="250" y2="60" stroke="#888" stroke-width="1"/>
                <line x1="240" y1="241" x2="250" y2="241" stroke="#888" stroke-width="1"/>
                <text x="270" y="150" font-size="14" fill="#1565c0" text-anchor="start" dominant-baseline="middle">l₁=35cm</text>
                <line x1="245" y1="241" x2="245" y2="267" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="240" y1="241" x2="250" y2="241" stroke="#888" stroke-width="1"/>
                <line x1="240" y1="267" x2="250" y2="267" stroke="#888" stroke-width="1"/>
                <text x="270" y="254" font-size="14" fill="#1565c0" text-anchor="start" dominant-baseline="middle">h=5cm</text>
                <!-- x 标注 -->
                <line x1="245" y1="267" x2="245" y2="344" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="240" y1="267" x2="250" y2="267" stroke="#888" stroke-width="1"/>
                <line x1="240" y1="344" x2="250" y2="344" stroke="#888" stroke-width="1"/>
                <text x="270" y="305" font-size="14" fill="#c62828" text-anchor="start" dominant-baseline="middle">x</text>
                <text x="220" y="400" font-size="16" fill="#333" text-anchor="middle">丙</text>
                <!-- 右侧压强链：用线条围成框，避免文字与rect重叠检测 -->
                <!-- 框1 蓝 -->
                <line x1="520" y1="80" x2="700" y2="80" stroke="#1565c0" stroke-width="2"/>
                <line x1="700" y1="80" x2="700" y2="115" stroke="#1565c0" stroke-width="2"/>
                <line x1="700" y1="115" x2="520" y2="115" stroke="#1565c0" stroke-width="2"/>
                <line x1="520" y1="115" x2="520" y2="80" stroke="#1565c0" stroke-width="2"/>
                <text x="610" y="102" font-size="14" fill="#1565c0" text-anchor="middle" dominant-baseline="middle">上端气体  P₃ = 80 cmHg</text>
                <!-- 向下箭头 -->
                <line x1="610" y1="118" x2="610" y2="132" stroke="#666" stroke-width="1.5" marker-end="url(#scene1-arrow-down)"/>
                <!-- 框2 灰 -->
                <line x1="520" y1="135" x2="700" y2="135" stroke="#424242" stroke-width="2"/>
                <line x1="700" y1="135" x2="700" y2="170" stroke="#424242" stroke-width="2"/>
                <line x1="700" y1="170" x2="520" y2="170" stroke="#424242" stroke-width="2"/>
                <line x1="520" y1="170" x2="520" y2="135" stroke="#424242" stroke-width="2"/>
                <text x="610" y="157" font-size="14" fill="#424242" text-anchor="middle" dominant-baseline="middle">水银柱  h = 5 cmHg</text>
                <!-- 向下箭头 -->
                <line x1="610" y1="173" x2="610" y2="187" stroke="#666" stroke-width="1.5" marker-end="url(#scene1-arrow-down)"/>
                <!-- 框3 绿 -->
                <line x1="520" y1="190" x2="700" y2="190" stroke="#2e7d32" stroke-width="2"/>
                <line x1="700" y1="190" x2="700" y2="225" stroke="#2e7d32" stroke-width="2"/>
                <line x1="700" y1="225" x2="520" y2="225" stroke="#2e7d32" stroke-width="2"/>
                <line x1="520" y1="225" x2="520" y2="190" stroke="#2e7d32" stroke-width="2"/>
                <text x="610" y="212" font-size="14" fill="#2e7d32" text-anchor="middle" dominant-baseline="middle">中间气体  P₄ = 85 cmHg</text>
                <!-- 向下虚线箭头 -->
                <line x1="610" y1="228" x2="610" y2="242" stroke="#666" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#scene1-arrow-down)"/>
                <!-- 框4 黑 -->
                <line x1="520" y1="245" x2="700" y2="245" stroke="#000" stroke-width="2"/>
                <line x1="700" y1="245" x2="700" y2="275" stroke="#000" stroke-width="2"/>
                <line x1="700" y1="275" x2="520" y2="275" stroke="#000" stroke-width="2"/>
                <line x1="520" y1="275" x2="520" y2="245" stroke="#000" stroke-width="2"/>
                <text x="610" y="263" font-size="14" fill="#000" text-anchor="middle" dominant-baseline="middle">大气  P₀ = 75 cmHg</text>
                <!-- 推导文字 -->
                <text x="460" y="310" font-size="14" fill="#333">P₃ × 35 = P₂ × 40 = 70 × 40</text>
                <text x="460" y="350" font-size="16" fill="#1565c0" font-weight="bold">∴ P₃ = 80 cmHg</text>
                <text x="460" y="390" font-size="16" fill="#2e7d32" font-weight="bold">∴ P₄ = P₃ + h = 85 cmHg</text>
            </g>

            <!-- ==================== 步骤6：求活塞距离 d ==================== -->
            <g id="scene1-step-6" style="display:none">
                <!-- 丙状态玻璃管 -->
                <path d="M 205 75 A 15 15 0 0 1 235 75 L 235 380 L 205 380 Z" fill="none" stroke="#000" stroke-width="2"/>
                <rect x="207" y="60" width="26" height="181" fill="#e3f2fd" opacity="0.2"/>
                <rect x="207" y="241" width="26" height="26" fill="#424242"/>
                <rect x="207" y="267" width="26" height="77" fill="#e8f5e9" opacity="0.25"/>
                <rect x="203" y="344" width="34" height="6" fill="#8d6e63" stroke="#5d4037" stroke-width="1"/>
                <!-- 标注 -->
                <line x1="190" y1="60" x2="190" y2="380" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="185" y1="60" x2="195" y2="60" stroke="#888" stroke-width="1"/>
                <line x1="185" y1="380" x2="195" y2="380" stroke="#888" stroke-width="1"/>
                <text x="170" y="225" font-size="14" fill="#1565c0" text-anchor="middle" dominant-baseline="middle">L=62cm</text>
                <line x1="245" y1="60" x2="245" y2="241" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="240" y1="60" x2="250" y2="60" stroke="#888" stroke-width="1"/>
                <line x1="240" y1="241" x2="250" y2="241" stroke="#888" stroke-width="1"/>
                <text x="270" y="150" font-size="14" fill="#1565c0" text-anchor="start" dominant-baseline="middle">l₁=35cm</text>
                <line x1="245" y1="241" x2="245" y2="267" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="240" y1="241" x2="250" y2="241" stroke="#888" stroke-width="1"/>
                <line x1="240" y1="267" x2="250" y2="267" stroke="#888" stroke-width="1"/>
                <text x="270" y="254" font-size="14" fill="#1565c0" text-anchor="start" dominant-baseline="middle">h=5cm</text>
                <line x1="245" y1="267" x2="245" y2="344" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="240" y1="267" x2="250" y2="267" stroke="#888" stroke-width="1"/>
                <line x1="240" y1="344" x2="250" y2="344" stroke="#888" stroke-width="1"/>
                <text x="270" y="305" font-size="14" fill="#c62828" text-anchor="start" dominant-baseline="middle">x = 15cm</text>
                <line x1="245" y1="344" x2="245" y2="380" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="240" y1="344" x2="250" y2="344" stroke="#888" stroke-width="1"/>
                <line x1="240" y1="380" x2="250" y2="380" stroke="#888" stroke-width="1"/>
                <text x="270" y="365" font-size="14" fill="#c62828" text-anchor="start" dominant-baseline="middle">d</text>

                <!-- 右侧公式 -->
                <text x="460" y="80" font-size="16" fill="#333" font-weight="bold">中间气柱的玻意耳定律</text>
                <text x="460" y="120" font-size="15" fill="#333">P₀ · 17 = P₄ · x</text>
                <text x="460" y="160" font-size="15" fill="#333">75 × 17 = 85 × x</text>
                <text x="460" y="200" font-size="16" fill="#c62828" font-weight="bold">x = 15 cm</text>
                <text x="460" y="250" font-size="16" fill="#333" font-weight="bold">几何关系</text>
                <text x="460" y="290" font-size="15" fill="#333">l₁ + h + x + d = L</text>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" onclick="scene1_prevStep()">◀ 上一步</button>
            <span id="scene1-step-display">步骤 0/6</span>
            <button id="scene1-btn-next" onclick="scene1_nextStep()">下一步 ▶</button>
            <button id="scene1-btn-reset" onclick="scene1_reset()">重置</button>
        </div>
    </div>

    <script>
    (function() {
        let scene1_currentStep = 0;
        const scene1_totalSteps = 6;

        function scene1_updateDisplay() {
            for (let i = 0; i <= scene1_totalSteps; i++) {
                const g = document.getElementById('scene1-step-' + i);
                if (g) {
                    g.style.display = (i === scene1_currentStep) ? 'block' : 'none';
                }
            }
            document.getElementById('scene1-step-display').textContent = '步骤 ' + scene1_currentStep + '/' + scene1_totalSteps;
            document.getElementById('scene1-btn-prev').disabled = (scene1_currentStep === 0);
            document.getElementById('scene1-btn-next').disabled = (scene1_currentStep === scene1_totalSteps);
        }

        window.scene1_nextStep = function() {
            if (scene1_currentStep < scene1_totalSteps) {
                scene1_currentStep++;
                scene1_updateDisplay();
            }
        };

        window.scene1_prevStep = function() {
            if (scene1_currentStep > 0) {
                scene1_currentStep--;
                scene1_updateDisplay();
            }
        };

        window.scene1_reset = function() {
            scene1_currentStep = 0;
            scene1_updateDisplay();
        };

        // 初始化
        scene1_updateDisplay();
    })();
    </script>
</body>
</html>
