<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - A球隔离受力分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene2-controls button {
            padding: 6px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc;
            border-radius: 4px; background: #f5f5f5; transition: background 0.2s;
        }
        #scene2-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene2-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene2-step-indicator { font-size: 14px; color: #333; min-width: 70px; text-align: center; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" viewBox="0 0 800 500" style="display: block;">
            <defs>
                <marker id="scene2-arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#c62828" />
                </marker>
                <marker id="scene2-arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#1565c0" />
                </marker>
                <marker id="scene2-arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L7,3 z" fill="#888888" />
                </marker>
            </defs>

            <!-- 静态基础元素 -->
            <circle cx="250" cy="300" r="15" fill="#ffffff" stroke="#888888" stroke-width="2" opacity="0.3" />
            <circle cx="380" cy="225" r="15" fill="#ffffff" stroke="#888888" stroke-width="2" opacity="0.3" />
            <circle cx="250" cy="150" r="15" fill="#ffffff" stroke="#000000" stroke-width="3" />

            <line x1="250" y1="150" x2="250" y2="300" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.3" />
            <line x1="250" y1="150" x2="380" y2="225" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.3" />
            <line x1="250" y1="300" x2="380" y2="225" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.3" />

            <text x="220" y="135" font-size="16" fill="#000000" font-weight="bold">A</text>
            <text x="200" y="315" font-size="16" fill="#000000" font-weight="bold" opacity="0.3">B</text>
            <text x="395" y="215" font-size="16" fill="#000000" font-weight="bold" opacity="0.3">C</text>

            <!-- 步骤1: F_BA -->
            <line class="scene2-s1" x1="250" y1="150" x2="250" y2="90" stroke="#c62828" stroke-width="2.5" marker-end="url(#scene2-arrow-red)" />
            <text class="scene2-s1" x="155" y="105" font-size="14" fill="#c62828" font-weight="bold">F_BA</text>

            <!-- 步骤2: 错误试探力 -->
            <line class="scene2-s2" x1="250" y1="150" x2="198" y2="180" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" opacity="0.5" marker-end="url(#scene2-arrow-gray)" />
            <text class="scene2-s2" x="155" y="165" font-size="14" fill="#c62828" font-weight="bold">矛盾</text>

            <!-- 步骤3: F_CA -->
            <line class="scene2-s3" x1="250" y1="150" x2="354" y2="210" stroke="#1565c0" stroke-width="2.5" marker-end="url(#scene2-arrow-blue)" />
            <text class="scene2-s3" x="430" y="100" font-size="14" fill="#1565c0" font-weight="bold">F_CA</text>

            <!-- 步骤4: 坐标系 -->
            <line class="scene2-s4" x1="250" y1="150" x2="420" y2="150" stroke="#888888" stroke-width="1" marker-end="url(#scene2-arrow-gray)" />
            <text class="scene2-s4" x="425" y="142" font-size="14" fill="#888888">x</text>
            <line class="scene2-s4" x1="250" y1="150" x2="250" y2="30" stroke="#888888" stroke-width="1" marker-end="url(#scene2-arrow-gray)" />
            <text class="scene2-s4" x="228" y="42" font-size="14" fill="#888888">y</text>
            <path class="scene2-s4" d="M 285 150 A 35 35 0 0 1 280.31 167.5" fill="none" stroke="#000000" stroke-width="1.5" />
            <text class="scene2-s4" x="295" y="138" font-size="14" fill="#000000">30°</text>

            <!-- 步骤5: 投影分解线 -->
            <line class="scene2-s5" x1="354" y1="210" x2="354" y2="150" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" />
            <line class="scene2-s5" x1="354" y1="210" x2="250" y2="210" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" />
            <text class="scene2-s5" x="302" y="95" font-size="13" fill="#000000">F_CA·cos30°</text>
            <text class="scene2-s5" x="265" y="330" font-size="13" fill="#000000">F_CA·sin30°</text>

            <!-- 步骤6: 竖直方向方程 -->
            <text class="scene2-s6" x="500" y="120" font-size="15" fill="#000000" font-weight="bold">竖直方向平衡：</text>
            <text class="scene2-s6" x="500" y="158" font-size="14" fill="#000000">F_BA = F_CA·sin30°</text>
            <text class="scene2-s6" x="500" y="205" font-size="16" fill="#2e7d32" font-weight="bold">Q = 2q（负电）</text>

            <!-- 步骤7: 水平方向方程 -->
            <text class="scene2-s7" x="500" y="265" font-size="15" fill="#000000" font-weight="bold">水平方向：</text>
            <text class="scene2-s7" x="500" y="300" font-size="14" fill="#000000">F_CA·cos30° = ma</text>
            <text class="scene2-s7" x="500" y="335" font-size="14" fill="#000000">a = √3 kq²/(mr²)</text>
        </svg>

        <div id="scene2-controls">
            <button id="scene2-btn-prev">◀ 上一步</button>
            <span id="scene2-step-indicator">步骤 0/7</span>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        const MAX_STEP = 7;
        let currentStep = 0;

        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        const stepIndicator = document.getElementById('scene2-step-indicator');

        function renderStep() {
            stepIndicator.textContent = '步骤 ' + currentStep + '/' + MAX_STEP;
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === MAX_STEP);

            for (let s = 1; s <= MAX_STEP; s++) {
                const els = document.querySelectorAll('.scene2-s' + s);
                const show = (currentStep >= s);
                els.forEach(function(el) {
                    el.style.display = show ? 'block' : 'none';
                });
            }

            // 步骤2只在步骤2显示
            const s2els = document.querySelectorAll('.scene2-s2');
            s2els.forEach(function(el) {
                el.style.display = (currentStep === 2) ? 'block' : 'none';
            });
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) { currentStep--; renderStep(); }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < MAX_STEP) { currentStep++; renderStep(); }
        });

        renderStep();
    })();
    </script>
</body>
</html>
