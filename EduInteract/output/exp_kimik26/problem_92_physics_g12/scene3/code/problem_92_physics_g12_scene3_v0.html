<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 3 - 点电荷电场中的曲线运动</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 16px; z-index: 10; }
        #scene3-controls button {
            padding: 6px 18px; font-size: 14px; cursor: pointer;
            border: 1px solid #333; border-radius: 4px; background: #f5f5f5;
        }
        #scene3-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene3-step-indicator { font-size: 14px; color: #333; min-width: 80px; text-align: center; }
        svg { display: block; }
        .scene3-hidden { display: none; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg id="scene3-svg" width="800" height="500" viewBox="0 0 800 500">
            <defs>
                <!-- 箭头标记 -->
                <marker id="scene3-arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
                    <path d="M0,0 L10,4 L0,8 L2,4 Z" fill="#2e7d32"/>
                </marker>
                <marker id="scene3-arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
                    <path d="M0,0 L10,4 L0,8 L2,4 Z" fill="#1565c0"/>
                </marker>
                <marker id="scene3-arrow-black" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
                    <path d="M0,0 L10,4 L0,8 L2,4 Z" fill="#000000"/>
                </marker>
            </defs>

            <!-- 步骤0：基础空间框架（始终显示） -->
            <g id="scene3-step0">
                <!-- PS界面：灰色竖直虚线 -->
                <line id="scene3-ps-line" x1="100" y1="180" x2="100" y2="320" stroke="#888888" stroke-width="1" stroke-dasharray="6,4"/>
                <!-- 中心线：灰色水平虚线 -->
                <line id="scene3-center-line" x1="50" y1="250" x2="750" y2="250" stroke="#888888" stroke-width="1" stroke-dasharray="6,4"/>
                <!-- O点 -->
                <circle id="scene3-o-point" cx="320" cy="250" r="4" fill="#000000"/>
                <!-- 荧光屏EF -->
                <rect id="scene3-ef-rect" x="718" y="220" width="4" height="60" fill="#dddddd"/>
                <line id="scene3-ef-line" x1="720" y1="220" x2="720" y2="280" stroke="#000000" stroke-width="2"/>

                <!-- s'双向箭头：PS到O，y=120 -->
                <line id="scene3-sp-arrow-line" x1="100" y1="120" x2="320" y2="120" stroke="#000000" stroke-width="1" marker-start="url(#scene3-arrow-black)" marker-end="url(#scene3-arrow-black)"/>
                <line id="scene3-sp-tick1" x1="100" y1="115" x2="100" y2="125" stroke="#000000" stroke-width="1"/>
                <line id="scene3-sp-tick2" x1="320" y1="115" x2="320" y2="125" stroke="#000000" stroke-width="1"/>

                <!-- D双向箭头：O到EF，y=90 -->
                <line id="scene3-d-arrow-line" x1="320" y1="90" x2="720" y2="90" stroke="#000000" stroke-width="1" marker-start="url(#scene3-arrow-black)" marker-end="url(#scene3-arrow-black)"/>
                <line id="scene3-d-tick1" x1="320" y1="85" x2="320" y2="95" stroke="#000000" stroke-width="1"/>
                <line id="scene3-d-tick2" x1="720" y1="85" x2="720" y2="95" stroke="#000000" stroke-width="1"/>

                <!-- 标签（调整位置避免与图形重叠） -->
                <text id="scene3-label-p" x="100" y="160" text-anchor="middle" font-size="14" fill="#000000">P</text>
                <text id="scene3-label-s" x="115" y="390" text-anchor="start" font-size="14" fill="#000000">S</text>
                <!-- O标签左移并上移，避免与s'箭头线重叠 -->
                <text id="scene3-label-o" x="260" y="145" text-anchor="end" font-size="14" fill="#000000">O</text>
                <text id="scene3-label-e" x="720" y="210" text-anchor="middle" font-size="14" fill="#000000">E</text>
                <text id="scene3-label-f" x="740" y="320" text-anchor="start" font-size="14" fill="#000000">F</text>
                <text id="scene3-label-sp" x="210" y="105" text-anchor="middle" font-size="14" fill="#000000">s′</text>
                <text id="scene3-label-d" x="520" y="75" text-anchor="middle" font-size="14" fill="#000000">D</text>
            </g>

            <!-- 步骤1：初态标注 -->
            <g id="scene3-step1" class="scene3-hidden">
                <!-- 粒子起点 -->
                <circle id="scene3-particle-start" cx="100" cy="320" r="5" fill="#c62828"/>
                <!-- 初速度v箭头 -->
                <line id="scene3-v-arrow" x1="100" y1="320" x2="140" y2="350" stroke="#2e7d32" stroke-width="1.2" marker-end="url(#scene3-arrow-green)"/>
                <!-- Y双向箭头：竖直，x=85 -->
                <line id="scene3-y-arrow-line" x1="85" y1="250" x2="85" y2="320" stroke="#000000" stroke-width="1" marker-start="url(#scene3-arrow-black)" marker-end="url(#scene3-arrow-black)"/>
                <line id="scene3-y-tick1" x1="80" y1="250" x2="90" y2="250" stroke="#000000" stroke-width="1"/>
                <line id="scene3-y-tick2" x1="80" y1="320" x2="90" y2="320" stroke="#000000" stroke-width="1"/>
                <!-- 标签 -->
                <text id="scene3-label-y" x="55" y="260" text-anchor="end" font-size="14" fill="#000000">Y</text>
                <text id="scene3-label-v" x="155" y="390" text-anchor="start" font-size="14" fill="#2e7d32">v</text>
            </g>

            <!-- 步骤2：电场分布 -->
            <g id="scene3-step2" class="scene3-hidden">
                <!-- 电场区域填充 -->
                <circle id="scene3-field-area" cx="320" cy="250" r="80" fill="#1565c0" fill-opacity="0.1" stroke="none"/>
                <!-- 电场线：8条从四周指向O -->
                <line id="scene3-field-line1" x1="320" y1="60" x2="320" y2="246" stroke="#1565c0" stroke-width="0.8" marker-end="url(#scene3-arrow-blue)"/>
                <line id="scene3-field-line2" x1="426" y1="144" x2="323" y2="247" stroke="#1565c0" stroke-width="0.8" marker-end="url(#scene3-arrow-blue)"/>
                <line id="scene3-field-line3" x1="470" y1="250" x2="324" y2="250" stroke="#1565c0" stroke-width="0.8" marker-end="url(#scene3-arrow-blue)"/>
                <line id="scene3-field-line4" x1="426" y1="356" x2="323" y2="253" stroke="#1565c0" stroke-width="0.8" marker-end="url(#scene3-arrow-blue)"/>
                <line id="scene3-field-line5" x1="320" y1="440" x2="320" y2="254" stroke="#1565c0" stroke-width="0.8" marker-end="url(#scene3-arrow-blue)"/>
                <line id="scene3-field-line6" x1="214" y1="356" x2="317" y2="253" stroke="#1565c0" stroke-width="0.8" marker-end="url(#scene3-arrow-blue)"/>
                <line id="scene3-field-line7" x1="170" y1="250" x2="316" y2="250" stroke="#1565c0" stroke-width="0.8" marker-end="url(#scene3-arrow-blue)"/>
                <line id="scene3-field-line8" x1="214" y1="144" x2="317" y2="247" stroke="#1565c0" stroke-width="0.8" marker-end="url(#scene3-arrow-blue)"/>
                <!-- Q标签：右移并上移，避免与水平电场线重叠 -->
                <text id="scene3-label-q" x="450" y="220" text-anchor="start" font-size="16" fill="#c62828" font-weight="bold">Q</text>
            </g>

            <!-- 步骤3：轨迹展示（拆分为两段path以缩小bounding box） -->
            <g id="scene3-step3" class="scene3-hidden">
                <path id="scene3-trajectory1" d="M 100 320 C 200 360, 400 380, 550 350" fill="none" stroke="#000000" stroke-width="1.5"/>
                <path id="scene3-trajectory2" d="M 550 350 C 640 332, 700 260, 720 260" fill="none" stroke="#000000" stroke-width="1.5"/>
            </g>

            <!-- 步骤4：速度演变 -->
            <g id="scene3-step4" class="scene3-hidden">
                <!-- 速度方向箭头1：右下约20° -->
                <line id="scene3-vdir1" x1="191" y1="346" x2="215" y2="355" stroke="#2e7d32" stroke-width="1.2" marker-end="url(#scene3-arrow-green)"/>
                <!-- 速度方向箭头2：右下约10° -->
                <line id="scene3-vdir2" x1="306" y1="361" x2="326" y2="365" stroke="#2e7d32" stroke-width="1.2" marker-end="url(#scene3-arrow-green)"/>
                <!-- 速度方向箭头3：近似水平 -->
                <line id="scene3-vdir3" x1="431" y1="364" x2="451" y2="364" stroke="#2e7d32" stroke-width="1.2" marker-end="url(#scene3-arrow-green)"/>
            </g>

            <!-- 步骤5：末态撞击 -->
            <g id="scene3-step5" class="scene3-hidden">
                <!-- 撞击点 -->
                <circle id="scene3-impact-point" cx="720" cy="260" r="5" fill="#c62828"/>
                <!-- 末速度v_f -->
                <line id="scene3-vf-arrow" x1="720" y1="260" x2="750" y2="260" stroke="#2e7d32" stroke-width="1.2" marker-end="url(#scene3-arrow-green)"/>
                <!-- 标签 -->
                <text id="scene3-label-vf" x="755" y="260" text-anchor="start" font-size="14" fill="#2e7d32" dominant-baseline="middle">v_f</text>
            </g>

            <!-- 步骤6：几何关系 -->
            <g id="scene3-step6" class="scene3-hidden">
                <!-- 反向延长线 -->
                <line id="scene3-backward-line" x1="100" y1="320" x2="40" y2="275" stroke="#888888" stroke-width="1" stroke-dasharray="4,3"/>
                <!-- 角度θ弧线：中心(100,320), r=25, 0°~37° -->
                <path id="scene3-angle-arc" d="M 125 320 A 25 25 0 0 1 119.9 305.1" fill="none" stroke="#888888" stroke-width="1"/>
                <!-- 角动量示意弧线：中心(320,250), r=35 -->
                <path id="scene3-momentum-arc" d="M 355 250 A 35 35 0 0 1 320 285" fill="none" stroke="#888888" stroke-width="1" marker-end="url(#scene3-arrow-black)"/>
                <!-- 标签（L右移避免与Q重叠） -->
                <text id="scene3-label-theta" x="130" y="295" text-anchor="start" font-size="14" fill="#000000">θ</text>
                <text id="scene3-label-l" x="480" y="210" text-anchor="start" font-size="14" fill="#000000">L</text>
            </g>
        </svg>

        <div id="scene3-controls">
            <button id="scene3-btn-prev">◀ 上一步</button>
            <span id="scene3-step-indicator">步骤 0/6</span>
            <button id="scene3-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 3 实现
        var currentStep = 0;
        var totalSteps = 6;
        var btnPrev = document.getElementById('scene3-btn-prev');
        var btnNext = document.getElementById('scene3-btn-next');
        var indicator = document.getElementById('scene3-step-indicator');

        function updateUI() {
            indicator.textContent = '步骤 ' + currentStep + '/' + totalSteps;
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps);
        }

        function render() {
            for (var i = 1; i <= totalSteps; i++) {
                var g = document.getElementById('scene3-step' + i);
                if (g) {
                    if (i <= currentStep) {
                        g.style.display = 'block';
                        g.style.opacity = '1';
                    } else {
                        g.style.display = 'none';
                        g.style.opacity = '0';
                    }
                }
            }
            updateUI();
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                render();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                render();
            }
        });

        // 初始渲染
        render();
    })();
    </script>
</body>
</html>
