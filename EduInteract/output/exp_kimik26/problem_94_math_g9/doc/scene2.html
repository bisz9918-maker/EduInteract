<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三棱柱表面展开图</title>
<style>
body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
#scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
#scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
#scene2-controls button { padding: 6px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: #f5f5f5; }
#scene2-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
#scene2-step-indicator { font-size: 14px; color: #333; min-width: 70px; text-align: center; }
</style>
</head>
<body>
<div id="scene2-container">
<svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500">
<!-- === 选项A展开图 (左上) === -->
<g id="scene2-opt-a">
<rect id="scene2-a-rect1" x="134" y="80" width="44" height="80" fill="none" stroke="#000" stroke-width="2"/>
<rect id="scene2-a-rect2" x="178" y="80" width="44" height="80" fill="none" stroke="#000" stroke-width="2"/>
<rect id="scene2-a-rect3" x="222" y="80" width="44" height="80" fill="none" stroke="#000" stroke-width="2"/>
<polygon id="scene2-a-tri-top" points="156,55 134,80 178,80" fill="none" stroke="#000" stroke-width="2"/>
<polygon id="scene2-a-tri-bot" points="200,185 178,160 222,160" fill="none" stroke="#000" stroke-width="2"/>
</g>
<text id="scene2-label-a" x="110" y="130" text-anchor="middle" font-size="18" font-weight="bold" fill="#000">A</text>

<!-- === 选项B展开图 (右上) === -->
<g id="scene2-opt-b">
<rect id="scene2-b-rect1" x="534" y="80" width="44" height="80" fill="none" stroke="#000" stroke-width="2"/>
<rect id="scene2-b-rect2" x="578" y="80" width="44" height="80" fill="none" stroke="#000" stroke-width="2"/>
<rect id="scene2-b-rect3" x="622" y="80" width="44" height="80" fill="none" stroke="#000" stroke-width="2"/>
<polygon id="scene2-b-tri-top1" points="556,55 534,80 578,80" fill="none" stroke="#000" stroke-width="2"/>
<polygon id="scene2-b-tri-top2" points="644,55 622,80 666,80" fill="none" stroke="#000" stroke-width="2"/>
</g>
<text id="scene2-label-b" x="510" y="130" text-anchor="middle" font-size="18" font-weight="bold" fill="#000">B</text>

<!-- === 选项C展开图 (左下) === -->
<g id="scene2-opt-c">
<rect id="scene2-c-rect1" x="134" y="290" width="44" height="80" fill="none" stroke="#000" stroke-width="2"/>
<rect id="scene2-c-rect2" x="178" y="290" width="44" height="80" fill="none" stroke="#000" stroke-width="2"/>
<rect id="scene2-c-rect3" x="222" y="290" width="44" height="80" fill="none" stroke="#000" stroke-width="2"/>
<polygon id="scene2-c-tri-bot" points="156,395 134,370 178,370" fill="none" stroke="#000" stroke-width="2"/>
</g>
<text id="scene2-label-c" x="110" y="340" text-anchor="middle" font-size="18" font-weight="bold" fill="#000">C</text>

<!-- === 选项D展开图 (右下) === -->
<g id="scene2-opt-d">
<rect id="scene2-d-rect1" x="534" y="290" width="44" height="80" fill="none" stroke="#000" stroke-width="2"/>
<rect id="scene2-d-rect2" x="578" y="290" width="44" height="80" fill="none" stroke="#000" stroke-width="2"/>
<rect id="scene2-d-rect3" x="622" y="290" width="44" height="80" fill="none" stroke="#000" stroke-width="2"/>
</g>
<text id="scene2-label-d" x="510" y="340" text-anchor="middle" font-size="18" font-weight="bold" fill="#000">D</text>

<!-- === 步骤1元素：面数标签 (放在单元格左上角，远离图形) === -->
<text id="scene2-face-count-a" x="30" y="45" text-anchor="start" font-size="14" fill="#000" style="opacity:0">5 个面</text>
<text id="scene2-face-count-b" x="430" y="45" text-anchor="start" font-size="14" fill="#000" style="opacity:0">5 个面</text>
<text id="scene2-face-count-c" x="30" y="265" text-anchor="start" font-size="14" fill="#000" style="opacity:0">4 个面</text>
<text id="scene2-face-count-d" x="430" y="265" text-anchor="start" font-size="14" fill="#000" style="opacity:0">3 个面</text>

<!-- === 步骤1元素：排除背景 (缩小宽度，不覆盖左侧标签区域) === -->
<rect id="scene2-bg-c" x="125" y="240" width="255" height="180" fill="#ffebee" style="opacity:0"/>
<rect id="scene2-bg-d" x="525" y="240" width="255" height="180" fill="#ffebee" style="opacity:0"/>

<!-- === 步骤1元素：蓝色保留边框 === -->
<rect id="scene2-border-a" x="120" y="50" width="160" height="160" fill="none" stroke="#1565c0" stroke-width="2" style="opacity:0"/>
<rect id="scene2-border-b" x="520" y="50" width="160" height="160" fill="none" stroke="#1565c0" stroke-width="2" style="opacity:0"/>

<!-- === 步骤1元素：C、D红色叉号 === -->
<g id="scene2-cross-c" style="opacity:0">
<line x1="180" y1="310" x2="220" y2="350" stroke="#c62828" stroke-width="3"/>
<line x1="220" y1="310" x2="180" y2="350" stroke="#c62828" stroke-width="3"/>
</g>
<g id="scene2-cross-d" style="opacity:0">
<line x1="580" y1="310" x2="620" y2="350" stroke="#c62828" stroke-width="3"/>
<line x1="620" y1="310" x2="580" y2="350" stroke="#c62828" stroke-width="3"/>
</g>

<!-- === 步骤2元素：三角形高亮 === -->
<polygon id="scene2-a-tri-top-hl" points="156,55 134,80 178,80" fill="#c62828" style="opacity:0"/>
<polygon id="scene2-a-tri-bot-hl" points="200,185 178,160 222,160" fill="#c62828" style="opacity:0"/>
<polygon id="scene2-b-tri-top1-hl" points="556,55 534,80 578,80" fill="#c62828" style="opacity:0"/>
<polygon id="scene2-b-tri-top2-hl" points="644,55 622,80 666,80" fill="#c62828" style="opacity:0"/>

<!-- === 步骤2元素：B折叠示意箭头 === -->
<g id="scene2-b-arrow" style="opacity:0">
<line x1="510" y1="55" x2="510" y2="185" stroke="#c62828" stroke-width="2" stroke-dasharray="6,4"/>
<polygon points="510,185 505,175 515,175" fill="#c62828"/>
</g>

<!-- === 步骤2元素：原因文字 (放在下方，远离所有图形) === -->
<text id="scene2-reason-a" x="200" y="255" text-anchor="middle" font-size="14" fill="#2e7d32" style="opacity:0">底面分居两侧</text>
<text id="scene2-reason-b" x="600" y="255" text-anchor="middle" font-size="14" fill="#c62828" style="opacity:0">底面同侧，无法折叠</text>

<!-- === 步骤2元素：B红色叉号、A绿色对勾 === -->
<g id="scene2-cross-b" style="opacity:0">
<line x1="580" y1="100" x2="620" y2="140" stroke="#c62828" stroke-width="3"/>
<line x1="620" y1="100" x2="580" y2="140" stroke="#c62828" stroke-width="3"/>
</g>
<g id="scene2-check-a" style="opacity:0">
<polyline points="185,120 195,135 215,105" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- === 步骤3元素：标题 (下移避免顶部裁切) === -->
<text id="scene2-title" x="400" y="42" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e7d32" style="opacity:0">正确答案：A</text>

<!-- === 步骤3元素：A放大图 === -->
<g id="scene2-a-zoom" style="opacity:0">
<rect x="145" y="70" width="230" height="260" fill="none" stroke="#2e7d32" stroke-width="3"/>
<rect x="155" y="130" width="70" height="140" fill="none" stroke="#000" stroke-width="2"/>
<rect x="225" y="130" width="70" height="140" fill="none" stroke="#000" stroke-width="2"/>
<rect x="295" y="130" width="70" height="140" fill="none" stroke="#000" stroke-width="2"/>
<polygon points="190,80 155,130 225,130" fill="none" stroke="#000" stroke-width="2"/>
<polygon points="260,320 225,270 295,270" fill="none" stroke="#000" stroke-width="2"/>
<polyline points="230,200 250,230 290,170" fill="none" stroke="#2e7d32" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- === 步骤3元素：三棱柱立体图 === -->
<g id="scene2-prism-3d" style="opacity:0">
<line x1="560" y1="170" x2="560" y2="310" stroke="#2e7d32" stroke-width="2"/>
<line x1="640" y1="170" x2="640" y2="310" stroke="#2e7d32" stroke-width="2"/>
<polygon points="560,170 640,170 600,140" fill="none" stroke="#2e7d32" stroke-width="2"/>
<polygon points="560,310 640,310 600,340" fill="none" stroke="#2e7d32" stroke-width="2"/>
<line x1="640" y1="170" x2="680" y2="190" stroke="#2e7d32" stroke-width="2"/>
<line x1="640" y1="310" x2="680" y2="330" stroke="#2e7d32" stroke-width="2"/>
<line x1="680" y1="190" x2="680" y2="330" stroke="#2e7d32" stroke-width="2"/>
<line x1="600" y1="140" x2="680" y2="190" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3"/>
<line x1="600" y1="340" x2="680" y2="330" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3"/>
</g>

<!-- === 步骤3元素：连接虚线箭头 === -->
<g id="scene2-connector" style="opacity:0">
<line x1="375" y1="200" x2="550" y2="220" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3"/>
<polygon points="550,220 540,215 540,225" fill="#888"/>
</g>

<!-- === 步骤3元素：B、C、D淡化缩略图 === -->
<g id="scene2-thumb-b" style="opacity:0; display:none">
<rect x="120" y="420" width="13" height="24" fill="none" stroke="#000" stroke-width="0.6"/>
<rect x="133" y="420" width="13" height="24" fill="none" stroke="#000" stroke-width="0.6"/>
<rect x="146" y="420" width="13" height="24" fill="none" stroke="#000" stroke-width="0.6"/>
<polygon points="126.6,412.5 120,420 133,420" fill="none" stroke="#000" stroke-width="0.6"/>
<polygon points="152.4,412.5 146,420 159,420" fill="none" stroke="#000" stroke-width="0.6"/>
<text x="133" y="455" text-anchor="middle" font-size="5.4" font-weight="bold" fill="#000">B</text>
</g>
<g id="scene2-thumb-c" style="opacity:0; display:none">
<rect x="320" y="420" width="13" height="24" fill="none" stroke="#000" stroke-width="0.6"/>
<rect x="333" y="420" width="13" height="24" fill="none" stroke="#000" stroke-width="0.6"/>
<rect x="346" y="420" width="13" height="24" fill="none" stroke="#000" stroke-width="0.6"/>
<polygon points="326.6,451.5 320,444 333,444" fill="none" stroke="#000" stroke-width="0.6"/>
<text x="333" y="455" text-anchor="middle" font-size="5.4" font-weight="bold" fill="#000">C</text>
</g>
<g id="scene2-thumb-d" style="opacity:0; display:none">
<rect x="520" y="420" width="13" height="24" fill="none" stroke="#000" stroke-width="0.6"/>
<rect x="533" y="420" width="13" height="24" fill="none" stroke="#000" stroke-width="0.6"/>
<rect x="546" y="420" width="13" height="24" fill="none" stroke="#000" stroke-width="0.6"/>
<text x="533" y="455" text-anchor="middle" font-size="5.4" font-weight="bold" fill="#000">D</text>
</g>
</svg>
<div id="scene2-controls">
<button id="scene2-btn-prev">◀ 上一步</button>
<span id="scene2-step-indicator">步骤 1/4</span>
<button id="scene2-btn-next">下一步 ▶</button>
</div>
</div>
<script>
(function() {
let currentStep = 0;
const totalSteps = 4;
const btnPrev = document.getElementById('scene2-btn-prev');
const btnNext = document.getElementById('scene2-btn-next');
const indicator = document.getElementById('scene2-step-indicator');
const els = {
faceCountA: document.getElementById('scene2-face-count-a'),
faceCountB: document.getElementById('scene2-face-count-b'),
faceCountC: document.getElementById('scene2-face-count-c'),
faceCountD: document.getElementById('scene2-face-count-d'),
bgC: document.getElementById('scene2-bg-c'),
bgD: document.getElementById('scene2-bg-d'),
borderA: document.getElementById('scene2-border-a'),
borderB: document.getElementById('scene2-border-b'),
crossC: document.getElementById('scene2-cross-c'),
crossD: document.getElementById('scene2-cross-d'),
triTopHlA: document.getElementById('scene2-a-tri-top-hl'),
triBotHlA: document.getElementById('scene2-a-tri-bot-hl'),
triTop1HlB: document.getElementById('scene2-b-tri-top1-hl'),
triTop2HlB: document.getElementById('scene2-b-tri-top2-hl'),
bArrow: document.getElementById('scene2-b-arrow'),
reasonA: document.getElementById('scene2-reason-a'),
reasonB: document.getElementById('scene2-reason-b'),
crossB: document.getElementById('scene2-cross-b'),
checkA: document.getElementById('scene2-check-a'),
title: document.getElementById('scene2-title'),
aZoom: document.getElementById('scene2-a-zoom'),
prism3d: document.getElementById('scene2-prism-3d'),
connector: document.getElementById('scene2-connector'),
thumbB: document.getElementById('scene2-thumb-b'),
thumbC: document.getElementById('scene2-thumb-c'),
thumbD: document.getElementById('scene2-thumb-d'),
optA: document.getElementById('scene2-opt-a'),
optB: document.getElementById('scene2-opt-b'),
optC: document.getElementById('scene2-opt-c'),
optD: document.getElementById('scene2-opt-d'),
labelA: document.getElementById('scene2-label-a'),
labelB: document.getElementById('scene2-label-b'),
labelC: document.getElementById('scene2-label-c'),
labelD: document.getElementById('scene2-label-d'),
};
function setStyle(el, opacity) {
if (!el) return;
el.style.opacity = opacity;
if (opacity === 0) {
el.style.display = 'none';
} else {
el.style.display = '';
}
}
function renderStep() {
indicator.textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;
btnPrev.disabled = currentStep === 0;
btnNext.disabled = currentStep === totalSteps - 1;
if (currentStep === 0) {
setStyle(els.faceCountA, 0); setStyle(els.faceCountB, 0); setStyle(els.faceCountC, 0); setStyle(els.faceCountD, 0);
setStyle(els.bgC, 0); setStyle(els.bgD, 0); setStyle(els.borderA, 0); setStyle(els.borderB, 0);
setStyle(els.crossC, 0); setStyle(els.crossD, 0);
setStyle(els.triTopHlA, 0); setStyle(els.triBotHlA, 0); setStyle(els.triTop1HlB, 0); setStyle(els.triTop2HlB, 0);
setStyle(els.bArrow, 0); setStyle(els.reasonA, 0); setStyle(els.reasonB, 0);
setStyle(els.crossB, 0); setStyle(els.checkA, 0); setStyle(els.title, 0);
setStyle(els.aZoom, 0); setStyle(els.prism3d, 0); setStyle(els.connector, 0);
setStyle(els.thumbB, 0); setStyle(els.thumbC, 0); setStyle(els.thumbD, 0);
setStyle(els.optA, 1); setStyle(els.optB, 1); setStyle(els.optC, 1); setStyle(els.optD, 1);
setStyle(els.labelA, 1); setStyle(els.labelB, 1); setStyle(els.labelC, 1); setStyle(els.labelD, 1);
} else if (currentStep === 1) {
setStyle(els.faceCountA, 1); setStyle(els.faceCountB, 1); setStyle(els.faceCountC, 1); setStyle(els.faceCountD, 1);
setStyle(els.bgC, 0.3); setStyle(els.bgD, 0.3); setStyle(els.borderA, 1); setStyle(els.borderB, 1);
setStyle(els.crossC, 1); setStyle(els.crossD, 1);
setStyle(els.triTopHlA, 0); setStyle(els.triBotHlA, 0); setStyle(els.triTop1HlB, 0); setStyle(els.triTop2HlB, 0);
setStyle(els.bArrow, 0); setStyle(els.reasonA, 0); setStyle(els.reasonB, 0);
setStyle(els.crossB, 0); setStyle(els.checkA, 0); setStyle(els.title, 0);
setStyle(els.aZoom, 0); setStyle(els.prism3d, 0); setStyle(els.connector, 0);
setStyle(els.thumbB, 0); setStyle(els.thumbC, 0); setStyle(els.thumbD, 0);
setStyle(els.optA, 1); setStyle(els.optB, 1); setStyle(els.optC, 1); setStyle(els.optD, 1);
setStyle(els.labelA, 1); setStyle(els.labelB, 1); setStyle(els.labelC, 1); setStyle(els.labelD, 1);
} else if (currentStep === 2) {
setStyle(els.faceCountA, 1); setStyle(els.faceCountB, 1); setStyle(els.faceCountC, 1); setStyle(els.faceCountD, 1);
setStyle(els.bgC, 0.3); setStyle(els.bgD, 0.3); setStyle(els.borderA, 1); setStyle(els.borderB, 1);
setStyle(els.crossC, 1); setStyle(els.crossD, 1);
setStyle(els.triTopHlA, 0.3); setStyle(els.triBotHlA, 0.3); setStyle(els.triTop1HlB, 0.3); setStyle(els.triTop2HlB, 0.3);
setStyle(els.bArrow, 1); setStyle(els.reasonA, 1); setStyle(els.reasonB, 1);
setStyle(els.crossB, 1); setStyle(els.checkA, 1); setStyle(els.title, 0);
setStyle(els.aZoom, 0); setStyle(els.prism3d, 0); setStyle(els.connector, 0);
setStyle(els.thumbB, 0); setStyle(els.thumbC, 0); setStyle(els.thumbD, 0);
setStyle(els.optA, 1); setStyle(els.optB, 1); setStyle(els.optC, 1); setStyle(els.optD, 1);
setStyle(els.labelA, 1); setStyle(els.labelB, 1); setStyle(els.labelC, 1); setStyle(els.labelD, 1);
} else if (currentStep === 3) {
setStyle(els.faceCountA, 0); setStyle(els.faceCountB, 0); setStyle(els.faceCountC, 0); setStyle(els.faceCountD, 0);
setStyle(els.bgC, 0); setStyle(els.bgD, 0); setStyle(els.borderA, 0); setStyle(els.borderB, 0);
setStyle(els.crossC, 0); setStyle(els.crossD, 0);
setStyle(els.triTopHlA, 0); setStyle(els.triBotHlA, 0); setStyle(els.triTop1HlB, 0); setStyle(els.triTop2HlB, 0);
setStyle(els.bArrow, 0); setStyle(els.reasonA, 0); setStyle(els.reasonB, 0);
setStyle(els.crossB, 0); setStyle(els.checkA, 0); setStyle(els.title, 1);
setStyle(els.aZoom, 1); setStyle(els.prism3d, 1); setStyle(els.connector, 1);
setStyle(els.thumbB, 0.2); setStyle(els.thumbC, 0.2); setStyle(els.thumbD, 0.2);
setStyle(els.optA, 0); setStyle(els.optB, 0); setStyle(els.optC, 0); setStyle(els.optD, 0);
setStyle(els.labelA, 0); setStyle(els.labelB, 0); setStyle(els.labelC, 0); setStyle(els.labelD, 0);
}
}
btnPrev.addEventListener('click', function() { if (currentStep > 0) { currentStep--; renderStep(); } });
btnNext.addEventListener('click', function() { if (currentStep < totalSteps - 1) { currentStep++; renderStep(); } });
renderStep();
})();
</script>
</body>
</html>
