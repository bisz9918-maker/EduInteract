<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正方体展开图分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-step-indicator { position: absolute; bottom: 55px; left: 0; right: 0; text-align: center; font-size: 12px; color: #666; z-index: 10; }
        .scene1-btn { padding: 6px 16px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; background: #f0f0f0; cursor: pointer; min-width: 100px; }
        .scene1-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" viewBox="0 0 800 500">
            <defs>
                <!-- 斜线填充 pattern，45°黑色斜线 -->
                <pattern id="scene1-hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
                    <line x1="0" y1="0" x2="0" y2="8" stroke="#000" stroke-width="1"/>
                </pattern>
                <!-- 箭头 marker -->
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#888"/>
                </marker>
            </defs>
            
            <!-- 基础展开图：面框、折痕、阴影三角、圆圈 -->
            <g id="scene1-base">
                <!-- 六个面外框 -->
                <rect x="240" y="160" width="80" height="80" fill="#fff" stroke="#000" stroke-width="2"/>
                <rect x="320" y="160" width="80" height="80" fill="#fff" stroke="#000" stroke-width="2"/>
                <rect x="400" y="160" width="80" height="80" fill="#fff" stroke="#000" stroke-width="2"/>
                <rect x="480" y="160" width="80" height="80" fill="#fff" stroke="#000" stroke-width="2"/>
                <rect x="320" y="80"  width="80" height="80" fill="#fff" stroke="#000" stroke-width="2"/>
                <rect x="320" y="240" width="80" height="80" fill="#fff" stroke="#000" stroke-width="2"/>
                
                <!-- 折痕虚线 -->
                <line x1="320" y1="160" x2="320" y2="240" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
                <line x1="400" y1="160" x2="400" y2="240" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
                <line x1="480" y1="160" x2="480" y2="240" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
                <line x1="320" y1="160" x2="400" y2="160" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
                <line x1="320" y1="240" x2="400" y2="240" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
                
                <!-- 阴影三角（右下半） -->
                <polygon points="240,240 320,240 320,160" fill="url(#scene1-hatch)" stroke="#000" stroke-width="1"/>
                <polygon points="480,240 560,240 560,160" fill="url(#scene1-hatch)" stroke="#000" stroke-width="1"/>
                
                <!-- 面⑤圆圈 -->
                <circle cx="360" cy="120" r="15" fill="#fff" stroke="#1565c0" stroke-width="2"/>
            </g>
            
            <!-- 步骤1：面①与面③蓝色高亮（相对面） -->
            <g id="scene1-step1" display="none">
                <rect x="240" y="160" width="80" height="80" fill="#1565c0" fill-opacity="0.2" stroke="#1565c0" stroke-width="2"/>
                <rect x="400" y="160" width="80" height="80" fill="#1565c0" fill-opacity="0.2" stroke="#1565c0" stroke-width="2"/>
                <text x="360" y="340" font-size="14" font-family="sans-serif" fill="#000" text-anchor="middle">相对面</text>
            </g>
            
            <!-- 步骤2：面②与面④红色高亮（相对面） -->
            <g id="scene1-step2" display="none">
                <rect x="320" y="160" width="80" height="80" fill="#c62828" fill-opacity="0.2" stroke="#c62828" stroke-width="2"/>
                <rect x="480" y="160" width="80" height="80" fill="#c62828" fill-opacity="0.2" stroke="#c62828" stroke-width="2"/>
                <text x="440" y="340" font-size="14" font-family="sans-serif" fill="#000" text-anchor="middle">相对面</text>
            </g>
            
            <!-- 步骤3：面⑤与面⑥绿色高亮（相对面） -->
            <g id="scene1-step3" display="none">
                <rect x="320" y="80"  width="80" height="80" fill="#2e7d32" fill-opacity="0.2" stroke="#2e7d32" stroke-width="2"/>
                <rect x="320" y="240" width="80" height="80" fill="#2e7d32" fill-opacity="0.2" stroke="#2e7d32" stroke-width="2"/>
                <text x="360" y="340" font-size="14" font-family="sans-serif" fill="#000" text-anchor="middle">相对面</text>
            </g>
            
            <!-- 步骤4：面①与面④黑色粗边框（相邻） -->
            <g id="scene1-step4" display="none">
                <rect x="240" y="160" width="80" height="80" fill="none" stroke="#000" stroke-width="3"/>
                <rect x="480" y="160" width="80" height="80" fill="none" stroke="#000" stroke-width="3"/>
                <text x="400" y="340" font-size="14" font-family="sans-serif" fill="#000" text-anchor="middle">相邻</text>
            </g>
            
            <!-- 步骤5：面①④黑框 + 面⑤蓝框 + 虚线箭头（相邻） -->
            <g id="scene1-step5" display="none">
                <rect x="240" y="160" width="80" height="80" fill="none" stroke="#000" stroke-width="3"/>
                <rect x="480" y="160" width="80" height="80" fill="none" stroke="#000" stroke-width="3"/>
                <rect x="320" y="80"  width="80" height="80" fill="none" stroke="#1565c0" stroke-width="3"/>
                <line x1="360" y1="120" x2="280" y2="200" stroke="#888" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#scene1-arrowhead)"/>
                <line x1="360" y1="120" x2="520" y2="200" stroke="#888" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#scene1-arrowhead)"/>
                <text x="360" y="340" font-size="14" font-family="sans-serif" fill="#000" text-anchor="middle">相邻</text>
            </g>
            
            <!-- 步骤6：结论文字 -->
            <g id="scene1-step6" display="none">
                <text x="400" y="360" font-size="14" font-family="sans-serif" fill="#000" text-anchor="middle">阴影面相邻</text>
                <text x="400" y="400" font-size="14" font-family="sans-serif" fill="#000" text-anchor="middle">圆圈面与两阴影面均相邻</text>
            </g>
            
            <!-- 面号：置于各面正上方足够距离，避免与任何图形或箭头重叠 -->
            <g id="scene1-labels">
                <text x="280" y="140" font-size="12" font-family="sans-serif" fill="#000" text-anchor="middle">①</text>
                <text x="360" y="140" font-size="12" font-family="sans-serif" fill="#000" text-anchor="middle">②</text>
                <text x="440" y="140" font-size="12" font-family="sans-serif" fill="#000" text-anchor="middle">③</text>
                <text x="520" y="140" font-size="12" font-family="sans-serif" fill="#000" text-anchor="middle">④</text>
                <text x="360" y="65"  font-size="12" font-family="sans-serif" fill="#000" text-anchor="middle">⑤</text>
                <text x="360" y="220" font-size="12" font-family="sans-serif" fill="#000" text-anchor="middle">⑥</text>
            </g>
        </svg>
        
        <div id="scene1-step-indicator">步骤 1 / 7</div>
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn">◀ 上一步</button>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // 状态机：当前步骤 0~6（共7步）
        var currentStep = 0;
        var totalSteps = 7;
        
        var btnPrev = document.getElementById('scene1-btn-prev');
        var btnNext = document.getElementById('scene1-btn-next');
        var indicator = document.getElementById('scene1-step-indicator');
        
        function updateUI() {
            // 更新步骤指示器文本
            indicator.textContent = '步骤 ' + (currentStep + 1) + ' / ' + totalSteps;
            
            // 边界按钮禁用状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps - 1);
            
            // 控制各步骤 SVG 组的显隐
            for (var i = 1; i <= 6; i++) {
                var group = document.getElementById('scene1-step' + i);
                if (group) {
                    group.style.display = (i === currentStep) ? 'block' : 'none';
                }
            }
        }
        
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateUI();
            }
        });
        
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateUI();
            }
        });
        
        // 初始化渲染
        updateUI();
    })();
    </script>
</body>
</html>
