<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一次函数图象的象限判断 - 场景2</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 16px; z-index: 10; }
        #scene2-controls button {
            padding: 8px 20px; font-size: 14px; cursor: pointer; border: 1px solid #ccc;
            border-radius: 4px; background: #f0f0f0; transition: background 0.2s;
        }
        #scene2-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene2-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene2-step-indicator { font-size: 14px; color: #555; min-width: 80px; text-align: center; }

        /* SVG element transitions */
        .scene2-fade { transition: opacity 0.4s ease; }
        .scene2-fill-transition { transition: opacity 0.4s ease, fill-opacity 0.4s ease; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500">
            <defs>
                <marker id="scene2-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#2e7d32"/>
                </marker>
            </defs>

            <!-- 辅助网格线 -->
            <g id="scene2-grid" opacity="0.3">
                <line x1="213" y1="60" x2="213" y2="430" stroke="#888888" stroke-width="0.5" stroke-dasharray="4,4"/>
                <line x1="307" y1="60" x2="307" y2="430" stroke="#888888" stroke-width="0.5" stroke-dasharray="4,4"/>
                <line x1="493" y1="60" x2="493" y2="430" stroke="#888888" stroke-width="0.5" stroke-dasharray="4,4"/>
                <line x1="587" y1="60" x2="587" y2="430" stroke="#888888" stroke-width="0.5" stroke-dasharray="4,4"/>
                <line x1="120" y1="140" x2="680" y2="140" stroke="#888888" stroke-width="0.5" stroke-dasharray="4,4"/>
                <line x1="120" y1="220" x2="680" y2="220" stroke="#888888" stroke-width="0.5" stroke-dasharray="4,4"/>
                <line x1="120" y1="300" x2="680" y2="300" stroke="#888888" stroke-width="0.5" stroke-dasharray="4,4"/>
                <line x1="120" y1="380" x2="680" y2="380" stroke="#888888" stroke-width="0.5" stroke-dasharray="4,4"/>
            </g>

            <!-- 坐标轴 -->
            <line id="scene2-x-axis" x1="120" y1="260" x2="680" y2="260" stroke="#000000" stroke-width="1.5"/>
            <polygon points="680,260 670,255 670,265" fill="#000000"/>
            <line id="scene2-y-axis" x1="400" y1="60" x2="400" y2="430" stroke="#000000" stroke-width="1.5"/>
            <polygon points="400,60 395,70 405,70" fill="#000000"/>

            <!-- 轴标签 -->
            <text id="scene2-label-x" x="692" y="264" font-size="14" fill="#000000" text-anchor="start">x</text>
            <text id="scene2-label-y" x="392" y="36" font-size="14" fill="#000000" text-anchor="middle">y</text>
            <text id="scene2-label-o" x="395" y="252" font-size="14" fill="#000000" text-anchor="start">O</text>

            <!-- 象限标注 -->
            <text id="scene2-q1-text" x="540" y="58" font-size="18" fill="#000000" text-anchor="middle" font-weight="bold">Ⅰ</text>
            <text id="scene2-q2-text" x="260" y="58" font-size="18" fill="#000000" text-anchor="middle" font-weight="bold">Ⅱ</text>
            <text id="scene2-q3-text" x="260" y="450" font-size="18" fill="#000000" text-anchor="middle" font-weight="bold">Ⅲ</text>
            <text id="scene2-q4-text" x="540" y="450" font-size="18" fill="#000000" text-anchor="middle" font-weight="bold">Ⅳ</text>

            <!-- 象限填充（初始完全隐藏） -->
            <!-- Q2: x=120~390, y=70~250 -->
            <rect id="scene2-fill-q2" class="scene2-fill-transition" x="120" y="70" width="270" height="180" fill="#2e7d32" fill-opacity="0" opacity="0"/>
            <!-- Q1: x=410~680, y=70~250 -->
            <rect id="scene2-fill-q1" class="scene2-fill-transition" x="410" y="70" width="270" height="180" fill="#c62828" fill-opacity="0" opacity="0"/>
            <!-- Q3: x=120~390, y=270~425 -->
            <rect id="scene2-fill-q3" class="scene2-fill-transition" x="120" y="270" width="270" height="155" fill="#2e7d32" fill-opacity="0" opacity="0"/>
            <!-- Q4: x=410~680, y=270~425 -->
            <rect id="scene2-fill-q4" class="scene2-fill-transition" x="410" y="270" width="270" height="155" fill="#2e7d32" fill-opacity="0" opacity="0"/>

            <!-- 直线 y=ax+b（两段，中间留空给原点和交点） -->
            <line id="scene2-line1" class="scene2-fade" x1="167" y1="208" x2="395" y2="305.8" stroke="#1565c0" stroke-width="2.5" opacity="0"/>
            <line id="scene2-line2" class="scene2-fade" x1="405" y1="310.2" x2="633" y2="408" stroke="#1565c0" stroke-width="2.5" opacity="0"/>

            <!-- y轴交点（初始隐藏） -->
            <circle id="scene2-point-b" cx="400" cy="308" r="3" fill="#c62828" opacity="0"/>
            <text id="scene2-label-point-b" class="scene2-fade" x="340" y="265" font-size="14" fill="#c62828" text-anchor="start" opacity="0">(0, b)</text>

            <!-- 斜率箭头（初始隐藏） -->
            <line id="scene2-slope-arrow" x1="480" y1="340" x2="510" y2="352.9" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#scene2-arrowhead)" opacity="0"/>

            <!-- 直线标签（初始隐藏） -->
            <text id="scene2-label-line" class="scene2-fade" x="540" y="460" font-size="14" fill="#1565c0" text-anchor="start" opacity="0">y = ax + b</text>

            <!-- "不经过"标签（初始隐藏） -->
            <text id="scene2-label-notpass" class="scene2-fade" x="640" y="45" font-size="16" fill="#c62828" text-anchor="middle" font-weight="bold" opacity="0">不经过</text>

            <!-- 结论文本（初始隐藏） -->
            <text id="scene2-conclusion" class="scene2-fade" x="400" y="72" font-size="16" fill="#c62828" text-anchor="middle" font-weight="bold" opacity="0">图象不经过第一象限，选 A</text>
        </svg>

        <div id="scene2-controls">
            <button id="scene2-btn-prev" disabled>◀ 上一步</button>
            <span id="scene2-step-indicator">步骤 1 / 5</span>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2 实现
        var currentStep = 0;
        var totalSteps = 5;

        var btnPrev = document.getElementById('scene2-btn-prev');
        var btnNext = document.getElementById('scene2-btn-next');
        var stepIndicator = document.getElementById('scene2-step-indicator');

        var line1 = document.getElementById('scene2-line1');
        var line2 = document.getElementById('scene2-line2');
        var pointB = document.getElementById('scene2-point-b');
        var labelPointB = document.getElementById('scene2-label-point-b');
        var slopeArrow = document.getElementById('scene2-slope-arrow');
        var labelLine = document.getElementById('scene2-label-line');
        var fillQ2 = document.getElementById('scene2-fill-q2');
        var fillQ3 = document.getElementById('scene2-fill-q3');
        var fillQ4 = document.getElementById('scene2-fill-q4');
        var fillQ1 = document.getElementById('scene2-fill-q1');
        var labelNotpass = document.getElementById('scene2-label-notpass');
        var conclusion = document.getElementById('scene2-conclusion');

        function updateButtons() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps - 1;
            stepIndicator.textContent = '步骤 ' + (currentStep + 1) + ' / ' + totalSteps;
        }

        function setOpacity(el, val) {
            if (el) el.style.opacity = val;
        }

        function setFillOpacity(el, val) {
            if (el) {
                el.setAttribute('fill-opacity', val);
                el.style.opacity = val > 0 ? '1' : '0';
            }
        }

        function renderStep() {
            // Step 0: 只显示坐标系、象限标注、网格
            if (currentStep === 0) {
                setOpacity(line1, '0');
                setOpacity(line2, '0');
                setOpacity(pointB, '0');
                setOpacity(labelPointB, '0');
                setOpacity(slopeArrow, '0');
                setOpacity(labelLine, '0');
                setFillOpacity(fillQ2, '0');
                setFillOpacity(fillQ3, '0');
                setFillOpacity(fillQ4, '0');
                setFillOpacity(fillQ1, '0');
                setOpacity(labelNotpass, '0');
                setOpacity(conclusion, '0');
            }
            // Step 1: 绘制直线、交点、标签
            else if (currentStep === 1) {
                setOpacity(line1, '1');
                setOpacity(line2, '1');
                setOpacity(pointB, '1');
                setOpacity(labelPointB, '1');
                setOpacity(slopeArrow, '1');
                setOpacity(labelLine, '1');
                setFillOpacity(fillQ2, '0');
                setFillOpacity(fillQ3, '0');
                setFillOpacity(fillQ4, '0');
                setFillOpacity(fillQ1, '0');
                setOpacity(labelNotpass, '0');
                setOpacity(conclusion, '0');
            }
            // Step 2: 高亮经过的象限
            else if (currentStep === 2) {
                setOpacity(line1, '1');
                setOpacity(line2, '1');
                setOpacity(pointB, '1');
                setOpacity(labelPointB, '1');
                setOpacity(slopeArrow, '1');
                setOpacity(labelLine, '1');
                setFillOpacity(fillQ2, '0.15');
                setFillOpacity(fillQ3, '0.15');
                setFillOpacity(fillQ4, '0.15');
                setFillOpacity(fillQ1, '0');
                setOpacity(labelNotpass, '0');
                setOpacity(conclusion, '0');
            }
            // Step 3: 标识不经过象限
            else if (currentStep === 3) {
                setOpacity(line1, '1');
                setOpacity(line2, '1');
                setOpacity(pointB, '1');
                setOpacity(labelPointB, '1');
                setOpacity(slopeArrow, '1');
                setOpacity(labelLine, '1');
                setFillOpacity(fillQ2, '0.15');
                setFillOpacity(fillQ3, '0.15');
                setFillOpacity(fillQ4, '0.15');
                setFillOpacity(fillQ1, '0.15');
                setOpacity(labelNotpass, '1');
                setOpacity(conclusion, '0');
            }
            // Step 4: 得出结论
            else if (currentStep === 4) {
                setOpacity(line1, '1');
                setOpacity(line2, '1');
                setOpacity(pointB, '1');
                setOpacity(labelPointB, '1');
                setOpacity(slopeArrow, '1');
                setOpacity(labelLine, '1');
                setFillOpacity(fillQ2, '0.15');
                setFillOpacity(fillQ3, '0.15');
                setFillOpacity(fillQ4, '0.15');
                setFillOpacity(fillQ1, '0.15');
                setOpacity(labelNotpass, '1');
                setOpacity(conclusion, '1');
            }
            updateButtons();
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                renderStep();
            }
        });

        // 初始渲染
        renderStep();
    })();
    </script>
</body>
</html>
