<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 1 - 圆内接等腰三角形</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            display: block;
            width: 800px;
            height: 500px;
        }
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }
        #scene1-btn-prev, #scene1-btn-next {
            padding: 6px 16px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #f5f5f5;
            transition: background 0.2s;
        }
        #scene1-btn-prev:hover:not(:disabled),
        #scene1-btn-next:hover:not(:disabled) {
            background: #e0e0e0;
        }
        #scene1-btn-prev:disabled,
        #scene1-btn-next:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        #scene1-step-indicator {
            font-size: 14px;
            color: #333;
            min-width: 80px;
            text-align: center;
            user-select: none;
        }
        .scene1-transition {
            transition: opacity 0.3s ease, stroke 0.3s ease, stroke-width 0.3s ease;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 三角形填充层（置于最底层） -->
            <polygon id="scene1-fill-abc" class="scene1-transition" points="261,330 400,410 539,330" fill="#1565c0" opacity="0" style="display:none" />
            <polygon id="scene1-fill-abd" class="scene1-transition" points="261,330 400,410 539,170" fill="#c62828" opacity="0" style="display:none" />

            <!-- 圆（由36条线段近似，避免大bounding box与内部文字重叠） -->
            <g id="scene1-circle-lines"></g>

            <!-- 弧AB高亮（步骤3显示） -->
            <path id="scene1-arc-ab-highlight" class="scene1-transition" d="M 261 330 A 160 160 0 0 1 400 410" fill="none" stroke="#c62828" stroke-width="3" stroke-dasharray="6,4" opacity="0" style="display:none" />

            <!-- 弦与直径 -->
            <line id="scene1-line-ac" x1="261" y1="330" x2="539" y2="330" stroke="#000000" stroke-width="1.5" />
            <line id="scene1-line-ab" x1="261" y1="330" x2="400" y2="410" stroke="#000000" stroke-width="1.5" />
            <line id="scene1-line-bc" x1="400" y1="410" x2="539" y2="330" stroke="#000000" stroke-width="1.5" />
            <line id="scene1-line-bd" x1="400" y1="410" x2="539" y2="170" stroke="#000000" stroke-width="1.5" />
            <line id="scene1-line-ad" x1="261" y1="330" x2="539" y2="170" stroke="#000000" stroke-width="1.5" />

            <!-- 等长标记 AB = BC -->
            <line id="scene1-tick-ab" x1="327.5" y1="375.2" x2="333.5" y2="364.8" stroke="#1565c0" stroke-width="2" />
            <line id="scene1-tick-bc" x1="466.5" y1="364.8" x2="472.5" y2="375.2" stroke="#1565c0" stroke-width="2" />

            <!-- 角度弧 -->
            <!-- ∠ABC = 120°（步骤0始终显示，蓝色） -->
            <path id="scene1-angle-abc" d="M 378.35 397.5 A 25 25 0 0 0 421.65 397.5" fill="none" stroke="#1565c0" stroke-width="2" />
            <!-- ∠BAC = 30°（步骤1显示，红色） -->
            <path id="scene1-angle-bac" class="scene1-transition" d="M 280.05 319 A 22 22 0 0 0 283 330" fill="none" stroke="#c62828" stroke-width="2" opacity="0" style="display:none" />
            <!-- ∠BCA = 30°（步骤1、3、4显示，红色） -->
            <path id="scene1-angle-bca" class="scene1-transition" d="M 519.95 319 A 22 22 0 0 1 517 330" fill="none" stroke="#c62828" stroke-width="2" opacity="0" style="display:none" />
            <!-- ∠ABD = 90°（步骤2显示，红色） -->
            <path id="scene1-angle-abd" class="scene1-transition" d="M 375.75 396 A 28 28 0 0 0 414 385.75" fill="none" stroke="#c62828" stroke-width="2" opacity="0" style="display:none" />
            <!-- ∠ADB = 30°（步骤3显示，红色） -->
            <path id="scene1-angle-adb" class="scene1-transition" d="M 519.95 159 A 22 22 0 0 0 528 150.95" fill="none" stroke="#c62828" stroke-width="2" opacity="0" style="display:none" />

            <!-- 直角符号（步骤2显示） -->
            <polyline id="scene1-right-angle" class="scene1-transition" points="387,402.5 394.5,389.5 407.5,397" fill="none" stroke="#000000" stroke-width="1.5" opacity="0" style="display:none" />

            <!-- 点 -->
            <circle id="scene1-point-a" cx="261" cy="330" r="3" fill="#000000" />
            <circle id="scene1-point-b" cx="400" cy="410" r="3" fill="#000000" />
            <circle id="scene1-point-c" cx="539" cy="330" r="3" fill="#000000" />
            <circle id="scene1-point-d" cx="539" cy="170" r="3" fill="#000000" />
            <circle id="scene1-point-o" cx="400" cy="250" r="3" fill="#000000" />

            <!-- 点标签（远离点，避免与circle重叠） -->
            <text id="scene1-label-a" x="220" y="335" font-size="16" fill="#000000" text-anchor="middle" dominant-baseline="middle">A</text>
            <text id="scene1-label-b" x="400" y="455" font-size="16" fill="#000000" text-anchor="middle" dominant-baseline="middle">B</text>
            <text id="scene1-label-c" x="600" y="345" font-size="16" fill="#000000" text-anchor="middle" dominant-baseline="middle">C</text>
            <text id="scene1-label-d" x="600" y="185" font-size="16" fill="#000000" text-anchor="middle" dominant-baseline="middle">D</text>
            <text id="scene1-label-o" x="340" y="150" font-size="16" fill="#000000" text-anchor="middle" dominant-baseline="middle">O</text>

            <!-- 角度数值标签（远离角度弧和点） -->
            <text id="scene1-label-angle-abc" x="460" y="435" font-size="13" fill="#1565c0" text-anchor="middle" dominant-baseline="middle">120°</text>
            <text id="scene1-label-angle-bac" class="scene1-transition" x="230" y="375" font-size="13" fill="#c62828" text-anchor="middle" dominant-baseline="middle" opacity="0" style="display:none">30°</text>
            <text id="scene1-label-angle-bca" class="scene1-transition" x="555" y="365" font-size="13" fill="#c62828" text-anchor="middle" dominant-baseline="middle" opacity="0" style="display:none">30°</text>
            <text id="scene1-label-angle-abd" class="scene1-transition" x="340" y="425" font-size="13" fill="#c62828" text-anchor="middle" dominant-baseline="middle" opacity="0" style="display:none">90°</text>
            <text id="scene1-label-angle-adb" class="scene1-transition" x="565" y="195" font-size="13" fill="#c62828" text-anchor="middle" dominant-baseline="middle" opacity="0" style="display:none">30°</text>

            <!-- 长度标注（远离线段） -->
            <text id="scene1-label-ad" x="570" y="240" font-size="14" fill="#1565c0" text-anchor="start" dominant-baseline="middle">AD = 6</text>
            <text id="scene1-label-ab" class="scene1-transition" x="220" y="280" font-size="14" fill="#2e7d32" text-anchor="middle" dominant-baseline="middle" opacity="0" style="display:none">AB = 3</text>

            <!-- 右侧推导文字（缩短避免越界） -->
            <text id="scene1-derive1" class="scene1-transition" x="620" y="300" font-size="15" fill="#333333" text-anchor="start" opacity="0" style="display:none">∠BAC = ∠BCA = 30°</text>
            <text id="scene1-derive2" class="scene1-transition" x="620" y="150" font-size="15" fill="#333333" text-anchor="start" opacity="0" style="display:none">直径对圆周角 = 90°</text>
            <text id="scene1-derive3" class="scene1-transition" x="620" y="280" font-size="15" fill="#333333" text-anchor="start" opacity="0" style="display:none">同弧AB圆周角相等</text>
            <text id="scene1-derive4" class="scene1-transition" x="620" y="380" font-size="15" fill="#333333" text-anchor="start" opacity="0" style="display:none">AB = AD/2 = 3</text>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/5</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        'use strict';

        // 当前步骤 0~4
        let currentStep = 0;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const indicator = document.getElementById('scene1-step-indicator');

        // 生成圆（36条线段近似，避免单个大circle元素的bounding box与内部文字重叠）
        const circleGroup = document.getElementById('scene1-circle-lines');
        const cx = 400, cy = 250, r = 160, n = 36;
        for (let i = 0; i < n; i++) {
            const a1 = (2 * Math.PI * i) / n;
            const a2 = (2 * Math.PI * (i + 1)) / n;
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', cx + r * Math.cos(a1));
            line.setAttribute('y1', cy + r * Math.sin(a1));
            line.setAttribute('x2', cx + r * Math.cos(a2));
            line.setAttribute('y2', cy + r * Math.sin(a2));
            line.setAttribute('stroke', '#000000');
            line.setAttribute('stroke-width', '2');
            line.setAttribute('stroke-linecap', 'round');
            circleGroup.appendChild(line);
        }

        // 元素引用
        const els = {
            fillAbc: document.getElementById('scene1-fill-abc'),
            fillAbd: document.getElementById('scene1-fill-abd'),
            arcAbHighlight: document.getElementById('scene1-arc-ab-highlight'),
            lineAd: document.getElementById('scene1-line-ad'),
            lineBd: document.getElementById('scene1-line-bd'),
            lineAb: document.getElementById('scene1-line-ab'),
            angleBac: document.getElementById('scene1-angle-bac'),
            angleBca: document.getElementById('scene1-angle-bca'),
            angleAbd: document.getElementById('scene1-angle-abd'),
            angleAdb: document.getElementById('scene1-angle-adb'),
            rightAngle: document.getElementById('scene1-right-angle'),
            labelAngleBac: document.getElementById('scene1-label-angle-bac'),
            labelAngleBca: document.getElementById('scene1-label-angle-bca'),
            labelAngleAbd: document.getElementById('scene1-label-angle-abd'),
            labelAngleAdb: document.getElementById('scene1-label-angle-adb'),
            labelAb: document.getElementById('scene1-label-ab'),
            derive1: document.getElementById('scene1-derive1'),
            derive2: document.getElementById('scene1-derive2'),
            derive3: document.getElementById('scene1-derive3'),
            derive4: document.getElementById('scene1-derive4'),
        };

        // 辅助：显示元素
        function show(el) {
            if (!el) return;
            el.style.display = 'block';
            // 强制重排以确保 transition 生效
            void el.offsetWidth;
            el.style.opacity = el.getAttribute('data-target-opacity') || '1';
        }

        // 辅助：隐藏元素
        function hide(el) {
            if (!el) return;
            el.style.opacity = '0';
            setTimeout(function() {
                if (el.style.opacity === '0') {
                    el.style.display = 'none';
                }
            }, 300);
        }

        // 辅助：设置线条样式
        function setLineStyle(el, stroke, width) {
            if (!el) return;
            el.setAttribute('stroke', stroke);
            el.setAttribute('stroke-width', width);
        }

        // 步骤配置
        function applyStep(step) {
            // 步骤0：初始状态（已知条件）
            if (step === 0) {
                hide(els.fillAbc);
                hide(els.fillAbd);
                hide(els.arcAbHighlight);
                setLineStyle(els.lineAd, '#000000', '1.5');
                setLineStyle(els.lineBd, '#000000', '1.5');
                setLineStyle(els.lineAb, '#000000', '1.5');
                hide(els.angleBac); hide(els.labelAngleBac);
                hide(els.angleBca); hide(els.labelAngleBca);
                hide(els.angleAbd); hide(els.labelAngleAbd);
                hide(els.angleAdb); hide(els.labelAngleAdb);
                hide(els.rightAngle);
                hide(els.labelAb);
                hide(els.derive1); hide(els.derive2); hide(els.derive3); hide(els.derive4);
            }
            // 步骤1：底角30°
            else if (step === 1) {
                show(els.fillAbc);
                els.fillAbc.setAttribute('opacity', '0.2');
                hide(els.fillAbd);
                hide(els.arcAbHighlight);
                setLineStyle(els.lineAd, '#000000', '1.5');
                setLineStyle(els.lineBd, '#000000', '1.5');
                setLineStyle(els.lineAb, '#000000', '1.5');
                show(els.angleBac); els.angleBac.setAttribute('opacity', '1');
                show(els.labelAngleBac); els.labelAngleBac.setAttribute('opacity', '1');
                show(els.angleBca); els.angleBca.setAttribute('opacity', '1');
                show(els.labelAngleBca); els.labelAngleBca.setAttribute('opacity', '1');
                hide(els.angleAbd); hide(els.labelAngleAbd);
                hide(els.angleAdb); hide(els.labelAngleAdb);
                hide(els.rightAngle);
                hide(els.labelAb);
                show(els.derive1); els.derive1.setAttribute('opacity', '1');
                hide(els.derive2); hide(els.derive3); hide(els.derive4);
            }
            // 步骤2：直径直角
            else if (step === 2) {
                hide(els.fillAbc);
                show(els.fillAbd);
                els.fillAbd.setAttribute('opacity', '0.2');
                hide(els.arcAbHighlight);
                setLineStyle(els.lineAd, '#1565c0', '3');
                setLineStyle(els.lineBd, '#c62828', '3');
                setLineStyle(els.lineAb, '#000000', '1.5');
                hide(els.angleBac); hide(els.labelAngleBac);
                hide(els.angleBca); hide(els.labelAngleBca);
                show(els.angleAbd); els.angleAbd.setAttribute('opacity', '1');
                show(els.labelAngleAbd); els.labelAngleAbd.setAttribute('opacity', '1');
                hide(els.angleAdb); hide(els.labelAngleAdb);
                show(els.rightAngle); els.rightAngle.setAttribute('opacity', '1');
                hide(els.labelAb);
                hide(els.derive1);
                show(els.derive2); els.derive2.setAttribute('opacity', '1');
                hide(els.derive3); hide(els.derive4);
            }
            // 步骤3：同弧圆周角相等
            else if (step === 3) {
                hide(els.fillAbc);
                show(els.fillAbd);
                els.fillAbd.setAttribute('opacity', '0.2');
                show(els.arcAbHighlight); els.arcAbHighlight.setAttribute('opacity', '1');
                setLineStyle(els.lineAd, '#1565c0', '3');
                setLineStyle(els.lineBd, '#c62828', '3');
                setLineStyle(els.lineAb, '#000000', '1.5');
                hide(els.angleBac); hide(els.labelAngleBac);
                show(els.angleBca); els.angleBca.setAttribute('opacity', '1');
                show(els.labelAngleBca); els.labelAngleBca.setAttribute('opacity', '1');
                show(els.angleAbd); els.angleAbd.setAttribute('opacity', '1');
                show(els.labelAngleAbd); els.labelAngleAbd.setAttribute('opacity', '1');
                show(els.angleAdb); els.angleAdb.setAttribute('opacity', '1');
                show(els.labelAngleAdb); els.labelAngleAdb.setAttribute('opacity', '1');
                show(els.rightAngle); els.rightAngle.setAttribute('opacity', '1');
                hide(els.labelAb);
                hide(els.derive1); hide(els.derive2);
                show(els.derive3); els.derive3.setAttribute('opacity', '1');
                hide(els.derive4);
            }
            // 步骤4：最终答案
            else if (step === 4) {
                hide(els.fillAbc);
                show(els.fillAbd);
                els.fillAbd.setAttribute('opacity', '0.2');
                show(els.arcAbHighlight); els.arcAbHighlight.setAttribute('opacity', '1');
                setLineStyle(els.lineAd, '#1565c0', '3');
                setLineStyle(els.lineBd, '#c62828', '3');
                setLineStyle(els.lineAb, '#2e7d32', '3');
                hide(els.angleBac); hide(els.labelAngleBac);
                show(els.angleBca); els.angleBca.setAttribute('opacity', '1');
                show(els.labelAngleBca); els.labelAngleBca.setAttribute('opacity', '1');
                show(els.angleAbd); els.angleAbd.setAttribute('opacity', '1');
                show(els.labelAngleAbd); els.labelAngleAbd.setAttribute('opacity', '1');
                show(els.angleAdb); els.angleAdb.setAttribute('opacity', '1');
                show(els.labelAngleAdb); els.labelAngleAdb.setAttribute('opacity', '1');
                show(els.rightAngle); els.rightAngle.setAttribute('opacity', '1');
                show(els.labelAb); els.labelAb.setAttribute('opacity', '1');
                hide(els.derive1); hide(els.derive2); hide(els.derive3);
                show(els.derive4); els.derive4.setAttribute('opacity', '1');
            }

            // 更新按钮状态
            btnPrev.disabled = (step === 0);
            btnNext.disabled = (step === 4);
            indicator.textContent = '步骤 ' + (step + 1) + '/5';
        }

        // 事件绑定
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                applyStep(currentStep);
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < 4) {
                currentStep++;
                applyStep(currentStep);
            }
        });

        // 初始化
        applyStep(0);
    })();
    </script>
</body>
</html>
