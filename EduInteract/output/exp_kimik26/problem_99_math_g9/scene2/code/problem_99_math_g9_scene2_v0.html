<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 余弦定理求解</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Times New Roman", serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 20px; z-index: 10; }
        .scene2-btn {
            padding: 6px 18px;
            font-size: 14px;
            font-family: sans-serif;
            background: #f5f5f5;
            border: 1px solid #333333;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .scene2-btn:hover:not(:disabled) { background: #e0e0e0; }
        .scene2-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene2-step-indicator { font-size: 14px; font-family: sans-serif; color: #555; min-width: 80px; text-align: center; }

        /* 公式文本淡入动画 */
        .scene2-formula { opacity: 0; transition: opacity 300ms ease-in-out; }
        .scene2-formula.visible { opacity: 1; }

        /* ED标注颜色过渡 */
        #scene2-label-ed { transition: fill 400ms, transform 400ms cubic-bezier(0.34, 1.56, 0.64, 1); }

        /* 验证图淡入 */
        #scene2-tri-bdf-group { opacity: 0; transition: opacity 300ms ease-in-out; }
        #scene2-tri-bdf-group.visible { opacity: 1; }

        /* 边线高亮 */
        .scene2-highlight { transition: stroke-width 300ms; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" viewBox="0 0 800 500" style="display:block;">
            <!-- 主三角形 ADE: A(120,220), D(270,220), E(240,45) -->
            <polygon id="scene2-tri-ade" points="120,220 270,220 240,45" fill="none" stroke="#000000" stroke-width="2" class="scene2-highlight"/>

            <!-- 角A 60°弧: 中心A(120,220), 半径25, 0°→-60° -->
            <path id="scene2-arc-a" d="M 145,220 A 25,25 0 0,0 132.5,198.35" fill="none" stroke="#000000" stroke-width="1.5"/>

            <!-- 顶点标签 -->
            <text id="scene2-label-a" x="100" y="235" font-size="16" fill="#000000" text-anchor="middle">A</text>
            <text id="scene2-label-d" x="290" y="235" font-size="16" fill="#000000" text-anchor="middle">D</text>
            <text id="scene2-label-e" x="210" y="40" font-size="16" fill="#000000" text-anchor="middle">E</text>

            <!-- 边标注 -->
            <text id="scene2-label-ad" x="195" y="235" font-size="15" fill="#c62828" text-anchor="middle">1</text>
            <text id="scene2-label-ae" x="95" y="120" font-size="15" fill="#1565c0" text-anchor="middle">3−x</text>
            <text id="scene2-label-ed" x="295" y="120" font-size="15" fill="#c62828" text-anchor="middle">x</text>
            <text id="scene2-label-angle-a" x="138" y="238" font-size="14" fill="#000000" text-anchor="middle">60°</text>

            <!-- 右侧公式区 -->
            <!-- 步骤0提示 -->
            <text id="scene2-hint" x="400" y="80" font-size="16" fill="#aaaaaa" font-family="sans-serif">点击下一步开始推导</text>

            <!-- 步骤1: 余弦定理公式 -->
            <text id="scene2-formula-step1" x="400" y="80" font-size="17" fill="#000000" class="scene2-formula">
                <tspan fill="#c62828">ED²</tspan>
                <tspan fill="#000000"> = </tspan>
                <tspan fill="#c62828">AD²</tspan>
                <tspan fill="#000000"> + </tspan>
                <tspan fill="#1565c0">AE²</tspan>
                <tspan fill="#000000"> − 2·</tspan>
                <tspan fill="#c62828">AD</tspan>
                <tspan fill="#000000">·</tspan>
                <tspan fill="#1565c0">AE</tspan>
                <tspan fill="#000000">·cos∠A</tspan>
            </text>

            <!-- 步骤2: 代入数值 -->
            <text id="scene2-formula-step2" x="400" y="120" font-size="17" fill="#000000" class="scene2-formula">
                <tspan fill="#c62828">x²</tspan>
                <tspan fill="#000000"> = 1² + (3−x)² − 2·1·(3−x)·</tspan>
                <tspan fill="#000000" font-weight="bold">½</tspan>
            </text>

            <!-- 步骤3: 化简方程 -->
            <text id="scene2-formula-step3-1" x="400" y="160" font-size="17" fill="#000000" class="scene2-formula">x² = 1 + 9 − 6x + x² − 3 + x</text>
            <text id="scene2-formula-step3-2" x="400" y="195" font-size="17" fill="#000000" class="scene2-formula">0 = 7 − 5x</text>
            <text id="scene2-formula-step3-3" x="400" y="230" font-size="18" fill="#2e7d32" font-weight="bold" class="scene2-formula">5x = 7</text>

            <!-- 步骤4: 结论 -->
            <text id="scene2-formula-step4-1" x="400" y="270" font-size="18" fill="#2e7d32" font-weight="bold" class="scene2-formula">x = 7/5</text>
            <text id="scene2-formula-step4-2" x="400" y="305" font-size="18" fill="#2e7d32" font-weight="bold" class="scene2-formula">∴ CE = 7/5，对应选项 A</text>

            <!-- 验证图 △BDF (步骤5): B(120,420), D(270,420), F(167,339) -->
            <g id="scene2-tri-bdf-group">
                <polygon id="scene2-tri-bdf" points="120,420 270,420 167,339" fill="none" stroke="#000000" stroke-width="1.5"/>
                <!-- 角B 60°弧: 中心B(120,420), 半径20, 0°→-60° (inside triangle) -->
                <path id="scene2-arc-b" d="M 140,420 A 20,20 0 0,0 130,402.68" fill="none" stroke="#000000" stroke-width="1.2"/>
                <!-- 顶点标签 -->
                <text id="scene2-label-b" x="100" y="435" font-size="14" fill="#000000" text-anchor="middle">B</text>
                <text id="scene2-label-d2" x="290" y="435" font-size="14" fill="#000000" text-anchor="middle">D</text>
                <text id="scene2-label-f" x="167" y="325" font-size="14" fill="#000000" text-anchor="middle">F</text>
                <!-- 边标注 -->
                <text id="scene2-label-bd" x="195" y="435" font-size="13" fill="#000000" text-anchor="middle">2</text>
                <text id="scene2-label-bf" x="90" y="370" font-size="13" fill="#000000" text-anchor="middle">5/4</text>
                <text id="scene2-label-fd" x="290" y="360" font-size="13" fill="#2e7d32" text-anchor="middle">7/4</text>
                <text id="scene2-label-angle-b" x="138" y="455" font-size="12" fill="#000000" text-anchor="middle">60°</text>
            </g>

            <!-- 步骤5验证公式 -->
            <text id="scene2-formula-step5-1" x="400" y="345" font-size="14" fill="#000000" class="scene2-formula">
                <tspan fill="#000000">验证：FD² = 2² + (5/4)² − 2·2·(5/4)·½ = 49/16</tspan>
            </text>
            <text id="scene2-formula-step5-2" x="400" y="380" font-size="14" fill="#2e7d32" font-weight="bold" class="scene2-formula">∴ FD = 7/4 = CF</text>
        </svg>

        <div id="scene2-controls">
            <button id="scene2-btn-prev" class="scene2-btn">◀ 上一步</button>
            <span id="scene2-step-indicator">步骤 1/5</span>
            <button id="scene2-btn-next" class="scene2-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2 实现
        let currentStep = 0;
        const totalSteps = 5;

        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        const indicator = document.getElementById('scene2-step-indicator');

        // 公式元素
        const hint = document.getElementById('scene2-hint');
        const formulaStep1 = document.getElementById('scene2-formula-step1');
        const formulaStep2 = document.getElementById('scene2-formula-step2');
        const formulaStep3_1 = document.getElementById('scene2-formula-step3-1');
        const formulaStep3_2 = document.getElementById('scene2-formula-step3-2');
        const formulaStep3_3 = document.getElementById('scene2-formula-step3-3');
        const formulaStep4_1 = document.getElementById('scene2-formula-step4-1');
        const formulaStep4_2 = document.getElementById('scene2-formula-step4-2');
        const formulaStep5_1 = document.getElementById('scene2-formula-step5-1');
        const formulaStep5_2 = document.getElementById('scene2-formula-step5-2');

        // 图形元素
        const triAde = document.getElementById('scene2-tri-ade');
        const labelEd = document.getElementById('scene2-label-ed');
        const triBdfGroup = document.getElementById('scene2-tri-bdf-group');
        const labelAngleA = document.getElementById('scene2-label-angle-a');

        function updateButtons() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps;
            indicator.textContent = '步骤 ' + (currentStep + 1) + '/' + (totalSteps + 1);
        }

        function show(el) {
            if (!el) return;
            el.style.display = 'block';
            requestAnimationFrame(function() {
                el.classList.add('visible');
            });
        }

        function hide(el) {
            if (!el) return;
            el.classList.remove('visible');
            setTimeout(function() {
                if (!el.classList.contains('visible')) {
                    el.style.display = 'none';
                }
            }, 300);
        }

        function hideImmediate(el) {
            if (!el) return;
            el.classList.remove('visible');
            el.style.display = 'none';
        }

        function highlightEdge(element, duration) {
            if (!element) return;
            var originalWidth = element.getAttribute('stroke-width') || '2';
            element.setAttribute('stroke-width', '4');
            setTimeout(function() {
                element.setAttribute('stroke-width', originalWidth);
            }, duration || 300);
        }

        function pulseLabel(element, duration) {
            if (!element) return;
            var originalTransform = element.getAttribute('transform') || '';
            var cx = element.getAttribute('x');
            var cy = element.getAttribute('y');
            element.setAttribute('transform', 'scale(1.2) translate(' + (-cx*0.2/1.2) + ',' + (-cy*0.2/1.2) + ')');
            setTimeout(function() {
                element.setAttribute('transform', originalTransform);
            }, duration || 300);
        }

        function renderStep() {
            // 先隐藏所有公式
            hideImmediate(hint);
            hideImmediate(formulaStep1);
            hideImmediate(formulaStep2);
            hideImmediate(formulaStep3_1);
            hideImmediate(formulaStep3_2);
            hideImmediate(formulaStep3_3);
            hideImmediate(formulaStep4_1);
            hideImmediate(formulaStep4_2);
            hideImmediate(formulaStep5_1);
            hideImmediate(formulaStep5_2);

            // 重置ED标注
            labelEd.textContent = 'x';
            labelEd.setAttribute('fill', '#c62828');
            labelEd.setAttribute('transform', '');

            // 隐藏验证图
            triBdfGroup.classList.remove('visible');
            setTimeout(function() {
                if (!triBdfGroup.classList.contains('visible')) {
                    triBdfGroup.style.display = 'none';
                }
            }, 300);

            switch (currentStep) {
                case 0:
                    show(hint);
                    break;
                case 1:
                    show(formulaStep1);
                    highlightEdge(triAde, 300);
                    break;
                case 2:
                    show(formulaStep1);
                    show(formulaStep2);
                    pulseLabel(labelAngleA, 300);
                    break;
                case 3:
                    show(formulaStep1);
                    show(formulaStep2);
                    show(formulaStep3_1);
                    setTimeout(function() { show(formulaStep3_2); }, 150);
                    setTimeout(function() { show(formulaStep3_3); }, 300);
                    break;
                case 4:
                    show(formulaStep1);
                    show(formulaStep2);
                    show(formulaStep3_1);
                    show(formulaStep3_2);
                    show(formulaStep3_3);
                    show(formulaStep4_1);
                    show(formulaStep4_2);
                    // ED标注变为7/5，颜色变绿，弹性放大
                    labelEd.textContent = '7/5';
                    labelEd.setAttribute('fill', '#2e7d32');
                    var cx = labelEd.getAttribute('x');
                    var cy = labelEd.getAttribute('y');
                    labelEd.setAttribute('transform', 'scale(1.2) translate(' + (-cx*0.2/1.2) + ',' + (-cy*0.2/1.2) + ')');
                    setTimeout(function() {
                        labelEd.setAttribute('transform', 'scale(1) translate(0,0)');
                    }, 400);
                    break;
                case 5:
                    show(formulaStep1);
                    show(formulaStep2);
                    show(formulaStep3_1);
                    show(formulaStep3_2);
                    show(formulaStep3_3);
                    show(formulaStep4_1);
                    show(formulaStep4_2);
                    labelEd.textContent = '7/5';
                    labelEd.setAttribute('fill', '#2e7d32');
                    // 显示验证图
                    triBdfGroup.style.display = 'block';
                    requestAnimationFrame(function() {
                        triBdfGroup.classList.add('visible');
                    });
                    show(formulaStep5_1);
                    show(formulaStep5_2);
                    break;
            }

            updateButtons();
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                renderStep();
            }
        });

        // 初始渲染
        renderStep();
    })();
    </script>
</body>
</html>
