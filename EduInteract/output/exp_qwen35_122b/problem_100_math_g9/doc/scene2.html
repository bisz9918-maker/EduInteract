<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 正方形网格中的图形折叠分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Microsoft YaHei', sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene2-btn { padding: 8px 20px; font-size: 14px; border: none; border-radius: 4px; cursor: pointer; transition: all 0.2s; }
        .scene2-btn-prev { background: #9e9e9e; color: white; }
        .scene2-btn-prev:disabled { background: #bdbdbd; cursor: not-allowed; }
        .scene2-btn-next { background: #1976d2; color: white; }
        .scene2-btn-next:hover:not(:disabled) { background: #1565c0; }
        .scene2-grid-line { stroke: #e0e0e0; stroke-width: 1; stroke-dasharray: 4,4; }
        .scene2-shape-line { stroke: #000000; stroke-width: 2; fill: none; }
        .scene2-fill-red { fill: #c62828; opacity: 0; transition: opacity 0.3s ease; }
        .scene2-fill-green { fill: #2e7d32; opacity: 0; transition: opacity 0.3s ease; }
        .scene2-fill-blue { fill: #1565c0; opacity: 0; transition: opacity 0.3s ease; }
        .scene2-label { font-size: 14px; fill: #000000; }
        .scene2-label-number { font-size: 18px; font-weight: bold; fill: #000000; }
        .scene2-label-check { font-size: 20px; font-weight: bold; }
        .scene2-label-result { font-size: 20px; font-weight: bold; fill: #1565c0; }
        .scene2-label-type { font-size: 14px; fill: #000000; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" id="scene2-svg">
            <!-- 网格背景 -->
            <g id="scene2-grid"></g>
            
            <!-- 结论文字（步骤 3 显示） -->
            <text id="scene2-result-text" x="400" y="45" text-anchor="middle" class="scene2-label-result" style="display: none;">答案：B．③和④</text>
            
            <!-- 图形① -->
            <g id="scene2-group-1">
                <text id="scene2-label-num-1" x="115" y="95" text-anchor="middle" class="scene2-label-number">①</text>
                <!-- 矩形主体 -->
                <path id="scene2-rect-1" d="M 65,140 L 165,140 L 165,260 L 65,260 Z" class="scene2-shape-line"/>
                <!-- 左侧直角三角形 -->
                <path id="scene2-tri-left-1" d="M 65,140 L 35,160 L 65,180 Z" class="scene2-shape-line scene2-fill-red" id="scene2-fill-tri-left-1"/>
                <path id="scene2-tri-left-1-fill" d="M 65,140 L 35,160 L 65,180 Z" class="scene2-fill-red" style="opacity: 0;"/>
                <!-- 右侧直角三角形 -->
                <path id="scene2-tri-right-1" d="M 165,220 L 195,240 L 165,260 Z" class="scene2-shape-line"/>
                <path id="scene2-tri-right-1-fill" d="M 165,220 L 195,240 L 165,260 Z" class="scene2-fill-red" style="opacity: 0;"/>
                <!-- 类型标注 -->
                <text id="scene2-label-type-1" x="115" y="310" text-anchor="middle" class="scene2-label-type" style="display: none;">直角三角形</text>
                <!-- 判定标记 -->
                <text id="scene2-label-check-1" x="115" y="335" text-anchor="middle" class="scene2-label-check" style="display: none;">✗ 不可折叠</text>
            </g>
            
            <!-- 图形② -->
            <g id="scene2-group-2">
                <text id="scene2-label-num-2" x="295" y="95" text-anchor="middle" class="scene2-label-number">②</text>
                <!-- 矩形主体 -->
                <path id="scene2-rect-2" d="M 245,140 L 345,140 L 345,260 L 245,260 Z" class="scene2-shape-line"/>
                <!-- 左侧直角三角形 -->
                <path id="scene2-tri-left-2" d="M 245,160 L 215,180 L 245,200 Z" class="scene2-shape-line"/>
                <path id="scene2-tri-left-2-fill" d="M 245,160 L 215,180 L 245,200 Z" class="scene2-fill-red" style="opacity: 0;"/>
                <!-- 右侧直角三角形 -->
                <path id="scene2-tri-right-2" d="M 345,180 L 375,200 L 345,220 Z" class="scene2-shape-line"/>
                <path id="scene2-tri-right-2-fill" d="M 345,180 L 375,200 L 345,220 Z" class="scene2-fill-red" style="opacity: 0;"/>
                <!-- 类型标注 -->
                <text id="scene2-label-type-2" x="295" y="310" text-anchor="middle" class="scene2-label-type" style="display: none;">直角三角形</text>
                <!-- 判定标记 -->
                <text id="scene2-label-check-2" x="295" y="335" text-anchor="middle" class="scene2-label-check" style="display: none;">✗ 不可折叠</text>
            </g>
            
            <!-- 图形③ -->
            <g id="scene2-group-3">
                <text id="scene2-label-num-3" x="475" y="95" text-anchor="middle" class="scene2-label-number">③</text>
                <!-- 平行四边形主体 -->
                <path id="scene2-para-3" d="M 425,160 L 525,140 L 525,240 L 425,260 Z" class="scene2-shape-line"/>
                <!-- 上方锐角三角形 -->
                <path id="scene2-tri-top-3" d="M 455,140 L 475,100 L 495,140 Z" class="scene2-shape-line"/>
                <path id="scene2-tri-top-3-fill" d="M 455,140 L 475,100 L 495,140 Z" class="scene2-fill-green" style="opacity: 0;"/>
                <!-- 下方锐角三角形 -->
                <path id="scene2-tri-bottom-3" d="M 455,240 L 475,280 L 495,240 Z" class="scene2-shape-line"/>
                <path id="scene2-tri-bottom-3-fill" d="M 455,240 L 475,280 L 495,240 Z" class="scene2-fill-green" style="opacity: 0;"/>
                <!-- 类型标注 -->
                <text id="scene2-label-type-3" x="475" y="310" text-anchor="middle" class="scene2-label-type" style="display: none;">锐角三角形</text>
                <!-- 判定标记 -->
                <text id="scene2-label-check-3" x="475" y="335" text-anchor="middle" class="scene2-label-check" style="display: none;">✓ 可折叠</text>
            </g>
            
            <!-- 图形④ -->
            <g id="scene2-group-4">
                <text id="scene2-label-num-4" x="655" y="95" text-anchor="middle" class="scene2-label-number">④</text>
                <!-- 矩形主体 -->
                <path id="scene2-rect-4" d="M 600,160 L 700,160 L 700,260 L 600,260 Z" class="scene2-shape-line"/>
                <!-- 上方锐角三角形 -->
                <path id="scene2-tri-top-4" d="M 620,140 L 635,110 L 650,140 Z" class="scene2-shape-line"/>
                <path id="scene2-tri-top-4-fill" d="M 620,140 L 635,110 L 650,140 Z" class="scene2-fill-green" style="opacity: 0;"/>
                <!-- 下方锐角三角形 -->
                <path id="scene2-tri-bottom-4" d="M 650,260 L 665,290 L 680,260 Z" class="scene2-shape-line"/>
                <path id="scene2-tri-bottom-4-fill" d="M 650,260 L 665,290 L 680,260 Z" class="scene2-fill-green" style="opacity: 0;"/>
                <!-- 类型标注 -->
                <text id="scene2-label-type-4" x="655" y="310" text-anchor="middle" class="scene2-label-type" style="display: none;">锐角三角形</text>
                <!-- 判定标记 -->
                <text id="scene2-label-check-4" x="655" y="335" text-anchor="middle" class="scene2-label-check" style="display: none;">✓ 可折叠</text>
            </g>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-btn-prev" class="scene2-btn scene2-btn-prev" disabled>◀ 上一步</button>
            <button id="scene2-btn-next" class="scene2-btn scene2-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现
        // 布局坐标表：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // |------|------|-----------|------|-------------|------|
        // | 图形①主体 | 矩形 + 三角形 | (50,120)-(180,280) | 130×160 | - | 左侧第一个 |
        // | 图形①编号 | text | (115,95) | 30×20 | 上方 | 图形正上方 |
        // | 图形①类型标注 | text | (115,310) | 80×20 | 下方 | 直角三角形 |
        // | 图形①判定标记 | text | (115,335) | 60×20 | 下方 | ✗ 不可折叠 |
        // | 图形②主体 | 矩形 + 三角形 | (230,120)-(360,280) | 130×160 | - | 左二 |
        // | 图形②编号 | text | (295,95) | 30×20 | 上方 | 图形正上方 |
        // | 图形②类型标注 | text | (295,310) | 80×20 | 下方 | 直角三角形 |
        // | 图形②判定标记 | text | (295,335) | 60×20 | 下方 | ✗ 不可折叠 |
        // | 图形③主体 | 平行四边形 + 三角形 | (410,120)-(540,280) | 130×160 | - | 右二 |
        // | 图形③编号 | text | (475,95) | 30×20 | 上方 | 图形正上方 |
        // | 图形③类型标注 | text | (475,310) | 80×20 | 下方 | 锐角三角形 |
        // | 图形③判定标记 | text | (475,335) | 60×20 | 下方 | ✓ 可折叠 |
        // | 图形④主体 | 矩形 + 三角形 | (590,120)-(720,280) | 130×160 | - | 右侧第四个 |
        // | 图形④编号 | text | (655,95) | 30×20 | 上方 | 图形正上方 |
        // | 图形④类型标注 | text | (655,310) | 80×20 | 下方 | 锐角三角形 |
        // | 图形④判定标记 | text | (655,335) | 60×20 | 下方 | ✓ 可折叠 |
        
        const scene2 = {
            currentStep: 0,
            maxStep: 3,
            
            // 工具函数：显示元素
            show: function(el) {
                if (el) {
                    el.style.display = 'block';
                    el.style.opacity = '1';
                }
            },
            
            // 工具函数：隐藏元素
            hide: function(el) {
                if (el) {
                    el.style.display = 'none';
                    el.style.opacity = '0';
                }
            },
            
            // 绘制网格背景
            drawGrid: function() {
                const gridGroup = document.getElementById('scene2-grid');
                const svg = document.getElementById('scene2-svg');
                const width = 800;
                const height = 500;
                const spacing = 20;
                
                // 垂直线
                for (let x = 0; x <= width; x += spacing) {
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', x);
                    line.setAttribute('y1', 0);
                    line.setAttribute('x2', x);
                    line.setAttribute('y2', height);
                    line.setAttribute('class', 'scene2-grid-line');
                    gridGroup.appendChild(line);
                }
                
                // 水平线
                for (let y = 0; y <= height; y += spacing) {
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', 0);
                    line.setAttribute('y1', y);
                    line.setAttribute('x2', width);
                    line.setAttribute('y2', y);
                    line.setAttribute('class', 'scene2-grid-line');
                    gridGroup.appendChild(line);
                }
            },
            
            // 更新步骤状态
            updateStep: function() {
                const btnPrev = document.getElementById('scene2-btn-prev');
                const btnNext = document.getElementById('scene2-btn-next');
                
                // 更新按钮状态
                btnPrev.disabled = (this.currentStep === 0);
                
                if (this.currentStep === this.maxStep) {
                    btnNext.textContent = '重播';
                } else {
                    btnNext.textContent = '下一步 ▶';
                }
                
                // 步骤 0: 初始状态 - 只显示轮廓
                if (this.currentStep === 0) {
                    this.hide(document.getElementById('scene2-result-text'));
                    this.hide(document.getElementById('scene2-label-type-1'));
                    this.hide(document.getElementById('scene2-label-check-1'));
                    this.hide(document.getElementById('scene2-label-type-2'));
                    this.hide(document.getElementById('scene2-label-check-2'));
                    this.hide(document.getElementById('scene2-label-type-3'));
                    this.hide(document.getElementById('scene2-label-check-3'));
                    this.hide(document.getElementById('scene2-label-type-4'));
                    this.hide(document.getElementById('scene2-label-check-4'));
                    
                    document.getElementById('scene2-tri-left-1-fill').style.opacity = '0';
                    document.getElementById('scene2-tri-right-1-fill').style.opacity = '0';
                    document.getElementById('scene2-tri-left-2-fill').style.opacity = '0';
                    document.getElementById('scene2-tri-right-2-fill').style.opacity = '0';
                    document.getElementById('scene2-tri-top-3-fill').style.opacity = '0';
                    document.getElementById('scene2-tri-bottom-3-fill').style.opacity = '0';
                    document.getElementById('scene2-tri-top-4-fill').style.opacity = '0';
                    document.getElementById('scene2-tri-bottom-4-fill').style.opacity = '0';
                }
                
                // 步骤 1: 高亮图①②的直角三角形
                if (this.currentStep >= 1) {
                    this.show(document.getElementById('scene2-label-type-1'));
                    this.show(document.getElementById('scene2-label-check-1'));
                    this.show(document.getElementById('scene2-label-type-2'));
                    this.show(document.getElementById('scene2-label-check-2'));
                    
                    document.getElementById('scene2-label-check-1').style.fill = '#c62828';
                    document.getElementById('scene2-label-check-1').textContent = '✗ 不可折叠';
                    document.getElementById('scene2-label-check-2').style.fill = '#c62828';
                    document.getElementById('scene2-label-check-2').textContent = '✗ 不可折叠';
                    
                    document.getElementById('scene2-tri-left-1-fill').style.opacity = '0.2';
                    document.getElementById('scene2-tri-right-1-fill').style.opacity = '0.2';
                    document.getElementById('scene2-tri-left-2-fill').style.opacity = '0.2';
                    document.getElementById('scene2-tri-right-2-fill').style.opacity = '0.2';
                }
                
                // 步骤 2: 高亮图③④的锐角三角形
                if (this.currentStep >= 2) {
                    this.show(document.getElementById('scene2-label-type-3'));
                    this.show(document.getElementById('scene2-label-check-3'));
                    this.show(document.getElementById('scene2-label-type-4'));
                    this.show(document.getElementById('scene2-label-check-4'));
                    
                    document.getElementById('scene2-label-check-3').style.fill = '#2e7d32';
                    document.getElementById('scene2-label-check-3').textContent = '✓ 可折叠';
                    document.getElementById('scene2-label-check-4').style.fill = '#2e7d32';
                    document.getElementById('scene2-label-check-4').textContent = '✓ 可折叠';
                    
                    document.getElementById('scene2-tri-top-3-fill').style.opacity = '0.2';
                    document.getElementById('scene2-tri-bottom-3-fill').style.opacity = '0.2';
                    document.getElementById('scene2-tri-top-4-fill').style.opacity = '0.2';
                    document.getElementById('scene2-tri-bottom-4-fill').style.opacity = '0.2';
                }
                
                // 步骤 3: 显示答案
                if (this.currentStep >= 3) {
                    this.show(document.getElementById('scene2-result-text'));
                }
            },
            
            // 下一步
            nextStep: function() {
                if (this.currentStep < this.maxStep) {
                    this.currentStep++;
                    this.updateStep();
                } else {
                    // 重播
                    this.currentStep = 0;
                    this.updateStep();
                }
            },
            
            // 上一步
            prevStep: function() {
                if (this.currentStep > 0) {
                    this.currentStep--;
                    this.updateStep();
                }
            },
            
            // 初始化
            init: function() {
                this.drawGrid();
                this.updateStep();
                
                document.getElementById('scene2-btn-next').addEventListener('click', () => {
                    this.nextStep();
                });
                
                document.getElementById('scene2-btn-prev').addEventListener('click', () => {
                    this.prevStep();
                });
            }
        };
        
        scene2.init();
    })();
    </script>
</body>
</html>
