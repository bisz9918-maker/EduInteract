<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 1 - 直线 AB 与坐标轴交点</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            width: 80px; height: 30px;
            font-size: 14px;
            background: #1976d2; color: white;
            border: none; border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
        }
        #scene1-controls button:hover:not(:disabled) { background: #1565c0; }
        #scene1-controls button:disabled { background: #bdbdbd; cursor: not-allowed; }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- 坐标轴（步骤 0 显示） -->
            <line id="scene1-axis-x" class="scene1-element" data-step="0"
                  x1="100" y1="250" x2="750" y2="250"
                  stroke="black" stroke-width="2" marker-end="url(#arrowhead)" />
            <line id="scene1-axis-y" class="scene1-element" data-step="0"
                  x1="400" y1="50" x2="400" y2="450"
                  stroke="black" stroke-width="2" marker-end="url(#arrowhead)" />
            
            <!-- 箭头标记定义 -->
            <defs>
                <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="black" />
                </marker>
            </defs>
            
            <!-- 原点 O（步骤 0 显示） -->
            <circle id="scene1-point-o" class="scene1-element" data-step="0"
                    cx="400" cy="250" r="4" fill="black" />
            <text id="scene1-label-o" class="scene1-element" data-step="0"
                  x="385" y="320" font-size="16" fill="black">O</text>
            
            <!-- 坐标轴标签（步骤 0 显示） -->
            <text id="scene1-label-x" class="scene1-element" data-step="0"
                  x="730" y="240" font-size="16" fill="black">x</text>
            <text id="scene1-label-y" class="scene1-element" data-step="0"
                  x="410" y="60" font-size="16" fill="black">y</text>
            
            <!-- 点 A（步骤 1 显示） -->
            <circle id="scene1-point-a" class="scene1-element" data-step="1"
                    cx="350" cy="50" r="6" fill="black" />
            <text id="scene1-label-a" class="scene1-element" data-step="1"
                  x="280" y="45" font-size="16" fill="black">A(-1,4)</text>
            
            <!-- 点 B（步骤 1 显示） -->
            <circle id="scene1-point-b" class="scene1-element" data-step="1"
                    cx="500" cy="200" r="6" fill="black" />
            <text id="scene1-label-b" class="scene1-element" data-step="1"
                  x="515" y="95" font-size="16" fill="black">B(2,1)</text>
            
            <!-- 直线 AB（步骤 1 显示）- 避开标签区域 -->
            <line id="scene1-line-ab" class="scene1-element" data-step="1"
                  x1="250" y1="100" x2="700" y2="400"
                  stroke="black" stroke-width="1.5" />
            
            <!-- 点 N（步骤 2 显示） -->
            <circle id="scene1-point-n" class="scene1-element" data-step="2"
                    cx="400" cy="0" r="6" fill="black" />
            <text id="scene1-label-n" class="scene1-element" data-step="2"
                  x="415" y="60" font-size="16" fill="black">N(0,5)</text>
            
            <!-- 点 M（步骤 2 显示） -->
            <circle id="scene1-point-m" class="scene1-element" data-step="2"
                    cx="650" cy="250" r="6" fill="black" />
            <text id="scene1-label-m" class="scene1-element" data-step="2"
                  x="640" y="325" font-size="16" fill="black">M(5,0)</text>
            
            <!-- 线段 AN（步骤 3 高亮） -->
            <line id="scene1-line-an" class="scene1-element" data-step="3"
                  x1="350" y1="50" x2="400" y2="0"
                  stroke="#1565c0" stroke-width="2" />
            
            <!-- 线段 BM（步骤 3 高亮） -->
            <line id="scene1-line-bm" class="scene1-element" data-step="3"
                  x1="500" y1="200" x2="650" y2="250"
                  stroke="#c62828" stroke-width="2" />
            
            <!-- AN 区域填充（步骤 3 显示） -->
            <polygon id="scene1-fill-an" class="scene1-element" data-step="3"
                     points="350,50 400,0 400,50"
                     fill="#1565c0" opacity="0.15" />
            
            <!-- BM 区域填充（步骤 3 显示） -->
            <polygon id="scene1-fill-bm" class="scene1-element" data-step="3"
                     points="500,200 650,250 500,250"
                     fill="#c62828" opacity="0.15" />
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-prev" disabled>◀上一步</button>
            <button id="scene1-next">下一步▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现
        // 坐标映射规则：原点 O(0,0) → (400,250)，单位长度 50px
        // screenX = 400 + x * 50
        // screenY = 250 - y * 50
        
        const currentStepMax = 3;
        let currentStep = 0;
        
        // 获取所有需要控制的元素
        const elements = document.querySelectorAll('.scene1-element');
        const prevBtn = document.getElementById('scene1-prev');
        const nextBtn = document.getElementById('scene1-next');
        
        // 更新元素显示状态
        function updateElements() {
            elements.forEach(el => {
                const step = parseInt(el.getAttribute('data-step'));
                if (step <= currentStep) {
                    el.style.display = 'block';
                    el.style.opacity = '1';
                    el.classList.add('fade-in');
                } else {
                    el.style.display = 'none';
                    el.style.opacity = '0';
                    el.classList.remove('fade-in');
                }
            });
        }
        
        // 更新按钮状态
        function updateButtons() {
            prevBtn.disabled = (currentStep === 0);
            nextBtn.disabled = (currentStep === currentStepMax);
        }
        
        // 上一步按钮点击
        prevBtn.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateElements();
                updateButtons();
            }
        });
        
        // 下一步按钮点击
        nextBtn.addEventListener('click', () => {
            if (currentStep < currentStepMax) {
                currentStep++;
                updateElements();
                updateButtons();
            }
        });
        
        // 初始化
        updateElements();
        updateButtons();
    })();
    </script>
</body>
</html>
