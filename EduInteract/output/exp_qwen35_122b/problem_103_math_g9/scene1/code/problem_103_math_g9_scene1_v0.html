<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正方形与菱形面积计算 - 场景 1</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 20px; z-index: 10; }
        #scene1-btn-prev, #scene1-btn-next {
            padding: 8px 16px; font-size: 14px; cursor: pointer; border: 2px solid #333; border-radius: 6px;
            background: #f5f5f5; color: #333; transition: all 0.2s;
        }
        #scene1-btn-prev:hover, #scene1-btn-next:hover { background: #e0e0e0; }
        #scene1-btn-prev:disabled, #scene1-btn-next:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 16px; font-weight: bold; color: #333; }
        .highlight-pulse { animation: pulse-highlight 1s ease-in-out; }
        @keyframes pulse-highlight {
            0%, 100% { stroke-width: 2; }
            50% { stroke-width: 4; }
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 背景 -->
            <rect width="800" height="500" fill="#ffffff"/>
            
            <!-- 步骤 0: 基础图形结构 -->
            <g id="scene1-step0">
                <!-- 正方形 ABCD -->
                <rect id="scene1-square" x="200" y="120" width="140" height="140" fill="none" stroke="#000000" stroke-width="2"/>
                <!-- 菱形 PQCB -->
                <polygon id="scene1-rhombus" points="280,150 430,150 340,260 190,260" fill="none" stroke="#000000" stroke-width="2"/>
                <!-- 顶点 A -->
                <circle id="scene1-point-A" cx="200" cy="120" r="4" fill="#000000"/>
                <text id="scene1-label-A" x="170" y="110" font-size="16" fill="#000000">A</text>
                <!-- 顶点 B -->
                <circle id="scene1-point-B" cx="200" cy="260" r="4" fill="#000000"/>
                <text id="scene1-label-B" x="170" y="290" font-size="16" fill="#000000">B</text>
                <!-- 顶点 C -->
                <circle id="scene1-point-C" cx="340" cy="260" r="4" fill="#000000"/>
                <text id="scene1-label-C" x="355" y="290" font-size="16" fill="#000000">C</text>
                <!-- 顶点 D -->
                <circle id="scene1-point-D" cx="340" cy="120" r="4" fill="#000000"/>
                <text id="scene1-label-D" x="355" y="110" font-size="16" fill="#000000">D</text>
                <!-- 顶点 P -->
                <circle id="scene1-point-P" cx="280" cy="150" r="4" fill="#000000"/>
                <text id="scene1-label-P" x="285" y="140" font-size="16" fill="#000000">P</text>
                <!-- 顶点 Q -->
                <circle id="scene1-point-Q" cx="430" cy="150" r="4" fill="#000000"/>
                <text id="scene1-label-Q" x="440" y="145" font-size="16" fill="#000000">Q</text>
                <!-- 交点 E -->
                <circle id="scene1-point-E" cx="340" cy="150" r="4" fill="#000000"/>
                <text id="scene1-label-E" x="345" y="165" font-size="16" fill="#000000">E</text>
            </g>
            
            <!-- 步骤 1: 正方形边长标注 -->
            <g id="scene1-step1" style="display:none">
                <text id="scene1-label-BC" x="250" y="310" font-size="16" fill="#000000">BC=5</text>
                <text id="scene1-label-area-square" x="225" y="95" font-size="16" fill="#000000">面积=25</text>
            </g>
            
            <!-- 步骤 2: 菱形高标注 -->
            <g id="scene1-step2" style="display:none">
                <!-- 辅助垂线 PF -->
                <line id="scene1-height-line" x1="280" y1="150" x2="280" y2="260" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
                <!-- 垂足 F -->
                <circle id="scene1-point-F" cx="280" cy="260" r="4" fill="#000000"/>
                <text id="scene1-label-F" x="285" y="300" font-size="16" fill="#000000">F</text>
                <!-- 直角符号 -->
                <line id="scene1-right-angle-1" x1="275" y1="255" x2="285" y2="255" stroke="#888888" stroke-width="1"/>
                <line id="scene1-right-angle-2" x1="285" y1="255" x2="285" y2="265" stroke="#888888" stroke-width="1"/>
                <!-- 高标注 -->
                <text id="scene1-label-height" x="288" y="220" font-size="16" fill="#c62828" font-weight="bold">高=4</text>
            </g>
            
            <!-- 步骤 3: 空白梯形面积 -->
            <g id="scene1-step3" style="display:none">
                <!-- 梯形 PBCE 边框高亮 -->
                <polygon id="scene1-trapezoid" points="280,150 340,150 340,260 200,260" fill="none" stroke="#ff9800" stroke-width="2" stroke-dasharray="5,5"/>
                <!-- 梯形面积标注 -->
                <text id="scene1-label-trapezoid-area" x="295" y="230" font-size="16" fill="#ff9800" font-weight="bold">空白=14</text>
            </g>
            
            <!-- 步骤 4: 阴影面积结论 -->
            <g id="scene1-step4" style="display:none">
                <!-- 阴影区域 ABPED -->
                <polygon id="scene1-shadow" points="200,120 200,260 280,150 340,150 340,120" fill="#1565c0" fill-opacity="0.3"/>
                <!-- 阴影面积标注 -->
                <text id="scene1-label-shadow-area" x="225" y="200" font-size="18" fill="#0d47a1" font-weight="bold">阴影=11</text>
            </g>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/5</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        'use strict';
        
        // 状态变量
        let currentStep = 0;
        const totalSteps = 5;
        
        // DOM 元素引用
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        
        // 步骤元素组
        const stepGroups = {
            0: document.getElementById('scene1-step0'),
            1: document.getElementById('scene1-step1'),
            2: document.getElementById('scene1-step2'),
            3: document.getElementById('scene1-step3'),
            4: document.getElementById('scene1-step4')
        };
        
        // 更新场景显示
        function updateScene() {
            // 隐藏所有步骤组
            for (let i = 0; i < totalSteps; i++) {
                if (stepGroups[i]) {
                    stepGroups[i].style.display = 'none';
                    stepGroups[i].style.opacity = '0';
                }
            }
            
            // 显示当前及之前所有步骤组
            for (let i = 0; i <= currentStep; i++) {
                if (stepGroups[i]) {
                    stepGroups[i].style.display = 'block';
                    // 使用 setTimeout 触发 opacity 过渡
                    setTimeout(() => {
                        if (stepGroups[i]) {
                            stepGroups[i].style.opacity = '1';
                        }
                    }, 10);
                }
            }
            
            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps - 1);
            
            // 更新步骤指示器
            stepIndicator.textContent = `步骤 ${currentStep + 1}/${totalSteps}`;
            
            // 步骤特定动画
            if (currentStep === 1) {
                // BC 边高亮
                const bcLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                bcLine.setAttribute('x1', '200');
                bcLine.setAttribute('y1', '260');
                bcLine.setAttribute('x2', '340');
                bcLine.setAttribute('y2', '260');
                bcLine.setAttribute('stroke', '#f44336');
                bcLine.setAttribute('stroke-width', '3');
                bcLine.setAttribute('id', 'scene1-bc-highlight');
                bcLine.classList.add('highlight-pulse');
                stepGroups[0].appendChild(bcLine);
                setTimeout(() => { if (bcLine) bcLine.remove(); }, 1000);
            }
            
            if (currentStep === 2) {
                // 垂线高亮
                const heightLine = document.getElementById('scene1-height-line');
                if (heightLine) {
                    heightLine.classList.add('highlight-pulse');
                    setTimeout(() => { heightLine.classList.remove('highlight-pulse'); }, 1000);
                }
            }
            
            if (currentStep === 4) {
                // 阴影区域脉冲动画
                const shadow = document.getElementById('scene1-shadow');
                if (shadow) {
                    shadow.style.animation = 'pulse-highlight 1s ease-in-out';
                }
            }
        }
        
        // 事件绑定
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });
        
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateScene();
            }
        });
        
        // 初始化
        updateScene();
    })();
    </script>
</body>
</html>
