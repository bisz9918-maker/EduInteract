<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 正方形序列几何递推</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Segoe UI', Arial, sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene2-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 2px solid #1565c0; border-radius: 6px; background: #ffffff; color: #1565c0; transition: all 0.3s; }
        .scene2-btn:hover { background: #1565c0; color: #ffffff; }
        .scene2-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene2-step-indicator { padding: 8px 16px; font-size: 14px; font-weight: bold; color: #1565c0; }
        .scene2-fade-in { animation: scene2-fadeIn 0.3s ease-in-out; }
        @keyframes scene2-fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" id="scene2-svg">
            <!-- 坐标轴 -->
            <line x1="80" y1="420" x2="750" y2="420" stroke="#000000" stroke-width="2" id="scene2-xaxis"/>
            <line x1="120" y1="100" x2="120" y2="450" stroke="#000000" stroke-width="2" id="scene2-yaxis"/>
            <polygon points="750,420 735,415 735,425" fill="#000000"/>
            <polygon points="120,100 115,115 125,115" fill="#000000"/>
            
            <!-- x 轴标签 -->
            <text x="730" y="410" font-size="16" fill="#000000" id="scene2-xlabel">x</text>
            <!-- y 轴标签 -->
            <text x="110" y="110" font-size="16" fill="#000000" id="scene2-ylabel">y</text>
            
            <!-- 原点 O -->
            <circle cx="120" cy="420" r="4" fill="#000000" id="scene2-O-point"/>
            <text x="105" y="435" font-size="14" fill="#000000" id="scene2-O-label">O</text>
            
            <!-- 第一个正方形 A₁B₁C₁D₁ -->
            <polygon points="267,200 120,280 200,420 347,340" fill="#1565c0" fill-opacity="0.2" stroke="#000000" stroke-width="1.5" id="scene2-square1" style="opacity: 0;"/>
            <!-- 第一个正方形顶点 -->
            <circle cx="267" cy="200" r="4" fill="#000000" id="scene2-A1-point"/>
            <text x="267" y="185" font-size="14" fill="#000000" id="scene2-A1-label">A₁</text>
            <circle cx="120" cy="280" r="4" fill="#000000" id="scene2-B1-point"/>
            <text x="105" y="270" font-size="14" fill="#000000" id="scene2-B1-label">B₁</text>
            <circle cx="200" cy="420" r="4" fill="#000000" id="scene2-C1-point"/>
            <text x="200" y="435" font-size="14" fill="#000000" id="scene2-C1-label">C₁</text>
            <circle cx="347" cy="340" r="4" fill="#000000" id="scene2-D1-point"/>
            <text x="362" y="325" font-size="14" fill="#000000" id="scene2-D1-label">D₁</text>
            
            <!-- 直角三角形 OB₁C₁ -->
            <polygon points="120,420 120,280 200,420" fill="#c62828" fill-opacity="0.15" stroke="#c62828" stroke-width="2" id="scene2-triangle-obc" style="opacity: 0;"/>
            
            <!-- 角度弧线 ∠C₁B₁O -->
            <path d="M 120,310 Q 135,300 145,285" fill="none" stroke="#c62828" stroke-width="1.5" id="scene2-angle-arc" style="opacity: 0;"/>
            <text x="155" y="280" font-size="12" fill="#c62828" id="scene2-angle-label" style="opacity: 0;">30°</text>
            
            <!-- 边长标注 B₁C₁=1 -->
            <text x="95" y="360" font-size="14" fill="#000000" id="scene2-bc1-label" style="opacity: 0;">B₁C₁=1</text>
            
            <!-- 辅助线 D₁E₁ -->
            <line x1="347" y1="340" x2="347" y2="420" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" id="scene2-d1e1-line" style="opacity: 0;"/>
            <circle cx="347" cy="420" r="4" fill="#000000" id="scene2-E1-point" style="opacity: 0;"/>
            <text x="347" y="435" font-size="14" fill="#000000" id="scene2-E1-label" style="opacity: 0;">E₁</text>
            <text x="320" y="385" font-size="12" fill="#888888" id="scene2-d1e1-label" style="opacity: 0;">D₁E₁</text>
            
            <!-- 平行标记（B₁C₁边） -->
            <line x1="140" y1="350" x2="160" y2="385" stroke="#c62828" stroke-width="2.5" id="scene2-parallel1" style="opacity: 0;"/>
            
            <!-- 第二个正方形 A₂B₂C₂D₂ -->
            <polygon points="437,260 347,340 417,420 507,340" fill="#1565c0" fill-opacity="0.1" stroke="#000000" stroke-width="1.5" id="scene2-square2" style="opacity: 0;"/>
            <!-- 第二个正方形顶点 -->
            <circle cx="437" cy="260" r="4" fill="#000000" id="scene2-A2-point" style="opacity: 0;"/>
            <text x="437" y="245" font-size="14" fill="#000000" id="scene2-A2-label" style="opacity: 0;">A₂</text>
            <circle cx="347" cy="340" r="4" fill="#000000" id="scene2-B2-point" style="opacity: 0;"/>
            <text x="332" y="325" font-size="14" fill="#000000" id="scene2-B2-label" style="opacity: 0;">B₂</text>
            <circle cx="417" cy="420" r="4" fill="#000000" id="scene2-C2-point" style="opacity: 0;"/>
            <text x="417" y="435" font-size="14" fill="#000000" id="scene2-C2-label" style="opacity: 0;">C₂</text>
            <circle cx="507" cy="340" r="4" fill="#000000" id="scene2-D2-point" style="opacity: 0;"/>
            <text x="522" y="325" font-size="14" fill="#000000" id="scene2-D2-label" style="opacity: 0;">D₂</text>
            
            <!-- 平行标记（B₂C₂边） -->
            <line x1="367" y1="370" x2="387" y2="405" stroke="#c62828" stroke-width="2.5" id="scene2-parallel2" style="opacity: 0;"/>
            
            <!-- 边长标注 B₂C₂ -->
            <text x="395" y="380" font-size="14" fill="#000000" id="scene2-bc2-label" style="opacity: 0;">B₂C₂</text>
            
            <!-- 第三个正方形 A₃B₃C₃D₃ -->
            <polygon points="577,260 507,340 567,420 637,340" fill="#1565c0" fill-opacity="0.05" stroke="#000000" stroke-width="1.5" id="scene2-square3" style="opacity: 0;"/>
            <!-- 第三个正方形顶点 -->
            <circle cx="577" cy="260" r="4" fill="#000000" id="scene2-A3-point" style="opacity: 0;"/>
            <text x="577" y="245" font-size="14" fill="#000000" id="scene2-A3-label" style="opacity: 0;">A₃</text>
            <circle cx="507" cy="340" r="4" fill="#000000" id="scene2-B3-point" style="opacity: 0;"/>
            <text x="492" y="325" font-size="14" fill="#000000" id="scene2-B3-label" style="opacity: 0;">B₃</text>
            <circle cx="567" cy="420" r="4" fill="#000000" id="scene2-C3-point" style="opacity: 0;"/>
            <text x="567" y="435" font-size="14" fill="#000000" id="scene2-C3-label" style="opacity: 0;">C₃</text>
            <circle cx="637" cy="340" r="4" fill="#000000" id="scene2-D3-point" style="opacity: 0;"/>
            <text x="637" y="325" font-size="14" fill="#000000" id="scene2-D3-label" style="opacity: 0;">D₃</text>
            
            <!-- 辅助线 D₂E₃ -->
            <line x1="507" y1="340" x2="507" y2="420" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" id="scene2-d2e3-line" style="opacity: 0;"/>
            <circle cx="507" cy="420" r="4" fill="#000000" id="scene2-E3-point" style="opacity: 0;"/>
            <text x="507" y="435" font-size="14" fill="#000000" id="scene2-E3-label" style="opacity: 0;">E₃</text>
            
            <!-- 平行标记（B₃C₃边） -->
            <line x1="527" y1="370" x2="547" y2="405" stroke="#c62828" stroke-width="2.5" id="scene2-parallel3" style="opacity: 0;"/>
            
            <!-- 边长标注 B₃C₃ -->
            <text x="555" y="380" font-size="14" fill="#000000" id="scene2-bc3-label" style="opacity: 0;">B₃C₃</text>
            
            <!-- 公式推导区（移到更右侧，避免与图形重叠） -->
            <g id="scene2-formula-group">
                <text x="620" y="150" font-size="14" fill="#000000" id="scene2-formula1" style="opacity: 0;">已知：a₁ = 1</text>
                <text x="620" y="180" font-size="14" fill="#000000" id="scene2-formula2" style="opacity: 0;">∠C₁B₁O = 30°</text>
                <text x="620" y="210" font-size="14" fill="#000000" id="scene2-formula3" style="opacity: 0;">OC₁ = B₁C₁·cos30°</text>
                <text x="620" y="240" font-size="14" fill="#000000" id="scene2-formula4" style="opacity: 0;">= 1·(√3/2) = √3/2</text>
                <text x="620" y="280" font-size="14" fill="#000000" id="scene2-formula5" style="opacity: 0;">△OB₁C₁ ∽ △D₁E₁B₂</text>
                <text x="620" y="310" font-size="14" fill="#000000" id="scene2-formula6" style="opacity: 0;">a₂/a₁ = D₁E₁/B₁C₁</text>
                <text x="620" y="340" font-size="14" fill="#000000" id="scene2-formula7" style="opacity: 0;">= (1/2)/1 = 1/2</text>
                <text x="620" y="390" font-size="16" fill="#2e7d32" font-weight="bold" id="scene2-formula-final" style="opacity: 0;">aₙ = (√3/3)ⁿ⁻¹</text>
            </g>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button class="scene2-btn" id="scene2-prev-btn" disabled>◀ 上一步</button>
            <span id="scene2-step-indicator">步骤 0/7</span>
            <button class="scene2-btn" id="scene2-next-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现
        // 布局坐标表对照：
        // | 元素 | 位置/范围 | 备注 |
        // | x 轴 | (80,420)-(750,420) | 水平轴 |
        // | y 轴 | (120,100)-(120,450) | 垂直轴 |
        // | 原点 O | (120,420) | 坐标原点 |
        // | 第一个正方形 | B₁(120,280)-C₁(200,420)-D₁(347,340)-A₁(267,200) | 边长 140px |
        // | 第二个正方形 | B₂(347,340)-C₂(417,420)-D₂(507,340)-A₂(437,260) | 边长 100px |
        // | 第三个正方形 | B₃(507,340)-C₃(567,420)-D₃(637,340)-A₃(577,260) | 边长 70px |
        
        const scene2 = {
            currentStep: 0,
            totalSteps: 7,
            
            // 元素 ID 映射
            elements: {
                // 步骤 1 相关
                triangle: 'scene2-triangle-obc',
                angleArc: 'scene2-angle-arc',
                angleLabel: 'scene2-angle-label',
                // 步骤 2 相关
                bc1Label: 'scene2-bc1-label',
                d1e1Line: 'scene2-d1e1-line',
                e1Point: 'scene2-E1-point',
                e1Label: 'scene2-E1-label',
                d1e1Label: 'scene2-d1e1-label',
                // 步骤 3 相关
                formula1: 'scene2-formula1',
                formula2: 'scene2-formula2',
                formula3: 'scene2-formula3',
                formula4: 'scene2-formula4',
                // 步骤 4 相关
                square2: 'scene2-square2',
                a2Point: 'scene2-A2-point',
                a2Label: 'scene2-A2-label',
                b2Point: 'scene2-B2-point',
                b2Label: 'scene2-B2-label',
                c2Point: 'scene2-C2-point',
                c2Label: 'scene2-C2-label',
                d2Point: 'scene2-D2-point',
                d2Label: 'scene2-D2-label',
                parallel1: 'scene2-parallel1',
                parallel2: 'scene2-parallel2',
                bc2Label: 'scene2-bc2-label',
                // 步骤 5 相关
                formula5: 'scene2-formula5',
                formula6: 'scene2-formula6',
                formula7: 'scene2-formula7',
                // 步骤 6 相关
                square3: 'scene2-square3',
                a3Point: 'scene2-A3-point',
                a3Label: 'scene2-A3-label',
                b3Point: 'scene2-B3-point',
                b3Label: 'scene2-B3-label',
                c3Point: 'scene2-C3-point',
                c3Label: 'scene2-C3-label',
                d3Point: 'scene2-D3-point',
                d3Label: 'scene2-D3-label',
                d2e3Line: 'scene2-d2e3-line',
                e3Point: 'scene2-E3-point',
                e3Label: 'scene2-E3-label',
                parallel3: 'scene2-parallel3',
                bc3Label: 'scene2-bc3-label',
                // 步骤 7 相关
                formulaFinal: 'scene2-formula-final'
            },
            
            // 显示元素
            show: function(id) {
                const el = document.getElementById(id);
                if (el) {
                    el.style.opacity = '1';
                    el.style.display = 'block';
                }
            },
            
            // 隐藏元素
            hide: function(id) {
                const el = document.getElementById(id);
                if (el) {
                    el.style.opacity = '0';
                    if (el.tagName === 'LINE' || el.tagName === 'line') {
                        el.style.display = 'none';
                    }
                }
            },
            
            // 更新步骤显示
            updateScene: function() {
                // 重置所有步骤相关元素
                for (let i = 1; i <= 7; i++) {
                    const prefix = 'scene2-step' + i + '-';
                    Object.keys(this.elements).forEach(key => {
                        if (key.startsWith('step' + i)) {
                            this.hide(this.elements[key]);
                        }
                    });
                }
                
                // 根据当前步骤显示对应元素
                if (this.currentStep >= 1) {
                    this.show(this.elements.triangle);
                    this.show(this.elements.angleArc);
                    this.show(this.elements.angleLabel);
                }
                if (this.currentStep >= 2) {
                    this.show(this.elements.bc1Label);
                    this.show(this.elements.d1e1Line);
                    this.show(this.elements.e1Point);
                    this.show(this.elements.e1Label);
                    this.show(this.elements.d1e1Label);
                }
                if (this.currentStep >= 3) {
                    this.show(this.elements.formula1);
                    this.show(this.elements.formula2);
                    this.show(this.elements.formula3);
                    this.show(this.elements.formula4);
                }
                if (this.currentStep >= 4) {
                    this.show(this.elements.square2);
                    this.show(this.elements.a2Point);
                    this.show(this.elements.a2Label);
                    this.show(this.elements.b2Point);
                    this.show(this.elements.b2Label);
                    this.show(this.elements.c2Point);
                    this.show(this.elements.c2Label);
                    this.show(this.elements.d2Point);
                    this.show(this.elements.d2Label);
                    this.show(this.elements.parallel1);
                    this.show(this.elements.parallel2);
                    this.show(this.elements.bc2Label);
                }
                if (this.currentStep >= 5) {
                    this.show(this.elements.formula5);
                    this.show(this.elements.formula6);
                    this.show(this.elements.formula7);
                }
                if (this.currentStep >= 6) {
                    this.show(this.elements.square3);
                    this.show(this.elements.a3Point);
                    this.show(this.elements.a3Label);
                    this.show(this.elements.b3Point);
                    this.show(this.elements.b3Label);
                    this.show(this.elements.c3Point);
                    this.show(this.elements.c3Label);
                    this.show(this.elements.d3Point);
                    this.show(this.elements.d3Label);
                    this.show(this.elements.d2e3Line);
                    this.show(this.elements.e3Point);
                    this.show(this.elements.e3Label);
                    this.show(this.elements.parallel3);
                    this.show(this.elements.bc3Label);
                }
                if (this.currentStep >= 7) {
                    this.show(this.elements.formulaFinal);
                }
                
                // 更新步骤指示器
                document.getElementById('scene2-step-indicator').textContent = '步骤 ' + this.currentStep + '/7';
                
                // 更新按钮状态
                document.getElementById('scene2-prev-btn').disabled = (this.currentStep === 0);
                document.getElementById('scene2-next-btn').disabled = (this.currentStep === 7);
            },
            
            // 下一步
            nextStep: function() {
                if (this.currentStep < this.totalSteps) {
                    this.currentStep++;
                    this.updateScene();
                }
            },
            
            // 上一步
            prevStep: function() {
                if (this.currentStep > 0) {
                    this.currentStep--;
                    this.updateScene();
                }
            },
            
            // 初始化
            init: function() {
                // 绑定按钮事件
                document.getElementById('scene2-next-btn').addEventListener('click', () => this.nextStep());
                document.getElementById('scene2-prev-btn').addEventListener('click', () => this.prevStep());
                
                // 初始状态：显示基础元素（坐标轴、标签、第一个正方形轮廓）
                this.updateScene();
            }
        };
        
        // 启动场景
        scene2.init();
    })();
    </script>
</body>
</html>
