<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>半圆旋转阴影面积 - Scene 1</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Microsoft YaHei', sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 20px; z-index: 10; padding: 0 20px; box-sizing: border-box; }
        .scene1-btn { padding: 8px 20px; font-size: 14px; background: #1976d2; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .scene1-btn:disabled { background: #bdbdbd; cursor: not-allowed; }
        .scene1-btn:hover:not(:disabled) { background: #1565c0; }
        #scene1-step-indicator { font-size: 14px; color: #424242; font-weight: bold; }
        svg { display: block; }
        .scene1-text { font-size: 14px; fill: #000000; }
        .scene1-text-large { font-size: 16px; fill: #2e7d32; font-weight: bold; }
        .scene1-point { fill: #000000; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- 坐标表注释：
                点 A: (200, 350)
                点 B: (600, 350)
                点 A': (317, 66)
                原半圆圆心: (400, 350), 半径 200
                旋转后半圆圆心: (458.5, 208), 半径 200
                扇形圆心 B(600, 350), 半径 400, 角度 135°→180°
            -->
            
            <!-- 步骤 0: 原半圆基础图形 -->
            <g id="scene1-group-step0">
                <!-- 点 A -->
                <circle id="scene1-point-A" class="scene1-point" cx="200" cy="350" r="4"/>
                <!-- 点 B -->
                <circle id="scene1-point-B" class="scene1-point" cx="600" cy="350" r="4"/>
                <!-- 线段 AB -->
                <line id="scene1-line-AB" x1="200" y1="350" x2="600" y2="350" stroke="#000000" stroke-width="2"/>
                <!-- 原半圆弧 (180°→0°, 上半圆) -->
                <path id="scene1-arc-original" d="M 200 350 A 200 200 0 0 1 600 350" stroke="#000000" stroke-width="2" fill="none"/>
                <!-- 标签 A -->
                <text id="scene1-label-A" class="scene1-text" x="180" y="370">A</text>
                <!-- 标签 B -->
                <text id="scene1-label-B" class="scene1-text" x="615" y="370">B</text>
                <!-- 标注 AB=4 -->
                <text id="scene1-text-AB4" class="scene1-text" x="370" y="380">AB=4</text>
            </g>
            
            <!-- 步骤 1: 旋转后半圆和阴影 -->
            <g id="scene1-group-step1" style="display: none;">
                <!-- 点 A' -->
                <circle id="scene1-point-A'" class="scene1-point" cx="317" cy="66" r="4"/>
                <!-- 线段 A'B -->
                <line id="scene1-line-A'B" x1="317" y1="66" x2="600" y2="350" stroke="#000000" stroke-width="2"/>
                <!-- 旋转后半圆弧 (135°→315°) -->
                <path id="scene1-arc-rotated" d="M 317 66 A 200 200 0 0 1 600 350" stroke="#000000" stroke-width="2" fill="none"/>
                <!-- 阴影区域 (旋转后半圆 - 原半圆) -->
                <path id="scene1-shadow" d="M 317 66 A 200 200 0 0 1 600 350 A 200 200 0 0 0 200 350 A 200 200 0 0 0 317 66" fill="#1565c0" opacity="0.2"/>
                <!-- 标签 A' - 调整位置到 A'点左上方，远离圆弧 -->
                <text id="scene1-label-A'" class="scene1-text" x="280" y="40">A'</text>
                <!-- 标注 阴影部分 - 移到阴影区域右侧外部 -->
                <text id="scene1-text-shadow" class="scene1-text" x="620" y="180">阴影部分</text>
            </g>
            
            <!-- 步骤 2: 辅助线和扇形 -->
            <g id="scene1-group-step2" style="display: none;">
                <!-- 线段 AA' (虚线) -->
                <line id="scene1-line-AA'" x1="200" y1="350" x2="317" y2="66" stroke="#888880" stroke-width="2" stroke-dasharray="5,5"/>
                <!-- 扇形 ABA' (圆心 B, 半径 400, 135°→180°) -->
                <path id="scene1-sector" d="M 600 350 L 317 66 A 400 400 0 0 0 200 350 Z" fill="#c62828" opacity="0.15"/>
                <!-- 标注 ∠ABA'=45° - 移到扇形外部右侧 -->
                <text id="scene1-text-angle" class="scene1-text" x="630" y="280">∠ABA'=45°</text>
            </g>
            
            <!-- 步骤 3: 结论文本 -->
            <g id="scene1-group-step3" style="display: none;">
                <text id="scene1-text-conclusion" class="scene1-text-large" x="150" y="450">阴影面积 = π</text>
                <text id="scene1-text-answer" class="scene1-text-large" x="350" y="475">答案：A. π</text>
            </g>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/4</span>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现 - 半圆旋转阴影面积
        
        const scene1 = {
            currentStep: 0,
            totalSteps: 4,
            
            // 元素引用
            elements: {
                groupStep0: document.getElementById('scene1-group-step0'),
                groupStep1: document.getElementById('scene1-group-step1'),
                groupStep2: document.getElementById('scene1-group-step2'),
                groupStep3: document.getElementById('scene1-group-step3'),
                btnPrev: document.getElementById('scene1-btn-prev'),
                btnNext: document.getElementById('scene1-btn-next'),
                stepIndicator: document.getElementById('scene1-step-indicator')
            },
            
            // 更新显示状态
            updateDisplay: function() {
                const g0 = this.elements.groupStep0;
                const g1 = this.elements.groupStep1;
                const g2 = this.elements.groupStep2;
                const g3 = this.elements.groupStep3;
                
                // 重置所有组
                g0.style.display = 'none';
                g1.style.display = 'none';
                g2.style.display = 'none';
                g3.style.display = 'none';
                
                // 根据步骤显示对应组
                if (this.currentStep >= 0) {
                    g0.style.display = 'block';
                }
                if (this.currentStep >= 1) {
                    g1.style.display = 'block';
                }
                if (this.currentStep >= 2) {
                    g2.style.display = 'block';
                }
                if (this.currentStep >= 3) {
                    g3.style.display = 'block';
                }
                
                // 更新按钮状态
                this.elements.btnPrev.disabled = (this.currentStep === 0);
                this.elements.btnNext.disabled = (this.currentStep === this.totalSteps - 1);
                
                // 更新步骤指示器
                this.elements.stepIndicator.textContent = '步骤 ' + (this.currentStep + 1) + '/' + this.totalSteps;
            },
            
            // 下一步
            nextStep: function() {
                if (this.currentStep < this.totalSteps - 1) {
                    this.currentStep++;
                    this.updateDisplay();
                }
            },
            
            // 上一步
            prevStep: function() {
                if (this.currentStep > 0) {
                    this.currentStep--;
                    this.updateDisplay();
                }
            },
            
            // 初始化
            init: function() {
                this.elements.btnPrev.addEventListener('click', () => this.prevStep());
                this.elements.btnNext.addEventListener('click', () => this.nextStep());
                this.updateDisplay();
            }
        };
        
        // 启动
        scene1.init();
    })();
    </script>
</body>
</html>
