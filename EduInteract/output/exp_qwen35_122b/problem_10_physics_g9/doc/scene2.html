<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 匀速直线运动受力分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Microsoft YaHei', sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 20px; z-index: 10; }
        .scene2-btn { padding: 8px 20px; font-size: 14px; background: #1976d2; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .scene2-btn:disabled { background: #bdbdbd; cursor: not-allowed; }
        .scene2-btn:hover:not(:disabled) { background: #1565c0; }
        #scene2-step-indicator { font-size: 14px; color: #424242; font-weight: bold; }
        svg { display: block; }
        .scene2-text { font-size: 14px; fill: #000000; }
        .scene2-arrow { stroke-width: 2; fill: none; }
        .scene2-liquid { fill: #c0c0c0; }
        .scene2-container-outline { stroke: #000000; stroke-width: 2; fill: none; }
        .scene2-force { opacity: 0; transition: opacity 0.3s; }
        .scene2-formula { opacity: 0; transition: opacity 0.3s; }
        .scene2-conclusion { opacity: 0; transition: opacity 0.3s; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500">
            <!-- 桌面 -->
            <line x1="50" y1="380" x2="750" y2="380" stroke="#000000" stroke-width="2"/>
            <!-- 桌面阴影（斜线填充） -->
            <defs>
                <pattern id="scene2-hatch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
                    <line x1="0" y1="0" x2="0" y2="10" stroke="#9e9e9e" stroke-width="1"/>
                </pattern>
            </defs>
            <rect x="50" y="380" width="700" height="40" fill="url(#scene2-hatch)"/>

            <!-- 左容器轮廓（正放，小底在下） -->
            <polygon class="scene2-container-outline" points="120,180 220,180 200,380 140,380"/>
            <!-- 左容器液体 -->
            <polygon class="scene2-liquid" points="125,260 215,260 200,380 140,380"/>

            <!-- 右容器轮廓（反放，大底在下） -->
            <polygon class="scene2-container-outline" points="580,180 680,180 700,380 560,380"/>
            <!-- 右容器液体 -->
            <polygon class="scene2-liquid" points="585,260 675,260 700,380 560,380"/>

            <!-- 速度箭头（步骤 0 显示） -->
            <!-- 左速度 v -->
            <g id="scene2-speed-left">
                <line x1="140" y1="140" x2="180" y2="140" stroke="#000000" stroke-width="2" marker-end="url(#scene2-arrowhead)"/>
                <text x="185" y="145" class="scene2-text">v</text>
            </g>
            <!-- 右速度 2v -->
            <g id="scene2-speed-right">
                <line x1="600" y1="140" x2="660" y2="140" stroke="#000000" stroke-width="2" marker-end="url(#scene2-arrowhead)"/>
                <text x="665" y="145" class="scene2-text">2v</text>
            </g>

            <!-- 箭头标记定义 -->
            <defs>
                <marker id="scene2-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
                </marker>
            </defs>

            <!-- 步骤 1：重力与支持力 -->
            <g id="scene2-step1-forces" class="scene2-force">
                <!-- 左重力 G₁（红色，向下） -->
                <line id="scene2-arrow-G1" x1="170" y1="220" x2="170" y2="280" stroke="#c62828" stroke-width="2" marker-end="url(#scene2-arrowhead-red)"/>
                <text id="scene2-label-G1" x="155" y="295" class="scene2-text" fill="#c62828">G₁</text>
                
                <!-- 右重力 G₂（红色，向下） -->
                <line id="scene2-arrow-G2" x1="630" y1="220" x2="630" y2="280" stroke="#c62828" stroke-width="2" marker-end="url(#scene2-arrowhead-red)"/>
                <text id="scene2-label-G2" x="615" y="295" class="scene2-text" fill="#c62828">G₂</text>
                
                <!-- 左支持力 N支₁（绿色，向上） -->
                <line id="scene2-arrow-N1" x1="170" y1="380" x2="170" y2="320" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene2-arrowhead-green)"/>
                <text id="scene2-label-N1" x="155" y="315" class="scene2-text" fill="#2e7d32">N支₁</text>
                
                <!-- 右支持力 N支₂（绿色，向上） -->
                <line id="scene2-arrow-N2" x1="630" y1="380" x2="630" y2="320" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene2-arrowhead-green)"/>
                <text id="scene2-label-N2" x="615" y="315" class="scene2-text" fill="#2e7d32">N支₂</text>
                
                <!-- G₁ = G₂ 标注 -->
                <text id="scene2-G-equal" x="380" y="260" class="scene2-text" fill="#c62828" text-anchor="middle" font-weight="bold">G₁ = G₂</text>
            </g>

            <!-- 步骤 2：拉力与摩擦力 -->
            <g id="scene2-step2-forces" class="scene2-force">
                <!-- 左拉力 F₁（蓝色，向右） -->
                <line id="scene2-arrow-F1" x1="220" y1="300" x2="280" y2="300" stroke="#1565c0" stroke-width="2" marker-end="url(#scene2-arrowhead-blue)"/>
                <text id="scene2-label-F1" x="285" y="295" class="scene2-text" fill="#1565c0">F₁</text>
                
                <!-- 右拉力 F₂（蓝色，向右） -->
                <line id="scene2-arrow-F2" x1="680" y1="300" x2="740" y2="300" stroke="#1565c0" stroke-width="2" marker-end="url(#scene2-arrowhead-blue)"/>
                <text id="scene2-label-F2" x="745" y="295" class="scene2-text" fill="#1565c0">F₂</text>
                
                <!-- 左摩擦力 f₁（灰色，向左） -->
                <line id="scene2-arrow-f1" x1="170" y1="300" x2="110" y2="300" stroke="#888888" stroke-width="2" marker-end="url(#scene2-arrowhead-gray)"/>
                <text id="scene2-label-f1" x="95" y="295" class="scene2-text" fill="#888888">f₁</text>
                
                <!-- 右摩擦力 f₂（灰色，向左） -->
                <line id="scene2-arrow-f2" x1="630" y1="300" x2="570" y2="300" stroke="#888888" stroke-width="2" marker-end="url(#scene2-arrowhead-gray)"/>
                <text id="scene2-label-f2" x="555" y="295" class="scene2-text" fill="#888888">f₂</text>
            </g>

            <!-- 步骤 3：摩擦力公式 -->
            <g id="scene2-step3-formula" class="scene2-formula">
                <text id="scene2-formula-text" x="320" y="450" class="scene2-text" text-anchor="middle" font-size="16">f = μN支</text>
                <text id="scene2-f-equal" x="380" y="340" class="scene2-text" text-anchor="middle" fill="#888888" font-weight="bold">f₁ = f₂</text>
            </g>

            <!-- 步骤 4：平衡条件与结论 -->
            <g id="scene2-step4-conclusion" class="scene2-conclusion">
                <text id="scene2-balance-text" x="340" y="425" class="scene2-text" text-anchor="middle" font-size="15">F = f (匀速)</text>
                <text id="scene2-conclusion-text" x="380" y="485" class="scene2-text" text-anchor="middle" font-size="18" font-weight="bold" fill="#1565c0">F₁ = F₂</text>
            </g>

            <!-- 彩色箭头标记定义 -->
            <defs>
                <marker id="scene2-arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#c62828"/>
                </marker>
                <marker id="scene2-arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32"/>
                </marker>
                <marker id="scene2-arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0"/>
                </marker>
                <marker id="scene2-arrowhead-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#888888"/>
                </marker>
            </defs>
        </svg>

        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-prev-btn" class="scene2-btn" disabled>◀ 上一步</button>
            <span id="scene2-step-indicator">步骤 1 / 5</span>
            <button id="scene2-next-btn" class="scene2-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2 实现
        // 布局坐标表对照：
        // | 元素 | 类型 | 位置/范围 | 备注 |
        // | 桌面 | 线段 | (50,380)-(750,380) | 水平贯穿画布 |
        // | 左容器轮廓 | 多边形 | (120,180)-(220,380) 梯形 | 正放，小底在下 |
        // | 右容器轮廓 | 多边形 | (580,180)-(680,380) 梯形 | 反放，大底在下 |
        // | 左速度标签 | text | (185,145) | "v" |
        // | 右速度标签 | text | (665,145) | "2v" |
        // | 左重力标签 | text | (155,295) | "G₁" |
        // | 右重力标签 | text | (615,295) | "G₂" |
        // | 左支持力标签 | text | (155,315) | "N支₁" |
        // | 右支持力标签 | text | (615,315) | "N支₂" |
        // | 左拉力标签 | text | (285,295) | "F₁" |
        // | 右拉力标签 | text | (745,295) | "F₂" |
        // | 左摩擦力标签 | text | (95,295) | "f₁" |
        // | 右摩擦力标签 | text | (555,295) | "f₂" |
        // | 公式文本 | text | (320,450) | "f = μN支" |
        // | 平衡条件文本 | text | (340,425) | "F = f (匀速)" |
        // | 结论文本 | text | (380,485) | "F₁ = F₂" |

        const TOTAL_STEPS = 5;
        let currentStep = 1;

        // 工具函数：显示元素
        function show(el) {
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '0';
                setTimeout(() => {
                    el.style.opacity = '1';
                }, 10);
            }
        }

        // 工具函数：隐藏元素
        function hide(el) {
            if (el) {
                el.style.opacity = '0';
                setTimeout(() => {
                    el.style.display = 'none';
                }, 300);
            }
        }

        // 更新场景显示
        function updateScene() {
            const prevBtn = document.getElementById('scene2-prev-btn');
            const nextBtn = document.getElementById('scene2-next-btn');
            const indicator = document.getElementById('scene2-step-indicator');

            // 更新步骤指示器
            indicator.textContent = `步骤 ${currentStep} / ${TOTAL_STEPS}`;

            // 更新按钮状态
            prevBtn.disabled = (currentStep === 1);
            nextBtn.disabled = (currentStep === TOTAL_STEPS);

            // 根据步骤控制元素显示
            const step1Forces = document.getElementById('scene2-step1-forces');
            const step2Forces = document.getElementById('scene2-step2-forces');
            const step3Formula = document.getElementById('scene2-step3-formula');
            const step4Conclusion = document.getElementById('scene2-step4-conclusion');

            // 步骤 1：初始状态 - 只显示容器和速度
            if (currentStep >= 2) {
                show(step1Forces);
            } else {
                hide(step1Forces);
            }

            if (currentStep >= 3) {
                show(step2Forces);
            } else {
                hide(step2Forces);
            }

            if (currentStep >= 4) {
                show(step3Formula);
            } else {
                hide(step3Formula);
            }

            if (currentStep >= 5) {
                show(step4Conclusion);
            } else {
                hide(step4Conclusion);
            }
        }

        // 事件绑定
        document.getElementById('scene2-prev-btn').addEventListener('click', function() {
            if (currentStep > 1) {
                currentStep--;
                updateScene();
            }
        });

        document.getElementById('scene2-next-btn').addEventListener('click', function() {
            if (currentStep < TOTAL_STEPS) {
                currentStep++;
                updateScene();
            }
        });

        // 初始化
        updateScene();
    })();
    </script>
</body>
</html>
