<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 1: 圆台形容器液体体积与密度关系</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Microsoft YaHei', sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene1-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #333; border-radius: 4px; background: #f5f5f5; }
        .scene1-btn:hover:not(:disabled) { background: #e0e0e0; }
        .scene1-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-step-indicator { position: absolute; bottom: 45px; left: 50%; transform: translateX(-50%); font-size: 14px; color: #666; }
        svg { display: block; }
        .scene1-liquid { fill: #1565c0; opacity: 0.2; transition: opacity 0.3s ease-in-out; }
        .scene1-liquid-highlight { opacity: 0.4; }
        .scene1-label { font-size: 14px; fill: #000000; }
        .scene1-conclusion { font-size: 16px; fill: #c62828; opacity: 0; }
        .scene1-arrow { stroke: #c62828; stroke-width: 2; fill: none; opacity: 0; }
        .scene1-checkmark { fill: #2e7d32; opacity: 0; }
        .scene1-formula { font-size: 18px; fill: #000000; opacity: 0; }
        .scene1-highlight-box { fill: none; stroke: #ff9800; stroke-width: 2; stroke-dasharray: 5,5; opacity: 0; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 标题 -->
            <text x="400" y="50" text-anchor="middle" class="scene1-label" style="font-size: 18px; font-weight: bold;">圆台形容器液体体积与密度关系</text>
            
            <!-- 桌面 -->
            <line x1="50" y1="390" x2="750" y2="390" stroke="#000000" stroke-width="2"/>
            <!-- 桌面阴影 -->
            <g id="scene1-desk-shadow">
                <line x1="50" y1="395" x2="70" y2="420" stroke="#888888" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="70" y1="395" x2="90" y2="420" stroke="#888888" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="90" y1="395" x2="110" y2="420" stroke="#888888" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="110" y1="395" x2="130" y2="420" stroke="#888888" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="130" y1="395" x2="150" y2="420" stroke="#888888" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="150" y1="395" x2="170" y2="420" stroke="#888888" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="170" y1="395" x2="190" y2="420" stroke="#888888" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="190" y1="395" x2="210" y2="420" stroke="#888888" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="210" y1="395" x2="230" y2="420" stroke="#888888" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="230" y1="395" x2="250" y2="420" stroke="#888888" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="250" y1="395" x2="270" y2="420" stroke="#888888" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="270" y1="395" x2="290" y2="420" stroke="#888888" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="290" y1="395" x2="310" y2="420" stroke="#888888" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="310" y1="395" x2="330" y2="420" stroke="#888888" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="330" y1="395" x2="350" y2="420" stroke="#888888" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="350" y1="395" x2="370" y2="420" stroke="#888888" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="370" y1="395" x2="390" y2="420" stroke="#888888" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="390" y1="395" x2="410" y2="420" stroke="#888888" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="410" y1="395" x2="430" y2="420" stroke="#888888" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="430" y1="395" x2="450" y2="420" stroke="#888888" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="450" y1="395" x2="470" y2="420" stroke="#888888" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="470" y1="395" x2="490" y2="420" stroke="#888888" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="490" y1="395" x2="510" y2="420" stroke="#888888" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="510" y1="395" x2="530" y2="420" stroke="#888888" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="530" y1="395" x2="550" y2="420" stroke="#888888" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="550" y1="395" x2="570" y2="420" stroke="#888888" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="570" y1="395" x2="590" y2="420" stroke="#888888" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="590" y1="395" x2="610" y2="420" stroke="#888888" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="610" y1="395" x2="630" y2="420" stroke="#888888" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="630" y1="395" x2="650" y2="420" stroke="#888888" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="650" y1="395" x2="670" y2="420" stroke="#888888" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="670" y1="395" x2="690" y2="420" stroke="#888888" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="690" y1="395" x2="710" y2="420" stroke="#888888" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="710" y1="395" x2="730" y2="420" stroke="#888888" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="730" y1="395" x2="750" y2="420" stroke="#888888" stroke-width="1" stroke-dasharray="3,3"/>
            </g>
            
            <!-- 容器 1（正放，上宽下窄） -->
            <line x1="170" y1="380" x2="130" y2="130" stroke="#000000" stroke-width="2"/>
            <line x1="230" y1="380" x2="270" y2="130" stroke="#000000" stroke-width="2"/>
            <line x1="130" y1="130" x2="270" y2="130" stroke="#000000" stroke-width="2"/>
            <line x1="170" y1="380" x2="230" y2="380" stroke="#000000" stroke-width="2"/>
            
            <!-- 容器 2（倒放，上窄下宽） -->
            <line x1="530" y1="380" x2="490" y2="130" stroke="#000000" stroke-width="2"/>
            <line x1="590" y1="380" x2="630" y2="130" stroke="#000000" stroke-width="2"/>
            <line x1="490" y1="130" x2="530" y2="130" stroke="#000000" stroke-width="2"/>
            <line x1="590" y1="380" x2="630" y2="380" stroke="#000000" stroke-width="2"/>
            
            <!-- 液面线 -->
            <line x1="150" y1="250" x2="250" y2="250" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
            <line x1="510" y1="250" x2="610" y2="250" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
            
            <!-- 液体填充 -->
            <polygon id="scene1-liquid1" class="scene1-liquid" points="170,380 230,380 245,250 155,250"/>
            <polygon id="scene1-liquid2" class="scene1-liquid" points="530,380 590,380 605,250 515,250"/>
            
            <!-- 液体高亮框（步骤 1） -->
            <rect id="scene1-highlight-box1" class="scene1-highlight-box" x="150" y="245" width="100" height="10"/>
            <rect id="scene1-highlight-box2" class="scene1-highlight-box" x="510" y="245" width="100" height="10"/>
            
            <!-- 深度标注线 -->
            <line x1="400" y1="130" x2="400" y2="380" stroke="#888888" stroke-width="1"/>
            <line x1="395" y1="130" x2="405" y2="130" stroke="#888888" stroke-width="1"/>
            <line x1="395" y1="380" x2="405" y2="380" stroke="#888888" stroke-width="1"/>
            <polygon id="scene1-depth-arrow1" points="400,135 397,125 403,125" fill="#888888" opacity="0"/>
            <polygon id="scene1-depth-arrow2" points="400,375 397,385 403,385" fill="#888888" opacity="0"/>
            
            <!-- 标签 -->
            <text x="190" y="100" text-anchor="middle" class="scene1-label">容器 1</text>
            <text x="190" y="118" text-anchor="middle" class="scene1-label" style="font-size: 12px;">正放</text>
            <text x="570" y="100" text-anchor="middle" class="scene1-label">容器 2</text>
            <text x="570" y="118" text-anchor="middle" class="scene1-label" style="font-size: 12px;">倒放</text>
            <text x="415" y="250" text-anchor="start" class="scene1-label" style="font-size: 12px;">h（深度相同）</text>
            <text x="400" y="430" text-anchor="middle" class="scene1-label">m₁ = m₂</text>
            
            <!-- 体积标注箭头（步骤 2） -->
            <line id="scene1-volume-arrow1" class="scene1-arrow" x1="260" y1="250" x2="260" y2="210"/>
            <polygon id="scene1-volume-arrowhead1" class="scene1-arrow" points="260,210 255,220 265,220"/>
            <line id="scene1-volume-arrow2" class="scene1-arrow" x1="600" y1="250" x2="600" y2="290"/>
            <polygon id="scene1-volume-arrowhead2" class="scene1-arrow" points="600,290 595,280 605,280"/>
            
            <!-- 体积结论标签（步骤 2） -->
            <text id="scene1-volume-conclusion" class="scene1-conclusion" x="190" y="450" text-anchor="middle">V₁ ＞ V₂</text>
            
            <!-- 密度结论标签（步骤 3） -->
            <text id="scene1-density-conclusion" class="scene1-conclusion" x="570" y="450" text-anchor="middle">ρ₁ ＜ ρ₂</text>
            
            <!-- 密度公式（步骤 3） -->
            <text id="scene1-formula" class="scene1-formula" x="400" y="90" text-anchor="middle">ρ = m / V</text>
            
            <!-- 对勾标记（步骤 4） -->
            <polygon id="scene1-check1" class="scene1-checkmark" points="180,445 188,453 200,440"/>
            <polygon id="scene1-check2" class="scene1-checkmark" points="560,445 568,453 580,440"/>
        </svg>
        
        <!-- 步骤指示 -->
        <div id="scene1-step-indicator">步骤 1 / 4</div>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-prev-btn" class="scene1-btn">◀ 上一步</button>
            <button id="scene1-next-btn" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现
        // 布局坐标表对照：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // |------|------|-----------|------|-------------|------|
        // | 标题 | text | (400,50) | ~200×20 | - | 图示标题 |
        // | 桌面 | 线段 | (50,390)-(750,390) | 700×2 | - | 水平桌面 |
        // | 容器 1 左壁 | 线段 | (170,380)-(130,130) | - | - | 左侧外斜壁 |
        // | 容器 1 右壁 | 线段 | (230,380)-(270,130) | - | - | 右侧外斜壁 |
        // | 容器 1 顶边 | 线段 | (130,130)-(270,130) | 140×2 | - | 顶部开口 |
        // | 容器 1 底边 | 线段 | (170,380)-(230,380) | 60×2 | - | 底部接触面 |
        // | 容器 2 左壁 | 线段 | (530,380)-(490,130) | - | - | 左侧外斜壁 |
        // | 容器 2 右壁 | 线段 | (590,380)-(630,130) | - | - | 右侧外斜壁 |
        // | 容器 2 顶边 | 线段 | (490,130)-(530,130) | 40×2 | - | 顶部开口 |
        // | 容器 2 底边 | 线段 | (590,380)-(630,380) | 40×2 | - | 底部接触面 |
        // | 液面线 1 | 虚线 | (150,250)-(250,250) | 100×1 | - | 容器 1 液面 |
        // | 液面线 2 | 虚线 | (510,250)-(610,250) | 100×1 | - | 容器 2 液面 |
        // | 液体填充 1 | 多边形 | (170,380)-(230,380)-(245,250)-(155,250) | - | - | 容器 1 液体区域 |
        // | 液体填充 2 | 多边形 | (530,380)-(590,380)-(605,250)-(515,250) | - | - | 容器 2 液体区域 |
        // | 容器 1 标签 | text | (190,100) | ~60×16 | 上方 | "容器 1" |
        // | 容器 2 标签 | text | (570,100) | ~60×16 | 上方 | "容器 2" |
        // | 正放标签 | text | (190,118) | ~40×14 | 上方 | "正放" |
        // | 倒放标签 | text | (570,118) | ~40×14 | 上方 | "倒放" |
        // | 深度标签 | text | (415,250) | ~80×16 | 上方 | "h（深度相同）" |
        // | 质量标签 | text | (400,430) | ~100×16 | 下方 | "m₁=m₂" |
        // | 体积标注 1 | text | (190,450) | ~80×16 | 下方 | 步骤 3 显示"V₁＞V₂" |
        // | 密度结论 | text | (570,450) | ~80×16 | 下方 | 步骤 4 显示"ρ₁＜ρ₂" |
        
        const scene1 = {
            currentStep: 0,
            totalSteps: 4,
            
            elements: {
                prevBtn: document.getElementById('scene1-prev-btn'),
                nextBtn: document.getElementById('scene1-next-btn'),
                stepIndicator: document.getElementById('scene1-step-indicator'),
                liquid1: document.getElementById('scene1-liquid1'),
                liquid2: document.getElementById('scene1-liquid2'),
                highlightBox1: document.getElementById('scene1-highlight-box1'),
                highlightBox2: document.getElementById('scene1-highlight-box2'),
                volumeArrow1: document.getElementById('scene1-volume-arrow1'),
                volumeArrowHead1: document.getElementById('scene1-volume-arrowhead1'),
                volumeArrow2: document.getElementById('scene1-volume-arrow2'),
                volumeArrowHead2: document.getElementById('scene1-volume-arrowhead2'),
                volumeConclusion: document.getElementById('scene1-volume-conclusion'),
                densityConclusion: document.getElementById('scene1-density-conclusion'),
                formula: document.getElementById('scene1-formula'),
                check1: document.getElementById('scene1-check1'),
                check2: document.getElementById('scene1-check2')
            },
            
            init: function() {
                this.elements.prevBtn.addEventListener('click', () => this.prevStep());
                this.elements.nextBtn.addEventListener('click', () => this.nextStep());
                this.updateStep();
            },
            
            prevStep: function() {
                if (this.currentStep > 0) {
                    this.currentStep--;
                    this.updateStep();
                }
            },
            
            nextStep: function() {
                if (this.currentStep < this.totalSteps - 1) {
                    this.currentStep++;
                    this.updateStep();
                }
            },
            
            updateStep: function() {
                const { prevBtn, nextBtn, stepIndicator } = this.elements;
                
                // 更新按钮状态
                prevBtn.disabled = (this.currentStep === 0);
                nextBtn.disabled = (this.currentStep === this.totalSteps - 1);
                
                // 更新步骤指示
                stepIndicator.textContent = `步骤 ${this.currentStep + 1} / ${this.totalSteps}`;
                
                // 根据步骤更新元素显示
                this.updateStepElements();
            },
            
            updateStepElements: function() {
                const { liquid1, liquid2, highlightBox1, highlightBox2,
                        volumeArrow1, volumeArrowHead1, volumeArrow2, volumeArrowHead2,
                        volumeConclusion, densityConclusion, formula, check1, check2 } = this.elements;
                
                // 重置所有元素
                liquid1.style.opacity = '0.2';
                liquid2.style.opacity = '0.2';
                highlightBox1.style.opacity = '0';
                highlightBox2.style.opacity = '0';
                volumeArrow1.style.opacity = '0';
                volumeArrowHead1.style.opacity = '0';
                volumeArrow2.style.opacity = '0';
                volumeArrowHead2.style.opacity = '0';
                volumeConclusion.style.opacity = '0';
                densityConclusion.style.opacity = '0';
                formula.style.opacity = '0';
                check1.style.opacity = '0';
                check2.style.opacity = '0';
                
                // 根据步骤设置元素显示
                switch(this.currentStep) {
                    case 0:
                        // 初始状态：只显示基础条件
                        break;
                        
                    case 1:
                        // 高亮液体区域
                        liquid1.style.opacity = '0.4';
                        liquid2.style.opacity = '0.4';
                        highlightBox1.style.opacity = '1';
                        highlightBox2.style.opacity = '1';
                        break;
                        
                    case 2:
                        // 显示体积关系
                        liquid1.style.opacity = '0.4';
                        liquid2.style.opacity = '0.4';
                        volumeArrow1.style.opacity = '1';
                        volumeArrowHead1.style.opacity = '1';
                        volumeConclusion.style.opacity = '1';
                        break;
                        
                    case 3:
                        // 显示密度结论
                        liquid1.style.opacity = '0.4';
                        liquid2.style.opacity = '0.4';
                        volumeArrow1.style.opacity = '1';
                        volumeArrowHead1.style.opacity = '1';
                        volumeArrow2.style.opacity = '1';
                        volumeArrowHead2.style.opacity = '1';
                        volumeConclusion.style.opacity = '1';
                        densityConclusion.style.opacity = '1';
                        formula.style.opacity = '1';
                        break;
                        
                    case 4:
                        // 最终状态：所有结论高亮
                        liquid1.style.opacity = '0.4';
                        liquid2.style.opacity = '0.4';
                        volumeArrow1.style.opacity = '1';
                        volumeArrowHead1.style.opacity = '1';
                        volumeArrow2.style.opacity = '1';
                        volumeArrowHead2.style.opacity = '1';
                        volumeConclusion.style.opacity = '1';
                        densityConclusion.style.opacity = '1';
                        formula.style.opacity = '1';
                        check1.style.opacity = '1';
                        check2.style.opacity = '1';
                        break;
                }
            }
        };
        
        scene1.init();
    })();
    </script>
</body>
</html>
