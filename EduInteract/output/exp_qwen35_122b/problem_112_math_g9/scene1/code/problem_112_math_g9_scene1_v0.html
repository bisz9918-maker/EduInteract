<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三角形旋转与角度关系 - Scene 1</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Microsoft YaHei', sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene1-btn-prev, #scene1-btn-next {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border: 2px solid #1565c0;
            border-radius: 4px;
            background: #ffffff;
            color: #1565c0;
            font-weight: bold;
        }
        #scene1-btn-prev:hover, #scene1-btn-next:hover { background: #e3f2fd; }
        #scene1-btn-prev:disabled, #scene1-btn-next:disabled {
            border-color: #ccc;
            color: #ccc;
            cursor: not-allowed;
            background: #f5f5f5;
        }
        .scene1-calc-text {
            font-size: 13px;
            fill: #333;
            font-style: italic;
        }
        .scene1-conclusion {
            font-size: 16px;
            fill: #c62828;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义 -->
            <defs>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0"/>
                </marker>
            </defs>

            <!-- △OAB 填充 (步骤 0 显示) -->
            <polygon id="scene1-tri-oab-fill" points="150,350 400,320 550,350" fill="#1565c0" fill-opacity="0.15" style="display: block;"/>

            <!-- △OCD 填充 (步骤 1 显示) -->
            <polygon id="scene1-tri-ocd-fill" points="150,350 200,180 280,150" fill="#1565c0" fill-opacity="0.15" style="display: none;"/>

            <!-- △OAB 边 (步骤 0 显示) -->
            <line id="scene1-line-oa" x1="150" y1="350" x2="400" y2="320" stroke="#000000" stroke-width="2" style="display: block;"/>
            <line id="scene1-line-ob" x1="150" y1="350" x2="550" y2="350" stroke="#000000" stroke-width="2" style="display: block;"/>
            <line id="scene1-line-ab" x1="400" y1="320" x2="550" y2="350" stroke="#000000" stroke-width="2" style="display: block;"/>

            <!-- △OCD 边 (步骤 1 显示) -->
            <line id="scene1-line-oc" x1="150" y1="350" x2="200" y2="180" stroke="#000000" stroke-width="2" style="display: none;"/>
            <line id="scene1-line-od" x1="150" y1="350" x2="280" y2="150" stroke="#000000" stroke-width="2" style="display: none;"/>
            <line id="scene1-line-cd" x1="200" y1="180" x2="280" y2="150" stroke="#000000" stroke-width="2" style="display: none;"/>

            <!-- 辅助线 AC (步骤 2 显示) -->
            <line id="scene1-line-ac" x1="400" y1="320" x2="200" y2="180" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" style="display: none;"/>

            <!-- 辅助线 BD (步骤 2 显示) -->
            <line id="scene1-line-bd" x1="550" y1="350" x2="280" y2="150" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" style="display: none;"/>

            <!-- 旋转角弧线 (步骤 1 显示) - 从 OA 到 OC 逆时针 70° -->
            <path id="scene1-arc-rotation" d="M 228.5 270 A 80 80 0 0 1 195.2 202.3" stroke="#1565c0" stroke-width="2" fill="none" style="display: none;"/>

            <!-- ∠A 弧线 (步骤 0 显示) -->
            <path id="scene1-arc-a" d="M 380 325 A 25 25 0 0 1 405 340" stroke="#000000" stroke-width="1.5" fill="none" style="display: block;"/>

            <!-- ∠B 弧线 (步骤 2 显示) -->
            <path id="scene1-arc-b" d="M 530 350 A 25 25 0 0 1 545 335" stroke="#000000" stroke-width="1.5" fill="none" style="display: none;"/>

            <!-- ∠C 弧线 (步骤 2 显示) -->
            <path id="scene1-arc-c" d="M 215 195 A 25 25 0 0 1 205 215" stroke="#000000" stroke-width="1.5" fill="none" style="display: none;"/>

            <!-- ∠D 弧线 (步骤 1 显示) -->
            <path id="scene1-arc-d" d="M 265 160 A 25 25 0 0 1 275 175" stroke="#000000" stroke-width="1.5" fill="none" style="display: none;"/>

            <!-- ∠AOB 弧线 (步骤 3 显示) - 绿色 -->
            <path id="scene1-arc-aob" d="M 188 347 A 40 40 0 0 1 192 312" stroke="#2e7d32" stroke-width="2" fill="none" style="display: none;"/>

            <!-- ∠COD 弧线 (步骤 3 显示) - 绿色 -->
            <path id="scene1-arc-cod" d="M 182 315 A 40 40 0 0 1 175 275" stroke="#2e7d32" stroke-width="2" fill="none" style="display: none;"/>

            <!-- ∠AOD 弧线 (步骤 4 显示) - 红色 -->
            <path id="scene1-arc-aod" d="M 208 335 A 60 60 0 0 1 195 295" stroke="#c62828" stroke-width="2" fill="none" style="display: none;"/>

            <!-- 点 O -->
            <circle id="scene1-pt-o" cx="150" cy="350" r="6" fill="#000000"/>
            <!-- 点 A -->
            <circle id="scene1-pt-a" cx="400" cy="320" r="6" fill="#000000"/>
            <!-- 点 B -->
            <circle id="scene1-pt-b" cx="550" cy="350" r="6" fill="#000000"/>
            <!-- 点 C -->
            <circle id="scene1-pt-c" cx="200" cy="180" r="6" fill="#000000" style="display: none;"/>
            <!-- 点 D -->
            <circle id="scene1-pt-d" cx="280" cy="150" r="6" fill="#000000" style="display: none;"/>

            <!-- 标签 O -->
            <text id="scene1-label-o" x="135" y="370" font-size="14" fill="#000000">O</text>
            <!-- 标签 A -->
            <text id="scene1-label-a" x="410" y="310" font-size="14" fill="#000000">A</text>
            <!-- 标签 B -->
            <text id="scene1-label-b" x="560" y="360" font-size="14" fill="#000000">B</text>
            <!-- 标签 C - 移到左侧避免重叠 -->
            <text id="scene1-label-c" x="175" y="170" font-size="14" fill="#000000" style="display: none;">C</text>
            <!-- 标签 D - 移到上方避免重叠 -->
            <text id="scene1-label-d" x="290" y="130" font-size="14" fill="#000000" style="display: none;">D</text>

            <!-- 标签 ∠A=100° (步骤 0 显示) - 移到三角形外部右侧 -->
            <text id="scene1-label-angle-a" x="450" y="300" font-size="14" fill="#000000">∠A=100°</text>

            <!-- 标签 ∠D=50° (步骤 1 显示) - 移到三角形外部右侧 -->
            <text id="scene1-label-angle-d" x="310" y="130" font-size="14" fill="#000000" style="display: none;">∠D=50°</text>

            <!-- 标签 70° (步骤 1 显示) - 蓝色，移到弧线外侧上方 -->
            <text id="scene1-label-70deg" x="200" y="210" font-size="14" fill="#1565c0" font-weight="bold" style="display: none;">70°</text>

            <!-- 标签 ∠AOB=30° (步骤 3 显示) - 绿色，移到弧线外侧 -->
            <text id="scene1-label-aob30" x="230" y="330" font-size="14" fill="#2e7d32" font-weight="bold" style="display: none;">∠AOB=30°</text>

            <!-- 标签 ∠COD=30° (步骤 3 显示) - 绿色，移到弧线外侧 -->
            <text id="scene1-label-cod30" x="150" y="260" font-size="14" fill="#2e7d32" font-weight="bold" style="display: none;">∠COD=30°</text>

            <!-- 标签 ∠AOD=40° (步骤 4 显示) - 红色，移到弧线外侧 -->
            <text id="scene1-label-aod40" x="210" y="250" font-size="14" fill="#c62828" font-weight="bold" style="display: none;">∠AOD=40°</text>

            <!-- 计算过程文本 (步骤 3 显示) -->
            <text id="scene1-text-calc1" class="scene1-calc-text" x="200" y="420" style="display: none;">
                <tspan x="200" dy="0">计算：∠AOB = 180° - ∠A - ∠B = 180° - 100° - 50° = 30°</tspan>
            </text>

            <!-- 计算过程文本 (步骤 4 显示) -->
            <text id="scene1-text-calc2" class="scene1-calc-text" x="200" y="445" style="display: none;">
                <tspan x="200" dy="0">计算：∠AOD = ∠AOC - ∠COD = 70° - 30° = 40°</tspan>
            </text>

            <!-- 结论文本 (步骤 4 显示) -->
            <text id="scene1-text-conclusion" class="scene1-conclusion" x="280" y="470" style="display: none;">
                <tspan x="280" dy="0">答案：C. 40°</tspan>
            </text>

            <!-- 高亮框 (步骤 2 显示) - 移到外部 -->
            <rect id="scene1-highlight-ac" x="350" y="250" width="90" height="55" fill="none" stroke="#1565c0" stroke-width="2" stroke-dasharray="5,3" style="display: none;"/>
            <text id="scene1-highlight-ac-text" x="355" y="280" font-size="12" fill="#1565c0" style="display: none;">∠A=∠C=100°</text>

            <rect id="scene1-highlight-bd" x="480" y="280" width="90" height="55" fill="none" stroke="#1565c0" stroke-width="2" stroke-dasharray="5,3" style="display: none;"/>
            <text id="scene1-highlight-bd-text" x="485" y="310" font-size="12" fill="#1565c0" style="display: none;">∠B=∠D=50°</text>
        </svg>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1: 三角形旋转与角度关系
        // 坐标表对照：
        // 点 O: (150,350) | 点 A: (400,320) | 点 B: (550,350)
        // 点 C: (200,180) | 点 D: (280,150)
        // 标签 O: (135,370) | 标签 A: (410,310) | 标签 B: (560,360)
        // 标签 C: (175,170) | 标签 D: (290,130)

        const TOTAL_STEPS = 5;
        let currentStep = 0;

        // 元素 ID 映射
        const elements = {
            // 三角形填充
            triOabFill: 'scene1-tri-oab-fill',
            triOcdFill: 'scene1-tri-ocd-fill',
            // 三角形边
            lineOA: 'scene1-line-oa',
            lineOB: 'scene1-line-ob',
            lineAB: 'scene1-line-ab',
            lineOC: 'scene1-line-oc',
            lineOD: 'scene1-line-od',
            lineCD: 'scene1-line-cd',
            // 辅助线
            lineAC: 'scene1-line-ac',
            lineBD: 'scene1-line-bd',
            // 弧线
            arcRotation: 'scene1-arc-rotation',
            arcA: 'scene1-arc-a',
            arcB: 'scene1-arc-b',
            arcC: 'scene1-arc-c',
            arcD: 'scene1-arc-d',
            arcAOB: 'scene1-arc-aob',
            arcCOD: 'scene1-arc-cod',
            arcAOD: 'scene1-arc-aod',
            // 顶点
            ptO: 'scene1-pt-o',
            ptA: 'scene1-pt-a',
            ptB: 'scene1-pt-b',
            ptC: 'scene1-pt-c',
            ptD: 'scene1-pt-d',
            // 标签
            labelO: 'scene1-label-o',
            labelA: 'scene1-label-a',
            labelB: 'scene1-label-b',
            labelC: 'scene1-label-c',
            labelD: 'scene1-label-d',
            labelAngleA: 'scene1-label-angle-a',
            labelAngleD: 'scene1-label-angle-d',
            label70deg: 'scene1-label-70deg',
            labelAOB30: 'scene1-label-aob30',
            labelCOD30: 'scene1-label-cod30',
            labelAOD40: 'scene1-label-aod40',
            // 文本
            textCalc1: 'scene1-text-calc1',
            textCalc2: 'scene1-text-calc2',
            textConclusion: 'scene1-text-conclusion',
            // 高亮
            highlightAC: 'scene1-highlight-ac',
            highlightACText: 'scene1-highlight-ac-text',
            highlightBD: 'scene1-highlight-bd',
            highlightBDText: 'scene1-highlight-bd-text',
            // 按钮
            btnPrev: 'scene1-btn-prev',
            btnNext: 'scene1-btn-next'
        };

        // 工具函数：显示元素
        function show(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }

        // 工具函数：隐藏元素
        function hide(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }

        // 更新场景显示
        function updateScene() {
            // 步骤 0: 初始状态 - 显示△OAB 及∠A=100°
            if (currentStep >= 0) {
                show(elements.triOabFill);
                show(elements.lineOA);
                show(elements.lineOB);
                show(elements.lineAB);
                show(elements.ptO);
                show(elements.ptA);
                show(elements.ptB);
                show(elements.labelO);
                show(elements.labelA);
                show(elements.labelB);
                show(elements.arcA);
                show(elements.labelAngleA);
            }

            // 步骤 1: 显示旋转后三角形△OCD 及旋转角 70°
            if (currentStep >= 1) {
                show(elements.triOcdFill);
                show(elements.lineOC);
                show(elements.lineOD);
                show(elements.lineCD);
                show(elements.ptC);
                show(elements.ptD);
                show(elements.labelC);
                show(elements.labelD);
                show(elements.arcRotation);
                show(elements.label70deg);
                show(elements.labelAngleD);
                show(elements.arcD);
            }

            // 步骤 2: 高亮对应角关系
            if (currentStep >= 2) {
                show(elements.arcB);
                show(elements.arcC);
                show(elements.lineAC);
                show(elements.lineBD);
                show(elements.highlightAC);
                show(elements.highlightACText);
                show(elements.highlightBD);
                show(elements.highlightBDText);
            }

            // 步骤 3: 计算∠AOB 和∠COD
            if (currentStep >= 3) {
                show(elements.arcAOB);
                show(elements.arcCOD);
                show(elements.labelAOB30);
                show(elements.labelCOD30);
                show(elements.textCalc1);
            }

            // 步骤 4: 计算∠AOD，得出结论
            if (currentStep >= 4) {
                show(elements.arcAOD);
                show(elements.labelAOD40);
                show(elements.textCalc2);
                show(elements.textConclusion);
            }

            // 更新按钮状态
            const btnPrev = document.getElementById(elements.btnPrev);
            const btnNext = document.getElementById(elements.btnNext);
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === TOTAL_STEPS - 1);
        }

        // 下一步
        function nextStep() {
            if (currentStep < TOTAL_STEPS - 1) {
                currentStep++;
                updateScene();
            }
        }

        // 上一步
        function prevStep() {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        }

        // 初始化
        function init() {
            document.getElementById(elements.btnPrev).addEventListener('click', prevStep);
            document.getElementById(elements.btnNext).addEventListener('click', nextStep);
            updateScene();
        }

        // 启动
        init();
    })();
    </script>
</body>
</html>
