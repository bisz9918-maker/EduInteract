<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 对跖点概念</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene2-btn { padding: 8px 16px; font-size: 14px; background: #1976d2; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .scene2-btn:disabled { background: #9e9e9e; cursor: not-allowed; }
        .scene2-btn:hover:not(:disabled) { background: #1565c0; }
        .scene2-pulse { animation: scene2-pulse 1.5s infinite; }
        @keyframes scene2-pulse {
            0%, 100% { stroke-width: 2px; stroke: #ff9800; }
            50% { stroke-width: 4px; stroke: #ff5722; }
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" id="scene2-svg">
            <!-- 地球球体 -->
            <ellipse id="scene2-earth" cx="350" cy="230" rx="150" ry="150" fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 赤道 -->
            <ellipse id="scene2-equator" cx="350" cy="230" rx="150" ry="10" fill="none" stroke="#000000" stroke-width="1.5"/>
            
            <!-- 本初子午线 (0°) -->
            <ellipse id="scene2-prime-meridian" cx="350" cy="230" rx="10" ry="150" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
            
            <!-- 经线 120°E -->
            <ellipse id="scene2-meridian-120e" cx="420" cy="230" rx="10" ry="100" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
            
            <!-- 经线 60°W -->
            <ellipse id="scene2-meridian-60w" cx="280" cy="230" rx="10" ry="100" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
            
            <!-- 纬线 30°N -->
            <ellipse id="scene2-latitude-30n" cx="350" cy="180" rx="120" ry="10" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
            
            <!-- 纬线 30°S -->
            <ellipse id="scene2-latitude-30s" cx="350" cy="280" rx="120" ry="10" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
            
            <!-- A-B 连线 (虚线，穿过地心) -->
            <line id="scene2-line-ab" x1="420" y1="180" x2="280" y2="280" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5" opacity="0"/>
            
            <!-- 地心点 -->
            <circle id="scene2-center" cx="350" cy="230" r="6" fill="#000000" opacity="0"/>
            
            <!-- A 点 (咸蛋超人) -->
            <circle id="scene2-point-a" cx="420" cy="180" r="5" fill="#c62828" stroke="#c62828" stroke-width="2" opacity="0"/>
            <circle id="scene2-point-a-ring" cx="420" cy="180" r="8" fill="none" stroke="#c62828" stroke-width="1" opacity="0"/>
            
            <!-- B 点 (面包超人) -->
            <circle id="scene2-point-b" cx="280" cy="280" r="5" fill="#1565c0" stroke="#1565c0" stroke-width="2" opacity="0"/>
            <circle id="scene2-point-b-ring" cx="280" cy="280" r="8" fill="none" stroke="#1565c0" stroke-width="1" opacity="0"/>
            
            <!-- 标签 -->
            <text id="scene2-label-north" x="350" y="65" text-anchor="middle" font-size="14" fill="#000000">北极</text>
            <text id="scene2-label-south" x="350" y="395" text-anchor="middle" font-size="14" fill="#000000">南极</text>
            <text id="scene2-label-equator" x="510" y="225" text-anchor="start" font-size="14" fill="#000000">赤道 0°</text>
            <text id="scene2-label-center" x="355" y="245" text-anchor="start" font-size="14" fill="#000000">地心</text>
            <!-- 经纬线标签移到椭圆外部，避免重叠 -->
            <text id="scene2-label-120e" x="445" y="130" text-anchor="start" font-size="12" fill="#888888">120°E</text>
            <text id="scene2-label-60w" x="255" y="130" text-anchor="end" font-size="12" fill="#888888">60°W</text>
            <text id="scene2-label-30n" x="475" y="180" text-anchor="start" font-size="12" fill="#888888" opacity="0">30°N</text>
            <text id="scene2-label-30s" x="225" y="280" text-anchor="end" font-size="12" fill="#888888" opacity="0">30°S</text>
            <text id="scene2-label-a" x="435" y="155" text-anchor="start" font-size="14" fill="#c62828" opacity="0">A(30°N,120°E)</text>
            <text id="scene2-label-b" x="260" y="300" text-anchor="end" font-size="14" fill="#1565c0" opacity="0">B(30°S,60°W)</text>
            
            <!-- 计算说明区背景 -->
            <rect id="scene2-calc-bg" x="520" y="80" width="260" height="170" fill="#f5f5f5" stroke="#cccccc" stroke-width="1" opacity="0"/>
            
            <!-- 计算说明区标题 -->
            <text id="scene2-calc-title" x="650" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000" opacity="0">对跖点概念</text>
            
            <!-- 计算说明区内容 -->
            <text id="scene2-calc-content" x="535" y="140" text-anchor="start" font-size="13" fill="#333333" opacity="0"></text>
            
            <!-- 规律总结框背景 -->
            <rect id="scene2-summary-bg" x="200" y="400" width="400" height="40" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" opacity="0"/>
            
            <!-- 规律总结框文字 -->
            <text id="scene2-summary-text" x="400" y="425" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e7d32" opacity="0">对跖点坐标规律：纬度数值相等、南北相反；经度数值和为 180°、东西相反</text>
        </svg>
        
        <div id="scene2-controls">
            <button id="scene2-btn-prev" class="scene2-btn" disabled>◀ 上一步</button>
            <button id="scene2-btn-next" class="scene2-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现 - 对跖点概念
        // 布局坐标表对照：
        // 地球球体：(350,230) 中心，半径 150px
        // A 点：(420,180) - 30°N,120°E
        // B 点：(280,280) - 30°S,60°W
        // 地心：(350,230)
        
        const scene2 = {
            currentStep: 0,
            totalSteps: 5,
            
            // 步骤配置
            steps: [
                {
                    // 步骤 0：初始状态 - 显示地球基本框架
                    showEarth: true,
                    showGrid: true,
                    showCenter: true,
                    showPointA: false,
                    showPointB: false,
                    showLineAB: false,
                    showCalcTitle: true,
                    showCalcContent: false,
                    showSummary: false,
                    showLatLabels: false,
                    calcContent: "对跖点概念",
                    aPulse: false,
                    bPulse: false,
                    lineBold: false
                },
                {
                    // 步骤 1：显示 A 点
                    showEarth: true,
                    showGrid: true,
                    showCenter: true,
                    showPointA: true,
                    showPointB: false,
                    showLineAB: false,
                    showCalcTitle: true,
                    showCalcContent: true,
                    showSummary: false,
                    showLatLabels: true,
                    calcContent: "咸蛋超人位置：A 点（30°N，120°E）",
                    aPulse: false,
                    bPulse: false,
                    lineBold: false
                },
                {
                    // 步骤 2：显示遁地路径
                    showEarth: true,
                    showGrid: true,
                    showCenter: true,
                    showPointA: true,
                    showPointB: false,
                    showLineAB: true,
                    showCalcTitle: true,
                    showCalcContent: true,
                    showSummary: false,
                    showLatLabels: true,
                    calcContent: "遁地路径：从 A 点直线穿过地心到地球另一端",
                    aPulse: false,
                    bPulse: false,
                    lineBold: false
                },
                {
                    // 步骤 3：显示 B 点及坐标计算
                    showEarth: true,
                    showGrid: true,
                    showCenter: true,
                    showPointA: true,
                    showPointB: true,
                    showLineAB: true,
                    showCalcTitle: true,
                    showCalcContent: true,
                    showSummary: false,
                    showLatLabels: true,
                    calcContent: "B 点坐标计算：\n纬度：30°N → 30°S（南北相反）\n经度：120°E → 180°-120°=60°W（东西相反，和为 180°）",
                    aPulse: false,
                    bPulse: false,
                    lineBold: false
                },
                {
                    // 步骤 4：最终步骤 - 规律总结
                    showEarth: true,
                    showGrid: true,
                    showCenter: true,
                    showPointA: true,
                    showPointB: true,
                    showLineAB: true,
                    showCalcTitle: true,
                    showCalcContent: true,
                    showSummary: true,
                    showLatLabels: true,
                    calcContent: "对跖点：地球直径两端互为对跖点的两个位置",
                    aPulse: true,
                    bPulse: true,
                    lineBold: true
                }
            ],
            
            // 获取元素
            elements: {
                earth: document.getElementById('scene2-earth'),
                equator: document.getElementById('scene2-equator'),
                primeMeridian: document.getElementById('scene2-prime-meridian'),
                meridian120e: document.getElementById('scene2-meridian-120e'),
                meridian60w: document.getElementById('scene2-meridian-60w'),
                latitude30n: document.getElementById('scene2-latitude-30n'),
                latitude30s: document.getElementById('scene2-latitude-30s'),
                lineAB: document.getElementById('scene2-line-ab'),
                center: document.getElementById('scene2-center'),
                pointA: document.getElementById('scene2-point-a'),
                pointARing: document.getElementById('scene2-point-a-ring'),
                pointB: document.getElementById('scene2-point-b'),
                pointBRing: document.getElementById('scene2-point-b-ring'),
                labelNorth: document.getElementById('scene2-label-north'),
                labelSouth: document.getElementById('scene2-label-south'),
                labelEquator: document.getElementById('scene2-label-equator'),
                labelCenter: document.getElementById('scene2-label-center'),
                label120e: document.getElementById('scene2-label-120e'),
                label60w: document.getElementById('scene2-label-60w'),
                label30n: document.getElementById('scene2-label-30n'),
                label30s: document.getElementById('scene2-label-30s'),
                labelA: document.getElementById('scene2-label-a'),
                labelB: document.getElementById('scene2-label-b'),
                calcBg: document.getElementById('scene2-calc-bg'),
                calcTitle: document.getElementById('scene2-calc-title'),
                calcContent: document.getElementById('scene2-calc-content'),
                summaryBg: document.getElementById('scene2-summary-bg'),
                summaryText: document.getElementById('scene2-summary-text'),
                btnPrev: document.getElementById('scene2-btn-prev'),
                btnNext: document.getElementById('scene2-btn-next')
            },
            
            // 显示/隐藏工具函数
            show: function(el) {
                if (el) {
                    el.style.display = 'block';
                    el.style.opacity = '1';
                }
            },
            
            hide: function(el) {
                if (el) {
                    el.style.display = 'none';
                    el.style.opacity = '0';
                }
            },
            
            // 渲染当前步骤
            renderStep: function() {
                const config = this.steps[this.currentStep];
                const el = this.elements;
                
                // 地球和网格
                if (config.showEarth) { this.show(el.earth); }
                if (config.showGrid) {
                    this.show(el.equator);
                    this.show(el.primeMeridian);
                    this.show(el.meridian120e);
                    this.show(el.meridian60w);
                    this.show(el.latitude30n);
                    this.show(el.latitude30s);
                    this.show(el.label120e);
                    this.show(el.label60w);
                    // 纬度标签根据步骤显示
                    if (config.showLatLabels) {
                        this.show(el.label30n);
                        this.show(el.label30s);
                    } else {
                        this.hide(el.label30n);
                        this.hide(el.label30s);
                    }
                }
                
                // 地心
                if (config.showCenter) { this.show(el.center); }
                
                // A 点
                if (config.showPointA) {
                    this.show(el.pointA);
                    this.show(el.pointARing);
                    this.show(el.labelA);
                    if (config.aPulse) {
                        el.pointARing.classList.add('scene2-pulse');
                    } else {
                        el.pointARing.classList.remove('scene2-pulse');
                    }
                } else {
                    this.hide(el.pointA);
                    this.hide(el.pointARing);
                    this.hide(el.labelA);
                }
                
                // B 点
                if (config.showPointB) {
                    this.show(el.pointB);
                    this.show(el.pointBRing);
                    this.show(el.labelB);
                    if (config.bPulse) {
                        el.pointBRing.classList.add('scene2-pulse');
                    } else {
                        el.pointBRing.classList.remove('scene2-pulse');
                    }
                } else {
                    this.hide(el.pointB);
                    this.hide(el.pointBRing);
                    this.hide(el.labelB);
                }
                
                // A-B 连线
                if (config.showLineAB) {
                    this.show(el.lineAB);
                    if (config.lineBold) {
                        el.lineAB.setAttribute('stroke-width', '2.5');
                    } else {
                        el.lineAB.setAttribute('stroke-width', '1.5');
                    }
                } else {
                    this.hide(el.lineAB);
                }
                
                // 计算说明区
                if (config.showCalcTitle) {
                    this.show(el.calcBg);
                    this.show(el.calcTitle);
                } else {
                    this.hide(el.calcBg);
                    this.hide(el.calcTitle);
                }
                
                if (config.showCalcContent) {
                    this.show(el.calcContent);
                    el.calcContent.textContent = config.calcContent;
                } else {
                    this.hide(el.calcContent);
                }
                
                // 规律总结
                if (config.showSummary) {
                    this.show(el.summaryBg);
                    this.show(el.summaryText);
                } else {
                    this.hide(el.summaryBg);
                    this.hide(el.summaryText);
                }
                
                // 按钮状态
                el.btnPrev.disabled = (this.currentStep === 0);
                el.btnNext.disabled = (this.currentStep === this.totalSteps - 1);
            },
            
            // 下一步
            nextStep: function() {
                if (this.currentStep < this.totalSteps - 1) {
                    this.currentStep++;
                    this.renderStep();
                }
            },
            
            // 上一步
            prevStep: function() {
                if (this.currentStep > 0) {
                    this.currentStep--;
                    this.renderStep();
                }
            },
            
            // 初始化
            init: function() {
                this.elements.btnNext.addEventListener('click', () => this.nextStep());
                this.elements.btnPrev.addEventListener('click', () => this.prevStep());
                this.renderStep();
            }
        };
        
        // 启动场景
        scene2.init();
    })();
    </script>
</body>
</html>
