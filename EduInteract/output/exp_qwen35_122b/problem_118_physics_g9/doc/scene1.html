<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>串联电路结构分析与电表测量对象识别</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene1-controls button { padding: 8px 20px; font-size: 14px; border: none; border-radius: 4px; cursor: pointer; }
        #scene1-prev-btn { background: #9e9e9e; color: white; }
        #scene1-prev-btn:disabled { background: #e0e0e0; cursor: not-allowed; }
        #scene1-next-btn { background: #1565c0; color: white; }
        #scene1-next-btn:disabled { background: #64b5f6; cursor: not-allowed; }
        
        /* 高亮样式 */
        .highlight-blue { stroke: #1565c0 !important; stroke-width: 3 !important; }
        .highlight-blue-fill { fill: rgba(21, 101, 192, 0.2) !important; }
        .highlight-green { stroke: #2e7d32 !important; stroke-width: 3 !important; }
        .highlight-green-fill { fill: rgba(46, 125, 50, 0.2) !important; }
        .highlight-red { stroke: #c62828 !important; stroke-width: 3 !important; }
        
        /* 过渡动画 */
        svg line, svg rect, svg circle, svg polygon { transition: stroke 0.3s ease, stroke-width 0.3s ease, fill 0.3s ease; }
        
        /* 标注文字 */
        .annotation { font-size: 14px; fill: #1565c0; font-weight: bold; }
        .annotation-green { fill: #2e7d32; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <!-- SVG 图示区：固定 800×500px -->
        <svg width="800" height="500" id="scene1-svg">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
                </marker>
                <marker id="scene1-arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0"/>
                </marker>
                <marker id="scene1-arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32"/>
                </marker>
            </defs>
            
            <!-- ============ 主回路导线 ============ -->
            <!-- 左侧竖导线：连接 R₁和电源 -->
            <line id="scene1-wire-left" x1="140" y1="200" x2="140" y2="360" stroke="#000000" stroke-width="2" class="main-wire"/>
            
            <!-- 上侧左横导线：连接 R₁和 R₂左端 -->
            <line id="scene1-wire-top-left" x1="140" y1="200" x2="220" y2="200" stroke="#000000" stroke-width="2" class="main-wire"/>
            
            <!-- R₂滑动变阻器导线（上） -->
            <line id="scene1-wire-r2-top" x1="220" y1="200" x2="580" y2="200" stroke="#000000" stroke-width="2" class="main-wire"/>
            
            <!-- 右侧竖导线：连接 R₂和电流表 -->
            <line id="scene1-wire-right" x1="580" y1="200" x2="580" y2="80" stroke="#000000" stroke-width="2" class="main-wire"/>
            
            <!-- 上侧右横导线：连接电流表和电源负极 -->
            <line id="scene1-wire-top-right" x1="580" y1="80" x2="460" y2="80" stroke="#000000" stroke-width="2" class="main-wire"/>
            
            <!-- 电源到开关导线 -->
            <line id="scene1-wire-source-switch" x1="400" y1="360" x2="460" y2="360" stroke="#000000" stroke-width="2" class="main-wire"/>
            
            <!-- 开关到右侧导线 -->
            <line id="scene1-wire-switch-right" x1="500" y1="360" x2="580" y2="360" stroke="#000000" stroke-width="2" class="main-wire"/>
            
            <!-- 电源左侧到 R₁底部 -->
            <line id="scene1-wire-source-r1" x1="140" y1="360" x2="320" y2="360" stroke="#000000" stroke-width="2" class="main-wire"/>
            
            <!-- ============ 电阻 R₁ ============ -->
            <rect id="scene1-r1" x="120" y="220" width="40" height="80" fill="none" stroke="#000000" stroke-width="2"/>
            <text id="scene1-label-r1" x="100" y="265" font-size="16" fill="#000000">R₁</text>
            
            <!-- ============ 滑动变阻器 R₂ ============ -->
            <rect id="scene1-r2" x="220" y="190" width="360" height="20" fill="none" stroke="#000000" stroke-width="2"/>
            <text id="scene1-label-r2" x="380" y="225" font-size="16" fill="#000000">R₂</text>
            
            <!-- 滑片 P 箭头 -->
            <line id="scene1-slider-p" x1="400" y1="160" x2="400" y2="190" stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrowhead)"/>
            <text id="scene1-label-p" x="390" y="155" font-size="16" fill="#000000">P</text>
            
            <!-- ============ 电源 ============ -->
            <!-- 长线（正极） -->
            <line id="scene1-source-pos" x1="320" y1="350" x2="320" y2="370" stroke="#000000" stroke-width="3"/>
            <!-- 短线（负极） -->
            <line id="scene1-source-neg" x1="380" y1="355" x2="380" y2="365" stroke="#000000" stroke-width="3"/>
            <text id="scene1-label-plus" x="300" y="365" font-size="16" fill="#000000">+</text>
            <text id="scene1-label-minus" x="385" y="365" font-size="16" fill="#000000">-</text>
            
            <!-- ============ 开关 S ============ -->
            <line id="scene1-switch" x1="460" y1="360" x2="500" y2="360" stroke="#000000" stroke-width="2"/>
            <line id="scene1-switch-arm" x1="460" y1="360" x2="470" y2="350" stroke="#000000" stroke-width="2"/>
            <text id="scene1-label-s" x="480" y="345" font-size="16" fill="#000000">S</text>
            
            <!-- ============ 电流表 A ============ -->
            <circle id="scene1-ammeter" cx="630" cy="80" r="25" fill="none" stroke="#000000" stroke-width="2"/>
            <text id="scene1-label-a" x="630" y="55" font-size="16" fill="#000000" text-anchor="middle">A</text>
            
            <!-- ============ 电压表 V₁ ============ -->
            <circle id="scene1-voltmeter1" cx="180" cy="120" r="25" fill="none" stroke="#000000" stroke-width="2"/>
            <text id="scene1-label-v1" x="180" y="95" font-size="16" fill="#000000" text-anchor="middle">V₁</text>
            
            <!-- V₁连接线（虚线） -->
            <line id="scene1-v1-line-left" x1="140" y1="200" x2="140" y2="145" stroke="#666666" stroke-width="1" stroke-dasharray="4,4"/>
            <line id="scene1-v1-line-right" x1="220" y1="200" x2="220" y2="145" stroke="#666666" stroke-width="1" stroke-dasharray="4,4"/>
            <line id="scene1-v1-top" x1="140" y1="145" x2="220" y2="145" stroke="#666666" stroke-width="1" stroke-dasharray="4,4"/>
            <line id="scene1-v1-to-meter" x1="180" y1="145" x2="180" y2="145" stroke="#666666" stroke-width="1" stroke-dasharray="4,4"/>
            
            <!-- ============ 电压表 V₂ ============ -->
            <circle id="scene1-voltmeter2" cx="360" cy="430" r="25" fill="none" stroke="#000000" stroke-width="2"/>
            <text id="scene1-label-v2" x="360" y="460" font-size="16" fill="#000000" text-anchor="middle">V₂</text>
            
            <!-- V₂连接线（虚线） -->
            <line id="scene1-v2-line-left" x1="140" y1="360" x2="140" y2="430" stroke="#666666" stroke-width="1" stroke-dasharray="4,4"/>
            <line id="scene1-v2-line-right" x1="580" y1="360" x2="580" y2="430" stroke="#666666" stroke-width="1" stroke-dasharray="4,4"/>
            <line id="scene1-v2-top" x1="140" y1="430" x2="580" y2="430" stroke="#666666" stroke-width="1" stroke-dasharray="4,4"/>
            
            <!-- ============ 标注文字（初始隐藏） ============ -->
            <text id="scene1-annotation1" class="annotation" x="650" y="120" font-size="14" opacity="0">测总电流</text>
            <text id="scene1-annotation2" class="annotation" x="240" y="250" font-size="14" opacity="0">测 R₂电压</text>
            <text id="scene1-annotation3" class="annotation" x="400" y="470" font-size="14" opacity="0">测电源电压</text>
            <text id="scene1-conclusion" class="annotation annotation-green" x="220" y="460" font-size="14" font-weight="bold" opacity="0">V₁测 R₂，V₂测电源，A 测总电流</text>
        </svg>
        
        <!-- 控件栏叠在 SVG 底部 -->
        <div id="scene1-controls">
            <button id="scene1-prev-btn" disabled>◀ 上一步</button>
            <button id="scene1-next-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现
        // 布局坐标表对照：
        // | 元素 | 位置/范围 | 备注 |
        // | R₁电阻 | (120,220)-(160,300) | 竖直放置 |
        // | R₂滑动变阻器 | (220,190)-(580,210) | 水平放置 |
        // | 滑片 P | (400,160)-(400,190) | 向下箭头 |
        // | 电流表 A | (630,80) 半径 25 | 右上角 |
        // | 电压表 V₁ | (180,120) 半径 25 | 左上角 |
        // | 电压表 V₂ | (360,430) 半径 25 | 底部 |
        // | 电源 | (320,350)-(380,370) | 正极左，负极右 |
        // | 开关 S | (460,360)-(500,360) | 闭合状态 |
        
        const currentStepMax = 5;
        let currentStep = 0;
        
        // 获取 DOM 元素
        const svg = document.getElementById('scene1-svg');
        const prevBtn = document.getElementById('scene1-prev-btn');
        const nextBtn = document.getElementById('scene1-next-btn');
        
        // 主回路导线集合
        const mainWires = [
            document.getElementById('scene1-wire-left'),
            document.getElementById('scene1-wire-top-left'),
            document.getElementById('scene1-wire-r2-top'),
            document.getElementById('scene1-wire-right'),
            document.getElementById('scene1-wire-top-right'),
            document.getElementById('scene1-wire-source-switch'),
            document.getElementById('scene1-wire-switch-right'),
            document.getElementById('scene1-wire-source-r1')
        ];
        
        // 元件集合
        const elements = {
            r1: document.getElementById('scene1-r1'),
            r2: document.getElementById('scene1-r2'),
            sliderP: document.getElementById('scene1-slider-p'),
            ammeter: document.getElementById('scene1-ammeter'),
            voltmeter1: document.getElementById('scene1-voltmeter1'),
            voltmeter2: document.getElementById('scene1-voltmeter2'),
            sourcePos: document.getElementById('scene1-source-pos'),
            sourceNeg: document.getElementById('scene1-source-neg'),
            switch: document.getElementById('scene1-switch'),
            switchArm: document.getElementById('scene1-switch-arm')
        };
        
        // V₁连接线集合
        const v1Lines = [
            document.getElementById('scene1-v1-line-left'),
            document.getElementById('scene1-v1-line-right'),
            document.getElementById('scene1-v1-top')
        ];
        
        // V₂连接线集合
        const v2Lines = [
            document.getElementById('scene1-v2-line-left'),
            document.getElementById('scene1-v2-line-right'),
            document.getElementById('scene1-v2-top')
        ];
        
        // 标注文字
        const annotations = {
            a: document.getElementById('scene1-annotation1'),
            v1: document.getElementById('scene1-annotation2'),
            v2: document.getElementById('scene1-annotation3'),
            conclusion: document.getElementById('scene1-conclusion')
        };
        
        // 工具函数：显示元素
        function show(el) {
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }
        
        // 工具函数：隐藏元素
        function hide(el) {
            if (el) {
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }
        
        // 工具函数：添加高亮类
        function addHighlight(el, className) {
            if (el) el.classList.add(className);
        }
        
        // 工具函数：移除高亮类
        function removeHighlight(el, className) {
            if (el) el.classList.remove(className);
        }
        
        // 更新显示状态
        function updateDisplay() {
            // 重置所有高亮
            mainWires.forEach(w => {
                removeHighlight(w, 'highlight-blue');
                removeHighlight(w, 'highlight-green');
            });
            Object.values(elements).forEach(el => {
                removeHighlight(el, 'highlight-blue');
                removeHighlight(el, 'highlight-blue-fill');
                removeHighlight(el, 'highlight-green');
                removeHighlight(el, 'highlight-green-fill');
            });
            v1Lines.forEach(l => {
                removeHighlight(l, 'highlight-blue');
                removeHighlight(l, 'highlight-green');
            });
            v2Lines.forEach(l => {
                removeHighlight(l, 'highlight-blue');
                removeHighlight(l, 'highlight-green');
            });
            
            // 隐藏所有标注
            Object.values(annotations).forEach(a => hide(a));
            
            // 根据当前步骤设置高亮
            switch(currentStep) {
                case 1:
                    // 高亮主回路（蓝色）
                    mainWires.forEach(w => addHighlight(w, 'highlight-blue'));
                    Object.values(elements).forEach(el => addHighlight(el, 'highlight-blue-fill'));
                    break;
                    
                case 2:
                    // 高亮电流表 A（蓝色）
                    addHighlight(elements.ammeter, 'highlight-blue');
                    show(annotations.a);
                    break;
                    
                case 3:
                    // 高亮电压表 V₁（蓝色）
                    addHighlight(elements.voltmeter1, 'highlight-blue');
                    v1Lines.forEach(l => addHighlight(l, 'highlight-blue'));
                    show(annotations.v1);
                    break;
                    
                case 4:
                    // 高亮电压表 V₂（蓝色）
                    addHighlight(elements.voltmeter2, 'highlight-blue');
                    v2Lines.forEach(l => addHighlight(l, 'highlight-blue'));
                    show(annotations.v2);
                    break;
                    
                case 5:
                    // 所有电表绿色高亮，显示结论
                    addHighlight(elements.ammeter, 'highlight-green');
                    addHighlight(elements.voltmeter1, 'highlight-green');
                    addHighlight(elements.voltmeter2, 'highlight-green');
                    v1Lines.forEach(l => addHighlight(l, 'highlight-green'));
                    v2Lines.forEach(l => addHighlight(l, 'highlight-green'));
                    show(annotations.conclusion);
                    break;
            }
            
            // 更新按钮状态
            prevBtn.disabled = (currentStep === 0);
            nextBtn.disabled = (currentStep === currentStepMax);
        }
        
        // 按钮事件绑定
        prevBtn.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        });
        
        nextBtn.addEventListener('click', function() {
            if (currentStep < currentStepMax) {
                currentStep++;
                updateDisplay();
            }
        });
        
        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
