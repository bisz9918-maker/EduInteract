<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>串联电路动态分析 - 滑动变阻器对电路的影响</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene1-btn { padding: 8px 20px; font-size: 14px; border: none; border-radius: 4px; cursor: pointer; transition: all 0.2s; }
        #scene1-btn-prev { background: #9e9e9e; color: white; }
        #scene1-btn-prev:disabled { background: #bdbdbd; cursor: not-allowed; }
        #scene1-btn-next { background: #1976d2; color: white; }
        #scene1-btn-next:hover:not(:disabled) { background: #1565c0; }
        .scene1-value-text { font-size: 14px; fill: #333; }
        .scene1-value-blue { fill: #1565c0; }
        .scene1-value-red { fill: #c62828; }
        .scene1-value-green { fill: #2e7d32; }
        .scene1-highlight { stroke-width: 3px !important; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- 导线 -->
            <line x1="280" y1="80" x2="380" y2="80" stroke="#000000" stroke-width="2"/>
            <line x1="380" y1="80" x2="440" y2="80" stroke="#000000" stroke-width="2"/>
            <line x1="440" y1="80" x2="540" y2="80" stroke="#000000" stroke-width="2"/>
            <line x1="540" y1="80" x2="540" y2="100" stroke="#000000" stroke-width="2"/>
            <line x1="560" y1="100" x2="560" y2="220" stroke="#000000" stroke-width="2"/>
            <line x1="560" y1="220" x2="480" y2="220" stroke="#000000" stroke-width="2"/>
            <line x1="200" y1="220" x2="140" y2="220" stroke="#000000" stroke-width="2"/>
            <line x1="140" y1="220" x2="140" y2="160" stroke="#000000" stroke-width="2"/>
            <line x1="120" y1="160" x2="280" y2="160" stroke="#000000" stroke-width="2"/>
            <line x1="280" y1="160" x2="280" y2="100" stroke="#000000" stroke-width="2"/>
            
            <!-- 电压表连接线 -->
            <line x1="140" y1="160" x2="200" y2="160" stroke="#000000" stroke-width="2"/>
            <line x1="340" y1="160" x2="340" y2="220" stroke="#000000" stroke-width="2"/>
            
            <!-- 电源（电池组） -->
            <line x1="280" y1="70" x2="380" y2="70" stroke="#000000" stroke-width="2"/>
            <line x1="280" y1="90" x2="300" y2="90" stroke="#000000" stroke-width="2"/>
            <line x1="300" y1="70" x2="300" y2="90" stroke="#000000" stroke-width="2"/>
            <line x1="320" y1="70" x2="320" y2="90" stroke="#000000" stroke-width="2"/>
            <line x1="340" y1="70" x2="340" y2="90" stroke="#000000" stroke-width="2"/>
            <line x1="360" y1="70" x2="360" y2="90" stroke="#000000" stroke-width="2"/>
            <line x1="380" y1="70" x2="380" y2="90" stroke="#000000" stroke-width="2"/>
            <line x1="300" y1="70" x2="300" y2="50" stroke="#000000" stroke-width="2"/>
            <line x1="300" y1="50" x2="380" y2="50" stroke="#000000" stroke-width="2"/>
            <line x1="380" y1="50" x2="380" y2="70" stroke="#000000" stroke-width="2"/>
            
            <!-- 开关 S -->
            <line x1="390" y1="80" x2="420" y2="80" stroke="#000000" stroke-width="2"/>
            <line x1="420" y1="80" x2="435" y2="70" stroke="#000000" stroke-width="2"/>
            
            <!-- 灯泡 L（圆圈 + 叉） -->
            <circle id="scene1-灯泡" cx="540" cy="100" r="20" fill="#f5f5f5" stroke="#000000" stroke-width="2"/>
            <line x1="526" y1="86" x2="554" y2="114" stroke="#000000" stroke-width="2"/>
            <line x1="554" y1="86" x2="526" y2="114" stroke="#000000" stroke-width="2"/>
            
            <!-- 滑动变阻器 R -->
            <rect id="scene1-变阻器" x="200" y="200" width="280" height="40" fill="#f5f5f5" stroke="#000000" stroke-width="2"/>
            <!-- 电阻丝 -->
            <line x1="210" y1="220" x2="470" y2="220" stroke="#000000" stroke-width="2"/>
            
            <!-- 滑片 P -->
            <line id="scene1-滑片杆" x1="340" y1="180" x2="340" y2="220" stroke="#000000" stroke-width="2"/>
            <polygon id="scene1-滑片箭头" points="340,180 335,190 345,190" fill="#000000"/>
            
            <!-- 电流表 A -->
            <circle id="scene1-电流表" cx="140" cy="160" r="20" fill="#f5f5f5" stroke="#000000" stroke-width="2"/>
            
            <!-- 电压表 V -->
            <circle id="scene1-电压表" cx="220" cy="160" r="20" fill="#f5f5f5" stroke="#000000" stroke-width="2"/>
            
            <!-- 元件标签 -->
            <text id="scene1-label-U" x="330" y="45" text-anchor="middle" font-size="14" fill="#000000">U</text>
            <text id="scene1-label-S" x="410" y="65" text-anchor="middle" font-size="14" fill="#000000">S</text>
            <text id="scene1-label-L" x="565" y="100" text-anchor="start" font-size="14" fill="#000000">L</text>
            <text id="scene1-label-R" x="340" y="360" text-anchor="middle" font-size="14" fill="#000000">R</text>
            <text id="scene1-label-A" x="140" y="195" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">A</text>
            <text id="scene1-label-V" x="220" y="195" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">V</text>
            
            <!-- 滑片位置指示 -->
            <text id="scene1-pos-left" x="200" y="380" text-anchor="middle" font-size="12" fill="#666">R=0</text>
            <text id="scene1-pos-middle" x="340" y="380" text-anchor="middle" font-size="12" fill="#666">R=R_max/2</text>
            <text id="scene1-pos-right" x="480" y="380" text-anchor="middle" font-size="12" fill="#666">R=R_max</text>
            
            <!-- 数值显示区 -->
            <g id="scene1-value-display">
                <text id="scene1-val-1" class="scene1-value-text" x="580" y="330" display="none"></text>
                <text id="scene1-val-2" class="scene1-value-text" x="580" y="370" display="none"></text>
                <text id="scene1-val-3" class="scene1-value-text" x="580" y="410" display="none"></text>
                <text id="scene1-val-4" class="scene1-value-text" x="580" y="450" display="none"></text>
                <text id="scene1-val-5" class="scene1-value-text" x="580" y="490" display="none"></text>
            </g>
            
            <!-- 滑片移动轨迹（步骤 1 显示） -->
            <line id="scene1-trajectory" x1="200" y1="220" x2="480" y2="220" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" display="none"/>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn" disabled>◀ 上一步</button>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现 - 串联电路动态分析
        
        const scene1 = {
            currentStep: 0,
            totalSteps: 6,
            
            // 滑片位置（x 坐标）
            sliderPositions: {
                left: 200,
                middle: 340,
                right: 480
            },
            
            // 步骤数据
            steps: [
                {
                    // 步骤 0：初始状态
                    sliderX: 340,
                    highlights: [],
                    values: []
                },
                {
                    // 步骤 1：滑片移动分析
                    sliderX: 340,
                    highlights: ['变阻器', 'trajectory'],
                    values: [
                        { text: '滑片 P 从左→右移动', class: 'scene1-value-text' },
                        { text: '变阻器阻值：R: 0 → R_max', class: 'scene1-value-text' }
                    ]
                },
                {
                    // 步骤 2：滑片在最右端
                    sliderX: 480,
                    highlights: ['电压表'],
                    values: [
                        { text: '滑片在最右端 (R=R_max)', class: 'scene1-value-text' },
                        { text: 'I_min = 0.2A', class: 'scene1-value-blue' },
                        { text: 'U_R_max = 4V', class: 'scene1-value-red' }
                    ]
                },
                {
                    // 步骤 3：滑片在最左端
                    sliderX: 200,
                    highlights: ['电流表'],
                    values: [
                        { text: '滑片在最左端 (R=0)', class: 'scene1-value-text' },
                        { text: 'I_max = ?', class: 'scene1-value-blue' },
                        { text: '灯功率 P_L 最大', class: 'scene1-value-green' }
                    ]
                },
                {
                    // 步骤 4：滑片在中点
                    sliderX: 340,
                    highlights: ['灯泡'],
                    values: [
                        { text: '滑片在中点 (R=R_max/2)', class: 'scene1-value-text' },
                        { text: '灯功率达到最大', class: 'scene1-value-green' },
                        { text: 'P_L_max : P_L_min = 9 : 4', class: 'scene1-value-green' }
                    ]
                },
                {
                    // 步骤 5：公式推导
                    sliderX: 340,
                    highlights: ['变阻器', '电流表', '灯泡'],
                    values: [
                        { text: 'P = I²R_L', class: 'scene1-value-text' },
                        { text: 'P_max : P_min = I_max² : I_min² = 9 : 4', class: 'scene1-value-green' },
                        { text: 'I_max : I_min = 3 : 2', class: 'scene1-value-text' },
                        { text: 'I_max = 1.5 × 0.2A = 0.3A', class: 'scene1-value-blue' }
                    ]
                }
            ],
            
            // 初始化
            init: function() {
                this.updateDisplay();
                this.bindEvents();
            },
            
            // 更新显示
            updateDisplay: function() {
                const step = this.steps[this.currentStep];
                
                // 更新滑片位置
                const slider 杆 = document.getElementById('scene1-滑片杆');
                const slider 箭头 = document.getElementById('scene1-滑片箭头');
                slider 杆.setAttribute('x1', step.sliderX);
                slider 杆.setAttribute('x2', step.sliderX);
                slider 箭头.setAttribute('points', step.sliderX + ',180 ' + (step.sliderX - 5) + ',190 ' + (step.sliderX + 5) + ',190');
                
                // 更新高亮
                this.clearHighlights();
                step.highlights.forEach(id => {
                    const el = document.getElementById('scene1-' + id);
                    if (el) {
                        el.classList.add('scene1-highlight');
                        if (id === 'trajectory') {
                            el.style.display = 'block';
                        }
                        if (id === '变阻器') {
                            el.style.stroke = '#1565c0';
                        } else if (id === '电压表') {
                            el.style.stroke = '#c62828';
                        } else if (id === '电流表') {
                            el.style.stroke = '#1565c0';
                        } else if (id === '灯泡') {
                            el.style.stroke = '#2e7d32';
                        }
                    }
                });
                
                // 更新数值显示
                for (let i = 1; i <= 5; i++) {
                    const valEl = document.getElementById('scene1-val-' + i);
                    if (step.values[i - 1]) {
                        valEl.textContent = step.values[i - 1].text;
                        valEl.className = step.values[i - 1].class;
                        valEl.style.display = 'block';
                    } else {
                        valEl.style.display = 'none';
                    }
                }
                
                // 更新按钮状态
                document.getElementById('scene1-btn-prev').disabled = (this.currentStep === 0);
                const nextBtn = document.getElementById('scene1-btn-next');
                if (this.currentStep === this.totalSteps - 1) {
                    nextBtn.textContent = '完成';
                } else {
                    nextBtn.textContent = '下一步 ▶';
                }
            },
            
            // 清除所有高亮
            clearHighlights: function() {
                const elements = ['变阻器', '电压表', '电流表', '灯泡', 'trajectory'];
                elements.forEach(id => {
                    const el = document.getElementById('scene1-' + id);
                    if (el) {
                        el.classList.remove('scene1-highlight');
                        el.style.stroke = '';
                        if (id === 'trajectory') {
                            el.style.display = 'none';
                        }
                    }
                });
            },
            
            // 绑定事件
            bindEvents: function() {
                const prevBtn = document.getElementById('scene1-btn-prev');
                const nextBtn = document.getElementById('scene1-btn-next');
                
                prevBtn.addEventListener('click', () => {
                    if (this.currentStep > 0) {
                        this.currentStep--;
                        this.updateDisplay();
                    }
                });
                
                nextBtn.addEventListener('click', () => {
                    if (this.currentStep < this.totalSteps - 1) {
                        this.currentStep++;
                        this.updateDisplay();
                    }
                });
            }
        };
        
        // 启动
        scene1.init();
    })();
    </script>
</body>
</html>
