<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>六物块系统受力分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene1-controls button { width: 80px; height: 30px; font-size: 14px; cursor: pointer; background: #e0e0e0; border: 1px solid #999; border-radius: 4px; }
        #scene1-controls button:hover { background: #d0d0d0; }
        #scene1-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- 地面线 -->
            <line x1="100" y1="240" x2="600" y2="240" stroke="#000" stroke-width="2"/>
            <!-- 地面阴影斜线 -->
            <g id="scene1-ground-shadows">
                <line x1="100" y1="240" x2="90" y2="255" stroke="#000" stroke-width="1"/>
                <line x1="120" y1="240" x2="110" y2="255" stroke="#000" stroke-width="1"/>
                <line x1="140" y1="240" x2="130" y2="255" stroke="#000" stroke-width="1"/>
                <line x1="160" y1="240" x2="150" y2="255" stroke="#000" stroke-width="1"/>
                <line x1="180" y1="240" x2="170" y2="255" stroke="#000" stroke-width="1"/>
                <line x1="200" y1="240" x2="190" y2="255" stroke="#000" stroke-width="1"/>
                <line x1="220" y1="240" x2="210" y2="255" stroke="#000" stroke-width="1"/>
                <line x1="240" y1="240" x2="230" y2="255" stroke="#000" stroke-width="1"/>
                <line x1="260" y1="240" x2="250" y2="255" stroke="#000" stroke-width="1"/>
                <line x1="280" y1="240" x2="270" y2="255" stroke="#000" stroke-width="1"/>
                <line x1="300" y1="240" x2="290" y2="255" stroke="#000" stroke-width="1"/>
                <line x1="320" y1="240" x2="310" y2="255" stroke="#000" stroke-width="1"/>
                <line x1="340" y1="240" x2="330" y2="255" stroke="#000" stroke-width="1"/>
                <line x1="360" y1="240" x2="350" y2="255" stroke="#000" stroke-width="1"/>
                <line x1="380" y1="240" x2="370" y2="255" stroke="#000" stroke-width="1"/>
                <line x1="400" y1="240" x2="390" y2="255" stroke="#000" stroke-width="1"/>
                <line x1="420" y1="240" x2="410" y2="255" stroke="#000" stroke-width="1"/>
                <line x1="440" y1="240" x2="430" y2="255" stroke="#000" stroke-width="1"/>
                <line x1="460" y1="240" x2="450" y2="255" stroke="#000" stroke-width="1"/>
                <line x1="480" y1="240" x2="470" y2="255" stroke="#000" stroke-width="1"/>
                <line x1="500" y1="240" x2="490" y2="255" stroke="#000" stroke-width="1"/>
                <line x1="520" y1="240" x2="510" y2="255" stroke="#000" stroke-width="1"/>
                <line x1="540" y1="240" x2="530" y2="255" stroke="#000" stroke-width="1"/>
                <line x1="560" y1="240" x2="550" y2="255" stroke="#000" stroke-width="1"/>
                <line x1="580" y1="240" x2="570" y2="255" stroke="#000" stroke-width="1"/>
                <line x1="600" y1="240" x2="590" y2="255" stroke="#000" stroke-width="1"/>
            </g>
            <!-- 物块 1-6 -->
            <rect id="scene1-block1" x="150" y="200" width="60" height="40" fill="#e3f2fd" stroke="#000" stroke-width="2"/>
            <rect id="scene1-block2" x="210" y="200" width="60" height="40" fill="#e3f2fd" stroke="#000" stroke-width="2"/>
            <rect id="scene1-block3" x="270" y="200" width="60" height="40" fill="#e3f2fd" stroke="#000" stroke-width="2"/>
            <rect id="scene1-block4" x="330" y="200" width="60" height="40" fill="#e3f2fd" stroke="#000" stroke-width="2"/>
            <rect id="scene1-block5" x="390" y="200" width="60" height="40" fill="#e3f2fd" stroke="#000" stroke-width="2"/>
            <rect id="scene1-block6" x="450" y="200" width="60" height="40" fill="#e3f2fd" stroke="#000" stroke-width="2"/>
            <!-- 编号 1-6（移到矩形上方，避免重叠） -->
            <text id="scene1-num1" x="180" y="192" font-size="16" text-anchor="middle" fill="#000">1</text>
            <text id="scene1-num2" x="240" y="192" font-size="16" text-anchor="middle" fill="#000">2</text>
            <text id="scene1-num3" x="300" y="192" font-size="16" text-anchor="middle" fill="#000">3</text>
            <text id="scene1-num4" x="360" y="192" font-size="16" text-anchor="middle" fill="#000">4</text>
            <text id="scene1-num5" x="420" y="192" font-size="16" text-anchor="middle" fill="#000">5</text>
            <text id="scene1-num6" x="480" y="192" font-size="16" text-anchor="middle" fill="#000">6</text>
            <!-- 力 F 箭头 -->
            <defs>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
                </marker>
                <marker id="scene1-arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#c62828"/>
                </marker>
                <marker id="scene1-arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0"/>
                </marker>
            </defs>
            <line id="scene1-forceF" x1="80" y1="220" x2="145" y2="220" stroke="#000" stroke-width="2" marker-end="url(#scene1-arrowhead)"/>
            <text id="scene1-labelF" x="95" y="210" font-size="16" fill="#000">F=6N</text>
            <!-- 步骤 1：整体分析元素 -->
            <g id="scene1-step1" style="opacity: 0; display: none;">
                <!-- 整体大括号（用折线模拟） -->
                <path id="scene1-brace" d="M 145 170 L 145 160 L 330 160 L 515 160 L 515 170" fill="none" stroke="#2e7d32" stroke-width="2"/>
                <text id="scene1-label-whole" x="330" y="152" font-size="16" text-anchor="middle" fill="#2e7d32">整体</text>
                <!-- f_总箭头（向左） -->
                <line id="scene1-fTotal-arrow" x1="330" y1="195" x2="330" y2="215" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrowhead-red)"/>
                <text id="scene1-label-fTotal" x="275" y="205" font-size="16" fill="#c62828">f_总=6N</text>
            </g>
            <!-- 步骤 2：隔离分析元素 -->
            <g id="scene1-step2" style="opacity: 0; display: none;">
                <!-- 隔离虚线框 -->
                <rect id="scene1-isolation-box" x="325" y="170" width="190" height="80" fill="none" stroke="#888" stroke-width="2" stroke-dasharray="5,5"/>
                <!-- F_34 箭头（蓝色，从 3 指向 4） -->
                <line id="scene1-F34-arrow" x1="315" y1="220" x2="330" y2="220" stroke="#1565c0" stroke-width="3" marker-end="url(#scene1-arrowhead-blue)"/>
                <text id="scene1-label-F34" x="295" y="215" font-size="16" fill="#1565c0">F_34</text>
                <!-- f4/f5/f6 箭头（红色，向下） -->
                <line id="scene1-f4-arrow" x1="360" y1="240" x2="360" y2="255" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrowhead-red)"/>
                <text id="scene1-label-f4" x="350" y="270" font-size="14" fill="#c62828">f=1N</text>
                <line id="scene1-f5-arrow" x1="420" y1="240" x2="420" y2="255" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrowhead-red)"/>
                <text id="scene1-label-f5" x="410" y="270" font-size="14" fill="#c62828">f=1N</text>
                <line id="scene1-f6-arrow" x1="480" y1="240" x2="480" y2="255" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrowhead-red)"/>
                <text id="scene1-label-f6" x="470" y="270" font-size="14" fill="#c62828">f=1N</text>
            </g>
            <!-- 步骤 3：结论框 -->
            <g id="scene1-step3" style="opacity: 0; display: none;">
                <rect id="scene1-conclusion-box" x="280" y="300" width="240" height="40" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" rx="5"/>
                <text id="scene1-conclusion-text" x="400" y="328" font-size="18" text-anchor="middle" fill="#1565c0" font-weight="bold">F_34 = 3N（选项 B）</text>
            </g>
        </svg>
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
            <button id="scene1-btn-reset">重置</button>
        </div>
    </div>
    <script>
    (function() {
        // Scene 1: 六物块系统受力分析
        // 布局坐标表对照：
        // 地面线：(100,240)-(600,240)
        // 物块 1-6: x=150,210,270,330,390,450; y=200; w=60; h=40
        // 编号 1-6: x=180,240,300,360,420,480; y=192（移到矩形上方，避免重叠）
        // 力 F: (80,220)-(145,220); 标签 (95,210)
        // 整体大括号：(145,160)-(515,160); 标签 (330,152)
        // f_总箭头：(330,195)-(330,215); 标签 (275,205)
        // 隔离框：(325,170)-(515,250)
        // F_34 箭头：(315,220)-(330,220); 标签 (295,215)
        // f4/f5/f6: x=360,420,480; y 箭头 240-255; 标签 y=270
        // 结论框：(280,300)-(520,340); 文字 (400,328)

        const MAX_STEP = 3;
        let currentStep = 0;

        // 工具函数：显示/隐藏元素
        function show(el) {
            if (!el) return;
            el.style.display = 'block';
            el.style.opacity = '0';
            requestAnimationFrame(() => {
                el.style.opacity = '1';
            });
        }

        function hide(el) {
            if (!el) return;
            el.style.opacity = '0';
            setTimeout(() => {
                el.style.display = 'none';
            }, 300);
        }

        // 更新显示状态
        function updateDisplay() {
            const step1 = document.getElementById('scene1-step1');
            const step2 = document.getElementById('scene1-step2');
            const step3 = document.getElementById('scene1-step3');
            const btnPrev = document.getElementById('scene1-btn-prev');
            const btnNext = document.getElementById('scene1-btn-next');

            // 隐藏所有步骤元素
            hide(step1);
            hide(step2);
            hide(step3);

            // 根据当前步骤显示对应元素
            if (currentStep >= 1) {
                show(step1);
            }
            if (currentStep >= 2) {
                show(step2);
            }
            if (currentStep >= 3) {
                show(step3);
            }

            // 按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === MAX_STEP);
        }

        // 绑定事件
        document.getElementById('scene1-btn-prev').addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        });

        document.getElementById('scene1-btn-next').addEventListener('click', function() {
            if (currentStep < MAX_STEP) {
                currentStep++;
                updateDisplay();
            }
        });

        document.getElementById('scene1-btn-reset').addEventListener('click', function() {
            currentStep = 0;
            updateDisplay();
        });

        // 初始化
        updateDisplay();
    })();
    </script>
</body>
</html>
