<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安培定则判断电磁铁极性</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Microsoft YaHei', sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-svg { width: 800px; height: 500px; }
        #scene1-controls { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 20px; z-index: 10; }
        #scene1-btn-prev, #scene1-btn-next {
            padding: 8px 20px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #999;
            border-radius: 4px;
        }
        #scene1-btn-prev:disabled {
            background: #e0e0e0;
            cursor: not-allowed;
            color: #999;
        }
        #scene1-btn-next {
            background: #1976d2;
            color: white;
        }
        #scene1-btn-next:disabled {
            background: #90caf9;
            cursor: not-allowed;
        }
        .scene1-fade-in {
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 标题 -->
            <text id="scene1-title" x="400" y="45" text-anchor="middle" font-size="20" font-weight="bold" fill="#000000">安培定则判断电磁铁极性</text>
            
            <!-- 电磁铁铁芯 -->
            <rect id="scene1-core" x="80" y="180" width="240" height="60" fill="#e0e0e0" stroke="#000000" stroke-width="2"/>
            
            <!-- 线圈正面段（实线，5 段向上） -->
            <polyline id="scene1-coil-front" points="100,240 100,210 120,190 140,210 160,190 180,210 200,190 220,210 240,190 260,210 280,190 280,240" 
                      fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 线圈背面段（虚线，4 段向下） -->
            <polyline id="scene1-coil-back" points="110,200 130,220 150,200 170,220 190,200 210,220 230,200 250,220 270,200" 
                      fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,3"/>
            
            <!-- 电源 -->
            <!-- 长线（正极） -->
            <line id="scene1-battery-long" x1="180" y1="290" x2="180" y2="310" stroke="#2e7d32" stroke-width="3"/>
            <!-- 短线（负极） -->
            <line id="scene1-battery-short" x1="160" y1="295" x2="160" y2="305" stroke="#1565c0" stroke-width="3"/>
            
            <!-- 开关（闭合状态） -->
            <line id="scene1-switch" x1="100" y1="300" x2="130" y2="300" stroke="#000000" stroke-width="2"/>
            
            <!-- 导线 -->
            <!-- 左段：线圈左端到开关 -->
            <line id="scene1-wire-left" x1="100" y1="240" x2="100" y2="300" stroke="#000000" stroke-width="2"/>
            <!-- 中段：开关到负极 -->
            <line id="scene1-wire-mid" x1="130" y1="300" x2="160" y2="300" stroke="#000000" stroke-width="2"/>
            <!-- 右段：正极到线圈右端 -->
            <line id="scene1-wire-right" x1="180" y1="310" x2="180" y2="240" stroke="#000000" stroke-width="2"/>
            <line id="scene1-wire-right-top" x1="180" y1="240" x2="280" y2="240" stroke="#000000" stroke-width="2"/>
            
            <!-- 固定标签 -->
            <text id="scene1-label-a" x="65" y="220" font-size="16" fill="#000000">a</text>
            <text id="scene1-label-b" x="330" y="220" font-size="16" fill="#000000">b</text>
            <text id="scene1-label-plus" x="185" y="280" font-size="16" fill="#2e7d32" font-weight="bold">+</text>
            <text id="scene1-label-minus" x="155" y="280" font-size="16" fill="#1565c0" font-weight="bold">-</text>
            
            <!-- 步骤 1：电流箭头组 -->
            <g id="scene1-current-group" style="display:none">
                <!-- 导线右段电流箭头（向上） -->
                <polygon id="scene1-current-arrow-right" points="188,290 192,280 196,290" fill="#c62828"/>
                <text id="scene1-label-I" x="210" y="255" font-size="16" fill="#c62828" font-weight="bold">I</text>
                <!-- 线圈正面段电流箭头（向上） -->
                <polygon id="scene1-coil-arrow-1" points="108,190 112,180 116,190" fill="#c62828"/>
                <polygon id="scene1-coil-arrow-2" points="148,190 152,180 156,190" fill="#c62828"/>
                <polygon id="scene1-coil-arrow-3" points="188,190 192,180 196,190" fill="#c62828"/>
                <polygon id="scene1-coil-arrow-4" points="228,190 232,180 236,190" fill="#c62828"/>
                <polygon id="scene1-coil-arrow-5" points="268,190 272,180 276,190" fill="#c62828"/>
                <!-- 导线左段电流箭头（向下） -->
                <polygon id="scene1-current-arrow-left" points="98,270 102,280 106,270" fill="#c62828"/>
            </g>
            
            <!-- 步骤 2：右手示意图组 -->
            <g id="scene1-hand-group" style="display:none">
                <!-- 右手轮廓（简化） -->
                <path id="scene1-hand-outline" d="M 450,250 Q 460,230 480,220 Q 500,210 520,200 Q 540,190 560,200 Q 580,210 600,220 Q 620,230 630,250 Q 620,280 600,300 Q 580,310 560,300 Q 540,290 520,280 Q 500,270 480,280 Q 460,290 450,280 Q 440,270 445,260 Q 450,255 450,250" 
                      fill="none" stroke="#888888" stroke-width="2" stroke-dasharray="5,3"/>
                <!-- 四指曲线（弯曲向上，与线圈绕向对应） -->
                <path id="scene1-fingers" d="M 480,240 Q 500,220 520,200 Q 540,180 560,200 Q 580,220 600,240" 
                      fill="none" stroke="#888888" stroke-width="2" stroke-dasharray="5,3"/>
                <!-- 四指电流箭头 -->
                <polygon id="scene1-finger-arrow" points="538,195 548,190 543,200" fill="#c62828"/>
                <!-- 大拇指（绿色加粗，指向右方） -->
                <line id="scene1-thumb" x1="500" y1="260" x2="550" y2="260" stroke="#2e7d32" stroke-width="4"/>
                <!-- 大拇指 N 箭头 -->
                <polygon id="scene1-thumb-arrow" points="548,256 558,260 548,264" fill="#2e7d32"/>
                <!-- 标签：四指 -->
                <text id="scene1-label-fingers" x="560" y="170" font-size="14" fill="#000000">四指→电流方向</text>
                <!-- 标签：大拇指 -->
                <text id="scene1-label-thumb" x="510" y="315" font-size="14" fill="#000000">大拇指→N 极</text>
            </g>
            
            <!-- 步骤 3：极性标记组 -->
            <g id="scene1-polarity-group" style="display:none">
                <!-- N 极标记（b 端，绿色）- 移到电磁铁右端外侧上方，文字在矩形上方 -->
                <rect id="scene1-n-bg" x="345" y="140" width="40" height="30" rx="5" fill="#2e7d32" fill-opacity="0.2" stroke="#2e7d32" stroke-width="2"/>
                <text id="scene1-label-N" x="365" y="135" font-size="20" fill="#2e7d32" font-weight="bold" text-anchor="middle">N</text>
                <!-- S 极标记（a 端，蓝色）- 移到电磁铁左端外侧上方，文字在矩形上方 -->
                <rect id="scene1-s-bg" x="45" y="140" width="40" height="30" rx="5" fill="#1565c0" fill-opacity="0.2" stroke="#1565c0" stroke-width="2"/>
                <text id="scene1-label-S" x="65" y="135" font-size="20" fill="#1565c0" font-weight="bold" text-anchor="middle">S</text>
            </g>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀上一步</button>
            <button id="scene1-btn-next">下一步▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1: 安培定则判断电磁铁极性
        // 布局坐标表（参考）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // |------|------|-----------|------|-------------|------|
        // | 电磁铁铁芯 | 矩形 | (80,180)-(320,240) | 240×60 | - | 左侧区域主体 |
        // | 线圈正面段 | 折线 | (100,210)-(280,190) | - | - | 5 个向上绕段 |
        // | 线圈背面段 | 虚线 | (110,200)-(270,200) | - | - | 4 个向下绕段 |
        // | 电源 | 电池符号 | (140,300)-(200,300) | 60×30 | - | 下方居中 |
        // | 右手示意图 | 手掌轮廓 | (450,150)-(650,320) | 200×170 | - | 右侧区域 |
        
        const TOTAL_STEPS = 4;
        let currentStep = 0;
        
        const elements = {
            currentGroup: document.getElementById('scene1-current-group'),
            handGroup: document.getElementById('scene1-hand-group'),
            polarityGroup: document.getElementById('scene1-polarity-group'),
            btnPrev: document.getElementById('scene1-btn-prev'),
            btnNext: document.getElementById('scene1-btn-next')
        };
        
        function updateDisplay() {
            // 步骤 0: 只显示基础电路
            // 步骤 1: 显示电流
            // 步骤 2: 显示右手
            // 步骤 3: 显示极性
            
            // 控制各组的显示
            if (currentStep >= 1) {
                elements.currentGroup.style.display = 'block';
                elements.currentGroup.classList.add('scene1-fade-in');
            } else {
                elements.currentGroup.style.display = 'none';
                elements.currentGroup.classList.remove('scene1-fade-in');
            }
            
            if (currentStep >= 2) {
                elements.handGroup.style.display = 'block';
                elements.handGroup.classList.add('scene1-fade-in');
            } else {
                elements.handGroup.style.display = 'none';
                elements.handGroup.classList.remove('scene1-fade-in');
            }
            
            if (currentStep >= 3) {
                elements.polarityGroup.style.display = 'block';
                elements.polarityGroup.classList.add('scene1-fade-in');
            } else {
                elements.polarityGroup.style.display = 'none';
                elements.polarityGroup.classList.remove('scene1-fade-in');
            }
            
            // 更新按钮状态
            elements.btnPrev.disabled = currentStep === 0;
            
            if (currentStep === TOTAL_STEPS - 1) {
                elements.btnNext.textContent = '完成';
                elements.btnNext.disabled = true;
            } else {
                elements.btnNext.textContent = '下一步▶';
                elements.btnNext.disabled = false;
            }
        }
        
        elements.btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        });
        
        elements.btnNext.addEventListener('click', function() {
            if (currentStep < TOTAL_STEPS - 1) {
                currentStep++;
                updateDisplay();
            }
        });
        
        // 初始化
        updateDisplay();
    })();
    </script>
</body>
</html>
