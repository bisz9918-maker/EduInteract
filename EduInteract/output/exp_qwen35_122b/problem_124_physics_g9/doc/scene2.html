<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 磁感线形态与磁极关系判断</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 16px; z-index: 10; }
        .scene2-btn { padding: 8px 20px; font-size: 14px; border: none; border-radius: 4px; cursor: pointer; transition: all 0.2s; }
        .scene2-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene2-prev-btn { background: #9e9e9e; color: white; }
        #scene2-next-btn { background: #1976d2; color: white; }
        #scene2-prev-btn:hover:not(:disabled) { background: #757575; }
        #scene2-next-btn:hover:not(:disabled) { background: #1565c0; }
        #scene2-step-indicator { font-size: 14px; color: #666; min-width: 80px; text-align: center; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-canvas" width="800" height="500">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene2-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#000000" />
                </marker>
            </defs>
            
            <!-- 电磁铁甲铁芯 -->
            <rect id="scene2-core-甲" x="80" y="180" width="200" height="60" fill="#f5f5f5" stroke="#000000" stroke-width="2"/>
            
            <!-- 线圈（螺旋线） -->
            <path id="scene2-coil" d="M 90 195 Q 100 185 110 195 T 130 195 T 150 195 T 170 195 T 190 195 T 210 195 T 230 195 T 250 195 T 270 195" 
                  stroke="#000000" stroke-width="2" fill="none"/>
            <path id="scene2-coil-back" d="M 90 225 Q 100 235 110 225 T 130 225 T 150 225 T 170 225 T 190 225 T 210 225 T 230 225 T 250 225 T 270 225" 
                  stroke="#000000" stroke-width="2" fill="none"/>
            
            <!-- 导线连接 -->
            <path id="scene2-wire1" d="M 80 240 L 80 300 L 100 320" stroke="#000000" stroke-width="2" fill="none"/>
            <path id="scene2-wire2" d="M 280 240 L 280 320 L 210 320" stroke="#000000" stroke-width="2" fill="none"/>
            
            <!-- 开关 -->
            <line id="scene2-switch-line1" x1="100" y1="330" x2="120" y2="330" stroke="#000000" stroke-width="2"/>
            <line id="scene2-switch-line2" x1="130" y1="330" x2="140" y2="330" stroke="#000000" stroke-width="2"/>
            <line id="scene2-switch-arm" x1="120" y1="330" x2="130" y2="320" stroke="#000000" stroke-width="2"/>
            <circle id="scene2-switch-p1" cx="120" cy="330" r="3" fill="#000000"/>
            <circle id="scene2-switch-p2" cx="130" cy="330" r="3" fill="#000000"/>
            
            <!-- 电源（电池符号） -->
            <line id="scene2-battery-long" x1="160" y1="315" x2="160" y2="335" stroke="#000000" stroke-width="3"/>
            <line id="scene2-battery-short" x1="180" y1="320" x2="180" y2="330" stroke="#000000" stroke-width="3"/>
            <line id="scene2-battery-line1" x1="160" y1="325" x2="170" y2="325" stroke="#000000" stroke-width="2"/>
            <line id="scene2-battery-line2" x1="170" y1="325" x2="180" y2="325" stroke="#000000" stroke-width="2"/>
            
            <!-- 永磁体乙 -->
            <rect id="scene2-core-乙" x="520" y="180" width="200" height="60" fill="#f5f5f5" stroke="#000000" stroke-width="2"/>
            
            <!-- 磁感线（4 条曲线，向外弯曲表示排斥） -->
            <path id="scene2-field-line1" d="M 280 200 Q 350 170 400 170 Q 450 170 520 200" stroke="#000000" stroke-width="1.5" fill="none"/>
            <path id="scene2-field-line2" d="M 280 210 Q 350 185 400 185 Q 450 185 520 210" stroke="#000000" stroke-width="1.5" fill="none"/>
            <path id="scene2-field-line3" d="M 280 230 Q 350 255 400 255 Q 450 255 520 230" stroke="#000000" stroke-width="1.5" fill="none"/>
            <path id="scene2-field-line4" d="M 280 240 Q 350 270 400 270 Q 450 270 520 240" stroke="#000000" stroke-width="1.5" fill="none"/>
            
            <!-- 端点标签（向外移动，远离磁体） -->
            <text id="scene2-label-a" x="45" y="210" font-size="16" fill="#000000">a</text>
            <text id="scene2-label-b" x="310" y="210" font-size="16" fill="#000000">b</text>
            <text id="scene2-label-c" x="490" y="210" font-size="16" fill="#000000">c</text>
            <text id="scene2-label-d" x="755" y="210" font-size="16" fill="#000000">d</text>
            
            <!-- 磁体名称标签 -->
            <text id="scene2-name-甲" x="180" y="360" font-size="18" fill="#000000" text-anchor="middle">甲</text>
            <text id="scene2-name-乙" x="620" y="360" font-size="18" fill="#000000" text-anchor="middle">乙</text>
            
            <!-- 极性标记（向上移动，远离磁感线） -->
            <text id="scene2-polarity-a" x="45" y="165" font-size="18" fill="#1565c0" font-weight="bold">S</text>
            <text id="scene2-polarity-b" x="310" y="165" font-size="18" fill="#2e7d32" font-weight="bold">N</text>
            <text id="scene2-polarity-c" x="490" y="165" font-size="18" fill="#2e7d32" font-weight="bold" display="none">N</text>
            <text id="scene2-polarity-d" x="755" y="165" font-size="18" fill="#1565c0" font-weight="bold" display="none">S</text>
            
            <!-- 高亮框（步骤 1 显示） -->
            <rect id="scene2-highlight-box" x="270" y="190" width="260" height="80" fill="none" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5" display="none"/>
            
            <!-- 提示框（步骤 2 显示）- 无背景，只显示文字 -->
            <text id="scene2-hint-text" x="400" y="325" font-size="14" fill="#333333" text-anchor="middle" display="none">同名磁极相互排斥</text>
            
            <!-- 推理说明（步骤 3、4 显示）- 调整位置避免重叠 -->
            <text id="scene2-reason-c" x="490" y="145" font-size="12" fill="#666660" text-anchor="middle" display="none">c 与 b 为同名磁极</text>
            <text id="scene2-reason-d" x="755" y="145" font-size="12" fill="#666660" text-anchor="middle" display="none">d 与 c 为异名磁极</text>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-prev-btn" class="scene2-btn" disabled>◀ 上一步</button>
            <span id="scene2-step-indicator">步骤 0/4</span>
            <button id="scene2-next-btn" class="scene2-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现 - 磁感线形态与磁极关系判断
        // 布局坐标表（参考）：
        // | 元素 | 类型 | 位置/范围 | 备注 |
        // |------|------|-----------|------|
        // | 电磁铁甲铁芯 | 矩形 | (80,180)-(280,240) | 左侧水平放置 |
        // | 永磁体乙 | 矩形 | (520,180)-(720,240) | 右侧水平放置 |
        // | 磁感线 1-4 | 曲线 | (280,200/210/230/240)-(520,200/210/230/240) | 向外弯曲 |
        // | a 端标签 | text | (45,210) | 电磁铁左端（向外移动） |
        // | b 端标签 | text | (310,210) | 电磁铁右端（向外移动） |
        // | c 端标签 | text | (490,210) | 永磁体左端（向外移动） |
        // | d 端标签 | text | (755,210) | 永磁体右端（向外移动） |
        // | 高亮框 | 矩形 | (270,190)-(530,270) | 步骤 1 显示 |
        
        const currentStepMax = 4;
        let currentStep = 0;
        
        // 元素 ID 映射（按步骤分组）
        const stepElements = {
            0: ['core-甲', 'core-乙', 'coil', 'coil-back', 'wire1', 'wire2', 'switch-line1', 'switch-line2', 
                'switch-arm', 'switch-p1', 'switch-p2', 'battery-long', 'battery-short', 'battery-line1', 'battery-line2',
                'field-line1', 'field-line2', 'field-line3', 'field-line4', 'label-a', 'label-b', 'label-c', 'label-d',
                'name-甲', 'name-乙', 'polarity-a', 'polarity-b'],
            1: ['highlight-box'],
            2: ['hint-text'],
            3: ['polarity-c', 'reason-c'],
            4: ['polarity-d', 'reason-d']
        };
        
        // 更新显示状态
        function updateDisplay(step) {
            // 显示步骤 0 到当前步骤的所有元素
            for (let s = 0; s <= step; s++) {
                const elements = stepElements[s];
                if (elements) {
                    elements.forEach(suffix => {
                        const el = document.getElementById('scene2-' + suffix);
                        if (el) {
                            el.style.display = 'block';
                            el.style.opacity = '1';
                        }
                    });
                }
            }
            
            // 更新按钮状态
            const prevBtn = document.getElementById('scene2-prev-btn');
            const nextBtn = document.getElementById('scene2-next-btn');
            prevBtn.disabled = (step === 0);
            nextBtn.disabled = (step === currentStepMax);
            
            // 更新步骤指示
            document.getElementById('scene2-step-indicator').textContent = '步骤 ' + step + '/' + currentStepMax;
        }
        
        // 下一步
        function nextStep() {
            if (currentStep < currentStepMax) {
                currentStep++;
                updateDisplay(currentStep);
            }
        }
        
        // 上一步
        function prevStep() {
            if (currentStep > 0) {
                // 隐藏当前步骤及之后的元素
                for (let s = currentStep; s >= 0; s--) {
                    const elements = stepElements[s];
                    if (elements && s === currentStep) {
                        elements.forEach(suffix => {
                            const el = document.getElementById('scene2-' + suffix);
                            if (el) {
                                el.style.display = 'none';
                                el.style.opacity = '0';
                            }
                        });
                    }
                }
                currentStep--;
                updateDisplay(currentStep);
            }
        }
        
        // 绑定事件
        document.getElementById('scene2-next-btn').addEventListener('click', nextStep);
        document.getElementById('scene2-prev-btn').addEventListener('click', prevStep);
        
        // 初始化显示
        updateDisplay(0);
    })();
    </script>
</body>
</html>
