<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>凸透镜成像实验</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; gap: 20px; z-index: 10; }
        #scene1-prev-btn, #scene1-next-btn {
            padding: 8px 20px;
            font-size: 14px;
            border: 2px solid #1976d2;
            border-radius: 6px;
            background: #ffffff;
            color: #1976d2;
            cursor: pointer;
            transition: all 0.2s;
        }
        #scene1-prev-btn:hover:not(:disabled), #scene1-next-btn:hover:not(:disabled) {
            background: #1976d2;
            color: #ffffff;
        }
        #scene1-prev-btn:disabled, #scene1-next-btn:disabled {
            border-color: #bdbdbd;
            color: #bdbdbd;
            cursor: not-allowed;
        }
        .scene1-element { transition: opacity 0.3s ease; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 主光轴 -->
            <line id="scene1-axis" class="scene1-element" x1="50" y1="250" x2="750" y2="250" stroke="#000000" stroke-width="2"/>
            
            <!-- 标记点 -->
            <circle id="scene1-point-2f-left" class="scene1-element" cx="160" cy="250" r="3" fill="#000000"/>
            <circle id="scene1-point-f-left" class="scene1-element" cx="280" cy="250" r="3" fill="#000000"/>
            <circle id="scene1-point-o" class="scene1-element" cx="400" cy="250" r="3" fill="#000000"/>
            <circle id="scene1-point-f-right" class="scene1-element" cx="520" cy="250" r="3" fill="#000000"/>
            <circle id="scene1-point-2f-right" class="scene1-element" cx="640" cy="250" r="3" fill="#000000"/>
            
            <!-- 标记点标签 -->
            <text id="scene1-label-2f-left" class="scene1-element" x="152" y="270" font-size="14" fill="#000000">2F</text>
            <text id="scene1-label-f-left" class="scene1-element" x="276" y="270" font-size="14" fill="#000000">F</text>
            <text id="scene1-label-o" class="scene1-element" x="396" y="270" font-size="14" fill="#000000">O</text>
            <text id="scene1-label-f-right" class="scene1-element" x="516" y="270" font-size="14" fill="#000000">F</text>
            <text id="scene1-label-2f-right" class="scene1-element" x="632" y="270" font-size="14" fill="#000000">2F</text>
            
            <!-- 凸透镜 -->
            <ellipse id="scene1-lens" class="scene1-element" cx="400" cy="250" rx="10" ry="100" fill="none" stroke="#2e7d32" stroke-width="2"/>
            <text id="scene1-label-lens" class="scene1-element" x="360" y="110" font-size="14" fill="#000000">凸透镜</text>
            
            <!-- 蜡烛（步骤 1 显示） -->
            <g id="scene1-candle-group" class="scene1-element" style="display: none;">
                <!-- 蜡烛底座 -->
                <rect id="scene1-candle-base" x="95" y="230" width="20" height="20" fill="none" stroke="#000000" stroke-width="2"/>
                <!-- 蜡烛主体 -->
                <rect id="scene1-candle-body" x="100" y="160" width="10" height="70" fill="none" stroke="#000000" stroke-width="2"/>
                <!-- 火焰 -->
                <path id="scene1-candle-flame" d="M100,150 Q105,130 110,150 Q105,170 100,150" fill="#c62828" opacity="0.6"/>
                <!-- 蜡烛标签 -->
                <text id="scene1-label-candle" x="85" y="120" font-size="14" fill="#000000">蜡烛</text>
            </g>
            
            <!-- 物距标注（步骤 1 显示） -->
            <text id="scene1-label-u" class="scene1-element" x="230" y="230" font-size="14" fill="#1565c0" style="display: none;">u &gt; 2f</text>
            
            <!-- 光屏（步骤 2 显示） -->
            <g id="scene1-screen-group" class="scene1-element" style="display: none;">
                <!-- 光屏支架 -->
                <line id="scene1-screen-stand" x1="560" y1="250" x2="560" y2="180" stroke="#000000" stroke-width="2"/>
                <!-- 光屏面板 -->
                <polygon id="scene1-screen-panel" points="555,130 575,135 575,180 555,175" fill="#ffffff" stroke="#000000" stroke-width="2" opacity="0.8"/>
                <!-- 光屏标签 -->
                <text id="scene1-label-screen" x="545" y="110" font-size="14" fill="#000000">光屏</text>
            </g>
            
            <!-- 像距标注（步骤 2 显示） -->
            <text id="scene1-label-v" class="scene1-element" x="500" y="230" font-size="14" fill="#1565c0" style="display: none;">f &lt; v &lt; 2f</text>
            
            <!-- 成像性质（步骤 3 显示） -->
            <text id="scene1-label-image" class="scene1-element" x="400" y="90" font-size="14" fill="#000000" text-anchor="middle" style="display: none;">倒立、缩小、实像</text>
            
            <!-- 成像光路示意（步骤 3 显示） -->
            <g id="scene1-ray-group" class="scene1-element" style="display: none;">
                <!-- 从火焰顶端发出的平行光线 -->
                <line x1="105" y1="140" x2="400" y2="140" stroke="#ff9800" stroke-width="1.5" stroke-dasharray="5,3"/>
                <!-- 经过透镜折射后通过焦点 -->
                <line x1="400" y1="140" x2="400" y2="250" stroke="#ff9800" stroke-width="1.5" stroke-dasharray="5,3"/>
                <line x1="400" y1="250" x2="560" y2="310" stroke="#ff9800" stroke-width="1.5" stroke-dasharray="5,3"/>
                <!-- 从火焰顶端通过光心的光线 -->
                <line x1="105" y1="140" x2="400" y2="250" stroke="#4caf50" stroke-width="1.5" stroke-dasharray="5,3"/>
                <line x1="400" y1="250" x2="560" y2="310" stroke="#4caf50" stroke-width="1.5" stroke-dasharray="5,3"/>
                <!-- 像的示意 -->
                <line x1="560" y1="310" x2="560" y2="360" stroke="#c62828" stroke-width="2" stroke-dasharray="3,2"/>
            </g>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-prev-btn">◀ 上一步</button>
            <button id="scene1-next-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1: 凸透镜成像实验
        // 布局坐标表（实现对照依据）：
        // | 元素 | 位置 | 备注 |
        // | 主光轴 | (50,250)-(750,250) | y=250 |
        // | 左侧 2F | (160,250) | 标签 (152,270) |
        // | 左侧 F | (280,250) | 标签 (276,270) |
        // | O 点 | (400,250) | 标签 (396,270) |
        // | 右侧 F | (520,250) | 标签 (516,270) |
        // | 右侧 2F | (640,250) | 标签 (632,270) |
        // | 凸透镜 | cx=400,cy=250,rx=10,ry=100 | 标签 (360,110) |
        // | 蜡烛 | x=95~115, y=140~250 | 标签 (85,120) |
        // | 光屏 | x=555~575, y=130~180 | 标签 (545,110) |
        // | u>2f 标注 | (230,230) | |
        // | f<v<2f 标注 | (500,230) | |
        // | 成像性质 | (400,90) | 居中 |
        
        const TOTAL_STEPS = 5; // 步骤 0-4
        let currentStep = 0;
        
        // 获取 DOM 元素
        const prevBtn = document.getElementById('scene1-prev-btn');
        const nextBtn = document.getElementById('scene1-next-btn');
        
        // 元素分组（按步骤显示）
        const stepElements = {
            0: [
                'scene1-axis',
                'scene1-point-2f-left', 'scene1-point-f-left', 'scene1-point-o',
                'scene1-point-f-right', 'scene1-point-2f-right',
                'scene1-label-2f-left', 'scene1-label-f-left', 'scene1-label-o',
                'scene1-label-f-right', 'scene1-label-2f-right',
                'scene1-lens', 'scene1-label-lens'
            ],
            1: [
                'scene1-candle-group', 'scene1-label-u'
            ],
            2: [
                'scene1-screen-group', 'scene1-label-v'
            ],
            3: [
                'scene1-label-image', 'scene1-ray-group'
            ]
        };
        
        // 显示元素
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.display = '';
                el.style.opacity = '1';
            }
        }
        
        // 隐藏元素
        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.opacity = '0';
                setTimeout(() => {
                    el.style.display = 'none';
                }, 300);
            }
        }
        
        // 更新按钮状态
        function updateButtons() {
            prevBtn.disabled = (currentStep === 0);
            nextBtn.disabled = (currentStep === TOTAL_STEPS - 1);
        }
        
        // 更新显示
        function updateDisplay() {
            // 隐藏所有步骤元素
            for (let step = 0; step < TOTAL_STEPS; step++) {
                const elements = stepElements[step];
                if (elements) {
                    elements.forEach(id => hideElement(id));
                }
            }
            
            // 显示当前步骤及之前的所有元素
            for (let step = 0; step <= currentStep; step++) {
                const elements = stepElements[step];
                if (elements) {
                    elements.forEach(id => showElement(id));
                }
            }
            
            updateButtons();
        }
        
        // 下一步
        function nextStep() {
            if (currentStep < TOTAL_STEPS - 1) {
                currentStep++;
                updateDisplay();
            }
        }
        
        // 上一步
        function prevStep() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        }
        
        // 绑定事件
        nextBtn.addEventListener('click', nextStep);
        prevBtn.addEventListener('click', prevStep);
        
        // 初始化
        updateDisplay();
    })();
    </script>
</body>
</html>
