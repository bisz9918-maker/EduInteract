<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>凸透镜成像规律应用对比 - Scene 3</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Microsoft YaHei', sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-svg { width: 800px; height: 500px; }
        
        /* 状态组样式 */
        .state-group { display: none; opacity: 0; transition: opacity 0.3s ease; }
        .state-group.active { display: block; opacity: 1; }
        
        /* 按钮样式 */
        .btn { cursor: pointer; transition: fill 0.2s ease; }
        .btn:hover { fill: #4caf50 !important; }
        .btn.active { fill: #2e7d32 !important; }
        .btn:not(.active) { fill: #e0e0e0; }
        
        /* 火焰样式 */
        .flame-real { fill: #c62828; fill-opacity: 0.7; }
        .flame-virtual { fill: #1565c0; fill-opacity: 0.6; stroke: #1565c0; stroke-width: 2; stroke-dasharray: 4,4; }
        
        /* 文字样式 */
        .label-text { font-size: 14px; fill: #000000; }
        .btn-text { font-size: 14px; fill: #000000; }
        .point-label { font-size: 12px; fill: #000000; }
        
        /* 图标区样式 */
        .icon-box { fill: #f5f5f5; stroke: #bdbdbd; stroke-width: 1; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg id="scene3-svg" width="800" height="500">
            <!-- ==================== 固定元素 ==================== -->
            <!-- 主光轴 -->
            <line id="scene3-axis" x1="100" y1="250" x2="700" y2="250" stroke="#000000" stroke-width="2"/>
            
            <!-- 凸透镜 -->
            <ellipse id="scene3-lens" cx="400" cy="250" rx="10" ry="50" fill="none" stroke="#2e7d32" stroke-width="2"/>
            
            <!-- 光心 O -->
            <circle id="scene3-point-O" cx="400" cy="250" r="4" fill="#000000"/>
            <text id="scene3-label-O" x="400" y="272" text-anchor="middle" class="point-label">O</text>
            
            <!-- 左侧焦点 F -->
            <circle id="scene3-point-F-left" cx="300" cy="250" r="4" fill="#000000"/>
            <text id="scene3-label-F-left" x="300" y="272" text-anchor="middle" class="point-label">F</text>
            
            <!-- 右侧焦点 F -->
            <circle id="scene3-point-F-right" cx="500" cy="250" r="4" fill="#000000"/>
            <text id="scene3-label-F-right" x="500" y="272" text-anchor="middle" class="point-label">F</text>
            
            <!-- 左侧二倍焦距 2F -->
            <circle id="scene3-point-2F-left" cx="200" cy="250" r="4" fill="#000000"/>
            <text id="scene3-label-2F-left" x="200" y="272" text-anchor="middle" class="point-label">2F</text>
            
            <!-- 右侧二倍焦距 2F -->
            <circle id="scene3-point-2F-right" cx="600" cy="250" r="4" fill="#000000"/>
            <text id="scene3-label-2F-right" x="600" y="272" text-anchor="middle" class="point-label">2F</text>
            
            <!-- ==================== 状态 1：照相机 (u>2f) ==================== -->
            <g id="scene3-state-1" class="state-group">
                <!-- 蜡烛 -->
                <rect id="scene3-candle-1" x="140" y="220" width="12" height="40" fill="#795548"/>
                <!-- 火焰 -->
                <path id="scene3-flame-1" d="M146 180 Q153 170 160 180 Q153 190 146 180 Z" class="flame-real"/>
                
                <!-- 光屏 -->
                <rect id="scene3-screen-1" x="540" y="200" width="8" height="60" fill="none" stroke="#000000" stroke-width="2"/>
                <line id="scene3-screen-stand-1" x1="544" y1="230" x2="544" y2="260" stroke="#000000" stroke-width="2"/>
                
                <!-- 倒立缩小实像 -->
                <path id="scene3-image-1" d="M560 240 Q567 220 574 240 Q567 250 560 240 Z" class="flame-real"/>
                
                <!-- 应用图标区 -->
                <rect id="scene3-icon-box-1" x="100" y="35" width="180" height="35" class="icon-box"/>
                <!-- 照相机简图 -->
                <rect x="120" y="45" width="35" height="18" fill="#424242"/>
                <circle cx="137.5" cy="54" r="6" fill="#9e9e9e"/>
                <rect x="160" y="47" width="18" height="14" fill="#616161"/>
                
                <!-- 状态文字 -->
                <text id="scene3-label-1-title" x="140" y="85" class="label-text">照相机 u>2f</text>
                <text id="scene3-label-1-desc" x="140" y="105" class="label-text">倒立缩小实像</text>
            </g>
            
            <!-- ==================== 状态 2：投影仪 (f<u<2f) ==================== -->
            <g id="scene3-state-2" class="state-group">
                <!-- 蜡烛 -->
                <rect id="scene3-candle-2" x="260" y="230" width="12" height="30" fill="#795548"/>
                <!-- 火焰 -->
                <path id="scene3-flame-2" d="M266 190 Q273 180 280 190 Q273 200 266 190 Z" class="flame-real"/>
                
                <!-- 光屏 -->
                <rect id="scene3-screen-2" x="620" y="180" width="8" height="80" fill="none" stroke="#000000" stroke-width="2"/>
                <line id="scene3-screen-stand-2" x1="624" y1="220" x2="624" y2="260" stroke="#000000" stroke-width="2"/>
                
                <!-- 倒立放大实像 -->
                <path id="scene3-image-2" d="M640 180 Q650 150 660 180 Q650 200 640 180 Z" class="flame-real"/>
                
                <!-- 应用图标区 -->
                <rect id="scene3-icon-box-2" x="310" y="35" width="180" height="35" class="icon-box"/>
                <!-- 投影仪简图 -->
                <rect x="330" y="48" width="30" height="14" fill="#1976d2"/>
                <rect x="335" y="43" width="20" height="4" fill="#424242"/>
                <polygon points="360,48 372,38 385,48" fill="#ff9800"/>
                
                <!-- 状态文字 -->
                <text id="scene3-label-2-title" x="350" y="85" class="label-text">投影仪 f<u<2f</text>
                <text id="scene3-label-2-desc" x="350" y="105" class="label-text">倒立放大实像</text>
            </g>
            
            <!-- ==================== 状态 3：放大镜 (u<f) ==================== -->
            <g id="scene3-state-3" class="state-group">
                <!-- 蜡烛 -->
                <rect id="scene3-candle-3" x="340" y="240" width="12" height="20" fill="#795548"/>
                <!-- 火焰 -->
                <path id="scene3-flame-3" d="M346 200 Q353 190 360 200 Q353 210 346 200 Z" class="flame-real"/>
                
                <!-- 虚像（在蜡烛同侧，正立放大） -->
                <path id="scene3-image-3" d="M460 170 Q470 140 480 170 Q470 190 460 170 Z" class="flame-virtual"/>
                
                <!-- 应用图标区 -->
                <rect id="scene3-icon-box-3" x="520" y="35" width="180" height="35" class="icon-box"/>
                <!-- 放大镜简图 -->
                <circle cx="560" cy="53" r="11" fill="none" stroke="#424242" stroke-width="2.5"/>
                <line x1="568" y1="61" x2="578" y2="71" stroke="#424242" stroke-width="2.5"/>
                
                <!-- 状态文字 -->
                <text id="scene3-label-3-title" x="560" y="85" class="label-text">放大镜 u<f</text>
                <text id="scene3-label-3-desc" x="560" y="105" class="label-text">正立放大虚像</text>
            </g>
            
            <!-- ==================== 控件区按钮 ==================== -->
            <!-- 按钮 1：照相机 -->
            <g id="scene3-btn-camera" class="btn" transform="translate(150, 448)">
                <rect x="0" y="0" width="130" height="32" rx="5" class="btn"/>
                <text x="65" y="21" text-anchor="middle" class="btn-text">照相机</text>
            </g>
            
            <!-- 按钮 2：投影仪 -->
            <g id="scene3-btn-projector" class="btn" transform="translate(335, 448)">
                <rect x="0" y="0" width="130" height="32" rx="5" class="btn"/>
                <text x="65" y="21" text-anchor="middle" class="btn-text">投影仪</text>
            </g>
            
            <!-- 按钮 3：放大镜 -->
            <g id="scene3-btn-magnifier" class="btn" transform="translate(520, 448)">
                <rect x="0" y="0" width="130" height="32" rx="5" class="btn"/>
                <text x="65" y="21" text-anchor="middle" class="btn-text">放大镜</text>
            </g>
        </svg>
    </div>
    
    <script>
    (function() {
        // Scene 3 实现 - 凸透镜成像规律应用对比
        
        let currentState = 1;
        
        // 状态映射：状态号 -> 按钮 ID 后缀
        function getStateBtnId(state) {
            return state === 1 ? 'camera' : state === 2 ? 'projector' : 'magnifier';
        }
        
        // 切换状态函数
        function switchState(newState) {
            if (currentState === newState) return;
            
            // 隐藏所有状态组
            document.querySelectorAll('.state-group').forEach(function(g) {
                g.classList.remove('active');
            });
            
            // 显示新状态组
            var stateGroup = document.getElementById('scene3-state-' + newState);
            if (stateGroup) {
                stateGroup.classList.add('active');
            }
            
            // 更新按钮样式
            document.querySelectorAll('.btn').forEach(function(btn) {
                btn.classList.remove('active');
            });
            
            var activeBtn = document.getElementById('scene3-btn-' + getStateBtnId(newState));
            if (activeBtn) {
                activeBtn.classList.add('active');
            }
            
            currentState = newState;
        }
        
        // 初始化：显示状态 1（照相机）
        function init() {
            // 显示状态 1
            var state1 = document.getElementById('scene3-state-1');
            if (state1) {
                state1.classList.add('active');
            }
            
            // 按钮 1 高亮
            var btnCamera = document.getElementById('scene3-btn-camera');
            if (btnCamera) {
                btnCamera.classList.add('active');
            }
            
            // 绑定按钮事件
            var btnCameraEl = document.getElementById('scene3-btn-camera');
            var btnProjectorEl = document.getElementById('scene3-btn-projector');
            var btnMagnifierEl = document.getElementById('scene3-btn-magnifier');
            
            if (btnCameraEl) {
                btnCameraEl.addEventListener('click', function() {
                    switchState(1);
                });
            }
            
            if (btnProjectorEl) {
                btnProjectorEl.addEventListener('click', function() {
                    switchState(2);
                });
            }
            
            if (btnMagnifierEl) {
                btnMagnifierEl.addEventListener('click', function() {
                    switchState(3);
                });
            }
        }
        
        // 页面加载完成后初始化
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>
</body>
</html>
