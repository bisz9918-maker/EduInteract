<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正三棱柱晶体结构 - Scene 1</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Microsoft YaHei', sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene1-btn { width: 100px; height: 30px; border: none; border-radius: 4px; font-size: 14px; cursor: pointer; transition: all 0.2s; }
        .scene1-btn.active { background: #1565c0; color: white; }
        .scene1-btn.inactive { background: #e0e0e0; color: #999; cursor: not-allowed; }
        .scene1-legend { position: absolute; bottom: 45px; left: 20px; display: flex; gap: 30px; font-size: 14px; }
        .scene1-legend-item { display: flex; align-items: center; gap: 6px; }
        .scene1-legend-dot { width: 12px; height: 12px; border-radius: 50%; }
        .scene1-legend-circle { width: 12px; height: 12px; border: 2px solid #000000; border-radius: 50%; background: transparent; }
        .scene1-stat-text { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); font-size: 16px; font-weight: bold; color: #333; display: none; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <!-- 统计文字（步骤 4 显示） -->
        <div id="scene1-stat-text" class="scene1-stat-text">A: 6 个（顶点） B: 9 个（棱中点） C: 1 个（体内）</div>
        
        <!-- SVG 图示区：固定 800×500px -->
        <svg width="800" height="500" id="scene1-svg">
            <!-- 上底面三角形 -->
            <line x1="340" y1="140" x2="460" y2="140" stroke="#888880" stroke-width="2" stroke-dasharray="5,5" id="scene1-line-top-back"/>
            <line x1="340" y1="140" x2="400" y2="100" stroke="#000000" stroke-width="2" id="scene1-line-top-left"/>
            <line x1="460" y1="140" x2="400" y2="100" stroke="#000000" stroke-width="2" id="scene1-line-top-right"/>
            
            <!-- 下底面三角形 -->
            <line x1="320" y1="280" x2="480" y2="280" stroke="#888880" stroke-width="2" stroke-dasharray="5,5" id="scene1-line-bottom-back"/>
            <line x1="320" y1="280" x2="400" y2="340" stroke="#000000" stroke-width="2" id="scene1-line-bottom-left"/>
            <line x1="480" y1="280" x2="400" y2="340" stroke="#000000" stroke-width="2" id="scene1-line-bottom-right"/>
            
            <!-- 3 条侧棱 -->
            <line x1="340" y1="140" x2="320" y2="280" stroke="#000000" stroke-width="2" id="scene1-line-side-left"/>
            <line x1="460" y1="140" x2="480" y2="280" stroke="#000000" stroke-width="2" id="scene1-line-side-right"/>
            <line x1="400" y1="100" x2="400" y2="340" stroke="#000000" stroke-width="2" id="scene1-line-side-front"/>
            
            <!-- A 微粒（6 个顶点，r=8） -->
            <circle cx="400" cy="100" r="8" fill="#000000" data-type="A" id="scene1-mic-a1"/>
            <circle cx="340" cy="140" r="8" fill="#000000" data-type="A" id="scene1-mic-a2"/>
            <circle cx="460" cy="140" r="8" fill="#000000" data-type="A" id="scene1-mic-a3"/>
            <circle cx="320" cy="280" r="8" fill="#000000" data-type="A" id="scene1-mic-a4"/>
            <circle cx="480" cy="280" r="8" fill="#000000" data-type="A" id="scene1-mic-a5"/>
            <circle cx="400" cy="340" r="8" fill="#000000" data-type="A" id="scene1-mic-a6"/>
            
            <!-- B 微粒（9 个棱中点，r=4） -->
            <circle cx="400" cy="140" r="4" fill="#000000" data-type="B" id="scene1-mic-b1"/>
            <circle cx="370" cy="120" r="4" fill="#000000" data-type="B" id="scene1-mic-b2"/>
            <circle cx="430" cy="120" r="4" fill="#000000" data-type="B" id="scene1-mic-b3"/>
            <circle cx="360" cy="210" r="4" fill="#000000" data-type="B" id="scene1-mic-b4"/>
            <circle cx="440" cy="210" r="4" fill="#000000" data-type="B" id="scene1-mic-b5"/>
            <circle cx="400" cy="220" r="4" fill="#000000" data-type="B" id="scene1-mic-b6"/>
            <circle cx="360" cy="310" r="4" fill="#000000" data-type="B" id="scene1-mic-b7"/>
            <circle cx="440" cy="310" r="4" fill="#000000" data-type="B" id="scene1-mic-b8"/>
            <circle cx="400" cy="280" r="4" fill="#000000" data-type="B" id="scene1-mic-b9"/>
            
            <!-- C 微粒（1 个体内中心，空心圆 r=6） -->
            <circle cx="400" cy="220" r="6" fill="none" stroke="#000000" stroke-width="2" data-type="C" id="scene1-mic-c1"/>
            
            <!-- A 微粒标签（步骤 1 显示） -->
            <text x="400" y="85" font-size="14" fill="#000000" text-anchor="middle" id="scene1-label-a1" style="display:none;">A</text>
            <text x="325" y="125" font-size="14" fill="#000000" text-anchor="middle" id="scene1-label-a2" style="display:none;">A</text>
            <text x="475" y="125" font-size="14" fill="#000000" text-anchor="middle" id="scene1-label-a3" style="display:none;">A</text>
            <text x="305" y="280" font-size="14" fill="#000000" text-anchor="middle" id="scene1-label-a4" style="display:none;">A</text>
            <text x="495" y="280" font-size="14" fill="#000000" text-anchor="middle" id="scene1-label-a5" style="display:none;">A</text>
            <text x="400" y="355" font-size="14" fill="#000000" text-anchor="middle" id="scene1-label-a6" style="display:none;">A</text>
            
            <!-- B 微粒标签（步骤 2 显示） -->
            <text x="400" y="128" font-size="12" fill="#000000" text-anchor="middle" id="scene1-label-b1" style="display:none;">B</text>
            <text x="355" y="110" font-size="12" fill="#000000" text-anchor="middle" id="scene1-label-b2" style="display:none;">B</text>
            <text x="445" y="110" font-size="12" fill="#000000" text-anchor="middle" id="scene1-label-b3" style="display:none;">B</text>
            <text x="345" y="210" font-size="12" fill="#000000" text-anchor="middle" id="scene1-label-b4" style="display:none;">B</text>
            <text x="455" y="210" font-size="12" fill="#000000" text-anchor="middle" id="scene1-label-b5" style="display:none;">B</text>
            <text x="400" y="208" font-size="12" fill="#000000" text-anchor="middle" id="scene1-label-b6" style="display:none;">B</text>
            <text x="360" y="322" font-size="12" fill="#000000" text-anchor="middle" id="scene1-label-b7" style="display:none;">B</text>
            <text x="440" y="322" font-size="12" fill="#000000" text-anchor="middle" id="scene1-label-b8" style="display:none;">B</text>
            <text x="400" y="292" font-size="12" fill="#000000" text-anchor="middle" id="scene1-label-b9" style="display:none;">B</text>
            
            <!-- C 微粒标签（步骤 3 显示） -->
            <text x="415" y="225" font-size="14" fill="#000000" id="scene1-label-c1" style="display:none;">C</text>
        </svg>
        
        <!-- 图例 -->
        <div class="scene1-legend">
            <div class="scene1-legend-item">
                <div class="scene1-legend-dot" style="background: #000000;"></div>
                <span>A</span>
            </div>
            <div class="scene1-legend-item">
                <div class="scene1-legend-dot" style="background: #000000; width: 8px; height: 8px;"></div>
                <span>B</span>
            </div>
            <div class="scene1-legend-item">
                <div class="scene1-legend-circle"></div>
                <span>C</span>
            </div>
        </div>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn inactive">◀ 上一步</button>
            <button id="scene1-btn-next" class="scene1-btn active">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现
        // 布局坐标表（对照实现）：
        // 上底面后棱：(340,140)-(460,140) 虚线
        // 上底面左棱：(340,140)-(400,100) 实线
        // 上底面右棱：(460,140)-(400,100) 实线
        // 下底面前左棱：(320,280)-(400,340) 实线
        // 下底面前右棱：(480,280)-(400,340) 实线
        // 下底面后棱：(320,280)-(480,280) 虚线
        // 左侧棱：(340,140)-(320,280) 实线
        // 右侧棱：(460,140)-(480,280) 实线
        // 前侧棱：(400,100)-(400,340) 实线
        // A 微粒：6 个顶点 (400,100), (340,140), (460,140), (320,280), (480,280), (400,340) r=8
        // B 微粒：9 个棱中点 r=4
        // C 微粒：1 个体内中心 (400,220) 空心圆 r=6
        
        const scene1 = {
            currentStep: 0,
            totalSteps: 4,
            
            // 获取所有元素
            elements: {
                svg: document.getElementById('scene1-svg'),
                btnPrev: document.getElementById('scene1-btn-prev'),
                btnNext: document.getElementById('scene1-btn-next'),
                statText: document.getElementById('scene1-stat-text'),
                // A 微粒
                micA: [
                    document.getElementById('scene1-mic-a1'),
                    document.getElementById('scene1-mic-a2'),
                    document.getElementById('scene1-mic-a3'),
                    document.getElementById('scene1-mic-a4'),
                    document.getElementById('scene1-mic-a5'),
                    document.getElementById('scene1-mic-a6')
                ],
                // B 微粒
                micB: [
                    document.getElementById('scene1-mic-b1'),
                    document.getElementById('scene1-mic-b2'),
                    document.getElementById('scene1-mic-b3'),
                    document.getElementById('scene1-mic-b4'),
                    document.getElementById('scene1-mic-b5'),
                    document.getElementById('scene1-mic-b6'),
                    document.getElementById('scene1-mic-b7'),
                    document.getElementById('scene1-mic-b8'),
                    document.getElementById('scene1-mic-b9')
                ],
                // C 微粒
                micC: [document.getElementById('scene1-mic-c1')],
                // A 标签
                labelA: [
                    document.getElementById('scene1-label-a1'),
                    document.getElementById('scene1-label-a2'),
                    document.getElementById('scene1-label-a3'),
                    document.getElementById('scene1-label-a4'),
                    document.getElementById('scene1-label-a5'),
                    document.getElementById('scene1-label-a6')
                ],
                // B 标签
                labelB: [
                    document.getElementById('scene1-label-b1'),
                    document.getElementById('scene1-label-b2'),
                    document.getElementById('scene1-label-b3'),
                    document.getElementById('scene1-label-b4'),
                    document.getElementById('scene1-label-b5'),
                    document.getElementById('scene1-label-b6'),
                    document.getElementById('scene1-label-b7'),
                    document.getElementById('scene1-label-b8'),
                    document.getElementById('scene1-label-b9')
                ],
                // C 标签
                labelC: [document.getElementById('scene1-label-c1')]
            },
            
            // 工具函数：显示元素
            show: function(el) {
                if (el) {
                    el.style.display = 'block';
                    el.style.opacity = '1';
                }
            },
            
            // 工具函数：隐藏元素
            hide: function(el) {
                if (el) {
                    el.style.display = 'none';
                    el.style.opacity = '0';
                }
            },
            
            // 工具函数：高亮微粒（蓝色）
            highlight: function(mic) {
                if (mic) {
                    if (mic.getAttribute('data-type') === 'C') {
                        mic.setAttribute('stroke', '#1565c0');
                        mic.setAttribute('fill', 'rgba(21, 101, 192, 0.2)');
                    } else {
                        mic.setAttribute('fill', '#1565c0');
                    }
                }
            },
            
            // 工具函数：恢复微粒（黑色）
            restore: function(mic) {
                if (mic) {
                    if (mic.getAttribute('data-type') === 'C') {
                        mic.setAttribute('stroke', '#000000');
                        mic.setAttribute('fill', 'none');
                    } else {
                        mic.setAttribute('fill', '#000000');
                    }
                }
            },
            
            // 更新场景显示
            updateScene: function() {
                const el = this.elements;
                
                // 步骤 0：仅显示线框
                if (this.currentStep === 0) {
                    // 隐藏所有微粒和标签
                    el.micA.forEach(m => this.hide(m));
                    el.micB.forEach(m => this.hide(m));
                    el.micC.forEach(m => this.hide(m));
                    el.labelA.forEach(l => this.hide(l));
                    el.labelB.forEach(l => this.hide(l));
                    el.labelC.forEach(l => this.hide(l));
                    this.hide(el.statText);
                    
                    // 按钮状态
                    el.btnPrev.className = 'scene1-btn inactive';
                    el.btnNext.className = 'scene1-btn active';
                }
                
                // 步骤 1：高亮 A 微粒（顶点）
                else if (this.currentStep === 1) {
                    // 隐藏 B、C 微粒和标签
                    el.micB.forEach(m => this.hide(m));
                    el.micC.forEach(m => this.hide(m));
                    el.labelB.forEach(l => this.hide(l));
                    el.labelC.forEach(l => this.hide(l));
                    this.hide(el.statText);
                    
                    // 显示并高亮 A 微粒和标签
                    el.micA.forEach(m => {
                        this.show(m);
                        this.highlight(m);
                    });
                    el.labelA.forEach(l => this.show(l));
                    
                    // 按钮状态
                    el.btnPrev.className = 'scene1-btn inactive';
                    el.btnNext.className = 'scene1-btn active';
                }
                
                // 步骤 2：高亮 B 微粒（棱中点），A 恢复黑色
                else if (this.currentStep === 2) {
                    // 隐藏 C 微粒和标签
                    el.micC.forEach(m => this.hide(m));
                    el.labelC.forEach(l => this.hide(l));
                    this.hide(el.statText);
                    
                    // 显示并高亮 B 微粒和标签，A 恢复黑色
                    el.micB.forEach(m => {
                        this.show(m);
                        this.highlight(m);
                    });
                    el.labelB.forEach(l => this.show(l));
                    el.micA.forEach(m => {
                        this.show(m);
                        this.restore(m);
                    });
                    el.labelA.forEach(l => this.show(l));
                    
                    // 按钮状态
                    el.btnPrev.className = 'scene1-btn active';
                    el.btnNext.className = 'scene1-btn active';
                }
                
                // 步骤 3：高亮 C 微粒（体内），A、B 恢复黑色
                else if (this.currentStep === 3) {
                    this.hide(el.statText);
                    
                    // 显示并高亮 C 微粒和标签，A、B 恢复黑色
                    el.micC.forEach(m => {
                        this.show(m);
                        this.highlight(m);
                    });
                    el.labelC.forEach(l => this.show(l));
                    el.micA.forEach(m => {
                        this.show(m);
                        this.restore(m);
                    });
                    el.labelA.forEach(l => this.show(l));
                    el.micB.forEach(m => {
                        this.show(m);
                        this.restore(m);
                    });
                    el.labelB.forEach(l => this.show(l));
                    
                    // 按钮状态
                    el.btnPrev.className = 'scene1-btn active';
                    el.btnNext.className = 'scene1-btn active';
                }
                
                // 步骤 4：完整显示所有微粒（黑色），显示统计文字
                else if (this.currentStep === 4) {
                    // 显示所有微粒（黑色）和标签
                    el.micA.forEach(m => {
                        this.show(m);
                        this.restore(m);
                    });
                    el.micB.forEach(m => {
                        this.show(m);
                        this.restore(m);
                    });
                    el.micC.forEach(m => {
                        this.show(m);
                        this.restore(m);
                    });
                    el.labelA.forEach(l => this.show(l));
                    el.labelB.forEach(l => this.show(l));
                    el.labelC.forEach(l => this.show(l));
                    this.show(el.statText);
                    
                    // 按钮状态
                    el.btnPrev.className = 'scene1-btn active';
                    el.btnNext.className = 'scene1-btn inactive';
                }
            },
            
            // 下一步
            nextStep: function() {
                if (this.currentStep < this.totalSteps) {
                    this.currentStep++;
                    this.updateScene();
                }
            },
            
            // 上一步
            prevStep: function() {
                if (this.currentStep > 0) {
                    this.currentStep--;
                    this.updateScene();
                }
            },
            
            // 初始化
            init: function() {
                // 绑定按钮事件
                el.btnPrev.addEventListener('click', () => this.prevStep());
                el.btnNext.addEventListener('click', () => this.nextStep());
                
                // 初始显示步骤 0
                this.updateScene();
            }
        };
        
        // 启动场景
        scene1.init();
    })();
    </script>
</body>
</html>
