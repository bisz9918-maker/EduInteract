<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>偏二甲肼 - 四氧化二氮燃料电池</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 20px; z-index: 10; }
        .scene1-btn { padding: 8px 20px; font-size: 14px; border: 2px solid #333; border-radius: 6px; background: #fff; cursor: pointer; transition: all 0.2s; }
        .scene1-btn:hover { background: #f0f0f0; }
        .scene1-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 14px; color: #666; min-width: 80px; text-align: center; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义 -->
            <defs>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
                </marker>
                <marker id="scene1-arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0"/>
                </marker>
            </defs>

            <!-- 基础装置层 -->
            <g id="scene1-base">
                <!-- 电极 A -->
                <rect id="scene1-electrode-A" x="280" y="150" width="60" height="230" fill="#9e9e9e" fill-opacity="0.3" stroke="#000" stroke-width="2"/>
                <!-- 电极 B -->
                <rect id="scene1-electrode-B" x="460" y="150" width="60" height="230" fill="#9e9e9e" fill-opacity="0.3" stroke="#000" stroke-width="2"/>
                
                <!-- 底部横线 -->
                <line x1="250" y1="380" x2="550" y2="380" stroke="#000" stroke-width="2"/>
                <!-- 顶部横线 -->
                <line x1="250" y1="150" x2="550" y2="150" stroke="#000" stroke-width="2"/>
                
                <!-- 导线左竖线 -->
                <line x1="250" y1="150" x2="250" y2="100" stroke="#000" stroke-width="2"/>
                <!-- 导线右竖线 -->
                <line x1="550" y1="150" x2="550" y2="100" stroke="#000" stroke-width="2"/>
                
                <!-- 灯泡底座 -->
                <rect x="385" y="70" width="30" height="30" fill="#9e9e9e" stroke="#000" stroke-width="2"/>
                <!-- 灯泡玻璃 -->
                <ellipse cx="400" cy="40" rx="20" ry="17.5" fill="#fff" stroke="#000" stroke-width="2"/>
                <!-- 灯丝 -->
                <polyline points="395,50 400,50 400,35 405,35 405,50 400,50" stroke="#000" stroke-width="1.5" fill="none"/>
                
                <!-- 入口 a 箭头 -->
                <line id="scene1-port-a-arrow" x1="180" y1="350" x2="230" y2="350" stroke="#000" stroke-width="2" marker-end="url(#scene1-arrowhead)"/>
                <!-- 入口 a 标签 -->
                <text id="scene1-port-a-label" x="190" y="375" font-size="16" fill="#000">a</text>
                
                <!-- 入口 b 箭头 -->
                <line id="scene1-port-b-arrow" x1="570" y1="350" x2="620" y2="350" stroke="#000" stroke-width="2" marker-end="url(#scene1-arrowhead)"/>
                <!-- 入口 b 标签 -->
                <text id="scene1-port-b-label" x="580" y="375" font-size="16" fill="#000">b</text>
                
                <!-- 出口 c 箭头 -->
                <line id="scene1-port-c-arrow" x1="230" y1="170" x2="180" y2="170" stroke="#000" stroke-width="2" marker-start="url(#scene1-arrowhead)"/>
                <!-- 出口 c 标签 -->
                <text id="scene1-port-c-label" x="190" y="165" font-size="16" fill="#000">c</text>
                
                <!-- 出口 d 箭头 -->
                <line id="scene1-port-d-arrow" x1="570" y1="170" x2="620" y2="170" stroke="#000" stroke-width="2" marker-start="url(#scene1-arrowhead)"/>
                <!-- 出口 d 标签 -->
                <text id="scene1-port-d-label" x="580" y="165" font-size="16" fill="#000">d</text>
                
                <!-- A 极引线 -->
                <polyline points="240,265 260,265 260,200 280,200" stroke="#888" stroke-width="1" fill="none" stroke-dasharray="3,3"/>
                <!-- A 标签 -->
                <text id="scene1-label-A" x="220" y="270" font-size="16" fill="#000">A</text>
                
                <!-- B 极引线 -->
                <polyline points="560,265 540,265 540,200 520,200" stroke="#888" stroke-width="1" fill="none" stroke-dasharray="3,3"/>
                <!-- B 标签 -->
                <text id="scene1-label-B" x="580" y="270" font-size="16" fill="#000">B</text>
                
                <!-- H₂SO₄引线：从两电极之间指向右侧 -->
                <line x1="400" y1="320" x2="530" y2="320" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
                <!-- H₂SO₄标签：移到电极 B 右侧 -->
                <text id="scene1-label-H2SO4" x="535" y="325" font-size="16" fill="#000">H₂SO₄</text>
            </g>

            <!-- 电子流向层（步骤 1 高亮） -->
            <g id="scene1-electrons" style="display: none;">
                <!-- 电子箭头左段 -->
                <line id="scene1-electron-left" x1="300" y1="130" x2="270" y2="130" stroke="#1565c0" stroke-width="3" marker-end="url(#scene1-arrowhead-blue)"/>
                <!-- 电子箭头右段 -->
                <line id="scene1-electron-right" x1="530" y1="130" x2="500" y2="130" stroke="#1565c0" stroke-width="3" marker-end="url(#scene1-arrowhead-blue)"/>
                <!-- e⁻标签左 -->
                <text id="scene1-label-e-left" x="285" y="120" font-size="14" fill="#1565c0">e⁻</text>
                <!-- e⁻标签右 -->
                <text id="scene1-label-e-right" x="515" y="120" font-size="14" fill="#1565c0">e⁻</text>
                <!-- 电子流向标注 -->
                <text id="scene1-electron-flow-label" x="400" y="100" font-size="14" fill="#1565c0" text-anchor="middle" style="display: none;">电子从 B→A</text>
                <!-- 提示文字 -->
                <text id="scene1-hint-text" x="400" y="480" font-size="12" fill="#666" text-anchor="middle" style="display: none;">电子流出极为负极</text>
            </g>

            <!-- 正负极标注层（步骤 2 显示） -->
            <g id="scene1-polarity" style="display: none;">
                <!-- 负极标注 -->
                <text id="scene1-annotation-negative" x="460" y="100" font-size="14" fill="#c62828" text-anchor="middle" font-weight="bold">负极</text>
                <!-- 正极标注 -->
                <text id="scene1-annotation-positive" x="280" y="100" font-size="14" fill="#2e7d32" text-anchor="middle" font-weight="bold">正极</text>
            </g>

            <!-- 反应物标注层（步骤 3 显示） -->
            <g id="scene1-reactants" style="display: none;">
                <!-- 燃料标注 -->
                <text id="scene1-annotation-fuel" x="580" y="330" font-size="12" fill="#1565c0" text-anchor="middle">通入燃料 C₂H₈N₂</text>
                <!-- 氧化剂标注 -->
                <text id="scene1-annotation-oxidizer" x="180" y="330" font-size="12" fill="#c62828" text-anchor="middle">通入氧化剂 N₂O₄</text>
            </g>

            <!-- 电极反应式层（步骤 4 显示） -->
            <g id="scene1-reactions" style="display: none;">
                <!-- B 极反应式 -->
                <text id="scene1-reaction-B" x="480" y="420" font-size="12" fill="#000" text-anchor="middle">C₂H₈N₂ - 16e⁻ + 4H₂O →</text>
                <text id="scene1-reaction-B2" x="480" y="438" font-size="12" fill="#000" text-anchor="middle">2CO₂ + N₂ + 16H⁺</text>
                <!-- A 极反应式 -->
                <text id="scene1-reaction-A" x="260" y="420" font-size="12" fill="#000" text-anchor="middle">N₂O₄ + 8H⁺ + 8e⁻ →</text>
                <text id="scene1-reaction-A2" x="260" y="438" font-size="12" fill="#000" text-anchor="middle">N₂ + 4H₂O</text>
                <!-- 出口产物标注 -->
                <text id="scene1-annotation-c" x="190" y="150" font-size="10" fill="#888">排出产物</text>
                <text id="scene1-annotation-d" x="580" y="150" font-size="10" fill="#888">排出产物</text>
            </g>

            <!-- 结论层（步骤 5 显示） -->
            <g id="scene1-conclusion" style="display: none;">
                <!-- 正确选项框 -->
                <rect id="scene1-correct-box" x="320" y="430" width="160" height="30" fill="#fff" stroke="#2e7d32" stroke-width="2" rx="5"/>
                <!-- 正确选项文本 -->
                <text id="scene1-correct-text" x="400" y="450" font-size="14" fill="#2e7d32" text-anchor="middle" font-weight="bold">正确选项：B</text>
            </g>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/6</span>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // 状态变量
        let currentStep = 0;
        const totalSteps = 6;

        // DOM 元素引用
        const els = {
            prevBtn: document.getElementById('scene1-btn-prev'),
            nextBtn: document.getElementById('scene1-btn-next'),
            indicator: document.getElementById('scene1-step-indicator'),
            // 基础层
            electrodeA: document.getElementById('scene1-electrode-A'),
            electrodeB: document.getElementById('scene1-electrode-B'),
            portAArrow: document.getElementById('scene1-port-a-arrow'),
            portBArrow: document.getElementById('scene1-port-b-arrow'),
            // 电子流向层
            electrons: document.getElementById('scene1-electrons'),
            electronLeft: document.getElementById('scene1-electron-left'),
            electronRight: document.getElementById('scene1-electron-right'),
            electronFlowLabel: document.getElementById('scene1-electron-flow-label'),
            hintText: document.getElementById('scene1-hint-text'),
            // 正负极层
            polarity: document.getElementById('scene1-polarity'),
            annotationNegative: document.getElementById('scene1-annotation-negative'),
            annotationPositive: document.getElementById('scene1-annotation-positive'),
            // 反应物层
            reactants: document.getElementById('scene1-reactants'),
            annotationFuel: document.getElementById('scene1-annotation-fuel'),
            annotationOxidizer: document.getElementById('scene1-annotation-oxidizer'),
            // 反应式层
            reactions: document.getElementById('scene1-reactions'),
            // 结论层
            conclusion: document.getElementById('scene1-conclusion'),
            correctBox: document.getElementById('scene1-correct-box'),
            correctText: document.getElementById('scene1-correct-text')
        };

        // 工具函数：显示元素
        function show(el) {
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '0';
                requestAnimationFrame(() => {
                    el.style.transition = 'opacity 0.3s';
                    el.style.opacity = '1';
                });
            }
        }

        // 工具函数：隐藏元素
        function hide(el) {
            if (el) {
                el.style.opacity = '0';
                setTimeout(() => {
                    el.style.display = 'none';
                }, 300);
            }
        }

        // 更新步骤显示
        function updateStep() {
            // 更新指示器
            els.indicator.textContent = `步骤 ${currentStep + 1}/${totalSteps}`;
            
            // 更新按钮状态
            els.prevBtn.disabled = currentStep === 0;
            els.nextBtn.disabled = currentStep === totalSteps - 1;

            // 重置所有层
            hide(els.electrons);
            hide(els.polarity);
            hide(els.reactants);
            hide(els.reactions);
            hide(els.conclusion);

            // 重置电极样式
            els.electrodeA.style.stroke = '#000';
            els.electrodeA.style.strokeWidth = '2';
            els.electrodeB.style.stroke = '#000';
            els.electrodeB.style.strokeWidth = '2';

            // 根据步骤显示对应内容
            switch(currentStep) {
                case 0:
                    // 初始状态：仅显示基础装置
                    break;
                    
                case 1:
                    // 步骤 1：高亮电子流向
                    show(els.electrons);
                    els.electronFlowLabel.style.display = 'block';
                    els.hintText.style.display = 'block';
                    break;
                    
                case 2:
                    // 步骤 2：显示正负极标注
                    show(els.polarity);
                    els.electrodeB.style.stroke = '#c62828';
                    els.electrodeB.style.strokeWidth = '3';
                    els.electrodeA.style.stroke = '#2e7d32';
                    els.electrodeA.style.strokeWidth = '3';
                    break;
                    
                case 3:
                    // 步骤 3：显示反应物标注
                    show(els.reactants);
                    els.portAArrow.style.strokeWidth = '3';
                    els.portBArrow.style.strokeWidth = '3';
                    break;
                    
                case 4:
                    // 步骤 4：显示电极反应式
                    show(els.reactions);
                    break;
                    
                case 5:
                    // 步骤 5：显示结论
                    show(els.conclusion);
                    els.electrodeB.style.stroke = '#c62828';
                    els.electrodeB.style.strokeWidth = '3';
                    els.portBArrow.style.strokeWidth = '3';
                    break;
            }
        }

        // 事件绑定
        els.prevBtn.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });

        els.nextBtn.addEventListener('click', () => {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateStep();
            }
        });

        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
