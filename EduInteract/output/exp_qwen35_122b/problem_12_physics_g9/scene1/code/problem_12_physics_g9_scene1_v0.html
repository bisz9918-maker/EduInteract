<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>弹簧测力计受力分析 - 牛顿第三定律</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Microsoft YaHei', sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 16px; z-index: 10; }
        .scene1-btn { padding: 8px 20px; font-size: 16px; background: #1976d2; color: white; border: none; border-radius: 4px; cursor: pointer; transition: background 0.2s; }
        .scene1-btn:hover { background: #1565c0; }
        .scene1-btn:disabled { background: #bdbdbd; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 18px; font-weight: bold; color: #333; min-width: 100px; text-align: center; }
        .scene1-fade-in { animation: scene1-fadeIn 0.3s ease-in-out; }
        @keyframes scene1-fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 测力计 A 外壳 -->
            <rect id="scene1-meter-A" x="150" y="200" width="200" height="100" fill="#e3f2fd" stroke="#000000" stroke-width="2"/>
            <!-- 测力计 B 外壳 -->
            <rect id="scene1-meter-B" x="450" y="200" width="200" height="100" fill="#e3f2fd" stroke="#000000" stroke-width="2"/>
            
            <!-- 测力计 A 弹簧（锯齿折线） -->
            <polyline id="scene1-spring-A" points="170,250 190,240 210,260 230,240 250,260 270,240 290,260 310,240 330,250" fill="none" stroke="#000000" stroke-width="1.5"/>
            <!-- 测力计 B 弹簧（锯齿折线） -->
            <polyline id="scene1-spring-B" points="470,250 490,240 510,260 530,240 550,260 570,240 590,260 610,240 630,250" fill="none" stroke="#000000" stroke-width="1.5"/>
            
            <!-- 测力计 A 左圆环 -->
            <ellipse id="scene1-ring-A-left" cx="140" cy="250" rx="10" ry="5" fill="none" stroke="#000000" stroke-width="1.5"/>
            <!-- 测力计 B 右圆环 -->
            <ellipse id="scene1-ring-B-right" cx="660" cy="250" rx="10" ry="5" fill="none" stroke="#000000" stroke-width="1.5"/>
            
            <!-- 测力计 A 右挂钩 -->
            <path id="scene1-hook-A" d="M 350 250 Q 365 235 380 250" fill="none" stroke="#000000" stroke-width="2"/>
            <!-- 测力计 B 左挂钩 -->
            <path id="scene1-hook-B" d="M 450 250 Q 435 235 420 250" fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 挂钩连接处高亮（步骤 1 显示） -->
            <circle id="scene1-highlight-hook" cx="400" cy="250" r="25" fill="none" stroke="#ffeb3b" stroke-width="4" opacity="0" filter="drop-shadow(0 0 8px #ffeb3b)"/>
            
            <!-- 拉力箭头 F_手左（蓝色，向左） -->
            <g id="scene1-arrow-left">
                <line x1="130" y1="250" x2="80" y2="250" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrowhead-blue)"/>
            </g>
            <!-- 拉力箭头 F_手右（蓝色，向右） -->
            <g id="scene1-arrow-right">
                <line x1="670" y1="250" x2="720" y2="250" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrowhead-blue)"/>
            </g>
            
            <!-- 相互作用力 F_BA（红色，向左，B 对 A） -->
            <g id="scene1-arrow-F_BA" opacity="0">
                <line x1="390" y1="230" x2="360" y2="230" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrowhead-red)"/>
            </g>
            <!-- 相互作用力 F_AB（红色，向右，A 对 B） -->
            <g id="scene1-arrow-F_AB" opacity="0">
                <line x1="410" y1="270" x2="440" y2="270" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrowhead-red)"/>
            </g>
            
            <!-- 标签 "A" -->
            <text id="scene1-label-A" x="250" y="170" text-anchor="middle" font-size="20" font-weight="bold" fill="#000000">A</text>
            <!-- 标签 "B" -->
            <text id="scene1-label-B" x="550" y="170" text-anchor="middle" font-size="20" font-weight="bold" fill="#000000">B</text>
            <!-- 标签 "甲" -->
            <text id="scene1-label-Jia" x="250" y="340" text-anchor="middle" font-size="20" fill="#000000">甲</text>
            <!-- 标签 "乙" -->
            <text id="scene1-label-Yi" x="550" y="340" text-anchor="middle" font-size="20" fill="#000000">乙</text>
            
            <!-- 拉力标签 F_手左（步骤 2 显示） -->
            <text id="scene1-label-F_left" x="50" y="240" text-anchor="end" font-size="16" fill="#1565c0" opacity="0">F<sub>手左</sub></text>
            <!-- 拉力标签 F_手右（步骤 2 显示） -->
            <text id="scene1-label-F_right" x="730" y="240" text-anchor="start" font-size="16" fill="#1565c0" opacity="0">F<sub>手右</sub></text>
            
            <!-- 相互作用力标签（步骤 1 显示） -->
            <text id="scene1-label-F_BA" x="375" y="215" text-anchor="middle" font-size="14" fill="#c62828" opacity="0">F<sub>BA</sub></text>
            <text id="scene1-label-F_AB" x="425" y="295" text-anchor="middle" font-size="14" fill="#c62828" opacity="0">F<sub>AB</sub></text>
            
            <!-- 读数 "8N" 在 A（步骤 3 显示） -->
            <text id="scene1-reading-A" x="250" y="285" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e7d32" opacity="0">8N</text>
            <!-- 读数 "8N" 在 B（步骤 3 显示） -->
            <text id="scene1-reading-B" x="550" y="285" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e7d32" opacity="0">8N</text>
            
            <!-- 结论等式（步骤 4 显示） -->
            <g id="scene1-conclusion" opacity="0">
                <text x="400" y="400" text-anchor="middle" font-size="16" fill="#000000">F<sub>AB</sub> = F<sub>BA</sub> = 8N</text>
                <text x="400" y="425" text-anchor="middle" font-size="16" fill="#000000">F<sub>手左</sub> = F<sub>手右</sub> = 8N</text>
                <text x="400" y="450" text-anchor="middle" font-size="16" font-weight="bold" fill="#c62828">答案：B 的读数为 8N，手的拉力为 8N</text>
            </g>
            
            <!-- 箭头标记定义 -->
            <defs>
                <marker id="scene1-arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0"/>
                </marker>
                <marker id="scene1-arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#c62828"/>
                </marker>
            </defs>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/5</span>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1: 弹簧测力计受力分析 - 牛顿第三定律演示
        // 布局坐标表（参考）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 备注 |
        // |------|------|-----------|------|------|
        // | 测力计 A 外壳 | 矩形 | (150,200)-(350,300) | 200×100 | 左侧测力计 |
        // | 测力计 B 外壳 | 矩形 | (450,200)-(650,300) | 200×100 | 右侧测力计 |
        // | 测力计 A 弹簧 | 折线 | (170,250)-(330,250) | 160×10 | 锯齿状 |
        // | 测力计 B 弹簧 | 折线 | (470,250)-(630,250) | 160×10 | 锯齿状 |
        // | 标签"A" | text | (250,170) | - | 测力计 A 正上方 |
        // | 标签"B" | text | (550,170) | - | 测力计 B 正上方 |
        // | 标签"甲" | text | (250,340) | - | 测力计 A 正下方 |
        // | 标签"乙" | text | (550,340) | - | 测力计 B 正下方 |
        // | 拉力箭头 F_手左 | 箭头 | (80,250)-(130,250) | - | 向左箭头，蓝色 |
        // | 拉力箭头 F_手右 | 箭头 | (670,250)-(720,250) | - | 向右箭头，蓝色 |
        // | 相互作用力 F_BA | 箭头 | (360,230)-(390,230) | - | 向左，红色 |
        // | 相互作用力 F_AB | 箭头 | (410,270)-(440,270) | - | 向右，红色 |
        // | 读数"8N"在 A | text | (250,285) | - | 测力计 A 内部 |
        // | 读数"8N"在 B | text | (550,285) | - | 测力计 B 内部 |
        // | 结论等式 | text | (400,400) | - | 步骤 4 显示 |
        
        const TOTAL_STEPS = 5;
        let currentStep = 0;
        
        // 步骤配置：每一步需要显示的元素 ID 列表
        const stepConfig = {
            0: [
                'meter-A', 'meter-B', 'spring-A', 'spring-B',
                'ring-A-left', 'ring-B-right', 'hook-A', 'hook-B',
                'label-A', 'label-B', 'label-Jia', 'label-Yi',
                'arrow-left', 'arrow-right'
            ],
            1: [
                'meter-A', 'meter-B', 'spring-A', 'spring-B',
                'ring-A-left', 'ring-B-right', 'hook-A', 'hook-B',
                'label-A', 'label-B', 'label-Jia', 'label-Yi',
                'arrow-left', 'arrow-right',
                'highlight-hook', 'arrow-F_BA', 'arrow-F_AB',
                'label-F_BA', 'label-F_AB'
            ],
            2: [
                'meter-A', 'meter-B', 'spring-A', 'spring-B',
                'ring-A-left', 'ring-B-right', 'hook-A', 'hook-B',
                'label-A', 'label-B', 'label-Jia', 'label-Yi',
                'arrow-left', 'arrow-right',
                'highlight-hook', 'arrow-F_BA', 'arrow-F_AB',
                'label-F_BA', 'label-F_AB',
                'label-F_left', 'label-F_right'
            ],
            3: [
                'meter-A', 'meter-B', 'spring-A', 'spring-B',
                'ring-A-left', 'ring-B-right', 'hook-A', 'hook-B',
                'label-A', 'label-B', 'label-Jia', 'label-Yi',
                'arrow-left', 'arrow-right',
                'highlight-hook', 'arrow-F_BA', 'arrow-F_AB',
                'label-F_BA', 'label-F_AB',
                'label-F_left', 'label-F_right',
                'reading-A', 'reading-B'
            ],
            4: [
                'meter-A', 'meter-B', 'spring-A', 'spring-B',
                'ring-A-left', 'ring-B-right', 'hook-A', 'hook-B',
                'label-A', 'label-B', 'label-Jia', 'label-Yi',
                'arrow-left', 'arrow-right',
                'highlight-hook', 'arrow-F_BA', 'arrow-F_AB',
                'label-F_BA', 'label-F_AB',
                'label-F_left', 'label-F_right',
                'reading-A', 'reading-B',
                'conclusion'
            ]
        };
        
        // 步骤描述
        const stepDescriptions = [
            '初始状态：展示两个弹簧测力计的连接方式',
            '步骤 1：标注 A 与 B 之间的相互作用力',
            '步骤 2：标注手对两端圆环的拉力',
            '步骤 3：显示测力计读数',
            '步骤 4：总结结论'
        ];
        
        // 获取元素 ID（添加 scene1- 前缀）
        function getElementId(suffix) {
            return 'scene1-' + suffix;
        }
        
        // 显示元素
        function showElement(suffix) {
            const el = document.getElementById(getElementId(suffix));
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '1';
                el.classList.add('scene1-fade-in');
            }
        }
        
        // 隐藏元素
        function hideElement(suffix) {
            const el = document.getElementById(getElementId(suffix));
            if (el) {
                el.style.display = 'none';
                el.style.opacity = '0';
                el.classList.remove('scene1-fade-in');
            }
        }
        
        // 渲染当前步骤
        function renderStep() {
            // 先隐藏所有可能显示的元素
            const allElements = [
                'meter-A', 'meter-B', 'spring-A', 'spring-B',
                'ring-A-left', 'ring-B-right', 'hook-A', 'hook-B',
                'label-A', 'label-B', 'label-Jia', 'label-Yi',
                'arrow-left', 'arrow-right',
                'highlight-hook', 'arrow-F_BA', 'arrow-F_AB',
                'label-F_BA', 'label-F_AB',
                'label-F_left', 'label-F_right',
                'reading-A', 'reading-B',
                'conclusion'
            ];
            allElements.forEach(hideElement);
            
            // 显示当前步骤需要的元素
            const elementsToShow = stepConfig[currentStep];
            elementsToShow.forEach(showElement);
            
            // 更新步骤指示器
            document.getElementById('scene1-step-indicator').textContent = `步骤 ${currentStep + 1}/${TOTAL_STEPS}`;
            
            // 更新按钮状态
            document.getElementById('scene1-btn-prev').disabled = (currentStep === 0);
            document.getElementById('scene1-btn-next').disabled = (currentStep === TOTAL_STEPS - 1);
        }
        
        // 下一步
        function nextStep() {
            if (currentStep < TOTAL_STEPS - 1) {
                currentStep++;
                renderStep();
            }
        }
        
        // 上一步
        function prevStep() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        }
        
        // 初始化
        function init() {
            document.getElementById('scene1-btn-next').addEventListener('click', nextStep);
            document.getElementById('scene1-btn-prev').addEventListener('click', prevStep);
            renderStep();
        }
        
        // 页面加载完成后初始化
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>
</body>
</html>
