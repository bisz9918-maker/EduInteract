<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C₅H₁₁Cl 卤代烃同分异构体结构分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene1-btn { padding: 8px 20px; font-size: 14px; border: 1px solid #333; border-radius: 4px; cursor: pointer; background: #f5f5f5; }
        .scene1-btn:hover:not(:disabled) { background: #e0e0e0; }
        .scene1-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene1-step-indicator { position: absolute; bottom: 45px; left: 50%; transform: translateX(-50%); font-size: 16px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- 标题 -->
            <text x="400" y="45" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">碳骨架类型与氯代位置分析</text>
            
            <!-- 正戊烷骨架标题 -->
            <text x="50" y="95" font-size="14" font-weight="bold" fill="#1565c0">正戊烷骨架 C-C-C-C-C</text>
            
            <!-- 正戊烷骨架：碳 - 碳键 -->
            <line x1="80" y1="140" x2="160" y2="140" stroke="#333" stroke-width="2"/>
            <line x1="180" y1="140" x2="260" y2="140" stroke="#333" stroke-width="2"/>
            <line x1="280" y1="140" x2="360" y2="140" stroke="#333" stroke-width="2"/>
            <line x1="380" y1="140" x2="460" y2="140" stroke="#333" stroke-width="2"/>
            
            <!-- 正戊烷骨架：碳原子圆圈 -->
            <circle cx="70" cy="140" r="10" fill="#fff" stroke="#1565c0" stroke-width="2"/>
            <circle cx="170" cy="140" r="10" fill="#fff" stroke="#1565c0" stroke-width="2"/>
            <circle cx="270" cy="140" r="10" fill="#fff" stroke="#1565c0" stroke-width="2"/>
            <circle cx="370" cy="140" r="10" fill="#fff" stroke="#1565c0" stroke-width="2"/>
            <circle cx="470" cy="140" r="10" fill="#fff" stroke="#1565c0" stroke-width="2"/>
            
            <!-- 正戊烷骨架：碳原子编号（圆圈上方） -->
            <text x="70" y="122" text-anchor="middle" font-size="12" fill="#333">①</text>
            <text x="170" y="122" text-anchor="middle" font-size="12" fill="#333">②</text>
            <text x="270" y="122" text-anchor="middle" font-size="12" fill="#333">③</text>
            <text x="370" y="122" text-anchor="middle" font-size="12" fill="#333">④</text>
            <text x="470" y="122" text-anchor="middle" font-size="12" fill="#333">⑤</text>
            
            <!-- 正戊烷骨架：基团类型标签（圆圈下方） -->
            <text x="70" y="168" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">CH₃</text>
            <text x="170" y="168" text-anchor="middle" font-size="13" fill="#333">CH₂</text>
            <text x="270" y="168" text-anchor="middle" font-size="13" fill="#333">CH₂</text>
            <text x="370" y="168" text-anchor="middle" font-size="13" fill="#333">CH₂</text>
            <text x="470" y="168" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">CH₃</text>
            
            <!-- 正戊烷氯代标记（步骤 1 显示）- 放在右侧 -->
            <!-- C1 氯代 -->
            <text x="70" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#c62828" id="scene1-pentane-cl1" style="display: none;">Cl</text>
            <text x="540" y="125" font-size="12" fill="#333" id="scene1-pentane-name1" style="display: none;">① Cl 取代：1-氯戊烷</text>
            <text x="720" y="125" font-size="16" fill="#c62828" id="scene1-pentane-check1" style="display: none;">✗</text>
            
            <!-- C2 氯代 -->
            <text x="170" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#c62828" id="scene1-pentane-cl2" style="display: none;">Cl</text>
            <text x="540" y="145" font-size="12" fill="#333" id="scene1-pentane-name2" style="display: none;">② Cl 取代：2-氯戊烷</text>
            <text x="720" y="145" font-size="16" fill="#2e7d32" id="scene1-pentane-check2" style="display: none;">✓</text>
            
            <!-- C3 氯代 -->
            <text x="270" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#c62828" id="scene1-pentane-cl3" style="display: none;">Cl</text>
            <text x="540" y="165" font-size="12" fill="#333" id="scene1-pentane-name3" style="display: none;">③ Cl 取代：3-氯戊烷</text>
            <text x="720" y="165" font-size="16" fill="#2e7d32" id="scene1-pentane-check3" style="display: none;">✓</text>
            
            <!-- 异戊烷骨架标题 -->
            <text x="50" y="260" font-size="14" font-weight="bold" fill="#c62828">异戊烷骨架（带支链）</text>
            
            <!-- 异戊烷骨架：碳 - 碳键 -->
            <line x1="80" y1="320" x2="160" y2="320" stroke="#333" stroke-width="2"/>
            <line x1="180" y1="320" x2="260" y2="320" stroke="#333" stroke-width="2"/>
            <line x1="280" y1="320" x2="360" y2="320" stroke="#333" stroke-width="2"/>
            <line x1="170" y1="300" x2="170" y2="280" stroke="#333" stroke-width="2"/>
            
            <!-- 异戊烷骨架：碳原子圆圈 -->
            <circle cx="70" cy="320" r="10" fill="#fff" stroke="#c62828" stroke-width="2"/>
            <circle cx="170" cy="320" r="10" fill="#fff" stroke="#c62828" stroke-width="2"/>
            <circle cx="270" cy="320" r="10" fill="#fff" stroke="#c62828" stroke-width="2"/>
            <circle cx="370" cy="320" r="10" fill="#fff" stroke="#c62828" stroke-width="2"/>
            <circle cx="170" cy="270" r="10" fill="#fff" stroke="#c62828" stroke-width="2"/>
            
            <!-- 异戊烷骨架：碳原子编号 -->
            <text x="70" y="305" text-anchor="middle" font-size="12" fill="#333">①</text>
            <text x="170" y="305" text-anchor="middle" font-size="12" fill="#333">②</text>
            <text x="270" y="305" text-anchor="middle" font-size="12" fill="#333">③</text>
            <text x="370" y="305" text-anchor="middle" font-size="12" fill="#333">④</text>
            <text x="170" y="260" text-anchor="middle" font-size="12" fill="#333">⑤</text>
            
            <!-- 异戊烷骨架：基团类型标签 -->
            <text x="70" y="345" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">CH₃</text>
            <text x="170" y="345" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">CH</text>
            <text x="270" y="345" text-anchor="middle" font-size="13" fill="#333">CH₂</text>
            <text x="370" y="345" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">CH₃</text>
            <text x="170" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">CH₃</text>
            
            <!-- 异戊烷氯代标记（步骤 2 显示）- 放在右侧下方 -->
            <!-- C1 氯代 -->
            <text x="70" y="305" text-anchor="middle" font-size="14" font-weight="bold" fill="#c62828" id="scene1-isopentane-cl1" style="display: none;">Cl</text>
            <text x="540" y="210" font-size="12" fill="#333" id="scene1-isopentane-name1" style="display: none;">① Cl 取代：1-氯 -3-甲基丁烷</text>
            <text x="720" y="210" font-size="16" fill="#2e7d32" id="scene1-isopentane-check1" style="display: none;">✓</text>
            
            <!-- C2 氯代 -->
            <text x="170" y="305" text-anchor="middle" font-size="14" font-weight="bold" fill="#c62828" id="scene1-isopentane-cl2" style="display: none;">Cl</text>
            <text x="540" y="230" font-size="12" fill="#333" id="scene1-isopentane-name2" style="display: none;">② Cl 取代：2-氯 -3-甲基丁烷</text>
            <text x="720" y="230" font-size="16" fill="#c62828" id="scene1-isopentane-check2" style="display: none;">✗</text>
            
            <!-- C3 氯代 -->
            <text x="270" y="305" text-anchor="middle" font-size="14" font-weight="bold" fill="#c62828" id="scene1-isopentane-cl3" style="display: none;">Cl</text>
            <text x="540" y="250" font-size="12" fill="#333" id="scene1-isopentane-name3" style="display: none;">③ Cl 取代：3-氯 -2-甲基丁烷</text>
            <text x="720" y="250" font-size="16" fill="#c62828" id="scene1-isopentane-check3" style="display: none;">✗</text>
            
            <!-- C4 氯代 -->
            <text x="370" y="305" text-anchor="middle" font-size="14" font-weight="bold" fill="#c62828" id="scene1-isopentane-cl4" style="display: none;">Cl</text>
            <text x="540" y="270" font-size="12" fill="#333" id="scene1-isopentane-name4" style="display: none;">④ Cl 取代：1-氯 -2-甲基丁烷</text>
            <text x="720" y="270" font-size="16" fill="#2e7d32" id="scene1-isopentane-check4" style="display: none;">✓</text>
            
            <!-- C5（支链）氯代 -->
            <text x="170" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#c62828" id="scene1-isopentane-cl5" style="display: none;">Cl</text>
            <text x="540" y="290" font-size="12" fill="#888" id="scene1-isopentane-name5" style="display: none;">⑤ Cl 取代：（与①相同，不计）</text>
            
            <!-- 汇总框（步骤 3 显示） -->
            <g id="scene1-summary" style="display: none;">
                <rect x="520" y="300" width="240" height="130" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" rx="8"/>
                <text x="640" y="325" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">符合条件的结构共 4 种</text>
                <text x="540" y="350" font-size="12" fill="#2e7d32">1. 2-氯戊烷</text>
                <text x="540" y="370" font-size="12" fill="#2e7d32">2. 3-氯戊烷</text>
                <text x="540" y="390" font-size="12" fill="#2e7d32">3. 1-氯 -3-甲基丁烷</text>
                <text x="540" y="410" font-size="12" fill="#2e7d32">4. 1-氯 -2-甲基丁烷</text>
            </g>
        </svg>
        
        <div class="scene1-step-indicator" id="scene1-step-indicator">步骤 1/4</div>
        
        <div id="scene1-controls">
            <button class="scene1-btn" id="scene1-btn-prev">◀ 上一步</button>
            <button class="scene1-btn" id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1: C₅H₁₁Cl 卤代烃同分异构体结构分析
        // 布局坐标表（实现对照依据）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // |------|------|-----------|------|-------------|------|
        // | 标题区 | text | (400, 45) | ~200×20 | - | 显示"碳骨架类型与氯代位置分析" |
        // | 正戊烷骨架标题 | text | (50, 95) | ~150×18 | - | "正戊烷骨架 C-C-C-C-C" |
        // | 正戊烷 C1 | 圆 | (70, 140) | 20×20 | 上方编号，下方标签 | CH₃，编号① |
        // | 正戊烷 C2 | 圆 | (170, 140) | 20×20 | 上方编号，下方标签 | CH₂，编号② |
        // | 正戊烷 C3 | 圆 | (270, 140) | 20×20 | 上方编号，下方标签 | CH₂，编号③ |
        // | 正戊烷 C4 | 圆 | (370, 140) | 20×20 | 上方编号，下方标签 | CH₂，编号④ |
        // | 正戊烷 C5 | 圆 | (470, 140) | 20×20 | 上方编号，下方标签 | CH₃，编号⑤ |
        // | 异戊烷骨架标题 | text | (50, 260) | ~150×18 | - | "异戊烷骨架（带支链）" |
        // | 异戊烷 C1 | 圆 | (70, 320) | 20×20 | 上方编号，下方标签 | CH₃，编号① |
        // | 异戊烷 C2 | 圆 | (170, 320) | 20×20 | 上方编号，下方标签 | CH，编号② |
        // | 异戊烷 C3 | 圆 | (270, 320) | 20×20 | 上方编号，下方标签 | CH₂，编号③ |
        // | 异戊烷 C4 | 圆 | (370, 320) | 20×20 | 上方编号，下方标签 | CH₃，编号④ |
        // | 异戊烷 C5(支链) | 圆 | (170, 270) | 20×20 | 上方编号，上方标签 | CH₃，编号⑤ |
        
        const TOTAL_STEPS = 4;
        let currentStep = 0;
        
        // 工具函数：显示元素
        function show(el) {
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '0';
                setTimeout(() => {
                    el.style.transition = 'opacity 0.3s';
                    el.style.opacity = '1';
                }, 10);
            }
        }
        
        // 工具函数：隐藏元素
        function hide(el) {
            if (el) {
                el.style.opacity = '0';
                setTimeout(() => {
                    el.style.display = 'none';
                }, 300);
            }
        }
        
        // 更新步骤显示
        function updateStep() {
            const stepIndicator = document.getElementById('scene1-step-indicator');
            const prevBtn = document.getElementById('scene1-btn-prev');
            const nextBtn = document.getElementById('scene1-btn-next');
            
            // 更新步骤指示器
            stepIndicator.textContent = `步骤 ${currentStep + 1}/${TOTAL_STEPS}`;
            
            // 更新按钮状态
            prevBtn.disabled = (currentStep === 0);
            nextBtn.disabled = (currentStep === TOTAL_STEPS - 1);
            
            // 步骤 0：初始状态（只显示骨架）
            // 步骤 1：正戊烷氯代位置分析
            // 步骤 2：异戊烷氯代位置分析
            // 步骤 3：符合条件的结构汇总
            
            if (currentStep >= 1) {
                // 显示正戊烷氯代标记
                show(document.getElementById('scene1-pentane-cl1'));
                show(document.getElementById('scene1-pentane-name1'));
                show(document.getElementById('scene1-pentane-check1'));
                show(document.getElementById('scene1-pentane-cl2'));
                show(document.getElementById('scene1-pentane-name2'));
                show(document.getElementById('scene1-pentane-check2'));
                show(document.getElementById('scene1-pentane-cl3'));
                show(document.getElementById('scene1-pentane-name3'));
                show(document.getElementById('scene1-pentane-check3'));
            } else {
                hide(document.getElementById('scene1-pentane-cl1'));
                hide(document.getElementById('scene1-pentane-name1'));
                hide(document.getElementById('scene1-pentane-check1'));
                hide(document.getElementById('scene1-pentane-cl2'));
                hide(document.getElementById('scene1-pentane-name2'));
                hide(document.getElementById('scene1-pentane-check2'));
                hide(document.getElementById('scene1-pentane-cl3'));
                hide(document.getElementById('scene1-pentane-name3'));
                hide(document.getElementById('scene1-pentane-check3'));
            }
            
            if (currentStep >= 2) {
                // 显示异戊烷氯代标记
                show(document.getElementById('scene1-isopentane-cl1'));
                show(document.getElementById('scene1-isopentane-name1'));
                show(document.getElementById('scene1-isopentane-check1'));
                show(document.getElementById('scene1-isopentane-cl2'));
                show(document.getElementById('scene1-isopentane-name2'));
                show(document.getElementById('scene1-isopentane-check2'));
                show(document.getElementById('scene1-isopentane-cl3'));
                show(document.getElementById('scene1-isopentane-name3'));
                show(document.getElementById('scene1-isopentane-check3'));
                show(document.getElementById('scene1-isopentane-cl4'));
                show(document.getElementById('scene1-isopentane-name4'));
                show(document.getElementById('scene1-isopentane-check4'));
                show(document.getElementById('scene1-isopentane-cl5'));
                show(document.getElementById('scene1-isopentane-name5'));
            } else {
                hide(document.getElementById('scene1-isopentane-cl1'));
                hide(document.getElementById('scene1-isopentane-name1'));
                hide(document.getElementById('scene1-isopentane-check1'));
                hide(document.getElementById('scene1-isopentane-cl2'));
                hide(document.getElementById('scene1-isopentane-name2'));
                hide(document.getElementById('scene1-isopentane-check2'));
                hide(document.getElementById('scene1-isopentane-cl3'));
                hide(document.getElementById('scene1-isopentane-name3'));
                hide(document.getElementById('scene1-isopentane-check3'));
                hide(document.getElementById('scene1-isopentane-cl4'));
                hide(document.getElementById('scene1-isopentane-name4'));
                hide(document.getElementById('scene1-isopentane-check4'));
                hide(document.getElementById('scene1-isopentane-cl5'));
                hide(document.getElementById('scene1-isopentane-name5'));
            }
            
            if (currentStep >= 3) {
                // 显示汇总框
                show(document.getElementById('scene1-summary'));
            } else {
                hide(document.getElementById('scene1-summary'));
            }
        }
        
        // 按钮事件绑定
        document.getElementById('scene1-btn-prev').addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });
        
        document.getElementById('scene1-btn-next').addEventListener('click', function() {
            if (currentStep < TOTAL_STEPS - 1) {
                currentStep++;
                updateStep();
            }
        });
        
        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
