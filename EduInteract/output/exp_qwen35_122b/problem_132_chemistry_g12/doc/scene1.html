<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>罂粟碱分子结构分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; gap: 15px; z-index: 10; }
        #scene1-controls button { padding: 8px 20px; font-size: 14px; cursor: pointer; border: 2px solid #333; border-radius: 5px; background: #f5f5f5; }
        #scene1-controls button:hover { background: #e0e0e0; }
        #scene1-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-step-indicator { padding: 8px 20px; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- 分子骨架组 -->
            <g id="scene1-molecule">
                <!-- 左侧苯环 -->
                <polygon points="140,260 200,260 230,310 200,360 140,360 110,310" fill="none" stroke="#000000" stroke-width="2"/>
                <!-- 中间杂环 -->
                <polygon points="200,260 260,260 290,310 260,360 200,360" fill="none" stroke="#000000" stroke-width="2"/>
                <!-- 亚甲基连接线 -->
                <line x1="290" y1="310" x2="440" y2="150" stroke="#000000" stroke-width="2"/>
                <!-- 右侧苯环 -->
                <polygon points="470,100 530,100 560,150 530,200 470,200 440,150" fill="none" stroke="#000000" stroke-width="2"/>
                
                <!-- 左侧甲氧基连接线 -->
                <line x1="110" y1="310" x2="70" y2="310" stroke="#000000" stroke-width="2"/>
                <line x1="110" y1="310" x2="70" y2="340" stroke="#000000" stroke-width="2"/>
                <!-- 右侧甲氧基连接线 -->
                <line x1="560" y1="150" x2="600" y2="150" stroke="#000000" stroke-width="2"/>
                <line x1="530" y1="100" x2="530" y2="60" stroke="#000000" stroke-width="2"/>
                
                <!-- 左侧甲氧基标签（调整位置，远离苯环 A） -->
                <text x="25" y="305" font-size="14" fill="#e65100">-OCH₃</text>
                <text x="25" y="345" font-size="14" fill="#e65100">-OCH₃</text>
                <!-- 右侧甲氧基标签（调整位置，远离苯环 B） -->
                <text x="605" y="145" font-size="14" fill="#e65100">-OCH₃</text>
                <text x="605" y="155" font-size="14" fill="#e65100">-OCH₃</text>
                <text x="515" y="55" font-size="14" fill="#e65100">-OCH₃</text>
                
                <!-- N 原子标签（调整位置，在杂环外部右侧） -->
                <text x="295" y="315" font-size="16" fill="#c62828" font-weight="bold">N</text>
                
                <!-- 苯环标签（调整位置，远离分子骨架） -->
                <text id="scene1-label-benzeneA" x="50" y="315" font-size="14" fill="#000000">苯环 A</text>
                <text id="scene1-label-benzeneB" x="615" y="155" font-size="14" fill="#000000">苯环 B</text>
            </g>
            
            <!-- 碳原子高亮点组（步骤 1） -->
            <g id="scene1-carbon-highlights" style="opacity: 0;">
                <!-- 左侧苯环碳原子（6 个） -->
                <circle cx="140" cy="260" r="4" fill="#1565c0"/>
                <circle cx="200" cy="260" r="4" fill="#1565c0"/>
                <circle cx="230" cy="310" r="4" fill="#1565c0"/>
                <circle cx="200" cy="360" r="4" fill="#1565c0"/>
                <circle cx="140" cy="360" r="4" fill="#1565c0"/>
                <circle cx="110" cy="310" r="4" fill="#1565c0"/>
                <!-- 中间杂环碳原子（5 个，其中 2 个与苯环共用） -->
                <circle cx="260" cy="260" r="4" fill="#1565c0"/>
                <circle cx="290" cy="310" r="4" fill="#1565c0"/>
                <circle cx="260" cy="360" r="4" fill="#1565c0"/>
                <!-- 右侧苯环碳原子（6 个） -->
                <circle cx="470" cy="100" r="4" fill="#1565c0"/>
                <circle cx="530" cy="100" r="4" fill="#1565c0"/>
                <circle cx="560" cy="150" r="4" fill="#1565c0"/>
                <circle cx="530" cy="200" r="4" fill="#1565c0"/>
                <circle cx="470" cy="200" r="4" fill="#1565c0"/>
                <circle cx="440" cy="150" r="4" fill="#1565c0"/>
                <!-- 亚甲基碳原子（1 个） -->
                <circle cx="365" cy="230" r="4" fill="#1565c0"/>
                <!-- 甲氧基碳原子（4 个） -->
                <circle cx="45" cy="305" r="4" fill="#1565c0"/>
                <circle cx="45" cy="345" r="4" fill="#1565c0"/>
                <circle cx="615" cy="145" r="4" fill="#1565c0"/>
                <circle cx="615" cy="155" r="4" fill="#1565c0"/>
                <circle cx="530" cy="50" r="4" fill="#1565c0"/>
                
                <!-- C=20 标签（调整位置） -->
                <text id="scene1-label-carbon" x="320" y="390" font-size="16" fill="#1565c0" font-weight="bold" style="opacity: 0;">C = 20</text>
            </g>
            
            <!-- 氢原子高亮点组（步骤 2） -->
            <g id="scene1-hydrogen-highlights" style="opacity: 0;">
                <!-- 左侧苯环氢原子（2 个） -->
                <circle cx="125" cy="285" r="3" fill="#2e7d32"/>
                <circle cx="125" cy="335" r="3" fill="#2e7d32"/>
                <!-- 中间杂环氢原子（3 个） -->
                <circle cx="245" cy="285" r="3" fill="#2e7d32"/>
                <circle cx="245" cy="335" r="3" fill="#2e7d32"/>
                <circle cx="290" cy="310" r="3" fill="#2e7d32"/>
                <!-- 右侧苯环氢原子（3 个） -->
                <circle cx="455" cy="125" r="3" fill="#2e7d32"/>
                <circle cx="545" cy="80" r="3" fill="#2e7d32"/>
                <circle cx="575" cy="150" r="3" fill="#2e7d32"/>
                <!-- 甲氧基氢原子（12 个，每个 3 个） -->
                <circle cx="15" cy="300" r="3" fill="#2e7d32"/>
                <circle cx="15" cy="310" r="3" fill="#2e7d32"/>
                <circle cx="20" cy="320" r="3" fill="#2e7d32"/>
                <circle cx="15" cy="340" r="3" fill="#2e7d32"/>
                <circle cx="15" cy="350" r="3" fill="#2e7d32"/>
                <circle cx="20" cy="360" r="3" fill="#2e7d32"/>
                <circle cx="625" cy="140" r="3" fill="#2e7d32"/>
                <circle cx="625" cy="150" r="3" fill="#2e7d32"/>
                <circle cx="630" cy="160" r="3" fill="#2e7d32"/>
                <circle cx="625" cy="150" r="3" fill="#2e7d32"/>
                <circle cx="625" cy="160" r="3" fill="#2e7d32"/>
                <circle cx="630" cy="170" r="3" fill="#2e7d32"/>
                <circle cx="520" cy="40" r="3" fill="#2e7d32"/>
                <circle cx="530" cy="40" r="3" fill="#2e7d32"/>
                <circle cx="535" cy="45" r="3" fill="#2e7d32"/>
                <!-- 亚甲基氢原子（2 个） -->
                <circle cx="355" cy="220" r="3" fill="#2e7d32"/>
                <circle cx="375" cy="220" r="3" fill="#2e7d32"/>
                
                <!-- H=21, N=1, O=4 标签（调整位置） -->
                <text id="scene1-label-hydrogen" x="320" y="390" font-size="16" fill="#2e7d32" font-weight="bold" style="opacity: 0;">H = 21, N = 1, O = 4</text>
            </g>
            
            <!-- 分子式框（步骤 3） -->
            <g id="scene1-formula-box" style="opacity: 0;">
                <rect x="200" y="420" width="400" height="50" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                <text x="350" y="445" font-size="18" fill="#000000" font-weight="bold">C₂₀H₂₁NO₄</text>
                <text x="220" y="465" font-size="14" fill="#000000">耗氧量：(20 + 21/4 - 4/2) = 24.5 mol</text>
            </g>
            
            <!-- 不等效氢标记组（步骤 4） -->
            <g id="scene1-equivalent-h" style="opacity: 0;">
                <!-- 位置 1：左侧苯环上端（调整数字位置到外侧） -->
                <circle cx="125" cy="285" r="5" fill="#7b1fa2"/>
                <text x="105" y="285" font-size="12" fill="#7b1fa2" font-weight="bold">1</text>
                <!-- 位置 2：左侧苯环下端 -->
                <circle cx="125" cy="335" r="5" fill="#7b1fa2"/>
                <text x="105" y="340" font-size="12" fill="#7b1fa2" font-weight="bold">2</text>
                <!-- 位置 3：中间杂环上端 -->
                <circle cx="245" cy="285" r="5" fill="#7b1fa2"/>
                <text x="225" y="285" font-size="12" fill="#7b1fa2" font-weight="bold">3</text>
                <!-- 位置 4：中间杂环下端 -->
                <circle cx="245" cy="335" r="5" fill="#7b1fa2"/>
                <text x="225" y="340" font-size="12" fill="#7b1fa2" font-weight="bold">4</text>
                <!-- 位置 5：右侧苯环左端 -->
                <circle cx="455" cy="125" r="5" fill="#7b1fa2"/>
                <text x="435" y="125" font-size="12" fill="#7b1fa2" font-weight="bold">5</text>
                <!-- 位置 6：右侧苯环上端 -->
                <circle cx="545" cy="80" r="5" fill="#7b1fa2"/>
                <text x="535" y="65" font-size="12" fill="#7b1fa2" font-weight="bold">6</text>
                <!-- 位置 7：右侧苯环右端 -->
                <circle cx="575" cy="150" r="5" fill="#7b1fa2"/>
                <text x="590" y="155" font-size="12" fill="#7b1fa2" font-weight="bold">7</text>
            </g>
            
            <!-- 答案框（步骤 5） -->
            <g id="scene1-answer-box" style="opacity: 0;">
                <rect x="500" y="330" width="250" height="90" fill="#2e7d32" fill-opacity="0.2" stroke="#2e7d32" stroke-width="2"/>
                <text x="515" y="358" font-size="16" fill="#2e7d32" font-weight="bold">答案：B（24.5mol；7）</text>
                <text x="515" y="382" font-size="14" fill="#2e7d32">耗氧量：24.5mol</text>
                <text x="515" y="405" font-size="14" fill="#2e7d32">一溴代物同分异构体：7 种</text>
            </g>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-prev-btn" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/6</span>
            <button id="scene1-next-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // 状态变量
        var currentStep = 0;
        var totalSteps = 6;
        
        // DOM 元素引用
        var prevBtn = document.getElementById('scene1-prev-btn');
        var nextBtn = document.getElementById('scene1-next-btn');
        var stepIndicator = document.getElementById('scene1-step-indicator');
        
        // 各步骤需要控制的元素组
        var stepElements = {
            0: {
                show: ['scene1-molecule', 'scene1-label-benzeneA', 'scene1-label-benzeneB'],
                hide: ['scene1-carbon-highlights', 'scene1-hydrogen-highlights', 'scene1-formula-box', 'scene1-equivalent-h', 'scene1-answer-box']
            },
            1: {
                show: ['scene1-molecule', 'scene1-label-benzeneA', 'scene1-label-benzeneB', 'scene1-carbon-highlights', 'scene1-label-carbon'],
                hide: ['scene1-hydrogen-highlights', 'scene1-formula-box', 'scene1-equivalent-h', 'scene1-answer-box']
            },
            2: {
                show: ['scene1-molecule', 'scene1-label-benzeneA', 'scene1-label-benzeneB', 'scene1-carbon-highlights', 'scene1-hydrogen-highlights', 'scene1-label-hydrogen'],
                hide: ['scene1-formula-box', 'scene1-equivalent-h', 'scene1-answer-box']
            },
            3: {
                show: ['scene1-molecule', 'scene1-label-benzeneA', 'scene1-label-benzeneB', 'scene1-carbon-highlights', 'scene1-hydrogen-highlights', 'scene1-formula-box'],
                hide: ['scene1-equivalent-h', 'scene1-answer-box']
            },
            4: {
                show: ['scene1-molecule', 'scene1-label-benzeneA', 'scene1-label-benzeneB', 'scene1-formula-box', 'scene1-equivalent-h'],
                hide: ['scene1-carbon-highlights', 'scene1-hydrogen-highlights', 'scene1-answer-box']
            },
            5: {
                show: ['scene1-molecule', 'scene1-label-benzeneA', 'scene1-label-benzeneB', 'scene1-formula-box', 'scene1-equivalent-h', 'scene1-answer-box'],
                hide: ['scene1-carbon-highlights', 'scene1-hydrogen-highlights']
            }
        };
        
        // 显示元素
        function showElement(id) {
            var el = document.getElementById(id);
            if (el) {
                el.style.opacity = '1';
                el.style.display = 'block';
            }
        }
        
        // 隐藏元素
        function hideElement(id) {
            var el = document.getElementById(id);
            if (el) {
                el.style.opacity = '0';
                el.style.display = 'none';
            }
        }
        
        // 更新步骤显示
        function updateStep() {
            var stepConfig = stepElements[currentStep];
            
            // 先隐藏所有可能的元素
            for (var i = 0; i < totalSteps; i++) {
                var config = stepElements[i];
                if (config && config.hide) {
                    config.hide.forEach(function(id) {
                        hideElement(id);
                    });
                }
            }
            
            // 显示当前步骤需要的元素
            if (stepConfig && stepConfig.show) {
                stepConfig.show.forEach(function(id) {
                    showElement(id);
                });
            }
            
            // 更新按钮状态
            prevBtn.disabled = (currentStep === 0);
            nextBtn.disabled = (currentStep === totalSteps - 1);
            
            // 更新步骤指示器
            stepIndicator.textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;
        }
        
        // 上一步按钮点击
        prevBtn.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });
        
        // 下一步按钮点击
        nextBtn.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateStep();
            }
        });
        
        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
