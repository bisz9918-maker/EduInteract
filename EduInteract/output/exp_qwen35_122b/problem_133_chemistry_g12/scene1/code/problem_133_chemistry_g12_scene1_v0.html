<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 1 - 密闭容器活塞系统</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene1-controls button { width: 120px; height: 36px; font-size: 14px; cursor: pointer; border: 2px solid #333; border-radius: 6px; background: #f5f5f5; }
        #scene1-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene1-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 容器边框 -->
            <g id="scene1-container-border">
                <rect x="100" y="150" width="600" height="200" fill="none" stroke="#000000" stroke-width="2"/>
            </g>

            <!-- 左侧区域填充 -->
            <rect id="scene1-left-fill" x="100" y="150" width="150" height="200" fill="#1565c0" opacity="0.2"/>

            <!-- 右侧区域填充 -->
            <rect id="scene1-right-fill" x="250" y="150" width="450" height="200" fill="#1565c0" opacity="0.2"/>

            <!-- 活塞初始位置 (x=250) -->
            <line id="scene1-piston-initial" x1="250" y1="150" x2="250" y2="350" stroke="#000000" stroke-width="3"/>

            <!-- 活塞最终位置 (x=400, 初始隐藏) -->
            <line id="scene1-piston-final" x1="400" y1="150" x2="400" y2="350" stroke="#2e7d32" stroke-width="3" style="display: none;"/>

            <!-- 活塞左弹位置 (x=200, 初始隐藏) -->
            <line id="scene1-piston-left" x1="200" y1="150" x2="200" y2="350" stroke="#000000" stroke-width="3" style="display: none;"/>

            <!-- 右侧区域红色边框 (点燃状态，初始隐藏) -->
            <rect id="scene1-right-border-react" x="250" y="150" width="450" height="200" fill="none" stroke="#c62828" stroke-width="3" style="display: none;"/>

            <!-- 刻度线 -->
            <line id="scene1-scale-line-0" x1="100" y1="370" x2="100" y2="375" stroke="#888888" stroke-width="1"/>
            <line id="scene1-scale-line-1" x1="250" y1="370" x2="250" y2="375" stroke="#888888" stroke-width="1"/>
            <line id="scene1-scale-line-4" x1="700" y1="370" x2="700" y2="375" stroke="#888888" stroke-width="1"/>
            <line id="scene1-scale-line-2" x1="400" y1="370" x2="400" y2="375" stroke="#888888" stroke-width="1" style="display: none;"/>

            <!-- 刻度标签 -->
            <text id="scene1-scale-0" x="100" y="388" text-anchor="middle" font-size="14" fill="#666666">0</text>
            <text id="scene1-scale-1" x="250" y="388" text-anchor="middle" font-size="14" fill="#666666">1</text>
            <text id="scene1-scale-4" x="700" y="388" text-anchor="middle" font-size="14" fill="#666666">4</text>
            <text id="scene1-scale-2" x="400" y="388" text-anchor="middle" font-size="14" fill="#666666" style="display: none;">2</text>

            <!-- 空气标签 (带白色背景矩形) -->
            <rect id="scene1-label-air-bg" x="145" y="235" width="60" height="30" fill="#ffffff" opacity="1"/>
            <text id="scene1-label-air" x="175" y="255" text-anchor="middle" font-size="18" fill="#000000">空气</text>

            <!-- 混合气标签 (带白色背景矩形) -->
            <rect id="scene1-label-mix-bg" x="415" y="185" width="120" height="30" fill="#ffffff" opacity="1"/>
            <text id="scene1-label-mix" x="475" y="205" text-anchor="middle" font-size="16" fill="#000000">O₂、H₂的混合气</text>

            <!-- 体积标注 (初始状态) -->
            <text id="scene1-vol-1-left" x="175" y="430" text-anchor="middle" font-size="14" fill="#000000">体积 1</text>
            <text id="scene1-vol-3-right" x="475" y="430" text-anchor="middle" font-size="14" fill="#000000">体积 3</text>

            <!-- 体积标注 (最终状态，初始隐藏) -->
            <text id="scene1-vol-2-left" x="250" y="430" text-anchor="middle" font-size="14" fill="#000000" style="display: none;">体积 2</text>
            <text id="scene1-vol-2-right" x="550" y="430" text-anchor="middle" font-size="14" fill="#000000" style="display: none;">体积 2</text>

            <!-- 活塞文字标签 -->
            <text id="scene1-piston-label" x="250" y="455" text-anchor="middle" font-size="14" fill="#000000">活塞</text>

            <!-- 反应式标签 (初始隐藏) -->
            <rect id="scene1-reaction-bg" x="350" y="90" width="200" height="35" fill="#ffffff" opacity="1" stroke="#c62828" stroke-width="2" style="display: none;"/>
            <text id="scene1-reaction-text" x="450" y="113" text-anchor="middle" font-size="16" fill="#c62828" style="display: none;">2H₂ + O₂ → 2H₂O</text>

            <!-- 中央标注 (初始隐藏) -->
            <text id="scene1-center-label" x="400" y="130" text-anchor="middle" font-size="14" fill="#2e7d32" style="display: none;">中央</text>

            <!-- 体积相等标注 (初始隐藏) - 移到更下方避免与按钮重叠 -->
            <text id="scene1-equal-label" x="400" y="470" text-anchor="middle" font-size="16" fill="#2e7d32" style="display: none;">体积相等</text>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现 - 密闭容器活塞系统状态变化
        // 布局坐标表对照：
        // 容器左壁：(100,150)-(100,350)
        // 容器右壁：(700,150)-(700,350)
        // 容器上壁：(100,150)-(700,150)
        // 容器下壁：(100,350)-(700,350)
        // 活塞初始：x=250 (1/4 位置)
        // 活塞最终：x=400 (中央位置)
        // 活塞左弹：x=200

        const currentStep = { value: 0 };
        const totalSteps = 4;

        // 获取 DOM 元素
        const pistonInitial = document.getElementById('scene1-piston-initial');
        const pistonFinal = document.getElementById('scene1-piston-final');
        const pistonLeft = document.getElementById('scene1-piston-left');
        const leftFill = document.getElementById('scene1-left-fill');
        const rightFill = document.getElementById('scene1-right-fill');
        const scaleLine1 = document.getElementById('scene1-scale-line-1');
        const scaleLine4 = document.getElementById('scene1-scale-line-4');
        const scaleLine2 = document.getElementById('scene1-scale-line-2');
        const scale1 = document.getElementById('scene1-scale-1');
        const scale4 = document.getElementById('scene1-scale-4');
        const scale2 = document.getElementById('scene1-scale-2');
        const vol1Left = document.getElementById('scene1-vol-1-left');
        const vol3Right = document.getElementById('scene1-vol-3-right');
        const vol2Left = document.getElementById('scene1-vol-2-left');
        const vol2Right = document.getElementById('scene1-vol-2-right');
        const pistonLabel = document.getElementById('scene1-piston-label');
        const reactionBg = document.getElementById('scene1-reaction-bg');
        const reactionText = document.getElementById('scene1-reaction-text');
        const centerLabel = document.getElementById('scene1-center-label');
        const equalLabel = document.getElementById('scene1-equal-label');
        const rightBorderReact = document.getElementById('scene1-right-border-react');
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const labelAirBg = document.getElementById('scene1-label-air-bg');
        const labelMixBg = document.getElementById('scene1-label-mix-bg');

        // 工具函数：显示元素
        function show(el) {
            el.style.display = 'block';
            el.style.opacity = '1';
        }

        // 工具函数：隐藏元素
        function hide(el) {
            el.style.display = 'none';
            el.style.opacity = '0';
        }

        // 更新按钮状态
        function updateButtons() {
            btnPrev.disabled = currentStep.value === 0;
            btnNext.disabled = currentStep.value === totalSteps - 1;
        }

        // 步骤 0: 初始状态
        function renderStep0() {
            // 活塞在初始位置 (x=250)
            show(pistonInitial);
            hide(pistonFinal);
            hide(pistonLeft);

            // 区域填充
            leftFill.setAttribute('x', '100');
            leftFill.setAttribute('width', '150');
            rightFill.setAttribute('x', '250');
            rightFill.setAttribute('width', '450');
            leftFill.style.opacity = '0.2';
            rightFill.style.opacity = '0.2';

            // 刻度
            show(scaleLine1);
            hide(scaleLine2);
            scale1.textContent = '1';
            scale4.textContent = '4';

            // 体积标注
            show(vol1Left);
            show(vol3Right);
            hide(vol2Left);
            hide(vol2Right);

            // 活塞标签位置
            pistonLabel.setAttribute('x', '250');
            pistonLabel.textContent = '活塞';

            // 隐藏反应相关
            hide(reactionBg);
            hide(reactionText);
            hide(centerLabel);
            hide(equalLabel);
            hide(rightBorderReact);

            updateButtons();
        }

        // 步骤 1: 点燃反应
        function renderStep1() {
            // 活塞左弹 (x=200)
            hide(pistonInitial);
            show(pistonLeft);
            hide(pistonFinal);

            // 区域填充调整
            leftFill.setAttribute('x', '100');
            leftFill.setAttribute('width', '100');
            rightFill.setAttribute('x', '200');
            rightFill.setAttribute('width', '500');
            leftFill.style.opacity = '0.2';
            rightFill.style.opacity = '0.4';

            // 显示反应式
            show(reactionBg);
            show(reactionText);

            // 右侧区域红色边框
            show(rightBorderReact);

            // 隐藏最终状态相关
            hide(scaleLine2);
            hide(centerLabel);
            hide(equalLabel);
            hide(vol2Left);
            hide(vol2Right);

            // 刻度保持
            show(scaleLine1);
            scale1.textContent = '1';
            scale4.textContent = '4';

            // 体积标注保持
            show(vol1Left);
            show(vol3Right);

            // 活塞标签位置
            pistonLabel.setAttribute('x', '200');

            updateButtons();
        }

        // 步骤 2: 冷却凝结 (动画过渡)
        function renderStep2() {
            // 活塞向右滑动 (从 x=200 向 x=400 移动)
            hide(pistonLeft);
            hide(pistonInitial);
            show(pistonFinal);

            // 区域填充调整
            leftFill.setAttribute('x', '100');
            leftFill.setAttribute('width', '300');
            rightFill.setAttribute('x', '400');
            rightFill.setAttribute('width', '300');
            leftFill.style.opacity = '0.2';
            rightFill.style.opacity = '0.2';

            // 隐藏反应相关
            hide(reactionBg);
            hide(reactionText);
            hide(rightBorderReact);

            // 显示最终状态相关
            show(scaleLine2);
            show(centerLabel);
            show(equalLabel);

            // 刻度更新
            show(scaleLine1);
            scale1.textContent = '1';
            scale2.textContent = '2';
            scale4.textContent = '4';

            // 体积标注更新
            hide(vol1Left);
            hide(vol3Right);
            show(vol2Left);
            show(vol2Right);

            // 活塞标签位置
            pistonLabel.setAttribute('x', '400');

            updateButtons();
        }

        // 步骤 3: 最终状态 (与步骤 2 相同，保持最终状态)
        function renderStep3() {
            renderStep2();
        }

        // 渲染当前步骤
        function render() {
            switch(currentStep.value) {
                case 0: renderStep0(); break;
                case 1: renderStep1(); break;
                case 2: renderStep2(); break;
                case 3: renderStep3(); break;
            }
        }

        // 事件监听
        btnPrev.addEventListener('click', function() {
            if (currentStep.value > 0) {
                currentStep.value--;
                render();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep.value < totalSteps - 1) {
                currentStep.value++;
                render();
            }
        });

        // 初始化
        render();
    })();
    </script>
</body>
</html>
