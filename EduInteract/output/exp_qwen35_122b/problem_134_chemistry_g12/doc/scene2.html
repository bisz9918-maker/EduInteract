<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 有机物结构分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; gap: 20px; z-index: 10; }
        .scene2-btn { padding: 10px 20px; font-size: 16px; cursor: pointer; border: 2px solid #1565c0; border-radius: 6px; background: #ffffff; color: #1565c0; transition: all 0.3s; }
        .scene2-btn:hover:not(:disabled) { background: #1565c0; color: #ffffff; }
        .scene2-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene2-svg-text { font-family: "Microsoft YaHei", sans-serif; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" id="scene2-svg">
            <text id="scene2-title" class="scene2-svg-text" x="400" y="55" text-anchor="middle" font-size="22" font-weight="bold" fill="#000000">三种分子结构</text>
            <g id="scene2-mol-a" style="display: block;">
                <line x1="200" y1="120" x2="150" y2="180" stroke="#000000" stroke-width="2"/>
                <line x1="200" y1="120" x2="250" y2="180" stroke="#000000" stroke-width="2"/>
                <line x1="150" y1="180" x2="200" y2="220" stroke="#000000" stroke-width="2"/>
                <line x1="250" y1="180" x2="200" y2="220" stroke="#000000" stroke-width="2"/>
                <line x1="150" y1="180" x2="250" y2="180" stroke="#000000" stroke-width="2" stroke-dasharray="5,5"/>
                <circle cx="200" cy="120" r="5" fill="#1565c0"/>
                <circle cx="150" cy="180" r="5" fill="#1565c0"/>
                <circle cx="250" cy="180" r="5" fill="#1565c0"/>
                <circle cx="200" cy="220" r="5" fill="#1565c0"/>
                <circle id="scene2-highlight-vertex1" cx="200" cy="120" r="10" fill="#c62828" opacity="0.3" style="display: none;"/>
                <circle id="scene2-highlight-vertex2" cx="150" cy="180" r="10" fill="#c62828" opacity="0.3" style="display: none;"/>
                <text id="scene2-formula-a" class="scene2-svg-text" x="200" y="100" text-anchor="middle" font-size="16" fill="#000000">C₄H₄</text>
                <text id="scene2-label-a" class="scene2-svg-text" x="200" y="245" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000">A</text>
            </g>
            <g id="scene2-mol-b" style="display: block;">
                <line x1="400" y1="120" x2="350" y2="160" stroke="#000000" stroke-width="2"/>
                <line x1="400" y1="120" x2="450" y2="160" stroke="#000000" stroke-width="2"/>
                <line x1="350" y1="160" x2="450" y2="160" stroke="#000000" stroke-width="2"/>
                <line x1="400" y1="200" x2="350" y2="240" stroke="#000000" stroke-width="2"/>
                <line x1="400" y1="200" x2="450" y2="240" stroke="#000000" stroke-width="2"/>
                <line x1="350" y1="240" x2="450" y2="240" stroke="#000000" stroke-width="2"/>
                <line x1="350" y1="160" x2="350" y2="240" stroke="#000000" stroke-width="2"/>
                <line x1="450" y1="160" x2="450" y2="240" stroke="#000000" stroke-width="2"/>
                <line x1="400" y1="120" x2="400" y2="200" stroke="#000000" stroke-width="2" stroke-dasharray="5,5"/>
                <circle cx="400" cy="120" r="5" fill="#1565c0"/>
                <circle cx="350" cy="160" r="5" fill="#1565c0"/>
                <circle cx="450" cy="160" r="5" fill="#1565c0"/>
                <circle cx="400" cy="200" r="5" fill="#1565c0"/>
                <circle cx="350" cy="240" r="5" fill="#1565c0"/>
                <circle cx="450" cy="240" r="5" fill="#1565c0"/>
                <g id="scene2-mark-cross" style="display: none;">
                    <line x1="435" y1="185" x2="465" y2="215" stroke="#c62828" stroke-width="3"/>
                    <line x1="465" y1="185" x2="435" y2="215" stroke="#c62828" stroke-width="3"/>
                </g>
                <text id="scene2-formula-b" class="scene2-svg-text" x="400" y="100" text-anchor="middle" font-size="16" fill="#000000">C₆H₆</text>
                <text id="scene2-label-b" class="scene2-svg-text" x="400" y="310" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000">B</text>
            </g>
            <g id="scene2-mol-c" style="display: block;">
                <line x1="600" y1="120" x2="550" y2="160" stroke="#000000" stroke-width="2"/>
                <line x1="600" y1="120" x2="650" y2="160" stroke="#000000" stroke-width="2"/>
                <line x1="550" y1="160" x2="600" y2="200" stroke="#000000" stroke-width="2"/>
                <line x1="650" y1="160" x2="600" y2="200" stroke="#000000" stroke-width="2"/>
                <line x1="600" y1="200" x2="550" y2="240" stroke="#000000" stroke-width="2"/>
                <line x1="600" y1="200" x2="650" y2="240" stroke="#000000" stroke-width="2"/>
                <line x1="550" y1="240" x2="600" y2="280" stroke="#000000" stroke-width="2"/>
                <line x1="650" y1="240" x2="600" y2="280" stroke="#000000" stroke-width="2"/>
                <line x1="550" y1="160" x2="550" y2="240" stroke="#000000" stroke-width="2"/>
                <line x1="650" y1="160" x2="650" y2="240" stroke="#000000" stroke-width="2"/>
                <line x1="600" y1="120" x2="600" y2="200" stroke="#000000" stroke-width="2" stroke-dasharray="5,5"/>
                <circle cx="600" cy="120" r="5" fill="#1565c0"/>
                <circle cx="550" cy="160" r="5" fill="#1565c0"/>
                <circle cx="650" cy="160" r="5" fill="#1565c0"/>
                <circle cx="600" cy="200" r="5" fill="#1565c0"/>
                <circle cx="550" cy="240" r="5" fill="#1565c0"/>
                <circle cx="650" cy="240" r="5" fill="#1565c0"/>
                <circle cx="600" cy="280" r="5" fill="#1565c0"/>
                <g id="scene2-mark-check" style="display: none;">
                    <polyline points="635,185 645,195 665,170" fill="none" stroke="#2e7d32" stroke-width="3"/>
                </g>
                <text id="scene2-formula-c" class="scene2-svg-text" x="600" y="100" text-anchor="middle" font-size="16" fill="#000000">C₈H₈</text>
                <text id="scene2-label-c" class="scene2-svg-text" x="600" y="310" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000">C</text>
            </g>
            <g id="scene2-mol-styrene" style="display: none;">
                <line x1="680" y1="140" x2="710" y2="140" stroke="#000000" stroke-width="2"/>
                <line x1="710" y1="140" x2="725" y2="165" stroke="#000000" stroke-width="2"/>
                <line x1="725" y1="165" x2="710" y2="190" stroke="#000000" stroke-width="2"/>
                <line x1="710" y1="190" x2="680" y2="190" stroke="#000000" stroke-width="2"/>
                <line x1="680" y1="190" x2="665" y2="165" stroke="#000000" stroke-width="2"/>
                <line x1="665" y1="165" x2="680" y2="140" stroke="#000000" stroke-width="2"/>
                <line x1="685" y1="145" x2="705" y2="145" stroke="#000000" stroke-width="1.5"/>
                <line x1="718" y1="165" x2="718" y2="185" stroke="#000000" stroke-width="1.5"/>
                <line x1="675" y1="165" x2="675" y2="185" stroke="#000000" stroke-width="1.5"/>
                <line x1="725" y1="165" x2="760" y2="165" stroke="#000000" stroke-width="2"/>
                <line x1="760" y1="165" x2="780" y2="185" stroke="#000000" stroke-width="2"/>
                <line id="scene2-double-bond-highlight" x1="760" y1="165" x2="780" y2="185" stroke="#c62828" stroke-width="5" opacity="0.7" style="display: none;"/>
                <circle cx="680" cy="140" r="5" fill="#1565c0"/>
                <circle cx="710" cy="140" r="5" fill="#1565c0"/>
                <circle cx="725" cy="165" r="5" fill="#1565c0"/>
                <circle cx="710" cy="190" r="5" fill="#1565c0"/>
                <circle cx="680" cy="190" r="5" fill="#1565c0"/>
                <circle cx="665" cy="165" r="5" fill="#1565c0"/>
                <circle cx="760" cy="165" r="5" fill="#1565c0"/>
                <circle cx="780" cy="185" r="5" fill="#1565c0"/>
                <text id="scene2-label-styrene" class="scene2-svg-text" x="725" y="120" text-anchor="middle" font-size="16" fill="#000000">苯乙烯</text>
            </g>
            <text id="scene2-simplest-formula-a" class="scene2-svg-text" x="200" y="265" text-anchor="middle" font-size="14" fill="#000000" style="display: none;">最简式：CH</text>
            <text id="scene2-simplest-formula-b" class="scene2-svg-text" x="400" y="330" text-anchor="middle" font-size="14" fill="#000000" style="display: none;">最简式：CH</text>
            <text id="scene2-simplest-formula-c" class="scene2-svg-text" x="600" y="330" text-anchor="middle" font-size="14" fill="#000000" style="display: none;">最简式：CH</text>
            <rect id="scene2-mark-correct-box" x="375" y="380" width="50" height="50" fill="none" stroke="#2e7d32" stroke-width="3" rx="5" style="display: none;"/>
            <text id="scene2-correct-letter" class="scene2-svg-text" x="400" y="415" text-anchor="middle" font-size="32" font-weight="bold" fill="#2e7d32" style="display: none;">C</text>
            <text id="scene2-conclusion" class="scene2-svg-text" x="400" y="380" text-anchor="middle" font-size="18" fill="#000000"></text>
        </svg>
        <div id="scene2-controls">
            <button id="scene2-btn-prev" class="scene2-btn">◀ 上一步</button>
            <button id="scene2-btn-next" class="scene2-btn">下一步 ▶</button>
        </div>
    </div>
    <script>
    (function() {
        const scene2 = {
            currentStep: 0,
            totalSteps: 6,
            elements: {
                title: document.getElementById('scene2-title'),
                conclusion: document.getElementById('scene2-conclusion'),
                molA: document.getElementById('scene2-mol-a'),
                molB: document.getElementById('scene2-mol-b'),
                molC: document.getElementById('scene2-mol-c'),
                molStyrene: document.getElementById('scene2-mol-styrene'),
                formulaA: document.getElementById('scene2-formula-a'),
                formulaB: document.getElementById('scene2-formula-b'),
                formulaC: document.getElementById('scene2-formula-c'),
                labelA: document.getElementById('scene2-label-a'),
                labelB: document.getElementById('scene2-label-b'),
                labelC: document.getElementById('scene2-label-c'),
                labelStyrene: document.getElementById('scene2-label-styrene'),
                highlightVertex1: document.getElementById('scene2-highlight-vertex1'),
                highlightVertex2: document.getElementById('scene2-highlight-vertex2'),
                markCross: document.getElementById('scene2-mark-cross'),
                markCheck: document.getElementById('scene2-mark-check'),
                doubleBondHighlight: document.getElementById('scene2-double-bond-highlight'),
                simplestFormulaA: document.getElementById('scene2-simplest-formula-a'),
                simplestFormulaB: document.getElementById('scene2-simplest-formula-b'),
                simplestFormulaC: document.getElementById('scene2-simplest-formula-c'),
                correctBox: document.getElementById('scene2-mark-correct-box'),
                correctLetter: document.getElementById('scene2-correct-letter'),
                btnPrev: document.getElementById('scene2-btn-prev'),
                btnNext: document.getElementById('scene2-btn-next')
            },
            stepConfig: [
                { title: '三种分子结构', conclusion: '', showMolA: true, showMolB: true, showMolC: true, showStyrene: false, showFormulaA: true, showFormulaB: true, showFormulaC: true, showLabelA: true, showLabelB: true, showLabelC: true, showHighlightVertex1: false, showHighlightVertex2: false, showMarkCross: false, showMarkCheck: false, showDoubleBondHighlight: false, showSimplestFormulaA: false, showSimplestFormulaB: false, showSimplestFormulaC: false, showCorrectBox: false, showCorrectLetter: false },
                { title: '选项 A 分析', conclusion: 'A 的二氯代物只有 1 种（任意两顶点等价）\n选项 A 错误', showMolA: true, showMolB: false, showMolC: false, showStyrene: false, showFormulaA: true, showFormulaB: false, showFormulaC: false, showLabelA: true, showLabelB: false, showLabelC: false, showHighlightVertex1: true, showHighlightVertex2: true, showMarkCross: false, showMarkCheck: false, showDoubleBondHighlight: false, showSimplestFormulaA: false, showSimplestFormulaB: false, showSimplestFormulaC: false, showCorrectBox: false, showCorrectLetter: false },
                { title: '选项 B 分析', conclusion: 'B 的分子式为 C₆H₆，不是 C₆H₁₂\n选项 B 错误', showMolA: false, showMolB: true, showMolC: false, showStyrene: false, showFormulaA: false, showFormulaB: true, showFormulaC: false, showLabelA: false, showLabelB: true, showLabelC: false, showHighlightVertex1: false, showHighlightVertex2: false, showMarkCross: true, showMarkCheck: false, showDoubleBondHighlight: false, showSimplestFormulaA: false, showSimplestFormulaB: false, showSimplestFormulaC: false, showCorrectBox: false, showCorrectLetter: false },
                { title: '选项 C 分析', conclusion: 'C 选项正确\n与 C 互为同分异构体的苯乙烯含碳碳双键，可使酸性 KMnO₄褪色', showMolA: false, showMolB: false, showMolC: true, showStyrene: true, showFormulaA: false, showFormulaB: false, showFormulaC: true, showLabelA: false, showLabelB: false, showLabelC: true, showHighlightVertex1: false, showHighlightVertex2: false, showMarkCross: false, showMarkCheck: true, showDoubleBondHighlight: true, showSimplestFormulaA: false, showSimplestFormulaB: false, showSimplestFormulaC: false, showCorrectBox: false, showCorrectLetter: false },
                { title: '选项 D 分析', conclusion: 'A、B、C 最简式相同，都是 CH\n选项 D 错误（不是只有 C 的最简式为 CH）', showMolA: true, showMolB: true, showMolC: true, showStyrene: false, showFormulaA: true, showFormulaB: true, showFormulaC: true, showLabelA: true, showLabelB: true, showLabelC: true, showHighlightVertex1: false, showHighlightVertex2: false, showMarkCross: false, showMarkCheck: false, showDoubleBondHighlight: false, showSimplestFormulaA: true, showSimplestFormulaB: true, showSimplestFormulaC: true, showCorrectBox: false, showCorrectLetter: false },
                { title: '正确答案', conclusion: '正确答案：C', showMolA: true, showMolB: true, showMolC: true, showStyrene: false, showFormulaA: true, showFormulaB: true, showFormulaC: true, showLabelA: true, showLabelB: true, showLabelC: true, showHighlightVertex1: false, showHighlightVertex2: false, showMarkCross: false, showMarkCheck: false, showDoubleBondHighlight: false, showSimplestFormulaA: false, showSimplestFormulaB: false, showSimplestFormulaC: false, showCorrectBox: true, showCorrectLetter: true }
            ],
            show: function(el) { if (el) { el.style.display = 'block'; el.style.opacity = '1'; } },
            hide: function(el) { if (el) { el.style.display = 'none'; el.style.opacity = '0'; } },
            updateView: function() {
                const config = this.stepConfig[this.currentStep];
                this.elements.title.textContent = config.title;
                this.elements.conclusion.textContent = config.conclusion;
                if (this.currentStep === 5) { this.elements.conclusion.style.fontSize = '24px'; this.elements.conclusion.style.fontWeight = 'bold'; this.elements.conclusion.style.fill = '#2e7d32'; }
                else if (this.currentStep === 3) { this.elements.conclusion.style.fontSize = '18px'; this.elements.conclusion.style.fontWeight = 'normal'; this.elements.conclusion.style.fill = '#2e7d32'; }
                else if (this.currentStep === 1 || this.currentStep === 2) { this.elements.conclusion.style.fontSize = '18px'; this.elements.conclusion.style.fontWeight = 'normal'; this.elements.conclusion.style.fill = '#c62828'; }
                else { this.elements.conclusion.style.fontSize = '18px'; this.elements.conclusion.style.fontWeight = 'normal'; this.elements.conclusion.style.fill = '#000000'; }
                config.showMolA ? this.show(this.elements.molA) : this.hide(this.elements.molA);
                config.showMolB ? this.show(this.elements.molB) : this.hide(this.elements.molB);
                config.showMolC ? this.show(this.elements.molC) : this.hide(this.elements.molC);
                config.showStyrene ? this.show(this.elements.molStyrene) : this.hide(this.elements.molStyrene);
                config.showFormulaA ? this.show(this.elements.formulaA) : this.hide(this.elements.formulaA);
                config.showFormulaB ? this.show(this.elements.formulaB) : this.hide(this.elements.formulaB);
                config.showFormulaC ? this.show(this.elements.formulaC) : this.hide(this.elements.formulaC);
                config.showLabelA ? this.show(this.elements.labelA) : this.hide(this.elements.labelA);
                config.showLabelB ? this.show(this.elements.labelB) : this.hide(this.elements.labelB);
                config.showLabelC ? this.show(this.elements.labelC) : this.hide(this.elements.labelC);
                config.showHighlightVertex1 ? this.show(this.elements.highlightVertex1) : this.hide(this.elements.highlightVertex1);
                config.showHighlightVertex2 ? this.show(this.elements.highlightVertex2) : this.hide(this.elements.highlightVertex2);
                config.showMarkCross ? this.show(this.elements.markCross) : this.hide(this.elements.markCross);
                config.showMarkCheck ? this.show(this.elements.markCheck) : this.hide(this.elements.markCheck);
                config.showDoubleBondHighlight ? this.show(this.elements.doubleBondHighlight) : this.hide(this.elements.doubleBondHighlight);
                config.showSimplestFormulaA ? this.show(this.elements.simplestFormulaA) : this.hide(this.elements.simplestFormulaA);
                config.showSimplestFormulaB ? this.show(this.elements.simplestFormulaB) : this.hide(this.elements.simplestFormulaB);
                config.showSimplestFormulaC ? this.show(this.elements.simplestFormulaC) : this.hide(this.elements.simplestFormulaC);
                config.showCorrectBox ? this.show(this.elements.correctBox) : this.hide(this.elements.correctBox);
                config.showCorrectLetter ? this.show(this.elements.correctLetter) : this.hide(this.elements.correctLetter);
                this.elements.btnPrev.disabled = (this.currentStep === 0);
                this.elements.btnNext.disabled = (this.currentStep === this.totalSteps - 1);
            },
            init: function() {
                this.elements.btnPrev.addEventListener('click', function() { if (scene2.currentStep > 0) { scene2.currentStep--; scene2.updateView(); } });
                this.elements.btnNext.addEventListener('click', function() { if (scene2.currentStep < scene2.totalSteps - 1) { scene2.currentStep++; scene2.updateView(); } });
                this.updateView();
            }
        };
        scene2.init();
    })();
    </script>
</body>
</html>
