<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 1 - 烃类化合物结构对比</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene1-btn { width: 100px; height: 36px; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; transition: all 0.2s; }
        .scene1-btn.active { background: #1565c0; color: white; }
        .scene1-btn.active:hover { background: #0d47a1; }
        .scene1-btn.disabled { background: #e0e0e0; color: #9e9e9e; cursor: not-allowed; }
        .scene1-molecule { opacity: 0; transition: opacity 0.3s ease; }
        .scene1-molecule.visible { opacity: 1; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-canvas" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 分子 A（正四面体烷）组 -->
            <g id="scene1-molA" class="scene1-molecule">
                <!-- 正四面体骨架 - 实线（可见棱） -->
                <line x1="180" y1="150" x2="130" y2="260" stroke="#000000" stroke-width="2"/>
                <line x1="180" y1="150" x2="230" y2="260" stroke="#000000" stroke-width="2"/>
                <line x1="130" y1="260" x2="230" y2="260" stroke="#000000" stroke-width="2"/>
                <line x1="180" y1="150" x2="180" y2="200" stroke="#000000" stroke-width="2"/>
                <line x1="130" y1="260" x2="180" y2="200" stroke="#000000" stroke-width="2" stroke-dasharray="4,4"/>
                <line x1="230" y1="260" x2="180" y2="200" stroke="#000000" stroke-width="2" stroke-dasharray="4,4"/>
                <!-- 顶点圆点（碳原子） -->
                <circle cx="180" cy="150" r="5" fill="#1565c0"/>
                <circle cx="130" cy="260" r="5" fill="#1565c0"/>
                <circle cx="230" cy="260" r="5" fill="#1565c0"/>
                <circle cx="180" cy="200" r="5" fill="#1565c0"/>
                <!-- C-H 键（从顶点向外延伸） -->
                <line x1="180" y1="150" x2="180" y2="125" stroke="#000000" stroke-width="1.5"/>
                <line x1="130" y1="260" x2="105" y2="275" stroke="#000000" stroke-width="1.5"/>
                <line x1="230" y1="260" x2="255" y2="275" stroke="#000000" stroke-width="1.5"/>
                <line x1="180" y1="200" x2="180" y2="175" stroke="#000000" stroke-width="1.5"/>
                <!-- H 标签（绿色） -->
                <text x="175" y="120" font-size="14" fill="#2e7d32" font-weight="bold">H</text>
                <text x="88" y="285" font-size="14" fill="#2e7d32" font-weight="bold">H</text>
                <text x="260" y="285" font-size="14" fill="#2e7d32" font-weight="bold">H</text>
                <text x="175" y="170" font-size="14" fill="#2e7d32" font-weight="bold">H</text>
                <!-- 名称和分子式标签 -->
                <text x="140" y="380" font-size="16" fill="#1565c0" font-weight="bold">正四面体烷</text>
                <text x="150" y="400" font-size="14" fill="#000000">C₄H₄</text>
            </g>
            
            <!-- 分子 B（三棱柱烷）组 -->
            <g id="scene1-molB" class="scene1-molecule">
                <!-- 三棱柱骨架 - 上底面 -->
                <line x1="370" y1="150" x2="400" y2="130" stroke="#000000" stroke-width="2"/>
                <line x1="400" y1="130" x2="430" y2="150" stroke="#000000" stroke-width="2"/>
                <line x1="370" y1="150" x2="430" y2="150" stroke="#000000" stroke-width="2"/>
                <!-- 三棱柱骨架 - 下底面 -->
                <line x1="370" y1="250" x2="400" y2="270" stroke="#000000" stroke-width="2"/>
                <line x1="400" y1="270" x2="430" y2="250" stroke="#000000" stroke-width="2"/>
                <line x1="370" y1="250" x2="430" y2="250" stroke="#000000" stroke-width="2"/>
                <!-- 三棱柱骨架 - 侧棱 -->
                <line x1="370" y1="150" x2="370" y2="250" stroke="#000000" stroke-width="2"/>
                <line x1="430" y1="150" x2="430" y2="250" stroke="#000000" stroke-width="2"/>
                <line x1="400" y1="130" x2="400" y2="270" stroke="#000000" stroke-width="2" stroke-dasharray="4,4"/>
                <!-- 顶点圆点（碳原子） -->
                <circle cx="370" cy="150" r="5" fill="#1565c0"/>
                <circle cx="400" cy="130" r="5" fill="#1565c0"/>
                <circle cx="430" cy="150" r="5" fill="#1565c0"/>
                <circle cx="370" cy="250" r="5" fill="#1565c0"/>
                <circle cx="400" cy="270" r="5" fill="#1565c0"/>
                <circle cx="430" cy="250" r="5" fill="#1565c0"/>
                <!-- C-H 键（从顶点向外延伸） -->
                <line x1="370" y1="150" x2="350" y2="140" stroke="#000000" stroke-width="1.5"/>
                <line x1="400" y1="130" x2="400" y2="105" stroke="#000000" stroke-width="1.5"/>
                <line x1="430" y1="150" x2="450" y2="140" stroke="#000000" stroke-width="1.5"/>
                <line x1="370" y1="250" x2="350" y2="260" stroke="#000000" stroke-width="1.5"/>
                <line x1="400" y1="270" x2="400" y2="295" stroke="#000000" stroke-width="1.5"/>
                <line x1="430" y1="250" x2="450" y2="260" stroke="#000000" stroke-width="1.5"/>
                <!-- H 标签（绿色） -->
                <text x="338" y="145" font-size="14" fill="#2e7d32" font-weight="bold">H</text>
                <text x="395" y="100" font-size="14" fill="#2e7d32" font-weight="bold">H</text>
                <text x="455" y="145" font-size="14" fill="#2e7d32" font-weight="bold">H</text>
                <text x="338" y="270" font-size="14" fill="#2e7d32" font-weight="bold">H</text>
                <text x="395" y="310" font-size="14" fill="#2e7d32" font-weight="bold">H</text>
                <text x="455" y="270" font-size="14" fill="#2e7d32" font-weight="bold">H</text>
                <!-- 名称和分子式标签 -->
                <text x="360" y="400" font-size="16" fill="#1565c0" font-weight="bold">三棱柱烷</text>
                <text x="370" y="420" font-size="14" fill="#000000">C₆H₆</text>
            </g>
            
            <!-- 分子 C（立方烷）组 -->
            <g id="scene1-molC" class="scene1-molecule">
                <!-- 立方体骨架 - 前面 -->
                <line x1="580" y1="160" x2="620" y2="140" stroke="#000000" stroke-width="2"/>
                <line x1="620" y1="140" x2="660" y2="160" stroke="#000000" stroke-width="2"/>
                <line x1="660" y1="160" x2="640" y2="180" stroke="#000000" stroke-width="2"/>
                <line x1="640" y1="180" x2="580" y2="160" stroke="#000000" stroke-width="2"/>
                <!-- 立方体骨架 - 后面 -->
                <line x1="590" y1="220" x2="630" y2="200" stroke="#000000" stroke-width="2"/>
                <line x1="630" y1="200" x2="670" y2="220" stroke="#000000" stroke-width="2"/>
                <line x1="670" y1="220" x2="650" y2="240" stroke="#000000" stroke-width="2"/>
                <line x1="650" y1="240" x2="590" y2="220" stroke="#000000" stroke-width="2"/>
                <!-- 立方体骨架 - 连接前后 -->
                <line x1="580" y1="160" x2="590" y2="220" stroke="#000000" stroke-width="2"/>
                <line x1="620" y1="140" x2="630" y2="200" stroke="#000000" stroke-width="2"/>
                <line x1="660" y1="160" x2="670" y2="220" stroke="#000000" stroke-width="2"/>
                <line x1="640" y1="180" x2="650" y2="240" stroke="#000000" stroke-width="2" stroke-dasharray="4,4"/>
                <!-- 顶点圆点（碳原子） -->
                <circle cx="580" cy="160" r="5" fill="#1565c0"/>
                <circle cx="620" cy="140" r="5" fill="#1565c0"/>
                <circle cx="660" cy="160" r="5" fill="#1565c0"/>
                <circle cx="640" cy="180" r="5" fill="#1565c0"/>
                <circle cx="590" cy="220" r="5" fill="#1565c0"/>
                <circle cx="630" cy="200" r="5" fill="#1565c0"/>
                <circle cx="670" cy="220" r="5" fill="#1565c0"/>
                <circle cx="650" cy="240" r="5" fill="#1565c0"/>
                <!-- C-H 键（从顶点向外延伸） -->
                <line x1="580" y1="160" x2="560" y2="150" stroke="#000000" stroke-width="1.5"/>
                <line x1="620" y1="140" x2="620" y2="115" stroke="#000000" stroke-width="1.5"/>
                <line x1="660" y1="160" x2="680" y2="150" stroke="#000000" stroke-width="1.5"/>
                <line x1="640" y1="180" x2="660" y2="170" stroke="#000000" stroke-width="1.5"/>
                <line x1="590" y1="220" x2="570" y2="230" stroke="#000000" stroke-width="1.5"/>
                <line x1="630" y1="200" x2="630" y2="175" stroke="#000000" stroke-width="1.5"/>
                <line x1="670" y1="220" x2="690" y2="230" stroke="#000000" stroke-width="1.5"/>
                <line x1="650" y1="240" x2="650" y2="265" stroke="#000000" stroke-width="1.5"/>
                <!-- H 标签（绿色） -->
                <text x="548" y="155" font-size="14" fill="#2e7d32" font-weight="bold">H</text>
                <text x="615" y="110" font-size="14" fill="#2e7d32" font-weight="bold">H</text>
                <text x="685" y="155" font-size="14" fill="#2e7d32" font-weight="bold">H</text>
                <text x="665" y="175" font-size="14" fill="#2e7d32" font-weight="bold">H</text>
                <text x="558" y="240" font-size="14" fill="#2e7d32" font-weight="bold">H</text>
                <text x="625" y="170" font-size="14" fill="#2e7d32" font-weight="bold">H</text>
                <text x="695" y="240" font-size="14" fill="#2e7d32" font-weight="bold">H</text>
                <text x="645" y="280" font-size="14" fill="#2e7d32" font-weight="bold">H</text>
                <!-- 名称和分子式标签 -->
                <text x="590" y="380" font-size="16" fill="#1565c0" font-weight="bold">立方烷</text>
                <text x="600" y="400" font-size="14" fill="#000000">C₈H₈</text>
            </g>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-prevBtn" class="scene1-btn disabled">◀上一步</button>
            <button id="scene1-nextBtn" class="scene1-btn active">下一步▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现 - 烃类化合物结构对比
        // 布局坐标表（参考）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // |------|------|-----------|------|-------------|------|
        // | 分子 A-正四面体骨架 | 线段组 | 中心 (180,220) | 140×140 | - | 正四面体投影 |
        // | 分子 A-顶点圆点 | 圆 | 4 个顶点位置 | 6×6 | - | 碳原子标记 |
        // | 分子 A-H 标签 | text | C-H 键末端 | ~12×12 | 外侧 | 绿色 |
        // | 分子 A-名称标签 | text | (140,380) | ~80×16 | - | 正四面体烷 |
        // | 分子 A-分子式标签 | text | (140,400) | ~60×14 | - | C₄H₄ |
        // | 分子 B-三棱柱骨架 | 线段组 | 中心 (400,220) | 140×160 | - | 三棱柱投影 |
        // | 分子 B-顶点圆点 | 圆 | 6 个顶点位置 | 6×6 | - | 碳原子标记 |
        // | 分子 B-H 标签 | text | C-H 键末端 | ~12×12 | 外侧 | 绿色 |
        // | 分子 B-名称标签 | text | (360,400) | ~80×16 | - | 三棱柱烷 |
        // | 分子 B-分子式标签 | text | (360,420) | ~60×14 | - | C₆H₆ |
        // | 分子 C-立方体骨架 | 线段组 | 中心 (620,220) | 140×140 | - | 立方体投影 |
        // | 分子 C-顶点圆点 | 圆 | 8 个顶点位置 | 6×6 | - | 碳原子标记 |
        // | 分子 C-H 标签 | text | C-H 键末端 | ~12×12 | 外侧 | 绿色 |
        // | 分子 C-名称标签 | text | (580,380) | ~60×16 | - | 立方烷 |
        // | 分子 C-分子式标签 | text | (580,400) | ~60×14 | - | C₈H₈ |
        
        const scene1 = {
            currentStep: 0,
            totalSteps: 4,
            
            elements: {
                prevBtn: null,
                nextBtn: null,
                molA: null,
                molB: null,
                molC: null
            },
            
            init: function() {
                this.elements.prevBtn = document.getElementById('scene1-prevBtn');
                this.elements.nextBtn = document.getElementById('scene1-nextBtn');
                this.elements.molA = document.getElementById('scene1-molA');
                this.elements.molB = document.getElementById('scene1-molB');
                this.elements.molC = document.getElementById('scene1-molC');
                
                this.elements.prevBtn.addEventListener('click', () => this.prevStep());
                this.elements.nextBtn.addEventListener('click', () => this.nextStep());
                
                this.updateStep();
            },
            
            updateStep: function() {
                // 根据当前步骤显示/隐藏分子
                if (this.currentStep >= 1) {
                    this.elements.molA.classList.add('visible');
                } else {
                    this.elements.molA.classList.remove('visible');
                }
                
                if (this.currentStep >= 2) {
                    this.elements.molB.classList.add('visible');
                } else {
                    this.elements.molB.classList.remove('visible');
                }
                
                if (this.currentStep >= 3) {
                    this.elements.molC.classList.add('visible');
                } else {
                    this.elements.molC.classList.remove('visible');
                }
                
                // 更新按钮状态
                if (this.currentStep === 0) {
                    this.elements.prevBtn.classList.add('disabled');
                    this.elements.prevBtn.classList.remove('active');
                    this.elements.nextBtn.classList.remove('disabled');
                    this.elements.nextBtn.classList.add('active');
                } else if (this.currentStep === this.totalSteps) {
                    this.elements.prevBtn.classList.remove('disabled');
                    this.elements.prevBtn.classList.add('active');
                    this.elements.nextBtn.classList.add('disabled');
                    this.elements.nextBtn.classList.remove('active');
                } else {
                    this.elements.prevBtn.classList.remove('disabled');
                    this.elements.prevBtn.classList.add('active');
                    this.elements.nextBtn.classList.remove('disabled');
                    this.elements.nextBtn.classList.add('active');
                }
            },
            
            prevStep: function() {
                if (this.currentStep > 0) {
                    this.currentStep--;
                    this.updateStep();
                }
            },
            
            nextStep: function() {
                if (this.currentStep < this.totalSteps) {
                    this.currentStep++;
                    this.updateStep();
                }
            }
        };
        
        // 初始化场景
        scene1.init();
    })();
    </script>
</body>
</html>
