<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>植株育种处理流程 - Scene 1</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 5px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene1-controls button { padding: 6px 16px; font-size: 14px; cursor: pointer; border: 1px solid #666; border-radius: 4px; background: #f5f5f5; }
        #scene1-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene1-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        .principle-box { font-size: 8px; text-align: center; display: none; opacity: 0; transition: opacity 0.3s ease; }
        .principle-box.visible { display: block; opacity: 1; }
        svg text { font-family: "Microsoft YaHei", sans-serif; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- 植株甲框 -->
            <rect id="scene1-box-plantA" x="50" y="60" width="150" height="140" fill="none" stroke="#000000" stroke-width="2"/>
            <!-- 植株甲花图标（简化花朵轮廓） -->
            <path id="scene1-flower-plantA" d="M125 85 C110 95, 95 110, 90 130 C85 150, 95 165, 110 175 C125 185, 140 175, 155 165 C170 155, 175 140, 170 120 C165 100, 150 85, 125 85 M125 100 C135 105, 140 115, 138 125 C136 135, 128 142, 118 140 C108 138, 102 128, 105 118 C108 108, 115 98, 125 100" fill="rgba(255,249,196,0.3)" stroke="#000000" stroke-width="1.5"/>
            <!-- 植株甲基因型 -->
            <text id="scene1-genotype-plantA" x="60" y="215" fill="#1565c0" font-size="14">aa bb</text>
            <!-- 植株甲表现型 -->
            <text id="scene1-phenotype-plantA" x="60" y="245" fill="#000000" font-size="12">黄色豆荚、绿色子叶</text>

            <!-- 植株乙框 -->
            <rect id="scene1-box-plantB" x="50" y="280" width="150" height="140" fill="none" stroke="#000000" stroke-width="2"/>
            <!-- 植株乙花图标 -->
            <path id="scene1-flower-plantB" d="M125 305 C110 315, 95 330, 90 350 C85 370, 95 385, 110 395 C125 405, 140 395, 155 385 C170 375, 175 360, 170 340 C165 320, 150 305, 125 305 M125 320 C135 325, 140 335, 138 345 C136 355, 128 362, 118 360 C108 358, 102 348, 105 338 C108 328, 115 318, 125 320" fill="rgba(200,230,201,0.3)" stroke="#000000" stroke-width="1.5"/>
            <!-- 植株乙基因型 -->
            <text id="scene1-genotype-plantB" x="60" y="435" fill="#1565c0" font-size="14">AA BB</text>
            <!-- 植株乙表现型 -->
            <text id="scene1-phenotype-plantB" x="60" y="465" fill="#000000" font-size="12">绿色豆荚、黄色子叶</text>

            <!-- 处理①箭头 -->
            <path id="scene1-arrow1" d="M210 130 L350 130" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrowhead1)"/>
            <!-- 处理①标签 -->
            <text id="scene1-label1" x="240" y="105" fill="#c62828" font-size="14" font-weight="normal">处理①</text>
            <!-- 无种子豆荚框 -->
            <rect id="scene1-box-result1" x="370" y="90" width="150" height="80" fill="none" stroke="#000000" stroke-width="1.5"/>
            <!-- 无种子豆荚图标（简化豆荚轮廓） -->
            <path id="scene1-pod-result1" d="M400 110 Q445 105, 490 115 Q485 135, 445 145 Q405 155, 395 135 Q390 120, 400 110" fill="rgba(255,249,196,0.3)" stroke="#000000" stroke-width="1.5"/>
            <!-- 无种子豆荚文字（移到框下方） -->
            <text id="scene1-text-result1" x="445" y="185" fill="#000000" font-size="12" text-anchor="middle">无种子豆荚</text>

            <!-- 处理②箭头（从植株甲） -->
            <path id="scene1-arrow2a" d="M210 160 L300 220" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrowhead2)"/>
            <!-- 处理②箭头（从植株乙） -->
            <path id="scene1-arrow2b" d="M210 310 L300 220" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrowhead2)"/>
            <!-- 处理②标签（向上移动避开箭头） -->
            <text id="scene1-label2" x="260" y="155" fill="#1565c0" font-size="14" font-weight="normal">处理②</text>
            <!-- 有种子豆荚框 -->
            <rect id="scene1-box-result2" x="370" y="200" width="150" height="80" fill="none" stroke="#000000" stroke-width="1.5"/>
            <!-- 有种子豆荚图标（豆荚 + 种子） -->
            <path id="scene1-pod-result2" d="M400 220 Q445 215, 490 225 Q485 245, 445 255 Q405 265, 395 245 Q390 230, 400 220" fill="rgba(255,249,196,0.3)" stroke="#000000" stroke-width="1.5"/>
            <circle id="scene1-seed-result2" cx="430" cy="235" r="6" fill="#ffeb3b" stroke="#000000" stroke-width="1"/>
            <circle id="scene1-seed-result2-2" cx="450" cy="240" r="5" fill="#ffeb3b" stroke="#000000" stroke-width="1"/>
            <!-- 有种子豆荚文字（移到框下方） -->
            <text id="scene1-text-result2" x="445" y="295" fill="#000000" font-size="12" text-anchor="middle">有种子豆荚</text>

            <!-- 处理③箭头 -->
            <path id="scene1-arrow3" d="M210 350 L350 350" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrowhead3)"/>
            <!-- 处理③标签 -->
            <text id="scene1-label3" x="240" y="330" fill="#2e7d32" font-size="14" font-weight="normal">处理③</text>
            <!-- 单倍体植株框 -->
            <rect id="scene1-box-result3" x="370" y="310" width="150" height="80" fill="none" stroke="#000000" stroke-width="1.5"/>
            <!-- 单倍体植株图标（简化小植株） -->
            <path id="scene1-plant-result3" d="M445 375 L445 345 M430 360 L445 345 L460 360 M435 350 L445 345 L455 350" fill="none" stroke="#2e7d32" stroke-width="2"/>
            <!-- 单倍体 n 标签（移到框右侧外部） -->
            <text id="scene1-n-label" x="525" y="345" fill="#2e7d32" font-size="12">n</text>
            <!-- 单倍体植株文字（移到框下方） -->
            <text id="scene1-text-result3" x="445" y="405" fill="#000000" font-size="12" text-anchor="middle">单倍体植株</text>

            <!-- 处理④箭头 -->
            <path id="scene1-arrow4" d="M530 350 L670 350" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrowhead4)"/>
            <!-- 处理④标签 -->
            <text id="scene1-label4" x="560" y="330" fill="#2e7d32" font-size="14" font-weight="normal">处理④</text>
            <!-- 二倍体植株框 -->
            <rect id="scene1-box-result4" x="690" y="310" width="110" height="80" fill="none" stroke="#000000" stroke-width="1.5"/>
            <!-- 二倍体植株图标（简化大植株） -->
            <path id="scene1-plant-result4" d="M745 375 L745 335 M735 365 L745 335 L755 365 M740 355 L745 335 L750 355 M730 370 L745 335 L760 370" fill="none" stroke="#2e7d32" stroke-width="2"/>
            <!-- 二倍体 2n 标签（移到框右侧外部） -->
            <text id="scene1-2n-label" x="805" y="345" fill="#2e7d32" font-size="12">2n</text>
            <!-- 二倍体植株文字（移到框下方） -->
            <text id="scene1-text-result4" x="745" y="405" fill="#000000" font-size="12" text-anchor="middle">二倍体植株</text>

            <!-- 箭头标记定义 -->
            <defs>
                <marker id="arrowhead1" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
                </marker>
                <marker id="arrowhead2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
                </marker>
                <marker id="arrowhead3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
                </marker>
                <marker id="arrowhead4" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
                </marker>
            </defs>

            <!-- 原理框（初始隐藏，调整位置和高度） -->
            <rect id="scene1-principle1" class="principle-box" x="50" y="465" width="150" height="25" fill="none" stroke="#c62828" stroke-width="1.5"/>
            <text id="scene1-principle1-text" class="principle-box" x="125" y="480" fill="#c62828" font-size="8" text-anchor="middle">生长素处理→单性结实</text>

            <rect id="scene1-principle2" class="principle-box" x="215" y="465" width="150" height="25" fill="none" stroke="#1565c0" stroke-width="1.5"/>
            <text id="scene1-principle2-text" class="principle-box" x="290" y="480" fill="#1565c0" font-size="8" text-anchor="middle">杂交→F1 种子（AaBb）</text>

            <rect id="scene1-principle3" class="principle-box" x="380" y="465" width="150" height="25" fill="none" stroke="#2e7d32" stroke-width="1.5"/>
            <text id="scene1-principle3-text" class="principle-box" x="455" y="480" fill="#2e7d32" font-size="8" text-anchor="middle">花药离体→单倍体（n）</text>

            <rect id="scene1-principle4" class="principle-box" x="545" y="465" width="150" height="25" fill="none" stroke="#2e7d32" stroke-width="1.5"/>
            <text id="scene1-principle4-text" class="principle-box" x="620" y="480" fill="#2e7d32" font-size="8" text-anchor="middle">秋水仙素→染色体加倍</text>
        </svg>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-prev-btn" disabled>◀ 上一步</button>
            <button id="scene1-next-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        // 布局坐标表（供参考）：
        // 植株甲框：(50,60)-(200,200)
        // 植株甲花图标：(80,80)-(170,180)
        // 植株甲基因型：(60,215) "aa bb"
        // 植株甲表现型：(60,245) "黄色豆荚、绿色子叶"
        // 植株乙框：(50,280)-(200,420)
        // 植株乙花图标：(80,300)-(170,400)
        // 植株乙基因型：(60,435) "AA BB"
        // 植株乙表现型：(60,465) "绿色豆荚、黄色子叶"
        // 处理①箭头：(210,130)-(350,130)
        // 处理①标签：(240,105)
        // 无种子豆荚框：(370,90)-(520,170)
        // 无种子豆荚文字：(445,185) 居中
        // 有种子豆荚框：(370,200)-(520,280)
        // 处理②箭头：(210,160)-(300,220) 和 (210,310)-(300,220)
        // 处理②标签：(260,155)
        // 有种子豆荚文字：(445,295) 居中
        // 处理③箭头：(210,350)-(350,350)
        // 处理③标签：(240,330)
        // 单倍体植株框：(370,310)-(520,390)
        // 单倍体 n 标签：(525,345) 框右侧
        // 单倍体植株文字：(445,405) 居中
        // 处理④箭头：(530,350)-(670,350)
        // 处理④标签：(560,330)
        // 二倍体植株框：(690,310)-(800,390)
        // 二倍体 2n 标签：(805,345) 框右侧
        // 二倍体植株文字：(745,405) 居中
        // 原理框①：(50,465)-(200,490)
        // 原理框②：(215,465)-(365,490)
        // 原理框③：(380,465)-(530,490)
        // 原理框④：(545,465)-(695,490)

        const TOTAL_STEPS = 5;
        let currentStep = 0;

        // 工具函数：显示元素
        function show(el) {
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }

        // 工具函数：隐藏元素
        function hide(el) {
            if (el) {
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }

        // 工具函数：重置元素样式
        function resetStyle(el, defaults) {
            if (el) {
                for (let key in defaults) {
                    el.style[key] = defaults[key];
                    el.setAttribute(key, defaults[key]);
                }
            }
        }

        // 工具函数：高亮元素
        function highlight(el, color, strokeWidth) {
            if (el) {
                el.style.stroke = color;
                el.setAttribute('stroke', color);
                if (strokeWidth !== undefined) {
                    el.style.strokeWidth = strokeWidth + 'px';
                    el.setAttribute('stroke-width', strokeWidth);
                }
            }
        }

        // 获取所有需要操作的元素
        const elements = {
            // 植株甲
            boxPlantA: document.getElementById('scene1-box-plantA'),
            flowerPlantA: document.getElementById('scene1-flower-plantA'),
            genotypePlantA: document.getElementById('scene1-genotype-plantA'),
            phenotypePlantA: document.getElementById('scene1-phenotype-plantA'),
            // 植株乙
            boxPlantB: document.getElementById('scene1-box-plantB'),
            flowerPlantB: document.getElementById('scene1-flower-plantB'),
            genotypePlantB: document.getElementById('scene1-genotype-plantB'),
            phenotypePlantB: document.getElementById('scene1-phenotype-plantB'),
            // 处理①
            arrow1: document.getElementById('scene1-arrow1'),
            label1: document.getElementById('scene1-label1'),
            boxResult1: document.getElementById('scene1-box-result1'),
            podResult1: document.getElementById('scene1-pod-result1'),
            textResult1: document.getElementById('scene1-text-result1'),
            // 处理②
            arrow2a: document.getElementById('scene1-arrow2a'),
            arrow2b: document.getElementById('scene1-arrow2b'),
            label2: document.getElementById('scene1-label2'),
            boxResult2: document.getElementById('scene1-box-result2'),
            podResult2: document.getElementById('scene1-pod-result2'),
            seedResult2: document.getElementById('scene1-seed-result2'),
            seedResult2_2: document.getElementById('scene1-seed-result2-2'),
            textResult2: document.getElementById('scene1-text-result2'),
            // 处理③
            arrow3: document.getElementById('scene1-arrow3'),
            label3: document.getElementById('scene1-label3'),
            boxResult3: document.getElementById('scene1-box-result3'),
            plantResult3: document.getElementById('scene1-plant-result3'),
            nLabel: document.getElementById('scene1-n-label'),
            textResult3: document.getElementById('scene1-text-result3'),
            // 处理④
            arrow4: document.getElementById('scene1-arrow4'),
            label4: document.getElementById('scene1-label4'),
            boxResult4: document.getElementById('scene1-box-result4'),
            plantResult4: document.getElementById('scene1-plant-result4'),
            _2nLabel: document.getElementById('scene1-2n-label'),
            textResult4: document.getElementById('scene1-text-result4'),
            // 原理框
            principle1: document.getElementById('scene1-principle1'),
            principle1Text: document.getElementById('scene1-principle1-text'),
            principle2: document.getElementById('scene1-principle2'),
            principle2Text: document.getElementById('scene1-principle2-text'),
            principle3: document.getElementById('scene1-principle3'),
            principle3Text: document.getElementById('scene1-principle3-text'),
            principle4: document.getElementById('scene1-principle4'),
            principle4Text: document.getElementById('scene1-principle4-text'),
            // 按钮
            prevBtn: document.getElementById('scene1-prev-btn'),
            nextBtn: document.getElementById('scene1-next-btn')
        };

        // 默认样式
        const defaultStyles = {
            arrow1: { stroke: '#000000', strokeWidth: '2' },
            arrow2a: { stroke: '#000000', strokeWidth: '2' },
            arrow2b: { stroke: '#000000', strokeWidth: '2' },
            arrow3: { stroke: '#000000', strokeWidth: '2' },
            arrow4: { stroke: '#000000', strokeWidth: '2' },
            label1: { fill: '#c62828', fontWeight: 'normal' },
            label2: { fill: '#1565c0', fontWeight: 'normal' },
            label3: { fill: '#2e7d32', fontWeight: 'normal' },
            label4: { fill: '#2e7d32', fontWeight: 'normal' },
            boxResult1: { stroke: '#000000', strokeWidth: '1.5' },
            boxResult2: { stroke: '#000000', strokeWidth: '1.5' },
            boxResult3: { stroke: '#000000', strokeWidth: '1.5' },
            boxResult4: { stroke: '#000000', strokeWidth: '1.5' },
            nLabel: { fill: '#2e7d32', fontWeight: 'normal' },
            _2nLabel: { fill: '#2e7d32', fontWeight: 'normal' }
        };

        // 更新场景状态
        function updateScene() {
            // 重置所有高亮
            resetStyle(elements.arrow1, defaultStyles.arrow1);
            resetStyle(elements.arrow2a, defaultStyles.arrow2a);
            resetStyle(elements.arrow2b, defaultStyles.arrow2b);
            resetStyle(elements.arrow3, defaultStyles.arrow3);
            resetStyle(elements.arrow4, defaultStyles.arrow4);
            resetStyle(elements.label1, defaultStyles.label1);
            resetStyle(elements.label2, defaultStyles.label2);
            resetStyle(elements.label3, defaultStyles.label3);
            resetStyle(elements.label4, defaultStyles.label4);
            resetStyle(elements.boxResult1, defaultStyles.boxResult1);
            resetStyle(elements.boxResult2, defaultStyles.boxResult2);
            resetStyle(elements.boxResult3, defaultStyles.boxResult3);
            resetStyle(elements.boxResult4, defaultStyles.boxResult4);
            resetStyle(elements.nLabel, defaultStyles.nLabel);
            resetStyle(elements._2nLabel, defaultStyles._2nLabel);

            // 隐藏所有原理框
            hide(elements.principle1);
            hide(elements.principle1Text);
            hide(elements.principle2);
            hide(elements.principle2Text);
            hide(elements.principle3);
            hide(elements.principle3Text);
            hide(elements.principle4);
            hide(elements.principle4Text);

            // 根据当前步骤更新状态
            switch (currentStep) {
                case 0: // 初始状态
                    // 所有元素正常显示，无高亮
                    break;

                case 1: // 高亮处理①
                    highlight(elements.arrow1, '#c62828', 3);
                    elements.label1.style.fontWeight = 'bold';
                    elements.label1.setAttribute('font-weight', 'bold');
                    highlight(elements.boxResult1, '#c62828', 2);
                    show(elements.principle1);
                    show(elements.principle1Text);
                    break;

                case 2: // 高亮处理②
                    highlight(elements.arrow2a, '#1565c0', 3);
                    highlight(elements.arrow2b, '#1565c0', 3);
                    elements.label2.style.fontWeight = 'bold';
                    elements.label2.setAttribute('font-weight', 'bold');
                    highlight(elements.boxResult2, '#1565c0', 2);
                    show(elements.principle2);
                    show(elements.principle2Text);
                    break;

                case 3: // 高亮处理③
                    highlight(elements.arrow3, '#2e7d32', 3);
                    elements.label3.style.fontWeight = 'bold';
                    elements.label3.setAttribute('font-weight', 'bold');
                    highlight(elements.boxResult3, '#2e7d32', 2);
                    elements.nLabel.style.fontWeight = 'bold';
                    elements.nLabel.setAttribute('font-weight', 'bold');
                    show(elements.principle3);
                    show(elements.principle3Text);
                    break;

                case 4: // 高亮处理④
                    highlight(elements.arrow4, '#2e7d32', 3);
                    elements.label4.style.fontWeight = 'bold';
                    elements.label4.setAttribute('font-weight', 'bold');
                    highlight(elements.boxResult4, '#2e7d32', 2);
                    elements._2nLabel.style.fontWeight = 'bold';
                    elements._2nLabel.setAttribute('font-weight', 'bold');
                    show(elements.principle4);
                    show(elements.principle4Text);
                    break;

                case 5: // 总结对比
                    // 高亮所有处理箭头
                    highlight(elements.arrow1, '#c62828', 3);
                    highlight(elements.arrow2a, '#1565c0', 3);
                    highlight(elements.arrow2b, '#1565c0', 3);
                    highlight(elements.arrow3, '#2e7d32', 3);
                    highlight(elements.arrow4, '#2e7d32', 3);
                    // 高亮所有结果框
                    highlight(elements.boxResult1, '#c62828', 2);
                    highlight(elements.boxResult2, '#1565c0', 2);
                    highlight(elements.boxResult3, '#2e7d32', 2);
                    highlight(elements.boxResult4, '#2e7d32', 2);
                    // 显示所有原理框
                    show(elements.principle1);
                    show(elements.principle1Text);
                    show(elements.principle2);
                    show(elements.principle2Text);
                    show(elements.principle3);
                    show(elements.principle3Text);
                    show(elements.principle4);
                    show(elements.principle4Text);
                    break;
            }

            // 更新按钮状态
            elements.prevBtn.disabled = (currentStep === 0);
            elements.nextBtn.disabled = (currentStep === TOTAL_STEPS);
        }

        // 按钮事件绑定
        elements.prevBtn.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        elements.nextBtn.addEventListener('click', function() {
            if (currentStep < TOTAL_STEPS) {
                currentStep++;
                updateScene();
            }
        });

        // 初始化场景
        updateScene();
    })();
    </script>
</body>
</html>
