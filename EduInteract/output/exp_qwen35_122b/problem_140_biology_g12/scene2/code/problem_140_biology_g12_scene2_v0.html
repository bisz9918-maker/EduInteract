<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2: 减数分裂异常产生 XXY 个体机制</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene2-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 2px solid #333; border-radius: 6px; background: #f5f5f5; transition: all 0.3s; }
        .scene2-btn:hover { background: #e0e0e0; }
        .scene2-btn.active { background: #1565c0; color: white; border-color: #1565c0; }
        .scene2-btn.inactive { opacity: 0.5; }
        svg { display: block; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" id="scene2-svg">
            <!-- 标题（调整 y 坐标避免裁剪） -->
            <text x="400" y="40" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">减数分裂异常产生 XXY 个体机制</text>
            
            <!-- 左侧：雄果蝇 M 初始性染色体区（始终显示） -->
            <text x="80" y="100" font-size="14" fill="#333">雄果蝇 M</text>
            <!-- X^E 染色体（初始） -->
            <polygon id="scene2-chrom-xe-init" points="90,140 110,140 105,200 95,200" fill="#1565c0" fill-opacity="0.2" stroke="#000" stroke-width="2"/>
            <!-- Y 染色体（初始） -->
            <polygon id="scene2-chrom-y-init" points="130,150 150,150 145,200 135,200" fill="#1565c0" fill-opacity="0.2" stroke="#000" stroke-width="2"/>
            <text id="scene2-label-xe-init" x="85" y="130" font-size="12" fill="#333">X^E</text>
            <text id="scene2-label-y-init" x="140" y="130" font-size="12" fill="#333">Y</text>
            
            <!-- 中间上部：正常减数分裂区（状态 1） -->
            <text id="scene2-title-normal" x="340" y="60" font-size="14" fill="#333" style="display:none;">正常减数分裂</text>
            <!-- 正常减 I 细胞 -->
            <ellipse id="scene2-cell-normal" cx="350" cy="120" rx="60" ry="40" fill="none" stroke="#000" stroke-width="2" style="display:none;"/>
            <!-- 正常 X^E 移向左 -->
            <polygon id="scene2-chrom-xe-normal" points="310,130 330,130 325,170 315,170" fill="#1565c0" fill-opacity="0.4" stroke="#000" stroke-width="2" style="display:none;"/>
            <!-- 正常 Y 移向右 -->
            <polygon id="scene2-chrom-y-normal" points="370,130 390,130 385,170 375,170" fill="#1565c0" fill-opacity="0.4" stroke="#000" stroke-width="2" style="display:none;"/>
            <!-- 正常分裂箭头 -->
            <line id="scene2-arrow-normal-1" x1="350" y1="160" x2="310" y2="190" stroke="#888" stroke-width="2" stroke-dasharray="5,5" style="display:none;"/>
            <line id="scene2-arrow-normal-2" x1="350" y1="160" x2="370" y2="190" stroke="#888" stroke-width="2" stroke-dasharray="5,5" style="display:none;"/>
            <!-- 正常配子 X^E（椭圆上移，标签放在椭圆下方） -->
            <ellipse id="scene2-gamete-xe" cx="310" cy="220" rx="20" ry="25" fill="#1565c0" fill-opacity="0.4" stroke="#000" stroke-width="2" style="display:none;"/>
            <text id="scene2-label-gamete-xe" x="310" y="255" text-anchor="middle" font-size="12" fill="#333" style="display:none;">X^E</text>
            <!-- 正常配子 Y（椭圆上移，标签放在椭圆下方） -->
            <ellipse id="scene2-gamete-y" cx="370" cy="220" rx="20" ry="25" fill="#1565c0" fill-opacity="0.4" stroke="#000" stroke-width="2" style="display:none;"/>
            <text id="scene2-label-gamete-y" x="370" y="255" text-anchor="middle" font-size="12" fill="#333" style="display:none;">Y</text>
            
            <!-- 中间下部：异常减数分裂区（状态 2） -->
            <text id="scene2-title-abnormal" x="340" y="280" font-size="14" fill="#333" style="display:none;">异常减数分裂</text>
            <!-- 异常减 I 细胞 -->
            <ellipse id="scene2-cell-abnormal" cx="350" cy="320" rx="60" ry="40" fill="none" stroke="#000" stroke-width="2" style="display:none;"/>
            <!-- 异常 X^E 移向同一极 -->
            <polygon id="scene2-chrom-xe-abnormal" points="310,330 330,330 325,370 315,370" fill="#c62828" fill-opacity="0.4" stroke="#000" stroke-width="2" style="display:none;"/>
            <!-- 异常 Y 移向同一极 -->
            <polygon id="scene2-chrom-y-abnormal" points="340,330 360,330 355,370 345,370" fill="#c62828" fill-opacity="0.4" stroke="#000" stroke-width="2" style="display:none;"/>
            <!-- 异常分裂箭头 -->
            <line id="scene2-arrow-abnormal-1" x1="350" y1="360" x2="310" y2="390" stroke="#888" stroke-width="2" stroke-dasharray="5,5" style="display:none;"/>
            <line id="scene2-arrow-abnormal-2" x1="350" y1="360" x2="370" y2="390" stroke="#888" stroke-width="2" stroke-dasharray="5,5" style="display:none;"/>
            <!-- 异常配子 X^E Y（椭圆下移，标签放在椭圆下方） -->
            <ellipse id="scene2-gamete-xey" cx="310" cy="410" rx="25" ry="20" fill="#c62828" fill-opacity="0.4" stroke="#000" stroke-width="2" style="display:none;"/>
            <text id="scene2-label-gamete-xey" x="310" y="440" text-anchor="middle" font-size="12" fill="#333" style="display:none;">X^E Y</text>
            <!-- 异常配子无性染色体（椭圆下移，标签放在椭圆下方） -->
            <ellipse id="scene2-gamete-none" cx="370" cy="410" rx="20" ry="25" fill="#c62828" fill-opacity="0.4" stroke="#000" stroke-width="2" style="display:none;"/>
            <text id="scene2-label-gamete-none" x="370" y="445" text-anchor="middle" font-size="10" fill="#333" style="display:none;">无性染色体</text>
            
            <!-- 右侧：受精与子代区（始终显示） -->
            <text id="scene2-title-fertilization" x="620" y="160" font-size="14" fill="#333">受精过程</text>
            <!-- 白眼雌果蝇配子 X^e（椭圆上移，标签放在椭圆上方） -->
            <ellipse id="scene2-gamete-xe-female" cx="640" cy="200" rx="20" ry="25" fill="#2e7d32" fill-opacity="0.4" stroke="#000" stroke-width="2"/>
            <text id="scene2-label-gamete-xe-female" x="640" y="175" text-anchor="middle" font-size="12" fill="#333">X^e</text>
            <!-- 受精箭头（从异常配子指向子代） -->
            <line id="scene2-arrow-fertilization" x1="360" y1="410" x2="610" y2="330" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5,5" style="display:none;"/>
            <!-- XXY 子代个体（椭圆下移，标签放在椭圆上方） -->
            <ellipse id="scene2-offspring" cx="640" cy="340" rx="30" ry="25" fill="#2e7d32" fill-opacity="0.4" stroke="#000" stroke-width="2"/>
            <text id="scene2-label-offspring" x="640" y="315" text-anchor="middle" font-size="12" fill="#333">X^E X^e Y</text>
            
            <!-- 状态说明文字（移到更下方，避免与按钮重叠） -->
            <text id="scene2-status-text" x="400" y="460" text-anchor="middle" font-size="14" fill="#666">请选择分裂状态查看</text>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-btn-normal" class="scene2-btn">正常分裂</button>
            <button id="scene2-btn-abnormal" class="scene2-btn">异常分裂</button>
        </div>
    </div>
    
    <script>
    (function() {
        const sceneId = 'scene2';
        let currentState = 0; // 0=初始，1=正常分裂，2=异常分裂
        
        // 获取所有 DOM 元素
        const elements = {
            // 正常分裂区元素
            titleNormal: document.getElementById('scene2-title-normal'),
            cellNormal: document.getElementById('scene2-cell-normal'),
            chromXeNormal: document.getElementById('scene2-chrom-xe-normal'),
            chromYNormal: document.getElementById('scene2-chrom-y-normal'),
            arrowNormal1: document.getElementById('scene2-arrow-normal-1'),
            arrowNormal2: document.getElementById('scene2-arrow-normal-2'),
            gameteXe: document.getElementById('scene2-gamete-xe'),
            labelGameteXe: document.getElementById('scene2-label-gamete-xe'),
            gameteY: document.getElementById('scene2-gamete-y'),
            labelGameteY: document.getElementById('scene2-label-gamete-y'),
            
            // 异常分裂区元素
            titleAbnormal: document.getElementById('scene2-title-abnormal'),
            cellAbnormal: document.getElementById('scene2-cell-abnormal'),
            chromXeAbnormal: document.getElementById('scene2-chrom-xe-abnormal'),
            chromYAbnormal: document.getElementById('scene2-chrom-y-abnormal'),
            arrowAbnormal1: document.getElementById('scene2-arrow-abnormal-1'),
            arrowAbnormal2: document.getElementById('scene2-arrow-abnormal-2'),
            gameteXey: document.getElementById('scene2-gamete-xey'),
            labelGameteXey: document.getElementById('scene2-label-gamete-xey'),
            gameteNone: document.getElementById('scene2-gamete-none'),
            labelGameteNone: document.getElementById('scene2-label-gamete-none'),
            
            // 受精区元素
            titleFertilization: document.getElementById('scene2-title-fertilization'),
            arrowFertilization: document.getElementById('scene2-arrow-fertilization'),
            offspring: document.getElementById('scene2-offspring'),
            labelOffspring: document.getElementById('scene2-label-offspring'),
            gameteXeFemale: document.getElementById('scene2-gamete-xe-female'),
            labelGameteXeFemale: document.getElementById('scene2-label-gamete-xe-female'),
            
            // 状态说明
            statusText: document.getElementById('scene2-status-text'),
            
            // 按钮
            btnNormal: document.getElementById('scene2-btn-normal'),
            btnAbnormal: document.getElementById('scene2-btn-abnormal')
        };
        
        // 工具函数：显示元素
        function show(el) {
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }
        
        // 工具函数：隐藏元素
        function hide(el) {
            if (el) {
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }
        
        // 切换状态函数
        function switchState(newState) {
            currentState = newState;
            
            // 重置所有状态相关元素
            hide(elements.titleNormal);
            hide(elements.cellNormal);
            hide(elements.chromXeNormal);
            hide(elements.chromYNormal);
            hide(elements.arrowNormal1);
            hide(elements.arrowNormal2);
            hide(elements.gameteXe);
            hide(elements.labelGameteXe);
            hide(elements.gameteY);
            hide(elements.labelGameteY);
            
            hide(elements.titleAbnormal);
            hide(elements.cellAbnormal);
            hide(elements.chromXeAbnormal);
            hide(elements.chromYAbnormal);
            hide(elements.arrowAbnormal1);
            hide(elements.arrowAbnormal2);
            hide(elements.gameteXey);
            hide(elements.labelGameteXey);
            hide(elements.gameteNone);
            hide(elements.labelGameteNone);
            
            hide(elements.arrowFertilization);
            hide(elements.statusText);
            
            // 重置按钮状态
            elements.btnNormal.classList.remove('active');
            elements.btnAbnormal.classList.remove('active');
            
            // 根据状态显示对应元素
            if (newState === 1) {
                // 正常分裂状态
                show(elements.titleNormal);
                show(elements.cellNormal);
                show(elements.chromXeNormal);
                show(elements.chromYNormal);
                show(elements.arrowNormal1);
                show(elements.arrowNormal2);
                show(elements.gameteXe);
                show(elements.labelGameteXe);
                show(elements.gameteY);
                show(elements.labelGameteY);
                
                elements.btnNormal.classList.add('active');
                elements.btnAbnormal.classList.add('inactive');
                
                elements.statusText.textContent = '正常减数分裂：X^E 和 Y 染色体正常分离，形成两种配子';
                show(elements.statusText);
                
            } else if (newState === 2) {
                // 异常分裂状态
                show(elements.titleAbnormal);
                show(elements.cellAbnormal);
                show(elements.chromXeAbnormal);
                show(elements.chromYAbnormal);
                show(elements.arrowAbnormal1);
                show(elements.arrowAbnormal2);
                show(elements.gameteXey);
                show(elements.labelGameteXey);
                show(elements.gameteNone);
                show(elements.labelGameteNone);
                show(elements.arrowFertilization);
                
                elements.btnAbnormal.classList.add('active');
                elements.btnNormal.classList.add('inactive');
                
                elements.statusText.textContent = '异常减数分裂：减 I 后期 X^E 和 Y 未分离，形成 X^E Y 异常配子，与 X^e 结合形成 XXY 个体';
                show(elements.statusText);
            }
        }
        
        // 初始化
        function init() {
            // 绑定按钮事件
            elements.btnNormal.addEventListener('click', function() {
                switchState(1);
            });
            
            elements.btnAbnormal.addEventListener('click', function() {
                switchState(2);
            });
            
            // 初始状态：显示左侧染色体和右侧受精区，中间区域等待选择
            currentState = 0;
            elements.statusText.textContent = '请选择分裂状态查看';
            show(elements.statusText);
        }
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', init);
    })();
    </script>
</body>
</html>
