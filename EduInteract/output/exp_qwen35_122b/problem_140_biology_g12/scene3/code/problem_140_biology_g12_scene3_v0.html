            const el = document.getElementById(elId);
            if (el) {
                el.style.opacity = '1';
                el.style.display = 'block';
            }
        }
        
        // 工具函数：隐藏元素
        function hide(elId) {
            const el = document.getElementById(elId);
            if (el) {
                el.style.opacity = '0';
                el.style.display = 'none';
            }
        }
        
        // 更新步骤显示

            document.getElementById('scene3-step-indicator').textContent = '步骤 ' + currentStep + '/' + currentStepMax;
            
            // 更新按钮状态

            document.getElementById('scene3-btn-next').disabled = (currentStep === currentStepMax);

                    hide('scene3-text-row-vr-dead');

                            hide('scene3-cross-' + i + '-' + j + '-2');

                    show('scene3-arrow1-head');

                    show('scene3-text-col-header');
                    show('scene3-text-col-vr');
                    show('scene3-text-col-vr2');
                    show('scene3-text-col-vR');
                    show('scene3-text-col-vr-dead');
                    show('scene3-text-col-vr-dead-label');
                    show('scene3-text-row-vr');
                    show('scene3-text-row-vr2');
                    show('scene3-text-row-vR');
                    show('scene3-text-row-vr-dead');
                    show('scene3-text-row-vr-dead-label');
                    // 显示所有格子框架和基因型
                    for (let i = 1; i <= 4; i++) {
                        for (let j = 1; j <= 4; j++) {
                            show('scene3-cell-' + i + '-' + j);
                            show('scene3-cell-text-' + i + '-' + j);

                    }
                    // 显示致死叉号（vr 行和 vr 列）
                    show('scene3-cross-1-4');
                    show('scene3-cross-1-4-2');
                    show('scene3-cross-2-4');
                    show('scene3-cross-2-4-2');
                    show('scene3-cross-3-4');
                    show('scene3-cross-3-4-2');
                    show('scene3-cross-4-1');
                    show('scene3-cross-4-1-2');
                    show('scene3-cross-4-2');
                    show('scene3-cross-4-2-2');
                    show('scene3-cross-4-3');
                    show('scene3-cross-4-3-2');
                    show('scene3-cross-4-4');
                    show('scene3-cross-4-4-2');
                    show('scene3-text-stat-label');
                    show('scene3-text-stat-1');
                    show('scene3-text-stat-2');
                    show('scene3-text-stat-3');
                    show('scene3-text-stat-4');

                case 5:
                    // 显示结论
                    show('scene3-text-p');
                    show('scene3-text-parent1');
                    show('scene3-text-parent1-genotype');
                    show('scene3-arrow1');
                    show('scene3-arrow1-head');
                    show('scene3-text-parent2');
                    show('scene3-text-parent2-genotype');
                    show('scene3-text-f1-label');

                    show('scene3-text-f1-phenotype');

                    show('scene3-arrow2-head');
                    show('scene3-text-f2-label');
                    show('scene3-text-col-header');
                    show('scene3-text-col-vr');
                    show('scene3-text-col-vr2');
                    show('scene3-text-col-vR');
                    show('scene3-text-col-vr-dead');
                    show('scene3-text-col-vr-dead-label');
                    show('scene3-text-row-vr');
                    show('scene3-text-row-vr2');
                    show('scene3-text-row-vR');
                    show('scene3-text-row-vr-dead');
                    show('scene3-text-row-vr-dead-label');
                    // 显示所有格子框架和基因型
                    for (let i = 1; i <= 4; i++) {
                        for (let j = 1; j <= 4; j++) {
                            show('scene3-cell-' + i + '-' + j);
                            show('scene3-cell-text-' + i + '-' + j);

                    }
                    // 显示致死叉号
                    show('scene3-cross-1-4');

                    show('scene3-cross-2-4-2');
                    show('scene3-cross-3-4');
                    show('scene3-cross-3-4-2');
                    show('scene3-cross-4-1');
                    show('scene3-cross-4-1-2');
                    show('scene3-cross-4-2');
                    show('scene3-cross-4-2-2');
                    show('scene3-cross-4-3');
                    show('scene3-cross-4-3-2');
                    show('scene3-cross-4-4');
                    show('scene3-cross-4-4-2');
                    show('scene3-text-stat-label');
                    show('scene3-text-stat-1');
                    show('scene3-text-stat-2');
                    show('scene3-text-stat-3');
                    show('scene3-text-stat-4');
                    show('scene3-text-conclusion');
                    break;
            }
        }
        
        // 按钮事件绑定
        document.getElementById('scene3-btn-prev').addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });
        
        document.getElementById('scene3-btn-next').addEventListener('click', function() {
            if (currentStep < currentStepMax) {
                currentStep++;
                updateStep();
            }
        });
        
        // 初始化
        updateStep();
    })();
    </script>
