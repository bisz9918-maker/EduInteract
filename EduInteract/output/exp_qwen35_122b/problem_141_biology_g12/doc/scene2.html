<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2: 染色体遗传与线粒体遗传对比</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        .scene2-btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .scene2-btn-prev { background: #9e9e9e; color: white; }
        .scene2-btn-prev:disabled { background: #bdbdbd; cursor: not-allowed; }
        .scene2-btn-next { background: #1976d2; color: white; }
        .scene2-btn-next:disabled { background: #64b5f6; cursor: not-allowed; }
        .scene2-step-indicator { font-size: 14px; color: #666; }
        .scene2-hidden { display: none !important; opacity: 0 !important; }
        .scene2-fade-in { animation: scene2-fadeIn 0.3s ease; }
        @keyframes scene2-fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .scene2-flash { animation: scene2-flash 0.5s ease 2; }
        @keyframes scene2-flash { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body>
    <div id="scene2-container">
        <!-- SVG 图示区：固定 800×500px -->
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene2-arrow-chrom" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
                    <path d="M0,0 L10,5 L0,10 L2,5 Z" fill="#1565c0"/>
                </marker>
                <marker id="scene2-arrow-herit" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
                    <path d="M0,0 L10,5 L0,10 L2,5 Z" fill="#000000"/>
                </marker>
            </defs>

            <!-- 标题 -->
            <text x="400" y="20" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000">染色体遗传与线粒体遗传对比</text>

            <!-- 左侧背景框：染色体遗传（稳定） -->
            <rect x="50" y="60" width="320" height="340" fill="#e3f2fd" stroke="#1565c0" stroke-width="1"/>
            <text x="210" y="45" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">染色体遗传（稳定）</text>

            <!-- 右侧背景框：线粒体遗传（逐代减弱） -->
            <rect x="430" y="60" width="320" height="340" fill="#ffebee" stroke="#c62828" stroke-width="1"/>
            <text x="590" y="45" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">线粒体遗传（逐代减弱）</text>

            <!-- ============ 左侧：染色体遗传 ============ -->
            <!-- 亲代 -->
            <text id="scene2-chrom-parent-label" x="210" y="80" text-anchor="middle" font-size="12" fill="#000000">亲代</text>
            <line id="scene2-chrom-parent-1" x1="190" y1="100" x2="190" y2="160" stroke="#1565c0" stroke-width="2" marker-end="url(#scene2-arrow-chrom)"/>
            <line id="scene2-chrom-parent-2" x1="230" y1="100" x2="230" y2="160" stroke="#1565c0" stroke-width="2" marker-end="url(#scene2-arrow-chrom)"/>
            <rect id="scene2-chrom-parent-bar" x="180" y="170" width="60" height="10" fill="#2e7d32"/>
            <text id="scene2-chrom-parent-bar-text" x="210" y="165" text-anchor="middle" font-size="10" fill="#000000">100%</text>

            <!-- 遗传箭头 1 -->
            <path id="scene2-chrom-arrow-1" d="M210,185 L210,210" stroke="#000000" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#scene2-arrow-herit)" class="scene2-hidden"/>

            <!-- 子一代 -->
            <text id="scene2-chrom-f1-label" x="210" y="200" text-anchor="middle" font-size="12" fill="#000000" class="scene2-hidden">子一代</text>
            <line id="scene2-chrom-f1-1" x1="190" y1="220" x2="190" y2="280" stroke="#1565c0" stroke-width="2" marker-end="url(#scene2-arrow-chrom)" class="scene2-hidden"/>
            <line id="scene2-chrom-f1-2" x1="230" y1="220" x2="230" y2="280" stroke="#1565c0" stroke-width="2" marker-end="url(#scene2-arrow-chrom)" class="scene2-hidden"/>
            <rect id="scene2-chrom-f1-bar" x="180" y="290" width="60" height="10" fill="#2e7d32" class="scene2-hidden"/>
            <text id="scene2-chrom-f1-bar-text" x="210" y="285" text-anchor="middle" font-size="10" fill="#000000" class="scene2-hidden">100%</text>

            <!-- 遗传箭头 2 -->
            <path id="scene2-chrom-arrow-2" d="M210,305 L210,330" stroke="#000000" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#scene2-arrow-herit)" class="scene2-hidden"/>

            <!-- 子二代 -->
            <text id="scene2-chrom-f2-label" x="210" y="320" text-anchor="middle" font-size="12" fill="#000000" class="scene2-hidden">子二代</text>
            <line id="scene2-chrom-f2-1" x1="190" y1="340" x2="190" y2="400" stroke="#1565c0" stroke-width="2" marker-end="url(#scene2-arrow-chrom)" class="scene2-hidden"/>
            <line id="scene2-chrom-f2-2" x1="230" y1="340" x2="230" y2="400" stroke="#1565c0" stroke-width="2" marker-end="url(#scene2-arrow-chrom)" class="scene2-hidden"/>
            <rect id="scene2-chrom-f2-bar" x="180" y="410" width="60" height="10" fill="#2e7d32" class="scene2-hidden"/>
            <text id="scene2-chrom-f2-bar-text" x="210" y="405" text-anchor="middle" font-size="10" fill="#000000" class="scene2-hidden">100%</text>

            <!-- 遗传箭头 3 -->
            <path id="scene2-chrom-arrow-3" d="M210,425 L210,450" stroke="#000000" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#scene2-arrow-herit)" class="scene2-hidden"/>

            <!-- 子三代 -->
            <text id="scene2-chrom-f3-label" x="210" y="440" text-anchor="middle" font-size="12" fill="#000000" class="scene2-hidden">子三代</text>
            <line id="scene2-chrom-f3-1" x1="190" y1="460" x2="190" y2="520" stroke="#1565c0" stroke-width="2" marker-end="url(#scene2-arrow-chrom)" class="scene2-hidden"/>
            <line id="scene2-chrom-f3-2" x1="230" y1="460" x2="230" y2="520" stroke="#1565c0" stroke-width="2" marker-end="url(#scene2-arrow-chrom)" class="scene2-hidden"/>
            <rect id="scene2-chrom-f3-bar" x="180" y="530" width="60" height="10" fill="#2e7d32" class="scene2-hidden"/>
            <text id="scene2-chrom-f3-bar-text" x="210" y="525" text-anchor="middle" font-size="10" fill="#000000" class="scene2-hidden">100%</text>

            <!-- ============ 右侧：线粒体遗传 ============ -->
            <!-- 亲代 -->
            <text id="scene2-mito-parent-label" x="590" y="80" text-anchor="middle" font-size="12" fill="#000000">亲代</text>
            <circle id="scene2-mito-parent" cx="590" cy="130" r="25" fill="#c62828" opacity="1.0"/>
            <rect id="scene2-mito-parent-bar" x="560" y="170" width="60" height="10" fill="#2e7d32"/>
            <text id="scene2-mito-parent-bar-text" x="590" y="165" text-anchor="middle" font-size="10" fill="#000000">100%</text>

            <!-- 遗传箭头 1 -->
            <path id="scene2-mito-arrow-1" d="M590,185 L590,230" stroke="#000000" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#scene2-arrow-herit)" class="scene2-hidden"/>

            <!-- 子一代 -->
            <text id="scene2-mito-f1-label" x="590" y="200" text-anchor="middle" font-size="12" fill="#000000" class="scene2-hidden">子一代</text>
            <circle id="scene2-mito-f1" cx="590" cy="250" r="25" fill="#c62828" opacity="0.7" class="scene2-hidden"/>
            <rect id="scene2-mito-f1-bar" x="560" y="290" width="36" height="10" fill="#2e7d32" class="scene2-hidden"/>
            <text id="scene2-mito-f1-bar-text" x="590" y="285" text-anchor="middle" font-size="10" fill="#000000" class="scene2-hidden">60%</text>

            <!-- 遗传箭头 2 -->
            <path id="scene2-mito-arrow-2" d="M590,305 L590,350" stroke="#000000" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#scene2-arrow-herit)" class="scene2-hidden"/>

            <!-- 子二代 -->
            <text id="scene2-mito-f2-label" x="590" y="320" text-anchor="middle" font-size="12" fill="#000000" class="scene2-hidden">子二代</text>
            <circle id="scene2-mito-f2" cx="590" cy="370" r="25" fill="#c62828" opacity="0.4" class="scene2-hidden"/>
            <rect id="scene2-mito-f2-bar" x="560" y="410" width="18" height="10" fill="#2e7d32" class="scene2-hidden"/>
            <text id="scene2-mito-f2-bar-text" x="590" y="405" text-anchor="middle" font-size="10" fill="#000000" class="scene2-hidden">30%</text>

            <!-- 遗传箭头 3 -->
            <path id="scene2-mito-arrow-3" d="M590,425 L590,470" stroke="#000000" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#scene2-arrow-herit)" class="scene2-hidden"/>

            <!-- 子三代 -->
            <text id="scene2-mito-f3-label" x="590" y="440" text-anchor="middle" font-size="12" fill="#000000" class="scene2-hidden">子三代</text>
            <circle id="scene2-mito-f3" cx="590" cy="490" r="25" fill="#c62828" opacity="0.1" class="scene2-hidden"/>
            <rect id="scene2-mito-f3-bar" x="560" y="530" width="0" height="10" fill="#9e9e9e" class="scene2-hidden"/>
            <text id="scene2-mito-f3-bar-text" x="590" y="525" text-anchor="middle" font-size="10" fill="#000000" class="scene2-hidden">0%</text>

            <!-- 结论文字（步骤 4 显示） -->
            <text id="scene2-conclusion" x="400" y="480" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000" class="scene2-hidden">结论：染色体遗传稳定 vs 线粒体遗传不稳定</text>
        </svg>

        <!-- 控件栏叠在 SVG 底部 -->
        <div id="scene2-controls">
            <button id="scene2-btn-prev" class="scene2-btn scene2-btn-prev" disabled>◀ 上一步</button>
            <span id="scene2-step-indicator" class="scene2-step-indicator">步骤 1/5</span>
            <button id="scene2-btn-next" class="scene2-btn scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2 实现
        // 布局坐标表（参考）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 备注 |
        // |------|------|-----------|------|------|
        // | 标题 | text | (400, 20) | 居中 | 粗体 |
        // | 左侧区域边界 | 矩形 | (50, 60)-(370, 400) | 320×340 | 浅蓝背景 |
        // | 右侧区域边界 | 矩形 | (430, 60)-(750, 400) | 320×340 | 浅红背景 |
        // | 左侧标题 | text | (210, 45) | "染色体遗传（稳定）" |
        // | 右侧标题 | text | (590, 45) | "线粒体遗传（逐代减弱）" |
        // | 亲代标签 - 左 | text | (210, 80) | 居中对齐 |
        // | 亲代染色体 - 左 | 线段 | (190,100)-(190,160), (230,100)-(230,160) | 带箭头，蓝色 |
        // | 亲代抗性条 - 左 | 矩形 | (180,170)-(240,180) | 绿色 100% |
        // | 子一代标签 - 左 | text | (210, 200) | 居中对齐 |
        // | 子一代染色体 - 左 | 线段 | (190,220)-(190,280), (230,220)-(230,280) | 带箭头，蓝色 |
        // | 子一代抗性条 - 左 | 矩形 | (180,290)-(240,300) | 绿色 100% |
        // | 子二代标签 - 左 | text | (210, 320) | 居中对齐 |
        // | 子二代染色体 - 左 | 线段 | (190,340)-(190,400), (230,340)-(230,400) | 带箭头，蓝色 |
        // | 子二代抗性条 - 左 | 矩形 | (180,410)-(240,420) | 绿色 100% |
        // | 亲代标签 - 右 | text | (590, 80) | 居中对齐 |
        // | 亲代线粒体 - 右 | 圆 | (590, 130), r=25 | 红色实心，opacity=1.0 |
        // | 亲代抗性条 - 右 | 矩形 | (560,170)-(620,180) | 绿色 100% |
        // | 子一代标签 - 右 | text | (590, 200) | 居中对齐 |
        // | 子一代线粒体 - 右 | 圆 | (590, 250), r=25 | 红色实心，opacity=0.7 |
        // | 子一代抗性条 - 右 | 矩形 | (560,290)-(596,300) | 绿色 60% |
        // | 子二代标签 - 右 | text | (590, 320) | 居中对齐 |
        // | 子二代线粒体 - 右 | 圆 | (590, 370), r=25 | 红色实心，opacity=0.4 |
        // | 子二代抗性条 - 右 | 矩形 | (560,410)-(578,420) | 绿色 30% |
        // | 控件栏 | div | (250, 450)-(550, 490) | 底部居中 |

        // 状态变量
        let currentStep = 0;
        const totalSteps = 5;

        // 步骤配置：每个步骤应显示的元素 ID 列表
        const stepConfig = {
            0: {
                show: [],
                hide: ['scene2-chrom-f1-label', 'scene2-chrom-f1-1', 'scene2-chrom-f1-2', 'scene2-chrom-f1-bar', 'scene2-chrom-f1-bar-text',
                       'scene2-chrom-f2-label', 'scene2-chrom-f2-1', 'scene2-chrom-f2-2', 'scene2-chrom-f2-bar', 'scene2-chrom-f2-bar-text',
                       'scene2-chrom-f3-label', 'scene2-chrom-f3-1', 'scene2-chrom-f3-2', 'scene2-chrom-f3-bar', 'scene2-chrom-f3-bar-text',
                       'scene2-mito-f1-label', 'scene2-mito-f1', 'scene2-mito-f1-bar', 'scene2-mito-f1-bar-text',
                       'scene2-mito-f2-label', 'scene2-mito-f2', 'scene2-mito-f2-bar', 'scene2-mito-f2-bar-text',
                       'scene2-mito-f3-label', 'scene2-mito-f3', 'scene2-mito-f3-bar', 'scene2-mito-f3-bar-text',
                       'scene2-chrom-arrow-1', 'scene2-chrom-arrow-2', 'scene2-chrom-arrow-3',
                       'scene2-mito-arrow-1', 'scene2-mito-arrow-2', 'scene2-mito-arrow-3',
                       'scene2-conclusion']
            },
            1: {
                show: ['scene2-chrom-f1-label', 'scene2-chrom-f1-1', 'scene2-chrom-f1-2', 'scene2-chrom-f1-bar', 'scene2-chrom-f1-bar-text',
                       'scene2-mito-f1-label', 'scene2-mito-f1', 'scene2-mito-f1-bar', 'scene2-mito-f1-bar-text',
                       'scene2-chrom-arrow-1', 'scene2-mito-arrow-1'],
                hide: ['scene2-chrom-f2-label', 'scene2-chrom-f2-1', 'scene2-chrom-f2-2', 'scene2-chrom-f2-bar', 'scene2-chrom-f2-bar-text',
                       'scene2-chrom-f3-label', 'scene2-chrom-f3-1', 'scene2-chrom-f3-2', 'scene2-chrom-f3-bar', 'scene2-chrom-f3-bar-text',
                       'scene2-mito-f2-label', 'scene2-mito-f2', 'scene2-mito-f2-bar', 'scene2-mito-f2-bar-text',
                       'scene2-mito-f3-label', 'scene2-mito-f3', 'scene2-mito-f3-bar', 'scene2-mito-f3-bar-text',
                       'scene2-chrom-arrow-2', 'scene2-chrom-arrow-3',
                       'scene2-mito-arrow-2', 'scene2-mito-arrow-3',
                       'scene2-conclusion']
            },
            2: {
                show: ['scene2-chrom-f1-label', 'scene2-chrom-f1-1', 'scene2-chrom-f1-2', 'scene2-chrom-f1-bar', 'scene2-chrom-f1-bar-text',
                       'scene2-chrom-f2-label', 'scene2-chrom-f2-1', 'scene2-chrom-f2-2', 'scene2-chrom-f2-bar', 'scene2-chrom-f2-bar-text',
                       'scene2-mito-f1-label', 'scene2-mito-f1', 'scene2-mito-f1-bar', 'scene2-mito-f1-bar-text',
                       'scene2-mito-f2-label', 'scene2-mito-f2', 'scene2-mito-f2-bar', 'scene2-mito-f2-bar-text',
                       'scene2-chrom-arrow-1', 'scene2-chrom-arrow-2',
                       'scene2-mito-arrow-1', 'scene2-mito-arrow-2'],
                hide: ['scene2-chrom-f3-label', 'scene2-chrom-f3-1', 'scene2-chrom-f3-2', 'scene2-chrom-f3-bar', 'scene2-chrom-f3-bar-text',
                       'scene2-mito-f3-label', 'scene2-mito-f3', 'scene2-mito-f3-bar', 'scene2-mito-f3-bar-text',
                       'scene2-chrom-arrow-3', 'scene2-mito-arrow-3',
                       'scene2-conclusion']
            },
            3: {
                show: ['scene2-chrom-f1-label', 'scene2-chrom-f1-1', 'scene2-chrom-f1-2', 'scene2-chrom-f1-bar', 'scene2-chrom-f1-bar-text',
                       'scene2-chrom-f2-label', 'scene2-chrom-f2-1', 'scene2-chrom-f2-2', 'scene2-chrom-f2-bar', 'scene2-chrom-f2-bar-text',
                       'scene2-chrom-f3-label', 'scene2-chrom-f3-1', 'scene2-chrom-f3-2', 'scene2-chrom-f3-bar', 'scene2-chrom-f3-bar-text',
                       'scene2-mito-f1-label', 'scene2-mito-f1', 'scene2-mito-f1-bar', 'scene2-mito-f1-bar-text',
                       'scene2-mito-f2-label', 'scene2-mito-f2', 'scene2-mito-f2-bar', 'scene2-mito-f2-bar-text',
                       'scene2-mito-f3-label', 'scene2-mito-f3', 'scene2-mito-f3-bar', 'scene2-mito-f3-bar-text',
                       'scene2-chrom-arrow-1', 'scene2-chrom-arrow-2', 'scene2-chrom-arrow-3',
                       'scene2-mito-arrow-1', 'scene2-mito-arrow-2', 'scene2-mito-arrow-3'],
                hide: ['scene2-conclusion']
            },
            4: {
                show: ['scene2-chrom-f1-label', 'scene2-chrom-f1-1', 'scene2-chrom-f1-2', 'scene2-chrom-f1-bar', 'scene2-chrom-f1-bar-text',
                       'scene2-chrom-f2-label', 'scene2-chrom-f2-1', 'scene2-chrom-f2-2', 'scene2-chrom-f2-bar', 'scene2-chrom-f2-bar-text',
                       'scene2-chrom-f3-label', 'scene2-chrom-f3-1', 'scene2-chrom-f3-2', 'scene2-chrom-f3-bar', 'scene2-chrom-f3-bar-text',
                       'scene2-mito-f1-label', 'scene2-mito-f1', 'scene2-mito-f1-bar', 'scene2-mito-f1-bar-text',
                       'scene2-mito-f2-label', 'scene2-mito-f2', 'scene2-mito-f2-bar', 'scene2-mito-f2-bar-text',
                       'scene2-mito-f3-label', 'scene2-mito-f3', 'scene2-mito-f3-bar', 'scene2-mito-f3-bar-text',
                       'scene2-chrom-arrow-1', 'scene2-chrom-arrow-2', 'scene2-chrom-arrow-3',
                       'scene2-mito-arrow-1', 'scene2-mito-arrow-2', 'scene2-mito-arrow-3',
                       'scene2-conclusion']
            }
        };

        // 工具函数：显示元素
        function show(elId) {
            const el = document.getElementById(elId);
            if (el) {
                el.style.display = '';
                el.style.opacity = '1';
                el.classList.add('scene2-fade-in');
            }
        }

        // 工具函数：隐藏元素
        function hide(elId) {
            const el = document.getElementById(elId);
            if (el) {
                el.style.display = 'none';
                el.style.opacity = '0';
                el.classList.remove('scene2-fade-in', 'scene2-flash');
            }
        }

        // 更新场景显示
        function updateScene() {
            const config = stepConfig[currentStep];

            // 先隐藏所有需要隐藏的元素
            config.hide.forEach(hide);

            // 再显示需要显示的元素
            config.show.forEach(show);

            // 更新按钮状态
            const prevBtn = document.getElementById('scene2-btn-prev');
            const nextBtn = document.getElementById('scene2-btn-next');
            const indicator = document.getElementById('scene2-step-indicator');

            prevBtn.disabled = currentStep === 0;
            nextBtn.disabled = currentStep === totalSteps - 1;
            indicator.textContent = `步骤 ${currentStep + 1}/${totalSteps}`;

            // 步骤 4 的特殊效果：高亮
            if (currentStep === 4) {
                // 左侧所有抗性条闪烁
                ['scene2-chrom-parent-bar', 'scene2-chrom-f1-bar', 'scene2-chrom-f2-bar', 'scene2-chrom-f3-bar'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) {
                        el.classList.remove('scene2-flash');
                        void el.offsetWidth; // 触发重绘
                        el.classList.add('scene2-flash');
                    }
                });
                // 右侧子三代抗性条闪烁
                const mitoF3Bar = document.getElementById('scene2-mito-f3-bar');
                if (mitoF3Bar) {
                    mitoF3Bar.classList.remove('scene2-flash');
                    void mitoF3Bar.offsetWidth;
                    mitoF3Bar.classList.add('scene2-flash');
                }
            }
        }

        // 事件绑定
        document.getElementById('scene2-btn-prev').addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        document.getElementById('scene2-btn-next').addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateScene();
            }
        });

        // 初始化
        updateScene();
    })();
    </script>
</body>
</html>
