<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 3 - 验证实验设计</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Microsoft YaHei', sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene-btn { padding: 10px 20px; font-size: 14px; cursor: pointer; border: 2px solid; border-radius: 6px; background: #fff; transition: all 0.3s ease; }
        .scene-btn.active { font-weight: bold; }
        #scene3-btn1 { border-color: #2e7d32; color: #2e7d32; }
        #scene3-btn1.active { background: #2e7d32; color: #fff; }
        #scene3-btn2 { border-color: #1565c0; color: #1565c0; }
        #scene3-btn2.active { background: #1565c0; color: #fff; }
        .panel { transition: opacity 0.3s ease; }
        .panel.dimmed { opacity: 0.4; }
        .panel.highlight { opacity: 1; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <!-- SVG 图示区：固定 800×500px -->
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
                </marker>
            </defs>

            <!-- 方案一标题 -->
            <text id="scene3-title1" x="180" y="12" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e7d32">方案一：测交验证</text>

            <!-- 方案一边框（向内收缩，留出边距） -->
            <rect id="scene3-border1" x="45" y="45" width="330" height="330" fill="none" stroke="#2e7d32" stroke-width="2" class="panel highlight"/>

            <!-- 方案一 P 代 ♀ (棒眼，红色) - 基因型在圆形上方 -->
            <text id="scene3-p1-female-genotype" x="100" y="65" text-anchor="middle" font-size="13" fill="#000000" font-family="monospace">aa</text>
            <circle id="scene3-p1-female" cx="100" cy="95" r="18" fill="#c62828" fill-opacity="0.15" stroke="#c62828" stroke-width="2" class="panel highlight"/>
            <text id="scene3-p1-female-symbol" x="100" y="100" text-anchor="middle" font-size="15" fill="#c62828">♀</text>

            <!-- 方案一 P 代 ♂ (圆眼，蓝色) - 基因型在圆形上方 -->
            <text id="scene3-p1-male-genotype" x="200" y="65" text-anchor="middle" font-size="13" fill="#000000" font-family="monospace">AA</text>
            <circle id="scene3-p1-male" cx="200" cy="95" r="18" fill="#1565c0" fill-opacity="0.15" stroke="#1565c0" stroke-width="2" class="panel highlight"/>
            <text id="scene3-p1-male-symbol" x="200" y="100" text-anchor="middle" font-size="15" fill="#1565c0">♂</text>

            <!-- 方案一杂交箭头 -->
            <line id="scene3-arrow1-p" x1="150" y1="118" x2="150" y2="135" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" class="panel highlight"/>

            <!-- 方案一 F₁ (圆眼，蓝色) - 基因型在圆形上方 -->
            <text id="scene3-f1-1-genotype" x="150" y="140" text-anchor="middle" font-size="13" fill="#000000" font-family="monospace">Aa</text>
            <circle id="scene3-f1-1" cx="150" cy="170" r="18" fill="#1565c0" fill-opacity="0.15" stroke="#1565c0" stroke-width="2" class="panel highlight"/>
            <text id="scene3-f1-1-symbol" x="150" y="175" text-anchor="middle" font-size="15" fill="#1565c0">♀♂</text>

            <!-- 方案一 F₁→F₂箭头 -->
            <line id="scene3-arrow1-f1" x1="150" y1="188" x2="150" y2="205" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" class="panel highlight"/>

            <!-- 方案一 F₂♀ (圆眼) -->
            <circle id="scene3-f2-1-female" cx="100" cy="225" r="18" fill="#1565c0" fill-opacity="0.15" stroke="#1565c0" stroke-width="2" class="panel highlight"/>
            <text id="scene3-f2-1-female-symbol" x="100" y="230" text-anchor="middle" font-size="15" fill="#1565c0">♀</text>

            <!-- 方案一 F₂♂ (棒眼) -->
            <circle id="scene3-f2-1-male" cx="200" cy="225" r="18" fill="#c62828" fill-opacity="0.15" stroke="#c62828" stroke-width="2" class="panel highlight"/>
            <text id="scene3-f2-1-male-symbol" x="200" y="230" text-anchor="middle" font-size="15" fill="#c62828">♂</text>

            <!-- 方案一 F₂杂交箭头 -->
            <line id="scene3-arrow1-f2" x1="150" y1="248" x2="150" y2="265" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" class="panel highlight"/>

            <!-- 方案一测交标签 -->
            <text id="scene3-label1" x="150" y="240" text-anchor="middle" font-size="12" fill="#000000">测交</text>

            <!-- 方案一结果框（在边框内，留出边距） -->
            <rect id="scene3-result1" x="65" y="275" width="240" height="70" fill="none" stroke="#2e7d32" stroke-width="2" class="panel highlight"/>
            <text id="scene3-result1-text" x="185" y="300" text-anchor="middle" font-size="13" fill="#2e7d32" font-weight="bold">子代：圆眼 : 棒眼</text>
            <text id="scene3-result1-text2" x="185" y="325" text-anchor="middle" font-size="13" fill="#2e7d32" font-weight="bold">= 1 : 1</text>

            <!-- 方案二标题 -->
            <text id="scene3-title2" x="550" y="12" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565c0">方案二：自交验证</text>

            <!-- 方案二边框（向内收缩，留出边距） -->
            <rect id="scene3-border2" x="415" y="45" width="330" height="330" fill="none" stroke="#1565c0" stroke-width="2" class="panel dimmed"/>

            <!-- 方案二 P 代 ♀ (圆眼，蓝色) - 基因型在圆形上方 -->
            <text id="scene3-p2-female-genotype" x="470" y="65" text-anchor="middle" font-size="13" fill="#000000" font-family="monospace">Aa</text>
            <circle id="scene3-p2-female" cx="470" cy="95" r="18" fill="#1565c0" fill-opacity="0.15" stroke="#1565c0" stroke-width="2" class="panel dimmed"/>
            <text id="scene3-p2-female-symbol" x="470" y="100" text-anchor="middle" font-size="15" fill="#1565c0">♀</text>

            <!-- 方案二 P 代 ♂ (圆眼，蓝色) - 基因型在圆形上方 -->
            <text id="scene3-p2-male-genotype" x="570" y="65" text-anchor="middle" font-size="13" fill="#000000" font-family="monospace">Aa</text>
            <circle id="scene3-p2-male" cx="570" cy="95" r="18" fill="#1565c0" fill-opacity="0.15" stroke="#1565c0" stroke-width="2" class="panel dimmed"/>
            <text id="scene3-p2-male-symbol" x="570" y="100" text-anchor="middle" font-size="15" fill="#1565c0">♂</text>

            <!-- 方案二杂交箭头 -->
            <line id="scene3-arrow2-p" x1="520" y1="118" x2="520" y2="135" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" class="panel dimmed"/>

            <!-- 方案二 F₁ (圆眼，蓝色) - 基因型在圆形上方 -->
            <text id="scene3-f1-2-genotype" x="520" y="140" text-anchor="middle" font-size="13" fill="#000000" font-family="monospace">Aa</text>
            <circle id="scene3-f1-2" cx="520" cy="170" r="18" fill="#1565c0" fill-opacity="0.15" stroke="#1565c0" stroke-width="2" class="panel dimmed"/>
            <text id="scene3-f1-2-symbol" x="520" y="175" text-anchor="middle" font-size="15" fill="#1565c0">♀♂</text>

            <!-- 方案二 F₁→F₂箭头 -->
            <line id="scene3-arrow2-f1" x1="520" y1="188" x2="520" y2="205" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" class="panel dimmed"/>

            <!-- 方案二 F₂自交 (圆眼，蓝色) - 基因型在圆形上方 -->
            <text id="scene3-f2-2-genotype" x="520" y="210" text-anchor="middle" font-size="13" fill="#000000" font-family="monospace">Aa</text>
            <circle id="scene3-f2-2" cx="520" cy="240" r="18" fill="#1565c0" fill-opacity="0.15" stroke="#1565c0" stroke-width="2" class="panel dimmed"/>
            <text id="scene3-f2-2-symbol" x="520" y="245" text-anchor="middle" font-size="15" fill="#1565c0">♀♂</text>

            <!-- 方案二自交标签 -->
            <text id="scene3-label2" x="520" y="202" text-anchor="middle" font-size="12" fill="#000000">自交</text>

            <!-- 方案二自交箭头 -->
            <line id="scene3-arrow2-f2" x1="520" y1="263" x2="520" y2="280" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)" class="panel dimmed"/>

            <!-- 方案二结果框（在边框内，留出边距） -->
            <rect id="scene3-result2" x="435" y="290" width="240" height="70" fill="none" stroke="#1565c0" stroke-width="2" class="panel dimmed"/>
            <text id="scene3-result2-text" x="555" y="315" text-anchor="middle" font-size="13" fill="#1565c0" font-weight="bold">子代出现棒眼</text>
            <text id="scene3-result2-text2" x="555" y="340" text-anchor="middle" font-size="12" fill="#1565c0" font-weight="bold">(性状分离现象)</text>
        </svg>

        <!-- 控件栏叠在 SVG 底部 -->
        <div id="scene3-controls">
            <button id="scene3-btn1" class="scene-btn active">方案一：测交验证</button>
            <button id="scene3-btn2" class="scene-btn">方案二：自交验证</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 3 实现
        // 布局坐标表（修复后）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 备注 |
        // |------|------|-----------|------|------|
        // | 方案一边框 | rect | (45,45)-(375,375) | 330×330 | 绿色边框 |
        // | 方案二边框 | rect | (415,45)-(745,375) | 330×330 | 蓝色边框 |
        // | 方案一标题 | text | (180,12) | - | 绿色文字，y=12 确保不裁切 |
        // | 方案二标题 | text | (550,12) | - | 蓝色文字 |
        // | P 代基因型 | text | y=65 | - | 在圆形上方 30px |
        // | P 代圆形 | circle | cy=95, r=18 | 直径 36 | 符号在圆心 |
        // | F₁基因型 | text | y=140 | - | 在圆形上方 30px |
        // | F₁圆形 | circle | cy=170, r=18 | 直径 36 | 符号在圆心 |
        // | F₂圆形 | circle | cy=225/240, r=18 | 直径 36 | 符号在圆心 |
        // | 结果框 | rect | y=275/290 | 240×70 | 文字居中，边框内 |

        // 状态机：currentScene = 0 (方案一), 1 (方案二)
        let currentScene = 0;

        // 方案一元素 ID 列表
        const scene1Elements = [
            'scene3-title1', 'scene3-border1',
            'scene3-p1-female-genotype', 'scene3-p1-female', 'scene3-p1-female-symbol',
            'scene3-p1-male-genotype', 'scene3-p1-male', 'scene3-p1-male-symbol',
            'scene3-arrow1-p',
            'scene3-f1-1-genotype', 'scene3-f1-1', 'scene3-f1-1-symbol',
            'scene3-arrow1-f1',
            'scene3-f2-1-female', 'scene3-f2-1-female-symbol',
            'scene3-f2-1-male', 'scene3-f2-1-male-symbol',
            'scene3-arrow1-f2',
            'scene3-label1',
            'scene3-result1', 'scene3-result1-text', 'scene3-result1-text2'
        ];

        // 方案二元素 ID 列表
        const scene2Elements = [
            'scene3-title2', 'scene3-border2',
            'scene3-p2-female-genotype', 'scene3-p2-female', 'scene3-p2-female-symbol',
            'scene3-p2-male-genotype', 'scene3-p2-male', 'scene3-p2-male-symbol',
            'scene3-arrow2-p',
            'scene3-f1-2-genotype', 'scene3-f1-2', 'scene3-f1-2-symbol',
            'scene3-arrow2-f1',
            'scene3-f2-2-genotype', 'scene3-f2-2', 'scene3-f2-2-symbol',
            'scene3-arrow2-f2',
            'scene3-label2',
            'scene3-result2', 'scene3-result2-text', 'scene3-result2-text2'
        ];

        // 工具函数：高亮显示元素
        function highlightElements(elementIds) {
            elementIds.forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.classList.remove('dimmed');
                    el.classList.add('highlight');
                    el.style.opacity = '1';
                }
            });
        }

        // 工具函数：半透明显示元素
        function dimElements(elementIds) {
            elementIds.forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.classList.remove('highlight');
                    el.classList.add('dimmed');
                    el.style.opacity = '0.4';
                }
            });
        }

        // 切换场景函数
        function switchScene(sceneIndex) {
            if (currentScene === sceneIndex) return;

            currentScene = sceneIndex;

            // 更新按钮状态
            const btn1 = document.getElementById('scene3-btn1');
            const btn2 = document.getElementById('scene3-btn2');

            if (sceneIndex === 0) {
                btn1.classList.add('active');
                btn2.classList.remove('active');
                highlightElements(scene1Elements);
                dimElements(scene2Elements);
            } else {
                btn2.classList.add('active');
                btn1.classList.remove('active');
                highlightElements(scene2Elements);
                dimElements(scene1Elements);
            }
        }

        // 绑定按钮事件
        document.getElementById('scene3-btn1').addEventListener('click', function() {
            switchScene(0);
        });

        document.getElementById('scene3-btn2').addEventListener('click', function() {
            switchScene(1);
        });

        // 初始化：显示方案一
        switchScene(0);
    })();
    </script>
</body>
</html>
