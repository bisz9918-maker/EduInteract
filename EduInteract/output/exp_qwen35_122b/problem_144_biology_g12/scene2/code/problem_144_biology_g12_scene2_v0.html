<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 基因位置判断对比分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene2-btn {
            padding: 10px 20px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .scene2-btn.active {
            background: #2e7d32;
            color: white;
            font-weight: bold;
        }
        .scene2-btn.inactive {
            background: #9e9e9e;
            color: white;
        }
        .scene2-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <!-- SVG 图示区：固定 800×500px -->
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 左侧面板边框：常染色体遗传，绿色#2e7d32 (x=40，远离边缘) -->
            <rect id="scene2-autosome-panel" x="40" y="40" width="340" height="360" fill="none" stroke="#2e7d32" stroke-width="3"/>
            
            <!-- 右侧面板边框：X 染色体遗传，红色#c62828 (x=440，远离边缘) -->
            <rect id="scene2-xchrom-panel" x="440" y="40" width="340" height="360" fill="none" stroke="#c62828" stroke-width="2"/>
            
            <!-- 左侧面板标题 (y=65，远离边框) -->
            <text id="scene2-autosome-title" x="210" y="65" text-anchor="middle" fill="#000000" font-size="16" font-weight="bold">常染色体遗传</text>
            
            <!-- 右侧面板标题 (y=65，远离边框) -->
            <text id="scene2-xchrom-title" x="610" y="65" text-anchor="middle" fill="#000000" font-size="16" font-weight="bold">X 染色体遗传</text>
            
            <!-- ========== 左侧面板：常染色体遗传 ========== -->
            
            <!-- 左侧 P 层世代标签 (x=80，远离边框) -->
            <text id="scene2-autosome-p-label" x="80" y="75" fill="#000000" font-size="14">P</text>
            
            <!-- 左侧♀棒眼 (红色) -->
            <ellipse id="scene2-autosome-p-female" cx="100" cy="85" rx="30" ry="25" fill="#c62828" fill-opacity="0.2" stroke="#000000" stroke-width="2"/>
            <!-- 标签移到椭圆下方 (y=120) -->
            <text id="scene2-autosome-p-female-label" x="100" y="120" text-anchor="middle" fill="#000000" font-size="11">♀棒眼</text>
            
            <!-- 左侧×符号 -->
            <text id="scene2-autosome-cross1" x="150" y="85" text-anchor="middle" fill="#000000" font-size="16">×</text>
            
            <!-- 左侧♂圆眼 (蓝色) -->
            <ellipse id="scene2-autosome-p-male" cx="200" cy="85" rx="30" ry="25" fill="#1565c0" fill-opacity="0.2" stroke="#000000" stroke-width="2"/>
            <!-- 标签移到椭圆下方 (y=120) -->
            <text id="scene2-autosome-p-male-label" x="200" y="120" text-anchor="middle" fill="#000000" font-size="11">♂圆眼</text>
            
            <!-- 左侧 P→F₁箭头 -->
            <line id="scene2-autosome-arrow1" x1="150" y1="110" x2="150" y2="145" stroke="#000000" stroke-width="2"/>
            <polygon id="scene2-autosome-arrowhead1" points="150,145 145,135 155,135" fill="#000000"/>
            
            <!-- 左侧 F₁世代标签 (x=80) -->
            <text id="scene2-autosome-f1-label" x="80" y="175" fill="#000000" font-size="14">F₁</text>
            
            <!-- 左侧 F₁圆眼 (蓝色) -->
            <ellipse id="scene2-autosome-f1" cx="150" cy="185" rx="35" ry="30" fill="#1565c0" fill-opacity="0.2" stroke="#000000" stroke-width="2"/>
            <!-- 标签移到椭圆下方 (y=225) -->
            <text id="scene2-autosome-f1-label-text" x="150" y="225" text-anchor="middle" fill="#000000" font-size="12">圆眼</text>
            
            <!-- 左侧 F₁→F₂箭头 -->
            <line id="scene2-autosome-arrow2" x1="150" y1="215" x2="150" y2="250" stroke="#000000" stroke-width="2"/>
            <polygon id="scene2-autosome-arrowhead2" points="150,250 145,240 155,240" fill="#000000"/>
            
            <!-- 左侧 F₂世代标签 (x=80) -->
            <text id="scene2-autosome-f2-label" x="80" y="285" fill="#000000" font-size="14">F₂</text>
            
            <!-- 左侧 F₂♀圆眼 (蓝色) -->
            <ellipse id="scene2-autosome-f2-female-round" cx="80" cy="325" rx="25" ry="20" fill="#1565c0" fill-opacity="0.2" stroke="#000000" stroke-width="2"/>
            <!-- 标签移到椭圆下方 (y=355) -->
            <text id="scene2-autosome-f2-female-round-label" x="80" y="355" text-anchor="middle" fill="#000000" font-size="10">♀圆</text>
            
            <!-- 左侧 F₂♀棒眼 (红色) -->
            <ellipse id="scene2-autosome-f2-female-bar" cx="130" cy="325" rx="25" ry="20" fill="#c62828" fill-opacity="0.2" stroke="#000000" stroke-width="2"/>
            <!-- 标签移到椭圆下方 (y=355) -->
            <text id="scene2-autosome-f2-female-bar-label" x="130" y="355" text-anchor="middle" fill="#000000" font-size="10">♀棒</text>
            
            <!-- 左侧 F₂♂圆眼 (蓝色) -->
            <ellipse id="scene2-autosome-f2-male-round" cx="190" cy="325" rx="25" ry="20" fill="#1565c0" fill-opacity="0.2" stroke="#000000" stroke-width="2"/>
            <!-- 标签移到椭圆下方 (y=355) -->
            <text id="scene2-autosome-f2-male-round-label" x="190" y="355" text-anchor="middle" fill="#000000" font-size="10">♂圆</text>
            
            <!-- 左侧 F₂♂棒眼 (红色) -->
            <ellipse id="scene2-autosome-f2-male-bar" cx="250" cy="325" rx="25" ry="20" fill="#c62828" fill-opacity="0.2" stroke="#000000" stroke-width="2"/>
            <!-- 标签移到椭圆下方 (y=355) -->
            <text id="scene2-autosome-f2-male-bar-label" x="250" y="355" text-anchor="middle" fill="#000000" font-size="10">♂棒</text>
            
            <!-- 左侧 F₂比例标签 (y=385) -->
            <text id="scene2-autosome-f2-ratio" x="150" y="385" text-anchor="middle" fill="#000000" font-size="14">1 : 1 : 1 : 1</text>
            
            <!-- 左侧差异高亮框 (橙色) (y=320) -->
            <rect id="scene2-autosome-highlight" x="70" y="320" width="210" height="30" fill="none" stroke="#ff9800" stroke-width="2" stroke-opacity="0.3"/>
            
            <!-- ========== 右侧面板：X 染色体遗传 ========== -->
            
            <!-- 右侧 P 层世代标签 (x=480) -->
            <text id="scene2-xchrom-p-label" x="480" y="75" fill="#000000" font-size="14">P</text>
            
            <!-- 右侧♀棒眼 (红色) -->
            <ellipse id="scene2-xchrom-p-female" cx="450" cy="85" rx="30" ry="25" fill="#c62828" fill-opacity="0.2" stroke="#000000" stroke-width="2"/>
            <!-- 标签移到椭圆下方 (y=120) -->
            <text id="scene2-xchrom-p-female-label" x="450" y="120" text-anchor="middle" fill="#000000" font-size="11">♀棒眼</text>
            
            <!-- 右侧×符号 -->
            <text id="scene2-xchrom-cross1" x="500" y="85" text-anchor="middle" fill="#000000" font-size="16">×</text>
            
            <!-- 右侧♂圆眼 (蓝色) -->
            <ellipse id="scene2-xchrom-p-male" cx="550" cy="85" rx="30" ry="25" fill="#1565c0" fill-opacity="0.2" stroke="#000000" stroke-width="2"/>
            <!-- 标签移到椭圆下方 (y=120) -->
            <text id="scene2-xchrom-p-male-label" x="550" y="120" text-anchor="middle" fill="#000000" font-size="11">♂圆眼</text>
            
            <!-- 右侧 P→F₁箭头 -->
            <line id="scene2-xchrom-arrow1" x1="500" y1="110" x2="500" y2="145" stroke="#000000" stroke-width="2"/>
            <polygon id="scene2-xchrom-arrowhead1" points="500,145 495,135 505,135" fill="#000000"/>
            
            <!-- 右侧 F₁世代标签 (x=480) -->
            <text id="scene2-xchrom-f1-label" x="480" y="175" fill="#000000" font-size="14">F₁</text>
            
            <!-- 右侧 F₁圆眼 (蓝色) -->
            <ellipse id="scene2-xchrom-f1" cx="500" cy="185" rx="35" ry="30" fill="#1565c0" fill-opacity="0.2" stroke="#000000" stroke-width="2"/>
            <!-- 标签移到椭圆下方 (y=225) -->
            <text id="scene2-xchrom-f1-label-text" x="500" y="225" text-anchor="middle" fill="#000000" font-size="12">圆眼</text>
            
            <!-- 右侧 F₁→F₂箭头 -->
            <line id="scene2-xchrom-arrow2" x1="500" y1="215" x2="500" y2="250" stroke="#000000" stroke-width="2"/>
            <polygon id="scene2-xchrom-arrowhead2" points="500,250 495,240 505,240" fill="#000000"/>
            
            <!-- 右侧 F₂世代标签 (x=480) -->
            <text id="scene2-xchrom-f2-label" x="480" y="285" fill="#000000" font-size="14">F₂</text>
            
            <!-- 右侧 F₂♀圆眼 (蓝色) -->
            <ellipse id="scene2-xchrom-f2-female-round" cx="480" cy="325" rx="25" ry="20" fill="#1565c0" fill-opacity="0.2" stroke="#000000" stroke-width="2"/>
            <!-- 标签移到椭圆下方 (y=355) -->
            <text id="scene2-xchrom-f2-female-round-label" x="480" y="355" text-anchor="middle" fill="#000000" font-size="10">♀圆</text>
            
            <!-- 右侧 F₂♀棒眼 (红色) -->
            <ellipse id="scene2-xchrom-f2-female-bar" cx="530" cy="325" rx="25" ry="20" fill="#c62828" fill-opacity="0.2" stroke="#000000" stroke-width="2"/>
            <!-- 标签移到椭圆下方 (y=355) -->
            <text id="scene2-xchrom-f2-female-bar-label" x="530" y="355" text-anchor="middle" fill="#000000" font-size="10">♀棒</text>
            
            <!-- 右侧 F₂♂圆眼 (蓝色) -->
            <ellipse id="scene2-xchrom-f2-male-round" cx="590" cy="325" rx="25" ry="20" fill="#1565c0" fill-opacity="0.2" stroke="#000000" stroke-width="2"/>
            <!-- 标签移到椭圆下方 (y=355) -->
            <text id="scene2-xchrom-f2-male-round-label" x="590" y="355" text-anchor="middle" fill="#000000" font-size="10">♂圆</text>
            
            <!-- 右侧 F₂♂棒眼 (红色) -->
            <ellipse id="scene2-xchrom-f2-male-bar" cx="650" cy="325" rx="25" ry="20" fill="#c62828" fill-opacity="0.2" stroke="#000000" stroke-width="2"/>
            <!-- 标签移到椭圆下方 (y=355) -->
            <text id="scene2-xchrom-f2-male-bar-label" x="650" y="355" text-anchor="middle" fill="#000000" font-size="10">♂棒</text>
            
            <!-- 右侧 F₂比例标签 (y=385) -->
            <text id="scene2-xchrom-f2-ratio" x="560" y="385" text-anchor="middle" fill="#000000" font-size="14">1 : 1 : 1 : 1</text>
            
            <!-- 右侧差异高亮框 (橙色) (y=320) -->
            <rect id="scene2-xchrom-highlight" x="470" y="320" width="210" height="30" fill="none" stroke="#ff9800" stroke-width="2" stroke-opacity="0.3"/>
        </svg>
        
        <!-- 控件栏叠在 SVG 底部 -->
        <div id="scene2-controls">
            <button id="scene2-autosome-btn" class="scene2-btn active">常染色体遗传</button>
            <button id="scene2-xchrom-btn" class="scene2-btn inactive">X 染色体遗传</button>
        </div>
    </div>
    <script>
    (function() {
        // Scene 2 实现
        // 布局坐标表对照：
        // 左侧面板边框：rect | (40,40)-(380,400) | 绿色#2e7d32 边框，线宽 2px
        // 右侧面板边框：rect | (440,40)-(780,400) | 红色#c62828 边框，线宽 2px
        // 左侧面板标题：text | (210,65) | 黑色#000000，字号 16px
        // 右侧面板标题：text | (610,65) | 黑色#000000，字号 16px
        // 世代标签 (P/F₁/F₂)：text | 各面板左侧 x=80/480 处 | 黑色#000000，字号 14px
        // 果蝇椭圆：ellipse | 圆眼蓝色#1565c0 填充 20% 透明度，棒眼红色#c62828 填充 20% 透明度
        // 果蝇标签：移到椭圆下方
        // F₂比例标签：text | 各面板 F₂下方 y=385 | 黑色#000000，字号 14px
        // 差异高亮框：rect | 各面板 F₂区域 | 橙色#ff9800 边框，线宽 2px，透明度 30%
        // 切换按钮：button | 底部中央 (300,445)-(500,475) | 激活态绿色#2e7d32，非激活态灰色#9e9e9e

        // 状态机：currentScene = 1 (常染色体) 或 2 (X 染色体)
        let currentScene = 1;

        // 工具函数：获取元素
        function $(id) {
            return document.getElementById(id);
        }

        // 工具函数：切换按钮状态
        function setButtonActive(btnId, isActive) {
            const btn = $(btnId);
            if (isActive) {
                btn.classList.remove('inactive');
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
                btn.classList.add('inactive');
            }
        }

        // 工具函数：切换面板高亮
        function setPanelHighlight(panelId, isHighlighted) {
            const panel = $(panelId);
            if (isHighlighted) {
                panel.setAttribute('stroke-width', '3');
            } else {
                panel.setAttribute('stroke-width', '2');
            }
        }

        // 工具函数：切换高亮框显示
        function setHighlightBox(boxId, isVisible) {
            const box = $(boxId);
            box.style.display = isVisible ? 'block' : 'none';
            box.style.opacity = isVisible ? '1' : '0';
        }

        // 更新显示状态
        function updateDisplay() {
            if (currentScene === 1) {
                // 常染色体遗传激活
                setButtonActive('scene2-autosome-btn', true);
                setButtonActive('scene2-xchrom-btn', false);
                setPanelHighlight('scene2-autosome-panel', true);
                setPanelHighlight('scene2-xchrom-panel', false);
                setHighlightBox('scene2-autosome-highlight', true);
                setHighlightBox('scene2-xchrom-highlight', false);
            } else {
                // X 染色体遗传激活
                setButtonActive('scene2-autosome-btn', false);
                setButtonActive('scene2-xchrom-btn', true);
                setPanelHighlight('scene2-autosome-panel', false);
                setPanelHighlight('scene2-xchrom-panel', true);
                setHighlightBox('scene2-autosome-highlight', false);
                setHighlightBox('scene2-xchrom-highlight', true);
            }
        }

        // 事件绑定
        $('scene2-autosome-btn').addEventListener('click', function() {
            if (currentScene !== 1) {
                currentScene = 1;
                updateDisplay();
            }
        });

        $('scene2-xchrom-btn').addEventListener('click', function() {
            if (currentScene !== 2) {
                currentScene = 2;
                updateDisplay();
            }
        });

        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
