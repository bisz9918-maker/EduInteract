<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - Ⅱ-5 性染色体异常成因分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; align-items: center; }
        #scene2-controls button { padding: 8px 16px; font-size: 14px; border: none; border-radius: 4px; cursor: pointer; }
        #scene2-prev-btn { background: #e0e0e0; color: #333; }
        #scene2-prev-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene2-next-btn { background: #1976d2; color: white; }
        #scene2-next-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene2-step-indicator { font-size: 14px; color: #666; margin-left: 10px; }
        .scene2-element { transition: opacity 0.3s ease; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-canvas" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 标题 -->
            <text id="scene2-title" class="scene2-element" x="400" y="45" text-anchor="middle" font-size="16" fill="#000" font-weight="bold">Ⅱ-5 性染色体异常成因分析</text>
            
            <!-- 父方体细胞框 -->
            <rect id="scene2-father-cell" class="scene2-element" x="80" y="80" width="100" height="60" fill="white" stroke="#000" stroke-width="2"/>
            <text id="scene2-father-label" class="scene2-element" x="130" y="72" text-anchor="middle" font-size="14" fill="#000">Ⅰ-1 父</text>
            <!-- 父方 X 染色体（蓝色） -->
            <line id="scene2-father-X" class="scene2-element" x1="110" y1="95" x2="110" y2="125" stroke="#1565c0" stroke-width="4"/>
            <!-- 父方 Y 染色体（红色） -->
            <line id="scene2-father-Y" class="scene2-element" x1="150" y1="95" x2="150" y2="125" stroke="#c62828" stroke-width="4"/>
            
            <!-- 母方体细胞框 -->
            <rect id="scene2-mother-cell" class="scene2-element" x="520" y="80" width="100" height="60" fill="white" stroke="#000" stroke-width="2"/>
            <text id="scene2-mother-label" class="scene2-element" x="570" y="72" text-anchor="middle" font-size="14" fill="#000">Ⅰ-2 母</text>
            <!-- 母方 X 染色体 1（蓝色） -->
            <line id="scene2-mother-X1" class="scene2-element" x1="550" y1="95" x2="550" y2="125" stroke="#1565c0" stroke-width="4"/>
            <!-- 母方 X 染色体 2（蓝色） -->
            <line id="scene2-mother-X2" class="scene2-element" x1="590" y1="95" x2="590" y2="125" stroke="#1565c0" stroke-width="4"/>
            
            <!-- 父方减数分裂区（移到配子下方，避免重叠） -->
            <rect id="scene2-father-meiosis" class="scene2-element" x="50" y="280" width="200" height="80" fill="#f5f5f5" stroke="#000" stroke-width="1"/>
            <text id="scene2-father-meiosis-label" class="scene2-element" x="150" y="272" text-anchor="middle" font-size="14" fill="#000">父方减数分裂</text>
            <!-- 父方正常配子 X（在减数分裂区上方） -->
            <circle id="scene2-gamete-X" class="scene2-element" cx="100" cy="220" r="25" fill="white" stroke="#000" stroke-width="2"/>
            <text id="scene2-gamete-X-text" class="scene2-element" x="100" y="220" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1565c0" font-weight="bold">X</text>
            <!-- 父方正常配子 Y -->
            <circle id="scene2-gamete-Y" class="scene2-element" cx="200" cy="220" r="25" fill="white" stroke="#000" stroke-width="2"/>
            <text id="scene2-gamete-Y-text" class="scene2-element" x="200" y="220" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#c62828" font-weight="bold">Y</text>
            <!-- 父方减数分裂标注（移到区域下方，远离异常区） -->
            <text id="scene2-father-normal-note" class="scene2-element" x="150" y="365" text-anchor="middle" font-size="12" fill="#666">正常：减数分裂正常分离</text>
            <!-- 父方体细胞到配子箭头 -->
            <line id="scene2-father-to-meiosis-arrow" class="scene2-element" x1="130" y1="140" x2="130" y2="190" stroke="#888" stroke-width="2" marker-end="url(#arrowhead)"/>
            
            <!-- 母方减数分裂区 -->
            <rect id="scene2-mother-meiosis" class="scene2-element" x="500" y="280" width="200" height="80" fill="#f5f5f5" stroke="#000" stroke-width="1"/>
            <text id="scene2-mother-meiosis-label" class="scene2-element" x="600" y="272" text-anchor="middle" font-size="14" fill="#000">母方减数分裂</text>
            <!-- 母方正常配子 X -->
            <circle id="scene2-mother-gamete-X" class="scene2-element" cx="600" cy="220" r="25" fill="white" stroke="#000" stroke-width="2"/>
            <text id="scene2-mother-gamete-X-text" class="scene2-element" x="600" y="220" text-anchor="middle" dominant-baseline="middle" font-size="16" fill="#1565c0" font-weight="bold">X</text>
            <!-- 母方减数分裂标注（移到区域下方，远离异常区） -->
            <text id="scene2-mother-normal-note" class="scene2-element" x="600" y="365" text-anchor="middle" font-size="12" fill="#666">正常：只产生 X 配子</text>
            <!-- 母方体细胞到配子箭头 -->
            <line id="scene2-mother-to-meiosis-arrow" class="scene2-element" x1="570" y1="140" x2="570" y2="190" stroke="#888" stroke-width="2" marker-end="url(#arrowhead)"/>
            
            <!-- 受精区 -->
            <rect id="scene2-fertilization" class="scene2-element" x="300" y="180" width="200" height="120" fill="#fafafa" stroke="#000" stroke-width="1"/>
            <text id="scene2-fertilization-label" class="scene2-element" x="400" y="172" text-anchor="middle" font-size="14" fill="#000">受精</text>
            <!-- 父方配子到受精区箭头 -->
            <line id="scene2-father-to-fertilization-arrow" class="scene2-element" x1="200" y1="220" x2="300" y2="240" stroke="#888" stroke-width="2" marker-end="url(#arrowhead)"/>
            <!-- 母方配子到受精区箭头 -->
            <line id="scene2-mother-to-fertilization-arrow" class="scene2-element" x1="500" y1="220" x2="400" y2="240" stroke="#888" stroke-width="2" marker-end="url(#arrowhead)"/>
            <!-- 受精卵展示 -->
            <circle id="scene2-zygote" class="scene2-element" cx="400" cy="260" r="30" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
            <text id="scene2-zygote-text" class="scene2-element" x="400" y="260" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#e65100" font-weight="bold">XO</text>
            <text id="scene2-zygote-label" class="scene2-element" x="400" y="305" text-anchor="middle" font-size="12" fill="#666">Ⅱ-5：XO 型</text>
            
            <!-- 异常父方减数分裂区（上移，避免与标注重叠） -->
            <rect id="scene2-father-abnormal" class="scene2-element" x="50" y="370" width="200" height="70" fill="#ffebee" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5"/>
            <text id="scene2-father-abnormal-label" class="scene2-element" x="150" y="362" text-anchor="middle" font-size="14" fill="#c62828" font-weight="bold">父方异常</text>
            <!-- 异常父方配子 XY -->
            <circle id="scene2-abnormal-gamete-XY" class="scene2-element" cx="100" cy="405" r="25" fill="#ffebee" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5"/>
            <text id="scene2-abnormal-gamete-XY-text" class="scene2-element" x="100" y="405" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#c62828" font-weight="bold">XY</text>
            <!-- 异常父方配子 O -->
            <circle id="scene2-abnormal-gamete-O1" class="scene2-element" cx="200" cy="405" r="25" fill="#ffebee" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5"/>
            <text id="scene2-abnormal-gamete-O1-text" class="scene2-element" x="200" y="405" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#c62828" font-weight="bold">O</text>
            <!-- 异常父方标注（移到区域下方，远离结论区） -->
            <text id="scene2-father-abnormal-note" class="scene2-element" x="150" y="475" text-anchor="middle" font-size="11" fill="#c62828">减数分裂Ⅰ未分离→XY 或 O 配子</text>
            
            <!-- 异常母方减数分裂区（上移，避免与标注重叠） -->
            <rect id="scene2-mother-abnormal" class="scene2-element" x="500" y="370" width="200" height="70" fill="#ffebee" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5"/>
            <text id="scene2-mother-abnormal-label" class="scene2-element" x="600" y="362" text-anchor="middle" font-size="14" fill="#c62828" font-weight="bold">母方异常</text>
            <!-- 异常母方配子 XX -->
            <circle id="scene2-abnormal-gamete-XX" class="scene2-element" cx="550" cy="405" r="25" fill="#ffebee" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5"/>
            <text id="scene2-abnormal-gamete-XX-text" class="scene2-element" x="550" y="405" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#c62828" font-weight="bold">XX</text>
            <!-- 异常母方配子 O -->
            <circle id="scene2-abnormal-gamete-O2" class="scene2-element" cx="650" cy="405" r="25" fill="#ffebee" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5"/>
            <text id="scene2-abnormal-gamete-O2-text" class="scene2-element" x="650" y="405" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#c62828" font-weight="bold">O</text>
            <!-- 异常母方标注（移到区域下方，远离结论区） -->
            <text id="scene2-mother-abnormal-note" class="scene2-element" x="600" y="475" text-anchor="middle" font-size="11" fill="#c62828">减数分裂未分离→XX 或 O 配子</text>
            
            <!-- 结论区（上移，避免与标注重叠） -->
            <rect id="scene2-conclusion" class="scene2-element" x="250" y="440" width="300" height="50" fill="#fff3e0" stroke="#888" stroke-width="2"/>
            <text id="scene2-conclusion-text" class="scene2-element" x="400" y="458" text-anchor="middle" font-size="11" fill="#000">点击下一步查看结论</text>
            
            <!-- 箭头标记定义 -->
            <defs>
                <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#888"/>
                </marker>
            </defs>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-prev-btn">◀上一步</button>
            <button id="scene2-next-btn">下一步▶</button>
            <span id="scene2-step-indicator">步骤 1/7</span>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现
        // 布局坐标表对照：
        // | 元素 | 位置/范围 | 备注 |
        // |------|-----------|------|
        // | 标题 | (400,45) | 顶部居中 |
        // | 父方体细胞框 | (80,80)-(180,140) | 左侧上部 |
        // | 母方体细胞框 | (520,80)-(620,140) | 右侧上部 |
        // | 父方配子 | (100,220), (200,220) | 左侧中部 |
        // | 母方配子 | (600,220) | 右侧中部 |
        // | 父方减数分裂区 | (50,280)-(250,360) | 左侧中下部 |
        // | 母方减数分裂区 | (500,280)-(700,360) | 右侧中下部 |
        // | 受精区 | (300,180)-(500,300) | 中央 |
        // | 异常父方减数分裂区 | (50,370)-(250,440) | 左侧下部 |
        // | 异常母方减数分裂区 | (500,370)-(700,440) | 右侧下部 |
        // | 结论区 | (250,440)-(550,490) | 底部中央 |
        
        const totalSteps = 7;
        let currentStep = 0;
        
        // 每个步骤需要显示的元素 ID 列表
        const stepElements = {
            0: [
                'scene2-title',
                'scene2-father-cell', 'scene2-father-label', 'scene2-father-X', 'scene2-father-Y',
                'scene2-mother-cell', 'scene2-mother-label', 'scene2-mother-X1', 'scene2-mother-X2'
            ],
            1: [
                'scene2-title',
                'scene2-father-cell', 'scene2-father-label', 'scene2-father-X', 'scene2-father-Y',
                'scene2-mother-cell', 'scene2-mother-label', 'scene2-mother-X1', 'scene2-mother-X2',
                'scene2-gamete-X', 'scene2-gamete-X-text', 'scene2-gamete-Y', 'scene2-gamete-Y-text',
                'scene2-father-meiosis', 'scene2-father-meiosis-label',
                'scene2-father-normal-note', 'scene2-father-to-meiosis-arrow'
            ],
            2: [
                'scene2-title',
                'scene2-father-cell', 'scene2-father-label', 'scene2-father-X', 'scene2-father-Y',
                'scene2-mother-cell', 'scene2-mother-label', 'scene2-mother-X1', 'scene2-mother-X2',
                'scene2-gamete-X', 'scene2-gamete-X-text', 'scene2-gamete-Y', 'scene2-gamete-Y-text',
                'scene2-father-meiosis', 'scene2-father-meiosis-label',
                'scene2-father-normal-note', 'scene2-father-to-meiosis-arrow',
                'scene2-mother-gamete-X', 'scene2-mother-gamete-X-text',
                'scene2-mother-meiosis', 'scene2-mother-meiosis-label',
                'scene2-mother-normal-note', 'scene2-mother-to-meiosis-arrow'
            ],
            3: [
                'scene2-title',
                'scene2-father-cell', 'scene2-father-label', 'scene2-father-X', 'scene2-father-Y',
                'scene2-mother-cell', 'scene2-mother-label', 'scene2-mother-X1', 'scene2-mother-X2',
                'scene2-gamete-X', 'scene2-gamete-X-text', 'scene2-gamete-Y', 'scene2-gamete-Y-text',
                'scene2-father-meiosis', 'scene2-father-meiosis-label',
                'scene2-father-normal-note', 'scene2-father-to-meiosis-arrow',
                'scene2-mother-gamete-X', 'scene2-mother-gamete-X-text',
                'scene2-mother-meiosis', 'scene2-mother-meiosis-label',
                'scene2-mother-normal-note', 'scene2-mother-to-meiosis-arrow',
                'scene2-father-abnormal', 'scene2-father-abnormal-label',
                'scene2-abnormal-gamete-XY', 'scene2-abnormal-gamete-XY-text',
                'scene2-abnormal-gamete-O1', 'scene2-abnormal-gamete-O1-text',
                'scene2-father-abnormal-note'
            ],
            4: [
                'scene2-title',
                'scene2-father-cell', 'scene2-father-label', 'scene2-father-X', 'scene2-father-Y',
                'scene2-mother-cell', 'scene2-mother-label', 'scene2-mother-X1', 'scene2-mother-X2',
                'scene2-gamete-X', 'scene2-gamete-X-text', 'scene2-gamete-Y', 'scene2-gamete-Y-text',
                'scene2-father-meiosis', 'scene2-father-meiosis-label',
                'scene2-father-normal-note', 'scene2-father-to-meiosis-arrow',
                'scene2-mother-gamete-X', 'scene2-mother-gamete-X-text',
                'scene2-mother-meiosis', 'scene2-mother-meiosis-label',
                'scene2-mother-normal-note', 'scene2-mother-to-meiosis-arrow',
                'scene2-father-abnormal', 'scene2-father-abnormal-label',
                'scene2-abnormal-gamete-XY', 'scene2-abnormal-gamete-XY-text',
                'scene2-abnormal-gamete-O1', 'scene2-abnormal-gamete-O1-text',
                'scene2-father-abnormal-note',
                'scene2-mother-abnormal', 'scene2-mother-abnormal-label',
                'scene2-abnormal-gamete-XX', 'scene2-abnormal-gamete-XX-text',
                'scene2-abnormal-gamete-O2', 'scene2-abnormal-gamete-O2-text',
                'scene2-mother-abnormal-note'
            ],
            5: [
                'scene2-title',
                'scene2-father-cell', 'scene2-father-label', 'scene2-father-X', 'scene2-father-Y',
                'scene2-mother-cell', 'scene2-mother-label', 'scene2-mother-X1', 'scene2-mother-X2',
                'scene2-gamete-X', 'scene2-gamete-X-text', 'scene2-gamete-Y', 'scene2-gamete-Y-text',
                'scene2-father-meiosis', 'scene2-father-meiosis-label',
                'scene2-father-normal-note', 'scene2-father-to-meiosis-arrow',
                'scene2-mother-gamete-X', 'scene2-mother-gamete-X-text',
                'scene2-mother-meiosis', 'scene2-mother-meiosis-label',
                'scene2-mother-normal-note', 'scene2-mother-to-meiosis-arrow',
                'scene2-fertilization', 'scene2-fertilization-label',
                'scene2-father-to-fertilization-arrow', 'scene2-mother-to-fertilization-arrow',
                'scene2-zygote', 'scene2-zygote-text', 'scene2-zygote-label'
            ],
            6: [
                'scene2-title',
                'scene2-father-cell', 'scene2-father-label', 'scene2-father-X', 'scene2-father-Y',
                'scene2-mother-cell', 'scene2-mother-label', 'scene2-mother-X1', 'scene2-mother-X2',
                'scene2-gamete-X', 'scene2-gamete-X-text', 'scene2-gamete-Y', 'scene2-gamete-Y-text',
                'scene2-father-meiosis', 'scene2-father-meiosis-label',
                'scene2-father-normal-note', 'scene2-father-to-meiosis-arrow',
                'scene2-mother-gamete-X', 'scene2-mother-gamete-X-text',
                'scene2-mother-meiosis', 'scene2-mother-meiosis-label',
                'scene2-mother-normal-note', 'scene2-mother-to-meiosis-arrow',
                'scene2-father-abnormal', 'scene2-father-abnormal-label',
                'scene2-abnormal-gamete-XY', 'scene2-abnormal-gamete-XY-text',
                'scene2-abnormal-gamete-O1', 'scene2-abnormal-gamete-O1-text',
                'scene2-father-abnormal-note',
                'scene2-mother-abnormal', 'scene2-mother-abnormal-label',
                'scene2-abnormal-gamete-XX', 'scene2-abnormal-gamete-XX-text',
                'scene2-abnormal-gamete-O2', 'scene2-abnormal-gamete-O2-text',
                'scene2-mother-abnormal-note',
                'scene2-conclusion', 'scene2-conclusion-text'
            ]
        };
        
        // 每个步骤的结论文字
        const conclusionTexts = {
            0: '点击下一步查看结论',
            1: '父方正常减数分裂产生 X 和 Y 配子',
            2: '母方正常减数分裂只产生 X 配子',
            3: '父方异常：减数分裂Ⅰ未分离→XY 或 O 配子',
            4: '母方异常：减数分裂未分离→XX 或 O 配子',
            5: 'Ⅱ-5 成因：异常 O 配子 + 正常 X 配子→XO 型（Turner 综合征）',
            6: '若Ⅰ-1 产生 XY+Ⅰ-2 正常 X→XXY；若Ⅰ-2 产生 XX+Ⅰ-1 正常 Y→XXX；双方均产生 O→OO（致死）'
        };
        
        // 工具函数：显示元素
        function show(elId) {
            const el = document.getElementById(elId);
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }
        
        // 工具函数：隐藏元素
        function hide(elId) {
            const el = document.getElementById(elId);
            if (el) {
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }
        
        // 更新显示状态
        function updateDisplay() {
            // 获取所有 scene2-element 元素
            const allElements = document.querySelectorAll('.scene2-element');
            allElements.forEach(el => {
                const elId = el.id;
                if (stepElements[currentStep].includes(elId)) {
                    show(elId);
                } else {
                    hide(elId);
                }
            });
            
            // 更新结论文字
            const conclusionTextEl = document.getElementById('scene2-conclusion-text');
            if (conclusionTextEl && stepElements[currentStep].includes('scene2-conclusion-text')) {
                conclusionTextEl.textContent = conclusionTexts[currentStep];
            }
            
            // 更新步骤指示器
            const stepIndicator = document.getElementById('scene2-step-indicator');
            stepIndicator.textContent = `步骤 ${currentStep + 1}/${totalSteps}`;
            
            // 更新按钮状态
            const prevBtn = document.getElementById('scene2-prev-btn');
            const nextBtn = document.getElementById('scene2-next-btn');
            
            prevBtn.disabled = (currentStep === 0);
            
            if (currentStep === totalSteps - 1) {
                nextBtn.textContent = '完成';
                nextBtn.disabled = true;
            } else {
                nextBtn.textContent = '下一步▶';
                nextBtn.disabled = false;
            }
        }
        
        // 绑定按钮事件
        document.getElementById('scene2-prev-btn').addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        });
        
        document.getElementById('scene2-next-btn').addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateDisplay();
            }
        });
        
        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
