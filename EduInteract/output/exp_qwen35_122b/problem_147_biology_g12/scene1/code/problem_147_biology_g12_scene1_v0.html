<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCR 技术扩增 DNA 过程</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .control-btn { padding: 8px 20px; font-size: 14px; cursor: pointer; border: 2px solid #333; border-radius: 5px; background: #f5f5f5; }
        .control-btn:hover { background: #e0e0e0; }
        .control-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .temp-label { fill: #666666; font-weight: bold; }
        .temp-label.active { fill: #000000; }
        .temp-bg { fill: #ffffff; stroke: #666666; stroke-width: 1; }
        .temp-bg.active { fill: #fff9c4; stroke: #f57f17; stroke-width: 2; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 标题 (y=40 避免顶部裁切) -->
            <text x="400" y="40" text-anchor="middle" font-size="18" fill="#000000" font-weight="bold">PCR 技术扩增 DNA 过程</text>

            <!-- 95°C 阶段 -->
            <text x="50" y="70" font-size="14" fill="#000000">95°C 变性</text>
            <rect id="scene1-temp-95-bg" x="650" y="55" width="60" height="25" class="temp-bg"/>
            <text id="scene1-temp-95" x="680" y="50" text-anchor="middle" font-size="14" class="temp-label">95°C</text>

            <!-- 原始 DNA 双链（步骤 0-1） -->
            <g id="scene1-dna-original">
                <!-- a 链骨架 -->
                <line x1="150" y1="100" x2="550" y2="100" stroke="#000000" stroke-width="2"/>
                <!-- a 链碱基 -->
                <text x="170" y="90" font-size="14" fill="#1565c0">G</text>
                <text x="210" y="90" font-size="14" fill="#1565c0">G</text>
                <text x="250" y="90" font-size="12" fill="#1565c0">⋯⋯</text>
                <text x="430" y="90" font-size="14" fill="#1565c0">T</text>
                <text x="470" y="90" font-size="14" fill="#1565c0">C</text>
                <text x="135" y="105" font-size="12" fill="#000000">5'</text>
                <text x="565" y="105" font-size="12" fill="#000000">3'</text>

                <!-- b 链骨架 -->
                <line x1="150" y1="120" x2="550" y2="120" stroke="#000000" stroke-width="2"/>
                <!-- b 链碱基 -->
                <text x="170" y="135" font-size="14" fill="#c62828">C</text>
                <text x="210" y="135" font-size="14" fill="#c62828">C</text>
                <text x="250" y="135" font-size="12" fill="#c62828">⋯⋯</text>
                <text x="430" y="135" font-size="14" fill="#c62828">A</text>
                <text x="470" y="135" font-size="14" fill="#c62828">G</text>
                <text x="135" y="125" font-size="12" fill="#000000">3'</text>
                <text x="565" y="125" font-size="12" fill="#000000">5'</text>

                <!-- 氢键 -->
                <line id="scene1-hbond-1" x1="170" y1="100" x2="170" y2="120" stroke="#888888" stroke-width="1" stroke-dasharray="3,3"/>
                <line id="scene1-hbond-2" x1="210" y1="100" x2="210" y2="120" stroke="#888888" stroke-width="1" stroke-dasharray="3,3"/>
                <line id="scene1-hbond-3" x1="430" y1="100" x2="430" y2="120" stroke="#888888" stroke-width="1" stroke-dasharray="3,3"/>
                <line id="scene1-hbond-4" x1="470" y1="100" x2="470" y2="120" stroke="#888888" stroke-width="1" stroke-dasharray="3,3"/>
            </g>

            <!-- 向下箭头 (移到左侧避免与 5' 重叠) -->
            <path id="scene1-arrow-1" d="M120,145 L120,160 L115,155 M120,160 L125,155" stroke="#000000" stroke-width="2" fill="none" opacity="0"/>

            <!-- 55°C 阶段 -->
            <text x="50" y="185" font-size="14" fill="#000000">55°C 复性</text>
            <rect id="scene1-temp-55-bg" x="650" y="170" width="60" height="25" class="temp-bg"/>
            <text id="scene1-temp-55" x="680" y="165" text-anchor="middle" font-size="14" class="temp-label">55°C</text>

            <!-- 分离的 DNA 单链（步骤 1-4） -->
            <g id="scene1-dna-separated" opacity="0">
                <!-- a 链单链 -->
                <line x1="150" y1="195" x2="550" y2="195" stroke="#000000" stroke-width="2"/>
                <text x="170" y="185" font-size="14" fill="#1565c0">G</text>
                <text x="210" y="185" font-size="14" fill="#1565c0">G</text>
                <text x="250" y="185" font-size="12" fill="#1565c0">⋯⋯</text>
                <text x="430" y="185" font-size="14" fill="#1565c0">T</text>
                <text x="470" y="185" font-size="14" fill="#1565c0">C</text>
                <text x="135" y="200" font-size="12" fill="#000000">5'</text>
                <text x="565" y="200" font-size="12" fill="#000000">3'</text>

                <!-- b 链单链 -->
                <line x1="150" y1="235" x2="550" y2="235" stroke="#000000" stroke-width="2"/>
                <text x="170" y="250" font-size="14" fill="#c62828">C</text>
                <text x="210" y="250" font-size="14" fill="#c62828">C</text>
                <text x="250" y="250" font-size="12" fill="#c62828">⋯⋯</text>
                <text x="430" y="250" font-size="14" fill="#c62828">A</text>
                <text x="470" y="250" font-size="14" fill="#c62828">G</text>
                <text x="135" y="240" font-size="12" fill="#000000">3'</text>
                <text x="565" y="240" font-size="12" fill="#000000">5'</text>

                <!-- 引物Ⅰ（结合 b 链） -->
                <g id="scene1-primer1" opacity="0">
                    <line x1="470" y1="255" x2="570" y2="255" stroke="#2e7d32" stroke-width="2"/>
                    <text x="490" y="270" font-size="14" fill="#2e7d32">G</text>
                    <text x="530" y="270" font-size="14" fill="#2e7d32">G</text>
                    <text x="460" y="260" font-size="12" fill="#000000">5'</text>
                    <text x="580" y="260" font-size="12" fill="#000000">3'-OH</text>
                    <!-- 引物与模板氢键 -->
                    <line x1="470" y1="235" x2="470" y2="255" stroke="#2e7d32" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
                    <line x1="510" y1="235" x2="510" y2="255" stroke="#2e7d32" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
                </g>

                <!-- 引物Ⅱ（结合 a 链） -->
                <g id="scene1-primer2" opacity="0">
                    <line x1="470" y1="215" x2="570" y2="215" stroke="#2e7d32" stroke-width="2"/>
                    <text x="490" y="210" font-size="14" fill="#2e7d32">C</text>
                    <text x="530" y="210" font-size="14" fill="#2e7d32">C</text>
                    <text x="460" y="220" font-size="12" fill="#000000">5'</text>
                    <text x="580" y="220" font-size="12" fill="#000000">3'-OH</text>
                    <!-- 引物与模板氢键 -->
                    <line x1="470" y1="195" x2="470" y2="215" stroke="#2e7d32" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
                    <line x1="510" y1="195" x2="510" y2="215" stroke="#2e7d32" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
                </g>
            </g>

            <!-- 向下箭头 2 (移到左侧) -->
            <path id="scene1-arrow-2" d="M120,275 L120,290 L115,285 M120,290 L125,285" stroke="#000000" stroke-width="2" fill="none" opacity="0"/>

            <!-- 72°C 阶段 -->
            <text x="50" y="310" font-size="14" fill="#000000">72°C 延伸</text>
            <rect id="scene1-temp-72-bg" x="650" y="295" width="60" height="25" class="temp-bg"/>
            <text id="scene1-temp-72" x="680" y="290" text-anchor="middle" font-size="14" class="temp-label">72°C</text>

            <!-- DNA 聚合酶图标 (移到右侧，文字放在圆外避免重叠) -->
            <g id="scene1-enzyme" opacity="0">
                <circle cx="600" cy="320" r="20" fill="#ff9800" stroke="#e65100" stroke-width="2"/>
                <text x="600" y="345" text-anchor="middle" font-size="12" fill="#000000">DNA 聚合酶</text>
            </g>

            <!-- 延伸箭头 -->
            <g id="scene1-extend-arrows" opacity="0">
                <path d="M470,210 L470,225 L465,220 M470,225 L475,220" stroke="#888888" stroke-width="2" fill="none"/>
                <path d="M470,250 L470,265 L465,260 M470,265 L475,260" stroke="#888888" stroke-width="2" fill="none"/>
            </g>

            <!-- 产物 DNA 分子（步骤 4） -->
            <g id="scene1-products" opacity="0">
                <!-- 产物 DNA1（左侧） -->
                <g id="scene1-product1">
                    <line x1="150" y1="340" x2="400" y2="340" stroke="#1565c0" stroke-width="2"/>
                    <text x="160" y="335" font-size="12" fill="#1565c0">G</text>
                    <text x="190" y="335" font-size="12" fill="#1565c0">G</text>
                    <text x="230" y="335" font-size="10" fill="#1565c0">⋯</text>
                    <text x="370" y="335" font-size="12" fill="#1565c0">T</text>
                    <text x="400" y="335" font-size="12" fill="#1565c0">C</text>
                    <text x="140" y="345" font-size="10" fill="#000000">5'</text>
                    <text x="410" y="345" font-size="10" fill="#000000">3'</text>

                    <line x1="150" y1="360" x2="400" y2="360" stroke="#888888" stroke-width="2"/>
                    <text x="160" y="375" font-size="12" fill="#888888">C</text>
                    <text x="190" y="375" font-size="12" fill="#888888">C</text>
                    <text x="230" y="375" font-size="10" fill="#888888">⋯</text>
                    <text x="370" y="375" font-size="12" fill="#888888">A</text>
                    <text x="400" y="375" font-size="12" fill="#888888">G</text>
                    <text x="140" y="365" font-size="10" fill="#000000">3'</text>
                    <text x="410" y="365" font-size="10" fill="#000000">5'</text>

                    <!-- 氢键 -->
                    <line x1="160" y1="340" x2="160" y2="360" stroke="#888888" stroke-width="1" stroke-dasharray="2,2"/>
                    <line x1="190" y1="340" x2="190" y2="360" stroke="#888888" stroke-width="1" stroke-dasharray="2,2"/>
                    <line x1="370" y1="340" x2="370" y2="360" stroke="#888888" stroke-width="1" stroke-dasharray="2,2"/>
                    <line x1="400" y1="340" x2="400" y2="360" stroke="#888888" stroke-width="1" stroke-dasharray="2,2"/>
                </g>

                <!-- 产物 DNA2（右侧） -->
                <g id="scene1-product2">
                    <line x1="450" y1="340" x2="700" y2="340" stroke="#888888" stroke-width="2"/>
                    <text x="460" y="335" font-size="12" fill="#888888">G</text>
                    <text x="490" y="335" font-size="12" fill="#888888">G</text>
                    <text x="530" y="335" font-size="10" fill="#888888">⋯</text>
                    <text x="670" y="335" font-size="12" fill="#888888">T</text>
                    <text x="700" y="335" font-size="12" fill="#888888">C</text>
                    <text x="440" y="345" font-size="10" fill="#000000">5'</text>
                    <text x="710" y="345" font-size="10" fill="#000000">3'</text>

                    <line x1="450" y1="360" x2="700" y2="360" stroke="#c62828" stroke-width="2"/>
                    <text x="460" y="375" font-size="12" fill="#c62828">C</text>
                    <text x="490" y="375" font-size="12" fill="#c62828">C</text>
                    <text x="530" y="375" font-size="10" fill="#c62828">⋯</text>
                    <text x="670" y="375" font-size="12" fill="#c62828">A</text>
                    <text x="700" y="375" font-size="12" fill="#c62828">G</text>
                    <text x="440" y="365" font-size="10" fill="#000000">3'</text>
                    <text x="710" y="365" font-size="10" fill="#000000">5'</text>

                    <!-- 氢键 -->
                    <line x1="460" y1="340" x2="460" y2="360" stroke="#888888" stroke-width="1" stroke-dasharray="2,2"/>
                    <line x1="490" y1="340" x2="490" y2="360" stroke="#888888" stroke-width="1" stroke-dasharray="2,2"/>
                    <line x1="670" y1="340" x2="670" y2="360" stroke="#888888" stroke-width="1" stroke-dasharray="2,2"/>
                    <line x1="700" y1="340" x2="700" y2="360" stroke="#888888" stroke-width="1" stroke-dasharray="2,2"/>
                </g>
            </g>

            <!-- 结论标签 -->
            <text id="scene1-conclusion" x="400" y="420" text-anchor="middle" font-size="14" fill="#000000" opacity="0">循环一次后：半保留复制</text>

            <!-- 控件栏 -->
            <div id="scene1-controls">
                <button id="scene1-prev-btn" class="control-btn" disabled>◀ 上一步</button>
                <button id="scene1-next-btn" class="control-btn">下一步 ▶</button>
            </div>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 1: PCR 技术扩增 DNA 过程
        // 布局坐标表（参考）：
        // | 元素 | 位置/范围 | 备注 |
        // | 标题 | (400,40) | 居中 |
        // | 95°C 阶段 | (50,70) | 左侧 |
        // | 原始 DNA | (150,90)-(550,130) | 双链 |
        // | 55°C 阶段 | (50,185) | 左侧 |
        // | 分离 DNA | (150,195)-(550,255) | 单链 |
        // | 引物Ⅰ | (470,255) | 结合 b 链 |
        // | 引物Ⅱ | (470,215) | 结合 a 链 |
        // | 72°C 阶段 | (50,310) | 左侧 |
        // | 产物 DNA | (150,340)-(700,380) | 两个分子 |
        // | 结论 | (400,420) | 底部居中 |

        const TOTAL_STEPS = 5;
        let currentStep = 0;

        // 工具函数
        function show(el) {
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }

        function hide(el) {
            if (el) {
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }

        function setOpacity(el, opacity) {
            if (el) {
                el.style.opacity = opacity;
            }
        }

        // 更新步骤显示
        function updateStep(step) {
            currentStep = step;

            // 重置所有温度标签
            document.getElementById('scene1-temp-95-bg').classList.remove('active');
            document.getElementById('scene1-temp-95').classList.remove('active');
            document.getElementById('scene1-temp-55-bg').classList.remove('active');
            document.getElementById('scene1-temp-55').classList.remove('active');
            document.getElementById('scene1-temp-72-bg').classList.remove('active');
            document.getElementById('scene1-temp-72').classList.remove('active');

            // 步骤 0: 初始状态 - 显示原始 DNA
            if (step === 0) {
                show(document.getElementById('scene1-dna-original'));
                hide(document.getElementById('scene1-dna-separated'));
                hide(document.getElementById('scene1-products'));
                setOpacity(document.getElementById('scene1-arrow-1'), 0);
                setOpacity(document.getElementById('scene1-arrow-2'), 0);
                setOpacity(document.getElementById('scene1-enzyme'), 0);
                setOpacity(document.getElementById('scene1-extend-arrows'), 0);
                setOpacity(document.getElementById('scene1-conclusion'), 0);
                document.getElementById('scene1-prev-btn').disabled = true;
                document.getElementById('scene1-next-btn').disabled = false;
            }
            // 步骤 1: 95°C 变性
            else if (step === 1) {
                document.getElementById('scene1-temp-95-bg').classList.add('active');
                document.getElementById('scene1-temp-95').classList.add('active');
                hide(document.getElementById('scene1-dna-original'));
                show(document.getElementById('scene1-dna-separated'));
                hide(document.getElementById('scene1-products'));
                setOpacity(document.getElementById('scene1-arrow-1'), 1);
                setOpacity(document.getElementById('scene1-arrow-2'), 0);
                setOpacity(document.getElementById('scene1-enzyme'), 0);
                setOpacity(document.getElementById('scene1-extend-arrows'), 0);
                setOpacity(document.getElementById('scene1-conclusion'), 0);
                setOpacity(document.getElementById('scene1-primer1'), 0);
                setOpacity(document.getElementById('scene1-primer2'), 0);
                document.getElementById('scene1-prev-btn').disabled = false;
                document.getElementById('scene1-next-btn').disabled = false;
            }
            // 步骤 2: 55°C 复性
            else if (step === 2) {
                document.getElementById('scene1-temp-55-bg').classList.add('active');
                document.getElementById('scene1-temp-55').classList.add('active');
                show(document.getElementById('scene1-dna-separated'));
                hide(document.getElementById('scene1-products'));
                setOpacity(document.getElementById('scene1-arrow-1'), 0);
                setOpacity(document.getElementById('scene1-arrow-2'), 1);
                setOpacity(document.getElementById('scene1-enzyme'), 0);
                setOpacity(document.getElementById('scene1-extend-arrows'), 0);
                setOpacity(document.getElementById('scene1-conclusion'), 0);
                setOpacity(document.getElementById('scene1-primer1'), 1);
                setOpacity(document.getElementById('scene1-primer2'), 1);
                document.getElementById('scene1-prev-btn').disabled = false;
                document.getElementById('scene1-next-btn').disabled = false;
            }
            // 步骤 3: 72°C 延伸
            else if (step === 3) {
                document.getElementById('scene1-temp-72-bg').classList.add('active');
                document.getElementById('scene1-temp-72').classList.add('active');
                show(document.getElementById('scene1-dna-separated'));
                hide(document.getElementById('scene1-products'));
                setOpacity(document.getElementById('scene1-arrow-1'), 0);
                setOpacity(document.getElementById('scene1-arrow-2'), 0);
                setOpacity(document.getElementById('scene1-enzyme'), 1);
                setOpacity(document.getElementById('scene1-extend-arrows'), 1);
                setOpacity(document.getElementById('scene1-conclusion'), 0);
                setOpacity(document.getElementById('scene1-primer1'), 1);
                setOpacity(document.getElementById('scene1-primer2'), 1);
                document.getElementById('scene1-prev-btn').disabled = false;
                document.getElementById('scene1-next-btn').disabled = false;
            }
            // 步骤 4: 结论状态
            else if (step === 4) {
                document.getElementById('scene1-temp-72-bg').classList.add('active');
                document.getElementById('scene1-temp-72').classList.add('active');
                hide(document.getElementById('scene1-dna-separated'));
                show(document.getElementById('scene1-products'));
                setOpacity(document.getElementById('scene1-arrow-1'), 0);
                setOpacity(document.getElementById('scene1-arrow-2'), 0);
                setOpacity(document.getElementById('scene1-enzyme'), 0);
                setOpacity(document.getElementById('scene1-extend-arrows'), 0);
                setOpacity(document.getElementById('scene1-conclusion'), 1);
                setOpacity(document.getElementById('scene1-primer1'), 0);
                setOpacity(document.getElementById('scene1-primer2'), 0);
                document.getElementById('scene1-prev-btn').disabled = false;
                document.getElementById('scene1-next-btn').disabled = true;
            }
        }

        // 事件绑定
        document.getElementById('scene1-prev-btn').addEventListener('click', function() {
            if (currentStep > 0) {
                updateStep(currentStep - 1);
            }
        });

        document.getElementById('scene1-next-btn').addEventListener('click', function() {
            if (currentStep < TOTAL_STEPS - 1) {
                updateStep(currentStep + 1);
            }
        });

        // 初始化
        updateStep(0);
    })();
    </script>
</body>
</html>
