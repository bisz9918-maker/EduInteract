<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>甲烷与水反应微观示意图</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Microsoft YaHei', sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene1-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 2px solid #333; border-radius: 6px; background: #f0f0f0; }
        .scene1-btn:hover:not(:disabled) { background: #e0e0e0; }
        .scene1-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene1-glow { filter: drop-shadow(0 0 8px #1565c0); }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- 图例区背景 -->
            <rect id="scene1-legend-bg" x="20" y="10" width="760" height="25" fill="#f5f5f5" stroke="#000000" stroke-width="1" opacity="0.5"/>
            
            <!-- 氢原子图例 -->
            <circle id="scene1-legend-h" cx="100" cy="45" r="15" fill="#ffffff" stroke="#000000" stroke-width="1"/>
            <text id="scene1-legend-h-text" x="135" y="50" font-size="14" fill="#000000">氢原子</text>
            
            <!-- 氧原子图例 -->
            <circle id="scene1-legend-o" cx="250" cy="45" r="15" fill="#000000"/>
            <text id="scene1-legend-o-text" x="285" y="50" font-size="14" fill="#000000">氧原子</text>
            
            <!-- 碳原子图例 -->
            <circle id="scene1-legend-c" cx="400" cy="45" r="15" fill="#888888" stroke="#000000" stroke-width="1"/>
            <text id="scene1-legend-c-text" x="435" y="50" font-size="14" fill="#000000">碳原子</text>
            
            <!-- 反应箭头 -->
            <line id="scene1-arrow-line" x1="330" y1="150" x2="470" y2="150" stroke="#000000" stroke-width="4"/>
            <polygon id="scene1-arrow-head" points="470,150 455,142 455,158" fill="#000000"/>
            
            <!-- 高温标签 -->
            <text id="scene1-temp-label" x="390" y="135" font-size="14" fill="#000000" text-anchor="middle">高温</text>
            
            <!-- 甲分子（CH₄）：碳原子居中，4 个氢原子呈十字形 -->
            <g id="scene1-mol-ch4">
                <circle id="scene1-atom-c-ch4" cx="150" cy="110" r="20" fill="#888888" stroke="#000000" stroke-width="1"/>
                <circle id="scene1-atom-h-ch4-1" cx="150" cy="70" r="20" fill="#ffffff" stroke="#000000" stroke-width="1"/>
                <circle id="scene1-atom-h-ch4-2" cx="190" cy="110" r="20" fill="#ffffff" stroke="#000000" stroke-width="1"/>
                <circle id="scene1-atom-h-ch4-3" cx="150" cy="150" r="20" fill="#ffffff" stroke="#000000" stroke-width="1"/>
                <circle id="scene1-atom-h-ch4-4" cx="110" cy="110" r="20" fill="#ffffff" stroke="#000000" stroke-width="1"/>
            </g>
            
            <!-- 乙分子（H₂O）：氧原子居中，2 个氢原子呈 V 形 -->
            <g id="scene1-mol-h2o">
                <circle id="scene1-atom-o-h2o" cx="250" cy="190" r="20" fill="#000000"/>
                <circle id="scene1-atom-h-h2o-1" cx="230" cy="200" r="20" fill="#ffffff" stroke="#000000" stroke-width="1"/>
                <circle id="scene1-atom-h-h2o-2" cx="270" cy="200" r="20" fill="#ffffff" stroke="#000000" stroke-width="1"/>
            </g>
            
            <!-- 丙分子（CO）：碳原子和氧原子相邻 -->
            <g id="scene1-mol-co">
                <circle id="scene1-atom-c-co" cx="570" cy="110" r="20" fill="#888888" stroke="#000000" stroke-width="1"/>
                <circle id="scene1-atom-o-co" cx="610" cy="110" r="20" fill="#000000"/>
            </g>
            
            <!-- 丁分子（H₂）×3 -->
            <g id="scene1-mol-h2-1">
                <circle id="scene1-atom-h-h2-1a" cx="620" cy="160" r="20" fill="#ffffff" stroke="#000000" stroke-width="1"/>
                <circle id="scene1-atom-h-h2-1b" cx="660" cy="160" r="20" fill="#ffffff" stroke="#000000" stroke-width="1"/>
            </g>
            <g id="scene1-mol-h2-2">
                <circle id="scene1-atom-h-h2-2a" cx="620" cy="190" r="20" fill="#ffffff" stroke="#000000" stroke-width="1"/>
                <circle id="scene1-atom-h-h2-2b" cx="660" cy="190" r="20" fill="#ffffff" stroke="#000000" stroke-width="1"/>
            </g>
            <g id="scene1-mol-h2-3">
                <circle id="scene1-atom-h-h2-3a" cx="640" cy="175" r="20" fill="#ffffff" stroke="#000000" stroke-width="1"/>
                <circle id="scene1-atom-h-h2-3b" cx="680" cy="175" r="20" fill="#ffffff" stroke="#000000" stroke-width="1"/>
            </g>
            
            <!-- 分子标签 - 放在分子下方 -->
            <text id="scene1-label-ch4" x="165" y="185" font-size="16" fill="#000000" font-weight="bold">甲</text>
            <text id="scene1-label-h2o" x="255" y="235" font-size="16" fill="#000000" font-weight="bold">乙</text>
            <text id="scene1-label-co" x="565" y="150" font-size="16" fill="#000000" font-weight="bold">丙</text>
            <text id="scene1-label-h2" x="635" y="220" font-size="16" fill="#000000" font-weight="bold">丁</text>
            
            <!-- 化学式标签（步骤 1-4 显示）- 放在分子标签下方 -->
            <text id="scene1-formula-ch4" x="140" y="210" font-size="16" fill="#1565c0" opacity="0">CH₄</text>
            <text id="scene1-formula-h2o" x="230" y="270" font-size="16" fill="#2e7d32" opacity="0">H₂O</text>
            <text id="scene1-formula-co" x="545" y="175" font-size="16" fill="#c62828" opacity="0">CO</text>
            <text id="scene1-formula-h2" x="625" y="245" font-size="16" fill="#f57c00" opacity="0">H₂</text>
            
            <!-- 容器下方标签 -->
            <text id="scene1-before-label" x="180" y="265" font-size="16" fill="#000000">反应前</text>
            <text id="scene1-after-label" x="580" y="265" font-size="16" fill="#000000">反应后</text>
            
            <!-- 方程式区（步骤 5 显示） -->
            <rect id="scene1-equation-bg" x="100" y="285" width="600" height="50" fill="#f5f5f5" stroke="#000000" stroke-width="1" opacity="0.2" opacity="0"/>
            <text id="scene1-equation-text" x="120" y="315" font-size="16" opacity="0">CH₄ + H₂O → CO + 3H₂</text>
            
            <!-- 原子守恒连线（步骤 6 显示）- 调整位置避免与高温标签重叠 -->
            <g id="scene1-conservation-lines" opacity="0">
                <!-- 碳原子连线 - 从高温标签下方经过 -->
                <line id="scene1-line-c" x1="150" y1="110" x2="570" y2="110" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" opacity="0.5"/>
                <!-- 氧原子连线 - 从高温标签下方经过 -->
                <line id="scene1-line-o" x1="250" y1="190" x2="610" y2="110" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" opacity="0.5"/>
                <!-- 氢原子连线（简化为几条代表性连线）- 从高温标签下方经过 -->
                <line id="scene1-line-h1" x1="150" y1="70" x2="620" y2="160" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" opacity="0.5"/>
                <line id="scene1-line-h2" x1="190" y1="110" x2="660" y2="160" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" opacity="0.5"/>
                <line id="scene1-line-h3" x1="150" y1="150" x2="620" y2="190" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" opacity="0.5"/>
                <line id="scene1-line-h4" x1="110" y1="110" x2="660" y2="190" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" opacity="0.5"/>
                <line id="scene1-line-h5" x1="230" y1="200" x2="640" y2="175" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" opacity="0.5"/>
                <line id="scene1-line-h6" x1="270" y1="200" x2="680" y2="175" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" opacity="0.5"/>
            </g>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-prev-btn" class="scene1-btn" disabled>◀ 上一步</button>
            <button id="scene1-next-btn" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1: 甲烷与水反应微观示意图
        // 布局坐标表对照：
        // | 元素 | 类型 | 位置/范围 | 大小 | 备注 |
        // | 图例区背景 | 矩形 | (20,10)-(780,35) | 760×25 | 顶部横向 |
        // | 氢原子图例 | 圆 + 文字 | (100,45) | 30×30 | 白色圆黑边框 |
        // | 氧原子图例 | 圆 + 文字 | (250,45) | 30×30 | 黑色实心 |
        // | 碳原子图例 | 圆 + 文字 | (400,45) | 30×30 | 斜线填充 |
        // | 反应箭头 | 线段 + 箭头 | (330,150)-(470,150) | 140×4 | 水平居中 |
        // | 高温标签 | text | (390,135) | - | 箭头上 |
        // | 甲分子 (CH₄) | 原子组合 | (150,110) | ~80×80 | 左框左上 |
        // | 乙分子 (H₂O) | 原子组合 | (250,190) | ~60×60 | 左框右下 |
        // | 丙分子 (CO) | 原子组合 | (570,110) | ~60×40 | 右框左上 |
        // | 丁分子 (H₂)×3 | 原子组合 | (620,160) | ~50×30 | 右框右下 |
        
        const scene1 = {
            currentStep: 0,
            totalSteps: 6,
            
            // 元素引用
            elements: {
                // 分子组
                molCh4: document.getElementById('scene1-mol-ch4'),
                molH2o: document.getElementById('scene1-mol-h2o'),
                molCo: document.getElementById('scene1-mol-co'),
                molH2_1: document.getElementById('scene1-mol-h2-1'),
                molH2_2: document.getElementById('scene1-mol-h2-2'),
                molH2_3: document.getElementById('scene1-mol-h2-3'),
                
                // 分子标签
                labelCh4: document.getElementById('scene1-label-ch4'),
                labelH2o: document.getElementById('scene1-label-h2o'),
                labelCo: document.getElementById('scene1-label-co'),
                labelH2: document.getElementById('scene1-label-h2'),
                
                // 化学式标签
                formulaCh4: document.getElementById('scene1-formula-ch4'),
                formulaH2o: document.getElementById('scene1-formula-h2o'),
                formulaCo: document.getElementById('scene1-formula-co'),
                formulaH2: document.getElementById('scene1-formula-h2'),
                
                // 方程式区
                equationBg: document.getElementById('scene1-equation-bg'),
                equationText: document.getElementById('scene1-equation-text'),
                
                // 原子守恒连线
                conservationLines: document.getElementById('scene1-conservation-lines'),
                
                // 按钮
                prevBtn: document.getElementById('scene1-prev-btn'),
                nextBtn: document.getElementById('scene1-next-btn')
            },
            
            // 工具函数：显示元素
            show: function(el) {
                if (el) {
                    el.style.display = 'block';
                    el.style.opacity = '1';
                }
            },
            
            // 工具函数：隐藏元素
            hide: function(el) {
                if (el) {
                    el.style.display = 'none';
                    el.style.opacity = '0';
                }
            },
            
            // 工具函数：移除高亮
            removeGlow: function(el) {
                if (el) {
                    el.classList.remove('scene1-glow');
                }
            },
            
            // 工具函数：添加高亮
            addGlow: function(el) {
                if (el) {
                    el.classList.add('scene1-glow');
                }
            },
            
            // 渲染当前步骤
            renderStep: function() {
                const el = this.elements;
                
                // 重置所有高亮
                this.removeGlow(el.molCh4);
                this.removeGlow(el.molH2o);
                this.removeGlow(el.molCo);
                this.removeGlow(el.molH2_1);
                this.removeGlow(el.molH2_2);
                this.removeGlow(el.molH2_3);
                
                // 重置化学式标签
                this.hide(el.formulaCh4);
                this.hide(el.formulaH2o);
                this.hide(el.formulaCo);
                this.hide(el.formulaH2);
                
                // 重置方程式区
                this.hide(el.equationBg);
                this.hide(el.equationText);
                
                // 重置原子守恒连线
                this.hide(el.conservationLines);
                
                switch(this.currentStep) {
                    case 0: // 初始状态：显示全貌，无化学式
                        break;
                        
                    case 1: // 高亮甲分子，显示 CH₄
                        this.addGlow(el.molCh4);
                        this.show(el.formulaCh4);
                        break;
                        
                    case 2: // 高亮乙分子，显示 H₂O
                        this.addGlow(el.molH2o);
                        this.show(el.formulaH2o);
                        break;
                        
                    case 3: // 高亮丙分子，显示 CO
                        this.addGlow(el.molCo);
                        this.show(el.formulaCo);
                        break;
                        
                    case 4: // 高亮丁分子，显示 H₂
                        this.addGlow(el.molH2_1);
                        this.addGlow(el.molH2_2);
                        this.addGlow(el.molH2_3);
                        this.show(el.formulaH2);
                        break;
                        
                    case 5: // 显示方程式
                        this.show(el.equationBg);
                        this.show(el.equationText);
                        break;
                        
                    case 6: // 显示原子守恒连线
                        this.show(el.equationBg);
                        this.show(el.equationText);
                        this.show(el.conservationLines);
                        break;
                }
                
                // 更新按钮状态
                el.prevBtn.disabled = (this.currentStep === 0);
                el.nextBtn.disabled = (this.currentStep === this.totalSteps);
            },
            
            // 上一步
            prev: function() {
                if (this.currentStep > 0) {
                    this.currentStep--;
                    this.renderStep();
                }
            },
            
            // 下一步
            next: function() {
                if (this.currentStep < this.totalSteps) {
                    this.currentStep++;
                    this.renderStep();
                }
            },
            
            // 初始化
            init: function() {
                this.renderStep();
                
                // 绑定按钮事件
                el.prevBtn.addEventListener('click', () => this.prev());
                el.nextBtn.addEventListener('click', () => this.next());
            }
        };
        
        const el = scene1.elements;
        scene1.init();
    })();
    </script>
</body>
</html>
