<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实验装置的选择与连接顺序</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene2-controls button { padding: 8px 16px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; background: #f5f5f5; }
        #scene2-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene2-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene2-btn-next { background: #1976d2; color: white; border-color: #1976d2; }
        #scene2-btn-next:hover:not(:disabled) { background: #1565c0; }
        .blue-highlight { stroke: #1565c0 !important; stroke-width: 3 !important; }
        .red-highlight { stroke: #c62828 !important; stroke-width: 3 !important; }
        .green-highlight { stroke: #2e7d32 !important; stroke-width: 3 !important; fill: rgba(46,125,50,0.2) !important; }
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .flash { animation: flash 0.8s ease-in-out 3; }
        @keyframes flash { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" id="scene2-svg">
            <!-- 标题 -->
            <text x="400" y="50" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">实验装置的选择与连接顺序</text>
            
            <!-- 装置 a（酒精灯） -->
            <g id="scene2-device-a" opacity="1">
                <!-- 瓶身 -->
                <rect x="60" y="100" width="40" height="60" fill="none" stroke="#000" stroke-width="2" id="scene2-device-a-body"/>
                <!-- 灯芯 -->
                <line x1="80" y1="100" x2="80" y2="90" stroke="#000" stroke-width="2" id="scene2-device-a-wick"/>
                <!-- 火焰 -->
                <path d="M70,80 L90,80 L80,65 Z" fill="#ff9800" opacity="0.7" id="scene2-device-a-flame"/>
                <!-- 底座 -->
                <rect x="55" y="160" width="50" height="10" fill="#8d6e63" id="scene2-device-a-base"/>
                <!-- 标签 a（调整 y 坐标到 185） -->
                <text x="75" y="185" text-anchor="middle" font-size="16" fill="#000" id="scene2-device-a-label">a</text>
                <!-- 功能标签（调整 y 坐标到 205，与标签 a 间距 20px） -->
                <text x="55" y="205" font-size="12" fill="#333" id="scene2-device-a-func">尾气处理</text>
            </g>
            
            <!-- 装置 b（氢氧化钠浓溶液） -->
            <g id="scene2-device-b" opacity="1">
                <!-- 瓶身 -->
                <rect x="200" y="100" width="80" height="80" fill="none" stroke="#000" stroke-width="2" id="scene2-device-b-body"/>
                <!-- 瓶塞 -->
                <rect x="210" y="90" width="60" height="10" fill="#9e9e9e" id="scene2-device-b-stopper"/>
                <!-- 进气管（长管） -->
                <line x1="230" y1="100" x2="230" y2="150" stroke="#000" stroke-width="3" id="scene2-device-b-inlet"/>
                <!-- 出气管（短管） -->
                <line x1="250" y1="100" x2="250" y2="115" stroke="#000" stroke-width="3" id="scene2-device-b-outlet"/>
                <!-- 液面线 -->
                <line x1="205" y1="140" x2="275" y2="140" stroke="#000" stroke-width="1" id="scene2-device-b-liquid"/>
                <!-- 液体填充（半透明） -->
                <rect x="202" y="140" width="76" height="38" fill="#bbdefb" opacity="0.3" id="scene2-device-b-fill"/>
                <!-- 标签 b（调整 y 坐标到 210） -->
                <text x="235" y="210" text-anchor="middle" font-size="16" fill="#000" id="scene2-device-b-label">b</text>
                <!-- 功能标签（调整 y 坐标到 230，与标签 b 间距 20px） -->
                <text x="190" y="230" font-size="12" fill="#333" id="scene2-device-b-func">吸收 CO₂</text>
            </g>
            
            <!-- 装置 c（浓硫酸） -->
            <g id="scene2-device-c" opacity="1">
                <!-- 瓶身 -->
                <rect x="360" y="100" width="80" height="80" fill="none" stroke="#000" stroke-width="2" id="scene2-device-c-body"/>
                <!-- 瓶塞 -->
                <rect x="370" y="90" width="60" height="10" fill="#9e9e9e" id="scene2-device-c-stopper"/>
                <!-- 进气管（长管） -->
                <line x1="390" y1="100" x2="390" y2="150" stroke="#000" stroke-width="3" id="scene2-device-c-inlet"/>
                <!-- 出气管（短管） -->
                <line x1="410" y1="100" x2="410" y2="115" stroke="#000" stroke-width="3" id="scene2-device-c-outlet"/>
                <!-- 液面线 -->
                <line x1="365" y1="140" x2="435" y2="140" stroke="#000" stroke-width="1" id="scene2-device-c-liquid"/>
                <!-- 液体填充（半透明） -->
                <rect x="362" y="140" width="76" height="38" fill="#fff9c4" opacity="0.3" id="scene2-device-c-fill"/>
                <!-- 标签 c（调整 y 坐标到 210） -->
                <text x="395" y="210" text-anchor="middle" font-size="16" fill="#000" id="scene2-device-c-label">c</text>
                <!-- 功能标签（调整 y 坐标到 230，与标签 c 间距 20px） -->
                <text x="350" y="230" font-size="12" fill="#333" id="scene2-device-c-func">吸收 H₂O</text>
            </g>
            
            <!-- 装置 d（澄清石灰水） -->
            <g id="scene2-device-d" opacity="1">
                <!-- 瓶身 -->
                <rect x="520" y="100" width="80" height="80" fill="none" stroke="#000" stroke-width="2" id="scene2-device-d-body"/>
                <!-- 瓶塞 -->
                <rect x="530" y="90" width="60" height="10" fill="#9e9e9e" id="scene2-device-d-stopper"/>
                <!-- 进气管（长管） -->
                <line x1="550" y1="100" x2="550" y2="150" stroke="#000" stroke-width="3" id="scene2-device-d-inlet"/>
                <!-- 出气管（短管） -->
                <line x1="570" y1="100" x2="570" y2="115" stroke="#000" stroke-width="3" id="scene2-device-d-outlet"/>
                <!-- 液面线 -->
                <line x1="525" y1="140" x2="595" y2="140" stroke="#000" stroke-width="1" id="scene2-device-d-liquid"/>
                <!-- 液体填充（半透明） -->
                <rect x="522" y="140" width="76" height="38" fill="#e1bee7" opacity="0.3" id="scene2-device-d-fill"/>
                <!-- 标签 d（调整 y 坐标到 210） -->
                <text x="555" y="210" text-anchor="middle" font-size="16" fill="#000" id="scene2-device-d-label">d</text>
                <!-- 功能标签（调整 y 坐标到 230，与标签 d 间距 20px） -->
                <text x="510" y="230" font-size="12" fill="#333" id="scene2-device-d-func">检验 CO₂</text>
            </g>
            
            <!-- 推理区标题（调整 y 坐标到 260） -->
            <text x="50" y="260" font-size="14" font-weight="bold" fill="#333" id="scene2-reasoning-title">推理过程：</text>
            
            <!-- 推理步骤文本（调整 y 坐标到 290，与推理标题间距 30px） -->
            <text x="50" y="290" font-size="14" fill="#333" id="scene2-reasoning-text">观察图乙四个装置，分析每个装置的功能</text>
            
            <!-- 连接顺序区标题（调整 y 坐标到 360） -->
            <text x="400" y="360" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" id="scene2-order-title">正确连接顺序：</text>
            
            <!-- 步骤指示器（调整 y 坐标到 385，与连接顺序区标题间距 25px） -->
            <text x="400" y="385" text-anchor="middle" font-size="12" fill="#666" id="scene2-step-indicator">步骤 0/5</text>
            
            <!-- 连接顺序区（初始隐藏） -->
            <g id="scene2-order-group" opacity="0">
                <!-- 气体入口 -->
                <text x="100" y="430" font-size="12" fill="#333" id="scene2-gas-inlet">混合气体→</text>
                
                <!-- 顺序装置 b（调整 y 坐标到 415，文字移到矩形下方） -->
                <rect x="150" y="415" width="60" height="40" fill="none" stroke="#000" stroke-width="2" id="scene2-order-b"/>
                <text x="180" y="465" text-anchor="middle" font-size="14" fill="#000" id="scene2-order-b-text">b</text>
                
                <!-- 连接箭头 1 -->
                <line x1="210" y1="435" x2="250" y2="435" stroke="#888" stroke-width="2" id="scene2-arrow-1" opacity="0"/>
                <polygon points="250,435 240,430 240,440" fill="#888" id="scene2-arrow-1-head" opacity="0"/>
                
                <!-- 顺序装置 c -->
                <rect x="250" y="415" width="60" height="40" fill="none" stroke="#000" stroke-width="2" id="scene2-order-c"/>
                <text x="280" y="465" text-anchor="middle" font-size="14" fill="#000" id="scene2-order-c-text">c</text>
                
                <!-- 连接箭头 2 -->
                <line x1="310" y1="435" x2="350" y2="435" stroke="#888" stroke-width="2" id="scene2-arrow-2" opacity="0"/>
                <polygon points="350,435 340,430 340,440" fill="#888" id="scene2-arrow-2-head" opacity="0"/>
                
                <!-- 顺序装置 d -->
                <rect x="350" y="415" width="60" height="40" fill="none" stroke="#000" stroke-width="2" id="scene2-order-d"/>
                <text x="380" y="465" text-anchor="middle" font-size="14" fill="#000" id="scene2-order-d-text">d</text>
                
                <!-- 连接箭头 3 -->
                <line x1="410" y1="435" x2="450" y2="435" stroke="#888" stroke-width="2" id="scene2-arrow-3" opacity="0"/>
                <polygon points="450,435 440,430 440,440" fill="#888" id="scene2-arrow-3-head" opacity="0"/>
                
                <!-- 顺序装置 a -->
                <rect x="450" y="415" width="60" height="40" fill="none" stroke="#000" stroke-width="2" id="scene2-order-a"/>
                <text x="480" y="465" text-anchor="middle" font-size="14" fill="#000" id="scene2-order-a-text">a</text>
                
                <!-- 气体出口 -->
                <text x="520" y="430" font-size="12" fill="#333" id="scene2-gas-outlet">→尾气</text>
            </g>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-btn-prev">◀ 上一步</button>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现
        // 布局坐标表对照（已修复）：
        // | 元素 | 位置 | 备注 |
        // | 标题 | (400,50) | 居中 |
        // | 装置 a | (60,100)-(100,160) | 酒精灯 |
        // | 装置 a 标签 | (75,185) | 避免与瓶身重叠 |
        // | 装置 a 功能 | (55,205) | 与标签 a 间距 20px |
        // | 装置 b | (200,100)-(280,180) | 氢氧化钠 |
        // | 装置 b 标签 | (235,210) | 避免与瓶身重叠 |
        // | 装置 b 功能 | (190,230) | 与标签 b 间距 20px |
        // | 装置 c | (360,100)-(440,180) | 浓硫酸 |
        // | 装置 c 标签 | (395,210) | 避免与瓶身重叠 |
        // | 装置 c 功能 | (350,230) | 与标签 c 间距 20px |
        // | 装置 d | (520,100)-(600,180) | 澄清石灰水 |
        // | 装置 d 标签 | (555,210) | 避免与瓶身重叠 |
        // | 装置 d 功能 | (510,230) | 与标签 d 间距 20px |
        // | 推理标题 | (50,260) | 与装置功能标签间距 30px |
        // | 推理文本 | (50,290) | 与推理标题间距 30px |
        // | 连接顺序标题 | (400,360) | 与推理文本间距 70px |
        // | 步骤指示器 | (400,385) | 与连接顺序标题间距 25px |
        // | 连接顺序区 | (150,415)-(510,455) | 文字移到矩形下方 |
        // | 气体入口 | (100,430) | |
        // | 气体出口 | (520,430) | |
        // | 控件栏 | (0,440)-(800,490) | 底部 |
        
        const TOTAL_STEPS = 5;
        let currentStep = 0;
        
        // 工具函数
        function show(el) {
            if (el) { el.style.display = 'block'; el.style.opacity = '1'; }
        }
        function hide(el) {
            if (el) { el.style.display = 'none'; el.style.opacity = '0'; }
        }
        function setOpacity(el, opacity) {
            if (el) el.style.opacity = opacity;
        }
        function addClass(el, className) {
            if (el) el.classList.add(className);
        }
        function removeClass(el, className) {
            if (el) el.classList.remove(className);
        }
        
        // 获取 DOM 元素
        const reasoningText = document.getElementById('scene2-reasoning-text');
        const reasoningTitle = document.getElementById('scene2-reasoning-title');
        const orderTitle = document.getElementById('scene2-order-title');
        const stepIndicator = document.getElementById('scene2-step-indicator');
        const orderGroup = document.getElementById('scene2-order-group');
        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        
        // 装置元素
        const deviceA = document.getElementById('scene2-device-a');
        const deviceB = document.getElementById('scene2-device-b');
        const deviceC = document.getElementById('scene2-device-c');
        const deviceD = document.getElementById('scene2-device-d');
        
        // 连接顺序元素
        const orderB = document.getElementById('scene2-order-b');
        const orderC = document.getElementById('scene2-order-c');
        const orderD = document.getElementById('scene2-order-d');
        const orderA = document.getElementById('scene2-order-a');
        const arrow1 = document.getElementById('scene2-arrow-1');
        const arrow1Head = document.getElementById('scene2-arrow-1-head');
        const arrow2 = document.getElementById('scene2-arrow-2');
        const arrow2Head = document.getElementById('scene2-arrow-2-head');
        const arrow3 = document.getElementById('scene2-arrow-3');
        const arrow3Head = document.getElementById('scene2-arrow-3-head');
        const gasInlet = document.getElementById('scene2-gas-inlet');
        const gasOutlet = document.getElementById('scene2-gas-outlet');
        
        // 更新步骤显示
        function updateStep() {
            // 更新步骤指示器
            stepIndicator.textContent = `步骤 ${currentStep}/${TOTAL_STEPS}`;
            
            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === TOTAL_STEPS);
            
            // 根据步骤更新显示内容
            switch(currentStep) {
                case 0:
                    reasoningText.textContent = '观察图乙四个装置，分析每个装置的功能';
                    reasoningText.classList.remove('fade-in');
                    void reasoningText.offsetWidth; // 触发重绘
                    reasoningText.classList.add('fade-in');
                    
                    // 清除所有高亮
                    removeClass(deviceA, 'red-highlight');
                    removeClass(deviceB, 'blue-highlight');
                    removeClass(deviceC, 'red-highlight');
                    removeClass(deviceD, 'blue-highlight');
                    
                    // 隐藏连接顺序区
                    hide(orderGroup);
                    break;
                    
                case 1:
                    reasoningText.textContent = '实验目的：比较 CO 和 H₂还原氧化铁时，哪个产生的 CO₂和 H₂O 更多';
                    reasoningText.classList.remove('fade-in');
                    void reasoningText.offsetWidth;
                    reasoningText.classList.add('fade-in');
                    
                    // 清除所有高亮
                    removeClass(deviceA, 'red-highlight');
                    removeClass(deviceB, 'blue-highlight');
                    removeClass(deviceC, 'red-highlight');
                    removeClass(deviceD, 'blue-highlight');
                    
                    // 隐藏连接顺序区
                    hide(orderGroup);
                    break;
                    
                case 2:
                    reasoningText.textContent = '装置功能分析：b(氢氧化钠) 吸收 CO₂ | c(浓硫酸) 吸收 H₂O | d(澄清石灰水) 检验 CO₂ | a(酒精灯) 处理尾气';
                    reasoningText.classList.remove('fade-in');
                    void reasoningText.offsetWidth;
                    reasoningText.classList.add('fade-in');
                    
                    // 高亮各装置
                    addClass(deviceB, 'blue-highlight');
                    addClass(deviceC, 'red-highlight');
                    addClass(deviceD, 'blue-highlight');
                    addClass(deviceA, 'red-highlight');
                    
                    // 隐藏连接顺序区
                    hide(orderGroup);
                    break;
                    
                case 3:
                    reasoningText.textContent = '连接顺序逻辑：气体检验应先检验水（避免后续装置带出水蒸气干扰），再检验 CO₂';
                    reasoningText.classList.remove('fade-in');
                    void reasoningText.offsetWidth;
                    reasoningText.classList.add('fade-in');
                    
                    // 保持高亮
                    addClass(deviceB, 'blue-highlight');
                    addClass(deviceC, 'red-highlight');
                    addClass(deviceD, 'blue-highlight');
                    addClass(deviceA, 'red-highlight');
                    
                    // 显示连接顺序区轮廓
                    show(orderGroup);
                    setOpacity(orderGroup, 1);
                    removeClass(orderB, 'green-highlight');
                    removeClass(orderC, 'green-highlight');
                    removeClass(orderD, 'green-highlight');
                    removeClass(orderA, 'green-highlight');
                    setOpacity(arrow1, 0);
                    setOpacity(arrow1Head, 0);
                    setOpacity(arrow2, 0);
                    setOpacity(arrow2Head, 0);
                    setOpacity(arrow3, 0);
                    setOpacity(arrow3Head, 0);
                    setOpacity(gasInlet, 0);
                    setOpacity(gasOutlet, 0);
                    break;
                    
                case 4:
                    reasoningText.textContent = '最终连接顺序：混合气体→b(吸收 CO₂)→c(吸收 H₂O)→d(检验 CO₂)→a(尾气处理)';
                    reasoningText.classList.remove('fade-in');
                    void reasoningText.offsetWidth;
                    reasoningText.classList.add('fade-in');
                    
                    // 保持高亮
                    addClass(deviceB, 'blue-highlight');
                    addClass(deviceC, 'red-highlight');
                    addClass(deviceD, 'blue-highlight');
                    addClass(deviceA, 'red-highlight');
                    
                    // 显示完整连接顺序
                    show(orderGroup);
                    setOpacity(orderGroup, 1);
                    addClass(orderB, 'green-highlight');
                    addClass(orderC, 'green-highlight');
                    addClass(orderD, 'green-highlight');
                    addClass(orderA, 'green-highlight');
                    setOpacity(arrow1, 1);
                    setOpacity(arrow1Head, 1);
                    setOpacity(arrow2, 1);
                    setOpacity(arrow2Head, 1);
                    setOpacity(arrow3, 1);
                    setOpacity(arrow3Head, 1);
                    setOpacity(gasInlet, 1);
                    setOpacity(gasOutlet, 1);
                    break;
                    
                case 5:
                    reasoningText.textContent = '答案验证：正确连接顺序为 b→c→d→a（或 c→b→d→a，取决于先吸收水还是先吸收 CO₂）';
                    reasoningText.classList.remove('fade-in');
                    void reasoningText.offsetWidth;
                    reasoningText.classList.add('fade-in');
                    
                    // 保持高亮
                    addClass(deviceB, 'blue-highlight');
                    addClass(deviceC, 'red-highlight');
                    addClass(deviceD, 'blue-highlight');
                    addClass(deviceA, 'red-highlight');
                    
                    // 完整连接顺序 + 闪烁强调
                    show(orderGroup);
                    setOpacity(orderGroup, 1);
                    addClass(orderB, 'green-highlight');
                    addClass(orderC, 'green-highlight');
                    addClass(orderD, 'green-highlight');
                    addClass(orderA, 'green-highlight');
                    addClass(orderB, 'flash');
                    addClass(orderC, 'flash');
                    addClass(orderD, 'flash');
                    addClass(orderA, 'flash');
                    setOpacity(arrow1, 1);
                    setOpacity(arrow1Head, 1);
                    setOpacity(arrow2, 1);
                    setOpacity(arrow2Head, 1);
                    setOpacity(arrow3, 1);
                    setOpacity(arrow3Head, 1);
                    setOpacity(gasInlet, 1);
                    setOpacity(gasOutlet, 1);
                    break;
            }
        }
        
        // 按钮事件绑定
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                // 清除闪烁动画
                removeClass(orderB, 'flash');
                removeClass(orderC, 'flash');
                removeClass(orderD, 'flash');
                removeClass(orderA, 'flash');
                updateStep();
            }
        });
        
        btnNext.addEventListener('click', function() {
            if (currentStep < TOTAL_STEPS) {
                currentStep++;
                updateStep();
            }
        });
        
        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
