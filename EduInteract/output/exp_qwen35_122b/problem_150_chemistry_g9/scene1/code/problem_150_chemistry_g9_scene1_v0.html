<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一氧化碳和氢气还原氧化铁 - 场景 1</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene1-btn { padding: 8px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; transition: all 0.3s ease; }
        .scene1-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-prev-btn { background: #424242; color: white; }
        #scene1-next-btn { background: #1565c0; color: white; }
        #scene1-step-indicator { display: flex; align-items: center; font-size: 14px; color: #666; }
        .scene1-hidden { opacity: 0; display: none !important; }
        .scene1-fade-in { animation: scene1FadeIn 0.3s ease-in-out; }
        @keyframes scene1FadeIn { from { opacity: 0; } to { opacity: 1; } }
        .scene1-co-border { stroke: #1565c0; stroke-width: 2px; fill: rgba(21, 101, 192, 0.1); }
        .scene1-co-border-highlight { stroke: #1565c0; stroke-width: 3px; fill: rgba(21, 101, 192, 0.1); }
        .scene1-h2-border { stroke: #c62828; stroke-width: 2px; fill: rgba(198, 40, 40, 0.1); }
        .scene1-h2-border-highlight { stroke: #c62828; stroke-width: 3px; fill: rgba(198, 40, 40, 0.1); }
        .scene1-conclusion-border { stroke: #888888; stroke-width: 1px; stroke-dasharray: 5,5; fill: rgba(136, 136, 136, 0.05); }
        .scene1-conclusion-border-highlight { stroke: #888888; stroke-width: 3px; stroke-dasharray: 5,5; fill: rgba(136, 136, 136, 0.05); }
        .scene1-co-text { fill: #000000; font-size: 16px; }
        .scene1-h2-text { fill: #000000; font-size: 16px; }
        .scene1-condition { font-size: 14px; }
        .scene1-co-condition { fill: #1565c0; }
        .scene1-h2-condition { fill: #c62828; }
        .scene1-product { fill: #2e7d32; font-size: 14px; }
        .scene1-title { fill: #000000; font-size: 18px; font-weight: bold; }
        .scene1-label { fill: #000000; font-size: 14px; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- 图甲标题 -->
            <text x="150" y="20" text-anchor="middle" class="scene1-title">图甲</text>
            
            <!-- 图甲装置区 -->
            <g id="scene1-apparatus">
                <!-- 铁架台底座 -->
                <rect x="170" y="320" width="70" height="10" fill="#666"/>
                <!-- 铁架台立柱 -->
                <rect x="200" y="150" width="10" height="170" fill="#666"/>
                <!-- 玻璃管主体 -->
                <rect x="60" y="150" width="180" height="50" fill="none" stroke="#000" stroke-width="2"/>
                <!-- 玻璃管左接口 -->
                <rect x="40" y="165" width="20" height="20" fill="none" stroke="#000" stroke-width="2"/>
                <!-- 玻璃管右接口 -->
                <rect x="240" y="165" width="20" height="20" fill="none" stroke="#000" stroke-width="2"/>
                <!-- 氧化铁粉末 -->
                <ellipse cx="150" cy="180" rx="40" ry="12" fill="#8B4513" opacity="0.5"/>
                <!-- 氧化铁标签 -->
                <text x="150" y="145" text-anchor="middle" class="scene1-label">氧化铁</text>
                <!-- 标签指向线 -->
                <line x1="150" y1="152" x2="150" y2="168" stroke="#000" stroke-width="1"/>
                <!-- 酒精灯主体 -->
                <rect x="110" y="230" width="60" height="50" fill="#f5f5f5" stroke="#666" stroke-width="2"/>
                <ellipse cx="140" cy="230" rx="30" ry="10" fill="#f5f5f5" stroke="#666" stroke-width="2"/>
                <!-- 酒精灯火焰 -->
                <path d="M 140 230 L 135 210 L 145 210 Z" fill="#FF6347"/>
                <!-- 气体流向箭头 -->
                <defs>
                    <marker id="scene1-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                        <polygon points="0 0, 10 3.5, 0 7" fill="#888888"/>
                    </marker>
                </defs>
                <line x1="35" y1="175" x2="55" y2="175" stroke="#888888" stroke-width="2" marker-end="url(#scene1-arrowhead)" stroke-dasharray="5,3"/>
            </g>
            
            <!-- CO 方程式区域背景 -->
            <rect id="scene1-co-bg" x="300" y="80" width="450" height="130" class="scene1-co-border"/>
            <!-- CO 方程式标题 -->
            <text id="scene1-co-title" x="310" y="105" class="scene1-title">一氧化碳还原</text>
            <!-- CO 化学方程式 -->
            <text id="scene1-co-equation" x="310" y="140" class="scene1-co-text">Fe₂O₃ + 3CO → 2Fe + 3CO₂</text>
            <!-- CO 反应条件 -->
            <text id="scene1-co-condition" x="580" y="160" class="scene1-condition scene1-co-condition">高温</text>
            <!-- CO 产物标注 -->
            <text id="scene1-co-product" x="310" y="185" class="scene1-product">生成铁粉和二氧化碳</text>
            
            <!-- H₂方程式区域背景 -->
            <rect id="scene1-h2-bg" x="300" y="230" width="450" height="130" class="scene1-h2-border"/>
            <!-- H₂方程式标题 -->
            <text id="scene1-h2-title" x="310" y="255" class="scene1-title">氢气还原</text>
            <!-- H₂化学方程式 -->
            <text id="scene1-h2-equation" x="310" y="295" class="scene1-h2-text">Fe₂O₃ + 3H₂ → 2Fe + 3H₂O</text>
            <!-- H₂反应条件 -->
            <text id="scene1-h2-condition" x="580" y="315" class="scene1-condition scene1-h2-condition">加热</text>
            <!-- H₂产物标注 -->
            <text id="scene1-h2-product" x="310" y="340" class="scene1-product">生成铁粉和水蒸气</text>
            
            <!-- 结论区域背景 -->
            <rect id="scene1-conclusion-bg" x="300" y="380" width="450" height="60" class="scene1-conclusion-border"/>
            <!-- 结论文本 -->
            <text id="scene1-conclusion-text" x="310" y="405" class="scene1-label">产物检验：</text>
            <text id="scene1-conclusion-co2" x="310" y="425" class="scene1-label">CO₂用澄清石灰水检验（变浑浊）</text>
            <text id="scene1-conclusion-h2o" x="520" y="425" class="scene1-label">H₂O用浓硫酸检验（吸收水分）</text>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-prev-btn" class="scene1-btn" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/5</span>
            <button id="scene1-next-btn" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // 布局坐标表（实现对照依据）
        // | 元素 | 类型 | 位置/范围 | 大小 | 备注 |
        // | 图甲标题 | text | (150,20) | ~80×16 | 装置图上方居中 |
        // | 玻璃管主体 | 矩形 | (60,150)-(240,200) | 180×50 | 硬质玻璃管 |
        // | 氧化铁粉末 | 椭圆填充 | (120,170)-(180,190) | 60×20 | 玻璃管中部 |
        // | 氧化铁标签 | text | (150,145) | ~60×16 | 指向粉末区域 |
        // | 酒精灯主体 | 矩形 | (110,230)-(170,280) | 60×50 | 加热装置 |
        // | 气体流向箭头 | 箭头 | (35,175)-(55,175) | 20×4 | 指向入口 |
        // | CO 方程式区域背景 | 矩形 | (300,80)-(750,210) | 450×130 | 蓝色边框 |
        // | H₂方程式区域背景 | 矩形 | (300,230)-(750,360) | 450×130 | 红色边框 |
        // | 结论区域背景 | 矩形 | (300,380)-(750,440) | 450×60 | 灰色边框 |
        
        // 状态配置对象
        const stepConfig = {
            0: { showCO: false, showH2: false, showConclusion: false, highlightCO: false, highlightH2: false, highlightConclusion: false },
            1: { showCO: true, showH2: false, showConclusion: false, highlightCO: true, highlightH2: false, highlightConclusion: false },
            2: { showCO: true, showH2: true, showConclusion: false, highlightCO: false, highlightH2: true, highlightConclusion: false },
            3: { showCO: true, showH2: true, showConclusion: true, highlightCO: false, highlightH2: false, highlightConclusion: false },
            4: { showCO: true, showH2: true, showConclusion: true, highlightCO: false, highlightH2: false, highlightConclusion: true }
        };
        
        let currentStep = 0;
        const totalSteps = 5;
        
        // 工具函数：显示元素
        function show(el) {
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '0';
                setTimeout(() => {
                    el.classList.add('scene1-fade-in');
                    el.style.opacity = '1';
                }, 10);
            }
        }
        
        // 工具函数：隐藏元素
        function hide(el) {
            if (el) {
                el.classList.remove('scene1-fade-in');
                el.style.opacity = '0';
                setTimeout(() => {
                    el.style.display = 'none';
                }, 300);
            }
        }
        
        // 渲染当前步骤
        function renderStep() {
            const config = stepConfig[currentStep];
            
            // CO 方程式区域
            const coElements = ['scene1-co-bg', 'scene1-co-title', 'scene1-co-equation', 'scene1-co-condition', 'scene1-co-product'];
            coElements.forEach(id => {
                const el = document.getElementById(id);
                if (config.showCO) {
                    show(el);
                } else {
                    hide(el);
                }
            });
            
            // CO 边框高亮
            const coBg = document.getElementById('scene1-co-bg');
            if (config.showCO) {
                coBg.classList.remove('scene1-co-border', 'scene1-co-border-highlight');
                coBg.classList.add(config.highlightCO ? 'scene1-co-border-highlight' : 'scene1-co-border');
            }
            
            // H₂方程式区域
            const h2Elements = ['scene1-h2-bg', 'scene1-h2-title', 'scene1-h2-equation', 'scene1-h2-condition', 'scene1-h2-product'];
            h2Elements.forEach(id => {
                const el = document.getElementById(id);
                if (config.showH2) {
                    show(el);
                } else {
                    hide(el);
                }
            });
            
            // H₂边框高亮
            const h2Bg = document.getElementById('scene1-h2-bg');
            if (config.showH2) {
                h2Bg.classList.remove('scene1-h2-border', 'scene1-h2-border-highlight');
                h2Bg.classList.add(config.highlightH2 ? 'scene1-h2-border-highlight' : 'scene1-h2-border');
            }
            
            // 结论区域
            const conclusionElements = ['scene1-conclusion-bg', 'scene1-conclusion-text', 'scene1-conclusion-co2', 'scene1-conclusion-h2o'];
            conclusionElements.forEach(id => {
                const el = document.getElementById(id);
                if (config.showConclusion) {
                    show(el);
                } else {
                    hide(el);
                }
            });
            
            // 结论边框高亮
            const conclusionBg = document.getElementById('scene1-conclusion-bg');
            if (config.showConclusion) {
                conclusionBg.classList.remove('scene1-conclusion-border', 'scene1-conclusion-border-highlight');
                conclusionBg.classList.add(config.highlightConclusion ? 'scene1-conclusion-border-highlight' : 'scene1-conclusion-border');
            }
            
            // 更新按钮状态
            const prevBtn = document.getElementById('scene1-prev-btn');
            const nextBtn = document.getElementById('scene1-next-btn');
            const indicator = document.getElementById('scene1-step-indicator');
            
            prevBtn.disabled = currentStep === 0;
            
            if (currentStep === totalSteps - 1) {
                nextBtn.textContent = '完成 ✓';
                nextBtn.disabled = true;
            } else {
                nextBtn.textContent = '下一步 ▶';
                nextBtn.disabled = false;
            }
            
            indicator.textContent = `步骤 ${currentStep + 1}/${totalSteps}`;
        }
        
        // 事件绑定
        document.getElementById('scene1-prev-btn').addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        });
        
        document.getElementById('scene1-next-btn').addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                renderStep();
            }
        });
        
        // 初始化
        renderStep();
    })();
    </script>
</body>
</html>
