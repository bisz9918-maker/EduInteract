<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>甲烷燃烧反应微观过程</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene1-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 2px solid #1565c0; border-radius: 6px; background: #ffffff; color: #1565c0; transition: all 0.2s; }
        .scene1-btn:hover:not(:disabled) { background: #1565c0; color: #ffffff; }
        .scene1-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene1-highlight { stroke: #c62828; stroke-width: 3px; }
        .scene1-bond { stroke: #000000; stroke-width: 2px; }
        .scene1-bond-dashed { stroke: #000000; stroke-width: 2px; stroke-dasharray: 5,5; }
        .scene1-text { font-size: 16px; fill: #000000; }
        .scene1-text-bold { font-size: 18px; font-weight: bold; fill: #000000; }
        .scene1-text-small { font-size: 14px; fill: #000000; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <!-- 反应前区域背景 -->
            <rect id="scene1-bg-reaction-before" x="50" y="50" width="270" height="330" fill="#e3f2fd" opacity="0.2" rx="8"/>
            
            <!-- 反应后区域背景 -->
            <rect id="scene1-bg-reaction-after" x="480" y="50" width="220" height="330" fill="#e3f2fd" opacity="0.2" rx="8" style="display:none;"/>
            
            <!-- 图例框 -->
            <g id="scene1-legend">
                <rect x="700" y="40" width="100" height="110" fill="#ffffff" stroke="#000000" stroke-width="2" rx="5"/>
                <!-- 氢原子 -->
                <circle cx="715" cy="65" r="8" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                <text x="730" y="70" class="scene1-text-small">氢原子</text>
                <!-- 氧原子 -->
                <circle cx="715" cy="95" r="8" fill="#000000"/>
                <text x="730" y="100" class="scene1-text-small">氧原子</text>
                <!-- 碳原子 -->
                <circle cx="715" cy="125" r="8" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                <defs>
                    <pattern id="scene1-hatch" patternUnits="userSpaceOnUse" width="10" height="10">
                        <line x1="0" y1="0" x2="10" y2="10" stroke="#000000" stroke-width="1"/>
                        <line x1="10" y1="0" x2="0" y2="10" stroke="#000000" stroke-width="1"/>
                    </pattern>
                </defs>
                <circle cx="715" cy="125" r="8" fill="url(#scene1-hatch)" stroke="#000000" stroke-width="1"/>
                <text x="730" y="130" class="scene1-text-small">碳原子</text>
            </g>
            
            <!-- A 分子 (CH₄) -->
            <g id="scene1-mol-a">
                <!-- 碳原子 -->
                <circle cx="130" cy="200" r="20" fill="url(#scene1-hatch)" stroke="#000000" stroke-width="2"/>
                <!-- 氢原子 -->
                <circle cx="130" cy="150" r="12" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                <circle cx="170" cy="200" r="12" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                <circle cx="130" cy="250" r="12" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                <circle cx="90" cy="200" r="12" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                <!-- 分子键 -->
                <line id="scene1-bond-a1" x1="130" y1="180" x2="130" y2="162" class="scene1-bond"/>
                <line id="scene1-bond-a2" x1="150" y1="200" x2="158" y2="200" class="scene1-bond"/>
                <line id="scene1-bond-a3" x1="130" y1="220" x2="130" y2="238" class="scene1-bond"/>
                <line id="scene1-bond-a4" x1="110" y1="200" x2="102" y2="200" class="scene1-bond"/>
                <!-- A 分子标签 -->
                <text x="130" y="300" text-anchor="middle" class="scene1-text-bold">A</text>
            </g>
            
            <!-- B 分子 (2O₂) -->
            <g id="scene1-mol-b">
                <!-- 氧分子 1 -->
                <circle cx="200" cy="160" r="14" fill="#000000"/>
                <circle cx="240" cy="160" r="14" fill="#000000"/>
                <line id="scene1-bond-b1" x1="214" y1="160" x2="226" y2="160" class="scene1-bond"/>
                <!-- 氧分子 2 -->
                <circle cx="200" cy="240" r="14" fill="#000000"/>
                <circle cx="240" cy="240" r="14" fill="#000000"/>
                <line id="scene1-bond-b2" x1="214" y1="240" x2="226" y2="240" class="scene1-bond"/>
                <!-- B 分子标签 -->
                <text x="220" y="300" text-anchor="middle" class="scene1-text-bold">B</text>
            </g>
            
            <!-- 反应前标签 -->
            <text id="scene1-label-before" x="185" y="400" text-anchor="middle" class="scene1-text">反应前</text>
            
            <!-- 反应箭头 -->
            <g id="scene1-arrow" style="display:none;">
                <line x1="330" y1="200" x2="470" y2="200" stroke="#1565c0" stroke-width="4"/>
                <polygon points="470,200 455,192 455,208" fill="#1565c0"/>
            </g>
            
            <!-- 点燃标签 -->
            <text id="scene1-label-ignite" x="400" y="170" text-anchor="middle" class="scene1-text" style="display:none;">点燃</text>
            
            <!-- C 分子 (CO₂) -->
            <g id="scene1-mol-c" style="display:none;">
                <!-- 氧原子 1 -->
                <circle cx="510" cy="200" r="14" fill="#000000"/>
                <!-- 碳原子 -->
                <circle cx="550" cy="200" r="20" fill="url(#scene1-hatch)" stroke="#000000" stroke-width="2"/>
                <!-- 氧原子 2 -->
                <circle cx="590" cy="200" r="14" fill="#000000"/>
                <!-- 分子键 -->
                <line id="scene1-bond-c1" x1="524" y1="200" x2="530" y2="200" class="scene1-bond"/>
                <line id="scene1-bond-c2" x1="570" y1="200" x2="576" y2="200" class="scene1-bond"/>
                <!-- C 分子标签 -->
                <text x="550" y="250" text-anchor="middle" class="scene1-text-bold">C</text>
            </g>
            
            <!-- D 分子 (2H₂O) -->
            <g id="scene1-mol-d" style="display:none;">
                <!-- 水分子 1 -->
                <circle cx="580" cy="140" r="14" fill="#000000"/>
                <circle cx="565" cy="115" r="12" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                <circle cx="595" cy="115" r="12" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                <line id="scene1-bond-d1" x1="575" y1="128" x2="572" y2="122" class="scene1-bond"/>
                <line id="scene1-bond-d2" x1="585" y1="128" x2="588" y2="122" class="scene1-bond"/>
                <!-- 水分子 2 -->
                <circle cx="660" cy="260" r="14" fill="#000000"/>
                <circle cx="645" cy="285" r="12" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                <circle cx="675" cy="285" r="12" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                <line id="scene1-bond-d3" x1="655" y1="272" x2="652" y2="278" class="scene1-bond"/>
                <line id="scene1-bond-d4" x1="665" y1="272" x2="668" y2="278" class="scene1-bond"/>
                <!-- D 分子标签 -->
                <text x="620" y="310" text-anchor="middle" class="scene1-text-bold">D</text>
            </g>
            
            <!-- 反应后标签 -->
            <text id="scene1-label-after" x="590" y="400" text-anchor="middle" class="scene1-text" style="display:none;">反应后</text>
            
            <!-- 原子计数器背景 -->
            <rect id="scene1-counter-bg" x="50" y="430" width="700" height="50" fill="#e8f5e9" opacity="0.3" rx="8" style="display:none;"/>
            
            <!-- 反应前原子统计 -->
            <text id="scene1-stat-before" x="185" y="460" text-anchor="middle" class="scene1-text" style="display:none;">C=1  H=4  O=4</text>
            
            <!-- 反应后原子统计 -->
            <text id="scene1-stat-after" x="615" y="460" text-anchor="middle" class="scene1-text" style="display:none;">C=1  H=4  O=4</text>
            
            <!-- 质量守恒提示 -->
            <text id="scene1-conclusion" x="400" y="390" text-anchor="middle" class="scene1-text-bold" style="display:none; fill:#2e7d32;">质量守恒定律：反应前后原子种类和数目不变</text>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn">◀ 上一步</button>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // 布局坐标表（实现对照依据）
        // | 元素 | 类型 | 位置/范围 | 大小 | 备注 |
        // |------|------|-----------|------|------|
        // | 反应前区域背景 | 矩形 | (50,50)-(320,380) | 270×330 | 浅蓝色填充 20% 透明度 |
        // | 反应后区域背景 | 矩形 | (480,50)-(700,380) | 220×330 | 浅蓝色填充 20% 透明度 |
        // | A 分子 (CH₄) 中心 | 圆组 | (130,200) | 碳原子半径 20 | 左侧区域中心偏上 |
        // | B 分子 (O₂) 组 | 圆组 | (220,200) | - | 两个氧分子 |
        // | C 分子 (CO₂) | 圆组 | (550,200) | - | 线性结构 |
        // | D 分子 (H₂O) 组 | 圆组 | (620,200) | - | 两个水分子 |
        
        const TOTAL_STEPS = 5;
        let currentStep = 0;
        
        // 获取 DOM 元素
        const els = {
            bgReactionBefore: document.getElementById('scene1-bg-reaction-before'),
            bgReactionAfter: document.getElementById('scene1-bg-reaction-after'),
            legend: document.getElementById('scene1-legend'),
            molA: document.getElementById('scene1-mol-a'),
            molB: document.getElementById('scene1-mol-b'),
            labelBefore: document.getElementById('scene1-label-before'),
            arrow: document.getElementById('scene1-arrow'),
            labelIgnite: document.getElementById('scene1-label-ignite'),
            molC: document.getElementById('scene1-mol-c'),
            molD: document.getElementById('scene1-mol-d'),
            labelAfter: document.getElementById('scene1-label-after'),
            counterBg: document.getElementById('scene1-counter-bg'),
            statBefore: document.getElementById('scene1-stat-before'),
            statAfter: document.getElementById('scene1-stat-after'),
            conclusion: document.getElementById('scene1-conclusion'),
            btnPrev: document.getElementById('scene1-btn-prev'),
            btnNext: document.getElementById('scene1-btn-next'),
            bonds: [
                document.getElementById('scene1-bond-a1'),
                document.getElementById('scene1-bond-a2'),
                document.getElementById('scene1-bond-a3'),
                document.getElementById('scene1-bond-a4'),
                document.getElementById('scene1-bond-b1'),
                document.getElementById('scene1-bond-b2'),
                document.getElementById('scene1-bond-c1'),
                document.getElementById('scene1-bond-c2'),
                document.getElementById('scene1-bond-d1'),
                document.getElementById('scene1-bond-d2'),
                document.getElementById('scene1-bond-d3'),
                document.getElementById('scene1-bond-d4')
            ]
        };
        
        // 工具函数：显示元素
        function show(el) {
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }
        
        // 工具函数：隐藏元素
        function hide(el) {
            if (el) {
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }
        
        // 工具函数：添加高亮边框
        function highlight(g) {
            if (g) {
                const circles = g.querySelectorAll('circle');
                circles.forEach(c => c.classList.add('scene1-highlight'));
            }
        }
        
        // 工具函数：移除高亮边框
        function unhighlight(g) {
            if (g) {
                const circles = g.querySelectorAll('circle');
                circles.forEach(c => c.classList.remove('scene1-highlight'));
            }
        }
        
        // 工具函数：设置键为虚线
        function setBondsDashed(dashed) {
            els.bonds.forEach(bond => {
                if (bond) {
                    if (dashed) {
                        bond.classList.remove('scene1-bond');
                        bond.classList.add('scene1-bond-dashed');
                    } else {
                        bond.classList.remove('scene1-bond-dashed');
                        bond.classList.add('scene1-bond');
                    }
                }
            });
        }
        
        // 更新场景显示
        function updateScene() {
            // 重置所有元素
            hide(els.bgReactionAfter);
            hide(els.arrow);
            hide(els.labelIgnite);
            hide(els.molC);
            hide(els.molD);
            hide(els.labelAfter);
            hide(els.counterBg);
            hide(els.statBefore);
            hide(els.statAfter);
            hide(els.conclusion);
            
            // 移除所有高亮
            unhighlight(els.molA);
            unhighlight(els.molB);
            unhighlight(els.molC);
            unhighlight(els.molD);
            
            // 恢复实线键
            setBondsDashed(false);
            
            // 根据步骤显示对应元素
            switch(currentStep) {
                case 0: // 初始状态：反应物
                    show(els.bgReactionBefore);
                    show(els.legend);
                    show(els.molA);
                    show(els.molB);
                    show(els.labelBefore);
                    break;
                    
                case 1: // 反应条件触发
                    show(els.bgReactionBefore);
                    show(els.legend);
                    show(els.molA);
                    show(els.molB);
                    show(els.labelBefore);
                    show(els.arrow);
                    show(els.labelIgnite);
                    highlight(els.molA);
                    highlight(els.molB);
                    setBondsDashed(true);
                    break;
                    
                case 2: // 原子重组形成产物
                    show(els.bgReactionBefore);
                    show(els.bgReactionAfter);
                    show(els.legend);
                    show(els.molA);
                    show(els.molB);
                    show(els.labelBefore);
                    show(els.arrow);
                    show(els.labelIgnite);
                    show(els.molC);
                    show(els.molD);
                    show(els.labelAfter);
                    highlight(els.molC);
                    highlight(els.molD);
                    break;
                    
                case 3: // 原子统计
                    show(els.bgReactionBefore);
                    show(els.bgReactionAfter);
                    show(els.legend);
                    show(els.molA);
                    show(els.molB);
                    show(els.labelBefore);
                    show(els.arrow);
                    show(els.labelIgnite);
                    show(els.molC);
                    show(els.molD);
                    show(els.labelAfter);
                    show(els.counterBg);
                    show(els.statBefore);
                    show(els.statAfter);
                    break;
                    
                case 4: // 最终结论
                    show(els.bgReactionBefore);
                    show(els.bgReactionAfter);
                    show(els.legend);
                    show(els.molA);
                    show(els.molB);
                    show(els.labelBefore);
                    show(els.arrow);
                    show(els.labelIgnite);
                    show(els.molC);
                    show(els.molD);
                    show(els.labelAfter);
                    show(els.counterBg);
                    show(els.statBefore);
                    show(els.statAfter);
                    show(els.conclusion);
                    break;
            }
            
            // 更新按钮状态
            els.btnPrev.disabled = (currentStep === 0);
            els.btnNext.disabled = (currentStep === TOTAL_STEPS - 1);
        }
        
        // 事件绑定
        els.btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });
        
        els.btnNext.addEventListener('click', function() {
            if (currentStep < TOTAL_STEPS - 1) {
                currentStep++;
                updateScene();
            }
        });
        
        // 初始化
        updateScene();
    })();
    </script>
</body>
</html>
