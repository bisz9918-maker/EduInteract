<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测定空气中氧气含量实验装置</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene1-controls button { padding: 8px 20px; font-size: 14px; cursor: pointer; border: 2px solid #333; border-radius: 4px; background: #f5f5f5; }
        #scene1-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene1-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-step-indicator { position: absolute; bottom: 55px; left: 50%; transform: translateX(-50%); font-size: 14px; color: #333; }
        
        /* 高亮动画 */
        @keyframes highlightPulse {
            0%, 100% { stroke: #FFD700; stroke-width: 3; }
            50% { stroke: #FFA500; stroke-width: 4; }
        }
        @keyframes redPulse {
            0%, 100% { fill: #c62828; }
            50% { fill: #ff5252; }
        }
        .highlight { animation: highlightPulse 1.5s ease-in-out infinite; }
        .red-highlight { animation: redPulse 1s ease-in-out infinite; }
        
        /* 标签样式 */
        .label-text { font-size: 14px; fill: #000000; }
        .label-line { stroke: #000000; stroke-width: 1; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- 集气瓶主体 -->
            <g id="scene1-jar-group">
                <!-- 瓶身 -->
                <rect id="scene1-jar" x="100" y="100" width="250" height="300" fill="none" stroke="#000000" stroke-width="2" opacity="0.8"/>
                <!-- 瓶口 -->
                <rect x="150" y="80" width="150" height="20" fill="none" stroke="#000000" stroke-width="2"/>
                <!-- 橡皮塞 -->
                <rect x="150" y="70" width="150" height="15" fill="#424242" stroke="#000000" stroke-width="1"/>
            </g>
            
            <!-- 燃烧匙 -->
            <g id="scene1-spoon-group">
                <!-- 燃烧匙杆 -->
                <line id="scene1-spoon-rod" x1="225" y1="85" x2="225" y2="180" stroke="#000000" stroke-width="2"/>
                <!-- 燃烧匙勺 -->
                <ellipse id="scene1-spoon-bowl" cx="225" cy="180" rx="30" ry="10" fill="none" stroke="#000000" stroke-width="2"/>
            </g>
            
            <!-- 红磷 -->
            <g id="scene1-redphosphorus-group">
                <ellipse id="scene1-redphosphorus" cx="225" cy="187" rx="20" ry="8" fill="#c62828" opacity="0.9"/>
            </g>
            
            <!-- 集气瓶底部水 -->
            <g id="scene1-jar-water-group">
                <rect x="100" y="380" width="250" height="20" fill="#1565c0" opacity="0.3"/>
            </g>
            
            <!-- 刻度线 -->
            <g id="scene1-scales-group">
                <line id="scene1-scale1" x1="340" y1="350" x2="350" y2="350" stroke="#000000" stroke-width="1"/>
                <line id="scene1-scale2" x1="340" y1="300" x2="350" y2="300" stroke="#000000" stroke-width="1"/>
                <line id="scene1-scale3" x1="340" y1="250" x2="350" y2="250" stroke="#000000" stroke-width="1"/>
                <line id="scene1-scale4" x1="340" y1="200" x2="350" y2="200" stroke="#000000" stroke-width="1"/>
            </g>
            
            <!-- 导管 -->
            <g id="scene1-tube-group">
                <line id="scene1-tube" x1="300" y1="85" x2="650" y2="280" stroke="#888888" stroke-width="3" fill="none"/>
                <!-- 导管分段绘制 -->
                <line x1="300" y1="85" x2="550" y2="85" stroke="#888888" stroke-width="3"/>
                <line x1="550" y1="85" x2="550" y2="280" stroke="#888888" stroke-width="3"/>
                <line x1="550" y1="280" x2="650" y2="280" stroke="#888888" stroke-width="3"/>
            </g>
            
            <!-- 止水夹 -->
            <g id="scene1-clip-group">
                <rect id="scene1-clip" x="480" y="75" width="40" height="20" fill="#000000" opacity="0.7"/>
            </g>
            
            <!-- 烧杯 -->
            <g id="scene1-beaker-group">
                <!-- 烧杯主体（梯形） -->
                <polygon id="scene1-beaker" points="600,200 750,200 770,400 580,400" fill="none" stroke="#000000" stroke-width="2"/>
                <!-- 烧杯内水 -->
                <g id="scene1-beaker-water-group">
                    <rect x="585" y="280" width="180" height="120" fill="#1565c0" opacity="0.3"/>
                    <!-- 水面波浪线 -->
                    <path d="M 585 280 Q 600 275 615 280 Q 630 285 645 280 Q 660 275 675 280 Q 690 285 705 280 Q 720 275 735 280 Q 750 285 765 280" stroke="#1565c0" stroke-width="1" fill="none" opacity="0.6"/>
                </g>
            </g>
            
            <!-- 标签组（初始隐藏） -->
            <g id="scene1-labels-group" style="display: none;">
                <!-- 集气瓶标签 -->
                <g id="scene1-label-jar-group" style="display: none;">
                    <line class="label-line" x1="80" y1="250" x2="100" y2="250"/>
                    <text class="label-text" x="30" y="255">集气瓶</text>
                </g>
                
                <!-- 刻度标签 -->
                <g id="scene1-label-scale1-group" style="display: none;">
                    <text class="label-text" x="360" y="355">1</text>
                </g>
                <g id="scene1-label-scale2-group" style="display: none;">
                    <text class="label-text" x="360" y="305">2</text>
                </g>
                <g id="scene1-label-scale3-group" style="display: none;">
                    <text class="label-text" x="360" y="255">3</text>
                </g>
                <g id="scene1-label-scale4-group" style="display: none;">
                    <text class="label-text" x="360" y="205">4</text>
                </g>
                
                <!-- 燃烧匙标签 -->
                <g id="scene1-label-spoon-group" style="display: none;">
                    <line class="label-line" x1="225" y1="60" x2="225" y2="85"/>
                    <text class="label-text" x="195" y="55">燃烧匙</text>
                </g>
                
                <!-- 红磷标签 -->
                <g id="scene1-label-redphosphorus-group" style="display: none;">
                    <line class="label-line" x1="245" y1="187" x2="260" y2="187"/>
                    <text class="label-text" x="260" y="192">红磷</text>
                </g>
                
                <!-- 导管标签 -->
                <g id="scene1-label-tube-group" style="display: none;">
                    <text class="label-text" x="425" y="75">导管</text>
                </g>
                
                <!-- 止水夹标签 -->
                <g id="scene1-label-clip-group" style="display: none;">
                    <line class="label-line" x1="500" y1="50" x2="500" y2="75"/>
                    <text class="label-text" x="470" y="45">止水夹</text>
                </g>
                
                <!-- 烧杯标签 -->
                <g id="scene1-label-beaker-group" style="display: none;">
                    <line class="label-line" x1="770" y1="300" x2="780" y2="300"/>
                    <text class="label-text" x="780" y="305">烧杯</text>
                </g>
                
                <!-- 水标签 -->
                <g id="scene1-label-water-group" style="display: none;">
                    <line class="label-line" x1="765" y1="340" x2="780" y2="340"/>
                    <text class="label-text" x="780" y="345">水</text>
                </g>
            </g>
        </svg>
        
        <div id="scene1-step-indicator">步骤 0/5</div>
        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1: 测定空气中氧气含量实验装置
        // 布局坐标表（参考）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // |------|------|-----------|------|-------------|------|
        // | 集气瓶主体 | 矩形+圆角 | (100,100)-(350,400) | 250×300 | - | 透明玻璃容器 |
        // | 集气瓶瓶口 | 矩形 | (150,80)-(300,100) | 150×20 | - | 收窄部分 |
        // | 橡皮塞 | 矩形 | (150,70)-(300,85) | 150×15 | - | 深灰色填充 |
        // | 燃烧匙杆 | 线段 | (225,85)-(225,180) | 4×95 | - | 垂直悬挂 |
        // | 燃烧匙勺 | 椭圆 | (225,180) | 60×20 | - | 盛放红磷 |
        // | 红磷 | 不规则形状 | (205,185)-(245,200) | 40×15 | 右侧 | 红色填充 |
        // | 集气瓶底部水 | 矩形 | (100,380)-(350,400) | 250×20 | - | 蓝色填充30% |
        // | 刻度线1-4 | 线段 | 各10×1 | - | 瓶内壁右侧 | - |
        // | 导管 | 线段 | (300,85)-(650,280) | - | - | 灰色 |
        // | 止水夹 | 矩形 | (480,75)-(520,95) | 40×20 | 上方 | - |
        // | 烧杯主体 | 梯形 | (600,200)-(770,400) | 170×200 | - | 开口容器 |
        // | 烧杯内水 | 矩形 | (585,280)-(765,400) | 180×120 | - | 蓝色填充30% |
        
        const TOTAL_STEPS = 5;
        let currentStep = 0;
        
        // DOM 元素引用
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        
        // 步骤配置：每个步骤显示哪些元素
        const stepConfig = [
            // 步骤 0: 初始状态 - 无标签
            {
                labels: [],
                highlights: [],
                description: '实验装置'
            },
            // 步骤 1: 集气瓶及刻度
            {
                labels: ['jar', 'scale1', 'scale2', 'scale3', 'scale4'],
                highlights: ['jar-group', 'scales-group'],
                description: '集气瓶与刻度'
            },
            // 步骤 2: 燃烧匙与红磷
            {
                labels: ['spoon', 'redphosphorus'],
                highlights: ['spoon-group', 'redphosphorus-group'],
                redHighlights: ['redphosphorus'],
                description: '燃烧匙与红磷'
            },
            // 步骤 3: 导管与止水夹
            {
                labels: ['tube', 'clip'],
                highlights: ['tube-group', 'clip-group'],
                description: '导管与止水夹'
            },
            // 步骤 4: 烧杯
            {
                labels: ['beaker', 'water'],
                highlights: ['beaker-group', 'beaker-water-group'],
                description: '烧杯与水'
            },
            // 步骤 5: 全部标注
            {
                labels: ['jar', 'scale1', 'scale2', 'scale3', 'scale4', 'spoon', 'redphosphorus', 'tube', 'clip', 'beaker', 'water'],
                highlights: ['jar-group', 'scales-group', 'spoon-group', 'redphosphorus-group', 'tube-group', 'clip-group', 'beaker-group'],
                redHighlights: ['redphosphorus'],
                description: '完整标注'
            }
        ];
        
        // 显示/隐藏工具函数
        function show(el) {
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }
        
        function hide(el) {
            if (el) {
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }
        
        // 添加高亮效果
        function addHighlight(elementId) {
            const el = document.getElementById('scene1-' + elementId);
            if (el) {
                el.classList.add('highlight');
            }
        }
        
        // 移除高亮效果
        function removeHighlight(elementId) {
            const el = document.getElementById('scene1-' + elementId);
            if (el) {
                el.classList.remove('highlight');
            }
        }
        
        // 添加红色闪烁效果
        function addRedHighlight(elementId) {
            const el = document.getElementById('scene1-' + elementId);
            if (el) {
                el.classList.add('red-highlight');
            }
        }
        
        // 移除红色闪烁效果
        function removeRedHighlight(elementId) {
            const el = document.getElementById('scene1-' + elementId);
            if (el) {
                el.classList.remove('red-highlight');
            }
        }
        
        // 更新步骤显示
        function updateStep() {
            const config = stepConfig[currentStep];
            
            // 更新步骤指示器
            stepIndicator.textContent = `步骤 ${currentStep}/${TOTAL_STEPS} - ${config.description}`;
            
            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === TOTAL_STEPS);
            
            // 清除所有高亮
            const allGroups = ['jar-group', 'scales-group', 'spoon-group', 'redphosphorus-group', 
                              'tube-group', 'clip-group', 'beaker-group', 'beaker-water-group'];
            allGroups.forEach(g => removeHighlight(g));
            
            const allRedElements = ['redphosphorus'];
            allRedElements.forEach(e => removeRedHighlight(e));
            
            // 隐藏所有标签
            const allLabels = ['jar', 'scale1', 'scale2', 'scale3', 'scale4', 'spoon', 
                              'redphosphorus', 'tube', 'clip', 'beaker', 'water'];
            allLabels.forEach(l => hide(document.getElementById('scene1-label-' + l + '-group')));
            
            // 显示当前步骤的标签
            config.labels.forEach(label => {
                show(document.getElementById('scene1-label-' + label + '-group'));
            });
            
            // 添加高亮效果
            config.highlights.forEach(highlight => {
                addHighlight(highlight);
            });
            
            // 添加红色闪烁效果
            if (config.redHighlights) {
                config.redHighlights.forEach(redHighlight => {
                    addRedHighlight(redHighlight);
                });
            }
        }
        
        // 事件绑定
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });
        
        btnNext.addEventListener('click', function() {
            if (currentStep < TOTAL_STEPS) {
                currentStep++;
                updateStep();
            }
        });
        
        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
