<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>气体除杂流程 - Scene 2</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene2-btn { padding: 8px 20px; font-size: 14px; border: 2px solid #1565c0; border-radius: 6px; cursor: pointer; background: #ffffff; color: #1565c0; transition: all 0.3s ease; }
        .scene2-btn:hover:not(:disabled) { background: #1565c0; color: #ffffff; }
        .scene2-btn:disabled { border-color: #ccc; color: #ccc; cursor: not-allowed; }
        .scene2-active-device { stroke: #1565c0 !important; stroke-width: 3 !important; }
        .scene2-removed { text-decoration: line-through; color: #c62828; }
        .scene2-final { stroke: #2e7d32 !important; stroke-width: 3 !important; fill: #e8f5e9 !important; }
        .scene2-hidden { display: none; }
        svg text, svg rect, svg circle { transition: all 0.3s ease; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" id="scene2-svg">
            <!-- 标题 (居中，y=20 避免裁切) -->
            <text x="400" y="20" font-size="18" font-weight="bold" text-anchor="middle" fill="#000000">气体除杂流程</text>
            
            <!-- 装置 A: 碳酸氢钠溶液 (矩形和标签分开，标签在矩形下方) -->
            <g id="scene2-device-a">
                <rect x="60" y="40" width="100" height="35" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" rx="5"/>
            </g>
            <text x="110" y="85" font-size="10" text-anchor="middle" fill="#000000">碳酸氢钠</text>
            <text x="110" y="98" font-size="10" text-anchor="middle" fill="#000000">溶液</text>
            <text x="110" y="120" font-size="14" font-weight="bold" text-anchor="middle" fill="#000000">A</text>
            
            <!-- 装置 B: 氧化铜加热 -->
            <g id="scene2-device-b">
                <rect x="210" y="40" width="100" height="35" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" rx="5"/>
            </g>
            <text x="260" y="85" font-size="10" text-anchor="middle" fill="#000000">氧化铜</text>
            <text x="260" y="98" font-size="10" text-anchor="middle" fill="#000000">加热</text>
            <text x="260" y="111" font-size="9" text-anchor="middle" fill="#ff6f00">△</text>
            <text x="260" y="120" font-size="14" font-weight="bold" text-anchor="middle" fill="#000000">B</text>
            
            <!-- 装置 C: 澄清石灰水 -->
            <g id="scene2-device-c">
                <rect x="360" y="40" width="100" height="35" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" rx="5"/>
            </g>
            <text x="410" y="85" font-size="10" text-anchor="middle" fill="#000000">澄清石灰</text>
            <text x="410" y="98" font-size="10" text-anchor="middle" fill="#000000">水</text>
            <text x="410" y="120" font-size="14" font-weight="bold" text-anchor="middle" fill="#000000">C</text>
            
            <!-- 装置 D: 浓硫酸 -->
            <g id="scene2-device-d">
                <rect x="510" y="40" width="100" height="35" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" rx="5"/>
            </g>
            <text x="560" y="85" font-size="10" text-anchor="middle" fill="#000000">浓硫酸</text>
            <text x="560" y="120" font-size="14" font-weight="bold" text-anchor="middle" fill="#000000">D</text>
            
            <!-- 图例区 (左移，增加间距) -->
            <text x="15" y="165" font-size="12" font-weight="bold" fill="#000000">气体图例：</text>
            
            <!-- H₂分子图例 -->
            <g id="scene2-legend-h2">
                <circle cx="20" cy="182" r="5" fill="#1565c0" fill-opacity="0.3" stroke="#1565c0" stroke-width="1"/>
                <circle cx="28" cy="182" r="5" fill="#1565c0" fill-opacity="0.3" stroke="#1565c0" stroke-width="1"/>
                <text x="37" y="186" font-size="12" fill="#000000">H₂</text>
            </g>
            
            <!-- N₂分子图例 -->
            <g id="scene2-legend-n2">
                <circle cx="20" cy="208" r="5" fill="#78909c" fill-opacity="0.3" stroke="#78909c" stroke-width="1"/>
                <circle cx="28" cy="208" r="5" fill="#78909c" fill-opacity="0.3" stroke="#78909c" stroke-width="1"/>
                <text x="37" y="212" font-size="12" fill="#000000">N₂</text>
            </g>
            
            <!-- HCl 分子图例 -->
            <g id="scene2-legend-hcl">
                <circle cx="23" cy="234" r="6" fill="#c62828" fill-opacity="0.3" stroke="#c62828" stroke-width="1"/>
                <circle cx="33" cy="234" r="4" fill="#1565c0" fill-opacity="0.3" stroke="#1565c0" stroke-width="1"/>
                <text x="42" y="238" font-size="12" fill="#000000">HCl</text>
            </g>
            
            <!-- H₂O 分子图例 -->
            <g id="scene2-legend-h2o">
                <circle cx="20" cy="260" r="4" fill="#1565c0" fill-opacity="0.3" stroke="#1565c0" stroke-width="1"/>
                <circle cx="27" cy="255" r="5" fill="#c62828" fill-opacity="0.3" stroke="#c62828" stroke-width="1"/>
                <circle cx="34" cy="260" r="4" fill="#1565c0" fill-opacity="0.3" stroke="#1565c0" stroke-width="1"/>
                <text x="43" y="264" font-size="12" fill="#000000">H₂O</text>
            </g>
            
            <!-- CO 分子图例 -->
            <g id="scene2-legend-co">
                <circle cx="20" cy="286" r="5" fill="#212121" fill-opacity="0.3" stroke="#212121" stroke-width="1"/>
                <circle cx="28" cy="286" r="5" fill="#c62828" fill-opacity="0.3" stroke="#c62828" stroke-width="1"/>
                <text x="43" y="290" font-size="12" fill="#000000">CO</text>
            </g>
            
            <!-- CO₂分子图例 -->
            <g id="scene2-legend-co2">
                <circle cx="17" cy="312" r="5" fill="#c62828" fill-opacity="0.3" stroke="#c62828" stroke-width="1"/>
                <circle cx="25" cy="312" r="5" fill="#212121" fill-opacity="0.3" stroke="#212121" stroke-width="1"/>
                <circle cx="33" cy="312" r="5" fill="#c62828" fill-opacity="0.3" stroke="#c62828" stroke-width="1"/>
                <text x="42" y="316" font-size="12" fill="#000000">CO₂</text>
            </g>
            
            <!-- 气体流向虚线 -->
            <line x1="180" y1="200" x2="640" y2="200" stroke="#888880" stroke-width="2" stroke-dasharray="5,5" id="scene2-flow-line"/>
            
            <!-- 初始气体框 (加高，文字在框内) -->
            <g id="scene2-gas-initial">
                <rect x="100" y="175" width="100" height="50" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="5"/>
                <text x="150" y="193" font-size="11" text-anchor="middle" fill="#000000">H₂ N₂</text>
                <text x="150" y="207" font-size="11" text-anchor="middle" fill="#000000">HCl H₂O</text>
                <text x="150" y="221" font-size="11" text-anchor="middle" fill="#000000">CO CO₂</text>
            </g>
            
            <!-- 箭头 1: 初始→A -->
            <g id="scene2-arrow-1" class="scene2-hidden">
                <line x1="200" y1="200" x2="230" y2="200" stroke="#000000" stroke-width="2"/>
                <polygon points="230,200 220,195 220,205" fill="#000000"/>
            </g>
            
            <!-- A 后气体框 (加高，文字在框内) -->
            <g id="scene2-gas-after-a" class="scene2-hidden">
                <rect x="230" y="175" width="100" height="50" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="5"/>
                <text x="280" y="193" font-size="11" text-anchor="middle" fill="#000000">H₂ N₂</text>
                <text x="280" y="207" font-size="11" text-anchor="middle" fill="#000000">H₂O CO₂</text>
                <text x="280" y="221" font-size="11" text-anchor="middle" fill="#000000">CO</text>
                <text x="280" y="188" font-size="10" text-anchor="middle" fill="#c62828" class="scene2-removed">HCl</text>
            </g>
            
            <!-- 箭头 2: A→B -->
            <g id="scene2-arrow-2" class="scene2-hidden">
                <line x1="330" y1="200" x2="360" y2="200" stroke="#000000" stroke-width="2"/>
                <polygon points="360,200 350,195 350,205" fill="#000000"/>
            </g>
            
            <!-- B 后气体框 (加高，文字在框内) -->
            <g id="scene2-gas-after-b" class="scene2-hidden">
                <rect x="360" y="175" width="100" height="50" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="5"/>
                <text x="410" y="193" font-size="11" text-anchor="middle" fill="#000000">N₂ H₂O</text>
                <text x="410" y="207" font-size="11" text-anchor="middle" fill="#000000">CO₂</text>
                <text x="410" y="188" font-size="10" text-anchor="middle" fill="#c62828" class="scene2-removed">H₂ CO</text>
            </g>
            
            <!-- 箭头 3: B→C -->
            <g id="scene2-arrow-3" class="scene2-hidden">
                <line x1="480" y1="200" x2="510" y2="200" stroke="#000000" stroke-width="2"/>
                <polygon points="510,200 500,195 500,205" fill="#000000"/>
            </g>
            
            <!-- C 后气体框 (加高，文字在框内) -->
            <g id="scene2-gas-after-c" class="scene2-hidden">
                <rect x="510" y="175" width="100" height="50" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="5"/>
                <text x="560" y="193" font-size="11" text-anchor="middle" fill="#000000">N₂ H₂O</text>
                <text x="560" y="188" font-size="10" text-anchor="middle" fill="#c62828" class="scene2-removed">CO₂</text>
            </g>
            
            <!-- 箭头 4: C→D -->
            <g id="scene2-arrow-4" class="scene2-hidden">
                <line x1="630" y1="200" x2="660" y2="200" stroke="#000000" stroke-width="2"/>
                <polygon points="660,200 650,195 650,205" fill="#000000"/>
            </g>
            
            <!-- D 后气体框 (加高，文字在框内) -->
            <g id="scene2-gas-after-d" class="scene2-hidden">
                <rect x="660" y="175" width="100" height="50" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="5"/>
                <text x="710" y="193" font-size="11" text-anchor="middle" fill="#000000">N₂</text>
                <text x="710" y="188" font-size="10" text-anchor="middle" fill="#c62828" class="scene2-removed">H₂O</text>
            </g>
            
            <!-- 最终气体框 -->
            <g id="scene2-gas-final" class="scene2-hidden">
                <rect x="660" y="175" width="100" height="50" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3" rx="5"/>
                <text x="710" y="205" font-size="16" font-weight="bold" text-anchor="middle" fill="#2e7d32">N₂</text>
            </g>
            
            <!-- 反应方程式框 (下移，增加高度) -->
            <g id="scene2-reaction-box" class="scene2-hidden">
                <rect x="100" y="250" width="600" height="100" fill="#fff9c4" stroke="#000000" stroke-width="2" rx="5"/>
                <text id="scene2-reaction-text" x="115" y="275" font-size="13" fill="#000000"></text>
            </g>
            
            <!-- 步骤指示器 -->
            <text id="scene2-step-indicator" x="400" y="380" font-size="16" font-weight="bold" text-anchor="middle" fill="#000000">步骤 0/5 - 初始混合气体</text>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-btn-prev" class="scene2-btn" disabled>◀ 上一步</button>
            <button id="scene2-btn-next" class="scene2-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2: 气体除杂流程
        // 布局坐标表（修复后）：
        // | 元素 | 位置/范围 | 备注 |
        // | 标题 | (400, 20) | 顶部居中 |
        // | A 装置矩形 | (60, 40)-(160, 75) | 矩形在上 |
        // | A 装置标签 | (110, 85) | 文字在矩形下方 |
        // | B 装置矩形 | (210, 40)-(310, 75) | 矩形在上 |
        // | B 装置标签 | (260, 85) | 文字在矩形下方 |
        // | C 装置矩形 | (360, 40)-(460, 75) | 矩形在上 |
        // | C 装置标签 | (410, 85) | 文字在矩形下方 |
        // | D 装置矩形 | (510, 40)-(610, 75) | 矩形在上 |
        // | D 装置标签 | (560, 85) | 文字在矩形下方 |
        // | 初始气体框 | (100, 175)-(200, 225) | 加高 |
        // | 最终气体框 | (660, 175)-(760, 225) | 加高 |
        // | 反应式框 | (100, 250)-(700, 350) | 下移 |
        
        const scene2 = {
            currentStep: 0,
            totalSteps: 5,
            
            // 元素引用
            elements: {
                svg: document.getElementById('scene2-svg'),
                btnPrev: document.getElementById('scene2-btn-prev'),
                btnNext: document.getElementById('scene2-btn-next'),
                stepIndicator: document.getElementById('scene2-step-indicator'),
                reactionBox: document.getElementById('scene2-reaction-box'),
                reactionText: document.getElementById('scene2-reaction-text'),
                
                // 装置
                deviceA: document.getElementById('scene2-device-a'),
                deviceB: document.getElementById('scene2-device-b'),
                deviceC: document.getElementById('scene2-device-c'),
                deviceD: document.getElementById('scene2-device-d'),
                
                // 气体框
                gasInitial: document.getElementById('scene2-gas-initial'),
                gasAfterA: document.getElementById('scene2-gas-after-a'),
                gasAfterB: document.getElementById('scene2-gas-after-b'),
                gasAfterC: document.getElementById('scene2-gas-after-c'),
                gasAfterD: document.getElementById('scene2-gas-after-d'),
                gasFinal: document.getElementById('scene2-gas-final'),
                
                // 箭头
                arrow1: document.getElementById('scene2-arrow-1'),
                arrow2: document.getElementById('scene2-arrow-2'),
                arrow3: document.getElementById('scene2-arrow-3'),
                arrow4: document.getElementById('scene2-arrow-4'),
            },
            
            // 反应方程式文本
            reactions: [
                '',
                'HCl + NaHCO₃ → NaCl + H₂O + CO₂',
                'H₂ + CuO → Cu + H₂O<br>CO + CuO → Cu + CO₂',
                'CO₂ + Ca(OH)₂ → CaCO₃↓ + H₂O',
                'H₂O 被浓硫酸吸收（物理吸收）',
                '最终剩余气体：N₂（氮气）'
            ],
            
            // 步骤指示文本
            stepTexts: [
                '步骤 0/5 - 初始混合气体',
                '步骤 1/5 - A 装置除去 HCl',
                '步骤 2/5 - B 装置除去 H₂、CO',
                '步骤 3/5 - C 装置除去 CO₂',
                '步骤 4/5 - D 装置除去 H₂O',
                '步骤 5/5 - 最终剩余 N₂'
            ],
            
            // 初始化
            init: function() {
                this.bindEvents();
                this.updateScene();
            },
            
            // 绑定事件
            bindEvents: function() {
                const self = this;
                this.elements.btnPrev.addEventListener('click', function() {
                    if (self.currentStep > 0) {
                        self.currentStep--;
                        self.updateScene();
                    }
                });
                
                this.elements.btnNext.addEventListener('click', function() {
                    if (self.currentStep < self.totalSteps) {
                        self.currentStep++;
                        self.updateScene();
                    }
                });
            },
            
            // 显示元素
            show: function(el) {
                if (el) {
                    el.style.display = 'block';
                    el.style.opacity = '1';
                    el.classList.remove('scene2-hidden');
                }
            },
            
            // 隐藏元素
            hide: function(el) {
                if (el) {
                    el.style.display = 'none';
                    el.style.opacity = '0';
                    el.classList.add('scene2-hidden');
                }
            },
            
            // 移除高亮
            clearHighlights: function() {
                this.elements.deviceA.classList.remove('scene2-active-device');
                this.elements.deviceB.classList.remove('scene2-active-device');
                this.elements.deviceC.classList.remove('scene2-active-device');
                this.elements.deviceD.classList.remove('scene2-active-device');
                this.elements.gasFinal.classList.remove('scene2-final');
            },
            
            // 添加高亮
            highlightDevice: function(device) {
                device.classList.add('scene2-active-device');
            },
            
            // 更新场景显示
            updateScene: function() {
                const step = this.currentStep;
                const el = this.elements;
                
                // 更新步骤指示器
                el.stepIndicator.textContent = this.stepTexts[step];
                
                // 更新按钮状态
                el.btnPrev.disabled = (step === 0);
                el.btnNext.disabled = (step === this.totalSteps);
                
                // 清除所有高亮
                this.clearHighlights();
                
                // 隐藏所有动态元素
                this.hide(el.gasAfterA);
                this.hide(el.gasAfterB);
                this.hide(el.gasAfterC);
                this.hide(el.gasAfterD);
                this.hide(el.gasFinal);
                this.hide(el.arrow1);
                this.hide(el.arrow2);
                this.hide(el.arrow3);
                this.hide(el.arrow4);
                this.hide(el.reactionBox);
                
                // 根据步骤更新显示
                switch(step) {
                    case 0:
                        // 初始状态：只显示初始气体框和图例
                        this.show(el.gasInitial);
                        break;
                        
                    case 1:
                        // A 装置除 HCl
                        this.show(el.gasInitial);
                        this.show(el.arrow1);
                        this.show(el.gasAfterA);
                        this.highlightDevice(el.deviceA);
                        this.show(el.reactionBox);
                        el.reactionText.innerHTML = this.reactions[1];
                        break;
                        
                    case 2:
                        // B 装置除 H₂、CO
                        this.show(el.gasInitial);
                        this.show(el.arrow1);
                        this.show(el.gasAfterA);
                        this.show(el.arrow2);
                        this.show(el.gasAfterB);
                        this.highlightDevice(el.deviceB);
                        this.show(el.reactionBox);
                        el.reactionText.innerHTML = this.reactions[2];
                        break;
                        
                    case 3:
                        // C 装置除 CO₂
                        this.show(el.gasInitial);
                        this.show(el.arrow1);
                        this.show(el.gasAfterA);
                        this.show(el.arrow2);
                        this.show(el.gasAfterB);
                        this.show(el.arrow3);
                        this.show(el.gasAfterC);
                        this.highlightDevice(el.deviceC);
                        this.show(el.reactionBox);
                        el.reactionText.innerHTML = this.reactions[3];
                        break;
                        
                    case 4:
                        // D 装置除 H₂O
                        this.show(el.gasInitial);
                        this.show(el.arrow1);
                        this.show(el.gasAfterA);
                        this.show(el.arrow2);
                        this.show(el.gasAfterB);
                        this.show(el.arrow3);
                        this.show(el.gasAfterC);
                        this.show(el.arrow4);
                        this.show(el.gasAfterD);
                        this.highlightDevice(el.deviceD);
                        this.show(el.reactionBox);
                        el.reactionText.innerHTML = this.reactions[4];
                        break;
                        
                    case 5:
                        // 最终结果
                        this.show(el.gasInitial);
                        this.show(el.arrow1);
                        this.show(el.gasAfterA);
                        this.show(el.arrow2);
                        this.show(el.gasAfterB);
                        this.show(el.arrow3);
                        this.show(el.gasAfterC);
                        this.show(el.arrow4);
                        this.show(el.gasFinal);
                        el.gasFinal.classList.add('scene2-final');
                        this.show(el.reactionBox);
                        el.reactionText.innerHTML = this.reactions[5];
                        break;
                }
                
                // 触发 MathJax 重新渲染（如果有公式）
                if (window.MathJax) {
                    MathJax.typesetPromise();
                }
            }
        };
        
        // 初始化场景
        scene2.init();
    })();
    </script>
</body>
</html>
