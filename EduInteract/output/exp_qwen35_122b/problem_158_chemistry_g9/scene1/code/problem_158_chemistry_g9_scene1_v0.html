<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>化学转化循环分析</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; z-index: 10; }
        #scene1-prev-btn { padding: 8px 16px; font-size: 14px; border: none; border-radius: 4px; cursor: pointer; background: #9e9e9e; color: white; }
        #scene1-prev-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-next-btn { padding: 8px 16px; font-size: 14px; border: none; border-radius: 4px; cursor: pointer; background: #1976d2; color: white; }
        #scene1-next-btn:hover { background: #1565c0; }
        .scene1-fade-in { animation: scene1-fadeIn 0.3s ease-in; }
        @keyframes scene1-fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#000000" />
                </marker>
                <marker id="scene1-arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#2e7d32" />
                </marker>
                <marker id="scene1-arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#c62828" />
                </marker>
            </defs>

            <!-- 循环①三角形 -->
            <polygon id="scene1-tri-1" points="150,80 100,180 200,180" fill="none" stroke="#000000" stroke-width="2" />
            <!-- 循环①顶点标签 -->
            <text id="scene1-label-1-top" x="150" y="65" text-anchor="middle" font-size="16" fill="#000000">CaCO₃</text>
            <text id="scene1-label-1-left" x="85" y="185" text-anchor="middle" font-size="16" fill="#000000">CaO</text>
            <text id="scene1-label-1-right" x="210" y="185" text-anchor="middle" font-size="16" fill="#000000">Ca(OH)₂</text>
            <!-- 循环①序号 -->
            <text id="scene1-num-1" x="150" y="220" text-anchor="middle" font-size="18" fill="#000000" font-weight="bold">①</text>
            <!-- 循环①箭头 -->
            <path id="scene1-arrow-1-1" d="M 150,88 L 110,165" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#scene1-arrowhead)" />
            <path id="scene1-arrow-1-2" d="M 112,180 L 195,180" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#scene1-arrowhead)" />
            <path id="scene1-arrow-1-3" d="M 200,175 L 160,90" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#scene1-arrowhead)" />

            <!-- 循环②三角形 -->
            <polygon id="scene1-tri-2" points="400,80 350,180 450,180" fill="none" stroke="#000000" stroke-width="2" />
            <!-- 循环②顶点标签 -->
            <text id="scene1-label-2-top" x="400" y="65" text-anchor="middle" font-size="16" fill="#000000">Fe</text>
            <text id="scene1-label-2-left" x="335" y="185" text-anchor="middle" font-size="16" fill="#000000">Fe₂O₃</text>
            <text id="scene1-label-2-right" x="460" y="185" text-anchor="middle" font-size="16" fill="#000000">FeSO₄</text>
            <!-- 循环②序号 -->
            <text id="scene1-num-2" x="400" y="220" text-anchor="middle" font-size="18" fill="#000000" font-weight="bold">②</text>
            <!-- 循环②箭头 -->
            <path id="scene1-arrow-2-1" d="M 400,88 L 360,165" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#scene1-arrowhead)" />
            <path id="scene1-arrow-2-2" d="M 362,180 L 445,180" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#scene1-arrowhead)" />
            <path id="scene1-arrow-2-3" d="M 455,175 L 415,90" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#scene1-arrowhead)" />

            <!-- 循环③三角形 -->
            <polygon id="scene1-tri-3" points="650,80 600,180 700,180" fill="none" stroke="#000000" stroke-width="2" />
            <!-- 循环③顶点标签 -->
            <text id="scene1-label-3-top" x="650" y="65" text-anchor="middle" font-size="16" fill="#000000">H₂O</text>
            <text id="scene1-label-3-left" x="585" y="185" text-anchor="middle" font-size="16" fill="#000000">O₂</text>
            <text id="scene1-label-3-right" x="710" y="185" text-anchor="middle" font-size="16" fill="#000000">MgO</text>
            <!-- 循环③序号 -->
            <text id="scene1-num-3" x="650" y="220" text-anchor="middle" font-size="18" fill="#000000" font-weight="bold">③</text>
            <!-- 循环③箭头 -->
            <path id="scene1-arrow-3-1" d="M 650,88 L 610,165" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#scene1-arrowhead)" />
            <path id="scene1-arrow-3-2" d="M 612,180 L 695,180" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#scene1-arrowhead)" />
            <path id="scene1-arrow-3-3" d="M 700,175 L 660,90" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#scene1-arrowhead)" />

            <!-- 高亮区域（初始隐藏） -->
            <polygon id="scene1-highlight-1" points="150,80 100,180 200,180" fill="#1976d2" opacity="0.15" style="display: none;" />
            <polygon id="scene1-highlight-2" points="400,80 350,180 450,180" fill="#c62828" opacity="0.15" style="display: none;" />
            <polygon id="scene1-highlight-3" points="650,80 600,180 700,180" fill="#1976d2" opacity="0.15" style="display: none;" />

            <!-- 循环①方程式（初始隐藏）- y 坐标从 235 开始，行间距 20px -->
            <text id="scene1-eq-1-1" x="100" y="235" font-size="12" fill="#1565c0" style="display: none;">①-1: CaCO₃ → CaO + CO₂↑</text>
            <text id="scene1-eq-1-2" x="100" y="255" font-size="12" fill="#1565c0" style="display: none;">①-2: CaO + H₂O → Ca(OH)₂</text>
            <text id="scene1-eq-1-3" x="100" y="275" font-size="12" fill="#1565c0" style="display: none;">①-3: Ca(OH)₂ + CO₂ → CaCO₃</text>
            <!-- 循环①可行标记（初始隐藏）- 放在方程式右侧 -->
            <text id="scene1-check-1-1" x="260" y="238" font-size="14" fill="#2e7d32" font-weight="bold" style="display: none;">✓</text>
            <text id="scene1-check-1-2" x="260" y="258" font-size="14" fill="#2e7d32" font-weight="bold" style="display: none;">✓</text>
            <text id="scene1-check-1-3" x="260" y="278" font-size="14" fill="#2e7d32" font-weight="bold" style="display: none;">✓</text>

            <!-- 循环②方程式（初始隐藏） -->
            <text id="scene1-eq-2-1" x="350" y="235" font-size="12" fill="#1565c0" style="display: none;">②-1: Fe → Fe₂O₃ (需多步)</text>
            <text id="scene1-eq-2-2" x="350" y="255" font-size="12" fill="#1565c0" style="display: none;">②-2: Fe₂O₃ + H₂SO₄ → Fe₂(SO₄)₃</text>
            <text id="scene1-eq-2-3" x="350" y="275" font-size="12" fill="#1565c0" style="display: none;">②-3: FeSO₄ → Fe (不可行)</text>
            <!-- 循环②不可行标记（初始隐藏） -->
            <text id="scene1-cross-2-1" x="500" y="238" font-size="14" fill="#c62828" font-weight="bold" style="display: none;">✗</text>
            <text id="scene1-cross-2-2" x="500" y="258" font-size="14" fill="#c62828" font-weight="bold" style="display: none;">✗</text>
            <text id="scene1-cross-2-3" x="500" y="278" font-size="14" fill="#c62828" font-weight="bold" style="display: none;">✗ 不可行</text>

            <!-- 循环③方程式（初始隐藏） -->
            <text id="scene1-eq-3-1" x="600" y="235" font-size="12" fill="#1565c0" style="display: none;">③-1: 2H₂O → 2H₂ + O₂↑</text>
            <text id="scene1-eq-3-2" x="600" y="255" font-size="12" fill="#1565c0" style="display: none;">③-2: 2Mg + O₂ → 2MgO</text>
            <text id="scene1-eq-3-3" x="600" y="275" font-size="12" fill="#1565c0" style="display: none;">③-3: MgO + H₂ → Mg + H₂O</text>
            <!-- 循环③可行标记（初始隐藏） -->
            <text id="scene1-check-3-1" x="730" y="238" font-size="14" fill="#2e7d32" font-weight="bold" style="display: none;">✓</text>
            <text id="scene1-check-3-2" x="730" y="258" font-size="14" fill="#2e7d32" font-weight="bold" style="display: none;">✓</text>
            <text id="scene1-check-3-3" x="730" y="278" font-size="14" fill="#2e7d32" font-weight="bold" style="display: none;">✓</text>

            <!-- 结论文字（初始隐藏） -->
            <text id="scene1-conclusion" x="400" y="350" text-anchor="middle" font-size="20" fill="#1565c0" font-weight="bold" style="display: none;">正确答案：B．①③</text>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-prev-btn" disabled>◀ 上一步</button>
            <button id="scene1-next-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现 - 化学转化循环分析
        const sceneId = 'scene1';
        let currentStep = 0;
        const totalSteps = 4;

        // 工具函数：显示元素
        function show(element) {
            if (element) {
                element.style.display = 'block';
                element.style.opacity = '0';
                setTimeout(() => {
                    element.style.opacity = '1';
                }, 10);
            }
        }

        // 工具函数：隐藏元素
        function hide(element) {
            if (element) {
                element.style.display = 'none';
                element.style.opacity = '1';
            }
        }

        // 更新按钮状态
        function updateButtons() {
            const prevBtn = document.getElementById(sceneId + '-prev-btn');
            const nextBtn = document.getElementById(sceneId + '-next-btn');
            prevBtn.disabled = (currentStep === 0);
            if (currentStep === totalSteps) {
                nextBtn.textContent = '完成';
                nextBtn.disabled = true;
            } else {
                nextBtn.textContent = '下一步 ▶';
                nextBtn.disabled = false;
            }
        }

        // 更新显示状态
        function updateDisplay() {
            // 隐藏所有方程式和高亮
            for (let i = 1; i <= 3; i++) {
                hide(document.getElementById(sceneId + '-highlight-' + i));
                hide(document.getElementById(sceneId + '-eq-' + i + '-1'));
                hide(document.getElementById(sceneId + '-eq-' + i + '-2'));
                hide(document.getElementById(sceneId + '-eq-' + i + '-3'));
                hide(document.getElementById(sceneId + '-check-' + i + '-1'));
                hide(document.getElementById(sceneId + '-check-' + i + '-2'));
                hide(document.getElementById(sceneId + '-check-' + i + '-3'));
                hide(document.getElementById(sceneId + '-cross-' + i + '-1'));
                hide(document.getElementById(sceneId + '-cross-' + i + '-2'));
                hide(document.getElementById(sceneId + '-cross-' + i + '-3'));
            }
            hide(document.getElementById(sceneId + '-conclusion'));

            // 根据步骤显示对应内容
            if (currentStep === 1) {
                // 显示循环①的方程式和高亮
                show(document.getElementById(sceneId + '-highlight-1'));
                show(document.getElementById(sceneId + '-eq-1-1'));
                show(document.getElementById(sceneId + '-eq-1-2'));
                show(document.getElementById(sceneId + '-eq-1-3'));
                show(document.getElementById(sceneId + '-check-1-1'));
                show(document.getElementById(sceneId + '-check-1-2'));
                show(document.getElementById(sceneId + '-check-1-3'));
            } else if (currentStep === 2) {
                // 显示循环②的方程式和高亮
                show(document.getElementById(sceneId + '-highlight-2'));
                show(document.getElementById(sceneId + '-eq-2-1'));
                show(document.getElementById(sceneId + '-eq-2-2'));
                show(document.getElementById(sceneId + '-eq-2-3'));
                show(document.getElementById(sceneId + '-cross-2-1'));
                show(document.getElementById(sceneId + '-cross-2-2'));
                show(document.getElementById(sceneId + '-cross-2-3'));
            } else if (currentStep === 3) {
                // 显示循环③的方程式和高亮
                show(document.getElementById(sceneId + '-highlight-3'));
                show(document.getElementById(sceneId + '-eq-3-1'));
                show(document.getElementById(sceneId + '-eq-3-2'));
                show(document.getElementById(sceneId + '-eq-3-3'));
                show(document.getElementById(sceneId + '-check-3-1'));
                show(document.getElementById(sceneId + '-check-3-2'));
                show(document.getElementById(sceneId + '-check-3-3'));
            } else if (currentStep === 4) {
                // 显示结论
                show(document.getElementById(sceneId + '-conclusion'));
                show(document.getElementById(sceneId + '-highlight-1'));
                show(document.getElementById(sceneId + '-highlight-3'));
                show(document.getElementById(sceneId + '-highlight-2'));
                show(document.getElementById(sceneId + '-check-1-1'));
                show(document.getElementById(sceneId + '-check-1-2'));
                show(document.getElementById(sceneId + '-check-1-3'));
                show(document.getElementById(sceneId + '-check-3-1'));
                show(document.getElementById(sceneId + '-check-3-2'));
                show(document.getElementById(sceneId + '-check-3-3'));
                show(document.getElementById(sceneId + '-cross-2-1'));
                show(document.getElementById(sceneId + '-cross-2-2'));
                show(document.getElementById(sceneId + '-cross-2-3'));
            }

            updateButtons();
        }

        // 事件绑定
        document.getElementById(sceneId + '-prev-btn').addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        });

        document.getElementById(sceneId + '-next-btn').addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateDisplay();
            }
        });

        // 初始化
        updateDisplay();
    })();
    </script>
</body>
</html>
