<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 1 - 选项 A 分析：向饱和石灰水中加入氧化钙</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Microsoft YaHei', sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene1-btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .scene1-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene1-btn-prev { background: #9e9e9e; color: white; }
        .scene1-btn-next { background: #1976d2; color: white; }
        .scene1-status { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); font-size: 14px; color: #666; }
        .scene1-fade { transition: opacity 0.3s ease; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 坐标系边框 -->
            <rect x="50" y="50" width="400" height="300" fill="none" stroke="#000000" stroke-width="1"/>
            
            <!-- 横轴 -->
            <line x1="50" y1="300" x2="440" y2="300" stroke="#000000" stroke-width="2"/>
            <polygon points="440,300 430,295 430,305" fill="#000000"/>
            
            <!-- 纵轴 -->
            <line x1="50" y1="300" x2="50" y2="60" stroke="#000000" stroke-width="2"/>
            <polygon points="50,60 45,70 55,70" fill="#000000"/>
            
            <!-- 原点 O -->
            <text id="scene1-label-origin" x="40" y="310" font-size="14" fill="#000000">O</text>
            
            <!-- 横轴标签（移到坐标系下方，y=355，确保在边框外） -->
            <text id="scene1-label-xaxis" x="250" y="355" font-size="14" fill="#000000" text-anchor="middle">氧化钙质量/g</text>
            
            <!-- 纵轴标签（旋转 90 度，x 移到 40，确保离左边缘足够距离） -->
            <text id="scene1-label-yaxis" x="40" y="180" font-size="14" fill="#000000" transform="rotate(-90 40 180)" text-anchor="middle">溶质质量/g</text>
            
            <!-- 原图曲线（蓝色水平线） -->
            <polyline id="scene1-curve-original" points="50,150 440,150" fill="none" stroke="#1565c0" stroke-width="2" class="scene1-fade" style="opacity: 1;"/>
            <text id="scene1-label-original" x="400" y="120" font-size="12" fill="#1565c0" text-anchor="middle" class="scene1-fade" style="opacity: 1;">原图</text>
            
            <!-- 正确曲线（绿色折线：先下降后水平） -->
            <polyline id="scene1-curve-correct" points="50,150 200,220 440,220" fill="none" stroke="#2e7d32" stroke-width="2" class="scene1-fade" style="opacity: 0;"/>
            <text id="scene1-label-correct" x="400" y="190" font-size="12" fill="#2e7d32" text-anchor="middle" class="scene1-fade" style="opacity: 0;">正确</text>
            
            <!-- 化学方程式区背景（移到更右边，x=530，缩小宽度，y 从 70 开始给文字留空间） -->
            <rect id="scene1-box-equation" x="530" y="70" width="240" height="60" fill="#f0f0f0" stroke="#cccccc" stroke-width="1" class="scene1-fade" style="opacity: 0;"/>
            <text id="scene1-text-equation" x="650" y="60" font-size="16" fill="#000000" text-anchor="middle" class="scene1-fade" style="opacity: 0;">CaO + H₂O → Ca(OH)₂</text>
            
            <!-- 错误原因区背景（移到更右边，x=530，缩小宽度，y 从 200 开始给文字留空间） -->
            <rect id="scene1-box-reason" x="530" y="200" width="240" height="130" fill="#f0f0f0" stroke="#cccccc" stroke-width="1" class="scene1-fade" style="opacity: 0;"/>
            <text id="scene1-text-reason-title" x="545" y="190" font-size="16" fill="#000000" font-weight="bold" class="scene1-fade" style="opacity: 0;">错误原因：</text>
            <text id="scene1-text-reason-1" x="545" y="220" font-size="14" fill="#c62828" class="scene1-fade" style="opacity: 0;">① CaO 与水反应消耗溶剂</text>
            <text id="scene1-text-reason-2" x="545" y="250" font-size="14" fill="#c62828" class="scene1-fade" style="opacity: 0;">② 饱和溶液溶质析出</text>
            <text id="scene1-text-reason-3" x="545" y="280" font-size="14" fill="#c62828" class="scene1-fade" style="opacity: 0;">③ 溶质质量应下降</text>
            
            <!-- 控件栏背景 -->
            <rect id="scene1-controls-bg" x="0" y="440" width="800" height="50" fill="#f5f5f5"/>
        </svg>
        
        <!-- 状态指示标签 -->
        <text id="scene1-status-text" class="scene1-status">状态：0/3</text>
        
        <!-- 控件栏按钮 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn scene1-btn-prev">◀ 上一步</button>
            <button id="scene1-btn-next" class="scene1-btn scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现
        // 布局坐标表（参考）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // |------|------|-----------|------|-------------|------|
        // | 坐标系边框 | rect | (50,50)-(450,350) | 400×300 | - | 左侧绘图区 |
        // | 横轴 | line | (50,300)-(440,300) | 390×2 | - | 带箭头 |
        // | 纵轴 | line | (50,300)-(50,60) | 2×240 | - | 带箭头 |
        // | 横轴标签 | text | (250,355) | 80×16 | 下方 | "氧化钙质量/g" |
        // | 纵轴标签 | text | (40,180) | 80×16 | 左方旋转 90° | "溶质质量/g" |
        // | 原点 O | text | (40,310) | 12×16 | 左下 | 坐标原点 |
        // | 原图曲线 | polyline | (50,150)-(440,150) | 390×2 | - | 蓝色水平线 |
        // | 原图曲线标签 | text | (400,120) | 40×16 | 上方 | "原图" |
        // | 正确曲线 | polyline | (50,150)-(200,220)-(440,220) | - | - | 绿色折线 |
        // | 正确曲线标签 | text | (400,190) | 40×16 | 上方 | "正确" |
        // | 化学方程式区 | rect | (530,70)-(770,130) | 240×60 | - | 状态 1 显示（文字在框上方） |
        // | 方程式文本 | text | (650,60) | 260×24 | 居中 | "CaO + H₂O → Ca(OH)₂" |
        // | 错误原因区 | rect | (530,200)-(770,330) | 240×130 | - | 状态 3 显示（文字在框上方） |
        // | 原因标题 | text | (545,190) | 100×18 | - | "错误原因：" |
        // | 原因点 1 | text | (545,220) | 260×16 | - | "① CaO 与水反应消耗溶剂" |
        // | 原因点 2 | text | (545,250) | 260×16 | - | "② 饱和溶液溶质析出" |
        // | 原因点 3 | text | (545,280) | 260×16 | - | "③ 溶质质量应下降" |
        // | 控件栏背景 | rect | (0,440)-(800,490) | 800×50 | - | 浅灰色背景 |
        // | 上一步按钮 | button | (320,455) | 100×30 | - | 灰色 |
        // | 下一步按钮 | button | (520,455) | 100×30 | - | 蓝色 |
        // | 状态指示标签 | text | (350,420) | 100×16 | - | "状态：0/3" |

        // 状态变量
        var currentState = 0;
        var maxState = 3;

        // 元素 ID 列表
        var elements = {
            curveOriginal: document.getElementById('scene1-curve-original'),
            labelOriginal: document.getElementById('scene1-label-original'),
            curveCorrect: document.getElementById('scene1-curve-correct'),
            labelCorrect: document.getElementById('scene1-label-correct'),
            boxEquation: document.getElementById('scene1-box-equation'),
            textEquation: document.getElementById('scene1-text-equation'),
            boxReason: document.getElementById('scene1-box-reason'),
            textReasonTitle: document.getElementById('scene1-text-reason-title'),
            textReason1: document.getElementById('scene1-text-reason-1'),
            textReason2: document.getElementById('scene1-text-reason-2'),
            textReason3: document.getElementById('scene1-text-reason-3'),
            statusText: document.getElementById('scene1-status-text'),
            btnPrev: document.getElementById('scene1-btn-prev'),
            btnNext: document.getElementById('scene1-btn-next')
        };

        // 工具函数：显示元素
        function show(el) {
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }

        // 工具函数：隐藏元素
        function hide(el) {
            if (el) {
                el.style.opacity = '0';
            }
        }

        // 更新显示状态
        function updateDisplay() {
            // 状态 0：显示坐标系 + 原图曲线
            show(elements.curveOriginal);
            show(elements.labelOriginal);
            
            // 状态 1：+ 方程式区
            if (currentState >= 1) {
                show(elements.boxEquation);
                show(elements.textEquation);
            } else {
                hide(elements.boxEquation);
                hide(elements.textEquation);
            }
            
            // 状态 2：+ 正确曲线
            if (currentState >= 2) {
                show(elements.curveCorrect);
                show(elements.labelCorrect);
            } else {
                hide(elements.curveCorrect);
                hide(elements.labelCorrect);
            }
            
            // 状态 3：+ 原因区
            if (currentState >= 3) {
                show(elements.boxReason);
                show(elements.textReasonTitle);
                show(elements.textReason1);
                show(elements.textReason2);
                show(elements.textReason3);
            } else {
                hide(elements.boxReason);
                hide(elements.textReasonTitle);
                hide(elements.textReason1);
                hide(elements.textReason2);
                hide(elements.textReason3);
            }
            
            // 更新状态文本
            elements.statusText.textContent = '状态：' + currentState + '/' + maxState;
            
            // 更新按钮状态
            elements.btnPrev.disabled = (currentState === 0);
            if (currentState === maxState) {
                elements.btnNext.textContent = '完成';
                elements.btnNext.disabled = true;
            } else {
                elements.btnNext.textContent = '下一步 ▶';
                elements.btnNext.disabled = false;
            }
        }

        // 状态变更函数
        function changeState(delta) {
            var newState = currentState + delta;
            if (newState >= 0 && newState <= maxState) {
                currentState = newState;
                updateDisplay();
            }
        }

        // 事件绑定
        elements.btnPrev.addEventListener('click', function() {
            changeState(-1);
        });

        elements.btnNext.addEventListener('click', function() {
            changeState(1);
        });

        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
