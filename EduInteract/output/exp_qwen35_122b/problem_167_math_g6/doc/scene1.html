<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>甲乙阴影面积比较 - 场景 1</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Microsoft YaHei', sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene1-btn { width: 80px; height: 30px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; transition: all 0.2s; }
        #scene1-btn-prev { background: #9e9e9e; color: #ffffff; }
        #scene1-btn-prev:disabled { background: #bdbdbd; cursor: not-allowed; }
        #scene1-btn-next { background: #1565c0; color: #ffffff; }
        #scene1-btn-next:hover:not(:disabled) { background: #0d47a1; }
        .scene1-label { font-size: 14px; fill: #000000; }
        .scene1-value { font-size: 14px; fill: #000000; }
        .scene1-result { font-size: 14px; fill: #000000; font-weight: bold; }
        .scene1-conclusion { font-size: 14px; fill: #000000; font-weight: bold; }
        .scene1-grid-line { stroke: #000000; stroke-width: 1; fill: none; }
        .scene1-tri-a { fill: #1565c0; fill-opacity: 0.2; stroke: #000000; stroke-width: 2; }
        .scene1-tri-b { fill: #c62828; fill-opacity: 0.2; stroke: #000000; stroke-width: 2; }
        .scene1-highlight { stroke-width: 3; }
        .scene1-dimension-line { stroke: #2e7d32; stroke-width: 2; }
        .scene1-dimension-text { opacity: 0; transition: opacity 0.3s; }
        .scene1-dimension-line-hidden { opacity: 0; transition: opacity 0.3s; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500">
            <!-- 网格：2 行 8 列，从 (200,200) 到 (600,300)，每格 50×50 -->
            <!-- 水平线 -->
            <line x1="200" y1="200" x2="600" y2="200" class="scene1-grid-line"/>
            <line x1="200" y1="250" x2="600" y2="250" class="scene1-grid-line"/>
            <line x1="200" y1="300" x2="600" y2="300" class="scene1-grid-line"/>
            <!-- 垂直线 -->
            <line x1="200" y1="200" x2="200" y2="300" class="scene1-grid-line"/>
            <line x1="250" y1="200" x2="250" y2="300" class="scene1-grid-line"/>
            <line x1="300" y1="200" x2="300" y2="300" class="scene1-grid-line"/>
            <line x1="350" y1="200" x2="350" y2="300" class="scene1-grid-line"/>
            <line x1="400" y1="200" x2="400" y2="300" class="scene1-grid-line"/>
            <line x1="450" y1="200" x2="450" y2="300" class="scene1-grid-line"/>
            <line x1="500" y1="200" x2="500" y2="300" class="scene1-grid-line"/>
            <line x1="550" y1="200" x2="550" y2="300" class="scene1-grid-line"/>
            <line x1="600" y1="200" x2="600" y2="300" class="scene1-grid-line"/>

            <!-- 甲三角形：(200,200)-(300,200)-(300,300) -->
            <polygon id="scene1-tri-a" class="scene1-tri-a" points="200,200 300,200 300,300"/>

            <!-- 乙三角形 1：(450,200)-(500,200)-(500,250) -->
            <polygon id="scene1-tri-b1" class="scene1-tri-b" points="450,200 500,200 500,250"/>

            <!-- 乙三角形 2：(550,200)-(600,200)-(600,250) -->
            <polygon id="scene1-tri-b2" class="scene1-tri-b" points="550,200 600,200 600,250"/>

            <!-- 标签 -->
            <text id="scene1-label-a" class="scene1-label" x="250" y="180" text-anchor="middle">甲</text>
            <text id="scene1-label-b" class="scene1-label" x="525" y="180" text-anchor="middle">乙</text>

            <!-- 甲的底边标注线：(200,310)-(300,310) -->
            <line id="scene1-a-base-line" class="scene1-dimension-line scene1-dimension-line-hidden" x1="200" y1="310" x2="300" y2="310"/>
            <!-- 甲的底边数值 -->
            <text id="scene1-a-base-value" class="scene1-value scene1-dimension-text" x="250" y="325" text-anchor="middle">底=2</text>

            <!-- 甲的高标注线：(305,200)-(305,300) -->
            <line id="scene1-a-height-line" class="scene1-dimension-line scene1-dimension-line-hidden" x1="305" y1="200" x2="305" y2="300"/>
            <!-- 甲的高数值 -->
            <text id="scene1-a-height-value" class="scene1-value scene1-dimension-text" x="315" y="250" text-anchor="middle">高=2</text>

            <!-- 乙 1 的底边标注线：(450,260)-(500,260) -->
            <line id="scene1-b1-base-line" class="scene1-dimension-line scene1-dimension-line-hidden" x1="450" y1="260" x2="500" y2="260"/>
            <!-- 乙 1 的底边数值 -->
            <text id="scene1-b1-base-value" class="scene1-value scene1-dimension-text" x="475" y="275" text-anchor="middle">底=1</text>

            <!-- 乙 1 的高标注线：(505,200)-(505,250) -->
            <line id="scene1-b1-height-line" class="scene1-dimension-line scene1-dimension-line-hidden" x1="505" y1="200" x2="505" y2="250"/>
            <!-- 乙 1 的高数值 -->
            <text id="scene1-b1-height-value" class="scene1-value scene1-dimension-text" x="515" y="225" text-anchor="middle">高=1</text>

            <!-- 乙 2 的底边标注线：(550,260)-(600,260) -->
            <line id="scene1-b2-base-line" class="scene1-dimension-line scene1-dimension-line-hidden" x1="550" y1="260" x2="600" y2="260"/>
            <!-- 乙 2 的底边数值 -->
            <text id="scene1-b2-base-value" class="scene1-value scene1-dimension-text" x="575" y="275" text-anchor="middle">底=1</text>

            <!-- 乙 2 的高标注线：(605,200)-(605,250) -->
            <line id="scene1-b2-height-line" class="scene1-dimension-line scene1-dimension-line-hidden" x1="605" y1="200" x2="605" y2="250"/>
            <!-- 乙 2 的高数值 -->
            <text id="scene1-b2-height-value" class="scene1-value scene1-dimension-text" x="615" y="225" text-anchor="middle">高=1</text>

            <!-- 面积结果 -->
            <text id="scene1-a-result" class="scene1-result" x="230" y="360" opacity="0">甲面积=2×2÷2=2</text>
            <text id="scene1-b-result" class="scene1-result" x="505" y="360" opacity="0">乙面积=0.5+0.5=1</text>

            <!-- 结论 -->
            <text id="scene1-conclusion" class="scene1-conclusion" x="350" y="400" text-anchor="middle" opacity="0">甲面积 &gt; 乙面积</text>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn" disabled>◀ 上一步</button>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // 场景 1：甲乙阴影面积比较
        // 布局坐标表：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // |------|------|-----------|------|-------------|------|
        // | 网格 | 矩形阵列 | (200,200)-(600,300) | 400×100 | - | 2 行 8 列，每格 50×50 |
        // | 甲三角形 | 多边形 | (200,200)-(300,200)-(300,300) | - | - | 蓝色阴影 |
        // | 乙三角形 1 | 多边形 | (450,200)-(500,200)-(500,250) | - | - | 红色阴影 |
        // | 乙三角形 2 | 多边形 | (550,200)-(600,200)-(600,250) | - | - | 红色阴影 |
        // | 甲标签 | text | (250,180) | ~20×16 | 上方 | 甲区域上方居中 |
        // | 乙标签 | text | (525,180) | ~20×16 | 上方 | 乙区域上方居中 |
        // | 甲底边标注线 | 线段 | (200,310)-(300,310) | 100×2 | - | 甲底边下方 |
        // | 甲底边数值 | text | (250,325) | ~50×16 | 下方 | 底边标注线下方 |
        // | 甲高标注线 | 线段 | (305,200)-(305,300) | 2×100 | - | 甲右侧 |
        // | 甲高数值 | text | (315,250) | ~50×16 | 右侧 | 高标注线右侧 |
        // | 乙 1 底边标注线 | 线段 | (450,260)-(500,260) | 50×2 | - | 乙 1 底边下方 |
        // | 乙 1 底边数值 | text | (475,275) | ~60×16 | 下方 | 乙 1 底边标注线下方 |
        // | 乙 1 高标注线 | 线段 | (505,200)-(505,250) | 2×50 | - | 乙 1 右侧 |
        // | 乙 1 高数值 | text | (515,225) | ~60×16 | 右侧 | 乙 1 高标注线右侧 |
        // | 乙 2 底边标注线 | 线段 | (550,260)-(600,260) | 50×2 | - | 乙 2 底边下方 |
        // | 乙 2 底边数值 | text | (575,275) | ~60×16 | 下方 | 乙 2 底边标注线下方 |
        // | 乙 2 高标注线 | 线段 | (605,200)-(605,250) | 2×50 | - | 乙 2 右侧 |
        // | 乙 2 高数值 | text | (615,225) | ~60×16 | 右侧 | 乙 2 高标注线右侧 |
        // | 甲面积结果 | text | (230,360) | ~120×16 | - | 步骤 3 显示 |
        // | 乙面积结果 | text | (505,360) | ~120×16 | - | 步骤 3 显示 |
        // | 结论标签 | text | (350,400) | ~100×16 | - | 步骤 3 显示 |
        // | 控件栏 | div | (280,440)-(520,490) | 240×50 | - | 底部居中 |
        // | 上一步按钮 | button | (300,455) | 80×30 | - | 控件栏左侧 |
        // | 下一步按钮 | button | (420,455) | 80×30 | - | 控件栏右侧 |

        // 状态变量
        let currentStep = 0;
        const totalSteps = 3;

        // 获取 DOM 元素
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');

        // 甲三角形元素
        const triA = document.getElementById('scene1-tri-a');

        // 乙三角形元素
        const triB1 = document.getElementById('scene1-tri-b1');
        const triB2 = document.getElementById('scene1-tri-b2');

        // 甲的标注元素
        const aBaseLine = document.getElementById('scene1-a-base-line');
        const aBaseValue = document.getElementById('scene1-a-base-value');
        const aHeightLine = document.getElementById('scene1-a-height-line');
        const aHeightValue = document.getElementById('scene1-a-height-value');

        // 乙 1 的标注元素
        const b1BaseLine = document.getElementById('scene1-b1-base-line');
        const b1BaseValue = document.getElementById('scene1-b1-base-value');
        const b1HeightLine = document.getElementById('scene1-b1-height-line');
        const b1HeightValue = document.getElementById('scene1-b1-height-value');

        // 乙 2 的标注元素
        const b2BaseLine = document.getElementById('scene1-b2-base-line');
        const b2BaseValue = document.getElementById('scene1-b2-base-value');
        const b2HeightLine = document.getElementById('scene1-b2-height-line');
        const b2HeightValue = document.getElementById('scene1-b2-height-value');

        // 结果和结论
        const aResult = document.getElementById('scene1-a-result');
        const bResult = document.getElementById('scene1-b-result');
        const conclusion = document.getElementById('scene1-conclusion');

        // 工具函数：显示元素
        function show(el) {
            el.style.display = 'block';
            el.style.opacity = '1';
        }

        // 工具函数：隐藏元素
        function hide(el) {
            el.style.display = 'none';
            el.style.opacity = '0';
        }

        // 更新按钮状态
        function updateButtons() {
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps);
        }

        // 更新显示状态
        function updateDisplay() {
            // 步骤 0：初始状态 - 只显示网格、三角形和标签
            // 步骤 1：显示甲的底和高标注
            // 步骤 2：显示乙的底和高标注
            // 步骤 3：显示面积结果和结论

            // 甲的标注
            if (currentStep >= 1) {
                show(aBaseLine);
                show(aBaseValue);
                show(aHeightLine);
                show(aHeightValue);
                triA.classList.add('scene1-highlight');
            } else {
                hide(aBaseLine);
                hide(aBaseValue);
                hide(aHeightLine);
                hide(aHeightValue);
                triA.classList.remove('scene1-highlight');
            }

            // 乙的标注
            if (currentStep >= 2) {
                show(b1BaseLine);
                show(b1BaseValue);
                show(b1HeightLine);
                show(b1HeightValue);
                show(b2BaseLine);
                show(b2BaseValue);
                show(b2HeightLine);
                show(b2HeightValue);
                triB1.classList.add('scene1-highlight');
                triB2.classList.add('scene1-highlight');
            } else {
                hide(b1BaseLine);
                hide(b1BaseValue);
                hide(b1HeightLine);
                hide(b1HeightValue);
                hide(b2BaseLine);
                hide(b2BaseValue);
                hide(b2HeightLine);
                hide(b2HeightValue);
                triB1.classList.remove('scene1-highlight');
                triB2.classList.remove('scene1-highlight');
            }

            // 结果和结论
            if (currentStep >= 3) {
                aResult.style.opacity = '1';
                bResult.style.opacity = '1';
                conclusion.style.opacity = '1';
                triA.classList.add('scene1-highlight');
                triB1.classList.add('scene1-highlight');
                triB2.classList.add('scene1-highlight');
            } else {
                aResult.style.opacity = '0';
                bResult.style.opacity = '0';
                conclusion.style.opacity = '0';
                if (currentStep < 1) {
                    triA.classList.remove('scene1-highlight');
                }
                if (currentStep < 2) {
                    triB1.classList.remove('scene1-highlight');
                    triB2.classList.remove('scene1-highlight');
                }
            }

            updateButtons();
        }

        // 事件处理
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateDisplay();
            }
        });

        // 初始化
        updateDisplay();
    })();
    </script>
</body>
</html>
