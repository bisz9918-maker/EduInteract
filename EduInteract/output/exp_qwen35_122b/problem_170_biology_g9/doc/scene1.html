<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 1 - 概念包含关系图</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene1-btn { padding: 8px 20px; font-size: 14px; background: #1565c0; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .scene1-btn:disabled { background: #999; cursor: not-allowed; }
        .scene1-btn:hover:not(:disabled) { background: #0d47a1; }
        #scene1-step-indicator { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); font-size: 14px; color: #333; }
        .scene1-element { transition: opacity 0.3s ease, stroke 0.3s ease; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-canvas" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 布局坐标表对照：
                大圆Ⅰ：center(400,250), r=220
                小圆Ⅱ：center(520,170), r=60
                小圆Ⅲ：center(320,310), r=60
                小圆Ⅳ：center(520,310), r=60
                标签Ⅰ：(360,60) - 大圆上方外部
                标签Ⅱ：(520,60) - 小圆Ⅱ上方外部
                标签Ⅲ：(320,400) - 小圆Ⅲ下方外部
                标签Ⅳ：(520,400) - 小圆Ⅳ下方外部
            -->
            
            <!-- 大圆Ⅰ -->
            <circle id="scene1-circle-major" class="scene1-element" cx="400" cy="250" r="220" 
                    fill="rgba(220,220,220,0.15)" stroke="#000000" stroke-width="3"/>
            
            <!-- 小圆Ⅱ -->
            <circle id="scene1-circle-2" class="scene1-element" cx="520" cy="170" r="60" 
                    fill="rgba(220,220,220,0.15)" stroke="#000000" stroke-width="2"
                    style="opacity: 0;"/>
            
            <!-- 小圆Ⅲ -->
            <circle id="scene1-circle-3" class="scene1-element" cx="320" cy="310" r="60" 
                    fill="rgba(220,220,220,0.15)" stroke="#000000" stroke-width="2"
                    style="opacity: 0;"/>
            
            <!-- 小圆Ⅳ -->
            <circle id="scene1-circle-4" class="scene1-element" cx="520" cy="310" r="60" 
                    fill="rgba(220,220,220,0.15)" stroke="#000000" stroke-width="2"
                    style="opacity: 0;"/>
            
            <!-- 标签Ⅰ - 大圆上方外部 -->
            <text id="scene1-label-1" x="360" y="60" font-size="24" fill="#000000" font-weight="bold">Ⅰ</text>
            
            <!-- 标签Ⅱ - 小圆Ⅱ上方外部 -->
            <text id="scene1-label-2" x="520" y="60" font-size="20" fill="#000000" font-weight="bold"
                  text-anchor="middle" style="opacity: 0;">Ⅱ</text>
            
            <!-- 标签Ⅲ - 小圆Ⅲ下方外部 -->
            <text id="scene1-label-3" x="320" y="400" font-size="20" fill="#000000" font-weight="bold"
                  text-anchor="middle" style="opacity: 0;">Ⅲ</text>
            
            <!-- 标签Ⅳ - 小圆Ⅳ下方外部 -->
            <text id="scene1-label-4" x="520" y="400" font-size="20" fill="#000000" font-weight="bold"
                  text-anchor="middle" style="opacity: 0;">Ⅳ</text>
            
            <!-- 包含箭头 1: 大圆上边缘→小圆Ⅱ下边缘 -->
            <line id="scene1-arrow-1" class="scene1-element" x1="400" y1="30" x2="520" y2="110"
                  stroke="#1565c0" stroke-width="2" style="opacity: 0;"/>
            <!-- 箭头头部 1 -->
            <polygon id="scene1-arrowhead-1" class="scene1-element" points="520,110 510,100 525,105"
                     fill="#1565c0" style="opacity: 0;"/>
            
            <!-- 包含箭头 2: 大圆下边缘→小圆Ⅲ上边缘 -->
            <line id="scene1-arrow-2" class="scene1-element" x1="400" y1="470" x2="320" y2="370"
                  stroke="#1565c0" stroke-width="2" style="opacity: 0;"/>
            <!-- 箭头头部 2 -->
            <polygon id="scene1-arrowhead-2" class="scene1-element" points="320,370 310,360 325,365"
                     fill="#1565c0" style="opacity: 0;"/>
            
            <!-- 包含箭头 3: 大圆右下边缘→小圆Ⅳ左上边缘 -->
            <line id="scene1-arrow-3" class="scene1-element" x1="550" y1="400" x2="520" y2="370"
                  stroke="#1565c0" stroke-width="2" style="opacity: 0;"/>
            <!-- 箭头头部 3 -->
            <polygon id="scene1-arrowhead-3" class="scene1-element" points="520,370 510,360 525,365"
                     fill="#1565c0" style="opacity: 0;"/>
            
            <!-- "包含"文字 - 箭头汇聚区上方 -->
            <text id="scene1-label-include" class="scene1-element" x="450" y="180" font-size="16" fill="#1565c0"
                  style="opacity: 0;">包含</text>
            
            <!-- 并列虚线框：包围三个小圆的外接矩形 -->
            <rect id="scene1-dashed-box" class="scene1-element" 
                  x="250" y="100" width="330" height="300"
                  fill="none" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"
                  style="opacity: 0;"/>
            
            <!-- "并列关系"文字 - 虚线框下方 -->
            <text id="scene1-label-parallel" class="scene1-element" x="415" y="420" font-size="16" fill="#888888"
                  text-anchor="middle" style="opacity: 0;">并列关系</text>
            
            <!-- 总结文字（步骤 4 显示） -->
            <text id="scene1-label-summary" class="scene1-element" x="400" y="445" font-size="14" fill="#333333"
                  text-anchor="middle" style="opacity: 0;">总结：Ⅰ是大概念，Ⅱ/Ⅲ/Ⅳ是并列子概念</text>
            
            <!-- 控件栏背景 -->
            <rect id="scene1-control-bg" x="200" y="450" width="400" height="35" 
                  fill="#f5f5f5" rx="4"/>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn" disabled>◀上一步</button>
            <button id="scene1-btn-next" class="scene1-btn">下一步▶</button>
        </div>
        <text id="scene1-step-indicator" x="400" y="473" font-size="14" fill="#333333" text-anchor="middle">步骤 1/5</text>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现 - 概念包含关系图
        let currentStep = 0;
        const totalSteps = 5;
        
        const elements = {
            circleMajor: 'scene1-circle-major',
            circle2: 'scene1-circle-2',
            circle3: 'scene1-circle-3',
            circle4: 'scene1-circle-4',
            label1: 'scene1-label-1',
            label2: 'scene1-label-2',
            label3: 'scene1-label-3',
            label4: 'scene1-label-4',
            arrow1: 'scene1-arrow-1',
            arrow2: 'scene1-arrow-2',
            arrow3: 'scene1-arrow-3',
            arrowhead1: 'scene1-arrowhead-1',
            arrowhead2: 'scene1-arrowhead-2',
            arrowhead3: 'scene1-arrowhead-3',
            labelInclude: 'scene1-label-include',
            labelParallel: 'scene1-label-parallel',
            labelSummary: 'scene1-label-summary',
            dashedBox: 'scene1-dashed-box',
            btnPrev: 'scene1-btn-prev',
            btnNext: 'scene1-btn-next',
            stepIndicator: 'scene1-step-indicator'
        };
        
        function show(elId) {
            const el = document.getElementById(elId);
            if (el) {
                el.style.opacity = '1';
                el.style.display = 'block';
            }
        }
        
        function hide(elId) {
            const el = document.getElementById(elId);
            if (el) {
                el.style.opacity = '0';
                el.style.display = 'none';
            }
        }
        
        function highlightMajorCircle() {
            const el = document.getElementById(elements.circleMajor);
            if (el) {
                el.style.stroke = '#1565c0';
                el.style.strokeWidth = '3';
            }
        }
        
        function highlightMinorCircles() {
            [elements.circle2, elements.circle3, elements.circle4].forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.style.stroke = '#c62828';
                    el.style.strokeWidth = '2';
                }
            });
        }
        
        function updateDisplay() {
            show(elements.circleMajor);
            show(elements.label1);
            
            if (currentStep >= 1) {
                show(elements.circle2);
                show(elements.circle3);
                show(elements.circle4);
                show(elements.label2);
                show(elements.label3);
                show(elements.label4);
            } else {
                hide(elements.circle2);
                hide(elements.circle3);
                hide(elements.circle4);
                hide(elements.label2);
                hide(elements.label3);
                hide(elements.label4);
            }
            
            if (currentStep >= 2) {
                show(elements.arrow1);
                show(elements.arrow2);
                show(elements.arrow3);
                show(elements.arrowhead1);
                show(elements.arrowhead2);
                show(elements.arrowhead3);
                show(elements.labelInclude);
                highlightMajorCircle();
            } else {
                hide(elements.arrow1);
                hide(elements.arrow2);
                hide(elements.arrow3);
                hide(elements.arrowhead1);
                hide(elements.arrowhead2);
                hide(elements.arrowhead3);
                hide(elements.labelInclude);
                const majorCircle = document.getElementById(elements.circleMajor);
                if (majorCircle) {
                    majorCircle.style.stroke = '#000000';
                }
            }
            
            if (currentStep >= 3) {
                show(elements.dashedBox);
                show(elements.labelParallel);
                highlightMinorCircles();
            } else {
                hide(elements.dashedBox);
                hide(elements.labelParallel);
                [elements.circle2, elements.circle3, elements.circle4].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) {
                        el.style.stroke = '#000000';
                    }
                });
            }
            
            if (currentStep >= 4) {
                show(elements.labelSummary);
            } else {
                hide(elements.labelSummary);
            }
            
            const btnPrev = document.getElementById(elements.btnPrev);
            const btnNext = document.getElementById(elements.btnNext);
            const stepIndicator = document.getElementById(elements.stepIndicator);
            
            if (btnPrev) btnPrev.disabled = (currentStep === 0);
            if (btnNext) btnNext.disabled = (currentStep === totalSteps - 1);
            if (stepIndicator) stepIndicator.textContent = `步骤 ${currentStep + 1}/${totalSteps}`;
        }
        
        function bindEvents() {
            const btnPrev = document.getElementById(elements.btnPrev);
            const btnNext = document.getElementById(elements.btnNext);
            
            if (btnPrev) {
                btnPrev.addEventListener('click', () => {
                    if (currentStep > 0) {
                        currentStep--;
                        updateDisplay();
                    }
                });
            }
            
            if (btnNext) {
                btnNext.addEventListener('click', () => {
                    if (currentStep < totalSteps - 1) {
                        currentStep++;
                        updateDisplay();
                    }
                });
            }
        }
        
        function init() {
            updateDisplay();
            bindEvents();
        }
        
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>
</body>
</html>
