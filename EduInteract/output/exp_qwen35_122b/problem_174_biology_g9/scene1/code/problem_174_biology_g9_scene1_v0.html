<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>突触结构与兴奋传导 - Scene 1</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 20px; z-index: 10; }
        .scene1-btn { padding: 8px 20px; font-size: 14px; background: #1976d2; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .scene1-btn:hover { background: #1565c0; }
        .scene1-btn:disabled { background: #bdbdbd; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 14px; color: #424242; font-weight: bold; }
        .scene1-summary { position: absolute; bottom: 85px; left: 20px; right: 20px; background: #fff3e0; border: 1px solid #ffb74d; border-radius: 6px; padding: 12px; font-size: 13px; line-height: 1.6; display: none; }
        .scene1-summary-title { font-weight: bold; color: #e65100; margin-bottom: 8px; }
        .scene1-summary-item { margin: 4px 0; }
        .scene1-summary-item.correct { color: #2e7d32; }
        .scene1-summary-item.wrong { color: #c62828; }
        .scene1-answer { font-weight: bold; color: #1565c0; margin-top: 8px; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- 背景 -->
            <rect width="800" height="500" fill="#ffffff"/>
            
            <!-- 神经元 A (左下方轴突末梢) -->
            <g id="scene1-neuron-A">
                <path d="M 100 400 L 140 360 L 180 340 L 170 310 L 140 320 L 110 350 Z" 
                      fill="#e3f2fd" fill-opacity="0.2" stroke="#000000" stroke-width="2"/>
                <!-- 突触小泡 (5 个) -->
                <circle cx="130" cy="340" r="3" fill="#000000"/>
                <circle cx="145" cy="330" r="3" fill="#000000"/>
                <circle cx="155" cy="345" r="3" fill="#000000"/>
                <circle cx="160" cy="325" r="3" fill="#000000"/>
                <circle cx="140" cy="355" r="3" fill="#000000"/>
                <!-- 标签 A -->
                <text id="scene1-label-A" x="85" y="420" font-size="18" fill="#000000" font-weight="bold">A</text>
            </g>
            
            <!-- 神经元 B (中部轴突末梢) -->
            <g id="scene1-neuron-B">
                <path d="M 200 280 L 230 250 L 270 240 L 300 260 L 310 300 L 290 340 L 250 350 L 210 330 L 190 300 Z" 
                      fill="#e3f2fd" fill-opacity="0.2" stroke="#000000" stroke-width="2"/>
                <!-- 突触小泡 (6 个) -->
                <circle cx="230" cy="280" r="3" fill="#000000"/>
                <circle cx="250" cy="270" r="3" fill="#000000"/>
                <circle cx="265" cy="290" r="3" fill="#000000"/>
                <circle cx="275" cy="310" r="3" fill="#000000"/>
                <circle cx="255" cy="320" r="3" fill="#000000"/>
                <circle cx="240" cy="300" r="3" fill="#000000"/>
                <!-- 标签 B -->
                <text id="scene1-label-B" x="245" y="375" font-size="18" fill="#000000" font-weight="bold">B</text>
            </g>
            
            <!-- 神经元 C (右侧突触后膜) -->
            <g id="scene1-neuron-C">
                <path d="M 320 270 L 340 250 L 370 245 L 390 260 L 395 300 L 385 340 L 350 350 L 320 330 L 310 300 Z" 
                      fill="#e3f2fd" fill-opacity="0.2" stroke="#000000" stroke-width="2"/>
                <!-- C 的轴突延伸 -->
                <rect x="395" y="290" width="260" height="20" fill="#e3f2fd" fill-opacity="0.2" stroke="#000000" stroke-width="2"/>
                <!-- 标签 C -->
                <text id="scene1-label-C" x="355" y="375" font-size="18" fill="#000000" font-weight="bold">C</text>
            </g>
            
            <!-- 突触间隙 A-B (虚线) -->
            <g id="scene1-synapse-gap-AB">
                <line x1="185" y1="310" x2="200" y2="310" stroke="#888888" stroke-width="2" stroke-dasharray="4,3"/>
                <line x1="185" y1="320" x2="200" y2="320" stroke="#888888" stroke-width="2" stroke-dasharray="4,3"/>
                <line x1="185" y1="330" x2="200" y2="330" stroke="#888888" stroke-width="2" stroke-dasharray="4,3"/>
            </g>
            
            <!-- 突触间隙 B-C (虚线) -->
            <g id="scene1-synapse-gap-BC">
                <line x1="312" y1="270" x2="320" y2="270" stroke="#888888" stroke-width="2" stroke-dasharray="4,3"/>
                <line x1="312" y1="285" x2="320" y2="285" stroke="#888888" stroke-width="2" stroke-dasharray="4,3"/>
                <line x1="312" y1="300" x2="320" y2="300" stroke="#888888" stroke-width="2" stroke-dasharray="4,3"/>
                <line x1="312" y1="315" x2="320" y2="315" stroke="#888888" stroke-width="2" stroke-dasharray="4,3"/>
            </g>
            
            <!-- 电流计 -->
            <g id="scene1-galvanometer">
                <circle cx="420" cy="100" r="25" fill="none" stroke="#000000" stroke-width="2"/>
                <!-- 指针 (初始向上) -->
                <g id="scene1-galvanometer-pointer" transform="translate(420,100)">
                    <line x1="0" y1="0" x2="0" y2="-18" stroke="#000000" stroke-width="2"/>
                    <polygon points="0,-22 -3,-18 3,-18" fill="#000000"/>
                </g>
                <!-- 标签 G -->
                <text id="scene1-label-G" x="395" y="105" font-size="16" fill="#000000">G</text>
            </g>
            
            <!-- 电流计连线 -->
            <g id="scene1-galvanometer-wires">
                <line x1="150" y1="300" x2="150" y2="100" stroke="#000000" stroke-width="1.5"/>
                <line x1="150" y1="100" x2="395" y2="100" stroke="#000000" stroke-width="1.5"/>
                <line x1="650" y1="300" x2="650" y2="100" stroke="#000000" stroke-width="1.5"/>
                <line x1="445" y1="100" x2="650" y2="100" stroke="#000000" stroke-width="1.5"/>
            </g>
            
            <!-- 测量点 a -->
            <g id="scene1-point-a">
                <circle cx="150" cy="300" r="4" fill="#000000"/>
                <text x="135" y="315" font-size="14" fill="#000000">a</text>
            </g>
            
            <!-- 测量点 d -->
            <g id="scene1-point-d">
                <circle cx="650" cy="300" r="4" fill="#000000"/>
                <text x="658" y="315" font-size="14" fill="#000000">d</text>
            </g>
            
            <!-- 刺激点 b -->
            <g id="scene1-stimulus-b">
                <circle cx="250" cy="230" r="5" fill="#c62828"/>
                <text x="245" y="220" font-size="14" fill="#000000">b</text>
                <!-- 向下箭头 -->
                <line x1="250" y1="210" x2="250" y2="225" stroke="#000000" stroke-width="2"/>
                <polygon points="250,228 247,220 253,220" fill="#000000"/>
            </g>
            
            <!-- 刺激点 c -->
            <g id="scene1-stimulus-c">
                <circle cx="360" cy="230" r="5" fill="#c62828"/>
                <text x="355" y="220" font-size="14" fill="#000000">c</text>
                <!-- 向下箭头 -->
                <line x1="360" y1="210" x2="360" y2="225" stroke="#000000" stroke-width="2"/>
                <polygon points="360,228 357,220 363,220" fill="#000000"/>
            </g>
            
            <!-- 步骤 1: 突触膜标签 (初始隐藏) -->
            <g id="scene1-step1-groups" style="display: none; opacity: 0;">
                <!-- 突触前膜 A 标签 -->
                <text id="scene1-premembrane-A" x="185" y="310" font-size="12" fill="#c62828">突触前膜</text>
                <!-- 突触后膜 B 标签 -->
                <text id="scene1-postmembrane-B" x="205" y="325" font-size="12" fill="#2e7d32">突触后膜</text>
                <!-- 突触前膜 B 标签 -->
                <text id="scene1-premembrane-B" x="315" y="290" font-size="12" fill="#c62828">突触前膜</text>
                <!-- 突触后膜 C 标签 -->
                <text id="scene1-postmembrane-C" x="325" y="305" font-size="12" fill="#2e7d32">突触后膜</text>
            </g>
            
            <!-- 步骤 2: 兴奋传导箭头 (初始隐藏) -->
            <g id="scene1-step2-arrows" style="display: none; opacity: 0;">
                <!-- 箭头 1: b 点→A-B 突触 -->
                <line id="scene1-arrow-b-to-synapse" x1="250" y1="235" x2="195" y2="310" 
                      stroke="#1565c0" stroke-width="3" marker-end="url(#scene1-arrowhead)"/>
                <!-- 箭头 2: B-C 突触→C 神经元 -->
                <line id="scene1-arrow-synapse-to-C" x1="315" y1="290" x2="360" y2="290" 
                      stroke="#1565c0" stroke-width="3" marker-end="url(#scene1-arrowhead)"/>
            </g>
            
            <!-- 步骤 3: c 点传导箭头 (初始隐藏) -->
            <g id="scene1-step3-arrows" style="display: none; opacity: 0;">
                <!-- 箭头 3: c 点向右传导 -->
                <line id="scene1-arrow-c-conduction" x1="365" y1="230" x2="450" y2="230" 
                      stroke="#1565c0" stroke-width="3" marker-end="url(#scene1-arrowhead)"/>
            </g>
            
            <!-- 箭头标记定义 -->
            <defs>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0"/>
                </marker>
            </defs>
        </svg>
        
        <!-- 总结区域 (步骤 4 显示) -->
        <div id="scene1-summary" class="scene1-summary">
            <div class="scene1-summary-title">传导分析总结：</div>
            <div class="scene1-summary-item wrong">① 图示结构包括 3 个神经元，含有 2 个突触（非 3 个）✗</div>
            <div class="scene1-summary-item wrong">② 刺激 b 点偏转 2 次，刺激 c 点偏转 1 次（非都 2 次）✗</div>
            <div class="scene1-summary-item correct">③ B 受刺激 C 兴奋；A、B 同时刺激 C 不兴奋→A 释放抑制性递质 ✓</div>
            <div class="scene1-summary-item correct">④ 递质与突触后膜受体结合，受体是糖蛋白 ✓</div>
            <div class="scene1-summary-item correct">⑤ A、B 是轴突末梢，C 可能是树突或轴突 ✓</div>
            <div class="scene1-answer">正确答案：D．③④</div>
        </div>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/5</span>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1: 突触结构与兴奋传导路径
        // 布局坐标表 (根据原图调整):
        // 神经元 A: (100,400)-(180,310) 左下方轴突末梢
        // 神经元 B: (200,280)-(310,350) 中部轴突末梢
        // 神经元 C: (320,270)-(395,350) 右侧突触后膜
        // C 轴突延伸：(395,290)-(655,310)
        // 电流计：(420,100) 直径 50px
        // 点 a: (150,300) B 神经元左侧
        // 点 d: (650,300) C 轴突右侧
        // 点 b: (250,230) B 神经元上
        // 点 c: (360,230) C 神经元上
        
        var currentStep = 1;
        var totalSteps = 5;
        
        // 工具函数：显示元素
        function show(el) {
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }
        
        // 工具函数：隐藏元素
        function hide(el) {
            if (el) {
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }
        
        // 更新场景显示
        function updateScene() {
            // 步骤 1 元素：突触膜标签
            var step1Groups = document.getElementById('scene1-step1-groups');
            if (currentStep >= 1) {
                show(step1Groups);
            } else {
                hide(step1Groups);
            }
            
            // 步骤 2 元素：兴奋传导箭头 (b 点刺激)
            var step2Arrows = document.getElementById('scene1-step2-arrows');
            var pointer = document.getElementById('scene1-galvanometer-pointer');
            if (currentStep >= 2) {
                show(step2Arrows);
                // 电流计指针偏转动画：先左后右
                setTimeout(function() {
                    pointer.setAttribute('transform', 'translate(420,100) rotate(-15)');
                }, 200);
                setTimeout(function() {
                    pointer.setAttribute('transform', 'translate(420,100) rotate(15)');
                }, 600);
            } else {
                hide(step2Arrows);
                pointer.setAttribute('transform', 'translate(420,100) rotate(0)');
            }
            
            // 步骤 3 元素：c 点传导箭头
            var step3Arrows = document.getElementById('scene1-step3-arrows');
            if (currentStep >= 3) {
                show(step3Arrows);
                // 电流计指针仅向右偏转
                setTimeout(function() {
                    pointer.setAttribute('transform', 'translate(420,100) rotate(10)');
                }, 200);
            } else if (currentStep < 3) {
                hide(step3Arrows);
                if (currentStep < 2) {
                    pointer.setAttribute('transform', 'translate(420,100) rotate(0)');
                }
            }
            
            // 步骤 4 元素：总结区域
            var summary = document.getElementById('scene1-summary');
            if (currentStep >= 4) {
                show(summary);
            } else {
                hide(summary);
            }
            
            // 更新步骤指示器
            document.getElementById('scene1-step-indicator').textContent = '步骤 ' + currentStep + '/' + totalSteps;
            
            // 更新按钮状态
            var prevBtn = document.getElementById('scene1-btn-prev');
            var nextBtn = document.getElementById('scene1-btn-next');
            prevBtn.disabled = (currentStep <= 1);
            nextBtn.disabled = (currentStep >= totalSteps);
            if (currentStep >= totalSteps) {
                nextBtn.textContent = '完成';
            } else {
                nextBtn.textContent = '下一步 ▶';
            }
        }
        
        // 按钮事件绑定
        document.getElementById('scene1-btn-prev').addEventListener('click', function() {
            if (currentStep > 1) {
                currentStep--;
                updateScene();
            }
        });
        
        document.getElementById('scene1-btn-next').addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateScene();
            }
        });
        
        // 初始化场景
        updateScene();
    })();
    </script>
</body>
</html>
