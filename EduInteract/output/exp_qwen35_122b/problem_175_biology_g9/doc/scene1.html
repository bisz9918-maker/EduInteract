<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>植物类群分类图解 - Scene 1</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Microsoft YaHei', sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene1-btn { padding: 8px 20px; font-size: 14px; border: 2px solid #333; border-radius: 6px; background: #f5f5f5; cursor: pointer; transition: all 0.2s; }
        .scene1-btn:hover:not(:disabled) { background: #e0e0e0; }
        .scene1-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-step-indicator { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); font-size: 14px; color: #666; }
        .scene1-node-box { fill: #f5f5f5; fill-opacity: 0.15; stroke: #000; stroke-width: 2; }
        .scene1-node-box.highlight-blue { stroke: #1565c0; stroke-width: 3; fill: #e3f2fd; fill-opacity: 0.5; }
        .scene1-terminal-box { fill: #fff9f9; stroke: #000; stroke-width: 2; stroke-dasharray: 5,3; }
        .scene1-terminal-box.highlight-green { stroke: #2e7d32; stroke-width: 3; stroke-dasharray: none; fill: #e8f5e9; fill-opacity: 0.5; }
        .scene1-line { stroke: #000; stroke-width: 1.5; fill: none; }
        .scene1-line.highlight-blue { stroke: #1565c0; stroke-width: 3; }
        .scene1-label { font-size: 14px; fill: #000; text-anchor: middle; dominant-baseline: middle; }
        .scene1-number-label { font-size: 16px; font-weight: bold; fill: #000; text-anchor: middle; dominant-baseline: middle; }
        .scene1-feature-text { font-size: 13px; fill: #000; }
        .scene1-feature-text.highlight { fill: #2e7d32; font-weight: bold; }
        .scene1-feature-box { fill: #f5f5f5; stroke: #666; stroke-width: 1; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500">
            <!-- 连线层（底层） -->
            <g id="scene1-lines">
                <!-- 连线1: 无果实植物到第二层中点 -->
                <line id="scene1-line1" class="scene1-line" x1="400" y1="60" x2="400" y2="110"/>
                <!-- 连线2: 第二层中点到无种子 -->
                <line id="scene1-line2" class="scene1-line" x1="400" y1="110" x2="210" y2="110"/>
                <!-- 连线3: 第二层中点到有种子 -->
                <line id="scene1-line3" class="scene1-line" x1="400" y1="110" x2="590" y2="110"/>
                <!-- 连线4: 无种子到第三层中点 -->
                <line id="scene1-line4" class="scene1-line" x1="210" y1="140" x2="210" y2="190"/>
                <!-- 连线5: 第三层中点到无茎叶 -->
                <line id="scene1-line5" class="scene1-line" x1="210" y1="190" x2="130" y2="190"/>
                <!-- 连线6: 第三层中点到有茎叶 -->
                <line id="scene1-line6" class="scene1-line" x1="210" y1="190" x2="290" y2="190"/>
                <!-- 连线7: 有茎叶到第四层中点 -->
                <line id="scene1-line7" class="scene1-line" x1="290" y1="220" x2="290" y2="270"/>
                <!-- 连线8: 第四层中点到有输导组织 -->
                <line id="scene1-line8" class="scene1-line" x1="290" y1="270" x2="240" y2="270"/>
                <!-- 连线9: 第四层中点到无输导组织 -->
                <line id="scene1-line9" class="scene1-line" x1="290" y1="270" x2="380" y2="270"/>
            </g>

            <!-- 节点框层 -->
            <g id="scene1-nodes">
                <!-- 无果实植物框 -->
                <rect id="scene1-node-root" class="scene1-node-box" x="320" y="30" width="160" height="30"/>
                <!-- 无种子框 -->
                <rect id="scene1-node-no-seed" class="scene1-node-box" x="160" y="110" width="100" height="30"/>
                <!-- 有种子框 -->
                <rect id="scene1-node-has-seed" class="scene1-node-box" x="540" y="110" width="100" height="30"/>
                <!-- 无茎叶框 -->
                <rect id="scene1-node-no-leaf" class="scene1-node-box" x="80" y="190" width="100" height="30"/>
                <!-- 有茎叶框 -->
                <rect id="scene1-node-has-leaf" class="scene1-node-box" x="240" y="190" width="100" height="30"/>
                <!-- 有输导组织框 -->
                <rect id="scene1-node-has-vascular" class="scene1-node-box" x="180" y="270" width="120" height="30"/>
                <!-- 无输导组织框 -->
                <rect id="scene1-node-no-vascular" class="scene1-node-box" x="320" y="270" width="120" height="30"/>
                <!-- 终端①框 -->
                <rect id="scene1-term-1" class="scene1-terminal-box" x="560" y="350" width="80" height="30"/>
                <!-- 终端②框 -->
                <rect id="scene1-term-2" class="scene1-terminal-box" x="80" y="350" width="80" height="30"/>
                <!-- 终端③框 -->
                <rect id="scene1-term-3" class="scene1-terminal-box" x="200" y="350" width="80" height="30"/>
                <!-- 终端④框 -->
                <rect id="scene1-term-4" class="scene1-terminal-box" x="340" y="350" width="80" height="30"/>
            </g>

            <!-- 标签层 -->
            <g id="scene1-labels">
                <!-- 节点标签 -->
                <text id="scene1-label-root" class="scene1-label" x="400" y="45">无果实植物</text>
                <text id="scene1-label-no-seed" class="scene1-label" x="210" y="125">无种子</text>
                <text id="scene1-label-has-seed" class="scene1-label" x="590" y="125">有种子</text>
                <text id="scene1-label-no-leaf" class="scene1-label" x="130" y="205">无茎叶</text>
                <text id="scene1-label-has-leaf" class="scene1-label" x="290" y="205">有茎叶</text>
                <text id="scene1-label-has-vascular" class="scene1-label" x="240" y="285">有输导组织</text>
                <text id="scene1-label-no-vascular" class="scene1-label" x="380" y="285">无输导组织</text>
                <!-- 终端编号标签 -->
                <text id="scene1-num-1" class="scene1-number-label" x="600" y="365">①</text>
                <text id="scene1-num-2" class="scene1-number-label" x="120" y="365">②</text>
                <text id="scene1-num-3" class="scene1-number-label" x="240" y="365">③</text>
                <text id="scene1-num-4" class="scene1-number-label" x="380" y="365">④</text>
                <!-- 终端类群名称（初始隐藏） -->
                <text id="scene1-name-1" class="scene1-label" x="600" y="365" opacity="0">裸子植物</text>
                <text id="scene1-name-2" class="scene1-label" x="120" y="365" opacity="0">藻类植物</text>
                <text id="scene1-name-3" class="scene1-label" x="240" y="365" opacity="0">蕨类植物</text>
                <text id="scene1-name-4" class="scene1-label" x="380" y="365" opacity="0">苔藓植物</text>
            </g>

            <!-- 右侧特征框区域 -->
            <g id="scene1-features">
                <!-- 特征框背景 -->
                <rect id="scene1-feature-bg" class="scene1-feature-box" x="660" y="200" width="120" height="180" opacity="0"/>
                <!-- 特征文本 -->
                <text id="scene1-feature-1" class="scene1-feature-text" x="720" y="230" opacity="0">①裸子植物：</text>
                <text id="scene1-feature-1-detail" class="scene1-feature-text" x="720" y="255" opacity="0">有种子繁殖，</text>
                <text id="scene1-feature-1-detail2" class="scene1-feature-text" x="720" y="280" opacity="0">适应干旱陆地</text>
                
                <text id="scene1-feature-2" class="scene1-feature-text" x="720" y="230" opacity="0">②藻类植物：</text>
                <text id="scene1-feature-2-detail" class="scene1-feature-text" x="720" y="255" opacity="0">无根茎叶分化，</text>
                <text id="scene1-feature-2-detail2" class="scene1-feature-text" x="720" y="280" opacity="0">主要生活在水中</text>
                
                <text id="scene1-feature-4" class="scene1-feature-text" x="720" y="230" opacity="0">④苔藓植物：</text>
                <text id="scene1-feature-4-detail" class="scene1-feature-text" x="720" y="255" opacity="0">有茎叶但无输导，</text>
                <text id="scene1-feature-4-detail2" class="scene1-feature-text" x="720" y="280" opacity="0">无真正的根</text>
                
                <text id="scene1-feature-3" class="scene1-feature-text" x="720" y="230" opacity="0">③蕨类植物：</text>
                <text id="scene1-feature-3-detail" class="scene1-feature-text" x="720" y="255" opacity="0">有根茎叶分化，</text>
                <text id="scene1-feature-3-detail2" class="scene1-feature-text" x="720" y="280" opacity="0">有输导组织</text>
                
                <!-- 结论步骤的完整特征总结 -->
                <text id="scene1-feature-summary" class="scene1-feature-text" x="720" y="230" opacity="0">分类总结：</text>
                <text id="scene1-feature-summary-1" class="scene1-feature-text" x="720" y="255" opacity="0">①裸子植物：有种子</text>
                <text id="scene1-feature-summary-2" class="scene1-feature-text" x="720" y="280" opacity="0">②藻类植物：无茎叶</text>
                <text id="scene1-feature-summary-3" class="scene1-feature-text" x="720" y="305" opacity="0">③蕨类植物：有输导</text>
                <text id="scene1-feature-summary-4" class="scene1-feature-text" x="720" y="330" opacity="0">④苔藓植物：无输导</text>
            </g>
        </svg>

        <div id="scene1-step-indicator">步骤 1/5</div>
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn">◀ 上一步</button>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1: 植物类群分类图解
        // 布局坐标表（供参考）：
        // | 元素 | 类型 | 位置/范围 | 大小 |
        // | 无果实植物框 | rect | (320,30)-(480,60) | 160×30 |
        // | 无种子框 | rect | (160,110)-(260,140) | 100×30 |
        // | 有种子框 | rect | (540,110)-(640,140) | 100×30 |
        // | 无茎叶框 | rect | (80,190)-(180,220) | 100×30 |
        // | 有茎叶框 | rect | (240,190)-(340,220) | 100×30 |
        // | 有输导组织框 | rect | (180,270)-(300,300) | 120×30 |
        // | 无输导组织框 | rect | (320,270)-(440,300) | 120×30 |
        // | 终端①框 | rect | (560,350)-(640,380) | 80×30 |
        // | 终端②框 | rect | (80,350)-(160,380) | 80×30 |
        // | 终端③框 | rect | (200,350)-(280,380) | 80×30 |
        // | 终端④框 | rect | (340,350)-(420,380) | 80×30 |

        const MAX_STEP = 5;
        let currentStep = 0;

        // 步骤定义：每个步骤的高亮路径和特征显示
        const stepDefinitions = {
            0: {
                // 初始状态：无高亮
                highlightLines: [],
                highlightNodes: [],
                highlightTerminals: [],
                showFeatures: [],
                showSummary: false
            },
            1: {
                // 步骤1：高亮有种子分支 → ①裸子植物
                highlightLines: ['scene1-line1', 'scene1-line3'],
                highlightNodes: ['scene1-node-root', 'scene1-node-has-seed'],
                highlightTerminals: ['scene1-term-1'],
                showFeatures: ['scene1-feature-1', 'scene1-feature-1-detail', 'scene1-feature-1-detail2'],
                showSummary: false
            },
            2: {
                // 步骤2：高亮无种子→无茎叶分支 → ②藻类植物
                highlightLines: ['scene1-line1', 'scene1-line2', 'scene1-line4', 'scene1-line5'],
                highlightNodes: ['scene1-node-root', 'scene1-node-no-seed', 'scene1-node-no-leaf'],
                highlightTerminals: ['scene1-term-2'],
                showFeatures: ['scene1-feature-2', 'scene1-feature-2-detail', 'scene1-feature-2-detail2'],
                showSummary: false
            },
            3: {
                // 步骤3：高亮无种子→有茎叶→无输导分支 → ④苔藓植物
                highlightLines: ['scene1-line1', 'scene1-line2', 'scene1-line4', 'scene1-line6', 'scene1-line7', 'scene1-line9'],
                highlightNodes: ['scene1-node-root', 'scene1-node-no-seed', 'scene1-node-has-leaf', 'scene1-node-no-vascular'],
                highlightTerminals: ['scene1-term-4'],
                showFeatures: ['scene1-feature-4', 'scene1-feature-4-detail', 'scene1-feature-4-detail2'],
                showSummary: false
            },
            4: {
                // 步骤4：高亮无种子→有茎叶→有输导分支 → ③蕨类植物
                highlightLines: ['scene1-line1', 'scene1-line2', 'scene1-line4', 'scene1-line6', 'scene1-line7', 'scene1-line8'],
                highlightNodes: ['scene1-node-root', 'scene1-node-no-seed', 'scene1-node-has-leaf', 'scene1-node-has-vascular'],
                highlightTerminals: ['scene1-term-3'],
                showFeatures: ['scene1-feature-3', 'scene1-feature-3-detail', 'scene1-feature-3-detail2'],
                showSummary: false
            },
            5: {
                // 步骤5：结论 - 所有终端显示，显示完整总结
                highlightLines: [],
                highlightNodes: [],
                highlightTerminals: ['scene1-term-1', 'scene1-term-2', 'scene1-term-3', 'scene1-term-4'],
                showFeatures: [],
                showSummary: true
            }
        };

        // 工具函数：显示元素
        function show(elId) {
            const el = document.getElementById(elId);
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '1';
                el.setAttribute('opacity', '1');
            }
        }

        // 工具函数：隐藏元素
        function hide(elId) {
            const el = document.getElementById(elId);
            if (el) {
                el.style.display = 'none';
                el.style.opacity = '0';
                el.setAttribute('opacity', '0');
            }
        }

        // 工具函数：添加高亮类
        function addHighlight(elId, highlightClass) {
            const el = document.getElementById(elId);
            if (el) {
                el.classList.add(highlightClass);
            }
        }

        // 工具函数：移除高亮类
        function removeHighlight(elId, highlightClass) {
            const el = document.getElementById(elId);
            if (el) {
                el.classList.remove(highlightClass);
            }
        }

        // 渲染当前步骤
        function renderStep() {
            const def = stepDefinitions[currentStep];

            // 清除所有高亮
            const allLines = ['scene1-line1', 'scene1-line2', 'scene1-line3', 'scene1-line4', 
                             'scene1-line5', 'scene1-line6', 'scene1-line7', 'scene1-line8', 'scene1-line9'];
            const allNodes = ['scene1-node-root', 'scene1-node-no-seed', 'scene1-node-has-seed',
                             'scene1-node-no-leaf', 'scene1-node-has-leaf', 'scene1-node-has-vascular',
                             'scene1-node-no-vascular'];
            const allTerms = ['scene1-term-1', 'scene1-term-2', 'scene1-term-3', 'scene1-term-4'];

            allLines.forEach(id => removeHighlight(id, 'highlight-blue'));
            allNodes.forEach(id => removeHighlight(id, 'highlight-blue'));
            allTerms.forEach(id => removeHighlight(id, 'highlight-green'));

            // 隐藏所有特征文本
            const allFeatureTexts = [
                'scene1-feature-1', 'scene1-feature-1-detail', 'scene1-feature-1-detail2',
                'scene1-feature-2', 'scene1-feature-2-detail', 'scene1-feature-2-detail2',
                'scene1-feature-4', 'scene1-feature-4-detail', 'scene1-feature-4-detail2',
                'scene1-feature-3', 'scene1-feature-3-detail', 'scene1-feature-3-detail2',
                'scene1-feature-summary', 'scene1-feature-summary-1', 'scene1-feature-summary-2',
                'scene1-feature-summary-3', 'scene1-feature-summary-4'
            ];
            allFeatureTexts.forEach(id => hide(id));
            hide('scene1-feature-bg');

            // 隐藏所有终端名称
            hide('scene1-name-1');
            hide('scene1-name-2');
            hide('scene1-name-3');
            hide('scene1-name-4');

            // 应用当前步骤的高亮
            def.highlightLines.forEach(id => addHighlight(id, 'highlight-blue'));
            def.highlightNodes.forEach(id => addHighlight(id, 'highlight-blue'));
            def.highlightTerminals.forEach(id => addHighlight(id, 'highlight-green'));

            // 显示特征文本
            if (def.showSummary) {
                // 结论步骤：显示完整总结
                show('scene1-feature-bg');
                show('scene1-feature-summary');
                show('scene1-feature-summary-1');
                show('scene1-feature-summary-2');
                show('scene1-feature-summary-3');
                show('scene1-feature-summary-4');
                // 显示所有终端名称
                show('scene1-name-1');
                show('scene1-name-2');
                show('scene1-name-3');
                show('scene1-name-4');
            } else {
                // 普通步骤：显示对应特征
                def.showFeatures.forEach(id => show(id));
                // 显示当前终端名称
                if (def.highlightTerminals.length > 0) {
                    const termNum = def.highlightTerminals[0].replace('scene1-term-', '');
                    show('scene1-name-' + termNum);
                }
            }

            // 更新步骤指示器
            const indicator = document.getElementById('scene1-step-indicator');
            if (indicator) {
                indicator.textContent = '步骤 ' + (currentStep + 1) + '/' + MAX_STEP;
            }

            // 更新按钮状态
            const prevBtn = document.getElementById('scene1-btn-prev');
            const nextBtn = document.getElementById('scene1-btn-next');
            if (prevBtn) prevBtn.disabled = (currentStep === 0);
            if (nextBtn) nextBtn.disabled = (currentStep === MAX_STEP);
        }

        // 初始化
        function init() {
            renderStep();

            // 绑定按钮事件
            document.getElementById('scene1-btn-prev').addEventListener('click', function() {
                if (currentStep > 0) {
                    currentStep--;
                    renderStep();
                }
            });

            document.getElementById('scene1-btn-next').addEventListener('click', function() {
                if (currentStep < MAX_STEP) {
                    currentStep++;
                    renderStep();
                }
            });
        }

        // 页面加载完成后初始化
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>
</body>
</html>
