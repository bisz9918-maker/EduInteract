<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>呼吸实验装置 - 场景 1</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 20px; z-index: 10; }
        #scene1-controls button { padding: 10px 20px; font-size: 14px; cursor: pointer; border: 2px solid #333; border-radius: 6px; background: #f5f5f5; transition: all 0.2s; }
        #scene1-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene1-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 14px; font-weight: bold; color: #333; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义 -->
            <defs>
                <marker id="arrowhead-inhale" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0"/>
                </marker>
                <marker id="arrowhead-exhale" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#c62828"/>
                </marker>
            </defs>

            <!-- 顶部水平管 -->
            <rect id="scene1-horiz-pipe" x="80" y="80" width="640" height="20" fill="#ffffff" stroke="#000000" stroke-width="2"/>

            <!-- 呼吸口 M -->
            <line id="scene1-mouth-m" x1="400" y1="80" x2="400" y2="120" stroke="#000000" stroke-width="3"/>

            <!-- 夹子 X -->
            <g id="scene1-clip-x-group">
                <rect id="scene1-clip-x" x="225" y="50" width="30" height="20" fill="#888888" rx="3"/>
                <text id="scene1-label-clip-x" x="240" y="40" text-anchor="middle" font-size="14" fill="#000000">夹子 X</text>
            </g>

            <!-- 夹子 Y -->
            <g id="scene1-clip-y-group">
                <rect id="scene1-clip-y" x="545" y="50" width="30" height="20" fill="#888888" rx="3"/>
                <text id="scene1-label-clip-y" x="560" y="40" text-anchor="middle" font-size="14" fill="#000000">夹子 Y</text>
            </g>

            <!-- M 标签 -->
            <text id="scene1-label-m" x="400" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">M</text>

            <!-- 试管 1 轮廓 -->
            <path id="scene1-testtube1" d="M 120 150 L 120 330 Q 120 350 140 350 Q 160 350 160 330 L 160 150" fill="none" stroke="#000000" stroke-width="2"/>

            <!-- 试管 2 轮廓 -->
            <path id="scene1-testtube2" d="M 640 150 L 640 330 Q 640 350 660 350 Q 680 350 680 330 L 680 150" fill="none" stroke="#000000" stroke-width="2"/>

            <!-- 试管 1 塞子 -->
            <rect x="118" y="145" width="44" height="15" fill="#d4a017" stroke="#000000" stroke-width="1"/>

            <!-- 试管 2 塞子 -->
            <rect x="638" y="145" width="44" height="15" fill="#d4a017" stroke="#000000" stroke-width="1"/>

            <!-- 试管 1 长导管 -->
            <line id="scene1-tube1-long" x1="130" y1="160" x2="130" y2="240" stroke="#000000" stroke-width="2"/>

            <!-- 试管 1 短导管 -->
            <line id="scene1-tube1-short" x1="150" y1="160" x2="150" y2="190" stroke="#000000" stroke-width="2"/>

            <!-- 试管 2 长导管 -->
            <line id="scene1-tube2-long" x1="650" y1="160" x2="650" y2="240" stroke="#000000" stroke-width="2"/>

            <!-- 试管 2 短导管 -->
            <line id="scene1-tube2-short" x1="670" y1="160" x2="670" y2="190" stroke="#000000" stroke-width="2"/>

            <!-- 试管 1 液体（石灰水） -->
            <rect id="scene1-liquid1" x="122" y="220" width="36" height="110" fill="#b3d9ff" fill-opacity="0.3" stroke="#000000" stroke-width="1"/>

            <!-- 试管 2 液体（石灰水） -->
            <rect id="scene1-liquid2" x="642" y="220" width="36" height="110" fill="#b3d9ff" fill-opacity="0.3" stroke="#000000" stroke-width="1"/>

            <!-- 石灰水标签 -->
            <text id="scene1-label-liquid" x="400" y="270" text-anchor="middle" font-size="14" fill="#000000">石灰水</text>
            <line x1="160" y1="270" x2="380" y2="270" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
            <line x1="640" y1="270" x2="420" y2="270" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>

            <!-- 试管 1 标签 -->
            <text id="scene1-label-tube1" x="140" y="380" text-anchor="middle" font-size="14" fill="#000000">试管 1</text>

            <!-- 试管 2 标签 -->
            <text id="scene1-label-tube2" x="660" y="380" text-anchor="middle" font-size="14" fill="#000000">试管 2</text>

            <!-- 吸气箭头组（步骤 1 显示） -->
            <g id="scene1-arrow-inhale" style="display: none;">
                <!-- 外界空气进入 -->
                <line x1="40" y1="90" x2="115" y2="90" stroke="#1565c0" stroke-width="3" marker-end="url(#arrowhead-inhale)"/>
                <!-- 试管 1 向下 -->
                <line x1="130" y1="160" x2="130" y2="220" stroke="#1565c0" stroke-width="3" marker-end="url(#arrowhead-inhale)"/>
                <!-- 试管 1 向上 -->
                <line x1="150" y1="190" x2="150" y2="160" stroke="#1565c0" stroke-width="3" marker-end="url(#arrowhead-inhale)"/>
                <!-- 水平向右到 M -->
                <line x1="160" y1="90" x2="395" y2="90" stroke="#1565c0" stroke-width="3" marker-end="url(#arrowhead-inhale)"/>
                <!-- 吸气标签 -->
                <text id="scene1-label-inhale" x="200" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565c0">吸气</text>
            </g>

            <!-- 呼气箭头组（步骤 2 显示） -->
            <g id="scene1-arrow-exhale" style="display: none;">
                <!-- M 到水平管右侧 -->
                <line x1="405" y1="90" x2="635" y2="90" stroke="#c62828" stroke-width="3" marker-end="url(#arrowhead-exhale)"/>
                <!-- 试管 2 向下 -->
                <line x1="650" y1="160" x2="650" y2="220" stroke="#c62828" stroke-width="3" marker-end="url(#arrowhead-exhale)"/>
                <!-- 试管 2 向上 -->
                <line x1="670" y1="190" x2="670" y2="160" stroke="#c62828" stroke-width="3" marker-end="url(#arrowhead-exhale)"/>
                <!-- 右侧出气 -->
                <line x1="685" y1="90" x2="760" y2="90" stroke="#c62828" stroke-width="3" marker-end="url(#arrowhead-exhale)"/>
                <!-- 呼气标签 -->
                <text id="scene1-label-exhale" x="600" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#c62828">呼气</text>
            </g>

            <!-- 试管 1 浑浊层（步骤 3 显示） -->
            <rect id="scene1-liquid1-turbid" x="122" y="220" width="36" height="110" fill="#e8e8e8" fill-opacity="0" stroke="none" style="display: none;"/>

            <!-- 试管 2 浑浊层（步骤 3 显示） -->
            <rect id="scene1-liquid2-turbid" x="642" y="220" width="36" height="110" fill="#e8e8e8" fill-opacity="0.6" stroke="none" style="display: none;"/>

            <!-- 澄清标签（步骤 3 显示）- 调整 y 坐标到 400，与试管 1 标签错开 20px -->
            <text id="scene1-label-clear" x="140" y="400" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e7d32" style="display: none;">澄清</text>

            <!-- 浑浊标签（步骤 3 显示）- 调整 y 坐标到 400，与试管 2 标签错开 20px -->
            <text id="scene1-label-turbid" x="660" y="400" text-anchor="middle" font-size="14" font-weight="bold" fill="#c62828" style="display: none;">浑浊</text>
        </svg>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-prev-btn" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/4</span>
            <button id="scene1-next-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // 场景 1：呼吸实验装置
        // 布局坐标表（参考）：
        // | 元素 | 位置 | 备注 |
        // | 试管 1 | (120,150)-(160,350) | 左侧试管 |
        // | 试管 2 | (640,150)-(680,350) | 右侧试管 |
        // | 顶部水平管 | (80,80)-(720,100) | 连接两试管 |
        // | 呼吸口 M | (400,80)-(400,120) | 中央开口 |
        // | 夹子 X | (225,50) | 左侧夹子 |
        // | 夹子 Y | (545,50) | 右侧夹子 |
        // | 试管 1 液体 | (122,220)-(158,330) | 石灰水 |
        // | 试管 2 液体 | (642,220)-(678,330) | 石灰水 |

        const TOTAL_STEPS = 4;
        let currentStep = 0;

        // 获取 DOM 元素
        const els = {
            clipX: document.getElementById('scene1-clip-x'),
            clipY: document.getElementById('scene1-clip-y'),
            liquid1: document.getElementById('scene1-liquid1'),
            liquid2: document.getElementById('scene1-liquid2'),
            liquid1Turbid: document.getElementById('scene1-liquid1-turbid'),
            liquid2Turbid: document.getElementById('scene1-liquid2-turbid'),
            arrowInhale: document.getElementById('scene1-arrow-inhale'),
            arrowExhale: document.getElementById('scene1-arrow-exhale'),
            labelInhale: document.getElementById('scene1-label-inhale'),
            labelExhale: document.getElementById('scene1-label-exhale'),
            labelClear: document.getElementById('scene1-label-clear'),
            labelTurbid: document.getElementById('scene1-label-turbid'),
            prevBtn: document.getElementById('scene1-prev-btn'),
            nextBtn: document.getElementById('scene1-next-btn'),
            stepIndicator: document.getElementById('scene1-step-indicator')
        };

        // 工具函数：显示元素
        function show(el) {
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }

        // 工具函数：隐藏元素
        function hide(el) {
            if (el) {
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }

        // 更新步骤显示
        function updateStep() {
            // 重置所有动态元素
            hide(els.arrowInhale);
            hide(els.arrowExhale);
            hide(els.labelInhale);
            hide(els.labelExhale);
            hide(els.labelClear);
            hide(els.labelTurbid);
            hide(els.liquid1Turbid);
            hide(els.liquid2Turbid);

            // 重置夹子状态
            els.clipX.style.fill = '#888888';
            els.clipY.style.fill = '#888888';

            // 重置液体状态
            els.liquid1.style.fill = '#b3d9ff';
            els.liquid1.style.fillOpacity = '0.3';
            els.liquid2.style.fill = '#b3d9ff';
            els.liquid2.style.fillOpacity = '0.3';

            switch(currentStep) {
                case 0: // 初始状态
                    els.stepIndicator.textContent = '步骤 1/4';
                    els.prevBtn.disabled = true;
                    els.nextBtn.disabled = false;
                    break;

                case 1: // 吸气过程
                    els.stepIndicator.textContent = '步骤 2/4';
                    els.prevBtn.disabled = false;
                    els.nextBtn.disabled = false;
                    show(els.arrowInhale);
                    els.clipX.style.fill = '#2e7d32'; // 夹子 X 开启（绿色）
                    break;

                case 2: // 呼气过程
                    els.stepIndicator.textContent = '步骤 3/4';
                    els.prevBtn.disabled = false;
                    els.nextBtn.disabled = false;
                    show(els.arrowExhale);
                    els.clipY.style.fill = '#2e7d32'; // 夹子 Y 开启（绿色）
                    break;

                case 3: // 实验现象
                    els.stepIndicator.textContent = '步骤 4/4';
                    els.prevBtn.disabled = false;
                    els.nextBtn.disabled = true;
                    show(els.liquid2Turbid);
                    show(els.labelClear);
                    show(els.labelTurbid);
                    break;
            }
        }

        // 事件绑定
        els.prevBtn.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });

        els.nextBtn.addEventListener('click', function() {
            if (currentStep < TOTAL_STEPS - 1) {
                currentStep++;
                updateStep();
            }
        });

        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
