<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地表三圈环流剖面图 - Scene 1</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Microsoft YaHei', sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene1-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 2px solid #1565c0; border-radius: 4px; background: #fff; color: #1565c0; }
        .scene1-btn:hover { background: #e3f2fd; }
        .scene1-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-step-indicator { position: absolute; bottom: 55px; left: 50%; transform: translateX(-50%); font-size: 16px; font-weight: bold; color: #1565c0; }
        .element-hidden { opacity: 0; }
        .element-visible { opacity: 1; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- 箭头标记定义 -->
                <marker id="arrowhead-low" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0" />
                </marker>
                <marker id="arrowhead-wind" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32" />
                </marker>
            </defs>

            <!-- 地球表面弧线：从赤道到北极的缓坡曲线 -->
            <path id="scene1-arc-earth" class="element-visible" d="M 50 380 Q 400 340 750 310" fill="none" stroke="#000000" stroke-width="3" />

            <!-- 纬度辅助线（虚线） -->
            <line id="scene1-line-0" class="element-visible" x1="50" y1="380" x2="50" y2="450" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" />
            <line id="scene1-line-30" class="element-visible" x1="270" y1="365" x2="270" y2="450" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" />
            <line id="scene1-line-60" class="element-visible" x1="520" y1="345" x2="520" y2="450" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" />
            <line id="scene1-line-90" class="element-visible" x1="750" y1="310" x2="750" y2="450" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" />

            <!-- 气压带位置点（实心圆） -->
            <circle id="scene1-point-A" class="element-visible" cx="50" cy="380" r="6" fill="#c62828" />
            <circle id="scene1-point-C" class="element-visible" cx="270" cy="365" r="6" fill="#c62828" />
            <circle id="scene1-point-E" class="element-visible" cx="520" cy="345" r="6" fill="#c62828" />
            <circle id="scene1-point-N" class="element-visible" cx="750" cy="310" r="6" fill="#c62828" />

            <!-- 纬度标注 -->
            <text id="scene1-label-lat-0" class="element-visible" x="35" y="460" font-size="14" fill="#000000">0°</text>
            <text id="scene1-label-lat-30" class="element-visible" x="255" y="460" font-size="14" fill="#000000">30°N</text>
            <text id="scene1-label-lat-60" class="element-visible" x="505" y="460" font-size="14" fill="#000000">60°N</text>
            <text id="scene1-label-lat-90" class="element-visible" x="735" y="460" font-size="14" fill="#000000">90°N</text>

            <!-- 气压带标签（步骤 1 显示）- E 向右移动远离环流圈 -->
            <text id="scene1-label-A" class="element-hidden" x="30" y="405" font-size="14" fill="#000000">A</text>
            <text id="scene1-label-C" class="element-hidden" x="280" y="390" font-size="14" fill="#000000">C</text>
            <text id="scene1-label-E" class="element-hidden" x="700" y="370" font-size="14" fill="#000000">E</text>
            <text id="scene1-label-N" class="element-hidden" x="760" y="330" font-size="14" fill="#000000">N</text>

            <!-- 风带箭头（步骤 2 显示）- 在地球表面上方 -->
            <line id="scene1-wind-B" class="element-hidden" x1="150" y1="365" x2="220" y2="360" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrowhead-wind)" />
            <line id="scene1-wind-D" class="element-hidden" x1="350" y1="340" x2="450" y2="330" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrowhead-wind)" />
            <line id="scene1-wind-F" class="element-hidden" x1="600" y1="315" x2="700" y2="307" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrowhead-wind)" />

            <!-- 风带标签（步骤 2 显示）- 放在地球表面下方，避免与环流圈重叠 -->
            <text id="scene1-label-wind-B" class="element-hidden" x="150" y="410" font-size="14" fill="#2e7d32">B</text>
            <text id="scene1-label-wind-D" class="element-hidden" x="380" y="385" font-size="14" fill="#2e7d32">D</text>
            <text id="scene1-label-wind-F" class="element-hidden" x="620" y="360" font-size="14" fill="#2e7d32">F</text>

            <!-- 环流圈（步骤 3 显示）- 向上移动远离所有标签，缩小尺寸 -->
            <!-- 低纬环流圈：0°-30°，顺时针 -->
            <path id="scene1-loop-low" class="element-hidden" d="M 100 260 Q 120 140 150 90 Q 180 40 210 90 Q 240 140 250 235 Q 240 260 210 263 Q 180 267 150 263 Q 120 260 100 260 Z" fill="none" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowhead-low)" />
            <!-- 中纬环流圈：30°-60°，逆时针 -->
            <path id="scene1-loop-mid" class="element-hidden" d="M 300 240 Q 320 120 350 70 Q 380 20 410 70 Q 440 120 460 215 Q 450 240 420 243 Q 390 247 360 243 Q 330 240 300 240 Z" fill="none" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowhead-low)" />
            <!-- 高纬环流圈：60°-90°，顺时针 -->
            <path id="scene1-loop-high" class="element-hidden" d="M 550 215 Q 570 95 600 45 Q 630 -5 660 45 Q 690 95 710 190 Q 700 215 670 218 Q 640 222 610 218 Q 580 215 550 215 Z" fill="none" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowhead-low)" />

            <!-- 成因标注（步骤 4 显示）- 放在更下方，避免与按钮重叠 -->
            <text id="scene1-label-thermal" class="element-hidden" x="70" y="485" font-size="14" fill="#c62828" font-weight="bold">热力成因</text>
            <text id="scene1-label-dynamic" class="element-hidden" x="380" y="485" font-size="14" fill="#2e7d32" font-weight="bold">动力成因</text>
        </svg>

        <div id="scene1-step-indicator">步骤 1/5</div>
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn">◀ 上一步</button>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1: 地表三圈环流剖面图
        // 布局坐标表对照：
        // | 元素 | 位置 | 备注 |
        // | 地球表面弧线 | (50,380)-(750,310) | 贝塞尔曲线 |
        // | 纬度辅助线 | x=50,270,520,750 | 虚线 |
        // | 点 A | (50,380) | 赤道 |
        // | 点 C | (270,365) | 30° |
        // | 点 E | (520,345) | 60° |
        // | 点 N | (750,310) | 90°北极 |
        // | 风带 B | (150,365)-(220,360) | 东北信风 |
        // | 风带 D | (350,340)-(450,330) | 盛行西风 |
        // | 风带 F | (600,315)-(700,307) | 极地东风 |

        const TOTAL_STEPS = 5;
        let currentStep = 0;

        // 元素分组：按步骤显示
        const stepElements = {
            0: {
                visible: [
                    'scene1-arc-earth',
                    'scene1-line-0', 'scene1-line-30', 'scene1-line-60', 'scene1-line-90',
                    'scene1-point-A', 'scene1-point-C', 'scene1-point-E', 'scene1-point-N',
                    'scene1-label-lat-0', 'scene1-label-lat-30', 'scene1-label-lat-60', 'scene1-label-lat-90'
                ],
                hidden: [
                    'scene1-label-A', 'scene1-label-C', 'scene1-label-E', 'scene1-label-N',
                    'scene1-wind-B', 'scene1-wind-D', 'scene1-wind-F',
                    'scene1-label-wind-B', 'scene1-label-wind-D', 'scene1-label-wind-F',
                    'scene1-loop-low', 'scene1-loop-mid', 'scene1-loop-high',
                    'scene1-label-thermal', 'scene1-label-dynamic'
                ]
            },
            1: {
                visible: [
                    'scene1-arc-earth',
                    'scene1-line-0', 'scene1-line-30', 'scene1-line-60', 'scene1-line-90',
                    'scene1-point-A', 'scene1-point-C', 'scene1-point-E', 'scene1-point-N',
                    'scene1-label-lat-0', 'scene1-label-lat-30', 'scene1-label-lat-60', 'scene1-label-lat-90',
                    'scene1-label-A', 'scene1-label-C', 'scene1-label-E', 'scene1-label-N'
                ],
                hidden: [
                    'scene1-wind-B', 'scene1-wind-D', 'scene1-wind-F',
                    'scene1-label-wind-B', 'scene1-label-wind-D', 'scene1-label-wind-F',
                    'scene1-loop-low', 'scene1-loop-mid', 'scene1-loop-high',
                    'scene1-label-thermal', 'scene1-label-dynamic'
                ]
            },
            2: {
                visible: [
                    'scene1-arc-earth',
                    'scene1-line-0', 'scene1-line-30', 'scene1-line-60', 'scene1-line-90',
                    'scene1-point-A', 'scene1-point-C', 'scene1-point-E', 'scene1-point-N',
                    'scene1-label-lat-0', 'scene1-label-lat-30', 'scene1-label-lat-60', 'scene1-label-lat-90',
                    'scene1-label-A', 'scene1-label-C', 'scene1-label-E', 'scene1-label-N',
                    'scene1-wind-B', 'scene1-wind-D', 'scene1-wind-F',
                    'scene1-label-wind-B', 'scene1-label-wind-D', 'scene1-label-wind-F'
                ],
                hidden: [
                    'scene1-loop-low', 'scene1-loop-mid', 'scene1-loop-high',
                    'scene1-label-thermal', 'scene1-label-dynamic'
                ]
            },
            3: {
                visible: [
                    'scene1-arc-earth',
                    'scene1-line-0', 'scene1-line-30', 'scene1-line-60', 'scene1-line-90',
                    'scene1-point-A', 'scene1-point-C', 'scene1-point-E', 'scene1-point-N',
                    'scene1-label-lat-0', 'scene1-label-lat-30', 'scene1-label-lat-60', 'scene1-label-lat-90',
                    'scene1-label-A', 'scene1-label-C', 'scene1-label-E', 'scene1-label-N',
                    'scene1-wind-B', 'scene1-wind-D', 'scene1-wind-F',
                    'scene1-label-wind-B', 'scene1-label-wind-D', 'scene1-label-wind-F',
                    'scene1-loop-low', 'scene1-loop-mid', 'scene1-loop-high'
                ],
                hidden: [
                    'scene1-label-thermal', 'scene1-label-dynamic'
                ]
            },
            4: {
                visible: [
                    'scene1-arc-earth',
                    'scene1-line-0', 'scene1-line-30', 'scene1-line-60', 'scene1-line-90',
                    'scene1-point-A', 'scene1-point-C', 'scene1-point-E', 'scene1-point-N',
                    'scene1-label-lat-0', 'scene1-label-lat-30', 'scene1-label-lat-60', 'scene1-label-lat-90',
                    'scene1-label-A', 'scene1-label-C', 'scene1-label-E', 'scene1-label-N',
                    'scene1-wind-B', 'scene1-wind-D', 'scene1-wind-F',
                    'scene1-label-wind-B', 'scene1-label-wind-D', 'scene1-label-wind-F',
                    'scene1-loop-low', 'scene1-loop-mid', 'scene1-loop-high',
                    'scene1-label-thermal', 'scene1-label-dynamic'
                ],
                hidden: []
            }
        };

        // 步骤描述
        const stepDescriptions = [
            '基础框架',
            '标注气压带',
            '标注风带及风向',
            '环流圈高亮',
            '成因标注'
        ];

        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('element-hidden');
                el.classList.add('element-visible');
                el.style.opacity = '1';
            }
        }

        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('element-visible');
                el.classList.add('element-hidden');
                el.style.opacity = '0';
            }
        }

        function updateScene() {
            const elements = stepElements[currentStep];

            // 先隐藏所有元素
            Object.values(stepElements).forEach(step => {
                step.visible.forEach(id => hideElement(id));
                step.hidden.forEach(id => hideElement(id));
            });

            // 再显示当前步骤的元素
            elements.visible.forEach(showElement);

            // 更新步骤指示器
            document.getElementById('scene1-step-indicator').textContent = `步骤 ${currentStep + 1}/${TOTAL_STEPS} - ${stepDescriptions[currentStep]}`;

            // 更新按钮状态
            document.getElementById('scene1-btn-prev').disabled = (currentStep === 0);
            document.getElementById('scene1-btn-next').disabled = (currentStep === TOTAL_STEPS - 1);
        }

        // 初始化
        function init() {
            updateScene();

            document.getElementById('scene1-btn-prev').addEventListener('click', function() {
                if (currentStep > 0) {
                    currentStep--;
                    updateScene();
                }
            });

            document.getElementById('scene1-btn-next').addEventListener('click', function() {
                if (currentStep < TOTAL_STEPS - 1) {
                    currentStep++;
                    updateScene();
                }
            });
        }

        init();
    })();
    </script>
</body>
</html>
