<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>世界经纬网示意图 - 场景 1</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        .scene1-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #333; border-radius: 4px; background: #f5f5f5; }
        .scene1-btn:hover:not(:disabled) { background: #e0e0e0; }
        .scene1-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene1-step-indicator { font-size: 14px; color: #333; }
        svg { display: block; }
        .scene1-meridian, .scene1-parallel { stroke: #000000; stroke-width: 2; fill: none; }
        .scene1-meridian-label, .scene1-parallel-label { font-size: 14px; fill: #000000; }
        .scene1-point { fill: #1565c0; }
        .scene1-point-highlight { fill: #c62828; }
        .scene1-point-label { font-size: 14px; fill: #000000; font-weight: bold; }
        .scene1-point-coord { font-size: 12px; fill: #000000; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500">
            <!-- 经线组 (7 条) -->
            <g id="scene1-meridians">
                <line class="scene1-meridian" x1="80" y1="60" x2="80" y2="440"/>
                <line class="scene1-meridian" x1="186.67" y1="60" x2="186.67" y2="440"/>
                <line class="scene1-meridian" x1="293.33" y1="60" x2="293.33" y2="440"/>
                <line class="scene1-meridian" x1="400" y1="60" x2="400" y2="440"/>
                <line class="scene1-meridian" x1="506.67" y1="60" x2="506.67" y2="440"/>
                <line class="scene1-meridian" x1="613.33" y1="60" x2="613.33" y2="440"/>
                <line class="scene1-meridian" x1="720" y1="60" x2="720" y2="440"/>
            </g>

            <!-- 纬线组 (7 条) -->
            <g id="scene1-parallels">
                <line class="scene1-parallel" x1="80" y1="60" x2="720" y2="60"/>
                <line class="scene1-parallel" x1="80" y1="123.33" x2="720" y2="123.33"/>
                <line class="scene1-parallel" x1="80" y1="186.67" x2="720" y2="186.67"/>
                <line class="scene1-parallel" x1="80" y1="250" x2="720" y2="250"/>
                <line class="scene1-parallel" x1="80" y1="313.33" x2="720" y2="313.33"/>
                <line class="scene1-parallel" x1="80" y1="376.67" x2="720" y2="376.67"/>
                <line class="scene1-parallel" x1="80" y1="440" x2="720" y2="440"/>
            </g>

            <!-- 经度刻度组 (7 个) -->
            <g id="scene1-longitude-labels">
                <text class="scene1-meridian-label" x="70" y="45" text-anchor="middle">180°W</text>
                <text class="scene1-meridian-label" x="176.67" y="45" text-anchor="middle">120°W</text>
                <text class="scene1-meridian-label" x="283.33" y="45" text-anchor="middle">60°W</text>
                <text class="scene1-meridian-label" x="390" y="45" text-anchor="middle">0°</text>
                <text class="scene1-meridian-label" x="496.67" y="45" text-anchor="middle">60°E</text>
                <text class="scene1-meridian-label" x="603.33" y="45" text-anchor="middle">120°E</text>
                <text class="scene1-meridian-label" x="710" y="45" text-anchor="middle">180°E</text>
            </g>

            <!-- 纬度刻度组 (7 个) -->
            <g id="scene1-latitude-labels">
                <text class="scene1-parallel-label" x="65" y="65" text-anchor="end">90°N</text>
                <text class="scene1-parallel-label" x="65" y="128.33" text-anchor="end">60°N</text>
                <text class="scene1-parallel-label" x="65" y="191.67" text-anchor="end">30°N</text>
                <text class="scene1-parallel-label" x="65" y="255" text-anchor="end">0°</text>
                <text class="scene1-parallel-label" x="65" y="318.33" text-anchor="end">30°S</text>
                <text class="scene1-parallel-label" x="65" y="381.67" text-anchor="end">60°S</text>
                <text class="scene1-parallel-label" x="65" y="445" text-anchor="end">90°S</text>
            </g>

            <!-- 点 A 组 (60°W, 30°N) - 标签右上方更远，坐标下方更远 -->
            <g id="scene1-point-group-A" style="display: none;">
                <circle class="scene1-point" id="scene1-point-A" cx="293.33" cy="186.67" r="4"/>
                <text class="scene1-point-label" x="308.33" y="170.67">A</text>
                <text class="scene1-point-coord" x="293.33" y="215" text-anchor="middle">60°W, 30°N</text>
            </g>

            <!-- 点 B 组 (0°, 30°S) - 标签右下方更远，坐标再下移 -->
            <g id="scene1-point-group-B" style="display: none;">
                <circle class="scene1-point" id="scene1-point-B" cx="400" cy="313.33" r="4"/>
                <text class="scene1-point-label" x="418" y="335.33">B</text>
                <text class="scene1-point-coord" x="400" y="350" text-anchor="middle">0°, 30°S</text>
            </g>

            <!-- 点 C 组 (0°, 0°) - 标签左下方更远，坐标再下移 -->
            <g id="scene1-point-group-C" style="display: none;">
                <circle class="scene1-point" id="scene1-point-C" cx="400" cy="250" r="4"/>
                <text class="scene1-point-label" x="382" y="272">C</text>
                <text class="scene1-point-coord" x="400" y="287" text-anchor="middle">0°, 0°</text>
            </g>

            <!-- 点 D 组 (60°E, 60°N) - 标签右上方更远，坐标再下移 -->
            <g id="scene1-point-group-D" style="display: none;">
                <circle class="scene1-point" id="scene1-point-D" cx="506.67" cy="123.33" r="4"/>
                <text class="scene1-point-label" x="521.67" y="107.33">D</text>
                <text class="scene1-point-coord" x="506.67" y="155" text-anchor="middle">60°E, 60°N</text>
            </g>

            <!-- 点 E 组 (120°E, 60°N) - 标签右上方更远，坐标再下移 -->
            <g id="scene1-point-group-E" style="display: none;">
                <circle class="scene1-point" id="scene1-point-E" cx="613.33" cy="123.33" r="4"/>
                <text class="scene1-point-label" x="628.33" y="107.33">E</text>
                <text class="scene1-point-coord" x="613.33" y="155" text-anchor="middle">120°E, 60°N</text>
            </g>
        </svg>

        <div id="scene1-controls">
            <button class="scene1-btn" id="scene1-prev-btn">◀ 上一步</button>
            <span class="scene1-step-indicator" id="scene1-step-indicator">步骤 0/8</span>
            <button class="scene1-btn" id="scene1-next-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // 坐标表对照（来自 spec.json 规划，已根据 Playwright 检测调整）
        // 经线 X 坐标：80, 186.67, 293.33, 400, 506.67, 613.33, 720
        // 纬线 Y 坐标：60, 123.33, 186.67, 250, 313.33, 376.67, 440
        // 点 A: (293.33, 186.67) - 60°W, 30°N
        // 点 B: (400, 313.33) - 0°, 30°S
        // 点 C: (400, 250) - 0°, 0°
        // 点 D: (506.67, 123.33) - 60°E, 60°N
        // 点 E: (613.33, 123.33) - 120°E, 60°N

        const TOTAL_STEPS = 8;
        let currentStep = 0;

        // 获取 DOM 元素
        const prevBtn = document.getElementById('scene1-prev-btn');
        const nextBtn = document.getElementById('scene1-next-btn');
        const stepIndicator = document.getElementById('scene1-step-indicator');

        // 元素分组 ID 列表
        const elementGroups = {
            meridians: document.getElementById('scene1-meridians'),
            parallels: document.getElementById('scene1-parallels'),
            longitudeLabels: document.getElementById('scene1-longitude-labels'),
            latitudeLabels: document.getElementById('scene1-latitude-labels'),
            pointA: document.getElementById('scene1-point-group-A'),
            pointB: document.getElementById('scene1-point-group-B'),
            pointC: document.getElementById('scene1-point-group-C'),
            pointD: document.getElementById('scene1-point-group-D'),
            pointE: document.getElementById('scene1-point-group-E')
        };

        // 点位元素（用于高亮切换）
        const pointElements = {
            A: document.getElementById('scene1-point-A'),
            B: document.getElementById('scene1-point-B'),
            C: document.getElementById('scene1-point-C'),
            D: document.getElementById('scene1-point-D'),
            E: document.getElementById('scene1-point-E')
        };

        // 工具函数：显示元素
        function show(el) {
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }

        // 工具函数：隐藏元素
        function hide(el) {
            if (el) {
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }

        // 工具函数：设置高亮
        function setHighlight(pointId, isHighlighted) {
            const point = pointElements[pointId];
            if (point) {
                if (isHighlighted) {
                    point.classList.remove('scene1-point');
                    point.classList.add('scene1-point-highlight');
                    point.setAttribute('r', '6');
                } else {
                    point.classList.remove('scene1-point-highlight');
                    point.classList.add('scene1-point');
                    point.setAttribute('r', '4');
                }
            }
        }

        // 更新显示状态
        function updateDisplay() {
            // 步骤 0：仅显示经线组和纬线组
            show(elementGroups.meridians);
            show(elementGroups.parallels);

            // 步骤 1：新增经度刻度
            if (currentStep >= 1) {
                show(elementGroups.longitudeLabels);
            } else {
                hide(elementGroups.longitudeLabels);
            }

            // 步骤 2：新增纬度刻度
            if (currentStep >= 2) {
                show(elementGroups.latitudeLabels);
            } else {
                hide(elementGroups.latitudeLabels);
            }

            // 步骤 3：新增点 A
            if (currentStep >= 3) {
                show(elementGroups.pointA);
            } else {
                hide(elementGroups.pointA);
            }

            // 步骤 4：新增点 B
            if (currentStep >= 4) {
                show(elementGroups.pointB);
            } else {
                hide(elementGroups.pointB);
            }

            // 步骤 5：新增点 C
            if (currentStep >= 5) {
                show(elementGroups.pointC);
            } else {
                hide(elementGroups.pointC);
            }

            // 步骤 6：新增点 D
            if (currentStep >= 6) {
                show(elementGroups.pointD);
            } else {
                hide(elementGroups.pointD);
            }

            // 步骤 7：新增点 E
            if (currentStep >= 7) {
                show(elementGroups.pointE);
            } else {
                hide(elementGroups.pointE);
            }

            // 高亮逻辑
            // 步骤 3-7：当前点高亮，其他点恢复蓝色
            // 步骤 8：所有点蓝色（无高亮）
            const points = ['A', 'B', 'C', 'D', 'E'];
            points.forEach(p => {
                if (currentStep >= 3 && currentStep <= 7) {
                    // 当前步骤对应的点高亮
                    const shouldHighlight = (p === 'A' && currentStep === 3) ||
                                           (p === 'B' && currentStep === 4) ||
                                           (p === 'C' && currentStep === 5) ||
                                           (p === 'D' && currentStep === 6) ||
                                           (p === 'E' && currentStep === 7);
                    setHighlight(p, shouldHighlight);
                } else {
                    // 其他情况全部蓝色
                    setHighlight(p, false);
                }
            });

            // 更新步骤指示器
            stepIndicator.textContent = `步骤 ${currentStep}/${TOTAL_STEPS}`;

            // 更新按钮状态
            prevBtn.disabled = (currentStep === 0);
            nextBtn.disabled = (currentStep === TOTAL_STEPS);
        }

        // 事件绑定
        prevBtn.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentStep < TOTAL_STEPS) {
                currentStep++;
                updateDisplay();
            }
        });

        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
