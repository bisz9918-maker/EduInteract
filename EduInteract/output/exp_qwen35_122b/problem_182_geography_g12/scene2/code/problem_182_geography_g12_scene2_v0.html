<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 正午太阳高度对称性演示</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Microsoft YaHei', sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 20px; right: 20px; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene2-control-btn { padding: 8px 16px; background: #1976d2; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .scene2-control-btn:hover { background: #1565c0; }
        .scene2-control-btn:disabled { background: #bdbdbd; cursor: not-allowed; }
        .scene2-control-btn.active { background: #0d47a1; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" id="scene2-svg">
            <!-- 标题 -->
            <text x="400" y="45" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">正午太阳高度对称性演示</text>
            
            <!-- 经线网格 -->
            <line x1="60" y1="90" x2="60" y2="430" stroke="#333" stroke-width="2"/>
            <line x1="160" y1="90" x2="160" y2="430" stroke="#333" stroke-width="2"/>
            <line x1="260" y1="90" x2="260" y2="430" stroke="#333" stroke-width="2"/>
            <line x1="360" y1="90" x2="360" y2="430" stroke="#333" stroke-width="2"/>
            <line x1="460" y1="90" x2="460" y2="430" stroke="#333" stroke-width="2"/>
            <line x1="560" y1="90" x2="560" y2="430" stroke="#333" stroke-width="2"/>
            <line x1="660" y1="90" x2="660" y2="430" stroke="#333" stroke-width="2"/>
            
            <!-- 纬线网格 -->
            <line x1="60" y1="90" x2="660" y2="90" stroke="#333" stroke-width="2"/>
            <line x1="60" y1="150" x2="660" y2="150" stroke="#333" stroke-width="2"/>
            <line x1="60" y1="210" x2="660" y2="210" stroke="#333" stroke-width="2"/>
            <line x1="60" y1="270" x2="660" y2="270" stroke="#4caf50" stroke-width="3"/>
            <line x1="60" y1="330" x2="660" y2="330" stroke="#333" stroke-width="2"/>
            <line x1="60" y1="390" x2="660" y2="390" stroke="#333" stroke-width="2"/>
            <line x1="60" y1="430" x2="660" y2="430" stroke="#333" stroke-width="2"/>
            
            <!-- 经线标签 -->
            <text x="60" y="80" text-anchor="middle" font-size="11" fill="#333">180°W</text>
            <text x="160" y="80" text-anchor="middle" font-size="11" fill="#333">120°W</text>
            <text x="260" y="80" text-anchor="middle" font-size="11" fill="#333">60°W</text>
            <text x="360" y="80" text-anchor="middle" font-size="11" fill="#333">0°</text>
            <text x="460" y="80" text-anchor="middle" font-size="11" fill="#333">60°E</text>
            <text x="560" y="80" text-anchor="middle" font-size="11" fill="#333">120°E</text>
            <text x="660" y="80" text-anchor="middle" font-size="11" fill="#333">180°E</text>
            
            <!-- 纬线标签 -->
            <text x="45" y="95" text-anchor="end" font-size="11" fill="#333">90°N</text>
            <text x="45" y="155" text-anchor="end" font-size="11" fill="#333">60°N</text>
            <text x="45" y="215" text-anchor="end" font-size="11" fill="#333">30°N</text>
            <text x="45" y="275" text-anchor="end" font-size="11" fill="#333">0°</text>
            <text x="45" y="335" text-anchor="end" font-size="11" fill="#333">30°S</text>
            <text x="45" y="395" text-anchor="end" font-size="11" fill="#333">60°S</text>
            <text x="45" y="435" text-anchor="end" font-size="11" fill="#333">90°S</text>
            
            <!-- A 点标记 -->
            <circle id="scene2-point-a" cx="260" cy="210" r="10" fill="#1565c0"/>
            <text id="scene2-label-a" x="240" y="195" font-size="16" font-weight="bold" fill="#1565c0">A</text>
            
            <!-- B 点标记 -->
            <circle id="scene2-point-b" cx="360" cy="330" r="10" fill="#1565c0"/>
            <text id="scene2-label-b" x="380" y="350" font-size="16" font-weight="bold" fill="#1565c0">B</text>
            
            <!-- C 点标记 -->
            <circle id="scene2-point-c" cx="360" cy="270" r="8" fill="#1976d2"/>
            <text id="scene2-label-c" x="375" y="265" font-size="14" fill="#333">C</text>
            
            <!-- D 点标记 -->
            <circle id="scene2-point-d" cx="460" cy="150" r="8" fill="#1976d2"/>
            <text id="scene2-label-d" x="440" y="145" font-size="14" fill="#333">D</text>
            
            <!-- E 点标记 -->
            <circle id="scene2-point-e" cx="560" cy="150" r="8" fill="#1976d2"/>
            <text id="scene2-label-e" x="580" y="145" font-size="14" fill="#333">E</text>
            
            <!-- 太阳光线 -->
            <line id="scene2-ray1" x1="100" y1="120" x2="200" y2="220" stroke="#ff9800" stroke-width="2" opacity="0.6"/>
            <line id="scene2-ray2" x1="280" y1="120" x2="380" y2="220" stroke="#ff9800" stroke-width="2" opacity="0.6"/>
            <line id="scene2-ray3" x1="460" y1="120" x2="560" y2="220" stroke="#ff9800" stroke-width="2" opacity="0.6"/>
            
            <!-- 太阳直射点 -->
            <circle id="scene2-sun-point" cx="360" cy="270" r="15" fill="#c62828"/>
            <circle id="scene2-sun-glow" cx="360" cy="270" r="22" fill="none" stroke="#ff5722" stroke-width="4" opacity="0"/>
            
            <!-- HA 数值框 (移到左侧空白区域) -->
            <rect id="scene2-ha-box" x="70" y="280" width="140" height="60" fill="rgba(46,125,50,0.2)" stroke="#2e7d32" stroke-width="2" rx="5"/>
            <text id="scene2-ha-label" x="80" y="295" font-size="11" fill="#2e7d32">A 点正午太阳高度:</text>
            <text id="scene2-ha-value" x="80" y="318" font-size="16" font-weight="bold" fill="#2e7d32">HA = 60°</text>
            
            <!-- HB 数值框 (移到右侧空白区域) -->
            <rect id="scene2-hb-box" x="520" y="280" width="140" height="60" fill="rgba(46,125,50,0.2)" stroke="#2e7d32" stroke-width="2" rx="5"/>
            <text id="scene2-hb-label" x="530" y="295" font-size="11" fill="#2e7d32">B 点正午太阳高度:</text>
            <text id="scene2-hb-value" x="530" y="318" font-size="16" font-weight="bold" fill="#2e7d32">HB = 60°</text>
            
            <!-- 方向箭头 -->
            <line id="scene2-direction-arrow" x1="360" y1="330" x2="260" y2="210" stroke="#1565c0" stroke-width="3" marker-end="url(#scene2-arrowhead)"/>
            <defs>
                <marker id="scene2-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#1565c0"/>
                </marker>
            </defs>
            <text id="scene2-direction-text" x="200" y="250" font-size="13" fill="#1565c0" font-weight="bold">西北方向</text>
            
            <!-- 滑块轨道 -->
            <line id="scene2-slider-track" x1="70" y1="460" x2="220" y2="460" stroke="#666" stroke-width="4"/>
            
            <!-- 滑块手柄 -->
            <circle id="scene2-slider-handle" cx="145" cy="460" r="12" fill="#666" cursor="pointer"/>
            
            <!-- 纬度刻度 -->
            <text id="scene2-latitude-min" x="70" y="475" text-anchor="middle" font-size="10" fill="#666">-23.5°</text>
            <text id="scene2-latitude-mid" x="145" y="475" text-anchor="middle" font-size="10" fill="#666">0°</text>
            <text id="scene2-latitude-max" x="220" y="475" text-anchor="middle" font-size="10" fill="#666">+23.5°</text>
            
            <!-- 当前纬度显示 -->
            <text id="scene2-current-latitude" x="145" y="440" text-anchor="middle" font-size="12" fill="#333">当前直射纬度：0°</text>
            
            <!-- 结论显示 -->
            <text id="scene2-conclusion" x="500" y="440" text-anchor="middle" font-size="12" fill="#c62828" opacity="0">当 HA = HB 时，直射点在 A、B 纬度中间（赤道 0°）</text>
        </svg>
        
        <div id="scene2-controls">
            <button id="scene2-reset-btn" class="scene2-control-btn">重置到赤道</button>
            <button id="scene2-auto-btn" class="scene2-control-btn">自动演示</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现 - 正午太阳高度对称性演示
        
        // 状态变量
        let sunLatitude = 0;  // 太阳直射点纬度 (-23.5 ~ +23.5)
        let isDragging = false;
        let isAutoPlaying = false;
        let autoPlayDirection = 1;
        let autoPlayAnimationId = null;
        
        // DOM 元素
        const svg = document.getElementById('scene2-svg');
        const sunPoint = document.getElementById('scene2-sun-point');
        const sunGlow = document.getElementById('scene2-sun-glow');
        const sliderHandle = document.getElementById('scene2-slider-handle');
        const sliderTrack = document.getElementById('scene2-slider-track');
        const haValue = document.getElementById('scene2-ha-value');
        const hbValue = document.getElementById('scene2-hb-value');
        const currentLatitude = document.getElementById('scene2-current-latitude');
        const conclusion = document.getElementById('scene2-conclusion');
        const resetBtn = document.getElementById('scene2-reset-btn');
        const autoBtn = document.getElementById('scene2-auto-btn');
        
        // 坐标映射函数
        // 滑块 x 坐标范围：70 ~ 220，对应纬度：-23.5 ~ +23.5
        function sliderXtoLatitude(x) {
            return (x - 145) * (23.5 / 75);
        }
        
        // 纬度到太阳直射点 y 坐标的映射
        // 纬度 0° 对应 y=270，纬度 +23.5° 对应 y=150，纬度 -23.5° 对应 y=390
        function latitudeToSunY(lat) {
            return 270 - lat * (120 / 23.5);
        }
        
        // 计算正午太阳高度
        // A 点纬度 30°N，B 点纬度 30°S
        function calculateHA(lat) {
            return 90 - Math.abs(30 - lat);
        }
        
        function calculateHB(lat) {
            return 90 - Math.abs(-30 - lat);
        }
        
        // 更新显示
        function updateDisplay() {
            // 更新太阳直射点位置
            const sunY = latitudeToSunY(sunLatitude);
            sunPoint.setAttribute('cx', 360);
            sunPoint.setAttribute('cy', sunY);
            sunGlow.setAttribute('cx', 360);
            sunGlow.setAttribute('cy', sunY);
            
            // 更新滑块手柄位置
            const sliderX = 145 + sunLatitude * (75 / 23.5);
            sliderHandle.setAttribute('cx', sliderX);
            sliderHandle.setAttribute('cy', 460);
            
            // 计算并更新 HA、HB
            const ha = calculateHA(sunLatitude);
            const hb = calculateHB(sunLatitude);
            haValue.textContent = 'HA = ' + ha.toFixed(1) + '°';
            hbValue.textContent = 'HB = ' + hb.toFixed(1) + '°';
            
            // 更新当前纬度显示
            currentLatitude.textContent = '当前直射纬度：' + sunLatitude.toFixed(1) + '°';
            
            // 高亮太阳直射点当 HA ≈ HB
            const diff = Math.abs(ha - hb);
            if (diff < 1) {
                sunGlow.setAttribute('opacity', '1');
                conclusion.setAttribute('opacity', '1');
            } else {
                sunGlow.setAttribute('opacity', '0');
                conclusion.setAttribute('opacity', '0');
            }
            
            // 更新太阳光线位置（随直射点移动）
            const rayOffset = (sunLatitude / 23.5) * 30;
            document.getElementById('scene2-ray1').setAttribute('x1', 100 + rayOffset);
            document.getElementById('scene2-ray1').setAttribute('x2', 200 + rayOffset);
            document.getElementById('scene2-ray2').setAttribute('x1', 280 + rayOffset);
            document.getElementById('scene2-ray2').setAttribute('x2', 380 + rayOffset);
            document.getElementById('scene2-ray3').setAttribute('x1', 460 + rayOffset);
            document.getElementById('scene2-ray3').setAttribute('x2', 560 + rayOffset);
        }
        
        // 滑块拖动处理
        function handleSliderStart(e) {
            if (isAutoPlaying) {
                stopAutoPlay();
            }
            isDragging = true;
            e.preventDefault();
        }
        
        function handleSliderMove(e) {
            if (!isDragging) return;
            e.preventDefault();
            
            const rect = sliderTrack.getBoundingClientRect();
            let clientX = e.clientX;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
            }
            
            let x = clientX - rect.left;
            x = Math.max(70, Math.min(220, x));
            
            sunLatitude = sliderXtoLatitude(x);
            sunLatitude = Math.max(-23.5, Math.min(23.5, sunLatitude));
            
            updateDisplay();
        }
        
        function handleSliderEnd() {
            isDragging = false;
        }
        
        // 事件绑定
        sliderHandle.addEventListener('mousedown', handleSliderStart);
        sliderHandle.addEventListener('touchstart', handleSliderStart);
        document.addEventListener('mousemove', handleSliderMove);
        document.addEventListener('touchmove', handleSliderMove, { passive: false });
        document.addEventListener('mouseup', handleSliderEnd);
        document.addEventListener('touchend', handleSliderEnd);
        
        // 重置按钮
        resetBtn.addEventListener('click', function() {
            if (isAutoPlaying) {
                stopAutoPlay();
            }
            sunLatitude = 0;
            updateDisplay();
        });
        
        // 自动演示
        function startAutoPlay() {
            isAutoPlaying = true;
            autoBtn.textContent = '停止演示';
            autoBtn.classList.add('active');
            
            function autoPlayStep() {
                if (!isAutoPlaying) return;
                
                sunLatitude += autoPlayDirection * 0.1;
                
                if (sunLatitude >= 23.5) {
                    autoPlayDirection = -1;
                } else if (sunLatitude <= -23.5) {
                    autoPlayDirection = 1;
                }
                
                updateDisplay();
                autoPlayAnimationId = requestAnimationFrame(autoPlayStep);
            }
            
            autoPlayAnimationId = requestAnimationFrame(autoPlayStep);
        }
        
        function stopAutoPlay() {
            isAutoPlaying = false;
            autoBtn.textContent = '自动演示';
            autoBtn.classList.remove('active');
            if (autoPlayAnimationId) {
                cancelAnimationFrame(autoPlayAnimationId);
            }
        }
        
        autoBtn.addEventListener('click', function() {
            if (isAutoPlaying) {
                stopAutoPlay();
            } else {
                startAutoPlay();
            }
        });
        
        // 初始化显示
        updateDisplay();
        
    })();
    </script>
</body>
</html>
