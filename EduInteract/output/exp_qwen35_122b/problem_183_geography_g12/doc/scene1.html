<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地球公转示意图 - Scene 1</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Microsoft YaHei', sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-btn-container { position: absolute; bottom: 20px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 16px; z-index: 10; }
        #scene1-step-indicator { font-size: 14px; color: #666; min-width: 80px; text-align: center; }
        #scene1-btn-prev, #scene1-btn-next { padding: 8px 16px; font-size: 14px; border: 2px solid #1565c0; border-radius: 6px; background: #fff; color: #1565c0; cursor: pointer; transition: all 0.2s; }
        #scene1-btn-prev:hover:not(:disabled), #scene1-btn-next:hover:not(:disabled) { background: #1565c0; color: #fff; }
        #scene1-btn-prev:disabled, #scene1-btn-next:disabled { border-color: #ccc; color: #ccc; cursor: not-allowed; }
        .earth-highlight { stroke: #1565c0 !important; stroke-width: 3px !important; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <!-- 背景 -->
            <rect id="scene1-bg" width="800" height="500" fill="#ffffff"/>
            
            <!-- 公转轨道 -->
            <ellipse id="scene1-orbit" cx="400" cy="250" rx="280" ry="160" fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 太阳 -->
            <circle id="scene1-sun-center" cx="400" cy="250" r="20" fill="#ff9800"/>
            <g id="scene1-sun-rays">
                <line x1="400" y1="220" x2="400" y2="200" stroke="#ff9800" stroke-width="2"/>
                <line x1="400" y1="280" x2="400" y2="300" stroke="#ff9800" stroke-width="2"/>
                <line x1="370" y1="250" x2="350" y2="250" stroke="#ff9800" stroke-width="2"/>
                <line x1="430" y1="250" x2="450" y2="250" stroke="#ff9800" stroke-width="2"/>
                <line x1="379" y1="229" x2="365" y2="215" stroke="#ff9800" stroke-width="2"/>
                <line x1="421" y1="229" x2="435" y2="215" stroke="#ff9800" stroke-width="2"/>
                <line x1="379" y1="271" x2="365" y2="285" stroke="#ff9800" stroke-width="2"/>
                <line x1="421" y1="271" x2="435" y2="285" stroke="#ff9800" stroke-width="2"/>
            </g>
            
            <!-- 地球 A (左侧，9 点钟方向) -->
            <g id="scene1-earth-a-group">
                <circle id="scene1-earth-a" cx="120" cy="250" r="20" fill="#2196f3" fill-opacity="0.2" stroke="#000000" stroke-width="2"/>
                <!-- 地轴 A -->
                <line id="scene1-axis-a" x1="105" y1="220" x2="135" y2="280" stroke="#000000" stroke-width="1.5"/>
                <!-- 赤道线 A -->
                <line id="scene1-equator-a" x1="100" y1="250" x2="140" y2="250" stroke="#888888" stroke-width="1" stroke-dasharray="3,3"/>
            </g>
            <!-- 位置标签 A - 远离轨道 -->
            <text id="scene1-label-a" x="50" y="255" font-size="18" font-weight="bold" fill="#000000">A</text>
            
            <!-- 地球 C (右侧，3 点钟方向) -->
            <g id="scene1-earth-c-group">
                <circle id="scene1-earth-c" cx="680" cy="250" r="20" fill="#2196f3" fill-opacity="0.2" stroke="#000000" stroke-width="2"/>
                <!-- 地轴 C -->
                <line id="scene1-axis-c" x1="665" y1="220" x2="695" y2="280" stroke="#000000" stroke-width="1.5"/>
                <!-- 赤道线 C -->
                <line id="scene1-equator-c" x1="660" y1="250" x2="700" y2="250" stroke="#888888" stroke-width="1" stroke-dasharray="3,3"/>
            </g>
            <!-- 位置标签 C - 远离轨道 -->
            <text id="scene1-label-c" x="750" y="255" font-size="18" font-weight="bold" fill="#000000">C</text>
            
            <!-- 地球 D (上方，12 点钟方向) -->
            <g id="scene1-earth-d-group">
                <circle id="scene1-earth-d" cx="400" cy="90" r="20" fill="#2196f3" fill-opacity="0.2" stroke="#000000" stroke-width="2"/>
                <!-- 地轴 D -->
                <line id="scene1-axis-d" x1="385" y1="60" x2="415" y2="120" stroke="#000000" stroke-width="1.5"/>
                <!-- 赤道线 D -->
                <line id="scene1-equator-d" x1="380" y1="90" x2="420" y2="90" stroke="#888888" stroke-width="1" stroke-dasharray="3,3"/>
            </g>
            <!-- 位置标签 D - 远离轨道 -->
            <text id="scene1-label-d" x="390" y="35" font-size="18" font-weight="bold" fill="#000000">D</text>
            
            <!-- 地球 B (下方，6 点钟方向) -->
            <g id="scene1-earth-b-group">
                <circle id="scene1-earth-b" cx="400" cy="410" r="20" fill="#2196f3" fill-opacity="0.2" stroke="#000000" stroke-width="2"/>
                <!-- 地轴 B -->
                <line id="scene1-axis-b" x1="385" y1="380" x2="415" y2="440" stroke="#000000" stroke-width="1.5"/>
                <!-- 赤道线 B -->
                <line id="scene1-equator-b" x1="380" y1="410" x2="420" y2="410" stroke="#888888" stroke-width="1" stroke-dasharray="3,3"/>
            </g>
            <!-- 位置标签 B - 远离轨道 -->
            <text id="scene1-label-b" x="390" y="475" font-size="18" font-weight="bold" fill="#000000">B</text>
            
            <!-- 标题 - 顶部居中，移到更上方 -->
            <text id="scene1-title" x="400" y="25" text-anchor="middle" font-size="20" font-weight="bold" fill="#000000">地球公转示意图</text>
            
            <!-- 光线 A (初始隐藏) -->
            <g id="scene1-ray-a" style="display:none">
                <line x1="400" y1="250" x2="120" y2="250" stroke="#ff9800" stroke-width="1" stroke-dasharray="5,5"/>
                <polygon points="130,245 120,250 130,255" fill="#ff9800"/>
            </g>
            
            <!-- 光线 C (初始隐藏) -->
            <g id="scene1-ray-c" style="display:none">
                <line x1="400" y1="250" x2="680" y2="250" stroke="#ff9800" stroke-width="1" stroke-dasharray="5,5"/>
                <polygon points="670,245 680,250 670,255" fill="#ff9800"/>
            </g>
            
            <!-- 光线 D (初始隐藏) -->
            <g id="scene1-ray-d" style="display:none">
                <line x1="400" y1="250" x2="400" y2="90" stroke="#ff9800" stroke-width="1" stroke-dasharray="5,5"/>
                <polygon points="395,100 400,90 405,100" fill="#ff9800"/>
            </g>
            
            <!-- 光线 B (初始隐藏) -->
            <g id="scene1-ray-b" style="display:none">
                <line x1="400" y1="250" x2="400" y2="410" stroke="#ff9800" stroke-width="1" stroke-dasharray="5,5"/>
                <polygon points="395,400 400,410 405,400" fill="#ff9800"/>
            </g>
            
            <!-- 直射标注 (初始隐藏) -->
            <text id="scene1-direct-label" style="display:none" font-size="14" fill="#ff9800" font-weight="bold"></text>
            
            <!-- 节气标注 A (初始隐藏) -->
            <text id="scene1-solstice-label" style="display:none" x="30" y="320" font-size="16" fill="#c62828" font-weight="bold"></text>
            
            <!-- 节气标注 C (初始隐藏) -->
            <text id="scene1-winter-label" style="display:none" x="570" y="320" font-size="16" fill="#c62828" font-weight="bold"></text>
            
            <!-- 节气标注 D (初始隐藏) - 移到标题下方 -->
            <text id="scene1-spring-label" style="display:none" x="350" y="55" font-size="16" fill="#c62828" font-weight="bold"></text>
            
            <!-- 节气标注 B (初始隐藏) - 移到按钮上方 -->
            <text id="scene1-autumn-label" style="display:none" x="380" y="455" font-size="16" fill="#c62828" font-weight="bold"></text>
            
            <!-- 结论文字 (步骤 7 显示) -->
            <text id="scene1-conclusion" style="display:none" x="400" y="380" text-anchor="middle" font-size="16" fill="#000000" font-weight="bold"></text>
        </svg>
        
        <!-- 按钮放在 SVG 外部，绝对定位 -->
        <div id="scene1-btn-container">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 0/7</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现
        // 布局坐标表对照：
        // 太阳：(400,250), 半径 20px
        // 公转轨道：中心 (400,250), rx=280, ry=160
        // 地球 A: (120,250) - 9 点钟方向
        // 地球 C: (680,250) - 3 点钟方向
        // 地球 D: (400,90) - 12 点钟方向
        // 地球 B: (400,410) - 6 点钟方向
        // 地轴：统一向右倾斜 23.5°
        // 标签位置调整：A(50,255), C(750,255), D(390,35), B(390,475) - 远离轨道
        
        const currentStepMax = 7;
        let currentStep = 0;
        
        // 工具函数：显示元素
        function show(el) {
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }
        
        // 工具函数：隐藏元素
        function hide(el) {
            if (el) {
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }
        
        // 重置所有地球高亮
        function resetHighlights() {
            ['a', 'b', 'c', 'd'].forEach(dir => {
                const earth = document.getElementById('scene1-earth-' + dir);
                if (earth) {
                    earth.classList.remove('earth-highlight');
                    earth.setAttribute('stroke-width', '2');
                    earth.setAttribute('stroke', '#000000');
                }
            });
        }
        
        // 高亮指定地球
        function highlightEarth(dir) {
            const earth = document.getElementById('scene1-earth-' + dir);
            if (earth) {
                earth.classList.add('earth-highlight');
            }
        }
        
        // 显示光线
        function showRay(dir) {
            const ray = document.getElementById('scene1-ray-' + dir);
            show(ray);
        }
        
        // 显示直射标注
        function showDirectLabel(text, x, y) {
            const label = document.getElementById('scene1-direct-label');
            label.textContent = text;
            label.setAttribute('x', x);
            label.setAttribute('y', y);
            show(label);
        }
        
        // 更新步骤指示器
        function updateStepIndicator() {
            const indicator = document.getElementById('scene1-step-indicator');
            if (indicator) {
                if (currentStep === currentStepMax) {
                    indicator.textContent = '完成';
                } else {
                    indicator.textContent = '步骤 ' + currentStep + '/' + currentStepMax;
                }
            }
            
            // 更新按钮状态
            const prevBtn = document.getElementById('scene1-btn-prev');
            const nextBtn = document.getElementById('scene1-btn-next');
            
            if (prevBtn) {
                prevBtn.disabled = (currentStep === 0);
            }
            if (nextBtn) {
                if (currentStep === currentStepMax) {
                    nextBtn.textContent = '完成';
                    nextBtn.disabled = true;
                } else {
                    nextBtn.textContent = '下一步 ▶';
                    nextBtn.disabled = false;
                }
            }
        }
        
        // 更新场景显示
        function updateScene() {
            // 重置所有高亮和隐藏元素
            resetHighlights();
            hide(document.getElementById('scene1-ray-a'));
            hide(document.getElementById('scene1-ray-b'));
            hide(document.getElementById('scene1-ray-c'));
            hide(document.getElementById('scene1-ray-d'));
            hide(document.getElementById('scene1-direct-label'));
            hide(document.getElementById('scene1-solstice-label'));
            hide(document.getElementById('scene1-winter-label'));
            hide(document.getElementById('scene1-spring-label'));
            hide(document.getElementById('scene1-autumn-label'));
            hide(document.getElementById('scene1-conclusion'));
            
            switch(currentStep) {
                case 0:
                    // 初始状态，仅显示基础元素
                    break;
                    
                case 1:
                    // 高亮 A，显示光线 A 和直射标注
                    highlightEarth('a');
                    showRay('a');
                    showDirectLabel('太阳直射北回归线', 50, 200);
                    break;
                    
                case 2:
                    // 保持 A 高亮，显示节气标注 A
                    highlightEarth('a');
                    showRay('a');
                    showDirectLabel('太阳直射北回归线', 50, 200);
                    const solsticeLabel = document.getElementById('scene1-solstice-label');
                    solsticeLabel.textContent = '夏至（6 月 22 日前后）';
                    show(solsticeLabel);
                    break;
                    
                case 3:
                    // 高亮 C，显示光线 C 和直射标注
                    highlightEarth('c');
                    showRay('c');
                    showDirectLabel('太阳直射南回归线', 630, 200);
                    break;
                    
                case 4:
                    // 保持 C 高亮，显示节气标注 C
                    highlightEarth('c');
                    showRay('c');
                    showDirectLabel('太阳直射南回归线', 630, 200);
                    const winterLabel = document.getElementById('scene1-winter-label');
                    winterLabel.textContent = '冬至（12 月 22 日前后）';
                    show(winterLabel);
                    break;
                    
                case 5:
                    // 高亮 D，显示光线 D 和直射标注
                    highlightEarth('d');
                    showRay('d');
                    showDirectLabel('太阳直射赤道', 320, 90);
                    const springLabel = document.getElementById('scene1-spring-label');
                    springLabel.textContent = '春分';
                    show(springLabel);
                    break;
                    
                case 6:
                    // 高亮 B，显示光线 B 和直射标注
                    highlightEarth('b');
                    showRay('b');
                    showDirectLabel('太阳直射赤道', 320, 410);
                    const autumnLabel = document.getElementById('scene1-autumn-label');
                    autumnLabel.textContent = '秋分';
                    show(autumnLabel);
                    break;
                    
                case 7:
                    // 显示所有节气标注和结论
                    const labelsData = [
                        { id: 'scene1-solstice-label', text: '夏至（6 月 22 日前后）', x: 30, y: 320 },
                        { id: 'scene1-winter-label', text: '冬至（12 月 22 日前后）', x: 570, y: 320 },
                        { id: 'scene1-spring-label', text: '春分', x: 350, y: 55 },
                        { id: 'scene1-autumn-label', text: '秋分', x: 380, y: 455 }
                    ];
                    
                    labelsData.forEach(data => {
                        const el = document.getElementById(data.id);
                        el.textContent = data.text;
                        el.setAttribute('x', data.x);
                        el.setAttribute('y', data.y);
                        show(el);
                    });
                    
                    const conclusion = document.getElementById('scene1-conclusion');
                    conclusion.textContent = '答案：A-夏至，C-冬至，D-春分，B-秋分';
                    show(conclusion);
                    break;
            }
            
            updateStepIndicator();
        }
        
        // 事件绑定
        document.getElementById('scene1-btn-prev').addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });
        
        document.getElementById('scene1-btn-next').addEventListener('click', function() {
            if (currentStep < currentStepMax) {
                currentStep++;
                updateScene();
            }
        });
        
        // 初始化
        updateScene();
    })();
    </script>
</body>
</html>
