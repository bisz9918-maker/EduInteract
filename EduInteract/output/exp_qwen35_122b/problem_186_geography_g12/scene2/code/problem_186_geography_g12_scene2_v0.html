<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太阳直射点回归运动 - Scene 2</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene2-controls button {
            width: 100px; height: 36px;
            font-size: 14px; font-weight: bold;
            background: #1565c0; color: white;
            border: none; border-radius: 6px;
            cursor: pointer; transition: background 0.2s;
        }
        #scene2-controls button:hover { background: #0d47a1; }
        #scene2-controls button:disabled { background: #bdbdbd; cursor: not-allowed; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" id="scene2-svg">
            <!-- 标题 -->
            <text id="scene2-title" x="400" y="45" text-anchor="middle" font-size="20" font-weight="bold" fill="#000000">太阳直射点回归运动</text>
            
            <!-- 黄赤交角示意图区域（左上） -->
            <!-- 赤道平面线 -->
            <line id="scene2-equator-line" x1="80" y1="160" x2="300" y2="160" stroke="#000000" stroke-width="2" opacity="0"/>
            <!-- 黄道平面线 -->
            <line id="scene2-ecliptic-line" x1="80" y1="165" x2="300" y2="135" stroke="#000000" stroke-width="2" opacity="0"/>
            <!-- 交角弧线 -->
            <path id="scene2-angle-arc" d="M 110 160 A 25 25 0 0 0 102 138" stroke="#000000" stroke-width="2" fill="none" opacity="0"/>
            <!-- 交角标注（移到弧线左侧，远离线条，保持边缘间距） -->
            <text id="scene2-angle-label" x="35" y="150" font-size="13" fill="#000000" opacity="0">23°26′</text>
            <!-- 赤道平面标签（在线下方） -->
            <text id="scene2-equator-label" x="190" y="185" text-anchor="middle" font-size="13" fill="#000000" opacity="0">赤道平面</text>
            <!-- 黄道平面标签（在线上方） -->
            <text id="scene2-ecliptic-label" x="190" y="115" text-anchor="middle" font-size="13" fill="#000000" opacity="0">黄道平面</text>
            <!-- 黄赤交角标签（更下方，增加间距） -->
            <text id="scene2-yaochi-label" x="190" y="220" text-anchor="middle" font-size="13" fill="#000000" opacity="0">黄赤交角</text>
            
            <!-- 地球公转轨道椭圆（右侧居中，缩小） -->
            <ellipse id="scene2-orbit-ellipse" cx="580" cy="310" rx="100" ry="50" stroke="#888880" stroke-width="2" fill="none" stroke-dasharray="8,4" opacity="0"/>
            
            <!-- 北回归线（绿色虚线，在轨道上方） -->
            <line id="scene2-north-回归线" x1="480" y1="260" x2="680" y2="260" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="6,3" opacity="0"/>
            <!-- 南回归线（绿色虚线，在轨道下方） -->
            <line id="scene2-south-回归线" x1="480" y1="360" x2="680" y2="360" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="6,3" opacity="0"/>
            <!-- 北回归线标签（移到左侧） -->
            <text id="scene2-north-label" x="470" y="252" text-anchor="end" font-size="12" fill="#2e7d32" opacity="0">北回归线</text>
            <!-- 南回归线标签（移到左侧） -->
            <text id="scene2-south-label" x="470" y="375" text-anchor="end" font-size="12" fill="#2e7d32" opacity="0">南回归线</text>
            
            <!-- 节气位置点（步骤 1 显示） -->
            <!-- 春分点（右侧） -->
            <circle id="scene2-spring-point" cx="680" cy="310" r="6" fill="#c62828" opacity="0"/>
            <text id="scene2-spring-label" x="705" y="315" text-anchor="start" font-size="12" fill="#c62828" opacity="0">春分（0°）</text>
            <!-- 夏至点（顶部） -->
            <circle id="scene2-summer-point" cx="580" cy="260" r="6" fill="#c62828" opacity="0"/>
            <text id="scene2-summer-label" x="580" y="240" text-anchor="middle" font-size="12" fill="#c62828" opacity="0">夏至（23°26′N）</text>
            <!-- 秋分点（左侧） -->
            <circle id="scene2-autumn-point" cx="480" cy="310" r="6" fill="#c62828" opacity="0"/>
            <text id="scene2-autumn-label" x="455" y="315" text-anchor="end" font-size="12" fill="#c62828" opacity="0">秋分（0°）</text>
            <!-- 冬至点（底部） -->
            <circle id="scene2-winter-point" cx="580" cy="360" r="6" fill="#c62828" opacity="0"/>
            <text id="scene2-winter-label" x="580" y="385" text-anchor="middle" font-size="12" fill="#c62828" opacity="0">冬至（23°26′S）</text>
            
            <!-- 节气位置箭头连接（步骤 1 显示） -->
            <path id="scene2-summer-arrow" d="M 665 310 Q 625 285 584 264" stroke="#c62828" stroke-width="2" fill="none" marker-end="url(#arrowhead)" opacity="0"/>
            <path id="scene2-autumn-arrow" d="M 584 276 Q 625 300 665 310" stroke="#c62828" stroke-width="2" fill="none" marker-end="url(#arrowhead)" opacity="0"/>
            <path id="scene2-winter-arrow" d="M 495 310 Q 535 335 576 354" stroke="#c62828" stroke-width="2" fill="none" marker-end="url(#arrowhead)" opacity="0"/>
            <path id="scene2-spring-arrow" d="M 576 366 Q 535 335 495 310" stroke="#c62828" stroke-width="2" fill="none" marker-end="url(#arrowhead)" opacity="0"/>
            
            <!-- 直射点路径曲线（步骤 2 显示） -->
            <path id="scene2-path-curve" d="M 680 310 Q 580 260 480 310 Q 535 360 680 310" stroke="#c62828" stroke-width="2" fill="none" opacity="0"/>
            
            <!-- 直射点移动圆点（步骤 2 显示，动画） -->
            <circle id="scene2-moving-point" cx="680" cy="310" r="5" fill="#c62828" opacity="0"/>
            
            <!-- 回归周期标签（步骤 3 显示） -->
            <text id="scene2-cycle-label" x="580" y="440" text-anchor="middle" font-size="14" fill="#000000" opacity="0">回归周期（1 年）</text>
            
            <!-- 箭头标记定义 -->
            <defs>
                <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#c62828"/>
                </marker>
            </defs>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-prev-btn" disabled>◀ 上一步</button>
            <button id="scene2-next-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2: 太阳直射点回归运动
        // 坐标表对照：
        // 标题：(400,45)
        // 黄赤交角示意图：(35,115)-(300,220)
        // 赤道平面线：(80,160)-(300,160)
        // 黄道平面线：(80,165)-(300,135)
        // 交角弧线：(110,160) 半径 25
        // 地球公转轨道：(580,310) 中心，rx=100, ry=50
        // 春分点：(680,310) 右侧
        // 夏至点：(580,260) 顶部
        // 秋分点：(480,310) 左侧
        // 冬至点：(580,360) 底部
        // 北回归线：(480,260)-(680,260)
        // 南回归线：(480,360)-(680,360)
        
        const scene2 = {
            currentStep: 0,
            maxStep: 3,
            animationId: null,
            animProgress: 0,
            animSpeed: 0.008,
            
            // 元素 ID 列表
            elements: {
                // 步骤 0 元素
                step0: [
                    'scene2-title',
                    'scene2-equator-line', 'scene2-ecliptic-line',
                    'scene2-angle-arc', 'scene2-angle-label',
                    'scene2-equator-label', 'scene2-ecliptic-label', 'scene2-yaochi-label',
                    'scene2-orbit-ellipse',
                    'scene2-north-回归线', 'scene2-south-回归线',
                    'scene2-north-label', 'scene2-south-label'
                ],
                // 步骤 1 新增元素
                step1: [
                    'scene2-spring-point', 'scene2-spring-label',
                    'scene2-summer-point', 'scene2-summer-label',
                    'scene2-autumn-point', 'scene2-autumn-label',
                    'scene2-winter-point', 'scene2-winter-label',
                    'scene2-summer-arrow', 'scene2-autumn-arrow',
                    'scene2-winter-arrow', 'scene2-spring-arrow'
                ],
                // 步骤 2 新增元素
                step2: [
                    'scene2-path-curve', 'scene2-moving-point'
                ],
                // 步骤 3 新增元素
                step3: [
                    'scene2-cycle-label'
                ]
            },
            
            // 显示元素
            show: function(ids) {
                ids.forEach(id => {
                    const el = document.getElementById(id);
                    if (el) {
                        el.style.display = 'block';
                        el.style.opacity = '1';
                    }
                });
            },
            
            // 隐藏元素
            hide: function(ids) {
                ids.forEach(id => {
                    const el = document.getElementById(id);
                    if (el) {
                        el.style.display = 'none';
                        el.style.opacity = '0';
                    }
                });
            },
            
            // 更新场景显示
            updateScene: function() {
                // 隐藏所有步骤元素
                this.hide(this.elements.step0);
                this.hide(this.elements.step1);
                this.hide(this.elements.step2);
                this.hide(this.elements.step3);
                
                // 根据当前步骤显示对应元素
                if (this.currentStep >= 0) {
                    this.show(this.elements.step0);
                }
                if (this.currentStep >= 1) {
                    this.show(this.elements.step1);
                }
                if (this.currentStep >= 2) {
                    this.show(this.elements.step2);
                    // 启动动画
                    this.startAnimation();
                }
                if (this.currentStep >= 3) {
                    this.show(this.elements.step3);
                }
                
                // 更新按钮状态
                document.getElementById('scene2-prev-btn').disabled = (this.currentStep === 0);
                document.getElementById('scene2-next-btn').disabled = (this.currentStep === this.maxStep);
            },
            
            // 直射点路径动画
            startAnimation: function() {
                if (this.animationId) {
                    cancelAnimationFrame(this.animationId);
                }
                this.animProgress = 0;
                this.animate();
            },
            
            animate: function() {
                const movingPoint = document.getElementById('scene2-moving-point');
                if (!movingPoint) return;
                
                this.animProgress += this.animSpeed;
                if (this.animProgress > 1) {
                    this.animProgress = 0;
                }
                
                // 计算路径上的位置（简化版：沿椭圆轨道移动）
                const t = this.animProgress * Math.PI * 2;
                const cx = 580, cy = 310, rx = 100, ry = 50;
                const x = cx + rx * Math.cos(t);
                const y = cy + ry * Math.sin(t);
                
                movingPoint.setAttribute('cx', x);
                movingPoint.setAttribute('cy', y);
                
                this.animationId = requestAnimationFrame(this.animate.bind(this));
            },
            
            // 下一步
            nextStep: function() {
                if (this.currentStep < this.maxStep) {
                    this.currentStep++;
                    this.updateScene();
                }
            },
            
            // 上一步
            prevStep: function() {
                if (this.currentStep > 0) {
                    this.currentStep--;
                    this.updateScene();
                }
            },
            
            // 初始化
            init: function() {
                document.getElementById('scene2-next-btn').addEventListener('click', this.nextStep.bind(this));
                document.getElementById('scene2-prev-btn').addEventListener('click', this.prevStep.bind(this));
                this.updateScene();
            }
        };
        
        // 启动场景
        scene2.init();
    })();
    </script>
</body>
</html>
