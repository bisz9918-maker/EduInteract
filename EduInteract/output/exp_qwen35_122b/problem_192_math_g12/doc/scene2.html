<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>牛顿调和三角形 - 第 6 行第 2 个数推导</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Segoe UI', Arial, sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene2-btn { padding: 10px 20px; font-size: 14px; border: none; border-radius: 6px; cursor: pointer; transition: all 0.3s ease; }
        .scene2-btn-primary { background: #1565c0; color: white; }
        .scene2-btn-primary:hover:not(:disabled) { background: #0d47a1; }
        .scene2-btn:disabled { background: #bdbdbd; cursor: not-allowed; }
        .scene2-text { font-size: 16px; }
        .scene2-title { font-size: 18px; font-weight: bold; }
        .scene2-calc-step { font-size: 15px; }
        .scene2-formula { font-size: 14px; }
        .scene2-highlight-blue { fill: #1565c0 !important; }
        .scene2-highlight-red { fill: #c62828 !important; }
        .scene2-highlight-green { fill: #2e7d32 !important; }
        .scene2-arrow { stroke: #888888; stroke-width: 2; fill: none; stroke-dasharray: 5,5; }
        .scene2-arrow-thick { stroke-width: 3; stroke-dasharray: none; }
        .scene2-fade { opacity: 0; transition: opacity 0.3s ease; }
        .scene2-visible { opacity: 1; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500">
            <!-- 标题 -->
            <text id="scene2-title" x="400" y="40" text-anchor="middle" class="scene2-title">第 6 行第 2 个数推导</text>
            
            <!-- 第 5 行容器 -->
            <g id="scene2-row5">
                <text id="scene2-row5-1" x="200" y="80" text-anchor="middle" class="scene2-text">1/5</text>
                <text id="scene2-row5-2" x="300" y="80" text-anchor="middle" class="scene2-text">1/20</text>
                <text id="scene2-row5-3" x="400" y="80" text-anchor="middle" class="scene2-text">1/30</text>
                <text id="scene2-row5-4" x="500" y="80" text-anchor="middle" class="scene2-text">1/20</text>
                <text id="scene2-row5-5" x="600" y="80" text-anchor="middle" class="scene2-text">1/5</text>
            </g>
            
            <!-- 第 6 行容器 -->
            <g id="scene2-row6">
                <text id="scene2-row6-1" x="200" y="200" text-anchor="middle" class="scene2-text">1/6</text>
                <text id="scene2-row6-2" x="300" y="200" text-anchor="middle" class="scene2-text scene2-highlight-red">?</text>
                <text id="scene2-row6-3" x="400" y="200" text-anchor="middle" class="scene2-text">?</text>
                <text id="scene2-row6-4" x="500" y="200" text-anchor="middle" class="scene2-text">?</text>
                <text id="scene2-row6-5" x="600" y="200" text-anchor="middle" class="scene2-text">?</text>
                <text id="scene2-row6-6" x="700" y="200" text-anchor="middle" class="scene2-text">1/6</text>
            </g>
            
            <!-- 递推箭头 -->
            <path id="scene2-arrow1" d="M 200 100 L 230 170" class="scene2-arrow"/>
            <path id="scene2-arrow2" d="M 200 100 L 270 170" class="scene2-arrow"/>
            
            <!-- 计算框 -->
            <rect id="scene2-calc-box" x="50" y="310" width="200" height="110" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" rx="8"/>
            <text id="scene2-calc-title" x="65" y="340" class="scene2-calc-step" fill="#000000">递推计算：</text>
            <text id="scene2-calc-step1" x="65" y="370" class="scene2-calc-step" fill="#000000">1/5 = 1/6 + x</text>
            <text id="scene2-calc-step2" x="65" y="400" class="scene2-calc-step" fill="#000000">x = 1/5 - 1/6</text>
            <text id="scene2-calc-step3" x="65" y="430" class="scene2-calc-step" fill="#000000">x = 1/30</text>
            
            <!-- 公式说明框 -->
            <rect id="scene2-formula-box" x="550" y="310" width="230" height="110" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="8"/>
            <text id="scene2-formula-title" x="565" y="340" class="scene2-formula" fill="#000000">递推规则：</text>
            <text id="scene2-formula-1" x="565" y="370" class="scene2-formula" fill="#000000">第 n 行第 k 个数 =</text>
            <text id="scene2-formula-2" x="565" y="400" class="scene2-formula" fill="#000000">第 (n+1) 行第 k 个数 +</text>
            <text id="scene2-formula-3" x="565" y="430" class="scene2-formula" fill="#000000">第 (n+1) 行第 (k+1) 个数</text>
            
            <!-- 验证文字（步骤 4 显示） -->
            <text id="scene2-verify" x="400" y="440" text-anchor="middle" class="scene2-calc-step" fill="#2e7d32" font-weight="bold" opacity="0">验证：1/5 = 1/6 + 1/30 ✓</text>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-prev-btn" class="scene2-btn scene2-btn-primary">◀ 上一步</button>
            <button id="scene2-next-btn" class="scene2-btn scene2-btn-primary">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2: 牛顿调和三角形 - 第 6 行第 2 个数推导
        // 布局坐标表：
        // 标题：(400,40) 居中
        // 第 5 行：y=80, x=200/300/400/500/600
        // 第 6 行：y=200, x=200/300/400/500/600/700
        // 计算框：(50,310) 200×110
        // 公式框：(550,310) 230×110
        // 控件栏：y=450
        
        const TOTAL_STEPS = 5;
        let currentStep = 0;
        
        // 工具函数
        function show(el) {
            if (el) { el.style.display = 'block'; el.style.opacity = '1'; }
        }
        function hide(el) {
            if (el) { el.style.display = 'none'; el.style.opacity = '0'; }
        }
        function setOpacity(el, opacity) {
            if (el) { el.style.opacity = opacity; }
        }
        
        // 获取 DOM 元素
        const els = {
            title: document.getElementById('scene2-title'),
            row5: {
                1: document.getElementById('scene2-row5-1'),
                2: document.getElementById('scene2-row5-2'),
                3: document.getElementById('scene2-row5-3'),
                4: document.getElementById('scene2-row5-4'),
                5: document.getElementById('scene2-row5-5')
            },
            row6: {
                1: document.getElementById('scene2-row6-1'),
                2: document.getElementById('scene2-row6-2'),
                3: document.getElementById('scene2-row6-3'),
                4: document.getElementById('scene2-row6-4'),
                5: document.getElementById('scene2-row6-5'),
                6: document.getElementById('scene2-row6-6')
            },
            arrow1: document.getElementById('scene2-arrow1'),
            arrow2: document.getElementById('scene2-arrow2'),
            calcBox: document.getElementById('scene2-calc-box'),
            calcTitle: document.getElementById('scene2-calc-title'),
            calcStep1: document.getElementById('scene2-calc-step1'),
            calcStep2: document.getElementById('scene2-calc-step2'),
            calcStep3: document.getElementById('scene2-calc-step3'),
            formulaBox: document.getElementById('scene2-formula-box'),
            formulaTitle: document.getElementById('scene2-formula-title'),
            formula1: document.getElementById('scene2-formula-1'),
            formula2: document.getElementById('scene2-formula-2'),
            formula3: document.getElementById('scene2-formula-3'),
            verify: document.getElementById('scene2-verify'),
            prevBtn: document.getElementById('scene2-prev-btn'),
            nextBtn: document.getElementById('scene2-next-btn')
        };
        
        // 高亮控制
        function highlight(el, color) {
            if (!el) return;
            el.classList.remove('scene2-highlight-blue', 'scene2-highlight-red', 'scene2-highlight-green');
            if (color) { el.classList.add('scene2-highlight-' + color); }
        }
        
        function highlightText(el, color, text) {
            if (!el) return;
            el.textContent = text;
            highlight(el, color);
        }
        
        // 更新场景状态
        function updateScene() {
            // 重置所有高亮
            for (let i = 1; i <= 5; i++) {
                highlight(els.row5[i], null);
            }
            for (let i = 1; i <= 6; i++) {
                highlight(els.row6[i], null);
            }
            highlight(els.calcBox, null);
            highlight(els.calcStep1, null);
            highlight(els.calcStep2, null);
            highlight(els.calcStep3, null);
            els.arrow1.classList.remove('scene2-arrow-thick');
            els.arrow2.classList.remove('scene2-arrow-thick');
            setOpacity(els.verify, 0);
            
            // 根据步骤设置状态
            switch(currentStep) {
                case 0: // 初始状态
                    // 第 6 行第 2 个数为红色问号
                    highlightText(els.row6[2], 'red', '?');
                    break;
                    
                case 1: // 高亮第 5 行第 1 个数和第 6 行第 1 个数
                    highlight(els.row5[1], 'blue');
                    highlight(els.row6[1], 'blue');
                    highlightText(els.row6[2], 'red', '?');
                    highlight(els.calcStep1, 'blue');
                    break;
                    
                case 2: // 高亮计算步骤 2，箭头 2 加粗
                    highlight(els.row5[1], 'blue');
                    highlight(els.row6[1], 'blue');
                    highlightText(els.row6[2], 'red', '?');
                    highlight(els.calcStep1, 'blue');
                    highlight(els.calcStep2, 'blue');
                    els.arrow2.classList.add('scene2-arrow-thick');
                    break;
                    
                case 3: // 显示计算结果
                    highlight(els.row5[1], 'blue');
                    highlight(els.row6[1], 'blue');
                    highlightText(els.row6[2], 'red', '1/30');
                    highlight(els.calcStep1, 'blue');
                    highlight(els.calcStep2, 'blue');
                    highlight(els.calcStep3, 'blue');
                    els.arrow2.classList.add('scene2-arrow-thick');
                    break;
                    
                case 4: // 最终状态，绿色确认
                    highlight(els.row6[2], 'green');
                    highlight(els.calcBox, 'green');
                    setOpacity(els.verify, 1);
                    break;
            }
            
            // 更新按钮状态
            els.prevBtn.disabled = (currentStep === 0);
            els.nextBtn.disabled = (currentStep === TOTAL_STEPS - 1);
        }
        
        // 事件绑定
        els.prevBtn.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });
        
        els.nextBtn.addEventListener('click', function() {
            if (currentStep < TOTAL_STEPS - 1) {
                currentStep++;
                updateScene();
            }
        });
        
        // 初始化
        updateScene();
    })();
    </script>
</body>
</html>
