<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 切割线定理与勾股定理</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Microsoft YaHei', sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene2-controls button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #1565c0; border-radius: 4px; background: #fff; color: #1565c0; }
        #scene2-controls button:hover:not(:disabled) { background: #1565c0; color: #fff; }
        #scene2-controls button:disabled { border-color: #ccc; color: #ccc; cursor: not-allowed; }
        #scene2-step-indicator { font-size: 14px; color: #333; min-width: 80px; text-align: center; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 圆 O -->
            <circle id="scene2-circle-O" cx="450" cy="250" r="120" fill="none" stroke="#000" stroke-width="2"/>
            
            <!-- 直径 AC -->
            <line id="scene2-line-AC" x1="450" y1="130" x2="450" y2="370" stroke="#000" stroke-width="3"/>
            
            <!-- 切线 PA -->
            <line id="scene2-line-PA" x1="150" y1="370" x2="450" y2="370" stroke="#000" stroke-width="3"/>
            
            <!-- 割线 PC -->
            <line id="scene2-line-PC" x1="150" y1="370" x2="450" y2="130" stroke="#000" stroke-width="2"/>
            
            <!-- 直角标记 ∠PAC -->
            <path id="scene2-rightangle-PAC" d="M 440 370 L 450 370 L 450 360" fill="none" stroke="#888" stroke-width="1.5"/>
            
            <!-- 直角标记 ∠ABC (步骤 3 显示) -->
            <path id="scene2-rightangle-ABC" class="hidden" d="M 285 278 L 294 278 L 294 287" fill="none" stroke="#888" stroke-width="1.5"/>
            
            <!-- 圆心 O -->
            <circle id="scene2-point-O" cx="450" cy="250" r="3" fill="#c62828"/>
            <text id="scene2-label-O" x="580" y="255" font-size="16" fill="#000">O</text>
            
            <!-- 点 A（切点） -->
            <circle id="scene2-point-A" cx="450" cy="370" r="2.5" fill="#1565c0"/>
            <text id="scene2-label-A" x="445" y="390" font-size="16" fill="#000">A</text>
            
            <!-- 点 C（直径端点） -->
            <circle id="scene2-point-C" cx="450" cy="130" r="2.5" fill="#1565c0"/>
            <text id="scene2-label-C" x="445" y="115" font-size="16" fill="#000">C</text>
            
            <!-- 点 P（外部点） -->
            <circle id="scene2-point-P" cx="150" cy="370" r="2.5" fill="#2e7d32"/>
            <text id="scene2-label-P" x="125" y="375" font-size="16" fill="#000">P</text>
            
            <!-- 点 B（割线交点） -->
            <circle id="scene2-point-B" class="hidden" cx="294" cy="278" r="2.5" fill="#1565c0"/>
            <text id="scene2-label-B" class="hidden" x="275" y="265" font-size="16" fill="#000">B</text>
            
            <!-- 长度标注 PA=2 -->
            <text id="scene2-label-PA" x="280" y="395" font-size="14" fill="#000">PA=2</text>
            
            <!-- 长度标注 PB=1 (调整位置，避免与割线重叠) -->
            <text id="scene2-label-PB" x="110" y="290" font-size="14" fill="#000">PB=1</text>
            
            <!-- 长度标注 PC=4 (步骤 1 显示) -->
            <text id="scene2-label-PC" class="hidden" x="290" y="260" font-size="14" fill="#000">PC=4</text>
            
            <!-- 长度标注 BC=3 (步骤 2 显示) -->
            <text id="scene2-label-BC" class="hidden" x="350" y="240" font-size="14" fill="#000">BC=3</text>
            
            <!-- 长度标注 AC=2√3 (步骤 4 显示) -->
            <text id="scene2-label-AC" class="hidden" x="485" y="250" font-size="14" fill="#000">AC=2√3</text>
            
            <!-- 答案 R=√3 (步骤 5 显示) -->
            <text id="scene2-label-R" class="hidden" x="440" y="430" font-size="16" fill="#2e7d32" font-weight="bold">半径 R = √3</text>
            
            <!-- 定理公式框 (步骤 1 显示) -->
            <rect id="scene2-formula-box" class="hidden" x="550" y="150" width="200" height="100" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
            <text id="scene2-formula-text" class="hidden" x="560" y="180" font-size="14" fill="#000"></text>
            
            <!-- 勾股定理框 (步骤 4 显示) -->
            <rect id="scene2-pythagoras-box" class="hidden" x="550" y="270" width="200" height="70" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
            <text id="scene2-pythagoras-text" class="hidden" x="560" y="300" font-size="14" fill="#000"></text>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-prev-btn" disabled>◀ 上一步</button>
            <span id="scene2-step-indicator">步骤 0/5</span>
            <button id="scene2-next-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现 - 切割线定理与勾股定理的解题推导
        
        const currentStepMax = 5;
        let currentStep = 0;
        
        // 元素引用
        const prevBtn = document.getElementById('scene2-prev-btn');
        const nextBtn = document.getElementById('scene2-next-btn');
        const stepIndicator = document.getElementById('scene2-step-indicator');
        
        // 图形元素
        const linePC = document.getElementById('scene2-line-PC');
        const lineBC = document.getElementById('scene2-line-PC'); // BC 是 PC 的一部分，用同一线段
        const pointB = document.getElementById('scene2-point-B');
        const labelB = document.getElementById('scene2-label-B');
        const rightangleABC = document.getElementById('scene2-rightangle-ABC');
        const lineAC = document.getElementById('scene2-line-AC');
        const pointO = document.getElementById('scene2-point-O');
        
        // 标签元素
        const labelPC = document.getElementById('scene2-label-PC');
        const labelBC = document.getElementById('scene2-label-BC');
        const labelAC = document.getElementById('scene2-label-AC');
        const labelR = document.getElementById('scene2-label-R');
        
        // 公式框
        const formulaBox = document.getElementById('scene2-formula-box');
        const formulaText = document.getElementById('scene2-formula-text');
        const pythagorasBox = document.getElementById('scene2-pythagoras-box');
        const pythagorasText = document.getElementById('scene2-pythagoras-text');
        
        // 工具函数：显示元素
        function show(el) {
            if (!el) return;
            el.style.display = 'block';
            el.style.opacity = '0';
            setTimeout(() => {
                el.style.opacity = '1';
            }, 10);
        }
        
        // 工具函数：隐藏元素
        function hide(el) {
            if (!el) return;
            el.style.opacity = '0';
            setTimeout(() => {
                el.style.display = 'none';
            }, 300);
        }
        
        // 工具函数：高亮元素
        function highlight(el) {
            if (!el) return;
            el.style.stroke = '#c62828';
            el.style.strokeWidth = '4';
        }
        
        // 工具函数：取消高亮
        function unhighlight(el) {
            if (!el) return;
            const defaultStrokes = {
                'scene2-line-PA': '#000',
                'scene2-line-AC': '#000',
                'scene2-line-PC': '#000'
            };
            const defaultWidths = {
                'scene2-line-PA': '3',
                'scene2-line-AC': '3',
                'scene2-line-PC': '2'
            };
            const id = el.id;
            el.style.stroke = defaultStrokes[id] || '#000';
            el.style.strokeWidth = defaultWidths[id] || '2';
        }
        
        // 更新场景状态
        function updateScene() {
            // 重置所有高亮
            ['scene2-line-PA', 'scene2-line-AC', 'scene2-line-PC'].forEach(id => {
                unhighlight(document.getElementById(id));
            });
            
            // 隐藏所有动态元素
            hide(labelPC);
            hide(labelBC);
            hide(labelAC);
            hide(labelR);
            hide(formulaBox);
            hide(formulaText);
            hide(pythagorasBox);
            hide(pythagorasText);
            hide(rightangleABC);
            hide(pointB);
            hide(labelB);
            
            // 根据步骤显示对应元素
            switch(currentStep) {
                case 0:
                    // 初始状态：基础图形
                    stepIndicator.textContent = '步骤 0/5';
                    prevBtn.disabled = true;
                    nextBtn.disabled = false;
                    break;
                    
                case 1:
                    // 步骤 1：切割线定理
                    stepIndicator.textContent = '步骤 1/5';
                    highlight(linePC);
                    show(labelPC);
                    show(formulaBox);
                    show(formulaText);
                    formulaText.textContent = '切割线定理：PA² = PB × PC';
                    prevBtn.disabled = false;
                    nextBtn.disabled = false;
                    break;
                    
                case 2:
                    // 步骤 2：计算 BC
                    stepIndicator.textContent = '步骤 2/5';
                    highlight(lineBC);
                    show(labelBC);
                    show(formulaBox);
                    show(formulaText);
                    formulaText.textContent = 'BC = PC - PB = 4 - 1 = 3';
                    prevBtn.disabled = false;
                    nextBtn.disabled = false;
                    break;
                    
                case 3:
                    // 步骤 3：直径所对圆周角
                    stepIndicator.textContent = '步骤 3/5';
                    highlight(pointB);
                    show(pointB);
                    show(labelB);
                    show(rightangleABC);
                    show(formulaBox);
                    show(formulaText);
                    formulaText.textContent = '直径所对圆周角：∠ABC = 90°';
                    prevBtn.disabled = false;
                    nextBtn.disabled = false;
                    break;
                    
                case 4:
                    // 步骤 4：勾股定理求直径
                    stepIndicator.textContent = '步骤 4/5';
                    highlight(lineAC);
                    show(labelAC);
                    show(pythagorasBox);
                    show(pythagorasText);
                    pythagorasText.textContent = 'AC² = PA² + PC² = 2² + 4² = 20';
                    prevBtn.disabled = false;
                    nextBtn.disabled = false;
                    break;
                    
                case 5:
                    // 步骤 5：半径答案
                    stepIndicator.textContent = '步骤 5/5';
                    highlight(pointO);
                    show(labelR);
                    show(formulaBox);
                    show(formulaText);
                    formulaText.textContent = 'R = AC/2 = 2√3/2 = √3';
                    prevBtn.disabled = false;
                    nextBtn.disabled = true;
                    break;
            }
        }
        
        // 事件绑定
        prevBtn.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });
        
        nextBtn.addEventListener('click', () => {
            if (currentStep < currentStepMax) {
                currentStep++;
                updateScene();
            }
        });
        
        // 初始化
        updateScene();
    })();
    </script>
</body>
</html>
