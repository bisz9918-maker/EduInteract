<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 能量关系与电势差计算</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene2-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #333; border-radius: 4px; background: #f5f5f5; }
        .scene2-btn:hover { background: #e0e0e0; }
        .scene2-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene2-element { transition: opacity 0.3s ease; }
        @keyframes scene2-pulse {
            0%, 100% { stroke-width: 2; }
            50% { stroke-width: 4; }
        }
        @keyframes scene2-flash {
            0%, 100% { fill-opacity: 0.15; }
            50% { fill-opacity: 0.4; }
        }
        .scene2-pulse { animation: scene2-pulse 0.5s ease; }
        .scene2-flash { animation: scene2-flash 0.5s ease; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" id="scene2-svg">
            <!-- 电场线 -->
            <line x1="50" y1="80" x2="750" y2="80" stroke="#000" stroke-width="2"/>
            <polygon points="750,80 740,76 740,84" fill="#000"/>
            
            <line x1="50" y1="150" x2="750" y2="150" stroke="#000" stroke-width="2"/>
            <polygon points="750,150 740,146 740,154" fill="#000"/>
            
            <line x1="50" y1="220" x2="750" y2="220" stroke="#000" stroke-width="2"/>
            <polygon points="750,220 740,216 740,224" fill="#000"/>
            
            <line x1="50" y1="290" x2="750" y2="290" stroke="#000" stroke-width="2"/>
            <polygon points="750,290 740,286 740,294" fill="#000"/>
            
            <line x1="50" y1="360" x2="750" y2="360" stroke="#000" stroke-width="2"/>
            <polygon points="750,360 740,356 740,364" fill="#000"/>
            
            <!-- A 点 -->
            <circle id="scene2-point-A" cx="150" cy="350" r="6" fill="#000"/>
            <text id="scene2-label-A" x="130" y="355" font-size="16" fill="#000">A</text>
            
            <!-- B 点 -->
            <circle id="scene2-point-B" cx="600" cy="150" r="6" fill="#000"/>
            <text id="scene2-label-B" x="610" y="145" font-size="16" fill="#000">B</text>
            
            <!-- A 点速度箭头 v₀ -->
            <line id="scene2-arrow-v0" x1="150" y1="350" x2="150" y2="280" stroke="#000" stroke-width="2"/>
            <polygon id="scene2-arrowhead-v0" points="150,280 146,290 154,290" fill="#000"/>
            <text id="scene2-label-v0" x="135" y="270" font-size="16" fill="#000">v₀</text>
            
            <!-- B 点速度箭头 v_B=2v₀ -->
            <line id="scene2-arrow-vB" x1="600" y1="150" x2="670" y2="150" stroke="#000" stroke-width="2"/>
            <polygon id="scene2-arrowhead-vB" points="670,150 660,146 660,154" fill="#000"/>
            <text id="scene2-label-vB" x="680" y="145" font-size="16" fill="#000">v_B=2v₀</text>
            
            <!-- 步骤 1: 动能标注 -->
            <g id="scene2-group-kinetic" style="display: none;">
                <rect id="scene2-rect-EkA" x="180" y="320" width="100" height="30" fill="#1565c0" fill-opacity="0.15" stroke="#1565c0" stroke-width="2"/>
                <text id="scene2-label-EkA" x="230" y="365" font-size="14" fill="#000" text-anchor="middle">E<sub>kA</sub>=½mv₀²</text>
                
                <rect id="scene2-rect-EkB" x="630" y="120" width="120" height="30" fill="#1565c0" fill-opacity="0.15" stroke="#1565c0" stroke-width="2"/>
                <text id="scene2-label-EkB" x="690" y="165" font-size="14" fill="#000" text-anchor="middle">E<sub>kB</sub>=2mv₀²</text>
                
                <text id="scene2-label-dEk" x="400" y="220" font-size="16" fill="#000" text-anchor="middle">ΔE<sub>k</sub>=3mv₀²/2</text>
            </g>
            
            <!-- 步骤 2: 重力做功 -->
            <g id="scene2-group-gravity" style="display: none;">
                <line id="scene2-arrow-WG" x1="150" y1="350" x2="150" y2="200" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5"/>
                <polygon id="scene2-arrowhead-WG" points="150,200 146,210 154,210" fill="#c62828"/>
                <text id="scene2-label-WG" x="120" y="255" font-size="16" fill="#c62828">W<sub>G</sub>=-mv₀²/2</text>
                <text id="scene2-label-h" x="165" y="260" font-size="14" fill="#000">h=v₀²/(2g)</text>
            </g>
            
            <!-- 步骤 3: 电场力做功和动能定理 -->
            <g id="scene2-group-electric" style="display: none;">
                <line id="scene2-arrow-WE" x1="150" y1="350" x2="400" y2="350" stroke="#2e7d32" stroke-width="2"/>
                <polygon id="scene2-arrowhead-WE" points="400,350 390,346 390,354" fill="#2e7d32"/>
                <text id="scene2-label-WE" x="280" y="325" font-size="16" fill="#2e7d32">W<sub>E</sub>=2mv₀²</text>
                
                <rect id="scene2-rect-workenergy" x="300" y="80" width="250" height="35" fill="#fff9c4" fill-opacity="0.5" stroke="#000" stroke-width="2"/>
                <text id="scene2-label-workenergy" x="425" y="102" font-size="16" fill="#000" text-anchor="middle">W<sub>E</sub>+W<sub>G</sub>=ΔE<sub>k</sub></text>
            </g>
            
            <!-- 步骤 4: 电势差 -->
            <g id="scene2-group-potential" style="display: none;">
                <line id="scene2-arrow-UAB" x1="300" y1="250" x2="500" y2="250" stroke="#2e7d32" stroke-width="2"/>
                <polygon id="scene2-arrowhead-UAB1" points="300,250 310,246 310,254" fill="#2e7d32"/>
                <polygon id="scene2-arrowhead-UAB2" points="500,250 490,246 490,254" fill="#2e7d32"/>
                <text id="scene2-label-UAB" x="400" y="230" font-size="16" fill="#2e7d32" text-anchor="middle">U<sub>AB</sub>=2mv₀²/q</text>
            </g>
        </svg>
        
        <div id="scene2-controls">
            <button id="scene2-btn-prev" class="scene2-btn" disabled>◀ 上一步</button>
            <button id="scene2-btn-next" class="scene2-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现 - 能量关系与电势差计算
        // 布局坐标表对照：
        // | 元素 | 位置 | 备注 |
        // | A 点 | (150,350) | 实心圆 |
        // | B 点 | (600,150) | 实心圆 |
        // | 电场线 | y=80/150/220/290/360 | 5 条水平线 |
        // | v₀箭头 | (150,350)-(150,280) | 竖直向上 |
        // | v_B箭头 | (600,150)-(670,150) | 水平向右 |
        
        const MAX_STEP = 4;
        let currentStep = 0;
        
        // 获取 DOM 元素
        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        
        // 各步骤元素组
        const groupKinetic = document.getElementById('scene2-group-kinetic');
        const groupGravity = document.getElementById('scene2-group-gravity');
        const groupElectric = document.getElementById('scene2-group-electric');
        const groupPotential = document.getElementById('scene2-group-potential');
        
        // 动画元素
        const rectEkA = document.getElementById('scene2-rect-EkA');
        const rectEkB = document.getElementById('scene2-rect-EkB');
        const arrowWG = document.getElementById('scene2-arrow-WG');
        const arrowWE = document.getElementById('scene2-arrow-WE');
        const rectWorkEnergy = document.getElementById('scene2-rect-workenergy');
        const labelUAB = document.getElementById('scene2-label-UAB');
        
        // 显示/隐藏元素工具函数
        function show(el) {
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '0';
                setTimeout(() => { el.style.opacity = '1'; }, 10);
            }
        }
        
        function hide(el) {
            if (el) {
                el.style.opacity = '0';
                setTimeout(() => { el.style.display = 'none'; }, 300);
            }
        }
        
        // 脉冲动画
        function pulse(el) {
            if (el) {
                el.classList.remove('scene2-pulse');
                void el.offsetWidth; // 触发重绘
                el.classList.add('scene2-pulse');
            }
        }
        
        // 闪烁动画
        function flash(el, times = 2) {
            if (el) {
                let count = 0;
                const interval = setInterval(() => {
                    el.classList.remove('scene2-flash');
                    void el.offsetWidth;
                    el.classList.add('scene2-flash');
                    count++;
                    if (count >= times) clearInterval(interval);
                }, 500);
            }
        }
        
        // 更新场景显示
        function updateScene() {
            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === MAX_STEP);
            
            // 根据当前步骤显示/隐藏元素
            if (currentStep >= 1) {
                show(groupKinetic);
                // 步骤 1 首次进入时触发动画
                if (currentStep === 1) {
                    flash(rectEkA, 2);
                    flash(rectEkB, 2);
                }
            } else {
                hide(groupKinetic);
            }
            
            if (currentStep >= 2) {
                show(groupGravity);
                // 步骤 2 首次进入时触发动画
                if (currentStep === 2) {
                    pulse(arrowWG);
                }
            } else {
                hide(groupGravity);
            }
            
            if (currentStep >= 3) {
                show(groupElectric);
                // 步骤 3 首次进入时触发动画
                if (currentStep === 3) {
                    pulse(arrowWE);
                    rectWorkEnergy.style.fill = '#fff9c4';
                    rectWorkEnergy.style.fillOpacity = '0.7';
                }
            } else {
                hide(groupElectric);
            }
            
            if (currentStep >= 4) {
                show(groupPotential);
                // 步骤 4 首次进入时触发动画
                if (currentStep === 4) {
                    flash(labelUAB, 2);
                }
            } else {
                hide(groupPotential);
            }
        }
        
        // 按钮事件绑定
        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });
        
        btnNext.addEventListener('click', () => {
            if (currentStep < MAX_STEP) {
                currentStep++;
                updateScene();
            }
        });
        
        // 初始化场景
        updateScene();
    })();
    </script>
</body>
</html>
