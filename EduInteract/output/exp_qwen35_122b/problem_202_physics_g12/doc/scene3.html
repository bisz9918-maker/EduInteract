<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 3 - 磁场中圆周运动轨迹</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Segoe UI', Arial, sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 15px; z-index: 10; }
        .scene3-btn { padding: 8px 16px; border: none; border-radius: 4px; font-size: 14px; cursor: pointer; transition: all 0.2s; }
        .scene3-btn-prev { background: #9e9e9e; color: white; }
        .scene3-btn-prev:hover:not(:disabled) { background: #757575; }
        .scene3-btn-next { background: #1976d2; color: white; }
        .scene3-btn-next:hover:not(:disabled) { background: #1565c0; }
        .scene3-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene3-step-indicator { font-size: 14px; color: #424242; font-weight: bold; }
        svg { display: block; }
        .scene3-text { font-size: 14px; fill: #000000; }
        .scene3-axis { stroke: #000000; stroke-width: 2; fill: none; }
        .scene3-magnetic-symbol { fill: #000000; font-size: 12px; }
        .scene3-electric-arrow { stroke: #1565c0; stroke-width: 2; fill: none; }
        .scene3-point { fill: #c62828; }
        .scene3-center-point { fill: #2e7d32; }
        .scene3-velocity { stroke: #2e7d32; stroke-width: 2; fill: none; }
        .scene3-trajectory { stroke: #c62828; stroke-width: 2.5; fill: none; }
        .scene3-trajectory-dashed { stroke: #c62828; stroke-width: 2; fill: none; stroke-dasharray: 5,5; }
        .scene3-radius-line { stroke: #888888; stroke-width: 1; fill: none; stroke-dasharray: 5,3; }
        .scene3-center-line { stroke: #000000; stroke-width: 1; }
        .scene3-label { font-size: 14px; fill: #000000; }
        .scene3-formula { font-size: 14px; fill: #000000; font-family: 'Times New Roman', serif; font-style: italic; }
        .scene3-highlight { animation: scene3-highlight 0.5s ease-in-out; }
        @keyframes scene3-highlight {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg id="scene3-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 坐标轴 -->
            <line id="scene3-axis-x" class="scene3-axis" x1="200" y1="250" x2="700" y2="250"/>
            <line id="scene3-axis-y" class="scene3-axis" x1="500" y1="100" x2="500" y2="400"/>
            <polygon id="scene3-axis-x-arrow" points="700,250 690,245 690,255" fill="#000000"/>
            <polygon id="scene3-axis-y-arrow" points="500,100 495,110 505,110" fill="#000000"/>
            
            <!-- 轴标签 -->
            <text id="scene3-label-x" class="scene3-label" x="680" y="235">x</text>
            <text id="scene3-label-y" class="scene3-label" x="515" y="110">y</text>
            <text id="scene3-label-O" class="scene3-label" x="510" y="255">O</text>
            
            <!-- x=-2L 边界线 -->
            <line id="scene3-line-x2L" class="scene3-center-line" x1="300" y1="100" x2="300" y2="400"/>
            <text id="scene3-label-x2L" class="scene3-label" x="260" y="90">x=-2L</text>
            
            <!-- 磁场区域标识 (用虚线框表示，避开标签) -->
            <rect id="scene3-magnetic-border" class="scene3-center-line" x="520" y="130" width="160" height="240" fill="none" stroke-dasharray="5,5"/>
            <text id="scene3-label-magnetic" class="scene3-label" x="530" y="120" font-style="italic">磁场 B</text>
            
            <!-- 磁场符号× (网格分布，避开标签) -->
            <g id="scene3-magnetic-symbols">
                <!-- 行 1: y=150,190,230,270 -->
                <text class="scene3-magnetic-symbol" x="540" y="155">×</text>
                <text class="scene3-magnetic-symbol" x="580" y="155">×</text>
                <text class="scene3-magnetic-symbol" x="620" y="155">×</text>
                <text class="scene3-magnetic-symbol" x="660" y="155">×</text>
                <text class="scene3-magnetic-symbol" x="700" y="155">×</text>
                <text class="scene3-magnetic-symbol" x="540" y="195">×</text>
                <text class="scene3-magnetic-symbol" x="580" y="195">×</text>
                <text class="scene3-magnetic-symbol" x="620" y="195">×</text>
                <text class="scene3-magnetic-symbol" x="660" y="195">×</text>
                <text class="scene3-magnetic-symbol" x="700" y="195">×</text>
                <text class="scene3-magnetic-symbol" x="540" y="235">×</text>
                <text class="scene3-magnetic-symbol" x="580" y="235">×</text>
                <text class="scene3-magnetic-symbol" x="620" y="235">×</text>
                <text class="scene3-magnetic-symbol" x="660" y="235">×</text>
                <text class="scene3-magnetic-symbol" x="700" y="235">×</text>
                <text class="scene3-magnetic-symbol" x="540" y="275">×</text>
                <text class="scene3-magnetic-symbol" x="580" y="275">×</text>
                <text class="scene3-magnetic-symbol" x="620" y="275">×</text>
                <text class="scene3-magnetic-symbol" x="660" y="275">×</text>
                <text class="scene3-magnetic-symbol" x="700" y="275">×</text>
                <!-- 行 2: y=310,350,390 -->
                <text class="scene3-magnetic-symbol" x="540" y="315">×</text>
                <text class="scene3-magnetic-symbol" x="580" y="315">×</text>
                <text class="scene3-magnetic-symbol" x="620" y="315">×</text>
                <text class="scene3-magnetic-symbol" x="660" y="315">×</text>
                <text class="scene3-magnetic-symbol" x="700" y="315">×</text>
                <text class="scene3-magnetic-symbol" x="540" y="355">×</text>
                <text class="scene3-magnetic-symbol" x="580" y="355">×</text>
                <text class="scene3-magnetic-symbol" x="620" y="355">×</text>
                <text class="scene3-magnetic-symbol" x="660" y="355">×</text>
                <text class="scene3-magnetic-symbol" x="700" y="355">×</text>
                <text class="scene3-magnetic-symbol" x="540" y="395">×</text>
                <text class="scene3-magnetic-symbol" x="580" y="395">×</text>
                <text class="scene3-magnetic-symbol" x="620" y="395">×</text>
                <text class="scene3-magnetic-symbol" x="660" y="395">×</text>
                <text class="scene3-magnetic-symbol" x="700" y="395">×</text>
            </g>
            
            <!-- 电场箭头 -->
            <g id="scene3-electric-arrows">
                <!-- 上方电场箭头 (y>0) 向上 -->
                <line class="scene3-electric-arrow" x1="350" y1="200" x2="350" y2="170"/>
                <polygon points="350,170 345,180 355,180" fill="#1565c0"/>
                <!-- 下方电场箭头 (y<0) 向下 -->
                <line class="scene3-electric-arrow" x1="400" y1="300" x2="400" y2="330"/>
                <polygon points="400,330 395,320 405,320" fill="#1565c0"/>
            </g>
            <text id="scene3-label-E1" class="scene3-label" x="370" y="160">E</text>
            <text id="scene3-label-E2" class="scene3-label" x="410" y="350">E</text>
            
            <!-- A'点 (0,-L) -->
            <circle id="scene3-point-A" class="scene3-point" cx="500" cy="350" r="4"/>
            <text id="scene3-label-A" class="scene3-label" x="470" y="365">A'(0,-L)</text>
            
            <!-- 入射速度 v₀ -->
            <g id="scene3-velocity-in">
                <line class="scene3-velocity" x1="470" y1="350" x2="500" y2="350"/>
                <polygon points="500,350 490,345 490,355" fill="#2e7d32"/>
            </g>
            <text id="scene3-label-v0-in" class="scene3-label" x="475" y="335">v₀</text>
            
            <!-- 磁感应强度公式 (移到右上角空白处) -->
            <text id="scene3-formula-B" class="scene3-formula" x="540" y="140">B=8mv₀/(5qL)</text>
            
            <!-- 圆心 O' (步骤 1 显示) -->
            <circle id="scene3-point-O" class="scene3-center-point" cx="500" cy="382.5" r="5" style="display:none;"/>
            <text id="scene3-label-O-center" class="scene3-label" x="515" y="395" style="display:none;">O'(0,-13L/8)</text>
            
            <!-- 半径线 (步骤 1 显示) -->
            <line id="scene3-radius-line" class="scene3-radius-line" x1="500" y1="350" x2="500" y2="382.5" style="display:none;"/>
            <text id="scene3-label-R" class="scene3-label" x="520" y="365" style="display:none;">R=5L/8</text>
            
            <!-- 半圆轨迹 (步骤 2 显示) -->
            <path id="scene3-arc-half" class="scene3-trajectory" d="M 500 350 A 32.5 32.5 0 0 1 500 415" style="display:none; stroke-dasharray: 100; stroke-dashoffset: 100;"/>
            
            <!-- B 点 (步骤 2 显示) -->
            <circle id="scene3-point-B" class="scene3-point" cx="500" cy="415" r="4" style="display:none;"/>
            <text id="scene3-label-B" class="scene3-label" x="515" y="425" style="display:none;">B(0,-9L/4)</text>
            
            <!-- 离开速度 v₀ (步骤 3 显示) -->
            <g id="scene3-velocity-out" style="display:none;">
                <line class="scene3-velocity" x1="500" y1="415" x2="470" y2="415"/>
                <polygon points="470,415 480,410 480,420" fill="#2e7d32"/>
            </g>
            
            <!-- 返回轨迹 (步骤 4 显示) -->
            <path id="scene3-return-path" class="scene3-trajectory-dashed" d="M 500 415 Q 400 450 300 500" style="display:none; stroke-dasharray: 150; stroke-dashoffset: 150;"/>
            
            <!-- 终点 (步骤 5 显示) - 调整位置避免裁切 -->
            <circle id="scene3-point-end" class="scene3-point" cx="300" cy="485" r="4" style="display:none;"/>
            <text id="scene3-label-end" class="scene3-label" x="240" y="495" style="display:none;">(-2L,-3L)</text>
        </svg>
        
        <div id="scene3-controls">
            <button id="scene3-btn-prev" class="scene3-btn scene3-btn-prev">◀ 上一步</button>
            <span id="scene3-step-indicator">步骤 1/6</span>
            <button id="scene3-btn-next" class="scene3-btn scene3-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 3 实现 - 磁场中圆周运动轨迹与返回位置
        
        const scene3 = {
            currentStep: 0,
            totalSteps: 6,
            svg: null,
            elements: {},
            animations: {}
        };
        
        // 元素显示步骤定义
        const scene3Elements = {
            // 步骤 0: 基础元素
            'scene3-axis-x': { showInSteps: [0,1,2,3,4,5] },
            'scene3-axis-y': { showInSteps: [0,1,2,3,4,5] },
            'scene3-axis-x-arrow': { showInSteps: [0,1,2,3,4,5] },
            'scene3-axis-y-arrow': { showInSteps: [0,1,2,3,4,5] },
            'scene3-label-x': { showInSteps: [0,1,2,3,4,5] },
            'scene3-label-y': { showInSteps: [0,1,2,3,4,5] },
            'scene3-label-O': { showInSteps: [0,1,2,3,4,5] },
            'scene3-line-x2L': { showInSteps: [0,1,2,3,4,5] },
            'scene3-label-x2L': { showInSteps: [0,1,2,3,4,5] },
            'scene3-magnetic-border': { showInSteps: [0,1,2,3,4,5] },
            'scene3-label-magnetic': { showInSteps: [0,1,2,3,4,5] },
            'scene3-magnetic-symbols': { showInSteps: [0,1,2,3,4,5] },
            'scene3-electric-arrows': { showInSteps: [0,1,2,3,4,5] },
            'scene3-label-E1': { showInSteps: [0,1,2,3,4,5] },
            'scene3-label-E2': { showInSteps: [0,1,2,3,4,5] },
            'scene3-point-A': { showInSteps: [0,1,2,3,4,5] },
            'scene3-label-A': { showInSteps: [0,1,2,3,4,5] },
            'scene3-velocity-in': { showInSteps: [0,1,2,3,4,5] },
            'scene3-label-v0-in': { showInSteps: [0,1,2,3,4,5] },
            'scene3-formula-B': { showInSteps: [0,1,2,3,4,5] },
            
            // 步骤 1: 圆心和半径
            'scene3-point-O': { showInSteps: [1,2,3,4,5] },
            'scene3-label-O-center': { showInSteps: [1,2,3,4,5] },
            'scene3-radius-line': { showInSteps: [1,2,3,4,5] },
            'scene3-label-R': { showInSteps: [1,2,3,4,5] },
            
            // 步骤 2: 半圆轨迹和 B 点
            'scene3-arc-half': { showInSteps: [2,3,4,5], animate: true },
            'scene3-point-B': { showInSteps: [2,3,4,5] },
            'scene3-label-B': { showInSteps: [2,3,4,5] },
            
            // 步骤 3: 离开速度
            'scene3-velocity-out': { showInSteps: [3,4,5] },
            
            // 步骤 4: 返回轨迹
            'scene3-return-path': { showInSteps: [4,5], animate: true },
            
            // 步骤 5: 终点
            'scene3-point-end': { showInSteps: [5] },
            'scene3-label-end': { showInSteps: [5] }
        };
        
        // 初始化
        function scene3Init() {
            scene3.svg = document.getElementById('scene3-svg');
            
            // 绑定按钮事件
            document.getElementById('scene3-btn-prev').addEventListener('click', scene3PrevStep);
            document.getElementById('scene3-btn-next').addEventListener('click', scene3NextStep);
            
            // 初始渲染
            scene3RenderStep();
        }
        
        // 渲染当前步骤
        function scene3RenderStep() {
            // 更新所有元素的显示状态
            for (const [id, config] of Object.entries(scene3Elements)) {
                const el = document.getElementById(id);
                if (!el) continue;
                
                if (config.showInSteps.includes(scene3.currentStep)) {
                    el.style.display = '';
                    el.style.opacity = '1';
                    // 如果是动画元素，触发动画
                    if (config.animate && scene3.currentStep === config.showInSteps[0]) {
                        scene3AnimateElement(el);
                    }
                } else {
                    el.style.display = 'none';
                    el.style.opacity = '0';
                }
            }
            
            // 更新步骤指示器
            document.getElementById('scene3-step-indicator').textContent = 
                `步骤 ${scene3.currentStep + 1}/${scene3.totalSteps}`;
            
            // 更新按钮状态
            document.getElementById('scene3-btn-prev').disabled = scene3.currentStep === 0;
            document.getElementById('scene3-btn-next').disabled = scene3.currentStep === scene3.totalSteps - 1;
        }
        
        // 元素动画
        function scene3AnimateElement(el) {
            if (!el.classList.contains('scene3-trajectory') && 
                !el.classList.contains('scene3-trajectory-dashed')) {
                return;
            }
            
            // 获取轨迹长度
            const length = el.getTotalLength();
            el.style.strokeDasharray = length;
            el.style.strokeDashoffset = length;
            
            // 动画
            const duration = 400;
            const startTime = performance.now();
            
            function animate(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                el.style.strokeDashoffset = length * (1 - progress);
                
                if (progress < 1) {
                    requestAnimationFrame(animate);
                }
            }
            
            requestAnimationFrame(animate);
        }
        
        // 上一步
        function scene3PrevStep() {
            if (scene3.currentStep > 0) {
                scene3.currentStep--;
                scene3RenderStep();
            }
        }
        
        // 下一步
        function scene3NextStep() {
            if (scene3.currentStep < scene3.totalSteps - 1) {
                scene3.currentStep++;
                scene3RenderStep();
            }
        }
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', scene3Init);
    })();
    </script>
</body>
</html>
