<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>带电粒子在平行板电场中的偏转运动</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 16px; z-index: 10; }
        .scene1-btn { padding: 8px 20px; font-size: 14px; background: #1976d2; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .scene1-btn:disabled { background: #bdbdbd; cursor: not-allowed; }
        .scene1-btn:hover:not(:disabled) { background: #1565c0; }
        #scene1-step-indicator { font-size: 14px; color: #424242; min-width: 80px; text-align: center; }
        .scene1-label { font-size: 14px; fill: #000000; }
        .scene1-label-small { font-size: 12px; fill: #000000; }
        .scene1-label-bold { font-size: 16px; font-weight: bold; fill: #000000; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- 平行板 A -->
            <rect id="scene1-plate-A" x="150" y="200" width="160" height="10" fill="#000000" opacity="1"/>
            <rect id="scene1-plate-A-highlight" x="150" y="200" width="160" height="10" fill="#ffcdd2" opacity="0"/>
            
            <!-- 平行板 B -->
            <rect id="scene1-plate-B" x="150" y="290" width="160" height="10" fill="#000000" opacity="1"/>
            <rect id="scene1-plate-B-highlight" x="150" y="290" width="160" height="10" fill="#ffcdd2" opacity="0"/>
            
            <!-- 中心线 RD -->
            <line id="scene1-centerline" x1="100" y1="250" x2="700" y2="250" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
            
            <!-- 界面 MN -->
            <line id="scene1-mn" x1="310" y1="150" x2="310" y2="350" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
            
            <!-- 界面 PS -->
            <line id="scene1-ps" x1="550" y1="150" x2="550" y2="350" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
            
            <!-- 入射点 R -->
            <circle id="scene1-point-R" cx="120" cy="250" r="4" fill="#000000" opacity="0"/>
            
            <!-- 点 D -->
            <circle id="scene1-point-D" cx="550" cy="250" r="4" fill="#000000" opacity="0"/>
            
            <!-- 出射点 P -->
            <circle id="scene1-point-P" cx="550" cy="370" r="4" fill="#1565c0" opacity="0"/>
            <circle id="scene1-point-P-flash" cx="550" cy="370" r="8" fill="none" stroke="#1565c0" stroke-width="2" opacity="0"/>
            
            <!-- 粒子轨迹 -->
            <path id="scene1-trajectory-part1" d="M 120,250 Q 215,265 310,280" stroke="#1565c0" stroke-width="2" fill="none" opacity="0"/>
            <path id="scene1-trajectory-part2" d="M 310,280 L 550,370" stroke="#1565c0" stroke-width="2" fill="none" opacity="0"/>
            
            <!-- 速度 v₀ -->
            <g id="scene1-vec-v0" opacity="0">
                <line x1="130" y1="250" x2="180" y2="250" stroke="#2e7d32" stroke-width="2"/>
                <polygon points="180,250 170,245 170,255" fill="#2e7d32"/>
            </g>
            
            <!-- 速度 v -->
            <g id="scene1-vec-v" opacity="0">
                <line x1="310" y1="280" x2="350" y2="310" stroke="#2e7d32" stroke-width="2"/>
                <polygon points="350,310 340,305 340,315" fill="#2e7d32"/>
            </g>
            
            <!-- 电场箭头 -->
            <g id="scene1-field-arrow" opacity="0">
                <line x1="230" y1="210" x2="230" y2="240" stroke="#c62828" stroke-width="2"/>
                <polygon points="230,240 225,230 235,230" fill="#c62828"/>
            </g>
            
            <!-- y₁标注线 -->
            <g id="scene1-y1-line" opacity="0">
                <line x1="310" y1="250" x2="310" y2="280" stroke="#c62828" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="305" y1="250" x2="315" y2="250" stroke="#c62828" stroke-width="1"/>
                <line x1="305" y1="280" x2="315" y2="280" stroke="#c62828" stroke-width="1"/>
            </g>
            
            <!-- Y 标注线 -->
            <g id="scene1-Y-line" opacity="0">
                <line x1="550" y1="250" x2="550" y2="370" stroke="#c62828" stroke-width="1" stroke-dasharray="3,3"/>
                <line x1="545" y1="250" x2="555" y2="250" stroke="#c62828" stroke-width="1"/>
                <line x1="545" y1="370" x2="555" y2="370" stroke="#c62828" stroke-width="1"/>
            </g>
            
            <!-- 角度θ弧线 -->
            <path id="scene1-angle-arc" d="M 335,280 A 30,30 0 0 1 332,304" stroke="#1565c0" stroke-width="1" fill="none" opacity="0"/>
            
            <!-- 尺寸标注 L=8cm -->
            <g id="scene1-dim-L">
                <line x1="150" y1="320" x2="310" y2="320" stroke="#000000" stroke-width="1"/>
                <line x1="150" y1="315" x2="150" y2="325" stroke="#000000" stroke-width="1"/>
                <line x1="310" y1="315" x2="310" y2="325" stroke="#000000" stroke-width="1"/>
                <polygon points="150,320 145,317 145,323" fill="#000000"/>
                <polygon points="310,320 315,317 315,323" fill="#000000"/>
            </g>
            
            <!-- 尺寸标注 d=8cm -->
            <g id="scene1-dim-d">
                <line x1="340" y1="210" x2="340" y2="290" stroke="#000000" stroke-width="1"/>
                <line x1="335" y1="210" x2="345" y2="210" stroke="#000000" stroke-width="1"/>
                <line x1="335" y1="290" x2="345" y2="290" stroke="#000000" stroke-width="1"/>
                <polygon points="340,210 337,215 343,215" fill="#000000"/>
                <polygon points="340,290 343,285 337,285" fill="#000000"/>
            </g>
            
            <!-- 尺寸标注 12cm -->
            <g id="scene1-dim-12cm">
                <line x1="310" y1="180" x2="550" y2="180" stroke="#000000" stroke-width="1"/>
                <line x1="310" y1="175" x2="310" y2="185" stroke="#000000" stroke-width="1"/>
                <line x1="550" y1="175" x2="550" y2="185" stroke="#000000" stroke-width="1"/>
                <polygon points="310,180 305,177 305,183" fill="#000000"/>
                <polygon points="550,180 555,177 555,183" fill="#000000"/>
            </g>
            
            <!-- 标签 -->
            <text id="scene1-label-A" x="130" y="195" class="scene1-label-bold">A</text>
            <text id="scene1-label-B" x="130" y="305" class="scene1-label-bold">B</text>
            <text id="scene1-label-R" x="105" y="245" class="scene1-label">R</text>
            <text id="scene1-label-D" x="560" y="245" class="scene1-label">D</text>
            <text id="scene1-label-M" x="305" y="145" class="scene1-label">M</text>
            <text id="scene1-label-N" x="305" y="355" class="scene1-label">N</text>
            <text id="scene1-label-P" x="560" y="365" class="scene1-label">P</text>
            <text id="scene1-label-S" x="560" y="380" class="scene1-label">S</text>
            <text id="scene1-label-L" x="230" y="335" class="scene1-label-small">L=8cm</text>
            <text id="scene1-label-d" x="350" y="250" class="scene1-label-small">d=8cm</text>
            <text id="scene1-label-12cm" x="430" y="170" class="scene1-label-small">12cm</text>
            <text id="scene1-label-v0" x="155" y="235" class="scene1-label-small" opacity="0">v₀</text>
            <text id="scene1-label-v" x="355" y="305" class="scene1-label-small" opacity="0">v</text>
            <text id="scene1-label-y1" x="325" y="275" class="scene1-label-small" opacity="0">y₁</text>
            <text id="scene1-label-Y" x="570" y="310" class="scene1-label-small" opacity="0">Y</text>
            <text id="scene1-label-theta" x="345" y="265" class="scene1-label-small" opacity="0">θ</text>
            <text id="scene1-label-E" x="220" y="225" class="scene1-label-small" opacity="0">E</text>
            
            <!-- 公式标注 -->
            <text id="scene1-formula-E" x="240" y="225" class="scene1-label-small" opacity="0">E=3750V/m</text>
            <text id="scene1-formula-params" x="120" y="270" class="scene1-label-small" opacity="0">q=10⁻¹⁰C, m=10⁻²⁰kg</text>
            <text id="scene1-formula-y1" x="310" y="300" class="scene1-label-small" opacity="0">y₁=3cm</text>
            <text id="scene1-formula-theta" x="310" y="330" class="scene1-label-small" opacity="0">tanθ=0.75, θ≈37°</text>
            <text id="scene1-formula-Y" x="560" y="390" class="scene1-label-small" opacity="0">Y=12cm</text>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 0/5</span>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        const scene1 = {
            currentStep: 0,
            maxStep: 5,
            
            // 元素可见性配置
            elementVisibility: {
                0: {
                    visible: ['plate-A', 'plate-B', 'centerline', 'mn', 'ps', 'point-R', 'point-D', 
                              'label-A', 'label-B', 'label-R', 'label-D', 'label-M', 'label-N', 
                              'label-P', 'label-S', 'dim-L', 'dim-d', 'dim-12cm'],
                    hidden: ['plate-A-highlight', 'plate-B-highlight', 'vec-v0', 'vec-v', 'field-arrow',
                            'trajectory-part1', 'trajectory-part2', 'point-P', 'point-P-flash',
                            'y1-line', 'Y-line', 'angle-arc',
                            'label-v0', 'label-v', 'label-y1', 'label-Y', 'label-theta', 'label-E',
                            'formula-E', 'formula-params', 'formula-y1', 'formula-theta', 'formula-Y']
                },
                1: {
                    visible: ['plate-A', 'plate-B', 'centerline', 'mn', 'ps', 'point-R', 'point-D',
                              'plate-A-highlight', 'plate-B-highlight', 'field-arrow',
                              'label-A', 'label-B', 'label-R', 'label-D', 'label-M', 'label-N',
                              'label-P', 'label-S', 'dim-L', 'dim-d', 'dim-12cm', 'label-E', 'formula-E'],
                    hidden: ['vec-v0', 'vec-v', 'trajectory-part1', 'trajectory-part2', 'point-P', 'point-P-flash',
                            'y1-line', 'Y-line', 'angle-arc',
                            'label-v0', 'label-v', 'label-y1', 'label-Y', 'label-theta',
                            'formula-params', 'formula-y1', 'formula-theta', 'formula-Y']
                },
                2: {
                    visible: ['plate-A', 'plate-B', 'centerline', 'mn', 'ps', 'point-R', 'point-D',
                              'plate-A-highlight', 'plate-B-highlight', 'field-arrow', 'vec-v0',
                              'label-A', 'label-B', 'label-R', 'label-D', 'label-M', 'label-N',
                              'label-P', 'label-S', 'dim-L', 'dim-d', 'dim-12cm', 'label-E', 'label-v0', 'formula-E', 'formula-params'],
                    hidden: ['vec-v', 'trajectory-part1', 'trajectory-part2', 'point-P', 'point-P-flash',
                            'y1-line', 'Y-line', 'angle-arc',
                            'label-v', 'label-y1', 'label-Y', 'label-theta',
                            'formula-y1', 'formula-theta', 'formula-Y']
                },
                3: {
                    visible: ['plate-A', 'plate-B', 'centerline', 'mn', 'ps', 'point-R', 'point-D',
                              'plate-A-highlight', 'plate-B-highlight', 'field-arrow', 'vec-v0', 'trajectory-part1', 'y1-line',
                              'label-A', 'label-B', 'label-R', 'label-D', 'label-M', 'label-N',
                              'label-P', 'label-S', 'dim-L', 'dim-d', 'dim-12cm', 'label-E', 'label-v0', 'label-y1', 'formula-E', 'formula-params', 'formula-y1'],
                    hidden: ['vec-v', 'trajectory-part2', 'point-P', 'point-P-flash', 'Y-line', 'angle-arc',
                            'label-v', 'label-Y', 'label-theta',
                            'formula-theta', 'formula-Y']
                },
                4: {
                    visible: ['plate-A', 'plate-B', 'centerline', 'mn', 'ps', 'point-R', 'point-D',
                              'plate-A-highlight', 'plate-B-highlight', 'field-arrow', 'vec-v0', 'trajectory-part1', 'trajectory-part2', 'point-P', 'y1-line', 'vec-v', 'angle-arc',
                              'label-A', 'label-B', 'label-R', 'label-D', 'label-M', 'label-N',
                              'label-P', 'label-S', 'dim-L', 'dim-d', 'dim-12cm', 'label-E', 'label-v0', 'label-v', 'label-y1', 'label-theta', 'formula-E', 'formula-params', 'formula-y1', 'formula-theta'],
                    hidden: ['point-P-flash', 'Y-line', 'label-Y', 'formula-Y']
                },
                5: {
                    visible: ['plate-A', 'plate-B', 'centerline', 'mn', 'ps', 'point-R', 'point-D',
                              'plate-A-highlight', 'plate-B-highlight', 'field-arrow', 'vec-v0', 'trajectory-part1', 'trajectory-part2', 'point-P', 'point-P-flash', 'y1-line', 'Y-line', 'vec-v', 'angle-arc',
                              'label-A', 'label-B', 'label-R', 'label-D', 'label-M', 'label-N',
                              'label-P', 'label-S', 'dim-L', 'dim-d', 'dim-12cm', 'label-E', 'label-v0', 'label-v', 'label-y1', 'label-Y', 'label-theta', 'formula-E', 'formula-params', 'formula-y1', 'formula-theta', 'formula-Y']
                }
            },
            
            // 更新元素可见性
            updateVisibility: function() {
                const config = this.elementVisibility[this.currentStep];
                
                // 先隐藏所有元素
                config.hidden.forEach(id => {
                    const el = document.getElementById('scene1-' + id);
                    if (el) {
                        el.style.opacity = '0';
                        el.style.display = 'none';
                    }
                });
                
                // 再显示需要的元素
                config.visible.forEach(id => {
                    const el = document.getElementById('scene1-' + id);
                    if (el) {
                        el.style.display = '';
                        // 使用 requestAnimationFrame 实现淡入效果
                        requestAnimationFrame(() => {
                            el.style.opacity = '1';
                        });
                    }
                });
                
                // 更新步骤指示器
                document.getElementById('scene1-step-indicator').textContent = '步骤 ' + this.currentStep + '/' + this.maxStep;
                
                // 更新按钮状态
                document.getElementById('scene1-btn-prev').disabled = (this.currentStep === 0);
                document.getElementById('scene1-btn-next').disabled = (this.currentStep === this.maxStep);
            },
            
            // 下一步
            nextStep: function() {
                if (this.currentStep < this.maxStep) {
                    this.currentStep++;
                    this.updateVisibility();
                }
            },
            
            // 上一步
            prevStep: function() {
                if (this.currentStep > 0) {
                    this.currentStep--;
                    this.updateVisibility();
                }
            },
            
            // 初始化
            init: function() {
                document.getElementById('scene1-btn-next').addEventListener('click', () => this.nextStep());
                document.getElementById('scene1-btn-prev').addEventListener('click', () => this.prevStep());
                this.updateVisibility();
            }
        };
        
        scene1.init();
    })();
    </script>
</body>
</html>
