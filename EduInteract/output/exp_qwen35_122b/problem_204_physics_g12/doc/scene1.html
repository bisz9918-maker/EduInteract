<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>转盘系统示意图与受力分析 - Scene 1</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; gap: 140px; z-index: 10; }
        #scene1-btnPrev, #scene1-btnNext {
            padding: 8px 20px;
            font-size: 14px;
            cursor: pointer;
            border: 2px solid #333;
            border-radius: 4px;
            background: #f5f5f5;
            transition: all 0.2s;
        }
        #scene1-btnPrev:hover, #scene1-btnNext:hover { background: #e0e0e0; }
        #scene1-btnPrev:disabled, #scene1-btnNext:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene1-step-group { opacity: 0; transition: opacity 0.3s ease; }
        .scene1-step-group.visible { opacity: 1; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 步骤 0：基础系统结构 -->
            <g id="scene1-step0" class="scene1-step-group visible">
                <!-- 圆盘：水平椭圆表现透视（进一步缩小短轴避免标签重叠） -->
                <ellipse id="scene1-disc" cx="400" cy="250" rx="180" ry="45" fill="none" stroke="#000000" stroke-width="2"/>
                
                <!-- 转轴：垂直矩形穿过圆心 -->
                <rect id="scene1-axis" x="395" y="150" width="10" height="200" fill="#000000"/>
                
                <!-- 物体 B：内侧方块（移到椭圆上方） -->
                <rect id="scene1-objB" x="470" y="235" width="20" height="20" fill="#1565c0" fill-opacity="0.2" stroke="#000000" stroke-width="1.5"/>
                
                <!-- 物体 A：外侧方块（移到椭圆上方） -->
                <rect id="scene1-objA" x="610" y="235" width="20" height="20" fill="#1565c0" fill-opacity="0.2" stroke="#000000" stroke-width="1.5"/>
                
                <!-- 细线 OB：连接圆心与 B -->
                <line id="scene1-lineOB" x1="400" y1="250" x2="480" y2="245" stroke="#000000" stroke-width="2"/>
                
                <!-- 细线 BA：连接 B 与 A -->
                <line id="scene1-lineBA" x1="480" y1="245" x2="620" y2="245" stroke="#000000" stroke-width="2"/>
                
                <!-- 转动箭头：逆时针方向 -->
                <path id="scene1-rotateArrow" d="M 400 170 A 60 60 0 0 1 360 210" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrowhead)"/>
                <defs>
                    <marker id="scene1-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                        <path d="M 0 0 L 9 3 L 0 6" fill="#000000"/>
                    </marker>
                </defs>
                
                <!-- 标签 O：圆心上方 -->
                <text id="scene1-labelO" x="385" y="235" font-size="16" fill="#000000">O</text>
                
                <!-- 标签 B：物体 B 上方 -->
                <text id="scene1-labelB" x="475" y="220" font-size="16" fill="#000000">B</text>
                
                <!-- 标签 A：物体 A 上方 -->
                <text id="scene1-labelA" x="615" y="220" font-size="16" fill="#000000">A</text>
                
                <!-- 标签 ω：转动方向 -->
                <text id="scene1-labelOmega" x="400" y="120" font-size="16" fill="#000000" text-anchor="middle">ω</text>
            </g>
            
            <!-- 步骤 1：距离标注 -->
            <g id="scene1-step1" class="scene1-step-group">
                <!-- 距离标注线 r_B：绿色（移到椭圆下方） -->
                <line id="scene1-distB" x1="400" y1="340" x2="480" y2="340" stroke="#2e7d32" stroke-width="2"/>
                <text id="scene1-labelrB" x="440" y="360" font-size="14" fill="#2e7d32" text-anchor="middle">r_B=10cm</text>
                
                <!-- 距离标注线 r_A：绿色（移到椭圆下方） -->
                <line id="scene1-distA" x1="400" y1="365" x2="620" y2="365" stroke="#2e7d32" stroke-width="2"/>
                <text id="scene1-labelrA" x="510" y="385" font-size="14" fill="#2e7d32" text-anchor="middle">r_A=20cm</text>
                
                <!-- 辅助虚线 -->
                <line x1="400" y1="340" x2="400" y2="365" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
            </g>
            
            <!-- 步骤 2：向心力箭头 -->
            <g id="scene1-step2" class="scene1-step-group">
                <!-- 向心力箭头 A：红色，从 A 指向圆心 -->
                <line id="scene1-forceA" x1="620" y1="245" x2="400" y2="250" stroke="#c62828" stroke-width="4" marker-end="url(#scene1-forceArrow)"/>
                
                <!-- 向心力箭头 B：红色，从 B 指向圆心 -->
                <line id="scene1-forceB" x1="480" y1="245" x2="400" y2="250" stroke="#c62828" stroke-width="4" marker-end="url(#scene1-forceArrow)"/>
                
                <!-- 向心力标签 F_n（移到更上方） -->
                <text id="scene1-labelFn" x="520" y="180" font-size="14" fill="#c62828" text-anchor="middle">F_n</text>
            </g>
            
            <!-- 步骤 3：向心力来源标注 -->
            <g id="scene1-step3" class="scene1-step-group">
                <!-- 静摩擦力标签 f（移到更下方） -->
                <text id="scene1-labelf" x="480" y="310" font-size="14" fill="#000000" text-anchor="middle">f</text>
                
                <!-- OB 绳张力标签 T_OB（移到更上方） -->
                <text id="scene1-labelTOB" x="440" y="190" font-size="14" fill="#000000" text-anchor="middle">T_OB</text>
                
                <!-- AB 绳张力标签 T_AB（移到更上方，与 T_OB 保持间距） -->
                <text id="scene1-labelTAB" x="550" y="190" font-size="14" fill="#000000" text-anchor="middle">T_AB</text>
            </g>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btnPrev">◀ 上一步</button>
            <button id="scene1-btnNext">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现
        // 布局坐标表对照（修复后）：
        // 圆盘：椭圆 | 中心 (400,250) | 360×90（缩小避免标签重叠）
        // 转轴：矩形 | (395,150)-(405,350)
        // 物体 B：矩形 | (470,235)-(490,255)（移到椭圆上方）
        // 物体 A：矩形 | (610,235)-(630,255)（移到椭圆上方）
        // 细线 OB：线段 | (400,250)-(480,245)
        // 细线 BA：线段 | (480,245)-(620,245)
        // 标签 O: (385,235), B: (475,220), A: (615,220), ω: (400,120)
        // r_B 标注：(440,360), r_A 标注：(510,385)（移到椭圆下方）
        // F_n 标注：(520,180), f: (480,310), T_OB: (440,190), T_AB: (550,190)
        
        const currentStepMax = 3;
        let currentStep = 0;
        
        // 获取 DOM 元素
        const btnPrev = document.getElementById('scene1-btnPrev');
        const btnNext = document.getElementById('scene1-btnNext');
        const stepGroups = [
            document.getElementById('scene1-step0'),
            document.getElementById('scene1-step1'),
            document.getElementById('scene1-step2'),
            document.getElementById('scene1-step3')
        ];
        
        // 更新按钮状态
        function updateButtonState() {
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === currentStepMax);
        }
        
        // 显示指定步骤的元素
        function showStep(step) {
            // 隐藏所有步骤
            stepGroups.forEach((group, idx) => {
                if (idx <= step) {
                    group.classList.add('visible');
                } else {
                    group.classList.remove('visible');
                }
            });
            updateButtonState();
        }
        
        // 上一步按钮点击
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                showStep(currentStep);
            }
        });
        
        // 下一步按钮点击
        btnNext.addEventListener('click', function() {
            if (currentStep < currentStepMax) {
                currentStep++;
                showStep(currentStep);
            }
        });
        
        // 初始化
        updateButtonState();
    })();
    </script>
</body>
</html>
