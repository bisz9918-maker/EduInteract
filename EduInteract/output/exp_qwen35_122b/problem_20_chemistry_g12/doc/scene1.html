<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电化学装置双模式对比 - 原电池 vs 电解池</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; gap: 15px; z-index: 10; }
        .mode-btn {
            padding: 10px 20px;
            font-size: 14px;
            border: 2px solid #333;
            border-radius: 6px;
            cursor: pointer;
            background: #f5f5f5;
            transition: all 0.3s ease;
        }
        .mode-btn:hover { background: #e0e0e0; }
        .mode-btn.active-galvanic { background: #1565c0; color: white; border-color: #1565c0; }
        .mode-btn.active-electrolytic { background: #c62828; color: white; border-color: #c62828; }
        .mode-btn.active-reset { background: #424242; color: white; border-color: #424242; }
        svg { display: block; }
        .switch-open { opacity: 1; }
        .switch-closed { opacity: 0.3; }
        .dynamic-element { opacity: 0; transition: opacity 0.3s ease; }
        .dynamic-element.visible { opacity: 1; }
        .label-text { font-size: 14px; fill: #000000; }
        .highlight-blue { stroke: #1565c0; stroke-width: 3; }
        .highlight-red { stroke: #c62828; stroke-width: 3; }
        .highlight-green { stroke: #2e7d32; stroke-width: 3; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500">
            <!-- 烧杯轮廓 -->
            <path id="scene1-beaker" d="M 250 200 L 260 420 L 540 420 L 550 200 Z" 
                  fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 溶液区域 -->
            <rect id="scene1-solution" x="260" y="280" width="280" height="130" 
                  fill="#e3f2fd" opacity="0.2"/>
            
            <!-- 液面线 -->
            <line id="scene1-liquid-level" x1="260" y1="280" x2="540" y2="280" 
                  stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
            
            <!-- 液面虚线（多条） -->
            <line x1="260" y1="300" x2="540" y2="300" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
            <line x1="260" y1="320" x2="540" y2="320" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
            <line x1="260" y1="340" x2="540" y2="340" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
            <line x1="260" y1="360" x2="540" y2="360" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
            <line x1="260" y1="380" x2="540" y2="380" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
            <line x1="260" y1="400" x2="540" y2="400" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
            
            <!-- C 电极 -->
            <rect id="scene1-electrode-c" x="280" y="220" width="40" height="160" 
                  fill="#9e9e9e" stroke="#000000" stroke-width="2"/>
            
            <!-- Fe 电极 -->
            <rect id="scene1-electrode-fe" x="480" y="220" width="40" height="160" 
                  fill="#c0c0c0" stroke="#000000" stroke-width="2"/>
            
            <!-- C 电极标签 -->
            <text id="scene1-label-c" x="270" y="210" class="label-text">C</text>
            
            <!-- Fe 电极标签 -->
            <text id="scene1-label-fe" x="530" y="210" class="label-text">Fe</text>
            
            <!-- 溶液标签 -->
            <text id="scene1-label-solution" x="560" y="320" class="label-text">饱和 NaCl 溶液</text>
            
            <!-- K₁开关（原电池回路）- 上方 -->
            <g id="scene1-switch-k1">
                <!-- 开关底座左 -->
                <circle cx="350" cy="120" r="4" fill="#000000"/>
                <!-- 开关底座右 -->
                <circle cx="450" cy="120" r="4" fill="#000000"/>
                <!-- 开关臂（断开状态） -->
                <line x1="350" y1="120" x2="370" y2="100" stroke="#000000" stroke-width="2" id="scene1-k1-arm"/>
                <!-- 开关触点（断开） -->
                <circle cx="370" cy="100" r="3" fill="#000000" id="scene1-k1-contact"/>
            </g>
            
            <!-- K₁标签 -->
            <text id="scene1-label-k1" x="400" y="105" class="label-text">K₁</text>
            
            <!-- K₂开关（电解池回路）- 中间 -->
            <g id="scene1-switch-k2">
                <!-- 开关底座左 -->
                <circle cx="350" cy="160" r="4" fill="#000000"/>
                <!-- 开关底座右 -->
                <circle cx="400" cy="160" r="4" fill="#000000"/>
                <!-- 开关臂（断开状态） -->
                <line x1="350" y1="160" x2="365" y2="145" stroke="#000000" stroke-width="2" id="scene1-k2-arm"/>
                <!-- 开关触点（断开） -->
                <circle cx="365" cy="145" r="3" fill="#000000" id="scene1-k2-contact"/>
            </g>
            
            <!-- K₂标签 -->
            <text id="scene1-label-k2" x="375" y="145" class="label-text">K₂</text>
            
            <!-- 导线 K₁（原电池回路） -->
            <path id="scene1-wire-k1" d="M 320 220 L 320 150 L 350 120 M 450 120 L 470 120 L 470 220 L 520 220" 
                  fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 导线 K₂（电解池回路左） -->
            <path id="scene1-wire-k2-left" d="M 320 220 L 320 180 L 350 160" 
                  fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 导线 K₂右（电解池回路右） -->
            <path id="scene1-wire-k2-right" d="M 400 160 L 420 160 L 420 220 L 480 220" 
                  fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 电源符号（电解池模式显示） -->
            <g id="scene1-power-source" class="dynamic-element">
                <!-- 正极（长线） -->
                <line x1="420" y1="150" x2="420" y2="170" stroke="#000000" stroke-width="3"/>
                <!-- 负极（短线） -->
                <line x1="440" y1="155" x2="440" y2="165" stroke="#000000" stroke-width="3"/>
                <!-- 正极连接线 -->
                <line x1="400" y1="160" x2="420" y2="160" stroke="#000000" stroke-width="2"/>
                <!-- 负极连接线 -->
                <line x1="440" y1="160" x2="460" y2="160" stroke="#000000" stroke-width="2"/>
            </g>
            
            <!-- 电子流向箭头（原电池模式） -->
            <g id="scene1-arrow-electron" class="dynamic-element">
                <line x1="500" y1="200" x2="300" y2="200" stroke="#1565c0" stroke-width="3" marker-end="url(#arrowhead-blue)"/>
            </g>
            
            <!-- 箭头标记定义 -->
            <defs>
                <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0"/>
                </marker>
                <marker id="arrowhead-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#888888"/>
                </marker>
                <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#c62828"/>
                </marker>
            </defs>
            
            <!-- 电极极性标签（动态） -->
            <text id="scene1-label-positive" x="290" y="185" class="label-text" style="display: none;">正极</text>
            <text id="scene1-label-negative" x="490" y="185" class="label-text" style="display: none;">负极</text>
            
            <!-- 离子迁移箭头（动态） -->
            <g id="scene1-arrow-na" class="dynamic-element" style="display: none;">
                <line x1="350" y1="320" x2="450" y2="320" stroke="#888888" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowhead-gray)"/>
                <text x="395" y="310" class="label-text" style="font-size: 12px;">Na⁺</text>
            </g>
            
            <g id="scene1-arrow-cl" class="dynamic-element" style="display: none;">
                <line x1="350" y1="350" x2="280" y2="350" stroke="#888888" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowhead-gray)"/>
                <text x="305" y="340" class="label-text" style="font-size: 12px;">Cl⁻</text>
            </g>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-galvanic" class="mode-btn">原电池模式</button>
            <button id="scene1-btn-electrolytic" class="mode-btn">电解池模式</button>
            <button id="scene1-btn-reset" class="mode-btn">重置</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现 - 电化学装置双模式对比
        
        // 状态变量
        let currentMode = 0; // 0=初始，1=原电池，2=电解池
        
        // 获取 DOM 元素
        const elements = {
            electrodeC: document.getElementById('scene1-electrode-c'),
            electrodeFe: document.getElementById('scene1-electrode-fe'),
            switchK1: document.getElementById('scene1-switch-k1'),
            switchK2: document.getElementById('scene1-switch-k2'),
            k1Arm: document.getElementById('scene1-k1-arm'),
            k1Contact: document.getElementById('scene1-k1-contact'),
            k2Arm: document.getElementById('scene1-k2-arm'),
            k2Contact: document.getElementById('scene1-k2-contact'),
            powerSource: document.getElementById('scene1-power-source'),
            arrowElectron: document.getElementById('scene1-arrow-electron'),
            arrowNa: document.getElementById('scene1-arrow-na'),
            arrowCl: document.getElementById('scene1-arrow-cl'),
            labelPositive: document.getElementById('scene1-label-positive'),
            labelNegative: document.getElementById('scene1-label-negative'),
            btnGalvanic: document.getElementById('scene1-btn-galvanic'),
            btnElectrolytic: document.getElementById('scene1-btn-electrolytic'),
            btnReset: document.getElementById('scene1-btn-reset')
        };
        
        // 工具函数：显示元素
        function show(el) {
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '1';
                el.classList.add('visible');
            }
        }
        
        // 工具函数：隐藏元素
        function hide(el) {
            if (el) {
                el.style.display = 'none';
                el.style.opacity = '0';
                el.classList.remove('visible');
            }
        }
        
        // 重置所有动态元素
        function resetElements() {
            // 重置开关状态
            elements.switchK1.classList.remove('switch-closed');
            elements.switchK2.classList.remove('switch-closed');
            
            // 重置电极样式
            elements.electrodeC.style.stroke = '#000000';
            elements.electrodeC.style.strokeWidth = '2';
            elements.electrodeFe.style.stroke = '#000000';
            elements.electrodeFe.style.strokeWidth = '2';
            
            // 隐藏所有动态元素
            hide(elements.powerSource);
            hide(elements.arrowElectron);
            hide(elements.arrowNa);
            hide(elements.arrowCl);
            hide(elements.labelPositive);
            hide(elements.labelNegative);
            
            // 重置按钮样式
            elements.btnGalvanic.classList.remove('active-galvanic');
            elements.btnElectrolytic.classList.remove('active-electrolytic');
            elements.btnReset.classList.remove('active-reset');
        }
        
        // 切换开关状态
        function setSwitch(switchEl, armEl, contactEl, closed) {
            if (closed) {
                switchEl.classList.add('switch-closed');
                // 闭合状态：开关臂连接到触点
                armEl.setAttribute('x2', contactEl.getAttribute('cx'));
                armEl.setAttribute('y2', contactEl.getAttribute('cy'));
            } else {
                switchEl.classList.remove('switch-closed');
                // 断开状态：开关臂抬起
                if (switchEl === elements.switchK1) {
                    armEl.setAttribute('x2', '370');
                    armEl.setAttribute('y2', '100');
                } else {
                    armEl.setAttribute('x2', '365');
                    armEl.setAttribute('y2', '145');
                }
            }
        }
        
        // 切换到原电池模式
        function switchToGalvanic() {
            resetElements();
            currentMode = 1;
            
            // 闭合 K₁开关
            setSwitch(elements.switchK1, elements.k1Arm, elements.k1Contact, true);
            
            // 显示电子流向
            show(elements.arrowElectron);
            
            // 显示电极极性标签
            elements.labelPositive.textContent = '正极';
            elements.labelPositive.style.fill = '#1565c0';
            elements.labelPositive.style.display = 'block';
            elements.labelNegative.textContent = '负极';
            elements.labelNegative.style.fill = '#1565c0';
            elements.labelNegative.style.display = 'block';
            
            // 高亮电极
            elements.electrodeC.style.stroke = '#1565c0';
            elements.electrodeC.style.strokeWidth = '3';
            elements.electrodeFe.style.stroke = '#1565c0';
            elements.electrodeFe.style.strokeWidth = '3';
            
            // 显示离子迁移
            show(elements.arrowNa);
            show(elements.arrowCl);
            
            // 高亮按钮
            elements.btnGalvanic.classList.add('active-galvanic');
        }
        
        // 切换到电解池模式
        function switchToElectrolytic() {
            resetElements();
            currentMode = 2;
            
            // 闭合 K₂开关
            setSwitch(elements.switchK2, elements.k2Arm, elements.k2Contact, true);
            
            // 显示电源符号
            show(elements.powerSource);
            
            // 显示电极极性标签（电解池：阳极/阴极）
            elements.labelPositive.textContent = '阴极';
            elements.labelPositive.style.fill = '#2e7d32';
            elements.labelPositive.style.display = 'block';
            elements.labelNegative.textContent = '阳极';
            elements.labelNegative.style.fill = '#c62828';
            elements.labelNegative.style.display = 'block';
            
            // 高亮电极（C 为阳极红色，Fe 为阴极绿色）
            elements.electrodeC.style.stroke = '#c62828';
            elements.electrodeC.style.strokeWidth = '3';
            elements.electrodeFe.style.stroke = '#2e7d32';
            elements.electrodeFe.style.strokeWidth = '3';
            
            // 显示离子迁移（Cl⁻向阳极迁移）
            show(elements.arrowCl);
            
            // 高亮按钮
            elements.btnElectrolytic.classList.add('active-electrolytic');
        }
        
        // 重置到初始状态
        function switchToReset() {
            resetElements();
            currentMode = 0;
            elements.btnReset.classList.add('active-reset');
        }
        
        // 绑定按钮事件
        elements.btnGalvanic.addEventListener('click', switchToGalvanic);
        elements.btnElectrolytic.addEventListener('click', switchToElectrolytic);
        elements.btnReset.addEventListener('click', switchToReset);
        
        // 初始化：显示重置按钮高亮
        elements.btnReset.classList.add('active-reset');
    })();
    </script>
</body>
</html>
