<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电极反应分步详解 - 原电池与电解池对比</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene2-btn-prev, #scene2-btn-next {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            background: #ffffff;
            border: 2px solid #000000;
            border-radius: 4px;
        }
        #scene2-btn-prev:hover, #scene2-btn-next:hover { background: #f5f5f5; }
        .btn-disabled { opacity: 0.5; pointer-events: none; }
        .hidden { display: none !important; }
        svg { display: block; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 布局坐标表（实现对照依据）：
                左栏背景：(20,60)-(380,400)  右栏背景：(420,60)-(780,400)
                左栏标题：(150,35)  右栏标题：(550,35)
                左烧杯：(80,100)-(180,280)  右烧杯：(480,100)-(580,280)
                左电极1(Fe)：(100,120)-(120,240)  左电极2(C)：(140,120)-(160,240)
                左导线：(110,120)-(150,120)
                右电极1(阳极)：(500,120)-(520,240)  右电极2(阴极)：(540,120)-(560,240)
                电源符号：(580,150)-(620,180)
                左反应区框：(70,300)-(230,390)  右反应区框：(470,300)-(630,390)
                负极标签：(105,250)  正极标签：(145,250)
                阳极标签：(505,250)  阴极标签：(545,250)
                氧化反应标签：左(110,270) 右(510,270)
                还原反应标签：左(150,270) 右(550,270)
                步骤指示器：(360,410)
            -->

            <!-- 左栏背景（原电池模式区域） -->
            <rect id="scene2-left-bg" x="20" y="60" width="360" height="340" fill="#e3f2fd" opacity="0.15"/>

            <!-- 右栏背景（电解池模式区域） -->
            <rect id="scene2-right-bg" x="420" y="60" width="360" height="340" fill="#e3f2fd" opacity="0.15"/>

            <!-- 左栏标题 -->
            <text id="scene2-left-title" x="150" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#1565c0">原电池模式</text>

            <!-- 右栏标题 -->
            <text id="scene2-right-title" x="550" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#1565c0">电解池模式</text>

            <!-- 左烧杯 -->
            <rect id="scene2-left-beaker" x="80" y="100" width="100" height="180" fill="none" stroke="#000000" stroke-width="2"/>
            <!-- 左烧杯液体（虚线表示液面） -->
            <line x1="80" y1="150" x2="180" y2="150" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
            <line x1="80" y1="170" x2="180" y2="170" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
            <line x1="80" y1="190" x2="180" y2="190" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
            <line x1="80" y1="210" x2="180" y2="210" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>

            <!-- 左电极1（Fe 电极，负极） -->
            <rect id="scene2-electrode-fe" x="100" y="120" width="20" height="120" fill="#bdbdbd" stroke="#000000" stroke-width="2"/>

            <!-- 左电极2（C 电极，正极） -->
            <rect id="scene2-electrode-c" x="140" y="120" width="20" height="120" fill="#bdbdbd" stroke="#000000" stroke-width="2"/>

            <!-- 左导线（连接两电极） -->
            <line id="scene2-left-wire" x1="110" y1="120" x2="150" y2="120" stroke="#000000" stroke-width="2"/>

            <!-- 右烧杯 -->
            <rect id="scene2-right-beaker" x="480" y="100" width="100" height="180" fill="none" stroke="#000000" stroke-width="2"/>
            <!-- 右烧杯液体（虚线表示液面） -->
            <line x1="480" y1="150" x2="580" y2="150" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
            <line x1="480" y1="170" x2="580" y2="170" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
            <line x1="480" y1="190" x2="580" y2="190" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>
            <line x1="480" y1="210" x2="580" y2="210" stroke="#000000" stroke-width="1" stroke-dasharray="5,5"/>

            <!-- 右电极1（阳极） -->
            <rect id="scene2-anode" x="500" y="120" width="20" height="120" fill="#bdbdbd" stroke="#000000" stroke-width="2"/>

            <!-- 右电极2（阴极） -->
            <rect id="scene2-cathode" x="540" y="120" width="20" height="120" fill="#bdbdbd" stroke="#000000" stroke-width="2"/>

            <!-- 电源符号 -->
            <line x1="580" y1="160" x2="620" y2="160" stroke="#000000" stroke-width="3"/>
            <line x1="585" y1="155" x2="585" y2="165" stroke="#000000" stroke-width="2"/>
            <line x1="615" y1="152" x2="615" y2="168" stroke="#000000" stroke-width="3"/>
            <text x="575" y="165" font-size="12" fill="#000000">+</text>
            <text x="622" y="165" font-size="12" fill="#000000">-</text>

            <!-- 右导线1（阳极接电源+） -->
            <line x1="510" y1="120" x2="580" y2="160" stroke="#000000" stroke-width="2"/>

            <!-- 右导线2（阴极接电源-） -->
            <line x1="550" y1="120" x2="620" y2="160" stroke="#000000" stroke-width="2"/>

            <!-- 左反应区框 -->
            <rect id="scene2-reaction-left-box" x="70" y="300" width="160" height="90" fill="#ffffff" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" opacity="0.15"/>

            <!-- 右反应区框 -->
            <rect id="scene2-reaction-right-box" x="470" y="300" width="160" height="90" fill="#ffffff" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" opacity="0.15"/>

            <!-- ===== 步骤 1 元素：负极标签、氧化反应标签、Fe 电极高亮 ===== -->
            <text id="scene2-label-negative" class="hidden" x="105" y="250" text-anchor="middle" font-size="14" fill="#1565c0">负极</text>
            <text id="scene2-label-oxidation-left" class="hidden" x="110" y="270" text-anchor="middle" font-size="12" fill="#c62828">氧化反应</text>

            <!-- ===== 步骤 2 元素：Fe 反应式、电子箭头 ===== -->
            <text id="scene2-reaction-fe" class="hidden" x="150" y="330" text-anchor="middle" font-size="13" fill="#c62828">Fe - 2e⁻ = Fe²⁺</text>
            <path id="scene2-arrow-fe" class="hidden" d="M 110 240 L 110 280 L 130 280" fill="none" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowhead)"/>

            <!-- ===== 步骤 3 元素：正极标签、还原反应标签、C 电极高亮 ===== -->
            <text id="scene2-label-positive" class="hidden" x="145" y="250" text-anchor="middle" font-size="14" fill="#1565c0">正极</text>
            <text id="scene2-label-reduction-left" class="hidden" x="150" y="270" text-anchor="middle" font-size="12" fill="#2e7d32">还原反应</text>

            <!-- ===== 步骤 4 元素：O₂反应式、电子箭头 ===== -->
            <text id="scene2-reaction-o2" class="hidden" x="150" y="360" text-anchor="middle" font-size="11" fill="#2e7d32">O₂ + 2H₂O + 4e⁻ = 4OH⁻</text>
            <path id="scene2-arrow-o2" class="hidden" d="M 150 280 L 150 320" fill="none" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowhead)"/>

            <!-- ===== 步骤 5 元素：阳极标签、氧化反应标签 ===== -->
            <text id="scene2-label-anode" class="hidden" x="505" y="250" text-anchor="middle" font-size="14" fill="#c62828">阳极</text>
            <text id="scene2-label-oxidation-right" class="hidden" x="510" y="270" text-anchor="middle" font-size="12" fill="#c62828">氧化反应</text>

            <!-- ===== 步骤 6 元素：Cl⁻反应式、电子箭头、产物标注 ===== -->
            <text id="scene2-reaction-cl" class="hidden" x="550" y="330" text-anchor="middle" font-size="13" fill="#c62828">2Cl⁻ - 2e⁻ = Cl₂↑</text>
            <path id="scene2-arrow-cl" class="hidden" d="M 510 240 L 510 280 L 530 280" fill="none" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowhead)"/>
            <text id="scene2-product-cl2" class="hidden" x="510" y="360" text-anchor="middle" font-size="12" fill="#c62828">Cl₂↑</text>

            <!-- ===== 步骤 7 元素：阴极标签、还原反应标签 ===== -->
            <text id="scene2-label-cathode" class="hidden" x="545" y="250" text-anchor="middle" font-size="14" fill="#2e7d32">阴极</text>
            <text id="scene2-label-reduction-right" class="hidden" x="550" y="270" text-anchor="middle" font-size="12" fill="#2e7d32">还原反应</text>

            <!-- ===== 步骤 8 元素：H₂O反应式、产物标注 ===== -->
            <text id="scene2-reaction-h2" class="hidden" x="550" y="360" text-anchor="middle" font-size="11" fill="#2e7d32">2H₂O + 2e⁻ = H₂↑ + 2OH⁻</text>
            <text id="scene2-product-h2" class="hidden" x="550" y="380" text-anchor="middle" font-size="12" fill="#2e7d32">H₂↑</text>

            <!-- 箭头标记定义 -->
            <defs>
                <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0"/>
                </marker>
            </defs>

            <!-- 步骤指示器 -->
            <text id="scene2-step-indicator" x="360" y="410" text-anchor="middle" font-size="14" fill="#000000">步骤 0/8</text>
        </svg>

        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-btn-prev">◀ 上一步</button>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2 实现：电极反应分步详解（原电池与电解池对比）

        // 状态变量
        var currentStep = 0;
        var totalSteps = 8;

        // 获取 DOM 元素
        var btnPrev = document.getElementById('scene2-btn-prev');
        var btnNext = document.getElementById('scene2-btn-next');
        var stepIndicator = document.getElementById('scene2-step-indicator');

        // 元素引用（按步骤分组）
        var step1Elements = [
            document.getElementById('scene2-label-negative'),
            document.getElementById('scene2-label-oxidation-left'),
            document.getElementById('scene2-electrode-fe')
        ];

        var step2Elements = [
            document.getElementById('scene2-reaction-fe'),
            document.getElementById('scene2-arrow-fe')
        ];

        var step3Elements = [
            document.getElementById('scene2-label-positive'),
            document.getElementById('scene2-label-reduction-left'),
            document.getElementById('scene2-electrode-c')
        ];

        var step4Elements = [
            document.getElementById('scene2-reaction-o2'),
            document.getElementById('scene2-arrow-o2')
        ];

        var step5Elements = [
            document.getElementById('scene2-label-anode'),
            document.getElementById('scene2-label-oxidation-right'),
            document.getElementById('scene2-anode')
        ];

        var step6Elements = [
            document.getElementById('scene2-reaction-cl'),
            document.getElementById('scene2-arrow-cl'),
            document.getElementById('scene2-product-cl2')
        ];

        var step7Elements = [
            document.getElementById('scene2-label-cathode'),
            document.getElementById('scene2-label-reduction-right'),
            document.getElementById('scene2-cathode')
        ];

        var step8Elements = [
            document.getElementById('scene2-reaction-h2'),
            document.getElementById('scene2-product-h2')
        ];

        // 工具函数：显示元素
        function show(el) {
            if (el) {
                el.classList.remove('hidden');
                el.style.display = '';
                el.style.opacity = '1';
            }
        }

        // 工具函数：隐藏元素
        function hide(el) {
            if (el) {
                el.classList.add('hidden');
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }

        // 工具函数：高亮电极（红色=氧化，绿色=还原）
        function highlightElectrode(electrodeEl, color) {
            if (electrodeEl) {
                electrodeEl.setAttribute('stroke', color);
                electrodeEl.setAttribute('stroke-width', '3');
            }
        }

        // 工具函数：重置电极样式
        function resetElectrode(electrodeEl) {
            if (electrodeEl) {
                electrodeEl.setAttribute('stroke', '#000000');
                electrodeEl.setAttribute('stroke-width', '2');
            }
        }

        // 更新步骤显示
        function updateStepDisplay() {
            // 更新步骤指示器
            stepIndicator.textContent = '步骤 ' + currentStep + '/' + totalSteps;

            // 更新按钮状态
            if (currentStep === 0) {
                btnPrev.classList.add('btn-disabled');
            } else {
                btnPrev.classList.remove('btn-disabled');
            }

            if (currentStep === totalSteps) {
                btnNext.classList.add('btn-disabled');
            } else {
                btnNext.classList.remove('btn-disabled');
            }

            // 根据当前步骤显示/隐藏元素
            // 步骤 0：初始状态，所有元素隐藏
            if (currentStep === 0) {
                step1Elements.forEach(function(el) {
                    if (el.id === 'scene2-electrode-fe') {
                        resetElectrode(el);
                    } else {
                        hide(el);
                    }
                });
                step2Elements.forEach(hide);
                step3Elements.forEach(function(el) {
                    if (el.id === 'scene2-electrode-c') {
                        resetElectrode(el);
                    } else {
                        hide(el);
                    }
                });
                step4Elements.forEach(hide);
                step5Elements.forEach(function(el) {
                    if (el.id === 'scene2-anode') {
                        resetElectrode(el);
                    } else {
                        hide(el);
                    }
                });
                step6Elements.forEach(hide);
                step7Elements.forEach(function(el) {
                    if (el.id === 'scene2-cathode') {
                        resetElectrode(el);
                    } else {
                        hide(el);
                    }
                });
                step8Elements.forEach(hide);
            }

            // 步骤 1：显示负极标签、氧化反应标签，高亮 Fe 电极
            if (currentStep >= 1) {
                show(step1Elements[0]); // 负极标签
                show(step1Elements[1]); // 氧化反应标签
                highlightElectrode(step1Elements[2], '#c62828'); // Fe 电极红色高亮
            } else {
                hide(step1Elements[0]);
                hide(step1Elements[1]);
                resetElectrode(step1Elements[2]);
            }

            // 步骤 2：显示 Fe 反应式、电子箭头
            if (currentStep >= 2) {
                show(step2Elements[0]); // Fe 反应式
                show(step2Elements[1]); // 电子箭头
            } else {
                hide(step2Elements[0]);
                hide(step2Elements[1]);
            }

            // 步骤 3：显示正极标签、还原反应标签，高亮 C 电极
            if (currentStep >= 3) {
                show(step3Elements[0]); // 正极标签
                show(step3Elements[1]); // 还原反应标签
                highlightElectrode(step3Elements[2], '#2e7d32'); // C 电极绿色高亮
            } else {
                hide(step3Elements[0]);
                hide(step3Elements[1]);
                resetElectrode(step3Elements[2]);
            }

            // 步骤 4：显示 O₂反应式、电子箭头
            if (currentStep >= 4) {
                show(step4Elements[0]); // O₂反应式
                show(step4Elements[1]); // 电子箭头
            } else {
                hide(step4Elements[0]);
                hide(step4Elements[1]);
            }

            // 步骤 5：显示阳极标签、氧化反应标签，高亮阳极
            if (currentStep >= 5) {
                show(step5Elements[0]); // 阳极标签
                show(step5Elements[1]); // 氧化反应标签
                highlightElectrode(step5Elements[2], '#c62828'); // 阳极红色高亮
            } else {
                hide(step5Elements[0]);
                hide(step5Elements[1]);
                resetElectrode(step5Elements[2]);
            }

            // 步骤 6：显示 Cl⁻反应式、电子箭头、产物标注
            if (currentStep >= 6) {
                show(step6Elements[0]); // Cl⁻反应式
                show(step6Elements[1]); // 电子箭头
                show(step6Elements[2]); // Cl₂产物
            } else {
                hide(step6Elements[0]);
                hide(step6Elements[1]);
                hide(step6Elements[2]);
            }

            // 步骤 7：显示阴极标签、还原反应标签，高亮阴极
            if (currentStep >= 7) {
                show(step7Elements[0]); // 阴极标签
                show(step7Elements[1]); // 还原反应标签
                highlightElectrode(step7Elements[2], '#2e7d32'); // 阴极绿色高亮
            } else {
                hide(step7Elements[0]);
                hide(step7Elements[1]);
                resetElectrode(step7Elements[2]);
            }

            // 步骤 8：显示 H₂O反应式、产物标注
            if (currentStep >= 8) {
                show(step8Elements[0]); // H₂O反应式
                show(step8Elements[1]); // H₂产物
            } else {
                hide(step8Elements[0]);
                hide(step8Elements[1]);
            }
        }

        // 上一步按钮点击事件
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStepDisplay();
            }
        });

        // 下一步按钮点击事件
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateStepDisplay();
            }
        });

        // 初始化显示
        updateStepDisplay();
    })();
    </script>
</body>
</html>
