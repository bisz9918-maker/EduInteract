<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>平行四边形中三角形全等条件分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene1-controls button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #333; border-radius: 4px; background: #f5f5f5; }
        #scene1-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene1-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-step-text { position: absolute; top: 15px; left: 50px; right: 50px; font-size: 16px; line-height: 1.5; color: #333; }
        #scene1-hint-text { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); font-size: 14px; color: #666; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <!-- SVG 图示区：固定 800×500px -->
        <svg width="800" height="500" id="scene1-svg">
            <!-- 平行四边形 ABCD：填充#e3f2fd(15% 透明度)，描边#000000 -->
            <path id="scene1-quad-abcd" d="M 250 150 L 150 350 L 550 350 L 650 150 Z" fill="rgba(227, 242, 253, 0.15)" stroke="#000000" stroke-width="2"/>
            
            <!-- 对角线 BD：描边#000000，线宽 2 -->
            <line id="scene1-diagonal-bd" x1="150" y1="350" x2="650" y2="150" stroke="#000000" stroke-width="2"/>
            
            <!-- 线段 AE：描边#000000，线宽 2 -->
            <line id="scene1-segment-ae" x1="250" y1="150" x2="275" y2="300" stroke="#000000" stroke-width="2"/>
            
            <!-- 线段 CF：描边#000000，线宽 2 -->
            <line id="scene1-segment-cf" x1="550" y1="350" x2="525" y2="200" stroke="#000000" stroke-width="2"/>
            
            <!-- 点 E、F：圆形，半径 4px，填充#000000 -->
            <circle id="scene1-point-e" cx="275" cy="300" r="4" fill="#000000"/>
            <circle id="scene1-point-f" cx="525" cy="200" r="4" fill="#000000"/>
            
            <!-- AB=CD 等长标记：单短线标记 -->
            <line id="scene1-mark-ab" x1="203" y1="247" x2="197" y2="253" stroke="#2e7d32" stroke-width="2"/>
            <line id="scene1-mark-cd" x1="603" y1="247" x2="597" y2="253" stroke="#2e7d32" stroke-width="2"/>
            
            <!-- AB∥CD 平行箭头 -->
            <path id="scene1-arrow-ab" d="M 175 215 L 185 225 L 182 225 L 182 230 L 178 230 L 178 225 L 175 225 Z" fill="#2e7d32"/>
            <path id="scene1-arrow-cd" d="M 575 275 L 585 285 L 582 285 L 582 290 L 578 290 L 578 285 L 575 285 Z" fill="#2e7d32"/>
            
            <!-- ∠ABE=∠CDF 内错角弧：描边#2e7d32（绿高亮），线宽 2 -->
            <path id="scene1-arc-abE" d="M 170 340 Q 160 330 155 320" fill="none" stroke="#2e7d32" stroke-width="2"/>
            <path id="scene1-arc-cDF" d="M 630 160 Q 640 170 645 180" fill="none" stroke="#2e7d32" stroke-width="2"/>
            
            <!-- ∠1 弧线：半径 40px，描边#000000，线宽 1.5 -->
            <path id="scene1-arc-angle1" d="M 230 180 Q 220 170 225 160" fill="none" stroke="#000000" stroke-width="1.5"/>
            
            <!-- ∠2 弧线：半径 40px，描边#000000，线宽 1.5 -->
            <path id="scene1-arc-angle2" d="M 550 320 Q 545 310 555 305" fill="none" stroke="#000000" stroke-width="1.5"/>
            
            <!-- 顶点标签 A、B、C、D、E、F：字体 16px，#000000 -->
            <text id="scene1-label-a" x="250" y="135" font-size="16" fill="#000000" text-anchor="middle">A</text>
            <text id="scene1-label-b" x="135" y="365" font-size="16" fill="#000000" text-anchor="middle">B</text>
            <text id="scene1-label-c" x="550" y="375" font-size="16" fill="#000000" text-anchor="middle">C</text>
            <text id="scene1-label-d" x="665" y="145" font-size="16" fill="#000000" text-anchor="middle">D</text>
            <!-- E 标签：放在 E 点右下方远处 -->
            <text id="scene1-label-e" x="300" y="345" font-size="16" fill="#000000" text-anchor="middle">E</text>
            <!-- F 标签：放在 F 点右上方远处 -->
            <text id="scene1-label-f" x="550" y="160" font-size="16" fill="#000000" text-anchor="middle">F</text>
            
            <!-- ∠1、∠2 标签：字体 14px，#000000 -->
            <!-- ∠1 标签：放在∠BAE 内部左侧远处 -->
            <text id="scene1-label-angle1" x="185" y="190" font-size="14" fill="#000000" text-anchor="middle">∠1</text>
            <!-- ∠2 标签：放在∠DCF 内部右侧远处 -->
            <text id="scene1-label-angle2" x="595" y="300" font-size="14" fill="#000000" text-anchor="middle">∠2</text>
        </svg>
        
        <!-- 顶部说明文本 -->
        <div id="scene1-step-text">如图，四边形 ABCD 中，AB∥CD，AB=CD，E、F 是对角线 BD 上的两点</div>
        
        <!-- 底部提示文本 -->
        <div id="scene1-hint-text"></div>
        
        <!-- 控件栏叠在 SVG 底部 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现
        // 布局坐标表（对照参考）：
        // A(250,150), B(150,350), C(550,350), D(650,150)
        // E(275,300), F(525,200)
        // 标签位置：E(300,345), F(550,160), ∠1(185,190), ∠2(595,300)
        
        const sceneId = 'scene1';
        let currentStep = 0;
        const totalSteps = 6; // 步骤 0-5
        
        // 步骤文本配置
        const stepTexts = [
            '如图，四边形 ABCD 中，AB∥CD，AB=CD，E、F 是对角线 BD 上的两点',
            '选项 A：添加 AE=CF，这是 SSA（边边角），不能判定△ABE≌△CDF',
            '选项 B：添加 BE=FD，结合 AB=CD 和∠ABE=∠CDF，可用 SAS 判定△ABE≌△CDF',
            '选项 C：添加 BF=DE，可推出 BE=FD（BF-EF=DE-EF），同选项 B，SAS 可判定',
            '选项 D：添加∠1=∠2，结合 AB=CD 和∠ABE=∠CDF，可用 ASA 判定△ABE≌△CDF',
            '总结：选项 A（AE=CF）是 SSA，不能判定全等，故答案为 A'
        ];
        
        // 底部提示配置
        const hintTexts = [
            '',
            'SSA 不是全等判定定理',
            'SAS：两边及其夹角对应相等',
            '等量减等量，差相等',
            'ASA：两角及其夹边对应相等',
            '正确答案：A'
        ];
        
        // 获取 SVG 元素引用
        const svgElements = {
            quad: document.getElementById('scene1-quad-abcd'),
            diagonal: document.getElementById('scene1-diagonal-bd'),
            ae: document.getElementById('scene1-segment-ae'),
            cf: document.getElementById('scene1-segment-cf'),
            pointE: document.getElementById('scene1-point-e'),
            pointF: document.getElementById('scene1-point-f'),
            markAb: document.getElementById('scene1-mark-ab'),
            markCd: document.getElementById('scene1-mark-cd'),
            arrowAb: document.getElementById('scene1-arrow-ab'),
            arrowCd: document.getElementById('scene1-arrow-cd'),
            arcAbE: document.getElementById('scene1-arc-abE'),
            arcCdF: document.getElementById('scene1-arc-cDF'),
            arcAngle1: document.getElementById('scene1-arc-angle1'),
            arcAngle2: document.getElementById('scene1-arc-angle2'),
            labelAngle1: document.getElementById('scene1-label-angle1'),
            labelAngle2: document.getElementById('scene1-label-angle2')
        };
        
        // 文本元素引用
        const stepTextEl = document.getElementById('scene1-step-text');
        const hintTextEl = document.getElementById('scene1-hint-text');
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        
        // 工具函数：设置元素颜色
        function setStroke(element, color, width = 2) {
            element.style.stroke = color;
            element.style.strokeWidth = width + 'px';
        }
        
        function setFill(element, color) {
            element.style.fill = color;
        }
        
        // 更新步骤显示
        function updateStep() {
            // 更新文本
            stepTextEl.textContent = stepTexts[currentStep];
            hintTextEl.textContent = hintTexts[currentStep];
            
            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            if (currentStep === totalSteps - 1) {
                btnNext.textContent = '完成';
            } else {
                btnNext.textContent = '下一步 ▶';
            }
            
            // 重置所有元素为默认状态
            resetElements();
            
            // 根据步骤设置高亮
            switch(currentStep) {
                case 0:
                    // 初始状态：显示已知条件（绿色）
                    setStroke(svgElements.markAb, '#2e7d32', 2);
                    setStroke(svgElements.markCd, '#2e7d32', 2);
                    setFill(svgElements.arrowAb, '#2e7d32');
                    setFill(svgElements.arrowCd, '#2e7d32');
                    setStroke(svgElements.arcAbE, '#2e7d32', 2);
                    setStroke(svgElements.arcCdF, '#2e7d32', 2);
                    break;
                    
                case 1:
                    // 选项 A：AE=CF 红色高亮
                    setStroke(svgElements.markAb, '#2e7d32', 2);
                    setStroke(svgElements.markCd, '#2e7d32', 2);
                    setFill(svgElements.arrowAb, '#2e7d32');
                    setFill(svgElements.arrowCd, '#2e7d32');
                    setStroke(svgElements.arcAbE, '#2e7d32', 2);
                    setStroke(svgElements.arcCdF, '#2e7d32', 2);
                    setStroke(svgElements.ae, '#c62828', 3);
                    setStroke(svgElements.cf, '#c62828', 3);
                    break;
                    
                case 2:
                    // 选项 B：BE=FD 蓝色高亮
                    setStroke(svgElements.markAb, '#2e7d32', 2);
                    setStroke(svgElements.markCd, '#2e7d32', 2);
                    setFill(svgElements.arrowAb, '#2e7d32');
                    setFill(svgElements.arrowCd, '#2e7d32');
                    setStroke(svgElements.arcAbE, '#2e7d32', 2);
                    setStroke(svgElements.arcCdF, '#2e7d32', 2);
                    setStroke(svgElements.ae, '#1565c0', 3);
                    setStroke(svgElements.cf, '#1565c0', 3);
                    break;
                    
                case 3:
                    // 选项 C：同选项 B
                    setStroke(svgElements.markAb, '#2e7d32', 2);
                    setStroke(svgElements.markCd, '#2e7d32', 2);
                    setFill(svgElements.arrowAb, '#2e7d32');
                    setFill(svgElements.arrowCd, '#2e7d32');
                    setStroke(svgElements.arcAbE, '#2e7d32', 2);
                    setStroke(svgElements.arcCdF, '#2e7d32', 2);
                    setStroke(svgElements.ae, '#1565c0', 3);
                    setStroke(svgElements.cf, '#1565c0', 3);
                    break;
                    
                case 4:
                    // 选项 D：∠1=∠2 蓝色高亮
                    setStroke(svgElements.markAb, '#2e7d32', 2);
                    setStroke(svgElements.markCd, '#2e7d32', 2);
                    setFill(svgElements.arrowAb, '#2e7d32');
                    setFill(svgElements.arrowCd, '#2e7d32');
                    setStroke(svgElements.arcAbE, '#2e7d32', 2);
                    setStroke(svgElements.arcCdF, '#2e7d32', 2);
                    setStroke(svgElements.arcAngle1, '#1565c0', 2);
                    setStroke(svgElements.arcAngle2, '#1565c0', 2);
                    setFill(svgElements.labelAngle1, '#1565c0');
                    setFill(svgElements.labelAngle2, '#1565c0');
                    break;
                    
                case 5:
                    // 总结：选项 A 红色，其他蓝色
                    setStroke(svgElements.markAb, '#2e7d32', 2);
                    setStroke(svgElements.markCd, '#2e7d32', 2);
                    setFill(svgElements.arrowAb, '#2e7d32');
                    setFill(svgElements.arrowCd, '#2e7d32');
                    setStroke(svgElements.arcAbE, '#2e7d32', 2);
                    setStroke(svgElements.arcCdF, '#2e7d32', 2);
                    setStroke(svgElements.ae, '#c62828', 3);
                    setStroke(svgElements.cf, '#c62828', 3);
                    setStroke(svgElements.arcAngle1, '#1565c0', 2);
                    setStroke(svgElements.arcAngle2, '#1565c0', 2);
                    setFill(svgElements.labelAngle1, '#1565c0');
                    setFill(svgElements.labelAngle2, '#1565c0');
                    break;
            }
        }
        
        // 重置所有元素为默认状态
        function resetElements() {
            // 线段恢复黑色
            setStroke(svgElements.ae, '#000000', 2);
            setStroke(svgElements.cf, '#000000', 2);
            
            // 角度弧线恢复黑色
            setStroke(svgElements.arcAngle1, '#000000', 1.5);
            setStroke(svgElements.arcAngle2, '#000000', 1.5);
            setFill(svgElements.labelAngle1, '#000000');
            setFill(svgElements.labelAngle2, '#000000');
        }
        
        // 事件绑定
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });
        
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateStep();
            }
        });
        
        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
