<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抛物线图像特征与对称性分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene1-controls button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #333; border-radius: 4px; background: #f5f5f5; }
        #scene1-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene1-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene1-element { transition: opacity 0.3s ease; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- 坐标轴 -->
            <line id="scene1-axis-x" class="scene1-element" x1="100" y1="320" x2="700" y2="320" stroke="#000000" stroke-width="2"/>
            <line id="scene1-axis-y" class="scene1-element" x1="320" y1="80" x2="320" y2="400" stroke="#000000" stroke-width="2"/>
            
            <!-- x 轴箭头 -->
            <polygon id="scene1-axis-x-arrow" class="scene1-element" points="700,320 690,315 690,325" fill="#000000"/>
            <!-- y 轴箭头 -->
            <polygon id="scene1-axis-y-arrow" class="scene1-element" points="320,80 315,90 325,90" fill="#000000"/>
            
            <!-- 抛物线：顶点 (1,4)→(400,80)，过 (-1,0)(0,3)(3,0) -->
            <!-- 用 path 绘制抛物线，从 x=-2 到 x=4 -->
            <path id="scene1-parabola" class="scene1-element" d="M 160,480 Q 320,400 400,80 Q 480,400 640,480" 
                  stroke="#000000" stroke-width="3" fill="none"/>
            
            <!-- 对称轴：x=1 虚线 -->
            <line id="scene1-sym-line" class="scene1-element" x1="400" y1="80" x2="400" y2="400" 
                  stroke="#888888" stroke-width="2" stroke-dasharray="8,4" style="display: none; opacity: 0;"/>
            
            <!-- 刻度线 -->
            <line id="scene1-k-1" class="scene1-element" x1="235" y1="315" x2="235" y2="325" stroke="#000000" stroke-width="1"/>
            <line id="scene1-k-0" class="scene1-element" x1="315" y1="315" x2="325" y2="315" stroke="#000000" stroke-width="1"/>
            <line id="scene1-k-1-x" class="scene1-element" x1="395" y1="315" x2="395" y2="325" stroke="#000000" stroke-width="1"/>
            <line id="scene1-k-3" class="scene1-element" x1="555" y1="315" x2="555" y2="325" stroke="#000000" stroke-width="1"/>
            <line id="scene1-k-3-y" class="scene1-element" x1="315" y1="155" x2="325" y2="155" stroke="#000000" stroke-width="1"/>
            
            <!-- 刻度标签 -->
            <text id="scene1-label-k-1" class="scene1-element" x="225" y="340" font-size="14" fill="#000000">-1</text>
            <text id="scene1-label-k-1-x" class="scene1-element" x="385" y="340" font-size="14" fill="#000000">1</text>
            <text id="scene1-label-k-3" class="scene1-element" x="290" y="150" font-size="14" fill="#000000">3</text>
            
            <!-- 轴标签 -->
            <text id="scene1-label-x" class="scene1-element" x="680" y="305" font-size="14" fill="#000000">x</text>
            <text id="scene1-label-y" class="scene1-element" x="305" y="95" font-size="14" fill="#000000">y</text>
            
            <!-- 原点 O -->
            <text id="scene1-label-o" class="scene1-element" x="305" y="340" font-size="14" fill="#000000">O</text>
            
            <!-- 对称轴标签 x=1 -->
            <text id="scene1-label-sym" class="scene1-element" x="410" y="100" font-size="14" fill="#888888" style="display: none; opacity: 0;">x=1</text>
            
            <!-- 交点 A(-1,0) -->
            <circle id="scene1-point-a" class="scene1-element" cx="240" cy="320" r="4" fill="#1565c0" style="display: none; opacity: 0;"/>
            <text id="scene1-label-a" class="scene1-element" x="200" y="335" font-size="14" fill="#1565c0" style="display: none; opacity: 0;">(-1, 0)</text>
            
            <!-- 交点 B(0,3) -->
            <circle id="scene1-point-b" class="scene1-element" cx="320" cy="160" r="4" fill="#1565c0" style="display: none; opacity: 0;"/>
            <text id="scene1-label-b" class="scene1-element" x="280" y="145" font-size="14" fill="#1565c0" style="display: none; opacity: 0;">(0, 3)</text>
            
            <!-- 交点 C(3,0) -->
            <circle id="scene1-point-c" class="scene1-element" cx="560" cy="320" r="4" fill="#c62828" style="display: none; opacity: 0;"/>
            <text id="scene1-label-c" class="scene1-element" x="550" y="335" font-size="14" fill="#c62828" style="display: none; opacity: 0;">(3, 0)</text>
            
            <!-- 方程标签 -->
            <text id="scene1-label-eq" class="scene1-element" x="520" y="120" font-size="14" fill="#000000" style="display: none; opacity: 0;">y=ax²+bx+c</text>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-prev-btn">◀ 上一步</button>
            <button id="scene1-next-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现：抛物线图像特征与对称性分析
        // 坐标映射：1 单位长度 = 80px，原点 O 在 (320, 320)
        // pixelX = 320 + unitX * 80
        // pixelY = 320 - unitY * 80
        
        let currentStep = 0;
        const totalSteps = 5;
        
        // 元素 ID 列表（按步骤分组）
        const stepElements = {
            0: [ // 基础元素（始终显示）
                'scene1-axis-x', 'scene1-axis-y', 'scene1-axis-x-arrow', 'scene1-axis-y-arrow',
                'scene1-parabola', 'scene1-k-1', 'scene1-k-0', 'scene1-k-1-x', 'scene1-k-3', 'scene1-k-3-y',
                'scene1-label-k-1', 'scene1-label-k-1-x', 'scene1-label-k-3',
                'scene1-label-x', 'scene1-label-y', 'scene1-label-o'
            ],
            1: [ // 步骤 1：对称轴
                'scene1-sym-line', 'scene1-label-sym'
            ],
            2: [ // 步骤 2：已知交点
                'scene1-point-a', 'scene1-label-a', 'scene1-point-b', 'scene1-label-b', 'scene1-label-eq'
            ],
            3: [ // 步骤 3：对称交点
                'scene1-point-c', 'scene1-label-c'
            ],
            4: [] // 步骤 4：完整显示（无新增）
        };
        
        // 工具函数：显示元素
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.display = '';
                el.style.opacity = '1';
            }
        }
        
        // 工具函数：隐藏元素
        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.opacity = '0';
                setTimeout(() => {
                    if (el.style.opacity === '0') {
                        el.style.display = 'none';
                    }
                }, 300);
            }
        }
        
        // 更新场景显示
        function updateScene() {
            // 隐藏所有步骤元素
            for (let step = 1; step < totalSteps; step++) {
                stepElements[step].forEach(id => hideElement(id));
            }
            
            // 显示当前步骤及之前的所有元素
            for (let step = 1; step <= currentStep; step++) {
                stepElements[step].forEach(id => showElement(id));
            }
            
            // 更新按钮状态
            const prevBtn = document.getElementById('scene1-prev-btn');
            const nextBtn = document.getElementById('scene1-next-btn');
            prevBtn.disabled = (currentStep === 0);
            nextBtn.disabled = (currentStep === totalSteps - 1);
            
            // 更新按钮文本
            if (currentStep === 0) {
                prevBtn.textContent = '◀ 上一步';
                nextBtn.textContent = '下一步 ▶';
            } else if (currentStep === totalSteps - 1) {
                prevBtn.textContent = '◀ 上一步';
                nextBtn.textContent = '下一步 ▶';
            }
        }
        
        // 绑定事件
        document.getElementById('scene1-prev-btn').addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });
        
        document.getElementById('scene1-next-btn').addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateScene();
            }
        });
        
        // 初始化
        updateScene();
    })();
    </script>
</body>
</html>
