<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 抛物线性质验证</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene2-btn { padding: 8px 20px; font-size: 14px; border: none; border-radius: 4px; cursor: pointer; transition: all 0.2s; }
        .scene2-btn-primary { background: #1565c0; color: white; }
        .scene2-btn-primary:hover { background: #0d47a1; }
        .scene2-btn-secondary { background: #e0e0e0; color: #333; }
        .scene2-btn-secondary:hover { background: #bdbdbd; }
        .scene2-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene2-conclusion-item { padding: 10px 20px; margin: 8px 0; border-radius: 4px; transition: all 0.3s; }
        .scene2-conclusion-item.highlight { background: rgba(21, 101, 192, 0.2); }
        .scene2-conclusion-item.correct { background: rgba(46, 125, 50, 0.2); }
        .scene2-conclusion-item.wrong { background: rgba(198, 40, 40, 0.2); }
    </style>
</head>
<body>
    <div id="scene2-container">
        <!-- SVG 图示区：固定 800×500px -->
        <svg id="scene2-svg" width="800" height="500">
            <!-- 左侧结论列表容器 -->
            <rect id="scene2-left-container" x="20" y="50" width="300" height="340" fill="#f5f5f5" stroke="#cccccc" stroke-width="1"/>
            
            <!-- 结论标题 -->
            <text id="scene2-conclusion-title" x="170" y="40" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">结论列表</text>
            
            <!-- 结论① -->
            <g id="scene2-conclusion-1" class="scene2-conclusion-item">
                <rect x="30" y="60" width="280" height="35" rx="4" fill="transparent"/>
                <text id="scene2-conclusion-1-text" x="45" y="82" font-size="14" fill="#000000">① 4ac &lt; b²</text>
            </g>
            
            <!-- 结论② -->
            <g id="scene2-conclusion-2" class="scene2-conclusion-item">
                <rect x="30" y="100" width="280" height="35" rx="4" fill="transparent"/>
                <text id="scene2-conclusion-2-text" x="45" y="122" font-size="14" fill="#000000">② 3a + c &gt; 0</text>
            </g>
            
            <!-- 结论③ -->
            <g id="scene2-conclusion-3" class="scene2-conclusion-item">
                <rect x="30" y="140" width="280" height="35" rx="4" fill="transparent"/>
                <text id="scene2-conclusion-3-text" x="45" y="162" font-size="14" fill="#000000">③ x&gt;0 时 y 随 x 增大而减小</text>
            </g>
            
            <!-- 结论④ -->
            <g id="scene2-conclusion-4" class="scene2-conclusion-item">
                <rect x="30" y="180" width="280" height="35" rx="4" fill="transparent"/>
                <text id="scene2-conclusion-4-text" x="45" y="202" font-size="14" fill="#000000">④ y&gt;0 时，-1&lt;x&lt;3</text>
            </g>
            
            <!-- 结论⑤ -->
            <g id="scene2-conclusion-5" class="scene2-conclusion-item">
                <rect x="30" y="220" width="280" height="35" rx="4" fill="transparent"/>
                <text id="scene2-conclusion-5-text" x="45" y="242" font-size="14" fill="#000000">⑤ 两根 x₁=-1，x₂=3</text>
            </g>
            
            <!-- 右侧推导区容器 -->
            <rect id="scene2-right-container" x="360" y="50" width="420" height="340" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
            
            <!-- 右侧推导区标题 -->
            <text id="scene2-derivation-title" x="570" y="40" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">推导验证</text>
            
            <!-- 坐标轴 -->
            <line id="scene2-x-axis" x1="380" y1="290" x2="760" y2="290" stroke="#333" stroke-width="2"/>
            <line id="scene2-y-axis" x1="570" y1="90" x2="570" y2="330" stroke="#333" stroke-width="2"/>
            <text id="scene2-x-label" x="755" y="285" font-size="14" fill="#333">x</text>
            <text id="scene2-y-label" x="555" y="85" font-size="14" fill="#333">y</text>
            
            <!-- 抛物线：顶点 (570,90)，过 (-1,0) 即 (410,290) 和 (3,0) 即 (730,290) -->
            <path id="scene2-parabola" d="M 410,290 Q 570,90 730,290" fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 对称轴虚线 -->
            <line id="scene2-symmetry-axis" x1="570" y1="90" x2="570" y2="310" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
            <text id="scene2-symmetry-label" x="580" y="80" font-size="12" fill="#888888">x=1</text>
            
            <!-- x 轴交点 (-1,0) -->
            <circle id="scene2-point-left" cx="410" cy="290" r="6" fill="#c62828" opacity="0"/>
            <text id="scene2-point-left-label" x="385" y="310" font-size="11" fill="#c62828" opacity="0">(-1,0)</text>
            
            <!-- x 轴交点 (3,0) -->
            <circle id="scene2-point-right" cx="730" cy="290" r="6" fill="#c62828" opacity="0"/>
            <text id="scene2-point-right-label" x="710" y="310" font-size="11" fill="#c62828" opacity="0">(3,0)</text>
            
            <!-- y 轴交点 (0,3) -->
            <circle id="scene2-point-y" cx="570" cy="190" r="6" fill="#1565c0" opacity="0"/>
            <text id="scene2-point-y-label" x="550" y="185" font-size="11" fill="#1565c0" opacity="0">(0,3)</text>
            
            <!-- 单调性箭头（步骤 3 使用） -->
            <g id="scene2-monotonicity-arrows" opacity="0">
                <line x1="490" y1="210" x2="490" y2="170" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene2-arrow-up)"/>
                <line x1="650" y1="170" x2="650" y2="210" stroke="#c62828" stroke-width="2" marker-end="url(#scene2-arrow-down)"/>
                <text x="465" y="165" font-size="11" fill="#2e7d32">递增</text>
                <text x="625" y="225" font-size="11" fill="#c62828">递减</text>
            </g>
            
            <!-- y>0 区域高亮（步骤 4 使用） -->
            <rect id="scene2-y-positive-region" x="410" y="290" width="320" height="100" fill="#2e7d32" opacity="0"/>
            
            <!-- 推导公式文本区域（在右侧容器内，y=350 位置） -->
            <text id="scene2-derivation-text" x="375" y="355" font-size="13" fill="#000000">点击「下一步」开始验证</text>
            
            <!-- 判断结果标记（在右侧容器内，y=380 位置，靠右对齐） -->
            <text id="scene2-result-mark" x="750" y="380" text-anchor="end" font-size="16" font-weight="bold" fill="#333">-</text>
            
            <!-- 统计结果文本（步骤 6 显示） -->
            <text id="scene2-stat-result" x="570" y="430" text-anchor="middle" font-size="17" font-weight="bold" fill="#1565c0" opacity="0">正确结论个数：3 个（答案 B）</text>
            
            <!-- 箭头标记定义 -->
            <defs>
                <marker id="scene2-arrow-up" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
                    <path d="M 0,10 L 5,0 L 10,10 Z" fill="#2e7d32"/>
                </marker>
                <marker id="scene2-arrow-down" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
                    <path d="M 0,0 L 5,10 L 10,0 Z" fill="#c62828"/>
                </marker>
            </defs>
        </svg>
        
        <!-- 控件栏叠在 SVG 底部 -->
        <div id="scene2-controls">
            <button id="scene2-prev-btn" class="scene2-btn scene2-btn-secondary" disabled>◀ 上一步</button>
            <button id="scene2-next-btn" class="scene2-btn scene2-btn-primary">下一步 ▶</button>
            <button id="scene2-reset-btn" class="scene2-btn scene2-btn-secondary">重置</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现
        // 布局坐标表（对照实现）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 备注 |
        // | 左侧结论列表容器 | rect | (20,50)-(320,390) | 300×340 | 浅灰色背景 |
        // | 结论①文本 | text | (45,82) | ~200×20 | 字号 14px |
        // | 结论②文本 | text | (45,122) | ~200×20 | 字号 14px |
        // | 结论③文本 | text | (45,162) | ~200×20 | 字号 14px |
        // | 结论④文本 | (45,202) | ~200×20 | 字号 14px |
        // | 结论⑤文本 | text | (45,242) | ~200×20 | 字号 14px |
        // | 右侧推导区容器 | rect | (360,50)-(780,390) | 420×340 | 白色背景 |
        // | 抛物线简化图 | path | (380,90)-(760,310) | 380×220 | 开口向下 |
        // | 对称轴虚线 | line | (570,90)-(570,310) | 4×220 | 灰色虚线 |
        // | 对称轴标签"x=1" | text | (580,80) | ~40×16 | 灰色 |
        // | x 轴交点 (-1,0) | circle | (410,290) | 6 | 红色点 |
        // | x 轴交点 (3,0) | circle | (730,290) | 6 | 红色点 |
        // | y 轴交点 (0,3) | circle | (570,190) | 6 | 蓝色点 |
        // | 推导公式文本 | text | (375,355) | ~380×40 | 字号 13px |
        // | 判断结果标记 | text | (750,380) | ~60×30 | 绿色✓或红色✗，右对齐 |
        // | 统计结果文本 | text | (570,430) | ~200×24 | 字号 17px，步骤 6 显示 |
        
        // 状态变量
        var currentStep = 0;
        var totalSteps = 6;
        
        // 结论正确性（步骤 6 统计用）
        var conclusionCorrect = [true, false, false, true, true]; // ①✓ ②✗ ③✗ ④✓ ⑤✓
        
        // DOM 元素缓存
        var elements = {
            prevBtn: document.getElementById('scene2-prev-btn'),
            nextBtn: document.getElementById('scene2-next-btn'),
            resetBtn: document.getElementById('scene2-reset-btn'),
            derivationText: document.getElementById('scene2-derivation-text'),
            resultMark: document.getElementById('scene2-result-mark'),
            statResult: document.getElementById('scene2-stat-result'),
            parabola: document.getElementById('scene2-parabola'),
            pointLeft: document.getElementById('scene2-point-left'),
            pointLeftLabel: document.getElementById('scene2-point-left-label'),
            pointRight: document.getElementById('scene2-point-right'),
            pointRightLabel: document.getElementById('scene2-point-right-label'),
            pointY: document.getElementById('scene2-point-y'),
            pointYLabel: document.getElementById('scene2-point-y-label'),
            monotonicityArrows: document.getElementById('scene2-monotonicity-arrows'),
            yPositiveRegion: document.getElementById('scene2-y-positive-region'),
            conclusions: [
                document.getElementById('scene2-conclusion-1'),
                document.getElementById('scene2-conclusion-2'),
                document.getElementById('scene2-conclusion-3'),
                document.getElementById('scene2-conclusion-4'),
                document.getElementById('scene2-conclusion-5')
            ]
        };
        
        // 工具函数：显示 SVG 元素
        function showSvg(el) {
            if (el) {
                el.style.display = 'inline';
                el.setAttribute('opacity', '1');
            }
        }
        
        // 工具函数：隐藏 SVG 元素
        function hideSvg(el) {
            if (el) {
                el.setAttribute('opacity', '0');
            }
        }
        
        // 清除所有高亮
        function clearHighlights() {
            elements.conclusions.forEach(function(conc) {
                conc.classList.remove('highlight', 'correct', 'wrong');
                conc.querySelector('rect').setAttribute('fill', 'transparent');
            });
        }
        
        // 高亮指定结论
        function highlightConclusion(index, status) {
            clearHighlights();
            if (index >= 0 && index < elements.conclusions.length) {
                var conc = elements.conclusions[index];
                conc.classList.add('highlight');
                conc.querySelector('rect').setAttribute('fill', 'rgba(21, 101, 192, 0.2)');
                
                if (status === 'correct') {
                    conc.classList.add('correct');
                    conc.querySelector('rect').setAttribute('fill', 'rgba(46, 125, 50, 0.2)');
                } else if (status === 'wrong') {
                    conc.classList.add('wrong');
                    conc.querySelector('rect').setAttribute('fill', 'rgba(198, 40, 40, 0.2)');
                }
            }
        }
        
        // 更新步骤显示
        function updateStep() {
            // 更新按钮状态
            elements.prevBtn.disabled = (currentStep === 0);
            elements.nextBtn.disabled = (currentStep === totalSteps);
            elements.nextBtn.textContent = (currentStep === totalSteps) ? '完成' : '下一步 ▶';
            
            // 隐藏统计结果（除非步骤 6）
            if (currentStep < totalSteps) {
                hideSvg(elements.statResult);
            }
            
            // 根据步骤更新内容
            switch(currentStep) {
                case 0: // 初始状态
                    elements.derivationText.textContent = '点击「下一步」开始验证';
                    elements.resultMark.textContent = '-';
                    elements.resultMark.setAttribute('fill', '#333');
                    elements.resultMark.setAttribute('font-weight', 'bold');
                    clearHighlights();
                    highlightConclusion(0);
                    // 隐藏所有点
                    hideSvg(elements.pointLeft);
                    hideSvg(elements.pointLeftLabel);
                    hideSvg(elements.pointRight);
                    hideSvg(elements.pointRightLabel);
                    hideSvg(elements.pointY);
                    hideSvg(elements.pointYLabel);
                    hideSvg(elements.monotonicityArrows);
                    hideSvg(elements.yPositiveRegion);
                    break;
                    
                case 1: // 验证结论①
                    elements.derivationText.textContent = '抛物线与 x 轴有两个交点 → Δ = b² - 4ac > 0 → 4ac < b²';
                    elements.resultMark.textContent = '✓ 正确';
                    elements.resultMark.setAttribute('fill', '#2e7d32');
                    elements.resultMark.setAttribute('font-weight', 'bold');
                    highlightConclusion(0, 'correct');
                    // 高亮两个 x 轴交点
                    showSvg(elements.pointLeft);
                    showSvg(elements.pointLeftLabel);
                    showSvg(elements.pointRight);
                    showSvg(elements.pointRightLabel);
                    hideSvg(elements.pointY);
                    hideSvg(elements.pointYLabel);
                    hideSvg(elements.monotonicityArrows);
                    hideSvg(elements.yPositiveRegion);
                    break;
                    
                case 2: // 验证结论②
                    elements.derivationText.textContent = '对称轴 x=1 → -b/(2a)=1 → b=-2a；过 (-1,0) → a-b+c=0 → 3a+c=0';
                    elements.resultMark.textContent = '✗ 错误';
                    elements.resultMark.setAttribute('fill', '#c62828');
                    elements.resultMark.setAttribute('font-weight', 'bold');
                    highlightConclusion(1, 'wrong');
                    // 高亮对称轴和点 (-1,0)
                    hideSvg(elements.pointLeft);
                    hideSvg(elements.pointLeftLabel);
                    hideSvg(elements.pointRight);
                    hideSvg(elements.pointRightLabel);
                    hideSvg(elements.pointY);
                    hideSvg(elements.pointYLabel);
                    hideSvg(elements.monotonicityArrows);
                    hideSvg(elements.yPositiveRegion);
                    break;
                    
                case 3: // 验证结论③
                    elements.derivationText.textContent = '开口向下，对称轴 x=1 → x<1 时 y 递增，x>1 时 y 递减';
                    elements.resultMark.textContent = '✗ 错误';
                    elements.resultMark.setAttribute('fill', '#c62828');
                    elements.resultMark.setAttribute('font-weight', 'bold');
                    highlightConclusion(2, 'wrong');
                    // 显示单调性箭头
                    showSvg(elements.monotonicityArrows);
                    hideSvg(elements.pointLeft);
                    hideSvg(elements.pointLeftLabel);
                    hideSvg(elements.pointRight);
                    hideSvg(elements.pointRightLabel);
                    hideSvg(elements.pointY);
                    hideSvg(elements.pointYLabel);
                    hideSvg(elements.yPositiveRegion);
                    break;
                    
                case 4: // 验证结论④
                    elements.derivationText.textContent = '两根为 -1 和 3，开口向下 → y>0 在两根之间 → -1<x<3';
                    elements.resultMark.textContent = '✓ 正确';
                    elements.resultMark.setAttribute('fill', '#2e7d32');
                    elements.resultMark.setAttribute('font-weight', 'bold');
                    highlightConclusion(3, 'correct');
                    // 高亮 x 轴上方区域
                    showSvg(elements.yPositiveRegion);
                    hideSvg(elements.monotonicityArrows);
                    hideSvg(elements.pointLeft);
                    hideSvg(elements.pointLeftLabel);
                    hideSvg(elements.pointRight);
                    hideSvg(elements.pointRightLabel);
                    hideSvg(elements.pointY);
                    hideSvg(elements.pointYLabel);
                    break;
                    
                case 5: // 验证结论⑤
                    elements.derivationText.textContent = '对称轴 x=1，一根为 -1 → 另一根=1+(1-(-1))=3';
                    elements.resultMark.textContent = '✓ 正确';
                    elements.resultMark.setAttribute('fill', '#2e7d32');
                    elements.resultMark.setAttribute('font-weight', 'bold');
                    highlightConclusion(4, 'correct');
                    // 高亮两个 x 轴交点并标注坐标
                    showSvg(elements.pointLeft);
                    showSvg(elements.pointLeftLabel);
                    showSvg(elements.pointRight);
                    showSvg(elements.pointRightLabel);
                    hideSvg(elements.pointY);
                    hideSvg(elements.pointYLabel);
                    hideSvg(elements.monotonicityArrows);
                    hideSvg(elements.yPositiveRegion);
                    break;
                    
                case 6: // 统计正确结论个数
                    elements.derivationText.textContent = '正确结论：①、④、⑤';
                    elements.resultMark.textContent = '共 3 个';
                    elements.resultMark.setAttribute('fill', '#1565c0');
                    elements.resultMark.setAttribute('font-weight', 'bold');
                    clearHighlights();
                    showSvg(elements.statResult);
                    // 显示所有关键点
                    showSvg(elements.pointLeft);
                    showSvg(elements.pointLeftLabel);
                    showSvg(elements.pointRight);
                    showSvg(elements.pointRightLabel);
                    showSvg(elements.pointY);
                    showSvg(elements.pointYLabel);
                    hideSvg(elements.monotonicityArrows);
                    hideSvg(elements.yPositiveRegion);
                    break;
            }
        }
        
        // 事件绑定
        elements.prevBtn.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });
        
        elements.nextBtn.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateStep();
            }
        });
        
        elements.resetBtn.addEventListener('click', function() {
            currentStep = 0;
            updateStep();
        });
        
        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
