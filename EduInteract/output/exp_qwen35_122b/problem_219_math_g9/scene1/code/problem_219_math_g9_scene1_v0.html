<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>反比例函数面积关系 - Scene 1</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            padding: 8px 20px;
            font-size: 14px;
            border: 2px solid #333;
            border-radius: 4px;
            background: #f5f5f5;
            cursor: pointer;
            transition: all 0.2s;
        }
        #scene1-controls button:hover:not(:disabled) {
            background: #e0e0e0;
            border-color: #666;
        }
        #scene1-controls button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .highlight-blue {
            animation: blueFlash 0.6s ease-in-out 2;
        }
        .highlight-red {
            animation: redFlash 0.6s ease-in-out 2;
        }
        @keyframes blueFlash {
            0%, 100% { stroke: #1565c0; stroke-width: 2; }
            50% { stroke: #42a5f5; stroke-width: 4; }
        }
        @keyframes redFlash {
            0%, 100% { stroke: #c62828; stroke-width: 2; }
            50% { stroke: #ef5350; stroke-width: 4; }
        }
        .formula-text {
            font-size: 13px;
            fill: #333;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 坐标轴 -->
            <line id="scene1-xaxis" x1="100" y1="420" x2="750" y2="420" stroke="#000000" stroke-width="2"/>
            <polygon id="scene1-xaxis-arrow" points="750,420 735,415 735,425" fill="#000000"/>
            <line id="scene1-yaxis" x1="100" y1="420" x2="100" y2="50" stroke="#000000" stroke-width="2"/>
            <polygon id="scene1-yaxis-arrow" points="100,50 95,65 105,65" fill="#000000"/>

            <!-- 函数曲线 -->
            <path id="scene1-curve" d="M 150,100 Q 300,180 500,280 T 700,350" stroke="#000000" stroke-width="2" fill="none"/>

            <!-- 曲线标签 y=k/x - 移到曲线左上方 -->
            <text id="scene1-curve-label" x="180" y="70" font-size="14" fill="#000000">y=k/x</text>

            <!-- 轴标签 -->
            <text id="scene1-label-x" x="740" y="410" font-size="14" fill="#000000">x</text>
            <text id="scene1-label-y" x="90" y="40" font-size="14" fill="#000000">y</text>

            <!-- 原点 O -->
            <circle id="scene1-point-o" cx="100" cy="420" r="4" fill="#000000"/>
            <text id="scene1-label-o" x="90" y="430" font-size="14" fill="#000000">O</text>

            <!-- 点 A -->
            <circle id="scene1-point-a" cx="250" cy="150" r="6" fill="#000000"/>
            <!-- 标签 A - 移到点 A 左侧 y 轴附近 -->
            <text id="scene1-label-a" x="120" y="140" font-size="14" fill="#000000">A</text>

            <!-- 点 B -->
            <circle id="scene1-point-b" cx="500" cy="250" r="6" fill="#000000"/>
            <!-- 标签 B - 移到点 B 右侧，远离图形 -->
            <text id="scene1-label-b" x="520" y="230" font-size="14" fill="#000000">B</text>

            <!-- 垂足 D (步骤 1 显示) -->
            <circle id="scene1-point-d" cx="100" cy="150" r="4" fill="#000000" style="display:none;"/>
            <text id="scene1-label-d" x="85" y="150" font-size="14" fill="#000000" style="display:none;">D</text>

            <!-- 垂足 C (步骤 1 显示) -->
            <circle id="scene1-point-c" cx="100" cy="250" r="4" fill="#000000" style="display:none;"/>
            <text id="scene1-label-c" x="85" y="250" font-size="14" fill="#000000" style="display:none;">C</text>

            <!-- 垂线 AD (步骤 1 显示) -->
            <line id="scene1-line-ad" x1="250" y1="150" x2="100" y2="150" stroke="#000000" stroke-width="1.5" style="display:none;"/>

            <!-- 垂线 BC (步骤 1 显示) -->
            <line id="scene1-line-bc" x1="500" y1="250" x2="100" y2="250" stroke="#000000" stroke-width="1.5" style="display:none;"/>

            <!-- 梯形 ABCD 区域 (步骤 1 显示) -->
            <polygon id="scene1-trapezoid" points="100,150 250,150 500,250 100,250" fill="#1565c0" fill-opacity="0.2" stroke="#1565c0" stroke-width="2" style="display:none;"/>

            <!-- 面积标签 S₁ (步骤 1 显示) - 移到 y 轴左侧空白区域 -->
            <text id="scene1-label-s1" x="50" y="200" font-size="14" fill="#1565c0" style="display:none;">S₁</text>

            <!-- 线段 OA (步骤 2 显示) -->
            <line id="scene1-line-oa" x1="100" y1="420" x2="250" y2="150" stroke="#000000" stroke-width="1.5" style="display:none;"/>

            <!-- 线段 OB (步骤 2 显示) -->
            <line id="scene1-line-ob" x1="100" y1="420" x2="500" y2="250" stroke="#000000" stroke-width="1.5" style="display:none;"/>

            <!-- 线段 AB (步骤 2 显示) -->
            <line id="scene1-line-ab" x1="250" y1="150" x2="500" y2="250" stroke="#000000" stroke-width="1.5" style="display:none;"/>

            <!-- 三角形 OAB 区域 (步骤 2 显示) -->
            <polygon id="scene1-triangle" points="100,420 250,150 500,250" fill="#c62828" fill-opacity="0.2" stroke="#c62828" stroke-width="2" style="display:none;"/>

            <!-- 面积标签 S₂ (步骤 2 显示) - 移到 y 轴左侧空白区域 -->
            <text id="scene1-label-s2" x="50" y="300" font-size="14" fill="#c62828" style="display:none;">S₂</text>

            <!-- 坐标标签 A (步骤 3 显示) - 移到 y 轴左侧空白区域，与 S₁ 标签错开 -->
            <text id="scene1-label-coord-a" x="50" y="220" font-size="12" fill="#333" style="display:none;">A(x₁, y₁)</text>

            <!-- 坐标标签 B (步骤 3 显示) - 移到 y 轴左侧空白区域，与 S₂ 标签错开 -->
            <text id="scene1-label-coord-b" x="50" y="320" font-size="12" fill="#333" style="display:none;">B(x₂, y₂)</text>

            <!-- 公式文本 (步骤 4 显示) - 移到 y 轴左侧空白区域，增加行距 -->
            <text id="scene1-formula-s1" x="50" y="360" class="formula-text" style="display:none;">S₁ = ½(x₁+x₂)(y₁-y₂) = k</text>
            <text id="scene1-formula-s2" x="50" y="390" class="formula-text" style="display:none;">S₂ = ½|x₁y₂ - x₂y₁| = k</text>
            <text id="scene1-conclusion" x="80" y="420" font-size="16" fill="#000000" font-weight="bold" style="display:none;">S₁ : S₂ = 1 : 1</text>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-prev-btn" disabled>◀ 上一步</button>
            <button id="scene1-next-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        // 布局坐标表对照：
        // x 轴：(100,420)-(750,420)
        // y 轴：(100,420)-(100,50)
        // 原点 O：(100,420)
        // 点 A：(250,150)
        // 点 B：(500,250)
        // 垂足 D：(100,150)
        // 垂足 C：(100,250)
        // 梯形 ABCD：(100,150)-(250,150)-(500,250)-(100,250)
        // 三角形 OAB：(100,420)-(250,150)-(500,250)

        const MAX_STEP = 4;
        let currentStep = 0;

        // 工具函数：显示元素
        function show(elId) {
            const el = document.getElementById(elId);
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }

        // 工具函数：隐藏元素
        function hide(elId) {
            const el = document.getElementById(elId);
            if (el) {
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }

        // 工具函数：移除高亮类
        function removeHighlight(elId) {
            const el = document.getElementById(elId);
            if (el) {
                el.classList.remove('highlight-blue', 'highlight-red');
            }
        }

        // 更新场景显示
        function updateScene() {
            // 重置所有步骤相关的元素
            const stepElements = [
                'scene1-point-d', 'scene1-label-d', 'scene1-point-c', 'scene1-label-c',
                'scene1-line-ad', 'scene1-line-bc', 'scene1-trapezoid', 'scene1-label-s1',
                'scene1-line-oa', 'scene1-line-ob', 'scene1-line-ab', 'scene1-triangle', 'scene1-label-s2',
                'scene1-label-coord-a', 'scene1-label-coord-b',
                'scene1-formula-s1', 'scene1-formula-s2', 'scene1-conclusion'
            ];
            stepElements.forEach(hide);

            // 移除高亮
            removeHighlight('scene1-trapezoid');
            removeHighlight('scene1-triangle');

            // 恢复点 A、B 的原始大小
            const pointA = document.getElementById('scene1-point-a');
            const pointB = document.getElementById('scene1-point-b');
            if (pointA) pointA.setAttribute('r', '6');
            if (pointB) pointB.setAttribute('r', '6');

            // 步骤 0：基础坐标系和曲线
            // 已默认显示，无需额外操作

            // 步骤 1：添加垂线，高亮梯形
            if (currentStep >= 1) {
                show('scene1-point-d');
                show('scene1-label-d');
                show('scene1-point-c');
                show('scene1-label-c');
                show('scene1-line-ad');
                show('scene1-line-bc');
                show('scene1-trapezoid');
                show('scene1-label-s1');
                // 高亮梯形
                const trapezoid = document.getElementById('scene1-trapezoid');
                if (trapezoid) {
                    trapezoid.classList.remove('highlight-blue');
                    void trapezoid.offsetWidth; // 触发重绘
                    trapezoid.classList.add('highlight-blue');
                }
            }

            // 步骤 2：连接 OA、OB，高亮三角形
            if (currentStep >= 2) {
                show('scene1-line-oa');
                show('scene1-line-ob');
                show('scene1-line-ab');
                show('scene1-triangle');
                show('scene1-label-s2');
                // 高亮三角形
                const triangle = document.getElementById('scene1-triangle');
                if (triangle) {
                    triangle.classList.remove('highlight-red');
                    void triangle.offsetWidth; // 触发重绘
                    triangle.classList.add('highlight-red');
                }
            }

            // 步骤 3：显示坐标标注
            if (currentStep >= 3) {
                show('scene1-label-coord-a');
                show('scene1-label-coord-b');
                // 高亮点 A、B
                if (pointA) pointA.setAttribute('r', '8');
                if (pointB) pointB.setAttribute('r', '8');
            }

            // 步骤 4：面积公式与结论
            if (currentStep >= 4) {
                show('scene1-formula-s1');
                show('scene1-formula-s2');
                show('scene1-conclusion');
                // 同时高亮梯形和三角形
                const trapezoid = document.getElementById('scene1-trapezoid');
                const triangle = document.getElementById('scene1-triangle');
                if (trapezoid) {
                    trapezoid.classList.remove('highlight-blue');
                    void trapezoid.offsetWidth;
                    trapezoid.classList.add('highlight-blue');
                }
                if (triangle) {
                    triangle.classList.remove('highlight-red');
                    void triangle.offsetWidth;
                    triangle.classList.add('highlight-red');
                }
            }

            // 更新按钮状态
            const prevBtn = document.getElementById('scene1-prev-btn');
            const nextBtn = document.getElementById('scene1-next-btn');
            if (prevBtn) prevBtn.disabled = (currentStep === 0);
            if (nextBtn) nextBtn.disabled = (currentStep === MAX_STEP);
        }

        // 事件绑定
        document.addEventListener('DOMContentLoaded', function() {
            const prevBtn = document.getElementById('scene1-prev-btn');
            const nextBtn = document.getElementById('scene1-next-btn');

            if (prevBtn) {
                prevBtn.addEventListener('click', function() {
                    if (currentStep > 0) {
                        currentStep--;
                        updateScene();
                    }
                });
            }

            if (nextBtn) {
                nextBtn.addEventListener('click', function() {
                    if (currentStep < MAX_STEP) {
                        currentStep++;
                        updateScene();
                    }
                });
            }

            // 初始化场景
            updateScene();
        });
    })();
    </script>
</body>
</html>
