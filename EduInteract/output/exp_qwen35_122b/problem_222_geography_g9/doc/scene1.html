<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>经纬网方向判断与坐标匹配</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene1-prev-btn, #scene1-next-btn {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border: 2px solid #1565c0;
            border-radius: 6px;
            background: #ffffff;
            color: #1565c0;
            font-weight: bold;
        }
        #scene1-prev-btn:hover, #scene1-next-btn:hover {
            background: #1565c0;
            color: #ffffff;
        }
        #scene1-prev-btn:disabled {
            border-color: #cccccc;
            color: #cccccc;
            cursor: not-allowed;
        }
        #scene1-prev-btn:disabled:hover {
            background: #ffffff;
        }
        #scene1-step-indicator {
            font-size: 14px;
            color: #333333;
            font-weight: bold;
            line-height: 35px;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500">
            <!-- 经度标注（网格上方，y=35） -->
            <text x="80" y="35" text-anchor="middle" font-size="12" fill="#000000">150°</text>
            <text x="144" y="35" text-anchor="middle" font-size="12" fill="#000000">120°</text>
            <text x="208" y="35" text-anchor="middle" font-size="12" fill="#000000">90°</text>
            <text x="272" y="35" text-anchor="middle" font-size="12" fill="#000000">60°</text>
            <text x="336" y="35" text-anchor="middle" font-size="12" fill="#000000">30°</text>
            <text x="400" y="35" text-anchor="middle" font-size="12" fill="#000000">0°</text>
            <text x="464" y="35" text-anchor="middle" font-size="12" fill="#000000">30°</text>
            <text x="528" y="35" text-anchor="middle" font-size="12" fill="#000000">60°</text>
            <text x="592" y="35" text-anchor="middle" font-size="12" fill="#000000">90°</text>
            <text x="656" y="35" text-anchor="middle" font-size="12" fill="#000000">120°</text>
            <text x="720" y="35" text-anchor="middle" font-size="12" fill="#000000">150°</text>

            <!-- 纬度标注（网格右侧，x=740） -->
            <text x="740" y="65" text-anchor="middle" font-size="12" fill="#000000">40°N</text>
            <text x="740" y="129" text-anchor="middle" font-size="12" fill="#000000">30°N</text>
            <text x="740" y="193" text-anchor="middle" font-size="12" fill="#000000">20°N</text>
            <text x="740" y="257" text-anchor="middle" font-size="12" fill="#000000">10°N</text>
            <text x="740" y="321" text-anchor="middle" font-size="12" fill="#000000">0°</text>
            <text x="740" y="385" text-anchor="middle" font-size="12" fill="#000000">10°S</text>

            <!-- 经线（纵向，共 11 条） -->
            <line x1="80" y1="60" x2="80" y2="380" stroke="#000000" stroke-width="1.5"/>
            <line x1="144" y1="60" x2="144" y2="380" stroke="#000000" stroke-width="1.5"/>
            <line x1="208" y1="60" x2="208" y2="380" stroke="#000000" stroke-width="1.5"/>
            <line x1="272" y1="60" x2="272" y2="380" stroke="#000000" stroke-width="1.5"/>
            <line x1="336" y1="60" x2="336" y2="380" stroke="#000000" stroke-width="1.5"/>
            <line x1="400" y1="60" x2="400" y2="380" stroke="#000000" stroke-width="1.5"/>
            <line x1="464" y1="60" x2="464" y2="380" stroke="#000000" stroke-width="1.5"/>
            <line x1="528" y1="60" x2="528" y2="380" stroke="#000000" stroke-width="1.5"/>
            <line x1="592" y1="60" x2="592" y2="380" stroke="#000000" stroke-width="1.5"/>
            <line x1="656" y1="60" x2="656" y2="380" stroke="#000000" stroke-width="1.5"/>
            <line x1="720" y1="60" x2="720" y2="380" stroke="#000000" stroke-width="1.5"/>

            <!-- 纬线（横向，共 6 条） -->
            <line x1="80" y1="60" x2="720" y2="60" stroke="#000000" stroke-width="1.5"/>
            <line x1="80" y1="124" x2="720" y2="124" stroke="#000000" stroke-width="1.5"/>
            <line x1="80" y1="188" x2="720" y2="188" stroke="#000000" stroke-width="1.5"/>
            <line x1="80" y1="252" x2="720" y2="252" stroke="#000000" stroke-width="1.5"/>
            <line x1="80" y1="316" x2="720" y2="316" stroke="#000000" stroke-width="1.5"/>
            <line x1="80" y1="380" x2="720" y2="380" stroke="#000000" stroke-width="1.5"/>

            <!-- 四个点（黑色实心圆，直径 6px） -->
            <circle id="scene1-point-1" cx="144" cy="316" r="3" fill="#000000"/>
            <circle id="scene1-point-2" cx="592" cy="316" r="3" fill="#000000"/>
            <circle id="scene1-point-3" cx="656" cy="92" r="3" fill="#000000"/>
            <circle id="scene1-point-4" cx="144" cy="92" r="3" fill="#000000"/>

            <!-- 点号标注（调整位置避免重叠） -->
            <text id="scene1-label-1" x="125" y="335" font-size="14" fill="#000000">①</text>
            <text id="scene1-label-2" x="605" y="335" font-size="14" fill="#000000">②</text>
            <text id="scene1-label-3" x="675" y="78" font-size="14" fill="#000000">③</text>
            <text id="scene1-label-4" x="130" y="78" font-size="14" fill="#000000">④</text>

            <!-- 步骤 1：高亮①点和③点（蓝色，直径 8px） -->
            <circle id="scene1-point-1-highlight" cx="144" cy="316" r="4" fill="#1565c0" style="display: none;"/>
            <circle id="scene1-point-3-highlight" cx="656" cy="92" r="4" fill="#1565c0" style="display: none;"/>

            <!-- 步骤 1：方向辅助线（虚线） -->
            <line id="scene1-guide-vertical" x1="656" y1="92" x2="656" y2="316" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" style="display: none;"/>
            <line id="scene1-guide-horizontal" x1="144" y1="316" x2="656" y2="316" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" style="display: none;"/>

            <!-- 步骤 1：方向标注（调整位置避免与点号重叠，东字移到更右侧，避免与 20°N 重叠） -->
            <text id="scene1-direction-north" x="656" y="70" text-anchor="middle" font-size="14" fill="#888888" style="display: none;">北</text>
            <text id="scene1-direction-south" x="144" y="355" text-anchor="middle" font-size="14" fill="#888888" style="display: none;">南</text>
            <text id="scene1-direction-west" x="100" y="320" text-anchor="middle" font-size="14" fill="#888888" style="display: none;">西</text>
            <text id="scene1-direction-east" x="730" y="225" text-anchor="middle" font-size="14" fill="#888888" style="display: none;">东</text>

            <!-- 步骤 2：新加坡位置标记（红色空心圆，直径 8px） -->
            <circle id="scene1-singapore-point" cx="630" cy="308" r="4" fill="none" stroke="#c62828" stroke-width="2" style="display: none;"/>
            <text id="scene1-singapore-label" x="645" y="290" font-size="12" fill="#c62828" style="display: none;">新加坡 (1°N, 104°E)</text>

            <!-- 步骤 3：答案框（绿色边框，背景透明度 20%，调整位置避免重叠） -->
            <rect id="scene1-answer-box" x="50" y="395" width="320" height="95" fill="#ffffff" fill-opacity="0.2" stroke="#2e7d32" stroke-width="2" style="display: none;"/>
            <text id="scene1-answer-text" x="65" y="420" font-size="14" fill="#2e7d32" style="display: none;">
                <tspan x="65" dy="0">（1）①点在③点的西南方向</tspan>
                <tspan x="65" dy="22">（2）新加坡位置接近②</tspan>
                <tspan x="65" dy="22">①的经纬度为 (0°, 120°W)</tspan>
            </text>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-prev-btn" disabled>◀ 上一步</button>
            <text id="scene1-step-indicator" x="370" y="455" text-anchor="middle" font-size="14" fill="#333333">步骤 1/4</text>
            <button id="scene1-next-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现：经纬网方向判断与坐标匹配
        // 坐标表对照：
        // 经线：150°W(80), 120°W(144), 90°W(208), 60°W(272), 30°W(336), 0°(400), 30°E(464), 60°E(528), 90°E(592), 120°E(656), 150°E(720)
        // 纬线：40°N(60), 30°N(124), 20°N(188), 10°N(252), 0°(316), 10°S(380)
        // 点位置：①(144,316)=0°,120°W; ②(592,316)=0°,90°E; ③(656,92)=35°N,120°E; ④(144,92)=35°N,120°W

        var currentStep = 0;
        var totalSteps = 4;

        // 获取 DOM 元素
        var prevBtn = document.getElementById('scene1-prev-btn');
        var nextBtn = document.getElementById('scene1-next-btn');
        var stepIndicator = document.getElementById('scene1-step-indicator');

        // 步骤 1 元素
        var point1Highlight = document.getElementById('scene1-point-1-highlight');
        var point3Highlight = document.getElementById('scene1-point-3-highlight');
        var guideVertical = document.getElementById('scene1-guide-vertical');
        var guideHorizontal = document.getElementById('scene1-guide-horizontal');
        var directionNorth = document.getElementById('scene1-direction-north');
        var directionSouth = document.getElementById('scene1-direction-south');
        var directionWest = document.getElementById('scene1-direction-west');
        var directionEast = document.getElementById('scene1-direction-east');

        // 步骤 2 元素
        var singaporePoint = document.getElementById('scene1-singapore-point');
        var singaporeLabel = document.getElementById('scene1-singapore-label');

        // 步骤 3 元素
        var answerBox = document.getElementById('scene1-answer-box');
        var answerText = document.getElementById('scene1-answer-text');

        // 工具函数：显示元素
        function show(el) {
            el.style.display = 'block';
            el.style.opacity = '1';
        }

        // 工具函数：隐藏元素
        function hide(el) {
            el.style.display = 'none';
            el.style.opacity = '0';
        }

        // 更新显示状态
        function updateDisplay() {
            // 更新步骤指示器
            stepIndicator.textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;

            // 更新按钮状态
            prevBtn.disabled = (currentStep === 0);
            if (currentStep === totalSteps - 1) {
                nextBtn.textContent = '完成';
                nextBtn.disabled = true;
            } else {
                nextBtn.textContent = '下一步 ▶';
                nextBtn.disabled = false;
            }

            // 步骤 1：高亮①③点，显示辅助线和方向标注
            if (currentStep >= 1) {
                show(point1Highlight);
                show(point3Highlight);
                show(guideVertical);
                show(guideHorizontal);
                show(directionNorth);
                show(directionSouth);
                show(directionWest);
                show(directionEast);
            } else {
                hide(point1Highlight);
                hide(point3Highlight);
                hide(guideVertical);
                hide(guideHorizontal);
                hide(directionNorth);
                hide(directionSouth);
                hide(directionWest);
                hide(directionEast);
            }

            // 步骤 2：显示新加坡位置
            if (currentStep >= 2) {
                show(singaporePoint);
                show(singaporeLabel);
            } else {
                hide(singaporePoint);
                hide(singaporeLabel);
            }

            // 步骤 3：显示答案框
            if (currentStep >= 3) {
                show(answerBox);
                show(answerText);
            } else {
                hide(answerBox);
                hide(answerText);
            }
        }

        // 上一步按钮点击
        prevBtn.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        });

        // 下一步按钮点击
        nextBtn.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateDisplay();
            }
        });

        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
