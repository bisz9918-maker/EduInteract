<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地球公转示意图 - Scene 1</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Microsoft YaHei', sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; justify-content: center; gap: 12px; z-index: 10; background: rgba(255,255,255,0.9); padding: 8px 16px; border-radius: 8px; }
        #scene1-prev-btn, #scene1-next-btn { padding: 6px 16px; font-size: 14px; cursor: pointer; border: 1px solid #333; border-radius: 4px; background: #f5f5f5; }
        #scene1-prev-btn:hover, #scene1-next-btn:hover { background: #e0e0e0; }
        #scene1-prev-btn:disabled, #scene1-next-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 14px; color: #333; line-height: 28px; min-width: 100px; text-align: center; }
        .scene1-lat-label { font-size: 12px; fill: #666666; }
        .scene1-earth-label { font-size: 16px; fill: #000000; font-weight: bold; }
        .scene1-solstice-label { font-size: 14px; fill: #000000; }
        .scene1-highlight { stroke: #2e7d32; stroke-width: 3; fill: none; }
        .scene1-ray { stroke: #ff9800; stroke-width: 1; }
        .scene1-axis { stroke: #000000; stroke-width: 2; }
        .scene1-orbit { stroke: #000000; stroke-width: 2; fill: none; }
        .scene1-arrow { stroke: #000000; stroke-width: 2; fill: none; }
        .scene1-direct-point { fill: #c62828; }
        .scene1-sun { fill: #ff9800; }
        .scene1-day { fill: #1565c0; }
        .scene1-night { fill: #c62828; opacity: 0.3; }
        .scene1-info-text { font-size: 13px; fill: #333333; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500">
            <!-- 公转轨道 - 缩小一点，给纬线标注留出空间 -->
            <ellipse id="scene1-orbit" cx="400" cy="250" rx="240" ry="130" class="scene1-orbit"/>
            
            <!-- 公转箭头 -->
            <path id="scene1-arrow1" d="M 500 125 Q 530 110 560 95" class="scene1-arrow" marker-end="url(#scene1-arrowhead)"/>
            <path id="scene1-arrow2" d="M 680 195 Q 695 220 700 245" class="scene1-arrow" marker-end="url(#scene1-arrowhead)"/>
            <path id="scene1-arrow3" d="M 500 375 Q 530 390 560 405" class="scene1-arrow" marker-end="url(#scene1-arrowhead)"/>
            <path id="scene1-arrow4" d="M 100 195 Q 85 220 80 245" class="scene1-arrow" marker-end="url(#scene1-arrowhead)"/>
            
            <!-- 箭头标记定义 -->
            <defs>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#000000"/>
                </marker>
            </defs>
            
            <!-- 太阳 -->
            <circle id="scene1-sun" cx="400" cy="250" r="20" class="scene1-sun"/>
            
            <!-- 地球 a (冬至) - 右侧 -->
            <g id="scene1-earth-a-group">
                <circle id="scene1-earth-a" cx="640" cy="250" r="20" class="scene1-day"/>
                <!-- 夜半球 -->
                <path id="scene1-earth-a-night" d="M 640 230 A 20 20 0 1 1 640 270 Z" class="scene1-night"/>
                <!-- 地轴 -->
                <line id="scene1-axis-a" x1="640" y1="220" x2="640" y2="280" class="scene1-axis"/>
                <!-- 标签 a -->
                <text id="scene1-label-a" x="700" y="240" text-anchor="start" class="scene1-earth-label">a</text>
                <!-- 冬至标签 -->
                <text id="scene1-solstice-a" x="700" y="260" text-anchor="start" class="scene1-solstice-label">冬至</text>
                <!-- 高亮框 -->
                <circle id="scene1-highlight-a" cx="640" cy="250" r="24" class="scene1-highlight" style="opacity: 0;"/>
            </g>
            
            <!-- 地球 b (春分) - 上方 -->
            <g id="scene1-earth-b-group">
                <circle id="scene1-earth-b" cx="400" cy="120" r="20" class="scene1-day"/>
                <!-- 夜半球 -->
                <path id="scene1-earth-b-night" d="M 380 120 A 20 20 0 1 1 420 120 Z" class="scene1-night"/>
                <!-- 地轴 -->
                <line id="scene1-axis-b" x1="380" y1="90" x2="420" y2="150" class="scene1-axis"/>
                <!-- 标签 b -->
                <text id="scene1-label-b" x="420" y="95" text-anchor="start" class="scene1-earth-label">b</text>
                <!-- 春分标签 -->
                <text id="scene1-solstice-b" x="420" y="115" text-anchor="start" class="scene1-solstice-label">春分</text>
                <!-- 高亮框 -->
                <circle id="scene1-highlight-b" cx="400" cy="120" r="24" class="scene1-highlight" style="opacity: 0;"/>
            </g>
            
            <!-- 地球 c (夏至) - 左侧 -->
            <g id="scene1-earth-c-group">
                <circle id="scene1-earth-c" cx="160" cy="250" r="20" class="scene1-day"/>
                <!-- 夜半球 -->
                <path id="scene1-earth-c-night" d="M 160 230 A 20 20 0 1 1 160 270 Z" class="scene1-night"/>
                <!-- 地轴 -->
                <line id="scene1-axis-c" x1="160" y1="220" x2="160" y2="280" class="scene1-axis"/>
                <!-- 标签 c -->
                <text id="scene1-label-c" x="100" y="240" text-anchor="end" class="scene1-earth-label">c</text>
                <!-- 夏至标签 -->
                <text id="scene1-solstice-c" x="100" y="260" text-anchor="end" class="scene1-solstice-label">夏至</text>
                <!-- 高亮框 -->
                <circle id="scene1-highlight-c" cx="160" cy="250" r="24" class="scene1-highlight" style="opacity: 0;"/>
            </g>
            
            <!-- 地球 d (秋分) - 下方 -->
            <g id="scene1-earth-d-group">
                <circle id="scene1-earth-d" cx="400" cy="380" r="20" class="scene1-day"/>
                <!-- 夜半球 -->
                <path id="scene1-earth-d-night" d="M 420 380 A 20 20 0 1 1 380 380 Z" class="scene1-night"/>
                <!-- 地轴 -->
                <line id="scene1-axis-d" x1="380" y1="350" x2="420" y2="410" class="scene1-axis"/>
                <!-- 标签 d -->
                <text id="scene1-label-d" x="420" y="410" text-anchor="start" class="scene1-earth-label">d</text>
                <!-- 秋分标签 -->
                <text id="scene1-solstice-d" x="420" y="430" text-anchor="start" class="scene1-solstice-label">秋分</text>
                <!-- 高亮框 -->
                <circle id="scene1-highlight-d" cx="400" cy="380" r="24" class="scene1-highlight" style="opacity: 0;"/>
            </g>
            
            <!-- 太阳光线 -->
            <line id="scene1-ray-a" x1="420" y1="250" x2="620" y2="250" class="scene1-ray" style="opacity: 0;"/>
            <line id="scene1-ray-b" x1="400" y1="270" x2="400" y2="140" class="scene1-ray" style="opacity: 0;"/>
            <line id="scene1-ray-c" x1="380" y1="250" x2="180" y2="250" class="scene1-ray" style="opacity: 0;"/>
            <line id="scene1-ray-d" x1="400" y1="230" x2="400" y2="360" class="scene1-ray" style="opacity: 0;"/>
            
            <!-- 纬线标注 - 移到轨道外侧，避免与轨道重叠 -->
            <text id="scene1-lat-north-回归" x="520" y="170" text-anchor="start" class="scene1-lat-label" style="opacity: 0;">北回归线</text>
            <text id="scene1-lat-arctic" x="520" y="150" text-anchor="start" class="scene1-lat-label" style="opacity: 0;">北极圈</text>
            <text id="scene1-lat-equator" x="400" y="305" text-anchor="middle" class="scene1-lat-label" style="opacity: 0;">赤道</text>
            <text id="scene1-lat-south-回归" x="280" y="370" text-anchor="end" class="scene1-lat-label" style="opacity: 0;">南回归线</text>
            <text id="scene1-lat-antarctic" x="280" y="390" text-anchor="end" class="scene1-lat-label" style="opacity: 0;">南极圈</text>
            
            <!-- 直射点标记 -->
            <circle id="scene1-direct-a" cx="640" cy="265" r="3" class="scene1-direct-point" style="opacity: 0;"/>
            <circle id="scene1-direct-c" cx="160" cy="235" r="3" class="scene1-direct-point" style="opacity: 0;"/>
            <circle id="scene1-direct-equator-b" cx="400" cy="120" r="3" class="scene1-direct-point" style="opacity: 0;"/>
            <circle id="scene1-direct-equator-d" cx="400" cy="380" r="3" class="scene1-direct-point" style="opacity: 0;"/>
            
            <!-- 南北半球季节对比信息 - 移到更下方，避免与轨道重叠 -->
            <text id="scene1-info-a" x="640" y="360" text-anchor="middle" class="scene1-info-text" style="opacity: 0;">北半球冬季</text>
            <text id="scene1-info-a-south" x="640" y="380" text-anchor="middle" class="scene1-info-text" style="opacity: 0;">南半球夏季</text>
            <text id="scene1-info-c" x="160" y="360" text-anchor="middle" class="scene1-info-text" style="opacity: 0;">北半球夏季</text>
            <text id="scene1-info-c-south" x="160" y="380" text-anchor="middle" class="scene1-info-text" style="opacity: 0;">南半球冬季</text>
            
            <!-- 步骤说明文字 - 移到控件栏上方 -->
            <text id="scene1-step-info" x="400" y="475" text-anchor="middle" class="scene1-info-text" style="font-size: 14px;">地球公转轨道与二分二至点</text>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-prev-btn">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/6</span>
            <button id="scene1-next-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现
        // 布局坐标表对照：
        // 太阳：(400,250) 直径 40
        // 地球 a：(640,250) 冬至
        // 地球 b：(400,120) 春分
        // 地球 c：(160,250) 夏至
        // 地球 d：(400,380) 秋分
        // 轨道椭圆：中心 (400,250)，长轴 480×短轴 260
        
        const TOTAL_STEPS = 6;
        let currentStep = 0;
        
        // 工具函数
        function showSVG(el) {
            if (el) {
                el.style.opacity = '1';
            }
        }
        
        function hideSVG(el) {
            if (el) {
                el.style.opacity = '0';
            }
        }
        
        // 更新步骤显示
        function updateScene() {
            // 重置所有高亮
            hideSVG(document.getElementById('scene1-highlight-a'));
            hideSVG(document.getElementById('scene1-highlight-b'));
            hideSVG(document.getElementById('scene1-highlight-c'));
            hideSVG(document.getElementById('scene1-highlight-d'));
            
            // 重置所有光线
            hideSVG(document.getElementById('scene1-ray-a'));
            hideSVG(document.getElementById('scene1-ray-b'));
            hideSVG(document.getElementById('scene1-ray-c'));
            hideSVG(document.getElementById('scene1-ray-d'));
            
            // 重置所有直射点
            hideSVG(document.getElementById('scene1-direct-a'));
            hideSVG(document.getElementById('scene1-direct-c'));
            hideSVG(document.getElementById('scene1-direct-equator-b'));
            hideSVG(document.getElementById('scene1-direct-equator-d'));
            
            // 重置所有纬线标注
            hideSVG(document.getElementById('scene1-lat-north-回归'));
            hideSVG(document.getElementById('scene1-lat-arctic'));
            hideSVG(document.getElementById('scene1-lat-equator'));
            hideSVG(document.getElementById('scene1-lat-south-回归'));
            hideSVG(document.getElementById('scene1-lat-antarctic'));
            
            // 重置所有季节对比信息
            hideSVG(document.getElementById('scene1-info-a'));
            hideSVG(document.getElementById('scene1-info-a-south'));
            hideSVG(document.getElementById('scene1-info-c'));
            hideSVG(document.getElementById('scene1-info-c-south'));
            
            // 根据步骤显示对应内容
            switch(currentStep) {
                case 0: // 整体概览
                    document.getElementById('scene1-step-info').textContent = '地球公转轨道与二分二至点';
                    break;
                    
                case 1: // 冬至 - a 位置
                    showSVG(document.getElementById('scene1-highlight-a'));
                    showSVG(document.getElementById('scene1-ray-a'));
                    showSVG(document.getElementById('scene1-direct-a'));
                    showSVG(document.getElementById('scene1-lat-south-回归'));
                    showSVG(document.getElementById('scene1-lat-antarctic'));
                    document.getElementById('scene1-step-info').textContent = '冬至：太阳直射南回归线，北半球昼短夜长';
                    break;
                    
                case 2: // 春分 - b 位置
                    showSVG(document.getElementById('scene1-highlight-b'));
                    showSVG(document.getElementById('scene1-ray-b'));
                    showSVG(document.getElementById('scene1-direct-equator-b'));
                    showSVG(document.getElementById('scene1-lat-equator'));
                    showSVG(document.getElementById('scene1-lat-arctic'));
                    document.getElementById('scene1-step-info').textContent = '春分：太阳直射赤道，全球昼夜平分';
                    break;
                    
                case 3: // 夏至 - c 位置
                    showSVG(document.getElementById('scene1-highlight-c'));
                    showSVG(document.getElementById('scene1-ray-c'));
                    showSVG(document.getElementById('scene1-direct-c'));
                    showSVG(document.getElementById('scene1-lat-north-回归'));
                    showSVG(document.getElementById('scene1-lat-arctic'));
                    document.getElementById('scene1-step-info').textContent = '夏至：太阳直射北回归线，北半球昼长夜短';
                    break;
                    
                case 4: // 秋分 - d 位置
                    showSVG(document.getElementById('scene1-highlight-d'));
                    showSVG(document.getElementById('scene1-ray-d'));
                    showSVG(document.getElementById('scene1-direct-equator-d'));
                    showSVG(document.getElementById('scene1-lat-equator'));
                    showSVG(document.getElementById('scene1-lat-antarctic'));
                    document.getElementById('scene1-step-info').textContent = '秋分：太阳直射赤道，全球昼夜平分';
                    break;
                    
                case 5: // 南北半球季节对比
                    showSVG(document.getElementById('scene1-info-a'));
                    showSVG(document.getElementById('scene1-info-a-south'));
                    showSVG(document.getElementById('scene1-info-c'));
                    showSVG(document.getElementById('scene1-info-c-south'));
                    document.getElementById('scene1-step-info').textContent = '南北半球季节相反：当北半球为冬季时，南半球为夏季';
                    break;
            }
            
            // 更新步骤指示器
            document.getElementById('scene1-step-indicator').textContent = '步骤 ' + (currentStep + 1) + '/' + TOTAL_STEPS;
            
            // 更新按钮状态
            document.getElementById('scene1-prev-btn').disabled = (currentStep === 0);
            document.getElementById('scene1-next-btn').disabled = (currentStep === TOTAL_STEPS - 1);
        }
        
        // 事件绑定
        document.getElementById('scene1-prev-btn').addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });
        
        document.getElementById('scene1-next-btn').addEventListener('click', function() {
            if (currentStep < TOTAL_STEPS - 1) {
                currentStep++;
                updateScene();
            }
        });
        
        // 初始化
        updateScene();
    })();
    </script>
</body>
</html>
