<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地球光照图判读——冬至日昼夜分布</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene1-controls button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #333; border-radius: 4px; background: #f5f5f5; }
        #scene1-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene1-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene1-label { font-size: 13px; fill: #000; }
        .scene1-point { fill: #0066cc; }
        .scene1-ray { stroke: #000; stroke-width: 2; fill: none; marker-end: url(#scene1-arrowhead); }
        .scene1-axis { stroke: #666; stroke-width: 1; stroke-dasharray: 5,5; }
        .scene1-latitude { stroke: #666; stroke-width: 1; fill: none; }
        .scene1-latitude-highlight { stroke: #cc0000; stroke-width: 2; }
        .scene1-terminator { stroke: #000; stroke-width: 2; fill: none; }
        .scene1-night { fill: url(#scene1-hatch); opacity: 0.3; }
        .scene1-polar-day { fill: #90ee90; opacity: 0.3; }
        .scene1-polar-night { fill: #8b0000; opacity: 0.2; }
        .scene1-sun-point { fill: #cc0000; }
        .scene1-time-label { font-size: 11px; fill: #ff6600; font-weight: bold; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <defs>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#000" />
                </marker>
                <pattern id="scene1-hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
                    <line x1="0" y1="0" x2="0" y2="8" stroke="#000" stroke-width="1" opacity="0.3"/>
                </pattern>
            </defs>

            <!-- 太阳光线 -->
            <line id="scene1-ray1" class="scene1-ray" x1="20" y1="150" x2="120" y2="150" style="opacity:1"/>
            <line id="scene1-ray2" class="scene1-ray" x1="20" y1="200" x2="120" y2="200" style="opacity:1"/>
            <line id="scene1-ray3" class="scene1-ray" x1="20" y1="250" x2="120" y2="250" style="opacity:1"/>
            <line id="scene1-ray4" class="scene1-ray" x1="20" y1="300" x2="120" y2="300" style="opacity:1"/>
            <line id="scene1-ray5" class="scene1-ray" x1="20" y1="350" x2="120" y2="350" style="opacity:1"/>
            <text id="scene1-ray-label" class="scene1-label" x="30" y="230" style="opacity:1">太阳光线</text>

            <!-- 地球轮廓 -->
            <circle id="scene1-earth" cx="400" cy="250" r="200" fill="#fff" stroke="#000" stroke-width="2" style="opacity:1"/>

            <!-- 昼半球（无填充，初始隐藏） -->
            <path id="scene1-day-hemisphere" d="M400,50 A200,200 0 0,0 400,450 L400,50" fill="none" style="opacity:0"/>

            <!-- 夜半球（斜线阴影，初始隐藏） -->
            <path id="scene1-night-hemisphere" class="scene1-night" d="M400,50 A200,200 0 0,1 400,450 L400,50" style="opacity:0"/>

            <!-- 晨昏线（初始隐藏） -->
            <line id="scene1-terminator" class="scene1-terminator" x1="400" y1="50" x2="400" y2="450" style="opacity:0"/>

            <!-- 地轴 -->
            <line id="scene1-axis" class="scene1-axis" x1="460" y1="130" x2="340" y2="370" style="opacity:1"/>

            <!-- 北极点 N -->
            <circle id="scene1-point-N" class="scene1-point" cx="460" cy="130" r="4" style="opacity:1"/>
            <text id="scene1-label-N" class="scene1-label" x="485" y="112" style="opacity:1">N</text>

            <!-- 南极点 S -->
            <circle id="scene1-point-S" class="scene1-point" cx="340" cy="370" r="4" style="opacity:1"/>
            <text id="scene1-label-S" class="scene1-label" x="310" y="405" style="opacity:1">S</text>

            <!-- A 点 -->
            <circle id="scene1-point-A" class="scene1-point" cx="320" cy="200" r="5" style="opacity:1"/>
            <text id="scene1-label-A" class="scene1-label" x="290" y="180" style="opacity:1">A</text>

            <!-- B 点 -->
            <circle id="scene1-point-B" class="scene1-point" cx="280" cy="155" r="5" style="opacity:1"/>
            <text id="scene1-label-B" class="scene1-label" x="250" y="135" style="opacity:1">B</text>

            <!-- C 点 -->
            <circle id="scene1-point-C" class="scene1-point" cx="600" cy="250" r="5" style="opacity:1"/>
            <text id="scene1-label-C" class="scene1-label" x="620" y="245" style="opacity:1">C</text>

            <!-- 纬线（初始隐藏） -->
            <path id="scene1-latitude-equator" class="scene1-latitude" d="M200,250 A200,200 0 0,1 600,250" style="opacity:0"/>
            <path id="scene1-latitude-tropic-n" class="scene1-latitude" d="M220,200 A180,180 0 0,1 580,200" style="opacity:0"/>
            <path id="scene1-latitude-tropic-s" class="scene1-latitude" d="M220,300 A180,180 0 0,1 580,300" style="opacity:0"/>
            <path id="scene1-latitude-arctic" class="scene1-latitude" d="M250,160 A150,150 0 0,1 550,160" style="opacity:0"/>
            <path id="scene1-latitude-antarctic" class="scene1-latitude" d="M250,340 A150,150 0 0,1 550,340" style="opacity:0"/>

            <!-- 纬线标签（初始隐藏，移到更右侧） -->
            <text id="scene1-label-equator" class="scene1-label" x="630" y="255" style="opacity:0">赤道</text>
            <text id="scene1-label-tropic-n" class="scene1-label" x="630" y="200" style="opacity:0">北回归线</text>
            <text id="scene1-label-tropic-s" class="scene1-label" x="630" y="305" style="opacity:0">南回归线</text>
            <text id="scene1-label-arctic" class="scene1-label" x="630" y="160" style="opacity:0">北极圈</text>
            <text id="scene1-label-antarctic" class="scene1-label" x="630" y="345" style="opacity:0">南极圈</text>

            <!-- 太阳直射点（初始隐藏） -->
            <circle id="scene1-sun-point" class="scene1-sun-point" cx="200" cy="300" r="6" style="opacity:0"/>

            <!-- 半球标签（初始隐藏，移到地球下方外部） -->
            <text id="scene1-label-day" class="scene1-label" x="180" y="470" style="opacity:0">昼半球</text>
            <text id="scene1-label-night" class="scene1-label" x="550" y="470" style="opacity:0">夜半球</text>

            <!-- 极昼极夜区域（初始隐藏） -->
            <path id="scene1-polar-night-arctic" class="scene1-polar-night" d="M400,160 A150,150 0 0,0 400,100 A150,150 0 0,1 400,160" style="opacity:0"/>
            <path id="scene1-polar-day-antarctic" class="scene1-polar-day" d="M400,340 A150,150 0 0,1 400,400 A150,150 0 0,0 400,340" style="opacity:0"/>

            <!-- B、C 地方时标签（初始隐藏，移到远离点的位置） -->
            <text id="scene1-time-B" class="scene1-time-label" x="130" y="130" style="opacity:0">地方时≈6:00</text>
            <text id="scene1-time-C" class="scene1-time-label" x="630" y="285" style="opacity:0">地方时≈0:00</text>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1: 地球光照图判读——冬至日昼夜分布与地方时判断
        // 布局坐标表（参考）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // | 地球轮廓 | 圆形 | (400,250) | 直径 400px | - | 圆心 (400,250) |
        // | 太阳光线 1-5 | 箭头 | (20,y)-(120,y), y=150/200/250/300/350 | 100×2 | - | 5 条平行光线 |
        // | 地轴 | 虚线 | (460,130)-(340,370) | - | - | 倾斜虚线 |
        // | N 点 | 点 | (460,130) | 4px | 右上方 | 北极点 |
        // | S 点 | 点 | (340,370) | 4px | 左下方 | 南极点 |
        // | A 点 | 圆点 | (320,200) | 5px | 左上方 | 北半球中纬度 |
        // | B 点 | 圆点 | (280,155) | 5px | 左上方 | 北极圈附近 |
        // | C 点 | 圆点 | (600,250) | 5px | 右方 | 夜半球中央 |
        // | 晨昏线 | 弧线 | (400,50)-(400,450) | - | - | 垂直分界线 |
        // | 太阳直射点 | 圆点 | (200,300) | 6px | 左下方 | 南回归线上 |

        const TOTAL_STEPS = 5;
        let currentStep = 0;

        // 元素 ID 映射表
        const elements = {
            // 步骤 1: 晨昏线与昼夜半球
            terminator: ['scene1-terminator', 'scene1-night-hemisphere', 'scene1-day-hemisphere', 'scene1-label-day', 'scene1-label-night'],
            // 步骤 2: 纬线与太阳直射点
            latitudes: ['scene1-latitude-equator', 'scene1-latitude-tropic-n', 'scene1-latitude-tropic-s', 'scene1-latitude-arctic', 'scene1-latitude-antarctic'],
            latitudeLabels: ['scene1-label-equator', 'scene1-label-tropic-n', 'scene1-label-tropic-s', 'scene1-label-arctic', 'scene1-label-antarctic'],
            sunPoint: ['scene1-sun-point'],
            // 步骤 3: 极昼极夜区域
            polarRegions: ['scene1-polar-night-arctic', 'scene1-polar-day-antarctic'],
            // 步骤 4: B、C 地方时
            timeLabels: ['scene1-time-B', 'scene1-time-C']
        };

        // 工具函数：显示元素
        function show(elementId) {
            const el = document.getElementById(elementId);
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }

        // 工具函数：隐藏元素
        function hide(elementId) {
            const el = document.getElementById(elementId);
            if (el) {
                el.style.opacity = '0';
                setTimeout(() => {
                    if (el.style.opacity === '0') {
                        el.style.display = 'none';
                    }
                }, 200);
            }
        }

        // 渲染当前步骤
        function renderStep() {
            // 重置所有动态元素
            elements.terminator.forEach(id => hide(id));
            elements.latitudes.forEach(id => hide(id));
            elements.latitudeLabels.forEach(id => hide(id));
            elements.sunPoint.forEach(id => hide(id));
            elements.polarRegions.forEach(id => hide(id));
            elements.timeLabels.forEach(id => hide(id));

            // 根据步骤显示对应元素
            if (currentStep >= 1) {
                elements.terminator.forEach(id => show(id));
            }
            if (currentStep >= 2) {
                elements.latitudes.forEach(id => show(id));
                elements.latitudeLabels.forEach(id => show(id));
                elements.sunPoint.forEach(id => show(id));
                const tropicS = document.getElementById('scene1-latitude-tropic-s');
                if (tropicS) {
                    tropicS.classList.add('scene1-latitude-highlight');
                }
            }
            if (currentStep >= 3) {
                elements.polarRegions.forEach(id => show(id));
            }
            if (currentStep >= 4) {
                elements.timeLabels.forEach(id => show(id));
                document.getElementById('scene1-point-B').style.fill = '#ff6600';
                document.getElementById('scene1-point-C').style.fill = '#ff6600';
            }

            // 更新按钮状态
            const prevBtn = document.getElementById('scene1-btn-prev');
            const nextBtn = document.getElementById('scene1-btn-next');

            prevBtn.disabled = (currentStep === 0);
            if (currentStep === TOTAL_STEPS - 1) {
                nextBtn.textContent = '重置';
            } else {
                nextBtn.textContent = '下一步 ▶';
            }
        }

        // 下一步
        function nextStep() {
            if (currentStep < TOTAL_STEPS - 1) {
                currentStep++;
                renderStep();
            } else {
                currentStep = 0;
                document.getElementById('scene1-point-B').style.fill = '#0066cc';
                document.getElementById('scene1-point-C').style.fill = '#0066cc';
                renderStep();
            }
        }

        // 上一步
        function prevStep() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        }

        // 初始化
        function init() {
            elements.terminator.forEach(id => {
                const el = document.getElementById(id);
                if (el) { el.style.display = 'none'; el.style.opacity = '0'; }
            });
            elements.latitudes.forEach(id => {
                const el = document.getElementById(id);
                if (el) { el.style.display = 'none'; el.style.opacity = '0'; }
            });
            elements.latitudeLabels.forEach(id => {
                const el = document.getElementById(id);
                if (el) { el.style.display = 'none'; el.style.opacity = '0'; }
            });
            elements.sunPoint.forEach(id => {
                const el = document.getElementById(id);
                if (el) { el.style.display = 'none'; el.style.opacity = '0'; }
            });
            elements.polarRegions.forEach(id => {
                const el = document.getElementById(id);
                if (el) { el.style.display = 'none'; el.style.opacity = '0'; }
            });
            elements.timeLabels.forEach(id => {
                const el = document.getElementById(id);
                if (el) { el.style.display = 'none'; el.style.opacity = '0'; }
            });

            document.getElementById('scene1-btn-prev').addEventListener('click', prevStep);
            document.getElementById('scene1-btn-next').addEventListener('click', nextStep);
            renderStep();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>
</body>
</html>
