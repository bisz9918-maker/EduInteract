<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>晨昏线判读与极昼范围判断</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 16px; z-index: 10; }
        #scene1-controls button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #333; border-radius: 4px; background: #f5f5f5; }
        #scene1-controls button:hover { background: #e0e0e0; }
        #scene1-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 14px; color: #333; }
        .scene1-hidden { display: none !important; }
        .scene1-fade-in { animation: scene1-fadeIn 0.3s ease; }
        @keyframes scene1-fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- 经纬网外框 -->
            <rect x="80" y="60" width="640" height="320" fill="none" stroke="#000000" stroke-width="1"/>
            
            <!-- 纬线 -->
            <line x1="80" y1="80" x2="720" y2="80" stroke="#000000" stroke-width="1"/>
            <line x1="80" y1="160" x2="720" y2="160" stroke="#000000" stroke-width="1" stroke-dasharray="5,3"/>
            <line x1="80" y1="280" x2="720" y2="280" stroke="#000000" stroke-width="1" stroke-dasharray="5,3"/>
            
            <!-- 经线 -->
            <line x1="160" y1="60" x2="160" y2="380" stroke="#000000" stroke-width="1"/>
            <line x1="266.67" y1="60" x2="266.67" y2="380" stroke="#000000" stroke-width="1"/>
            <line x1="373.33" y1="60" x2="373.33" y2="380" stroke="#000000" stroke-width="1"/>
            <line x1="480" y1="60" x2="480" y2="380" stroke="#000000" stroke-width="1"/>
            <line x1="586.67" y1="60" x2="586.67" y2="380" stroke="#000000" stroke-width="1"/>
            <line x1="693.33" y1="60" x2="693.33" y2="380" stroke="#000000" stroke-width="1"/>
            
            <!-- 阴影区域（日期分界）- 经线 2 和 3 之间 -->
            <defs>
                <pattern id="scene1-hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
                    <line x1="0" y1="0" x2="0" y2="8" stroke="#9e9e9e" stroke-width="1"/>
                </pattern>
            </defs>
            <rect id="scene1-shadow-area" x="266.67" y="60" width="106.66" height="320" fill="url(#scene1-hatch)" opacity="0.3"/>
            
            <!-- AO 昏线（初始黑色） -->
            <line id="scene1-ao-line" x1="160" y1="160" x2="480" y2="280" stroke="#000000" stroke-width="2"/>
            
            <!-- BO 晨线（初始黑色） -->
            <line id="scene1-bo-line" x1="720" y1="80" x2="480" y2="280" stroke="#000000" stroke-width="2"/>
            
            <!-- A/B/O 点 -->
            <circle id="scene1-point-a" cx="160" cy="160" r="4" fill="#000000"/>
            <circle id="scene1-point-b" cx="720" cy="80" r="4" fill="#000000"/>
            <circle id="scene1-point-o" cx="480" cy="280" r="4" fill="#000000"/>
            
            <!-- 纬度标签 -->
            <text id="scene1-label-latitude-0" x="730" y="85" font-size="14" fill="#000000">0°</text>
            <text id="scene1-label-latitude-23.5" x="730" y="165" font-size="14" fill="#000000">23.5°S</text>
            <text id="scene1-label-latitude-70" x="730" y="285" font-size="14" fill="#000000">70°S</text>
            
            <!-- 点标签 - 调整位置避开阴影区域 -->
            <text id="scene1-label-point-a" x="120" y="150" font-size="14" fill="#000000">A</text>
            <text id="scene1-label-point-b" x="740" y="60" font-size="14" fill="#000000">B</text>
            <text id="scene1-label-point-o" x="500" y="295" font-size="14" fill="#000000">O</text>
            
            <!-- 步骤 1: AO 线标注（初始隐藏）- 移到 AO 线段上方空白处，避开线段 -->
            <text id="scene1-label-ao" x="180" y="155" font-size="14" fill="#c62828" class="scene1-hidden">昏线：昼→夜</text>
            
            <!-- 步骤 2: BO 线标注（初始隐藏）- 移到 BO 线段上方，避开线段 -->
            <text id="scene1-label-bo" x="600" y="115" font-size="14" fill="#1565c0" class="scene1-hidden">晨线：夜→昼</text>
            
            <!-- 步骤 3: O 点说明（初始隐藏）- 移到 O 点上方 -->
            <text id="scene1-label-o-info" x="500" y="205" font-size="14" fill="#c62828" class="scene1-hidden">晨昏线交点，地方时 0 时</text>
            
            <!-- 步骤 4: 极昼区域（初始隐藏） -->
            <rect id="scene1-polar-day-area" x="80" y="280" width="640" height="100" fill="#2e7d32" opacity="0" class="scene1-hidden"/>
            <text id="scene1-label-polar-day" x="400" y="365" font-size="14" fill="#2e7d32" class="scene1-hidden">极昼范围：70°S 以南</text>
            
            <!-- 步骤 4: 太阳光线（初始隐藏） -->
            <g id="scene1-sun-rays" class="scene1-hidden">
                <line x1="740" y1="340" x2="680" y2="280" stroke="#ff9800" stroke-width="1.5"/>
                <polygon points="680,280 675,285 685,285" fill="#ff9800"/>
                <line x1="740" y1="360" x2="660" y2="280" stroke="#ff9800" stroke-width="1.5"/>
                <polygon points="660,280 655,285 665,285" fill="#ff9800"/>
                <line x1="740" y1="380" x2="640" y2="280" stroke="#ff9800" stroke-width="1.5"/>
                <polygon points="640,280 635,285 645,285" fill="#ff9800"/>
            </g>
            
            <!-- 步骤 5: 结论框（初始隐藏）- 移到右侧避开阴影区域 -->
            <rect id="scene1-conclusion-box-bg" x="380" y="395" width="320" height="35" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="5" class="scene1-hidden"/>
            <text id="scene1-conclusion-text" x="540" y="417" font-size="13" fill="#e65100" text-anchor="middle" class="scene1-hidden">太阳直射 20°S，北半球冬至日</text>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/6</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现 - 晨昏线判读与极昼范围判断
        // 布局坐标表对照：
        // 经纬网外框：(80,60)-(720,380) 640×320
        // 纬线 0°：(80,80)-(720,80)
        // 纬线 23.5°S：(80,160)-(720,160)
        // 纬线 70°S：(80,280)-(720,280)
        // 经线 1-6：x=160, 266.67, 373.33, 480, 586.67, 693.33
        // A 点：(160,160)
        // B 点：(720,80)
        // O 点：(480,280)
        // AO 线段：(160,160)-(480,280)
        // BO 线段：(720,80)-(480,280)
        // 阴影区域：x=266.67 到 x=373.33（避开所有文字标注）
        
        const scene1 = {
            currentStep: 0,
            totalSteps: 6,
            
            elements: {
                aoLine: document.getElementById('scene1-ao-line'),
                boLine: document.getElementById('scene1-bo-line'),
                oPoint: document.getElementById('scene1-point-o'),
                polarDayArea: document.getElementById('scene1-polar-day-area'),
                sunRays: document.getElementById('scene1-sun-rays'),
                labelAo: document.getElementById('scene1-label-ao'),
                labelBo: document.getElementById('scene1-label-bo'),
                labelOInfo: document.getElementById('scene1-label-o-info'),
                labelPolarDay: document.getElementById('scene1-label-polar-day'),
                conclusionBoxBg: document.getElementById('scene1-conclusion-box-bg'),
                conclusionText: document.getElementById('scene1-conclusion-text'),
                btnPrev: document.getElementById('scene1-btn-prev'),
                btnNext: document.getElementById('scene1-btn-next'),
                stepIndicator: document.getElementById('scene1-step-indicator')
            },
            
            init: function() {
                this.elements.btnPrev.addEventListener('click', () => this.prevStep());
                this.elements.btnNext.addEventListener('click', () => this.nextStep());
                this.updateScene();
            },
            
            prevStep: function() {
                if (this.currentStep > 0) {
                    this.currentStep--;
                    this.updateScene();
                }
            },
            
            nextStep: function() {
                if (this.currentStep < this.totalSteps - 1) {
                    this.currentStep++;
                    this.updateScene();
                }
            },
            
            updateScene: function() {
                const el = this.elements;
                
                // 更新按钮状态
                el.btnPrev.disabled = (this.currentStep === 0);
                el.btnNext.disabled = (this.currentStep === this.totalSteps - 1);
                el.btnNext.textContent = (this.currentStep === this.totalSteps - 1) ? '完成' : '下一步 ▶';
                
                // 更新步骤指示器
                el.stepIndicator.textContent = '步骤 ' + (this.currentStep + 1) + '/' + this.totalSteps;
                
                // AO 线高亮（步骤 1+）
                if (this.currentStep >= 1) {
                    el.aoLine.setAttribute('stroke', '#c62828');
                    el.aoLine.setAttribute('stroke-width', '3');
                    el.labelAo.classList.remove('scene1-hidden');
                    el.labelAo.classList.add('scene1-fade-in');
                } else {
                    el.aoLine.setAttribute('stroke', '#000000');
                    el.aoLine.setAttribute('stroke-width', '2');
                    el.labelAo.classList.add('scene1-hidden');
                }
                
                // BO 线高亮（步骤 2+）
                if (this.currentStep >= 2) {
                    el.boLine.setAttribute('stroke', '#1565c0');
                    el.boLine.setAttribute('stroke-width', '3');
                    el.labelBo.classList.remove('scene1-hidden');
                    el.labelBo.classList.add('scene1-fade-in');
                } else {
                    el.boLine.setAttribute('stroke', '#000000');
                    el.boLine.setAttribute('stroke-width', '2');
                    el.labelBo.classList.add('scene1-hidden');
                }
                
                // O 点高亮（步骤 3+）
                if (this.currentStep >= 3) {
                    el.oPoint.setAttribute('r', '6');
                    el.oPoint.setAttribute('fill', '#c62828');
                    el.labelOInfo.classList.remove('scene1-hidden');
                    el.labelOInfo.classList.add('scene1-fade-in');
                } else {
                    el.oPoint.setAttribute('r', '4');
                    el.oPoint.setAttribute('fill', '#000000');
                    el.labelOInfo.classList.add('scene1-hidden');
                }
                
                // 极昼区域和太阳光线（步骤 4+）
                if (this.currentStep >= 4) {
                    el.polarDayArea.classList.remove('scene1-hidden');
                    el.polarDayArea.setAttribute('opacity', '0.2');
                    el.polarDayArea.classList.add('scene1-fade-in');
                    el.labelPolarDay.classList.remove('scene1-hidden');
                    el.labelPolarDay.classList.add('scene1-fade-in');
                    el.sunRays.classList.remove('scene1-hidden');
                    el.sunRays.classList.add('scene1-fade-in');
                } else {
                    el.polarDayArea.classList.add('scene1-hidden');
                    el.polarDayArea.setAttribute('opacity', '0');
                    el.labelPolarDay.classList.add('scene1-hidden');
                    el.sunRays.classList.add('scene1-hidden');
                }
                
                // 结论框（步骤 5+）
                if (this.currentStep >= 5) {
                    el.conclusionBoxBg.classList.remove('scene1-hidden');
                    el.conclusionText.classList.remove('scene1-hidden');
                    el.conclusionBoxBg.classList.add('scene1-fade-in');
                    el.conclusionText.classList.add('scene1-fade-in');
                } else {
                    el.conclusionBoxBg.classList.add('scene1-hidden');
                    el.conclusionText.classList.add('scene1-hidden');
                }
            }
        };
        
        scene1.init();
    })();
    </script>
</body>
</html>
