<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 3 - 太阳直射点坐标与正午太阳高度计算</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Microsoft YaHei', sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene3-btn { padding: 8px 20px; font-size: 14px; cursor: pointer; border: 2px solid #1565c0; border-radius: 4px; background: #fff; color: #1565c0; }
        .scene3-btn:hover { background: #e3f2fd; }
        .scene3-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene3-info-box { fill: none; stroke: #1565c0; stroke-width: 1; }
        .scene3-text { font-size: 11px; fill: #000; }
        .scene3-label { font-size: 13px; fill: #000; }
        .scene3-highlight { fill: #1565c0; font-weight: bold; }
        .scene3-result { fill: #c62828; font-weight: bold; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg width="800" height="500" id="scene3-svg">
            <!-- 纬线 0°（赤道） -->
            <line x1="0" y1="50" x2="400" y2="50" stroke="#000" stroke-width="1" id="scene3-lat-0"/>
            <!-- 纬线 23.5°S -->
            <line x1="0" y1="150" x2="400" y2="150" stroke="#1565c0" stroke-width="2" id="scene3-lat-235"/>
            <!-- 纬线 70°S -->
            <line x1="0" y1="350" x2="400" y2="350" stroke="#000" stroke-width="1" id="scene3-lat-70"/>
            
            <!-- 经线 1-7（虚线） -->
            <line x1="50" y1="0" x2="50" y2="500" stroke="#000" stroke-width="1" stroke-dasharray="4,4" id="scene3-lon-1"/>
            <line x1="100" y1="0" x2="100" y2="500" stroke="#000" stroke-width="1" stroke-dasharray="4,4" id="scene3-lon-2"/>
            <line x1="150" y1="0" x2="150" y2="500" stroke="#000" stroke-width="1" stroke-dasharray="4,4" id="scene3-lon-3"/>
            <line x1="200" y1="0" x2="200" y2="500" stroke="#000" stroke-width="1" stroke-dasharray="4,4" id="scene3-lon-4"/>
            <line x1="250" y1="0" x2="250" y2="500" stroke="#000" stroke-width="1" stroke-dasharray="4,4" id="scene3-lon-5"/>
            <line x1="300" y1="0" x2="300" y2="500" stroke="#000" stroke-width="1" stroke-dasharray="4,4" id="scene3-lon-6"/>
            <line x1="350" y1="0" x2="350" y2="500" stroke="#000" stroke-width="1" stroke-dasharray="4,4" id="scene3-lon-7"/>
            
            <!-- 晨昏线 AO（昏线） -->
            <line x1="100" y1="150" x2="250" y2="350" stroke="#000" stroke-width="2" id="scene3-line-AO"/>
            <!-- 晨昏线 BO（晨线） -->
            <line x1="350" y1="0" x2="250" y2="350" stroke="#000" stroke-width="2" id="scene3-line-BO"/>
            
            <!-- A 点 -->
            <circle cx="100" cy="150" r="4" fill="#2e7d32" id="scene3-point-A"/>
            <!-- O 点 -->
            <circle cx="250" cy="350" r="4" fill="#2e7d32" id="scene3-point-O"/>
            
            <!-- 纬度标签 -->
            <text x="410" y="55" class="scene3-label">0°</text>
            <text x="410" y="155" class="scene3-label">23.5°S</text>
            <text x="410" y="355" class="scene3-label">70°S</text>
            
            <!-- A 点标签 -->
            <text x="85" y="145" class="scene3-label">A</text>
            <!-- O 点标签 -->
            <text x="255" y="365" class="scene3-label">O</text>
            
            <!-- 太阳直射点标记（步骤 1 显示） -->
            <circle cx="640" cy="100" r="6" fill="#ff9800" id="scene3-sun-point" style="opacity: 0;"/>
            <line x1="640" y1="90" x2="640" y2="110" stroke="#ff9800" stroke-width="1" id="scene3-sun-ray-h" style="opacity: 0;"/>
            <line x1="630" y1="100" x2="650" y2="100" stroke="#ff9800" stroke-width="1" id="scene3-sun-ray-v" style="opacity: 0;"/>
            
            <!-- 太阳直射点坐标框（只保留边框，无填充） -->
            <rect x="520" y="20" width="240" height="70" class="scene3-info-box" id="scene3-box-coord"/>
            <text x="530" y="38" class="scene3-text" id="scene3-text-coord-1" style="opacity: 0;">太阳直射点纬度 = 90° - 70° = 20°S</text>
            <text x="530" y="55" class="scene3-text" id="scene3-text-coord-2" style="opacity: 0;">0 时经线为 O 点所在经线</text>
            <text x="530" y="72" class="scene3-text" id="scene3-text-coord-3" style="opacity: 0;">若 O 点经度为 60°E，则直射点经度为 120°W</text>
            
            <!-- 公式框（只保留边框，无填充） -->
            <rect x="520" y="140" width="240" height="90" class="scene3-info-box" id="scene3-box-formula"/>
            <text x="530" y="158" class="scene3-text" id="scene3-text-formula" style="opacity: 0;">正午太阳高度公式：</text>
            <text x="530" y="175" class="scene3-text scene3-highlight" id="scene3-text-formula-h" style="opacity: 0;">H = 90° - |φ - δ|</text>
            <text x="530" y="192" class="scene3-text" id="scene3-text-formula-note" style="opacity: 0;">（φ为当地纬度，δ为太阳直射点纬度）</text>
            
            <!-- 计算过程框（只保留边框，无填充） -->
            <rect x="520" y="250" width="240" height="150" class="scene3-info-box" id="scene3-box-calc"/>
            <text x="530" y="268" class="scene3-text" id="scene3-text-calc-1" style="opacity: 0;">A 点夏至 H_max = 90° - |23.5°S - 23.5°S| = 90°</text>
            <text x="530" y="285" class="scene3-text" id="scene3-text-calc-2" style="opacity: 0;">A 点冬至 H_min = 90° - |23.5°S - 23.5°N| = 43°</text>
            <text x="530" y="310" class="scene3-text scene3-result" id="scene3-text-calc-result" style="opacity: 0;">H_max - H_min = 90° - 43° = 47°</text>
        </svg>
        
        <div id="scene3-controls">
            <button class="scene3-btn" id="scene3-prev-btn" disabled>◀ 上一步</button>
            <button class="scene3-btn" id="scene3-next-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 3 实现
        // 布局坐标表：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // |------|------|-----------|------|-------------|------|
        // | 纬线 0°（赤道） | 线段 | (0,50)-(400,50) | 400×1 | - | 黑色实线 |
        // | 纬线 23.5°S | 线段 | (0,150)-(400,150) | 400×2 | - | 蓝色#1565c0 高亮 |
        // | 纬线 70°S | 线段 | (0,350)-(400,350) | 400×1 | - | 黑色实线 |
        // | 经线 1-7 | 虚线 | x=50,100,150,200,250,300,350 | 1×500 | - | 黑色虚线 |
        // | 晨昏线 AO | 线段 | (100,150)-(250,350) | - | - | 黑色实线，昏线 |
        // | 晨昏线 BO | 线段 | (350,0)-(250,350) | - | - | 黑色实线，晨线 |
        // | A 点 | 圆点 | (100,150) | 8px 直径 | - | 绿色#2e7d32 |
        // | O 点 | 圆点 | (250,350) | 8px 直径 | - | 绿色#2e7d32 |
        // | 纬度标签 0° | text | (410,45) | 40×16 | 右侧 | 赤道标签 |
        // | 纬度标签 23.5°S | text | (410,145) | 60×16 | 右侧 | 南回归线 |
        // | 纬度标签 70°S | text | (410,345) | 40×16 | 右侧 | 南极圈附近 |
        // | A 点标签 | text | (85,135) | 20×16 | 左上方 | A 点点名 |
        // | O 点标签 | text | (255,365) | 20×16 | 右下方 | O 点点名 |
        // | 太阳直射点坐标框 | rect | (520,20)-(760,90) | 240×70 | - | 蓝色边框 |
        // | 公式框 | rect | (520,140)-(760,230) | 240×90 | - | 蓝色边框 |
        // | 计算过程框 | rect | (520,250)-(760,400) | 240×150 | - | 蓝色边框 |
        // | 太阳直射点标记 | 圆点 + 光芒 | (640,100) | 12px | - | 橙色#ff9800 |
        
        const TOTAL_STEPS = 7;
        let currentStep = 0;
        
        // 工具函数：显示/隐藏元素
        function show(el) {
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }
        
        function hide(el) {
            if (el) {
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }
        
        function showSvg(el) {
            if (el) {
                el.style.opacity = '1';
            }
        }
        
        function hideSvg(el) {
            if (el) {
                el.style.opacity = '0';
            }
        }
        
        // 更新显示状态
        function updateDisplay() {
            const prevBtn = document.getElementById('scene3-prev-btn');
            const nextBtn = document.getElementById('scene3-next-btn');
            
            // 按钮状态
            prevBtn.disabled = (currentStep === 0);
            nextBtn.disabled = (currentStep === TOTAL_STEPS);
            nextBtn.textContent = (currentStep === TOTAL_STEPS) ? '完成' : '下一步 ▶';
            
            // 步骤 0：初始状态 - 只显示基础框架
            if (currentStep === 0) {
                hideSvg(document.getElementById('scene3-sun-point'));
                hideSvg(document.getElementById('scene3-sun-ray-h'));
                hideSvg(document.getElementById('scene3-sun-ray-v'));
                hide(document.getElementById('scene3-text-coord-1'));
                hide(document.getElementById('scene3-text-coord-2'));
                hide(document.getElementById('scene3-text-coord-3'));
                hide(document.getElementById('scene3-text-formula'));
                hide(document.getElementById('scene3-text-formula-h'));
                hide(document.getElementById('scene3-text-formula-note'));
                hide(document.getElementById('scene3-text-calc-1'));
                hide(document.getElementById('scene3-text-calc-2'));
                hide(document.getElementById('scene3-text-calc-result'));
            }
            
            // 步骤 1：显示太阳直射点纬度
            if (currentStep >= 1) {
                showSvg(document.getElementById('scene3-sun-point'));
                showSvg(document.getElementById('scene3-sun-ray-h'));
                showSvg(document.getElementById('scene3-sun-ray-v'));
                show(document.getElementById('scene3-text-coord-1'));
            } else {
                hide(document.getElementById('scene3-text-coord-1'));
            }
            
            // 步骤 2：补充 0 时经线说明
            if (currentStep >= 2) {
                show(document.getElementById('scene3-text-coord-2'));
            } else {
                hide(document.getElementById('scene3-text-coord-2'));
            }
            
            // 步骤 3：补充直射点经度
            if (currentStep >= 3) {
                show(document.getElementById('scene3-text-coord-3'));
            } else {
                hide(document.getElementById('scene3-text-coord-3'));
            }
            
            // 步骤 4：显示正午太阳高度公式
            if (currentStep >= 4) {
                show(document.getElementById('scene3-text-formula'));
                show(document.getElementById('scene3-text-formula-h'));
                show(document.getElementById('scene3-text-formula-note'));
            } else {
                hide(document.getElementById('scene3-text-formula'));
                hide(document.getElementById('scene3-text-formula-h'));
                hide(document.getElementById('scene3-text-formula-note'));
            }
            
            // 步骤 5：显示夏至计算
            if (currentStep >= 5) {
                show(document.getElementById('scene3-text-calc-1'));
            } else {
                hide(document.getElementById('scene3-text-calc-1'));
            }
            
            // 步骤 6：显示冬至计算
            if (currentStep >= 6) {
                show(document.getElementById('scene3-text-calc-2'));
            } else {
                hide(document.getElementById('scene3-text-calc-2'));
            }
            
            // 步骤 7：显示最终结果
            if (currentStep >= 7) {
                show(document.getElementById('scene3-text-calc-result'));
            } else {
                hide(document.getElementById('scene3-text-calc-result'));
            }
        }
        
        // 下一步
        function nextStep() {
            if (currentStep < TOTAL_STEPS) {
                currentStep++;
                updateDisplay();
            }
        }
        
        // 上一步
        function prevStep() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        }
        
        // 初始化
        document.getElementById('scene3-next-btn').addEventListener('click', nextStep);
        document.getElementById('scene3-prev-btn').addEventListener('click', prevStep);
        
        // 初始显示
        updateDisplay();
    })();
    </script>
</body>
</html>
