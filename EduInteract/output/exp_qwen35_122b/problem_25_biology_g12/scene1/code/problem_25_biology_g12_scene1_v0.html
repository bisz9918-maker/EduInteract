<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>果蝇刚毛性状测交实验遗传图解</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; gap: 16px; z-index: 10; }
        #scene1-controls button {
            padding: 10px 20px;
            font-size: 14px;
            border: 2px solid #1976d2;
            border-radius: 6px;
            background: #ffffff;
            color: #1976d2;
            cursor: pointer;
            transition: all 0.2s;
        }
        #scene1-controls button:hover:not(:disabled) {
            background: #1976d2;
            color: #ffffff;
        }
        #scene1-controls button:disabled {
            border-color: #bdbdbd;
            color: #bdbdbd;
            cursor: not-allowed;
        }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .slide-in { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#888888"/>
                </marker>
                <marker id="arrowhead-highlight" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#ff9800"/>
                </marker>
            </defs>

            <!-- 亲本层标题 -->
            <text id="scene1-parents-title" x="350" y="40" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">亲本层</text>

            <!-- F1 直刚毛雌果蝇矩形框 -->
            <g id="scene1-female-parent">
                <rect x="150" y="65" width="100" height="50" fill="#f5f5f5" stroke="#000000" stroke-width="2" class="fade-in"/>
                <text id="scene1-female-label" x="130" y="60" text-anchor="end" font-size="12" fill="#000000">F₁直刚毛雌果蝇</text>
                <text id="scene1-xa-gene" x="170" y="83" font-size="14" font-weight="bold" fill="#1565c0">X<tspan baseline-shift="super" font-size="10">A</tspan></text>
                <text id="scene1-xa-gene2" x="170" y="103" font-size="14" font-weight="bold" fill="#c62828">X<tspan baseline-shift="super" font-size="10">a</tspan></text>
            </g>

            <!-- 乘号 -->
            <text id="scene1-multiply" x="300" y="95" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000">×</text>

            <!-- F2 卷刚毛雄果蝇矩形框 -->
            <g id="scene1-male-parent">
                <rect x="350" y="65" width="100" height="50" fill="#f5f5f5" stroke="#000000" stroke-width="2" class="fade-in"/>
                <text id="scene1-male-label" x="330" y="60" text-anchor="end" font-size="12" fill="#000000">F₂卷刚毛雄果蝇</text>
                <text id="scene1-xa-gene3" x="370" y="83" font-size="14" font-weight="bold" fill="#c62828">X<tspan baseline-shift="super" font-size="10">a</tspan></text>
                <text id="scene1-y-gene" x="370" y="103" font-size="14" font-weight="bold" fill="#000000">Y</text>
            </g>

            <!-- 配子层标题 -->
            <text id="scene1-gametes-title" x="360" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000" style="display:none;">配子层</text>

            <!-- 雌配子标签 -->
            <text id="scene1-female-gamete-label" x="100" y="200" text-anchor="end" font-size="12" fill="#000000" style="display:none;">雌配子</text>

            <!-- X^A 配子圆 -->
            <g id="scene1-gamete-xa-female" style="display:none;">
                <circle cx="180" cy="195" r="25" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" class="fade-in"/>
                <text x="180" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565c0">X<tspan baseline-shift="super" font-size="10">A</tspan></text>
            </g>

            <!-- X^a 配子圆 (雌) -->
            <g id="scene1-gamete-xa-female2" style="display:none;">
                <circle cx="260" cy="195" r="25" fill="#ffebee" stroke="#c62828" stroke-width="2" class="fade-in"/>
                <text x="260" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#c62828">X<tspan baseline-shift="super" font-size="10">a</tspan></text>
            </g>

            <!-- 雄配子标签 -->
            <text id="scene1-male-gamete-label" x="420" y="200" text-anchor="end" font-size="12" fill="#000000" style="display:none;">雄配子</text>

            <!-- X^a 配子圆 (雄) -->
            <g id="scene1-gamete-xa-male" style="display:none;">
                <circle cx="500" cy="195" r="25" fill="#ffebee" stroke="#c62828" stroke-width="2" class="fade-in"/>
                <text x="500" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#c62828">X<tspan baseline-shift="super" font-size="10">a</tspan></text>
            </g>

            <!-- Y 配子圆 -->
            <g id="scene1-gamete-y" style="display:none;">
                <circle cx="580" cy="195" r="25" fill="#f5f5f5" stroke="#000000" stroke-width="2" class="fade-in"/>
                <text x="580" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">Y</text>
            </g>

            <!-- 受精箭头层标题 -->
            <text id="scene1-arrows-title" x="360" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000" style="display:none;">受精组合</text>

            <!-- 受精箭头 (8 条虚线) -->
            <g id="scene1-arrows-group" style="display:none;">
                <line x1="180" y1="220" x2="180" y2="295" stroke="#888888" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowhead)" class="fade-in"/>
                <line x1="180" y1="220" x2="340" y2="295" stroke="#888888" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowhead)" class="fade-in"/>
                <line x1="260" y1="220" x2="260" y2="295" stroke="#888888" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowhead)" class="fade-in"/>
                <line x1="260" y1="220" x2="420" y2="295" stroke="#888888" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowhead)" class="fade-in"/>
                <line x1="500" y1="220" x2="180" y2="295" stroke="#888888" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowhead)" class="fade-in"/>
                <line x1="500" y1="220" x2="340" y2="295" stroke="#888888" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowhead)" class="fade-in"/>
                <line x1="580" y1="220" x2="260" y2="295" stroke="#888888" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowhead)" class="fade-in"/>
                <line x1="580" y1="220" x2="420" y2="295" stroke="#888888" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowhead)" class="fade-in"/>
            </g>

            <!-- 后代层标题 -->
            <text id="scene1-offspring-title" x="360" y="285" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000" style="display:none;">后代层</text>

            <!-- 后代 1: X^A X^a 直刚毛雌果蝇 -->
            <g id="scene1-offspring-1" style="display:none;">
                <text x="140" y="320" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565c0">X<tspan baseline-shift="super" font-size="10">A</tspan>X<tspan baseline-shift="super" font-size="10">a</tspan></text>
                <text x="140" y="345" text-anchor="middle" font-size="12" fill="#2e7d32">直刚毛雌果蝇</text>
            </g>

            <!-- 后代 2: X^A Y 直刚毛雄果蝇 -->
            <g id="scene1-offspring-2" style="display:none;">
                <text x="300" y="320" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565c0">X<tspan baseline-shift="super" font-size="10">A</tspan>Y</text>
                <text x="300" y="345" text-anchor="middle" font-size="12" fill="#2e7d32">直刚毛雄果蝇</text>
            </g>

            <!-- 后代 3: X^a X^a 卷刚毛雌果蝇 -->
            <g id="scene1-offspring-3" style="display:none;">
                <text x="380" y="320" text-anchor="middle" font-size="13" font-weight="bold" fill="#c62828">X<tspan baseline-shift="super" font-size="10">a</tspan>X<tspan baseline-shift="super" font-size="10">a</tspan></text>
                <text x="380" y="345" text-anchor="middle" font-size="12" fill="#000000">卷刚毛雌果蝇</text>
            </g>

            <!-- 后代 4: X^a Y 卷刚毛雄果蝇 -->
            <g id="scene1-offspring-4" style="display:none;">
                <text x="460" y="320" text-anchor="middle" font-size="13" font-weight="bold" fill="#c62828">X<tspan baseline-shift="super" font-size="10">a</tspan>Y</text>
                <text x="460" y="345" text-anchor="middle" font-size="12" fill="#000000">卷刚毛雄果蝇</text>
            </g>

            <!-- 比例标注 -->
            <text id="scene1-ratio" x="320" y="380" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000" style="display:none;">1 : 1 : 1 : 1</text>
        </svg>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-prev-btn" disabled>◀ 上一步</button>
            <button id="scene1-next-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1: 果蝇刚毛性状测交实验遗传图解
        // 布局坐标表对照：
        // | 元素 | 位置/范围 | 备注 |
        // |------|-----------|------|
        // | 亲本层标题 | (350, 40) | 居中标题，顶部留白充足 |
        // | F1 直刚毛雌果蝇 | (150,65)-(250,115) | 左侧亲本 |
        // | F2 卷刚毛雄果蝇 | (350,65)-(450,115) | 右侧亲本 |
        // | 配子层标题 | (360, 150) | 居中标题 |
        // | X^A配子圆 | (180,195), r=25 | 蓝色边框 |
        // | X^a配子圆 (雌) | (260,195), r=25 | 红色边框 |
        // | X^a配子圆 (雄) | (500,195), r=25 | 红色边框 |
        // | Y配子圆 | (580,195), r=25 | 黑色边框 |
        // | 受精箭头 | 从配子圆底部 (y=220) 指向后代 (y=295) | 虚线 |
        // | 后代层标题 | (360, 285) | 居中标题 |
        // | 后代 1 | (140, 320) | X^A X^a 蓝色 |
        // | 后代 2 | (300, 320) | X^A Y 蓝色 |
        // | 后代 3 | (380, 320) | X^a X^a 红色 |
        // | 后代 4 | (460, 320) | X^a Y 红色 |
        // | 比例标签 | (320, 380) | 1 : 1 : 1 : 1 |

        // 状态机：currentStep (0-3)
        let currentStep = 0;
        const totalSteps = 4;

        // 获取 DOM 元素
        const prevBtn = document.getElementById('scene1-prev-btn');
        const nextBtn = document.getElementById('scene1-next-btn');

        // 各层元素组
        const parentsGroup = document.getElementById('scene1-female-parent');
        const maleParent = document.getElementById('scene1-male-parent');
        const multiply = document.getElementById('scene1-multiply');
        const parentsTitle = document.getElementById('scene1-parents-title');

        const gametesTitle = document.getElementById('scene1-gametes-title');
        const femaleGameteLabel = document.getElementById('scene1-female-gamete-label');
        const maleGameteLabel = document.getElementById('scene1-male-gamete-label');
        const gameteXaFemale = document.getElementById('scene1-gamete-xa-female');
        const gameteXaFemale2 = document.getElementById('scene1-gamete-xa-female2');
        const gameteXaMale = document.getElementById('scene1-gamete-xa-male');
        const gameteY = document.getElementById('scene1-gamete-y');

        const arrowsTitle = document.getElementById('scene1-arrows-title');
        const arrowsGroup = document.getElementById('scene1-arrows-group');

        const offspringTitle = document.getElementById('scene1-offspring-title');
        const offspring1 = document.getElementById('scene1-offspring-1');
        const offspring2 = document.getElementById('scene1-offspring-2');
        const offspring3 = document.getElementById('scene1-offspring-3');
        const offspring4 = document.getElementById('scene1-offspring-4');
        const ratio = document.getElementById('scene1-ratio');

        // 显示/隐藏工具函数
        function show(el) {
            el.style.display = 'block';
            el.style.opacity = '1';
        }

        function hide(el) {
            el.style.display = 'none';
            el.style.opacity = '0';
        }

        // 更新场景显示
        function updateScene() {
            // 步骤 0: 亲本展示
            if (currentStep >= 0) {
                show(parentsTitle);
                show(parentsGroup);
                show(maleParent);
                show(multiply);
            }

            // 步骤 1: 配子形成
            if (currentStep >= 1) {
                show(gametesTitle);
                show(femaleGameteLabel);
                show(maleGameteLabel);
                show(gameteXaFemale);
                show(gameteXaFemale2);
                show(gameteXaMale);
                show(gameteY);
            }

            // 步骤 2: 受精组合
            if (currentStep >= 2) {
                show(arrowsTitle);
                show(arrowsGroup);
            }

            // 步骤 3: 后代结果
            if (currentStep >= 3) {
                show(offspringTitle);
                show(offspring1);
                show(offspring2);
                show(offspring3);
                show(offspring4);
                show(ratio);
            }

            // 更新按钮状态
            prevBtn.disabled = (currentStep === 0);
            if (currentStep === totalSteps - 1) {
                nextBtn.textContent = '完成';
                nextBtn.disabled = true;
            } else {
                nextBtn.textContent = '下一步 ▶';
                nextBtn.disabled = false;
            }
        }

        // 事件绑定
        prevBtn.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        nextBtn.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateScene();
            }
        });

        // 初始化场景
        updateScene();
    })();
    </script>
</body>
</html>
