<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>化学反应关系网络图 - Scene 1</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene1-btn { padding: 8px 20px; font-size: 14px; border: none; border-radius: 4px; cursor: pointer; }
        .scene1-btn-prev { background: #9e9e9e; color: white; }
        .scene1-btn-prev:hover { background: #757575; }
        .scene1-btn-prev:disabled { background: #bdbdbd; cursor: not-allowed; }
        .scene1-btn-next { background: #1976d2; color: white; }
        .scene1-btn-next:hover { background: #1565c0; }
        .scene1-btn-next:disabled { background: #64b5f6; cursor: not-allowed; }
        #scene1-step-indicator { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); font-size: 14px; color: #666; }
        .scene1-node { fill: #e3f2fd; stroke: #1565c0; stroke-width: 2; }
        .scene1-node-highlight { stroke: #2e7d32; stroke-width: 3; }
        .scene1-line { stroke: #000000; stroke-width: 2; fill: none; }
        .scene1-arrow-line { stroke: #c62828; stroke-width: 2; fill: none; }
        .scene1-label { font-size: 18px; fill: #000000; font-weight: bold; }
        .scene1-matter-label { font-size: 14px; fill: #000000; font-weight: bold; }
        .scene1-arrow-head { fill: #c62828; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500">
            <!-- 连接线层（在节点下方） -->
            <!-- 连接线 X-Y -->
            <line id="scene1-line-xy" class="scene1-line" x1="160" y1="120" x2="280" y2="120" style="opacity: 0; display: none;" />
            <!-- 连接线 Y-铁 -->
            <line id="scene1-line-yiron" class="scene1-line" x1="360" y1="120" x2="480" y2="120" style="opacity: 0; display: none;" />
            <!-- 连接线 X-M -->
            <line id="scene1-line-xm" class="scene1-line" x1="140" y1="150" x2="200" y2="250" style="opacity: 0; display: none;" />
            <!-- 连接线 Y-M -->
            <line id="scene1-line-ym" class="scene1-line" x1="300" y1="150" x2="240" y2="250" style="opacity: 0; display: none;" />
            <!-- 连接线 Y-N -->
            <line id="scene1-line-yn" class="scene1-line" x1="340" y1="150" x2="400" y2="250" style="opacity: 0; display: none;" />
            <!-- 连接线 N-铁（带箭头） -->
            <line id="scene1-line-niron" class="scene1-arrow-line" x1="440" y1="250" x2="500" y2="150" style="opacity: 0; display: none;" />
            <!-- 箭头头部 N→铁 -->
            <polygon id="scene1-arrow-niron" class="scene1-arrow-head" points="495,158 505,148 498,145" style="opacity: 0; display: none;" />

            <!-- 节点层 -->
            <!-- 节点 X -->
            <circle id="scene1-node-x" class="scene1-node" cx="120" cy="120" r="40" />
            <!-- 节点 Y -->
            <circle id="scene1-node-y" class="scene1-node" cx="320" cy="120" r="40" />
            <!-- 节点 铁 -->
            <circle id="scene1-node-iron" class="scene1-node" cx="520" cy="120" r="40" />
            <!-- 节点 M -->
            <circle id="scene1-node-m" class="scene1-node" cx="220" cy="280" r="40" />
            <!-- 节点 N -->
            <circle id="scene1-node-n" class="scene1-node" cx="420" cy="280" r="40" />

            <!-- 标签层（标签在圆形外部） -->
            <!-- 节点字母标签 - 放在圆形外部上方 -->
            <text id="scene1-label-x" class="scene1-label" x="120" y="70" text-anchor="middle">X</text>
            <text id="scene1-label-y" class="scene1-label" x="320" y="70" text-anchor="middle">Y</text>
            <text id="scene1-label-iron" class="scene1-label" x="520" y="70" text-anchor="middle">铁</text>
            <text id="scene1-label-m" class="scene1-label" x="220" y="335" text-anchor="middle">M</text>
            <text id="scene1-label-n" class="scene1-label" x="420" y="335" text-anchor="middle">N</text>

            <!-- 物质名称标签（初始隐藏） -->
            <text id="scene1-label-hcl" class="scene1-matter-label" x="320" y="50" text-anchor="middle" style="opacity: 0; display: none;">稀盐酸</text>
            <text id="scene1-label-oxide" class="scene1-matter-label" x="420" y="355" text-anchor="middle" style="opacity: 0; display: none;">氧化铁</text>
            <text id="scene1-label-caoh" class="scene1-matter-label" x="220" y="355" text-anchor="middle" style="opacity: 0; display: none;">氢氧化钙</text>
            <text id="scene1-label-na2co3" class="scene1-matter-label" x="520" y="355" text-anchor="middle" style="opacity: 0; display: none;">碳酸钠</text>
        </svg>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next" class="scene1-btn scene1-btn-next">下一步 ▶</button>
        </div>
        <div id="scene1-step-indicator">步骤 1/8</div>
    </div>

    <script>
    (function() {
        // Scene 1: 化学反应关系网络图
        // 布局坐标表对照：
        // 节点 X: (120,120) r=40 | 节点 Y: (320,120) r=40 | 节点 铁: (520,120) r=40
        // 节点 M: (220,280) r=40 | 节点 N: (420,280) r=40
        // 连接线 X-Y: (160,120)-(280,120) | Y-铁: (360,120)-(480,120)
        // X-M: (140,150)-(200,250) | Y-M: (300,150)-(240,250) | Y-N: (340,150)-(400,250)
        // N-铁: (440,250)-(500,150) 带箭头

        const TOTAL_STEPS = 8;
        let currentStep = 0;

        // 工具函数：显示元素（同时处理 display 和 opacity）
        function show(el) {
            if (el) {
                el.style.display = '';
                el.style.opacity = '1';
            }
        }

        // 工具函数：隐藏元素
        function hide(el) {
            if (el) {
                el.style.opacity = '0';
                setTimeout(() => {
                    if (el) el.style.display = 'none';
                }, 300);
            }
        }

        // 工具函数：添加高亮类
        function addHighlight(nodeId) {
            const node = document.getElementById(nodeId);
            if (node) node.classList.add('scene1-node-highlight');
        }

        // 工具函数：移除高亮类
        function removeHighlight(nodeId) {
            const node = document.getElementById(nodeId);
            if (node) node.classList.remove('scene1-node-highlight');
        }

        // 渲染当前步骤
        function renderStep(step) {
            // 重置所有元素状态
            const lines = ['scene1-line-xy', 'scene1-line-yiron', 'scene1-line-xm', 'scene1-line-ym', 'scene1-line-yn', 'scene1-line-niron'];
            const arrows = ['scene1-arrow-niron'];
            const matterLabels = ['scene1-label-hcl', 'scene1-label-oxide', 'scene1-label-caoh', 'scene1-label-na2co3'];
            const nodes = ['scene1-node-x', 'scene1-node-y', 'scene1-node-iron', 'scene1-node-m', 'scene1-node-n'];

            // 先隐藏所有连接线、箭头、物质标签
            lines.forEach(id => hide(document.getElementById(id)));
            arrows.forEach(id => hide(document.getElementById(id)));
            matterLabels.forEach(id => hide(document.getElementById(id)));

            // 移除所有节点高亮
            nodes.forEach(id => removeHighlight(id));

            // 根据步骤设置显示状态
            switch(step) {
                case 0: // 初始状态：仅显示节点和字母标签
                    break;

                case 1: // 显示所有反应连接线（除箭头）
                    show(document.getElementById('scene1-line-xy'));
                    show(document.getElementById('scene1-line-yiron'));
                    show(document.getElementById('scene1-line-xm'));
                    show(document.getElementById('scene1-line-ym'));
                    show(document.getElementById('scene1-line-yn'));
                    break;

                case 2: // 显示"铁"的完整标签（已在初始显示）
                    break;

                case 3: // 高亮节点 Y，显示 Y 的所有连接线（已在步骤 1 显示）
                    addHighlight('scene1-node-y');
                    break;

                case 4: // 显示 Y=稀盐酸
                    addHighlight('scene1-node-y');
                    show(document.getElementById('scene1-label-hcl'));
                    break;

                case 5: // 取消 Y 高亮，高亮 N，显示 N→铁箭头
                    removeHighlight('scene1-node-y');
                    addHighlight('scene1-node-n');
                    show(document.getElementById('scene1-line-niron'));
                    show(document.getElementById('scene1-arrow-niron'));
                    break;

                case 6: // 显示 N=氧化铁
                    addHighlight('scene1-node-n');
                    show(document.getElementById('scene1-line-niron'));
                    show(document.getElementById('scene1-arrow-niron'));
                    show(document.getElementById('scene1-label-oxide'));
                    break;

                case 7: // 显示完整推断结果
                    removeHighlight('scene1-node-n');
                    show(document.getElementById('scene1-line-niron'));
                    show(document.getElementById('scene1-arrow-niron'));
                    show(document.getElementById('scene1-label-caoh'));
                    show(document.getElementById('scene1-label-na2co3'));
                    break;
            }

            // 更新步骤指示器
            document.getElementById('scene1-step-indicator').textContent = `步骤 ${step + 1}/${TOTAL_STEPS}`;

            // 更新按钮状态
            document.getElementById('scene1-btn-prev').disabled = (step === 0);
            document.getElementById('scene1-btn-next').disabled = (step === TOTAL_STEPS - 1);
        }

        // 事件绑定
        document.getElementById('scene1-btn-prev').addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep(currentStep);
            }
        });

        document.getElementById('scene1-btn-next').addEventListener('click', function() {
            if (currentStep < TOTAL_STEPS - 1) {
                currentStep++;
                renderStep(currentStep);
            }
        });

        // 初始化：渲染步骤 0
        renderStep(0);
    })();
    </script>
</body>
</html>
