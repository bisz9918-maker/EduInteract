<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>长方形剪去正方形周长计算 - Scene 1</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Microsoft YaHei', sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .control-btn { padding: 8px 20px; font-size: 14px; border: 2px solid #333; border-radius: 6px; background: #f5f5f5; cursor: pointer; transition: all 0.2s; }
        .control-btn:hover:not(:disabled) { background: #e0e0e0; }
        .control-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <!-- SVG 图示区：固定 800×500px -->
        <svg width="800" height="500" id="scene1-svg">
            <!-- 原长方形轮廓 (步骤 0-1 显示) -->
            <rect id="scene1-rect-original" x="250" y="150" width="300" height="200" fill="none" stroke="#000000" stroke-width="2" style="opacity: 1;"/>
            
            <!-- 剪去正方形虚线框 (步骤 1 显示) -->
            <rect id="scene1-rect-cut-dashed" x="450" y="200" width="100" height="100" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" style="opacity: 0;"/>
            
            <!-- 剪去区域填充 (步骤 1 显示) -->
            <rect id="scene1-rect-cut-fill" x="450" y="200" width="100" height="100" fill="#e0e0e0" style="opacity: 0;"/>
            
            <!-- 凹字形图形 (步骤 2-3 显示) -->
            <path id="scene1-path-concave" d="M250,150 L550,150 L550,200 L500,200 L500,300 L550,300 L550,350 L250,350 Z" fill="none" stroke="#000000" stroke-width="2" style="opacity: 0;"/>
            
            <!-- 高亮的新增边 (步骤 2-3 显示) -->
            <line id="scene1-line-new1" x1="500" y1="200" x2="500" y2="300" stroke="#1565c0" stroke-width="3" style="opacity: 0;"/>
            <line id="scene1-line-new2" x1="550" y1="200" x2="550" y2="300" stroke="#1565c0" stroke-width="3" style="opacity: 0;"/>
            
            <!-- 标签组 -->
            <!-- 左边长度标签"4" -->
            <text id="scene1-label-left-4" x="230" y="255" font-size="16" fill="#000000" text-anchor="end" style="opacity: 1;">4</text>
            
            <!-- 下边长度标签"6" -->
            <text id="scene1-label-bottom-6" x="400" y="375" font-size="16" fill="#000000" text-anchor="middle" style="opacity: 1;">6</text>
            
            <!-- 上边长度标签"6" (步骤 2-3 显示) -->
            <text id="scene1-label-top-6" x="400" y="145" font-size="16" fill="#000000" text-anchor="middle" style="opacity: 0;">6</text>
            
            <!-- 凹口竖边标签"2" (步骤 2-3 显示) - 移到凹口左侧外部 -->
            <text id="scene1-label-notch-vertical-2" x="485" y="255" font-size="16" fill="#000000" text-anchor="end" style="opacity: 0;">2</text>
            
            <!-- 凹口上横边标签"2" (步骤 2-3 显示) - 移到凹口上方外部 -->
            <text id="scene1-label-notch-top-2" x="500" y="185" font-size="16" fill="#000000" text-anchor="middle" style="opacity: 0;">2</text>
            
            <!-- 凹口下横边标签"2" (步骤 2-3 显示) - 移到凹口下方外部 -->
            <text id="scene1-label-notch-bottom-2" x="500" y="325" font-size="16" fill="#000000" text-anchor="middle" style="opacity: 0;">2</text>
            
            <!-- 右上竖边标签"1" (步骤 2-3 显示) - 移到右侧外部 -->
            <text id="scene1-label-top-right-1" x="565" y="225" font-size="16" fill="#000000" text-anchor="start" style="opacity: 0;">1</text>
            
            <!-- 右下竖边标签"1" (步骤 2-3 显示) - 移到右侧外部 -->
            <text id="scene1-label-bottom-right-1" x="565" y="280" font-size="16" fill="#000000" text-anchor="start" style="opacity: 0;">1</text>
            
            <!-- 剪去正方形边长标签"2" (步骤 1 显示) -->
            <text id="scene1-label-cut-2" x="565" y="255" font-size="16" fill="#c62828" text-anchor="start" style="opacity: 0;">2</text>
            
            <!-- 周长计算式 (步骤 3 显示) -->
            <text id="scene1-label-perimeter-calc" x="250" y="425" font-size="16" fill="#000000" style="opacity: 0;">周长 = 4+6+6+2+2+2+1+1 = </text>
            <text id="scene1-label-perimeter-result" x="475" y="425" font-size="18" fill="#2e7d32" font-weight="bold" style="opacity: 0;">24</text>
            <text id="scene1-label-perimeter-unit" x="520" y="425" font-size="16" fill="#000000" style="opacity: 0;">厘米</text>
        </svg>
        
        <!-- 控件栏叠在 SVG 底部 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="control-btn" disabled>◀ 上一步</button>
            <button id="scene1-btn-next" class="control-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现
        // 布局坐标表（50px/cm 比例）：
        // 原长方形：(250,150)-(550,350)，300×200
        // 剪去正方形：(450,200)-(550,300)，100×100
        // 凹字形 path：M250,150 L550,150 L550,200 L500,200 L500,300 L550,300 L550,350 L250,350 Z
        
        const sceneId = 'scene1';
        let currentStep = 0;
        const totalSteps = 4;
        
        // 元素组定义
        const elementGroups = {
            // 步骤 0：原长方形 + 基础标签
            step0: ['scene1-rect-original', 'scene1-label-left-4', 'scene1-label-bottom-6'],
            // 步骤 1：+ 剪去正方形虚线框 + 填充 + 标签
            step1: ['scene1-rect-cut-dashed', 'scene1-rect-cut-fill', 'scene1-label-cut-2'],
            // 步骤 2：凹字形 + 所有边长标签
            step2: ['scene1-path-concave', 'scene1-label-top-6', 'scene1-label-notch-vertical-2', 
                    'scene1-label-notch-top-2', 'scene1-label-notch-bottom-2', 'scene1-label-top-right-1', 
                    'scene1-label-bottom-right-1', 'scene1-line-new1', 'scene1-line-new2'],
            // 步骤 3：+ 周长计算式
            step3: ['scene1-label-perimeter-calc', 'scene1-label-perimeter-result', 'scene1-label-perimeter-unit']
        };
        
        // 工具函数：显示元素
        function show(elementId) {
            const el = document.getElementById(elementId);
            if (el) {
                el.style.opacity = '1';
                el.style.display = 'block';
            }
        }
        
        // 工具函数：隐藏元素
        function hide(elementId) {
            const el = document.getElementById(elementId);
            if (el) {
                el.style.opacity = '0';
                el.style.display = 'none';
            }
        }
        
        // 更新步骤显示
        function updateStep() {
            // 隐藏所有元素
            for (let step = 0; step < totalSteps; step++) {
                const groupKey = 'step' + step;
                if (elementGroups[groupKey]) {
                    elementGroups[groupKey].forEach(id => hide(id));
                }
            }
            
            // 显示当前步骤及之前的所有元素
            for (let step = 0; step <= currentStep; step++) {
                const groupKey = 'step' + step;
                if (elementGroups[groupKey]) {
                    elementGroups[groupKey].forEach(id => show(id));
                }
            }
            
            // 更新按钮状态
            const prevBtn = document.getElementById(sceneId + '-btn-prev');
            const nextBtn = document.getElementById(sceneId + '-btn-next');
            
            prevBtn.disabled = (currentStep === 0);
            nextBtn.disabled = (currentStep === totalSteps - 1);
        }
        
        // 事件绑定
        document.getElementById(sceneId + '-btn-prev').addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });
        
        document.getElementById(sceneId + '-btn-next').addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateStep();
            }
        });
        
        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
