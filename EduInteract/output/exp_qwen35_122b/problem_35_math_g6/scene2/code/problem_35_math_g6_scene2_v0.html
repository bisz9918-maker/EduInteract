<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 圆剪拼成长方形</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene2-btn {
            width: 80px; height: 30px;
            background: #9e9e9e; color: white;
            border: none; border-radius: 4px;
            font-size: 14px; cursor: pointer;
            transition: background 0.2s;
        }
        .scene2-btn:hover:not(:disabled) { background: #757575; }
        .scene2-btn:disabled { background: #bdbdbd; cursor: not-allowed; }
        .scene2-step-text { font-size: 16px; color: #000000; line-height: 30px; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" id="scene2-svg">
            <!-- 圆示意图：圆心 (80,150)，半径 60px -->
            <circle id="scene2-circle" cx="80" cy="150" r="60" fill="none" stroke="#888888" stroke-width="1" opacity="0.5"/>
            
            <!-- 圆半径线：(80,150)-(140,150) -->
            <line id="scene2-line-radius" x1="80" y1="150" x2="140" y2="150" stroke="#888888" stroke-width="1" style="display:none; opacity:0;"/>
            
            <!-- 圆周长半弧：上半圆周 -->
            <path id="scene2-arc-half" d="M 20 150 A 60 60 0 0 1 140 150" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="5,3" style="display:none; opacity:0;"/>
            
            <!-- 长方形：左上 (350,80)，右下 (680,220) -->
            <rect id="scene2-rect" x="350" y="80" width="330" height="140" fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 长方形内部扇形：16 个交错三角形 -->
            <g id="scene2-sectors">
                <!-- 上排 8 个三角形（顶点向下） -->
                <polygon points="360,90 380,210 400,90" fill="#cccccc"/>
                <polygon points="400,90 420,210 440,90" fill="#cccccc"/>
                <polygon points="440,90 460,210 480,90" fill="#cccccc"/>
                <polygon points="480,90 500,210 520,90" fill="#cccccc"/>
                <polygon points="520,90 540,210 560,90" fill="#cccccc"/>
                <polygon points="560,90 580,210 600,90" fill="#cccccc"/>
                <polygon points="600,90 620,210 640,90" fill="#cccccc"/>
                <polygon points="640,90 660,210 670,90" fill="#cccccc"/>
                <!-- 下排 8 个三角形（顶点向上） -->
                <polygon points="360,210 380,90 400,210" fill="#cccccc"/>
                <polygon points="400,210 420,90 440,210" fill="#cccccc"/>
                <polygon points="440,210 460,90 480,210" fill="#cccccc"/>
                <polygon points="480,210 500,90 520,210" fill="#cccccc"/>
                <polygon points="520,210 540,90 560,210" fill="#cccccc"/>
                <polygon points="560,210 580,90 600,210" fill="#cccccc"/>
                <polygon points="600,210 620,90 640,210" fill="#cccccc"/>
                <polygon points="640,210 660,90 670,210" fill="#cccccc"/>
            </g>
            
            <!-- 长标注线：(350,240)-(680,240) -->
            <line id="scene2-line-length" x1="350" y1="240" x2="680" y2="240" stroke="#1565c0" stroke-width="2" style="display:none; opacity:0;"/>
            <!-- 长标注线两端的小竖线 -->
            <line id="scene2-length-mark1" x1="350" y1="235" x2="350" y2="245" stroke="#1565c0" stroke-width="2" style="display:none; opacity:0;"/>
            <line id="scene2-length-mark2" x1="680" y1="235" x2="680" y2="245" stroke="#1565c0" stroke-width="2" style="display:none; opacity:0;"/>
            
            <!-- 宽标注线：(330,80)-(330,220) -->
            <line id="scene2-line-width" x1="330" y1="80" x2="330" y2="220" stroke="#2e7d32" stroke-width="2" style="display:none; opacity:0;"/>
            <!-- 宽标注线两端的小横线 -->
            <line id="scene2-width-mark1" x1="325" y1="80" x2="335" y2="80" stroke="#2e7d32" stroke-width="2" style="display:none; opacity:0;"/>
            <line id="scene2-width-mark2" x1="325" y1="220" x2="335" y2="220" stroke="#2e7d32" stroke-width="2" style="display:none; opacity:0;"/>
            
            <!-- 关系弧线 1：(140,150)→(240,180)→(330,150) -->
            <path id="scene2-curve-1" d="M 140 150 Q 240 180 330 150" fill="none" stroke="#c62828" stroke-width="1.5" stroke-dasharray="5,3" style="display:none; opacity:0;"/>
            
            <!-- 关系弧线 2：(80,90)→(200,60)→(350,80) -->
            <path id="scene2-curve-2" d="M 80 90 Q 200 60 350 80" fill="none" stroke="#c62828" stroke-width="1.5" stroke-dasharray="5,3" style="display:none; opacity:0;"/>
            
            <!-- 标签文字 -->
            <text id="scene2-label-r" x="110" y="140" font-size="14" fill="#888888" style="display:none; opacity:0;">r</text>
            <text id="scene2-label-halfcirc" x="80" y="85" font-size="14" fill="#888888" style="display:none; opacity:0;">C/2</text>
            <text id="scene2-label-length" x="515" y="270" font-size="16" fill="#1565c0" font-weight="bold" style="display:none; opacity:0;">长</text>
            <text id="scene2-label-width" x="300" y="155" font-size="16" fill="#2e7d32" font-weight="bold" style="display:none; opacity:0;">宽</text>
            
            <!-- 公式区标题 -->
            <text id="scene2-formula-title" x="100" y="300" font-size="16" fill="#000000" font-weight="bold" style="display:none; opacity:0;">公式推导：</text>
            
            <!-- 公式 1-4 -->
            <text id="scene2-formula-1" x="100" y="340" font-size="16" fill="#000000" style="display:none; opacity:0;">长 = C/2 = πr</text>
            <text id="scene2-formula-2" x="100" y="370" font-size="16" fill="#000000" style="display:none; opacity:0;">宽 = r</text>
            <text id="scene2-formula-3" x="100" y="400" font-size="16" fill="#000000" style="display:none; opacity:0;">周长 = 2(长 + 宽) = 2(πr + r)</text>
            <text id="scene2-formula-4" x="100" y="430" font-size="16" fill="#000000" style="display:none; opacity:0;">= 2r(π + 1)</text>
            
            <!-- 计算式/过程/结果 -->
            <text id="scene2-calc-text" x="400" y="340" font-size="16" fill="#000000" style="display:none; opacity:0;">代入 r = 10：</text>
            <text id="scene2-calc-process" x="400" y="370" font-size="16" fill="#000000" style="display:none; opacity:0;">2 × 10 × (3.14 + 1)</text>
            <text id="scene2-calc-result" x="400" y="405" font-size="20" fill="#c62828" font-weight="bold" style="display:none; opacity:0;">= 82.8cm</text>
            
            <!-- 控件栏 -->
            <g id="scene2-controls-svg">
                <rect id="scene2-btn-prev-bg" x="280" y="460" width="80" height="30" fill="#9e9e9e" rx="4" style="display:none;"/>
                <text id="scene2-btn-prev-text" x="320" y="480" font-size="14" fill="white" text-anchor="middle" style="display:none;">◀ 上一步</text>
                
                <text id="scene2-step-indicator" x="380" y="480" font-size="16" fill="#000000" text-anchor="middle">步骤 1/6</text>
                
                <rect id="scene2-btn-next-bg" x="520" y="460" width="80" height="30" fill="#9e9e9e" rx="4" style="display:none;"/>
                <text id="scene2-btn-next-text" x="560" y="480" font-size="14" fill="white" text-anchor="middle" style="display:none;">下一步 ▶</text>
            </g>
        </svg>
        
        <!-- HTML 控件栏（用于点击事件） -->
        <div id="scene2-controls">
            <button id="scene2-btn-prev" class="scene2-btn" disabled>◀ 上一步</button>
            <span id="scene2-step-text" class="scene2-step-text">步骤 1/6</span>
            <button id="scene2-btn-next" class="scene2-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现
        // 布局坐标表对照：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // | 圆示意图 | 圆形 | (80,150) 圆心 | r=60px | - | 左侧小图，灰色半透明 |
        // | 圆半径线 | 线段 | (80,150)-(140,150) | 60×1 | 上方 | 水平向右，标注半径 r |
        // | 圆周长半弧 | 弧线 | 上半圆周 | - | 上方 | 标注 C/2 |
        // | 长方形 | 矩形 | (350,80)-(680,220) | 330×140 | - | 右侧大图，黑色实线 |
        // | 长方形内部扇形 | 三角形组 | (360,90)-(670,210) | 多个 | - | 16 个交错三角形，灰色填充 |
        // | 长标注线 | 线段 | (350,240)-(680,240) | 330×2 | 下方 | 蓝色，标注"长" |
        // | 宽标注线 | 线段 | (330,80)-(330,220) | 2×140 | 左侧 | 绿色，标注"宽" |
        // | 关系弧线 1 | 曲线 | (140,150)-(330,150) | - | - | 红色虚线，连接半径与宽 |
        // | 关系弧线 2 | 曲线 | (80,90)-(350,80) | - | - | 红色虚线，连接半周长与长 |
        // | 公式区标题 | text | (100,300) | 120×20 | - | "公式推导：" |
        // | 公式 1 | text | (100,340) | 200×20 | - | "长 = C/2 = πr" |
        // | 公式 2 | text | (100,370) | 150×20 | - | "宽 = r" |
        // | 公式 3 | text | (100,400) | 250×20 | - | "周长 = 2(长 + 宽) = 2(πr + r)" |
        // | 公式 4 | text | (100,430) | 280×20 | - | "= 2r(π + 1)" |
        // | 计算式 | text | (400,340) | 300×20 | - | "代入 r = 10：" |
        // | 计算过程 | text | (400,370) | 320×20 | - | "2 × 10 × (3.14 + 1)" |
        // | 计算结果 | text | (400,400) | 200×24 | - | "= 82.8cm"（红色加粗） |
        
        const TOTAL_STEPS = 6;
        let currentStep = 0;
        
        // 工具函数：显示元素（同时设置 display 和 opacity）
        function show(el) {
            if (!el) return;
            el.style.display = '';
            el.style.opacity = '0';
            // 触发重排后淡入
            setTimeout(() => {
                el.style.transition = 'opacity 0.3s ease';
                el.style.opacity = '1';
            }, 10);
        }
        
        // 工具函数：隐藏元素
        function hide(el) {
            if (!el) return;
            el.style.opacity = '0';
            setTimeout(() => {
                el.style.display = 'none';
            }, 300);
        }
        
        // 工具函数：高亮公式（加粗 + 变色）
        function highlightFormula(formulaNum) {
            const el = document.getElementById('scene2-formula-' + formulaNum);
            if (el) {
                el.style.fontWeight = 'bold';
                el.style.fill = '#1565c0';
            }
        }
        
        // 工具函数：取消高亮
        function unhighlightFormula(formulaNum) {
            const el = document.getElementById('scene2-formula-' + formulaNum);
            if (el) {
                el.style.fontWeight = '';
                el.style.fill = '#000000';
            }
        }
        
        // 更新场景状态
        function updateScene() {
            // 更新步骤指示器
            document.getElementById('scene2-step-text').textContent = '步骤 ' + (currentStep + 1) + '/' + TOTAL_STEPS;
            document.getElementById('scene2-step-indicator').textContent = '步骤 ' + (currentStep + 1) + '/' + TOTAL_STEPS;
            
            // 更新按钮状态
            const prevBtn = document.getElementById('scene2-btn-prev');
            const nextBtn = document.getElementById('scene2-btn-next');
            prevBtn.disabled = (currentStep === 0);
            nextBtn.disabled = (currentStep === TOTAL_STEPS - 1);
            
            // 根据步骤控制元素显示/隐藏
            switch(currentStep) {
                case 0: // 初始状态：只显示圆和长方形
                    // 圆和长方形已默认显示
                    // 隐藏所有标注、公式
                    ['line-radius', 'arc-half', 'line-length', 'length-mark1', 'length-mark2',
                     'line-width', 'width-mark1', 'width-mark2', 'curve-1', 'curve-2',
                     'label-r', 'label-halfcirc', 'label-length', 'label-width',
                     'formula-title', 'formula-1', 'formula-2', 'formula-3', 'formula-4',
                     'calc-text', 'calc-process', 'calc-result'].forEach(suffix => {
                        hide(document.getElementById('scene2-' + suffix));
                    });
                    // 取消所有公式高亮
                    for (let i = 1; i <= 4; i++) unhighlightFormula(i);
                    break;
                    
                case 1: // 显示长宽标注线和标签，显示公式 1-2
                    show(document.getElementById('scene2-line-length'));
                    show(document.getElementById('scene2-length-mark1'));
                    show(document.getElementById('scene2-length-mark2'));
                    show(document.getElementById('scene2-line-width'));
                    show(document.getElementById('scene2-width-mark1'));
                    show(document.getElementById('scene2-width-mark2'));
                    show(document.getElementById('scene2-label-length'));
                    show(document.getElementById('scene2-label-width'));
                    show(document.getElementById('scene2-formula-title'));
                    show(document.getElementById('scene2-formula-1'));
                    show(document.getElementById('scene2-formula-2'));
                    // 取消高亮
                    for (let i = 1; i <= 4; i++) unhighlightFormula(i);
                    break;
                    
                case 2: // 显示关系弧线，高亮公式 1-2
                    show(document.getElementById('scene2-curve-1'));
                    show(document.getElementById('scene2-curve-2'));
                    highlightFormula(1);
                    highlightFormula(2);
                    break;
                    
                case 3: // 显示公式 3，高亮公式 1-3
                    show(document.getElementById('scene2-formula-3'));
                    highlightFormula(3);
                    break;
                    
                case 4: // 显示公式 4 和计算式
                    show(document.getElementById('scene2-formula-4'));
                    show(document.getElementById('scene2-calc-text'));
                    break;
                    
                case 5: // 显示计算过程和结果
                    show(document.getElementById('scene2-calc-process'));
                    show(document.getElementById('scene2-calc-result'));
                    // 闪烁强调结果
                    const resultEl = document.getElementById('scene2-calc-result');
                    let flashCount = 0;
                    const flashInterval = setInterval(() => {
                        flashCount++;
                        resultEl.style.opacity = flashCount % 2 === 0 ? '1' : '0.5';
                        if (flashCount >= 6) {
                            clearInterval(flashInterval);
                            resultEl.style.opacity = '1';
                        }
                    }, 300);
                    break;
            }
        }
        
        // 事件绑定
        document.getElementById('scene2-btn-prev').addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });
        
        document.getElementById('scene2-btn-next').addEventListener('click', function() {
            if (currentStep < TOTAL_STEPS - 1) {
                currentStep++;
                updateScene();
            }
        });
        
        // 初始化
        updateScene();
    })();
    </script>
</body>
</html>
