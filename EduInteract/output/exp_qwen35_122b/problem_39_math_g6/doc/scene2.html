<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 绕点旋转 90°的坐标变换规律</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene2-btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .scene2-btn-prev { background: #9e9e9e; color: white; }
        .scene2-btn-prev:disabled { background: #bdbdbd; cursor: not-allowed; }
        .scene2-btn-next { background: #1565c0; color: white; }
        .scene2-btn-next:hover:not(:disabled) { background: #0d47a1; }
        .scene2-hidden { display: none !important; }
        svg { display: block; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" id="scene2-svg">
            <!-- 左侧标题（y=30 确保 top edge >= 20px） -->
            <text id="scene2-left-title" x="20" y="30" font-size="18" font-weight="bold" fill="#000000">通用公式推导</text>
            
            <!-- 公式框（边框样式，无填充） -->
            <rect id="scene2-formula-box" x="20" y="50" width="360" height="130" fill="none" stroke="#1565c0" stroke-width="2"/>
            
            <!-- 公式 x' (放在框内) -->
            <text id="scene2-formula-x" x="40" y="85" font-size="16" fill="#1565c0">$x' = a + (y - b)$</text>
            
            <!-- 公式 y' -->
            <text id="scene2-formula-y" x="40" y="120" font-size="16" fill="#1565c0">$y' = b - (x - a)$</text>
            
            <!-- 公式说明 -->
            <text id="scene2-formula-note" x="40" y="150" font-size="14" fill="#666666">a, b 为旋转中心坐标</text>
            
            <!-- 三步流程图（初始隐藏） -->
            <rect id="scene2-step-flow" class="scene2-hidden" x="20" y="200" width="360" height="150" fill="none" stroke="#cccccc" stroke-width="1"/>
            
            <!-- 步骤 1 框 -->
            <rect id="scene2-step1-box" class="scene2-hidden" x="40" y="220" width="80" height="40" fill="#ffffff" stroke="#888888" stroke-width="1"/>
            <text id="scene2-step1-text" class="scene2-hidden" x="80" y="245" font-size="14" fill="#000000" text-anchor="middle">平移</text>
            
            <!-- 箭头 1 -->
            <path id="scene2-arrow1" class="scene2-hidden" d="M 140 240 L 170 240" stroke="#888888" stroke-width="2" fill="none"/>
            <path id="scene2-arrow1-head" class="scene2-hidden" d="M 165 235 L 170 240 L 165 245" fill="#888888"/>
            
            <!-- 步骤 2 框 -->
            <rect id="scene2-step2-box" class="scene2-hidden" x="170" y="220" width="80" height="40" fill="#ffffff" stroke="#888888" stroke-width="1"/>
            <text id="scene2-step2-text" class="scene2-hidden" x="210" y="245" font-size="14" fill="#000000" text-anchor="middle">旋转</text>
            
            <!-- 箭头 2 -->
            <path id="scene2-arrow2" class="scene2-hidden" d="M 270 240 L 300 240" stroke="#888888" stroke-width="2" fill="none"/>
            <path id="scene2-arrow2-head" class="scene2-hidden" d="M 295 235 L 300 240 L 295 245" fill="#888888"/>
            
            <!-- 步骤 3 框 -->
            <rect id="scene2-step3-box" class="scene2-hidden" x="300" y="220" width="80" height="40" fill="#ffffff" stroke="#888888" stroke-width="1"/>
            <text id="scene2-step3-text" class="scene2-hidden" x="340" y="245" font-size="14" fill="#000000" text-anchor="middle">平移</text>
            
            <!-- 右侧标题（初始隐藏，y=30 确保 top edge >= 20px） -->
            <text id="scene2-right-title" class="scene2-hidden" x="420" y="30" font-size="18" font-weight="bold" fill="#000000">本题应用</text>
            
            <!-- 已知条件框（初始隐藏，边框样式） -->
            <rect id="scene2-conditions-box" class="scene2-hidden" x="420" y="50" width="360" height="100" fill="none" stroke="#2e7d32" stroke-width="2"/>
            
            <!-- 条件 1 -->
            <text id="scene2-condition1" class="scene2-hidden" x="440" y="80" font-size="14" fill="#000000">旋转中心 O(5, 1)</text>
            
            <!-- 条件 2 -->
            <text id="scene2-condition2" class="scene2-hidden" x="440" y="110" font-size="14" fill="#000000">顶点 A(5, 7)</text>
            
            <!-- 条件 3 -->
            <text id="scene2-condition3" class="scene2-hidden" x="440" y="140" font-size="14" fill="#000000">旋转：顺时针 90°</text>
            
            <!-- 计算过程框（初始隐藏，边框样式） -->
            <rect id="scene2-calc-box" class="scene2-hidden" x="420" y="170" width="360" height="100" fill="none" stroke="#1565c0" stroke-width="2"/>
            
            <!-- 计算 1 -->
            <text id="scene2-calc1" class="scene2-hidden" x="440" y="195" font-size="14" fill="#1565c0">x' = 5 + (7 - 1) = 11</text>
            
            <!-- 计算 2 -->
            <text id="scene2-calc2" class="scene2-hidden" x="440" y="225" font-size="14" fill="#1565c0">y' = 1 - (5 - 5) = 1</text>
            
            <!-- 结果（初始隐藏） -->
            <text id="scene2-result" class="scene2-hidden" x="440" y="255" font-size="16" font-weight="bold" fill="#c62828">A'(11, 1)</text>
            
            <!-- 选项区标题（初始隐藏） -->
            <text id="scene2-option-title" class="scene2-hidden" x="420" y="290" font-size="16" font-weight="bold" fill="#000000">选项对比</text>
            
            <!-- 选项 A 框 -->
            <rect id="scene2-option-a-box" class="scene2-hidden" x="420" y="310" width="70" height="24" fill="#f0f0f0" stroke="#cccccc" stroke-width="1"/>
            <text id="scene2-option-a-text" class="scene2-hidden" x="455" y="326" font-size="11" fill="#000000" text-anchor="middle">A. (7,5)</text>
            
            <!-- 选项 B 框 -->
            <rect id="scene2-option-b-box" class="scene2-hidden" x="520" y="310" width="70" height="24" fill="#f0f0f0" stroke="#cccccc" stroke-width="1"/>
            <text id="scene2-option-b-text" class="scene2-hidden" x="555" y="326" font-size="11" fill="#000000" text-anchor="middle">B. (10,3)</text>
            
            <!-- 选项 C 框 -->
            <rect id="scene2-option-c-box" class="scene2-hidden" x="620" y="310" width="70" height="24" fill="#f0f0f0" stroke="#cccccc" stroke-width="1"/>
            <text id="scene2-option-c-text" class="scene2-hidden" x="655" y="326" font-size="11" fill="#000000" text-anchor="middle">C. (9,3)</text>
            
            <!-- 选项 D 框 -->
            <rect id="scene2-option-d-box" class="scene2-hidden" x="720" y="310" width="70" height="24" fill="#f0f0f0" stroke="#cccccc" stroke-width="1"/>
            <text id="scene2-option-d-text" class="scene2-hidden" x="755" y="326" font-size="11" fill="#000000" text-anchor="middle">D. (1,3)</text>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-prev-btn" class="scene2-btn scene2-btn-prev" disabled>◀ 上一步</button>
            <button id="scene2-next-btn" class="scene2-btn scene2-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script>
    (function() {
        // Scene 2: 绕点旋转 90°的坐标变换规律
        // 布局坐标表对照：
        // | 元素 | 类型 | 位置/范围 | 大小 | 备注 |
        // | 左侧标题 | text | (20,30) | 150×24 | "通用公式推导" |
        // | 公式框 | rect | (20,50)-(380,180) | 360×130 | 边框样式 |
        // | 公式 x' | text | (40,85) | 200×20 | x' = a + (y - b) |
        // | 公式 y' | text | (40,120) | 200×20 | y' = b - (x - a) |
        // | 公式说明 | text | (40,150) | 280×18 | a,b 为旋转中心坐标 |
        // | 三步流程图 | rect | (20,200)-(380,350) | 360×150 | 边框样式 |
        // | 步骤 1/2/3 框 | rect | (40,220)/(170,220)/(300,220) | 80×40 | 平移/旋转/平移 |
        // | 步骤 1/2/3 文本 | text | (80,245)/(210,245)/(340,245) | - | 居中显示 |
        // | 右侧标题 | text | (420,30) | 150×24 | "本题应用" |
        // | 已知条件框 | rect | (420,50)-(780,150) | 360×100 | 边框样式 |
        // | 条件 1/2/3 | text | (440,80)/(440,110)/(440,140) | - | O(5,1), A(5,7), 顺时针 90° |
        // | 计算过程框 | rect | (420,170)-(780,270) | 360×100 | 边框样式 |
        // | 计算 1/2 | text | (440,195)/(440,225) | - | x'=11, y'=1 |
        // | 结果 | text | (440,255) | - | A'(11,1) 红色高亮 |
        // | 选项区标题 | text | (420,290) | - | "选项对比" |
        // | 选项 A/B/C/D 框 | rect | (420,310)/(520,310)/(620,310)/(720,310) | 70×24 | C 选项绿色高亮 |
        // | 选项 A/B/C/D 文本 | text | (455,326)/(555,326)/(655,326)/(755,326) | - | 居中显示 |
        
        const TOTAL_STEPS = 4;
        let currentStep = 0;
        
        // 元素 ID 映射
        const elements = {
            // 步骤 0 元素（初始显示）
            step0: [
                'scene2-left-title',
                'scene2-formula-box',
                'scene2-formula-x',
                'scene2-formula-y',
                'scene2-formula-note'
            ],
            // 步骤 1 新增元素
            step1: [
                'scene2-step-flow',
                'scene2-step1-box', 'scene2-step1-text',
                'scene2-arrow1', 'scene2-arrow1-head',
                'scene2-step2-box', 'scene2-step2-text',
                'scene2-arrow2', 'scene2-arrow2-head',
                'scene2-step3-box', 'scene2-step3-text',
                'scene2-right-title',
                'scene2-conditions-box',
                'scene2-condition1',
                'scene2-condition2',
                'scene2-condition3'
            ],
            // 步骤 2 新增元素
            step2: [
                'scene2-calc-box',
                'scene2-calc1',
                'scene2-calc2',
                'scene2-result',
                'scene2-option-title',
                'scene2-option-a-box', 'scene2-option-a-text',
                'scene2-option-b-box', 'scene2-option-b-text',
                'scene2-option-c-box', 'scene2-option-c-text',
                'scene2-option-d-box', 'scene2-option-d-text'
            ],
            // 步骤 3 变化元素（高亮选项 C）
            step3: [
                'scene2-option-c-box',
                'scene2-option-c-text'
            ]
        };
        
        // 显示元素
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene2-hidden');
                el.style.display = '';
                el.style.opacity = '1';
            }
        }
        
        // 隐藏元素
        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.add('scene2-hidden');
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }
        
        // 高亮选项 C
        function highlightOptionC() {
            const box = document.getElementById('scene2-option-c-box');
            const text = document.getElementById('scene2-option-c-text');
            if (box) {
                box.setAttribute('fill', '#c8e6c9');
                box.setAttribute('stroke', '#2e7d32');
                box.setAttribute('stroke-width', '2');
            }
            if (text) {
                text.setAttribute('fill', '#2e7d32');
                text.setAttribute('font-weight', 'bold');
            }
        }
        
        // 取消选项 C 高亮
        function unhighlightOptionC() {
            const box = document.getElementById('scene2-option-c-box');
            const text = document.getElementById('scene2-option-c-text');
            if (box) {
                box.setAttribute('fill', '#f0f0f0');
                box.setAttribute('stroke', '#cccccc');
                box.setAttribute('stroke-width', '1');
            }
            if (text) {
                text.setAttribute('fill', '#000000');
                text.setAttribute('font-weight', '');
            }
        }
        
        // 更新步骤显示
        function updateStep() {
            // 隐藏所有步骤 1+ 的元素
            elements.step1.forEach(id => hideElement(id));
            elements.step2.forEach(id => hideElement(id));
            elements.step3.forEach(id => hideElement(id));
            
            // 取消选项 C 高亮
            unhighlightOptionC();
            
            // 显示当前步骤及之前的所有元素
            if (currentStep >= 1) {
                elements.step1.forEach(id => showElement(id));
            }
            if (currentStep >= 2) {
                elements.step2.forEach(id => showElement(id));
            }
            if (currentStep >= 3) {
                elements.step3.forEach(id => showElement(id));
                highlightOptionC();
            }
            
            // 更新按钮状态
            const prevBtn = document.getElementById('scene2-prev-btn');
            const nextBtn = document.getElementById('scene2-next-btn');
            
            prevBtn.disabled = (currentStep === 0);
            
            if (currentStep === TOTAL_STEPS - 1) {
                nextBtn.textContent = '完成';
                nextBtn.disabled = true;
            } else {
                nextBtn.textContent = '下一步 ▶';
                nextBtn.disabled = false;
            }
            
            // 触发 MathJax 重新渲染
            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }
        
        // 事件监听
        document.getElementById('scene2-prev-btn').addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });
        
        document.getElementById('scene2-next-btn').addEventListener('click', function() {
            if (currentStep < TOTAL_STEPS - 1) {
                currentStep++;
                updateStep();
            }
        });
        
        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
