<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三视图与俯视图网格推理 - Scene 1</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Microsoft YaHei', sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene1-btn { padding: 10px 20px; font-size: 14px; border: none; border-radius: 4px; cursor: pointer; transition: all 0.3s; }
        .scene1-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-prev-btn { background: #757575; color: white; }
        #scene1-next-btn { background: #1565c0; color: white; }
        #scene1-prev-btn:hover:not(:disabled) { background: #616161; }
        #scene1-next-btn:hover:not(:disabled) { background: #0d47a1; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- 主视图标签 -->
            <text id="scene1-label-main" x="90" y="45" text-anchor="middle" font-size="16" fill="#333">从正面看</text>
            
            <!-- 主视图区域边框 -->
            <rect id="scene1-main-view-box" x="40" y="60" width="140" height="160" fill="none" stroke="#ddd" stroke-width="1"/>
            
            <!-- 主视图图形 -->
            <g id="scene1-main-view">
                <!-- 左列下层 -->
                <rect id="scene1-main-1-1" x="60" y="160" width="40" height="40" fill="#e3f2fd" opacity="0.3" stroke="#000" stroke-width="2"/>
                <!-- 左列上层 -->
                <rect id="scene1-main-1-2" x="60" y="120" width="40" height="40" fill="#e3f2fd" opacity="0.3" stroke="#000" stroke-width="2"/>
                <!-- 中列 -->
                <rect id="scene1-main-2" x="100" y="160" width="40" height="40" fill="#e3f2fd" opacity="0.3" stroke="#000" stroke-width="2"/>
                <!-- 右列 -->
                <rect id="scene1-main-3" x="140" y="160" width="40" height="40" fill="#e3f2fd" opacity="0.3" stroke="#000" stroke-width="2"/>
            </g>
            
            <!-- 主视图高亮边框（初始隐藏） -->
            <rect id="scene1-main-view-highlight-1" x="60" y="120" width="40" height="80" fill="none" stroke="#c62828" stroke-width="3" opacity="0" style="display:none"/>
            <rect id="scene1-main-view-highlight-2" x="100" y="160" width="80" height="40" fill="none" stroke="#1565c0" stroke-width="3" opacity="0" style="display:none"/>
            
            <!-- 左视图标签 -->
            <text id="scene1-label-left" x="250" y="45" text-anchor="middle" font-size="16" fill="#333">从左面看</text>
            
            <!-- 左视图区域边框 -->
            <rect id="scene1-left-view-box" x="200" y="60" width="120" height="140" fill="none" stroke="#ddd" stroke-width="1"/>
            
            <!-- 左视图图形 -->
            <g id="scene1-left-view">
                <!-- 左列下层 -->
                <rect id="scene1-left-1-1" x="220" y="140" width="40" height="40" fill="#e3f2fd" opacity="0.3" stroke="#000" stroke-width="2"/>
                <!-- 左列上层 -->
                <rect id="scene1-left-1-2" x="220" y="100" width="40" height="40" fill="#e3f2fd" opacity="0.3" stroke="#000" stroke-width="2"/>
                <!-- 右列 -->
                <rect id="scene1-left-2" x="260" y="140" width="40" height="40" fill="#e3f2fd" opacity="0.3" stroke="#000" stroke-width="2"/>
            </g>
            
            <!-- 左视图高亮边框（初始隐藏） -->
            <rect id="scene1-left-view-highlight-1" x="220" y="100" width="40" height="80" fill="none" stroke="#c62828" stroke-width="3" opacity="0" style="display:none"/>
            
            <!-- 俯视图标签 -->
            <text id="scene1-label-top" x="520" y="45" text-anchor="middle" font-size="16" fill="#333">从上面看</text>
            
            <!-- 俯视图区域边框 -->
            <rect id="scene1-top-view-box" x="360" y="80" width="320" height="130" fill="none" stroke="#ddd" stroke-width="1"/>
            
            <!-- 俯视图网格 -->
            <g id="scene1-top-grid">
                <!-- 网格线 -->
                <line id="scene1-grid-h1" x1="360" y1="150" x2="680" y2="150" stroke="#000" stroke-width="1.5"/>
                <line id="scene1-grid-v1" x1="460" y1="80" x2="460" y2="210" stroke="#000" stroke-width="1.5"/>
                <line id="scene1-grid-v2" x1="560" y1="80" x2="560" y2="210" stroke="#000" stroke-width="1.5"/>
                <line id="scene1-grid-v3" x1="660" y1="80" x2="660" y2="210" stroke="#000" stroke-width="1.5"/>
                <line id="scene1-grid-border" x1="360" y1="80" x2="360" y2="210" stroke="#000" stroke-width="1.5"/>
                <line id="scene1-grid-border2" x1="680" y1="80" x2="680" y2="210" stroke="#000" stroke-width="1.5"/>
                <line id="scene1-grid-top" x1="360" y1="80" x2="680" y2="80" stroke="#000" stroke-width="1.5"/>
                <line id="scene1-grid-bottom" x1="360" y1="210" x2="680" y2="210" stroke="#000" stroke-width="1.5"/>
                
                <!-- 网格高亮外框（初始隐藏） -->
                <rect id="scene1-grid-highlight" x="360" y="80" width="320" height="130" fill="none" stroke="#1565c0" stroke-width="3" opacity="0" style="display:none"/>
            </g>
            
            <!-- 数字标签（放在格子内部，初始隐藏）- 使用白色背景圆垫底避免与网格线重叠 -->
            <!-- 格 1-1（左上）中心：(415, 122.5) - 格子范围 (370,90)-(460,145) -->
            <circle id="scene1-num-bg-1-1" cx="415" cy="122" r="22" fill="#fff" opacity="0" style="display:none"/>
            <text id="scene1-num-1-1" x="415" y="131" text-anchor="middle" font-size="20" fill="#c62828" opacity="0" style="display:none">2</text>
            
            <!-- 格 1-2（中上）中心：(515, 122.5) - 格子范围 (470,90)-(560,145) -->
            <circle id="scene1-num-bg-1-2" cx="515" cy="122" r="22" fill="#fff" opacity="0" style="display:none"/>
            <text id="scene1-num-1-2" x="515" y="131" text-anchor="middle" font-size="20" fill="#333" opacity="0" style="display:none">1</text>
            
            <!-- 格 1-3（右上）中心：(615, 122.5) - 格子范围 (570,90)-(660,145) -->
            <circle id="scene1-num-bg-1-3" cx="615" cy="122" r="22" fill="#fff" opacity="0" style="display:none"/>
            <text id="scene1-num-1-3" x="615" y="131" text-anchor="middle" font-size="20" fill="#333" opacity="0" style="display:none">1</text>
            
            <!-- 格 2-1（左下）中心：(415, 182.5) - 格子范围 (370,150)-(460,205) -->
            <circle id="scene1-num-bg-2-1" cx="415" cy="182" r="22" fill="#fff" opacity="0" style="display:none"/>
            <text id="scene1-num-2-1" x="415" y="191" text-anchor="middle" font-size="20" fill="#333" opacity="0" style="display:none">1</text>
            
            <!-- 总数显示区（初始隐藏） -->
            <text id="scene1-total-text" x="520" y="340" text-anchor="middle" font-size="24" fill="#2e7d32" opacity="0" style="display:none">总数 = 2 + 1 + 1 + 1 = 5</text>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-prev-btn" class="scene1-btn" disabled>◀ 上一步</button>
            <button id="scene1-next-btn" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现
        // 布局坐标表对照：
        // 主视图区域：(40,60)-(180,220)
        // 左视图区域：(200,60)-(320,200)
        // 俯视图网格：(360,80)-(680,210)
        // 格 1-1（左上）：(370,90)-(460,145) - 数字在 (415,131)
        // 格 1-2（中上）：(470,90)-(560,145) - 数字在 (515,131)
        // 格 1-3（右上）：(570,90)-(660,145) - 数字在 (615,131)
        // 格 2-1（左下）：(370,150)-(460,205) - 数字在 (415,191)
        
        const scene1 = {
            currentStep: 0,
            totalSteps: 4,
            
            elements: {
                // 主视图高亮
                mainHighlight1: document.getElementById('scene1-main-view-highlight-1'),
                mainHighlight2: document.getElementById('scene1-main-view-highlight-2'),
                // 左视图高亮
                leftHighlight1: document.getElementById('scene1-left-view-highlight-1'),
                // 网格
                gridHighlight: document.getElementById('scene1-grid-highlight'),
                // 数字背景圆和标签
                numBg11: document.getElementById('scene1-num-bg-1-1'),
                num11: document.getElementById('scene1-num-1-1'),
                numBg12: document.getElementById('scene1-num-bg-1-2'),
                num12: document.getElementById('scene1-num-1-2'),
                numBg13: document.getElementById('scene1-num-bg-1-3'),
                num13: document.getElementById('scene1-num-1-3'),
                numBg21: document.getElementById('scene1-num-bg-2-1'),
                num21: document.getElementById('scene1-num-2-1'),
                // 总数
                totalText: document.getElementById('scene1-total-text'),
                // 按钮
                prevBtn: document.getElementById('scene1-prev-btn'),
                nextBtn: document.getElementById('scene1-next-btn')
            },
            
            init: function() {
                this.elements.prevBtn.addEventListener('click', () => this.prevStep());
                this.elements.nextBtn.addEventListener('click', () => this.nextStep());
                this.updateScene();
            },
            
            prevStep: function() {
                if (this.currentStep > 0) {
                    this.currentStep--;
                    this.updateScene();
                }
            },
            
            nextStep: function() {
                if (this.currentStep < this.totalSteps) {
                    this.currentStep++;
                    this.updateScene();
                }
            },
            
            show: function(el) {
                if (el) {
                    el.style.display = 'block';
                    el.style.opacity = '1';
                }
            },
            
            hide: function(el) {
                if (el) {
                    el.style.opacity = '0';
                    setTimeout(() => {
                        if (el) el.style.display = 'none';
                    }, 300);
                }
            },
            
            updateScene: function() {
                const e = this.elements;
                
                // 更新按钮状态
                e.prevBtn.disabled = (this.currentStep === 0);
                
                if (this.currentStep === this.totalSteps) {
                    e.nextBtn.textContent = '完成';
                    e.nextBtn.disabled = true;
                } else {
                    e.nextBtn.textContent = '下一步 ▶';
                    e.nextBtn.disabled = false;
                }
                
                // 步骤 0：初始状态 - 只显示三视图，网格无填充无数字
                if (this.currentStep === 0) {
                    // 隐藏所有高亮
                    this.hide(e.mainHighlight1);
                    this.hide(e.mainHighlight2);
                    this.hide(e.leftHighlight1);
                    this.hide(e.gridHighlight);
                    // 隐藏所有数字
                    this.hide(e.numBg11);
                    this.hide(e.num11);
                    this.hide(e.numBg12);
                    this.hide(e.num12);
                    this.hide(e.numBg13);
                    this.hide(e.num13);
                    this.hide(e.numBg21);
                    this.hide(e.num21);
                    // 隐藏总数
                    this.hide(e.totalText);
                }
                
                // 步骤 1：网格外框高亮（显示有方块的位置）
                if (this.currentStep >= 1) {
                    this.show(e.gridHighlight);
                } else {
                    this.hide(e.gridHighlight);
                }
                
                // 步骤 2：标注格 1-2、格 1-3、格 2-1 为"1"，主视图第 2、3 列高亮
                if (this.currentStep >= 2) {
                    this.show(e.numBg12);
                    this.show(e.num12);
                    this.show(e.numBg13);
                    this.show(e.num13);
                    this.show(e.numBg21);
                    this.show(e.num21);
                    this.show(e.mainHighlight2);
                } else {
                    this.hide(e.numBg12);
                    this.hide(e.num12);
                    this.hide(e.numBg13);
                    this.hide(e.num13);
                    this.hide(e.numBg21);
                    this.hide(e.num21);
                    this.hide(e.mainHighlight2);
                }
                
                // 步骤 3：标注格 1-1 为"2"（红色），主视图第 1 列和左视图第 1 列高亮
                if (this.currentStep >= 3) {
                    this.show(e.numBg11);
                    this.show(e.num11);
                    this.show(e.mainHighlight1);
                    this.show(e.leftHighlight1);
                } else {
                    this.hide(e.numBg11);
                    this.hide(e.num11);
                    this.hide(e.mainHighlight1);
                    this.hide(e.leftHighlight1);
                }
                
                // 步骤 4：显示总数
                if (this.currentStep >= 4) {
                    this.show(e.totalText);
                } else {
                    this.hide(e.totalText);
                }
            }
        };
        
        scene1.init();
    })();
    </script>
</body>
</html>
