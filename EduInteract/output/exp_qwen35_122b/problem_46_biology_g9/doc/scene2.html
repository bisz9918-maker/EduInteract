<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNA 半保留复制过程 - 场景 2</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-svg { width: 800px; height: 500px; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene2-btn { width: 100px; height: 30px; font-size: 14px; cursor: pointer; border: 1px solid #333; border-radius: 4px; background: #f5f5f5; }
        .scene2-btn:hover:not(:disabled) { background: #e0e0e0; }
        .scene2-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene2-text { font-size: 14px; fill: #333333; }
        .scene2-title { font-size: 18px; font-weight: bold; fill: #333333; }
        .scene2-chain-15n { stroke: #1565c0; stroke-width: 3; fill: none; }
        .scene2-chain-14n { stroke: #2e7d32; stroke-width: 3; fill: none; }
        .scene2-base-pair { stroke: #888888; stroke-width: 2; }
        .scene2-helicase { stroke: #c62828; stroke-width: 2; fill: none; }
        .scene2-stat-box { stroke: #888888; stroke-width: 1; stroke-dasharray: 5,5; fill: none; }
        .scene2-stat-text { font-size: 13px; fill: #333333; }
        .scene2-stat-value { font-size: 13px; font-weight: bold; fill: #1565c0; }
        .scene2-fade { opacity: 0; transition: opacity 0.3s ease; }
        .scene2-fade.visible { opacity: 1; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500">
            <!-- 标题 -->
            <text x="280" y="35" class="scene2-title" text-anchor="middle">DNA 半保留复制过程</text>
            
            <!-- 亲代 DNA -->
            <g id="scene2-parent-group">
                <line x1="80" y1="60" x2="200" y2="60" class="scene2-chain-15n"/>
                <line x1="80" y1="80" x2="200" y2="80" class="scene2-chain-15n"/>
                <line x1="90" y1="60" x2="90" y2="80" class="scene2-base-pair"/>
                <line x1="110" y1="60" x2="110" y2="80" class="scene2-base-pair"/>
                <line x1="130" y1="60" x2="130" y2="80" class="scene2-base-pair"/>
                <line x1="150" y1="60" x2="150" y2="80" class="scene2-base-pair"/>
                <line x1="170" y1="60" x2="170" y2="80" class="scene2-base-pair"/>
                <line x1="190" y1="60" x2="190" y2="80" class="scene2-base-pair"/>
                <text x="140" y="45" class="scene2-text" text-anchor="middle">亲代</text>
                <text x="210" y="70" class="scene2-text">$^{15}$N-$^{15}$N</text>
            </g>
            
            <!-- 解旋酶箭头 -->
            <g id="scene2-helicase-group" class="scene2-fade">
                <line x1="140" y1="60" x2="140" y2="80" class="scene2-helicase"/>
                <polygon points="140,80 135,70 145,70" fill="#c62828"/>
                <text x="110" y="115" class="scene2-text" text-anchor="middle">解旋</text>
            </g>
            
            <!-- 解旋后单链 -->
            <g id="scene2-unwound-group" class="scene2-fade">
                <line x1="80" y1="130" x2="140" y2="130" class="scene2-chain-15n"/>
                <line x1="80" y1="150" x2="140" y2="150" class="scene2-chain-15n"/>
            </g>
            
            <!-- 新链合成 -->
            <g id="scene2-synthesis-group" class="scene2-fade">
                <line x1="160" y1="130" x2="220" y2="130" class="scene2-chain-14n"/>
                <line x1="160" y1="150" x2="220" y2="150" class="scene2-chain-14n"/>
                <text x="190" y="115" class="scene2-text" text-anchor="middle">新链合成</text>
            </g>
            
            <!-- 子一代 DNA -->
            <g id="scene2-gen1-group" class="scene2-fade">
                <!-- DNA1 -->
                <line x1="80" y1="210" x2="140" y2="210" class="scene2-chain-15n"/>
                <line x1="140" y1="210" x2="200" y2="210" class="scene2-chain-14n"/>
                <line x1="80" y1="230" x2="140" y2="230" class="scene2-chain-15n"/>
                <line x1="140" y1="230" x2="200" y2="230" class="scene2-chain-14n"/>
                <!-- DNA2 -->
                <line x1="240" y1="210" x2="300" y2="210" class="scene2-chain-15n"/>
                <line x1="300" y1="210" x2="360" y2="210" class="scene2-chain-14n"/>
                <line x1="240" y1="230" x2="300" y2="230" class="scene2-chain-15n"/>
                <line x1="300" y1="230" x2="360" y2="230" class="scene2-chain-14n"/>
                <text x="140" y="195" class="scene2-text" text-anchor="middle">子一代</text>
                <text x="380" y="220" class="scene2-text">2 个 DNA，2 个含$^{15}$N</text>
            </g>
            
            <!-- 子二代 DNA -->
            <g id="scene2-gen2-group" class="scene2-fade">
                <!-- DNA1 杂合 -->
                <line x1="80" y1="290" x2="120" y2="290" class="scene2-chain-15n"/>
                <line x1="120" y1="290" x2="160" y2="290" class="scene2-chain-14n"/>
                <line x1="80" y1="310" x2="120" y2="310" class="scene2-chain-15n"/>
                <line x1="120" y1="310" x2="160" y2="310" class="scene2-chain-14n"/>
                <!-- DNA2 杂合 -->
                <line x1="180" y1="290" x2="220" y2="290" class="scene2-chain-15n"/>
                <line x1="220" y1="290" x2="260" y2="290" class="scene2-chain-14n"/>
                <line x1="180" y1="310" x2="220" y2="310" class="scene2-chain-15n"/>
                <line x1="220" y1="310" x2="260" y2="310" class="scene2-chain-14n"/>
                <!-- DNA3 全 14N -->
                <line x1="280" y1="290" x2="320" y2="290" class="scene2-chain-14n"/>
                <line x1="320" y1="290" x2="360" y2="290" class="scene2-chain-14n"/>
                <line x1="280" y1="310" x2="320" y2="310" class="scene2-chain-14n"/>
                <line x1="320" y1="310" x2="360" y2="310" class="scene2-chain-14n"/>
                <!-- DNA4 全 14N -->
                <line x1="380" y1="290" x2="420" y2="290" class="scene2-chain-14n"/>
                <line x1="420" y1="290" x2="460" y2="290" class="scene2-chain-14n"/>
                <line x1="380" y1="310" x2="420" y2="310" class="scene2-chain-14n"/>
                <line x1="420" y1="310" x2="460" y2="310" class="scene2-chain-14n"/>
                <text x="270" y="275" class="scene2-text" text-anchor="middle">子二代</text>
                <text x="480" y="300" class="scene2-text">4 个 DNA，2 个含$^{15}$N</text>
            </g>
            
            <!-- 子 n 代示意 -->
            <g id="scene2-genn-group" class="scene2-fade">
                <line x1="100" y1="370" x2="400" y2="370" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>
                <text x="250" y="355" class="scene2-text" text-anchor="middle">子 n 代</text>
                <text x="250" y="385" class="scene2-text" text-anchor="middle">2^n 个 DNA，2 个含$^{15}$N</text>
            </g>
            
            <!-- 统计框：边框向内收缩，避免与文字重叠 -->
            <rect x="520" y="30" width="260" height="370" class="scene2-stat-box"/>
            <text x="650" y="60" class="scene2-text" text-anchor="middle" font-weight="bold">数量统计</text>
            <text x="540" y="95" class="scene2-stat-text">DNA 总数：</text>
            <text x="540" y="135" class="scene2-stat-text">含$^{15}$N 数量：</text>
            <text x="540" y="175" class="scene2-stat-text">含$^{14}$N 数量：</text>
            <text x="540" y="215" class="scene2-stat-text">含$^{14}$N 比例：</text>
            <text id="scene2-stat-total" x="700" y="95" class="scene2-stat-value">1</text>
            <text id="scene2-stat-15n" x="700" y="135" class="scene2-stat-value">1</text>
            <text id="scene2-stat-14n" x="700" y="175" class="scene2-stat-value">0</text>
            <text id="scene2-stat-ratio" x="700" y="215" class="scene2-stat-value">0%</text>
        </svg>
        
        <div id="scene2-controls">
            <button id="scene2-prev-btn" class="scene2-btn" disabled>◀ 上一步</button>
            <button id="scene2-next-btn" class="scene2-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // 布局坐标表（实现对照依据）
        // 标题：(280,35) ~240×20
        // 亲代 DNA 上链：(80,60)-(200,60) 蓝色#1565c0
        // 亲代 DNA 下链：(80,80)-(200,80) 蓝色#1565c0
        // 亲代碱基对：x=90,110,130,150,170,190 垂直线段
        // 亲代标签：(140,45) "亲代"
        // 亲代 15N 标签：(210,70) "15N-15N"
        // 解旋酶箭头：(140,60)→(140,80) 红色#c62828
        // 解旋标签：(110,115) "解旋"
        // 解旋后上链：(80,130)-(140,130) 蓝色
        // 解旋后下链：(80,150)-(140,150) 蓝色
        // 新链合成上：(160,130)-(220,130) 绿色#2e7d32
        // 新链合成下：(160,150)-(220,150) 绿色
        // 合成标签：(190,115) "新链合成"
        // 第一代 DNA：(80,210)-(200,210) 和 (240,210)-(360,210) 蓝 + 绿拼接
        // 第一代标签：(140,195) "子一代"
        // 第一代统计：(380,220) "2 个 DNA，2 个含 15N"
        // 第二代 DNA：4 组 DNA 分子
        // 第二代标签：(270,275) "子二代"
        // 第二代统计：(480,300) "4 个 DNA，2 个含 15N"
        // 第 n 代示意：(100,370)-(400,370) 虚线
        // 第 n 代标签：(250,355) "子 n 代"
        // 第 n 代统计：(250,385) "2^n 个 DNA，2 个含 15N"
        // 统计框：(520,30)-(780,400) 虚线边框
        // 统计标题：(650,60)
        // 统计行 1: (540,95) 和 (700,95)
        // 统计行 2: (540,135) 和 (700,135)
        // 统计行 3: (540,175) 和 (700,175)
        // 统计行 4: (540,215) 和 (700,215)
        // 控件栏：(300,455) 上一步，(400,455) 下一步
        
        const TOTAL_STEPS = 6;
        let currentStep = 0;
        
        // 获取 DOM 元素
        const prevBtn = document.getElementById('scene2-prev-btn');
        const nextBtn = document.getElementById('scene2-next-btn');
        const statTotal = document.getElementById('scene2-stat-total');
        const stat15n = document.getElementById('scene2-stat-15n');
        const stat14n = document.getElementById('scene2-stat-14n');
        const statRatio = document.getElementById('scene2-stat-ratio');
        
        // 元素组引用
        const groups = {
            parent: document.getElementById('scene2-parent-group'),
            helicase: document.getElementById('scene2-helicase-group'),
            unwound: document.getElementById('scene2-unwound-group'),
            synthesis: document.getElementById('scene2-synthesis-group'),
            gen1: document.getElementById('scene2-gen1-group'),
            gen2: document.getElementById('scene2-gen2-group'),
            genn: document.getElementById('scene2-genn-group')
        };
        
        // 工具函数：显示元素
        function show(el) {
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '1';
                el.classList.add('visible');
            }
        }
        
        // 工具函数：隐藏元素
        function hide(el) {
            if (el) {
                el.style.display = 'none';
                el.style.opacity = '0';
                el.classList.remove('visible');
            }
        }
        
        // 更新统计框
        function updateStats(step) {
            let total, has15n, has14n, ratio;
            
            switch(step) {
                case 0: // 亲代
                    total = 1;
                    has15n = 1;
                    has14n = 0;
                    ratio = 0;
                    break;
                case 1: // 解旋
                    total = 1;
                    has15n = 1;
                    has14n = 0;
                    ratio = 0;
                    break;
                case 2: // 新链合成
                    total = 1;
                    has15n = 1;
                    has14n = 0;
                    ratio = 0;
                    break;
                case 3: // 子一代
                    total = 2;
                    has15n = 2;
                    has14n = 2;
                    ratio = 100;
                    break;
                case 4: // 子二代
                    total = 4;
                    has15n = 2;
                    has14n = 4;
                    ratio = 100;
                    break;
                case 5: // 子 n 代
                    total = '2^n';
                    has15n = 2;
                    has14n = '2^n';
                    ratio = 100;
                    break;
            }
            
            statTotal.textContent = total;
            stat15n.textContent = has15n;
            stat14n.textContent = has14n;
            statRatio.textContent = ratio + '%';
        }
        
        // 更新场景显示
        function updateScene() {
            // 重置所有组
            for (let key in groups) {
                hide(groups[key]);
            }
            
            // 根据步骤显示对应元素
            switch(currentStep) {
                case 0: // 亲代
                    show(groups.parent);
                    break;
                case 1: // 解旋
                    show(groups.parent);
                    show(groups.helicase);
                    break;
                case 2: // 新链合成
                    show(groups.parent);
                    show(groups.helicase);
                    show(groups.unwound);
                    show(groups.synthesis);
                    break;
                case 3: // 子一代
                    show(groups.parent);
                    show(groups.helicase);
                    show(groups.unwound);
                    show(groups.synthesis);
                    show(groups.gen1);
                    break;
                case 4: // 子二代
                    show(groups.parent);
                    show(groups.helicase);
                    show(groups.unwound);
                    show(groups.synthesis);
                    show(groups.gen1);
                    show(groups.gen2);
                    break;
                case 5: // 子 n 代
                    show(groups.parent);
                    show(groups.helicase);
                    show(groups.unwound);
                    show(groups.synthesis);
                    show(groups.gen1);
                    show(groups.gen2);
                    show(groups.genn);
                    break;
            }
            
            // 更新统计框
            updateStats(currentStep);
            
            // 更新按钮状态
            prevBtn.disabled = (currentStep === 0);
            nextBtn.disabled = (currentStep === TOTAL_STEPS - 1);
            
            // 触发 MathJax 重新渲染
            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }
        
        // 事件绑定
        prevBtn.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });
        
        nextBtn.addEventListener('click', function() {
            if (currentStep < TOTAL_STEPS - 1) {
                currentStep++;
                updateScene();
            }
        });
        
        // 初始化
        updateScene();
    })();
    </script>
</body>
</html>
