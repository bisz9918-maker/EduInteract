<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>长方体表面展开方式对比</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene2-btn { padding: 10px 16px; font-size: 14px; cursor: pointer; border: 2px solid #1565c0; border-radius: 6px; background: #ffffff; color: #1565c0; transition: all 0.3s ease; }
        .scene2-btn:hover { background: #e3f2fd; }
        .scene2-btn.active { background: #1565c0; color: #ffffff; }
        .scene2-title { font-size: 18px; font-weight: bold; text-anchor: middle; }
        .scene2-label { font-size: 14px; }
        .scene2-result { font-size: 16px; text-anchor: middle; }
        .scene2-shortest { font-size: 16px; font-weight: bold; text-anchor: middle; fill: #2e7d32; }
        .scene2-rect { stroke: #000000; stroke-width: 2; }
        .scene2-fold-line { stroke: #888888; stroke-width: 2; stroke-dasharray: 5,5; }
        .scene2-path-line { stroke-width: 3; stroke-linecap: round; }
        .scene2-point { stroke: #ffffff; stroke-width: 2; }
        .scene2-group { transition: opacity 0.3s ease; }
        .scene2-group.hidden { opacity: 0; display: none; }
        .scene2-group.visible { opacity: 1; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500">
            <!-- 标题 -->
            <text x="400" y="45" class="scene2-title">长方体表面展开方式对比</text>
            
            <!-- 展开图容器边框 -->
            <rect x="150" y="80" width="500" height="280" fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 方式 1：前面 + 右面 -->
            <g id="scene2-group-mode1" class="scene2-group hidden">
                <!-- 前面矩形 (5×h = 150×200) -->
                <rect x="200" y="120" width="150" height="200" class="scene2-rect" fill="#e3f2fd" fill-opacity="0.15"/>
                <!-- 右面矩形 (3×h = 90×200) -->
                <rect x="350" y="120" width="90" height="200" class="scene2-rect" fill="#e3f2fd" fill-opacity="0.15"/>
                <!-- 折叠线 -->
                <line x1="350" y1="120" x2="350" y2="320" class="scene2-fold-line"/>
                <!-- A 点 -->
                <circle id="scene2-point-a1" cx="200" cy="320" r="6" class="scene2-point" fill="#1565c0"/>
                <text x="160" y="370" class="scene2-label">A</text>
                <!-- F 点 -->
                <circle id="scene2-point-f1" cx="440" cy="200" r="6" class="scene2-point" fill="#c62828"/>
                <text x="475" y="160" class="scene2-label">F</text>
                <!-- 路径线 -->
                <line id="scene2-path1" x1="200" y1="320" x2="440" y2="200" class="scene2-path-line" stroke="#2e7d32"/>
                <!-- 水平标注 (移到下方更远，避开结果文本) -->
                <text x="320" y="415" class="scene2-label" text-anchor="middle">8cm</text>
                <!-- 垂直标注 (移到右侧更远) -->
                <text x="495" y="200" class="scene2-label">6cm</text>
                <!-- 直角辅助线 -->
                <line x1="320" y1="320" x2="320" y2="415" stroke="#666666" stroke-width="1"/>
                <line x1="320" y1="415" x2="440" y2="415" stroke="#666666" stroke-width="1"/>
            </g>
            
            <!-- 方式 2：底面 + 右面 -->
            <g id="scene2-group-mode2" class="scene2-group hidden">
                <!-- 底面矩形 (5×3 = 150×90) -->
                <rect x="200" y="160" width="150" height="90" class="scene2-rect" fill="#e3f2fd" fill-opacity="0.15"/>
                <!-- 右面矩形 (3×h = 90×200) -->
                <rect x="200" y="250" width="90" height="200" class="scene2-rect" fill="#e3f2fd" fill-opacity="0.15"/>
                <!-- 折叠线 -->
                <line x1="200" y1="250" x2="290" y2="250" class="scene2-fold-line"/>
                <!-- A 点 -->
                <circle id="scene2-point-a2" cx="200" cy="250" r="6" class="scene2-point" fill="#1565c0"/>
                <text x="160" y="300" class="scene2-label">A</text>
                <!-- F 点 -->
                <circle id="scene2-point-f2" cx="290" cy="160" r="6" class="scene2-point" fill="#c62828"/>
                <text x="325" y="120" class="scene2-label">F</text>
                <!-- 路径线 -->
                <line id="scene2-path2" x1="200" y1="250" x2="290" y2="160" class="scene2-path-line" stroke="#000000"/>
                <!-- 水平标注 (移到上方更远) -->
                <text x="245" y="125" class="scene2-label" text-anchor="middle">5cm</text>
                <!-- 垂直标注 (移到右侧更远) -->
                <text x="335" y="205" class="scene2-label">9cm</text>
            </g>
            
            <!-- 方式 3：前面 + 顶面 + 右面 -->
            <g id="scene2-group-mode3" class="scene2-group hidden">
                <!-- 顶面矩形 (5×3 = 150×40) -->
                <rect x="200" y="80" width="150" height="40" class="scene2-rect" fill="#e3f2fd" fill-opacity="0.15"/>
                <!-- 前面矩形 (5×h = 150×200) -->
                <rect x="200" y="120" width="150" height="200" class="scene2-rect" fill="#e3f2fd" fill-opacity="0.15"/>
                <!-- 右面矩形 (3×h = 90×200) -->
                <rect x="350" y="120" width="90" height="200" class="scene2-rect" fill="#e3f2fd" fill-opacity="0.15"/>
                <!-- 折叠线 1 -->
                <line x1="200" y1="120" x2="350" y2="120" class="scene2-fold-line"/>
                <!-- 折叠线 2 -->
                <line x1="350" y1="120" x2="350" y2="320" class="scene2-fold-line"/>
                <!-- A 点 -->
                <circle id="scene2-point-a3" cx="200" cy="320" r="6" class="scene2-point" fill="#1565c0"/>
                <text x="160" y="370" class="scene2-label">A</text>
                <!-- F 点 -->
                <circle id="scene2-point-f3" cx="440" cy="200" r="6" class="scene2-point" fill="#c62828"/>
                <text x="475" y="160" class="scene2-label">F</text>
                <!-- 路径线 -->
                <line id="scene2-path3" x1="200" y1="320" x2="440" y2="200" class="scene2-path-line" stroke="#000000"/>
                <!-- 水平标注 (移到下方更远，避开结果文本) -->
                <text x="320" y="415" class="scene2-label" text-anchor="middle">11cm</text>
                <!-- 垂直标注 (移到右侧更远) -->
                <text x="495" y="260" class="scene2-label">3cm</text>
            </g>
            
            <!-- 结果文本区域 -->
            <text id="scene2-result-text" x="400" y="380" class="scene2-result" text-anchor="middle"></text>
            <text id="scene2-shortest-text" x="400" y="415" class="scene2-shortest" text-anchor="middle" style="display: none;">✓ 最短路径：10cm</text>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-btn-mode1" class="scene2-btn">展开方式 1：前面 + 右面</button>
            <button id="scene2-btn-mode2" class="scene2-btn">展开方式 2：底面 + 右面</button>
            <button id="scene2-btn-mode3" class="scene2-btn">展开方式 3：前面 + 顶面 + 右面</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现：长方体表面展开方式对比
        // 坐标表对照：
        // 方式 1: 前面 (200,120)-(350,320) 150×200, 右面 (350,120)-(440,320) 90×200
        //         A(200,320), F(440,200), 水平 8cm, 垂直 6cm
        // 方式 2: 底面 (200,160)-(350,250) 150×90, 右面 (200,250)-(290,450) 90×200
        //         A(200,250), F(290,160), 水平 5cm, 垂直 9cm
        // 方式 3: 顶面 (200,80)-(350,120) 150×40, 前面 (200,120)-(350,320) 150×200, 右面 (350,120)-(440,320) 90×200
        //         A(200,320), F(440,200), 水平 11cm, 垂直 3cm
        
        const state = {
            currentMode: 0,
            groups: {
                mode1: document.getElementById('scene2-group-mode1'),
                mode2: document.getElementById('scene2-group-mode2'),
                mode3: document.getElementById('scene2-group-mode3')
            },
            resultText: document.getElementById('scene2-result-text'),
            shortestText: document.getElementById('scene2-shortest-text'),
            buttons: {
                mode1: document.getElementById('scene2-btn-mode1'),
                mode2: document.getElementById('scene2-btn-mode2'),
                mode3: document.getElementById('scene2-btn-mode3')
            }
        };
        
        // 结果数据
        const results = {
            mode1: { text: '√(8²+6²) = √100 = 10cm', isShortest: true },
            mode2: { text: '√(5²+9²) = √106 ≈ 10.3cm', isShortest: false },
            mode3: { text: '√(11²+3²) = √130 ≈ 11.4cm', isShortest: false }
        };
        
        // 切换模式函数
        function switchMode(mode) {
            if (state.currentMode === mode) return;
            
            // 隐藏所有组
            Object.values(state.groups).forEach(g => {
                g.classList.add('hidden');
                g.classList.remove('visible');
            });
            
            // 移除所有按钮激活状态
            Object.values(state.buttons).forEach(b => b.classList.remove('active'));
            
            // 显示新组
            const newGroup = state.groups['mode' + mode];
            const newButton = state.buttons['mode' + mode];
            
            // 使用 requestAnimationFrame 确保过渡效果
            requestAnimationFrame(() => {
                newGroup.classList.remove('hidden');
                newGroup.classList.add('visible');
                newButton.classList.add('active');
                
                // 更新结果文本
                const result = results['mode' + mode];
                state.resultText.textContent = '计算结果：' + result.text;
                
                // 更新最短路径标记
                if (result.isShortest) {
                    state.shortestText.style.display = 'block';
                } else {
                    state.shortestText.style.display = 'none';
                }
                
                state.currentMode = mode;
            });
        }
        
        // 绑定按钮事件
        state.buttons.mode1.addEventListener('click', () => switchMode(1));
        state.buttons.mode2.addEventListener('click', () => switchMode(2));
        state.buttons.mode3.addEventListener('click', () => switchMode(3));
        
        // 初始化：默认显示方式 1
        switchMode(1);
    })();
    </script>
</body>
</html>
