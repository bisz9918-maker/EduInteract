<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>空间几何与圆锥截面 - Scene 1</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene1-btn { padding: 8px 16px; font-size: 14px; background: #1565c0; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .scene1-btn:disabled { background: #999; cursor: not-allowed; }
        .scene1-step-indicator { padding: 8px 16px; font-size: 14px; background: #f0f0f0; border-radius: 4px; min-width: 80px; text-align: center; }
        .scene1-hidden { opacity: 0; display: none; }
        .scene1-visible { opacity: 1; display: block; }
        svg text { font-family: "Microsoft YaHei", sans-serif; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- 平面 M：平行四边形（上移以避免与标签重叠） -->
            <polygon id="scene1-planeM" class="scene1-visible" points="150,360 650,360 650,420 150,420" fill="#e0e0e0" opacity="0.3"/>
            
            <!-- 圆锥面（步骤 2 出现） -->
            <path id="scene1-coneSurface" class="scene1-hidden" d="M 400,80 Q 200,410 150,420 L 650,420 Q 600,410 400,80" fill="#1565c0" opacity="0.15"/>
            
            <!-- 截线椭圆（步骤 3 出现） -->
            <ellipse id="scene1-traceLine" class="scene1-hidden" cx="450" cy="380" rx="100" ry="15" fill="none" stroke="#c62828" stroke-width="3"/>
            
            <!-- 线段 PO：垂直虚线 -->
            <line id="scene1-linePO" class="scene1-visible" x1="400" y1="80" x2="400" y2="360" stroke="#000000" stroke-width="2" stroke-dasharray="5,5"/>
            
            <!-- 线段 PA：固定斜线 -->
            <line id="scene1-linePA" class="scene1-visible" x1="400" y1="80" x2="240" y2="370" stroke="#000000" stroke-width="2"/>
            
            <!-- 线段 PB：动直线（步骤 1 出现） -->
            <line id="scene1-linePB" class="scene1-hidden" x1="400" y1="80" x2="520" y2="380" stroke="#000000" stroke-width="2"/>
            
            <!-- 线段 OA：平面内辅助线 -->
            <line id="scene1-lineOA" class="scene1-visible" x1="400" y1="360" x2="240" y2="370" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>
            
            <!-- 线段 OB：平面内辅助线（步骤 1 出现） -->
            <line id="scene1-lineOB" class="scene1-hidden" x1="400" y1="360" x2="520" y2="380" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>
            
            <!-- 线段 AB：平面内辅助线（步骤 1 出现） -->
            <line id="scene1-lineAB" class="scene1-hidden" x1="240" y1="370" x2="520" y2="380" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>
            
            <!-- 点 P：红色顶点 -->
            <circle id="scene1-pointP" class="scene1-visible" cx="400" cy="80" r="8" fill="#c62828"/>
            
            <!-- 点 O：蓝色垂足 -->
            <circle id="scene1-pointO" class="scene1-visible" cx="400" cy="360" r="6" fill="#1565c0"/>
            
            <!-- 点 A：蓝色斜足 -->
            <circle id="scene1-pointA" class="scene1-visible" cx="240" cy="370" r="6" fill="#1565c0"/>
            
            <!-- 点 B：蓝色动点（步骤 1 出现） -->
            <circle id="scene1-pointB" class="scene1-hidden" cx="520" cy="380" r="6" fill="#1565c0"/>
            
            <!-- 角度弧 α：∠APO -->
            <path id="scene1-arcAlpha" class="scene1-visible" d="M 385,150 A 30,30 0 0 0 395,200" fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 角度弧 β：∠APB（步骤 1 出现） -->
            <path id="scene1-arcBeta" class="scene1-hidden" d="M 440,160 A 40,40 0 0 1 470,220" fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 标签 P -->
            <text id="scene1-labelP" class="scene1-visible" x="385" y="65" font-size="18" fill="#c62828" font-weight="bold">P</text>
            
            <!-- 标签 O（右移，远离⊥符号） -->
            <text id="scene1-labelO" class="scene1-visible" x="415" y="355" font-size="18" fill="#1565c0" font-weight="bold">O</text>
            
            <!-- 标签 A（移到平面下方） -->
            <text id="scene1-labelA" class="scene1-visible" x="220" y="400" font-size="18" fill="#1565c0" font-weight="bold">A</text>
            
            <!-- 标签 B（步骤 1 出现，右移） -->
            <text id="scene1-labelB" class="scene1-hidden" x="535" y="410" font-size="18" fill="#1565c0" font-weight="bold">B</text>
            
            <!-- 标签 M -->
            <text id="scene1-labelM" x="660" y="390" font-size="18" fill="#1565c0" font-weight="bold">M</text>
            
            <!-- 标签 α（移到更左侧） -->
            <text id="scene1-labelAlpha" class="scene1-visible" x="340" y="180" font-size="20" fill="#000000">α</text>
            
            <!-- 标签 β（步骤 1 出现，右移） -->
            <text id="scene1-labelBeta" class="scene1-hidden" x="470" y="200" font-size="20" fill="#000000">β</text>
            
            <!-- 垂直符号（移到更下方） -->
            <text id="scene1-perpSymbol" class="scene1-visible" x="405" y="355" font-size="16" fill="#000000">⊥</text>
            
            <!-- 轨迹类型说明（步骤 4 出现，移到右侧独立区域，上移避免与圆锥重叠） -->
            <g id="scene1-traceTypes" class="scene1-hidden">
                <rect x="520" y="20" width="260" height="180" fill="#f5f5f5" opacity="0.95" rx="8" stroke="#ccc" stroke-width="1"/>
                <text x="535" y="45" font-size="14" fill="#000000" font-weight="bold">圆锥截面轨迹类型：</text>
                <text x="535" y="70" font-size="12" fill="#333333">① α=0°, β=90° → 圆</text>
                <text x="535" y="90" font-size="12" fill="#333333">② α≠0°, β=90° → 直线</text>
                <text x="535" y="110" font-size="12" fill="#333333">③ α+β=90° → 抛物线</text>
                <text x="535" y="130" font-size="12" fill="#333333">④ α+β>90° → 椭圆</text>
                <text x="535" y="150" font-size="12" fill="#c62828" font-weight="bold">⑤ α+β<90° → 双曲线</text>
            </g>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-prevBtn" class="scene1-btn" disabled>◀ 上一步</button>
            <div id="scene1-stepIndicator" class="scene1-step-indicator">步骤 1/5</div>
            <button id="scene1-nextBtn" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现
        // 布局坐标表对照（调整后）：
        // 平面 M: (150,360)-(650,420)
        // 点 P: (400,80), 点 O: (400,360), 点 A: (240,370), 点 B: (520,380)
        // 标签 P: (385,65), O: (415,355), A: (220,400), B: (535,410), M: (660,390)
        // α标签：(340,180), β标签：(470,200), ⊥符号：(405,355)
        
        const scene1 = {
            currentStep: 0,
            totalSteps: 5,
            elements: {
                // 步骤 0 基础元素
                planeM: document.getElementById('scene1-planeM'),
                linePO: document.getElementById('scene1-linePO'),
                linePA: document.getElementById('scene1-linePA'),
                lineOA: document.getElementById('scene1-lineOA'),
                pointP: document.getElementById('scene1-pointP'),
                pointO: document.getElementById('scene1-pointO'),
                pointA: document.getElementById('scene1-pointA'),
                labelP: document.getElementById('scene1-labelP'),
                labelO: document.getElementById('scene1-labelO'),
                labelA: document.getElementById('scene1-labelA'),
                labelM: document.getElementById('scene1-labelM'),
                labelAlpha: document.getElementById('scene1-labelAlpha'),
                perpSymbol: document.getElementById('scene1-perpSymbol'),
                arcAlpha: document.getElementById('scene1-arcAlpha'),
                
                // 步骤 1 新增
                linePB: document.getElementById('scene1-linePB'),
                lineOB: document.getElementById('scene1-lineOB'),
                lineAB: document.getElementById('scene1-lineAB'),
                pointB: document.getElementById('scene1-pointB'),
                labelB: document.getElementById('scene1-labelB'),
                labelBeta: document.getElementById('scene1-labelBeta'),
                arcBeta: document.getElementById('scene1-arcBeta'),
                
                // 步骤 2 新增
                coneSurface: document.getElementById('scene1-coneSurface'),
                
                // 步骤 3 新增
                traceLine: document.getElementById('scene1-traceLine'),
                
                // 步骤 4 新增
                traceTypes: document.getElementById('scene1-traceTypes'),
                
                // 控件
                prevBtn: document.getElementById('scene1-prevBtn'),
                nextBtn: document.getElementById('scene1-nextBtn'),
                stepIndicator: document.getElementById('scene1-stepIndicator')
            },
            
            // 工具函数：显示元素
            show: function(el) {
                if (el) {
                    el.classList.remove('scene1-hidden');
                    el.classList.add('scene1-visible');
                    el.style.opacity = '1';
                    el.style.display = 'block';
                }
            },
            
            // 工具函数：隐藏元素
            hide: function(el) {
                if (el) {
                    el.classList.remove('scene1-visible');
                    el.classList.add('scene1-hidden');
                    el.style.opacity = '0';
                    el.style.display = 'none';
                }
            },
            
            // 更新场景状态
            updateScene: function() {
                const e = this.elements;
                const step = this.currentStep;
                
                // 步骤 0：基础空间几何模型
                if (step === 0) {
                    // 基础元素显示
                    this.show(e.planeM);
                    this.show(e.linePO);
                    this.show(e.linePA);
                    this.show(e.lineOA);
                    this.show(e.pointP);
                    this.show(e.pointO);
                    this.show(e.pointA);
                    this.show(e.labelP);
                    this.show(e.labelO);
                    this.show(e.labelA);
                    this.show(e.labelM);
                    this.show(e.labelAlpha);
                    this.show(e.perpSymbol);
                    this.show(e.arcAlpha);
                    
                    // 步骤 1+ 的元素隐藏
                    this.hide(e.linePB);
                    this.hide(e.lineOB);
                    this.hide(e.lineAB);
                    this.hide(e.pointB);
                    this.hide(e.labelB);
                    this.hide(e.labelBeta);
                    this.hide(e.arcBeta);
                    this.hide(e.coneSurface);
                    this.hide(e.traceLine);
                    this.hide(e.traceTypes);
                }
                
                // 步骤 1：引入动直线
                if (step >= 1) {
                    this.show(e.linePB);
                    this.show(e.lineOB);
                    this.show(e.lineAB);
                    this.show(e.pointB);
                    this.show(e.labelB);
                    this.show(e.labelBeta);
                    this.show(e.arcBeta);
                } else {
                    this.hide(e.linePB);
                    this.hide(e.lineOB);
                    this.hide(e.lineAB);
                    this.hide(e.pointB);
                    this.hide(e.labelB);
                    this.hide(e.labelBeta);
                    this.hide(e.arcBeta);
                }
                
                // 步骤 2：形成圆锥面
                if (step >= 2) {
                    this.show(e.coneSurface);
                } else {
                    this.hide(e.coneSurface);
                }
                
                // 步骤 3：平面截圆锥
                if (step >= 3) {
                    this.show(e.traceLine);
                } else {
                    this.hide(e.traceLine);
                }
                
                // 步骤 4：轨迹类型对比
                if (step >= 4) {
                    this.show(e.traceTypes);
                } else {
                    this.hide(e.traceTypes);
                }
                
                // 更新按钮状态
                e.prevBtn.disabled = (step === 0);
                e.nextBtn.disabled = (step === this.totalSteps - 1);
                
                // 更新步骤指示器（显示步骤 k/5，但实际是 1-indexed 显示）
                e.stepIndicator.textContent = '步骤 ' + (step + 1) + '/5';
            },
            
            // 下一步
            nextStep: function() {
                if (this.currentStep < this.totalSteps - 1) {
                    this.currentStep++;
                    this.updateScene();
                }
            },
            
            // 上一步
            prevStep: function() {
                if (this.currentStep > 0) {
                    this.currentStep--;
                    this.updateScene();
                }
            },
            
            // 初始化
            init: function() {
                this.updateScene();
                
                // 绑定按钮事件
                e = this.elements;
                e.prevBtn.addEventListener('click', this.prevStep.bind(this));
                e.nextBtn.addEventListener('click', this.nextStep.bind(this));
            }
        };
        
        // 启动场景
        scene1.init();
    })();
    </script>
</body>
</html>
