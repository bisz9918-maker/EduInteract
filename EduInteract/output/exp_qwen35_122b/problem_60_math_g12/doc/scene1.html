<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圆与椭圆的切线性质类比</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene1-btn { padding: 8px 16px; font-size: 14px; border: none; border-radius: 4px; cursor: pointer; transition: all 0.3s ease; }
        .scene1-btn-enabled { background: #1565c0; color: white; }
        .scene1-btn-enabled:hover { background: #0d47a1; }
        .scene1-btn-disabled { background: #bdbdbd; color: #757575; cursor: not-allowed; }
        .scene1-hidden { display: none !important; }
        .scene1-fade-in { opacity: 0; transition: opacity 0.3s ease; }
        .scene1-fade-in.visible { opacity: 1; }
        .scene1-highlight-red { stroke: #c62828 !important; stroke-width: 3 !important; }
        .scene1-highlight-blue { stroke: #1565c0 !important; stroke-width: 3 !important; }
        .scene1-conclusion-box { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 2; }
        .scene1-conclusion-text { fill: #2e7d32; font-size: 18px; font-weight: bold; }
        text { font-size: 14px; }
        .scene1-title { font-size: 16px; font-weight: bold; }
        .scene1-label { font-size: 13px; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <!-- SVG 图示区：固定 800×500px -->
        <svg width="800" height="500" id="scene1-svg">
            <!-- 主标题 -->
            <text x="400" y="20" text-anchor="middle" class="scene1-title">圆与椭圆的切线性质类比</text>
            
            <!-- 左侧标题 -->
            <text x="160" y="40" text-anchor="middle" class="scene1-title">圆的情况</text>
            
            <!-- 右侧标题 -->
            <text x="600" y="40" text-anchor="middle" class="scene1-title">椭圆的情况</text>
            
            <!-- ========== 左侧图形（圆） ========== -->
            <g id="scene1-left">
                <!-- 圆 -->
                <ellipse cx="200" cy="225" rx="80" ry="80" fill="#e3f2fd" stroke="#000" stroke-width="2"/>
                
                <!-- 直径 AB -->
                <line x1="120" y1="225" x2="280" y2="225" stroke="#000" stroke-width="2"/>
                
                <!-- 切线 AC -->
                <line x1="120" y1="225" x2="120" y2="100" stroke="#000" stroke-width="2"/>
                
                <!-- 切线 BD -->
                <line x1="280" y1="225" x2="280" y2="100" stroke="#000" stroke-width="2"/>
                
                <!-- 点 P -->
                <circle cx="160" cy="160" r="4" fill="#000"/>
                
                <!-- 切线 CD -->
                <line x1="120" y1="140" x2="280" y2="110" stroke="#000" stroke-width="2"/>
                
                <!-- 半径 PO（步骤 1 显示） -->
                <line id="scene1-po-left" class="scene1-fade-in scene1-hidden" x1="160" y1="160" x2="200" y2="225" stroke="#1565c0" stroke-width="3"/>
                
                <!-- 标签 -->
                <text x="200" y="245" text-anchor="middle" class="scene1-label">O</text>
                <text x="110" y="230" text-anchor="end" class="scene1-label">A</text>
                <text x="285" y="230" text-anchor="start" class="scene1-label">B</text>
                <text x="150" y="145" text-anchor="end" class="scene1-label">P</text>
                <text x="105" y="140" text-anchor="end" class="scene1-label">C</text>
                <text x="295" y="110" text-anchor="start" class="scene1-label">D</text>
                <text id="scene1-po-label" class="scene1-fade-in scene1-hidden" x="175" y="185" text-anchor="middle" class="scene1-label">PO</text>
            </g>
            
            <!-- ========== 右侧图形（椭圆） ========== -->
            <g id="scene1-right">
                <!-- 椭圆 -->
                <ellipse cx="600" cy="225" rx="80" ry="50" fill="#fff3e0" stroke="#000" stroke-width="2"/>
                
                <!-- 长轴 AB -->
                <line x1="520" y1="225" x2="680" y2="225" stroke="#000" stroke-width="2"/>
                
                <!-- 切线 AC -->
                <line x1="520" y1="225" x2="520" y2="100" stroke="#000" stroke-width="2"/>
                
                <!-- 切线 BD -->
                <line x1="680" y1="225" x2="680" y2="100" stroke="#000" stroke-width="2"/>
                
                <!-- 点 P -->
                <circle cx="560" cy="180" r="4" fill="#000"/>
                
                <!-- 切线 CD -->
                <line x1="520" y1="160" x2="680" y2="100" stroke="#000" stroke-width="2"/>
                
                <!-- 短轴（步骤 2 显示） -->
                <line id="scene1-short-axis" class="scene1-fade-in scene1-hidden" x1="600" y1="175" x2="600" y2="275" stroke="#888880" stroke-width="2" stroke-dasharray="5,5"/>
                
                <!-- 焦点 F₁、F₂（步骤 2 显示） -->
                <circle id="scene1-f1" class="scene1-fade-in scene1-hidden" cx="640" cy="225" r="4" fill="#000"/>
                <circle id="scene1-f2" class="scene1-fade-in scene1-hidden" cx="560" cy="225" r="4" fill="#000"/>
                
                <!-- 标签 -->
                <text x="600" y="245" text-anchor="middle" class="scene1-label">O</text>
                <text x="510" y="230" text-anchor="end" class="scene1-label">A</text>
                <text x="685" y="230" text-anchor="start" class="scene1-label">B</text>
                <text x="550" y="165" text-anchor="end" class="scene1-label">P</text>
                <text x="505" y="160" text-anchor="end" class="scene1-label">C</text>
                <text x="695" y="100" text-anchor="start" class="scene1-label">D</text>
                <text id="scene1-f1-label" class="scene1-fade-in scene1-hidden" x="640" y="245" text-anchor="middle" class="scene1-label">F₁</text>
                <text id="scene1-f2-label" class="scene1-fade-in scene1-hidden" x="560" y="245" text-anchor="middle" class="scene1-label">F₂</text>
                <text id="scene1-b-label" class="scene1-fade-in scene1-hidden" x="610" y="210" text-anchor="start" class="scene1-label">b</text>
            </g>
            
            <!-- ========== 结论框（步骤 4 显示） ========== -->
            <g id="scene1-conclusion" class="scene1-fade-in scene1-hidden">
                <rect x="300" y="360" width="200" height="60" class="scene1-conclusion-box" rx="5"/>
                <text id="scene1-conclusion-text" x="400" y="395" text-anchor="middle" class="scene1-conclusion-text"></text>
            </g>
            
            <!-- 步骤标题 -->
            <text id="scene1-step-title" x="400" y="70" text-anchor="middle" class="scene1-title" style="font-size: 14px;">圆与椭圆的切线性质类比</text>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn scene1-btn-disabled">◀ 上一步</button>
            <button id="scene1-btn-next" class="scene1-btn scene1-btn-enabled">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现
        // 布局坐标表（参考）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // |------|------|-----------|------|-------------|------|
        // | 左侧标题 | text | (160, 20) | ~80×16 | - | "圆的情况" |
        // | 右侧标题 | text | (560, 20) | ~100×16 | - | "椭圆的情况" |
        // | 圆 | ellipse | (200, 225) | 80×80 | - | 圆心 O，填充透明度 15% |
        // | 椭圆 | ellipse | (600, 225) | 80×50 | - | 中心 O，填充透明度 15% |
        // | 直径 AB(左) | line | (120, 225)-(280, 225) | 160×2 | - | 圆的水平直径 |
        // | 长轴 AB(右) | line | (520, 225)-(680, 225) | 160×2 | - | 椭圆的长轴 |
        // | 切线 AC(左) | line | (120, 225)-(120, 100) | 2×125 | - | 过 A 的垂直切线 |
        // | 切线 BD(左) | line | (280, 225)-(280, 100) | 2×125 | - | 过 B 的垂直切线 |
        // | 切线 AC(右) | line | (520, 225)-(520, 100) | 2×125 | - | 过 A 的垂直切线 |
        // | 切线 BD(右) | line | (680, 225)-(680, 100) | 2×125 | - | 过 B 的垂直切线 |
        // | 点 P(左) | circle | (160, 160) | 4×4 | - | 圆上点 |
        // | 点 P(右) | circle | (560, 180) | 4×4 | - | 椭圆上点 |
        // | 切线 CD(左) | line | (120, 140)-(280, 110) | ~160×2 | - | 过 P 的切线 |
        // | 切线 CD(右) | line | (520, 160)-(680, 100) | ~180×2 | - | 过 P 的切线 |
        // | 半径 PO(左) | line | (160, 160)-(200, 225) | ~72×2 | - | 蓝色高亮 |
        // | 短轴 (右) | line | (600, 175)-(600, 275) | 2×100 | - | 虚线，灰色 |
        // | 焦点 F₁ | circle | (640, 225) | 4×4 | - | 右侧焦点 |
        // | 焦点 F₂ | circle | (560, 225) | 4×4 | - | 左侧焦点 |
        
        // 状态变量
        let currentStep = 0;
        const totalSteps = 5;
        
        // DOM 元素引用
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepTitle = document.getElementById('scene1-step-title');
        const conclusionBox = document.getElementById('scene1-conclusion');
        const conclusionText = document.getElementById('scene1-conclusion-text');
        const poLeft = document.getElementById('scene1-po-left');
        const poLabel = document.getElementById('scene1-po-label');
        const shortAxis = document.getElementById('scene1-short-axis');
        const bLabel = document.getElementById('scene1-b-label');
        const f1 = document.getElementById('scene1-f1');
        const f2 = document.getElementById('scene1-f2');
        const f1Label = document.getElementById('scene1-f1-label');
        const f2Label = document.getElementById('scene1-f2-label');
        
        // 步骤配置
        const stepConfig = [
            {
                title: "圆与椭圆的切线性质类比",
                conclusion: "",
                showPO: false,
                showShortAxis: false,
                showFoci: false,
                showConclusionBox: false,
                poColor: "normal",
                shortAxisColor: "normal"
            },
            {
                title: "圆的情况：PC·PD = PO²",
                conclusion: "已知：PC·PD = PO²",
                showPO: true,
                showShortAxis: false,
                showFoci: false,
                showConclusionBox: true,
                poColor: "blue",
                shortAxisColor: "normal"
            },
            {
                title: "椭圆的情况：求 PC·PD",
                conclusion: "类比问题：PC·PD = ?",
                showPO: true,
                showShortAxis: true,
                showFoci: true,
                showConclusionBox: true,
                poColor: "blue",
                shortAxisColor: "normal"
            },
            {
                title: "类比对应：半径 PO ↔ 半短轴 b",
                conclusion: "类比对应：PO ↔ b",
                showPO: true,
                showShortAxis: true,
                showFoci: true,
                showConclusionBox: true,
                poColor: "red",
                shortAxisColor: "red"
            },
            {
                title: "结论：PC·PD = b²",
                conclusion: "PC·PD = b²",
                showPO: true,
                showShortAxis: true,
                showFoci: true,
                showConclusionBox: true,
                poColor: "blue",
                shortAxisColor: "blue"
            }
        ];
        
        // 工具函数：显示元素
        function show(el) {
            if (!el) return;
            el.classList.remove('scene1-hidden');
            el.classList.add('visible');
        }
        
        // 工具函数：隐藏元素
        function hide(el) {
            if (!el) return;
            el.classList.remove('visible');
            el.classList.add('scene1-hidden');
        }
        
        // 更新显示状态
        function updateDisplay() {
            const config = stepConfig[currentStep];
            
            // 更新步骤标题
            stepTitle.textContent = config.title;
            
            // 更新结论框
            if (config.showConclusionBox) {
                show(conclusionBox);
                conclusionText.textContent = config.conclusion;
            } else {
                hide(conclusionBox);
            }
            
            // 更新半径 PO
            if (config.showPO) {
                show(poLeft);
                show(poLabel);
                if (config.poColor === 'red') {
                    poLeft.classList.add('scene1-highlight-red');
                    poLeft.classList.remove('scene1-highlight-blue');
                } else if (config.poColor === 'blue') {
                    poLeft.classList.add('scene1-highlight-blue');
                    poLeft.classList.remove('scene1-highlight-red');
                }
            } else {
                hide(poLeft);
                hide(poLabel);
            }
            
            // 更新短轴
            if (config.showShortAxis) {
                show(shortAxis);
                show(bLabel);
                if (config.shortAxisColor === 'red') {
                    shortAxis.classList.add('scene1-highlight-red');
                } else if (config.shortAxisColor === 'blue') {
                    shortAxis.classList.remove('scene1-highlight-red');
                }
            } else {
                hide(shortAxis);
                hide(bLabel);
            }
            
            // 更新焦点
            if (config.showFoci) {
                show(f1);
                show(f2);
                show(f1Label);
                show(f2Label);
            } else {
                hide(f1);
                hide(f2);
                hide(f1Label);
                hide(f2Label);
            }
            
            // 更新按钮状态
            if (currentStep === 0) {
                btnPrev.classList.remove('scene1-btn-enabled');
                btnPrev.classList.add('scene1-btn-disabled');
            } else {
                btnPrev.classList.remove('scene1-btn-disabled');
                btnPrev.classList.add('scene1-btn-enabled');
            }
            
            if (currentStep === totalSteps - 1) {
                btnNext.classList.remove('scene1-btn-enabled');
                btnNext.classList.add('scene1-btn-disabled');
            } else {
                btnNext.classList.remove('scene1-btn-disabled');
                btnNext.classList.add('scene1-btn-enabled');
            }
        }
        
        // 事件绑定
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        });
        
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateDisplay();
            }
        });
        
        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
