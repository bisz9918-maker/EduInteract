<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 3 - 体积变化与异面直线关系</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene3-slider { width: 600px; height: 20px; }
        .control-label { font-size: 14px; color: #333; }
        .value-display { font-size: 14px; color: #c62828; font-weight: bold; min-width: 50px; text-align: right; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg id="scene3-svg" width="800" height="500">
            <!-- 定义 -->
            <defs>
                <linearGradient id="scene3-baseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#1565c0;stop-opacity:0.25" />
                    <stop offset="100%" style="stop-color:#1565c0;stop-opacity:0.15" />
                </linearGradient>
            </defs>

            <!-- 体积曲线区域 (右上) -->
            <g id="scene3-volume-chart">
                <!-- 坐标轴 -->
                <line x1="470" y1="180" x2="730" y2="180" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
                <line x1="470" y1="60" x2="470" y2="180" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
                <!-- 轴标签 -->
                <text x="600" y="205" font-size="14" fill="#666" text-anchor="middle">θ(°)</text>
                <text x="455" y="120" font-size="14" fill="#666" text-anchor="middle" transform="rotate(-90, 455, 120)">V</text>
                <!-- 体积曲线 -->
                <path id="scene3-volume-curve" fill="none" stroke="#1565c0" stroke-width="2"/>
                <!-- 最大值点 -->
                <circle id="scene3-max-point" cx="0" cy="0" r="6" fill="#c62828" opacity="0"/>
                <text id="scene3-max-label" x="0" y="0" font-size="12" fill="#c62828" opacity="0">V_max</text>
                <!-- 体积数值显示 (移到曲线图上方) -->
                <text id="scene3-volume-value" x="600" y="50" font-size="13" fill="#c62828" text-anchor="middle">V = 0.00</text>
            </g>

            <!-- 异面直线夹角区域 (右下) -->
            <g id="scene3-angle-chart">
                <!-- 异面直线 A'E 示意 (绿色) -->
                <line id="scene3-line-ae" x1="480" y1="280" x2="550" y2="320" stroke="#2e7d32" stroke-width="3"/>
                <text x="555" y="330" font-size="12" fill="#2e7d32">A'E</text>
                <!-- 异面直线 BD 示意 (橙色) -->
                <line id="scene3-line-bd" x1="620" y1="280" x2="690" y2="320" stroke="#f57c00" stroke-width="3"/>
                <text x="695" y="330" font-size="12" fill="#f57c00">BD</text>
                <!-- 夹角弧线 -->
                <path id="scene3-angle-arc" d="" fill="none" stroke="#333" stroke-width="2"/>
                <!-- φ数值标签 (移到下方) -->
                <text id="scene3-angle-phi" x="600" y="350" font-size="16" fill="#c62828" text-anchor="middle" font-weight="bold">φ = 60°</text>
                <!-- 垂直标记 (直角符号) -->
                <g id="scene3-perp-mark" opacity="0">
                    <line x1="585" y1="285" x2="585" y2="300" stroke="#c62828" stroke-width="2"/>
                    <line x1="585" y1="300" x2="600" y2="300" stroke="#c62828" stroke-width="2"/>
                    <text x="570" y="280" font-size="12" fill="#c62828" font-weight="bold">⊥</text>
                </g>
            </g>

            <!-- 三棱锥立体图区域 (左侧) -->
            <g id="scene3-pyramid">
                <!-- 底面 FED (半透明蓝色) -->
                <polygon id="scene3-base" points="150,280 320,280 235,220" fill="url(#scene3-baseGradient)" stroke="#1565c0" stroke-width="2"/>
                <!-- 底边 -->
                <line x1="150" y1="280" x2="320" y2="280" stroke="#000" stroke-width="2"/>
                <line x1="320" y1="280" x2="235" y2="220" stroke="#000" stroke-width="2"/>
                <line x1="235" y1="220" x2="150" y2="280" stroke="#000" stroke-width="2"/>
                <!-- 棱 A'F -->
                <line id="scene3-edge-af" x1="235" y1="120" x2="150" y2="280" stroke="#000" stroke-width="2"/>
                <!-- 棱 A'E (绿色高亮) -->
                <line id="scene3-edge-ae" x1="235" y1="120" x2="320" y2="280" stroke="#2e7d32" stroke-width="2"/>
                <!-- 棱 A'D (虚线，被遮挡) -->
                <line id="scene3-edge-ad" x1="235" y1="120" x2="235" y2="220" stroke="#000" stroke-width="2" stroke-dasharray="4,4"/>
                <!-- 高 h (红色) -->
                <line id="scene3-height" x1="235" y1="120" x2="235" y2="250" stroke="#c62828" stroke-width="2" stroke-dasharray="4,4"/>
                <!-- 顶点 A' (红色圆点) -->
                <circle id="scene3-vertex" cx="235" cy="120" r="6" fill="#c62828"/>
                <!-- 标签 (调整位置避免重叠) -->
                <text id="scene3-label-a" x="235" y="100" font-size="14" fill="#c62828" text-anchor="middle" font-weight="bold">A'</text>
                <text id="scene3-label-f" x="130" y="290" font-size="13" fill="#000" text-anchor="middle">F</text>
                <text id="scene3-label-e" x="335" y="290" font-size="13" fill="#000" text-anchor="middle">E</text>
                <text id="scene3-label-d" x="220" y="210" font-size="13" fill="#000" text-anchor="middle">D</text>
                <text id="scene3-label-h" x="250" y="180" font-size="13" fill="#c62828">h</text>
            </g>

            <!-- 滑块控件区域 -->
            <g id="scene3-controls-svg">
                <text x="100" y="430" font-size="14" fill="#333">旋转角度 θ：</text>
                <text id="scene3-angle-value" x="700" y="430" font-size="14" fill="#c62828" font-weight="bold" text-anchor="end">0°</text>
            </g>
        </svg>

        <!-- HTML 滑块控件 -->
        <div id="scene3-controls">
            <input type="range" id="scene3-slider" min="0" max="180" value="0" step="1">
        </div>
    </div>

    <script>
    (function() {
        // Scene 3 实现 - 体积变化与异面直线关系
        // 布局坐标表（参考）：
        // 三棱锥区域：x=50~400, y=50~380
        // 底面 FED：F(150,280), E(320,280), D(235,220)
        // 顶点 A'：(235,120) 随θ变化
        // 体积曲线区域：x=450~750, y=50~200
        // 夹角显示区域：x=450~750, y=220~380
        // 滑块控件：x=100~700, y=440

        // 核心几何参数（设正三角形边长 a=2）
        const a = 2;
        const sqrt3 = Math.sqrt(3);
        
        // 原始坐标（平面 ABC，z=0）
        const A = { x: 0, y: 0, z: 0 };
        const B = { x: -1, y: -sqrt3, z: 0 };
        const C = { x: 1, y: -sqrt3, z: 0 };
        const F = { x: 0, y: -sqrt3, z: 0 };  // BC 中点
        const D = { x: -0.5, y: -sqrt3/2, z: 0 };  // AB 中点
        const E = { x: 0.5, y: -sqrt3/2, z: 0 };  // AC 中点
        const G = { x: 0, y: -sqrt3/2, z: 0 };  // DE 中点，AF 与 DE 交点

        // 底面 FED 面积（定值）
        // FE = 1, D 到 FE 的距离 = sqrt3/2
        const S_FED = 0.5 * 1 * (sqrt3 / 2);

        // SVG 元素引用
        const svg = document.getElementById('scene3-svg');
        const slider = document.getElementById('scene3-slider');
        const angleValue = document.getElementById('scene3-angle-value');
        const volumeValue = document.getElementById('scene3-volume-value');
        const anglePhi = document.getElementById('scene3-angle-phi');
        const vertex = document.getElementById('scene3-vertex');
        const edgeAF = document.getElementById('scene3-edge-af');
        const edgeAE = document.getElementById('scene3-edge-ae');
        const edgeAD = document.getElementById('scene3-edge-ad');
        const height = document.getElementById('scene3-height');
        const volumeCurve = document.getElementById('scene3-volume-curve');
        const maxPoint = document.getElementById('scene3-max-point');
        const maxLabel = document.getElementById('scene3-max-label');
        const angleArc = document.getElementById('scene3-angle-arc');
        const perpMark = document.getElementById('scene3-perp-mark');
        const lineAE = document.getElementById('scene3-line-ae');
        const lineBD = document.getElementById('scene3-line-bd');

        // 状态变量
        let theta = 0;  // 旋转角度（度）
        let volumeHistory = [];  // 体积历史数据
        let maxVolume = 0;
        let maxVolumeTheta = 0;

        // 3D 坐标转 2D 投影（简单透视）
        function project3D(point) {
            // 绕 DE 轴旋转后的 3D 坐标投影到 2D
            // DE 轴方向：从 D(-0.5, -sqrt3/2, 0) 到 E(0.5, -sqrt3/2, 0)
            // 旋转中心 G(0, -sqrt3/2, 0)
            // A 点绕 DE 旋转θ角

            const thetaRad = theta * Math.PI / 180;
            
            // A 相对于 G 的向量
            const AGx = A.x - G.x;  // 0
            const AGy = A.y - G.y;  // sqrt3/2
            const AGz = A.z - G.z;  // 0

            // 绕 DE 轴（x 轴方向）旋转
            // 旋转后 A'的坐标
            const AprimeX = G.x + AGx;
            const AprimeY = G.y + AGy * Math.cos(thetaRad);
            const AprimeZ = AGy * Math.sin(thetaRad);

            // 简单透视投影（忽略 z 对 x 的影响，只影响 y 的视觉深度）
            const scale = 1 - AprimeZ * 0.1;  // z 越大，看起来越小
            return {
                x: AprimeX * 200 + 235,  // 缩放并平移
                y: AprimeY * 100 + 280,
                z: AprimeZ,
                scale: scale
            };
        }

        // 计算高 h（A'到平面 FED 的距离）
        function calcHeight(Aprime) {
            // 平面 FED 即平面 ABC，z=0
            // 高 h = |A'的 z 坐标|
            return Math.abs(Aprime.z);
        }

        // 计算体积 V = (1/3) × S_FED × h
        function calcVolume(h) {
            return (1/3) * S_FED * h;
        }

        // 计算异面直线 A'E 与 BD 的夹角
        function calcAnglePhi(Aprime) {
            // 向量 A'E
            const v1 = {
                x: E.x - Aprime.x / 200,  // 反投影
                y: E.y - 280 / 100,
                z: -Aprime.z
            };
            // 向量 BD
            const v2 = {
                x: D.x - B.x,
                y: D.y - B.y,
                z: D.z - B.z
            };

            // 计算夹角
            const dot = v1.x * v2.x + v1.y * v2.y + v1.z * v2.z;
            const mag1 = Math.sqrt(v1.x * v1.x + v1.y * v1.y + v1.z * v1.z);
            const mag2 = Math.sqrt(v2.x * v2.x + v2.y * v2.y + v2.z * v2.z);
            
            if (mag1 === 0 || mag2 === 0) return 60;  // 默认值
            
            const cosPhi = Math.abs(dot) / (mag1 * mag2);
            const phi = Math.acos(Math.max(-1, Math.min(1, cosPhi))) * 180 / Math.PI;
            return phi;
        }

        // 更新三棱锥显示
        function updatePyramid(Aprime) {
            // 更新顶点位置
            vertex.setAttribute('cx', Aprime.x);
            vertex.setAttribute('cy', Aprime.y);
            
            // 更新棱
            edgeAF.setAttribute('x1', Aprime.x);
            edgeAF.setAttribute('y1', Aprime.y);
            edgeAF.setAttribute('x2', 150);
            edgeAF.setAttribute('y2', 280);
            
            edgeAE.setAttribute('x1', Aprime.x);
            edgeAE.setAttribute('y1', Aprime.y);
            edgeAE.setAttribute('x2', 320);
            edgeAE.setAttribute('y2', 280);
            
            edgeAD.setAttribute('x1', Aprime.x);
            edgeAD.setAttribute('y1', Aprime.y);
            edgeAD.setAttribute('x2', 235);
            edgeAD.setAttribute('y2', 220);
            
            // 更新高
            height.setAttribute('x1', Aprime.x);
            height.setAttribute('y1', Aprime.y);
            height.setAttribute('x2', Aprime.x);
            height.setAttribute('y2', 250);
            
            // 更新标签位置
            document.getElementById('scene3-label-a').setAttribute('x', Aprime.x);
            document.getElementById('scene3-label-a').setAttribute('y', Aprime.y - 20);
        }

        // 更新体积曲线
        function updateVolumeCurve() {
            // 添加当前点到历史
            volumeHistory.push({ theta: theta, volume: calcVolume(calcHeight(project3D(A))) });
            
            // 限制历史数据长度
            if (volumeHistory.length > 181) {
                volumeHistory.shift();
            }
            
            // 查找最大值
            maxVolume = 0;
            maxVolumeTheta = 0;
            volumeHistory.forEach(p => {
                if (p.volume > maxVolume) {
                    maxVolume = p.volume;
                    maxVolumeTheta = p.theta;
                }
            });
            
            // 绘制曲线
            let pathD = '';
            volumeHistory.forEach((p, i) => {
                const x = 470 + (p.theta / 180) * 260;
                const y = 180 - (p.volume / (maxVolume || 0.1)) * 100;
                if (i === 0) {
                    pathD += `M ${x} ${y}`;
                } else {
                    pathD += ` L ${x} ${y}`;
                }
            });
            volumeCurve.setAttribute('d', pathD);
            
            // 更新最大值点
            if (maxVolume > 0) {
                const mx = 470 + (maxVolumeTheta / 180) * 260;
                const my = 180 - (maxVolume / (maxVolume || 0.1)) * 100;
                maxPoint.setAttribute('cx', mx);
                maxPoint.setAttribute('cy', my);
                maxPoint.setAttribute('opacity', '1');
                maxLabel.setAttribute('x', mx + 10);
                maxLabel.setAttribute('y', my - 10);
                maxLabel.setAttribute('opacity', '1');
            }
        }

        // 更新夹角显示
        function updateAngleDisplay(phi) {
            anglePhi.textContent = `φ = ${phi.toFixed(1)}°`;
            
            // 更新夹角弧线
            const centerX = 600;
            const centerY = 300;
            const radius = 30;
            const startAngle = -30 * Math.PI / 180;
            const endAngle = (phi - 30) * Math.PI / 180;
            
            const x1 = centerX + radius * Math.cos(startAngle);
            const y1 = centerY + radius * Math.sin(startAngle);
            const x2 = centerX + radius * Math.cos(endAngle);
            const y2 = centerY + radius * Math.sin(endAngle);
            
            const largeArc = phi > 180 ? 1 : 0;
            const arcD = `M ${centerX} ${centerY} L ${x1} ${y1} A ${radius} ${radius} 0 ${largeArc} 1 ${x2} ${y2} Z`;
            angleArc.setAttribute('d', arcD);
            
            // 检查是否垂直
            if (Math.abs(phi - 90) < 2) {
                perpMark.setAttribute('opacity', '1');
                anglePhi.setAttribute('y', '330');  // 上移避免重叠
            } else {
                perpMark.setAttribute('opacity', '0');
                anglePhi.setAttribute('y', '350');
            }
        }

        // 主更新函数
        function update() {
            const Aprime = project3D(A);
            const h = calcHeight(Aprime);
            const V = calcVolume(h);
            const phi = calcAnglePhi(Aprime);
            
            // 更新显示
            updatePyramid(Aprime);
            updateVolumeCurve();
            updateAngleDisplay(phi);
            
            // 更新数值显示
            angleValue.textContent = `${theta}°`;
            volumeValue.textContent = `V = ${V.toFixed(3)}`;
        }

        // 事件监听
        slider.addEventListener('input', function() {
            theta = parseInt(this.value);
            volumeHistory = [];  // 重置历史
            update();
        });

        // 初始化
        volumeHistory = [];
        update();
    })();
    </script>
</body>
</html>
