<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 1 - 正三角形绕中位线旋转</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Microsoft YaHei', sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 0 50px; z-index: 10; pointer-events: none; }
        #scene1-controls > * { pointer-events: auto; }
        .scene1-btn { padding: 8px 20px; border: none; border-radius: 4px; font-size: 14px; cursor: pointer; transition: all 0.3s; }
        #scene1-btn-prev { background: #9e9e9e; color: white; }
        #scene1-btn-prev:hover:not(:disabled) { background: #757575; }
        #scene1-btn-prev:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-btn-next { background: #1565c0; color: white; }
        #scene1-btn-next:hover:not(:disabled) { background: #0d47a1; }
        #scene1-step-indicator { background: #f5f5f5; padding: 8px 16px; border-radius: 4px; font-size: 14px; color: #333; }
        svg { display: block; }
        .scene1-text { font-size: 14px; font-family: 'Microsoft YaHei', sans-serif; }
        .scene1-text-large { font-size: 16px; font-weight: bold; }
        .scene1-line { stroke-width: 2px; fill: none; }
        .scene1-point { stroke: #000; stroke-width: 1px; }
        .scene1-highlight { transition: all 0.5s ease; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene1-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#000" />
                </marker>
            </defs>

            <!-- 步骤 0: 正三角形 ABC -->
            <g id="scene1-group-step0">
                <!-- 三角形边 -->
                <line id="scene1-line-ab" class="scene1-line" x1="150" y1="200" x2="400" y2="80" stroke="#000000" />
                <line id="scene1-line-bc" class="scene1-line" x1="150" y1="200" x2="650" y2="200" stroke="#000000" />
                <line id="scene1-line-ac" class="scene1-line" x1="400" y1="80" x2="650" y2="200" stroke="#000000" />
                
                <!-- 顶点 -->
                <circle id="scene1-point-a" class="scene1-point" cx="400" cy="80" r="4" fill="#000000" />
                <circle id="scene1-point-b" class="scene1-point" cx="150" cy="200" r="4" fill="#000000" />
                <circle id="scene1-point-c" class="scene1-point" cx="650" cy="200" r="4" fill="#000000" />
                
                <!-- 标签 - 调整位置避免与线段重叠 -->
                <text id="scene1-label-a" class="scene1-text-large" x="400" y="60" text-anchor="middle" fill="#000000">A</text>
                <text id="scene1-label-b" class="scene1-text-large" x="125" y="200" text-anchor="end" fill="#000000">B</text>
                <text id="scene1-label-c" class="scene1-text-large" x="675" y="200" text-anchor="start" fill="#000000">C</text>
                
                <!-- 边长标注 - 移到 AB 边左侧外侧 -->
                <text id="scene1-label-a-side" class="scene1-text" x="220" y="135" text-anchor="middle" fill="#000000">a</text>
            </g>

            <!-- 步骤 1: 中线 AF -->
            <g id="scene1-group-step1" style="display: none;">
                <line id="scene1-line-af" class="scene1-line scene1-highlight" x1="400" y1="80" x2="400" y2="200" stroke="#000000" />
                <circle id="scene1-point-f" class="scene1-point" cx="400" cy="200" r="4" fill="#000000" />
                <text id="scene1-label-f" class="scene1-text-large" x="400" y="225" text-anchor="middle" fill="#000000">F</text>
            </g>

            <!-- 步骤 2: 中位线 DE -->
            <g id="scene1-group-step2" style="display: none;">
                <line id="scene1-line-de" class="scene1-line scene1-highlight" x1="275" y1="140" x2="525" y2="140" stroke="#000000" />
                <circle id="scene1-point-d" class="scene1-point" cx="275" cy="140" r="4" fill="#000000" />
                <circle id="scene1-point-e" class="scene1-point" cx="525" cy="140" r="4" fill="#000000" />
                <!-- 标签 D、E 移到线段上方，避免与线段重叠 -->
                <text id="scene1-label-d" class="scene1-text-large" x="275" y="115" text-anchor="middle" fill="#000000">D</text>
                <text id="scene1-label-e" class="scene1-text-large" x="525" y="115" text-anchor="middle" fill="#000000">E</text>
            </g>

            <!-- 步骤 3: 交点 G -->
            <g id="scene1-group-step3" style="display: none;">
                <circle id="scene1-point-g" cx="400" cy="140" r="4" fill="#2e7d32" stroke="#000" stroke-width="1px" />
                <!-- 标签 G 移到右侧更远位置 -->
                <text id="scene1-label-g" class="scene1-text" x="420" y="145" text-anchor="start" fill="#2e7d32">G</text>
                <!-- 说明文字移到更右侧 -->
                <text id="scene1-label-g-note" class="scene1-text" x="440" y="145" text-anchor="start" fill="#333">G 是 AF 中点</text>
            </g>

            <!-- 步骤 4: 高亮三角形 AED -->
            <g id="scene1-group-step4" style="display: none;">
                <polygon id="scene1-fill-aed" points="400,80 275,140 525,140" fill="#1565c0" opacity="0.2" />
            </g>

            <!-- 步骤 5: 旋转后的三角形 A'ED -->
            <g id="scene1-group-step5" style="display: none;">
                <circle id="scene1-point-a-prime" class="scene1-point" cx="400" cy="40" r="4" fill="#c62828" stroke="#000" stroke-width="1px" />
                <line id="scene1-line-a-prime-d" class="scene1-line" x1="400" y1="40" x2="275" y2="140" stroke="#c62828" />
                <line id="scene1-line-a-prime-e" class="scene1-line" x1="400" y1="40" x2="525" y2="140" stroke="#c62828" />
                <!-- 标签 A' 移到右侧更远 -->
                <text id="scene1-label-a-prime" class="scene1-text-large" x="420" y="45" text-anchor="start" fill="#c62828">A'</text>
                <!-- DE 变为红色强调旋转轴 -->
                <line id="scene1-line-de-rotated" class="scene1-line" x1="275" y1="140" x2="525" y2="140" stroke="#c62828" />
                <!-- DE 标签移到更上方 -->
                <text id="scene1-label-de-axis" class="scene1-text" x="400" y="105" text-anchor="middle" fill="#c62828">DE</text>
            </g>

            <!-- 步骤 6: 旋转轨迹 -->
            <g id="scene1-group-step6" style="display: none;">
                <!-- 圆弧轨迹：从 A(400,80) 到 A'(400,40)，圆心 G(400,140)，半径 100 -->
                <path id="scene1-arc-trajectory" d="M 400,80 A 100,100 0 0,1 400,40" stroke="#888888" stroke-width="2" fill="none" stroke-dasharray="5,5" />
            </g>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn">◀ 上一步</button>
            <div id="scene1-step-indicator">步骤 1/6</div>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        // 布局坐标表对照（已调整避免重叠）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // | 三角形边 AB | 线段 | (150,200)-(400,80) | - | - | 实线，线宽 2px |
        // | 三角形边 BC | 线段 | (150,200)-(650,200) | - | - | 实线，线宽 2px |
        // | 三角形边 AC | 线段 | (400,80)-(650,200) | - | - | 实线，线宽 2px |
        // | 中线 AF | 线段 | (400,80)-(400,200) | - | - | 实线，线宽 2px |
        // | 中位线 DE | 线段 | (275,140)-(525,140) | - | - | 实线，线宽 2px |
        // | 交点 G | 圆点 | (400,140) | 4px 直径 | - | 绿色填充 |
        // | 顶点 A | 圆点 | (400,80) | 4px 直径 | - | 黑色填充 |
        // | 顶点 B | 圆点 | (150,200) | 4px 直径 | - | 黑色填充 |
        // | 顶点 C | 圆点 | (650,200) | 4px 直径 | - | 黑色填充 |
        // | 中点 D | 圆点 | (275,140) | 4px 直径 | - | 黑色填充 |
        // | 中点 E | 圆点 | (525,140) | 4px 直径 | - | 黑色填充 |
        // | 中点 F | 圆点 | (400,200) | 4px 直径 | - | 黑色填充 |
        // | 旋转后 A' | 圆点 | (400,40) | 4px 直径 | - | 红色填充 |

        const TOTAL_STEPS = 6;
        let currentStep = 0;

        // 工具函数：显示元素
        function show(el) {
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }

        // 工具函数：隐藏元素
        function hide(el) {
            if (el) {
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }

        // 高亮效果：蓝色闪烁
        function highlightBlue(elementId) {
            const el = document.getElementById(elementId);
            if (el) {
                el.style.stroke = '#1565c0';
                setTimeout(() => {
                    el.style.stroke = '#000000';
                }, 500);
            }
        }

        // 更新步骤显示
        function updateStepDisplay() {
            // 隐藏所有步骤组
            for (let i = 1; i <= TOTAL_STEPS; i++) {
                hide(document.getElementById(`scene1-group-step${i}`));
            }

            // 显示当前步骤及之前的所有步骤
            for (let i = 1; i <= currentStep; i++) {
                show(document.getElementById(`scene1-group-step${i}`));
            }

            // 特殊处理：步骤 5 时，隐藏原始的 DE 线，显示红色的 DE 轴
            const deLine = document.getElementById('scene1-line-de');
            const deRotated = document.getElementById('scene1-line-de-rotated');
            if (currentStep >= 5) {
                if (deLine) deLine.style.display = 'none';
                if (deRotated) deRotated.style.display = 'block';
            } else if (currentStep >= 2) {
                if (deLine) deLine.style.display = 'block';
                if (deRotated) deRotated.style.display = 'none';
            }

            // 更新按钮状态
            const prevBtn = document.getElementById('scene1-btn-prev');
            const nextBtn = document.getElementById('scene1-btn-next');
            prevBtn.disabled = currentStep === 0;
            nextBtn.textContent = currentStep === TOTAL_STEPS ? '完成' : '下一步 ▶';
            nextBtn.disabled = false;

            // 更新步骤指示器
            document.getElementById('scene1-step-indicator').textContent = `步骤 ${currentStep + 1}/${TOTAL_STEPS}`;

            // 执行步骤特定动画
            executeStepAnimation(currentStep);
        }

        // 执行步骤特定动画
        function executeStepAnimation(step) {
            switch(step) {
                case 1:
                    // 高亮中线 AF
                    highlightBlue('scene1-line-af');
                    break;
                case 2:
                    // 高亮中位线 DE
                    highlightBlue('scene1-line-de');
                    break;
                case 4:
                    // 三角形 AED 淡入效果
                    const fill = document.getElementById('scene1-fill-aed');
                    if (fill) {
                        fill.style.opacity = '0';
                        setTimeout(() => {
                            fill.style.transition = 'opacity 0.5s';
                            fill.style.opacity = '0.2';
                        }, 50);
                    }
                    break;
                case 5:
                    // 旋转后的三角形淡入
                    const aPrime = document.getElementById('scene1-point-a-prime');
                    const aPrimeD = document.getElementById('scene1-line-a-prime-d');
                    const aPrimeE = document.getElementById('scene1-line-a-prime-e');
                    if (aPrime) { aPrime.style.opacity = '0'; aPrime.style.transition = 'opacity 0.5s'; }
                    if (aPrimeD) { aPrimeD.style.opacity = '0'; aPrimeD.style.transition = 'opacity 0.5s'; }
                    if (aPrimeE) { aPrimeE.style.opacity = '0'; aPrimeE.style.transition = 'opacity 0.5s'; }
                    setTimeout(() => {
                        if (aPrime) aPrime.style.opacity = '1';
                        if (aPrimeD) aPrimeD.style.opacity = '1';
                        if (aPrimeE) aPrimeE.style.opacity = '1';
                    }, 50);
                    break;
                case 6:
                    // 轨迹圆弧淡入
                    const arc = document.getElementById('scene1-arc-trajectory');
                    if (arc) {
                        arc.style.opacity = '0';
                        setTimeout(() => {
                            arc.style.transition = 'opacity 0.5s';
                            arc.style.opacity = '1';
                        }, 50);
                    }
                    break;
            }
        }

        // 下一步按钮点击
        function nextStep() {
            if (currentStep < TOTAL_STEPS) {
                currentStep++;
                updateStepDisplay();
            }
        }

        // 上一步按钮点击
        function prevStep() {
            if (currentStep > 0) {
                currentStep--;
                updateStepDisplay();
            }
        }

        // 初始化
        function init() {
            document.getElementById('scene1-btn-next').addEventListener('click', nextStep);
            document.getElementById('scene1-btn-prev').addEventListener('click', prevStep);
            updateStepDisplay();
        }

        // 页面加载完成后初始化
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>
</body>
</html>
