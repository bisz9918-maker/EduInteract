<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 椭圆几何性质验证</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene2-btn { padding: 8px 20px; font-size: 14px; border: 2px solid #333; border-radius: 6px; background: #f5f5f5; cursor: pointer; transition: all 0.3s; }
        .scene2-btn:hover { background: #e0e0e0; }
        .scene2-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .scene2-btn.active { background: #1565c0; color: white; border-color: #1565c0; }
        .scene2-conclusion-btn { background: #2e7d32; color: white; border-color: #2e7d32; }
        .scene2-conclusion-btn:hover { background: #1b5e20; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" id="scene2-svg">
            <!-- 坐标轴 -->
            <line x1="100" y1="250" x2="750" y2="250" stroke="#000" stroke-width="1" id="scene2-axis-x"/>
            <line x1="400" y1="50" x2="400" y2="450" stroke="#000" stroke-width="1" id="scene2-axis-y"/>
            <!-- 坐标轴箭头 -->
            <polygon points="750,250 740,245 740,255" fill="#000" id="scene2-arrow-x"/>
            <polygon points="400,50 395,60 405,60" fill="#000" id="scene2-arrow-y"/>
            
            <!-- 椭圆 -->
            <ellipse cx="400" cy="250" rx="200" ry="100" fill="rgba(0,0,0,0.05)" stroke="#000" stroke-width="2" id="scene2-ellipse"/>
            
            <!-- 切线 l -->
            <line x1="600" y1="80" x2="600" y2="420" stroke="#888" stroke-width="2" stroke-dasharray="5,5" id="scene2-tangent-l"/>
            
            <!-- 线段 -->
            <line x1="200" y1="250" x2="480" y2="180" stroke="#000" stroke-width="1" id="scene2-line-ap"/>
            <line x1="480" y1="180" x2="520" y2="250" stroke="#000" stroke-width="1" id="scene2-line-pf"/>
            <line x1="520" y1="250" x2="600" y2="200" stroke="#1565c0" stroke-width="2" id="scene2-line-fm"/>
            <line x1="480" y1="180" x2="600" y2="200" stroke="#2e7d32" stroke-width="2" id="scene2-line-pm"/>
            <line x1="600" y1="250" x2="600" y2="150" stroke="#000" stroke-width="1" id="scene2-line-bd"/>
            
            <!-- 角度弧（步骤 1 显示） -->
            <path d="M 548.28,231.72 A 30,30 0 0,1 551.72,218.28" fill="none" stroke="#1565c0" stroke-width="1.5" opacity="0" id="scene2-arc-pfm"/>
            <path d="M 551.72,218.28 A 40,40 0 0,1 560,210" fill="none" stroke="#1565c0" stroke-width="1.5" opacity="0" id="scene2-arc-mfb"/>
            
            <!-- 角度弧（步骤 3 显示） -->
            <path d="M 501.21,191.21 A 30,30 0 0,1 508.79,198.79" fill="none" stroke="#1565c0" stroke-width="1.5" opacity="0" id="scene2-arc-fpm"/>
            <path d="M 508.79,198.79 A 40,40 0 0,1 518.28,208.28" fill="none" stroke="#1565c0" stroke-width="1.5" opacity="0" id="scene2-arc-mpd"/>
            
            <!-- 点 -->
            <circle cx="200" cy="250" r="5" fill="#000" id="scene2-point-a"/>
            <circle cx="600" cy="250" r="5" fill="#000" id="scene2-point-b"/>
            <circle cx="400" cy="250" r="5" fill="#000" id="scene2-point-o"/>
            <circle cx="520" cy="250" r="5" fill="#000" id="scene2-point-f"/>
            <circle cx="480" cy="180" r="6" fill="#1565c0" id="scene2-point-p"/>
            <circle cx="600" cy="150" r="5" fill="#c62828" id="scene2-point-d"/>
            <circle cx="600" cy="200" r="5" fill="#2e7d32" id="scene2-point-m"/>
            
            <!-- 标签 -->
            <text x="185" y="265" font-size="16" fill="#000" id="scene2-label-a">A</text>
            <text x="605" y="265" font-size="16" fill="#000" id="scene2-label-b">B</text>
            <text x="385" y="265" font-size="16" fill="#000" id="scene2-label-o">O</text>
            <text x="515" y="270" font-size="16" fill="#000" id="scene2-label-f">F</text>
            <text x="485" y="165" font-size="16" fill="#1565c0" id="scene2-label-p">P</text>
            <text x="605" y="135" font-size="16" fill="#c62828" id="scene2-label-d">D</text>
            <text x="615" y="200" font-size="16" fill="#2e7d32" id="scene2-label-m">M</text>
            <text x="610" y="430" font-size="16" fill="#888" id="scene2-label-l">l</text>
            <text x="755" y="245" font-size="16" fill="#000" id="scene2-label-x">X</text>
            <text x="385" y="55" font-size="16" fill="#000" id="scene2-label-y">Y</text>
            
            <!-- 步骤 1 角度标注 -->
            <text x="555" y="225" font-size="12" fill="#1565c0" opacity="0" id="scene2-angle1-label">∠1</text>
            <text x="565" y="215" font-size="12" fill="#1565c0" opacity="0" id="scene2-angle2-label">∠2</text>
            
            <!-- 步骤 2 切线标记 -->
            <path d="M 475,185 L 485,185 L 485,175" fill="none" stroke="#2e7d32" stroke-width="1.5" opacity="0" id="scene2-tangent-mark"/>
            
            <!-- 步骤 3 角度标注 -->
            <text x="510" y="195" font-size="12" fill="#1565c0" opacity="0" id="scene2-angle3-label">∠3</text>
            <text x="520" y="205" font-size="12" fill="#1565c0" opacity="0" id="scene2-angle4-label">∠4</text>
            
            <!-- 步骤 4 长度标注 -->
            <text x="540" y="185" font-size="14" fill="#000" opacity="0" id="scene2-pm-length">PM</text>
            <text x="615" y="225" font-size="14" fill="#000" opacity="0" id="scene2-bm-length">BM</text>
            
            <!-- 结论汇总（步骤 5 显示） -->
            <text x="280" y="220" font-size="20" fill="#2e7d32" font-weight="bold" opacity="0" id="scene2-conclusion-text">正确结论：①②③</text>
        </svg>
        
        <div id="scene2-controls">
            <button class="scene2-btn" id="scene2-btn-prev" disabled>◀ 上一步</button>
            <button class="scene2-btn" id="scene2-btn-next">下一步 ▶</button>
            <button class="scene2-btn scene2-conclusion-btn" id="scene2-btn-conclusion" style="display: none;">结论</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现 - 椭圆几何性质验证
        // 坐标表对照：
        // 椭圆：中心 (400,250)，a=200,b=100
        // A(200,250), B(600,250), O(400,250), F(520,250)
        // P(480,180), D(600,150), M(600,200)
        
        const scene2 = {
            currentStep: 0,
            totalSteps: 5,
            
            // 元素引用
            elements: {
                // 线段
                ap: document.getElementById('scene2-line-ap'),
                pf: document.getElementById('scene2-line-pf'),
                fm: document.getElementById('scene2-line-fm'),
                pm: document.getElementById('scene2-line-pm'),
                bd: document.getElementById('scene2-line-bd'),
                tangentL: document.getElementById('scene2-tangent-l'),
                
                // 角度弧
                arcPfm: document.getElementById('scene2-arc-pfm'),
                arcMfb: document.getElementById('scene2-arc-mfb'),
                arcFpm: document.getElementById('scene2-arc-fpm'),
                arcMpd: document.getElementById('scene2-arc-mpd'),
                
                // 角度标注
                angle1Label: document.getElementById('scene2-angle1-label'),
                angle2Label: document.getElementById('scene2-angle2-label'),
                angle3Label: document.getElementById('scene2-angle3-label'),
                angle4Label: document.getElementById('scene2-angle4-label'),
                
                // 切线标记
                tangentMark: document.getElementById('scene2-tangent-mark'),
                
                // 长度标注
                pmLength: document.getElementById('scene2-pm-length'),
                bmLength: document.getElementById('scene2-bm-length'),
                
                // 结论文本
                conclusionText: document.getElementById('scene2-conclusion-text'),
                
                // 按钮
                prevBtn: document.getElementById('scene2-btn-prev'),
                nextBtn: document.getElementById('scene2-btn-next'),
                conclusionBtn: document.getElementById('scene2-btn-conclusion')
            },
            
            // 工具函数：显示元素
            show: function(el) {
                if (el) {
                    el.style.display = 'block';
                    el.style.opacity = '1';
                }
            },
            
            // 工具函数：隐藏元素
            hide: function(el) {
                if (el) {
                    el.style.opacity = '0';
                    setTimeout(() => {
                        if (el) el.style.display = 'none';
                    }, 300);
                }
            },
            
            // 工具函数：设置元素透明度
            setOpacity: function(el, opacity) {
                if (el) el.style.opacity = opacity;
            },
            
            // 更新场景显示
            updateScene: function() {
                const el = this.elements;
                
                // 重置所有元素到默认状态
                this.setOpacity(el.ap, 1);
                this.setOpacity(el.pf, 1);
                this.setOpacity(el.fm, 1);
                this.setOpacity(el.pm, 1);
                this.setOpacity(el.bd, 1);
                this.setOpacity(el.tangentL, 1);
                
                // 隐藏所有动态元素
                this.setOpacity(el.arcPfm, 0);
                this.setOpacity(el.arcMfb, 0);
                this.setOpacity(el.arcFpm, 0);
                this.setOpacity(el.arcMpd, 0);
                this.setOpacity(el.angle1Label, 0);
                this.setOpacity(el.angle2Label, 0);
                this.setOpacity(el.angle3Label, 0);
                this.setOpacity(el.angle4Label, 0);
                this.setOpacity(el.tangentMark, 0);
                this.setOpacity(el.pmLength, 0);
                this.setOpacity(el.bmLength, 0);
                this.setOpacity(el.conclusionText, 0);
                
                // 根据步骤更新显示
                switch(this.currentStep) {
                    case 0: // 初始状态
                        el.prevBtn.disabled = true;
                        el.nextBtn.disabled = false;
                        el.conclusionBtn.style.display = 'none';
                        break;
                        
                    case 1: // 验证结论①：FM 平分∠PFB
                        el.prevBtn.disabled = false;
                        el.nextBtn.disabled = false;
                        el.conclusionBtn.style.display = 'none';
                        
                        // 高亮 FM，降低其他元素透明度
                        this.setOpacity(el.ap, 0.5);
                        this.setOpacity(el.pf, 0.5);
                        this.setOpacity(el.pm, 0.5);
                        this.setOpacity(el.bd, 0.5);
                        
                        // 显示角度弧
                        this.setOpacity(el.arcPfm, 1);
                        this.setOpacity(el.arcMfb, 1);
                        this.setOpacity(el.angle1Label, 1);
                        this.setOpacity(el.angle2Label, 1);
                        break;
                        
                    case 2: // 验证结论②：PM 与椭圆相切
                        el.prevBtn.disabled = false;
                        el.nextBtn.disabled = false;
                        el.conclusionBtn.style.display = 'none';
                        
                        // 高亮 PM，降低其他元素透明度
                        this.setOpacity(el.ap, 0.5);
                        this.setOpacity(el.pf, 0.5);
                        this.setOpacity(el.fm, 0.5);
                        this.setOpacity(el.bd, 0.5);
                        
                        // 显示切线标记
                        this.setOpacity(el.tangentMark, 1);
                        break;
                        
                    case 3: // 验证结论③：PM 平分∠FPD
                        el.prevBtn.disabled = false;
                        el.nextBtn.disabled = false;
                        el.conclusionBtn.style.display = 'none';
                        
                        // 高亮 PM 和 PF，降低其他元素透明度
                        this.setOpacity(el.ap, 0.5);
                        this.setOpacity(el.fm, 0.5);
                        this.setOpacity(el.bd, 0.5);
                        
                        // 显示角度弧
                        this.setOpacity(el.arcFpm, 1);
                        this.setOpacity(el.arcMpd, 1);
                        this.setOpacity(el.angle3Label, 1);
                        this.setOpacity(el.angle4Label, 1);
                        break;
                        
                    case 4: // 验证结论④：PM=BM 的点 P 不存在
                        el.prevBtn.disabled = false;
                        el.nextBtn.disabled = false;
                        el.conclusionBtn.style.display = 'none';
                        
                        // 高亮 PM 和 BM，降低其他元素透明度
                        this.setOpacity(el.ap, 0.5);
                        this.setOpacity(el.pf, 0.5);
                        this.setOpacity(el.fm, 0.5);
                        
                        // 显示长度标注
                        this.setOpacity(el.pmLength, 1);
                        this.setOpacity(el.bmLength, 1);
                        break;
                        
                    case 5: // 结论汇总
                        el.prevBtn.disabled = false;
                        el.nextBtn.disabled = true;
                        el.conclusionBtn.style.display = 'none';
                        
                        // 恢复正常透明度
                        this.setOpacity(el.ap, 1);
                        this.setOpacity(el.pf, 1);
                        this.setOpacity(el.fm, 1);
                        this.setOpacity(el.pm, 1);
                        this.setOpacity(el.bd, 1);
                        
                        // 显示结论文本
                        this.setOpacity(el.conclusionText, 1);
                        break;
                }
            },
            
            // 初始化
            init: function() {
                const self = this;
                
                // 按钮事件绑定
                el.prevBtn.addEventListener('click', function() {
                    if (self.currentStep > 0) {
                        self.currentStep--;
                        self.updateScene();
                    }
                });
                
                el.nextBtn.addEventListener('click', function() {
                    if (self.currentStep < self.totalSteps - 1) {
                        self.currentStep++;
                        self.updateScene();
                    }
                });
                
                el.conclusionBtn.addEventListener('click', function() {
                    self.currentStep = 5;
                    self.updateScene();
                });
                
                // 初始更新
                this.updateScene();
            }
        };
        
        // 启动场景
        scene2.init();
    })();
    </script>
</body>
</html>
