<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 1 - 圆的切线性质与 CD 长度求解</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene1-controls button { padding: 8px 20px; font-size: 14px; cursor: pointer; border: 1px solid #333; border-radius: 4px; background: #f5f5f5; }
        #scene1-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene1-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 圆 O：圆心 (300,250)，半径 100 -->
            <circle id="scene1-circle-o" cx="300" cy="250" r="100" fill="rgba(200,200,200,0.15)" stroke="#000" stroke-width="2"/>
            
            <!-- 直径 AB：(200,250)-(400,250) -->
            <line id="scene1-line-ab" x1="200" y1="250" x2="400" y2="250" stroke="#000" stroke-width="2"/>
            
            <!-- 延长线 BP：(400,250)-(600,250) -->
            <line id="scene1-line-bp" x1="400" y1="250" x2="600" y2="250" stroke="#000" stroke-width="2"/>
            
            <!-- 切线 PC：(333,156)-(600,250) -->
            <line id="scene1-line-pc" x1="333" y1="156" x2="600" y2="250" stroke="#000" stroke-width="2"/>
            
            <!-- 半径 OC：(300,250)-(333,156)，步骤 1 出现 -->
            <line id="scene1-line-oc" x1="300" y1="250" x2="333" y2="156" stroke="#1565c0" stroke-width="2" style="display: none; opacity: 0;"/>
            
            <!-- 垂线 CD：(333,156)-(333,250)，步骤 3 出现 -->
            <line id="scene1-line-cd" x1="333" y1="156" x2="333" y2="250" stroke="#2e7d32" stroke-width="2" style="display: none; opacity: 0;"/>
            
            <!-- 点 A：(200,250) -->
            <circle id="scene1-point-a" cx="200" cy="250" r="4" fill="#000"/>
            
            <!-- 点 B：(400,250) -->
            <circle id="scene1-point-b" cx="400" cy="250" r="4" fill="#000"/>
            
            <!-- 点 O：(300,250) -->
            <circle id="scene1-point-o" cx="300" cy="250" r="4" fill="#000"/>
            
            <!-- 点 P：(600,250) -->
            <circle id="scene1-point-p" cx="600" cy="250" r="4" fill="#000"/>
            
            <!-- 点 C：(333,156) -->
            <circle id="scene1-point-c" cx="333" cy="156" r="4" fill="#000"/>
            
            <!-- 点 D：(333,250)，步骤 1 出现 -->
            <circle id="scene1-point-d" cx="333" cy="250" r="4" fill="#000" style="display: none; opacity: 0;"/>
            
            <!-- 直角标记∠OCP：顶点 (333,156)，步骤 1 出现 -->
            <path id="scene1-right-angle-ocp" d="M 333,156 L 345,156 L 345,168" stroke="#c62828" stroke-width="2" fill="none" style="display: none; opacity: 0;"/>
            
            <!-- 直角标记∠CDO：顶点 (333,250) -->
            <path id="scene1-right-angle-cdo" d="M 333,250 L 345,250 L 345,238" stroke="#c62828" stroke-width="2" fill="none" style="display: none; opacity: 0;"/>
            
            <!-- 标签 O：(300,285) - 移到圆外下方 -->
            <text id="scene1-label-o" x="300" y="285" font-size="16" fill="#000" text-anchor="middle">O</text>
            
            <!-- 标签 A：(190,265) -->
            <text id="scene1-label-a" x="190" y="265" font-size="16" fill="#000">A</text>
            
            <!-- 标签 B：(405,265) -->
            <text id="scene1-label-b" x="405" y="265" font-size="16" fill="#000">B</text>
            
            <!-- 标签 P：(610,265) -->
            <text id="scene1-label-p" x="610" y="265" font-size="16" fill="#000">P</text>
            
            <!-- 标签 C：(343,141) -->
            <text id="scene1-label-c" x="343" y="141" font-size="16" fill="#000">C</text>
            
            <!-- 标签 D：(333,280)，步骤 1 出现 - 移到圆外下方 -->
            <text id="scene1-label-d" x="333" y="280" font-size="16" fill="#000" text-anchor="middle" style="display: none; opacity: 0;">D</text>
            
            <!-- 标注 PB=2：(500,215) - 移到线上方更高位置 -->
            <text id="scene1-label-pb" x="500" y="215" font-size="14" fill="#000" text-anchor="middle">PB=2</text>
            
            <!-- 标注 BO=2：(350,215) - 移到线上方更高位置 -->
            <text id="scene1-label-bo" x="350" y="215" font-size="14" fill="#000" text-anchor="middle">BO=2</text>
            
            <!-- 标注 OC=2：(275,210)，步骤 1 出现 - 移到 OC 左侧 -->
            <text id="scene1-label-oc" x="275" y="210" font-size="14" fill="#1565c0" text-anchor="middle" style="display: none; opacity: 0;">OC=2</text>
            
            <!-- 标注 OP=4：(450,215)，步骤 1 出现 - 移到线上方更高位置 -->
            <text id="scene1-label-op" x="450" y="215" font-size="14" fill="#000" text-anchor="middle" style="display: none; opacity: 0;">OP=4</text>
            
            <!-- 标注 PC=2√3：(470,175)，步骤 2 出现 - 移到 PC 线上方更高位置 -->
            <text id="scene1-label-pc" x="470" y="175" font-size="14" fill="#000" text-anchor="middle" style="display: none; opacity: 0;">PC=2√3</text>
            
            <!-- 标注 CD=√3：(305,220)，步骤 3 出现 - 移到 CD 左侧，避开 OC=2 -->
            <text id="scene1-label-cd" x="305" y="220" font-size="16" fill="#2e7d32" text-anchor="middle" font-weight="bold" style="display: none; opacity: 0;">CD=√3</text>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-prev-btn" disabled>◀ 上一步</button>
            <button id="scene1-next-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现
        // 布局坐标表对照：
        // 圆 O：圆心 (300,250)，半径 100
        // 直径 AB：(200,250)-(400,250)
        // 延长线 BP：(400,250)-(600,250)
        // 切线 PC：(333,156)-(600,250)
        // 半径 OC：(300,250)-(333,156)
        // 垂线 CD：(333,156)-(333,250)
        // 点 A/B/O/P/C/D：(200,250)/(400,250)/(300,250)/(600,250)/(333,156)/(333,250)
        // 标签 O/A/B/P/C/D：(300,285)/(190,265)/(405,265)/(610,265)/(343,141)/(333,280)
        // 标注 PB=2/BO=2/OC=2/OP=4/PC=2√3/CD=√3：(500,215)/(350,215)/(275,210)/(450,215)/(470,175)/(305,220)
        
        const currentStepMax = 4;
        let currentStep = 0;
        
        // 元素分组（按步骤）
        const step0Elements = [
            'scene1-circle-o', 'scene1-line-ab', 'scene1-line-bp', 'scene1-line-pc',
            'scene1-point-a', 'scene1-point-b', 'scene1-point-o', 'scene1-point-p', 'scene1-point-c',
            'scene1-label-o', 'scene1-label-a', 'scene1-label-b', 'scene1-label-p', 'scene1-label-c',
            'scene1-label-pb', 'scene1-label-bo'
        ];
        
        const step1Elements = [
            'scene1-line-oc', 'scene1-point-d', 'scene1-right-angle-ocp', 'scene1-right-angle-cdo',
            'scene1-label-d', 'scene1-label-oc', 'scene1-label-op'
        ];
        
        const step2Elements = [
            'scene1-label-pc'
        ];
        
        const step3Elements = [
            'scene1-line-cd', 'scene1-label-cd'
        ];
        
        const step4Elements = [
            // 最终步骤，CD 标注加粗高亮（已在 CSS 中设置 font-weight="bold"）
        ];
        
        // 工具函数：显示元素
        function show(elId) {
            const el = document.getElementById(elId);
            if (el) {
                el.style.display = 'block';
                el.style.display = 'inline'; // 对于 text 元素
                setTimeout(() => { el.style.opacity = '1'; }, 10);
            }
        }
        
        // 工具函数：隐藏元素
        function hide(elId) {
            const el = document.getElementById(elId);
            if (el) {
                el.style.opacity = '0';
                setTimeout(() => { el.style.display = 'none'; }, 300);
            }
        }
        
        // 更新显示状态
        function updateDisplay() {
            const prevBtn = document.getElementById('scene1-prev-btn');
            const nextBtn = document.getElementById('scene1-next-btn');
            
            // 更新按钮状态
            prevBtn.disabled = (currentStep === 0);
            nextBtn.disabled = (currentStep === currentStepMax);
            nextBtn.textContent = (currentStep === currentStepMax) ? '完成' : '下一步 ▶';
            
            // 根据当前步骤显示/隐藏元素
            // 步骤 0：基础元素
            step0Elements.forEach(id => show(id));
            
            // 步骤 1：新增 OC、D 点、直角标记等
            if (currentStep >= 1) {
                step1Elements.forEach(id => show(id));
            }
            
            // 步骤 2：新增 PC 长度标注
            if (currentStep >= 2) {
                step2Elements.forEach(id => show(id));
            }
            
            // 步骤 3：新增 CD 及长度标注
            if (currentStep >= 3) {
                step3Elements.forEach(id => show(id));
            }
            
            // 步骤 4：最终高亮
            if (currentStep >= 4) {
                const cdLabel = document.getElementById('scene1-label-cd');
                if (cdLabel) {
                    cdLabel.style.fontWeight = 'bold';
                    cdLabel.style.fontSize = '18px';
                }
            }
        }
        
        // 下一步
        function nextStep() {
            if (currentStep < currentStepMax) {
                currentStep++;
                updateDisplay();
            }
        }
        
        // 上一步
        function prevStep() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        }
        
        // 绑定事件
        document.getElementById('scene1-next-btn').addEventListener('click', nextStep);
        document.getElementById('scene1-prev-btn').addEventListener('click', prevStep);
        
        // 初始化
        updateDisplay();
    })();
    </script>
</body>
</html>
