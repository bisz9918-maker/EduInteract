<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>直三棱柱外接球 - Scene 2</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Segoe UI', Arial, sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 20px; z-index: 10; }
        .scene2-btn { padding: 10px 20px; font-size: 14px; background: #1565c0; color: white; border: none; border-radius: 5px; cursor: pointer; transition: background 0.3s; }
        .scene2-btn:hover { background: #0d47a1; }
        .scene2-btn:disabled { background: #bdbdbd; cursor: not-allowed; }
        .scene2-step-indicator { font-size: 16px; font-weight: bold; color: #1565c0; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" id="scene2-svg">
            <!-- 外接球轮廓 (步骤 1 显示) -->
            <ellipse id="scene2-sphere" cx="280" cy="250" rx="180" ry="180" fill="#1565c0" fill-opacity="0.15" stroke="#1565c0" stroke-width="2" style="display: none; opacity: 0;"/>
            
            <!-- 三棱柱被遮挡棱 AC (始终显示，虚线) -->
            <line id="scene2-AC" x1="380" y1="340" x2="160" y2="280" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5"/>
            
            <!-- 三棱柱可见棱 -->
            <line id="scene2-A1B1" x1="380" y1="180" x2="220" y2="220" stroke="#000000" stroke-width="2"/>
            <line id="scene2-B1C1" x1="220" y1="220" x2="160" y2="120" stroke="#000000" stroke-width="2"/>
            <line id="scene2-A1C1" x1="380" y1="180" x2="160" y2="120" stroke="#000000" stroke-width="2"/>
            <line id="scene2-A1A" x1="380" y1="180" x2="380" y2="340" stroke="#000000" stroke-width="2"/>
            <line id="scene2-B1B" x1="220" y1="220" x2="220" y2="300" stroke="#000000" stroke-width="2"/>
            <line id="scene2-C1C" x1="160" y1="120" x2="160" y2="280" stroke="#000000" stroke-width="2"/>
            <line id="scene2-AB" x1="380" y1="340" x2="220" y2="300" stroke="#000000" stroke-width="2"/>
            <line id="scene2-BC" x1="220" y1="300" x2="160" y2="280" stroke="#000000" stroke-width="2"/>
            
            <!-- 空间对角线 A1C (步骤 3 显示) -->
            <line id="scene2-diagonal" x1="380" y1="180" x2="160" y2="280" stroke="#c62828" stroke-width="2.5" style="display: none; opacity: 0;"/>
            
            <!-- 球半径 OA1 (步骤 4 显示) -->
            <line id="scene2-radius" x1="280" y1="250" x2="380" y2="180" stroke="#2e7d32" stroke-width="1.5" style="display: none; opacity: 0;"/>
            
            <!-- 球心到顶点辅助线 (步骤 2 显示) -->
            <line id="scene2-OB1" x1="280" y1="250" x2="220" y2="220" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" style="display: none; opacity: 0;"/>
            <line id="scene2-OC1" x1="280" y1="250" x2="160" y2="120" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" style="display: none; opacity: 0;"/>
            <line id="scene2-OB" x1="280" y1="250" x2="220" y2="300" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" style="display: none; opacity: 0;"/>
            <line id="scene2-OC" x1="280" y1="250" x2="160" y2="280" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" style="display: none; opacity: 0;"/>
            <line id="scene2-OA" x1="280" y1="250" x2="380" y2="340" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" style="display: none; opacity: 0;"/>
            
            <!-- 球心 O (步骤 2 显示) -->
            <circle id="scene2-center" cx="280" cy="250" r="4" fill="#c62828" style="display: none; opacity: 0;"/>
            
            <!-- 顶点标签 -->
            <text id="scene2-label-A1" x="395" y="175" font-size="14" fill="#000000">A₁</text>
            <text id="scene2-label-B1" x="215" y="235" font-size="14" fill="#000000">B₁</text>
            <text id="scene2-label-C1" x="145" y="115" font-size="14" fill="#000000">C₁</text>
            <text id="scene2-label-A" x="395" y="345" font-size="14" fill="#000000">A</text>
            <text id="scene2-label-B" x="215" y="315" font-size="14" fill="#000000">B</text>
            <text id="scene2-label-C" x="145" y="285" font-size="14" fill="#000000">C</text>
            <text id="scene2-label-O" x="295" y="245" font-size="14" fill="#c62828" font-weight="bold" style="display: none; opacity: 0;">O</text>
            
            <!-- 长度标注 -->
            <text id="scene2-label-A1B1" x="290" y="205" font-size="14" fill="#1565c0">A₁B₁=6</text>
            <text id="scene2-label-B1C1" x="185" y="165" font-size="14" fill="#1565c0">B₁C₁=10</text>
            <text id="scene2-label-AA1" x="395" y="260" font-size="14" fill="#1565c0">AA₁=8</text>
            
            <!-- 公式展示区 (步骤 3-5 显示) -->
            <rect id="scene2-formula-box" x="480" y="180" width="270" height="130" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1" style="display: none; opacity: 0;"/>
            <text id="scene2-formula-d" x="500" y="210" font-size="14" fill="#000000" style="display: none; opacity: 0;">d = √(A₁B₁² + B₁C₁² + AA₁²)</text>
            <text id="scene2-formula-d-calc" x="500" y="240" font-size="14" fill="#000000" style="display: none; opacity: 0;">d = √(6² + 10² + 8²) = √200 = 10√2</text>
            <text id="scene2-formula-R" x="500" y="270" font-size="14" fill="#000000" style="display: none; opacity: 0;">R = d/2 = 5√2</text>
            <text id="scene2-formula-V" x="500" y="300" font-size="14" fill="#000000" style="display: none; opacity: 0;">V = (4/3)πR³ = (1000√2/3)π</text>
            
            <!-- 结果标注 (步骤 4-5 显示) -->
            <text id="scene2-label-d" x="550" y="200" font-size="14" fill="#c62828" font-weight="bold" style="display: none; opacity: 0;">d=10√2</text>
            <text id="scene2-label-R" x="550" y="240" font-size="14" fill="#2e7d32" font-weight="bold" style="display: none; opacity: 0;">R=5√2</text>
            <text id="scene2-label-V" x="520" y="280" font-size="14" fill="#2e7d32" font-weight="bold" style="display: none; opacity: 0;">V=(1000√2/3)π</text>
        </svg>
        
        <div id="scene2-controls">
            <button id="scene2-btn-prev" class="scene2-btn" disabled>◀ 上一步</button>
            <span id="scene2-step-indicator" class="scene2-step-indicator">步骤 0/5</span>
            <button id="scene2-btn-next" class="scene2-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2: 直三棱柱外接球半径与体积计算
        // 坐标表对照：
        // 外接球轮廓：中心 (280,250)，半径 180
        // A₁(380,180), B₁(220,220), C₁(160,120) - 上底面
        // A(380,340), B(220,300), C(160,280) - 下底面
        // 球心 O: (280,250)
        
        const scene2 = {
            currentStep: 0,
            totalSteps: 5,
            
            // 元素 ID 映射
            elements: {
                sphere: 'scene2-sphere',
                diagonal: 'scene2-diagonal',
                radius: 'scene2-radius',
                center: 'scene2-center',
                centerLabel: 'scene2-label-O',
                OB1: 'scene2-OB1',
                OC1: 'scene2-OC1',
                OB: 'scene2-OB',
                OC: 'scene2-OC',
                OA: 'scene2-OA',
                formulaBox: 'scene2-formula-box',
                formulaD: 'scene2-formula-d',
                formulaDCalc: 'scene2-formula-d-calc',
                formulaR: 'scene2-formula-R',
                formulaV: 'scene2-formula-V',
                labelD: 'scene2-label-d',
                labelR: 'scene2-label-R',
                labelV: 'scene2-label-V'
            },
            
            // 步骤配置：每个步骤应显示的元素
            stepConfig: [
                // 步骤 0: 初始状态 - 只显示三棱柱和已知长度
                { show: [] },
                // 步骤 1: 添加外接球
                { show: ['sphere'] },
                // 步骤 2: 显示球心和辅助线
                { show: ['sphere', 'center', 'centerLabel', 'OB1', 'OC1', 'OB', 'OC', 'OA'] },
                // 步骤 3: 高亮空间对角线，显示公式
                { show: ['sphere', 'center', 'centerLabel', 'OB1', 'OC1', 'OB', 'OC', 'OA', 'diagonal', 'formulaBox', 'formulaD'] },
                // 步骤 4: 显示球半径和计算结果
                { show: ['sphere', 'center', 'centerLabel', 'OB1', 'OC1', 'OB', 'OC', 'OA', 'diagonal', 'radius', 'formulaBox', 'formulaD', 'formulaDCalc', 'formulaR', 'labelD', 'labelR'] },
                // 步骤 5: 显示最终体积结果
                { show: ['sphere', 'center', 'centerLabel', 'OB1', 'OC1', 'OB', 'OC', 'OA', 'diagonal', 'radius', 'formulaBox', 'formulaD', 'formulaDCalc', 'formulaR', 'formulaV', 'labelD', 'labelR', 'labelV'] }
            ],
            
            // 工具函数：淡入元素
            fadeIn: function(elementId, duration = 300) {
                const el = document.getElementById(elementId);
                if (!el) return;
                el.style.display = 'block';
                el.style.opacity = '0';
                setTimeout(() => {
                    el.style.transition = `opacity ${duration}ms ease-in-out`;
                    el.style.opacity = '1';
                }, 10);
            },
            
            // 工具函数：淡出元素
            fadeOut: function(elementId, duration = 200) {
                const el = document.getElementById(elementId);
                if (!el) return;
                el.style.transition = `opacity ${duration}ms ease-in-out`;
                el.style.opacity = '0';
                setTimeout(() => {
                    el.style.display = 'none';
                }, duration);
            },
            
            // 渲染当前步骤
            renderStep: function() {
                const config = this.stepConfig[this.currentStep];
                const allElementIds = Object.values(this.elements);
                
                // 先隐藏所有动态元素
                allElementIds.forEach(id => {
                    const el = document.getElementById(id);
                    if (el) {
                        el.style.display = 'none';
                        el.style.opacity = '0';
                    }
                });
                
                // 根据配置显示对应元素
                config.show.forEach(key => {
                    const elementId = this.elements[key];
                    if (elementId) {
                        this.fadeIn(elementId, 300);
                    }
                });
                
                // 更新步骤指示器
                document.getElementById('scene2-step-indicator').textContent = `步骤 ${this.currentStep}/${this.totalSteps}`;
                
                // 更新按钮状态
                document.getElementById('scene2-btn-prev').disabled = (this.currentStep === 0);
                document.getElementById('scene2-btn-next').disabled = (this.currentStep === this.totalSteps);
            },
            
            // 下一步
            nextStep: function() {
                if (this.currentStep < this.totalSteps) {
                    this.currentStep++;
                    this.renderStep();
                }
            },
            
            // 上一步
            prevStep: function() {
                if (this.currentStep > 0) {
                    this.currentStep--;
                    this.renderStep();
                }
            },
            
            // 初始化
            init: function() {
                // 绑定按钮事件
                document.getElementById('scene2-btn-prev').addEventListener('click', () => this.prevStep());
                document.getElementById('scene2-btn-next').addEventListener('click', () => this.nextStep());
                
                // 渲染初始状态
                this.renderStep();
            }
        };
        
        // 启动场景
        scene2.init();
    })();
    </script>
</body>
</html>
