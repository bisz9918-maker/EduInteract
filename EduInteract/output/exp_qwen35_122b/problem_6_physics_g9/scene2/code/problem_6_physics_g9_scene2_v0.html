<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 滑动变阻器工作原理</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" id="scene2-svg">
            <!-- 背景 -->
            <rect width="800" height="500" fill="#ffffff"/>
            
            <!-- 控件区背景（缩小高度，放在底部） -->
            <rect x="0" y="465" width="800" height="35" fill="#f5f5f5"/>
            
            <!-- 拖拽滑块轨道 -->
            <line x1="200" y1="480" x2="600" y2="480" stroke="#888888" stroke-width="6" stroke-linecap="round"/>
            
            <!-- 滑块手柄 -->
            <rect id="scene2-slider-handle" x="350" y="470" width="20" height="20" fill="#1976d2" rx="3"/>
            
            <!-- 滑块标签 -->
            <text x="200" y="500" font-size="14" fill="#666666">拖拽滑片移动</text>
            
            <!-- 位置刻度条 -->
            <line x1="250" y1="425" x2="490" y2="425" stroke="#888888" stroke-width="4"/>
            
            <!-- 位置指示箭头 -->
            <line id="scene2-position-indicator" x1="370" y1="410" x2="370" y2="425" stroke="#888888" stroke-width="2"/>
            <polygon id="scene2-position-arrow" points="370,410 365,418 375,418" fill="#888888"/>
            
            <!-- 电阻值显示（无背景框，直接显示） -->
            <text id="scene2-resistance-label" x="220" y="310" font-size="14" fill="#666666">电阻</text>
            <text id="scene2-resistance-value" x="220" y="340" font-size="20" fill="#2e7d32" font-weight="bold">2.5Ω</text>
            
            <!-- 电流值显示（无背景框，直接显示） -->
            <text id="scene2-current-label" x="420" y="310" font-size="14" fill="#666666">电流</text>
            <text id="scene2-current-value" x="420" y="340" font-size="20" fill="#2e7d32" font-weight="bold">0.48A</text>
            
            <!-- 刻度尺主线（移到右侧边缘） -->
            <line x1="720" y1="160" x2="720" y2="280" stroke="#888888" stroke-width="2" stroke-dasharray="4,4"/>
            
            <!-- 刻度线 -->
            <line x1="715" y1="180" x2="725" y2="180" stroke="#888888" stroke-width="2"/>
            <line x1="715" y1="200" x2="725" y2="200" stroke="#888888" stroke-width="2"/>
            <line x1="715" y1="220" x2="725" y2="220" stroke="#888888" stroke-width="2"/>
            <line x1="715" y1="240" x2="725" y2="240" stroke="#888888" stroke-width="2"/>
            <line x1="715" y1="260" x2="725" y2="260" stroke="#888888" stroke-width="2"/>
            <line x1="715" y1="280" x2="725" y2="280" stroke="#888888" stroke-width="2"/>
            
            <!-- 刻度数值（移到刻度尺左侧） -->
            <text x="700" y="185" font-size="14" fill="#666666" text-anchor="end">0</text>
            <text x="700" y="205" font-size="14" fill="#666666" text-anchor="end">1</text>
            <text x="700" y="225" font-size="14" fill="#666666" text-anchor="end">2</text>
            <text x="700" y="245" font-size="14" fill="#666666" text-anchor="end">3</text>
            <text x="700" y="265" font-size="14" fill="#666666" text-anchor="end">4</text>
            <text x="700" y="285" font-size="14" fill="#666666" text-anchor="end">5</text>
            
            <!-- 接入长度标签 -->
            <text id="scene2-length-label" x="200" y="190" font-size="14" fill="#666666">接入长度</text>
            
            <!-- 接入电阻丝高亮（蓝色粗线） -->
            <line id="scene2-highlight-path" x1="150" y1="220" x2="370" y2="220" stroke="#1565c0" stroke-width="4"/>
            
            <!-- 电阻丝主体（锯齿线） -->
            <path id="scene2-resistor-wire" d="M 150,220 L 160,215 L 170,225 L 180,215 L 190,225 L 200,215 L 210,225 L 220,215 L 230,225 L 240,215 L 250,225 L 260,215 L 270,225 L 280,215 L 290,225 L 300,215 L 310,225 L 320,215 L 330,225 L 340,215 L 350,225 L 360,215 L 370,225 L 380,215 L 390,225 L 400,215 L 410,225 L 420,215 L 430,225 L 440,215 L 450,225 L 460,215 L 470,225 L 480,215 L 490,225 L 500,215 L 510,225 L 520,215 L 530,225 L 540,215 L 550,220" stroke="#000000" stroke-width="2" fill="none"/>
            
            <!-- 左接线柱 -->
            <circle id="scene2-left-terminal" cx="130" cy="220" r="12" fill="none" stroke="#000000" stroke-width="2"/>
            <text x="80" y="225" font-size="14" fill="#666666">左接线柱</text>
            
            <!-- 右接线柱 -->
            <circle id="scene2-right-terminal" cx="570" cy="220" r="12" fill="none" stroke="#000000" stroke-width="2"/>
            <text x="590" y="225" font-size="14" fill="#666666">右接线柱</text>
            
            <!-- 滑片矩形 -->
            <rect id="scene2-slider" x="350" y="160" width="40" height="60" fill="#c62828" fill-opacity="0.2" stroke="#c62828" stroke-width="2" style="cursor: grab;"/>
            
            <!-- 滑片箭头 -->
            <line id="scene2-slider-arrow" x1="370" y1="220" x2="370" y2="235" stroke="#c62828" stroke-width="2"/>
            <polygon id="scene2-slider-arrowhead" points="370,235 365,227 375,227" fill="#c62828"/>
            
            <!-- 滑片标签 -->
            <text id="scene2-slider-label" x="355" y="145" font-size="14" fill="#666666">滑片</text>
            
            <!-- 电阻丝标签 -->
            <text id="scene2-wire-label" x="350" y="255" font-size="14" fill="#666666">电阻丝</text>
        </svg>
    </div>
    
    <script>
    (function() {
        // Scene 2: 滑动变阻器工作原理
        // 布局坐标表（参考）：
        // | 元素 | 位置/范围 | 备注 |
        // | 电阻丝主体 | (150,220)-(550,220) | 锯齿线 |
        // | 滑片矩形 | (350,160)-(390,220) | 可拖拽 |
        // | 左接线柱 | (130,220) | 圆形 |
        // | 右接线柱 | (570,220) | 圆形 |
        // | 接入电阻丝高亮 | (150,220)-(370,220) 动态 | 蓝色粗线 |
        // | 刻度尺 | (720,160)-(720,280) | 垂直刻度（移到右侧） |
        // | 电阻值显示 | (220,310)-(220,340) | 无背景框 |
        // | 电流值显示 | (420,310)-(420,340) | 无背景框 |
        // | 位置指示 | (370,410)-(370,425) | 箭头 |
        // | 拖拽滑块轨道 | (200,480)-(600,480) | 水平轨道 |
        // | 滑块手柄 | (350,470)-(370,490) | 可拖拽 |
        
        // 状态变量
        let sliderPosition = 370;  // 滑片 x 坐标，范围 150-550
        const MIN_POS = 150;
        const MAX_POS = 550;
        const WIRE_LENGTH = 400;   // 电阻丝总长度
        const MAX_RESISTANCE = 5.0; // 最大电阻 5Ω
        const VOLTAGE = 1.2;       // 电源电压 1.2V（假设含定值电阻）
        
        // 获取 DOM 元素
        const svg = document.getElementById('scene2-svg');
        const slider = document.getElementById('scene2-slider');
        const sliderArrow = document.getElementById('scene2-slider-arrow');
        const sliderArrowhead = document.getElementById('scene2-slider-arrowhead');
        const sliderLabel = document.getElementById('scene2-slider-label');
        const highlightPath = document.getElementById('scene2-highlight-path');
        const resistanceValue = document.getElementById('scene2-resistance-value');
        const currentValue = document.getElementById('scene2-current-value');
        const positionIndicator = document.getElementById('scene2-position-indicator');
        const positionArrow = document.getElementById('scene2-position-arrow');
        const sliderHandle = document.getElementById('scene2-slider-handle');
        const lengthLabel = document.getElementById('scene2-length-label');
        
        // 拖拽状态
        let isDragging = false;
        let dragTarget = null;  // 'slider' or 'handle'
        let startX = 0;
        let startSliderPos = 0;
        
        // 计算并更新显示
        function updateDisplay() {
            // 计算接入长度
            const 接入长度 = sliderPosition - MIN_POS;
            
            // 计算电阻值
            const resistance = (接入长度 / WIRE_LENGTH) * MAX_RESISTANCE;
            
            // 计算电流值（欧姆定律 I = U/R，当 R=0 时电流最大）
            let current;
            if (resistance < 0.1) {
                current = VOLTAGE / 0.1;  // 防止除零，最小电阻 0.1Ω
            } else {
                current = VOLTAGE / resistance;
            }
            // 限制最大电流
            if (current > 1.2) current = 1.2;
            
            // 更新滑片位置
            slider.setAttribute('x', sliderPosition - 20);  // 滑片宽度 40，中心在 sliderPosition
            sliderArrow.setAttribute('x1', sliderPosition);
            sliderArrow.setAttribute('x2', sliderPosition);
            sliderArrowhead.setAttribute('points', `${sliderPosition},235 ${sliderPosition-5},227 ${sliderPosition+5},227`);
            sliderLabel.setAttribute('x', sliderPosition - 20 + 5);
            
            // 更新蓝色高亮区域
            highlightPath.setAttribute('x2', sliderPosition);
            
            // 更新数值显示
            resistanceValue.textContent = resistance.toFixed(1) + 'Ω';
            currentValue.textContent = current.toFixed(2) + 'A';
            
            // 更新位置指示
            // 位置刻度条范围：250-490，对应滑片位置 150-550
            const indicatorX = 250 + (sliderPosition - MIN_POS) / WIRE_LENGTH * 240;
            positionIndicator.setAttribute('x1', indicatorX);
            positionIndicator.setAttribute('x2', indicatorX);
            positionArrow.setAttribute('points', `${indicatorX},410 ${indicatorX-5},418 ${indicatorX+5},418`);
            
            // 更新下方滑块手柄位置
            const handleX = 200 + (sliderPosition - MIN_POS) / WIRE_LENGTH * 400;
            sliderHandle.setAttribute('x', handleX - 10);  // 手柄宽度 20，中心在 handleX
        }
        
        // 拖拽开始
        function startDrag(e, target) {
            isDragging = true;
            dragTarget = target;
            startX = e.clientX || e.touches?.[0]?.clientX || 0;
            startSliderPos = sliderPosition;
            slider.style.cursor = 'grabbing';
        }
        
        // 拖拽中
        function drag(e) {
            if (!isDragging) return;
            
            const clientX = e.clientX || e.touches?.[0]?.clientX || 0;
            const deltaX = clientX - startX;
            
            if (dragTarget === 'slider') {
                // 主滑片拖拽
                let newPos = startSliderPos + deltaX;
                newPos = Math.max(MIN_POS, Math.min(MAX_POS, newPos));
                sliderPosition = newPos;
            } else if (dragTarget === 'handle') {
                // 下方滑块手柄拖拽
                const handleX = 200 + (sliderPosition - MIN_POS) / WIRE_LENGTH * 400;
                const newHandleX = handleX + deltaX;
                const newSliderPos = MIN_POS + (newHandleX - 200) / 400 * WIRE_LENGTH;
                sliderPosition = Math.max(MIN_POS, Math.min(MAX_POS, newSliderPos));
            }
            
            updateDisplay();
        }
        
        // 拖拽结束
        function endDrag() {
            isDragging = false;
            dragTarget = null;
            slider.style.cursor = 'grab';
        }
        
        // 事件绑定 - 主滑片
        slider.addEventListener('mousedown', (e) => startDrag(e, 'slider'));
        slider.addEventListener('touchstart', (e) => { e.preventDefault(); startDrag(e, 'slider'); }, { passive: false });
        
        // 事件绑定 - 下方滑块手柄
        sliderHandle.addEventListener('mousedown', (e) => startDrag(e, 'handle'));
        sliderHandle.addEventListener('touchstart', (e) => { e.preventDefault(); startDrag(e, 'handle'); }, { passive: false });
        
        // 全局事件
        document.addEventListener('mousemove', drag);
        document.addEventListener('touchmove', (e) => { if (isDragging) e.preventDefault(); drag(e); }, { passive: false });
        document.addEventListener('mouseup', endDrag);
        document.addEventListener('touchend', endDrag);
        
        // 点击电阻丝快速定位
        svg.addEventListener('click', (e) => {
            if (isDragging) return;
            const rect = svg.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            
            // 只在电阻丝高度范围内响应
            if (clickX >= MIN_POS && clickX <= MAX_POS && Math.abs(e.clientY - (rect.top + 220)) < 50) {
                sliderPosition = Math.max(MIN_POS, Math.min(MAX_POS, clickX));
                updateDisplay();
            }
        });
        
        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
