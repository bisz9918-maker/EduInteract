<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正六边形内接于圆 - 场景 1</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene1-btn {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #666;
            border-radius: 4px;
            background: #f0f0f0;
            color: #333;
        }
        .scene1-btn:hover:not(:disabled) { background: #e0e0e0; }
        .scene1-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        svg { display: block; }
        .scene1-text { font-size: 14px; font-family: 'Times New Roman', serif; }
        .scene1-label { font-size: 16px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene1-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#1565c0" />
                </marker>
            </defs>

            <!-- 圆 O -->
            <circle id="scene1-circle" cx="400" cy="250" r="180" fill="none" stroke="#000" stroke-width="2" opacity="1"/>

            <!-- 圆心点 O -->
            <circle id="scene1-center" cx="400" cy="250" r="3" fill="#000" opacity="1"/>

            <!-- 标签 "O" - 向下移动以避免与圆重叠 (圆心 y=250, 圆底部 y=430, 标签在圆心下方) -->
            <text id="scene1-label-O" x="400" y="310" class="scene1-text" text-anchor="middle" opacity="1">O</text>

            <!-- 顶点 A₁-A₆ -->
            <circle id="scene1-A1" cx="580" cy="250" r="2" fill="#000" style="display:none; opacity:0"/>
            <circle id="scene1-A2" cx="490" cy="94" r="2" fill="#000" style="display:none; opacity:0"/>
            <circle id="scene1-A3" cx="310" cy="94" r="2" fill="#000" style="display:none; opacity:0"/>
            <circle id="scene1-A4" cx="220" cy="250" r="2" fill="#000" style="display:none; opacity:0"/>
            <circle id="scene1-A5" cx="310" cy="406" r="2" fill="#000" style="display:none; opacity:0"/>
            <circle id="scene1-A6" cx="490" cy="406" r="2" fill="#000" style="display:none; opacity:0"/>

            <!-- 顶点标签 - 调整位置以避免与圆重叠 (圆底部在 y=430) -->
            <text id="scene1-label-A1" x="595" y="255" class="scene1-label" style="display:none; opacity:0">A₁</text>
            <text id="scene1-label-A2" x="490" y="70" class="scene1-label" text-anchor="middle" style="display:none; opacity:0">A₂</text>
            <text id="scene1-label-A3" x="310" y="70" class="scene1-label" text-anchor="middle" style="display:none; opacity:0">A₃</text>
            <text id="scene1-label-A4" x="200" y="255" class="scene1-label" style="display:none; opacity:0">A₄</text>
            <text id="scene1-label-A5" x="310" y="445" class="scene1-label" text-anchor="middle" style="display:none; opacity:0">A₅</text>
            <text id="scene1-label-A6" x="490" y="445" class="scene1-label" text-anchor="middle" style="display:none; opacity:0">A₆</text>

            <!-- 正六边形的边 -->
            <line id="scene1-edge1" x1="580" y1="250" x2="490" y2="94" stroke="#000" stroke-width="2" style="display:none; opacity:0"/>
            <line id="scene1-edge2" x1="490" y1="94" x2="310" y2="94" stroke="#000" stroke-width="2" style="display:none; opacity:0"/>
            <line id="scene1-edge3" x1="310" y1="94" x2="220" y2="250" stroke="#000" stroke-width="2" style="display:none; opacity:0"/>
            <line id="scene1-edge4" x1="220" y1="250" x2="310" y2="406" stroke="#000" stroke-width="2" style="display:none; opacity:0"/>
            <line id="scene1-edge5" x1="310" y1="406" x2="490" y2="406" stroke="#000" stroke-width="2" style="display:none; opacity:0"/>
            <line id="scene1-edge6" x1="490" y1="406" x2="580" y2="250" stroke="#000" stroke-width="2" style="display:none; opacity:0"/>

            <!-- 中心角弧线（绿色）- 调整半径以避免与标签重叠 -->
            <path id="scene1-arc1" d="M435,215 A35,35 0 0,1 415,175" fill="none" stroke="#2e7d32" stroke-width="1" style="display:none; opacity:0"/>
            <path id="scene1-arc2" d="M415,175 A35,35 0 0,1 355,175" fill="none" stroke="#2e7d32" stroke-width="1" style="display:none; opacity:0"/>
            <path id="scene1-arc3" d="M355,175 A35,35 0 0,1 315,215" fill="none" stroke="#2e7d32" stroke-width="1" style="display:none; opacity:0"/>
            <path id="scene1-arc4" d="M315,215 A35,35 0 0,1 315,285" fill="none" stroke="#2e7d32" stroke-width="1" style="display:none; opacity:0"/>
            <path id="scene1-arc5" d="M315,285 A35,35 0 0,1 355,325" fill="none" stroke="#2e7d32" stroke-width="1" style="display:none; opacity:0"/>
            <path id="scene1-arc6" d="M355,325 A35,35 0 0,1 415,325 A35,35 0 0,1 435,285 A35,35 0 0,1 435,215" fill="none" stroke="#2e7d32" stroke-width="1" style="display:none; opacity:0"/>

            <!-- 角度标注 "60°" - 调整位置以避免与圆和弧线重叠 -->
            <text id="scene1-label-angle" x="475" y="175" class="scene1-text" style="display:none; opacity:0">60°</text>

            <!-- 半径向量（蓝色，带箭头） -->
            <line id="scene1-vec1" x1="400" y1="250" x2="580" y2="250" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow)" style="display:none; opacity:0"/>
            <line id="scene1-vec2" x1="400" y1="250" x2="490" y2="94" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow)" style="display:none; opacity:0"/>
            <line id="scene1-vec3" x1="400" y1="250" x2="310" y2="94" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow)" style="display:none; opacity:0"/>
            <line id="scene1-vec4" x1="400" y1="250" x2="220" y2="250" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow)" style="display:none; opacity:0"/>
            <line id="scene1-vec5" x1="400" y1="250" x2="310" y2="406" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow)" style="display:none; opacity:0"/>
            <line id="scene1-vec6" x1="400" y1="250" x2="490" y2="406" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow)" style="display:none; opacity:0"/>
        </svg>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn">◀ 上一步</button>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // 场景 1：正六边形内接于圆的基本结构
        // 布局坐标表（参考）：
        // 画布尺寸：800×500px
        // 圆心 O 坐标：(400, 250)
        // 圆半径 R：180px
        // 顶点坐标：A₁(580,250), A₂(490,94), A₃(310,94), A₄(220,250), A₅(310,406), A₆(490,406)

        const currentStepMax = 4;
        let currentStep = 0;

        // 元素 ID 列表（按步骤分组）
        const stepElements = {
            1: ['scene1-A1', 'scene1-A2', 'scene1-A3', 'scene1-A4', 'scene1-A5', 'scene1-A6',
                'scene1-label-A1', 'scene1-label-A2', 'scene1-label-A3', 'scene1-label-A4', 'scene1-label-A5', 'scene1-label-A6'],
            2: ['scene1-edge1', 'scene1-edge2', 'scene1-edge3', 'scene1-edge4', 'scene1-edge5', 'scene1-edge6'],
            3: ['scene1-arc1', 'scene1-arc2', 'scene1-arc3', 'scene1-arc4', 'scene1-arc5', 'scene1-arc6', 'scene1-label-angle'],
            4: ['scene1-vec1', 'scene1-vec2', 'scene1-vec3', 'scene1-vec4', 'scene1-vec5', 'scene1-vec6']
        };

        // 工具函数：显示元素
        function show(elId) {
            const el = document.getElementById(elId);
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }

        // 工具函数：隐藏元素
        function hide(elId) {
            const el = document.getElementById(elId);
            if (el) {
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }

        // 更新当前步骤的显示状态
        function updateStep() {
            // 步骤 0：只显示圆、圆心、标签 O
            // 隐藏步骤 1-4 的所有元素
            for (let s = 1; s <= 4; s++) {
                stepElements[s].forEach(hide);
            }

            // 根据当前步骤显示对应元素
            for (let s = 1; s <= currentStep; s++) {
                stepElements[s].forEach(show);
            }

            // 更新按钮状态
            const prevBtn = document.getElementById('scene1-btn-prev');
            const nextBtn = document.getElementById('scene1-btn-next');
            prevBtn.disabled = (currentStep === 0);
            nextBtn.disabled = (currentStep === currentStepMax);
        }

        // 按钮事件绑定
        document.getElementById('scene1-btn-prev').addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });

        document.getElementById('scene1-btn-next').addEventListener('click', function() {
            if (currentStep < currentStepMax) {
                currentStep++;
                updateStep();
            }
        });

        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
