<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四棱锥三视图与立体图</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene1-btn-prev, #scene1-btn-next {
            padding: 8px 16px;
            font-size: 14px;
            border: 2px solid #1565c0;
            border-radius: 4px;
            background: #ffffff;
            color: #1565c0;
            cursor: pointer;
            font-family: "Microsoft YaHei", sans-serif;
        }
        #scene1-btn-prev:hover, #scene1-btn-next:hover {
            background: #1565c0;
            color: #ffffff;
        }
        #scene1-btn-prev:disabled, #scene1-btn-next:disabled {
            border-color: #cccccc;
            color: #cccccc;
            cursor: not-allowed;
            background: #f5f5f5;
        }
        #scene1-step-indicator {
            padding: 8px 16px;
            font-size: 14px;
            background: #e3f2fd;
            border-radius: 4px;
            color: #1565c0;
            font-weight: bold;
        }
        .highlight-blue { fill: rgba(21, 101, 192, 0.3) !important; stroke: #1565c0 !important; }
        .highlight-green { fill: rgba(46, 125, 50, 0.2) !important; stroke: #2e7d32 !important; }
        .highlight-red { fill: #c62828 !important; stroke: #c62828 !important; }
        .transition-all { transition: all 0.3s ease; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- 标题 -->
            <text x="400" y="45" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000">四棱锥三视图与立体图</text>
            
            <!-- 主视图区域 -->
            <g id="scene1-main-view-group">
                <!-- 主视图三角形 -->
                <polygon id="scene1-main-triangle" points="40,180 270,180 155,50" 
                         fill="none" stroke="#000000" stroke-width="2" class="transition-all"/>
                <!-- 主视图底边延长线 -->
                <line id="scene1-main-base-line" x1="40" y1="195" x2="270" y2="195" 
                      stroke="#000000" stroke-width="2"/>
                <!-- 主视图底边标注 3+3 -->
                <text id="scene1-main-label-3-left" x="97" y="215" text-anchor="middle" 
                      font-size="14" fill="#c62828" opacity="0">3</text>
                <text id="scene1-main-label-3-right" x="213" y="215" text-anchor="middle" 
                      font-size="14" fill="#c62828" opacity="0">3</text>
                <!-- 主视图标签 -->
                <text id="scene1-main-label" x="155" y="240" text-anchor="middle" 
                      font-size="14" fill="#000000">主视图</text>
            </g>
            
            <!-- 俯视图区域 -->
            <g id="scene1-top-view-group">
                <!-- 俯视图矩形 -->
                <rect id="scene1-top-rect" x="50" y="270" width="210" height="100" 
                      fill="none" stroke="#000000" stroke-width="2" class="transition-all"/>
                <!-- 俯视图对角线 -->
                <line id="scene1-top-diag1" x1="50" y1="370" x2="155" y2="270" 
                      stroke="#000000" stroke-width="2" opacity="0"/>
                <line id="scene1-top-diag2" x1="260" y1="370" x2="155" y2="270" 
                      stroke="#000000" stroke-width="2" opacity="0"/>
                <!-- 俯视图长度标注 6 -->
                <text id="scene1-top-label-6" x="155" y="395" text-anchor="middle" 
                      font-size="14" fill="#c62828" opacity="0">6</text>
                <!-- 俯视图宽度标注 2 -->
                <text id="scene1-top-label-2" x="275" y="320" text-anchor="middle" 
                      font-size="14" fill="#c62828" opacity="0">2</text>
                <!-- 俯视图标签 -->
                <text id="scene1-top-label" x="155" y="415" text-anchor="middle" 
                      font-size="14" fill="#000000">俯视图</text>
            </g>
            
            <!-- 侧视图区域 -->
            <g id="scene1-side-view-group">
                <!-- 侧视图三角形（直角三角形） -->
                <polygon id="scene1-side-triangle" points="300,180 450,180 300,50" 
                         fill="none" stroke="#000000" stroke-width="2" class="transition-all"/>
                <!-- 侧视图底边标注 2 -->
                <text id="scene1-side-label-2" x="375" y="200" text-anchor="middle" 
                      font-size="14" fill="#c62828" opacity="0">2</text>
                <!-- 侧视图高度标注 4 -->
                <text id="scene1-side-label-4" x="460" y="115" text-anchor="middle" 
                      font-size="14" fill="#c62828" opacity="0">4</text>
                <!-- 侧视图标签 -->
                <text id="scene1-side-label" x="375" y="240" text-anchor="middle" 
                      font-size="14" fill="#000000">侧视图</text>
            </g>
            
            <!-- 立体图区域 -->
            <g id="scene1-3d-group" opacity="0">
                <!-- 立体四棱锥底面（平行四边形） -->
                <polygon id="scene1-3d-base" points="520,300 720,300 680,360 560,360" 
                         fill="rgba(46, 125, 50, 0.2)" stroke="#2e7d32" stroke-width="2" class="transition-all"/>
                <!-- 立体四棱锥棱线 -->
                <line id="scene1-3d-edge1" x1="620" y1="120" x2="520" y2="300" 
                      stroke="#2e7d32" stroke-width="2"/>
                <line id="scene1-3d-edge2" x1="620" y1="120" x2="720" y2="300" 
                      stroke="#2e7d32" stroke-width="2"/>
                <line id="scene1-3d-edge3" x1="620" y1="120" x2="680" y2="360" 
                      stroke="#2e7d32" stroke-width="2"/>
                <line id="scene1-3d-edge4" x1="620" y1="120" x2="560" y2="360" 
                      stroke="#2e7d32" stroke-width="2"/>
                <!-- 立体图高线（虚线） -->
                <line id="scene1-3d-height-line" x1="620" y1="120" x2="620" y2="300" 
                      stroke="#888888" stroke-width="2" stroke-dasharray="5,5" opacity="0"/>
                <!-- 立体图顶点 -->
                <circle id="scene1-3d-vertex" cx="620" cy="120" r="4" fill="#2e7d32"/>
                <!-- 立体图高度标注 h=4（移到更右侧，避免与高线重叠） -->
                <text id="scene1-3d-label-h" x="750" y="210" text-anchor="middle" 
                      font-size="14" fill="#c62828" opacity="0">h=4</text>
                <!-- 立体图底面长标注 6（移到左侧，避免与底面标签重叠） -->
                <text id="scene1-3d-label-6" x="580" y="380" text-anchor="middle" 
                      font-size="14" fill="#c62828" opacity="0">6</text>
                <!-- 立体图底面宽标注 2 -->
                <text id="scene1-3d-label-2" x="730" y="330" text-anchor="middle" 
                      font-size="14" fill="#c62828" opacity="0">2</text>
                <!-- 立体图顶点标签 -->
                <text id="scene1-3d-label-vertex" x="620" y="100" text-anchor="middle" 
                      font-size="14" fill="#000000" opacity="0">顶点</text>
                <!-- 立体图底面标签（移到右侧，避免与 6 重叠） -->
                <text id="scene1-3d-label-base" x="660" y="395" text-anchor="middle" 
                      font-size="14" fill="#000000" opacity="0">底面</text>
            </g>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/6</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // 布局坐标表（实现对照依据）
        // | 元素 | 类型 | 位置/范围 | 大小 | 备注 |
        // | 主视图区域 | 矩形框 | (40,40)-(270,220) | 230×180 | 左侧上部 |
        // | 主视图三角形 | 多边形 | (40,180)-(270,180)-(155,50) | - | 等腰三角形 |
        // | 俯视图区域 | 矩形框 | (40,260)-(270,380) | 230×120 | 左侧下部 |
        // | 俯视图矩形 | 矩形 | (50,270)-(260,370) | 210×100 | 底面矩形 |
        // | 侧视图区域 | 矩形框 | (300,40)-(450,220) | 150×180 | 右侧上部 |
        // | 侧视图三角形 | 多边形 | (300,180)-(450,180)-(300,50) | - | 直角三角形 |
        // | 立体图区域 | 矩形框 | (480,40)-(780,400) | 300×360 | 右侧立体展示区 |
        // | 立体四棱锥底面 | 平行四边形 | (520,300)-(720,300)-(680,360)-(560,360) | - | 透视底面 |
        // | 立体四棱锥顶点 | 点 | (620,120) | 4 | 锥顶 |
        
        // 状态变量
        var currentStep = 0;
        var totalSteps = 6;
        
        // 获取 DOM 元素
        var svg = document.getElementById('scene1-svg');
        var btnPrev = document.getElementById('scene1-btn-prev');
        var btnNext = document.getElementById('scene1-btn-next');
        var stepIndicator = document.getElementById('scene1-step-indicator');
        
        // 主视图元素
        var mainTriangle = document.getElementById('scene1-main-triangle');
        var mainLabel3Left = document.getElementById('scene1-main-label-3-left');
        var mainLabel3Right = document.getElementById('scene1-main-label-3-right');
        
        // 俯视图元素
        var topRect = document.getElementById('scene1-top-rect');
        var topDiag1 = document.getElementById('scene1-top-diag1');
        var topDiag2 = document.getElementById('scene1-top-diag2');
        var topLabel6 = document.getElementById('scene1-top-label-6');
        var topLabel2 = document.getElementById('scene1-top-label-2');
        
        // 侧视图元素
        var sideTriangle = document.getElementById('scene1-side-triangle');
        var sideLabel2 = document.getElementById('scene1-side-label-2');
        var sideLabel4 = document.getElementById('scene1-side-label-4');
        
        // 立体图元素
        var d3Group = document.getElementById('scene1-3d-group');
        var d3Base = document.getElementById('scene1-3d-base');
        var d3HeightLine = document.getElementById('scene1-3d-height-line');
        var d3LabelH = document.getElementById('scene1-3d-label-h');
        var d3Label6 = document.getElementById('scene1-3d-label-6');
        var d3Label2 = document.getElementById('scene1-3d-label-2');
        var d3LabelVertex = document.getElementById('scene1-3d-label-vertex');
        var d3LabelBase = document.getElementById('scene1-3d-label-base');
        
        // 工具函数：显示元素
        function show(el) {
            el.style.display = 'block';
            el.style.opacity = '1';
        }
        
        // 工具函数：隐藏元素
        function hide(el) {
            el.style.opacity = '0';
            setTimeout(function() {
                el.style.display = 'none';
            }, 300);
        }
        
        // 工具函数：设置元素可见性（同时处理 display 和 opacity）
        function setVisibility(el, visible) {
            if (visible) {
                el.style.display = 'block';
                el.style.opacity = '1';
            } else {
                el.style.opacity = '0';
                setTimeout(function() {
                    el.style.display = 'none';
                }, 300);
            }
        }
        
        // 工具函数：设置元素透明度（不改变 display）
        function setOpacity(el, opacity) {
            el.style.opacity = opacity;
        }
        
        // 渲染当前步骤
        function renderStep() {
            // 重置所有高亮
            mainTriangle.classList.remove('highlight-blue');
            topRect.classList.remove('highlight-blue');
            sideTriangle.classList.remove('highlight-blue');
            d3Base.classList.remove('highlight-green');
            
            // 重置所有标注透明度
            mainLabel3Left.style.opacity = '0';
            mainLabel3Right.style.opacity = '0';
            topDiag1.style.opacity = '0';
            topDiag2.style.opacity = '0';
            topLabel6.style.opacity = '0';
            topLabel2.style.opacity = '0';
            sideLabel2.style.opacity = '0';
            sideLabel4.style.opacity = '0';
            d3HeightLine.style.opacity = '0';
            d3LabelH.style.opacity = '0';
            d3Label6.style.opacity = '0';
            d3Label2.style.opacity = '0';
            d3LabelVertex.style.opacity = '0';
            d3LabelBase.style.opacity = '0';
            
            // 立体图整体可见性
            if (currentStep >= 4) {
                d3Group.style.display = 'block';
                d3Group.style.opacity = '1';
            } else {
                d3Group.style.opacity = '0';
                setTimeout(function() {
                    if (currentStep < 4) d3Group.style.display = 'none';
                }, 300);
            }
            
            // 根据步骤设置状态
            switch(currentStep) {
                case 0: // 初始状态：显示三视图
                    break;
                    
                case 1: // 高亮主视图
                    mainTriangle.classList.add('highlight-blue');
                    mainLabel3Left.style.opacity = '1';
                    mainLabel3Right.style.opacity = '1';
                    break;
                    
                case 2: // 高亮俯视图
                    topRect.classList.add('highlight-blue');
                    topDiag1.style.opacity = '1';
                    topDiag2.style.opacity = '1';
                    topLabel6.style.opacity = '1';
                    topLabel2.style.opacity = '1';
                    break;
                    
                case 3: // 高亮侧视图
                    sideTriangle.classList.add('highlight-blue');
                    sideLabel2.style.opacity = '1';
                    sideLabel4.style.opacity = '1';
                    break;
                    
                case 4: // 显示立体图
                    d3Base.classList.add('highlight-green');
                    d3LabelVertex.style.opacity = '1';
                    d3LabelBase.style.opacity = '1';
                    break;
                    
                case 5: // 显示立体图尺寸标注
                    d3Base.classList.add('highlight-green');
                    d3HeightLine.style.opacity = '1';
                    d3LabelH.style.opacity = '1';
                    d3Label6.style.opacity = '1';
                    d3Label2.style.opacity = '1';
                    d3LabelVertex.style.opacity = '1';
                    d3LabelBase.style.opacity = '1';
                    break;
            }
            
            // 更新步骤指示器
            stepIndicator.textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;
            
            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps - 1);
        }
        
        // 事件绑定
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        });
        
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                renderStep();
            }
        });
        
        // 初始化渲染
        renderStep();
    })();
    </script>
</body>
</html>
