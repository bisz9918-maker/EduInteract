<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 1 - 平行板电容器三球系统</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 20px; z-index: 10; }
        #scene1-controls button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #333; border-radius: 4px; background: #f5f5f5; }
        #scene1-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene1-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 14px; font-weight: bold; color: #333; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义 -->
            <defs>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#c62828" />
                </marker>
                <marker id="scene1-arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#2e7d32" />
                </marker>
            </defs>

            <!-- 运动轨迹（虚线） -->
            <line id="scene1-trajectory" x1="400" y1="50" x2="400" y2="350" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" opacity="0"/>

            <!-- 上极板（带小孔） -->
            <line id="scene1-top-plate" x1="200" y1="170" x2="390" y2="170" stroke="#000000" stroke-width="2"/>
            <line id="scene1-top-plate-right" x1="410" y1="170" x2="600" y2="170" stroke="#000000" stroke-width="2"/>
            <text id="scene1-top-plate-label" x="350" y="155" font-size="14" fill="#000000" text-anchor="middle">上极板</text>

            <!-- 下极板 -->
            <line id="scene1-bottom-plate" x1="200" y1="350" x2="600" y2="350" stroke="#000000" stroke-width="2"/>
            <text id="scene1-bottom-plate-label" x="350" y="370" font-size="14" fill="#000000" text-anchor="middle">下极板</text>

            <!-- 板间距离标注 d -->
            <line id="scene1-d-line" x1="170" y1="170" x2="170" y2="350" stroke="#000000" stroke-width="1"/>
            <line id="scene1-d-arrow-top" x1="165" y1="170" x2="175" y2="170" stroke="#000000" stroke-width="1"/>
            <line id="scene1-d-arrow-bottom" x1="165" y1="350" x2="175" y2="350" stroke="#000000" stroke-width="1"/>
            <text id="scene1-d-label" x="150" y="265" font-size="14" fill="#000000" text-anchor="middle">d</text>

            <!-- 电场线（3 条，向上） -->
            <line id="scene1-field-line1" x1="320" y1="350" x2="320" y2="173" stroke="#c62828" stroke-width="1" marker-end="url(#scene1-arrowhead)" opacity="0"/>
            <line id="scene1-field-line2" x1="400" y1="350" x2="400" y2="173" stroke="#c62828" stroke-width="1" marker-end="url(#scene1-arrowhead)" opacity="0"/>
            <line id="scene1-field-line3" x1="480" y1="350" x2="480" y2="173" stroke="#c62828" stroke-width="1" marker-end="url(#scene1-arrowhead)" opacity="0"/>
            <text id="scene1-E-label" x="500" y="265" font-size="14" fill="#000000" text-anchor="middle" opacity="0">E</text>

            <!-- 杆长标注 L1（下） -->
            <line id="scene1-L1-line" x1="440" y1="170" x2="440" y2="110" stroke="#000000" stroke-width="1"/>
            <line id="scene1-L1-arrow-top" x1="435" y1="170" x2="445" y2="170" stroke="#000000" stroke-width="1"/>
            <line id="scene1-L1-arrow-bottom" x1="435" y1="110" x2="445" y2="110" stroke="#000000" stroke-width="1"/>
            <text id="scene1-L1-label" x="460" y="145" font-size="14" fill="#000000" text-anchor="middle" opacity="0">L</text>

            <!-- 杆长标注 L2（上） -->
            <line id="scene1-L2-line" x1="440" y1="110" x2="440" y2="50" stroke="#000000" stroke-width="1"/>
            <line id="scene1-L2-arrow-top" x1="435" y1="110" x2="445" y2="110" stroke="#000000" stroke-width="1"/>
            <line id="scene1-L2-arrow-bottom" x1="435" y1="50" x2="445" y2="50" stroke="#000000" stroke-width="1"/>
            <text id="scene1-L2-label" x="460" y="85" font-size="14" fill="#000000" text-anchor="middle" opacity="0">L</text>

            <!-- 球 1（最下） -->
            <circle id="scene1-ball1" cx="400" cy="170" r="15" fill="#1565c0" fill-opacity="0.2" stroke="#1565c0" stroke-width="2"/>
            <text id="scene1-ball1-q" x="430" y="175" font-size="14" fill="#000000" text-anchor="middle">+q</text>
            <text id="scene1-ball1-m" x="360" y="175" font-size="14" fill="#000000" text-anchor="middle">m</text>
            <!-- 球 1 进入深度标注 -->
            <text id="scene1-ball1-depth" x="420" y="200" font-size="12" fill="#c62828" text-anchor="middle" opacity="0">L</text>

            <!-- 杆 1-2（虚线） -->
            <line id="scene1-rod12" x1="400" y1="155" x2="400" y2="125" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>

            <!-- 球 2（中间） -->
            <circle id="scene1-ball2" cx="400" cy="110" r="15" fill="#1565c0" fill-opacity="0.2" stroke="#1565c0" stroke-width="2"/>
            <text id="scene1-ball2-q" x="430" y="115" font-size="14" fill="#000000" text-anchor="middle">+q</text>
            <text id="scene1-ball2-m" x="360" y="115" font-size="14" fill="#000000" text-anchor="middle">m</text>
            <!-- 球 2 进入深度标注 -->
            <text id="scene1-ball2-depth" x="420" y="140" font-size="12" fill="#c62828" text-anchor="middle" opacity="0">L</text>

            <!-- 杆 2-3（虚线） -->
            <line id="scene1-rod23" x1="400" y1="95" x2="400" y2="65" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>

            <!-- 球 3（最上） -->
            <circle id="scene1-ball3" cx="400" cy="50" r="15" fill="#1565c0" fill-opacity="0.2" stroke="#1565c0" stroke-width="2"/>
            <text id="scene1-ball3-q" x="430" y="55" font-size="14" fill="#000000" text-anchor="middle">+q</text>
            <text id="scene1-ball3-m" x="360" y="55" font-size="14" fill="#000000" text-anchor="middle">m</text>
            <!-- 球 3 进入深度标注 -->
            <text id="scene1-ball3-depth" x="420" y="80" font-size="12" fill="#c62828" text-anchor="middle" opacity="0">L</text>

            <!-- 最大速度标记（v_max） -->
            <circle id="scene1-vmax-point" cx="400" cy="260" r="4" fill="#2e7d32" opacity="0"/>
            <line id="scene1-vmax-arrow" x1="400" y1="260" x2="400" y2="220" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene1-arrowhead-green)" opacity="0"/>
            <text id="scene1-vmax-label" x="420" y="265" font-size="14" fill="#2e7d32" text-anchor="middle" opacity="0">v_max</text>

            <!-- 步骤 3 高亮（球 1 到达下极板） -->
            <circle id="scene1-ball1-final" cx="400" cy="350" r="15" fill="none" stroke="#ff5722" stroke-width="3" opacity="0"/>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 0/4</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现 - 平行板电容器三球系统
        // 布局坐标表（参考）：
        // 上极板：(200,170)-(600,170)，小孔 (390,170)-(410,170)
        // 下极板：(200,350)-(600,350)
        // 球 1 初始：(400,170)，球 2 初始：(400,110)，球 3 初始：(400,50)
        // 板间距离 d=3L=180px，杆长 L=60px
        // 最大速度位置：(400,260)

        const sceneConfig = {
            ballRadius: 15,
            rodLength: 60,  // L = 60px
            plateGap: 180,  // d = 3L = 180px
            ballPositions: {
                step0: { ball1: 170, ball2: 110, ball3: 50 },
                step1: { ball1: 230, ball2: 170, ball3: 110 },
                step2: { ball1: 290, ball2: 230, ball3: 170 },
                step3: { ball1: 350, ball2: 290, ball3: 230 }
            }
        };

        let currentStep = 0;
        const totalSteps = 4;

        // 工具函数：显示/隐藏元素
        function show(el) {
            if (el) { el.style.display = 'block'; el.style.opacity = '1'; }
        }
        function hide(el) {
            if (el) { el.style.display = 'none'; el.style.opacity = '0'; }
        }

        // 更新球的位置
        function updateBallPositions(step) {
            const positions = sceneConfig.ballPositions['step' + step];
            if (!positions) return;

            const ball1 = document.getElementById('scene1-ball1');
            const ball2 = document.getElementById('scene1-ball2');
            const ball3 = document.getElementById('scene1-ball3');
            const ball1Final = document.getElementById('scene1-ball1-final');

            // 更新球心 y 坐标
            ball1.setAttribute('cy', positions.ball1);
            ball2.setAttribute('cy', positions.ball2);
            ball3.setAttribute('cy', positions.ball3);

            // 更新杆的位置
            const rod12 = document.getElementById('scene1-rod12');
            const rod23 = document.getElementById('scene1-rod23');
            rod12.setAttribute('y1', positions.ball1 - sceneConfig.ballRadius);
            rod12.setAttribute('y2', positions.ball2 + sceneConfig.ballRadius);
            rod23.setAttribute('y1', positions.ball2 - sceneConfig.ballRadius);
            rod23.setAttribute('y2', positions.ball3 + sceneConfig.ballRadius);

            // 更新球 1 最终状态高亮圆（步骤 3）
            if (step === 3) {
                ball1Final.setAttribute('cy', positions.ball1);
                show(ball1Final);
            } else {
                hide(ball1Final);
            }
        }

        // 更新深度标注
        function updateDepthLabels(step) {
            const depth1 = document.getElementById('scene1-ball1-depth');
            const depth2 = document.getElementById('scene1-ball2-depth');
            const depth3 = document.getElementById('scene1-ball3-depth');

            // 重置所有标注
            hide(depth1);
            hide(depth2);
            hide(depth3);

            const positions = sceneConfig.ballPositions['step' + step];
            if (!positions) return;

            if (step >= 1) {
                // 球 1 进入深度
                depth1.textContent = step === 1 ? 'L' : (step === 2 ? '2L' : '3L=d');
                depth1.setAttribute('y', positions.ball1 + 25);
                show(depth1);
            }
            if (step >= 2) {
                // 球 2 进入深度
                depth2.textContent = step === 2 ? 'L' : '2L';
                depth2.setAttribute('y', positions.ball2 + 25);
                show(depth2);
            }
            if (step === 3) {
                // 球 3 进入深度
                depth3.textContent = 'L';
                depth3.setAttribute('y', positions.ball3 + 25);
                show(depth3);
            }
        }

        // 更新场景显示
        function updateScene() {
            // 更新步骤指示器
            const indicator = document.getElementById('scene1-step-indicator');
            indicator.textContent = '步骤 ' + currentStep + '/' + (totalSteps - 1);

            // 更新按钮状态
            const prevBtn = document.getElementById('scene1-btn-prev');
            const nextBtn = document.getElementById('scene1-btn-next');
            prevBtn.disabled = (currentStep === 0);
            nextBtn.disabled = (currentStep === totalSteps - 1);

            // 根据步骤更新显示
            switch(currentStep) {
                case 0:
                    // 初始状态：只显示基本结构，隐藏电场线、轨迹、深度标注、v_max
                    hide(document.getElementById('scene1-trajectory'));
                    hide(document.getElementById('scene1-field-line1'));
                    hide(document.getElementById('scene1-field-line2'));
                    hide(document.getElementById('scene1-field-line3'));
                    hide(document.getElementById('scene1-E-label'));
                    hide(document.getElementById('scene1-L1-label'));
                    hide(document.getElementById('scene1-L2-line'));
                    hide(document.getElementById('scene1-L2-arrow-top'));
                    hide(document.getElementById('scene1-L2-arrow-bottom'));
                    hide(document.getElementById('scene1-vmax-point'));
                    hide(document.getElementById('scene1-vmax-arrow'));
                    hide(document.getElementById('scene1-vmax-label'));
                    updateBallPositions(0);
                    updateDepthLabels(0);
                    break;

                case 1:
                    // 第一球进入电场 L，第二球刚进入
                    show(document.getElementById('scene1-trajectory'));
                    show(document.getElementById('scene1-field-line1'));
                    show(document.getElementById('scene1-field-line2'));
                    show(document.getElementById('scene1-field-line3'));
                    show(document.getElementById('scene1-E-label'));
                    show(document.getElementById('scene1-L1-label'));
                    hide(document.getElementById('scene1-L2-line'));
                    hide(document.getElementById('scene1-L2-arrow-top'));
                    hide(document.getElementById('scene1-L2-arrow-bottom'));
                    hide(document.getElementById('scene1-vmax-point'));
                    hide(document.getElementById('scene1-vmax-arrow'));
                    hide(document.getElementById('scene1-vmax-label'));
                    updateBallPositions(1);
                    updateDepthLabels(1);
                    break;

                case 2:
                    // 第一球进入电场 2L，第二球进入 L，第三球刚进入
                    show(document.getElementById('scene1-trajectory'));
                    show(document.getElementById('scene1-field-line1'));
                    show(document.getElementById('scene1-field-line2'));
                    show(document.getElementById('scene1-field-line3'));
                    show(document.getElementById('scene1-E-label'));
                    show(document.getElementById('scene1-L1-label'));
                    show(document.getElementById('scene1-L2-line'));
                    show(document.getElementById('scene1-L2-arrow-top'));
                    show(document.getElementById('scene1-L2-arrow-bottom'));
                    hide(document.getElementById('scene1-vmax-point'));
                    hide(document.getElementById('scene1-vmax-arrow'));
                    hide(document.getElementById('scene1-vmax-label'));
                    updateBallPositions(2);
                    updateDepthLabels(2);
                    break;

                case 3:
                    // 第一球到达下极板，速度为 0
                    show(document.getElementById('scene1-trajectory'));
                    show(document.getElementById('scene1-field-line1'));
                    show(document.getElementById('scene1-field-line2'));
                    show(document.getElementById('scene1-field-line3'));
                    show(document.getElementById('scene1-E-label'));
                    show(document.getElementById('scene1-L1-label'));
                    show(document.getElementById('scene1-L2-line'));
                    show(document.getElementById('scene1-L2-arrow-top'));
                    show(document.getElementById('scene1-L2-arrow-bottom'));
                    hide(document.getElementById('scene1-vmax-point'));
                    hide(document.getElementById('scene1-vmax-arrow'));
                    hide(document.getElementById('scene1-vmax-label'));
                    updateBallPositions(3);
                    updateDepthLabels(3);
                    break;

                case 4:
                    // 结论：最大速度位置
                    show(document.getElementById('scene1-trajectory'));
                    show(document.getElementById('scene1-field-line1'));
                    show(document.getElementById('scene1-field-line2'));
                    show(document.getElementById('scene1-field-line3'));
                    show(document.getElementById('scene1-E-label'));
                    show(document.getElementById('scene1-L1-label'));
                    show(document.getElementById('scene1-L2-line'));
                    show(document.getElementById('scene1-L2-arrow-top'));
                    show(document.getElementById('scene1-L2-arrow-bottom'));
                    show(document.getElementById('scene1-vmax-point'));
                    show(document.getElementById('scene1-vmax-arrow'));
                    show(document.getElementById('scene1-vmax-label'));
                    // 保持步骤 3 的球位置
                    updateBallPositions(3);
                    updateDepthLabels(3);
                    break;
            }
        }

        // 事件绑定
        document.getElementById('scene1-btn-prev').addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        document.getElementById('scene1-btn-next').addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateScene();
            }
        });

        // 初始化
        updateScene();
    })();
    </script>
</body>
</html>
