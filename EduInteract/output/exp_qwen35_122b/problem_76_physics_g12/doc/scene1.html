<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三物体系统动量守恒 - 场景 1</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene1-controls button { padding: 8px 20px; font-size: 14px; cursor: pointer; border: 1px solid #333; border-radius: 4px; background: #f5f5f5; }
        #scene1-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene1-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-step-indicator { position: absolute; bottom: 55px; left: 50%; transform: translateX(-50%); font-size: 14px; color: #333; }
        .scene1-transition { transition: all 0.3s ease-in-out; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- 地面：水平线 + 斜阴影线 -->
            <line x1="50" y1="350" x2="750" y2="350" stroke="#000000" stroke-width="2"/>
            <g id="scene1-ground-hatching"></g>

            <!-- 木块 A：矩形 (150,270)-(300,350)，150×80 -->
            <rect id="scene1-block-A" x="150" y="270" width="150" height="80" fill="#1565c0" fill-opacity="0.2" stroke="#000000" stroke-width="2" class="scene1-transition"/>
            <!-- 木块 B：矩形 (300,270)-(450,350)，150×80 -->
            <rect id="scene1-block-B" x="300" y="270" width="150" height="80" fill="#1565c0" fill-opacity="0.2" stroke="#000000" stroke-width="2" class="scene1-transition"/>

            <!-- 物块 C：矩形 50×50，位置根据步骤变化 -->
            <rect id="scene1-block-C" x="150" y="220" width="50" height="50" fill="#c62828" fill-opacity="0.2" stroke="#000000" stroke-width="2" class="scene1-transition"/>

            <!-- 标签 "A"：移到木块 A 下方 (225,370) -->
            <text id="scene1-label-A" x="225" y="370" font-size="18" fill="#000000" text-anchor="middle">A</text>
            <!-- 标签 "B"：移到木块 B 下方 (375,370) -->
            <text id="scene1-label-B" x="375" y="370" font-size="18" fill="#000000" text-anchor="middle">B</text>
            <!-- 标签 "C"：移到物块 C 左侧 (135,245) -->
            <text id="scene1-label-C" x="135" y="245" font-size="18" fill="#000000" text-anchor="end">C</text>

            <!-- 质量标签（上移避免与木块重叠） -->
            <!-- m_A=0.5kg：(225,220) - 木块 A 上方 -->
            <text id="scene1-label-mA" x="225" y="220" font-size="14" fill="#000000" text-anchor="middle">m_A=0.5kg</text>
            <!-- m_B=0.3kg：(375,220) - 木块 B 上方 -->
            <text id="scene1-label-mB" x="375" y="220" font-size="14" fill="#000000" text-anchor="middle">m_B=0.3kg</text>
            <!-- m_C=0.08kg：(175,165) - 物块 C 上方 -->
            <text id="scene1-label-mC" x="175" y="165" font-size="14" fill="#000000" text-anchor="middle">m_C=0.08kg</text>

            <!-- 速度矢量 v_0=25m/s：箭头 (150,210)-(230,210)，标签 (185,145) -->
            <g id="scene1-group-v0" style="display: none;">
                <line id="scene1-arrow-v0" x1="150" y1="210" x2="220" y2="210" stroke="#000000" stroke-width="2"/>
                <polygon points="220,210 210,205 210,215" fill="#000000"/>
                <text id="scene1-label-v0" x="185" y="145" font-size="14" fill="#000000" text-anchor="middle">v_0=25m/s</text>
            </g>

            <!-- 速度矢量 v_A：灰色虚线箭头 (280,255)-(340,255)，标签 (310,205) - 上移避免与 C 拥挤 -->
            <g id="scene1-group-vA" style="display: none;">
                <line id="scene1-arrow-vA" x1="280" y1="255" x2="330" y2="255" stroke="#888880" stroke-width="2" stroke-dasharray="5,5"/>
                <polygon points="330,255 320,250 320,260" fill="#888880"/>
                <text id="scene1-label-vA" x="305" y="205" font-size="14" fill="#888880" text-anchor="middle">v_A</text>
            </g>

            <!-- 速度矢量 v_B：黑色实线箭头 (400,255)-(460,255) -->
            <g id="scene1-group-vB" style="display: none;">
                <line id="scene1-arrow-vB" x1="400" y1="255" x2="450" y2="255" stroke="#000000" stroke-width="2"/>
                <polygon points="450,255 440,250 440,260" fill="#000000"/>
            </g>

            <!-- 最终速度矢量 v_final=2.5m/s：箭头 (350,210)-(430,210)，标签 (390,185) - 上移避免拥挤 -->
            <g id="scene1-group-vFinal" style="display: none;">
                <line id="scene1-arrow-vFinal" x1="350" y1="210" x2="420" y2="210" stroke="#000000" stroke-width="2"/>
                <polygon points="420,210 410,205 410,215" fill="#000000"/>
                <text id="scene1-label-vFinal" x="385" y="185" font-size="14" fill="#000000" text-anchor="middle">v=2.5m/s</text>
            </g>
        </svg>

        <div id="scene1-step-indicator">步骤 1/5</div>

        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        var currentStep = 0;
        var totalSteps = 5;

        // 物块 C 在各步骤的位置 [x, y]
        var cPositions = [
            [150, 220],  // 步骤 0: 初始位置（A 左端上方）
            [200, 220],  // 步骤 1: C 在 A 中部上方
            [300, 220],  // 步骤 2: C 刚滑离 A（B 左端上方）
            [325, 220],  // 步骤 3: C 在 B 中部上方
            [325, 220]   // 步骤 4: 最终停在 B 上
        ];

        var blockC = document.getElementById('scene1-block-C');
        var labelC = document.getElementById('scene1-label-C');
        var groupV0 = document.getElementById('scene1-group-v0');
        var groupVA = document.getElementById('scene1-group-vA');
        var groupVB = document.getElementById('scene1-group-vB');
        var groupVFinal = document.getElementById('scene1-group-vFinal');
        var btnPrev = document.getElementById('scene1-btn-prev');
        var btnNext = document.getElementById('scene1-btn-next');
        var stepIndicator = document.getElementById('scene1-step-indicator');

        function generateGroundHatching() {
            var hatchingGroup = document.getElementById('scene1-ground-hatching');
            for (var i = 50; i <= 750; i += 10) {
                var line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', i);
                line.setAttribute('y1', 350);
                line.setAttribute('x2', i - 8);
                line.setAttribute('y2', 360);
                line.setAttribute('stroke', '#000000');
                line.setAttribute('stroke-width', '1');
                hatchingGroup.appendChild(line);
            }
        }

        function show(el) {
            el.style.display = 'block';
            el.style.opacity = '1';
        }

        function hide(el) {
            el.style.display = 'none';
            el.style.opacity = '0';
        }

        function renderStep(step) {
            var cPos = cPositions[step];
            blockC.setAttribute('x', cPos[0]);
            blockC.setAttribute('y', cPos[1]);
            // 标签 C 始终在物块 C 左侧，保持固定位置避免重叠
            labelC.setAttribute('x', cPos[0] - 5);
            labelC.setAttribute('y', cPos[1] + 25);

            switch(step) {
                case 0:
                    show(groupV0);
                    hide(groupVA);
                    hide(groupVB);
                    hide(groupVFinal);
                    break;
                case 1:
                    show(groupV0);
                    hide(groupVA);
                    hide(groupVB);
                    hide(groupVFinal);
                    break;
                case 2:
                    hide(groupV0);
                    show(groupVA);
                    show(groupVB);
                    hide(groupVFinal);
                    break;
                case 3:
                    hide(groupV0);
                    show(groupVA);
                    show(groupVB);
                    hide(groupVFinal);
                    break;
                case 4:
                    hide(groupV0);
                    show(groupVA);
                    hide(groupVB);
                    show(groupVFinal);
                    break;
            }

            stepIndicator.textContent = '步骤 ' + (step + 1) + '/' + totalSteps;
            btnPrev.disabled = (step === 0);
            btnNext.disabled = (step === totalSteps - 1);
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep(currentStep);
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                renderStep(currentStep);
            }
        });

        function init() {
            generateGroundHatching();
            renderStep(currentStep);
        }

        init();
    })();
    </script>
</body>
</html>
