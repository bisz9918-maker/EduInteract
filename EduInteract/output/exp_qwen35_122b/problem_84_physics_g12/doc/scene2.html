<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 电磁感应中金属棒的运动过程与能量转化关系</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene2-btn {
            width: 80px; height: 30px;
            background: #1976d2; color: white;
            border: none; border-radius: 4px;
            font-size: 14px; cursor: pointer;
        }
        .scene2-btn:disabled {
            background: #bdbdbd; cursor: not-allowed;
        }
        .scene2-btn:hover:not(:disabled) {
            background: #1565c0;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- ====== v-t 坐标系框架 ====== -->
            <!-- t 轴 -->
            <line id="scene2-t-axis" x1="60" y1="340" x2="340" y2="340" stroke="#000000" stroke-width="2"/>
            <!-- v 轴 -->
            <line id="scene2-v-axis" x1="60" y1="340" x2="60" y2="40" stroke="#000000" stroke-width="2"/>
            <!-- t 轴标签 -->
            <text id="scene2-t-label" x="320" y="360" font-size="16" fill="#000000">t(s)</text>
            <!-- v 轴标签 -->
            <text id="scene2-v-label" x="30" y="50" font-size="16" fill="#000000">v(m/s)</text>
            
            <!-- ====== v-t 曲线 ====== -->
            <!-- 指数增长曲线 v(t) = v_m × (1 - e^(-kt))，从 (60,340) 到 (340,140) -->
            <path id="scene2-vt-curve" d="M 60 340 C 100 300, 180 200, 340 140" 
                  fill="none" stroke="#000000" stroke-width="2" 
                  display="block"/>
            
            <!-- ====== v_m 渐近线（步骤 1 显示） ====== -->
            <line id="scene2-vm-asymptote" x1="60" y1="140" x2="340" y2="140" 
                  stroke="#1565c0" stroke-width="1.5" stroke-dasharray="5,5" 
                  display="none"/>
            <text id="scene2-vm-label" x="260" y="125" font-size="16" fill="#1565c0" font-weight="bold" display="none">v_m=2m/s</text>
            
            <!-- ====== 电量公式区（无背景框） ====== -->
            <!-- 电量公式文本：行间距增加到 35px，最后一行移到 y=215 以避开能量标题 -->
            <text id="scene2-q-formula" x="395" y="65" font-size="16" fill="#000000">q = BLx/(R+r)</text>
            <text id="scene2-q-value" x="395" y="105" font-size="16" fill="#000000" display="none">q = 2.8C</text>
            <text id="scene2-x-formula" x="395" y="215" font-size="16" fill="#000000" display="none">x = q(R+r)/(BL) = 2.8m</text>
            
            <!-- ====== 能量条形图框架 ====== -->
            <!-- 条形图标题：移到 y=245 以避开电量公式 -->
            <text id="scene2-energy-title" x="560" y="245" font-size="16" fill="#000000" text-anchor="middle">能量分配 (J)</text>
            
            <!-- W_F 条形（蓝色，8.4J，高度 100px）：底部在 y=320，标签在 y=345 -->
            <rect id="scene2-wf-bar" x="420" y="220" width="80" height="100" 
                  fill="#1565c0" display="none"/>
            <text id="scene2-wf-label" x="460" y="345" font-size="14" fill="#000000" text-anchor="middle" display="none">W_F</text>
            
            <!-- ΔE_k 条形（绿色，0.4J，高度 30px）：底部在 y=320，标签在 y=345 -->
            <rect id="scene2-deltake-bar" x="520" y="290" width="60" height="30" 
                  fill="#2e7d32" display="none"/>
            <text id="scene2-deltake-label" x="550" y="345" font-size="14" fill="#000000" text-anchor="middle" display="none">ΔE_k</text>
            
            <!-- Q_f 条形（红色，2.8J，高度 70px）：底部在 y=320，标签在 y=345 -->
            <rect id="scene2-qf-bar" x="600" y="250" width="60" height="70" 
                  fill="#c62828" display="none"/>
            <text id="scene2-qf-label" x="630" y="345" font-size="14" fill="#000000" text-anchor="middle" display="none">Q_f</text>
            
            <!-- Q_总 条形（红色，5.2J，高度 90px）：底部在 y=320，标签在 y=345 -->
            <rect id="scene2-qtotal-bar" x="680" y="230" width="60" height="90" 
                  fill="#c62828" display="none"/>
            <text id="scene2-qtotal-label" x="710" y="345" font-size="14" fill="#000000" text-anchor="middle" display="none">Q_总</text>
            
            <!-- ====== 热量结果（无背景框） ====== -->
            <text id="scene2-qr-result" x="395" y="390" font-size="18" fill="#2e7d32" font-weight="bold" display="none">Q_R = 4.16J</text>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-prev-btn" class="scene2-btn" disabled>◀ 上一步</button>
            <button id="scene2-next-btn" class="scene2-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // ====== Scene 2 实现 ======
        // 布局坐标表（实现对照依据）：
        // | 元素 | 位置/范围 | 大小 | 备注 |
        // |------|-----------|------|------|
        // | v-t 坐标系 | (60,40)-(340,340) | 280×300 | 左侧图表区 |
        // | t 轴标签 | (320,360) | - | "t(s)" |
        // | v 轴标签 | (30,50) | - | "v(m/s)" |
        // | v_m 标签 | (260,125) | - | "v_m=2m/s" |
        // | 电量公式区 | (395,65)-(740,215) | - | 无背景框，行间距 35-110px |
        // | 能量条形图 | (420,220)-(740,345) | 360×160 | 右侧能量分配区 |
        // | 热量结果 | (395,390) | - | 无背景框 |
        // | 控件栏 | (280,440)-(520,490) | 240×50 | 底部居中 |
        
        // 状态机：currentStep (0-4)
        let currentStep = 0;
        const totalSteps = 4;
        
        // 步骤配置：每步应显示的元素 ID 列表
        const steps = [
            // 步骤 0：初始状态
            {
                show: ['scene2-vt-curve', 'scene2-q-formula'],
                hide: ['scene2-vm-asymptote', 'scene2-vm-label', 'scene2-q-value', 'scene2-x-formula',
                       'scene2-wf-bar', 'scene2-wf-label', 'scene2-deltake-bar', 'scene2-deltake-label',
                       'scene2-qf-bar', 'scene2-qf-label', 'scene2-qtotal-bar', 'scene2-qtotal-label',
                       'scene2-qr-result']
            },
            // 步骤 1：新增 v_m 渐近线和标签
            {
                show: ['scene2-vt-curve', 'scene2-vm-asymptote', 'scene2-vm-label', 'scene2-q-formula'],
                hide: ['scene2-q-value', 'scene2-x-formula',
                       'scene2-wf-bar', 'scene2-wf-label', 'scene2-deltake-bar', 'scene2-deltake-label',
                       'scene2-qf-bar', 'scene2-qf-label', 'scene2-qtotal-bar', 'scene2-qtotal-label',
                       'scene2-qr-result']
            },
            // 步骤 2：新增电量数值和位移计算公式
            {
                show: ['scene2-vt-curve', 'scene2-vm-asymptote', 'scene2-vm-label', 'scene2-q-formula', 'scene2-q-value', 'scene2-x-formula'],
                hide: ['scene2-wf-bar', 'scene2-wf-label', 'scene2-deltake-bar', 'scene2-deltake-label',
                       'scene2-qf-bar', 'scene2-qf-label', 'scene2-qtotal-bar', 'scene2-qtotal-label',
                       'scene2-qr-result']
            },
            // 步骤 3：新增能量分配条形图
            {
                show: ['scene2-vt-curve', 'scene2-vm-asymptote', 'scene2-vm-label', 'scene2-q-formula', 'scene2-q-value', 'scene2-x-formula',
                       'scene2-wf-bar', 'scene2-wf-label', 'scene2-deltake-bar', 'scene2-deltake-label',
                       'scene2-qf-bar', 'scene2-qf-label', 'scene2-qtotal-bar', 'scene2-qtotal-label'],
                hide: ['scene2-qr-result']
            },
            // 步骤 4：新增热量结果
            {
                show: ['scene2-vt-curve', 'scene2-vm-asymptote', 'scene2-vm-label', 'scene2-q-formula', 'scene2-q-value', 'scene2-x-formula',
                       'scene2-wf-bar', 'scene2-wf-label', 'scene2-deltake-bar', 'scene2-deltake-label',
                       'scene2-qf-bar', 'scene2-qf-label', 'scene2-qtotal-bar', 'scene2-qtotal-label',
                       'scene2-qr-result'],
                hide: []
            }
        ];
        
        // 工具函数：显示元素
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }
        
        // 工具函数：隐藏元素
        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }
        
        // 更新当前步骤显示
        function updateDisplay() {
            const config = steps[currentStep];
            
            // 先隐藏所有可能显示的元素
            config.hide.forEach(hideElement);
            
            // 再显示当前步骤需要的元素
            config.show.forEach(showElement);
            
            // 更新按钮状态
            const prevBtn = document.getElementById('scene2-prev-btn');
            const nextBtn = document.getElementById('scene2-next-btn');
            
            prevBtn.disabled = (currentStep === 0);
            
            if (currentStep === totalSteps) {
                nextBtn.style.display = 'none';
            } else {
                nextBtn.style.display = 'block';
            }
        }
        
        // 绑定按钮事件
        document.getElementById('scene2-prev-btn').addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        });
        
        document.getElementById('scene2-next-btn').addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateDisplay();
            }
        });
        
        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
