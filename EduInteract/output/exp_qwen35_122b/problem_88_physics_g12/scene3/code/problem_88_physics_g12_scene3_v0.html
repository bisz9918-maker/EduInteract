<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 3 - 电磁感应中的能量转化</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene3-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 2px solid #333; border-radius: 4px; background: #fff; }
        .scene3-btn:hover { background: #f0f0f0; }
        .scene3-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene3-step-indicator { position: absolute; bottom: 15px; right: 20px; font-size: 14px; color: #666; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg width="800" height="500" id="scene3-svg">
            <!-- 能量转化流程图背景 - 缩小宽度，左移 -->
            <rect id="scene3-flow-bg" x="10" y="50" width="180" height="350" fill="#f5f5f5" stroke="#cccccc" stroke-width="1"/>
            
            <!-- W_F 框（拉力做功）- 文字放在框内居中 -->
            <rect id="scene3-wf-box" x="30" y="80" width="120" height="40" fill="#2e7d32" fill-opacity="0.2" stroke="#2e7d32" stroke-width="2"/>
            <text id="scene3-wf-label" x="90" y="105" text-anchor="middle" font-size="16" fill="#2e7d32" font-weight="bold">W_F</text>
            
            <!-- ΔE_p 框（重力势能）- 文字放在框内居中 -->
            <rect id="scene3-delp-box" x="30" y="170" width="120" height="40" fill="#1565c0" fill-opacity="0.2" stroke="#1565c0" stroke-width="2"/>
            <text id="scene3-delp-label" x="90" y="195" text-anchor="middle" font-size="16" fill="#1565c0" font-weight="bold">ΔE_p</text>
            
            <!-- Q 框（焦耳热）- 文字放在框内居中 -->
            <rect id="scene3-q-box" x="30" y="260" width="120" height="40" fill="#c62828" fill-opacity="0.2" stroke="#c62828" stroke-width="2"/>
            <text id="scene3-q-label" x="90" y="285" text-anchor="middle" font-size="16" fill="#c62828" font-weight="bold">Q</text>
            
            <!-- W_F→ΔE_p 箭头 -->
            <line id="scene3-arrow1" x1="90" y1="120" x2="90" y2="170" stroke="#888888" stroke-width="2"/>
            <polygon id="scene3-arrow1-head" points="90,170 85,160 95,160" fill="#888888"/>
            
            <!-- W_F→Q 箭头（步骤 1 显示） -->
            <line id="scene3-arrow2" x1="130" y1="120" x2="170" y2="260" stroke="#888888" stroke-width="2" style="display:none;"/>
            <polygon id="scene3-arrow2-head" points="170,260 163,252 173,248" fill="#888888" style="display:none;"/>
            
            <!-- 金属棒位置示意图区域 - 整体右移，轨道左轨圆心 (550,150) -->
            <!-- 圆弧轨道左轨 -->
            <path id="scene3-arc-left" d="M 550,250 A 100,100 0 0,1 450,150" fill="none" stroke="#333333" stroke-width="3"/>
            <!-- 圆弧轨道右轨 -->
            <path id="scene3-arc-right" d="M 750,250 A 100,100 0 0,1 650,150" fill="none" stroke="#333333" stroke-width="3"/>
            
            <!-- cd 金属棒（初始位置）- y=250，右移 -->
            <line id="scene3-cd-rod" x1="550" y1="250" x2="750" y2="250" stroke="#333333" stroke-width="4"/>
            <text id="scene3-cd-label" x="540" y="265" font-size="14" fill="#000000">cd</text>
            
            <!-- ab 金属棒（末位置，步骤 1 显示）- y=150 -->
            <line id="scene3-ab-rod" x1="450" y1="150" x2="650" y2="150" stroke="#333333" stroke-width="4" stroke-dasharray="5,5" style="display:none;"/>
            <text id="scene3-ab-label" x="440" y="135" font-size="14" fill="#000000">ab</text>
            
            <!-- 半径 r 标注 -->
            <text id="scene3-r-label" x="600" y="130" font-size="14" fill="#000000">r</text>
            <line id="scene3-r-line" x1="550" y1="150" x2="650" y2="150" stroke="#666666" stroke-width="1" stroke-dasharray="3,3"/>
            
            <!-- 间距 L 标注 - 在 cd 棒右侧 -->
            <text id="scene3-L-label" x="760" y="265" font-size="14" fill="#000000">L</text>
            
            <!-- B 磁场箭头组（竖直向上）- 覆盖轨道区域 -->
            <line id="scene3-b-arrow1" x1="500" y1="250" x2="500" y2="100" stroke="#333333" stroke-width="2"/>
            <polygon id="scene3-b-arrow1-head" points="500,100 495,110 505,110" fill="#333333"/>
            <line id="scene3-b-arrow2" x1="550" y1="250" x2="550" y2="100" stroke="#333333" stroke-width="2"/>
            <polygon id="scene3-b-arrow2-head" points="550,100 545,110 555,110" fill="#333333"/>
            <line id="scene3-b-arrow3" x1="600" y1="250" x2="600" y2="100" stroke="#333333" stroke-width="2"/>
            <polygon id="scene3-b-arrow3-head" points="600,100 595,110 605,110" fill="#333333"/>
            <line id="scene3-b-arrow4" x1="650" y1="250" x2="650" y2="100" stroke="#333333" stroke-width="2"/>
            <polygon id="scene3-b-arrow4-head" points="650,100 645,110 655,110" fill="#333333"/>
            <line id="scene3-b-arrow5" x1="700" y1="250" x2="700" y2="100" stroke="#333333" stroke-width="2"/>
            <polygon id="scene3-b-arrow5-head" points="700,100 695,110 705,110" fill="#333333"/>
            <line id="scene3-b-arrow6" x1="750" y1="250" x2="750" y2="100" stroke="#333333" stroke-width="2"/>
            <polygon id="scene3-b-arrow6-head" points="750,100 745,110 755,110" fill="#333333"/>
            <text id="scene3-b-label" x="480" y="90" font-size="14" fill="#000000" font-weight="bold">B</text>
            
            <!-- 公式框（步骤 1 显示）- 在轨道图下方，y=270 开始，右移避免与 cd 重叠 -->
            <rect id="scene3-formula-box" x="480" y="270" width="260" height="70" fill="#ffffff" stroke="#333333" stroke-width="2" style="display:none;"/>
            <text id="scene3-formula-text" x="490" y="295" font-size="13" fill="#000000" style="display:none;"></text>
            
            <!-- 能量柱状图（步骤 2 显示）- 在公式框下方，y=360 开始 -->
            <!-- 柱 1: W_F -->
            <rect id="scene3-bar1" x="470" y="370" width="70" height="50" fill="#2e7d32" fill-opacity="0.3" stroke="#2e7d32" stroke-width="2" style="display:none;"/>
            <text id="scene3-bar1-label" x="505" y="435" text-anchor="middle" font-size="13" fill="#000000" style="display:none;">W_F</text>
            
            <!-- 柱 2: ΔE_p -->
            <rect id="scene3-bar2" x="580" y="390" width="70" height="30" fill="#1565c0" fill-opacity="0.3" stroke="#1565c0" stroke-width="2" style="display:none;"/>
            <text id="scene3-bar2-label" x="615" y="435" text-anchor="middle" font-size="13" fill="#000000" style="display:none;">ΔE_p</text>
            
            <!-- 柱 3: Q -->
            <rect id="scene3-bar3" x="690" y="390" width="70" height="30" fill="#c62828" fill-opacity="0.3" stroke="#c62828" stroke-width="2" style="display:none;"/>
            <text id="scene3-bar3-label" x="725" y="435" text-anchor="middle" font-size="13" fill="#000000" style="display:none;">Q</text>
            
            <!-- 柱状图标题 -->
            <text id="scene3-bar-title" x="610" y="360" text-anchor="middle" font-size="13" fill="#000000" font-weight="bold" style="display:none;">能量分配</text>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene3-controls">
            <button id="scene3-btn-prev" class="scene3-btn">◀ 上一步</button>
            <button id="scene3-btn-next" class="scene3-btn">下一步 ▶</button>
        </div>
        <div id="scene3-step-indicator">步骤 1/5</div>
    </div>
    
    <script>
    (function() {
        // Scene 3 实现 - 电磁感应中的能量转化
        
        const TOTAL_STEPS = 5;
        let currentStep = 0;
        
        // 元素引用
        const svg = document.getElementById('scene3-svg');
        const prevBtn = document.getElementById('scene3-btn-prev');
        const nextBtn = document.getElementById('scene3-btn-next');
        const stepIndicator = document.getElementById('scene3-step-indicator');
        
        // 公式文本内容（按步骤）
        const formulas = [
            '',  // 步骤 0：无公式
            'Q = I²(R + R/3)t<br>E = BLv₀sinθ',  // 步骤 1：焦耳热计算
            'W_F = ΔE_p + Q',  // 步骤 2：功能关系
            'W_F = mgr + Q',  // 步骤 3：拉力做功
            'W_F = ΔE_p + Q_R + Q_r'  // 步骤 4：能量守恒完整形式
        ];
        
        // 显示/隐藏元素列表
        const elementsByStep = {
            // 步骤 1 新增：ab 棒、箭头 2、公式框
            step1: ['scene3-ab-rod', 'scene3-ab-label', 'scene3-arrow2', 'scene3-arrow2-head', 'scene3-formula-box', 'scene3-formula-text'],
            // 步骤 2 新增：柱状图
            step2: ['scene3-bar1', 'scene3-bar1-label', 'scene3-bar2', 'scene3-bar2-label', 'scene3-bar3', 'scene3-bar3-label', 'scene3-bar-title'],
            // 步骤 3：高亮ΔE_p 柱体
            step3: ['scene3-bar2'],
            // 步骤 4：高亮所有柱体，Q 框内显示子标签
            step4: ['scene3-bar1', 'scene3-bar2', 'scene3-bar3', 'scene3-q-label']
        };
        
        // 更新场景显示
        function updateScene() {
            // 更新步骤指示器
            stepIndicator.textContent = `步骤${currentStep + 1}/${TOTAL_STEPS}`;
            
            // 更新按钮状态
            prevBtn.disabled = currentStep === 0;
            nextBtn.disabled = currentStep === TOTAL_STEPS - 1;
            
            // 更新公式文本
            const formulaText = document.getElementById('scene3-formula-text');
            if (currentStep >= 1) {
                formulaText.innerHTML = formulas[currentStep];
                formulaText.style.display = 'block';
            } else {
                formulaText.style.display = 'none';
            }
            
            // 根据步骤显示/隐藏元素
            for (let step = 1; step <= currentStep; step++) {
                const stepKey = 'step' + step;
                if (elementsByStep[stepKey]) {
                    elementsByStep[stepKey].forEach(id => {
                        const el = document.getElementById(id);
                        if (el) {
                            el.style.display = 'block';
                            el.style.opacity = '1';
                        }
                    });
                }
            }
            
            // 步骤 3：高亮ΔE_p 柱体
            if (currentStep === 3) {
                const bar2 = document.getElementById('scene3-bar2');
                if (bar2) {
                    bar2.setAttribute('stroke-width', '4');
                }
            } else {
                const bar2 = document.getElementById('scene3-bar2');
                if (bar2) {
                    bar2.setAttribute('stroke-width', '2');
                }
            }
            
            // 步骤 4：高亮所有柱体
            if (currentStep === 4) {
                ['scene3-bar1', 'scene3-bar2', 'scene3-bar3'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) {
                        el.setAttribute('stroke-width', '4');
                    }
                });
                // Q 框内显示子标签
                const qLabel = document.getElementById('scene3-q-label');
                if (qLabel) {
                    qLabel.innerHTML = 'Q<br><tspan font-size="12">Q_R + Q_r</tspan>';
                }
            } else if (currentStep < 4) {
                const qLabel = document.getElementById('scene3-q-label');
                if (qLabel) {
                    qLabel.innerHTML = 'Q';
                }
            }
        }
        
        // 事件绑定
        prevBtn.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });
        
        nextBtn.addEventListener('click', () => {
            if (currentStep < TOTAL_STEPS - 1) {
                currentStep++;
                updateScene();
            }
        });
        
        // 初始化
        updateScene();
    })();
    </script>
</body>
</html>
