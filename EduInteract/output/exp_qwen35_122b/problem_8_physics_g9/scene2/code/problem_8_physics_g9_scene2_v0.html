<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 串联电路故障分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; z-index: 10; padding: 0 20px; }
        .scene2-btn { 
            width: 140px; height: 40px; 
            border: 2px solid #666; 
            border-radius: 6px; 
            background: #e0e0e0; 
            cursor: pointer; 
            font-size: 14px; 
            font-weight: bold;
            color: #333;
            transition: all 0.2s;
        }
        .scene2-btn:hover { background: #d0d0d0; }
        .scene2-btn.active-normal { background: #1565c0; color: white; border-color: #0d47a1; }
        .scene2-btn.active-short { background: #2e7d32; color: white; border-color: #1b5e20; }
        .scene2-btn.active-open { background: #c62828; color: white; border-color: #b71c1c; }
        #scene2-status-box { 
            position: absolute; 
            top: 30px; right: 10px; 
            width: 230px; height: 120px; 
            background: #f5f5f5; 
            border: 2px solid #ccc; 
            border-radius: 8px; 
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        #scene2-status-text { 
            font-size: 14px; 
            line-height: 1.7; 
            color: #333;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" id="scene2-svg">
            <!-- 导线层 -->
            <g id="scene2-wires">
                <!-- 电源到 L₁ -->
                <line x1="660" y1="330" x2="660" y2="175" stroke="#000" stroke-width="2"/>
                <line x1="660" y1="175" x2="630" y2="175" stroke="#000" stroke-width="2"/>
                <!-- L₁到开关 -->
                <line x1="570" y1="155" x2="570" y2="115" stroke="#000" stroke-width="2"/>
                <line x1="570" y1="115" x2="220" y2="115" stroke="#000" stroke-width="2"/>
                <!-- 开关到 L₂ -->
                <line x1="140" y1="115" x2="140" y2="295" stroke="#000" stroke-width="2"/>
                <line x1="140" y1="295" x2="180" y2="295" stroke="#000" stroke-width="2"/>
                <!-- L₂到电源 -->
                <line x1="180" y1="335" x2="500" y2="335" stroke="#000" stroke-width="2"/>
                <line x1="500" y1="335" x2="500" y2="350" stroke="#000" stroke-width="2"/>
                <line x1="500" y1="350" x2="620" y2="350" stroke="#000" stroke-width="2"/>
            </g>
            
            <!-- 电压表接线层 -->
            <g id="scene2-voltmeter-wires">
                <line x1="240" y1="220" x2="240" y2="315" stroke="#000" stroke-width="2"/>
                <line x1="210" y1="250" x2="210" y2="335" stroke="#000" stroke-width="2"/>
            </g>
            
            <!-- 电压表 -->
            <g id="scene2-voltmeter">
                <rect x="350" y="200" width="120" height="70" fill="#fff" stroke="#9e9e9e" stroke-width="2" id="scene2-voltmeter-frame"/>
                <!-- 表盘刻度 -->
                <line x1="370" y1="250" x2="370" y2="245" stroke="#666" stroke-width="1"/>
                <line x1="385" y1="245" x2="385" y2="240" stroke="#666" stroke-width="1"/>
                <line x1="400" y1="242" x2="400" y2="238" stroke="#666" stroke-width="1"/>
                <line x1="415" y1="245" x2="415" y2="240" stroke="#666" stroke-width="1"/>
                <line x1="430" y1="250" x2="430" y2="245" stroke="#666" stroke-width="1"/>
                <!-- 指针 -->
                <line x1="400" y1="240" x2="400" y2="220" stroke="#333" stroke-width="2" id="scene2-voltmeter-needle"/>
                <!-- V 标签移到电压表上方 -->
                <text x="410" y="185" font-size="28" font-weight="bold" text-anchor="middle" fill="#333">V</text>
            </g>
            
            <!-- L₁灯泡 -->
            <g id="scene2-bulb-l1">
                <ellipse cx="600" cy="155" rx="30" ry="20" fill="#9e9e9e" id="scene2-bulb-l1-fill"/>
                <text x="520" y="125" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">L₁</text>
                <!-- 故障高亮框 -->
                <rect x="570" y="125" width="60" height="60" fill="none" stroke="#2e7d32" stroke-width="3" stroke-dasharray="5,3" id="scene2-bulb-l1-highlight" style="display:none;"/>
                <!-- 断路标记 -->
                <circle cx="600" cy="155" r="8" fill="#c62828" id="scene2-bulb-l1-break" style="display:none;"/>
            </g>
            
            <!-- L₂灯泡 -->
            <g id="scene2-bulb-l2">
                <ellipse cx="180" cy="315" rx="30" ry="20" fill="#9e9e9e" id="scene2-bulb-l2-fill"/>
                <text x="180" y="365" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">L₂</text>
                <!-- 故障高亮框 -->
                <rect x="150" y="285" width="60" height="60" fill="none" stroke="#2e7d32" stroke-width="3" stroke-dasharray="5,3" id="scene2-bulb-l2-highlight" style="display:none;"/>
                <!-- 断路标记 -->
                <circle cx="180" cy="315" r="8" fill="#c62828" id="scene2-bulb-l2-break" style="display:none;"/>
            </g>
            
            <!-- 开关 -->
            <g id="scene2-switch">
                <rect x="140" y="100" width="80" height="30" fill="#fff" stroke="#333" stroke-width="2"/>
                <line x1="150" y1="115" x2="210" y2="115" stroke="#333" stroke-width="2"/>
                <text x="180" y="85" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">开关</text>
            </g>
            
            <!-- 电源 -->
            <g id="scene2-power">
                <rect x="620" y="330" width="80" height="20" fill="#fff" stroke="#333" stroke-width="2"/>
                <line x1="630" y1="340" x2="690" y2="340" stroke="#333" stroke-width="2"/>
                <text x="660" y="365" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">电源</text>
            </g>
            
            <!-- 电压表标签 - 移到更上方 -->
            <text x="410" y="150" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">电压表</text>
        </svg>
        
        <!-- 状态描述框 -->
        <div id="scene2-status-box">
            <div id="scene2-status-text">正常：L₁亮，L₂亮，电压表有示数</div>
        </div>
        
        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button class="scene2-btn active-normal" id="scene2-btn-normal">正常</button>
            <button class="scene2-btn" id="scene2-btn-l1-short">L₁短路</button>
            <button class="scene2-btn" id="scene2-btn-l1-open">L₁断路</button>
            <button class="scene2-btn" id="scene2-btn-l2-short">L₂短路</button>
            <button class="scene2-btn" id="scene2-btn-l2-open">L₂断路</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现 - 串联电路故障分析
        
        // 状态定义
        const STATE_NORMAL = 0;
        const STATE_L1_SHORT = 1;
        const STATE_L1_OPEN = 2;
        const STATE_L2_SHORT = 3;
        const STATE_L2_OPEN = 4;
        
        let currentStatus = STATE_NORMAL;
        
        // 元素引用
        const bulbL1Fill = document.getElementById('scene2-bulb-l1-fill');
        const bulbL2Fill = document.getElementById('scene2-bulb-l2-fill');
        const voltmeterFrame = document.getElementById('scene2-voltmeter-frame');
        const voltmeterNeedle = document.getElementById('scene2-voltmeter-needle');
        const statusText = document.getElementById('scene2-status-text');
        
        const l1Highlight = document.getElementById('scene2-bulb-l1-highlight');
        const l1Break = document.getElementById('scene2-bulb-l1-break');
        const l2Highlight = document.getElementById('scene2-bulb-l2-highlight');
        const l2Break = document.getElementById('scene2-bulb-l2-break');
        
        const btnNormal = document.getElementById('scene2-btn-normal');
        const btnL1Short = document.getElementById('scene2-btn-l1-short');
        const btnL1Open = document.getElementById('scene2-btn-l1-open');
        const btnL2Short = document.getElementById('scene2-btn-l2-short');
        const btnL2Open = document.getElementById('scene2-btn-l2-open');
        
        // 灯泡发光颜色
        const BULB_ON = '#ffeb3b';
        const BULB_OFF = '#9e9e9e';
        
        // 电压表有示数颜色
        const VOLT_ON = '#2e7d32';
        const VOLT_OFF = '#9e9e9e';
        
        // 更新灯泡状态
        function setBulb(bulbEl, isOn) {
            bulbEl.setAttribute('fill', isOn ? BULB_ON : BULB_OFF);
        }
        
        // 更新电压表状态
        function setVoltmeter(hasReading) {
            voltmeterFrame.setAttribute('stroke', hasReading ? VOLT_ON : VOLT_OFF);
            if (hasReading) {
                // 指针偏转
                voltmeterNeedle.setAttribute('x2', '420');
                voltmeterNeedle.setAttribute('y2', '225');
            } else {
                // 指针垂直
                voltmeterNeedle.setAttribute('x2', '400');
                voltmeterNeedle.setAttribute('y2', '220');
            }
        }
        
        // 隐藏所有故障标记
        function hideAllFaults() {
            l1Highlight.style.display = 'none';
            l1Break.style.display = 'none';
            l2Highlight.style.display = 'none';
            l2Break.style.display = 'none';
        }
        
        // 更新按钮状态
        function updateButtons(activeBtn) {
            const buttons = [btnNormal, btnL1Short, btnL1Open, btnL2Short, btnL2Open];
            buttons.forEach(btn => {
                btn.classList.remove('active-normal', 'active-short', 'active-open');
            });
            activeBtn.classList.add(activeBtn.id === 'scene2-btn-normal' ? 'active-normal' : 
                                     activeBtn.id.includes('short') ? 'active-short' : 'active-open');
        }
        
        // 更新状态显示
        function updateStatus(status) {
            hideAllFaults();
            
            switch(status) {
                case STATE_NORMAL:
                    setBulb(bulbL1Fill, true);
                    setBulb(bulbL2Fill, true);
                    setVoltmeter(true);
                    statusText.textContent = '正常：L₁亮，L₂亮，电压表有示数';
                    updateButtons(btnNormal);
                    break;
                    
                case STATE_L1_SHORT:
                    setBulb(bulbL1Fill, false);
                    setBulb(bulbL2Fill, true);
                    setVoltmeter(true);
                    statusText.textContent = 'L₁短路：L₁不亮，L₂亮，电压表有示数';
                    l1Highlight.style.display = 'block';
                    updateButtons(btnL1Short);
                    break;
                    
                case STATE_L1_OPEN:
                    setBulb(bulbL1Fill, false);
                    setBulb(bulbL2Fill, false);
                    setVoltmeter(false);
                    statusText.textContent = 'L₁断路：L₁不亮，L₂不亮，电压表无示数';
                    l1Break.style.display = 'block';
                    updateButtons(btnL1Open);
                    break;
                    
                case STATE_L2_SHORT:
                    setBulb(bulbL1Fill, true);
                    setBulb(bulbL2Fill, false);
                    setVoltmeter(false);
                    statusText.textContent = 'L₂短路：L₁亮，L₂不亮，电压表无示数';
                    l2Highlight.style.display = 'block';
                    updateButtons(btnL2Short);
                    break;
                    
                case STATE_L2_OPEN:
                    setBulb(bulbL1Fill, false);
                    setBulb(bulbL2Fill, false);
                    setVoltmeter(true);
                    statusText.textContent = 'L₂断路：L₁不亮，L₂不亮，电压表有示数';
                    l2Break.style.display = 'block';
                    updateButtons(btnL2Open);
                    break;
            }
            
            currentStatus = status;
        }
        
        // 按钮事件绑定
        btnNormal.addEventListener('click', () => updateStatus(STATE_NORMAL));
        btnL1Short.addEventListener('click', () => updateStatus(STATE_L1_SHORT));
        btnL1Open.addEventListener('click', () => updateStatus(STATE_L1_OPEN));
        btnL2Short.addEventListener('click', () => updateStatus(STATE_L2_SHORT));
        btnL2Open.addEventListener('click', () => updateStatus(STATE_L2_OPEN));
        
        // 初始化显示正常状态
        updateStatus(STATE_NORMAL);
    })();
    </script>
</body>
</html>
