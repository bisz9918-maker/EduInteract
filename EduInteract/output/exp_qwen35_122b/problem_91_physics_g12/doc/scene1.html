<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 1 - 三带电小球系统的库仑力分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 50px; z-index: 10; }
        #scene1-controls button { padding: 10px 20px; font-size: 14px; cursor: pointer; background: #1976d2; color: white; border: none; border-radius: 4px; }
        #scene1-controls button:disabled { background: #bdbdbd; cursor: not-allowed; }
        #scene1-controls button:hover:not(:disabled) { background: #1565c0; }
        .step-label { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); font-size: 16px; font-weight: bold; color: #333; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- 小球 A -->
            <circle id="scene1-ball-A" cx="200" cy="180" r="20" fill="#e3f2fd" stroke="#000000" stroke-width="2"/>
            <text id="scene1-label-A" x="175" y="185" font-size="18" font-weight="bold">A</text>
            <text id="scene1-charge-A" x="200" y="150" font-size="14" text-anchor="middle">q</text>
            
            <!-- 小球 B -->
            <circle id="scene1-ball-B" cx="200" cy="300" r="20" fill="#e3f2fd" stroke="#000000" stroke-width="2"/>
            <text id="scene1-label-B" x="175" y="305" font-size="18" font-weight="bold">B</text>
            <text id="scene1-charge-B" x="200" y="335" font-size="14" text-anchor="middle">q</text>
            
            <!-- 小球 C -->
            <circle id="scene1-ball-C" cx="304" cy="240" r="20" fill="#fce4ec" stroke="#000000" stroke-width="2"/>
            <text id="scene1-label-C" x="329" y="245" font-size="18" font-weight="bold">C</text>
            <text id="scene1-charge-C" x="304" y="215" font-size="14" text-anchor="middle">Q</text>
            <text id="scene1-charge-symbol" x="304" y="245" font-size="16" font-weight="bold" text-anchor="middle" opacity="0">?</text>
            
            <!-- 边 AB (虚线) -->
            <line id="scene1-line-AB" x1="200" y1="180" x2="200" y2="300" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
            <text id="scene1-label-r-AB" x="175" y="245" font-size="14" text-anchor="middle">r</text>
            
            <!-- 边 BC (虚线) -->
            <line id="scene1-line-BC" x1="200" y1="300" x2="304" y2="240" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
            <text id="scene1-label-r-BC" x="252" y="295" font-size="14" text-anchor="middle">r</text>
            
            <!-- 边 CA (虚线) -->
            <line id="scene1-line-CA" x1="304" y1="240" x2="200" y2="180" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
            <text id="scene1-label-r-CA" x="252" y="190" font-size="14" text-anchor="middle">r</text>
            
            <!-- 力 F_AC (C→A 方向，蓝色) - 步骤 1 显示 -->
            <line id="scene1-force-AC" x1="304" y1="240" x2="230" y2="200" stroke="#1565c0" stroke-width="2" opacity="0"/>
            <polygon id="scene1-arrowhead-AC" points="230,200 220,205 225,195" fill="#1565c0" opacity="0"/>
            <text id="scene1-label-F-AC" x="260" y="215" font-size="13" opacity="0">F<sub>AC</sub></text>
            
            <!-- 力 F_BC (C→B 方向，蓝色) - 步骤 1 显示 -->
            <line id="scene1-force-BC" x1="304" y1="240" x2="230" y2="280" stroke="#1565c0" stroke-width="2" opacity="0"/>
            <polygon id="scene1-arrowhead-BC" points="230,280 220,285 225,275" fill="#1565c0" opacity="0"/>
            <text id="scene1-label-F-BC" x="260" y="285" font-size="13" opacity="0">F<sub>BC</sub></text>
            
            <!-- 力 F_CA (A→C 方向，蓝色) - 步骤 2 显示 -->
            <line id="scene1-force-CA" x1="200" y1="180" x2="274" y2="220" stroke="#1565c0" stroke-width="2" opacity="0"/>
            <polygon id="scene1-arrowhead-CA" points="274,220 264,225 269,215" fill="#1565c0" opacity="0"/>
            <text id="scene1-label-F-CA" x="240" y="195" font-size="13" opacity="0">F<sub>CA</sub></text>
            
            <!-- 力 F_CB (B→C 方向，蓝色) - 步骤 2 显示 -->
            <line id="scene1-force-CB" x1="200" y1="300" x2="274" y2="260" stroke="#1565c0" stroke-width="2" opacity="0"/>
            <polygon id="scene1-arrowhead-CB" points="274,260 264,265 269,255" fill="#1565c0" opacity="0"/>
            <text id="scene1-label-F-CB" x="240" y="305" font-size="13" opacity="0">F<sub>CB</sub></text>
            
            <!-- 力 F_AB (A 竖直向上，红色) - 步骤 3 显示 -->
            <line id="scene1-force-AB" x1="200" y1="180" x2="200" y2="140" stroke="#c62828" stroke-width="2" opacity="0"/>
            <polygon id="scene1-arrowhead-AB" points="200,140 195,150 205,150" fill="#c62828" opacity="0"/>
            <text id="scene1-label-F-AB" x="175" y="165" font-size="13" opacity="0">F<sub>AB</sub></text>
            
            <!-- 力 F_BA (B 竖直向下，红色) - 步骤 3 显示 -->
            <line id="scene1-force-BA" x1="200" y1="300" x2="200" y2="340" stroke="#c62828" stroke-width="2" opacity="0"/>
            <polygon id="scene1-arrowhead-BA" points="200,340 195,330 205,330" fill="#c62828" opacity="0"/>
            <text id="scene1-label-F-BA" x="175" y="335" font-size="13" opacity="0">F<sub>BA</sub></text>
            
            <!-- 外力 F (从 C 右侧水平向右，绿色) - 步骤 4 显示 -->
            <line id="scene1-force-F" x1="324" y1="240" x2="424" y2="240" stroke="#2e7d32" stroke-width="3" opacity="0"/>
            <polygon id="scene1-arrowhead-F" points="424,240 414,235 414,245" fill="#2e7d32" opacity="0"/>
            <text id="scene1-label-F" x="374" y="225" font-size="15" font-weight="bold" opacity="0">F</text>
            
            <!-- 加速度 a (右上独立位置，绿色) - 步骤 4 显示 -->
            <line id="scene1-acc-a" x1="450" y1="150" x2="530" y2="150" stroke="#2e7d32" stroke-width="3" opacity="0"/>
            <polygon id="scene1-arrowhead-a" points="530,150 520,145 520,155" fill="#2e7d32" opacity="0"/>
            <text id="scene1-label-a" x="490" y="135" font-size="15" font-weight="bold" opacity="0">a</text>
            
            <!-- C 球高亮轮廓 - 步骤 5 显示 -->
            <circle id="scene1-highlight-C" cx="304" cy="240" r="20" fill="none" stroke="#ff5722" stroke-width="3" opacity="0"/>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现
        // 布局坐标表对照：
        // 小球 A: (200,180), 半径 20
        // 小球 B: (200,300), 半径 20
        // 小球 C: (304,240), 半径 20
        // 边 AB: (200,180)-(200,300) 竖直
        // 边 BC: (200,300)-(304,240) 右下斜边
        // 边 CA: (304,240)-(200,180) 左上斜边
        
        const scene1 = {
            currentStep: 0,
            totalSteps: 5,
            
            // 元素显示/隐藏配置
            stepElements: {
                0: {
                    // 初始状态：显示基础结构
                    show: ['ball-A', 'ball-B', 'ball-C', 'label-A', 'label-B', 'label-C',
                           'charge-A', 'charge-B', 'charge-C', 'charge-symbol',
                           'line-AB', 'line-BC', 'line-CA',
                           'label-r-AB', 'label-r-BC', 'label-r-CA'],
                    hide: ['force-AC', 'force-BC', 'force-CA', 'force-CB', 'force-AB', 'force-BA',
                           'force-F', 'acc-a', 'label-F-AC', 'label-F-BC', 'label-F-CA', 'label-F-CB',
                           'label-F-AB', 'label-F-BA', 'label-F', 'label-a', 'highlight-C',
                           'arrowhead-AC', 'arrowhead-BC', 'arrowhead-CA', 'arrowhead-CB',
                           'arrowhead-AB', 'arrowhead-BA', 'arrowhead-F', 'arrowhead-a']
                },
                1: {
                    // 步骤 1：显示 A、B 对 C 的引力
                    show: ['ball-A', 'ball-B', 'ball-C', 'label-A', 'label-B', 'label-C',
                           'charge-A', 'charge-B', 'charge-C',
                           'line-AB', 'line-BC', 'line-CA',
                           'label-r-AB', 'label-r-BC', 'label-r-CA',
                           'force-AC', 'force-BC', 'label-F-AC', 'label-F-BC',
                           'arrowhead-AC', 'arrowhead-BC'],
                    hide: ['charge-symbol', 'force-CA', 'force-CB', 'force-AB', 'force-BA',
                           'force-F', 'acc-a', 'label-F-CA', 'label-F-CB', 'label-F-AB', 'label-F-BA',
                           'label-F', 'label-a', 'highlight-C',
                           'arrowhead-CA', 'arrowhead-CB', 'arrowhead-AB', 'arrowhead-BA',
                           'arrowhead-F', 'arrowhead-a']
                },
                2: {
                    // 步骤 2：显示 C 对 A、B 的引力
                    show: ['ball-A', 'ball-B', 'ball-C', 'label-A', 'label-B', 'label-C',
                           'charge-A', 'charge-B', 'charge-C',
                           'line-AB', 'line-BC', 'line-CA',
                           'label-r-AB', 'label-r-BC', 'label-r-CA',
                           'force-AC', 'force-BC', 'force-CA', 'force-CB',
                           'label-F-AC', 'label-F-BC', 'label-F-CA', 'label-F-CB',
                           'arrowhead-AC', 'arrowhead-BC', 'arrowhead-CA', 'arrowhead-CB'],
                    hide: ['charge-symbol', 'force-AB', 'force-BA', 'force-F', 'acc-a',
                           'label-F-AB', 'label-F-BA', 'label-F', 'label-a', 'highlight-C',
                           'arrowhead-AB', 'arrowhead-BA', 'arrowhead-F', 'arrowhead-a']
                },
                3: {
                    // 步骤 3：显示 A、B 间斥力
                    show: ['ball-A', 'ball-B', 'ball-C', 'label-A', 'label-B', 'label-C',
                           'charge-A', 'charge-B', 'charge-C',
                           'line-AB', 'line-BC', 'line-CA',
                           'label-r-AB', 'label-r-BC', 'label-r-CA',
                           'force-AC', 'force-BC', 'force-CA', 'force-CB', 'force-AB', 'force-BA',
                           'label-F-AC', 'label-F-BC', 'label-F-CA', 'label-F-CB', 'label-F-AB', 'label-F-BA',
                           'arrowhead-AC', 'arrowhead-BC', 'arrowhead-CA', 'arrowhead-CB',
                           'arrowhead-AB', 'arrowhead-BA'],
                    hide: ['charge-symbol', 'force-F', 'acc-a', 'label-F', 'label-a', 'highlight-C',
                           'arrowhead-F', 'arrowhead-a']
                },
                4: {
                    // 步骤 4：显示外力 F 和加速度 a
                    show: ['ball-A', 'ball-B', 'ball-C', 'label-A', 'label-B', 'label-C',
                           'charge-A', 'charge-B', 'charge-C',
                           'line-AB', 'line-BC', 'line-CA',
                           'label-r-AB', 'label-r-BC', 'label-r-CA',
                           'force-AC', 'force-BC', 'force-CA', 'force-CB', 'force-AB', 'force-BA',
                           'force-F', 'acc-a',
                           'label-F-AC', 'label-F-BC', 'label-F-CA', 'label-F-CB', 'label-F-AB', 'label-F-BA',
                           'label-F', 'label-a',
                           'arrowhead-AC', 'arrowhead-BC', 'arrowhead-CA', 'arrowhead-CB',
                           'arrowhead-AB', 'arrowhead-BA', 'arrowhead-F', 'arrowhead-a'],
                    hide: ['charge-symbol', 'highlight-C']
                },
                5: {
                    // 步骤 5：C 球电荷符号改为"-"，高亮 C 球
                    show: ['ball-A', 'ball-B', 'ball-C', 'label-A', 'label-B', 'label-C',
                           'charge-A', 'charge-B', 'charge-C', 'charge-symbol',
                           'line-AB', 'line-BC', 'line-CA',
                           'label-r-AB', 'label-r-BC', 'label-r-CA',
                           'force-AC', 'force-BC', 'force-CA', 'force-CB', 'force-AB', 'force-BA',
                           'force-F', 'acc-a', 'highlight-C',
                           'label-F-AC', 'label-F-BC', 'label-F-CA', 'label-F-CB', 'label-F-AB', 'label-F-BA',
                           'label-F', 'label-a',
                           'arrowhead-AC', 'arrowhead-BC', 'arrowhead-CA', 'arrowhead-CB',
                           'arrowhead-AB', 'arrowhead-BA', 'arrowhead-F', 'arrowhead-a'],
                    hide: []
                }
            },
            
            // 获取元素 ID
            getEl: function(suffix) {
                return document.getElementById('scene1-' + suffix);
            },
            
            // 显示元素
            showEl: function(suffix) {
                const el = this.getEl(suffix);
                if (el) {
                    el.style.display = 'block';
                    el.style.opacity = '1';
                }
            },
            
            // 隐藏元素
            hideEl: function(suffix) {
                const el = this.getEl(suffix);
                if (el) {
                    el.style.display = 'none';
                    el.style.opacity = '0';
                }
            },
            
            // 更新步骤显示
            updateStep: function() {
                const config = this.stepElements[this.currentStep];
                
                // 先隐藏所有元素
                const allSuffixes = ['ball-A', 'ball-B', 'ball-C', 'label-A', 'label-B', 'label-C',
                    'charge-A', 'charge-B', 'charge-C', 'charge-symbol',
                    'line-AB', 'line-BC', 'line-CA',
                    'label-r-AB', 'label-r-BC', 'label-r-CA',
                    'force-AC', 'force-BC', 'force-CA', 'force-CB', 'force-AB', 'force-BA',
                    'force-F', 'acc-a', 'highlight-C',
                    'label-F-AC', 'label-F-BC', 'label-F-CA', 'label-F-CB', 'label-F-AB', 'label-F-BA',
                    'label-F', 'label-a',
                    'arrowhead-AC', 'arrowhead-BC', 'arrowhead-CA', 'arrowhead-CB',
                    'arrowhead-AB', 'arrowhead-BA', 'arrowhead-F', 'arrowhead-a'];
                
                allSuffixes.forEach(s => this.hideEl(s));
                
                // 显示当前步骤需要的元素
                if (config.show) {
                    config.show.forEach(s => this.showEl(s));
                }
                
                // 步骤 5 时，将 charge-symbol 文本改为"-"
                if (this.currentStep === 5) {
                    const symbolEl = this.getEl('charge-symbol');
                    if (symbolEl) {
                        symbolEl.textContent = '-';
                        // 添加高亮动画
                        const highlightEl = this.getEl('highlight-C');
                        if (highlightEl) {
                            highlightEl.style.animation = 'pulse 1s infinite';
                        }
                    }
                }
                
                // 更新按钮状态
                const prevBtn = document.getElementById('scene1-btn-prev');
                const nextBtn = document.getElementById('scene1-btn-next');
                
                prevBtn.disabled = (this.currentStep === 0);
                
                if (this.currentStep === this.totalSteps) {
                    nextBtn.textContent = '完成';
                    nextBtn.disabled = true;
                } else {
                    nextBtn.textContent = '下一步 ▶';
                    nextBtn.disabled = false;
                }
            },
            
            // 初始化
            init: function() {
                const prevBtn = document.getElementById('scene1-btn-prev');
                const nextBtn = document.getElementById('scene1-btn-next');
                
                prevBtn.addEventListener('click', () => {
                    if (this.currentStep > 0) {
                        this.currentStep--;
                        this.updateStep();
                    }
                });
                
                nextBtn.addEventListener('click', () => {
                    if (this.currentStep < this.totalSteps) {
                        this.currentStep++;
                        this.updateStep();
                    }
                });
                
                // 添加高亮脉冲动画
                const style = document.createElement('style');
                style.textContent = `
                    @keyframes pulse {
                        0%, 100% { opacity: 1; }
                        50% { opacity: 0.5; }
                    }
                `;
                document.head.appendChild(style);
                
                // 初始化显示步骤 0
                this.updateStep();
            }
        };
        
        // 页面加载完成后初始化
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => scene1.init());
        } else {
            scene1.init();
        }
    })();
    </script>
</body>
</html>
