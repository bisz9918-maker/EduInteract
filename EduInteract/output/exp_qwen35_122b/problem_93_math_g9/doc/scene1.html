<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 1 - 双等边三角形基础结构及相似三角形识别</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene1-step-indicator { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); font-size: 16px; font-weight: bold; color: #333; }
        .scene1-btn { padding: 8px 20px; font-size: 14px; background: #1565c0; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .scene1-btn:hover { background: #0d47a1; }
        .scene1-btn:disabled { background: #9e9e9e; cursor: not-allowed; }
        .scene1-element { transition: opacity 0.3s ease-in-out; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- 线段 AB -->
            <g id="scene1-group-ab">
                <line x1="100" y1="380" x2="700" y2="380" stroke="black" stroke-width="2" class="scene1-element"/>
                <circle cx="100" cy="380" r="6" fill="black" class="scene1-element"/>
                <circle cx="700" cy="380" r="6" fill="black" class="scene1-element"/>
                <text x="85" y="400" font-size="16" fill="black" class="scene1-element">A</text>
                <text x="715" y="400" font-size="16" fill="black" class="scene1-element">B</text>
                <text x="400" y="415" font-size="14" fill="black" text-anchor="middle" class="scene1-element">AB=8</text>
            </g>
            
            <!-- 三角形 ACD 和 BCE -->
            <g id="scene1-group-triangles">
                <!-- 三角形 ACD -->
                <polygon points="100,380 350,380 225,163" fill="rgba(21,101,192,0.2)" stroke="#1565c0" stroke-width="2" class="scene1-element"/>
                <!-- 三角形 BCE -->
                <polygon points="700,380 350,380 525,97" fill="rgba(21,101,192,0.2)" stroke="#1565c0" stroke-width="2" class="scene1-element"/>
                <!-- 点 C, D, E -->
                <circle cx="350" cy="380" r="6" fill="black" class="scene1-element"/>
                <circle cx="225" cy="163" r="6" fill="black" class="scene1-element"/>
                <circle cx="525" cy="97" r="6" fill="black" class="scene1-element"/>
                <!-- 标签 C, D, E - 放在图形外部，远离图形 -->
                <text x="350" y="405" font-size="16" fill="black" text-anchor="middle" class="scene1-element">C</text>
                <text x="225" y="115" font-size="16" fill="black" text-anchor="middle" class="scene1-element">D</text>
                <text x="525" y="65" font-size="16" fill="black" text-anchor="middle" class="scene1-element">E</text>
                <!-- 角度标注 60° - 放在三角形外部侧边，远离图形 -->
                <text x="50" y="280" font-size="12" fill="black" class="scene1-element">60°</text>
                <text x="640" y="230" font-size="12" fill="black" class="scene1-element">60°</text>
            </g>
            
            <!-- 线段 DE 和中点 P, F -->
            <g id="scene1-group-de">
                <line x1="225" y1="163" x2="525" y2="97" stroke="black" stroke-width="2" class="scene1-element"/>
                <!-- 点 P (DE 中点) -->
                <circle cx="375" cy="130" r="6" fill="white" stroke="#2e7d32" stroke-width="2" class="scene1-element"/>
                <!-- 点 F (BE 中点) -->
                <circle cx="613" cy="239" r="6" fill="white" stroke="#2e7d32" stroke-width="2" class="scene1-element"/>
                <!-- 标签 P, F - 放在图形外部，远离图形 -->
                <text x="375" y="95" font-size="16" fill="black" text-anchor="middle" class="scene1-element">P</text>
                <text x="650" y="260" font-size="16" fill="black" class="scene1-element">F</text>
            </g>
            
            <!-- 线段 AF 和交点 G, H -->
            <g id="scene1-group-af">
                <line x1="100" y1="380" x2="613" y2="239" stroke="black" stroke-width="2" class="scene1-element"/>
                <!-- 点 G (AF∩DC) -->
                <circle cx="280" cy="310" r="6" fill="black" class="scene1-element"/>
                <!-- 点 H (AF∩CE) -->
                <circle cx="450" cy="280" r="6" fill="black" class="scene1-element"/>
                <!-- 标签 G, H - 放在图形外部，远离图形 -->
                <text x="255" y="350" font-size="16" fill="black" class="scene1-element">G</text>
                <text x="470" y="325" font-size="16" fill="black" class="scene1-element">H</text>
            </g>
            
            <!-- 相似三角形高亮框 -->
            <g id="scene1-group-similar">
                <!-- △ACG 高亮框 -->
                <polygon points="100,380 350,380 280,310" fill="rgba(198,40,40,0.15)" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5" class="scene1-element"/>
                <!-- △ABF 高亮框 -->
                <polygon points="100,380 700,380 613,239" fill="rgba(198,40,40,0.1)" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5" class="scene1-element"/>
                <!-- △BHF 高亮框 -->
                <polygon points="700,380 450,280 613,239" fill="rgba(198,40,40,0.15)" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5" class="scene1-element"/>
                <!-- △BCA 高亮框 -->
                <polygon points="700,380 350,380 100,380" fill="rgba(198,40,40,0.1)" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5" class="scene1-element"/>
                <!-- 相似符号 - 放在空白区域底部 -->
                <text x="180" y="450" font-size="18" fill="#c62828" font-weight="bold" class="scene1-element">△ACG ∽ △ABF</text>
                <text x="420" y="450" font-size="18" fill="#c62828" font-weight="bold" class="scene1-element">△BHF ∽ △BCA</text>
            </g>
            
            <!-- 相似三角形总结文本框 -->
            <g id="scene1-group-summary">
                <rect x="50" y="460" width="700" height="35" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="5" class="scene1-element"/>
                <text x="400" y="482" font-size="13" fill="#e65100" text-anchor="middle" class="scene1-element">△ACG∽△ABF, △BHF∽△BCA, △DGP∽△EFP, △DCG∽△ECH</text>
            </g>
        </svg>
        
        <div id="scene1-step-indicator">步骤 1/5</div>
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn">◀ 上一步</button>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现
        // 布局坐标表（调整后，避免重叠）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // |------|------|-----------|------|-------------|------|
        // | 线段 AB | 线段 | (100,380)-(700,380) | 600×2 | - | 水平底边 |
        // | 点 A | 圆点 | (100,380) | 6 | 左下 (85,400) | 左端点 |
        // | 点 B | 圆点 | (700,380) | 6 | 右下 (715,400) | 右端点 |
        // | 点 C | 圆点 | (350,380) | 6 | 下 (350,405) | AB 上动点 |
        // | 三角形 ACD | 多边形 | A(100,380)-C(350,380)-D(225,163) | - | - | 左侧等边三角形 |
        // | 点 D | 圆点 | (225,163) | 6 | 上 (225,115) | ACD 顶点 |
        // | 三角形 BCE | 多边形 | B(700,380)-C(350,380)-E(525,97) | - | - | 右侧等边三角形 |
        // | 点 E | 圆点 | (525,97) | 6 | 上 (525,65) | BCE 顶点 |
        // | 线段 DE | 线段 | (225,163)-(525,97) | - | - | 连接两三角形顶点 |
        // | 点 P | 圆点 | (375,130) | 6 | 上 (375,95) | DE 中点，绿标记 |
        // | 点 F | 圆点 | (613,239) | 6 | 右下 (650,260) | BE 中点，绿标记 |
        // | 线段 AF | 线段 | (100,380)-(613,239) | - | - | 从 A 到 F |
        // | 点 G | 圆点 | (280,310) | 6 | 下 (255,350) | AF∩DC 交点 |
        // | 点 H | 圆点 | (450,280) | 6 | 下 (470,325) | AF∩CE 交点 |
        
        const TOTAL_STEPS = 5;
        let currentStep = 0;
        
        // 元素分组映射：步骤 -> 需要显示的元素组 ID
        const stepGroups = {
            0: ['scene1-group-ab'],  // 初始：只显示 AB
            1: ['scene1-group-ab', 'scene1-group-triangles'],  // 添加三角形
            2: ['scene1-group-ab', 'scene1-group-triangles', 'scene1-group-de'],  // 添加 DE 和中点
            3: ['scene1-group-ab', 'scene1-group-triangles', 'scene1-group-de', 'scene1-group-af'],  // 添加 AF 和交点
            4: ['scene1-group-ab', 'scene1-group-triangles', 'scene1-group-de', 'scene1-group-af', 'scene1-group-similar'],  // 添加相似高亮
            5: ['scene1-group-ab', 'scene1-group-triangles', 'scene1-group-de', 'scene1-group-af', 'scene1-group-similar', 'scene1-group-summary']  // 添加总结
        };
        
        // 工具函数：显示元素
        function show(el) {
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }
        
        // 工具函数：隐藏元素
        function hide(el) {
            if (el) {
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }
        
        // 更新当前步骤的显示
        function updateStep() {
            // 获取所有元素组
            const allGroups = [
                document.getElementById('scene1-group-ab'),
                document.getElementById('scene1-group-triangles'),
                document.getElementById('scene1-group-de'),
                document.getElementById('scene1-group-af'),
                document.getElementById('scene1-group-similar'),
                document.getElementById('scene1-group-summary')
            ];
            
            // 获取当前步骤需要显示的组
            const groupsToShow = stepGroups[currentStep] || [];
            
            // 更新每个组的显示状态
            allGroups.forEach(group => {
                if (group) {
                    if (groupsToShow.includes(group.id)) {
                        show(group);
                    } else {
                        hide(group);
                    }
                }
            });
            
            // 更新步骤指示器
            const indicator = document.getElementById('scene1-step-indicator');
            if (indicator) {
                indicator.textContent = '步骤 ' + (currentStep + 1) + '/' + TOTAL_STEPS;
            }
            
            // 更新按钮状态
            const prevBtn = document.getElementById('scene1-btn-prev');
            const nextBtn = document.getElementById('scene1-btn-next');
            
            if (prevBtn) {
                prevBtn.disabled = (currentStep === 0);
            }
            if (nextBtn) {
                nextBtn.disabled = (currentStep === TOTAL_STEPS - 1);
                if (currentStep === TOTAL_STEPS - 1) {
                    nextBtn.textContent = '完成';
                } else {
                    nextBtn.textContent = '下一步 ▶';
                }
            }
        }
        
        // 事件绑定
        document.addEventListener('DOMContentLoaded', function() {
            const prevBtn = document.getElementById('scene1-btn-prev');
            const nextBtn = document.getElementById('scene1-btn-next');
            
            if (prevBtn) {
                prevBtn.addEventListener('click', function() {
                    if (currentStep > 0) {
                        currentStep--;
                        updateStep();
                    }
                });
            }
            
            if (nextBtn) {
                nextBtn.addEventListener('click', function() {
                    if (currentStep < TOTAL_STEPS - 1) {
                        currentStep++;
                        updateStep();
                    }
                });
            }
            
            // 初始化显示
            updateStep();
        });
    })();
    </script>
</body>
</html>
