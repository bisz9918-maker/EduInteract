<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - C 为 AB 中点时的特殊情形分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Microsoft YaHei', sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 20px; z-index: 10; }
        .scene2-btn { padding: 8px 16px; font-size: 14px; background: #1976d2; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .scene2-btn:disabled { background: #bdbdbd; cursor: not-allowed; }
        .scene2-btn:hover:not(:disabled) { background: #1565c0; }
        #scene2-step-indicator { font-size: 14px; color: #424242; font-weight: bold; }
        
        .scene2-hidden { opacity: 0; }
        .scene2-visible { opacity: 1; }
        .scene2-element { transition: opacity 0.3s ease-in-out; }
        
        .scene2-label { font-size: 14px; font-weight: bold; }
        .scene2-value-label { font-size: 13px; }
        .scene2-conclusion { font-size: 15px; font-weight: bold; fill: #c62828; }
        
        .scene2-perp-symbol { fill: none; stroke: #424242; stroke-width: 1.5; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" id="scene2-svg">
            <defs>
                <linearGradient id="scene2-tri-fill" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#1565c0;stop-opacity:0.03" />
                    <stop offset="100%" style="stop-color:#1565c0;stop-opacity:0.01" />
                </linearGradient>
            </defs>
            
            <!-- 线段 AB -->
            <line id="scene2-line-ab" x1="100" y1="350" x2="700" y2="350" stroke="#000000" stroke-width="2" class="scene2-element scene2-visible"/>
            
            <!-- 等边三角形 ACD（蓝色边框，极低透明度填充） -->
            <polygon id="scene2-tri-acd" points="100,350 400,350 250,96" fill="url(#scene2-tri-fill)" stroke="#1565c0" stroke-width="2" class="scene2-element scene2-hidden"/>
            
            <!-- 等边三角形 BCE（蓝色边框，极低透明度填充） -->
            <polygon id="scene2-tri-bce" points="700,350 400,350 550,96" fill="url(#scene2-tri-fill)" stroke="#1565c0" stroke-width="2" class="scene2-element scene2-hidden"/>
            
            <!-- 线段 DE -->
            <line id="scene2-line-de" x1="250" y1="96" x2="550" y2="96" stroke="#000000" stroke-width="2" class="scene2-element scene2-hidden"/>
            
            <!-- 线段 CP（绿色高亮） -->
            <line id="scene2-line-cp" x1="400" y1="350" x2="400" y2="96" stroke="#2e7d32" stroke-width="2.5" class="scene2-element scene2-hidden"/>
            
            <!-- 辅助虚线 -->
            <line id="scene2-line-helper" x1="400" y1="350" x2="400" y2="96" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" class="scene2-element scene2-hidden"/>
            
            <!-- 线段 DC -->
            <line id="scene2-line-dc" x1="250" y1="96" x2="400" y2="350" stroke="#000000" stroke-width="1.5" class="scene2-element scene2-hidden"/>
            
            <!-- 线段 CE -->
            <line id="scene2-line-ce" x1="400" y1="350" x2="550" y2="96" stroke="#000000" stroke-width="1.5" class="scene2-element scene2-hidden"/>
            
            <!-- 线段 BE -->
            <line id="scene2-line-be" x1="700" y1="350" x2="550" y2="96" stroke="#000000" stroke-width="1.5" class="scene2-element scene2-hidden"/>
            
            <!-- 线段 AF -->
            <line id="scene2-line-af" x1="100" y1="350" x2="550" y2="223" stroke="#000000" stroke-width="1.5" class="scene2-element scene2-hidden"/>
            
            <!-- 高亮线段 AG（红色，最深） -->
            <line id="scene2-highlight-ag" x1="100" y1="350" x2="283" y2="240" stroke="#c62828" stroke-width="3" class="scene2-element scene2-hidden"/>
            
            <!-- 高亮线段 GH（红色，中等） -->
            <line id="scene2-highlight-gh" x1="283" y1="240" x2="467" y2="283" stroke="#e53935" stroke-width="3" class="scene2-element scene2-hidden"/>
            
            <!-- 高亮线段 HF（红色，最浅） -->
            <line id="scene2-highlight-hf" x1="467" y1="283" x2="550" y2="223" stroke="#ef5350" stroke-width="3" class="scene2-element scene2-hidden"/>
            
            <!-- 点 A -->
            <circle id="scene2-point-a" cx="100" cy="350" r="4" fill="#000000" class="scene2-element scene2-visible"/>
            
            <!-- 点 B -->
            <circle id="scene2-point-b" cx="700" cy="350" r="4" fill="#000000" class="scene2-element scene2-visible"/>
            
            <!-- 点 C -->
            <circle id="scene2-point-c" cx="400" cy="350" r="4" fill="#000000" class="scene2-element scene2-visible"/>
            
            <!-- 点 D -->
            <circle id="scene2-point-d" cx="250" cy="96" r="4" fill="#000000" class="scene2-element scene2-hidden"/>
            
            <!-- 点 E -->
            <circle id="scene2-point-e" cx="550" cy="96" r="4" fill="#000000" class="scene2-element scene2-hidden"/>
            
            <!-- 点 P -->
            <circle id="scene2-point-p" cx="400" cy="96" r="4" fill="#000000" class="scene2-element scene2-hidden"/>
            
            <!-- 点 F -->
            <circle id="scene2-point-f" cx="550" cy="223" r="4" fill="#000000" class="scene2-element scene2-hidden"/>
            
            <!-- 点 G -->
            <circle id="scene2-point-g" cx="283" cy="240" r="4" fill="#000000" class="scene2-element scene2-hidden"/>
            
            <!-- 点 H -->
            <circle id="scene2-point-h" cx="467" cy="283" r="4" fill="#000000" class="scene2-element scene2-hidden"/>
            
            <!-- 标签 A -->
            <text id="scene2-label-a" x="90" y="365" class="scene2-label scene2-element scene2-visible">A</text>
            
            <!-- 标签 B -->
            <text id="scene2-label-b" x="710" y="365" class="scene2-label scene2-element scene2-visible">B</text>
            
            <!-- 标签 C -->
            <text id="scene2-label-c" x="400" y="365" text-anchor="middle" class="scene2-label scene2-element scene2-visible">C</text>
            
            <!-- 标签 AB=8 -->
            <text id="scene2-label-ab" x="400" y="385" text-anchor="middle" class="scene2-value-label scene2-element scene2-visible">AB=8</text>
            
            <!-- 标签 AC=4 -->
            <text id="scene2-label-ac" x="250" y="380" text-anchor="middle" class="scene2-value-label scene2-element scene2-visible">AC=4</text>
            
            <!-- 标签 CB=4 -->
            <text id="scene2-label-cb" x="550" y="380" text-anchor="middle" class="scene2-value-label scene2-element scene2-visible">CB=4</text>
            
            <!-- 标签 D -->
            <text id="scene2-label-d" x="235" y="86" class="scene2-label scene2-element scene2-hidden">D</text>
            
            <!-- 标签 E -->
            <text id="scene2-label-e" x="565" y="86" class="scene2-label scene2-element scene2-hidden">E</text>
            
            <!-- 标签 AD=4（移到三角形外侧左边更远处） -->
            <text id="scene2-label-ad" x="80" y="160" class="scene2-value-label scene2-element scene2-hidden">AD=4</text>
            
            <!-- 标签 CD=4（移到三角形外侧右边更远处） -->
            <text id="scene2-label-cd" x="400" y="160" class="scene2-value-label scene2-element scene2-hidden">CD=4</text>
            
            <!-- 标签 BE=4（移到三角形外侧右边更远处） -->
            <text id="scene2-label-be" x="700" y="160" class="scene2-value-label scene2-element scene2-hidden">BE=4</text>
            
            <!-- 标签 CE=4（移到三角形外侧左边更远处） -->
            <text id="scene2-label-ce" x="440" y="160" class="scene2-value-label scene2-element scene2-hidden">CE=4</text>
            
            <!-- 标签 P -->
            <text id="scene2-label-p" x="400" y="80" text-anchor="middle" class="scene2-label scene2-element scene2-hidden">P</text>
            
            <!-- 标签 CP=2√3（移到 CP 线段右侧更远处） -->
            <text id="scene2-label-cp" x="460" y="200" class="scene2-value-label scene2-element scene2-hidden">CP=2√3</text>
            
            <!-- 标签 F -->
            <text id="scene2-label-f" x="585" y="223" class="scene2-label scene2-element scene2-hidden">F</text>
            
            <!-- 标签 G -->
            <text id="scene2-label-g" x="255" y="230" class="scene2-label scene2-element scene2-hidden">G</text>
            
            <!-- 标签 H -->
            <text id="scene2-label-h" x="495" y="273" class="scene2-label scene2-element scene2-hidden">H</text>
            
            <!-- 垂直符号（在 C 点） -->
            <path id="scene2-perp-mark" d="M 390,340 L 390,350 L 400,350" fill="none" stroke="#424242" stroke-width="1.5" class="scene2-element scene2-hidden"/>
            
            <!-- 说明文字：两等边三角形边长均为 4（移到顶部更上方） -->
            <text id="scene2-note-tri" x="400" y="100" text-anchor="middle" class="scene2-value-label scene2-element scene2-hidden" fill="#1565c0">两等边三角形边长均为 4</text>
            
            <!-- 说明文字：CP⊥AB（移到 CP 右侧更远处） -->
            <text id="scene2-note-cp" x="460" y="160" class="scene2-value-label scene2-element scene2-hidden" fill="#2e7d32">CP⊥AB</text>
            
            <!-- 比例提示框（移到更下方） -->
            <rect id="scene2-ratio-box" x="240" y="455" width="320" height="35" fill="#fff3e0" stroke="#ff9800" stroke-width="1.5" rx="5" class="scene2-element scene2-hidden"/>
            <text id="scene2-ratio-text" x="400" y="477" text-anchor="middle" class="scene2-value-label scene2-element scene2-hidden" fill="#e65100">AG:GH:HF = 3:2:1</text>
            
            <!-- 结论文字（移到更下方，避免被按钮遮挡） -->
            <text id="scene2-conclusion" x="400" y="495" text-anchor="middle" class="scene2-conclusion scene2-element scene2-hidden">结论：CP=2√3，AG:GH:HF=3:2:1</text>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-btn-prev" class="scene2-btn" disabled>◀ 上一步</button>
            <span id="scene2-step-indicator">步骤 1/6</span>
            <button id="scene2-btn-next" class="scene2-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        const scene2 = {
            currentStep: 1,
            totalSteps: 6,
            
            cumulativeElements: {
                1: ['scene2-line-ab', 'scene2-point-a', 'scene2-point-b', 'scene2-point-c',
                    'scene2-label-a', 'scene2-label-b', 'scene2-label-c',
                    'scene2-label-ab', 'scene2-label-ac', 'scene2-label-cb'],
                2: ['scene2-line-ab', 'scene2-point-a', 'scene2-point-b', 'scene2-point-c',
                    'scene2-label-a', 'scene2-label-b', 'scene2-label-c',
                    'scene2-label-ab', 'scene2-label-ac', 'scene2-label-cb',
                    'scene2-tri-acd', 'scene2-tri-bce', 'scene2-point-d', 'scene2-point-e',
                    'scene2-label-d', 'scene2-label-e', 'scene2-label-ad', 'scene2-label-cd',
                    'scene2-label-be', 'scene2-label-ce', 'scene2-line-de', 'scene2-note-tri'],
                3: ['scene2-line-ab', 'scene2-point-a', 'scene2-point-b', 'scene2-point-c',
                    'scene2-label-a', 'scene2-label-b', 'scene2-label-c',
                    'scene2-label-ab', 'scene2-label-ac', 'scene2-label-cb',
                    'scene2-tri-acd', 'scene2-tri-bce', 'scene2-point-d', 'scene2-point-e',
                    'scene2-label-d', 'scene2-label-e', 'scene2-label-ad', 'scene2-label-cd',
                    'scene2-label-be', 'scene2-label-ce', 'scene2-line-de', 'scene2-note-tri',
                    'scene2-point-p', 'scene2-line-cp', 'scene2-line-helper',
                    'scene2-label-p', 'scene2-label-cp', 'scene2-perp-mark', 'scene2-note-cp'],
                4: ['scene2-line-ab', 'scene2-point-a', 'scene2-point-b', 'scene2-point-c',
                    'scene2-label-a', 'scene2-label-b', 'scene2-label-c',
                    'scene2-label-ab', 'scene2-label-ac', 'scene2-label-cb',
                    'scene2-tri-acd', 'scene2-tri-bce', 'scene2-point-d', 'scene2-point-e',
                    'scene2-label-d', 'scene2-label-e', 'scene2-label-ad', 'scene2-label-cd',
                    'scene2-label-be', 'scene2-label-ce', 'scene2-line-de', 'scene2-note-tri',
                    'scene2-point-p', 'scene2-line-cp', 'scene2-line-helper',
                    'scene2-label-p', 'scene2-label-cp', 'scene2-perp-mark', 'scene2-note-cp',
                    'scene2-point-f', 'scene2-line-af', 'scene2-label-f'],
                5: ['scene2-line-ab', 'scene2-point-a', 'scene2-point-b', 'scene2-point-c',
                    'scene2-label-a', 'scene2-label-b', 'scene2-label-c',
                    'scene2-label-ab', 'scene2-label-ac', 'scene2-label-cb',
                    'scene2-tri-acd', 'scene2-tri-bce', 'scene2-point-d', 'scene2-point-e',
                    'scene2-label-d', 'scene2-label-e', 'scene2-label-ad', 'scene2-label-cd',
                    'scene2-label-be', 'scene2-label-ce', 'scene2-line-de', 'scene2-note-tri',
                    'scene2-point-p', 'scene2-line-cp', 'scene2-line-helper',
                    'scene2-label-p', 'scene2-label-cp', 'scene2-perp-mark', 'scene2-note-cp',
                    'scene2-point-f', 'scene2-line-af', 'scene2-label-f',
                    'scene2-line-dc', 'scene2-line-ce', 'scene2-line-be',
                    'scene2-point-g', 'scene2-point-h', 'scene2-label-g', 'scene2-label-h'],
                6: ['scene2-line-ab', 'scene2-point-a', 'scene2-point-b', 'scene2-point-c',
                    'scene2-label-a', 'scene2-label-b', 'scene2-label-c',
                    'scene2-label-ab', 'scene2-label-ac', 'scene2-label-cb',
                    'scene2-tri-acd', 'scene2-tri-bce', 'scene2-point-d', 'scene2-point-e',
                    'scene2-label-d', 'scene2-label-e', 'scene2-label-ad', 'scene2-label-cd',
                    'scene2-label-be', 'scene2-label-ce', 'scene2-line-de', 'scene2-note-tri',
                    'scene2-point-p', 'scene2-line-cp', 'scene2-line-helper',
                    'scene2-label-p', 'scene2-label-cp', 'scene2-perp-mark', 'scene2-note-cp',
                    'scene2-point-f', 'scene2-line-af', 'scene2-label-f',
                    'scene2-line-dc', 'scene2-line-ce', 'scene2-line-be',
                    'scene2-point-g', 'scene2-point-h', 'scene2-label-g', 'scene2-label-h',
                    'scene2-highlight-ag', 'scene2-highlight-gh', 'scene2-highlight-hf',
                    'scene2-ratio-box', 'scene2-ratio-text', 'scene2-conclusion']
            },
            
            init: function() {
                this.bindEvents();
                this.updateScene();
            },
            
            bindEvents: function() {
                document.getElementById('scene2-btn-prev').addEventListener('click', () => {
                    if (this.currentStep > 1) {
                        this.currentStep--;
                        this.updateScene();
                    }
                });
                
                document.getElementById('scene2-btn-next').addEventListener('click', () => {
                    if (this.currentStep < this.totalSteps) {
                        this.currentStep++;
                        this.updateScene();
                    }
                });
            },
            
            updateScene: function() {
                document.getElementById('scene2-step-indicator').textContent = '步骤 ' + this.currentStep + '/' + this.totalSteps;
                
                const prevBtn = document.getElementById('scene2-btn-prev');
                const nextBtn = document.getElementById('scene2-btn-next');
                prevBtn.disabled = (this.currentStep === 1);
                nextBtn.disabled = (this.currentStep === this.totalSteps);
                
                const visibleElements = this.cumulativeElements[this.currentStep] || [];
                
                const allElements = document.querySelectorAll('.scene2-element');
                allElements.forEach(el => {
                    const id = el.id;
                    if (visibleElements.includes(id)) {
                        el.classList.remove('scene2-hidden');
                        el.classList.add('scene2-visible');
                    } else {
                        el.classList.remove('scene2-visible');
                        el.classList.add('scene2-hidden');
                    }
                });
            }
        };
        
        scene2.init();
    })();
    </script>
</body>
</html>
