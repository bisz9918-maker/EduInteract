<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 3 - 动点 P 的轨迹演示</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Microsoft YaHei', sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; padding: 0 20px; }
        #scene3-slider { width: 400px; cursor: pointer; }
        #scene3-btn-reset { padding: 6px 16px; font-size: 14px; background: #1976d2; color: white; border: none; border-radius: 4px; cursor: pointer; }
        #scene3-btn-reset:hover { background: #1565c0; }
        #scene3-info { position: absolute; top: 10px; left: 10px; font-size: 13px; color: #333; background: rgba(255,255,255,0.9); padding: 8px 12px; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg width="800" height="500" id="scene3-svg">
            <!-- 轨迹线段（背景） -->
            <line id="scene3-line-trajectory-bg" x1="325" y1="340" x2="475" y2="340" stroke="#e0e0e0" stroke-width="4" stroke-dasharray="5,5"/>
            
            <!-- 轨迹线段（动态绘制） -->
            <line id="scene3-line-trajectory" x1="325" y1="340" x2="325" y2="340" stroke="#2e7d32" stroke-width="4"/>
            
            <!-- 线段 AB -->
            <line id="scene3-line-ab" x1="100" y1="430" x2="700" y2="430" stroke="#000000" stroke-width="3"/>
            
            <!-- M、N 标记虚线 -->
            <line id="scene3-line-m-marker" x1="250" y1="430" x2="250" y2="370" stroke="#9e9e9e" stroke-width="1" stroke-dasharray="4,4"/>
            <line id="scene3-line-n-marker" x1="550" y1="430" x2="550" y2="370" stroke="#9e9e9e" stroke-width="1" stroke-dasharray="4,4"/>
            
            <!-- 三角形 ACD（无填充，仅边框，细线） -->
            <polygon id="scene3-tri-acd" fill="none" stroke="#1565c0" stroke-width="1.5"/>
            
            <!-- 三角形 BCE（无填充，仅边框，细线） -->
            <polygon id="scene3-tri-bce" fill="none" stroke="#1565c0" stroke-width="1.5"/>
            
            <!-- 线段 DE -->
            <line id="scene3-line-de" stroke="#000000" stroke-width="2"/>
            
            <!-- 固定点 A、B、M、N -->
            <circle id="scene3-point-a" cx="100" cy="430" r="6" fill="#000000"/>
            <circle id="scene3-point-b" cx="700" cy="430" r="6" fill="#000000"/>
            <circle id="scene3-point-m" cx="250" cy="430" r="5" fill="#000000"/>
            <circle id="scene3-point-n" cx="550" cy="430" r="5" fill="#000000"/>
            
            <!-- 动点 C -->
            <circle id="scene3-point-c" cx="400" cy="430" r="8" fill="#d32f2f"/>
            
            <!-- 动态点 D、E、P -->
            <circle id="scene3-point-d" r="5" fill="#1565c0"/>
            <circle id="scene3-point-e" r="5" fill="#1565c0"/>
            <circle id="scene3-point-p" r="8" fill="#2e7d32"/>
            
            <!-- 标签文字 -->
            <text id="scene3-label-a" x="85" y="445" font-size="14" fill="#000000">A</text>
            <text id="scene3-label-b" x="715" y="445" font-size="14" fill="#000000">B</text>
            <text id="scene3-label-m" x="245" y="465" font-size="14" fill="#000000">M</text>
            <text id="scene3-label-n" x="545" y="465" font-size="14" fill="#000000">N</text>
            <text id="scene3-label-m-val" x="220" y="480" font-size="13" fill="#666">2</text>
            <text id="scene3-label-n-val" x="560" y="480" font-size="13" fill="#666">6</text>
            <text id="scene3-label-c" x="400" y="405" font-size="14" fill="#d32f2f" text-anchor="middle">C</text>
            <text id="scene3-label-d" font-size="14" fill="#1565c0">D</text>
            <text id="scene3-label-e" font-size="14" fill="#1565c0">E</text>
            <text id="scene3-label-p" x="400" y="320" font-size="14" fill="#2e7d32" text-anchor="middle">P</text>
            <text id="scene3-label-ab" x="400" y="455" font-size="13" fill="#000000" text-anchor="middle">AB=8</text>
            <text id="scene3-label-am" x="175" y="485" font-size="12" fill="#666">AM=2</text>
            <text id="scene3-label-bn" x="625" y="485" font-size="12" fill="#666">BN=2</text>
            <text id="scene3-label-m-marker" x="250" y="365" font-size="12" fill="#9e9e9e" text-anchor="middle">M</text>
            <text id="scene3-label-n-marker" x="550" y="365" font-size="12" fill="#9e9e9e" text-anchor="middle">N</text>
            <text id="scene3-label-trajectory-len" x="400" y="375" font-size="12" fill="#2e7d32" text-anchor="middle">轨迹长=2</text>
        </svg>
        
        <div id="scene3-info">拖动滑块观察 P 点轨迹</div>
        
        <div id="scene3-controls">
            <input type="range" id="scene3-slider" min="250" max="550" value="400" step="1">
            <button id="scene3-btn-reset">重置</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 3 - 动点 P 的轨迹演示
        // 坐标映射：AB 线段实际长度 8 单位 → 画布 600px（每单位 75px）
        // AB 起点 A：(100, 430)，AB 终点 B：(700, 430)
        // M 点：x=250（对应实际坐标 2），N 点：x=550（对应实际坐标 6）
        // C 点运动范围：x ∈ [250, 550]
        // P 点轨迹：y=340 水平线，x ∈ [325, 475]，轨迹长度=150px=2 单位
        
        const SVG_WIDTH = 800;
        const SVG_HEIGHT = 500;
        const SCALE = 75;  // 每单位 75px
        const A_X = 100;
        const B_X = 700;
        const AB_Y = 430;
        const M_X = 250;
        const N_X = 550;
        const P_TRAJECTORY_Y = 340;
        const P_TRAJECTORY_START_X = 325;
        const P_TRAJECTORY_END_X = 475;
        
        // 获取 DOM 元素
        const svg = document.getElementById('scene3-svg');
        const slider = document.getElementById('scene3-slider');
        const resetBtn = document.getElementById('scene3-btn-reset');
        
        // 动态元素
        const pointC = document.getElementById('scene3-point-c');
        const pointD = document.getElementById('scene3-point-d');
        const pointE = document.getElementById('scene3-point-e');
        const pointP = document.getElementById('scene3-point-p');
        const triACD = document.getElementById('scene3-tri-acd');
        const triBCE = document.getElementById('scene3-tri-bce');
        const lineDE = document.getElementById('scene3-line-de');
        const lineTrajectory = document.getElementById('scene3-line-trajectory');
        const labelC = document.getElementById('scene3-label-c');
        const labelD = document.getElementById('scene3-label-d');
        const labelE = document.getElementById('scene3-label-e');
        const labelP = document.getElementById('scene3-label-p');
        const labelTrajectoryLen = document.getElementById('scene3-label-trajectory-len');
        
        // 坐标转换函数
        function cToPx(c) {
            return A_X + c * SCALE;
        }
        
        function pxToC(px) {
            return (px - A_X) / SCALE;
        }
        
        // 计算 D 点坐标（等边三角形 ACD 顶点）
        function calcD(c) {
            const ax = cToPx(0);
            const cx = cToPx(c);
            const ay = AB_Y;
            const dx = (ax + cx) / 2;
            const dy = ay - (cx - ax) * Math.sqrt(3) / 2;
            return { x: dx, y: dy };
        }
        
        // 计算 E 点坐标（等边三角形 BCE 顶点）
        function calcE(c) {
            const cx = cToPx(c);
            const bx = cToPx(8);
            const cy = AB_Y;
            const ex = (cx + bx) / 2;
            const ey = cy - (bx - cx) * Math.sqrt(3) / 2;
            return { x: ex, y: ey };
        }
        
        // 计算 P 点坐标（DE 中点）
        function calcP(d, e) {
            return {
                x: (d.x + e.x) / 2,
                y: (d.y + e.y) / 2
            };
        }
        
        // 更新标签位置
        function updateLabels(c, d, e, p) {
            // C 点标签
            const cx = cToPx(c);
            labelC.setAttribute('x', cx);
            
            // D 点标签（左上方，确保不超出画布）
            const dLabelX = d.x - 20;
            const dLabelY = Math.max(35, d.y - 15);
            labelD.setAttribute('x', dLabelX);
            labelD.setAttribute('y', dLabelY);
            
            // E 点标签（右上方，确保不超出画布）
            const eLabelX = e.x + 20;
            const eLabelY = Math.max(35, e.y - 15);
            labelE.setAttribute('x', eLabelX);
            labelE.setAttribute('y', eLabelY);
            
            // P 点标签
            labelP.setAttribute('x', p.x);
        }
        
        // 重绘所有动态元素
        function redraw(c) {
            const cx = cToPx(c);
            
            // 更新 C 点位置
            pointC.setAttribute('cx', cx);
            
            // 计算 D、E、P 点
            const d = calcD(c);
            const e = calcE(c);
            const p = calcP(d, e);
            
            // 更新 D、E、P 点位置
            pointD.setAttribute('cx', d.x);
            pointD.setAttribute('cy', d.y);
            pointE.setAttribute('cx', e.x);
            pointE.setAttribute('cy', e.y);
            pointP.setAttribute('cx', p.x);
            pointP.setAttribute('cy', p.y);
            
            // 更新三角形 ACD
            const ax = cToPx(0);
            triACD.setAttribute('points', `${ax},${AB_Y} ${cx},${AB_Y} ${d.x},${d.y}`);
            
            // 更新三角形 BCE
            const bx = cToPx(8);
            triBCE.setAttribute('points', `${cx},${AB_Y} ${bx},${AB_Y} ${e.x},${e.y}`);
            
            // 更新线段 DE
            lineDE.setAttribute('x1', d.x);
            lineDE.setAttribute('y1', d.y);
            lineDE.setAttribute('x2', e.x);
            lineDE.setAttribute('y2', e.y);
            
            // 更新轨迹线段（从起点到当前 P 点）
            const trajectoryEndX = Math.max(P_TRAJECTORY_START_X, Math.min(p.x, P_TRAJECTORY_END_X));
            lineTrajectory.setAttribute('x1', P_TRAJECTORY_START_X);
            lineTrajectory.setAttribute('x2', trajectoryEndX);
            
            // 更新标签位置
            updateLabels(c, d, e, p);
            
            // 显示轨迹长度（当 P 点到达终点时）
            if (Math.abs(p.x - P_TRAJECTORY_END_X) < 2) {
                labelTrajectoryLen.style.opacity = '1';
            } else {
                labelTrajectoryLen.style.opacity = '0.6';
            }
        }
        
        // 初始化
        function init() {
            slider.value = 400;
            redraw(4);
            labelTrajectoryLen.style.opacity = '0.6';
        }
        
        // 事件监听
        slider.addEventListener('input', function() {
            const px = parseFloat(this.value);
            const c = pxToC(px);
            redraw(c);
        });
        
        resetBtn.addEventListener('click', function() {
            slider.value = 400;
            redraw(4);
            labelTrajectoryLen.style.opacity = '0.6';
        });
        
        // 页面加载完成后初始化
        init();
    })();
    </script>
</body>
</html>
