<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三棱柱表面展开图 - 场景 2</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Microsoft YaHei', sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene2-btn-prev, #scene2-btn-next {
            padding: 10px 20px;
            font-size: 16px;
            border: 2px solid #1565c0;
            border-radius: 6px;
            background: #ffffff;
            color: #1565c0;
            cursor: pointer;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        #scene2-btn-prev:hover:not(:disabled), #scene2-btn-next:hover:not(:disabled) {
            background: #1565c0;
            color: #ffffff;
        }
        #scene2-btn-prev:disabled, #scene2-btn-next:disabled {
            border-color: #cccccc;
            color: #cccccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 选项 A 图形组：x=50~220, y=80~320 -->
            <g id="scene2-optionA">
                <!-- A-矩形 1: (60,120)-(110,240) -->
                <rect x="60" y="120" width="50" height="120" fill="none" stroke="#000000" stroke-width="2" class="option-shape"/>
                <!-- A-矩形 2: (110,120)-(160,240) -->
                <rect x="110" y="120" width="50" height="120" fill="none" stroke="#000000" stroke-width="2" class="option-shape"/>
                <!-- A-矩形 3: (160,120)-(210,240) -->
                <rect x="160" y="120" width="50" height="120" fill="none" stroke="#000000" stroke-width="2" class="option-shape"/>
                <!-- A-三角形 1: (60,120)-(85,80)-(110,120) 左上 -->
                <path d="M 60 120 L 85 80 L 110 120 Z" fill="none" stroke="#000000" stroke-width="2" class="option-shape"/>
                <!-- A-三角形 2: (160,240)-(185,280)-(210,240) 右下 -->
                <path d="M 160 240 L 185 280 L 210 240 Z" fill="none" stroke="#000000" stroke-width="2" class="option-shape"/>
            </g>
            
            <!-- 选项 B 图形组：x=240~410, y=80~320 -->
            <g id="scene2-optionB">
                <!-- B-矩形 1: (250,120)-(300,240) -->
                <rect x="250" y="120" width="50" height="120" fill="none" stroke="#000000" stroke-width="2" class="option-shape"/>
                <!-- B-矩形 2: (300,120)-(350,240) -->
                <rect x="300" y="120" width="50" height="120" fill="none" stroke="#000000" stroke-width="2" class="option-shape"/>
                <!-- B-矩形 3: (350,120)-(400,240) -->
                <rect x="350" y="120" width="50" height="120" fill="none" stroke="#000000" stroke-width="2" class="option-shape"/>
                <!-- B-三角形 1: (250,120)-(275,80)-(300,120) 左上方 -->
                <path d="M 250 120 L 275 80 L 300 120 Z" fill="none" stroke="#000000" stroke-width="2" class="option-shape"/>
                <!-- B-三角形 2: (350,120)-(375,80)-(400,120) 右上方 -->
                <path d="M 350 120 L 375 80 L 400 120 Z" fill="none" stroke="#000000" stroke-width="2" class="option-shape"/>
            </g>
            
            <!-- 选项 C 图形组：x=430~600, y=80~320 -->
            <g id="scene2-optionC">
                <!-- C-矩形 1: (440,120)-(490,240) -->
                <rect x="440" y="120" width="50" height="120" fill="none" stroke="#000000" stroke-width="2" class="option-shape"/>
                <!-- C-矩形 2: (490,120)-(540,240) -->
                <rect x="490" y="120" width="50" height="120" fill="none" stroke="#000000" stroke-width="2" class="option-shape"/>
                <!-- C-矩形 3: (540,120)-(590,240) -->
                <rect x="540" y="120" width="50" height="120" fill="none" stroke="#000000" stroke-width="2" class="option-shape"/>
                <!-- C-三角形 1: (440,240)-(465,280)-(490,240) 左下方 -->
                <path d="M 440 240 L 465 280 L 490 240 Z" fill="none" stroke="#000000" stroke-width="2" class="option-shape"/>
            </g>
            
            <!-- 选项 D 图形组：x=620~790, y=80~320 -->
            <g id="scene2-optionD">
                <!-- D-矩形 1: (630,120)-(680,240) -->
                <rect x="630" y="120" width="50" height="120" fill="none" stroke="#000000" stroke-width="2" class="option-shape"/>
                <!-- D-矩形 2: (680,120)-(730,240) -->
                <rect x="680" y="120" width="50" height="120" fill="none" stroke="#000000" stroke-width="2" class="option-shape"/>
                <!-- D-矩形 3: (730,120)-(780,240) -->
                <rect x="730" y="120" width="50" height="120" fill="none" stroke="#000000" stroke-width="2" class="option-shape"/>
            </g>
            
            <!-- 选项标签 -->
            <text id="scene2-label-A" x="135" y="345" font-size="20" font-weight="bold" fill="#000000" text-anchor="middle">A</text>
            <text id="scene2-label-B" x="325" y="345" font-size="20" font-weight="bold" fill="#000000" text-anchor="middle">B</text>
            <text id="scene2-label-C" x="515" y="345" font-size="20" font-weight="bold" fill="#000000" text-anchor="middle">C</text>
            <text id="scene2-label-D" x="705" y="345" font-size="20" font-weight="bold" fill="#000000" text-anchor="middle">D</text>
            
            <!-- 判断标记（初始隐藏）- 调整 x 坐标增加间距至 25px 以上 -->
            <text id="scene2-mark-A" x="175" y="345" font-size="20" font-weight="bold" fill="#2e7d32" text-anchor="middle" style="display: none;">✓</text>
            <text id="scene2-mark-B" x="365" y="345" font-size="20" font-weight="bold" fill="#c62828" text-anchor="middle" style="display: none;">✗</text>
            <text id="scene2-mark-C" x="555" y="345" font-size="20" font-weight="bold" fill="#c62828" text-anchor="middle" style="display: none;">✗</text>
            <text id="scene2-mark-D" x="745" y="345" font-size="20" font-weight="bold" fill="#c62828" text-anchor="middle" style="display: none;">✗</text>
            
            <!-- 步骤说明文本 -->
            <text id="scene2-step-text" x="400" y="400" font-size="16" fill="#000000" text-anchor="middle"></text>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-btn-prev">◀ 上一步</button>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现 - 三棱柱表面展开图分析
        
        // 状态变量
        let currentStep = 0;
        const totalSteps = 5;
        
        // 步骤说明文本内容
        const stepTexts = [
            "",  // 步骤 0：初始状态，无说明
            "选项 A：3 个矩形侧面 + 2 个三角形底面，位置正确，可折叠成三棱柱",
            "选项 B：2 个三角形都在同一侧，无法折叠成三棱柱",
            "选项 C：只有 1 个三角形底面，缺少一个底面",
            "选项 D：没有三角形底面，只有 3 个矩形",
            "正确答案：A（三棱柱展开图需 3 个矩形侧面 + 2 个三角形底面，且底面位于两侧）"
        ];
        
        // 获取 DOM 元素
        const optionGroups = {
            A: document.getElementById('scene2-optionA'),
            B: document.getElementById('scene2-optionB'),
            C: document.getElementById('scene2-optionC'),
            D: document.getElementById('scene2-optionD')
        };
        
        const markElements = {
            A: document.getElementById('scene2-mark-A'),
            B: document.getElementById('scene2-mark-B'),
            C: document.getElementById('scene2-mark-C'),
            D: document.getElementById('scene2-mark-D')
        };
        
        const stepTextElement = document.getElementById('scene2-step-text');
        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        
        // 获取所有形状元素用于高亮
        function getOptionShapes(option) {
            const group = optionGroups[option];
            return group.querySelectorAll('.option-shape');
        }
        
        // 设置选项高亮状态
        function setOptionHighlight(option, highlightType) {
            const shapes = getOptionShapes(option);
            shapes.forEach(shape => {
                if (highlightType === 'none') {
                    shape.style.stroke = '#000000';
                    shape.style.strokeWidth = '2';
                    shape.style.fillOpacity = '0';
                } else if (highlightType === 'blue') {
                    shape.style.stroke = '#1565c0';
                    shape.style.strokeWidth = '3';
                    shape.style.fillOpacity = '0.2';
                    shape.style.fill = '#bbdefb';
                } else if (highlightType === 'green') {
                    shape.style.stroke = '#2e7d32';
                    shape.style.strokeWidth = '3';
                    shape.style.fillOpacity = '0.2';
                    shape.style.fill = '#c8e6c9';
                }
            });
        }
        
        // 更新显示
        function updateDisplay() {
            // 重置所有选项的高亮
            ['A', 'B', 'C', 'D'].forEach(opt => {
                setOptionHighlight(opt, 'none');
            });
            
            // 隐藏所有判断标记
            Object.values(markElements).forEach(mark => {
                mark.style.display = 'none';
            });
            
            // 根据当前步骤更新状态
            if (currentStep === 0) {
                // 步骤 0：初始状态，无高亮
                stepTextElement.textContent = '';
            } else if (currentStep >= 1 && currentStep <= 4) {
                // 步骤 1-4：高亮当前选项并显示判断标记
                const options = ['A', 'B', 'C', 'D'];
                const currentOption = options[currentStep - 1];
                setOptionHighlight(currentOption, 'blue');
                markElements[currentOption].style.display = 'block';
                stepTextElement.textContent = stepTexts[currentStep];
            } else if (currentStep === 5) {
                // 步骤 5：绿色高亮正确答案 A
                setOptionHighlight('A', 'green');
                // 显示所有判断标记
                markElements.A.style.display = 'block';
                markElements.B.style.display = 'block';
                markElements.C.style.display = 'block';
                markElements.D.style.display = 'block';
                stepTextElement.textContent = stepTexts[5];
            }
            
            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps);
        }
        
        // 按钮事件绑定
        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        });
        
        btnNext.addEventListener('click', () => {
            if (currentStep < totalSteps) {
                currentStep++;
                updateDisplay();
            }
        });
        
        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
