<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 二次函数与一次函数象限分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene2-btn { padding: 8px 20px; font-size: 14px; cursor: pointer; border: 2px solid #333; border-radius: 4px; background: #f5f5f5; transition: all 0.2s; }
        .scene2-btn:hover { background: #e0e0e0; }
        .scene2-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        svg { display: block; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" id="scene2-svg">
            <!-- 坐标轴 -->
            <line id="scene2-axis-x" x1="100" y1="250" x2="700" y2="250" stroke="#333" stroke-width="2"/>
            <line id="scene2-axis-y" x1="400" y1="100" x2="400" y2="400" stroke="#333" stroke-width="2"/>
            
            <!-- x 轴箭头 -->
            <polygon id="scene2-arrow-x" points="700,250 685,245 685,255" fill="#333"/>
            <!-- y 轴箭头 -->
            <polygon id="scene2-arrow-y" points="400,100 395,115 405,115" fill="#333"/>
            
            <!-- 轴标签 -->
            <text id="scene2-label-x" x="680" y="235" font-size="16" fill="#333">x</text>
            <text id="scene2-label-y" x="405" y="110" font-size="16" fill="#333">y</text>
            
            <!-- 原点 O - 移到轴下方避免与直线重叠 -->
            <text id="scene2-label-O" x="385" y="275" font-size="16" fill="#333">O</text>
            
            <!-- 象限标注 - 调整位置到象限中心，远离直线 -->
            <text id="scene2-quadrant-I" x="600" y="140" font-size="16" fill="#333">Ⅰ</text>
            <text id="scene2-quadrant-II" x="180" y="140" font-size="16" fill="#333">Ⅱ</text>
            <text id="scene2-quadrant-III" x="180" y="360" font-size="16" fill="#333">Ⅲ</text>
            <text id="scene2-quadrant-IV" x="600" y="360" font-size="16" fill="#333">Ⅳ</text>
            
            <!-- 参数条件区 - 移到左侧空白区域，增加行间距，调整 y=ax+b 位置 -->
            <text id="scene2-cond-a" x="50" y="120" font-size="14" fill="#c62828" font-weight="bold">a &lt; 0</text>
            <text id="scene2-cond-b" x="50" y="155" font-size="14" fill="#1565c0">b &lt; 0</text>
            <text id="scene2-cond-func" x="50" y="220" font-size="14" fill="#333">y = ax + b</text>
            
            <!-- 步骤 1: 一次函数直线 -->
            <g id="scene2-step1-group" style="display: none;">
                <line id="scene2-line" x1="150" y1="150" x2="650" y2="350" stroke="#1565c0" stroke-width="3" opacity="0"/>
                <!-- 斜率箭头 - 移到直线左侧空白处，远离 a<0 标签 -->
                <line id="scene2-slope-arrow-line" x1="80" y1="180" x2="130" y2="200" stroke="#c62828" stroke-width="2" opacity="0"/>
                <polygon id="scene2-slope-arrow-head" points="130,200 120,195 120,205" fill="#c62828" opacity="0"/>
                <text id="scene2-slope-label" x="85" y="195" font-size="12" fill="#c62828" opacity="0">a &lt; 0</text>
            </g>
            
            <!-- 步骤 2: 截距标注 -->
            <g id="scene2-step2-group" style="display: none;">
                <circle id="scene2-intercept-point" cx="400" cy="300" r="6" fill="#1565c0" opacity="0"/>
                <text id="scene2-intercept-label" x="415" y="305" font-size="14" fill="#1565c0" opacity="0">b &lt; 0</text>
            </g>
            
            <!-- 步骤 3: 象限填充与结论 -->
            <g id="scene2-step3-group" style="display: none;">
                <!-- 象限Ⅱ填充 - 调整范围避免与文字重叠 -->
                <rect id="scene2-quad-fill-II" x="100" y="100" width="250" height="120" fill="#2e7d32" opacity="0"/>
                <!-- 象限Ⅲ填充 - 调整范围避免与文字重叠 -->
                <rect id="scene2-quad-fill-III" x="100" y="250" width="250" height="120" fill="#2e7d32" opacity="0"/>
                <!-- 象限Ⅳ填充 - 调整范围避免与文字重叠 -->
                <rect id="scene2-quad-fill-IV" x="450" y="250" width="250" height="120" fill="#2e7d32" opacity="0"/>
                <!-- 不经过标注 - 移到象限Ⅰ中心，远离直线 -->
                <text id="scene2-not-pass" x="600" y="180" font-size="16" fill="#c62828" font-weight="bold" opacity="0">不经过</text>
            </g>
        </svg>
        
        <div id="scene2-controls">
            <button id="scene2-prev-btn" class="scene2-btn" disabled>◀ 上一步</button>
            <button id="scene2-next-btn" class="scene2-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现
        // 布局坐标表对照（已调整避免重叠）：
        // x 轴：(100,250)-(700,250)
        // y 轴：(400,100)-(400,400)
        // 原点 O：(385,275) - 下移避免与直线重叠
        // 象限Ⅰ：(600,140)  象限Ⅱ：(180,140)  象限Ⅲ：(180,360)  象限Ⅳ：(600,360) - 移到象限中心
        // 一次函数直线：(150,150)-(650,350)
        // 斜率箭头：(80,180)-(130,200) - 移到左侧空白处，远离 a<0 标签
        // 截距标注点：(400,300)
        // 参数条件区：移到左侧 (50,120)-(50,220) - 增加行间距，y=ax+b 下移
        // a<0：(50,120)  b<0：(50,155)  y=ax+b：(50,220)
        // 不经过标注：(600,180) - 移到象限Ⅰ中心
        
        const currentStepMax = 3;
        let currentStep = 0;
        
        // 工具函数：显示元素（同时设置 display 和 opacity）
        function show(el) {
            if (!el) return;
            if (el.style) {
                el.style.display = '';
                el.style.opacity = '1';
            }
        }
        
        // 工具函数：隐藏元素
        function hide(el) {
            if (!el) return;
            if (el.style) {
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }
        
        // 更新步骤显示状态
        function updateStep() {
            const prevBtn = document.getElementById('scene2-prev-btn');
            const nextBtn = document.getElementById('scene2-next-btn');
            
            // 步骤 1 组
            const step1Group = document.getElementById('scene2-step1-group');
            if (currentStep >= 1) {
                show(step1Group);
                // 动画效果
                const line = document.getElementById('scene2-line');
                const slopeLine = document.getElementById('scene2-slope-arrow-line');
                const slopeHead = document.getElementById('scene2-slope-arrow-head');
                const slopeLabel = document.getElementById('scene2-slope-label');
                
                if (line) {
                    line.style.opacity = '1';
                    line.style.transition = 'opacity 0.3s';
                }
                if (slopeLine) {
                    slopeLine.style.opacity = '1';
                    slopeLine.style.transition = 'opacity 0.3s';
                }
                if (slopeHead) {
                    slopeHead.style.opacity = '1';
                    slopeHead.style.transition = 'opacity 0.3s';
                }
                if (slopeLabel) {
                    slopeLabel.style.opacity = '1';
                    slopeLabel.style.transition = 'opacity 0.3s';
                }
                
                // 高亮 a<0
                const condA = document.getElementById('scene2-cond-a');
                if (condA) {
                    condA.style.fontWeight = 'bold';
                }
            } else {
                hide(step1Group);
            }
            
            // 步骤 2 组
            const step2Group = document.getElementById('scene2-step2-group');
            if (currentStep >= 2) {
                show(step2Group);
                const interceptPoint = document.getElementById('scene2-intercept-point');
                const interceptLabel = document.getElementById('scene2-intercept-label');
                
                if (interceptPoint) {
                    interceptPoint.style.opacity = '1';
                    interceptPoint.style.transition = 'opacity 0.3s';
                }
                if (interceptLabel) {
                    interceptLabel.style.opacity = '1';
                    interceptLabel.style.transition = 'opacity 0.3s';
                }
                
                // 高亮 b<0
                const condB = document.getElementById('scene2-cond-b');
                if (condB) {
                    condB.style.fontWeight = 'bold';
                }
            } else {
                hide(step2Group);
            }
            
            // 步骤 3 组
            const step3Group = document.getElementById('scene2-step3-group');
            if (currentStep >= 3) {
                show(step3Group);
                const quadFillII = document.getElementById('scene2-quad-fill-II');
                const quadFillIII = document.getElementById('scene2-quad-fill-III');
                const quadFillIV = document.getElementById('scene2-quad-fill-IV');
                const notPass = document.getElementById('scene2-not-pass');
                const quadrantI = document.getElementById('scene2-quadrant-I');
                
                if (quadFillII) {
                    quadFillII.style.opacity = '0.2';
                    quadFillII.style.transition = 'opacity 0.3s';
                }
                if (quadFillIII) {
                    quadFillIII.style.opacity = '0.2';
                    quadFillIII.style.transition = 'opacity 0.3s';
                }
                if (quadFillIV) {
                    quadFillIV.style.opacity = '0.2';
                    quadFillIV.style.transition = 'opacity 0.3s';
                }
                if (notPass) {
                    notPass.style.opacity = '1';
                    notPass.style.transition = 'opacity 0.3s';
                }
                if (quadrantI) {
                    quadrantI.style.fill = '#c62828';
                    quadrantI.style.fontWeight = 'bold';
                }
            } else {
                hide(step3Group);
            }
            
            // 更新按钮状态
            prevBtn.disabled = (currentStep === 0);
            nextBtn.disabled = (currentStep === currentStepMax);
        }
        
        // 绑定按钮事件
        const prevBtn = document.getElementById('scene2-prev-btn');
        const nextBtn = document.getElementById('scene2-next-btn');
        
        prevBtn.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });
        
        nextBtn.addEventListener('click', function() {
            if (currentStep < currentStepMax) {
                currentStep++;
                updateStep();
            }
        });
        
        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
