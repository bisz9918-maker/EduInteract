<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 1 - 圆内接等腰三角形</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Microsoft YaHei', sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene1-controls button { width: 120px; height: 36px; font-size: 14px; cursor: pointer; border: 2px solid #1565c0; border-radius: 6px; background: #ffffff; color: #1565c0; transition: all 0.2s; }
        #scene1-controls button:hover:not(:disabled) { background: #1565c0; color: #ffffff; }
        #scene1-controls button:disabled { border-color: #cccccc; color: #999999; cursor: not-allowed; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 圆⊙O -->
            <circle id="scene1-circle-o" cx="400" cy="250" r="150" fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 直径 AD -->
            <line id="scene1-line-ad" x1="250" y1="250" x2="550" y2="250" stroke="#000000" stroke-width="2"/>
            
            <!-- 三角形 ABC 边 -->
            <line id="scene1-line-ab" x1="250" y1="250" x2="400" y2="380" stroke="#000000" stroke-width="2"/>
            <line id="scene1-line-bc" x1="400" y1="380" x2="530" y2="310" stroke="#000000" stroke-width="2"/>
            <line id="scene1-line-ac" x1="250" y1="250" x2="530" y2="310" stroke="#000000" stroke-width="2"/>
            
            <!-- 辅助线 BD (步骤 2 显示) -->
            <line id="scene1-line-bd" x1="400" y1="380" x2="550" y2="250" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5" style="display: none; opacity: 0;"/>
            
            <!-- 等长标记 AB (在 AB 中点附近垂直短线) -->
            <line id="scene1-mark-ab" x1="320" y1="310" x2="330" y2="320" stroke="#000000" stroke-width="2" style="display: none;"/>
            
            <!-- 等长标记 BC (在 BC 中点附近垂直短线) -->
            <line id="scene1-mark-bc" x1="460" y1="340" x2="470" y2="350" stroke="#000000" stroke-width="2" style="display: none;"/>
            
            <!-- △ABC 高亮填充 (步骤 1 显示) -->
            <path id="scene1-fill-abc" d="M 250 250 L 400 380 L 530 310 Z" fill="#1565c0" fill-opacity="0.2" style="display: none; opacity: 0;"/>
            
            <!-- Rt△ABD 高亮填充 (步骤 3 显示) -->
            <path id="scene1-fill-abd" d="M 250 250 L 400 380 L 550 250 Z" fill="#1565c0" fill-opacity="0.2" style="display: none; opacity: 0;"/>
            
            <!-- 点 A -->
            <circle id="scene1-point-a" cx="250" cy="250" r="4" fill="#000000"/>
            <!-- 点 B -->
            <circle id="scene1-point-b" cx="400" cy="380" r="4" fill="#000000"/>
            <!-- 点 C -->
            <circle id="scene1-point-c" cx="530" cy="310" r="4" fill="#000000"/>
            <!-- 点 D -->
            <circle id="scene1-point-d" cx="550" cy="250" r="4" fill="#000000"/>
            <!-- 圆心 O -->
            <circle id="scene1-point-o" cx="400" cy="250" r="4" fill="#000000"/>
            
            <!-- 标签 A (远离点 A，左下方) -->
            <text id="scene1-label-a" x="235" y="295" font-size="16" fill="#000000">A</text>
            <!-- 标签 B (远离点 B，正下方) -->
            <text id="scene1-label-b" x="400" y="435" font-size="16" fill="#000000" text-anchor="middle">B</text>
            <!-- 标签 C (远离点 C，右侧) -->
            <text id="scene1-label-c" x="575" y="320" font-size="16" fill="#000000">C</text>
            <!-- 标签 D (远离点 D，右上方) -->
            <text id="scene1-label-d" x="595" y="230" font-size="16" fill="#000000">D</text>
            <!-- 标签 O (放在圆心左侧，不与其他标签重叠) -->
            <text id="scene1-label-o" x="385" y="245" font-size="16" fill="#000000">O</text>
            
            <!-- ∠ABC 弧线 (步骤 0 显示) - 调整到三角形内部 -->
            <path id="scene1-arc-abc" d="M 385 365 Q 375 350 385 335" fill="none" stroke="#1565c0" stroke-width="1.5" style="display: none;"/>
            <!-- ∠ABC 数值 (步骤 0 显示) - 移到三角形内部上方 -->
            <text id="scene1-text-abc" x="365" y="330" font-size="14" fill="#000000">120°</text>
            
            <!-- ∠BAC 弧线 (步骤 1 显示) - 调整位置 -->
            <path id="scene1-arc-bac" d="M 265 260 Q 260 270 270 275" fill="none" stroke="#1565c0" stroke-width="1.5" style="display: none; opacity: 0;"/>
            <!-- ∠BAC 数值 (步骤 1 显示) - 移到三角形内部 -->
            <text id="scene1-text-bac" x="260" y="250" font-size="14" fill="#000000" style="display: none; opacity: 0;">30°</text>
            
            <!-- ∠ABD 直角标记 (步骤 2 显示) - 调整位置 -->
            <rect id="scene1-rect-abd" x="385" y="365" width="15" height="15" fill="none" stroke="#c62828" stroke-width="2" style="display: none; opacity: 0;"/>
            <!-- ∠ABD 数值 (步骤 2 显示) - 移到右侧 -->
            <text id="scene1-text-abd" x="425" y="375" font-size="14" fill="#000000" style="display: none; opacity: 0;">90°</text>
            
            <!-- AD 长度标注 (步骤 0 显示) - 移到直径上方，与 O 标签错开 -->
            <text id="scene1-text-ad" x="400" y="200" font-size="14" fill="#000000" text-anchor="middle" style="display: none;">AD=6</text>
            
            <!-- 计算式 (步骤 3 显示) - 移到右侧更靠边，增加行间距 -->
            <text id="scene1-text-calc" x="600" y="345" font-size="13" fill="#1565c0" font-weight="bold" style="display: none; opacity: 0;">AB=AD·cos30°</text>
            <text id="scene1-text-calc2" x="600" y="375" font-size="13" fill="#1565c0" font-weight="bold" style="display: none; opacity: 0;">=6×(√3/2)=3√3</text>
            
            <!-- 最终答案 (步骤 4 显示) -->
            <text id="scene1-text-answer" x="600" y="405" font-size="16" fill="#2e7d32" font-weight="bold" style="display: none; opacity: 0;">AB=3√3</text>
            <text id="scene1-text-option" x="600" y="425" font-size="14" fill="#2e7d32" style="display: none; opacity: 0;">选项 C</text>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-prev-btn" disabled>◀ 上一步</button>
            <button id="scene1-next-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现
        // 布局坐标表对照：
        // | 元素 | 类型 | 位置/范围 | 大小 | 备注 |
        // | 圆⊙O | circle | 圆心 (400,250) | 半径 150px | 居中放置 |
        // | 点 A | circle | (250,250) | 4px 半径 | 直径左端点 |
        // | 点 B | circle | (400,380) | 4px 半径 | 圆周下方 |
        // | 点 C | circle | (530,310) | 4px 半径 | 圆周右侧 |
        // | 点 D | circle | (550,250) | 4px 半径 | 直径右端点 |
        // | 圆心 O | circle | (400,250) | 4px 半径 | 直径中点 |
        
        const MAX_STEP = 4;
        let currentStep = 0;
        
        // 工具函数：显示元素
        function show(el) {
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }
        
        // 工具函数：隐藏元素
        function hide(el) {
            if (el) {
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }
        
        // 更新场景显示
        function updateScene() {
            // 步骤 0：初始状态
            // 显示：圆⊙O、点 A/B/C/D/O、线段 AB/BC/AC/AD、等长标记 AB/BC
            // 标注：∠ABC=120°、AD=6
            if (currentStep >= 0) {
                show(document.getElementById('scene1-arc-abc'));
                show(document.getElementById('scene1-text-abc'));
                show(document.getElementById('scene1-text-ad'));
                show(document.getElementById('scene1-mark-ab'));
                show(document.getElementById('scene1-mark-bc'));
            }
            
            // 步骤 1：新增△ABC 高亮填充、∠BAC 标注
            if (currentStep >= 1) {
                show(document.getElementById('scene1-fill-abc'));
                show(document.getElementById('scene1-arc-bac'));
                show(document.getElementById('scene1-text-bac'));
            }
            
            // 步骤 2：新增辅助线 BD、∠ABD 直角标记
            if (currentStep >= 2) {
                show(document.getElementById('scene1-line-bd'));
                show(document.getElementById('scene1-rect-abd'));
                show(document.getElementById('scene1-text-abd'));
            }
            
            // 步骤 3：新增 Rt△ABD 高亮填充、计算式
            if (currentStep >= 3) {
                show(document.getElementById('scene1-fill-abd'));
                show(document.getElementById('scene1-text-calc'));
                show(document.getElementById('scene1-text-calc2'));
            }
            
            // 步骤 4：最终答案
            if (currentStep >= 4) {
                show(document.getElementById('scene1-text-answer'));
                show(document.getElementById('scene1-text-option'));
            }
            
            // 更新按钮状态
            document.getElementById('scene1-prev-btn').disabled = (currentStep === 0);
            document.getElementById('scene1-next-btn').disabled = (currentStep === MAX_STEP);
        }
        
        // 初始化
        function init() {
            updateScene();
            
            // 绑定按钮事件
            document.getElementById('scene1-prev-btn').addEventListener('click', function() {
                if (currentStep > 0) {
                    currentStep--;
                    updateScene();
                }
            });
            
            document.getElementById('scene1-next-btn').addEventListener('click', function() {
                if (currentStep < MAX_STEP) {
                    currentStep++;
                    updateScene();
                }
            });
        }
        
        // 页面加载完成后初始化
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>
</body>
</html>
