<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 电路开关状态分析</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene2-controls button { padding: 8px 20px; font-size: 14px; cursor: pointer; border: 2px solid #333; border-radius: 5px; background: #f5f5f5; }
        #scene2-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene2-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene2-info-text { font-size: 14px; fill: #333; }
        .scene2-power-text { font-size: 13px; fill: #1565c0; font-weight: bold; }
        .scene2-lamp-label { font-size: 16px; fill: #000; font-weight: bold; }
        .scene2-switch-label { font-size: 16px; fill: #000; font-weight: bold; }
        .scene2-wire { stroke: #000; stroke-width: 2px; fill: none; }
        .scene2-wire-active { stroke: #1565c0; stroke-width: 3px; }
        .scene2-wire-closed { stroke: #c62828; stroke-width: 3px; }
        .scene2-lamp-border { stroke: #2e7d32; stroke-width: 2px; fill: none; }
        .scene2-lamp-fill { fill: #2e7d32; }
        .scene2-current-arrow { fill: #1565c0; }
        .scene2-table { fill: none; stroke: #333; stroke-width: 1px; }
        .scene2-table-header { fill: #e3f2fd; stroke: #333; stroke-width: 1px; }
        .scene2-table-text { font-size: 12px; fill: #333; text-anchor: middle; dominant-baseline: middle; }
        .scene2-correct { fill: #2e7d32; font-weight: bold; }
        .scene2-circuit-group { transition: opacity 0.3s; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" id="scene2-svg">
            <!-- 电路图组 - 步骤 4 时隐藏 -->
            <g id="scene2-circuit-group" class="scene2-circuit-group">
                <!-- L₁灯泡：左侧上方 -->
                <circle cx="180" cy="190" r="35" class="scene2-lamp-border" id="scene2-lamp1-border"/>
                <line x1="155" y1="165" x2="205" y2="215" class="scene2-lamp-border" id="scene2-lamp1-cross1"/>
                <line x1="205" y1="165" x2="155" y2="215" class="scene2-lamp-border" id="scene2-lamp1-cross2"/>
                <circle cx="180" cy="190" r="35" class="scene2-lamp-fill" id="scene2-lamp1-fill" opacity="0.7"/>
                <text x="180" y="145" class="scene2-lamp-label" text-anchor="middle">L₁</text>
                
                <!-- L₂灯泡：右侧上方 -->
                <circle cx="520" cy="190" r="35" class="scene2-lamp-border" id="scene2-lamp2-border"/>
                <line x1="495" y1="165" x2="545" y2="215" class="scene2-lamp-border" id="scene2-lamp2-cross1"/>
                <line x1="545" y1="165" x2="495" y2="215" class="scene2-lamp-border" id="scene2-lamp2-cross2"/>
                <circle cx="520" cy="190" r="35" class="scene2-lamp-fill" id="scene2-lamp2-fill" opacity="0.7"/>
                <text x="520" y="145" class="scene2-lamp-label" text-anchor="middle">L₂</text>
                
                <!-- S₂开关：顶部支路 -->
                <line x1="180" y1="120" x2="180" y2="100" class="scene2-wire"/>
                <line x1="180" y1="100" x2="330" y2="100" class="scene2-wire" id="scene2-s2-wire1"/>
                <line x1="330" y1="100" x2="330" y2="190" class="scene2-wire" id="scene2-s2-wire2"/>
                <!-- S₂开关臂（断开状态） -->
                <line x1="180" y1="100" x2="210" y2="85" class="scene2-wire" id="scene2-s2-arm"/>
                <circle cx="180" cy="100" r="4" fill="#000"/>
                <circle cx="330" cy="100" r="4" fill="#000"/>
                <text x="255" y="75" class="scene2-switch-label" text-anchor="middle">S₂</text>
                
                <!-- 主导线 -->
                <!-- 左侧竖线 -->
                <line x1="180" y1="190" x2="180" y2="400" class="scene2-wire"/>
                <line x1="180" y1="190" x2="180" y2="120" class="scene2-wire"/>
                <!-- L₁到 L₂ -->
                <line x1="215" y1="190" x2="485" y2="190" class="scene2-wire"/>
                <!-- L₂右侧竖线 -->
                <line x1="555" y1="190" x2="555" y2="100" class="scene2-wire"/>
                <line x1="555" y1="190" x2="555" y2="260" class="scene2-wire"/>
                <!-- 底部横线 -->
                <line x1="180" y1="400" x2="350" y2="400" class="scene2-wire"/>
                <line x1="450" y1="400" x2="610" y2="400" class="scene2-wire"/>
                
                <!-- 电源：底部中央 -->
                <line x1="350" y1="400" x2="450" y2="400" class="scene2-wire"/>
                <line x1="380" y1="390" x2="380" y2="410" class="scene2-wire" stroke-width="3"/>
                <line x1="420" y1="395" x2="420" y2="405" class="scene2-wire" stroke-width="2"/>
                <text x="400" y="430" class="scene2-info-text" text-anchor="middle">3V</text>
                
                <!-- 触点 b -->
                <circle cx="350" cy="260" r="5" fill="#000" id="scene2-contact-b-dot"/>
                <line x1="350" y1="260" x2="350" y2="190" class="scene2-wire"/>
                <text x="330" y="265" class="scene2-info-text">b</text>
                
                <!-- S₁开关：右下角 -->
                <circle cx="610" cy="350" r="5" fill="#000" id="scene2-s1-pivot"/>
                <line x1="610" y1="350" x2="610" y2="400" class="scene2-wire"/>
                <!-- S₁开关臂（初始悬空） -->
                <line x1="610" y1="350" x2="640" y2="320" class="scene2-wire" id="scene2-s1-arm"/>
                <!-- 触点 a -->
                <circle cx="660" cy="190" r="5" fill="#000" id="scene2-contact-a-dot"/>
                <line x1="660" y1="190" x2="555" y2="190" class="scene2-wire"/>
                <text x="675" y="195" class="scene2-info-text">a</text>
                <text x="625" y="380" class="scene2-switch-label">S₁</text>
            </g>
            
            <!-- 功率标签 - 步骤 4 时隐藏 -->
            <text x="140" y="330" class="scene2-power-text" id="scene2-power1">L₁: —</text>
            <text x="480" y="330" class="scene2-power-text" id="scene2-power2">L₂: —</text>
            
            <!-- 状态说明 - 移到更下方 -->
            <text x="400" y="375" class="scene2-info-text" text-anchor="middle" id="scene2-status-text">点击下一步分析开关状态</text>
            <text x="400" y="405" class="scene2-info-text" text-anchor="middle" id="scene2-power-text">—</text>
            
            <!-- 对比表格（步骤 4 显示） -->
            <g id="scene2-table" style="display: none;">
                <!-- 表格背景 -->
                <rect x="30" y="50" width="740" height="320" fill="#fff" stroke="#333" stroke-width="2"/>
                <!-- 表头 -->
                <rect x="30" y="50" width="740" height="40" class="scene2-table-header"/>
                <line x1="30" y1="90" x2="770" y2="90" class="scene2-table"/>
                <line x1="140" y1="50" x2="140" y2="90" class="scene2-table"/>
                <line x1="240" y1="50" x2="240" y2="90" class="scene2-table"/>
                <line x1="360" y1="50" x2="360" y2="90" class="scene2-table"/>
                <line x1="480" y1="50" x2="480" y2="90" class="scene2-table"/>
                <line x1="620" y1="50" x2="620" y2="90" class="scene2-table"/>
                <text x="85" y="70" class="scene2-table-text">状态</text>
                <text x="190" y="70" class="scene2-table-text">S₂</text>
                <text x="300" y="70" class="scene2-table-text">S₁</text>
                <text x="420" y="70" class="scene2-table-text">L₁功率</text>
                <text x="550" y="70" class="scene2-table-text">L₂功率</text>
                <text x="690" y="70" class="scene2-table-text">谁更亮</text>
                
                <!-- 数据行 -->
                <line x1="30" y1="130" x2="770" y2="130" class="scene2-table"/>
                <line x1="140" y1="90" x2="140" y2="370" class="scene2-table"/>
                <line x1="240" y1="90" x2="240" y2="370" class="scene2-table"/>
                <line x1="360" y1="90" x2="360" y2="370" class="scene2-table"/>
                <line x1="480" y1="90" x2="480" y2="370" class="scene2-table"/>
                <line x1="620" y1="90" x2="620" y2="370" class="scene2-table"/>
                
                <text x="85" y="110" class="scene2-table-text">选项 A</text>
                <text x="190" y="110" class="scene2-table-text">断</text>
                <text x="300" y="110" class="scene2-table-text">b</text>
                <text x="420" y="110" class="scene2-table-text">1.5W</text>
                <text x="550" y="110" class="scene2-table-text">0W</text>
                <text x="690" y="110" class="scene2-table-text">L₁</text>
                
                <text x="85" y="150" class="scene2-table-text">选项 B</text>
                <text x="190" y="150" class="scene2-table-text">断</text>
                <text x="300" y="150" class="scene2-table-text">a</text>
                <text x="420" y="150" class="scene2-table-text">0.67W</text>
                <text x="550" y="150" class="scene2-table-text">0.33W</text>
                <text x="690" y="150" class="scene2-table-text">L₁</text>
                
                <text x="85" y="190" class="scene2-table-text">选项 C</text>
                <text x="190" y="190" class="scene2-table-text">断</text>
                <text x="300" y="190" class="scene2-table-text">a</text>
                <text x="420" y="190" class="scene2-table-text">0.67W</text>
                <text x="550" y="190" class="scene2-table-text">0.33W</text>
                <text x="690" y="190" class="scene2-table-text">L₁</text>
                
                <text x="85" y="230" class="scene2-table-text">选项 D</text>
                <text x="190" y="230" class="scene2-table-text">闭</text>
                <text x="300" y="230" class="scene2-table-text">b</text>
                <text x="420" y="230" class="scene2-table-text">1.5W</text>
                <text x="550" y="230" class="scene2-table-text">3W</text>
                <text x="690" y="230" class="scene2-correct">L₂</text>
                
                <line x1="30" y1="370" x2="770" y2="370" class="scene2-table"/>
                
                <!-- 正确答案标注 -->
                <text x="400" y="405" class="scene2-correct" text-anchor="middle" font-size="16px">正确答案：D（S₂闭合，S₁接 b 时 L₂更亮）</text>
            </g>
        </svg>
        
        <div id="scene2-controls">
            <button id="scene2-prev-btn" disabled>◀ 上一步</button>
            <button id="scene2-next-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现 - 电路开关状态分析
        const scene2 = {
            currentStep: 0,
            totalSteps: 5,
            
            elements: {
                svg: document.getElementById('scene2-svg'),
                prevBtn: document.getElementById('scene2-prev-btn'),
                nextBtn: document.getElementById('scene2-next-btn'),
                circuitGroup: document.getElementById('scene2-circuit-group'),
                lamp1Fill: document.getElementById('scene2-lamp1-fill'),
                lamp2Fill: document.getElementById('scene2-lamp2-fill'),
                lamp1Border: document.getElementById('scene2-lamp1-border'),
                lamp2Border: document.getElementById('scene2-lamp2-border'),
                s1Arm: document.getElementById('scene2-s1-arm'),
                s2Arm: document.getElementById('scene2-s2-arm'),
                s2Wire1: document.getElementById('scene2-s2-wire1'),
                s2Wire2: document.getElementById('scene2-s2-wire2'),
                power1: document.getElementById('scene2-power1'),
                power2: document.getElementById('scene2-power2'),
                statusText: document.getElementById('scene2-status-text'),
                powerText: document.getElementById('scene2-power-text'),
                table: document.getElementById('scene2-table')
            },
            
            steps: [
                {
                    s2Closed: false,
                    s1Position: null,
                    lamp1Opacity: 0.7,
                    lamp2Opacity: 0.7,
                    power1Text: 'L₁: —',
                    power2Text: 'L₂: —',
                    statusText: '点击下一步分析开关状态',
                    powerText: '—',
                    showTable: false,
                    showCircuit: true,
                    showPowerLabels: true,
                    s1ArmEnd: {x: 640, y: 320},
                    s2ArmEnd: {x: 210, y: 85}
                },
                {
                    s2Closed: false,
                    s1Position: 'b',
                    lamp1Opacity: 0.3,
                    lamp2Opacity: 0.7,
                    power1Text: 'L₁: 1.5W',
                    power2Text: 'L₂: 0W',
                    statusText: 'S₂断开，S₁接 b：L₁单独接入 3V 电源',
                    powerText: 'L₁功率 = U²/R₁ = 3²/6 = 1.5W（不能正常发光，需 6V）',
                    showTable: false,
                    showCircuit: true,
                    showPowerLabels: true,
                    s1ArmEnd: {x: 350, y: 260},
                    s2ArmEnd: {x: 210, y: 85}
                },
                {
                    s2Closed: false,
                    s1Position: 'a',
                    lamp1Opacity: 0.3,
                    lamp2Opacity: 0.3,
                    power1Text: 'L₁: 0.67W',
                    power2Text: 'L₂: 0.33W',
                    statusText: 'S₂断开，S₁接 a：L₁与 L₂串联',
                    powerText: 'R 总=6+3=9Ω，I=3/9=1/3A，L₁功率=0.67W，L₂功率=0.33W，L₁更亮',
                    showTable: false,
                    showCircuit: true,
                    showPowerLabels: true,
                    s1ArmEnd: {x: 660, y: 190},
                    s2ArmEnd: {x: 210, y: 85}
                },
                {
                    s2Closed: true,
                    s1Position: 'b',
                    lamp1Opacity: 0.3,
                    lamp2Opacity: 0.1,
                    power1Text: 'L₁: 1.5W',
                    power2Text: 'L₂: 3W',
                    statusText: 'S₂闭合，S₁接 b：L₁与 L₂并联',
                    powerText: 'L₁功率=3²/6=1.5W，L₂功率=3²/3=3W（正常发光），L₂更亮',
                    showTable: false,
                    showCircuit: true,
                    showPowerLabels: true,
                    s1ArmEnd: {x: 350, y: 260},
                    s2ArmEnd: {x: 330, y: 100}
                },
                {
                    s2Closed: true,
                    s1Position: 'b',
                    lamp1Opacity: 0.3,
                    lamp2Opacity: 0.1,
                    power1Text: 'L₁: 1.5W',
                    power2Text: 'L₂: 3W',
                    statusText: '四种状态对比总结',
                    powerText: '正确答案：D（S₂闭合，S₁接 b 时 L₂更亮）',
                    showTable: true,
                    showCircuit: false,
                    showPowerLabels: false,
                    s1ArmEnd: {x: 350, y: 260},
                    s2ArmEnd: {x: 330, y: 100}
                }
            ],
            
            updateStep: function() {
                const step = this.steps[this.currentStep];
                const el = this.elements;
                
                // 显示/隐藏电路图
                if (step.showCircuit) {
                    el.circuitGroup.style.display = 'block';
                    el.circuitGroup.style.opacity = '1';
                } else {
                    el.circuitGroup.style.opacity = '0';
                    setTimeout(() => {
                        if (!this.steps[this.currentStep].showCircuit) {
                            el.circuitGroup.style.display = 'none';
                        }
                    }, 300);
                }
                
                // 显示/隐藏功率标签
                if (step.showPowerLabels) {
                    el.power1.style.display = 'block';
                    el.power2.style.display = 'block';
                } else {
                    el.power1.style.display = 'none';
                    el.power2.style.display = 'none';
                }
                
                // 更新灯泡亮度
                el.lamp1Fill.setAttribute('opacity', step.lamp1Opacity);
                el.lamp2Fill.setAttribute('opacity', step.lamp2Opacity);
                
                // 更新 S₁开关臂位置
                el.s1Arm.setAttribute('x2', step.s1ArmEnd.x);
                el.s1Arm.setAttribute('y2', step.s1ArmEnd.y);
                
                // 更新 S₂开关状态
                if (step.s2Closed) {
                    el.s2Arm.setAttribute('x2', step.s2ArmEnd.x);
                    el.s2Arm.setAttribute('y2', step.s2ArmEnd.y);
                    el.s2Wire1.setAttribute('class', 'scene2-wire-closed');
                    el.s2Wire2.setAttribute('class', 'scene2-wire-closed');
                } else {
                    el.s2Arm.setAttribute('x2', step.s2ArmEnd.x);
                    el.s2Arm.setAttribute('y2', step.s2ArmEnd.y);
                    el.s2Wire1.setAttribute('class', 'scene2-wire');
                    el.s2Wire2.setAttribute('class', 'scene2-wire');
                }
                
                // 更新功率标签文本
                el.power1.textContent = step.power1Text;
                el.power2.textContent = step.power2Text;
                el.statusText.textContent = step.statusText;
                el.powerText.textContent = step.powerText;
                
                // 显示/隐藏表格
                el.table.style.display = step.showTable ? 'block' : 'none';
                
                // 更新按钮状态
                el.prevBtn.disabled = (this.currentStep === 0);
                el.nextBtn.disabled = (this.currentStep === this.totalSteps - 1);
                
                if (window.MathJax) {
                    MathJax.typesetPromise();
                }
            },
            
            nextStep: function() {
                if (this.currentStep < this.totalSteps - 1) {
                    this.currentStep++;
                    this.updateStep();
                }
            },
            
            prevStep: function() {
                if (this.currentStep > 0) {
                    this.currentStep--;
                    this.updateStep();
                }
            },
            
            init: function() {
                this.elements.nextBtn.addEventListener('click', () => this.nextStep());
                this.elements.prevBtn.addEventListener('click', () => this.prevStep());
                this.updateStep();
            }
        };
        
        scene2.init();
    })();
    </script>
</body>
</html>
