<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>杠杆平衡条件及动态变化分析</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-svg { width: 800px; height: 500px; }
        
        /* 元素显隐控制 */
        .scene1-hidden { display: none; opacity: 0; }
        .scene1-visible { display: block; opacity: 1; }
        
        /* 淡入动画 */
        .scene1-fade-in {
            animation: scene1FadeIn 300ms ease-out forwards;
        }
        @keyframes scene1FadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        /* 按钮样式 */
        .scene1-btn {
            position: absolute;
            width: 100px;
            height: 35px;
            font-size: 14px;
            cursor: pointer;
            border: 2px solid #333;
            border-radius: 5px;
            background: #f0f0f0;
            transition: background 200ms;
        }
        .scene1-btn:hover:not(:disabled) {
            background: #e0e0e0;
        }
        .scene1-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #scene1-btn-prev { left: 280px; bottom: 10px; }
        #scene1-btn-next { left: 420px; bottom: 10px; }
        
        /* 杠杆旋转动画 */
        #scene1-lever-group {
            transform-origin: 400px 295px;
            transition: transform 500ms ease-out;
        }
        
        /* 力矩变化框展开动画 */
        #scene1-box-moment-adult {
            transform-origin: left center;
            transition: transform 400ms ease-out;
        }
        #scene1-box-moment-child {
            transform-origin: right center;
            transition: transform 400ms ease-out;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 杠杆组（可旋转） -->
            <g id="scene1-lever-group">
                <!-- 杠杆 -->
                <rect id="scene1-lever" x="150" y="280" width="500" height="15" fill="#000000" stroke="#000000" stroke-width="3"/>
                
                <!-- 大人简笔画 -->
                <g id="scene1-adult">
                    <!-- 头部 -->
                    <circle cx="230" cy="210" r="12" fill="none" stroke="#000000" stroke-width="2"/>
                    <!-- 躯干 -->
                    <line x1="230" y1="222" x2="230" y2="260" stroke="#000000" stroke-width="2"/>
                    <!-- 左臂 -->
                    <line x1="230" y1="230" x2="215" y2="245" stroke="#000000" stroke-width="2"/>
                    <!-- 右臂 -->
                    <line x1="230" y1="230" x2="245" y2="245" stroke="#000000" stroke-width="2"/>
                    <!-- 左腿 -->
                    <line x1="230" y1="260" x2="215" y2="280" stroke="#000000" stroke-width="2"/>
                    <!-- 右腿 -->
                    <line x1="230" y1="260" x2="245" y2="280" stroke="#000000" stroke-width="2"/>
                </g>
                
                <!-- 小孩简笔画 -->
                <g id="scene1-child">
                    <!-- 头部 -->
                    <circle cx="570" cy="220" r="10" fill="none" stroke="#000000" stroke-width="2"/>
                    <!-- 躯干 -->
                    <line x1="570" y1="230" x2="570" y2="265" stroke="#000000" stroke-width="2"/>
                    <!-- 左臂 -->
                    <line x1="570" y1="238" x2="558" y2="250" stroke="#000000" stroke-width="2"/>
                    <!-- 右臂 -->
                    <line x1="570" y1="238" x2="582" y2="250" stroke="#000000" stroke-width="2"/>
                    <!-- 左腿 -->
                    <line x1="570" y1="265" x2="558" y2="280" stroke="#000000" stroke-width="2"/>
                    <!-- 右腿 -->
                    <line x1="570" y1="265" x2="582" y2="280" stroke="#000000" stroke-width="2"/>
                </g>
            </g>
            
            <!-- 支点 -->
            <g id="scene1-fulcrum">
                <polygon points="400,295 370,325 430,325" fill="none" stroke="#000000" stroke-width="2"/>
            </g>
            
            <!-- G_大人 标签 -->
            <text id="scene1-label-G-adult" x="205" y="210" text-anchor="middle" font-size="16" fill="#000000" class="scene1-visible">G$_{大人}$</text>
            
            <!-- G_小孩 标签 -->
            <text id="scene1-label-G-child" x="550" y="210" text-anchor="middle" font-size="16" fill="#000000" class="scene1-visible">G$_{小孩}$</text>
            
            <!-- L_大人 标注线 -->
            <g id="scene1-arm-L-adult" class="scene1-hidden">
                <line x1="230" y1="310" x2="400" y2="310" stroke="#1565c0" stroke-width="2"/>
                <!-- 两端竖线 -->
                <line x1="230" y1="305" x2="230" y2="315" stroke="#1565c0" stroke-width="2"/>
                <line x1="400" y1="305" x2="400" y2="315" stroke="#1565c0" stroke-width="2"/>
                <!-- 标签 -->
                <text x="315" y="325" text-anchor="middle" font-size="14" fill="#1565c0">L$_{大人}$</text>
            </g>
            
            <!-- L_小孩 标注线 -->
            <g id="scene1-arm-L-child" class="scene1-hidden">
                <line x1="400" y1="310" x2="570" y2="310" stroke="#1565c0" stroke-width="2"/>
                <!-- 两端竖线 -->
                <line x1="400" y1="305" x2="400" y2="315" stroke="#1565c0" stroke-width="2"/>
                <line x1="570" y1="305" x2="570" y2="315" stroke="#1565c0" stroke-width="2"/>
                <!-- 标签 -->
                <text x="485" y="325" text-anchor="middle" font-size="14" fill="#1565c0">L$_{小孩}$</text>
            </g>
            
            <!-- G_大人 > G_小孩 提示 -->
            <text id="scene1-hint-G" x="400" y="50" text-anchor="middle" font-size="18" fill="#000000" class="scene1-hidden">G$_{大人}$ > G$_{小孩}$</text>
            
            <!-- 大人移动箭头 -->
            <g id="scene1-arrow-adult" class="scene1-hidden">
                <!-- 虚线 -->
                <line x1="230" y1="170" x2="275" y2="170" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>
                <!-- 箭头 -->
                <polygon points="280,170 270,165 270,175" fill="#888888"/>
                <!-- ΔL 标签 -->
                <text x="255" y="155" text-anchor="middle" font-size="14" fill="#888888">ΔL</text>
            </g>
            
            <!-- 小孩移动箭头 -->
            <g id="scene1-arrow-child" class="scene1-hidden">
                <!-- 虚线 -->
                <line x1="570" y1="170" x2="525" y2="170" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>
                <!-- 箭头 -->
                <polygon points="520,170 530,165 530,175" fill="#888888"/>
                <!-- ΔL 标签 -->
                <text x="545" y="155" text-anchor="middle" font-size="14" fill="#888888">ΔL</text>
            </g>
            
            <!-- 力矩变化框（大人） -->
            <g id="scene1-box-moment-adult" class="scene1-hidden">
                <rect x="200" y="350" width="150" height="40" fill="#c62828" fill-opacity="0.2" stroke="#c62828" stroke-width="1"/>
                <text x="275" y="375" text-anchor="middle" font-size="14" fill="#c62828">G$_{大人}$×ΔL</text>
            </g>
            
            <!-- 力矩变化框（小孩） -->
            <g id="scene1-box-moment-child" class="scene1-hidden">
                <rect x="450" y="350" width="150" height="40" fill="#2e7d32" fill-opacity="0.2" stroke="#2e7d32" stroke-width="1"/>
                <text x="525" y="375" text-anchor="middle" font-size="14" fill="#2e7d32">G$_{小孩}$×ΔL</text>
            </g>
            
            <!-- 结论文本 -->
            <text id="scene1-conclusion" x="400" y="420" text-anchor="middle" font-size="18" fill="#c62828" font-weight="bold" class="scene1-hidden">小孩那端下沉</text>
        </svg>
        
        <!-- 控件栏 -->
        <button id="scene1-btn-prev" class="scene1-btn" disabled>◀ 上一步</button>
        <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现 - 杠杆平衡条件及动态变化分析
        
        // 状态变量
        let currentStep = 0;
        const totalSteps = 5; // 0-4
        
        // 元素引用
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const leverGroup = document.getElementById('scene1-lever-group');
        
        // 各步骤可见元素配置
        const stepConfig = {
            0: {
                // 初始状态：杠杆、支点、大人、小孩、G标签
                show: ['scene1-lever-group', 'scene1-fulcrum', 'scene1-label-G-adult', 'scene1-label-G-child'],
                hide: ['scene1-arm-L-adult', 'scene1-arm-L-child', 'scene1-hint-G', 'scene1-arrow-adult', 'scene1-arrow-child', 'scene1-box-moment-adult', 'scene1-box-moment-child', 'scene1-conclusion']
            },
            1: {
                // 显示力臂标注
                show: ['scene1-arm-L-adult', 'scene1-arm-L-child', 'scene1-hint-G'],
                hide: ['scene1-arrow-adult', 'scene1-arrow-child', 'scene1-box-moment-adult', 'scene1-box-moment-child', 'scene1-conclusion']
            },
            2: {
                // 显示移动箭头
                show: ['scene1-arrow-adult', 'scene1-arrow-child'],
                hide: ['scene1-box-moment-adult', 'scene1-box-moment-child', 'scene1-conclusion']
            },
            3: {
                // 显示力矩变化框
                show: ['scene1-box-moment-adult', 'scene1-box-moment-child'],
                hide: ['scene1-conclusion']
            },
            4: {
                // 最终结论：杠杆旋转，显示结论
                show: ['scene1-conclusion'],
                hide: [],
                rotate: 5 // 顺时针旋转5度
            }
        };
        
        // 工具函数：显示元素
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene1-hidden');
                el.classList.add('scene1-visible');
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }
        
        // 工具函数：隐藏元素
        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene1-visible');
                el.classList.add('scene1-hidden');
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }
        
        // 更新步骤显示
        function updateStep(step) {
            const config = stepConfig[step];
            
            // 显示指定元素
            if (config.show) {
                config.show.forEach(id => showElement(id));
            }
            
            // 隐藏指定元素
            if (config.hide) {
                config.hide.forEach(id => hideElement(id));
            }
            
            // 杠杆旋转（仅步骤4）
            if (config.rotate !== undefined) {
                leverGroup.style.transform = `rotate(${config.rotate}deg)`;
            } else {
                leverGroup.style.transform = 'rotate(0deg)';
            }
            
            // 更新按钮状态
            btnPrev.disabled = (step === 0);
            btnNext.disabled = (step === totalSteps - 1);
            
            currentStep = step;
        }
        
        // 按钮事件绑定
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                updateStep(currentStep - 1);
            }
        });
        
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                updateStep(currentStep + 1);
            }
        });
        
        // 初始化
        updateStep(0);
        
    })();
    </script>
</body>
</html>
