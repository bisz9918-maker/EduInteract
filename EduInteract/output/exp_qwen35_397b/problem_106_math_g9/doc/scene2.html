<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>相似三角形比例关系 - Scene 2</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #scene2-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene2-svg {
            width: 800px;
            height: 500px;
        }
        /* 三角形边框 */
        .scene2-tri-outline {
            fill: none;
            stroke: #000000;
            stroke-width: 2;
        }
        /* 边的高亮样式 */
        .scene2-line-blue {
            stroke: #1565c0;
            stroke-width: 3;
            fill: none;
        }
        .scene2-line-red {
            stroke: #c62828;
            stroke-width: 3;
            fill: none;
        }
        .scene2-line-green {
            stroke: #2e7d32;
            stroke-width: 3;
            fill: none;
        }
        .scene2-line-default {
            stroke: #666666;
            stroke-width: 2;
            fill: none;
        }
        /* 标签样式 */
        .scene2-label-blue {
            fill: #1565c0;
            font-size: 14px;
            font-weight: 500;
        }
        .scene2-label-red {
            fill: #c62828;
            font-size: 14px;
            font-weight: 500;
        }
        .scene2-label-green {
            fill: #2e7d32;
            font-size: 14px;
            font-weight: 500;
        }
        .scene2-label-black {
            fill: #000000;
            font-size: 14px;
        }
        /* 信息框 */
        .scene2-info-box {
            fill: #f5f5f5;
            stroke: #cccccc;
            stroke-width: 1;
        }
        .scene2-answer-box {
            fill: #ffffff;
            stroke: #c62828;
            stroke-width: 3;
        }
        /* 按钮样式 */
        .scene2-btn {
            position: absolute;
            width: 80px;
            height: 30px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s, opacity 0.2s;
        }
        .scene2-btn-prev {
            background-color: #9e9e9e;
            color: #ffffff;
            left: 280px;
            top: 465px;
        }
        .scene2-btn-next {
            background-color: #1565c0;
            color: #ffffff;
            left: 440px;
            top: 465px;
        }
        .scene2-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .scene2-btn:hover:not(:disabled) {
            opacity: 0.85;
        }
        /* 步骤指示器 */
        #scene2-step-indicator {
            position: absolute;
            left: 380px;
            top: 470px;
            font-size: 14px;
            color: #666666;
        }
        /* 显隐控制 */
        .scene2-hidden {
            display: none;
            opacity: 0;
        }
        .scene2-visible {
            display: block;
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 标题 -->
            <text x="400" y="30" text-anchor="middle" font-size="16px" font-weight="bold" fill="#333333">
                △ADE ∽ △BCE 相似三角形比例关系
            </text>

            <!-- ===== 左侧 △ADE ===== -->
            <!-- 三角形轮廓 -->
            <polygon id="scene2-tri-ade" class="scene2-tri-outline"
                     points="80,260 180,100 280,100" />

            <!-- AD 边（蓝色） -->
            <line id="scene2-line-ad" class="scene2-line-blue"
                  x1="80" y1="260" x2="180" y2="100" />

            <!-- AE 边（红色） -->
            <line id="scene2-line-ae" class="scene2-line-default"
                  x1="80" y1="260" x2="280" y2="100" />

            <!-- DE 边（绿色） -->
            <line id="scene2-line-de" class="scene2-line-default"
                  x1="180" y1="100" x2="280" y2="100" />

            <!-- 顶点标签 -->
            <text x="70" y="275" class="scene2-label-black" font-size="14px">A</text>
            <text x="180" y="90" class="scene2-label-black" font-size="14px">D</text>
            <text x="295" y="95" class="scene2-label-black" font-size="14px">E</text>

            <!-- 边长标签 -->
            <text id="scene2-label-ad" x="55" y="170" class="scene2-label-blue">AD = 4/5</text>
            <text id="scene2-label-ae" x="175" y="285" class="scene2-label-red scene2-hidden">AE = x</text>
            <text id="scene2-label-de" x="295" y="180" class="scene2-label-green scene2-hidden">DE</text>

            <!-- ===== 右侧 △BCE ===== -->
            <!-- 三角形轮廓 -->
            <polygon id="scene2-tri-bce" class="scene2-tri-outline"
                     points="720,260 520,100 620,100" />

            <!-- BC 边（蓝色） -->
            <line id="scene2-line-bc" class="scene2-line-blue"
                  x1="720" y1="260" x2="520" y2="100" />

            <!-- BE 边（红色） -->
            <line id="scene2-line-be" class="scene2-line-default"
                  x1="720" y1="260" x2="620" y2="100" />

            <!-- CE 边（绿色） -->
            <line id="scene2-line-ce" class="scene2-line-default"
                  x1="520" y1="100" x2="620" y2="100" />

            <!-- 顶点标签 -->
            <text x="735" y="275" class="scene2-label-black" font-size="14px">B</text>
            <text x="505" y="95" class="scene2-label-black" font-size="14px">C</text>
            <text x="635" y="95" class="scene2-label-black" font-size="14px">E</text>

            <!-- 边长标签 -->
            <text id="scene2-label-bc" x="495" y="170" class="scene2-label-blue">BC = 4</text>
            <text id="scene2-label-be" x="615" y="285" class="scene2-label-red scene2-hidden">BE = 5x</text>
            <text id="scene2-label-ce" x="735" y="180" class="scene2-label-green scene2-hidden">CE</text>

            <!-- ===== 比例式框 ===== -->
            <rect id="scene2-ratio-box" class="scene2-info-box scene2-hidden"
                  x="150" y="310" width="500" height="40" rx="4" />
            <text id="scene2-ratio-text" x="400" y="335" text-anchor="middle"
                  class="scene2-label-black scene2-hidden" font-size="14px">
            </text>

            <!-- ===== 推导框 ===== -->
            <rect id="scene2-derive-box" class="scene2-info-box scene2-hidden"
                  x="150" y="360" width="500" height="60" rx="4" />
            <text id="scene2-derive-text" x="400" y="385" text-anchor="middle"
                  class="scene2-label-black scene2-hidden" font-size="13px">
            </text>
            <text id="scene2-derive-text2" x="400" y="405" text-anchor="middle"
                  class="scene2-label-black scene2-hidden" font-size="13px">
            </text>

            <!-- ===== 答案框 ===== -->
            <rect id="scene2-answer-box" class="scene2-answer-box scene2-hidden"
                  x="350" y="425" width="100" height="30" rx="4" />
            <text id="scene2-answer-text" x="400" y="447" text-anchor="middle"
                  class="scene2-label-red scene2-hidden" font-size="16px" font-weight="bold">
                AE = 1
            </text>
        </svg>

        <!-- 控件栏 -->
        <button id="scene2-btn-prev" class="scene2-btn scene2-btn-prev" disabled>◀ 上一步</button>
        <span id="scene2-step-indicator">步骤 0/4</span>
        <button id="scene2-btn-next" class="scene2-btn scene2-btn-next">下一步 ▶</button>
    </div>

    <script>
    (function() {
        // Scene 2: 相似三角形比例关系与 AE 长度计算

        // 状态管理
        let currentStep = 0;
        const totalSteps = 4;

        // DOM 元素引用
        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        const stepIndicator = document.getElementById('scene2-step-indicator');

        // 需要显隐控制的元素
        const elements = {
            // 步骤 1 显示
            labelAe: document.getElementById('scene2-label-ae'),
            labelBe: document.getElementById('scene2-label-be'),
            labelDe: document.getElementById('scene2-label-de'),
            labelCe: document.getElementById('scene2-label-ce'),
            lineAe: document.getElementById('scene2-line-ae'),
            lineBe: document.getElementById('scene2-line-be'),
            lineDe: document.getElementById('scene2-line-de'),
            lineCe: document.getElementById('scene2-line-ce'),
            ratioBox: document.getElementById('scene2-ratio-box'),
            ratioText: document.getElementById('scene2-ratio-text'),

            // 步骤 2 显示
            deriveBox: document.getElementById('scene2-derive-box'),
            deriveText: document.getElementById('scene2-derive-text'),
            deriveText2: document.getElementById('scene2-derive-text2'),

            // 步骤 4 显示
            answerBox: document.getElementById('scene2-answer-box'),
            answerText: document.getElementById('scene2-answer-text')
        };

        // 工具函数：显示元素
        function show(el) {
            if (el) {
                el.classList.remove('scene2-hidden');
                el.classList.add('scene2-visible');
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }

        // 工具函数：隐藏元素
        function hide(el) {
            if (el) {
                el.classList.remove('scene2-visible');
                el.classList.add('scene2-hidden');
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }

        // 更新按钮状态
        function updateButtons() {
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps);
            btnNext.textContent = (currentStep === totalSteps) ? '完成' : '下一步 ▶';
            stepIndicator.textContent = `步骤 ${currentStep}/${totalSteps}`;
        }

        // 更新步骤显示
        function updateStep() {
            // 重置所有元素状态
            hide(elements.labelAe);
            hide(elements.labelBe);
            hide(elements.labelDe);
            hide(elements.labelCe);
            hide(elements.ratioBox);
            hide(elements.ratioText);
            hide(elements.deriveBox);
            hide(elements.deriveText);
            hide(elements.deriveText2);
            hide(elements.answerBox);
            hide(elements.answerText);

            // 重置边样式
            elements.lineAe.className.baseVal = 'scene2-line-default';
            elements.lineBe.className.baseVal = 'scene2-line-default';
            elements.lineDe.className.baseVal = 'scene2-line-default';
            elements.lineCe.className.baseVal = 'scene2-line-default';

            // 根据当前步骤显示相应内容
            if (currentStep >= 1) {
                // 步骤 1：高亮对应边，显示 AE=x 和 BE=5x 标签
                show(elements.labelAe);
                show(elements.labelBe);
                show(elements.labelDe);
                show(elements.labelCe);
                elements.lineAe.className.baseVal = 'scene2-line-red';
                elements.lineBe.className.baseVal = 'scene2-line-red';
                elements.lineDe.className.baseVal = 'scene2-line-green';
                elements.lineCe.className.baseVal = 'scene2-line-green';

                show(elements.ratioBox);
                show(elements.ratioText);
                elements.ratioText.textContent = '比例式：AD/BC = AE/BE → (4/5)/4 = x/BE';
            }

            if (currentStep >= 2) {
                // 步骤 2：显示完整比例式和相似证明
                elements.ratioText.textContent = 'AD/BC = AE/BE = DE/CE = 1/5';
                show(elements.deriveBox);
                show(elements.deriveText);
                show(elements.deriveText2);
                elements.deriveText.textContent = '∵ △ADE ∽ △BCE（∠DAE = ∠CBE，∠ADE = ∠BCE）';
                elements.deriveText2.textContent = '∴ (4/5)/4 = 1/5，故 BE = 5AE = 5x';
            }

            if (currentStep >= 3) {
                // 步骤 3：显示方程建立
                elements.deriveText.textContent = '∵ AC = BC = 4（等腰 Rt△），AE + CE = AC = 4';
                elements.deriveText2.textContent = '又 ∵ CE = 5DE，结合比例关系建立方程';
            }

            if (currentStep >= 4) {
                // 步骤 4：显示答案
                elements.deriveText.textContent = '解得：x + CE = 4，代入比例关系 x = 1';
                elements.deriveText2.textContent = '';
                show(elements.answerBox);
                show(elements.answerText);
            }

            updateButtons();
        }

        // 事件监听
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateStep();
            }
        });

        // 初始化
        updateStep();

    })();
    </script>
</body>
</html>
