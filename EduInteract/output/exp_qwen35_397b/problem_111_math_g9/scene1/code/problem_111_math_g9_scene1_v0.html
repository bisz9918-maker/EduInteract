<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>等腰三角形中的角度推导与线段等量关系</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        .fade-in { animation: scene1-fade-in 0.3s ease forwards; }
        @keyframes scene1-fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 三角形 ABC：A(400,40), B(280,360), C(520,360) -->
            <path id="scene1-tri-abc" d="M 400 40 L 280 360 L 520 360 Z" fill="none" stroke="#000000" stroke-width="2" />

            <!-- 线段 DE（垂直平分线）：D 在 AB 中点 (340,200)，E 在 AC 上 (460,220) -->
            <line id="scene1-line-de" x1="220" y1="170" x2="600" y2="250" stroke="#000000" stroke-width="1.5" />

            <!-- 线段 BE（辅助线，步骤 2 显示） -->
            <line id="scene1-line-be" x1="280" y1="360" x2="460" y2="220" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="5,3" style="display:none;" />

            <!-- 直角符号在 D 点 -->
            <path id="scene1-right-angle" d="M 335 195 L 340 195 L 340 200 L 335 200" fill="none" stroke="#000000" stroke-width="1.5" style="display:none;" />

            <!-- 等长标记 AB（双短线） -->
            <line id="scene1-mark-ab1" x1="335" y1="195" x2="345" y2="198" stroke="#000000" stroke-width="1.5" />
            <line id="scene1-mark-ab2" x1="332" y1="203" x2="342" y2="206" stroke="#000000" stroke-width="1.5" />

            <!-- 等长标记 AC（双短线） -->
            <line id="scene1-mark-ac1" x1="455" y1="195" x2="465" y2="198" stroke="#000000" stroke-width="1.5" />
            <line id="scene1-mark-ac2" x1="458" y1="203" x2="468" y2="206" stroke="#000000" stroke-width="1.5" />

            <!-- 角度弧线 -->
            <!-- ∠C 弧线（初始显示） -->
            <path id="scene1-angle-c" d="M 505 360 A 18 18 0 0 1 500 348" fill="none" stroke="#888" stroke-width="1" />

            <!-- ∠B 弧线（步骤 1 显示） -->
            <path id="scene1-angle-b" d="M 295 360 A 18 18 0 0 0 300 348" fill="none" stroke="#1565c0" stroke-width="1" style="display:none;" />

            <!-- ∠A 弧线（步骤 1 显示） -->
            <path id="scene1-angle-a" d="M 388 62 A 18 18 0 0 1 412 62" fill="none" stroke="#1565c0" stroke-width="1" style="display:none;" />

            <!-- ∠ABE 弧线（步骤 3 显示） -->
            <path id="scene1-angle-abe" d="M 298 355 A 14 14 0 0 0 306 343" fill="none" stroke="#1565c0" stroke-width="1" style="display:none;" />

            <!-- ∠CBE 弧线（步骤 3 显示） -->
            <path id="scene1-angle-cbe" d="M 306 350 A 10 10 0 0 0 314 343" fill="none" stroke="#888" stroke-width="1" style="display:none;" />

            <!-- ∠BEC 弧线（步骤 3 显示） -->
            <path id="scene1-angle-bec" d="M 455 225 A 14 14 0 0 1 463 240" fill="none" stroke="#888" stroke-width="1" style="display:none;" />

            <!-- 顶点标签（放在顶点外侧） -->
            <text id="scene1-label-a" x="400" y="25" text-anchor="middle" font-size="16" fill="#000">A</text>
            <text id="scene1-label-b" x="260" y="380" text-anchor="middle" font-size="16" fill="#000">B</text>
            <text id="scene1-label-c" x="540" y="380" text-anchor="middle" font-size="16" fill="#000">C</text>
            <text id="scene1-label-d" x="320" y="185" text-anchor="middle" font-size="14" fill="#000">D</text>
            <text id="scene1-label-e" x="480" y="210" text-anchor="middle" font-size="14" fill="#000">E</text>

            <!-- 已知条件标注（放在三角形外侧，远离边线） -->
            <text id="scene1-anno-ab4" x="230" y="220" text-anchor="middle" font-size="13" fill="#000">AB=4</text>
            <text id="scene1-anno-ac4" x="570" y="220" text-anchor="middle" font-size="13" fill="#000">AC=4</text>
            <text id="scene1-anno-angle-c72" x="515" y="345" text-anchor="middle" font-size="13" fill="#000">72°</text>

            <!-- 步骤 1 标注 -->
            <text id="scene1-anno-angle-b72" x="285" y="345" text-anchor="middle" font-size="13" fill="#000" style="display:none;">72°</text>
            <text id="scene1-anno-angle-a36" x="400" y="50" text-anchor="middle" font-size="13" fill="#1565c0" style="display:none;">36°</text>

            <!-- 步骤 2 标注 -->
            <text id="scene1-anno-eaeb" x="380" y="300" text-anchor="middle" font-size="13" fill="#2e7d32" style="display:none;">EA=EB</text>

            <!-- 步骤 3 标注 -->
            <text id="scene1-anno-angle-abe36" x="320" y="335" text-anchor="middle" font-size="13" fill="#1565c0" style="display:none;">36°</text>
            <text id="scene1-anno-angle-cbe36" x="335" y="345" text-anchor="middle" font-size="13" fill="#000" style="display:none;">36°</text>
            <text id="scene1-anno-angle-bec72" x="475" y="250" text-anchor="middle" font-size="13" fill="#000" style="display:none;">72°</text>

            <!-- 步骤 4 标注 -->
            <text id="scene1-anno-bebc" x="400" y="390" text-anchor="middle" font-size="13" fill="#2e7d32" style="display:none;">BE=BC</text>
            <text id="scene1-anno-aex" x="580" y="180" text-anchor="middle" font-size="13" fill="#000" style="display:none;">AE=x</text>
            <text id="scene1-anno-ec4x" x="585" y="300" text-anchor="middle" font-size="13" fill="#000" style="display:none;">EC=4−x</text>

            <!-- 步骤 5 结论 -->
            <text id="scene1-conclusion" x="400" y="430" text-anchor="middle" font-size="16" fill="#1565c0" style="display:none;">
                <tspan x="400" dy="0">cosA = cos36° = </tspan>
                <tspan x="400" dy="22">$$(√5+1)/4$$</tspan>
            </text>

            <!-- 控件栏（在 SVG 内部底部） -->
            <g id="scene1-controls-group">
                <rect id="scene1-btn-prev-bg" x="280" y="450" width="100" height="35" fill="#f0f0f0" stroke="#333" stroke-width="1" rx="4" />
                <text id="scene1-btn-prev-text" x="330" y="472" text-anchor="middle" font-size="14" fill="#000" style="pointer-events:none;">◀ 上一步</text>

                <rect id="scene1-btn-next-bg" x="420" y="450" width="100" height="35" fill="#f0f0f0" stroke="#333" stroke-width="1" rx="4" />
                <text id="scene1-btn-next-text" x="470" y="472" text-anchor="middle" font-size="14" fill="#000" style="pointer-events:none;">下一步 ▶</text>

                <text id="scene1-step-indicator" x="560" y="470" text-anchor="middle" font-size="14" fill="#333">步骤 0/5</text>
            </g>

            <!-- 透明按钮区域（用于点击） -->
            <g id="scene1-btn-area">
                <rect id="scene1-btn-prev-hit" x="280" y="450" width="100" height="35" fill="transparent" style="cursor:pointer;" />
                <rect id="scene1-btn-next-hit" x="420" y="450" width="100" height="35" fill="transparent" style="cursor:pointer;" />
            </g>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 1 实现：等腰三角形中的角度推导与线段等量关系
        // 布局坐标表：
        // A(400,40), B(280,360), C(520,360), D(340,200), E(460,220)

        const currentStep = { value: 0 };
        const totalSteps = 5;

        // 每个步骤需要显示的元素 ID 列表
        const stepElements = {
            0: ['scene1-tri-abc', 'scene1-line-de', 'scene1-right-angle', 'scene1-mark-ab1', 'scene1-mark-ab2', 'scene1-mark-ac1', 'scene1-mark-ac2', 'scene1-angle-c', 'scene1-label-a', 'scene1-label-b', 'scene1-label-c', 'scene1-label-d', 'scene1-label-e', 'scene1-anno-ab4', 'scene1-anno-ac4', 'scene1-anno-angle-c72'],
            1: ['scene1-tri-abc', 'scene1-line-de', 'scene1-right-angle', 'scene1-mark-ab1', 'scene1-mark-ab2', 'scene1-mark-ac1', 'scene1-mark-ac2', 'scene1-angle-c', 'scene1-angle-b', 'scene1-angle-a', 'scene1-label-a', 'scene1-label-b', 'scene1-label-c', 'scene1-label-d', 'scene1-label-e', 'scene1-anno-ab4', 'scene1-anno-ac4', 'scene1-anno-angle-c72', 'scene1-anno-angle-b72', 'scene1-anno-angle-a36'],
            2: ['scene1-tri-abc', 'scene1-line-de', 'scene1-line-be', 'scene1-right-angle', 'scene1-mark-ab1', 'scene1-mark-ab2', 'scene1-mark-ac1', 'scene1-mark-ac2', 'scene1-angle-c', 'scene1-angle-b', 'scene1-angle-a', 'scene1-label-a', 'scene1-label-b', 'scene1-label-c', 'scene1-label-d', 'scene1-label-e', 'scene1-anno-ab4', 'scene1-anno-ac4', 'scene1-anno-angle-c72', 'scene1-anno-angle-b72', 'scene1-anno-angle-a36', 'scene1-anno-eaeb'],
            3: ['scene1-tri-abc', 'scene1-line-de', 'scene1-line-be', 'scene1-right-angle', 'scene1-mark-ab1', 'scene1-mark-ab2', 'scene1-mark-ac1', 'scene1-mark-ac2', 'scene1-angle-c', 'scene1-angle-b', 'scene1-angle-a', 'scene1-angle-abe', 'scene1-angle-cbe', 'scene1-angle-bec', 'scene1-label-a', 'scene1-label-b', 'scene1-label-c', 'scene1-label-d', 'scene1-label-e', 'scene1-anno-ab4', 'scene1-anno-ac4', 'scene1-anno-angle-c72', 'scene1-anno-angle-b72', 'scene1-anno-angle-a36', 'scene1-anno-eaeb', 'scene1-anno-angle-abe36', 'scene1-anno-angle-cbe36', 'scene1-anno-angle-bec72'],
            4: ['scene1-tri-abc', 'scene1-line-de', 'scene1-line-be', 'scene1-right-angle', 'scene1-mark-ab1', 'scene1-mark-ab2', 'scene1-mark-ac1', 'scene1-mark-ac2', 'scene1-angle-c', 'scene1-angle-b', 'scene1-angle-a', 'scene1-angle-abe', 'scene1-angle-cbe', 'scene1-angle-bec', 'scene1-label-a', 'scene1-label-b', 'scene1-label-c', 'scene1-label-d', 'scene1-label-e', 'scene1-anno-ab4', 'scene1-anno-ac4', 'scene1-anno-angle-c72', 'scene1-anno-angle-b72', 'scene1-anno-angle-a36', 'scene1-anno-eaeb', 'scene1-anno-angle-abe36', 'scene1-anno-angle-cbe36', 'scene1-anno-angle-bec72', 'scene1-anno-bebc', 'scene1-anno-aex', 'scene1-anno-ec4x'],
            5: ['scene1-tri-abc', 'scene1-line-de', 'scene1-line-be', 'scene1-right-angle', 'scene1-mark-ab1', 'scene1-mark-ab2', 'scene1-mark-ac1', 'scene1-mark-ac2', 'scene1-angle-c', 'scene1-angle-b', 'scene1-angle-a', 'scene1-angle-abe', 'scene1-angle-cbe', 'scene1-angle-bec', 'scene1-label-a', 'scene1-label-b', 'scene1-label-c', 'scene1-label-d', 'scene1-label-e', 'scene1-anno-ab4', 'scene1-anno-ac4', 'scene1-anno-angle-c72', 'scene1-anno-angle-b72', 'scene1-anno-angle-a36', 'scene1-anno-eaeb', 'scene1-anno-angle-abe36', 'scene1-anno-angle-cbe36', 'scene1-anno-angle-bec72', 'scene1-anno-bebc', 'scene1-anno-aex', 'scene1-anno-ec4x', 'scene1-conclusion']
        };

        // 显示元素函数
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.display = '';
                el.classList.add('fade-in');
            }
        }

        // 隐藏元素函数
        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.display = 'none';
                el.classList.remove('fade-in');
            }
        }

        // 更新步骤显示
        function updateStep(step) {
            // 隐藏所有可能显示的元素
            const allElements = [];
            for (let i = 0; i <= totalSteps; i++) {
                allElements.push(...stepElements[i]);
            }
            const uniqueElements = [...new Set(allElements)];
            uniqueElements.forEach(id => hideElement(id));

            // 显示当前步骤的元素
            stepElements[step].forEach(id => showElement(id));

            // 更新步骤指示器
            const indicator = document.getElementById('scene1-step-indicator');
            if (indicator) {
                indicator.textContent = '步骤 ' + step + '/' + totalSteps;
            }

            // 更新按钮状态
            const prevBtn = document.getElementById('scene1-btn-prev-hit');
            const nextBtn = document.getElementById('scene1-btn-next-hit');
            if (prevBtn) {
                prevBtn.style.opacity = step === 0 ? '0.5' : '1';
                prevBtn.style.cursor = step === 0 ? 'not-allowed' : 'pointer';
            }
            if (nextBtn) {
                nextBtn.style.opacity = step === totalSteps ? '0.5' : '1';
                nextBtn.style.cursor = step === totalSteps ? 'not-allowed' : 'pointer';
            }

            // 触发 MathJax 重渲染
            if (window.MathJax && step === 5) {
                MathJax.typesetPromise();
            }
        }

        // 上一步
        function stepBackward() {
            if (currentStep.value > 0) {
                currentStep.value--;
                updateStep(currentStep.value);
            }
        }

        // 下一步
        function stepForward() {
            if (currentStep.value < totalSteps) {
                currentStep.value++;
                updateStep(currentStep.value);
            }
        }

        // 绑定事件
        document.getElementById('scene1-btn-prev-hit').addEventListener('click', stepBackward);
        document.getElementById('scene1-btn-next-hit').addEventListener('click', stepForward);

        // 初始化
        updateStep(0);
    })();
    </script>
</body>
</html>
