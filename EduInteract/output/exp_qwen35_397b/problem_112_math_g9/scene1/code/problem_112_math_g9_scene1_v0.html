<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三角形旋转角度推导</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        .scene1-fade {
            transition: opacity 0.3s ease;
        }
        .scene1-hidden {
            opacity: 0;
            display: none;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 定义箭头 marker -->
            <defs>
                <marker id="scene1-arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#1565c0" />
                </marker>
            </defs>

            <!-- 三角形 OCD (左上方) -->
            <polygon id="scene1-tri-ocd" class="scene1-fade" 
                points="400,320 369,143 475,113" 
                fill="none" stroke="#000000" stroke-width="2" />

            <!-- 三角形 OAB (右下方) -->
            <polygon id="scene1-tri-oab" class="scene1-fade" 
                points="400,320 556,230 620,320" 
                fill="none" stroke="#000000" stroke-width="2" />

            <!-- 顶点圆点 -->
            <circle id="scene1-point-o" class="scene1-fade" cx="400" cy="320" r="3" fill="#000000" />
            <circle id="scene1-point-a" class="scene1-fade" cx="556" cy="230" r="3" fill="#000000" />
            <circle id="scene1-point-b" class="scene1-fade" cx="620" cy="320" r="3" fill="#000000" />
            <circle id="scene1-point-c" class="scene1-fade" cx="369" cy="143" r="3" fill="#000000" />
            <circle id="scene1-point-d" class="scene1-fade" cx="475" cy="113" r="3" fill="#000000" />

            <!-- 顶点标签 -->
            <text id="scene1-label-o" class="scene1-fade" x="385" y="335" font-size="14" fill="#000000">O</text>
            <text id="scene1-label-a" class="scene1-fade" x="566" y="220" font-size="14" fill="#000000">A</text>
            <text id="scene1-label-b" class="scene1-fade" x="635" y="335" font-size="14" fill="#000000">B</text>
            <text id="scene1-label-c" class="scene1-fade" x="354" y="133" font-size="14" fill="#000000">C</text>
            <text id="scene1-label-d" class="scene1-fade" x="485" y="98" font-size="14" fill="#000000">D</text>

            <!-- 步骤 1: 旋转角弧线 -->
            <!-- ∠AOC 弧线: 半径 40px, 从 OA 方向到 OC 方向 -->
            <!-- OA 方向: 从 O(400,320) 到 A(556,230), 角度约 -30° -->
            <!-- OC 方向: 从 O(400,320) 到 C(369,143), 角度约 100° -->
            <path id="scene1-arc-aoc" class="scene1-fade scene1-hidden" 
                d="M 434.64,300 A 40,40 0 1,1 393.07,283.64" 
                fill="none" stroke="#1565c0" stroke-width="2" 
                marker-end="url(#scene1-arrow-blue)" />
            
            <!-- ∠BOD 弧线: 半径 50px, 从 OB 方向 (0°) 到 OD 方向 (70°) -->
            <path id="scene1-arc-bod" class="scene1-fade scene1-hidden" 
                d="M 450,320 A 50,50 0 0,1 417.1,337.1" 
                fill="none" stroke="#1565c0" stroke-width="2" 
                marker-end="url(#scene1-arrow-blue)" />
            
            <text id="scene1-label-70" class="scene1-fade scene1-hidden" 
                x="410" y="260" font-size="16" fill="#1565c0" font-weight="bold">70°</text>

            <!-- 步骤 2: 已知角度和全等推导 -->
            <!-- ∠A = 100° 弧线 -->
            <path id="scene1-arc-angle-a" class="scene1-fade scene1-hidden" 
                d="M 540,240 A 25,25 0 0,1 535,255" 
                fill="none" stroke="#c62828" stroke-width="1.5" />
            <text id="scene1-label-100" class="scene1-fade scene1-hidden" 
                x="545" y="245" font-size="16" fill="#c62828">100°</text>

            <!-- ∠D = 50° 弧线 -->
            <path id="scene1-arc-angle-d" class="scene1-fade scene1-hidden" 
                d="M 465,125 A 25,25 0 0,1 455,140" 
                fill="none" stroke="#c62828" stroke-width="1.5" />
            <text id="scene1-label-50d" class="scene1-fade scene1-hidden" 
                x="465" y="135" font-size="16" fill="#c62828">50°</text>

            <!-- ∠B = 50° 弧线 (推导) -->
            <path id="scene1-arc-angle-b" class="scene1-fade scene1-hidden" 
                d="M 605,310 A 25,25 0 0,1 595,325" 
                fill="none" stroke="#2e7d32" stroke-width="1.5" />
            <text id="scene1-label-50b" class="scene1-fade scene1-hidden" 
                x="605" y="305" font-size="16" fill="#2e7d32">50°</text>

            <!-- 步骤 3: 计算和结论 -->
            <!-- ∠AOB = 30° 弧线 -->
            <path id="scene1-arc-aob" class="scene1-fade scene1-hidden" 
                d="M 430.3,310 A 35,35 0 0,1 425,315" 
                fill="none" stroke="#f57c00" stroke-width="1.5" />
            <text id="scene1-label-30" class="scene1-fade scene1-hidden" 
                x="455" y="305" font-size="16" fill="#f57c00">30°</text>

            <!-- ∠AOD = 40° 弧线 (结论) -->
            <path id="scene1-arc-aod" class="scene1-fade scene1-hidden" 
                d="M 438.5,285 A 45,45 0 0,1 420,295" 
                fill="none" stroke="#7b1fa2" stroke-width="2.5" />
            <text id="scene1-label-40" class="scene1-fade scene1-hidden" 
                x="440" y="285" font-size="18" fill="#7b1fa2" font-weight="bold">40°</text>

            <!-- 控件栏 -->
            <g id="scene1-controls">
                <!-- 上一步按钮 -->
                <rect id="scene1-btn-prev-bg" x="280" y="455" width="100" height="35" 
                    rx="6" ry="6" fill="#e0e0e0" stroke="#9e9e9e" stroke-width="1" />
                <text id="scene1-btn-prev" x="330" y="477" font-size="14" fill="#757575" 
                    text-anchor="middle" style="cursor: not-allowed;">◀ 上一步</text>
                
                <!-- 下一步按钮 -->
                <rect id="scene1-btn-next-bg" x="420" y="455" width="100" height="35" 
                    rx="6" ry="6" fill="#1565c0" stroke="#0d47a1" stroke-width="1" 
                    style="cursor: pointer;" />
                <text id="scene1-btn-next" x="470" y="477" font-size="14" fill="#ffffff" 
                    text-anchor="middle" style="cursor: pointer;">下一步 ▶</text>
                
                <!-- 步骤指示器 -->
                <text id="scene1-step-indicator" x="550" y="477" font-size="14" fill="#757575" 
                    text-anchor="middle">步骤 1/4</text>
            </g>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 1: 三角形旋转角度推导
        // 布局坐标表:
        // O(400,320), A(556,230), B(620,320), C(369,143), D(475,113)

        let currentStep = 0;
        const totalSteps = 4;

        // 每步需要显示的元素 ID 列表
        const stepElements = {
            0: [
                'scene1-tri-oab', 'scene1-tri-ocd',
                'scene1-point-o', 'scene1-point-a', 'scene1-point-b', 
                'scene1-point-c', 'scene1-point-d',
                'scene1-label-o', 'scene1-label-a', 'scene1-label-b', 
                'scene1-label-c', 'scene1-label-d'
            ],
            1: [
                'scene1-arc-aoc', 'scene1-arc-bod', 'scene1-label-70'
            ],
            2: [
                'scene1-arc-angle-a', 'scene1-label-100',
                'scene1-arc-angle-d', 'scene1-label-50d',
                'scene1-arc-angle-b', 'scene1-label-50b'
            ],
            3: [
                'scene1-arc-aob', 'scene1-label-30',
                'scene1-arc-aod', 'scene1-label-40'
            ]
        };

        // 显示元素
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene1-hidden');
                el.style.display = '';
                el.style.opacity = '1';
            }
        }

        // 隐藏元素
        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.add('scene1-hidden');
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }

        // 更新显示状态
        function updateDisplay() {
            // 隐藏所有步骤特有元素
            for (let step = 1; step < totalSteps; step++) {
                stepElements[step].forEach(id => hideElement(id));
            }

            // 显示当前步骤及之前步骤的元素
            for (let step = 0; step <= currentStep; step++) {
                stepElements[step].forEach(id => showElement(id));
            }

            // 更新按钮状态
            const prevBtn = document.getElementById('scene1-btn-prev');
            const prevBg = document.getElementById('scene1-btn-prev-bg');
            const nextBtn = document.getElementById('scene1-btn-next');
            const nextBg = document.getElementById('scene1-btn-next-bg');
            const stepIndicator = document.getElementById('scene1-step-indicator');

            if (currentStep === 0) {
                prevBtn.textContent = '◀ 上一步';
                prevBtn.style.fill = '#bdbdbd';
                prevBg.style.fill = '#e0e0e0';
                prevBtn.style.cursor = 'not-allowed';
            } else {
                prevBtn.textContent = '◀ 上一步';
                prevBtn.style.fill = '#000000';
                prevBg.style.fill = '#ffffff';
                prevBtn.style.cursor = 'pointer';
            }

            if (currentStep === totalSteps - 1) {
                nextBtn.textContent = '完成';
                nextBg.style.fill = '#9e9e9e';
                nextBtn.style.cursor = 'not-allowed';
            } else {
                nextBtn.textContent = '下一步 ▶';
                nextBg.style.fill = '#1565c0';
                nextBtn.style.cursor = 'pointer';
            }

            stepIndicator.textContent = `步骤 ${currentStep + 1}/${totalSteps}`;
        }

        // 按钮点击事件
        document.getElementById('scene1-btn-prev').addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        });

        document.getElementById('scene1-btn-next').addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateDisplay();
            }
        });

        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
