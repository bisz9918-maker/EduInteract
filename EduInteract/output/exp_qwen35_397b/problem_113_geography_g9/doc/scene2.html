<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>东西半球划分与 P、Q 位置关系</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-svg { width: 800px; height: 500px; }
        .scene2-hidden { display: none; opacity: 0; }
        .scene2-visible { display: block; opacity: 1; }
        .scene2-btn-rect { cursor: pointer; }
        .scene2-btn-rect:hover { fill: #e0e0e0 !important; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <style>
                    .scene2-line { fill: none; stroke: #000; stroke-width: 1.5; }
                    .scene2-line-thick { fill: none; stroke: #000; stroke-width: 2; }
                    .scene2-line-gray { fill: none; stroke: #999; stroke-width: 1.5; }
                    .scene2-line-green { fill: none; stroke: #2e7d32; stroke-width: 2; stroke-dasharray: 5,5; }
                    .scene2-zone-east { fill: #2e7d32; fill-opacity: 0.2; }
                    .scene2-zone-west { fill: #c62828; fill-opacity: 0.2; }
                    .scene2-point { fill: #1565c0; }
                    .scene2-point-o { fill: #000; }
                    .scene2-label { font-size: 14px; fill: #000; }
                    .scene2-label-small { font-size: 12px; fill: #000; }
                    .scene2-conclusion-text { font-size: 14px; fill: #000; }
                </style>
            </defs>

            <!-- 东半球区域（扇形填充）: 20°W 向东到 160°E -->
            <path id="scene2-zone-east" class="scene2-zone-east" 
                  d="M 400,80 L 400,250 A 170,170 0 0,0 550,180 Z" />

            <!-- 西半球区域（扇形填充）: 160°E 向东到 20°W -->
            <path id="scene2-zone-west" class="scene2-zone-west"
                  d="M 400,80 L 400,250 A 170,170 0 0,1 250,180 Z" />

            <!-- 20°W 分界线（绿色虚线） -->
            <line id="scene2-div-20w" class="scene2-line-green" x1="400" y1="80" x2="350" y2="200" />
            <text id="scene2-label-20w" class="scene2-label-small" x="330" y="215" text-anchor="middle">20°W</text>

            <!-- 160°E 分界线（绿色虚线） -->
            <line id="scene2-div-160e" class="scene2-line-green" x1="400" y1="80" x2="450" y2="200" />
            <text id="scene2-label-160e" class="scene2-label-small" x="470" y="215" text-anchor="middle">160°E</text>

            <!-- 东半球标签 -->
            <text id="scene2-label-east" class="scene2-label" x="550" y="350" text-anchor="middle" fill="#2e7d32">东半球</text>

            <!-- 西半球标签 -->
            <text id="scene2-label-west" class="scene2-label" x="250" y="350" text-anchor="middle" fill="#c62828">西半球</text>

            <!-- 极点 O -->
            <circle id="scene2-pole" class="scene2-point-o" cx="400" cy="80" r="5" />
            <text id="scene2-label-o" class="scene2-label" x="400" y="65" text-anchor="middle">O</text>

            <!-- 纬线 L（弧线） -->
            <path id="scene2-arc-l" class="scene2-line-thick" 
                  d="M 253,195 A 170,170 0 0,0 547,195" />
            <text id="scene2-label-l" class="scene2-label" x="230" y="210" text-anchor="middle">L</text>

            <!-- 经线 OP（左侧） -->
            <line id="scene2-line-op" class="scene2-line-gray" x1="400" y1="80" x2="320" y2="280" />

            <!-- 经线 OQ（右侧） -->
            <line id="scene2-line-oq" class="scene2-line-gray" x1="400" y1="80" x2="480" y2="280" />

            <!-- P 点 -->
            <circle id="scene2-point-p" class="scene2-point scene2-hidden" cx="320" cy="280" r="6" />
            <text id="scene2-label-p" class="scene2-label scene2-hidden" x="305" y="295" text-anchor="end">P</text>
            <text id="scene2-label-p-lon" class="scene2-label-small scene2-hidden" x="300" y="310" text-anchor="end">45°E</text>

            <!-- Q 点 -->
            <circle id="scene2-point-q" class="scene2-point scene2-hidden" cx="480" cy="280" r="6" />
            <text id="scene2-label-q" class="scene2-label scene2-hidden" x="495" y="295" text-anchor="start">Q</text>
            <text id="scene2-label-q-lon" class="scene2-label-small scene2-hidden" x="500" y="310" text-anchor="start">15°E</text>

            <!-- 结论文字框 -->
            <rect id="scene2-conclusion-rect" x="150" y="395" width="500" height="35" fill="#fff" stroke="#333" stroke-width="1" />
            <text id="scene2-conclusion-text" class="scene2-conclusion-text" x="400" y="418" text-anchor="middle">东西半球划分：20°W 向东到 160°E 为东半球</text>

            <!-- 控件栏（SVG 内部底部） -->
            <g id="scene2-controls-group">
                <rect id="scene2-btn-prev-bg" class="scene2-btn-rect" x="260" y="450" width="90" height="35" fill="#ccc" stroke="#333" stroke-width="1" rx="4" />
                <text id="scene2-btn-prev-text" x="305" y="472" text-anchor="middle" font-size="14" fill="#666">◀ 上一步</text>
                
                <text id="scene2-step-indicator" x="400" y="472" text-anchor="middle" font-size="14" fill="#000">步骤 0/4</text>
                
                <rect id="scene2-btn-next-bg" class="scene2-btn-rect" x="450" y="450" width="90" height="35" fill="#f0f0f0" stroke="#333" stroke-width="1" rx="4" />
                <text id="scene2-btn-next-text" x="495" y="472" text-anchor="middle" font-size="14" fill="#000">下一步 ▶</text>
            </g>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 2: 东西半球划分与 P、Q 位置关系判断
        
        // 布局坐标表（实现对照依据）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // |------|------|-----------|------|-------------|------|
        // | 极点 O | 圆点 | (400, 80) | r=5 | 上方偏移 10px | 画布上方中央 |
        // | 纬线 L | 弧线 | 圆心(400,250), 半径 170, 角度 120°~240° | 线宽 2 | 向下凸的弧 |
        // | 经线 OP | 线段 | (400,80)-(320,280) | 线宽 1.5 | - | 左侧经线 |
        // | 经线 OQ | 线段 | (400,80)-(480,280) | 线宽 1.5 | - | 右侧经线 |
        // | P 点 | 圆点 | (320, 280) 或 (280, 290) | r=6 | 左下方偏移 8px | 经线与纬线交点 |
        // | Q 点 | 圆点 | (480, 280) | r=6 | 右下方偏移 8px | 经线与纬线交点 |
        // | 20°W 分界线 | 虚线弧 | 从 O 辐射，角度约 195° | 线宽 2, 虚线 | 绿色 #2e7d32 |
        // | 160°E 分界线 | 虚线弧 | 从 O 辐射，角度约 345° | 线宽 2, 虚线 | 绿色 #2e7d32 |
        // | 东半球区域 | 扇形填充 | 20°W 向东到 160°E | 透明度 20% | 浅绿色 #2e7d32 |
        // | 西半球区域 | 扇形填充 | 160°E 向东到 20°W | 透明度 20% | 浅红色 #c62828 |
        // | 东半球标签 | text | (550, 350) | ~50×18 | - | 绿色区域中央 |
        // | 西半球标签 | text | (250, 350) | ~50×18 | - | 红色区域中央 |
        // | 15°E 标签 | text | (490, 310) | ~35×16 | 右侧 | Q 点经度 |
        // | 45°E/45°W 标签 | text | (300, 310) | ~40×16 | 左侧 | P 点经度（随步骤变化） |
        // | 结论文字框 | rect+text | (150, 400)-(650, 430) | 500×30 | - | 底部中央，白色背景 |
        // | 上一步按钮 | button | (280, 455) | 80×30 | - | SVG 内底部 |
        // | 下一步按钮 | button | (440, 455) | 80×30 | - | SVG 内底部 |
        // | 步骤指示器 | text | (400, 455) | ~100×16 | 中央对齐 | 显示"步骤 X/4" |

        let currentStep = 0;
        const totalSteps = 4;

        // 获取所有元素
        const elements = {
            zoneEast: document.getElementById('scene2-zone-east'),
            zoneWest: document.getElementById('scene2-zone-west'),
            div20w: document.getElementById('scene2-div-20w'),
            div160e: document.getElementById('scene2-div-160e'),
            label20w: document.getElementById('scene2-label-20w'),
            label160e: document.getElementById('scene2-label-160e'),
            labelEast: document.getElementById('scene2-label-east'),
            labelWest: document.getElementById('scene2-label-west'),
            pole: document.getElementById('scene2-pole'),
            labelO: document.getElementById('scene2-label-o'),
            arcL: document.getElementById('scene2-arc-l'),
            labelL: document.getElementById('scene2-label-l'),
            lineOp: document.getElementById('scene2-line-op'),
            lineOq: document.getElementById('scene2-line-oq'),
            pointP: document.getElementById('scene2-point-p'),
            labelP: document.getElementById('scene2-label-p'),
            labelPLon: document.getElementById('scene2-label-p-lon'),
            pointQ: document.getElementById('scene2-point-q'),
            labelQ: document.getElementById('scene2-label-q'),
            labelQLon: document.getElementById('scene2-label-q-lon'),
            conclusionRect: document.getElementById('scene2-conclusion-rect'),
            conclusionText: document.getElementById('scene2-conclusion-text'),
            btnPrevBg: document.getElementById('scene2-btn-prev-bg'),
            btnPrevText: document.getElementById('scene2-btn-prev-text'),
            btnNextBg: document.getElementById('scene2-btn-next-bg'),
            btnNextText: document.getElementById('scene2-btn-next-text'),
            stepIndicator: document.getElementById('scene2-step-indicator')
        };

        // 显示/隐藏工具函数
        function show(el) {
            if (el) {
                el.classList.remove('scene2-hidden');
                el.classList.add('scene2-visible');
                el.style.opacity = '1';
                el.style.display = 'block';
            }
        }

        function hide(el) {
            if (el) {
                el.classList.remove('scene2-visible');
                el.classList.add('scene2-hidden');
                el.style.opacity = '0';
                el.style.display = 'none';
            }
        }

        // 更新按钮状态
        function updateButtons() {
            if (currentStep === 0) {
                elements.btnPrevBg.setAttribute('fill', '#ccc');
                elements.btnPrevText.setAttribute('fill', '#666');
            } else {
                elements.btnPrevBg.setAttribute('fill', '#f0f0f0');
                elements.btnPrevText.setAttribute('fill', '#000');
            }

            if (currentStep === totalSteps) {
                elements.btnNextBg.setAttribute('fill', '#ccc');
                elements.btnNextText.setAttribute('fill', '#666');
            } else {
                elements.btnNextBg.setAttribute('fill', '#f0f0f0');
                elements.btnNextText.setAttribute('fill', '#000');
            }

            elements.stepIndicator.textContent = `步骤 ${currentStep}/${totalSteps}`;
        }

        // 更新场景内容
        function updateScene() {
            // 步骤 0：初始状态 - 显示东西半球分界线示意
            if (currentStep === 0) {
                show(elements.zoneEast);
                show(elements.zoneWest);
                show(elements.div20w);
                show(elements.div160e);
                show(elements.label20w);
                show(elements.label160e);
                show(elements.labelEast);
                show(elements.labelWest);
                show(elements.pole);
                show(elements.labelO);
                show(elements.arcL);
                show(elements.labelL);
                hide(elements.lineOp);
                hide(elements.lineOq);
                hide(elements.pointP);
                hide(elements.labelP);
                hide(elements.labelPLon);
                hide(elements.pointQ);
                hide(elements.labelQ);
                hide(elements.labelQLon);
                elements.conclusionText.textContent = '东西半球划分：20°W 向东到 160°E 为东半球';
            }
            // 步骤 1：情况 1（经度差 30°）— P、Q 位置
            else if (currentStep === 1) {
                show(elements.zoneEast);
                show(elements.zoneWest);
                show(elements.div20w);
                show(elements.div160e);
                show(elements.label20w);
                show(elements.label160e);
                show(elements.labelEast);
                show(elements.labelWest);
                show(elements.pole);
                show(elements.labelO);
                show(elements.arcL);
                show(elements.labelL);
                show(elements.lineOp);
                show(elements.lineOq);
                elements.lineOp.setAttribute('class', 'scene2-line-thick');
                elements.lineOq.setAttribute('class', 'scene2-line-thick');
                show(elements.pointP);
                elements.pointP.setAttribute('cx', '320');
                elements.pointP.setAttribute('cy', '280');
                show(elements.labelP);
                elements.labelP.setAttribute('x', '305');
                elements.labelP.setAttribute('y', '295');
                show(elements.labelPLon);
                elements.labelPLon.textContent = '45°E';
                elements.labelPLon.setAttribute('x', '300');
                elements.labelPLon.setAttribute('y', '310');
                show(elements.pointQ);
                show(elements.labelQ);
                show(elements.labelQLon);
                elements.conclusionText.textContent = '情况 1：经度差 30°，P 为 45°E，Q 为 15°E';
            }
            // 步骤 2：情况 1 结论
            else if (currentStep === 2) {
                show(elements.zoneEast);
                show(elements.zoneWest);
                elements.zoneEast.setAttribute('stroke', '#2e7d32');
                elements.zoneEast.setAttribute('stroke-width', '2');
                show(elements.div20w);
                show(elements.div160e);
                show(elements.label20w);
                show(elements.label160e);
                show(elements.labelEast);
                show(elements.labelWest);
                show(elements.pole);
                show(elements.labelO);
                show(elements.arcL);
                show(elements.labelL);
                show(elements.lineOp);
                show(elements.lineOq);
                elements.lineOp.setAttribute('class', 'scene2-line-thick');
                elements.lineOq.setAttribute('class', 'scene2-line-thick');
                show(elements.pointP);
                show(elements.labelP);
                show(elements.labelPLon);
                elements.labelPLon.textContent = '45°E';
                show(elements.pointQ);
                show(elements.labelQ);
                show(elements.labelQLon);
                elements.conclusionText.textContent = '结论：P、Q 都位于东半球（15°E 和 45°E 都在 20°W~160°E 范围内）';
            }
            // 步骤 3：情况 2（经度差 60°）— P、Q 位置
            else if (currentStep === 3) {
                show(elements.zoneEast);
                show(elements.zoneWest);
                elements.zoneEast.removeAttribute('stroke');
                elements.zoneWest.removeAttribute('stroke');
                show(elements.div20w);
                show(elements.div160e);
                show(elements.label20w);
                show(elements.label160e);
                show(elements.labelEast);
                show(elements.labelWest);
                show(elements.pole);
                show(elements.labelO);
                show(elements.arcL);
                show(elements.labelL);
                show(elements.lineOp);
                show(elements.lineOq);
                elements.lineOp.setAttribute('class', 'scene2-line-thick');
                elements.lineOq.setAttribute('class', 'scene2-line-thick');
                show(elements.pointP);
                elements.pointP.setAttribute('cx', '280');
                elements.pointP.setAttribute('cy', '290');
                show(elements.labelP);
                elements.labelP.setAttribute('x', '265');
                elements.labelP.setAttribute('y', '305');
                show(elements.labelPLon);
                elements.labelPLon.textContent = '45°W';
                elements.labelPLon.setAttribute('x', '260');
                elements.labelPLon.setAttribute('y', '320');
                show(elements.pointQ);
                show(elements.labelQ);
                show(elements.labelQLon);
                elements.conclusionText.textContent = '情况 2：经度差 60°，P 为 45°W，Q 为 15°E';
            }
            // 步骤 4：情况 2 结论
            else if (currentStep === 4) {
                show(elements.zoneEast);
                show(elements.zoneWest);
                elements.zoneEast.setAttribute('stroke', '#2e7d32');
                elements.zoneEast.setAttribute('stroke-width', '2');
                elements.zoneWest.setAttribute('stroke', '#c62828');
                elements.zoneWest.setAttribute('stroke-width', '2');
                show(elements.div20w);
                show(elements.div160e);
                show(elements.label20w);
                show(elements.label160e);
                show(elements.labelEast);
                show(elements.labelWest);
                show(elements.pole);
                show(elements.labelO);
                show(elements.arcL);
                show(elements.labelL);
                show(elements.lineOp);
                show(elements.lineOq);
                elements.lineOp.setAttribute('class', 'scene2-line-thick');
                elements.lineOq.setAttribute('class', 'scene2-line-thick');
                show(elements.pointP);
                show(elements.labelP);
                show(elements.labelPLon);
                elements.labelPLon.textContent = '45°W';
                show(elements.pointQ);
                show(elements.labelQ);
                show(elements.labelQLon);
                elements.conclusionText.textContent = '结论：P 位于西半球（45°W），Q 位于东半球（15°E），P 在 Q 的正西方';
            }

            updateButtons();
        }

        // 按钮点击事件
        elements.btnPrevBg.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        elements.btnNextBg.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateScene();
            }
        });

        // 初始化
        updateScene();
    })();
    </script>
</body>
</html>
