<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>甲乙两地经纬度坐标判读</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        .scene1-grid-line {
            stroke: #000000;
            stroke-width: 2;
            fill: none;
        }
        .scene1-point {
            transition: opacity 0.3s ease-in-out;
        }
        .scene1-label {
            font-size: 14px;
            transition: opacity 0.3s ease-in-out;
        }
        .scene1-lon-label {
            fill: #1565c0;
        }
        .scene1-lat-label {
            fill: #2e7d32;
        }
        .scene1-title {
            font-size: 16px;
            font-weight: bold;
            fill: #333333;
        }
        .scene1-coord-label {
            font-size: 14px;
            font-weight: bold;
            transition: opacity 0.3s ease-in-out;
        }
        .scene1-arrow {
            stroke: #888888;
            stroke-width: 2;
            fill: none;
            stroke-dasharray: 5,5;
            transition: opacity 0.3s ease-in-out;
        }
        .scene1-arrow-text {
            font-size: 12px;
            fill: #888888;
            transition: opacity 0.3s ease-in-out;
        }
        .scene1-hidden {
            opacity: 0;
        }
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }
        .scene1-btn {
            width: 100px;
            height: 35px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        #scene1-btn-prev {
            background-color: #e0e0e0;
            color: #333333;
        }
        #scene1-btn-prev:hover:not(:disabled) {
            background-color: #d0d0d0;
        }
        #scene1-btn-next {
            background-color: #1565c0;
            color: #ffffff;
        }
        #scene1-btn-next:hover:not(:disabled) {
            background-color: #0d47a1;
        }
        .scene1-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #scene1-step-indicator {
            font-size: 14px;
            color: #666666;
            min-width: 80px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 左图标题 -->
            <text id="scene1-title-left" x="215" y="55" text-anchor="middle" class="scene1-title">甲地</text>
            
            <!-- 右图标题 -->
            <text id="scene1-title-right" x="585" y="55" text-anchor="middle" class="scene1-title">乙地</text>
            
            <!-- 左图经纬网 -->
            <g id="scene1-left-grid">
                <!-- 竖线（经线） -->
                <line id="scene1-left-vline-1" x1="50" y1="80" x2="50" y2="350" class="scene1-grid-line"/>
                <line id="scene1-left-vline-2" x1="160" y1="80" x2="160" y2="350" class="scene1-grid-line"/>
                <line id="scene1-left-vline-3" x1="270" y1="80" x2="270" y2="350" class="scene1-grid-line"/>
                <line id="scene1-left-vline-4" x1="380" y1="80" x2="380" y2="350" class="scene1-grid-line"/>
                <!-- 横线（纬线） -->
                <line id="scene1-left-hline-1" x1="50" y1="80" x2="380" y2="80" class="scene1-grid-line"/>
                <line id="scene1-left-hline-2" x1="50" y1="170" x2="380" y2="170" class="scene1-grid-line"/>
                <line id="scene1-left-hline-3" x1="50" y1="260" x2="380" y2="260" class="scene1-grid-line"/>
                <line id="scene1-left-hline-4" x1="50" y1="350" x2="380" y2="350" class="scene1-grid-line"/>
            </g>
            
            <!-- 右图经纬网 -->
            <g id="scene1-right-grid">
                <!-- 竖线（经线） -->
                <line id="scene1-right-vline-1" x1="420" y1="80" x2="420" y2="350" class="scene1-grid-line"/>
                <line id="scene1-right-vline-2" x1="530" y1="80" x2="530" y2="350" class="scene1-grid-line"/>
                <line id="scene1-right-vline-3" x1="640" y1="80" x2="640" y2="350" class="scene1-grid-line"/>
                <line id="scene1-right-vline-4" x1="750" y1="80" x2="750" y2="350" class="scene1-grid-line"/>
                <!-- 横线（纬线） -->
                <line id="scene1-right-hline-1" x1="420" y1="80" x2="750" y2="80" class="scene1-grid-line"/>
                <line id="scene1-right-hline-2" x1="420" y1="170" x2="750" y2="170" class="scene1-grid-line"/>
                <line id="scene1-right-hline-3" x1="420" y1="260" x2="750" y2="260" class="scene1-grid-line"/>
                <line id="scene1-right-hline-4" x1="420" y1="350" x2="750" y2="350" class="scene1-grid-line"/>
            </g>
            
            <!-- 甲点（红色） -->
            <circle id="scene1-point-jia" cx="215" cy="170" r="6" fill="#c62828" class="scene1-point"/>
            
            <!-- 乙点（蓝色） -->
            <circle id="scene1-point-yi" cx="585" cy="170" r="6" fill="#1565c0" class="scene1-point"/>
            
            <!-- 左图经度标注（步骤 1 显示） -->
            <g id="scene1-left-lon-labels" class="scene1-hidden">
                <text x="50" y="70" text-anchor="middle" class="scene1-label scene1-lon-label">50°W</text>
                <text x="160" y="70" text-anchor="middle" class="scene1-label scene1-lon-label">40°W</text>
                <text x="270" y="70" text-anchor="middle" class="scene1-label scene1-lon-label">30°W</text>
            </g>
            
            <!-- 左图纬度标注（步骤 2 显示） -->
            <g id="scene1-left-lat-labels" class="scene1-hidden">
                <text x="35" y="85" text-anchor="end" class="scene1-label scene1-lat-label">20°S</text>
                <text x="35" y="175" text-anchor="end" class="scene1-label scene1-lat-label">30°S</text>
                <text x="35" y="265" text-anchor="end" class="scene1-label scene1-lat-label">40°S</text>
            </g>
            
            <!-- 右图经度标注（步骤 3 显示） -->
            <g id="scene1-right-lon-labels" class="scene1-hidden">
                <text x="420" y="70" text-anchor="middle" class="scene1-label scene1-lon-label">30°E</text>
                <text x="530" y="70" text-anchor="middle" class="scene1-label scene1-lon-label">40°E</text>
                <text x="640" y="70" text-anchor="middle" class="scene1-label scene1-lon-label">50°E</text>
            </g>
            
            <!-- 右图纬度标注（步骤 4 显示） -->
            <g id="scene1-right-lat-labels" class="scene1-hidden">
                <text x="765" y="85" text-anchor="start" class="scene1-label scene1-lat-label">40°N</text>
                <text x="765" y="175" text-anchor="start" class="scene1-label scene1-lat-label">30°N</text>
                <text x="765" y="265" text-anchor="start" class="scene1-label scene1-lat-label">20°N</text>
            </g>
            
            <!-- 左图经度箭头（步骤 1 显示） -->
            <g id="scene1-left-lon-arrow" class="scene1-hidden">
                <line x1="50" y1="380" x2="370" y2="380" class="scene1-arrow"/>
                <polygon points="380,380 365,375 365,385" fill="#888888"/>
                <text x="215" y="395" text-anchor="middle" class="scene1-arrow-text">西经 W 递减→</text>
            </g>
            
            <!-- 左图纬度箭头（步骤 2 显示） -->
            <g id="scene1-left-lat-arrow" class="scene1-hidden">
                <line x1="20" y1="80" x2="20" y2="340" class="scene1-arrow"/>
                <polygon points="20,350 15,335 25,335" fill="#888888"/>
                <text x="15" y="215" text-anchor="end" class="scene1-arrow-text" transform="rotate(-90, 15, 215)">南纬 S 递增↓</text>
            </g>
            
            <!-- 右图经度箭头（步骤 3 显示） -->
            <g id="scene1-right-lon-arrow" class="scene1-hidden">
                <line x1="420" y1="380" x2="740" y2="380" class="scene1-arrow"/>
                <polygon points="750,380 735,375 735,385" fill="#888888"/>
                <text x="585" y="395" text-anchor="middle" class="scene1-arrow-text">东经 E 递增→</text>
            </g>
            
            <!-- 右图纬度箭头（步骤 4 显示） -->
            <g id="scene1-right-lat-arrow" class="scene1-hidden">
                <line x1="780" y1="80" x2="780" y2="340" class="scene1-arrow"/>
                <polygon points="780,350 775,335 785,335" fill="#888888"/>
                <text x="785" y="215" text-anchor="start" class="scene1-arrow-text" transform="rotate(90, 785, 215)">北纬 N 递减↓</text>
            </g>
            
            <!-- 甲坐标标签（步骤 5 显示） -->
            <text id="scene1-jia-coord" x="215" y="200" text-anchor="middle" class="scene1-coord-label scene1-hidden" fill="#c62828">甲 (40°W, 30°S)</text>
            
            <!-- 乙坐标标签（步骤 5 显示） -->
            <text id="scene1-yi-coord" x="585" y="200" text-anchor="middle" class="scene1-coord-label scene1-hidden" fill="#1565c0">乙 (40°E, 30°N)</text>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 0/5</span>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现：甲乙两地经纬度坐标判读
        
        // 布局坐标表（实现对照依据）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 备注 |
        // |------|------|-----------|------|------|
        // | 左图外框 | 矩形 | (50,80)-(380,350) | 330×270 | 甲地经纬网 |
        // | 右图外框 | 矩形 | (420,80)-(750,350) | 330×270 | 乙地经纬网 |
        // | 甲点 | 实心圆 | (215,170) | r=6 | 左图中心交点 |
        // | 乙点 | 实心圆 | (585,170) | r=6 | 右图中心交点 |
        // | 左图标题 | text | (215,55) | ~60×16 | "甲地" |
        // | 右图标题 | text | (585,55) | ~60×16 | "乙地" |
        // | 左经度标注 | text | (50,70),(160,70),(270,70) | ~45×16 | 50°W,40°W,30°W |
        // | 左纬度标注 | text | (35,80),(35,170),(35,260) | ~45×16 | 20°S,30°S,40°S |
        // | 右经度标注 | text | (420,70),(530,70),(640,70) | ~45×16 | 30°E,40°E,50°E |
        // | 右纬度标注 | text | (765,80),(765,170),(765,260) | ~45×16 | 40°N,30°N,20°N |
        // | 甲坐标标签 | text | (215,200) | ~90×16 | 甲点正下方 |
        // | 乙坐标标签 | text | (585,200) | ~90×16 | 乙点正下方 |
        // | 控件栏 | 按钮组 | (250,450)-(550,490) | 300×40 | 上一步/下一步按钮 |
        
        // 状态变量
        let currentStep = 0;
        const totalSteps = 5;
        
        // 每步需要显示的元素 ID 列表
        const stepElements = {
            0: [],  // 初始状态：只显示网格和点（已默认显示）
            1: ['scene1-left-lon-labels', 'scene1-left-lon-arrow'],
            2: ['scene1-left-lat-labels', 'scene1-left-lat-arrow'],
            3: ['scene1-right-lon-labels', 'scene1-right-lon-arrow'],
            4: ['scene1-right-lat-labels', 'scene1-right-lat-arrow'],
            5: ['scene1-jia-coord', 'scene1-yi-coord']
        };
        
        // 获取 DOM 元素
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        
        // 工具函数：显示元素
        function showElement(elementId) {
            const el = document.getElementById(elementId);
            if (el) {
                el.classList.remove('scene1-hidden');
            }
        }
        
        // 工具函数：隐藏元素
        function hideElement(elementId) {
            const el = document.getElementById(elementId);
            if (el) {
                el.classList.add('scene1-hidden');
            }
        }
        
        // 更新显示状态
        function updateDisplay() {
            // 隐藏所有步骤相关元素
            for (let step = 1; step <= totalSteps; step++) {
                stepElements[step].forEach(id => hideElement(id));
            }
            
            // 显示当前步骤及之前步骤的元素
            for (let step = 1; step <= currentStep; step++) {
                stepElements[step].forEach(id => showElement(id));
            }
            
            // 步骤 5 时淡出箭头
            if (currentStep === 5) {
                hideElement('scene1-left-lon-arrow');
                hideElement('scene1-left-lat-arrow');
                hideElement('scene1-right-lon-arrow');
                hideElement('scene1-right-lat-arrow');
            }
            
            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps);
            
            // 更新步骤指示器
            stepIndicator.textContent = `步骤 ${currentStep}/${totalSteps}`;
        }
        
        // 上一步按钮点击事件
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        });
        
        // 下一步按钮点击事件
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateDisplay();
            }
        });
        
        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
