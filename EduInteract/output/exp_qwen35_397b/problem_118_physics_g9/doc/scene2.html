<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电路动态分析 - 场景 2</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-svg { width: 800px; height: 500px; }
        .scene2-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #333; border-radius: 4px; background: #f5f5f5; }
        .scene2-btn:hover { background: #e0e0e0; }
        .scene2-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene2-step-indicator { font-size: 14px; padding: 8px 16px; }
        .scene2-option-box { fill: rgba(0,0,0,0.05); stroke: #000; stroke-width: 1; }
        .scene2-option-box.highlight { stroke: #1565c0; stroke-width: 2; fill: rgba(21,101,192,0.1); }
        .scene2-option-box.correct { stroke: #2e7d32; stroke-width: 2; fill: rgba(46,125,50,0.1); }
        .scene2-option-box.wrong { stroke: #c62828; stroke-width: 2; fill: rgba(198,40,40,0.1); }
        .scene2-hidden { display: none; opacity: 0; }
        .scene2-visible { display: block; opacity: 1; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene2-arrow-up" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
                    <path d="M5,10 L5,0 M0,3 L5,0 L10,3" stroke="#2e7d32" stroke-width="2" fill="none"/>
                </marker>
                <marker id="scene2-arrow-down" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
                    <path d="M5,0 L5,10 M0,7 L5,10 L10,7" stroke="#c62828" stroke-width="2" fill="none"/>
                </marker>
            </defs>

            <!-- ========== 电路图区域 (左侧 x=40~360) ========== -->
            
            <!-- 电源 (底部) -->
            <g id="scene2-power">
                <line x1="100" y1="320" x2="120" y2="320" stroke="#000" stroke-width="2"/>
                <line x1="120" y1="310" x2="120" y2="330" stroke="#000" stroke-width="2"/>
                <line x1="135" y1="315" x2="135" y2="325" stroke="#000" stroke-width="2"/>
                <line x1="135" y1="320" x2="165" y2="320" stroke="#000" stroke-width="2"/>
            </g>

            <!-- 开关 S -->
            <g id="scene2-switch">
                <line x1="165" y1="320" x2="185" y2="320" stroke="#000" stroke-width="2"/>
                <line x1="185" y1="320" x2="215" y2="315" stroke="#000" stroke-width="2"/>
                <circle cx="185" cy="320" r="3" fill="#000"/>
                <circle cx="215" cy="320" r="3" fill="#000"/>
                <text x="200" y="345" text-anchor="middle" font-size="14">S</text>
            </g>

            <!-- 右侧竖直线 -->
            <line x1="320" y1="120" x2="320" y2="320" stroke="#000" stroke-width="2" id="scene2-wire-right"/>

            <!-- 底部横线 -->
            <line x1="80" y1="320" x2="100" y2="320" stroke="#000" stroke-width="2" id="scene2-wire-bottom1"/>
            <line x1="215" y1="320" x2="320" y2="320" stroke="#000" stroke-width="2" id="scene2-wire-bottom2"/>

            <!-- 电阻 R₁ (左侧竖直) -->
            <g id="scene2-r1">
                <rect x="70" y="170" width="20" height="60" fill="none" stroke="#000" stroke-width="2"/>
                <text x="52" y="205" text-anchor="end" font-size="14">R₁</text>
            </g>

            <!-- 左侧竖直线 (上下段) -->
            <line x1="80" y1="120" x2="80" y2="170" stroke="#000" stroke-width="2" id="scene2-wire-left1"/>
            <line x1="80" y1="230" x2="80" y2="320" stroke="#000" stroke-width="2" id="scene2-wire-left2"/>

            <!-- 变阻器 R₂ (顶部水平) -->
            <g id="scene2-r2">
                <rect x="120" y="110" width="120" height="20" fill="none" stroke="#000" stroke-width="2"/>
                <text x="180" y="155" text-anchor="middle" font-size="14">R₂</text>
            </g>

            <!-- 顶部横线 (左右段) -->
            <line x1="80" y1="120" x2="120" y2="120" stroke="#000" stroke-width="2" id="scene2-wire-top1"/>
            <line x1="240" y1="120" x2="320" y2="120" stroke="#000" stroke-width="2" id="scene2-wire-top2"/>

            <!-- 滑片 P (初始位置 - 灰色) -->
            <g id="scene2-slider-initial" class="scene2-visible">
                <line x1="200" y1="100" x2="200" y2="110" stroke="#888" stroke-width="2"/>
                <polygon points="200,100 195,110 205,110" fill="#888"/>
                <text x="200" y="90" text-anchor="middle" font-size="12" fill="#888">P</text>
            </g>

            <!-- 滑片 P (左移后 - 蓝色) -->
            <g id="scene2-slider-moved" class="scene2-hidden">
                <line x1="150" y1="100" x2="150" y2="110" stroke="#1565c0" stroke-width="2"/>
                <polygon points="150,100 145,110 155,110" fill="#1565c0"/>
                <text x="150" y="90" text-anchor="middle" font-size="12" fill="#1565c0">P</text>
            </g>

            <!-- 电压表 V₁ (并联在 R₂ 两端) -->
            <g id="scene2-v1">
                <circle cx="180" cy="60" r="18" fill="none" stroke="#000" stroke-width="2"/>
                <text x="180" y="66" text-anchor="middle" font-size="13">V₁</text>
                <text x="180" y="35" text-anchor="middle" font-size="12">U₁</text>
                <!-- 连接线 -->
                <line x1="80" y1="120" x2="80" y2="60" stroke="#000" stroke-width="2"/>
                <line x1="80" y1="60" x2="162" y2="60" stroke="#000" stroke-width="2"/>
                <line x1="198" y1="60" x2="240" y2="60" stroke="#000" stroke-width="2"/>
                <line x1="240" y1="60" x2="240" y2="120" stroke="#000" stroke-width="2"/>
            </g>

            <!-- 电压表 V₂ (并联在电源两端) -->
            <g id="scene2-v2">
                <circle cx="200" cy="370" r="18" fill="none" stroke="#000" stroke-width="2"/>
                <text x="200" y="376" text-anchor="middle" font-size="13">V₂</text>
                <text x="200" y="405" text-anchor="middle" font-size="12">U₂</text>
                <!-- 连接线 -->
                <line x1="80" y1="320" x2="80" y2="370" stroke="#000" stroke-width="2"/>
                <line x1="80" y1="370" x2="182" y2="370" stroke="#000" stroke-width="2"/>
                <line x1="218" y1="370" x2="320" y2="370" stroke="#000" stroke-width="2"/>
                <line x1="320" y1="320" x2="320" y2="370" stroke="#000" stroke-width="2"/>
            </g>

            <!-- 电流表 A (串联) -->
            <g id="scene2-ammeter">
                <circle cx="300" cy="60" r="18" fill="none" stroke="#000" stroke-width="2"/>
                <text x="300" y="66" text-anchor="middle" font-size="13">A</text>
                <text x="330" y="65" font-size="12">I</text>
                <!-- 连接线 -->
                <line x1="240" y1="120" x2="240" y2="60" stroke="#000" stroke-width="2"/>
                <line x1="240" y1="60" x2="282" y2="60" stroke="#000" stroke-width="2"/>
                <line x1="318" y1="60" x2="320" y2="60" stroke="#000" stroke-width="2"/>
            </g>

            <!-- 变化量标注区域 -->
            <g id="scene2-delta-labels" class="scene2-hidden">
                <!-- △I 向上箭头 (绿色) -->
                <g id="scene2-delta-i">
                    <line x1="360" y1="100" x2="360" y2="70" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene2-arrow-up)"/>
                    <text x="360" y="60" text-anchor="middle" font-size="12" fill="#2e7d32">△I</text>
                </g>
                <!-- △U₁ 向下箭头 (红色) -->
                <g id="scene2-delta-u1">
                    <line x1="360" y1="150" x2="360" y2="180" stroke="#c62828" stroke-width="2" marker-end="url(#scene2-arrow-down)"/>
                    <text x="360" y="195" text-anchor="middle" font-size="12" fill="#c62828">△U₁</text>
                </g>
                <!-- △U₂ = 0 -->
                <g id="scene2-delta-u2">
                    <text x="360" y="230" text-anchor="middle" font-size="12">△U₂ = 0</text>
                </g>
            </g>

            <!-- 推导公式区 -->
            <g id="scene2-formula-area">
                <rect x="400" y="360" width="380" height="50" fill="rgba(255,255,255,0.9)" stroke="#ccc" stroke-width="1"/>
                <text id="scene2-formula-text" x="590" y="382" text-anchor="middle" font-size="13" fill="#333"></text>
                <text id="scene2-formula-text2" x="590" y="402" text-anchor="middle" font-size="13" fill="#333"></text>
            </g>

            <!-- ========== 选项分析区域 (右侧 x=400~780) ========== -->
            
            <!-- 选项 A -->
            <g id="scene2-option-a">
                <rect x="400" y="50" width="380" height="45" class="scene2-option-box" id="scene2-option-a-box"/>
                <text x="415" y="75" font-size="13">A. <tspan id="scene2-opt-a-text" fill="#666">U₂/I 的值变小</tspan></text>
                <text id="scene2-opt-a-mark" x="760" y="75" font-size="18" fill="#2e7d32" class="scene2-hidden">✓</text>
            </g>

            <!-- 选项 B -->
            <g id="scene2-option-b">
                <rect x="400" y="110" width="380" height="45" class="scene2-option-box" id="scene2-option-b-box"/>
                <text x="415" y="135" font-size="13">B. <tspan id="scene2-opt-b-text" fill="#666">(U₂-U₁)/I 的值不变</tspan></text>
                <text id="scene2-opt-b-mark" x="760" y="135" font-size="18" fill="#2e7d32" class="scene2-hidden">✓</text>
            </g>

            <!-- 选项 C -->
            <g id="scene2-option-c">
                <rect x="400" y="170" width="380" height="45" class="scene2-option-box" id="scene2-option-c-box"/>
                <text x="415" y="195" font-size="13">C. <tspan id="scene2-opt-c-text" fill="#666">△U₁/△I 的值不变</tspan></text>
                <text id="scene2-opt-c-mark" x="760" y="195" font-size="18" fill="#2e7d32" class="scene2-hidden">✓</text>
            </g>

            <!-- 选项 D -->
            <g id="scene2-option-d">
                <rect x="400" y="230" width="380" height="45" class="scene2-option-box" id="scene2-option-d-box"/>
                <text x="415" y="255" font-size="13">D. <tspan id="scene2-opt-d-text" fill="#666">△U₁ 和△U₂ 的大小相同</tspan></text>
                <text id="scene2-opt-d-mark" x="760" y="255" font-size="18" fill="#c62828" class="scene2-hidden">✗</text>
            </g>

            <!-- 结论文本 -->
            <g id="scene2-conclusion" class="scene2-hidden">
                <text x="590" y="320" text-anchor="middle" font-size="15" fill="#1565c0" font-weight="bold">正确选项：A、B、C</text>
            </g>
        </svg>

        <!-- 控件栏 (绝对定位在 SVG 底部) -->
        <div id="scene2-controls" style="position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10;">
            <button id="scene2-btn-prev" class="scene2-btn" disabled>◀ 上一步</button>
            <span id="scene2-step-indicator" class="scene2-step-indicator">步骤 0/6</span>
            <button id="scene2-btn-next" class="scene2-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2 实现 - 电路动态分析

        const totalSteps = 6;
        let currentStep = 0;

        // DOM 元素引用
        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        const stepIndicator = document.getElementById('scene2-step-indicator');
        const formulaText = document.getElementById('scene2-formula-text');
        const formulaText2 = document.getElementById('scene2-formula-text2');

        // 元素显示控制函数
        function show(el) {
            if (el) {
                el.classList.remove('scene2-hidden');
                el.classList.add('scene2-visible');
                if (el.style) {
                    el.style.display = 'block';
                    el.style.opacity = '1';
                }
            }
        }

        function hide(el) {
            if (el) {
                el.classList.remove('scene2-visible');
                el.classList.add('scene2-hidden');
                if (el.style) {
                    el.style.display = 'none';
                    el.style.opacity = '0';
                }
            }
        }

        // 更新步骤显示
        function updateStep() {
            stepIndicator.textContent = `步骤 ${currentStep}/${totalSteps}`;
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps;
            if (currentStep === totalSteps) {
                btnNext.textContent = '完成';
            } else {
                btnNext.textContent = '下一步 ▶';
            }

            // 根据步骤更新显示内容
            renderStep(currentStep);
        }

        // 渲染每个步骤的内容
        function renderStep(step) {
            // 重置所有动态元素
            hide(document.getElementById('scene2-slider-moved'));
            show(document.getElementById('scene2-slider-initial'));
            hide(document.getElementById('scene2-delta-labels'));
            formulaText.textContent = '';
            formulaText2.textContent = '';

            // 重置选项框样式
            ['a', 'b', 'c', 'd'].forEach(opt => {
                const box = document.getElementById(`scene2-option-${opt}-box`);
                const mark = document.getElementById(`scene2-opt-${opt}-mark`);
                const text = document.getElementById(`scene2-opt-${opt}-text`);
                box.classList.remove('highlight', 'correct', 'wrong');
                hide(mark);
                if (text) text.setAttribute('fill', '#666');
            });
            hide(document.getElementById('scene2-conclusion'));

            switch(step) {
                case 0:
                    // 初始状态：显示完整电路图
                    break;

                case 1:
                    // 滑片左移，显示变化量
                    hide(document.getElementById('scene2-slider-initial'));
                    show(document.getElementById('scene2-slider-moved'));
                    show(document.getElementById('scene2-delta-labels'));
                    formulaText.textContent = '滑片 P 左移 → R₂ 减小';
                    formulaText2.textContent = 'I↑, U₁↓, U₂ 不变';
                    break;

                case 2:
                    // 分析选项 A
                    hide(document.getElementById('scene2-slider-initial'));
                    show(document.getElementById('scene2-slider-moved'));
                    show(document.getElementById('scene2-delta-labels'));
                    document.getElementById('scene2-option-a-box').classList.add('highlight');
                    show(document.getElementById('scene2-opt-a-mark'));
                    document.getElementById('scene2-opt-a-text').setAttribute('fill', '#000');
                    formulaText.textContent = 'U₂ 不变，I 变大';
                    formulaText2.textContent = '∴ U₂/I 变小 ✓';
                    break;

                case 3:
                    // 分析选项 B
                    hide(document.getElementById('scene2-slider-initial'));
                    show(document.getElementById('scene2-slider-moved'));
                    show(document.getElementById('scene2-delta-labels'));
                    document.getElementById('scene2-option-b-box').classList.add('highlight');
                    show(document.getElementById('scene2-opt-b-mark'));
                    document.getElementById('scene2-opt-b-text').setAttribute('fill', '#000');
                    formulaText.textContent = 'U₂ - U₁ = U_R₁ = I·R₁';
                    formulaText2.textContent = '∴ (U₂-U₁)/I = R₁ (定值) ✓';
                    break;

                case 4:
                    // 分析选项 C
                    hide(document.getElementById('scene2-slider-initial'));
                    show(document.getElementById('scene2-slider-moved'));
                    show(document.getElementById('scene2-delta-labels'));
                    document.getElementById('scene2-option-c-box').classList.add('highlight');
                    show(document.getElementById('scene2-opt-c-mark'));
                    document.getElementById('scene2-opt-c-text').setAttribute('fill', '#000');
                    formulaText.textContent = 'U₁ = U₂ - I·R₁ → △U₁ = -△I·R₁';
                    formulaText2.textContent = '∴ |△U₁/△I| = R₁ (定值) ✓';
                    break;

                case 5:
                    // 分析选项 D
                    hide(document.getElementById('scene2-slider-initial'));
                    show(document.getElementById('scene2-slider-moved'));
                    show(document.getElementById('scene2-delta-labels'));
                    document.getElementById('scene2-option-d-box').classList.add('highlight');
                    show(document.getElementById('scene2-opt-d-mark'));
                    document.getElementById('scene2-opt-d-text').setAttribute('fill', '#000');
                    formulaText.textContent = '△U₂ = 0 (电源电压恒定)';
                    formulaText2.textContent = '△U₁ ≠ 0  ∴ △U₁ ≠ △U₂ ✗';
                    break;

                case 6:
                    // 结论
                    hide(document.getElementById('scene2-slider-initial'));
                    show(document.getElementById('scene2-slider-moved'));
                    show(document.getElementById('scene2-delta-labels'));
                    // 显示所有标记
                    ['a', 'b', 'c'].forEach(opt => {
                        document.getElementById(`scene2-option-${opt}-box`).classList.add('correct');
                        show(document.getElementById(`scene2-opt-${opt}-mark`));
                        document.getElementById(`scene2-opt-${opt}-text`).setAttribute('fill', '#000');
                    });
                    document.getElementById('scene2-option-d-box').classList.add('wrong');
                    show(document.getElementById('scene2-opt-d-mark'));
                    document.getElementById('scene2-opt-d-text').setAttribute('fill', '#000');
                    show(document.getElementById('scene2-conclusion'));
                    formulaText.textContent = '正确选项：A、B、C';
                    formulaText2.textContent = '';
                    break;
            }
        }

        // 事件绑定
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateStep();
            }
        });

        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
