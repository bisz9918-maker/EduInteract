<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>磁极相互作用与弹簧测力计示数变化</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene3-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene3-svg {
            width: 800px;
            height: 500px;
        }
        #scene3-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 12px;
            z-index: 10;
        }
        .scene3-btn {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            background: #1565c0;
            color: white;
            border: none;
            border-radius: 4px;
        }
        .scene3-btn:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }
        .scene3-step-indicator {
            font-size: 14px;
            color: #333;
            min-width: 200px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg id="scene3-svg" width="800" height="500">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene3-arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#c62828" />
                </marker>
                <marker id="scene3-arrow-black" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#000000" />
                </marker>
                <marker id="scene3-arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#1565c0" />
                </marker>
            </defs>

            <!-- 弹簧测力计外壳 -->
            <rect id="scene3-spring-scale-body" x="385" y="50" width="30" height="90" fill="#e0e0e0" stroke="#666666" stroke-width="2"/>
            <!-- 测力计挂钩 -->
            <path id="scene3-spring-hook" d="M400,140 L400,150" stroke="#666666" stroke-width="2" fill="none"/>
            <!-- 测力计刻度盘（右侧放大） -->
            <ellipse id="scene3-scale-dial" cx="550" cy="110" rx="30" ry="30" fill="#ffffff" stroke="#666666" stroke-width="2"/>
            <line id="scene3-scale-line1" x1="550" y1="95" x2="550" y2="105" stroke="#666666" stroke-width="1"/>
            <line id="scene3-scale-line2" x1="550" y1="115" x2="550" y2="125" stroke="#666666" stroke-width="1"/>
            <line id="scene3-scale-line3" x1="535" y1="110" x2="545" y2="110" stroke="#666666" stroke-width="1"/>
            <line id="scene3-scale-line4" x1="555" y1="110" x2="565" y2="110" stroke="#666666" stroke-width="1"/>
            <!-- 测力计指针 -->
            <line id="scene3-scale-pointer" x1="550" y1="110" x2="550" y2="120" stroke="#c62828" stroke-width="2"/>

            <!-- 条形磁铁 A -->
            <!-- S 极区（上半部分） -->
            <rect id="scene3-magnet-s" x="370" y="150" width="60" height="60" fill="#e3f2fd" stroke="#000000" stroke-width="2"/>
            <!-- N 极区（下半部分） -->
            <rect id="scene3-magnet-n" x="370" y="210" width="60" height="60" fill="#ffebee" stroke="#000000" stroke-width="2"/>
            <!-- 磁铁 N 极高亮层（初始隐藏） -->
            <rect id="scene3-magnet-n-highlight" x="370" y="210" width="60" height="60" fill="#c62828" opacity="0"/>
            <!-- 磁铁标签 -->
            <text id="scene3-label-a" x="450" y="210" font-size="16" fill="#000000">A</text>
            <!-- 磁极标签：移到磁铁右侧外部 -->
            <text id="scene3-label-s-magnet" x="445" y="180" font-size="14" fill="#000000" text-anchor="middle">S</text>
            <text id="scene3-label-n-magnet" x="445" y="250" font-size="14" fill="#000000" text-anchor="middle">N</text>

            <!-- 螺线管 B -->
            <rect id="scene3-solenoid-body" x="350" y="300" width="100" height="120" fill="#f5f5f5" stroke="#000000" stroke-width="2"/>
            <!-- 螺线管线圈示意 -->
            <path id="scene3-solenoid-coil1" d="M355,320 Q375,310 395,320" stroke="#666666" stroke-width="2" fill="none"/>
            <path id="scene3-solenoid-coil2" d="M355,340 Q375,330 395,340" stroke="#666666" stroke-width="2" fill="none"/>
            <path id="scene3-solenoid-coil3" d="M355,360 Q375,350 395,360" stroke="#666666" stroke-width="2" fill="none"/>
            <path id="scene3-solenoid-coil4" d="M355,380 Q375,370 395,380" stroke="#666666" stroke-width="2" fill="none"/>
            <path id="scene3-solenoid-coil5" d="M355,400 Q375,390 395,400" stroke="#666666" stroke-width="2" fill="none"/>
            <!-- 螺线管 N 极区（上半部分） -->
            <rect id="scene3-solenoid-n" x="350" y="300" width="100" height="50" fill="#ffebee" stroke="none"/>
            <!-- 螺线管 S 极区（下半部分） -->
            <rect id="scene3-solenoid-s" x="350" y="350" width="100" height="70" fill="#e3f2fd" stroke="none"/>
            <!-- 螺线管 N 极高亮层（初始隐藏） -->
            <rect id="scene3-solenoid-n-highlight" x="350" y="300" width="100" height="50" fill="#c62828" opacity="0"/>
            <!-- 螺线管标签 -->
            <text id="scene3-label-b" x="470" y="360" font-size="16" fill="#000000">B</text>
            <!-- 螺线管磁极标签：移到螺线管右侧外部 -->
            <text id="scene3-label-n-solenoid" x="465" y="325" font-size="14" fill="#000000" text-anchor="middle">N</text>
            <text id="scene3-label-s-solenoid" x="465" y="390" font-size="14" fill="#000000" text-anchor="middle">S</text>

            <!-- 斥力箭头 F_斥（初始隐藏）- 从磁铁重心向上 -->
            <line id="scene3-arrow-repulsion" x1="400" y1="240" x2="400" y2="190" stroke="#c62828" stroke-width="3" marker-end="url(#scene3-arrow-red)" opacity="0"/>
            <!-- 斥力标签：移到箭头左侧，远离标签 A -->
            <text id="scene3-label-f-repulsion" x="385" y="215" font-size="14" fill="#c62828" opacity="0">F_斥</text>

            <!-- 重力箭头 G（初始隐藏）- 从磁铁重心向下 -->
            <line id="scene3-arrow-gravity" x1="400" y1="210" x2="400" y2="270" stroke="#000000" stroke-width="2" marker-end="url(#scene3-arrow-black)" opacity="0"/>
            <!-- 重力标签：移到箭头右侧，远离磁铁 -->
            <text id="scene3-label-g" x="415" y="245" font-size="14" fill="#000000" opacity="0">G</text>

            <!-- 拉力箭头 F_弹（初始隐藏）- 从磁铁重心向上 -->
            <line id="scene3-arrow-spring" x1="400" y1="210" x2="400" y2="150" stroke="#1565c0" stroke-width="2" marker-end="url(#scene3-arrow-blue)" opacity="0"/>
            <!-- 拉力标签：移到箭头左侧，远离磁铁 -->
            <text id="scene3-label-f-spring" x="360" y="180" font-size="14" fill="#1565c0" opacity="0">F_弹</text>

            <!-- 结论文本（初始隐藏） -->
            <text id="scene3-conclusion" x="550" y="190" font-size="16" fill="#2e7d32" opacity="0">示数变小</text>

            <!-- 受力平衡公式（初始隐藏）- 向下移动增加间距 -->
            <text id="scene3-formula" x="550" y="220" font-size="14" fill="#333333" opacity="0">F_弹 = G - F_斥</text>

            <!-- 步骤指示器和按钮（放在 SVG 内部底部） -->
            <text id="scene3-step-text" x="400" y="460" font-size="14" fill="#333333" text-anchor="middle">初始状态</text>
        </svg>

        <div id="scene3-controls">
            <button id="scene3-prev-btn" class="scene3-btn">◀ 上一步</button>
            <span id="scene3-step-indicator" class="scene3-step-indicator">步骤 0/5</span>
            <button id="scene3-next-btn" class="scene3-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 3: 磁极相互作用与弹簧测力计示数变化

        // 状态变量
        let currentState = 0;
        const totalSteps = 5;

        // 步骤说明
        const stepDescriptions = [
            "初始状态：显示装置结构",
            "步骤 1：高亮同名磁极（N-N 相对）",
            "步骤 2：显示同名磁极相斥力",
            "步骤 3：展示受力分析",
            "步骤 4：滑片右移，斥力增强",
            "步骤 5：得出结论，示数变小"
        ];

        // 获取元素
        const prevBtn = document.getElementById('scene3-prev-btn');
        const nextBtn = document.getElementById('scene3-next-btn');
        const stepIndicator = document.getElementById('scene3-step-indicator');
        const stepText = document.getElementById('scene3-step-text');

        // 元素引用
        const elements = {
            magnetNHighlight: document.getElementById('scene3-magnet-n-highlight'),
            solenoidNHighlight: document.getElementById('scene3-solenoid-n-highlight'),
            arrowRepulsion: document.getElementById('scene3-arrow-repulsion'),
            labelFRepulsion: document.getElementById('scene3-label-f-repulsion'),
            arrowGravity: document.getElementById('scene3-arrow-gravity'),
            labelG: document.getElementById('scene3-label-g'),
            arrowSpring: document.getElementById('scene3-arrow-spring'),
            labelFSpring: document.getElementById('scene3-label-f-spring'),
            conclusion: document.getElementById('scene3-conclusion'),
            formula: document.getElementById('scene3-formula'),
            scalePointer: document.getElementById('scene3-scale-pointer')
        };

        // 显示/隐藏工具函数
        function show(el) {
            if (el) {
                el.style.display = '';
                el.style.opacity = '1';
            }
        }

        function hide(el) {
            if (el) {
                el.style.display = '';
                el.style.opacity = '0';
            }
        }

        // 更新显示状态
        function updateDisplay() {
            // 重置所有元素
            hide(elements.magnetNHighlight);
            hide(elements.solenoidNHighlight);
            hide(elements.arrowRepulsion);
            hide(elements.labelFRepulsion);
            hide(elements.arrowGravity);
            hide(elements.labelG);
            hide(elements.arrowSpring);
            hide(elements.labelFSpring);
            hide(elements.conclusion);
            hide(elements.formula);
            elements.scalePointer.setAttribute('x2', '550');
            elements.scalePointer.setAttribute('y2', '120');

            // 根据当前状态显示相应元素
            switch (currentState) {
                case 0:
                    // 初始状态：只显示基本结构
                    break;

                case 1:
                    // 高亮同名磁极
                    elements.magnetNHighlight.style.opacity = '0.2';
                    elements.solenoidNHighlight.style.opacity = '0.2';
                    break;

                case 2:
                    // 显示斥力
                    elements.magnetNHighlight.style.opacity = '0.2';
                    elements.solenoidNHighlight.style.opacity = '0.2';
                    show(elements.arrowRepulsion);
                    show(elements.labelFRepulsion);
                    break;

                case 3:
                    // 显示受力分析
                    elements.magnetNHighlight.style.opacity = '0.2';
                    elements.solenoidNHighlight.style.opacity = '0.2';
                    show(elements.arrowRepulsion);
                    show(elements.labelFRepulsion);
                    show(elements.arrowGravity);
                    show(elements.labelG);
                    show(elements.arrowSpring);
                    show(elements.labelFSpring);
                    break;

                case 4:
                    // 斥力增强（箭头变长变粗）
                    elements.magnetNHighlight.style.opacity = '0.2';
                    elements.solenoidNHighlight.style.opacity = '0.2';
                    elements.arrowRepulsion.setAttribute('y2', '175');
                    elements.arrowRepulsion.setAttribute('stroke-width', '4');
                    show(elements.arrowRepulsion);
                    show(elements.labelFRepulsion);
                    show(elements.arrowGravity);
                    show(elements.labelG);
                    show(elements.arrowSpring);
                    show(elements.labelFSpring);
                    break;

                case 5:
                    // 结论：示数变小
                    elements.magnetNHighlight.style.opacity = '0.2';
                    elements.solenoidNHighlight.style.opacity = '0.2';
                    elements.arrowRepulsion.setAttribute('y2', '175');
                    elements.arrowRepulsion.setAttribute('stroke-width', '4');
                    show(elements.arrowRepulsion);
                    show(elements.labelFRepulsion);
                    show(elements.arrowGravity);
                    show(elements.labelG);
                    show(elements.arrowSpring);
                    show(elements.labelFSpring);
                    show(elements.conclusion);
                    show(elements.formula);
                    // 指针向上偏转（示数变小）
                    elements.scalePointer.setAttribute('x2', '545');
                    elements.scalePointer.setAttribute('y2', '115');
                    break;
            }

            // 更新按钮状态
            prevBtn.disabled = (currentState === 0);
            nextBtn.disabled = (currentState === totalSteps);

            // 更新步骤指示
            stepIndicator.textContent = `步骤 ${currentState}/${totalSteps}`;
            stepText.textContent = stepDescriptions[currentState];
        }

        // 事件监听
        prevBtn.addEventListener('click', function() {
            if (currentState > 0) {
                currentState--;
                updateDisplay();
            }
        });

        nextBtn.addEventListener('click', function() {
            if (currentState < totalSteps) {
                currentState++;
                updateDisplay();
            }
        });

        // 初始化
        updateDisplay();
    })();
    </script>
</body>
</html>
