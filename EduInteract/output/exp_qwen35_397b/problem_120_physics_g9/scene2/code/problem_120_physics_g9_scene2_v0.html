<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>滑片移动时电路参数变化规律</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene2-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: #f5f5f5; }
        .scene2-btn:hover { background: #e0e0e0; }
        .scene2-btn.active { background: #1565c0; color: white; border-color: #1565c0; }
        .scene2-hidden { display: none; opacity: 0; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene2-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#000000" />
                </marker>
            </defs>

            <!-- ========== 电路图区（左侧） ========== -->
            <!-- 电源：电池符号 (60,100)-(120,100) -->
            <line x1="60" y1="100" x2="90" y2="100" stroke="#000000" stroke-width="2"/>
            <line x1="90" y1="90" x2="90" y2="110" stroke="#000000" stroke-width="2"/>
            <line x1="95" y1="95" x2="95" y2="105" stroke="#000000" stroke-width="2"/>
            <line x1="100" y1="90" x2="100" y2="110" stroke="#000000" stroke-width="2"/>
            <line x1="105" y1="95" x2="105" y2="105" stroke="#000000" stroke-width="2"/>
            <line x1="110" y1="90" x2="110" y2="110" stroke="#000000" stroke-width="2"/>
            <line x1="110" y1="100" x2="120" y2="100" stroke="#000000" stroke-width="2"/>
            <text id="scene2-label-power" x="90" y="70" text-anchor="middle" font-size="14" fill="#000000">电源 U</text>

            <!-- 开关 S (150,80)-(180,80) -->
            <line x1="120" y1="100" x2="150" y2="100" stroke="#000000" stroke-width="2"/>
            <line x1="150" y1="100" x2="180" y2="80" stroke="#000000" stroke-width="2"/>
            <circle cx="150" cy="100" r="3" fill="#000000"/>
            <circle cx="180" cy="80" r="3" fill="#000000"/>
            <text id="scene2-label-s" x="165" y="65" text-anchor="middle" font-size="14" fill="#000000">S</text>

            <!-- 灯泡 L (250,100) -->
            <line x1="180" y1="80" x2="250" y2="100" stroke="#000000" stroke-width="2"/>
            <circle cx="250" cy="100" r="15" fill="none" stroke="#000000" stroke-width="2"/>
            <line x1="240" y1="90" x2="260" y2="110" stroke="#000000" stroke-width="2"/>
            <line x1="260" y1="90" x2="240" y2="110" stroke="#000000" stroke-width="2"/>
            <text id="scene2-label-l" x="285" y="105" font-size="14" fill="#000000">L</text>

            <!-- 导线：灯泡到变阻器右端 -->
            <line x1="250" y1="115" x2="250" y2="280" stroke="#000000" stroke-width="2"/>
            <line x1="250" y1="280" x2="240" y2="280" stroke="#000000" stroke-width="2"/>

            <!-- 滑动变阻器 (60,280)-(240,280) -->
            <rect x="60" y="270" width="180" height="20" fill="none" stroke="#000000" stroke-width="2"/>
            <line x1="60" y1="280" x2="240" y2="280" stroke="#000000" stroke-width="2"/>

            <!-- 滑片 P（可移动） -->
            <g id="scene2-slider-p">
                <polygon points="150,265 157,280 143,280" fill="#000000"/>
                <text id="scene2-label-p" x="150" y="245" text-anchor="middle" font-size="14" fill="#000000">P</text>
            </g>

            <!-- 导线：变阻器左端到电流表 -->
            <line x1="60" y1="280" x2="60" y2="230" stroke="#000000" stroke-width="2"/>

            <!-- 电流表 A (60,200) - 标签移到圆圈内部 -->
            <circle cx="60" cy="200" r="15" fill="none" stroke="#000000" stroke-width="2"/>
            <text x="60" y="205" text-anchor="middle" font-size="16" fill="#000000">A</text>
            <!-- 移除外部标签 scene2-label-a，避免重叠 -->

            <!-- 导线：电流表到电源 -->
            <line x1="60" y1="185" x2="60" y2="100" stroke="#000000" stroke-width="2"/>

            <!-- 电压表 V (90,230) - 并联在变阻器两端，标签移到圆圈内部 -->
            <circle cx="90" cy="230" r="15" fill="none" stroke="#000000" stroke-width="2"/>
            <text x="90" y="235" text-anchor="middle" font-size="16" fill="#000000">V</text>
            <!-- 移除外部标签 scene2-label-v，避免重叠 -->
            <!-- 电压表连线 -->
            <line x1="60" y1="230" x2="75" y2="230" stroke="#000000" stroke-width="2"/>
            <line x1="105" y1="230" x2="150" y2="230" stroke="#000000" stroke-width="2"/>
            <line x1="150" y1="230" x2="150" y2="280" stroke="#000000" stroke-width="2"/>

            <!-- ========== I-R 图（右上区顶部） ========== -->
            <!-- 坐标轴 -->
            <line x1="360" y1="80" x2="740" y2="80" stroke="#888888" stroke-width="1"/>
            <line x1="360" y1="80" x2="360" y2="140" stroke="#888888" stroke-width="1"/>
            <text id="scene2-label-ir-y" x="345" y="75" text-anchor="end" font-size="12" fill="#000000">I/A</text>
            <text id="scene2-label-ir-x" x="745" y="85" font-size="12" fill="#000000">R/Ω</text>
            <text id="scene2-label-ir-0" x="350" y="155" text-anchor="end" font-size="12" fill="#000000">0</text>
            <text id="scene2-label-ir-min" x="365" y="155" font-size="12" fill="#000000">0.2A</text>
            <!-- R_max 和 R_max/2 标签移到 x 轴上方，避免与曲线重叠 -->
            <text id="scene2-label-ir-rmax" x="730" y="70" text-anchor="middle" font-size="12" fill="#000000">R_max</text>
            <text id="scene2-label-ir-rmid" x="545" y="70" text-anchor="middle" font-size="12" fill="#000000">R_max/2</text>

            <!-- I-R 曲线（蓝色，递减） -->
            <path id="scene2-ir-curve" d="M360,140 Q550,110 740,80" fill="none" stroke="#1565c0" stroke-width="2"/>
            <!-- I-R 当前点 -->
            <circle id="scene2-ir-point" cx="740" cy="80" r="4" fill="#1565c0"/>

            <!-- ========== U-R 图（右上区中部） ========== -->
            <!-- 坐标轴 -->
            <line x1="360" y1="190" x2="740" y2="190" stroke="#888888" stroke-width="1"/>
            <line x1="360" y1="190" x2="360" y2="250" stroke="#888888" stroke-width="1"/>
            <text id="scene2-label-ur-y" x="345" y="185" text-anchor="end" font-size="12" fill="#000000">U_V/V</text>
            <text id="scene2-label-ur-0" x="350" y="265" text-anchor="end" font-size="12" fill="#000000">0</text>
            <text id="scene2-label-ur-max" x="745" y="255" font-size="12" fill="#000000">4V</text>

            <!-- U-R 曲线（红色，递增） -->
            <path id="scene2-ur-curve" d="M360,190 Q550,220 740,250" fill="none" stroke="#c62828" stroke-width="2"/>
            <!-- U-R 当前点 -->
            <circle id="scene2-ur-point" cx="740" cy="250" r="4" fill="#c62828"/>

            <!-- ========== P-R 图（右上区底部） ========== -->
            <!-- 坐标轴 -->
            <line x1="360" y1="300" x2="740" y2="300" stroke="#888888" stroke-width="1"/>
            <line x1="360" y1="300" x2="360" y2="360" stroke="#888888" stroke-width="1"/>
            <text id="scene2-label-pr-y" x="345" y="295" text-anchor="end" font-size="12" fill="#000000">P_L/W</text>
            <text id="scene2-label-pr-0" x="350" y="375" text-anchor="end" font-size="12" fill="#000000">0</text>
            <text id="scene2-label-pr-mid" x="550" y="285" text-anchor="middle" font-size="12" fill="#000000">中点</text>

            <!-- P-R 曲线（绿色，抛物线，峰值在中点） -->
            <path id="scene2-pr-curve" d="M360,360 Q455,310 550,300 Q645,310 740,340" fill="none" stroke="#2e7d32" stroke-width="2"/>
            <!-- P-R 峰值点（中点） -->
            <circle cx="550" cy="300" r="4" fill="#000000"/>
            <!-- P-R 当前点 -->
            <circle id="scene2-pr-point" cx="740" cy="340" r="4" fill="#2e7d32"/>

            <!-- ========== 底部滑片拖拽条 ========== -->
            <!-- 轨道 -->
            <rect x="100" y="416" width="600" height="8" fill="#cccccc" rx="4"/>
            <!-- 刻度标记 -->
            <line x1="100" y1="410" x2="100" y2="430" stroke="#888888" stroke-width="1"/>
            <line x1="400" y1="410" x2="400" y2="430" stroke="#888888" stroke-width="1"/>
            <line x1="700" y1="410" x2="700" y2="430" stroke="#888888" stroke-width="1"/>
            <text x="100" y="445" text-anchor="middle" font-size="12" fill="#000000">0</text>
            <text x="400" y="445" text-anchor="middle" font-size="12" fill="#000000">R_max/2</text>
            <text x="700" y="445" text-anchor="middle" font-size="12" fill="#000000">R_max</text>

            <!-- 滑片手柄（可拖拽） -->
            <rect id="scene2-slider-handle" x="690" y="405" width="20" height="30" fill="#1565c0" opacity="0.3" rx="4"/>

            <!-- ========== 实时数值显示（上移到 y=465，避免与按钮重叠） ========== -->
            <text id="scene2-realtime-display" x="400" y="465" text-anchor="middle" font-size="13" fill="#000000">I=0.20A | U_V=4.00V | P_L=0.40W</text>
        </svg>

        <div id="scene2-controls">
            <button id="scene2-btn-init" class="scene2-btn active">初始状态</button>
            <button id="scene2-btn-mid" class="scene2-btn">中点</button>
            <button id="scene2-btn-left" class="scene2-btn">最左端</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2 实现：滑片移动时电路参数变化规律
        // 物理参数：U=6V, R_L=10Ω, R_max=20Ω
        const U = 6;        // 电源电压 6V
        const R_L = 10;     // 灯电阻 10Ω
        const R_max = 20;   // 变阻器最大阻值 20Ω

        // 状态变量：sliderPosition (0-1)，0=最左端 (R=0)，1=最右端 (R=R_max)
        let sliderPosition = 1;  // 初始在最右端

        // DOM 元素
        const sliderP = document.getElementById('scene2-slider-p');
        const sliderHandle = document.getElementById('scene2-slider-handle');
        const labelP = document.getElementById('scene2-label-p');
        const irPoint = document.getElementById('scene2-ir-point');
        const urPoint = document.getElementById('scene2-ur-point');
        const prPoint = document.getElementById('scene2-pr-point');
        const realtimeDisplay = document.getElementById('scene2-realtime-display');

        const btnInit = document.getElementById('scene2-btn-init');
        const btnMid = document.getElementById('scene2-btn-mid');
        const btnLeft = document.getElementById('scene2-btn-left');

        // 更新函数：根据 sliderPosition 更新所有视觉元素
        function updateScene() {
            const R = sliderPosition * R_max;  // 当前变阻器阻值
            const I = U / (R_L + R);           // 当前电流
            const U_V = I * R;                 // 电压表读数
            const P_L = I * I * R_L;           // 灯功率

            // 电路图区：滑片 P 位置 (60 + sliderPosition * 180, 265)
            const circuitSliderX = 60 + sliderPosition * 180;
            sliderP.setAttribute('transform', `translate(${circuitSliderX - 150}, 0)`);
            labelP.setAttribute('x', circuitSliderX);

            // 底部拖拽条：手柄位置 (100 + sliderPosition * 600, 420)
            const handleX = 100 + sliderPosition * 600;
            sliderHandle.setAttribute('x', handleX);

            // 三图当前点 x 坐标 (360 + sliderPosition * 380)
            const graphX = 360 + sliderPosition * 380;

            // I-R 图：y 从 140 (I=0.2A) 到 80 (I=0.6A)
            // I = 0.2 + sliderPosition * 0.4，但实际是反比关系
            // 当 sliderPosition=1, I=0.2, y=140
            // 当 sliderPosition=0, I=0.6, y=80
            const irY = 140 - (I - 0.2) / 0.4 * 60;
            irPoint.setAttribute('cx', graphX);
            irPoint.setAttribute('cy', irY);

            // U-R 图：y 从 190 (U=0V) 到 250 (U=4V)
            // 当 sliderPosition=1, U_V=4, y=250
            // 当 sliderPosition=0, U_V=0, y=190
            const urY = 190 + (U_V / 4) * 60;
            urPoint.setAttribute('cx', graphX);
            urPoint.setAttribute('cy', urY);

            // P-R 图：抛物线，峰值在中点 (sliderPosition=0.5)
            // P_L = I² * R_L = (U/(R_L+R))² * R_L
            // 当 R=0, P=0; 当 R=10, P=0.9W (max); 当 R=20, P=0.4W
            // y 从 360 (P=0) 到 300 (P=0.9W max)
            const P_max = 0.9;
            const prY = 360 - (P_L / P_max) * 60;
            prPoint.setAttribute('cx', graphX);
            prPoint.setAttribute('cy', prY);

            // 实时数值显示
            realtimeDisplay.textContent = `I=${I.toFixed(2)}A | U_V=${U_V.toFixed(2)}V | P_L=${P_L.toFixed(2)}W`;
        }

        // 按钮事件处理
        function setActiveButton(btn) {
            btnInit.classList.remove('active');
            btnMid.classList.remove('active');
            btnLeft.classList.remove('active');
            btn.classList.add('active');
        }

        btnInit.addEventListener('click', function() {
            sliderPosition = 1;  // 最右端
            setActiveButton(btnInit);
            updateScene();
        });

        btnMid.addEventListener('click', function() {
            sliderPosition = 0.5;  // 中点
            setActiveButton(btnMid);
            updateScene();
        });

        btnLeft.addEventListener('click', function() {
            sliderPosition = 0;  // 最左端
            setActiveButton(btnLeft);
            updateScene();
        });

        // 拖拽功能
        let isDragging = false;

        function startDrag(e) {
            isDragging = true;
            handleDrag(e);
        }

        function handleDrag(e) {
            if (!isDragging) return;
            const container = document.getElementById('scene2-container');
            const rect = container.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const x = clientX - rect.left;

            // 限制在拖拽条范围内 (100-700)
            const clampedX = Math.max(100, Math.min(700, x));
            sliderPosition = (clampedX - 100) / 600;

            // 更新按钮状态
            btnInit.classList.remove('active');
            btnMid.classList.remove('active');
            btnLeft.classList.remove('active');

            updateScene();
        }

        function endDrag() {
            isDragging = false;
        }

        // 绑定拖拽事件
        sliderHandle.addEventListener('mousedown', startDrag);
        sliderHandle.addEventListener('touchstart', startDrag);

        document.addEventListener('mousemove', handleDrag);
        document.addEventListener('touchmove', handleDrag);

        document.addEventListener('mouseup', endDrag);
        document.addEventListener('touchend', endDrag);

        // 初始化
        updateScene();
    })();
    </script>
</body>
</html>
