<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金属板电阻网络模型</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }
        .scene1-btn {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #333;
            border-radius: 4px;
            background: #f5f5f5;
        }
        .scene1-btn:hover {
            background: #e0e0e0;
        }
        .scene1-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #scene1-step-indicator {
            font-size: 14px;
            min-width: 80px;
            text-align: center;
        }
        .scene1-fade-in {
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .scene1-visible {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <!-- 总电阻标注 (步骤0显示) -->
            <text id="scene1-label-total" x="400" y="85" text-anchor="middle" 
                  font-size="16px" font-weight="bold" fill="#c62828">R_AB = R</text>
            
            <!-- 引线 (步骤0显示) -->
            <line id="scene1-lead-a" x1="158" y1="250" x2="200" y2="250" 
                  stroke="#000000" stroke-width="2"/>
            <line id="scene1-lead-b" x1="600" y1="250" x2="642" y2="250" 
                  stroke="#000000" stroke-width="2"/>
            
            <!-- 接线柱 (步骤0显示) -->
            <circle id="scene1-terminal-a" cx="150" cy="250" r="4" fill="#1565c0"/>
            <circle id="scene1-terminal-b" cx="650" cy="250" r="4" fill="#1565c0"/>
            
            <!-- 标签 A/B (步骤0显示) -->
            <text id="scene1-label-a" x="130" y="245" text-anchor="end" 
                  font-size="14px" fill="#000000">A</text>
            <text id="scene1-label-b" x="660" y="245" text-anchor="start" 
                  font-size="14px" fill="#000000">B</text>
            
            <!-- 金属板轮廓 (步骤0显示) -->
            <rect id="scene1-metal-plate" x="200" y="115" width="400" height="270" 
                  fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 网格虚线 (步骤1显示) -->
            <g id="scene1-grid-group" class="scene1-fade-in">
                <line id="scene1-grid-v1" x1="333" y1="115" x2="333" y2="385" 
                      stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
                <line id="scene1-grid-v2" x1="467" y1="115" x2="467" y2="385" 
                      stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
                <line id="scene1-grid-h1" x1="200" y1="205" x2="600" y2="205" 
                      stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
                <line id="scene1-grid-h2" x1="200" y1="295" x2="600" y2="295" 
                      stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
            </g>
            
            <!-- 电阻标注 r (步骤2显示) -->
            <g id="scene1-resistor-labels" class="scene1-fade-in">
                <text id="scene1-label-r11" x="267" y="160" text-anchor="middle" 
                      font-size="14px" fill="#000000">r</text>
                <text id="scene1-label-r12" x="400" y="160" text-anchor="middle" 
                      font-size="14px" fill="#000000">r</text>
                <text id="scene1-label-r13" x="533" y="160" text-anchor="middle" 
                      font-size="14px" fill="#000000">r</text>
                <text id="scene1-label-r21" x="267" y="250" text-anchor="middle" 
                      font-size="14px" fill="#000000">r</text>
                <text id="scene1-label-r22" x="400" y="250" text-anchor="middle" 
                      font-size="14px" fill="#000000">r</text>
                <text id="scene1-label-r23" x="533" y="250" text-anchor="middle" 
                      font-size="14px" fill="#000000">r</text>
                <text id="scene1-label-r31" x="267" y="340" text-anchor="middle" 
                      font-size="14px" fill="#000000">r</text>
                <text id="scene1-label-r32" x="400" y="340" text-anchor="middle" 
                      font-size="14px" fill="#000000">r</text>
                <text id="scene1-label-r33" x="533" y="340" text-anchor="middle" 
                      font-size="14px" fill="#000000">r</text>
            </g>
            
            <!-- 电流箭头 (步骤3显示) -->
            <g id="scene1-current-arrow" class="scene1-fade-in">
                <line x1="170" y1="230" x2="610" y2="230" 
                      stroke="#2e7d32" stroke-width="2"/>
                <polygon points="630,230 615,225 615,235" fill="#2e7d32"/>
            </g>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/4</span>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现 - 金属板电阻网络模型
        
        // 状态变量
        let currentStep = 0;
        const totalSteps = 4;
        
        // 各步骤应显示的元素配置
        // 步骤0: 金属板轮廓、接线柱、引线、标签 A/B、总电阻标注
        // 步骤1: + 网格虚线
        // 步骤2: + 电阻标注 r
        // 步骤3: + 电流箭头
        const stepElements = {
            0: ['scene1-metal-plate', 'scene1-terminal-a', 'scene1-terminal-b', 
                'scene1-lead-a', 'scene1-lead-b', 'scene1-label-a', 'scene1-label-b', 
                'scene1-label-total'],
            1: ['scene1-grid-group'],
            2: ['scene1-resistor-labels'],
            3: ['scene1-current-arrow']
        };
        
        // DOM 元素
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        
        // 工具函数：显示元素
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.display = '';
                if (el.classList.contains('scene1-fade-in')) {
                    setTimeout(() => el.classList.add('scene1-visible'), 10);
                }
            }
        }
        
        // 工具函数：隐藏元素
        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene1-visible');
                if (el.classList.contains('scene1-fade-in')) {
                    setTimeout(() => el.style.display = 'none', 300);
                } else {
                    el.style.display = 'none';
                }
            }
        }
        
        // 更新步骤显示
        function updateStep() {
            // 显示当前步骤及之前所有步骤的元素
            for (let step = 0; step < totalSteps; step++) {
                const elements = stepElements[step];
                elements.forEach(id => {
                    if (step <= currentStep) {
                        showElement(id);
                    } else {
                        hideElement(id);
                    }
                });
            }
            
            // 更新步骤指示器
            stepIndicator.textContent = `步骤 ${currentStep + 1}/${totalSteps}`;
            
            // 更新按钮状态
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps - 1;
        }
        
        // 下一步
        function stepForward() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateStep();
            }
        }
        
        // 上一步
        function stepBackward() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        }
        
        // 事件绑定
        btnPrev.addEventListener('click', stepBackward);
        btnNext.addEventListener('click', stepForward);
        
        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
