<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物理连通器系统 - 开关 M 打开前后状态对比</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        .scene1-step-element {
            opacity: 0;
            display: none;
        }
        .scene1-visible {
            opacity: 1;
            display: block;
        }
        .scene1-fade-in {
            animation: scene1FadeIn 0.3s ease-in-out forwards;
        }
        @keyframes scene1FadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene1-arrow-down" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
                    <path d="M0,0 L10,5 L0,10 Z" fill="#c62828"/>
                </marker>
                <marker id="scene1-arrow-up" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
                    <path d="M0,10 L5,5 L0,0 Z" fill="#1565c0"/>
                </marker>
                <marker id="scene1-arrow-down-blue" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
                    <path d="M0,0 L10,5 L0,10 Z" fill="#1565c0"/>
                </marker>
            </defs>

            <!-- 容器轮廓 -->
            <!-- 甲容器 (340,60)-(460,140) -->
            <rect id="scene1-container-jia" x="340" y="60" width="120" height="80" fill="none" stroke="#000000" stroke-width="2"/>
            <!-- 乙容器 (340,200)-(460,280) -->
            <rect id="scene1-container-yi" x="340" y="200" width="120" height="80" fill="none" stroke="#000000" stroke-width="2"/>
            <!-- 丙容器 (340,340)-(460,420) -->
            <rect id="scene1-container-bing" x="340" y="340" width="120" height="80" fill="none" stroke="#000000" stroke-width="2"/>

            <!-- 水区域填充 (20% 透明度蓝色) -->
            <!-- 甲水区域 (340,100)-(460,140) -->
            <rect id="scene1-water-jia" x="340" y="100" width="120" height="40" fill="#1565c0" opacity="0.2"/>
            <!-- 乙水区域 (340,240)-(460,280) -->
            <rect id="scene1-water-yi" x="340" y="240" width="120" height="40" fill="#1565c0" opacity="0.2"/>
            <!-- 丙水区域 (340,380)-(460,420) -->
            <rect id="scene1-water-bing" x="340" y="380" width="120" height="40" fill="#1565c0" opacity="0.2"/>

            <!-- 初始气体区域填充 (15% 透明度灰色) -->
            <!-- 甲气体区 (340,60)-(460,100) -->
            <rect id="scene1-gas-jia" x="340" y="60" width="120" height="40" fill="#888888" opacity="0.15"/>
            <!-- 乙气体区 (340,200)-(460,240) -->
            <rect id="scene1-gas-yi" x="340" y="200" width="120" height="40" fill="#888888" opacity="0.15"/>
            <!-- 丙气体区 (340,340)-(460,380) -->
            <rect id="scene1-gas-bing" x="340" y="340" width="120" height="40" fill="#888888" opacity="0.15"/>

            <!-- 水面虚线 -->
            <!-- 甲水面 (340,100)-(460,100) -->
            <line id="scene1-waterline-jia" x1="340" y1="100" x2="460" y2="100" stroke="#1565c0" stroke-width="2" stroke-dasharray="4,4"/>
            <!-- 乙水面 (340,240)-(460,240) -->
            <line id="scene1-waterline-yi" x1="340" y1="240" x2="460" y2="240" stroke="#1565c0" stroke-width="2" stroke-dasharray="4,4"/>
            <!-- 丙水面 (340,380)-(460,380) -->
            <line id="scene1-waterline-bing" x1="340" y1="380" x2="460" y2="380" stroke="#1565c0" stroke-width="2" stroke-dasharray="4,4"/>

            <!-- 右侧水连通管 (连接甲丙水) -->
            <path id="scene1-pipe-water" d="M460,100 L480,100 L480,380 L460,380" fill="none" stroke="#1565c0" stroke-width="12" stroke-linecap="round"/>

            <!-- 左侧气体连通管 (连接乙丙气体) -->
            <path id="scene1-pipe-gas" d="M340,220 L320,220 L320,360 L340,360" fill="none" stroke="#888888" stroke-width="8" stroke-linecap="round"/>

            <!-- 中间玻璃管 (从甲上方插入乙水中) -->
            <rect id="scene1-glass-tube" x="390" y="40" width="8" height="220" fill="none" stroke="#000000" stroke-width="2"/>

            <!-- 开关 M (圆形，靠近甲水面) -->
            <circle id="scene1-switch-m" cx="394" cy="95" r="5" fill="#888888" stroke="#000000" stroke-width="2"/>

            <!-- 标签 -->
            <!-- 容器标签 -->
            <text id="scene1-label-jia" x="310" y="100" font-size="16" font-weight="bold" fill="#000000" text-anchor="end">甲</text>
            <text id="scene1-label-yi" x="310" y="240" font-size="16" font-weight="bold" fill="#000000" text-anchor="end">乙</text>
            <text id="scene1-label-bing" x="310" y="380" font-size="16" font-weight="bold" fill="#000000" text-anchor="end">丙</text>

            <!-- M 标签 -->
            <text id="scene1-label-m" x="410" y="95" font-size="14" fill="#000000">M</text>

            <!-- 大气压标签 P₀ (调整到 y=35) -->
            <text id="scene1-label-p0" x="370" y="35" font-size="14" fill="#000000">P₀</text>

            <!-- 气体压强标签 -->
            <text id="scene1-label-p-yi" x="470" y="220" font-size="14" fill="#000000">P_乙</text>
            <text id="scene1-label-p-bing" x="470" y="360" font-size="14" fill="#000000">P_丙</text>

            <!-- 步骤 1 元素：水流箭头 (中间玻璃管内，从甲指向乙) -->
            <line id="scene1-water-arrow" x1="394" y1="110" x2="394" y2="230" stroke="#c62828" stroke-width="3" marker-end="url(#scene1-arrow-down)" class="scene1-step-element"/>

            <!-- 步骤 2 元素：水面变化箭头 -->
            <!-- 甲水面变化箭头 (向下) -->
            <line id="scene1-water-change-jia" x1="320" y1="100" x2="320" y2="120" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-down-blue)" class="scene1-step-element"/>
            <!-- 乙水面变化箭头 (向上) -->
            <line id="scene1-water-change-yi" x1="320" y1="240" x2="320" y2="220" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-up)" class="scene1-step-element"/>
            <!-- 丙水面变化箭头 (向下) -->
            <line id="scene1-water-change-bing" x1="320" y1="380" x2="320" y2="400" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-down-blue)" class="scene1-step-element"/>

            <!-- 步骤 3 元素：气体体积变化区域和标签 -->
            <!-- 乙气体变化区 (红色填充，表示体积减小) -->
            <rect id="scene1-gas-change-yi" x="340" y="200" width="120" height="40" fill="#c62828" opacity="0.3" class="scene1-step-element"/>
            <!-- 丙气体变化区 (绿色填充，表示体积增大) -->
            <rect id="scene1-gas-change-bing" x="340" y="340" width="120" height="40" fill="#2e7d32" opacity="0.3" class="scene1-step-element"/>

            <!-- △V 标签 (调整坐标避免与压强标签重叠) -->
            <text id="scene1-label-dv-yi" x="470" y="185" font-size="14" fill="#c62828" font-weight="bold" class="scene1-step-element">△V_乙</text>
            <text id="scene1-label-dv-bing" x="470" y="325" font-size="14" fill="#2e7d32" font-weight="bold" class="scene1-step-element">△V_丙</text>

            <!-- 控件栏 (SVG 内底部) -->
            <g id="scene1-controls">
                <rect x="300" y="450" width="200" height="40" fill="#f5f5f5" stroke="#cccccc" stroke-width="1" rx="5"/>
                <text id="scene1-step-indicator" x="400" y="475" font-size="14" fill="#000000" text-anchor="middle">步骤 1/4</text>
                <rect id="scene1-btn-prev" x="310" y="455" width="70" height="30" fill="#1976d2" rx="5" cursor="pointer"/>
                <text x="345" y="475" font-size="12" fill="#ffffff" text-anchor="middle">◀ 上一步</text>
                <rect id="scene1-btn-next" x="420" y="455" width="70" height="30" fill="#1976d2" rx="5" cursor="pointer"/>
                <text x="455" y="475" font-size="12" fill="#ffffff" text-anchor="middle">下一步 ▶</text>
            </g>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 1 实现：开关 M 打开前后系统状态对比

        // 状态定义
        const steps = {
            0: { // 初始状态
                visible: ['scene1-container-jia', 'scene1-container-yi', 'scene1-container-bing',
                          'scene1-water-jia', 'scene1-water-yi', 'scene1-water-bing',
                          'scene1-gas-jia', 'scene1-gas-yi', 'scene1-gas-bing',
                          'scene1-waterline-jia', 'scene1-waterline-yi', 'scene1-waterline-bing',
                          'scene1-pipe-water', 'scene1-pipe-gas', 'scene1-glass-tube',
                          'scene1-switch-m', 'scene1-label-jia', 'scene1-label-yi', 'scene1-label-bing',
                          'scene1-label-m', 'scene1-label-p0', 'scene1-label-p-yi', 'scene1-label-p-bing'],
                hidden: ['scene1-water-arrow', 'scene1-water-change-jia', 'scene1-water-change-yi',
                         'scene1-water-change-bing', 'scene1-gas-change-yi', 'scene1-gas-change-bing',
                         'scene1-label-dv-yi', 'scene1-label-dv-bing']
            },
            1: { // 开关 M 高亮，显示水流箭头
                visible: ['scene1-container-jia', 'scene1-container-yi', 'scene1-container-bing',
                          'scene1-water-jia', 'scene1-water-yi', 'scene1-water-bing',
                          'scene1-gas-jia', 'scene1-gas-yi', 'scene1-gas-bing',
                          'scene1-waterline-jia', 'scene1-waterline-yi', 'scene1-waterline-bing',
                          'scene1-pipe-water', 'scene1-pipe-gas', 'scene1-glass-tube',
                          'scene1-switch-m', 'scene1-label-jia', 'scene1-label-yi', 'scene1-label-bing',
                          'scene1-label-m', 'scene1-label-p0', 'scene1-label-p-yi', 'scene1-label-p-bing',
                          'scene1-water-arrow'],
                hidden: ['scene1-water-change-jia', 'scene1-water-change-yi',
                         'scene1-water-change-bing', 'scene1-gas-change-yi', 'scene1-gas-change-bing',
                         'scene1-label-dv-yi', 'scene1-label-dv-bing']
            },
            2: { // 显示水面变化箭头
                visible: ['scene1-container-jia', 'scene1-container-yi', 'scene1-container-bing',
                          'scene1-water-jia', 'scene1-water-yi', 'scene1-water-bing',
                          'scene1-gas-jia', 'scene1-gas-yi', 'scene1-gas-bing',
                          'scene1-waterline-jia', 'scene1-waterline-yi', 'scene1-waterline-bing',
                          'scene1-pipe-water', 'scene1-pipe-gas', 'scene1-glass-tube',
                          'scene1-switch-m', 'scene1-label-jia', 'scene1-label-yi', 'scene1-label-bing',
                          'scene1-label-m', 'scene1-label-p0', 'scene1-label-p-yi', 'scene1-label-p-bing',
                          'scene1-water-arrow', 'scene1-water-change-jia', 'scene1-water-change-yi',
                          'scene1-water-change-bing'],
                hidden: ['scene1-gas-change-yi', 'scene1-gas-change-bing',
                         'scene1-label-dv-yi', 'scene1-label-dv-bing']
            },
            3: { // 显示气体体积变化
                visible: ['scene1-container-jia', 'scene1-container-yi', 'scene1-container-bing',
                          'scene1-water-jia', 'scene1-water-yi', 'scene1-water-bing',
                          'scene1-gas-jia', 'scene1-gas-yi', 'scene1-gas-bing',
                          'scene1-waterline-jia', 'scene1-waterline-yi', 'scene1-waterline-bing',
                          'scene1-pipe-water', 'scene1-pipe-gas', 'scene1-glass-tube',
                          'scene1-switch-m', 'scene1-label-jia', 'scene1-label-yi', 'scene1-label-bing',
                          'scene1-label-m', 'scene1-label-p0', 'scene1-label-p-yi', 'scene1-label-p-bing',
                          'scene1-water-arrow', 'scene1-water-change-jia', 'scene1-water-change-yi',
                          'scene1-water-change-bing', 'scene1-gas-change-yi', 'scene1-gas-change-bing',
                          'scene1-label-dv-yi', 'scene1-label-dv-bing'],
                hidden: []
            }
        };

        let currentState = 0;
        const totalSteps = 4;

        // 工具函数：显示元素
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.add('scene1-visible');
                el.classList.add('scene1-fade-in');
            }
        }

        // 工具函数：隐藏元素
        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene1-visible');
                el.classList.remove('scene1-fade-in');
            }
        }

        // 更新步骤显示
        function updateStep() {
            const step = steps[currentState];
            
            // 显示当前步骤应有的元素
            step.visible.forEach(id => showElement(id));
            
            // 隐藏当前步骤不应显示的元素
            step.hidden.forEach(id => hideElement(id));

            // 更新步骤指示器
            const indicator = document.getElementById('scene1-step-indicator');
            if (indicator) {
                indicator.textContent = `步骤 ${currentState + 1}/${totalSteps}`;
            }

            // 开关 M 高亮处理（步骤 1 及以后）
            const switchM = document.getElementById('scene1-switch-m');
            if (switchM) {
                if (currentState >= 1) {
                    switchM.setAttribute('fill', '#c62828');
                } else {
                    switchM.setAttribute('fill', '#888888');
                }
            }

            // 更新按钮状态
            updateButtons();
        }

        // 更新按钮状态
        function updateButtons() {
            const btnPrev = document.getElementById('scene1-btn-prev');
            const btnNext = document.getElementById('scene1-btn-next');
            
            if (btnPrev) {
                btnPrev.style.opacity = currentState === 0 ? '0.5' : '1';
                btnPrev.style.cursor = currentState === 0 ? 'not-allowed' : 'pointer';
            }
            if (btnNext) {
                btnNext.style.opacity = currentState === totalSteps - 1 ? '0.5' : '1';
                btnNext.style.cursor = currentState === totalSteps - 1 ? 'not-allowed' : 'pointer';
            }
        }

        // 按钮点击事件
        function handlePrevClick() {
            if (currentState > 0) {
                currentState--;
                updateStep();
            }
        }

        function handleNextClick() {
            if (currentState < totalSteps - 1) {
                currentState++;
                updateStep();
            }
        }

        // 绑定按钮事件
        document.getElementById('scene1-btn-prev').addEventListener('click', handlePrevClick);
        document.getElementById('scene1-btn-next').addEventListener('click', handleNextClick);

        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
