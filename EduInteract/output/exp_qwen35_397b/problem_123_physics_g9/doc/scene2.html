<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>压强关系分析图</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-svg { width: 800px; height: 500px; }
        .scene2-container-rect { fill: #ffffff; stroke: #000000; stroke-width: 2; }
        .scene2-water-line { stroke: #1565c0; stroke-width: 2; }
        .scene2-tube { stroke: #000000; stroke-width: 2; fill: none; }
        .scene2-tube-middle { stroke: #9e9e9e; stroke-width: 2; }
        .scene2-tube-middle.highlight { stroke: #c62828; stroke-width: 3; }
        .scene2-valve { fill: #000000; }
        .scene2-valve.highlight { fill: #c62828; }
        .scene2-pressure-box { fill: #e3f2fd; stroke: #1565c0; stroke-width: 2; }
        .scene2-formula-box { fill: #ffffff; stroke: #000000; stroke-width: 2; }
        .scene2-arrow { stroke: #c62828; stroke-width: 2; fill: none; }
        .scene2-arrow-head { fill: #c62828; }
        .scene2-bar-vb { fill: #c62828; }
        .scene2-bar-vc { fill: #2e7d32; }
        .scene2-option { fill: #000000; font-size: 14px; }
        .scene2-option.highlight { fill: #2e7d32; font-weight: bold; }
        .scene2-option.disabled { fill: #888888; }
        .scene2-label { fill: #000000; font-size: 16px; font-weight: bold; }
        .scene2-label-small { fill: #000000; font-size: 14px; }
        .scene2-delta-label { fill: #c62828; font-size: 14px; }
        .scene2-hidden { display: none; opacity: 0; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene2-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #333; border-radius: 4px; background: #f5f5f5; }
        .scene2-btn:hover { background: #e0e0e0; }
        .scene2-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene2-step-indicator { position: absolute; bottom: 50px; right: 80px; font-size: 14px; color: #666; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500">
            <rect id="scene2-container-a" x="50" y="30" width="200" height="70" class="scene2-container-rect"/>
            <rect id="scene2-container-b" x="50" y="130" width="200" height="70" class="scene2-container-rect"/>
            <rect id="scene2-container-c" x="50" y="230" width="200" height="70" class="scene2-container-rect"/>
            <line id="scene2-water-a" x1="60" y1="60" x2="240" y2="60" class="scene2-water-line"/>
            <line id="scene2-water-b" x1="60" y1="160" x2="240" y2="160" class="scene2-water-line"/>
            <line id="scene2-water-c" x1="60" y1="260" x2="240" y2="260" class="scene2-water-line"/>
            <path id="scene2-tube-right" d="M 250 60 L 280 60 L 280 260 L 250 260" class="scene2-tube"/>
            <path id="scene2-tube-left" d="M 50 160 L 20 160 L 20 260 L 50 260" class="scene2-tube"/>
            <line id="scene2-tube-middle" x1="150" y1="60" x2="150" y2="160" class="scene2-tube-middle"/>
            <circle id="scene2-valve-m" cx="150" cy="55" r="4" class="scene2-valve"/>
            <text id="scene2-label-a" x="35" y="65" class="scene2-label">甲</text>
            <text id="scene2-label-b" x="35" y="165" class="scene2-label">乙</text>
            <text id="scene2-label-c" x="35" y="265" class="scene2-label">丙</text>
            <text id="scene2-label-m" x="162" y="52" class="scene2-label-small">M</text>
            <text id="scene2-label-p0" x="260" y="50" class="scene2-label-small">P0</text>
            <rect id="scene2-pressure-box" x="270" y="120" width="180" height="30" class="scene2-pressure-box"/>
            <text id="scene2-pressure-text" x="280" y="140" class="scene2-label-small">P_乙 = P_丙 = P &gt; P0</text>
            <rect id="scene2-formula-box" x="270" y="160" width="230" height="30" class="scene2-formula-box"/>
            <text id="scene2-formula-text" x="280" y="180" class="scene2-label-small">P = P0 + pgh</text>
            <g id="scene2-delta-h-b-group" class="scene2-hidden">
                <line x1="200" y1="130" x2="200" y2="150" class="scene2-arrow"/>
                <line x1="195" y1="130" x2="200" y2="135" class="scene2-arrow"/>
                <line x1="205" y1="130" x2="200" y2="135" class="scene2-arrow"/>
                <line x1="195" y1="150" x2="200" y2="145" class="scene2-arrow"/>
                <line x1="205" y1="150" x2="200" y2="145" class="scene2-arrow"/>
                <text x="210" y="145" class="scene2-delta-label">△h_乙</text>
            </g>
            <g id="scene2-delta-h-c-group" class="scene2-hidden">
                <line x1="200" y1="240" x2="200" y2="260" class="scene2-arrow"/>
                <line x1="195" y1="240" x2="200" y2="245" class="scene2-arrow"/>
                <line x1="205" y1="240" x2="200" y2="245" class="scene2-arrow"/>
                <line x1="195" y1="260" x2="200" y2="255" class="scene2-arrow"/>
                <line x1="205" y1="260" x2="200" y2="255" class="scene2-arrow"/>
                <text x="210" y="255" class="scene2-delta-label">△h_丙</text>
            </g>
            <g id="scene2-flow-arrow" class="scene2-hidden">
                <line x1="150" y1="100" x2="150" y2="140" class="scene2-arrow"/>
                <polygon points="145,135 150,145 155,135" class="scene2-arrow-head"/>
                <text x="160" y="125" class="scene2-label-small" fill="#c62828">水流动</text>
            </g>
            <g id="scene2-pressure-diff" class="scene2-hidden">
                <text x="270" y="200" class="scene2-label-small" fill="#c62828">P_M = P0 + pgh_甲 &gt; P_乙</text>
            </g>
            <g id="scene2-bar-chart" class="scene2-hidden">
                <rect x="480" y="320" width="300" height="70" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
                <text x="490" y="340" class="scene2-label-small">体积变化对比</text>
                <rect id="scene2-bar-vb" x="520" y="350" width="100" height="30" class="scene2-bar-vb"/>
                <text x="540" y="370" class="scene2-label-small" fill="#c62828">△V_乙</text>
                <rect id="scene2-bar-vc" x="520" y="385" width="60" height="30" class="scene2-bar-vc"/>
                <text x="540" y="405" class="scene2-label-small" fill="#2e7d32">△V_丙</text>
                <text x="640" y="375" class="scene2-label-small" fill="#c62828" font-weight="bold">△V_乙 &gt; △V_丙</text>
            </g>
            <g id="scene2-options">
                <text id="scene2-option-a" x="50" y="440" class="scene2-option">A、V_乙增大，V_丙减少，且△V_乙&gt;△V_丙</text>
                <text id="scene2-option-b" x="50" y="460" class="scene2-option">B、V_乙减少，V_丙增大，且△V_乙&gt;△V_丙</text>
                <text id="scene2-option-c" x="400" y="440" class="scene2-option">C、V_乙增大，V_丙减少，且△V_乙=△V_丙</text>
                <text id="scene2-option-d" x="400" y="460" class="scene2-option">D、V_乙减少，V_丙增大，且△V_乙&lt;△V_丙</text>
            </g>
        </svg>
        <div id="scene2-step-indicator">步骤 1/4</div>
        <div id="scene2-controls">
            <button id="scene2-btn-prev" class="scene2-btn" disabled>◀ 上一步</button>
            <button id="scene2-btn-next" class="scene2-btn">下一步 ▶</button>
        </div>
    </div>
    <script>
    (function() {
        let currentStep = 0;
        const totalSteps = 4;
        const tubeMiddle = document.getElementById('scene2-tube-middle');
        const valveM = document.getElementById('scene2-valve-m');
        const flowArrow = document.getElementById('scene2-flow-arrow');
        const pressureDiff = document.getElementById('scene2-pressure-diff');
        const deltaHbGroup = document.getElementById('scene2-delta-h-b-group');
        const deltaHcGroup = document.getElementById('scene2-delta-h-c-group');
        const barChart = document.getElementById('scene2-bar-chart');
        const optionA = document.getElementById('scene2-option-a');
        const optionB = document.getElementById('scene2-option-b');
        const optionC = document.getElementById('scene2-option-c');
        const optionD = document.getElementById('scene2-option-d');
        const stepIndicator = document.getElementById('scene2-step-indicator');
        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        function show(el) { el.classList.remove('scene2-hidden'); el.style.display = ''; el.style.opacity = '1'; }
        function hide(el) { el.classList.add('scene2-hidden'); el.style.display = 'none'; el.style.opacity = '0'; }
        function updateState() {
            tubeMiddle.classList.remove('highlight');
            valveM.classList.remove('highlight');
            hide(flowArrow);
            hide(pressureDiff);
            hide(deltaHbGroup);
            hide(deltaHcGroup);
            hide(barChart);
            optionA.classList.remove('highlight', 'disabled');
            optionB.classList.remove('highlight', 'disabled');
            optionC.classList.remove('highlight', 'disabled');
            optionD.classList.remove('highlight', 'disabled');
            switch(currentStep) {
                case 0:
                    stepIndicator.textContent = '步骤 1/4';
                    btnPrev.disabled = true;
                    btnNext.disabled = false;
                    break;
                case 1:
                    tubeMiddle.classList.add('highlight');
                    valveM.classList.add('highlight');
                    show(flowArrow);
                    show(pressureDiff);
                    stepIndicator.textContent = '步骤 2/4';
                    btnPrev.disabled = false;
                    btnNext.disabled = false;
                    break;
                case 2:
                    show(flowArrow);
                    show(pressureDiff);
                    show(deltaHbGroup);
                    show(deltaHcGroup);
                    stepIndicator.textContent = '步骤 3/4';
                    btnPrev.disabled = false;
                    btnNext.disabled = false;
                    break;
                case 3:
                    show(deltaHbGroup);
                    show(deltaHcGroup);
                    show(barChart);
                    optionB.classList.add('highlight');
                    optionA.classList.add('disabled');
                    optionC.classList.add('disabled');
                    optionD.classList.add('disabled');
                    stepIndicator.textContent = '步骤 4/4';
                    btnPrev.disabled = false;
                    btnNext.disabled = true;
                    break;
            }
        }
        btnPrev.addEventListener('click', function() { if (currentStep > 0) { currentStep--; updateState(); } });
        btnNext.addEventListener('click', function() { if (currentStep < totalSteps - 1) { currentStep++; updateState(); } });
        updateState();
    })();
    </script>
</body>
</html>
