<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电磁铁与永磁体磁极判断</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 12px;
            z-index: 10;
        }
        .scene1-btn {
            padding: 8px 20px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .scene1-btn-primary {
            background: #1976d2;
            color: white;
        }
        .scene1-btn-primary:hover:not(:disabled) {
            background: #1565c0;
        }
        .scene1-btn:disabled {
            background: #bdbdbd;
            cursor: not-allowed;
        }
        .scene1-step-indicator {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: #666;
        }
        /* 步骤元素显隐控制 */
        .scene1-step-element {
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .scene1-step-element.visible {
            opacity: 1;
        }
        .scene1-hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#000000" />
                </marker>
                <marker id="scene1-arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#c62828" />
                </marker>
                <marker id="scene1-arrowhead-mag" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#000000" />
                </marker>
            </defs>

            <!-- ========== 步骤 0：基础图（始终显示）========== -->
            <g id="scene1-step0">
                <!-- 电磁铁铁芯 -->
                <rect id="scene1-iron-core" x="120" y="200" width="260" height="40" fill="#e0e0e0" stroke="#000000" stroke-width="2" />
                
                <!-- 电磁铁线圈（5 匝） -->
                <path id="scene1-coil" d="M 130 220 L 130 180 L 145 180 L 145 220 L 160 220 L 160 180 L 175 180 L 175 220 L 190 220 L 190 180 L 205 180 L 205 220 L 220 220 L 220 180 L 235 180 L 235 220 L 250 220 L 250 180 L 265 180 L 265 220 L 280 220 L 280 180 L 295 180 L 295 220 L 310 220 L 310 180 L 325 180 L 325 220 L 340 220 L 340 180 L 355 180 L 355 220 L 370 220" 
                      fill="none" stroke="#000000" stroke-width="3" />
                
                <!-- 永磁体乙 -->
                <rect id="scene1-magnet" x="520" y="200" width="200" height="40" fill="#e0e0e0" stroke="#000000" stroke-width="2" />
                
                <!-- 磁感线（b、c 之间向外发散） -->
                <path id="scene1-mag-line1" d="M 390 210 Q 430 190 450 170" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrowhead-mag)" />
                <path id="scene1-mag-line2" d="M 390 220 Q 430 220 450 210" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrowhead-mag)" />
                <path id="scene1-mag-line3" d="M 390 230 Q 430 250 450 270" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrowhead-mag)" />
                <path id="scene1-mag-line4" d="M 510 210 Q 470 190 450 170" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrowhead-mag)" />
                <path id="scene1-mag-line5" d="M 510 220 Q 470 220 450 210" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrowhead-mag)" />
                <path id="scene1-mag-line6" d="M 510 230 Q 470 250 450 270" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrowhead-mag)" />
                
                <!-- 导线连接 -->
                <path id="scene1-wire1" d="M 130 220 L 130 280 L 160 280" fill="none" stroke="#000000" stroke-width="2" />
                <path id="scene1-wire2" d="M 370 220 L 370 280 L 340 280" fill="none" stroke="#000000" stroke-width="2" />
                
                <!-- 电源符号 -->
                <g id="scene1-power">
                    <line x1="200" y1="280" x2="200" y2="300" stroke="#000000" stroke-width="2" />
                    <line x1="185" y1="300" x2="215" y2="300" stroke="#000000" stroke-width="2" />
                    <line x1="200" y1="310" x2="200" y2="320" stroke="#000000" stroke-width="3" />
                    <line x1="190" y1="320" x2="210" y2="320" stroke="#000000" stroke-width="2" />
                </g>
                
                <!-- 开关符号（断开状态） -->
                <g id="scene1-switch">
                    <circle cx="240" cy="300" r="3" fill="#000000" />
                    <circle cx="260" cy="300" r="3" fill="#000000" />
                    <line x1="240" y1="300" x2="255" y2="285" stroke="#000000" stroke-width="2" />
                </g>
                
                <!-- 导线连接开关到电源 -->
                <path id="scene1-wire3" d="M 160 280 L 240 280 L 240 300" fill="none" stroke="#000000" stroke-width="2" />
                <path id="scene1-wire4" d="M 260 300 L 280 300 L 280 280 L 340 280" fill="none" stroke="#000000" stroke-width="2" />
                
                <!-- 端点标签 -->
                <text id="scene1-label-a" x="105" y="195" font-size="16" fill="#000000" text-anchor="middle">a</text>
                <text id="scene1-label-b" x="395" y="195" font-size="16" fill="#000000" text-anchor="middle">b</text>
                <text id="scene1-label-c" x="505" y="195" font-size="16" fill="#000000" text-anchor="middle">c</text>
                <text id="scene1-label-d" x="735" y="195" font-size="16" fill="#000000" text-anchor="middle">d</text>
                
                <!-- 甲、乙标签 -->
                <text id="scene1-label-jia" x="250" y="350" font-size="16" fill="#000000" text-anchor="middle">甲</text>
                <text id="scene1-label-yi" x="620" y="260" font-size="16" fill="#000000" text-anchor="middle">乙</text>
            </g>

            <!-- ========== 步骤 1：电流方向 ========== -->
            <g id="scene1-step1" class="scene1-step-element">
                <!-- 电源正负极标注 -->
                <text id="scene1-power-plus" x="200" y="275" font-size="16" fill="#c62828" text-anchor="middle" font-weight="bold">+</text>
                <text id="scene1-power-minus" x="180" y="275" font-size="16" fill="#1565c0" text-anchor="middle" font-weight="bold">−</text>
                
                <!-- 电流方向箭头（红色） -->
                <!-- 从正极出发，经开关，流入线圈右端 -->
                <path id="scene1-current-arrow1" d="M 200 315 L 200 330" fill="none" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrowhead-red)" />
                <path id="scene1-current-arrow2" d="M 220 300 L 235 300" fill="none" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrowhead-red)" />
                <path id="scene1-current-arrow3" d="M 265 300 L 280 300" fill="none" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrowhead-red)" />
                <path id="scene1-current-arrow4" d="M 350 280 L 365 280" fill="none" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrowhead-red)" />
                <path id="scene1-current-arrow5" d="M 370 250 L 370 230" fill="none" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrowhead-red)" />
                
                <!-- 线圈上的电流方向箭头 -->
                <path id="scene1-coil-arrow1" d="M 355 200 L 355 185" fill="none" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrowhead-red)" />
                <path id="scene1-coil-arrow2" d="M 325 200 L 325 185" fill="none" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrowhead-red)" />
                <path id="scene1-coil-arrow3" d="M 295 200 L 295 185" fill="none" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrowhead-red)" />
                
                <!-- 流出端箭头 -->
                <path id="scene1-current-out1" d="M 130 250 L 130 270" fill="none" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrowhead-red)" />
                <path id="scene1-current-out2" d="M 150 280 L 170 280" fill="none" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrowhead-red)" />
            </g>

            <!-- ========== 步骤 2：安培定则判断电磁铁磁极 ========== -->
            <g id="scene1-step2" class="scene1-step-element">
                <!-- 右手螺旋定则示意图 -->
                <g id="scene1-right-hand">
                    <!-- 手掌轮廓 -->
                    <ellipse cx="250" cy="400" rx="60" ry="40" fill="#f5f5f5" stroke="#888888" stroke-width="2" />
                    <!-- 四指弯曲方向 -->
                    <path d="M 220 390 Q 240 380 260 390" fill="none" stroke="#888888" stroke-width="2" />
                    <path d="M 225 400 Q 245 390 265 400" fill="none" stroke="#888888" stroke-width="2" />
                    <path d="M 230 410 Q 250 400 270 410" fill="none" stroke="#888888" stroke-width="2" />
                    <!-- 大拇指（指向 b 端/N 极） -->
                    <path id="scene1-thumb" d="M 280 400 L 340 400 L 340 390 L 350 400 L 340 410 L 340 400 Z" fill="#c62828" />
                    <!-- 大拇指箭头 -->
                    <polygon points="340,400 360,395 360,405" fill="#c62828" />
                </g>
                
                <!-- 电磁铁磁极标注 -->
                <text id="scene1-pole-a" x="105" y="170" font-size="20" fill="#1565c0" text-anchor="middle" font-weight="bold">S</text>
                <text id="scene1-pole-b" x="395" y="170" font-size="20" fill="#c62828" text-anchor="middle" font-weight="bold">N</text>
                
                <!-- 安培定则说明 -->
                <text id="scene1-ampere-law" x="250" y="440" font-size="13" fill="#666" text-anchor="middle">安培定则：右手握住螺线管，四指指向电流方向，大拇指指向 N 极</text>
            </g>

            <!-- ========== 步骤 3：分析磁感线特征 ========== -->
            <g id="scene1-step3" class="scene1-step-element">
                <!-- 高亮磁感线（加粗变色） -->
                <path id="scene1-mag-highlight1" d="M 390 210 Q 430 190 450 170" fill="none" stroke="#c62828" stroke-width="3" marker-end="url(#scene1-arrowhead-red)" opacity="0.7" />
                <path id="scene1-mag-highlight2" d="M 510 210 Q 470 190 450 170" fill="none" stroke="#1565c0" stroke-width="3" marker-end="url(#scene1-arrowhead-red)" opacity="0.7" />
                
                <!-- 磁感线标签 -->
                <text id="scene1-mag-label" x="450" y="160" font-size="14" fill="#000000" text-anchor="middle">磁感线</text>
                
                <!-- 排斥说明 -->
                <text id="scene1-repel-text" x="450" y="290" font-size="14" fill="#c62828" text-anchor="middle" font-weight="bold">同名磁极相互排斥</text>
                
                <!-- 磁感线向外发散箭头 -->
                <path id="scene1-diverge-arrow1" d="M 430 200 L 460 200" fill="none" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrowhead-red)" />
                <path id="scene1-diverge-arrow2" d="M 470 200 L 440 200" fill="none" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrowhead-red)" />
            </g>

            <!-- ========== 步骤 4：完整结论 ========== -->
            <g id="scene1-step4" class="scene1-step-element">
                <!-- 永磁体磁极标注 -->
                <text id="scene1-pole-c" x="505" y="170" font-size="20" fill="#c62828" text-anchor="middle" font-weight="bold">N</text>
                <text id="scene1-pole-d" x="735" y="170" font-size="20" fill="#1565c0" text-anchor="middle" font-weight="bold">S</text>
                
                <!-- 结论文字 -->
                <text id="scene1-conclusion" x="450" y="330" font-size="14" fill="#000000" text-anchor="middle">a 端：S 极  |  b 端：N 极  |  c 端：N 极  |  d 端：S 极</text>
                
                <!-- 选项 C 高亮 -->
                <rect id="scene1-option-c-bg" x="280" y="355" width="340" height="35" fill="#2e7d32" opacity="0.3" rx="5" />
                <text id="scene1-option-c" x="450" y="378" font-size="15" fill="#2e7d32" text-anchor="middle" font-weight="bold">C、b、c 两端都是 N 极</text>
            </g>

            <!-- ========== 控件栏（在 SVG 内部底部）========== -->
            <g id="scene1-controls-group">
                <rect x="260" y="465" width="280" height="30" fill="#f5f5f5" stroke="#ddd" rx="5" />
                <text id="scene1-step-indicator" x="400" y="485" font-size="13" fill="#666" text-anchor="middle">步骤 0/4</text>
            </g>
        </svg>

        <!-- HTML 按钮控件（叠在 SVG 底部） -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn scene1-btn-primary" disabled>◀ 上一步</button>
            <button id="scene1-btn-next" class="scene1-btn scene1-btn-primary">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现：电磁铁与永磁体磁极判断
        
        // 状态管理
        let currentState = 0;
        const totalSteps = 4;
        
        // DOM 元素
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        
        // 步骤元素组
        const stepElements = {
            1: document.getElementById('scene1-step1'),
            2: document.getElementById('scene1-step2'),
            3: document.getElementById('scene1-step3'),
            4: document.getElementById('scene1-step4')
        };
        
        // 显示/隐藏工具函数
        function showElement(el) {
            if (el) {
                el.classList.add('visible');
                el.classList.remove('scene1-hidden');
            }
        }
        
        function hideElement(el) {
            if (el) {
                el.classList.remove('visible');
                el.classList.add('scene1-hidden');
            }
        }
        
        // 更新状态显示
        function updateState() {
            // 更新步骤指示器
            stepIndicator.textContent = '步骤 ' + currentState + '/' + totalSteps;
            
            // 更新按钮状态
            btnPrev.disabled = (currentState === 0);
            btnNext.disabled = (currentState === totalSteps);
            btnNext.textContent = (currentState === totalSteps) ? '完成' : '下一步 ▶';
            
            // 控制各步骤元素的显隐
            for (let step = 1; step <= totalSteps; step++) {
                if (step <= currentState) {
                    showElement(stepElements[step]);
                } else {
                    hideElement(stepElements[step]);
                }
            }
        }
        
        // 事件绑定
        btnPrev.addEventListener('click', function() {
            if (currentState > 0) {
                currentState--;
                updateState();
            }
        });
        
        btnNext.addEventListener('click', function() {
            if (currentState < totalSteps) {
                currentState++;
                updateState();
            }
        });
        
        // 初始化
        updateState();
        
    })();
    </script>
</body>
</html>
