<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>凸透镜成像规律 - 三种应用对比</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        .scene3-btn { cursor: pointer; border: 2px solid #888; border-radius: 6px; padding: 8px 16px; font-size: 14px; transition: all 0.2s; }
        .scene3-btn-inactive { fill: #e0e0e0; color: #333; }
        .scene3-btn-active { fill: #1565c0; color: #fff; border-color: #1565c0; }
        .scene3-hidden { display: none; opacity: 0; }
        .scene3-visible { display: block; opacity: 1; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg width="800" height="500" viewBox="0 0 800 500">
            <!-- 主光轴 -->
            <line id="scene3-optical-axis" x1="80" y1="280" x2="720" y2="280" stroke="#000000" stroke-width="3"/>
            
            <!-- 凸透镜 -->
            <ellipse id="scene3-lens" cx="400" cy="280" rx="15" ry="60" fill="none" stroke="#000000" stroke-width="3"/>
            
            <!-- 左焦点 F -->
            <circle id="scene3-focal-left-f" cx="320" cy="280" r="4" fill="#000000"/>
            <text id="scene3-label-f-left" x="315" y="320" font-size="14" fill="#000000">F</text>
            
            <!-- 左 2F 点 -->
            <circle id="scene3-focal-left-2f" cx="240" cy="280" r="4" fill="#000000"/>
            <text id="scene3-label-2f-left" x="235" y="320" font-size="14" fill="#000000">2F</text>
            
            <!-- 右焦点 F -->
            <circle id="scene3-focal-right-f" cx="480" cy="280" r="4" fill="#000000"/>
            <text id="scene3-label-f-right" x="475" y="320" font-size="14" fill="#000000">F</text>
            
            <!-- 右 2F 点 -->
            <circle id="scene3-focal-right-2f" cx="560" cy="280" r="4" fill="#000000"/>
            <text id="scene3-label-2f-right" x="555" y="320" font-size="14" fill="#000000">2F</text>
            
            <!-- 应用图标区域 -->
            <g id="scene3-app-icon-group">
                <!-- 照相机图标 -->
                <g id="scene3-app-camera" class="scene3-visible">
                    <rect x="350" y="60" width="80" height="50" fill="none" stroke="#1565c0" stroke-width="2"/>
                    <circle cx="390" cy="85" r="15" fill="#1565c0" opacity="0.3"/>
                    <rect x="370" y="50" width="40" height="15" fill="#1565c0"/>
                    <text x="360" y="130" font-size="16" fill="#1565c0" text-anchor="middle">照相机</text>
                </g>
                <!-- 投影仪图标 -->
                <g id="scene3-app-projector" class="scene3-hidden">
                    <rect x="350" y="60" width="70" height="45" fill="none" stroke="#2e7d32" stroke-width="2"/>
                    <polygon points="355,105 415,105 425,85 345,85" fill="#2e7d32" opacity="0.3"/>
                    <text x="360" y="130" font-size="16" fill="#2e7d32" text-anchor="middle">投影仪</text>
                </g>
                <!-- 放大镜图标 -->
                <g id="scene3-app-magnifier" class="scene3-hidden">
                    <circle cx="380" cy="80" r="25" fill="none" stroke="#c62828" stroke-width="3"/>
                    <line x1="398" y1="98" x2="420" y2="120" stroke="#c62828" stroke-width="3"/>
                    <text x="360" y="130" font-size="16" fill="#c62828" text-anchor="middle">放大镜</text>
                </g>
            </g>
            
            <!-- 参数表格 -->
            <g id="scene3-param-table-group">
                <!-- 照相机表格 -->
                <g id="scene3-table-camera" class="scene3-visible">
                    <rect x="100" y="160" width="600" height="80" fill="#ffffff" stroke="#888888" stroke-width="1"/>
                    <line x1="250" y1="160" x2="250" y2="240" stroke="#888888" stroke-width="1"/>
                    <line x1="400" y1="160" x2="400" y2="240" stroke="#888888" stroke-width="1"/>
                    <line x1="550" y1="160" x2="550" y2="240" stroke="#888888" stroke-width="1"/>
                    <text x="175" y="180" font-size="13" fill="#000000" text-anchor="middle">物距</text>
                    <text x="175" y="215" font-size="13" fill="#000000" text-anchor="middle">u&gt;2f</text>
                    <text x="325" y="180" font-size="13" fill="#000000" text-anchor="middle">像距</text>
                    <text x="325" y="215" font-size="13" fill="#000000" text-anchor="middle">f&lt;v&lt;2f</text>
                    <text x="475" y="180" font-size="13" fill="#000000" text-anchor="middle">像性质</text>
                    <text x="475" y="215" font-size="13" fill="#000000" text-anchor="middle">倒立缩小实像</text>
                    <text x="625" y="180" font-size="13" fill="#000000" text-anchor="middle">应用</text>
                    <text x="625" y="215" font-size="13" fill="#1565c0" text-anchor="middle">照相机</text>
                </g>
                <!-- 投影仪表格 -->
                <g id="scene3-table-projector" class="scene3-hidden">
                    <rect x="100" y="160" width="600" height="80" fill="#ffffff" stroke="#888888" stroke-width="1"/>
                    <line x1="250" y1="160" x2="250" y2="240" stroke="#888888" stroke-width="1"/>
                    <line x1="400" y1="160" x2="400" y2="240" stroke="#888888" stroke-width="1"/>
                    <line x1="550" y1="160" x2="550" y2="240" stroke="#888888" stroke-width="1"/>
                    <text x="175" y="180" font-size="13" fill="#000000" text-anchor="middle">物距</text>
                    <text x="175" y="215" font-size="13" fill="#000000" text-anchor="middle">f&lt;u&lt;2f</text>
                    <text x="325" y="180" font-size="13" fill="#000000" text-anchor="middle">像距</text>
                    <text x="325" y="215" font-size="13" fill="#000000" text-anchor="middle">v&gt;2f</text>
                    <text x="475" y="180" font-size="13" fill="#000000" text-anchor="middle">像性质</text>
                    <text x="475" y="215" font-size="13" fill="#000000" text-anchor="middle">倒立放大实像</text>
                    <text x="625" y="180" font-size="13" fill="#000000" text-anchor="middle">应用</text>
                    <text x="625" y="215" font-size="13" fill="#2e7d32" text-anchor="middle">投影仪</text>
                </g>
                <!-- 放大镜表格 -->
                <g id="scene3-table-magnifier" class="scene3-hidden">
                    <rect x="100" y="160" width="600" height="80" fill="#ffffff" stroke="#888888" stroke-width="1"/>
                    <line x1="250" y1="160" x2="250" y2="240" stroke="#888888" stroke-width="1"/>
                    <line x1="400" y1="160" x2="400" y2="240" stroke="#888888" stroke-width="1"/>
                    <line x1="550" y1="160" x2="550" y2="240" stroke="#888888" stroke-width="1"/>
                    <text x="175" y="180" font-size="13" fill="#000000" text-anchor="middle">物距</text>
                    <text x="175" y="215" font-size="13" fill="#000000" text-anchor="middle">u&lt;f</text>
                    <text x="325" y="180" font-size="13" fill="#000000" text-anchor="middle">像距</text>
                    <text x="325" y="215" font-size="13" fill="#000000" text-anchor="middle">v&gt;u</text>
                    <text x="475" y="180" font-size="13" fill="#000000" text-anchor="middle">像性质</text>
                    <text x="475" y="215" font-size="13" fill="#000000" text-anchor="middle">正立放大虚像</text>
                    <text x="625" y="180" font-size="13" fill="#000000" text-anchor="middle">应用</text>
                    <text x="625" y="215" font-size="13" fill="#c62828" text-anchor="middle">放大镜</text>
                </g>
            </g>
            
            <!-- 状态 1: 照相机成像 -->
            <g id="scene3-state-camera" class="scene3-visible">
                <!-- 物体 (蜡烛) -->
                <g id="scene3-object-camera">
                    <rect x="175" y="230" width="10" height="50" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
                    <ellipse cx="180" cy="225" rx="8" ry="10" fill="#ff9800" stroke="#e65100" stroke-width="1"/>
                </g>
                <!-- 像 (倒立缩小实像) -->
                <g id="scene3-image-camera">
                    <line x1="530" y1="280" x2="530" y2="260" stroke="#c62828" stroke-width="3" marker-end="url(#scene3-arrow-red)"/>
                </g>
                <!-- 光路 -->
                <path id="scene3-light-camera-1" d="M180,230 L400,230 L530,260" fill="none" stroke="#ff9800" stroke-width="2" stroke-dasharray="5,5"/>
                <path id="scene3-light-camera-2" d="M180,230 L400,280 L530,260" fill="none" stroke="#ff9800" stroke-width="2"/>
                <!-- 物距标注 (移到主光轴下方) -->
                <text id="scene3-label-u-camera" x="280" y="345" font-size="14" fill="#000000">u&gt;2f</text>
                <!-- 像距标注 (移到主光轴下方) -->
                <text id="scene3-label-v-camera" x="470" y="345" font-size="14" fill="#000000">f&lt;v&lt;2f</text>
            </g>
            
            <!-- 状态 2: 投影仪成像 -->
            <g id="scene3-state-projector" class="scene3-hidden">
                <!-- 物体 (蜡烛/胶片) -->
                <g id="scene3-object-projector">
                    <rect x="345" y="230" width="10" height="50" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
                    <ellipse cx="350" cy="225" rx="8" ry="10" fill="#ff9800" stroke="#e65100" stroke-width="1"/>
                </g>
                <!-- 像 (倒立放大实像) -->
                <g id="scene3-image-projector">
                    <line x1="630" y1="280" x2="630" y2="220" stroke="#c62828" stroke-width="3"/>
                </g>
                <!-- 光路 -->
                <path id="scene3-light-projector-1" d="M350,230 L400,230 L630,220" fill="none" stroke="#ff9800" stroke-width="2" stroke-dasharray="5,5"/>
                <path id="scene3-light-projector-2" d="M350,230 L400,280 L630,220" fill="none" stroke="#ff9800" stroke-width="2"/>
                <!-- 物距标注 (移到主光轴下方) -->
                <text id="scene3-label-u-projector" x="370" y="345" font-size="14" fill="#000000">f&lt;u&lt;2f</text>
                <!-- 像距标注 (移到主光轴下方) -->
                <text id="scene3-label-v-projector" x="550" y="345" font-size="14" fill="#000000">v&gt;2f</text>
            </g>
            
            <!-- 状态 3: 放大镜成像 -->
            <g id="scene3-state-magnifier" class="scene3-hidden">
                <!-- 物体 (蜡烛) -->
                <g id="scene3-object-magnifier">
                    <rect x="365" y="230" width="10" height="50" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
                    <ellipse cx="370" cy="225" rx="8" ry="10" fill="#ff9800" stroke="#e65100" stroke-width="1"/>
                </g>
                <!-- 像 (正立放大虚像) -->
                <g id="scene3-image-magnifier">
                    <line x1="300" y1="280" x2="300" y2="200" stroke="#1565c0" stroke-width="3" stroke-dasharray="5,5"/>
                </g>
                <!-- 光路 (虚线表示反向延长线) -->
                <path id="scene3-light-magnifier-1" d="M370,230 L400,230" fill="none" stroke="#1565c0" stroke-width="2"/>
                <path id="scene3-light-magnifier-2" d="M400,230 L500,210" fill="none" stroke="#1565c0" stroke-width="2" stroke-dasharray="5,5"/>
                <path id="scene3-light-magnifier-3" d="M370,230 L400,280" fill="none" stroke="#1565c0" stroke-width="2"/>
                <path id="scene3-light-magnifier-4" d="M400,280 L500,300" fill="none" stroke="#1565c0" stroke-width="2" stroke-dasharray="5,5"/>
                <!-- 反向延长线 -->
                <path id="scene3-light-magnifier-5" d="M400,230 L300,200" fill="none" stroke="#1565c0" stroke-width="2" stroke-dasharray="3,3" opacity="0.6"/>
                <path id="scene3-light-magnifier-6" d="M400,280 L300,200" fill="none" stroke="#1565c0" stroke-width="2" stroke-dasharray="3,3" opacity="0.6"/>
                <!-- 物距标注 (移到主光轴下方) -->
                <text id="scene3-label-u-magnifier" x="380" y="345" font-size="14" fill="#000000">u&lt;f</text>
                <!-- 像距标注 (移到主光轴下方) -->
                <text id="scene3-label-v-magnifier" x="320" y="345" font-size="14" fill="#000000">v&gt;u</text>
            </g>
            
            <!-- 箭头定义 -->
            <defs>
                <marker id="scene3-arrow-red" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
                    <polygon points="0,0 10,5 0,10" fill="#c62828"/>
                </marker>
                <marker id="scene3-arrow-blue" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
                    <polygon points="0,0 10,5 0,10" fill="#1565c0"/>
                </marker>
            </defs>
            
            <!-- 控件栏 (放在 SVG 内部底部) -->
            <g id="scene3-controls">
                <rect id="scene3-btn-camera" x="200" y="450" width="100" height="35" fill="#1565c0" stroke="#1565c0" stroke-width="2" rx="6" class="scene3-btn-active"/>
                <text id="scene3-btn-camera-text" x="250" y="472" font-size="14" fill="#ffffff" text-anchor="middle">照相机</text>
                
                <rect id="scene3-btn-projector" x="350" y="450" width="100" height="35" fill="#e0e0e0" stroke="#888888" stroke-width="2" rx="6" class="scene3-btn-inactive"/>
                <text id="scene3-btn-projector-text" x="400" y="472" font-size="14" fill="#333333" text-anchor="middle">投影仪</text>
                
                <rect id="scene3-btn-magnifier" x="500" y="450" width="100" height="35" fill="#e0e0e0" stroke="#888888" stroke-width="2" rx="6" class="scene3-btn-inactive"/>
                <text id="scene3-btn-magnifier-text" x="550" y="472" font-size="14" fill="#333333" text-anchor="middle">放大镜</text>
            </g>
        </svg>
    </div>
    
    <script>
    (function() {
        // Scene 3: 凸透镜三种成像应用对比
        let currentState = 0; // 0=照相机，1=投影仪，2=放大镜
        
        // 获取所有元素
        const btnCamera = document.getElementById('scene3-btn-camera');
        const btnProjector = document.getElementById('scene3-btn-projector');
        const btnMagnifier = document.getElementById('scene3-btn-magnifier');
        const btnCameraText = document.getElementById('scene3-btn-camera-text');
        const btnProjectorText = document.getElementById('scene3-btn-projector-text');
        const btnMagnifierText = document.getElementById('scene3-btn-magnifier-text');
        
        const stateCamera = document.getElementById('scene3-state-camera');
        const stateProjector = document.getElementById('scene3-state-projector');
        const stateMagnifier = document.getElementById('scene3-state-magnifier');
        
        const tableCamera = document.getElementById('scene3-table-camera');
        const tableProjector = document.getElementById('scene3-table-projector');
        const tableMagnifier = document.getElementById('scene3-table-magnifier');
        
        const appCamera = document.getElementById('scene3-app-camera');
        const appProjector = document.getElementById('scene3-app-projector');
        const appMagnifier = document.getElementById('scene3-app-magnifier');
        
        // 工具函数：显示/隐藏元素
        function showElement(el) {
            if (el) {
                el.classList.remove('scene3-hidden');
                el.classList.add('scene3-visible');
            }
        }
        
        function hideElement(el) {
            if (el) {
                el.classList.remove('scene3-visible');
                el.classList.add('scene3-hidden');
            }
        }
        
        // 更新按钮样式
        function updateButtons(activeIndex) {
            // 重置所有按钮为未选中状态
            btnCamera.setAttribute('fill', '#e0e0e0');
            btnCamera.setAttribute('stroke', '#888888');
            btnCameraText.setAttribute('fill', '#333333');
            
            btnProjector.setAttribute('fill', '#e0e0e0');
            btnProjector.setAttribute('stroke', '#888888');
            btnProjectorText.setAttribute('fill', '#333333');
            
            btnMagnifier.setAttribute('fill', '#e0e0e0');
            btnMagnifier.setAttribute('stroke', '#888888');
            btnMagnifierText.setAttribute('fill', '#333333');
            
            // 设置当前选中按钮
            if (activeIndex === 0) {
                btnCamera.setAttribute('fill', '#1565c0');
                btnCamera.setAttribute('stroke', '#1565c0');
                btnCameraText.setAttribute('fill', '#ffffff');
            } else if (activeIndex === 1) {
                btnProjector.setAttribute('fill', '#2e7d32');
                btnProjector.setAttribute('stroke', '#2e7d32');
                btnProjectorText.setAttribute('fill', '#ffffff');
            } else if (activeIndex === 2) {
                btnMagnifier.setAttribute('fill', '#c62828');
                btnMagnifier.setAttribute('stroke', '#c62828');
                btnMagnifierText.setAttribute('fill', '#ffffff');
            }
        }
        
        // 切换状态
        function switchState(newState) {
            if (newState === currentState) return;
            
            // 隐藏所有状态
            hideElement(stateCamera);
            hideElement(stateProjector);
            hideElement(stateMagnifier);
            hideElement(tableCamera);
            hideElement(tableProjector);
            hideElement(tableMagnifier);
            hideElement(appCamera);
            hideElement(appProjector);
            hideElement(appMagnifier);
            
            // 显示新状态
            if (newState === 0) {
                showElement(stateCamera);
                showElement(tableCamera);
                showElement(appCamera);
            } else if (newState === 1) {
                showElement(stateProjector);
                showElement(tableProjector);
                showElement(appProjector);
            } else if (newState === 2) {
                showElement(stateMagnifier);
                showElement(tableMagnifier);
                showElement(appMagnifier);
            }
            
            // 更新按钮样式
            updateButtons(newState);
            currentState = newState;
        }
        
        // 绑定按钮点击事件
        btnCamera.addEventListener('click', function() {
            switchState(0);
        });
        
        btnProjector.addEventListener('click', function() {
            switchState(1);
        });
        
        btnMagnifier.addEventListener('click', function() {
            switchState(2);
        });
        
        // 初始化
        updateButtons(0);
    })();
    </script>
</body>
</html>
