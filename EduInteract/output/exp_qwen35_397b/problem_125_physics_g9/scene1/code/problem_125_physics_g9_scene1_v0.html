<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>凸透镜成像规律 - 光路图</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 8px;
            z-index: 10;
        }
        .scene1-btn {
            padding: 6px 12px;
            font-size: 13px;
            border: 1px solid #333;
            border-radius: 4px;
            background: #f5f5f5;
            cursor: pointer;
            transition: background 0.2s;
        }
        .scene1-btn:hover {
            background: #e0e0e0;
        }
        .scene1-btn.active {
            background: #1976d2;
            color: white;
            border-color: #1976d2;
        }
        .scene1-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .scene1-ray {
            stroke-width: 2;
            fill: none;
        }
        .scene1-ray-dim {
            opacity: 0.5;
        }
        .scene1-arrow-marker {
            fill: currentColor;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 定义箭头 marker -->
            <defs>
                <marker id="scene1-arrow-blue" markerWidth="12" markerHeight="8" refX="6" refY="4" orient="auto">
                    <path d="M0,0 L12,4 L0,8 Z" fill="#1565c0"/>
                </marker>
                <marker id="scene1-arrow-green" markerWidth="12" markerHeight="8" refX="6" refY="4" orient="auto">
                    <path d="M0,0 L12,4 L0,8 Z" fill="#2e7d32"/>
                </marker>
                <marker id="scene1-arrow-red" markerWidth="12" markerHeight="8" refX="6" refY="4" orient="auto">
                    <path d="M0,0 L12,4 L0,8 Z" fill="#c62828"/>
                </marker>
                <marker id="scene1-arrow-black" markerWidth="10" markerHeight="8" refX="5" refY="4" orient="auto">
                    <path d="M0,0 L10,4 L0,8 Z" fill="#000000"/>
                </marker>
            </defs>

            <!-- 主光轴 -->
            <line id="scene1-optical-axis" x1="50" y1="250" x2="750" y2="250" stroke="#000000" stroke-width="3"/>

            <!-- 凸透镜 -->
            <ellipse id="scene1-lens" cx="400" cy="250" rx="20" ry="60" fill="none" stroke="#000000" stroke-width="2"/>

            <!-- 光心 O -->
            <circle id="scene1-optical-center" cx="400" cy="250" r="3" fill="#000000"/>
            <text id="scene1-label-o" x="400" y="270" text-anchor="middle" font-size="14" fill="#000000">O</text>

            <!-- 左焦点和 2F 点 -->
            <circle id="scene1-f-left" cx="300" cy="250" r="4" fill="#000000"/>
            <text id="scene1-label-f-left" x="300" y="270" text-anchor="middle" font-size="14" fill="#000000">F</text>
            <circle id="scene1-2f-left" cx="200" cy="250" r="4" fill="#000000"/>
            <text id="scene1-label-2f-left" x="200" y="270" text-anchor="middle" font-size="14" fill="#000000">2F</text>

            <!-- 右焦点和 2F 点 -->
            <circle id="scene1-f-right" cx="500" cy="250" r="4" fill="#000000"/>
            <text id="scene1-label-f-right" x="500" y="270" text-anchor="middle" font-size="14" fill="#000000">F</text>
            <circle id="scene1-2f-right" cx="600" cy="250" r="4" fill="#000000"/>
            <text id="scene1-label-2f-right" x="600" y="270" text-anchor="middle" font-size="14" fill="#000000">2F</text>

            <!-- 蜡烛主体 -->
            <rect id="scene1-candle-body" x="115" y="220" width="15" height="30" fill="#8d6e63"/>
            <!-- 蜡烛火焰 -->
            <ellipse id="scene1-flame" cx="122.5" cy="200" rx="6" ry="10" fill="#ff9800"/>

            <!-- 蜡烛标签 -->
            <text id="scene1-label-candle" x="122" y="175" text-anchor="middle" font-size="14" fill="#000000">蜡烛</text>

            <!-- 凸透镜标签 -->
            <text id="scene1-label-lens" x="400" y="185" text-anchor="middle" font-size="14" fill="#000000">凸透镜</text>

            <!-- 光屏支架 -->
            <line id="scene1-screen-stand" x1="550" y1="210" x2="550" y2="250" stroke="#000000" stroke-width="3"/>
            <!-- 光屏面 -->
            <rect id="scene1-screen" x="520" y="170" width="60" height="40" fill="#bdbdbd" fill-opacity="0.3" stroke="#000000" stroke-width="1"/>
            <!-- 光屏标签 -->
            <text id="scene1-label-screen" x="550" y="150" text-anchor="middle" font-size="14" fill="#000000">光屏</text>

            <!-- 物距 u 标注 -->
            <line id="scene1-u-line" x1="130" y1="265" x2="395" y2="265" stroke="#000000" stroke-width="1" marker-start="url(#scene1-arrow-black)" marker-end="url(#scene1-arrow-black)"/>
            <text id="scene1-label-u" x="262" y="285" text-anchor="middle" font-size="14" fill="#000000">u</text>

            <!-- 像距 v 标注 -->
            <line id="scene1-v-line" x1="405" y1="265" x2="545" y2="265" stroke="#000000" stroke-width="1" marker-start="url(#scene1-arrow-black)" marker-end="url(#scene1-arrow-black)"/>
            <text id="scene1-label-v" x="475" y="285" text-anchor="middle" font-size="14" fill="#000000">v</text>

            <!-- 光线 1（蓝色）：平行主光轴 → 过右焦点 -->
            <g id="scene1-ray1" class="scene1-ray" style="display: none;">
                <line x1="122.5" y1="200" x2="400" y2="200" stroke="#1565c0" stroke-width="2"/>
                <line x1="400" y1="200" x2="550" y2="250" stroke="#1565c0" stroke-width="2"/>
                <!-- 箭头 -->
                <polygon points="470,223 480,227 470,231" fill="#1565c0"/>
            </g>

            <!-- 光线 2（绿色）：过光心 -->
            <g id="scene1-ray2" class="scene1-ray" style="display: none;">
                <line x1="122.5" y1="200" x2="550" y2="250" stroke="#2e7d32" stroke-width="2"/>
                <!-- 箭头 -->
                <polygon points="345,222 355,226 345,230" fill="#2e7d32"/>
            </g>

            <!-- 光线 3（红色）：过左焦点 → 平行主光轴 -->
            <g id="scene1-ray3" class="scene1-ray" style="display: none;">
                <line x1="122.5" y1="200" x2="400" y2="235" stroke="#c62828" stroke-width="2"/>
                <line x1="400" y1="235" x2="550" y2="250" stroke="#c62828" stroke-width="2" stroke-dasharray="4,2"/>
                <!-- 箭头 -->
                <polygon points="345,228 355,232 345,236" fill="#c62828"/>
            </g>

            <!-- 实像（倒立火焰） -->
            <g id="scene1-real-image" style="display: none;">
                <ellipse id="scene1-image-flame" cx="550" cy="270" rx="6" ry="10" fill="#ff5722"/>
                <text id="scene1-label-image" x="550" y="305" text-anchor="middle" font-size="14" fill="#000000">倒立缩小</text>
            </g>

            <!-- 蜡烛变短箭头（向下） -->
            <g id="scene1-candle-down-arrow" style="display: none;">
                <line x1="122.5" y1="210" x2="122.5" y2="225" stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrow-black)"/>
            </g>

            <!-- 像上移箭头（向上） -->
            <g id="scene1-image-up-arrow" style="display: none;">
                <line x1="550" y1="280" x2="550" y2="265" stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrow-black)"/>
            </g>
        </svg>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-step0" class="scene1-btn active">步骤 0：基础元件</button>
            <button id="scene1-btn-step1" class="scene1-btn">步骤 1：光线 1</button>
            <button id="scene1-btn-step2" class="scene1-btn">步骤 2：光线 2</button>
            <button id="scene1-btn-step3" class="scene1-btn">步骤 3：光线 3</button>
            <button id="scene1-btn-step4" class="scene1-btn">步骤 4：实像形成</button>
            <button id="scene1-btn-step5" class="scene1-btn">步骤 5：蜡烛变短</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现：凸透镜成像光路图

        // 坐标表参考（来自 spec.json）：
        // 主光轴：(50,250)-(750,250)
        // 凸透镜：中心 (400,250)，宽 40×高 120
        // 光心 O：(400,250)
        // 左焦点 F：(300,250)，左 2F：(200,250)
        // 右焦点 F：(500,250)，右 2F：(600,250)
        // 蜡烛：(115,220) 15×30，火焰 (122,200) 12×20
        // 光屏：支架 (550,250)-(550,210)，屏面 (520,170)-(580,210)
        // 实像：倒立火焰 (550,270)

        let currentStep = 0;
        let isAnimating = false;

        // 获取 DOM 元素
        const ray1 = document.getElementById('scene1-ray1');
        const ray2 = document.getElementById('scene1-ray2');
        const ray3 = document.getElementById('scene1-ray3');
        const realImage = document.getElementById('scene1-real-image');
        const imageFlame = document.getElementById('scene1-image-flame');
        const candleDownArrow = document.getElementById('scene1-candle-down-arrow');
        const imageUpArrow = document.getElementById('scene1-image-up-arrow');
        const flame = document.getElementById('scene1-flame');

        // 按钮元素
        const buttons = [
            document.getElementById('scene1-btn-step0'),
            document.getElementById('scene1-btn-step1'),
            document.getElementById('scene1-btn-step2'),
            document.getElementById('scene1-btn-step3'),
            document.getElementById('scene1-btn-step4'),
            document.getElementById('scene1-btn-step5')
        ];

        // 更新视图函数
        function updateScene(step) {
            // 隐藏所有光线和实像
            ray1.style.display = 'none';
            ray2.style.display = 'none';
            ray3.style.display = 'none';
            realImage.style.display = 'none';
            candleDownArrow.style.display = 'none';
            imageUpArrow.style.display = 'none';

            // 重置火焰位置
            flame.setAttribute('cy', '200');
            imageFlame.setAttribute('cy', '270');

            // 根据步骤显示相应元素
            if (step >= 1) {
                ray1.style.display = 'block';
            }
            if (step >= 2) {
                ray2.style.display = 'block';
            }
            if (step >= 3) {
                ray3.style.display = 'block';
            }
            if (step >= 4) {
                ray1.classList.add('scene1-ray-dim');
                ray2.classList.add('scene1-ray-dim');
                ray3.classList.add('scene1-ray-dim');
                realImage.style.display = 'block';
            }
            if (step >= 5) {
                candleDownArrow.style.display = 'block';
                imageUpArrow.style.display = 'block';
                // 动画：蜡烛变短，像上移
                animateCandleChange();
            }

            // 更新按钮状态
            buttons.forEach((btn, idx) => {
                if (idx === step) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        // 蜡烛变短动画
        function animateCandleChange() {
            if (isAnimating) return;
            isAnimating = true;

            const startTime = performance.now();
            const duration = 500;
            const startY = 200;
            const endY = 215;
            const imageStartY = 270;
            const imageEndY = 255;

            function animate(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);

                // 缓动函数
                const easeProgress = 1 - Math.pow(1 - progress, 3);

                const currentFlameY = startY + (endY - startY) * easeProgress;
                const currentImageY = imageStartY + (imageEndY - imageStartY) * easeProgress;

                flame.setAttribute('cy', currentFlameY.toFixed(1));
                imageFlame.setAttribute('cy', currentImageY.toFixed(1));

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    isAnimating = false;
                }
            }

            requestAnimationFrame(animate);
        }

        // 按钮点击事件
        buttons.forEach((btn, idx) => {
            btn.addEventListener('click', () => {
                if (isAnimating && idx < 5) return;
                currentStep = idx;
                updateScene(currentStep);
            });
        });

        // 初始化
        updateScene(0);
    })();
    </script>
</body>
</html>
