<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>功、功率与机械效率 - 滑轮组水平拉动物体</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #scene2-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene2-svg {
            width: 800px;
            height: 500px;
        }
        .scene2-formula {
            font-size: 14px;
            fill: #1565c0;
        }
        .scene2-option-text {
            font-size: 13px;
            fill: #000000;
        }
        .scene2-hidden {
            opacity: 0;
        }
        .scene2-visible {
            opacity: 1;
            transition: opacity 0.3s ease;
        }
        .scene2-btn {
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .scene2-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .scene2-flash {
            animation: scene2-flash-anim 0.5s ease 2;
        }
        @keyframes scene2-flash-anim {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .scene2-pulse {
            animation: scene2-pulse-anim 0.6s ease 3;
        }
        @keyframes scene2-pulse-anim {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .scene2-highlight {
            fill: #e8f5e9 !important;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 地面 -->
            <line id="scene2-ground" x1="40" y1="340" x2="380" y2="340" stroke="#333333" stroke-width="3"/>
            <!-- 地面阴影斜线 -->
            <g id="scene2-ground-shading">
                <line x1="40" y1="345" x2="50" y2="355" stroke="#999999" stroke-width="1"/>
                <line x1="55" y1="345" x2="65" y2="355" stroke="#999999" stroke-width="1"/>
                <line x1="70" y1="345" x2="80" y2="355" stroke="#999999" stroke-width="1"/>
                <line x1="85" y1="345" x2="95" y2="355" stroke="#999999" stroke-width="1"/>
                <line x1="100" y1="345" x2="110" y2="355" stroke="#999999" stroke-width="1"/>
                <line x1="115" y1="345" x2="125" y2="355" stroke="#999999" stroke-width="1"/>
                <line x1="130" y1="345" x2="140" y2="355" stroke="#999999" stroke-width="1"/>
                <line x1="145" y1="345" x2="155" y2="355" stroke="#999999" stroke-width="1"/>
                <line x1="160" y1="345" x2="170" y2="355" stroke="#999999" stroke-width="1"/>
                <line x1="175" y1="345" x2="185" y2="355" stroke="#999999" stroke-width="1"/>
                <line x1="190" y1="345" x2="200" y2="355" stroke="#999999" stroke-width="1"/>
                <line x1="205" y1="345" x2="215" y2="355" stroke="#999999" stroke-width="1"/>
                <line x1="220" y1="345" x2="230" y2="355" stroke="#999999" stroke-width="1"/>
                <line x1="235" y1="345" x2="245" y2="355" stroke="#999999" stroke-width="1"/>
                <line x1="250" y1="345" x2="260" y2="355" stroke="#999999" stroke-width="1"/>
                <line x1="265" y1="345" x2="275" y2="355" stroke="#999999" stroke-width="1"/>
                <line x1="280" y1="345" x2="290" y2="355" stroke="#999999" stroke-width="1"/>
                <line x1="295" y1="345" x2="305" y2="355" stroke="#999999" stroke-width="1"/>
                <line x1="310" y1="345" x2="320" y2="355" stroke="#999999" stroke-width="1"/>
                <line x1="325" y1="345" x2="335" y2="355" stroke="#999999" stroke-width="1"/>
                <line x1="340" y1="345" x2="350" y2="355" stroke="#999999" stroke-width="1"/>
                <line x1="355" y1="345" x2="365" y2="355" stroke="#999999" stroke-width="1"/>
                <line x1="370" y1="345" x2="380" y2="355" stroke="#999999" stroke-width="1"/>
            </g>
            
            <!-- 物体 A -->
            <rect id="scene2-object-a" x="120" y="280" width="80" height="60" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
            <text id="scene2-label-a" x="160" y="315" text-anchor="middle" font-size="18px" fill="#000000">A</text>
            
            <!-- 摩擦力 f 箭头（向左） -->
            <g id="scene2-friction-group">
                <line id="scene2-friction-f-arrow" x1="160" y1="310" x2="80" y2="310" stroke="#c62828" stroke-width="3" marker-end="url(#scene2-arrowhead-red)"/>
                <text id="scene2-label-f" x="120" y="295" text-anchor="middle" font-size="16px" fill="#c62828">f</text>
            </g>
            
            <!-- 滑轮组支架 -->
            <line id="scene2-pulley-frame" x1="420" y1="260" x2="420" y2="320" stroke="#333333" stroke-width="3"/>
            
            <!-- 动滑轮（两个同轴） -->
            <circle id="scene2-movable-pulley1" cx="420" cy="280" r="20" fill="#fff9c4" stroke="#f9a825" stroke-width="2"/>
            <circle id="scene2-movable-pulley2" cx="420" cy="300" r="20" fill="#fff9c4" stroke="#f9a825" stroke-width="2"/>
            
            <!-- 定滑轮 -->
            <circle id="scene2-fixed-pulley" cx="520" cy="290" r="17.5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
            
            <!-- 墙壁 -->
            <line id="scene2-wall" x1="560" y1="250" x2="560" y2="330" stroke="#333333" stroke-width="3"/>
            <!-- 墙壁阴影斜线 -->
            <g id="scene2-wall-shading">
                <line x1="565" y1="250" x2="575" y2="260" stroke="#999999" stroke-width="1"/>
                <line x1="565" y1="260" x2="575" y2="270" stroke="#999999" stroke-width="1"/>
                <line x1="565" y1="270" x2="575" y2="280" stroke="#999999" stroke-width="1"/>
                <line x1="565" y1="280" x2="575" y2="290" stroke="#999999" stroke-width="1"/>
                <line x1="565" y1="290" x2="575" y2="300" stroke="#999999" stroke-width="1"/>
                <line x1="565" y1="300" x2="575" y2="310" stroke="#999999" stroke-width="1"/>
                <line x1="565" y1="310" x2="575" y2="320" stroke="#999999" stroke-width="1"/>
                <line x1="565" y1="320" x2="575" y2="330" stroke="#999999" stroke-width="1"/>
            </g>
            
            <!-- 绳子路径（3段承重绳） -->
            <polyline id="scene2-rope" points="200,310 420,310 420,280 520,280 520,290 490,270" 
                      fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 拉力 F 箭头 -->
            <g id="scene2-force-group">
                <line id="scene2-force-f-arrow" x1="500" y1="270" x2="470" y2="260" stroke="#1565c0" stroke-width="3" marker-end="url(#scene2-arrowhead-blue)"/>
                <text id="scene2-label-F" x="485" y="250" text-anchor="middle" font-size="16px" fill="#1565c0">F</text>
            </g>
            
            <!-- 箭头定义 -->
            <defs>
                <marker id="scene2-arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#c62828"/>
                </marker>
                <marker id="scene2-arrowhead-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#1565c0"/>
                </marker>
            </defs>
            
            <!-- 公式区背景框 -->
            <rect id="scene2-formula-bg" x="600" y="100" width="180" height="300" fill="#ffffff" stroke="#1565c0" stroke-width="1" opacity="0.15"/>
            
            <!-- 公式区标题 -->
            <text id="scene2-formula-title" x="690" y="125" text-anchor="middle" font-size="16px" fill="#1565c0" font-weight="bold">公式推导</text>
            
            <!-- 步骤 0：有用功公式 -->
            <g id="scene2-step0-formula" class="scene2-visible">
                <text x="610" y="155" font-size="14px" fill="#1565c0" font-weight="bold">有用功</text>
                <text x="610" y="175" class="scene2-formula">W<tspan baseline-shift="sub" font-size="10px">有用</tspan> = fS</text>
            </g>
            
            <!-- 步骤 1：总功公式 -->
            <g id="scene2-step1-formula" class="scene2-hidden">
                <text x="610" y="200" font-size="14px" fill="#1565c0" font-weight="bold">总功</text>
                <text x="610" y="220" class="scene2-formula">W<tspan baseline-shift="sub" font-size="10px">总</tspan> = F·3S = 3FS</text>
            </g>
            
            <!-- 步骤 2：功率公式 -->
            <g id="scene2-step2-formula" class="scene2-hidden">
                <text x="610" y="245" font-size="14px" fill="#1565c0" font-weight="bold">功率</text>
                <text x="610" y="265" class="scene2-formula">P = F·v<tspan baseline-shift="sub" font-size="10px">绳端</tspan> = 3Fυ</text>
            </g>
            
            <!-- 步骤 3：机械效率公式 -->
            <g id="scene2-step3-formula" class="scene2-hidden">
                <text x="610" y="290" font-size="14px" fill="#1565c0" font-weight="bold">机械效率</text>
                <text x="610" y="310" class="scene2-formula">η = W<tspan baseline-shift="sub" font-size="10px">有用</tspan>/W<tspan baseline-shift="sub" font-size="10px">总</tspan></text>
                <text x="610" y="328" class="scene2-formula">= fS/(3FS) = f/(3F)</text>
            </g>
            
            <!-- 选项区 -->
            <g id="scene2-option-a" class="scene2-hidden">
                <text x="610" y="355" class="scene2-option-text">A 有用功为 GS</text>
                <text x="750" y="355" font-size="18px" fill="#c62828" font-weight="bold">×</text>
            </g>
            
            <g id="scene2-option-b" class="scene2-hidden">
                <text x="610" y="380" class="scene2-option-text">B 拉力做功为 3FS</text>
                <text x="750" y="380" font-size="18px" fill="#2e7d32" font-weight="bold">✓</text>
            </g>
            
            <g id="scene2-option-c" class="scene2-hidden">
                <text x="610" y="405" class="scene2-option-text">C 功率为 3Fυ</text>
                <text x="750" y="405" font-size="18px" fill="#2e7d32" font-weight="bold">✓</text>
            </g>
            
            <g id="scene2-option-d" class="scene2-hidden">
                <text x="610" y="430" class="scene2-option-text">D 机械效率为 f/(3F)</text>
                <text x="750" y="430" font-size="18px" fill="#2e7d32" font-weight="bold">✓</text>
            </g>
            
            <!-- 最终答案 -->
            <g id="scene2-final-answer" class="scene2-hidden">
                <rect x="605" y="445" width="170" height="25" fill="#ffcdd2" stroke="#c62828" stroke-width="1"/>
                <text x="690" y="463" text-anchor="middle" font-size="14px" fill="#c62828" font-weight="bold">本题答案：A</text>
            </g>
            
            <!-- 控件栏背景 -->
            <rect id="scene2-controls-bg" x="0" y="440" width="800" height="60" fill="#f5f5f5" opacity="0.8"/>
            
            <!-- 上一步按钮 -->
            <g id="scene2-btn-prev-group" class="scene2-btn">
                <rect id="scene2-btn-prev-bg" x="280" y="455" width="100" height="35" rx="5" fill="#1565c0"/>
                <text id="scene2-btn-prev-text" x="330" y="477" text-anchor="middle" font-size="14px" fill="#ffffff">◀ 上一步</text>
            </g>
            
            <!-- 步骤指示器 -->
            <text id="scene2-step-indicator" x="400" y="477" text-anchor="middle" font-size="14px" fill="#666666">步骤 0/5</text>
            
            <!-- 下一步按钮 -->
            <g id="scene2-btn-next-group" class="scene2-btn">
                <rect id="scene2-btn-next-bg" x="420" y="455" width="100" height="35" rx="5" fill="#1565c0"/>
                <text id="scene2-btn-next-text" x="470" y="477" text-anchor="middle" font-size="14px" fill="#ffffff">下一步 ▶</text>
            </g>
        </svg>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现：功、功率与机械效率
        
        const state = {
            currentStep: 0,
            totalSteps: 5
        };
        
        // 获取 DOM 元素
        const elements = {
            step0Formula: document.getElementById('scene2-step0-formula'),
            step1Formula: document.getElementById('scene2-step1-formula'),
            step2Formula: document.getElementById('scene2-step2-formula'),
            step3Formula: document.getElementById('scene2-step3-formula'),
            optionA: document.getElementById('scene2-option-a'),
            optionB: document.getElementById('scene2-option-b'),
            optionC: document.getElementById('scene2-option-c'),
            optionD: document.getElementById('scene2-option-d'),
            finalAnswer: document.getElementById('scene2-final-answer'),
            btnPrev: document.getElementById('scene2-btn-prev-group'),
            btnNext: document.getElementById('scene2-btn-next-group'),
            stepIndicator: document.getElementById('scene2-step-indicator'),
            frictionGroup: document.getElementById('scene2-friction-group'),
            forceGroup: document.getElementById('scene2-force-group'),
            step3FormulaGroup: document.getElementById('scene2-step3-formula'),
            optionDGroup: document.getElementById('scene2-option-d')
        };
        
        // 显示/隐藏工具函数
        function show(el) {
            if (el) {
                el.classList.remove('scene2-hidden');
                el.classList.add('scene2-visible');
            }
        }
        
        function hide(el) {
            if (el) {
                el.classList.remove('scene2-visible');
                el.classList.add('scene2-hidden');
            }
        }
        
        // 更新按钮状态
        function updateButtons() {
            const prevBg = document.getElementById('scene2-btn-prev-bg');
            const prevText = document.getElementById('scene2-btn-prev-text');
            const nextBg = document.getElementById('scene2-btn-next-bg');
            const nextText = document.getElementById('scene2-btn-next-text');
            
            if (state.currentStep === 0) {
                prevBg.setAttribute('fill', '#bdbdbd');
                prevText.setAttribute('fill', '#757575');
                elements.btnPrev.style.pointerEvents = 'none';
            } else {
                prevBg.setAttribute('fill', '#1565c0');
                prevText.setAttribute('fill', '#ffffff');
                elements.btnPrev.style.pointerEvents = 'auto';
            }
            
            if (state.currentStep === state.totalSteps) {
                nextBg.setAttribute('fill', '#bdbdbd');
                nextText.setAttribute('fill', '#757575');
                elements.btnNext.style.pointerEvents = 'none';
            } else {
                nextBg.setAttribute('fill', '#1565c0');
                nextText.setAttribute('fill', '#ffffff');
                elements.btnNext.style.pointerEvents = 'auto';
            }
            
            elements.stepIndicator.textContent = '步骤 ' + state.currentStep + '/' + state.totalSteps;
        }
        
        // 更新步骤显示
        function updateStep() {
            // 隐藏所有公式和选项
            hide(elements.step1Formula);
            hide(elements.step2Formula);
            hide(elements.step3Formula);
            hide(elements.optionA);
            hide(elements.optionB);
            hide(elements.optionC);
            hide(elements.optionD);
            hide(elements.finalAnswer);
            
            // 移除所有动画类
            elements.frictionGroup.classList.remove('scene2-flash');
            elements.forceGroup.classList.remove('scene2-flash');
            elements.step3FormulaGroup.classList.remove('scene2-pulse');
            elements.optionDGroup.classList.remove('scene2-highlight');
            
            // 根据当前步骤显示相应内容
            switch(state.currentStep) {
                case 0:
                    // 初始状态：只显示有用功公式
                    show(elements.step0Formula);
                    break;
                case 1:
                    // 总功公式 + 选项 A（错误）
                    show(elements.step0Formula);
                    show(elements.step1Formula);
                    show(elements.optionA);
                    // 摩擦力箭头闪烁
                    elements.frictionGroup.classList.add('scene2-flash');
                    break;
                case 2:
                    // 功率公式 + 选项 B（正确）
                    show(elements.step0Formula);
                    show(elements.step1Formula);
                    show(elements.step2Formula);
                    show(elements.optionA);
                    show(elements.optionB);
                    // 拉力 F 箭头闪烁
                    elements.forceGroup.classList.add('scene2-flash');
                    break;
                case 3:
                    // 机械效率公式 + 选项 C（正确）
                    show(elements.step0Formula);
                    show(elements.step1Formula);
                    show(elements.step2Formula);
                    show(elements.step3Formula);
                    show(elements.optionA);
                    show(elements.optionB);
                    show(elements.optionC);
                    // 公式放大动画
                    elements.step3FormulaGroup.classList.add('scene2-pulse');
                    break;
                case 4:
                    // 选项 D（正确）
                    show(elements.step0Formula);
                    show(elements.step1Formula);
                    show(elements.step2Formula);
                    show(elements.step3Formula);
                    show(elements.optionA);
                    show(elements.optionB);
                    show(elements.optionC);
                    show(elements.optionD);
                    // D 选项高亮
                    elements.optionDGroup.classList.add('scene2-highlight');
                    break;
                case 5:
                    // 最终答案
                    show(elements.step0Formula);
                    show(elements.step1Formula);
                    show(elements.step2Formula);
                    show(elements.step3Formula);
                    show(elements.optionA);
                    show(elements.optionB);
                    show(elements.optionC);
                    show(elements.optionD);
                    show(elements.finalAnswer);
                    // A 选项×标记脉冲
                    const crossMark = elements.optionA.querySelector('text:last-child');
                    if (crossMark) {
                        crossMark.classList.add('scene2-pulse');
                    }
                    break;
            }
            
            updateButtons();
        }
        
        // 按钮点击事件
        elements.btnPrev.addEventListener('click', function() {
            if (state.currentStep > 0) {
                state.currentStep--;
                updateStep();
            }
        });
        
        elements.btnNext.addEventListener('click', function() {
            if (state.currentStep < state.totalSteps) {
                state.currentStep++;
                updateStep();
            }
        });
        
        // 初始化
        updateStep();
        
    })();
    </script>
</body>
</html>
