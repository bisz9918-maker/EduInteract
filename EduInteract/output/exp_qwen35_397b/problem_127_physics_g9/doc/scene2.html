<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>光的折射 - 四个选项光路对比分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene2-btn-prev, #scene2-btn-next {
            width: 120px; height: 30px;
            background: #1976d2; color: white;
            border: none; border-radius: 4px;
            font-size: 14px; cursor: pointer;
        }
        #scene2-btn-prev:hover, #scene2-btn-next:hover { background: #1565c0; }
        #scene2-btn-prev:disabled, #scene2-btn-next:disabled {
            background: #bdbdbd; cursor: not-allowed; opacity: 0.5;
        }
        #scene2-step-indicator { font-size: 14px; color: #333; min-width: 80px; text-align: center; }
        .scene2-highlight { display: none; }
        .scene2-annotation { display: none; font-size: 12px; }
        .scene2-reason { display: none; font-size: 10px; fill: #555; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- 箭头定义 -->
                <marker id="scene2-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
                    <path d="M0,0 L8,4 L0,8 Z" fill="#000000"/>
                </marker>
            </defs>

            <!-- ========== A 选项区域 (左上) ========== -->
            <!-- 玻璃砖 -->
            <rect id="scene2-glass-a" x="120" y="90" width="160" height="60" fill="#e3f2fd" fill-opacity="0.3" stroke="#1565c0" stroke-width="2"/>
            <!-- 法线 -->
            <line id="scene2-normal1-a" x1="160" y1="70" x2="160" y2="130" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
            <line id="scene2-normal2-a" x1="240" y1="110" x2="240" y2="170" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
            <!-- 光线：入射 -->
            <line id="scene2-ray-incident-a" x1="80" y1="50" x2="160" y2="110" stroke="#000000" stroke-width="2" marker-end="url(#scene2-arrow)"/>
            <!-- 光线：折射（向法线偏折） -->
            <line id="scene2-ray-refract-a" x1="160" y1="110" x2="240" y2="135" stroke="#000000" stroke-width="2" marker-end="url(#scene2-arrow)"/>
            <!-- 光线：出射（远离法线） -->
            <line id="scene2-ray-exit-a" x1="240" y1="135" x2="320" y2="195" stroke="#000000" stroke-width="2" marker-end="url(#scene2-arrow)"/>
            <!-- 选项标签（移到区域右侧外部） -->
            <text id="scene2-label-a" x="385" y="135" font-size="14px" font-weight="bold" fill="#000000" text-anchor="middle">A</text>
            <!-- 高亮框（步骤 1 显示） -->
            <rect id="scene2-highlight-a" class="scene2-highlight" x="35" y="50" width="340" height="160" fill="none" stroke="#2e7d32" stroke-width="3"/>
            <!-- 正误标注（移到高亮框上方，垂直间距加大） -->
            <text id="scene2-correct-a" class="scene2-annotation" x="200" y="35" font-size="12px" fill="#2e7d32" text-anchor="middle">✓ 正确</text>
            <text id="scene2-reason-a" class="scene2-reason" x="200" y="48" text-anchor="middle">入射向法线偏折，出射远离法线</text>

            <!-- ========== B 选项区域 (右上) ========== -->
            <!-- 玻璃砖 -->
            <rect id="scene2-glass-b" x="520" y="90" width="160" height="60" fill="#e3f2fd" fill-opacity="0.3" stroke="#1565c0" stroke-width="2"/>
            <!-- 法线 -->
            <line id="scene2-normal1-b" x1="560" y1="70" x2="560" y2="130" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
            <line id="scene2-normal2-b" x1="640" y1="110" x2="640" y2="170" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
            <!-- 光线：入射（直线传播，错误） -->
            <line id="scene2-ray-incident-b" x1="480" y1="50" x2="560" y2="110" stroke="#000000" stroke-width="2" marker-end="url(#scene2-arrow)"/>
            <!-- 光线：折射（无偏折，错误） -->
            <line id="scene2-ray-refract-b" x1="560" y1="110" x2="640" y2="135" stroke="#000000" stroke-width="2" marker-end="url(#scene2-arrow)"/>
            <!-- 光线：出射（无偏折，错误） -->
            <line id="scene2-ray-exit-b" x1="640" y1="135" x2="720" y2="195" stroke="#000000" stroke-width="2" marker-end="url(#scene2-arrow)"/>
            <!-- 选项标签（移到区域右侧，不超出画布） -->
            <text id="scene2-label-b" x="760" y="115" font-size="14px" font-weight="bold" fill="#000000" text-anchor="end">B</text>
            <!-- 高亮框（步骤 2 显示） -->
            <rect id="scene2-highlight-b" class="scene2-highlight" x="435" y="50" width="340" height="160" fill="none" stroke="#c62828" stroke-width="3"/>
            <!-- 错误标注（移到高亮框上方，垂直间距加大） -->
            <text id="scene2-wrong-b" class="scene2-annotation" x="620" y="35" font-size="12px" fill="#c62828" text-anchor="middle">✗ 错误</text>
            <text id="scene2-reason-b" class="scene2-reason" x="620" y="48" text-anchor="middle">光线未发生折射</text>

            <!-- ========== C 选项区域 (左下) ========== -->
            <!-- 玻璃砖 -->
            <rect id="scene2-glass-c" x="120" y="290" width="160" height="60" fill="#e3f2fd" fill-opacity="0.3" stroke="#1565c0" stroke-width="2"/>
            <!-- 法线 -->
            <line id="scene2-normal1-c" x1="160" y1="270" x2="160" y2="330" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
            <line id="scene2-normal2-c" x1="240" y1="310" x2="240" y2="370" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
            <!-- 光线：入射 -->
            <line id="scene2-ray-incident-c" x1="80" y1="250" x2="160" y2="310" stroke="#000000" stroke-width="2" marker-end="url(#scene2-arrow)"/>
            <!-- 光线：内部反射（错误） -->
            <line id="scene2-ray-reflect-c" x1="160" y1="310" x2="240" y2="290" stroke="#000000" stroke-width="2" marker-end="url(#scene2-arrow)"/>
            <!-- 光线：出射（下方射出） -->
            <line id="scene2-ray-exit-c" x1="160" y1="310" x2="240" y2="370" stroke="#000000" stroke-width="2" marker-end="url(#scene2-arrow)"/>
            <!-- 选项标签（移到区域右侧外部） -->
            <text id="scene2-label-c" x="385" y="335" font-size="14px" font-weight="bold" fill="#000000" text-anchor="middle">C</text>
            <!-- 高亮框（步骤 3 显示） -->
            <rect id="scene2-highlight-c" class="scene2-highlight" x="35" y="245" width="340" height="155" fill="none" stroke="#c62828" stroke-width="3"/>
            <!-- 错误标注（移到高亮框下方，控件栏上方，加大垂直间距） -->
            <text id="scene2-wrong-c" class="scene2-annotation" x="200" y="446" font-size="12px" fill="#c62828" text-anchor="middle">✗ 错误</text>
            <text id="scene2-reason-c" class="scene2-reason" x="200" y="432" text-anchor="middle">玻璃内部发生反射</text>

            <!-- ========== D 选项区域 (右下) ========== -->
            <!-- 玻璃砖 -->
            <rect id="scene2-glass-d" x="520" y="290" width="160" height="60" fill="#e3f2fd" fill-opacity="0.3" stroke="#1565c0" stroke-width="2"/>
            <!-- 法线 -->
            <line id="scene2-normal1-d" x1="560" y1="270" x2="560" y2="330" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
            <line id="scene2-normal2-d" x1="640" y1="310" x2="640" y2="370" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
            <!-- 光线：入射（无偏折，错误） -->
            <line id="scene2-ray-incident-d" x1="480" y1="250" x2="560" y2="310" stroke="#000000" stroke-width="2" marker-end="url(#scene2-arrow)"/>
            <!-- 光线：折射（无偏折，错误） -->
            <line id="scene2-ray-refract-d" x1="560" y1="310" x2="640" y2="335" stroke="#000000" stroke-width="2" marker-end="url(#scene2-arrow)"/>
            <!-- 光线：出射（偏折，错误） -->
            <line id="scene2-ray-exit-d" x1="640" y1="335" x2="720" y2="395" stroke="#000000" stroke-width="2" marker-end="url(#scene2-arrow)"/>
            <!-- 选项标签（移到区域右侧，不超出画布） -->
            <text id="scene2-label-d" x="760" y="315" font-size="14px" font-weight="bold" fill="#000000" text-anchor="end">D</text>
            <!-- 高亮框（步骤 4 显示） -->
            <rect id="scene2-highlight-d" class="scene2-highlight" x="435" y="245" width="340" height="155" fill="none" stroke="#c62828" stroke-width="3"/>
            <!-- 错误标注（移到高亮框下方，控件栏上方，加大垂直间距） -->
            <text id="scene2-wrong-d" class="scene2-annotation" x="620" y="446" font-size="12px" fill="#c62828" text-anchor="middle">✗ 错误</text>
            <text id="scene2-reason-d" class="scene2-reason" x="620" y="432" text-anchor="middle">入射时无偏折</text>
        </svg>

        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-btn-prev">◀ 上一步</button>
            <span id="scene2-step-indicator">步骤 0/4</span>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2 实现：四个选项光路对比分析

        let currentStep = 0;
        const totalSteps = 4;

        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        const stepIndicator = document.getElementById('scene2-step-indicator');

        // 高亮框和标注元素
        const highlights = {
            1: document.getElementById('scene2-highlight-a'),
            2: document.getElementById('scene2-highlight-b'),
            3: document.getElementById('scene2-highlight-c'),
            4: document.getElementById('scene2-highlight-d')
        };

        const annotations = {
            1: [document.getElementById('scene2-correct-a'), document.getElementById('scene2-reason-a')],
            2: [document.getElementById('scene2-wrong-b'), document.getElementById('scene2-reason-b')],
            3: [document.getElementById('scene2-wrong-c'), document.getElementById('scene2-reason-c')],
            4: [document.getElementById('scene2-wrong-d'), document.getElementById('scene2-reason-d')]
        };

        // 显示/隐藏工具函数
        function show(el) {
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }

        function hide(el) {
            if (el) {
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }

        // 更新显示状态
        function updateDisplay() {
            // 隐藏所有高亮框和标注
            for (let i = 1; i <= 4; i++) {
                hide(highlights[i]);
                if (annotations[i]) {
                    annotations[i].forEach(el => hide(el));
                }
            }

            // 显示当前步骤的高亮框和标注
            if (currentStep > 0 && highlights[currentStep]) {
                show(highlights[currentStep]);
                if (annotations[currentStep]) {
                    annotations[currentStep].forEach(el => show(el));
                }
            }

            // 更新步骤指示
            stepIndicator.textContent = '步骤 ' + currentStep + '/4';

            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === 4);
        }

        // 按钮事件
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < 4) {
                currentStep++;
                updateDisplay();
            }
        });

        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
