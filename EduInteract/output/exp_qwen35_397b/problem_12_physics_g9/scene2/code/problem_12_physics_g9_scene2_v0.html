<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>隔离法受力分析 - 弹簧测力计</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene2-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene2-svg {
            width: 800px;
            height: 500px;
        }
        .scene2-element {
            transition: opacity 0.3s ease-in-out;
        }
        .scene2-hidden {
            opacity: 0;
            display: none;
        }
        #scene2-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }
        #scene2-btn-prev, #scene2-btn-next {
            width: 80px;
            height: 30px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #333;
            border-radius: 4px;
            background: #f0f0f0;
        }
        #scene2-btn-prev:hover, #scene2-btn-next:hover {
            background: #e0e0e0;
        }
        #scene2-btn-prev:disabled, #scene2-btn-next:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #scene2-step-indicator {
            font-size: 16px;
            font-weight: bold;
            min-width: 40px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500">
            <!-- 隔离框 A: (100,150)-(300,250) 200×100 -->
            <rect id="scene2-box-a" x="100" y="150" width="200" height="100" 
                  fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 隔离框 B: (500,150)-(700,250) 200×100 -->
            <rect id="scene2-box-b" x="500" y="150" width="200" height="100" 
                  fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 框 A 标签: (190,130) -->
            <text id="scene2-label-a" x="190" y="130" text-anchor="middle" 
                  font-size="20" font-weight="bold" class="scene2-element">A</text>
            
            <!-- 框 B 标签: (590,130) -->
            <text id="scene2-label-b" x="590" y="130" text-anchor="middle" 
                  font-size="20" font-weight="bold" class="scene2-element">B</text>
            
            <!-- F_手对 A 箭头: (50,200)-(100,200) 蓝色 向左 -->
            <g id="scene2-arrow-hand-a" class="scene2-element scene2-hidden">
                <line x1="50" y1="200" x2="100" y2="200" stroke="#1565c0" stroke-width="4"/>
                <polygon points="50,200 60,195 60,205" fill="#1565c0"/>
                <!-- 8N 标注: (65,180) -->
                <text x="65" y="180" text-anchor="middle" font-size="16" fill="#1565c0" font-weight="bold">8N</text>
                <!-- 力名称标签: (65,220) -->
                <text x="65" y="220" text-anchor="middle" font-size="12" fill="#1565c0">F_手对 A</text>
            </g>
            
            <!-- F_B 对 A 箭头: (300,200)-(350,200) 蓝色 向右 -->
            <g id="scene2-arrow-b-on-a" class="scene2-element scene2-hidden">
                <line x1="300" y1="200" x2="350" y2="200" stroke="#1565c0" stroke-width="4"/>
                <polygon points="350,200 340,195 340,205" fill="#1565c0"/>
                <!-- 8N 标注: (315,180) -->
                <text x="315" y="180" text-anchor="middle" font-size="16" fill="#1565c0" font-weight="bold">8N</text>
                <!-- 力名称标签: (315,220) -->
                <text x="315" y="220" text-anchor="middle" font-size="12" fill="#1565c0">F_B 对 A</text>
            </g>
            
            <!-- F_A 对 B 箭头: (450,200)-(500,200) 绿色 向左 -->
            <g id="scene2-arrow-a-on-b" class="scene2-element scene2-hidden">
                <line x1="450" y1="200" x2="500" y2="200" stroke="#2e7d32" stroke-width="4"/>
                <polygon points="450,200 460,195 460,205" fill="#2e7d32"/>
                <!-- 8N 标注: (465,180) -->
                <text x="465" y="180" text-anchor="middle" font-size="16" fill="#2e7d32" font-weight="bold">8N</text>
                <!-- 力名称标签: (465,220) -->
                <text x="465" y="220" text-anchor="middle" font-size="12" fill="#2e7d32">F_A 对 B</text>
            </g>
            
            <!-- F_手对 B 箭头: (700,200)-(750,200) 绿色 向右 -->
            <g id="scene2-arrow-hand-b" class="scene2-element scene2-hidden">
                <line x1="700" y1="200" x2="750" y2="200" stroke="#2e7d32" stroke-width="4"/>
                <polygon points="750,200 740,195 740,205" fill="#2e7d32"/>
                <!-- 8N 标注: (715,180) -->
                <text x="715" y="180" text-anchor="middle" font-size="16" fill="#2e7d32" font-weight="bold">8N</text>
                <!-- 力名称标签: (715,220) -->
                <text x="715" y="220" text-anchor="middle" font-size="12" fill="#2e7d32">F_手对 B</text>
            </g>
            
            <!-- 作用力对连线: (320,200)-(480,200) 红色虚线 -->
            <g id="scene2-action-pair" class="scene2-element scene2-hidden">
                <line x1="320" y1="200" x2="480" y2="200" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5"/>
                <!-- 作用力对标签: (400,160) 调整后的坐标 -->
                <text x="400" y="160" text-anchor="middle" font-size="14" fill="#c62828">作用力与反作用力</text>
            </g>
            
            <!-- 平衡方程框: (200,320)-(600,410) 400×90 调整位置和大小 -->
            <g id="scene2-equation-box" class="scene2-element scene2-hidden">
                <rect x="200" y="320" width="400" height="90" 
                      fill="#ffffff" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>
                <!-- 方程文本 1: (220,345) 行间距调整为 28px -->
                <text x="220" y="345" font-size="14" fill="#333333">对 A: F_手对 A = F_B 对 A = 8N</text>
                <!-- 方程文本 2: (220,373) -->
                <text x="220" y="373" font-size="14" fill="#333333">对 B: F_A 对 B = F_手对 B = 8N</text>
                <!-- 结论文本: (220,401) -->
                <text x="220" y="401" font-size="14" fill="#333333" font-weight="bold">∴ B 读数 = 8N, 手拉力 = 8N</text>
            </g>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-btn-prev">◀ 上一步</button>
            <span id="scene2-step-indicator">0/5</span>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现 - 隔离法受力分析
        
        // 状态变量
        let currentStep = 0;
        const totalSteps = 5;
        
        // 每步应显示的元素 ID 列表
        const steps = [
            [], // 步骤 0: 只显示隔离框和标签（默认显示）
            ['scene2-arrow-hand-a', 'scene2-arrow-b-on-a'], // 步骤 1: A 的受力
            ['scene2-arrow-hand-a', 'scene2-arrow-b-on-a', 'scene2-arrow-a-on-b', 'scene2-arrow-hand-b'], // 步骤 2: B 的受力
            ['scene2-arrow-hand-a', 'scene2-arrow-b-on-a', 'scene2-arrow-a-on-b', 'scene2-arrow-hand-b', 'scene2-action-pair'], // 步骤 3: 作用力对
            ['scene2-arrow-hand-a', 'scene2-arrow-b-on-a', 'scene2-arrow-a-on-b', 'scene2-arrow-hand-b', 'scene2-action-pair', 'scene2-equation-box'] // 步骤 4: 平衡方程
        ];
        
        // DOM 元素
        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        const stepIndicator = document.getElementById('scene2-step-indicator');
        
        // 显示/隐藏元素工具函数
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene2-hidden');
                el.style.display = '';
                el.style.opacity = '1';
            }
        }
        
        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.add('scene2-hidden');
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }
        
        // 渲染当前步骤
        function renderStep() {
            // 更新步骤指示器
            stepIndicator.textContent = currentStep + '/' + totalSteps;
            
            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps);
            
            // 获取当前步骤应显示的元素
            const visibleElements = steps[currentStep];
            
            // 所有可控制的元素 ID
            const allElements = [
                'scene2-arrow-hand-a',
                'scene2-arrow-b-on-a',
                'scene2-arrow-a-on-b',
                'scene2-arrow-hand-b',
                'scene2-action-pair',
                'scene2-equation-box'
            ];
            
            // 遍历所有元素，决定显示或隐藏
            allElements.forEach(id => {
                if (visibleElements.includes(id)) {
                    showElement(id);
                } else {
                    hideElement(id);
                }
            });
        }
        
        // 上一步
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        });
        
        // 下一步
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                renderStep();
            }
        });
        
        // 初始化
        renderStep();
    })();
    </script>
</body>
</html>
