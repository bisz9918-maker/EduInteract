<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>罂粟碱分子结构拆解</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        .scene1-btn {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #333;
            border-radius: 4px;
            background: #f0f0f0;
        }
        .scene1-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .scene1-btn:hover:not(:disabled) {
            background: #e0e0e0;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <!-- 
            布局坐标表（参考 spec.json，已调整避开重叠）：
            | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
            |------|------|-----------|------|-------------|------|
            | 异喹啉环系统 | 多边形路径 | (180,180)-(340,300) | ~160×120 | - | 左侧稠环结构，上移 20px |
            | 亚甲基桥 -CH₂- | 线段 | (340,240)-(390,240) | 50×4 | - | 连接左右两部分 |
            | 右侧苯环 | 六边形路径 | (390,160)-(520,280) | ~130×120 | - | 右侧独立苯环，上移 20px |
            | 甲氧基 1 | 短线+标签 | (160,220) | 25×4 | 左侧 | 异喹啉环左上方 |
            | 甲氧基 2 | 短线+标签 | (160,260) | 25×4 | 左侧 | 异喹啉环左下方 |
            | 甲氧基 3 | 短线+标签 | (480,140) | 25×4 | 上方 | 右侧苯环顶部 |
            | 甲氧基 4 | 短线+标签 | (530,180) | 25×4 | 右侧 | 右侧苯环右上 |
            | 氮原子 N | 字母 | (320,280) | 12×14 | 右下 | 异喹啉环内，上移 20px |
            | 结构标签 | text | y=330-350 | - | 下方 | 各结构下方 |
            | 原子计数区 | 文本框 | (100,370)-(700,420) | 600×50 | - | 底部汇总区域，上移 |
            | 分子式标签 | text | (400,445) | - | - | 底部居中，最终显示 |
            | 控件栏 | button | y=460-480 | - | - | 底部按钮 |
            -->
            
            <!-- 异喹啉环高亮区域（步骤 1 显示） -->
            <polygon id="scene1-isoquinoline-highlight" 
                     points="170,160 350,160 350,310 170,310" 
                     fill="#1565c0" 
                     fill-opacity="0" 
                     stroke="none"/>
            
            <!-- 右侧苯环高亮区域（步骤 2 显示） -->
            <polygon id="scene1-benzene-highlight" 
                     points="380,130 540,130 540,290 380,290" 
                     fill="#2e7d32" 
                     fill-opacity="0" 
                     stroke="none"/>
            
            <!-- 亚甲基桥高亮区域（步骤 2 显示） -->
            <rect id="scene1-methylene-highlight" 
                  x="345" y="225" width="50" height="30" 
                  fill="none" 
                  stroke="#888888" 
                  stroke-width="2" 
                  stroke-dasharray="5,5"
                  opacity="0"/>
            
            <!-- 分子骨架路径 -->
            <g id="scene1-molecule-skeleton" stroke="#000000" stroke-width="2" fill="none">
                <!-- 异喹啉环系统 - 左侧苯环部分 -->
                <path d="M 190,215 L 220,195 L 260,195 L 290,215 L 260,235 L 220,235 Z"/>
                <!-- 双键内圈（苯环特征） -->
                <path d="M 200,215 L 220,202 L 255,202 L 280,215 L 255,228 L 220,228 Z"/>
                
                <!-- 异喹啉环系统 - 右侧含氮杂环部分 -->
                <path d="M 290,215 L 320,195 L 350,215 L 350,255 L 320,275 L 290,255 Z"/>
                <!-- 双键内圈 -->
                <path d="M 290,220 L 320,205 L 340,220 L 340,250 L 320,265 L 290,250 Z"/>
                
                <!-- 稠合边（两个环共享的边） -->
                <line x1="290" y1="215" x2="290" y2="255"/>
                
                <!-- 亚甲基桥（连接异喹啉环和右侧苯环） -->
                <line id="scene1-methylene-bridge" x1="350" y1="235" x2="400" y2="235"/>
                
                <!-- 右侧苯环 -->
                <path d="M 400,235 L 430,215 L 470,215 L 500,235 L 470,255 L 430,255 Z"/>
                <!-- 双键内圈 -->
                <path d="M 410,235 L 430,222 L 465,222 L 490,235 L 465,248 L 430,248 Z"/>
                
                <!-- 甲氧基 1（异喹啉环左上方） -->
                <line x1="190" y1="215" x2="160" y2="215"/>
                
                <!-- 甲氧基 2（异喹啉环左下方） -->
                <line x1="220" y1="235" x2="190" y2="255"/>
                
                <!-- 甲氧基 3（右侧苯环顶部） -->
                <line x1="470" y1="215" x2="470" y2="180"/>
                
                <!-- 甲氧基 4（右侧苯环右侧） -->
                <line x1="500" y1="235" x2="535" y2="235"/>
            </g>
            
            <!-- 氮原子 N（放在含氮杂环右下角顶点处，避开线条） -->
            <text id="scene1-nitrogen" x="320" y="295" font-size="16" fill="#000000" text-anchor="middle">N</text>
            
            <!-- 甲氧基标签（初始隐藏，步骤 3 显示） -->
            <text id="scene1-methoxy-label-1" x="145" y="215" font-size="13" fill="#000000" text-anchor="end" opacity="0">OCH₃</text>
            <text id="scene1-methoxy-label-2" x="175" y="275" font-size="13" fill="#000000" text-anchor="start" opacity="0">OCH₃</text>
            <text id="scene1-methoxy-label-3" x="470" y="165" font-size="13" fill="#000000" text-anchor="middle" opacity="0">OCH₃</text>
            <text id="scene1-methoxy-label-4" x="555" y="240" font-size="13" fill="#000000" text-anchor="start" opacity="0">OCH₃</text>
            
            <!-- 甲氧基圆圈标记（步骤 3 显示） -->
            <circle id="scene1-methoxy-circle-1" cx="175" cy="215" r="18" fill="none" stroke="#c62828" stroke-width="2" opacity="0"/>
            <circle id="scene1-methoxy-circle-2" cx="205" cy="245" r="18" fill="none" stroke="#c62828" stroke-width="2" opacity="0"/>
            <circle id="scene1-methoxy-circle-3" cx="470" cy="197" r="18" fill="none" stroke="#c62828" stroke-width="2" opacity="0"/>
            <circle id="scene1-methoxy-circle-4" cx="517" cy="235" r="18" fill="none" stroke="#c62828" stroke-width="2" opacity="0"/>
            
            <!-- 结构标签（初始隐藏） -->
            <text id="scene1-label-isoquinoline" x="260" y="330" font-size="14" fill="#1565c0" text-anchor="middle" opacity="0">异喹啉环</text>
            <text id="scene1-label-benzene" x="460" y="330" font-size="14" fill="#2e7d32" text-anchor="middle" opacity="0">苯环</text>
            <text id="scene1-label-methylene" x="370" y="310" font-size="14" fill="#888888" text-anchor="middle" opacity="0">亚甲基桥</text>
            
            <!-- 原子计数区（步骤 4 显示） -->
            <text id="scene1-atom-count" x="400" y="365" font-size="13" fill="#000000" text-anchor="middle" opacity="0">
                <tspan x="400" dy="0" fill="#1565c0">异喹啉环：C₉H₆N</tspan>
                <tspan x="400" dy="22" fill="#2e7d32">苯环：C₆H₃</tspan>
                <tspan x="400" dy="22" fill="#888888">亚甲基桥：CH₂</tspan>
                <tspan x="400" dy="22" fill="#c62828">甲氧基×4：C₄H₁₂O₄</tspan>
            </text>
            
            <!-- 最终分子式（步骤 5 显示） -->
            <text id="scene1-molecular-formula" x="400" y="415" font-size="18" fill="#000000" text-anchor="middle" font-weight="bold" opacity="0">
                分子式：<tspan font-family="serif">C₂₀H₂₁NO₄</tspan>
            </text>
            
            <!-- 控件栏（放在 SVG 内部底部） -->
            <g id="scene1-controls-group">
                <button id="scene1-btn-prev" class="scene1-btn" transform="translate(320,455)">◀ 上一步</button>
                <text id="scene1-step-indicator" x="400" y="477" font-size="14" fill="#000000" text-anchor="middle">步骤 0/5</text>
                <button id="scene1-btn-next" class="scene1-btn" transform="translate(480,455)">下一步 ▶</button>
            </g>
        </svg>
    </div>
    
    <script>
    (function() {
        // Scene 1: 罂粟碱分子结构拆解
        
        const currentState = { step: 0 };
        const totalSteps = 5;
        
        // 获取 DOM 元素
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        
        // 高亮和标签元素
        const isoquinolineHighlight = document.getElementById('scene1-isoquinoline-highlight');
        const benzeneHighlight = document.getElementById('scene1-benzene-highlight');
        const methyleneHighlight = document.getElementById('scene1-methylene-highlight');
        
        const labelIsoquinoline = document.getElementById('scene1-label-isoquinoline');
        const labelBenzene = document.getElementById('scene1-label-benzene');
        const labelMethylene = document.getElementById('scene1-label-methylene');
        
        const methoxyCircles = [
            document.getElementById('scene1-methoxy-circle-1'),
            document.getElementById('scene1-methoxy-circle-2'),
            document.getElementById('scene1-methoxy-circle-3'),
            document.getElementById('scene1-methoxy-circle-4')
        ];
        
        const methoxyLabels = [
            document.getElementById('scene1-methoxy-label-1'),
            document.getElementById('scene1-methoxy-label-2'),
            document.getElementById('scene1-methoxy-label-3'),
            document.getElementById('scene1-methoxy-label-4')
        ];
        
        const atomCount = document.getElementById('scene1-atom-count');
        const molecularFormula = document.getElementById('scene1-molecular-formula');
        
        // 显示/隐藏辅助函数
        function show(el) {
            if (el) {
                el.style.opacity = '1';
                el.style.display = '';
            }
        }
        
        function hide(el) {
            if (el) {
                el.style.opacity = '0';
                el.style.display = '';
            }
        }
        
        // 更新按钮状态
        function updateButtons() {
            btnPrev.disabled = currentState.step === 0;
            btnNext.disabled = currentState.step === totalSteps;
            stepIndicator.textContent = '步骤 ' + currentState.step + '/' + totalSteps;
        }
        
        // 渲染当前步骤
        function render() {
            // 重置所有元素状态
            hide(isoquinolineHighlight);
            hide(benzeneHighlight);
            hide(methyleneHighlight);
            hide(labelIsoquinoline);
            hide(labelBenzene);
            hide(labelMethylene);
            methoxyCircles.forEach(el => hide(el));
            methoxyLabels.forEach(el => hide(el));
            hide(atomCount);
            hide(molecularFormula);
            
            // 根据当前步骤显示相应元素
            if (currentState.step >= 1) {
                show(isoquinolineHighlight);
                isoquinolineHighlight.setAttribute('fill-opacity', '0.2');
                show(labelIsoquinoline);
            }
            
            if (currentState.step >= 2) {
                show(benzeneHighlight);
                benzeneHighlight.setAttribute('fill-opacity', '0.2');
                show(methyleneHighlight);
                show(labelBenzene);
                show(labelMethylene);
            }
            
            if (currentState.step >= 3) {
                methoxyCircles.forEach(el => show(el));
                methoxyLabels.forEach(el => show(el));
            }
            
            if (currentState.step >= 4) {
                show(atomCount);
            }
            
            if (currentState.step >= 5) {
                show(molecularFormula);
            }
            
            updateButtons();
        }
        
        // 按钮事件处理
        btnPrev.addEventListener('click', function() {
            if (currentState.step > 0) {
                currentState.step--;
                render();
            }
        });
        
        btnNext.addEventListener('click', function() {
            if (currentState.step < totalSteps) {
                currentState.step++;
                render();
            }
        });
        
        // 初始化
        render();
        
    })();
    </script>
</body>
</html>
