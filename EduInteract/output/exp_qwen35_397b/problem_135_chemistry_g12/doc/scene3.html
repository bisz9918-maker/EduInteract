<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>溶液导电性变化曲线图</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #scene3-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene3-svg {
            width: 800px;
            height: 500px;
        }
        /* 曲线样式 */
        .scene3-curve-a {
            fill: none;
            stroke: #c62828;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .scene3-curve-b {
            fill: none;
            stroke: #1565c0;
            stroke-width: 2;
            stroke-dasharray: 8, 4;
        }
        .scene3-curve-c {
            fill: none;
            stroke: #2e7d32;
            stroke-width: 2;
            stroke-dasharray: 12, 4, 4, 4;
        }
        .scene3-curve-d {
            fill: none;
            stroke: #7b1fa2;
            stroke-width: 2;
            stroke-dasharray: 4, 4;
        }
        /* 高亮效果 */
        .scene3-curve-a.highlight {
            stroke-width: 4;
        }
        /* 峰值点闪烁动画 */
        @keyframes scene3-peak-pulse {
            0%, 100% { opacity: 1; r: 6; }
            50% { opacity: 0.6; r: 8; }
        }
        .scene3-peak-point {
            fill: #c62828;
            animation: scene3-peak-pulse 1.5s ease-in-out infinite;
        }
        /* 曲线绘制动画 */
        .scene3-curve-animate {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: scene3-draw 800ms ease-out forwards;
        }
        @keyframes scene3-draw {
            to { stroke-dashoffset: 0; }
        }
        /* 图例高亮 */
        .scene3-legend-item {
            font-size: 13px;
            fill: #333;
        }
        .scene3-legend-item.highlight {
            font-weight: bold;
            fill: #000;
        }
        .scene3-legend-line {
            stroke-width: 2;
        }
        /* 按钮样式 */
        .scene3-btn {
            background: #4a90d9;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .scene3-btn:hover:not(:disabled) {
            background: #357abd;
        }
        .scene3-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .scene3-step-indicator {
            font-size: 14px;
            fill: #666;
            text-anchor: middle;
        }
        /* 元素显隐控制 */
        .scene3-hidden {
            display: none;
            opacity: 0;
        }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg id="scene3-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 坐标系背景 -->
            <rect id="scene3-coord-bg" x="80" y="50" width="670" height="350" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
            
            <!-- 网格线（横向） -->
            <g id="scene3-grid-h">
                <line x1="80" y1="80" x2="750" y2="80" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,4"/>
                <line x1="80" y1="150" x2="750" y2="150" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,4"/>
                <line x1="80" y1="220" x2="750" y2="220" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,4"/>
                <line x1="80" y1="290" x2="750" y2="290" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,4"/>
                <line x1="80" y1="360" x2="750" y2="360" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,4"/>
            </g>
            
            <!-- 网格线（纵向） -->
            <g id="scene3-grid-v">
                <line x1="150" y1="50" x2="150" y2="400" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,4"/>
                <line x1="250" y1="50" x2="250" y2="400" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,4"/>
                <line x1="350" y1="50" x2="350" y2="400" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,4"/>
                <line x1="450" y1="50" x2="450" y2="400" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,4"/>
                <line x1="550" y1="50" x2="550" y2="400" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,4"/>
                <line x1="650" y1="50" x2="650" y2="400" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,4"/>
            </g>
            
            <!-- 坐标轴 -->
            <line id="scene3-xaxis" x1="80" y1="400" x2="750" y2="400" stroke="#000" stroke-width="2"/>
            <line id="scene3-yaxis" x1="80" y1="400" x2="80" y2="50" stroke="#000" stroke-width="2"/>
            
            <!-- 坐标轴箭头 -->
            <polygon points="750,400 740,395 740,405" fill="#000"/>
            <polygon points="80,50 75,60 85,60" fill="#000"/>
            
            <!-- 坐标轴标签 -->
            <text id="scene3-xlabel" x="415" y="435" text-anchor="middle" font-size="14" fill="#000">加入试剂体积 V/mL</text>
            <text id="scene3-ylabel" x="25" y="225" text-anchor="middle" font-size="14" fill="#000" transform="rotate(-90, 25, 225)">导电性 κ</text>
            <text id="scene3-origin" x="65" y="415" font-size="12" fill="#000">O</text>
            
            <!-- 曲线 A：醋酸+氨水（峰形） -->
            <path id="scene3-curve-a" class="scene3-curve-a scene3-hidden" 
                  d="M 100 350 Q 250 200 400 100 T 700 280"/>
            
            <!-- 曲线 B：AgNO3+HCl（近似水平） -->
            <path id="scene3-curve-b" class="scene3-curve-b scene3-hidden" 
                  d="M 100 350 Q 400 345 700 340"/>
            
            <!-- 曲线 C：盐酸+NaCl（缓慢上升） -->
            <path id="scene3-curve-c" class="scene3-curve-c scene3-hidden" 
                  d="M 100 350 Q 400 325 700 300"/>
            
            <!-- 曲线 D：H2SO4+BaCl2（近似水平略降） -->
            <path id="scene3-curve-d" class="scene3-curve-d scene3-hidden" 
                  d="M 100 350 Q 400 355 700 360"/>
            
            <!-- 峰值点标记 -->
            <circle id="scene3-peak-point" class="scene3-peak-point scene3-hidden" cx="400" cy="100" r="6"/>
            
            <!-- 峰值标签 -->
            <text id="scene3-peak-label" class="scene3-hidden" x="400" y="75" text-anchor="middle" font-size="13" fill="#c62828" font-weight="bold">最大导电性</text>
            
            <!-- 起点标注 -->
            <text id="scene3-start-label" class="scene3-hidden" x="90" y="370" font-size="12" fill="#666">起始点</text>
            
            <!-- 图例框 -->
            <rect id="scene3-legend-box" x="580" y="70" width="160" height="110" fill="#ffffff" stroke="#000" stroke-width="1"/>
            <text x="590" y="90" font-size="13" fill="#000" font-weight="bold">图例</text>
            
            <!-- 图例 A -->
            <g id="scene3-legend-a" class="scene3-legend-item">
                <line x1="590" y1="105" x2="620" y2="105" class="scene3-curve-a scene3-legend-line"/>
                <text x="628" y="109" font-size="13" fill="#333">A:醋酸+氨水</text>
            </g>
            
            <!-- 图例 B -->
            <g id="scene3-legend-b" class="scene3-legend-item">
                <line x1="590" y1="125" x2="620" y2="125" class="scene3-curve-b scene3-legend-line"/>
                <text x="628" y="129" font-size="13" fill="#333">B:AgNO₃+HCl</text>
            </g>
            
            <!-- 图例 C -->
            <g id="scene3-legend-c" class="scene3-legend-item">
                <line x1="590" y1="145" x2="620" y2="145" class="scene3-curve-c scene3-legend-line"/>
                <text x="628" y="149" font-size="13" fill="#333">C:盐酸+NaCl</text>
            </g>
            
            <!-- 图例 D -->
            <g id="scene3-legend-d" class="scene3-legend-item">
                <line x1="590" y1="165" x2="620" y2="165" class="scene3-curve-d scene3-legend-line"/>
                <text x="628" y="169" font-size="13" fill="#333">D:H₂SO₄+BaCl₂</text>
            </g>
            
            <!-- 步骤指示器 -->
            <text id="scene3-step-indicator" x="400" y="475" class="scene3-step-indicator">步骤 0/5</text>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene3-controls" style="position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px;">
            <button id="scene3-btn-prev" class="scene3-btn" disabled>◀ 上一步</button>
            <button id="scene3-btn-next" class="scene3-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 3: 溶液导电性变化曲线图
        // 布局坐标表（实现对照依据）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // |------|------|-----------|------|-------------|------|
        // | 坐标系背景 | rect | (80,50)-(750,400) | 670×350 | - | 绘图区域 |
        // | 网格线(横) | line | 5条 | - | - | y=80,150,220,290,360 |
        // | 网格线(纵) | line | 6条 | - | - | x=150,250,350,450,550,650 |
        // | X轴 | line | (80,400)-(750,400) | 670×2 | - | 横轴 |
        // | Y轴 | line | (80,400)-(80,50) | 2×350 | - | 纵轴 |
        // | X轴标签 | text | (415,435) | ~120×18 | - | "加入试剂体积 V/mL" |
        // | Y轴标签 | text | (25,225) | ~18×100 | 逆时针 | "导电性κ" |
        // | 原点O | text | (65,415) | ~12×14 | 左下 | 坐标原点 |
        // | 曲线A | path | (100,350)→(400,100)→(700,280) | - | - | 红色实线粗线 |
        // | 曲线B | path | (100,350)→(700,340) | - | - | 蓝色虚线 |
        // | 曲线C | path | (100,350)→(700,300) | - | - | 绿色点划线 |
        // | 曲线D | path | (100,350)→(700,360) | - | - | 紫色点线 |
        // | 峰值点标记 | circle | (400,100) | r=6 | - | 曲线A最高点 |
        // | 峰值标签 | text | (400,75) | ~80×16 | 上方 | "最大导电性" |
        // | 起点标注 | text | (90,370) | ~30×14 | 下方 | "起始点" |
        // | 图例框 | rect | (580,70)-(740,180) | 160×110 | - | 右上角 |
        // | 图例A | text+line | (590,90) | ~100×14 | - | "A:醋酸+氨水" |
        // | 图例B | text+line | (590,115) | ~110×14 | - | "B:AgNO₃+HCl" |
        // | 图例C | text+line | (590,140) | ~110×14 | - | "C:盐酸+NaCl" |
        // | 图例D | text+line | (590,165) | ~120×14 | - | "D:H₂SO₄+BaCl₂" |
        // | 控件栏 | div | (250,450)-(550,490) | 300×40 | - | 按钮区域 |
        // | 上一步按钮 | button | (260,460) | 80×30 | - | "◀上一步" |
        // | 下一步按钮 | button | (460,460) | 80×30 | - | "下一步▶" |
        // | 步骤指示 | text | (380,470) | ~60×16 | - | "步骤 X/5" |

        // 状态变量
        let currentStep = 0;
        const totalSteps = 5;

        // DOM 元素引用
        const curveA = document.getElementById('scene3-curve-a');
        const curveB = document.getElementById('scene3-curve-b');
        const curveC = document.getElementById('scene3-curve-c');
        const curveD = document.getElementById('scene3-curve-d');
        const peakPoint = document.getElementById('scene3-peak-point');
        const peakLabel = document.getElementById('scene3-peak-label');
        const startLabel = document.getElementById('scene3-start-label');
        const legendA = document.getElementById('scene3-legend-a');
        const legendB = document.getElementById('scene3-legend-b');
        const legendC = document.getElementById('scene3-legend-c');
        const legendD = document.getElementById('scene3-legend-d');
        const stepIndicator = document.getElementById('scene3-step-indicator');
        const btnPrev = document.getElementById('scene3-btn-prev');
        const btnNext = document.getElementById('scene3-btn-next');

        // 工具函数：显示元素
        function show(el) {
            if (el) {
                el.classList.remove('scene3-hidden');
                el.style.display = '';
                el.style.opacity = '1';
            }
        }

        // 工具函数：隐藏元素
        function hide(el) {
            if (el) {
                el.classList.add('scene3-hidden');
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }

        // 清除所有曲线高亮
        function clearHighlights() {
            curveA.classList.remove('highlight');
            legendA.classList.remove('highlight');
            legendB.classList.remove('highlight');
            legendC.classList.remove('highlight');
            legendD.classList.remove('highlight');
        }

        // 更新视图
        function updateView() {
            // 更新步骤指示器
            stepIndicator.textContent = '步骤 ' + currentStep + '/' + totalSteps;
            
            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps);
            
            // 根据步骤显示/隐藏元素
            clearHighlights();
            
            // 步骤 0：只显示坐标系（初始状态）
            if (currentStep === 0) {
                hide(curveA);
                hide(curveB);
                hide(curveC);
                hide(curveD);
                hide(peakPoint);
                hide(peakLabel);
                hide(startLabel);
            }
            // 步骤 1：显示曲线 A
            else if (currentStep === 1) {
                show(curveA);
                curveA.classList.add('scene3-curve-animate', 'highlight');
                show(peakPoint);
                show(peakLabel);
                show(startLabel);
                hide(curveB);
                hide(curveC);
                hide(curveD);
                legendA.classList.add('highlight');
            }
            // 步骤 2：显示曲线 B
            else if (currentStep === 2) {
                show(curveA);
                curveA.classList.remove('scene3-curve-animate');
                show(curveB);
                curveB.classList.add('scene3-curve-animate');
                show(peakPoint);
                show(peakLabel);
                show(startLabel);
                hide(curveC);
                hide(curveD);
                legendB.classList.add('highlight');
            }
            // 步骤 3：显示曲线 C
            else if (currentStep === 3) {
                show(curveA);
                curveA.classList.remove('scene3-curve-animate');
                show(curveB);
                curveB.classList.remove('scene3-curve-animate');
                show(curveC);
                curveC.classList.add('scene3-curve-animate');
                show(peakPoint);
                show(peakLabel);
                show(startLabel);
                hide(curveD);
                legendC.classList.add('highlight');
            }
            // 步骤 4：显示曲线 D
            else if (currentStep === 4) {
                show(curveA);
                curveA.classList.remove('scene3-curve-animate');
                show(curveB);
                curveB.classList.remove('scene3-curve-animate');
                show(curveC);
                curveC.classList.remove('scene3-curve-animate');
                show(curveD);
                curveD.classList.add('scene3-curve-animate');
                show(peakPoint);
                show(peakLabel);
                show(startLabel);
                legendD.classList.add('highlight');
            }
            // 步骤 5：最终状态，曲线 A 重新高亮
            else if (currentStep === 5) {
                show(curveA);
                curveA.classList.remove('scene3-curve-animate');
                curveA.classList.add('highlight');
                show(curveB);
                show(curveC);
                show(curveD);
                curveD.classList.remove('scene3-curve-animate');
                show(peakPoint);
                show(peakLabel);
                show(startLabel);
                legendA.classList.add('highlight');
            }
        }

        // 下一步
        function stepForward() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateView();
            }
        }

        // 上一步
        function stepBackward() {
            if (currentStep > 0) {
                currentStep--;
                updateView();
            }
        }

        // 事件绑定
        btnNext.addEventListener('click', stepForward);
        btnPrev.addEventListener('click', stepBackward);

        // 初始化视图
        updateView();
    })();
    </script>
</body>
</html>
