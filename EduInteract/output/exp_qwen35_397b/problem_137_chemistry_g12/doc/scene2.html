<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>选项 C 反应计量对比 - 有机化合物分析</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #scene2-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene2-svg {
            width: 800px;
            height: 500px;
        }
        .scene2-highlight-blue {
            fill: rgba(21, 101, 192, 0.2);
            stroke: #1565c0;
            stroke-width: 2;
        }
        .scene2-highlight-red {
            fill: rgba(198, 40, 40, 0.2);
            stroke: #c62828;
            stroke-width: 2;
        }
        .scene2-label {
            font-size: 13px;
            fill: #333333;
        }
        .scene2-total {
            font-size: 16px;
            font-weight: bold;
            fill: #333333;
        }
        .scene2-check {
            fill: #2e7d32;
            font-size: 20px;
        }
        .scene2-cross {
            fill: #c62828;
            font-size: 20px;
        }
        .scene2-comparison-text {
            font-size: 14px;
            fill: #333333;
        }
        .scene2-btn-rect {
            cursor: pointer;
        }
        .scene2-btn-rect:hover {
            fill: #e3f2fd !important;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500">
            <!-- 分子骨架 - 根据题目图片绘制 -->
            <!-- 从左到右：乙酸酯基 - 双键 - 手性碳 (连乙酸酯) - 手性碳 (连乙酸酯) - 双键 - 共轭双键系统 -->
            
            <g id="scene2-molecule" stroke="#000000" stroke-width="2" fill="none">
                <!-- 左侧乙酸酯基 CH3COO- -->
                <path d="M 120 250 L 150 250"/> <!-- O-CH2 -->
                <path d="M 150 250 L 170 230"/> <!-- CH2-CH= -->
                <line x1="150" y1="250" x2="150" y2="220"/> <!-- O-CO-CH3 向上 -->
                <line x1="150" y1="220" x2="130" y2="200"/> <!-- CO 双键 -->
                <line x1="150" y1="220" x2="170" y2="200"/> <!-- O-CH3 -->
                
                <!-- 第一个双键 C=C -->
                <path d="M 170 230 L 210 230"/>
                <line x1="175" y1="235" x2="205" y2="235"/> <!-- 双键的第二条线 -->
                
                <!-- 连接到手性碳 -->
                <path d="M 210 230 L 230 210"/>
                
                <!-- 手性碳 1 - 连接上方乙酸酯 -->
                <path d="M 230 210 L 230 180"/> <!-- 向上连乙酸酯 -->
                <line x1="230" y1="180" x2="210" y2="160"/> <!-- CO 双键 -->
                <line x1="230" y1="180" x2="250" y2="160"/> <!-- O-CH3 -->
                
                <!-- 手性碳 1 到手性碳 2 -->
                <path d="M 230 210 L 270 210"/>
                
                <!-- 手性碳 2 - 连接下方乙酸酯 -->
                <path d="M 270 210 L 270 240"/> <!-- 向下连乙酸酯 -->
                <line x1="270" y1="240" x2="250" y2="260"/> <!-- CO 双键 -->
                <line x1="270" y1="240" x2="290" y2="260"/> <!-- O-CH3 -->
                
                <!-- 手性碳 2 到第二个双键 -->
                <path d="M 270 210 L 310 210"/>
                
                <!-- 第二个双键 C=C -->
                <path d="M 310 210 L 350 210"/>
                <line x1="315" y1="215" x2="345" y2="215"/>
                
                <!-- 连接到甲基取代的碳 -->
                <path d="M 350 210 L 370 190"/>
                <line x1="370" y1="190" x2="370" y2="170"/> <!-- 甲基向上 -->
                
                <!-- 第三个双键 (共轭双键 1) -->
                <path d="M 370 190 L 410 190"/>
                <line x1="375" y1="195" x2="405" y2="195"/>
                
                <!-- 共轭双键 2 -->
                <path d="M 410 190 L 450 210"/>
                <line x1="415" y1="195" x2="445" y2="205"/>
                
                <!-- 第四个双键 (共轭双键 3) -->
                <path d="M 450 210 L 490 210"/>
                <line x1="455" y1="215" x2="485" y2="215"/>
                
                <!-- 连接到末端甲基取代 -->
                <path d="M 490 210 L 510 190"/>
                <line x1="510" y1="190" x2="530" y2="190"/> <!-- 末端甲基 -->
            </g>
            
            <!-- 双键高亮区域（状态 1 显示） -->
            <g id="scene2-h2-highlights" style="display: none;">
                <!-- 双键 1 高亮 (左侧) -->
                <rect id="scene2-double-bond-1" x="175" y="225" width="35" height="15" 
                      class="scene2-highlight-blue"/>
                <text id="scene2-h2-label-1" x="185" y="215" class="scene2-label">+1 mol H₂</text>
                
                <!-- 双键 2 高亮 (中间) -->
                <rect id="scene2-double-bond-2" x="315" y="205" width="35" height="15" 
                      class="scene2-highlight-blue"/>
                <text id="scene2-h2-label-2" x="325" y="195" class="scene2-label">+1 mol H₂</text>
                
                <!-- 双键 3 高亮 (共轭 1) -->
                <rect id="scene2-double-bond-3" x="375" y="185" width="35" height="15" 
                      class="scene2-highlight-blue"/>
                <text id="scene2-h2-label-3" x="385" y="175" class="scene2-label">+1 mol H₂</text>
                
                <!-- 双键 4 高亮 (共轭 2) -->
                <rect id="scene2-double-bond-4" x="455" y="205" width="35" height="15" 
                      class="scene2-highlight-blue"/>
                <text id="scene2-h2-label-4" x="465" y="195" class="scene2-label">+1 mol H₂</text>
                
                <!-- H₂总计 -->
                <text id="scene2-h2-total" x="400" y="380" class="scene2-total" text-anchor="middle">总计：4 mol H₂</text>
            </g>
            
            <!-- 酯基高亮区域（状态 2 显示） -->
            <g id="scene2-naoh-highlights" style="display: none;">
                <!-- 酯基 1 高亮（左侧） -->
                <rect id="scene2-ester-1" x="135" y="215" width="35" height="40" 
                      class="scene2-highlight-red"/>
                <text id="scene2-naoh-label-1" x="130" y="205" class="scene2-label">+1 mol NaOH</text>
                
                <!-- 酯基 2 高亮（上方） -->
                <rect id="scene2-ester-2" x="215" y="155" width="35" height="35" 
                      class="scene2-highlight-red"/>
                <text id="scene2-naoh-label-2" x="220" y="145" class="scene2-label">+1 mol NaOH</text>
                
                <!-- 酯基 3 高亮（下方） -->
                <rect id="scene2-ester-3" x="255" y="255" width="35" height="35" 
                      class="scene2-highlight-red"/>
                <text id="scene2-naoh-label-3" x="260" y="305" class="scene2-label">+1 mol NaOH</text>
                
                <!-- NaOH 总计 -->
                <text id="scene2-naoh-total" x="400" y="410" class="scene2-total" text-anchor="middle">总计：3 mol NaOH</text>
            </g>
            
            <!-- 对比表格（状态 3 显示） -->
            <g id="scene2-comparison-table" style="display: none;">
                <!-- 表格背景 -->
                <rect x="200" y="340" width="400" height="90" fill="#f5f5f5" stroke="#cccccc" stroke-width="1"/>
                
                <!-- 正确值列 -->
                <text x="280" y="375" class="scene2-comparison-text" text-anchor="middle">正确值：</text>
                <text x="280" y="400" class="scene2-comparison-text" text-anchor="middle">4 mol H₂ / 3 mol NaOH</text>
                <text x="330" y="390" class="scene2-check">✓</text>
                
                <!-- 选项 C 列 -->
                <text x="520" y="375" class="scene2-comparison-text" text-anchor="middle">选项 C：</text>
                <text x="520" y="400" class="scene2-comparison-text" text-anchor="middle">5 mol H₂ / 3 mol NaOH</text>
                <text x="475" y="390" class="scene2-cross">✗</text>
            </g>
            
            <!-- 控件栏 -->
            <g id="scene2-controls">
                <rect id="scene2-btn-h2" x="170" y="455" width="120" height="35" fill="#ffffff" stroke="#1976d2" stroke-width="2" rx="6" class="scene2-btn-rect"/>
                <text x="230" y="478" text-anchor="middle" font-size="14" fill="#1976d2" pointer-events="none">H₂加成</text>
                
                <rect id="scene2-btn-naoh" x="340" y="455" width="120" height="35" fill="#ffffff" stroke="#1976d2" stroke-width="2" rx="6" class="scene2-btn-rect"/>
                <text x="400" y="478" text-anchor="middle" font-size="14" fill="#1976d2" pointer-events="none">NaOH 水解</text>
                
                <rect id="scene2-btn-compare" x="510" y="455" width="120" height="35" fill="#ffffff" stroke="#1976d2" stroke-width="2" rx="6" class="scene2-btn-rect"/>
                <text x="570" y="478" text-anchor="middle" font-size="14" fill="#1976d2" pointer-events="none">对比纠错</text>
            </g>
        </svg>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现 - 选项 C 反应计量对比
        
        let currentState = 0; // 0: 初始, 1: H₂加成, 2: NaOH 水解, 3: 对比纠错
        
        const h2Highlights = document.getElementById('scene2-h2-highlights');
        const naohHighlights = document.getElementById('scene2-naoh-highlights');
        const comparisonTable = document.getElementById('scene2-comparison-table');
        
        const btnH2 = document.getElementById('scene2-btn-h2');
        const btnNaoh = document.getElementById('scene2-btn-naoh');
        const btnCompare = document.getElementById('scene2-btn-compare');
        
        function updateState(newState) {
            currentState = newState;
            
            // 隐藏所有状态元素
            h2Highlights.style.display = 'none';
            naohHighlights.style.display = 'none';
            comparisonTable.style.display = 'none';
            
            // 重置所有按钮样式
            btnH2.style.fill = '#ffffff';
            btnH2.querySelector('text').style.fill = '#1976d2';
            btnNaoh.style.fill = '#ffffff';
            btnNaoh.querySelector('text').style.fill = '#1976d2';
            btnCompare.style.fill = '#ffffff';
            btnCompare.querySelector('text').style.fill = '#1976d2';
            
            // 根据状态显示对应元素
            if (newState === 1) {
                h2Highlights.style.display = 'block';
                btnH2.style.fill = '#1976d2';
                btnH2.querySelector('text').style.fill = '#ffffff';
            } else if (newState === 2) {
                naohHighlights.style.display = 'block';
                btnNaoh.style.fill = '#1976d2';
                btnNaoh.querySelector('text').style.fill = '#ffffff';
            } else if (newState === 3) {
                comparisonTable.style.display = 'block';
                btnCompare.style.fill = '#1976d2';
                btnCompare.querySelector('text').style.fill = '#ffffff';
            }
        }
        
        // 按钮点击事件
        btnH2.addEventListener('click', function() {
            updateState(1);
        });
        
        btnNaoh.addEventListener('click', function() {
            updateState(2);
        });
        
        btnCompare.addEventListener('click', function() {
            updateState(3);
        });
        
        // 初始状态
        updateState(0);
    })();
    </script>
</body>
</html>
