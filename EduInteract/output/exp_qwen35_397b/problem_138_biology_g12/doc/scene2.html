<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>处理②杂交实验遗传分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; pointer-events: none; }
        .scene2-btn { padding: 8px 16px; font-size: 14px; border: none; border-radius: 4px; cursor: pointer; background: #1565c0; color: white; pointer-events: auto; }
        .scene2-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene2-step { font-size: 14px; color: #333; align-self: center; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500">
            <!-- 背景 -->
            <rect width="800" height="500" fill="#ffffff"/>
            
            <!-- P 标签 -->
            <text id="scene2-p-label" x="40" y="25" font-size="16" fill="#000000" style="display:none;">P</text>
            
            <!-- 植株甲框 (红边框) -->
            <g id="scene2-parent-a" style="display:none;">
                <rect x="40" y="35" width="180" height="80" fill="none" stroke="#c62828" stroke-width="2"/>
                <!-- 豆荚图标 -->
                <ellipse cx="80" cy="75" rx="30" ry="20" fill="#fdd835" stroke="#c62828" stroke-width="1.5"/>
                <ellipse cx="95" cy="70" rx="25" ry="18" fill="#fdd835" stroke="#c62828" stroke-width="1.5"/>
                <!-- 基因型标签 -->
                <text x="150" y="65" font-size="16" fill="#c62828" font-weight="bold">aa bb</text>
                <!-- 性别符号 -->
                <text x="150" y="95" font-size="18" fill="#c62828">♀</text>
            </g>
            
            <!-- 植株乙框 (绿边框) -->
            <g id="scene2-parent-b" style="display:none;">
                <rect x="580" y="35" width="180" height="80" fill="none" stroke="#2e7d32" stroke-width="2"/>
                <!-- 豆荚图标 -->
                <ellipse cx="620" cy="75" rx="30" ry="20" fill="#4caf50" stroke="#2e7d32" stroke-width="1.5"/>
                <ellipse cx="635" cy="70" rx="25" ry="18" fill="#4caf50" stroke="#2e7d32" stroke-width="1.5"/>
                <!-- 基因型标签 -->
                <text x="690" y="65" font-size="16" fill="#2e7d32" font-weight="bold">AA BB</text>
                <!-- 性别符号 -->
                <text x="690" y="95" font-size="18" fill="#2e7d32">♂</text>
            </g>
            
            <!-- 杂交符号 -->
            <text id="scene2-cross-symbol" x="400" y="85" font-size="36" fill="#000000" text-anchor="middle" style="display:none;">×</text>
            
            <!-- 配子箭头甲 -->
            <g id="scene2-gamete-arrow-a" style="display:none;">
                <line x1="130" y1="115" x2="130" y2="145" stroke="#000000" stroke-width="2"/>
                <polygon points="130,145 125,135 135,135" fill="#000000"/>
            </g>
            
            <!-- 配子箭头乙 -->
            <g id="scene2-gamete-arrow-b" style="display:none;">
                <line x1="670" y1="115" x2="670" y2="145" stroke="#000000" stroke-width="2"/>
                <polygon points="670,145 665,135 675,135" fill="#000000"/>
            </g>
            
            <!-- 甲配子标签 -->
            <text id="scene2-gamete-a" x="130" y="165" font-size="16" fill="#c62828" font-weight="bold" text-anchor="middle" style="display:none;">ab</text>
            
            <!-- 乙配子标签 -->
            <text id="scene2-gamete-b" x="670" y="165" font-size="16" fill="#2e7d32" font-weight="bold" text-anchor="middle" style="display:none;">AB</text>
            
            <!-- 受精箭头 -->
            <g id="scene2-fertilization-arrow" style="display:none;">
                <line x1="150" y1="165" x2="380" y2="185" stroke="#000000" stroke-width="2"/>
                <polygon points="380,185 370,180 375,190" fill="#000000"/>
            </g>
            
            <!-- F1 代框 -->
            <g id="scene2-f1-box" style="display:none;">
                <rect x="280" y="175" width="240" height="65" fill="rgba(21,101,192,0.1)" stroke="#1565c0" stroke-width="2"/>
                <text x="400" y="198" font-size="17" fill="#000000" font-weight="bold" text-anchor="middle">Aa Bb</text>
                <text x="400" y="222" font-size="13" fill="#333333" text-anchor="middle">绿豆荚植株，黄子叶种子</text>
            </g>
            
            <!-- F1 标签 -->
            <text id="scene2-f1-label" x="280" y="165" font-size="16" fill="#000000" style="display:none;">F₁</text>
            
            <!-- 自交箭头 -->
            <g id="scene2-selfcross-arrow" style="display:none;">
                <line x1="400" y1="240" x2="400" y2="265" stroke="#000000" stroke-width="2"/>
                <polygon points="400,265 395,255 405,255" fill="#000000"/>
                <text x="395" y="258" font-size="18" fill="#000000" text-anchor="middle">⊗</text>
            </g>
            
            <!-- 棋盘格外框 -->
            <g id="scene2-punnett-grid" style="display:none;">
                <!-- 外框 -->
                <rect x="180" y="275" width="440" height="140" fill="none" stroke="#000000" stroke-width="2"/>
                <!-- 横线 -->
                <line x1="180" y1="310" x2="620" y2="310" stroke="#888888" stroke-width="1"/>
                <line x1="180" y1="345" x2="620" y2="345" stroke="#888888" stroke-width="1"/>
                <line x1="180" y1="380" x2="620" y2="380" stroke="#888888" stroke-width="1"/>
                <!-- 竖线 -->
                <line x1="290" y1="275" x2="290" y2="415" stroke="#888888" stroke-width="1"/>
                <line x1="400" y1="275" x2="400" y2="415" stroke="#888888" stroke-width="1"/>
                <line x1="510" y1="275" x2="510" y2="415" stroke="#888888" stroke-width="1"/>
            </g>
            
            <!-- 棋盘格顶部配子标签 -->
            <g id="scene2-punnett-top-labels" style="display:none;">
                <text x="235" y="268" font-size="13" fill="#000000" text-anchor="middle">AB</text>
                <text x="345" y="268" font-size="13" fill="#000000" text-anchor="middle">Ab</text>
                <text x="455" y="268" font-size="13" fill="#000000" text-anchor="middle">aB</text>
                <text x="565" y="268" font-size="13" fill="#000000" text-anchor="middle">ab</text>
            </g>
            
            <!-- 棋盘格左侧配子标签 -->
            <g id="scene2-punnett-left-labels" style="display:none;">
                <text x="172" y="302" font-size="13" fill="#000000" text-anchor="end">AB</text>
                <text x="172" y="337" font-size="13" fill="#000000" text-anchor="end">Ab</text>
                <text x="172" y="372" font-size="13" fill="#000000" text-anchor="end">aB</text>
                <text x="172" y="407" font-size="13" fill="#000000" text-anchor="end">ab</text>
            </g>
            
            <!-- 棋盘格 16 单元格内容 -->
            <g id="scene2-punnett-cells" style="display:none;">
                <!-- 第一行 -->
                <text x="235" y="300" font-size="11" fill="#000000" text-anchor="middle">AABB</text>
                <text x="345" y="300" font-size="11" fill="#000000" text-anchor="middle">AABb</text>
                <text x="455" y="300" font-size="11" fill="#000000" text-anchor="middle">AaBB</text>
                <text x="565" y="300" font-size="11" fill="#000000" text-anchor="middle">AaBb</text>
                <!-- 第二行 -->
                <text x="235" y="335" font-size="11" fill="#000000" text-anchor="middle">AABb</text>
                <text x="345" y="335" font-size="11" fill="#000000" text-anchor="middle">AAbb</text>
                <text x="455" y="335" font-size="11" fill="#000000" text-anchor="middle">AaBb</text>
                <text x="565" y="335" font-size="11" fill="#000000" text-anchor="middle">Aabb</text>
                <!-- 第三行 -->
                <text x="235" y="370" font-size="11" fill="#000000" text-anchor="middle">AaBB</text>
                <text x="345" y="370" font-size="11" fill="#000000" text-anchor="middle">AaBb</text>
                <text x="455" y="370" font-size="11" fill="#000000" text-anchor="middle">aaBB</text>
                <text x="565" y="370" font-size="11" fill="#000000" text-anchor="middle">aaBb</text>
                <!-- 第四行 -->
                <text x="235" y="405" font-size="11" fill="#000000" text-anchor="middle">AaBb</text>
                <text x="345" y="405" font-size="11" fill="#000000" text-anchor="middle">Aabb</text>
                <text x="455" y="405" font-size="11" fill="#000000" text-anchor="middle">aaBb</text>
                <text x="565" y="405" font-size="11" fill="#000000" text-anchor="middle">aabb</text>
            </g>
            
            <!-- 答案框 1 -->
            <g id="scene2-answer1" style="display:none;">
                <rect x="640" y="175" width="140" height="55" fill="none" stroke="#1565c0" stroke-width="2" rx="5"/>
                <text x="710" y="198" font-size="13" fill="#1565c0" text-anchor="middle">豆荚黄色：0</text>
                <text x="710" y="218" font-size="11" fill="#666666" text-anchor="middle">(母本为绿)</text>
            </g>
            
            <!-- 答案框 2 -->
            <g id="scene2-answer2" style="display:none;">
                <rect x="640" y="240" width="140" height="55" fill="none" stroke="#1565c0" stroke-width="2" rx="5"/>
                <text x="710" y="263" font-size="13" fill="#1565c0" text-anchor="middle">AABb：1/8</text>
                <text x="710" y="283" font-size="11" fill="#666666" text-anchor="middle">(2/16 简化)</text>
            </g>
            
            <!-- 步骤指示器（SVG 内） -->
            <text id="scene2-step-indicator" x="400" y="485" font-size="13" fill="#333333" text-anchor="middle">步骤 1/5</text>
        </svg>
        
        <div id="scene2-controls">
            <button id="scene2-btn-prev" class="scene2-btn">◀ 上一步</button>
            <span id="scene2-step-display" class="scene2-step">步骤 1/5</span>
            <button id="scene2-btn-next" class="scene2-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现 - 处理②杂交实验遗传分析
        
        // 状态变量
        let currentStep = 0;
        const totalSteps = 5;
        
        // 每步显示的元素 ID 列表
        const stepElements = {
            0: ['scene2-p-label', 'scene2-parent-a', 'scene2-parent-b', 'scene2-cross-symbol'],
            1: ['scene2-p-label', 'scene2-parent-a', 'scene2-parent-b', 'scene2-cross-symbol', 
                'scene2-gamete-arrow-a', 'scene2-gamete-arrow-b', 'scene2-gamete-a', 'scene2-gamete-b'],
            2: ['scene2-p-label', 'scene2-parent-a', 'scene2-parent-b', 'scene2-cross-symbol',
                'scene2-gamete-arrow-a', 'scene2-gamete-arrow-b', 'scene2-gamete-a', 'scene2-gamete-b',
                'scene2-fertilization-arrow', 'scene2-f1-box', 'scene2-f1-label'],
            3: ['scene2-p-label', 'scene2-parent-a', 'scene2-parent-b', 'scene2-cross-symbol',
                'scene2-gamete-arrow-a', 'scene2-gamete-arrow-b', 'scene2-gamete-a', 'scene2-gamete-b',
                'scene2-fertilization-arrow', 'scene2-f1-box', 'scene2-f1-label',
                'scene2-selfcross-arrow', 'scene2-punnett-grid', 'scene2-punnett-top-labels', 
                'scene2-punnett-left-labels', 'scene2-punnett-cells'],
            4: ['scene2-p-label', 'scene2-parent-a', 'scene2-parent-b', 'scene2-cross-symbol',
                'scene2-gamete-arrow-a', 'scene2-gamete-arrow-b', 'scene2-gamete-a', 'scene2-gamete-b',
                'scene2-fertilization-arrow', 'scene2-f1-box', 'scene2-f1-label',
                'scene2-selfcross-arrow', 'scene2-punnett-grid', 'scene2-punnett-top-labels',
                'scene2-punnett-left-labels', 'scene2-punnett-cells',
                'scene2-answer1', 'scene2-answer2']
        };
        
        // 显示/隐藏元素函数
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.display = 'block';
                if (el.tagName === 'text' || el.tagName === 'tspan') {
                    el.style.opacity = '1';
                }
            }
        }
        
        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.display = 'none';
                if (el.tagName === 'text' || el.tagName === 'tspan') {
                    el.style.opacity = '0';
                }
            }
        }
        
        // 更新步骤显示
        function updateStep() {
            // 隐藏所有元素
            const allElements = new Set();
            Object.values(stepElements).forEach(ids => ids.forEach(id => allElements.add(id)));
            allElements.forEach(id => hideElement(id));
            
            // 显示当前步骤的元素
            stepElements[currentStep].forEach(id => showElement(id));
            
            // 更新步骤指示器
            const stepDisplay = document.getElementById('scene2-step-indicator');
            const stepDisplay2 = document.getElementById('scene2-step-display');
            if (stepDisplay) stepDisplay.textContent = `步骤 ${currentStep + 1}/${totalSteps}`;
            if (stepDisplay2) stepDisplay2.textContent = `步骤 ${currentStep + 1}/${totalSteps}`;
            
            // 更新按钮状态
            const prevBtn = document.getElementById('scene2-btn-prev');
            const nextBtn = document.getElementById('scene2-btn-next');
            if (prevBtn) {
                prevBtn.disabled = currentStep === 0;
                prevBtn.style.opacity = currentStep === 0 ? '0.5' : '1';
            }
            if (nextBtn) {
                nextBtn.disabled = currentStep === totalSteps - 1;
                nextBtn.style.opacity = currentStep === totalSteps - 1 ? '0.5' : '1';
            }
        }
        
        // 按钮事件处理
        document.getElementById('scene2-btn-prev').addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });
        
        document.getElementById('scene2-btn-next').addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateStep();
            }
        });
        
        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
