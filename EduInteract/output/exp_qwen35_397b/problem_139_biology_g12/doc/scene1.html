<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基因互作控制花色合成机制</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        .scene1-hidden {
            display: none;
            opacity: 0;
        }
        .scene1-fade-in {
            animation: scene1FadeIn 0.4s ease-in-out;
        }
        @keyframes scene1FadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .scene1-blink {
            animation: scene1Blink 0.6s ease-in-out 3;
        }
        @keyframes scene1Blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .scene1-suppressed {
            fill: #9e9e9e !important;
            stroke: #9e9e9e !important;
        }
        .scene1-btn {
            cursor: pointer;
        }
        .scene1-btn-disabled {
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#000000" />
                </marker>
            </defs>

            <!-- ========== 基因 A 路径（右侧） ========== -->
            <!-- 基因 A 框 -->
            <rect id="scene1-geneA-box" x="550" y="50" width="100" height="40" fill="#1565c0" fill-opacity="0.2" stroke="#1565c0" stroke-width="2" rx="4"/>
            <text id="scene1-geneA-label" x="600" y="75" text-anchor="middle" font-size="16" fill="#1565c0" font-weight="bold">基因 A</text>

            <!-- 箭头①-A（转录） -->
            <line id="scene1-arrow-1-A" x1="600" y1="90" x2="600" y2="120" stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrowhead)"/>
            <circle id="scene1-label-1-A-bg" cx="615" cy="105" r="10" fill="#000000"/>
            <text id="scene1-label-1-A" x="615" y="110" text-anchor="middle" font-size="14" fill="#ffffff">①</text>

            <!-- mRNA-A 框 -->
            <rect id="scene1-mRNA-A" x="550" y="130" width="100" height="30" fill="#64b5f6" fill-opacity="0.2" stroke="#64b5f6" stroke-width="2" rx="4"/>
            <text id="scene1-mRNA-A-label" x="600" y="150" text-anchor="middle" font-size="14" fill="#1565c0">mRNA</text>

            <!-- 箭头②-A（翻译） -->
            <line id="scene1-arrow-2-A" x1="600" y1="160" x2="600" y2="190" stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrowhead)"/>
            <circle id="scene1-label-2-A-bg" cx="615" cy="175" r="10" fill="#000000"/>
            <text id="scene1-label-2-A" x="615" y="180" text-anchor="middle" font-size="14" fill="#ffffff">②</text>

            <!-- 酶 A 框 -->
            <rect id="scene1-enzyme-A-box" x="550" y="200" width="100" height="40" fill="#2e7d32" fill-opacity="0.2" stroke="#2e7d32" stroke-width="2" rx="4"/>
            <text id="scene1-enzyme-A-label" x="600" y="225" text-anchor="middle" font-size="16" fill="#2e7d32" font-weight="bold">酶 A</text>

            <!-- 酶 A 催化箭头 -->
            <line id="scene1-arrow-cat-A" x1="600" y1="240" x2="600" y2="275" stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrowhead)"/>
            <text id="scene1-label-enzyme-A" x="630" y="265" text-anchor="middle" font-size="13" fill="#2e7d32">酶 A</text>

            <!-- ========== 基因 B 路径（左侧） ========== -->
            <!-- 基因 B 框 -->
            <rect id="scene1-geneB-box" x="150" y="50" width="100" height="40" fill="#1565c0" fill-opacity="0.2" stroke="#1565c0" stroke-width="2" rx="4" class="scene1-hidden"/>
            <text id="scene1-geneB-label" x="200" y="75" text-anchor="middle" font-size="16" fill="#1565c0" font-weight="bold" class="scene1-hidden">基因 B</text>

            <!-- 箭头①-B（转录） -->
            <line id="scene1-arrow-1-B" x1="200" y1="90" x2="200" y2="120" stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrowhead)" class="scene1-hidden"/>
            <circle id="scene1-label-1-B-bg" cx="185" cy="105" r="10" fill="#000000" class="scene1-hidden"/>
            <text id="scene1-label-1-B" x="185" y="110" text-anchor="middle" font-size="14" fill="#ffffff" class="scene1-hidden">①</text>

            <!-- mRNA-B 框 -->
            <rect id="scene1-mRNA-B" x="150" y="130" width="100" height="30" fill="#64b5f6" fill-opacity="0.2" stroke="#64b5f6" stroke-width="2" rx="4" class="scene1-hidden"/>
            <text id="scene1-mRNA-B-label" x="200" y="150" text-anchor="middle" font-size="14" fill="#1565c0" class="scene1-hidden">mRNA</text>

            <!-- 箭头②-B（翻译） -->
            <line id="scene1-arrow-2-B" x1="200" y1="160" x2="200" y2="190" stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrowhead)" class="scene1-hidden"/>
            <circle id="scene1-label-2-B-bg" cx="185" cy="175" r="10" fill="#000000" class="scene1-hidden"/>
            <text id="scene1-label-2-B" x="185" y="180" text-anchor="middle" font-size="14" fill="#ffffff" class="scene1-hidden">②</text>

            <!-- 酶 B 框 -->
            <rect id="scene1-enzyme-B-box" x="150" y="200" width="100" height="40" fill="#2e7d32" fill-opacity="0.2" stroke="#2e7d32" stroke-width="2" rx="4" class="scene1-hidden"/>
            <text id="scene1-enzyme-B-label" x="200" y="225" text-anchor="middle" font-size="16" fill="#2e7d32" font-weight="bold" class="scene1-hidden">酶 B</text>

            <!-- 酶 B 催化箭头 -->
            <line id="scene1-arrow-cat-B" x1="200" y1="240" x2="200" y2="275" stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrowhead)" class="scene1-hidden"/>
            <text id="scene1-label-enzyme-B" x="140" y="265" text-anchor="middle" font-size="13" fill="#2e7d32" class="scene1-hidden">酶 B</text>

            <!-- ========== 代谢路径（底部） ========== -->
            <!-- 白色前体物质 -->
            <circle id="scene1-pigment-white" cx="400" cy="300" r="30" fill="#e0e0e0" stroke="#9e9e9e" stroke-width="2"/>
            <text id="scene1-pigment-white-label" x="400" y="345" text-anchor="middle" font-size="14" fill="#616161">白色前体物质</text>

            <!-- 蓝色色素 -->
            <circle id="scene1-pigment-blue" cx="80" cy="300" r="25" fill="#4a90e2" stroke="#1565c0" stroke-width="2" class="scene1-hidden"/>
            <text id="scene1-pigment-blue-label" x="80" y="345" text-anchor="middle" font-size="14" fill="#1565c0" class="scene1-hidden">蓝色色素</text>

            <!-- 紫色色素 -->
            <circle id="scene1-pigment-purple" cx="720" cy="300" r="25" fill="#9c27b0" stroke="#7b1fa2" stroke-width="2"/>
            <text id="scene1-pigment-purple-label" x="720" y="345" text-anchor="middle" font-size="14" fill="#7b1fa2">紫色色素</text>

            <!-- 代谢箭头左（白色→蓝色） -->
            <line id="scene1-arrow-metab-left" x1="370" y1="300" x2="105" y2="300" stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrowhead)" class="scene1-hidden"/>

            <!-- 代谢箭头右（白色→紫色） -->
            <line id="scene1-arrow-metab-right" x1="430" y1="300" x2="695" y2="300" stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrowhead)"/>

            <!-- ========== 互作抑制机制（步骤 2 显示） ========== -->
            <!-- 互作抑制符号 × -->
            <g id="scene1-interaction-group" class="scene1-hidden">
                <line id="scene1-interaction-symbol-1" x1="385" y1="130" x2="415" y2="160" stroke="#c62828" stroke-width="3"/>
                <line id="scene1-interaction-symbol-2" x1="415" y1="130" x2="385" y2="160" stroke="#c62828" stroke-width="3"/>
                <text id="scene1-interaction-text" x="400" y="190" text-anchor="middle" font-size="13" fill="#c62828">mRNA 结合抑制</text>
            </g>

            <!-- ========== 控件栏 ========== -->
            <rect id="scene1-controls-bg" x="0" y="435" width="800" height="65" fill="#f5f5f5" opacity="0.9"/>

            <!-- 上一步按钮组 -->
            <g id="scene1-btn-prev" class="scene1-btn">
                <rect id="scene1-btn-prev-bg" x="250" y="445" width="100" height="35" fill="#bdbdbd" rx="4"/>
                <text id="scene1-btn-prev-text" x="300" y="468" text-anchor="middle" font-size="14" fill="#9e9e9e">◀ 上一步</text>
            </g>

            <!-- 下一步按钮组 -->
            <g id="scene1-btn-next" class="scene1-btn">
                <rect id="scene1-btn-next-bg" x="450" y="445" width="100" height="35" fill="#1976d2" rx="4"/>
                <text id="scene1-btn-next-text" x="500" y="468" text-anchor="middle" font-size="14" fill="#ffffff">下一步 ▶</text>
            </g>

            <!-- 步骤指示器 -->
            <text id="scene1-step-indicator" x="400" y="468" text-anchor="middle" font-size="14" fill="#424242">步骤 1/4</text>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 1 实现：基因互作控制花色合成机制

        // 状态管理
        let currentState = 0;
        const totalSteps = 4;

        // 元素分组定义
        const geneAElements = [
            'scene1-geneA-box', 'scene1-geneA-label',
            'scene1-arrow-1-A', 'scene1-label-1-A-bg', 'scene1-label-1-A',
            'scene1-mRNA-A', 'scene1-mRNA-A-label',
            'scene1-arrow-2-A', 'scene1-label-2-A-bg', 'scene1-label-2-A',
            'scene1-enzyme-A-box', 'scene1-enzyme-A-label',
            'scene1-arrow-cat-A', 'scene1-label-enzyme-A',
            'scene1-pigment-white', 'scene1-pigment-white-label',
            'scene1-pigment-purple', 'scene1-pigment-purple-label',
            'scene1-arrow-metab-right'
        ];

        const geneBElements = [
            'scene1-geneB-box', 'scene1-geneB-label',
            'scene1-arrow-1-B', 'scene1-label-1-B-bg', 'scene1-label-1-B',
            'scene1-mRNA-B', 'scene1-mRNA-B-label',
            'scene1-arrow-2-B', 'scene1-label-2-B-bg', 'scene1-label-2-B',
            'scene1-enzyme-B-box', 'scene1-enzyme-B-label',
            'scene1-arrow-cat-B', 'scene1-label-enzyme-B',
            'scene1-pigment-blue', 'scene1-pigment-blue-label',
            'scene1-arrow-metab-left'
        ];

        const interactionElements = [
            'scene1-interaction-group'
        ];

        // 辅助函数：显示元素
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.display = '';
                el.style.opacity = '1';
                el.classList.remove('scene1-hidden');
            }
        }

        // 辅助函数：隐藏元素
        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.display = 'none';
                el.style.opacity = '0';
                el.classList.add('scene1-hidden');
            }
        }

        // 辅助函数：显示元素组
        function showGroup(elements, animate) {
            elements.forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.style.display = '';
                    el.style.opacity = '1';
                    el.classList.remove('scene1-hidden');
                    if (animate) {
                        el.classList.add('scene1-fade-in');
                        setTimeout(() => el.classList.remove('scene1-fade-in'), 400);
                    }
                }
            });
        }

        // 辅助函数：隐藏元素组
        function hideGroup(elements) {
            elements.forEach(id => {
                hideElement(id);
            });
        }

        // 更新按钮状态
        function updateButtons() {
            const prevBg = document.getElementById('scene1-btn-prev-bg');
            const prevText = document.getElementById('scene1-btn-prev-text');
            const prevGroup = document.getElementById('scene1-btn-prev');
            const nextBg = document.getElementById('scene1-btn-next-bg');
            const nextText = document.getElementById('scene1-btn-next-text');
            const nextGroup = document.getElementById('scene1-btn-next');
            const indicator = document.getElementById('scene1-step-indicator');

            // 更新步骤指示器
            indicator.textContent = '步骤 ' + (currentState + 1) + '/4';

            // 更新上一步按钮
            if (currentState === 0) {
                prevBg.setAttribute('fill', '#bdbdbd');
                prevText.setAttribute('fill', '#9e9e9e');
                prevGroup.classList.add('scene1-btn-disabled');
                prevGroup.classList.remove('scene1-btn');
            } else {
                prevBg.setAttribute('fill', '#1976d2');
                prevText.setAttribute('fill', '#ffffff');
                prevGroup.classList.remove('scene1-btn-disabled');
                prevGroup.classList.add('scene1-btn');
            }

            // 更新下一步按钮
            if (currentState === totalSteps - 1) {
                nextBg.setAttribute('fill', '#bdbdbd');
                nextText.setAttribute('fill', '#9e9e9e');
                nextGroup.classList.add('scene1-btn-disabled');
                nextGroup.classList.remove('scene1-btn');
            } else {
                nextBg.setAttribute('fill', '#1976d2');
                nextText.setAttribute('fill', '#ffffff');
                nextGroup.classList.remove('scene1-btn-disabled');
                nextGroup.classList.add('scene1-btn');
            }
        }

        // 更新场景状态
        function updateScene() {
            // 先隐藏所有
            hideGroup(geneAElements);
            hideGroup(geneBElements);
            hideGroup(interactionElements);

            // 根据当前状态显示相应元素
            switch (currentState) {
                case 0:
                    // 步骤 0：仅显示基因 A 路径
                    showGroup(geneAElements, false);
                    // 酶 A 正常显示
                    document.getElementById('scene1-enzyme-A-box').classList.remove('scene1-suppressed');
                    break;

                case 1:
                    // 步骤 1：添加基因 B 路径
                    showGroup(geneAElements, false);
                    showGroup(geneBElements, true);
                    // 酶 A、酶 B 正常显示
                    document.getElementById('scene1-enzyme-A-box').classList.remove('scene1-suppressed');
                    document.getElementById('scene1-enzyme-B-box').classList.remove('scene1-suppressed');
                    break;

                case 2:
                    // 步骤 2：展示互作抑制机制
                    showGroup(geneAElements, false);
                    showGroup(geneBElements, false);
                    showGroup(interactionElements, true);
                    // 添加闪烁动画
                    const interactionGroup = document.getElementById('scene1-interaction-group');
                    interactionGroup.classList.add('scene1-blink');
                    setTimeout(() => interactionGroup.classList.remove('scene1-blink'), 1800);
                    // 酶 A、酶 B 变灰表示被抑制
                    document.getElementById('scene1-enzyme-A-box').classList.add('scene1-suppressed');
                    document.getElementById('scene1-enzyme-B-box').classList.add('scene1-suppressed');
                    break;

                case 3:
                    // 步骤 3：完整机制图
                    showGroup(geneAElements, false);
                    showGroup(geneBElements, false);
                    showGroup(interactionElements, false);
                    // 酶 A、酶 B 恢复正常
                    document.getElementById('scene1-enzyme-A-box').classList.remove('scene1-suppressed');
                    document.getElementById('scene1-enzyme-B-box').classList.remove('scene1-suppressed');
                    break;
            }

            updateButtons();
        }

        // 按钮点击处理
        function handlePrevClick() {
            if (currentState > 0) {
                currentState--;
                updateScene();
            }
        }

        function handleNextClick() {
            if (currentState < totalSteps - 1) {
                currentState++;
                updateScene();
            }
        }

        // 绑定按钮事件
        const prevBtn = document.getElementById('scene1-btn-prev');
        const nextBtn = document.getElementById('scene1-btn-next');

        prevBtn.addEventListener('click', handlePrevClick);
        nextBtn.addEventListener('click', handleNextClick);

        // 鼠标悬停效果
        prevBtn.addEventListener('mouseenter', function() {
            if (currentState > 0) {
                document.getElementById('scene1-btn-prev-bg').setAttribute('fill', '#1565c0');
            }
        });
        prevBtn.addEventListener('mouseleave', function() {
            if (currentState > 0) {
                document.getElementById('scene1-btn-prev-bg').setAttribute('fill', '#1976d2');
            }
        });

        nextBtn.addEventListener('mouseenter', function() {
            if (currentState < totalSteps - 1) {
                document.getElementById('scene1-btn-next-bg').setAttribute('fill', '#1565c0');
            }
        });
        nextBtn.addEventListener('mouseleave', function() {
            if (currentState < totalSteps - 1) {
                document.getElementById('scene1-btn-next-bg').setAttribute('fill', '#1976d2');
            }
        });

        // 初始化场景
        updateScene();
    })();
    </script>
</body>
</html>
