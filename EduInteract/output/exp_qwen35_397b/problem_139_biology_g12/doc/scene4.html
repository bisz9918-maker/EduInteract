<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基因突变导致花色斑点分析</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: "Microsoft YaHei", sans-serif;
        }
        #scene4-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene4-svg {
            width: 800px;
            height: 500px;
        }
        .scene4-panel {
            fill: #f9f9f9;
            stroke: #e0e0e0;
            stroke-width: 1;
        }
        .scene4-petal {
            fill: #f5f5f5;
            stroke: #cccccc;
            stroke-width: 1.5;
        }
        .scene4-spot {
            fill: #1565c0;
            opacity: 0.7;
        }
        .scene4-arrow {
            fill: none;
            stroke: #c62828;
            stroke-width: 3;
        }
        .scene4-arrow-dashed {
            fill: none;
            stroke: #999999;
            stroke-width: 2;
            stroke-dasharray: 5,5;
        }
        .scene4-btn {
            fill: #e0e0e0;
            stroke: #bdbdbd;
            stroke-width: 1;
            cursor: pointer;
            rx: 4;
        }
        .scene4-btn-active {
            fill: #2196f3;
            stroke: #1976d2;
        }
        .scene4-btn-text {
            fill: #333333;
            font-size: 14px;
            font-weight: bold;
            text-anchor: middle;
            dominant-baseline: middle;
        }
        .scene4-btn-text-active {
            fill: #ffffff;
        }
        .scene4-title {
            fill: #333333;
            font-size: 18px;
            font-weight: bold;
            text-anchor: middle;
        }
        .scene4-genotype-label {
            fill: #000000;
            font-size: 16px;
            font-weight: bold;
        }
        .scene4-mutation-label {
            fill: #555555;
            font-size: 14px;
        }
        .scene4-color-label {
            fill: #666666;
            font-size: 13px;
        }
        .scene4-desc-label {
            fill: #444444;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div id="scene4-container">
        <svg id="scene4-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene4-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#c62828" />
                </marker>
                <marker id="scene4-arrowhead-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#999999" />
                </marker>
            </defs>

            <!-- 标题 -->
            <text id="scene4-title" x="400" y="35" class="scene4-title">基因突变导致花色斑点分析</text>

            <!-- 状态 1 面板：A_B_ -->
            <g id="scene4-panel1" style="opacity: 0.4;">
                <!-- 面板背景 -->
                <rect x="40" y="70" width="340" height="210" class="scene4-panel" rx="8" />
                <!-- 基因型标签 -->
                <text x="80" y="90" class="scene4-genotype-label">A_B_</text>
                <!-- 花瓣示意图 -->
                <ellipse id="scene4-petal1" cx="210" cy="160" rx="40" ry="50" class="scene4-petal" />
                <!-- 蓝色斑点 -->
                <circle id="scene4-spot1" cx="200" cy="155" r="12" class="scene4-spot" style="opacity: 0;" />
                <!-- 颜色标签 -->
                <text id="scene4-white-label1" x="260" y="180" class="scene4-color-label" style="opacity: 0;">白色</text>
                <text id="scene4-blue-label1" x="165" y="150" class="scene4-color-label" style="opacity: 0;">蓝色</text>
                <!-- 突变箭头 -->
                <path id="scene4-arrow1" d="M 100 200 L 200 200" class="scene4-arrow" marker-end="url(#scene4-arrowhead)" style="opacity: 0;" />
                <!-- 突变类型标签 -->
                <text id="scene4-mutation-label1" x="150" y="220" class="scene4-mutation-label" style="opacity: 0;">B 基因获得功能</text>
                <!-- 说明文字 -->
                <text id="scene4-desc1" x="210" y="250" class="scene4-desc-label" style="opacity: 0;">体细胞中 B 基因突变激活，局部合成酶 B，产生蓝色色素</text>
            </g>

            <!-- 状态 2 面板：aabb -->
            <g id="scene4-panel2" style="opacity: 0.4;">
                <!-- 面板背景 -->
                <rect x="420" y="70" width="340" height="210" class="scene4-panel" rx="8" />
                <!-- 基因型标签 -->
                <text x="460" y="90" class="scene4-genotype-label">aabb</text>
                <!-- 花瓣示意图 -->
                <ellipse id="scene4-petal2" cx="590" cy="160" rx="40" ry="50" class="scene4-petal" />
                <!-- 蓝色斑点（无） -->
                <circle id="scene4-spot2" cx="580" cy="155" r="12" class="scene4-spot" style="opacity: 0;" />
                <!-- 颜色标签 -->
                <text id="scene4-white-label2" x="640" y="180" class="scene4-color-label" style="opacity: 0;">白色</text>
                <!-- 突变箭头（虚线） -->
                <path id="scene4-arrow2" d="M 480 200 L 580 200" class="scene4-arrow-dashed" marker-end="url(#scene4-arrowhead-gray)" style="opacity: 0;" />
                <!-- 突变类型标签 -->
                <text id="scene4-mutation-label2" x="530" y="220" class="scene4-mutation-label" style="opacity: 0;">无突变可能</text>
                <!-- 说明文字 -->
                <text id="scene4-desc2" x="590" y="250" class="scene4-desc-label" style="opacity: 0;">aabb 基因型无法通过单次突变产生蓝色斑点</text>
            </g>

            <!-- 状态 3 面板：A_bb/aaB_ -->
            <g id="scene4-panel3" style="opacity: 0.4;">
                <!-- 面板背景 -->
                <rect x="40" y="290" width="720" height="110" class="scene4-panel" rx="8" />
                <!-- 基因型标签 -->
                <text x="80" y="310" class="scene4-genotype-label">A_bb 或 aaB_</text>
                <!-- 花瓣示意图 -->
                <ellipse id="scene4-petal3" cx="400" cy="345" rx="40" ry="50" class="scene4-petal" />
                <!-- 蓝色斑点 -->
                <circle id="scene4-spot3" cx="390" cy="340" r="12" class="scene4-spot" style="opacity: 0;" />
                <!-- 颜色标签 -->
                <text id="scene4-white-label3" x="450" y="365" class="scene4-color-label" style="opacity: 0;">白色</text>
                <text id="scene4-blue-label3" x="355" y="335" class="scene4-color-label" style="opacity: 0;">蓝色</text>
                <!-- 突变箭头 -->
                <path id="scene4-arrow3" d="M 150 350 L 300 350" class="scene4-arrow" marker-end="url(#scene4-arrowhead)" style="opacity: 0;" />
                <!-- 突变类型标签 -->
                <text id="scene4-mutation-label3" x="225" y="370" class="scene4-mutation-label" style="opacity: 0;">A 基因失活或 B 基因激活</text>
                <!-- 说明文字 -->
                <text id="scene4-desc3" x="500" y="350" class="scene4-desc-label" style="opacity: 0;">A_bb 中 A 基因体细胞失活，或 aaB_中 B 基因激活</text>
            </g>

            <!-- 底部按钮区域 -->
            <g id="scene4-controls">
                <!-- 按钮 1 -->
                <rect id="scene4-btn1-bg" x="120" y="450" width="180" height="35" class="scene4-btn" />
                <text id="scene4-btn1-text" x="210" y="467.5" class="scene4-btn-text">基因型 A_B_</text>
                
                <!-- 按钮 2 -->
                <rect id="scene4-btn2-bg" x="310" y="450" width="180" height="35" class="scene4-btn" />
                <text id="scene4-btn2-text" x="400" y="467.5" class="scene4-btn-text">基因型 aabb</text>
                
                <!-- 按钮 3 -->
                <rect id="scene4-btn3-bg" x="500" y="450" width="180" height="35" class="scene4-btn" />
                <text id="scene4-btn3-text" x="590" y="467.5" class="scene4-btn-text">基因型 A_bb/aaB_</text>
            </g>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 4 实现：基因突变导致花色斑点分析
        
        let currentState = 0; // 0=初始, 1=A_B_, 2=aabb, 3=A_bb/aaB_
        
        // 获取所有元素
        const panel1 = document.getElementById('scene4-panel1');
        const panel2 = document.getElementById('scene4-panel2');
        const panel3 = document.getElementById('scene4-panel3');
        
        const spot1 = document.getElementById('scene4-spot1');
        const spot2 = document.getElementById('scene4-spot2');
        const spot3 = document.getElementById('scene4-spot3');
        
        const whiteLabel1 = document.getElementById('scene4-white-label1');
        const blueLabel1 = document.getElementById('scene4-blue-label1');
        const whiteLabel2 = document.getElementById('scene4-white-label2');
        const whiteLabel3 = document.getElementById('scene4-white-label3');
        const blueLabel3 = document.getElementById('scene4-blue-label3');
        
        const arrow1 = document.getElementById('scene4-arrow1');
        const arrow2 = document.getElementById('scene4-arrow2');
        const arrow3 = document.getElementById('scene4-arrow3');
        
        const mutationLabel1 = document.getElementById('scene4-mutation-label1');
        const mutationLabel2 = document.getElementById('scene4-mutation-label2');
        const mutationLabel3 = document.getElementById('scene4-mutation-label3');
        
        const desc1 = document.getElementById('scene4-desc1');
        const desc2 = document.getElementById('scene4-desc2');
        const desc3 = document.getElementById('scene4-desc3');
        
        const btn1Bg = document.getElementById('scene4-btn1-bg');
        const btn1Text = document.getElementById('scene4-btn1-text');
        const btn2Bg = document.getElementById('scene4-btn2-bg');
        const btn2Text = document.getElementById('scene4-btn2-text');
        const btn3Bg = document.getElementById('scene4-btn3-bg');
        const btn3Text = document.getElementById('scene4-btn3-text');
        
        // 辅助函数：显示元素
        function show(el) {
            if (el) {
                el.style.opacity = '1';
                el.style.display = 'block';
            }
        }
        
        // 辅助函数：隐藏元素
        function hide(el) {
            if (el) {
                el.style.opacity = '0';
                el.style.display = 'none';
            }
        }
        
        // 更新显示状态
        function updateDisplay(state) {
            // 重置所有面板透明度
            panel1.style.opacity = '0.4';
            panel2.style.opacity = '0.4';
            panel3.style.opacity = '0.4';
            
            // 重置所有按钮样式
            btn1Bg.classList.remove('scene4-btn-active');
            btn1Text.classList.remove('scene4-btn-text-active');
            btn2Bg.classList.remove('scene4-btn-active');
            btn2Text.classList.remove('scene4-btn-text-active');
            btn3Bg.classList.remove('scene4-btn-active');
            btn3Text.classList.remove('scene4-btn-text-active');
            
            // 隐藏所有状态特定元素
            hide(spot1); hide(spot2); hide(spot3);
            hide(whiteLabel1); hide(blueLabel1);
            hide(whiteLabel2);
            hide(whiteLabel3); hide(blueLabel3);
            hide(arrow1); hide(arrow2); hide(arrow3);
            hide(mutationLabel1); hide(mutationLabel2); hide(mutationLabel3);
            hide(desc1); hide(desc2); hide(desc3);
            
            if (state === 1) {
                // 状态 1：A_B_
                panel1.style.opacity = '1';
                btn1Bg.classList.add('scene4-btn-active');
                btn1Text.classList.add('scene4-btn-text-active');
                show(spot1);
                show(whiteLabel1);
                show(blueLabel1);
                show(arrow1);
                show(mutationLabel1);
                show(desc1);
            } else if (state === 2) {
                // 状态 2：aabb
                panel2.style.opacity = '1';
                btn2Bg.classList.add('scene4-btn-active');
                btn2Text.classList.add('scene4-btn-text-active');
                show(whiteLabel2);
                show(arrow2);
                show(mutationLabel2);
                show(desc2);
            } else if (state === 3) {
                // 状态 3：A_bb/aaB_
                panel3.style.opacity = '1';
                btn3Bg.classList.add('scene4-btn-active');
                btn3Text.classList.add('scene4-btn-text-active');
                show(spot3);
                show(whiteLabel3);
                show(blueLabel3);
                show(arrow3);
                show(mutationLabel3);
                show(desc3);
            }
        }
        
        // 按钮点击事件
        document.getElementById('scene4-btn1-bg').addEventListener('click', function() {
            currentState = 1;
            updateDisplay(currentState);
        });
        
        document.getElementById('scene4-btn2-bg').addEventListener('click', function() {
            currentState = 2;
            updateDisplay(currentState);
        });
        
        document.getElementById('scene4-btn3-bg').addEventListener('click', function() {
            currentState = 3;
            updateDisplay(currentState);
        });
        
        // 初始状态
        updateDisplay(0);
        
    })();
    </script>
</body>
</html>
