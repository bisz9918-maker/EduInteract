<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>减数分裂异常导致 X^E X^e Y 个体形成</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene2-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene2-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }
        .scene2-btn {
            padding: 8px 16px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        .scene2-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #scene2-btn-prev {
            background: #9e9e9e;
            color: white;
        }
        #scene2-btn-next {
            background: #1565c0;
            color: white;
        }
        #scene2-step-indicator {
            font-size: 14px;
            color: #666666;
            min-width: 80px;
            text-align: center;
        }
        .scene2-element {
            transition: opacity 0.3s ease-out;
        }
        .scene2-hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene2-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#888888" />
                </marker>
                <marker id="scene2-arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#c62828" />
                </marker>
            </defs>

            <!-- 步骤标题 -->
            <text id="scene2-step-title" x="400" y="40" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333" class="scene2-element">
                亲本基因型：父本 X<tspan dy="-5" font-size="0.7em">E</tspan><tspan dy="5"> Y × 母本 X<tspan dy="-5" font-size="0.7em">e</tspan><tspan dy="5"> X<tspan dy="-5" font-size="0.7em">e</tspan></tspan>
            </text>

            <!-- P 标签 -->
            <text id="scene2-p-label" x="25" y="70" font-size="14" font-weight="bold" fill="#333333" class="scene2-element">P</text>

            <!-- 父本果蝇图标（雄性） -->
            <g id="scene2-parent-male" class="scene2-element">
                <ellipse cx="55" cy="100" rx="20" ry="25" fill="#5d4037" opacity="0.8"/>
                <text x="75" y="105" font-size="16" fill="#333333">♂</text>
            </g>

            <!-- 母本果蝇图标（雌性） -->
            <g id="scene2-parent-female" class="scene2-element">
                <ellipse cx="55" cy="220" rx="20" ry="25" fill="#5d4037" opacity="0.8"/>
                <text x="75" y="225" font-size="16" fill="#333333">♀</text>
            </g>

            <!-- 父本基因型标签 -->
            <text id="scene2-parent-male-genotype" x="90" y="105" font-size="14" fill="#333333" class="scene2-element">
                X<tspan dy="-5" font-size="0.7em" fill="#ff9800">E</tspan><tspan dy="5"> Y</tspan>
            </text>

            <!-- 母本基因型标签 -->
            <text id="scene2-parent-female-genotype" x="90" y="225" font-size="14" fill="#333333" class="scene2-element">
                X<tspan dy="-5" font-size="0.7em" fill="#4caf50">e</tspan><tspan dy="5"> X<tspan dy="-5" font-size="0.7em" fill="#4caf50">e</tspan></tspan>
            </text>

            <!-- 父本性染色体图示 -->
            <g id="scene2-father-chromosomes" class="scene2-element">
                <!-- X 染色体（蓝色） -->
                <ellipse cx="110" cy="125" rx="7" ry="18" fill="#1565c0"/>
                <!-- Y 染色体（红色，较短） -->
                <ellipse cx="135" cy="130" rx="6" ry="15" fill="#c62828"/>
                <!-- E 基因标记（橙色点） -->
                <circle cx="110" cy="120" r="3" fill="#ff9800"/>
            </g>

            <!-- 母本性染色体图示 -->
            <g id="scene2-mother-chromosomes" class="scene2-element">
                <!-- X 染色体 1（蓝色） -->
                <ellipse cx="110" cy="245" rx="7" ry="18" fill="#1565c0"/>
                <!-- X 染色体 2（蓝色） -->
                <ellipse cx="135" cy="245" rx="7" ry="18" fill="#1565c0"/>
                <!-- e 基因标记 1（绿色点） -->
                <circle cx="110" cy="240" r="3" fill="#4caf50"/>
                <!-- e 基因标记 2（绿色点） -->
                <circle cx="135" cy="240" r="3" fill="#4caf50"/>
            </g>

            <!-- 正常减数分裂路径 -->
            <g id="scene2-normal-path" class="scene2-element scene2-hidden">
                <!-- 分裂箭头 -->
                <line x1="200" y1="150" x2="260" y2="150" stroke="#888888" stroke-width="3" marker-end="url(#scene2-arrowhead)"/>
                
                <!-- 正常减 I 细胞 -->
                <g id="scene2-meiosis-normal-meiosis1">
                    <circle cx="300" cy="120" r="30" fill="none" stroke="#000000" stroke-width="2"/>
                    <!-- 复制后的 X 染色体 -->
                    <ellipse cx="295" cy="115" rx="5" ry="12" fill="#1565c0"/>
                    <ellipse cx="305" cy="115" rx="5" ry="12" fill="#1565c0"/>
                    <!-- 复制后的 Y 染色体 -->
                    <ellipse cx="295" cy="130" rx="4" ry="10" fill="#c62828"/>
                    <ellipse cx="305" cy="130" rx="4" ry="10" fill="#c62828"/>
                </g>

                <!-- 正常减 II 细胞（上） -->
                <g id="scene2-meiosis-normal-meiosis2-top">
                    <circle cx="400" cy="80" r="22" fill="none" stroke="#000000" stroke-width="1.5"/>
                    <ellipse cx="400" cy="75" rx="4" ry="10" fill="#1565c0"/>
                </g>

                <!-- 正常减 II 细胞（下） -->
                <g id="scene2-meiosis-normal-meiosis2-bottom">
                    <circle cx="400" cy="160" r="22" fill="none" stroke="#000000" stroke-width="1.5"/>
                    <ellipse cx="400" cy="155" rx="3" ry="8" fill="#c62828"/>
                </g>

                <!-- 正常配子 1（X^E） -->
                <g id="scene2-gamete-normal-1">
                    <circle cx="500" cy="80" r="18" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
                    <text x="500" y="84" text-anchor="middle" font-size="10" fill="#1565c0">X<tspan dy="-3" font-size="0.7em" fill="#ff9800">E</tspan></text>
                </g>

                <!-- 正常配子 2（Y） -->
                <g id="scene2-gamete-normal-2">
                    <circle cx="500" cy="160" r="18" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
                    <text x="500" y="164" text-anchor="middle" font-size="10" fill="#c62828">Y</text>
                </g>
            </g>

            <!-- 异常减数分裂路径（母本） -->
            <g id="scene2-abnormal-path-mother" class="scene2-element scene2-hidden">
                <!-- 母本区域高亮边框 -->
                <rect id="scene2-mother-highlight" x="80" y="200" width="70" height="70" fill="none" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5"/>

                <!-- 分裂箭头（指向异常路径） -->
                <line x1="200" y1="250" x2="260" y2="280" stroke="#c62828" stroke-width="3" marker-end="url(#scene2-arrowhead-red)"/>

                <!-- 异常减 I 细胞 -->
                <g id="scene2-meiosis-abnormal-meiosis1">
                    <circle cx="300" cy="280" r="30" fill="none" stroke="#c62828" stroke-width="2"/>
                    <!-- 两条 X 染色体未分离 -->
                    <ellipse cx="295" cy="275" rx="6" ry="15" fill="#1565c0"/>
                    <ellipse cx="305" cy="275" rx="6" ry="15" fill="#1565c0"/>
                </g>

                <!-- 异常减 II 细胞 -->
                <g id="scene2-meiosis-abnormal-meiosis2">
                    <circle cx="400" cy="280" r="25" fill="none" stroke="#c62828" stroke-width="2"/>
                    <ellipse cx="395" cy="275" rx="5" ry="12" fill="#1565c0"/>
                    <ellipse cx="405" cy="275" rx="5" ry="12" fill="#1565c0"/>
                </g>

                <!-- 异常配子（X^e X^e） -->
                <g id="scene2-gamete-abnormal-mother">
                    <circle cx="500" cy="280" r="18" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
                    <text x="500" y="284" text-anchor="middle" font-size="9" fill="#c62828">X<tspan dy="-3" font-size="0.6em" fill="#4caf50">e</tspan>X<tspan dy="-3" font-size="0.6em" fill="#4caf50">e</tspan></text>
                </g>

                <!-- 标签：同源染色体未分离 -->
                <text id="scene2-abnormal-label-mother" x="300" y="335" text-anchor="middle" font-size="11" fill="#c62828">同源染色体未分离</text>
            </g>

            <!-- 异常减数分裂路径（父本） -->
            <g id="scene2-abnormal-path-father" class="scene2-element scene2-hidden">
                <!-- 父本区域高亮边框 -->
                <rect id="scene2-father-highlight" x="80" y="70" width="70" height="70" fill="none" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5"/>

                <!-- 分裂箭头（指向异常路径） -->
                <line x1="200" y1="150" x2="260" y2="350" stroke="#c62828" stroke-width="3" marker-end="url(#scene2-arrowhead-red)"/>

                <!-- 异常减 I 细胞（父本）- 位置下移避免重叠 -->
                <g id="scene2-meiosis-abnormal-father-meiosis1">
                    <circle cx="300" cy="370" r="30" fill="none" stroke="#c62828" stroke-width="2"/>
                    <!-- X 和 Y 未分离 -->
                    <ellipse cx="295" cy="365" rx="5" ry="12" fill="#1565c0"/>
                    <ellipse cx="305" cy="370" rx="4" ry="10" fill="#c62828"/>
                </g>

                <!-- 异常减 II 细胞（父本） -->
                <g id="scene2-meiosis-abnormal-father-meiosis2">
                    <circle cx="400" cy="370" r="25" fill="none" stroke="#c62828" stroke-width="2"/>
                    <ellipse cx="395" cy="365" rx="4" ry="10" fill="#1565c0"/>
                    <ellipse cx="405" cy="370" rx="3" ry="8" fill="#c62828"/>
                </g>

                <!-- 异常配子（X^E Y） -->
                <g id="scene2-gamete-abnormal-father">
                    <circle cx="500" cy="370" r="18" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
                    <text x="500" y="374" text-anchor="middle" font-size="9" fill="#c62828">X<tspan dy="-3" font-size="0.6em" fill="#ff9800">E</tspan>Y</text>
                </g>

                <!-- 标签：同源染色体未分离 -->
                <text id="scene2-abnormal-label-father" x="300" y="420" text-anchor="middle" font-size="11" fill="#c62828">同源染色体未分离</text>
            </g>

            <!-- 受精箭头 -->
            <g id="scene2-fertilization-arrow" class="scene2-element scene2-hidden">
                <line x1="560" y1="280" x2="620" y2="220" stroke="#888888" stroke-width="3" marker-end="url(#scene2-arrowhead)"/>
            </g>

            <!-- 子代细胞 -->
            <g id="scene2-offspring" class="scene2-element scene2-hidden">
                <circle cx="680" cy="200" r="25" fill="#f5f5f5" stroke="#333333" stroke-width="2"/>
                <!-- 三条性染色体 -->
                <ellipse cx="675" cy="195" rx="4" ry="10" fill="#1565c0"/>
                <ellipse cx="685" cy="195" rx="4" ry="10" fill="#1565c0"/>
                <ellipse cx="680" cy="210" rx="3" ry="8" fill="#c62828"/>
                <!-- 基因标记 -->
                <circle cx="675" cy="192" r="2" fill="#ff9800"/>
                <circle cx="685" cy="192" r="2" fill="#4caf50"/>
            </g>

            <!-- 子代基因型标签 -->
            <text id="scene2-offspring-genotype" x="680" y="250" text-anchor="middle" font-size="13" fill="#333333" class="scene2-element scene2-hidden">
                X<tspan dy="-5" font-size="0.7em" fill="#ff9800">E</tspan><tspan dy="5">X<tspan dy="-5" font-size="0.7em" fill="#4caf50">e</tspan><tspan dy="5">Y</tspan></tspan>
            </text>
        </svg>

        <!-- HTML 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-btn-prev" class="scene2-btn">◀ 上一步</button>
            <span id="scene2-step-indicator">步骤 1/6</span>
            <button id="scene2-btn-next" class="scene2-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2: 减数分裂异常导致 X^E X^e Y 个体形成

        const totalSteps = 6;
        let currentStep = 0;

        // 步骤配置：每个步骤需要显示的元素
        const stepConfig = {
            0: {
                title: '亲本基因型：父本 XᴱY × 母本 XᵉXᵉ',
                show: ['scene2-p-label', 'scene2-parent-male', 'scene2-parent-female', 
                       'scene2-parent-male-genotype', 'scene2-parent-female-genotype',
                       'scene2-father-chromosomes', 'scene2-mother-chromosomes']
            },
            1: {
                title: '正常减数分裂：产生 Xᴱ 和 Y 两种配子',
                show: ['scene2-p-label', 'scene2-parent-male', 'scene2-parent-female',
                       'scene2-parent-male-genotype', 'scene2-parent-female-genotype',
                       'scene2-father-chromosomes', 'scene2-mother-chromosomes',
                       'scene2-normal-path', 'scene2-meiosis-normal-meiosis1',
                       'scene2-meiosis-normal-meiosis2-top', 'scene2-meiosis-normal-meiosis2-bottom',
                       'scene2-gamete-normal-1', 'scene2-gamete-normal-2']
            },
            2: {
                title: '异常情况 1：母本减数分裂 I 同源染色体未分离',
                show: ['scene2-p-label', 'scene2-parent-male', 'scene2-parent-female',
                       'scene2-parent-male-genotype', 'scene2-parent-female-genotype',
                       'scene2-father-chromosomes', 'scene2-mother-chromosomes',
                       'scene2-mother-highlight', 'scene2-abnormal-path-mother',
                       'scene2-meiosis-abnormal-meiosis1', 'scene2-meiosis-abnormal-meiosis2',
                       'scene2-gamete-abnormal-mother', 'scene2-abnormal-label-mother']
            },
            3: {
                title: '异常配子 XᵉXᵉ + 父本配子 Y → XᵉXᵉY',
                show: ['scene2-p-label', 'scene2-parent-male', 'scene2-parent-female',
                       'scene2-parent-male-genotype', 'scene2-parent-female-genotype',
                       'scene2-father-chromosomes', 'scene2-mother-chromosomes',
                       'scene2-mother-highlight', 'scene2-abnormal-path-mother',
                       'scene2-meiosis-abnormal-meiosis1', 'scene2-meiosis-abnormal-meiosis2',
                       'scene2-gamete-abnormal-mother', 'scene2-abnormal-label-mother',
                       'scene2-fertilization-arrow', 'scene2-offspring', 'scene2-offspring-genotype']
            },
            4: {
                title: '异常情况 2：父本减数分裂 I 同源染色体未分离',
                show: ['scene2-p-label', 'scene2-parent-male', 'scene2-parent-female',
                       'scene2-parent-male-genotype', 'scene2-parent-female-genotype',
                       'scene2-father-chromosomes', 'scene2-mother-chromosomes',
                       'scene2-father-highlight', 'scene2-abnormal-path-father',
                       'scene2-meiosis-abnormal-father-meiosis1', 'scene2-meiosis-abnormal-father-meiosis2',
                       'scene2-gamete-abnormal-father', 'scene2-abnormal-label-father']
            },
            5: {
                title: '结论：XᴱXᵉY 个体形成的两种可能原因',
                show: ['scene2-p-label', 'scene2-parent-male', 'scene2-parent-female',
                       'scene2-parent-male-genotype', 'scene2-parent-female-genotype',
                       'scene2-father-chromosomes', 'scene2-mother-chromosomes',
                       'scene2-mother-highlight', 'scene2-father-highlight',
                       'scene2-abnormal-path-mother', 'scene2-abnormal-path-father',
                       'scene2-meiosis-abnormal-meiosis1', 'scene2-meiosis-abnormal-meiosis2',
                       'scene2-gamete-abnormal-mother', 'scene2-abnormal-label-mother',
                       'scene2-meiosis-abnormal-father-meiosis1', 'scene2-meiosis-abnormal-father-meiosis2',
                       'scene2-gamete-abnormal-father', 'scene2-abnormal-label-father',
                       'scene2-fertilization-arrow', 'scene2-offspring', 'scene2-offspring-genotype']
            }
        };

        // 显示元素函数
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene2-hidden');
                el.style.display = '';
                el.style.opacity = '1';
            }
        }

        // 隐藏元素函数
        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.add('scene2-hidden');
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }

        // 隐藏所有元素
        function hideAllElements() {
            const allIds = [];
            Object.values(stepConfig).forEach(step => {
                step.show.forEach(id => allIds.push(id));
            });
            const uniqueIds = [...new Set(allIds)];
            uniqueIds.forEach(id => hideElement(id));
        }

        // 渲染步骤
        function renderStep(step) {
            const config = stepConfig[step];
            
            // 更新标题
            document.getElementById('scene2-step-title').textContent = config.title;
            
            // 更新步骤指示器
            document.getElementById('scene2-step-indicator').textContent = `步骤 ${step + 1}/${totalSteps}`;
            
            // 隐藏所有元素
            hideAllElements();
            
            // 显示当前步骤需要的元素
            config.show.forEach(id => showElement(id));
            
            // 更新按钮状态
            document.getElementById('scene2-btn-prev').disabled = (step === 0);
            document.getElementById('scene2-btn-next').disabled = (step === totalSteps - 1);
        }

        // 上一步
        function prevStep() {
            if (currentStep > 0) {
                currentStep--;
                renderStep(currentStep);
            }
        }

        // 下一步
        function nextStep() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                renderStep(currentStep);
            }
        }

        // 绑定事件
        document.getElementById('scene2-btn-prev').addEventListener('click', prevStep);
        document.getElementById('scene2-btn-next').addEventListener('click', nextStep);

        // 初始化
        renderStep(currentStep);
    })();
    </script>
</body>
</html>
