<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F₂代比例异常：配子致死机制</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #scene3-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene3-svg {
            width: 800px;
            height: 500px;
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .hidden {
            display: none;
        }
        .btn {
            cursor: pointer;
            rx: 5;
            ry: 5;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg id="scene3-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 标题 -->
            <text id="scene3-title" x="400" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">
                F₂代比例异常：配子致死机制
            </text>

            <!-- 亲本区 -->
            <text id="scene3-p-label-left" x="150" y="70" text-anchor="middle" font-size="14" fill="#555">P:</text>
            <text id="scene3-p-label-right" x="650" y="70" text-anchor="middle" font-size="14" fill="#555">P:</text>

            <!-- 亲本1果蝇图标（左侧） -->
            <g id="scene3-parent1-fly">
                <ellipse cx="120" cy="90" rx="30" ry="20" fill="#9e9e9e"/>
                <ellipse cx="100" cy="85" rx="15" ry="10" fill="#bdbdbd" opacity="0.7"/>
                <ellipse cx="140" cy="85" rx="15" ry="10" fill="#bdbdbd" opacity="0.7"/>
            </g>
            <text id="scene3-parent1-genotype" x="150" y="140" text-anchor="middle" font-size="14" fill="#2e7d32" font-weight="bold">VVRR</text>
            <text id="scene3-parent1-phenotype" x="150" y="160" text-anchor="middle" font-size="13" fill="#333">长翅细眼</text>

            <!-- 杂交符号 -->
            <text id="scene3-cross" x="400" y="130" text-anchor="middle" font-size="36" fill="#c62828" font-weight="bold">×</text>

            <!-- 亲本2果蝇图标（右侧） -->
            <g id="scene3-parent2-fly">
                <ellipse cx="620" cy="90" rx="30" ry="20" fill="#9e9e9e"/>
                <ellipse cx="600" cy="85" rx="15" ry="10" fill="#bdbdbd" opacity="0.7"/>
                <ellipse cx="640" cy="85" rx="15" ry="10" fill="#bdbdbd" opacity="0.7"/>
            </g>
            <text id="scene3-parent2-genotype" x="650" y="140" text-anchor="middle" font-size="14" fill="#c62828" font-weight="bold">vvrr</text>
            <text id="scene3-parent2-phenotype" x="650" y="160" text-anchor="middle" font-size="13" fill="#333">残翅粗眼</text>

            <!-- F1 代 -->
            <text id="scene3-f1-label" x="400" y="195" text-anchor="middle" font-size="16" font-weight="bold" fill="#555">F₁</text>
            <g id="scene3-f1-fly">
                <ellipse cx="400" cy="220" rx="35" ry="23" fill="#9e9e9e"/>
                <ellipse cx="375" cy="215" rx="18" ry="12" fill="#bdbdbd" opacity="0.7"/>
                <ellipse cx="425" cy="215" rx="18" ry="12" fill="#bdbdbd" opacity="0.7"/>
            </g>
            <text id="scene3-f1-genotype" x="400" y="265" text-anchor="middle" font-size="14" fill="#2e7d32" font-weight="bold">VvRr</text>
            <text id="scene3-f1-phenotype" x="400" y="285" text-anchor="middle" font-size="13" fill="#333">长翅细眼</text>

            <!-- 配子区 -->
            <text id="scene3-gamete-label" x="80" y="320" text-anchor="middle" font-size="14" fill="#555">配子:</text>

            <!-- 配子框 -->
            <g id="scene3-gametes">
                <rect id="scene3-gamete-vr-box" x="130" y="300" width="55" height="38" fill="none" stroke="#1565c0" stroke-width="2" rx="3"/>
                <text id="scene3-gamete-vr-text" x="157" y="323" text-anchor="middle" font-size="13" fill="#2e7d32" font-weight="bold">VR</text>

                <rect id="scene3-gamete-vr2-box" x="195" y="300" width="55" height="38" fill="none" stroke="#1565c0" stroke-width="2" rx="3"/>
                <text id="scene3-gamete-vr2-text" x="222" y="323" text-anchor="middle" font-size="13" fill="#333">Vr</text>

                <rect id="scene3-gamete-vr3-box" x="260" y="300" width="55" height="38" fill="none" stroke="#1565c0" stroke-width="2" rx="3"/>
                <text id="scene3-gamete-vr3-text" x="287" y="323" text-anchor="middle" font-size="13" fill="#c62828" font-weight="bold">vR</text>
                <line id="scene3-gamete-vr3-cross1" x1="265" y1="305" x2="310" y2="333" stroke="#c62828" stroke-width="2" class="hidden"/>
                <line id="scene3-gamete-vr3-cross2" x1="310" y1="305" x2="265" y2="333" stroke="#c62828" stroke-width="2" class="hidden"/>

                <rect id="scene3-gamete-vr4-box" x="325" y="300" width="55" height="38" fill="none" stroke="#1565c0" stroke-width="2" rx="3"/>
                <text id="scene3-gamete-vr4-text" x="352" y="323" text-anchor="middle" font-size="13" fill="#333">vr</text>
            </g>

            <!-- 棋盘格 -->
            <g id="scene3-punnett">
                <rect x="440" y="285" width="330" height="150" fill="none" stroke="#888888" stroke-width="2"/>
                <!-- 横线 -->
                <line x1="440" y1="322.5" x2="770" y2="322.5" stroke="#888888" stroke-width="1"/>
                <line x1="440" y1="360" x2="770" y2="360" stroke="#888888" stroke-width="1"/>
                <line x1="440" y1="397.5" x2="770" y2="397.5" stroke="#888888" stroke-width="1"/>
                <!-- 竖线 -->
                <line x1="522.5" y1="285" x2="522.5" y2="435" stroke="#888888" stroke-width="1"/>
                <line x1="605" y1="285" x2="605" y2="435" stroke="#888888" stroke-width="1"/>
                <line x1="687.5" y1="285" x2="687.5" y2="435" stroke="#888888" stroke-width="1"/>

                <!-- 雌雄配子标签 -->
                <text x="420" y="365" text-anchor="middle" font-size="12" fill="#555" transform="rotate(-90, 420, 365)">♀配子</text>
                <text x="605" y="275" text-anchor="middle" font-size="12" fill="#555">♂配子</text>

                <!-- 棋盘格内容（16 个格子） -->
                <g id="scene3-punnett-cells">
                    <!-- 第一行 -->
                    <text x="481" y="310" text-anchor="middle" font-size="10" fill="#333">VVRR</text>
                    <text x="563" y="310" text-anchor="middle" font-size="10" fill="#333">VVRr</text>
                    <text x="646" y="310" text-anchor="middle" font-size="10" fill="#333">VvRR</text>
                    <text x="728" y="310" text-anchor="middle" font-size="10" fill="#333">VvRr</text>
                    <!-- 第二行 -->
                    <text x="481" y="347" text-anchor="middle" font-size="10" fill="#333">VVRr</text>
                    <text x="563" y="347" text-anchor="middle" font-size="10" fill="#333">VVrr</text>
                    <text x="646" y="347" text-anchor="middle" font-size="10" fill="#333">VvRr</text>
                    <text x="728" y="347" text-anchor="middle" font-size="10" fill="#333">Vvrr</text>
                    <!-- 第三行 -->
                    <text x="481" y="385" text-anchor="middle" font-size="10" fill="#333">VvRR</text>
                    <text x="563" y="385" text-anchor="middle" font-size="10" fill="#333">VvRr</text>
                    <text x="646" y="385" text-anchor="middle" font-size="10" fill="#333">vvRR</text>
                    <text x="728" y="385" text-anchor="middle" font-size="10" fill="#333">vvRr</text>
                    <!-- 第四行 -->
                    <text x="481" y="422" text-anchor="middle" font-size="10" fill="#333">VvRr</text>
                    <text x="563" y="422" text-anchor="middle" font-size="10" fill="#333">Vvrr</text>
                    <text x="646" y="422" text-anchor="middle" font-size="10" fill="#333">vvRr</text>
                    <text x="728" y="422" text-anchor="middle" font-size="10" fill="#333">vvrr</text>
                </g>

                <!-- 致死格子标记（步骤 6 显示） -->
                <g id="scene3-punnett-lethal" class="hidden">
                    <rect x="605" y="285" width="82.5" height="37.5" fill="#ffcdd2" opacity="0.5"/>
                    <rect x="605" y="322.5" width="82.5" height="37.5" fill="#ffcdd2" opacity="0.5"/>
                    <rect x="605" y="360" width="82.5" height="37.5" fill="#ffcdd2" opacity="0.5"/>
                    <rect x="605" y="397.5" width="82.5" height="37.5" fill="#ffcdd2" opacity="0.5"/>
                    <line x1="605" y1="285" x2="687.5" y2="322.5" stroke="#c62828" stroke-width="2"/>
                    <line x1="687.5" y1="285" x2="605" y2="322.5" stroke="#c62828" stroke-width="2"/>
                    <line x1="605" y1="322.5" x2="687.5" y2="360" stroke="#c62828" stroke-width="2"/>
                    <line x1="687.5" y1="322.5" x2="605" y2="360" stroke="#c62828" stroke-width="2"/>
                    <line x1="605" y1="360" x2="687.5" y2="397.5" stroke="#c62828" stroke-width="2"/>
                    <line x1="687.5" y1="360" x2="605" y2="397.5" stroke="#c62828" stroke-width="2"/>
                    <line x1="605" y1="397.5" x2="687.5" y2="435" stroke="#c62828" stroke-width="2"/>
                    <line x1="687.5" y1="397.5" x2="605" y2="435" stroke="#c62828" stroke-width="2"/>
                </g>
            </g>

            <!-- 比例对比区 -->
            <text id="scene3-ratio-label" x="150" y="455" text-anchor="middle" font-size="13" fill="#555">表现型比例对比</text>

            <!-- 理论比例柱状图 -->
            <g id="scene3-ratio-theory">
                <rect x="60" y="465" width="28" height="45" fill="#1565c0" opacity="0.7"/>
                <rect x="95" y="465" width="28" height="28" fill="#1565c0" opacity="0.7"/>
                <rect x="130" y="465" width="28" height="28" fill="#1565c0" opacity="0.7"/>
                <rect x="165" y="465" width="28" height="17" fill="#1565c0" opacity="0.7"/>
                <text x="125" y="492" text-anchor="middle" font-size="11" fill="#333">9:3:3:1</text>
            </g>

            <!-- 实际比例柱状图 -->
            <g id="scene3-ratio-actual">
                <rect x="220" y="465" width="28" height="40" fill="#ff9800" opacity="0.7"/>
                <rect x="255" y="465" width="28" height="20" fill="#ff9800" opacity="0.7"/>
                <rect x="290" y="465" width="28" height="9" fill="#ff9800" opacity="0.7"/>
                <rect x="325" y="465" width="28" height="9" fill="#ff9800" opacity="0.7"/>
                <text x="285" y="492" text-anchor="middle" font-size="11" fill="#333">7:3:1:1</text>
            </g>

            <!-- 致死提示框 -->
            <g id="scene3-lethal-box">
                <rect x="480" y="445" width="290" height="45" fill="#ffcdd2" stroke="#c62828" stroke-width="2" rx="5"/>
                <text x="625" y="472" text-anchor="middle" font-size="13" fill="#c62828" font-weight="bold">vR 雄配子致死</text>
            </g>

            <!-- 结论文本 -->
            <text id="scene3-conclusion" x="625" y="495" text-anchor="middle" font-size="12" fill="#c62828" class="hidden">基因型为 vR 的雄配子致死</text>

            <!-- 控制按钮 -->
            <g id="scene3-controls">
                <rect id="scene3-btn-prev-bg" x="660" y="465" width="85" height="30" fill="#bdbdbd" rx="5" class="btn"/>
                <text id="scene3-btn-prev-text" x="702" y="485" text-anchor="middle" font-size="12" fill="#333">◀ 上一步</text>

                <rect id="scene3-btn-next-bg" x="755" y="465" width="85" height="30" fill="#1565c0" rx="5" class="btn"/>
                <text id="scene3-btn-next-text" x="797" y="485" text-anchor="middle" font-size="12" fill="#fff">下一步 ▶</text>
            </g>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 3: F₂代比例异常：配子致死机制
        let currentStep = 0;
        const totalSteps = 6;

        // 获取所有需要控制的元素
        const elements = {
            // F1 代
            f1Label: document.getElementById('scene3-f1-label'),
            f1Fly: document.getElementById('scene3-f1-fly'),
            f1Genotype: document.getElementById('scene3-f1-genotype'),
            f1Phenotype: document.getElementById('scene3-f1-phenotype'),

            // 配子区
            gameteLabel: document.getElementById('scene3-gamete-label'),
            gametes: document.getElementById('scene3-gametes'),
            gameteVr3Cross1: document.getElementById('scene3-gamete-vr3-cross1'),
            gameteVr3Cross2: document.getElementById('scene3-gamete-vr3-cross2'),

            // 棋盘格
            punnett: document.getElementById('scene3-punnett'),
            punnettCells: document.getElementById('scene3-punnett-cells'),
            punnettLethal: document.getElementById('scene3-punnett-lethal'),

            // 比例图
            ratioTheory: document.getElementById('scene3-ratio-theory'),
            ratioActual: document.getElementById('scene3-ratio-actual'),

            // 致死提示
            lethalBox: document.getElementById('scene3-lethal-box'),
            conclusion: document.getElementById('scene3-conclusion'),

            // 按钮
            btnPrevBg: document.getElementById('scene3-btn-prev-bg'),
            btnPrevText: document.getElementById('scene3-btn-prev-text'),
            btnNextBg: document.getElementById('scene3-btn-next-bg'),
            btnNextText: document.getElementById('scene3-btn-next-text')
        };

        // 显示/隐藏函数
        function show(el) {
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }

        function hide(el) {
            if (el) {
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }

        // 更新按钮状态
        function updateButtons() {
            if (currentStep === 0) {
                elements.btnPrevBg.setAttribute('fill', '#e0e0e0');
                elements.btnPrevText.setAttribute('fill', '#999');
            } else {
                elements.btnPrevBg.setAttribute('fill', '#bdbdbd');
                elements.btnPrevText.setAttribute('fill', '#333');
            }

            if (currentStep === totalSteps) {
                elements.btnNextBg.setAttribute('fill', '#e0e0e0');
                elements.btnNextText.setAttribute('fill', '#999');
            } else {
                elements.btnNextBg.setAttribute('fill', '#1565c0');
                elements.btnNextText.setAttribute('fill', '#fff');
            }
        }

        // 更新场景状态
        function updateScene() {
            // 步骤 0: 只显示亲本
            // 步骤 1: 显示 F1
            // 步骤 2: 显示配子
            // 步骤 3: 显示棋盘格和理论比例
            // 步骤 4: 显示实际比例
            // 步骤 5: 显示致死提示，标记 vR 配子
            // 步骤 6: 显示棋盘格致死列，结论文本

            // F1 代
            if (currentStep >= 1) {
                show(elements.f1Label);
                show(elements.f1Fly);
                show(elements.f1Genotype);
                show(elements.f1Phenotype);
            } else {
                hide(elements.f1Label);
                hide(elements.f1Fly);
                hide(elements.f1Genotype);
                hide(elements.f1Phenotype);
            }

            // 配子区
            if (currentStep >= 2) {
                show(elements.gameteLabel);
                show(elements.gametes);
            } else {
                hide(elements.gameteLabel);
                hide(elements.gametes);
            }

            // vR 配子叉号
            if (currentStep >= 5) {
                elements.gameteVr3Cross1.classList.remove('hidden');
                elements.gameteVr3Cross2.classList.remove('hidden');
            } else {
                elements.gameteVr3Cross1.classList.add('hidden');
                elements.gameteVr3Cross2.classList.add('hidden');
            }

            // 棋盘格
            if (currentStep >= 3) {
                show(elements.punnett);
                show(elements.punnettCells);
                show(elements.ratioTheory);
            } else {
                hide(elements.punnett);
                hide(elements.punnettCells);
                hide(elements.ratioTheory);
            }

            // 实际比例
            if (currentStep >= 4) {
                show(elements.ratioActual);
            } else {
                hide(elements.ratioActual);
            }

            // 致死提示
            if (currentStep >= 5) {
                show(elements.lethalBox);
            } else {
                hide(elements.lethalBox);
            }

            // 棋盘格致死列和结论
            if (currentStep >= 6) {
                show(elements.punnettLethal);
                show(elements.conclusion);
            } else {
                hide(elements.punnettLethal);
                hide(elements.conclusion);
            }

            updateButtons();
        }

        // 下一步
        function stepForward() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateScene();
            }
        }

        // 上一步
        function stepBack() {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        }

        // 绑定按钮事件
        document.getElementById('scene3-btn-prev-bg').addEventListener('click', stepBack);
        document.getElementById('scene3-btn-next-bg').addEventListener('click', stepForward);

        // 初始化
        updateScene();
    })();
    </script>
</body>
</html>
