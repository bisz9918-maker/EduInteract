<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>遗传分析实验流程 - 场景2</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', sans-serif;
        }
        #scene2-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene2-svg {
            width: 800px;
            height: 500px;
        }
        /* 亲本框样式 */
        .scene2-parent-box {
            fill: rgba(21, 101, 192, 0.15);
            stroke: #1565c0;
            stroke-width: 2;
        }
        .scene2-parent-box.highlight {
            stroke: #2e7d32;
            stroke-width: 4;
        }
        /* 自交结果框样式 */
        .scene2-self-box {
            fill: rgba(46, 125, 50, 0.15);
            stroke: #2e7d32;
            stroke-width: 2;
        }
        /* 杂交结果框样式 */
        .scene2-cross-box {
            fill: rgba(198, 40, 40, 0.15);
            stroke: #c62828;
            stroke-width: 2;
        }
        /* 筛选框样式 */
        .scene2-filter-box {
            fill: #e8f5e9;
            stroke: #2e7d32;
            stroke-width: 2;
        }
        /* 高亮闪烁动画 */
        @keyframes scene2-flash {
            0%, 100% { fill: rgba(255, 235, 59, 0.5); }
            50% { fill: rgba(255, 235, 59, 0.9); }
        }
        .scene2-highlight-flash {
            animation: scene2-flash 1s infinite;
        }
        /* 箭头样式 */
        .scene2-arrow {
            stroke: #333;
            stroke-width: 2;
            fill: none;
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            transition: stroke-dashoffset 0.5s ease;
        }
        .scene2-arrow.visible {
            stroke-dashoffset: 0;
        }
        /* 按钮样式 */
        .scene2-btn {
            cursor: pointer;
            rx: 5;
            ry: 5;
        }
        .scene2-btn-prev {
            fill: #9e9e9e;
            stroke: #616161;
        }
        .scene2-btn-next {
            fill: #1565c0;
            stroke: #0d47a1;
        }
        .scene2-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .scene2-btn-text {
            fill: #fff;
            font-size: 14px;
            font-weight: bold;
            text-anchor: middle;
            dominant-baseline: middle;
            pointer-events: none;
        }
        /* 标题样式 */
        .scene2-title {
            font-size: 16px;
            font-weight: bold;
            fill: #333;
            text-anchor: middle;
        }
        /* 标签样式 */
        .scene2-label {
            font-size: 14px;
            fill: #333;
            text-anchor: middle;
        }
        .scene2-result-text {
            font-size: 13px;
            fill: #333;
            text-anchor: middle;
        }
        /* 元素显隐控制 */
        .scene2-hidden {
            display: none;
            opacity: 0;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500">
            <!-- 三列标题 -->
            <text id="scene2-title-parent" class="scene2-title" x="90" y="30">亲本类型</text>
            <text id="scene2-title-self" class="scene2-title" x="350" y="30">自交系一代</text>
            <text id="scene2-title-cross" class="scene2-title" x="590" y="30">杂交系一代</text>

            <!-- 亲本类型组 (a-e) -->
            <g id="scene2-parents">
                <!-- 亲本 a: 一条染色体有S，线粒体有S -->
                <rect id="scene2-parent-box-a" class="scene2-parent-box" x="40" y="60" width="100" height="55" rx="5"/>
                <circle id="scene2-parent-icon-a" cx="90" cy="88" r="20" fill="#fff" stroke="#1565c0" stroke-width="1.5"/>
                <!-- 染色体: 一条有S(箭头)，一条无S -->
                <line x1="82" y1="75" x2="82" y2="95" stroke="#333" stroke-width="2"/>
                <line x1="98" y1="75" x2="98" y2="95" stroke="#333" stroke-width="2"/>
                <polygon points="82,75 79,82 85,82" fill="#333"/>
                <!-- 线粒体: 有S(带点) -->
                <circle cx="90" cy="103" r="5" fill="#fff" stroke="#333" stroke-width="1"/>
                <circle cx="90" cy="103" r="2" fill="#333"/>
                <text class="scene2-label" x="90" y="55">a</text>

                <!-- 亲本 b: 一条染色体有S，线粒体无S -->
                <rect id="scene2-parent-box-b" class="scene2-parent-box" x="40" y="130" width="100" height="55" rx="5"/>
                <circle id="scene2-parent-icon-b" cx="90" cy="158" r="20" fill="#fff" stroke="#1565c0" stroke-width="1.5"/>
                <line x1="82" y1="145" x2="82" y2="165" stroke="#333" stroke-width="2"/>
                <polygon points="82,145 79,152 85,152" fill="#333"/>
                <line x1="98" y1="145" x2="98" y2="165" stroke="#333" stroke-width="2"/>
                <circle cx="90" cy="173" r="5" fill="#fff" stroke="#333" stroke-width="1"/>
                <text class="scene2-label" x="90" y="125">b</text>

                <!-- 亲本 c: 两条染色体有S，线粒体有S -->
                <rect id="scene2-parent-box-c" class="scene2-parent-box" x="40" y="200" width="100" height="55" rx="5"/>
                <circle id="scene2-parent-icon-c" cx="90" cy="228" r="20" fill="#fff" stroke="#1565c0" stroke-width="1.5"/>
                <line x1="82" y1="215" x2="82" y2="235" stroke="#333" stroke-width="2"/>
                <polygon points="82,215 79,222 85,222" fill="#333"/>
                <line x1="98" y1="215" x2="98" y2="235" stroke="#333" stroke-width="2"/>
                <polygon points="98,215 95,222 101,222" fill="#333"/>
                <circle cx="90" cy="243" r="5" fill="#fff" stroke="#333" stroke-width="1"/>
                <circle cx="90" cy="243" r="2" fill="#333"/>
                <text class="scene2-label" x="90" y="195">c</text>

                <!-- 亲本 d: 两条染色体有S，线粒体无S (符合要求的类型) -->
                <rect id="scene2-parent-box-d" class="scene2-parent-box" x="40" y="270" width="100" height="55" rx="5"/>
                <circle id="scene2-parent-icon-d" cx="90" cy="298" r="20" fill="#fff" stroke="#1565c0" stroke-width="1.5"/>
                <line x1="82" y1="285" x2="82" y2="305" stroke="#333" stroke-width="2"/>
                <polygon points="82,285 79,292 85,292" fill="#333"/>
                <line x1="98" y1="285" x2="98" y2="305" stroke="#333" stroke-width="2"/>
                <polygon points="98,285 95,292 101,292" fill="#333"/>
                <circle cx="90" cy="313" r="5" fill="#fff" stroke="#333" stroke-width="1"/>
                <text class="scene2-label" x="90" y="265">d</text>

                <!-- 亲本 e: 染色体无S，线粒体有S -->
                <rect id="scene2-parent-box-e" class="scene2-parent-box" x="40" y="340" width="100" height="55" rx="5"/>
                <circle id="scene2-parent-icon-e" cx="90" cy="368" r="20" fill="#fff" stroke="#1565c0" stroke-width="1.5"/>
                <line x1="82" y1="355" x2="82" y2="375" stroke="#333" stroke-width="2"/>
                <line x1="98" y1="355" x2="98" y2="375" stroke="#333" stroke-width="2"/>
                <circle cx="90" cy="383" r="5" fill="#fff" stroke="#333" stroke-width="1"/>
                <circle cx="90" cy="383" r="2" fill="#333"/>
                <text class="scene2-label" x="90" y="335">e</text>
            </g>

            <!-- 自交结果组 -->
            <g id="scene2-self-results" class="scene2-hidden">
                <rect id="scene2-self-box-a" class="scene2-self-box" x="280" y="60" width="140" height="55" rx="5"/>
                <text class="scene2-result-text" x="350" y="88">3:1 抗:感</text>

                <rect id="scene2-self-box-b" class="scene2-self-box" x="280" y="130" width="140" height="55" rx="5"/>
                <text class="scene2-result-text" x="350" y="158">3:1 抗:感</text>

                <rect id="scene2-self-box-c" class="scene2-self-box" x="280" y="200" width="140" height="55" rx="5"/>
                <text class="scene2-result-text" x="350" y="228">100% 抗性</text>

                <rect id="scene2-self-box-d" class="scene2-self-box" x="280" y="270" width="140" height="55" rx="5"/>
                <text class="scene2-result-text" x="350" y="298">100% 抗性</text>

                <rect id="scene2-self-box-e" class="scene2-self-box" x="280" y="340" width="140" height="55" rx="5"/>
                <text class="scene2-result-text" x="350" y="368">全感病</text>
            </g>

            <!-- 杂交结果组 -->
            <g id="scene2-cross-results" class="scene2-hidden">
                <rect id="scene2-cross-box-a" class="scene2-cross-box" x="520" y="60" width="140" height="55" rx="5"/>
                <text class="scene2-result-text" x="590" y="88">3:1 抗:感</text>

                <rect id="scene2-cross-box-b" class="scene2-cross-box" x="520" y="130" width="140" height="55" rx="5"/>
                <text class="scene2-result-text" x="590" y="158">3:1 抗:感</text>

                <rect id="scene2-cross-box-c" class="scene2-cross-box" x="520" y="200" width="140" height="55" rx="5"/>
                <text class="scene2-result-text" x="590" y="228">100% 抗性</text>

                <rect id="scene2-cross-box-d" class="scene2-cross-box" x="520" y="270" width="140" height="55" rx="5"/>
                <text class="scene2-result-text" x="590" y="298">100% 抗性</text>

                <rect id="scene2-cross-box-e" class="scene2-cross-box" x="520" y="340" width="140" height="55" rx="5"/>
                <text class="scene2-result-text" x="590" y="368">全感病</text>
            </g>

            <!-- 箭头组 (亲本→自交) -->
            <g id="scene2-arrows-self" class="scene2-hidden">
                <path id="scene2-arrow-self-a" class="scene2-arrow" d="M145,85 L275,85"/>
                <path id="scene2-arrow-self-b" class="scene2-arrow" d="M145,155 L275,155"/>
                <path id="scene2-arrow-self-c" class="scene2-arrow" d="M145,225 L275,225"/>
                <path id="scene2-arrow-self-d" class="scene2-arrow" d="M145,295 L275,295"/>
                <path id="scene2-arrow-self-e" class="scene2-arrow" d="M145,365 L275,365"/>
            </g>

            <!-- 箭头组 (自交→杂交) -->
            <g id="scene2-arrows-cross" class="scene2-hidden">
                <path id="scene2-arrow-cross-a" class="scene2-arrow" d="M425,85 L515,85"/>
                <path id="scene2-arrow-cross-b" class="scene2-arrow" d="M425,155 L515,155"/>
                <path id="scene2-arrow-cross-c" class="scene2-arrow" d="M425,225 L515,225"/>
                <path id="scene2-arrow-cross-d" class="scene2-arrow" d="M425,295 L515,295"/>
                <path id="scene2-arrow-cross-e" class="scene2-arrow" d="M425,365 L515,365"/>
            </g>

            <!-- 筛选条件框 -->
            <g id="scene2-filter-group" class="scene2-hidden">
                <rect id="scene2-filter-box" class="scene2-filter-box" x="200" y="420" width="400" height="60" rx="5"/>
                <text id="scene2-filter-text1" class="scene2-result-text" x="400" y="445" style="font-weight: bold;">符合要求的种子：自交系一代 100% 抗性 且 杂交系一代 100% 抗性</text>
                <text id="scene2-filter-text2" class="scene2-result-text" x="400" y="465" style="fill: #2e7d32; font-weight: bold;">→ 类型 d</text>
            </g>

            <!-- 高亮注释 -->
            <g id="scene2-highlight-note" class="scene2-hidden">
                <text id="scene2-note-text" x="350" y="400" style="font-size: 12px; fill: #f57c00; text-anchor: middle;">线粒体基因不遵循孟德尔遗传</text>
            </g>

            <!-- 控件栏 -->
            <g id="scene2-controls">
                <rect id="scene2-btn-prev" class="scene2-btn scene2-btn-prev" x="280" y="460" width="80" height="30"/>
                <text id="scene2-btn-prev-text" class="scene2-btn-text" x="320" y="475">◀ 上一步</text>

                <text id="scene2-step-indicator" class="scene2-label" x="400" y="477">步骤 1/5</text>

                <rect id="scene2-btn-next" class="scene2-btn scene2-btn-next" x="440" y="460" width="80" height="30"/>
                <text id="scene2-btn-next-text" class="scene2-btn-text" x="480" y="475">下一步 ▶</text>
            </g>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 2 实现 - 遗传分析实验流程

        var currentStep = 0;
        var totalSteps = 5;

        // 工具函数：显示元素
        function show(el) {
            if (el) {
                el.classList.remove('scene2-hidden');
                el.style.display = '';
                el.style.opacity = '1';
            }
        }

        // 工具函数：隐藏元素
        function hide(el) {
            if (el) {
                el.classList.add('scene2-hidden');
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }

        // 更新步骤显示
        function updateStepDisplay() {
            var stepIndicator = document.getElementById('scene2-step-indicator');
            var btnPrev = document.getElementById('scene2-btn-prev');
            var btnNext = document.getElementById('scene2-btn-next');

            stepIndicator.textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;

            // 按钮状态
            if (currentStep === 0) {
                btnPrev.style.opacity = '0.5';
                btnPrev.style.cursor = 'not-allowed';
            } else {
                btnPrev.style.opacity = '1';
                btnPrev.style.cursor = 'pointer';
            }

            if (currentStep === totalSteps - 1) {
                btnNext.style.opacity = '0.5';
                btnNext.style.cursor = 'not-allowed';
            } else {
                btnNext.style.opacity = '1';
                btnNext.style.cursor = 'pointer';
            }
        }

        // 设置步骤状态
        function setStep(step) {
            currentStep = step;

            // 获取所有需要控制的元素
            var selfResults = document.getElementById('scene2-self-results');
            var crossResults = document.getElementById('scene2-cross-results');
            var arrowsSelf = document.getElementById('scene2-arrows-self');
            var arrowsCross = document.getElementById('scene2-arrows-cross');
            var filterGroup = document.getElementById('scene2-filter-group');
            var highlightNote = document.getElementById('scene2-highlight-note');

            var parentBoxD = document.getElementById('scene2-parent-box-d');
            var selfBoxD = document.getElementById('scene2-self-box-d');
            var crossBoxD = document.getElementById('scene2-cross-box-d');
            var selfBoxE = document.getElementById('scene2-self-box-e');

            // 重置所有高亮
            if (parentBoxD) parentBoxD.classList.remove('highlight');
            if (selfBoxD) selfBoxD.classList.remove('highlight');
            if (crossBoxD) crossBoxD.classList.remove('highlight');
            if (selfBoxE) selfBoxE.classList.remove('scene2-highlight-flash');

            // 根据步骤显示/隐藏元素
            switch (step) {
                case 0:
                    // 初始状态：只显示亲本类型
                    hide(selfResults);
                    hide(crossResults);
                    hide(arrowsSelf);
                    hide(arrowsCross);
                    hide(filterGroup);
                    hide(highlightNote);
                    break;

                case 1:
                    // 显示自交结果和箭头
                    show(arrowsSelf);
                    // 延迟显示结果框
                    setTimeout(function() {
                        show(selfResults);
                    }, 200);
                    hide(crossResults);
                    hide(arrowsCross);
                    hide(filterGroup);
                    hide(highlightNote);
                    break;

                case 2:
                    // 显示杂交结果和箭头
                    show(arrowsSelf);
                    show(selfResults);
                    show(arrowsCross);
                    setTimeout(function() {
                        show(crossResults);
                    }, 200);
                    hide(filterGroup);
                    hide(highlightNote);
                    break;

                case 3:
                    // 高亮 e 的特殊情况
                    show(arrowsSelf);
                    show(selfResults);
                    show(arrowsCross);
                    show(crossResults);
                    hide(filterGroup);
                    show(highlightNote);
                    if (selfBoxE) {
                        selfBoxE.classList.add('scene2-highlight-flash');
                    }
                    break;

                case 4:
                    // 显示筛选条件，高亮 d 类型
                    show(arrowsSelf);
                    show(selfResults);
                    show(arrowsCross);
                    show(crossResults);
                    show(filterGroup);
                    hide(highlightNote);
                    if (selfBoxE) selfBoxE.classList.remove('scene2-highlight-flash');
                    if (parentBoxD) parentBoxD.classList.add('highlight');
                    if (selfBoxD) selfBoxD.classList.add('highlight');
                    if (crossBoxD) crossBoxD.classList.add('highlight');
                    break;

                case 5:
                    // 最终状态（同步骤4）
                    show(arrowsSelf);
                    show(selfResults);
                    show(arrowsCross);
                    show(crossResults);
                    show(filterGroup);
                    hide(highlightNote);
                    if (parentBoxD) parentBoxD.classList.add('highlight');
                    if (selfBoxD) selfBoxD.classList.add('highlight');
                    if (crossBoxD) crossBoxD.classList.add('highlight');
                    break;
            }

            updateStepDisplay();
        }

        // 上一步
        function prevStep() {
            if (currentStep > 0) {
                setStep(currentStep - 1);
            }
        }

        // 下一步
        function nextStep() {
            if (currentStep < totalSteps - 1) {
                setStep(currentStep + 1);
            }
        }

        // 绑定按钮事件
        document.getElementById('scene2-btn-prev').addEventListener('click', function() {
            if (currentStep > 0) {
                prevStep();
            }
        });

        document.getElementById('scene2-btn-next').addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                nextStep();
            }
        });

        // 初始化
        setStep(0);
    })();
    </script>
</body>
</html>
