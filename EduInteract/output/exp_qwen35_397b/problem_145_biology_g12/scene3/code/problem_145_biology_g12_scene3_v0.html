<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>遗传概率计算 - 场景 3</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene3-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 2px solid #333; border-radius: 4px; background: #f0f0f0; }
        .scene3-btn:hover { background: #e0e0e0; }
        .scene3-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene3-step-indicator { font-size: 14px; font-weight: bold; padding: 8px 16px; }
        .hidden { display: none !important; }
        .highlight-path { fill: rgba(46, 125, 50, 0.3); stroke: #2e7d32; stroke-width: 3; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 亲本标题 -->
            <text id="scene3-title" x="400" y="45" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000">亲本基因型</text>

            <!-- Ⅱ-3 基因型框 -->
            <g id="scene3-parent-ii3">
                <rect x="150" y="60" width="180" height="50" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                <text x="240" y="82" text-anchor="middle" font-size="16" fill="#000000">AaX<sup>B</sup>Y</text>
                <text x="240" y="102" text-anchor="middle" font-size="13" fill="#666666">Ⅱ-3</text>
            </g>

            <!-- Ⅱ-4 基因型框 -->
            <g id="scene3-parent-ii4">
                <rect x="470" y="60" width="180" height="50" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                <text x="560" y="82" text-anchor="middle" font-size="16" fill="#000000">aaX<sup>B</sup>X<sup>b</sup></text>
                <text x="560" y="102" text-anchor="middle" font-size="13" fill="#666666">Ⅱ-4</text>
            </g>

            <!-- 分支标题 -->
            <text id="scene3-branch-title" x="400" y="135" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000" class="hidden">后代基因型分支图</text>

            <!-- 分支树 -->
            <g id="scene3-branch-tree" class="hidden">
                <!-- 根节点 -->
                <circle id="scene3-branch-root" cx="400" cy="160" r="6" fill="#333333"/>

                <!-- 甲病分支线（蓝色） -->
                <line id="scene3-branch-aa-line1" x1="400" y1="160" x2="300" y2="210" stroke="#1565c0" stroke-width="2" class="hidden"/>
                <line id="scene3-branch-aa-line2" x1="400" y1="160" x2="500" y2="210" stroke="#1565c0" stroke-width="2" class="hidden"/>

                <!-- 甲病节点 -->
                <circle id="scene3-branch-aa-node1" cx="300" cy="210" r="5" fill="#1565c0" class="hidden"/>
                <circle id="scene3-branch-aa-node2" cx="500" cy="210" r="5" fill="#1565c0" class="hidden"/>

                <!-- 甲病标签 -->
                <text id="scene3-branch-aa-label1" x="285" y="200" text-anchor="end" font-size="14" fill="#1565c0" font-weight="bold" class="hidden">Aa</text>
                <text id="scene3-branch-aa-label2" x="515" y="200" text-anchor="start" font-size="14" fill="#1565c0" font-weight="bold" class="hidden">aa</text>

                <!-- 甲病概率 -->
                <text id="scene3-branch-aa-prob1" x="340" y="180" text-anchor="middle" font-size="13" fill="#000000" class="hidden">1/2</text>
                <text id="scene3-branch-aa-prob2" x="460" y="180" text-anchor="middle" font-size="13" fill="#000000" class="hidden">1/2</text>

                <!-- 乙病分支线（红色） -->
                <line id="scene3-branch-ab-line1" x1="300" y1="210" x2="250" y2="270" stroke="#c62828" stroke-width="2" class="hidden"/>
                <line id="scene3-branch-ab-line2" x1="300" y1="210" x2="350" y2="270" stroke="#c62828" stroke-width="2" class="hidden"/>
                <line id="scene3-branch-ab-line3" x1="500" y1="210" x2="450" y2="270" stroke="#c62828" stroke-width="2" class="hidden"/>
                <line id="scene3-branch-ab-line4" x1="500" y1="210" x2="550" y2="270" stroke="#c62828" stroke-width="2" class="hidden"/>

                <!-- 乙病节点 -->
                <circle id="scene3-branch-ab-node1" cx="250" cy="270" r="4" fill="#c62828" class="hidden"/>
                <circle id="scene3-branch-ab-node2" cx="350" cy="270" r="4" fill="#c62828" class="hidden"/>
                <circle id="scene3-branch-ab-node3" cx="450" cy="270" r="4" fill="#c62828" class="hidden"/>
                <circle id="scene3-branch-ab-node4" cx="550" cy="270" r="4" fill="#c62828" class="hidden"/>

                <!-- 乙病标签 -->
                <text id="scene3-branch-ab-label1" x="250" y="290" text-anchor="middle" font-size="12" fill="#c62828" class="hidden">X<sup>B</sup>Y</text>
                <text id="scene3-branch-ab-label2" x="350" y="290" text-anchor="middle" font-size="12" fill="#c62828" class="hidden">X<sup>b</sup>Y</text>
                <text id="scene3-branch-ab-label3" x="450" y="290" text-anchor="middle" font-size="12" fill="#c62828" class="hidden">X<sup>B</sup>X<sup>B</sup></text>
                <text id="scene3-branch-ab-label4" x="550" y="290" text-anchor="middle" font-size="12" fill="#c62828" class="hidden">X<sup>B</sup>X<sup>b</sup></text>

                <!-- 乙病概率 -->
                <text id="scene3-branch-ab-prob1" x="270" y="245" text-anchor="middle" font-size="11" fill="#000000" class="hidden">1/2</text>
                <text id="scene3-branch-ab-prob2" x="330" y="245" text-anchor="middle" font-size="11" fill="#000000" class="hidden">1/2</text>
                <text id="scene3-branch-ab-prob3" x="470" y="245" text-anchor="middle" font-size="11" fill="#000000" class="hidden">1/2</text>
                <text id="scene3-branch-ab-prob4" x="530" y="245" text-anchor="middle" font-size="11" fill="#000000" class="hidden">1/2</text>

                <!-- 两病兼患高亮路径（步骤 5 显示） -->
                <g id="scene3-highlight-path" class="hidden">
                    <path d="M 400 160 L 300 210 L 350 270" fill="none" stroke="#2e7d32" stroke-width="4" opacity="0.5"/>
                    <circle cx="300" cy="210" r="8" fill="#2e7d32" opacity="0.3"/>
                    <circle cx="350" cy="270" r="7" fill="#2e7d32" opacity="0.3"/>
                </g>
            </g>

            <!-- 甲病结果框 -->
            <g id="scene3-result-aa" class="hidden">
                <rect x="280" y="320" width="100" height="30" fill="#ffffff" stroke="#1565c0" stroke-width="2"/>
                <text x="330" y="340" text-anchor="middle" font-size="14" fill="#1565c0" font-weight="bold">甲病：1/2</text>
            </g>

            <!-- 乙病结果框 -->
            <g id="scene3-result-ab" class="hidden">
                <rect x="420" y="320" width="100" height="30" fill="#ffffff" stroke="#c62828" stroke-width="2"/>
                <text x="470" y="340" text-anchor="middle" font-size="14" fill="#c62828" font-weight="bold">乙病：1/4</text>
            </g>

            <!-- 计算过程框 -->
            <g id="scene3-calc-box" class="hidden">
                <rect x="200" y="370" width="400" height="50" fill="#ffffff" stroke="#888888" stroke-width="2"/>
                <text x="400" y="395" text-anchor="middle" font-size="16" fill="#000000">两病兼患概率 = P(甲病) × P(乙病)</text>
                <text x="400" y="415" text-anchor="middle" font-size="16" fill="#000000" font-weight="bold">= 1/2 × 1/4 = 1/8</text>
            </g>

            <!-- 结论框 -->
            <g id="scene3-conclusion" class="hidden">
                <rect x="320" y="430" width="160" height="40" fill="#1565c0" stroke="#1565c0" stroke-width="2"/>
                <text x="400" y="455" text-anchor="middle" font-size="16" fill="#ffffff" font-weight="bold">概率 = 1/8</text>
            </g>

            <!-- 控件栏（SVG 内部底部） -->
            <g id="scene3-controls">
                <rect id="scene3-btn-prev-bg" x="280" y="455" width="80" height="30" fill="#f0f0f0" stroke="#333333" stroke-width="2" rx="4"/>
                <text id="scene3-btn-prev-text" x="320" y="475" text-anchor="middle" font-size="14" fill="#000000">◀ 上一步</text>

                <text id="scene3-step-indicator" x="400" y="475" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333">步骤 1/6</text>

                <rect id="scene3-btn-next-bg" x="440" y="455" width="80" height="30" fill="#f0f0f0" stroke="#333333" stroke-width="2" rx="4"/>
                <text id="scene3-btn-next-text" x="480" y="475" text-anchor="middle" font-size="14" fill="#000000">下一步 ▶</text>
            </g>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 3 实现：遗传概率计算分支图

        // 状态管理
        let currentStep = 0;
        const totalSteps = 6;

        // 工具函数：显示元素
        function show(el) {
            if (el) {
                el.classList.remove('hidden');
                el.style.display = '';
                el.style.opacity = '1';
            }
        }

        // 工具函数：隐藏元素
        function hide(el) {
            if (el) {
                el.classList.add('hidden');
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }

        // 获取元素
        function getEl(id) {
            return document.getElementById(id);
        }

        // 更新步骤显示
        function updateStepDisplay() {
            // 步骤 0：只显示亲本基因型
            if (currentStep === 0) {
                show(getEl('scene3-title'));
                show(getEl('scene3-parent-ii3'));
                show(getEl('scene3-parent-ii4'));
                hide(getEl('scene3-branch-title'));
                hide(getEl('scene3-branch-tree'));
                hide(getEl('scene3-result-aa'));
                hide(getEl('scene3-result-ab'));
                hide(getEl('scene3-calc-box'));
                hide(getEl('scene3-conclusion'));
                hide(getEl('scene3-highlight-path'));
            }
            // 步骤 1：显示甲病分支
            else if (currentStep === 1) {
                show(getEl('scene3-branch-title'));
                show(getEl('scene3-branch-tree'));
                show(getEl('scene3-branch-root'));
                show(getEl('scene3-branch-aa-line1'));
                show(getEl('scene3-branch-aa-line2'));
                show(getEl('scene3-branch-aa-node1'));
                show(getEl('scene3-branch-aa-node2'));
                show(getEl('scene3-branch-aa-label1'));
                show(getEl('scene3-branch-aa-label2'));
                show(getEl('scene3-branch-aa-prob1'));
                show(getEl('scene3-branch-aa-prob2'));
                // 隐藏乙病分支
                hide(getEl('scene3-branch-ab-line1'));
                hide(getEl('scene3-branch-ab-line2'));
                hide(getEl('scene3-branch-ab-line3'));
                hide(getEl('scene3-branch-ab-line4'));
                hide(getEl('scene3-branch-ab-node1'));
                hide(getEl('scene3-branch-ab-node2'));
                hide(getEl('scene3-branch-ab-node3'));
                hide(getEl('scene3-branch-ab-node4'));
                hide(getEl('scene3-branch-ab-label1'));
                hide(getEl('scene3-branch-ab-label2'));
                hide(getEl('scene3-branch-ab-label3'));
                hide(getEl('scene3-branch-ab-label4'));
                hide(getEl('scene3-branch-ab-prob1'));
                hide(getEl('scene3-branch-ab-prob2'));
                hide(getEl('scene3-branch-ab-prob3'));
                hide(getEl('scene3-branch-ab-prob4'));
                hide(getEl('scene3-highlight-path'));
                hide(getEl('scene3-result-aa'));
                hide(getEl('scene3-result-ab'));
                hide(getEl('scene3-calc-box'));
                hide(getEl('scene3-conclusion'));
            }
            // 步骤 2：显示乙病分支
            else if (currentStep === 2) {
                show(getEl('scene3-branch-ab-line1'));
                show(getEl('scene3-branch-ab-line2'));
                show(getEl('scene3-branch-ab-line3'));
                show(getEl('scene3-branch-ab-line4'));
                show(getEl('scene3-branch-ab-node1'));
                show(getEl('scene3-branch-ab-node2'));
                show(getEl('scene3-branch-ab-node3'));
                show(getEl('scene3-branch-ab-node4'));
                show(getEl('scene3-branch-ab-label1'));
                show(getEl('scene3-branch-ab-label2'));
                show(getEl('scene3-branch-ab-label3'));
                show(getEl('scene3-branch-ab-label4'));
                show(getEl('scene3-branch-ab-prob1'));
                show(getEl('scene3-branch-ab-prob2'));
                show(getEl('scene3-branch-ab-prob3'));
                show(getEl('scene3-branch-ab-prob4'));
                hide(getEl('scene3-highlight-path'));
                hide(getEl('scene3-result-aa'));
                hide(getEl('scene3-result-ab'));
                hide(getEl('scene3-calc-box'));
                hide(getEl('scene3-conclusion'));
            }
            // 步骤 3：显示单病概率结果
            else if (currentStep === 3) {
                show(getEl('scene3-result-aa'));
                show(getEl('scene3-result-ab'));
                hide(getEl('scene3-highlight-path'));
                hide(getEl('scene3-calc-box'));
                hide(getEl('scene3-conclusion'));
            }
            // 步骤 4：显示计算过程
            else if (currentStep === 4) {
                show(getEl('scene3-calc-box'));
                hide(getEl('scene3-highlight-path'));
                hide(getEl('scene3-conclusion'));
            }
            // 步骤 5：高亮两病兼患路径 + 结论
            else if (currentStep === 5) {
                show(getEl('scene3-highlight-path'));
                show(getEl('scene3-conclusion'));
            }

            // 更新按钮状态
            updateButtons();
            // 更新步骤指示器
            getEl('scene3-step-indicator').textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;
        }

        // 更新按钮状态
        function updateButtons() {
            const prevBg = getEl('scene3-btn-prev-bg');
            const prevText = getEl('scene3-btn-prev-text');
            const nextBg = getEl('scene3-btn-next-bg');
            const nextText = getEl('scene3-btn-next-text');

            if (currentStep === 0) {
                prevBg.setAttribute('fill', '#cccccc');
                prevText.setAttribute('fill', '#999999');
            } else {
                prevBg.setAttribute('fill', '#f0f0f0');
                prevText.setAttribute('fill', '#000000');
            }

            if (currentStep === totalSteps - 1) {
                nextBg.setAttribute('fill', '#cccccc');
                nextText.setAttribute('fill', '#999999');
                nextText.textContent = '完成';
            } else {
                nextBg.setAttribute('fill', '#f0f0f0');
                nextText.setAttribute('fill', '#000000');
                nextText.textContent = '下一步 ▶';
            }
        }

        // 上一步
        function prevStep() {
            if (currentStep > 0) {
                currentStep--;
                updateStepDisplay();
            }
        }

        // 下一步
        function nextStep() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateStepDisplay();
            }
        }

        // 绑定按钮事件
        getEl('scene3-btn-prev-bg').addEventListener('click', prevStep);
        getEl('scene3-btn-next-bg').addEventListener('click', nextStep);

        // 初始化显示
        updateStepDisplay();
    })();
    </script>
</body>
</html>
