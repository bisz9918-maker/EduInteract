<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCR 循环过程</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        .scene1-step-group {
            opacity: 0;
            display: none;
            transition: opacity 0.3s ease;
        }
        .scene1-step-group.active {
            opacity: 1;
            display: block;
        }
        .scene1-btn {
            padding: 8px 16px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background: #1976d2;
            color: white;
            transition: background 0.2s;
        }
        .scene1-btn:hover:not(:disabled) {
            background: #1565c0;
        }
        .scene1-btn:disabled {
            background: #bdbdbd;
            cursor: not-allowed;
        }
        .scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }
        .scene1-step-indicator {
            font-size: 14px;
            color: #666;
            min-width: 80px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 标题 -->
            <text id="scene1-title" x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">PCR 循环过程</text>

            <!-- 分隔线 -->
            <line id="scene1-sep1" x1="50" y1="55" x2="750" y2="55" stroke="#cccccc" stroke-width="1"/>
            <line id="scene1-sep2" x1="50" y1="135" x2="750" y2="135" stroke="#cccccc" stroke-width="1"/>
            <line id="scene1-sep3" x1="50" y1="215" x2="750" y2="215" stroke="#cccccc" stroke-width="1"/>
            <line id="scene1-sep4" x1="50" y1="295" x2="750" y2="295" stroke="#cccccc" stroke-width="1"/>
            <line id="scene1-sep5" x1="50" y1="375" x2="750" y2="375" stroke="#cccccc" stroke-width="1"/>

            <!-- 步骤 0：初始状态 -->
            <g id="scene1-step0" class="scene1-step-group active">
                <!-- 阶段标签 -->
                <text x="80" y="90" font-size="14" fill="#666">初始状态</text>
                
                <!-- DNA a 链 (上链 5'→3') -->
                <path id="scene1-dna-a-chain" d="M 250 75 L 550 75" stroke="#000000" stroke-width="8" fill="none" stroke-linecap="round"/>
                <text x="235" y="70" font-size="12" fill="#333" text-anchor="end">5'</text>
                <text x="560" y="80" font-size="12" fill="#333" text-anchor="start">3'</text>
                <text x="200" y="65" font-size="12" fill="#555" text-anchor="end">a 链</text>
                
                <!-- DNA b 链 (下链 3'→5') -->
                <path id="scene1-dna-b-chain" d="M 250 95 L 550 95" stroke="#000000" stroke-width="8" fill="none" stroke-linecap="round"/>
                <text x="235" y="90" font-size="12" fill="#333" text-anchor="end">3'</text>
                <text x="560" y="100" font-size="12" fill="#333" text-anchor="start">5'</text>
                <text x="200" y="110" font-size="12" fill="#555" text-anchor="end">b 链</text>
                
                <!-- 引物Ⅰ (结合在 a 链 3'端) -->
                <line id="scene1-primer1-placeholder" x1="480" y1="55" x2="550" y2="55" stroke="#1565c0" stroke-width="5" stroke-linecap="round"/>
                <text x="515" y="45" font-size="12" fill="#1565c0" text-anchor="middle">引物Ⅰ</text>
                
                <!-- 引物Ⅱ占位提示 -->
                <text id="scene1-primer2-placeholder" x="320" y="115" font-size="12" fill="#c62828" text-anchor="middle">引物Ⅱ(待填)</text>
            </g>

            <!-- 步骤 1：95°C 变性 -->
            <g id="scene1-step1" class="scene1-step-group">
                <!-- 阶段标签 -->
                <text x="80" y="170" font-size="14" fill="#666">95°C 变性</text>
                
                <!-- 变性箭头 -->
                <path d="M 400 125 L 400 145" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#scene1-arrowhead)"/>
                
                <!-- 解开的单链 1 (a 链) -->
                <path id="scene1-dna-single1" d="M 250 155 L 550 155" stroke="#000000" stroke-width="8" fill="none" stroke-linecap="round"/>
                <text x="240" y="150" font-size="12" fill="#333" text-anchor="end">5'</text>
                <text x="560" y="160" font-size="12" fill="#333" text-anchor="start">3'</text>
                
                <!-- 解开的单链 2 (b 链) -->
                <path id="scene1-dna-single2" d="M 250 185 L 550 185" stroke="#000000" stroke-width="8" fill="none" stroke-linecap="round"/>
                <text x="240" y="180" font-size="12" fill="#333" text-anchor="end">3'</text>
                <text x="560" y="190" font-size="12" fill="#333" text-anchor="start">5'</text>
                
                <!-- 温度标签 -->
                <text id="scene1-temp95" x="620" y="175" font-size="14" fill="#888888" text-anchor="start">95°C</text>
            </g>

            <!-- 步骤 2：55°C 复性 -->
            <g id="scene1-step2" class="scene1-step-group">
                <!-- 阶段标签 -->
                <text x="80" y="250" font-size="14" fill="#666">55°C 复性</text>
                
                <!-- 复性箭头 -->
                <path d="M 400 205 L 400 225" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#scene1-arrowhead)"/>
                
                <!-- DNA a 链 -->
                <path id="scene1-dna-a-chain-s2" d="M 250 235 L 550 235" stroke="#000000" stroke-width="8" fill="none" stroke-linecap="round"/>
                <text x="240" y="230" font-size="12" fill="#333" text-anchor="end">5'</text>
                <text x="560" y="240" font-size="12" fill="#333" text-anchor="start">3'</text>
                
                <!-- DNA b 链 -->
                <path id="scene1-dna-b-chain-s2" d="M 250 265 L 550 265" stroke="#000000" stroke-width="8" fill="none" stroke-linecap="round"/>
                <text x="240" y="260" font-size="12" fill="#333" text-anchor="end">3'</text>
                <text x="560" y="270" font-size="12" fill="#333" text-anchor="start">5'</text>
                
                <!-- 引物Ⅰ (蓝色，结合 a 链 3'端) -->
                <line id="scene1-primer1-s2" x1="480" y1="220" x2="550" y2="220" stroke="#1565c0" stroke-width="5" stroke-linecap="round"/>
                <text x="515" y="212" font-size="12" fill="#1565c0" text-anchor="middle">引物Ⅰ</text>
                
                <!-- 引物Ⅱ (红色，结合 b 链 3'端) -->
                <line id="scene1-primer2-s2" x1="250" y1="280" x2="320" y2="280" stroke="#c62828" stroke-width="5" stroke-linecap="round"/>
                <text x="285" y="295" font-size="12" fill="#c62828" text-anchor="middle">引物Ⅱ</text>
                
                <!-- 温度标签 -->
                <text id="scene1-temp55" x="620" y="255" font-size="14" fill="#888888" text-anchor="start">55°C</text>
            </g>

            <!-- 步骤 3：72°C 延伸 -->
            <g id="scene1-step3" class="scene1-step-group">
                <!-- 阶段标签 -->
                <text x="80" y="330" font-size="14" fill="#666">72°C 延伸</text>
                
                <!-- 延伸箭头 -->
                <path d="M 400 285 L 400 305" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#scene1-arrowhead)"/>
                
                <!-- DNA a 链 + 新合成链 -->
                <path id="scene1-dna-extending1" d="M 250 315 L 550 315" stroke="#000000" stroke-width="8" fill="none" stroke-linecap="round"/>
                <!-- 新合成链 1 (绿色，从引物Ⅰ延伸) -->
                <line id="scene1-new-chain1" x1="250" y1="300" x2="480" y2="300" stroke="#2e7d32" stroke-width="5" stroke-linecap="round"/>
                <text x="365" y="292" font-size="11" fill="#2e7d32" text-anchor="middle">新链</text>
                
                <!-- DNA b 链 + 新合成链 -->
                <path id="scene1-dna-extending2" d="M 250 345 L 550 345" stroke="#000000" stroke-width="8" fill="none" stroke-linecap="round"/>
                <!-- 新合成链 2 (绿色，从引物Ⅱ延伸) -->
                <line id="scene1-new-chain2" x1="320" y1="360" x2="550" y2="360" stroke="#2e7d32" stroke-width="5" stroke-linecap="round"/>
                <text x="435" y="375" font-size="11" fill="#2e7d32" text-anchor="middle">新链</text>
                
                <!-- 温度标签 -->
                <text id="scene1-temp72" x="620" y="335" font-size="14" fill="#888888" text-anchor="start">72°C</text>
            </g>

            <!-- 步骤 4：循环产物 -->
            <g id="scene1-step4" class="scene1-step-group">
                <!-- 阶段标签 -->
                <text x="80" y="410" font-size="14" fill="#666">循环产物</text>
                
                <!-- 产物箭头 -->
                <path d="M 400 365 L 400 385" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#scene1-arrowhead)"/>
                
                <!-- 产物 DNA 分子 1 (左) -->
                <path id="scene1-product-dna1-top" d="M 200 395 L 400 395" stroke="#000000" stroke-width="8" fill="none" stroke-linecap="round"/>
                <path id="scene1-product-dna1-bottom" d="M 200 410 L 400 410" stroke="#2e7d32" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.7"/>
                <text id="scene1-product-label1" x="300" y="435" font-size="12" fill="#555" text-anchor="middle">DNA 分子 1</text>
                
                <!-- 产物 DNA 分子 2 (右) -->
                <path id="scene1-product-dna2-top" d="M 450 395 L 650 395" stroke="#2e7d32" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.7"/>
                <path id="scene1-product-dna2-bottom" d="M 450 410 L 650 410" stroke="#000000" stroke-width="8" fill="none" stroke-linecap="round"/>
                <text id="scene1-product-label2" x="550" y="435" font-size="12" fill="#555" text-anchor="middle">DNA 分子 2</text>
            </g>

            <!-- 箭头定义 -->
            <defs>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
                </marker>
            </defs>

            <!-- 控件栏 (放在 SVG 内部底部) -->
            <g id="scene1-controls-group">
                <rect x="270" y="455" width="100" height="32" rx="4" fill="#1976d2" id="scene1-btn-prev-bg"/>
                <text x="320" y="477" font-size="14" fill="white" text-anchor="middle" id="scene1-btn-prev-text">◀ 上一步</text>
                
                <text id="scene1-step-indicator" x="400" y="477" font-size="14" fill="#666" text-anchor="middle">步骤 1/5</text>
                
                <rect x="430" y="455" width="100" height="32" rx="4" fill="#1976d2" id="scene1-btn-next-bg"/>
                <text x="480" y="477" font-size="14" fill="white" text-anchor="middle" id="scene1-btn-next-text">下一步 ▶</text>
            </g>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 1: PCR 循环过程
        
        // 状态配置：每个步骤显示的元素组 ID
        const stepConfig = {
            0: ['scene1-step0'],
            1: ['scene1-step1'],
            2: ['scene1-step2'],
            3: ['scene1-step3'],
            4: ['scene1-step4']
        };
        
        // 当前步骤状态
        let currentStep = 0;
        const totalSteps = 5;
        
        // 获取 DOM 元素
        const btnPrevBg = document.getElementById('scene1-btn-prev-bg');
        const btnPrevText = document.getElementById('scene1-btn-prev-text');
        const btnNextBg = document.getElementById('scene1-btn-next-bg');
        const btnNextText = document.getElementById('scene1-btn-next-text');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        
        // 更新显示函数
        function updateDisplay() {
            // 隐藏所有步骤组
            for (let i = 0; i < totalSteps; i++) {
                const groups = stepConfig[i];
                groups.forEach(groupId => {
                    const el = document.getElementById(groupId);
                    if (el) {
                        el.classList.remove('active');
                    }
                });
            }
            
            // 显示当前步骤组
            const currentGroups = stepConfig[currentStep];
            currentGroups.forEach(groupId => {
                const el = document.getElementById(groupId);
                if (el) {
                    el.classList.add('active');
                }
            });
            
            // 更新步骤指示器
            stepIndicator.textContent = `步骤 ${currentStep + 1}/${totalSteps}`;
            
            // 更新按钮状态
            if (currentStep === 0) {
                btnPrevBg.setAttribute('fill', '#bdbdbd');
                btnPrevText.setAttribute('fill', '#757575');
            } else {
                btnPrevBg.setAttribute('fill', '#1976d2');
                btnPrevText.setAttribute('fill', 'white');
            }
            
            if (currentStep === totalSteps - 1) {
                btnNextBg.setAttribute('fill', '#bdbdbd');
                btnNextText.setAttribute('fill', '#757575');
            } else {
                btnNextBg.setAttribute('fill', '#1976d2');
                btnNextText.setAttribute('fill', 'white');
            }
        }
        
        // 上一步按钮点击
        btnPrevBg.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        });
        
        // 下一步按钮点击
        btnNextBg.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateDisplay();
            }
        });
        
        // 添加按钮悬停效果
        btnPrevBg.addEventListener('mouseenter', function() {
            if (currentStep > 0) {
                this.setAttribute('fill', '#1565c0');
            }
        });
        btnPrevBg.addEventListener('mouseleave', function() {
            if (currentStep > 0) {
                this.setAttribute('fill', '#1976d2');
            }
        });
        
        btnNextBg.addEventListener('mouseenter', function() {
            if (currentStep < totalSteps - 1) {
                this.setAttribute('fill', '#1565c0');
            }
        });
        btnNextBg.addEventListener('mouseleave', function() {
            if (currentStep < totalSteps - 1) {
                this.setAttribute('fill', '#1976d2');
            }
        });
        
        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
