<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>反应方程式与定量分析</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #scene2-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene2-svg {
            width: 800px;
            height: 500px;
        }
        .scene2-btn {
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .scene2-btn:hover {
            opacity: 0.8;
        }
        .scene2-btn-disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .scene2-fade-in {
            animation: scene2FadeIn 0.3s ease-in-out;
        }
        @keyframes scene2FadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 标题区 -->
            <text id="scene2-title" x="400" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#000000">反应方程式与定量分析</text>

            <!-- 方程式容器 -->
            <g id="scene2-equation">
                <!-- CH₄ -->
                <text x="80" y="105" font-size="18" fill="#000000">CH₄</text>
                <!-- 系数 1 (CH₄) -->
                <text id="scene2-coeff-1" x="75" y="85" font-size="14" fill="#1565c0" font-weight="bold" opacity="0">1</text>
                
                <!-- + 号 1 -->
                <text x="135" y="105" font-size="18" fill="#000000">+</text>
                
                <!-- H₂O -->
                <text x="160" y="105" font-size="18" fill="#000000">H₂O</text>
                <!-- 系数 1 (H₂O) -->
                <text id="scene2-coeff-2" x="155" y="85" font-size="14" fill="#1565c0" font-weight="bold" opacity="0">1</text>
                
                <!-- → 箭头 -->
                <text x="230" y="105" font-size="18" fill="#000000">→</text>
                
                <!-- CO -->
                <text x="270" y="105" font-size="18" fill="#000000">CO</text>
                <!-- 系数 1 (CO) -->
                <text id="scene2-coeff-3" x="265" y="85" font-size="14" fill="#1565c0" font-weight="bold" opacity="0">1</text>
                
                <!-- + 号 2 -->
                <text x="320" y="105" font-size="18" fill="#000000">+</text>
                
                <!-- 3H₂ -->
                <text x="345" y="105" font-size="18" fill="#000000">H₂</text>
                <!-- 系数 3 (H₂) -->
                <text id="scene2-coeff-4" x="340" y="85" font-size="14" fill="#1565c0" font-weight="bold" opacity="0">3</text>
            </g>

            <!-- 分隔线 -->
            <line id="scene2-divider" x1="50" y1="150" x2="750" y2="150" stroke="#cccccc" stroke-width="2" opacity="0"/>

            <!-- 左侧标题：分子个数比 -->
            <text id="scene2-left-title" x="100" y="180" font-size="16" font-weight="bold" fill="#000000" opacity="0">分子个数比</text>

            <!-- 丙柱状图 (CO, 1 单位 = 80px 高) -->
            <rect id="scene2-bar-bing" x="120" y="220" width="60" height="80" fill="#1565c0" opacity="0.3" opacity="0"/>
            <text id="scene2-bar-bing-label" x="150" y="315" text-anchor="middle" font-size="14" fill="#000000" opacity="0">丙 (CO)</text>
            <text id="scene2-bar-bing-value" x="150" y="210" text-anchor="middle" font-size="16" fill="#000000" opacity="0">1</text>

            <!-- 丁柱状图 (H₂, 3 单位 = 240px 高) -->
            <rect id="scene2-bar-ding" x="220" y="220" width="60" height="240" fill="#1565c0" opacity="0.3" opacity="0"/>
            <text id="scene2-bar-ding-label" x="250" y="475" text-anchor="middle" font-size="14" fill="#000000" opacity="0">丁 (H₂)</text>
            <text id="scene2-bar-ding-value" x="250" y="210" text-anchor="middle" font-size="16" fill="#000000" opacity="0">3</text>

            <!-- 比例文本 -->
            <text id="scene2-ratio-text" x="200" y="270" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000" opacity="0">1 : 3</text>

            <!-- 右侧标题：质量比计算 -->
            <text id="scene2-right-title" x="550" y="180" font-size="16" font-weight="bold" fill="#000000" opacity="0">质量比计算</text>

            <!-- 质量比计算式 -->
            <text id="scene2-calc-1" x="560" y="220" font-size="15" fill="#000000" opacity="0">乙 (H₂O) = 18</text>
            <text id="scene2-calc-2" x="560" y="250" font-size="15" fill="#000000" opacity="0">丁 (3×H₂) = 3×2 = 6</text>
            <text id="scene2-calc-3" x="560" y="290" font-size="18" font-weight="bold" fill="#2e7d32" opacity="0">乙 : 丁 = 18 : 6 = 3 : 1</text>

            <!-- 结论区 -->
            <g id="scene2-conclusion" opacity="0">
                <text x="400" y="350" text-anchor="middle" font-size="15" fill="#2e7d32">✓ 选项 D 正确：丙和丁的分子个数比为 1:3</text>
                <text x="400" y="380" text-anchor="middle" font-size="15" fill="#2e7d32">✓ 选项 C 正确：乙和丁的质量比为 3:1</text>
            </g>

            <!-- 控件栏 -->
            <!-- 上一步按钮 -->
            <g id="scene2-btn-prev" class="scene2-btn scene2-btn-disabled">
                <rect x="250" y="455" width="100" height="35" rx="5" fill="#9e9e9e"/>
                <text x="300" y="477" text-anchor="middle" font-size="14" fill="#ffffff">◀ 上一步</text>
            </g>

            <!-- 步骤指示器 -->
            <text id="scene2-step-indicator" x="400" y="477" text-anchor="middle" font-size="14" fill="#000000">步骤 1/4</text>

            <!-- 下一步按钮 -->
            <g id="scene2-btn-next" class="scene2-btn">
                <rect x="450" y="455" width="100" height="35" rx="5" fill="#1565c0"/>
                <text x="500" y="477" text-anchor="middle" font-size="14" fill="#ffffff">下一步 ▶</text>
            </g>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 2: 反应方程式与定量分析
        // 布局坐标表对照：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // |------|------|-----------|------|-------------|------|
        // | 标题区 | text | (400,35) | 200×24 | - | 居中显示 |
        // | CH₄ | text | (80,105) | ~50×20 | - | 反应物甲 |
        // | H₂O | text | (160,105) | ~50×20 | - | 反应物乙 |
        // | CO | text | (270,105) | ~40×20 | - | 生成物丙 |
        // | 3H₂ | text | (345,105) | ~50×20 | - | 生成物丁 |
        // | 系数标签 | text | (75,85) 等 | 12×14 | 上方 | 蓝色高亮 |
        // | 分隔线 | line | (50,150)-(750,150) | 700×2 | - | 灰色 |
        // | 丙柱状图 | rect | (120,220) | 60×80 | - | 1 单位 |
        // | 丁柱状图 | rect | (220,220) | 60×240 | - | 3 单位 |
        // | 质量比计算 | text | (560,220/250/290) | - | - | 三行 |
        // | 结论区 | text | (400,350/380) | - | - | 两行 |
        // | 按钮 | g | (250,455)/(450,455) | 100×35 | - | 上一步/下一步 |

        let currentStep = 0;
        const totalSteps = 4;

        // 每步显示的元素 ID 列表
        const steps = {
            0: ['scene2-coeff-1', 'scene2-coeff-2', 'scene2-coeff-3', 'scene2-coeff-4'],
            1: ['scene2-coeff-1', 'scene2-coeff-2', 'scene2-coeff-3', 'scene2-coeff-4',
                'scene2-divider', 'scene2-left-title', 'scene2-bar-bing', 'scene2-bar-bing-label',
                'scene2-bar-bing-value', 'scene2-bar-ding', 'scene2-bar-ding-label',
                'scene2-bar-ding-value', 'scene2-ratio-text'],
            2: ['scene2-coeff-1', 'scene2-coeff-2', 'scene2-coeff-3', 'scene2-coeff-4',
                'scene2-divider', 'scene2-left-title', 'scene2-bar-bing', 'scene2-bar-bing-label',
                'scene2-bar-bing-value', 'scene2-bar-ding', 'scene2-bar-ding-label',
                'scene2-bar-ding-value', 'scene2-ratio-text', 'scene2-right-title',
                'scene2-calc-1', 'scene2-calc-2', 'scene2-calc-3'],
            3: ['scene2-coeff-1', 'scene2-coeff-2', 'scene2-coeff-3', 'scene2-coeff-4',
                'scene2-divider', 'scene2-left-title', 'scene2-bar-bing', 'scene2-bar-bing-label',
                'scene2-bar-bing-value', 'scene2-bar-ding', 'scene2-bar-ding-label',
                'scene2-bar-ding-value', 'scene2-ratio-text', 'scene2-right-title',
                'scene2-calc-1', 'scene2-calc-2', 'scene2-calc-3', 'scene2-conclusion']
        };

        // 工具函数：显示元素
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.display = '';
                el.style.opacity = '1';
                el.classList.add('scene2-fade-in');
            }
        }

        // 工具函数：隐藏元素
        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.opacity = '0';
                el.classList.remove('scene2-fade-in');
                // 延迟隐藏 display 以允许淡出动画
                setTimeout(() => {
                    if (el.style.opacity === '0') {
                        el.style.display = 'none';
                    }
                }, 300);
            }
        }

        // 更新显示状态
        function updateDisplay() {
            const allElements = [
                'scene2-coeff-1', 'scene2-coeff-2', 'scene2-coeff-3', 'scene2-coeff-4',
                'scene2-divider', 'scene2-left-title', 'scene2-bar-bing', 'scene2-bar-bing-label',
                'scene2-bar-bing-value', 'scene2-bar-ding', 'scene2-bar-ding-label',
                'scene2-bar-ding-value', 'scene2-ratio-text', 'scene2-right-title',
                'scene2-calc-1', 'scene2-calc-2', 'scene2-calc-3', 'scene2-conclusion'
            ];

            // 先隐藏所有
            allElements.forEach(id => hideElement(id));

            // 显示当前步骤的元素
            const visibleElements = steps[currentStep];
            visibleElements.forEach(id => {
                setTimeout(() => showElement(id), 50);
            });

            // 更新步骤指示器
            document.getElementById('scene2-step-indicator').textContent = `步骤 ${currentStep + 1}/${totalSteps}`;

            // 更新按钮状态
            const prevBtn = document.getElementById('scene2-btn-prev');
            const nextBtn = document.getElementById('scene2-btn-next');

            if (currentStep === 0) {
                prevBtn.classList.add('scene2-btn-disabled');
            } else {
                prevBtn.classList.remove('scene2-btn-disabled');
            }

            if (currentStep === totalSteps - 1) {
                nextBtn.classList.add('scene2-btn-disabled');
            } else {
                nextBtn.classList.remove('scene2-btn-disabled');
            }
        }

        // 上一步按钮点击
        document.getElementById('scene2-btn-prev').addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        });

        // 下一步按钮点击
        document.getElementById('scene2-btn-next').addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateDisplay();
            }
        });

        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
