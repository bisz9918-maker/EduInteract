<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>机械效率与功的计算关系</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #scene2-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene2-svg {
            width: 800px;
            height: 500px;
        }
        /* 元素可见性控制 */
        .scene2-hidden {
            opacity: 0;
            display: none;
        }
        .scene2-visible {
            opacity: 1;
            display: block;
        }
        /* 动画效果 */
        .scene2-fade-in {
            transition: opacity 0.3s ease-in-out;
        }
        .scene2-slide-in {
            transition: transform 0.3s ease-out, opacity 0.3s ease-out;
        }
        .scene2-scale-anim {
            transition: transform 0.4s ease-in-out;
        }
        /* 按钮样式 */
        .scene2-btn {
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .scene2-btn:hover {
            opacity: 0.8;
        }
        .scene2-btn-disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene2-arrow-right" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#888888" />
                </marker>
                <marker id="scene2-arrow-down-red" markerWidth="10" markerHeight="10" refX="5" refY="9" orient="auto">
                    <path d="M0,0 L10,0 L5,9 z" fill="#c62828" />
                </marker>
                <marker id="scene2-arrow-down-blue" markerWidth="10" markerHeight="10" refX="5" refY="9" orient="auto">
                    <path d="M0,0 L10,0 L5,9 z" fill="#1565c0" />
                </marker>
            </defs>

            <!-- 公式标题框 (始终显示) -->
            <rect id="scene2-title-box" x="50" y="30" width="700" height="60" fill="#E3F2FD" stroke="#1565c0" stroke-width="2" rx="5"/>
            <text id="scene2-efficiency-formula" x="400" y="65" text-anchor="middle" font-size="18px" font-weight="bold" fill="#1565c0" class="scene2-visible">
                η = W<tspan baseline-shift="sub" font-size="14px">有用</tspan> / W<tspan baseline-shift="sub" font-size="14px">总</tspan> = 80%
            </text>

            <!-- 有用功框 (步骤1显示) -->
            <g id="scene2-useful-work-group" class="scene2-hidden scene2-fade-in">
                <rect x="80" y="110" width="280" height="60" fill="#FFEBEE" stroke="#c62828" stroke-width="2" rx="5"/>
                <text x="220" y="145" text-anchor="middle" font-size="16px" fill="#c62828">
                    W<tspan baseline-shift="sub" font-size="12px">有用</tspan> = f × s<tspan baseline-shift="sub" font-size="12px">物</tspan>
                </text>
            </g>

            <!-- 总功框 (步骤2显示) -->
            <g id="scene2-total-work-group" class="scene2-hidden scene2-fade-in">
                <rect x="440" y="110" width="280" height="60" fill="#E3F2FD" stroke="#1565c0" stroke-width="2" rx="5"/>
                <text x="580" y="145" text-anchor="middle" font-size="16px" fill="#1565c0">
                    W<tspan baseline-shift="sub" font-size="12px">总</tspan> = F × s<tspan baseline-shift="sub" font-size="12px">绳</tspan>
                </text>
            </g>

            <!-- 连接箭头 (步骤2显示) -->
            <path id="scene2-connect-arrow" d="M360,140 L440,140" stroke="#888888" stroke-width="2" fill="none" marker-end="url(#scene2-arrow-right)" class="scene2-hidden scene2-fade-in"/>

            <!-- 向下箭头1 (步骤1显示) -->
            <path id="scene2-down-arrow1" d="M220,170 L220,200" stroke="#c62828" stroke-width="2" fill="none" marker-end="url(#scene2-arrow-down-red)" class="scene2-hidden scene2-fade-in"/>

            <!-- 向下箭头2 (步骤2显示) -->
            <path id="scene2-down-arrow2" d="M580,170 L580,200" stroke="#1565c0" stroke-width="2" fill="none" marker-end="url(#scene2-arrow-down-blue)" class="scene2-hidden scene2-fade-in"/>

            <!-- 计算行1：摩擦力计算 (步骤3显示) -->
            <g id="scene2-calc-row1-group" class="scene2-hidden scene2-slide-in">
                <rect x="80" y="210" width="640" height="50" fill="#F5F5F5" rx="3"/>
                <text x="400" y="240" text-anchor="middle" font-size="15px" fill="#333333">
                    f = η × n × F = 0.8 × 3 × 5N = 12N
                </text>
                <text id="scene2-result-12n" x="680" y="240" text-anchor="middle" font-size="16px" font-weight="bold" fill="#2e7d32" class="scene2-hidden">
                    12N
                </text>
            </g>

            <!-- 计算行2：功率计算 (步骤3显示) -->
            <g id="scene2-calc-row2-group" class="scene2-hidden scene2-slide-in">
                <rect x="80" y="270" width="640" height="50" fill="#F5F5F5" rx="3"/>
                <text x="400" y="300" text-anchor="middle" font-size="15px" fill="#333333">
                    P = F × v<tspan baseline-shift="sub" font-size="12px">绳</tspan> = 5N × 3m/s = 15W
                </text>
                <text id="scene2-result-15w" x="650" y="300" text-anchor="middle" font-size="16px" font-weight="bold" fill="#2e7d32" class="scene2-hidden">
                    15W
                </text>
            </g>

            <!-- 计算行3：有用功10s计算 (步骤4显示) -->
            <g id="scene2-calc-row3-group" class="scene2-hidden scene2-slide-in">
                <rect x="80" y="330" width="640" height="50" fill="#F5F5F5" rx="3"/>
                <text x="400" y="360" text-anchor="middle" font-size="15px" fill="#333333">
                    W<tspan baseline-shift="sub" font-size="12px">有用</tspan> = f × s = 12N × 10m = 120J
                </text>
                <text id="scene2-result-120j" x="670" y="360" text-anchor="middle" font-size="16px" font-weight="bold" fill="#2e7d32" class="scene2-hidden scene2-scale-anim">
                    120J
                </text>
            </g>

            <!-- 控件栏背景 -->
            <rect x="50" y="440" width="700" height="50" fill="#1565c0" rx="5"/>

            <!-- 上一步按钮 -->
            <g id="scene2-btn-prev" class="scene2-btn">
                <rect x="200" y="450" width="120" height="30" fill="#1565c0" stroke="#ffffff" stroke-width="2" rx="5"/>
                <text x="260" y="470" text-anchor="middle" font-size="14px" fill="#ffffff">◀ 上一步</text>
            </g>

            <!-- 下一步按钮 -->
            <g id="scene2-btn-next" class="scene2-btn">
                <rect x="480" y="450" width="120" height="30" fill="#1565c0" stroke="#ffffff" stroke-width="2" rx="5"/>
                <text id="scene2-btn-next-text" x="540" y="470" text-anchor="middle" font-size="14px" fill="#ffffff">下一步 ▶</text>
            </g>

            <!-- 步骤指示 -->
            <text id="scene2-step-indicator" x="400" y="470" text-anchor="middle" font-size="14px" fill="#ffffff">步骤 0/4</text>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 2 实现：机械效率与功的计算关系

        // 状态变量
        let currentStep = 0;
        const maxStep = 4;

        // 每步可见元素配置
        const stepConfig = {
            0: {
                visible: ['scene2-title-box', 'scene2-efficiency-formula'],
                hidden: ['scene2-useful-work-group', 'scene2-total-work-group', 'scene2-connect-arrow', 
                         'scene2-down-arrow1', 'scene2-down-arrow2', 'scene2-calc-row1-group', 
                         'scene2-calc-row2-group', 'scene2-calc-row3-group', 'scene2-result-12n', 
                         'scene2-result-15w', 'scene2-result-120j']
            },
            1: {
                visible: ['scene2-title-box', 'scene2-efficiency-formula', 'scene2-useful-work-group', 'scene2-down-arrow1'],
                hidden: ['scene2-total-work-group', 'scene2-connect-arrow', 'scene2-down-arrow2', 
                         'scene2-calc-row1-group', 'scene2-calc-row2-group', 'scene2-calc-row3-group', 
                         'scene2-result-12n', 'scene2-result-15w', 'scene2-result-120j']
            },
            2: {
                visible: ['scene2-title-box', 'scene2-efficiency-formula', 'scene2-useful-work-group', 
                          'scene2-down-arrow1', 'scene2-total-work-group', 'scene2-connect-arrow', 'scene2-down-arrow2'],
                hidden: ['scene2-calc-row1-group', 'scene2-calc-row2-group', 'scene2-calc-row3-group', 
                         'scene2-result-12n', 'scene2-result-15w', 'scene2-result-120j']
            },
            3: {
                visible: ['scene2-title-box', 'scene2-efficiency-formula', 'scene2-useful-work-group', 
                          'scene2-down-arrow1', 'scene2-total-work-group', 'scene2-connect-arrow', 'scene2-down-arrow2',
                          'scene2-calc-row1-group', 'scene2-calc-row2-group', 'scene2-result-12n', 'scene2-result-15w'],
                hidden: ['scene2-calc-row3-group', 'scene2-result-120j']
            },
            4: {
                visible: ['scene2-title-box', 'scene2-efficiency-formula', 'scene2-useful-work-group', 
                          'scene2-down-arrow1', 'scene2-total-work-group', 'scene2-connect-arrow', 'scene2-down-arrow2',
                          'scene2-calc-row1-group', 'scene2-calc-row2-group', 'scene2-calc-row3-group', 
                          'scene2-result-12n', 'scene2-result-15w', 'scene2-result-120j'],
                hidden: []
            }
        };

        // 工具函数：显示元素
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene2-hidden');
                el.classList.add('scene2-visible');
            }
        }

        // 工具函数：隐藏元素
        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene2-visible');
                el.classList.add('scene2-hidden');
            }
        }

        // 更新步骤显示
        function updateStepDisplay(step) {
            const config = stepConfig[step];
            
            // 显示指定元素
            config.visible.forEach(id => showElement(id));
            
            // 隐藏指定元素
            config.hidden.forEach(id => hideElement(id));

            // 更新步骤指示
            const indicator = document.getElementById('scene2-step-indicator');
            if (indicator) {
                indicator.textContent = '步骤 ' + step + '/' + maxStep;
            }

            // 更新按钮状态
            const btnPrev = document.getElementById('scene2-btn-prev');
            const btnNext = document.getElementById('scene2-btn-next');
            const btnNextText = document.getElementById('scene2-btn-next-text');

            if (btnPrev) {
                if (step === 0) {
                    btnPrev.classList.add('scene2-btn-disabled');
                } else {
                    btnPrev.classList.remove('scene2-btn-disabled');
                }
            }

            if (btnNext && btnNextText) {
                if (step === maxStep) {
                    btnNextText.textContent = '完成';
                    btnNext.classList.add('scene2-btn-disabled');
                } else {
                    btnNextText.textContent = '下一步 ▶';
                    btnNext.classList.remove('scene2-btn-disabled');
                }
            }

            // 步骤4时触发动画效果
            if (step === 4) {
                const result120j = document.getElementById('scene2-result-120j');
                if (result120j) {
                    result120j.style.transform = 'scale(1.1)';
                    setTimeout(() => {
                        result120j.style.transform = 'scale(1)';
                    }, 400);
                }
            }
        }

        // 上一步
        function prevStep() {
            if (currentStep > 0) {
                currentStep--;
                updateStepDisplay(currentStep);
            }
        }

        // 下一步
        function nextStep() {
            if (currentStep < maxStep) {
                currentStep++;
                updateStepDisplay(currentStep);
            }
        }

        // 绑定按钮事件
        document.getElementById('scene2-btn-prev').addEventListener('click', function() {
            if (!this.classList.contains('scene2-btn-disabled')) {
                prevStep();
            }
        });

        document.getElementById('scene2-btn-next').addEventListener('click', function() {
            if (!this.classList.contains('scene2-btn-disabled')) {
                nextStep();
            }
        });

        // 初始化显示
        updateStepDisplay(0);

    })();
    </script>
</body>
</html>
