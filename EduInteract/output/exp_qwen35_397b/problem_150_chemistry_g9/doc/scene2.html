<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图乙装置功能与连接顺序</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-svg { width: 800px; height: 500px; }
        .scene2-fade-in { opacity: 0; transition: opacity 0.3s ease-in-out; }
        .scene2-visible { opacity: 1; }
        .scene2-hidden { opacity: 0; display: none; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 装置 a（酒精灯） -->
            <g id="scene2-device-a">
                <!-- 灯体外框 -->
                <rect x="60" y="60" width="130" height="120" fill="none" stroke="#000000" stroke-width="1"/>
                <!-- 灯体梯形 -->
                <polygon points="100,170 150,170 140,120 110,120" fill="#e0e0e0" stroke="#000000" stroke-width="1"/>
                <!-- 灯芯 -->
                <line x1="125" y1="120" x2="125" y2="100" stroke="#000000" stroke-width="2"/>
                <!-- 火焰 -->
                <path id="scene2-flame-a" d="M125,100 Q115,85 120,75 Q125,85 125,100 Q135,85 130,75 Q135,85 125,100" fill="#ff5722" opacity="0.8"/>
                <!-- 标签 a -->
                <text id="scene2-label-a" x="125" y="200" text-anchor="middle" font-size="16" font-weight="bold">a</text>
                <!-- 功能标签 a -->
                <text id="scene2-func-a" x="125" y="220" text-anchor="middle" font-size="14" class="scene2-fade-in">尾气点燃</text>
            </g>

            <!-- 装置 b（NaOH 洗气瓶） -->
            <g id="scene2-device-b">
                <!-- 瓶体外框 -->
                <rect x="230" y="60" width="130" height="120" fill="none" stroke="#000000" stroke-width="1"/>
                <!-- 瓶身 -->
                <rect x="240" y="80" width="110" height="90" fill="none" stroke="#000000" stroke-width="1"/>
                <!-- 液体（浅蓝 20% 透明度） -->
                <rect x="240" y="130" width="110" height="40" fill="#1565c0" opacity="0.2"/>
                <!-- 长导管（进气） -->
                <path d="M250,80 L250,150" fill="none" stroke="#000000" stroke-width="2"/>
                <!-- 短导管（出气） -->
                <path d="M340,80 L340,110" fill="none" stroke="#000000" stroke-width="2"/>
                <!-- 标签 b -->
                <text id="scene2-label-b" x="295" y="200" text-anchor="middle" font-size="16" font-weight="bold">b</text>
                <!-- 功能标签 b -->
                <text id="scene2-func-b" x="295" y="220" text-anchor="middle" font-size="14" class="scene2-fade-in">吸收 CO₂</text>
            </g>

            <!-- 装置 c（浓硫酸洗气瓶） -->
            <g id="scene2-device-c">
                <!-- 瓶体外框 -->
                <rect x="400" y="60" width="130" height="120" fill="none" stroke="#000000" stroke-width="1"/>
                <!-- 瓶身 -->
                <rect x="410" y="80" width="110" height="90" fill="none" stroke="#000000" stroke-width="1"/>
                <!-- 液体（浅灰 20% 透明度） -->
                <rect x="410" y="130" width="110" height="40" fill="#888888" opacity="0.2"/>
                <!-- 长导管（进气） -->
                <path d="M420,80 L420,150" fill="none" stroke="#000000" stroke-width="2"/>
                <!-- 短导管（出气） -->
                <path d="M510,80 L510,110" fill="none" stroke="#000000" stroke-width="2"/>
                <!-- 标签 c -->
                <text id="scene2-label-c" x="465" y="200" text-anchor="middle" font-size="16" font-weight="bold">c</text>
                <!-- 功能标签 c -->
                <text id="scene2-func-c" x="465" y="220" text-anchor="middle" font-size="14" class="scene2-fade-in">吸收 H₂O</text>
            </g>

            <!-- 装置 d（澄清石灰水洗气瓶） -->
            <g id="scene2-device-d">
                <!-- 瓶体外框 -->
                <rect x="570" y="60" width="130" height="120" fill="none" stroke="#000000" stroke-width="1"/>
                <!-- 瓶身 -->
                <rect x="580" y="80" width="110" height="90" fill="none" stroke="#000000" stroke-width="1"/>
                <!-- 液体（浅灰 20% 透明度） -->
                <rect x="580" y="130" width="110" height="40" fill="#888888" opacity="0.2"/>
                <!-- 长导管（进气） -->
                <path d="M590,80 L590,150" fill="none" stroke="#000000" stroke-width="2"/>
                <!-- 短导管（出气） -->
                <path d="M680,80 L680,110" fill="none" stroke="#000000" stroke-width="2"/>
                <!-- 标签 d -->
                <text id="scene2-label-d" x="635" y="200" text-anchor="middle" font-size="16" font-weight="bold">d</text>
                <!-- 功能标签 d -->
                <text id="scene2-func-d" x="635" y="220" text-anchor="middle" font-size="14" class="scene2-fade-in">检验 CO₂</text>
            </g>

            <!-- 连接示意图区域背景 -->
            <rect id="scene2-conn-area" x="50" y="250" width="700" height="160" fill="#fafafa" stroke="#e0e0e0" stroke-width="2" rx="5"/>

            <!-- 顺序标题 -->
            <text id="scene2-order-title" x="400" y="275" text-anchor="middle" font-size="16" font-weight="bold" class="scene2-hidden">正确连接顺序</text>

            <!-- 图甲示意框 -->
            <g id="scene2-jia-group" class="scene2-hidden">
                <rect x="70" y="290" width="80" height="50" fill="#f5f5f5" stroke="#000000" stroke-width="1"/>
                <text x="110" y="320" text-anchor="middle" font-size="16" font-weight="bold">甲</text>
            </g>

            <!-- 问题文本 -->
            <text id="scene2-question" x="400" y="320" text-anchor="middle" font-size="14" font-weight="bold" fill="#c62828" class="scene2-hidden">如何测量 CO₂和 H₂O 的质量？</text>

            <!-- 装置 c 简化示意 -->
            <g id="scene2-conn-c-simplified" class="scene2-hidden">
                <rect x="200" y="290" width="80" height="80" fill="none" stroke="#000000" stroke-width="1"/>
                <rect x="210" y="330" width="60" height="30" fill="#888888" opacity="0.2"/>
                <line x1="220" y1="300" x2="220" y2="345" stroke="#000000" stroke-width="2"/>
                <line x1="260" y1="300" x2="260" y2="320" stroke="#000000" stroke-width="2"/>
            </g>

            <!-- 装置 b 简化示意 -->
            <g id="scene2-conn-b-simplified" class="scene2-hidden">
                <rect x="330" y="290" width="80" height="80" fill="none" stroke="#000000" stroke-width="1"/>
                <rect x="340" y="330" width="60" height="30" fill="#1565c0" opacity="0.2"/>
                <line x1="350" y1="300" x2="350" y2="345" stroke="#000000" stroke-width="2"/>
                <line x1="390" y1="300" x2="390" y2="320" stroke="#000000" stroke-width="2"/>
            </g>

            <!-- 装置 a 简化示意 -->
            <g id="scene2-conn-a-simplified" class="scene2-hidden">
                <rect x="460" y="290" width="60" height="50" fill="none" stroke="#000000" stroke-width="1"/>
                <polygon points="480,340 520,340 510,310 490,310" fill="#e0e0e0" stroke="#000000" stroke-width="1"/>
            </g>

            <!-- 气体箭头 -->
            <g id="scene2-arrows" class="scene2-hidden">
                <!-- 箭头 1：甲→c -->
                <defs>
                    <marker id="scene2-arrowhead-1" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                        <path d="M0,0 L0,6 L9,3 z" fill="#1565c0"/>
                    </marker>
                </defs>
                <line id="scene2-arrow-1" x1="150" y1="315" x2="200" y2="315" stroke="#1565c0" stroke-width="3" marker-end="url(#scene2-arrowhead-1)"/>
                <!-- 箭头 2：c→b -->
                <line id="scene2-arrow-2" x1="280" y1="315" x2="330" y2="315" stroke="#1565c0" stroke-width="3" marker-end="url(#scene2-arrowhead-1)"/>
                <!-- 箭头 3：b→a -->
                <line id="scene2-arrow-3" x1="410" y1="315" x2="460" y2="315" stroke="#1565c0" stroke-width="3" marker-end="url(#scene2-arrowhead-1)"/>
                <!-- 箭头 4：a→尾气 -->
                <line id="scene2-arrow-4" x1="520" y1="315" x2="570" y2="315" stroke="#1565c0" stroke-width="3" marker-end="url(#scene2-arrowhead-1)"/>
            </g>

            <!-- 质量标注 -->
            <text id="scene2-mass-c" x="240" y="385" text-anchor="middle" font-size="13" class="scene2-hidden">Δm_c = m_H₂O</text>
            <text id="scene2-mass-b" x="370" y="385" text-anchor="middle" font-size="13" class="scene2-hidden">Δm_b = m_CO₂</text>

            <!-- 错误路径（红色虚线） -->
            <g id="scene2-wrong-path" class="scene2-hidden">
                <path d="M150,400 L330,400 L460,400" fill="none" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5"/>
                <text x="400" y="425" text-anchor="middle" font-size="12" fill="#c62828">错误：先通过 NaOH 会带出水蒸气，干扰 H₂O 测量</text>
            </g>

            <!-- 正确路径（绿色粗线） -->
            <g id="scene2-correct-path" class="scene2-hidden">
                <text x="400" y="275" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e7d32">正确顺序：甲→c→b→a</text>
                <text x="400" y="425" text-anchor="middle" font-size="12" fill="#2e7d32">先吸收 H₂O，再吸收 CO₂，最后尾气处理</text>
            </g>

            <!-- 控件栏背景 -->
            <rect x="0" y="435" width="800" height="65" fill="#f9f9f9" opacity="0.95"/>

            <!-- 上一步按钮 -->
            <g id="scene2-btn-prev-group">
                <rect x="280" y="445" width="100" height="35" fill="#ffffff" stroke="#999999" stroke-width="2" rx="5" cursor="pointer"/>
                <text x="330" y="468" text-anchor="middle" font-size="14" fill="#333333">◀ 上一步</text>
            </g>

            <!-- 下一步按钮 -->
            <g id="scene2-btn-next-group">
                <rect x="420" y="445" width="100" height="35" fill="#2e7d32" stroke="#2e7d32" stroke-width="2" rx="5" cursor="pointer"/>
                <text x="470" y="468" text-anchor="middle" font-size="14" fill="#ffffff">下一步 ▶</text>
            </g>

            <!-- 步骤指示器 -->
            <text id="scene2-step-indicator" x="400" y="492" text-anchor="middle" font-size="13" fill="#666666">步骤 1/6</text>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 2 实现：图乙装置功能与连接顺序

        // 状态管理
        let currentStep = 0;
        const totalSteps = 6;

        // 获取 DOM 元素
        const btnPrev = document.getElementById('scene2-btn-prev-group');
        const btnNext = document.getElementById('scene2-btn-next-group');
        const stepIndicator = document.getElementById('scene2-step-indicator');

        // 元素显隐控制函数
        function show(el) {
            if (el) {
                el.classList.remove('scene2-hidden');
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }

        function hide(el) {
            if (el) {
                el.classList.add('scene2-hidden');
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }

        function showFade(el) {
            if (el) {
                el.classList.remove('scene2-hidden');
                el.style.display = 'block';
                // 触发重绘以启动过渡动画
                setTimeout(() => {
                    el.classList.add('scene2-visible');
                }, 10);
            }
        }

        // 更新步骤显示
        function updateStep() {
            // 更新步骤指示器
            stepIndicator.textContent = `步骤 ${currentStep + 1}/${totalSteps}`;

            // 步骤 0：初始状态
            if (currentStep === 0) {
                // 只显示装置原貌和标签
                hide(document.getElementById('scene2-func-a'));
                hide(document.getElementById('scene2-func-b'));
                hide(document.getElementById('scene2-func-c'));
                hide(document.getElementById('scene2-func-d'));
                hide(document.getElementById('scene2-conn-area'));
                hide(document.getElementById('scene2-order-title'));
                hide(document.getElementById('scene2-jia-group'));
                hide(document.getElementById('scene2-question'));
                hide(document.getElementById('scene2-conn-c-simplified'));
                hide(document.getElementById('scene2-conn-b-simplified'));
                hide(document.getElementById('scene2-conn-a-simplified'));
                hide(document.getElementById('scene2-arrows'));
                hide(document.getElementById('scene2-mass-c'));
                hide(document.getElementById('scene2-mass-b'));
                hide(document.getElementById('scene2-wrong-path'));
                hide(document.getElementById('scene2-correct-path'));
            }
            // 步骤 1：显示功能标签
            else if (currentStep === 1) {
                showFade(document.getElementById('scene2-func-a'));
                showFade(document.getElementById('scene2-func-b'));
                showFade(document.getElementById('scene2-func-c'));
                showFade(document.getElementById('scene2-func-d'));
                hide(document.getElementById('scene2-conn-area'));
                hide(document.getElementById('scene2-order-title'));
                hide(document.getElementById('scene2-jia-group'));
                hide(document.getElementById('scene2-question'));
                hide(document.getElementById('scene2-conn-c-simplified'));
                hide(document.getElementById('scene2-conn-b-simplified'));
                hide(document.getElementById('scene2-conn-a-simplified'));
                hide(document.getElementById('scene2-arrows'));
                hide(document.getElementById('scene2-mass-c'));
                hide(document.getElementById('scene2-mass-b'));
                hide(document.getElementById('scene2-wrong-path'));
                hide(document.getElementById('scene2-correct-path'));
            }
            // 步骤 2：显示连接区和问题
            else if (currentStep === 2) {
                showFade(document.getElementById('scene2-func-a'));
                showFade(document.getElementById('scene2-func-b'));
                showFade(document.getElementById('scene2-func-c'));
                showFade(document.getElementById('scene2-func-d'));
                show(document.getElementById('scene2-conn-area'));
                show(document.getElementById('scene2-order-title'));
                show(document.getElementById('scene2-jia-group'));
                show(document.getElementById('scene2-question'));
                hide(document.getElementById('scene2-conn-c-simplified'));
                hide(document.getElementById('scene2-conn-b-simplified'));
                hide(document.getElementById('scene2-conn-a-simplified'));
                hide(document.getElementById('scene2-arrows'));
                hide(document.getElementById('scene2-mass-c'));
                hide(document.getElementById('scene2-mass-b'));
                hide(document.getElementById('scene2-wrong-path'));
                hide(document.getElementById('scene2-correct-path'));
            }
            // 步骤 3：显示错误路径
            else if (currentStep === 3) {
                showFade(document.getElementById('scene2-func-a'));
                showFade(document.getElementById('scene2-func-b'));
                showFade(document.getElementById('scene2-func-c'));
                showFade(document.getElementById('scene2-func-d'));
                show(document.getElementById('scene2-conn-area'));
                show(document.getElementById('scene2-order-title'));
                show(document.getElementById('scene2-jia-group'));
                show(document.getElementById('scene2-question'));
                show(document.getElementById('scene2-wrong-path'));
                hide(document.getElementById('scene2-conn-c-simplified'));
                hide(document.getElementById('scene2-conn-b-simplified'));
                hide(document.getElementById('scene2-conn-a-simplified'));
                hide(document.getElementById('scene2-arrows'));
                hide(document.getElementById('scene2-mass-c'));
                hide(document.getElementById('scene2-mass-b'));
                hide(document.getElementById('scene2-correct-path'));
            }
            // 步骤 4：显示正确路径
            else if (currentStep === 4) {
                showFade(document.getElementById('scene2-func-a'));
                showFade(document.getElementById('scene2-func-b'));
                showFade(document.getElementById('scene2-func-c'));
                showFade(document.getElementById('scene2-func-d'));
                show(document.getElementById('scene2-conn-area'));
                hide(document.getElementById('scene2-order-title'));
                show(document.getElementById('scene2-jia-group'));
                hide(document.getElementById('scene2-question'));
                hide(document.getElementById('scene2-wrong-path'));
                show(document.getElementById('scene2-conn-c-simplified'));
                show(document.getElementById('scene2-conn-b-simplified'));
                show(document.getElementById('scene2-conn-a-simplified'));
                show(document.getElementById('scene2-arrows'));
                show(document.getElementById('scene2-mass-c'));
                show(document.getElementById('scene2-mass-b'));
                hide(document.getElementById('scene2-correct-path'));
            }
            // 步骤 5：显示最终结论
            else if (currentStep === 5) {
                showFade(document.getElementById('scene2-func-a'));
                showFade(document.getElementById('scene2-func-b'));
                showFade(document.getElementById('scene2-func-c'));
                showFade(document.getElementById('scene2-func-d'));
                show(document.getElementById('scene2-conn-area'));
                show(document.getElementById('scene2-jia-group'));
                hide(document.getElementById('scene2-question'));
                hide(document.getElementById('scene2-wrong-path'));
                show(document.getElementById('scene2-conn-c-simplified'));
                show(document.getElementById('scene2-conn-b-simplified'));
                show(document.getElementById('scene2-conn-a-simplified'));
                show(document.getElementById('scene2-arrows'));
                show(document.getElementById('scene2-mass-c'));
                show(document.getElementById('scene2-mass-b'));
                show(document.getElementById('scene2-correct-path'));
            }

            // 更新按钮状态
            const prevRect = document.querySelector('#scene2-btn-prev-group rect');
            const nextRect = document.querySelector('#scene2-btn-next-group rect');
            const prevText = document.querySelector('#scene2-btn-prev-group text');
            const nextText = document.querySelector('#scene2-btn-next-group text');

            if (currentStep === 0) {
                prevRect.setAttribute('fill', '#e0e0e0');
                prevText.setAttribute('fill', '#999999');
            } else {
                prevRect.setAttribute('fill', '#ffffff');
                prevText.setAttribute('fill', '#333333');
            }

            if (currentStep === totalSteps - 1) {
                nextRect.setAttribute('fill', '#e0e0e0');
                nextText.setAttribute('fill', '#999999');
            } else {
                nextRect.setAttribute('fill', '#2e7d32');
                nextText.setAttribute('fill', '#ffffff');
            }
        }

        // 按钮点击事件
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateStep();
            }
        });

        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
