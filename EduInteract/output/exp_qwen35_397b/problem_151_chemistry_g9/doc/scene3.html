<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>反应物质量比计算</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #scene3-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene3-svg {
            width: 800px;
            height: 500px;
        }
        /* 元素淡入动画 */
        .fade-in {
            opacity: 0;
            transition: opacity 0.3s ease-in;
        }
        .fade-in.visible {
            opacity: 1;
        }
        /* 按钮样式 */
        .scene3-btn {
            cursor: pointer;
            rx: 6;
            ry: 6;
        }
        .scene3-btn:hover {
            opacity: 0.8;
        }
        .scene3-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .scene3-btn-gray {
            fill: #757575;
        }
        .scene3-btn-blue {
            fill: #1976d2;
        }
        .scene3-btn-text {
            fill: #ffffff;
            font-size: 14px;
            font-weight: bold;
            text-anchor: middle;
            dominant-baseline: middle;
            pointer-events: none;
        }
        /* 计量数标注框 */
        .coeff-box {
            fill: #e3f2fd;
            stroke: #1565c0;
            stroke-width: 1.5;
            rx: 3;
        }
        /* 文本样式 */
        .title-text {
            font-size: 18px;
            font-weight: bold;
            fill: #000000;
            text-anchor: middle;
        }
        .equation-text {
            font-size: 18px;
            fill: #000000;
            text-anchor: middle;
        }
        .molar-mass-text {
            font-size: 14px;
            fill: #1565c0;
            text-anchor: middle;
        }
        .coeff-text {
            font-size: 16px;
            font-weight: bold;
            fill: #1565c0;
            text-anchor: middle;
        }
        .calc-text {
            font-size: 16px;
            fill: #000000;
            text-anchor: middle;
        }
        .calc-result {
            font-size: 16px;
            font-weight: bold;
            fill: #2e7d32;
            text-anchor: middle;
        }
        .option-b-text {
            font-size: 16px;
            fill: #c62828;
            text-anchor: middle;
        }
        .correct-text {
            font-size: 16px;
            fill: #2e7d32;
            text-anchor: middle;
        }
        .wrong-mark {
            font-size: 24px;
            fill: #c62828;
            text-anchor: middle;
        }
        /* 箭头样式 */
        .reaction-arrow {
            fill: none;
            stroke: #757575;
            stroke-width: 2;
        }
        /* 计量数上标 */
        .coeff-superscript {
            font-size: 14px;
            fill: #1565c0;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg id="scene3-svg" width="800" height="500">
            <!-- 标题 -->
            <text id="scene3-title" x="400" y="35" class="title-text fade-in">反应物质量比计算</text>

            <!-- 化学方程式 -->
            <g id="scene3-equation-group" class="fade-in">
                <!-- CH₄ -->
                <text x="180" y="100" class="equation-text">CH₄</text>
                <!-- + -->
                <text x="240" y="100" class="equation-text">+</text>
                <!-- O₂ 计量数 2（初始隐藏） -->
                <text id="scene3-o2-coeff" x="265" y="88" class="coeff-superscript" style="opacity: 0;">2</text>
                <text x="280" y="100" class="equation-text">O₂</text>
                <!-- 箭头 -->
                <path id="scene3-arrow" d="M 320 95 L 360 95 M 350 90 L 360 95 L 350 100" class="reaction-arrow"/>
                <!-- CO₂ -->
                <text x="400" y="100" class="equation-text">CO₂</text>
                <!-- + -->
                <text x="460" y="100" class="equation-text">+</text>
                <!-- H₂O 计量数 2（初始隐藏） -->
                <text id="scene3-h2o-coeff" x="485" y="88" class="coeff-superscript" style="opacity: 0;">2</text>
                <text x="500" y="100" class="equation-text">H₂O</text>
            </g>

            <!-- 相对分子质量标注（步骤 1 显示） -->
            <g id="scene3-molar-masses" class="fade-in" style="opacity: 0;">
                <text x="180" y="150" class="molar-mass-text">16 (12+4×1)</text>
                <text x="320" y="150" class="molar-mass-text">32 (2×16)</text>
                <text x="460" y="150" class="molar-mass-text">44 (12+2×16)</text>
                <text x="540" y="150" class="molar-mass-text">18 (2×1+16)</text>
            </g>

            <!-- 计量数标注框（步骤 2 显示） -->
            <g id="scene3-coeff-boxes" class="fade-in" style="opacity: 0;">
                <!-- CH₄ 计量数框 -->
                <rect x="165" y="185" width="30" height="25" class="coeff-box"/>
                <text x="180" y="202" class="coeff-text">1</text>
                <!-- O₂ 计量数框 -->
                <rect x="265" y="185" width="30" height="25" class="coeff-box"/>
                <text x="280" y="202" class="coeff-text">2</text>
                <!-- CO₂ 计量数框 -->
                <rect x="385" y="185" width="30" height="25" class="coeff-box"/>
                <text x="400" y="202" class="coeff-text">1</text>
                <!-- H₂O 计量数框 -->
                <rect x="485" y="185" width="30" height="25" class="coeff-box"/>
                <text x="500" y="202" class="coeff-text">2</text>
            </g>

            <!-- 质量计算式（步骤 3-4 显示） -->
            <g id="scene3-calc-step1" class="fade-in" style="opacity: 0;">
                <text x="400" y="260" class="calc-text">m(CH₄) : m(O₂)</text>
            </g>
            <g id="scene3-calc-step2" class="fade-in" style="opacity: 0;">
                <text x="400" y="295" class="calc-text">= (1×16) : (2×32)</text>
            </g>
            <g id="scene3-calc-step3" class="fade-in" style="opacity: 0;">
                <text x="400" y="330" class="calc-text">= 16 : 64</text>
            </g>
            <g id="scene3-calc-result" class="fade-in" style="opacity: 0;">
                <text x="400" y="365" class="calc-result">= 1 : 4</text>
            </g>

            <!-- 选项 B 判断（步骤 4 显示） -->
            <g id="scene3-option-b" class="fade-in" style="opacity: 0;">
                <text x="250" y="410" class="option-b-text">选项 B: 8:1</text>
                <text x="360" y="415" class="wrong-mark">✗</text>
                <text x="500" y="410" class="correct-text">正确答案：1:4</text>
            </g>

            <!-- 控件按钮 -->
            <g id="scene3-controls">
                <!-- 上一步按钮 -->
                <rect id="scene3-btn-prev" x="280" y="455" width="100" height="35" class="scene3-btn scene3-btn-gray" rx="6" ry="6"/>
                <text id="scene3-btn-prev-text" x="330" y="472.5" class="scene3-btn-text">◀ 上一步</text>
                
                <!-- 下一步按钮 -->
                <rect id="scene3-btn-next" x="420" y="455" width="100" height="35" class="scene3-btn scene3-btn-blue" rx="6" ry="6"/>
                <text id="scene3-btn-next-text" x="470" y="472.5" class="scene3-btn-text">下一步 ▶</text>
                
                <!-- 重置按钮 -->
                <rect id="scene3-btn-reset" x="560" y="455" width="100" height="35" class="scene3-btn scene3-btn-gray" rx="6" ry="6"/>
                <text id="scene3-btn-reset-text" x="610" y="472.5" class="scene3-btn-text">重置</text>
            </g>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 3: 反应物质量比计算
        // 布局坐标表对照：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // |------|------|-----------|------|-------------|------|
        // | 标题 | text | (400,35) | ~200×24 | - | 居中 |
        // | 化学方程式 | text | (400,100) | ~500×28 | - | 居中 |
        // | CH₄ 相对分子质量 | text | (180,150) | ~120×20 | 下方 | 蓝色 |
        // | O₂ 相对分子质量 | text | (320,150) | ~100×20 | 下方 | 蓝色 |
        // | CO₂ 相对分子质量 | text | (460,150) | ~120×20 | 下方 | 蓝色 |
        // | H₂O 相对分子质量 | text | (540,150) | ~100×20 | 下方 | 蓝色 |
        // | 计量数标注框 | rect | y=185~210 | 30×25 | - | 淡蓝色背景 |
        // | 质量计算式 | text | y=260/295/330/365 | 四行 | - | 逐步显示 |
        // | 选项 B 标签 | text | (250,410) | ~150×20 | - | 红色 |
        // | 正确答案标签 | text | (500,410) | ~150×20 | - | 绿色 |
        // | 按钮 | rect+text | y=455 | 100×35 | - | 三个按钮 |

        let currentStep = 0;
        const maxStep = 4;

        // 每步需要显示的元素
        const stepElements = {
            0: ['scene3-title', 'scene3-equation-group'],
            1: ['scene3-title', 'scene3-equation-group', 'scene3-molar-masses'],
            2: ['scene3-title', 'scene3-equation-group', 'scene3-molar-masses', 'scene3-coeff-boxes'],
            3: ['scene3-title', 'scene3-equation-group', 'scene3-molar-masses', 'scene3-coeff-boxes', 
                'scene3-calc-step1', 'scene3-calc-step2', 'scene3-calc-step3'],
            4: ['scene3-title', 'scene3-equation-group', 'scene3-molar-masses', 'scene3-coeff-boxes',
                'scene3-calc-step1', 'scene3-calc-step2', 'scene3-calc-step3', 'scene3-calc-result', 'scene3-option-b']
        };

        // 显示/隐藏元素工具函数
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.opacity = '0';
                el.style.display = '';
                // 强制重绘后添加 visible 类触发淡入
                requestAnimationFrame(() => {
                    el.classList.add('visible');
                });
            }
        }

        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('visible');
                el.style.opacity = '0';
            }
        }

        // 更新显示状态
        function updateDisplay() {
            // 隐藏所有元素
            const allElements = ['scene3-title', 'scene3-equation-group', 'scene3-molar-masses', 
                                 'scene3-coeff-boxes', 'scene3-calc-step1', 'scene3-calc-step2', 
                                 'scene3-calc-step3', 'scene3-calc-result', 'scene3-option-b'];
            allElements.forEach(id => hideElement(id));

            // 显示当前步骤需要的元素
            const visibleElements = stepElements[currentStep];
            visibleElements.forEach(id => showElement(id));

            // 步骤 2 及以上显示方程式中的计量数
            const o2Coeff = document.getElementById('scene3-o2-coeff');
            const h2oCoeff = document.getElementById('scene3-h2o-coeff');
            if (currentStep >= 2) {
                o2Coeff.style.opacity = '1';
                h2oCoeff.style.opacity = '1';
            } else {
                o2Coeff.style.opacity = '0';
                h2oCoeff.style.opacity = '0';
            }

            // 更新按钮状态
            updateButtons();
        }

        // 更新按钮状态
        function updateButtons() {
            const prevBtn = document.getElementById('scene3-btn-prev');
            const nextBtn = document.getElementById('scene3-btn-next');
            const prevText = document.getElementById('scene3-btn-prev-text');
            const nextText = document.getElementById('scene3-btn-next-text');

            if (currentStep === 0) {
                prevBtn.style.opacity = '0.4';
                prevBtn.style.cursor = 'not-allowed';
                prevText.style.fill = '#bdbdbd';
            } else {
                prevBtn.style.opacity = '1';
                prevBtn.style.cursor = 'pointer';
                prevText.style.fill = '#ffffff';
            }

            if (currentStep === maxStep) {
                nextBtn.style.opacity = '0.4';
                nextBtn.style.cursor = 'not-allowed';
                nextText.style.fill = '#bdbdbd';
            } else {
                nextBtn.style.opacity = '1';
                nextBtn.style.cursor = 'pointer';
                nextText.style.fill = '#ffffff';
            }
        }

        // 处理步骤切换
        function goToStep(step) {
            if (step < 0 || step > maxStep) return;
            currentStep = step;
            updateDisplay();
        }

        // 按钮事件绑定
        document.getElementById('scene3-btn-prev').addEventListener('click', function() {
            if (currentStep > 0) {
                goToStep(currentStep - 1);
            }
        });

        document.getElementById('scene3-btn-next').addEventListener('click', function() {
            if (currentStep < maxStep) {
                goToStep(currentStep + 1);
            }
        });

        document.getElementById('scene3-btn-reset').addEventListener('click', function() {
            goToStep(0);
        });

        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
