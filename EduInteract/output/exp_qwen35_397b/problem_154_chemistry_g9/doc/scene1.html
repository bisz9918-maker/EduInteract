<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物质转化关系图</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-svg { width: 800px; height: 500px; }
        
        /* 物质框样式 */
        .scene1-box { fill: #f5f5f5; stroke: #888888; stroke-width: 2px; }
        .scene1-box.highlighted { fill: #c8e6c9; stroke: #2e7d32; stroke-width: 3px; }
        
        /* 物质标签样式 */
        .scene1-label { font-size: 18px; font-weight: bold; fill: #000000; text-anchor: middle; dominant-baseline: middle; }
        
        /* 反应圆圈样式 */
        .scene1-reaction-circle { fill: #1565c0; stroke: none; }
        .scene1-reaction-text { font-size: 16px; font-weight: bold; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
        
        /* 连接线样式 */
        .scene1-connection { stroke: #000000; stroke-width: 2px; fill: none; }
        
        /* 已知条件标注框样式 */
        .scene1-annotation { fill: #c8e6c9; stroke: #2e7d32; stroke-width: 1px; rx: 5px; }
        .scene1-annotation-text { font-size: 13px; fill: #000000; text-anchor: middle; dominant-baseline: middle; }
        
        /* 按钮样式 */
        .scene1-btn { fill: #1565c0; stroke: #0d47a1; stroke-width: 1px; rx: 5px; cursor: pointer; }
        .scene1-btn:hover { fill: #1976d2; }
        .scene1-btn:disabled { fill: #bdbdbd; stroke: #9e9e9e; cursor: not-allowed; }
        .scene1-btn-text { font-size: 14px; font-weight: bold; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
        .scene1-btn:disabled .scene1-btn-text { fill: #757575; }
        
        /* 步骤指示器 */
        .scene1-step-text { font-size: 14px; fill: #333333; text-anchor: middle; dominant-baseline: middle; }
        
        /* 元素显隐控制 */
        .scene1-hidden { display: none; opacity: 0; }
        .scene1-visible { display: block; opacity: 1; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义箭头 -->
            <defs>
                <marker id="scene1-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#000000" />
                </marker>
            </defs>
            
            <!-- 连接线（在物质框下方） -->
            <g id="scene1-connections">
                <!-- 反应①连接线 -->
                <line id="scene1-line-a-1" class="scene1-connection" x1="140" y1="75" x2="188" y2="100" marker-end="url(#scene1-arrow)" />
                <line id="scene1-line-b-1" class="scene1-connection" x1="140" y1="175" x2="188" y2="100" marker-end="url(#scene1-arrow)" />
                <line id="scene1-line-1-e1" class="scene1-connection" x1="212" y1="100" x2="280" y2="75" marker-end="url(#scene1-arrow)" />
                <line id="scene1-line-1-d" class="scene1-connection" x1="212" y1="100" x2="280" y2="175" marker-end="url(#scene1-arrow)" />
                
                <!-- 反应②连接线 -->
                <line id="scene1-line-b-2" class="scene1-connection" x1="140" y1="175" x2="188" y2="200" marker-end="url(#scene1-arrow)" />
                <line id="scene1-line-c-2" class="scene1-connection" x1="140" y1="275" x2="188" y2="200" marker-end="url(#scene1-arrow)" />
                <line id="scene1-line-2-d" class="scene1-connection" x1="212" y1="200" x2="280" y2="175" marker-end="url(#scene1-arrow)" />
                <line id="scene1-line-2-f" class="scene1-connection" x1="212" y1="200" x2="280" y2="275" marker-end="url(#scene1-arrow)" />
                
                <!-- 反应③连接线 -->
                <line id="scene1-line-e1-3" class="scene1-connection" x1="340" y1="75" x2="438" y2="150" marker-end="url(#scene1-arrow)" />
                <line id="scene1-line-f-3" class="scene1-connection" x1="340" y1="275" x2="438" y2="150" marker-end="url(#scene1-arrow)" />
                <line id="scene1-line-3-e2" class="scene1-connection" x1="462" y1="150" x2="580" y2="125" marker-end="url(#scene1-arrow)" />
                <line id="scene1-line-3-g" class="scene1-connection" x1="462" y1="150" x2="580" y2="225" marker-end="url(#scene1-arrow)" />
            </g>
            
            <!-- 物质框 -->
            <g id="scene1-boxes">
                <!-- 左侧列 -->
                <rect id="scene1-box-a" class="scene1-box" x="80" y="50" width="60" height="50" />
                <text id="scene1-text-a" class="scene1-label" x="110" y="75">A</text>
                
                <rect id="scene1-box-b" class="scene1-box" x="80" y="150" width="60" height="50" />
                <text id="scene1-text-b" class="scene1-label" x="110" y="175">B</text>
                
                <rect id="scene1-box-c" class="scene1-box" x="80" y="250" width="60" height="50" />
                <text id="scene1-text-c" class="scene1-label" x="110" y="275">C</text>
                
                <!-- 中间列 -->
                <rect id="scene1-box-e1" class="scene1-box" x="280" y="50" width="60" height="50" />
                <text id="scene1-text-e1" class="scene1-label" x="310" y="75">E</text>
                
                <rect id="scene1-box-d" class="scene1-box" x="280" y="150" width="60" height="50" />
                <text id="scene1-text-d" class="scene1-label" x="310" y="175">D</text>
                
                <rect id="scene1-box-f" class="scene1-box" x="280" y="250" width="60" height="50" />
                <text id="scene1-text-f" class="scene1-label" x="310" y="275">F</text>
                
                <!-- 右侧列 -->
                <rect id="scene1-box-e2" class="scene1-box" x="580" y="100" width="60" height="50" />
                <text id="scene1-text-e2" class="scene1-label" x="610" y="125">E</text>
                
                <rect id="scene1-box-g" class="scene1-box" x="580" y="200" width="60" height="50" />
                <text id="scene1-text-g" class="scene1-label" x="610" y="225">G</text>
            </g>
            
            <!-- 反应圆圈 -->
            <g id="scene1-reactions">
                <circle id="scene1-reaction-1" class="scene1-reaction-circle" cx="200" cy="100" r="12" />
                <text id="scene1-reaction-text-1" class="scene1-reaction-text" x="200" y="100">①</text>
                
                <circle id="scene1-reaction-2" class="scene1-reaction-circle" cx="200" cy="200" r="12" />
                <text id="scene1-reaction-text-2" class="scene1-reaction-text" x="200" y="200">②</text>
                
                <circle id="scene1-reaction-3" class="scene1-reaction-circle" cx="450" cy="150" r="12" />
                <text id="scene1-reaction-text-3" class="scene1-reaction-text" x="450" y="150">③</text>
            </g>
            
            <!-- 已知条件标注框（初始隐藏） -->
            <g id="scene1-annotations">
                <rect id="scene1-label-b-bg" class="scene1-annotation scene1-hidden" x="80" y="210" width="140" height="35" />
                <text id="scene1-label-b" class="scene1-annotation-text scene1-hidden" x="150" y="227.5">最常见的酸</text>
                
                <rect id="scene1-label-d-bg" class="scene1-annotation scene1-hidden" x="280" y="210" width="160" height="35" />
                <text id="scene1-label-d" class="scene1-annotation-text scene1-hidden" x="360" y="227.5">人体中含量最多的物质→H₂O</text>
                
                <rect id="scene1-label-g-bg" class="scene1-annotation scene1-hidden" x="550" y="260" width="140" height="35" />
                <text id="scene1-label-g" class="scene1-annotation-text scene1-hidden" x="620" y="277.5">蓝色不溶物→Cu(OH)₂</text>
            </g>
            
            <!-- 控件栏（SVG 内部底部） -->
            <g id="scene1-controls">
                <!-- 上一步按钮 -->
                <rect id="scene1-btn-prev-bg" class="scene1-btn" x="280" y="455" width="90" height="35" />
                <text id="scene1-btn-prev-text" class="scene1-btn-text" x="325" y="472.5">◀ 上一步</text>
                
                <!-- 步骤指示器 -->
                <text id="scene1-step-indicator" class="scene1-step-text" x="400" y="472.5">步骤 0/4</text>
                
                <!-- 下一步按钮 -->
                <rect id="scene1-btn-next-bg" class="scene1-btn" x="430" y="455" width="90" height="35" />
                <text id="scene1-btn-next-text" class="scene1-btn-text" x="475" y="472.5">下一步 ▶</text>
            </g>
        </svg>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现 - 物质转化关系图
        
        // 状态管理
        let currentState = 0;
        const maxState = 4;
        
        // 获取 DOM 元素
        const btnPrev = document.getElementById('scene1-btn-prev-bg');
        const btnPrevText = document.getElementById('scene1-btn-prev-text');
        const btnNext = document.getElementById('scene1-btn-next-bg');
        const btnNextText = document.getElementById('scene1-btn-next-text');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        
        // 物质框元素
        const boxB = document.getElementById('scene1-box-b');
        const boxD = document.getElementById('scene1-box-d');
        const boxG = document.getElementById('scene1-box-g');
        
        // 标注框元素
        const labelB = document.getElementById('scene1-label-b');
        const labelBbg = document.getElementById('scene1-label-b-bg');
        const labelD = document.getElementById('scene1-label-d');
        const labelDbg = document.getElementById('scene1-label-d-bg');
        const labelG = document.getElementById('scene1-label-g');
        const labelGbg = document.getElementById('scene1-label-g-bg');
        
        // 工具函数：显示元素
        function show(el) {
            if (el) {
                el.classList.remove('scene1-hidden');
                el.classList.add('scene1-visible');
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }
        
        // 工具函数：隐藏元素
        function hide(el) {
            if (el) {
                el.classList.remove('scene1-visible');
                el.classList.add('scene1-hidden');
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }
        
        // 更新按钮状态
        function updateButtons() {
            // 上一步按钮
            if (currentState === 0) {
                btnPrev.style.fill = '#bdbdbd';
                btnPrev.style.stroke = '#9e9e9e';
                btnPrev.style.cursor = 'not-allowed';
                btnPrevText.style.fill = '#757575';
            } else {
                btnPrev.style.fill = '#1565c0';
                btnPrev.style.stroke = '#0d47a1';
                btnPrev.style.cursor = 'pointer';
                btnPrevText.style.fill = '#ffffff';
            }
            
            // 下一步按钮
            if (currentState === maxState) {
                btnNext.style.fill = '#bdbdbd';
                btnNext.style.stroke = '#9e9e9e';
                btnNext.style.cursor = 'not-allowed';
                btnNextText.style.fill = '#757575';
            } else {
                btnNext.style.fill = '#1565c0';
                btnNext.style.stroke = '#0d47a1';
                btnNext.style.cursor = 'pointer';
                btnNextText.style.fill = '#ffffff';
            }
            
            // 更新步骤指示器
            stepIndicator.textContent = '步骤 ' + currentState + '/' + maxState;
        }
        
        // 渲染当前状态
        function renderState() {
            // 重置所有高亮和标注
            boxB.classList.remove('highlighted');
            boxD.classList.remove('highlighted');
            boxG.classList.remove('highlighted');
            
            hide(labelB);
            hide(labelBbg);
            hide(labelD);
            hide(labelDbg);
            hide(labelG);
            hide(labelGbg);
            
            // 根据当前状态设置高亮和标注
            if (currentState >= 1) {
                boxB.classList.add('highlighted');
                show(labelB);
                show(labelBbg);
            }
            
            if (currentState >= 2) {
                boxD.classList.add('highlighted');
                show(labelD);
                show(labelDbg);
            }
            
            if (currentState >= 3) {
                boxG.classList.add('highlighted');
                show(labelG);
                show(labelGbg);
            }
            
            updateButtons();
        }
        
        // 上一步
        function goPrev() {
            if (currentState > 0) {
                currentState--;
                renderState();
            }
        }
        
        // 下一步
        function goNext() {
            if (currentState < maxState) {
                currentState++;
                renderState();
            }
        }
        
        // 绑定按钮事件
        btnPrev.addEventListener('click', goPrev);
        btnNext.addEventListener('click', goNext);
        
        // 初始化
        renderState();
        
    })();
    </script>
</body>
</html>
