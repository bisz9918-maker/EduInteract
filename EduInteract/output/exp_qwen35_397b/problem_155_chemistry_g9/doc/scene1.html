<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>化学提纯装置 - Co 提纯过程</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        /* 元素过渡动画 */
        .scene1-element {
            transition: opacity 0.3s ease, fill 0.3s ease, stroke 0.3s ease;
        }
        .scene1-hidden {
            opacity: 0;
            display: none;
        }
        .scene1-visible {
            opacity: 1;
            display: block;
        }
        /* 按钮样式 */
        #scene1-controls {
            position: absolute;
            bottom: 15px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 12px;
            z-index: 10;
        }
        .scene1-btn {
            padding: 8px 20px;
            font-size: 14px;
            border: 2px solid #333;
            border-radius: 6px;
            background: #f5f5f5;
            cursor: pointer;
            transition: all 0.2s;
        }
        .scene1-btn:hover:not(:disabled) {
            background: #e0e0e0;
        }
        .scene1-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .scene1-btn-primary {
            background: #1565c0;
            color: white;
            border-color: #1565c0;
        }
        .scene1-btn-primary:hover:not(:disabled) {
            background: #0d47a1;
        }
        /* 步骤指示器 */
        #scene1-step-indicator {
            position: absolute;
            bottom: 55px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 14px;
            color: #666;
        }
        /* 文字提示框 */
        #scene1-hint-box {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: #fff3e0;
            border: 2px solid #ff9800;
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 13px;
            color: #e65100;
            max-width: 600px;
            text-align: center;
            z-index: 5;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <!-- 文字提示框 -->
        <div id="scene1-hint-box">
            初始状态：展示基础装置结构
        </div>

        <!-- SVG 图示区：固定 800×500px -->
        <svg id="scene1-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#1565c0" />
                </marker>
                <marker id="scene1-arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#c62828" />
                </marker>
                <marker id="scene1-arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#2e7d32" />
                </marker>
            </defs>

            <!-- 进气口管道 -->
            <rect id="scene1-inlet-pipe" class="scene1-element scene1-visible"
                  x="80" y="220" width="110" height="20"
                  fill="#ffffff" stroke="#000000" stroke-width="1.5"/>

            <!-- 容器 1 主体 -->
            <rect id="scene1-container1" class="scene1-element scene1-visible"
                  x="190" y="200" width="180" height="60" rx="8" ry="8"
                  fill="#ffffff" stroke="#000000" stroke-width="2"/>

            <!-- 连接管道 -->
            <rect id="scene1-connect-pipe" class="scene1-element scene1-visible"
                  x="370" y="220" width="60" height="20"
                  fill="#ffffff" stroke="#000000" stroke-width="1.5"/>

            <!-- 容器 2 主体 -->
            <rect id="scene1-container2" class="scene1-element scene1-visible"
                  x="430" y="200" width="180" height="60" rx="8" ry="8"
                  fill="#ffffff" stroke="#000000" stroke-width="2"/>

            <!-- 出气口管道 -->
            <rect id="scene1-outlet-pipe" class="scene1-element scene1-visible"
                  x="610" y="220" width="110" height="20"
                  fill="#ffffff" stroke="#000000" stroke-width="1.5"/>

            <!-- 进气箭头（初始灰色） -->
            <line id="scene1-arrow-in-line" class="scene1-element scene1-visible"
                  x1="50" y1="230" x2="75" y2="230"
                  stroke="#999999" stroke-width="3" marker-end="url(#scene1-arrowhead)"/>

            <!-- 出气箭头（初始灰色） -->
            <line id="scene1-arrow-out-line" class="scene1-element scene1-visible"
                  x1="725" y1="230" x2="750" y2="230"
                  stroke="#999999" stroke-width="3" marker-end="url(#scene1-arrowhead)"/>

            <!-- 容器 1 内固体颗粒（点状填充） -->
            <g id="scene1-solid1-group" class="scene1-element scene1-visible">
                <!-- 初始灰色 -->
                <circle cx="205" cy="220" r="2" fill="#888888"/>
                <circle cx="215" cy="225" r="2" fill="#888888"/>
                <circle cx="225" cy="218" r="2" fill="#888888"/>
                <circle cx="235" cy="228" r="2" fill="#888888"/>

                <circle cx="275" cy="226" r="2" fill="#888888"/>

                <circle cx="295" cy="228" r="2" fill="#888888"/>

                <circle cx="310" cy="237" r="2" fill="#888888"/>
                <circle cx="320" cy="245" r="2" fill="#888888"/>

                <circle cx="340" cy="241" r="2" fill="#888888"/>
                <circle cx="350" cy="233" r="2" fill="#888888"/>
            </g>

            <!-- 容器 2 内固体颗粒（点状填充） -->
            <g id="scene1-solid2-group" class="scene1-element scene1-visible">
                <!-- 初始灰色 -->
                <circle cx="445" cy="220" r="2" fill="#888888"/>
                <circle cx="455" cy="225" r="2" fill="#888888"/>
                <circle cx="465" cy="218" r="2" fill="#888888"/>
                <circle cx="475" cy="228" r="2" fill="#888888"/>
                <circle cx="485" cy="222" r="2" fill="#888888"/>
                <circle cx="495" cy="230" r="2" fill="#888888"/>
                <circle cx="505" cy="220" r="2" fill="#888888"/>
                <circle cx="515" cy="226" r="2" fill="#888888"/>
                <circle cx="525" cy="218" r="2" fill="#888888"/>
                <circle cx="535" cy="228" r="2" fill="#888888"/>
                <circle cx="545" cy="222" r="2" fill="#888888"/>
                <circle cx="555" cy="230" r="2" fill="#888888"/>
                <circle cx="565" cy="220" r="2" fill="#888888"/>
                <circle cx="575" cy="226" r="2" fill="#888888"/>
                <circle cx="585" cy="218" r="2" fill="#888888"/>
                <circle cx="450" cy="235" r="2" fill="#888888"/>
                <circle cx="460" cy="240" r="2" fill="#888888"/>
                <circle cx="470" cy="233" r="2" fill="#888888"/>
                <circle cx="480" cy="243" r="2" fill="#888888"/>
                <circle cx="490" cy="237" r="2" fill="#888888"/>
                <circle cx="500" cy="245" r="2" fill="#888888"/>
                <circle cx="510" cy="235" r="2" fill="#888888"/>
                <circle cx="520" cy="241" r="2" fill="#888888"/>
                <circle cx="530" cy="233" r="2" fill="#888888"/>
                <circle cx="540" cy="243" r="2" fill="#888888"/>
                <circle cx="550" cy="237" r="2" fill="#888888"/>
                <circle cx="560" cy="245" r="2" fill="#888888"/>
                <circle cx="570" cy="235" r="2" fill="#888888"/>
                <circle cx="580" cy="241" r="2" fill="#888888"/>
                <circle cx="590" cy="233" r="2" fill="#888888"/>
            </g>

            <!-- 容器 1 标签 -->
            <text id="scene1-label-container1" class="scene1-element scene1-visible"
                  x="280" y="180" text-anchor="middle"
                  font-size="14px" fill="#000000">容器 1</text>

            <!-- 容器 2 标签 -->
            <text id="scene1-label-container2" class="scene1-element scene1-visible"
                  x="520" y="180" text-anchor="middle"
                  font-size="14px" fill="#000000">容器 2</text>

            <!-- 温度 900℃标签（初始隐藏） -->
            <text id="scene1-temp-900" class="scene1-element scene1-hidden"
                  x="280" y="145" text-anchor="middle"
                  font-size="14px" font-weight="bold" fill="#c62828">900℃</text>

            <!-- 温度 600℃标签（初始隐藏） -->
            <text id="scene1-temp-600" class="scene1-element scene1-hidden"
                  x="520" y="145" text-anchor="middle"
                  font-size="14px" font-weight="bold" fill="#1565c0">600℃</text>

            <!-- 进气标签 -->
            <text id="scene1-label-inlet" class="scene1-element scene1-visible"
                  x="65" y="200" text-anchor="middle"
                  font-size="12px" fill="#000000">气体 Y</text>

            <!-- 出气标签 -->
            <text id="scene1-label-outlet" class="scene1-element scene1-visible"
                  x="720" y="200" text-anchor="middle"
                  font-size="12px" fill="#000000">气体 Y</text>

            <!-- 容器 1 固体标签 -->
            <text id="scene1-label-solid1" class="scene1-element scene1-visible"
                  x="280" y="280" text-anchor="middle"
                  font-size="12px" fill="#000000">含杂质 Co</text>

            <!-- 容器 2 固体标签 -->
            <text id="scene1-label-solid2" class="scene1-element scene1-visible"
                  x="520" y="280" text-anchor="middle"
                  font-size="12px" fill="#000000">固体 X</text>

            <!-- 气体流向箭头 1（管道上方，初始隐藏） -->
            <line id="scene1-flow-arrow1" class="scene1-element scene1-hidden"
                  x1="380" y1="205" x2="420" y2="205"
                  stroke="#1565c0" stroke-width="3" marker-end="url(#scene1-arrowhead)"/>

            <!-- 气体流向箭头 2（管道下方，初始隐藏） -->
            <line id="scene1-flow-arrow2" class="scene1-element scene1-hidden"
                  x1="380" y1="255" x2="420" y2="255"
                  stroke="#1565c0" stroke-width="3" marker-end="url(#scene1-arrowhead)"/>

            <!-- CoCl₂(气) 标签（初始隐藏） -->
            <text id="scene1-label-cocl2" class="scene1-element scene1-hidden"
                  x="400" y="195" text-anchor="middle"
                  font-size="11px" fill="#1565c0">CoCl₂(气)</text>

            <!-- H₂(气) 标签（初始隐藏） -->
            <text id="scene1-label-h2" class="scene1-element scene1-hidden"
                  x="400" y="265" text-anchor="middle"
                  font-size="11px" fill="#1565c0">H₂(气)</text>

            <!-- 正向反应箭头（容器 1 下方，初始隐藏） -->
            <line id="scene1-reaction-up" class="scene1-element scene1-hidden"
                  x1="280" y1="340" x2="280" y2="310"
                  stroke="#c62828" stroke-width="3" marker-end="url(#scene1-arrowhead-red)"/>

            <!-- 逆向反应箭头（容器 2 下方，初始隐藏） -->
            <line id="scene1-reaction-down" class="scene1-element scene1-hidden"
                  x1="520" y1="310" x2="520" y2="340"
                  stroke="#2e7d32" stroke-width="3" marker-end="url(#scene1-arrowhead-green)"/>

            <!-- 反应方程式（初始隐藏） -->
            <text id="scene1-equation" class="scene1-element scene1-hidden"
                  x="400" y="370" text-anchor="middle"
                  font-size="13px" fill="#000000">Co(固) + 2HCl(气) ⇌ CoCl₂(气) + H₂(气)</text>

            <!-- 出气标签详细（初始隐藏） -->
            <text id="scene1-label-outlet-detail" class="scene1-element scene1-hidden"
                  x="720" y="250" text-anchor="middle"
                  font-size="11px" fill="#1565c0">导出气体：HCl</text>
        </svg>

        <!-- 步骤指示器 -->
        <div id="scene1-step-indicator">步骤 1/5</div>

        <!-- 控件栏叠在 SVG 底部 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn" disabled>◀ 上一步</button>
            <button id="scene1-btn-next" class="scene1-btn scene1-btn-primary">下一步 ▶</button>
            <button id="scene1-btn-reset" class="scene1-btn">重置</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现 - 化学提纯装置分步演示

        // 状态变量
        let currentState = 0;
        const totalSteps = 5;

        // 提示文字
        const hints = [
            "初始状态：展示基础装置结构",
            "容器 1：900℃，发生正向反应 Co + 2HCl → CoCl₂ + H₂",
            "气态产物 CoCl₂ 和 H₂ 从容器 1 流向容器 2",
            "容器 2：600℃，发生逆向反应 CoCl₂ + H₂ → Co + 2HCl",
            "最终产物：容器 2 中得到纯净 Co 固体，导出回收的 HCl 气体"
        ];

        // 获取元素辅助函数
        function getElement(id) {
            return document.getElementById('scene1-' + id);
        }

        // 显示元素
        function showElement(id) {
            const el = getElement(id);
            if (el) {
                el.classList.remove('scene1-hidden');
                el.classList.add('scene1-visible');
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }

        // 隐藏元素
        function hideElement(id) {
            const el = getElement(id);
            if (el) {
                el.classList.remove('scene1-visible');
                el.classList.add('scene1-hidden');
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }

        // 设置元素样式
        function setElementStyle(id, style) {
            const el = getElement(id);
            if (el) {
                Object.assign(el.style, style);
            }
        }

        // 设置 SVG 属性
        function setSvgAttr(id, attr, value) {
            const el = getElement(id);
            if (el) {
                el.setAttribute(attr, value);
            }
        }

        // 更新固体颗粒颜色
        function updateSolidColor(groupId, color) {
            const group = getElement(groupId);
            if (group) {
                const circles = group.querySelectorAll('circle');
                circles.forEach(circle => {
                    circle.setAttribute('fill', color);
                });
            }
        }

        // 渲染当前步骤
        function renderStep(step) {
            // 重置所有元素到基础状态
            resetToBaseState();

            switch(step) {
                case 0:
                    // 初始状态：基础装置图
                    break;

                case 1:
                    // 步骤 1：容器 1 温度 900℃及正向反应
                    showElement('temp-900');
                    showElement('reaction-up');
                    setSvgAttr('container1', 'stroke', '#c62828');
                    setSvgAttr('container1', 'stroke-width', '3');
                    updateSolidColor('solid1-group', '#d32f2f');
                    break;

                case 2:
                    // 步骤 2：气体流向容器 2
                    showElement('temp-900');
                    showElement('reaction-up');
                    setSvgAttr('container1', 'stroke', '#c62828');
                    setSvgAttr('container1', 'stroke-width', '3');
                    updateSolidColor('solid1-group', '#d32f2f');

                    showElement('flow-arrow1');
                    showElement('flow-arrow2');
                    showElement('label-cocl2');
                    showElement('label-h2');
                    setSvgAttr('arrow-in-line', 'stroke', '#1565c0');
                    setSvgAttr('arrow-in-line', 'marker-end', 'url(#scene1-arrowhead)');
                    break;

                case 3:
                    // 步骤 3：容器 2 温度 600℃及逆向反应
                    showElement('temp-900');
                    showElement('reaction-up');
                    setSvgAttr('container1', 'stroke', '#c62828');
                    setSvgAttr('container1', 'stroke-width', '3');
                    updateSolidColor('solid1-group', '#d32f2f');

                    showElement('flow-arrow1');
                    showElement('flow-arrow2');
                    showElement('label-cocl2');
                    showElement('label-h2');
                    setSvgAttr('arrow-in-line', 'stroke', '#1565c0');
                    setSvgAttr('arrow-in-line', 'marker-end', 'url(#scene1-arrowhead)');

                    showElement('temp-600');
                    showElement('reaction-down');
                    setSvgAttr('container2', 'stroke', '#2e7d32');
                    setSvgAttr('container2', 'stroke-width', '3');
                    updateSolidColor('solid2-group', '#388e3c');
                    break;

                case 4:
                    // 步骤 4：最终产物
                    showElement('temp-900');
                    showElement('reaction-up');
                    setSvgAttr('container1', 'stroke', '#c62828');
                    setSvgAttr('container1', 'stroke-width', '3');
                    updateSolidColor('solid1-group', '#d32f2f');

                    showElement('flow-arrow1');
                    showElement('flow-arrow2');
                    showElement('label-cocl2');
                    showElement('label-h2');
                    setSvgAttr('arrow-in-line', 'stroke', '#1565c0');
                    setSvgAttr('arrow-in-line', 'marker-end', 'url(#scene1-arrowhead)');

                    showElement('temp-600');
                    showElement('reaction-down');
                    setSvgAttr('container2', 'stroke', '#2e7d32');
                    setSvgAttr('container2', 'stroke-width', '3');
                    updateSolidColor('solid2-group', '#388e3c');

                    showElement('equation');
                    setSvgAttr('arrow-out-line', 'stroke', '#1565c0');
                    setSvgAttr('arrow-out-line', 'marker-end', 'url(#scene1-arrowhead)');
                    showElement('label-outlet-detail');
                    getElement('label-solid2').textContent = '纯净 Co';
                    break;
            }

            // 更新提示文字
            getElement('hint-box').textContent = hints[step];

            // 更新步骤指示器
            getElement('step-indicator').textContent = '步骤 ' + (step + 1) + '/' + totalSteps;

            // 更新按钮状态
            const prevBtn = getElement('btn-prev');
            const nextBtn = getElement('btn-next');
            prevBtn.disabled = (step === 0);
            nextBtn.disabled = (step === totalSteps - 1);
        }

        // 重置到基础状态
        function resetToBaseState() {
            // 隐藏所有可隐藏元素
            hideElement('temp-900');
            hideElement('temp-600');
            hideElement('reaction-up');
            hideElement('reaction-down');
            hideElement('flow-arrow1');
            hideElement('flow-arrow2');
            hideElement('label-cocl2');
            hideElement('label-h2');
            hideElement('equation');
            hideElement('label-outlet-detail');

            // 重置容器样式
            setSvgAttr('container1', 'stroke', '#000000');
            setSvgAttr('container1', 'stroke-width', '2');
            setSvgAttr('container2', 'stroke', '#000000');
            setSvgAttr('container2', 'stroke-width', '2');

            // 重置固体颜色
            updateSolidColor('solid1-group', '#888888');
            updateSolidColor('solid2-group', '#888888');

            // 重置箭头颜色
            setSvgAttr('arrow-in-line', 'stroke', '#999999');
            setSvgAttr('arrow-in-line', 'marker-end', 'url(#scene1-arrowhead)');
            setSvgAttr('arrow-out-line', 'stroke', '#999999');
            setSvgAttr('arrow-out-line', 'marker-end', 'url(#scene1-arrowhead)');

            // 重置固体标签
            getElement('label-solid2').textContent = '固体 X';
        }

        // 事件绑定
        getElement('btn-prev').addEventListener('click', function() {
            if (currentState > 0) {
                currentState--;
                renderStep(currentState);
            }
        });

        getElement('btn-next').addEventListener('click', function() {
            if (currentState < totalSteps - 1) {
                currentState++;
                renderStep(currentState);
            }
        });

        getElement('btn-reset').addEventListener('click', function() {
            currentState = 0;
            renderStep(currentState);
        });

        // 初始化
        renderStep(currentState);

    })();
    </script>
</body>
</html>
