<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>化学反应微观示意图 - 选项验证</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        .scene3-btn { cursor: pointer; transition: all 0.2s; }
        .scene3-btn:hover { opacity: 0.8; }
        .scene3-btn-active { fill: #1976d2 !important; }
        .scene3-btn-active text { fill: #ffffff !important; }
        .scene3-card-highlight { fill: #e3f2fd !important; }
        .scene3-hidden { opacity: 0; }
        .scene3-visible { opacity: 1; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg width="800" height="500" id="scene3-svg">
            <!-- 定义 -->
            <defs>
                <!-- 白色原子 ○ -->
                <g id="scene3-atom-white">
                    <circle cx="0" cy="0" r="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
                </g>
                <!-- 黑色原子 ● -->
                <g id="scene3-atom-black">
                    <circle cx="0" cy="0" r="8" fill="#333333" stroke="#333333" stroke-width="1.5"/>
                </g>
            </defs>

            <!-- 选项 A 卡片 (50,50)-(370,140) -->
            <rect id="scene3-card-a" x="50" y="50" width="320" height="90" rx="8" fill="#f5f5f5" stroke="#888888" stroke-width="1.5"/>
            <text id="scene3-text-a" x="70" y="85" fill="#000000" font-size="14px" font-family="sans-serif">A．是化合反应</text>
            <text id="scene3-mark-a" x="340" y="90" fill="#2e7d32" font-size="24px" font-family="sans-serif" class="scene3-hidden">✓</text>

            <!-- 选项 B 卡片 (430,50)-(750,140) -->
            <rect id="scene3-card-b" x="430" y="50" width="320" height="90" rx="8" fill="#f5f5f5" stroke="#888888" stroke-width="1.5"/>
            <text id="scene3-text-b" x="450" y="85" fill="#000000" font-size="14px" font-family="sans-serif">B．有单质生成</text>
            <text id="scene3-mark-b" x="720" y="90" fill="#c62828" font-size="24px" font-family="sans-serif" class="scene3-hidden">✗</text>

            <!-- 选项 C 卡片 (50,170)-(370,260) -->
            <rect id="scene3-card-c" x="50" y="170" width="320" height="90" rx="8" fill="#f5f5f5" stroke="#888888" stroke-width="1.5"/>
            <text id="scene3-text-c" x="70" y="205" fill="#000000" font-size="14px" font-family="sans-serif">C．反应前后分子种类不变</text>
            <text id="scene3-mark-c" x="340" y="210" fill="#c62828" font-size="24px" font-family="sans-serif" class="scene3-hidden">✗</text>

            <!-- 选项 D 卡片 (430,170)-(750,260) -->
            <rect id="scene3-card-d" x="430" y="170" width="320" height="90" rx="8" fill="#f5f5f5" stroke="#888888" stroke-width="1.5"/>
            <text id="scene3-text-d" x="450" y="205" fill="#000000" font-size="14px" font-family="sans-serif">D．参加反应的两种分子个数比为 4:1</text>
            <text id="scene3-mark-d" x="720" y="210" fill="#c62828" font-size="24px" font-family="sans-serif" class="scene3-hidden">✗</text>

            <!-- 判断依据区背景 (50,290)-(750,420) -->
            <rect x="50" y="290" width="700" height="130" rx="8" fill="#ffffff" stroke="#888888" stroke-width="1"/>
            
            <!-- 依据标题 -->
            <text id="scene3-explanation-title" x="70" y="315" fill="#1565c0" font-size="16px" font-family="sans-serif" font-weight="bold">选项分析</text>
            
            <!-- 依据内容 -->
            <text id="scene3-explanation-content" x="70" y="345" fill="#1565c0" font-size="13px" font-family="sans-serif">
                <tspan x="70" dy="0">点击下方按钮查看各选项分析</tspan>
            </text>

            <!-- 微观示意图缩略图组 (550,300)-(730,410) -->
            <g id="scene3-micro-diagram">
                <!-- 反应前小框 (550,300)-(635,370) -->
                <rect x="550" y="300" width="85" height="70" fill="#f9f9f9" stroke="#666666" stroke-width="1"/>
                <text x="592" y="315" text-anchor="middle" fill="#666666" font-size="10px">反应前</text>
                <!-- 反应前分子：简化显示 2 个○○ + 1 个●● -->
                <g id="scene3-before-molecules">
                    <!-- ○○分子 -->
                    <circle cx="565" y="335" r="5" fill="#ffffff" stroke="#333333" stroke-width="1"/>
                    <circle cx="575" y="335" r="5" fill="#ffffff" stroke="#333333" stroke-width="1"/>
                    <circle cx="565" y="355" r="5" fill="#ffffff" stroke="#333333" stroke-width="1"/>
                    <circle cx="575" y="355" r="5" fill="#ffffff" stroke="#333333" stroke-width="1"/>
                    <!-- ●●分子 -->
                    <circle cx="605" y="345" r="5" fill="#333333" stroke="#333333" stroke-width="1"/>
                    <circle cx="615" y="345" r="5" fill="#333333" stroke="#333333" stroke-width="1"/>
                </g>

                <!-- 箭头 -->
                <path d="M 635 335 L 645 335" stroke="#666666" stroke-width="2" marker-end="url(#scene3-arrowhead)"/>
                
                <!-- 反应后小框 (645,300)-(730,370) -->
                <rect x="645" y="300" width="85" height="70" fill="#f9f9f9" stroke="#666666" stroke-width="1"/>
                <text x="687" y="315" text-anchor="middle" fill="#666666" font-size="10px">反应后</text>
                <!-- 反应后分子：简化显示 2 个○○● -->
                <g id="scene3-after-molecules">
                    <!-- ○○●分子 -->
                    <circle cx="660" y="335" r="5" fill="#ffffff" stroke="#333333" stroke-width="1"/>
                    <circle cx="670" y="335" r="5" fill="#333333" stroke="#333333" stroke-width="1"/>
                    <circle cx="680" y="335" r="5" fill="#ffffff" stroke="#333333" stroke-width="1"/>
                    <circle cx="660" y="355" r="5" fill="#ffffff" stroke="#333333" stroke-width="1"/>
                    <circle cx="670" y="355" r="5" fill="#333333" stroke="#333333" stroke-width="1"/>
                    <circle cx="680" y="355" r="5" fill="#ffffff" stroke="#333333" stroke-width="1"/>
                </g>
            </g>

            <!-- 箭头标记定义 -->
            <defs>
                <marker id="scene3-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#666666"/>
                </marker>
            </defs>

            <!-- 控件栏 (SVG 内底部) -->
            <g id="scene3-controls">
                <!-- 初始按钮 (200,450)-(270,480) -->
                <rect id="scene3-btn-0" x="200" y="450" width="70" height="30" rx="5" fill="#9e9e9e" class="scene3-btn scene3-btn-active"/>
                <text x="235" y="470" text-anchor="middle" fill="#ffffff" font-size="13px" font-family="sans-serif">初始</text>
                
                <!-- 选项 A 按钮 (280,450)-(350,480) -->
                <rect id="scene3-btn-1" x="280" y="450" width="70" height="30" rx="5" fill="#9e9e9e" class="scene3-btn"/>
                <text x="315" y="470" text-anchor="middle" fill="#ffffff" font-size="13px" font-family="sans-serif">选项 A</text>
                
                <!-- 选项 B 按钮 (360,450)-(430,480) -->
                <rect id="scene3-btn-2" x="360" y="450" width="70" height="30" rx="5" fill="#9e9e9e" class="scene3-btn"/>
                <text x="395" y="470" text-anchor="middle" fill="#ffffff" font-size="13px" font-family="sans-serif">选项 B</text>
                
                <!-- 选项 C 按钮 (440,450)-(510,480) -->
                <rect id="scene3-btn-3" x="440" y="450" width="70" height="30" rx="5" fill="#9e9e9e" class="scene3-btn"/>
                <text x="475" y="470" text-anchor="middle" fill="#ffffff" font-size="13px" font-family="sans-serif">选项 C</text>
                
                <!-- 选项 D 按钮 (520,450)-(590,480) -->
                <rect id="scene3-btn-4" x="520" y="450" width="70" height="30" rx="5" fill="#9e9e9e" class="scene3-btn"/>
                <text x="555" y="470" text-anchor="middle" fill="#ffffff" font-size="13px" font-family="sans-serif">选项 D</text>
            </g>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 3 实现 - 化学反应微观示意图选项验证

        // 状态管理
        let currentState = 0;

        // 各选项的分析内容
        const explanations = {
            0: {
                title: "选项分析",
                content: "点击下方按钮查看各选项分析"
            },
            1: {
                title: "选项 A 分析",
                content: "化合反应 ✓ 判断依据：反应物为○○和●●两种物质，生成物为○○●一种物质。两种物质生成一种物质，符合化合反应定义。",
                mark: "a",
                markType: "correct"
            },
            2: {
                title: "选项 B 分析",
                content: "有单质生成 ✗ 判断依据：生成物○○●由白色原子和黑色原子两种不同原子组成，属于化合物，不是单质。",
                mark: "b",
                markType: "wrong"
            },
            3: {
                title: "选项 C 分析",
                content: "反应前后分子种类不变 ✗ 判断依据：反应前分子种类为○○和●●，反应后分子种类为○○●。分子种类发生了改变。",
                mark: "c",
                markType: "wrong"
            },
            4: {
                title: "选项 D 分析",
                content: "参加反应的两种分子个数比为 4:1 ✗ 判断依据：反应前有 4 个○○分子，但只有 2 个参与反应（2 个剩余）。参加反应的○○:●● = 2:1，不是 4:1。",
                mark: "d",
                markType: "wrong"
            }
        };

        // 获取 DOM 元素
        const cards = {
            a: document.getElementById("scene3-card-a"),
            b: document.getElementById("scene3-card-b"),
            c: document.getElementById("scene3-card-c"),
            d: document.getElementById("scene3-card-d")
        };

        const marks = {
            a: document.getElementById("scene3-mark-a"),
            b: document.getElementById("scene3-mark-b"),
            c: document.getElementById("scene3-mark-c"),
            d: document.getElementById("scene3-mark-d")
        };

        const explanationTitle = document.getElementById("scene3-explanation-title");
        const explanationContent = document.getElementById("scene3-explanation-content");
        const buttons = [
            document.getElementById("scene3-btn-0"),
            document.getElementById("scene3-btn-1"),
            document.getElementById("scene3-btn-2"),
            document.getElementById("scene3-btn-3"),
            document.getElementById("scene3-btn-4")
        ];

        // 更新状态函数
        function updateState(newState) {
            currentState = newState;
            const data = explanations[newState];

            // 重置所有卡片高亮
            Object.values(cards).forEach(card => {
                card.classList.remove("scene3-card-highlight");
            });
            cards.a.classList.add("scene3-card-highlight");

            // 隐藏所有判断标识
            Object.values(marks).forEach(mark => {
                mark.classList.add("scene3-hidden");
                mark.classList.remove("scene3-visible");
            });

            // 重置所有按钮样式
            buttons.forEach(btn => {
                btn.classList.remove("scene3-btn-active");
            });

            // 根据状态设置高亮和标识
            if (newState === 1) {
                cards.a.classList.add("scene3-card-highlight");
                marks.a.classList.remove("scene3-hidden");
                marks.a.classList.add("scene3-visible");
                buttons[1].classList.add("scene3-btn-active");
            } else if (newState === 2) {
                cards.b.classList.add("scene3-card-highlight");
                marks.b.classList.remove("scene3-hidden");
                marks.b.classList.add("scene3-visible");
                buttons[2].classList.add("scene3-btn-active");
            } else if (newState === 3) {
                cards.c.classList.add("scene3-card-highlight");
                marks.c.classList.remove("scene3-hidden");
                marks.c.classList.add("scene3-visible");
                buttons[3].classList.add("scene3-btn-active");
            } else if (newState === 4) {
                cards.d.classList.add("scene3-card-highlight");
                marks.d.classList.remove("scene3-hidden");
                marks.d.classList.add("scene3-visible");
                buttons[4].classList.add("scene3-btn-active");
            } else {
                buttons[0].classList.add("scene3-btn-active");
            }

            // 更新判断依据区内容
            explanationTitle.textContent = data.title;
            
            // 清除并重新设置内容
            while (explanationContent.firstChild) {
                explanationContent.removeChild(explanationContent.firstChild);
            }
            
            const lines = data.content.split("。");
            lines.forEach((line, index) => {
                if (line.trim()) {
                    const tspan = document.createElementNS("http://www.w3.org/2000/svg", "tspan");
                    tspan.setAttribute("x", "70");
                    tspan.setAttribute("dy", index === 0 ? "0" : "20");
                    tspan.textContent = line + "。";
                    explanationContent.appendChild(tspan);
                }
            });
        }

        // 绑定按钮事件
        buttons.forEach((btn, index) => {
            btn.addEventListener("click", () => {
                updateState(index);
            });
        });

        // 初始化
        updateState(0);
    })();
    </script>
</body>
</html>
