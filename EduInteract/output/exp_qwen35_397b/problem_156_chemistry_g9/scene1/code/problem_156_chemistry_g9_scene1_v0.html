<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>化学反应微观示意图</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-svg { width: 800px; height: 500px; }
        .scene1-btn { cursor: pointer; font-size: 14px; padding: 8px 16px; border: none; border-radius: 4px; }
        .scene1-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene1-btn-prev { background: #e0e0e0; color: #333; }
        .scene1-btn-next { background: #1565c0; color: #fff; }
        .scene1-highlight-react { fill: rgba(21,101,192,0.2); stroke: #1565c0; stroke-width: 3; }
        .scene1-highlight-remain { fill: rgba(136,136,136,0.1); stroke: #888888; stroke-width: 2; stroke-dasharray: 5,5; }
        .scene1-compound-highlight { stroke: #1565c0; stroke-width: 3; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 反应前方框 -->
            <rect id="scene1-box-before" x="80" y="80" width="240" height="200" fill="#ffffff" stroke="#000000" stroke-width="2"/>
            
            <!-- 反应后方框 -->
            <rect id="scene1-box-after" x="480" y="80" width="240" height="200" fill="#ffffff" stroke="#000000" stroke-width="2"/>
            
            <!-- 反应箭头 -->
            <g id="scene1-arrow">
                <line x1="350" y1="180" x2="430" y2="180" stroke="#000000" stroke-width="2"/>
                <polygon points="450,180 430,170 430,190" fill="#000000"/>
            </g>
            
            <!-- 反应前标签 -->
            <text id="scene1-label-before" x="200" y="300" text-anchor="middle" font-size="16px" fill="#000000">反应前</text>
            
            <!-- 反应后标签 -->
            <text id="scene1-label-after" x="600" y="300" text-anchor="middle" font-size="16px" fill="#000000">反应后</text>
            
            <!-- 步骤标签区 -->
            <text id="scene1-label-step" x="400" y="350" text-anchor="middle" font-size="14px" fill="#333333"></text>
            
            <!-- 高亮框（参与反应）- 初始隐藏 -->
            <rect id="scene1-highlight-react" class="scene1-highlight-react" x="105" y="105" width="150" height="110" fill="rgba(21,101,192,0.2)" stroke="#1565c0" stroke-width="3" style="display:none;"/>
            
            <!-- 剩余分子框（反应前）- 初始隐藏 -->
            <rect id="scene1-highlight-remain-before" class="scene1-highlight-remain" x="225" y="105" width="60" height="110" fill="rgba(136,136,136,0.1)" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" style="display:none;"/>
            
            <!-- 剩余分子框（反应后）- 初始隐藏 -->
            <rect id="scene1-highlight-remain-after" class="scene1-highlight-remain" x="625" y="105" width="80" height="130" fill="rgba(136,136,136,0.1)" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" style="display:none;"/>
            
            <!-- 反应前分子 -->
            <!-- 白分子1 (120,120) 左上角，参与反应 -->
            <g id="scene1-mol-w1-before">
                <circle cx="115" cy="120" r="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                <circle cx="135" cy="120" r="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
            </g>
            
            <!-- 白分子2 (240,120) 右上角，剩余 -->
            <g id="scene1-mol-w2-before">
                <circle cx="235" cy="120" r="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                <circle cx="255" cy="120" r="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
            </g>
            
            <!-- 白分子3 (120,200) 左下角，剩余 -->
            <g id="scene1-mol-w3-before">
                <circle cx="115" cy="200" r="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                <circle cx="135" cy="200" r="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
            </g>
            
            <!-- 白分子4 (240,200) 右下角，参与反应 -->
            <g id="scene1-mol-w4-before">
                <circle cx="235" cy="200" r="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                <circle cx="255" cy="200" r="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
            </g>
            
            <!-- 黑分子 (180,160) 中央，参与反应 -->
            <g id="scene1-mol-b1-before">
                <circle cx="170" cy="160" r="10" fill="#000000" stroke="#000000" stroke-width="2"/>
                <circle cx="190" cy="160" r="10" fill="#000000" stroke="#000000" stroke-width="2"/>
            </g>
            
            <!-- 反应后分子 -->
            <!-- 化合物分子1 (520,130) 左上，生成物 -->
            <g id="scene1-mol-c1-after">
                <circle cx="510" cy="125" r="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                <circle cx="530" cy="125" r="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                <circle cx="520" cy="145" r="10" fill="#000000" stroke="#000000" stroke-width="2"/>
            </g>
            
            <!-- 化合物分子2 (640,180) 右下，生成物 -->
            <g id="scene1-mol-c2-after">
                <circle cx="630" cy="175" r="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                <circle cx="650" cy="175" r="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                <circle cx="640" cy="195" r="10" fill="#000000" stroke="#000000" stroke-width="2"/>
            </g>
            
            <!-- 白分子1 (520,220) 左下，剩余 -->
            <g id="scene1-mol-w1-after">
                <circle cx="515" cy="220" r="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                <circle cx="535" cy="220" r="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
            </g>
            
            <!-- 白分子2 (640,120) 右上，剩余 -->
            <g id="scene1-mol-w2-after">
                <circle cx="635" cy="120" r="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                <circle cx="655" cy="120" r="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
            </g>
            
            <!-- 控件栏 -->
            <g id="scene1-controls">
                <rect id="scene1-btn-prev-bg" x="280" y="445" width="80" height="35" rx="4" fill="#e0e0e0"/>
                <text id="scene1-btn-prev-text" x="320" y="467" text-anchor="middle" font-size="14px" fill="#333333">◀ 上一步</text>
                
                <text id="scene1-label-step-indicator" x="400" y="467" text-anchor="middle" font-size="14px" fill="#666666">步骤 0/4</text>
                
                <rect id="scene1-btn-next-bg" x="440" y="445" width="80" height="35" rx="4" fill="#1565c0"/>
                <text id="scene1-btn-next-text" x="480" y="467" text-anchor="middle" font-size="14px" fill="#ffffff">下一步 ▶</text>
            </g>
        </svg>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现 - 化学反应微观示意图
        
        const STEP_LABELS = [
            "",  // 步骤0：初始状态
            "参与反应的分子：2个○○ + 1个●●",  // 步骤1
            "生成物：2个○○●",  // 步骤2
            "剩余分子：2个○○ 未参与反应",  // 步骤3
            "结论：实际反应比例 2:1，属于化合反应"  // 步骤4
        ];
        
        let currentState = 0;
        
        // 元素可见性控制
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.display = "block";
                el.style.opacity = "1";
            }
        }
        
        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.display = "none";
                el.style.opacity = "0";
            }
        }
        
        // 更新按钮状态
        function updateButtons() {
            const prevBg = document.getElementById("scene1-btn-prev-bg");
            const prevText = document.getElementById("scene1-btn-prev-text");
            const nextBg = document.getElementById("scene1-btn-next-bg");
            const nextText = document.getElementById("scene1-btn-next-text");
            const indicator = document.getElementById("scene1-label-step-indicator");
            
            indicator.textContent = "步骤 " + currentState + "/4";
            
            if (currentState === 0) {
                prevBg.setAttribute("fill", "#cccccc");
                prevText.setAttribute("fill", "#999999");
            } else {
                prevBg.setAttribute("fill", "#e0e0e0");
                prevText.setAttribute("fill", "#333333");
            }
            
            if (currentState === 4) {
                nextBg.setAttribute("fill", "#cccccc");
                nextText.setAttribute("fill", "#999999");
            } else {
                nextBg.setAttribute("fill", "#1565c0");
                nextText.setAttribute("fill", "#ffffff");
            }
        }
        
        // 更新步骤标签
        function updateStepLabel() {
            const label = document.getElementById("scene1-label-step");
            label.textContent = STEP_LABELS[currentState];
        }
        
        // 更新高亮框和化合物分子样式
        function updateHighlights() {
            const highlightReact = document.getElementById("scene1-highlight-react");
            const highlightRemainBefore = document.getElementById("scene1-highlight-remain-before");
            const highlightRemainAfter = document.getElementById("scene1-highlight-remain-after");
            
            const molC1 = document.getElementById("scene1-mol-c1-after");
            const molC2 = document.getElementById("scene1-mol-c2-after");
            
            // 步骤1：显示参与反应的高亮框
            if (currentState >= 1) {
                showElement("scene1-highlight-react");
            } else {
                hideElement("scene1-highlight-react");
            }
            
            // 步骤2：化合物分子高亮
            if (currentState >= 2) {
                molC1.querySelectorAll("circle").forEach(c => {
                    c.setAttribute("stroke", "#1565c0");
                    c.setAttribute("stroke-width", "3");
                });
                molC2.querySelectorAll("circle").forEach(c => {
                    c.setAttribute("stroke", "#1565c0");
                    c.setAttribute("stroke-width", "3");
                });
            } else {
                molC1.querySelectorAll("circle").forEach(c => {
                    c.setAttribute("stroke", "#000000");
                    c.setAttribute("stroke-width", "2");
                });
                molC2.querySelectorAll("circle").forEach(c => {
                    c.setAttribute("stroke", "#000000");
                    c.setAttribute("stroke-width", "2");
                });
            }
            
            // 步骤3：显示剩余分子框
            if (currentState >= 3) {
                showElement("scene1-highlight-remain-before");
                showElement("scene1-highlight-remain-after");
            } else {
                hideElement("scene1-highlight-remain-before");
                hideElement("scene1-highlight-remain-after");
            }
        }
        
        // 渲染当前状态
        function renderState() {
            updateButtons();
            updateStepLabel();
            updateHighlights();
        }
        
        // 按钮点击事件
        document.getElementById("scene1-btn-prev-bg").addEventListener("click", function() {
            if (currentState > 0) {
                currentState--;
                renderState();
            }
        });
        
        document.getElementById("scene1-btn-next-bg").addEventListener("click", function() {
            if (currentState < 4) {
                currentState++;
                renderState();
            }
        });
        
        // 初始化
        renderState();
        
    })();
    </script>
</body>
</html>
