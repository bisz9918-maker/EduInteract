<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>溶解度曲线基础</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene1-btn { padding: 8px 20px; font-size: 14px; border: 1px solid #333; border-radius: 4px; background: #f5f5f5; cursor: pointer; }
        .scene1-btn:hover { background: #e0e0e0; }
        .scene1-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene1-step-indicator { font-size: 14px; color: #333; padding: 8px 16px; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500">
            <!-- 坐标轴 -->
            <line id="scene1-axis-y" x1="80" y1="40" x2="80" y2="420" stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrow)"/>
            <line id="scene1-axis-x" x1="80" y1="420" x2="720" y2="420" stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrow)"/>
            
            <!-- 箭头定义 -->
            <defs>
                <marker id="scene1-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#000000"/>
                </marker>
            </defs>
            
            <!-- 溶解度曲线 -->
            <path id="scene1-curve" d="M80,380 Q150,350 200,300 T350,150 T500,60" fill="none" stroke="#000000" stroke-width="2.5"/>
            
            <!-- 刻度线 -->
            <line x1="200" y1="420" x2="200" y2="428" stroke="#000000" stroke-width="2"/>
            <line x1="350" y1="420" x2="350" y2="428" stroke="#000000" stroke-width="2"/>
            <line x1="500" y1="420" x2="500" y2="428" stroke="#000000" stroke-width="2"/>
            <line x1="72" y1="280" x2="80" y2="280" stroke="#000000" stroke-width="2"/>
            <line x1="72" y1="150" x2="80" y2="150" stroke="#000000" stroke-width="2"/>
            
            <!-- 辅助虚线 -->
            <line id="scene1-dash-t1" x1="200" y1="300" x2="200" y2="420" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
            <line id="scene1-dash-a-vertical" x1="350" y1="150" x2="350" y2="420" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
            <line id="scene1-dash-a-horizontal" x1="80" y1="150" x2="350" y2="150" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
            <line id="scene1-dash-m-horizontal" x1="80" y1="280" x2="500" y2="280" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" opacity="0.5"/>
            <line id="scene1-dash-b-vertical" x1="500" y1="280" x2="500" y2="420" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" opacity="0"/>
            
            <!-- 点 A（饱和点） -->
            <circle id="scene1-point-a-glow" cx="350" cy="150" r="10" fill="#1565c0" opacity="0" class="scene1-glow"/>
            <circle id="scene1-point-a" cx="350" cy="150" r="6" fill="#1565c0"/>
            
            <!-- 点 M（不饱和点） -->
            <circle id="scene1-point-m" cx="350" cy="280" r="6" fill="#2e7d32" opacity="0"/>
            
            <!-- 点 B（不饱和点） -->
            <circle id="scene1-point-b" cx="500" cy="280" r="6" fill="#2e7d32" opacity="0"/>
            
            <!-- 轴标签 -->
            <text id="scene1-label-y" x="25" y="230" font-size="14" fill="#000000" text-anchor="middle">溶解度（克）</text>
            <text id="scene1-label-x" x="680" y="455" font-size="14" fill="#000000">温度（℃）</text>
            
            <!-- 刻度标签 -->
            <text id="scene1-label-t1" x="195" y="445" font-size="14" fill="#000000" text-anchor="middle">t₁</text>
            <text id="scene1-label-t2" x="345" y="445" font-size="14" fill="#000000" text-anchor="middle">t₂</text>
            <text id="scene1-label-t3" x="495" y="445" font-size="14" fill="#000000" text-anchor="middle">t₃</text>
            <text id="scene1-label-s1" x="55" y="285" font-size="14" fill="#000000" text-anchor="end">S₁</text>
            <text id="scene1-label-s2" x="55" y="155" font-size="14" fill="#000000" text-anchor="end">S₂</text>
            
            <!-- 点标签 -->
            <text id="scene1-label-a" x="362" y="145" font-size="14" fill="#000000" opacity="0">A</text>
            <text id="scene1-label-m" x="362" y="275" font-size="14" fill="#000000" opacity="0">M</text>
            <text id="scene1-label-b" x="512" y="290" font-size="14" fill="#000000" opacity="0">B</text>
            
            <!-- 说明文本框 -->
            <rect id="scene1-info-bg" x="580" y="60" width="200" height="120" fill="#ffffff" stroke="#cccccc" stroke-width="1" rx="4"/>
            <text id="scene1-info-text" x="590" y="85" font-size="13" fill="#000000" style="white-space: pre-wrap;">溶解度曲线表示某物质在不同温度下的溶解度</text>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator" class="scene1-step-indicator">步骤 1/5</span>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现 - 溶解度曲线基础
        
        const currentStep = { value: 0 };
        const totalSteps = 5;
        
        // 说明文本内容
        const stepTexts = [
            "溶解度曲线表示某物质在不同温度下的溶解度",
            "A 点在曲线上，表示 t₂℃时该物质的饱和溶液，溶解度为 S₂克",
            "M 点在曲线下方，表示 t₂℃时该物质的不饱和溶液，溶质质量为 S₁克（S₁<S₂）",
            "B 点也在曲线下方，表示 t₃℃时的不饱和溶液。M、B 两点溶质质量相同（均为 S₁克），但温度不同",
            "溶质质量分数 = 溶质质量 / (溶质质量 + 溶剂质量) × 100% = S / (S + 100) × 100%"
        ];
        
        // 获取元素
        const pointA = document.getElementById('scene1-point-a');
        const pointAGlow = document.getElementById('scene1-point-a-glow');
        const pointM = document.getElementById('scene1-point-m');
        const pointB = document.getElementById('scene1-point-b');
        const labelA = document.getElementById('scene1-label-a');
        const labelM = document.getElementById('scene1-label-m');
        const labelB = document.getElementById('scene1-label-b');
        const dashMHorizontal = document.getElementById('scene1-dash-m-horizontal');
        const dashBVertical = document.getElementById('scene1-dash-b-vertical');
        const infoText = document.getElementById('scene1-info-text');
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        
        // 更新场景状态
        function updateScene(step) {
            // 重置所有元素状态
            pointAGlow.setAttribute('opacity', '0');
            labelA.setAttribute('opacity', '0');
            pointM.setAttribute('opacity', '0');
            labelM.setAttribute('opacity', '0');
            pointB.setAttribute('opacity', '0');
            labelB.setAttribute('opacity', '0');
            dashMHorizontal.setAttribute('opacity', '0.5');
            dashBVertical.setAttribute('opacity', '0');
            
            // 根据步骤设置状态
            switch(step) {
                case 0:
                    // 初始状态：只显示坐标系和曲线
                    infoText.textContent = stepTexts[0];
                    break;
                case 1:
                    // 高亮 A 点
                    pointAGlow.setAttribute('opacity', '0.3');
                    labelA.setAttribute('opacity', '1');
                    infoText.textContent = stepTexts[1];
                    break;
                case 2:
                    // 显示 M 点
                    pointAGlow.setAttribute('opacity', '0');
                    labelA.setAttribute('opacity', '1');
                    pointM.setAttribute('opacity', '1');
                    labelM.setAttribute('opacity', '1');
                    dashMHorizontal.setAttribute('opacity', '1');
                    infoText.textContent = stepTexts[2];
                    break;
                case 3:
                    // 显示 B 点
                    pointM.setAttribute('opacity', '1');
                    labelM.setAttribute('opacity', '1');
                    pointB.setAttribute('opacity', '1');
                    labelB.setAttribute('opacity', '1');
                    dashBVertical.setAttribute('opacity', '1');
                    infoText.textContent = stepTexts[3];
                    break;
                case 4:
                    // 显示公式，再次高亮 A 点
                    pointAGlow.setAttribute('opacity', '0.3');
                    pointM.setAttribute('opacity', '1');
                    pointB.setAttribute('opacity', '1');
                    labelA.setAttribute('opacity', '1');
                    labelM.setAttribute('opacity', '1');
                    labelB.setAttribute('opacity', '1');
                    dashBVertical.setAttribute('opacity', '1');
                    infoText.textContent = stepTexts[4];
                    break;
            }
            
            // 更新按钮状态
            btnPrev.disabled = (step === 0);
            btnNext.disabled = (step === totalSteps - 1);
            stepIndicator.textContent = `步骤 ${step + 1}/${totalSteps}`;
        }
        
        // 按钮事件绑定
        btnPrev.addEventListener('click', function() {
            if (currentStep.value > 0) {
                currentStep.value--;
                updateScene(currentStep.value);
            }
        });
        
        btnNext.addEventListener('click', function() {
            if (currentStep.value < totalSteps - 1) {
                currentStep.value++;
                updateScene(currentStep.value);
            }
        });
        
        // 初始化
        updateScene(0);
    })();
    </script>
</body>
</html>
