<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>溶解度曲线 - M 点转化为饱和溶液的三种方法</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene3-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene3-svg {
            width: 800px;
            height: 500px;
        }
        #scene3-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 12px;
            z-index: 10;
        }
        .scene3-btn {
            padding: 8px 20px;
            font-size: 14px;
            cursor: pointer;
            border: 2px solid #1565c0;
            background: #ffffff;
            color: #1565c0;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .scene3-btn:hover {
            background: #1565c0;
            color: #ffffff;
        }
        .scene3-btn.active {
            background: #1565c0;
            color: #ffffff;
        }
        .scene3-hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg id="scene3-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene3-arrow-y" markerWidth="10" markerHeight="15" refX="5" refY="7.5" orient="auto">
                    <path d="M0,0 L10,7.5 L0,15 Z" fill="#000000"/>
                </marker>
                <marker id="scene3-arrow-x" markerWidth="15" markerHeight="10" refX="7.5" refY="5" orient="auto">
                    <path d="M0,0 L15,5 L0,10 Z" fill="#000000"/>
                </marker>
                <marker id="scene3-arrow-blue" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
                    <path d="M0,0 L10,5 L0,10 Z" fill="#1565c0"/>
                </marker>
                <marker id="scene3-arrow-red" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
                    <path d="M0,0 L10,5 L0,10 Z" fill="#c62828"/>
                </marker>
            </defs>

            <!-- 坐标轴 -->
            <!-- 纵轴：(80,60)-(80,420) -->
            <line id="scene3-y-axis" x1="80" y1="60" x2="80" y2="420" stroke="#000000" stroke-width="2"/>
            <!-- 横轴：(80,420)-(750,420) -->
            <line id="scene3-x-axis" x1="80" y1="420" x2="750" y2="420" stroke="#000000" stroke-width="2"/>
            
            <!-- 坐标轴箭头 -->
            <line id="scene3-y-arrow" x1="80" y1="60" x2="80" y2="60" stroke="#000000" stroke-width="2" marker-end="url(#scene3-arrow-y)"/>
            <line id="scene3-x-arrow" x1="750" y1="420" x2="750" y2="420" stroke="#000000" stroke-width="2" marker-end="url(#scene3-arrow-x)"/>

            <!-- 溶解度曲线：从 (120,380) 经 (303,240)、(471,132) 到 (600,80) -->
            <path id="scene3-curve" d="M120,380 C200,320 260,260 303,240 C350,215 420,165 471,132 C510,107 555,90 600,80" 
                  fill="none" stroke="#000000" stroke-width="2.5"/>

            <!-- 刻度线 -->
            <!-- t₁刻度：(303,420)-(303,428) -->
            <line id="scene3-t1-tick" x1="303" y1="420" x2="303" y2="428" stroke="#000000" stroke-width="2"/>
            <!-- t₂刻度：(471,420)-(471,428) -->
            <line id="scene3-t2-tick" x1="471" y1="420" x2="471" y2="428" stroke="#000000" stroke-width="2"/>
            <!-- t₃刻度：(638,420)-(638,428) -->
            <line id="scene3-t3-tick" x1="638" y1="420" x2="638" y2="428" stroke="#000000" stroke-width="2"/>
            <!-- S₁刻度：(72,240)-(80,240) -->
            <line id="scene3-s1-tick" x1="72" y1="240" x2="80" y2="240" stroke="#000000" stroke-width="2"/>
            <!-- S₂刻度：(72,132)-(80,132) -->
            <line id="scene3-s2-tick" x1="72" y1="132" x2="80" y2="132" stroke="#000000" stroke-width="2"/>

            <!-- 刻度标签 -->
            <text id="scene3-t1-label" x="303" y="445" text-anchor="middle" font-size="14" fill="#000000">t₁</text>
            <text id="scene3-t2-label" x="471" y="445" text-anchor="middle" font-size="14" fill="#000000">t₂</text>
            <text id="scene3-t3-label" x="638" y="445" text-anchor="middle" font-size="14" fill="#000000">t₃</text>
            <text id="scene3-s1-label" x="55" y="245" text-anchor="end" font-size="14" fill="#000000">S₁</text>
            <text id="scene3-s2-label" x="55" y="137" text-anchor="end" font-size="14" fill="#000000">S₂</text>

            <!-- 坐标轴标题 -->
            <text id="scene3-y-title" x="35" y="240" text-anchor="middle" font-size="16" fill="#000000" transform="rotate(-90,35,240)">溶解度(克)</text>
            <text id="scene3-x-title" x="700" y="445" text-anchor="middle" font-size="14" fill="#000000">温度(℃)</text>

            <!-- 辅助虚线 -->
            <!-- A 点虚线-横：(80,132)-(471,132) -->
            <line id="scene3-a-dash-h" x1="80" y1="132" x2="471" y2="132" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
            <!-- A 点虚线-纵：(471,132)-(471,420) -->
            <line id="scene3-a-dash-v" x1="471" y1="132" x2="471" y2="420" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
            <!-- M 点虚线-横：(80,240)-(471,240) -->
            <line id="scene3-m-dash-h" x1="80" y1="240" x2="471" y2="240" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>

            <!-- A 点：(471,132) 饱和点 -->
            <circle id="scene3-point-a" cx="471" cy="132" r="5" fill="#000000"/>
            <text id="scene3-label-a" x="485" y="125" font-size="14" fill="#000000">A</text>

            <!-- M 点：(471,240) 初始不饱和点（绿色） -->
            <circle id="scene3-point-m" cx="471" cy="240" r="6" fill="#2e7d32"/>
            <text id="scene3-label-m" x="485" y="245" font-size="14" fill="#2e7d32">M</text>

            <!-- 方法一：降温 -->
            <g id="scene3-method1" class="scene3-hidden">
                <!-- 方法一箭头：从 M(471,240) 水平向左至 (303,240) -->
                <line id="scene3-path-method1" x1="471" y1="240" x2="303" y2="240" stroke="#1565c0" stroke-width="3" marker-end="url(#scene3-arrow-blue)"/>
                <!-- 方法一终点 -->
                <circle id="scene3-method1-endpoint" cx="303" cy="240" r="5" fill="#1565c0"/>
                <!-- 方法一标注 -->
                <text id="scene3-method1-label" x="387" y="220" text-anchor="middle" font-size="14" fill="#1565c0">降温至 t₁℃</text>
            </g>

            <!-- 方法二：加溶质 -->
            <g id="scene3-method2" class="scene3-hidden">
                <!-- 方法二箭头：从 M(471,240) 垂直向上至 A(471,132) -->
                <line id="scene3-path-method2" x1="471" y1="240" x2="471" y2="132" stroke="#1565c0" stroke-width="3" marker-end="url(#scene3-arrow-blue)"/>
                <!-- 方法二标注 -->
                <text id="scene3-method2-label" x="485" y="180" font-size="14" fill="#1565c0">加溶质(S₂-S₁)g</text>
            </g>

            <!-- 方法三：蒸发溶剂 -->
            <g id="scene3-method3" class="scene3-hidden">
                <!-- 方法三箭头：从 M(471,240) 斜向左上至曲线 (约 380,200) -->
                <path id="scene3-path-method3" d="M471,240 Q430,220 390,200" fill="none" stroke="#c62828" stroke-width="3" marker-end="url(#scene3-arrow-red)"/>
                <!-- 方法三终点 -->
                <circle id="scene3-method3-endpoint" cx="390" cy="200" r="5" fill="#c62828"/>
                <!-- 方法三标注 -->
                <text id="scene3-method3-label" x="420" y="260" text-anchor="middle" font-size="14" fill="#c62828">蒸发溶剂</text>
            </g>
        </svg>

        <!-- 控件栏 -->
        <div id="scene3-controls">
            <button id="scene3-btn-cooling" class="scene3-btn" onclick="scene3SetState(1)">降温</button>
            <button id="scene3-btn-addsolute" class="scene3-btn" onclick="scene3SetState(2)">加溶质</button>
            <button id="scene3-btn-evaporate" class="scene3-btn" onclick="scene3SetState(3)">蒸发溶剂</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 3: M 点不饱和溶液转化为饱和溶液的三种方法对比
        
        // 布局坐标表（实现对照依据）：
        // | 元素 | 类型 | 位置/范围 | 备注 |
        // |------|------|-----------|------|
        // | 纵轴 | 线段 | (80,60)-(80,420) | 溶解度轴 |
        // | 横轴 | 线段 | (80,420)-(750,420) | 温度轴 |
        // | 溶解度曲线 | 路径 | (120,380)→(600,80) | 黑色实线 |
        // | t₁刻度 | 线段 | (303,420)-(303,428) | 横轴刻度 |
        // | t₂刻度 | 线段 | (471,420)-(471,428) | 横轴刻度 |
        // | t₃刻度 | 线段 | (638,420)-(638,428) | 横轴刻度 |
        // | S₁刻度 | 线段 | (72,240)-(80,240) | 纵轴刻度 |
        // | S₂刻度 | 线段 | (72,132)-(80,132) | 纵轴刻度 |
        // | A 点 | 圆点 | (471,132) | 曲线上的饱和点 |
        // | M 点 | 圆点 | (471,240) | 初始不饱和点，绿色 |
        // | 方法一箭头 | 箭头路径 | (471,240)→(303,240) | 蓝色，水平向左 |
        // | 方法二箭头 | 箭头路径 | (471,240)→(471,132) | 蓝色，垂直向上 |
        // | 方法三箭头 | 箭头路径 | (471,240)→(390,200) | 橙红色，斜向左上 |
        // | 按钮 1 | rect | (180,455) | "降温"按钮 |
        // | 按钮 2 | rect | (350,455) | "加溶质"按钮 |
        // | 按钮 3 | rect | (520,455) | "蒸发溶剂"按钮 |

        let currentState = 0; // 0=初始，1=降温，2=加溶质，3=蒸发溶剂

        // 显示/隐藏元素工具函数
        function showElement(el) {
            if (el) {
                el.classList.remove('scene3-hidden');
                el.style.display = '';
                el.style.opacity = '1';
            }
        }

        function hideElement(el) {
            if (el) {
                el.classList.add('scene3-hidden');
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }

        // 设置状态
        window.scene3SetState = function(state) {
            currentState = state;

            // 更新按钮激活状态
            var btnCooling = document.getElementById('scene3-btn-cooling');
            var btnAddSolute = document.getElementById('scene3-btn-addsolute');
            var btnEvaporate = document.getElementById('scene3-btn-evaporate');

            // 重置所有按钮
            btnCooling.classList.remove('active');
            btnAddSolute.classList.remove('active');
            btnEvaporate.classList.remove('active');

            // 隐藏所有方法
            var method1 = document.getElementById('scene3-method1');
            var method2 = document.getElementById('scene3-method2');
            var method3 = document.getElementById('scene3-method3');

            hideElement(method1);
            hideElement(method2);
            hideElement(method3);

            // 根据状态显示对应方法
            if (state === 1) {
                btnCooling.classList.add('active');
                showElement(method1);
            } else if (state === 2) {
                btnAddSolute.classList.add('active');
                showElement(method2);
            } else if (state === 3) {
                btnEvaporate.classList.add('active');
                showElement(method3);
            }
        };

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 初始状态：所有方法隐藏，按钮无激活
            currentState = 0;
        });
    })();
    </script>
</body>
</html>
