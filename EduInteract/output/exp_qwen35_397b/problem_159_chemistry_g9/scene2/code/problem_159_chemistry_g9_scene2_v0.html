<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高温煅烧碳酸钙反应过程</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene2-btn-prev, #scene2-btn-next { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #333; border-radius: 4px; background: #f5f5f5; }
        #scene2-btn-prev:hover, #scene2-btn-next:hover { background: #e0e0e0; }
        #scene2-btn-prev:disabled, #scene2-btn-next:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene2-step-indicator { font-size: 14px; color: #666; min-width: 80px; text-align: center; }
        .hidden { display: none !important; opacity: 0 !important; }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 顶部说明栏 -->
            <rect id="scene2-topbar" x="20" y="20" width="760" height="35" fill="#f5f5f5" rx="4"/>
            <text id="scene2-topbar-text" x="400" y="42" text-anchor="middle" font-size="16" fill="#333">高温煅烧碳酸钙反应过程</text>

            <!-- 左侧背景框：反应装置区 -->
            <rect id="scene2-left-bg" x="20" y="70" width="320" height="350" fill="#fafafa" stroke="#ddd" stroke-width="1"/>

            <!-- 右侧背景框：坐标图区 -->
            <rect id="scene2-right-bg" x="360" y="70" width="420" height="350" fill="#ffffff" stroke="#ddd" stroke-width="1"/>

            <!-- 左侧：试管（倾斜约15度） -->
            <g id="scene2-test-tube" transform="translate(100, 150) rotate(-15)">
                <!-- 试管主体 -->
                <path d="M 0,0 L 0,120 Q 0,140 20,140 L 60,140 Q 80,140 80,120 L 80,0" fill="none" stroke="#666666" stroke-width="2"/>
                <!-- 试管口 -->
                <line x1="0" y1="0" x2="80" y2="0" stroke="#666666" stroke-width="2"/>
                <!-- 固体药品 CaCO₃ -->
                <rect id="scene2-solid" x="10" y="105" width="60" height="30" fill="#e0e0e0" stroke="#999" stroke-width="1"/>
            </g>

            <!-- 酒精灯 -->
            <g id="scene2-alcohol-lamp">
                <!-- 灯身 -->
                <path d="M 85,320 L 115,320 L 110,360 L 90,360 Z" fill="#8d6e63" stroke="#5d4037" stroke-width="1"/>
                <!-- 灯芯 -->
                <rect x="95" y="310" width="10" height="10" fill="#5d4037"/>
                <!-- 火焰 -->
                <path id="scene2-flame" d="M 95,310 Q 100,290 105,310 Q 100,300 95,310" fill="#ff9800" stroke="#ffc107" stroke-width="1"/>
            </g>

            <!-- CO₂分子（动画用） -->
            <circle id="scene2-co2-1" cx="110" cy="200" r="6" fill="#666666" opacity="0"/>
            <circle id="scene2-co2-2" cx="125" cy="180" r="6" fill="#666666" opacity="0"/>
            <circle id="scene2-co2-3" cx="95" cy="160" r="6" fill="#666666" opacity="0"/>

            <!-- 左侧标签 -->
            <text id="scene2-label-caco3" x="150" y="260" font-size="14" fill="#333">CaCO₃</text>
            <text id="scene2-label-cao" x="150" y="260" font-size="14" fill="#2e7d32" class="hidden">CaO</text>

            <!-- 右侧：坐标轴 -->
            <!-- Y轴 -->
            <line id="scene2-axis-y" x1="380" y1="380" x2="380" y2="100" stroke="#000000" stroke-width="2"/>
            <!-- X轴 -->
            <line id="scene2-axis-x" x1="380" y1="380" x2="760" y2="380" stroke="#000000" stroke-width="2"/>

            <!-- 坐标轴标签 -->
            <text id="scene2-label-origin" x="370" y="395" font-size="12" fill="#333">0</text>
            <text id="scene2-label-y" x="330" y="240" font-size="14" fill="#333" text-anchor="middle">固体质量(g)</text>
            <text id="scene2-label-x" x="570" y="405" font-size="14" fill="#333" text-anchor="middle">时间</text>

            <!-- 质量曲线（三阶段） -->
            <!-- 阶段一：水平段 (380,150) 到 (520,150) -->
            <path id="scene2-curve-phase1" d="M 380,150 L 520,150" fill="none" stroke="#000000" stroke-width="3"/>
            <!-- 阶段二：下降段 (520,150) 到 (640,320) -->
            <path id="scene2-curve-phase2" d="M 520,150 L 640,320" fill="none" stroke="#000000" stroke-width="3"/>
            <!-- 阶段三：水平段 (640,320) 到 (760,320) -->
            <path id="scene2-curve-phase3" d="M 640,320 L 760,320" fill="none" stroke="#000000" stroke-width="3"/>

            <!-- 阶段分界线 -->
            <line id="scene2-divider-1" x1="520" y1="100" x2="520" y2="380" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
            <line id="scene2-divider-2" x1="640" y1="100" x2="640" y2="380" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>

            <!-- 阶段标签 -->
            <text id="scene2-phase-label-1" x="450" y="130" font-size="13" fill="#1565c0" class="hidden">阶段一</text>
            <text id="scene2-phase-label-2" x="580" y="240" font-size="13" fill="#1565c0" class="hidden">阶段二</text>
            <text id="scene2-phase-label-3" x="700" y="340" font-size="13" fill="#1565c0" class="hidden">阶段三</text>

            <!-- 终点标记 -->
            <circle id="scene2-end-point" cx="760" cy="320" r="5" fill="#2e7d32" opacity="0"/>

            <!-- 化学方程式 -->
            <text id="scene2-label-equation" x="570" y="445" font-size="14" fill="#333" text-anchor="middle" class="hidden">CaCO₃ → CaO + CO₂↑</text>

            <!-- 控件栏（放在 SVG 内部底部） -->
            <g id="scene2-controls">
                <rect id="scene2-btn-prev-bg" x="280" y="450" width="100" height="30" fill="#f5f5f5" stroke="#333" stroke-width="1" rx="4"/>
                <text id="scene2-btn-prev-text" x="330" y="470" text-anchor="middle" font-size="14" fill="#333">◀ 上一步</text>
                <rect id="scene2-btn-next-bg" x="420" y="450" width="100" height="30" fill="#f5f5f5" stroke="#333" stroke-width="1" rx="4"/>
                <text id="scene2-btn-next-text" x="470" y="470" text-anchor="middle" font-size="14" fill="#333">下一步 ▶</text>
                <text id="scene2-step-indicator" x="400" y="470" text-anchor="middle" font-size="14" fill="#666">步骤 0/4</text>
            </g>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 2: 高温煅烧碳酸钙反应过程
        let currentState = 0;
        const totalSteps = 4;

        // 工具函数：显示/隐藏元素
        function show(el) {
            if (el) {
                el.classList.remove('hidden');
                el.style.display = '';
                el.style.opacity = '1';
            }
        }
        function hide(el) {
            if (el) {
                el.classList.add('hidden');
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }

        // 获取元素
        const topbarText = document.getElementById('scene2-topbar-text');
        const solid = document.getElementById('scene2-solid');
        const labelCaCO3 = document.getElementById('scene2-label-caco3');
        const labelCaO = document.getElementById('scene2-label-cao');
        const co2_1 = document.getElementById('scene2-co2-1');
        const co2_2 = document.getElementById('scene2-co2-2');
        const co2_3 = document.getElementById('scene2-co2-3');
        const curvePhase1 = document.getElementById('scene2-curve-phase1');
        const curvePhase2 = document.getElementById('scene2-curve-phase2');
        const curvePhase3 = document.getElementById('scene2-curve-phase3');
        const divider1 = document.getElementById('scene2-divider-1');
        const divider2 = document.getElementById('scene2-divider-2');
        const phaseLabel1 = document.getElementById('scene2-phase-label-1');
        const phaseLabel2 = document.getElementById('scene2-phase-label-2');
        const phaseLabel3 = document.getElementById('scene2-phase-label-3');
        const endPoint = document.getElementById('scene2-end-point');
        const equation = document.getElementById('scene2-label-equation');
        const btnPrevBg = document.getElementById('scene2-btn-prev-bg');
        const btnPrevText = document.getElementById('scene2-btn-prev-text');
        const btnNextBg = document.getElementById('scene2-btn-next-bg');
        const btnNextText = document.getElementById('scene2-btn-next-text');
        const stepIndicator = document.getElementById('scene2-step-indicator');

        // 重置所有高亮
        function resetHighlights() {
            curvePhase1.setAttribute('stroke', '#000000');
            curvePhase1.setAttribute('stroke-width', '3');
            curvePhase2.setAttribute('stroke', '#000000');
            curvePhase2.setAttribute('stroke-width', '3');
            curvePhase3.setAttribute('stroke', '#000000');
            curvePhase3.setAttribute('stroke-width', '3');
            divider1.setAttribute('stroke', '#888888');
            divider1.setAttribute('stroke-width', '1');
            divider2.setAttribute('stroke', '#888888');
            divider2.setAttribute('stroke-width', '1');
            solid.setAttribute('fill', '#e0e0e0');
            hide(phaseLabel1);
            hide(phaseLabel2);
            hide(phaseLabel3);
            hide(endPoint);
            hide(equation);
            co2_1.setAttribute('opacity', '0');
            co2_2.setAttribute('opacity', '0');
            co2_3.setAttribute('opacity', '0');
        }

        // 更新状态
        function updateState(step) {
            resetHighlights();

            switch(step) {
                case 0:
                    // 初始状态
                    topbarText.textContent = '高温煅烧碳酸钙反应过程';
                    show(labelCaCO3);
                    hide(labelCaO);
                    break;

                case 1:
                    // 阶段一：加热初期
                    topbarText.textContent = '阶段一：加热初期，温度未达分解温度';
                    show(labelCaCO3);
                    hide(labelCaO);
                    curvePhase1.setAttribute('stroke', '#1565c0');
                    curvePhase1.setAttribute('stroke-width', '4');
                    divider1.setAttribute('stroke', '#1565c0');
                    divider1.setAttribute('stroke-width', '2');
                    show(phaseLabel1);
                    break;

                case 2:
                    // 阶段二：分解反应
                    topbarText.textContent = '阶段二：达到分解温度，CaCO₃分解，CO₂逸出';
                    hide(labelCaCO3);
                    hide(labelCaO);
                    curvePhase2.setAttribute('stroke', '#1565c0');
                    curvePhase2.setAttribute('stroke-width', '4');
                    divider1.setAttribute('stroke', '#1565c0');
                    divider1.setAttribute('stroke-width', '2');
                    divider2.setAttribute('stroke', '#1565c0');
                    divider2.setAttribute('stroke-width', '2');
                    show(phaseLabel2);
                    // 启动 CO₂动画
                    co2_1.setAttribute('opacity', '1');
                    co2_2.setAttribute('opacity', '1');
                    co2_3.setAttribute('opacity', '1');
                    // 化学方程式部分显示
                    equation.textContent = 'CaCO₃ → ...';
                    show(equation);
                    break;

                case 3:
                    // 阶段三：完全分解
                    topbarText.textContent = '阶段三：完全分解，剩余 CaO，质量恒定';
                    hide(labelCaCO3);
                    show(labelCaO);
                    solid.setAttribute('fill', '#c8e6c9');
                    curvePhase3.setAttribute('stroke', '#1565c0');
                    curvePhase3.setAttribute('stroke-width', '4');
                    divider2.setAttribute('stroke', '#1565c0');
                    divider2.setAttribute('stroke-width', '2');
                    show(phaseLabel3);
                    show(endPoint);
                    equation.textContent = 'CaCO₃ → CaO + CO₂↑';
                    show(equation);
                    break;

                case 4:
                    // 总结
                    topbarText.textContent = '反应总结：CaCO₃ 高温分解为 CaO 和 CO₂';
                    hide(labelCaCO3);
                    show(labelCaO);
                    solid.setAttribute('fill', '#c8e6c9');
                    curvePhase1.setAttribute('stroke', '#1565c0');
                    curvePhase1.setAttribute('stroke-width', '4');
                    curvePhase2.setAttribute('stroke', '#1565c0');
                    curvePhase2.setAttribute('stroke-width', '4');
                    curvePhase3.setAttribute('stroke', '#1565c0');
                    curvePhase3.setAttribute('stroke-width', '4');
                    show(phaseLabel1);
                    show(phaseLabel2);
                    show(phaseLabel3);
                    show(endPoint);
                    equation.textContent = 'CaCO₃ → CaO + CO₂↑';
                    equation.setAttribute('fill', '#2e7d32');
                    show(equation);
                    break;
            }

            // 更新按钮状态
            if (step === 0) {
                btnPrevBg.setAttribute('fill', '#e0e0e0');
                btnPrevText.setAttribute('fill', '#999');
            } else {
                btnPrevBg.setAttribute('fill', '#f5f5f5');
                btnPrevText.setAttribute('fill', '#333');
            }

            if (step >= totalSteps) {
                btnNextBg.setAttribute('fill', '#e0e0e0');
                btnNextText.setAttribute('fill', '#999');
            } else {
                btnNextBg.setAttribute('fill', '#f5f5f5');
                btnNextText.setAttribute('fill', '#333');
            }

            stepIndicator.textContent = '步骤 ' + step + '/' + totalSteps;
        }

        // 按钮点击事件
        btnPrevBg.addEventListener('click', function() {
            if (currentState > 0) {
                currentState--;
                updateState(currentState);
            }
        });

        btnNextBg.addEventListener('click', function() {
            if (currentState < totalSteps) {
                currentState++;
                updateState(currentState);
            }
        });

        // 添加按钮 hover 效果
        btnPrevBg.addEventListener('mouseenter', function() {
            if (currentState > 0) btnPrevBg.setAttribute('fill', '#e0e0e0');
        });
        btnPrevBg.addEventListener('mouseleave', function() {
            if (currentState > 0) btnPrevBg.setAttribute('fill', '#f5f5f5');
            else btnPrevBg.setAttribute('fill', '#e0e0e0');
        });

        btnNextBg.addEventListener('mouseenter', function() {
            if (currentState < totalSteps) btnNextBg.setAttribute('fill', '#e0e0e0');
        });
        btnNextBg.addEventListener('mouseleave', function() {
            if (currentState < totalSteps) btnNextBg.setAttribute('fill', '#f5f5f5');
            else btnNextBg.setAttribute('fill', '#e0e0e0');
        });

        // CO₂分子动画（阶段二）
        let animationId = null;
        function animateCO2() {
            const time = Date.now() / 1000;
            const y1 = 200 - Math.sin(time * 2) * 30;
            const y2 = 180 - Math.sin(time * 2 + 1) * 30;
            const y3 = 160 - Math.sin(time * 2 + 2) * 30;
            co2_1.setAttribute('cy', y1);
            co2_2.setAttribute('cy', y2);
            co2_3.setAttribute('cy', y3);
            animationId = requestAnimationFrame(animateCO2);
        }

        // 监听状态变化启动/停止动画
        const originalUpdateState = updateState;
        updateState = function(step) {
            originalUpdateState(step);
            if (step === 2 && !animationId) {
                animateCO2();
            } else if (step !== 2 && animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
                // 重置位置
                co2_1.setAttribute('cy', '200');
                co2_2.setAttribute('cy', '180');
                co2_3.setAttribute('cy', '160');
            }
        };

        // 初始化
        updateState(0);
    })();
    </script>
</body>
</html>
