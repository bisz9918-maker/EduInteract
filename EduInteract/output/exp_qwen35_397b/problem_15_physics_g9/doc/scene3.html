<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>摩擦力与接触面积、速度无关 - 场景3</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', sans-serif;
        }
        #scene3-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene3-svg {
            width: 800px;
            height: 500px;
        }
        /* 木块样式 */
        .block {
            fill: #e3f2fd;
            stroke: #1565c0;
            stroke-width: 2px;
            transition: stroke 0.3s ease, stroke-width 0.3s ease;
        }
        .block.highlight-contact {
            stroke: #c62828;
            stroke-width: 4px;
        }
        /* 地面线样式 */
        .ground {
            stroke: #000000;
            stroke-width: 3px;
            fill: none;
            transition: stroke 0.3s ease, stroke-width 0.3s ease;
        }
        .ground.highlight-force {
            stroke: #2e7d32;
            stroke-width: 5px;
        }
        /* 箭头样式 */
        .arrow-force {
            stroke: #1565c0;
            stroke-width: 4px;
            fill: none;
            marker-end: url(#scene3-arrowhead-force);
            transition: stroke 0.3s ease, stroke-width 0.3s ease;
        }
        .arrow-force.highlight-force {
            stroke: #c62828;
            stroke-width: 5px;
        }
        .arrow-velocity {
            stroke: #2e7d32;
            stroke-width: 3px;
            fill: none;
            marker-end: url(#scene3-arrowhead-velocity);
            transition: stroke 0.3s ease, stroke-width 0.3s ease;
        }
        .arrow-velocity.highlight-velocity {
            stroke: #c62828;
            stroke-width: 5px;
        }
        /* 表格样式 */
        .table-row {
            transition: fill 0.3s ease;
        }
        .table-row.highlight-1 {
            fill: #fff3e0;
        }
        .table-row.highlight-2 {
            fill: #fff3e0;
        }
        .table-row.highlight-3 {
            fill: #e8f5e9;
        }
        .table-row.highlight-4 {
            fill: #e8f5e9;
        }
        /* 结论框样式 */
        .conclusion-box {
            fill: #ffffff;
            stroke: #999999;
            stroke-width: 2px;
            transition: stroke 0.3s ease, stroke-width 0.3s ease, fill 0.3s ease;
        }
        .conclusion-box.active {
            stroke: #1565c0;
            stroke-width: 3px;
            fill: #e3f2fd;
        }
        /* 按钮样式 */
        .scene3-btn {
            font-size: 13px;
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background: #e0e0e0;
            color: #333333;
            transition: background 0.3s ease, color 0.3s ease;
        }
        .scene3-btn:hover {
            background: #bdbdbd;
        }
        .scene3-btn.active {
            background: #1565c0;
            color: #ffffff;
        }
        /* 标记样式 */
        .mark-same {
            fill: #2e7d32;
            font-weight: bold;
        }
        .mark-different {
            fill: #c62828;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg id="scene3-svg" width="800" height="500">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene3-arrowhead-force" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#1565c0" />
                </marker>
                <marker id="scene3-arrowhead-velocity" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#2e7d32" />
                </marker>
            </defs>

            <!-- ========== 图甲（左侧） ========== -->
            <!-- 地面线 -->
            <line id="scene3-ground-a" class="ground" x1="50" y1="280" x2="250" y2="280" />
            <!-- 地面阴影线 -->
            <g id="scene3-ground-hatch-a">
                <line x1="50" y1="280" x2="45" y2="285" stroke="#666" stroke-width="1"/>
                <line x1="60" y1="280" x2="55" y2="285" stroke="#666" stroke-width="1"/>
                <line x1="70" y1="280" x2="65" y2="285" stroke="#666" stroke-width="1"/>
                <line x1="80" y1="280" x2="75" y2="285" stroke="#666" stroke-width="1"/>
                <line x1="90" y1="280" x2="85" y2="285" stroke="#666" stroke-width="1"/>
                <line x1="100" y1="280" x2="95" y2="285" stroke="#666" stroke-width="1"/>
                <line x1="110" y1="280" x2="105" y2="285" stroke="#666" stroke-width="1"/>
                <line x1="120" y1="280" x2="115" y2="285" stroke="#666" stroke-width="1"/>
                <line x1="130" y1="280" x2="125" y2="285" stroke="#666" stroke-width="1"/>
                <line x1="140" y1="280" x2="135" y2="285" stroke="#666" stroke-width="1"/>
                <line x1="150" y1="280" x2="145" y2="285" stroke="#666" stroke-width="1"/>
                <line x1="160" y1="280" x2="155" y2="285" stroke="#666" stroke-width="1"/>
                <line x1="170" y1="280" x2="165" y2="285" stroke="#666" stroke-width="1"/>
                <line x1="180" y1="280" x2="175" y2="285" stroke="#666" stroke-width="1"/>
                <line x1="190" y1="280" x2="185" y2="285" stroke="#666" stroke-width="1"/>
                <line x1="200" y1="280" x2="195" y2="285" stroke="#666" stroke-width="1"/>
                <line x1="210" y1="280" x2="205" y2="285" stroke="#666" stroke-width="1"/>
                <line x1="220" y1="280" x2="215" y2="285" stroke="#666" stroke-width="1"/>
                <line x1="230" y1="280" x2="225" y2="285" stroke="#666" stroke-width="1"/>
                <line x1="240" y1="280" x2="235" y2="285" stroke="#666" stroke-width="1"/>
                <line x1="250" y1="280" x2="245" y2="285" stroke="#666" stroke-width="1"/>
            </g>
            <!-- 木块 A（下方） -->
            <rect id="scene3-block-a-a" class="block" x="100" y="230" width="100" height="50" />
            <!-- 木块 B（上方） -->
            <rect id="scene3-block-b-a" class="block" x="100" y="180" width="100" height="50" />
            <!-- F₁ 推力箭头 -->
            <line id="scene3-f1-arrow" class="arrow-force" x1="40" y1="255" x2="100" y2="255" />
            <!-- V₁ 速度箭头 -->
            <line id="scene3-v1-arrow" class="arrow-velocity" x1="100" y1="150" x2="200" y2="150" />
            <!-- 标签 F₁ -->
            <text id="scene3-f1-label" x="70" y="245" font-size="14" fill="#000000" text-anchor="middle">F₁</text>
            <!-- 标签 V₁ -->
            <text id="scene3-v1-label" x="150" y="135" font-size="14" fill="#000000" text-anchor="middle">V₁</text>
            <!-- 图甲标签 -->
            <text id="scene3-label-a" x="150" y="300" font-size="16" fill="#000000" text-anchor="middle" font-weight="bold">图甲</text>

            <!-- ========== 图乙（右侧） ========== -->
            <!-- 地面线 -->
            <line id="scene3-ground-b" class="ground" x1="550" y1="280" x2="750" y2="280" />
            <!-- 地面阴影线 -->
            <g id="scene3-ground-hatch-b">
                <line x1="550" y1="280" x2="545" y2="285" stroke="#666" stroke-width="1"/>
                <line x1="560" y1="280" x2="555" y2="285" stroke="#666" stroke-width="1"/>
                <line x1="570" y1="280" x2="565" y2="285" stroke="#666" stroke-width="1"/>
                <line x1="580" y1="280" x2="575" y2="285" stroke="#666" stroke-width="1"/>
                <line x1="590" y1="280" x2="585" y2="285" stroke="#666" stroke-width="1"/>
                <line x1="600" y1="280" x2="595" y2="285" stroke="#666" stroke-width="1"/>
                <line x1="610" y1="280" x2="605" y2="285" stroke="#666" stroke-width="1"/>
                <line x1="620" y1="280" x2="615" y2="285" stroke="#666" stroke-width="1"/>
                <line x1="630" y1="280" x2="625" y2="285" stroke="#666" stroke-width="1"/>
                <line x1="640" y1="280" x2="635" y2="285" stroke="#666" stroke-width="1"/>
                <line x1="650" y1="280" x2="645" y2="285" stroke="#666" stroke-width="1"/>
                <line x1="660" y1="280" x2="655" y2="285" stroke="#666" stroke-width="1"/>
                <line x1="670" y1="280" x2="665" y2="285" stroke="#666" stroke-width="1"/>
                <line x1="680" y1="280" x2="675" y2="285" stroke="#666" stroke-width="1"/>
                <line x1="690" y1="280" x2="685" y2="285" stroke="#666" stroke-width="1"/>
                <line x1="700" y1="280" x2="695" y2="285" stroke="#666" stroke-width="1"/>
                <line x1="710" y1="280" x2="705" y2="285" stroke="#666" stroke-width="1"/>
                <line x1="720" y1="280" x2="715" y2="285" stroke="#666" stroke-width="1"/>
                <line x1="730" y1="280" x2="725" y2="285" stroke="#666" stroke-width="1"/>
                <line x1="740" y1="280" x2="735" y2="285" stroke="#666" stroke-width="1"/>
                <line x1="750" y1="280" x2="745" y2="285" stroke="#666" stroke-width="1"/>
            </g>
            <!-- 木块 A（左侧） -->
            <rect id="scene3-block-a-b" class="block" x="550" y="230" width="100" height="50" />
            <!-- 木块 B（右侧） -->
            <rect id="scene3-block-b-b" class="block" x="650" y="230" width="100" height="50" />
            <!-- F₂ 推力箭头 -->
            <line id="scene3-f2-arrow" class="arrow-force" x1="490" y1="255" x2="550" y2="255" />
            <!-- V₂ 速度箭头 -->
            <line id="scene3-v2-arrow" class="arrow-velocity" x1="550" y1="150" x2="750" y2="150" />
            <!-- 标签 F₂ -->
            <text id="scene3-f2-label" x="520" y="245" font-size="14" fill="#000000" text-anchor="middle">F₂</text>
            <!-- 标签 V₂ -->
            <text id="scene3-v2-label" x="650" y="135" font-size="14" fill="#000000" text-anchor="middle">V₂</text>
            <!-- 图乙标签 -->
            <text id="scene3-label-b" x="650" y="300" font-size="16" fill="#000000" text-anchor="middle" font-weight="bold">图乙</text>

            <!-- ========== 对比表格 ========== -->
            <!-- 表格背景 -->
            <rect x="150" y="330" width="500" height="100" fill="#ffffff" stroke="#cccccc" stroke-width="1" />
            <!-- 表格行 -->
            <rect id="scene3-table-row1" class="table-row" x="150" y="330" width="500" height="25" />
            <rect id="scene3-table-row2" class="table-row" x="150" y="355" width="500" height="25" />
            <rect id="scene3-table-row3" class="table-row" x="150" y="380" width="500" height="25" />
            <rect id="scene3-table-row4" class="table-row" x="150" y="405" width="500" height="25" />
            <!-- 表格线 -->
            <line x1="150" y1="330" x2="650" y2="330" stroke="#999999" stroke-width="1" />
            <line x1="150" y1="355" x2="650" y2="355" stroke="#999999" stroke-width="1" />
            <line x1="150" y1="380" x2="650" y2="380" stroke="#999999" stroke-width="1" />
            <line x1="150" y1="405" x2="650" y2="405" stroke="#999999" stroke-width="1" />
            <line x1="150" y1="430" x2="650" y2="430" stroke="#999999" stroke-width="1" />
            <line x1="250" y1="330" x2="250" y2="430" stroke="#999999" stroke-width="1" />
            <line x1="350" y1="330" x2="350" y2="430" stroke="#999999" stroke-width="1" />
            <line x1="450" y1="330" x2="450" y2="430" stroke="#999999" stroke-width="1" />
            <line x1="550" y1="330" x2="550" y2="430" stroke="#999999" stroke-width="1" />
            <!-- 表格标题 -->
            <text x="200" y="347" font-size="13" fill="#000000" text-anchor="middle">物理量</text>
            <text x="300" y="347" font-size="13" fill="#000000" text-anchor="middle">图甲</text>
            <text x="400" y="347" font-size="13" fill="#000000" text-anchor="middle">图乙</text>
            <text x="600" y="347" font-size="13" fill="#000000" text-anchor="middle">是否相同</text>
            <!-- 行1：接触面积 -->
            <text x="200" y="372" font-size="13" fill="#000000" text-anchor="middle">接触面积</text>
            <text x="300" y="372" font-size="13" fill="#000000" text-anchor="middle">S</text>
            <text x="400" y="372" font-size="13" fill="#000000" text-anchor="middle">2S</text>
            <text id="scene3-mark1" x="600" y="372" font-size="16" text-anchor="middle" class="mark-different" style="opacity: 0;">✗</text>
            <!-- 行2：速度 v -->
            <text x="200" y="397" font-size="13" fill="#000000" text-anchor="middle">速度 v</text>
            <text x="300" y="397" font-size="13" fill="#000000" text-anchor="middle">1m/s</text>
            <text x="400" y="397" font-size="13" fill="#000000" text-anchor="middle">2m/s</text>
            <text id="scene3-mark2" x="600" y="397" font-size="16" text-anchor="middle" class="mark-different" style="opacity: 0;">✗</text>
            <!-- 行3：正压力 N -->
            <text x="200" y="422" font-size="13" fill="#000000" text-anchor="middle">正压力 N</text>
            <text x="300" y="422" font-size="13" fill="#000000" text-anchor="middle">2G</text>
            <text x="400" y="422" font-size="13" fill="#000000" text-anchor="middle">2G</text>
            <text id="scene3-mark3" x="600" y="422" font-size="16" text-anchor="middle" class="mark-same" style="opacity: 0;">✓</text>
            <!-- 行4：摩擦力 f -->
            <text x="200" y="447" font-size="13" fill="#000000" text-anchor="middle">摩擦力 f</text>
            <text x="300" y="447" font-size="13" fill="#000000" text-anchor="middle">100N</text>
            <text x="400" y="447" font-size="13" fill="#000000" text-anchor="middle">100N</text>
            <text id="scene3-mark4" x="600" y="447" font-size="16" text-anchor="middle" class="mark-same" style="opacity: 0;">✓</text>

            <!-- ========== 结论框 ========== -->
            <rect id="scene3-conclusion-box" class="conclusion-box" x="250" y="445" width="300" height="30" rx="4" />
            <text id="scene3-conclusion-text" x="400" y="466" font-size="16" fill="#666666" text-anchor="middle" font-weight="bold">F₂ = F₁ = 100N</text>

            <!-- ========== 控件按钮 ========== -->
            <foreignObject x="0" y="475" width="800" height="25">
                <div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; justify-content: center; gap: 12px;">
                    <button id="scene3-btn1" class="scene3-btn" onclick="scene3SetState(1)">对比接触面积</button>
                    <button id="scene3-btn2" class="scene3-btn" onclick="scene3SetState(2)">对比速度</button>
                    <button id="scene3-btn3" class="scene3-btn" onclick="scene3SetState(3)">对比正压力和摩擦力</button>
                </div>
            </foreignObject>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 3 实现 - 摩擦力与接触面积、速度无关

        let currentState = 0;

        // 状态切换函数
        window.scene3SetState = function(state) {
            currentState = state;
            renderState3(state);
        };

        // 渲染状态
        function renderState3(state) {
            // 重置所有高亮
            resetHighlights3();

            if (state === 0) {
                // 初始状态 - 无高亮
                return;
            }

            if (state === 1) {
                // 状态1：对比接触面积
                document.getElementById('scene3-block-a-a').classList.add('highlight-contact');
                document.getElementById('scene3-block-b-a').classList.add('highlight-contact');
                document.getElementById('scene3-block-a-b').classList.add('highlight-contact');
                document.getElementById('scene3-block-b-b').classList.add('highlight-contact');
                document.getElementById('scene3-table-row1').classList.add('highlight-1');
                document.getElementById('scene3-mark1').style.opacity = '1';
                document.getElementById('scene3-btn1').classList.add('active');
            } else if (state === 2) {
                // 状态2：对比速度
                document.getElementById('scene3-v1-arrow').classList.add('highlight-velocity');
                document.getElementById('scene3-v2-arrow').classList.add('highlight-velocity');
                document.getElementById('scene3-table-row2').classList.add('highlight-2');
                document.getElementById('scene3-mark2').style.opacity = '1';
                document.getElementById('scene3-btn2').classList.add('active');
            } else if (state === 3) {
                // 状态3：对比正压力和摩擦力
                document.getElementById('scene3-ground-a').classList.add('highlight-force');
                document.getElementById('scene3-ground-b').classList.add('highlight-force');
                document.getElementById('scene3-f1-arrow').classList.add('highlight-force');
                document.getElementById('scene3-f2-arrow').classList.add('highlight-force');
                document.getElementById('scene3-table-row3').classList.add('highlight-3');
                document.getElementById('scene3-table-row4').classList.add('highlight-4');
                document.getElementById('scene3-mark3').style.opacity = '1';
                document.getElementById('scene3-mark4').style.opacity = '1';
                document.getElementById('scene3-conclusion-box').classList.add('active');
                document.getElementById('scene3-conclusion-text').setAttribute('fill', '#1565c0');
                document.getElementById('scene3-btn3').classList.add('active');
            }
        }

        // 重置所有高亮
        function resetHighlights3() {
            // 木块
            document.getElementById('scene3-block-a-a').classList.remove('highlight-contact');
            document.getElementById('scene3-block-b-a').classList.remove('highlight-contact');
            document.getElementById('scene3-block-a-b').classList.remove('highlight-contact');
            document.getElementById('scene3-block-b-b').classList.remove('highlight-contact');
            // 箭头
            document.getElementById('scene3-v1-arrow').classList.remove('highlight-velocity');
            document.getElementById('scene3-v2-arrow').classList.remove('highlight-velocity');
            document.getElementById('scene3-f1-arrow').classList.remove('highlight-force');
            document.getElementById('scene3-f2-arrow').classList.remove('highlight-force');
            // 地面
            document.getElementById('scene3-ground-a').classList.remove('highlight-force');
            document.getElementById('scene3-ground-b').classList.remove('highlight-force');
            // 表格行
            document.getElementById('scene3-table-row1').classList.remove('highlight-1');
            document.getElementById('scene3-table-row2').classList.remove('highlight-2');
            document.getElementById('scene3-table-row3').classList.remove('highlight-3');
            document.getElementById('scene3-table-row4').classList.remove('highlight-4');
            // 标记
            document.getElementById('scene3-mark1').style.opacity = '0';
            document.getElementById('scene3-mark2').style.opacity = '0';
            document.getElementById('scene3-mark3').style.opacity = '0';
            document.getElementById('scene3-mark4').style.opacity = '0';
            // 结论框
            document.getElementById('scene3-conclusion-box').classList.remove('active');
            document.getElementById('scene3-conclusion-text').setAttribute('fill', '#666666');
            // 按钮
            document.getElementById('scene3-btn1').classList.remove('active');
            document.getElementById('scene3-btn2').classList.remove('active');
            document.getElementById('scene3-btn3').classList.remove('active');
        }

        // 初始化
        renderState3(0);
    })();
    </script>
</body>
</html>
