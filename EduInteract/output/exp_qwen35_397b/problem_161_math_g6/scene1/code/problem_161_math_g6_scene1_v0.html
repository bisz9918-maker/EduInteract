<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>长方形分类计数演示</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 12px;
            z-index: 10;
        }
        .scene1-btn {
            width: 100px;
            height: 36px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .scene1-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #scene1-btn-prev {
            background: #e0e0e0;
            color: #333333;
        }
        #scene1-btn-next {
            background: #1565c0;
            color: #ffffff;
        }
        .scene1-highlight {
            opacity: 0.2;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <!-- 大长方形外框 -->
            <rect id="scene1-main-rect" x="100" y="150" width="600" height="200" 
                  fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 三条竖直线 -->
            <line id="scene1-line-1" x1="175" y1="150" x2="175" y2="350" 
                  stroke="#000000" stroke-width="2"/>
            <line id="scene1-line-2" x1="250" y1="150" x2="250" y2="350" 
                  stroke="#000000" stroke-width="2"/>
            <line id="scene1-line-3" x1="550" y1="150" x2="550" y2="350" 
                  stroke="#000000" stroke-width="2"/>
            
            <!-- 高亮区域组 -->
            <g id="scene1-highlight-group"></g>
            
            <!-- 计数标签 -->
            <text id="scene1-count-label" x="400" y="380" 
                  text-anchor="middle" fill="#333333" font-size="16px">
                请点击下一步开始
            </text>
            
            <!-- 步骤指示器 -->
            <text id="scene1-step-indicator" x="400" y="420" 
                  text-anchor="middle" fill="#666666" font-size="14px">
                步骤 0/5
            </text>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn">◀ 上一步</button>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1: 长方形分类计数演示
        // 布局坐标表：
        // | 元素 | 位置/范围 | 大小 |
        // | 大长方形外框 | (100,150)-(700,350) | 600×200 |
        // | 竖直线1 | (175,150)-(175,350) | 1×200 |
        // | 竖直线2 | (250,150)-(250,350) | 1×200 |
        // | 竖直线3 | (550,150)-(550,350) | 1×200 |
        // | 小长方形1 | (100,150)-(175,350) | 75×200 |
        // | 小长方形2 | (175,150)-(250,350) | 75×200 |
        // | 小长方形3 | (250,150)-(550,350) | 300×200 |
        // | 小长方形4 | (550,150)-(700,350) | 150×200 |
        
        let currentStep = 0;
        const totalSteps = 5;
        
        // 步骤配置：每个步骤的高亮区域、颜色、标签
        const steps = [
            {
                highlights: [],
                color: '#1565c0',
                label: '请点击下一步开始'
            },
            {
                // 步骤1：4个单个小长方形（蓝色）
                highlights: [
                    { x: 100, y: 150, width: 75, height: 200 },
                    { x: 175, y: 150, width: 75, height: 200 },
                    { x: 250, y: 150, width: 300, height: 200 },
                    { x: 550, y: 150, width: 150, height: 200 }
                ],
                color: '#1565c0',
                label: '单个：4个'
            },
            {
                // 步骤2：3个由2个相邻小长方形组成的长方形（绿色）
                highlights: [
                    { x: 100, y: 150, width: 150, height: 200 },  // 1+2
                    { x: 175, y: 150, width: 375, height: 200 },  // 2+3
                    { x: 250, y: 150, width: 450, height: 200 }   // 3+4
                ],
                color: '#2e7d32',
                label: '两个组合：3个'
            },
            {
                // 步骤3：2个由3个相邻小长方形组成的长方形（橙色）
                highlights: [
                    { x: 100, y: 150, width: 450, height: 200 },  // 1+2+3
                    { x: 175, y: 150, width: 525, height: 200 }   // 2+3+4
                ],
                color: '#f57c00',
                label: '三个组合：2个'
            },
            {
                // 步骤4：1个由4个小长方形组成的大长方形（红色）
                highlights: [
                    { x: 100, y: 150, width: 600, height: 200 }   // 1+2+3+4
                ],
                color: '#c62828',
                label: '四个组合：1个'
            },
            {
                // 步骤5：总数统计
                highlights: [],
                color: '#6a1b9a',
                label: '总数：4+3+2+1=10个'
            }
        ];
        
        const highlightGroup = document.getElementById('scene1-highlight-group');
        const countLabel = document.getElementById('scene1-count-label');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        
        function renderStep(step) {
            // 清除所有高亮区域
            highlightGroup.innerHTML = '';
            
            const config = steps[step];
            
            // 创建新的高亮区域
            config.highlights.forEach(hl => {
                const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                rect.setAttribute('x', hl.x);
                rect.setAttribute('y', hl.y);
                rect.setAttribute('width', hl.width);
                rect.setAttribute('height', hl.height);
                rect.setAttribute('fill', config.color);
                rect.setAttribute('class', 'scene1-highlight');
                highlightGroup.appendChild(rect);
            });
            
            // 更新标签
            countLabel.textContent = config.label;
            stepIndicator.textContent = `步骤 ${step}/${totalSteps}`;
            
            // 更新按钮状态
            btnPrev.disabled = (step === 0);
            btnNext.disabled = (step === totalSteps);
        }
        
        function goToStep(step) {
            if (step < 0 || step > totalSteps) return;
            currentStep = step;
            renderStep(currentStep);
        }
        
        // 事件绑定
        btnPrev.addEventListener('click', () => {
            goToStep(currentStep - 1);
        });
        
        btnNext.addEventListener('click', () => {
            goToStep(currentStep + 1);
        });
        
        // 初始化
        renderStep(0);
    })();
    </script>
</body>
</html>
