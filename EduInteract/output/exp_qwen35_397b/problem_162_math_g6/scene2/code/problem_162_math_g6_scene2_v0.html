<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图形 B 的平移法周长计算</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene2-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene2-svg {
            width: 800px;
            height: 500px;
        }
        .scene2-segment {
            stroke-linecap: round;
        }
        .scene2-label {
            font-size: 16px;
            fill: #000000;
            text-anchor: middle;
        }
        .scene2-formula {
            font-size: 18px;
            fill: #2e7d32;
            text-anchor: middle;
            font-weight: bold;
        }
        .scene2-slider-label {
            font-size: 14px;
            fill: #333333;
        }
        #scene2-equiv-rect {
            fill: none;
            stroke: #2e7d32;
            stroke-width: 3;
            opacity: 0;
        }
        #scene2-formula-text {
            opacity: 0;
        }
        .scene2-trail {
            stroke: #888888;
            stroke-width: 1;
            stroke-dasharray: 4,4;
            fill: none;
            opacity: 0;
        }
        .scene2-arrow {
            stroke: #1565c0;
            stroke-width: 3;
            fill: none;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500">
            <!-- 等效长方形（初始隐藏） -->
            <rect id="scene2-equiv-rect" x="200" y="170" width="500" height="180"/>
            
            <!-- 平移轨迹线（初始隐藏） -->
            <path id="scene2-trail-h" class="scene2-trail" d="M 200 170 L 200 170"/>
            <path id="scene2-trail-v" class="scene2-trail" d="M 700 350 L 700 350"/>
            
            <!-- 图形 B 底边 -->
            <line id="scene2-base-bottom" x1="200" y1="350" x2="700" y2="350" stroke="#000000" stroke-width="2" class="scene2-segment"/>
            
            <!-- 图形 B 左边 -->
            <line id="scene2-base-left" x1="200" y1="170" x2="200" y2="350" stroke="#000000" stroke-width="2" class="scene2-segment"/>
            
            <!-- 阶梯水平段 8 段 -->
            <line id="scene2-hseg-1" x1="200" y1="170" x2="262.5" y2="170" stroke="#000000" stroke-width="2" class="scene2-segment"/>
            <line id="scene2-hseg-2" x1="262.5" y1="192.5" x2="325" y2="192.5" stroke="#000000" stroke-width="2" class="scene2-segment"/>
            <line id="scene2-hseg-3" x1="325" y1="215" x2="387.5" y2="215" stroke="#000000" stroke-width="2" class="scene2-segment"/>
            <line id="scene2-hseg-4" x1="387.5" y1="237.5" x2="450" y2="237.5" stroke="#000000" stroke-width="2" class="scene2-segment"/>
            <line id="scene2-hseg-5" x1="450" y1="260" x2="512.5" y2="260" stroke="#000000" stroke-width="2" class="scene2-segment"/>
            <line id="scene2-hseg-6" x1="512.5" y1="282.5" x2="575" y2="282.5" stroke="#000000" stroke-width="2" class="scene2-segment"/>
            <line id="scene2-hseg-7" x1="575" y1="305" x2="637.5" y2="305" stroke="#000000" stroke-width="2" class="scene2-segment"/>
            <line id="scene2-hseg-8" x1="637.5" y1="327.5" x2="700" y2="327.5" stroke="#000000" stroke-width="2" class="scene2-segment"/>
            
            <!-- 阶梯竖直段 7 段 -->
            <line id="scene2-vseg-1" x1="262.5" y1="170" x2="262.5" y2="192.5" stroke="#000000" stroke-width="2" class="scene2-segment"/>
            <line id="scene2-vseg-2" x1="325" y1="192.5" x2="325" y2="215" stroke="#000000" stroke-width="2" class="scene2-segment"/>
            <line id="scene2-vseg-3" x1="387.5" y1="215" x2="387.5" y2="237.5" stroke="#000000" stroke-width="2" class="scene2-segment"/>
            <line id="scene2-vseg-4" x1="450" y1="237.5" x2="450" y2="260" stroke="#000000" stroke-width="2" class="scene2-segment"/>
            <line id="scene2-vseg-5" x1="512.5" y1="260" x2="512.5" y2="282.5" stroke="#000000" stroke-width="2" class="scene2-segment"/>
            <line id="scene2-vseg-6" x1="575" y1="282.5" x2="575" y2="305" stroke="#000000" stroke-width="2" class="scene2-segment"/>
            <line id="scene2-vseg-7" x1="637.5" y1="305" x2="637.5" y2="327.5" stroke="#000000" stroke-width="2" class="scene2-segment"/>
            
            <!-- 尺寸标注 -->
            <text id="scene2-label-10" x="450" y="375" class="scene2-label">10</text>
            <text id="scene2-label-6" x="180" y="260" class="scene2-label">6</text>
            
            <!-- 平移方向箭头 -->
            <!-- 垂直箭头：指向上方 -->
            <line id="scene2-arrow-v-line" x1="250" y1="140" x2="250" y2="100" class="scene2-arrow"/>
            <polygon id="scene2-arrow-v-head" points="250,100 245,112 255,112" fill="#1565c0"/>
            
            <!-- 水平箭头：指向右方 -->
            <line id="scene2-arrow-h-line" x1="720" y1="200" x2="780" y2="200" class="scene2-arrow"/>
            <polygon id="scene2-arrow-h-head" points="780,200 768,195 768,205" fill="#1565c0"/>
            
            <!-- 周长公式 -->
            <text id="scene2-formula-text" x="550" y="80" class="scene2-formula">(10+6)×2 = 32</text>
            
            <!-- 滑块控件区域 -->
            <text id="scene2-slider-label" x="200" y="440" class="scene2-slider-label">平移进度</text>
        </svg>
        
        <!-- HTML 滑块控件 -->
        <div style="position: absolute; bottom: 15px; left: 280px; width: 400px;">
            <input id="scene2-slider" type="range" min="0" max="100" value="0" style="width: 100%;"/>
        </div>
    </div>
    
    <script>
    (function() {
        // 布局坐标表（实现对照依据）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // |------|------|-----------|------|-------------|------|
        // | 图形 B 底边 | 线段 | (200,350)-(700,350) | 500×2 | - | 水平基准线 |
        // | 图形 B 左边 | 线段 | (200,170)-(200,350) | 2×180 | - | 垂直基准线 |
        // | 阶梯水平段 1-8 | 线段 | 每段 62.5×2 | - | 上方 | 8 段水平阶梯 |
        // | 阶梯竖直段 1-7 | 线段 | 每段 2×22.5 | - | 右侧 | 7 段竖直阶梯 |
        // | 底边标注"10" | text | (450,375) | ~30×16 | 下方 | 底边中点下方 |
        // | 左边标注"6" | text | (180,260) | ~20×16 | 左侧 | 左边中点左侧 |
        // | 平移箭头 - 水平 | 箭头 | (720,200)-(780,200) | 60×4 | - | 指向右方 |
        // | 平移箭头 - 垂直 | 箭头 | (250,140)-(250,100) | 4×40 | - | 指向上方 |
        // | 等效长方形 | 矩形 | (200,170)-(700,350) | 500×180 | - | 绿色边框 |
        // | 周长公式 | text | (550,80) | ~120×20 | - | 显示计算结果 |
        // | 滑块控件 | input | (280,450)-(680,480) | 400×30 | - | 底部滑块 |
        
        // 阶梯线段原始坐标数据
        const hSegments = [
            { id: 'scene2-hseg-1', x1: 200, y1: 170, x2: 262.5, y2: 170, targetY: 170 },
            { id: 'scene2-hseg-2', x1: 262.5, y1: 192.5, x2: 325, y2: 192.5, targetY: 170 },
            { id: 'scene2-hseg-3', x1: 325, y1: 215, x2: 387.5, y2: 215, targetY: 170 },
            { id: 'scene2-hseg-4', x1: 387.5, y1: 237.5, x2: 450, y2: 237.5, targetY: 170 },
            { id: 'scene2-hseg-5', x1: 450, y1: 260, x2: 512.5, y2: 260, targetY: 170 },
            { id: 'scene2-hseg-6', x1: 512.5, y1: 282.5, x2: 575, y2: 282.5, targetY: 170 },
            { id: 'scene2-hseg-7', x1: 575, y1: 305, x2: 637.5, y2: 305, targetY: 170 },
            { id: 'scene2-hseg-8', x1: 637.5, y1: 327.5, x2: 700, y2: 327.5, targetY: 170 }
        ];
        
        const vSegments = [
            { id: 'scene2-vseg-1', x1: 262.5, y1: 170, x2: 262.5, y2: 192.5, targetX: 700 },
            { id: 'scene2-vseg-2', x1: 325, y1: 192.5, x2: 325, y2: 215, targetX: 700 },
            { id: 'scene2-vseg-3', x1: 387.5, y1: 215, x2: 387.5, y2: 237.5, targetX: 700 },
            { id: 'scene2-vseg-4', x1: 450, y1: 237.5, x2: 450, y2: 260, targetX: 700 },
            { id: 'scene2-vseg-5', x1: 512.5, y1: 260, x2: 512.5, y2: 282.5, targetX: 700 },
            { id: 'scene2-vseg-6', x1: 575, y1: 282.5, x2: 575, y2: 305, targetX: 700 },
            { id: 'scene2-vseg-7', x1: 637.5, y1: 305, x2: 637.5, y2: 327.5, targetX: 700 }
        ];
        
        // 获取 DOM 元素
        const slider = document.getElementById('scene2-slider');
        const equivRect = document.getElementById('scene2-equiv-rect');
        const formulaText = document.getElementById('scene2-formula-text');
        const trailH = document.getElementById('scene2-trail-h');
        const trailV = document.getElementById('scene2-trail-v');
        const arrowVLine = document.getElementById('scene2-arrow-v-line');
        const arrowVHead = document.getElementById('scene2-arrow-v-head');
        const arrowHLine = document.getElementById('scene2-arrow-h-line');
        const arrowHHead = document.getElementById('scene2-arrow-h-head');
        
        // 获取所有线段元素
        const hSegElements = hSegments.map(seg => document.getElementById(seg.id));
        const vSegElements = vSegments.map(seg => document.getElementById(seg.id));
        
        // 更新函数：根据滑块值更新所有元素状态
        function updateScene(sliderValue) {
            const progress = sliderValue / 100; // 0~1
            
            // 更新水平线段
            hSegments.forEach((seg, index) => {
                const el = hSegElements[index];
                const deltaY = seg.targetY - seg.y1;
                const currentY = seg.y1 + deltaY * progress;
                
                el.setAttribute('y1', currentY);
                el.setAttribute('y2', currentY);
                
                // 颜色和透明度变化
                if (progress > 0) {
                    el.setAttribute('stroke', '#1565c0');
                    const opacity = 0.7 + 0.3 * (1 - progress);
                    el.setAttribute('opacity', Math.min(1, opacity));
                } else {
                    el.setAttribute('stroke', '#000000');
                    el.setAttribute('opacity', 1);
                }
            });
            
            // 更新竖直线段
            vSegments.forEach((seg, index) => {
                const el = vSegElements[index];
                const deltaX = seg.targetX - seg.x1;
                const currentX = seg.x1 + deltaX * progress;
                
                el.setAttribute('x1', currentX);
                el.setAttribute('x2', currentX);
                
                // 颜色和透明度变化
                if (progress > 0) {
                    el.setAttribute('stroke', '#1565c0');
                    const opacity = 0.7 + 0.3 * (1 - progress);
                    el.setAttribute('opacity', Math.min(1, opacity));
                } else {
                    el.setAttribute('stroke', '#000000');
                    el.setAttribute('opacity', 1);
                }
            });
            
            // 更新等效长方形（90% 后开始显示）
            if (progress > 0.9) {
                const rectOpacity = (progress - 0.9) * 10;
                equivRect.setAttribute('opacity', rectOpacity);
            } else {
                equivRect.setAttribute('opacity', 0);
            }
            
            // 更新轨迹线（显示平移路径）
            if (progress > 0.1 && progress < 0.95) {
                trailH.setAttribute('opacity', 0.5);
                trailV.setAttribute('opacity', 0.5);
                // 水平线段平移轨迹
                const maxHDelta = 350 - 170; // 最大垂直位移
                const currentHDelta = maxHDelta * progress;
                trailH.setAttribute('d', `M 200 ${170 + currentHDelta} L 700 ${170 + currentHDelta}`);
                // 竖直线段平移轨迹
                const maxVDelta = 700 - 262.5; // 最大水平位移
                const currentVDelta = maxVDelta * progress;
                trailV.setAttribute('d', `M ${262.5 + currentVDelta} 170 L ${262.5 + currentVDelta} 350`);
            } else {
                trailH.setAttribute('opacity', 0);
                trailV.setAttribute('opacity', 0);
            }
            
            // 更新公式显示（100% 时显示）
            if (progress >= 1) {
                formulaText.setAttribute('opacity', 1);
                // 箭头高亮
                arrowVLine.setAttribute('stroke-width', 4);
                arrowHLine.setAttribute('stroke-width', 4);
            } else {
                formulaText.setAttribute('opacity', 0);
                arrowVLine.setAttribute('stroke-width', 3);
                arrowHLine.setAttribute('stroke-width', 3);
            }
        }
        
        // 监听滑块事件
        slider.addEventListener('input', function() {
            updateScene(parseInt(this.value));
        });
        
        // 初始化场景
        updateScene(0);
    })();
    </script>
</body>
</html>
