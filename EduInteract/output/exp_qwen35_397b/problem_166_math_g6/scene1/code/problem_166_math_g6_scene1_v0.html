<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>平行线间图形面积比较</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }
        .scene1-btn {
            background: #424242;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .scene1-btn:hover:not(:disabled) {
            background: #616161;
        }
        .scene1-btn:disabled {
            background: #9e9e9e;
            cursor: not-allowed;
        }
        #scene1-step-indicator {
            font-size: 14px;
            color: #424242;
            min-width: 80px;
            text-align: center;
        }
        /* 元素显隐控制 */
        .scene1-hidden {
            display: none;
            opacity: 0;
        }
        .scene1-visible {
            display: block;
            opacity: 1;
        }
        .scene1-visible-inline {
            display: inline;
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 上平行线 -->
            <line id="scene1-top-line" x1="100" y1="100" x2="720" y2="100" stroke="#000000" stroke-width="3"/>
            <!-- 下平行线 -->
            <line id="scene1-bottom-line" x1="100" y1="350" x2="720" y2="350" stroke="#000000" stroke-width="3"/>
            
            <!-- 上刻度线 (0-5) -->
            <line id="scene1-tick-top-0" x1="100" y1="90" x2="100" y2="100" stroke="#000000" stroke-width="2"/>
            <line id="scene1-tick-top-1" x1="220" y1="90" x2="220" y2="100" stroke="#000000" stroke-width="2"/>
            <line id="scene1-tick-top-2" x1="340" y1="90" x2="340" y2="100" stroke="#000000" stroke-width="2"/>
            <line id="scene1-tick-top-3" x1="460" y1="90" x2="460" y2="100" stroke="#000000" stroke-width="2"/>
            <line id="scene1-tick-top-4" x1="580" y1="90" x2="580" y2="100" stroke="#000000" stroke-width="2"/>
            <line id="scene1-tick-top-5" x1="700" y1="90" x2="700" y2="100" stroke="#000000" stroke-width="2"/>
            
            <!-- 下刻度线 (0-5) -->
            <line id="scene1-tick-bottom-0" x1="100" y1="350" x2="100" y2="360" stroke="#000000" stroke-width="2"/>
            <line id="scene1-tick-bottom-1" x1="220" y1="350" x2="220" y2="360" stroke="#000000" stroke-width="2"/>
            <line id="scene1-tick-bottom-2" x1="340" y1="350" x2="340" y2="360" stroke="#000000" stroke-width="2"/>
            <line id="scene1-tick-bottom-3" x1="460" y1="350" x2="460" y2="360" stroke="#000000" stroke-width="2"/>
            <line id="scene1-tick-bottom-4" x1="580" y1="350" x2="580" y2="360" stroke="#000000" stroke-width="2"/>
            <line id="scene1-tick-bottom-5" x1="700" y1="350" x2="700" y2="360" stroke="#000000" stroke-width="2"/>
            
            <!-- 上刻度数字 (0-5) -->
            <text id="scene1-num-top-0" x="100" y="75" text-anchor="middle" font-size="14" fill="#000000">0</text>
            <text id="scene1-num-top-1" x="220" y="75" text-anchor="middle" font-size="14" fill="#000000">1</text>
            <text id="scene1-num-top-2" x="340" y="75" text-anchor="middle" font-size="14" fill="#000000">2</text>
            <text id="scene1-num-top-3" x="460" y="75" text-anchor="middle" font-size="14" fill="#000000">3</text>
            <text id="scene1-num-top-4" x="580" y="75" text-anchor="middle" font-size="14" fill="#000000">4</text>
            <text id="scene1-num-top-5" x="700" y="75" text-anchor="middle" font-size="14" fill="#000000">5</text>
            
            <!-- 下刻度数字 (0-5) -->
            <text id="scene1-num-bottom-0" x="100" y="380" text-anchor="middle" font-size="14" fill="#000000">0</text>
            <text id="scene1-num-bottom-1" x="220" y="380" text-anchor="middle" font-size="14" fill="#000000">1</text>
            <text id="scene1-num-bottom-2" x="340" y="380" text-anchor="middle" font-size="14" fill="#000000">2</text>
            <text id="scene1-num-bottom-3" x="460" y="380" text-anchor="middle" font-size="14" fill="#000000">3</text>
            <text id="scene1-num-bottom-4" x="580" y="380" text-anchor="middle" font-size="14" fill="#000000">4</text>
            <text id="scene1-num-bottom-5" x="700" y="380" text-anchor="middle" font-size="14" fill="#000000">5</text>
            
            <!-- 图形1：三角形 (下0-上1-下2) -->
            <polygon id="scene1-shape-1" points="100,350 220,100 340,350" fill="#cccccc" fill-opacity="0.1" stroke="#000000" stroke-width="2"/>
            <!-- 图形2：平行四边形 (下2-下3-上4-上3) -->
            <polygon id="scene1-shape-2" points="340,350 460,350 580,100 460,100" fill="#cccccc" fill-opacity="0.1" stroke="#000000" stroke-width="2"/>
            <!-- 图形3：三角形 (下3-上4-下5) -->
            <polygon id="scene1-shape-3" points="460,350 580,100 700,350" fill="#cccccc" fill-opacity="0.1" stroke="#000000" stroke-width="2"/>
            
            <!-- 图形标签 -->
            <text id="scene1-label-1" x="220" y="240" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">1</text>
            <text id="scene1-label-2" x="430" y="240" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">2</text>
            <text id="scene1-label-3" x="580" y="240" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">3</text>
            
            <!-- 高线及标签 -->
            <line id="scene1-height-line" x1="730" y1="100" x2="730" y2="350" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>
            <text id="scene1-height-label" x="745" y="230" font-size="14" fill="#888888">h</text>
            
            <!-- 底边标注 (步骤中显示) -->
            <text id="scene1-base-label-1" x="220" y="330" text-anchor="middle" font-size="14" fill="#000000" class="scene1-hidden">2</text>
            <text id="scene1-base-label-2" x="400" y="330" text-anchor="middle" font-size="14" fill="#000000" class="scene1-hidden">1</text>
            <text id="scene1-base-label-3" x="580" y="330" text-anchor="middle" font-size="14" fill="#000000" class="scene1-hidden">1</text>
            
            <!-- 面积公式 (步骤中显示) -->
            <text id="scene1-formula-1" x="180" y="410" text-anchor="middle" font-size="14" fill="#000000" class="scene1-hidden">S₁ = ½×2×h = h</text>
            <text id="scene1-formula-2" x="400" y="410" text-anchor="middle" font-size="14" fill="#000000" class="scene1-hidden">S₂ = 1×h = h</text>
            <text id="scene1-formula-3" x="580" y="410" text-anchor="middle" font-size="14" fill="#000000" class="scene1-hidden">S₃ = ½×1×h = h/2</text>
            
            <!-- 面积条形图 (步骤4显示) -->
            <rect id="scene1-bar-1" x="155" y="440" width="50" height="40" fill="#1565c0" class="scene1-hidden"/>
            <rect id="scene1-bar-2" x="375" y="440" width="50" height="40" fill="#2e7d32" class="scene1-hidden"/>
            <rect id="scene1-bar-3" x="555" y="460" width="50" height="20" fill="#c62828" class="scene1-hidden"/>
            
            <!-- 条形图标签 -->
            <text id="scene1-bar-label-1" x="180" y="430" text-anchor="middle" font-size="12" fill="#1565c0" class="scene1-hidden">S₁=h</text>
            <text id="scene1-bar-label-2" x="400" y="430" text-anchor="middle" font-size="12" fill="#2e7d32" class="scene1-hidden">S₂=h</text>
            <text id="scene1-bar-label-3" x="580" y="455" text-anchor="middle" font-size="12" fill="#c62828" class="scene1-hidden">S₃=h/2</text>
            
            <!-- 结论提示 (步骤4显示) -->
            <text id="scene1-conclusion" x="400" y="490" text-anchor="middle" font-size="14" font-weight="bold" fill="#c62828" class="scene1-hidden">图形 3 面积最小</text>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/5</span>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1: 平行线间图形面积比较
        // 布局坐标表参考:
        // | 元素 | 位置 | 备注 |
        // |------|------|------|
        // | 上平行线 | (100,100)-(720,100) | 黑色实线 |
        // | 下平行线 | (100,350)-(720,350) | 黑色实线 |
        // | 图形1三角形 | (100,350)-(220,100)-(340,350) | 底边2单位 |
        // | 图形2平行四边形 | (340,350)-(460,350)-(580,100)-(460,100) | 底边1单位 |
        // | 图形3三角形 | (460,350)-(580,100)-(700,350) | 底边1单位 |
        // | 高线 | (730,100)-(730,350) | 右侧虚线 |
        
        const totalSteps = 5;
        let currentStep = 0;
        
        // 获取所有需要控制的元素
        const shape1 = document.getElementById('scene1-shape-1');
        const shape2 = document.getElementById('scene1-shape-2');
        const shape3 = document.getElementById('scene1-shape-3');
        
        const baseLabel1 = document.getElementById('scene1-base-label-1');
        const baseLabel2 = document.getElementById('scene1-base-label-2');
        const baseLabel3 = document.getElementById('scene1-base-label-3');
        
        const formula1 = document.getElementById('scene1-formula-1');
        const formula2 = document.getElementById('scene1-formula-2');
        const formula3 = document.getElementById('scene1-formula-3');
        
        const bar1 = document.getElementById('scene1-bar-1');
        const bar2 = document.getElementById('scene1-bar-2');
        const bar3 = document.getElementById('scene1-bar-3');
        
        const barLabel1 = document.getElementById('scene1-bar-label-1');
        const barLabel2 = document.getElementById('scene1-bar-label-2');
        const barLabel3 = document.getElementById('scene1-bar-label-3');
        
        const conclusion = document.getElementById('scene1-conclusion');
        
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        
        // 工具函数：显示元素
        function show(el) {
            if (el) {
                el.classList.remove('scene1-hidden');
                el.classList.add('scene1-visible');
                if (el.tagName === 'text') {
                    el.classList.add('scene1-visible-inline');
                }
            }
        }
        
        // 工具函数：隐藏元素
        function hide(el) {
            if (el) {
                el.classList.remove('scene1-visible', 'scene1-visible-inline');
                el.classList.add('scene1-hidden');
            }
        }
        
        // 重置所有图形为默认灰色
        function resetShapes() {
            shape1.setAttribute('fill', '#cccccc');
            shape1.setAttribute('fill-opacity', '0.1');
            shape2.setAttribute('fill', '#cccccc');
            shape2.setAttribute('fill-opacity', '0.1');
            shape3.setAttribute('fill', '#cccccc');
            shape3.setAttribute('fill-opacity', '0.1');
        }
        
        // 隐藏所有底边标注和公式
        function hideAllLabels() {
            hide(baseLabel1);
            hide(baseLabel2);
            hide(baseLabel3);
            hide(formula1);
            hide(formula2);
            hide(formula3);
            hide(bar1);
            hide(bar2);
            hide(bar3);
            hide(barLabel1);
            hide(barLabel2);
            hide(barLabel3);
            hide(conclusion);
        }
        
        // 更新步骤显示
        function updateStep() {
            resetShapes();
            hideAllLabels();
            
            switch (currentStep) {
                case 0:
                    // 初始状态：只显示基本图形
                    break;
                    
                case 1:
                    // 步骤1：高亮图形1（三角形）
                    shape1.setAttribute('fill', '#1565c0');
                    shape1.setAttribute('fill-opacity', '0.2');
                    show(baseLabel1);
                    show(formula1);
                    break;
                    
                case 2:
                    // 步骤2：高亮图形2（平行四边形）
                    shape2.setAttribute('fill', '#2e7d32');
                    shape2.setAttribute('fill-opacity', '0.2');
                    show(baseLabel2);
                    show(formula2);
                    break;
                    
                case 3:
                    // 步骤3：高亮图形3（三角形）
                    shape3.setAttribute('fill', '#c62828');
                    shape3.setAttribute('fill-opacity', '0.2');
                    show(baseLabel3);
                    show(formula3);
                    break;
                    
                case 4:
                    // 步骤4：显示面积对比条形图
                    show(bar1);
                    show(bar2);
                    show(bar3);
                    show(barLabel1);
                    show(barLabel2);
                    show(barLabel3);
                    show(conclusion);
                    break;
            }
            
            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps - 1);
            
            // 更新步骤指示器
            stepIndicator.textContent = `步骤 ${currentStep + 1}/${totalSteps}`;
        }
        
        // 按钮事件绑定
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });
        
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateStep();
            }
        });
        
        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
