<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圆的周长关系演示</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        .scene1-diameter {
            stroke-width: 3;
            stroke-linecap: round;
        }
        .scene1-circle {
            fill: none;
            stroke: #000000;
            stroke-width: 2;
        }
        .scene1-label {
            font-size: 16px;
            font-weight: bold;
            text-anchor: middle;
        }
        .scene1-relation {
            font-size: 18px;
            font-weight: bold;
            text-anchor: middle;
        }
        .scene1-formula {
            font-size: 16px;
            text-anchor: middle;
        }
        .scene1-btn {
            padding: 8px 16px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .scene1-btn-prev {
            background-color: #757575;
            color: white;
        }
        .scene1-btn-prev:hover {
            background-color: #616161;
        }
        .scene1-btn-prev:disabled {
            background-color: #bdbdbd;
            cursor: not-allowed;
        }
        .scene1-btn-next {
            background-color: #1565c0;
            color: white;
        }
        .scene1-btn-next:hover {
            background-color: #0d47a1;
        }
        .scene1-btn-next:disabled {
            background-color: #90caf9;
            cursor: not-allowed;
        }
        .scene1-step-indicator {
            font-size: 14px;
            color: #424242;
            min-width: 80px;
            text-align: center;
        }
        .scene1-controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 三个圆（始终显示） -->
            <circle id="scene1-circle-large" class="scene1-circle" cx="400" cy="250" r="180"/>
            <circle id="scene1-circle-small-left" class="scene1-circle" cx="260" cy="250" r="60"/>
            <circle id="scene1-circle-small-right" class="scene1-circle" cx="500" cy="250" r="100"/>

            <!-- 大圆直径 D（步骤1显示） -->
            <line id="scene1-diameter-D" class="scene1-diameter" x1="220" y1="250" x2="580" y2="250" stroke="#1565c0" style="opacity: 0;"/>
            <text id="scene1-label-D" class="scene1-label" x="400" y="225" fill="#1565c0" style="opacity: 0;">D</text>

            <!-- 左小圆直径 d1（步骤2显示） -->
            <line id="scene1-diameter-d1" class="scene1-diameter" x1="200" y1="250" x2="320" y2="250" stroke="#2e7d32" style="opacity: 0;"/>
            <text id="scene1-label-d1" class="scene1-label" x="260" y="225" fill="#2e7d32" style="opacity: 0;">d₁</text>

            <!-- 右小圆直径 d2（步骤2显示） -->
            <line id="scene1-diameter-d2" class="scene1-diameter" x1="400" y1="250" x2="600" y2="250" stroke="#2e7d32" style="opacity: 0;"/>
            <text id="scene1-label-d2" class="scene1-label" x="500" y="225" fill="#2e7d32" style="opacity: 0;">d₂</text>

            <!-- 关系式 d₁ + d₂ = D（步骤3显示） -->
            <text id="scene1-relation-text" class="scene1-relation" x="400" y="320" fill="#c62828" style="opacity: 0;">d₁ + d₂ = D</text>

            <!-- 周长公式 C = πd（步骤4显示） -->
            <text id="scene1-formula-text" class="scene1-formula" x="400" y="360" fill="#1565c0" style="opacity: 0;">C = πd</text>

            <!-- 拼接示意线段（步骤3显示） -->
            <line id="scene1-combine-d1" class="scene1-diameter" x1="340" y1="400" x2="400" y2="400" stroke="#2e7d32" style="opacity: 0;"/>
            <text id="scene1-combine-label-d1" class="scene1-label" x="370" y="420" fill="#2e7d32" font-size="14px" style="opacity: 0;">d₁</text>
            
            <line id="scene1-combine-d2" class="scene1-diameter" x1="400" y1="400" x2="500" y2="400" stroke="#2e7d32" style="opacity: 0;"/>
            <text id="scene1-combine-label-d2" class="scene1-label" x="450" y="420" fill="#2e7d32" font-size="14px" style="opacity: 0;">d₂</text>
            
            <line id="scene1-combine-D" class="scene1-diameter" x1="340" y1="420" x2="500" y2="420" stroke="#1565c0" style="opacity: 0;"/>
            <text id="scene1-combine-label-D" class="scene1-label" x="420" y="445" fill="#1565c0" font-size="14px" style="opacity: 0;">D</text>

            <!-- 控件栏（放在 SVG 内部底部） -->
            <g id="scene1-controls" class="scene1-controls">
                <rect x="280" y="455" width="240" height="35" fill="#f5f5f5" rx="4" stroke="#e0e0e0"/>
                <text id="scene1-step-indicator" class="scene1-step-indicator" x="400" y="478">步骤 0/4</text>
                <rect id="scene1-btn-prev-bg" x="300" y="458" width="80" height="28" fill="#757575" rx="4"/>
                <text id="scene1-btn-prev-text" x="340" y="477" fill="white" font-size="13px" text-anchor="middle">◀ 上一步</text>
                <rect id="scene1-btn-next-bg" x="420" y="458" width="80" height="28" fill="#1565c0" rx="4"/>
                <text id="scene1-btn-next-text" x="460" y="477" fill="white" font-size="13px" text-anchor="middle">下一步 ▶</text>
            </g>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 1 实现：三个圆的直径关系展示

        // 状态变量
        let currentStep = 0;
        const maxStep = 4;

        // 每步应显示的元素 ID 列表
        const stepElements = {
            0: [],  // 初始状态：只显示三个圆
            1: ['scene1-diameter-D', 'scene1-label-D'],
            2: ['scene1-diameter-D', 'scene1-label-D', 'scene1-diameter-d1', 'scene1-label-d1', 'scene1-diameter-d2', 'scene1-label-d2'],
            3: ['scene1-diameter-D', 'scene1-label-D', 'scene1-diameter-d1', 'scene1-label-d1', 'scene1-diameter-d2', 'scene1-label-d2', 
                'scene1-relation-text', 'scene1-combine-d1', 'scene1-combine-label-d1', 'scene1-combine-d2', 'scene1-combine-label-d2', 'scene1-combine-D', 'scene1-combine-label-D'],
            4: ['scene1-diameter-D', 'scene1-label-D', 'scene1-diameter-d1', 'scene1-label-d1', 'scene1-diameter-d2', 'scene1-label-d2',
                'scene1-relation-text', 'scene1-formula-text', 'scene1-combine-d1', 'scene1-combine-label-d1', 'scene1-combine-d2', 'scene1-combine-label-d2', 'scene1-combine-D', 'scene1-combine-label-D']
        };

        // 所有可控制显隐的元素 ID
        const allControlledElements = [
            'scene1-diameter-D', 'scene1-label-D',
            'scene1-diameter-d1', 'scene1-label-d1',
            'scene1-diameter-d2', 'scene1-label-d2',
            'scene1-relation-text', 'scene1-formula-text',
            'scene1-combine-d1', 'scene1-combine-label-d1',
            'scene1-combine-d2', 'scene1-combine-label-d2',
            'scene1-combine-D', 'scene1-combine-label-D'
        ];

        // 工具函数：显示元素
        function showElement(elementId) {
            const el = document.getElementById(elementId);
            if (el) {
                el.style.opacity = '1';
                el.style.transition = 'opacity 0.3s ease-in-out';
            }
        }

        // 工具函数：隐藏元素
        function hideElement(elementId) {
            const el = document.getElementById(elementId);
            if (el) {
                el.style.opacity = '0';
            }
        }

        // 更新步骤显示
        function updateStep() {
            // 更新步骤指示器
            const indicator = document.getElementById('scene1-step-indicator');
            if (indicator) {
                indicator.textContent = '步骤 ' + currentStep + '/' + maxStep;
            }

            // 更新按钮状态
            const prevBtnBg = document.getElementById('scene1-btn-prev-bg');
            const prevBtnText = document.getElementById('scene1-btn-prev-text');
            const nextBtnBg = document.getElementById('scene1-btn-next-bg');
            const nextBtnText = document.getElementById('scene1-btn-next-text');

            if (prevBtnBg && prevBtnText) {
                if (currentStep === 0) {
                    prevBtnBg.setAttribute('fill', '#bdbdbd');
                    prevBtnText.setAttribute('fill', '#9e9e9e');
                } else {
                    prevBtnBg.setAttribute('fill', '#757575');
                    prevBtnText.setAttribute('fill', 'white');
                }
            }

            if (nextBtnBg && nextBtnText) {
                if (currentStep === maxStep) {
                    nextBtnBg.setAttribute('fill', '#90caf9');
                    nextBtnText.setAttribute('fill', '#e3f2fd');
                } else {
                    nextBtnBg.setAttribute('fill', '#1565c0');
                    nextBtnText.setAttribute('fill', 'white');
                }
            }

            // 更新元素显隐
            const currentElements = stepElements[currentStep];
            
            // 先隐藏所有
            allControlledElements.forEach(id => hideElement(id));
            
            // 再显示当前步骤需要的元素
            currentElements.forEach(id => showElement(id));
        }

        // 上一步
        function prevStep() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        }

        // 下一步
        function nextStep() {
            if (currentStep < maxStep) {
                currentStep++;
                updateStep();
            }
        }

        // 绑定按钮点击事件
        function initButtons() {
            const prevBtnBg = document.getElementById('scene1-btn-prev-bg');
            const prevBtnText = document.getElementById('scene1-btn-prev-text');
            const nextBtnBg = document.getElementById('scene1-btn-next-bg');
            const nextBtnText = document.getElementById('scene1-btn-next-text');

            // 为按钮组添加点击事件
            const controlsGroup = document.getElementById('scene1-controls');
            if (controlsGroup) {
                controlsGroup.addEventListener('click', function(e) {
                    const rect = controlsGroup.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    
                    // 上一步按钮区域：x 300-380
                    if (x >= 300 && x <= 380 && currentStep > 0) {
                        prevStep();
                    }
                    // 下一步按钮区域：x 420-500
                    else if (x >= 420 && x <= 500 && currentStep < maxStep) {
                        nextStep();
                    }
                });
            }

            // 也添加鼠标悬停效果
            if (prevBtnBg) {
                prevBtnBg.addEventListener('mouseenter', function() {
                    if (currentStep > 0) {
                        this.setAttribute('fill', '#616161');
                    }
                });
                prevBtnBg.addEventListener('mouseleave', function() {
                    if (currentStep > 0) {
                        this.setAttribute('fill', '#757575');
                    }
                });
            }

            if (nextBtnBg) {
                nextBtnBg.addEventListener('mouseenter', function() {
                    if (currentStep < maxStep) {
                        this.setAttribute('fill', '#0d47a1');
                    }
                });
                nextBtnBg.addEventListener('mouseleave', function() {
                    if (currentStep < maxStep) {
                        this.setAttribute('fill', '#1565c0');
                    }
                });
            }
        }

        // 初始化
        function init() {
            updateStep();
            initButtons();
        }

        // 页面加载完成后初始化
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>
</body>
</html>
