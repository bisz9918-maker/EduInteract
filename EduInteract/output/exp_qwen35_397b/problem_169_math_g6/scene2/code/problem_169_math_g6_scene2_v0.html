<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>方位角概念辨析 - 北偏东 vs 北偏西 vs 东偏北</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        #scene2-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene2-svg {
            width: 800px;
            height: 500px;
        }
        /* 元素显隐控制 */
        .scene2-hidden {
            display: none;
            opacity: 0;
        }
        .scene2-visible {
            display: block;
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 坐标轴 -->
            <!-- 北轴: (400,250)-(400,70) -->
            <line id="scene2-axis-n" x1="400" y1="250" x2="400" y2="70" stroke="#000" stroke-width="2"/>
            <!-- 南轴: (400,250)-(400,410) - 缩短避免与按钮重叠 -->
            <line id="scene2-axis-s" x1="400" y1="250" x2="400" y2="410" stroke="#000" stroke-width="2"/>
            <!-- 西轴: (400,250)-(220,250) -->
            <line id="scene2-axis-w" x1="400" y1="250" x2="220" y2="250" stroke="#000" stroke-width="2"/>
            <!-- 东轴: (400,250)-(580,250) -->
            <line id="scene2-axis-e" x1="400" y1="250" x2="580" y2="250" stroke="#000" stroke-width="2"/>

            <!-- 方向标签 -->
            <text id="scene2-label-n" x="400" y="55" text-anchor="middle" font-size="16" fill="#000">北</text>
            <text id="scene2-label-s" x="400" y="430" text-anchor="middle" font-size="16" fill="#000">南</text>
            <text id="scene2-label-w" x="205" y="250" text-anchor="end" dominant-baseline="middle" font-size="16" fill="#000">西</text>
            <text id="scene2-label-e" x="595" y="250" text-anchor="start" dominant-baseline="middle" font-size="16" fill="#000">东</text>

            <!-- 雷达站中心点 -->
            <circle id="scene2-center" cx="400" cy="250" r="6" fill="#000"/>
            <text id="scene2-label-center" x="400" y="275" text-anchor="middle" font-size="14" fill="#000">雷达站</text>

            <!-- 比例尺 (550,380)-(610,380) 代表 50km -->
            <g id="scene2-scale">
                <line x1="550" y1="380" x2="610" y2="380" stroke="#000" stroke-width="2"/>
                <line x1="550" y1="375" x2="550" y2="385" stroke="#000" stroke-width="1"/>
                <line x1="610" y1="375" x2="610" y2="385" stroke="#000" stroke-width="1"/>
                <text x="580" y="398" text-anchor="middle" font-size="14" fill="#000">50km</text>
            </g>

            <!-- 扇形填充区域（透明度 20%） -->
            <!-- 北偏东扇形：从北轴到北偏东射线 -->
            <path id="scene2-fan-ne" class="scene2-hidden" 
                  d="M 400 250 L 400 210 A 40 40 0 0 1 464.28 173.13 Z" 
                  fill="#c62828" fill-opacity="0.2"/>
            
            <!-- 北偏西扇形：从北轴到北偏西射线 -->
            <path id="scene2-fan-nw" class="scene2-hidden"
                  d="M 400 250 L 400 210 A 40 40 0 0 0 335.72 173.13 Z"
                  fill="#1565c0" fill-opacity="0.2"/>
            
            <!-- 东偏北扇形：从东轴到射线 -->
            <path id="scene2-fan-en" class="scene2-hidden"
                  d="M 400 250 L 440 250 A 40 40 0 0 0 464.28 173.13 Z"
                  fill="#1565c0" fill-opacity="0.2"/>

            <!-- 北偏东射线 (400,250)-(464,173) -->
            <line id="scene2-ray-ne" x1="400" y1="250" x2="464" y2="173" 
                  stroke="#c62828" stroke-width="2.5" class="scene2-hidden"/>
            
            <!-- 北偏西射线 (400,250)-(336,173) -->
            <line id="scene2-ray-nw" x1="400" y1="250" x2="336" y2="173" 
                  stroke="#1565c0" stroke-width="2.5" class="scene2-hidden"/>

            <!-- 角度弧线 -->
            <!-- 40°角弧 (北偏东)：从北轴到北偏东射线，半径 40px -->
            <path id="scene2-arc-40-ne" class="scene2-hidden"
                  d="M 400 210 A 40 40 0 0 1 425.71 194.29"
                  fill="none" stroke="#c62828" stroke-width="1.5"/>
            
            <!-- 40°角弧 (北偏西)：从北轴到北偏西射线 -->
            <path id="scene2-arc-40-nw" class="scene2-hidden"
                  d="M 400 210 A 40 40 0 0 0 374.29 194.29"
                  fill="none" stroke="#1565c0" stroke-width="1.5"/>
            
            <!-- 50°角弧 (东偏北)：从东轴到射线 -->
            <path id="scene2-arc-50" class="scene2-hidden"
                  d="M 440 250 A 40 40 0 0 0 425.71 219.29"
                  fill="none" stroke="#1565c0" stroke-width="1.5"/>

            <!-- 角度标签 -->
            <text id="scene2-angle-40-ne" x="430" y="190" font-size="14" fill="#c62828" class="scene2-hidden">40°</text>
            <text id="scene2-angle-40-nw" x="360" y="190" font-size="14" fill="#1565c0" class="scene2-hidden">40°</text>
            <text id="scene2-angle-50" x="450" y="220" font-size="14" fill="#1565c0" class="scene2-hidden">50°</text>

            <!-- 巡洋舰点 (464, 173) -->
            <circle id="scene2-ship" cx="464" cy="173" r="5" fill="#c62828"/>
            <text id="scene2-label-ship" x="464" y="158" text-anchor="middle" font-size="14" fill="#000">巡洋舰</text>

            <!-- 等价说明文字（状态 3 显示） -->
            <text id="scene2-note-equal" x="400" y="120" text-anchor="middle" font-size="13" fill="#1565c0" class="scene2-hidden">与北偏东 40°方向相同</text>

            <!-- 控件按钮组（放在 SVG 内部底部，y 从 445 开始） -->
            <!-- 按钮 1: 北偏东 40° -->
            <g id="scene2-btn-1" style="cursor: pointer;">
                <rect id="scene2-btn-1-bg" x="180" y="445" width="120" height="35" fill="#fff" stroke="#333" stroke-width="2" rx="6"/>
                <text id="scene2-btn-1-text" x="240" y="467" text-anchor="middle" font-size="14" fill="#000" style="pointer-events: none;">北偏东 40°</text>
            </g>
            
            <!-- 按钮 2: 北偏西 40° -->
            <g id="scene2-btn-2" style="cursor: pointer;">
                <rect id="scene2-btn-2-bg" x="340" y="445" width="120" height="35" fill="#fff" stroke="#333" stroke-width="2" rx="6"/>
                <text id="scene2-btn-2-text" x="400" y="467" text-anchor="middle" font-size="14" fill="#000" style="pointer-events: none;">北偏西 40°</text>
            </g>
            
            <!-- 按钮 3: 东偏北 50° -->
            <g id="scene2-btn-3" style="cursor: pointer;">
                <rect id="scene2-btn-3-bg" x="500" y="445" width="120" height="35" fill="#fff" stroke="#333" stroke-width="2" rx="6"/>
                <text id="scene2-btn-3-text" x="560" y="467" text-anchor="middle" font-size="14" fill="#000" style="pointer-events: none;">东偏北 50°</text>
            </g>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 2: 方位角概念辨析
        // 布局坐标表对照：
        // | 元素 | 位置 | 备注 |
        // |------|------|------|
        // | 中心 (雷达站) | (400, 250) | 原点 |
        // | 巡洋舰 | (464, 173) | 北偏东 40°方向 |
        // | 北轴 | (400,250)-(400,70) | 向上 |
        // | 南轴 | (400,250)-(400,410) | 向下 (缩短) |
        // | 西轴 | (400,250)-(220,250) | 向左 |
        // | 东轴 | (400,250)-(580,250) | 向右 |
        // | 北偏西射线终点 | (336, 173) | 对称点 |
        // | 按钮 1 | (180,445)-(300,480) | 北偏东 40° |
        // | 按钮 2 | (340,445)-(460,480) | 北偏西 40° |
        // | 按钮 3 | (500,445)-(620,480) | 东偏北 50° |

        let currentState = 0; // 0=初始，1=北偏东，2=北偏西，3=东偏北

        // 获取元素
        const rayNE = document.getElementById('scene2-ray-ne');
        const rayNW = document.getElementById('scene2-ray-nw');
        const fanNE = document.getElementById('scene2-fan-ne');
        const fanNW = document.getElementById('scene2-fan-nw');
        const fanEN = document.getElementById('scene2-fan-en');
        const arc40NE = document.getElementById('scene2-arc-40-ne');
        const arc40NW = document.getElementById('scene2-arc-40-nw');
        const arc50 = document.getElementById('scene2-arc-50');
        const angle40NE = document.getElementById('scene2-angle-40-ne');
        const angle40NW = document.getElementById('scene2-angle-40-nw');
        const angle50 = document.getElementById('scene2-angle-50');
        const ship = document.getElementById('scene2-ship');
        const noteEqual = document.getElementById('scene2-note-equal');
        
        const btn1Bg = document.getElementById('scene2-btn-1-bg');
        const btn1Text = document.getElementById('scene2-btn-1-text');
        const btn2Bg = document.getElementById('scene2-btn-2-bg');
        const btn2Text = document.getElementById('scene2-btn-2-text');
        const btn3Bg = document.getElementById('scene2-btn-3-bg');
        const btn3Text = document.getElementById('scene2-btn-3-text');

        // 工具函数：显示/隐藏元素
        function show(el) {
            if (el) {
                el.classList.remove('scene2-hidden');
                el.classList.add('scene2-visible');
                if (el.tagName === 'line' || el.tagName === 'path' || el.tagName === 'circle' || el.tagName === 'text') {
                    el.style.display = '';
                    el.style.opacity = '1';
                }
            }
        }

        function hide(el) {
            if (el) {
                el.classList.remove('scene2-visible');
                el.classList.add('scene2-hidden');
                if (el.tagName === 'line' || el.tagName === 'path' || el.tagName === 'circle' || el.tagName === 'text') {
                    el.style.display = 'none';
                    el.style.opacity = '0';
                }
            }
        }

        // 重置所有状态元素
        function resetElements() {
            // 隐藏所有射线
            hide(rayNE);
            hide(rayNW);
            // 隐藏所有扇形
            hide(fanNE);
            hide(fanNW);
            hide(fanEN);
            // 隐藏所有角弧
            hide(arc40NE);
            hide(arc40NW);
            hide(arc50);
            // 隐藏所有角度标签
            hide(angle40NE);
            hide(angle40NW);
            hide(angle50);
            // 隐藏说明文字
            hide(noteEqual);
            
            // 重置按钮样式
            btn1Bg.setAttribute('fill', '#fff');
            btn1Text.setAttribute('fill', '#000');
            btn2Bg.setAttribute('fill', '#fff');
            btn2Text.setAttribute('fill', '#000');
            btn3Bg.setAttribute('fill', '#fff');
            btn3Text.setAttribute('fill', '#000');
            
            // 重置巡洋舰样式
            ship.setAttribute('fill', '#c62828');
            ship.setAttribute('opacity', '1');
        }

        // 状态 1：北偏东 40°
        function setState1() {
            resetElements();
            show(rayNE);
            show(fanNE);
            show(arc40NE);
            show(angle40NE);
            // 按钮 1 高亮（红色）
            btn1Bg.setAttribute('fill', '#c62828');
            btn1Text.setAttribute('fill', '#fff');
            // 巡洋舰红色实心（匹配）
            ship.setAttribute('fill', '#c62828');
            ship.setAttribute('opacity', '1');
        }

        // 状态 2：北偏西 40°
        function setState2() {
            resetElements();
            show(rayNW);
            show(fanNW);
            show(arc40NW);
            show(angle40NW);
            // 按钮 2 高亮（蓝色）
            btn2Bg.setAttribute('fill', '#1565c0');
            btn2Text.setAttribute('fill', '#fff');
            // 巡洋舰灰色虚影（不匹配）
            ship.setAttribute('fill', '#888');
            ship.setAttribute('opacity', '0.4');
        }

        // 状态 3：东偏北 50°
        function setState3() {
            resetElements();
            show(rayNE); // 射线与北偏东相同
            show(fanEN);
            show(arc50);
            show(angle50);
            show(noteEqual);
            // 按钮 3 高亮（蓝色）
            btn3Bg.setAttribute('fill', '#1565c0');
            btn3Text.setAttribute('fill', '#fff');
            // 巡洋舰蓝色实心（匹配）
            ship.setAttribute('fill', '#1565c0');
            ship.setAttribute('opacity', '1');
        }

        // 点击事件处理（绑定到整个按钮组）
        document.getElementById('scene2-btn-1').addEventListener('click', function() {
            currentState = 1;
            setState1();
        });

        document.getElementById('scene2-btn-2').addEventListener('click', function() {
            currentState = 2;
            setState2();
        });

        document.getElementById('scene2-btn-3').addEventListener('click', function() {
            currentState = 3;
            setState3();
        });

        // 初始状态：不显示任何射线和角度
        resetElements();
    })();
    </script>
</body>
</html>
