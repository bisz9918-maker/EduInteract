<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>滑片移动时电路动态变化分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene2-meter-box { fill: #f5f5f5; stroke: #333; stroke-width: 1; }
        .scene2-meter-label { font-size: 14px; font-weight: bold; }
        .scene2-meter-value { font-size: 18px; fill: #333; }
        .scene2-bulb-glow { filter: blur(2px); }
        .scene2-arrow-up { fill: #c62828; }
        .scene2-arrow-down { fill: #1565c0; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" id="scene2-svg">
            <!-- 电路图区 y=50~180 -->
            <!-- 电源符号 (150,80) 40×60 -->
            <g id="scene2-power">
                <rect x="130" y="60" width="40" height="60" fill="none" stroke="#000" stroke-width="2"/>
                <line x1="150" y1="60" x2="150" y2="70" stroke="#000" stroke-width="2"/>
                <line x1="150" y1="110" x2="150" y2="120" stroke="#000" stroke-width="2"/>
                <text x="180" y="95" font-size="14" fill="#000">U</text>
            </g>
            
            <!-- 开关符号 (220,80) 50×30 -->
            <g id="scene2-switch">
                <line x1="200" y1="95" x2="230" y2="95" stroke="#000" stroke-width="2"/>
                <line x1="230" y1="95" x2="260" y2="85" stroke="#000" stroke-width="2"/>
                <circle cx="230" cy="95" r="3" fill="#000"/>
                <circle cx="260" cy="95" r="3" fill="#000"/>
                <text x="245" y="75" font-size="14" fill="#000">S</text>
            </g>
            
            <!-- 灯泡符号 (300,80) 40×40 -->
            <g id="scene2-bulb-symbol">
                <circle cx="320" cy="95" r="15" fill="none" stroke="#000" stroke-width="2"/>
                <line x1="310" y1="95" x2="300" y2="95" stroke="#000" stroke-width="2"/>
                <line x1="330" y1="95" x2="340" y2="95" stroke="#000" stroke-width="2"/>
                <path d="M315,85 L325,85 M315,105 L325,105 M310,90 L330,110 M310,100 L330,90" stroke="#000" stroke-width="1.5"/>
                <text x="320" y="125" font-size="14" fill="#000" text-anchor="middle">L</text>
            </g>
            
            <!-- 滑动变阻器 (380,60) 120×50 -->
            <g id="scene2-rheostat">
                <rect x="380" y="75" width="120" height="20" fill="none" stroke="#000" stroke-width="2"/>
                <line x1="380" y1="85" x2="500" y2="85" stroke="#000" stroke-width="2"/>
                <!-- 滑片 P -->
                <g id="scene2-slider-p">
                    <line x1="420" y1="60" x2="420" y2="75" stroke="#000" stroke-width="3"/>
                    <polygon points="420,60 415,70 425,70" fill="#000"/>
                </g>
                <text x="440" y="50" font-size="14" fill="#000" text-anchor="middle">R_滑</text>
            </g>
            
            <!-- 电流表 A (550,80) -->
            <g id="scene2-ammeter">
                <circle cx="575" cy="95" r="20" fill="none" stroke="#1565c0" stroke-width="2"/>
                <text x="575" y="100" font-size="16" fill="#1565c0" text-anchor="middle" font-weight="bold">A</text>
                <line x1="555" y1="95" x2="540" y2="95" stroke="#000" stroke-width="2"/>
                <line x1="595" y1="95" x2="610" y2="95" stroke="#000" stroke-width="2"/>
                <text x="605" y="80" font-size="14" fill="#000">A</text>
            </g>
            
            <!-- 电压表 V1 (420,140) 并联在变阻器两端 -->
            <g id="scene2-voltmeter1">
                <circle cx="442" cy="155" r="18" fill="none" stroke="#c62828" stroke-width="2"/>
                <text x="442" y="160" font-size="12" fill="#c62828" text-anchor="middle" font-weight="bold">V₁</text>
                <line x1="442" y1="137" x2="442" y2="100" stroke="#c62828" stroke-width="1.5"/>
                <line x1="380" y1="100" x2="442" y2="100" stroke="#c62828" stroke-width="1.5"/>
                <line x1="500" y1="100" x2="500" y2="137" stroke="#c62828" stroke-width="1.5"/>
                <line x1="500" y1="137" x2="442" y2="137" stroke="#c62828" stroke-width="1.5"/>
                <text x="442" y="125" font-size="14" fill="#c62828" text-anchor="middle">V₁</text>
            </g>
            
            <!-- 电压表 V2 (320,140) 并联在灯泡两端 -->
            <g id="scene2-voltmeter2">
                <circle cx="342" cy="155" r="18" fill="none" stroke="#2e7d32" stroke-width="2"/>
                <text x="342" y="160" font-size="12" fill="#2e7d32" text-anchor="middle" font-weight="bold">V₂</text>
                <line x1="342" y1="137" x2="342" y2="115" stroke="#2e7d32" stroke-width="1.5"/>
                <line x1="300" y1="115" x2="342" y2="115" stroke="#2e7d32" stroke-width="1.5"/>
                <line x1="340" y1="115" x2="340" y2="137" stroke="#2e7d32" stroke-width="1.5"/>
                <line x1="340" y1="137" x2="342" y2="137" stroke="#2e7d32" stroke-width="1.5"/>
                <text x="342" y="125" font-size="14" fill="#2e7d32" text-anchor="middle">V₂</text>
            </g>
            
            <!-- 电路连线 -->
            <g id="scene2-wires">
                <!-- 电源正极到开关 -->
                <line x1="170" y1="95" x2="200" y2="95" stroke="#000" stroke-width="2"/>
                <!-- 开关到灯泡 -->
                <line x1="260" y1="95" x2="300" y2="95" stroke="#000" stroke-width="2"/>
                <!-- 灯泡到变阻器 -->
                <line x1="340" y1="95" x2="380" y2="95" stroke="#000" stroke-width="2"/>
                <!-- 变阻器到电流表 -->
                <line x1="500" y1="95" x2="555" y2="95" stroke="#000" stroke-width="2"/>
                <!-- 电流表回电源负极 -->
                <line x1="595" y1="95" x2="620" y2="95" stroke="#000" stroke-width="2"/>
                <line x1="620" y1="95" x2="620" y2="120" stroke="#000" stroke-width="2"/>
                <line x1="620" y1="120" x2="150" y2="120" stroke="#000" stroke-width="2"/>
                <line x1="150" y1="120" x2="150" y2="110" stroke="#000" stroke-width="2"/>
            </g>
            
            <!-- 仪表显示区 y=260~340 -->
            <g id="scene2-meter-display">
                <!-- 电流表显示 -->
                <rect x="100" y="280" width="120" height="50" class="scene2-meter-box"/>
                <text x="160" y="300" font-size="14" class="scene2-meter-label" text-anchor="middle">电流 I</text>
                <text x="160" y="325" font-size="18" class="scene2-meter-value" text-anchor="middle" id="scene2-value-I">0.50 A</text>
                
                <!-- V1 显示 -->
                <rect x="240" y="280" width="120" height="50" class="scene2-meter-box"/>
                <text x="300" y="300" font-size="14" class="scene2-meter-label" text-anchor="middle">电压 U₁</text>
                <text x="300" y="325" font-size="18" class="scene2-meter-value" text-anchor="middle" id="scene2-value-V1">0.0 V</text>
                
                <!-- V2 显示 -->
                <rect x="380" y="280" width="120" height="50" class="scene2-meter-box"/>
                <text x="440" y="300" font-size="14" class="scene2-meter-label" text-anchor="middle">电压 U₂</text>
                <text x="440" y="325" font-size="18" class="scene2-meter-value" text-anchor="middle" id="scene2-value-V2">6.0 V</text>
                
                <!-- 总功率显示 -->
                <rect x="520" y="280" width="120" height="50" class="scene2-meter-box"/>
                <text x="580" y="300" font-size="14" class="scene2-meter-label" text-anchor="middle">总功率 P_总</text>
                <text x="580" y="325" font-size="18" class="scene2-meter-value" text-anchor="middle" id="scene2-value-P">3.0 W</text>
            </g>
            
            <!-- 灯泡亮度区 y=360~440 -->
            <g id="scene2-bulb-brightness">
                <circle cx="240" cy="400" r="35" fill="#ffc107" opacity="1" id="scene2-bulb-icon"/>
                <circle cx="240" cy="400" r="45" fill="#ffc107" opacity="0.3" class="scene2-bulb-glow" id="scene2-bulb-glow"/>
                <text x="290" y="405" font-size="14" fill="#000">亮度</text>
            </g>
            
            <!-- 趋势箭头区 y=260~420 -->
            <g id="scene2-trend-arrows">
                <!-- I 趋势 -->
                <text x="660" y="295" font-size="12" fill="#000" text-anchor="middle">I</text>
                <polygon id="scene2-arrow-I" class="scene2-arrow-down" points="660,305 655,320 665,320"/>
                
                <!-- U1 趋势 -->
                <text x="700" y="295" font-size="12" fill="#000" text-anchor="middle">U₁</text>
                <polygon id="scene2-arrow-V1" class="scene2-arrow-up" points="700,320 695,305 705,305"/>
                
                <!-- U2 趋势 -->
                <text x="660" y="345" font-size="12" fill="#000" text-anchor="middle">U₂</text>
                <polygon id="scene2-arrow-V2" class="scene2-arrow-down" points="660,355 655,370 665,370"/>
                
                <!-- P 总趋势 -->
                <text x="700" y="345" font-size="12" fill="#000" text-anchor="middle">P_总</text>
                <polygon id="scene2-arrow-P" class="scene2-arrow-down" points="700,370 695,355 705,355"/>
            </g>
            
            <!-- 滑块控制区 y=440~480 -->
            <g id="scene2-slider-control">
                <!-- 轨道 -->
                <rect x="150" y="450" width="500" height="12" fill="#ddd" stroke="#999" stroke-width="1" id="scene2-slider-track"/>
                <!-- 手柄 -->
                <circle cx="150" cy="456" r="12" fill="#333" stroke="#666" stroke-width="2" id="scene2-slider-handle" style="cursor: pointer;"/>
                <!-- 标签 -->
                <text x="130" y="475" font-size="14" fill="#000" text-anchor="end">左端</text>
                <text x="670" y="475" font-size="14" fill="#000" text-anchor="start">右端</text>
                <text x="150" y="440" font-size="12" fill="#666" text-anchor="middle" id="scene2-slider-label">P 位置</text>
            </g>
        </svg>
        
        <div id="scene2-controls"></div>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现：滑片移动时电路动态变化分析
        
        // 物理参数
        const U = 6;        // 电源电压 6V
        const R_L = 12;     // 灯泡电阻 12Ω
        const R_MAX = 50;   // 变阻器最大电阻 50Ω
        
        // 滑块状态
        let sliderPosition = 0;  // 0~1, 0=左端, 1=右端
        let isDragging = false;
        
        // DOM 元素
        const sliderHandle = document.getElementById('scene2-slider-handle');
        const sliderLabel = document.getElementById('scene2-slider-label');
        const sliderP = document.getElementById('scene2-slider-p');
        const bulbIcon = document.getElementById('scene2-bulb-icon');
        const bulbGlow = document.getElementById('scene2-bulb-glow');
        const valueI = document.getElementById('scene2-value-I');
        const valueV1 = document.getElementById('scene2-value-V1');
        const valueV2 = document.getElementById('scene2-value-V2');
        const valueP = document.getElementById('scene2-value-P');
        const arrowI = document.getElementById('scene2-arrow-I');
        const arrowV1 = document.getElementById('scene2-arrow-V1');
        const arrowV2 = document.getElementById('scene2-arrow-V2');
        const arrowP = document.getElementById('scene2-arrow-P');
        
        // 滑块轨道参数
        const trackStartX = 150;
        const trackLength = 500;
        
        // 计算物理量
        function calculateValues(pos) {
            const R_slide = pos * R_MAX;  // 变阻器接入电阻
            const I = U / (R_L + R_slide);  // 电流
            const U1 = I * R_slide;  // 变阻器两端电压
            const U2 = I * R_L;  // 灯泡两端电压
            const P_total = U * I;  // 总功率
            const brightness = 0.3 + (1 - pos) * 0.7;  // 亮度 30%~100%
            
            return { R_slide, I, U1, U2, P_total, brightness };
        }
        
        // 更新显示
        function updateDisplay(pos) {
            const vals = calculateValues(pos);
            
            // 更新数值显示
            valueI.textContent = vals.I.toFixed(2) + ' A';
            valueV1.textContent = vals.U1.toFixed(1) + ' V';
            valueV2.textContent = vals.U2.toFixed(1) + ' V';
            valueP.textContent = vals.P_total.toFixed(1) + ' W';
            
            // 更新灯泡亮度
            bulbIcon.setAttribute('opacity', vals.brightness.toFixed(2));
            bulbGlow.setAttribute('opacity', (vals.brightness * 0.5).toFixed(2));
            
            // 更新滑片位置
            const sliderX = trackStartX + pos * trackLength;
            sliderHandle.setAttribute('cx', sliderX);
            sliderLabel.setAttribute('x', sliderX);
            
            // 更新电路图中滑片 P 的位置 (380~500)
            const pX = 380 + pos * 120;
            sliderP.querySelector('line').setAttribute('x1', pX);
            sliderP.querySelector('line').setAttribute('x2', pX);
            sliderP.querySelector('polygon').setAttribute('points', `${pX},60 ${pX-5},70 ${pX+5},70`);
            
            // 更新趋势箭头方向（右移时：I↓, U1↑, U2↓, P↓）
            // 箭头初始状态已设置为右移趋势
        }
        
        // 鼠标/触摸事件处理
        function startDrag(e) {
            isDragging = true;
            e.preventDefault();
        }
        
        function doDrag(e) {
            if (!isDragging) return;
            
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const rect = document.getElementById('scene2-slider-track').getBoundingClientRect();
            let newX = clientX - rect.left;
            newX = Math.max(0, Math.min(trackLength, newX));
            
            sliderPosition = newX / trackLength;
            updateDisplay(sliderPosition);
        }
        
        function endDrag() {
            isDragging = false;
        }
        
        // 绑定事件
        sliderHandle.addEventListener('mousedown', startDrag);
        sliderHandle.addEventListener('touchstart', startDrag);
        
        document.addEventListener('mousemove', doDrag);
        document.addEventListener('touchmove', doDrag);
        
        document.addEventListener('mouseup', endDrag);
        document.addEventListener('touchend', endDrag);
        
        // 初始化显示
        updateDisplay(0);
        
    })();
    </script>
</body>
</html>
