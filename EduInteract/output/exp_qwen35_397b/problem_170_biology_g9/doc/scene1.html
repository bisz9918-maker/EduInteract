<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>集合包含关系模型</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }
        .scene1-btn {
            width: 100px;
            height: 35px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: opacity 0.2s;
        }
        .scene1-btn-prev {
            background: #e0e0e0;
            color: #333;
        }
        .scene1-btn-next {
            background: #1565c0;
            color: #fff;
        }
        .scene1-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .scene1-step-indicator {
            font-size: 14px;
            color: #666;
            min-width: 80px;
            text-align: center;
        }
        /* 元素显隐控制 */
        .scene1-hidden {
            display: none;
            opacity: 0;
        }
        .scene1-visible {
            display: block;
            opacity: 1;
        }
        /* 淡入动画 */
        .scene1-fade-in {
            animation: scene1FadeIn 0.3s ease-in;
        }
        @keyframes scene1FadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 大圆Ⅰ：圆心(400,250) r=180，填充#e0e0e0透明度30% -->
            <circle id="scene1-big-circle" cx="400" cy="250" r="180" fill="#e0e0e0" fill-opacity="0.3" stroke="#000" stroke-width="2"/>
            
            <!-- 小圆Ⅱ：圆心(530,180) r=50，白色填充 -->
            <circle id="scene1-small-circle-2" cx="530" cy="180" r="50" fill="#ffffff" stroke="#000" stroke-width="2"/>
            
            <!-- 小圆Ⅲ：圆心(300,320) r=50，白色填充 -->
            <circle id="scene1-small-circle-3" cx="300" cy="320" r="50" fill="#ffffff" stroke="#000" stroke-width="2"/>
            
            <!-- 小圆Ⅳ：圆心(530,320) r=50，白色填充 -->
            <circle id="scene1-small-circle-4" cx="530" cy="320" r="50" fill="#ffffff" stroke="#000" stroke-width="2"/>
            
            <!-- 标签Ⅰ：(230,150) 大圆内空白区域，不与其他圆重叠 -->
            <text id="scene1-label-1" x="230" y="150" font-size="24" fill="#000" text-anchor="middle">Ⅰ</text>
            
            <!-- 标签Ⅱ：(530,180) 小圆Ⅱ中心 -->
            <text id="scene1-label-2" x="530" y="180" font-size="20" fill="#000" text-anchor="middle">Ⅱ</text>
            
            <!-- 标签Ⅲ：(300,320) 小圆Ⅲ中心 -->
            <text id="scene1-label-3" x="300" y="320" font-size="20" fill="#000" text-anchor="middle">Ⅲ</text>
            
            <!-- 标签Ⅳ：(530,320) 小圆Ⅳ中心 -->
            <text id="scene1-label-4" x="530" y="320" font-size="20" fill="#000" text-anchor="middle">Ⅳ</text>
            
            <!-- 步骤1：大圆高亮边框 -->
            <circle id="scene1-highlight-big" cx="400" cy="250" r="180" fill="none" stroke="#1565c0" stroke-width="3" class="scene1-hidden"/>
            
            <!-- 步骤1：父集标注文字 -->
            <text id="scene1-label-parent" x="400" y="25" font-size="16" fill="#1565c0" text-anchor="middle" class="scene1-hidden">父集/大类别</text>
            
            <!-- 步骤2：小圆高亮边框 -->
            <circle id="scene1-highlight-small-2" cx="530" cy="180" r="50" fill="none" stroke="#1565c0" stroke-width="3" class="scene1-hidden"/>
            <circle id="scene1-highlight-small-3" cx="300" cy="320" r="50" fill="none" stroke="#1565c0" stroke-width="3" class="scene1-hidden"/>
            <circle id="scene1-highlight-small-4" cx="530" cy="320" r="50" fill="none" stroke="#1565c0" stroke-width="3" class="scene1-hidden"/>
            
            <!-- 步骤2：并列子类别标注 -->
            <text id="scene1-label-children" x="400" y="465" font-size="16" fill="#1565c0" text-anchor="middle" class="scene1-hidden">并列子类别</text>
            
            <!-- 步骤3：包含关系箭头 (400,45)→(400,75) -->
            <line id="scene1-include-arrow-line" x1="400" y1="45" x2="400" y2="65" stroke="#1565c0" stroke-width="2" class="scene1-hidden"/>
            <polygon id="scene1-include-arrow-head" points="400,75 395,63 405,63" fill="#1565c0" class="scene1-hidden"/>
            <text id="scene1-label-include" x="280" y="58" font-size="14" fill="#1565c0" class="scene1-hidden">Ⅰ包含Ⅱ、Ⅲ、Ⅳ</text>
            
            <!-- 步骤3：并列关系箭头 (350,410)→(480,410) 更靠下避免与小圆重叠 -->
            <line id="scene1-exclusive-arrow-line" x1="350" y1="410" x2="470" y2="410" stroke="#1565c0" stroke-width="2" class="scene1-hidden"/>
            <polygon id="scene1-exclusive-arrow-head" points="480,410 468,405 468,415" fill="#1565c0" class="scene1-hidden"/>
            <text id="scene1-label-exclusive" x="415" y="435" font-size="14" fill="#1565c0" text-anchor="middle" class="scene1-hidden">Ⅱ、Ⅲ、Ⅳ互斥</text>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn scene1-btn-prev" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator" class="scene1-step-indicator">步骤 1/4</span>
            <button id="scene1-btn-next" class="scene1-btn scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现
        // 布局坐标表对照：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // |------|------|-----------|------|-------------|------|
        // | 大圆Ⅰ | 圆形 | 圆心(400,250) | r=180 | - | 居中，填充#e0e0e0透明度30% |
        // | 小圆Ⅱ | 圆形 | 圆心(530,180) | r=50 | - | 右上位置 |
        // | 小圆Ⅲ | 圆形 | 圆心(300,320) | r=50 | - | 左下位置 |
        // | 小圆Ⅳ | 圆形 | 圆心(530,320) | r=50 | - | 右下位置 |
        // | 标签Ⅰ | text | (230,150) | ~30×20 | 大圆内空白 | 罗马数字 |
        // | 标签Ⅱ | text | (530,180) | ~25×20 | 小圆Ⅱ中心 | 罗马数字 |
        // | 标签Ⅲ | text | (300,320) | ~25×20 | 小圆Ⅲ中心 | 罗马数字 |
        // | 标签Ⅳ | text | (530,320) | ~25×20 | 小圆Ⅳ中心 | 罗马数字 |
        
        let currentStep = 0;
        const totalSteps = 4;
        
        // 获取 DOM 元素
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        
        // 步骤1元素
        const highlightBig = document.getElementById('scene1-highlight-big');
        const labelParent = document.getElementById('scene1-label-parent');
        
        // 步骤2元素
        const highlightSmall2 = document.getElementById('scene1-highlight-small-2');
        const highlightSmall3 = document.getElementById('scene1-highlight-small-3');
        const highlightSmall4 = document.getElementById('scene1-highlight-small-4');
        const labelChildren = document.getElementById('scene1-label-children');
        
        // 步骤3元素
        const includeArrowLine = document.getElementById('scene1-include-arrow-line');
        const includeArrowHead = document.getElementById('scene1-include-arrow-head');
        const labelInclude = document.getElementById('scene1-label-include');
        const exclusiveArrowLine = document.getElementById('scene1-exclusive-arrow-line');
        const exclusiveArrowHead = document.getElementById('scene1-exclusive-arrow-head');
        const labelExclusive = document.getElementById('scene1-label-exclusive');
        
        // 工具函数：显示元素
        function show(el) {
            el.classList.remove('scene1-hidden');
            el.classList.add('scene1-visible', 'scene1-fade-in');
        }
        
        // 工具函数：隐藏元素
        function hide(el) {
            el.classList.remove('scene1-visible', 'scene1-fade-in');
            el.classList.add('scene1-hidden');
        }
        
        // 更新步骤显示
        function updateStep() {
            // 隐藏所有步骤元素
            hide(highlightBig);
            hide(labelParent);
            hide(highlightSmall2);
            hide(highlightSmall3);
            hide(highlightSmall4);
            hide(labelChildren);
            hide(includeArrowLine);
            hide(includeArrowHead);
            hide(labelInclude);
            hide(exclusiveArrowLine);
            hide(exclusiveArrowHead);
            hide(labelExclusive);
            
            // 根据当前步骤显示对应元素
            if (currentStep >= 1) {
                show(highlightBig);
                show(labelParent);
            }
            if (currentStep >= 2) {
                show(highlightSmall2);
                show(highlightSmall3);
                show(highlightSmall4);
                show(labelChildren);
            }
            if (currentStep >= 3) {
                // 步骤3：隐藏高亮边框，显示关系箭头
                hide(highlightBig);
                hide(highlightSmall2);
                hide(highlightSmall3);
                hide(highlightSmall4);
                hide(labelChildren);
                show(includeArrowLine);
                show(includeArrowHead);
                show(labelInclude);
                show(exclusiveArrowLine);
                show(exclusiveArrowHead);
                show(labelExclusive);
            }
            
            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps - 1);
            
            // 更新步骤指示器
            stepIndicator.textContent = `步骤 ${currentStep + 1}/${totalSteps}`;
        }
        
        // 上一步按钮点击
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });
        
        // 下一步按钮点击
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateStep();
            }
        });
        
        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
