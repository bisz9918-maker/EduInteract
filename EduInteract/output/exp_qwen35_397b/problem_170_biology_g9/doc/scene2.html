<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 概念关系对比验证</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene2-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene2-svg {
            width: 800px;
            height: 500px;
        }
        .scene2-btn {
            width: 80px;
            height: 35px;
            border: 2px solid #333;
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.2s;
        }
        .scene2-btn:hover {
            background: #e3f2fd;
        }
        .scene2-btn.active {
            background: #1565c0;
            color: #fff;
            border-color: #1565c0;
        }
        .scene2-label {
            font-size: 14px;
            fill: #000;
        }
        .scene2-title {
            font-size: 16px;
            font-weight: bold;
            fill: #000;
        }
        .scene2-judgment {
            font-size: 20px;
            font-weight: bold;
        }
        .scene2-reason-text {
            font-size: 13px;
            fill: #333;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500">
            <!-- 分隔线 -->
            <line id="scene2-divider" x1="320" y1="50" x2="320" y2="350" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>

            <!-- 左侧题目原图区 -->
            <g id="scene2-original-group">
                <!-- 标题 -->
                <text id="scene2-original-title" x="120" y="45" text-anchor="middle" class="scene2-title">题目图示</text>
                
                <!-- 外圆 I -->
                <circle id="scene2-original-outer" cx="120" cy="200" r="80" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                
                <!-- 内圆 II (右上) -->
                <circle id="scene2-original-inner-2" cx="145" cy="175" r="22" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                
                <!-- 内圆 III (左下) -->
                <circle id="scene2-original-inner-3" cx="90" cy="215" r="22" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                
                <!-- 内圆 IV (右下) -->
                <circle id="scene2-original-inner-4" cx="155" cy="215" r="22" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                
                <!-- 标签 I (外圆左上外部，远离圆) -->
                <text id="scene2-label-original-I" x="50" y="105" class="scene2-label">I</text>
                
                <!-- 标签 II (内圆上方外部，远离圆) -->
                <text id="scene2-label-original-II" x="145" y="145" text-anchor="middle" class="scene2-label">II</text>
                
                <!-- 标签 III (内圆上方外部，远离圆) -->
                <text id="scene2-label-original-III" x="90" y="185" text-anchor="middle" class="scene2-label">III</text>
                
                <!-- 标签 IV (内圆上方外部，远离圆) -->
                <text id="scene2-label-original-IV" x="155" y="185" text-anchor="middle" class="scene2-label">IV</text>
            </g>

            <!-- 右侧选项动态图区 -->
            <g id="scene2-option-group">
                <!-- 占位提示文字 -->
                <text id="scene2-placeholder" x="520" y="250" text-anchor="middle" font-size="16px" fill="#666">请选择一个选项</text>
                
                <!-- 外圆（动态） -->
                <circle id="scene2-option-outer" cx="520" cy="200" r="80" fill="#ffffff" stroke="#1565c0" stroke-width="2" style="display:none;"/>
                
                <!-- 外圆标签（动态） -->
                <text id="scene2-label-option-outer" x="520" y="105" text-anchor="middle" class="scene2-label" style="display:none;"/>
                
                <!-- 内圆 1（动态） -->
                <circle id="scene2-option-inner-1" cx="485" cy="175" r="22" fill="#ffffff" stroke="#000000" stroke-width="2" style="display:none;"/>
                <text id="scene2-label-option-1" x="485" y="145" text-anchor="middle" class="scene2-label" style="display:none;"/>
                
                <!-- 内圆 2（动态） -->
                <circle id="scene2-option-inner-2" cx="460" cy="215" r="22" fill="#ffffff" stroke="#000000" stroke-width="2" style="display:none;"/>
                <text id="scene2-label-option-2" x="460" y="185" text-anchor="middle" class="scene2-label" style="display:none;"/>
                
                <!-- 内圆 3（动态） -->
                <circle id="scene2-option-inner-3" cx="540" cy="215" r="22" fill="#ffffff" stroke="#000000" stroke-width="2" style="display:none;"/>
                <text id="scene2-label-option-3" x="540" y="185" text-anchor="middle" class="scene2-label" style="display:none;"/>
                
                <!-- 判断标记 -->
                <text id="scene2-judgment-mark" x="520" y="305" text-anchor="middle" class="scene2-judgment" style="display:none;"/>
                
                <!-- 理由框 -->
                <rect id="scene2-reason-box" x="400" y="325" width="240" height="65" fill="#f5f5f5" stroke="#ccc" stroke-width="1" style="display:none;"/>
                <text id="scene2-reason-text" x="520" y="348" text-anchor="middle" class="scene2-reason-text" style="display:none;"/>
                <text id="scene2-reason-text-2" x="520" y="372" text-anchor="middle" class="scene2-reason-text" style="display:none;"/>
            </g>

            <!-- 底部按钮区 -->
            <g id="scene2-controls">
                <foreignObject x="110" y="445" width="80" height="35">
                    <button id="scene2-btn-a" class="scene2-btn">选项 A</button>
                </foreignObject>
                <foreignObject x="220" y="445" width="80" height="35">
                    <button id="scene2-btn-b" class="scene2-btn">选项 B</button>
                </foreignObject>
                <foreignObject x="330" y="445" width="80" height="35">
                    <button id="scene2-btn-c" class="scene2-btn">选项 C</button>
                </foreignObject>
                <foreignObject x="440" y="445" width="80" height="35">
                    <button id="scene2-btn-d" class="scene2-btn">选项 D</button>
                </foreignObject>
            </g>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 2 实现 - 多状态切换交互

        // 状态变量
        let currentOption = null;

        // 选项数据配置
        const optionData = {
            'A': {
                outerLabel: '鱼类',
                innerLabels: ['爬行类', '鸟类', '哺乳类'],
                innerPositions: [
                    { cx: 485, cy: 175 },  // 右上
                    { cx: 460, cy: 215 },  // 左下
                    { cx: 540, cy: 215 }   // 右下
                ],
                isMatch: false,
                judgment: '✗ 不符合',
                judgmentColor: '#c62828',
                reason1: '鱼类、爬行类、鸟类、哺乳类',
                reason2: '是并列关系，鱼类不包含其他三类'
            },
            'B': {
                outerLabel: '细胞核',
                innerLabels: ['染色体', 'DNA', '基因'],
                innerPositions: [
                    { cx: 520, cy: 200, r: 50 },  // 嵌套：染色体
                    { cx: 520, cy: 200, r: 32 },  // 嵌套：DNA
                    { cx: 520, cy: 200, r: 16 }   // 嵌套：基因
                ],
                isMatch: false,
                judgment: '✗ 不符合',
                judgmentColor: '#c62828',
                reason1: '细胞核、染色体、DNA、基因',
                reason2: '是层级包含关系，不是大圆含三个并列小圆'
            },
            'C': {
                outerLabel: '种子',
                innerLabels: ['胚', '子叶', '种皮'],
                innerPositions: [
                    { cx: 490, cy: 190, r: 38 },  // 胚（中等圆）
                    { cx: 490, cy: 190, r: 18 },  // 子叶（小圆，在胚内）
                    { cx: 550, cy: 215 }         // 种皮（独立小圆）
                ],
                isMatch: false,
                judgment: '✗ 不符合',
                judgmentColor: '#c62828',
                reason1: '种子包含胚和种皮，胚包含子叶',
                reason2: '是两层嵌套关系'
            },
            'D': {
                outerLabel: '微生物',
                innerLabels: ['病毒', '细菌', '真菌'],
                innerPositions: [
                    { cx: 485, cy: 175 },  // 右上
                    { cx: 460, cy: 215 },  // 左下
                    { cx: 540, cy: 215 }   // 右下
                ],
                isMatch: true,
                judgment: '✓ 符合',
                judgmentColor: '#2e7d32',
                reason1: '微生物包含病毒、细菌、真菌',
                reason2: '三者是并列关系，与图示相符'
            }
        };

        // DOM 元素引用
        const placeholder = document.getElementById('scene2-placeholder');
        const optionOuter = document.getElementById('scene2-option-outer');
        const labelOptionOuter = document.getElementById('scene2-label-option-outer');
        const optionInner1 = document.getElementById('scene2-option-inner-1');
        const labelOption1 = document.getElementById('scene2-label-option-1');
        const optionInner2 = document.getElementById('scene2-option-inner-2');
        const labelOption2 = document.getElementById('scene2-label-option-2');
        const optionInner3 = document.getElementById('scene2-option-inner-3');
        const labelOption3 = document.getElementById('scene2-label-option-3');
        const judgmentMark = document.getElementById('scene2-judgment-mark');
        const reasonBox = document.getElementById('scene2-reason-box');
        const reasonText1 = document.getElementById('scene2-reason-text');
        const reasonText2 = document.getElementById('scene2-reason-text-2');
        const btnA = document.getElementById('scene2-btn-a');
        const btnB = document.getElementById('scene2-btn-b');
        const btnC = document.getElementById('scene2-btn-c');
        const btnD = document.getElementById('scene2-btn-d');

        // 隐藏元素工具函数
        function hideElement(el) {
            el.style.display = 'none';
            el.style.opacity = '0';
        }

        // 显示元素工具函数
        function showElement(el) {
            el.style.display = '';
            el.style.opacity = '1';
        }

        // 清除右侧选项图
        function clearOptionDisplay() {
            hideElement(placeholder);
            hideElement(optionOuter);
            hideElement(labelOptionOuter);
            hideElement(optionInner1);
            hideElement(labelOption1);
            hideElement(optionInner2);
            hideElement(labelOption2);
            hideElement(optionInner3);
            hideElement(labelOption3);
            hideElement(judgmentMark);
            hideElement(reasonBox);
            hideElement(reasonText1);
            hideElement(reasonText2);
        }

        // 显示选项 A/D 类型（三个并列小圆）
        function showParallelCircles(data) {
            showElement(optionOuter);
            showElement(labelOptionOuter);
            labelOptionOuter.textContent = data.outerLabel;

            showElement(optionInner1);
            showElement(labelOption1);
            optionInner1.setAttribute('cx', data.innerPositions[0].cx);
            optionInner1.setAttribute('cy', data.innerPositions[0].cy);
            labelOption1.setAttribute('x', data.innerPositions[0].cx);
            labelOption1.setAttribute('y', data.innerPositions[0].cy - 30);
            labelOption1.textContent = data.innerLabels[0];

            showElement(optionInner2);
            showElement(labelOption2);
            optionInner2.setAttribute('cx', data.innerPositions[1].cx);
            optionInner2.setAttribute('cy', data.innerPositions[1].cy);
            labelOption2.setAttribute('x', data.innerPositions[1].cx);
            labelOption2.setAttribute('y', data.innerPositions[1].cy - 30);
            labelOption2.textContent = data.innerLabels[1];

            showElement(optionInner3);
            showElement(labelOption3);
            optionInner3.setAttribute('cx', data.innerPositions[2].cx);
            optionInner3.setAttribute('cy', data.innerPositions[2].cy);
            labelOption3.setAttribute('x', data.innerPositions[2].cx);
            labelOption3.setAttribute('y', data.innerPositions[2].cy - 30);
            labelOption3.textContent = data.innerLabels[2];
        }

        // 显示选项 B 类型（四层嵌套）
        function showNestedCirclesB(data) {
            showElement(optionOuter);
            showElement(labelOptionOuter);
            labelOptionOuter.textContent = data.outerLabel;

            // 染色体（大圆）
            showElement(optionInner1);
            showElement(labelOption1);
            optionInner1.setAttribute('cx', 520);
            optionInner1.setAttribute('cy', 200);
            optionInner1.setAttribute('r', 50);
            labelOption1.setAttribute('x', 520);
            labelOption1.setAttribute('y', 145);
            labelOption1.textContent = data.innerLabels[0];

            // DNA（中圆）
            showElement(optionInner2);
            showElement(labelOption2);
            optionInner2.setAttribute('cx', 520);
            optionInner2.setAttribute('cy', 200);
            optionInner2.setAttribute('r', 32);
            labelOption2.setAttribute('x', 520);
            labelOption2.setAttribute('y', 165);
            labelOption2.textContent = data.innerLabels[1];

            // 基因（小圆）
            showElement(optionInner3);
            showElement(labelOption3);
            optionInner3.setAttribute('cx', 520);
            optionInner3.setAttribute('cy', 200);
            optionInner3.setAttribute('r', 16);
            labelOption3.setAttribute('x', 520);
            labelOption3.setAttribute('y', 205);
            labelOption3.textContent = data.innerLabels[2];
        }

        // 显示选项 C 类型（两层嵌套）
        function showNestedCirclesC(data) {
            showElement(optionOuter);
            showElement(labelOptionOuter);
            labelOptionOuter.textContent = data.outerLabel;

            // 胚（中等圆）
            showElement(optionInner1);
            showElement(labelOption1);
            optionInner1.setAttribute('cx', 490);
            optionInner1.setAttribute('cy', 190);
            optionInner1.setAttribute('r', 38);
            labelOption1.setAttribute('x', 490);
            labelOption1.setAttribute('y', 145);
            labelOption1.textContent = data.innerLabels[0];

            // 子叶（小圆，在胚内）
            showElement(optionInner2);
            showElement(labelOption2);
            optionInner2.setAttribute('cx', 490);
            optionInner2.setAttribute('cy', 190);
            optionInner2.setAttribute('r', 18);
            labelOption2.setAttribute('x', 490);
            labelOption2.setAttribute('y', 195);
            labelOption2.textContent = data.innerLabels[1];

            // 种皮（独立小圆）
            showElement(optionInner3);
            showElement(labelOption3);
            optionInner3.setAttribute('cx', 550);
            optionInner3.setAttribute('cy', 215);
            optionInner3.setAttribute('r', 22);
            labelOption3.setAttribute('x', 550);
            labelOption3.setAttribute('y', 185);
            labelOption3.textContent = data.innerLabels[2];
        }

        // 显示判断标记和理由
        function showJudgment(data) {
            showElement(judgmentMark);
            judgmentMark.textContent = data.judgment;
            judgmentMark.setAttribute('fill', data.judgmentColor);

            showElement(reasonBox);
            showElement(reasonText1);
            showElement(reasonText2);
            reasonText1.textContent = data.reason1;
            reasonText2.textContent = data.reason2;
        }

        // 更新按钮状态
        function updateButtons(selectedOption) {
            btnA.classList.remove('active');
            btnB.classList.remove('active');
            btnC.classList.remove('active');
            btnD.classList.remove('active');

            if (selectedOption === 'A') btnA.classList.add('active');
            if (selectedOption === 'B') btnB.classList.add('active');
            if (selectedOption === 'C') btnC.classList.add('active');
            if (selectedOption === 'D') btnD.classList.add('active');
        }

        // 处理选项点击
        function handleOptionClick(option) {
            currentOption = option;
            clearOptionDisplay();

            const data = optionData[option];

            // 根据选项类型绘制不同图形
            if (option === 'A' || option === 'D') {
                showParallelCircles(data);
            } else if (option === 'B') {
                showNestedCirclesB(data);
            } else if (option === 'C') {
                showNestedCirclesC(data);
            }

            showJudgment(data);
            updateButtons(option);
        }

        // 绑定按钮事件
        btnA.addEventListener('click', function() { handleOptionClick('A'); });
        btnB.addEventListener('click', function() { handleOptionClick('B'); });
        btnC.addEventListener('click', function() { handleOptionClick('C'); });
        btnD.addEventListener('click', function() { handleOptionClick('D'); });

    })();
    </script>
</body>
</html>
