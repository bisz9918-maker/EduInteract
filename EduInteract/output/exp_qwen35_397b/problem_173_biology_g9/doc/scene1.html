<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>碳循环示意图</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-svg { width: 800px; height: 500px; }
        .scene1-node { fill: #ffffff; stroke: #888888; stroke-width: 2px; }
        .scene1-arrow { fill: none; stroke: #888888; stroke-width: 2px; }
        .scene1-arrow-highlight-blue { stroke: #1565c0; stroke-width: 3px; }
        .scene1-arrow-highlight-green { stroke: #2e7d32; stroke-width: 3px; }
        .scene1-arrow-highlight-orange { stroke: #f57c00; stroke-width: 3px; }
        .scene1-label { font-size: 16px; fill: #333333; }
        .scene1-annotation-text { font-size: 14px; fill: #ffffff; }
        .scene1-annotation-bg { fill: #1565c0; opacity: 0.9; }
        .scene1-conclusion-text { font-size: 16px; fill: #ffffff; font-weight: bold; }
        .scene1-option-text { font-size: 12px; fill: #333333; }
        .scene1-option-rect { fill: #ffffff; stroke: #888888; stroke-width: 1px; }
        .scene1-option-a-highlight { stroke: #2e7d32; stroke-width: 3px; }
        .scene1-btn-group { cursor: pointer; }
        .scene1-btn-rect { fill: #1976d2; }
        .scene1-btn-text { font-size: 14px; fill: #ffffff; pointer-events: none; }
        .scene1-hidden { display: none; }
        .scene1-visible { display: block; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <defs>
                <!-- 箭头标记 -->
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#888888" />
                </marker>
                <marker id="scene1-arrowhead-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#1565c0" />
                </marker>
                <marker id="scene1-arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#2e7d32" />
                </marker>
                <marker id="scene1-arrowhead-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#f57c00" />
                </marker>
            </defs>

            <!-- 大气 CO₂框 -->
            <g id="scene1-atmosphere-group">
                <rect id="scene1-atmosphere-box" x="200" y="25" width="400" height="40" fill="#f5f5f5" stroke="#888888" stroke-width="1px" rx="5" />
                <text id="scene1-atmosphere-label" x="400" y="50" text-anchor="middle" class="scene1-label">大气中的二氧化碳</text>
            </g>

            <!-- 节点圆形 -->
            <g id="scene1-nodes">
                <circle id="scene1-node-jia" cx="180" cy="220" r="35" class="scene1-node" />
                <text x="180" y="225" text-anchor="middle" class="scene1-label">甲</text>
                
                <circle id="scene1-node-yi" cx="400" cy="380" r="35" class="scene1-node" />
                <text x="400" y="385" text-anchor="middle" class="scene1-label">乙</text>
                
                <circle id="scene1-node-bing" cx="620" cy="220" r="35" class="scene1-node" />
                <text x="620" y="225" text-anchor="middle" class="scene1-label">丙</text>
            </g>

            <!-- 箭头 -->
            <g id="scene1-arrows">
                <!-- 大气↔甲 双向箭头（两条线） -->
                <line id="scene1-arrow-atm-jia-1" x1="380" y1="65" x2="200" y2="190" class="scene1-arrow" marker-end="url(#scene1-arrowhead)" />
                <line id="scene1-arrow-atm-jia-2" x1="220" y1="190" x2="400" y2="65" class="scene1-arrow" marker-end="url(#scene1-arrowhead)" />
                
                <!-- 甲→丙 单向箭头 -->
                <line id="scene1-arrow-jia-bing" x1="215" y1="220" x2="585" y2="220" class="scene1-arrow" marker-end="url(#scene1-arrowhead)" />
                
                <!-- 甲→乙 单向箭头 -->
                <line id="scene1-arrow-jia-yi" x1="205" y1="250" x2="375" y2="350" class="scene1-arrow" marker-end="url(#scene1-arrowhead)" />
                
                <!-- 丙→乙 单向箭头 -->
                <line id="scene1-arrow-bing-yi" x1="595" y1="250" x2="425" y2="350" class="scene1-arrow" marker-end="url(#scene1-arrowhead)" />
                
                <!-- 乙→大气 单向箭头 -->
                <line id="scene1-arrow-yi-atm" x1="400" y1="345" x2="400" y2="65" class="scene1-arrow" marker-end="url(#scene1-arrowhead)" />
                
                <!-- 丙→大气 单向箭头 -->
                <line id="scene1-arrow-bing-atm" x1="590" y1="190" x2="550" y2="65" class="scene1-arrow" marker-end="url(#scene1-arrowhead)" />
            </g>

            <!-- 注释文本框（步骤 1-3 显示） -->
            <g id="scene1-annotations">
                <!-- 步骤 1 注释 -->
                <g id="scene1-annotation-step1" class="scene1-hidden">
                    <rect x="260" y="120" width="140" height="30" rx="5" class="scene1-annotation-bg" />
                    <text x="330" y="140" text-anchor="middle" class="scene1-annotation-text">双向交换→生产者</text>
                </g>
                <!-- 步骤 2 注释 -->
                <g id="scene1-annotation-step2" class="scene1-hidden">
                    <rect x="320" y="195" width="180" height="30" rx="5" fill="#2e7d32" opacity="0.9" />
                    <text x="410" y="215" text-anchor="middle" class="scene1-annotation-text">甲被丙摄食→丙是消费者</text>
                </g>
                <!-- 步骤 3 注释 -->
                <g id="scene1-annotation-step3" class="scene1-hidden">
                    <rect x="200" y="410" width="180" height="30" rx="5" fill="#f57c00" opacity="0.9" />
                    <text x="290" y="430" text-anchor="middle" class="scene1-annotation-text">分解遗体释放 CO₂→乙是分解者</text>
                </g>
            </g>

            <!-- 结论框（步骤 4 显示） -->
            <g id="scene1-conclusions" class="scene1-hidden">
                <g id="scene1-conclusion-jia">
                    <rect x="50" y="270" width="160" height="36" rx="5" fill="#1565c0" />
                    <text x="130" y="293" text-anchor="middle" class="scene1-conclusion-text">甲=生产者</text>
                </g>
                <g id="scene1-conclusion-yi">
                    <rect x="320" y="415" width="160" height="30" rx="5" fill="#f57c00" />
                    <text x="400" y="435" text-anchor="middle" class="scene1-conclusion-text">乙=分解者</text>
                </g>
                <g id="scene1-conclusion-bing">
                    <rect x="590" y="270" width="160" height="36" rx="5" fill="#2e7d32" />
                    <text x="670" y="293" text-anchor="middle" class="scene1-conclusion-text">丙=消费者</text>
                </g>
            </g>

            <!-- 选项框（向右移动，避开箭头） -->
            <g id="scene1-options">
                <g id="scene1-option-a">
                    <rect x="520" y="320" width="250" height="26" class="scene1-option-rect" />
                    <text x="530" y="338" class="scene1-option-text">A. 甲为生产者，乙为分解者，丙为消费者</text>
                </g>
                <g id="scene1-option-b">
                    <rect x="520" y="350" width="250" height="26" class="scene1-option-rect" />
                    <text x="530" y="368" class="scene1-option-text">B. 甲为消费者，乙为分解者，丙为生产者</text>
                </g>
                <g id="scene1-option-c">
                    <rect x="520" y="380" width="250" height="26" class="scene1-option-rect" />
                    <text x="530" y="398" class="scene1-option-text">C. 甲为分解者，乙为生产者，丙为消费者</text>
                </g>
                <g id="scene1-option-d">
                    <rect x="520" y="410" width="250" height="26" class="scene1-option-rect" />
                    <text x="530" y="428" class="scene1-option-text">D. 甲为生产者，乙为消费者，丙为分解者</text>
                </g>
            </g>

            <!-- 控件栏（向左移动，避开乙=分解者） -->
            <g id="scene1-controls">
                <g id="scene1-btn-prev" class="scene1-btn-group">
                    <rect id="scene1-btn-prev-bg" x="240" y="455" width="80" height="30" rx="5" class="scene1-btn-rect" />
                    <text x="280" y="475" text-anchor="middle" class="scene1-btn-text">◀ 上一步</text>
                </g>
                
                <text id="scene1-step-indicator" x="360" y="475" text-anchor="middle" class="scene1-label">步骤 0/4</text>
                
                <g id="scene1-btn-next" class="scene1-btn-group">
                    <rect id="scene1-btn-next-bg" x="400" y="455" width="80" height="30" rx="5" class="scene1-btn-rect" />
                    <text x="440" y="475" text-anchor="middle" class="scene1-btn-text">下一步 ▶</text>
                </g>
            </g>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 1 碳循环示意图实现
        
        let currentState = 0;
        const totalSteps = 4;
        
        // 获取 DOM 元素
        const stepIndicator = document.getElementById('scene1-step-indicator');
        const btnPrevGroup = document.getElementById('scene1-btn-prev');
        const btnNextGroup = document.getElementById('scene1-btn-next');
        
        // 箭头元素
        const arrowsStep1 = ['scene1-arrow-atm-jia-1', 'scene1-arrow-atm-jia-2'];
        const arrowsStep2 = ['scene1-arrow-jia-bing'];
        const arrowsStep3 = ['scene1-arrow-jia-yi', 'scene1-arrow-bing-yi', 'scene1-arrow-yi-atm'];
        
        // 注释元素
        const annotationStep1 = document.getElementById('scene1-annotation-step1');
        const annotationStep2 = document.getElementById('scene1-annotation-step2');
        const annotationStep3 = document.getElementById('scene1-annotation-step3');
        const annotationsGroup = document.getElementById('scene1-annotations');
        
        // 结论元素
        const conclusionsGroup = document.getElementById('scene1-conclusions');
        const optionA = document.getElementById('scene1-option-a');
        const optionARect = optionA.querySelector('rect');
        
        // 更新步骤显示
        function updateStepIndicator() {
            stepIndicator.textContent = '步骤 ' + currentState + '/4';
        }
        
        // 重置所有高亮
        function resetHighlights() {
            // 重置所有箭头为灰色
            const allArrows = document.querySelectorAll('.scene1-arrow');
            allArrows.forEach(arrow => {
                arrow.classList.remove('scene1-arrow-highlight-blue', 'scene1-arrow-highlight-green', 'scene1-arrow-highlight-orange');
                arrow.setAttribute('marker-end', 'url(#scene1-arrowhead)');
                arrow.setAttribute('marker-start', '');
            });
            
            // 隐藏所有注释
            annotationStep1.classList.add('scene1-hidden');
            annotationStep1.classList.remove('scene1-visible');
            annotationStep2.classList.add('scene1-hidden');
            annotationStep2.classList.remove('scene1-visible');
            annotationStep3.classList.add('scene1-hidden');
            annotationStep3.classList.remove('scene1-visible');
            
            // 隐藏结论
            conclusionsGroup.classList.add('scene1-hidden');
            conclusionsGroup.classList.remove('scene1-visible');
            
            // 重置选项 A 样式
            optionARect.classList.remove('scene1-option-a-highlight');
        }
        
        // 应用当前步骤的高亮
        function applyStepHighlights(step) {
            if (step >= 1) {
                // 步骤 1：高亮大气↔甲双向箭头（蓝色）
                arrowsStep1.forEach(id => {
                    const arrow = document.getElementById(id);
                    arrow.classList.add('scene1-arrow-highlight-blue');
                    arrow.setAttribute('marker-end', 'url(#scene1-arrowhead-blue)');
                });
                annotationStep1.classList.remove('scene1-hidden');
                annotationStep1.classList.add('scene1-visible');
            }
            
            if (step >= 2) {
                // 步骤 2：高亮甲→丙箭头（绿色）
                arrowsStep2.forEach(id => {
                    const arrow = document.getElementById(id);
                    arrow.classList.add('scene1-arrow-highlight-green');
                    arrow.setAttribute('marker-end', 'url(#scene1-arrowhead-green)');
                });
                annotationStep2.classList.remove('scene1-hidden');
                annotationStep2.classList.add('scene1-visible');
            }
            
            if (step >= 3) {
                // 步骤 3：高亮分解相关箭头（橙色）
                arrowsStep3.forEach(id => {
                    const arrow = document.getElementById(id);
                    arrow.classList.add('scene1-arrow-highlight-orange');
                    arrow.setAttribute('marker-end', 'url(#scene1-arrowhead-orange)');
                });
                annotationStep3.classList.remove('scene1-hidden');
                annotationStep3.classList.add('scene1-visible');
            }
            
            if (step >= 4) {
                // 步骤 4：显示结论，高亮选项 A
                annotationsGroup.classList.add('scene1-hidden');
                annotationsGroup.classList.remove('scene1-visible');
                conclusionsGroup.classList.remove('scene1-hidden');
                conclusionsGroup.classList.add('scene1-visible');
                optionARect.classList.add('scene1-option-a-highlight');
            }
        }
        
        // 更新显示状态
        function updateDisplay() {
            resetHighlights();
            applyStepHighlights(currentState);
            updateStepIndicator();
        }
        
        // 按钮点击事件
        btnPrevGroup.addEventListener('click', function() {
            if (currentState > 0) {
                currentState--;
                updateDisplay();
            }
        });
        
        btnNextGroup.addEventListener('click', function() {
            if (currentState < totalSteps) {
                currentState++;
                updateDisplay();
            }
        });
        
        // 初始显示
        updateDisplay();
    })();
    </script>
</body>
</html>
