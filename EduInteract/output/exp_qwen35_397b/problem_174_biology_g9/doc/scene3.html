<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>突触传递机制 - 兴奋性与抑制性递质对比</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene3-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #333; border-radius: 4px; background: #f5f5f5; }
        .scene3-btn:hover { background: #e0e0e0; }
        .scene3-btn.active { background: #1565c0; color: white; border-color: #1565c0; }
        .scene3-hidden { display: none; opacity: 0; }
        .scene3-visible { display: block; opacity: 1; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg width="800" height="500" id="scene3-svg">
            <!-- 定义渐变和标记 -->
            <defs>
                <marker id="scene3-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#333" />
                </marker>
            </defs>

            <!-- 电位图框架 -->
            <rect id="scene3-potential-frame" x="500" y="60" width="260" height="280" fill="none" stroke="#333" stroke-width="2"/>
            
            <!-- 电位图坐标轴 -->
            <line x1="520" y1="60" x2="520" y2="340" stroke="#333" stroke-width="2"/>
            <line x1="520" y1="340" x2="760" y2="340" stroke="#333" stroke-width="2"/>
            
            <!-- 静息电位基线（虚线） -->
            <line id="scene3-resting-line" x1="520" y1="280" x2="740" y2="280" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>
            
            <!-- 动作电位曲线（状态1显示） -->
            <path id="scene3-action-potential-curve" class="scene3-hidden" d="M 520 280 L 540 280 L 560 220 L 580 180 L 600 200 L 620 240 L 640 270 L 660 280 L 740 280" fill="none" stroke="#1565c0" stroke-width="3"/>
            
            <!-- 电位图标签 -->
            <text id="scene3-label-potential-y" x="485" y="200" font-size="12" fill="#333">电位 mV</text>
            <text id="scene3-label-time" x="630" y="355" font-size="12" fill="#333">时间 t</text>
            <text id="scene3-label-action-potential" x="750" y="200" font-size="12" fill="#1565c0" class="scene3-hidden">动作电位</text>
            <text id="scene3-label-resting" x="750" y="280" font-size="12" fill="#888888">静息电位</text>
            
            <!-- 状态标题 -->
            <text id="scene3-state-title" x="630" y="40" font-size="16" fill="#333" text-anchor="middle">原始状态</text>

            <!-- 电流计 -->
            <circle id="scene3-galvanometer" cx="320" cy="70" r="25" fill="white" stroke="#333" stroke-width="2"/>
            <line id="scene3-galvanometer-needle" x1="320" y1="70" x2="320" y2="50" stroke="#c62828" stroke-width="2"/>
            <text x="320" y="45" font-size="12" fill="#333" text-anchor="middle">G</text>

            <!-- 导线 a -->
            <line x1="150" y1="320" x2="150" y2="70" stroke="#333" stroke-width="2"/>
            <line x1="150" y1="70" x2="295" y2="70" stroke="#333" stroke-width="2"/>
            
            <!-- 导线 d -->
            <line x1="450" y1="320" x2="450" y2="70" stroke="#333" stroke-width="2"/>
            <line x1="450" y1="70" x2="345" y2="70" stroke="#333" stroke-width="2"/>

            <!-- 电极点 a -->
            <circle id="scene3-electrode-a" cx="150" cy="320" r="4" fill="#333"/>
            <text id="scene3-label-a" x="135" y="340" font-size="14" fill="#333">a</text>

            <!-- 电极点 d -->
            <circle id="scene3-electrode-d" cx="450" cy="320" r="4" fill="#333"/>
            <text id="scene3-label-d" x="455" y="340" font-size="14" fill="#333">d</text>

            <!-- 神经元 A（左下方，抑制性） -->
            <ellipse id="scene3-neuron-a" cx="170" cy="280" rx="30" ry="22" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
            <!-- A 的轴突 -->
            <line x1="170" y1="300" x2="220" y2="260" stroke="#c62828" stroke-width="4"/>
            <!-- A 的突触小泡（4个） -->
            <circle class="scene3-vesicle-a" cx="180" cy="285" r="4" fill="#888888"/>
            <circle class="scene3-vesicle-a" cx="190" cy="280" r="4" fill="#888888"/>
            <circle class="scene3-vesicle-a" cx="185" cy="290" r="4" fill="#888888"/>
            <circle class="scene3-vesicle-a" cx="195" cy="285" r="4" fill="#888888"/>
            <text id="scene3-label-a-neuron" x="140" y="310" font-size="14" fill="#333">A</text>

            <!-- 神经元 B（中间） -->
            <ellipse id="scene3-neuron-b" cx="260" cy="200" rx="40" ry="30" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
            <!-- B 的轴突 -->
            <line x1="260" y1="230" x2="260" y2="320" stroke="#1565c0" stroke-width="4"/>
            <!-- B 的突触小泡（5个） -->
            <circle class="scene3-vesicle-b" cx="270" cy="190" r="5" fill="#888888"/>
            <circle class="scene3-vesicle-b" cx="280" cy="195" r="5" fill="#888888"/>
            <circle class="scene3-vesicle-b" cx="275" cy="200" r="5" fill="#888888"/>
            <circle class="scene3-vesicle-b" cx="285" cy="205" r="5" fill="#888888"/>
            <circle class="scene3-vesicle-b" cx="290" cy="200" r="5" fill="#888888"/>
            <text id="scene3-label-b-neuron" x="260" y="170" font-size="14" fill="#333" text-anchor="middle">B</text>
            <text id="scene3-label-b-stimulus" x="260" y="145" font-size="14" fill="#333" text-anchor="middle">b↓</text>

            <!-- 神经元 C（右侧） -->
            <ellipse id="scene3-neuron-c" cx="400" cy="200" rx="35" ry="27" fill="#f5f5f5" stroke="#888888" stroke-width="2"/>
            <!-- C 的轴突 -->
            <line x1="400" y1="230" x2="400" y2="320" stroke="#888888" stroke-width="4"/>
            <text id="scene3-label-c-neuron" x="400" y="170" font-size="14" fill="#333" text-anchor="middle">C</text>
            <text id="scene3-label-c-stimulus" x="400" y="145" font-size="14" fill="#333" text-anchor="middle">c↓</text>

            <!-- B→C 突触间隙 -->
            <line x1="320" y1="180" x2="340" y2="220" stroke="none"/>
            
            <!-- A→B 突触间隙 -->
            <line x1="210" y1="250" x2="230" y2="280" stroke="none"/>

            <!-- 兴奋性递质分子（状态1显示） -->
            <circle id="scene3-excitatory-vesicle-1" class="scene3-hidden" cx="310" cy="195" r="5" fill="#2e7d32"/>
            <circle id="scene3-excitatory-vesicle-2" class="scene3-hidden" cx="320" cy="200" r="5" fill="#2e7d32"/>
            <circle id="scene3-excitatory-vesicle-3" class="scene3-hidden" cx="330" cy="195" r="5" fill="#2e7d32"/>
            <circle id="scene3-excitatory-vesicle-4" class="scene3-hidden" cx="325" cy="205" r="5" fill="#2e7d32"/>
            <circle id="scene3-excitatory-vesicle-5" class="scene3-hidden" cx="315" cy="210" r="5" fill="#2e7d32"/>
            <text id="scene3-label-excitatory" x="330" y="155" font-size="12" fill="#2e7d32" class="scene3-hidden">兴奋性递质</text>

            <!-- 抑制性递质分子（状态2显示） -->
            <circle id="scene3-inhibitory-vesicle-1" class="scene3-hidden" cx="210" cy="260" r="5" fill="#c62828"/>
            <circle id="scene3-inhibitory-vesicle-2" class="scene3-hidden" cx="220" cy="265" r="5" fill="#c62828"/>
            <circle id="scene3-inhibitory-vesicle-3" class="scene3-hidden" cx="215" cy="270" r="5" fill="#c62828"/>
            <circle id="scene3-inhibitory-vesicle-4" class="scene3-hidden" cx="225" cy="260" r="5" fill="#c62828"/>
            <text id="scene3-label-inhibitory" x="220" y="230" font-size="12" fill="#c62828" class="scene3-hidden">抑制性递质</text>

            <!-- C 状态标签 -->
            <text id="scene3-label-c-excited" x="400" y="350" font-size="14" fill="#2e7d32" text-anchor="middle" class="scene3-hidden">C 兴奋</text>
            <text id="scene3-label-c-not-excited" x="400" y="350" font-size="14" fill="#888888" text-anchor="middle" class="scene3-hidden">C 不兴奋</text>

            <!-- 控件栏 -->
            <g id="scene3-controls">
                <rect x="490" y="455" width="70" height="35" fill="#f5f5f5" stroke="#333" stroke-width="1" rx="4" class="scene3-btn-bg" data-state="0"/>
                <text x="525" y="477" font-size="13" fill="#333" text-anchor="middle">重置</text>
                
                <rect x="570" y="455" width="120" height="35" fill="#f5f5f5" stroke="#333" stroke-width="1" rx="4" class="scene3-btn-bg" data-state="1"/>
                <text x="630" y="477" font-size="13" fill="#333" text-anchor="middle">B 单独受刺激</text>
                
                <rect x="700" y="455" width="140" height="35" fill="#f5f5f5" stroke="#333" stroke-width="1" rx="4" class="scene3-btn-bg" data-state="2"/>
                <text x="770" y="477" font-size="13" fill="#333" text-anchor="middle">A、B 同时受刺激</text>
            </g>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 3 实现：兴奋性与抑制性递质作用机制对比
        
        // 布局坐标表（实现对照依据）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 备注 |
        // | 神经元 B 胞体 | 椭圆 | 中心 (260, 200) | 80×60 | 左侧主神经元 |
        // | 神经元 C 胞体 | 椭圆 | 中心 (400, 200) | 70×55 | 右侧接收神经元 |
        // | 神经元 A 末梢 | 椭圆 | 中心 (170, 280) | 60×45 | 左下方抑制性神经元 |
        // | 电流计 | 圆形+指针 | (320, 70) | r=25 | 顶部中央 |
        // | 电位图框架 | 矩形 | (500, 60)-(760, 340) | 260×280 | 右侧坐标区 |
        
        let currentState = 0; // 0: 原始状态, 1: B 单独受刺激, 2: A、B 同时受刺激
        let isAnimating = false;

        // 工具函数：显示元素
        function show(el) {
            if (el) {
                el.classList.remove('scene3-hidden');
                el.classList.add('scene3-visible');
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }

        // 工具函数：隐藏元素
        function hide(el) {
            if (el) {
                el.classList.remove('scene3-visible');
                el.classList.add('scene3-hidden');
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }

        // 获取元素
        const elements = {
            // 神经元
            neuronA: document.getElementById('scene3-neuron-a'),
            neuronB: document.getElementById('scene3-neuron-b'),
            neuronC: document.getElementById('scene3-neuron-c'),
            vesiclesA: document.querySelectorAll('.scene3-vesicle-a'),
            vesiclesB: document.querySelectorAll('.scene3-vesicle-b'),
            
            // 递质分子
            excitatoryVesicles: [
                document.getElementById('scene3-excitatory-vesicle-1'),
                document.getElementById('scene3-excitatory-vesicle-2'),
                document.getElementById('scene3-excitatory-vesicle-3'),
                document.getElementById('scene3-excitatory-vesicle-4'),
                document.getElementById('scene3-excitatory-vesicle-5')
            ],
            inhibitoryVesicles: [
                document.getElementById('scene3-inhibitory-vesicle-1'),
                document.getElementById('scene3-inhibitory-vesicle-2'),
                document.getElementById('scene3-inhibitory-vesicle-3'),
                document.getElementById('scene3-inhibitory-vesicle-4')
            ],
            
            // 标签
            labelExcitatory: document.getElementById('scene3-label-excitatory'),
            labelInhibitory: document.getElementById('scene3-label-inhibitory'),
            labelCExcited: document.getElementById('scene3-label-c-excited'),
            labelCNotExcited: document.getElementById('scene3-label-c-not-excited'),
            labelActionPotential: document.getElementById('scene3-label-action-potential'),
            stateTitle: document.getElementById('scene3-state-title'),
            
            // 电位图
            actionPotentialCurve: document.getElementById('scene3-action-potential-curve'),
            restingLine: document.getElementById('scene3-resting-line'),
            
            // 电流计
            needle: document.getElementById('scene3-galvanometer-needle'),
            
            // 按钮
            btnReset: document.querySelector('.scene3-btn-bg[data-state="0"]'),
            btnBOnly: document.querySelector('.scene3-btn-bg[data-state="1"]'),
            btnABSimultaneous: document.querySelector('.scene3-btn-bg[data-state="2"]')
        };

        // 更新状态
        function updateState(newState) {
            if (isAnimating) return;
            isAnimating = true;
            currentState = newState;

            // 重置所有状态
            resetAllStates();

            if (newState === 0) {
                // 原始状态
                elements.stateTitle.textContent = '原始状态';
                isAnimating = false;
            } else if (newState === 1) {
                // 状态 1: B 单独受刺激
                elements.stateTitle.textContent = 'B 单独受刺激';
                animateState1();
            } else if (newState === 2) {
                // 状态 2: A、B 同时受刺激
                elements.stateTitle.textContent = 'A、B 同时受刺激';
                animateState2();
            }
        }

        // 重置所有状态
        function resetAllStates() {
            // 神经元恢复默认样式
            elements.neuronA.setAttribute('fill', '#ffebee');
            elements.neuronA.setAttribute('stroke', '#c62828');
            elements.neuronB.setAttribute('fill', '#e3f2fd');
            elements.neuronB.setAttribute('stroke', '#1565c0');
            elements.neuronC.setAttribute('fill', '#f5f5f5');
            elements.neuronC.setAttribute('stroke', '#888888');
            
            // 突触小泡恢复灰色
            elements.vesiclesA.forEach(v => v.setAttribute('fill', '#888888'));
            elements.vesiclesB.forEach(v => v.setAttribute('fill', '#888888'));
            
            // 隐藏所有递质分子
            elements.excitatoryVesicles.forEach(v => hide(v));
            elements.inhibitoryVesicles.forEach(v => hide(v));
            
            // 隐藏标签
            hide(elements.labelExcitatory);
            hide(elements.labelInhibitory);
            hide(elements.labelCExcited);
            hide(elements.labelCNotExcited);
            hide(elements.labelActionPotential);
            
            // 隐藏动作电位曲线
            hide(elements.actionPotentialCurve);
            show(elements.restingLine);
            
            // 电流计指针归位
            elements.needle.setAttribute('transform', 'rotate(0, 320, 70)');
        }

        // 动画状态 1: B 单独受刺激
        function animateState1() {
            // B 神经元高亮
            elements.neuronB.setAttribute('fill', '#e8f5e9');
            elements.neuronB.setAttribute('stroke', '#2e7d32');
            
            // B 的突触小泡变绿
            elements.vesiclesB.forEach(v => v.setAttribute('fill', '#2e7d32'));
            
            // 显示兴奋性递质分子并动画
            elements.excitatoryVesicles.forEach((v, i) => {
                show(v);
                const startX = 270 + i * 5;
                const startY = 190 + (i % 2) * 10;
                const endX = 330 + i * 3;
                const endY = 200 + (i % 3) * 5;
                
                v.setAttribute('cx', startX);
                v.setAttribute('cy', startY);
                
                setTimeout(() => {
                    v.style.transition = 'cx 1s ease-out, cy 1s ease-out';
                    v.setAttribute('cx', endX);
                    v.setAttribute('cy', endY);
                }, 100 * i);
            });
            
            // 显示标签
            setTimeout(() => {
                show(elements.labelExcitatory);
            }, 500);
            
            // C 神经元兴奋
            setTimeout(() => {
                elements.neuronC.setAttribute('fill', '#e8f5e9');
                elements.neuronC.setAttribute('stroke', '#2e7d32');
                show(elements.labelCExcited);
            }, 1200);
            
            // 电流计指针偏转（2 次）
            setTimeout(() => {
                animateGalvanometerState1();
            }, 800);
            
            // 显示动作电位曲线
            setTimeout(() => {
                show(elements.actionPotentialCurve);
                show(elements.labelActionPotential);
                isAnimating = false;
            }, 1500);
        }

        // 电流计状态 1 动画（2 次偏转）
        function animateGalvanometerState1() {
            const needle = elements.needle;
            let phase = 0;
            const phases = [30, -30, 0]; // 右偏 -> 左偏 -> 归位
            
            function nextPhase() {
                if (phase < phases.length) {
                    needle.setAttribute('transform', `rotate(${phases[phase]}, 320, 70)`);
                    phase++;
                    setTimeout(nextPhase, 400);
                }
            }
            nextPhase();
        }

        // 动画状态 2: A、B 同时受刺激
        function animateState2() {
            // A 神经元高亮
            elements.neuronA.setAttribute('fill', '#ffebee');
            elements.neuronA.setAttribute('stroke', '#c62828');
            
            // A 的突触小泡变红
            elements.vesiclesA.forEach(v => v.setAttribute('fill', '#c62828'));
            
            // B 的突触小泡保持灰色（被抑制）
            elements.vesiclesB.forEach(v => v.setAttribute('fill', '#888888'));
            
            // 显示抑制性递质分子并动画
            elements.inhibitoryVesicles.forEach((v, i) => {
                show(v);
                const startX = 180 + i * 5;
                const startY = 280 + (i % 2) * 5;
                const endX = 220 + i * 2;
                const endY = 265 + (i % 3) * 3;
                
                v.setAttribute('cx', startX);
                v.setAttribute('cy', startY);
                
                setTimeout(() => {
                    v.style.transition = 'cx 1s ease-out, cy 1s ease-out';
                    v.setAttribute('cx', endX);
                    v.setAttribute('cy', endY);
                }, 100 * i);
            });
            
            // 显示标签
            setTimeout(() => {
                show(elements.labelInhibitory);
            }, 500);
            
            // C 神经元不兴奋（保持灰色）
            setTimeout(() => {
                elements.neuronC.setAttribute('fill', '#f5f5f5');
                elements.neuronC.setAttribute('stroke', '#888888');
                show(elements.labelCNotExcited);
            }, 1200);
            
            // 电流计指针偏转（1 次轻微）
            setTimeout(() => {
                animateGalvanometerState2();
            }, 800);
            
            // 仅显示静息电位线
            setTimeout(() => {
                hide(elements.actionPotentialCurve);
                show(elements.restingLine);
                isAnimating = false;
            }, 1500);
        }

        // 电流计状态 2 动画（1 次轻微偏转）
        function animateGalvanometerState2() {
            const needle = elements.needle;
            let phase = 0;
            const phases = [15, 0]; // 轻微右偏 -> 归位
            
            function nextPhase() {
                if (phase < phases.length) {
                    needle.setAttribute('transform', `rotate(${phases[phase]}, 320, 70)`);
                    phase++;
                    setTimeout(nextPhase, 400);
                }
            }
            nextPhase();
        }

        // 按钮点击事件
        elements.btnReset.addEventListener('click', () => updateState(0));
        elements.btnBOnly.addEventListener('click', () => updateState(1));
        elements.btnABSimultaneous.addEventListener('click', () => updateState(2));

    })();
    </script>
</body>
</html>
