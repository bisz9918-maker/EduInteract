<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>植物分类树状图</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: "Microsoft YaHei", sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        .feature-box {
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .feature-box.visible {
            opacity: 1;
        }
        .highlight-box {
            stroke: #2e7d32;
            stroke-width: 3;
            fill: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .highlight-box.visible {
            opacity: 1;
        }
        .option-result {
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .option-result.visible {
            opacity: 1;
        }
        #scene1-controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }
        #scene1-controls button {
            padding: 6px 14px;
            font-size: 13px;
            cursor: pointer;
            border: 1px solid #1565c0;
            background: #e3f2fd;
            border-radius: 4px;
        }
        #scene1-controls button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #scene1-step-indicator {
            font-size: 13px;
            color: #333;
            min-width: 80px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 树状连线 -->
            <line x1="400" y1="50" x2="400" y2="90" stroke="#000" stroke-width="2"/>
            <line x1="250" y1="90" x2="550" y2="90" stroke="#000" stroke-width="2"/>
            <line x1="250" y1="90" x2="250" y2="110" stroke="#000" stroke-width="2"/>
            <line x1="550" y1="90" x2="550" y2="110" stroke="#000" stroke-width="2"/>
            <line x1="150" y1="170" x2="350" y2="170" stroke="#000" stroke-width="2"/>
            <line x1="150" y1="170" x2="150" y2="190" stroke="#000" stroke-width="2"/>
            <line x1="350" y1="170" x2="350" y2="190" stroke="#000" stroke-width="2"/>
            <line x1="250" y1="250" x2="450" y2="250" stroke="#000" stroke-width="2"/>
            <line x1="250" y1="250" x2="250" y2="270" stroke="#000" stroke-width="2"/>
            <line x1="450" y1="250" x2="450" y2="270" stroke="#000" stroke-width="2"/>

            <!-- 节点文字 -->
            <text x="400" y="40" text-anchor="middle" font-size="16" fill="#000">无果实植物</text>
            <text x="250" y="110" text-anchor="middle" font-size="14" fill="#000">无种子</text>
            <text x="550" y="110" text-anchor="middle" font-size="14" fill="#000">有种子</text>
            <text x="150" y="190" text-anchor="middle" font-size="14" fill="#000">无茎叶</text>
            <text x="350" y="190" text-anchor="middle" font-size="14" fill="#000">有茎叶</text>
            <text x="250" y="270" text-anchor="middle" font-size="14" fill="#000">有输导组织</text>
            <text x="450" y="270" text-anchor="middle" font-size="14" fill="#000">无输导组织</text>

            <!-- 编号圆圈（放在节点文字下方 25px） -->
            <circle id="scene1-circle-1" cx="550" cy="145" r="12" fill="#1565c0"/>
            <text x="550" y="150" text-anchor="middle" font-size="12" fill="#fff">①</text>
            
            <circle id="scene1-circle-2" cx="150" cy="225" r="12" fill="#1565c0"/>
            <text x="150" y="230" text-anchor="middle" font-size="12" fill="#fff">②</text>
            
            <circle id="scene1-circle-3" cx="250" cy="305" r="12" fill="#1565c0"/>
            <text x="250" y="310" text-anchor="middle" font-size="12" fill="#fff">③</text>
            
            <circle id="scene1-circle-4" cx="450" cy="305" r="12" fill="#1565c0"/>
            <text x="450" y="310" text-anchor="middle" font-size="12" fill="#fff">④</text>

            <!-- 高亮框（初始隐藏） -->
            <rect id="scene1-highlight-1" x="515" y="95" width="70" height="60" class="highlight-box"/>
            <rect id="scene1-highlight-2" x="115" y="175" width="70" height="60" class="highlight-box"/>
            <rect id="scene1-highlight-3" x="205" y="255" width="90" height="60" class="highlight-box"/>
            <rect id="scene1-highlight-4" x="405" y="255" width="90" height="60" class="highlight-box"/>

            <!-- 特征框（初始隐藏）- 放在右侧空白区域 -->
            <g id="scene1-feature-1" class="feature-box">
                <rect x="620" y="115" width="160" height="50" fill="#e3f2fd" rx="5"/>
                <text x="700" y="138" text-anchor="middle" font-size="12" fill="#333">种子裸露，无果皮包被</text>
                <text x="700" y="155" text-anchor="middle" font-size="12" fill="#333">如松、柏、银杏</text>
            </g>
            
            <g id="scene1-feature-2" class="feature-box">
                <rect x="20" y="245" width="160" height="50" fill="#e3f2fd" rx="5"/>
                <text x="100" y="268" text-anchor="middle" font-size="12" fill="#333">无根茎叶分化</text>
                <text x="100" y="285" text-anchor="middle" font-size="12" fill="#333">大多生活在水中</text>
            </g>
            
            <g id="scene1-feature-3" class="feature-box">
                <rect x="310" y="325" width="160" height="50" fill="#e3f2fd" rx="5"/>
                <text x="390" y="348" text-anchor="middle" font-size="12" fill="#333">有根茎叶，有输导组织</text>
                <text x="390" y="365" text-anchor="middle" font-size="12" fill="#333">孢子繁殖，如肾蕨</text>
            </g>
            
            <g id="scene1-feature-4" class="feature-box">
                <rect x="510" y="325" width="160" height="50" fill="#e3f2fd" rx="5"/>
                <text x="590" y="348" text-anchor="middle" font-size="12" fill="#333">有茎叶，无输导组织</text>
                <text x="590" y="365" text-anchor="middle" font-size="12" fill="#333">无真正根，如葫芦藓</text>
            </g>

            <!-- 选项判断（初始隐藏）- 放在中间空白区域 -->
            <g id="scene1-option-a" class="option-result">
                <text x="120" y="395" font-size="13" fill="#333">A ✗</text>
            </g>
            <g id="scene1-option-b" class="option-result">
                <text x="260" y="395" font-size="13" fill="#333">B ✗</text>
            </g>
            <g id="scene1-option-c" class="option-result">
                <text x="400" y="395" font-size="13" fill="#333">C ✗</text>
            </g>
            <g id="scene1-option-d" class="option-result">
                <text x="540" y="395" font-size="13" fill="#333">D ✓</text>
            </g>
        </svg>
        
        <!-- HTML 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 0/6</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现 - 植物分类树状图分步导航
        
        let currentStep = 0;
        const totalSteps = 6;
        
        // 获取 DOM 元素
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        
        // 高亮框
        const highlights = [
            document.getElementById('scene1-highlight-1'),
            document.getElementById('scene1-highlight-2'),
            document.getElementById('scene1-highlight-3'),
            document.getElementById('scene1-highlight-4')
        ];
        
        // 特征框
        const features = [
            document.getElementById('scene1-feature-1'),
            document.getElementById('scene1-feature-2'),
            document.getElementById('scene1-feature-3'),
            document.getElementById('scene1-feature-4')
        ];
        
        // 选项结果
        const options = [
            document.getElementById('scene1-option-a'),
            document.getElementById('scene1-option-b'),
            document.getElementById('scene1-option-c'),
            document.getElementById('scene1-option-d')
        ];
        
        // 更新状态函数
        function updateState() {
            // 更新步骤指示器
            stepIndicator.textContent = `步骤 ${currentStep}/${totalSteps}`;
            
            // 隐藏所有高亮框和特征框
            highlights.forEach(el => el.classList.remove('visible'));
            features.forEach(el => el.classList.remove('visible'));
            
            // 步骤 5 显示选项判断
            if (currentStep === 5) {
                options.forEach(el => el.classList.add('visible'));
            } else {
                options.forEach(el => el.classList.remove('visible'));
            }
            
            // 根据当前步骤显示对应的高亮和特征
            if (currentStep >= 1 && currentStep <= 4) {
                highlights[currentStep - 1].classList.add('visible');
                features[currentStep - 1].classList.add('visible');
            }
            
            // 更新按钮状态
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps;
        }
        
        // 上一步
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateState();
            }
        });
        
        // 下一步
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateState();
            }
        });
        
        // 初始状态
        updateState();
    })();
    </script>
</body>
</html>
