<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>过程③：F₁白花自交验证分离定律</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene2-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #333; border-radius: 4px; background: #f0f0f0; }
        .scene2-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene2-step-indicator { font-size: 14px; color: #333; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 标题 -->
            <text id="scene2-title" x="400" y="45" text-anchor="middle" font-size="16" fill="#000000">过程③：F₁白花自交验证分离定律</text>

            <!-- 亲本区域 -->
            <text id="scene2-parent-label" x="200" y="90" font-size="16" fill="#000000">亲本：</text>
            <text id="scene2-parent-genotype" x="280" y="90" font-size="20" font-weight="bold">
                <tspan fill="#2e7d32">A</tspan><tspan fill="#c62828">a</tspan>
            </text>
            <text id="scene2-self-cross-symbol" x="350" y="90" font-size="20" fill="#000000">⊗</text>

            <!-- 配子形成区域 -->
            <text id="scene2-gamete-title" x="150" y="150" font-size="16" fill="#000000">配子形成</text>
            
            <!-- 配子箭头（步骤 1 显示） -->
            <g id="scene2-step1-group" style="display: none;">
                <!-- 箭头 1：Aa → A -->
                <path id="scene2-gamete-arrow-1" d="M 200 180 L 280 180" stroke="#888888" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
                <!-- 箭头 2：Aa → a -->
                <path id="scene2-gamete-arrow-2" d="M 200 200 L 280 220" stroke="#888888" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
                <!-- 配子 A -->
                <text id="scene2-gamete-A" x="300" y="180" font-size="18" fill="#2e7d32">A</text>
                <!-- 配子 a -->
                <text id="scene2-gamete-a" x="300" y="220" font-size="18" fill="#c62828">a</text>
                
                <!-- 分离定律示意简图（同源染色体分离） -->
                <g id="scene2-separation-diagram" transform="translate(80, 260)">
                    <!-- 染色体 1（绿色） -->
                    <line x1="20" y1="20" x2="40" y2="60" stroke="#2e7d32" stroke-width="3"/>
                    <circle cx="30" cy="40" r="5" fill="#2e7d32"/>
                    <!-- 染色体 2（红色） -->
                    <line x1="60" y1="20" x2="40" y2="60" stroke="#c62828" stroke-width="3"/>
                    <circle cx="50" cy="40" r="5" fill="#c62828"/>
                    <!-- 分离箭头 -->
                    <path d="M 30 70 L 20 90" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene2-arrowhead-green)"/>
                    <path d="M 50 70 L 60 90" stroke="#c62828" stroke-width="2" marker-end="url(#scene2-arrowhead-red)"/>
                    <text x="15" y="105" font-size="12" fill="#2e7d32">A</text>
                    <text x="55" y="105" font-size="12" fill="#c62828">a</text>
                </g>
            </g>

            <!-- Punnett 方格区域：标题上移到 y=50，方格下移到 y=70 开始，顶标 y=60 -->
            <text id="scene2-punnett-title" x="650" y="50" font-size="16" fill="#000000" text-anchor="middle">Punnett 方格</text>
            
            <!-- Punnett 方格外框 -->
            <rect id="scene2-punnett-frame" x="550" y="70" width="200" height="200" stroke="#000000" stroke-width="2" fill="none"/>
            <!-- Punnett 方格内线 -->
            <line id="scene2-punnett-hline" x1="550" y1="170" x2="750" y2="170" stroke="#000000" stroke-width="2"/>
            <line id="scene2-punnett-vline" x1="650" y1="70" x2="650" y2="270" stroke="#000000" stroke-width="2"/>

            <!-- 步骤 2：Punnett 方格配子标签 -->
            <g id="scene2-step2-group" style="display: none;">
                <!-- 顶部配子标签：放在方格上方 y=60（方格 y=70 上方 10px） -->
                <text id="scene2-punnett-top-A" x="600" y="60" font-size="16" text-anchor="middle" fill="#2e7d32">A</text>
                <text id="scene2-punnett-top-a" x="700" y="60" font-size="16" text-anchor="middle" fill="#c62828">a</text>
                <!-- 左侧配子标签 -->
                <text id="scene2-punnett-left-A" x="535" y="125" font-size="16" text-anchor="middle" fill="#2e7d32">A</text>
                <text id="scene2-punnett-left-a" x="535" y="225" font-size="16" text-anchor="middle" fill="#c62828">a</text>
            </g>

            <!-- 步骤 3：Punnett 方格填充 -->
            <g id="scene2-step3-group" style="display: none;">
                <!-- 左上 AA（蓝色背景） -->
                <rect id="scene2-punnett-cell-AA-bg" x="555" y="75" width="90" height="90" fill="#1565c0" fill-opacity="0.2"/>
                <text id="scene2-punnett-cell-AA" x="600" y="125" font-size="18" text-anchor="middle" font-weight="bold" fill="#1565c0">AA</text>
                
                <!-- 右上 Aa（蓝色背景） -->
                <rect id="scene2-punnett-cell-Aa1-bg" x="655" y="75" width="90" height="90" fill="#1565c0" fill-opacity="0.2"/>
                <text id="scene2-punnett-cell-Aa1" x="700" y="125" font-size="18" text-anchor="middle" font-weight="bold" fill="#1565c0">Aa</text>
                
                <!-- 左下 Aa（蓝色背景） -->
                <rect id="scene2-punnett-cell-Aa2-bg" x="555" y="175" width="90" height="90" fill="#1565c0" fill-opacity="0.2"/>
                <text id="scene2-punnett-cell-Aa2" x="600" y="225" font-size="18" text-anchor="middle" font-weight="bold" fill="#1565c0">Aa</text>
                
                <!-- 右下 aa（黄色背景） -->
                <rect id="scene2-punnett-cell-aa-bg" x="655" y="175" width="90" height="90" fill="#f9a825" fill-opacity="0.2"/>
                <text id="scene2-punnett-cell-aa" x="700" y="225" font-size="18" text-anchor="middle" font-weight="bold" fill="#f9a825">aa</text>
            </g>

            <!-- 比例区域 -->
            <text id="scene2-ratio-genotype-label" x="180" y="430" font-size="16" fill="#000000" text-anchor="end">基因型比例：</text>
            <text id="scene2-ratio-genotype-value" x="200" y="430" font-size="20" font-weight="bold" fill="#000000" style="display: none;">1:2:1</text>
            
            <text id="scene2-ratio-phenotype-label" x="400" y="430" font-size="16" fill="#000000" text-anchor="end">表现型比例：</text>
            <text id="scene2-ratio-phenotype-value" x="420" y="430" font-size="20" font-weight="bold" fill="#000000" style="display: none;">3 白:1 黄</text>

            <!-- 箭头标记定义 -->
            <defs>
                <marker id="scene2-arrowhead-green" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2e7d32"/>
                </marker>
                <marker id="scene2-arrowhead-red" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#c62828"/>
                </marker>
            </defs>
        </svg>

        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-btn-prev" class="scene2-btn" disabled>◀ 上一步</button>
            <span id="scene2-step-indicator" class="scene2-step-indicator">步骤 0/5</span>
            <button id="scene2-btn-next" class="scene2-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2 实现：过程③的分离定律验证

        // 布局坐标表（实现对照依据）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 备注 |
        // |------|------|-----------|------|------|
        // | 标题文本 | text | (400,45) | ~200×20 | "过程③：F₁白花自交验证分离定律" |
        // | 亲本标签 P | text | (200,90) | ~30×16 | "亲本：" |
        // | 亲本基因型 Aa | text | (280,90) | ~50×20 | 绿色 A+ 红色 a |
        // | 自交符号 ⊗ | text | (350,90) | ~20×20 | 自交标志 |
        // | 配子标题 | text | (150,150) | ~60×16 | "配子形成" |
        // | 配子箭头 1 | path | (200,180)-(280,180) | 80×2 | 灰色虚线 |
        // | 配子箭头 2 | path | (200,200)-(280,220) | 80×25 | 灰色虚线 |
        // | 配子 A | text | (300,180) | ~20×20 | 绿色 #2e7d32 |
        // | 配子 a | text | (300,220) | ~20×20 | 红色 #c62828 |
        // | Punnett 标题 | text | (650,50) | ~60×16 | "Punnett 方格" |
        // | Punnett 外框 | rect | (550,70)-(750,270) | 200×200 | 黑色实线 2px |
        // | Punnett 横线 | line | (550,170)-(750,170) | 200×2 | 黑色实线 2px |
        // | Punnett 竖线 | line | (650,70)-(650,270) | 2×200 | 黑色实线 2px |
        // | 方格左上 AA | text | (600,125) | ~30×16 | 蓝色背景 20% 透明 |
        // | 方格右上 Aa | text | (700,125) | ~30×16 | 蓝色背景 20% 透明 |
        // | 方格左下 Aa | text | (600,225) | ~30×16 | 蓝色背景 20% 透明 |
        // | 方格右下 aa | text | (700,225) | ~30×16 | 黄色背景 20% 透明 |
        // | 方格顶标 A | text | (600,60) | ~15×16 | 绿色 |
        // | 方格顶标 a | text | (700,60) | ~15×16 | 红色 |
        // | 方格左标 A | text | (535,125) | ~15×16 | 绿色 |
        // | 方格左标 a | text | (535,225) | ~15×16 | 红色 |
        // | 基因型比例标题 | text | (180,430) | ~80×16 | "基因型比例：" |
        // | 基因型比例值 | text | (200,430) | ~80×20 | "1:2:1" 加粗 |
        // | 表现型比例标题 | text | (400,430) | ~80×16 | "表现型比例：" |
        // | 表现型比例值 | text | (420,430) | ~80×20 | "3 白:1 黄" 加粗 |
        // | 分离定律示意 | group | (80,260)-(180,360) | 100×100 | 同源染色体分离简图 |
        // | 上一步按钮 | button | (250,455) | 80×30 | "◀ 上一步" |
        // | 下一步按钮 | button | (470,455) | 80×30 | "下一步 ▶" |
        // | 步骤指示 | text | (400,465) | ~60×16 | "步骤 X/5" |

        let currentStep = 0;
        const totalSteps = 5;

        // 获取 DOM 元素
        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        const stepIndicator = document.getElementById('scene2-step-indicator');

        const step1Group = document.getElementById('scene2-step1-group');
        const step2Group = document.getElementById('scene2-step2-group');
        const step3Group = document.getElementById('scene2-step3-group');
        const ratioGenotypeValue = document.getElementById('scene2-ratio-genotype-value');
        const ratioPhenotypeValue = document.getElementById('scene2-ratio-phenotype-value');

        // 工具函数：显示/隐藏元素
        function showElement(el) {
            el.style.display = '';
            el.style.opacity = '1';
        }

        function hideElement(el) {
            el.style.display = 'none';
            el.style.opacity = '0';
        }

        // 更新显示状态
        function updateDisplay() {
            // 根据当前步骤显示/隐藏对应元素
            if (currentStep >= 1) {
                showElement(step1Group);
            } else {
                hideElement(step1Group);
            }

            if (currentStep >= 2) {
                showElement(step2Group);
            } else {
                hideElement(step2Group);
            }

            if (currentStep >= 3) {
                showElement(step3Group);
            } else {
                hideElement(step3Group);
            }

            if (currentStep >= 4) {
                showElement(ratioGenotypeValue);
                showElement(ratioPhenotypeValue);
            } else {
                hideElement(ratioGenotypeValue);
                hideElement(ratioPhenotypeValue);
            }

            // 更新步骤指示器
            stepIndicator.textContent = '步骤 ' + currentStep + '/' + totalSteps;

            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps);
        }

        // 按钮事件处理
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateDisplay();
            }
        });

        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
