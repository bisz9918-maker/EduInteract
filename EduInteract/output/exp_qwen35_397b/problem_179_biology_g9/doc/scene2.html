<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>石灰水反应微观示意图</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #scene2-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene2-svg {
            width: 800px;
            height: 500px;
        }
        .scene2-ion-label {
            font-size: 12px;
            font-weight: bold;
        }
        .scene2-title {
            font-size: 18px;
            font-weight: bold;
        }
        .scene2-equation {
            font-size: 16px;
            font-family: 'Times New Roman', serif;
        }
        .scene2-slider-label {
            font-size: 14px;
        }
        .scene2-arrow-highlight {
            animation: scene2-pulse 1s infinite;
        }
        @keyframes scene2-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500">
            <!-- 标题 -->
            <text id="scene2-title" x="400" y="45" text-anchor="middle" class="scene2-title">石灰水反应微观示意图</text>
            
            <!-- 试管容器 -->
            <rect id="scene2-tube" x="80" y="80" width="300" height="300" rx="15" ry="15" 
                  fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 溶液背景 -->
            <rect id="scene2-solution" x="90" y="150" width="280" height="220" 
                  fill="#e3f2fd" opacity="0.2"/>
            
            <!-- CO₂分子组 -->
            <g id="scene2-co2-group"></g>
            
            <!-- Ca²⁺离子组 -->
            <g id="scene2-ca-ion-group"></g>
            
            <!-- OH⁻离子组 -->
            <g id="scene2-oh-ion-group"></g>
            
            <!-- CaCO₃沉淀组 -->
            <g id="scene2-precipitate-group"></g>
            
            <!-- 反应箭头 -->
            <path id="scene2-reaction-arrow" d="M 200 180 L 270 180 M 260 170 L 270 180 L 260 190" 
                  fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
                  opacity="0"/>
            
            <!-- 离子标签（移到试管外部） -->
            <text id="scene2-ca-label" x="50" y="210" class="scene2-ion-label" fill="#1565c0">Ca²⁺</text>
            <text id="scene2-oh-label" x="400" y="210" class="scene2-ion-label" fill="#c62828">OH⁻</text>
            <text id="scene2-caco3-label" x="230" y="400" text-anchor="middle" class="scene2-ion-label" fill="#616161">CaCO₃沉淀</text>
            
            <!-- CO₂浓度滑块轨道 -->
            <rect id="scene2-slider-track" x="520" y="160" width="200" height="15" 
                  fill="#bdbdbd" rx="7.5" ry="7.5"/>
            
            <!-- CO₂浓度滑块按钮 -->
            <circle id="scene2-slider-thumb" cx="520" cy="167.5" r="12" fill="#1565c0" style="cursor: pointer"/>
            
            <!-- 滑块标签 -->
            <text id="scene2-slider-label" x="620" y="135" text-anchor="middle" class="scene2-slider-label">CO₂浓度</text>
            <text id="scene2-slider-scale" x="620" y="185" text-anchor="middle" class="scene2-slider-label" font-size="12">低 ← → 高</text>
            
            <!-- 浑浊指示条背景 -->
            <rect id="scene2-turbidity-bg" x="520" y="240" width="200" height="100" 
                  fill="#e3f2fd" stroke="#90caf9" stroke-width="1"/>
            
            <!-- 浑浊指示条渐变层 -->
            <g id="scene2-turbidity-bar"></g>
            
            <!-- 浑浊指示条标签 -->
            <text id="scene2-turbidity-label" x="620" y="215" text-anchor="middle" class="scene2-slider-label">浑浊程度</text>
            <text id="scene2-turbidity-scale" x="620" y="355" text-anchor="middle" class="scene2-slider-label" font-size="12">澄清 → 浑浊</text>
            
            <!-- 化学方程式 -->
            <text id="scene2-equation" x="400" y="440" text-anchor="middle" class="scene2-equation">
                CO₂ + Ca(OH)₂ → CaCO₃↓ + H₂O
            </text>
        </svg>
    </div>
    
    <script>
    (function() {
        // Scene 2: 石灰水反应微观示意图
        
        // 预计算离子位置（固定）
        const caPositions = [];
        const ohPositions = [];
        const precipitatePositions = [];
        
        // 生成 Ca²⁺离子位置（12 个）
        for (let i = 0; i < 12; i++) {
            caPositions.push({
                x: 120 + (i % 4) * 70 + Math.random() * 20,
                y: 200 + Math.floor(i / 4) * 55 + Math.random() * 20
            });
        }
        
        // 生成 OH⁻离子位置（12 个）
        for (let i = 0; i < 12; i++) {
            ohPositions.push({
                x: 140 + (i % 4) * 70 + Math.random() * 20,
                y: 220 + Math.floor(i / 4) * 55 + Math.random() * 20
            });
        }
        
        // 生成 CaCO₃沉淀位置（50 个，集中在底部）
        for (let i = 0; i < 50; i++) {
            precipitatePositions.push({
                x: 100 + (i % 10) * 28 + Math.random() * 15,
                y: 280 + Math.floor(i / 10) * 18 + Math.random() * 10,
                r: 5 + Math.random() * 2
            });
        }
        
        // CO₂分子位置（15 个，从顶部飘入）
        const co2Positions = [];
        for (let i = 0; i < 15; i++) {
            co2Positions.push({
                x: 110 + (i % 5) * 55 + Math.random() * 20,
                y: 100 + Math.floor(i / 5) * 35
            });
        }
        
        // 状态变量
        let sliderValue = 0;
        let isDragging = false;
        
        // DOM 元素
        const co2Group = document.getElementById('scene2-co2-group');
        const caGroup = document.getElementById('scene2-ca-ion-group');
        const ohGroup = document.getElementById('scene2-oh-ion-group');
        const precipitateGroup = document.getElementById('scene2-precipitate-group');
        const solutionBg = document.getElementById('scene2-solution');
        const reactionArrow = document.getElementById('scene2-reaction-arrow');
        const sliderThumb = document.getElementById('scene2-slider-thumb');
        const turbidityBar = document.getElementById('scene2-turbidity-bar');
        
        // 初始化离子显示
        function initIons() {
            // Ca²⁺离子
            caPositions.forEach((pos, i) => {
                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', pos.x);
                circle.setAttribute('cy', pos.y);
                circle.setAttribute('r', 8);
                circle.setAttribute('fill', '#1565c0');
                circle.setAttribute('opacity', '0.8');
                caGroup.appendChild(circle);
            });
            
            // OH⁻离子
            ohPositions.forEach((pos, i) => {
                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', pos.x);
                circle.setAttribute('cy', pos.y);
                circle.setAttribute('r', 8);
                circle.setAttribute('fill', '#c62828');
                circle.setAttribute('opacity', '0.8');
                ohGroup.appendChild(circle);
            });
        }
        
        // 更新 CO₂分子显示
        function updateCO2() {
            co2Group.innerHTML = '';
            const co2Count = Math.floor(sliderValue / 100 * 15);
            
            for (let i = 0; i < co2Count; i++) {
                const pos = co2Positions[i];
                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', pos.x);
                circle.setAttribute('cy', pos.y);
                circle.setAttribute('r', 10);
                circle.setAttribute('fill', '#424242');
                circle.setAttribute('opacity', '0.9');
                co2Group.appendChild(circle);
                
                // 第一个分子显示标签（移到试管外部右侧）
                if (i === 0) {
                    const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    label.setAttribute('x', 400);
                    label.setAttribute('y', 120);
                    label.setAttribute('font-size', '12');
                    label.setAttribute('fill', '#424242');
                    label.textContent = 'CO₂';
                    co2Group.appendChild(label);
                }
            }
        }
        
        // 更新沉淀显示
        function updatePrecipitate() {
            precipitateGroup.innerHTML = '';
            const precipitateCount = Math.floor(sliderValue / 100 * 50);
            
            for (let i = 0; i < precipitateCount; i++) {
                const pos = precipitatePositions[i];
                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', pos.x);
                circle.setAttribute('cy', pos.y);
                circle.setAttribute('r', pos.r);
                circle.setAttribute('fill', '#eeeeee');
                circle.setAttribute('stroke', '#bdbdbd');
                circle.setAttribute('stroke-width', '0.5');
                precipitateGroup.appendChild(circle);
            }
        }
        
        // 更新溶液背景透明度
        function updateSolution() {
            const opacity = 0.2 + (sliderValue / 100) * 0.5;
            solutionBg.setAttribute('opacity', opacity);
        }
        
        // 更新反应箭头
        function updateArrow() {
            if (sliderValue > 0) {
                reactionArrow.setAttribute('opacity', '1');
                reactionArrow.classList.add('scene2-arrow-highlight');
            } else {
                reactionArrow.setAttribute('opacity', '0');
                reactionArrow.classList.remove('scene2-arrow-highlight');
            }
        }
        
        // 更新滑块按钮位置
        function updateSliderThumb() {
            const trackWidth = 200;
            const thumbX = 520 + (sliderValue / 100) * trackWidth;
            sliderThumb.setAttribute('cx', thumbX);
        }
        
        // 更新浑浊指示条
        function updateTurbidityBar() {
            turbidityBar.innerHTML = '';
            const barHeight = 100;
            const fillHeight = (sliderValue / 100) * barHeight;
            
            // 创建渐变填充效果
            const numLayers = 10;
            for (let i = 0; i < numLayers; i++) {
                const layerOpacity = 0.1 + (sliderValue / 100) * 0.6 * (i / numLayers);
                const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                rect.setAttribute('x', 520);
                rect.setAttribute('y', 240 + (numLayers - 1 - i) * (barHeight / numLayers));
                rect.setAttribute('width', 200);
                rect.setAttribute('height', barHeight / numLayers);
                rect.setAttribute('fill', '#ffffff');
                rect.setAttribute('opacity', Math.min(layerOpacity, 0.7));
                turbidityBar.appendChild(rect);
            }
        }
        
        // 主更新函数
        function update() {
            updateCO2();
            updatePrecipitate();
            updateSolution();
            updateArrow();
            updateSliderThumb();
            updateTurbidityBar();
        }
        
        // 滑块拖拽事件处理
        function handleSliderEvent(clientX) {
            const trackRect = document.getElementById('scene2-slider-track').getBoundingClientRect();
            const trackLeft = trackRect.left;
            const trackWidth = trackRect.width;
            
            let newValue = ((clientX - trackLeft) / trackWidth) * 100;
            newValue = Math.max(0, Math.min(100, newValue));
            sliderValue = newValue;
            update();
        }
        
        // 鼠标事件
        sliderThumb.addEventListener('mousedown', function(e) {
            isDragging = true;
            e.preventDefault();
        });
        
        document.addEventListener('mousemove', function(e) {
            if (isDragging) {
                handleSliderEvent(e.clientX);
            }
        });
        
        document.addEventListener('mouseup', function() {
            isDragging = false;
        });
        
        // 触摸事件
        sliderThumb.addEventListener('touchstart', function(e) {
            isDragging = true;
            e.preventDefault();
        });
        
        document.addEventListener('touchmove', function(e) {
            if (isDragging) {
                handleSliderEvent(e.touches[0].clientX);
            }
        });
        
        document.addEventListener('touchend', function() {
            isDragging = false;
        });
        
        // 点击滑块轨道直接跳转
        document.getElementById('scene2-slider-track').addEventListener('click', function(e) {
            handleSliderEvent(e.clientX);
        });
        
        // 初始化
        initIons();
        update();
        
    })();
    </script>
</body>
</html>
