<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>呼吸成分比较实验装置</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 12px;
            z-index: 10;
        }
        .scene1-btn {
            padding: 8px 20px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #f5f5f5;
            cursor: pointer;
        }
        .scene1-btn:hover:not(:disabled) {
            background: #e0e0e0;
        }
        .scene1-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        /* 元素显隐控制 */
        .scene1-hidden {
            display: none;
            opacity: 0;
        }
        .scene1-visible {
            display: block;
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 试管1轮廓 -->
            <rect id="scene1-tube1" x="160" y="150" width="80" height="200" rx="10" ry="10" 
                  fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 试管2轮廓 -->
            <rect id="scene1-tube2" x="560" y="150" width="80" height="200" rx="10" ry="10" 
                  fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 试管1石灰水（澄清） -->
            <rect id="scene1-lime1" x="165" y="280" width="70" height="65" 
                  fill="#e3f2fd" opacity="0.3"/>
            
            <!-- 试管2石灰水（澄清） -->
            <rect id="scene1-lime2" x="565" y="280" width="70" height="65" 
                  fill="#e3f2fd" opacity="0.3"/>
            
            <!-- 试管2石灰水浑浊层（初始隐藏） -->
            <rect id="scene1-lime2-turbid" x="565" y="280" width="70" height="65" 
                  fill="#ffffff" opacity="0" class="scene1-hidden"/>
            
            <!-- 浑浊颗粒组（初始隐藏） -->
            <g id="scene1-turbid-particles" class="scene1-hidden">
                <!-- 颗粒由JS动态生成 -->
            </g>
            
            <!-- 水平主管道 -->
            <line id="scene1-pipe-horizontal" x1="100" y1="100" x2="700" y2="100" 
                  stroke="#757575" stroke-width="6"/>
            
            <!-- M口竖管 -->
            <line id="scene1-pipe-m" x1="400" y1="60" x2="400" y2="100" 
                  stroke="#757575" stroke-width="6"/>
            
            <!-- 试管1长竖管（插入液面下） -->
            <line id="scene1-pipe1-long" x1="200" y1="100" x2="200" y2="300" 
                  stroke="#757575" stroke-width="6"/>
            
            <!-- 试管1短竖管（液面上方） -->
            <line id="scene1-pipe1-short" x1="220" y1="100" x2="220" y2="260" 
                  stroke="#757575" stroke-width="6"/>
            
            <!-- 试管2长竖管（插入液面下） -->
            <line id="scene1-pipe2-long" x1="600" y1="100" x2="600" y2="300" 
                  stroke="#757575" stroke-width="6"/>
            
            <!-- 试管2短竖管（液面上方） -->
            <line id="scene1-pipe2-short" x1="580" y1="100" x2="580" y2="260" 
                  stroke="#757575" stroke-width="6"/>
            
            <!-- 夹子X（初始灰色中性状态） -->
            <g id="scene1-clipper-x">
                <line x1="235" y1="90" x2="255" y2="110" stroke="#9e9e9e" stroke-width="3"/>
                <line x1="255" y1="90" x2="235" y2="110" stroke="#9e9e9e" stroke-width="3"/>
            </g>
            
            <!-- 夹子Y（初始灰色中性状态） -->
            <g id="scene1-clipper-y">
                <line x1="545" y1="90" x2="565" y2="110" stroke="#9e9e9e" stroke-width="3"/>
                <line x1="565" y1="90" x2="545" y2="110" stroke="#9e9e9e" stroke-width="3"/>
            </g>
            
            <!-- 气流箭头（初始隐藏） -->
            <g id="scene1-arrow-flow" class="scene1-hidden">
                <defs>
                    <marker id="scene1-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" 
                            orient="auto" markerUnits="strokeWidth">
                        <path d="M0,0 L0,6 L9,3 z" fill="#1565c0"/>
                    </marker>
                </defs>
                <line x1="400" y1="110" x2="550" y2="110" 
                      stroke="#1565c0" stroke-width="4" marker-end="url(#scene1-arrowhead)"/>
            </g>
            
            <!-- 气泡组（初始隐藏） -->
            <g id="scene1-bubble-group" class="scene1-hidden">
                <!-- 气泡由JS动态生成 -->
            </g>
            
            <!-- 试管塞子（黄色） -->
            <rect x="162" y="150" width="76" height="15" fill="#fbc02d" opacity="0.8"/>
            <rect x="562" y="150" width="76" height="15" fill="#fbc02d" opacity="0.8"/>
            
            <!-- 标签 -->
            <text id="scene1-label-m" x="400" y="45" text-anchor="middle" font-size="16" fill="#000000">M</text>
            <text id="scene1-label-clipper-x" x="245" y="75" text-anchor="middle" font-size="14" fill="#000000">夹子X</text>
            <text id="scene1-label-clipper-y" x="555" y="75" text-anchor="middle" font-size="14" fill="#000000">夹子Y</text>
            <text id="scene1-label-tube1" x="200" y="390" text-anchor="middle" font-size="14" fill="#000000">试管1</text>
            <text id="scene1-label-tube2" x="600" y="390" text-anchor="middle" font-size="14" fill="#000000">试管2</text>
            <text id="scene1-label-lime" x="400" y="320" text-anchor="middle" font-size="14" fill="#000000">石灰水</text>
            
            <!-- 石灰水引线 -->
            <line x1="400" y1="305" x2="235" y2="305" stroke="#000000" stroke-width="1"/>
            <line x1="400" y1="305" x2="565" y2="305" stroke="#000000" stroke-width="1"/>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn" disabled>◀ 上一步</button>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现
        // 布局坐标表参考：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // |------|------|-----------|------|-------------|------|
        // | 试管1轮廓 | 圆角矩形 | (160,150)-(240,350) | 80×200 | - | 左侧试管 |
        // | 试管2轮廓 | 圆角矩形 | (560,150)-(640,350) | 80×200 | - | 右侧试管 |
        // | 试管1石灰水 | 矩形 | (165,280)-(235,345) | 70×65 | - | 液面y=280 |
        // | 试管2石灰水 | 矩形 | (565,280)-(635,345) | 70×65 | - | 液面y=280 |
        // | 水平主管道 | 线段 | (100,100)-(700,100) | 600×6 | - | y=100灰色管 |
        // | M口竖管 | 线段 | (400,60)-(400,100) | 6×40 | - | 顶部中央吹气口 |
        // | 试管1竖管(长) | 线段 | (200,100)-(200,300) | 6×200 | - | 插入液面下 |
        // | 试管1竖管(短) | 线段 | (220,100)-(220,260) | 6×160 | - | 液面上方 |
        // | 试管2竖管(长) | 线段 | (600,100)-(600,300) | 6×200 | - | 插入液面下 |
        // | 试管2竖管(短) | 线段 | (580,100)-(580,260) | 6×160 | - | 液面上方 |
        // | 夹子X | 图标 | (245,95) | 20×20 | 上方 | 左侧水平管 |
        // | 夹子Y | 图标 | (555,95) | 20×20 | 上方 | 右侧水平管 |
        // | M标签 | text | (400,45) | ~20×16 | 上方 | M口正上方 |
        // | 夹子X标签 | text | (245,75) | ~40×16 | 上方 | 夹子X上方 |
        // | 夹子Y标签 | text | (555,75) | ~40×16 | 上方 | 夹子Y上方 |
        // | 试管1标签 | text | (200,370) | ~50×16 | 下方 | 试管1正下方 |
        // | 试管2标签 | text | (600,370) | ~50×16 | 下方 | 试管2正下方 |
        // | 石灰水标签 | text | (400,320) | ~50×16 | 右侧 | 两试管之间 |
        // | 气流箭头 | 箭头 | (400,110)→(600,110) | 动态 | - | 步骤2显示，y=110避开夹子 |
        // | 气泡组 | 圆圈 | (595,300)-(605,280) | 动态 | - | 步骤3显示 |
        // | 浑浊颗粒 | 小圆 | (565,280)-(635,345) | 随机 | - | 步骤4显示 |
        // | 上一步按钮 | button | (320,455) | 100×35 | - | 控件区左侧 |
        // | 下一步按钮 | button | (460,455) | 100×35 | - | 控件区右侧 |

        let currentState = 0;
        const totalSteps = 5; // 0-4

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const clipperX = document.getElementById('scene1-clipper-x');
        const clipperY = document.getElementById('scene1-clipper-y');
        const arrowFlow = document.getElementById('scene1-arrow-flow');
        const bubbleGroup = document.getElementById('scene1-bubble-group');
        const lime2Turbid = document.getElementById('scene1-lime2-turbid');
        const turbidParticles = document.getElementById('scene1-turbid-particles');

        // 工具函数：显示/隐藏元素
        function show(el) {
            el.classList.remove('scene1-hidden');
            el.classList.add('scene1-visible');
            el.style.display = 'block';
            el.style.opacity = '1';
        }

        function hide(el) {
            el.classList.remove('scene1-visible');
            el.classList.add('scene1-hidden');
            el.style.display = 'none';
            el.style.opacity = '0';
        }

        // 更新夹子状态
        function updateClippers(step) {
            if (step >= 1) {
                // 夹子X关闭（红色×）
                clipperX.innerHTML = '<line x1="235" y1="90" x2="255" y2="110" stroke="#c62828" stroke-width="3"/>' +
                                     '<line x1="255" y1="90" x2="235" y2="110" stroke="#c62828" stroke-width="3"/>';
                // 夹子Y开启（绿色√）
                clipperY.innerHTML = '<path d="M545,100 L555,110 L565,90" fill="none" stroke="#2e7d32" stroke-width="3"/>';
            } else {
                // 中性状态（灰色×）
                clipperX.innerHTML = '<line x1="235" y1="90" x2="255" y2="110" stroke="#9e9e9e" stroke-width="3"/>' +
                                     '<line x1="255" y1="90" x2="235" y2="110" stroke="#9e9e9e" stroke-width="3"/>';
                clipperY.innerHTML = '<line x1="545" y1="90" x2="565" y2="110" stroke="#9e9e9e" stroke-width="3"/>' +
                                     '<line x1="565" y1="90" x2="545" y2="110" stroke="#9e9e9e" stroke-width="3"/>';
            }
        }

        // 生成气泡动画
        function createBubbles() {
            bubbleGroup.innerHTML = '';
            for (let i = 0; i < 5; i++) {
                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', 595 + Math.random() * 10);
                circle.setAttribute('cy', 300);
                circle.setAttribute('r', 3 + Math.random() * 3);
                circle.setAttribute('fill', '#90caf9');
                circle.setAttribute('stroke', '#1565c0');
                circle.setAttribute('stroke-width', '1');
                circle.setAttribute('opacity', '0.8');
                bubbleGroup.appendChild(circle);

                // 气泡上升动画
                animateBubble(circle, i * 200);
            }
        }

        function animateBubble(circle, delay) {
            setTimeout(() => {
                let cy = 300;
                const animate = () => {
                    cy -= 2;
                    circle.setAttribute('cy', cy);
                    if (cy > 280) {
                        requestAnimationFrame(animate);
                    } else {
                        // 重置气泡
                        circle.setAttribute('cy', 300);
                        setTimeout(() => animateBubble(circle, 0), 500);
                    }
                };
                animate();
            }, delay);
        }

        // 生成浑浊颗粒
        function createTurbidParticles() {
            turbidParticles.innerHTML = '';
            for (let i = 0; i < 30; i++) {
                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', 570 + Math.random() * 60);
                circle.setAttribute('cy', 285 + Math.random() * 55);
                circle.setAttribute('r', 1.5 + Math.random() * 2);
                circle.setAttribute('fill', '#eeeeee');
                circle.setAttribute('opacity', '0.9');
                turbidParticles.appendChild(circle);
            }
        }

        // 更新界面状态
        function updateState(step) {
            // 更新夹子状态
            updateClippers(step);

            // 步骤1+：夹子状态
            if (step >= 1) {
                // 夹子已更新
            }

            // 步骤2+：气流箭头
            if (step >= 2) {
                show(arrowFlow);
            } else {
                hide(arrowFlow);
            }

            // 步骤3+：气泡
            if (step >= 3) {
                show(bubbleGroup);
                if (bubbleGroup.children.length === 0) {
                    createBubbles();
                }
            } else {
                hide(bubbleGroup);
            }

            // 步骤4：浑浊效果
            if (step >= 4) {
                show(lime2Turbid);
                show(turbidParticles);
                if (turbidParticles.children.length === 0) {
                    createTurbidParticles();
                }
            } else {
                hide(lime2Turbid);
                hide(turbidParticles);
            }

            // 更新按钮状态
            btnPrev.disabled = (step === 0);
            btnNext.disabled = (step === 4);
        }

        // 下一步
        function stepForward() {
            if (currentState < 4) {
                currentState++;
                updateState(currentState);
            }
        }

        // 上一步
        function stepBackward() {
            if (currentState > 0) {
                currentState--;
                updateState(currentState);
            }
        }

        // 事件绑定
        btnNext.addEventListener('click', stepForward);
        btnPrev.addEventListener('click', stepBackward);

        // 初始化
        updateState(0);
    })();
    </script>
</body>
</html>
