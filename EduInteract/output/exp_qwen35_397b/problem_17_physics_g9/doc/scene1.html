<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实物电路电流路径分析</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        .scene1-element {
            stroke: #000000;
            stroke-width: 2;
            fill: none;
        }
        .scene1-highlight {
            stroke: #1565c0;
            stroke-width: 3;
        }
        .scene1-branch-point {
            fill: #c62828;
        }
        .scene1-conclusion-box {
            fill: #ffffff;
            stroke: #2e7d32;
            stroke-width: 2;
        }
        .scene1-label {
            font-size: 14px;
            fill: #000000;
        }
        .scene1-arrow {
            stroke: #1565c0;
            stroke-width: 3;
            fill: none;
            marker-end: url(#scene1-arrowhead);
        }
        .scene1-hidden {
            opacity: 0;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <!-- 箭头定义 -->
            <defs>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#1565c0" />
                </marker>
            </defs>

            <!-- 电源（两节电池）(350,50)-(450,80) -->
            <g id="scene1-battery">
                <rect x="350" y="55" width="45" height="25" class="scene1-element"/>
                <rect x="395" y="55" width="45" height="25" class="scene1-element"/>
                <line x1="350" y1="67.5" x2="395" y2="67.5" stroke="#000000" stroke-width="2"/>
                <!-- 正极突起 -->
                <line x1="440" y1="50" x2="440" y2="55" stroke="#000000" stroke-width="3"/>
                <!-- 负极突起 -->
                <line x1="350" y1="60" x2="345" y2="60" stroke="#000000" stroke-width="3"/>
            </g>
            <text id="scene1-battery-plus" x="455" y="65" class="scene1-label">+</text>
            <text id="scene1-battery-minus" x="335" y="65" class="scene1-label">-</text>

            <!-- 开关 S (600,100)-(680,140) -->
            <g id="scene1-switch">
                <rect x="600" y="120" width="80" height="20" class="scene1-element"/>
                <circle cx="610" cy="130" r="4" fill="#000000"/>
                <circle cx="670" cy="130" r="4" fill="#000000"/>
                <!-- 开关刀闸（断开状态） -->
                <line id="scene1-switch-blade" x1="610" y1="130" x2="660" y2="110" stroke="#000000" stroke-width="3"/>
            </g>
            <text id="scene1-switch-label" x="640" y="95" class="scene1-label" text-anchor="middle">S</text>

            <!-- 电流表 A (100,180)-(200,280) -->
            <g id="scene1-ammeter">
                <rect x="100" y="180" width="100" height="100" class="scene1-element"/>
                <text x="150" y="220" class="scene1-label" text-anchor="middle" font-size="24">A</text>
                <line x1="120" y1="240" x2="180" y2="240" stroke="#000000" stroke-width="1"/>
                <!-- 接线柱 -->
                <circle cx="120" cy="265" r="6" fill="#000000"/>
                <circle cx="150" cy="265" r="6" fill="#000000"/>
                <circle cx="180" cy="265" r="6" fill="#000000"/>
                <text x="120" y="285" class="scene1-label" text-anchor="middle" font-size="10">-</text>
                <text x="150" y="285" class="scene1-label" text-anchor="middle" font-size="10">0.6</text>
                <text x="180" y="285" class="scene1-label" text-anchor="middle" font-size="10">3</text>
            </g>
            <text id="scene1-ammeter-label" x="150" y="170" class="scene1-label" text-anchor="middle">A</text>

            <!-- 灯泡 L₁ (300,320)-(360,380) -->
            <g id="scene1-lamp1">
                <rect x="300" y="350" width="60" height="30" class="scene1-element"/>
                <circle cx="330" cy="340" r="15" class="scene1-element"/>
                <!-- 灯丝 -->
                <path d="M 320 340 Q 325 330 330 340 Q 335 330 340 340" stroke="#000000" stroke-width="1.5" fill="none"/>
                <!-- 接线柱 -->
                <circle cx="310" cy="365" r="4" fill="#000000"/>
                <circle cx="350" cy="365" r="4" fill="#000000"/>
            </g>
            <text id="scene1-lamp1-label" x="330" y="310" class="scene1-label" text-anchor="middle">L₁</text>

            <!-- 灯泡 L₂ (500,320)-(560,380) -->
            <g id="scene1-lamp2">
                <rect x="500" y="350" width="60" height="30" class="scene1-element"/>
                <circle cx="530" cy="340" r="15" class="scene1-element"/>
                <!-- 灯丝 -->
                <path d="M 520 340 Q 525 330 530 340 Q 535 330 540 340" stroke="#000000" stroke-width="1.5" fill="none"/>
                <!-- 接线柱 -->
                <circle cx="510" cy="365" r="4" fill="#000000"/>
                <circle cx="550" cy="365" r="4" fill="#000000"/>
            </g>
            <text id="scene1-lamp2-label" x="530" y="310" class="scene1-label" text-anchor="middle">L₂</text>

            <!-- 导线 -->
            <!-- 导线1: 电源正极→开关 (450,65)-(600,120) -->
            <path id="scene1-wire1" d="M 440 65 C 500 65 520 80 540 100 C 560 110 580 115 600 120" class="scene1-element"/>
            
            <!-- 导线2: 开关→L₂右侧/分支点 (680,120)-(560,320) -->
            <path id="scene1-wire2" d="M 680 130 C 700 150 700 200 680 250 C 660 280 620 300 560 320" class="scene1-element"/>
            
            <!-- 导线3: L₂右侧→L₁右侧 (560,320)-(360,320) -->
            <path id="scene1-wire3" d="M 550 320 C 500 320 450 320 400 320 C 380 320 365 330 360 350" class="scene1-element"/>
            
            <!-- 导线4: L₁左侧→电流表 (300,350)-(200,280) -->
            <path id="scene1-wire4" d="M 300 365 C 280 365 250 350 230 320 C 210 300 200 280 200 265" class="scene1-element"/>
            
            <!-- 导线5: 电流表→电源负极 (200,230)-(350,65) -->
            <path id="scene1-wire5" d="M 120 265 C 100 250 80 200 80 150 C 80 100 150 80 250 70 C 300 65 330 65 350 65" class="scene1-element"/>
            
            <!-- 导线6: L₂左侧→汇合点/电流表 (500,350)-(200,230) -->
            <path id="scene1-wire6" d="M 510 365 C 480 380 400 380 320 360 C 250 340 200 300 180 265" class="scene1-element"/>

            <!-- 分支点 (560,320) -->
            <circle id="scene1-branch-point" cx="560" cy="320" r="6" class="scene1-branch-point scene1-hidden"/>
            <text id="scene1-branch-label" x="575" y="310" class="scene1-label scene1-hidden">分支点</text>

            <!-- 汇合点 (200,230) 附近 -->
            <circle id="scene1-junction-point" cx="190" cy="265" r="6" class="scene1-branch-point scene1-hidden"/>
            <text id="scene1-junction-label" x="170" y="255" class="scene1-label scene1-hidden">汇合点</text>

            <!-- 电流路径箭头（初始隐藏） -->
            <!-- 箭头1: 电源→开关 -->
            <path id="scene1-arrow1" d="M 440 65 C 500 65 520 80 540 100 C 560 110 580 115 600 120" class="scene1-arrow scene1-hidden"/>
            
            <!-- 箭头2: 开关→分支点 -->
            <path id="scene1-arrow2" d="M 680 130 C 700 150 700 200 680 250 C 660 280 620 300 560 320" class="scene1-arrow scene1-hidden"/>
            
            <!-- 箭头3: L₁支路 -->
            <path id="scene1-arrow3" d="M 550 320 C 500 320 450 320 400 320 C 380 320 365 330 360 350 M 300 365 C 280 365 250 350 230 320 C 210 300 200 280 200 265 M 120 265 C 100 250 80 200 80 150 C 80 100 150 80 250 70 C 300 65 330 65 350 65" class="scene1-arrow scene1-hidden"/>
            
            <!-- 箭头4: L₂支路 -->
            <path id="scene1-arrow4" d="M 550 320 C 540 330 535 340 530 350 M 510 365 C 480 380 400 380 320 360 C 250 340 200 300 180 265" class="scene1-arrow scene1-hidden"/>

            <!-- 结论文本框 (250,420)-(550,460) -->
            <g id="scene1-conclusion" class="scene1-hidden">
                <rect x="250" y="420" width="300" height="40" class="scene1-conclusion-box"/>
                <text x="400" y="445" class="scene1-label" text-anchor="middle" font-size="13">并联电路：L₁与L₂并联，电流表测L₁支路电流</text>
            </g>

            <!-- 控件栏 -->
            <g id="scene1-controls">
                <rect x="300" y="470" width="200" height="30" fill="#f0f0f0" stroke="#cccccc" rx="5"/>
                <g id="scene1-btn-prev" style="cursor: pointer;">
                    <rect x="310" y="475" width="60" height="20" fill="#1565c0" rx="3"/>
                    <text x="340" y="489" fill="#ffffff" text-anchor="middle" font-size="12">◀ 上一步</text>
                </g>
                <text id="scene1-step-indicator" x="400" y="489" text-anchor="middle" class="scene1-label" font-size="12">步骤 0/5</text>
                <g id="scene1-btn-next" style="cursor: pointer;">
                    <rect x="430" y="475" width="60" height="20" fill="#1565c0" rx="3"/>
                    <text x="460" y="489" fill="#ffffff" text-anchor="middle" font-size="12">下一步 ▶</text>
                </g>
            </g>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 1 实现：实物电路电流路径分析
        
        // 布局坐标表（实现对照依据）：
        // | 元素 | 位置 | 备注 |
        // |------|------|------|
        // | 电源 | (350,50)-(450,80) | 顶部居中 |
        // | 开关 S | (600,100)-(680,140) | 右上角 |
        // | 电流表 A | (100,180)-(200,280) | 左侧 |
        // | 灯泡 L₁ | (300,320)-(360,380) | 中下方 |
        // | 灯泡 L₂ | (500,320)-(560,380) | 右下方 |
        // | 分支点 | (560,320) | 红色圆点 |
        // | 汇合点 | (190,265) | 红色圆点 |
        
        let currentStep = 0;
        const totalSteps = 5;
        
        // 获取 DOM 元素
        const stepIndicator = document.getElementById('scene1-step-indicator');
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        
        // 需要控制的元素
        const elements = {
            branchPoint: document.getElementById('scene1-branch-point'),
            branchLabel: document.getElementById('scene1-branch-label'),
            junctionPoint: document.getElementById('scene1-junction-point'),
            junctionLabel: document.getElementById('scene1-junction-label'),
            arrow1: document.getElementById('scene1-arrow1'),
            arrow2: document.getElementById('scene1-arrow2'),
            arrow3: document.getElementById('scene1-arrow3'),
            arrow4: document.getElementById('scene1-arrow4'),
            conclusion: document.getElementById('scene1-conclusion'),
            switch: document.getElementById('scene1-switch'),
            ammeter: document.getElementById('scene1-ammeter'),
            lamp1: document.getElementById('scene1-lamp1'),
            lamp2: document.getElementById('scene1-lamp2')
        };
        
        // 工具函数：显示/隐藏元素
        function show(el) {
            if (el) {
                el.classList.remove('scene1-hidden');
                el.style.opacity = '1';
                el.style.display = '';
            }
        }
        
        function hide(el) {
            if (el) {
                el.classList.add('scene1-hidden');
                el.style.opacity = '0';
            }
        }
        
        // 高亮元件
        function highlightElement(el, highlight) {
            if (el) {
                const paths = el.querySelectorAll('path, circle, rect, line');
                paths.forEach(p => {
                    if (highlight) {
                        p.classList.add('scene1-highlight');
                    } else {
                        p.classList.remove('scene1-highlight');
                    }
                });
            }
        }
        
        // 重置所有高亮和箭头
        function resetAll() {
            // 隐藏所有箭头和标记
            hide(elements.arrow1);
            hide(elements.arrow2);
            hide(elements.arrow3);
            hide(elements.arrow4);
            hide(elements.branchPoint);
            hide(elements.branchLabel);
            hide(elements.junctionPoint);
            hide(elements.junctionLabel);
            hide(elements.conclusion);
            
            // 移除所有高亮
            highlightElement(elements.switch, false);
            highlightElement(elements.ammeter, false);
            highlightElement(elements.lamp1, false);
            highlightElement(elements.lamp2, false);
        }
        
        // 更新显示状态
        function updateDisplay() {
            resetAll();
            
            switch (currentStep) {
                case 0:
                    // 初始状态：完整电路，无高亮
                    break;
                    
                case 1:
                    // 步骤1：高亮干路电流路径（电源正极→开关 S）
                    show(elements.arrow1);
                    highlightElement(elements.switch, true);
                    break;
                    
                case 2:
                    // 步骤2：高亮分支点
                    show(elements.arrow1);
                    show(elements.arrow2);
                    show(elements.branchPoint);
                    show(elements.branchLabel);
                    highlightElement(elements.switch, true);
                    break;
                    
                case 3:
                    // 步骤3：高亮 L₁ 支路
                    show(elements.arrow1);
                    show(elements.arrow2);
                    show(elements.arrow3);
                    show(elements.branchPoint);
                    show(elements.branchLabel);
                    highlightElement(elements.ammeter, true);
                    highlightElement(elements.lamp1, true);
                    break;
                    
                case 4:
                    // 步骤4：高亮 L₂ 支路
                    show(elements.arrow1);
                    show(elements.arrow2);
                    show(elements.arrow4);
                    show(elements.branchPoint);
                    show(elements.branchLabel);
                    highlightElement(elements.lamp2, true);
                    break;
                    
                case 5:
                    // 步骤5：显示汇合点和结论
                    show(elements.arrow1);
                    show(elements.arrow2);
                    show(elements.arrow3);
                    show(elements.arrow4);
                    show(elements.branchPoint);
                    show(elements.branchLabel);
                    show(elements.junctionPoint);
                    show(elements.junctionLabel);
                    show(elements.conclusion);
                    highlightElement(elements.ammeter, true);
                    highlightElement(elements.lamp1, true);
                    highlightElement(elements.lamp2, true);
                    break;
            }
            
            // 更新步骤指示器
            stepIndicator.textContent = `步骤 ${currentStep}/${totalSteps}`;
        }
        
        // 按钮点击事件
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        });
        
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateDisplay();
            }
        });
        
        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
