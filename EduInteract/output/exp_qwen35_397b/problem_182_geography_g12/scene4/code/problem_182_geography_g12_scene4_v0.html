<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>昼夜半球划分 - A 点 14:00 时的夜半球范围</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene4-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene4-controls { position: absolute; bottom: 5px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene4-btn { padding: 6px 14px; font-size: 13px; cursor: pointer; border: 1px solid #333; background: #f0f0f0; border-radius: 4px; }
        .scene4-btn:hover { background: #e0e0e0; }
        .scene4-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene4-step-indicator { font-size: 13px; padding: 6px 14px; }
        .fade-in { transition: opacity 0.5s ease; }
    </style>
</head>
<body>
    <div id="scene4-container">
        <svg width="800" height="500" id="scene4-svg">
            <!-- 经度标注 - 放在网格顶部内部 (y=55) -->
            <text id="scene4-lon-180w" x="40" y="55" text-anchor="middle" font-size="12" fill="#000">180°</text>
            <text id="scene4-lon-120w" x="160" y="55" text-anchor="middle" font-size="12" fill="#000">120°W</text>
            <text id="scene4-lon-60w" x="280" y="55" text-anchor="middle" font-size="12" fill="#000">60°W</text>
            <text id="scene4-lon-0" x="400" y="55" text-anchor="middle" font-size="12" fill="#000">0°</text>
            <text id="scene4-lon-60e" x="520" y="55" text-anchor="middle" font-size="12" fill="#000">60°E</text>
            <text id="scene4-lon-120e" x="640" y="55" text-anchor="middle" font-size="12" fill="#000">120°E</text>
            <text id="scene4-lon-180e" x="760" y="55" text-anchor="middle" font-size="12" fill="#000">180°</text>

            <!-- 纬度标注 - 放在网格左侧内部 (x=40) -->
            <text id="scene4-lat-90n" x="40" y="40" text-anchor="end" font-size="12" fill="#000">90°N</text>
            <text id="scene4-lat-60n" x="40" y="110" text-anchor="end" font-size="12" fill="#000">60°N</text>
            <text id="scene4-lat-30n" x="40" y="180" text-anchor="end" font-size="12" fill="#000">30°N</text>
            <text id="scene4-lat-0" x="40" y="250" text-anchor="end" font-size="12" fill="#000">0°</text>
            <text id="scene4-lat-30s" x="40" y="320" text-anchor="end" font-size="12" fill="#000">30°S</text>
            <text id="scene4-lat-60s" x="40" y="390" text-anchor="end" font-size="12" fill="#000">60°S</text>
            <text id="scene4-lat-90s" x="40" y="460" text-anchor="end" font-size="12" fill="#000">90°S</text>

            <!-- 经线 (7 条) -->
            <line id="scene4-meridian-180w" x1="40" y1="40" x2="40" y2="460" stroke="#000" stroke-width="1"/>
            <line id="scene4-meridian-120w" x1="160" y1="40" x2="160" y2="460" stroke="#000" stroke-width="1"/>
            <line id="scene4-meridian-60w" x1="280" y1="40" x2="280" y2="460" stroke="#000" stroke-width="1"/>
            <line id="scene4-meridian-0" x1="400" y1="40" x2="400" y2="460" stroke="#000" stroke-width="1"/>
            <line id="scene4-meridian-60e" x1="520" y1="40" x2="520" y2="460" stroke="#000" stroke-width="1"/>
            <line id="scene4-meridian-120e" x1="640" y1="40" x2="640" y2="460" stroke="#000" stroke-width="1"/>
            <line id="scene4-meridian-180e" x1="760" y1="40" x2="760" y2="460" stroke="#000" stroke-width="1"/>

            <!-- 纬线 (7 条) -->
            <line id="scene4-parallel-90n" x1="40" y1="40" x2="760" y2="40" stroke="#000" stroke-width="1"/>
            <line id="scene4-parallel-60n" x1="40" y1="110" x2="760" y2="110" stroke="#000" stroke-width="1"/>
            <line id="scene4-parallel-30n" x1="40" y1="180" x2="760" y2="180" stroke="#000" stroke-width="1"/>
            <line id="scene4-parallel-0" x1="40" y1="250" x2="760" y2="250" stroke="#000" stroke-width="1"/>
            <line id="scene4-parallel-30s" x1="40" y1="320" x2="760" y2="320" stroke="#000" stroke-width="1"/>
            <line id="scene4-parallel-60s" x1="40" y1="390" x2="760" y2="390" stroke="#000" stroke-width="1"/>
            <line id="scene4-parallel-90s" x1="40" y1="460" x2="760" y2="460" stroke="#000" stroke-width="1"/>

            <!-- A 点 (60°W, 30°N) = (280, 180) -->
            <circle id="scene4-point-a" cx="280" cy="180" r="5" fill="#1565c0"/>

            <!-- A 点标签 (步骤 1 显示) - 放在 A 点右上方，远离晨昏线 -->
            <text id="scene4-label-a" x="295" y="165" font-size="13" fill="#000" opacity="0" class="fade-in">A (14:00)</text>

            <!-- 12:00 经线 (30°W) = x=340 (步骤 2 显示) -->
            <line id="scene4-meridian-12" x1="340" y1="40" x2="340" y2="460" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5,5" opacity="0" class="fade-in"/>
            <!-- 12:00 经线标签 - 放在网格底部内部 -->
            <text id="scene4-label-meridian-12" x="340" y="455" text-anchor="middle" font-size="13" fill="#2e7d32" opacity="0" class="fade-in">12:00 经线</text>

            <!-- 晨昏线 (步骤 3 显示) - 红色大圆弧，经过 60°E 和 120°W -->
            <!-- 晨昏线是经过地心的大圆，在投影中表现为弧线 -->
            <!-- 从 (60°E, 90°N) 附近经 (0°, 0°) 到 (120°W, 90°S) 附近 -->
            <path id="scene4-terminator" d="M 520 40 Q 400 250 160 460" stroke="#c62828" stroke-width="3" fill="none" opacity="0" class="fade-in"/>
            <text id="scene4-label-terminator" x="590" y="100" font-size="14" fill="#c62828" font-weight="bold" opacity="0" class="fade-in">晨昏线</text>

            <!-- 夜半球阴影 (步骤 4 显示) - 晨昏线西侧区域，但避开顶部和左侧标签区域 -->
            <!-- 阴影从 y=70 开始，避开顶部经度标注；从 x=70 开始，避开左侧纬度标注 -->
            <path id="scene4-night-shadow" d="M 70 70 L 520 70 Q 400 250 160 430 L 70 430 Z" fill="#888888" fill-opacity="0.3" opacity="0" class="fade-in"/>
            <!-- 夜半球标签 - 放在阴影区域中心，避开经线 -->
            <text id="scene4-label-night" x="110" y="255" font-size="13" fill="#000" opacity="0" class="fade-in">夜半球</text>

        </svg>

        <div id="scene4-controls">
            <button id="scene4-btn-prev" class="scene4-btn">◀ 上一步</button>
            <span id="scene4-step-indicator">步骤 0/4</span>
            <button id="scene4-btn-next" class="scene4-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 4: 昼夜半球划分 - A 点 14:00 时的夜半球范围

        // 状态管理
        let currentState = 0;
        const totalSteps = 4;

        // 各步骤应显示的元素
        const steps = {
            0: [],  // 初始状态：只显示经纬网和 A 点
            1: ['scene4-label-a'],
            2: ['scene4-label-a', 'scene4-meridian-12', 'scene4-label-meridian-12'],
            3: ['scene4-label-a', 'scene4-meridian-12', 'scene4-label-meridian-12', 'scene4-terminator', 'scene4-label-terminator'],
            4: ['scene4-label-a', 'scene4-meridian-12', 'scene4-label-meridian-12', 'scene4-terminator', 'scene4-label-terminator', 'scene4-night-shadow', 'scene4-label-night']
        };

        // 元素显示/隐藏函数
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.opacity = '1';
                el.style.display = '';
            }
        }

        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.opacity = '0';
                el.style.display = 'none';
            }
        }

        // 渲染当前状态
        function render() {
            // 隐藏所有可控制的元素
            const allElements = ['scene4-label-a', 'scene4-meridian-12', 'scene4-label-meridian-12', 
                                 'scene4-terminator', 'scene4-label-terminator', 
                                 'scene4-night-shadow', 'scene4-label-night'];
            
            allElements.forEach(id => hideElement(id));

            // 显示当前步骤应有的元素
            steps[currentState].forEach(id => showElement(id));

            // 更新步骤指示器
            document.getElementById('scene4-step-indicator').textContent = `步骤 ${currentState}/${totalSteps}`;

            // 更新按钮状态
            document.getElementById('scene4-btn-prev').disabled = currentState === 0;
            document.getElementById('scene4-btn-next').disabled = currentState === totalSteps;
        }

        // 事件绑定
        document.getElementById('scene4-btn-prev').addEventListener('click', function() {
            if (currentState > 0) {
                currentState--;
                render();
            }
        });

        document.getElementById('scene4-btn-next').addEventListener('click', function() {
            if (currentState < totalSteps) {
                currentState++;
                render();
            }
        });

        // 初始化
        render();
    })();
    </script>
</body>
</html>
