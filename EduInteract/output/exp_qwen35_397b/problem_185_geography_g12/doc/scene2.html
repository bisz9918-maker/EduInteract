<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太阳直射点与晨昏线切点关系</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #scene2-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene2-svg {
            width: 800px;
            height: 500px;
        }
        .scene2-fade-in {
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
        }
        .scene2-visible {
            opacity: 1;
        }
        .scene2-btn {
            padding: 8px 20px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background: #1565c0;
            color: white;
            transition: background 0.2s;
        }
        .scene2-btn:hover:not(:disabled) {
            background: #0d47a1;
        }
        .scene2-btn:disabled {
            background: #bdbdbd;
            cursor: not-allowed;
        }
        .scene2-step-indicator {
            font-size: 14px;
            color: #424242;
            min-width: 80px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500">
            <!-- 标题 -->
            <text id="scene2-title" x="580" y="40" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">太阳直射点推导</text>

            <!-- 地球轮廓 -->
            <circle id="scene2-earth" cx="200" cy="250" r="120" fill="none" stroke="#000000" stroke-width="2"/>

            <!-- 地轴（垂直虚线） -->
            <line id="scene2-axis" x1="200" y1="110" x2="200" y2="390" stroke="#666666" stroke-width="2" stroke-dasharray="5,5"/>

            <!-- 北极点 N -->
            <text id="scene2-north-pole" x="200" y="100" font-size="14" fill="#333" text-anchor="middle">N</text>

            <!-- 南极点 S -->
            <text id="scene2-south-pole" x="200" y="410" font-size="14" fill="#333" text-anchor="middle">S</text>

            <!-- 赤道（水平实线） -->
            <line id="scene2-equator" x1="80" y1="250" x2="320" y2="250" stroke="#000000" stroke-width="2"/>
            <text id="scene2-equator-label" x="335" y="255" font-size="13" fill="#333">赤道</text>

            <!-- 70°N 纬线（灰色虚线） -->
            <line id="scene2-70n-lat" x1="110" y1="180" x2="290" y2="180" stroke="#888888" stroke-width="2" stroke-dasharray="4,4"/>
            <text id="scene2-70n-label" x="300" y="175" font-size="13" fill="#666" class="scene2-fade-in">70°</text>

            <!-- 70°S 纬线（灰色虚线） -->
            <line id="scene2-70s-lat" x1="110" y1="320" x2="290" y2="320" stroke="#888888" stroke-width="2" stroke-dasharray="4,4"/>
            <text id="scene2-70s-label" x="300" y="335" font-size="13" fill="#666">70°S</text>

            <!-- 晨昏线（蓝色倾斜线，与 70°N 相切） -->
            <line id="scene2-morning-line" x1="90" y1="150" x2="310" y2="350" stroke="#1565c0" stroke-width="3"/>
            <text id="scene2-morning-label" x="320" y="360" font-size="12" fill="#1565c0">晨昏线</text>

            <!-- 切点 T（70°N 与晨昏线切点） -->
            <circle id="scene2-tangent-point" cx="200" cy="180" r="4" fill="#c62828" class="scene2-fade-in"/>
            <text id="scene2-tangent-label" x="215" y="175" font-size="13" fill="#c62828" class="scene2-fade-in">T</text>

            <!-- 20°角弧（圆心 200,180，半径 25） -->
            <path id="scene2-angle-arc" d="M 225 180 A 25 25 0 0 0 217.68 162.5" fill="none" stroke="#000000" stroke-width="1.5" class="scene2-fade-in"/>
            <text id="scene2-20deg-label" x="235" y="195" font-size="13" fill="#000" class="scene2-fade-in">20°</text>

            <!-- 太阳光线（3 条红色平行箭头） -->
            <defs>
                <marker id="scene2-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#c62828"/>
                </marker>
            </defs>
            <line id="scene2-sun-ray-1" x1="550" y1="100" x2="450" y2="100" stroke="#c62828" stroke-width="2" marker-end="url(#scene2-arrow)" class="scene2-fade-in"/>
            <line id="scene2-sun-ray-2" x1="550" y1="180" x2="450" y2="180" stroke="#c62828" stroke-width="2" marker-end="url(#scene2-arrow)" class="scene2-fade-in"/>
            <line id="scene2-sun-ray-3" x1="550" y1="260" x2="450" y2="260" stroke="#c62828" stroke-width="2" marker-end="url(#scene2-arrow)" class="scene2-fade-in"/>
            <text id="scene2-sun-ray-label" x="500" y="90" font-size="12" fill="#c62828" class="scene2-fade-in">太阳光线</text>

            <!-- 直射点（红色实心圆） -->
            <circle id="scene2-subsolar-point" cx="80" cy="250" r="6" fill="#c62828" class="scene2-fade-in"/>
            <text id="scene2-subsolar-label" x="70" y="230" font-size="12" fill="#c62828" text-anchor="middle" class="scene2-fade-in">太阳直射点</text>

            <!-- 右侧推导区域 -->
            <text id="scene2-formula" x="580" y="150" font-size="15" fill="#333" text-anchor="middle" class="scene2-fade-in">90° - 70° = 20°</text>
            <text id="scene2-lat-result" x="580" y="200" font-size="14" fill="#1565c0" text-anchor="middle" class="scene2-fade-in">太阳直射点纬度：20°N</text>
            <text id="scene2-lon-result" x="580" y="240" font-size="14" fill="#1565c0" text-anchor="middle" class="scene2-fade-in">直射点经度：45°E</text>
            <text id="scene2-final-coord" x="580" y="290" font-size="16" fill="#c62828" font-weight="bold" text-anchor="middle" class="scene2-fade-in">(20°N, 45°E)</text>

            <!-- 控件栏（放在 SVG 内部底部） -->
            <g id="scene2-controls" transform="translate(0, 440)">
                <rect x="250" y="0" width="300" height="50" fill="#f5f5f5" stroke="#e0e0e0" rx="4"/>
                <text id="scene2-step-indicator" x="400" y="32" font-size="14" fill="#424242" text-anchor="middle">步骤 0/4</text>
                <button id="scene2-btn-prev" class="scene2-btn" x="280" y="10" disabled>◀ 上一步</button>
                <button id="scene2-btn-next" class="scene2-btn" x="420" y="10">下一步 ▶</button>
            </g>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 2: 太阳直射点与晨昏线切点关系
        // 布局坐标表（实现对照依据）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // |------|------|-----------|------|-------------|------|
        // | 地球轮廓 | 圆形 | 圆心 (200,250) | 半径 120 | - | 侧视地球 |
        // | 地轴 | 线段 | (200,110)-(200,390) | 280×2 | - | 垂直虚线 |
        // | 赤道 | 线段 | (80,250)-(320,250) | 240×2 | 右侧 | 水平实线 |
        // | 70°N 纬线 | 线段 | (110,180)-(290,180) | 180×2 | 上方 | 灰色虚线 |
        // | 70°S 纬线 | 线段 | (110,320)-(290,320) | 180×2 | 下方 | 灰色虚线 |
        // | 晨昏线 | 线段 | (90,150)-(310,350) | 斜线 | - | 蓝色实线，与 70°N 相切 |
        // | 太阳光线 | 箭头组 | (450,100)-(550,100) 等 3 条 | 箭头长 80 | - | 红色平行箭头，从右向左 |
        // | 直射点 | 实心圆 | (80,250) | 半径 6 | 上方 | 地球左侧表面 |
        // | 20°角弧 | 圆弧 | 圆心 (200,180) | 半径 25 | - | 标注切点与极点夹角 |
        // | 北极点 N | 点 | (200,130) | - | 上方 | 地轴顶端 |
        // | 南极点 S | 点 | (200,370) | - | 下方 | 地轴底端 |
        // | 切点 T | 点 | (200,180) | - | 右侧 | 晨昏线与 70°N 切点 |
        // | 70°标签 | text | (300,175) | ~30×16 | 右侧 | 70°N 纬线标签 |
        // | 20°标签 | text | (235,195) | ~25×16 | 右下 | 角度标注 |
        // | 直射点标签 | text | (70,230) | ~50×16 | 上方 | "太阳直射点" |
        // | 20°N 标签 | text | (580,200) | ~40×16 | - | 推导结论 |
        // | 45°E 标签 | text | (580,240) | ~40×16 | - | 经度推导 |
        // | 最终坐标 | text | (580,290) | ~80×20 | - | (20°N, 45°E) 加粗 |
        // | 推导公式 | text | (550,150) | ~150×60 | - | 90°-70°=20° |
        // | 控件栏 | 按钮组 | (250,450)-(550,490) | 300×40 | - | 上一步/下一步按钮 |

        let scene2CurrentStep = 0;
        const scene2TotalSteps = 4;

        // 工具函数：显示元素
        function scene2Show(el) {
            if (el) {
                el.style.display = '';
                el.style.opacity = '1';
            }
        }

        // 工具函数：隐藏元素
        function scene2Hide(el) {
            if (el) {
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }

        // 更新步骤显示
        function scene2UpdateStep() {
            const indicator = document.getElementById('scene2-step-indicator');
            const prevBtn = document.getElementById('scene2-btn-prev');
            const nextBtn = document.getElementById('scene2-btn-next');

            indicator.textContent = '步骤 ' + scene2CurrentStep + '/' + scene2TotalSteps;

            // 更新按钮状态
            prevBtn.disabled = (scene2CurrentStep === 0);
            if (scene2CurrentStep === scene2TotalSteps) {
                nextBtn.textContent = '完成';
                nextBtn.disabled = true;
            } else {
                nextBtn.textContent = '下一步 ▶';
                nextBtn.disabled = false;
            }

            // 根据步骤更新元素可见性
            scene2ApplyStepVisibility();
        }

        // 应用步骤可见性
        function scene2ApplyStepVisibility() {
            // 步骤 0: 基础元素（地球、地轴、赤道、70°纬线、晨昏线）
            // 步骤 1: 切点 T、20°角弧、20°标签、70°标签
            // 步骤 2: 推导公式、纬度结果、太阳光线
            // 步骤 3: 直射点、直射点标签、经度结果
            // 步骤 4: 最终坐标

            // 步骤 1 元素
            const step1Elements = [
                document.getElementById('scene2-tangent-point'),
                document.getElementById('scene2-tangent-label'),
                document.getElementById('scene2-angle-arc'),
                document.getElementById('scene2-20deg-label'),
                document.getElementById('scene2-70n-label')
            ];

            // 步骤 2 元素
            const step2Elements = [
                document.getElementById('scene2-formula'),
                document.getElementById('scene2-lat-result'),
                document.getElementById('scene2-sun-ray-1'),
                document.getElementById('scene2-sun-ray-2'),
                document.getElementById('scene2-sun-ray-3'),
                document.getElementById('scene2-sun-ray-label')
            ];

            // 步骤 3 元素
            const step3Elements = [
                document.getElementById('scene2-subsolar-point'),
                document.getElementById('scene2-subsolar-label'),
                document.getElementById('scene2-lon-result')
            ];

            // 步骤 4 元素
            const step4Elements = [
                document.getElementById('scene2-final-coord')
            ];

            // 根据当前步骤显示/隐藏元素
            step1Elements.forEach(el => {
                if (scene2CurrentStep >= 1) {
                    scene2Show(el);
                    el.classList.add('scene2-visible');
                } else {
                    scene2Hide(el);
                    el.classList.remove('scene2-visible');
                }
            });

            step2Elements.forEach(el => {
                if (scene2CurrentStep >= 2) {
                    scene2Show(el);
                    el.classList.add('scene2-visible');
                } else {
                    scene2Hide(el);
                    el.classList.remove('scene2-visible');
                }
            });

            step3Elements.forEach(el => {
                if (scene2CurrentStep >= 3) {
                    scene2Show(el);
                    el.classList.add('scene2-visible');
                } else {
                    scene2Hide(el);
                    el.classList.remove('scene2-visible');
                }
            });

            step4Elements.forEach(el => {
                if (scene2CurrentStep >= 4) {
                    scene2Show(el);
                    el.classList.add('scene2-visible');
                } else {
                    scene2Hide(el);
                    el.classList.remove('scene2-visible');
                }
            });
        }

        // 下一步
        function scene2NextStep() {
            if (scene2CurrentStep < scene2TotalSteps) {
                scene2CurrentStep++;
                scene2UpdateStep();
            }
        }

        // 上一步
        function scene2PrevStep() {
            if (scene2CurrentStep > 0) {
                scene2CurrentStep--;
                scene2UpdateStep();
            }
        }

        // 初始化
        function scene2Init() {
            // 绑定按钮事件
            const prevBtn = document.getElementById('scene2-btn-prev');
            const nextBtn = document.getElementById('scene2-btn-next');

            prevBtn.addEventListener('click', scene2PrevStep);
            nextBtn.addEventListener('click', scene2NextStep);

            // 设置按钮位置（使用 CSS 定位）
            prevBtn.style.position = 'absolute';
            prevBtn.style.left = '280px';
            prevBtn.style.top = '10px';

            nextBtn.style.position = 'absolute';
            nextBtn.style.left = '420px';
            nextBtn.style.top = '10px';

            // 初始状态：隐藏所有步骤相关元素
            scene2ApplyStepVisibility();
            scene2UpdateStep();
        }

        // 页面加载完成后初始化
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', scene2Init);
        } else {
            scene2Init();
        }
    })();
    </script>
</body>
</html>
