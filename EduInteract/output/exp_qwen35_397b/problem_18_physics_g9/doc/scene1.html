<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>滑轮系统受力分析 - 场景 1</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        /* 元素显隐控制 */
        .scene1-hidden {
            opacity: 0;
            display: none;
        }
        .scene1-visible {
            opacity: 1;
            display: block;
        }
        /* 箭头动画 */
        .scene1-arrow {
            transition: opacity 0.3s ease;
        }
        /* 按钮样式 */
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            z-index: 10;
        }
        .scene1-btn {
            padding: 8px 16px;
            font-size: 14px;
            border: 2px solid #1565c0;
            border-radius: 6px;
            background: #e3f2fd;
            color: #1565c0;
            cursor: pointer;
            transition: all 0.2s;
        }
        .scene1-btn:hover:not(:disabled) {
            background: #1565c0;
            color: #fff;
        }
        .scene1-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #scene1-step-indicator {
            font-size: 14px;
            color: #333;
            min-width: 80px;
            text-align: center;
        }
        #scene1-equation-box {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 16px;
            color: #333;
            background: rgba(255,255,255,0.95);
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid #ddd;
            min-width: 400px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene1-arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#c62828" />
                </marker>
                <marker id="scene1-arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#1565c0" />
                </marker>
                <marker id="scene1-arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#2e7d32" />
                </marker>
            </defs>

            <!-- 天花板支架 -->
            <line id="scene1-ceiling" x1="320" y1="30" x2="480" y2="30" stroke="#333333" stroke-width="4" />
            <!-- 天花板阴影线 -->
            <g id="scene1-ceiling-hatch">
                <line x1="320" y1="30" x2="325" y2="25" stroke="#333333" stroke-width="2" />
                <line x1="335" y1="30" x2="340" y2="25" stroke="#333333" stroke-width="2" />
                <line x1="350" y1="30" x2="355" y2="25" stroke="#333333" stroke-width="2" />
                <line x1="365" y1="30" x2="370" y2="25" stroke="#333333" stroke-width="2" />
                <line x1="380" y1="30" x2="385" y2="25" stroke="#333333" stroke-width="2" />
                <line x1="395" y1="30" x2="400" y2="25" stroke="#333333" stroke-width="2" />
                <line x1="410" y1="30" x2="415" y2="25" stroke="#333333" stroke-width="2" />
                <line x1="425" y1="30" x2="430" y2="25" stroke="#333333" stroke-width="2" />
                <line x1="440" y1="30" x2="445" y2="25" stroke="#333333" stroke-width="2" />
                <line x1="455" y1="30" x2="460" y2="25" stroke="#333333" stroke-width="2" />
                <line x1="470" y1="30" x2="475" y2="25" stroke="#333333" stroke-width="2" />
            </g>

            <!-- 定滑轮 -->
            <circle id="scene1-pulley" cx="400" cy="80" r="40" fill="#f5f5f5" stroke="#000000" stroke-width="3" />
            <!-- 滑轮轴 -->
            <circle cx="400" cy="80" r="5" fill="#333333" />
            <!-- 滑轮支架 -->
            <line x1="400" y1="30" x2="400" y2="40" stroke="#333333" stroke-width="3" />

            <!-- 绳子左段（从滑轮左侧到物体 B） -->
            <line id="scene1-rope-left" x1="360" y1="80" x2="360" y2="180" stroke="#000000" stroke-width="3" />
            <!-- 绳子右段（从滑轮右侧到弹簧测力计） -->
            <line id="scene1-rope-right" x1="440" y1="80" x2="440" y2="180" stroke="#000000" stroke-width="3" />
            <!-- 绳子顶部弧线（跨过滑轮） -->
            <path d="M360,80 A40,40 0 0,1 440,80" fill="none" stroke="#000000" stroke-width="3" />

            <!-- 物体 B -->
            <rect id="scene1-object-b" x="335" y="180" width="50" height="50" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" opacity="0.8" />
            <text id="scene1-label-b" x="395" y="210" font-size="18" fill="#333" font-weight="bold" class="scene1-visible">B</text>

            <!-- 物体 B 受力箭头 -->
            <g id="scene1-arrow-gb" class="scene1-hidden scene1-arrow">
                <line x1="360" y1="230" x2="360" y2="280" stroke="#c62828" stroke-width="3" marker-end="url(#scene1-arrow-red)" />
                <text x="370" y="260" font-size="14" fill="#c62828" font-weight="bold">G_B=19.6N</text>
            </g>
            <g id="scene1-arrow-tb" class="scene1-hidden scene1-arrow">
                <line x1="360" y1="180" x2="360" y2="130" stroke="#1565c0" stroke-width="3" marker-end="url(#scene1-arrow-blue)" />
                <text x="290" y="160" font-size="14" fill="#1565c0" font-weight="bold">T=19.6N</text>
            </g>

            <!-- 弹簧测力计 -->
            <g id="scene1-spring-scale">
                <!-- 外壳 -->
                <rect x="425" y="180" width="30" height="80" fill="#e0e0e0" stroke="#888888" stroke-width="2" rx="3" />
                <!-- 内部螺旋线 -->
                <path d="M440,190 L440,250" stroke="#888888" stroke-width="2" fill="none" />
                <path d="M435,200 Q445,205 435,210 Q445,215 435,220 Q445,225 435,230 Q445,235 435,240 Q445,245 435,250" stroke="#666666" stroke-width="1.5" fill="none" />
                <!-- 挂钩 -->
                <path d="M440,260 L440,270 A5,5 0 0,1 435,275" stroke="#666666" stroke-width="2" fill="none" />
                <!-- 示数标签 -->
                <text id="scene1-label-f-spring" x="465" y="225" font-size="14" fill="#333" font-weight="bold" class="scene1-hidden">F=19.6N</text>
            </g>

            <!-- 盛水容器 -->
            <g id="scene1-container">
                <!-- 容器壁 -->
                <path d="M480,350 L480,430 L640,430 L640,350" fill="none" stroke="#000000" stroke-width="2" />
                <!-- 水面线 -->
                <line id="scene1-water-line" x1="480" y1="350" x2="640" y2="350" stroke="#4fc3f7" stroke-width="2" />
                <!-- 水下区域 -->
                <rect id="scene1-water-area" x="480" y="350" width="160" height="80" fill="#e1f5fe" opacity="0.5" />
                <!-- 水波纹 -->
                <path d="M490,355 Q500,350 510,355 Q520,360 530,355" stroke="#4fc3f7" stroke-width="1" fill="none" opacity="0.6" />
                <path d="M540,355 Q550,350 560,355 Q570,360 580,355" stroke="#4fc3f7" stroke-width="1" fill="none" opacity="0.6" />
                <path d="M590,355 Q600,350 610,355 Q620,360 630,355" stroke="#4fc3f7" stroke-width="1" fill="none" opacity="0.6" />
            </g>

            <!-- 物体 A -->
            <rect id="scene1-object-a" x="520" y="300" width="80" height="50" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" opacity="0.8" />
            <text id="scene1-label-a" x="555" y="290" font-size="18" fill="#333" font-weight="bold" class="scene1-visible">A</text>

            <!-- 连接弹簧测力计和物体 A 的线 -->
            <line x1="440" y1="270" x2="560" y2="300" stroke="#666666" stroke-width="2" />

            <!-- 物体 A 受力箭头 -->
            <g id="scene1-arrow-ga" class="scene1-hidden scene1-arrow">
                <line x1="560" y1="350" x2="560" y2="410" stroke="#c62828" stroke-width="3" marker-end="url(#scene1-arrow-red)" />
                <text x="570" y="385" font-size="14" fill="#c62828" font-weight="bold">G_A=29.4N</text>
            </g>
            <g id="scene1-arrow-float" class="scene1-hidden scene1-arrow">
                <line x1="540" y1="350" x2="540" y2="310" stroke="#2e7d32" stroke-width="3" marker-end="url(#scene1-arrow-green)" />
                <text x="475" y="335" font-size="14" fill="#2e7d32" font-weight="bold">F_浮=9.8N</text>
            </g>
            <g id="scene1-arrow-fa" class="scene1-hidden scene1-arrow">
                <line x1="580" y1="300" x2="580" y2="260" stroke="#1565c0" stroke-width="3" marker-end="url(#scene1-arrow-blue)" />
                <text x="590" y="285" font-size="14" fill="#1565c0" font-weight="bold">F=19.6N</text>
            </g>

            <!-- 方程显示框 -->
            <text id="scene1-equation-box" x="400" y="470" font-size="15" fill="#333" text-anchor="middle">初始状态：装置静止</text>
        </svg>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 0/7</span>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现 - 滑轮系统受力分析

        // 状态配置数组
        const scene1States = [
            {
                // 步骤 0: 初始状态
                equation: "初始状态：装置静止",
                visible: ['scene1-label-b', 'scene1-label-a']
            },
            {
                // 步骤 1: 显示物体 B 的重力
                equation: "G_B = m_B × g = 2kg × 9.8N/kg = 19.6N",
                visible: ['scene1-label-b', 'scene1-label-a', 'scene1-arrow-gb']
            },
            {
                // 步骤 2: 显示物体 B 的绳拉力
                equation: "B 静止 → T = G_B = 19.6N（二力平衡）",
                visible: ['scene1-label-b', 'scene1-label-a', 'scene1-arrow-gb', 'scene1-arrow-tb']
            },
            {
                // 步骤 3: 显示弹簧测力计示数
                equation: "弹簧测力计示数 F = T = 19.6N",
                visible: ['scene1-label-b', 'scene1-label-a', 'scene1-arrow-gb', 'scene1-arrow-tb', 'scene1-label-f-spring']
            },
            {
                // 步骤 4: 显示物体 A 的重力
                equation: "G_A = m_A × g = 3kg × 9.8N/kg = 29.4N",
                visible: ['scene1-label-b', 'scene1-label-a', 'scene1-arrow-gb', 'scene1-arrow-tb', 'scene1-label-f-spring', 'scene1-arrow-ga']
            },
            {
                // 步骤 5: 显示物体 A 的浮力
                equation: "F_浮 = G_A - F = 29.4N - 19.6N = 9.8N",
                visible: ['scene1-label-b', 'scene1-label-a', 'scene1-arrow-gb', 'scene1-arrow-tb', 'scene1-label-f-spring', 'scene1-arrow-ga', 'scene1-arrow-float']
            },
            {
                // 步骤 6: 显示物体 A 的弹簧拉力
                equation: "A 静止 → G_A = F_浮 + F（三力平衡）",
                visible: ['scene1-label-b', 'scene1-label-a', 'scene1-arrow-gb', 'scene1-arrow-tb', 'scene1-label-f-spring', 'scene1-arrow-ga', 'scene1-arrow-float', 'scene1-arrow-fa']
            },
            {
                // 步骤 7: 最终状态 - 完整结论
                equation: "T = G_B = 19.6N；G_A = F_浮 + F = 29.4N；弹簧测力计示数 = 19.6N",
                visible: ['scene1-label-b', 'scene1-label-a', 'scene1-arrow-gb', 'scene1-arrow-tb', 'scene1-label-f-spring', 'scene1-arrow-ga', 'scene1-arrow-float', 'scene1-arrow-fa']
            }
        ];

        let scene1CurrentStep = 0;

        // 工具函数：显示元素
        function scene1ShowElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene1-hidden');
                el.classList.add('scene1-visible');
            }
        }

        // 工具函数：隐藏元素
        function scene1HideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene1-visible');
                el.classList.add('scene1-hidden');
            }
        }

        // 更新状态显示
        function scene1UpdateState() {
            const state = scene1States[scene1CurrentStep];

            // 获取所有需要控制的元素 ID
            const allElements = [
                'scene1-label-b', 'scene1-label-a', 'scene1-arrow-gb', 'scene1-arrow-tb',
                'scene1-label-f-spring', 'scene1-arrow-ga', 'scene1-arrow-float', 'scene1-arrow-fa'
            ];

            // 更新每个元素的可见性
            allElements.forEach(id => {
                if (state.visible.includes(id)) {
                    scene1ShowElement(id);
                } else {
                    scene1HideElement(id);
                }
            });

            // 更新方程文本
            const equationEl = document.getElementById('scene1-equation-box');
            if (equationEl) {
                equationEl.textContent = state.equation;
            }

            // 更新步骤指示器
            const indicatorEl = document.getElementById('scene1-step-indicator');
            if (indicatorEl) {
                indicatorEl.textContent = `步骤 ${scene1CurrentStep}/7`;
            }

            // 更新按钮状态
            const prevBtn = document.getElementById('scene1-btn-prev');
            const nextBtn = document.getElementById('scene1-btn-next');
            if (prevBtn) {
                prevBtn.disabled = scene1CurrentStep === 0;
            }
            if (nextBtn) {
                nextBtn.disabled = scene1CurrentStep === 7;
            }
        }

        // 事件处理：上一步
        function scene1PrevStep() {
            if (scene1CurrentStep > 0) {
                scene1CurrentStep--;
                scene1UpdateState();
            }
        }

        // 事件处理：下一步
        function scene1NextStep() {
            if (scene1CurrentStep < 7) {
                scene1CurrentStep++;
                scene1UpdateState();
            }
        }

        // 绑定事件
        document.getElementById('scene1-btn-prev').addEventListener('click', scene1PrevStep);
        document.getElementById('scene1-btn-next').addEventListener('click', scene1NextStep);

        // 初始化状态
        scene1UpdateState();
    })();
    </script>
</body>
</html>
