<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四棱锥平面交线分析</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', sans-serif;
        }
        #scene2-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene2-svg {
            width: 800px;
            height: 500px;
        }
        /* 元素显隐控制 */
        .scene2-hidden {
            opacity: 0;
            display: none;
        }
        .scene2-visible {
            opacity: 1;
            display: block;
        }
        /* 按钮样式 */
        .scene2-btn {
            padding: 8px 16px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background: #1976d2;
            color: white;
            transition: background 0.2s;
        }
        .scene2-btn:hover {
            background: #1565c0;
        }
        .scene2-btn:disabled {
            background: #bdbdbd;
            cursor: not-allowed;
        }
        /* 控件栏 */
        #scene2-controls {
            position: absolute;
            bottom: 15px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            z-index: 10;
        }
        #scene2-step-indicator {
            font-size: 14px;
            color: #424242;
            min-width: 80px;
            text-align: center;
        }
        /* 结论文本框 */
        #scene2-conclusion-box {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255,255,255,0.98);
            border: 2px solid #1976d2;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 14px;
            line-height: 2;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .scene2-correct {
            color: #2e7d32;
            font-weight: bold;
        }
        .scene2-incorrect {
            color: #c62828;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 定义虚线样式 -->
            <defs>
                <pattern id="scene2-dash" width="10" height="10" patternUnits="userSpaceOnUse">
                    <line x1="0" y1="5" x2="5" y2="5" stroke="black" stroke-width="2"/>
                </pattern>
            </defs>

            <!-- 底面 ABCD 填充（步骤 3 显示） -->
            <polygon id="scene2-base-abcd"
                points="220,360 360,410 580,390 460,330"
                fill="#888888"
                fill-opacity="0.15"
                class="scene2-hidden"/>

            <!-- 平面 PAB 填充（步骤 1 显示） -->
            <polygon id="scene2-plane-pab"
                points="400,80 220,360 360,410"
                fill="#1565c0"
                fill-opacity="0.20"
                class="scene2-hidden"/>

            <!-- 平面 PDC 填充（步骤 1 显示） -->
            <polygon id="scene2-plane-pdc"
                points="400,80 460,330 580,390"
                fill="#2e7d32"
                fill-opacity="0.20"
                class="scene2-hidden"/>

            <!-- 四棱锥框架组 -->
            <g id="scene2-pyramid-frame">
                <!-- 被遮挡的棱（虚线） -->
                <line id="scene2-edge-pd" x1="400" y1="80" x2="460" y2="330"
                    stroke="#000000" stroke-width="2"
                    stroke-dasharray="5,5"/>
                <line id="scene2-edge-cd" x1="580" y1="390" x2="460" y2="330"
                    stroke="#000000" stroke-width="2"
                    stroke-dasharray="5,5"/>
                <line id="scene2-edge-da" x1="460" y1="330" x2="220" y2="360"
                    stroke="#000000" stroke-width="2"
                    stroke-dasharray="5,5"/>

                <!-- 可见的棱（实线） -->
                <line id="scene2-edge-pa" x1="400" y1="80" x2="220" y2="360"
                    stroke="#000000" stroke-width="2"/>
                <line id="scene2-edge-pb" x1="400" y1="80" x2="360" y2="410"
                    stroke="#000000" stroke-width="2"/>
                <line id="scene2-edge-pc" x1="400" y1="80" x2="580" y2="390"
                    stroke="#000000" stroke-width="2"/>
                <line id="scene2-edge-ab" x1="220" y1="360" x2="360" y2="410"
                    stroke="#000000" stroke-width="2"/>
                <line id="scene2-edge-bc" x1="360" y1="410" x2="580" y2="390"
                    stroke="#000000" stroke-width="2"/>
            </g>

            <!-- 交线 l（步骤 1 显示） -->
            <line id="scene2-line-l"
                x1="320" y1="120" x2="480" y2="280"
                stroke="#c62828" stroke-width="4"
                class="scene2-hidden"/>
            <!-- 标签 l：放在右上角空白区域 -->
            <text id="scene2-label-l"
                x="560" y="80"
                fill="#c62828" font-size="16" font-weight="bold"
                class="scene2-hidden">l</text>

            <!-- 平行直线族（步骤 2 显示） -->
            <g id="scene2-parallel-lines" class="scene2-hidden">
                <line x1="280" y1="180" x2="380" y2="280"
                    stroke="#1565c0" stroke-width="1.5"/>
                <line x1="300" y1="200" x2="400" y2="300"
                    stroke="#1565c0" stroke-width="1.5"/>
                <line x1="340" y1="240" x2="440" y2="340"
                    stroke="#1565c0" stroke-width="1.5"/>
                <line x1="360" y1="260" x2="460" y2="360"
                    stroke="#1565c0" stroke-width="1.5"/>
            </g>

            <!-- 顶点标签 -->
            <text id="scene2-label-p" x="400" y="65"
                fill="#000000" font-size="16" font-weight="bold"
                text-anchor="middle">P</text>
            <text id="scene2-label-a" x="205" y="372"
                fill="#000000" font-size="16" font-weight="bold"
                text-anchor="end">A</text>
            <text id="scene2-label-b" x="360" y="428"
                fill="#000000" font-size="16" font-weight="bold"
                text-anchor="middle">B</text>
            <text id="scene2-label-c" x="592" y="402"
                fill="#000000" font-size="16" font-weight="bold"
                text-anchor="start">C</text>
            <!-- 标签 D：放在右侧空白区域，远离所有棱线 -->
            <text id="scene2-label-d" x="600" y="350"
                fill="#000000" font-size="16" font-weight="bold"
                text-anchor="start">D</text>
        </svg>

        <!-- 结论文本框（步骤 4 显示）- 使用 HTML 元素而非 SVG -->
        <div id="scene2-conclusion-box" class="scene2-hidden">
            <div><span>命题②：</span><span class="scene2-correct">正确 ✓</span></div>
            <div><span>命题③：</span><span class="scene2-incorrect">错误 ✗</span></div>
        </div>

        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-btn-prev" class="scene2-btn">◀ 上一步</button>
            <span id="scene2-step-indicator">步骤 0/4</span>
            <button id="scene2-btn-next" class="scene2-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2 实现：平面 PAB 与平面 PDC 的交线分析

        // 布局坐标表（实现对照依据）：
        // | 元素 | 类型 | 位置/范围 | 备注 |
        // |------|------|-----------|------|
        // | 顶点 P | 点 | (400, 80) | 四棱锥顶点 |
        // | 顶点 A | 点 | (220, 360) | 底面左前顶点 |
        // | 顶点 B | 点 | (360, 410) | 底面右前顶点 |
        // | 顶点 C | 点 | (580, 390) | 底面右后顶点 |
        // | 顶点 D | 点 | (460, 330) | 底面左后顶点 |
        // | 交线 l | 线段 | (320,120)-(480,280) | 红色加粗，过 P 点 |
        // | 平行直线族 | 4 条线段 | 平面 PAB 内均匀分布 | 蓝色，平行于 l |

        // 状态管理
        let currentState = 0;
        const totalSteps = 4;

        // 每步需要显示的元素 ID 列表
        const stepElements = {
            0: [],  // 初始状态：只显示基础四棱锥（始终可见）
            1: ['scene2-plane-pab', 'scene2-plane-pdc', 'scene2-line-l', 'scene2-label-l'],
            2: ['scene2-plane-pab', 'scene2-plane-pdc', 'scene2-line-l', 'scene2-label-l', 'scene2-parallel-lines'],
            3: ['scene2-plane-pab', 'scene2-plane-pdc', 'scene2-line-l', 'scene2-label-l', 'scene2-parallel-lines', 'scene2-base-abcd'],
            4: ['scene2-plane-pab', 'scene2-plane-pdc', 'scene2-line-l', 'scene2-label-l', 'scene2-parallel-lines', 'scene2-base-abcd', 'scene2-conclusion-box']
        };

        // 工具函数：显示元素
        function showElement(elementId) {
            const el = document.getElementById(elementId);
            if (el) {
                el.classList.remove('scene2-hidden');
                el.classList.add('scene2-visible');
            }
        }

        // 工具函数：隐藏元素
        function hideElement(elementId) {
            const el = document.getElementById(elementId);
            if (el) {
                el.classList.remove('scene2-visible');
                el.classList.add('scene2-hidden');
            }
        }

        // 更新步骤显示
        function updateStep() {
            // 更新步骤指示器
            document.getElementById('scene2-step-indicator').textContent = '步骤 ' + currentState + '/' + totalSteps;

            // 更新按钮状态
            document.getElementById('scene2-btn-prev').disabled = (currentState === 0);
            document.getElementById('scene2-btn-next').disabled = (currentState === totalSteps);

            // 根据当前状态显示/隐藏元素
            for (let step = 0; step <= totalSteps; step++) {
                const elements = stepElements[step];
                elements.forEach(function(elId) {
                    if (step <= currentState) {
                        showElement(elId);
                    } else {
                        hideElement(elId);
                    }
                });
            }
        }

        // 事件绑定
        document.getElementById('scene2-btn-prev').addEventListener('click', function() {
            if (currentState > 0) {
                currentState--;
                updateStep();
            }
        });

        document.getElementById('scene2-btn-next').addEventListener('click', function() {
            if (currentState < totalSteps) {
                currentState++;
                updateStep();
            }
        });

        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
