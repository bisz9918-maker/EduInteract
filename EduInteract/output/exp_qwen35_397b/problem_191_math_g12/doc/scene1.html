<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圆的切线、割线与角平分线的角度关系</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }
        #scene1-btn-prev, #scene1-btn-next {
            padding: 8px 16px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        #scene1-btn-prev {
            background: #e0e0e0;
            color: #333;
        }
        #scene1-btn-next {
            background: #1565c0;
            color: #fff;
        }
        #scene1-btn-prev:disabled, #scene1-btn-next:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #scene1-step-indicator {
            font-size: 14px;
            color: #333;
            min-width: 80px;
            text-align: center;
        }
        .scene1-fade {
            transition: opacity 0.3s;
        }
        .scene1-hidden {
            opacity: 0;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 圆 O: 圆心(460,320), r=130 -->
            <circle id="scene1-circle" cx="460" cy="320" r="130" fill="none" stroke="#000000" stroke-width="1.5"/>
            
            <!-- 切线 PE -->
            <line id="scene1-line-pe" x1="260" y1="60" x2="280" y2="320" stroke="#000000" stroke-width="1.5"/>
            
            <!-- 割线 PBA -->
            <line id="scene1-line-pba" x1="260" y1="60" x2="640" y2="320" stroke="#000000" stroke-width="1.5"/>
            
            <!-- 弦 AE (水平) -->
            <line id="scene1-line-ae" x1="280" y1="320" x2="640" y2="320" stroke="#000000" stroke-width="1.5"/>
            
            <!-- 弦 BE -->
            <line id="scene1-line-be" x1="280" y1="320" x2="520" y2="210" stroke="#000000" stroke-width="1.5"/>
            
            <!-- 角平分线 PCD (蓝色) -->
            <line id="scene1-line-pcd" x1="260" y1="60" x2="420" y2="275" stroke="#1565c0" stroke-width="2"/>
            
            <!-- 点 P -->
            <circle id="scene1-point-p" cx="260" cy="60" r="4" fill="#000000"/>
            <text id="scene1-label-p" x="250" y="50" font-size="14" fill="#000000">P</text>
            
            <!-- 点 E -->
            <circle id="scene1-point-e" cx="280" cy="320" r="4" fill="#000000"/>
            <text id="scene1-label-e" x="265" y="340" font-size="14" fill="#000000">E</text>
            
            <!-- 点 A -->
            <circle id="scene1-point-a" cx="640" cy="320" r="4" fill="#000000"/>
            <text id="scene1-label-a" x="650" y="335" font-size="14" fill="#000000">A</text>
            
            <!-- 点 B -->
            <circle id="scene1-point-b" cx="520" cy="210" r="4" fill="#000000"/>
            <text id="scene1-label-b" x="530" y="200" font-size="14" fill="#000000">B</text>
            
            <!-- 点 C -->
            <circle id="scene1-point-c" cx="380" cy="320" r="4" fill="#000000"/>
            <text id="scene1-label-c" x="380" y="345" font-size="14" fill="#000000">C</text>
            
            <!-- 点 D -->
            <circle id="scene1-point-d" cx="420" cy="275" r="4" fill="#000000"/>
            <text id="scene1-label-d" x="435" y="275" font-size="14" fill="#000000">D</text>
            
            <!-- ∠AEB=40° 红色弧线 -->
            <path id="scene1-angle-aeb-arc" d="M 305 320 A 25 25 0 0 1 300 305" fill="none" stroke="#c62828" stroke-width="1.5"/>
            <text id="scene1-angle-aeb-text" x="310" y="310" font-size="12" fill="#c62828">40°</text>
            
            <!-- 步骤 1: 弦切角定理 - ∠PEB 和 ∠EAB 绿色弧线 -->
            <g id="scene1-step1-group" class="scene1-fade scene1-hidden">
                <!-- ∠PEB 弧线 -->
                <path id="scene1-angle-peb-arc" d="M 305 310 A 30 30 0 0 1 295 285" fill="none" stroke="#2e7d32" stroke-width="1.5"/>
                <text id="scene1-angle-peb-label" x="295" y="280" font-size="12" fill="#2e7d32">α</text>
                <!-- ∠EAB 弧线 -->
                <path id="scene1-angle-eab-arc" d="M 615 310 A 30 30 0 0 1 595 295" fill="none" stroke="#2e7d32" stroke-width="1.5"/>
                <text id="scene1-angle-eab-label" x="600" y="285" font-size="12" fill="#2e7d32">α</text>
            </g>
            
            <!-- 步骤 2: 角平分线 - ∠EPC 和 ∠APC 弧线 -->
            <g id="scene1-step2-group" class="scene1-fade scene1-hidden">
                <!-- ∠EPC 弧线 -->
                <path id="scene1-angle-epc-arc" d="M 275 90 A 20 20 0 0 1 285 105" fill="none" stroke="#1565c0" stroke-width="1.5"/>
                <text id="scene1-angle-epc-label" x="275" y="100" font-size="10" fill="#1565c0">∠1</text>
                <!-- ∠APC 弧线 -->
                <path id="scene1-angle-apc-arc" d="M 290 95 A 20 20 0 0 1 300 115" fill="none" stroke="#1565c0" stroke-width="1.5"/>
                <text id="scene1-angle-apc-label" x="290" y="110" font-size="10" fill="#1565c0">∠2</text>
            </g>
            
            <!-- 步骤 3: 推导过程和答案 -->
            <g id="scene1-step3-group" class="scene1-fade scene1-hidden">
                <!-- ∠PCE 弧线 -->
                <path id="scene1-angle-pce-arc" d="M 365 305 A 20 20 0 0 1 375 290" fill="none" stroke="#2e7d32" stroke-width="1.5"/>
                <!-- 推导过程文本 -->
                <text id="scene1-derive-text1" x="380" y="260" font-size="11" fill="#333">∠PCE = 180° - ∠EPC - ∠PEC</text>
                <text id="scene1-derive-text2" x="380" y="275" font-size="11" fill="#333">∠PEC = ∠PEB + ∠BEC = α + 40°</text>
                <text id="scene1-result" x="380" y="295" font-size="16" fill="#2e7d32" font-weight="bold">∠PCE = 70°</text>
            </g>
            
            <!-- 控件栏 -->
            <g id="scene1-controls-svg">
                <rect x="300" y="445" width="200" height="40" fill="#f5f5f5" stroke="#ddd" rx="4"/>
            </g>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/4</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现
        let currentState = 0;
        const totalSteps = 4;
        
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        
        const step1Group = document.getElementById('scene1-step1-group');
        const step2Group = document.getElementById('scene1-step2-group');
        const step3Group = document.getElementById('scene1-step3-group');
        
        function updateDisplay() {
            // 更新步骤指示器
            stepIndicator.textContent = `步骤 ${currentState + 1}/${totalSteps}`;
            
            // 更新按钮状态
            btnPrev.disabled = currentState === 0;
            btnNext.disabled = currentState === totalSteps - 1;
            
            // 根据当前状态显示/隐藏元素
            if (currentState === 0) {
                // 初始状态：只显示基础图形
                step1Group.classList.add('scene1-hidden');
                step2Group.classList.add('scene1-hidden');
                step3Group.classList.add('scene1-hidden');
            } else if (currentState === 1) {
                // 步骤 1：弦切角定理
                step1Group.classList.remove('scene1-hidden');
                step2Group.classList.add('scene1-hidden');
                step3Group.classList.add('scene1-hidden');
            } else if (currentState === 2) {
                // 步骤 2：角平分线性质
                step1Group.classList.remove('scene1-hidden');
                step2Group.classList.remove('scene1-hidden');
                step3Group.classList.add('scene1-hidden');
            } else if (currentState === 3) {
                // 步骤 3：推导与答案
                step1Group.classList.remove('scene1-hidden');
                step2Group.classList.remove('scene1-hidden');
                step3Group.classList.remove('scene1-hidden');
            }
        }
        
        btnPrev.addEventListener('click', function() {
            if (currentState > 0) {
                currentState--;
                updateDisplay();
            }
        });
        
        btnNext.addEventListener('click', function() {
            if (currentState < totalSteps - 1) {
                currentState++;
                updateDisplay();
            }
        });
        
        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
