<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>角度关系代数推导可视化</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene2-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene2-svg {
            width: 800px;
            height: 500px;
        }
        .scene2-formula-box {
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }
        .scene2-formula-box.visible {
            opacity: 1;
        }
        .scene2-btn {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #333;
            border-radius: 4px;
            background: #f5f5f5;
        }
        .scene2-btn:hover {
            background: #e0e0e0;
        }
        .scene2-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .scene2-step-indicator {
            font-size: 14px;
            color: #666;
            padding: 8px 16px;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500">
            <!-- 圆 O: 圆心 (180,320), r=110 -->
            <circle id="scene2-circle-o" cx="180" cy="320" r="110" fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 切线 PE: P(120,90)-E(70,320) -->
            <line id="scene2-line-pe" x1="120" y1="90" x2="70" y2="320" stroke="#000000" stroke-width="2"/>
            
            <!-- 割线 PBA: P(120,90)-B(230,240)-A(290,320) -->
            <line id="scene2-line-pb" x1="120" y1="90" x2="230" y2="240" stroke="#000000" stroke-width="2"/>
            <line id="scene2-line-ba" x1="230" y1="240" x2="290" y2="320" stroke="#000000" stroke-width="2"/>
            
            <!-- 弦 AE: E(70,320)-A(290,320) 水平直径 -->
            <line id="scene2-line-ae" x1="70" y1="320" x2="290" y2="320" stroke="#000000" stroke-width="2"/>
            
            <!-- 弦 BE: E(70,320)-B(230,240) -->
            <line id="scene2-line-be" x1="70" y1="320" x2="230" y2="240" stroke="#000000" stroke-width="2"/>
            
            <!-- 角平分线 PC: P(120,90)-C(165,320) 蓝色高亮 -->
            <line id="scene2-line-pc" x1="120" y1="90" x2="165" y2="320" stroke="#1565c0" stroke-width="2.5"/>
            
            <!-- 角度弧 α (∠PEA) E 点处 r=25 -->
            <path id="scene2-arc-alpha-e" d="M 95 320 A 25 25 0 0 1 93 308" fill="none" stroke="#1565c0" stroke-width="1.5" opacity="0"/>
            
            <!-- 角度弧 α (∠PBE) B 点处 r=20 -->
            <path id="scene2-arc-alpha-b" d="M 215 252 A 20 20 0 0 1 220 235" fill="none" stroke="#1565c0" stroke-width="1.5" opacity="0"/>
            
            <!-- 角度弧 β (∠EPC) P 点左侧 r=22 -->
            <path id="scene2-arc-beta-1" d="M 135 110 A 22 22 0 0 1 142 105" fill="none" stroke="#1565c0" stroke-width="1.5" opacity="0"/>
            
            <!-- 角度弧 β (∠CPA) P 点右侧 r=22 -->
            <path id="scene2-arc-beta-2" d="M 142 105 A 22 22 0 0 1 150 102" fill="none" stroke="#1565c0" stroke-width="1.5" opacity="0"/>
            
            <!-- 角度弧 40° (∠AEB) E 点处 r=30 -->
            <path id="scene2-arc-40" d="M 100 320 A 30 30 0 0 1 105 305" fill="none" stroke="#c62828" stroke-width="1.5"/>
            
            <!-- 点标记 -->
            <circle cx="120" cy="90" r="3" fill="#000000"/>
            <circle cx="70" cy="320" r="3" fill="#000000"/>
            <circle cx="290" cy="320" r="3" fill="#000000"/>
            <circle cx="230" cy="240" r="3" fill="#000000"/>
            <circle cx="165" cy="320" r="3" fill="#1565c0"/>
            <circle cx="195" cy="285" r="3" fill="#1565c0"/>
            
            <!-- 点标签 - 调整位置避免与图形重叠 -->
            <text id="scene2-label-p" x="115" y="65" font-size="14" fill="#000000">P</text>
            <text id="scene2-label-e" x="35" y="370" font-size="14" fill="#000000">E</text>
            <text id="scene2-label-a" x="300" y="350" font-size="14" fill="#000000">A</text>
            <text id="scene2-label-b" x="275" y="180" font-size="14" fill="#000000">B</text>
            <text id="scene2-label-c" x="165" y="385" font-size="14" fill="#000000" text-anchor="middle">C</text>
            <text id="scene2-label-d" x="245" y="240" font-size="14" fill="#000000">D</text>
            
            <!-- 角度标签 - 调整位置避免重叠 -->
            <text id="scene2-label-alpha-e" x="35" y="405" font-size="14" fill="#1565c0" font-style="italic" opacity="0">α</text>
            <text id="scene2-label-alpha-b" x="295" y="195" font-size="14" fill="#1565c0" font-style="italic" opacity="0">α</text>
            <text id="scene2-label-beta-1" x="100" y="155" font-size="14" fill="#1565c0" font-style="italic" opacity="0">β</text>
            <text id="scene2-label-beta-2" x="155" y="155" font-size="14" fill="#1565c0" font-style="italic" opacity="0">β</text>
            <text id="scene2-label-40" x="40" y="270" font-size="16" fill="#c62828">40°</text>
            
            <!-- 公式框区域 (450-770, 80-350) -->
            <text x="560" y="80" font-size="16" fill="#000000" text-anchor="middle">角度推导过程</text>
            
            <!-- 公式框 1: 外角定理 (450,100)-(770,160) -->
            <rect id="scene2-formula-box-1" x="450" y="100" width="320" height="60" fill="#ffffff" stroke="#000000" stroke-width="1" class="scene2-formula-box"/>
            <text id="scene2-formula-1" x="610" y="140" font-size="16" fill="#000000" text-anchor="middle" class="scene2-formula-box">∠PCE = ∠EPC + ∠PEC</text>
            
            <!-- 公式框 2: 推导链 (450,180)-(770,260) -->
            <rect id="scene2-formula-box-2" x="450" y="180" width="320" height="80" fill="#ffffff" stroke="#000000" stroke-width="1" class="scene2-formula-box"/>
            <text id="scene2-formula-2-1" x="610" y="208" font-size="13" fill="#000000" text-anchor="middle" class="scene2-formula-box">弦切角：∠PEA = ∠PBE = α</text>
            <text id="scene2-formula-2-2" x="610" y="230" font-size="13" fill="#000000" text-anchor="middle" class="scene2-formula-box">角平分线：∠EPC = ∠CPA = β</text>
            <text id="scene2-formula-2-3" x="610" y="252" font-size="13" fill="#000000" text-anchor="middle" class="scene2-formula-box">已知：∠AEB = 40°</text>
            <text id="scene2-formula-2-4" x="610" y="274" font-size="13" fill="#000000" text-anchor="middle" class="scene2-formula-box">∴ ∠PEC = α + 40°</text>
            
            <!-- 公式框 3: 最终答案 (450,280)-(770,350) -->
            <rect id="scene2-formula-box-3" x="450" y="280" width="320" height="70" fill="#2e7d32" stroke="#000000" stroke-width="1" class="scene2-formula-box"/>
            <text id="scene2-formula-3" x="610" y="322" font-size="20" fill="#ffffff" font-weight="bold" text-anchor="middle" class="scene2-formula-box">∠PCE = 70°</text>
            
            <!-- ∠PCE 绿色高亮弧 -->
            <path id="scene2-arc-pce" d="M 175 305 A 20 20 0 0 1 180 295" fill="none" stroke="#2e7d32" stroke-width="2" opacity="0"/>
            
        </svg>
        
        <!-- HTML 按钮控件 -->
        <div id="scene2-controls-html" style="position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10;">
            <button id="scene2-btn-prev" class="scene2-btn" disabled>◀ 上一步</button>
            <span id="scene2-step-indicator" class="scene2-step-indicator">步骤 1/4</span>
            <button id="scene2-btn-next" class="scene2-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现：角度关系代数推导可视化
        
        // 布局坐标表参考：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // |------|------|-----------|------|-------------|------|
        // | 圆 O | 圆 | 圆心 (180,320), r=110 | r=110 | - | 左侧主图区 |
        // | 点 E | 点 | (70,320) | 4×4 | 左下 | 切点 |
        // | 点 A | 点 | (290,320) | 4×4 | 右下 | 圆上点 |
        // | 点 B | 点 | (230,240) | 4×4 | 右上 | 圆上点 |
        // | 点 P | 点 | (120,90) | 4×4 | 左上 | 圆外点 |
        // | 点 C | 点 | (165,320) | 4×4 | 下方 | AE 与角平分线交点 |
        // | 点 D | 点 | (195,285) | 4×4 | 右上方 | BE 与角平分线交点 |
        
        let currentStep = 0;
        const totalSteps = 4;
        
        // 每步显示的元素配置
        const stepConfig = [
            {
                // 步骤 0：初始状态 - 只显示基础图形和已知角
                showAlpha: false,
                showBeta: false,
                showFormula1: false,
                showFormula2: false,
                showFormula3: false,
                showPceArc: false
            },
            {
                // 步骤 1：显示外角定理公式
                showAlpha: true,
                showBeta: true,
                showFormula1: true,
                showFormula2: false,
                showFormula3: false,
                showPceArc: false
            },
            {
                // 步骤 2：显示推导链
                showAlpha: true,
                showBeta: true,
                showFormula1: true,
                showFormula2: true,
                showFormula3: false,
                showPceArc: false
            },
            {
                // 步骤 3：显示最终答案
                showAlpha: true,
                showBeta: true,
                showFormula1: true,
                showFormula2: true,
                showFormula3: true,
                showPceArc: true
            }
        ];
        
        // 获取 DOM 元素
        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        const stepIndicator = document.getElementById('scene2-step-indicator');
        
        // 角度标签元素
        const labelAlphaE = document.getElementById('scene2-label-alpha-e');
        const labelAlphaB = document.getElementById('scene2-label-alpha-b');
        const labelBeta1 = document.getElementById('scene2-label-beta-1');
        const labelBeta2 = document.getElementById('scene2-label-beta-2');
        const arcAlphaE = document.getElementById('scene2-arc-alpha-e');
        const arcAlphaB = document.getElementById('scene2-arc-alpha-b');
        const arcBeta1 = document.getElementById('scene2-arc-beta-1');
        const arcBeta2 = document.getElementById('scene2-arc-beta-2');
        
        // 公式框元素
        const formulaBox1 = document.getElementById('scene2-formula-box-1');
        const formula1 = document.getElementById('scene2-formula-1');
        const formulaBox2 = document.getElementById('scene2-formula-box-2');
        const formula2_1 = document.getElementById('scene2-formula-2-1');
        const formula2_2 = document.getElementById('scene2-formula-2-2');
        const formula2_3 = document.getElementById('scene2-formula-2-3');
        const formula2_4 = document.getElementById('scene2-formula-2-4');
        const formulaBox3 = document.getElementById('scene2-formula-box-3');
        const formula3 = document.getElementById('scene2-formula-3');
        
        // ∠PCE 高亮弧
        const arcPce = document.getElementById('scene2-arc-pce');
        
        // 更新显示状态
        function updateDisplay() {
            const config = stepConfig[currentStep];
            
            // 更新角度标签和弧
            const alphaElements = [labelAlphaE, labelAlphaB, arcAlphaE, arcAlphaB];
            const betaElements = [labelBeta1, labelBeta2, arcBeta1, arcBeta2];
            
            alphaElements.forEach(el => {
                el.style.opacity = config.showAlpha ? '1' : '0';
            });
            betaElements.forEach(el => {
                el.style.opacity = config.showBeta ? '1' : '0';
            });
            
            // 更新公式框
            const formula1Elements = [formulaBox1, formula1];
            formula1Elements.forEach(el => {
                if (config.showFormula1) {
                    el.classList.add('visible');
                } else {
                    el.classList.remove('visible');
                }
            });
            
            const formula2Elements = [formulaBox2, formula2_1, formula2_2, formula2_3, formula2_4];
            formula2Elements.forEach(el => {
                if (config.showFormula2) {
                    el.classList.add('visible');
                } else {
                    el.classList.remove('visible');
                }
            });
            
            const formula3Elements = [formulaBox3, formula3];
            formula3Elements.forEach(el => {
                if (config.showFormula3) {
                    el.classList.add('visible');
                } else {
                    el.classList.remove('visible');
                }
            });
            
            // 更新∠PCE 高亮弧
            arcPce.style.opacity = config.showPceArc ? '1' : '0';
            
            // 更新按钮状态
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps - 1;
            
            // 更新步骤指示器
            const stepNum = currentStep + 1;
            stepIndicator.textContent = `步骤 ${stepNum}/${totalSteps}`;
        }
        
        // 按钮事件绑定
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        });
        
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateDisplay();
            }
        });
        
        // 初始化显示
        updateDisplay();
        
    })();
    </script>
</body>
</html>
