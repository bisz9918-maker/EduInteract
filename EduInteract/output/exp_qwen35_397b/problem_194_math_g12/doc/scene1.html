<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四面体 ABCD - AD⊥BC 垂直关系</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }
        .scene1-btn {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #333;
            border-radius: 4px;
            background: #f5f5f5;
            transition: background 0.2s;
        }
        .scene1-btn:hover {
            background: #e0e0e0;
        }
        .scene1-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #scene1-step-indicator {
            font-size: 14px;
            color: #333;
            min-width: 80px;
            text-align: center;
        }
        /* 棱的样式 */
        .scene1-edge {
            stroke: #000000;
            stroke-width: 3;
            fill: none;
            transition: stroke 0.3s ease, stroke-width 0.3s ease;
        }
        .scene1-edge.hidden {
            opacity: 0;
        }
        .scene1-edge-highlight-ad {
            stroke: #1565c0 !important;
            stroke-width: 5 !important;
        }
        .scene1-edge-highlight-bc {
            stroke: #c62828 !important;
            stroke-width: 5 !important;
        }
        /* 虚线棱 AC */
        .scene1-edge-dashed {
            stroke: #888888;
            stroke-width: 3;
            stroke-dasharray: 5, 5;
            fill: none;
            transition: stroke 0.3s ease, stroke-width 0.3s ease;
        }
        /* 顶点 */
        .scene1-vertex {
            fill: #333333;
        }
        /* 标签 */
        .scene1-label {
            font-size: 18px;
            fill: #333333;
            font-family: serif;
        }
        .scene1-length-label {
            font-size: 16px;
            fill: #000000;
            font-family: sans-serif;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .scene1-length-label.visible {
            opacity: 1;
        }
        /* 公垂线段 */
        .scene1-perp-line {
            stroke: #2e7d32;
            stroke-width: 3;
            fill: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .scene1-perp-line.visible {
            opacity: 1;
        }
        /* 垂直符号 */
        .scene1-perp-symbol {
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .scene1-perp-symbol.visible {
            opacity: 1;
        }
        /* 垂直标注 ⊥ */
        .scene1-perp-text {
            font-size: 20px;
            fill: #2e7d32;
            font-family: sans-serif;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .scene1-perp-text.visible {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 四面体棱线 -->
            <!-- 棱 AD: (280,400)-(280,80) 竖直 -->
            <line id="scene1-edge-ad" class="scene1-edge" x1="280" y1="400" x2="280" y2="80" />
            
            <!-- 棱 AB: (280,400)-(460,350) -->
            <line id="scene1-edge-ab" class="scene1-edge" x1="280" y1="400" x2="460" y2="350" />
            
            <!-- 棱 BD: (460,350)-(280,80) -->
            <line id="scene1-edge-bd" class="scene1-edge" x1="460" y1="350" x2="280" y2="80" />
            
            <!-- 棱 BC: (460,350)-(620,280) -->
            <line id="scene1-edge-bc" class="scene1-edge" x1="460" y1="350" x2="620" y2="280" />
            
            <!-- 棱 CD: (620,280)-(280,80) -->
            <line id="scene1-edge-cd" class="scene1-edge" x1="620" y1="280" x2="280" y2="80" />
            
            <!-- 棱 AC: (280,400)-(620,280) 虚线（被遮挡） -->
            <line id="scene1-edge-ac" class="scene1-edge-dashed" x1="280" y1="400" x2="620" y2="280" />
            
            <!-- 公垂线段: (280,280)-(460,280) 步骤 3 显示 -->
            <line id="scene1-perp-line" class="scene1-perp-line" x1="280" y1="280" x2="460" y2="280" />
            
            <!-- 垂直符号（直角标记）在 (280,280) -->
            <g id="scene1-perp-symbol" class="scene1-perp-symbol">
                <line x1="280" y1="295" x2="295" y2="295" stroke="#2e7d32" stroke-width="2" />
                <line x1="295" y1="280" x2="295" y2="295" stroke="#2e7d32" stroke-width="2" />
            </g>
            
            <!-- 顶点 -->
            <circle id="scene1-vertex-a" class="scene1-vertex" cx="280" cy="400" r="3" />
            <circle id="scene1-vertex-b" class="scene1-vertex" cx="460" cy="350" r="3" />
            <circle id="scene1-vertex-c" class="scene1-vertex" cx="620" cy="280" r="3" />
            <circle id="scene1-vertex-d" class="scene1-vertex" cx="280" cy="80" r="3" />
            
            <!-- 顶点标签 - 调整位置避免与棱线重叠 -->
            <!-- A: 左下，向左下偏移 -->
            <text id="scene1-label-a" class="scene1-label" x="260" y="425">A</text>
            <!-- B: 右下，向右偏移，放在控件栏上方 -->
            <text id="scene1-label-b" class="scene1-label" x="560" y="445">B</text>
            <!-- C: 右侧，向右偏移 -->
            <text id="scene1-label-c" class="scene1-label" x="635" y="285">C</text>
            <!-- D: 左上，向左上偏移 -->
            <text id="scene1-label-d" class="scene1-label" x="260" y="70">D</text>
            
            <!-- 长度标注 - 调整位置避免与棱线重叠 -->
            <!-- 2c: AD 棱右侧，放在 AD 棱旁边空白区域 -->
            <text id="scene1-length-ad" class="scene1-length-label" x="310" y="240">2c</text>
            <!-- 2: BC 棱下方，放在控件栏上方 -->
            <text id="scene1-length-bc" class="scene1-length-label" x="540" y="445">2</text>
            
            <!-- 垂直标注 ⊥ - 向上偏移更多，远离公垂线段 -->
            <text id="scene1-perp-text" class="scene1-perp-text" x="380" y="80">⊥</text>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/4</span>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现：四面体 ABCD 的三维结构及 AD⊥BC 的垂直关系
        
        // 布局坐标表（实现对照依据）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // |------|------|-----------|------|-------------|------|
        // | 顶点 A | 点 | (280, 400) | 4×4 | 左下 | 四面体左下顶点 |
        // | 顶点 B | 点 | (460, 350) | 4×4 | 右下 | 四面体右下前顶点 |
        // | 顶点 C | 点 | (620, 280) | 4×4 | 右侧 | 四面体右上后顶点 |
        // | 顶点 D | 点 | (280, 80) | 4×4 | 左上 | 四面体左上顶点 |
        // | 棱 AD | 线段 | (280,400)-(280,80) | 4×320 | - | 竖直实线，黑色 |
        // | 棱 AB | 线段 | (280,400)-(460,350) | 4×186 | - | 实线，黑色 |
        // | 棱 BD | 线段 | (460,350)-(280,80) | 4×305 | - | 实线，黑色 |
        // | 棱 BC | 线段 | (460,350)-(620,280) | 4×175 | - | 实线，黑色 |
        // | 棱 CD | 线段 | (620,280)-(280,80) | 4×369 | - | 实线，黑色 |
        // | 棱 AC | 线段 | (280,400)-(620,280) | 4×355 | - | 虚线，灰色（被遮挡） |
        // | 标签 A | text | (260, 425) | ~20×16 | 左下 | 顶点 A 标注（调整后） |
        // | 标签 B | text | (560, 445) | ~20×16 | 右下 | 顶点 B 标注（调整后） |
        // | 标签 C | text | (635, 285) | ~20×16 | 右侧 | 顶点 C 标注 |
        // | 标签 D | text | (260, 70) | ~20×16 | 左上 | 顶点 D 标注 |
        // | 长度 2c | text | (310, 240) | ~30×16 | 右侧 | AD 棱长度标注（调整后） |
        // | 长度 2 | text | (540, 445) | ~20×16 | 下方 | BC 棱长度标注（调整后） |
        // | 公垂线段 | 线段 | (280,280)-(460,280) | 3×180 | - | 绿色，步骤 3 显示 |
        // | 垂直符号 | 直角标记 | (280,280) | 15×15 | - | 绿色，步骤 3 显示 |
        // | 垂直符号⊥ | text | (380, 80) | ~20×16 | 上方 | 垂直关系标注（调整后） |
        
        // 状态变量
        let currentStep = 0;
        const totalSteps = 4; // 步骤 0-3
        
        // DOM 元素引用
        const edgeAD = document.getElementById('scene1-edge-ad');
        const edgeBC = document.getElementById('scene1-edge-bc');
        const lengthAD = document.getElementById('scene1-length-ad');
        const lengthBC = document.getElementById('scene1-length-bc');
        const perpLine = document.getElementById('scene1-perp-line');
        const perpSymbol = document.getElementById('scene1-perp-symbol');
        const perpText = document.getElementById('scene1-perp-text');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        
        // 更新场景显示
        function updateScene() {
            // 重置所有高亮和标注
            edgeAD.classList.remove('scene1-edge-highlight-ad');
            edgeBC.classList.remove('scene1-edge-highlight-bc');
            lengthAD.classList.remove('visible');
            lengthBC.classList.remove('visible');
            perpLine.classList.remove('visible');
            perpSymbol.classList.remove('visible');
            perpText.classList.remove('visible');
            
            // 根据当前步骤设置显示
            switch (currentStep) {
                case 0:
                    // 初始状态：只显示四面体框架，无长度标注
                    break;
                case 1:
                    // 步骤 1：高亮 AD 棱，显示长度 2c
                    edgeAD.classList.add('scene1-edge-highlight-ad');
                    lengthAD.classList.add('visible');
                    break;
                case 2:
                    // 步骤 2：高亮 BC 棱，显示长度 2
                    edgeBC.classList.add('scene1-edge-highlight-bc');
                    lengthBC.classList.add('visible');
                    break;
                case 3:
                    // 步骤 3：显示公垂线段和垂直符号
                    perpLine.classList.add('visible');
                    perpSymbol.classList.add('visible');
                    perpText.classList.add('visible');
                    break;
            }
            
            // 更新步骤指示器
            stepIndicator.textContent = `步骤 ${currentStep + 1}/${totalSteps}`;
            
            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps - 1);
        }
        
        // 事件处理
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });
        
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateScene();
            }
        });
        
        // 初始化
        updateScene();
    })();
    </script>
</body>
</html>
