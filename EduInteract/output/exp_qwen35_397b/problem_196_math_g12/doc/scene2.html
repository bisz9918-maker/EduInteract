<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>角度关系推导与四点共圆</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene2-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene2-svg {
            width: 800px;
            height: 500px;
        }
        /* 淡入动画 */
        .fade-in {
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }
        .fade-in.visible {
            opacity: 1;
        }
        /* 隐藏类 */
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 定义箭头和标记 -->
            <defs>
                <marker id="scene2-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#000" />
                </marker>
            </defs>

            <!-- ========== 基础图形 ========== -->
            <!-- 圆 O -->
            <circle id="scene2-circle-o" cx="560" cy="240" r="90" fill="none" stroke="#000" stroke-width="2" />

            <!-- 线段 AO (水平线) -->
            <line id="scene2-line-ao" x1="180" y1="240" x2="560" y2="240" stroke="#000" stroke-width="2" />

            <!-- 线段 AP (切线) -->
            <line id="scene2-line-ap" x1="180" y1="240" x2="530" y2="155" stroke="#000" stroke-width="2" />

            <!-- 线段 OP (半径) -->
            <line id="scene2-line-op" x1="560" y1="240" x2="530" y2="155" stroke="#000" stroke-width="2" />

            <!-- 线段 OM (半径到中点) -->
            <line id="scene2-line-om" x1="560" y1="240" x2="545" y2="285" stroke="#000" stroke-width="2" />

            <!-- 线段 AM -->
            <line id="scene2-line-am" x1="180" y1="240" x2="545" y2="285" stroke="#000" stroke-width="2" />

            <!-- 线段 PM -->
            <line id="scene2-line-pm" x1="530" y1="155" x2="545" y2="285" stroke="#000" stroke-width="2" />

            <!-- ========== 四边形 OAPM (蓝色粗边框) ========== -->
            <path id="scene2-quad-oapm" d="M560,240 L180,240 L530,155 L545,285 Z" 
                  fill="rgba(21,101,192,0.15)" stroke="#1565c0" stroke-width="3" />

            <!-- ========== 直角标记 ∠OPA (蓝色 L 形) ========== -->
            <g id="scene2-angle-opa-mark">
                <!-- L 形直角标记 -->
                <path d="M530,167 L530,155 L518,155" fill="none" stroke="#1565c0" stroke-width="2" />
                <!-- 90° 标签 - 向左下偏移，远离 P 点 -->
                <text id="scene2-text-opa-90" x="495" y="185" font-size="14" fill="#1565c0" font-weight="bold">90°</text>
            </g>

            <!-- ========== 直角标记 ∠OMA (绿色 L 形) ========== -->
            <g id="scene2-angle-oma-mark">
                <!-- L 形直角标记 -->
                <path d="M545,273 L545,285 L533,285" fill="none" stroke="#2e7d32" stroke-width="2" />
                <!-- 90° 标签 -->
                <text id="scene2-text-oma-90" x="515" y="265" font-size="14" fill="#2e7d32" font-weight="bold">90°</text>
            </g>

            <!-- ========== 四点共圆外接圆 (灰色虚线) ========== -->
            <circle id="scene2-circumcircle" class="fade-in hidden" 
                    cx="370" cy="240" r="195" 
                    fill="none" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" />

            <!-- ========== 角度弧 ∠OAM (红色，A 点处) ========== -->
            <!-- 从 AO 到 AM 的弧 -->
            <path id="scene2-arc-oam" class="fade-in hidden" 
                  d="M200,240 A20,20 0 0,1 201,243" 
                  fill="none" stroke="#c62828" stroke-width="2" />

            <!-- ========== 角度弧 ∠OPM (橙色，P 点处) ========== -->
            <!-- 从 PO 到 PM 的弧 -->
            <path id="scene2-arc-opm" class="fade-in hidden" 
                  d="M542,165 A35,35 0 0,1 547,180" 
                  fill="none" stroke="#ff9800" stroke-width="2" />

            <!-- ========== 角度弧 ∠APM (红色，P 点处) ========== -->
            <!-- 从 PA 到 PM 的弧 -->
            <path id="scene2-arc-apm" class="fade-in hidden" 
                  d="M515,150 A30,30 0 0,1 547,180" 
                  fill="none" stroke="#c62828" stroke-width="2" />

            <!-- ========== 标签文本 ========== -->
            <text id="scene2-label-o" x="580" y="245" font-size="14" fill="#000">O</text>
            <text id="scene2-label-a" x="155" y="245" font-size="14" fill="#000">A</text>
            <text id="scene2-label-p" x="540" y="135" font-size="14" fill="#000">P</text>
            <text id="scene2-label-m" x="550" y="310" font-size="14" fill="#000">M</text>

            <!-- ========== 步骤说明文本 ========== -->
            <text id="scene2-step-text-1" class="fade-in hidden" 
                  x="250" y="45" font-size="14" fill="#333">O、A、P、M 四点共圆（对角互补）</text>
            <text id="scene2-step-text-2" class="fade-in hidden" 
                  x="250" y="75" font-size="14" fill="#333">∠OAM = ∠OPM（同弧 OM 所对圆周角）</text>

            <!-- ========== 结论文本 ========== -->
            <text id="scene2-conclusion" class="fade-in hidden" 
                  x="400" y="410" font-size="16" fill="#1565c0" font-weight="bold" text-anchor="middle">
                ∠OAM + ∠APM = ∠OPM + ∠APM = ∠OPA = 90°
            </text>

            <!-- ========== 控件栏 (SVG 内部底部) ========== -->
            <g id="scene2-controls">
                <rect x="0" y="445" width="800" height="55" fill="#f5f5f5" opacity="0.9" />
                
                <!-- 上一步按钮组 -->
                <g id="scene2-btn-prev" style="cursor: pointer;">
                    <rect id="scene2-btn-prev-bg" x="280" y="455" width="80" height="32" rx="4" fill="#1565c0" />
                    <text id="scene2-btn-prev-text" x="320" y="477" font-size="14" fill="#fff" text-anchor="middle">◀ 上一步</text>
                </g>
                
                <!-- 步骤指示器 -->
                <text id="scene2-step-indicator" x="400" y="477" font-size="14" fill="#333" text-anchor="middle">步骤 1/4</text>
                
                <!-- 下一步按钮组 -->
                <g id="scene2-btn-next" style="cursor: pointer;">
                    <rect id="scene2-btn-next-bg" x="440" y="455" width="80" height="32" rx="4" fill="#1565c0" />
                    <text id="scene2-btn-next-text" x="480" y="477" font-size="14" fill="#fff" text-anchor="middle">下一步 ▶</text>
                </g>
            </g>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 2: 角度关系推导与四点共圆
        // 布局坐标表（实现对照依据）：
        // | 元素 | 位置/范围 | 备注 |
        // |------|-----------|------|
        // | 圆 O | 圆心(560,240), r=90 | 右侧主圆 |
        // | 四边形 OAPM | O(560,240)→A(180,240)→P(530,155)→M(545,285)→O | 蓝色粗线 |
        // | 四点共圆外接圆 | 圆心(370,240), r=195 | 灰色虚线 |
        // | 直角标记∠OPA | P 点处，90°标签(495,185) | 蓝色 |
        // | 直角标记∠OMA | M 点处，90°标签(515,265) | 绿色 |
        // | 控件栏 | y=445~500 | 底部 |

        let currentStep = 0;
        const totalSteps = 4;

        // 获取元素
        const circumcircle = document.getElementById('scene2-circumcircle');
        const arcOam = document.getElementById('scene2-arc-oam');
        const arcOpm = document.getElementById('scene2-arc-opm');
        const arcApm = document.getElementById('scene2-arc-apm');
        const stepText1 = document.getElementById('scene2-step-text-1');
        const stepText2 = document.getElementById('scene2-step-text-2');
        const conclusion = document.getElementById('scene2-conclusion');
        const stepIndicator = document.getElementById('scene2-step-indicator');
        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnPrevBg = document.getElementById('scene2-btn-prev-bg');
        const btnPrevText = document.getElementById('scene2-btn-prev-text');
        const btnNext = document.getElementById('scene2-btn-next');
        const btnNextBg = document.getElementById('scene2-btn-next-bg');
        const btnNextText = document.getElementById('scene2-btn-next-text');

        // 显示/隐藏辅助函数
        function showElement(el) {
            if (el) {
                el.classList.remove('hidden');
                // 触发重绘以启动淡入动画
                void el.offsetWidth;
                el.classList.add('visible');
            }
        }

        function hideElement(el) {
            if (el) {
                el.classList.remove('visible');
                el.classList.add('hidden');
            }
        }

        // 更新按钮状态
        function updateButtons() {
            if (currentStep === 0) {
                btnPrevBg.setAttribute('fill', '#bdbdbd');
                btnPrevText.setAttribute('fill', '#757575');
                btnPrev.style.pointerEvents = 'none';
            } else {
                btnPrevBg.setAttribute('fill', '#1565c0');
                btnPrevText.setAttribute('fill', '#fff');
                btnPrev.style.pointerEvents = 'auto';
            }

            if (currentStep === totalSteps - 1) {
                btnNextBg.setAttribute('fill', '#bdbdbd');
                btnNextText.setAttribute('fill', '#757575');
                btnNext.style.pointerEvents = 'none';
            } else {
                btnNextBg.setAttribute('fill', '#1565c0');
                btnNextText.setAttribute('fill', '#fff');
                btnNext.style.pointerEvents = 'auto';
            }

            stepIndicator.textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;
        }

        // 渲染当前步骤
        function renderStep() {
            // 先隐藏所有步骤相关元素
            hideElement(circumcircle);
            hideElement(arcOam);
            hideElement(arcOpm);
            hideElement(arcApm);
            hideElement(stepText1);
            hideElement(stepText2);
            hideElement(conclusion);

            // 根据当前步骤显示相应元素
            if (currentStep >= 1) {
                showElement(circumcircle);
                showElement(stepText1);
            }

            if (currentStep >= 2) {
                showElement(arcOam);
                showElement(arcOpm);
                showElement(stepText2);
            }

            if (currentStep >= 3) {
                showElement(arcApm);
                showElement(conclusion);
            }

            updateButtons();
        }

        // 上一步
        function prevStep() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        }

        // 下一步
        function nextStep() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                renderStep();
            }
        }

        // 绑定按钮点击事件
        btnPrev.addEventListener('click', prevStep);
        btnNext.addEventListener('click', nextStep);

        // 初始化
        renderStep();
    })();
    </script>
</body>
</html>
