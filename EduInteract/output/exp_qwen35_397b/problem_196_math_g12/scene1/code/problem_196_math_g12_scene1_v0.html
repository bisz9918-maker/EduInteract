<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圆的切线与割线性质 - ∠OAM+∠APM</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }
        .scene1-btn {
            padding: 8px 16px;
            font-size: 14px;
            border: 1px solid #333;
            border-radius: 4px;
            background: #f5f5f5;
            cursor: pointer;
            transition: background 0.2s;
        }
        .scene1-btn:hover {
            background: #e0e0e0;
        }
        .scene1-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #scene1-step-indicator {
            font-size: 14px;
            color: #333;
            min-width: 80px;
            text-align: center;
        }
        /* 元素显隐控制 */
        .scene1-hidden {
            opacity: 0;
            display: none;
        }
        .scene1-visible {
            opacity: 1;
            display: block;
        }
        /* 平滑过渡 */
        .scene1-transition {
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 圆 O：圆心 (580,280), r=120 -->
            <circle id="scene1-circle-o" cx="580" cy="280" r="120" fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 切线 AP：A(50,280)→P(553,397) -->
            <line id="scene1-line-ap" x1="50" y1="280" x2="553" y2="397" stroke="#000000" stroke-width="2"/>
            
            <!-- 割线 AC：A(50,280)→C(698,256) -->
            <line id="scene1-line-ac" x1="50" y1="280" x2="698" y2="256" stroke="#000000" stroke-width="2"/>
            
            <!-- 半径 OP：O(580,280)→P(553,397) - 步骤 1 显示 -->
            <line id="scene1-line-op" x1="580" y1="280" x2="553" y2="397" stroke="#1565c0" stroke-width="2" class="scene1-hidden scene1-transition"/>
            
            <!-- 线段 OM：O(580,280)→M(580,260) - 步骤 2 显示 -->
            <line id="scene1-line-om" x1="580" y1="280" x2="580" y2="260" stroke="#2e7d32" stroke-width="2" class="scene1-hidden scene1-transition"/>
            
            <!-- 线段 AM：A(50,280)→M(580,260) - 步骤 3 显示 -->
            <line id="scene1-line-am" x1="50" y1="280" x2="580" y2="260" stroke="#c62828" stroke-width="2" class="scene1-hidden scene1-transition"/>
            
            <!-- 线段 PM：P(553,397)→M(580,260) - 步骤 3 显示 -->
            <line id="scene1-line-pm" x1="553" y1="397" x2="580" y2="260" stroke="#c62828" stroke-width="2" class="scene1-hidden scene1-transition"/>
            
            <!-- 直角标记 P：P 点处小正方形 - 步骤 1 显示 -->
            <path id="scene1-rect-p" d="M 553 385 L 565 385 L 565 397 L 553 397 Z" fill="none" stroke="#000000" stroke-width="1" class="scene1-hidden scene1-transition"/>
            
            <!-- 直角标记 M：M 点处小正方形 - 步骤 2 显示 -->
            <path id="scene1-rect-m" d="M 568 260 L 580 260 L 580 272 L 568 272 Z" fill="none" stroke="#000000" stroke-width="1" class="scene1-hidden scene1-transition"/>
            
            <!-- ∠OAM 弧：以 A 为中心，r=25px - 步骤 3 显示 -->
            <path id="scene1-arc-oam" d="" fill="none" stroke="#c62828" stroke-width="1.5" class="scene1-hidden scene1-transition"/>
            
            <!-- ∠APM 弧：以 P 为中心，r=25px - 步骤 3 显示 -->
            <path id="scene1-arc-apm" d="" fill="none" stroke="#c62828" stroke-width="1.5" class="scene1-hidden scene1-transition"/>
            
            <!-- 点标记 -->
            <circle id="scene1-point-a" cx="50" cy="280" r="2" fill="#000000"/>
            <circle id="scene1-point-o" cx="580" cy="280" r="2" fill="#000000"/>
            <circle id="scene1-point-p" cx="553" cy="397" r="2" fill="#000000"/>
            <circle id="scene1-point-b" cx="461" cy="265" r="2" fill="#000000"/>
            <circle id="scene1-point-c" cx="698" cy="256" r="2" fill="#000000"/>
            <circle id="scene1-point-m" cx="580" cy="260" r="2" fill="#000000"/>
            
            <!-- 点标签 - 调整位置避免与图形重叠 -->
            <!-- 圆边界：圆心 (580,280), r=120 → 左 x=460, 右 x=700, 上 y=160, 下 y=400 -->
            <!-- A: 左侧远 -->
            <text id="scene1-label-a" x="25" y="285" font-size="14" fill="#000000">A</text>
            <!-- O: 圆心正下方，圆外 (圆下边缘 y=400) -->
            <text id="scene1-label-o" x="580" y="425" font-size="14" fill="#000000">O</text>
            <!-- P: 左下方，圆外 (y>400) -->
            <text id="scene1-label-p" x="535" y="420" font-size="14" fill="#000000">P</text>
            <!-- B: 左下方，远离割线 (B 在 (461,265), 割线 y≈265) -->
            <text id="scene1-label-b" x="400" y="350" font-size="14" fill="#000000">B</text>
            <!-- C: 右侧，圆外 (x>700) -->
            <text id="scene1-label-c" x="710" y="260" font-size="14" fill="#000000">C</text>
            <!-- M: 正上方，圆外 (圆上边缘 y=160) -->
            <text id="scene1-label-m" x="580" y="145" font-size="14" fill="#000000">M</text>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/4</span>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现：圆的切线与割线性质
        
        // 布局坐标表（实现对照依据）：
        // | 元素 | 类型 | 位置/范围 | 备注 |
        // |------|------|-----------|------|
        // | 圆 O | circle | 圆心 (580,280), r=120 | 黑色轮廓 2px |
        // | 切线 AP | line | A(50,280)→P(553,397) | 黑色实线 2px |
        // | 割线 AC | line | A(50,280)→C(698,256) | 黑色实线 2px |
        // | 半径 OP | line | O(580,280)→P(553,397) | 蓝色 #1565c0，步骤 1 显示 |
        // | 线段 OM | line | O(580,280)→M(580,260) | 绿色 #2e7d32，步骤 2 显示 |
        // | 线段 AM | line | A(50,280)→M(580,260) | 红色 #c62828，步骤 3 显示 |
        // | 线段 PM | line | P(553,397)→M(580,260) | 红色 #c62828，步骤 3 显示 |
        // | 点 A | 点 | (50,280) | 标签"A" 左侧 |
        // | 点 O | 点 | (580,280) | 标签"O" 下方 |
        // | 点 P | 点 | (553,397) | 标签"P" 左下方 |
        // | 点 B | 点 | (461,265) | 标签"B" 左下方 |
        // | 点 C | 点 | (698,256) | 标签"C" 右侧 |
        // | 点 M | 点 | (580,260) | 标签"M" 上方 |
        
        // 状态变量
        let currentStep = 0;
        const totalSteps = 4;
        
        // DOM 元素
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        
        // 步骤相关元素
        const step1Elements = [
            document.getElementById('scene1-line-op'),
            document.getElementById('scene1-rect-p')
        ];
        
        const step2Elements = [
            document.getElementById('scene1-line-om'),
            document.getElementById('scene1-rect-m')
        ];
        
        const step3Elements = [
            document.getElementById('scene1-line-am'),
            document.getElementById('scene1-line-pm'),
            document.getElementById('scene1-arc-oam'),
            document.getElementById('scene1-arc-apm')
        ];
        
        // 计算角度弧路径
        function calculateArcOAM() {
            // ∠OAM：以 A(50,280) 为中心，从 AO 到 AM 的弧
            const ax = 50, ay = 280;
            const ox = 580, oy = 280;
            const mx = 580, my = 260;
            const r = 25;
            
            // AO 方向：从 A 到 O，角度 0 度（水平向右）
            const angleAO = 0;
            // AM 方向：从 A 到 M
            const angleAM = Math.atan2(my - ay, mx - ax) * 180 / Math.PI;
            
            // 弧路径
            const startAngle = angleAO * Math.PI / 180;
            const endAngle = angleAM * Math.PI / 180;
            
            const x1 = ax + r * Math.cos(startAngle);
            const y1 = ay + r * Math.sin(startAngle);
            const x2 = ax + r * Math.cos(endAngle);
            const y2 = ay + r * Math.sin(endAngle);
            
            return `M ${x1.toFixed(1)} ${y1.toFixed(1)} A ${r} ${r} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`;
        }
        
        function calculateArcAPM() {
            // ∠APM：以 P(553,397) 为中心，从 PA 到 PM 的弧
            const px = 553, py = 397;
            const ax = 50, ay = 280;
            const mx = 580, my = 260;
            const r = 25;
            
            // PA 方向：从 P 到 A
            const anglePA = Math.atan2(ay - py, ax - px) * 180 / Math.PI;
            // PM 方向：从 P 到 M
            const anglePM = Math.atan2(my - py, mx - px) * 180 / Math.PI;
            
            const startAngle = anglePA * Math.PI / 180;
            const endAngle = anglePM * Math.PI / 180;
            
            const x1 = px + r * Math.cos(startAngle);
            const y1 = py + r * Math.sin(startAngle);
            const x2 = px + r * Math.cos(endAngle);
            const y2 = py + r * Math.sin(endAngle);
            
            // 判断弧的方向
            const largeArc = Math.abs(endAngle - startAngle) > Math.PI ? 1 : 0;
            
            return `M ${x1.toFixed(1)} ${y1.toFixed(1)} A ${r} ${r} 0 ${largeArc} 0 ${x2.toFixed(1)} ${y2.toFixed(1)}`;
        }
        
        // 更新元素可见性
        function updateVisibility() {
            // 步骤 1 元素（OP 和直角标记 P）
            step1Elements.forEach(el => {
                if (currentStep >= 1) {
                    el.classList.remove('scene1-hidden');
                    el.classList.add('scene1-visible');
                } else {
                    el.classList.remove('scene1-visible');
                    el.classList.add('scene1-hidden');
                }
            });
            
            // 步骤 2 元素（OM 和直角标记 M）
            step2Elements.forEach(el => {
                if (currentStep >= 2) {
                    el.classList.remove('scene1-hidden');
                    el.classList.add('scene1-visible');
                } else {
                    el.classList.remove('scene1-visible');
                    el.classList.add('scene1-hidden');
                }
            });
            
            // 步骤 3 元素（AM、PM、角度弧）
            step3Elements.forEach(el => {
                if (currentStep >= 3) {
                    el.classList.remove('scene1-hidden');
                    el.classList.add('scene1-visible');
                } else {
                    el.classList.remove('scene1-visible');
                    el.classList.add('scene1-hidden');
                }
            });
            
            // 更新按钮状态
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps - 1;
            
            // 更新步骤指示器
            stepIndicator.textContent = `步骤 ${currentStep + 1}/${totalSteps}`;
        }
        
        // 按钮事件处理
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateVisibility();
            }
        });
        
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateVisibility();
            }
        });
        
        // 初始化
        function init() {
            // 设置角度弧路径
            document.getElementById('scene1-arc-oam').setAttribute('d', calculateArcOAM());
            document.getElementById('scene1-arc-apm').setAttribute('d', calculateArcAPM());
            
            // 初始状态：步骤 0
            currentStep = 0;
            updateVisibility();
        }
        
        init();
    })();
    </script>
</body>
</html>
