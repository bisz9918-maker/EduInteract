<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圆的切线几何结构 - 题目图示</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        /* 基础样式 */
        .scene1-base-line {
            stroke: #000000;
            stroke-width: 2;
            fill: none;
        }
        .scene1-base-circle {
            stroke: #000000;
            stroke-width: 2;
            fill: none;
        }
        .scene1-point {
            fill: #000000;
        }
        .scene1-label {
            font-size: 14px;
            font-weight: bold;
            fill: #000000;
        }
        .scene1-annotation {
            font-size: 13px;
            fill: #1565c0;
            font-weight: bold;
        }
        .scene1-radius {
            stroke: #2e7d32;
            stroke-width: 2;
            fill: none;
        }
        .scene1-radius-label {
            font-size: 13px;
            fill: #2e7d32;
            font-weight: bold;
        }
        .scene1-right-angle {
            stroke: #c62828;
            stroke-width: 1;
            fill: none;
        }
        .scene1-sym-axis {
            stroke: #1565c0;
            stroke-width: 2;
            fill: none;
            stroke-dasharray: 5, 5;
        }
        .scene1-length-anno {
            font-size: 13px;
            fill: #1565c0;
            font-weight: bold;
        }
        /* 控件栏 */
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            z-index: 10;
        }
        .scene1-btn {
            padding: 8px 20px;
            font-size: 14px;
            font-weight: bold;
            border: 2px solid #1565c0;
            background: #ffffff;
            color: #1565c0;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .scene1-btn:hover:not(:disabled) {
            background: #1565c0;
            color: #ffffff;
        }
        .scene1-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #scene1-state-indicator {
            font-size: 14px;
            font-weight: bold;
            color: #333;
            min-width: 80px;
            text-align: center;
        }
        /* 淡入动画 */
        .scene1-fade-in {
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .scene1-visible {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 圆 O -->
            <circle id="scene1-circle-o" class="scene1-base-circle" cx="550" cy="250" r="100" />
            
            <!-- 直线 POD (从 P 到 D) -->
            <line id="scene1-line-pod" class="scene1-base-line" x1="200" y1="250" x2="667" y2="250" />
            
            <!-- 切线 PA -->
            <line id="scene1-line-pa" class="scene1-base-line" x1="200" y1="250" x2="521" y2="346" />
            
            <!-- 切线 PB -->
            <line id="scene1-line-pb" class="scene1-base-line" x1="200" y1="250" x2="521" y2="154" />
            
            <!-- 线段 AD -->
            <line id="scene1-line-ad" class="scene1-base-line" x1="521" y1="346" x2="667" y2="250" style="stroke-width: 1;" />
            
            <!-- 线段 BD -->
            <line id="scene1-line-bd" class="scene1-base-line" x1="521" y1="154" x2="667" y2="250" style="stroke-width: 1;" />
            
            <!-- 点 P, O, C, D, A, B -->
            <circle id="scene1-point-p" class="scene1-point" cx="200" cy="250" r="4" />
            <circle id="scene1-point-o" class="scene1-point" cx="550" cy="250" r="4" />
            <circle id="scene1-point-c" class="scene1-point" cx="433" cy="250" r="4" />
            <circle id="scene1-point-d" class="scene1-point" cx="667" cy="250" r="4" />
            <circle id="scene1-point-a" class="scene1-point" cx="521" cy="346" r="4" />
            <circle id="scene1-point-b" class="scene1-point" cx="521" cy="154" r="4" />
            
            <!-- 标签 P, O, C, D, A, B (初始隐藏) - 调整位置避免重叠 -->
            <!-- P: 左侧远离 -->
            <text id="scene1-label-p" class="scene1-label scene1-fade-in" x="175" y="245">P</text>
            <!-- O: 圆心正下方，在圆外 -->
            <text id="scene1-label-o" class="scene1-label scene1-fade-in" x="550" y="365">O</text>
            <!-- C: 放在水平线上方，远离所有线条 (y=250 上方 50px) -->
            <text id="scene1-label-c" class="scene1-label scene1-fade-in" x="433" y="200">C</text>
            <!-- D: 右侧远离 -->
            <text id="scene1-label-d" class="scene1-label scene1-fade-in" x="680" y="245">D</text>
            <!-- A: 下方远离 -->
            <text id="scene1-label-a" class="scene1-label scene1-fade-in" x="521" y="375">A</text>
            <!-- B: 上方远离 -->
            <text id="scene1-label-b" class="scene1-label scene1-fade-in" x="521" y="125">B</text>
            
            <!-- 标注 PC=1, CD=1 (初始隐藏) - 放在图形下方空白区域 -->
            <text id="scene1-anno-pc" class="scene1-annotation scene1-fade-in" x="317" y="420">PC=1</text>
            <text id="scene1-anno-cd" class="scene1-annotation scene1-fade-in" x="550" y="420">CD=1</text>
            
            <!-- 半径 OA, OB (初始隐藏) -->
            <line id="scene1-line-oa" class="scene1-radius scene1-fade-in" x1="550" y1="250" x2="521" y2="346" />
            <line id="scene1-line-ob" class="scene1-radius scene1-fade-in" x1="550" y1="250" x2="521" y2="154" />
            
            <!-- 半径标注 (初始隐藏) - 放在圆外右侧空白区域 -->
            <text id="scene1-anno-oa" class="scene1-radius-label scene1-fade-in" x="680" y="350">OA=0.5</text>
            <text id="scene1-anno-ob" class="scene1-radius-label scene1-fade-in" x="680" y="140">OB=0.5</text>
            
            <!-- 直角标记 A, B (初始隐藏) -->
            <rect id="scene1-rect-a" class="scene1-right-angle scene1-fade-in" x="515" y="340" width="8" height="8" />
            <rect id="scene1-rect-b" class="scene1-right-angle scene1-fade-in" x="515" y="148" width="8" height="8" />
            
            <!-- 对称轴 PO (初始隐藏) -->
            <line id="scene1-line-sym" class="scene1-sym-axis scene1-fade-in" x1="200" y1="250" x2="550" y2="250" />
            
            <!-- 标注 PO=1.5, PD=2 (初始隐藏) - 放在左侧空白区域，拉开垂直间距到 25px -->
            <text id="scene1-anno-po" class="scene1-length-anno scene1-fade-in" x="100" y="400">PO=1.5</text>
            <text id="scene1-anno-pd" class="scene1-length-anno scene1-fade-in" x="100" y="430">PD=2</text>
            
            <!-- 箭头定义 -->
            <defs>
                <marker id="scene1-arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
                    <path d="M0,0 L10,5 L0,10 Z" fill="#1565c0" />
                </marker>
            </defs>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn">◀ 上一步</button>
            <span id="scene1-state-indicator">步骤 0/6</span>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现 - 圆的切线几何结构
        
        // 状态定义：每个步骤需要显示的元素
        const scene1Steps = {
            0: [], // 初始状态：仅基础图形（已在 SVG 中默认显示）
            1: ['scene1-label-p', 'scene1-label-o', 'scene1-label-c', 'scene1-label-d', 'scene1-label-a', 'scene1-label-b'],
            2: ['scene1-anno-pc', 'scene1-anno-cd'],
            3: ['scene1-line-oa', 'scene1-line-ob', 'scene1-anno-oa', 'scene1-anno-ob'],
            4: ['scene1-rect-a', 'scene1-rect-b'],
            5: ['scene1-line-sym'],
            6: ['scene1-anno-po', 'scene1-anno-pd']
        };
        
        // 当前状态
        let scene1CurrentState = 0;
        const scene1MaxState = 6;
        
        // 获取元素
        const scene1BtnPrev = document.getElementById('scene1-btn-prev');
        const scene1BtnNext = document.getElementById('scene1-btn-next');
        const scene1StateIndicator = document.getElementById('scene1-state-indicator');
        
        // 显示元素函数
        function scene1ShowElement(elementId) {
            const el = document.getElementById(elementId);
            if (el) {
                el.style.display = '';
                // 强制重绘后添加可见类以触发淡入动画
                requestAnimationFrame(() => {
                    el.classList.add('scene1-visible');
                });
            }
        }
        
        // 隐藏元素函数
        function scene1HideElement(elementId) {
            const el = document.getElementById(elementId);
            if (el) {
                el.classList.remove('scene1-visible');
                el.style.display = 'none';
            }
        }
        
        // 更新状态显示
        function scene1UpdateState() {
            // 更新状态指示器
            scene1StateIndicator.textContent = `步骤 ${scene1CurrentState}/${scene1MaxState}`;
            
            // 更新按钮状态
            scene1BtnPrev.disabled = scene1CurrentState === 0;
            scene1BtnNext.disabled = scene1CurrentState === scene1MaxState;
            
            // 根据当前状态显示/隐藏元素
            for (let step = 1; step <= scene1MaxState; step++) {
                const elements = scene1Steps[step];
                if (step <= scene1CurrentState) {
                    // 显示当前步骤及之前步骤的元素
                    elements.forEach(id => scene1ShowElement(id));
                } else {
                    // 隐藏后续步骤的元素
                    elements.forEach(id => scene1HideElement(id));
                }
            }
        }
        
        // 上一步
        scene1BtnPrev.addEventListener('click', () => {
            if (scene1CurrentState > 0) {
                scene1CurrentState--;
                scene1UpdateState();
            }
        });
        
        // 下一步
        scene1BtnNext.addEventListener('click', () => {
            if (scene1CurrentState < scene1MaxState) {
                scene1CurrentState++;
                scene1UpdateState();
            }
        });
        
        // 初始化
        scene1UpdateState();
    })();
    </script>
</body>
</html>
