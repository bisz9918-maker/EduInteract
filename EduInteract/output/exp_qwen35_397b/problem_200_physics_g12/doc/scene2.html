<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2: 活塞移动与水银重新分布</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-svg { width: 800px; height: 500px; }
        #scene2-slider-container { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; }
        #scene2-slider { width: 400px; }
        #scene2-slider-label { font-size: 14px; margin-top: 5px; color: #333; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500">
            <!-- 定义斜线填充图案 -->
            <defs>
                <pattern id="scene2-mercury-pattern" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
                    <line x1="0" y1="0" x2="0" y2="8" stroke="#888888" stroke-width="2" opacity="0.5"/>
                </pattern>
            </defs>

            <!-- 容器轮廓 -->
            <!-- A 管（上方宽管）：宽 100px，从 y=120 到 y=220 -->
            <rect id="scene2-a-tube" x="220" y="120" width="100" height="100" fill="none" stroke="#000000" stroke-width="2"/>
            <!-- B 管（下方窄管）：宽 40px，从 y=220 到 y=440 -->
            <rect id="scene2-b-tube" x="260" y="220" width="40" height="220" fill="none" stroke="#000000" stroke-width="2"/>

            <!-- A 管水银区域（随活塞移动变化） -->
            <rect id="scene2-mercury-a" x="220" y="120" width="100" height="12.5" fill="url(#scene2-mercury-pattern)" opacity="0.6"/>

            <!-- B 管水银区域（随 A 管水银变化） -->
            <rect id="scene2-mercury-b" x="260" y="320" width="40" height="25" fill="url(#scene2-mercury-pattern)" opacity="0.6"/>

            <!-- 封闭气体区域（浅蓝填充） -->
            <rect id="scene2-gas" x="260" y="345" width="40" height="95" fill="#e3f2fd" opacity="0.5"/>

            <!-- 活塞（蓝色矩形） -->
            <rect id="scene2-piston" x="215" y="112" width="110" height="8" fill="#1565c0"/>

            <!-- 力 F 箭头（红色） -->
            <line id="scene2-f-arrow" x1="270" y1="85" x2="270" y2="105" stroke="#c62828" stroke-width="3" marker-end="url(#scene2-arrowhead)"/>
            <defs>
                <marker id="scene2-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#c62828"/>
                </marker>
            </defs>

            <!-- 标签 -->
            <!-- 力 F 标签 - 固定在 y=55，确保在 x=20 时不重叠 -->
            <text id="scene2-label-f" x="265" y="55" font-size="14" fill="#c62828" font-weight="bold">F</text>

            <!-- 位移 x 标签 - 固定在 y=116，不随活塞移动 -->
            <text id="scene2-label-x" x="340" y="116" font-size="14" fill="#c62828">x</text>

            <!-- h₁' 标签 -->
            <text id="scene2-label-h1" x="150" y="160" font-size="14" fill="#c62828">h₁'</text>

            <!-- h₂' 标签 -->
            <text id="scene2-label-h2" x="150" y="280" font-size="14" fill="#c62828">h₂'</text>

            <!-- L' 标签 -->
            <text id="scene2-label-l" x="350" y="400" font-size="14" fill="#c62828">L'</text>

            <!-- 右侧数值面板 - 文字直接放置，增加行间距 -->
            <text id="scene2-panel-title" x="530" y="100" font-size="12" fill="#333" font-weight="bold">实时参数：</text>

            <!-- 数值显示 - 不用背景框，直接文字，行间距 28px -->
            <text id="scene2-val-x-label" x="530" y="135" font-size="12" fill="#333">x = </text>
            <text id="scene2-val-x" x="565" y="135" font-size="12" fill="#1565c0" font-weight="bold">0.0 cm</text>

            <text id="scene2-val-h1-label" x="530" y="165" font-size="12" fill="#333">h₁' = </text>
            <text id="scene2-val-h1" x="570" y="165" font-size="12" fill="#1565c0" font-weight="bold">5.0 cm</text>

            <text id="scene2-val-h2-label" x="530" y="195" font-size="12" fill="#333">h₂' = </text>
            <text id="scene2-val-h2" x="570" y="195" font-size="12" fill="#1565c0" font-weight="bold">10.0 cm</text>

            <text id="scene2-val-l-label" x="530" y="225" font-size="12" fill="#333">L' = </text>
            <text id="scene2-val-l" x="570" y="225" font-size="12" fill="#1565c0" font-weight="bold">112.0 cm</text>

            <text id="scene2-val-p-label" x="530" y="255" font-size="12" fill="#333">p₂ = </text>
            <text id="scene2-val-p" x="570" y="255" font-size="12" fill="#1565c0" font-weight="bold">90.0 cmHg</text>

            <!-- 分隔线 -->
            <line x1="530" y1="275" x2="770" y2="275" stroke="#ccc" stroke-width="1"/>

            <!-- 计算过程文本 - 增加行间距 -->
            <text id="scene2-calc-title" x="530" y="305" font-size="12" fill="#333" font-weight="bold">计算过程：</text>
            <text id="scene2-calc-1" x="530" y="335" font-size="11" fill="#555">体积守恒：4S·Δh₁ = S·Δh₂</text>
            <text id="scene2-calc-2" x="530" y="365" font-size="11" fill="#555">玻意耳定律：p₀V₀ = p₂V₂</text>

            <!-- 滑块轨道 - 上移，留出刻度空间 -->
            <rect id="scene2-slider-track" x="200" y="445" width="400" height="15" fill="#e0e0e0" rx="7.5"/>

            <!-- 滑块手柄（将通过 JS 更新位置） -->
            <circle id="scene2-slider-handle" cx="200" cy="452.5" r="10" fill="#1565c0" stroke="#0d47a1" stroke-width="2" style="cursor: pointer"/>

            <!-- 滑块刻度 - 上移，确保在 500px 内 -->
            <text id="scene2-slider-0" x="200" y="475" font-size="12" fill="#666" text-anchor="middle">0</text>
            <text id="scene2-slider-20" x="600" y="475" font-size="12" fill="#666" text-anchor="middle">20</text>
        </svg>

        <div id="scene2-slider-container">
            <input type="range" id="scene2-slider" min="0" max="20" step="0.1" value="0"/>
            <span id="scene2-slider-label">活塞位移 x (cm)</span>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2: 活塞移动与水银重新分布

        // 初始参数（单位：cm）
        const H1_INITIAL = 5.0;  // A 管初始水银高
        const H2_INITIAL = 10.0; // B 管初始水银高
        const L_INITIAL = 112.0; // 气体初始长度
        const P0 = 75.0;         // 大气压 (cmHg)
        const P_INITIAL = P0 + H1_INITIAL + H2_INITIAL; // 初始压强 = 90 cmHg

        // 比例尺：1cm = 2.5px
        const SCALE = 2.5;

        // 容器几何参数（像素）
        const A_TUBE_TOP = 120;
        const A_TUBE_BOTTOM = 220;
        const B_TUBE_TOP = 220;
        const B_TUBE_BOTTOM = 440;
        const PISTON_HEIGHT = 8;

        // 初始活塞位置（像素）：y=112，距 A 管顶部 10px
        const PISTON_INITIAL_Y = 112;

        // DOM 元素引用
        const piston = document.getElementById('scene2-piston');
        const mercuryA = document.getElementById('scene2-mercury-a');
        const mercuryB = document.getElementById('scene2-mercury-b');
        const gas = document.getElementById('scene2-gas');
        const fArrow = document.getElementById('scene2-f-arrow');
        const labelF = document.getElementById('scene2-label-f');
        const labelX = document.getElementById('scene2-label-x');

        // 数值显示
        const valX = document.getElementById('scene2-val-x');
        const valH1 = document.getElementById('scene2-val-h1');
        const valH2 = document.getElementById('scene2-val-h2');
        const valL = document.getElementById('scene2-val-l');
        const valP = document.getElementById('scene2-val-p');

        // 滑块
        const slider = document.getElementById('scene2-slider');
        const sliderHandle = document.getElementById('scene2-slider-handle');

        // 状态变量
        let currentX = 0; // 活塞位移 (cm)

        // 计算并更新所有元素位置
        function updateScene(x) {
            // 物理计算
            let h1_prime, h2_prime, L_prime, p2;

            if (x <= H1_INITIAL) {
                // 阶段 1：A 管还有水银
                h1_prime = H1_INITIAL - x;
                h2_prime = H2_INITIAL + 4 * x;
                L_prime = L_INITIAL + 4 * x;
                p2 = P0 * L_INITIAL / L_prime; // 玻意耳定律
            } else {
                // 阶段 2：A 管水银已流尽
                h1_prime = 0;
                h2_prime = H2_INITIAL + 4 * H1_INITIAL; // = 30cm
                L_prime = L_INITIAL + 4 * H1_INITIAL; // = 132cm
                p2 = P0 * L_INITIAL / L_prime;
            }

            // 更新数值显示
            valX.textContent = x.toFixed(1) + ' cm';
            valH1.textContent = h1_prime.toFixed(1) + ' cm';
            valH2.textContent = h2_prime.toFixed(1) + ' cm';
            valL.textContent = L_prime.toFixed(1) + ' cm';
            valP.textContent = p2.toFixed(1) + ' cmHg';

            // 更新图形元素位置（像素）
            // 活塞位置
            const pistonY = PISTON_INITIAL_Y - x * SCALE;
            piston.setAttribute('y', pistonY);

            // A 管水银：从活塞底部到下方
            const mercuryATop = pistonY + PISTON_HEIGHT;
            const mercuryAHeight = Math.max(0, h1_prime * SCALE);
            mercuryA.setAttribute('y', mercuryATop);
            mercuryA.setAttribute('height', mercuryAHeight);

            // B 管水银：从 A/B 交界 (y=220) 向下
            const mercuryBTop = B_TUBE_TOP;
            const mercuryBHeight = h2_prime * SCALE;
            mercuryB.setAttribute('y', mercuryBTop);
            mercuryB.setAttribute('height', mercuryBHeight);

            // 气体：从 B 管水银底部到 B 管底部
            const gasTop = mercuryBTop + mercuryBHeight;
            const gasHeight = Math.max(0, B_TUBE_BOTTOM - gasTop);
            gas.setAttribute('y', gasTop);
            gas.setAttribute('height', gasHeight);

            // 力 F 箭头：从活塞中心向上（但标签固定）
            const arrowTop = pistonY - 25;
            const arrowBottom = pistonY - 5;
            fArrow.setAttribute('x1', 270);
            fArrow.setAttribute('y1', arrowTop);
            fArrow.setAttribute('x2', 270);
            fArrow.setAttribute('y2', arrowBottom);

            // 位移 x 标签 - 固定位置

            // 更新滑块手柄位置
            const sliderX = 200 + (x / 20) * 400;
            sliderHandle.setAttribute('cx', sliderX);
        }

        // 滑块事件监听
        slider.addEventListener('input', function(e) {
            currentX = parseFloat(e.target.value);
            updateScene(currentX);
        });

        // 拖拽滑块手柄
        let isDragging = false;

        sliderHandle.addEventListener('mousedown', function(e) {
            isDragging = true;
            e.preventDefault();
        });

        document.addEventListener('mousemove', function(e) {
            if (!isDragging) return;

            const svgRect = document.getElementById('scene2-svg').getBoundingClientRect();
            let mouseX = e.clientX - svgRect.left;
            mouseX = Math.max(200, Math.min(600, mouseX)); // 限制在轨道范围内

            const x = (mouseX - 200) / 400 * 20; // 转换为 cm
            currentX = Math.max(0, Math.min(20, x));
            slider.value = currentX.toFixed(1);

            updateScene(currentX);
        });

        document.addEventListener('mouseup', function() {
            isDragging = false;
        });

        // 触摸支持
        sliderHandle.addEventListener('touchstart', function(e) {
            isDragging = true;
            e.preventDefault();
        });

        document.addEventListener('touchmove', function(e) {
            if (!isDragging) return;

            const svgRect = document.getElementById('scene2-svg').getBoundingClientRect();
            let touchX = e.touches[0].clientX - svgRect.left;
            touchX = Math.max(200, Math.min(600, touchX));

            const x = (touchX - 200) / 400 * 20;
            currentX = Math.max(0, Math.min(20, x));
            slider.value = currentX.toFixed(1);

            updateScene(currentX);
        });

        document.addEventListener('touchend', function() {
            isDragging = false;
        });

        // 初始化
        updateScene(0);
    })();
    </script>
</body>
</html>
