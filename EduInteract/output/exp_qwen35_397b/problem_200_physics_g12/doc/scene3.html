<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 3 - F-x 函数图像</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene3-controls button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #333; border-radius: 4px; background: #f5f5f5; }
        #scene3-controls button:hover { background: #e0e0e0; }
        #scene3-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene3-step-indicator { font-size: 14px; color: #333; min-width: 80px; text-align: center; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 坐标轴 -->
            <!-- 纵轴 F: (120,80)-(120,400) -->
            <line id="scene3-axis-f" x1="120" y1="80" x2="120" y2="400" stroke="#000000" stroke-width="2" marker-end="url(#scene3-arrow-f)"/>
            <!-- 横轴 x: (120,400)-(720,400) -->
            <line id="scene3-axis-x" x1="120" y1="400" x2="720" y2="400" stroke="#000000" stroke-width="2" marker-end="url(#scene3-arrow-x)"/>
            
            <!-- 箭头定义 -->
            <defs>
                <marker id="scene3-arrow-f" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
                    <path d="M0,0 L10,5 L0,10 Z" fill="#000000"/>
                </marker>
                <marker id="scene3-arrow-x" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
                    <path d="M0,0 L10,5 L0,10 Z" fill="#000000"/>
                </marker>
            </defs>
            
            <!-- 轴标签 -->
            <text id="scene3-label-f" x="100" y="50" font-size="16" fill="#000000" text-anchor="end">F</text>
            <text id="scene3-label-x" x="735" y="445" font-size="16" fill="#000000" text-anchor="start">x/cm</text>
            <text id="scene3-label-o" x="95" y="445" font-size="14" fill="#000000" text-anchor="end">O</text>
            
            <!-- x 轴刻度标签 (y=445，远离坐标轴) -->
            <text id="scene3-tick-0" x="120" y="445" font-size="14" fill="#000000" text-anchor="middle">0</text>
            <text id="scene3-tick-5" x="245" y="445" font-size="14" fill="#000000" text-anchor="middle">5</text>
            <text id="scene3-tick-10" x="375" y="445" font-size="14" fill="#000000" text-anchor="middle">10</text>
            <text id="scene3-tick-15" x="505" y="445" font-size="14" fill="#000000" text-anchor="middle">15</text>
            <text id="scene3-tick-20" x="635" y="445" font-size="14" fill="#000000" text-anchor="middle">20</text>
            
            <!-- F 轴刻度标签 (x=85，远离坐标轴) -->
            <text id="scene3-ftick-0" x="85" y="405" font-size="14" fill="#000000" text-anchor="end">0</text>
            <text id="scene3-ftick-5" x="85" y="340" font-size="14" fill="#000000" text-anchor="end">5</text>
            <text id="scene3-ftick-10" x="80" y="275" font-size="14" fill="#000000" text-anchor="end">10</text>
            <text id="scene3-ftick-15" x="80" y="210" font-size="14" fill="#000000" text-anchor="end">15</text>
            <text id="scene3-ftick--5" x="80" y="450" font-size="14" fill="#000000" text-anchor="end">-5</text>
            
            <!-- F-x 曲线 (蓝色 #1565c0) -->
            <!-- 从 P0(120,210) 开始，经过 P1(420,400)，到 P2(580,430) 最低点，然后上升 -->
            <path id="scene3-curve" d="M 120 210 C 200 280, 300 360, 420 400 C 500 420, 540 430, 580 430 C 620 430, 660 410, 700 380" 
                  fill="none" stroke="#1565c0" stroke-width="3" opacity="1"/>
            
            <!-- 曲线下方填充区域 (初始隐藏) -->
            <path id="scene3-curve-fill" d="M 120 210 C 200 280, 300 360, 420 400 C 500 420, 540 430, 580 430 C 620 430, 660 410, 700 380 L 700 400 L 120 400 Z" 
                  fill="#2e7d32" fill-opacity="0.1" opacity="0"/>
            
            <!-- 初始点 P0 (120, 210) - 红色 #c62828 -->
            <circle id="scene3-point-p0" cx="120" cy="210" r="6" fill="#c62828" opacity="0"/>
            <text id="scene3-label-p0" x="135" y="185" font-size="14" fill="#c62828" opacity="0">(0, 15)</text>
            <!-- P0 到 F 轴的辅助虚线 -->
            <line id="scene3-dash-p0" x1="120" y1="210" x2="120" y2="210" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" opacity="0"/>
            
            <!-- F=0 点 P1 (420, 400) -->
            <circle id="scene3-point-p1" cx="420" cy="400" r="6" fill="#c62828" opacity="0"/>
            <!-- 标签放在点的右侧，避免与曲线重叠，增加垂直间距 -->
            <text id="scene3-label-p1" x="440" y="375" font-size="14" fill="#c62828" text-anchor="start" opacity="0">x₀≈10</text>
            <text id="scene3-label-f0" x="440" y="350" font-size="12" fill="#888888" text-anchor="start" opacity="0">F=0</text>
            <!-- P1 到 x 轴的辅助虚线 -->
            <line id="scene3-dash-p1" x1="420" y1="400" x2="420" y2="420" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" opacity="0"/>
            
            <!-- 极值点 P2 (580, 430) -->
            <circle id="scene3-point-p2" cx="580" cy="430" r="6" fill="#c62828" opacity="0"/>
            <text id="scene3-label-p2" x="580" y="460" font-size="14" fill="#c62828" text-anchor="middle" opacity="0">F_min</text>
            <!-- P2 到坐标轴的辅助虚线 -->
            <line id="scene3-dash-p2-x" x1="580" y1="430" x2="580" y2="400" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" opacity="0"/>
            <line id="scene3-dash-p2-y" x1="120" y1="430" x2="580" y2="430" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" opacity="0"/>
            
            <!-- 变化趋势文字 (初始隐藏) - 向上移动到 y=475 -->
            <text id="scene3-trend-text" x="400" y="475" font-size="13" fill="#2e7d32" text-anchor="middle" opacity="0">F 先减小→0→负值→极小值→增大</text>
            
            <!-- 图例框 (右上角，白色背景填充以遮挡曲线，增加内部垂直间距，文字向右移动) -->
            <rect id="scene3-legend-box" x="580" y="70" width="140" height="100" fill="#ffffff" stroke="#000000" stroke-width="1"/>
            <line id="scene3-legend-curve" x1="595" y1="95" x2="625" y2="95" stroke="#1565c0" stroke-width="3"/>
            <text id="scene3-legend-text1" x="660" y="100" font-size="13" fill="#000000">F-x 曲线</text>
            <circle id="scene3-legend-point" cx="610" cy="125" r="5" fill="#c62828"/>
            <text id="scene3-legend-text2" x="660" y="130" font-size="13" fill="#000000">关键点</text>
            <rect id="scene3-legend-fill" x="595" y="150" width="20" height="15" fill="#2e7d32" fill-opacity="0.1" stroke="#2e7d32"/>
            <text id="scene3-legend-text3" x="660" y="162" font-size="13" fill="#000000">变化区域</text>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene3-controls">
            <button id="scene3-btn-prev" disabled>◀ 上一步</button>
            <span id="scene3-step-indicator">步骤 0/4</span>
            <button id="scene3-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 3 实现 - F-x 函数图像分步展示
        
        const totalSteps = 4;
        let currentStep = 0;
        
        // 元素引用
        const btnPrev = document.getElementById('scene3-btn-prev');
        const btnNext = document.getElementById('scene3-btn-next');
        const stepIndicator = document.getElementById('scene3-step-indicator');
        
        // 各步骤需要显示的元素
        const stepElements = {
            0: [], // 初始状态：只显示坐标系和曲线
            1: ['scene3-point-p0', 'scene3-label-p0', 'scene3-dash-p0'],
            2: ['scene3-point-p1', 'scene3-label-p1', 'scene3-label-f0', 'scene3-dash-p1'],
            3: ['scene3-point-p2', 'scene3-label-p2', 'scene3-dash-p2-x', 'scene3-dash-p2-y'],
            4: ['scene3-curve-fill', 'scene3-trend-text']
        };
        
        // 显示元素
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.opacity = '1';
                if (el.tagName === 'line' || el.tagName === 'path') {
                    el.style.display = 'block';
                }
            }
        }
        
        // 隐藏元素
        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.opacity = '0';
                if (el.tagName === 'line' || el.tagName === 'path') {
                    el.style.display = 'none';
                }
            }
        }
        
        // 更新显示状态
        function updateDisplay() {
            // 隐藏所有步骤元素
            for (let step = 1; step <= totalSteps; step++) {
                stepElements[step].forEach(id => hideElement(id));
            }
            
            // 显示当前步骤及之前步骤的元素
            for (let step = 1; step <= currentStep; step++) {
                stepElements[step].forEach(id => showElement(id));
            }
            
            // 更新按钮状态
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps;
            
            // 更新步骤指示器
            stepIndicator.textContent = `步骤 ${currentStep}/${totalSteps}`;
        }
        
        // 上一步
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        });
        
        // 下一步
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateDisplay();
            }
        });
        
        // 初始化
        updateDisplay();
    })();
    </script>
</body>
</html>
