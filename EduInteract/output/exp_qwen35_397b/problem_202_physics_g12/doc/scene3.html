<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 3: AC 间不同位置粒子轨迹对比与对称性分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene3-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #333; border-radius: 4px; background: #f0f0f0; }
        .scene3-btn:hover { background: #e0e0e0; }
        .scene3-btn.active { background: #1565c0; color: white; border-color: #1565c0; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg width="800" height="500" id="scene3-svg">
            <!-- 定义箭头 marker -->
            <defs>
                <marker id="scene3-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#000" />
                </marker>
                <marker id="scene3-arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#1565c0" />
                </marker>
            </defs>

            <!-- 电场区域 (x=-2L 到 y 轴，第Ⅱ、Ⅲ象限) - 完全移除 rect 元素 -->
            <!-- 磁场区域 (y 轴右侧，第Ⅰ、Ⅳ象限) - 完全移除 rect 元素 -->

            <!-- x 轴 -->
            <line id="scene3-axis-x" x1="100" y1="250" x2="780" y2="250" stroke="#000" stroke-width="2" />
            <!-- y 轴 -->
            <line id="scene3-axis-y" x1="500" y1="50" x2="500" y2="450" stroke="#000" stroke-width="2" />

            <!-- x=-2L 线 -->
            <line id="scene3-line-x-2L" x1="380" y1="50" x2="380" y2="450" stroke="#000" stroke-width="2" stroke-dasharray="5,5" />

            <!-- AC 连线 -->
            <line id="scene3-line-ac" x1="380" y1="190" x2="380" y2="250" stroke="#c62828" stroke-width="2" />

            <!-- 电场线箭头 (上半部分向下) -->
            <line id="scene3-field-e-arrow-1" x1="410" y1="100" x2="410" y2="200" stroke="#000" stroke-width="2" marker-end="url(#scene3-arrow)" />
            <!-- 电场线箭头 (下半部分向上) -->
            <line id="scene3-field-e-arrow-2" x1="440" y1="300" x2="440" y2="400" stroke="#000" stroke-width="2" marker-end="url(#scene3-arrow)" />

            <!-- 磁场×符号 (4 行 6 列) - 调整位置，远离边界 -->
            <g id="scene3-field-b-crosses">
                <!-- 由 JS 生成 -->
            </g>

            <!-- 轨迹 1 (A 点出发，能水平出射) -->
            <path id="scene3-trail-1" d="M 380 190 Q 440 250 500 310" fill="none" stroke="#1565c0" stroke-width="2" opacity="0" />
            <!-- 轨迹 2 (AC 中点出发，不能水平出射) -->
            <path id="scene3-trail-2" d="M 380 220 Q 440 260 500 330" fill="none" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" opacity="0" />
            <!-- 轨迹 3 (对称位置出发，能水平出射) -->
            <path id="scene3-trail-3" d="M 380 235 Q 440 270 500 295" fill="none" stroke="#1565c0" stroke-width="2" opacity="0" />

            <!-- 对称关系虚线 (状态 3 显示) -->
            <line id="scene3-symmetry-line" x1="380" y1="190" x2="380" y2="235" stroke="#1565c0" stroke-width="1" stroke-dasharray="3,3" opacity="0" />

            <!-- A 点 -->
            <circle id="scene3-point-a" cx="380" cy="190" r="4" fill="#2e7d32" />
            <!-- C 点 -->
            <circle id="scene3-point-c" cx="380" cy="250" r="4" fill="#2e7d32" />
            <!-- A'点 -->
            <circle id="scene3-point-aprime" cx="500" cy="310" r="4" fill="#1565c0" opacity="0" />

            <!-- 初速度箭头 (状态 1 显示) - 调整位置，远离标签 -->
            <line id="scene3-velocity-arrow" x1="385" y1="170" x2="420" y2="170" stroke="#1565c0" stroke-width="2" marker-end="url(#scene3-arrow-blue)" opacity="0" />

            <!-- 出射方向箭头 -->
            <line id="scene3-exit-arrow-1" x1="500" y1="310" x2="540" y2="310" stroke="#1565c0" stroke-width="2" marker-end="url(#scene3-arrow-blue)" opacity="0" />
            <line id="scene3-exit-arrow-2" x1="500" y1="330" x2="535" y2="340" stroke="#888888" stroke-width="2" marker-end="url(#scene3-arrow)" opacity="0" />
            <line id="scene3-exit-arrow-3" x1="500" y1="295" x2="540" y2="295" stroke="#1565c0" stroke-width="2" marker-end="url(#scene3-arrow-blue)" opacity="0" />

            <!-- 标签 - 调整位置避免重叠 -->
            <text id="scene3-label-o" x="520" y="275" font-size="14" fill="#000">O</text>
            <text id="scene3-label-x-2L" x="375" y="45" font-size="12" fill="#000" font-style="italic">x=-2L</text>
            <text id="scene3-label-a" x="340" y="185" font-size="12" fill="#000">A(-2L,L)</text>
            <text id="scene3-label-c" x="340" y="270" font-size="12" fill="#000">C(-2L,0)</text>
            <text id="scene3-label-v0" x="400" y="160" font-size="12" fill="#1565c0">v₀</text>
            <text id="scene3-label-e1" x="425" y="150" font-size="12" fill="#000">E</text>
            <text id="scene3-label-e2" x="455" y="350" font-size="12" fill="#000">E</text>
            <text id="scene3-label-aprime" x="510" y="335" font-size="12" fill="#1565c0" opacity="0">A'</text>

            <!-- x 轴和 y 轴标签 - 调整位置 -->
            <text id="scene3-label-x" x="760" y="270" font-size="14" fill="#000">x</text>
            <text id="scene3-label-y" x="515" y="65" font-size="14" fill="#000">y</text>

            <!-- 状态标签 - 移到 SVG 内部上方中央区域，避免与按钮重叠 -->
            <text id="scene3-status-label" x="400" y="90" font-size="14" fill="#333" text-anchor="middle"></text>
        </svg>

        <div id="scene3-controls">
            <button id="scene3-btn-state1" class="scene3-btn">状态 1: A 点</button>
            <button id="scene3-btn-state2" class="scene3-btn">状态 2: AC 中点</button>
            <button id="scene3-btn-state3" class="scene3-btn">状态 3: 对称位置</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 3 实现
        // 布局坐标表参考:
        // 画布尺寸：800×500px，原点 O 映射到 (500, 250)，L=60px 单位长度
        // x 轴：(100,250)-(780,250)
        // y 轴：(500,50)-(500,450)
        // x=-2L 线：(380,50)-(380,450)
        // AC 连线：(380,190)-(380,250)
        // A 点：(380,190), C 点：(380,250), A'点：(500,310)

        let currentState = 0;

        // 生成磁场×符号 - 调整位置，远离边界和标签
        function generateBCrosses() {
            const crosses = document.getElementById('scene3-field-b-crosses');
            const rows = 4;
            const cols = 6;
            const startX = 540;  // 向右移 20px
            const startY = 100;  // 向下移 20px
            const spacingX = 35; // 减小间距
            const spacingY = 70; // 减小间距

            for (let i = 0; i < rows; i++) {
                for (let j = 0; j < cols; j++) {
                    const x = startX + j * spacingX;
                    const y = startY + i * spacingY;
                    const cross = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    cross.setAttribute('x', x);
                    cross.setAttribute('y', y);
                    cross.setAttribute('font-size', '14');
                    cross.setAttribute('fill', '#000');
                    cross.textContent = '×';
                    crosses.appendChild(cross);
                }
            }
        }

        // 显示元素
        function show(el) {
            if (el) {
                el.style.opacity = '1';
                el.style.display = '';
            }
        }

        // 隐藏元素
        function hide(el) {
            if (el) {
                el.style.opacity = '0';
                el.style.display = '';
            }
        }

        // 更新按钮状态
        function updateButtons(activeIndex) {
            const btn1 = document.getElementById('scene3-btn-state1');
            const btn2 = document.getElementById('scene3-btn-state2');
            const btn3 = document.getElementById('scene3-btn-state3');

            btn1.classList.remove('active');
            btn2.classList.remove('active');
            btn3.classList.remove('active');

            if (activeIndex === 1) btn1.classList.add('active');
            if (activeIndex === 2) btn2.classList.add('active');
            if (activeIndex === 3) btn3.classList.add('active');
        }

        // 渲染状态
        function render(state) {
            // 隐藏所有轨迹和箭头
            hide(document.getElementById('scene3-trail-1'));
            hide(document.getElementById('scene3-trail-2'));
            hide(document.getElementById('scene3-trail-3'));
            hide(document.getElementById('scene3-velocity-arrow'));
            hide(document.getElementById('scene3-exit-arrow-1'));
            hide(document.getElementById('scene3-exit-arrow-2'));
            hide(document.getElementById('scene3-exit-arrow-3'));
            hide(document.getElementById('scene3-point-aprime'));
            hide(document.getElementById('scene3-label-aprime'));
            hide(document.getElementById('scene3-symmetry-line'));

            const statusLabel = document.getElementById('scene3-status-label');

            if (state === 0) {
                // 初始状态：只显示基本设置
                statusLabel.textContent = '';
                updateButtons(0);
            } else if (state === 1) {
                // 状态 1: A 点出发
                show(document.getElementById('scene3-trail-1'));
                show(document.getElementById('scene3-velocity-arrow'));
                show(document.getElementById('scene3-exit-arrow-1'));
                show(document.getElementById('scene3-point-aprime'));
                show(document.getElementById('scene3-label-aprime'));
                statusLabel.textContent = '能水平出射';
                updateButtons(1);
            } else if (state === 2) {
                // 状态 2: AC 中点出发
                show(document.getElementById('scene3-trail-2'));
                show(document.getElementById('scene3-exit-arrow-2'));
                statusLabel.textContent = '不能水平出射';
                updateButtons(2);
            } else if (state === 3) {
                // 状态 3: 对称位置
                show(document.getElementById('scene3-trail-1'));
                show(document.getElementById('scene3-trail-3'));
                show(document.getElementById('scene3-exit-arrow-1'));
                show(document.getElementById('scene3-exit-arrow-3'));
                show(document.getElementById('scene3-symmetry-line'));
                statusLabel.textContent = '能水平出射（对称位置）';
                updateButtons(3);
            }
        }

        // 初始化
        generateBCrosses();

        // 绑定按钮事件
        document.getElementById('scene3-btn-state1').addEventListener('click', function() {
            currentState = 1;
            render(currentState);
        });

        document.getElementById('scene3-btn-state2').addEventListener('click', function() {
            currentState = 2;
            render(currentState);
        });

        document.getElementById('scene3-btn-state3').addEventListener('click', function() {
            currentState = 3;
            render(currentState);
        });

        // 初始渲染
        render(0);
    })();
    </script>
</body>
</html>
