<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>角速度与受力关系曲线</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 5px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene3-btn { padding: 6px 14px; font-size: 12px; cursor: pointer; background: #1565c0; color: white; border: none; border-radius: 4px; }
        .scene3-btn:hover { background: #0d47a1; }
        .scene3-btn:disabled { background: #bdbdbd; cursor: not-allowed; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg width="800" height="500" id="scene3-svg">
            <!-- 坐标系背景 -->
            <rect id="scene3-bg" x="100" y="30" width="600" height="320" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1"/>
            
            <!-- 网格线（横向） -->
            <line x1="100" y1="350" x2="700" y2="350" stroke="#e0e0e0" stroke-width="1"/>
            <line x1="100" y1="286" x2="700" y2="286" stroke="#e0e0e0" stroke-width="1"/>
            <line x1="100" y1="222" x2="700" y2="222" stroke="#e0e0e0" stroke-width="1"/>
            <line x1="100" y1="158" x2="700" y2="158" stroke="#e0e0e0" stroke-width="1"/>
            <line x1="100" y1="94" x2="700" y2="94" stroke="#e0e0e0" stroke-width="1"/>
            <line x1="100" y1="30" x2="700" y2="30" stroke="#e0e0e0" stroke-width="1"/>
            
            <!-- 网格线（纵向） -->
            <line x1="100" y1="30" x2="100" y2="350" stroke="#e0e0e0" stroke-width="1"/>
            <line x1="160" y1="30" x2="160" y2="350" stroke="#e0e0e0" stroke-width="1"/>
            <line x1="220" y1="30" x2="220" y2="350" stroke="#e0e0e0" stroke-width="1"/>
            <line x1="280" y1="30" x2="280" y2="350" stroke="#e0e0e0" stroke-width="1"/>
            <line x1="340" y1="30" x2="340" y2="350" stroke="#e0e0e0" stroke-width="1"/>
            <line x1="400" y1="30" x2="400" y2="350" stroke="#e0e0e0" stroke-width="1"/>
            <line x1="460" y1="30" x2="460" y2="350" stroke="#e0e0e0" stroke-width="1"/>
            <line x1="520" y1="30" x2="520" y2="350" stroke="#e0e0e0" stroke-width="1"/>
            <line x1="580" y1="30" x2="580" y2="350" stroke="#e0e0e0" stroke-width="1"/>
            <line x1="640" y1="30" x2="640" y2="350" stroke="#e0e0e0" stroke-width="1"/>
            <line x1="700" y1="30" x2="700" y2="350" stroke="#e0e0e0" stroke-width="1"/>
            
            <!-- 坐标轴 -->
            <line id="scene3-axis-x" x1="100" y1="350" x2="700" y2="350" stroke="#000" stroke-width="2"/>
            <line id="scene3-axis-y" x1="100" y1="350" x2="100" y2="30" stroke="#000" stroke-width="2"/>
            
            <!-- 坐标轴标签 - 调整位置 -->
            <text id="scene3-axis-x-label" x="720" y="380" font-size="13" fill="#000">ω (rad/s)</text>
            <text id="scene3-axis-y-label" x="75" y="190" font-size="13" fill="#000" transform="rotate(-90, 75, 190)">F (mg)</text>
            
            <!-- 横轴刻度标签 -->
            <text x="100" y="375" font-size="11" fill="#000" text-anchor="middle">0</text>
            <text x="220" y="375" font-size="11" fill="#000" text-anchor="middle">2</text>
            <text x="340" y="375" font-size="11" fill="#000" text-anchor="middle">4</text>
            <text x="460" y="375" font-size="11" fill="#000" text-anchor="middle">6</text>
            <text x="580" y="375" font-size="11" fill="#000" text-anchor="middle">8</text>
            <text x="700" y="375" font-size="11" fill="#000" text-anchor="middle">10</text>
            
            <!-- 纵轴刻度标签 -->
            <text x="90" y="355" font-size="11" fill="#000" text-anchor="end">0</text>
            <text x="90" y="291" font-size="11" fill="#000" text-anchor="end">0.5</text>
            <text x="90" y="227" font-size="11" fill="#000" text-anchor="end">1.0</text>
            <text x="90" y="163" font-size="11" fill="#000" text-anchor="end">1.5</text>
            <text x="90" y="99" font-size="11" fill="#000" text-anchor="end">2.0</text>
            <text x="90" y="35" font-size="11" fill="#000" text-anchor="end">2.5</text>
            
            <!-- 临界点竖直线 -->
            <line id="scene3-critical-omega0" x1="400" y1="350" x2="400" y2="30" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5" opacity="0.6"/>
            <line id="scene3-critical-omega1" x1="508" y1="350" x2="508" y2="30" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5" opacity="0.6"/>
            <line id="scene3-critical-omega2" x1="608" y1="350" x2="608" y2="30" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5" opacity="0.6"/>
            
            <!-- 临界点标签 - 移到横轴刻度下方更远位置 -->
            <text id="scene3-omega0-label" x="400" y="400" font-size="10" fill="#c62828" text-anchor="middle">ω₀=5</text>
            <text id="scene3-omega1-label" x="508" y="400" font-size="10" fill="#c62828" text-anchor="middle">ω₁≈7.1</text>
            <text id="scene3-omega2-label" x="608" y="400" font-size="10" fill="#c62828" text-anchor="middle">ω₂≈8.8</text>
            
            <!-- 曲线组 -->
            <g id="scene3-curves">
                <path id="scene3-curve-fa" d="" fill="none" stroke="#1565c0" stroke-width="2"/>
                <path id="scene3-curve-fb" d="" fill="none" stroke="#1565c0" stroke-width="2" stroke-dasharray="5,5"/>
                <path id="scene3-curve-tab" d="" fill="none" stroke="#2e7d32" stroke-width="2"/>
                <path id="scene3-curve-tob" d="" fill="none" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5,5"/>
            </g>
            
            <!-- 当前值标记点 -->
            <circle id="scene3-point-fa" r="5" fill="#1565c0" opacity="0"/>
            <circle id="scene3-point-fb" r="5" fill="#1565c0" opacity="0"/>
            <circle id="scene3-point-tab" r="5" fill="#2e7d32" opacity="0"/>
            <circle id="scene3-point-tob" r="5" fill="#2e7d32" opacity="0"/>
            
            <!-- 图例框 - 移到右上角，加大内部间距 -->
            <rect id="scene3-legend-bg" x="550" y="40" width="130" height="85" fill="white" stroke="#9e9e9e" stroke-width="1"/>
            <line x1="560" y1="58" x2="595" y2="58" stroke="#1565c0" stroke-width="2"/>
            <text x="602" y="62" font-size="11" fill="#000">f_A</text>
            <line x1="560" y1="76" x2="595" y2="76" stroke="#1565c0" stroke-width="2" stroke-dasharray="4,4"/>
            <text x="602" y="80" font-size="11" fill="#000">f_B</text>
            <line x1="560" y1="96" x2="595" y2="96" stroke="#2e7d32" stroke-width="2"/>
            <text x="602" y="100" font-size="11" fill="#000">T_AB</text>
            <line x1="560" y1="114" x2="595" y2="114" stroke="#2e7d32" stroke-width="2" stroke-dasharray="4,4"/>
            <text x="602" y="118" font-size="11" fill="#000">T_OB</text>
            
            <!-- 滑块轨道 - 移到更高位置，避开临界点标签 -->
            <rect id="scene3-slider-track" x="240" y="445" width="320" height="12" fill="#e0e0e0" rx="6"/>
            <!-- 滑块手柄 -->
            <circle id="scene3-slider-handle" cx="240" cy="451" r="8" fill="#1565c0" style="cursor: pointer"/>
            <!-- 当前ω值显示 - 移到滑块上方更高位置 -->
            <text id="scene3-slider-value" x="400" y="435" font-size="12" fill="#000" text-anchor="middle">ω = 0.0 rad/s</text>
        </svg>
        
        <div id="scene3-controls">
            <button id="scene3-btn-omega0" class="scene3-btn">ω₀=5</button>
            <button id="scene3-btn-omega1" class="scene3-btn">ω₁≈7.1</button>
            <button id="scene3-btn-omega2" class="scene3-btn">ω₂≈8.8</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 3 实现：角速度与受力关系曲线
        
        const OMEGA_MAX = 10;
        const F_MAX = 2.5;
        const PLOT_LEFT = 100;
        const PLOT_TOP = 30;
        const PLOT_WIDTH = 600;
        const PLOT_HEIGHT = 320;
        
        function omegaToX(omega) {
            return PLOT_LEFT + (omega / OMEGA_MAX) * PLOT_WIDTH;
        }
        
        function FToY(F) {
            return PLOT_TOP + PLOT_HEIGHT - (F / F_MAX) * PLOT_HEIGHT;
        }
        
        const r_A = 0.2;
        const r_B = 0.1;
        const g = 10;
        const mu = 0.5;
        const omega0 = 5;
        const omega1 = 5 * Math.sqrt(2);
        const omega2_calc = Math.sqrt(75);
        
        function calculateForces(omega) {
            let f_A, f_B, T_AB, T_OB;
            
            if (omega <= omega0) {
                f_A = (r_A / g) * omega * omega;
            } else {
                f_A = mu;
            }
            
            if (omega <= omega0) {
                f_B = (r_B / g) * omega * omega;
            } else if (omega <= omega1) {
                f_B = (r_B / g) * omega * omega;
            } else {
                f_B = mu;
            }
            
            if (omega <= omega0) {
                T_AB = 0;
            } else {
                T_AB = (r_A / g) * omega * omega - mu;
            }
            
            if (omega <= omega1) {
                T_OB = 0;
            } else {
                T_OB = (r_B / g) * omega * omega + T_AB - mu;
            }
            
            return { f_A, f_B, T_AB, T_OB };
        }
        
        function generateCurvePath(forceFunc, numPoints = 100) {
            let path = "";
            for (let i = 0; i <= numPoints; i++) {
                const omega = (i / numPoints) * OMEGA_MAX;
                const F = forceFunc(omega);
                const x = omegaToX(omega);
                const y = FToY(F);
                if (i === 0) {
                    path += `M ${x} ${y}`;
                } else {
                    path += ` L ${x} ${y}`;
                }
            }
            return path;
        }
        
        function f_A_func(omega) {
            return Math.min((r_A / g) * omega * omega, mu);
        }
        
        function f_B_func(omega) {
            if (omega <= omega1) {
                return (r_B / g) * omega * omega;
            } else {
                return mu;
            }
        }
        
        function T_AB_func(omega) {
            return Math.max(0, (r_A / g) * omega * omega - mu);
        }
        
        function T_OB_func(omega) {
            if (omega <= omega1) {
                return 0;
            } else {
                const T_AB = (r_A / g) * omega * omega - mu;
                return (r_B / g) * omega * omega + T_AB - mu;
            }
        }
        
        const curve_fa = document.getElementById('scene3-curve-fa');
        const curve_fb = document.getElementById('scene3-curve-fb');
        const curve_tab = document.getElementById('scene3-curve-tab');
        const curve_tob = document.getElementById('scene3-curve-tob');
        
        const point_fa = document.getElementById('scene3-point-fa');
        const point_fb = document.getElementById('scene3-point-fb');
        const point_tab = document.getElementById('scene3-point-tab');
        const point_tob = document.getElementById('scene3-point-tob');
        
        const slider_handle = document.getElementById('scene3-slider-handle');
        const slider_value = document.getElementById('scene3-slider-value');
        const slider_track = document.getElementById('scene3-slider-track');
        
        const critical_omega0 = document.getElementById('scene3-critical-omega0');
        const critical_omega1 = document.getElementById('scene3-critical-omega1');
        const critical_omega2 = document.getElementById('scene3-critical-omega2');
        
        const btn_omega0 = document.getElementById('scene3-btn-omega0');
        const btn_omega1 = document.getElementById('scene3-btn-omega1');
        const btn_omega2 = document.getElementById('scene3-btn-omega2');
        
        let currentOmega = 0;
        let isDragging = false;
        
        function drawCurves() {
            curve_fa.setAttribute('d', generateCurvePath(f_A_func));
            curve_fb.setAttribute('d', generateCurvePath(f_B_func));
            curve_tab.setAttribute('d', generateCurvePath(T_AB_func));
            curve_tob.setAttribute('d', generateCurvePath(T_OB_func));
        }
        
        function updatePoints(omega) {
            const forces = calculateForces(omega);
            const x = omegaToX(omega);
            
            point_fa.setAttribute('cx', x);
            point_fa.setAttribute('cy', FToY(forces.f_A));
            point_fa.setAttribute('opacity', omega > 0 ? '1' : '0');
            
            point_fb.setAttribute('cx', x);
            point_fb.setAttribute('cy', FToY(forces.f_B));
            point_fb.setAttribute('opacity', omega > 0 ? '1' : '0');
            
            point_tab.setAttribute('cx', x);
            point_tab.setAttribute('cy', FToY(forces.T_AB));
            point_tab.setAttribute('opacity', forces.T_AB > 0 ? '1' : '0');
            
            point_tob.setAttribute('cx', x);
            point_tob.setAttribute('cy', FToY(forces.T_OB));
            point_tob.setAttribute('opacity', forces.T_OB > 0 ? '1' : '0');
        }
        
        function updateSlider(omega) {
            const x = omegaToX(omega);
            slider_handle.setAttribute('cx', x);
            slider_value.textContent = `ω = ${omega.toFixed(1)} rad/s`;
            
            const tolerance = 0.3;
            critical_omega0.setAttribute('stroke-width', Math.abs(omega - omega0) < tolerance ? '3' : '2');
            critical_omega0.setAttribute('opacity', Math.abs(omega - omega0) < tolerance ? '1' : '0.6');
            
            critical_omega1.setAttribute('stroke-width', Math.abs(omega - omega1) < tolerance ? '3' : '2');
            critical_omega1.setAttribute('opacity', Math.abs(omega - omega1) < tolerance ? '1' : '0.6');
            
            critical_omega2.setAttribute('stroke-width', Math.abs(omega - omega2_calc) < tolerance ? '3' : '2');
            critical_omega2.setAttribute('opacity', Math.abs(omega - omega2_calc) < tolerance ? '1' : '0.6');
        }
        
        function setOmega(omega) {
            currentOmega = Math.max(0, Math.min(OMEGA_MAX, omega));
            updateSlider(currentOmega);
            updatePoints(currentOmega);
        }
        
        slider_handle.addEventListener('mousedown', startDrag);
        slider_handle.addEventListener('touchstart', startDrag, { passive: false });
        
        function startDrag(e) {
            e.preventDefault();
            isDragging = true;
            document.addEventListener('mousemove', onDrag);
            document.addEventListener('mouseup', endDrag);
            document.addEventListener('touchmove', onDrag, { passive: false });
            document.addEventListener('touchend', endDrag);
        }
        
        function onDrag(e) {
            if (!isDragging) return;
            e.preventDefault();
            
            let clientX;
            if (e.touches) {
                clientX = e.touches[0].clientX;
            } else {
                clientX = e.clientX;
            }
            
            const svgRect = document.getElementById('scene3-svg').getBoundingClientRect();
            let x = clientX - svgRect.left;
            x = Math.max(240, Math.min(560, x));
            
            const omega = ((x - PLOT_LEFT) / PLOT_WIDTH) * OMEGA_MAX;
            setOmega(omega);
        }
        
        function endDrag() {
            isDragging = false;
            document.removeEventListener('mousemove', onDrag);
            document.removeEventListener('mouseup', endDrag);
            document.removeEventListener('touchmove', onDrag);
            document.removeEventListener('touchend', endDrag);
        }
        
        btn_omega0.addEventListener('click', () => setOmega(omega0));
        btn_omega1.addEventListener('click', () => setOmega(omega1));
        btn_omega2.addEventListener('click', () => setOmega(omega2_calc));
        
        document.getElementById('scene3-omega0-label').addEventListener('click', () => setOmega(omega0));
        document.getElementById('scene3-omega1-label').addEventListener('click', () => setOmega(omega1));
        document.getElementById('scene3-omega2-label').addEventListener('click', () => setOmega(omega2_calc));
        
        drawCurves();
        setOmega(0);
        
    })();
    </script>
</body>
</html>
