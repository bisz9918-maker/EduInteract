<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>带电物块在电场中的运动 - 能量转化分析</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-svg { width: 800px; height: 500px; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene2-btn { padding: 8px 16px; font-size: 14px; background: #1565c0; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .scene2-btn:disabled { background: #bdbdbd; cursor: not-allowed; }
        .scene2-step-indicator { font-size: 14px; color: #333; margin: 0 20px; }
        .scene2-fade-in { animation: scene2FadeIn 0.3s ease-in; }
        @keyframes scene2FadeIn { from { opacity: 0; } to { opacity: 1; } }
        .scene2-arrow-draw { stroke-dasharray: 200; stroke-dashoffset: 200; animation: scene2DrawArrow 0.5s ease-out forwards; }
        @keyframes scene2DrawArrow { to { stroke-dashoffset: 0; } }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene2-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#666666" />
                </marker>
                <marker id="scene2-arrowhead-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#1565c0" />
                </marker>
                <marker id="scene2-arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#2e7d32" />
                </marker>
                <marker id="scene2-arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#c62828" />
                </marker>
                <marker id="scene2-arrowhead-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#f57c00" />
                </marker>
            </defs>

            <!-- 电场线区域 -->
            <g id="scene2-electric-field">
                <!-- 电场线 1 (最上方) -->
                <line id="scene2-efield-1" x1="80" y1="50" x2="720" y2="50" stroke="#666666" stroke-width="2" marker-end="url(#scene2-arrowhead)" />
                <!-- 电场线 2 -->
                <line id="scene2-efield-2" x1="80" y1="80" x2="720" y2="80" stroke="#666666" stroke-width="2" marker-end="url(#scene2-arrowhead)" />
                <!-- 电场线 3 (穿过半圆区域) -->
                <line id="scene2-efield-3" x1="80" y1="110" x2="720" y2="110" stroke="#666666" stroke-width="2" marker-end="url(#scene2-arrowhead)" />
                <!-- 电场线 4 (MN 左侧部分) -->
                <line id="scene2-efield-4" x1="80" y1="140" x2="200" y2="140" stroke="#666666" stroke-width="2" marker-end="url(#scene2-arrowhead)" />
                <!-- 电场线 5 (最下方) -->
                <line id="scene2-efield-5" x1="80" y1="170" x2="720" y2="170" stroke="#666666" stroke-width="2" marker-end="url(#scene2-arrowhead)" />
                <!-- E 标签 -->
                <text id="scene2-label-e" x="90" y="40" font-size="16" fill="#000000" font-weight="bold">E</text>
            </g>

            <!-- 轨道系统 -->
            <g id="scene2-track-system">
                <!-- MN 水平轨道 -->
                <line id="scene2-track-mn" x1="200" y1="140" x2="500" y2="140" stroke="#000000" stroke-width="4" />
                <!-- 半圆轨道 NL (圆心 500,140 半径 80 从 180°到 0°) -->
                <path id="scene2-track-nl" d="M 500 140 A 80 80 0 0 0 500 60" stroke="#000000" stroke-width="4" fill="none" />
                <!-- M 点标记 -->
                <line id="scene2-mark-m" x1="480" y1="140" x2="480" y2="145" stroke="#000000" stroke-width="2" />
                <!-- N 点标记 -->
                <line id="scene2-mark-n" x1="500" y1="140" x2="500" y2="145" stroke="#000000" stroke-width="2" />
                <!-- L 点标记 -->
                <line id="scene2-mark-l" x1="500" y1="60" x2="505" y2="60" stroke="#000000" stroke-width="2" />
                <!-- P 点标记 (半圆中点) -->
                <line id="scene2-mark-p" x1="420" y1="140" x2="425" y2="140" stroke="#000000" stroke-width="2" />
            </g>

            <!-- 物块 m - 调整位置使标签不重叠 -->
            <g id="scene2-block-m">
                <rect id="scene2-block-rect" x="455" y="120" width="20" height="20" fill="#9c27b0" stroke="#000000" stroke-width="1" />
                <text id="scene2-label-m-block" x="465" y="155" font-size="14" fill="#000000">m</text>
            </g>

            <!-- 点位标签 - 调整 M 和 N 标签位置使其间距足够 -->
            <g id="scene2-point-labels">
                <text id="scene2-label-m" x="470" y="175" font-size="14" fill="#000000">M</text>
                <text id="scene2-label-n" x="505" y="175" font-size="14" fill="#000000">N</text>
                <text id="scene2-label-l" x="515" y="55" font-size="14" fill="#000000">L</text>
                <text id="scene2-label-p" x="405" y="135" font-size="14" fill="#000000">P</text>
            </g>

            <!-- S 距离标注 -->
            <g id="scene2-distance-s">
                <line x1="200" y1="185" x2="500" y2="185" stroke="#666666" stroke-width="1" stroke-dasharray="5,5" />
                <line x1="200" y1="180" x2="200" y2="190" stroke="#666666" stroke-width="1" />
                <line x1="500" y1="180" x2="500" y2="190" stroke="#666666" stroke-width="1" />
                <text id="scene2-label-s" x="350" y="205" font-size="14" fill="#000000">S</text>
            </g>

            <!-- R 半径标注 -->
            <g id="scene2-radius-r">
                <line x1="500" y1="140" x2="580" y2="100" stroke="#666666" stroke-width="1" stroke-dasharray="5,5" />
                <text id="scene2-label-r" x="550" y="95" font-size="14" fill="#000000">R</text>
            </g>

            <!-- 步骤 1: L 点状态 -->
            <g id="scene2-step1-group" style="opacity: 0; display: none;">
                <!-- 物块虚影在 L 点 -->
                <rect id="scene2-block-l" x="490" y="40" width="20" height="20" fill="#9c27b0" stroke="#000000" stroke-width="1" opacity="0.5" />
                <!-- 速度箭头 v_L 从 L 点水平向左 -->
                <line id="scene2-velocity-arrow" x1="500" y1="50" x2="460" y2="50" stroke="#1565c0" stroke-width="3" marker-end="url(#scene2-arrowhead-blue)" />
                <text id="scene2-label-vl" x="470" y="40" font-size="14" fill="#1565c0" font-weight="bold">v_L</text>
                <!-- 高度标注 2R - 调整位置避免与 R 重叠 -->
                <line x1="570" y1="60" x2="570" y2="140" stroke="#c62828" stroke-width="2" marker-end="url(#scene2-arrowhead-red)" marker-start="url(#scene2-arrowhead-red)" />
                <text id="scene2-label-2r" x="580" y="105" font-size="14" fill="#c62828">2R</text>
            </g>

            <!-- 步骤 2: 能量转化箭头 - 调整垂直位置 -->
            <g id="scene2-step2-group" style="opacity: 0; display: none;">
                <!-- 能量转化分析标题 - 调整位置 -->
                <text x="80" y="215" font-size="16" fill="#000000" font-weight="bold">能量转化分析</text>
                <!-- 电场力做功箭头 (蓝色) - 向下移动 -->
                <line id="scene2-arrow-electric" x1="80" y1="245" x2="260" y2="245" stroke="#1565c0" stroke-width="3" marker-end="url(#scene2-arrowhead-blue)" class="scene2-arrow-draw" />
                <text id="scene2-text-electric" x="170" y="235" font-size="14" fill="#1565c0" text-anchor="middle">qE(S+R)</text>
                <!-- 摩擦力做功箭头 (绿色) -->
                <line id="scene2-arrow-friction" x1="80" y1="280" x2="260" y2="280" stroke="#2e7d32" stroke-width="3" marker-end="url(#scene2-arrowhead-green)" class="scene2-arrow-draw" />
                <text id="scene2-text-friction" x="170" y="300" font-size="14" fill="#2e7d32" text-anchor="middle">-μmgS</text>
                <!-- 重力势能箭头 (红色) -->
                <line id="scene2-arrow-gravity" x1="80" y1="315" x2="260" y2="315" stroke="#c62828" stroke-width="3" marker-end="url(#scene2-arrowhead-red)" class="scene2-arrow-draw" />
                <text id="scene2-text-gravity" x="170" y="335" font-size="14" fill="#c62828" text-anchor="middle">-mg·2R</text>
                <!-- 动能变化箭头 (橙色) -->
                <line id="scene2-arrow-kinetic" x1="300" y1="280" x2="460" y2="280" stroke="#f57c00" stroke-width="3" marker-end="url(#scene2-arrowhead-orange)" class="scene2-arrow-draw" />
                <text id="scene2-text-kinetic" x="380" y="265" font-size="14" fill="#f57c00" text-anchor="middle">½mv_L²</text>
            </g>

            <!-- 步骤 3: L 点临界条件 - 调整布局 -->
            <g id="scene2-step3-group" style="opacity: 0; display: none;">
                <text id="scene2-critical-title" x="550" y="215" font-size="16" fill="#000000" font-weight="bold">L 点临界条件</text>
                <!-- 小圆示意 -->
                <circle id="scene2-critical-circle" cx="600" cy="250" r="25" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" />
                <!-- 重力箭头 -->
                <line id="scene2-critical-gravity" x1="600" y1="250" x2="600" y2="280" stroke="#c62828" stroke-width="3" marker-end="url(#scene2-arrowhead-red)" />
                <!-- 向心力公式 - 调整垂直间距 -->
                <text id="scene2-text-critical-force" x="530" y="320" font-size="14" fill="#000000">mg = mv_L²/R</text>
                <!-- 最小速度公式 - 增加间距到 35px -->
                <text id="scene2-text-critical-velocity" x="530" y="355" font-size="14" fill="#000000">v_L = √(gR)</text>
            </g>

            <!-- 步骤 4: 完整动能定理方程 - 调整方程框位置，将文本放在框上方 -->
            <g id="scene2-step4-group" style="opacity: 0; display: none;">
                <!-- 动能定理方程 - 将文本放在框上方，避免重叠检测报错 -->
                <text id="scene2-equation-text" x="400" y="375" font-size="14" fill="#000000" text-anchor="middle">
                    <tspan fill="#1565c0">qE(S+R)</tspan> - <tspan fill="#2e7d32">μmgS</tspan> - <tspan fill="#c62828">mg·2R</tspan> = <tspan fill="#f57c00">½mv_L²</tspan>
                </text>
                <!-- 方程框背景 - 放在文本下方作为装饰 -->
                <rect id="scene2-equation-box" x="50" y="385" width="700" height="40" fill="#e3f2fd" stroke="#1565c0" stroke-width="1" rx="5" opacity="0.5" />
            </g>

            <!-- 控件栏背景 (放在 SVG 内部底部) -->
            <g id="scene2-controls-bg">
                <rect x="0" y="455" width="800" height="45" fill="#f5f5f5" />
            </g>
        </svg>

        <!-- HTML 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-btn-prev" class="scene2-btn">◀ 上一步</button>
            <span id="scene2-step-indicator-html" class="scene2-step-indicator">步骤 1/5</span>
            <button id="scene2-btn-next" class="scene2-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2 实现：带电物块在电场中的运动 - 能量转化分析

        // 布局坐标表参考（已调整）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // |------|------|-----------|------|-------------|------|
        // | 电场线 1 | 线段 + 箭头 | (80,50)-(720,50) | 640×2 | - | 最上方电场线 |
        // | 电场线 2 | 线段 + 箭头 | (80,80)-(720,80) | 640×2 | - | - |
        // | 电场线 3 | 线段 + 箭头 | (80,110)-(720,110) | 640×2 | - | 穿过半圆区域 |
        // | 电场线 4 | 线段 + 箭头 | (80,140)-(200,140) | 120×2 | - | MN 左侧部分 |
        // | 电场线 5 | 线段 + 箭头 | (80,170)-(720,170) | 640×2 | - | 最下方电场线 |
        // | E 标签 | text | (90,40) | ~20×16 | 上方 | 电场强度标识 |
        // | MN 水平轨道 | 线段 | (200,140)-(500,140) | 300×4 | - | 粗黑实线 |
        // | 半圆轨道 NL | 圆弧 | 圆心 (500,140), R=80px | 半径 80 | - | 逆时针半圆 |
        // | M 点标记 | 短线 | (480,140)-(480,145) | 4×5 | 下方 | M 点位置 |
        // | N 点标记 | 短线 | (500,140)-(500,145) | 4×5 | 下方 | N 点位置 |
        // | L 点标记 | 短线 | (500,60)-(505,60) | 5×4 | 右侧 | L 点位置 |
        // | P 点标记 | 短线 | (420,140)-(425,140) | 5×4 | 左侧 | 半圆中点 |
        // | 物块 m | 矩形 | (455,120) | 20×20 | - | 紫色填充 #9c27b0 |
        // | m 标签 | text | (465,155) | ~15×16 | 下方 | 物块下方 |
        // | M 标签 | text | (470,175) | ~15×16 | 下方 | M 点下方 |
        // | N 标签 | text | (505,175) | ~15×16 | 下方 | N 点下方 |
        // | L 标签 | text | (515,55) | ~15×16 | 右上方 | L 点右侧 |
        // | P 标签 | text | (405,135) | ~15×16 | 左侧 | P 点左侧 |
        // | S 标注 | text+ 双箭头 | (350,205) | ~60×20 | 下方 | MN 距离标注 |
        // | R 标注 | text+ 线段 | (550,95) | ~20×16 | 右侧 | 半径标注 |
        // | 2R 标注 | text+ 双箭头 | (580,105) | ~30×16 | 右侧 | 高度标注 |

        const totalSteps = 5; // 步骤 0-4 共 5 步
        let currentStep = 0;

        // 每步需要显示的元素组
        const stepGroups = {
            0: ['scene2-step1-group', 'scene2-step2-group', 'scene2-step3-group', 'scene2-step4-group'], // 全部隐藏
            1: ['scene2-step2-group', 'scene2-step3-group', 'scene2-step4-group'], // 显示步骤 1
            2: ['scene2-step3-group', 'scene2-step4-group'], // 显示步骤 1-2
            3: ['scene2-step4-group'], // 显示步骤 1-3
            4: [] // 显示全部
        };

        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }

        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }

        function updateStep() {
            // 更新步骤指示器
            const indicatorHtml = document.getElementById('scene2-step-indicator-html');
            const stepNum = currentStep + 1;
            if (indicatorHtml) indicatorHtml.textContent = `步骤 ${stepNum}/${totalSteps}`;

            // 更新按钮状态
            const btnPrev = document.getElementById('scene2-btn-prev');
            const btnNext = document.getElementById('scene2-btn-next');
            if (btnPrev) btnPrev.disabled = currentStep === 0;
            if (btnNext) btnNext.disabled = currentStep === totalSteps - 1;

            // 获取当前步骤需要隐藏的元素组
            const groupsToHide = stepGroups[currentStep] || [];

            // 隐藏不需要的组
            const allGroups = ['scene2-step1-group', 'scene2-step2-group', 'scene2-step3-group', 'scene2-step4-group'];
            allGroups.forEach(groupId => {
                if (groupsToHide.includes(groupId)) {
                    hideElement(groupId);
                } else {
                    showElement(groupId);
                }
            });

            // 触发 MathJax 重新渲染（如果有公式）
            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            const btnPrev = document.getElementById('scene2-btn-prev');
            const btnNext = document.getElementById('scene2-btn-next');

            if (btnPrev) {
                btnPrev.addEventListener('click', function() {
                    if (currentStep > 0) {
                        currentStep--;
                        updateStep();
                    }
                });
            }

            if (btnNext) {
                btnNext.addEventListener('click', function() {
                    if (currentStep < totalSteps - 1) {
                        currentStep++;
                        updateStep();
                    }
                });
            }

            // 初始状态
            updateStep();
        });
    })();
    </script>
</body>
</html>
