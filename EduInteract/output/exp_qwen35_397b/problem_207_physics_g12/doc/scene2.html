<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>受力分析 - 物理题图示</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene2-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene2-svg {
            width: 800px;
            height: 500px;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500">
            <!-- 箭头定义 -->
            <defs>
                <marker id="scene2-arrow-black" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L10,3 L0,6 L0,0" fill="#000000" />
                </marker>
                <marker id="scene2-arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L10,3 L0,6 L0,0" fill="#1565c0" />
                </marker>
                <marker id="scene2-arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L10,3 L0,6 L0,0" fill="#c62828" />
                </marker>
                <marker id="scene2-arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L10,3 L0,6 L0,0" fill="#888888" />
                </marker>
            </defs>

            <!-- 标题 -->
            <text id="scene2-title" x="400" y="45" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000">受力分析</text>

            <!-- ========== 左图：A 在斜面上受力 ========== -->
            <g id="scene2-left-group" class="scene2-diagram">
                <!-- 斜面结构 -->
                <line id="scene2-left-base" x1="70" y1="280" x2="240" y2="280" stroke="#000000" stroke-width="2" />
                <line id="scene2-left-slope" x1="70" y1="280" x2="240" y2="180" stroke="#000000" stroke-width="2" />
                <line id="scene2-left-vertical" x1="70" y1="280" x2="70" y2="180" stroke="#000000" stroke-width="2" />

                <!-- 滑块 A -->
                <rect id="scene2-left-block" x="135" y="165" width="25" height="25" fill="#f5f5f5" stroke="#000000" stroke-width="2" />

                <!-- 力的作用点 -->
                <g id="scene2-left-forces">
                    <!-- 重力 mg -->
                    <line id="scene2-left-arrow-mg" x1="147" y1="177" x2="147" y2="230" stroke="#000000" stroke-width="2" marker-end="url(#scene2-arrow-black)" />
                    <text id="scene2-left-label-mg" x="165" y="250" font-size="14" fill="#000000">mg</text>

                    <!-- 支持力 N₁ -->
                    <line id="scene2-left-arrow-n1" x1="147" y1="177" x2="115" y2="145" stroke="#1565c0" stroke-width="2" marker-end="url(#scene2-arrow-blue)" />
                    <text id="scene2-left-label-n1" x="95" y="135" font-size="14" fill="#000000">N₁</text>

                    <!-- 摩擦力 f₁ -->
                    <line id="scene2-left-arrow-f1" x1="147" y1="177" x2="175" y2="160" stroke="#c62828" stroke-width="2" marker-end="url(#scene2-arrow-red)" />
                    <text id="scene2-left-label-f1" x="180" y="155" font-size="14" fill="#000000">f₁</text>

                    <!-- 重力分力 G∥ (虚线) -->
                    <line id="scene2-left-arrow-g-parallel" x1="147" y1="177" x2="175" y2="210" stroke="#888888" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#scene2-arrow-gray)" />

                    <!-- 重力分力 G⊥ (虚线) -->
                    <line id="scene2-left-arrow-g-perp" x1="147" y1="177" x2="125" y2="195" stroke="#888888" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#scene2-arrow-gray)" />
                </g>

                <!-- 角度 α 弧 -->
                <path id="scene2-left-angle-arc" d="M 220 280 A 15 15 0 0 0 230 270" fill="none" stroke="#000000" stroke-width="1" />
                <text id="scene2-left-label-alpha" x="235" y="275" font-size="14" fill="#000000">α=37°</text>
            </g>

            <!-- ========== 中图：A 在 B 上受力 ========== -->
            <g id="scene2-center-group" class="scene2-diagram" style="display:none;">
                <!-- 木板 B -->
                <rect id="scene2-center-board" x="330" y="250" width="140" height="30" fill="#e0e0e0" stroke="#000000" stroke-width="2" />

                <!-- 滑块 A -->
                <rect id="scene2-center-block" x="385" y="225" width="25" height="25" fill="#f5f5f5" stroke="#000000" stroke-width="2" />

                <!-- 力的作用点 -->
                <g id="scene2-center-forces">
                    <!-- 重力 mg -->
                    <line id="scene2-center-arrow-mg" x1="397" y1="237" x2="397" y2="290" stroke="#000000" stroke-width="2" marker-end="url(#scene2-arrow-black)" />
                    <text id="scene2-center-label-mg" x="420" y="315" font-size="14" fill="#000000">mg</text>

                    <!-- 支持力 N₂ -->
                    <line id="scene2-center-arrow-n2" x1="397" y1="237" x2="397" y2="190" stroke="#1565c0" stroke-width="2" marker-end="url(#scene2-arrow-blue)" />
                    <text id="scene2-center-label-n2" x="410" y="180" font-size="14" fill="#000000">N₂</text>

                    <!-- 摩擦力 f₂ -->
                    <line id="scene2-center-arrow-f2" x1="397" y1="237" x2="350" y2="237" stroke="#c62828" stroke-width="2" marker-end="url(#scene2-arrow-red)" />
                    <text id="scene2-center-label-f2" x="355" y="215" font-size="14" fill="#000000">f₂</text>
                </g>
            </g>

            <!-- ========== 右图：B 的受力 ========== -->
            <g id="scene2-right-group" class="scene2-diagram" style="display:none;">
                <!-- 木板 B -->
                <rect id="scene2-right-board" x="590" y="250" width="140" height="30" fill="#e0e0e0" stroke="#000000" stroke-width="2" />

                <!-- 地面线 -->
                <line id="scene2-right-ground" x1="570" y1="280" x2="750" y2="280" stroke="#000000" stroke-width="2" />

                <!-- 力的作用点 -->
                <g id="scene2-right-forces">
                    <!-- A 对 B 压力 N₂' -->
                    <line id="scene2-right-arrow-n2p" x1="660" y1="250" x2="660" y2="290" stroke="#000000" stroke-width="2" marker-end="url(#scene2-arrow-black)" />
                    <text id="scene2-right-label-n2p" x="700" y="335" font-size="14" fill="#000000">N₂'</text>

                    <!-- A 对 B 摩擦 f₂' -->
                    <line id="scene2-right-arrow-f2p" x1="660" y1="245" x2="710" y2="245" stroke="#c62828" stroke-width="2" marker-end="url(#scene2-arrow-red)" />
                    <text id="scene2-right-label-f2p" x="720" y="240" font-size="14" fill="#000000">f₂'</text>

                    <!-- 地面摩擦 f₃ -->
                    <line id="scene2-right-arrow-f3" x1="660" y1="295" x2="610" y2="295" stroke="#c62828" stroke-width="2" marker-end="url(#scene2-arrow-red)" />
                    <text id="scene2-right-label-f3" x="575" y="315" font-size="14" fill="#000000">f₃</text>

                    <!-- B 重力 mg -->
                    <line id="scene2-right-arrow-mg" x1="660" y1="265" x2="660" y2="320" stroke="#000000" stroke-width="2" marker-end="url(#scene2-arrow-black)" />
                    <text id="scene2-right-label-mg" x="680" y="355" font-size="14" fill="#000000">mg</text>

                    <!-- 地面支持 N₃ -->
                    <line id="scene2-right-arrow-n3" x1="660" y1="280" x2="660" y2="215" stroke="#1565c0" stroke-width="2" marker-end="url(#scene2-arrow-blue)" />
                    <text id="scene2-right-label-n3" x="675" y="210" font-size="14" fill="#000000">N₃</text>
                </g>
            </g>

            <!-- ========== 计算结果区 ========== -->
            <g id="scene2-calc-group" style="display:none;">
                <rect id="scene2-calc-box" x="40" y="360" width="720" height="65" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1" />
                <text id="scene2-calc-text1" x="55" y="382" font-size="13" fill="#2e7d32" font-family="monospace">f₁=4m</text>
                <text id="scene2-calc-text2" x="200" y="382" font-size="13" fill="#2e7d32" font-family="monospace">f₂=5m</text>
                <text id="scene2-calc-text3" x="340" y="382" font-size="13" fill="#2e7d32" font-family="monospace">f₃max=μ₂×2mg</text>
                <text id="scene2-calc-text4" x="55" y="407" font-size="13" fill="#2e7d32" font-family="monospace">判断：f₂'=5m &gt; f₃max? 结论：B 会滑动，μ₂=0.25</text>
            </g>

            <!-- 控件栏 - SVG 内按钮 -->
            <g id="scene2-controls-svg">
                <rect id="scene2-btn-prev-bg" x="280" y="440" width="80" height="30" fill="#f5f5f5" stroke="#333" stroke-width="1" rx="4" style="cursor:pointer;" />
                <text id="scene2-btn-prev-text" x="320" y="460" text-anchor="middle" font-size="14" fill="#000000" style="pointer-events:none;">◀上一步</text>

                <rect id="scene2-btn-next-bg" x="440" y="440" width="80" height="30" fill="#f5f5f5" stroke="#333" stroke-width="1" rx="4" style="cursor:pointer;" />
                <text id="scene2-btn-next-text" x="480" y="460" text-anchor="middle" font-size="14" fill="#000000" style="pointer-events:none;">下一步▶</text>

                <text id="scene2-step-indicator" x="400" y="475" text-anchor="middle" font-size="14" fill="#333">步骤 1/4</text>
            </g>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 2 实现 - 受力分析综合图

        // 布局坐标表（实现对照依据）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 备注 |
        // |------|------|-----------|------|------|
        // | 标题区 | text | (400,45) | ~200×20 | 居中显示"受力分析" |
        // | 左图-A 在斜面上 | x=40-280, y=60-320 |
        // | 中图-A 在 B 上 | x=300-540, y=60-320 |
        // | 右图-B 的受力 | x=560-780, y=60-320 |
        // | 计算框 | rect | (40,360) | 720×65 | 浅绿背景 |
        // | 上一步按钮 | rect | (280,440) | 80×30 |
        // | 下一步按钮 | rect | (440,440) | 80×30 |
        // | 步骤指示 | text | (400,475) |

        let currentStep = 0;
        const totalSteps = 4;

        // 获取 DOM 元素
        const leftGroup = document.getElementById('scene2-left-group');
        const centerGroup = document.getElementById('scene2-center-group');
        const rightGroup = document.getElementById('scene2-right-group');
        const calcGroup = document.getElementById('scene2-calc-group');
        const stepIndicator = document.getElementById('scene2-step-indicator');
        const btnPrevBg = document.getElementById('scene2-btn-prev-bg');
        const btnNextBg = document.getElementById('scene2-btn-next-bg');
        const btnPrevText = document.getElementById('scene2-btn-prev-text');
        const btnNextText = document.getElementById('scene2-btn-next-text');

        // 更新步骤显示
        function updateStep() {
            // 重置所有组的显示状态和透明度
            leftGroup.style.display = 'block';
            centerGroup.style.display = 'block';
            rightGroup.style.display = 'block';
            leftGroup.style.opacity = '1';
            centerGroup.style.opacity = '1';
            rightGroup.style.opacity = '1';
            calcGroup.style.display = 'none';

            switch (currentStep) {
                case 0:
                    // 步骤 0：A 在斜面上受力
                    leftGroup.style.opacity = '1';
                    centerGroup.style.display = 'none';
                    rightGroup.style.display = 'none';
                    calcGroup.style.display = 'none';
                    break;
                case 1:
                    // 步骤 1：A 滑上 B 后 A 的受力
                    leftGroup.style.opacity = '0.5';
                    centerGroup.style.opacity = '1';
                    rightGroup.style.display = 'none';
                    calcGroup.style.display = 'none';
                    break;
                case 2:
                    // 步骤 2：B 的受力
                    leftGroup.style.opacity = '0.5';
                    centerGroup.style.opacity = '0.5';
                    rightGroup.style.opacity = '1';
                    calcGroup.style.display = 'none';
                    break;
                case 3:
                    // 步骤 3：力的数值计算与判断
                    leftGroup.style.opacity = '0.7';
                    centerGroup.style.opacity = '0.7';
                    rightGroup.style.opacity = '0.7';
                    calcGroup.style.display = 'block';
                    break;
            }

            // 更新步骤指示器
            stepIndicator.textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;

            // 更新按钮状态
            if (currentStep === 0) {
                btnPrevBg.style.opacity = '0.5';
                btnPrevText.style.opacity = '0.5';
            } else {
                btnPrevBg.style.opacity = '1';
                btnPrevText.style.opacity = '1';
            }

            if (currentStep === totalSteps - 1) {
                btnNextBg.style.opacity = '0.5';
                btnNextText.style.opacity = '0.5';
            } else {
                btnNextBg.style.opacity = '1';
                btnNextText.style.opacity = '1';
            }
        }

        // 按钮事件绑定
        btnPrevBg.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });

        btnNextBg.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateStep();
            }
        });

        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
