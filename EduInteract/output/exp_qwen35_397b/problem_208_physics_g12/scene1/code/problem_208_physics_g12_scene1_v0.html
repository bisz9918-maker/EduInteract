<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>平行金属板间带电粒子的受力与运动分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-svg { width: 800px; height: 500px; }
        .scene1-btn {
            position: absolute;
            bottom: 15px;
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border: 2px solid #333;
            border-radius: 6px;
            background: #f5f5f5;
            transition: all 0.2s;
        }
        .scene1-btn:hover { background: #e0e0e0; }
        .scene1-btn.active { background: #4a90d9; color: white; border-color: #4a90d9; }
        #scene1-btn-state0 { left: 150px; }
        #scene1-btn-state1 { left: 340px; }
        #scene1-btn-state2 { left: 530px; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 上金属板 -->
            <line id="scene1-plate-top" x1="100" y1="80" x2="400" y2="80" stroke="#000000" stroke-width="4"/>
            <!-- 下金属板 -->
            <line id="scene1-plate-bottom" x1="100" y1="140" x2="400" y2="140" stroke="#000000" stroke-width="4"/>
            
            <!-- 极板极性标签 -->
            <text id="scene1-label-plus" x="250" y="45" text-anchor="middle" font-size="20" fill="#000000">+</text>
            <text id="scene1-label-minus" x="250" y="180" text-anchor="middle" font-size="20" fill="#000000">−</text>
            
            <!-- 电场线 (7条) -->
            <defs>
                <marker id="scene1-arrow-electric" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#888888"/>
                </marker>
                <marker id="scene1-arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#1565c0"/>
                </marker>
                <marker id="scene1-arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#c62828"/>
                </marker>
            </defs>
            
            <!-- 电场线 -->
            <line class="scene1-e-field" x1="120" y1="85" x2="120" y2="135" stroke="#888888" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#scene1-arrow-electric)"/>
            <line class="scene1-e-field" x1="160" y1="85" x2="160" y2="135" stroke="#888888" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#scene1-arrow-electric)"/>
            <line class="scene1-e-field" x1="200" y1="85" x2="200" y2="135" stroke="#888888" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#scene1-arrow-electric)"/>
            <line class="scene1-e-field" x1="240" y1="85" x2="240" y2="135" stroke="#888888" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#scene1-arrow-electric)"/>
            <line class="scene1-e-field" x1="280" y1="85" x2="280" y2="135" stroke="#888888" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#scene1-arrow-electric)"/>
            <line class="scene1-e-field" x1="320" y1="85" x2="320" y2="135" stroke="#888888" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#scene1-arrow-electric)"/>
            <line class="scene1-e-field" x1="360" y1="85" x2="360" y2="135" stroke="#888888" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#scene1-arrow-electric)"/>
            
            <!-- 电场强度 E 标签 -->
            <text id="scene1-label-E" x="410" y="115" font-size="18" fill="#000000" font-style="italic">E</text>
            
            <!-- 初速度 v₀箭头 -->
            <line id="scene1-velocity-v0" x1="60" y1="110" x2="90" y2="110" stroke="#1565c0" stroke-width="3" marker-end="url(#scene1-arrow-blue)"/>
            <text id="scene1-label-v0" x="95" y="105" font-size="16" fill="#1565c0">v₀</text>
            
            <!-- 状态 0 专属元素：虚线轨迹、粒子、受力 -->
            <g id="scene1-state0-group">
                <line id="scene1-trajectory-0" x1="60" y1="110" x2="400" y2="110" stroke="#888888" stroke-width="2" stroke-dasharray="6,4"/>
                <circle id="scene1-particle" cx="230" cy="110" r="5" fill="#333333"/>
                <!-- 电场力 F_E (向下) -->
                <line id="scene1-force-Fe" x1="230" y1="110" x2="230" y2="145" stroke="#c62828" stroke-width="3" marker-end="url(#scene1-arrow-red)"/>
                <text id="scene1-label-Fe" x="245" y="135" font-size="14" fill="#c62828">F_E</text>
                <!-- 洛伦兹力 F_B (向上) -->
                <line id="scene1-force-Fb" x1="230" y1="110" x2="230" y2="75" stroke="#1565c0" stroke-width="3" marker-end="url(#scene1-arrow-blue)"/>
                <text id="scene1-label-Fb" x="245" y="70" font-size="14" fill="#1565c0">F_B</text>
            </g>
            
            <!-- 状态 1/2 专属元素：抛物线轨迹、出射点 -->
            <g id="scene1-state1-group" style="display:none;">
                <!-- 抛物线轨迹：从 (60,110) 到 (400,140)，用二次贝塞尔曲线 -->
                <path id="scene1-trajectory-1" d="M60,110 Q230,110 400,140" stroke="#c62828" stroke-width="3" fill="none"/>
                <circle id="scene1-exit-point" cx="400" cy="140" r="4" fill="#c62828"/>
            </g>
            
            <!-- 状态 2 专属元素：速度分解 -->
            <g id="scene1-state2-group" style="display:none;">
                <!-- 速度 v 箭头 (沿 -30°方向，长度 50px) -->
                <line id="scene1-velocity-v" x1="400" y1="140" x2="443.3" y2="165" stroke="#c62828" stroke-width="3" marker-end="url(#scene1-arrow-red)"/>
                <text id="scene1-label-v" x="455" y="185" font-size="16" fill="#c62828">v</text>
                <!-- v₀分量 (水平向右 43.3px) -->
                <line id="scene1-velocity-v0-comp" x1="400" y1="140" x2="443.3" y2="140" stroke="#1565c0" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#scene1-arrow-blue)"/>
                <text id="scene1-label-v0-comp" x="420" y="125" font-size="14" fill="#1565c0">v₀</text>
                <!-- 30°角弧 -->
                <path id="scene1-angle-arc" d="M425,140 A25,25 0 0,1 443.3,152.5" stroke="#000000" stroke-width="1.5" fill="none"/>
                <text id="scene1-label-angle" x="445" y="160" font-size="14" fill="#000000">30°</text>
            </g>
            
            <!-- 右侧磁场区域边界 -->
            <line id="scene1-mag-boundary-mp" x1="400" y1="140" x2="400" y2="340" stroke="#000000" stroke-width="2" stroke-dasharray="6,4"/>
            <line id="scene1-mag-boundary-mn" x1="400" y1="140" x2="600" y2="140" stroke="#000000" stroke-width="2" stroke-dasharray="6,4"/>
            <line id="scene1-mag-boundary-pq" x1="400" y1="340" x2="600" y2="340" stroke="#000000" stroke-width="2" stroke-dasharray="6,4"/>
            <line id="scene1-mag-boundary-right" x1="600" y1="140" x2="600" y2="340" stroke="#000000" stroke-width="2" stroke-dasharray="6,4"/>
            
            <!-- 磁场点阵 (10x10) -->
            <g id="scene1-mag-dots">
                <!-- 生成 10 行 10 列的点阵 -->
                <circle cx="420" cy="160" r="2" fill="#000000"/><circle cx="440" cy="160" r="2" fill="#000000"/><circle cx="460" cy="160" r="2" fill="#000000"/><circle cx="480" cy="160" r="2" fill="#000000"/><circle cx="500" cy="160" r="2" fill="#000000"/><circle cx="520" cy="160" r="2" fill="#000000"/><circle cx="540" cy="160" r="2" fill="#000000"/><circle cx="560" cy="160" r="2" fill="#000000"/><circle cx="580" cy="160" r="2" fill="#000000"/>
                <circle cx="420" cy="185" r="2" fill="#000000"/><circle cx="440" cy="185" r="2" fill="#000000"/><circle cx="460" cy="185" r="2" fill="#000000"/><circle cx="480" cy="185" r="2" fill="#000000"/><circle cx="500" cy="185" r="2" fill="#000000"/><circle cx="520" cy="185" r="2" fill="#000000"/><circle cx="540" cy="185" r="2" fill="#000000"/><circle cx="560" cy="185" r="2" fill="#000000"/><circle cx="580" cy="185" r="2" fill="#000000"/>
                <circle cx="420" cy="210" r="2" fill="#000000"/><circle cx="440" cy="210" r="2" fill="#000000"/><circle cx="460" cy="210" r="2" fill="#000000"/><circle cx="480" cy="210" r="2" fill="#000000"/><circle cx="500" cy="210" r="2" fill="#000000"/><circle cx="520" cy="210" r="2" fill="#000000"/><circle cx="540" cy="210" r="2" fill="#000000"/><circle cx="560" cy="210" r="2" fill="#000000"/><circle cx="580" cy="210" r="2" fill="#000000"/>
                <circle cx="420" cy="235" r="2" fill="#000000"/><circle cx="440" cy="235" r="2" fill="#000000"/><circle cx="460" cy="235" r="2" fill="#000000"/><circle cx="480" cy="235" r="2" fill="#000000"/><circle cx="500" cy="235" r="2" fill="#000000"/><circle cx="520" cy="235" r="2" fill="#000000"/><circle cx="540" cy="235" r="2" fill="#000000"/><circle cx="560" cy="235" r="2" fill="#000000"/><circle cx="580" cy="235" r="2" fill="#000000"/>
                <circle cx="420" cy="260" r="2" fill="#000000"/><circle cx="440" cy="260" r="2" fill="#000000"/><circle cx="460" cy="260" r="2" fill="#000000"/><circle cx="480" cy="260" r="2" fill="#000000"/><circle cx="500" cy="260" r="2" fill="#000000"/><circle cx="520" cy="260" r="2" fill="#000000"/><circle cx="540" cy="260" r="2" fill="#000000"/><circle cx="560" cy="260" r="2" fill="#000000"/><circle cx="580" cy="260" r="2" fill="#000000"/>
                <circle cx="420" cy="285" r="2" fill="#000000"/><circle cx="440" cy="285" r="2" fill="#000000"/><circle cx="460" cy="285" r="2" fill="#000000"/><circle cx="480" cy="285" r="2" fill="#000000"/><circle cx="500" cy="285" r="2" fill="#000000"/><circle cx="520" cy="285" r="2" fill="#000000"/><circle cx="540" cy="285" r="2" fill="#000000"/><circle cx="560" cy="285" r="2" fill="#000000"/><circle cx="580" cy="285" r="2" fill="#000000"/>
                <circle cx="420" cy="310" r="2" fill="#000000"/><circle cx="440" cy="310" r="2" fill="#000000"/><circle cx="460" cy="310" r="2" fill="#000000"/><circle cx="480" cy="310" r="2" fill="#000000"/><circle cx="500" cy="310" r="2" fill="#000000"/><circle cx="520" cy="310" r="2" fill="#000000"/><circle cx="540" cy="310" r="2" fill="#000000"/><circle cx="560" cy="310" r="2" fill="#000000"/><circle cx="580" cy="310" r="2" fill="#000000"/>
            </g>
            
            <!-- 磁场区域标签 -->
            <text id="scene1-label-MN" x="500" y="125" text-anchor="middle" font-size="16" fill="#000000">MN</text>
            <text id="scene1-label-d" x="615" y="245" font-size="16" fill="#000000">d</text>
            
            <!-- 双箭头标注 d -->
            <line x1="605" y1="140" x2="605" y2="340" stroke="#000000" stroke-width="1.5"/>
            <line x1="600" y1="140" x2="610" y2="140" stroke="#000000" stroke-width="1.5"/>
            <line x1="600" y1="340" x2="610" y2="340" stroke="#000000" stroke-width="1.5"/>
        </svg>
        
        <!-- 控件按钮 -->
        <button id="scene1-btn-state0" class="scene1-btn active">复合场平衡</button>
        <button id="scene1-btn-state1" class="scene1-btn">纯电场偏转</button>
        <button id="scene1-btn-state2" class="scene1-btn">速度分解</button>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现：平行金属板间带电粒子的受力与运动分析
        
        let currentState = 0;
        
        const btnState0 = document.getElementById('scene1-btn-state0');
        const btnState1 = document.getElementById('scene1-btn-state1');
        const btnState2 = document.getElementById('scene1-btn-state2');
        
        const state0Group = document.getElementById('scene1-state0-group');
        const state1Group = document.getElementById('scene1-state1-group');
        const state2Group = document.getElementById('scene1-state2-group');
        
        function updateState(state) {
            currentState = state;
            
            // 更新按钮状态
            btnState0.classList.remove('active');
            btnState1.classList.remove('active');
            btnState2.classList.remove('active');
            
            // 更新元素显隐
            state0Group.style.display = 'none';
            state1Group.style.display = 'none';
            state2Group.style.display = 'none';
            
            if (state === 0) {
                btnState0.classList.add('active');
                state0Group.style.display = 'block';
            } else if (state === 1) {
                btnState1.classList.add('active');
                state1Group.style.display = 'block';
            } else if (state === 2) {
                btnState2.classList.add('active');
                state1Group.style.display = 'block';
                state2Group.style.display = 'block';
            }
        }
        
        // 绑定按钮事件
        btnState0.addEventListener('click', function() { updateState(0); });
        btnState1.addEventListener('click', function() { updateState(1); });
        btnState2.addEventListener('click', function() { updateState(2); });
        
        // 初始化显示状态 0
        updateState(0);
    })();
    </script>
</body>
</html>
