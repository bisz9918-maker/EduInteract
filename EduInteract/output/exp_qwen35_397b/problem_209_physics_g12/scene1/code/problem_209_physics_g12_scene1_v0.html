<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>斜面物块受力分析 - 上滑与下滑对比</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: Arial, sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        .force-label {
            font-size: 13px;
            fill: #333333;
        }
        .title-label {
            font-size: 16px;
            font-weight: bold;
            fill: #333333;
        }
        .dimmed {
            opacity: 0.5;
        }
        .hidden {
            opacity: 0;
            display: none;
        }
        #scene1-controls {
            position: absolute;
            bottom: 5px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }
        #scene1-btn-prev, #scene1-btn-next {
            width: 80px;
            height: 28px;
            border: none;
            border-radius: 5px;
            background: #1976d2;
            color: white;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
        }
        #scene1-btn-prev:hover, #scene1-btn-next:hover {
            background: #1565c0;
        }
        #scene1-btn-prev:disabled, #scene1-btn-next:disabled {
            background: #bdbdbd;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene1-arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#1565c0" />
                </marker>
                <marker id="scene1-arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#2e7d32" />
                </marker>
                <marker id="scene1-arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#c62828" />
                </marker>
                <marker id="scene1-arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#888888" />
                </marker>
                <marker id="scene1-arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#ff9800" />
                </marker>
            </defs>

            <!-- 左侧斜面系统 -->
            <g id="scene1-left-system">
                <!-- 水平基线 -->
                <line x1="50" y1="370" x2="350" y2="370" stroke="#000000" stroke-width="2" />
                <!-- 斜面 -->
                <line x1="70" y1="370" x2="330" y2="190" stroke="#000000" stroke-width="2" />
                <!-- 倾角θ弧 -->
                <path d="M 95 370 A 18 18 0 0 0 108 358" fill="none" stroke="#000000" stroke-width="1.5" />
                <text x="120" y="385" class="force-label">θ</text>
                <!-- 标题 -->
                <text x="200" y="155" class="title-label">上滑</text>
                <!-- 物块 -->
                <rect id="scene1-left-block" x="165" y="265" width="35" height="35" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" />
            </g>

            <!-- 右侧斜面系统 -->
            <g id="scene1-right-system">
                <!-- 水平基线 -->
                <line x1="450" y1="370" x2="750" y2="370" stroke="#000000" stroke-width="2" />
                <!-- 斜面 -->
                <line x1="470" y1="370" x2="730" y2="190" stroke="#000000" stroke-width="2" />
                <!-- 倾角θ弧 -->
                <path d="M 495 370 A 18 18 0 0 0 508 358" fill="none" stroke="#000000" stroke-width="1.5" />
                <text x="520" y="385" class="force-label">θ</text>
                <!-- 标题 -->
                <text x="600" y="155" class="title-label">下滑</text>
                <!-- 物块 -->
                <rect id="scene1-right-block" x="565" y="265" width="35" height="35" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" />
            </g>

            <!-- 左侧受力分析组 -->
            <g id="scene1-left-forces" class="hidden">
                <!-- 重力 mg (竖直向下) -->
                <line x1="182" y1="282" x2="182" y2="345" stroke="#1565c0" stroke-width="4" marker-end="url(#scene1-arrow-blue)" />
                <text x="190" y="370" class="force-label">mg</text>
                <!-- 支持力 N (垂直斜面向上) -->
                <line x1="182" y1="282" x2="135" y2="220" stroke="#2e7d32" stroke-width="4" marker-end="url(#scene1-arrow-green)" />
                <text x="100" y="195" class="force-label">N</text>
                <!-- 摩擦力 f (上滑时沿斜面向下) -->
                <line id="scene1-left-f" x1="182" y1="282" x2="245" y2="235" stroke="#c62828" stroke-width="4" marker-end="url(#scene1-arrow-red)" />
                <text x="255" y="225" class="force-label">f</text>
            </g>

            <!-- 左侧力的分解组 -->
            <g id="scene1-left-components" class="hidden">
                <!-- mgcosθ 分力 (垂直斜面向下) -->
                <line x1="182" y1="282" x2="230" y2="350" stroke="#888888" stroke-width="3" stroke-dasharray="5,3" marker-end="url(#scene1-arrow-gray)" />
                <text x="240" y="375" class="force-label">mgcosθ</text>
                <!-- mgsinθ 分力 (沿斜面向下) -->
                <line x1="182" y1="282" x2="110" y2="225" stroke="#888888" stroke-width="3" stroke-dasharray="5,3" marker-end="url(#scene1-arrow-gray)" />
                <text x="35" y="180" class="force-label">mgsinθ</text>
                <!-- 合力 F_合 (沿斜面向下，较长) -->
                <line id="scene1-left-fnet" x1="182" y1="265" x2="285" y2="190" stroke="#ff9800" stroke-width="6" marker-end="url(#scene1-arrow-orange)" />
                <text x="295" y="180" class="force-label">F_合</text>
            </g>

            <!-- 右侧受力分析组 -->
            <g id="scene1-right-forces" class="hidden">
                <!-- 重力 mg (竖直向下) -->
                <line x1="582" y1="282" x2="582" y2="345" stroke="#1565c0" stroke-width="4" marker-end="url(#scene1-arrow-blue)" />
                <text x="590" y="370" class="force-label">mg</text>
                <!-- 支持力 N (垂直斜面向上) -->
                <line x1="582" y1="282" x2="535" y2="220" stroke="#2e7d32" stroke-width="4" marker-end="url(#scene1-arrow-green)" />
                <text x="500" y="195" class="force-label">N</text>
                <!-- 摩擦力 f (下滑时沿斜面向上) -->
                <line id="scene1-right-f" x1="582" y1="282" x2="520" y2="325" stroke="#c62828" stroke-width="4" marker-end="url(#scene1-arrow-red)" />
                <text x="490" y="350" class="force-label">f</text>
            </g>

            <!-- 右侧力的分解组 -->
            <g id="scene1-right-components" class="hidden">
                <!-- mgcosθ 分力 (垂直斜面向下) -->
                <line x1="582" y1="282" x2="630" y2="350" stroke="#888888" stroke-width="3" stroke-dasharray="5,3" marker-end="url(#scene1-arrow-gray)" />
                <text x="640" y="375" class="force-label">mgcosθ</text>
                <!-- mgsinθ 分力 (沿斜面向下) -->
                <line x1="582" y1="282" x2="510" y2="225" stroke="#888888" stroke-width="3" stroke-dasharray="5,3" marker-end="url(#scene1-arrow-gray)" />
                <text x="430" y="180" class="force-label">mgsinθ</text>
                <!-- 合力 F_合 (沿斜面向下，较短) -->
                <line id="scene1-right-fnet" x1="582" y1="265" x2="480" y2="190" stroke="#ff9800" stroke-width="6" marker-end="url(#scene1-arrow-orange)" />
                <text x="405" y="180" class="force-label">F_合</text>
            </g>

            <!-- 总结文本框 -->
            <g id="scene1-summary" class="hidden">
                <rect x="155" y="390" width="490" height="55" fill="#fff3e0" stroke="#ff9800" stroke-width="1.5" rx="5" />
                <text x="400" y="415" class="force-label" text-anchor="middle" font-weight="bold">摩擦力方向始终与相对运动</text>
                <text x="400" y="435" class="force-label" text-anchor="middle" font-weight="bold">方向相反</text>
            </g>

            <!-- 步骤指示器 -->
            <text id="scene1-step-indicator" x="400" y="465" class="force-label" text-anchor="middle">步骤 0/5</text>
        </svg>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现 - 斜面物块受力分析

        // 状态变量
        let currentStep = 0;
        const totalSteps = 5;

        // DOM 元素引用
        const leftBlock = document.getElementById('scene1-left-block');
        const rightBlock = document.getElementById('scene1-right-block');
        const leftForces = document.getElementById('scene1-left-forces');
        const leftComponents = document.getElementById('scene1-left-components');
        const rightForces = document.getElementById('scene1-right-forces');
        const rightComponents = document.getElementById('scene1-right-components');
        const leftSystem = document.getElementById('scene1-left-system');
        const rightSystem = document.getElementById('scene1-right-system');
        const summary = document.getElementById('scene1-summary');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const leftF = document.getElementById('scene1-left-f');
        const rightF = document.getElementById('scene1-right-f');
        const leftFnet = document.getElementById('scene1-left-fnet');
        const rightFnet = document.getElementById('scene1-right-fnet');

        // 工具函数：显示元素
        function show(el) {
            el.classList.remove('hidden');
            el.style.display = '';
            el.style.opacity = '1';
        }

        // 工具函数：隐藏元素
        function hide(el) {
            el.classList.add('hidden');
            el.style.display = 'none';
            el.style.opacity = '0';
        }

        // 工具函数：设置淡化效果
        function setDimmed(el, dimmed) {
            if (dimmed) {
                el.classList.add('dimmed');
            } else {
                el.classList.remove('dimmed');
            }
        }

        // 更新显示状态
        function updateDisplay() {
            // 重置所有状态
            hide(leftForces);
            hide(leftComponents);
            hide(rightForces);
            hide(rightComponents);
            hide(summary);
            setDimmed(leftSystem, false);
            setDimmed(rightSystem, false);
            leftBlock.style.strokeWidth = '2';
            rightBlock.style.strokeWidth = '2';
            leftF.style.strokeWidth = '4';
            rightF.style.strokeWidth = '4';

            // 根据当前步骤设置显示
            switch (currentStep) {
                case 0:
                    // 初始状态：只显示斜面和物块
                    break;

                case 1:
                    // 上滑受力：显示左侧重力、支持力、摩擦力
                    show(leftForces);
                    leftBlock.style.strokeWidth = '4';
                    break;

                case 2:
                    // 上滑合力：显示左侧分力和合力
                    show(leftForces);
                    show(leftComponents);
                    leftBlock.style.strokeWidth = '4';
                    break;

                case 3:
                    // 下滑受力：显示右侧受力，左侧淡化
                    show(leftForces);
                    show(leftComponents);
                    show(rightForces);
                    setDimmed(leftSystem, true);
                    setDimmed(leftForces, true);
                    setDimmed(leftComponents, true);
                    rightBlock.style.strokeWidth = '4';
                    break;

                case 4:
                    // 下滑合力：显示右侧分力和合力
                    show(leftForces);
                    show(leftComponents);
                    show(rightForces);
                    show(rightComponents);
                    setDimmed(leftSystem, true);
                    setDimmed(leftForces, true);
                    setDimmed(leftComponents, true);
                    rightBlock.style.strokeWidth = '4';
                    break;

                case 5:
                    // 对比总结：恢复透明度，高亮摩擦力
                    show(leftForces);
                    show(leftComponents);
                    show(rightForces);
                    show(rightComponents);
                    show(summary);
                    setDimmed(leftSystem, false);
                    setDimmed(rightSystem, false);
                    setDimmed(leftForces, false);
                    setDimmed(leftComponents, false);
                    setDimmed(rightForces, false);
                    setDimmed(rightComponents, false);
                    leftF.style.strokeWidth = '6';
                    rightF.style.strokeWidth = '6';
                    break;
            }

            // 更新步骤指示器
            stepIndicator.textContent = '步骤 ' + currentStep + '/' + totalSteps;

            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps);
        }

        // 按钮事件处理
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateDisplay();
            }
        });

        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
