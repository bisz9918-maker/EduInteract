<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电解池工作状态 - 场景 2</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #scene2-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene2-svg {
            width: 800px;
            height: 500px;
        }
        .scene2-label {
            font-size: 14px;
            fill: #000000;
        }
        .scene2-electrode-label {
            font-size: 13px;
            fill: #1565c0;
        }
        .scene2-reaction {
            font-size: 13px;
            fill: #000000;
        }
        .scene2-btn {
            fill: #1565c0;
            stroke: #0d47a1;
            stroke-width: 1;
            cursor: pointer;
        }
        .scene2-btn:hover {
            fill: #1976d2;
        }
        .scene2-btn-text {
            font-size: 13px;
            fill: #ffffff;
            pointer-events: none;
        }
        .scene2-step-text {
            font-size: 13px;
            fill: #333333;
        }
        .scene2-hidden {
            opacity: 0;
            display: none;
        }
        /* 电子流向动画 */
        @keyframes scene2-electron-flow {
            0% { stroke-dashoffset: 20; }
            100% { stroke-dashoffset: 0; }
        }
        .scene2-electron-dashed {
            stroke-dasharray: 5, 5;
            animation: scene2-electron-flow 1s linear infinite;
        }
        /* 离子移动动画 */
        @keyframes scene2-na-move {
            0% { transform: translateX(0); }
            100% { transform: translateX(-60px); }
        }
        @keyframes scene2-cl-move {
            0% { transform: translateX(0); }
            100% { transform: translateX(60px); }
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 烧杯容器 -->
            <path id="scene2-beaker" d="M 200 250 L 200 420 L 600 420 L 600 250" 
                  fill="none" stroke="#888888" stroke-width="2"/>
            
            <!-- 饱和 NaCl 溶液 -->
            <rect id="scene2-solution" x="210" y="280" width="380" height="130" 
                  fill="#bbdefb" opacity="0.3"/>
            
            <!-- C 棒电极 -->
            <rect id="scene2-c-electrode" x="240" y="200" width="40" height="190" 
                  fill="#000000"/>
            <text id="scene2-c-label" x="290" y="295" class="scene2-label">C</text>
            
            <!-- Fe 棒电极 -->
            <rect id="scene2-fe-electrode" x="520" y="200" width="40" height="190" 
                  fill="#757575"/>
            <text id="scene2-fe-label" x="510" y="295" class="scene2-label" text-anchor="end">Fe</text>
            
            <!-- 直流电源符号 -->
            <g id="scene2-power">
                <!-- 正极（长线） -->
                <line x1="410" y1="70" x2="410" y2="90" stroke="#1565c0" stroke-width="2"/>
                <!-- 负极（短线） -->
                <line x1="390" y1="75" x2="390" y2="85" stroke="#1565c0" stroke-width="2"/>
                <!-- 连接线 -->
                <line x1="390" y1="80" x2="410" y2="80" stroke="#1565c0" stroke-width="2"/>
            </g>
            <text id="scene2-power-plus" x="410" y="65" class="scene2-label" text-anchor="middle">+</text>
            <text id="scene2-power-minus" x="390" y="65" class="scene2-label" text-anchor="middle">−</text>
            
            <!-- 导线 -->
            <!-- 导线 1: C 棒到电源负极 -->
            <path id="scene2-wire1" d="M 260 200 L 260 120 L 370 120" 
                  fill="none" stroke="#000000" stroke-width="2"/>
            <!-- 导线 2: Fe 棒到电源正极 -->
            <path id="scene2-wire2" d="M 540 200 L 540 120 L 430 120" 
                  fill="none" stroke="#000000" stroke-width="2"/>
            <!-- 导线 3: K₁ 回路 -->
            <path id="scene2-wire3" d="M 260 200 L 260 80 L 380 80" 
                  fill="none" stroke="#000000" stroke-width="2"/>
            <path id="scene2-wire4" d="M 420 80 L 540 80 L 540 200" 
                  fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 开关 K₁（断开状态，红色） -->
            <g id="scene2-k1-switch">
                <line x1="380" y1="80" x2="395" y2="80" stroke="#c62828" stroke-width="2"/>
                <line x1="395" y1="80" x2="410" y2="75" stroke="#c62828" stroke-width="2"/>
                <line x1="410" y1="80" x2="420" y2="80" stroke="#c62828" stroke-width="2"/>
            </g>
            <text id="scene2-k1-label" x="400" y="60" class="scene2-label" text-anchor="middle">K₁</text>
            
            <!-- 开关 K₂（闭合状态，绿色） -->
            <g id="scene2-k2-switch">
                <line x1="380" y1="120" x2="420" y2="120" stroke="#2e7d32" stroke-width="2"/>
            </g>
            <text id="scene2-k2-label" x="400" y="100" class="scene2-label" text-anchor="middle">K₂</text>
            
            <!-- 电子流向箭头（初始隐藏） -->
            <g id="scene2-electron-group" class="scene2-hidden">
                <line id="scene2-electron-arrow" x1="540" y1="150" x2="430" y2="150" 
                      stroke="#1565c0" stroke-width="3" marker-end="url(#scene2-arrowhead)"/>
                <text id="scene2-electron-label" x="485" y="140" class="scene2-label" text-anchor="middle">e⁻</text>
            </g>
            
            <!-- Na⁺ 离子组（初始隐藏） -->
            <g id="scene2-na-ions" class="scene2-hidden">
                <circle cx="320" cy="320" r="6" fill="#c62828"/>
                <circle cx="350" cy="340" r="6" fill="#c62828"/>
                <circle cx="380" cy="360" r="6" fill="#c62828"/>
                <text x="340" y="305" class="scene2-label" text-anchor="middle">Na⁺</text>
                <!-- Na⁺ 迁移箭头 -->
                <line x1="350" y1="370" x2="270" y2="370" stroke="#c62828" stroke-width="2" 
                      marker-end="url(#scene2-arrowhead-small)"/>
            </g>
            
            <!-- Cl⁻ 离子组（初始隐藏） -->
            <g id="scene2-cl-ions" class="scene2-hidden">
                <circle cx="480" cy="320" r="6" fill="#2e7d32"/>
                <circle cx="450" cy="340" r="6" fill="#2e7d32"/>
                <circle cx="420" cy="360" r="6" fill="#2e7d32"/>
                <text x="460" y="305" class="scene2-label" text-anchor="middle">Cl⁻</text>
                <!-- Cl⁻ 迁移箭头 -->
                <line x1="450" y1="370" x2="530" y2="370" stroke="#2e7d32" stroke-width="2" 
                      marker-end="url(#scene2-arrowhead-small)"/>
            </g>
            
            <!-- 电极极性标签（初始隐藏） -->
            <text id="scene2-c-anode-label" x="290" y="240" class="scene2-electrode-label" 
                  text-anchor="middle" style="opacity:0;">C（阳极）</text>
            <text id="scene2-fe-cathode-label" x="510" y="240" class="scene2-electrode-label" 
                  text-anchor="middle" style="opacity:0;">Fe（阴极）</text>
            
            <!-- 电极反应式（初始隐藏） -->
            <text id="scene2-c-reaction" x="240" y="445" class="scene2-reaction" style="opacity:0;">2Cl⁻ − 2e⁻ = Cl₂↑</text>
            <text id="scene2-fe-reaction" x="560" y="445" class="scene2-reaction" text-anchor="end" style="opacity:0;">2H⁺ + 2e⁻ = H₂↑</text>
            
            <!-- 箭头定义 -->
            <defs>
                <marker id="scene2-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" 
                        orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#1565c0"/>
                </marker>
                <marker id="scene2-arrowhead-small" markerWidth="8" markerHeight="8" refX="7" refY="2.5" 
                        orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,5 L7,2.5 z" fill="currentColor"/>
                </marker>
            </defs>
            
            <!-- 控件栏 -->
            <g id="scene2-controls">
                <!-- 上一步按钮 -->
                <rect id="scene2-prev-btn-bg" x="280" y="465" width="70" height="28" rx="4" class="scene2-btn"/>
                <text id="scene2-prev-btn-text" x="315" y="484" class="scene2-btn-text" text-anchor="middle">◀ 上一步</text>
                
                <!-- 步骤指示器 -->
                <text id="scene2-step-indicator" x="400" y="484" class="scene2-step-text" text-anchor="middle">步骤 0/4</text>
                
                <!-- 下一步按钮 -->
                <rect id="scene2-next-btn-bg" x="450" y="465" width="70" height="28" rx="4" class="scene2-btn"/>
                <text id="scene2-next-btn-text" x="485" y="484" class="scene2-btn-text" text-anchor="middle">下一步 ▶</text>
            </g>
        </svg>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现：电解池工作状态
        
        // 状态管理
        let currentStep = 0;
        const totalSteps = 4;
        
        // 元素引用
        const cAnodeLabel = document.getElementById('scene2-c-anode-label');
        const feCathodeLabel = document.getElementById('scene2-fe-cathode-label');
        const electronGroup = document.getElementById('scene2-electron-group');
        const naIons = document.getElementById('scene2-na-ions');
        const clIons = document.getElementById('scene2-cl-ions');
        const cReaction = document.getElementById('scene2-c-reaction');
        const feReaction = document.getElementById('scene2-fe-reaction');
        const stepIndicator = document.getElementById('scene2-step-indicator');
        const prevBtn = document.getElementById('scene2-prev-btn-bg');
        const nextBtn = document.getElementById('scene2-next-btn-bg');
        
        // 工具函数：显示元素
        function showElement(el) {
            el.classList.remove('scene2-hidden');
            el.style.display = '';
            el.style.opacity = '1';
        }
        
        // 工具函数：隐藏元素
        function hideElement(el) {
            el.classList.add('scene2-hidden');
            el.style.display = 'none';
            el.style.opacity = '0';
        }
        
        // 更新步骤显示
        function updateStep() {
            // 更新步骤指示器
            stepIndicator.textContent = '步骤 ' + currentStep + '/' + totalSteps;
            
            // 步骤 0：初始状态 - 只显示基础装置
            if (currentStep === 0) {
                hideElement(cAnodeLabel);
                hideElement(feCathodeLabel);
                hideElement(electronGroup);
                hideElement(naIons);
                hideElement(clIons);
                hideElement(cReaction);
                hideElement(feReaction);
            }
            // 步骤 1：标注电极极性
            else if (currentStep === 1) {
                showElement(cAnodeLabel);
                showElement(feCathodeLabel);
                hideElement(electronGroup);
                hideElement(naIons);
                hideElement(clIons);
                hideElement(cReaction);
                hideElement(feReaction);
            }
            // 步骤 2：电子流向
            else if (currentStep === 2) {
                showElement(cAnodeLabel);
                showElement(feCathodeLabel);
                showElement(electronGroup);
                hideElement(naIons);
                hideElement(clIons);
                hideElement(cReaction);
                hideElement(feReaction);
            }
            // 步骤 3：离子迁移
            else if (currentStep === 3) {
                showElement(cAnodeLabel);
                showElement(feCathodeLabel);
                showElement(electronGroup);
                showElement(naIons);
                showElement(clIons);
                hideElement(cReaction);
                hideElement(feReaction);
            }
            // 步骤 4：电极反应式
            else if (currentStep === 4) {
                showElement(cAnodeLabel);
                showElement(feCathodeLabel);
                showElement(electronGroup);
                showElement(naIons);
                showElement(clIons);
                showElement(cReaction);
                showElement(feReaction);
            }
            
            // 更新按钮状态
            prevBtn.style.pointerEvents = currentStep > 0 ? 'all' : 'none';
            prevBtn.style.opacity = currentStep > 0 ? '1' : '0.5';
            nextBtn.style.pointerEvents = currentStep < totalSteps ? 'all' : 'none';
            nextBtn.style.opacity = currentStep < totalSteps ? '1' : '0.5';
        }
        
        // 事件绑定：上一步按钮
        prevBtn.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });
        
        // 事件绑定：下一步按钮
        nextBtn.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateStep();
            }
        });
        
        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
