<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二次函数图像特征与结论验证</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            font-size: 14px;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 12px;
            z-index: 10;
        }
        .scene1-btn {
            padding: 8px 20px;
            font-size: 14px;
            border: 2px solid #1565c0;
            background: #ffffff;
            color: #1565c0;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .scene1-btn:hover:not(:disabled) {
            background: #1565c0;
            color: #ffffff;
        }
        .scene1-btn:disabled {
            border-color: #cccccc;
            color: #cccccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 坐标轴 -->
            <line id="scene1-axis-x" x1="60" y1="380" x2="480" y2="380" stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrow-x)"/>
            <line id="scene1-axis-y" x1="180" y1="440" x2="180" y2="80" stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrow-y)"/>
            
            <!-- 箭头定义 -->
            <defs>
                <marker id="scene1-arrow-x" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#000000"/>
                </marker>
                <marker id="scene1-arrow-y" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#000000"/>
                </marker>
            </defs>
            
            <!-- 对称轴 x=1 -->
            <line id="scene1-sym-axis" x1="240" y1="80" x2="240" y2="380" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5"/>
            
            <!-- 抛物线 y = -x² + 2x + 3 -->
            <path id="scene1-parabola" d="M 90,320 C 120,260 150,220 180,200 C 210,180 225,160 240,140 C 255,160 270,180 300,200 C 330,230 360,270 390,320" 
                  fill="none" stroke="#000000" stroke-width="2.5"/>
            
            <!-- y>0 填充区 (步骤 4 显示) -->
            <path id="scene1-fill-ypos" d="M 120,380 L 120,380 C 150,320 180,280 210,260 C 240,240 270,260 300,280 C 330,310 360,350 360,380 L 360,380 Z" 
                  fill="#1565c0" opacity="0"/>
            
            <!-- 刻度线 -->
            <line id="scene1-tick-x-1" x1="120" y1="375" x2="120" y2="385" stroke="#000000" stroke-width="2"/>
            <line id="scene1-tick-x-1-center" x1="240" y1="375" x2="240" y2="385" stroke="#000000" stroke-width="2"/>
            <line id="scene1-tick-x-3" x1="360" y1="375" x2="360" y2="385" stroke="#000000" stroke-width="2"/>
            <line id="scene1-tick-y-3" x1="175" y1="200" x2="185" y2="200" stroke="#000000" stroke-width="2"/>
            
            <!-- 关键点 -->
            <circle id="scene1-point-a" cx="120" cy="380" r="5" fill="#000000"/>
            <circle id="scene1-point-b" cx="360" cy="380" r="5" fill="#000000" opacity="0"/>
            <circle id="scene1-point-c" cx="180" cy="200" r="5" fill="#000000"/>
            <circle id="scene1-point-v" cx="240" cy="140" r="5" fill="#000000"/>
            
            <!-- 标签 - 调整位置避免重叠 -->
            <text id="scene1-label-x" x="470" y="395" font-size="16" fill="#000000">x</text>
            <text id="scene1-label-y" x="195" y="90" font-size="16" fill="#000000">y</text>
            <text id="scene1-label-o" x="190" y="395" font-size="16" fill="#000000">O</text>
            <text id="scene1-label-sym" x="245" y="95" font-size="14" fill="#888888">x=1</text>
            <text id="scene1-label-x-1" x="115" y="405" font-size="14" fill="#000000">-1</text>
            <text id="scene1-label-x-1-center" x="235" y="405" font-size="14" fill="#000000">1</text>
            <text id="scene1-label-x-3" x="355" y="405" font-size="14" fill="#000000">3</text>
            <!-- y 轴上的 "3" 移到更左侧远离抛物线 -->
            <text id="scene1-label-y-3" x="90" y="205" font-size="14" fill="#000000">3</text>
            <text id="scene1-label-a" x="105" y="435" font-size="12" fill="#000000" opacity="0">(-1,0)</text>
            <text id="scene1-label-b" x="370" y="435" font-size="12" fill="#000000" opacity="0">(3,0)</text>
            <text id="scene1-label-v" x="240" y="125" font-size="12" fill="#000000" text-anchor="middle">(1,4)</text>
            
            <!-- 增减性文字标注 (步骤 3 显示) - 放在画布边缘远离抛物线 -->
            <g id="scene1-arrow-increase" opacity="0">
                <text x="65" y="320" font-size="12" fill="#1565c0">y 增大</text>
            </g>
            <g id="scene1-arrow-decrease" opacity="0">
                <text x="450" y="320" font-size="12" fill="#1565c0">y 减小</text>
            </g>
            
            <!-- 标注文字 - 调整位置，增加间距 -->
            <text id="scene1-anno-delta" x="240" y="450" font-size="12" fill="#1565c0" text-anchor="middle" opacity="0">Δ&gt;0 → b²-4ac&gt;0</text>
            <text id="scene1-anno-sym" x="240" y="472" font-size="11" fill="#1565c0" text-anchor="middle" opacity="0">对称性：-1→3</text>
            <!-- y>0 标注移到填充区上方更高位置 -->
            <text id="scene1-anno-ypos" x="240" y="245" font-size="14" fill="#1565c0" text-anchor="middle" opacity="0">y&gt;0</text>
            
            <!-- 结论区 - 调整间距 -->
            <text id="scene1-concl-1-text" x="520" y="115" font-size="13" fill="#666666">① 4ac&lt;b²</text>
            <text id="scene1-concl-1-mark" x="630" y="115" font-size="16" fill="#2e7d32" opacity="0">✓</text>
            
            <text id="scene1-concl-2-text" x="520" y="150" font-size="13" fill="#666666">② 3a+c&gt;0</text>
            <text id="scene1-concl-2-mark" x="630" y="150" font-size="16" fill="#c62828" opacity="0">✗</text>
            <text id="scene1-concl-2-note" x="655" y="150" font-size="11" fill="#c62828" opacity="0">3a+c=0</text>
            
            <text id="scene1-concl-3-text" x="520" y="185" font-size="13" fill="#666666">③ x&gt;0 时 y 随 x 增大而减小</text>
            <text id="scene1-concl-3-mark" x="725" y="185" font-size="16" fill="#c62828" opacity="0">✗</text>
            <text id="scene1-concl-3-note" x="750" y="185" font-size="11" fill="#c62828" opacity="0">不单调</text>
            
            <text id="scene1-concl-4-text" x="520" y="220" font-size="13" fill="#666666">④ y&gt;0 时 -1&lt;x&lt;3</text>
            <text id="scene1-concl-4-mark" x="675" y="220" font-size="16" fill="#2e7d32" opacity="0">✓</text>
            
            <text id="scene1-concl-5-text" x="520" y="255" font-size="13" fill="#666666">⑤ x₁=-1, x₂=3</text>
            <text id="scene1-concl-5-mark" x="665" y="255" font-size="16" fill="#2e7d32" opacity="0">✓</text>
            
            <!-- 结论②推导 - 增加行间距到 30px -->
            <text id="scene1-concl-2-deriv1" x="520" y="300" font-size="10" fill="#000000" opacity="0">x=-1 时 y=0: a-b+c=0</text>
            <text id="scene1-concl-2-deriv2" x="520" y="332" font-size="10" fill="#000000" opacity="0">x=-b/2a=1 → b=-2a</text>
            <text id="scene1-concl-2-deriv3" x="520" y="364" font-size="10" fill="#000000" opacity="0">代入得：3a+c=0</text>
            
            <!-- 最终答案 -->
            <text id="scene1-final-answer" x="520" y="395" font-size="14" fill="#1565c0" font-weight="bold" opacity="0">正确答案：B (3 个)</text>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn">◀ 上一步</button>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1: 二次函数图像特征与结论验证
        // 布局坐标表（实现对照）：
        // - 原点 O: (180, 380), 1 单位=60px
        // - x 轴：(60,380)-(480,380), y 轴：(180,440)-(180,80)
        // - 对称轴 x=1: (240,80)-(240,380)
        // - 抛物线：y=-x²+2x+3, 顶点 (1,4)→(240,140)
        // - 交点 A(-1,0): (120,380), B(3,0): (360,380)
        // - y 轴交点 C(0,3): (180,200)
        // - 标签调整后坐标避免冲突
        
        let currentStep = 0;
        const totalSteps = 5;
        
        // 获取元素辅助函数
        function getEl(id) {
            return document.getElementById('scene1-' + id);
        }
        
        // 显示元素
        function show(el) {
            if (el) {
                el.style.opacity = '1';
                el.style.display = '';
            }
        }
        
        // 隐藏元素
        function hide(el) {
            if (el) {
                el.style.opacity = '0';
                el.style.display = '';
            }
        }
        
        // 高亮点
        function highlightPoint(el) {
            if (el) {
                el.setAttribute('fill', '#1565c0');
                el.setAttribute('r', '6');
            }
        }
        
        // 重置点颜色
        function resetPoint(el) {
            if (el) {
                el.setAttribute('fill', '#000000');
                el.setAttribute('r', '5');
            }
        }
        
        // 更新步骤显示
        function updateStep(step) {
            // 步骤 0：初始状态
            if (step === 0) {
                hide(getEl('point-a')); show(getEl('point-a'));
                hide(getEl('point-b'));
                hide(getEl('label-a'));
                hide(getEl('label-b'));
                hide(getEl('anno-delta'));
                hide(getEl('anno-sym'));
                hide(getEl('arrow-increase'));
                hide(getEl('arrow-decrease'));
                hide(getEl('fill-ypos'));
                hide(getEl('anno-ypos'));
                hide(getEl('concl-1-mark'));
                hide(getEl('concl-2-mark')); hide(getEl('concl-2-note')); hide(getEl('concl-2-deriv1')); hide(getEl('concl-2-deriv2')); hide(getEl('concl-2-deriv3'));
                hide(getEl('concl-3-mark')); hide(getEl('concl-3-note'));
                hide(getEl('concl-4-mark'));
                hide(getEl('concl-5-mark'));
                hide(getEl('final-answer'));
                resetPoint(getEl('point-a'));
                resetPoint(getEl('point-b'));
            }
            
            // 步骤 1：验证结论①
            if (step >= 1) {
                show(getEl('point-a'));
                show(getEl('point-b'));
                show(getEl('label-a'));
                show(getEl('label-b'));
                show(getEl('anno-delta'));
                show(getEl('concl-1-mark'));
                highlightPoint(getEl('point-a'));
                highlightPoint(getEl('point-b'));
            }
            
            // 步骤 2：验证结论⑤
            if (step >= 2) {
                show(getEl('point-b'));
                show(getEl('label-b'));
                show(getEl('anno-sym'));
                show(getEl('concl-5-mark'));
                highlightPoint(getEl('point-b'));
            }
            
            // 步骤 3：验证结论③
            if (step >= 3) {
                show(getEl('arrow-increase'));
                show(getEl('arrow-decrease'));
                show(getEl('concl-3-mark'));
                show(getEl('concl-3-note'));
            }
            
            // 步骤 4：验证结论④
            if (step >= 4) {
                show(getEl('fill-ypos'));
                show(getEl('anno-ypos'));
                show(getEl('concl-4-mark'));
            }
            
            // 步骤 5：验证结论②
            if (step >= 5) {
                show(getEl('concl-2-mark'));
                show(getEl('concl-2-note'));
                show(getEl('concl-2-deriv1'));
                show(getEl('concl-2-deriv2'));
                show(getEl('concl-2-deriv3'));
                show(getEl('final-answer'));
            }
            
            // 更新按钮状态
            const prevBtn = getEl('btn-prev');
            const nextBtn = getEl('btn-next');
            prevBtn.disabled = (step === 0);
            nextBtn.disabled = (step >= totalSteps);
        }
        
        // 上一步
        function prevStep() {
            if (currentStep > 0) {
                currentStep--;
                updateStep(currentStep);
            }
        }
        
        // 下一步
        function nextStep() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateStep(currentStep);
            }
        }
        
        // 绑定事件
        document.getElementById('scene1-btn-prev').addEventListener('click', prevStep);
        document.getElementById('scene1-btn-next').addEventListener('click', nextStep);
        
        // 初始化
        updateStep(0);
    })();
    </script>
</body>
</html>
