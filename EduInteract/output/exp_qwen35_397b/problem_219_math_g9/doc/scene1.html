<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>反比例函数图像上的几何构造——梯形 ABCD 的形成</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-svg { width: 800px; height: 500px; }
        .scene1-hidden { opacity: 0; display: none; }
        .scene1-visible { opacity: 1; display: block; }
        .scene1-btn-rect { cursor: pointer; pointer-events: all; }
        .scene1-btn-text { pointer-events: none; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 坐标轴 -->
            <line id="scene1-axis-y" x1="90" y1="420" x2="90" y2="40" stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrow-y)" />
            <line id="scene1-axis-x" x1="90" y1="420" x2="760" y2="420" stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrow-x)" />
            
            <!-- 箭头定义 -->
            <defs>
                <marker id="scene1-arrow-y" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#000000" />
                </marker>
                <marker id="scene1-arrow-x" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#000000" />
                </marker>
            </defs>
            
            <!-- 原点 O -->
            <circle id="scene1-origin-o" cx="90" cy="420" r="3" fill="#000000" />
            
            <!-- 反比例函数曲线 y=k/x：从左上到右下，经过 A(220,180) 和 B(420,280) -->
            <path id="scene1-curve" d="M 130 80 C 150 100, 180 140, 220 180 C 260 220, 320 260, 420 280 C 500 295, 580 310, 650 330" 
                  fill="none" stroke="#000000" stroke-width="2" />
            
            <!-- 公式 y=k/x -->
            <text id="scene1-formula" x="180" y="75" font-size="16" fill="#000000" class="scene1-visible">y = k/x</text>
            
            <!-- 点 A (220,180) -->
            <circle id="scene1-point-a" cx="220" cy="180" r="5" fill="#1565c0" class="scene1-hidden" />
            
            <!-- 点 B (420,280) -->
            <circle id="scene1-point-b" cx="420" cy="280" r="5" fill="#1565c0" class="scene1-hidden" />
            
            <!-- 垂足 D (90,180) -->
            <circle id="scene1-point-d" cx="90" cy="180" r="3" fill="#1565c0" class="scene1-hidden" />
            
            <!-- 垂足 C (90,280) -->
            <circle id="scene1-point-c" cx="90" cy="280" r="3" fill="#1565c0" class="scene1-hidden" />
            
            <!-- 垂线 AD: (90,180)-(220,180) -->
            <line id="scene1-line-ad" x1="90" y1="180" x2="220" y2="180" stroke="#1565c0" stroke-width="2" class="scene1-hidden" />
            
            <!-- 垂线 BC: (90,280)-(420,280) -->
            <line id="scene1-line-bc" x1="90" y1="280" x2="420" y2="280" stroke="#1565c0" stroke-width="2" class="scene1-hidden" />
            
            <!-- 梯形 ABCD 边框 -->
            <line id="scene1-trapezoid-ad" x1="90" y1="180" x2="220" y2="180" stroke="#2e7d32" stroke-width="3" class="scene1-hidden" />
            <line id="scene1-trapezoid-dc" x1="90" y1="180" x2="90" y2="280" stroke="#2e7d32" stroke-width="3" class="scene1-hidden" />
            <line id="scene1-trapezoid-cb" x1="90" y1="280" x2="420" y2="280" stroke="#2e7d32" stroke-width="3" class="scene1-hidden" />
            <line id="scene1-trapezoid-ba" x1="220" y1="180" x2="420" y2="280" stroke="#2e7d32" stroke-width="3" class="scene1-hidden" />
            
            <!-- 标签 -->
            <text id="scene1-label-o" x="75" y="438" font-size="14" fill="#000000">O</text>
            <text id="scene1-label-x" x="770" y="435" font-size="14" fill="#000000">x</text>
            <text id="scene1-label-y" x="75" y="25" font-size="14" fill="#000000">y</text>
            
            <text id="scene1-label-a" x="230" y="165" font-size="14" fill="#000000" class="scene1-hidden">A</text>
            <text id="scene1-label-b" x="430" y="265" font-size="14" fill="#000000" class="scene1-hidden">B</text>
            <text id="scene1-label-c" x="72" y="278" font-size="14" fill="#000000" class="scene1-hidden">C</text>
            <text id="scene1-label-d" x="72" y="178" font-size="14" fill="#000000" class="scene1-hidden">D</text>
            
            <text id="scene1-label-s1" x="180" y="240" font-size="16" fill="#000000" class="scene1-hidden">S₁</text>
            
            <!-- 控件栏 -->
            <g id="scene1-controls">
                <rect x="250" y="455" width="300" height="35" fill="#ffffff" stroke="#cccccc" stroke-width="1" />
                <text id="scene1-step-indicator" x="400" y="478" font-size="14" fill="#000000" text-anchor="middle">步骤 0/4</text>
                <!-- 上一步按钮 -->
                <g id="scene1-btn-prev" class="scene1-btn-rect">
                    <rect x="280" y="460" width="80" height="25" fill="#f5f5f5" stroke="#333333" rx="4" />
                    <text x="320" y="477" font-size="12" fill="#000000" text-anchor="middle" class="scene1-btn-text">◀ 上一步</text>
                </g>
                <!-- 下一步按钮 -->
                <g id="scene1-btn-next" class="scene1-btn-rect">
                    <rect x="440" y="460" width="80" height="25" fill="#f5f5f5" stroke="#333333" rx="4" />
                    <text x="480" y="477" font-size="12" fill="#000000" text-anchor="middle" class="scene1-btn-text">下一步 ▶</text>
                </g>
            </g>
        </svg>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现：反比例函数图像上的几何构造——梯形 ABCD 的形成
        
        // 布局坐标表（实现对照依据）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // |------|------|-----------|------|-------------|------|
        // | y 轴 | 线段 | (90,420)-(90,40) | 4×380 | - | 带向上箭头 |
        // | x 轴 | 线段 | (90,420)-(760,420) | 670×4 | - | 带向右箭头 |
        // | 原点 O | 点 | (90,420) | r=3 | 左下 (75,438) | 坐标轴交点 |
        // | 反比例曲线 | 路径 | (130,80) 至 (650,330) | 曲线 | - | y=k/x 第一象限 |
        // | 点 A | 圆点 | (220,180) | r=5 | 右上 (230,165) | 曲线左上方 |
        // | 点 B | 圆点 | (420,280) | r=5 | 右上 (430,265) | 曲线右下方 |
        // | 垂足 D | 点 | (90,180) | r=3 | 左 (72,178) | y 轴上 |
        // | 垂足 C | 点 | (90,280) | r=3 | 左 (72,278) | y 轴上 |
        // | 垂线 AD | 线段 | (90,180)-(220,180) | 130×3 | - | 水平蓝色 |
        // | 垂线 BC | 线段 | (90,280)-(420,280) | 330×3 | - | 水平蓝色 |
        // | 梯形边 AD | 线段 | (90,180)-(220,180) | 130×3 | - | 加粗绿色 |
        // | 梯形边 DC | 线段 | (90,180)-(90,280) | 4×100 | - | y 轴段加粗绿色 |
        // | 梯形边 CB | 线段 | (90,280)-(420,280) | 330×3 | - | 加粗绿色 |
        // | 梯形边 BA | 线段 | (220,180)-(420,280) | 斜线 | - | 加粗绿色 |
        
        let currentState = 0;
        const totalSteps = 4;
        
        // 每步可见元素 ID 列表
        const stepVisibility = {
            0: ['scene1-axis-x', 'scene1-axis-y', 'scene1-origin-o', 'scene1-curve', 'scene1-formula', 
                'scene1-label-o', 'scene1-label-x', 'scene1-label-y'],
            1: ['scene1-axis-x', 'scene1-axis-y', 'scene1-origin-o', 'scene1-curve', 'scene1-formula',
                'scene1-label-o', 'scene1-label-x', 'scene1-label-y',
                'scene1-point-a', 'scene1-line-ad', 'scene1-label-a', 'scene1-label-d'],
            2: ['scene1-axis-x', 'scene1-axis-y', 'scene1-origin-o', 'scene1-curve', 'scene1-formula',
                'scene1-label-o', 'scene1-label-x', 'scene1-label-y',
                'scene1-point-a', 'scene1-line-ad', 'scene1-label-a', 'scene1-label-d',
                'scene1-point-b', 'scene1-line-bc', 'scene1-label-b', 'scene1-label-c'],
            3: ['scene1-axis-x', 'scene1-axis-y', 'scene1-origin-o', 'scene1-curve', 'scene1-formula',
                'scene1-label-o', 'scene1-label-x', 'scene1-label-y',
                'scene1-point-a', 'scene1-line-ad', 'scene1-label-a', 'scene1-label-d',
                'scene1-point-b', 'scene1-line-bc', 'scene1-label-b', 'scene1-label-c',
                'scene1-trapezoid-ad', 'scene1-trapezoid-dc', 'scene1-trapezoid-cb', 'scene1-trapezoid-ba'],
            4: ['scene1-axis-x', 'scene1-axis-y', 'scene1-origin-o', 'scene1-curve', 'scene1-formula',
                'scene1-label-o', 'scene1-label-x', 'scene1-label-y',
                'scene1-point-a', 'scene1-line-ad', 'scene1-label-a', 'scene1-label-d',
                'scene1-point-b', 'scene1-line-bc', 'scene1-label-b', 'scene1-label-c',
                'scene1-trapezoid-ad', 'scene1-trapezoid-dc', 'scene1-trapezoid-cb', 'scene1-trapezoid-ba',
                'scene1-label-s1']
        };
        
        // 所有可控制的元素 ID
        const allElementIds = [
            'scene1-axis-x', 'scene1-axis-y', 'scene1-origin-o', 'scene1-curve', 'scene1-formula',
            'scene1-label-o', 'scene1-label-x', 'scene1-label-y',
            'scene1-point-a', 'scene1-line-ad', 'scene1-label-a', 'scene1-label-d',
            'scene1-point-b', 'scene1-line-bc', 'scene1-label-b', 'scene1-label-c',
            'scene1-trapezoid-ad', 'scene1-trapezoid-dc', 'scene1-trapezoid-cb', 'scene1-trapezoid-ba',
            'scene1-label-s1'
        ];
        
        // 显示/隐藏元素工具函数
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene1-hidden');
                el.classList.add('scene1-visible');
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }
        
        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene1-visible');
                el.classList.add('scene1-hidden');
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }
        
        // 更新场景状态
        function updateScene() {
            document.getElementById('scene1-step-indicator').textContent = '步骤 ' + currentState + '/' + totalSteps;
            
            const prevBtn = document.getElementById('scene1-btn-prev');
            const nextBtn = document.getElementById('scene1-btn-next');
            
            if (currentState === 0) {
                prevBtn.style.opacity = '0.5';
            } else {
                prevBtn.style.opacity = '1';
            }
            
            if (currentState === totalSteps) {
                nextBtn.style.opacity = '0.5';
            } else {
                nextBtn.style.opacity = '1';
            }
            
            const visibleIds = stepVisibility[currentState];
            
            allElementIds.forEach(id => {
                if (visibleIds.includes(id)) {
                    showElement(id);
                } else {
                    hideElement(id);
                }
            });
        }
        
        // 按钮点击事件（使用 g 元素包裹，避免 text 拦截事件）
        document.getElementById('scene1-btn-prev').addEventListener('click', function() {
            if (currentState > 0) {
                currentState--;
                updateScene();
            }
        });
        
        document.getElementById('scene1-btn-next').addEventListener('click', function() {
            if (currentState < totalSteps) {
                currentState++;
                updateScene();
            }
        });
        
        // 按钮悬停效果
        document.getElementById('scene1-btn-prev').addEventListener('mouseenter', function() {
            if (currentState > 0) {
                this.querySelector('rect').style.fill = '#e0e0e0';
            }
        });
        document.getElementById('scene1-btn-prev').addEventListener('mouseleave', function() {
            this.querySelector('rect').style.fill = '#f5f5f5';
        });
        
        document.getElementById('scene1-btn-next').addEventListener('mouseenter', function() {
            if (currentState < totalSteps) {
                this.querySelector('rect').style.fill = '#e0e0e0';
            }
        });
        document.getElementById('scene1-btn-next').addEventListener('mouseleave', function() {
            this.querySelector('rect').style.fill = '#f5f5f5';
        });
        
        // 初始化
        updateScene();
    })();
    </script>
</body>
</html>
