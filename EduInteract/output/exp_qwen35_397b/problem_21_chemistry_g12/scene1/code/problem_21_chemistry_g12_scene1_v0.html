<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>原电池 - 电解池组合装置</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        .scene1-label {
            font-size: 14px;
            fill: #333;
        }
        .scene1-polarity {
            font-size: 13px;
            font-weight: bold;
        }
        .scene1-btn {
            padding: 8px 16px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #f5f5f5;
            cursor: pointer;
            transition: background 0.2s;
        }
        .scene1-btn:hover:not(:disabled) {
            background: #e0e0e0;
        }
        .scene1-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .scene1-step-indicator {
            font-size: 14px;
            color: #666;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <!-- 标题 -->
            <text id="scene1-title" x="400" y="40" text-anchor="middle" font-size="18" fill="#333">原电池 - 电解池组合装置</text>

            <!-- 左侧烧杯 -->
            <rect id="scene1-beaker" x="80" y="200" width="200" height="180" stroke="#000" stroke-width="2" fill="none"/>
            
            <!-- 稀硫酸溶液 -->
            <rect id="scene1-solution" x="85" y="280" width="190" height="95" fill="#bbdefb"/>

            <!-- 锌片电极 -->
            <rect id="scene1-zn" x="115" y="180" width="30" height="170" fill="#9e9e9e"/>
            
            <!-- 铜片电极 -->
            <rect id="scene1-cu" x="215" y="180" width="30" height="170" fill="#ff7043"/>

            <!-- 右侧滤纸椭圆 -->
            <ellipse id="scene1-filter-paper" cx="590" cy="320" rx="110" ry="65" stroke="#000" stroke-width="1" fill="#f5f5f5"/>

            <!-- 石墨棒 a -->
            <rect id="scene1-electrode-a" x="535" y="250" width="20" height="90" fill="#424242"/>
            
            <!-- 石墨棒 b -->
            <rect id="scene1-electrode-b" x="625" y="250" width="20" height="90" fill="#424242"/>

            <!-- 导线 1：锌→b -->
            <polyline id="scene1-wire-zn-b" points="130,180 130,110 635,110 635,250" stroke="#000" stroke-width="2" fill="none"/>

            <!-- 导线 2：铜→a -->
            <polyline id="scene1-wire-cu-a" points="230,180 230,90 545,90 545,250" stroke="#000" stroke-width="2" fill="none"/>

            <!-- 基础标签 -->
            <text id="scene1-label-zn" x="130" y="165" text-anchor="middle" class="scene1-label">锌</text>
            <text id="scene1-label-cu" x="230" y="165" text-anchor="middle" class="scene1-label">铜</text>
            <text id="scene1-label-a" x="545" y="235" text-anchor="middle" class="scene1-label">a</text>
            <text id="scene1-label-b" x="635" y="235" text-anchor="middle" class="scene1-label">b</text>
            
            <!-- 稀硫酸标签及引线 -->
            <line id="scene1-solution-lead" x1="275" y1="340" x2="295" y2="340" stroke="#000" stroke-width="1"/>
            <text id="scene1-label-solution" x="290" y="340" class="scene1-label">稀硫酸</text>
            
            <!-- 滤纸标签及引线 -->
            <line id="scene1-paper-lead" x1="590" y1="385" x2="590" y2="395" stroke="#000" stroke-width="1"/>
            <text id="scene1-label-paper" x="590" y="400" text-anchor="middle" class="scene1-label">饱和食盐水滤纸</text>

            <!-- 高亮框 1（原电池区域）- 初始隐藏 -->
            <rect id="scene1-highlight-box1" x="60" y="160" width="240" height="240" stroke="#ffa000" stroke-width="3" fill="rgba(255,160,0,0.1)" style="display:none"/>

            <!-- 高亮框 2（电解池区域）- 初始隐藏 -->
            <rect id="scene1-highlight-box2" x="480" y="220" width="220" height="200" stroke="#ffa000" stroke-width="3" fill="rgba(255,160,0,0.1)" style="display:none"/>

            <!-- 极性标注 - 初始隐藏 -->
            <text id="scene1-polarity-negative" x="95" y="360" class="scene1-polarity" fill="#c62828" style="display:none">负极 (-)</text>
            <text id="scene1-polarity-positive" x="255" y="360" class="scene1-polarity" fill="#1565c0" style="display:none">正极 (+)</text>
            <text id="scene1-polarity-anode" x="520" y="350" class="scene1-polarity" fill="#c62828" style="display:none">阳极 (+)</text>
            <text id="scene1-polarity-cathode" x="655" y="350" class="scene1-polarity" fill="#1565c0" style="display:none">阴极 (-)</text>

            <!-- 控件栏 -->
            <g id="scene1-controls">
                <rect x="300" y="455" width="220" height="35" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="4"/>
                <text id="scene1-step-indicator" x="410" y="478" text-anchor="middle" font-size="14" fill="#666">步骤 1/4</text>
            </g>
        </svg>

        <!-- HTML 按钮控件 -->
        <div style="position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px;">
            <button id="scene1-btn-prev" class="scene1-btn" disabled>◀ 上一步</button>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现：原电池 - 电解池组合装置

        // 状态变量
        let currentStep = 0;
        const totalSteps = 4;

        // 获取 DOM 元素
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        const title = document.getElementById('scene1-title');

        // 需要控制的元素
        const highlightBox1 = document.getElementById('scene1-highlight-box1');
        const highlightBox2 = document.getElementById('scene1-highlight-box2');
        const polarityNegative = document.getElementById('scene1-polarity-negative');
        const polarityPositive = document.getElementById('scene1-polarity-positive');
        const polarityAnode = document.getElementById('scene1-polarity-anode');
        const polarityCathode = document.getElementById('scene1-polarity-cathode');

        // 显示/隐藏辅助函数
        function show(el) {
            el.style.display = 'block';
            el.style.opacity = '1';
        }

        function hide(el) {
            el.style.display = 'none';
            el.style.opacity = '0';
        }

        // 渲染当前步骤
        function renderStep() {
            // 更新步骤指示器
            stepIndicator.textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;

            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps - 1);

            // 根据步骤显示/隐藏元素
            switch (currentStep) {
                case 0:
                    // 初始状态：只显示基础元素
                    hide(highlightBox1);
                    hide(highlightBox2);
                    hide(polarityNegative);
                    hide(polarityPositive);
                    hide(polarityAnode);
                    hide(polarityCathode);
                    title.textContent = '原电池 - 电解池组合装置';
                    break;

                case 1:
                    // 高亮原电池部分
                    show(highlightBox1);
                    hide(highlightBox2);
                    show(polarityNegative);
                    show(polarityPositive);
                    hide(polarityAnode);
                    hide(polarityCathode);
                    title.textContent = '原电池部分：锌为负极，铜为正极';
                    break;

                case 2:
                    // 高亮电解池部分
                    show(highlightBox1);
                    show(highlightBox2);
                    show(polarityNegative);
                    show(polarityPositive);
                    show(polarityAnode);
                    show(polarityCathode);
                    title.textContent = '电解池部分：a 为阳极，b 为阴极';
                    break;

                case 3:
                    // 完整标注（移除高亮框）
                    hide(highlightBox1);
                    hide(highlightBox2);
                    show(polarityNegative);
                    show(polarityPositive);
                    show(polarityAnode);
                    show(polarityCathode);
                    title.textContent = '电极极性判断完成';
                    break;
            }
        }

        // 按钮事件处理
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                renderStep();
            }
        });

        // 初始化
        renderStep();
    })();
    </script>
</body>
</html>
