<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地球公转示意图</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        .scene1-highlight { stroke: #1565c0; stroke-width: 3; }
        .scene1-default { stroke: #000000; stroke-width: 1; }
        .scene1-btn { cursor: pointer; }
        .scene1-btn-disabled { cursor: not-allowed; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500">
            <!-- 公转轨道 -->
            <ellipse id="scene1-orbit" cx="400" cy="250" rx="260" ry="160" fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 太阳 -->
            <g id="scene1-sun">
                <circle cx="400" cy="250" r="35" fill="#ffb300"/>
                <!-- 太阳光芒 -->
                <line x1="400" y1="205" x2="400" y2="195" stroke="#ffb300" stroke-width="3"/>
                <line x1="400" y1="295" x2="400" y2="305" stroke="#ffb300" stroke-width="3"/>
                <line x1="355" y1="250" x2="345" y2="250" stroke="#ffb300" stroke-width="3"/>
                <line x1="445" y1="250" x2="455" y2="250" stroke="#ffb300" stroke-width="3"/>
                <line x1="369" y1="219" x2="362" y2="212" stroke="#ffb300" stroke-width="3"/>
                <line x1="431" y1="281" x2="438" y2="288" stroke="#ffb300" stroke-width="3"/>
                <line x1="431" y1="219" x2="438" y2="212" stroke="#ffb300" stroke-width="3"/>
                <line x1="369" y1="281" x2="362" y2="288" stroke="#ffb300" stroke-width="3"/>
            </g>
            
            <!-- 公转方向箭头 -->
            <g id="scene1-arrows">
                <path id="scene1-arrow-1" d="M 520 130 L 530 125 L 525 135 Z" fill="#888888"/>
                <path id="scene1-arrow-2" d="M 280 130 L 270 125 L 275 135 Z" fill="#888888"/>
                <path id="scene1-arrow-3" d="M 280 370 L 270 375 L 275 365 Z" fill="#888888"/>
                <path id="scene1-arrow-4" d="M 520 370 L 530 375 L 525 365 Z" fill="#888888"/>
            </g>
            
            <!-- 地球-a (右侧，冬至) -->
            <g id="scene1-earth-a">
                <circle cx="650" cy="250" r="28" class="scene1-default"/>
                <!-- 昼夜半球 -->
                <g id="scene1-daynight-a" style="display:none;">
                    <path d="M 650 222 A 28 28 0 0 1 650 278 A 28 28 0 0 1 650 222" fill="#fff9c4" opacity="0.5"/>
                    <path d="M 650 278 A 28 28 0 0 0 650 222 A 28 28 0 0 0 650 278" fill="#90a4ae" opacity="0.5"/>
                </g>
                <!-- 地轴 -->
                <line id="scene1-axis-a" x1="635" y1="235" x2="665" y2="265" stroke="#888888" stroke-width="2" stroke-dasharray="4,2"/>
                <!-- 直射点标记 -->
                <circle id="scene1-direct-a" cx="650" cy="265" r="4" fill="#c62828" style="display:none;"/>
                <!-- 标签 -->
                <text id="scene1-label-a" x="690" y="255" font-size="14" fill="#000000">a</text>
            </g>
            
            <!-- 地球-b (上方，春分) -->
            <g id="scene1-earth-b">
                <circle cx="400" cy="90" r="28" class="scene1-default"/>
                <!-- 昼夜半球 -->
                <g id="scene1-daynight-b" style="display:none;">
                    <path d="M 372 90 A 28 28 0 0 1 428 90 A 28 28 0 0 1 372 90" fill="#fff9c4" opacity="0.5"/>
                    <path d="M 428 90 A 28 28 0 0 0 372 90 A 28 28 0 0 0 428 90" fill="#90a4ae" opacity="0.5"/>
                </g>
                <!-- 地轴 -->
                <line id="scene1-axis-b" x1="385" y1="75" x2="415" y2="105" stroke="#888888" stroke-width="2" stroke-dasharray="4,2"/>
                <!-- 直射点标记 -->
                <circle id="scene1-direct-b" cx="400" cy="90" r="4" fill="#c62828" style="display:none;"/>
                <!-- 标签 -->
                <text id="scene1-label-b" x="390" y="50" font-size="14" fill="#000000">b</text>
            </g>
            
            <!-- 地球-c (左侧，夏至) -->
            <g id="scene1-earth-c">
                <circle cx="150" cy="250" r="28" class="scene1-default"/>
                <!-- 昼夜半球 -->
                <g id="scene1-daynight-c" style="display:none;">
                    <path d="M 150 222 A 28 28 0 0 0 150 278 A 28 28 0 0 0 150 222" fill="#fff9c4" opacity="0.5"/>
                    <path d="M 150 278 A 28 28 0 0 1 150 222 A 28 28 0 0 1 150 278" fill="#90a4ae" opacity="0.5"/>
                </g>
                <!-- 地轴 -->
                <line id="scene1-axis-c" x1="135" y1="235" x2="165" y2="265" stroke="#888888" stroke-width="2" stroke-dasharray="4,2"/>
                <!-- 直射点标记 -->
                <circle id="scene1-direct-c" cx="150" cy="235" r="4" fill="#c62828" style="display:none;"/>
                <!-- 标签 -->
                <text id="scene1-label-c" x="110" y="255" font-size="14" fill="#000000">c</text>
            </g>
            
            <!-- 地球-d (下方，秋分) -->
            <g id="scene1-earth-d">
                <circle cx="400" cy="410" r="28" class="scene1-default"/>
                <!-- 昼夜半球 -->
                <g id="scene1-daynight-d" style="display:none;">
                    <path d="M 372 410 A 28 28 0 0 0 428 410 A 28 28 0 0 0 372 410" fill="#fff9c4" opacity="0.5"/>
                    <path d="M 428 410 A 28 28 0 0 1 372 410 A 28 28 0 0 1 428 410" fill="#90a4ae" opacity="0.5"/>
                </g>
                <!-- 地轴 -->
                <line id="scene1-axis-d" x1="385" y1="395" x2="415" y2="425" stroke="#888888" stroke-width="2" stroke-dasharray="4,2"/>
                <!-- 直射点标记 -->
                <circle id="scene1-direct-d" cx="400" cy="410" r="4" fill="#c62828" style="display:none;"/>
                <!-- 标签 -->
                <text id="scene1-label-d" x="390" y="455" font-size="14" fill="#000000">d</text>
            </g>
            
            <!-- 太阳光线 -->
            <line id="scene1-ray-c" x1="400" y1="250" x2="150" y2="250" stroke="#888888" stroke-width="1" stroke-dasharray="4,2" style="display:none;"/>
            <line id="scene1-ray-a" x1="400" y1="250" x2="650" y2="250" stroke="#888888" stroke-width="1" stroke-dasharray="4,2" style="display:none;"/>
            <line id="scene1-ray-b" x1="400" y1="250" x2="400" y2="90" stroke="#888888" stroke-width="1" stroke-dasharray="4,2" style="display:none;"/>
            <line id="scene1-ray-d" x1="400" y1="250" x2="400" y2="410" stroke="#888888" stroke-width="1" stroke-dasharray="4,2" style="display:none;"/>
            
            <!-- 信息框 -->
            <g id="scene1-info-group">
                <rect id="scene1-info-box" x="580" y="30" width="200" height="140" fill="#f5f5f5" stroke="#cccccc" stroke-width="1"/>
                <text id="scene1-info-title" x="590" y="55" font-size="16" font-weight="bold" fill="#000000">地球公转示意图</text>
                <text id="scene1-info-content" x="590" y="90" font-size="12" fill="#333333">点击下一步开始讲解</text>
            </g>
            
            <!-- 控件栏 -->
            <g id="scene1-controls">
                <rect id="scene1-btn-prev-bg" x="260" y="455" width="90" height="28" fill="#1565c0" rx="4" class="scene1-btn"/>
                <text id="scene1-btn-prev-text" x="305" y="474" text-anchor="middle" font-size="13" fill="#ffffff" class="scene1-btn">◀ 上一步</text>
                <text id="scene1-step-indicator" x="400" y="474" text-anchor="middle" font-size="14" fill="#333333">步骤 0/5</text>
                <rect id="scene1-btn-next-bg" x="450" y="455" width="90" height="28" fill="#1565c0" rx="4" class="scene1-btn"/>
                <text id="scene1-btn-next-text" x="495" y="474" text-anchor="middle" font-size="13" fill="#ffffff" class="scene1-btn">下一步 ▶</text>
            </g>
        </svg>
    </div>
    
    <script>
    (function() {
        // 坐标表参考：
        // 太阳：(400, 250) 半径 35
        // 公转轨道：中心 (400,250) 长轴 520 短轴 320
        // 地球-a：(650, 250) 半径 28（冬至）
        // 地球-b：(400, 90) 半径 28（春分）
        // 地球-c：(150, 250) 半径 28（夏至）
        // 地球-d：(400, 410) 半径 28（秋分）
        // 标签 a：(690, 255) 标签 b：(390, 50) 标签 c：(110, 255) 标签 d：(390, 455)
        // 信息框：(580, 30) 200×140
        // 按钮：上一步 (260,455) 下一步 (450,455)
        
        let currentStep = 0;
        const totalSteps = 5;
        
        const stepData = [
            {
                title: "地球公转示意图",
                content: "点击下一步开始讲解",
                highlight: null,
                showRay: null,
                showDayNight: null,
                showDirect: null
            },
            {
                title: "夏至（位置 c）",
                content: "日期：6 月 22 日前后\n直射点：北回归线 23.5°N\n昼夜：北半球昼最长夜最短\n极昼极夜：北极圈极昼，南极圈极夜",
                highlight: "c",
                showRay: "c",
                showDayNight: "c",
                showDirect: "c"
            },
            {
                title: "冬至（位置 a）",
                content: "日期：12 月 22 日前后\n直射点：南回归线 23.5°S\n昼夜：北半球昼最短夜最长\n极昼极夜：北极圈极夜，南极圈极昼",
                highlight: "a",
                showRay: "a",
                showDayNight: "a",
                showDirect: "a"
            },
            {
                title: "春分（位置 b）",
                content: "日期：3 月 21 日前后\n直射点：赤道 0°\n昼夜：全球昼夜等长\n极昼极夜：无极昼极夜",
                highlight: "b",
                showRay: "b",
                showDayNight: "b",
                showDirect: "b"
            },
            {
                title: "秋分（位置 d）",
                content: "日期：9 月 23 日前后\n直射点：赤道 0°\n昼夜：全球昼夜等长\n极昼极夜：无极昼极夜",
                highlight: "d",
                showRay: "d",
                showDayNight: "d",
                showDirect: "d"
            },
            {
                title: "公转总结",
                content: "公转方向：逆时针\n周期：一年\n地理意义：四季变化、昼夜长短变化",
                highlight: "all",
                showRay: "all",
                showDayNight: null,
                showDirect: "all"
            }
        ];
        
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }
        
        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }
        
        function highlightEarth(pos) {
            ['a', 'b', 'c', 'd'].forEach(p => {
                const circle = document.getElementById('scene1-earth-' + p + ' circle');
                if (circle) {
                    if (pos === 'all' || pos === p) {
                        circle.classList.remove('scene1-default');
                        circle.classList.add('scene1-highlight');
                    } else {
                        circle.classList.remove('scene1-highlight');
                        circle.classList.add('scene1-default');
                    }
                }
            });
        }
        
        function renderStep(step) {
            const data = stepData[step];
            
            // 更新信息框
            document.getElementById('scene1-info-title').textContent = data.title;
            document.getElementById('scene1-info-content').textContent = data.content;
            
            // 更新步骤指示器
            document.getElementById('scene1-step-indicator').textContent = '步骤 ' + step + '/' + totalSteps;
            
            // 高亮地球
            highlightEarth(data.highlight);
            
            // 显示/隐藏太阳光线
            ['a', 'b', 'c', 'd'].forEach(p => {
                const rayId = 'scene1-ray-' + p;
                if (data.showRay === 'all' || data.showRay === p) {
                    showElement(rayId);
                } else {
                    hideElement(rayId);
                }
            });
            
            // 显示/隐藏昼夜半球
            ['a', 'b', 'c', 'd'].forEach(p => {
                const dnId = 'scene1-daynight-' + p;
                if (data.showDayNight === p) {
                    showElement(dnId);
                } else {
                    hideElement(dnId);
                }
            });
            
            // 显示/隐藏直射点标记
            ['a', 'b', 'c', 'd'].forEach(p => {
                const directId = 'scene1-direct-' + p;
                if (data.showDirect === 'all' || data.showDirect === p) {
                    showElement(directId);
                } else {
                    hideElement(directId);
                }
            });
            
            // 更新按钮状态
            const prevBtn = document.getElementById('scene1-btn-prev-bg');
            const nextBtn = document.getElementById('scene1-btn-next-bg');
            const prevText = document.getElementById('scene1-btn-prev-text');
            const nextText = document.getElementById('scene1-btn-next-text');
            
            if (step === 0) {
                prevBtn.setAttribute('fill', '#cccccc');
                prevText.setAttribute('fill', '#888888');
                prevBtn.classList.remove('scene1-btn');
                prevBtn.classList.add('scene1-btn-disabled');
            } else {
                prevBtn.setAttribute('fill', '#1565c0');
                prevText.setAttribute('fill', '#ffffff');
                prevBtn.classList.remove('scene1-btn-disabled');
                prevBtn.classList.add('scene1-btn');
            }
            
            if (step >= totalSteps) {
                nextBtn.setAttribute('fill', '#cccccc');
                nextText.setAttribute('fill', '#888888');
                nextBtn.classList.remove('scene1-btn');
                nextBtn.classList.add('scene1-btn-disabled');
            } else {
                nextBtn.setAttribute('fill', '#1565c0');
                nextText.setAttribute('fill', '#ffffff');
                nextBtn.classList.remove('scene1-btn-disabled');
                nextBtn.classList.add('scene1-btn');
            }
        }
        
        function goToStep(step) {
            if (step < 0) step = 0;
            if (step > totalSteps) step = totalSteps;
            currentStep = step;
            renderStep(currentStep);
        }
        
        // 初始化
        document.getElementById('scene1-btn-prev-bg').addEventListener('click', function() {
            if (currentStep > 0) {
                goToStep(currentStep - 1);
            }
        });
        
        document.getElementById('scene1-btn-next-bg').addEventListener('click', function() {
            if (currentStep < totalSteps) {
                goToStep(currentStep + 1);
            }
        });
        
        // 初始渲染
        renderStep(0);
    })();
    </script>
</body>
</html>
