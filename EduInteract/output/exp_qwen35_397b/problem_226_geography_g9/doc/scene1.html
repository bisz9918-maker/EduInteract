<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地球光照图 - 冬至日太阳光照特征</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-controls button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #333; border-radius: 4px; background: #f0f0f0; }
        #scene1-controls button:hover { background: #e0e0e0; }
        #scene1-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 14px; font-weight: bold; min-width: 80px; text-align: center; }
        .fade-in { animation: scene1-fade-in 0.3s ease-in; }
        @keyframes scene1-fade-in { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <defs>
                <!-- 箭头定义 -->
                <marker id="scene1-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L10,3 L0,6 L0,0" fill="#f57f17" />
                </marker>
                <!-- 夜半球斜线填充图案 -->
                <pattern id="scene1-hatch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
                    <line x1="0" y1="0" x2="0" y2="10" stroke="#888888" stroke-width="1" opacity="0.5" />
                </pattern>
            </defs>

            <!-- 地球球体轮廓 -->
            <circle id="scene1-earth" cx="400" cy="250" r="150" fill="none" stroke="#000000" stroke-width="2" />

            <!-- 地轴（虚线） -->
            <line id="scene1-axis" x1="365" y1="180" x2="435" y2="320" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" />
            <!-- N/S 标签移到球体外更远 -->
            <text id="scene1-axis-n" x="490" y="135" font-size="14" fill="#000000" opacity="0">N</text>
            <text id="scene1-axis-s" x="310" y="370" font-size="14" fill="#000000" opacity="0">S</text>

            <!-- 纬线（椭圆弧） -->
            <!-- 赤道 -->
            <ellipse id="scene1-latitude-equator" cx="400" cy="250" rx="150" ry="30" fill="none" stroke="#000000" stroke-width="1" opacity="0.6" />
            <!-- 北回归线 23.5°N -->
            <ellipse id="scene1-latitude-tropic-n" cx="400" cy="215" rx="140" ry="25" fill="none" stroke="#000000" stroke-width="1" opacity="0.6" />
            <!-- 南回归线 23.5°S -->
            <ellipse id="scene1-latitude-tropic-s" cx="400" cy="285" rx="140" ry="25" fill="none" stroke="#000000" stroke-width="1" opacity="0.6" />
            <!-- 北极圈 66.5°N -->
            <ellipse id="scene1-latitude-arctic" cx="400" cy="165" rx="100" ry="15" fill="none" stroke="#000000" stroke-width="1" opacity="0.6" />
            <!-- 南极圈 66.5°S -->
            <ellipse id="scene1-latitude-antarctic" cx="400" cy="335" rx="100" ry="15" fill="none" stroke="#000000" stroke-width="1" opacity="0.6" />

            <!-- 经线（多条椭圆弧） -->
            <ellipse id="scene1-longitude-1" cx="400" cy="250" rx="30" ry="150" fill="none" stroke="#000000" stroke-width="1" opacity="0.4" />
            <ellipse id="scene1-longitude-2" cx="370" cy="250" rx="50" ry="145" fill="none" stroke="#000000" stroke-width="1" opacity="0.4" />
            <ellipse id="scene1-longitude-3" cx="430" cy="250" rx="50" ry="145" fill="none" stroke="#000000" stroke-width="1" opacity="0.4" />
            <ellipse id="scene1-longitude-4" cx="340" cy="250" rx="80" ry="140" fill="none" stroke="#000000" stroke-width="1" opacity="0.4" />
            <ellipse id="scene1-longitude-5" cx="460" cy="250" rx="80" ry="140" fill="none" stroke="#000000" stroke-width="1" opacity="0.4" />

            <!-- 夜半球阴影（右半圆斜线填充） -->
            <g id="scene1-night-shadow" opacity="0">
                <path d="M400,100 A150,150 0 0,1 400,400 L400,100 Z" fill="url(#scene1-hatch)" opacity="0.3" />
            </g>

            <!-- 太阳光线（5条平行箭头） -->
            <g id="scene1-sun-rays">
                <line id="scene1-ray-1" x1="50" y1="150" x2="200" y2="150" stroke="#cccccc" stroke-width="2" marker-end="url(#scene1-arrow)" />
                <line id="scene1-ray-2" x1="50" y1="190" x2="200" y2="190" stroke="#cccccc" stroke-width="2" marker-end="url(#scene1-arrow)" />
                <line id="scene1-ray-3" x1="50" y1="230" x2="200" y2="230" stroke="#cccccc" stroke-width="2" marker-end="url(#scene1-arrow)" />
                <line id="scene1-ray-4" x1="50" y1="270" x2="200" y2="270" stroke="#cccccc" stroke-width="2" marker-end="url(#scene1-arrow)" />
                <line id="scene1-ray-5" x1="50" y1="310" x2="200" y2="310" stroke="#cccccc" stroke-width="2" marker-end="url(#scene1-arrow)" />
            </g>
            <text id="scene1-sun-label" x="30" y="200" font-size="14" fill="#000000" opacity="0" writing-mode="tb">太阳光线</text>

            <!-- 晨昏线 -->
            <line id="scene1-terminator" x1="400" y1="100" x2="400" y2="400" stroke="#cccccc" stroke-width="2" />
            <!-- 晨昏线标签移到球体右侧外部更远 -->
            <text id="scene1-terminator-label" x="465" y="255" font-size="14" fill="#000000" opacity="0">晨昏线</text>

            <!-- 太阳直射点 -->
            <circle id="scene1-subsolar" cx="250" cy="285" r="6" fill="#c62828" opacity="0" />
            <!-- 直射点标签下移，远离球体 -->
            <text id="scene1-subsolar-label" x="250" y="375" font-size="14" fill="#c62828" text-anchor="middle" opacity="0">23.5°S</text>

            <!-- A/B/C 三点 - 调整位置到球体外 -->
            <!-- A 点：北半球昼半球，放在球体左侧外部 -->
            <circle id="scene1-point-a" cx="200" cy="235" r="4" fill="#1565c0" opacity="0.6" />
            <text id="scene1-point-a-label" x="210" y="240" font-size="14" fill="#1565c0" opacity="0.6">A</text>
            
            <!-- B 点：北极圈附近，放在球体左上方外部更远 -->
            <circle id="scene1-point-b" cx="200" cy="155" r="4" fill="#1565c0" opacity="0.6" />
            <text id="scene1-point-b-label" x="210" y="150" font-size="14" fill="#1565c0" opacity="0.6">B</text>
            
            <!-- C 点：夜半球右侧，放在球体右侧外部更远 -->
            <circle id="scene1-point-c" cx="610" cy="250" r="4" fill="#1565c0" opacity="0.6" />
            <text id="scene1-point-c-label" x="620" y="255" font-size="14" fill="#1565c0" opacity="0.6">C</text>

            <!-- 昼半球/夜半球标签 - 移到更下方 -->
            <text id="scene1-day-label" x="180" y="435" font-size="14" fill="#000000" opacity="0">昼半球</text>
            <text id="scene1-night-label" x="620" y="435" font-size="14" fill="#000000" opacity="0">夜半球</text>

            <!-- 极昼/极夜标签 - 移到球体外上方和下方，远离结论框 -->
            <text id="scene1-polar-night-label" x="400" y="60" font-size="14" fill="#000000" text-anchor="middle" opacity="0">极夜</text>
            <text id="scene1-polar-day-label" x="400" y="448" font-size="14" fill="#000000" text-anchor="middle" opacity="0">极昼</text>

            <!-- 时间标注 - 移到点下方，远离球体 -->
            <text id="scene1-noon-label" x="200" y="265" font-size="12" fill="#1565c0" text-anchor="middle" opacity="0">正午</text>
            <text id="scene1-midnight-label" x="610" y="275" font-size="12" fill="#1565c0" text-anchor="middle" opacity="0">深夜</text>

            <!-- 结论框 - 移到球体上方，更高位置，文字位置修正 -->
            <g id="scene1-conclusion" opacity="0">
                <rect x="200" y="10" width="400" height="40" fill="#fff9c4" stroke="#f57f17" stroke-width="1" rx="5" />
                <text x="400" y="36" font-size="13" fill="#000000" text-anchor="middle">冬至日：12 月 22 日前后，太阳直射 23.5°S，北半球昼短夜长</text>
            </g>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-prev-btn">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 0/5</span>
            <button id="scene1-next-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现 - 地球光照图分步解析

        const steps = [
            // 步骤 0: 初始状态 - 基础框架
            ['scene1-earth', 'scene1-axis', 'scene1-latitude-equator', 'scene1-latitude-tropic-n', 
             'scene1-latitude-tropic-s', 'scene1-latitude-arctic', 'scene1-latitude-antarctic',
             'scene1-longitude-1', 'scene1-longitude-2', 'scene1-longitude-3', 'scene1-longitude-4', 'scene1-longitude-5',
             'scene1-point-a', 'scene1-point-a-label', 'scene1-point-b', 'scene1-point-b-label', 
             'scene1-point-c', 'scene1-point-c-label'],
            // 步骤 1: 太阳光线 + 直射点
            ['scene1-earth', 'scene1-axis', 'scene1-axis-n', 'scene1-axis-s', 'scene1-latitude-equator', 
             'scene1-latitude-tropic-n', 'scene1-latitude-tropic-s', 'scene1-latitude-arctic', 'scene1-latitude-antarctic',
             'scene1-longitude-1', 'scene1-longitude-2', 'scene1-longitude-3', 'scene1-longitude-4', 'scene1-longitude-5',
             'scene1-point-a', 'scene1-point-a-label', 'scene1-point-b', 'scene1-point-b-label', 
             'scene1-point-c', 'scene1-point-c-label',
             'scene1-ray-1', 'scene1-ray-2', 'scene1-ray-3', 'scene1-ray-4', 'scene1-ray-5',
             'scene1-sun-label', 'scene1-subsolar', 'scene1-subsolar-label'],
            // 步骤 2: 晨昏线 + 昼夜半球标签
            ['scene1-earth', 'scene1-axis', 'scene1-axis-n', 'scene1-axis-s', 'scene1-latitude-equator', 
             'scene1-latitude-tropic-n', 'scene1-latitude-tropic-s', 'scene1-latitude-arctic', 'scene1-latitude-antarctic',
             'scene1-longitude-1', 'scene1-longitude-2', 'scene1-longitude-3', 'scene1-longitude-4', 'scene1-longitude-5',
             'scene1-point-a', 'scene1-point-a-label', 'scene1-point-b', 'scene1-point-b-label', 
             'scene1-point-c', 'scene1-point-c-label',
             'scene1-ray-1', 'scene1-ray-2', 'scene1-ray-3', 'scene1-ray-4', 'scene1-ray-5',
             'scene1-sun-label', 'scene1-subsolar', 'scene1-subsolar-label',
             'scene1-terminator', 'scene1-terminator-label', 'scene1-day-label', 'scene1-night-label'],
            // 步骤 3: 极昼极夜
            ['scene1-earth', 'scene1-axis', 'scene1-axis-n', 'scene1-axis-s', 'scene1-latitude-equator', 
             'scene1-latitude-tropic-n', 'scene1-latitude-tropic-s', 'scene1-latitude-arctic', 'scene1-latitude-antarctic',
             'scene1-longitude-1', 'scene1-longitude-2', 'scene1-longitude-3', 'scene1-longitude-4', 'scene1-longitude-5',
             'scene1-point-a', 'scene1-point-a-label', 'scene1-point-b', 'scene1-point-b-label', 
             'scene1-point-c', 'scene1-point-c-label',
             'scene1-ray-1', 'scene1-ray-2', 'scene1-ray-3', 'scene1-ray-4', 'scene1-ray-5',
             'scene1-sun-label', 'scene1-subsolar', 'scene1-subsolar-label',
             'scene1-terminator', 'scene1-terminator-label', 'scene1-day-label', 'scene1-night-label',
             'scene1-night-shadow', 'scene1-polar-night-label', 'scene1-polar-day-label'],
            // 步骤 4: ABC 三点时间标注
            ['scene1-earth', 'scene1-axis', 'scene1-axis-n', 'scene1-axis-s', 'scene1-latitude-equator', 
             'scene1-latitude-tropic-n', 'scene1-latitude-tropic-s', 'scene1-latitude-arctic', 'scene1-latitude-antarctic',
             'scene1-longitude-1', 'scene1-longitude-2', 'scene1-longitude-3', 'scene1-longitude-4', 'scene1-longitude-5',
             'scene1-point-a', 'scene1-point-a-label', 'scene1-point-b', 'scene1-point-b-label', 
             'scene1-point-c', 'scene1-point-c-label',
             'scene1-ray-1', 'scene1-ray-2', 'scene1-ray-3', 'scene1-ray-4', 'scene1-ray-5',
             'scene1-sun-label', 'scene1-subsolar', 'scene1-subsolar-label',
             'scene1-terminator', 'scene1-terminator-label', 'scene1-day-label', 'scene1-night-label',
             'scene1-night-shadow', 'scene1-polar-night-label', 'scene1-polar-day-label',
             'scene1-noon-label', 'scene1-midnight-label'],
            // 步骤 5: 结论
            ['scene1-earth', 'scene1-axis', 'scene1-axis-n', 'scene1-axis-s', 'scene1-latitude-equator', 
             'scene1-latitude-tropic-n', 'scene1-latitude-tropic-s', 'scene1-latitude-arctic', 'scene1-latitude-antarctic',
             'scene1-longitude-1', 'scene1-longitude-2', 'scene1-longitude-3', 'scene1-longitude-4', 'scene1-longitude-5',
             'scene1-point-a', 'scene1-point-a-label', 'scene1-point-b', 'scene1-point-b-label', 
             'scene1-point-c', 'scene1-point-c-label',
             'scene1-ray-1', 'scene1-ray-2', 'scene1-ray-3', 'scene1-ray-4', 'scene1-ray-5',
             'scene1-sun-label', 'scene1-subsolar', 'scene1-subsolar-label',
             'scene1-terminator', 'scene1-terminator-label', 'scene1-day-label', 'scene1-night-label',
             'scene1-night-shadow', 'scene1-polar-night-label', 'scene1-polar-day-label',
             'scene1-noon-label', 'scene1-midnight-label', 'scene1-conclusion']
        ];

        let currentStep = 0;

        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.display = '';
                el.style.opacity = '1';
                el.classList.add('fade-in');
            }
        }

        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.display = '';
                el.style.opacity = '0';
                el.classList.remove('fade-in');
            }
        }

        function updateStep() {
            // 隐藏所有元素
            const allIds = new Set();
            steps.forEach(step => step.forEach(id => allIds.add(id)));
            allIds.forEach(id => hideElement(id));

            // 显示当前步骤的元素
            steps[currentStep].forEach(id => showElement(id));

            // 更新按钮状态
            document.getElementById('scene1-prev-btn').disabled = currentStep === 0;
            document.getElementById('scene1-next-btn').disabled = currentStep === steps.length - 1;
            document.getElementById('scene1-step-indicator').textContent = `步骤 ${currentStep}/${steps.length - 1}`;
        }

        // 特殊样式处理
        function applyStepStyles(step) {
            // 步骤 1: 太阳光线变橙色
            if (step >= 1) {
                for (let i = 1; i <= 5; i++) {
                    const ray = document.getElementById(`scene1-ray-${i}`);
                    if (ray) ray.setAttribute('stroke', '#f57f17');
                }
            }
            // 步骤 2: 晨昏线变蓝色
            if (step >= 2) {
                const terminator = document.getElementById('scene1-terminator');
                if (terminator) terminator.setAttribute('stroke', '#1565c0');
            }
            // 步骤 4: ABC 三点高亮
            if (step >= 4) {
                ['scene1-point-a', 'scene1-point-b', 'scene1-point-c'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.setAttribute('opacity', '1');
                });
                ['scene1-point-a-label', 'scene1-point-b-label', 'scene1-point-c-label'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.setAttribute('opacity', '1');
                });
            }
        }

        document.getElementById('scene1-prev-btn').addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
                applyStepStyles(currentStep);
            }
        });

        document.getElementById('scene1-next-btn').addEventListener('click', () => {
            if (currentStep < steps.length - 1) {
                currentStep++;
                updateStep();
                applyStepStyles(currentStep);
            }
        });

        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
