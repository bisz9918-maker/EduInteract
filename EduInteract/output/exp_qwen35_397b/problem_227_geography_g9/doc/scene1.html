<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>经纬网与半球划分</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-svg { width: 800px; height: 500px; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        .scene1-btn { padding: 8px 16px; font-size: 14px; border: none; border-radius: 4px; cursor: pointer; transition: background-color 0.2s; }
        .scene1-btn:disabled { background-color: #cccccc; cursor: not-allowed; }
        #scene1-btn-prev { background-color: #666666; color: white; }
        #scene1-btn-prev:not(:disabled):hover { background-color: #444444; }
        #scene1-btn-next { background-color: #1565c0; color: white; }
        #scene1-btn-next:not(:disabled):hover { background-color: #0d47a1; }
        #scene1-step-indicator { font-size: 14px; color: #333333; min-width: 80px; text-align: center; }
        .scene1-fade-in { opacity: 0; transition: opacity 0.3s ease; }
        .scene1-visible { opacity: 1; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 结论区背景 -->
            <rect id="scene1-conclusion-bg" x="620" y="40" width="160" height="340" fill="#f5f5f5" stroke="#dddddd" stroke-width="1"/>
            
            <!-- 纬线 -->
            <!-- 40°N 纬线（向上凸的弧线） -->
            <path id="scene1-lat-40" d="M 40 80 Q 320 40 600 80" fill="none" stroke="#000000" stroke-width="1.5"/>
            <!-- 30°N 纬线 -->
            <path id="scene1-lat-30" d="M 40 160 Q 320 120 600 160" fill="none" stroke="#000000" stroke-width="1.5"/>
            <!-- 20°N 纬线 -->
            <path id="scene1-lat-20" d="M 40 240 Q 320 200 600 240" fill="none" stroke="#000000" stroke-width="1.5"/>
            
            <!-- 经线 -->
            <!-- 170°E 经线（向左凸的弧线） -->
            <path id="scene1-lon-170E" d="M 100 40 Q 80 210 100 380" fill="none" stroke="#000000" stroke-width="1.5"/>
            <!-- 180° 经线（直线） -->
            <line id="scene1-lon-180" x1="320" y1="40" x2="320" y2="380" stroke="#000000" stroke-width="1.5"/>
            <!-- 170°W 经线（向右凸的弧线） -->
            <path id="scene1-lon-170W" d="M 540 40 Q 560 210 540 380" fill="none" stroke="#000000" stroke-width="1.5"/>
            
            <!-- B→D 虚线路径（沿 20°N 纬线） -->
            <path id="scene1-bd-path" d="M 100 240 Q 320 200 540 240" fill="none" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5"/>
            
            <!-- A, B, C, D 四点 -->
            <circle id="scene1-point-a" cx="120" cy="80" r="5" fill="#c62828"/>
            <circle id="scene1-point-b" cx="120" cy="240" r="5" fill="#c62828"/>
            <circle id="scene1-point-c" cx="520" cy="120" r="5" fill="#c62828"/>
            <circle id="scene1-point-d" cx="520" cy="240" r="5" fill="#c62828"/>
            
            <!-- 纬度标签 -->
            <text id="scene1-lat-label-40" x="610" y="85" font-size="13" fill="#000000">40°</text>
            <text id="scene1-lat-label-30" x="610" y="165" font-size="13" fill="#000000">30°</text>
            <text id="scene1-lat-label-20" x="610" y="245" font-size="13" fill="#000000">20°</text>
            
            <!-- 经度标签 -->
            <text id="scene1-lon-label-170E" x="85" y="395" font-size="13" fill="#000000">170°</text>
            <text id="scene1-lon-label-180" x="305" y="395" font-size="13" fill="#000000">180°</text>
            <text id="scene1-lon-label-170W" x="525" y="395" font-size="13" fill="#000000">170°</text>
            
            <!-- 坐标标签（步骤 1 显示） -->
            <text id="scene1-label-a" class="scene1-fade-in" x="105" y="65" font-size="12" fill="#000000">A(170°E,40°N)</text>
            <text id="scene1-label-b" class="scene1-fade-in" x="105" y="265" font-size="12" fill="#000000">B(170°E,20°N)</text>
            <text id="scene1-label-c" class="scene1-fade-in" x="535" y="105" font-size="12" fill="#000000">C(170°W,35°N)</text>
            <text id="scene1-label-d" class="scene1-fade-in" x="535" y="265" font-size="12" fill="#000000">D(170°W,20°N)</text>
            
            <!-- 赤道（步骤 2 显示） -->
            <line id="scene1-equator" class="scene1-fade-in" x1="40" y1="300" x2="600" y2="300" stroke="#2e7d32" stroke-width="3"/>
            <text id="scene1-equator-label" class="scene1-fade-in" x="610" y="305" font-size="13" fill="#2e7d32">赤道 0°</text>
            
            <!-- 北半球区域填充（步骤 2 显示）- 放在文本下方 -->
            <rect id="scene1-north-hemisphere" class="scene1-fade-in" x="40" y="40" width="560" height="260" fill="#2e7d32" opacity="0.1" style="pointer-events: none;"/>
            
            <!-- 东西半球分界线（步骤 3 显示） -->
            <line id="scene1-ew-boundary-1" class="scene1-fade-in" x1="180" y1="40" x2="180" y2="380" stroke="#1565c0" stroke-width="2" stroke-dasharray="5,5"/>
            <line id="scene1-ew-boundary-2" class="scene1-fade-in" x1="460" y1="40" x2="460" y2="380" stroke="#1565c0" stroke-width="2" stroke-dasharray="5,5"/>
            
            <!-- 西半球区域填充（步骤 3 显示）- 放在文本下方 -->
            <rect id="scene1-west-hemisphere" class="scene1-fade-in" x="40" y="40" width="140" height="340" fill="#1565c0" opacity="0.1" style="pointer-events: none;"/>
            <rect id="scene1-west-hemisphere-2" class="scene1-fade-in" x="460" y="40" width="140" height="340" fill="#1565c0" opacity="0.1" style="pointer-events: none;"/>
            
            <!-- 结论区文本（步骤 4 显示） -->
            <text id="scene1-conclusion-title" class="scene1-fade-in" x="630" y="70" font-size="13" font-weight="bold" fill="#000000">半球判断</text>
            <text id="scene1-conclusion-line1" class="scene1-fade-in" x="630" y="95" font-size="11" fill="#333333">南北半球：赤道以北</text>
            <text id="scene1-conclusion-line2" class="scene1-fade-in" x="630" y="115" font-size="11" fill="#333333">为北半球</text>
            <text id="scene1-conclusion-line3" class="scene1-fade-in" x="630" y="145" font-size="11" fill="#333333">东西半球：20°W-</text>
            <text id="scene1-conclusion-line4" class="scene1-fade-in" x="630" y="165" font-size="11" fill="#333333">160°E 为东半球</text>
            <text id="scene1-conclusion-line5" class="scene1-fade-in" x="630" y="195" font-size="11" fill="#c62828">小题 1：× (西半球)</text>
            <text id="scene1-conclusion-line6" class="scene1-fade-in" x="630" y="220" font-size="11" fill="#2e7d32">小题 2：✓ (先东北</text>
            <text id="scene1-conclusion-line7" class="scene1-fade-in" x="630" y="240" font-size="11" fill="#2e7d32">后东南)</text>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 0/4</span>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现 - 经纬网与半球划分
        
        // 布局坐标表（实现对照依据）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // |------|------|-----------|------|-------------|------|
        // | 经纬网背景 | 路径组 | (40,40)-(600,380) | 560×340 | - | 主图区 |
        // | 纬线 1(40°N) | 弧线 | y≈80 | 560×30 | 右侧 | 最上方纬线 |
        // | 纬线 2(30°N) | 弧线 | y≈160 | 560×30 | 右侧 | 中间纬线 |
        // | 纬线 3(20°N) | 弧线 | y≈240 | 560×30 | 右侧 | 最下方纬线 |
        // | 经线 1(170°E) | 弧线 | x≈100 | 40×340 | 下方 | 左侧经线 |
        // | 经线 2(180°) | 直线 | x≈320 | 4×340 | 下方 | 中间经线 |
        // | 经线 3(170°W) | 弧线 | x≈540 | 40×340 | 下方 | 右侧经线 |
        // | A 点 | 实心圆 | (120,80) | r=5 | 左上 | 170°E,40°N 交点 |
        // | B 点 | 实心圆 | (120,240) | r=5 | 左下 | 170°E,20°N 交点 |
        // | C 点 | 实心圆 | (520,120) | r=5 | 右上 | 170°W,35°N 交点 |
        // | D 点 | 实心圆 | (520,240) | r=5 | 右下 | 170°W,20°N 交点 |
        
        let currentStep = 0;
        const totalSteps = 4;
        
        // 每步可见元素 ID 列表
        const stepElements = {
            0: [], // 初始状态：只显示基础元素（经纬网、点、经纬度标签、BD 路径）
            1: ['scene1-label-a', 'scene1-label-b', 'scene1-label-c', 'scene1-label-d'], // 坐标标签
            2: ['scene1-equator', 'scene1-equator-label', 'scene1-north-hemisphere', 
                'scene1-conclusion-title', 'scene1-conclusion-line1', 'scene1-conclusion-line2'], // 南北半球
            3: ['scene1-ew-boundary-1', 'scene1-ew-boundary-2', 'scene1-west-hemisphere', 'scene1-west-hemisphere-2',
                'scene1-conclusion-line3', 'scene1-conclusion-line4'], // 东西半球
            4: ['scene1-conclusion-line5', 'scene1-conclusion-line6', 'scene1-conclusion-line7'] // 完整结论
        };
        
        // 获取所有需要控制的元素
        function getElement(id) {
            return document.getElementById(id);
        }
        
        // 显示元素
        function showElement(id) {
            const el = getElement(id);
            if (el) {
                el.classList.add('scene1-visible');
            }
        }
        
        // 隐藏元素
        function hideElement(id) {
            const el = getElement(id);
            if (el) {
                el.classList.remove('scene1-visible');
            }
        }
        
        // 更新步骤显示
        function updateStep() {
            // 根据当前步骤显示/隐藏对应元素
            for (let step = 1; step <= totalSteps; step++) {
                const elements = stepElements[step];
                if (elements) {
                    elements.forEach(id => {
                        if (step <= currentStep) {
                            showElement(id);
                        } else {
                            hideElement(id);
                        }
                    });
                }
            }
            
            // 更新步骤指示器
            const indicator = getElement('scene1-step-indicator');
            if (indicator) {
                indicator.textContent = `步骤 ${currentStep}/${totalSteps}`;
            }
            
            // 更新按钮状态
            const prevBtn = getElement('scene1-btn-prev');
            const nextBtn = getElement('scene1-btn-next');
            if (prevBtn) {
                prevBtn.disabled = (currentStep === 0);
            }
            if (nextBtn) {
                nextBtn.disabled = (currentStep === totalSteps);
            }
        }
        
        // 上一步
        function prevStep() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        }
        
        // 下一步
        function nextStep() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateStep();
            }
        }
        
        // 绑定事件
        const prevBtn = getElement('scene1-btn-prev');
        const nextBtn = getElement('scene1-btn-next');
        
        if (prevBtn) {
            prevBtn.addEventListener('click', prevStep);
        }
        
        if (nextBtn) {
            nextBtn.addEventListener('click', nextStep);
        }
        
        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
