<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电化学装置基础结构</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        /* 淡入动画 */
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        /* 按钮样式 */
        .scene1-btn {
            padding: 8px 16px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .scene1-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #scene1-btn-prev {
            background: #e0e0e0;
            color: #000000;
        }
        #scene1-btn-next {
            background: #1976d2;
            color: #ffffff;
        }
        #scene1-step-indicator {
            font-size: 14px;
            color: #333;
            min-width: 80px;
            text-align: center;
        }
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 步骤 0: 烧杯轮廓 -->
            <g id="scene1-step0">
                <!-- 烧杯轮廓：path，描边 #000000 线宽 2px -->
                <path id="scene1-beaker" d="M 260 140 L 260 420 L 540 420 L 540 140" 
                      fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
                <!-- 烧杯底部圆角 -->
                <path d="M 260 420 Q 260 435 280 435 L 520 435 Q 540 435 540 420" 
                      fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
            </g>

            <!-- 步骤 1: 溶液和离子 -->
            <g id="scene1-step1" style="display: none; opacity: 0;">
                <!-- 溶液区域：rect，填充 #bbdefb 透明度 30% -->
                <rect id="scene1-solution" x="265" y="220" width="270" height="195" 
                      fill="#bbdefb" fill-opacity="0.3" stroke="none"/>
                
                <!-- Cu²⁺离子组：6 个蓝色小球 -->
                <g id="scene1-cu-ions">
                    <circle cx="330" cy="260" r="8" fill="#1565c0"/>
                    <circle cx="360" cy="290" r="8" fill="#1565c0"/>
                    <circle cx="340" cy="320" r="8" fill="#1565c0"/>
                    <circle cx="380" cy="340" r="8" fill="#1565c0"/>
                    <circle cx="350" cy="360" r="8" fill="#1565c0"/>
                    <circle cx="370" cy="300" r="8" fill="#1565c0"/>
                </g>
                
                <!-- SO₄²⁻离子组：6 个黄色小球 -->
                <g id="scene1-so4-ions">
                    <circle cx="420" cy="280" r="8" fill="#fbc02d"/>
                    <circle cx="440" cy="310" r="8" fill="#fbc02d"/>
                    <circle cx="410" cy="340" r="8" fill="#fbc02d"/>
                    <circle cx="450" cy="360" r="8" fill="#fbc02d"/>
                    <circle cx="430" cy="330" r="8" fill="#fbc02d"/>
                    <circle cx="400" cy="300" r="8" fill="#fbc02d"/>
                </g>
                
                <!-- 离子标签 -->
                <text id="scene1-cu2-label" x="365" y="300" font-size="16" fill="#1565c0" font-weight="bold">Cu²⁺</text>
                <text id="scene1-so4-label" x="365" y="340" font-size="16" fill="#fbc02d" font-weight="bold">SO₄²⁻</text>
            </g>

            <!-- 步骤 2: 电极 -->
            <g id="scene1-step2" style="display: none; opacity: 0;">
                <!-- 铜电极：rect，填充 #d84315 -->
                <rect id="scene1-cu-electrode" x="290" y="160" width="60" height="220" 
                      fill="#d84315" stroke="#000000" stroke-width="1"/>
                <!-- 铜电极标签 -->
                <text id="scene1-cu-label" x="305" y="145" font-size="16" fill="#000000" font-weight="bold">Cu</text>
                
                <!-- 铁电极：rect，填充 #757575 -->
                <rect id="scene1-fe-electrode" x="450" y="160" width="60" height="220" 
                      fill="#757575" stroke="#000000" stroke-width="1"/>
                <!-- 铁电极标签 -->
                <text id="scene1-fe-label" x="465" y="145" font-size="16" fill="#000000" font-weight="bold">Fe</text>
            </g>

            <!-- 步骤 3: 端子和导线 -->
            <g id="scene1-step3" style="display: none; opacity: 0;">
                <!-- 导线 a：line，从铜电极到端子 a -->
                <line id="scene1-wire-a" x1="320" y1="160" x2="320" y2="122" 
                      stroke="#000000" stroke-width="2"/>
                <!-- 导线 b：line，从铁电极到端子 b -->
                <line id="scene1-wire-b" x1="480" y1="160" x2="480" y2="122" 
                      stroke="#000000" stroke-width="2"/>
                
                <!-- 端子 a：circle，填充 #ffffff 描边 #000000 -->
                <circle id="scene1-terminal-a" cx="320" cy="110" r="12" 
                        fill="#ffffff" stroke="#000000" stroke-width="2"/>
                <!-- 端子 a 标签 -->
                <text id="scene1-a-label" x="305" y="90" font-size="16" fill="#000000" font-weight="bold">a</text>
                
                <!-- 端子 b：circle，填充 #ffffff 描边 #000000 -->
                <circle id="scene1-terminal-b" cx="480" cy="110" r="12" 
                        fill="#ffffff" stroke="#000000" stroke-width="2"/>
                <!-- 端子 b 标签 -->
                <text id="scene1-b-label" x="485" y="90" font-size="16" fill="#000000" font-weight="bold">b</text>
            </g>

            <!-- 控件栏：放在 SVG 内部底部 -->
            <g id="scene1-controls-group">
                <rect x="280" y="450" width="240" height="35" fill="#f5f5f5" rx="4"/>
                <foreignObject x="280" y="450" width="240" height="35">
                    <div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; justify-content: center; align-items: center; gap: 12px; height: 100%;">
                        <button id="scene1-btn-prev" class="scene1-btn">◀ 上一步</button>
                        <span id="scene1-step-indicator">步骤 0/3</span>
                        <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
                    </div>
                </foreignObject>
            </g>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 1 实现：电化学装置基础结构分步展示
        
        // 状态变量
        let currentState = 0;
        const maxState = 3;
        
        // 获取 DOM 元素
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        
        // 各步骤元素组
        const step1Elements = document.getElementById('scene1-step1');
        const step2Elements = document.getElementById('scene1-step2');
        const step3Elements = document.getElementById('scene1-step3');
        
        // 更新显示状态
        function updateDisplay() {
            // 隐藏所有步骤元素
            step1Elements.style.display = 'none';
            step1Elements.style.opacity = '0';
            step2Elements.style.display = 'none';
            step2Elements.style.opacity = '0';
            step3Elements.style.display = 'none';
            step3Elements.style.opacity = '0';
            
            // 根据当前状态显示对应元素
            if (currentState >= 1) {
                step1Elements.style.display = 'block';
                step1Elements.style.opacity = '1';
                step1Elements.classList.add('fade-in');
            }
            if (currentState >= 2) {
                step2Elements.style.display = 'block';
                step2Elements.style.opacity = '1';
                step2Elements.classList.add('fade-in');
            }
            if (currentState >= 3) {
                step3Elements.style.display = 'block';
                step3Elements.style.opacity = '1';
                step3Elements.classList.add('fade-in');
            }
            
            // 更新步骤指示器
            stepIndicator.textContent = '步骤 ' + currentState + '/' + maxState;
            
            // 更新按钮状态
            btnPrev.disabled = (currentState === 0);
            btnNext.disabled = (currentState === maxState);
        }
        
        // 上一步
        btnPrev.addEventListener('click', function() {
            if (currentState > 0) {
                currentState--;
                updateDisplay();
            }
        });
        
        // 下一步
        btnNext.addEventListener('click', function() {
            if (currentState < maxState) {
                currentState++;
                updateDisplay();
            }
        });
        
        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
