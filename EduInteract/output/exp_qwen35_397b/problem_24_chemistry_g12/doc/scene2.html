<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>甲丙等效平衡关系</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene2-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene2-svg {
            width: 800px;
            height: 500px;
        }
        .scene2-fade {
            transition: opacity 0.3s ease;
        }
        .scene2-hidden {
            opacity: 0;
        }
        .scene2-visible {
            opacity: 1;
        }
        .scene2-btn {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #333;
            border-radius: 4px;
            background: #f5f5f5;
        }
        .scene2-btn:hover {
            background: #e0e0e0;
        }
        .scene2-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #scene2-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }
        #scene2-step-indicator {
            font-size: 14px;
            color: #666;
            min-width: 80px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500">
            <!-- 甲初始物质标签 -->
            <text id="scene2-initial-jia" x="200" y="75" text-anchor="middle" font-size="14" fill="#000">0.2 mol NO₂</text>
            
            <!-- 丙初始物质标签 -->
            <text id="scene2-initial-bing" x="600" y="75" text-anchor="middle" font-size="14" fill="#000">0.1 mol N₂O₄</text>
            
            <!-- 等效标识文字 -->
            <text id="scene2-equiv-label" x="400" y="180" text-anchor="middle" font-size="14" fill="#2e7d32" class="scene2-fade scene2-visible">等效平衡</text>
            
            <!-- 等效双向箭头 -->
            <g id="scene2-equiv-arrow" class="scene2-fade scene2-visible">
                <line x1="320" y1="200" x2="480" y2="200" stroke="#888888" stroke-width="2"/>
                <polygon points="320,195 330,200 320,205" fill="#888888"/>
                <polygon points="480,195 470,200 480,205" fill="#888888"/>
            </g>
            
            <!-- 甲容器 -->
            <rect id="scene2-container-jia" x="100" y="100" width="200" height="200" fill="#e3f2fd" fill-opacity="0.15" stroke="#000" stroke-width="1.5"/>
            
            <!-- 丙容器 -->
            <rect id="scene2-container-bing" x="500" y="100" width="200" height="200" fill="#e3f2fd" fill-opacity="0.15" stroke="#000" stroke-width="1.5"/>
            
            <!-- 甲标签 -->
            <text id="scene2-label-jia" x="200" y="325" text-anchor="middle" font-size="16" fill="#000">甲</text>
            
            <!-- 丙标签 -->
            <text id="scene2-label-bing" x="600" y="325" text-anchor="middle" font-size="16" fill="#000">丙</text>
            
            <!-- 甲容器内分子：NO₂ (红色) -->
            <circle id="scene2-mol-jia-no2-1" cx="170" cy="170" r="10" fill="#c62828" class="scene2-fade scene2-hidden"/>
            <circle id="scene2-mol-jia-no2-2" cx="200" cy="160" r="10" fill="#c62828" class="scene2-fade scene2-hidden"/>
            <circle id="scene2-mol-jia-no2-3" cx="230" cy="175" r="10" fill="#c62828" class="scene2-fade scene2-hidden"/>
            <circle id="scene2-mol-jia-no2-4" cx="180" cy="200" r="10" fill="#c62828" class="scene2-fade scene2-hidden"/>
            <circle id="scene2-mol-jia-no2-5" cx="210" cy="210" r="10" fill="#c62828" class="scene2-fade scene2-hidden"/>
            
            <!-- 甲容器内分子：N₂O₄ (蓝色) -->
            <circle id="scene2-mol-jia-n2o4-1" cx="190" cy="185" r="10" fill="#1565c0" class="scene2-fade scene2-hidden"/>
            <circle id="scene2-mol-jia-n2o4-2" cx="220" cy="190" r="10" fill="#1565c0" class="scene2-fade scene2-hidden"/>
            <circle id="scene2-mol-jia-n2o4-3" cx="200" cy="220" r="10" fill="#1565c0" class="scene2-fade scene2-hidden"/>
            
            <!-- 丙容器内分子：N₂O₄ (蓝色) -->
            <circle id="scene2-mol-bing-n2o4-1" cx="570" cy="170" r="10" fill="#1565c0" class="scene2-fade scene2-hidden"/>
            <circle id="scene2-mol-bing-n2o4-2" cx="600" cy="160" r="10" fill="#1565c0" class="scene2-fade scene2-hidden"/>
            <circle id="scene2-mol-bing-n2o4-3" cx="630" cy="175" r="10" fill="#1565c0" class="scene2-fade scene2-hidden"/>
            
            <!-- 丙容器内分子：NO₂ (红色) -->
            <circle id="scene2-mol-bing-no2-1" cx="580" cy="200" r="10" fill="#c62828" class="scene2-fade scene2-hidden"/>
            <circle id="scene2-mol-bing-no2-2" cx="610" cy="210" r="10" fill="#c62828" class="scene2-fade scene2-hidden"/>
            <circle id="scene2-mol-bing-no2-3" cx="620" cy="185" r="10" fill="#c62828" class="scene2-fade scene2-hidden"/>
            <circle id="scene2-mol-bing-no2-4" cx="590" cy="220" r="10" fill="#c62828" class="scene2-fade scene2-hidden"/>
            <circle id="scene2-mol-bing-no2-5" cx="640" cy="200" r="10" fill="#c62828" class="scene2-fade scene2-hidden"/>
            
            <!-- 甲反应箭头 (向右) -->
            <g id="scene2-arrow-jia" class="scene2-fade scene2-hidden">
                <line x1="150" y1="250" x2="250" y2="250" stroke="#888888" stroke-width="3"/>
                <polygon points="250,245 260,250 250,255" fill="#888888"/>
            </g>
            
            <!-- 丙反应箭头 (向左) -->
            <g id="scene2-arrow-bing" class="scene2-fade scene2-hidden">
                <line x1="550" y1="250" x2="650" y2="250" stroke="#888888" stroke-width="3"/>
                <polygon points="550,245 540,250 550,255" fill="#888888"/>
            </g>
            
            <!-- 平衡浓度标注 -->
            <text id="scene2-conc-jia" x="200" y="360" text-anchor="middle" font-size="14" fill="#000" class="scene2-fade scene2-hidden">c(NO₂) 甲</text>
            <text id="scene2-conc-bing" x="600" y="360" text-anchor="middle" font-size="14" fill="#000" class="scene2-fade scene2-hidden"/>
            
            <!-- 等号 -->
            <text id="scene2-eq-sign" x="400" y="360" text-anchor="middle" font-size="24" fill="#2e7d32" font-weight="bold" class="scene2-fade scene2-hidden">=</text>
            
            <!-- 结论文本 -->
            <text id="scene2-conclusion" x="400" y="420" text-anchor="middle" font-size="16" fill="#2e7d32" font-weight="bold" class="scene2-fade scene2-hidden">甲 = 丙 等效平衡</text>
        </svg>
        
        <div id="scene2-controls">
            <button id="scene2-btn-prev" class="scene2-btn" disabled>◀ 上一步</button>
            <span id="scene2-step-indicator">步骤 0/4</span>
            <button id="scene2-btn-next" class="scene2-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2: 甲丙等效平衡关系
        // 布局坐标表参考：
        // | 元素 | 类型 | 位置/范围 | 大小 | 备注 |
        // |------|------|-----------|------|------|
        // | 甲容器 | 矩形 | (100,100)-(300,300) | 200×200 | #e3f2fd 填充 15% 透明 |
        // | 丙容器 | 矩形 | (500,100)-(700,300) | 200×200 | #e3f2fd 填充 15% 透明 |
        // | 甲标签 | text | (200,325) | - | 容器正下方居中 |
        // | 丙标签 | text | (600,325) | - | 容器正下方居中 |
        // | 甲初始物质 | text | (200,75) | - | "0.2 mol NO₂" |
        // | 丙初始物质 | text | (600,75) | - | "0.1 mol N₂O₄" |
        // | 等效箭头 | 双向箭头 | (320,200)-(480,200) | - | 连接甲丙 |
        // | 等效标识 | text | (400,180) | - | "等效平衡" 绿色 |
        // | 控件栏 | 按钮组 | 底部居中 | - | 上一步/下一步按钮 |
        
        let currentStep = 0;
        const totalSteps = 4;
        
        // 每步需要显示的元素 ID 列表
        const stepElements = {
            0: [], // 初始状态：只有容器和标签（已默认显示）
            1: ['scene2-mol-jia-no2-1', 'scene2-mol-jia-no2-2', 'scene2-mol-jia-no2-3', 
                'scene2-mol-jia-no2-4', 'scene2-mol-jia-no2-5', 'scene2-mol-jia-n2o4-1',
                'scene2-mol-jia-n2o4-2', 'scene2-mol-jia-n2o4-3', 'scene2-arrow-jia'],
            2: ['scene2-mol-bing-n2o4-1', 'scene2-mol-bing-n2o4-2', 'scene2-mol-bing-n2o4-3',
                'scene2-mol-bing-no2-1', 'scene2-mol-bing-no2-2', 'scene2-mol-bing-no2-3',
                'scene2-mol-bing-no2-4', 'scene2-mol-bing-no2-5', 'scene2-arrow-bing'],
            3: ['scene2-conc-jia', 'scene2-conc-bing', 'scene2-eq-sign'],
            4: ['scene2-conclusion']
        };
        
        // 辅助函数：显示元素
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene2-hidden');
                el.classList.add('scene2-visible');
            }
        }
        
        // 辅助函数：隐藏元素
        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene2-visible');
                el.classList.add('scene2-hidden');
            }
        }
        
        // 更新步骤显示
        function updateStep() {
            // 隐藏所有可切换元素
            for (let step = 1; step <= totalSteps; step++) {
                stepElements[step].forEach(id => hideElement(id));
            }
            
            // 显示当前步骤及之前步骤的元素
            for (let step = 1; step <= currentStep; step++) {
                stepElements[step].forEach(id => showElement(id));
            }
            
            // 更新步骤指示器
            document.getElementById('scene2-step-indicator').textContent = `步骤 ${currentStep}/${totalSteps}`;
            
            // 更新按钮状态
            document.getElementById('scene2-btn-prev').disabled = currentStep === 0;
            document.getElementById('scene2-btn-next').disabled = currentStep === totalSteps;
        }
        
        // 上一步
        function prevStep() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        }
        
        // 下一步
        function nextStep() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateStep();
            }
        }
        
        // 绑定事件
        document.getElementById('scene2-btn-prev').addEventListener('click', prevStep);
        document.getElementById('scene2-btn-next').addEventListener('click', nextStep);
        
        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
