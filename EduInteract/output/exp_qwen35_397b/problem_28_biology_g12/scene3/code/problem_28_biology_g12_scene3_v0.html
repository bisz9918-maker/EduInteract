<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第 (6)(7) 问：基因自由组合分析</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #scene3-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene3-svg {
            width: 800px;
            height: 500px;
        }
        .scene3-fade-in {
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .scene3-visible {
            opacity: 1;
        }
        .scene3-btn {
            padding: 6px 12px;
            font-size: 13px;
            cursor: pointer;
            border: 1px solid #333;
            border-radius: 4px;
            background: #f5f5f5;
        }
        .scene3-btn:hover:not(:disabled) {
            background: #e0e0e0;
        }
        .scene3-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .scene3-btn-primary {
            background: #1565c0;
            color: white;
            border-color: #1565c0;
        }
        .scene3-btn-primary:hover:not(:disabled) {
            background: #0d47a1;
        }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg id="scene3-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <text id="scene3-title" x="400" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">第 (6)(7) 问：基因自由组合分析</text>
            <text id="scene3-sex-title" x="150" y="55" font-size="14" font-weight="bold" fill="#1565c0">第 (6) 问：伴 X 遗传</text>
            <rect id="scene3-sex-parent-male-rect" x="50" y="75" width="60" height="40" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
            <text id="scene3-sex-parent-male-label" x="80" y="95" text-anchor="middle" font-size="12" fill="#1565c0">X^bY</text>
            <text id="scene3-sex-parent-male-phenotype" x="80" y="110" text-anchor="middle" font-size="10" fill="#666">白毛♂</text>
            <rect id="scene3-sex-parent-female-rect" x="200" y="75" width="60" height="40" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
            <text id="scene3-sex-parent-female-label" x="230" y="95" text-anchor="middle" font-size="12" fill="#2e7d32">X^BX^B</text>
            <text id="scene3-sex-parent-female-phenotype" x="230" y="110" text-anchor="middle" font-size="10" fill="#666">黑毛♀</text>
            <line id="scene3-sex-arrow" x1="115" y1="95" x2="195" y2="95" stroke="#333" stroke-width="2" marker-end="url(#scene3-arrowhead)"/>
            <defs>
                <marker id="scene3-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#333"/>
                </marker>
            </defs>
            <rect id="scene3-sex-offspring-f-rect" x="280" y="65" width="70" height="40" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
            <text id="scene3-sex-offspring-f-label" x="315" y="85" text-anchor="middle" font-size="12" fill="#1565c0">X^BX^b</text>
            <text id="scene3-sex-offspring-f-phenotype" x="315" y="100" text-anchor="middle" font-size="10" fill="#666">白毛♀</text>
            <rect id="scene3-sex-offspring-m-rect" x="280" y="125" width="70" height="40" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
            <text id="scene3-sex-offspring-m-label" x="315" y="145" text-anchor="middle" font-size="12" fill="#2e7d32">X^BY</text>
            <text id="scene3-sex-offspring-m-phenotype" x="315" y="160" text-anchor="middle" font-size="10" fill="#666">黑毛♂</text>
            <text id="scene3-sex-offspring-f-tag" x="360" y="88" font-size="11" fill="#333">X^BX^b 白毛♀</text>
            <text id="scene3-sex-offspring-m-tag" x="360" y="148" font-size="11" fill="#333">X^BY 黑毛♂</text>
            <text id="scene3-sex-conclusion" x="480" y="105" font-size="12" fill="#1565c0" font-weight="bold">白毛基因位于 X 染色体</text>
            <line id="scene3-separator" x1="50" y1="175" x2="750" y2="175" stroke="#999" stroke-width="2" stroke-dasharray="5,5"/>
            <text id="scene3-punnett-title" x="250" y="200" font-size="14" font-weight="bold" fill="#333">第 (7) 问：自由组合棋盘格</text>
            <rect id="scene3-punnett-grid" x="100" y="220" width="560" height="200" fill="none" stroke="#333" stroke-width="2"/>
            <line id="scene3-punnett-v1" x1="240" y1="220" x2="240" y2="420" stroke="#333" stroke-width="1"/>
            <line id="scene3-punnett-v2" x1="380" y1="220" x2="380" y2="420" stroke="#333" stroke-width="1"/>
            <line id="scene3-punnett-v3" x1="520" y1="220" x2="520" y2="420" stroke="#333" stroke-width="1"/>
            <line id="scene3-punnett-h1" x1="100" y1="270" x2="660" y2="270" stroke="#333" stroke-width="1"/>
            <line id="scene3-punnett-h2" x1="100" y1="320" x2="660" y2="320" stroke="#333" stroke-width="1"/>
            <line id="scene3-punnett-h3" x1="100" y1="370" x2="660" y2="370" stroke="#333" stroke-width="1"/>
            <text id="scene3-punnett-row-label-1" x="170" y="245" text-anchor="middle" font-size="12" fill="#2e7d32">AC</text>
            <text id="scene3-punnett-row-label-2" x="310" y="245" text-anchor="middle" font-size="12" fill="#2e7d32">Ac</text>
            <text id="scene3-punnett-row-label-3" x="450" y="245" text-anchor="middle" font-size="12" fill="#c62828">aC</text>
            <text id="scene3-punnett-row-label-4" x="590" y="245" text-anchor="middle" font-size="12" fill="#c62828">ac</text>
            <text id="scene3-punnett-col-label-1" x="75" y="298" text-anchor="middle" font-size="12" fill="#2e7d32">AC</text>
            <text id="scene3-punnett-col-label-2" x="75" y="348" text-anchor="middle" font-size="12" fill="#2e7d32">Ac</text>
            <text id="scene3-punnett-col-label-3" x="75" y="398" text-anchor="middle" font-size="12" fill="#c62828">aC</text>
            <text id="scene3-punnett-col-label-4" x="75" y="448" text-anchor="middle" font-size="12" fill="#c62828">ac</text>
            <text id="scene3-punnett-cell-r1c1" x="170" y="298" text-anchor="middle" font-size="11" fill="#333" class="scene3-fade-in">AACC</text>
            <text id="scene3-punnett-cell-r1c2" x="310" y="298" text-anchor="middle" font-size="11" fill="#333" class="scene3-fade-in">AACc</text>
            <text id="scene3-punnett-cell-r1c3" x="450" y="298" text-anchor="middle" font-size="11" fill="#333" class="scene3-fade-in">AaCC</text>
            <text id="scene3-punnett-cell-r1c4" x="590" y="298" text-anchor="middle" font-size="11" fill="#333" class="scene3-fade-in">AaCc</text>
            <text id="scene3-punnett-cell-r2c1" x="170" y="348" text-anchor="middle" font-size="11" fill="#333" class="scene3-fade-in">AACc</text>
            <text id="scene3-punnett-cell-r2c2" x="310" y="348" text-anchor="middle" font-size="11" fill="#333" class="scene3-fade-in">AAcc</text>
            <text id="scene3-punnett-cell-r2c3" x="450" y="348" text-anchor="middle" font-size="11" fill="#333" class="scene3-fade-in">AaCc</text>
            <text id="scene3-punnett-cell-r2c4" x="590" y="348" text-anchor="middle" font-size="11" fill="#333" class="scene3-fade-in">Aacc</text>
            <text id="scene3-punnett-cell-r3c1" x="170" y="398" text-anchor="middle" font-size="11" fill="#333" class="scene3-fade-in">AaCC</text>
            <text id="scene3-punnett-cell-r3c2" x="310" y="398" text-anchor="middle" font-size="11" fill="#333" class="scene3-fade-in">AaCc</text>
            <text id="scene3-punnett-cell-r3c3" x="450" y="398" text-anchor="middle" font-size="11" fill="#333" class="scene3-fade-in">aaCC</text>
            <text id="scene3-punnett-cell-r3c4" x="590" y="398" text-anchor="middle" font-size="11" fill="#333" class="scene3-fade-in">aaCc</text>
            <text id="scene3-punnett-cell-r4c1" x="170" y="448" text-anchor="middle" font-size="11" fill="#333" class="scene3-fade-in">AaCc</text>
            <text id="scene3-punnett-cell-r4c2" x="310" y="448" text-anchor="middle" font-size="11" fill="#333" class="scene3-fade-in">Aacc</text>
            <text id="scene3-punnett-cell-r4c3" x="450" y="448" text-anchor="middle" font-size="11" fill="#333" class="scene3-fade-in">aaCc</text>
            <text id="scene3-punnett-cell-r4c4" x="590" y="448" text-anchor="middle" font-size="11" fill="#333" class="scene3-fade-in">aacc</text>
            <text id="scene3-phenotype-summary" x="400" y="478" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" class="scene3-fade-in">表型比例：直毛有毛 : 直毛无毛 : 卷毛有毛 : 卷毛无毛 = 9 : 3 : 3 : 1</text>
            <g id="scene3-controls">
                <rect id="scene3-controls-bg" x="620" y="455" width="170" height="35" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="4"/>
                <text id="scene3-controls-label" x="635" y="477" font-size="11" fill="#666">步骤:</text>
                <button id="scene3-btn-prev" class="scene3-btn" disabled>◀ 上一步</button>
                <button id="scene3-btn-next" class="scene3-btn scene3-btn-primary">下一步 ▶</button>
            </g>
        </svg>
    </div>
    <script>
    (function() {
        let currentState = 0;
        const totalStates = 4;
        const btnPrev = document.getElementById('scene3-btn-prev');
        const btnNext = document.getElementById('scene3-btn-next');
        const sexElements = ['scene3-sex-title','scene3-sex-parent-male-rect','scene3-sex-parent-male-label','scene3-sex-parent-male-phenotype','scene3-sex-parent-female-rect','scene3-sex-parent-female-label','scene3-sex-parent-female-phenotype','scene3-sex-arrow','scene3-sex-offspring-f-rect','scene3-sex-offspring-f-label','scene3-sex-offspring-f-phenotype','scene3-sex-offspring-m-rect','scene3-sex-offspring-m-label','scene3-sex-offspring-m-phenotype','scene3-sex-offspring-f-tag','scene3-sex-offspring-m-tag','scene3-sex-conclusion'];
        const punnettFrameElements = ['scene3-separator','scene3-punnett-title','scene3-punnett-grid','scene3-punnett-v1','scene3-punnett-v2','scene3-punnett-v3','scene3-punnett-h1','scene3-punnett-h2','scene3-punnett-h3','scene3-punnett-row-label-1','scene3-punnett-row-label-2','scene3-punnett-row-label-3','scene3-punnett-row-label-4','scene3-punnett-col-label-1','scene3-punnett-col-label-2','scene3-punnett-col-label-3','scene3-punnett-col-label-4'];
        const punnettCellElements = [];
        for (let r = 1; r <= 4; r++) { for (let c = 1; c <= 4; c++) { punnettCellElements.push('scene3-punnett-cell-r'+r+'c'+c); } }
        const phenotypeElements = ['scene3-phenotype-summary'];
        function showElement(id) { const el = document.getElementById(id); if (el) { el.style.display = 'block'; el.style.opacity = '1'; if (el.classList.contains('scene3-fade-in')) { el.classList.add('scene3-visible'); } } }
        function hideElement(id) { const el = document.getElementById(id); if (el) { el.style.display = 'none'; el.style.opacity = '0'; el.classList.remove('scene3-visible'); } }
        function updateButtons() { btnPrev.disabled = (currentState === 0); btnNext.textContent = (currentState === totalStates - 1) ? '重新开始' : '下一步 ▶'; }
        function updateDisplay() {
            if (currentState === 0) { sexElements.forEach(id => showElement(id)); punnettFrameElements.forEach(id => hideElement(id)); punnettCellElements.forEach(id => hideElement(id)); phenotypeElements.forEach(id => hideElement(id)); }
            else if (currentState === 1) { sexElements.forEach(id => showElement(id)); punnettFrameElements.forEach(id => showElement(id)); punnettCellElements.forEach(id => hideElement(id)); phenotypeElements.forEach(id => hideElement(id)); }
            else if (currentState === 2) { sexElements.forEach(id => showElement(id)); punnettFrameElements.forEach(id => showElement(id)); punnettCellElements.forEach(id => showElement(id)); phenotypeElements.forEach(id => hideElement(id)); }
            else if (currentState === 3) { sexElements.forEach(id => showElement(id)); punnettFrameElements.forEach(id => showElement(id)); punnettCellElements.forEach(id => showElement(id)); phenotypeElements.forEach(id => showElement(id)); }
            updateButtons();
        }
        btnPrev.addEventListener('click', function() { if (currentState > 0) { currentState--; updateDisplay(); } });
        btnNext.addEventListener('click', function() { if (currentState < totalStates - 1) { currentState++; updateDisplay(); } else { currentState = 0; updateDisplay(); } });
        updateDisplay();
    })();
    </script>
</body>
</html>
