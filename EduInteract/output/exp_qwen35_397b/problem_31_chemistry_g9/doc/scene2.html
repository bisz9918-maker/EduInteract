<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>面心立方晶体结构 - 配位数演示</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #scene2-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene2-svg {
            width: 800px;
            height: 500px;
        }
        #scene2-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 12px;
            z-index: 10;
        }
        .scene2-btn {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border: 2px solid #1565c0;
            border-radius: 6px;
            background: #ffffff;
            color: #1565c0;
            transition: all 0.2s;
        }
        .scene2-btn:hover:not(:disabled) {
            background: #1565c0;
            color: #ffffff;
        }
        .scene2-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .scene2-step-indicator {
            font-size: 14px;
            color: #333;
            align-self: center;
            min-width: 80px;
            text-align: center;
        }
        /* 元素显隐控制 */
        .scene2-hidden {
            display: none;
            opacity: 0;
        }
        .scene2-visible {
            display: block;
            opacity: 1;
        }
        /* 淡入动画 */
        .scene2-fade-in {
            animation: scene2FadeIn 0.3s ease-in;
        }
        @keyframes scene2FadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义箭头和标记 -->
            <defs>
                <marker id="scene2-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#1565c0" />
                </marker>
            </defs>

            <!-- 立方体框架 -->
            <!-- 后方面（先绘制，被前方面遮挡） -->
            <rect id="scene2-cube-back" x="350" y="100" width="200" height="200" 
                  fill="none" stroke="#000000" stroke-width="2" opacity="0.6"/>
            
            <!-- 连接棱线（深度方向） -->
            <line id="scene2-edge-1" x1="300" y1="150" x2="350" y2="100" stroke="#000000" stroke-width="2"/>
            <line id="scene2-edge-2" x1="500" y1="150" x2="550" y2="100" stroke="#000000" stroke-width="2"/>
            <line id="scene2-edge-3" x1="300" y1="350" x2="350" y2="300" stroke="#000000" stroke-width="2"/>
            <line id="scene2-edge-4" x1="500" y1="350" x2="550" y2="300" stroke="#000000" stroke-width="2"/>

            <!-- 前方面 -->
            <rect id="scene2-cube-front" x="300" y="150" width="200" height="200" 
                  fill="none" stroke="#000000" stroke-width="2"/>

            <!-- 顶点原子 (8个) -->
            <!-- 前方面4个顶点 -->
            <circle id="scene2-atom-vertex-1" cx="300" cy="150" r="8" fill="#1565c0"/>
            <circle id="scene2-atom-vertex-2" cx="500" cy="150" r="8" fill="#1565c0"/>
            <circle id="scene2-atom-vertex-3" cx="300" cy="350" r="8" fill="#1565c0"/>
            <circle id="scene2-atom-vertex-4" cx="500" cy="350" r="8" fill="#1565c0"/>
            <!-- 后方面4个顶点 -->
            <circle id="scene2-atom-vertex-5" cx="350" cy="100" r="8" fill="#1565c0"/>
            <circle id="scene2-atom-vertex-6" cx="550" cy="100" r="8" fill="#1565c0"/>
            <circle id="scene2-atom-vertex-7" cx="350" cy="300" r="8" fill="#1565c0"/>
            <circle id="scene2-atom-vertex-8" cx="550" cy="300" r="8" fill="#1565c0"/>

            <!-- 面心原子 (6个) -->
            <!-- 前面中心 -->
            <circle id="scene2-atom-face-1" cx="400" cy="250" r="8" fill="#1565c0"/>
            <!-- 后面中心 -->
            <circle id="scene2-atom-face-2" cx="450" cy="200" r="8" fill="#1565c0"/>
            <!-- 左面中心 -->
            <circle id="scene2-atom-face-3" cx="325" cy="200" r="8" fill="#1565c0"/>
            <!-- 右面中心 (高亮目标) -->
            <circle id="scene2-atom-face-4" cx="525" cy="300" r="8" fill="#1565c0"/>
            <!-- 顶面中心 -->
            <circle id="scene2-atom-face-5" cx="425" cy="125" r="8" fill="#1565c0"/>
            <!-- 底面中心 -->
            <circle id="scene2-atom-face-6" cx="425" cy="325" r="8" fill="#1565c0"/>

            <!-- 高亮面心原子（初始隐藏，步骤1显示） -->
            <circle id="scene2-highlight-atom" cx="525" cy="300" r="10" 
                    fill="#c62828" class="scene2-hidden"/>

            <!-- 12个最近邻连接线（初始隐藏，步骤2显示） -->
            <g id="scene2-connections" class="scene2-hidden">
                <!-- 同一右侧面的4个顶点 -->
                <line x1="525" y1="300" x2="500" y2="350" stroke="#1565c0" stroke-width="1.5"/>
                <line x1="525" y1="300" x2="550" y2="300" stroke="#1565c0" stroke-width="1.5"/>
                <line x1="525" y1="300" x2="550" y2="100" stroke="#1565c0" stroke-width="1.5"/>
                <line x1="525" y1="300" x2="500" y2="150" stroke="#1565c0" stroke-width="1.5"/>
                <!-- 相邻面的面心原子 (8个) -->
                <!-- 前面面心 -->
                <line x1="525" y1="300" x2="400" y2="250" stroke="#1565c0" stroke-width="1.5"/>
                <!-- 后面面心 -->
                <line x1="525" y1="300" x2="450" y2="200" stroke="#1565c0" stroke-width="1.5"/>
                <!-- 顶面面心 -->
                <line x1="525" y1="300" x2="425" y2="125" stroke="#1565c0" stroke-width="1.5"/>
                <!-- 底面面心 -->
                <line x1="525" y1="300" x2="425" y2="325" stroke="#1565c0" stroke-width="1.5"/>
                <!-- 相邻晶胞的面心原子（4个，用虚线表示在晶胞外） -->
                <line x1="525" y1="300" x2="625" y2="300" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="4,2"/>
                <line x1="525" y1="300" x2="525" y2="400" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="4,2"/>
                <line x1="525" y1="300" x2="525" y2="200" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="4,2"/>
                <line x1="525" y1="300" x2="625" y2="200" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="4,2"/>
            </g>

            <!-- 面对角线（初始隐藏，步骤3显示） -->
            <g id="scene2-diagonals" class="scene2-hidden">
                <line x1="500" y1="150" x2="550" y2="300" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5,3"/>
                <line x1="500" y1="350" x2="550" y2="100" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5,3"/>
            </g>

            <!-- 标签 -->
            <!-- 边长a₂标签 -->
            <text id="scene2-label-a2" x="400" y="370" font-size="14" fill="#000000" text-anchor="middle">边长 $a_2$</text>
            
            <!-- 配位数标签（初始隐藏） -->
            <text id="scene2-label-coordination" x="620" y="180" font-size="16" fill="#c62828" font-weight="bold" class="scene2-hidden">配位数 = 12</text>
            
            <!-- 最近邻距离d标签（初始隐藏） -->
            <text id="scene2-label-d" x="580" y="250" font-size="13" fill="#2e7d32" class="scene2-hidden">$d = \frac{\sqrt{2}}{2}a_2$</text>

            <!-- 面对角线标签（初始隐藏） -->
            <text id="scene2-label-diagonal" x="530" y="180" font-size="12" fill="#2e7d32" class="scene2-hidden">面对角线</text>
        </svg>

        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-btn-prev" class="scene2-btn" disabled>◀ 上一步</button>
            <span id="scene2-step-indicator" class="scene2-step-indicator">步骤 0/3</span>
            <button id="scene2-btn-next" class="scene2-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2: 面心立方晶体结构 - 配位数演示
        
        // 状态管理
        let currentState = 0;
        const totalSteps = 3;

        // DOM 元素引用
        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        const stepIndicator = document.getElementById('scene2-step-indicator');
        
        // 需要控制的元素
        const highlightAtom = document.getElementById('scene2-highlight-atom');
        const connections = document.getElementById('scene2-connections');
        const diagonals = document.getElementById('scene2-diagonals');
        const labelCoordination = document.getElementById('scene2-label-coordination');
        const labelD = document.getElementById('scene2-label-d');
        const labelDiagonal = document.getElementById('scene2-label-diagonal');

        // 工具函数：显示元素
        function show(el) {
            el.classList.remove('scene2-hidden');
            el.classList.add('scene2-visible', 'scene2-fade-in');
        }

        // 工具函数：隐藏元素
        function hide(el) {
            el.classList.remove('scene2-visible', 'scene2-fade-in');
            el.classList.add('scene2-hidden');
        }

        // 更新界面状态
        function updateState() {
            // 更新步骤指示器
            stepIndicator.textContent = `步骤 ${currentState}/${totalSteps}`;
            
            // 更新按钮状态
            btnPrev.disabled = (currentState === 0);
            btnNext.disabled = (currentState === totalSteps);
            btnNext.textContent = (currentState === totalSteps) ? '完成' : '下一步 ▶';

            // 根据当前状态显示/隐藏元素
            // 步骤0：基础晶胞结构（所有元素默认显示，除了高亮和标注）
            
            // 步骤1：高亮面心原子
            if (currentState >= 1) {
                show(highlightAtom);
            } else {
                hide(highlightAtom);
            }

            // 步骤2：显示12个最近邻连接线和配位数标签
            if (currentState >= 2) {
                show(connections);
                show(labelCoordination);
            } else {
                hide(connections);
                hide(labelCoordination);
            }

            // 步骤3：显示面对角线和距离公式
            if (currentState >= 3) {
                show(diagonals);
                show(labelD);
                show(labelDiagonal);
            } else {
                hide(diagonals);
                hide(labelD);
                hide(labelDiagonal);
            }

            // 触发 MathJax 重新渲染
            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }

        // 事件处理：上一步
        btnPrev.addEventListener('click', function() {
            if (currentState > 0) {
                currentState--;
                updateState();
            }
        });

        // 事件处理：下一步
        btnNext.addEventListener('click', function() {
            if (currentState < totalSteps) {
                currentState++;
                updateState();
            }
        });

        // 初始化
        updateState();

    })();
    </script>
</body>
</html>
