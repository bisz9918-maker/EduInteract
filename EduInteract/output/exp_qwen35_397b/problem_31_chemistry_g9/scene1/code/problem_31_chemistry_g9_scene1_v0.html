<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>体心立方 (BCC) 结构</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        .scene1-atom {
            transition: opacity 300ms ease;
        }
        .scene1-connector {
            transition: opacity 300ms ease;
        }
        .scene1-label {
            transition: opacity 300ms ease;
        }
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }
        #scene1-btn-prev, #scene1-btn-next {
            padding: 8px 16px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            background: #1565c0;
            color: white;
            cursor: pointer;
        }
        #scene1-btn-prev:disabled, #scene1-btn-next:disabled {
            background: #bdbdbd;
            cursor: not-allowed;
        }
        #scene1-step-indicator {
            font-size: 14px;
            color: #333;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <!-- 标题 -->
            <text id="scene1-title" x="400" y="40" text-anchor="middle" font-size="16" fill="#000000">体心立方 (BCC) 结构</text>
            
            <!-- 立方体框架 - 后方面（虚线） -->
            <line id="scene1-cube-back-top" x1="300" y1="150" x2="500" y2="150" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.6"/>
            <line id="scene1-cube-back-right" x1="500" y1="150" x2="500" y2="350" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.6"/>
            <line id="scene1-cube-back-bottom" x1="500" y1="350" x2="300" y2="350" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.6"/>
            <line id="scene1-cube-back-left" x1="300" y1="350" x2="300" y2="150" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.6"/>
            
            <!-- 立方体框架 - 连接棱 -->
            <line id="scene1-cube-connect-tl" x1="250" y1="180" x2="300" y2="150" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.6"/>
            <line id="scene1-cube-connect-tr" x1="450" y1="180" x2="500" y2="150" stroke="#000000" stroke-width="1.5"/>
            <line id="scene1-cube-connect-bl" x1="250" y1="380" x2="300" y2="350" stroke="#000000" stroke-width="1.5"/>
            <line id="scene1-cube-connect-br" x1="450" y1="380" x2="500" y2="350" stroke="#000000" stroke-width="1.5"/>
            
            <!-- 立方体框架 - 前方面（实线） -->
            <line id="scene1-cube-front-top" x1="250" y1="180" x2="450" y2="180" stroke="#000000" stroke-width="1.5"/>
            <line id="scene1-cube-front-right" x1="450" y1="180" x2="450" y2="380" stroke="#000000" stroke-width="1.5"/>
            <line id="scene1-cube-front-bottom" x1="450" y1="380" x2="250" y2="380" stroke="#000000" stroke-width="1.5"/>
            <line id="scene1-cube-front-left" x1="250" y1="380" x2="250" y2="180" stroke="#000000" stroke-width="1.5"/>
            
            <!-- 顶点原子 (8 个) -->
            <circle id="scene1-atom-vertex-1" class="scene1-atom" cx="250" cy="180" r="8" fill="#1565c0"/>
            <circle id="scene1-atom-vertex-2" class="scene1-atom" cx="450" cy="180" r="8" fill="#1565c0"/>
            <circle id="scene1-atom-vertex-3" class="scene1-atom" cx="250" cy="380" r="8" fill="#1565c0"/>
            <circle id="scene1-atom-vertex-4" class="scene1-atom" cx="450" cy="380" r="8" fill="#1565c0"/>
            <circle id="scene1-atom-vertex-5" class="scene1-atom" cx="300" cy="150" r="8" fill="#1565c0"/>
            <circle id="scene1-atom-vertex-6" class="scene1-atom" cx="500" cy="150" r="8" fill="#1565c0"/>
            <circle id="scene1-atom-vertex-7" class="scene1-atom" cx="300" cy="350" r="8" fill="#1565c0"/>
            <circle id="scene1-atom-vertex-8" class="scene1-atom" cx="500" cy="350" r="8" fill="#1565c0"/>
            
            <!-- 体心原子 -->
            <circle id="scene1-atom-center" class="scene1-atom" cx="375" cy="280" r="10" fill="#c62828" opacity="0"/>
            
            <!-- 体心 - 顶点连线 (8 条) -->
            <line id="scene1-connector-1" class="scene1-connector" x1="375" y1="280" x2="250" y2="180" stroke="#1565c0" stroke-width="1" opacity="0"/>
            <line id="scene1-connector-2" class="scene1-connector" x1="375" y1="280" x2="450" y2="180" stroke="#1565c0" stroke-width="1" opacity="0"/>
            <line id="scene1-connector-3" class="scene1-connector" x1="375" y1="280" x2="250" y2="380" stroke="#1565c0" stroke-width="1" opacity="0"/>
            <line id="scene1-connector-4" class="scene1-connector" x1="375" y1="280" x2="450" y2="380" stroke="#1565c0" stroke-width="1" opacity="0"/>
            <line id="scene1-connector-5" class="scene1-connector" x1="375" y1="280" x2="300" y2="150" stroke="#1565c0" stroke-width="1" opacity="0"/>
            <line id="scene1-connector-6" class="scene1-connector" x1="375" y1="280" x2="500" y2="150" stroke="#1565c0" stroke-width="1" opacity="0"/>
            <line id="scene1-connector-7" class="scene1-connector" x1="375" y1="280" x2="300" y2="350" stroke="#1565c0" stroke-width="1" opacity="0"/>
            <line id="scene1-connector-8" class="scene1-connector" x1="375" y1="280" x2="500" y2="350" stroke="#1565c0" stroke-width="1" opacity="0"/>
            
            <!-- 体对角线 -->
            <line id="scene1-diagonal" class="scene1-label" x1="250" y1="380" x2="500" y2="150" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5,5" opacity="0"/>
            
            <!-- 边长 a₁ 标签 -->
            <text id="scene1-label-a1" x="350" y="415" text-anchor="middle" font-size="14" fill="#000000">a₁</text>
            
            <!-- 最近邻距离 d 标签 -->
            <text id="scene1-label-d" class="scene1-label" x="480" y="260" font-size="14" fill="#2e7d32" opacity="0">d = $\frac{\sqrt{3}}{2}$a₁</text>
            
            <!-- 配位数标签 -->
            <text id="scene1-label-coordination-1" class="scene1-label" x="550" y="270" font-size="14" fill="#000000" opacity="0">配位数</text>
            <text id="scene1-label-coordination-2" class="scene1-label" x="550" y="295" font-size="16" fill="#000000" opacity="0" font-weight="bold">= 8</text>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/4</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现 - 体心立方 (BCC) 结构
        
        // 状态管理
        let currentState = 0;
        const totalSteps = 4;
        
        // DOM 元素引用
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        
        // 各步骤需要显示的元素
        const steps = {
            0: {
                show: ['scene1-title', 'scene1-cube-front-top', 'scene1-cube-front-right', 
                       'scene1-cube-front-bottom', 'scene1-cube-front-left',
                       'scene1-cube-back-top', 'scene1-cube-back-right',
                       'scene1-cube-back-bottom', 'scene1-cube-back-left',
                       'scene1-cube-connect-tl', 'scene1-cube-connect-tr',
                       'scene1-cube-connect-bl', 'scene1-cube-connect-br',
                       'scene1-atom-vertex-1', 'scene1-atom-vertex-2',
                       'scene1-atom-vertex-3', 'scene1-atom-vertex-4',
                       'scene1-atom-vertex-5', 'scene1-atom-vertex-6',
                       'scene1-atom-vertex-7', 'scene1-atom-vertex-8',
                       'scene1-label-a1'],
                hide: ['scene1-atom-center', 'scene1-connector-1', 'scene1-connector-2',
                       'scene1-connector-3', 'scene1-connector-4', 'scene1-connector-5',
                       'scene1-connector-6', 'scene1-connector-7', 'scene1-connector-8',
                       'scene1-diagonal', 'scene1-label-d', 'scene1-label-coordination-1',
                       'scene1-label-coordination-2']
            },
            1: {
                show: ['scene1-atom-center'],
                hide: []
            },
            2: {
                show: ['scene1-connector-1', 'scene1-connector-2', 'scene1-connector-3',
                       'scene1-connector-4', 'scene1-connector-5', 'scene1-connector-6',
                       'scene1-connector-7', 'scene1-connector-8',
                       'scene1-label-coordination-1', 'scene1-label-coordination-2'],
                hide: []
            },
            3: {
                show: ['scene1-diagonal', 'scene1-label-d'],
                hide: []
            }
        };
        
        // 显示元素
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.opacity = '1';
                el.style.display = '';
            }
        }
        
        // 隐藏元素
        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.opacity = '0';
                if (id.startsWith('scene1-connector') || id === 'scene1-diagonal' || 
                    id === 'scene1-label-d' || id.startsWith('scene1-label-coordination')) {
                    el.style.display = '';
                }
            }
        }
        
        // 更新步骤显示
        function updateStep() {
            // 步骤 0 显示基础元素
            steps[0].show.forEach(id => showElement(id));
            steps[0].hide.forEach(id => hideElement(id));
            
            // 累积显示后续步骤的元素
            for (let i = 1; i <= currentState; i++) {
                steps[i].show.forEach(id => showElement(id));
            }
            
            // 更新按钮状态
            btnPrev.disabled = (currentState === 0);
            btnNext.disabled = (currentState === totalSteps - 1);
            
            // 更新步骤指示器
            stepIndicator.textContent = `步骤 ${currentState + 1}/${totalSteps}`;
            
            // 步骤 2 时，为连线添加延迟动画
            if (currentState === 2) {
                for (let i = 1; i <= 8; i++) {
                    const connector = document.getElementById(`scene1-connector-${i}`);
                    if (connector) {
                        setTimeout(() => {
                            connector.style.opacity = '1';
                        }, (i - 1) * 100);
                    }
                }
            }
        }
        
        // 按钮事件
        btnPrev.addEventListener('click', () => {
            if (currentState > 0) {
                currentState--;
                updateStep();
            }
        });
        
        btnNext.addEventListener('click', () => {
            if (currentState < totalSteps - 1) {
                currentState++;
                updateStep();
            }
        });
        
        // 初始化
        updateStep();
        
        // MathJax 渲染
        if (window.MathJax) {
            MathJax.typesetPromise();
        }
    })();
    </script>
</body>
</html>
