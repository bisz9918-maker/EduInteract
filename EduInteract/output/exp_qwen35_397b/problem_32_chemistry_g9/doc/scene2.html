<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分子运动速率对比与白烟形成位置</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene2-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene2-svg {
            width: 800px;
            height: 500px;
        }
        .scene2-molecule {
            transition: cx 0.1s linear, cy 0.1s linear;
        }
        .scene2-smoke {
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .scene2-smoke.visible {
            opacity: 1;
        }
        .scene2-track {
            stroke-dasharray: 5,5;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .scene2-track.visible {
            opacity: 1;
        }
        .scene2-meet-line {
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .scene2-meet-line.visible {
            opacity: 1;
        }
        .scene2-label-smoke, .scene2-label-distance {
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .scene2-label-smoke.visible, .scene2-label-distance.visible {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500">
            <!-- 水平导管 -->
            <rect id="scene2-duct" x="80" y="200" width="640" height="60" 
                  fill="#ffffff" stroke="#000000" stroke-width="2"/>
            
            <!-- A 端和 B 端标签 -->
            <text id="scene2-label-a" x="60" y="180" font-size="16" font-weight="bold" text-anchor="middle" fill="#000000">A</text>
            <text id="scene2-label-b" x="730" y="180" font-size="16" font-weight="bold" text-anchor="middle" fill="#000000">B</text>
            
            <!-- 分子质量标注 -->
            <text id="scene2-mass-hcl" x="100" y="145" font-size="12" text-anchor="middle" fill="#000000">HCl=36.5</text>
            <text id="scene2-mass-nh3" x="700" y="145" font-size="12" text-anchor="middle" fill="#000000">NH₃=17</text>
            
            <!-- 分子标签 -->
            <text id="scene2-label-hcl" x="100" y="165" font-size="14" text-anchor="middle" fill="#1565c0">HCl 分子</text>
            <text id="scene2-label-nh3" x="700" y="165" font-size="14" text-anchor="middle" fill="#2e7d32">NH₃分子</text>
            
            <!-- 运动轨迹（虚线箭头） -->
            <line id="scene2-track-hcl" x1="100" y1="230" x2="400" y2="230" 
                  stroke="#888888" stroke-width="2" class="scene2-track"/>
            <line id="scene2-track-nh3" x1="700" y1="230" x2="400" y2="230" 
                  stroke="#888888" stroke-width="2" class="scene2-track"/>
            
            <!-- HCl 分子组（蓝色，直径 8px） -->
            <g id="scene2-hcl-group">
                <circle class="scene2-molecule" cx="100" cy="225" r="4" fill="#1565c0"/>
                <circle class="scene2-molecule" cx="115" cy="230" r="4" fill="#1565c0"/>
                <circle class="scene2-molecule" cx="108" cy="238" r="4" fill="#1565c0"/>
                <circle class="scene2-molecule" cx="122" cy="222" r="4" fill="#1565c0"/>
            </g>
            
            <!-- NH₃分子组（绿色，直径 6px） -->
            <g id="scene2-nh3-group">
                <circle class="scene2-molecule" cx="700" cy="225" r="3" fill="#2e7d32"/>
                <circle class="scene2-molecule" cx="688" cy="230" r="3" fill="#2e7d32"/>
                <circle class="scene2-molecule" cx="695" cy="238" r="3" fill="#2e7d32"/>
                <circle class="scene2-molecule" cx="682" cy="222" r="3" fill="#2e7d32"/>
            </g>
            
            <!-- 白烟区域（云雾状椭圆组） -->
            <g id="scene2-smoke" class="scene2-smoke">
                <ellipse cx="380" cy="230" rx="30" ry="25" fill="#c62828" opacity="0.3"/>
                <ellipse cx="400" cy="225" rx="25" ry="30" fill="#c62828" opacity="0.3"/>
                <ellipse cx="420" cy="230" rx="30" ry="25" fill="#c62828" opacity="0.3"/>
                <ellipse cx="390" cy="245" rx="28" ry="22" fill="#c62828" opacity="0.3"/>
                <ellipse cx="410" cy="245" rx="28" ry="22" fill="#c62828" opacity="0.3"/>
            </g>
            
            <!-- 相遇点标记竖线 -->
            <line id="scene2-meet-line" x1="400" y1="190" x2="400" y2="270" 
                  stroke="#c62828" stroke-width="2" class="scene2-meet-line"/>
            
            <!-- 白烟和距离标注 -->
            <text id="scene2-label-smoke" x="400" y="285" font-size="14" text-anchor="middle" fill="#c62828" class="scene2-label-smoke">白烟</text>
            <text id="scene2-label-distance" x="240" y="285" font-size="14" text-anchor="middle" fill="#000000" class="scene2-label-distance">距 A 端近</text>
            
            <!-- 滑块说明 -->
            <text id="scene2-slider-desc" x="400" y="420" font-size="14" text-anchor="middle" fill="#000000">拖动滑块观察分子运动</text>
            
            <!-- 滑块轨道 -->
            <rect id="scene2-slider-track" x="200" y="440" width="400" height="20" fill="#cccccc" rx="10"/>
            
            <!-- 滑块刻度标签 -->
            <text id="scene2-label-0" x="200" y="470" font-size="14" text-anchor="middle" fill="#000000">0%</text>
            <text id="scene2-label-50" x="400" y="470" font-size="14" text-anchor="middle" fill="#000000">50%</text>
            <text id="scene2-label-100" x="600" y="470" font-size="14" text-anchor="middle" fill="#000000">100%</text>
            
            <!-- 滑块手柄 -->
            <circle id="scene2-slider-handle" cx="200" cy="450" r="12" fill="#1565c0" style="cursor: pointer;"/>
        </svg>
    </div>
    
    <script>
    (function() {
        // Scene 2: 分子运动速率对比与白烟形成位置
        
        // 布局坐标表（实现对照依据）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 备注 |
        // | 水平导管 | 矩形框 | (80,200)-(720,260) | 640×60 | 横贯画面中部 |
        // | A 端标签 | text | (60,180) | ~30×20 | 导管左端外侧 |
        // | B 端标签 | text | (730,180) | ~30×20 | 导管右端外侧 |
        // | HCl 分子(初始) | 圆点组 | (100,230) 附近 | 直径 8px | 左侧聚集，#1565c0 |
        // | NH₃分子(初始) | 圆点组 | (700,230) 附近 | 直径 6px | 右侧聚集，#2e7d32 |
        // | HCl 分子标签 | text | (100,165) | ~60×16 | 上方，蓝色 |
        // | NH₃分子标签 | text | (700,165) | ~60×16 | 上方，绿色 |
        // | 分子质量 HCl | text | (100,145) | ~80×14 | "HCl=36.5" |
        // | 分子质量 NH₃ | text | (700,145) | ~70×14 | "NH₃=17" |
        // | 运动轨迹-HCl | 虚线箭头 | (100,230)-(400,230) | 300×4 | #888888 虚线 |
        // | 运动轨迹-NH₃ | 虚线箭头 | (700,230)-(400,230) | 300×4 | #888888 虚线 |
        // | 白烟区域 | 云雾状 | (360,190)-(440,270) | 80×80 | #c62828 透明度 30% |
        // | 相遇点标记 | 竖线 | (400,190)-(400,270) | 2×80 | #c62828 实线 |
        // | 相遇点标签 | text | (400,285) | ~50×16 | "白烟" |
        // | 距离标注 A 端 | text | (240,285) | ~60×14 | "距 A 端近" |
        // | 滑块轨道 | 矩形 | (200,440)-(600,460) | 400×20 | #cccccc |
        // | 滑块手柄 | 圆形 | (200,450) 可拖动 | 直径 24px | #1565c0 |
        // | 滑块 0% 标签 | text | (185,470) | ~30×14 | "0%" |
        // | 滑块 50% 标签 | text | (385,470) | ~30×14 | "50%" |
        // | 滑块 100% 标签 | text | (585,470) | ~40×14 | "100%" |
        // | 滑块说明 | text | (400,420) | ~120×14 | "拖动滑块观察分子运动" |
        
        // 状态变量
        let sliderValue = 0; // 0-100
        let isDragging = false;
        
        // DOM 元素
        const sliderHandle = document.getElementById('scene2-slider-handle');
        const sliderTrack = document.getElementById('scene2-slider-track');
        const hclGroup = document.getElementById('scene2-hcl-group');
        const nh3Group = document.getElementById('scene2-nh3-group');
        const trackHcl = document.getElementById('scene2-track-hcl');
        const trackNh3 = document.getElementById('scene2-track-nh3');
        const smokeGroup = document.getElementById('scene2-smoke');
        const meetLine = document.getElementById('scene2-meet-line');
        const labelSmoke = document.getElementById('scene2-label-smoke');
        const labelDistance = document.getElementById('scene2-label-distance');
        
        // HCl 分子初始位置偏移（相对于组中心）
        const hclMolecules = [
            { el: hclGroup.children[0], dx: 0, dy: -5 },
            { el: hclGroup.children[1], dx: 15, dy: 0 },
            { el: hclGroup.children[2], dx: 8, dy: 8 },
            { el: hclGroup.children[3], dx: 22, dy: -8 }
        ];
        
        // NH₃分子初始位置偏移
        const nh3Molecules = [
            { el: nh3Group.children[0], dx: 0, dy: -5 },
            { el: nh3Group.children[1], dx: -12, dy: 0 },
            { el: nh3Group.children[2], dx: -5, dy: 8 },
            { el: nh3Group.children[3], dx: -18, dy: -8 }
        ];
        
        // 计算分子位置
        // 速率比 = 质量反比 = 36.5/17 ≈ 2.15
        // NH₃移动距离是 HCl 的 2.15 倍
        // 相遇点距 A 端 = 600 / (1 + 2.15) ≈ 190px，即 x ≈ 290
        // 简化：HCl 从 x=100 移动到 x=400（300px 的 47%），NH₃从 x=700 移动到 x=400（300px 的 53%）
        function updateMoleculePositions(value) {
            const progress = value / 100;
            
            // HCl 移动距离：300 * 0.47 * progress ≈ 141 * progress
            const hclMove = 141 * progress;
            // NH₃移动距离：300 * 0.53 * progress ≈ 159 * progress
            const nh3Move = 159 * progress;
            
            // 更新 HCl 分子位置
            hclMolecules.forEach(m => {
                const cx = 100 + m.dx + hclMove;
                const cy = 230 + m.dy;
                m.el.setAttribute('cx', cx);
                m.el.setAttribute('cy', cy);
            });
            
            // 更新 NH₃分子位置
            nh3Molecules.forEach(m => {
                const cx = 700 + m.dx - nh3Move;
                const cy = 230 + m.dy;
                m.el.setAttribute('cx', cx);
                m.el.setAttribute('cy', cy);
            });
            
            // 显示轨迹（当 progress > 0 时）
            if (progress > 0.05) {
                trackHcl.classList.add('visible');
                trackNh3.classList.add('visible');
            } else {
                trackHcl.classList.remove('visible');
                trackNh3.classList.remove('visible');
            }
            
            // 显示白烟和相遇点（当 progress >= 95% 时）
            if (progress >= 0.95) {
                smokeGroup.classList.add('visible');
                meetLine.classList.add('visible');
                labelSmoke.classList.add('visible');
                labelDistance.classList.add('visible');
            } else {
                smokeGroup.classList.remove('visible');
                meetLine.classList.remove('visible');
                labelSmoke.classList.remove('visible');
                labelDistance.classList.remove('visible');
            }
        }
        
        // 更新滑块手柄位置
        function updateSliderHandle(value) {
            const trackRect = sliderTrack.getBoundingClientRect();
            const containerRect = document.getElementById('scene2-container').getBoundingClientRect();
            const trackLeft = trackRect.left - containerRect.left;
            const trackWidth = trackRect.width;
            
            const handleX = trackLeft + (value / 100) * trackWidth;
            sliderHandle.setAttribute('cx', handleX);
        }
        
        // 获取滑块值从鼠标位置
        function getSliderValueFromX(clientX) {
            const trackRect = sliderTrack.getBoundingClientRect();
            const containerRect = document.getElementById('scene2-container').getBoundingClientRect();
            const trackLeft = trackRect.left - containerRect.left;
            const trackWidth = trackRect.width;
            
            const x = clientX - containerRect.left;
            let value = ((x - trackLeft) / trackWidth) * 100;
            value = Math.max(0, Math.min(100, value));
            return Math.round(value);
        }
        
        // 鼠标事件处理
        sliderHandle.addEventListener('mousedown', function(e) {
            isDragging = true;
            e.preventDefault();
        });
        
        document.addEventListener('mousemove', function(e) {
            if (!isDragging) return;
            
            sliderValue = getSliderValueFromX(e.clientX);
            updateSliderHandle(sliderValue);
            updateMoleculePositions(sliderValue);
        });
        
        document.addEventListener('mouseup', function() {
            isDragging = false;
        });
        
        // 触摸事件处理
        sliderHandle.addEventListener('touchstart', function(e) {
            isDragging = true;
            e.preventDefault();
        });
        
        document.addEventListener('touchmove', function(e) {
            if (!isDragging) return;
            
            const touch = e.touches[0];
            sliderValue = getSliderValueFromX(touch.clientX);
            updateSliderHandle(sliderValue);
            updateMoleculePositions(sliderValue);
        });
        
        document.addEventListener('touchend', function() {
            isDragging = false;
        });
        
        // 点击滑块轨道跳转
        sliderTrack.addEventListener('click', function(e) {
            sliderValue = getSliderValueFromX(e.clientX);
            updateSliderHandle(sliderValue);
            updateMoleculePositions(sliderValue);
        });
        
        // 初始化
        updateSliderHandle(0);
        updateMoleculePositions(0);
        
    })();
    </script>
</body>
</html>
