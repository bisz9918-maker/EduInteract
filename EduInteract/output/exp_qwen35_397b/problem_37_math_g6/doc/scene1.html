<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>光影形成原理与相似三角形</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }
        .scene1-btn {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #333;
            border-radius: 4px;
            background: #f5f5f5;
        }
        .scene1-btn:hover:not(:disabled) {
            background: #e0e0e0;
        }
        .scene1-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #scene1-step-indicator {
            font-size: 14px;
            min-width: 80px;
            text-align: center;
        }
        /* 元素显隐控制 */
        .scene1-hidden {
            opacity: 0;
            display: none;
        }
        .scene1-visible {
            opacity: 1;
            display: block;
        }
        /* 淡入动画 */
        .scene1-fade-in {
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene1-arrow-start" markerWidth="8" markerHeight="8" refX="0" refY="4" orient="auto">
                    <path d="M8,0 L0,4 L8,8" fill="#888888" stroke="#888888" stroke-width="1"/>
                </marker>
                <marker id="scene1-arrow-end" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
                    <path d="M0,0 L8,4 L0,8" fill="#888888" stroke="#888888" stroke-width="1"/>
                </marker>
            </defs>

            <!-- 地面线 -->
            <line id="scene1-ground" x1="80" y1="400" x2="720" y2="400" stroke="#000000" stroke-width="3"/>

            <!-- 地面阴影线（装饰） -->
            <g id="scene1-ground-shadows">
                <line x1="80" y1="405" x2="90" y2="415" stroke="#666666" stroke-width="1"/>
                <line x1="100" y1="405" x2="110" y2="415" stroke="#666666" stroke-width="1"/>
                <line x1="120" y1="405" x2="130" y2="415" stroke="#666666" stroke-width="1"/>
                <line x1="140" y1="405" x2="150" y2="415" stroke="#666666" stroke-width="1"/>
                <line x1="160" y1="405" x2="170" y2="415" stroke="#666666" stroke-width="1"/>
                <line x1="180" y1="405" x2="190" y2="415" stroke="#666666" stroke-width="1"/>
                <line x1="200" y1="405" x2="210" y2="415" stroke="#666666" stroke-width="1"/>
                <line x1="220" y1="405" x2="230" y2="415" stroke="#666666" stroke-width="1"/>
                <line x1="240" y1="405" x2="250" y2="415" stroke="#666666" stroke-width="1"/>
                <line x1="260" y1="405" x2="270" y2="415" stroke="#666666" stroke-width="1"/>
                <line x1="280" y1="405" x2="290" y2="415" stroke="#666666" stroke-width="1"/>
                <line x1="300" y1="405" x2="310" y2="415" stroke="#666666" stroke-width="1"/>
                <line x1="320" y1="405" x2="330" y2="415" stroke="#666666" stroke-width="1"/>
                <line x1="340" y1="405" x2="350" y2="415" stroke="#666666" stroke-width="1"/>
                <line x1="360" y1="405" x2="370" y2="415" stroke="#666666" stroke-width="1"/>
                <line x1="380" y1="405" x2="390" y2="415" stroke="#666666" stroke-width="1"/>
                <line x1="400" y1="405" x2="410" y2="415" stroke="#666666" stroke-width="1"/>
                <line x1="420" y1="405" x2="430" y2="415" stroke="#666666" stroke-width="1"/>
                <line x1="440" y1="405" x2="450" y2="415" stroke="#666666" stroke-width="1"/>
                <line x1="460" y1="405" x2="470" y2="415" stroke="#666666" stroke-width="1"/>
                <line x1="480" y1="405" x2="490" y2="415" stroke="#666666" stroke-width="1"/>
                <line x1="500" y1="405" x2="510" y2="415" stroke="#666666" stroke-width="1"/>
                <line x1="520" y1="405" x2="530" y2="415" stroke="#666666" stroke-width="1"/>
                <line x1="540" y1="405" x2="550" y2="415" stroke="#666666" stroke-width="1"/>
                <line x1="560" y1="405" x2="570" y2="415" stroke="#666666" stroke-width="1"/>
                <line x1="580" y1="405" x2="590" y2="415" stroke="#666666" stroke-width="1"/>
                <line x1="600" y1="405" x2="610" y2="415" stroke="#666666" stroke-width="1"/>
                <line x1="620" y1="405" x2="630" y2="415" stroke="#666666" stroke-width="1"/>
                <line x1="640" y1="405" x2="650" y2="415" stroke="#666666" stroke-width="1"/>
                <line x1="660" y1="405" x2="670" y2="415" stroke="#666666" stroke-width="1"/>
                <line x1="680" y1="405" x2="690" y2="415" stroke="#666666" stroke-width="1"/>
                <line x1="700" y1="405" x2="710" y2="415" stroke="#666666" stroke-width="1"/>
            </g>

            <!-- 路灯杆 -->
            <line id="scene1-light-pole" x1="100" y1="120" x2="100" y2="400" stroke="#000000" stroke-width="10"/>

            <!-- 光源 S -->
            <circle id="scene1-light-source" cx="100" cy="100" r="20" fill="#ffc107" stroke="#000000" stroke-width="2"/>

            <!-- 物体（杯子/梯形） -->
            <polygon id="scene1-object" points="390,320 430,320 440,400 380,400" fill="#e0e0e0" stroke="#000000" stroke-width="2"/>

            <!-- 光线（步骤 1 显示） -->
            <line id="scene1-ray" class="scene1-hidden" x1="100" y1="100" x2="520" y2="400" stroke="#c62828" stroke-width="2"/>

            <!-- 影子区域（步骤 2 显示） -->
            <g id="scene1-shadow-group" class="scene1-hidden">
                <line x1="440" y1="400" x2="520" y2="400" stroke="#1565c0" stroke-width="5"/>
                <rect x="440" y="398" width="80" height="4" fill="#1565c0" opacity="0.3"/>
            </g>

            <!-- 大三角形（步骤 3 显示） -->
            <polygon id="scene1-triangle-large" class="scene1-hidden" points="100,100 100,400 520,400" fill="none" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5,5"/>

            <!-- 小三角形（步骤 3 显示） -->
            <polygon id="scene1-triangle-small" class="scene1-hidden" points="410,320 410,400 520,400" fill="none" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5,5"/>

            <!-- 标签 S -->
            <text id="scene1-label-S" x="100" y="70" text-anchor="middle" font-size="14" fill="#000000">S</text>

            <!-- 标签 H -->
            <text id="scene1-label-H" x="30" y="265" text-anchor="middle" font-size="14" fill="#000000">H</text>

            <!-- 标签 h - 移到物体右侧更远上方，避免与双箭头和三角形重叠 -->
            <text id="scene1-label-h" x="480" y="295" text-anchor="middle" font-size="14" fill="#000000">h</text>

            <!-- 标签 a -->
            <text id="scene1-label-a" x="240" y="440" text-anchor="middle" font-size="14" fill="#000000">a</text>

            <!-- 标签 L（步骤 2 显示） -->
            <text id="scene1-label-L" class="scene1-hidden" x="480" y="440" text-anchor="middle" font-size="14" fill="#000000">L</text>

            <!-- 双箭头标注 H -->
            <line id="scene1-arrow-H" x1="30" y1="120" x2="30" y2="400" stroke="#888888" stroke-width="1" marker-start="url(#scene1-arrow-start)" marker-end="url(#scene1-arrow-end)"/>

            <!-- 双箭头标注 h - 放在物体右侧 -->
            <line id="scene1-arrow-h" x1="450" y1="320" x2="450" y2="400" stroke="#888888" stroke-width="1" marker-start="url(#scene1-arrow-start)" marker-end="url(#scene1-arrow-end)"/>

            <!-- 双箭头标注 a -->
            <line id="scene1-arrow-a" x1="105" y1="425" x2="380" y2="425" stroke="#888888" stroke-width="1" marker-start="url(#scene1-arrow-start)" marker-end="url(#scene1-arrow-end)"/>

            <!-- 双箭头标注 L（步骤 2 显示） -->
            <line id="scene1-arrow-L" class="scene1-hidden" x1="440" y1="425" x2="520" y2="425" stroke="#888888" stroke-width="1" marker-start="url(#scene1-arrow-start)" marker-end="url(#scene1-arrow-end)"/>
        </svg>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/4</span>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现：光影形成原理与相似三角形

        // 状态管理
        let currentStep = 0;
        const totalSteps = 4;

        // 各步骤应显示的元素
        const stepElements = {
            0: ['scene1-ground', 'scene1-ground-shadows', 'scene1-light-pole', 'scene1-light-source', 'scene1-object',
                'scene1-label-S', 'scene1-label-H', 'scene1-label-h', 'scene1-label-a',
                'scene1-arrow-H', 'scene1-arrow-h', 'scene1-arrow-a'],
            1: ['scene1-ground', 'scene1-ground-shadows', 'scene1-light-pole', 'scene1-light-source', 'scene1-object',
                'scene1-label-S', 'scene1-label-H', 'scene1-label-h', 'scene1-label-a',
                'scene1-arrow-H', 'scene1-arrow-h', 'scene1-arrow-a',
                'scene1-ray'],
            2: ['scene1-ground', 'scene1-ground-shadows', 'scene1-light-pole', 'scene1-light-source', 'scene1-object',
                'scene1-label-S', 'scene1-label-H', 'scene1-label-h', 'scene1-label-a', 'scene1-label-L',
                'scene1-arrow-H', 'scene1-arrow-h', 'scene1-arrow-a', 'scene1-arrow-L',
                'scene1-ray', 'scene1-shadow-group'],
            3: ['scene1-ground', 'scene1-ground-shadows', 'scene1-light-pole', 'scene1-light-source', 'scene1-object',
                'scene1-label-S', 'scene1-label-H', 'scene1-label-h', 'scene1-label-a', 'scene1-label-L',
                'scene1-arrow-H', 'scene1-arrow-h', 'scene1-arrow-a', 'scene1-arrow-L',
                'scene1-ray', 'scene1-shadow-group',
                'scene1-triangle-large', 'scene1-triangle-small']
        };

        // 获取元素
        function getElement(id) {
            return document.getElementById(id);
        }

        // 显示/隐藏元素
        function showElement(id) {
            const el = getElement(id);
            if (el) {
                el.classList.remove('scene1-hidden');
                el.classList.add('scene1-visible', 'scene1-fade-in');
            }
        }

        function hideElement(id) {
            const el = getElement(id);
            if (el) {
                el.classList.remove('scene1-visible', 'scene1-fade-in');
                el.classList.add('scene1-hidden');
            }
        }

        // 更新步骤显示
        function updateStep() {
            // 隐藏所有元素
            const allElements = new Set();
            Object.values(stepElements).forEach(arr => arr.forEach(id => allElements.add(id)));
            allElements.forEach(id => hideElement(id));

            // 显示当前步骤的元素
            stepElements[currentStep].forEach(id => showElement(id));

            // 更新步骤指示器
            const indicator = getElement('scene1-step-indicator');
            if (indicator) {
                indicator.textContent = `步骤 ${currentStep + 1}/${totalSteps}`;
            }

            // 更新按钮状态
            const prevBtn = getElement('scene1-btn-prev');
            const nextBtn = getElement('scene1-btn-next');
            if (prevBtn) {
                prevBtn.disabled = currentStep === 0;
            }
            if (nextBtn) {
                nextBtn.disabled = currentStep === totalSteps - 1;
            }
        }

        // 按钮事件
        function onPrevClick() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        }

        function onNextClick() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateStep();
            }
        }

        // 初始化
        function init() {
            const prevBtn = getElement('scene1-btn-prev');
            const nextBtn = getElement('scene1-btn-next');

            if (prevBtn) {
                prevBtn.addEventListener('click', onPrevClick);
            }
            if (nextBtn) {
                nextBtn.addEventListener('click', onNextClick);
            }

            // 初始状态
            updateStep();
        }

        // 启动
        init();
    })();
    </script>
</body>
</html>
