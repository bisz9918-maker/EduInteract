<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>场景 3：左视图对比</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene3-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene3-svg {
            width: 800px;
            height: 500px;
        }
        #scene3-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 12px;
            z-index: 10;
        }
        .scene3-btn {
            width: 80px;
            height: 30px;
            background: #f0f0f0;
            border: 1px solid #999;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .scene3-btn:hover:not(:disabled) {
            background: #e0e0e0;
        }
        .scene3-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .scene3-fade-in {
            animation: scene3FadeIn 300ms ease-in-out;
        }
        @keyframes scene3FadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg id="scene3-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 左图组 -->
            <g id="scene3-left-group">
                <!-- 左图标题 -->
                <text id="scene3-left-title" x="210" y="35" text-anchor="middle" fill="#000000" font-size="16px" font-weight="bold">左图</text>
                <!-- 左图左视图标签 -->
                <text id="scene3-left-view-label" x="210" y="60" text-anchor="middle" fill="#000000" font-size="14px">左视图</text>
                <!-- 左图左视图边框 -->
                <rect id="scene3-left-border" x="170" y="75" width="70" height="190" fill="none" stroke="#000000" stroke-width="2"/>
                <!-- 左图左视图 - 顶层 -->
                <rect id="scene3-left-top" class="scene3-fade-in" x="175" y="80" width="60" height="60" fill="#1565c0" fill-opacity="0.7" stroke="#000000" stroke-width="2"/>
                <!-- 左图左视图 - 中层 -->
                <rect id="scene3-left-middle" class="scene3-fade-in" x="175" y="140" width="60" height="60" fill="#1565c0" fill-opacity="0.7" stroke="#000000" stroke-width="2"/>
                <!-- 左图左视图 - 底层 -->
                <rect id="scene3-left-bottom" class="scene3-fade-in" x="175" y="200" width="60" height="60" fill="#1565c0" fill-opacity="0.7" stroke="#000000" stroke-width="2"/>
            </g>

            <!-- 右图组 -->
            <g id="scene3-right-group" style="display: none;">
                <!-- 右图标题 -->
                <text id="scene3-right-title" x="560" y="35" text-anchor="middle" fill="#000000" font-size="16px" font-weight="bold">右图</text>
                <!-- 右图左视图标签 -->
                <text id="scene3-right-view-label" x="560" y="60" text-anchor="middle" fill="#000000" font-size="14px">左视图</text>
                <!-- 右图左视图边框 -->
                <rect id="scene3-right-border" x="520" y="75" width="70" height="130" fill="none" stroke="#000000" stroke-width="2"/>
                <!-- 右图左视图 - 顶层 -->
                <rect id="scene3-right-top" class="scene3-fade-in" x="525" y="80" width="60" height="60" fill="#c62828" fill-opacity="0.7" stroke="#000000" stroke-width="2"/>
                <!-- 右图左视图 - 底层 -->
                <rect id="scene3-right-bottom" class="scene3-fade-in" x="525" y="140" width="60" height="60" fill="#c62828" fill-opacity="0.7" stroke="#000000" stroke-width="2"/>
            </g>

            <!-- 结论组 -->
            <g id="scene3-conclusion-group" style="display: none;">
                <!-- 对比结论框 -->
                <rect id="scene3-conclusion-box" x="340" y="380" width="120" height="40" fill="none" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5"/>
                <!-- 对比结论文字 -->
                <text id="scene3-conclusion-text" x="400" y="405" text-anchor="middle" fill="#c62828" font-size="20px" font-weight="bold">不相同</text>
            </g>
        </svg>

        <div id="scene3-controls">
            <button id="scene3-btn-prev" class="scene3-btn" disabled>◀ 上一步</button>
            <button id="scene3-btn-next" class="scene3-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 3 实现：左视图对比

        // 状态变量
        let currentStep = 0;
        const totalSteps = 2;

        // 元素引用
        const leftGroup = document.getElementById('scene3-left-group');
        const rightGroup = document.getElementById('scene3-right-group');
        const conclusionGroup = document.getElementById('scene3-conclusion-group');
        const btnPrev = document.getElementById('scene3-btn-prev');
        const btnNext = document.getElementById('scene3-btn-next');

        // 更新视图函数
        function updateView() {
            // 步骤 0：只显示左图
            // 步骤 1：显示左图 + 右图
            // 步骤 2：显示左图 + 右图 + 结论

            if (currentStep >= 0) {
                leftGroup.style.display = 'block';
                leftGroup.style.opacity = '1';
            }

            if (currentStep >= 1) {
                rightGroup.style.display = 'block';
                rightGroup.style.opacity = '1';
            } else {
                rightGroup.style.display = 'none';
                rightGroup.style.opacity = '0';
            }

            if (currentStep >= 2) {
                conclusionGroup.style.display = 'block';
                conclusionGroup.style.opacity = '1';
            } else {
                conclusionGroup.style.display = 'none';
                conclusionGroup.style.opacity = '0';
            }

            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps);
        }

        // 上一步按钮点击
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateView();
            }
        });

        // 下一步按钮点击
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateView();
            }
        });

        // 初始化视图
        updateView();
    })();
    </script>
</body>
</html>
