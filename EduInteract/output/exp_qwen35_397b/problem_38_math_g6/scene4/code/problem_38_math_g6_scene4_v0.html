<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>从上面观察 - 场景 4</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene4-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene4-svg {
            width: 800px;
            height: 500px;
        }
        .scene4-fade-in {
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }
        .scene4-visible {
            opacity: 1;
        }
        .scene4-hidden {
            display: none;
        }
        #scene4-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 12px;
            z-index: 10;
        }
        .scene4-btn {
            width: 80px;
            height: 30px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #2e7d32;
            border-radius: 4px;
            background: #ffffff;
            color: #2e7d32;
        }
        .scene4-btn:hover:not(:disabled) {
            background: #e8f5e9;
        }
        .scene4-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div id="scene4-container">
        <svg id="scene4-svg" width="800" height="500">
            <!-- 标题文字 -->
            <text id="scene4-title" x="400" y="35" text-anchor="middle" font-size="16px" font-weight="bold" fill="#333333">从上面观察</text>

            <!-- 左图俯视图：3 个正方形横向排列 -->
            <g id="scene4-left-grid" class="scene4-fade-in">
                <rect x="150" y="120" width="40" height="40" fill="#2e7d32" fill-opacity="0.3" stroke="#000000" stroke-width="2"/>
                <rect x="190" y="120" width="40" height="40" fill="#2e7d32" fill-opacity="0.3" stroke="#000000" stroke-width="2"/>
                <rect x="230" y="120" width="40" height="40" fill="#2e7d32" fill-opacity="0.3" stroke="#000000" stroke-width="2"/>
            </g>

            <!-- 左图标签 -->
            <text id="scene4-left-label" x="210" y="200" text-anchor="middle" font-size="14px" fill="#666666" class="scene4-fade-in">左图俯视</text>

            <!-- 右图俯视图：3 个正方形横向排列 -->
            <g id="scene4-right-grid" class="scene4-fade-in scene4-hidden">
                <rect x="530" y="120" width="40" height="40" fill="#2e7d32" fill-opacity="0.3" stroke="#000000" stroke-width="2"/>
                <rect x="570" y="120" width="40" height="40" fill="#2e7d32" fill-opacity="0.3" stroke="#000000" stroke-width="2"/>
                <rect x="610" y="120" width="40" height="40" fill="#2e7d32" fill-opacity="0.3" stroke="#000000" stroke-width="2"/>
            </g>

            <!-- 右图标签 -->
            <text id="scene4-right-label" x="590" y="200" text-anchor="middle" font-size="14px" fill="#666666" class="scene4-fade-in scene4-hidden">右图俯视</text>

            <!-- 相同标注：双向箭头和文字 -->
            <g id="scene4-same-annotation" class="scene4-fade-in scene4-hidden">
                <!-- 左箭头：从中心指向左图 -->
                <line x1="390" y1="240" x2="350" y2="240" stroke="#2e7d32" stroke-width="2"/>
                <polygon points="350,240 360,235 360,245" fill="#2e7d32"/>
                <!-- 右箭头：从中心指向右图 -->
                <line x1="410" y1="240" x2="450" y2="240" stroke="#2e7d32" stroke-width="2"/>
                <polygon points="450,240 440,235 440,245" fill="#2e7d32"/>
                <!-- 相同文字 -->
                <text x="400" y="250" text-anchor="middle" font-size="18px" font-weight="bold" fill="#2e7d32">形状相同</text>
            </g>

            <!-- 答案区域背景 -->
            <rect id="scene4-answer-bg" x="250" y="320" width="300" height="60" fill="#e8f5e9" fill-opacity="0.5" class="scene4-fade-in scene4-hidden"/>

            <!-- 答案文字 -->
            <text id="scene4-answer-text" x="400" y="350" text-anchor="middle" font-size="18px" font-weight="bold" fill="#2e7d32" class="scene4-fade-in scene4-hidden">答案：C.上面</text>

            <!-- 步骤提示文字 -->
            <text id="scene4-step-hint" x="400" y="420" text-anchor="middle" font-size="16px" fill="#333333">左图的俯视图</text>
        </svg>

        <!-- 控件栏 -->
        <div id="scene4-controls">
            <button id="scene4-btn-prev" class="scene4-btn">◀ 上一步</button>
            <button id="scene4-btn-next" class="scene4-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 4 实现：从上面观察两个立体图形的俯视图对比

        // 状态变量
        let currentStep = 0;
        const totalSteps = 4;

        // 每步需要显示的元素配置
        const stepConfig = {
            0: {
                hint: "左图的俯视图",
                show: ["scene4-left-grid", "scene4-left-label"],
                hide: ["scene4-right-grid", "scene4-right-label", "scene4-same-annotation", "scene4-answer-bg", "scene4-answer-text"]
            },
            1: {
                hint: "右图的俯视图",
                show: ["scene4-right-grid", "scene4-right-label"],
                hide: ["scene4-same-annotation", "scene4-answer-bg", "scene4-answer-text"]
            },
            2: {
                hint: "对比结果",
                show: ["scene4-same-annotation"],
                hide: ["scene4-answer-bg", "scene4-answer-text"]
            },
            3: {
                hint: "最终答案",
                show: ["scene4-answer-bg", "scene4-answer-text"],
                hide: []
            }
        };

        // 工具函数：显示元素
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove("scene4-hidden");
                // 触发重绘以启动淡入动画
                void el.offsetWidth;
                el.classList.add("scene4-visible");
            }
        }

        // 工具函数：隐藏元素
        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove("scene4-visible");
                el.classList.add("scene4-hidden");
            }
        }

        // 更新步骤显示
        function updateStep() {
            const config = stepConfig[currentStep];

            // 显示当前步骤需要的元素
            config.show.forEach(id => showElement(id));

            // 隐藏当前步骤不需要的元素
            config.hide.forEach(id => hideElement(id));

            // 更新提示文字
            const hintEl = document.getElementById("scene4-step-hint");
            if (hintEl) {
                hintEl.textContent = config.hint;
            }

            // 更新按钮状态
            const prevBtn = document.getElementById("scene4-btn-prev");
            const nextBtn = document.getElementById("scene4-btn-next");

            if (prevBtn) {
                prevBtn.disabled = (currentStep === 0);
            }
            if (nextBtn) {
                nextBtn.disabled = (currentStep === totalSteps - 1);
            }
        }

        // 上一步按钮点击
        function handlePrev() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        }

        // 下一步按钮点击
        function handleNext() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateStep();
            }
        }

        // 初始化
        function init() {
            // 绑定按钮事件
            const prevBtn = document.getElementById("scene4-btn-prev");
            const nextBtn = document.getElementById("scene4-btn-next");

            if (prevBtn) {
                prevBtn.addEventListener("click", handlePrev);
            }
            if (nextBtn) {
                nextBtn.addEventListener("click", handleNext);
            }

            // 初始显示步骤 0
            updateStep();
        }

        // 启动
        init();
    })();
    </script>
</body>
</html>
