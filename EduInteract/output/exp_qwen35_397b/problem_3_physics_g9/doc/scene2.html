<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拉力大小比较 - 滑轮组力学分析</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene2-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene2-svg {
            width: 800px;
            height: 500px;
        }
        /* 元素显隐控制 */
        .scene2-hidden {
            display: none;
            opacity: 0;
        }
        .scene2-visible {
            display: block;
            opacity: 1;
        }
        /* 条形动画 */
        .scene2-bar {
            transition: width 0.5s ease-out;
        }
        /* 按钮样式 */
        .scene2-btn {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #333;
            border-radius: 4px;
            background: #f5f5f5;
        }
        .scene2-btn:hover:not(:disabled) {
            background: #e0e0e0;
        }
        .scene2-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        /* 选项框 D 高亮 */
        #scene2-option-d {
            stroke: #2e7d32;
            stroke-width: 3;
            fill: none;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 标题 -->
            <text id="scene2-title" x="400" y="45" text-anchor="middle" font-size="18px" font-weight="bold" fill="#333333">
                拉力大小比较
            </text>

            <!-- 基准条 f (灰色) -->
            <rect id="scene2-bar-f" x="200" y="100" width="200" height="40" fill="#888888" fill-opacity="0.8" />
            <text id="scene2-label-f" x="410" y="125" font-size="16px" fill="#000000">f</text>

            <!-- F₁ 条 (蓝色) -->
            <rect id="scene2-bar-f1" x="200" y="160" width="0" height="40" fill="#1565c0" fill-opacity="0.8" class="scene2-bar" />
            <text id="scene2-label-f1-left" x="150" y="185" text-anchor="end" font-size="16px" fill="#000000">F₁</text>
            <text id="scene2-label-f1-right" x="410" y="185" font-size="16px" fill="#000000">f</text>

            <!-- F₂ 条 (蓝色) -->
            <rect id="scene2-bar-f2" x="200" y="220" width="0" height="40" fill="#1565c0" fill-opacity="0.8" class="scene2-bar" />
            <text id="scene2-label-f2-left" x="150" y="245" text-anchor="end" font-size="16px" fill="#000000">F₂</text>
            <text id="scene2-label-f2-right" x="310" y="245" font-size="16px" fill="#000000">f/2</text>

            <!-- F₃ 条 (蓝色) -->
            <rect id="scene2-bar-f3" x="200" y="280" width="0" height="40" fill="#1565c0" fill-opacity="0.8" class="scene2-bar" />
            <text id="scene2-label-f3-left" x="150" y="305" text-anchor="end" font-size="16px" fill="#000000">F₃</text>
            <text id="scene2-label-f3-right" x="610" y="305" font-size="16px" fill="#000000">2f</text>

            <!-- 排序箭头序列 -->
            <g id="scene2-arrow-group" class="scene2-hidden">
                <!-- F₂ → F₁ 箭头 -->
                <path id="scene2-arrow-f2-f1" d="M 250 360 L 350 360" stroke="#2e7d32" stroke-width="2" fill="none" marker-end="url(#scene2-arrowhead)" />
                <!-- F₁ → F₃ 箭头 -->
                <path id="scene2-arrow-f1-f3" d="M 400 360 L 550 360" stroke="#2e7d32" stroke-width="2" fill="none" marker-end="url(#scene2-arrowhead)" />
                <!-- 箭头标记 -->
                <defs>
                    <marker id="scene2-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                        <polygon points="0 0, 10 3, 0 6" fill="#2e7d32" />
                    </marker>
                </defs>
                <!-- 排序文本 -->
                <text id="scene2-text-sort" x="400" y="390" text-anchor="middle" font-size="16px" font-weight="bold" fill="#2e7d32">
                    F₂ &lt; F₁ &lt; F₃
                </text>
            </g>

            <!-- 选项框 -->
            <rect id="scene2-option-a" x="100" y="410" width="150" height="20" stroke="#888888" stroke-width="1" fill="none" />
            <text id="scene2-option-a-text" x="175" y="425" text-anchor="middle" font-size="14px" fill="#000000">A. F₁＞F₂＞F₃</text>

            <rect id="scene2-option-b" x="270" y="410" width="150" height="20" stroke="#888888" stroke-width="1" fill="none" />
            <text id="scene2-option-b-text" x="345" y="425" text-anchor="middle" font-size="14px" fill="#000000">B. F₁＜F₂＜F₃</text>

            <rect id="scene2-option-c" x="440" y="410" width="150" height="20" stroke="#888888" stroke-width="1" fill="none" />
            <text id="scene2-option-c-text" x="515" y="425" text-anchor="middle" font-size="14px" fill="#000000">C. F₂＞F₁＞F₃</text>

            <rect id="scene2-option-d" x="610" y="410" width="150" height="20" stroke="#888888" stroke-width="1" fill="none" class="scene2-hidden" />
            <text id="scene2-option-d-text" x="685" y="425" text-anchor="middle" font-size="14px" fill="#000000" class="scene2-hidden">D. F₂＜F₁＜F₃</text>

            <!-- 控件栏 (放在 SVG 内部底部) -->
            <g id="scene2-controls" transform="translate(0, 450)">
                <rect x="0" y="0" width="800" height="50" fill="#ffffff" />
                <button id="scene2-btn-prev" class="scene2-btn" x="280" y="10" disabled>◀ 上一步</button>
                <text id="scene2-step-indicator" x="400" y="30" text-anchor="middle" font-size="14px" fill="#333333">步骤 1/5</text>
                <button id="scene2-btn-next" class="scene2-btn" x="520" y="10">下一步 ▶</button>
            </g>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 2 实现 - 拉力大小比较条形图

        // 状态变量
        let currentStep = 0;
        const totalSteps = 5;

        // DOM 元素引用
        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        const stepIndicator = document.getElementById('scene2-step-indicator');

        // 各步骤需要显示的元素
        const stepElements = {
            0: ['scene2-bar-f', 'scene2-label-f'],
            1: ['scene2-bar-f', 'scene2-label-f', 'scene2-bar-f1', 'scene2-label-f1-left', 'scene2-label-f1-right'],
            2: ['scene2-bar-f', 'scene2-label-f', 'scene2-bar-f1', 'scene2-label-f1-left', 'scene2-label-f1-right',
                'scene2-bar-f2', 'scene2-label-f2-left', 'scene2-label-f2-right'],
            3: ['scene2-bar-f', 'scene2-label-f', 'scene2-bar-f1', 'scene2-label-f1-left', 'scene2-label-f1-right',
                'scene2-bar-f2', 'scene2-label-f2-left', 'scene2-label-f2-right',
                'scene2-bar-f3', 'scene2-label-f3-left', 'scene2-label-f3-right'],
            4: ['scene2-bar-f', 'scene2-label-f', 'scene2-bar-f1', 'scene2-label-f1-left', 'scene2-label-f1-right',
                'scene2-bar-f2', 'scene2-label-f2-left', 'scene2-label-f2-right',
                'scene2-bar-f3', 'scene2-label-f3-left', 'scene2-label-f3-right',
                'scene2-arrow-group', 'scene2-text-sort', 'scene2-option-d', 'scene2-option-d-text']
        };

        // 条形目标宽度
        const barWidths = {
            'scene2-bar-f': 200,
            'scene2-bar-f1': 200,
            'scene2-bar-f2': 100,
            'scene2-bar-f3': 400
        };

        // 工具函数：显示元素
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene2-hidden');
                el.classList.add('scene2-visible');
                // 如果是条形，设置宽度动画
                if (barWidths.hasOwnProperty(id)) {
                    el.setAttribute('width', barWidths[id]);
                }
            }
        }

        // 工具函数：隐藏元素
        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene2-visible');
                el.classList.add('scene2-hidden');
                // 如果是条形，重置宽度
                if (barWidths.hasOwnProperty(id)) {
                    el.setAttribute('width', '0');
                }
            }
        }

        // 更新步骤显示
        function updateStep() {
            // 获取当前步骤需要显示的元素
            const visibleElements = stepElements[currentStep];

            // 隐藏所有可选元素
            const allElements = [
                'scene2-bar-f1', 'scene2-label-f1-left', 'scene2-label-f1-right',
                'scene2-bar-f2', 'scene2-label-f2-left', 'scene2-label-f2-right',
                'scene2-bar-f3', 'scene2-label-f3-left', 'scene2-label-f3-right',
                'scene2-arrow-group', 'scene2-text-sort', 'scene2-option-d', 'scene2-option-d-text'
            ];

            allElements.forEach(id => {
                if (!visibleElements.includes(id)) {
                    hideElement(id);
                }
            });

            // 显示当前步骤需要的元素
            visibleElements.forEach(id => {
                showElement(id);
            });

            // 更新步骤指示器
            stepIndicator.textContent = `步骤 ${currentStep + 1}/${totalSteps}`;

            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps - 1);

            // 特殊处理：步骤 4 显示选项 D 高亮
            if (currentStep === 4) {
                const optionD = document.getElementById('scene2-option-d');
                optionD.setAttribute('stroke', '#2e7d32');
                optionD.setAttribute('stroke-width', '3');
            }
        }

        // 事件处理：上一步
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });

        // 事件处理：下一步
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateStep();
            }
        });

        // 初始化：显示步骤 0
        updateStep();

    })();
    </script>
</body>
</html>
