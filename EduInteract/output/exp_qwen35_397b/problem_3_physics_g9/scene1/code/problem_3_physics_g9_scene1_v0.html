<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>滑轮受力分析 - 九年级物理</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        .scene1-force-arrow {
            stroke-width: 3;
            fill: none;
        }
        .scene1-f1-arrow { stroke: #1565c0; }
        .scene1-f2-arrow { stroke: #1565c0; }
        .scene1-f3-arrow { stroke: #1565c0; }
        .scene1-friction-arrow { stroke: #c62828; }
        .scene1-rope-highlight {
            stroke: #2e7d32;
            stroke-width: 4;
        }
        .scene1-highlight-rect {
            fill: #1565c0;
            fill-opacity: 0.15;
            stroke: #1565c0;
            stroke-width: 2;
            pointer-events: none;
        }
        .scene1-label {
            font-size: 16px;
            font-weight: bold;
            fill: #000000;
        }
        .scene1-force-label {
            font-size: 14px;
            font-weight: bold;
            fill: #1565c0;
        }
        .scene1-friction-label {
            font-size: 14px;
            font-weight: bold;
            fill: #c62828;
        }
        .scene1-conclusion-text {
            font-size: 16px;
            fill: #000000;
        }
        .scene1-step-text {
            font-size: 13px;
            fill: #333333;
        }
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 12px;
            z-index: 10;
        }
        .scene1-btn {
            padding: 8px 20px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        #scene1-btn-prev {
            background: #e0e0e0;
            color: #333;
        }
        #scene1-btn-prev:hover {
            background: #c0c0c0;
        }
        #scene1-btn-prev:disabled {
            background: #f0f0f0;
            color: #aaa;
            cursor: not-allowed;
        }
        #scene1-btn-next {
            background: #1565c0;
            color: white;
        }
        #scene1-btn-next:hover {
            background: #0d47a1;
        }
        #scene1-btn-next:disabled {
            background: #90caf9;
            cursor: not-allowed;
        }
        #scene1-step-indicator {
            padding: 8px 16px;
            font-size: 14px;
            color: #666;
            background: #f5f5f5;
            border-radius: 4px;
        }
        .scene1-hidden {
            opacity: 0;
            display: none;
        }
        .scene1-visible {
            opacity: 1;
            display: block;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 背景 -->
            <rect width="800" height="500" fill="#ffffff"/>

            <!-- ========== 图 (1) 定滑轮 ========== -->
            <g id="scene1-fig1-group">
                <!-- 高亮框（放在最底层，缩小范围不覆盖编号） -->
                <rect id="scene1-fig1-highlight" x="50" y="80" width="225" height="75" class="scene1-highlight-rect scene1-hidden"/>
                
                <!-- 墙面 -->
                <line id="scene1-fig1-wall" x1="50" y1="80" x2="50" y2="140" stroke="#000000" stroke-width="4"/>
                <!-- 地面 -->
                <line id="scene1-fig1-ground" x1="50" y1="140" x2="280" y2="140" stroke="#000000" stroke-width="4"/>
                <!-- 定滑轮（固定在墙上） -->
                <circle id="scene1-fig1-pulley" cx="80" cy="110" r="20" fill="none" stroke="#000000" stroke-width="2"/>
                <circle cx="80" cy="110" r="3" fill="#000000"/>
                <!-- 滑轮支架 -->
                <line x1="50" y1="110" x2="80" y2="110" stroke="#000000" stroke-width="2"/>
                <!-- 物体 -->
                <rect id="scene1-fig1-block" x="220" y="110" width="50" height="30" fill="none" stroke="#000000" stroke-width="2"/>
                <!-- 绳子 -->
                <polyline id="scene1-fig1-rope" points="50,110 80,110 220,110" fill="none" stroke="#000000" stroke-width="2"/>
                
                <!-- 拉力 F₁ 箭头（向右） -->
                <g id="scene1-fig1-force-f1" class="scene1-hidden">
                    <line x1="120" y1="90" x2="180" y2="90" class="scene1-force-arrow scene1-f1-arrow"/>
                    <polygon points="180,90 170,85 170,95" fill="#1565c0"/>
                    <text x="150" y="70" class="scene1-force-label" text-anchor="middle">F₁</text>
                </g>
                
                <!-- 摩擦力 f 箭头（向左） -->
                <g id="scene1-fig1-force-f" class="scene1-hidden">
                    <line x1="260" y1="155" x2="230" y2="155" class="scene1-force-arrow scene1-friction-arrow"/>
                    <polygon points="230,155 240,150 240,160" fill="#c62828"/>
                    <text x="245" y="175" class="scene1-friction-label" text-anchor="middle">f</text>
                </g>
                
                <!-- 编号 -->
                <text x="165" y="195" class="scene1-label" text-anchor="middle">(1)</text>
            </g>

            <!-- ========== 图 (2) 动滑轮 ========== -->
            <g id="scene1-fig2-group">
                <!-- 高亮框（放在最底层，缩小范围不覆盖编号和 2 段绳标签） -->
                <rect id="scene1-fig2-highlight" x="450" y="80" width="230" height="75" class="scene1-highlight-rect scene1-hidden"/>
                
                <!-- 墙面 -->
                <line id="scene1-fig2-wall" x1="450" y1="80" x2="450" y2="140" stroke="#000000" stroke-width="4"/>
                <!-- 地面 -->
                <line id="scene1-fig2-ground" x1="450" y1="140" x2="680" y2="140" stroke="#000000" stroke-width="4"/>
                <!-- 动滑轮（与物体相连） -->
                <circle id="scene1-fig2-pulley" cx="580" cy="110" r="20" fill="none" stroke="#000000" stroke-width="2"/>
                <circle cx="580" cy="110" r="3" fill="#000000"/>
                <!-- 滑轮连接杆 -->
                <line x1="600" y1="110" x2="620" y2="110" stroke="#000000" stroke-width="2"/>
                <!-- 物体 -->
                <rect id="scene1-fig2-block" x="620" y="110" width="50" height="30" fill="none" stroke="#000000" stroke-width="2"/>
                <!-- 绳子（两段） -->
                <polyline id="scene1-fig2-rope1" points="450,110 580,110" fill="none" stroke="#000000" stroke-width="2"/>
                <polyline id="scene1-fig2-rope2" points="580,110 580,90 450,90" fill="none" stroke="#000000" stroke-width="2"/>
                
                <!-- 拉力 F₂ 箭头（向左） -->
                <g id="scene1-fig2-force-f2" class="scene1-hidden">
                    <line x1="450" y1="90" x2="390" y2="90" class="scene1-force-arrow scene1-f2-arrow"/>
                    <polygon points="390,90 400,85 400,95" fill="#1565c0"/>
                    <text x="420" y="70" class="scene1-force-label" text-anchor="middle">F₂</text>
                </g>
                
                <!-- 摩擦力 f 箭头（向左） -->
                <g id="scene1-fig2-force-f" class="scene1-hidden">
                    <line x1="660" y1="155" x2="630" y2="155" class="scene1-force-arrow scene1-friction-arrow"/>
                    <polygon points="630,155 640,150 640,160" fill="#c62828"/>
                    <text x="645" y="175" class="scene1-friction-label" text-anchor="middle">f</text>
                </g>
                
                <!-- 2 段绳标注（移到高亮框上方更远） -->
                <text id="scene1-fig2-rope-label" x="515" y="60" class="scene1-label scene1-hidden" text-anchor="middle" font-size="12px">2 段绳</text>
                
                <!-- 编号 -->
                <text x="565" y="195" class="scene1-label" text-anchor="middle">(2)</text>
            </g>

            <!-- ========== 图 (3) 动滑轮（拉力作用轴上） ========== -->
            <g id="scene1-fig3-group">
                <!-- 高亮框（放在最底层，缩小范围不覆盖编号） -->
                <rect id="scene1-fig3-highlight" x="200" y="280" width="340" height="75" class="scene1-highlight-rect scene1-hidden"/>
                
                <!-- 墙面 -->
                <line id="scene1-fig3-wall" x1="200" y1="280" x2="200" y2="340" stroke="#000000" stroke-width="4"/>
                <!-- 地面 -->
                <line id="scene1-fig3-ground" x1="200" y1="340" x2="550" y2="340" stroke="#000000" stroke-width="4"/>
                <!-- 物体 -->
                <rect id="scene1-fig3-block" x="220" y="310" width="50" height="30" fill="none" stroke="#000000" stroke-width="2"/>
                <!-- 动滑轮 -->
                <circle id="scene1-fig3-pulley" cx="380" cy="310" r="20" fill="none" stroke="#000000" stroke-width="2"/>
                <circle cx="380" cy="310" r="3" fill="#000000"/>
                <!-- 绳子 -->
                <polyline id="scene1-fig3-rope1" points="220,310 380,310" fill="none" stroke="#000000" stroke-width="2"/>
                <polyline id="scene1-fig3-rope2" points="380,310 380,290 550,290" fill="none" stroke="#000000" stroke-width="2"/>
                
                <!-- 拉力 F₃ 箭头（向右，作用在轴上） -->
                <g id="scene1-fig3-force-f3" class="scene1-hidden">
                    <line x1="400" y1="310" x2="460" y2="310" class="scene1-force-arrow scene1-f3-arrow"/>
                    <polygon points="460,310 450,305 450,315" fill="#1565c0"/>
                    <text x="430" y="285" class="scene1-force-label" text-anchor="middle">F₃</text>
                </g>
                
                <!-- 摩擦力 f 箭头（向左） -->
                <g id="scene1-fig3-force-f" class="scene1-hidden">
                    <line x1="260" y1="350" x2="230" y2="350" class="scene1-force-arrow scene1-friction-arrow"/>
                    <polygon points="230,350 240,345 240,355" fill="#c62828"/>
                    <text x="245" y="370" class="scene1-friction-label" text-anchor="middle">f</text>
                </g>
                
                <!-- 编号 -->
                <text x="375" y="390" class="scene1-label" text-anchor="middle">(3)</text>
            </g>

            <!-- ========== 结论框 ========== -->
            <g id="scene1-conclusion-group" class="scene1-hidden">
                <text x="400" y="420" class="scene1-conclusion-text" text-anchor="middle">F₁ = f,  F₂ = f/2,  F₃ = 2f  →  F₂ &lt; F₁ &lt; F₃</text>
            </g>

            <!-- ========== 答案框 ========== -->
            <g id="scene1-answer-group" class="scene1-hidden">
                <text x="400" y="450" class="scene1-conclusion-text" text-anchor="middle" fill="#1565c0" font-weight="bold">答案：D</text>
            </g>

            <!-- ========== 分析说明文字（移到左上角） ========== -->
            <g id="scene1-explanation-group">
                <text id="scene1-explanation-text" x="30" y="30" class="scene1-step-text" text-anchor="start" font-size="14px" fill="#1565c0" font-weight="bold"></text>
            </g>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/5</span>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现 - 三种滑轮配置的受力分析

        // 布局坐标表（对照 spec.json 实现计划）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 备注 |
        // |------|------|-----------|------|------|
        // | 图 (1)墙面 | 竖线 | (50,80)-(50,140) | 4×60 | 左侧固定墙 |
        // | 图 (1)地面 | 横线 | (50,140)-(280,140) | 230×4 | 水平地面 |
        // | 图 (1)定滑轮 | 圆 | (80,110) | r=20 | 固定在墙上 |
        // | 图 (1)物体 | 矩形 | (220,110)-(270,140) | 50×30 | 在地面上 |
        // | 图 (1)绳子 | 折线 | (50,110)-(80,110)-(220,110) | - | 绕过定滑轮 |
        // | 图 (1)拉力 F₁ 箭头 | 箭头 | (120,90)-(180,90) | 60×4 | 蓝色向右 |
        // | 图 (1)摩擦力 f 箭头 | 箭头 | (230,155)-(260,155) | 30×4 | 红色向左 |
        // | 图 (2)墙面 | 竖线 | (450,80)-(450,140) | 4×60 | 左侧固定墙 |
        // | 图 (2)动滑轮 | 圆 | (580,110) | r=20 | 与物体相连 |
        // | 图 (2)物体 | 矩形 | (620,110)-(670,140) | 50×30 | 在地面上 |
        // | 图 (2)绳子 | 折线 | (450,110)-(580,110)-(580,90)-(450,90) | - | 两段绳子 |
        // | 图 (2)拉力 F₂ 箭头 | 箭头 | (390,90)-(450,90) | 60×4 | 蓝色向左 |
        // | 图 (3)墙面 | 竖线 | (200,280)-(200,340) | 4×60 | 左侧固定墙 |
        // | 图 (3)动滑轮 | 圆 | (380,310) | r=20 | 拉力作用点 |
        // | 图 (3)物体 | 矩形 | (220,310)-(270,340) | 50×30 | 在地面上 |
        // | 图 (3)拉力 F₃ 箭头 | 箭头 | (400,310)-(460,310) | 60×4 | 蓝色向右 |

        const totalSteps = 5;
        let currentStep = 0;

        // 每步显示的元素配置
        const stepConfig = [
            {
                // 步骤 0：初始状态 - 仅显示基础结构
                highlights: [],
                forces: [],
                ropeHighlights: [],
                ropeLabels: [],
                conclusion: false,
                answer: false,
                explanation: ''
            },
            {
                // 步骤 1：分析图 (1) 定滑轮
                highlights: ['scene1-fig1-highlight'],
                forces: ['scene1-fig1-force-f1', 'scene1-fig1-force-f'],
                ropeHighlights: [],
                ropeLabels: [],
                conclusion: false,
                answer: false,
                explanation: '定滑轮：F₁ = f'
            },
            {
                // 步骤 2：分析图 (2) 动滑轮
                highlights: ['scene1-fig2-highlight'],
                forces: ['scene1-fig2-force-f2', 'scene1-fig2-force-f'],
                ropeHighlights: ['scene1-fig2-rope1', 'scene1-fig2-rope2'],
                ropeLabels: ['scene1-fig2-rope-label'],
                conclusion: false,
                answer: false,
                explanation: '动滑轮（2 段绳）：F₂ = f/2'
            },
            {
                // 步骤 3：分析图 (3) 动滑轮
                highlights: ['scene1-fig3-highlight'],
                forces: ['scene1-fig3-force-f3', 'scene1-fig3-force-f'],
                ropeHighlights: [],
                ropeLabels: [],
                conclusion: false,
                answer: false,
                explanation: '动滑轮（拉力作用轴上）：F₃ = 2f'
            },
            {
                // 步骤 4：完整结论
                highlights: [],
                forces: [
                    'scene1-fig1-force-f1', 'scene1-fig1-force-f',
                    'scene1-fig2-force-f2', 'scene1-fig2-force-f',
                    'scene1-fig3-force-f3', 'scene1-fig3-force-f'
                ],
                ropeHighlights: ['scene1-fig2-rope1', 'scene1-fig2-rope2'],
                ropeLabels: ['scene1-fig2-rope-label'],
                conclusion: true,
                answer: true,
                explanation: ''
            }
        ];

        // 工具函数：显示元素
        function showElement(elementId) {
            const el = document.getElementById(elementId);
            if (el) {
                el.classList.remove('scene1-hidden');
                el.classList.add('scene1-visible');
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }

        // 工具函数：隐藏元素
        function hideElement(elementId) {
            const el = document.getElementById(elementId);
            if (el) {
                el.classList.remove('scene1-visible');
                el.classList.add('scene1-hidden');
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }

        // 更新场景显示
        function updateScene() {
            const config = stepConfig[currentStep];

            // 隐藏所有高亮框
            ['scene1-fig1-highlight', 'scene1-fig2-highlight', 'scene1-fig3-highlight'].forEach(id => {
                hideElement(id);
            });

            // 隐藏所有力箭头
            [
                'scene1-fig1-force-f1', 'scene1-fig1-force-f',
                'scene1-fig2-force-f2', 'scene1-fig2-force-f',
                'scene1-fig3-force-f3', 'scene1-fig3-force-f'
            ].forEach(id => {
                hideElement(id);
            });

            // 隐藏所有绳子高亮
            ['scene1-fig2-rope1', 'scene1-fig2-rope2'].forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.classList.remove('scene1-rope-highlight');
                }
            });

            // 隐藏所有绳子标签
            ['scene1-fig2-rope-label'].forEach(id => {
                hideElement(id);
            });

            // 隐藏结论和答案
            hideElement('scene1-conclusion-group');
            hideElement('scene1-answer-group');

            // 应用当前步骤配置
            config.highlights.forEach(id => showElement(id));
            config.forces.forEach(id => showElement(id));
            config.ropeHighlights.forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.classList.add('scene1-rope-highlight');
                }
            });
            config.ropeLabels.forEach(id => showElement(id));

            if (config.conclusion) {
                showElement('scene1-conclusion-group');
            }
            if (config.answer) {
                showElement('scene1-answer-group');
            }

            // 更新说明文字
            const explanationEl = document.getElementById('scene1-explanation-text');
            if (explanationEl) {
                explanationEl.textContent = config.explanation;
            }

            // 更新步骤指示器
            const stepIndicator = document.getElementById('scene1-step-indicator');
            if (stepIndicator) {
                stepIndicator.textContent = `步骤 ${currentStep + 1}/${totalSteps}`;
            }

            // 更新按钮状态
            const prevBtn = document.getElementById('scene1-btn-prev');
            const nextBtn = document.getElementById('scene1-btn-next');
            if (prevBtn) {
                prevBtn.disabled = (currentStep === 0);
            }
            if (nextBtn) {
                nextBtn.disabled = (currentStep === totalSteps - 1);
            }
        }

        // 事件绑定
        document.getElementById('scene1-btn-prev').addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        document.getElementById('scene1-btn-next').addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateScene();
            }
        });

        // 初始化
        updateScene();
    })();
    </script>
</body>
</html>
