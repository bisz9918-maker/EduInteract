<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正方体展开图折叠对比</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene3-btn { padding: 8px 20px; font-size: 16px; border: none; border-radius: 4px; cursor: pointer; background: #e0e0e0; }
        .scene3-btn.active { background: #1565c0; color: white; }
        .scene3-face { transition: all 0.3s ease; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg width="800" height="500" id="scene3-svg">
            <!-- 展开图区域背景 -->
            <rect x="100" y="50" width="600" height="150" fill="#f5f5f5" rx="8"/>
            
            <!-- 展开图组 -->
            <g id="scene3-expansion-group">
                <!-- 面 1: 左上角 (200,80) -->
                <rect id="scene3-face1" x="200" y="80" width="50" height="50" fill="white" stroke="#000000" stroke-width="2"/>
                <text id="scene3-face1-icon" x="225" y="110" text-anchor="middle" font-size="24">☀</text>
                
                <!-- 面 2: 左中 (200,130) -->
                <rect id="scene3-face2" x="200" y="130" width="50" height="50" fill="white" stroke="#000000" stroke-width="2"/>
                <text id="scene3-face2-icon" x="225" y="160" text-anchor="middle" font-size="24">♡</text>
                
                <!-- 面 3: 中心 (250,130) -->
                <rect id="scene3-face3" x="250" y="130" width="50" height="50" fill="white" stroke="#000000" stroke-width="2"/>
                <text id="scene3-face3-icon" x="275" y="160" text-anchor="middle" font-size="24">☺</text>
                
                <!-- 面 4: 右中 (300,130) -->
                <rect id="scene3-face4" x="300" y="130" width="50" height="50" fill="white" stroke="#000000" stroke-width="2"/>
                <text id="scene3-face4-icon" x="325" y="160" text-anchor="middle" font-size="24">♡</text>
                
                <!-- 面 5: 最右 (350,130) -->
                <rect id="scene3-face5" x="350" y="130" width="50" height="50" fill="white" stroke="#000000" stroke-width="2"/>
                <text id="scene3-face5-icon" x="375" y="160" text-anchor="middle" font-size="24">☺</text>
                
                <!-- 面 6: 左下 (200,180) -->
                <rect id="scene3-face6" x="200" y="180" width="50" height="50" fill="white" stroke="#000000" stroke-width="2"/>
                <text id="scene3-face6-icon" x="225" y="210" text-anchor="middle" font-size="24">☀</text>
            </g>
            
            <!-- 正方体组 -->
            <g id="scene3-cube-group">
                <!-- 顶面：菱形 (350,280)-(425,240)-(500,280)-(425,320) -->
                <polygon id="scene3-cube-top" points="350,280 425,240 500,280 425,320" fill="#fff9c4" fill-opacity="0.3" stroke="#000000" stroke-width="2"/>
                <!-- 顶面图标向下偏移，标签向上偏移 -->
                <text id="scene3-cube-top-icon" x="425" y="285" text-anchor="middle" font-size="24">☀</text>
                <text x="425" y="235" text-anchor="middle" font-size="14" fill="#666">顶面</text>
                
                <!-- 正面：平行四边形 (350,280)-(425,320)-(425,400)-(350,360) -->
                <polygon id="scene3-cube-front" points="350,280 425,320 425,400 350,360" fill="#ffcdd2" fill-opacity="0.3" stroke="#000000" stroke-width="2"/>
                <!-- 正面图标向左偏移，标签向左下偏移 -->
                <text id="scene3-cube-front-icon" x="375" y="365" text-anchor="middle" font-size="24">♡</text>
                <text x="330" y="380" text-anchor="middle" font-size="14" fill="#666">正面</text>
                
                <!-- 右面：平行四边形 (425,320)-(500,280)-(500,360)-(425,400) -->
                <polygon id="scene3-cube-right" points="425,320 500,280 500,360 425,400" fill="#c8e6c9" fill-opacity="0.3" stroke="#000000" stroke-width="2"/>
                <!-- 右面图标向右偏移，标签向右下偏移 -->
                <text id="scene3-cube-right-icon" x="475" y="365" text-anchor="middle" font-size="24">☺</text>
                <text x="520" y="380" text-anchor="middle" font-size="14" fill="#666">右面</text>
                
                <!-- 结果标记组 -->
                <g id="scene3-result-mark" transform="translate(520,320)">
                    <!-- 正确标记（绿色勾号）-->
                    <path id="scene3-check-mark" d="M0,10 L10,20 L25,5" fill="none" stroke="#2e7d32" stroke-width="3" opacity="0"/>
                    <!-- 错误标记（红色叉号）-->
                    <path id="scene3-cross-mark" d="M0,0 L25,25 M25,0 L0,25" fill="none" stroke="#c62828" stroke-width="3" opacity="0"/>
                </g>
            </g>
            
            <!-- 选项按钮 -->
            <g id="scene3-controls">
                <rect id="scene3-btn-a-bg" x="150" y="450" width="80" height="35" fill="#e0e0e0" rx="4"/>
                <text id="scene3-btn-a" x="190" y="472" text-anchor="middle" font-size="18" font-weight="bold" class="scene3-btn-text">A</text>
                
                <rect id="scene3-btn-b-bg" x="250" y="450" width="80" height="35" fill="#e0e0e0" rx="4"/>
                <text id="scene3-btn-b" x="290" y="472" text-anchor="middle" font-size="18" font-weight="bold" class="scene3-btn-text">B</text>
                
                <rect id="scene3-btn-c-bg" x="350" y="450" width="80" height="35" fill="#e0e0e0" rx="4"/>
                <text id="scene3-btn-c" x="390" y="472" text-anchor="middle" font-size="18" font-weight="bold" class="scene3-btn-text">C</text>
                
                <rect id="scene3-btn-d-bg" x="450" y="450" width="80" height="35" fill="#e0e0e0" rx="4"/>
                <text id="scene3-btn-d" x="490" y="472" text-anchor="middle" font-size="18" font-weight="bold" class="scene3-btn-text">D</text>
            </g>
        </svg>
    </div>
    
    <script>
    (function() {
        // Scene 3 实现：四个选项展开图的折叠效果对比
        
        // 选项数据：每个选项的 6 个面图案配置
        // 面顺序：face1(上), face2(左中), face3(中), face4(右中), face5(最右), face6(下)
        const optionData = {
            'A': ['☀', '♡', '☺', '♡', '☺', '☀'],
            'B': ['☺', '♡', '♡', '☀', '☀', '☺'],
            'C': ['☺', '♡', '☺', '♡', '☀', '☀'],
            'D': ['☺', '♡', '☀', '☺', '☀', '♡']
        };
        
        // 折叠结果：每个选项折叠后的三面（顶面、正面、右面）
        // 根据正方体展开图折叠规律计算
        const foldResult = {
            'A': { top: '☀', front: '♡', right: '☺', correct: false },
            'B': { top: '☺', front: '♡', right: '☀', correct: false },
            'C': { top: '☀', front: '♡', right: '☺', correct: true },
            'D': { top: '☺', front: '♡', right: '☀', correct: false }
        };
        
        let currentState = 'A';
        
        // 更新展开图显示
        function updateExpansion(option) {
            const faces = optionData[option];
            document.getElementById('scene3-face1-icon').textContent = faces[0];
            document.getElementById('scene3-face2-icon').textContent = faces[1];
            document.getElementById('scene3-face3-icon').textContent = faces[2];
            document.getElementById('scene3-face4-icon').textContent = faces[3];
            document.getElementById('scene3-face5-icon').textContent = faces[4];
            document.getElementById('scene3-face6-icon').textContent = faces[5];
        }
        
        // 更新正方体显示
        function updateCube(option) {
            const result = foldResult[option];
            document.getElementById('scene3-cube-top-icon').textContent = result.top;
            document.getElementById('scene3-cube-front-icon').textContent = result.front;
            document.getElementById('scene3-cube-right-icon').textContent = result.right;
            
            // 更新结果标记
            const checkMark = document.getElementById('scene3-check-mark');
            const crossMark = document.getElementById('scene3-cross-mark');
            
            if (result.correct) {
                checkMark.setAttribute('opacity', '1');
                crossMark.setAttribute('opacity', '0');
            } else {
                checkMark.setAttribute('opacity', '0');
                crossMark.setAttribute('opacity', '1');
            }
        }
        
        // 更新按钮高亮
        function updateButtons(option) {
            const buttons = ['A', 'B', 'C', 'D'];
            buttons.forEach(btn => {
                const bg = document.getElementById(`scene3-btn-${btn.toLowerCase()}-bg`);
                const text = document.getElementById(`scene3-btn-${btn.toLowerCase()}`);
                if (btn === option) {
                    bg.setAttribute('fill', '#1565c0');
                    text.setAttribute('fill', 'white');
                } else {
                    bg.setAttribute('fill', '#e0e0e0');
                    text.setAttribute('fill', 'black');
                }
            });
        }
        
        // 主更新函数
        function updateScene(option) {
            currentState = option;
            updateExpansion(option);
            updateCube(option);
            updateButtons(option);
        }
        
        // 绑定按钮事件
        document.getElementById('scene3-btn-a-bg').addEventListener('click', () => updateScene('A'));
        document.getElementById('scene3-btn-b-bg').addEventListener('click', () => updateScene('B'));
        document.getElementById('scene3-btn-c-bg').addEventListener('click', () => updateScene('C'));
        document.getElementById('scene3-btn-d-bg').addEventListener('click', () => updateScene('D'));
        
        // 初始化显示选项 A
        updateScene('A');
    })();
    </script>
</body>
</html>
