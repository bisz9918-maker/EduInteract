<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三视图还原立体图形 - 分步构建</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #scene2-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene2-svg-main {
            width: 800px;
            height: 500px;
        }
        .scene2-cube {
            transition: opacity 0.3s ease, transform 0.3s ease;
            transform-origin: center;
        }
        .scene2-cube-hidden {
            opacity: 0;
            transform: scale(0.5);
        }
        .scene2-cube-visible {
            opacity: 1;
            transform: scale(1);
        }
        .scene2-label {
            font-weight: bold;
            font-size: 14px;
        }
        .scene2-step-text {
            font-size: 16px;
            fill: #333;
        }
        .scene2-count-text {
            font-size: 14px;
            fill: #666;
        }
        .scene2-btn {
            padding: 8px 16px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .scene2-btn-primary {
            background-color: #1565c0;
            color: white;
        }
        .scene2-btn-primary:hover {
            background-color: #0d47a1;
        }
        .scene2-btn-primary:disabled {
            background-color: #bdbdbd;
            cursor: not-allowed;
        }
        .scene2-btn-secondary {
            background-color: #757575;
            color: white;
        }
        .scene2-btn-secondary:hover {
            background-color: #616161;
        }
        .scene2-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 20px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg-main" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义等轴测立方体的 marker -->
            <defs>
                <style>
                    .scene2-axis { stroke: #888888; stroke-width: 2; fill: none; }
                    .scene2-cube-face { stroke: #000000; stroke-width: 2; }
                    .scene2-cube-blue { fill: #1565c0; fill-opacity: 0.3; }
                    .scene2-cube-green { fill: #2e7d32; fill-opacity: 0.4; }
                    .scene2-label-text { font-weight: bold; font-size: 14px; fill: #000; }
                    .scene2-legend-text { font-size: 14px; fill: #333; }
                </style>
            </defs>

            <!-- 等轴测坐标系 -->
            <g id="scene2-axes">
                <!-- x轴（右下45°） -->
                <line id="scene2-axis-x" x1="400" y1="350" x2="550" y2="420" class="scene2-axis"/>
                <!-- y轴（右上45°） -->
                <line id="scene2-axis-y" x1="400" y1="350" x2="250" y2="280" class="scene2-axis"/>
                <!-- z轴（垂直向上） -->
                <line id="scene2-axis-z" x1="400" y1="350" x2="400" y2="150" class="scene2-axis"/>
                <!-- 轴标签 -->
                <text x="560" y="430" font-size="12" fill="#888">x</text>
                <text x="230" y="270" font-size="12" fill="#888">y</text>
                <text x="410" y="140" font-size="12" fill="#888">z</text>
            </g>

            <!-- 底层正方体 A（左后） -->
            <g id="scene2-cube-a" class="scene2-cube scene2-cube-hidden">
                <!-- 顶面 -->
                <polygon points="320,270 350,285 320,300 290,285" class="scene2-cube-face scene2-cube-blue"/>
                <!-- 左前面 -->
                <polygon points="290,285 320,300 320,360 290,345" class="scene2-cube-face scene2-cube-blue"/>
                <!-- 右前面 -->
                <polygon points="320,300 350,285 350,345 320,360" class="scene2-cube-face scene2-cube-blue"/>
            </g>

            <!-- 底层正方体 B（右后） -->
            <g id="scene2-cube-b" class="scene2-cube scene2-cube-hidden">
                <!-- 顶面 -->
                <polygon points="400,230 430,245 400,260 370,245" class="scene2-cube-face scene2-cube-blue"/>
                <!-- 左前面 -->
                <polygon points="370,245 400,260 400,320 370,305" class="scene2-cube-face scene2-cube-blue"/>
                <!-- 右前面 -->
                <polygon points="400,260 430,245 430,305 400,320" class="scene2-cube-face scene2-cube-blue"/>
            </g>

            <!-- 底层正方体 C（右前） -->
            <g id="scene2-cube-c" class="scene2-cube scene2-cube-hidden">
                <!-- 顶面 -->
                <polygon points="480,270 510,285 480,300 450,285" class="scene2-cube-face scene2-cube-blue"/>
                <!-- 左前面 -->
                <polygon points="450,285 480,300 480,360 450,345" class="scene2-cube-face scene2-cube-blue"/>
                <!-- 右前面 -->
                <polygon points="480,300 510,285 510,345 480,360" class="scene2-cube-face scene2-cube-blue"/>
            </g>

            <!-- 底层正方体 D（左前） -->
            <g id="scene2-cube-d" class="scene2-cube scene2-cube-hidden">
                <!-- 顶面 -->
                <polygon points="320,350 350,365 320,380 290,365" class="scene2-cube-face scene2-cube-blue"/>
                <!-- 左前面 -->
                <polygon points="290,365 320,380 320,440 290,425" class="scene2-cube-face scene2-cube-blue"/>
                <!-- 右前面 -->
                <polygon points="320,380 350,365 350,425 320,440" class="scene2-cube-face scene2-cube-blue"/>
            </g>

            <!-- 第 2 层正方体 A2（A 正上方） -->
            <g id="scene2-cube-a2" class="scene2-cube scene2-cube-hidden">
                <!-- 顶面 -->
                <polygon points="320,210 350,225 320,240 290,225" class="scene2-cube-face scene2-cube-green"/>
                <!-- 左前面 -->
                <polygon points="290,225 320,240 320,300 290,285" class="scene2-cube-face scene2-cube-green"/>
                <!-- 右前面 -->
                <polygon points="320,240 350,225 350,285 320,300" class="scene2-cube-face scene2-cube-green"/>
            </g>

            <!-- 位置标签 -->
            <text id="scene2-label-a" x="270" y="340" class="scene2-label-text" style="opacity: 0;">位置 A</text>
            <text id="scene2-label-b" x="400" y="210" class="scene2-label-text" style="opacity: 0;">位置 B</text>
            <text id="scene2-label-c" x="510" y="340" class="scene2-label-text" style="opacity: 0;">位置 C</text>
            <text id="scene2-label-d" x="270" y="430" class="scene2-label-text" style="opacity: 0;">位置 D</text>

            <!-- 图例区 -->
            <g id="scene2-legend">
                <rect x="620" y="175" width="20" height="20" class="scene2-cube-face scene2-cube-blue"/>
                <text x="650" y="190" class="scene2-legend-text">第 1 层</text>
                <rect x="620" y="205" width="20" height="20" class="scene2-cube-face scene2-cube-green"/>
                <text x="650" y="220" class="scene2-legend-text">第 2 层</text>
            </g>

            <!-- 步骤指示器和计数 -->
            <text id="scene2-step-indicator" x="100" y="50" class="scene2-step-text">步骤 0：准备构建</text>
            <text id="scene2-count-display" x="100" y="80" class="scene2-count-text">当前正方体数：0 个</text>

            <!-- 最终答案提示（初始隐藏） -->
            <text id="scene2-answer" x="400" y="100" text-anchor="middle" class="scene2-step-text" style="opacity: 0; fill: #2e7d32; font-weight: bold;">答案：B. 5 个</text>
        </svg>

        <!-- 控件栏 -->
        <div class="scene2-controls">
            <button id="scene2-btn-prev" class="scene2-btn scene2-btn-secondary">◀ 上一步</button>
            <button id="scene2-btn-next" class="scene2-btn scene2-btn-primary">下一步 ▶</button>
            <button id="scene2-btn-reset" class="scene2-btn scene2-btn-secondary">重置</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2: 三视图还原立体图形 - 分步构建

        // 状态变量
        let currentStep = 0;
        const totalSteps = 4;

        // 步骤配置
        const steps = [
            { text: "步骤 0：准备构建", count: 0, cubes: [], labels: [], answer: false },
            { text: "步骤 1：底层 4 个正方体", count: 4, cubes: ['a', 'b', 'c', 'd'], labels: ['a', 'b', 'c', 'd'], answer: false },
            { text: "步骤 2：添加第 2 层", count: 5, cubes: ['a', 'b', 'c', 'd', 'a2'], labels: ['a', 'b', 'c', 'd'], answer: false },
            { text: "步骤 3：完整立体图形", count: 5, cubes: ['a', 'b', 'c', 'd', 'a2'], labels: ['a', 'b', 'c', 'd'], answer: false },
            { text: "步骤 4：观察立体结构", count: 5, cubes: ['a', 'b', 'c', 'd', 'a2'], labels: ['a', 'b', 'c', 'd'], answer: true }
        ];

        // 获取 DOM 元素
        const stepIndicator = document.getElementById('scene2-step-indicator');
        const countDisplay = document.getElementById('scene2-count-display');
        const answerText = document.getElementById('scene2-answer');
        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        const btnReset = document.getElementById('scene2-btn-reset');

        // 立方体元素
        const cubes = {
            a: document.getElementById('scene2-cube-a'),
            b: document.getElementById('scene2-cube-b'),
            c: document.getElementById('scene2-cube-c'),
            d: document.getElementById('scene2-cube-d'),
            a2: document.getElementById('scene2-cube-a2')
        };

        // 标签元素
        const labels = {
            a: document.getElementById('scene2-label-a'),
            b: document.getElementById('scene2-label-b'),
            c: document.getElementById('scene2-label-c'),
            d: document.getElementById('scene2-label-d')
        };

        // 更新显示状态
        function updateDisplay(step) {
            const config = steps[step];

            // 更新文本
            stepIndicator.textContent = config.text;
            countDisplay.textContent = "当前正方体数：" + config.count + "个";

            // 更新答案显示
            answerText.style.opacity = config.answer ? '1' : '0';

            // 更新立方体可见性
            for (const key in cubes) {
                const cube = cubes[key];
                if (config.cubes.includes(key)) {
                    cube.classList.remove('scene2-cube-hidden');
                    cube.classList.add('scene2-cube-visible');
                } else {
                    cube.classList.remove('scene2-cube-visible');
                    cube.classList.add('scene2-cube-hidden');
                }
            }

            // 更新标签可见性
            for (const key in labels) {
                const label = labels[key];
                if (config.labels.includes(key)) {
                    label.style.opacity = '1';
                } else {
                    label.style.opacity = '0';
                }
            }

            // 更新按钮状态
            btnPrev.disabled = (step === 0);
            btnNext.disabled = (step === totalSteps);

            // 步骤 3 和 4 时，将 A2 正方体改为蓝色
            if (step >= 3) {
                const a2Faces = cubes.a2.querySelectorAll('polygon');
                a2Faces.forEach(face => {
                    face.classList.remove('scene2-cube-green');
                    face.classList.add('scene2-cube-blue');
                });
            } else if (step === 2) {
                const a2Faces = cubes.a2.querySelectorAll('polygon');
                a2Faces.forEach(face => {
                    face.classList.remove('scene2-cube-blue');
                    face.classList.add('scene2-cube-green');
                });
            }
        }

        // 按钮事件处理
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay(currentStep);
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateDisplay(currentStep);
            }
        });

        btnReset.addEventListener('click', function() {
            currentStep = 0;
            updateDisplay(currentStep);
        });

        // 初始化显示
        updateDisplay(currentStep);

    })();
    </script>
</body>
</html>
