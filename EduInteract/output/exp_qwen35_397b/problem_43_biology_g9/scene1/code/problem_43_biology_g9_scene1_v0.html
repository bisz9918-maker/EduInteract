<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>昆虫生命周期循环图</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: "SimHei", "Microsoft YaHei", sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }
        .scene1-btn {
            padding: 8px 16px;
            font-size: 14px;
            border: 1px solid #333;
            border-radius: 4px;
            background: #f5f5f5;
            cursor: pointer;
            transition: all 0.2s;
        }
        .scene1-btn:hover:not(:disabled) {
            background: #e0e0e0;
        }
        .scene1-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #scene1-step-indicator {
            font-size: 14px;
            color: #666;
            min-width: 80px;
            text-align: center;
        }
        #scene1-step-desc-text {
            position: absolute;
            bottom: 55px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 14px;
            color: #333;
        }
        /* 元素显隐控制 */
        .scene1-hidden {
            display: none;
            opacity: 0;
        }
        .scene1-visible {
            display: block;
            opacity: 1;
        }
        /* SVG 元素样式 */
        .scene1-node {
            fill: #e3f2fd;
            fill-opacity: 0.2;
            stroke: #000000;
            stroke-width: 2;
        }
        .scene1-node-dimmed {
            fill: #cccccc;
            fill-opacity: 0.5;
            stroke: #888888;
            stroke-width: 2;
        }
        .scene1-arrow-base {
            fill: none;
            stroke: #000000;
            stroke-width: 3;
            marker-end: url(#scene1-arrowhead);
        }
        .scene1-highlight-complete {
            fill: none;
            stroke: #1565c0;
            stroke-width: 5;
            marker-end: url(#scene1-arrowhead-blue);
        }
        .scene1-highlight-incomplete {
            fill: none;
            stroke: #2e7d32;
            stroke-width: 5;
            marker-end: url(#scene1-arrowhead-green);
        }
        .scene1-error-mark {
            stroke: #c62828;
            stroke-width: 4;
            fill: none;
        }
        .scene1-label {
            font-size: 16px;
            font-weight: bold;
            fill: #000000;
            text-anchor: middle;
            dominant-baseline: middle;
        }
        .scene1-annotation {
            font-size: 12px;
            fill: #333333;
            text-anchor: middle;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 箭头标记定义 -->
            <defs>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#000000" />
                </marker>
                <marker id="scene1-arrowhead-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#1565c0" />
                </marker>
                <marker id="scene1-arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#2e7d32" />
                </marker>
            </defs>

            <!-- 基础箭头路径（步骤 0 显示） -->
            <path id="scene1-arrow-ab" class="scene1-arrow-base" d="M 400 128 L 200 222" />
            <path id="scene1-arrow-bd" class="scene1-arrow-base" d="M 200 278 L 400 372" />
            <path id="scene1-arrow-dc" class="scene1-arrow-base" d="M 400 372 L 600 278" />
            <path id="scene1-arrow-ca" class="scene1-arrow-base" d="M 600 222 L 400 128" />
            <path id="scene1-arrow-da" class="scene1-arrow-base" d="M 400 372 L 400 128" />

            <!-- 完全变态高亮路径（步骤 1 显示） -->
            <path id="scene1-highlight-complete-ab" class="scene1-highlight-complete scene1-hidden" d="M 400 128 L 200 222" />
            <path id="scene1-highlight-complete-bd" class="scene1-highlight-complete scene1-hidden" d="M 200 278 L 400 372" />
            <path id="scene1-highlight-complete-dc" class="scene1-highlight-complete scene1-hidden" d="M 400 372 L 600 278" />
            <path id="scene1-highlight-complete-ca" class="scene1-highlight-complete scene1-hidden" d="M 600 222 L 400 128" />

            <!-- 不完全变态高亮路径（步骤 2-3 显示） -->
            <path id="scene1-highlight-incomplete-ab" class="scene1-highlight-incomplete scene1-hidden" d="M 400 128 L 200 222" />
            <path id="scene1-highlight-incomplete-bc" class="scene1-highlight-incomplete scene1-hidden" d="M 200 250 L 600 250" />
            <path id="scene1-highlight-incomplete-ca" class="scene1-highlight-incomplete scene1-hidden" d="M 600 222 L 400 128" />

            <!-- 节点圆圈 -->
            <circle id="scene1-node-a" class="scene1-node" cx="400" cy="100" r="28" />
            <circle id="scene1-node-b" class="scene1-node" cx="200" cy="250" r="28" />
            <circle id="scene1-node-d" class="scene1-node" cx="400" cy="400" r="28" />
            <circle id="scene1-node-c" class="scene1-node" cx="600" cy="250" r="28" />

            <!-- 节点标签 - 移到圆圈外部 -->
            <text id="scene1-label-a" class="scene1-label" x="400" y="62">A</text>
            <text id="scene1-label-b" class="scene1-label" x="165" y="250">B</text>
            <text id="scene1-label-d" class="scene1-label" x="400" y="448">D</text>
            <text id="scene1-label-c" class="scene1-label" x="635" y="250">C</text>

            <!-- 阶段标注 - 调整位置避免与步骤说明冲突 -->
            <text id="scene1-anno-egg" class="scene1-annotation" x="400" y="40">卵</text>
            <text id="scene1-anno-larva" class="scene1-annotation scene1-hidden" x="130" y="250">幼虫</text>
            <text id="scene1-anno-nymph" class="scene1-annotation scene1-hidden" x="130" y="250">若虫</text>
            <text id="scene1-anno-pupa" class="scene1-annotation scene1-hidden" x="400" y="425">蛹</text>
            <text id="scene1-anno-no-pupa" class="scene1-annotation scene1-hidden" x="400" y="425">无此阶段</text>
            <text id="scene1-anno-adult" class="scene1-annotation" x="670" y="250">成虫</text>

            <!-- 错误标记×（步骤 3 显示） -->
            <path id="scene1-error-mark-1" class="scene1-error-mark scene1-hidden" d="M 380 380 L 420 420" />
            <path id="scene1-error-mark-2" class="scene1-error-mark scene1-hidden" d="M 420 380 L 380 420" />
        </svg>

        <!-- 步骤说明文字（HTML 元素） -->
        <div id="scene1-step-desc-text">昆虫生命周期循环图</div>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/4</span>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现 - 昆虫生命周期循环图

        // 状态变量
        let currentStep = 0;
        const totalSteps = 4;

        // DOM 元素引用
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        const stepDescText = document.getElementById('scene1-step-desc-text');

        // 节点元素
        const nodeD = document.getElementById('scene1-node-d');

        // 基础箭头
        const arrows = [
            document.getElementById('scene1-arrow-ab'),
            document.getElementById('scene1-arrow-bd'),
            document.getElementById('scene1-arrow-dc'),
            document.getElementById('scene1-arrow-ca'),
            document.getElementById('scene1-arrow-da')
        ];

        // 完全变态高亮路径
        const completeHighlights = [
            document.getElementById('scene1-highlight-complete-ab'),
            document.getElementById('scene1-highlight-complete-bd'),
            document.getElementById('scene1-highlight-complete-dc'),
            document.getElementById('scene1-highlight-complete-ca')
        ];

        // 不完全变态高亮路径
        const incompleteHighlights = [
            document.getElementById('scene1-highlight-incomplete-ab'),
            document.getElementById('scene1-highlight-incomplete-bc'),
            document.getElementById('scene1-highlight-incomplete-ca')
        ];

        // 标注文字
        const annoLarva = document.getElementById('scene1-anno-larva');
        const annoNymph = document.getElementById('scene1-anno-nymph');
        const annoPupa = document.getElementById('scene1-anno-pupa');
        const annoNoPupa = document.getElementById('scene1-anno-no-pupa');

        // 错误标记
        const errorMark1 = document.getElementById('scene1-error-mark-1');
        const errorMark2 = document.getElementById('scene1-error-mark-2');

        // 步骤说明
        const stepDescriptions = [
            "昆虫生命周期循环图",
            "完全变态发育：卵 → 幼虫 → 蛹 → 成虫（蚊、家蚕）",
            "不完全变态发育：卵 → 若虫 → 成虫（蝗虫、蟋蟀），无蛹期",
            "选项 B 错误：蝗虫为不完全变态，无 D 蛹期"
        ];

        // 工具函数：显示元素
        function show(el) {
            if (el) {
                el.classList.remove('scene1-hidden');
                el.classList.add('scene1-visible');
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }

        // 工具函数：隐藏元素
        function hide(el) {
            if (el) {
                el.classList.remove('scene1-visible');
                el.classList.add('scene1-hidden');
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }

        // 更新步骤显示
        function updateStep() {
            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps - 1);
            stepIndicator.textContent = `步骤 ${currentStep + 1}/${totalSteps}`;
            stepDescText.textContent = stepDescriptions[currentStep];

            // 步骤 0：初始状态
            if (currentStep === 0) {
                // 隐藏所有高亮路径
                completeHighlights.forEach(h => hide(h));
                incompleteHighlights.forEach(h => hide(h));
                // 隐藏标注
                hide(annoLarva);
                hide(annoNymph);
                hide(annoPupa);
                hide(annoNoPupa);
                // 恢复 D 节点
                nodeD.classList.remove('scene1-node-dimmed');
                nodeD.classList.add('scene1-node');
                // 隐藏错误标记
                hide(errorMark1);
                hide(errorMark2);
                // 显示基础箭头
                arrows.forEach(a => show(a));
            }
            // 步骤 1：完全变态发育
            else if (currentStep === 1) {
                // 隐藏不完全变态高亮
                incompleteHighlights.forEach(h => hide(h));
                // 显示完全变态高亮
                completeHighlights.forEach(h => show(h));
                // 隐藏基础箭头
                arrows.forEach(a => hide(a));
                // 显示幼虫和蛹标注
                show(annoLarva);
                hide(annoNymph);
                show(annoPupa);
                hide(annoNoPupa);
                // 恢复 D 节点
                nodeD.classList.remove('scene1-node-dimmed');
                nodeD.classList.add('scene1-node');
                // 隐藏错误标记
                hide(errorMark1);
                hide(errorMark2);
            }
            // 步骤 2：不完全变态发育
            else if (currentStep === 2) {
                // 隐藏完全变态高亮
                completeHighlights.forEach(h => hide(h));
                // 显示不完全变态高亮
                incompleteHighlights.forEach(h => show(h));
                // 隐藏基础箭头
                arrows.forEach(a => hide(a));
                // 显示若虫和无此阶段标注
                hide(annoLarva);
                show(annoNymph);
                hide(annoPupa);
                show(annoNoPupa);
                // 淡化 D 节点
                nodeD.classList.remove('scene1-node');
                nodeD.classList.add('scene1-node-dimmed');
                // 隐藏错误标记
                hide(errorMark1);
                hide(errorMark2);
            }
            // 步骤 3：选项验证
            else if (currentStep === 3) {
                // 保持不完全变态高亮
                incompleteHighlights.forEach(h => show(h));
                // 隐藏基础箭头
                arrows.forEach(a => hide(a));
                // 保持若虫和无此阶段标注
                hide(annoLarva);
                show(annoNymph);
                hide(annoPupa);
                show(annoNoPupa);
                // 保持 D 节点淡化
                nodeD.classList.remove('scene1-node');
                nodeD.classList.add('scene1-node-dimmed');
                // 显示错误标记
                show(errorMark1);
                show(errorMark2);
            }

            // 始终显示节点和标签
            [document.getElementById('scene1-node-a'),
             document.getElementById('scene1-node-b'),
             document.getElementById('scene1-node-c'),
             document.getElementById('scene1-label-a'),
             document.getElementById('scene1-label-b'),
             document.getElementById('scene1-label-c'),
             document.getElementById('scene1-label-d'),
             document.getElementById('scene1-anno-egg'),
             document.getElementById('scene1-anno-adult')
            ].forEach(el => show(el));
        }

        // 事件监听
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateStep();
            }
        });

        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
