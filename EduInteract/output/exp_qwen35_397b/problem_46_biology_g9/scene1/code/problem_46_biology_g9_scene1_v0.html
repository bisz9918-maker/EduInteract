<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNA 分子结构示意图</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        .scene1-marker-1-circle {
            fill: #c62828;
            fill-opacity: 0.2;
            stroke: #c62828;
            stroke-width: 2;
        }
        .scene1-marker-2-ellipse {
            fill: #1565c0;
            fill-opacity: 0.2;
            stroke: #1565c0;
            stroke-width: 2;
            stroke-dasharray: 5,5;
        }
        .scene1-helicase {
            fill: #2e7d32;
            fill-opacity: 0.3;
            stroke: #2e7d32;
            stroke-width: 2;
        }
        .scene1-calc-box {
            fill: #f5f5f5;
            stroke: #cccccc;
            stroke-width: 1;
        }
        .scene1-base-label {
            font-size: 16px;
            font-weight: bold;
            fill: #000000;
        }
        .scene1-title {
            font-size: 20px;
            font-weight: bold;
            fill: #000000;
            text-anchor: middle;
        }
        .scene1-marker-label {
            font-size: 18px;
            font-weight: bold;
            fill: #000000;
        }
        .scene1-calc-text {
            font-size: 16px;
            fill: #333333;
        }
        .scene1-btn {
            position: absolute;
            bottom: 20px;
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border: 2px solid #333;
            border-radius: 5px;
            background: #fff;
            transition: background 0.2s;
        }
        .scene1-btn:hover {
            background: #f0f0f0;
        }
        .scene1-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #scene1-btn-prev {
            left: 320px;
        }
        #scene1-btn-next {
            left: 460px;
        }
        #scene1-step-indicator {
            position: absolute;
            bottom: 25px;
            left: 400px;
            transform: translateX(-50%);
            font-size: 14px;
            color: #333;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <!-- 标题 -->
            <text id="scene1-title" x="400" y="40" class="scene1-title">DNA 分子结构示意图</text>

            <!-- DNA 双链骨架 -->
            <line id="scene1-dna-backbone-top" x1="120" y1="200" x2="680" y2="200" stroke="#000000" stroke-width="3"/>
            <line id="scene1-dna-backbone-bottom" x1="120" y1="280" x2="680" y2="280" stroke="#000000" stroke-width="3"/>

            <!-- 碱基对竖线（8 条） -->
            <line id="scene1-base-pair-1" x1="160" y1="200" x2="160" y2="280" stroke="#000000" stroke-width="3"/>
            <line id="scene1-base-pair-2" x1="220" y1="200" x2="220" y2="280" stroke="#000000" stroke-width="3"/>
            <line id="scene1-base-pair-3" x1="280" y1="200" x2="280" y2="280" stroke="#000000" stroke-width="3"/>
            <line id="scene1-base-pair-4" x1="340" y1="200" x2="340" y2="280" stroke="#000000" stroke-width="3"/>
            <line id="scene1-base-pair-5" x1="460" y1="200" x2="460" y2="280" stroke="#000000" stroke-width="3"/>
            <line id="scene1-base-pair-6" x1="520" y1="200" x2="520" y2="280" stroke="#000000" stroke-width="3"/>
            <line id="scene1-base-pair-7" x1="580" y1="200" x2="580" y2="280" stroke="#000000" stroke-width="3"/>
            <line id="scene1-base-pair-8" x1="640" y1="200" x2="640" y2="280" stroke="#000000" stroke-width="3"/>

            <!-- 氢键省略虚线 -->
            <line id="scene1-h-bond-dash-top" x1="360" y1="210" x2="440" y2="210" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>
            <line id="scene1-h-bond-dash-bottom" x1="360" y1="270" x2="440" y2="270" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>

            <!-- 上链碱基标签 (y=185) -->
            <text id="scene1-label-c1" x="155" y="185" class="scene1-base-label">C</text>
            <text id="scene1-label-t1" x="215" y="185" class="scene1-base-label">T</text>
            <text id="scene1-label-g1" x="275" y="185" class="scene1-base-label">G</text>
            <text id="scene1-label-c2" x="335" y="185" class="scene1-base-label">C</text>
            <text id="scene1-label-c3" x="455" y="185" class="scene1-base-label">C</text>
            <text id="scene1-label-t2" x="515" y="185" class="scene1-base-label">T</text>
            <text id="scene1-label-t3" x="575" y="185" class="scene1-base-label">T</text>
            <text id="scene1-label-a1" x="635" y="185" class="scene1-base-label">A</text>

            <!-- 下链碱基标签 (y=305) -->
            <text id="scene1-label-g2" x="155" y="305" class="scene1-base-label">G</text>
            <text id="scene1-label-a2" x="215" y="305" class="scene1-base-label">A</text>
            <text id="scene1-label-c3" x="275" y="305" class="scene1-base-label">C</text>
            <text id="scene1-label-g3" x="335" y="305" class="scene1-base-label">G</text>
            <text id="scene1-label-g4" x="455" y="305" class="scene1-base-label">G</text>
            <text id="scene1-label-a3" x="515" y="305" class="scene1-base-label">A</text>
            <text id="scene1-label-a4" x="575" y="305" class="scene1-base-label">A</text>
            <text id="scene1-label-t4" x="635" y="305" class="scene1-base-label">T</text>

            <!-- ①磷酸二酯键标记组（步骤 1 显示） -->
            <g id="scene1-marker-1-group" style="display: none; opacity: 0;">
                <circle id="scene1-marker-1-circle" cx="190" cy="185" r="18" class="scene1-marker-1-circle"/>
                <line id="scene1-marker-1-arrow" x1="190" y1="150" x2="190" y2="175" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrowhead)"/>
                <text id="scene1-label-1" x="190" y="135" class="scene1-marker-label" text-anchor="middle">①</text>
            </g>

            <!-- ②氢键区域标记组（步骤 2 显示） -->
            <g id="scene1-marker-2-group" style="display: none; opacity: 0;">
                <ellipse id="scene1-marker-2-ellipse" cx="500" cy="240" rx="50" ry="25" class="scene1-marker-2-ellipse"/>
                <line id="scene1-marker-2-arrow" x1="450" y1="240" x2="470" y2="240" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrowhead-blue)"/>
                <text id="scene1-label-2" x="435" y="225" class="scene1-marker-label">②</text>
            </g>

            <!-- 解旋酶图标组（步骤 3 显示） -->
            <g id="scene1-helicase-group" style="display: none; opacity: 0;">
                <ellipse id="scene1-helicase" cx="500" cy="220" rx="30" ry="20" class="scene1-helicase"/>
                <text x="500" y="225" text-anchor="middle" font-size="12px" fill="#2e7d32">解旋酶</text>
            </g>

            <!-- 计算框组（步骤 4 显示） -->
            <g id="scene1-calc-group" style="display: none; opacity: 0;">
                <rect id="scene1-calc-box" x="150" y="350" width="500" height="80" class="scene1-calc-box"/>
                <text id="scene1-calc-text-1" x="170" y="375" class="scene1-calc-text">C=30%</text>
                <text id="scene1-calc-text-2" x="300" y="375" class="scene1-calc-text">G=30%</text>
                <text id="scene1-calc-text-3" x="430" y="375" class="scene1-calc-text">A+T=40%</text>
                <text id="scene1-calc-text-4" x="280" y="410" class="scene1-calc-text">(C+G)/(A+T)=60%/40%=3/2</text>
            </g>

            <!-- 箭头定义 -->
            <defs>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#c62828"/>
                </marker>
                <marker id="scene1-arrowhead-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#1565c0"/>
                </marker>
            </defs>
        </svg>

        <!-- 控件按钮 -->
        <button id="scene1-btn-prev" class="scene1-btn" disabled>◀ 上一步</button>
        <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        <div id="scene1-step-indicator">步骤 1/5</div>
    </div>

    <script>
    (function() {
        // Scene 1 实现 - DNA 分子结构及化学键类型

        // 状态机：当前步骤 (0-4)
        let currentState = 0;
        const totalSteps = 5;

        // 元素引用
        const marker1Group = document.getElementById('scene1-marker-1-group');
        const marker2Group = document.getElementById('scene1-marker-2-group');
        const helicaseGroup = document.getElementById('scene1-helicase-group');
        const calcGroup = document.getElementById('scene1-calc-group');
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');

        // 显示/隐藏工具函数
        function showElement(el) {
            el.style.display = 'block';
            el.style.opacity = '1';
        }

        function hideElement(el) {
            el.style.display = 'none';
            el.style.opacity = '0';
        }

        // 更新显示状态
        function updateDisplay() {
            // 根据 currentState 显示对应元素
            if (currentState >= 1) {
                showElement(marker1Group);
            } else {
                hideElement(marker1Group);
            }

            if (currentState >= 2) {
                showElement(marker2Group);
            } else {
                hideElement(marker2Group);
            }

            if (currentState >= 3) {
                showElement(helicaseGroup);
            } else {
                hideElement(helicaseGroup);
            }

            if (currentState >= 4) {
                showElement(calcGroup);
            } else {
                hideElement(calcGroup);
            }

            // 更新按钮状态
            btnPrev.disabled = (currentState === 0);
            btnNext.disabled = (currentState === totalSteps - 1);

            // 更新步骤指示器
            stepIndicator.textContent = `步骤 ${currentState + 1}/${totalSteps}`;
        }

        // 事件处理
        btnPrev.addEventListener('click', function() {
            if (currentState > 0) {
                currentState--;
                updateDisplay();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentState < totalSteps - 1) {
                currentState++;
                updateDisplay();
            }
        });

        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
