<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>尿液形成流程图 - 选项 A 验证</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: "Microsoft YaHei", sans-serif;
        }
        #scene2-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene2-svg {
            width: 800px;
            height: 500px;
        }
        .scene2-btn {
            cursor: pointer;
            border: 2px solid #333;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.2s;
        }
        .scene2-btn-active {
            background: #2e7d32;
            color: #fff;
            border-color: #2e7d32;
        }
        .scene2-btn-inactive {
            background: #fff;
            color: #333;
            border-color: #333;
        }
        .scene2-btn-inactive:hover {
            background: #f0f0f0;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500">
            <!-- 状态切换按钮区 (放在 SVG 内部) -->
            <g id="scene2-controls">
                <!-- 状态 1 按钮 -->
                <rect id="scene2-btn-normal-bg" x="150" y="20" width="120" height="35" rx="6" class="scene2-btn-active"/>
                <text id="scene2-btn-normal-text" x="210" y="43" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">正常状态</text>
                
                <!-- 状态 2 按钮 -->
                <rect id="scene2-btn-paralyzed-bg" x="530" y="20" width="150" height="35" rx="6" class="scene2-btn-inactive"/>
                <text id="scene2-btn-paralyzed-text" x="605" y="43" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">肾小管麻痹</text>
            </g>

            <!-- 共有元素：肾小球框 -->
            <g id="scene2-renal-group">
                <rect id="scene2-renal-rect" x="80" y="120" width="140" height="80" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                <text id="scene2-renal-text1" x="150" y="145" text-anchor="middle" font-size="13" fill="#000">血液流进</text>
                <text id="scene2-renal-text2" x="150" y="165" text-anchor="middle" font-size="13" fill="#000">肾小球中</text>
            </g>

            <!-- 共有元素：甲 (肾小囊) 框 -->
            <g id="scene2-jia-group">
                <rect id="scene2-jia-rect" x="300" y="120" width="100" height="80" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
                <text id="scene2-jia-text" x="350" y="165" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e7d32">甲</text>
            </g>

            <!-- 共有元素：乙 (肾小管) 框 -->
            <g id="scene2-yi-group">
                <rect id="scene2-yi-rect" x="520" y="120" width="100" height="80" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
                <text id="scene2-yi-text" x="570" y="165" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e7d32">乙</text>
            </g>

            <!-- 共有元素：箭头 1 (肾小球→甲) -->
            <g id="scene2-arrow1-group">
                <line id="scene2-arrow1-line" x1="220" y1="160" x2="290" y2="160" stroke="#000000" stroke-width="2"/>
                <polygon id="scene2-arrow1-head" points="290,160 280,155 280,165" fill="#000000"/>
            </g>

            <!-- 共有元素：箭头 2 (甲→乙) -->
            <g id="scene2-arrow2-group">
                <line id="scene2-arrow2-line" x1="400" y1="160" x2="510" y2="160" stroke="#2e7d32" stroke-width="2"/>
                <polygon id="scene2-arrow2-head" points="510,160 500,155 500,165" fill="#2e7d32"/>
            </g>

            <!-- 共有元素：蛋白质分子 -->
            <g id="scene2-protein-group">
                <ellipse id="scene2-protein-ellipse" cx="150" cy="100" rx="12" ry="9" fill="#c62828" fill-opacity="0.2" stroke="#c62828" stroke-width="2"/>
                <text id="scene2-protein-label" x="175" y="105" font-size="12" fill="#c62828">蛋白质</text>
            </g>

            <!-- 共有元素：蛋白质阻挡线 -->
            <g id="scene2-barrier-group">
                <line id="scene2-barrier-line" x1="215" y1="140" x2="215" y2="180" stroke="#000000" stroke-width="4"/>
            </g>

            <!-- 共有元素：a 标签 -->
            <text id="scene2-label-a" x="350" y="105" font-size="14" fill="#000">a</text>

            <!-- 共有元素：b 标签 -->
            <text id="scene2-label-b" x="570" y="105" font-size="14" fill="#000">b</text>

            <!-- 共有元素：原尿区标识 -->
            <text id="scene2-urine-a-label" x="350" y="220" text-anchor="middle" font-size="14" fill="#2e7d32">原尿 (a)</text>

            <!-- 共有元素：尿液区标识 -->
            <text id="scene2-urine-b-label" x="570" y="220" text-anchor="middle" font-size="14" fill="#2e7d32">尿液 (b)</text>

            <!-- 状态 2 特有元素：麻痹标识 -->
            <g id="scene2-paralyzed-badge" style="display: none;">
                <rect id="scene2-paralyzed-badge-bg" x="530" y="85" width="80" height="25" fill="#ffcdd2" stroke="#c62828" stroke-width="1"/>
                <text id="scene2-paralyzed-badge-text" x="570" y="103" text-anchor="middle" font-size="13" font-weight="bold" fill="#c62828">麻痹</text>
            </g>

            <!-- 结论区背景 -->
            <g id="scene2-conclusion-bg">
                <rect id="scene2-conclusion-rect" x="50" y="320" width="700" height="80" fill="#f5f5f5" stroke="#000000" stroke-width="1"/>
            </g>

            <!-- 结论文字 -->
            <text id="scene2-conclusion-text" x="400" y="355" text-anchor="middle" font-size="13" fill="#000">状态 1（正常）：蛋白质被肾小球阻挡，原尿 (a) 和尿液 (b) 中均无蛋白质</text>

            <!-- 状态 2 特有元素：错误标记× -->
            <g id="scene2-error-mark" style="display: none;">
                <line id="scene2-error-line1" x1="665" y1="335" x2="695" y2="365" stroke="#c62828" stroke-width="3"/>
                <line id="scene2-error-line2" x1="695" y1="335" x2="665" y2="365" stroke="#c62828" stroke-width="3"/>
            </g>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 2 实现：尿液形成流程图 - 选项 A 验证

        // 状态变量
        let currentState = 1; // 1=正常状态，2=肾小管麻痹

        // 获取 DOM 元素
        const btnNormalBg = document.getElementById('scene2-btn-normal-bg');
        const btnNormalText = document.getElementById('scene2-btn-normal-text');
        const btnParalyzedBg = document.getElementById('scene2-btn-paralyzed-bg');
        const btnParalyzedText = document.getElementById('scene2-btn-paralyzed-text');

        const yiRect = document.getElementById('scene2-yi-rect');
        const yiText = document.getElementById('scene2-yi-text');
        const arrow2Line = document.getElementById('scene2-arrow2-line');
        const arrow2Head = document.getElementById('scene2-arrow2-head');
        const urineBLabel = document.getElementById('scene2-urine-b-label');
        const paralyzedBadge = document.getElementById('scene2-paralyzed-badge');
        const conclusionText = document.getElementById('scene2-conclusion-text');
        const errorMark = document.getElementById('scene2-error-mark');

        // 更新按钮样式
        function updateButtons() {
            if (currentState === 1) {
                btnNormalBg.classList.remove('scene2-btn-inactive');
                btnNormalBg.classList.add('scene2-btn-active');
                btnNormalText.setAttribute('fill', '#fff');
                btnParalyzedBg.classList.remove('scene2-btn-active');
                btnParalyzedBg.classList.add('scene2-btn-inactive');
                btnParalyzedText.setAttribute('fill', '#333');
            } else {
                btnNormalBg.classList.remove('scene2-btn-active');
                btnNormalBg.classList.add('scene2-btn-inactive');
                btnNormalText.setAttribute('fill', '#333');
                btnParalyzedBg.classList.remove('scene2-btn-inactive');
                btnParalyzedBg.classList.add('scene2-btn-active');
                btnParalyzedText.setAttribute('fill', '#fff');
            }
        }

        // 更新状态显示
        function updateState() {
            if (currentState === 1) {
                // 正常状态
                yiRect.setAttribute('fill', '#e8f5e9');
                yiRect.setAttribute('stroke', '#2e7d32');
                yiText.setAttribute('fill', '#2e7d32');
                arrow2Line.setAttribute('stroke', '#2e7d32');
                arrow2Head.setAttribute('fill', '#2e7d32');
                urineBLabel.setAttribute('fill', '#2e7d32');
                urineBLabel.textContent = '尿液 (b)';
                paralyzedBadge.style.display = 'none';
                conclusionText.textContent = '✓ 正常状态下，蛋白质无法通过肾小球过滤膜，原尿和尿液中均不含蛋白质';
                errorMark.style.display = 'none';
            } else {
                // 肾小管麻痹状态
                yiRect.setAttribute('fill', '#ffcdd2');
                yiRect.setAttribute('stroke', '#c62828');
                yiText.setAttribute('fill', '#c62828');
                arrow2Line.setAttribute('stroke', '#c62828');
                arrow2Head.setAttribute('fill', '#c62828');
                urineBLabel.setAttribute('fill', '#c62828');
                urineBLabel.textContent = '尿液 (b)';
                paralyzedBadge.style.display = 'block';
                conclusionText.textContent = '✗ 选项 A 错误：即使肾小管 (乙) 被麻痹，蛋白质仍在肾小球处被阻挡，b(尿液) 中不会有蛋白质';
                errorMark.style.display = 'block';
            }
            updateButtons();
        }

        // 按钮点击事件
        btnNormalBg.addEventListener('click', function() {
            currentState = 1;
            updateState();
        });

        btnParalyzedBg.addEventListener('click', function() {
            currentState = 2;
            updateState();
        });

        // 初始化
        updateState();
    })();
    </script>
</body>
</html>
