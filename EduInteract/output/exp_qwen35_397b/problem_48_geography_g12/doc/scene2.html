<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>对跖点概念演示</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene2-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene2-svg {
            width: 800px;
            height: 500px;
        }
        .scene2-label {
            font-size: 14px;
            fill: #333333;
        }
        .scene2-hemisphere-label {
            font-size: 13px;
            fill: #666666;
        }
        .scene2-step-indicator {
            font-size: 16px;
            fill: #1565c0;
            font-weight: bold;
        }
        .scene2-btn {
            padding: 8px 16px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .scene2-btn-prev {
            background-color: #e0e0e0;
            color: #333333;
        }
        .scene2-btn-prev:hover:not(:disabled) {
            background-color: #bdbdbd;
        }
        .scene2-btn-next {
            background-color: #1565c0;
            color: #ffffff;
        }
        .scene2-btn-next:hover:not(:disabled) {
            background-color: #0d47a1;
        }
        .scene2-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #scene2-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 200px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500">
            <!-- 地球轮廓 -->
            <circle id="scene2-earth" cx="400" cy="250" r="150" fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 赤道线 -->
            <line id="scene2-equator" x1="250" y1="250" x2="550" y2="250" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>
            
            <!-- 地心 -->
            <circle id="scene2-center" cx="400" cy="250" r="6" fill="#000000"/>
            <text id="scene2-center-label" x="400" y="265" text-anchor="middle" class="scene2-label">地心</text>
            
            <!-- 北半球标签 -->
            <text id="scene2-north-label" x="400" y="120" text-anchor="middle" class="scene2-hemisphere-label">北半球</text>
            
            <!-- 南半球标签 -->
            <text id="scene2-south-label" x="400" y="380" text-anchor="middle" class="scene2-hemisphere-label">南半球</text>
            
            <!-- M 点 -->
            <circle id="scene2-point-m" cx="320" cy="180" r="8" fill="#1565c0"/>
            <text id="scene2-point-m-label" x="305" y="165" class="scene2-label">M</text>
            <text id="scene2-point-m-coord" x="280" y="140" class="scene2-label">60°N, 80°E</text>
            
            <!-- 对称连线（步骤 1 显示） -->
            <line id="scene2-symmetry-line" x1="320" y1="180" x2="480" y2="320" stroke="#c62828" stroke-width="3" stroke-dasharray="8,4" opacity="0"/>
            
            <!-- M'点（步骤 2 显示） -->
            <circle id="scene2-point-m-prime" cx="480" cy="320" r="8" fill="#2e7d32" opacity="0"/>
            <text id="scene2-point-m-prime-label" x="495" y="335" class="scene2-label" opacity="0">M'</text>
            
            <!-- M'坐标（步骤 3 显示） -->
            <text id="scene2-point-m-prime-coord" x="500" y="360" class="scene2-label" opacity="0">60°S, 100°W</text>
            
            <!-- 步骤指示器 -->
            <text id="scene2-step-indicator" x="400" y="30" text-anchor="middle" class="scene2-step-indicator">步骤 1/4</text>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-btn-prev" class="scene2-btn scene2-btn-prev" disabled>◀ 上一步</button>
            <button id="scene2-btn-next" class="scene2-btn scene2-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2: 对跖点概念演示
        
        // 状态变量
        let currentStep = 0;
        const totalSteps = 4;
        
        // 元素引用
        const symmetryLine = document.getElementById('scene2-symmetry-line');
        const pointMPrime = document.getElementById('scene2-point-m-prime');
        const pointMPrimeLabel = document.getElementById('scene2-point-m-prime-label');
        const pointMPrimeCoord = document.getElementById('scene2-point-m-prime-coord');
        const stepIndicator = document.getElementById('scene2-step-indicator');
        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        
        // 更新视图函数
        function updateView() {
            // 更新步骤指示器
            stepIndicator.textContent = `步骤 ${currentStep + 1}/${totalSteps}`;
            
            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps - 1);
            
            // 根据步骤显示/隐藏元素
            if (currentStep >= 1) {
                symmetryLine.style.opacity = '1';
            } else {
                symmetryLine.style.opacity = '0';
            }
            
            if (currentStep >= 2) {
                pointMPrime.style.opacity = '1';
                pointMPrimeLabel.style.opacity = '1';
            } else {
                pointMPrime.style.opacity = '0';
                pointMPrimeLabel.style.opacity = '0';
            }
            
            if (currentStep >= 3) {
                pointMPrimeCoord.style.opacity = '1';
            } else {
                pointMPrimeCoord.style.opacity = '0';
            }
        }
        
        // 上一步按钮事件
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateView();
            }
        });
        
        // 下一步按钮事件
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateView();
            }
        });
        
        // 初始化视图
        updateView();
    })();
    </script>
</body>
</html>
