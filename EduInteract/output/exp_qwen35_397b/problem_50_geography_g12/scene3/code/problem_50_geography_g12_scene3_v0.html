<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>线速度与正午太阳高度角对比</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene3-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene3-svg {
            width: 800px;
            height: 500px;
        }
        .scene3-btn {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border: 2px solid #333;
            border-radius: 4px;
            background: #fff;
            transition: all 0.3s;
        }
        .scene3-btn.active {
            background: #1565c0;
            color: #fff;
            border-color: #1565c0;
        }
        .scene3-btn:hover {
            background: #e3f2fd;
        }
        .scene3-btn.active:hover {
            background: #0d47a1;
        }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg id="scene3-svg" width="800" height="500">
            <!-- 地球圆 -->
            <circle id="scene3-earth-circle" cx="200" cy="250" r="120" fill="#e3f2fd" fill-opacity="0.5" stroke="#000000" stroke-width="2"/>
            
            <!-- 赤道线（虚线弧） -->
            <path id="scene3-equator" d="M 80 265 Q 200 280 320 265" fill="none" stroke="#666666" stroke-width="2" stroke-dasharray="5,5"/>
            <text id="scene3-equator-label" x="260" y="275" font-size="14" fill="#333">赤道</text>
            
            <!-- A 点（圆心，15°N） -->
            <circle id="scene3-point-a" cx="200" cy="250" r="5" fill="#333"/>
            <text id="scene3-label-a" x="210" y="240" font-size="16" font-weight="bold" fill="#000">A</text>
            <text id="scene3-lat-a" x="215" y="250" font-size="14" fill="#333">15°N</text>
            
            <!-- B 点（底部，75°S） -->
            <circle id="scene3-point-b" cx="200" cy="370" r="5" fill="#333"/>
            <text id="scene3-label-b" x="210" y="385" font-size="16" font-weight="bold" fill="#000">B</text>
            <text id="scene3-lat-b" x="215" y="370" font-size="14" fill="#333">75°S</text>
            
            <!-- C 点（顶部，75°N） -->
            <circle id="scene3-point-c" cx="200" cy="130" r="5" fill="#333"/>
            <text id="scene3-label-c" x="210" y="120" font-size="16" font-weight="bold" fill="#000">C</text>
            <text id="scene3-lat-c" x="215" y="130" font-size="14" fill="#333">75°N</text>
            
            <!-- 线速度柱状图区（状态 1 显示） -->
            <g id="scene3-velocity-group" style="display:none;">
                <!-- 柱 A（最长） -->
                <rect id="scene3-vel-bar-a" x="480" y="200" width="60" height="180" fill="#1565c0" fill-opacity="0.7"/>
                <text id="scene3-vel-label-a" x="510" y="185" font-size="14" fill="#1565c0" font-weight="bold">A</text>
                <text id="scene3-vel-value-a" x="510" y="190" font-size="14" fill="#1565c0">最大</text>
                
                <!-- 柱 B（短） -->
                <rect id="scene3-vel-bar-b" x="570" y="320" width="60" height="60" fill="#c62828" fill-opacity="0.7"/>
                <text id="scene3-vel-label-b" x="600" y="305" font-size="14" fill="#c62828" font-weight="bold">B</text>
                <text id="scene3-vel-value-b" x="600" y="310" font-size="14" fill="#c62828">小</text>
                
                <!-- 柱 C（与 B 等高） -->
                <rect id="scene3-vel-bar-c" x="660" y="320" width="60" height="60" fill="#2e7d32" fill-opacity="0.7"/>
                <text id="scene3-vel-label-c" x="690" y="305" font-size="14" fill="#2e7d32" font-weight="bold">C</text>
                <text id="scene3-vel-value-c" x="690" y="310" font-size="14" fill="#2e7d32">小</text>
                
                <!-- 线速度结论 -->
                <text id="scene3-conclusion-velocity" x="600" y="420" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">线速度：A &gt; B = C</text>
            </g>
            
            <!-- 正午太阳高度柱状图区（状态 2 显示） -->
            <g id="scene3-height-group" style="display:none;">
                <!-- 柱 A（最高，90°） -->
                <rect id="scene3-height-bar-a" x="480" y="170" width="60" height="210" fill="#1565c0" fill-opacity="0.7"/>
                <text id="scene3-height-label-a" x="510" y="155" font-size="14" fill="#1565c0" font-weight="bold">A</text>
                <text id="scene3-height-value-a" x="510" y="165" font-size="14" fill="#1565c0">90°</text>
                
                <!-- 柱 B（最低，0°） -->
                <rect id="scene3-height-bar-b" x="570" y="350" width="60" height="30" fill="#c62828" fill-opacity="0.7"/>
                <text id="scene3-height-label-b" x="600" y="335" font-size="14" fill="#c62828" font-weight="bold">B</text>
                <text id="scene3-height-value-b" x="600" y="345" font-size="14" fill="#c62828">0°</text>
                
                <!-- 柱 C（中等，30°） -->
                <rect id="scene3-height-bar-c" x="660" y="260" width="60" height="120" fill="#2e7d32" fill-opacity="0.7"/>
                <text id="scene3-height-label-c" x="690" y="245" font-size="14" fill="#2e7d32" font-weight="bold">C</text>
                <text id="scene3-height-value-c" x="690" y="255" font-size="14" fill="#2e7d32">30°</text>
                
                <!-- 正午太阳高度结论 -->
                <text id="scene3-conclusion-height" x="600" y="420" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">正午太阳高度：A(90°) &gt; C(30°) &gt; B(0°)</text>
            </g>
            
            <!-- 柱状图基线 -->
            <line id="scene3-base-line" x1="450" y1="380" x2="750" y2="380" stroke="#333" stroke-width="2"/>
            
            <!-- 标题 -->
            <text id="scene3-title" x="600" y="120" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">对比分析</text>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene3-controls" style="position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10;">
            <button id="scene3-btn-velocity" class="scene3-btn">线速度对比</button>
            <button id="scene3-btn-height" class="scene3-btn">正午太阳高度</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 3: 线速度与正午太阳高度角对比
        
        let currentState = 0; // 0: 初始, 1: 线速度, 2: 正午太阳高度
        
        const pointA = document.getElementById('scene3-point-a');
        const pointB = document.getElementById('scene3-point-b');
        const pointC = document.getElementById('scene3-point-c');
        
        const velocityGroup = document.getElementById('scene3-velocity-group');
        const heightGroup = document.getElementById('scene3-height-group');
        
        const btnVelocity = document.getElementById('scene3-btn-velocity');
        const btnHeight = document.getElementById('scene3-btn-height');
        
        // 重置所有点颜色
        function resetPoints() {
            pointA.setAttribute('fill', '#333');
            pointB.setAttribute('fill', '#333');
            pointC.setAttribute('fill', '#333');
        }
        
        // 显示线速度状态
        function showVelocity() {
            resetPoints();
            pointA.setAttribute('fill', '#1565c0'); // A 点高亮蓝色
            
            velocityGroup.style.display = 'block';
            heightGroup.style.display = 'none';
            
            btnVelocity.classList.add('active');
            btnHeight.classList.remove('active');
        }
        
        // 显示正午太阳高度状态
        function showHeight() {
            resetPoints();
            pointA.setAttribute('fill', '#1565c0'); // A 点高亮蓝色
            
            velocityGroup.style.display = 'none';
            heightGroup.style.display = 'block';
            
            btnVelocity.classList.remove('active');
            btnHeight.classList.add('active');
        }
        
        // 重置到初始状态
        function resetState() {
            resetPoints();
            velocityGroup.style.display = 'none';
            heightGroup.style.display = 'none';
            btnVelocity.classList.remove('active');
            btnHeight.classList.remove('active');
        }
        
        // 事件绑定
        btnVelocity.addEventListener('click', function() {
            if (currentState === 1) {
                resetState();
                currentState = 0;
            } else {
                showVelocity();
                currentState = 1;
            }
        });
        
        btnHeight.addEventListener('click', function() {
            if (currentState === 2) {
                resetState();
                currentState = 0;
            } else {
                showHeight();
                currentState = 2;
            }
        });
    })();
    </script>
</body>
</html>
