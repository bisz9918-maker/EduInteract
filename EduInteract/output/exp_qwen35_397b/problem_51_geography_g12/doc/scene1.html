<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地球光照图解析 - 夏至日</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-svg { width: 800px; height: 500px; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene1-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #333; border-radius: 4px; background: #f0f0f0; }
        .scene1-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene1-step { position: absolute; bottom: 15px; right: 20px; font-size: 14px; color: #666; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <!-- 地球外轮廓 -->
            <circle id="scene1-earth-outline" cx="400" cy="250" r="175" fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 北极圈虚线圆 -->
            <circle id="scene1-arctic-circle" cx="400" cy="250" r="70" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
            
            <!-- 北回归线虚线圆 -->
            <circle id="scene1-tropic-circle" cx="400" cy="250" r="160" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
            
            <!-- 黑夜阴影区（扇形，从 180°到 270°） -->
            <path id="scene1-night-shadow" d="M 400 250 L 225 250 A 175 175 0 0 1 400 75 Z" fill="#888888" opacity="0.3"/>
            
            <!-- 晨昏线（红色加粗弧线） -->
            <path id="scene1-terminator" d="M 225 250 A 175 175 0 0 1 400 75" fill="none" stroke="#c62828" stroke-width="3" style="display:none;"/>
            
            <!-- 自转箭头（逆时针，左侧外部） -->
            <path id="scene1-rotation-arrow" d="M 180 280 A 200 200 0 0 1 160 220" fill="none" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrowhead)"/>
            
            <!-- 箭头定义 -->
            <defs>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#1565c0"/>
                </marker>
                <marker id="scene1-sun-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#f9a825"/>
                </marker>
            </defs>
            
            <!-- 太阳光线箭头 -->
            <line id="scene1-sun-ray" x1="650" y1="250" x2="575" y2="250" stroke="#f9a825" stroke-width="2" marker-end="url(#scene1-sun-arrowhead)" style="display:none;"/>
            
            <!-- 太阳直射点 -->
            <circle id="scene1-sun-point" cx="560" cy="250" r="6" fill="#c62828" style="display:none;"/>
            
            <!-- 标签 -->
            <text id="scene1-label-0deg" x="210" y="240" font-size="14" fill="#000000">0°</text>
            <text id="scene1-label-arctic" x="400" y="175" font-size="12" fill="#000000" text-anchor="middle" style="display:none;">北极圈 66°34′N</text>
            <text id="scene1-label-tropic" x="400" y="85" font-size="12" fill="#000000" text-anchor="middle" style="display:none;">北回归线 23°26′N</text>
            <text id="scene1-label-terminator" x="350" y="180" font-size="12" fill="#c62828" style="display:none;">晨昏线</text>
            <text id="scene1-label-sun-coord" x="560" y="270" font-size="12" fill="#c62828" text-anchor="middle" style="display:none;">(23°26′N, 90°E)</text>
            <text id="scene1-label-solstice" x="400" y="30" font-size="16" fill="#000000" text-anchor="middle" font-weight="bold" style="display:none;">夏至日</text>
            
            <!-- 控件栏（放在 SVG 内部底部） -->
            <g id="scene1-controls">
                <rect id="scene1-btn-prev-bg" x="320" y="450" width="80" height="35" fill="#f0f0f0" stroke="#333" stroke-width="1" rx="4"/>
                <text id="scene1-btn-prev-text" x="360" y="472" font-size="14" text-anchor="middle" fill="#000000">◀ 上一步</text>
                <rect id="scene1-btn-next-bg" x="400" y="450" width="80" height="35" fill="#f0f0f0" stroke="#333" stroke-width="1" rx="4"/>
                <text id="scene1-btn-next-text" x="440" y="472" font-size="14" text-anchor="middle" fill="#000000">下一步 ▶</text>
                <text id="scene1-step-indicator" x="500" y="472" font-size="14" fill="#666">1/5</text>
            </g>
        </svg>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现 - 地球光照图分步解析
        
        let currentState = 0;
        const totalSteps = 5;
        
        // 获取 DOM 元素
        const terminator = document.getElementById('scene1-terminator');
        const labelTerminator = document.getElementById('scene1-label-terminator');
        const labelArctic = document.getElementById('scene1-label-arctic');
        const labelTropic = document.getElementById('scene1-label-tropic');
        const sunRay = document.getElementById('scene1-sun-ray');
        const sunPoint = document.getElementById('scene1-sun-point');
        const labelSunCoord = document.getElementById('scene1-label-sun-coord');
        const labelSolstice = document.getElementById('scene1-label-solstice');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        const btnPrevBg = document.getElementById('scene1-btn-prev-bg');
        const btnPrevText = document.getElementById('scene1-btn-prev-text');
        const btnNextBg = document.getElementById('scene1-btn-next-bg');
        const btnNextText = document.getElementById('scene1-btn-next-text');
        
        // 显示/隐藏辅助函数
        function show(el) {
            el.style.display = 'block';
            el.style.opacity = '1';
        }
        
        function hide(el) {
            el.style.display = 'none';
            el.style.opacity = '0';
        }
        
        // 更新状态
        function updateState() {
            // 重置所有动态元素
            hide(terminator);
            hide(labelTerminator);
            hide(labelArctic);
            hide(labelTropic);
            hide(sunRay);
            hide(sunPoint);
            hide(labelSunCoord);
            hide(labelSolstice);
            
            // 根据当前状态显示相应元素
            if (currentState >= 1) {
                show(terminator);
                show(labelTerminator);
            }
            if (currentState >= 2) {
                show(labelArctic);
                show(labelTropic);
            }
            if (currentState >= 3) {
                show(sunRay);
                show(sunPoint);
                show(labelSunCoord);
            }
            if (currentState >= 4) {
                show(labelSolstice);
            }
            
            // 更新步骤指示器
            stepIndicator.textContent = (currentState + 1) + '/' + totalSteps;
            
            // 更新按钮状态
            if (currentState === 0) {
                btnPrevBg.setAttribute('fill', '#e0e0e0');
                btnPrevText.setAttribute('fill', '#999');
            } else {
                btnPrevBg.setAttribute('fill', '#f0f0f0');
                btnPrevText.setAttribute('fill', '#000000');
            }
            
            if (currentState === totalSteps - 1) {
                btnNextBg.setAttribute('fill', '#e0e0e0');
                btnNextText.setAttribute('fill', '#999');
            } else {
                btnNextBg.setAttribute('fill', '#f0f0f0');
                btnNextText.setAttribute('fill', '#000000');
            }
        }
        
        // 按钮点击事件
        btnPrevBg.addEventListener('click', function() {
            if (currentState > 0) {
                currentState--;
                updateState();
            }
        });
        
        btnNextBg.addEventListener('click', function() {
            if (currentState < totalSteps - 1) {
                currentState++;
                updateState();
            }
        });
        
        // 添加按钮悬停效果
        btnPrevBg.addEventListener('mouseenter', function() {
            if (currentState > 0) {
                this.setAttribute('fill', '#e0e0e0');
            }
        });
        btnPrevBg.addEventListener('mouseleave', function() {
            if (currentState > 0) {
                this.setAttribute('fill', '#f0f0f0');
            }
        });
        
        btnNextBg.addEventListener('mouseenter', function() {
            if (currentState < totalSteps - 1) {
                this.setAttribute('fill', '#e0e0e0');
            }
        });
        btnNextBg.addEventListener('mouseleave', function() {
            if (currentState < totalSteps - 1) {
                this.setAttribute('fill', '#f0f0f0');
            }
        });
        
        // 初始化
        updateState();
    })();
    </script>
</body>
</html>
