<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地球光照图综合解析</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }
        .scene1-btn {
            width: 100px;
            height: 35px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .scene1-btn:hover {
            background: #1565c0;
        }
        .scene1-btn:disabled {
            background: #bdbdbd;
            cursor: not-allowed;
        }
        #scene1-step-indicator {
            font-size: 14px;
            color: #666666;
            min-width: 70px;
            text-align: center;
        }
        /* 斜线填充图案 */
        .scene1-hatch {
            fill: url(#scene1-hatch-pattern);
        }
        /* 20°W 经线高亮 */
        .scene1-20w-highlight {
            stroke: #1565c0;
            stroke-width: 3;
        }
        /* A、B 点高亮 */
        .scene1-point-highlight {
            fill: #c62828;
        }
        /* 步骤说明文字 */
        #scene1-step-text {
            font-size: 14px;
            fill: #333333;
        }
        /* 元素显隐控制 */
        .scene1-hidden {
            opacity: 0;
            display: none;
        }
        .scene1-visible {
            opacity: 1;
            display: block;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义斜线填充图案 -->
            <defs>
                <pattern id="scene1-hatch-pattern" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
                    <line x1="0" y1="0" x2="0" y2="10" stroke="#888888" stroke-width="1" opacity="0.5"/>
                </pattern>
            </defs>

            <!-- 步骤说明区 (顶部中央) -->
            <text id="scene1-step-text" x="400" y="50" text-anchor="middle" class="scene1-hidden">
                <tspan x="400" dy="0">阴影在南半球→南极圈极昼→冬至日</tspan>
                <tspan x="400" dy="20">→12 月 22 日前后</tspan>
            </text>

            <!-- ========== 左图：南半球俯视图（下半圆） ========== -->
            <!-- 外圆（下半圆） -->
            <path id="scene1-left-outer" d="M 100 280 A 100 100 0 0 1 300 280 L 200 280 Z" 
                  fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 赤道线（左图水平直径） -->
            <line id="scene1-left-equator" x1="100" y1="280" x2="300" y2="280" 
                  stroke="#000000" stroke-width="2"/>
            
            <!-- 南回归线（虚线圆弧，圆心 S，r≈65） -->
            <path id="scene1-left-tropic" d="M 135 280 A 65 65 0 0 1 265 280" 
                  fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
            
            <!-- 南极圈（虚线圆弧，圆心 S，r≈35） -->
            <path id="scene1-left-arctic" d="M 165 280 A 35 35 0 0 1 235 280" 
                  fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
            
            <!-- 经线（从南极点 S 辐射出的弧线） -->
            <!-- 普通经线 -->
            <path id="scene1-left-meridian-1" d="M 200 380 Q 170 340 150 280" 
                  fill="none" stroke="#000000" stroke-width="1.5"/>
            <path id="scene1-left-meridian-2" d="M 200 380 Q 185 330 175 280" 
                  fill="none" stroke="#000000" stroke-width="1.5"/>
            <!-- 20°W 经线（左图） -->
            <path id="scene1-20w-left" d="M 200 380 Q 200 330 200 280" 
                  fill="none" stroke="#000000" stroke-width="1.5"/>
            <path id="scene1-left-meridian-3" d="M 200 380 Q 215 330 225 280" 
                  fill="none" stroke="#000000" stroke-width="1.5"/>
            <path id="scene1-left-meridian-4" d="M 200 380 Q 230 340 250 280" 
                  fill="none" stroke="#000000" stroke-width="1.5"/>
            <path id="scene1-left-meridian-5" d="M 200 380 Q 245 350 270 290" 
                  fill="none" stroke="#000000" stroke-width="1.5"/>

            <!-- 左图阴影区（步骤 2 显示）- 从 20°W 向东 180°范围 -->
            <path id="scene1-left-shadow" class="scene1-hatch scene1-hidden" 
                  d="M 200 380 L 200 280 A 100 100 0 0 0 100 280 Z"/>

            <!-- 南极点 S -->
            <circle id="scene1-point-s" cx="200" cy="380" r="3" fill="#000000"/>
            <text id="scene1-label-s" x="200" y="405" text-anchor="middle" 
                  font-size="14" fill="#000000">S</text>

            <!-- B 点（左图赤道中点） -->
            <circle id="scene1-point-b" cx="200" cy="280" r="3" fill="#000000"/>
            <text id="scene1-label-b" x="200" y="250" text-anchor="middle" 
                  font-size="14" fill="#000000">B</text>

            <!-- 甲点（左图阴影边缘） -->
            <circle id="scene1-point-jia" cx="150" cy="280" r="3" fill="#000000"/>
            <text id="scene1-label-jia" x="150" y="250" text-anchor="middle" 
                  font-size="14" fill="#000000">甲</text>

            <!-- 20°W 标签（左图） -->
            <text id="scene1-label-20w-left" x="145" y="340" text-anchor="end" 
                  font-size="14" fill="#000000">20°W</text>

            <!-- 赤道标签（左图） -->
            <text id="scene1-label-equator-left" x="85" y="305" text-anchor="end" 
                  font-size="12" fill="#666666">赤道</text>

            <!-- ========== 右图：北半球侧视图（上半圆） ========== -->
            <!-- 外半圆（上半圆） -->
            <path id="scene1-right-outer" d="M 500 280 A 100 100 0 0 0 700 280 L 500 280 Z" 
                  fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 赤道线（右图水平直径） -->
            <line id="scene1-right-equator" x1="500" y1="280" x2="700" y2="280" 
                  stroke="#000000" stroke-width="2"/>
            
            <!-- 北回归线（虚线水平线，y≈235） -->
            <line id="scene1-right-tropic" x1="520" y1="235" x2="680" y2="235" 
                  stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
            
            <!-- 北极圈（虚线水平线，y≈205） -->
            <line id="scene1-right-arctic" x1="560" y1="205" x2="640" y2="205" 
                  stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
            
            <!-- 经线（从北极点 N 辐射出的弧线） -->
            <!-- 20°W 经线（右图） -->
            <path id="scene1-20w-right" d="M 600 180 Q 570 220 550 280" 
                  fill="none" stroke="#000000" stroke-width="1.5"/>
            <path id="scene1-right-meridian-1" d="M 600 180 Q 585 210 575 280" 
                  fill="none" stroke="#000000" stroke-width="1.5"/>
            <path id="scene1-right-meridian-2" d="M 600 180 Q 600 210 600 280" 
                  fill="none" stroke="#000000" stroke-width="1.5"/>
            <path id="scene1-right-meridian-3" d="M 600 180 Q 615 210 625 280" 
                  fill="none" stroke="#000000" stroke-width="1.5"/>
            <path id="scene1-right-meridian-4" d="M 600 180 Q 630 220 650 280" 
                  fill="none" stroke="#000000" stroke-width="1.5"/>
            <path id="scene1-right-meridian-5" d="M 600 180 Q 645 240 670 280" 
                  fill="none" stroke="#000000" stroke-width="1.5"/>

            <!-- 右图阴影区（步骤 4 显示）- 左半部分 -->
            <path id="scene1-right-shadow" class="scene1-hatch scene1-hidden" 
                  d="M 600 180 L 550 280 A 100 100 0 0 1 600 180 Z"/>

            <!-- 北极点 N -->
            <circle id="scene1-point-n" cx="600" cy="180" r="3" fill="#000000"/>
            <text id="scene1-label-n" x="600" y="160" text-anchor="middle" 
                  font-size="14" fill="#000000">N</text>

            <!-- A 点（右图赤道最右端） -->
            <circle id="scene1-point-a" cx="700" cy="280" r="3" fill="#000000"/>
            <text id="scene1-label-a" x="720" y="290" text-anchor="start" 
                  font-size="14" fill="#000000">A</text>

            <!-- C 点（右图赤道中点） -->
            <circle id="scene1-point-c" cx="600" cy="280" r="3" fill="#000000"/>
            <text id="scene1-label-c" x="600" y="320" text-anchor="middle" 
                  font-size="14" fill="#000000">C</text>

            <!-- 乙点（右图靠近北极） -->
            <circle id="scene1-point-yi" cx="600" cy="200" r="3" fill="#000000"/>
            <text id="scene1-label-yi" x="630" y="205" text-anchor="start" 
                  font-size="14" fill="#000000">乙</text>

            <!-- 20°W 标签（右图） -->
            <text id="scene1-label-20w-right" x="535" y="260" text-anchor="end" 
                  font-size="14" fill="#000000">20°W</text>

            <!-- 赤道标签（右图） -->
            <text id="scene1-label-equator-right" x="715" y="305" text-anchor="start" 
                  font-size="12" fill="#666666">赤道</text>

            <!-- 图 1-9 标签（两图中间底部） -->
            <text id="scene1-label-figure" x="380" y="410" text-anchor="middle" 
                  font-size="14" fill="#000000">图 1-9</text>

            <!-- 步骤 1 显示的经度标注 -->
            <text id="scene1-label-a-longitude" x="720" y="320" text-anchor="start" 
                  font-size="13" fill="#c62828" class="scene1-hidden">160°E</text>
            <text id="scene1-label-b-longitude" x="200" y="225" text-anchor="middle" 
                  font-size="13" fill="#c62828" class="scene1-hidden">20°W</text>

            <!-- 步骤 2 显示的日期说明 -->
            <text id="scene1-label-date" x="200" y="445" text-anchor="middle" 
                  font-size="13" fill="#1565c0" class="scene1-hidden">南极圈内极昼→12 月 22 日前后</text>

            <!-- 步骤 4 显示的北半球标注 -->
            <text id="scene1-label-north-day" x="670" y="235" text-anchor="start" 
                  font-size="13" fill="#1565c0" class="scene1-hidden">北半球昼短夜长</text>
        </svg>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/5</span>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现：地球光照图综合解析
        // 布局坐标表（实现对照依据）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // |------|------|-----------|------|-------------|------|
        // | 左图外圆（南半球） | 圆形 | 圆心 (200,280) | r=100 | - | 南半球俯视图 |
        // | 右图半圆（北半球） | 半圆 | 圆心 (600,280) | r=100 | - | 北半球侧视图 |
        // | 赤道线（左图） | 线段 | (100,280)-(300,280) | 200×2 | - | 左图水平直径 |
        // | 赤道线（右图） | 线段 | (500,280)-(700,280) | 200×2 | - | 右图水平直径 |
        // | 南极点 S | 点 | (200,380) | 4×4 | 下方 5px | 左图底部 |
        // | 北极点 N | 点 | (600,180) | 4×4 | 上方 5px | 右图顶部 |
        // | 20°W 经线（左图） | 弧线 | 从 S 向上 | 线宽 3 | 左侧 10px | 高亮蓝色 |
        // | 20°W 经线（右图） | 弧线 | 从 N 向下偏左 | 线宽 3 | 左侧 10px | 高亮蓝色 |
        // | A 点 | 点 | (700,280) | 5×5 | 右侧 8px | 右图赤道最右端 |
        // | B 点 | 点 | (200,280) | 5×5 | 上方 10px | 左图圆心正上方赤道 |
        // | C 点 | 点 | (600,280) | 5×5 | 下方 15px | 右图赤道中点 |
        // | 甲点 | 点 | (150,280) | 4×4 | 上方 10px | 左图阴影边缘 |
        // | 乙点 | 点 | (600,200) | 4×4 | 右侧 10px | 右图靠近北极 |

        let currentStep = 0;
        const totalSteps = 5;

        // 获取 DOM 元素
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');

        // 元素引用
        const elements = {
            stepText: document.getElementById('scene1-step-text'),
            // 20°W 经线
            w20Left: document.getElementById('scene1-20w-left'),
            w20Right: document.getElementById('scene1-20w-right'),
            // A、B 点
            pointA: document.getElementById('scene1-point-a'),
            pointB: document.getElementById('scene1-point-b'),
            // 经度标注
            labelALong: document.getElementById('scene1-label-a-longitude'),
            labelBLong: document.getElementById('scene1-label-b-longitude'),
            // 阴影区
            shadowLeft: document.getElementById('scene1-left-shadow'),
            shadowRight: document.getElementById('scene1-right-shadow'),
            // 日期说明
            labelDate: document.getElementById('scene1-label-date'),
            // 北半球标注
            labelNorthDay: document.getElementById('scene1-label-north-day')
        };

        // 显示/隐藏工具函数
        function show(el) {
            if (el) {
                el.classList.remove('scene1-hidden');
                el.classList.add('scene1-visible');
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }

        function hide(el) {
            if (el) {
                el.classList.remove('scene1-visible');
                el.classList.add('scene1-hidden');
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }

        // 更新显示状态
        function updateDisplay() {
            // 更新步骤指示器
            stepIndicator.textContent = `步骤 ${currentStep + 1}/${totalSteps}`;
            
            // 更新按钮状态
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps - 1;

            // 根据步骤显示/隐藏元素
            // 步骤 0：基础框架（所有元素默认显示，特殊元素隐藏）
            // 步骤 1：高亮 20°W 经线，显示 A、B 经度标注
            // 步骤 2：显示左图阴影，显示日期说明
            // 步骤 3：显示步骤说明文字
            // 步骤 4：显示右图阴影，显示北半球标注

            // 重置所有特殊元素
            hide(elements.stepText);
            hide(elements.labelALong);
            hide(elements.labelBLong);
            hide(elements.shadowLeft);
            hide(elements.shadowRight);
            hide(elements.labelDate);
            hide(elements.labelNorthDay);

            // 重置 20°W 经线样式
            elements.w20Left.setAttribute('stroke', '#000000');
            elements.w20Left.setAttribute('stroke-width', '1.5');
            elements.w20Right.setAttribute('stroke', '#000000');
            elements.w20Right.setAttribute('stroke-width', '1.5');

            // 重置 A、B 点颜色
            elements.pointA.setAttribute('fill', '#000000');
            elements.pointB.setAttribute('fill', '#000000');

            // 步骤 1 及以上：高亮 20°W 经线，显示 A、B 经度
            if (currentStep >= 1) {
                elements.w20Left.setAttribute('stroke', '#1565c0');
                elements.w20Left.setAttribute('stroke-width', '3');
                elements.w20Right.setAttribute('stroke', '#1565c0');
                elements.w20Right.setAttribute('stroke-width', '3');
                elements.pointA.setAttribute('fill', '#c62828');
                elements.pointB.setAttribute('fill', '#c62828');
                show(elements.labelALong);
                show(elements.labelBLong);
            }

            // 步骤 2 及以上：显示左图阴影和日期说明
            if (currentStep >= 2) {
                show(elements.shadowLeft);
                show(elements.labelDate);
            }

            // 步骤 3：显示步骤说明文字
            if (currentStep >= 3) {
                show(elements.stepText);
            }

            // 步骤 4：显示右图阴影和北半球标注
            if (currentStep >= 4) {
                show(elements.shadowRight);
                show(elements.labelNorthDay);
            }
        }

        // 上一步按钮点击事件
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        });

        // 下一步按钮点击事件
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateDisplay();
            }
        });

        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
