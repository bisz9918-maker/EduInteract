<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四棱锥截面比例关系</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene2-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene2-svg {
            width: 800px;
            height: 500px;
        }
        .scene2-label {
            font-size: 14px;
            fill: #000000;
        }
        .scene2-ratio-text {
            font-size: 16px;
            fill: #000000;
        }
        .scene2-conclusion-text {
            font-size: 16px;
            fill: #000000;
        }
        #scene2-slider-container {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        #scene2-slider {
            width: 400px;
        }
        #scene2-slider-label {
            font-size: 14px;
            color: #333;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500">
            <!-- △PAC 三角形边框 -->
            <path id="scene2-tri-pac" d="M 400 80 L 180 380 L 620 380 Z" fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 边 PA -->
            <line id="scene2-edge-pa" x1="400" y1="80" x2="180" y2="380" stroke="#000000" stroke-width="2"/>
            
            <!-- 边 AC -->
            <line id="scene2-edge-ac" x1="180" y1="380" x2="620" y2="380" stroke="#000000" stroke-width="2"/>
            
            <!-- 边 PC -->
            <line id="scene2-edge-pc" x1="400" y1="80" x2="620" y2="380" stroke="#000000" stroke-width="2"/>
            
            <!-- 线段 MN (红色) -->
            <line id="scene2-seg-mn" x1="268" y1="380" x2="440" y2="230" stroke="#c62828" stroke-width="2.5"/>
            
            <!-- 平行标记 - PA 中点附近 -->
            <g id="scene2-parallel-pa">
                <line x1="275" y1="215" x2="295" y2="225" stroke="#1565c0" stroke-width="2"/>
                <line x1="270" y1="225" x2="290" y2="235" stroke="#1565c0" stroke-width="2"/>
            </g>
            
            <!-- 平行标记 - MN 中点附近 -->
            <g id="scene2-parallel-mn">
                <line x1="340" y1="290" x2="360" y2="300" stroke="#1565c0" stroke-width="2"/>
                <line x1="335" y1="300" x2="355" y2="310" stroke="#1565c0" stroke-width="2"/>
            </g>
            
            <!-- 点 M -->
            <circle id="scene2-point-m" cx="268" cy="380" r="4" fill="#000000"/>
            
            <!-- 点 N -->
            <circle id="scene2-point-n" cx="440" cy="230" r="4" fill="#000000"/>
            
            <!-- 标签 P -->
            <text id="scene2-label-p" x="400" y="60" text-anchor="middle" class="scene2-label">P</text>
            
            <!-- 标签 A -->
            <text id="scene2-label-a" x="165" y="395" text-anchor="middle" class="scene2-label">A</text>
            
            <!-- 标签 C -->
            <text id="scene2-label-c" x="635" y="395" text-anchor="middle" class="scene2-label">C</text>
            
            <!-- 标签 M -->
            <text id="scene2-label-m" x="268" y="405" text-anchor="middle" class="scene2-label">M</text>
            
            <!-- 标签 N -->
            <text id="scene2-label-n" x="450" y="220" text-anchor="middle" class="scene2-label">N</text>
            
            <!-- 比例显示框背景 -->
            <rect id="scene2-ratio-bg" x="100" y="420" width="250" height="60" fill="#f5f5f5" stroke="#888888" stroke-width="1"/>
            
            <!-- 比例显示文字 -->
            <text id="scene2-ratio-text1" x="225" y="445" text-anchor="middle" class="scene2-ratio-text">CM:MA = 1:4</text>
            <text id="scene2-ratio-text2" x="225" y="470" text-anchor="middle" class="scene2-ratio-text">NC:NP = 1:4</text>
            
            <!-- 结论框背景 -->
            <rect id="scene2-conclusion-bg" x="500" y="420" width="250" height="60" fill="#f5f5f5" stroke="#888888" stroke-width="1"/>
            
            <!-- 结论文字 -->
            <text id="scene2-conclusion-text" x="625" y="455" text-anchor="middle" class="scene2-conclusion-text">NC:NP = CM:MA</text>
        </svg>
        
        <!-- 滑块控件 -->
        <div id="scene2-slider-container">
            <input type="range" id="scene2-slider" min="1" max="9" value="4" step="0.1"/>
            <span id="scene2-slider-label">CM:MA 比值</span>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现：平面 PAC 截面中的比例关系
        
        // 坐标常量
        const P = { x: 400, y: 80 };
        const A = { x: 180, y: 380 };
        const C = { x: 620, y: 380 };
        
        // DOM 元素
        const pointM = document.getElementById('scene2-point-m');
        const pointN = document.getElementById('scene2-point-n');
        const segMN = document.getElementById('scene2-seg-mn');
        const labelM = document.getElementById('scene2-label-m');
        const labelN = document.getElementById('scene2-label-n');
        const ratioText1 = document.getElementById('scene2-ratio-text1');
        const ratioText2 = document.getElementById('scene2-ratio-text2');
        const slider = document.getElementById('scene2-slider');
        const parallelPA = document.getElementById('scene2-parallel-pa');
        const parallelMN = document.getElementById('scene2-parallel-mn');
        
        // 计算 M 点位置 (在 AC 上)
        // ratio = MA/CM, 滑块值 1~9 对应 CM:MA = 1:1 到 1:9
        // t = MA/AC = ratio/(1+ratio)
        function calculateM(ratio) {
            const t = ratio / (1 + ratio);
            return {
                x: A.x + (C.x - A.x) * t,
                y: A.y + (C.y - A.y) * t
            };
        }
        
        // 计算 N 点位置 (在 PC 上)
        // 由 MN∥PA，利用相似三角形：PN/PC = CM/CA = 1/(1+ratio)
        // N = P + (C-P) * (1/(1+ratio))
        function calculateN(ratio) {
            const t = 1 / (1 + ratio);
            return {
                x: P.x + (C.x - P.x) * t,
                y: P.y + (C.y - P.y) * t
            };
        }
        
        // 格式化比例为整数比显示
        function formatRatio(ratio) {
            // ratio = MA/CM, 我们要显示 CM:MA = 1:ratio
            // 将 ratio 转换为最简整数比
            const denominator = Math.round(ratio * 10) / 10;
            if (Number.isInteger(denominator)) {
                return `1:${denominator}`;
            } else {
                // 尝试找到近似的整数比
                for (let d = 1; d <= 10; d++) {
                    const n = d * ratio;
                    if (Math.abs(n - Math.round(n)) < 0.05) {
                        return `${d}:${Math.round(n)}`;
                    }
                }
                return `1:${denominator.toFixed(1)}`;
            }
        }
        
        // 更新平行标记位置
        function updateParallelMarks(m, n) {
            // PA 中点
            const paMid = {
                x: (P.x + A.x) / 2,
                y: (P.y + A.y) / 2
            };
            // PA 方向向量
            const paDir = { x: A.x - P.x, y: A.y - P.y };
            const paLen = Math.sqrt(paDir.x ** 2 + paDir.y ** 2);
            const paUnit = { x: paDir.x / paLen, y: paDir.y / paLen };
            // 垂直方向
            const paPerp = { x: -paUnit.y, y: paUnit.x };
            
            // 更新 PA 平行标记
            const paLines = parallelPA.querySelectorAll('line');
            paLines[0].setAttribute('x1', paMid.x - 10 * paUnit.x + 5 * paPerp.x);
            paLines[0].setAttribute('y1', paMid.y - 10 * paUnit.y + 5 * paPerp.y);
            paLines[0].setAttribute('x2', paMid.x + 10 * paUnit.x + 5 * paPerp.x);
            paLines[0].setAttribute('y2', paMid.y + 10 * paUnit.y + 5 * paPerp.y);
            paLines[1].setAttribute('x1', paMid.x - 10 * paUnit.x - 5 * paPerp.x);
            paLines[1].setAttribute('y1', paMid.y - 10 * paUnit.y - 5 * paPerp.y);
            paLines[1].setAttribute('x2', paMid.x + 10 * paUnit.x - 5 * paPerp.x);
            paLines[1].setAttribute('y2', paMid.y + 10 * paUnit.y - 5 * paPerp.y);
            
            // MN 中点
            const mnMid = {
                x: (m.x + n.x) / 2,
                y: (m.y + n.y) / 2
            };
            // MN 方向向量
            const mnDir = { x: n.x - m.x, y: n.y - m.y };
            const mnLen = Math.sqrt(mnDir.x ** 2 + mnDir.y ** 2);
            const mnUnit = { x: mnDir.x / mnLen, y: mnDir.y / mnLen };
            // 垂直方向
            const mnPerp = { x: -mnUnit.y, y: mnUnit.x };
            
            // 更新 MN 平行标记
            const mnLines = parallelMN.querySelectorAll('line');
            mnLines[0].setAttribute('x1', mnMid.x - 10 * mnUnit.x + 5 * mnPerp.x);
            mnLines[0].setAttribute('y1', mnMid.y - 10 * mnUnit.y + 5 * mnPerp.y);
            mnLines[0].setAttribute('x2', mnMid.x + 10 * mnUnit.x + 5 * mnPerp.x);
            mnLines[0].setAttribute('y2', mnMid.y + 10 * mnUnit.y + 5 * mnPerp.y);
            mnLines[1].setAttribute('x1', mnMid.x - 10 * mnUnit.x - 5 * mnPerp.x);
            mnLines[1].setAttribute('y1', mnMid.y - 10 * mnUnit.y - 5 * mnPerp.y);
            mnLines[1].setAttribute('x2', mnMid.x + 10 * mnUnit.x - 5 * mnPerp.x);
            mnLines[1].setAttribute('y2', mnMid.y + 10 * mnUnit.y - 5 * mnPerp.y);
        }
        
        // 主更新函数
        function update(ratio) {
            const m = calculateM(ratio);
            const n = calculateN(ratio);
            
            // 更新 M 点
            pointM.setAttribute('cx', m.x);
            pointM.setAttribute('cy', m.y);
            
            // 更新 N 点
            pointN.setAttribute('cx', n.x);
            pointN.setAttribute('cy', n.y);
            
            // 更新 MN 线段
            segMN.setAttribute('x1', m.x);
            segMN.setAttribute('y1', m.y);
            segMN.setAttribute('x2', n.x);
            segMN.setAttribute('y2', n.y);
            
            // 更新标签位置
            labelM.setAttribute('x', m.x);
            labelM.setAttribute('y', m.y + 25);
            labelN.setAttribute('x', n.x + 10);
            labelN.setAttribute('y', n.y - 10);
            
            // 更新比例显示
            const ratioStr = formatRatio(ratio);
            ratioText1.textContent = `CM:MA = ${ratioStr}`;
            ratioText2.textContent = `NC:NP = ${ratioStr}`;
            
            // 更新平行标记
            updateParallelMarks(m, n);
        }
        
        // 滑块事件监听
        slider.addEventListener('input', function() {
            const ratio = parseFloat(this.value);
            update(ratio);
        });
        
        // 初始状态：CM:MA = 1:4，即 ratio = MA/CM = 4
        update(4);
        
    })();
    </script>
</body>
</html>
