<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>长方体表面最短路径</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: "Microsoft YaHei", sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        .scene1-btn {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #333;
            border-radius: 4px;
            background: #f0f0f0;
            transition: background 0.2s;
        }
        .scene1-btn:hover:not(:disabled) {
            background: #e0e0e0;
        }
        .scene1-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .scene1-step-indicator {
            font-size: 14px;
            color: #666;
            padding: 8px 12px;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 背景 -->
            <rect width="800" height="500" fill="#ffffff"/>
            
            <!-- 左侧长方体区域 (60,120)-(240,340) -->
            <g id="scene1-cuboid-group">
                <!-- 长方体线框 - 前面矩形 -->
                <rect id="scene1-front-face" x="60" y="120" width="120" height="200" 
                      fill="none" stroke="#000000" stroke-width="1.5"/>
                
                <!-- 右侧面平行四边形 -->
                <path id="scene1-right-face" d="M180,120 L240,140 L240,340 L180,320 Z" 
                      fill="none" stroke="#000000" stroke-width="1.5"/>
                
                <!-- 顶面平行四边形 -->
                <path id="scene1-top-face" d="M60,120 L180,120 L240,140 L120,140 Z" 
                      fill="none" stroke="#000000" stroke-width="1.5"/>
                
                <!-- 不可见棱（虚线） -->
                <line id="scene1-hidden-edge1" x1="60" y1="320" x2="120" y2="340" 
                      stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5"/>
                <line id="scene1-hidden-edge2" x1="120" y1="140" x2="120" y2="340" 
                      stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5"/>
                <line id="scene1-hidden-edge3" x1="120" y1="340" x2="240" y2="340" 
                      stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5"/>
                
                <!-- 顶点标注 -->
                <circle id="scene1-point-a" cx="60" cy="320" r="4" fill="#000000"/>
                <circle id="scene1-point-c" cx="180" cy="320" r="4" fill="#000000"/>
                <circle id="scene1-point-d" cx="240" cy="340" r="4" fill="#000000"/>
                <circle id="scene1-point-f" cx="240" cy="220" r="4" fill="#000000"/>
                
                <!-- 顶点标签 -->
                <text id="scene1-label-a" x="45" y="340" font-size="14" fill="#000000">A</text>
                <text id="scene1-label-c" x="195" y="340" font-size="14" fill="#000000">C</text>
                <text id="scene1-label-d" x="255" y="360" font-size="14" fill="#000000">D</text>
                <text id="scene1-label-f" x="258" y="220" font-size="14" fill="#000000">F</text>
                
                <!-- 边长标注 -->
                <text id="scene1-label-ac" x="120" y="335" font-size="13" fill="#555555" text-anchor="middle">AC=5</text>
                <text id="scene1-label-cd" x="215" y="345" font-size="13" fill="#555555" text-anchor="middle">CD=3</text>
                <text id="scene1-label-df" x="250" y="280" font-size="13" fill="#555555" text-anchor="middle">DF=6</text>
            </g>
            
            <!-- 右侧展开图区域 (320,80)-(760,380) -->
            <g id="scene1-unfold-group">
                <!-- 背景框 -->
                <rect x="320" y="80" width="440" height="300" 
                      fill="#fafafa" stroke="#cccccc" stroke-width="1"/>
                
                <!-- 初始提示文字 -->
                <text id="scene1-unfold-hint" x="540" y="230" font-size="16" fill="#666666" text-anchor="middle">
                    请选择展开方式
                </text>
                
                <!-- 展开图矩形1（前面） -->
                <g id="scene1-unfold-rect1" style="opacity: 0;">
                    <rect x="340" y="150" width="200" height="150" 
                          fill="#f5f5f5" stroke="#000000" stroke-width="1.5"/>
                </g>
                
                <!-- 展开图矩形2（右侧面） -->
                <g id="scene1-unfold-rect2" style="opacity: 0;">
                    <rect x="540" y="150" width="150" height="150" 
                          fill="#f0f0f0" stroke="#000000" stroke-width="1.5"/>
                </g>
                
                <!-- 路径线 -->
                <line id="scene1-path-line" x1="0" y1="0" x2="0" y2="0" 
                      stroke="#c62828" stroke-width="3" style="opacity: 0;"/>
                
                <!-- 辅助虚线 -->
                <g id="scene1-aux-lines" style="opacity: 0;">
                    <line x1="340" y1="300" x2="690" y2="300" 
                          stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
                    <line x1="690" y1="150" x2="690" y2="300" 
                          stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
                </g>
                
                <!-- 展开图标签 -->
                <g id="scene1-unfold-labels" style="opacity: 0;">
                    <text x="335" y="315" font-size="12" fill="#000000">A</text>
                    <text x="695" y="185" font-size="12" fill="#000000">F</text>
                </g>
            </g>
            
            <!-- 计算式文本区 -->
            <text id="scene1-calc-text" x="540" y="420" font-size="14" fill="#333333" text-anchor="middle">
                
            </text>
            
            <!-- 结论文本 -->
            <g id="scene1-conclusion" style="opacity: 0;">
                <rect x="340" y="360" width="400" height="30" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
                <text x="540" y="382" font-size="15" fill="#2e7d32" text-anchor="middle" font-weight="bold">
                    最短距离 = 10 cm（前面 + 右侧面展开）
                </text>
            </g>
            
            <!-- 控件栏（SVG 内部底部） -->
            <g id="scene1-controls">
                <rect x="250" y="450" width="300" height="40" fill="none"/>
                <text id="scene1-btn-prev" x="280" y="475" font-size="14" fill="#333333" 
                      class="scene1-btn" style="cursor: pointer;">◀ 上一步</text>
                <text id="scene1-btn-next" x="420" y="475" font-size="14" fill="#333333" 
                      class="scene1-btn" style="cursor: pointer;">下一步 ▶</text>
                <text id="scene1-step-indicator" x="550" y="475" font-size="14" fill="#666666" text-anchor="middle">
                    步骤 1/5
                </text>
            </g>
        </svg>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现：长方体表面最短路径
        
        // 布局坐标表（实现对照依据）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // |------|------|-----------|------|-------------|------|
        // | 长方体 - 前面 | 矩形线框 | (60,120)-(180,320) | 120×200 | - | 左侧固定 |
        // | 长方体 - 右侧面 | 平行四边形 | (180,120)-(240,140)-(240,340)-(180,320) | 60×200 | - | 透视效果 |
        // | 长方体 - 顶面 | 平行四边形 | (60,120)-(180,120)-(240,140)-(120,140) | 120×60 | - | 透视效果 |
        // | 点 A | 圆点 | (60,320) | r=4 | 左下偏移 (-15,+20) | 底面左下角 |
        // | 点 C | 圆点 | (180,320) | r=4 | 右下偏移 (+15,+20) | 底面右下角 |
        // | 点 D | 圆点 | (240,340) | r=4 | 右下偏移 (+15,+20) | 右侧面右下角 |
        // | 点 F | 圆点 | (240,220) | r=4 | 右侧偏移 (+18,0) | 右侧棱中点偏上 |
        // | 标签 A | text | (45,340) | ~20×16 | - | 点 A 左下方 |
        // | 标签 C | text | (195,340) | ~20×16 | - | 点 C 右下方 |
        // | 标签 D | text | (255,360) | ~20×16 | - | 点 D 右下方 |
        // | 标签 F | text | (258,220) | ~20×16 | - | 点 F 右侧 |
        // | 边长 AC=5 | 标注 | (120,335) | ~50×16 | 下方 | AC 线段中点下方 |
        // | 边长 CD=3 | 标注 | (215,345) | ~50×16 | 右下方 | CD 线段右侧 |
        // | 边长 DF=6 | 标注 | (250,280) | ~50×16 | 右侧 | DF 线段右侧 |
        // | 展开图区 - 背景框 | 矩形 | (320,80)-(760,380) | 440×300 | - | 右侧动态区 |
        // | 控件栏 | 按钮组 | (250,450)-(550,480) | 300×30 | - | SVG 内底部 |
        
        let currentStep = 0;
        const totalSteps = 5;
        
        // 获取 DOM 元素
        const unfoldHint = document.getElementById('scene1-unfold-hint');
        const unfoldRect1 = document.getElementById('scene1-unfold-rect1');
        const unfoldRect2 = document.getElementById('scene1-unfold-rect2');
        const pathLine = document.getElementById('scene1-path-line');
        const auxLines = document.getElementById('scene1-aux-lines');
        const unfoldLabels = document.getElementById('scene1-unfold-labels');
        const calcText = document.getElementById('scene1-calc-text');
        const conclusion = document.getElementById('scene1-conclusion');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        
        // 显示/隐藏辅助函数
        function show(el) {
            el.style.opacity = '1';
            el.style.display = 'block';
        }
        
        function hide(el) {
            el.style.opacity = '0';
            el.style.display = 'none';
        }
        
        // 更新步骤显示
        function updateScene() {
            // 重置所有动态元素
            hide(unfoldHint);
            hide(unfoldRect1);
            hide(unfoldRect2);
            hide(pathLine);
            hide(auxLines);
            hide(unfoldLabels);
            hide(conclusion);
            calcText.textContent = '';
            
            // 更新按钮状态
            btnPrev.style.pointerEvents = currentStep > 0 ? 'auto' : 'none';
            btnPrev.style.opacity = currentStep > 0 ? '1' : '0.5';
            btnNext.style.pointerEvents = currentStep < totalSteps - 1 ? 'auto' : 'none';
            btnNext.style.opacity = currentStep < totalSteps - 1 ? '1' : '0.5';
            
            stepIndicator.textContent = `步骤 ${currentStep + 1}/${totalSteps}`;
            
            // 根据步骤显示不同内容
            switch (currentStep) {
                case 0:
                    // 初始状态：只显示提示
                    show(unfoldHint);
                    break;
                    
                case 1:
                    // 展开前面 + 右侧面
                    show(unfoldRect1);
                    show(unfoldRect2);
                    show(auxLines);
                    show(unfoldLabels);
                    show(pathLine);
                    // 设置路径线坐标：A(340,300) 到 F(690,185)
                    pathLine.setAttribute('x1', '340');
                    pathLine.setAttribute('y1', '300');
                    pathLine.setAttribute('x2', '690');
                    pathLine.setAttribute('y2', '185');
                    calcText.textContent = '√[(5+3)² + 6²] = √(64+36) = √100 = 10 cm';
                    break;
                    
                case 2:
                    // 展开底面 + 右侧面
                    show(unfoldRect1);
                    show(unfoldRect2);
                    show(auxLines);
                    show(unfoldLabels);
                    show(pathLine);
                    // 垂直拼接：底面 (340,150,200×150) + 右侧面 (340,300,150×150)
                    unfoldRect1.querySelector('rect').setAttribute('x', '340');
                    unfoldRect1.querySelector('rect').setAttribute('y', '150');
                    unfoldRect2.querySelector('rect').setAttribute('x', '340');
                    unfoldRect2.querySelector('rect').setAttribute('y', '300');
                    unfoldRect2.querySelector('rect').setAttribute('width', '150');
                    unfoldRect2.querySelector('rect').setAttribute('height', '150');
                    // 路径：A(340,150) 到 F(490,365)
                    pathLine.setAttribute('x1', '340');
                    pathLine.setAttribute('y1', '150');
                    pathLine.setAttribute('x2', '490');
                    pathLine.setAttribute('y2', '365');
                    calcText.textContent = '√[5² + (3+6)²] = √(25+81) = √106 ≈ 10.30 cm';
                    break;
                    
                case 3:
                    // 展开前面 + 顶面
                    show(unfoldRect1);
                    show(unfoldRect2);
                    show(auxLines);
                    show(unfoldLabels);
                    show(pathLine);
                    // 垂直拼接：前面 (340,150,200×150) + 顶面 (340,50,200×100)
                    unfoldRect1.querySelector('rect').setAttribute('x', '340');
                    unfoldRect1.querySelector('rect').setAttribute('y', '150');
                    unfoldRect2.querySelector('rect').setAttribute('x', '340');
                    unfoldRect2.querySelector('rect').setAttribute('y', '50');
                    unfoldRect2.querySelector('rect').setAttribute('width', '200');
                    unfoldRect2.querySelector('rect').setAttribute('height', '100');
                    // 路径：A(340,300) 到 F(540,50)
                    pathLine.setAttribute('x1', '340');
                    pathLine.setAttribute('y1', '300');
                    pathLine.setAttribute('x2', '540');
                    pathLine.setAttribute('y2', '50');
                    calcText.textContent = '√[(5+6)² + 3²] = √(121+9) = √130 ≈ 11.40 cm';
                    break;
                    
                case 4:
                    // 结论
                    show(conclusion);
                    calcText.textContent = '比较三种展开：10 cm < 10.30 cm < 11.40 cm';
                    break;
            }
        }
        
        // 按钮点击事件
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });
        
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateScene();
            }
        });
        
        // 初始化
        updateScene();
        
    })();
    </script>
</body>
</html>
