<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抛物线几何配置</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        .scene1-btn {
            position: absolute;
            bottom: 15px;
            padding: 8px 16px;
            font-size: 14px;
            background: #1565c0;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .scene1-btn:hover {
            background: #0d47a1;
        }
        .scene1-btn:disabled {
            background: #bdbdbd;
            cursor: not-allowed;
        }
        #scene1-prev-btn {
            left: 280px;
        }
        #scene1-next-btn {
            left: 440px;
        }
        #scene1-step-indicator {
            position: absolute;
            bottom: 20px;
            left: 380px;
            font-size: 14px;
            color: #424242;
        }
        .scene1-pulse {
            animation: scene1-pulse-animation 1.5s ease-in-out infinite;
        }
        @keyframes scene1-pulse-animation {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 坐标轴 -->
            <line id="scene1-axis-x" x1="80" y1="250" x2="720" y2="250" stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrow)" />
            <line id="scene1-axis-y" x1="250" y1="470" x2="250" y2="30" stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrow)" />
            
            <!-- 箭头定义 -->
            <defs>
                <marker id="scene1-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#000000" />
                </marker>
            </defs>
            
            <!-- 准线（步骤1显示） -->
            <line id="scene1-directrix" x1="100" y1="80" x2="100" y2="420" stroke="#888888" stroke-width="2" stroke-dasharray="8,4" opacity="0" />
            
            <!-- 抛物线（顶点在原点O(250,250)，开口向右） -->
            <!-- y^2 = 2px, p=300, 所以 y^2 = 600x' 其中x'是相对于顶点的坐标 -->
            <path id="scene1-parabola" d="M 250,440 C 280,380 320,320 380,280 C 440,250 440,250 380,220 C 320,180 280,120 250,60" 
                  fill="none" stroke="#000000" stroke-width="2" opacity="1" />
            
            <!-- 焦点F（步骤1显示） -->
            <circle id="scene1-point-F" cx="400" cy="250" r="5" fill="#c62828" opacity="0" />
            
            <!-- 圆F（步骤3显示） -->
            <circle id="scene1-circle-F" cx="400" cy="250" r="75" fill="none" stroke="#1565c0" stroke-width="1.5" opacity="0" />
            
            <!-- 点A（步骤2显示） -->
            <circle id="scene1-point-A" cx="550" cy="120" r="4" fill="#000000" opacity="0" />
            
            <!-- 线段AF（步骤2显示） -->
            <line id="scene1-segment-AF" x1="400" y1="250" x2="550" y2="120" stroke="#000000" stroke-width="2" opacity="0" />
            
            <!-- 点B（步骤3显示） -->
            <circle id="scene1-point-B" cx="437" cy="185" r="4" fill="#000000" opacity="0" />
            
            <!-- 点N（步骤4显示） -->
            <circle id="scene1-point-N" cx="250" cy="120" r="4" fill="#000000" opacity="0" />
            
            <!-- 线段AN（步骤4显示） -->
            <line id="scene1-segment-AN" x1="250" y1="120" x2="550" y2="120" stroke="#888888" stroke-width="2" stroke-dasharray="6,3" opacity="0" />
            
            <!-- 线段ON（步骤4显示） -->
            <line id="scene1-segment-ON" x1="250" y1="250" x2="250" y2="120" stroke="#2e7d32" stroke-width="2" opacity="0" />
            
            <!-- 线段NB（步骤4显示） -->
            <line id="scene1-segment-NB" x1="250" y1="120" x2="437" y2="185" stroke="#2e7d32" stroke-width="2" opacity="0" />
            
            <!-- ∠AFx 角度弧（步骤2显示） -->
            <path id="scene1-angle-AFx" d="M 435,250 A 35,35 0 0,0 417.5,219.5" fill="none" stroke="#1565c0" stroke-width="1.5" opacity="0" />
            
            <!-- ∠ONB 角度弧（步骤5显示） -->
            <path id="scene1-angle-ONB" d="M 280,120 A 30,30 0 0,0 265,140" fill="rgba(21,101,192,0.2)" stroke="#1565c0" stroke-width="1.5" opacity="0" />
            
            <!-- 标签 -->
            <text id="scene1-label-O" x="235" y="270" font-size="14" fill="#000000" opacity="1">O</text>
            <text id="scene1-label-F" x="400" y="268" font-size="14" fill="#000000" opacity="0">F</text>
            <text id="scene1-label-A" x="562" y="110" font-size="14" fill="#000000" opacity="0">A</text>
            <text id="scene1-label-B" x="449" y="197" font-size="14" fill="#000000" opacity="0">B</text>
            <text id="scene1-label-N" x="232" y="120" font-size="14" fill="#000000" opacity="0">N</text>
            <text id="scene1-label-x" x="705" y="255" font-size="14" fill="#000000" opacity="1">x</text>
            <text id="scene1-label-y" x="255" y="40" font-size="14" fill="#000000" opacity="1">y</text>
            <text id="scene1-label-60deg" x="445" y="235" font-size="14" fill="#1565c0" opacity="0">60°</text>
            <text id="scene1-label-p2" x="365" y="255" font-size="14" fill="#888888" opacity="0">p/2</text>
            
            <!-- 原点O标记 -->
            <circle id="scene1-point-O" cx="250" cy="250" r="3" fill="#000000" opacity="1" />
        </svg>
        
        <!-- 控件栏 -->
        <button id="scene1-prev-btn" class="scene1-btn">◀ 上一步</button>
        <div id="scene1-step-indicator">步骤 0/5</div>
        <button id="scene1-next-btn" class="scene1-btn">下一步 ▶</button>
    </div>
    
    <script>
    (function() {
        // Scene 1: 抛物线几何配置与已知条件展示
        // 布局坐标表（实现对照依据）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // | x 轴 | 线段 | (80,250)-(720,250) | 640×3 | - | 水平居中，带箭头 |
        // | y 轴 | 线段 | (250,470)-(250,30) | 3×440 | - | 垂直居中，带箭头 |
        // | 原点 O | 点 | (250,250) | r=3 | 左下 (-15,+20) | 坐标轴交点 |
        // | 抛物线 | 曲线 | 顶点 (250,250)，开口向右 | 宽 450，高 380 | - | y²=2px |
        // | 焦点 F | 点 | (400,250) | r=5 | 下方 (0,+18) | x 轴正半轴 |
        // | 准线 | 虚线 | (100,80)-(100,420) | 3×340 | - | x=-p/2，灰色虚线 |
        // | 点 A | 点 | (550,120) | r=4 | 右上 (+12,-10) | 第一象限抛物线上 |
        // | 线段 AF | 线段 | (400,250)-(550,120) | ~190×2 | - | 与 x 轴夹角 60° |
        // | 圆 F | 圆弧 | 圆心 (400,250)，半径 75 | r=75 | - | p/2 为半径 |
        // | 点 B | 点 | (437,185) | r=4 | 右下 (+12,+12) | 圆 F 与 AF 交点 |
        // | 点 N | 点 | (250,120) | r=4 | 左侧 (-18,0) | A 在 y 轴垂足 |
        // | 线段 AN | 虚线 | (250,120)-(550,120) | 300×2 | - | A 到 y 轴垂线 |
        // | 线段 ON | 线段 | (250,250)-(250,120) | 3×130 | - | y 轴上一段，绿色 |
        // | 线段 NB | 线段 | (250,120)-(437,185) | ~200×2 | - | 绿色高亮 |
        // | ∠AFx 弧 | 圆弧 | 圆心 (400,250)，r=35 | 60°扇形弧 | - | 蓝色 |
        // | ∠ONB 弧 | 圆弧 | 圆心 (250,120)，r=30 | 扇形弧 | - | 蓝色高亮待求角 |

        let currentState = 0;
        const totalSteps = 5;

        // 每步可见元素配置
        const steps = {
            0: ['scene1-axis-x', 'scene1-axis-y', 'scene1-parabola', 'scene1-label-O', 'scene1-label-x', 'scene1-label-y', 'scene1-point-O'],
            1: ['scene1-axis-x', 'scene1-axis-y', 'scene1-parabola', 'scene1-label-O', 'scene1-label-x', 'scene1-label-y', 'scene1-point-O',
                'scene1-directrix', 'scene1-point-F', 'scene1-label-F', 'scene1-label-p2'],
            2: ['scene1-axis-x', 'scene1-axis-y', 'scene1-parabola', 'scene1-label-O', 'scene1-label-x', 'scene1-label-y', 'scene1-point-O',
                'scene1-directrix', 'scene1-point-F', 'scene1-label-F', 'scene1-label-p2',
                'scene1-point-A', 'scene1-segment-AF', 'scene1-angle-AFx', 'scene1-label-A', 'scene1-label-60deg'],
            3: ['scene1-axis-x', 'scene1-axis-y', 'scene1-parabola', 'scene1-label-O', 'scene1-label-x', 'scene1-label-y', 'scene1-point-O',
                'scene1-directrix', 'scene1-point-F', 'scene1-label-F', 'scene1-label-p2',
                'scene1-point-A', 'scene1-segment-AF', 'scene1-angle-AFx', 'scene1-label-A', 'scene1-label-60deg',
                'scene1-circle-F', 'scene1-point-B', 'scene1-label-B'],
            4: ['scene1-axis-x', 'scene1-axis-y', 'scene1-parabola', 'scene1-label-O', 'scene1-label-x', 'scene1-label-y', 'scene1-point-O',
                'scene1-directrix', 'scene1-point-F', 'scene1-label-F', 'scene1-label-p2',
                'scene1-point-A', 'scene1-segment-AF', 'scene1-angle-AFx', 'scene1-label-A', 'scene1-label-60deg',
                'scene1-circle-F', 'scene1-point-B', 'scene1-label-B',
                'scene1-point-N', 'scene1-segment-AN', 'scene1-segment-ON', 'scene1-segment-NB', 'scene1-label-N'],
            5: ['scene1-axis-x', 'scene1-axis-y', 'scene1-parabola', 'scene1-label-O', 'scene1-label-x', 'scene1-label-y', 'scene1-point-O',
                'scene1-directrix', 'scene1-point-F', 'scene1-label-F', 'scene1-label-p2',
                'scene1-point-A', 'scene1-segment-AF', 'scene1-angle-AFx', 'scene1-label-A', 'scene1-label-60deg',
                'scene1-circle-F', 'scene1-point-B', 'scene1-label-B',
                'scene1-point-N', 'scene1-segment-AN', 'scene1-segment-ON', 'scene1-segment-NB', 'scene1-label-N',
                'scene1-angle-ONB']
        };

        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.opacity = '1';
                el.style.display = '';
            }
        }

        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.opacity = '0';
                el.style.display = 'none';
            }
        }

        function render() {
            // 隐藏所有可控制元素
            const allElements = [
                'scene1-directrix', 'scene1-point-F', 'scene1-label-F', 'scene1-label-p2',
                'scene1-point-A', 'scene1-segment-AF', 'scene1-angle-AFx', 'scene1-label-A', 'scene1-label-60deg',
                'scene1-circle-F', 'scene1-point-B', 'scene1-label-B',
                'scene1-point-N', 'scene1-segment-AN', 'scene1-segment-ON', 'scene1-segment-NB', 'scene1-label-N',
                'scene1-angle-ONB'
            ];
            allElements.forEach(id => hideElement(id));

            // 显示当前步骤的元素
            const visibleElements = steps[currentState];
            visibleElements.forEach(id => showElement(id));

            // 更新步骤指示器
            document.getElementById('scene1-step-indicator').textContent = `步骤 ${currentState}/${totalSteps}`;

            // 更新按钮状态
            document.getElementById('scene1-prev-btn').disabled = (currentState === 0);
            document.getElementById('scene1-next-btn').disabled = (currentState === totalSteps);

            // 步骤5：添加脉冲动画
            const angleONB = document.getElementById('scene1-angle-ONB');
            if (currentState === 5 && angleONB) {
                angleONB.classList.add('scene1-pulse');
            } else if (angleONB) {
                angleONB.classList.remove('scene1-pulse');
            }
        }

        // 按钮事件绑定
        document.getElementById('scene1-prev-btn').addEventListener('click', function() {
            if (currentState > 0) {
                currentState--;
                render();
            }
        });

        document.getElementById('scene1-next-btn').addEventListener('click', function() {
            if (currentState < totalSteps) {
                currentState++;
                render();
            }
        });

        // 初始渲染
        render();
    })();
    </script>
</body>
</html>
