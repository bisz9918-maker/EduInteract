<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圆周角定理 - 圆心角是圆周角的 2 倍</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }
        .scene1-btn {
            width: 100px;
            height: 35px;
            font-size: 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        #scene1-btn-prev {
            background: #1565c0;
            color: white;
        }
        #scene1-btn-prev:hover:not(:disabled) {
            background: #0d47a1;
        }
        #scene1-btn-next {
            background: #1565c0;
            color: white;
        }
        #scene1-btn-next:hover:not(:disabled) {
            background: #0d47a1;
        }
        .scene1-btn:disabled {
            background: #bdbdbd;
            cursor: not-allowed;
        }
        #scene1-step-indicator {
            font-size: 14px;
            color: #424242;
            min-width: 80px;
            text-align: center;
        }
        /* 元素显隐控制 */
        .scene1-hidden {
            display: none;
            opacity: 0;
        }
        .scene1-visible {
            display: block;
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 圆 O -->
            <circle id="scene1-circle-o" cx="350" cy="250" r="120" fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 圆心 O -->
            <circle id="scene1-point-o" cx="350" cy="250" r="3" fill="#000000"/>
            <text id="scene1-label-o" x="330" y="250" font-size="14" fill="#000000" text-anchor="middle">O</text>
            
            <!-- 点 A -->
            <circle id="scene1-point-a" cx="455" cy="285" r="2.5" fill="#000000"/>
            <text id="scene1-label-a" x="470" y="285" font-size="14" fill="#000000">A</text>
            
            <!-- 点 B -->
            <circle id="scene1-point-b" cx="435" cy="155" r="2.5" fill="#000000"/>
            <text id="scene1-label-b" x="450" y="140" font-size="14" fill="#000000">B</text>
            
            <!-- 点 C -->
            <circle id="scene1-point-c" cx="340" cy="365" r="2.5" fill="#000000"/>
            <text id="scene1-label-c" x="340" y="382" font-size="14" fill="#000000" text-anchor="middle">C</text>
            
            <!-- 弦 AB -->
            <line id="scene1-chord-ab" x1="455" y1="285" x2="435" y2="155" stroke="#000000" stroke-width="2"/>
            
            <!-- 弦 BC -->
            <line id="scene1-chord-bc" x1="435" y1="155" x2="340" y2="365" stroke="#000000" stroke-width="2"/>
            
            <!-- 弦 AC -->
            <line id="scene1-chord-ac" x1="455" y1="285" x2="340" y2="365" stroke="#000000" stroke-width="2"/>
            
            <!-- 弧 AB 高亮 (步骤 1) -->
            <path id="scene1-arc-ab-highlight" d="" fill="none" stroke="#1565c0" stroke-width="4" class="scene1-hidden"/>
            
            <!-- 半径 OA (步骤 2) -->
            <line id="scene1-radius-oa" x1="350" y1="250" x2="455" y2="285" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5" class="scene1-hidden"/>
            
            <!-- 半径 OB (步骤 2) -->
            <line id="scene1-radius-ob" x1="350" y1="250" x2="435" y2="155" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5" class="scene1-hidden"/>
            
            <!-- ∠ACB 角度弧线 -->
            <path id="scene1-angle-acb-arc" d="" fill="none" stroke="#2e7d32" stroke-width="2"/>
            
            <!-- ∠ACB 标签 -->
            <text id="scene1-angle-acb-label" x="365" y="340" font-size="13" fill="#2e7d32">∠ACB=37°</text>
            
            <!-- AB=4 标签 -->
            <text id="scene1-label-ab" x="460" y="215" font-size="13" fill="#000000">AB=4</text>
            
            <!-- ∠AOB 角度弧线 (步骤 3) -->
            <path id="scene1-angle-aob-arc" d="" fill="none" stroke="#1565c0" stroke-width="2" class="scene1-hidden"/>
            
            <!-- ∠AOB 标签 (步骤 3) -->
            <text id="scene1-angle-aob-label" x="380" y="230" font-size="13" fill="#1565c0" class="scene1-hidden">∠AOB=74°</text>
            
            <!-- 角度关系文字 (步骤 3) -->
            <text id="scene1-angle-relation-text" x="560" y="180" font-size="14" fill="#1565c0" class="scene1-hidden">
                <tspan x="560" dy="0">∠AOB = 2×∠ACB</tspan>
                <tspan x="560" dy="20">= 2×37° = 74°</tspan>
            </text>
            
            <!-- 结论框 (步骤 4) -->
            <g id="scene1-conclusion-box" class="scene1-hidden">
                <rect x="550" y="400" width="230" height="80" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" rx="8"/>
                <text x="665" y="425" font-size="14" fill="#1565c0" text-anchor="middle" font-weight="bold">圆周角定理</text>
                <text x="665" y="450" font-size="13" fill="#1565c0" text-anchor="middle">同弧所对的圆心角</text>
                <text x="665" y="470" font-size="13" fill="#1565c0" text-anchor="middle">= 2 × 圆周角</text>
            </g>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 0/4</span>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1: 圆周角定理 - 圆心角是圆周角的 2 倍
        
        // 布局坐标表（实现对照依据）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // |------|------|-----------|------|-------------|------|
        // | 圆 O | circle | 圆心(350,250), r=120 | 240×240 | - | 黑色实线，居中偏左 |
        // | 圆心 O | point | (350,250) | 6×6 | 左侧 15px | 黑点 |
        // | 点 A | point | (455,285) | 5×5 | 右侧 10px | 圆上右下方 |
        // | 点 B | point | (435,155) | 5×5 | 右上方 10px | 圆上右上方 |
        // | 点 C | point | (340,365) | 5×5 | 下方 12px | 圆上底部偏左 |
        // | 弦 AB | line | (455,285)-(435,155) | 2×132 | - | 黑色实线 |
        // | 弦 BC | line | (435,155)-(340,365) | 2×230 | - | 黑色实线 |
        // | 弦 AC | line | (455,285)-(340,365) | 2×140 | - | 黑色实线 |
        // | 弧 AB(高亮) | arc | 圆上 A→B 弧段 | 粗线 4px | - | 步骤 1 蓝色加粗 |
        // | 半径 OA | line | (350,250)-(455,285) | 2×110 | - | 步骤 2 红色虚线 |
        // | 半径 OB | line | (350,250)-(435,155) | 2×125 | - | 步骤 2 红色虚线 |
        // | ∠ACB 弧线 | arc | C 点为圆心，r=25 | 25px 半径 | - | 绿色，角内部 |
        // | ∠AOB 弧线 | arc | O 点为圆心，r=30 | 30px 半径 | - | 蓝色，角内部 |
        // | AB=4 标签 | text | (460,215) | ~35×16 | 弦 AB 右侧 | 标注弦长 |
        // | ∠ACB=37°标签 | text | (365,340) | ~50×16 | C 点右上方 | 绿色 |
        // | ∠AOB=74°标签 | text | (380,230) | ~50×16 | O 点右上方 | 蓝色，步骤 3 显示 |
        // | 结论框 | rect+text | (550,400)-(780,480) | 230×80 | - | 步骤 4 显示 |
        // | 控件栏 | div | y=445~490 | 800×45 | - | 底部绝对定位 |
        
        const STATE = {
            currentStep: 0,
            maxStep: 4
        };
        
        // 获取 DOM 元素
        const elements = {
            arcAbHighlight: document.getElementById('scene1-arc-ab-highlight'),
            radiusOa: document.getElementById('scene1-radius-oa'),
            radiusOb: document.getElementById('scene1-radius-ob'),
            angleAobArc: document.getElementById('scene1-angle-aob-arc'),
            angleAobLabel: document.getElementById('scene1-angle-aob-label'),
            angleRelationText: document.getElementById('scene1-angle-relation-text'),
            conclusionBox: document.getElementById('scene1-conclusion-box'),
            btnPrev: document.getElementById('scene1-btn-prev'),
            btnNext: document.getElementById('scene1-btn-next'),
            stepIndicator: document.getElementById('scene1-step-indicator')
        };
        
        // 计算圆弧路径的辅助函数
        function calculateArcPath(cx, cy, r, startAngle, endAngle, clockwise) {
            const startRad = startAngle * Math.PI / 180;
            const endRad = endAngle * Math.PI / 180;
            const x1 = cx + r * Math.cos(startRad);
            const y1 = cy + r * Math.sin(startRad);
            const x2 = cx + r * Math.cos(endRad);
            const y2 = cy + r * Math.sin(endRad);
            const largeArcFlag = clockwise ? 1 : 0;
            return `M ${x1} ${y1} A ${r} ${r} 0 ${largeArcFlag} 1 ${x2} ${y2}`;
        }
        
        // 计算角度弧线路径
        function calculateAngleArc(cx, cy, r, startAngle, endAngle) {
            const startRad = startAngle * Math.PI / 180;
            const endRad = endAngle * Math.PI / 180;
            const x1 = cx + r * Math.cos(startRad);
            const y1 = cy + r * Math.sin(startRad);
            const x2 = cx + r * Math.cos(endRad);
            const y2 = cy + r * Math.sin(endRad);
            return `M ${x1} ${y1} A ${r} ${r} 0 0 1 ${x2} ${y2}`;
        }
        
        // 计算点到 x 轴正方向的角度（度）
        function getAngle(cx, cy, px, py) {
            const dx = px - cx;
            const dy = py - cy;
            let angle = Math.atan2(dy, dx) * 180 / Math.PI;
            if (angle < 0) angle += 360;
            return angle;
        }
        
        // 初始化弧线和角度弧线
        function initPaths() {
            // 计算 A、B 点相对于圆心 O 的角度
            const angleA = getAngle(350, 250, 455, 285);  // 约 18.4°
            const angleB = getAngle(350, 250, 435, 155);  // 约 343.3°（或 -16.7°）
            
            // 弧 AB 高亮路径（从 A 到 B 逆时针，经过上方）
            // A 约 18.4°, B 约 343.3°，逆时针从 A 到 B 需要经过 0°
            const arcAbPath = calculateArcPath(350, 250, 120, angleA, angleB, false);
            elements.arcAbHighlight.setAttribute('d', arcAbPath);
            
            // ∠ACB 角度弧（C 为圆心，r=25）
            // 计算 CA 和 CB 的方向
            const angleCA = getAngle(340, 365, 455, 285);  // CA 方向
            const angleCB = getAngle(340, 365, 435, 155);  // CB 方向
            const angleAcbArc = calculateAngleArc(340, 365, 25, angleCA, angleCB);
            document.getElementById('scene1-angle-acb-arc').setAttribute('d', angleAcbArc);
            
            // ∠AOB 角度弧（O 为圆心，r=30）
            // OA 方向约 18.4°, OB 方向约 343.3°
            const angleAobArc = calculateAngleArc(350, 250, 30, angleB, angleA);
            elements.angleAobArc.setAttribute('d', angleAobArc);
        }
        
        // 显示元素
        function show(el) {
            if (el) {
                el.classList.remove('scene1-hidden');
                el.classList.add('scene1-visible');
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }
        
        // 隐藏元素
        function hide(el) {
            if (el) {
                el.classList.remove('scene1-visible');
                el.classList.add('scene1-hidden');
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }
        
        // 更新按钮状态
        function updateButtons() {
            elements.btnPrev.disabled = STATE.currentStep === 0;
            elements.btnNext.disabled = STATE.currentStep === STATE.maxStep;
            elements.stepIndicator.textContent = `步骤 ${STATE.currentStep}/${STATE.maxStep}`;
        }
        
        // 渲染当前步骤
        function render() {
            // 步骤 1: 弧 AB 高亮
            if (STATE.currentStep >= 1) {
                show(elements.arcAbHighlight);
            } else {
                hide(elements.arcAbHighlight);
            }
            
            // 步骤 2: 半径 OA、OB
            if (STATE.currentStep >= 2) {
                show(elements.radiusOa);
                show(elements.radiusOb);
            } else {
                hide(elements.radiusOa);
                hide(elements.radiusOb);
            }
            
            // 步骤 3: ∠AOB 弧线、标签、角度关系文字
            if (STATE.currentStep >= 3) {
                show(elements.angleAobArc);
                show(elements.angleAobLabel);
                show(elements.angleRelationText);
            } else {
                hide(elements.angleAobArc);
                hide(elements.angleAobLabel);
                hide(elements.angleRelationText);
            }
            
            // 步骤 4: 结论框
            if (STATE.currentStep >= 4) {
                show(elements.conclusionBox);
            } else {
                hide(elements.conclusionBox);
            }
            
            updateButtons();
        }
        
        // 下一步
        function nextStep() {
            if (STATE.currentStep < STATE.maxStep) {
                STATE.currentStep++;
                render();
            }
        }
        
        // 上一步
        function prevStep() {
            if (STATE.currentStep > 0) {
                STATE.currentStep--;
                render();
            }
        }
        
        // 绑定事件
        elements.btnNext.addEventListener('click', nextStep);
        elements.btnPrev.addEventListener('click', prevStep);
        
        // 初始化
        initPaths();
        render();
        
    })();
    </script>
</body>
</html>
