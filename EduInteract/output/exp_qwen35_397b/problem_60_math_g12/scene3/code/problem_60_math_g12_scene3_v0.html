<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圆与椭圆的类比</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-svg { width: 800px; height: 500px; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene3-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #333; border-radius: 4px; background: #f0f0f0; }
        .scene3-btn:hover { background: #e0e0e0; }
        .scene3-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene3-step-indicator { font-size: 14px; padding: 8px 16px; }
        .highlight { stroke: #1565c0 !important; stroke-width: 3px !important; }
        .highlight-fill { fill: #1565c0 !important; }
        .dimmed { opacity: 0.4; }
        .conclusion-box { fill: #f5f5f5; stroke: #1565c0; stroke-width: 2px; }
        .conclusion-text { font-size: 14px; fill: #333; text-anchor: middle; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg id="scene3-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 左侧圆图 -->
            <g id="scene3-circle-group">
                <!-- 圆轮廓 -->
                <circle id="scene3-circle" cx="200" cy="230" r="70" fill="none" stroke="#000000" stroke-width="2"/>
                <!-- 直径 AB -->
                <line id="scene3-circle-ab" x1="130" y1="230" x2="270" y2="230" stroke="#000000" stroke-width="2"/>
                <!-- 切线 AC -->
                <line id="scene3-circle-ac" x1="130" y1="230" x2="130" y2="195" stroke="#000000" stroke-width="2"/>
                <!-- 切线 BD -->
                <line id="scene3-circle-bd" x1="270" y1="230" x2="270" y2="165" stroke="#000000" stroke-width="2"/>
                <!-- 切线 CD -->
                <line id="scene3-circle-cd" x1="130" y1="195" x2="270" y2="165" stroke="#000000" stroke-width="2"/>
                <!-- PO 连线 -->
                <line id="scene3-circle-po" x1="175" y1="175" x2="200" y2="230" stroke="#000000" stroke-width="2"/>
                <!-- 点 -->
                <circle id="scene3-circle-o" cx="200" cy="230" r="4" fill="#000000"/>
                <circle id="scene3-circle-a" cx="130" cy="230" r="4" fill="#000000"/>
                <circle id="scene3-circle-b" cx="270" cy="230" r="4" fill="#000000"/>
                <circle id="scene3-circle-p" cx="175" cy="175" r="4" fill="#000000"/>
                <circle id="scene3-circle-c" cx="130" cy="195" r="4" fill="#000000"/>
                <circle id="scene3-circle-d" cx="270" cy="165" r="4" fill="#000000"/>
                <!-- 标签 -->
                <text id="scene3-label-a-circle" x="120" y="250" font-size="14" fill="#000000">A</text>
                <text id="scene3-label-b-circle" x="275" y="250" font-size="14" fill="#000000">B</text>
                <text id="scene3-label-o-circle" x="200" y="250" font-size="14" fill="#000000">O</text>
                <text id="scene3-label-p-circle" x="165" y="165" font-size="14" fill="#000000">P</text>
                <text id="scene3-label-c-circle" x="115" y="195" font-size="14" fill="#000000">C</text>
                <text id="scene3-label-d-circle" x="280" y="165" font-size="14" fill="#000000">D</text>
            </g>

            <!-- 右侧椭圆图 -->
            <g id="scene3-ellipse-group">
                <!-- 椭圆轮廓 -->
                <ellipse id="scene3-ellipse" cx="600" cy="230" rx="90" ry="55" fill="none" stroke="#000000" stroke-width="2"/>
                <!-- 长轴 AB -->
                <line id="scene3-ellipse-ab" x1="510" y1="230" x2="690" y2="230" stroke="#000000" stroke-width="2"/>
                <!-- 切线 AC -->
                <line id="scene3-ellipse-ac" x1="510" y1="230" x2="510" y2="200" stroke="#000000" stroke-width="2"/>
                <!-- 切线 BD -->
                <line id="scene3-ellipse-bd" x1="690" y1="230" x2="690" y2="155" stroke="#000000" stroke-width="2"/>
                <!-- 切线 CD -->
                <line id="scene3-ellipse-cd" x1="510" y1="200" x2="690" y2="155" stroke="#000000" stroke-width="2"/>
                <!-- PF1 连线 -->
                <line id="scene3-ellipse-pf1" x1="555" y1="185" x2="660" y2="230" stroke="#000000" stroke-width="2"/>
                <!-- PF2 连线 -->
                <line id="scene3-ellipse-pf2" x1="555" y1="185" x2="540" y2="230" stroke="#000000" stroke-width="2"/>
                <!-- 点 -->
                <circle id="scene3-ellipse-o" cx="600" cy="230" r="4" fill="#000000"/>
                <circle id="scene3-ellipse-a" cx="510" cy="230" r="4" fill="#000000"/>
                <circle id="scene3-ellipse-b" cx="690" cy="230" r="4" fill="#000000"/>
                <circle id="scene3-ellipse-p" cx="555" cy="185" r="4" fill="#000000"/>
                <circle id="scene3-ellipse-c" cx="510" cy="200" r="4" fill="#000000"/>
                <circle id="scene3-ellipse-d" cx="690" cy="155" r="4" fill="#000000"/>
                <circle id="scene3-ellipse-f1" cx="660" cy="230" r="4" fill="#1565c0"/>
                <circle id="scene3-ellipse-f2" cx="540" cy="230" r="4" fill="#1565c0"/>
                <!-- 标签 -->
                <text id="scene3-label-a-ellipse" x="500" y="250" font-size="14" fill="#000000">A</text>
                <text id="scene3-label-b-ellipse" x="695" y="250" font-size="14" fill="#000000">B</text>
                <text id="scene3-label-o-ellipse" x="600" y="250" font-size="14" fill="#000000">O</text>
                <text id="scene3-label-p-ellipse" x="545" y="170" font-size="14" fill="#000000">P</text>
                <text id="scene3-label-c-ellipse" x="495" y="200" font-size="14" fill="#000000">C</text>
                <text id="scene3-label-d-ellipse" x="700" y="155" font-size="14" fill="#000000">D</text>
                <text id="scene3-label-f1" x="660" y="250" font-size="14" fill="#1565c0">F₁</text>
                <text id="scene3-label-f2" x="540" y="250" font-size="14" fill="#1565c0">F₂</text>
            </g>

            <!-- 高亮连线（虚线，初始隐藏） -->
            <g id="scene3-highlight-lines" style="opacity: 0;">
                <line id="scene3-highlight-ab" x1="280" y1="230" x2="510" y2="230" stroke="#1565c0" stroke-width="2" stroke-dasharray="5,5"/>
                <line id="scene3-highlight-o" x1="210" y1="230" x2="530" y2="230" stroke="#1565c0" stroke-width="2" stroke-dasharray="5,5"/>
                <line id="scene3-highlight-po" x1="200" y1="230" x2="540" y2="230" stroke="#1565c0" stroke-width="2" stroke-dasharray="5,5"/>
            </g>

            <!-- 结论框（初始隐藏） -->
            <g id="scene3-conclusion-group" style="opacity: 0;">
                <rect id="scene3-conclusion-circle" x="50" y="380" width="300" height="30" class="conclusion-box"/>
                <text id="scene3-conclusion-circle-text" x="200" y="400" class="conclusion-text">PC·PD = PO²</text>
                <rect id="scene3-conclusion-ellipse" x="450" y="380" width="300" height="30" class="conclusion-box"/>
                <text id="scene3-conclusion-ellipse-text" x="600" y="400" class="conclusion-text">PC·PD = PF₁·PF₂</text>
            </g>

            <!-- 控件栏 -->
            <g id="scene3-controls">
                <rect x="0" y="440" width="800" height="60" fill="#ffffff"/>
                <text id="scene3-step-indicator" x="400" y="465" font-size="14" fill="#333" text-anchor="middle">步骤 1/5</text>
            </g>
        </svg>
        <div id="scene3-controls">
            <button id="scene3-btn-prev" class="scene3-btn">◀ 上一步</button>
            <button id="scene3-btn-next" class="scene3-btn">下一步 ▶</button>
        </div>
    </div>
    <script>
    (function() {
        // Scene 3 实现 - 圆与椭圆的类比

        let currentStep = 0;
        const totalSteps = 5;

        const btnPrev = document.getElementById('scene3-btn-prev');
        const btnNext = document.getElementById('scene3-btn-next');
        const stepIndicator = document.getElementById('scene3-step-indicator');

        // 元素引用
        const elements = {
            circle: {
                ab: document.getElementById('scene3-circle-ab'),
                ac: document.getElementById('scene3-circle-ac'),
                bd: document.getElementById('scene3-circle-bd'),
                cd: document.getElementById('scene3-circle-cd'),
                po: document.getElementById('scene3-circle-po'),
                o: document.getElementById('scene3-circle-o'),
                a: document.getElementById('scene3-circle-a'),
                b: document.getElementById('scene3-circle-b'),
                p: document.getElementById('scene3-circle-p'),
                c: document.getElementById('scene3-circle-c'),
                d: document.getElementById('scene3-circle-d'),
                labelA: document.getElementById('scene3-label-a-circle'),
                labelB: document.getElementById('scene3-label-b-circle'),
                labelO: document.getElementById('scene3-label-o-circle'),
                labelP: document.getElementById('scene3-label-p-circle'),
                labelC: document.getElementById('scene3-label-c-circle'),
                labelD: document.getElementById('scene3-label-d-circle')
            },
            ellipse: {
                ab: document.getElementById('scene3-ellipse-ab'),
                ac: document.getElementById('scene3-ellipse-ac'),
                bd: document.getElementById('scene3-ellipse-bd'),
                cd: document.getElementById('scene3-ellipse-cd'),
                pf1: document.getElementById('scene3-ellipse-pf1'),
                pf2: document.getElementById('scene3-ellipse-pf2'),
                o: document.getElementById('scene3-ellipse-o'),
                a: document.getElementById('scene3-ellipse-a'),
                b: document.getElementById('scene3-ellipse-b'),
                p: document.getElementById('scene3-ellipse-p'),
                c: document.getElementById('scene3-ellipse-c'),
                d: document.getElementById('scene3-ellipse-d'),
                f1: document.getElementById('scene3-ellipse-f1'),
                f2: document.getElementById('scene3-ellipse-f2'),
                labelA: document.getElementById('scene3-label-a-ellipse'),
                labelB: document.getElementById('scene3-label-b-ellipse'),
                labelO: document.getElementById('scene3-label-o-ellipse'),
                labelP: document.getElementById('scene3-label-p-ellipse'),
                labelC: document.getElementById('scene3-label-c-ellipse'),
                labelD: document.getElementById('scene3-label-d-ellipse'),
                labelF1: document.getElementById('scene3-label-f1'),
                labelF2: document.getElementById('scene3-label-f2')
            },
            highlight: {
                lines: document.getElementById('scene3-highlight-lines'),
                ab: document.getElementById('scene3-highlight-ab'),
                o: document.getElementById('scene3-highlight-o'),
                po: document.getElementById('scene3-highlight-po')
            },
            conclusion: document.getElementById('scene3-conclusion-group')
        };

        function updateStep() {
            // 重置所有高亮
            resetHighlights();

            // 根据当前步骤应用高亮
            switch(currentStep) {
                case 0:
                    // 初始状态 - 无高亮
                    break;
                case 1:
                    // 步骤1: 高亮直径 AB 与长轴 AB
                    highlightElement(elements.circle.ab);
                    highlightElement(elements.ellipse.ab);
                    highlightElement(elements.circle.a);
                    highlightElement(elements.circle.b);
                    highlightElement(elements.ellipse.a);
                    highlightElement(elements.ellipse.b);
                    highlightElement(elements.circle.labelA);
                    highlightElement(elements.circle.labelB);
                    highlightElement(elements.ellipse.labelA);
                    highlightElement(elements.ellipse.labelB);
                    elements.highlight.lines.style.opacity = 1;
                    elements.highlight.ab.style.opacity = 1;
                    break;
                case 2:
                    // 步骤2: 高亮圆心 O 与焦点 F1/F2
                    highlightElement(elements.circle.o);
                    highlightElement(elements.ellipse.f1);
                    highlightElement(elements.ellipse.f2);
                    highlightElement(elements.circle.labelO);
                    highlightElement(elements.ellipse.labelF1);
                    highlightElement(elements.ellipse.labelF2);
                    elements.highlight.lines.style.opacity = 1;
                    elements.highlight.o.style.opacity = 1;
                    break;
                case 3:
                    // 步骤3: 高亮 PO 与 PF1/PF2
                    highlightElement(elements.circle.po);
                    highlightElement(elements.ellipse.pf1);
                    highlightElement(elements.ellipse.pf2);
                    highlightElement(elements.circle.labelP);
                    highlightElement(elements.ellipse.labelP);
                    elements.highlight.lines.style.opacity = 1;
                    elements.highlight.po.style.opacity = 1;
                    break;
                case 4:
                    // 步骤4: 显示结论框
                    elements.conclusion.style.opacity = 1;
                    break;
            }

            // 更新按钮状态
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps - 1;
            stepIndicator.textContent = `步骤 ${currentStep + 1}/${totalSteps}`;
        }

        function resetHighlights() {
            // 重置所有线条和点的样式
            const allElements = [
                elements.circle.ab, elements.circle.ac, elements.circle.bd, elements.circle.cd, elements.circle.po,
                elements.circle.o, elements.circle.a, elements.circle.b, elements.circle.p, elements.circle.c, elements.circle.d,
                elements.ellipse.ab, elements.ellipse.ac, elements.ellipse.bd, elements.ellipse.cd, elements.ellipse.pf1, elements.ellipse.pf2,
                elements.ellipse.o, elements.ellipse.a, elements.ellipse.b, elements.ellipse.p, elements.ellipse.c, elements.ellipse.d, elements.ellipse.f1, elements.ellipse.f2
            ];

            allElements.forEach(el => {
                if (el) {
                    el.classList.remove('highlight');
                    el.classList.remove('highlight-fill');
                }
            });

            // 重置所有标签
            const allLabels = [
                elements.circle.labelA, elements.circle.labelB, elements.circle.labelO, elements.circle.labelP, elements.circle.labelC, elements.circle.labelD,
                elements.ellipse.labelA, elements.ellipse.labelB, elements.ellipse.labelO, elements.ellipse.labelP, elements.ellipse.labelC, elements.ellipse.labelD, elements.ellipse.labelF1, elements.ellipse.labelF2
            ];

            allLabels.forEach(el => {
                if (el) {
                    el.classList.remove('highlight');
                }
            });

            // 隐藏高亮连线
            elements.highlight.lines.style.opacity = 0;
            elements.highlight.ab.style.opacity = 0;
            elements.highlight.o.style.opacity = 0;
            elements.highlight.po.style.opacity = 0;

            // 隐藏结论框
            elements.conclusion.style.opacity = 0;
        }

        function highlightElement(el) {
            if (!el) return;
            if (el.tagName === 'line' || el.tagName === 'circle' || el.tagName === 'ellipse') {
                el.classList.add('highlight');
            } else if (el.tagName === 'text') {
                el.classList.add('highlight');
                el.style.fill = '#1565c0';
                el.style.fontWeight = 'bold';
            }
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateStep();
            }
        });

        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
