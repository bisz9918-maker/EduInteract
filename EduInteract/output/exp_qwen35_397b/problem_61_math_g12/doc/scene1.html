<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>球体截面空间结构</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-svg { width: 800px; height: 500px; }
        .scene1-fade-in { animation: scene1-fade-in 0.3s ease-in-out forwards; }
        @keyframes scene1-fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .scene1-hidden { opacity: 0; }
        .scene1-visible { opacity: 1; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #333;
            border-radius: 4px;
            background: #f5f5f5;
        }
        #scene1-controls button:hover { background: #e0e0e0; }
        #scene1-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-step-indicator {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 球体轮廓 -->
            <circle id="scene1-sphere" cx="400" cy="250" r="180" fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 截面小圆（虚线椭圆） -->
            <ellipse id="scene1-section-circle" cx="400" cy="290" rx="160" ry="45" fill="none" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>
            
            <!-- 球心 O -->
            <circle id="scene1-point-o" cx="400" cy="235" r="4" fill="#000000"/>
            <text id="scene1-label-o" x="410" y="230" font-size="14" fill="#000000">O</text>
            
            <!-- 截面圆心 O' -->
            <circle id="scene1-point-o-prime" cx="400" cy="290" r="3" fill="#888888" opacity="0.6"/>
            
            <!-- A 点 -->
            <circle id="scene1-point-a" cx="385" cy="260" r="4" fill="#000000"/>
            <text id="scene1-label-a" x="385" y="245" font-size="14" fill="#000000" text-anchor="middle">A</text>
            
            <!-- B 点 -->
            <circle id="scene1-point-b" cx="280" cy="315" r="4" fill="#000000"/>
            <text id="scene1-label-b" x="265" y="325" font-size="14" fill="#000000" text-anchor="end">B</text>
            
            <!-- C 点 -->
            <circle id="scene1-point-c" cx="520" cy="315" r="4" fill="#000000"/>
            <text id="scene1-label-c" x="535" y="325" font-size="14" fill="#000000" text-anchor="start">C</text>
            
            <!-- 球半径 OA -->
            <line id="scene1-radius-oa" x1="400" y1="235" x2="385" y2="260" stroke="#1565c0" stroke-width="2" class="scene1-hidden"/>
            
            <!-- 球半径 OB -->
            <line id="scene1-radius-ob" x1="400" y1="235" x2="280" y2="315" stroke="#1565c0" stroke-width="2" class="scene1-hidden"/>
            
            <!-- 球半径 OC -->
            <line id="scene1-radius-oc" x1="400" y1="235" x2="520" y2="315" stroke="#1565c0" stroke-width="2" class="scene1-hidden"/>
            
            <!-- 球半径标签 R=3 -->
            <text id="scene1-label-r3" x="340" y="280" font-size="14" fill="#1565c0" class="scene1-hidden">R=3</text>
            
            <!-- 垂线段 OO' -->
            <line id="scene1-perp-oo-prime" x1="400" y1="235" x2="400" y2="290" stroke="#c62828" stroke-width="2" class="scene1-hidden"/>
            
            <!-- 垂线距离标签 d=3√2/2 -->
            <text id="scene1-label-d" x="410" y="265" font-size="14" fill="#c62828" class="scene1-hidden">d=\(\frac{3\sqrt{2}}{2}\)</text>
            
            <!-- 小圆半径 O'C -->
            <line id="scene1-small-radius-o-prime-c" x1="400" y1="290" x2="520" y2="315" stroke="#ef6c00" stroke-width="2" class="scene1-hidden"/>
            
            <!-- 小圆半径标签 r -->
            <text id="scene1-label-r" x="460" y="300" font-size="14" fill="#ef6c00" class="scene1-hidden">r</text>
            
            <!-- 计算公式 -->
            <text id="scene1-formula" x="420" y="180" font-size="14" fill="#000000" class="scene1-hidden">\(r=\sqrt{R^2-d^2}=\frac{3\sqrt{2}}{2}\)</text>
            
            <!-- △ABC 边 AB -->
            <line id="scene1-tri-ab" x1="385" y1="260" x2="280" y2="315" stroke="#2e7d32" stroke-width="2" class="scene1-hidden"/>
            
            <!-- △ABC 边 BC -->
            <line id="scene1-tri-bc" x1="280" y1="315" x2="520" y2="315" stroke="#2e7d32" stroke-width="2" class="scene1-hidden"/>
            
            <!-- △ABC 边 AC -->
            <line id="scene1-tri-ac" x1="385" y1="260" x2="520" y2="315" stroke="#2e7d32" stroke-width="2" class="scene1-hidden"/>
            
            <!-- 直角符号（B 点处） -->
            <path id="scene1-right-angle" d="M 280 303 L 280 315 L 292 315" fill="none" stroke="#2e7d32" stroke-width="2" class="scene1-hidden"/>
            
            <!-- 角度标注 ∠ABC=90° -->
            <text id="scene1-label-angle" x="300" y="340" font-size="14" fill="#2e7d32" class="scene1-hidden">∠ABC=90°</text>
            
            <!-- 等腰标注 BA=BC -->
            <text id="scene1-label-equal" x="350" y="355" font-size="14" fill="#2e7d32" class="scene1-hidden">BA=BC</text>
            
            <!-- AC 直径结论 -->
            <text id="scene1-conclusion" x="450" y="380" font-size="14" fill="#2e7d32" class="scene1-hidden">AC=2r=3√2</text>
        </svg>
        
        <div id="scene1-step-indicator">步骤 1/6</div>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现
        
        // 状态管理
        let currentStep = 0;
        const totalSteps = 6;
        
        // 每步显示的元素 ID 列表
        const steps = [
            // 步骤 0：初始状态 - 球体轮廓、截面小圆、球心 O、截面圆心 O'、A/B/C 三点、点标签
            [],
            // 步骤 1：高亮球半径 OB，显示 R=3
            ['scene1-radius-ob', 'scene1-label-r3'],
            // 步骤 2：高亮垂线段 OO'，显示 d=3√2/2
            ['scene1-perp-oo-prime', 'scene1-label-d'],
            // 步骤 3：高亮小圆半径 O'C，显示 r 及计算公式
            ['scene1-small-radius-o-prime-c', 'scene1-label-r', 'scene1-formula'],
            // 步骤 4：高亮△ABC 三边，显示直角符号和角度标注
            ['scene1-tri-ab', 'scene1-tri-bc', 'scene1-tri-ac', 'scene1-right-angle', 'scene1-label-angle', 'scene1-label-equal'],
            // 步骤 5：高亮 AC 为直径，显示 AC=2r=3√2
            ['scene1-conclusion']
        ];
        
        // 显示元素
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene1-hidden');
                el.classList.add('scene1-visible', 'scene1-fade-in');
            }
        }
        
        // 隐藏元素
        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene1-visible', 'scene1-fade-in');
                el.classList.add('scene1-hidden');
            }
        }
        
        // 更新步骤显示
        function updateStep() {
            // 隐藏所有步骤元素
            for (let i = 0; i < totalSteps; i++) {
                steps[i].forEach(id => hideElement(id));
            }
            
            // 显示当前步骤及之前所有步骤的元素
            for (let i = 0; i <= currentStep; i++) {
                steps[i].forEach(id => showElement(id));
            }
            
            // 更新步骤指示器
            document.getElementById('scene1-step-indicator').textContent = `步骤 ${currentStep + 1}/${totalSteps}`;
            
            // 更新按钮状态
            document.getElementById('scene1-btn-prev').disabled = currentStep === 0;
            document.getElementById('scene1-btn-next').disabled = currentStep === totalSteps - 1;
            
            // 重新渲染 MathJax
            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }
        
        // 按钮事件绑定
        document.getElementById('scene1-btn-prev').addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });
        
        document.getElementById('scene1-btn-next').addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateStep();
            }
        });
        
        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
