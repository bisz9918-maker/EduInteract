<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四面体 ABCD 与平面α交互演示</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        #scene1-controls {
            position: absolute;
            bottom: 15px;
            left: 0;
            right: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            z-index: 10;
        }
        #scene1-slider-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        #scene1-slider {
            width: 300px;
            cursor: pointer;
        }
        #scene1-angle-display {
            font-size: 14px;
            color: #2e7d32;
            font-weight: bold;
            min-width: 80px;
            text-align: center;
        }
        .scene1-label {
            font-size: 14px;
            font-weight: bold;
        }
        .scene1-vertex-label {
            fill: #000000;
        }
        .scene1-midpoint-label {
            fill: #1565c0;
        }
        .scene1-intersection-label {
            fill: #1565c0;
        }
        .scene1-plane-label {
            fill: #1565c0;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 四面体棱线 -->
            <!-- 可见棱：AB, AC, AD, BC (实线黑色) -->
            <line id="scene1-edge-ab" x1="400" y1="80" x2="200" y2="350" stroke="#000000" stroke-width="2" fill="none"/>
            <line id="scene1-edge-ac" x1="400" y1="80" x2="400" y2="420" stroke="#000000" stroke-width="2" fill="none"/>
            <line id="scene1-edge-ad" x1="400" y1="80" x2="600" y2="350" stroke="#000000" stroke-width="2" fill="none"/>
            <line id="scene1-edge-bc" x1="200" y1="350" x2="400" y2="420" stroke="#000000" stroke-width="2" fill="none"/>
            <!-- 被遮挡棱：BD, CD (虚线灰色) -->
            <line id="scene1-edge-bd" x1="200" y1="350" x2="600" y2="350" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" fill="none"/>
            <line id="scene1-edge-cd" x1="400" y1="420" x2="600" y2="350" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" fill="none"/>
            
            <!-- 辅助线 EF (灰色虚线) -->
            <line id="scene1-line-ef" x1="300" y1="215" x2="500" y2="385" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" fill="none"/>
            
            <!-- 平面α交线四边形 EGFH (蓝色实线) -->
            <line id="scene1-line-eg" x1="300" y1="215" x2="300" y2="385" stroke="#1565c0" stroke-width="2" fill="none"/>
            <line id="scene1-line-gf" x1="300" y1="385" x2="500" y2="385" stroke="#1565c0" stroke-width="2" fill="none"/>
            <line id="scene1-line-fh" x1="500" y1="385" x2="500" y2="215" stroke="#1565c0" stroke-width="2" fill="none"/>
            <line id="scene1-line-he" x1="500" y1="215" x2="300" y2="215" stroke="#1565c0" stroke-width="2" fill="none"/>
            
            <!-- 中点 E, F (蓝色实心圆) -->
            <circle id="scene1-midpoint-e" cx="300" cy="215" r="4" fill="#1565c0"/>
            <circle id="scene1-midpoint-f" cx="500" cy="385" r="4" fill="#1565c0"/>
            
            <!-- 交点 G, H (蓝色圆点) -->
            <circle id="scene1-point-g" cx="300" cy="385" r="4" fill="#1565c0"/>
            <circle id="scene1-point-h" cx="500" cy="215" r="4" fill="#1565c0"/>
            
            <!-- 顶点 A, B, C, D (小黑点) -->
            <circle cx="400" cy="80" r="3" fill="#000000"/>
            <circle cx="200" cy="350" r="3" fill="#000000"/>
            <circle cx="400" cy="420" r="3" fill="#000000"/>
            <circle cx="600" cy="350" r="3" fill="#000000"/>
            
            <!-- 标签 (调整位置避免压线) -->
            <!-- A 标签：放在顶点正上方，远离线条 -->
            <text id="scene1-label-a" x="400" y="60" text-anchor="middle" class="scene1-label scene1-vertex-label">A</text>
            <!-- B 标签：放在顶点左侧 -->
            <text id="scene1-label-b" x="175" y="355" text-anchor="middle" class="scene1-label scene1-vertex-label">B</text>
            <!-- C 标签：放在顶点正下方 -->
            <text id="scene1-label-c" x="400" y="445" text-anchor="middle" class="scene1-label scene1-vertex-label">C</text>
            <!-- D 标签：放在顶点右侧 -->
            <text id="scene1-label-d" x="625" y="355" text-anchor="middle" class="scene1-label scene1-vertex-label">D</text>
            
            <!-- E 标签：放在 AB 线左侧，远离线条 -->
            <text id="scene1-label-e" x="275" y="210" text-anchor="end" class="scene1-label scene1-midpoint-label">E</text>
            <!-- F 标签：放在 CD 线右侧，远离线条 -->
            <text id="scene1-label-f" x="525" y="395" text-anchor="start" class="scene1-label scene1-midpoint-label">F</text>
            
            <!-- G 标签：动态位置，放在 BC 线下方 -->
            <text id="scene1-label-g" x="285" y="410" text-anchor="start" class="scene1-label scene1-intersection-label">G</text>
            <!-- H 标签：动态位置，放在 AD 线右侧 -->
            <text id="scene1-label-h" x="525" y="220" text-anchor="start" class="scene1-label scene1-intersection-label">H</text>
            
            <!-- 平面α标注：放在四边形内部空白区，远离线条 -->
            <text id="scene1-label-plane-alpha" x="420" y="310" text-anchor="start" class="scene1-label scene1-plane-label">平面α</text>
        </svg>
        
        <div id="scene1-controls">
            <div id="scene1-slider-container">
                <span style="font-size: 13px; color: #555;">旋转角度:</span>
                <input type="range" id="scene1-slider" min="0" max="180" value="90"/>
                <span id="scene1-angle-display">90°</span>
            </div>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1: 四面体 ABCD 与平面α交互演示
        
        // 坐标定义
        const A = { x: 400, y: 80 };
        const B = { x: 200, y: 350 };
        const C = { x: 400, y: 420 };
        const D = { x: 600, y: 350 };
        
        // E 是 AB 中点
        const E = { x: (A.x + B.x) / 2, y: (A.y + B.y) / 2 }; // (300, 215)
        // F 是 CD 中点
        const F = { x: (C.x + D.x) / 2, y: (C.y + D.y) / 2 }; // (500, 385)
        
        // 获取 DOM 元素
        const slider = document.getElementById('scene1-slider');
        const angleDisplay = document.getElementById('scene1-angle-display');
        const pointG = document.getElementById('scene1-point-g');
        const pointH = document.getElementById('scene1-point-h');
        const lineEG = document.getElementById('scene1-line-eg');
        const lineGF = document.getElementById('scene1-line-gf');
        const lineFH = document.getElementById('scene1-line-fh');
        const lineHE = document.getElementById('scene1-line-he');
        const labelG = document.getElementById('scene1-label-g');
        const labelH = document.getElementById('scene1-label-h');
        
        // 计算 G 在 BC 上的位置 (参数 t ∈ [0.1, 0.9])
        function computeG(t) {
            return {
                x: B.x + t * (C.x - B.x),
                y: B.y + t * (C.y - B.y)
            };
        }
        
        // 计算 H 在 AD 上的位置
        // 约束：E, F, G, H 四点共面
        // 简化：使用线性插值，H 从 D 到 A 滑动 (与 G 从 B 到 C 对应)
        function computeH(t) {
            return {
                x: D.x + t * (A.x - D.x),
                y: D.y + t * (A.y - D.y)
            };
        }
        
        // 更新图示
        function updateDiagram(angle) {
            // 将角度映射到 t ∈ [0.1, 0.9]
            const t = 0.1 + (angle / 180) * 0.8;
            
            const G = computeG(t);
            const H = computeH(t);
            
            // 更新 G, H 位置
            pointG.setAttribute('cx', G.x);
            pointG.setAttribute('cy', G.y);
            pointH.setAttribute('cx', H.x);
            pointH.setAttribute('cy', H.y);
            
            // 更新交线
            lineEG.setAttribute('x2', G.x);
            lineEG.setAttribute('y2', G.y);
            lineGF.setAttribute('x1', G.x);
            lineGF.setAttribute('y1', G.y);
            lineFH.setAttribute('x2', H.x);
            lineFH.setAttribute('y2', H.y);
            lineHE.setAttribute('x1', H.x);
            lineHE.setAttribute('y1', H.y);
            
            // 更新标签位置 - G 标签放在 BC 线下方，H 标签放在 AD 线右侧
            labelG.setAttribute('x', G.x - 10);
            labelG.setAttribute('y', G.y + 25);
            labelH.setAttribute('x', H.x + 15);
            labelH.setAttribute('y', H.y + 5);
            
            // 更新角度显示
            angleDisplay.textContent = angle + '°';
        }
        
        // 事件监听
        slider.addEventListener('input', function() {
            const angle = parseInt(this.value);
            updateDiagram(angle);
        });
        
        // 初始化
        updateDiagram(90);
        
    })();
    </script>
</body>
</html>
