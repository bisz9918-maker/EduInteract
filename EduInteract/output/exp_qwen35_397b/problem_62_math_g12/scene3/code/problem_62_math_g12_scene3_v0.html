<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>命题④：S△EFG = S△EFH 证明图示</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', sans-serif;
        }
        #scene3-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene3-svg {
            width: 800px;
            height: 500px;
        }
        .scene3-label {
            font-size: 14px;
            fill: #333;
            font-weight: 500;
        }
        .scene3-small-label {
            font-size: 12px;
            fill: #555;
        }
        .scene3-alt-label {
            font-size: 13px;
            fill: #c62828;
            font-weight: bold;
        }
        .scene3-step-text {
            font-size: 13px;
            fill: #333;
        }
        .scene3-formula-text {
            font-size: 14px;
            fill: #222;
            font-family: 'Times New Roman', serif;
        }
        .scene3-btn {
            cursor: pointer;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .scene3-btn-prev {
            background: #e0e0e0;
            color: #333;
        }
        .scene3-btn-prev:hover {
            background: #c0c0c0;
        }
        .scene3-btn-next {
            background: #1565c0;
            color: #fff;
        }
        .scene3-btn-next:hover {
            background: #0d47a1;
        }
        .scene3-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .scene3-fade-in {
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }
        .scene3-visible {
            opacity: 1;
        }
        .scene3-hidden {
            opacity: 0;
            display: none;
        }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg id="scene3-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 定义箭头和标记 -->
            <defs>
                <marker id="scene3-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#333" />
                </marker>
            </defs>

            <!-- 四面体棱线 -->
            <g id="scene3-tetra-edges">
                <!-- 被遮挡的棱 BD（虚线） -->
                <line id="scene3-edge-bd" x1="120" y1="280" x2="440" y2="280" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" />
                <!-- 可见棱线 -->
                <line id="scene3-edge-ab" x1="280" y1="60" x2="120" y2="280" stroke="#333333" stroke-width="2" />
                <line id="scene3-edge-ac" x1="280" y1="60" x2="280" y2="400" stroke="#333333" stroke-width="2" />
                <line id="scene3-edge-ad" x1="280" y1="60" x2="440" y2="280" stroke="#333333" stroke-width="2" />
                <line id="scene3-edge-bc" x1="120" y1="280" x2="280" y2="400" stroke="#333333" stroke-width="2" />
                <line id="scene3-edge-cd" x1="280" y1="400" x2="440" y2="280" stroke="#333333" stroke-width="2" />
            </g>

            <!-- 三角形填充区域 -->
            <g id="scene3-triangles">
                <!-- △EFG -->
                <polygon id="scene3-tri-efg" points="200,170 360,340 220,340" fill="#1565c0" fill-opacity="0.2" stroke="#1565c0" stroke-width="2" class="scene3-fade-in" />
                <!-- △EFH -->
                <polygon id="scene3-tri-efh" points="200,170 360,340 380,200" fill="#2e7d32" fill-opacity="0.2" stroke="#2e7d32" stroke-width="2" class="scene3-fade-in" />
            </g>

            <!-- 公共底边 EF -->
            <line id="scene3-ef-base" x1="200" y1="170" x2="360" y2="340" stroke="#1565c0" stroke-width="3" class="scene3-hidden" />

            <!-- 垂线 GM 和 HN -->
            <g id="scene3-altitudes" class="scene3-hidden">
                <!-- G 到 EF 的垂线 GM -->
                <line id="scene3-gm-alt" x1="220" y1="340" x2="280" y2="255" stroke="#c62828" stroke-width="2" stroke-dasharray="4,3" />
                <!-- H 到 EF 的垂线 HN -->
                <line id="scene3-hn-alt" x1="380" y1="200" x2="300" y2="275" stroke="#c62828" stroke-width="2" stroke-dasharray="4,3" />
                <!-- 垂足 M 直角标记 -->
                <rect id="scene3-mark-m" x="275" y="250" width="8" height="8" fill="none" stroke="#c62828" stroke-width="1.5" />
                <!-- 垂足 N 直角标记 -->
                <rect id="scene3-mark-n" x="295" y="270" width="8" height="8" fill="none" stroke="#c62828" stroke-width="1.5" />
            </g>

            <!-- 辅助线（步骤 3 显示） -->
            <g id="scene3-aux-lines" class="scene3-hidden">
                <line id="scene3-aux-ebc" x1="200" y1="170" x2="200" y2="340" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6" />
                <line id="scene3-aux-fad" x1="360" y1="340" x2="330" y2="130" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6" />
            </g>

            <!-- 顶点标签 -->
            <g id="scene3-vertex-labels">
                <text id="scene3-label-a" x="280" y="52" text-anchor="middle" class="scene3-label">A</text>
                <text id="scene3-label-b" x="110" y="290" text-anchor="middle" class="scene3-label">B</text>
                <text id="scene3-label-c" x="280" y="415" text-anchor="middle" class="scene3-label">C</text>
                <text id="scene3-label-d" x="450" y="290" text-anchor="middle" class="scene3-label">D</text>
            </g>

            <!-- 中点和交点标签 -->
            <g id="scene3-point-labels">
                <text id="scene3-label-e" x="185" y="165" text-anchor="end" class="scene3-label">E</text>
                <text id="scene3-label-f" x="370" y="350" text-anchor="start" class="scene3-label">F</text>
                <text id="scene3-label-g" x="205" y="355" text-anchor="end" class="scene3-label">G</text>
                <text id="scene3-label-h" x="395" y="195" text-anchor="start" class="scene3-label">H</text>
            </g>

            <!-- 垂足标签 -->
            <g id="scene3-foot-labels" class="scene3-hidden">
                <text id="scene3-label-m" x="275" y="270" text-anchor="middle" class="scene3-small-label">M</text>
                <text id="scene3-label-n" x="295" y="290" text-anchor="middle" class="scene3-small-label">N</text>
                <text id="scene3-label-h1" x="210" y="300" text-anchor="middle" class="scene3-alt-label">h₁</text>
                <text id="scene3-label-h2" x="370" y="240" text-anchor="middle" class="scene3-alt-label">h₂</text>
            </g>

            <!-- 公共底边标注 -->
            <text id="scene3-ef-label" x="290" y="260" text-anchor="start" class="scene3-small-label" style="fill: #1565c0; font-weight: bold;" class="scene3-hidden">公共底边</text>

            <!-- 右侧公式区 -->
            <g id="scene3-formula-area">
                <rect x="520" y="80" width="260" height="120" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="4" />
                <text id="scene3-formula-title" x="650" y="105" text-anchor="middle" class="scene3-formula-text" font-weight="bold">命题④：S△EFG = S△EFH</text>
                <text id="scene3-formula-1" x="535" y="135" class="scene3-formula-text" class="scene3-hidden">S△EFG = ½ × EF × h₁</text>
                <text id="scene3-formula-2" x="535" y="160" class="scene3-formula-text" class="scene3-hidden">S△EFH = ½ × EF × h₂</text>
                <text id="scene3-formula-3" x="535" y="190" class="scene3-formula-text" class="scene3-hidden">∵ E、F 为中点，∴ h₁ = h₂</text>
                <text id="scene3-formula-4" x="535" y="220" class="scene3-formula-text" class="scene3-hidden">∴ S△EFG = S△EFH</text>
            </g>

            <!-- 右侧步骤说明区 -->
            <g id="scene3-step-area">
                <rect x="520" y="220" width="260" height="130" fill="#f0f7ff" stroke="#bbdefb" stroke-width="1" rx="4" />
                <text id="scene3-step-desc" x="535" y="250" class="scene3-step-text">步骤 0：观察两个三角形</text>
                <text id="scene3-step-detail1" x="535" y="280" class="scene3-step-text" class="scene3-hidden">△EFG（蓝色）与△EFH（绿色）</text>
                <text id="scene3-step-detail2" x="535" y="305" class="scene3-step-text" class="scene3-hidden">共享底边 EF</text>
                <text id="scene3-step-check" x="650" y="340" text-anchor="middle" class="scene3-hidden" style="fill: #2e7d32; font-size: 24px; font-weight: bold;">✓ 证明完成</text>
            </g>

            <!-- 控件栏（SVG 内部底部） -->
            <g id="scene3-controls">
                <rect x="250" y="460" width="300" height="35" fill="#fafafa" stroke="#e0e0e0" stroke-width="1" rx="4" />
                <text id="scene3-step-indicator" x="650" y="483" text-anchor="middle" class="scene3-small-label">步骤 0/4</text>
            </g>
        </svg>

        <!-- HTML 按钮（叠在 SVG 上） -->
        <div style="position: absolute; left: 280px; top: 465px;">
            <button id="scene3-btn-prev" class="scene3-btn scene3-btn-prev" disabled>◀ 上一步</button>
        </div>
        <div style="position: absolute; left: 420px; top: 465px;">
            <button id="scene3-btn-next" class="scene3-btn scene3-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 3 实现：命题④面积相等证明

        // 状态变量
        let currentStep = 0;
        const totalSteps = 4;

        // 获取 DOM 元素
        const btnPrev = document.getElementById('scene3-btn-prev');
        const btnNext = document.getElementById('scene3-btn-next');
        const stepIndicator = document.getElementById('scene3-step-indicator');

        // 元素分组
        const triEfg = document.getElementById('scene3-tri-efg');
        const triEfh = document.getElementById('scene3-tri-efh');
        const efBase = document.getElementById('scene3-ef-base');
        const efLabel = document.getElementById('scene3-ef-label');
        const altitudes = document.getElementById('scene3-altitudes');
        const auxLines = document.getElementById('scene3-aux-lines');
        const footLabels = document.getElementById('scene3-foot-labels');

        const formula1 = document.getElementById('scene3-formula-1');
        const formula2 = document.getElementById('scene3-formula-2');
        const formula3 = document.getElementById('scene3-formula-3');
        const formula4 = document.getElementById('scene3-formula-4');

        const stepDesc = document.getElementById('scene3-step-desc');
        const stepDetail1 = document.getElementById('scene3-step-detail1');
        const stepDetail2 = document.getElementById('scene3-step-detail2');
        const stepCheck = document.getElementById('scene3-step-check');

        // 工具函数：显示元素
        function show(el) {
            if (el) {
                el.style.display = '';
                el.style.opacity = '1';
                if (el.classList.contains('scene3-hidden')) {
                    el.classList.remove('scene3-hidden');
                }
                if (el.classList.contains('scene3-fade-in')) {
                    el.classList.add('scene3-visible');
                }
            }
        }

        // 工具函数：隐藏元素
        function hide(el) {
            if (el) {
                el.style.display = 'none';
                el.style.opacity = '0';
                if (el.classList.contains('scene3-visible')) {
                    el.classList.remove('scene3-visible');
                }
                if (!el.classList.contains('scene3-hidden')) {
                    el.classList.add('scene3-hidden');
                }
            }
        }

        // 更新步骤显示
        function updateStep() {
            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps);
            btnNext.textContent = (currentStep === totalSteps) ? '完成' : '下一步 ▶';

            // 更新步骤指示器
            stepIndicator.textContent = '步骤 ' + currentStep + '/' + totalSteps;

            // 根据步骤显示/隐藏元素
            switch (currentStep) {
                case 0:
                    // 初始状态：只显示四面体和两个三角形
                    hide(efBase);
                    hide(efLabel);
                    hide(altitudes);
                    hide(footLabels);
                    hide(auxLines);
                    hide(formula1);
                    hide(formula2);
                    hide(formula3);
                    hide(formula4);
                    stepDesc.textContent = '步骤 0：观察两个三角形';
                    hide(stepDetail1);
                    hide(stepDetail2);
                    hide(stepCheck);
                    break;

                case 1:
                    // 步骤 1：高亮公共底边 EF
                    show(efBase);
                    show(efLabel);
                    hide(altitudes);
                    hide(footLabels);
                    hide(auxLines);
                    show(formula1);
                    show(formula2);
                    hide(formula3);
                    hide(formula4);
                    stepDesc.textContent = '步骤 1：两个三角形共享底边 EF';
                    show(stepDetail1);
                    hide(stepDetail2);
                    hide(stepCheck);
                    break;

                case 2:
                    // 步骤 2：显示垂线
                    show(efBase);
                    show(efLabel);
                    show(altitudes);
                    show(footLabels);
                    hide(auxLines);
                    show(formula1);
                    show(formula2);
                    hide(formula3);
                    hide(formula4);
                    stepDesc.textContent = '步骤 2：作 G、H 到 EF 的垂线，高分别为 h₁、h₂';
                    show(stepDetail1);
                    show(stepDetail2);
                    hide(stepCheck);
                    break;

                case 3:
                    // 步骤 3：利用中点性质
                    show(efBase);
                    show(efLabel);
                    show(altitudes);
                    show(footLabels);
                    show(auxLines);
                    show(formula1);
                    show(formula2);
                    show(formula3);
                    hide(formula4);
                    stepDesc.textContent = '步骤 3：利用中点性质证明 h₁ = h₂';
                    show(stepDetail1);
                    show(stepDetail2);
                    hide(stepCheck);
                    break;

                case 4:
                    // 步骤 4：结论
                    show(efBase);
                    show(efLabel);
                    show(altitudes);
                    show(footLabels);
                    show(auxLines);
                    show(formula1);
                    show(formula2);
                    show(formula3);
                    show(formula4);
                    stepDesc.textContent = '结论：面积相等 ✓';
                    show(stepDetail1);
                    show(stepDetail2);
                    show(stepCheck);
                    break;
            }
        }

        // 事件处理
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateStep();
            }
        });

        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
