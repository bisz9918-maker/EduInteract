<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双曲线渐近线方程推导</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-svg { width: 800px; height: 500px; }
        .scene2-derive-box { fill: #f5f5f5; stroke: #888888; stroke-width: 1; }
        .scene2-conclusion-box { fill: #e3f2fd; stroke: #1565c0; stroke-width: 2; }
        .scene2-btn { fill: #1565c0; stroke: none; cursor: pointer; }
        .scene2-btn:hover { fill: #0d47a1; }
        .scene2-btn-disabled { fill: #cccccc; cursor: not-allowed; }
        .scene2-label { font-size: 14px; fill: #000000; }
        .scene2-equation { font-size: 13px; fill: #333333; }
        .scene2-highlight { fill: #2e7d32; font-weight: bold; }
        .scene2-point { fill: #1565c0; }
        .scene2-vector-om { stroke: #c62828; stroke-width: 2; fill: none; }
        .scene2-vector-pf { stroke: #1565c0; stroke-width: 2; fill: none; }
        .scene2-axis { stroke: #000000; stroke-width: 2; fill: none; }
        .scene2-circle { stroke: #1565c0; stroke-width: 1.5; fill: none; }
        .scene2-hyperbola { stroke: #1565c0; stroke-width: 1.5; fill: none; }
        .scene2-line-pf { stroke: #1565c0; stroke-width: 1.5; fill: none; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 坐标轴 -->
            <g id="scene2-axes">
                <!-- x 轴 -->
                <line x1="50" y1="280" x2="380" y2="280" class="scene2-axis"/>
                <polygon points="380,280 370,275 370,285" fill="#000000"/>
                <text x="390" y="285" class="scene2-label">x</text>
                <!-- y 轴 -->
                <line x1="215" y1="100" x2="215" y2="380" class="scene2-axis"/>
                <polygon points="215,100 210,110 220,110" fill="#000000"/>
                <text x="220" y="95" class="scene2-label">y</text>
            </g>

            <!-- 圆 x²+y²=b² -->
            <circle id="scene2-circle" cx="215" cy="280" r="65" class="scene2-circle"/>

            <!-- 双曲线右支 -->
            <path id="scene2-hyperbola" d="M 260,120 Q 270,200 280,280 Q 290,320 360,350" class="scene2-hyperbola"/>
            <!-- 双曲线左支（示意） -->
            <path d="M 170,120 Q 160,200 150,280 Q 140,320 70,350" class="scene2-hyperbola"/>

            <!-- 点 O（原点） -->
            <circle id="scene2-point-o" cx="215" cy="280" r="4" class="scene2-point"/>
            <text x="200" y="300" class="scene2-label">O</text>

            <!-- 点 F（焦点） -->
            <circle id="scene2-point-f" cx="340" cy="280" r="4" class="scene2-point"/>
            <text x="350" y="305" class="scene2-label">F</text>
            <text x="350" y="325" class="scene2-label">(c,0)</text>

            <!-- 点 P（双曲线上的点） -->
            <circle id="scene2-point-p" cx="300" cy="150" r="4" class="scene2-point"/>
            <text x="312" y="142" class="scene2-label">P</text>
            <text x="312" y="115" class="scene2-label">(x_P,y_P)</text>

            <!-- 点 M（PF 中点，切点） -->
            <circle id="scene2-point-m" cx="320" cy="215" r="4" class="scene2-point"/>
            <text x="335" y="215" class="scene2-label">M</text>

            <!-- 线段 PF -->
            <line id="scene2-line-pf" x1="300" y1="150" x2="340" y2="280" class="scene2-line-pf"/>

            <!-- 向量 OM（红色） -->
            <line id="scene2-vector-om" x1="215" y1="280" x2="320" y2="215" class="scene2-vector-om"/>
            <polygon points="320,215 310,210 312,220" fill="#c62828"/>

            <!-- 向量 PF（蓝色） -->
            <line id="scene2-vector-pf" x1="300" y1="150" x2="340" y2="280" class="scene2-vector-pf"/>
            <polygon points="340,280 330,275 332,285" fill="#1565c0"/>

            <!-- 推导框 1：M 坐标 -->
            <g id="scene2-derive-box1" style="display:none;">
                <rect x="420" y="80" width="360" height="50" class="scene2-derive-box"/>
                <text x="430" y="100" class="scene2-equation">步骤 1：M 为 PF 中点</text>
                <text x="430" y="120" class="scene2-equation">M$\left(\frac{x_P+c}{2}, \frac{y_P}{2}\right)$</text>
            </g>

            <!-- 推导框 2：|OM|=b -->
            <g id="scene2-derive-box2" style="display:none;">
                <rect x="420" y="140" width="360" height="50" class="scene2-derive-box"/>
                <text x="430" y="160" class="scene2-equation">步骤 2：|OM|=b（M 在圆上）</text>
                <text x="430" y="180" class="scene2-equation">$\left(\frac{x_P+c}{2}\right)^2 + \left(\frac{y_P}{2}\right)^2 = b^2$</text>
            </g>

            <!-- 推导框 3：OM⊥PF -->
            <g id="scene2-derive-box3" style="display:none;">
                <rect x="420" y="200" width="360" height="50" class="scene2-derive-box"/>
                <text x="430" y="220" class="scene2-equation">步骤 3：OM⊥PF（切线性质）</text>
                <text x="430" y="240" class="scene2-equation">$\vec{OM} \cdot \vec{PF} = 0$</text>
            </g>

            <!-- 推导框 4：P 在双曲线上 -->
            <g id="scene2-derive-box4" style="display:none;">
                <rect x="420" y="260" width="360" height="50" class="scene2-derive-box"/>
                <text x="430" y="280" class="scene2-equation">步骤 4：P 在双曲线上</text>
                <text x="430" y="300" class="scene2-equation">$\frac{x_P^2}{a^2} - \frac{y_P^2}{b^2} = 1$</text>
            </g>

            <!-- 推导框 5：联立求解 -->
            <g id="scene2-derive-box5" style="display:none;">
                <rect x="420" y="320" width="360" height="50" class="scene2-derive-box"/>
                <text x="430" y="340" class="scene2-equation">步骤 5：联立求解</text>
                <text x="430" y="360" class="scene2-highlight">b = 2a</text>
            </g>

            <!-- 结论框：渐近线方程 -->
            <g id="scene2-conclusion-box" style="display:none;">
                <rect x="420" y="380" width="360" height="50" class="scene2-conclusion-box"/>
                <text x="430" y="400" class="scene2-equation">结论：渐近线方程</text>
                <text x="430" y="420" class="scene2-highlight" font-size="16px">y = ±2x</text>
            </g>

            <!-- 控件栏 -->
            <g id="scene2-controls">
                <!-- 上一步按钮 -->
                <rect id="scene2-btn-prev-bg" x="280" y="455" width="80" height="30" rx="5" class="scene2-btn-disabled"/>
                <text id="scene2-btn-prev-text" x="320" y="475" text-anchor="middle" fill="#666666" font-size="14px">◀ 上一步</text>

                <!-- 步骤指示器 -->
                <text id="scene2-step-indicator" x="400" y="475" text-anchor="middle" class="scene2-label">步骤 1/7</text>

                <!-- 下一步按钮 -->
                <rect id="scene2-btn-next-bg" x="440" y="455" width="80" height="30" rx="5" class="scene2-btn"/>
                <text id="scene2-btn-next-text" x="480" y="475" text-anchor="middle" fill="#ffffff" font-size="14px">下一步 ▶</text>
            </g>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 2 实现：坐标关系与代数推导的可视化

        let currentStep = 0;
        const totalSteps = 7;

        // 获取元素
        const deriveBox1 = document.getElementById('scene2-derive-box1');
        const deriveBox2 = document.getElementById('scene2-derive-box2');
        const deriveBox3 = document.getElementById('scene2-derive-box3');
        const deriveBox4 = document.getElementById('scene2-derive-box4');
        const deriveBox5 = document.getElementById('scene2-derive-box5');
        const conclusionBox = document.getElementById('scene2-conclusion-box');

        const btnPrevBg = document.getElementById('scene2-btn-prev-bg');
        const btnPrevText = document.getElementById('scene2-btn-prev-text');
        const btnNextBg = document.getElementById('scene2-btn-next-bg');
        const btnNextText = document.getElementById('scene2-btn-next-text');
        const stepIndicator = document.getElementById('scene2-step-indicator');

        const pointM = document.getElementById('scene2-point-m');
        const vectorOM = document.getElementById('scene2-vector-om');
        const vectorPF = document.getElementById('scene2-vector-pf');
        const pointP = document.getElementById('scene2-point-p');
        const hyperbola = document.getElementById('scene2-hyperbola');

        // 显示/隐藏函数
        function show(el) {
            el.style.display = 'block';
            el.style.opacity = '1';
        }

        function hide(el) {
            el.style.display = 'none';
            el.style.opacity = '0';
        }

        // 更新按钮状态
        function updateButtons() {
            if (currentStep === 0) {
                btnPrevBg.classList.remove('scene2-btn');
                btnPrevBg.classList.add('scene2-btn-disabled');
                btnPrevText.setAttribute('fill', '#666666');
            } else {
                btnPrevBg.classList.remove('scene2-btn-disabled');
                btnPrevBg.classList.add('scene2-btn');
                btnPrevText.setAttribute('fill', '#ffffff');
            }

            if (currentStep === totalSteps - 1) {
                btnNextBg.classList.remove('scene2-btn');
                btnNextBg.classList.add('scene2-btn-disabled');
                btnNextText.setAttribute('fill', '#666666');
            } else {
                btnNextBg.classList.remove('scene2-btn-disabled');
                btnNextBg.classList.add('scene2-btn');
                btnNextText.setAttribute('fill', '#ffffff');
            }

            stepIndicator.textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;
        }

        // 更新显示状态
        function updateDisplay() {
            // 隐藏所有推导框和结论框
            hide(deriveBox1);
            hide(deriveBox2);
            hide(deriveBox3);
            hide(deriveBox4);
            hide(deriveBox5);
            hide(conclusionBox);

            // 重置高亮
            pointM.style.fill = '#1565c0';
            vectorOM.style.strokeWidth = '2';
            vectorPF.style.strokeWidth = '2';
            pointP.style.fill = '#1565c0';
            hyperbola.style.strokeWidth = '1.5';

            // 根据当前步骤显示相应内容
            if (currentStep >= 1) {
                show(deriveBox1);
                // 步骤 1：点 M 闪烁
                flashElement(pointM);
            }
            if (currentStep >= 2) {
                show(deriveBox2);
                // 步骤 2：向量 OM 加粗
                vectorOM.style.strokeWidth = '4';
            }
            if (currentStep >= 3) {
                show(deriveBox3);
                // 步骤 3：向量 OM 和 PF 同时高亮
                vectorOM.style.strokeWidth = '4';
                vectorPF.style.strokeWidth = '4';
            }
            if (currentStep >= 4) {
                show(deriveBox4);
                // 步骤 4：点 P 闪烁，双曲线加粗
                flashElement(pointP);
                hyperbola.style.strokeWidth = '3';
            }
            if (currentStep >= 5) {
                show(deriveBox5);
            }
            if (currentStep >= 6) {
                show(conclusionBox);
                // 步骤 6：结论框闪烁
                flashElement(conclusionBox.querySelector('rect'));
            }

            updateButtons();
        }

        // 闪烁动画
        function flashElement(el) {
            const originalOpacity = el.style.opacity || '1';
            const originalFill = el.style.fill || '';
            const originalStroke = el.style.stroke || '';

            let count = 0;
            const maxCount = 4; // 闪烁 2 次（开 - 关 - 开 - 关）

            const interval = setInterval(() => {
                count++;
                if (count % 2 === 1) {
                    if (el.tagName === 'rect') {
                        el.style.opacity = '0.5';
                    } else if (el.tagName === 'circle') {
                        el.style.fill = '#ff5722';
                    }
                } else {
                    if (el.tagName === 'rect') {
                        el.style.opacity = originalOpacity;
                    } else if (el.tagName === 'circle') {
                        el.style.fill = originalFill || '#1565c0';
                    }
                }

                if (count >= maxCount) {
                    clearInterval(interval);
                    // 恢复原状
                    if (el.tagName === 'rect') {
                        el.style.opacity = originalOpacity;
                    } else if (el.tagName === 'circle') {
                        el.style.fill = originalFill || '#1565c0';
                    }
                }
            }, 150);
        }

        // 按钮点击事件
        btnPrevBg.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        });

        btnNextBg.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateDisplay();
            }
        });

        // 初始化
        updateDisplay();

        // MathJax 重新渲染
        if (window.MathJax) {
            MathJax.typesetPromise();
        }
    })();
    </script>
</body>
</html>
