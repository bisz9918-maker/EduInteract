<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>底面对角线垂直的四边形示例</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene2-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene2-svg {
            width: 800px;
            height: 500px;
        }
        .scene2-btn {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border: 2px solid #333;
            border-radius: 4px;
            background: #f0f0f0;
            transition: all 0.2s;
        }
        .scene2-btn.active {
            background: #1565c0;
            color: white;
            border-color: #1565c0;
        }
        .scene2-btn:hover {
            opacity: 0.8;
        }
        #scene2-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 12px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 状态标签 -->
            <text id="scene2-state-label" x="400" y="80" text-anchor="middle" font-size="18" fill="#333">一般四边形</text>
            
            <!-- 四边形边框 -->
            <path id="scene2-quad" d="" fill="none" stroke="#000000" stroke-width="1.5"/>
            
            <!-- 对角线 AC -->
            <line id="scene2-diag-ac" x1="0" y1="0" x2="0" y2="0" stroke="#1565c0" stroke-width="2"/>
            <text id="scene2-label-ac" x="0" y="0" text-anchor="start" font-size="14" fill="#1565c0">AC</text>
            
            <!-- 对角线 BD -->
            <line id="scene2-diag-bd" x1="0" y1="0" x2="0" y2="0" stroke="#c62828" stroke-width="2"/>
            <text id="scene2-label-bd" x="0" y="0" text-anchor="middle" font-size="14" fill="#c62828">BD</text>
            
            <!-- 垂直符号（绿色直角标记） -->
            <path id="scene2-perp-symbol" d="" fill="none" stroke="#2e7d32" stroke-width="1.5" style="display: none;"/>
            
            <!-- 等长标记（四边中点外侧短划线） -->
            <g id="scene2-equal-marks" style="display: none;">
                <line x1="0" y1="0" x2="0" y2="0" stroke="#000" stroke-width="1"/>
                <line x1="0" y1="0" x2="0" y2="0" stroke="#000" stroke-width="1"/>
                <line x1="0" y1="0" x2="0" y2="0" stroke="#000" stroke-width="1"/>
                <line x1="0" y1="0" x2="0" y2="0" stroke="#000" stroke-width="1"/>
            </g>
            
            <!-- 顶点标签 -->
            <text id="scene2-label-a" x="0" y="0" text-anchor="middle" font-size="14" fill="#000">A</text>
            <text id="scene2-label-b" x="0" y="0" text-anchor="middle" font-size="14" fill="#000">B</text>
            <text id="scene2-label-c" x="0" y="0" text-anchor="middle" font-size="14" fill="#000">C</text>
            <text id="scene2-label-d" x="0" y="0" text-anchor="middle" font-size="14" fill="#000">D</text>
            
            <!-- 底部提示 -->
            <text id="scene2-hint" x="400" y="410" text-anchor="middle" font-size="14" fill="#333">对角线不垂直</text>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-btn-0" class="scene2-btn active">一般四边形</button>
            <button id="scene2-btn-1" class="scene2-btn">菱形</button>
            <button id="scene2-btn-2" class="scene2-btn">正方形</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现：底面对角线垂直的四边形示例
        
        // 三种状态的顶点坐标
        const states = [
            { // 状态0：一般四边形
                name: "一般四边形",
                hint: "对角线不垂直",
                vertices: {
                    A: { x: 350, y: 340 },
                    B: { x: 280, y: 280 },
                    C: { x: 340, y: 200 },
                    D: { x: 450, y: 260 }
                },
                showPerp: false,
                showEqual: false
            },
            { // 状态1：菱形
                name: "菱形",
                hint: "对角线垂直",
                vertices: {
                    A: { x: 400, y: 350 },
                    B: { x: 340, y: 270 },
                    C: { x: 400, y: 190 },
                    D: { x: 460, y: 270 }
                },
                showPerp: true,
                showEqual: false
            },
            { // 状态2：正方形（旋转45度）
                name: "正方形",
                hint: "对角线垂直",
                vertices: {
                    A: { x: 400, y: 345 },
                    B: { x: 335, y: 270 },
                    C: { x: 400, y: 195 },
                    D: { x: 465, y: 270 }
                },
                showPerp: true,
                showEqual: true
            }
        ];
        
        let currentState = 0;
        
        // 获取 DOM 元素
        const quad = document.getElementById('scene2-quad');
        const diagAc = document.getElementById('scene2-diag-ac');
        const diagBd = document.getElementById('scene2-diag-bd');
        const labelAc = document.getElementById('scene2-label-ac');
        const labelBd = document.getElementById('scene2-label-bd');
        const perpSymbol = document.getElementById('scene2-perp-symbol');
        const equalMarks = document.getElementById('scene2-equal-marks');
        const labelA = document.getElementById('scene2-label-a');
        const labelB = document.getElementById('scene2-label-b');
        const labelC = document.getElementById('scene2-label-c');
        const labelD = document.getElementById('scene2-label-d');
        const stateLabel = document.getElementById('scene2-state-label');
        const hint = document.getElementById('scene2-hint');
        const btn0 = document.getElementById('scene2-btn-0');
        const btn1 = document.getElementById('scene2-btn-1');
        const btn2 = document.getElementById('scene2-btn-2');
        
        // 更新图形显示
        function updateDisplay(stateIndex) {
            const state = states[stateIndex];
            const v = state.vertices;
            
            // 更新四边形路径
            const quadPath = `M ${v.A.x} ${v.A.y} L ${v.B.x} ${v.B.y} L ${v.C.x} ${v.C.y} L ${v.D.x} ${v.D.y} Z`;
            quad.setAttribute('d', quadPath);
            
            // 更新对角线 AC
            diagAc.setAttribute('x1', v.A.x);
            diagAc.setAttribute('y1', v.A.y);
            diagAc.setAttribute('x2', v.C.x);
            diagAc.setAttribute('y2', v.C.y);
            
            // 更新对角线 BD
            diagBd.setAttribute('x1', v.B.x);
            diagBd.setAttribute('y1', v.B.y);
            diagBd.setAttribute('x2', v.D.x);
            diagBd.setAttribute('y2', v.D.y);
            
            // 更新 AC 标签位置（中点右侧 15px）
            const acMidX = (v.A.x + v.C.x) / 2;
            const acMidY = (v.A.y + v.C.y) / 2;
            labelAc.setAttribute('x', acMidX + 15);
            labelAc.setAttribute('y', acMidY + 5);
            
            // 更新 BD 标签位置（中点上方 15px）
            const bdMidX = (v.B.x + v.D.x) / 2;
            const bdMidY = (v.B.y + v.D.y) / 2;
            labelBd.setAttribute('x', bdMidX);
            labelBd.setAttribute('y', bdMidY - 15);
            
            // 更新顶点标签位置
            labelA.setAttribute('x', v.A.x);
            labelA.setAttribute('y', v.A.y + 20);
            labelB.setAttribute('x', v.B.x - 20);
            labelB.setAttribute('y', v.B.y + 5);
            labelC.setAttribute('x', v.C.x);
            labelC.setAttribute('y', v.C.y - 15);
            labelD.setAttribute('x', v.D.x + 20);
            labelD.setAttribute('y', v.D.y + 5);
            
            // 更新垂直符号
            if (state.showPerp) {
                // 计算对角线交点
                const intersectX = (v.B.x + v.D.x) / 2;
                const intersectY = (v.B.y + v.D.y) / 2;
                // 绘制直角符号（小正方形的一角）
                const perpPath = `M ${intersectX - 5} ${intersectY} L ${intersectX - 5} ${intersectY - 5} L ${intersectX} ${intersectY - 5}`;
                perpSymbol.setAttribute('d', perpPath);
                perpSymbol.style.display = 'block';
            } else {
                perpSymbol.style.display = 'none';
            }
            
            // 更新等长标记
            if (state.showEqual) {
                // 计算四边中点并绘制标记
                const midAB = { x: (v.A.x + v.B.x) / 2, y: (v.A.y + v.B.y) / 2 };
                const midBC = { x: (v.B.x + v.C.x) / 2, y: (v.B.y + v.C.y) / 2 };
                const midCD = { x: (v.C.x + v.D.x) / 2, y: (v.C.y + v.D.y) / 2 };
                const midDA = { x: (v.D.x + v.A.x) / 2, y: (v.D.y + v.A.y) / 2 };
                
                const marks = equalMarks.querySelectorAll('line');
                // AB 边中点标记（垂直于边的短线）
                marks[0].setAttribute('x1', midAB.x - 4);
                marks[0].setAttribute('y1', midAB.y - 4);
                marks[0].setAttribute('x2', midAB.x + 4);
                marks[0].setAttribute('y2', midAB.y + 4);
                // BC 边中点标记
                marks[1].setAttribute('x1', midBC.x - 4);
                marks[1].setAttribute('y1', midBC.y + 4);
                marks[1].setAttribute('x2', midBC.x + 4);
                marks[1].setAttribute('y2', midBC.y - 4);
                // CD 边中点标记
                marks[2].setAttribute('x1', midCD.x - 4);
                marks[2].setAttribute('y1', midCD.y - 4);
                marks[2].setAttribute('x2', midCD.x + 4);
                marks[2].setAttribute('y2', midCD.y + 4);
                // DA 边中点标记
                marks[3].setAttribute('x1', midDA.x + 4);
                marks[3].setAttribute('y1', midDA.y - 4);
                marks[3].setAttribute('x2', midDA.x - 4);
                marks[3].setAttribute('y2', midDA.y + 4);
                
                equalMarks.style.display = 'block';
            } else {
                equalMarks.style.display = 'none';
            }
            
            // 更新状态标签和提示
            stateLabel.textContent = state.name;
            hint.textContent = state.hint;
            
            // 更新按钮高亮
            btn0.classList.toggle('active', stateIndex === 0);
            btn1.classList.toggle('active', stateIndex === 1);
            btn2.classList.toggle('active', stateIndex === 2);
        }
        
        // 按钮点击事件
        btn0.addEventListener('click', function() {
            currentState = 0;
            updateDisplay(currentState);
        });
        
        btn1.addEventListener('click', function() {
            currentState = 1;
            updateDisplay(currentState);
        });
        
        btn2.addEventListener('click', function() {
            currentState = 2;
            updateDisplay(currentState);
        });
        
        // 初始化显示
        updateDisplay(currentState);
    })();
    </script>
</body>
</html>
