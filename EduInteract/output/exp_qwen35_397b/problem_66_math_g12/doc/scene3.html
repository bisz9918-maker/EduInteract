<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三棱锥体积与异面直线夹角</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg width="800" height="500" id="scene3-svg">
            <!-- 定义 -->
            <defs>
                <clipPath id="scene3-volume-clip">
                    <rect id="scene3-volume-clip-rect" x="70" y="300" width="0" height="80"/>
                </clipPath>
                <clipPath id="scene3-angle-clip">
                    <rect id="scene3-angle-clip-rect" x="440" y="300" width="0" height="80"/>
                </clipPath>
            </defs>

            <!-- 三棱锥图区 (y=50-250) -->
            <g id="scene3-pyramid-group">
                <!-- 底面 FED -->
                <polygon id="scene3-base" points="250,120 350,120 300,180" fill="#e0e0e0" fill-opacity="0.15" stroke="#000000" stroke-width="2"/>
                
                <!-- 旋转轴 DE (加粗) -->
                <line id="scene3-axis-de" x1="280" y1="135" x2="320" y2="135" stroke="#000000" stroke-width="3"/>
                
                <!-- 棱 A'F -->
                <line id="scene3-edge-a-f" x1="300" y1="60" x2="250" y2="120" stroke="#000000" stroke-width="2"/>
                
                <!-- 棱 A'E -->
                <line id="scene3-edge-a-e" x1="300" y1="60" x2="350" y2="120" stroke="#000000" stroke-width="2"/>
                
                <!-- 棱 A'D (虚线，被遮挡) -->
                <line id="scene3-edge-a-d" x1="300" y1="60" x2="300" y2="180" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" opacity="0.5"/>
                
                <!-- 角度θ指示弧 -->
                <path id="scene3-angle-arc" d="M 325,135 A 25,25 0 0 0 300,110" fill="none" stroke="#c62828" stroke-width="2"/>
                
                <!-- 点标签 -->
                <text id="scene3-label-f" x="240" y="125" font-size="14" fill="#000000">F</text>
                <text id="scene3-label-e" x="360" y="125" font-size="14" fill="#000000">E</text>
                <text id="scene3-label-d" x="300" y="195" font-size="14" fill="#000000">D</text>
                <text id="scene3-label-a" x="310" y="50" font-size="14" fill="#000000">A'</text>
                <text id="scene3-theta-value" x="330" y="110" font-size="14" fill="#c62828">0°</text>
            </g>

            <!-- 体积图区 (50,280)-(380,400) -->
            <g id="scene3-volume-chart">
                <!-- 标题 -->
                <text id="scene3-volume-title" x="215" y="290" font-size="14" fill="#000000" text-anchor="middle">体积 V-θ</text>
                
                <!-- Y 轴标签 -->
                <text id="scene3-volume-y-label" x="55" y="340" font-size="12" fill="#000000" text-anchor="middle" transform="rotate(-90,55,340)">V</text>
                
                <!-- X 轴 -->
                <line id="scene3-volume-x-axis" x1="70" y1="380" x2="360" y2="380" stroke="#000000" stroke-width="2"/>
                
                <!-- Y 轴 -->
                <line id="scene3-volume-y-axis" x1="70" y1="380" x2="70" y2="300" stroke="#000000" stroke-width="2"/>
                
                <!-- 体积曲线 (预绘制完整路径，用 clipPath 控制显示) -->
                <path id="scene3-volume-curve" d="M 70,380 Q 215,310 360,380" fill="none" stroke="#1565c0" stroke-width="2" clip-path="url(#scene3-volume-clip)"/>
                
                <!-- 最大值点 -->
                <circle id="scene3-volume-max" cx="215" cy="310" r="6" fill="#2e7d32" opacity="0"/>
                <text id="scene3-volume-max-label" x="215" y="300" font-size="12" fill="#2e7d32" text-anchor="middle" opacity="0">最大</text>
                
                <!-- X 轴标签 -->
                <text id="scene3-volume-x-label" x="215" y="395" font-size="12" fill="#000000" text-anchor="middle">θ (度)</text>
                
                <!-- 刻度标签 -->
                <text id="scene3-volume-0" x="70" y="395" font-size="10" fill="#000000" text-anchor="middle">0°</text>
                <text id="scene3-volume-90" x="215" y="395" font-size="10" fill="#000000" text-anchor="middle">90°</text>
                <text id="scene3-volume-180" x="360" y="395" font-size="10" fill="#000000" text-anchor="middle">180°</text>
            </g>

            <!-- 夹角图区 (420,280)-(750,400) -->
            <g id="scene3-angle-chart">
                <!-- 标题 -->
                <text id="scene3-angle-title" x="585" y="290" font-size="14" fill="#000000" text-anchor="middle">夹角φ-θ</text>
                
                <!-- Y 轴标签 -->
                <text id="scene3-angle-y-label" x="425" y="340" font-size="12" fill="#000000" text-anchor="middle" transform="rotate(-90,425,340)">φ</text>
                
                <!-- X 轴 -->
                <line id="scene3-angle-x-axis" x1="440" y1="380" x2="730" y2="380" stroke="#000000" stroke-width="2"/>
                
                <!-- Y 轴 -->
                <line id="scene3-angle-y-axis" x1="440" y1="380" x2="440" y2="300" stroke="#000000" stroke-width="2"/>
                
                <!-- 夹角曲线 (预绘制完整路径，用 clipPath 控制显示) -->
                <path id="scene3-angle-curve" d="M 440,380 Q 585,340 730,320" fill="none" stroke="#c62828" stroke-width="2" clip-path="url(#scene3-angle-clip)"/>
                
                <!-- 垂直点标记 -->
                <circle id="scene3-angle-perp" cx="650" cy="335" r="6" fill="#2e7d32" opacity="0"/>
                <text id="scene3-angle-perp-label" x="650" y="325" font-size="12" fill="#2e7d32" text-anchor="middle" opacity="0">垂直</text>
                
                <!-- 垂直提示框 -->
                <rect id="scene3-perp-box" x="600" y="320" width="140" height="30" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1" opacity="0"/>
                <text id="scene3-perp-text" x="670" y="340" font-size="12" fill="#2e7d32" text-anchor="middle" opacity="0">垂直!</text>
                
                <!-- X 轴标签 -->
                <text id="scene3-angle-x-label" x="585" y="395" font-size="12" fill="#000000" text-anchor="middle">θ (度)</text>
                
                <!-- 刻度标签 -->
                <text id="scene3-angle-0" x="440" y="395" font-size="10" fill="#000000" text-anchor="middle">0°</text>
                <text id="scene3-angle-90" x="585" y="395" font-size="10" fill="#000000" text-anchor="middle">90°</text>
                <text id="scene3-angle-180" x="730" y="395" font-size="10" fill="#000000" text-anchor="middle">180°</text>
            </g>

            <!-- 滑块控件区 (y=440-490) -->
            <g id="scene3-slider-group">
                <!-- 滑块标签 -->
                <text id="scene3-slider-label" x="400" y="440" font-size="14" fill="#000000" text-anchor="middle">旋转角θ</text>
                
                <!-- 滑块轨道 -->
                <line id="scene3-slider-track" x1="210" y1="460" x2="590" y2="460" stroke="#888888" stroke-width="4"/>
                
                <!-- 滑块手柄 -->
                <circle id="scene3-slider-handle" cx="210" cy="460" r="10" fill="#1565c0" style="cursor: pointer"/>
                
                <!-- 滑块数值 -->
                <text id="scene3-slider-value" x="400" y="485" font-size="14" fill="#000000" text-anchor="middle">0°</text>
            </g>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 3 实现：三棱锥体积与异面直线夹角
        
        // 状态变量
        let theta = 0; // 旋转角 0-180
        let isDragging = false;
        
        // 常量定义
        const Gx = 300, Gy = 135; // 旋转中心 G
        const AG = 75; // A 到 G 的距离
        const scaleX = 1, scaleY = 0.6; // 透视压缩比例
        
        // DOM 元素引用
        const svg = document.getElementById('scene3-svg');
        const pointA = document.getElementById('scene3-label-a');
        const edgeAF = document.getElementById('scene3-edge-a-f');
        const edgeAE = document.getElementById('scene3-edge-a-e');
        const edgeAD = document.getElementById('scene3-edge-a-d');
        const angleArc = document.getElementById('scene3-angle-arc');
        const thetaValue = document.getElementById('scene3-theta-value');
        
        const volumeClipRect = document.getElementById('scene3-volume-clip-rect');
        const volumeCurve = document.getElementById('scene3-volume-curve');
        const volumeMax = document.getElementById('scene3-volume-max');
        const volumeMaxLabel = document.getElementById('scene3-volume-max-label');
        
        const angleClipRect = document.getElementById('scene3-angle-clip-rect');
        const angleCurve = document.getElementById('scene3-angle-curve');
        const anglePerp = document.getElementById('scene3-angle-perp');
        const anglePerpLabel = document.getElementById('scene3-angle-perp-label');
        const perpBox = document.getElementById('scene3-perp-box');
        const perpText = document.getElementById('scene3-perp-text');
        
        const sliderHandle = document.getElementById('scene3-slider-handle');
        const sliderValue = document.getElementById('scene3-slider-value');
        const sliderTrack = document.getElementById('scene3-slider-track');
        
        // 计算 A' 位置（绕 DE 轴旋转）
        function calculateAPosition(thetaRad) {
            const cosT = Math.cos(thetaRad);
            const sinT = Math.sin(thetaRad);
            // A' 绕 DE 轴旋转，在透视图中沿椭圆轨迹
            const x = Gx + AG * cosT * scaleX;
            const y = Gy - AG * sinT * scaleY;
            return { x, y };
        }
        
        // 计算体积 V(θ) = V_max * sin(θ)
        function calculateVolume(thetaDeg) {
            const thetaRad = thetaDeg * Math.PI / 180;
            return Math.sin(thetaRad);
        }
        
        // 计算夹角φ(θ) - 简化模型
        function calculateAngle(thetaDeg) {
            // 简化：φ 从某个初始值变化到 90° 再变化
            const thetaRad = thetaDeg * Math.PI / 180;
            // 假设在θ≈120°时达到垂直
            const perpTheta = 120;
            const diff = Math.abs(thetaDeg - perpTheta);
            const angle = 90 - Math.max(0, 30 - diff);
            return angle;
        }
        
        // 计算体积曲线上的点位置
        function getVolumePoint(thetaDeg) {
            const x = 70 + (thetaDeg / 180) * 290;
            const v = calculateVolume(thetaDeg);
            const y = 380 - v * 70;
            return { x, y };
        }
        
        // 计算夹角曲线上的点位置
        function getAnglePoint(thetaDeg) {
            const x = 440 + (thetaDeg / 180) * 290;
            const phi = calculateAngle(thetaDeg);
            const y = 380 - (phi / 90) * 70;
            return { x, y };
        }
        
        // 更新三棱锥显示
        function updatePyramid() {
            const thetaRad = theta * Math.PI / 180;
            const pos = calculateAPosition(thetaRad);
            
            // 更新 A' 点位置
            edgeAF.setAttribute('x1', pos.x);
            edgeAF.setAttribute('y1', pos.y);
            edgeAE.setAttribute('x1', pos.x);
            edgeAE.setAttribute('y1', pos.y);
            edgeAD.setAttribute('x1', pos.x);
            edgeAD.setAttribute('y1', pos.y);
            
            // 更新 A' 标签位置
            pointA.setAttribute('x', pos.x + 10);
            pointA.setAttribute('y', pos.y - 10);
            
            // 更新角度弧
            const arcEndX = Gx + 25 * Math.cos(thetaRad);
            const arcEndY = Gy - 25 * Math.sin(thetaRad);
            const largeArc = theta > 180 ? 1 : 0;
            angleArc.setAttribute('d', `M ${Gx + 25},${Gy} A 25,25 0 ${largeArc} 0 ${arcEndX},${arcEndY}`);
            
            // 更新θ值标签
            thetaValue.textContent = theta + '°';
            thetaValue.setAttribute('x', arcEndX + 5);
            thetaValue.setAttribute('y', arcEndY - 5);
        }
        
        // 更新体积图
        function updateVolumeChart() {
            // 更新 clipPath 宽度
            const clipWidth = (theta / 180) * 290;
            volumeClipRect.setAttribute('width', clipWidth);
            
            // θ=90°时显示最大值标记
            if (theta >= 90) {
                volumeMax.setAttribute('opacity', 1);
                volumeMaxLabel.setAttribute('opacity', 1);
            } else {
                volumeMax.setAttribute('opacity', 0);
                volumeMaxLabel.setAttribute('opacity', 0);
            }
        }
        
        // 更新夹角图
        function updateAngleChart() {
            // 更新 clipPath 宽度
            const clipWidth = (theta / 180) * 290;
            angleClipRect.setAttribute('width', clipWidth);
            
            // 检测是否垂直（φ≈90°）
            const phi = calculateAngle(theta);
            if (Math.abs(phi - 90) < 2 && theta > 0) {
                const point = getAnglePoint(theta);
                anglePerp.setAttribute('cx', point.x);
                anglePerp.setAttribute('cy', point.y);
                anglePerpLabel.setAttribute('x', point.x);
                anglePerpLabel.setAttribute('y', point.y - 10);
                anglePerp.setAttribute('opacity', 1);
                anglePerpLabel.setAttribute('opacity', 1);
                perpBox.setAttribute('opacity', 1);
                perpText.setAttribute('opacity', 1);
            } else {
                anglePerp.setAttribute('opacity', 0);
                anglePerpLabel.setAttribute('opacity', 0);
                perpBox.setAttribute('opacity', 0);
                perpText.setAttribute('opacity', 0);
            }
        }
        
        // 更新滑块
        function updateSlider() {
            const handleX = 210 + (theta / 180) * 380;
            sliderHandle.setAttribute('cx', handleX);
            sliderValue.textContent = theta + '°';
        }
        
        // 主更新函数
        function update() {
            updatePyramid();
            updateVolumeChart();
            updateAngleChart();
            updateSlider();
        }
        
        // 滑块拖拽事件处理
        function handleMouseDown(e) {
            isDragging = true;
            handleMouseMove(e);
        }
        
        function handleMouseMove(e) {
            if (!isDragging) return;
            
            const rect = sliderTrack.getBoundingClientRect();
            const svgRect = svg.getBoundingClientRect();
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            
            if (clientX === undefined) return;
            
            let x = clientX - svgRect.left;
            x = Math.max(210, Math.min(590, x));
            
            theta = Math.round(((x - 210) / 380) * 180);
            theta = Math.max(0, Math.min(180, theta));
            
            update();
        }
        
        function handleMouseUp() {
            isDragging = false;
        }
        
        // 绑定事件
        sliderHandle.addEventListener('mousedown', handleMouseDown);
        sliderHandle.addEventListener('touchstart', handleMouseDown);
        
        document.addEventListener('mousemove', handleMouseMove);
        document.addEventListener('touchmove', handleMouseMove);
        
        document.addEventListener('mouseup', handleMouseUp);
        document.addEventListener('touchend', handleMouseUp);
        
        // 初始化
        update();
        
    })();
    </script>
</body>
</html>
