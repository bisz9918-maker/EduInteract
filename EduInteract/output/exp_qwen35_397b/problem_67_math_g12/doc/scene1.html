<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>椭圆几何性质 - 结论①验证</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-svg { width: 800px; height: 500px; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 20px; z-index: 10; }
        .scene1-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #333; border-radius: 4px; background: #f5f5f5; }
        .scene1-btn:hover { background: #e0e0e0; }
        .scene1-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 14px; min-width: 80px; text-align: center; }
        .scene1-hidden { display: none; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 坐标轴 -->
            <line id="scene1-axis-x" x1="100" y1="250" x2="700" y2="250" stroke="#000000" stroke-width="2" />
            <line id="scene1-axis-y" x1="400" y1="50" x2="400" y2="450" stroke="#000000" stroke-width="2" />
            
            <!-- 椭圆 -->
            <ellipse id="scene1-ellipse" cx="400" cy="250" rx="200" ry="100" fill="none" stroke="#000000" stroke-width="2" />
            
            <!-- 点 A (左顶点) -->
            <circle id="scene1-point-a" cx="200" cy="250" r="4" fill="#000000" />
            <text id="scene1-label-a" x="188" y="265" font-size="14" fill="#000000">A</text>
            
            <!-- 点 B (右顶点) -->
            <circle id="scene1-point-b" cx="600" cy="250" r="4" fill="#000000" />
            <text id="scene1-label-b" x="612" y="265" font-size="14" fill="#000000">B</text>
            
            <!-- 原点 O -->
            <text id="scene1-label-o" x="385" y="270" font-size="14" fill="#000000">O</text>
            
            <!-- 点 F (右焦点) - 步骤1显示 -->
            <circle id="scene1-point-f" cx="573" cy="250" r="4" fill="#000000" class="scene1-hidden" />
            <text id="scene1-label-f" x="573" y="268" font-size="14" fill="#000000" class="scene1-hidden">F</text>
            <line id="scene1-line-fb" x1="573" y1="250" x2="600" y2="250" stroke="#000000" stroke-width="2" class="scene1-hidden" />
            
            <!-- 切线 l - 步骤2显示 -->
            <line id="scene1-line-l" x1="600" y1="80" x2="600" y2="420" stroke="#000000" stroke-width="2" class="scene1-hidden" />
            <text id="scene1-label-l" x="612" y="250" font-size="14" fill="#000000" class="scene1-hidden">l</text>
            
            <!-- 点 P 和直线 AP - 步骤3显示 -->
            <line id="scene1-line-ap" x1="200" y1="250" x2="600" y2="134" stroke="#000000" stroke-width="2" class="scene1-hidden" />
            <circle id="scene1-point-p" cx="500" cy="163" r="5" fill="#000000" class="scene1-hidden" style="cursor: pointer;" />
            <text id="scene1-label-p" x="500" y="148" font-size="14" fill="#000000" class="scene1-hidden">P</text>
            
            <!-- 点 D 和点 M - 步骤4显示 -->
            <circle id="scene1-point-d" cx="600" cy="134" r="4" fill="#000000" class="scene1-hidden" />
            <text id="scene1-label-d" x="612" y="134" font-size="14" fill="#000000" class="scene1-hidden">D</text>
            <circle id="scene1-point-m" cx="600" cy="192" r="4" fill="#000000" class="scene1-hidden" />
            <text id="scene1-label-m" x="612" y="192" font-size="14" fill="#000000" class="scene1-hidden">M</text>
            <line id="scene1-line-fm" x1="573" y1="250" x2="600" y2="192" stroke="#000000" stroke-width="2" class="scene1-hidden" />
            <line id="scene1-line-pf" x1="500" y1="163" x2="573" y2="250" stroke="#000000" stroke-width="2" class="scene1-hidden" />
            
            <!-- 角度弧线 - 步骤5显示 -->
            <path id="scene1-arc-angle1" d="" fill="none" stroke="#c62828" stroke-width="2" opacity="0.2" class="scene1-hidden" />
            <path id="scene1-arc-angle2" d="" fill="none" stroke="#c62828" stroke-width="2" opacity="0.2" class="scene1-hidden" />
            <text id="scene1-label-angle1" x="560" y="220" font-size="14" fill="#c62828" class="scene1-hidden">∠1</text>
            <text id="scene1-label-angle2" x="585" y="235" font-size="14" fill="#c62828" class="scene1-hidden">∠2</text>
            
            <!-- 验证标记 - 步骤5显示 -->
            <text id="scene1-checkmark" x="620" y="200" font-size="20" fill="#2e7d32" class="scene1-hidden">✓</text>
            
            <!-- 控件栏 -->
            <g id="scene1-controls">
                <rect x="0" y="440" width="800" height="60" fill="#ffffff" opacity="0.9" />
            </g>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 0/6</span>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现
        // 布局坐标表参考:
        // 坐标轴 X: (100,250)-(700,250)
        // 坐标轴 Y: (400,50)-(400,450)
        // 原点 O: (400,250)
        // 椭圆: 中心(400,250), rx=200, ry=100
        // 点 A: (200,250), 点 B: (600,250), 点 F: (573,250)
        // 切线 l: x=600, y=80~420
        // 点 P: (500,163), 点 D: (600,134), 点 M: (600,192)
        
        const STATE = {
            currentStep: 0,
            totalSteps: 6,
            pAngle: Math.PI / 3, // 60度，P点初始角度
            isDragging: false
        };
        
        // 椭圆参数
        const ELLIPSE = {
            cx: 400,
            cy: 250,
            rx: 200,
            ry: 100
        };
        
        // 获取元素
        const elements = {
            pointF: document.getElementById('scene1-point-f'),
            labelF: document.getElementById('scene1-label-f'),
            lineFb: document.getElementById('scene1-line-fb'),
            lineL: document.getElementById('scene1-line-l'),
            labelL: document.getElementById('scene1-label-l'),
            lineAp: document.getElementById('scene1-line-ap'),
            pointP: document.getElementById('scene1-point-p'),
            labelP: document.getElementById('scene1-label-p'),
            pointD: document.getElementById('scene1-point-d'),
            labelD: document.getElementById('scene1-label-d'),
            pointM: document.getElementById('scene1-point-m'),
            labelM: document.getElementById('scene1-label-m'),
            lineFm: document.getElementById('scene1-line-fm'),
            linePf: document.getElementById('scene1-line-pf'),
            arcAngle1: document.getElementById('scene1-arc-angle1'),
            arcAngle2: document.getElementById('scene1-arc-angle2'),
            labelAngle1: document.getElementById('scene1-label-angle1'),
            labelAngle2: document.getElementById('scene1-label-angle2'),
            checkmark: document.getElementById('scene1-checkmark'),
            btnPrev: document.getElementById('scene1-btn-prev'),
            btnNext: document.getElementById('scene1-btn-next'),
            stepIndicator: document.getElementById('scene1-step-indicator')
        };
        
        // 显示/隐藏元素
        function show(el) {
            if (el) {
                el.classList.remove('scene1-hidden');
                el.style.display = '';
                el.style.opacity = '';
            }
        }
        
        function hide(el) {
            if (el) {
                el.classList.add('scene1-hidden');
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }
        
        // 计算椭圆上点坐标
        function getEllipsePoint(angle) {
            return {
                x: ELLIPSE.cx + ELLIPSE.rx * Math.cos(angle),
                y: ELLIPSE.cy - ELLIPSE.ry * Math.sin(angle)
            };
        }
        
        // 计算直线 AP 与切线 l (x=600) 的交点 D
        function getIntersectionD(px, py) {
            const ax = 200, ay = 250;
            // 直线 AP 参数方程: (ax, ay) + t * (px-ax, py-ay)
            // 与 x=600 相交: ax + t*(px-ax) = 600
            const t = (600 - ax) / (px - ax);
            return {
                x: 600,
                y: ay + t * (py - ay)
            };
        }
        
        // 计算中点 M
        function getMidpoint(x1, y1, x2, y2) {
            return {
                x: (x1 + x2) / 2,
                y: (y1 + y2) / 2
            };
        }
        
        // 计算角度（弧度）
        function getAngle(x1, y1, x2, y2) {
            return Math.atan2(y2 - y1, x2 - x1);
        }
        
        // 绘制圆弧
        function drawArc(cx, cy, r, startAngle, endAngle) {
            const x1 = cx + r * Math.cos(startAngle);
            const y1 = cy + r * Math.sin(startAngle);
            const x2 = cx + r * Math.cos(endAngle);
            const y2 = cy + r * Math.sin(endAngle);
            const largeArc = Math.abs(endAngle - startAngle) > Math.PI ? 1 : 0;
            return `M ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 1 ${x2} ${y2}`;
        }
        
        // 更新 P 点及相关元素
        function updatePElements() {
            const p = getEllipsePoint(STATE.pAngle);
            const d = getIntersectionD(p.x, p.y);
            const m = getMidpoint(600, 250, d.x, d.y); // B(600,250) 和 D 的中点
            
            // 更新 P 点
            elements.pointP.setAttribute('cx', p.x);
            elements.pointP.setAttribute('cy', p.y);
            elements.labelP.setAttribute('x', p.x);
            elements.labelP.setAttribute('y', p.y - 15);
            
            // 更新直线 AP (从 A 到 D)
            elements.lineAp.setAttribute('x1', 200);
            elements.lineAp.setAttribute('y1', 250);
            elements.lineAp.setAttribute('x2', d.x);
            elements.lineAp.setAttribute('y2', d.y);
            
            // 更新 D 点
            elements.pointD.setAttribute('cx', d.x);
            elements.pointD.setAttribute('cy', d.y);
            elements.labelD.setAttribute('x', d.x + 12);
            elements.labelD.setAttribute('y', d.y);
            
            // 更新 M 点
            elements.pointM.setAttribute('cx', m.x);
            elements.pointM.setAttribute('cy', m.y);
            elements.labelM.setAttribute('x', m.x + 12);
            elements.labelM.setAttribute('y', m.y);
            
            // 更新线段 FM
            elements.lineFm.setAttribute('x1', 573);
            elements.lineFm.setAttribute('y1', 250);
            elements.lineFm.setAttribute('x2', m.x);
            elements.lineFm.setAttribute('y2', m.y);
            
            // 更新线段 PF
            elements.linePf.setAttribute('x1', p.x);
            elements.linePf.setAttribute('y1', p.y);
            elements.linePf.setAttribute('x2', 573);
            elements.linePf.setAttribute('y2', 250);
            
            // 更新角度弧线
            const fx = 573, fy = 250;
            const anglePF = getAngle(fx, fy, p.x, p.y);
            const angleFM = getAngle(fx, fy, m.x, m.y);
            const angleFB = getAngle(fx, fy, 600, 250); // 0 (水平向右)
            
            const r = 25;
            elements.arcAngle1.setAttribute('d', drawArc(fx, fy, r, anglePF, angleFM));
            elements.arcAngle2.setAttribute('d', drawArc(fx, fy, r, angleFM, angleFB));
            
            // 更新角度标签位置
            const midAngle1 = (anglePF + angleFM) / 2;
            const midAngle2 = (angleFM + angleFB) / 2;
            elements.labelAngle1.setAttribute('x', fx + (r + 15) * Math.cos(midAngle1));
            elements.labelAngle1.setAttribute('y', fy + (r + 15) * Math.sin(midAngle1) + 5);
            elements.labelAngle2.setAttribute('x', fx + (r + 15) * Math.cos(midAngle2));
            elements.labelAngle2.setAttribute('y', fy + (r + 15) * Math.sin(midAngle2) + 5);
        }
        
        // 更新步骤显示
        function updateStepDisplay() {
            elements.stepIndicator.textContent = `步骤 ${STATE.currentStep}/${STATE.totalSteps}`;
            elements.btnPrev.disabled = STATE.currentStep === 0;
            elements.btnNext.disabled = STATE.currentStep === STATE.totalSteps;
            
            // 步骤 0: 坐标轴、椭圆、A、B、O (始终显示)
            
            // 步骤 1: 添加 F
            if (STATE.currentStep >= 1) {
                show(elements.pointF);
                show(elements.labelF);
                show(elements.lineFb);
            } else {
                hide(elements.pointF);
                hide(elements.labelF);
                hide(elements.lineFb);
            }
            
            // 步骤 2: 添加切线 l
            if (STATE.currentStep >= 2) {
                show(elements.lineL);
                show(elements.labelL);
            } else {
                hide(elements.lineL);
                hide(elements.labelL);
            }
            
            // 步骤 3: 添加 P 和 AP
            if (STATE.currentStep >= 3) {
                show(elements.lineAp);
                show(elements.pointP);
                show(elements.labelP);
                // 步骤 6 才激活拖拽
                if (STATE.currentStep < 6) {
                    elements.pointP.style.cursor = 'default';
                    elements.pointP.style.fill = '#000000';
                }
            } else {
                hide(elements.lineAp);
                hide(elements.pointP);
                hide(elements.labelP);
            }
            
            // 步骤 4: 添加 D、M、FM、PF
            if (STATE.currentStep >= 4) {
                show(elements.pointD);
                show(elements.labelD);
                show(elements.pointM);
                show(elements.labelM);
                show(elements.lineFm);
                show(elements.linePf);
                updatePElements();
            } else {
                hide(elements.pointD);
                hide(elements.labelD);
                hide(elements.pointM);
                hide(elements.labelM);
                hide(elements.lineFm);
                hide(elements.linePf);
            }
            
            // 步骤 5: 显示角度弧线和验证标记
            if (STATE.currentStep >= 5) {
                show(elements.arcAngle1);
                show(elements.arcAngle2);
                show(elements.labelAngle1);
                show(elements.labelAngle2);
                show(elements.checkmark);
                updatePElements();
            } else {
                hide(elements.arcAngle1);
                hide(elements.arcAngle2);
                hide(elements.labelAngle1);
                hide(elements.labelAngle2);
                hide(elements.checkmark);
            }
            
            // 步骤 6: 激活 P 点拖拽
            if (STATE.currentStep >= 6) {
                elements.pointP.style.cursor = 'move';
                elements.pointP.style.fill = '#1565c0';
            }
        }
        
        // 按钮事件
        elements.btnPrev.addEventListener('click', function() {
            if (STATE.currentStep > 0) {
                STATE.currentStep--;
                updateStepDisplay();
            }
        });
        
        elements.btnNext.addEventListener('click', function() {
            if (STATE.currentStep < STATE.totalSteps) {
                STATE.currentStep++;
                updateStepDisplay();
            }
        });
        
        // P 点拖拽交互
        let dragOffsetX = 0, dragOffsetY = 0;
        
        elements.pointP.addEventListener('mousedown', function(e) {
            if (STATE.currentStep < 6) return;
            STATE.isDragging = true;
            e.preventDefault();
        });
        
        document.addEventListener('mousemove', function(e) {
            if (!STATE.isDragging || STATE.currentStep < 6) return;
            
            const svg = document.getElementById('scene1-svg');
            const rect = svg.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            // 将鼠标位置转换为椭圆参数角度
            const relX = mouseX - ELLIPSE.cx;
            const relY = ELLIPSE.cy - mouseY; // Y 轴翻转
            
            // 计算角度
            let angle = Math.atan2(relY / ELLIPSE.ry, relX / ELLIPSE.rx);
            if (angle < 0) angle += 2 * Math.PI;
            
            // 限制 P 点不在 A、B 点（避免除零）
            if (angle < 0.1) angle = 0.1;
            if (angle > Math.PI - 0.1) angle = Math.PI - 0.1;
            
            STATE.pAngle = angle;
            updatePElements();
        });
        
        document.addEventListener('mouseup', function() {
            STATE.isDragging = false;
        });
        
        // 触摸支持
        elements.pointP.addEventListener('touchstart', function(e) {
            if (STATE.currentStep < 6) return;
            STATE.isDragging = true;
            e.preventDefault();
        });
        
        document.addEventListener('touchmove', function(e) {
            if (!STATE.isDragging || STATE.currentStep < 6) return;
            
            const touch = e.touches[0];
            const svg = document.getElementById('scene1-svg');
            const rect = svg.getBoundingClientRect();
            const mouseX = touch.clientX - rect.left;
            const mouseY = touch.clientY - rect.top;
            
            const relX = mouseX - ELLIPSE.cx;
            const relY = ELLIPSE.cy - mouseY;
            
            let angle = Math.atan2(relY / ELLIPSE.ry, relX / ELLIPSE.rx);
            if (angle < 0) angle += 2 * Math.PI;
            
            if (angle < 0.1) angle = 0.1;
            if (angle > Math.PI - 0.1) angle = Math.PI - 0.1;
            
            STATE.pAngle = angle;
            updatePElements();
        });
        
        document.addEventListener('touchend', function() {
            STATE.isDragging = false;
        });
        
        // 初始化
        updateStepDisplay();
    })();
    </script>
</body>
</html>
