<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>结论④分析：PM=BM?</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #scene3-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene3-svg {
            width: 800px;
            height: 500px;
        }
        .scene3-label {
            font-size: 14px;
            font-weight: 500;
        }
        .scene3-title {
            font-size: 18px;
            font-weight: bold;
            fill: #333;
        }
        .scene3-axis {
            stroke: #000;
            stroke-width: 1.5;
        }
        .scene3-ellipse {
            fill: none;
            stroke: #000;
            stroke-width: 2;
        }
        .scene3-tangent {
            stroke: #000;
            stroke-width: 1.5;
            stroke-dasharray: 4,4;
        }
        .scene3-auxiliary {
            stroke: #888;
            stroke-width: 1.5;
            stroke-dasharray: 4,4;
        }
        .scene3-pm {
            stroke: #1565c0;
            stroke-width: 2.5;
        }
        .scene3-bm {
            stroke: #2e7d32;
            stroke-width: 2.5;
        }
        .scene3-curve {
            fill: none;
            stroke: #c62828;
            stroke-width: 2;
        }
        .scene3-curve-axis {
            stroke: #555;
            stroke-width: 1;
        }
        .scene3-zero-line {
            stroke: #999;
            stroke-width: 1;
            stroke-dasharray: 3,3;
        }
        .scene3-point {
            fill: #000;
        }
        .scene3-point-p {
            fill: #1565c0;
        }
        .scene3-point-m {
            fill: #2e7d32;
        }
        .scene3-current-marker {
            fill: #c62828;
        }
        #scene3-controls {
            position: absolute;
            bottom: 15px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            z-index: 10;
        }
        #scene3-slider {
            width: 300px;
            cursor: pointer;
        }
        #scene3-value-display {
            font-size: 13px;
            color: #333;
            min-width: 200px;
        }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg id="scene3-svg" width="800" height="500">
            <!-- 标题 -->
            <text id="scene3-title" x="400" y="35" text-anchor="middle" class="scene3-title">结论④分析：PM = BM ?</text>
            
            <!-- 坐标轴 -->
            <line id="scene3-x-axis" x1="60" y1="250" x2="500" y2="250" class="scene3-axis"/>
            <line id="scene3-y-axis" x1="280" y1="100" x2="280" y2="400" class="scene3-axis"/>
            <text x="490" y="270" class="scene3-label">X</text>
            <text x="265" y="115" class="scene3-label">Y</text>
            
            <!-- 椭圆 -->
            <ellipse id="scene3-ellipse" cx="280" cy="250" rx="200" ry="120" class="scene3-ellipse"/>
            
            <!-- 切线 l -->
            <line id="scene3-tangent" x1="480" y1="100" x2="480" y2="400" class="scene3-tangent"/>
            <text x="490" y="390" class="scene3-label">l</text>
            
            <!-- 固定点 -->
            <circle id="scene3-point-a" cx="80" cy="250" r="4" class="scene3-point"/>
            <text id="scene3-label-a" x="70" y="270" class="scene3-label">A</text>
            
            <circle id="scene3-point-b" cx="480" cy="250" r="4" class="scene3-point"/>
            <text id="scene3-label-b" x="490" y="270" class="scene3-label">B</text>
            
            <circle id="scene3-point-o" cx="280" cy="250" r="3" class="scene3-point"/>
            <text id="scene3-label-o" x="265" y="270" class="scene3-label">O</text>
            
            <circle id="scene3-point-f" cx="380" cy="250" r="4" class="scene3-point"/>
            <text id="scene3-label-f" x="380" y="270" class="scene3-label">F</text>
            
            <!-- 动态点 P -->
            <circle id="scene3-point-p" cx="280" cy="130" r="5" class="scene3-point-p"/>
            <text id="scene3-label-p" x="290" y="120" class="scene3-label">P</text>
            
            <!-- 动态点 D (AP 与切线交点) -->
            <circle id="scene3-point-d" cx="480" cy="250" r="4" class="scene3-point"/>
            <text id="scene3-label-d" x="490" y="250" class="scene3-label">D</text>
            
            <!-- 动态点 M (BD 中点) -->
            <circle id="scene3-point-m" cx="480" cy="250" r="4" class="scene3-point-m"/>
            <text id="scene3-label-m" x="490" y="270" class="scene3-label">M</text>
            
            <!-- 辅助线 AP -->
            <line id="scene3-line-ap" x1="80" y1="250" x2="280" y2="130" class="scene3-auxiliary"/>
            
            <!-- 辅助线 PF -->
            <line id="scene3-line-pf" x1="280" y1="130" x2="380" y2="250" class="scene3-auxiliary"/>
            
            <!-- 线段 PM (蓝色) -->
            <line id="scene3-segment-pm" x1="280" y1="130" x2="480" y2="250" class="scene3-pm"/>
            <text id="scene3-label-pm" x="380" y="175" class="scene3-label" fill="#1565c0">|PM|</text>
            
            <!-- 线段 BM (绿色) -->
            <line id="scene3-segment-bm" x1="480" y1="250" x2="480" y2="250" class="scene3-bm"/>
            <text id="scene3-label-bm" x="500" y="250" class="scene3-label" fill="#2e7d32">|BM|</text>
            
            <!-- 长度差曲线图 -->
            <g id="scene3-curve-group" transform="translate(560, 120)">
                <!-- 曲线图边框 -->
                <rect x="0" y="0" width="200" height="100" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
                
                <!-- 坐标轴 -->
                <line x1="20" y1="80" x2="180" y2="80" class="scene3-curve-axis"/>
                <line x1="20" y1="80" x2="20" y2="10" class="scene3-curve-axis"/>
                
                <!-- 零点参考线 -->
                <line x1="20" y1="80" x2="180" y2="80" class="scene3-zero-line"/>
                
                <!-- 轴标签 -->
                <text x="175" y="95" font-size="11" fill="#555">θ</text>
                <text x="5" y="15" font-size="10" fill="#555">|PM-BM|</text>
                
                <!-- 标题 -->
                <text x="100" y="25" text-anchor="middle" font-size="11" fill="#333">长度差曲线</text>
                
                <!-- 长度差曲线 (预绘制) -->
                <path id="scene3-diff-curve" d="" class="scene3-curve"/>
                
                <!-- 当前点标记 -->
                <circle id="scene3-curve-marker" cx="20" cy="80" r="4" class="scene3-current-marker"/>
            </g>
            
            <!-- θ 标签 -->
            <text id="scene3-theta-label" x="260" y="200" class="scene3-label" fill="#666">θ</text>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene3-controls">
            <span style="font-size: 13px; color: #555;">θ:</span>
            <input type="range" id="scene3-slider" min="10" max="170" value="90"/>
            <span id="scene3-value-display">θ=90° |PM|=0.00 |BM|=0.00</span>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 3: 结论④分析 - PM=BM 的可能性
        
        // 椭圆参数
        const CX = 280, CY = 250;  // 椭圆中心
        const RX = 200, RY = 120;  // 椭圆半轴
        const AX = 80, AY = 250;   // A 点 (左顶点)
        const BX = 480, BY = 250;  // B 点 (右顶点)
        const FX = 380, FY = 250;  // F 点 (右焦点)
        const TANGENT_X = 480;     // 切线 x 坐标
        
        // DOM 元素
        const slider = document.getElementById('scene3-slider');
        const valueDisplay = document.getElementById('scene3-value-display');
        
        // 动态元素
        const pointP = document.getElementById('scene3-point-p');
        const labelP = document.getElementById('scene3-label-p');
        const pointD = document.getElementById('scene3-point-d');
        const labelD = document.getElementById('scene3-label-d');
        const pointM = document.getElementById('scene3-point-m');
        const labelM = document.getElementById('scene3-label-m');
        const lineAP = document.getElementById('scene3-line-ap');
        const linePF = document.getElementById('scene3-line-pf');
        const segmentPM = document.getElementById('scene3-segment-pm');
        const labelPM = document.getElementById('scene3-label-pm');
        const segmentBM = document.getElementById('scene3-segment-bm');
        const labelBM = document.getElementById('scene3-label-bm');
        const diffCurve = document.getElementById('scene3-diff-curve');
        const curveMarker = document.getElementById('scene3-curve-marker');
        
        // 预计算的长度差曲线数据
        let curveData = [];
        
        // 计算 P 点坐标 (参数方程)
        function getP(theta) {
            return {
                x: CX + RX * Math.cos(theta),
                y: CY - RY * Math.sin(theta)
            };
        }
        
        // 计算 D 点 (AP 与切线 x=TANGENT_X 的交点)
        function getD(P) {
            // 直线 AP: 通过 A(AX, AY) 和 P(Px, Py)
            // 参数方程: x = AX + t*(Px-AX), y = AY + t*(Py-AY)
            // 当 x = TANGENT_X 时: t = (TANGENT_X - AX) / (Px - AX)
            const dx = P.x - AX;
            const dy = P.y - AY;
            if (Math.abs(dx) < 0.001) {
                // P 接近 A 点，返回 B 点
                return { x: TANGENT_X, y: BY };
            }
            const t = (TANGENT_X - AX) / dx;
            return {
                x: TANGENT_X,
                y: AY + t * dy
            };
        }
        
        // 计算 M 点 (BD 中点)
        function getM(D) {
            return {
                x: (BX + D.x) / 2,
                y: (BY + D.y) / 2
            };
        }
        
        // 计算两点距离
        function dist(p1, p2) {
            return Math.sqrt((p1.x - p2.x)**2 + (p1.y - p2.y)**2);
        }
        
        // 更新场景
        function update(thetaDeg) {
            const theta = thetaDeg * Math.PI / 180;
            
            // 计算各点
            const P = getP(theta);
            const D = getD(P);
            const M = getM(D);
            
            // 计算长度
            const lenPM = dist(P, M);
            const lenBM = dist({x: BX, y: BY}, M);
            const diff = Math.abs(lenPM - lenBM);
            
            // 更新 P 点
            pointP.setAttribute('cx', P.x);
            pointP.setAttribute('cy', P.y);
            labelP.setAttribute('x', P.x + 10);
            labelP.setAttribute('y', P.y - 10);
            
            // 更新 D 点
            pointD.setAttribute('cx', D.x);
            pointD.setAttribute('cy', D.y);
            labelD.setAttribute('x', D.x + 10);
            labelD.setAttribute('y', D.y);
            
            // 更新 M 点
            pointM.setAttribute('cx', M.x);
            pointM.setAttribute('cy', M.y);
            labelM.setAttribute('x', M.x + 10);
            labelM.setAttribute('y', M.y + 15);
            
            // 更新线段 AP
            lineAP.setAttribute('x1', AX);
            lineAP.setAttribute('y1', AY);
            lineAP.setAttribute('x2', P.x);
            lineAP.setAttribute('y2', P.y);
            
            // 更新线段 PF
            linePF.setAttribute('x1', P.x);
            linePF.setAttribute('y1', P.y);
            linePF.setAttribute('x2', FX);
            linePF.setAttribute('y2', FY);
            
            // 更新线段 PM
            segmentPM.setAttribute('x1', P.x);
            segmentPM.setAttribute('y1', P.y);
            segmentPM.setAttribute('x2', M.x);
            segmentPM.setAttribute('y2', M.y);
            
            // 更新 PM 标签位置 (中点上方)
            const midPM = { x: (P.x + M.x) / 2, y: (P.y + M.y) / 2 };
            labelPM.setAttribute('x', midPM.x);
            labelPM.setAttribute('y', midPM.y - 15);
            labelPM.textContent = '|PM|=' + lenPM.toFixed(2);
            
            // 更新线段 BM
            segmentBM.setAttribute('x1', BX);
            segmentBM.setAttribute('y1', BY);
            segmentBM.setAttribute('x2', M.x);
            segmentBM.setAttribute('y2', M.y);
            
            // 更新 BM 标签位置 (中点右侧)
            const midBM = { x: (BX + M.x) / 2, y: (BY + M.y) / 2 };
            labelBM.setAttribute('x', midBM.x + 15);
            labelBM.setAttribute('y', midBM.y);
            labelBM.textContent = '|BM|=' + lenBM.toFixed(2);
            
            // 更新数值显示
            valueDisplay.textContent = `θ=${thetaDeg}° |PM|=${lenPM.toFixed(2)} |BM|=${lenBM.toFixed(2)}`;
            
            // 更新曲线图标记点
            // θ范围 10°~170°, 映射到 x: 20~180
            const curveX = 20 + (thetaDeg - 10) / 160 * 160;
            // diff 映射到 y: 80 - diff*scale (scale 需要调整)
            const maxDiff = 150; // 预估最大差值
            const curveY = 80 - (diff / maxDiff) * 60;
            curveMarker.setAttribute('cx', curveX);
            curveMarker.setAttribute('cy', curveY);
        }
        
        // 预计算长度差曲线
        function precomputeCurve() {
            curveData = [];
            let pathD = '';
            
            for (let deg = 10; deg <= 170; deg += 1) {
                const theta = deg * Math.PI / 180;
                const P = getP(theta);
                const D = getD(P);
                const M = getM(D);
                const lenPM = dist(P, M);
                const lenBM = dist({x: BX, y: BY}, M);
                const diff = Math.abs(lenPM - lenBM);
                
                const x = 20 + (deg - 10) / 160 * 160;
                const maxDiff = 150;
                const y = 80 - (diff / maxDiff) * 60;
                
                curveData.push({ deg, diff, x, y });
                
                if (deg === 10) {
                    pathD = `M ${x} ${y}`;
                } else {
                    pathD += ` L ${x} ${y}`;
                }
            }
            
            diffCurve.setAttribute('d', pathD);
        }
        
        // 事件监听
        slider.addEventListener('input', function() {
            update(parseInt(this.value));
        });
        
        // 初始化
        precomputeCurve();
        update(90); // 初始状态：P 在上顶点
        
    })();
    </script>
</body>
</html>
