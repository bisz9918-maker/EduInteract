<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圆的切线性质与垂线段长度推导</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }
        #scene1-controls button {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #333;
            border-radius: 4px;
            background: #f0f0f0;
        }
        #scene1-controls button:hover {
            background: #e0e0e0;
        }
        #scene1-controls button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #scene1-step-indicator {
            font-size: 14px;
            color: #333;
            min-width: 80px;
            text-align: center;
        }
        /* 元素显隐控制 */
        .scene1-hidden {
            opacity: 0;
            display: none;
        }
        .scene1-visible {
            opacity: 1;
            display: block;
        }
        /* 过渡动画 */
        .scene1-fade {
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 圆 O -->
            <circle id="scene1-circle-o" cx="250" cy="280" r="80" fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 直径 AB -->
            <line id="scene1-line-ab" x1="170" y1="280" x2="330" y2="280" stroke="#000000" stroke-width="2"/>
            
            <!-- 延长线 BP -->
            <line id="scene1-line-bp" x1="330" y1="280" x2="410" y2="280" stroke="#000000" stroke-width="2"/>
            
            <!-- 切线 PC -->
            <line id="scene1-line-pc" x1="410" y1="280" x2="290" y2="211" stroke="#000000" stroke-width="2"/>
            
            <!-- 辅助线 OC (步骤 2 显示) -->
            <line id="scene1-line-oc" x1="250" y1="280" x2="290" y2="211" stroke="#1565c0" stroke-width="2" class="scene1-hidden"/>
            
            <!-- 垂线 CD (步骤 3 显示) -->
            <line id="scene1-line-cd" x1="290" y1="211" x2="290" y2="280" stroke="#c62828" stroke-width="2" class="scene1-hidden"/>
            
            <!-- △OCP 填充 (步骤 3 高亮) -->
            <polygon id="scene1-polygon-ocp" points="250,280 290,211 410,280" fill="#2e7d32" fill-opacity="0.2" class="scene1-hidden"/>
            
            <!-- 点 O -->
            <circle id="scene1-point-o" cx="250" cy="280" r="3" fill="#000000"/>
            
            <!-- 点 D (步骤 3 显示) -->
            <circle id="scene1-point-d" cx="290" cy="280" r="3" fill="#000000" class="scene1-hidden"/>
            
            <!-- 直角标记 ∠OCP (步骤 2 显示) -->
            <path id="scene1-rightangle-ocp" d="M 290 223 L 290 211 L 278 211" fill="none" stroke="#000000" stroke-width="1.5" class="scene1-hidden"/>
            
            <!-- 直角标记 ∠CDO (步骤 3 显示) -->
            <path id="scene1-rightangle-cdo" d="M 290 268 L 290 280 L 302 280" fill="none" stroke="#000000" stroke-width="1.5" class="scene1-hidden"/>
            
            <!-- 点标签 -->
            <text id="scene1-label-o" x="250" y="300" text-anchor="middle" font-size="16" fill="#000000">O</text>
            <text id="scene1-label-a" x="160" y="295" text-anchor="middle" font-size="16" fill="#000000">A</text>
            <text id="scene1-label-b" x="335" y="295" text-anchor="middle" font-size="16" fill="#000000">B</text>
            <text id="scene1-label-p" x="415" y="295" text-anchor="middle" font-size="16" fill="#000000">P</text>
            <text id="scene1-label-c" x="295" y="200" text-anchor="middle" font-size="16" fill="#000000">C</text>
            <text id="scene1-label-d" x="290" y="295" text-anchor="middle" font-size="16" fill="#000000" class="scene1-hidden">D</text>
            
            <!-- 长度标注 (步骤 1 显示) -->
            <text id="scene1-label-bo" x="290" y="315" text-anchor="middle" font-size="14" fill="#000000" class="scene1-hidden">BO=2</text>
            <text id="scene1-label-pb" x="370" y="315" text-anchor="middle" font-size="14" fill="#000000" class="scene1-hidden">PB=2</text>
            
            <!-- OC=2 标签 (步骤 2 显示) -->
            <text id="scene1-label-oc" x="280" y="235" text-anchor="middle" font-size="14" fill="#1565c0" class="scene1-hidden">OC=2</text>
            
            <!-- CD=√3 标签 (步骤 4 显示) -->
            <text id="scene1-label-cd" x="305" y="250" text-anchor="middle" font-size="14" fill="#c62828" class="scene1-hidden">CD=√3</text>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
            <span id="scene1-step-indicator">步骤 0/4</span>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1: 圆的切线性质与垂线段长度推导
        // 布局坐标表（实现对照依据）：
        // 圆心 O(250, 280), 半径 r=80
        // A(170,280), B(330,280), P(410,280)
        // C(290,211), D(290,280)
        
        let currentStep = 0;
        const totalSteps = 4;
        
        // 每步显示的元素 ID 列表
        const stepElements = {
            0: [],  // 初始状态：基础图形已显示
            1: ['scene1-label-bo', 'scene1-label-pb'],
            2: ['scene1-line-oc', 'scene1-label-oc', 'scene1-rightangle-ocp'],
            3: ['scene1-line-cd', 'scene1-point-d', 'scene1-rightangle-cdo', 'scene1-polygon-ocp', 'scene1-label-d'],
            4: ['scene1-label-cd']
        };
        
        // 显示元素
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene1-hidden');
                el.classList.add('scene1-visible', 'scene1-fade');
            }
        }
        
        // 隐藏元素
        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene1-visible', 'scene1-fade');
                el.classList.add('scene1-hidden');
            }
        }
        
        // 更新场景显示状态
        function updateScene() {
            // 根据当前步骤显示/隐藏元素
            for (let step = 1; step <= totalSteps; step++) {
                const elements = stepElements[step];
                elements.forEach(id => {
                    if (step <= currentStep) {
                        showElement(id);
                    } else {
                        hideElement(id);
                    }
                });
            }
            
            // 更新按钮状态
            const prevBtn = document.getElementById('scene1-btn-prev');
            const nextBtn = document.getElementById('scene1-btn-next');
            const indicator = document.getElementById('scene1-step-indicator');
            
            prevBtn.disabled = (currentStep === 0);
            nextBtn.disabled = (currentStep === totalSteps);
            indicator.textContent = `步骤 ${currentStep}/${totalSteps}`;
        }
        
        // 事件绑定
        document.getElementById('scene1-btn-prev').addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });
        
        document.getElementById('scene1-btn-next').addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateScene();
            }
        });
        
        // 初始化
        updateScene();
    })();
    </script>
</body>
</html>
