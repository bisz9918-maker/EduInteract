<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>直三棱柱 ABC-A₁B₁C₁ 结构展示</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }
        #scene1-controls button {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #333;
            border-radius: 4px;
            background: #f5f5f5;
        }
        #scene1-controls button:hover {
            background: #e0e0e0;
        }
        #scene1-controls button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #scene1-step-indicator {
            font-size: 14px;
            color: #333;
            min-width: 80px;
            text-align: center;
        }
        /* 元素显隐控制 */
        .scene1-hidden {
            opacity: 0;
            display: none;
        }
        .scene1-visible {
            opacity: 1;
            display: block;
        }
        /* 高亮样式 */
        .scene1-highlight {
            stroke: #c62828 !important;
            stroke-width: 3px !important;
            fill: rgba(198, 40, 40, 0.15) !important;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 上底面△A₁B₁C₁（高亮用，初始隐藏） -->
            <polygon id="scene1-top-face-highlight" 
                     points="580,220 420,160 220,140" 
                     class="scene1-hidden"
                     stroke="#c62828" 
                     stroke-width="3" 
                     fill="rgba(198, 40, 40, 0.15)"/>

            <!-- 不可见棱 AC（虚线） -->
            <line id="scene1-edge-AC" 
                  x1="580" y1="400" x2="220" y2="320" 
                  stroke="#888888" 
                  stroke-width="2" 
                  stroke-dasharray="5,5"/>

            <!-- 可见棱 -->
            <!-- 上底面三边 -->
            <line id="scene1-edge-A1B1" x1="580" y1="220" x2="420" y2="160" stroke="#000000" stroke-width="2"/>
            <line id="scene1-edge-B1C1" x1="420" y1="160" x2="220" y2="140" stroke="#000000" stroke-width="2"/>
            <line id="scene1-edge-A1C1" x1="580" y1="220" x2="220" y2="140" stroke="#000000" stroke-width="2"/>

            <!-- 下底面两边（可见） -->
            <line id="scene1-edge-AB" x1="580" y1="400" x2="420" y2="340" stroke="#000000" stroke-width="2"/>
            <line id="scene1-edge-BC" x1="420" y1="340" x2="220" y2="320" stroke="#000000" stroke-width="2"/>

            <!-- 侧棱（可见） -->
            <line id="scene1-edge-AA1" x1="580" y1="400" x2="580" y2="220" stroke="#000000" stroke-width="2"/>
            <line id="scene1-edge-BB1" x1="420" y1="340" x2="420" y2="160" stroke="#000000" stroke-width="2"/>
            <line id="scene1-edge-CC1" x1="220" y1="320" x2="220" y2="140" stroke="#000000" stroke-width="2"/>

            <!-- 对角线 A₁B（辅助线） -->
            <line id="scene1-diagonal-A1B" 
                  x1="580" y1="220" x2="420" y2="340" 
                  stroke="#000000" 
                  stroke-width="1.5"/>

            <!-- 顶点标签 -->
            <text id="scene1-label-A1" x="600" y="215" font-size="14" fill="#000000">A₁</text>
            <text id="scene1-label-B1" x="435" y="155" font-size="14" fill="#000000">B₁</text>
            <text id="scene1-label-C1" x="205" y="135" font-size="14" fill="#000000">C₁</text>
            <text id="scene1-label-A" x="600" y="405" font-size="14" fill="#000000">A</text>
            <text id="scene1-label-B" x="435" y="345" font-size="14" fill="#000000">B</text>
            <text id="scene1-label-C" x="205" y="325" font-size="14" fill="#000000">C</text>

            <!-- 棱长标注（步骤1显示） -->
            <text id="scene1-annotation-AA1" x="595" y="310" font-size="14" fill="#1565c0" class="scene1-hidden">AA₁=8</text>
            <text id="scene1-annotation-A1B1" x="500" y="175" font-size="14" fill="#1565c0" class="scene1-hidden">A₁B₁=6</text>
            <text id="scene1-annotation-A1C1" x="400" y="165" font-size="14" fill="#1565c0" class="scene1-hidden">A₁C₁=2√34</text>

            <!-- 直角符号∠A₁B₁C₁（步骤2显示） -->
            <g id="scene1-right-angle-B1" class="scene1-hidden">
                <path d="M 420,172 L 420,160 L 408,160" stroke="#1565c0" stroke-width="1.5" fill="none"/>
            </g>

            <!-- B₁C₁=10 标注（步骤3显示） -->
            <text id="scene1-annotation-B1C1" x="310" y="135" font-size="14" fill="#1565c0" class="scene1-hidden">B₁C₁=10</text>

            <!-- 垂直符号 AA₁⊥底面（步骤4显示） -->
            <g id="scene1-perpendicular-A1" class="scene1-hidden">
                <path d="M 580,220 L 580,208 L 568,208" stroke="#1565c0" stroke-width="1.5" fill="none"/>
                <circle cx="574" cy="214" r="2" fill="#1565c0"/>
            </g>
        </svg>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/5</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1: 直三棱柱 ABC-A₁B₁C₁ 结构展示
        // 布局坐标表（实现对照依据）：
        // | 元素 | 类型 | 位置/范围 | 备注 |
        // |------|------|-----------|------|
        // | A₁ | 顶点 | (580,220) | 上底面右顶点 |
        // | B₁ | 顶点 | (420,160) | 上底面中顶点 |
        // | C₁ | 顶点 | (220,140) | 上底面左顶点 |
        // | A | 顶点 | (580,400) | 下底面右顶点 |
        // | B | 顶点 | (420,340) | 下底面中顶点 |
        // | C | 顶点 | (220,320) | 下底面左顶点 |
        // | AA₁=8 标注 | text | (595,310) | 右侧 |
        // | A₁B₁=6 标注 | text | (500,175) | 上方 |
        // | A₁C₁=2√34 标注 | text | (400,165) | 上方 |
        // | B₁C₁=10 标注 | text | (310,135) | 上方 |

        let currentStep = 0;
        const totalSteps = 5;

        // 每步应显示的元素ID列表
        const stepElements = {
            0: [], // 初始状态：只显示基础线框和顶点标签
            1: ['scene1-annotation-AA1', 'scene1-annotation-A1B1', 'scene1-annotation-A1C1'],
            2: ['scene1-top-face-highlight', 'scene1-right-angle-B1'],
            3: ['scene1-annotation-B1C1'],
            4: ['scene1-perpendicular-A1']
        };

        // 已显示的元素集合
        const shownElements = new Set();

        // 工具函数：显示元素
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene1-hidden');
                el.classList.add('scene1-visible');
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }

        // 工具函数：隐藏元素
        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene1-visible');
                el.classList.add('scene1-hidden');
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }

        // 更新显示状态
        function updateDisplay() {
            // 根据当前步骤，显示所有应显示的元素
            for (let step = 0; step <= currentStep; step++) {
                const elements = stepElements[step] || [];
                elements.forEach(id => showElement(id));
            }

            // 更新步骤指示器
            document.getElementById('scene1-step-indicator').textContent = `步骤 ${currentStep + 1}/${totalSteps}`;

            // 更新按钮状态
            document.getElementById('scene1-btn-prev').disabled = currentStep === 0;
            document.getElementById('scene1-btn-next').disabled = currentStep === totalSteps - 1;
        }

        // 上一步
        function prevStep() {
            if (currentStep > 0) {
                // 隐藏当前步骤的元素
                const elements = stepElements[currentStep] || [];
                elements.forEach(id => hideElement(id));
                currentStep--;
                updateDisplay();
            }
        }

        // 下一步
        function nextStep() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                // 显示新步骤的元素
                const elements = stepElements[currentStep] || [];
                elements.forEach(id => showElement(id));
                updateDisplay();
            }
        }

        // 绑定事件
        document.getElementById('scene1-btn-prev').addEventListener('click', prevStep);
        document.getElementById('scene1-btn-next').addEventListener('click', nextStep);

        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
