<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三视图还原四棱锥</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: "Microsoft YaHei", sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }
        #scene1-controls button {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #333;
            border-radius: 4px;
            background: #f5f5f5;
        }
        #scene1-controls button:hover {
            background: #e0e0e0;
        }
        #scene1-controls button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #scene1-step-indicator {
            font-size: 14px;
            color: #333;
            min-width: 80px;
            text-align: center;
        }
        .scene1-element {
            transition: opacity 0.3s ease;
        }
        .scene1-hidden {
            opacity: 0;
            display: none;
        }
        .scene1-highlight {
            stroke: #2e7d32 !important;
            stroke-width: 3 !important;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 三视图区域 (左侧) -->
            <g id="scene1-orthographic-views">
                <!-- 主视图：等腰三角形，底6高4 -->
                <g id="scene1-main-view" class="scene1-element">
                    <polygon points="60,80 180,80 120,40" fill="none" stroke="#000000" stroke-width="2"/>
                    <text x="120" y="130" text-anchor="middle" font-size="14" fill="#000000">主视图</text>
                    <!-- 底边标注 -->
                    <line x1="60" y1="95" x2="180" y2="95" stroke="#000000" stroke-width="1"/>
                    <line x1="60" y1="90" x2="60" y2="100" stroke="#000000" stroke-width="1"/>
                    <line x1="180" y1="90" x2="180" y2="100" stroke="#000000" stroke-width="1"/>
                    <text x="120" y="90" text-anchor="middle" font-size="12" fill="#000000">6</text>
                    <!-- 高标注 -->
                    <line x1="190" y1="40" x2="190" y2="80" stroke="#000000" stroke-width="1"/>
                    <line x1="185" y1="40" x2="195" y2="40" stroke="#000000" stroke-width="1"/>
                    <line x1="185" y1="80" x2="195" y2="80" stroke="#000000" stroke-width="1"/>
                    <text x="200" y="65" font-size="12" fill="#000000">4</text>
                </g>

                <!-- 俯视图：矩形，长6宽2 -->
                <g id="scene1-top-view" class="scene1-element">
                    <rect x="60" y="180" width="120" height="40" fill="none" stroke="#000000" stroke-width="2"/>
                    <!-- 顶点投影线 -->
                    <line x1="60" y1="200" x2="180" y2="200" stroke="#000000" stroke-width="1"/>
                    <text x="120" y="235" text-anchor="middle" font-size="14" fill="#000000">俯视图</text>
                    <!-- 长标注 -->
                    <line x1="60" y1="230" x2="180" y2="230" stroke="#000000" stroke-width="1"/>
                    <line x1="60" y1="225" x2="60" y2="235" stroke="#000000" stroke-width="1"/>
                    <line x1="180" y1="225" x2="180" y2="235" stroke="#000000" stroke-width="1"/>
                    <text x="120" y="248" text-anchor="middle" font-size="12" fill="#000000">6</text>
                    <!-- 宽标注 -->
                    <line x1="190" y1="180" x2="190" y2="220" stroke="#000000" stroke-width="1"/>
                    <line x1="185" y1="180" x2="195" y2="180" stroke="#000000" stroke-width="1"/>
                    <line x1="185" y1="220" x2="195" y2="220" stroke="#000000" stroke-width="1"/>
                    <text x="205" y="205" font-size="12" fill="#000000">2</text>
                </g>

                <!-- 侧视图：直角三角形，底2高4 -->
                <g id="scene1-side-view" class="scene1-element">
                    <polygon points="280,40 280,80 320,80" fill="none" stroke="#000000" stroke-width="2"/>
                    <text x="300" y="130" text-anchor="middle" font-size="14" fill="#000000">侧视图</text>
                    <!-- 底边标注 -->
                    <line x1="280" y1="95" x2="320" y2="95" stroke="#000000" stroke-width="1"/>
                    <line x1="280" y1="90" x2="280" y2="100" stroke="#000000" stroke-width="1"/>
                    <line x1="320" y1="90" x2="320" y2="100" stroke="#000000" stroke-width="1"/>
                    <text x="300" y="90" text-anchor="middle" font-size="12" fill="#000000">2</text>
                    <!-- 高标注 -->
                    <line x1="330" y1="40" x2="330" y2="80" stroke="#000000" stroke-width="1"/>
                    <line x1="325" y1="40" x2="335" y2="40" stroke="#000000" stroke-width="1"/>
                    <line x1="325" y1="80" x2="335" y2="80" stroke="#000000" stroke-width="1"/>
                    <text x="345" y="65" font-size="12" fill="#000000">4</text>
                </g>

                <!-- 对应关系虚线 -->
                <g id="scene1-alignment-lines" class="scene1-element">
                    <!-- 长对正虚线 -->
                    <line id="scene1-align-1" x1="60" y1="80" x2="60" y2="180" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
                    <line id="scene1-align-2" x1="180" y1="80" x2="180" y2="180" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
                    <!-- 宽相等虚线 -->
                    <line id="scene1-align-3" x1="320" y1="80" x2="320" y2="180" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
                    <line id="scene1-align-4" x1="280" y1="80" x2="180" y2="80" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
                </g>
            </g>

            <!-- 四棱锥立体图区域 (右侧) -->
            <g id="scene1-pyramid" class="scene1-element">
                <!-- 底面矩形 (透视效果) -->
                <polygon id="scene1-pyramid-base" points="500,380 680,380 700,350 520,350" fill="none" stroke="#1565c0" stroke-width="2"/>
                
                <!-- 顶点 P -->
                <circle id="scene1-vertex-p" cx="600" cy="290" r="4" fill="#1565c0"/>
                <text id="scene1-vertex-label" x="600" y="275" text-anchor="middle" font-size="14" fill="#1565c0">P</text>
                
                <!-- 高线 -->
                <line id="scene1-height-line" x1="600" y1="290" x2="600" y2="365" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
                <text id="scene1-height-label" x="615" y="330" font-size="12" fill="#1565c0">h=4</text>
                
                <!-- 棱线 -->
                <line id="scene1-edge-pa" x1="600" y1="290" x2="500" y2="380" stroke="#1565c0" stroke-width="2"/>
                <line id="scene1-edge-pb" x1="600" y1="290" x2="680" y2="380" stroke="#1565c0" stroke-width="2"/>
                <line id="scene1-edge-pc" x1="600" y1="290" x2="700" y2="350" stroke="#1565c0" stroke-width="2"/>
                <line id="scene1-edge-pd" x1="600" y1="290" x2="520" y2="350" stroke="#1565c0" stroke-width="2"/>
                
                <!-- 底面顶点标签 -->
                <text id="scene1-vertex-a" x="490" y="395" font-size="12" fill="#1565c0">A</text>
                <text id="scene1-vertex-b" x="690" y="395" font-size="12" fill="#1565c0">B</text>
                <text id="scene1-vertex-c" x="715" y="355" font-size="12" fill="#1565c0">C</text>
                <text id="scene1-vertex-d" x="510" y="355" font-size="12" fill="#1565c0">D</text>
            </g>

            <!-- 对应关系连线 (三视图到立体图) -->
            <g id="scene1-connection-lines" class="scene1-element">
                <line x1="180" y1="80" x2="500" y2="380" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
                <line x1="320" y1="80" x2="700" y2="350" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
            </g>

            <!-- 控件栏 -->
            <g id="scene1-controls-svg">
                <rect x="300" y="450" width="200" height="40" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="5"/>
            </g>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-prev-btn">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/6</span>
            <button id="scene1-next-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1: 三视图还原四棱锥
        const state = {
            currentStep: 0,
            totalSteps: 6
        };

        // 每步显示的元素配置
        const steps = [
            // 步骤 0: 初始状态 - 仅显示三视图
            {
                visible: ['scene1-main-view', 'scene1-top-view', 'scene1-side-view'],
                highlight: []
            },
            // 步骤 1: 高亮长对正关系
            {
                visible: ['scene1-main-view', 'scene1-top-view', 'scene1-side-view', 'scene1-align-1', 'scene1-align-2'],
                highlight: ['scene1-main-view', 'scene1-top-view']
            },
            // 步骤 2: 高亮宽相等关系
            {
                visible: ['scene1-main-view', 'scene1-top-view', 'scene1-side-view', 'scene1-align-1', 'scene1-align-2', 'scene1-align-3', 'scene1-align-4'],
                highlight: ['scene1-side-view', 'scene1-top-view']
            },
            // 步骤 3: 显示高度信息和顶点
            {
                visible: ['scene1-main-view', 'scene1-top-view', 'scene1-side-view', 'scene1-vertex-p', 'scene1-vertex-label', 'scene1-height-line', 'scene1-height-label'],
                highlight: ['scene1-height-line']
            },
            // 步骤 4: 显示底面和棱线
            {
                visible: ['scene1-main-view', 'scene1-top-view', 'scene1-side-view', 'scene1-pyramid-base', 'scene1-vertex-p', 'scene1-vertex-label', 'scene1-height-line', 'scene1-height-label', 'scene1-edge-pa', 'scene1-edge-pb', 'scene1-edge-pc', 'scene1-edge-pd'],
                highlight: ['scene1-pyramid-base']
            },
            // 步骤 5: 完整立体图
            {
                visible: ['scene1-main-view', 'scene1-top-view', 'scene1-side-view', 'scene1-pyramid-base', 'scene1-vertex-p', 'scene1-vertex-label', 'scene1-height-line', 'scene1-height-label', 'scene1-edge-pa', 'scene1-edge-pb', 'scene1-edge-pc', 'scene1-edge-pd', 'scene1-vertex-a', 'scene1-vertex-b', 'scene1-vertex-c', 'scene1-vertex-d', 'scene1-connection-lines'],
                highlight: []
            }
        ];

        const SKIP_IDS = new Set(['scene1-container', 'scene1-svg', 'scene1-controls', 'scene1-prev-btn', 'scene1-next-btn', 'scene1-step-indicator', 'scene1-controls-svg', 'scene1-orthographic-views']);

        // 显示元素
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene1-hidden');
            }
        }

        // 隐藏元素
        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.add('scene1-hidden');
            }
        }

        // 清除所有高亮
        function clearHighlights() {
            document.querySelectorAll('.scene1-highlight').forEach(el => {
                el.classList.remove('scene1-highlight');
            });
        }

        // 应用高亮
        function applyHighlights(highlightIds) {
            clearHighlights();
            highlightIds.forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.classList.add('scene1-highlight');
                }
            });
        }

        // 更新步骤显示
        function updateStep() {
            const stepConfig = steps[state.currentStep];
            
            // 隐藏所有元素
            const allElements = document.querySelectorAll('[id^="scene1-"]');
            allElements.forEach(el => {
                if (!SKIP_IDS.has(el.id)) {
                    hideElement(el.id);
                }
            });

            // 显示当前步骤需要的元素
            stepConfig.visible.forEach(id => showElement(id));
            
            // 应用高亮
            applyHighlights(stepConfig.highlight);

            // 更新步骤指示器
            document.getElementById('scene1-step-indicator').textContent = `步骤 ${state.currentStep + 1}/${state.totalSteps}`;

            // 更新按钮状态
            document.getElementById('scene1-prev-btn').disabled = state.currentStep === 0;
            document.getElementById('scene1-next-btn').disabled = state.currentStep === state.totalSteps - 1;
        }

        // 按钮事件绑定
        document.getElementById('scene1-prev-btn').addEventListener('click', function() {
            if (state.currentStep > 0) {
                state.currentStep--;
                updateStep();
            }
        });

        document.getElementById('scene1-next-btn').addEventListener('click', function() {
            if (state.currentStep < state.totalSteps - 1) {
                state.currentStep++;
                updateStep();
            }
        });

        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
