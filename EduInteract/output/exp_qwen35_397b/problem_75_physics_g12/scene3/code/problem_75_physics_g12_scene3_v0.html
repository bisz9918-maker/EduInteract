<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>能量分析与动能定理图示</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene3-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #333; border-radius: 4px; background: #f0f0f0; }
        .scene3-btn:hover { background: #e0e0e0; }
        .scene3-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene3-step-indicator { font-size: 14px; color: #333; align-self: center; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg width="800" height="500" id="scene3-svg">
            <!-- 上极板 -->
            <line id="scene3-plate-top" x1="80" y1="120" x2="380" y2="120" stroke="#000" stroke-width="3"/>
            <!-- 上极板小孔（用白色线段覆盖表示开口） -->
            <line id="scene3-plate-hole" x1="220" y1="120" x2="240" y2="120" stroke="#fff" stroke-width="4"/>
            
            <!-- 下极板 -->
            <line id="scene3-plate-bottom" x1="80" y1="360" x2="380" y2="360" stroke="#000" stroke-width="3"/>
            
            <!-- 板间距离 d 标注线（左侧双向箭头） -->
            <line id="scene3-dist-d-line" x1="60" y1="120" x2="60" y2="360" stroke="#666" stroke-width="2" stroke-dasharray="4,2"/>
            <polygon id="scene3-dist-d-arrow1" points="60,115 57,125 63,125" fill="#666"/>
            <polygon id="scene3-dist-d-arrow2" points="60,365 57,355 63,355" fill="#666"/>
            <text id="scene3-label-d" x="45" y="245" font-size="16" fill="#000" style="display:none;">d</text>
            
            <!-- 小球初始位置（蓝色） -->
            <circle id="scene3-ball1-initial" cx="230" cy="60" r="6" fill="#1565c0" style="display:none;"/>
            <circle id="scene3-ball2-initial" cx="230" cy="90" r="6" fill="#1565c0" style="display:none;"/>
            <circle id="scene3-ball3-initial" cx="230" cy="120" r="6" fill="#1565c0" style="display:none;"/>
            
            <!-- 小球最终位置（绿色半透明） -->
            <circle id="scene3-ball1-final" cx="230" cy="300" r="6" fill="#2e7d32" opacity="0.5" style="display:none;"/>
            <circle id="scene3-ball2-final" cx="230" cy="330" r="6" fill="#2e7d32" opacity="0.5" style="display:none;"/>
            <circle id="scene3-ball3-final" cx="230" cy="360" r="6" fill="#2e7d32" opacity="0.5" style="display:none;"/>
            
            <!-- 连接杆初始位置 -->
            <line id="scene3-rod1" x1="230" y1="66" x2="230" y2="84" stroke="#1565c0" stroke-width="3" style="display:none;"/>
            <line id="scene3-rod2" x1="230" y1="96" x2="230" y2="114" stroke="#1565c0" stroke-width="3" style="display:none;"/>
            
            <!-- L 标签（杆长）- 调整位置避免拥挤 -->
            <text id="scene3-label-L1" x="250" y="78" font-size="14" fill="#000" style="display:none;">L</text>
            <text id="scene3-label-L2" x="250" y="112" font-size="14" fill="#000" style="display:none;">L</text>
            
            <!-- 下落距离标注（右侧） -->
            <!-- 3L 标注 -->
            <line id="scene3-dist-3L-line" x1="280" y1="60" x2="280" y2="300" stroke="#2e7d32" stroke-width="2"/>
            <polygon id="scene3-dist-3L-arrow1" points="280,55 277,65 283,65" fill="#2e7d32" style="display:none;"/>
            <polygon id="scene3-dist-3L-arrow2" points="280,305 277,295 283,295" fill="#2e7d32" style="display:none;"/>
            <text id="scene3-label-3L" x="295" y="185" font-size="14" fill="#2e7d32" style="display:none;">3L</text>
            
            <!-- 2L 标注 -->
            <line id="scene3-dist-2L-line" x1="310" y1="90" x2="310" y2="330" stroke="#2e7d32" stroke-width="2"/>
            <polygon id="scene3-dist-2L-arrow1" points="310,85 307,95 313,95" fill="#2e7d32" style="display:none;"/>
            <polygon id="scene3-dist-2L-arrow2" points="310,335 307,325 313,325" fill="#2e7d32" style="display:none;"/>
            <text id="scene3-label-2L" x="325" y="215" font-size="14" fill="#2e7d32" style="display:none;">2L</text>
            
            <!-- L 标注（下落） -->
            <line id="scene3-dist-L-line" x1="340" y1="120" x2="340" y2="360" stroke="#2e7d32" stroke-width="2"/>
            <polygon id="scene3-dist-L-arrow1" points="340,115 337,125 343,125" fill="#2e7d32" style="display:none;"/>
            <polygon id="scene3-dist-L-arrow2" points="340,365 337,355 343,355" fill="#2e7d32" style="display:none;"/>
            <text id="scene3-label-L-drop" x="355" y="245" font-size="14" fill="#2e7d32" style="display:none;">L</text>
            
            <!-- 能量条形图 - 调整布局，移到更右侧 -->
            <!-- 重力做功条形（绿色） -->
            <rect id="scene3-bar-WG" x="480" y="80" width="0" height="25" fill="#2e7d32" style="display:none;"/>
            <text id="scene3-label-WG" x="590" y="98" font-size="13" fill="#000" style="display:none;">W_G = 9mgL</text>
            
            <!-- 电场力做功条形（红色） -->
            <rect id="scene3-bar-WE" x="480" y="125" width="0" height="25" fill="#c62828" style="display:none;"/>
            <text id="scene3-label-WE" x="590" y="143" font-size="13" fill="#000" style="display:none;">W_E = -2qU</text>
            
            <!-- 动能变化条形（零长度） -->
            <rect id="scene3-bar-DEk" x="480" y="170" width="0" height="25" fill="#666" style="display:none;"/>
            <text id="scene3-label-DEk" x="590" y="188" font-size="13" fill="#000" style="display:none;">ΔE_k = 0</text>
            
            <!-- 公式区背景 - 调整位置，移到下方 -->
            <rect id="scene3-formula-bg" x="550" y="220" width="230" height="160" fill="#f5f5f5" stroke="#ccc" stroke-width="1" style="display:none;"/>
            
            <!-- 公式 - 调整垂直间距 -->
            <text id="scene3-formula1" x="560" y="250" font-size="13" fill="#000" style="display:none;">W_G + W_E = ΔE_k</text>
            <text id="scene3-formula2" x="560" y="285" font-size="13" fill="#000" style="display:none;">9mgL - 2qU = 0</text>
            <text id="scene3-formula3" x="560" y="325" font-size="14" fill="#1565c0" font-weight="bold" style="display:none;">U = 9mgL/(2q)</text>
            <text id="scene3-formula4" x="560" y="355" font-size="13" fill="#000" style="display:none;">v_max 位置：第二球刚进入电场</text>
            
            <!-- v_max 高亮标记 -->
            <circle id="scene3-vmax-highlight" cx="230" cy="150" r="20" fill="none" stroke="#ffc107" stroke-width="3" opacity="0.7" style="display:none;"/>
            
            <!-- 步骤指示器（SVG 内） -->
            <text id="scene3-step-indicator" x="400" y="475" font-size="14" fill="#333" text-anchor="middle" style="display:none;">步骤 0/5</text>
        </svg>
        
        <!-- HTML 按钮覆盖层（用于点击事件） -->
        <div id="scene3-controls">
            <button id="scene3-btn-prev" class="scene3-btn">◀ 上一步</button>
            <span id="scene3-step-text" class="scene3-step-indicator">步骤 0/5</span>
            <button id="scene3-btn-next" class="scene3-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 3 实现 - 能量分析与动能定理图示
        
        const state = {
            currentStep: 0,
            totalSteps: 5
        };
        
        // 元素引用
        const elements = {
            // 极板
            plateTop: document.getElementById('scene3-plate-top'),
            plateHole: document.getElementById('scene3-plate-hole'),
            plateBottom: document.getElementById('scene3-plate-bottom'),
            distDLine: document.getElementById('scene3-dist-d-line'),
            distDArrow1: document.getElementById('scene3-dist-d-arrow1'),
            distDArrow2: document.getElementById('scene3-dist-d-arrow2'),
            labelD: document.getElementById('scene3-label-d'),
            
            // 小球初始位置
            ball1Initial: document.getElementById('scene3-ball1-initial'),
            ball2Initial: document.getElementById('scene3-ball2-initial'),
            ball3Initial: document.getElementById('scene3-ball3-initial'),
            
            // 小球最终位置
            ball1Final: document.getElementById('scene3-ball1-final'),
            ball2Final: document.getElementById('scene3-ball2-final'),
            ball3Final: document.getElementById('scene3-ball3-final'),
            
            // 连接杆
            rod1: document.getElementById('scene3-rod1'),
            rod2: document.getElementById('scene3-rod2'),
            labelL1: document.getElementById('scene3-label-L1'),
            labelL2: document.getElementById('scene3-label-L2'),
            
            // 下落距离标注
            dist3LLine: document.getElementById('scene3-dist-3L-line'),
            dist3LArrow1: document.getElementById('scene3-dist-3L-arrow1'),
            dist3LArrow2: document.getElementById('scene3-dist-3L-arrow2'),
            label3L: document.getElementById('scene3-label-3L'),
            dist2LLine: document.getElementById('scene3-dist-2L-line'),
            dist2LArrow1: document.getElementById('scene3-dist-2L-arrow1'),
            dist2LArrow2: document.getElementById('scene3-dist-2L-arrow2'),
            label2L: document.getElementById('scene3-label-2L'),
            distLLine: document.getElementById('scene3-dist-L-line'),
            distLArrow1: document.getElementById('scene3-dist-L-arrow1'),
            distLArrow2: document.getElementById('scene3-dist-L-arrow2'),
            labelLDrop: document.getElementById('scene3-label-L-drop'),
            
            // 能量条形图
            barWG: document.getElementById('scene3-bar-WG'),
            labelWG: document.getElementById('scene3-label-WG'),
            barWE: document.getElementById('scene3-bar-WE'),
            labelWE: document.getElementById('scene3-label-WE'),
            barDEk: document.getElementById('scene3-bar-DEk'),
            labelDEk: document.getElementById('scene3-label-DEk'),
            
            // 公式区
            formulaBg: document.getElementById('scene3-formula-bg'),
            formula1: document.getElementById('scene3-formula1'),
            formula2: document.getElementById('scene3-formula2'),
            formula3: document.getElementById('scene3-formula3'),
            formula4: document.getElementById('scene3-formula4'),
            
            // v_max 高亮
            vmaxHighlight: document.getElementById('scene3-vmax-highlight'),
            
            // 步骤指示器
            stepIndicator: document.getElementById('scene3-step-indicator'),
            
            // 控件
            btnPrev: document.getElementById('scene3-btn-prev'),
            btnNext: document.getElementById('scene3-btn-next'),
            stepText: document.getElementById('scene3-step-text')
        };
        
        // 显示/隐藏辅助函数
        function showSVG(el) {
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }
        
        function hideSVG(el) {
            if (el) {
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }
        
        // 渲染函数
        function render() {
            // 重置所有元素
            hideSVG(elements.labelD);
            hideSVG(elements.ball1Initial);
            hideSVG(elements.ball2Initial);
            hideSVG(elements.ball3Initial);
            hideSVG(elements.ball1Final);
            hideSVG(elements.ball2Final);
            hideSVG(elements.ball3Final);
            hideSVG(elements.rod1);
            hideSVG(elements.rod2);
            hideSVG(elements.labelL1);
            hideSVG(elements.labelL2);
            hideSVG(elements.dist3LLine);
            hideSVG(elements.dist3LArrow1);
            hideSVG(elements.dist3LArrow2);
            hideSVG(elements.label3L);
            hideSVG(elements.dist2LLine);
            hideSVG(elements.dist2LArrow1);
            hideSVG(elements.dist2LArrow2);
            hideSVG(elements.label2L);
            hideSVG(elements.distLLine);
            hideSVG(elements.distLArrow1);
            hideSVG(elements.distLArrow2);
            hideSVG(elements.labelLDrop);
            hideSVG(elements.barWG);
            hideSVG(elements.labelWG);
            hideSVG(elements.barWE);
            hideSVG(elements.labelWE);
            hideSVG(elements.barDEk);
            hideSVG(elements.labelDEk);
            hideSVG(elements.formulaBg);
            hideSVG(elements.formula1);
            hideSVG(elements.formula2);
            hideSVG(elements.formula3);
            hideSVG(elements.formula4);
            hideSVG(elements.vmaxHighlight);
            hideSVG(elements.stepIndicator);
            
            // 始终显示极板
            showSVG(elements.plateTop);
            showSVG(elements.plateHole);
            showSVG(elements.plateBottom);
            showSVG(elements.distDLine);
            showSVG(elements.distDArrow1);
            showSVG(elements.distDArrow2);
            showSVG(elements.labelD);
            
            // 步骤 0：初始状态 - 显示小球初始位置和连接杆
            if (state.currentStep >= 0) {
                showSVG(elements.ball1Initial);
                showSVG(elements.ball2Initial);
                showSVG(elements.ball3Initial);
                showSVG(elements.rod1);
                showSVG(elements.rod2);
                showSVG(elements.labelL1);
                showSVG(elements.labelL2);
            }
            
            // 步骤 1：显示最终位置和下落距离标注
            if (state.currentStep >= 1) {
                showSVG(elements.ball1Final);
                showSVG(elements.ball2Final);
                showSVG(elements.ball3Final);
                showSVG(elements.dist3LLine);
                showSVG(elements.dist3LArrow1);
                showSVG(elements.dist3LArrow2);
                showSVG(elements.label3L);
                showSVG(elements.dist2LLine);
                showSVG(elements.dist2LArrow1);
                showSVG(elements.dist2LArrow2);
                showSVG(elements.label2L);
                showSVG(elements.distLLine);
                showSVG(elements.distLArrow1);
                showSVG(elements.distLArrow2);
                showSVG(elements.labelLDrop);
            }
            
            // 步骤 2：显示重力做功
            if (state.currentStep >= 2) {
                showSVG(elements.barWG);
                showSVG(elements.labelWG);
                // 动画条形宽度
                setTimeout(() => {
                    elements.barWG.setAttribute('width', '90');
                }, 50);
                showSVG(elements.formulaBg);
                showSVG(elements.formula1);
            }
            
            // 步骤 3：显示电场力做功
            if (state.currentStep >= 3) {
                showSVG(elements.barWE);
                showSVG(elements.labelWE);
                // 动画条形宽度
                setTimeout(() => {
                    elements.barWE.setAttribute('width', '70');
                }, 50);
                showSVG(elements.formula2);
            }
            
            // 步骤 4：显示动能定理和结果
            if (state.currentStep >= 4) {
                showSVG(elements.barDEk);
                showSVG(elements.labelDEk);
                showSVG(elements.formula3);
            }
            
            // 步骤 5：显示 v_max 分析
            if (state.currentStep >= 5) {
                showSVG(elements.vmaxHighlight);
                showSVG(elements.formula4);
            }
            
            // 更新按钮状态和步骤指示器
            elements.btnPrev.disabled = state.currentStep === 0;
            elements.btnNext.disabled = state.currentStep === state.totalSteps;
            elements.stepText.textContent = `步骤 ${state.currentStep}/${state.totalSteps}`;
            elements.stepIndicator.textContent = `步骤 ${state.currentStep}/${state.totalSteps}`;
            showSVG(elements.stepIndicator);
        }
        
        // 事件处理
        elements.btnPrev.addEventListener('click', () => {
            if (state.currentStep > 0) {
                state.currentStep--;
                render();
            }
        });
        
        elements.btnNext.addEventListener('click', () => {
            if (state.currentStep < state.totalSteps) {
                state.currentStep++;
                render();
            }
        });
        
        // 初始渲染
        render();
    })();
    </script>
</body>
</html>
