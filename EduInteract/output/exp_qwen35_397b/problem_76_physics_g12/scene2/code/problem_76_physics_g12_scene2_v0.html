<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动量守恒矢量关系图</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #scene2-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene2-svg {
            width: 800px;
            height: 500px;
        }
        .scene2-arrow {
            transition: opacity 0.3s ease;
        }
        .scene2-label {
            transition: opacity 0.3s ease;
        }
        .scene2-btn {
            cursor: pointer;
            rx: 5;
            ry: 5;
        }
        .scene2-btn:hover {
            opacity: 0.8;
        }
        .scene2-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene2-arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#c62828" />
                </marker>
                <marker id="scene2-arrowhead-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#1565c0" />
                </marker>
                <marker id="scene2-arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#2e7d32" />
                </marker>
            </defs>

            <!-- 步骤指示器 -->
            <text id="scene2-step-indicator" x="400" y="35" text-anchor="middle" font-size="16px" fill="#333" font-weight="bold">步骤 1/4</text>

            <!-- 等号 -->
            <text id="scene2-eq1" x="120" y="105" text-anchor="middle" font-size="20px" fill="#000" opacity="0.3">=</text>
            <text id="scene2-eq2" x="120" y="225" text-anchor="middle" font-size="20px" fill="#000" opacity="0.3">=</text>
            <text id="scene2-eq3" x="120" y="345" text-anchor="middle" font-size="20px" fill="#000" opacity="0.3">=</text>

            <!-- 行 1：初始动量 -->
            <!-- 基线（灰色虚线） -->
            <line id="scene2-row1-baseline" x1="150" y1="100" x2="650" y2="100" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" />
            <!-- 箭头（红色） -->
            <line id="scene2-row1-arrow" x1="150" y1="100" x2="650" y2="100" stroke="#c62828" stroke-width="8" marker-end="url(#scene2-arrowhead-red)" class="scene2-arrow" />
            <!-- 标签 -->
            <text id="scene2-row1-label" x="400" y="80" text-anchor="middle" font-size="16px" fill="#000" class="scene2-label">m₀v₀=2</text>

            <!-- 行 2：阶段一末 -->
            <!-- 基线（灰色虚线） -->
            <line id="scene2-row2-baseline" x1="150" y1="220" x2="650" y2="220" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" />
            <!-- 箭头 1：m0·vC'（红色，80px） -->
            <line id="scene2-row2-arrow-c" x1="150" y1="220" x2="230" y2="220" stroke="#c62828" stroke-width="8" marker-end="url(#scene2-arrowhead-red)" class="scene2-arrow" opacity="0" />
            <!-- 箭头 2：(mA+mB)·vAB（蓝色，420px） -->
            <line id="scene2-row2-arrow-ab" x1="230" y1="220" x2="650" y2="220" stroke="#1565c0" stroke-width="8" marker-end="url(#scene2-arrowhead-blue)" class="scene2-arrow" opacity="0" />
            <!-- 标签 -->
            <text id="scene2-row2-label-c-name" x="190" y="200" text-anchor="middle" font-size="14px" fill="#000" class="scene2-label" opacity="0">m₀vC'</text>
            <text id="scene2-row2-label-c-val" x="190" y="245" text-anchor="middle" font-size="14px" fill="#000" class="scene2-label" opacity="0">0.32</text>
            <text id="scene2-row2-label-ab-name" x="440" y="200" text-anchor="middle" font-size="14px" fill="#000" class="scene2-label" opacity="0">(mA+mB)vAB</text>
            <text id="scene2-row2-label-ab-val" x="440" y="245" text-anchor="middle" font-size="14px" fill="#000" class="scene2-label" opacity="0">1.68</text>

            <!-- 行 3：阶段二末 -->
            <!-- 基线（灰色虚线） -->
            <line id="scene2-row3-baseline" x1="150" y1="340" x2="650" y2="340" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" />
            <!-- 箭头 1：mA·vA（蓝色，262px） -->
            <line id="scene2-row3-arrow-a" x1="150" y1="340" x2="412" y2="340" stroke="#1565c0" stroke-width="8" marker-end="url(#scene2-arrowhead-blue)" class="scene2-arrow" opacity="0" />
            <!-- 箭头 2：(m0+mB)·v（绿色，238px） -->
            <line id="scene2-row3-arrow-b" x1="412" y1="340" x2="650" y2="340" stroke="#2e7d32" stroke-width="8" marker-end="url(#scene2-arrowhead-green)" class="scene2-arrow" opacity="0" />
            <!-- 标签 -->
            <text id="scene2-row3-label-a-name" x="281" y="320" text-anchor="middle" font-size="14px" fill="#000" class="scene2-label" opacity="0">mAvA</text>
            <text id="scene2-row3-label-a-val" x="281" y="365" text-anchor="middle" font-size="14px" fill="#000" class="scene2-label" opacity="0">1.05</text>
            <text id="scene2-row3-label-b-name" x="531" y="320" text-anchor="middle" font-size="14px" fill="#000" class="scene2-label" opacity="0">(m₀+mB)v</text>
            <text id="scene2-row3-label-b-val" x="531" y="365" text-anchor="middle" font-size="14px" fill="#000" class="scene2-label" opacity="0">0.95</text>

            <!-- 动量守恒方程（步骤 4 显示） -->
            <text id="scene2-equation" x="400" y="420" text-anchor="middle" font-size="14px" fill="#333" opacity="0">
                m₀v₀ = m₀vC' + (mA+mB)vAB = mAvA + (m₀+mB)v
            </text>

            <!-- 控件栏：上一步/下一步按钮 -->
            <g id="scene2-controls">
                <!-- 上一步按钮 -->
                <rect id="scene2-btn-prev-bg" x="320" y="455" width="80" height="30" rx="5" ry="5" fill="#9e9e9e" class="scene2-btn" />
                <text id="scene2-btn-prev-text" x="360" y="475" text-anchor="middle" font-size="14px" fill="#fff">◀ 上一步</text>
                
                <!-- 下一步按钮 -->
                <rect id="scene2-btn-next-bg" x="420" y="455" width="80" height="30" rx="5" ry="5" fill="#1976d2" class="scene2-btn" />
                <text id="scene2-btn-next-text" x="460" y="475" text-anchor="middle" font-size="14px" fill="#fff">下一步 ▶</text>
            </g>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 2: 动量守恒矢量关系图
        // 布局坐标表（实现对照依据）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // |------|------|-----------|------|-------------|------|
        // | 行 1 基线 | 线段 | (150,100)-(650,100) | 500×2 | - | 初始动量基准线，灰色虚线 |
        // | 行 1 箭头 | 箭头 | (150,100)-(650,100) | 500×8 | - | 红色#c62828，表示 m0·v0 |
        // | 行 1 标签 | text | (400,80) | ~80×16 | 上方居中 | "m₀v₀=2" |
        // | 行 2 基线 | 线段 | (150,220)-(650,220) | 500×2 | - | 阶段一基准线，灰色虚线 |
        // | 行 2 箭头 1 | 箭头 | (150,220)-(230,220) | 80×8 | - | 红色#c62828，m0·vC'=0.32 |
        // | 行 2 箭头 2 | 箭头 | (230,220)-(650,220) | 420×8 | - | 蓝色#1565c0，(mA+mB)·vAB=1.68 |
        // | 行 2 标签 1 | text | (190,200) | ~50×16 | 上方居中 | "m₀vC'" |
        // | 行 2 标签 2 | text | (440,200) | ~70×16 | 上方居中 | "(mA+mB)vAB" |
        // | 行 2 分值 1 | text | (190,245) | ~40×14 | 下方居中 | "0.32" |
        // | 行 2 分值 2 | text | (440,245) | ~40×14 | 下方居中 | "1.68" |
        // | 行 3 基线 | 线段 | (150,340)-(650,340) | 500×2 | - | 阶段二基准线，灰色虚线 |
        // | 行 3 箭头 1 | 箭头 | (150,340)-(412,340) | 262×8 | - | 蓝色#1565c0，mA·vA=1.05 |
        // | 行 3 箭头 2 | 箭头 | (412,340)-(650,340) | 238×8 | - | 绿色#2e7d32，(m0+mB)·v=0.95 |
        // | 行 3 标签 1 | text | (281,320) | ~50×16 | 上方居中 | "mAvA" |
        // | 行 3 标签 2 | text | (531,320) | ~60×16 | 上方居中 | "(m₀+mB)v" |
        // | 行 3 分值 1 | text | (281,365) | ~40×14 | 下方居中 | "1.05" |
        // | 行 3 分值 2 | text | (531,365) | ~40×14 | 下方居中 | "0.95" |
        // | 等号 1 | text | (120,100) | 20×20 | - | "=" 连接行 1 与行 2 |
        // | 等号 2 | text | (120,220) | 20×20 | - | "=" 连接行 2 与行 3 |
        // | 等号 3 | text | (120,340) | 20×20 | - | "=" 连接行 3 |
        // | 步骤指示器 | text | (400,20) | ~100×16 | - | "步骤 X/4" 动态更新 |
        // | 上一步按钮 | rect+text | (320,455) | 80×30 | - | 灰色背景，白色文字 |
        // | 下一步按钮 | rect+text | (420,455) | 80×30 | - | 蓝色背景，白色文字 |

        let currentStep = 0;
        const totalSteps = 4;

        // 获取 DOM 元素
        const stepIndicator = document.getElementById('scene2-step-indicator');
        const eq1 = document.getElementById('scene2-eq1');
        const eq2 = document.getElementById('scene2-eq2');
        const eq3 = document.getElementById('scene2-eq3');
        
        // 行 1 元素
        const row1Arrow = document.getElementById('scene2-row1-arrow');
        const row1Label = document.getElementById('scene2-row1-label');
        
        // 行 2 元素
        const row2ArrowC = document.getElementById('scene2-row2-arrow-c');
        const row2ArrowAB = document.getElementById('scene2-row2-arrow-ab');
        const row2LabelCName = document.getElementById('scene2-row2-label-c-name');
        const row2LabelCVal = document.getElementById('scene2-row2-label-c-val');
        const row2LabelABName = document.getElementById('scene2-row2-label-ab-name');
        const row2LabelABVal = document.getElementById('scene2-row2-label-ab-val');
        
        // 行 3 元素
        const row3ArrowA = document.getElementById('scene2-row3-arrow-a');
        const row3ArrowB = document.getElementById('scene2-row3-arrow-b');
        const row3LabelAName = document.getElementById('scene2-row3-label-a-name');
        const row3LabelAVal = document.getElementById('scene2-row3-label-a-val');
        const row3LabelBName = document.getElementById('scene2-row3-label-b-name');
        const row3LabelBVal = document.getElementById('scene2-row3-label-b-val');
        
        // 方程
        const equation = document.getElementById('scene2-equation');
        
        // 按钮
        const btnPrevBg = document.getElementById('scene2-btn-prev-bg');
        const btnPrevText = document.getElementById('scene2-btn-prev-text');
        const btnNextBg = document.getElementById('scene2-btn-next-bg');
        const btnNextText = document.getElementById('scene2-btn-next-text');

        // 更新显示状态
        function updateDisplay() {
            // 更新步骤指示器
            stepIndicator.textContent = `步骤 ${currentStep + 1}/${totalSteps}`;
            
            // 行 1 始终显示
            row1Arrow.style.opacity = '1';
            row1Label.style.opacity = '1';
            
            // 等号显示
            eq1.style.opacity = currentStep >= 1 ? '1' : '0.3';
            eq2.style.opacity = currentStep >= 2 ? '1' : '0.3';
            eq3.style.opacity = currentStep >= 2 ? '1' : '0.3';
            
            // 行 2 显示
            if (currentStep >= 1) {
                row2ArrowC.style.opacity = '1';
                row2ArrowAB.style.opacity = '1';
                row2LabelCName.style.opacity = '1';
                row2LabelCVal.style.opacity = '1';
                row2LabelABName.style.opacity = '1';
                row2LabelABVal.style.opacity = '1';
            } else {
                row2ArrowC.style.opacity = '0';
                row2ArrowAB.style.opacity = '0';
                row2LabelCName.style.opacity = '0';
                row2LabelCVal.style.opacity = '0';
                row2LabelABName.style.opacity = '0';
                row2LabelABVal.style.opacity = '0';
            }
            
            // 行 3 显示
            if (currentStep >= 2) {
                row3ArrowA.style.opacity = '1';
                row3ArrowB.style.opacity = '1';
                row3LabelAName.style.opacity = '1';
                row3LabelAVal.style.opacity = '1';
                row3LabelBName.style.opacity = '1';
                row3LabelBVal.style.opacity = '1';
            } else {
                row3ArrowA.style.opacity = '0';
                row3ArrowB.style.opacity = '0';
                row3LabelAName.style.opacity = '0';
                row3LabelAVal.style.opacity = '0';
                row3LabelBName.style.opacity = '0';
                row3LabelBVal.style.opacity = '0';
            }
            
            // 方程显示（步骤 4）
            equation.style.opacity = currentStep >= 3 ? '1' : '0';
            
            // 按钮状态
            btnPrevBg.style.opacity = currentStep === 0 ? '0.5' : '1';
            btnPrevText.style.opacity = currentStep === 0 ? '0.5' : '1';
            
            if (currentStep >= totalSteps - 1) {
                btnNextBg.setAttribute('fill', '#1976d2');
                btnNextText.textContent = '重新开始';
            } else {
                btnNextBg.setAttribute('fill', '#1976d2');
                btnNextText.textContent = '下一步 ▶';
            }
        }

        // 上一步
        function prevStep() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        }

        // 下一步
        function nextStep() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateDisplay();
            } else {
                // 重新开始
                currentStep = 0;
                updateDisplay();
            }
        }

        // 按钮点击事件
        btnPrevBg.addEventListener('click', prevStep);
        btnNextBg.addEventListener('click', nextStep);

        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
