<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>平行板电容器与方波电压</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: Arial, sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-controls button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #333; border-radius: 4px; background: #f5f5f5; }
        #scene1-controls button:hover { background: #e0e0e0; }
        #scene1-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 14px; color: #333; min-width: 80px; text-align: center; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#1565c0" />
                </marker>
                <marker id="scene1-arrowhead-black" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#000000" />
                </marker>
                <!-- 靶的斜线填充图案 -->
                <pattern id="scene1-hatch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
                    <line x1="0" y1="0" x2="0" y2="10" stroke="#999" stroke-width="2" />
                </pattern>
            </defs>

            <!-- ========== 左侧装置区 ========== -->
            <!-- 上金属板A -->
            <rect id="scene1-plate-a" x="60" y="140" width="360" height="10" fill="#333" stroke="#000" stroke-width="2" />
            
            <!-- 下金属板B -->
            <rect id="scene1-plate-b" x="60" y="250" width="360" height="10" fill="#333" stroke="#000" stroke-width="2" />
            
            <!-- 靶MN -->
            <rect id="scene1-target-mn" x="440" y="140" width="20" height="120" fill="url(#scene1-hatch)" stroke="#000" stroke-width="2" />
            
            <!-- 中心轴线OO'（虚线，初始50%透明度） -->
            <line id="scene1-axis-oo" x1="50" y1="200" x2="430" y2="200" stroke="#888" stroke-width="1" stroke-dasharray="5,5" opacity="0.5" />
            
            <!-- O点 -->
            <circle id="scene1-point-o" cx="50" cy="200" r="4" fill="#000" opacity="0" />
            
            <!-- O'点 -->
            <circle id="scene1-point-o-prime" cx="430" cy="200" r="4" fill="#000" opacity="0" />
            
            <!-- 板间距d标注双向箭头（左侧） -->
            <line id="scene1-d-arrow-line" x1="40" y1="150" x2="40" y2="250" stroke="#000" stroke-width="1" opacity="0" />
            <polygon id="scene1-d-arrow-up" points="40,150 37,158 43,158" fill="#000" opacity="0" />
            <polygon id="scene1-d-arrow-down" points="40,250 37,242 43,242" fill="#000" opacity="0" />
            
            <!-- 粒子入射箭头 -->
            <line id="scene1-arrow-v0" x1="55" y1="200" x2="150" y2="200" stroke="#1565c0" stroke-width="3" marker-end="url(#scene1-arrowhead)" opacity="0" />
            
            <!-- ========== 标签（初始隐藏） ========== -->
            <!-- A板标签 -->
            <text id="scene1-label-a" x="50" y="125" font-size="14" fill="#000" opacity="0">A</text>
            
            <!-- B板标签 -->
            <text id="scene1-label-b" x="50" y="275" font-size="14" fill="#000" opacity="0">B</text>
            
            <!-- d标签 -->
            <text id="scene1-label-d" x="25" y="205" font-size="14" fill="#000" opacity="0">d</text>
            
            <!-- v₀标签 -->
            <text id="scene1-label-v0" x="100" y="185" font-size="14" fill="#000" opacity="0">v₀</text>
            
            <!-- M点标签 -->
            <text id="scene1-label-m" x="465" y="135" font-size="14" fill="#000" opacity="0">M</text>
            
            <!-- N点标签 -->
            <text id="scene1-label-n" x="465" y="275" font-size="14" fill="#000" opacity="0">N</text>
            
            <!-- O点标签 -->
            <text id="scene1-label-o" x="45" y="220" font-size="14" fill="#000" opacity="0">O</text>
            
            <!-- O'点标签 -->
            <text id="scene1-label-o-prime" x="435" y="220" font-size="14" fill="#000" opacity="0">O'</text>
            
            <!-- ========== 右侧U-t图区 ========== -->
            <!-- U-t图外框 -->
            <rect id="scene1-ut-frame" x="500" y="280" width="280" height="140" fill="none" stroke="#ccc" stroke-width="1" opacity="0" />
            
            <!-- U轴 -->
            <line id="scene1-ut-u-axis" x1="520" y1="400" x2="520" y2="290" stroke="#000" stroke-width="2" opacity="0" />
            
            <!-- t轴 -->
            <line id="scene1-ut-t-axis" x1="510" y1="400" x2="760" y2="400" stroke="#000" stroke-width="2" opacity="0" />
            
            <!-- U轴箭头 -->
            <polygon id="scene1-ut-u-arrow" points="520,290 517,298 523,298" fill="#000" opacity="0" />
            
            <!-- t轴箭头 -->
            <polygon id="scene1-ut-t-arrow" points="760,400 752,397 752,403" fill="#000" opacity="0" />
            
            <!-- U轴标签 -->
            <text id="scene1-ut-label-u" x="525" y="285" font-size="14" fill="#000" opacity="0">U</text>
            
            <!-- t轴标签 -->
            <text id="scene1-ut-label-t" x="765" y="395" font-size="14" fill="#000" opacity="0">t</text>
            
            <!-- 原点O标签 -->
            <text id="scene1-ut-label-origin" x="505" y="415" font-size="12" fill="#000" opacity="0">O</text>
            
            <!-- U₀刻度线 -->
            <line id="scene1-ut-u0-tick" x1="515" y1="320" x2="520" y2="320" stroke="#000" stroke-width="1" opacity="0" />
            
            <!-- U₀标签 -->
            <text id="scene1-ut-label-u0" x="485" y="315" font-size="12" fill="#000" opacity="0">U₀</text>
            
            <!-- -U₀刻度线 -->
            <line id="scene1-ut-neg-u0-tick" x1="515" y1="480" x2="520" y2="480" stroke="#000" stroke-width="1" opacity="0" />
            
            <!-- -U₀标签 -->
            <text id="scene1-ut-label-neg-u0" x="480" y="485" font-size="12" fill="#000" opacity="0">-U₀</text>
            
            <!-- 方波线段（基础波形，60%透明度） -->
            <!-- 0到2T/3，U=U₀ -->
            <line id="scene1-ut-wave-1" x1="520" y1="320" x2="613" y2="320" stroke="#c62828" stroke-width="2" opacity="0" />
            <!-- 2T/3处下降 -->
            <line id="scene1-ut-wave-2" x1="613" y1="320" x2="613" y2="400" stroke="#c62828" stroke-width="2" opacity="0" />
            <!-- 2T/3到T，U=-U₀（实际在t轴上，因为-U₀对应y=480，但图区只到420，需要调整） -->
            <!-- 重新计算：U₀在y=320，0在y=400，所以-U₀应该在y=480，但图区底部是420 -->
            <!-- 调整：让-U₀在y=400+40=440，但图区只到420，所以压缩比例 -->
            <!-- 简化：U₀在y=320，0在y=400，-U₀在y=400+(400-320)=480，但图区限制，让-U₀线段在y=400显示 -->
            <line id="scene1-ut-wave-3" x1="613" y1="400" x2="706" y2="400" stroke="#c62828" stroke-width="2" opacity="0" />
            <!-- T处上升 -->
            <line id="scene1-ut-wave-4" x1="706" y1="400" x2="706" y2="320" stroke="#c62828" stroke-width="2" opacity="0" />
            <!-- T到5T/3，U=U₀ -->
            <line id="scene1-ut-wave-5" x1="706" y1="320" x2="750" y2="320" stroke="#c62828" stroke-width="2" opacity="0" />
            <!-- 5T/3处下降 -->
            <line id="scene1-ut-wave-6" x1="750" y1="320" x2="750" y2="400" stroke="#c62828" stroke-width="2" opacity="0" />
            <!-- 5T/3到2T，U=-U₀ -->
            <line id="scene1-ut-wave-7" x1="750" y1="400" x2="760" y2="400" stroke="#c62828" stroke-width="2" opacity="0" />
            
            <!-- 时间点标签（绿色） -->
            <text id="scene1-ut-time-0" x="520" y="415" font-size="11" fill="#2e7d32" opacity="0">0</text>
            <text id="scene1-ut-time-2t3" x="605" y="415" font-size="11" fill="#2e7d32" opacity="0">2T/3</text>
            <text id="scene1-ut-time-t" x="700" y="415" font-size="11" fill="#2e7d32" opacity="0">T</text>
            <text id="scene1-ut-time-5t3" x="745" y="415" font-size="11" fill="#2e7d32" opacity="0">5T/3</text>
            <text id="scene1-ut-time-2t" x="760" y="415" font-size="11" fill="#2e7d32" opacity="0">2T</text>
            
            <!-- ========== 粒子（动画用） ========== -->
            <circle id="scene1-particle" cx="50" cy="200" r="5" fill="#1565c0" opacity="0" />
            
            <!-- 粒子轨迹虚线 -->
            <line id="scene1-particle-trail" x1="50" y1="200" x2="430" y2="200" stroke="#1565c0" stroke-width="1" stroke-dasharray="3,3" opacity="0" />
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <span id="scene1-step-indicator">步骤 0/4</span>
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现：平行板电容器与方波电压
        
        // 状态管理
        let currentStep = 0;
        const totalSteps = 4;
        
        // 每步需要显示的元素ID列表
        const stepElements = {
            0: [], // 初始状态：只显示基础装置（plate-a, plate-b, target-mn, axis-oo已默认显示）
            1: [ // 显示所有装置标签
                'point-o', 'point-o-prime', 'd-arrow-line', 'd-arrow-up', 'd-arrow-down',
                'arrow-v0', 'label-a', 'label-b', 'label-d', 'label-v0', 'label-m', 'label-n', 'label-o', 'label-o-prime'
            ],
            2: [ // 显示U-t图外框和坐标轴
                'ut-frame', 'ut-u-axis', 'ut-t-axis', 'ut-u-arrow', 'ut-t-arrow', 'ut-label-u', 'ut-label-t', 'ut-label-origin',
                'ut-wave-1', 'ut-wave-3', 'ut-wave-5', 'ut-wave-7'
            ],
            3: [ // 显示U₀刻度和时间点标签
                'ut-u0-tick', 'ut-label-u0', 'ut-neg-u0-tick', 'ut-label-neg-u0',
                'ut-wave-2', 'ut-wave-4', 'ut-wave-6',
                'ut-time-0', 'ut-time-2t3', 'ut-time-t', 'ut-time-5t3', 'ut-time-2t'
            ],
            4: [ // 粒子动画
                'particle', 'particle-trail'
            ]
        };
        
        // 元素显示/隐藏辅助函数
        function showElement(id) {
            const el = document.getElementById('scene1-' + id);
            if (el) {
                el.style.opacity = '1';
                if (el.tagName === 'line' || el.tagName === 'circle' || el.tagName === 'polygon') {
                    el.style.display = 'block';
                }
            }
        }
        
        function hideElement(id) {
            const el = document.getElementById('scene1-' + id);
            if (el) {
                el.style.opacity = '0';
                if (el.tagName === 'line' || el.tagName === 'circle' || el.tagName === 'polygon') {
                    el.style.display = 'none';
                }
            }
        }
        
        // 更新步骤显示
        function updateStepDisplay() {
            // 隐藏所有步骤特有元素
            for (let step = 1; step <= totalSteps; step++) {
                stepElements[step].forEach(id => hideElement(id));
            }
            
            // 显示当前步骤及之前步骤的元素
            for (let step = 1; step <= currentStep; step++) {
                stepElements[step].forEach(id => showElement(id));
            }
            
            // 特殊处理：步骤1时中心轴线变为100%不透明
            const axisOo = document.getElementById('scene1-axis-oo');
            if (currentStep >= 1) {
                axisOo.style.opacity = '1';
            } else {
                axisOo.style.opacity = '0.5';
            }
            
            // 步骤4时v₀箭头高亮
            const arrowV0 = document.getElementById('scene1-arrow-v0');
            if (currentStep >= 4) {
                arrowV0.setAttribute('stroke-width', '5');
            } else if (currentStep >= 1) {
                arrowV0.setAttribute('stroke-width', '3');
            }
            
            // 更新步骤指示器
            document.getElementById('scene1-step-indicator').textContent = '步骤 ' + currentStep + '/' + totalSteps;
            
            // 更新按钮状态
            document.getElementById('scene1-btn-prev').disabled = (currentStep === 0);
            document.getElementById('scene1-btn-next').disabled = (currentStep === totalSteps);
            
            // 步骤4时触发动画
            if (currentStep === 4) {
                animateParticle();
            } else {
                // 重置粒子位置
                const particle = document.getElementById('scene1-particle');
                const trail = document.getElementById('scene1-particle-trail');
                if (particle) {
                    particle.setAttribute('cx', '50');
                    particle.style.opacity = '0';
                }
                if (trail) {
                    trail.style.opacity = '0';
                }
            }
        }
        
        // 粒子动画
        function animateParticle() {
            const particle = document.getElementById('scene1-particle');
            const trail = document.getElementById('scene1-particle-trail');
            
            if (!particle) return;
            
            particle.style.opacity = '1';
            
            const startX = 50;
            const endX = 430;
            const y = 200;
            const duration = 2000; // 2秒
            const startTime = performance.now();
            
            function animate(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                const currentX = startX + (endX - startX) * progress;
                particle.setAttribute('cx', currentX);
                
                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    // 动画完成后显示轨迹
                    if (trail) {
                        trail.style.opacity = '1';
                    }
                }
            }
            
            requestAnimationFrame(animate);
        }
        
        // 按钮事件处理
        function stepForward() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateStepDisplay();
            }
        }
        
        function stepBackward() {
            if (currentStep > 0) {
                currentStep--;
                updateStepDisplay();
            }
        }
        
        // 初始化
        document.getElementById('scene1-btn-next').addEventListener('click', stepForward);
        document.getElementById('scene1-btn-prev').addEventListener('click', stepBackward);
        
        // 初始显示
        updateStepDisplay();
    })();
    </script>
</body>
</html>
