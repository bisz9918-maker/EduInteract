<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>粒子偏转轨迹对比分析</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-svg { width: 800px; height: 500px; }
        .scene2-hidden { display: none; opacity: 0; }
        .scene2-visible { display: block; opacity: 1; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene2-btn-prev, #scene2-btn-next { padding: 8px 16px; font-size: 14px; cursor: pointer; border: none; border-radius: 4px; }
        #scene2-btn-prev { background: #e0e0e0; color: #333; }
        #scene2-btn-prev:disabled { background: #f0f0f0; color: #aaa; cursor: not-allowed; }
        #scene2-btn-next { background: #1976d2; color: #fff; }
        #scene2-btn-next:disabled { background: #bbdefb; color: #666; cursor: not-allowed; }
        #scene2-state-indicator { font-size: 14px; color: #333; min-width: 80px; text-align: center; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- 箭头定义 -->
                <marker id="scene2-arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#2e7d32" />
                </marker>
                <marker id="scene2-arrowhead-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#1565c0" />
                </marker>
                <marker id="scene2-arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#c62828" />
                </marker>
                <!-- 靶的斜线填充 -->
                <pattern id="scene2-hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
                    <line x1="0" y1="0" x2="0" y2="8" stroke="#666" stroke-width="1" />
                </pattern>
            </defs>

            <!-- 平行板装置 -->
            <!-- A 板 (上极板): (50,140)-(550,155) -->
            <rect id="scene2-plate-a" x="50" y="140" width="500" height="15" fill="#000" />
            <text x="45" y="135" font-size="14" font-weight="bold">A</text>

            <!-- B 板 (下极板): (50,245)-(550,260) -->
            <rect id="scene2-plate-b" x="50" y="245" width="500" height="15" fill="#000" />
            <text x="45" y="275" font-size="14" font-weight="bold">B</text>

            <!-- 靶 MN: (550,140)-(565,260) -->
            <rect id="scene2-target" x="550" y="140" width="15" height="120" fill="url(#scene2-hatch)" stroke="#000" stroke-width="2" />
            <text x="558" y="135" font-size="14" font-weight="bold">M</text>
            <text x="558" y="275" font-size="14" font-weight="bold">N</text>

            <!-- 中心轴线: (50,200)-(550,200) -->
            <line id="scene2-axis" x1="50" y1="200" x2="550" y2="200" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" />

            <!-- O 点: (50,200) -->
            <circle id="scene2-point-o" cx="50" cy="200" r="3" fill="#000" />
            <text x="35" y="195" font-size="12" font-weight="bold">O</text>
            <!-- 初速度 v₀ -->
            <text x="70" y="185" font-size="12" font-style="italic">v<tspan baseline-shift="sub" font-size="10">0</tspan></text>

            <!-- O'点: (550,200) -->
            <circle id="scene2-point-oprime" cx="550" cy="200" r="3" fill="#000" />
            <text x="555" y="195" font-size="12" font-weight="bold">O'</text>

            <!-- 轨迹 1 (t=0 进入): 红色 -->
            <!-- 第一段 (0~2T/3): 向下弯曲抛物线，从 (50,200) 到约 (383,230) -->
            <path id="scene2-trail1-seg1" d="M 50,200 Q 217,215 383,230" fill="none" stroke="#c62828" stroke-width="2.5" class="scene2-hidden" />
            <!-- 第二段 (2T/3~T): 向上弯曲抛物线，从 (383,230) 到 (550,235) -->
            <path id="scene2-trail1-seg2" d="M 383,230 Q 467,232 550,235" fill="none" stroke="#c62828" stroke-width="2.5" class="scene2-hidden" />

            <!-- 轨迹 2 (t=2T/3 进入): 蓝色 -->
            <!-- 第一段 (0~T/3): 向上弯曲抛物线，从 (50,200) 到约 (217,175) -->
            <path id="scene2-trail2-seg1" d="M 50,200 Q 133,187 217,175" fill="none" stroke="#1565c0" stroke-width="2.5" class="scene2-hidden" />
            <!-- 第二段 (T/3~T): 向下弯曲抛物线，从 (217,175) 到 (550,175) -->
            <path id="scene2-trail2-seg2" d="M 217,175 Q 383,175 550,175" fill="none" stroke="#1565c0" stroke-width="2.5" class="scene2-hidden" />

            <!-- 加速度箭头 (绿色) -->
            <g id="scene2-arrow-a1" class="scene2-hidden">
                <line x1="217" y1="190" x2="217" y2="215" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene2-arrowhead-green)" />
                <text x="225" y="210" font-size="10" fill="#2e7d32">a</text>
            </g>

            <g id="scene2-arrow-a2" class="scene2-hidden">
                <line x1="467" y1="245" x2="467" y2="220" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene2-arrowhead-green)" />
                <text x="225" y="210" font-size="10" fill="#2e7d32">a</text>
            </g>

            <g id="scene2-arrow-a3" class="scene2-hidden">
                <line x1="133" y1="190" x2="133" y2="165" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene2-arrowhead-green)" />
                <text x="141" y="175" font-size="10" fill="#2e7d32">a</text>
            </g>

            <g id="scene2-arrow-a4" class="scene2-hidden">
                <line x1="383" y1="165" x2="383" y2="190" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene2-arrowhead-green)" />
                <text x="391" y="185" font-size="10" fill="#2e7d32">a</text>
            </g>

            <!-- 速度矢量箭头 (蓝色) -->
            <g id="scene2-arrow-v1" class="scene2-hidden">
                <line x1="383" y1="230" x2="400" y2="232" stroke="#1565c0" stroke-width="2" marker-end="url(#scene2-arrowhead-blue)" />
            </g>

            <g id="scene2-arrow-v2" class="scene2-hidden">
                <line x1="217" y1="175" x2="234" y2="175" stroke="#1565c0" stroke-width="2" marker-end="url(#scene2-arrowhead-blue)" />
            </g>

            <!-- y₁ 标注线: (568,200)-(568,235) -->
            <g id="scene2-label-y1-group" class="scene2-hidden">
                <line x1="568" y1="200" x2="568" y2="235" stroke="#c62828" stroke-width="1.5" />
                <line x1="565" y1="200" x2="571" y2="200" stroke="#c62828" stroke-width="1.5" />
                <line x1="565" y1="235" x2="571" y2="235" stroke="#c62828" stroke-width="1.5" />
                <text x="575" y="222" font-size="12" fill="#c62828" font-weight="bold">y<tspan baseline-shift="sub" font-size="10">1</tspan></text>
            </g>

            <!-- y₂ 标注线: (578,200)-(578,175) -->
            <g id="scene2-label-y2-group" class="scene2-hidden">
                <line x1="578" y1="200" x2="578" y2="175" stroke="#1565c0" stroke-width="1.5" />
                <line x1="575" y1="200" x2="581" y2="200" stroke="#1565c0" stroke-width="1.5" />
                <line x1="575" y1="175" x2="581" y2="175" stroke="#1565c0" stroke-width="1.5" />
                <text x="585" y="192" font-size="12" fill="#1565c0" font-weight="bold">y<tspan baseline-shift="sub" font-size="10">2</tspan></text>
            </g>

            <!-- 标签 -->
            <text id="scene2-label-t0" x="200" y="160" font-size="12" fill="#c62828" class="scene2-hidden">t=0 进入</text>
            <text id="scene2-label-t23" x="200" y="250" font-size="12" fill="#1565c0" class="scene2-hidden">t=2T/3 进入</text>

            <!-- 终点标记 -->
            <circle id="scene2-endpoint1" cx="550" cy="235" r="5" fill="#c62828" class="scene2-hidden" />
            <circle id="scene2-endpoint2" cx="550" cy="175" r="5" fill="#1565c0" class="scene2-hidden" />

            <!-- 位移双向箭头 -->
            <g id="scene2-displacement-arrows" class="scene2-hidden">
                <line x1="568" y1="200" x2="568" y2="235" stroke="#c62828" stroke-width="1" marker-start="url(#scene2-arrowhead-red)" marker-end="url(#scene2-arrowhead-red)" />
                <line x1="578" y1="200" x2="578" y2="175" stroke="#1565c0" stroke-width="1" marker-start="url(#scene2-arrowhead-red)" marker-end="url(#scene2-arrowhead-red)" />
            </g>

            <!-- 时间轴: y=380 -->
            <line id="scene2-timeline" x1="100" y1="380" x2="700" y2="380" stroke="#000" stroke-width="2" />
            <text x="95" y="400" font-size="12">0</text>
            <text x="295" y="400" font-size="12">2T/3</text>
            <text x="395" y="400" font-size="12">T</text>
            <text x="495" y="400" font-size="12">5T/3</text>
            <text x="595" y="400" font-size="12">2T</text>
            <text x="710" y="380" font-size="12" font-style="italic">t</text>

            <!-- 时间轴刻度 -->
            <line x1="100" y1="375" x2="100" y2="385" stroke="#000" stroke-width="1" />
            <line x1="300" y1="375" x2="300" y2="385" stroke="#000" stroke-width="1" />
            <line x1="400" y1="375" x2="400" y2="385" stroke="#000" stroke-width="1" />
            <line x1="500" y1="375" x2="500" y2="385" stroke="#000" stroke-width="1" />
            <line x1="600" y1="375" x2="600" y2="385" stroke="#000" stroke-width="1" />

            <!-- 电压波形: 方波 -->
            <g id="scene2-voltage-wave">
                <!-- 正向电压 (红色区域) -->
                <rect x="100" y="390" width="200" height="30" fill="#ffcdd2" stroke="#c62828" stroke-width="1" />
                <text x="190" y="410" font-size="11" fill="#c62828">U<tspan baseline-shift="sub" font-size="9">0</tspan></text>
                
                <!-- 负向电压 (蓝色区域) -->
                <rect x="300" y="420" width="100" height="30" fill="#bbdefb" stroke="#1565c0" stroke-width="1" />
                <text x="340" y="440" font-size="11" fill="#1565c0">-U<tspan baseline-shift="sub" font-size="9">0</tspan></text>
                
                <!-- 正向电压 -->
                <rect x="400" y="390" width="200" height="30" fill="#ffcdd2" stroke="#c62828" stroke-width="1" />
                <text x="490" y="410" font-size="11" fill="#c62828">U<tspan baseline-shift="sub" font-size="9">0</tspan></text>
                
                <!-- 负向电压 -->
                <rect x="600" y="420" width="100" height="30" fill="#bbdefb" stroke="#1565c0" stroke-width="1" />
                <text x="640" y="440" font-size="11" fill="#1565c0">-U<tspan baseline-shift="sub" font-size="9">0</tspan></text>

                <!-- 波形轮廓线 -->
                <polyline points="100,405 300,405 300,435 400,435 400,405 600,405 600,435 700,435" fill="none" stroke="#000" stroke-width="1.5" />
            </g>

            <!-- 时间轴高亮标记 -->
            <g id="scene2-time-highlight" class="scene2-hidden">
                <circle cx="300" cy="380" r="4" fill="#ff9800" />
                <circle cx="400" cy="380" r="4" fill="#ff9800" />
            </g>
        </svg>

        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-btn-prev" disabled>◀ 上一步</button>
            <span id="scene2-state-indicator">步骤 0/5</span>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2 实现：两种极端情况下粒子的偏转轨迹对比分析

        // 状态定义
        const states = {
            0: { show: ['plate-a', 'plate-b', 'target', 'axis', 'point-o', 'point-oprime', 'timeline', 'voltage-wave'] },
            1: { show: ['plate-a', 'plate-b', 'target', 'axis', 'point-o', 'point-oprime', 'timeline', 'voltage-wave', 'trail1-seg1', 'arrow-a1', 'label-t0'] },
            2: { show: ['plate-a', 'plate-b', 'target', 'axis', 'point-o', 'point-oprime', 'timeline', 'voltage-wave', 'trail1-seg1', 'trail1-seg2', 'arrow-a2', 'label-t0', 'label-y1-group', 'arrow-v1'] },
            3: { show: ['plate-a', 'plate-b', 'target', 'axis', 'point-o', 'point-oprime', 'timeline', 'voltage-wave', 'trail1-seg1', 'trail1-seg2', 'arrow-a2', 'label-t0', 'label-y1-group', 'arrow-v1', 'trail2-seg1', 'arrow-a3', 'label-t23'] },
            4: { show: ['plate-a', 'plate-b', 'target', 'axis', 'point-o', 'point-oprime', 'timeline', 'voltage-wave', 'trail1-seg1', 'trail1-seg2', 'arrow-a2', 'label-t0', 'label-y1-group', 'arrow-v1', 'trail2-seg1', 'trail2-seg2', 'arrow-a4', 'label-t23', 'label-y2-group', 'arrow-v2'] },
            5: { show: ['plate-a', 'plate-b', 'target', 'axis', 'point-o', 'point-oprime', 'timeline', 'voltage-wave', 'trail1-seg1', 'trail1-seg2', 'arrow-a2', 'label-t0', 'label-y1-group', 'arrow-v1', 'trail2-seg1', 'trail2-seg2', 'arrow-a4', 'label-t23', 'label-y2-group', 'arrow-v2', 'endpoint1', 'endpoint2', 'displacement-arrows', 'time-highlight'] }
        };

        let currentState = 0;

        // 工具函数：显示元素
        function showElement(id) {
            const el = document.getElementById('scene2-' + id);
            if (el) {
                el.classList.remove('scene2-hidden');
                el.classList.add('scene2-visible');
            }
        }

        // 工具函数：隐藏元素
        function hideElement(id) {
            const el = document.getElementById('scene2-' + id);
            if (el) {
                el.classList.remove('scene2-visible');
                el.classList.add('scene2-hidden');
            }
        }

        // 更新状态显示
        function updateState() {
            const state = states[currentState];
            
            // 隐藏所有可切换元素
            const allElements = ['trail1-seg1', 'trail1-seg2', 'trail2-seg1', 'trail2-seg2', 
                'arrow-a1', 'arrow-a2', 'arrow-a3', 'arrow-a4', 
                'arrow-v1', 'arrow-v2',
                'label-t0', 'label-t23', 'label-y1-group', 'label-y2-group',
                'endpoint1', 'endpoint2', 'displacement-arrows', 'time-highlight'];
            
            allElements.forEach(id => hideElement(id));

            // 显示当前状态需要的元素
            state.show.forEach(id => showElement(id));

            // 更新按钮状态
            const btnPrev = document.getElementById('scene2-btn-prev');
            const btnNext = document.getElementById('scene2-btn-next');
            const indicator = document.getElementById('scene2-state-indicator');

            btnPrev.disabled = (currentState === 0);
            btnNext.disabled = (currentState === 5);
            indicator.textContent = '步骤 ' + currentState + '/5';
        }

        // 按钮事件绑定
        document.getElementById('scene2-btn-prev').addEventListener('click', function() {
            if (currentState > 0) {
                currentState--;
                updateState();
            }
        });

        document.getElementById('scene2-btn-next').addEventListener('click', function() {
            if (currentState < 5) {
                currentState++;
                updateState();
            }
        });

        // 初始化
        updateState();
    })();
    </script>
</body>
</html>
