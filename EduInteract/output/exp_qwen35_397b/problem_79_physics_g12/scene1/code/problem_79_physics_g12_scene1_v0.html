<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>板块系统受力分析</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }
        .scene1-btn {
            width: 80px;
            height: 30px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: opacity 0.3s, background-color 0.3s;
        }
        .scene1-btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
            opacity: 0.6;
        }
        .scene1-btn-prev {
            background-color: #9e9e9e;
            color: white;
        }
        .scene1-btn-next {
            background-color: #1565c0;
            color: white;
        }
        .scene1-btn-next:disabled {
            background-color: #cccccc;
        }
        #scene1-step-indicator {
            font-size: 14px;
            color: #333;
            min-width: 60px;
            text-align: center;
        }
        /* 元素显隐控制 */
        .scene1-force-element {
            opacity: 0;
            display: none;
            transition: opacity 0.3s ease;
        }
        .scene1-force-element.visible {
            opacity: 1;
            display: block;
        }
        .scene1-force-group {
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .scene1-force-group.visible {
            opacity: 1;
        }
        /* 高亮效果 */
        .scene1-highlight-m {
            stroke: #ff9800 !important;
            stroke-width: 3px !important;
        }
        .scene1-highlight-M {
            stroke: #ff9800 !important;
            stroke-width: 3px !important;
        }
        .scene1-highlight-f {
            stroke-width: 3px !important;
        }
        .scene1-highlight-circle {
            fill: none;
            stroke: #ff9800;
            stroke-width: 2px;
            stroke-dasharray: 5, 5;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .scene1-highlight-circle.visible {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#333333" />
                </marker>
                <marker id="scene1-arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#c62828" />
                </marker>
                <marker id="scene1-arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#2e7d32" />
                </marker>
                <marker id="scene1-arrowhead-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#1565c0" />
                </marker>
                <!-- 斜线阴影图案 -->
                <pattern id="scene1-hatch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
                    <line x1="0" y1="0" x2="0" y2="10" stroke="#888888" stroke-width="1" />
                </pattern>
            </defs>

            <!-- 地面（带斜线阴影） -->
            <rect id="scene1-ground-shadow" x="100" y="400" width="600" height="20" fill="url(#scene1-hatch)" />
            <line id="scene1-ground-line" x1="100" y1="400" x2="700" y2="400" stroke="#333333" stroke-width="2" />

            <!-- 木板 M -->
            <rect id="scene1-board-M" x="150" y="340" width="500" height="60" 
                  fill="#e3f2fd" fill-opacity="0.2" stroke="#000000" stroke-width="2" />

            <!-- 物块 m -->
            <rect id="scene1-block-m" x="580" y="290" width="70" height="50" 
                  fill="#fff3e0" fill-opacity="0.2" stroke="#000000" stroke-width="2" />

            <!-- 标签 M 和 m -->
            <text id="scene1-label-M" x="380" y="375" font-size="16px" font-weight="bold" text-anchor="middle" fill="#000000">M</text>
            <text id="scene1-label-m" x="615" y="320" font-size="16px" font-weight="bold" text-anchor="middle" fill="#000000">m</text>

            <!-- 长度 L 标注 -->
            <line id="scene1-L-line" x1="150" y1="420" x2="650" y2="420" stroke="#333333" stroke-width="1" />
            <!-- 双向箭头端点 -->
            <line id="scene1-L-arrow-left" x1="150" y1="415" x2="150" y2="425" stroke="#333333" stroke-width="1" />
            <line id="scene1-L-arrow-right" x1="650" y1="415" x2="650" y2="425" stroke="#333333" stroke-width="1" />
            <text id="scene1-label-L" x="400" y="440" font-size="14px" font-style="italic" text-anchor="middle" fill="#333333">L</text>

            <!-- 拉力 F 箭头 -->
            <line id="scene1-arrow-F" x1="650" y1="370" x2="720" y2="370" 
                  stroke="#1565c0" stroke-width="3" marker-end="url(#scene1-arrowhead-blue)" />
            <text id="scene1-label-F" x="730" y="375" font-size="16px" font-weight="bold" fill="#1565c0">F</text>

            <!-- ========== m 的受力分析（步骤 1 显示） ========== -->
            <g id="scene1-forces-m" class="scene1-force-group">
                <!-- m 重力 mg -->
                <line id="scene1-arrow-mg" x1="615" y1="315" x2="615" y2="380" 
                      stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrowhead-red)" />
                <text id="scene1-label-mg" x="625" y="355" font-size="14px" fill="#c62828">mg</text>

                <!-- m 支持力 N₁ -->
                <line id="scene1-arrow-N1" x1="615" y1="315" x2="615" y2="260" 
                      stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrowhead-red)" />
                <text id="scene1-label-N1" x="625" y="275" font-size="14px" fill="#c62828">N₁</text>

                <!-- m 摩擦力 f -->
                <line id="scene1-arrow-f" x1="615" y1="315" x2="680" y2="315" 
                      stroke="#2e7d32" stroke-width="2" marker-end="url(#scene1-arrowhead-green)" />
                <text id="scene1-label-f" x="650" y="295" font-size="14px" fill="#2e7d32">f</text>
            </g>

            <!-- ========== M 的受力分析（步骤 2 显示） ========== -->
            <g id="scene1-forces-M" class="scene1-force-group">
                <!-- M 重力 Mg -->
                <line id="scene1-arrow-Mg" x1="400" y1="370" x2="400" y2="430" 
                      stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrowhead-red)" />
                <text id="scene1-label-Mg" x="420" y="410" font-size="14px" fill="#c62828">Mg</text>

                <!-- M 支持力 N₂ -->
                <line id="scene1-arrow-N2" x1="400" y1="340" x2="400" y2="270" 
                      stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrowhead-red)" />
                <text id="scene1-label-N2" x="420" y="290" font-size="14px" fill="#c62828">N₂</text>

                <!-- M 摩擦力 f' -->
                <line id="scene1-arrow-fp" x1="615" y1="340" x2="550" y2="340" 
                      stroke="#2e7d32" stroke-width="2" marker-end="url(#scene1-arrowhead-green)" />
                <text id="scene1-label-fp" x="575" y="320" font-size="14px" fill="#2e7d32">f'</text>
            </g>

            <!-- ========== 作用力对高亮圈（步骤 3 显示） ========== -->
            <circle id="scene1-highlight-circle-f" class="scene1-highlight-circle" 
                    cx="650" cy="315" r="25" />
            <circle id="scene1-highlight-circle-fp" class="scene1-highlight-circle" 
                    cx="580" cy="340" r="25" />
            <text id="scene1-label-action-reaction" x="615" y="240" 
                  font-size="12px" fill="#ff9800" text-anchor="middle" 
                  class="scene1-force-element">作用力与反作用力</text>

            <!-- 控件栏背景 -->
            <rect id="scene1-controls-bg" x="200" y="455" width="400" height="35" 
                  fill="#f5f5f5" fill-opacity="0.8" rx="5" />
        </svg>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn scene1-btn-prev" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/4</span>
            <button id="scene1-btn-next" class="scene1-btn scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现：板块系统受力分析

        // 状态变量
        let currentStep = 0;
        const totalSteps = 4;

        // DOM 元素引用
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        const forcesM = document.getElementById('scene1-forces-m');
        const forcesMGroup = document.getElementById('scene1-forces-M');
        const highlightCircleF = document.getElementById('scene1-highlight-circle-f');
        const highlightCircleFp = document.getElementById('scene1-highlight-circle-fp');
        const labelActionReaction = document.getElementById('scene1-label-action-reaction');
        const blockM = document.getElementById('scene1-block-m');
        const boardM = document.getElementById('scene1-board-M');
        const arrowF = document.getElementById('scene1-arrow-f');
        const arrowFp = document.getElementById('scene1-arrow-fp');

        // 工具函数：显示元素
        function showElement(el) {
            if (el) {
                el.classList.add('visible');
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }

        // 工具函数：隐藏元素
        function hideElement(el) {
            if (el) {
                el.classList.remove('visible');
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }

        // 更新步骤显示
        function updateStep() {
            // 更新步骤指示器
            stepIndicator.textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;

            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps - 1);

            // 重置所有高亮
            blockM.classList.remove('scene1-highlight-m');
            boardM.classList.remove('scene1-highlight-M');
            arrowF.classList.remove('scene1-highlight-f');
            arrowFp.classList.remove('scene1-highlight-f');
            hideElement(highlightCircleF);
            hideElement(highlightCircleFp);
            hideElement(labelActionReaction);

            // 根据步骤显示不同内容
            switch (currentStep) {
                case 0:
                    // 初始状态：只显示题目原图
                    hideElement(forcesM);
                    hideElement(forcesMGroup);
                    break;

                case 1:
                    // 步骤 1：显示 m 的受力分析
                    showElement(forcesM);
                    hideElement(forcesMGroup);
                    blockM.classList.add('scene1-highlight-m');
                    break;

                case 2:
                    // 步骤 2：显示 M 的受力分析
                    hideElement(forcesM);
                    showElement(forcesMGroup);
                    boardM.classList.add('scene1-highlight-M');
                    break;

                case 3:
                    // 步骤 3：显示所有受力，高亮 f 和 f'
                    showElement(forcesM);
                    showElement(forcesMGroup);
                    arrowF.classList.add('scene1-highlight-f');
                    arrowFp.classList.add('scene1-highlight-f');
                    showElement(highlightCircleF);
                    showElement(highlightCircleFp);
                    showElement(labelActionReaction);
                    break;
            }
        }

        // 事件处理：上一步
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });

        // 事件处理：下一步
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateStep();
            }
        });

        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
