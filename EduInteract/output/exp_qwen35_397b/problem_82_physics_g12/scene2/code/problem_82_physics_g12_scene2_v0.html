<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三阶段能量变化对比分析</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-svg { width: 800px; height: 500px; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene2-btn { padding: 8px 16px; font-size: 14px; border: none; border-radius: 4px; cursor: pointer; transition: opacity 0.2s; }
        .scene2-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene2-btn-prev { background: #1565c0; color: white; }
        .scene2-btn-next { background: #1565c0; color: white; }
        .scene2-hidden { display: none; }
        .scene2-bar-label { font-size: 12px; fill: #000000; }
        .scene2-title { font-size: 14px; font-weight: bold; fill: #000000; }
        .scene2-equation { font-size: 13px; fill: #000000; }
        .scene2-step-indicator { font-size: 14px; fill: #000000; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 汇总标题（仅步骤 3 显示） -->
            <text id="scene2-summary-title" x="400" y="35" text-anchor="middle" class="scene2-title scene2-hidden" style="font-size: 16px;">三阶段能量对比</text>

            <!-- ========== 阶段 1 元素 ========== -->
            <g id="scene2-stage1-group">
                <!-- 阶段 1 标题 -->
                <text x="175" y="60" text-anchor="middle" class="scene2-title">阶段 1</text>
                
                <!-- 阶段 1 基线 -->
                <line x1="120" y1="150" x2="230" y2="150" stroke="#888888" stroke-width="2"/>
                
                <!-- 阶段 1 ΔEp 减：3mgL，红色向下，高度 180px (1mgL=60px) -->
                <rect id="scene2-bar-p1-dec" x="130" y="150" width="20" height="180" fill="#c62828"/>
                <text x="140" y="245" text-anchor="middle" class="scene2-bar-label">3mgL</text>
                
                <!-- 阶段 1 ΔEp 增：1.5mgL，绿色向上，高度 90px -->
                <rect id="scene2-bar-p1-inc" x="160" y="60" width="20" height="90" fill="#2e7d32"/>
                <text x="170" y="55" text-anchor="middle" class="scene2-bar-label">1.5mgL</text>
                
                <!-- 阶段 1 ΔEk：1.5mgL，蓝色 -->
                <rect id="scene2-bar-p1-kek" x="190" y="110" width="30" height="20" fill="#1565c0"/>
                <text x="205" y="105" text-anchor="middle" class="scene2-bar-label">1.5mgL</text>
                
                <!-- 阶段 1 方程框 -->
                <rect id="scene2-eq1-bg" x="80" y="320" width="190" height="70" fill="#ffffff" stroke="#000000" stroke-width="1"/>
                <foreignObject id="scene2-eq1" x="85" y="335" width="180" height="50">
                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:12px;text-align:center;">
                        $$3mgL = 1.5mgL + \frac{1}{2}(6m)v_1^2$$
                    </div>
                </foreignObject>
            </g>

            <!-- ========== 阶段 2 元素（初始隐藏） ========== -->
            <g id="scene2-stage2-group" class="scene2-hidden">
                <!-- 阶段 2 标题 -->
                <text x="375" y="60" text-anchor="middle" class="scene2-title">阶段 2</text>
                
                <!-- 阶段 2 基线 -->
                <line x1="320" y1="150" x2="430" y2="150" stroke="#888888" stroke-width="2"/>
                
                <!-- 阶段 2 ΔEp 减：2mgL，红色向下，高度 120px -->
                <rect id="scene2-bar-p2-dec" x="330" y="150" width="20" height="120" fill="#c62828"/>
                <text x="340" y="285" text-anchor="middle" class="scene2-bar-label">2mgL</text>
                
                <!-- 阶段 2 ΔEp 增：0.5mgL，绿色向上，高度 30px -->
                <rect id="scene2-bar-p2-inc" x="360" y="120" width="20" height="30" fill="#2e7d32"/>
                <text x="370" y="115" text-anchor="middle" class="scene2-bar-label">0.5mgL</text>
                
                <!-- 阶段 2 ΔEk：1.5mgL，蓝色 -->
                <rect id="scene2-bar-p2-kek" x="390" y="120" width="30" height="20" fill="#1565c0"/>
                <text x="405" y="115" text-anchor="middle" class="scene2-bar-label">1.5mgL</text>
                
                <!-- 阶段 2 方程框 -->
                <rect id="scene2-eq2-bg" x="285" y="320" width="190" height="70" fill="#ffffff" stroke="#000000" stroke-width="1"/>
                <foreignObject id="scene2-eq2" x="290" y="335" width="180" height="50">
                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:12px;text-align:center;">
                        $$2mgL = 0.5mgL + \frac{1}{2}(3m)(v_2^2-v_1^2)$$
                    </div>
                </foreignObject>
            </g>

            <!-- ========== 阶段 3 元素（初始隐藏） ========== -->
            <g id="scene2-stage3-group" class="scene2-hidden">
                <!-- 阶段 3 标题 -->
                <text x="575" y="60" text-anchor="middle" class="scene2-title">阶段 3</text>
                
                <!-- 阶段 3 基线 -->
                <line x1="520" y1="150" x2="630" y2="150" stroke="#888888" stroke-width="2"/>
                
                <!-- 阶段 3 ΔEp 减：mgL，红色向下，高度 60px -->
                <rect id="scene2-bar-p3-dec" x="530" y="150" width="20" height="60" fill="#c62828"/>
                <text x="540" y="225" text-anchor="middle" class="scene2-bar-label">mgL</text>
                
                <!-- 阶段 3 ΔEp 增：无（隐藏） -->
                
                <!-- 阶段 3 ΔEk：mgL，蓝色 -->
                <rect id="scene2-bar-p3-kek" x="570" y="130" width="30" height="20" fill="#1565c0"/>
                <text x="585" y="125" text-anchor="middle" class="scene2-bar-label">mgL</text>
                
                <!-- 阶段 3 方程框 -->
                <rect id="scene2-eq3-bg" x="490" y="320" width="190" height="70" fill="#ffffff" stroke="#000000" stroke-width="1"/>
                <foreignObject id="scene2-eq3" x="495" y="335" width="180" height="50">
                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:12px;text-align:center;">
                        $$mgL = \frac{1}{2}m(v_3^2-v_2^2)$$
                    </div>
                </foreignObject>
            </g>

            <!-- ========== 能量流动箭头（仅步骤 3 显示） ========== -->
            <g id="scene2-arrows-group" class="scene2-hidden">
                <!-- 箭头 1：阶段 1 → 阶段 2 -->
                <path d="M 240 180 L 260 180 M 255 175 L 260 180 L 255 185" stroke="#888888" stroke-width="2" fill="none"/>
                <!-- 箭头 2：阶段 2 → 阶段 3 -->
                <path d="M 440 180 L 460 180 M 455 175 L 460 180 L 455 185" stroke="#888888" stroke-width="2" fill="none"/>
            </g>

            <!-- ========== 控件栏（始终显示） ========== -->
            <!-- 上一步按钮 -->
            <rect id="scene2-btn-prev-bg" x="280" y="450" width="80" height="30" fill="#1565c0" rx="4"/>
            <text id="scene2-btn-prev-text" x="320" y="470" text-anchor="middle" fill="#ffffff" font-size="14">◀上一步</text>
            
            <!-- 步骤指示器 -->
            <text id="scene2-step-indicator" x="400" y="470" text-anchor="middle" class="scene2-step-indicator">1/4</text>
            
            <!-- 下一步按钮 -->
            <rect id="scene2-btn-next-bg" x="440" y="450" width="80" height="30" fill="#1565c0" rx="4"/>
            <text id="scene2-btn-next-text" x="480" y="470" text-anchor="middle" fill="#ffffff" font-size="14">下一步▶</text>
        </svg>

        <div id="scene2-controls">
            <button id="scene2-btn-prev" class="scene2-btn scene2-btn-prev" disabled>◀ 上一步</button>
            <button id="scene2-btn-next" class="scene2-btn scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2 实现：三阶段能量变化对比分析
        
        // 状态变量
        let currentStep = 0; // 0: 阶段 1, 1: 阶段 2, 2: 阶段 3, 3: 汇总
        const totalSteps = 4;

        // DOM 元素引用
        const stage1Group = document.getElementById('scene2-stage1-group');
        const stage2Group = document.getElementById('scene2-stage2-group');
        const stage3Group = document.getElementById('scene2-stage3-group');
        const arrowsGroup = document.getElementById('scene2-arrows-group');
        const summaryTitle = document.getElementById('scene2-summary-title');
        const stepIndicator = document.getElementById('scene2-step-indicator');
        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        const btnPrevBg = document.getElementById('scene2-btn-prev-bg');
        const btnNextBg = document.getElementById('scene2-btn-next-bg');
        const btnPrevText = document.getElementById('scene2-btn-prev-text');
        const btnNextText = document.getElementById('scene2-btn-next-text');

        // 更新显示状态
        function updateDisplay() {
            // 隐藏所有阶段
            stage1Group.classList.add('scene2-hidden');
            stage2Group.classList.add('scene2-hidden');
            stage3Group.classList.add('scene2-hidden');
            arrowsGroup.classList.add('scene2-hidden');
            summaryTitle.classList.add('scene2-hidden');

            // 根据当前步骤显示对应内容
            if (currentStep === 0) {
                // 步骤 0：阶段 1
                stage1Group.classList.remove('scene2-hidden');
            } else if (currentStep === 1) {
                // 步骤 1：阶段 2
                stage2Group.classList.remove('scene2-hidden');
            } else if (currentStep === 2) {
                // 步骤 2：阶段 3
                stage3Group.classList.remove('scene2-hidden');
            } else if (currentStep === 3) {
                // 步骤 3：汇总
                stage1Group.classList.remove('scene2-hidden');
                stage2Group.classList.remove('scene2-hidden');
                stage3Group.classList.remove('scene2-hidden');
                arrowsGroup.classList.remove('scene2-hidden');
                summaryTitle.classList.remove('scene2-hidden');
            }

            // 更新步骤指示器
            stepIndicator.textContent = (currentStep + 1) + '/' + totalSteps;

            // 更新按钮状态
            if (currentStep === 0) {
                btnPrev.disabled = true;
                btnPrevBg.setAttribute('fill', '#888888');
                btnPrevText.setAttribute('fill', '#cccccc');
            } else {
                btnPrev.disabled = false;
                btnPrevBg.setAttribute('fill', '#1565c0');
                btnPrevText.setAttribute('fill', '#ffffff');
            }

            if (currentStep === totalSteps - 1) {
                btnNext.disabled = true;
                btnNextBg.setAttribute('fill', '#888888');
                btnNextText.setAttribute('fill', '#cccccc');
            } else {
                btnNext.disabled = false;
                btnNextBg.setAttribute('fill', '#1565c0');
                btnNextText.setAttribute('fill', '#ffffff');
            }

            // 触发 MathJax 重新渲染
            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }

        // 按钮点击事件
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateDisplay();
            }
        });

        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
