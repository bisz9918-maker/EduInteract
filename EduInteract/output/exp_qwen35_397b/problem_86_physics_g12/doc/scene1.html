<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>带电粒子在平行板电容器中的运动</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }
        .scene1-btn {
            width: 100px;
            height: 32px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }
        #scene1-prev-btn {
            background: #f5f5f5;
            color: #333;
            border: 1px solid #ddd;
        }
        #scene1-prev-btn:hover:not(:disabled) {
            background: #e0e0e0;
        }
        #scene1-next-btn {
            background: #1565c0;
            color: white;
        }
        #scene1-next-btn:hover:not(:disabled) {
            background: #0d47a1;
        }
        #scene1-prev-btn:disabled,
        #scene1-next-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #scene1-step-indicator {
            font-size: 14px;
            color: #666;
            min-width: 80px;
            text-align: center;
        }
        /* 元素显隐控制 */
        .scene1-hidden {
            display: none;
            opacity: 0;
        }
        .scene1-visible {
            display: block;
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义箭头 marker -->
            <defs>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32"/>
                </marker>
                <marker id="scene1-arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0"/>
                </marker>
                <marker id="scene1-arrowhead-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#888888"/>
                </marker>
            </defs>

            <!-- ========== 步骤 0：电容器结构、尺寸标注、标签 A 和 B、粒子图标 ========== -->
            
            <!-- B 板（上极板） -->
            <line id="scene1-plate-b" x1="180" y1="180" x2="680" y2="180" stroke="#000000" stroke-width="3"/>
            
            <!-- A 板（下极板） -->
            <line id="scene1-plate-a" x1="180" y1="320" x2="680" y2="320" stroke="#000000" stroke-width="3"/>
            
            <!-- 接地符号 -->
            <path id="scene1-ground" d="M 180,180 L 160,180 M 150,190 L 170,190 M 145,200 L 175,200 M 140,210 L 180,210" 
                  stroke="#000000" stroke-width="2" fill="none"/>
            
            <!-- L 尺寸标注线（上方） -->
            <line id="scene1-dim-l-line" x1="180" y1="150" x2="680" y2="150" stroke="#888888" stroke-width="1.5"/>
            <line id="scene1-dim-l-left" x1="180" y1="145" x2="180" y2="155" stroke="#888888" stroke-width="1.5"/>
            <line id="scene1-dim-l-right" x1="680" y1="145" x2="680" y2="155" stroke="#888888" stroke-width="1.5"/>
            
            <!-- d 尺寸标注线（右侧） -->
            <line id="scene1-dim-d-line" x1="700" y1="180" x2="700" y2="320" stroke="#888888" stroke-width="1.5"/>
            <line id="scene1-dim-d-top" x1="695" y1="180" x2="705" y2="180" stroke="#888888" stroke-width="1.5"/>
            <line id="scene1-dim-d-bottom" x1="695" y1="320" x2="705" y2="320" stroke="#888888" stroke-width="1.5"/>
            
            <!-- 标签 L=0.1m -->
            <text id="scene1-label-l" x="430" y="135" font-size="13" fill="#000000" text-anchor="middle">L=0.1m</text>
            
            <!-- 标签 d=0.4cm -->
            <text id="scene1-label-d" x="715" y="250" font-size="13" fill="#000000" text-anchor="middle">d=0.4cm</text>
            
            <!-- 标签 A -->
            <text id="scene1-label-a" x="170" y="345" font-size="14" fill="#000000" text-anchor="middle">A</text>
            
            <!-- 标签 B -->
            <text id="scene1-label-b" x="170" y="165" font-size="14" fill="#000000" text-anchor="middle">B</text>
            
            <!-- 粒子图标（绿色圆圈带+号） -->
            <g id="scene1-particle-group">
                <circle cx="145" cy="250" r="8" fill="#2e7d32" opacity="0.2" stroke="#2e7d32" stroke-width="1.5"/>
                <text x="145" y="254" font-size="14" fill="#2e7d32" text-anchor="middle" font-weight="bold">+</text>
            </g>
            
            <!-- 标签 m,q -->
            <text id="scene1-label-mq" x="125" y="270" font-size="12" fill="#000000" text-anchor="middle">m,q</text>

            <!-- ========== 步骤 1：入射点 P、v₀ 速度箭头及标签 ========== -->
            
            <!-- 入射点 P -->
            <circle id="scene1-entry-point" class="scene1-hidden" cx="160" cy="250" r="4" fill="#2e7d32"/>
            
            <!-- v₀ 速度箭头 -->
            <g id="scene1-velocity-group" class="scene1-hidden">
                <line x1="160" y1="250" x2="210" y2="250" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene1-arrowhead)"/>
                <text x="185" y="240" font-size="14" fill="#2e7d32" text-anchor="middle" font-style="italic">v₀</text>
            </g>

            <!-- ========== 步骤 2：运动轨迹、落点 O 及标签 ========== -->
            
            <!-- 运动轨迹（蓝色虚线抛物线） -->
            <path id="scene1-trajectory" class="scene1-hidden" d="M 160,250 Q 295,270 430,320" 
                  stroke="#1565c0" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
            
            <!-- 落点 O -->
            <circle id="scene1-landing-point" class="scene1-hidden" cx="430" cy="320" r="5" fill="#c62828"/>
            
            <!-- 标签 O -->
            <text id="scene1-label-o" class="scene1-hidden" x="430" y="340" font-size="14" fill="#000000" text-anchor="middle">O</text>

            <!-- ========== 步骤 3：d/2 和 L/2 位移标注 ========== -->
            
            <!-- d/2 竖直位移标注（左侧蓝色双箭头） -->
            <g id="scene1-displacement-vertical" class="scene1-hidden">
                <line x1="140" y1="250" x2="140" y2="320" stroke="#1565c0" stroke-width="1.5" marker-start="url(#scene1-arrowhead-blue)" marker-end="url(#scene1-arrowhead-blue)"/>
                <text x="120" y="290" font-size="13" fill="#1565c0" text-anchor="middle">d/2</text>
            </g>
            
            <!-- L/2 水平位移标注（下方蓝色双箭头） -->
            <g id="scene1-displacement-horizontal" class="scene1-hidden">
                <line x1="180" y1="345" x2="430" y2="345" stroke="#1565c0" stroke-width="1.5" marker-start="url(#scene1-arrowhead-blue)" marker-end="url(#scene1-arrowhead-blue)"/>
                <text x="305" y="365" font-size="13" fill="#1565c0" text-anchor="middle">L/2</text>
            </g>

            <!-- ========== 步骤 4：公式框 ========== -->
            
            <g id="scene1-formula-box" class="scene1-hidden">
                <rect x="500" y="380" width="280" height="90" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5" rx="5"/>
                <text x="515" y="405" font-size="13" fill="#1565c0" font-weight="bold">运动学公式：</text>
                <text x="515" y="430" font-size="12" fill="#000000">水平方向：L/2 = v₀·t</text>
                <text x="515" y="455" font-size="12" fill="#000000">竖直方向：d/2 = ½·g·t²</text>
            </g>

            <!-- 控件栏（放在 SVG 内部底部） -->
            <g id="scene1-controls-svg">
                <rect x="310" y="455" width="180" height="40" fill="white" stroke="#ddd" stroke-width="1" rx="5"/>
            </g>
        </svg>
        
        <!-- HTML 控件栏（叠在 SVG 底部） -->
        <div id="scene1-controls">
            <button id="scene1-prev-btn" class="scene1-btn" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 0/4</span>
            <button id="scene1-next-btn" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现：不带电时带电粒子的类平抛运动轨迹
        
        // 布局坐标表（实现对照依据）：
        // | 元素 | 位置/范围 | 备注 |
        // | B 板 | (180,180)-(680,180) | 黑色实线 |
        // | A 板 | (180,320)-(680,320) | 黑色实线 |
        // | 接地符号 | (160,180) 向下 | B 板左侧 |
        // | 入射点 P | (160,250), r=4 | 绿色 |
        // | 落点 O | (430,320), r=5 | 红色 |
        // | 运动轨迹 | (160,250)→(430,320) | 蓝色虚线 |
        // | v₀ 箭头 | (160,250) 向右 50px | 绿色 |
        // | L 标注 | (180,150)-(680,150) | 上方 |
        // | d 标注 | (700,180)-(700,320) | 右侧 |
        // | 粒子图标 | (145,250), 16×16 | 绿色带+ |
        // | d/2 标注 | (140,250)-(140,320) | 左侧竖直 |
        // | L/2 标注 | (180,345)-(430,345) | 下方水平 |
        // | 公式框 | (500,380)-(780,470) | 步骤 4 |

        // 状态变量
        let currentStep = 0;
        const totalSteps = 4;

        // DOM 元素引用
        const prevBtn = document.getElementById('scene1-prev-btn');
        const nextBtn = document.getElementById('scene1-next-btn');
        const stepIndicator = document.getElementById('scene1-step-indicator');

        // 各步骤需要显示的元素
        const stepElements = {
            1: ['scene1-entry-point', 'scene1-velocity-group'],
            2: ['scene1-trajectory', 'scene1-landing-point', 'scene1-label-o'],
            3: ['scene1-displacement-vertical', 'scene1-displacement-horizontal'],
            4: ['scene1-formula-box']
        };

        // 工具函数：显示元素
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene1-hidden');
                el.classList.add('scene1-visible');
                if (el.tagName === 'g' || el.tagName === 'rect' || el.tagName === 'path' || 
                    el.tagName === 'line' || el.tagName === 'circle' || el.tagName === 'text') {
                    el.style.opacity = '1';
                }
            }
        }

        // 工具函数：隐藏元素
        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene1-visible');
                el.classList.add('scene1-hidden');
                if (el.tagName === 'g' || el.tagName === 'rect' || el.tagName === 'path' || 
                    el.tagName === 'line' || el.tagName === 'circle' || el.tagName === 'text') {
                    el.style.opacity = '0';
                }
            }
        }

        // 更新步骤显示
        function updateStep() {
            // 更新步骤指示器
            stepIndicator.textContent = `步骤 ${currentStep}/${totalSteps}`;

            // 更新按钮状态
            prevBtn.disabled = (currentStep === 0);
            nextBtn.disabled = (currentStep === totalSteps);

            // 根据当前步骤显示/隐藏元素
            for (let step = 1; step <= totalSteps; step++) {
                const elements = stepElements[step];
                if (elements) {
                    elements.forEach(id => {
                        if (step <= currentStep) {
                            showElement(id);
                        } else {
                            hideElement(id);
                        }
                    });
                }
            }
        }

        // 事件处理：上一步
        prevBtn.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });

        // 事件处理：下一步
        nextBtn.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateStep();
            }
        });

        // 初始化
        updateStep();

    })();
    </script>
</body>
</html>
