<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>等效电路与能量转化关系</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-svg { width: 800px; height: 500px; }
        .scene3-element { transition: opacity 0.3s ease; }
        .scene3-hidden { opacity: 0; }
        .scene3-visible { opacity: 1; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg id="scene3-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 背景 -->
            <rect width="800" height="500" fill="#ffffff"/>
            
            <!-- ========== 左侧等效电路图区域 ========== -->
            <!-- 电路图布局：矩形闭合回路，电源在左侧，电阻在顶部 -->
            
            <!-- 导线框架 - 始终可见 -->
            <g id="scene3-wireframe">
                <!-- 左侧竖直线 (电源位置) -->
                <line x1="100" y1="100" x2="100" y2="200" stroke="#000000" stroke-width="2"/>
                <!-- 右侧竖直线 -->
                <line x1="350" y1="100" x2="350" y2="200" stroke="#000000" stroke-width="2"/>
                <!-- 底部水平线 -->
                <line x1="100" y1="200" x2="350" y2="200" stroke="#000000" stroke-width="2"/>
                <!-- 顶部左段 (到电源正极) -->
                <line x1="100" y1="100" x2="140" y2="100" stroke="#000000" stroke-width="2"/>
                <!-- 顶部右段 (从外阻到右侧) -->
                <line x1="280" y1="100" x2="350" y2="100" stroke="#000000" stroke-width="2"/>
            </g>
            
            <!-- 电源 E (电池符号) - 步骤 0 显示 -->
            <g id="scene3-battery-E" class="scene3-element scene3-visible">
                <!-- 电池符号：垂直放置，长线为正极在上，短线为负极在下 -->
                <line x1="85" y1="150" x2="115" y2="150" stroke="#1565c0" stroke-width="2"/>
                <!-- 正极长线 -->
                <line x1="92" y1="140" x2="108" y2="140" stroke="#1565c0" stroke-width="3"/>
                <!-- 负极短线 -->
                <line x1="95" y1="160" x2="105" y2="160" stroke="#1565c0" stroke-width="3"/>
                <!-- 电源标签 E -->
                <text x="100" y="125" font-size="16" fill="#1565c0" text-anchor="middle" font-weight="bold">E</text>
            </g>
            
            <!-- 内阻 R/3 - 步骤 1 显示 -->
            <g id="scene3-resistor-R3" class="scene3-element scene3-hidden">
                <!-- 顶部导线断开处绘制内阻 -->
                <line x1="140" y1="100" x2="160" y2="100" stroke="#000000" stroke-width="2"/>
                <!-- 标准电阻折线符号 -->
                <polyline points="160,100 165,92 175,108 185,92 195,108 205,92 215,108 220,100" 
                          fill="none" stroke="#000000" stroke-width="2"/>
                <line x1="220" y1="100" x2="240" y2="100" stroke="#000000" stroke-width="2"/>
                <text x="190" y="80" font-size="14" fill="#000000" text-anchor="middle">R/3</text>
            </g>
            
            <!-- 外阻 R - 步骤 1 显示 -->
            <g id="scene3-resistor-R" class="scene3-element scene3-hidden">
                <!-- 外阻连接到右侧导线 -->
                <line x1="240" y1="100" x2="260" y2="100" stroke="#000000" stroke-width="2"/>
                <!-- 标准电阻折线符号 -->
                <polyline points="260,100 265,92 275,108 285,92 295,108 305,92 315,108 320,100" 
                          fill="none" stroke="#000000" stroke-width="2"/>
                <line x1="320" y1="100" x2="350" y2="100" stroke="#000000" stroke-width="2"/>
                <text x="290" y="80" font-size="14" fill="#000000" text-anchor="middle">R</text>
            </g>
            
            <!-- 电流箭头 I - 步骤 2 显示 -->
            <g id="scene3-current-I" class="scene3-element scene3-hidden">
                <!-- 顺时针电流箭头 (在底部导线上) -->
                <line x1="150" y1="205" x2="280" y2="205" stroke="#2e7d32" stroke-width="2"/>
                <polygon points="280,205 272,201 272,209" fill="#2e7d32"/>
                <text x="215" y="225" font-size="14" fill="#2e7d32" text-anchor="middle">I</text>
            </g>
            
            <!-- 电流公式 - 步骤 2 显示 -->
            <text id="scene3-current-formula" x="225" y="260" font-size="14" fill="#000000" 
                  class="scene3-element scene3-hidden" text-anchor="middle">
                $I = \frac{E}{R + R/3}$
            </text>
            
            <!-- 电压 U_cd 双向箭头 - 步骤 3 显示 -->
            <g id="scene3-voltage-Ucd" class="scene3-element scene3-hidden">
                <!-- 双向箭头标注在电源两端 -->
                <line x1="70" y1="130" x2="70" y2="170" stroke="#c62828" stroke-width="2"/>
                <polygon points="70,130 66,138 74,138" fill="#c62828"/>
                <polygon points="70,170 66,162 74,162" fill="#c62828"/>
                <text x="55" y="155" font-size="14" fill="#c62828" text-anchor="end">U_cd</text>
            </g>
            
            <!-- 电压公式 - 步骤 3 显示 -->
            <text id="scene3-voltage-formula" x="225" y="290" font-size="14" fill="#c62828" 
                  class="scene3-element scene3-hidden" text-anchor="middle">
                $U = IR$
            </text>
            
            <!-- ========== 右侧能量转化框图区域 ========== -->
            
            <!-- 拉力做功框 W_F - 步骤 4 显示 -->
            <g id="scene3-box-Wf" class="scene3-element scene3-hidden">
                <rect x="450" y="50" width="280" height="50" fill="none" stroke="#888888" stroke-width="2"/>
                <text x="590" y="80" font-size="16" fill="#000000" text-anchor="middle">W_F</text>
            </g>
            
            <!-- 重力势能框 ΔE_p - 步骤 5 显示 -->
            <g id="scene3-box-Ep" class="scene3-element scene3-hidden">
                <rect x="470" y="150" width="140" height="50" fill="none" stroke="#888888" stroke-width="2"/>
                <text x="540" y="180" font-size="16" fill="#000000" text-anchor="middle">ΔE_p</text>
            </g>
            
            <!-- 焦耳热框 Q_总 - 步骤 5 显示 -->
            <g id="scene3-box-Qtotal" class="scene3-element scene3-hidden">
                <rect x="630" y="150" width="140" height="50" fill="none" stroke="#888888" stroke-width="2"/>
                <text x="700" y="180" font-size="16" fill="#000000" text-anchor="middle">Q_总</text>
            </g>
            
            <!-- 转化箭头 1 (W_F → ΔE_p) - 步骤 5 显示 -->
            <g id="scene3-arrow-ep" class="scene3-element scene3-hidden">
                <line x1="540" y1="105" x2="540" y2="145" stroke="#1565c0" stroke-width="2"/>
                <polygon points="540,145 536,137 544,137" fill="#1565c0"/>
            </g>
            
            <!-- 转化箭头 2 (W_F → Q_总) - 步骤 5 显示 -->
            <g id="scene3-arrow-qtotal" class="scene3-element scene3-hidden">
                <line x1="640" y1="105" x2="640" y2="145" stroke="#1565c0" stroke-width="2"/>
                <polygon points="640,145 636,137 644,137" fill="#1565c0"/>
            </g>
            
            <!-- 热量分配框 - 步骤 4 显示 -->
            <g id="scene3-box-heat-dist" class="scene3-element scene3-hidden">
                <rect x="450" y="250" width="280" height="100" fill="none" stroke="#888888" stroke-width="2"/>
                <!-- Q_R 标注 -->
                <text x="520" y="285" font-size="14" fill="#c62828" text-anchor="middle">Q_R = 3Q_0</text>
                <!-- Q_棒标注 -->
                <text x="520" y="325" font-size="14" fill="#c62828" text-anchor="middle">Q_棒 = Q_0</text>
                <!-- 比例标注 -->
                <text x="650" y="305" font-size="14" fill="#1565c0" text-anchor="middle">3:1</text>
            </g>
            
            <!-- 能量守恒公式 - 步骤 5 显示 -->
            <text id="scene3-energy-formula" x="590" y="390" font-size="16" fill="#1565c0" 
                  class="scene3-element scene3-hidden" text-anchor="middle" font-weight="bold">
                $W_F = \Delta E_p + Q_{总}$
            </text>
            
            <!-- ========== 底部控件栏 ========== -->
            <g id="scene3-controls">
                <!-- 上一步按钮背景 -->
                <rect id="scene3-btn-prev-bg" x="280" y="455" width="80" height="32" fill="#888888" rx="5"/>
                <text id="scene3-btn-prev-text" x="320" y="476" font-size="14" fill="#ffffff" text-anchor="middle" style="pointer-events: none;">◀ 上一步</text>
                
                <!-- 步骤指示器 -->
                <text id="scene3-step-indicator" x="400" y="476" font-size="14" fill="#000000" text-anchor="middle">步骤 0/5</text>
                
                <!-- 下一步按钮背景 -->
                <rect id="scene3-btn-next-bg" x="440" y="455" width="80" height="32" fill="#1565c0" rx="5"/>
                <text id="scene3-btn-next-text" x="480" y="476" font-size="14" fill="#ffffff" text-anchor="middle" style="pointer-events: none;">下一步 ▶</text>
            </g>
        </svg>
    </div>
    
    <script>
    (function() {
        // Scene 3 实现：等效电路与能量转化关系
        
        let currentState = 0;
        const totalSteps = 5;
        
        // 每步可见元素 ID 列表
        const stepVisibility = {
            0: ['scene3-wireframe', 'scene3-battery-E'],
            1: ['scene3-wireframe', 'scene3-battery-E', 'scene3-resistor-R3', 'scene3-resistor-R'],
            2: ['scene3-wireframe', 'scene3-battery-E', 'scene3-resistor-R3', 'scene3-resistor-R', 'scene3-current-I', 'scene3-current-formula'],
            3: ['scene3-wireframe', 'scene3-battery-E', 'scene3-resistor-R3', 'scene3-resistor-R', 'scene3-current-I', 'scene3-current-formula', 'scene3-voltage-Ucd', 'scene3-voltage-formula'],
            4: ['scene3-wireframe', 'scene3-battery-E', 'scene3-resistor-R3', 'scene3-resistor-R', 'scene3-current-I', 'scene3-current-formula', 'scene3-voltage-Ucd', 'scene3-voltage-formula', 'scene3-box-Wf', 'scene3-box-heat-dist'],
            5: ['scene3-wireframe', 'scene3-battery-E', 'scene3-resistor-R3', 'scene3-resistor-R', 'scene3-current-I', 'scene3-current-formula', 'scene3-voltage-Ucd', 'scene3-voltage-formula', 'scene3-box-Wf', 'scene3-box-Ep', 'scene3-box-Qtotal', 'scene3-arrow-ep', 'scene3-arrow-qtotal', 'scene3-box-heat-dist', 'scene3-energy-formula']
        };
        
        // 所有可控制显隐的元素 ID
        const allElements = [
            'scene3-wireframe', 'scene3-battery-E', 'scene3-resistor-R3', 'scene3-resistor-R',
            'scene3-current-I', 'scene3-current-formula', 'scene3-voltage-Ucd', 'scene3-voltage-formula',
            'scene3-box-Wf', 'scene3-box-Ep', 'scene3-box-Qtotal', 'scene3-arrow-ep', 'scene3-arrow-qtotal',
            'scene3-box-heat-dist', 'scene3-energy-formula'
        ];
        
        // 显示元素
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene3-hidden');
                el.classList.add('scene3-visible');
            }
        }
        
        // 隐藏元素
        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene3-visible');
                el.classList.add('scene3-hidden');
            }
        }
        
        // 更新场景
        function updateScene() {
            // 更新步骤指示器
            document.getElementById('scene3-step-indicator').textContent = '步骤 ' + currentState + '/' + totalSteps;
            
            // 获取当前步骤可见元素
            const visibleElements = stepVisibility[currentState] || [];
            
            // 更新所有元素显隐
            allElements.forEach(function(id) {
                if (visibleElements.indexOf(id) >= 0) {
                    showElement(id);
                } else {
                    hideElement(id);
                }
            });
            
            // 更新按钮状态
            const prevBtn = document.getElementById('scene3-btn-prev-bg');
            const nextBtn = document.getElementById('scene3-btn-next-bg');
            
            if (currentState === 0) {
                prevBtn.setAttribute('fill', '#cccccc');
            } else {
                prevBtn.setAttribute('fill', '#888888');
            }
            
            if (currentState >= totalSteps) {
                nextBtn.setAttribute('fill', '#cccccc');
            } else {
                nextBtn.setAttribute('fill', '#1565c0');
            }
            
            // 触发 MathJax 重新渲染
            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise();
            }
        }
        
        // 按钮点击事件
        document.getElementById('scene3-btn-prev-bg').addEventListener('click', function() {
            if (currentState > 0) {
                currentState--;
                updateScene();
            }
        });
        
        document.getElementById('scene3-btn-next-bg').addEventListener('click', function() {
            if (currentState < totalSteps) {
                currentState++;
                updateScene();
            }
        });
        
        // 添加按钮悬停效果
        document.getElementById('scene3-btn-prev-bg').addEventListener('mouseenter', function() {
            if (currentState > 0) {
                this.setAttribute('fill', '#666666');
            }
        });
        document.getElementById('scene3-btn-prev-bg').addEventListener('mouseleave', function() {
            if (currentState > 0) {
                this.setAttribute('fill', '#888888');
            } else {
                this.setAttribute('fill', '#cccccc');
            }
        });
        
        document.getElementById('scene3-btn-next-bg').addEventListener('mouseenter', function() {
            if (currentState < totalSteps) {
                this.setAttribute('fill', '#0d47a1');
            }
        });
        document.getElementById('scene3-btn-next-bg').addEventListener('mouseleave', function() {
            if (currentState < totalSteps) {
                this.setAttribute('fill', '#1565c0');
            } else {
                this.setAttribute('fill', '#cccccc');
            }
        });
        
        // 使按钮文字区域也可点击
        document.getElementById('scene3-btn-prev-text').addEventListener('click', function() {
            if (currentState > 0) {
                currentState--;
                updateScene();
            }
        });
        document.getElementById('scene3-btn-next-text').addEventListener('click', function() {
            if (currentState < totalSteps) {
                currentState++;
                updateScene();
            }
        });
        
        // 初始化
        updateScene();
    })();
    </script>
</body>
</html>
