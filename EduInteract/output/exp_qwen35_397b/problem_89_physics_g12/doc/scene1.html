<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电场分布与粒子运动轨迹</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        .scene1-field-line {
            stroke: #888888;
            stroke-width: 2;
            fill: none;
        }
        .scene1-axis {
            stroke: #000000;
            stroke-width: 2;
            fill: none;
        }
        .scene1-dashed-line {
            stroke: #888888;
            stroke-width: 2;
            stroke-dasharray: 8,8;
            fill: none;
        }
        .scene1-dashed-line.highlight {
            stroke: #c62828;
            stroke-width: 4;
            stroke-dasharray: 8,8;
        }
        .scene1-trajectory {
            stroke: #c62828;
            stroke-width: 2.5;
            fill: none;
            stroke-linecap: round;
        }
        .scene1-point {
            fill: #1565c0;
        }
        .scene1-label {
            font-family: sans-serif;
            font-size: 14px;
            fill: #000000;
        }
        .scene1-btn {
            position: absolute;
            width: 80px;
            height: 30px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
        }
        #scene1-btn-prev {
            left: 280px;
            top: 455px;
            background: #e0e0e0;
        }
        #scene1-btn-next {
            left: 440px;
            top: 455px;
            background: #bbdefb;
        }
        #scene1-btn-prev:disabled, #scene1-btn-next:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #scene1-step-indicator {
            position: absolute;
            left: 380px;
            top: 460px;
            font-size: 14px;
            color: #333;
        }
        .scene1-tip-box {
            fill: #fff9c4;
            stroke: #fbc02d;
            stroke-width: 1;
        }
        .scene1-tip-text {
            font-size: 12px;
            fill: #333;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <!-- 坐标轴 -->
            <line id="scene1-axis-x" class="scene1-axis" x1="80" y1="420" x2="750" y2="420" marker-end="url(#scene1-arrow)" />
            <line id="scene1-axis-y" class="scene1-axis" x1="80" y1="420" x2="80" y2="50" marker-end="url(#scene1-arrow)" />
            
            <!-- 箭头定义 -->
            <defs>
                <marker id="scene1-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#000000" />
                </marker>
            </defs>
            
            <!-- 虚线 ab -->
            <line id="scene1-line-ab" class="scene1-dashed-line" x1="300" y1="420" x2="300" y2="60" />
            
            <!-- E₁ 电场线 (8条，水平向右) -->
            <g id="scene1-field-e1-group">
                <line class="scene1-field-line" x1="100" y1="380" x2="140" y2="380" marker-end="url(#scene1-arrow-e1)" />
                <line class="scene1-field-line" x1="100" y1="340" x2="140" y2="340" marker-end="url(#scene1-arrow-e1)" />
                <line class="scene1-field-line" x1="100" y1="300" x2="140" y2="300" marker-end="url(#scene1-arrow-e1)" />
                <line class="scene1-field-line" x1="100" y1="260" x2="140" y2="260" marker-end="url(#scene1-arrow-e1)" />
                <line class="scene1-field-line" x1="100" y1="220" x2="140" y2="220" marker-end="url(#scene1-arrow-e1)" />
                <line class="scene1-field-line" x1="100" y1="180" x2="140" y2="180" marker-end="url(#scene1-arrow-e1)" />
                <line class="scene1-field-line" x1="100" y1="140" x2="140" y2="140" marker-end="url(#scene1-arrow-e1)" />
                <line class="scene1-field-line" x1="100" y1="100" x2="140" y2="100" marker-end="url(#scene1-arrow-e1)" />
            </g>
            
            <!-- E₂ 电场线 (6条，竖直向下) -->
            <g id="scene1-field-e2-group">
                <line class="scene1-field-line" x1="350" y1="380" x2="350" y2="420" marker-end="url(#scene1-arrow-e2)" />
                <line class="scene1-field-line" x1="420" y1="380" x2="420" y2="420" marker-end="url(#scene1-arrow-e2)" />
                <line class="scene1-field-line" x1="490" y1="380" x2="490" y2="420" marker-end="url(#scene1-arrow-e2)" />
                <line class="scene1-field-line" x1="560" y1="380" x2="560" y2="420" marker-end="url(#scene1-arrow-e2)" />
                <line class="scene1-field-line" x1="630" y1="380" x2="630" y2="420" marker-end="url(#scene1-arrow-e2)" />
                <line class="scene1-field-line" x1="700" y1="380" x2="700" y2="420" marker-end="url(#scene1-arrow-e2)" />
            </g>
            
            <!-- E₁ 和 E₂ 箭头定义 -->
            <defs>
                <marker id="scene1-arrow-e1" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#888888" />
                </marker>
                <marker id="scene1-arrow-e2" markerWidth="10" markerHeight="10" refX="3" refY="9" orient="auto">
                    <path d="M0,0 L6,0 L3,9 z" fill="#888888" />
                </marker>
            </defs>
            
            <!-- h 标注 (双向箭头) -->
            <g id="scene1-label-h-group">
                <line class="scene1-field-line" x1="55" y1="220" x2="55" y2="420" />
                <line class="scene1-field-line" x1="50" y1="220" x2="55" y2="220" />
                <line class="scene1-field-line" x1="50" y1="420" x2="55" y2="420" />
                <text class="scene1-label" x="35" y="325">h</text>
            </g>
            
            <!-- L 标注 (双向箭头) -->
            <g id="scene1-label-l-group">
                <line class="scene1-field-line" x1="80" y1="450" x2="300" y2="450" />
                <line class="scene1-field-line" x1="80" y1="445" x2="80" y2="450" />
                <line class="scene1-field-line" x1="300" y1="445" x2="300" y2="450" />
                <text class="scene1-label" x="185" y="470">L</text>
            </g>
            
            <!-- 标签 -->
            <text id="scene1-label-o" class="scene1-label" x="65" y="440">O</text>
            <text id="scene1-label-x" class="scene1-label" x="760" y="415">x</text>
            <text id="scene1-label-y" class="scene1-label" x="70" y="40">y</text>
            <text id="scene1-label-a" class="scene1-label" x="305" y="55">a</text>
            <text id="scene1-label-b" class="scene1-label" x="305" y="440">b</text>
            <text id="scene1-label-e1" class="scene1-label" x="180" y="80">E₁</text>
            <text id="scene1-label-e2" class="scene1-label" x="520" y="100">E₂</text>
            
            <!-- P 点及相关元素 (步骤1显示) -->
            <g id="scene1-point-p-group" style="opacity: 0; display: none;">
                <circle class="scene1-point" cx="80" cy="220" r="5" />
                <text class="scene1-label" x="55" y="225">P</text>
            </g>
            
            <!-- 轨迹段1 (步骤2显示) -->
            <path id="scene1-trajectory-1" class="scene1-trajectory" d="M80,220 C150,220 230,240 300,280" style="opacity: 0; display: none;" />
            
            <!-- 轨迹段2 (步骤3显示) -->
            <path id="scene1-trajectory-2" class="scene1-trajectory" d="M300,280 C400,320 500,380 580,420" style="opacity: 0; display: none;" />
            
            <!-- Q 点及相关元素 (步骤4显示) -->
            <g id="scene1-point-q-group" style="opacity: 0; display: none;">
                <circle class="scene1-point" cx="580" cy="420" r="5" />
                <text class="scene1-label" x="580" y="440">Q</text>
            </g>
            
            <!-- 提示框 (步骤5显示) -->
            <g id="scene1-tip-group" style="opacity: 0; display: none;">
                <rect class="scene1-tip-box" x="100" y="30" width="140" height="40" rx="4" />
                <text class="scene1-tip-text" x="110" y="50">E₁：加速直线运动</text>
                <rect class="scene1-tip-box" x="450" y="30" width="140" height="40" rx="4" />
                <text class="scene1-tip-text" x="460" y="50">E₂：类平抛运动</text>
            </g>
        </svg>
        
        <!-- 控件 -->
        <button id="scene1-btn-prev" class="scene1-btn">◀ 上一步</button>
        <div id="scene1-step-indicator">步骤 0/5</div>
        <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现
        let currentStep = 0;
        const totalSteps = 5;
        
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        
        // 元素组
        const pointPGroup = document.getElementById('scene1-point-p-group');
        const trajectory1 = document.getElementById('scene1-trajectory-1');
        const trajectory2 = document.getElementById('scene1-trajectory-2');
        const pointQGroup = document.getElementById('scene1-point-q-group');
        const tipGroup = document.getElementById('scene1-tip-group');
        const lineAb = document.getElementById('scene1-line-ab');
        
        // 显示/隐藏工具函数
        function show(el) {
            el.style.display = '';
            el.style.opacity = '1';
        }
        
        function hide(el) {
            el.style.display = 'none';
            el.style.opacity = '0';
        }
        
        // 更新显示状态
        function updateDisplay() {
            // 重置所有元素
            hide(pointPGroup);
            hide(trajectory1);
            hide(trajectory2);
            hide(pointQGroup);
            hide(tipGroup);
            lineAb.classList.remove('highlight');
            
            // 根据当前步骤显示相应元素
            if (currentStep >= 1) {
                show(pointPGroup);
            }
            if (currentStep >= 2) {
                show(trajectory1);
            }
            if (currentStep >= 3) {
                show(trajectory2);
            }
            if (currentStep >= 4) {
                show(pointQGroup);
            }
            if (currentStep >= 5) {
                show(tipGroup);
                lineAb.classList.add('highlight');
            }
            
            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps);
            
            // 更新步骤指示器
            stepIndicator.textContent = '步骤 ' + currentStep + '/' + totalSteps;
        }
        
        // 按钮事件
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        });
        
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateDisplay();
            }
        });
        
        // 初始化
        updateDisplay();
    })();
    </script>
</body>
</html>
