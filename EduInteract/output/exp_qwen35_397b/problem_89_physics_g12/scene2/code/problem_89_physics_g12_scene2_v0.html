<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>带电粒子在分区域电场中的运动 - 速度矢量分解</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-svg { width: 800px; height: 500px; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene2-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border: none; border-radius: 4px; }
        .scene2-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene2-btn-prev { background: #e0e0e0; color: #333; }
        .scene2-btn-next { background: #1565c0; color: #fff; }
        .scene2-step-indicator { font-size: 14px; color: #666; padding: 8px 12px; }
        /* 元素显隐控制 */
        .scene2-hidden { opacity: 0; display: none; }
        .scene2-visible { opacity: 1; display: block; }
        /* 箭头淡入动画 */
        .scene2-fade { transition: opacity 0.3s ease; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene2-arrow-black" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#000000" />
                </marker>
                <marker id="scene2-arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#1565c0" />
                </marker>
                <marker id="scene2-arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#2e7d32" />
                </marker>
                <marker id="scene2-arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#c62828" />
                </marker>
            </defs>

            <!-- 坐标轴 -->
            <!-- y 轴: (80,420)-(80,60) -->
            <line id="scene2-y-axis" x1="80" y1="420" x2="80" y2="60" stroke="#000000" stroke-width="2" marker-end="url(#scene2-arrow-black)" />
            <!-- x 轴: (80,420)-(720,420) -->
            <line id="scene2-x-axis" x1="80" y1="420" x2="720" y2="420" stroke="#000000" stroke-width="2" marker-end="url(#scene2-arrow-black)" />

            <!-- 坐标轴标签 -->
            <text id="scene2-origin-label" x="65" y="435" font-size="14" fill="#000000">O</text>
            <text id="scene2-x-label" x="730" y="425" font-size="14" fill="#000000">x</text>
            <text id="scene2-y-label" x="70" y="50" font-size="14" fill="#000000">y</text>

            <!-- 虚线 ab 边界: (380,420)-(380,100) -->
            <line id="scene2-ab-line" x1="380" y1="420" x2="380" y2="100" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" />
            <text id="scene2-ab-label" x="385" y="90" font-size="14" fill="#000000">ab</text>

            <!-- P 点: (80,280) -->
            <circle id="scene2-p-point" cx="80" cy="280" r="4" fill="#c62828" />
            <text id="scene2-p-label" x="65" y="275" font-size="14" fill="#000000">P</text>

            <!-- Q 点: (600,420) -->
            <circle id="scene2-q-point" cx="600" cy="420" r="4" fill="#c62828" />
            <text id="scene2-q-label" x="595" y="435" font-size="14" fill="#000000">Q</text>

            <!-- 运动轨迹: (80,280)→(380,280)→抛物线→(600,420) -->
            <path id="scene2-trajectory" d="M 80 280 L 380 280 Q 490 350 600 420" stroke="#888888" stroke-width="2" fill="none" />

            <!-- E₁ 电场线: 5 条水平箭头，y=200/240/280/320/360，x=120→340 -->
            <g id="scene2-e1-field">
                <line x1="120" y1="200" x2="340" y2="200" stroke="#1565c0" stroke-width="1.5" marker-end="url(#scene2-arrow-blue)" />
                <line x1="120" y1="240" x2="340" y2="240" stroke="#1565c0" stroke-width="1.5" marker-end="url(#scene2-arrow-blue)" />
                <line x1="120" y1="280" x2="340" y2="280" stroke="#1565c0" stroke-width="1.5" marker-end="url(#scene2-arrow-blue)" />
                <line x1="120" y1="320" x2="340" y2="320" stroke="#1565c0" stroke-width="1.5" marker-end="url(#scene2-arrow-blue)" />
                <line x1="120" y1="360" x2="340" y2="360" stroke="#1565c0" stroke-width="1.5" marker-end="url(#scene2-arrow-blue)" />
            </g>
            <text id="scene2-e1-label" x="200" y="180" font-size="14" fill="#1565c0">E₁</text>

            <!-- E₂ 电场线: 5 条竖直箭头，x=420/480/540/600/660，y=120→400 -->
            <g id="scene2-e2-field">
                <line x1="420" y1="120" x2="420" y2="400" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#scene2-arrow-green)" />
                <line x1="480" y1="120" x2="480" y2="400" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#scene2-arrow-green)" />
                <line x1="540" y1="120" x2="540" y2="400" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#scene2-arrow-green)" />
                <line x1="600" y1="120" x2="600" y2="400" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#scene2-arrow-green)" />
                <line x1="660" y1="120" x2="660" y2="400" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#scene2-arrow-green)" />
            </g>
            <text id="scene2-e2-label" x="550" y="100" font-size="14" fill="#2e7d32">E₂</text>

            <!-- 步骤 1: v=0 标签 -->
            <text id="scene2-v0-label" x="80" y="255" font-size="14" fill="#000000" class="scene2-hidden">v=0</text>

            <!-- 步骤 2: v₁ 矢量 (380,280)→(440,280) -->
            <g id="scene2-v1-group" class="scene2-hidden">
                <line x1="380" y1="280" x2="440" y2="280" stroke="#1565c0" stroke-width="3" marker-end="url(#scene2-arrow-blue)" class="scene2-fade" />
                <text x="410" y="265" font-size="14" fill="#1565c0">v₁</text>
            </g>

            <!-- 步骤 3: Q 点速度分解 -->
            <g id="scene2-q-decomp-group" class="scene2-hidden">
                <!-- 分解辅助虚线 -->
                <line x1="660" y1="420" x2="660" y2="360" stroke="#888888" stroke-width="1" stroke-dasharray="3,3" />
                <line x1="600" y1="360" x2="660" y2="360" stroke="#888888" stroke-width="1" stroke-dasharray="3,3" />
                <!-- vₓ 分量: (600,420)→(660,420) -->
                <line x1="600" y1="420" x2="660" y2="420" stroke="#1565c0" stroke-width="2" marker-end="url(#scene2-arrow-blue)" class="scene2-fade" />
                <text x="630" y="405" font-size="14" fill="#1565c0">vₓ</text>
                <!-- vᵧ 分量: (600,420)→(600,360) -->
                <line x1="600" y1="420" x2="600" y2="360" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene2-arrow-green)" class="scene2-fade" />
                <text x="610" y="385" font-size="14" fill="#2e7d32">vᵧ</text>
            </g>

            <!-- 步骤 4: 合速度 v 和角度θ -->
            <g id="scene2-q-velocity-group" class="scene2-hidden">
                <!-- 合速度 v: (600,420)→(660,360) -->
                <line x1="600" y1="420" x2="660" y2="360" stroke="#c62828" stroke-width="3" marker-end="url(#scene2-arrow-red)" class="scene2-fade" />
                <text x="665" y="355" font-size="14" fill="#c62828">v</text>
                <!-- θ 角弧: 半径 25px -->
                <path d="M 625 420 A 25 25 0 0 0 643 402" stroke="#000000" stroke-width="1" fill="none" />
                <text x="620" y="405" font-size="12" fill="#000000">θ</text>
                <!-- 公式标注 -->
                <text x="500" y="80" font-size="16" fill="#000000" class="scene2-fade">$$v = \sqrt{v_x^2 + v_y^2}$$</text>
            </g>

            <!-- 控件栏（放在 SVG 内部底部） -->
            <g id="scene2-controls-group">
                <rect x="260" y="445" width="280" height="40" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="4" />
                <text id="scene2-step-text" x="400" y="470" font-size="14" fill="#666" text-anchor="middle">步骤 0/4</text>
            </g>
        </svg>

        <!-- HTML 按钮控件 -->
        <div id="scene2-controls">
            <button id="scene2-btn-prev" class="scene2-btn scene2-btn-prev" disabled>◀ 上一步</button>
            <button id="scene2-btn-next" class="scene2-btn scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2 实现：带电粒子在分区域电场中的运动 - 速度矢量分解

        // 状态变量
        let currentState = 0;
        const totalSteps = 4;

        // DOM 元素引用
        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        const stepText = document.getElementById('scene2-step-text');

        // 各步骤需要显示的元素 ID
        const stepElements = {
            0: [],  // 初始状态：只显示基础元素
            1: ['scene2-v0-label'],
            2: ['scene2-v1-group'],
            3: ['scene2-q-decomp-group'],
            4: ['scene2-q-decomp-group', 'scene2-q-velocity-group']
        };

        // 工具函数：显示元素
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene2-hidden');
                el.classList.add('scene2-visible');
                el.style.display = '';
                el.style.opacity = '1';
            }
        }

        // 工具函数：隐藏元素
        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene2-visible');
                el.classList.add('scene2-hidden');
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }

        // 更新显示状态
        function updateDisplay() {
            // 隐藏所有步骤相关元素
            const allStepElements = ['scene2-v0-label', 'scene2-v1-group', 'scene2-q-decomp-group', 'scene2-q-velocity-group'];
            allStepElements.forEach(id => hideElement(id));

            // 显示当前步骤需要的元素
            stepElements[currentState].forEach(id => showElement(id));

            // 更新步骤指示器
            stepText.textContent = '步骤 ' + currentState + '/' + totalSteps;

            // 更新按钮状态
            btnPrev.disabled = (currentState === 0);
            btnNext.disabled = (currentState === totalSteps);
            btnNext.textContent = (currentState === totalSteps) ? '完成' : '下一步 ▶';
        }

        // 按钮事件处理
        btnPrev.addEventListener('click', function() {
            if (currentState > 0) {
                currentState--;
                updateDisplay();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentState < totalSteps) {
                currentState++;
                updateDisplay();
            }
        });

        // 初始化显示
        updateDisplay();

        // MathJax 渲染公式
        if (window.MathJax) {
            MathJax.typesetPromise();
        }
    })();
    </script>
</body>
</html>
