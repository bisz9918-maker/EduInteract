<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电路结构及连接关系</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 12px;
            z-index: 10;
        }
        .scene1-btn {
            padding: 8px 16px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .scene1-btn-prev {
            background: #9e9e9e;
            color: white;
        }
        .scene1-btn-next {
            background: #1565c0;
            color: white;
        }
        .scene1-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .scene1-step-indicator {
            position: absolute;
            bottom: 15px;
            right: 20px;
            font-size: 12px;
            color: #333;
        }
        /* 电流箭头脉动动画 */
        @keyframes scene1-pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1.0; }
        }
        .scene1-current-arrow {
            animation: scene1-pulse 1.5s ease-in-out infinite;
        }
        /* L2 发光效果 */
        .scene1-l2-glow {
            transition: fill-opacity 0.5s ease;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#1565c0" />
                </marker>
                <marker id="scene1-arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#c62828" />
                </marker>
            </defs>

            <!-- 导线层（底层） -->
            <g id="scene1-wires">
                <!-- 导线1: 开关→L₁上端 -->
                <line id="scene1-wire1" x1="180" y1="105" x2="620" y2="105" stroke="#000000" stroke-width="3" fill="none"/>
                <!-- 导线2: L₁→电源正极 -->
                <line id="scene1-wire2" x1="660" y1="150" x2="660" y2="380" stroke="#000000" stroke-width="3" fill="none"/>
                <!-- 导线3: 电源负极→L₂右侧 -->
                <line id="scene1-wire3" x1="580" y1="400" x2="240" y2="400" stroke="#000000" stroke-width="3" fill="none"/>
                <!-- 导线4: L₂左侧→开关 -->
                <line id="scene1-wire4" x1="160" y1="355" x2="160" y2="105" stroke="#000000" stroke-width="3" fill="none"/>
                <!-- 导线5: L₂→电压表+ (折线) -->
                <path id="scene1-wire5" d="M 160 355 L 160 280 L 340 280" stroke="#000000" stroke-width="3" fill="none"/>
                <!-- 导线6: L₂另一侧→电压表- (折线) -->
                <path id="scene1-wire6" d="M 240 400 L 240 280 L 460 280" stroke="#000000" stroke-width="3" fill="none"/>
            </g>

            <!-- 电压表连接线（红色加粗，步骤2显示） -->
            <g id="scene1-voltmeter-connections" style="display: none;">
                <path d="M 160 355 L 160 280 L 340 280" stroke="#c62828" stroke-width="4" fill="none"/>
                <path d="M 240 400 L 240 280 L 460 280" stroke="#c62828" stroke-width="4" fill="none"/>
            </g>

            <!-- 电源（电池组） -->
            <g id="scene1-power">
                <rect x="580" y="380" width="140" height="40" fill="#f5f5f5" stroke="#000000" stroke-width="2"/>
                <!-- 电池正极标记 -->
                <line x1="720" y1="390" x2="720" y2="410" stroke="#000000" stroke-width="3"/>
                <line x1="715" y1="395" x2="715" y2="405" stroke="#000000" stroke-width="2"/>
                <!-- 电池负极标记 -->
                <line x1="580" y1="390" x2="580" y2="410" stroke="#000000" stroke-width="3"/>
                <text x="650" y="430" font-size="14" fill="#000000" text-anchor="middle">电源</text>
            </g>

            <!-- 开关 -->
            <g id="scene1-switch">
                <rect x="80" y="80" width="100" height="50" fill="#e0e0e0" stroke="#000000" stroke-width="2"/>
                <!-- 开关刀片（断开状态） -->
                <line x1="100" y1="105" x2="150" y2="90" stroke="#000000" stroke-width="3"/>
                <circle cx="100" cy="105" r="4" fill="#333"/>
                <circle cx="160" cy="105" r="4" fill="#333"/>
                <text x="130" y="70" font-size="14" fill="#000000" text-anchor="middle">开关</text>
            </g>

            <!-- 灯 L₁ -->
            <g id="scene1-bulb-l1">
                <circle cx="660" cy="115" r="25" fill="#fff9c4" stroke="#000000" stroke-width="2"/>
                <rect x="650" y="140" width="20" height="10" fill="#ccc" stroke="#000000" stroke-width="1"/>
                <!-- 灯丝 -->
                <path d="M 655 115 Q 660 105 665 115" stroke="#000000" stroke-width="1.5" fill="none"/>
                <text x="660" y="60" font-size="14" fill="#000000" text-anchor="middle">L₁</text>
            </g>

            <!-- 灯 L₂ -->
            <g id="scene1-bulb-l2">
                <circle id="scene1-l2-circle" cx="120" cy="355" r="25" fill="#fff9c4" fill-opacity="0.2" stroke="#000000" stroke-width="2" class="scene1-l2-glow"/>
                <rect x="110" y="380" width="20" height="10" fill="#ccc" stroke="#000000" stroke-width="1"/>
                <!-- 灯丝 -->
                <path d="M 115 355 Q 120 345 125 355" stroke="#000000" stroke-width="1.5" fill="none"/>
                <text x="120" y="400" font-size="14" fill="#000000" text-anchor="middle">L₂</text>
            </g>

            <!-- 电压表 -->
            <g id="scene1-voltmeter">
                <rect x="320" y="200" width="160" height="120" fill="#e3f2fd" stroke="#000000" stroke-width="2"/>
                <!-- 表盘刻度 -->
                <path d="M 360 260 A 40 40 0 0 1 440 260" stroke="#000000" stroke-width="1" fill="none"/>
                <line x1="400" y1="260" x2="400" y2="230" stroke="#000000" stroke-width="1.5"/>
                <!-- V 符号 -->
                <text id="scene1-voltmeter-v" x="400" y="240" font-size="24" fill="#000000" text-anchor="middle" font-weight="bold">V</text>
                <!-- 接线柱 -->
                <circle cx="340" cy="280" r="8" fill="#333333"/>
                <circle cx="460" cy="280" r="8" fill="#333333"/>
                <text x="340" y="295" font-size="12" fill="#000000" text-anchor="middle">+</text>
                <text x="460" y="295" font-size="12" fill="#000000" text-anchor="middle">-</text>
            </g>

            <!-- 电流路径箭头（步骤1显示） -->
            <g id="scene1-current-arrows" style="display: none;">
                <!-- 箭头1: 导线1上方，向右 -->
                <polygon id="scene1-arrow1" class="scene1-current-arrow" points="400,95 430,95 425,100 430,105 400,105 405,100" fill="#1565c0"/>
                <!-- 箭头2: 导线2右侧，向下 -->
                <polygon id="scene1-arrow2" class="scene1-current-arrow" points="670,250 665,280 670,275 675,280" fill="#1565c0"/>
                <!-- 箭头3: 导线3下方，向左 -->
                <polygon id="scene1-arrow3" class="scene1-current-arrow" points="410,410 380,410 385,405 380,400 410,400 405,405" fill="#1565c0"/>
                <!-- 箭头4: 导线4左侧，向上 -->
                <polygon id="scene1-arrow4" class="scene1-current-arrow" points="150,245 155,215 150,220 145,215" fill="#1565c0"/>
            </g>

            <!-- 电路结构框和标注（步骤3显示） -->
            <g id="scene1-circuit-frame" style="display: none;">
                <rect x="60" y="60" width="680" height="380" fill="none" stroke="#666" stroke-width="2" stroke-dasharray="8,4"/>
                <text x="400" y="50" font-size="16" fill="#000000" text-anchor="middle" font-weight="bold">串联电路</text>
            </g>

            <!-- 控件栏 -->
            <g id="scene1-controls-group">
                <rect x="310" y="450" width="180" height="40" fill="white" stroke="#ddd" stroke-width="1"/>
            </g>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next" class="scene1-btn scene1-btn-next">下一步 ▶</button>
        </div>
        <div id="scene1-step-indicator" class="scene1-step-indicator">步骤 0/3</div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        let currentState = 0;
        const totalSteps = 3;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');

        // 元素引用
        const voltmeterConnections = document.getElementById('scene1-voltmeter-connections');
        const currentArrows = document.getElementById('scene1-current-arrows');
        const circuitFrame = document.getElementById('scene1-circuit-frame');
        const l2Circle = document.getElementById('scene1-l2-circle');
        const voltmeterV = document.getElementById('scene1-voltmeter-v');

        function updateState() {
            // 更新步骤指示器
            stepIndicator.textContent = `步骤 ${currentState}/${totalSteps}`;

            // 更新按钮状态
            btnPrev.disabled = currentState === 0;
            btnNext.disabled = currentState === totalSteps;
            btnNext.textContent = currentState === totalSteps ? '完成' : '下一步 ▶';

            // 根据状态显示/隐藏元素
            if (currentState >= 1) {
                voltmeterConnections.style.display = 'block';
                currentArrows.style.display = 'block';
            } else {
                voltmeterConnections.style.display = 'none';
                currentArrows.style.display = 'none';
            }

            if (currentState >= 2) {
                voltmeterConnections.style.display = 'block';
                l2Circle.setAttribute('fill-opacity', '0.6');
            } else {
                l2Circle.setAttribute('fill-opacity', '0.2');
            }

            if (currentState >= 3) {
                circuitFrame.style.display = 'block';
                voltmeterV.setAttribute('font-size', '28.8'); // 1.2倍
            } else {
                circuitFrame.style.display = 'none';
                voltmeterV.setAttribute('font-size', '24');
            }
        }

        btnPrev.addEventListener('click', function() {
            if (currentState > 0) {
                currentState--;
                updateState();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentState < totalSteps) {
                currentState++;
                updateState();
            }
        });

        // 初始化
        updateState();
    })();
    </script>
</body>
</html>
