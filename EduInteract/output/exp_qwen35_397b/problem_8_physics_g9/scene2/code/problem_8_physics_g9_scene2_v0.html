<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电路故障分析 - Scene 2</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene2-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene2-svg {
            width: 800px;
            height: 500px;
        }
        .scene2-btn {
            cursor: pointer;
            transition: all 0.2s;
        }
        .scene2-btn:hover {
            opacity: 0.8;
        }
        .scene2-btn-active {
            fill: #1565c0 !important;
        }
        .scene2-btn-active text {
            fill: #ffffff !important;
        }
        .scene2-glow {
            filter: url(#scene2-glow-filter);
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500">
            <!-- 定义发光滤镜 -->
            <defs>
                <filter id="scene2-glow-filter" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                    <feMerge>
                        <feMergeNode in="coloredBlur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
                <!-- 箭头标记 -->
                <marker id="scene2-arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
                    <path d="M0,0 L10,5 L0,10 Z" fill="#1565c0"/>
                </marker>
            </defs>

            <!-- 导线 -->
            <!-- 电源到 L2 -->
            <line id="scene2-wire1" x1="220" y1="380" x2="80" y2="380" stroke="#000000" stroke-width="2" fill="none"/>
            <line id="scene2-wire2" x1="80" y1="380" x2="80" y2="320" stroke="#000000" stroke-width="2" fill="none"/>
            
            <!-- L2 到开关 -->
            <line id="scene2-wire3" x1="80" y1="260" x2="80" y2="120" stroke="#000000" stroke-width="2" fill="none"/>
            <line id="scene2-wire4" x1="80" y1="120" x2="140" y2="120" stroke="#000000" stroke-width="2" fill="none"/>
            
            <!-- 开关到 L1 -->
            <line id="scene2-wire5" x1="140" y1="120" x2="380" y2="120" stroke="#000000" stroke-width="2" fill="none"/>
            
            <!-- L1 回电源 -->
            <line id="scene2-wire6" x1="380" y1="140" x2="380" y2="380" stroke="#000000" stroke-width="2" fill="none"/>
            <line id="scene2-wire7" x1="380" y1="380" x2="220" y2="380" stroke="#000000" stroke-width="2" fill="none"/>

            <!-- 电压表连接线 -->
            <line id="scene2-wire8" x1="200" y1="220" x2="80" y2="220" stroke="#000000" stroke-width="2" fill="none"/>
            <line id="scene2-wire9" x1="80" y1="220" x2="80" y2="280" stroke="#000000" stroke-width="2" fill="none"/>
            <line id="scene2-wire10" x1="320" y1="220" x2="320" y2="280" stroke="#000000" stroke-width="2" fill="none"/>
            <line id="scene2-wire11" x1="320" y1="280" x2="120" y2="280" stroke="#000000" stroke-width="2" fill="none"/>

            <!-- 电流路径高亮（初始隐藏） -->
            <g id="scene2-current-path" style="opacity: 0;">
                <line x1="220" y1="380" x2="80" y2="380" stroke="#1565c0" stroke-width="3" fill="none"/>
                <line x1="80" y1="380" x2="80" y2="320" stroke="#1565c0" stroke-width="3" fill="none"/>
                <line x1="80" y1="260" x2="80" y2="120" stroke="#1565c0" stroke-width="3" fill="none"/>
                <line x1="80" y1="120" x2="140" y2="120" stroke="#1565c0" stroke-width="3" fill="none"/>
                <line x1="140" y1="120" x2="380" y2="120" stroke="#1565c0" stroke-width="3" fill="none"/>
                <line x1="380" y1="140" x2="380" y2="380" stroke="#1565c0" stroke-width="3" fill="none"/>
                <line x1="380" y1="380" x2="220" y2="380" stroke="#1565c0" stroke-width="3" fill="none"/>
            </g>

            <!-- 电源（电池符号） -->
            <g id="scene2-battery">
                <line x1="120" y1="380" x2="150" y2="380" stroke="#000000" stroke-width="3"/>
                <line x1="190" y1="380" x2="220" y2="380" stroke="#000000" stroke-width="3"/>
                <line x1="150" y1="370" x2="150" y2="390" stroke="#000000" stroke-width="3"/>
                <line x1="190" y1="375" x2="190" y2="385" stroke="#000000" stroke-width="3"/>
            </g>

            <!-- L2 灯泡（左下角） -->
            <g id="scene2-l2">
                <circle cx="80" cy="280" r="20" fill="#9e9e9e" stroke="#000000" stroke-width="2"/>
                <line x1="70" y1="270" x2="90" y2="290" stroke="#000000" stroke-width="2"/>
                <line x1="90" y1="270" x2="70" y2="290" stroke="#000000" stroke-width="2"/>
                <!-- 接线柱 -->
                <circle cx="80" cy="300" r="4" fill="#000000"/>
                <circle cx="80" cy="260" r="4" fill="#000000"/>
            </g>
            <text id="scene2-l2-label" x="65" y="325" font-size="14" fill="#000000">L₂</text>

            <!-- L1 灯泡（右上角） -->
            <g id="scene2-l1">
                <circle cx="380" cy="100" r="20" fill="#9e9e9e" stroke="#000000" stroke-width="2"/>
                <line x1="370" y1="90" x2="390" y2="110" stroke="#000000" stroke-width="2"/>
                <line x1="390" y1="90" x2="370" y2="110" stroke="#000000" stroke-width="2"/>
                <!-- 接线柱 -->
                <circle cx="380" cy="120" r="4" fill="#000000"/>
                <circle cx="380" cy="80" r="4" fill="#000000"/>
            </g>
            <text id="scene2-l1-label" x="425" y="85" font-size="14" fill="#000000">L₁</text>

            <!-- 开关 S（左上角） -->
            <g id="scene2-switch">
                <rect x="80" y="110" width="60" height="20" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                <line x1="90" y1="120" x2="130" y2="120" stroke="#000000" stroke-width="2"/>
                <circle cx="90" cy="120" r="3" fill="#000000"/>
                <circle cx="130" cy="120" r="3" fill="#000000"/>
            </g>
            <text id="scene2-switch-label" x="95" y="75" font-size="14" fill="#000000">S</text>

            <!-- 电压表 -->
            <g id="scene2-voltmeter">
                <!-- 表盘 -->
                <rect x="200" y="180" width="120" height="80" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                <!-- 刻度弧线 -->
                <path d="M 220,240 A 50,50 0 0,1 300,240" fill="none" stroke="#000000" stroke-width="1"/>
                <!-- 刻度线 -->
                <line x1="260" y1="220" x2="260" y2="200" stroke="#000000" stroke-width="1"/>
                <line x1="260" y1="220" x2="235" y2="205" stroke="#000000" stroke-width="1"/>
                <line x1="260" y1="220" x2="285" y2="205" stroke="#000000" stroke-width="1"/>
                <!-- 刻度数值 -->
                <text x="258" y="195" font-size="10" fill="#000000">0</text>
                <text x="230" y="205" font-size="10" fill="#000000">3</text>
                <text x="285" y="205" font-size="10" fill="#000000">15</text>
                <!-- V 标签 -->
                <text x="260" y="205" font-size="14" fill="#000000" text-anchor="middle">V</text>
                <!-- 指针（可旋转） -->
                <line id="scene2-voltmeter-needle" x1="260" y1="220" x2="260" y2="190" stroke="#888888" stroke-width="2"/>
                <circle cx="260" cy="220" r="4" fill="#000000"/>
            </g>

            <!-- 故障标记（初始隐藏） -->
            <!-- L1 短路符号（波浪线） -->
            <g id="scene2-fault-l1-short" style="opacity: 0;">
                <path d="M 360,100 Q 365,95 370,100 T 380,100 T 390,100 T 400,100" fill="none" stroke="#c62828" stroke-width="3"/>
            </g>
            <!-- L1 断路标记（×） -->
            <g id="scene2-fault-l1-open" style="opacity: 0;">
                <line x1="370" y1="90" x2="390" y2="110" stroke="#c62828" stroke-width="3"/>
                <line x1="390" y1="90" x2="370" y2="110" stroke="#c62828" stroke-width="3"/>
            </g>
            <!-- L2 短路符号（波浪线） -->
            <g id="scene2-fault-l2-short" style="opacity: 0;">
                <path d="M 60,280 Q 65,275 70,280 T 80,280 T 90,280 T 100,280" fill="none" stroke="#c62828" stroke-width="3"/>
            </g>
            <!-- L2 断路标记（×） -->
            <g id="scene2-fault-l2-open" style="opacity: 0;">
                <line x1="70" y1="270" x2="90" y2="290" stroke="#c62828" stroke-width="3"/>
                <line x1="90" y1="270" x2="70" y2="290" stroke="#c62828" stroke-width="3"/>
            </g>

            <!-- 现象框 -->
            <g id="scene2-phenomenon-box">
                <rect x="480" y="80" width="300" height="300" fill="#ffffff" stroke="#1565c0" stroke-width="2"/>
                <text x="495" y="105" font-size="16" fill="#1565c0" font-weight="bold">现象分析</text>
                <text id="scene2-phenomenon-text" x="495" y="140" font-size="13" fill="#000000" style="white-space: pre;">请选择一个选项查看对应现象</text>
            </g>

            <!-- 按钮组（SVG 内部底部） -->
            <g id="scene2-buttons">
                <!-- 按钮 A -->
                <g id="scene2-btn-a" class="scene2-btn">
                    <rect x="100" y="450" width="80" height="35" fill="#e0e0e0" stroke="#000000" stroke-width="1"/>
                    <text x="140" y="472" font-size="14" fill="#000000" text-anchor="middle">A. L₁短路</text>
                </g>
                <!-- 按钮 B -->
                <g id="scene2-btn-b" class="scene2-btn">
                    <rect x="200" y="450" width="80" height="35" fill="#e0e0e0" stroke="#000000" stroke-width="1"/>
                    <text x="240" y="472" font-size="14" fill="#000000" text-anchor="middle">B. L₁断路</text>
                </g>
                <!-- 按钮 C -->
                <g id="scene2-btn-c" class="scene2-btn">
                    <rect x="300" y="450" width="80" height="35" fill="#e0e0e0" stroke="#000000" stroke-width="1"/>
                    <text x="340" y="472" font-size="14" fill="#000000" text-anchor="middle">C. L₂短路</text>
                </g>
                <!-- 按钮 D -->
                <g id="scene2-btn-d" class="scene2-btn">
                    <rect x="400" y="450" width="80" height="35" fill="#e0e0e0" stroke="#000000" stroke-width="1"/>
                    <text x="440" y="472" font-size="14" fill="#000000" text-anchor="middle">D. L₂断路</text>
                </g>
            </g>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 2 电路故障分析实现

        // 状态变量
        let currentState = null;

        // 获取 DOM 元素
        const btnA = document.getElementById('scene2-btn-a');
        const btnB = document.getElementById('scene2-btn-b');
        const btnC = document.getElementById('scene2-btn-c');
        const btnD = document.getElementById('scene2-btn-d');
        
        const l1 = document.getElementById('scene2-l1');
        const l2 = document.getElementById('scene2-l2');
        const needle = document.getElementById('scene2-voltmeter-needle');
        const currentPath = document.getElementById('scene2-current-path');
        const faultL1Short = document.getElementById('scene2-fault-l1-short');
        const faultL1Open = document.getElementById('scene2-fault-l1-open');
        const faultL2Short = document.getElementById('scene2-fault-l2-short');
        const faultL2Open = document.getElementById('scene2-fault-l2-open');
        const phenomenonText = document.getElementById('scene2-phenomenon-text');

        // 现象文字内容
        const phenomenonData = {
            A: "A. L₁短路\n• L₁：不亮（被短路）\n• L₂：亮\n• 电压表：有示数\n• 电流：有电流通过 L₂",
            B: "B. L₁断路\n• L₁：不亮\n• L₂：不亮（电路断开）\n• 电压表：无示数\n• 电流：无电流",
            C: "C. L₂短路\n• L₁：亮\n• L₂：不亮（被短路）\n• 电压表：无示数（被短路）\n• 电流：有电流通过 L₁",
            D: "D. L₂断路\n• L₁：不亮\n• L₂：不亮（电路断开）\n• 电压表：有示数（测电源电压）\n• 电流：无电流通过灯"
        };

        // 设置灯泡状态
        function setBulbState(bulb, isLit) {
            const circle = bulb.querySelector('circle');
            if (isLit) {
                circle.setAttribute('fill', '#ffd54f');
                circle.classList.add('scene2-glow');
            } else {
                circle.setAttribute('fill', '#9e9e9e');
                circle.classList.remove('scene2-glow');
            }
        }

        // 设置电压表指针
        function setNeedle(angle, hasReading) {
            needle.setAttribute('transform', `rotate(${angle}, 260, 220)`);
            needle.setAttribute('stroke', hasReading ? '#2e7d32' : '#888888');
        }

        // 隐藏所有故障标记
        function hideAllFaults() {
            faultL1Short.style.opacity = 0;
            faultL1Open.style.opacity = 0;
            faultL2Short.style.opacity = 0;
            faultL2Open.style.opacity = 0;
        }

        // 重置按钮样式
        function resetButtons() {
            [btnA, btnB, btnC, btnD].forEach(btn => {
                btn.querySelector('rect').setAttribute('fill', '#e0e0e0');
                btn.querySelector('text').setAttribute('fill', '#000000');
            });
        }

        // 激活按钮
        function activateButton(btn) {
            btn.querySelector('rect').setAttribute('fill', '#1565c0');
            btn.querySelector('text').setAttribute('fill', '#ffffff');
        }

        // 更新状态
        function updateState(state) {
            currentState = state;
            
            // 重置所有元素
            hideAllFaults();
            resetButtons();
            setBulbState(l1, false);
            setBulbState(l2, false);
            currentPath.style.opacity = 0;
            
            if (state === null) {
                setNeedle(0, false);
                phenomenonText.textContent = "请选择一个选项查看对应现象";
                return;
            }

            // 激活对应按钮
            const btnMap = { A: btnA, B: btnB, C: btnC, D: btnD };
            activateButton(btnMap[state]);

            // 根据状态设置现象
            switch(state) {
                case 'A': // L1 短路
                    faultL1Short.style.opacity = 1;
                    setBulbState(l1, false);
                    setBulbState(l2, true);
                    currentPath.style.opacity = 1;
                    setNeedle(-60, true); // 指针偏转
                    break;
                case 'B': // L1 断路
                    faultL1Open.style.opacity = 1;
                    setBulbState(l1, false);
                    setBulbState(l2, false);
                    currentPath.style.opacity = 0;
                    setNeedle(0, false);
                    break;
                case 'C': // L2 短路
                    faultL2Short.style.opacity = 1;
                    setBulbState(l1, true);
                    setBulbState(l2, false);
                    currentPath.style.opacity = 1;
                    setNeedle(0, false);
                    break;
                case 'D': // L2 断路
                    faultL2Open.style.opacity = 1;
                    setBulbState(l1, false);
                    setBulbState(l2, false);
                    currentPath.style.opacity = 0;
                    setNeedle(-60, true); // 电压表测电源电压
                    break;
            }

            // 更新现象文字
            phenomenonText.textContent = phenomenonData[state];
        }

        // 绑定按钮事件
        btnA.addEventListener('click', () => updateState('A'));
        btnB.addEventListener('click', () => updateState('B'));
        btnC.addEventListener('click', () => updateState('C'));
        btnD.addEventListener('click', () => updateState('D'));

        // 初始状态
        updateState(null);

    })();
    </script>
</body>
</html>
