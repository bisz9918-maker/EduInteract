<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>玻璃管三状态对比及压强关系分析</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-svg { width: 800px; height: 500px; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene1-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; background: #1976d2; color: white; border: none; border-radius: 4px; }
        .scene1-btn:disabled { background: #bdbdbd; cursor: not-allowed; }
        .scene1-step-indicator { padding: 8px 16px; font-size: 14px; background: #e3f2fd; border-radius: 4px; }
        .scene1-hidden { display: none; opacity: 0; }
        .scene1-visible { display: block; opacity: 1; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene1-arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
                    <path d="M0,0 L10,5 L0,10 Z" fill="#1565c0"/>
                </marker>
            </defs>

            <!-- ========== 甲管（左侧） ========== -->
            <!-- 玻璃管轮廓 -->
            <rect id="scene1-tube-a" x="100" y="80" width="40" height="300" fill="none" stroke="#000000" stroke-width="2"/>
            <!-- 水银柱 -->
            <rect id="scene1-mercury-a" x="100" y="180" width="40" height="50" fill="#2c3e50"/>
            <!-- 封闭气体区 -->
            <rect id="scene1-gas-a" x="100" y="230" width="40" height="150" fill="#e3f2fd" fill-opacity="0.2"/>

            <!-- 甲管标注线 -->
            <!-- L=62cm 标注线（左侧） -->
            <line id="scene1-L-line-a" x1="70" y1="80" x2="70" y2="380" stroke="#1565c0" stroke-width="1"/>
            <line x1="65" y1="80" x2="70" y2="80" stroke="#1565c0" stroke-width="1"/>
            <line x1="65" y1="380" x2="70" y2="380" stroke="#1565c0" stroke-width="1"/>
            <!-- h=5cm 标注线（右侧） -->
            <line id="scene1-h-line-a" x1="150" y1="180" x2="150" y2="230" stroke="#1565c0" stroke-width="1"/>
            <line x1="150" y1="180" x2="155" y2="180" stroke="#1565c0" stroke-width="1"/>
            <line x1="150" y1="230" x2="155" y2="230" stroke="#1565c0" stroke-width="1"/>
            <!-- l₁=35cm 标注线（右侧） -->
            <line id="scene1-l1-line-a" x1="150" y1="230" x2="150" y2="380" stroke="#1565c0" stroke-width="1"/>
            <line x1="150" y1="230" x2="155" y2="230" stroke="#1565c0" stroke-width="1"/>
            <line x1="150" y1="380" x2="155" y2="380" stroke="#1565c0" stroke-width="1"/>

            <!-- 甲管标签 -->
            <text id="scene1-label-a" x="120" y="400" font-size="16" text-anchor="middle" fill="#000000">甲</text>
            <text id="scene1-L-label-a" x="45" y="230" font-size="14" text-anchor="middle" fill="#000000">L=62cm</text>
            <text id="scene1-h-label-a" x="165" y="205" font-size="14" fill="#000000">h=5cm</text>
            <text id="scene1-l1-label-a" x="165" y="305" font-size="14" fill="#000000">l₁=35cm</text>

            <!-- ========== 乙管（中间） ========== -->
            <!-- 玻璃管轮廓 -->
            <rect id="scene1-tube-b" x="300" y="80" width="40" height="300" fill="none" stroke="#000000" stroke-width="2"/>
            <!-- 水银柱 -->
            <rect id="scene1-mercury-b" x="300" y="230" width="40" height="50" fill="#2c3e50"/>
            <!-- 封闭气体区 -->
            <rect id="scene1-gas-b" x="300" y="80" width="40" height="150" fill="#e3f2fd" fill-opacity="0.2"/>

            <!-- 乙管标注线 -->
            <!-- l₂=40cm 标注线（右侧） -->
            <line id="scene1-l2-line-b" x1="350" y1="80" x2="350" y2="230" stroke="#1565c0" stroke-width="1"/>
            <line x1="350" y1="80" x2="355" y2="80" stroke="#1565c0" stroke-width="1"/>
            <line x1="350" y1="230" x2="355" y2="230" stroke="#1565c0" stroke-width="1"/>

            <!-- 乙管标签 -->
            <text id="scene1-label-b" x="320" y="400" font-size="16" text-anchor="middle" fill="#000000">乙</text>
            <text id="scene1-l2-label-b" x="365" y="155" font-size="14" fill="#000000">l₂=40cm</text>

            <!-- ========== 丙管（右侧） ========== -->
            <!-- 玻璃管轮廓 -->
            <rect id="scene1-tube-c" x="500" y="80" width="40" height="300" fill="none" stroke="#000000" stroke-width="2"/>
            <!-- 水银柱 -->
            <rect id="scene1-mercury-c" x="500" y="180" width="40" height="50" fill="#2c3e50"/>
            <!-- 上部分气体区 -->
            <rect id="scene1-gas-c1" x="500" y="230" width="40" height="70" fill="#e3f2fd" fill-opacity="0.2"/>
            <!-- 下部分气体区 -->
            <rect id="scene1-gas-c2" x="500" y="310" width="40" height="70" fill="#e3f2fd" fill-opacity="0.2"/>
            <!-- 活塞 -->
            <rect id="scene1-piston-c" x="500" y="300" width="40" height="10" fill="#555555"/>

            <!-- 丙管标注线 -->
            <!-- l₁=35cm 标注线（右侧，上气体） -->
            <line id="scene1-l1-line-c" x1="550" y1="80" x2="550" y2="230" stroke="#1565c0" stroke-width="1"/>
            <line x1="550" y1="80" x2="555" y2="80" stroke="#1565c0" stroke-width="1"/>
            <line x1="550" y1="230" x2="555" y2="230" stroke="#1565c0" stroke-width="1"/>
            <!-- d 标注线（右侧，活塞距离） -->
            <line id="scene1-d-line-c" x1="550" y1="310" x2="550" y2="380" stroke="#1565c0" stroke-width="1"/>
            <line x1="550" y1="310" x2="555" y2="310" stroke="#1565c0" stroke-width="1"/>
            <line x1="550" y1="380" x2="555" y2="380" stroke="#1565c0" stroke-width="1"/>

            <!-- 丙管标签 -->
            <text id="scene1-label-c" x="520" y="400" font-size="16" text-anchor="middle" fill="#000000">丙</text>
            <text id="scene1-l1-label-c" x="565" y="155" font-size="14" fill="#000000">l₁=35cm</text>
            <text id="scene1-d-label-c" x="565" y="345" font-size="14" fill="#000000">d</text>

            <!-- ========== 高亮框（步骤高亮用） ========== -->
            <rect id="scene1-highlight-a" x="90" y="70" width="60" height="320" fill="none" stroke="#c62828" stroke-width="3" class="scene1-hidden"/>
            <rect id="scene1-highlight-b" x="290" y="70" width="60" height="320" fill="none" stroke="#c62828" stroke-width="3" class="scene1-hidden"/>
            <rect id="scene1-highlight-c" x="490" y="70" width="60" height="320" fill="none" stroke="#c62828" stroke-width="3" class="scene1-hidden"/>

            <!-- ========== 压强关系框 ========== -->
            <!-- P₁ 框 -->
            <rect id="scene1-p1-box" x="50" y="420" width="130" height="30" fill="#ffffff" stroke="#2e7d32" stroke-width="2" class="scene1-hidden"/>
            <text id="scene1-p1-text" x="115" y="440" font-size="13" text-anchor="middle" fill="#000000" class="scene1-hidden">P₁=P₀+h</text>
            <!-- P₂ 框 -->
            <rect id="scene1-p2-box" x="200" y="420" width="130" height="30" fill="#ffffff" stroke="#2e7d32" stroke-width="2" class="scene1-hidden"/>
            <text id="scene1-p2-text" x="265" y="440" font-size="13" text-anchor="middle" fill="#000000" class="scene1-hidden">P₂=P₀-h</text>

            <!-- ========== 方程展示区 ========== -->
            <rect id="scene1-equation-box" x="350" y="420" width="430" height="60" fill="#ffffff" stroke="#1976d2" stroke-width="1" class="scene1-hidden"/>
            <text id="scene1-equation-text1" x="565" y="440" font-size="13" text-anchor="middle" fill="#000000" class="scene1-hidden">P₁l₁=P₂l₂</text>
            <text id="scene1-equation-text2" x="565" y="460" font-size="13" text-anchor="middle" fill="#000000" class="scene1-hidden">(P₀+h)×35=P₀×40</text>
            <text id="scene1-equation-text3" x="565" y="475" font-size="12" text-anchor="middle" fill="#000000" class="scene1-hidden">P₀=35cmHg</text>

            <!-- ========== 控件栏 ========== -->
            <foreignObject x="0" y="475" width="800" height="25">
                <div id="scene1-controls" xmlns="http://www.w3.org/1999/xhtml">
                    <button id="scene1-btn-prev" class="scene1-btn">◀ 上一步</button>
                    <span id="scene1-step-indicator" class="scene1-step-indicator">步骤 0/4</span>
                    <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
                </div>
            </foreignObject>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 1 实现：玻璃管三状态对比及压强关系分析

        // 状态定义：0=初始, 1=甲管高亮, 2=乙管高亮, 3=丙管高亮, 4=完整解题
        let currentState = 0;
        const totalSteps = 4;

        // 获取 DOM 元素
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');

        // 高亮框
        const highlightA = document.getElementById('scene1-highlight-a');
        const highlightB = document.getElementById('scene1-highlight-b');
        const highlightC = document.getElementById('scene1-highlight-c');

        // 压强框
        const p1Box = document.getElementById('scene1-p1-box');
        const p1Text = document.getElementById('scene1-p1-text');
        const p2Box = document.getElementById('scene1-p2-box');
        const p2Text = document.getElementById('scene1-p2-text');

        // 方程区
        const eqBox = document.getElementById('scene1-equation-box');
        const eqText1 = document.getElementById('scene1-equation-text1');
        const eqText2 = document.getElementById('scene1-equation-text2');
        const eqText3 = document.getElementById('scene1-equation-text3');

        // 工具函数：显示元素
        function show(el) {
            if (el) {
                el.classList.remove('scene1-hidden');
                el.classList.add('scene1-visible');
                el.style.display = '';
                el.style.opacity = '1';
            }
        }

        // 工具函数：隐藏元素
        function hide(el) {
            if (el) {
                el.classList.remove('scene1-visible');
                el.classList.add('scene1-hidden');
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }

        // 更新状态显示
        function updateState() {
            // 隐藏所有高亮框
            hide(highlightA);
            hide(highlightB);
            hide(highlightC);

            // 隐藏所有压强框
            hide(p1Box);
            hide(p1Text);
            hide(p2Box);
            hide(p2Text);

            // 隐藏所有方程
            hide(eqBox);
            hide(eqText1);
            hide(eqText2);
            hide(eqText3);

            // 根据当前状态显示相应元素
            switch (currentState) {
                case 0:
                    // 初始状态：只显示基础结构，无高亮无方程
                    break;
                case 1:
                    // 步骤 1：高亮甲管，显示 P₁
                    show(highlightA);
                    show(p1Box);
                    show(p1Text);
                    break;
                case 2:
                    // 步骤 2：高亮乙管，显示 P₂ 和玻意耳定律
                    show(highlightB);
                    show(p2Box);
                    show(p2Text);
                    show(eqBox);
                    show(eqText1);
                    break;
                case 3:
                    // 步骤 3：高亮丙管，显示完整方程
                    show(highlightC);
                    show(eqBox);
                    show(eqText1);
                    show(eqText2);
                    break;
                case 4:
                    // 步骤 4：显示完整解题过程
                    show(eqBox);
                    show(eqText1);
                    show(eqText2);
                    show(eqText3);
                    break;
            }

            // 更新状态指示器
            stepIndicator.textContent = '步骤 ' + currentState + '/' + totalSteps;

            // 更新按钮状态
            btnPrev.disabled = (currentState === 0);
            btnNext.disabled = (currentState === totalSteps);
        }

        // 事件监听：上一步
        btnPrev.addEventListener('click', function() {
            if (currentState > 0) {
                currentState--;
                updateState();
            }
        });

        // 事件监听：下一步
        btnNext.addEventListener('click', function() {
            if (currentState < totalSteps) {
                currentState++;
                updateState();
            }
        });

        // 初始化状态
        updateState();
    })();
    </script>
</body>
</html>
