<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物理题 91 - C 球受力与整体法求解</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #scene3-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene3-svg {
            width: 800px;
            height: 500px;
        }
        .scene3-btn {
            padding: 8px 20px;
            font-size: 14px;
            border: 2px solid #333;
            border-radius: 6px;
            background: #fff;
            cursor: pointer;
            transition: all 0.2s;
        }
        .scene3-btn:hover {
            background: #f0f0f0;
        }
        .scene3-btn.active {
            background: #333;
            color: #fff;
        }
        .scene3-group {
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg id="scene3-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene3-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#333" />
                </marker>
                <marker id="scene3-arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#c62828" />
                </marker>
                <marker id="scene3-arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#2e7d32" />
                </marker>
            </defs>

            <!-- ==================== 状态 0：隔离法（C 球受力分析） ==================== -->
            <g id="scene3-state0" class="scene3-group" style="opacity: 1; display: block;">
                <!-- C 球 -->
                <circle id="scene3-c-ball-iso" cx="220" cy="200" r="20" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                <!-- C 标签 -->
                <text id="scene3-c-label-iso" x="250" y="200" font-size="16" fill="#000">C</text>
                <!-- -Q 标签 -->
                <text id="scene3-q-label-iso" x="250" y="225" font-size="16" fill="#c62828">-Q</text>
                
                <!-- F_AC 箭头（指向左上，A 方向） -->
                <line id="scene3-f-ac-line" x1="220" y1="200" x2="150" y2="130" stroke="#c62828" stroke-width="2" marker-end="url(#scene3-arrowhead-red)"/>
                <text id="scene3-f-ac-label" x="175" y="150" font-size="14" fill="#c62828">F_AC</text>
                
                <!-- F_BC 箭头（指向左下，B 方向） -->
                <line id="scene3-f-bc-line" x1="220" y1="200" x2="150" y2="270" stroke="#c62828" stroke-width="2" marker-end="url(#scene3-arrowhead-red)"/>
                <text id="scene3-f-bc-label" x="175" y="280" font-size="14" fill="#c62828">F_BC</text>
                
                <!-- F 外力箭头（水平向右） -->
                <line id="scene3-f-iso-line" x1="240" y1="200" x2="330" y2="200" stroke="#000000" stroke-width="3" marker-end="url(#scene3-arrowhead)"/>
                <text id="scene3-f-iso-label" x="275" y="185" font-size="16" fill="#000">F</text>
                
                <!-- 标题 -->
                <text id="scene3-iso-title" x="220" y="80" font-size="18" fill="#333" text-anchor="middle">隔离法：分析 C 球受力</text>
            </g>

            <!-- ==================== 状态 1：整体法（三球整体图） ==================== -->
            <g id="scene3-state1" class="scene3-group" style="opacity: 0; display: none;">
                <!-- A 球 -->
                <circle id="scene3-a-ball" cx="550" cy="140" r="20" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                <text id="scene3-a-label" x="530" y="135" font-size="16" fill="#000">A</text>
                
                <!-- B 球 -->
                <circle id="scene3-b-ball" cx="550" cy="260" r="20" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                <text id="scene3-b-label" x="530" y="280" font-size="16" fill="#000">B</text>
                
                <!-- C 球 -->
                <circle id="scene3-c-ball-whole" cx="650" cy="200" r="20" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                <text id="scene3-c-label-whole" x="675" y="205" font-size="16" fill="#000">C</text>
                
                <!-- 虚线三角形连接三球 -->
                <path id="scene3-triangle" d="M 550 140 L 550 260 L 650 200 Z" fill="none" stroke="#666666" stroke-width="2" stroke-dasharray="5,5"/>
                
                <!-- 整体虚线框 -->
                <rect id="scene3-whole-box" x="520" y="110" width="160" height="180" fill="none" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5,5"/>
                
                <!-- F 外力箭头（绿色，水平向右） -->
                <line id="scene3-f-whole-line" x1="670" y1="200" x2="760" y2="200" stroke="#2e7d32" stroke-width="3" marker-end="url(#scene3-arrowhead-green)"/>
                <text id="scene3-f-whole-label" x="705" y="185" font-size="16" fill="#2e7d32">F</text>
                
                <!-- a 加速度箭头（整体上方） -->
                <line id="scene3-a-arrow-line" x1="580" y1="90" x2="650" y2="90" stroke="#000000" stroke-width="2" marker-end="url(#scene3-arrowhead)"/>
                <text id="scene3-a-label-arrow" x="615" y="75" font-size="16" fill="#000">a</text>
                
                <!-- 标题 -->
                <text id="scene3-whole-title" x="600" y="60" font-size="18" fill="#2e7d32" text-anchor="middle">整体法：三球视为整体</text>
            </g>

            <!-- ==================== 状态 2：对比（方程对比） ==================== -->
            <g id="scene3-state2" class="scene3-group" style="opacity: 0; display: none;">
                <!-- 隔离法方程框 -->
                <rect id="scene3-iso-eq-box" x="100" y="120" width="280" height="260" fill="#f5f5f5" stroke="#cccccc" stroke-width="2"/>
                <text id="scene3-iso-eq-title" x="240" y="150" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">隔离法</text>
                <text id="scene3-iso-eq-1" x="120" y="185" font-size="14" fill="#333">F_AC = F_BC = kqQ/r²</text>
                <text id="scene3-iso-eq-2" x="120" y="215" font-size="14" fill="#333">x 方向合力：F_x = F - 2F_AC·cos60°</text>
                <text id="scene3-iso-eq-3" x="120" y="245" font-size="14" fill="#333">牛顿第二定律：F_x = ma</text>
                <text id="scene3-iso-eq-4" x="120" y="285" font-size="14" fill="#c62828" font-weight="bold">得：F = 3ma</text>
                <text id="scene3-iso-eq-5" x="120" y="320" font-size="13" fill="#666">（需先求 Q = 2q）</text>
                
                <!-- 整体法方程框 -->
                <rect id="scene3-whole-eq-box" x="420" y="120" width="280" height="260" fill="#f5f5f5" stroke="#cccccc" stroke-width="2"/>
                <text id="scene3-whole-eq-title" x="560" y="150" font-size="16" fill="#2e7d32" text-anchor="middle" font-weight="bold">整体法</text>
                <text id="scene3-whole-eq-1" x="440" y="185" font-size="14" fill="#333">将三球视为一个整体</text>
                <text id="scene3-whole-eq-2" x="440" y="215" font-size="14" fill="#333">内力（库仑力）相互抵消</text>
                <text id="scene3-whole-eq-3" x="440" y="245" font-size="14" fill="#333">整体受外力：F_合 = F</text>
                <text id="scene3-whole-eq-4" x="440" y="275" font-size="14" fill="#333">整体质量：M = 3m</text>
                <text id="scene3-whole-eq-5" x="440" y="305" font-size="14" fill="#333">牛顿第二定律：F = 3ma</text>
                <text id="scene3-whole-eq-6" x="440" y="345" font-size="14" fill="#2e7d32" font-weight="bold">结论：F = 3ma</text>
                
                <!-- 连接箭头 -->
                <text id="scene3-compare-title" x="400" y="100" font-size="18" fill="#333" text-anchor="middle">两种方法结果一致</text>
            </g>

            <!-- ==================== 控件栏（固定在 SVG 底部） ==================== -->
            <g id="scene3-controls">
                <rect x="130" y="445" width="540" height="45" fill="#ffffff" stroke="#ddd" stroke-width="1"/>
                <text x="400" y="435" font-size="14" fill="#666" text-anchor="middle">选择分析方法：</text>
            </g>
        </svg>
        
        <!-- HTML 按钮（叠在 SVG 底部） -->
        <div id="scene3-buttons" style="position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; gap: 20px;">
            <button id="scene3-btn-iso" class="scene3-btn active">隔离法</button>
            <button id="scene3-btn-whole" class="scene3-btn">整体法</button>
            <button id="scene3-btn-compare" class="scene3-btn">对比</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 3 实现：C 球受力与整体法求解
        
        let currentState = 0; // 0: 隔离法, 1: 整体法, 2: 对比
        
        const state0Group = document.getElementById('scene3-state0');
        const state1Group = document.getElementById('scene3-state1');
        const state2Group = document.getElementById('scene3-state2');
        
        const btnIso = document.getElementById('scene3-btn-iso');
        const btnWhole = document.getElementById('scene3-btn-whole');
        const btnCompare = document.getElementById('scene3-btn-compare');
        
        function showState(state) {
            // 隐藏所有状态
            state0Group.style.opacity = '0';
            state0Group.style.display = 'none';
            state1Group.style.opacity = '0';
            state1Group.style.display = 'none';
            state2Group.style.opacity = '0';
            state2Group.style.display = 'none';
            
            // 移除所有按钮激活状态
            btnIso.classList.remove('active');
            btnWhole.classList.remove('active');
            btnCompare.classList.remove('active');
            
            // 显示目标状态
            if (state === 0) {
                state0Group.style.display = 'block';
                setTimeout(() => { state0Group.style.opacity = '1'; }, 10);
                btnIso.classList.add('active');
            } else if (state === 1) {
                state1Group.style.display = 'block';
                setTimeout(() => { state1Group.style.opacity = '1'; }, 10);
                btnWhole.classList.add('active');
            } else if (state === 2) {
                state2Group.style.display = 'block';
                setTimeout(() => { state2Group.style.opacity = '1'; }, 10);
                btnCompare.classList.add('active');
            }
            
            currentState = state;
        }
        
        // 按钮事件绑定
        btnIso.addEventListener('click', function() {
            if (currentState !== 0) showState(0);
        });
        
        btnWhole.addEventListener('click', function() {
            if (currentState !== 1) showState(1);
        });
        
        btnCompare.addEventListener('click', function() {
            if (currentState !== 2) showState(2);
        });
        
        // 初始状态
        showState(0);
    })();
    </script>
</body>
</html>
