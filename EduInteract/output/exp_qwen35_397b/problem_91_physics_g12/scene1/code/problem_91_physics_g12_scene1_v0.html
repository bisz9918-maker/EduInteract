<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三带电小球系统受力分析</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        .scene1-force-label {
            font-size: 12px;
            font-family: sans-serif;
        }
        .scene1-ball-label {
            font-size: 16px;
            font-family: serif;
            font-style: italic;
        }
        .scene1-charge-label {
            font-size: 14px;
            font-family: sans-serif;
        }
        .scene1-control-btn {
            position: absolute;
            width: 80px;
            height: 30px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .scene1-control-btn:hover {
            background: #1565c0;
        }
        .scene1-control-btn:disabled {
            background: #bdbdbd;
            cursor: not-allowed;
        }
        #scene1-btn-prev {
            left: 320px;
            top: 455px;
        }
        #scene1-btn-next {
            left: 420px;
            top: 455px;
        }
        #scene1-step-indicator {
            position: absolute;
            left: 520px;
            top: 465px;
            font-size: 14px;
            color: #333;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <!-- 定义箭头 marker -->
            <defs>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#333" />
                </marker>
                <marker id="scene1-arrowhead-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#1565c0" />
                </marker>
                <marker id="scene1-arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#2e7d32" />
                </marker>
                <marker id="scene1-arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#c62828" />
                </marker>
                <marker id="scene1-arrowhead-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#888" />
                </marker>
            </defs>

            <!-- 等边三角形边框（虚线） -->
            <line id="scene1-triangle-ab" x1="250" y1="180" x2="250" y2="320" stroke="#888" stroke-width="2" stroke-dasharray="5,5" />
            <line id="scene1-triangle-bc" x1="250" y1="320" x2="371" y2="250" stroke="#888" stroke-width="2" stroke-dasharray="5,5" />
            <line id="scene1-triangle-ca" x1="371" y1="250" x2="250" y2="180" stroke="#888" stroke-width="2" stroke-dasharray="5,5" />

            <!-- A 球 -->
            <circle id="scene1-ball-a" cx="250" cy="180" r="20" fill="#ffffff" fill-opacity="0.2" stroke="#1565c0" stroke-width="2" />
            <!-- B 球 -->
            <circle id="scene1-ball-b" cx="250" cy="320" r="20" fill="#ffffff" fill-opacity="0.2" stroke="#1565c0" stroke-width="2" />
            <!-- C 球 -->
            <circle id="scene1-ball-c" cx="371" cy="250" r="20" fill="#ffffff" fill-opacity="0.2" stroke="#c62828" stroke-width="2" />

            <!-- 点名标签 -->
            <text id="scene1-label-a" x="225" y="165" class="scene1-ball-label" fill="#333">A</text>
            <text id="scene1-label-b" x="225" y="345" class="scene1-ball-label" fill="#333">B</text>
            <text id="scene1-label-c" x="395" y="265" class="scene1-ball-label" fill="#333">C</text>

            <!-- 电荷量标签 -->
            <text id="scene1-label-qa" x="250" y="208" class="scene1-charge-label" fill="#1565c0" text-anchor="middle">+q</text>
            <text id="scene1-label-qb" x="250" y="312" class="scene1-charge-label" fill="#1565c0" text-anchor="middle">+q</text>
            <text id="scene1-label-qc" x="371" y="222" class="scene1-charge-label" fill="#c62828" text-anchor="middle">-Q</text>

            <!-- 加速度 a 箭头（图上方水平向右） -->
            <line id="scene1-arrow-a" x1="480" y1="90" x2="560" y2="90" stroke="#888" stroke-width="2" marker-end="url(#scene1-arrowhead-gray)" />
            <text id="scene1-label-a-accel" x="520" y="75" class="scene1-charge-label" fill="#888" text-anchor="middle">a</text>

            <!-- 外力 F 箭头（从 C 右侧水平向右） -->
            <line id="scene1-arrow-f" x1="391" y1="250" x2="520" y2="250" stroke="#000" stroke-width="3" marker-end="url(#scene1-arrowhead)" />
            <text id="scene1-label-f" x="458" y="230" class="scene1-charge-label" fill="#000" text-anchor="middle" font-weight="bold">F</text>

            <!-- A 球受力 -->
            <!-- F_BA: A 受 B 斥力，向上 -->
            <g id="scene1-force-fba" style="display: none; opacity: 0;">
                <line x1="250" y1="180" x2="250" y2="120" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrowhead-blue)" />
                <text x="235" y="145" class="scene1-force-label" fill="#1565c0">F</text>
                <text x="243" y="148" class="scene1-force-label" fill="#1565c0" font-size="10">BA</text>
            </g>
            <!-- F_CA: A 受 C 引力，向右下 -->
            <g id="scene1-force-fca" style="display: none; opacity: 0;">
                <line x1="250" y1="180" x2="300" y2="210" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrowhead-blue)" />
                <text x="285" y="200" class="scene1-force-label" fill="#1565c0">F</text>
                <text x="293" y="203" class="scene1-force-label" fill="#1565c0" font-size="10">CA</text>
            </g>

            <!-- B 球受力 -->
            <!-- F_AB: B 受 A 斥力，向下 -->
            <g id="scene1-force-fab" style="display: none; opacity: 0;">
                <line x1="250" y1="320" x2="250" y2="380" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene1-arrowhead-green)" />
                <text x="230" y="360" class="scene1-force-label" fill="#2e7d32">F</text>
                <text x="238" y="363" class="scene1-force-label" fill="#2e7d32" font-size="10">AB</text>
            </g>
            <!-- F_CB: B 受 C 引力，向右上 -->
            <g id="scene1-force-fcb" style="display: none; opacity: 0;">
                <line x1="250" y1="320" x2="300" y2="290" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene1-arrowhead-green)" />
                <text x="285" y="295" class="scene1-force-label" fill="#2e7d32">F</text>
                <text x="293" y="298" class="scene1-force-label" fill="#2e7d32" font-size="10">CB</text>
            </g>

            <!-- C 球受力 -->
            <!-- F_AC: C 受 A 引力，向左上 -->
            <g id="scene1-force-fac" style="display: none; opacity: 0;">
                <line x1="371" y1="250" x2="320" y2="220" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrowhead-red)" />
                <text x="330" y="210" class="scene1-force-label" fill="#c62828">F</text>
                <text x="338" y="213" class="scene1-force-label" fill="#c62828" font-size="10">AC</text>
            </g>
            <!-- F_BC: C 受 B 引力，向左下 -->
            <g id="scene1-force-fbc" style="display: none; opacity: 0;">
                <line x1="371" y1="250" x2="320" y2="280" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrowhead-red)" />
                <text x="330" y="280" class="scene1-force-label" fill="#c62828">F</text>
                <text x="338" y="283" class="scene1-force-label" fill="#c62828" font-size="10">BC</text>
            </g>

            <!-- 合力方向箭头（步骤 4 显示，虚线） -->
            <g id="scene1-net-a" style="display: none; opacity: 0;">
                <line x1="250" y1="180" x2="330" y2="180" stroke="#888" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#scene1-arrowhead-gray)" />
            </g>
            <g id="scene1-net-b" style="display: none; opacity: 0;">
                <line x1="250" y1="320" x2="330" y2="320" stroke="#888" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#scene1-arrowhead-gray)" />
            </g>
            <g id="scene1-net-c" style="display: none; opacity: 0;">
                <line x1="371" y1="250" x2="451" y2="250" stroke="#888" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#scene1-arrowhead-gray)" />
            </g>
        </svg>

        <!-- 控件栏 -->
        <button id="scene1-btn-prev" class="scene1-control-btn">◀ 上一步</button>
        <button id="scene1-btn-next" class="scene1-control-btn">下一步 ▶</button>
        <div id="scene1-step-indicator">步骤 1/5</div>
    </div>

    <script>
    (function() {
        // Scene 1 实现：三带电小球系统受力分析

        let currentStep = 0;
        const totalSteps = 5;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');

        // 元素引用
        const ballA = document.getElementById('scene1-ball-a');
        const ballB = document.getElementById('scene1-ball-b');
        const ballC = document.getElementById('scene1-ball-c');

        const forceFBA = document.getElementById('scene1-force-fba');
        const forceFCA = document.getElementById('scene1-force-fca');
        const forceFAB = document.getElementById('scene1-force-fab');
        const forceFCB = document.getElementById('scene1-force-fcb');
        const forceFAC = document.getElementById('scene1-force-fac');
        const forceFBC = document.getElementById('scene1-force-fbc');

        const netA = document.getElementById('scene1-net-a');
        const netB = document.getElementById('scene1-net-b');
        const netC = document.getElementById('scene1-net-c');

        // 工具函数：显示元素
        function show(el) {
            el.style.display = 'block';
            el.style.opacity = '1';
        }

        // 工具函数：隐藏元素
        function hide(el) {
            el.style.display = 'none';
            el.style.opacity = '0';
        }

        // 更新显示状态
        function updateDisplay() {
            // 重置所有球的轮廓宽度
            ballA.setAttribute('stroke-width', '2');
            ballB.setAttribute('stroke-width', '2');
            ballC.setAttribute('stroke-width', '2');

            // 隐藏所有力和合力箭头
            hide(forceFBA);
            hide(forceFCA);
            hide(forceFAB);
            hide(forceFCB);
            hide(forceFAC);
            hide(forceFBC);
            hide(netA);
            hide(netB);
            hide(netC);

            // 根据步骤显示相应元素
            switch (currentStep) {
                case 0:
                    // 初始状态：只显示基础元素
                    break;
                case 1:
                    // A 球受力分析
                    show(forceFBA);
                    show(forceFCA);
                    ballA.setAttribute('stroke-width', '3');
                    break;
                case 2:
                    // B 球受力分析
                    show(forceFBA);
                    show(forceFCA);
                    show(forceFAB);
                    show(forceFCB);
                    ballA.setAttribute('stroke-width', '2');
                    ballB.setAttribute('stroke-width', '3');
                    break;
                case 3:
                    // C 球受力分析
                    show(forceFBA);
                    show(forceFCA);
                    show(forceFAB);
                    show(forceFCB);
                    show(forceFAC);
                    show(forceFBC);
                    ballB.setAttribute('stroke-width', '2');
                    ballC.setAttribute('stroke-width', '3');
                    break;
                case 4:
                    // 合力方向展示
                    show(forceFBA);
                    show(forceFCA);
                    show(forceFAB);
                    show(forceFCB);
                    show(forceFAC);
                    show(forceFBC);
                    show(netA);
                    show(netB);
                    show(netC);
                    ballC.setAttribute('stroke-width', '2');
                    break;
            }

            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps - 1);

            // 更新步骤指示
            stepIndicator.textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;
        }

        // 按钮事件
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateDisplay();
            }
        });

        // 初始化
        updateDisplay();
    })();
    </script>
</body>
</html>
