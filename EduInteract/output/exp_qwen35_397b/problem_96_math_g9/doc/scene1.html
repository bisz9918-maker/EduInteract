<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正方体展开图折叠演示</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'SimSun', sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-svg { width: 800px; height: 500px; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 20px; z-index: 10; }
        .scene1-btn { padding: 8px 20px; font-size: 14px; cursor: pointer; border: 1px solid #333; background: #f5f5f5; border-radius: 4px; }
        .scene1-btn:hover { background: #e0e0e0; }
        .scene1-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 14px; color: #333; min-width: 80px; text-align: center; }
        
        /* 折叠面样式 */
        .scene1-fold-face { transition: transform 0.6s ease-in-out, opacity 0.3s; transform-origin: center; }
        .scene1-folded { opacity: 0.3; }
        
        /* 箭头动画 */
        .scene1-arrow { stroke-dasharray: 5,5; stroke: #c62828; stroke-width: 2; fill: none; }
        .scene1-arrow-head { fill: #c62828; }
        
        /* 正方体面 */
        .scene1-cube-face { stroke: #000; stroke-width: 2; fill: #fff; }
        .scene1-cube-hidden { opacity: 0; }
        
        /* 标签 */
        .scene1-label { font-size: 14px; fill: #000; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 展开图区域 (左侧) -->
            <g id="scene1-net-group">
                <!-- 顶部面 (圆圈面) - y=60 -->
                <g id="scene1-net-top" class="scene1-fold-face">
                    <rect x="180" y="60" width="60" height="60" fill="#fff" stroke="#000" stroke-width="2"/>
                    <circle cx="210" cy="90" r="15" fill="none" stroke="#1565c0" stroke-width="2"/>
                </g>
                
                <!-- 左阴影面 - x=60, y=120 -->
                <g id="scene1-net-left" class="scene1-fold-face">
                    <rect x="60" y="120" width="60" height="60" fill="#fff" stroke="#000" stroke-width="2"/>
                    <polygon points="60,180 60,120 120,180" fill="#2e7d32" opacity="0.5"/>
                </g>
                
                <!-- 中左空白面 - x=120, y=120 -->
                <g id="scene1-net-midleft">
                    <rect x="120" y="120" width="60" height="60" fill="#fff" stroke="#000" stroke-width="2"/>
                </g>
                
                <!-- 中右空白面 - x=180, y=120 -->
                <g id="scene1-net-midright">
                    <rect x="180" y="120" width="60" height="60" fill="#fff" stroke="#000" stroke-width="2"/>
                </g>
                
                <!-- 右阴影面 - x=240, y=120 -->
                <g id="scene1-net-right" class="scene1-fold-face">
                    <rect x="240" y="120" width="60" height="60" fill="#fff" stroke="#000" stroke-width="2"/>
                    <polygon points="300,120 300,180 240,180" fill="#2e7d32" opacity="0.5"/>
                </g>
                
                <!-- 底部空白面 - x=180, y=180 -->
                <g id="scene1-net-bottom" class="scene1-fold-face">
                    <rect x="180" y="180" width="60" height="60" fill="#fff" stroke="#000" stroke-width="2"/>
                </g>
                
                <!-- 折叠箭头1: 左面向上折叠 -->
                <g id="scene1-arrow1" class="scene1-arrow-group">
                    <path d="M 100 100 Q 90 115 100 130" class="scene1-arrow"/>
                    <polygon points="95,125 100,135 105,125" class="scene1-arrow-head"/>
                </g>
                
                <!-- 折叠箭头2: 右面向上折叠 -->
                <g id="scene1-arrow2" class="scene1-arrow-group">
                    <path d="M 260 100 Q 270 115 260 130" class="scene1-arrow"/>
                    <polygon points="255,125 260,135 265,125" class="scene1-arrow-head"/>
                </g>
                
                <!-- 折叠箭头3: 顶面向下折叠 -->
                <g id="scene1-arrow3" class="scene1-arrow-group">
                    <path d="M 200 70 Q 210 85 200 100" class="scene1-arrow"/>
                    <polygon points="195,95 200,105 205,95" class="scene1-arrow-head"/>
                </g>
                
                <!-- 标签 -->
                <text id="scene1-label-circle" x="210" y="45" text-anchor="middle" class="scene1-label">圆圈面</text>
                <text id="scene1-label-shadowA" x="90" y="105" text-anchor="middle" class="scene1-label">阴影面A</text>
                <text id="scene1-label-shadowB" x="270" y="105" text-anchor="middle" class="scene1-label">阴影面B</text>
            </g>
            
            <!-- 正方体区域 (右侧) -->
            <g id="scene1-cube-group" transform="translate(500, 150)">
                <!-- 虚线轮廓 (初始显示) -->
                <g id="scene1-cube-outline">
                    <rect x="50" y="50" width="80" height="80" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="5,5"/>
                    <text x="90" y="140" text-anchor="middle" fill="#888" font-size="12">折叠后</text>
                </g>
                
                <!-- 正方体 - 前面 (空白) -->
                <polygon id="scene1-cube-front" class="scene1-cube-face scene1-cube-hidden" 
                         points="50,130 130,130 130,210 50,210"/>
                
                <!-- 正方体 - 右面 (阴影) -->
                <g id="scene1-cube-right-group" class="scene1-cube-hidden">
                    <polygon class="scene1-cube-face" points="130,130 190,100 190,180 130,210"/>
                    <polygon points="130,130 190,100 190,180 130,210" fill="#2e7d32" opacity="0.4"/>
                </g>
                
                <!-- 正方体 - 顶面 (圆圈) -->
                <g id="scene1-cube-top-group" class="scene1-cube-hidden">
                    <polygon class="scene1-cube-face" points="50,130 130,130 190,100 110,100"/>
                    <ellipse cx="145" cy="115" rx="12" ry="8" fill="none" stroke="#1565c0" stroke-width="2"/>
                </g>
                
                <!-- 标注 -->
                <text id="scene1-label-adjacent" x="200" y="100" class="scene1-label" opacity="0">相邻</text>
                <text id="scene1-label-opposite" x="200" y="200" class="scene1-label" opacity="0">相对</text>
            </g>
            
            <!-- 分隔线 -->
            <line x1="400" y1="50" x2="400" y2="400" stroke="#ddd" stroke-width="1" stroke-dasharray="5,5"/>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/5</span>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // 状态管理
        let currentStep = 0;
        const totalSteps = 5;
        
        // DOM 元素引用
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        
        // 展开图元素
        const netTop = document.getElementById('scene1-net-top');
        const netLeft = document.getElementById('scene1-net-left');
        const netRight = document.getElementById('scene1-net-right');
        const netBottom = document.getElementById('scene1-net-bottom');
        const arrow1 = document.getElementById('scene1-arrow1');
        const arrow2 = document.getElementById('scene1-arrow2');
        const arrow3 = document.getElementById('scene1-arrow3');
        
        // 正方体元素
        const cubeOutline = document.getElementById('scene1-cube-outline');
        const cubeFront = document.getElementById('scene1-cube-front');
        const cubeRightGroup = document.getElementById('scene1-cube-right-group');
        const cubeTopGroup = document.getElementById('scene1-cube-top-group');
        const labelAdjacent = document.getElementById('scene1-label-adjacent');
        const labelOpposite = document.getElementById('scene1-label-opposite');
        
        // 标签元素
        const labelCircle = document.getElementById('scene1-label-circle');
        const labelShadowA = document.getElementById('scene1-label-shadowA');
        const labelShadowB = document.getElementById('scene1-label-shadowB');
        
        // 更新 UI 状态
        function updateUI() {
            stepIndicator.textContent = `步骤 ${currentStep + 1}/${totalSteps}`;
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps - 1;
            
            // 重置所有状态
            resetAll();
            
            // 根据当前步骤应用状态
            applyStep(currentStep);
        }
        
        // 重置所有元素
        function resetAll() {
            // 展开图恢复
            netTop.style.transform = 'none';
            netTop.style.opacity = '1';
            netLeft.style.transform = 'none';
            netLeft.style.opacity = '1';
            netRight.style.transform = 'none';
            netRight.style.opacity = '1';
            netBottom.style.transform = 'none';
            netBottom.style.opacity = '1';
            
            // 箭头显示
            arrow1.style.opacity = '1';
            arrow2.style.opacity = '1';
            arrow3.style.opacity = '1';
            
            // 正方体隐藏
            cubeOutline.style.opacity = '1';
            cubeFront.classList.add('scene1-cube-hidden');
            cubeRightGroup.classList.add('scene1-cube-hidden');
            cubeTopGroup.classList.add('scene1-cube-hidden');
            labelAdjacent.style.opacity = '0';
            labelOpposite.style.opacity = '0';
        }
        
        // 应用特定步骤
        function applyStep(step) {
            switch(step) {
                case 0:
                    // 初始状态：完整展开图
                    break;
                    
                case 1:
                    // 左右阴影面向上折叠
                    netLeft.style.transform = 'rotateY(-60deg)';
                    netLeft.style.transformOrigin = 'right center';
                    netLeft.style.opacity = '0.4';
                    netRight.style.transform = 'rotateY(60deg)';
                    netRight.style.transformOrigin = 'left center';
                    netRight.style.opacity = '0.4';
                    arrow1.style.opacity = '0.3';
                    arrow2.style.opacity = '0.3';
                    break;
                    
                case 2:
                    // 顶面圆圈面向下折叠
                    netLeft.style.transform = 'rotateY(-90deg)';
                    netLeft.style.transformOrigin = 'right center';
                    netLeft.style.opacity = '0.3';
                    netRight.style.transform = 'rotateY(90deg)';
                    netRight.style.transformOrigin = 'left center';
                    netRight.style.opacity = '0.3';
                    netTop.style.transform = 'rotateX(60deg)';
                    netTop.style.transformOrigin = 'bottom center';
                    netTop.style.opacity = '0.4';
                    arrow1.style.opacity = '0.2';
                    arrow2.style.opacity = '0.2';
                    arrow3.style.opacity = '0.3';
                    break;
                    
                case 3:
                    // 底面向上折叠
                    netLeft.style.transform = 'rotateY(-90deg)';
                    netLeft.style.transformOrigin = 'right center';
                    netLeft.style.opacity = '0.2';
                    netRight.style.transform = 'rotateY(90deg)';
                    netRight.style.transformOrigin = 'left center';
                    netRight.style.opacity = '0.2';
                    netTop.style.transform = 'rotateX(90deg)';
                    netTop.style.transformOrigin = 'bottom center';
                    netTop.style.opacity = '0.3';
                    netBottom.style.transform = 'rotateX(-60deg)';
                    netBottom.style.transformOrigin = 'top center';
                    netBottom.style.opacity = '0.4';
                    arrow1.style.opacity = '0.1';
                    arrow2.style.opacity = '0.1';
                    arrow3.style.opacity = '0.1';
                    break;
                    
                case 4:
                    // 完整正方体
                    // 隐藏展开图
                    netTop.style.opacity = '0.15';
                    netLeft.style.opacity = '0.15';
                    netRight.style.opacity = '0.15';
                    netBottom.style.opacity = '0.15';
                    arrow1.style.opacity = '0';
                    arrow2.style.opacity = '0';
                    arrow3.style.opacity = '0';
                    
                    // 显示正方体
                    cubeOutline.style.opacity = '0';
                    cubeFront.classList.remove('scene1-cube-hidden');
                    cubeRightGroup.classList.remove('scene1-cube-hidden');
                    cubeTopGroup.classList.remove('scene1-cube-hidden');
                    labelAdjacent.style.opacity = '1';
                    labelOpposite.style.opacity = '1';
                    break;
            }
        }
        
        // 事件绑定
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateUI();
            }
        });
        
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateUI();
            }
        });
        
        // 初始化
        updateUI();
    })();
    </script>
</body>
</html>
