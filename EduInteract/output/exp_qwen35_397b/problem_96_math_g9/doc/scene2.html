<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正方体展开图验证 - 场景2</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene2-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene2-svg {
            width: 800px;
            height: 500px;
        }
        .scene2-highlight {
            fill: none;
            stroke: #1565c0;
            stroke-width: 3;
            opacity: 0;
        }
        .scene2-wrong-mark {
            stroke: #c62828;
            stroke-width: 4;
            fill: none;
            opacity: 0;
        }
        .scene2-correct-mark {
            stroke: #2e7d32;
            stroke-width: 4;
            fill: none;
            opacity: 0;
        }
        .scene2-btn {
            cursor: pointer;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            padding: 8px 16px;
        }
        .scene2-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #scene2-btn-prev {
            background: #9e9e9e;
            color: #fff;
        }
        #scene2-btn-next {
            background: #1565c0;
            color: #fff;
        }
        #scene2-reason-text {
            font-size: 14px;
            fill: #333333;
            text-anchor: middle;
        }
        #scene2-step-indicator {
            font-size: 14px;
            fill: #666666;
            text-anchor: middle;
        }
        .scene2-label {
            font-size: 14px;
            fill: #333333;
            text-anchor: middle;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500">
            <!-- 高亮框 -->
            <rect id="scene2-highlight-a" class="scene2-highlight" x="75" y="75" width="110" height="110" rx="4"/>
            <rect id="scene2-highlight-b" class="scene2-highlight" x="235" y="75" width="110" height="110" rx="4"/>
            <rect id="scene2-highlight-c" class="scene2-highlight" x="395" y="75" width="110" height="110" rx="4"/>
            <rect id="scene2-highlight-d" class="scene2-highlight" x="555" y="75" width="110" height="110" rx="4"/>

            <!-- 选项A立方体 -->
            <g id="scene2-cube-a">
                <!-- 顶面（带圆圈） -->
                <polygon points="130,80 170,80 190,100 150,100" fill="#e3f2fd" stroke="#000" stroke-width="1.5"/>
                <circle cx="160" cy="90" r="8" fill="none" stroke="#1565c0" stroke-width="2"/>
                <!-- 正面（带阴影三角形） -->
                <polygon points="130,80 150,100 150,160 130,140" fill="#2e7d32" fill-opacity="0.3" stroke="#000" stroke-width="1.5"/>
                <line x1="130" y1="80" x2="150" y2="140" stroke="#000" stroke-width="1.5"/>
                <!-- 右侧面（带阴影） -->
                <polygon points="150,100 190,100 190,160 150,160" fill="#2e7d32" fill-opacity="0.3" stroke="#000" stroke-width="1.5"/>
                <line x1="150" y1="100" x2="190" y2="160" stroke="#000" stroke-width="1.5"/>
            </g>

            <!-- 选项B立方体 -->
            <g id="scene2-cube-b">
                <!-- 顶面（空白） -->
                <polygon points="290,80 330,80 350,100 310,100" fill="#fff" stroke="#000" stroke-width="1.5"/>
                <!-- 正面（带阴影三角形） -->
                <polygon points="290,80 310,100 310,160 290,140" fill="#2e7d32" fill-opacity="0.3" stroke="#000" stroke-width="1.5"/>
                <line x1="290" y1="80" x2="310" y2="140" stroke="#000" stroke-width="1.5"/>
                <!-- 右侧面（带阴影） -->
                <polygon points="310,100 350,100 350,160 310,160" fill="#2e7d32" fill-opacity="0.3" stroke="#000" stroke-width="1.5"/>
                <line x1="310" y1="100" x2="350" y2="160" stroke="#000" stroke-width="1.5"/>
            </g>

            <!-- 选项C立方体 -->
            <g id="scene2-cube-c">
                <!-- 顶面（空白） -->
                <polygon points="450,80 490,80 510,100 470,100" fill="#fff" stroke="#000" stroke-width="1.5"/>
                <!-- 正面（带圆圈） -->
                <polygon points="450,80 470,100 470,160 450,140" fill="#e3f2fd" stroke="#000" stroke-width="1.5"/>
                <circle cx="460" cy="120" r="10" fill="none" stroke="#1565c0" stroke-width="2"/>
                <!-- 右侧面（带阴影） -->
                <polygon points="470,100 510,100 510,160 470,160" fill="#2e7d32" fill-opacity="0.3" stroke="#000" stroke-width="1.5"/>
                <line x1="470" y1="100" x2="510" y2="160" stroke="#000" stroke-width="1.5"/>
            </g>

            <!-- 选项D立方体 -->
            <g id="scene2-cube-d">
                <!-- 顶面（带阴影） -->
                <polygon points="610,80 650,80 670,100 630,100" fill="#2e7d32" fill-opacity="0.3" stroke="#000" stroke-width="1.5"/>
                <!-- 正面（带阴影） -->
                <polygon points="610,80 630,100 630,160 610,140" fill="#2e7d32" fill-opacity="0.3" stroke="#000" stroke-width="1.5"/>
                <line x1="610" y1="80" x2="630" y2="140" stroke="#000" stroke-width="1.5"/>
                <!-- 右侧面（带圆圈） -->
                <polygon points="630,100 670,100 670,160 630,160" fill="#e3f2fd" stroke="#000" stroke-width="1.5"/>
                <ellipse cx="650" cy="130" rx="8" ry="10" fill="none" stroke="#1565c0" stroke-width="2"/>
            </g>

            <!-- 错误标记（叉号） -->
            <g id="scene2-mark-wrong-a" class="scene2-wrong-mark">
                <line x1="115" y1="115" x2="145" y2="145"/>
                <line x1="145" y1="115" x2="115" y2="145"/>
            </g>
            <g id="scene2-mark-wrong-c" class="scene2-wrong-mark">
                <line x1="435" y1="115" x2="465" y2="145"/>
                <line x1="465" y1="115" x2="435" y2="145"/>
            </g>
            <g id="scene2-mark-wrong-d" class="scene2-wrong-mark">
                <line x1="595" y1="115" x2="625" y2="145"/>
                <line x1="625" y1="115" x2="595" y2="145"/>
            </g>

            <!-- 正确标记（勾号） -->
            <g id="scene2-mark-correct-b" class="scene2-correct-mark">
                <polyline points="275,130 290,145 315,115"/>
            </g>

            <!-- 选项标签 -->
            <text id="scene2-label-a" class="scene2-label" x="130" y="190">选项A</text>
            <text id="scene2-label-b" class="scene2-label" x="290" y="190">选项B</text>
            <text id="scene2-label-c" class="scene2-label" x="450" y="190">选项C</text>
            <text id="scene2-label-d" class="scene2-label" x="610" y="190">选项D</text>

            <!-- 判断依据区背景 -->
            <rect x="50" y="230" width="700" height="120" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="4"/>

            <!-- 判断依据文字 -->
            <text id="scene2-reason-text" x="400" y="270">请分析各选项与展开图的对应关系</text>

            <!-- 展开图参考（小图） -->
            <g id="scene2-net-reference">
                <rect x="650" y="250" width="120" height="80" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
                <!-- 简化的展开图 -->
                <rect x="690" y="255" width="30" height="30" fill="none" stroke="#666" stroke-width="1"/>
                <circle cx="705" cy="270" r="6" fill="none" stroke="#1565c0" stroke-width="1.5"/>
                <rect x="660" y="285" width="30" height="30" fill="#2e7d32" fill-opacity="0.3" stroke="#666" stroke-width="1"/>
                <line x1="660" y1="285" x2="690" y2="315" stroke="#666" stroke-width="1"/>
                <rect x="690" y="285" width="30" height="30" fill="none" stroke="#666" stroke-width="1"/>
                <rect x="720" y="285" width="30" height="30" fill="#2e7d32" fill-opacity="0.3" stroke="#666" stroke-width="1"/>
                <line x1="720" y1="285" x2="750" y2="315" stroke="#666" stroke-width="1"/>
                <rect x="690" y="315" width="30" height="30" fill="none" stroke="#666" stroke-width="1"/>
            </g>

            <!-- 步骤指示器 -->
            <text id="scene2-step-indicator" x="400" y="490">步骤 0/5</text>
        </svg>

        <!-- 控件栏 -->
        <div id="scene2-controls" style="position: absolute; bottom: 30px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px;">
            <button id="scene2-btn-prev" class="scene2-btn">◀ 上一步</button>
            <button id="scene2-btn-next" class="scene2-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2 实现 - 四个选项对比分析与验证

        let currentStep = 0;
        const totalSteps = 5;

        // 各步骤的判断依据文字
        const reasonTexts = [
            "请分析各选项与展开图的对应关系",
            "选项A：顶面有圆圈，但展开图中圆圈面与两个阴影面不相邻，错误",
            "选项B：顶面空白，正面和右侧面阴影方向与展开图一致，符合",
            "选项C：正面有圆圈，但展开图中圆圈面应在顶部而非正面，错误",
            "选项D：顶面有阴影，但展开图中顶面应为空白面，错误",
            "结论：选项B正确！阴影面位置与展开图完全匹配"
        ];

        // 获取DOM元素
        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        const stepIndicator = document.getElementById('scene2-step-indicator');
        const reasonText = document.getElementById('scene2-reason-text');

        // 高亮框
        const highlightA = document.getElementById('scene2-highlight-a');
        const highlightB = document.getElementById('scene2-highlight-b');
        const highlightC = document.getElementById('scene2-highlight-c');
        const highlightD = document.getElementById('scene2-highlight-d');

        // 错误标记
        const markWrongA = document.getElementById('scene2-mark-wrong-a');
        const markWrongC = document.getElementById('scene2-mark-wrong-c');
        const markWrongD = document.getElementById('scene2-mark-wrong-d');

        // 正确标记
        const markCorrectB = document.getElementById('scene2-mark-correct-b');

        // 更新显示状态
        function updateDisplay() {
            // 隐藏所有高亮框和标记
            [highlightA, highlightB, highlightC, highlightD].forEach(el => el.style.opacity = '0');
            [markWrongA, markWrongC, markWrongD, markCorrectB].forEach(el => el.style.opacity = '0');

            // 根据当前步骤显示相应元素
            switch(currentStep) {
                case 0:
                    // 初始状态，无高亮
                    break;
                case 1:
                    highlightA.style.opacity = '1';
                    markWrongA.style.opacity = '1';
                    break;
                case 2:
                    highlightB.style.opacity = '1';
                    break;
                case 3:
                    highlightC.style.opacity = '1';
                    markWrongC.style.opacity = '1';
                    break;
                case 4:
                    highlightD.style.opacity = '1';
                    markWrongD.style.opacity = '1';
                    break;
                case 5:
                    highlightB.style.opacity = '1';
                    markCorrectB.style.opacity = '1';
                    break;
            }

            // 更新文字
            reasonText.textContent = reasonTexts[currentStep];
            stepIndicator.textContent = `步骤 ${currentStep}/${totalSteps}`;

            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps);
        }

        // 上一步
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        });

        // 下一步
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateDisplay();
            }
        });

        // 初始化
        updateDisplay();
    })();
    </script>
</body>
</html>
