<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一次函数 y=ax+b 图像及象限分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene2-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #1565c0; background: #e3f2fd; border-radius: 4px; }
        .scene2-btn:hover { background: #bbdefb; }
        .scene2-btn:disabled { background: #f5f5f5; border-color: #bdbdbd; cursor: not-allowed; }
        #scene2-step-indicator { font-size: 14px; color: #333; padding: 8px 16px; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" id="scene2-svg">
            <!-- 定义箭头 -->
            <defs>
                <marker id="scene2-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#000000" />
                </marker>
                <marker id="scene2-arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#c62828" />
                </marker>
            </defs>

            <!-- 象限填充区域（步骤 3 显示） -->
            <g id="scene2-quadrant-fills" style="display: none;">
                <!-- 第一象限填充（红色，不经过） -->
                <rect id="scene2-q1-fill" x="400" y="80" width="280" height="170" fill="#c62828" opacity="0.15" />
                <!-- 第二象限填充（绿色，经过） -->
                <rect id="scene2-q2-fill" x="120" y="80" width="280" height="170" fill="#2e7d32" opacity="0.15" />
                <!-- 第三象限填充（绿色，经过） -->
                <rect id="scene2-q3-fill" x="120" y="250" width="280" height="170" fill="#2e7d32" opacity="0.15" />
                <!-- 第四象限填充（绿色，经过） -->
                <rect id="scene2-q4-fill" x="400" y="250" width="280" height="170" fill="#2e7d32" opacity="0.15" />
            </g>

            <!-- 坐标轴 -->
            <g id="scene2-axes">
                <!-- x 轴 -->
                <line id="scene2-axis-x" x1="120" y1="250" x2="680" y2="250" stroke="#000000" stroke-width="3" marker-end="url(#scene2-arrowhead)" />
                <!-- y 轴 -->
                <line id="scene2-axis-y" x1="400" y1="80" x2="400" y2="420" stroke="#000000" stroke-width="3" marker-end="url(#scene2-arrowhead)" />
            </g>

            <!-- 坐标轴标签 -->
            <g id="scene2-axis-labels">
                <text id="scene2-label-o" x="385" y="265" font-size="14" fill="#000000">O</text>
                <text id="scene2-label-x" x="690" y="245" font-size="14" fill="#000000">x</text>
                <text id="scene2-label-y" x="390" y="70" font-size="14" fill="#000000">y</text>
            </g>

            <!-- 象限标注 -->
            <g id="scene2-quadrant-labels">
                <text id="scene2-q1-label" x="580" y="130" font-size="20" fill="#000000">Ⅰ</text>
                <text id="scene2-q2-label" x="220" y="130" font-size="20" fill="#000000">Ⅱ</text>
                <text id="scene2-q3-label" x="220" y="370" font-size="20" fill="#000000">Ⅲ</text>
                <text id="scene2-q4-label" x="580" y="370" font-size="20" fill="#000000">Ⅳ</text>
            </g>

            <!-- 已知条件框 -->
            <g id="scene2-condition-box">
                <rect x="50" y="50" width="130" height="40" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" />
                <text x="115" y="70" font-size="14" fill="#1565c0" text-anchor="middle">a &lt; 0, b &lt; 0</text>
            </g>

            <!-- 结论框（步骤 3 显示） -->
            <g id="scene2-conclusion-box" style="display: none;">
                <rect x="520" y="50" width="230" height="40" fill="#ffebee" stroke="#c62828" stroke-width="2" />
                <text x="635" y="70" font-size="14" fill="#c62828" text-anchor="middle">不经过第一象限</text>
            </g>

            <!-- 一次函数直线（步骤 2 显示） -->
            <g id="scene2-line-group" style="display: none;">
                <line id="scene2-line" x1="180" y1="120" x2="620" y2="380" stroke="#1565c0" stroke-width="3" />
            </g>

            <!-- y 轴截距点和标签（步骤 1 显示） -->
            <g id="scene2-intercept-group" style="display: none;">
                <circle id="scene2-intercept-point" cx="400" cy="320" r="5" fill="#c62828" />
                <text id="scene2-intercept-label" x="415" y="325" font-size="14" fill="#c62828">(0, b)</text>
                <text id="scene2-b-label" x="300" y="340" font-size="14" fill="#c62828">b &lt; 0</text>
            </g>

            <!-- 斜率箭头和标签（步骤 2 显示） -->
            <g id="scene2-slope-group" style="display: none;">
                <line id="scene2-slope-arrow" x1="500" y1="200" x2="540" y2="230" stroke="#c62828" stroke-width="2" marker-end="url(#scene2-arrowhead-red)" />
                <text id="scene2-slope-label" x="480" y="185" font-size="14" fill="#c62828">a &lt; 0</text>
            </g>

            <!-- 控件栏 -->
            <g id="scene2-controls-svg">
                <rect x="250" y="450" width="300" height="40" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1" rx="4" />
            </g>
        </svg>

        <div id="scene2-controls">
            <button id="scene2-prev-btn" class="scene2-btn">◀ 上一步</button>
            <span id="scene2-step-indicator">步骤 1/4</span>
            <button id="scene2-next-btn" class="scene2-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2: 一次函数 y=ax+b 图像及象限分析
        // 布局坐标表（实现对照依据）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // | x 轴 | 线段 | (120,250)-(680,250) | 560×3 | - | 水平居中 |
        // | y 轴 | 线段 | (400,80)-(400,420) | 3×340 | - | 垂直居中 |
        // | 原点 O | text | (385,265) | ~14×16 | - | 原点左下 |
        // | x 轴标签 | text | (690,245) | ~14×16 | - | x 轴右端 |
        // | y 轴标签 | text | (390,70) | ~14×16 | - | y 轴上端 |
        // | 第一象限Ⅰ | text | (580,130) | ~20×24 | - | 右上区域 |
        // | 第二象限Ⅱ | text | (220,130) | ~20×24 | - | 左上区域 |
        // | 第三象限Ⅲ | text | (220,370) | ~20×24 | - | 左下区域 |
        // | 第四象限Ⅳ | text | (580,370) | ~20×24 | - | 右下区域 |
        // | 一次函数直线 | 线段 | (180,120)-(620,380) | 440×260 | - | 斜率为负 |
        // | y 轴截距点 | 圆点 | (400,320) | r=5 | - | (0,b) 位置 |
        // | 截距标签 (0,b) | text | (415,325) | ~35×16 | 右侧 | 截距点右侧 |
        // | 斜率箭头 | 箭头 | (500,200)-(540,230) | 40×30 | - | 右下方向 |
        // | 斜率标签 a<0 | text | (480,185) | ~35×16 | 上方 | 箭头左上方 |
        // | 截距标签 b<0 | text | (300,340) | ~35×16 | 上方 | y 轴左侧下方 |
        // | 条件框 a<0,b<0 | rect+text | (50,50)-(180,90) | 130×40 | - | 左上角已知条件 |
        // | 结论框 | rect+text | (520,50)-(750,90) | 230×40 | - | 右上角结论 |

        let currentState = 0;
        const totalSteps = 4;

        const prevBtn = document.getElementById('scene2-prev-btn');
        const nextBtn = document.getElementById('scene2-next-btn');
        const stepIndicator = document.getElementById('scene2-step-indicator');

        // 元素组
        const interceptGroup = document.getElementById('scene2-intercept-group');
        const lineGroup = document.getElementById('scene2-line-group');
        const slopeGroup = document.getElementById('scene2-slope-group');
        const quadrantFills = document.getElementById('scene2-quadrant-fills');
        const conclusionBox = document.getElementById('scene2-conclusion-box');

        function updateDisplay() {
            // 隐藏所有动态元素
            interceptGroup.style.display = 'none';
            lineGroup.style.display = 'none';
            slopeGroup.style.display = 'none';
            quadrantFills.style.display = 'none';
            conclusionBox.style.display = 'none';

            // 根据当前状态显示相应元素
            if (currentState >= 1) {
                interceptGroup.style.display = 'block';
            }
            if (currentState >= 2) {
                lineGroup.style.display = 'block';
                slopeGroup.style.display = 'block';
            }
            if (currentState >= 3) {
                quadrantFills.style.display = 'block';
                conclusionBox.style.display = 'block';
            }

            // 更新按钮状态
            prevBtn.disabled = (currentState === 0);
            nextBtn.disabled = (currentState === totalSteps - 1);

            // 更新步骤指示器
            stepIndicator.textContent = '步骤 ' + (currentState + 1) + '/' + totalSteps;
        }

        prevBtn.addEventListener('click', function() {
            if (currentState > 0) {
                currentState--;
                updateDisplay();
            }
        });

        nextBtn.addEventListener('click', function() {
            if (currentState < totalSteps - 1) {
                currentState++;
                updateDisplay();
            }
        });

        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
