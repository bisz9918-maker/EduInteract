<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>等边三角形折叠问题</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-svg { width: 800px; height: 500px; }
        .scene1-fade-in { animation: scene1-fade 300ms ease-out forwards; }
        @keyframes scene1-fade {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .scene1-hidden { opacity: 0; display: none; }
        #scene1-btn-prev, #scene1-btn-next {
            position: absolute;
            bottom: 20px;
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            background: #1565c0;
            color: white;
            border: none;
            border-radius: 4px;
        }
        #scene1-btn-prev { left: 20px; }
        #scene1-btn-next { right: 20px; }
        #scene1-btn-prev:disabled, #scene1-btn-next:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }
        #scene1-step-indicator {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            color: #333;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <!-- 坐标表参考:
                 A(200,400), B(650,400), C(425,50)
                 D(350,400), E(320,195), F(556,245)
            -->
            
            <!-- △ABC 边框 -->
            <line id="scene1-line-ab" x1="200" y1="400" x2="650" y2="400" stroke="#000000" stroke-width="2" />
            <line id="scene1-line-bc" x1="650" y1="400" x2="425" y2="50" stroke="#000000" stroke-width="2" />
            <line id="scene1-line-ca" x1="425" y1="50" x2="200" y2="400" stroke="#000000" stroke-width="2" />
            
            <!-- 折痕 EF (初始为灰色虚线) -->
            <line id="scene1-line-ef" x1="320" y1="195" x2="556" y2="245" stroke="#888888" stroke-width="2" stroke-dasharray="4,4" />
            
            <!-- 折叠前 CE, CF (灰色虚线) -->
            <line id="scene1-line-ce" x1="425" y1="50" x2="320" y2="195" stroke="#888888" stroke-width="2" stroke-dasharray="4,4" class="scene1-hidden" />
            <line id="scene1-line-cf" x1="425" y1="50" x2="556" y2="245" stroke="#888888" stroke-width="2" stroke-dasharray="4,4" class="scene1-hidden" />
            
            <!-- 折叠后 DE, DF (蓝色实线) -->
            <line id="scene1-line-de" x1="350" y1="400" x2="320" y2="195" stroke="#1565c0" stroke-width="2" class="scene1-hidden" />
            <line id="scene1-line-df" x1="350" y1="400" x2="556" y2="245" stroke="#1565c0" stroke-width="2" class="scene1-hidden" />
            
            <!-- 顶点标记圆 -->
            <circle id="scene1-point-a" cx="200" cy="400" r="3" fill="#000000" class="scene1-hidden" />
            <circle id="scene1-point-b" cx="650" cy="400" r="3" fill="#000000" class="scene1-hidden" />
            <circle id="scene1-point-c" cx="425" cy="50" r="3" fill="#000000" class="scene1-hidden" />
            <circle id="scene1-point-d" cx="350" cy="400" r="3" fill="#000000" class="scene1-hidden" />
            <circle id="scene1-point-e" cx="320" cy="195" r="3" fill="#000000" class="scene1-hidden" />
            <circle id="scene1-point-f" cx="556" cy="245" r="3" fill="#000000" class="scene1-hidden" />
            
            <!-- 顶点标签 -->
            <text id="scene1-label-a" x="180" y="415" font-size="14" fill="#000000" class="scene1-hidden">A</text>
            <text id="scene1-label-b" x="670" y="415" font-size="14" fill="#000000" class="scene1-hidden">B</text>
            <text id="scene1-label-c" x="425" y="30" font-size="14" fill="#000000" text-anchor="middle" class="scene1-hidden">C</text>
            <text id="scene1-label-d" x="350" y="425" font-size="14" fill="#000000" text-anchor="middle" class="scene1-hidden">D</text>
            <text id="scene1-label-e" x="300" y="195" font-size="14" fill="#000000" text-anchor="end" class="scene1-hidden">E</text>
            <text id="scene1-label-f" x="580" y="245" font-size="14" fill="#000000" class="scene1-hidden">F</text>
            
            <!-- 长度标注 -->
            <text id="scene1-anno-ad" x="275" y="425" font-size="13" fill="#000000" text-anchor="middle" class="scene1-hidden">1</text>
            <text id="scene1-anno-bd" x="500" y="425" font-size="13" fill="#000000" text-anchor="middle" class="scene1-hidden">2</text>
            <text id="scene1-anno-bf" x="620" y="330" font-size="13" fill="#000000" class="scene1-hidden">1.25</text>
            
            <!-- 待求标注 ? -->
            <text id="scene1-anno-ce-q" x="305" y="110" font-size="14" fill="#c62828" font-weight="bold" text-anchor="middle" class="scene1-hidden">?</text>
            
            <!-- 控件栏 -->
            <g id="scene1-controls">
                <rect x="0" y="450" width="800" height="50" fill="#ffffff" opacity="0.9" />
                <rect id="scene1-btn-prev-bg" x="20" y="460" width="80" height="30" fill="#1565c0" rx="4" class="scene1-btn-bg" />
                <text id="scene1-btn-prev-text" x="60" y="480" font-size="14" fill="#ffffff" text-anchor="middle">◀ 上一步</text>
                <rect id="scene1-btn-next-bg" x="700" y="460" width="80" height="30" fill="#1565c0" rx="4" class="scene1-btn-bg" />
                <text id="scene1-btn-next-text" x="740" y="480" font-size="14" fill="#ffffff" text-anchor="middle">下一步 ▶</text>
                <text id="scene1-step-indicator" x="400" y="480" font-size="14" fill="#333333" text-anchor="middle">步骤 1/5</text>
            </g>
        </svg>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现 - 等边三角形折叠问题
        
        let currentStep = 0;
        const totalSteps = 5;
        
        // 每步显示的元素 ID 列表
        const steps = [
            // 步骤 0: 初始状态 - △ABC 边框，折痕 EF(灰色虚线)
            ['scene1-line-ab', 'scene1-line-bc', 'scene1-line-ca', 'scene1-line-ef'],
            // 步骤 1: 显示点 D 及标注 1, 2
            ['scene1-line-ab', 'scene1-line-bc', 'scene1-line-ca', 'scene1-line-ef',
             'scene1-point-d', 'scene1-label-d', 'scene1-anno-ad', 'scene1-anno-bd'],
            // 步骤 2: 显示点 F 及标注 1.25
            ['scene1-line-ab', 'scene1-line-bc', 'scene1-line-ca', 'scene1-line-ef',
             'scene1-point-d', 'scene1-label-d', 'scene1-anno-ad', 'scene1-anno-bd',
             'scene1-point-f', 'scene1-label-f', 'scene1-anno-bf'],
            // 步骤 3: 显示点 E，折叠后 DE, DF 蓝色实线，折叠前 CE, CF 灰色虚线
            ['scene1-line-ab', 'scene1-line-bc', 'scene1-line-ca', 'scene1-line-ef',
             'scene1-point-d', 'scene1-label-d', 'scene1-anno-ad', 'scene1-anno-bd',
             'scene1-point-f', 'scene1-label-f', 'scene1-anno-bf',
             'scene1-point-e', 'scene1-label-e',
             'scene1-line-de', 'scene1-line-df', 'scene1-line-ce', 'scene1-line-cf'],
            // 步骤 4: 显示红色 ? 标注
            ['scene1-line-ab', 'scene1-line-bc', 'scene1-line-ca', 'scene1-line-ef',
             'scene1-point-d', 'scene1-label-d', 'scene1-anno-ad', 'scene1-anno-bd',
             'scene1-point-f', 'scene1-label-f', 'scene1-anno-bf',
             'scene1-point-e', 'scene1-label-e',
             'scene1-line-de', 'scene1-line-df', 'scene1-line-ce', 'scene1-line-cf',
             'scene1-anno-ce-q']
        ];
        
        // 显示元素函数
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene1-hidden');
                el.classList.add('scene1-fade-in');
            }
        }
        
        // 隐藏元素函数
        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene1-fade-in');
                el.classList.add('scene1-hidden');
            }
        }
        
        // 更新显示状态
        function updateDisplay() {
            // 获取当前步骤和上一步的元素列表
            const currentIds = steps[currentStep];
            const prevIds = currentStep > 0 ? steps[currentStep - 1] : [];
            
            // 显示当前步骤需要的新元素
            currentIds.forEach(id => {
                if (!prevIds.includes(id)) {
                    showElement(id);
                }
            });
            
            // 更新步骤指示器
            document.getElementById('scene1-step-indicator').textContent = `步骤 ${currentStep + 1}/${totalSteps}`;
            
            // 更新按钮状态
            const prevBtn = document.getElementById('scene1-btn-prev-bg');
            const nextBtn = document.getElementById('scene1-btn-next-bg');
            const prevText = document.getElementById('scene1-btn-prev-text');
            const nextText = document.getElementById('scene1-btn-next-text');
            
            if (currentStep === 0) {
                prevBtn.setAttribute('fill', '#cccccc');
                prevText.setAttribute('fill', '#666666');
            } else {
                prevBtn.setAttribute('fill', '#1565c0');
                prevText.setAttribute('fill', '#ffffff');
            }
            
            if (currentStep === totalSteps - 1) {
                nextBtn.setAttribute('fill', '#cccccc');
                nextText.setAttribute('fill', '#666666');
            } else {
                nextBtn.setAttribute('fill', '#1565c0');
                nextText.setAttribute('fill', '#ffffff');
            }
        }
        
        // 上一步
        function prevStep() {
            if (currentStep > 0) {
                // 隐藏上一步不需要的元素
                const currentIds = steps[currentStep];
                const prevIds = steps[currentStep - 1];
                currentIds.forEach(id => {
                    if (!prevIds.includes(id)) {
                        hideElement(id);
                    }
                });
                currentStep--;
                updateDisplay();
            }
        }
        
        // 下一步
        function nextStep() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateDisplay();
            }
        }
        
        // 绑定按钮事件
        document.getElementById('scene1-btn-prev-bg').addEventListener('click', prevStep);
        document.getElementById('scene1-btn-next-bg').addEventListener('click', nextStep);
        
        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
