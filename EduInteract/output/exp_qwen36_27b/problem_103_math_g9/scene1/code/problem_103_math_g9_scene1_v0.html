<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正方形与菱形重叠 - 阴影面积计算</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-svg { width: 800px; height: 500px; display: block; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        .scene1-btn { padding: 6px 18px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-family: inherit; transition: background 0.2s; }
        .scene1-btn-prev { background: #e0e0e0; color: #333; }
        .scene1-btn-prev:hover:not(:disabled) { background: #bdbdbd; }
        .scene1-btn-next { background: #1565c0; color: #fff; }
        .scene1-btn-next:hover:not(:disabled) { background: #0d47a1; }
        .scene1-btn:disabled { opacity: 0.4; cursor: default; }
        .scene1-step-dot { width: 10px; height: 10px; border-radius: 50%; background: #ccc; transition: background 0.3s; }
        .scene1-step-dot.active { background: #1565c0; }
        .scene1-step-dot.done { background: #999; }
        .scene1-fade-in { transition: opacity 0.35s ease-in; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <style>
                    .scene1-base-line { stroke: #000; stroke-width: 2; fill: none; }
                    .scene1-aux-line { stroke: #888888; stroke-width: 1.5; stroke-dasharray: "6,4"; fill: none; }
                    .scene1-label { font-size: 15px; fill: #000; font-weight: bold; }
                    .scene1-label-blue { font-size: 14px; fill: #1565c0; font-weight: bold; }
                    .scene1-label-green { font-size: 14px; fill: #2e7d32; font-weight: bold; }
                    .scene1-label-red { font-size: 14px; fill: #c62828; font-weight: bold; }
                    .scene1-title { font-size: 18px; fill: #333; font-weight: bold; text-anchor: middle; }
                    .scene1-answer { font-size: 18px; fill: #c62828; font-weight: bold; text-anchor: middle; }
                </style>
            </defs>
            <text id="scene1-title" class="scene1-title" x="400" y="45">步骤0：已知条件</text>
            <g id="scene1-square">
                <line x1="280" y1="190" x2="280" y2="340" class="scene1-base-line" id="scene1-side-ab" />
                <line x1="280" y1="340" x2="430" y2="340" class="scene1-base-line" id="scene1-side-bc" />
                <line x1="430" y1="340" x2="430" y2="190" class="scene1-base-line" id="scene1-side-cd" />
                <line x1="430" y1="190" x2="280" y2="190" class="scene1-base-line" id="scene1-side-da" />
            </g>
            <g id="scene1-rhombus">
                <line x1="280" y1="340" x2="370" y2="220" class="scene1-base-line" id="scene1-side-bp" />
                <line x1="370" y1="220" x2="520" y2="220" class="scene1-base-line" id="scene1-side-pq" />
                <line x1="520" y1="220" x2="430" y2="340" class="scene1-base-line" id="scene1-side-qc" />
                <line x1="430" y1="340" x2="280" y2="340" class="scene1-base-line" id="scene1-side-cb-rhombus" />
            </g>
            <circle cx="430" cy="220" r="3" fill="#000" id="scene1-point-e" />
            <polygon id="scene1-shade-area" points="280,190 280,340 370,220 430,220 430,190" fill="#999999" opacity="0.3" class="scene1-fade-in" />
            <text class="scene1-label" x="265" y="182">A</text>
            <text class="scene1-label" x="265" y="358">B</text>
            <text class="scene1-label" x="445" y="358">C</text>
            <text class="scene1-label" x="445" y="182">D</text>
            <text class="scene1-label" x="380" y="105">P</text>
            <text class="scene1-label" x="535" y="225">Q</text>
            <text class="scene1-label" x="442" y="215">E</text>
            <g id="scene1-step0" class="scene1-fade-in">
                <text x="230" y="230" font-size="14" fill="#333" text-anchor="middle">正方形面积=25</text>
                <text x="570" y="310" font-size="14" fill="#333" text-anchor="middle">菱形面积=20</text>
            </g>
            <g id="scene1-step1" class="scene1-fade-in" style="display:none; opacity:0;">
                <text class="scene1-label-blue" x="355" y="380" text-anchor="middle">BC=5</text>
                <text class="scene1-label-blue" x="255" y="270" text-anchor="end">AB=5</text>
                <text class="scene1-label-blue" x="510" y="260" text-anchor="start">CD=5</text>
                <text class="scene1-label-blue" x="355" y="145" text-anchor="middle">DA=5</text>
            </g>
            <g id="scene1-step2" class="scene1-fade-in" style="display:none; opacity:0;">
                <line x1="370" y1="220" x2="370" y2="340" class="scene1-aux-line" />
                <circle cx="370" cy="340" r="3" fill="#888888" />
                <polyline points="370,330 380,330 380,340" fill="none" stroke="#888888" stroke-width="1" />
                <text class="scene1-label-green" x="260" y="250" text-anchor="end">PF=4</text>
                <text class="scene1-label" x="400" y="380" text-anchor="middle" font-size="14" fill="#888888">F</text>
            </g>
            <g id="scene1-step3" class="scene1-fade-in" style="display:none; opacity:0;">
                <text class="scene1-label-green" x="260" y="310" text-anchor="end">PB=5</text>
                <text class="scene1-label-green" x="310" y="410" text-anchor="middle">BF=3</text>
                <text class="scene1-label-green" x="410" y="170" text-anchor="middle">PE=2</text>
                <polyline points="370,220 370,340 300,340 370,220" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="4,3" opacity="0.5" />
            </g>
            <g id="scene1-step4" class="scene1-fade-in" style="display:none; opacity:0;">
                <polygon points="280,340 370,220 430,220 430,340" fill="#1565c0" opacity="0.2" />
                <text class="scene1-label-blue" x="450" y="400" text-anchor="middle">(2+5)×4÷2=14</text>
            </g>
            <g id="scene1-step5" class="scene1-fade-in" style="display:none; opacity:0;">
                <text class="scene1-label-red" x="210" y="155" text-anchor="middle" font-size="16">25-14=11</text>
                <text class="scene1-answer" x="400" y="470">A. 11</text>
            </g>
            <g id="scene1-indicators">
                <circle cx="320" cy="455" r="5" class="scene1-step-dot active" id="scene1-dot-0" />
                <circle cx="350" cy="455" r="5" class="scene1-step-dot" id="scene1-dot-1" />
                <circle cx="380" cy="455" r="5" class="scene1-step-dot" id="scene1-dot-2" />
                <circle cx="410" cy="455" r="5" class="scene1-step-dot" id="scene1-dot-3" />
                <circle cx="440" cy="455" r="5" class="scene1-step-dot" id="scene1-dot-4" />
                <circle cx="470" cy="455" r="5" class="scene1-step-dot" id="scene1-dot-5" />
            </g>
        </svg>
        <div id="scene1-controls">
            <button id="scene1-prev-btn" class="scene1-btn scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-next-btn" class="scene1-btn scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    <script>
    (function() {
        'use strict';
        var currentStep = 0;
        var totalSteps = 5;
        var titles = [
            "步骤0：已知条件",
            "步骤1：正方形边长 = √25 = 5",
            "步骤2：菱形高 PF = 20÷5 = 4",
            "步骤3：勾股定理 BF = √(5²-4²) = 3",
            "步骤4：梯形BPEC面积 = (2+5)×4÷2 = 14",
            "步骤5：阴影面积 = 25 - 14 = 11"
        ];
        function show(el) { el.style.display = ''; el.style.opacity = '1'; }
        function hide(el) { el.style.display = 'none'; el.style.opacity = '0'; }
        function renderStep(step) {
            document.getElementById('scene1-title').textContent = titles[step];
            for (var i = 0; i <= totalSteps; i++) {
                var g = document.getElementById('scene1-step' + i);
                if (g) hide(g);
            }
            var lines = ['scene1-side-ab','scene1-side-bc','scene1-side-cd','scene1-side-da','scene1-side-bp','scene1-side-pq','scene1-side-qc','scene1-side-cb-rhombus'];
            lines.forEach(function(id) {
                var el = document.getElementById(id);
                el.setAttribute('stroke', '#000');
                el.setAttribute('stroke-width', '2');
            });
            var shadeArea = document.getElementById('scene1-shade-area');
            shadeArea.setAttribute('fill', '#999999');
            shadeArea.setAttribute('opacity', '0.3');
            if (step >= 0) show(document.getElementById('scene1-step0'));
            if (step >= 1) {
                show(document.getElementById('scene1-step1'));
                ['scene1-side-ab','scene1-side-bc','scene1-side-cd','scene1-side-da'].forEach(function(id) {
                    var el = document.getElementById(id);
                    el.setAttribute('stroke', '#1565c0');
                    el.setAttribute('stroke-width', '3');
                });
            }
            if (step >= 2) {
                show(document.getElementById('scene1-step2'));
                var bc = document.getElementById('scene1-side-bc');
                bc.setAttribute('stroke', '#2e7d32');
                bc.setAttribute('stroke-width', '3');
            }
            if (step >= 3) {
                show(document.getElementById('scene1-step3'));
                var bp = document.getElementById('scene1-side-bp');
                bp.setAttribute('stroke', '#2e7d32');
                bp.setAttribute('stroke-width', '3');
            }
            if (step >= 4) {
                show(document.getElementById('scene1-step4'));
                var pq = document.getElementById('scene1-side-pq');
                pq.setAttribute('stroke', '#1565c0');
                pq.setAttribute('stroke-width', '3');
                var bc2 = document.getElementById('scene1-side-bc');
                bc2.setAttribute('stroke', '#1565c0');
                bc2.setAttribute('stroke-width', '3');
            }
            if (step >= 5) {
                show(document.getElementById('scene1-step5'));
                shadeArea.setAttribute('fill', '#c62828');
                shadeArea.setAttribute('opacity', '0.25');
            }
            for (var i = 0; i <= totalSteps; i++) {
                var dot = document.getElementById('scene1-dot-' + i);
                dot.classList.remove('active', 'done');
                if (i < step) dot.classList.add('done');
                else if (i === step) dot.classList.add('active');
            }
            document.getElementById('scene1-prev-btn').disabled = (step === 0);
            document.getElementById('scene1-next-btn').disabled = (step === totalSteps);
        }
        document.getElementById('scene1-next-btn').addEventListener('click', function() {
            if (currentStep < totalSteps) { currentStep++; renderStep(currentStep); }
        });
        document.getElementById('scene1-prev-btn').addEventListener('click', function() {
            if (currentStep > 0) { currentStep--; renderStep(currentStep); }
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                if (currentStep < totalSteps) { currentStep++; renderStep(currentStep); }
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                if (currentStep > 0) { currentStep--; renderStep(currentStep); }
            }
        });
        renderStep(0);
    })();
    </script>
</body>
</html>
