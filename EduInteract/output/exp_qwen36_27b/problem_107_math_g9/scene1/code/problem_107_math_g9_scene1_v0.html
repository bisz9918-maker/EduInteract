<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>屋架结构图示 - Scene 1</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "SimHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-svg { width: 800px; height: 500px; display: block; }
        .scene1-transition { transition: opacity 0.3s ease, fill 0.3s ease, stroke 0.3s ease; }

        #scene1-formula-container {
            position: absolute;
            left: 560px;
            top: 80px;
            width: 210px;
            height: 290px;
            background: #f5f5f5;
            border: 1px solid #cccccc;
            border-radius: 6px;
            padding: 10px 15px;
            box-sizing: border-box;
            z-index: 5;
        }
        #scene1-formula-title {
            font-size: 14px;
            font-weight: bold;
            color: #333333;
            text-align: center;
            margin: 0 0 10px 0;
        }
        .scene1-formula-line {
            font-size: 13px;
            color: #333333;
            margin: 10px 0;
            line-height: 1.4;
        }
        .scene1-formula-line-bold {
            font-size: 18px;
            color: #2e7d32;
            font-weight: bold;
            margin: 10px 0;
        }

        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 40px;
            z-index: 10;
        }
        .scene1-btn {
            padding: 6px 24px;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            color: #ffffff;
            cursor: pointer;
            font-family: "Microsoft YaHei", "SimHei", sans-serif;
        }
        .scene1-btn-active {
            background: #1565c0;
        }
        .scene1-btn-active:hover {
            background: #0d47a1;
        }
        .scene1-btn-disabled {
            background: #cccccc;
            cursor: default;
        }

        #scene1-step-indicator {
            position: absolute;
            bottom: 48px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            color: #666666;
            z-index: 10;
        }

        #scene1-conclusion {
            position: absolute;
            bottom: 72px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 18px;
            color: #2e7d32;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 10;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <!-- ===== 三角形高亮多边形（底层） ===== -->
            <polygon id="scene1-highlight-abc" points="120,380 466,180 466,380" fill="#1565c0" fill-opacity="0" stroke="#1565c0" stroke-width="0" opacity="0" class="scene1-transition" />
            <polygon id="scene1-highlight-ade" points="120,380 293,280 293,380" fill="#1565c0" fill-opacity="0" stroke="#1565c0" stroke-width="0" opacity="0" class="scene1-transition" />

            <!-- ===== 主线段 ===== -->
            <line id="scene1-line-ab" x1="120" y1="380" x2="466" y2="180" stroke="#000000" stroke-width="2" />
            <line id="scene1-line-bc" x1="466" y1="180" x2="466" y2="380" stroke="#000000" stroke-width="2" class="scene1-transition" />
            <line id="scene1-line-ac" x1="120" y1="380" x2="466" y2="380" stroke="#000000" stroke-width="2" />
            <line id="scene1-line-de" x1="293" y1="280" x2="293" y2="380" stroke="#000000" stroke-width="2" class="scene1-transition" />

            <!-- ===== 顶点圆点 ===== -->
            <circle id="scene1-point-a" cx="120" cy="380" r="3" fill="#000000" />
            <circle id="scene1-point-b" cx="466" cy="180" r="3" fill="#000000" />
            <circle id="scene1-point-c" cx="466" cy="380" r="3" fill="#000000" />
            <circle id="scene1-point-d" cx="293" cy="280" r="3" fill="#000000" />
            <circle id="scene1-point-e" cx="293" cy="380" r="3" fill="#000000" />

            <!-- ===== 直角符号 ===== -->
            <path id="scene1-right-angle-c" d="M450,380 L450,364 L466,364" fill="none" stroke="#000000" stroke-width="1.5" />
            <path id="scene1-right-angle-e" d="M277,380 L277,364 L293,364" fill="none" stroke="#000000" stroke-width="1.5" />

            <!-- ===== 角度弧线 ===== -->
            <path id="scene1-angle-arc" d="M145,380 A25,25 0 0,0 141.7,367.7" fill="none" stroke="#000000" stroke-width="1.2" />

            <!-- ===== 标签 ===== -->
            <text id="scene1-label-a" x="100" y="385" font-size="16" fill="#000000" font-weight="bold">A</text>
            <text id="scene1-label-b" x="466" y="165" font-size="16" fill="#000000" font-weight="bold" text-anchor="middle">B</text>
            <text id="scene1-label-c" x="480" y="385" font-size="16" fill="#000000" font-weight="bold">C</text>
            <!-- D标签：移到AB线上方左侧，与AB=8m分开 -->
            <text id="scene1-label-d" x="260" y="155" font-size="16" fill="#000000" font-weight="bold">D</text>
            <text id="scene1-label-e" x="293" y="400" font-size="16" fill="#000000" font-weight="bold" text-anchor="middle">E</text>

            <!-- 角度标注：移到AC线下方 -->
            <text id="scene1-label-angle-a" x="148" y="398" font-size="14" fill="#000000">30°</text>

            <!-- AB长度标注：移到AB线上方右侧 -->
            <text id="scene1-label-ab-len" x="300" y="155" font-size="14" fill="#000000">AB = 8m</text>

            <!-- 动态标签（初始隐藏） -->
            <text id="scene1-label-bc-len" x="485" y="285" font-size="14" fill="#2e7d32" font-weight="bold" opacity="0" class="scene1-transition">BC = 4m</text>
            <text id="scene1-label-de-len" x="255" y="335" font-size="14" fill="#2e7d32" font-weight="bold" opacity="0" class="scene1-transition">DE = 2m</text>
            <!-- AD=DB=4m：移到AB线上方，与D和AB=8m分开 -->
            <text id="scene1-label-ad-db" x="230" y="135" font-size="14" fill="#c62828" font-weight="bold" opacity="0" class="scene1-transition">AD = DB = 4m</text>

            <!-- ===== D点中点标记（初始隐藏） ===== -->
            <circle id="scene1-midpoint-marker" cx="293" cy="280" r="6" fill="#c62828" opacity="0" class="scene1-transition" />

            <!-- ===== 平行标记（初始隐藏） ===== -->
            <g id="scene1-parallel-mark" opacity="0" class="scene1-transition">
                <line x1="283" y1="290" x2="283" y2="370" stroke="#e65100" stroke-width="1.5" stroke-dasharray="4,3" />
                <polygon points="283,370 279,362 287,362" fill="#e65100" />
                <line x1="456" y1="190" x2="456" y2="370" stroke="#e65100" stroke-width="1.5" stroke-dasharray="4,3" />
                <polygon points="456,370 452,362 460,362" fill="#e65100" />
                <text x="478" y="285" font-size="13" fill="#e65100" font-weight="bold">DE ∥ BC</text>
            </g>
        </svg>

        <!-- ===== 公式框（HTML元素） ===== -->
        <div id="scene1-formula-container">
            <div id="scene1-formula-title">已知条件</div>
            <div id="scene1-formula-line1" class="scene1-formula-line">AB = 8m</div>
            <div id="scene1-formula-line2" class="scene1-formula-line">∠A = 30°</div>
            <div id="scene1-formula-line3" class="scene1-formula-line">D为AB中点</div>
            <div id="scene1-formula-line4" class="scene1-formula-line">BC⊥AC, DE⊥AC</div>
        </div>

        <!-- ===== 结论横幅 ===== -->
        <div id="scene1-conclusion">答案：B. 2m</div>

        <!-- ===== 步骤指示器 ===== -->
        <div id="scene1-step-indicator">0 / 4</div>

        <!-- ===== 按钮 ===== -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn scene1-btn-disabled">◀ 上一步</button>
            <button id="scene1-btn-next" class="scene1-btn scene1-btn-active">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        'use strict';

        var currentStep = 0;
        var maxStep = 4;

        var highlightABC = document.getElementById('scene1-highlight-abc');
        var highlightADE = document.getElementById('scene1-highlight-ade');
        var lineBC = document.getElementById('scene1-line-bc');
        var lineDE = document.getElementById('scene1-line-de');
        var labelBCLen = document.getElementById('scene1-label-bc-len');
        var labelDELen = document.getElementById('scene1-label-de-len');
        var labelADDB = document.getElementById('scene1-label-ad-db');
        var midpointMarker = document.getElementById('scene1-midpoint-marker');
        var parallelMark = document.getElementById('scene1-parallel-mark');
        var formulaTitle = document.getElementById('scene1-formula-title');
        var formulaLine1 = document.getElementById('scene1-formula-line1');
        var formulaLine2 = document.getElementById('scene1-formula-line2');
        var formulaLine3 = document.getElementById('scene1-formula-line3');
        var formulaLine4 = document.getElementById('scene1-formula-line4');
        var conclusion = document.getElementById('scene1-conclusion');
        var stepIndicator = document.getElementById('scene1-step-indicator');
        var btnPrev = document.getElementById('scene1-btn-prev');
        var btnNext = document.getElementById('scene1-btn-next');

        var steps = [
            {
                formulaTitle: '已知条件',
                formulaLines: ['AB = 8m', '∠A = 30°', 'D为AB中点', 'BC⊥AC, DE⊥AC'],
                highlightABC: false, highlightADE: false,
                showBC: false, showDE: false, showMidpoint: false, showParallel: false,
                showADDB: false, showConclusion: false,
                prevDisabled: true, nextDisabled: false
            },
            {
                formulaTitle: '在Rt△ABC中：',
                formulaLines: ['BC = AB × sin30°', 'BC = 8 × 1/2 = 4m', '', ''],
                highlightABC: true, highlightADE: false,
                showBC: true, showDE: false, showMidpoint: false, showParallel: false,
                showADDB: false, showConclusion: false,
                prevDisabled: false, nextDisabled: false
            },
            {
                formulaTitle: 'D为AB中点：',
                formulaLines: ['AD = DB = 4m', 'DE∥BC（同垂直于AC）', '→ DE为中位线', ''],
                highlightABC: false, highlightADE: false,
                showBC: false, showDE: false, showMidpoint: true, showParallel: true,
                showADDB: true, showConclusion: false,
                prevDisabled: false, nextDisabled: false
            },
            {
                formulaTitle: '方法一（三角函数）：',
                formulaLines: ['DE = AD × sin30°', 'DE = 4 × 1/2 = 2m', '方法二（中位线定理）：', 'DE = BC/2 = 4/2 = 2m'],
                highlightABC: false, highlightADE: true,
                showBC: false, showDE: true, showMidpoint: false, showParallel: false,
                showADDB: false, showConclusion: false,
                prevDisabled: false, nextDisabled: false
            },
            {
                formulaTitle: '最终答案：',
                formulaLines: ['DE = 2m', '', '', ''],
                highlightABC: false, highlightADE: false,
                showBC: false, showDE: true, showMidpoint: false, showParallel: false,
                showADDB: false, showConclusion: true,
                prevDisabled: false, nextDisabled: true
            }
        ];

        function renderStep(step) {
            var cfg = steps[step];
            stepIndicator.textContent = step + ' / 4';

            if (cfg.highlightABC) {
                highlightABC.setAttribute('opacity', '1');
                highlightABC.setAttribute('fill-opacity', '0.15');
                highlightABC.setAttribute('stroke-width', '3');
            } else {
                highlightABC.setAttribute('opacity', '0');
                highlightABC.setAttribute('fill-opacity', '0');
                highlightABC.setAttribute('stroke-width', '0');
            }

            if (cfg.highlightADE) {
                highlightADE.setAttribute('opacity', '1');
                highlightADE.setAttribute('fill-opacity', '0.15');
                highlightADE.setAttribute('stroke-width', '3');
            } else {
                highlightADE.setAttribute('opacity', '0');
                highlightADE.setAttribute('fill-opacity', '0');
                highlightADE.setAttribute('stroke-width', '0');
            }

            if (cfg.showBC) {
                lineBC.setAttribute('stroke', '#2e7d32');
                lineBC.setAttribute('stroke-width', '3');
            } else {
                lineBC.setAttribute('stroke', '#000000');
                lineBC.setAttribute('stroke-width', '2');
            }

            if (cfg.showDE) {
                lineDE.setAttribute('stroke', '#2e7d32');
                lineDE.setAttribute('stroke-width', step === 4 ? '4' : '3');
            } else {
                lineDE.setAttribute('stroke', '#000000');
                lineDE.setAttribute('stroke-width', '2');
            }

            labelBCLen.setAttribute('opacity', cfg.showBC ? '1' : '0');
            labelDELen.setAttribute('opacity', cfg.showDE ? '1' : '0');
            labelADDB.setAttribute('opacity', cfg.showADDB ? '1' : '0');
            midpointMarker.setAttribute('opacity', cfg.showMidpoint ? '1' : '0');
            parallelMark.setAttribute('opacity', cfg.showParallel ? '1' : '0');

            formulaTitle.textContent = cfg.formulaTitle;

            for (var i = 1; i <= 4; i++) {
                var el = document.getElementById('scene1-formula-line' + i);
                el.className = 'scene1-formula-line';
                el.textContent = '';
                el.style.display = 'none';
            }

            for (var j = 0; j < 4; j++) {
                if (cfg.formulaLines[j]) {
                    var lineEl = document.getElementById('scene1-formula-line' + (j + 1));
                    lineEl.textContent = cfg.formulaLines[j];
                    lineEl.style.display = 'block';
                }
            }

            if (step === 4) {
                var line3El = document.getElementById('scene1-formula-line3');
                line3El.className = 'scene1-formula-line-bold';
                line3El.textContent = '选 B. 2m';
                line3El.style.display = 'block';
            }

            conclusion.style.opacity = cfg.showConclusion ? '1' : '0';
            updateButtons(cfg.prevDisabled, cfg.nextDisabled);
        }

        function updateButtons(prevDisabled, nextDisabled) {
            if (prevDisabled) {
                btnPrev.className = 'scene1-btn scene1-btn-disabled';
            } else {
                btnPrev.className = 'scene1-btn scene1-btn-active';
            }

            if (nextDisabled) {
                btnNext.className = 'scene1-btn scene1-btn-disabled';
            } else {
                btnNext.className = 'scene1-btn scene1-btn-active';
            }
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep(currentStep);
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < maxStep) {
                currentStep++;
                renderStep(currentStep);
            }
        });

        renderStep(0);

    })();
    </script>
</body>
</html>
