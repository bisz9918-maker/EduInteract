<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>等腰三角形中的角度推导与垂直平分线性质</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-svg { width: 800px; height: 500px; display: block; }
        .step-element { opacity: 0; transition: opacity 0.3s ease; pointer-events: none; }
        .step-element.visible { opacity: 1; }
        #scene1-controls {
            position: absolute; bottom: 12px; left: 0; right: 0;
            display: flex; justify-content: center; align-items: center; gap: 24px; z-index: 10;
        }
        #scene1-controls button {
            padding: 8px 22px; font-size: 14px; cursor: pointer;
            border: 1px solid #555; border-radius: 5px; background: #f0f0f0;
            font-family: "Microsoft YaHei", sans-serif; color: #333;
        }
        #scene1-controls button:disabled { opacity: 0.35; cursor: not-allowed; }
        #scene1-controls button:hover:not(:disabled) { background: #ddd; }
        #scene1-step-indicator { font-size: 14px; color: #444; min-width: 90px; text-align: center; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- ===== 填充区域（步骤7，最底层） ===== -->
            <polygon id="scene1-fill-bce" points="307,365 458,257 493,365" fill="#2e7d32" fill-opacity="0.15" class="step-element"/>

            <!-- ===== 三角形ABC三边 ===== -->
            <line id="scene1-tri-ab" x1="400" y1="80" x2="307" y2="365" stroke="#000000" stroke-width="2"/>
            <line id="scene1-tri-ac" x1="400" y1="80" x2="493" y2="365" stroke="#000000" stroke-width="2"/>
            <line id="scene1-tri-bc" x1="307" y1="365" x2="493" y2="365" stroke="#000000" stroke-width="2"/>

            <!-- ===== 线段DE（延伸出三角形） ===== -->
            <line id="scene1-line-de" x1="100" y1="140" x2="700" y2="336" stroke="#000000" stroke-width="2"/>

            <!-- ===== 线段BE ===== -->
            <line id="scene1-line-be" x1="307" y1="365" x2="458" y2="257" stroke="#000000" stroke-width="2"/>

            <!-- ===== 高亮线段（覆盖在原线段上方） ===== -->
            <line id="scene1-highlight-ae" x1="400" y1="80" x2="458" y2="257" stroke="#2e7d32" stroke-width="3" class="step-element"/>
            <line id="scene1-highlight-be" x1="307" y1="365" x2="458" y2="257" stroke="#2e7d32" stroke-width="3" class="step-element"/>
            <line id="scene1-highlight-bc" x1="307" y1="365" x2="493" y2="365" stroke="#2e7d32" stroke-width="3" class="step-element"/>

            <!-- ===== 角度弧线 ===== -->
            <path id="scene1-arc-c" fill="none" stroke="#c62828" stroke-width="1.5" class="step-element"/>
            <path id="scene1-arc-b" fill="none" stroke="#1565c0" stroke-width="1.5" class="step-element"/>
            <path id="scene1-arc-a" fill="none" stroke="#1565c0" stroke-width="1.5" class="step-element"/>
            <path id="scene1-arc-eba" fill="none" stroke="#1565c0" stroke-width="1.5" class="step-element"/>
            <path id="scene1-arc-ebc" fill="none" stroke="#1565c0" stroke-width="1.5" class="step-element"/>
            <path id="scene1-arc-bec" fill="none" stroke="#1565c0" stroke-width="1.5" class="step-element"/>

            <!-- ===== 等长标记 ===== -->
            <line id="scene1-mark-ad" stroke="#c62828" stroke-width="2" class="step-element"/>
            <line id="scene1-mark-db" stroke="#c62828" stroke-width="2" class="step-element"/>

            <!-- ===== 直角符号 ===== -->
            <polygon id="scene1-right-angle" fill="none" stroke="#000000" stroke-width="1.5" class="step-element"/>

            <!-- ===== 顶点标签（始终显示） ===== -->
            <text id="scene1-label-a" x="400" y="62" text-anchor="middle" font-size="17" fill="#000" font-weight="bold">A</text>
            <text id="scene1-label-b" x="285" y="398" text-anchor="middle" font-size="17" fill="#000" font-weight="bold">B</text>
            <text id="scene1-label-c" x="515" y="398" text-anchor="middle" font-size="17" fill="#000" font-weight="bold">C</text>
            <text id="scene1-label-d" x="335" y="218" text-anchor="middle" font-size="16" fill="#000" font-weight="bold">D</text>
            <text id="scene1-label-e" x="480" y="252" text-anchor="middle" font-size="16" fill="#000" font-weight="bold">E</text>

            <!-- ===== 步骤1：已知条件标注 ===== -->
            <text id="scene1-len-ab" x="295" y="155" text-anchor="middle" font-size="16" fill="#c62828" font-weight="bold" class="step-element">4</text>
            <text id="scene1-len-ac" x="490" y="165" text-anchor="middle" font-size="16" fill="#c62828" font-weight="bold" class="step-element">4</text>
            <text id="scene1-angle-c" x="485" y="358" text-anchor="middle" font-size="15" fill="#c62828" font-weight="bold" class="step-element">72°</text>

            <!-- ===== 步骤2：角度推导 ===== -->
            <text id="scene1-angle-b" x="315" y="352" text-anchor="middle" font-size="15" fill="#1565c0" font-weight="bold" class="step-element">72°</text>
            <text id="scene1-angle-a" x="400" y="108" text-anchor="middle" font-size="15" fill="#1565c0" font-weight="bold" class="step-element">36°</text>

            <!-- ===== 步骤3：垂直关系 ===== -->
            <text id="scene1-perp-label" x="275" y="195" text-anchor="middle" font-size="14" fill="#000000" class="step-element">DE⊥AB</text>

            <!-- ===== 步骤4：AE=BE ===== -->
            <text id="scene1-rel-ae-be" x="440" y="158" text-anchor="middle" font-size="16" fill="#2e7d32" font-weight="bold" class="step-element">AE=BE</text>

            <!-- ===== 步骤5：∠EBA=36° ===== -->
            <text id="scene1-angle-eba" x="305" y="288" text-anchor="middle" font-size="15" fill="#1565c0" font-weight="bold" class="step-element">36°</text>

            <!-- ===== 步骤6：∠EBC=36°，∠BEC=72° ===== -->
            <text id="scene1-angle-ebc" x="355" y="355" text-anchor="middle" font-size="15" fill="#1565c0" font-weight="bold" class="step-element">36°</text>
            <text id="scene1-angle-bec" x="445" y="295" text-anchor="middle" font-size="15" fill="#1565c0" font-weight="bold" class="step-element">72°</text>

            <!-- ===== 步骤7：BE=BC ===== -->
            <text id="scene1-rel-be-bc" x="390" y="308" text-anchor="middle" font-size="16" fill="#2e7d32" font-weight="bold" class="step-element">BE=BC</text>

            <!-- ===== 提示文字 ===== -->
            <text id="scene1-hint-text" x="400" y="432" text-anchor="middle" font-size="14" fill="#333"></text>
        </svg>

        <!-- ===== 控件栏 ===== -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 0/7</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() { 'use strict';

        // ===== 坐标常量 =====
        // 布局坐标表（来自spec.json规划）：
        // A(400,80) B(307,365) C(493,365) D(354,223) E(458,257)
        var A = [400, 80];
        var B = [307, 365];
        var C = [493, 365];
        var D = [354, 223];
        var E = [458, 257];

        // ===== 颜色常量 =====
        var COLOR_RED   = '#c62828';
        var COLOR_BLUE  = '#1565c0';
        var COLOR_GREEN = '#2e7d32';

        // ===== 工具函数：计算角度弧线SVG路径 =====
        function arcPath(vertex, p1, p2, radius) {
            var dx1 = p1[0] - vertex[0], dy1 = p1[1] - vertex[1];
            var dx2 = p2[0] - vertex[0], dy2 = p2[1] - vertex[1];
            var a1 = Math.atan2(dy1, dx1);
            var a2 = Math.atan2(dy2, dx2);

            var sx = vertex[0] + radius * Math.cos(a1);
            var sy = vertex[1] + radius * Math.sin(a1);
            var ex = vertex[0] + radius * Math.cos(a2);
            var ey = vertex[1] + radius * Math.sin(a2);

            var diff = a2 - a1;
            while (diff > Math.PI) diff -= 2 * Math.PI;
            while (diff < -Math.PI) diff += 2 * Math.PI;
            var sweep = diff > 0 ? 1 : 0;

            return 'M ' + sx.toFixed(1) + ',' + sy.toFixed(1) +
                   ' A ' + radius + ',' + radius + ' 0 0,' + sweep + ' ' +
                   ex.toFixed(1) + ',' + ey.toFixed(1);
        }

        // ===== 工具函数：显示/隐藏元素 =====
        function showEl(id) {
            var el = document.getElementById(id);
            if (el) { el.style.opacity = '1'; el.classList.add('visible'); }
        }
        function hideEl(id) {
            var el = document.getElementById(id);
            if (el) { el.style.opacity = '0'; el.classList.remove('visible'); }
        }

        // ===== 元素可见性映射：元素ID -> 从哪一步开始可见 =====
        var elementSteps = {
            // 步骤1：已知条件
            'scene1-len-ab': 1, 'scene1-len-ac': 1,
            'scene1-angle-c': 1, 'scene1-arc-c': 1,
            'scene1-mark-ad': 1, 'scene1-mark-db': 1,
            // 步骤2：角度推导
            'scene1-angle-b': 2, 'scene1-arc-b': 2,
            'scene1-angle-a': 2, 'scene1-arc-a': 2,
            // 步骤3：垂直关系
            'scene1-right-angle': 3, 'scene1-perp-label': 3,
            // 步骤4：AE=BE
            'scene1-highlight-ae': 4, 'scene1-highlight-be': 4,
            'scene1-rel-ae-be': 4,
            // 步骤5：∠EBA=36°
            'scene1-angle-eba': 5, 'scene1-arc-eba': 5,
            // 步骤6：∠EBC=36°，∠BEC=72°
            'scene1-angle-ebc': 6, 'scene1-arc-ebc': 6,
            'scene1-angle-bec': 6, 'scene1-arc-bec': 6,
            // 步骤7：BE=BC
            'scene1-highlight-bc': 7, 'scene1-rel-be-bc': 7,
            'scene1-fill-bce': 7
        };

        // ===== 提示文字 =====
        var hints = [
            '',
            '已知：AB=AC=4，∠C=72°，D为AB中点',
            '∵AB=AC，∴∠B=∠C=72°，∠A=180°−72°−72°=36°',
            'DE⊥AB 且 D为AB中点 → DE是AB的垂直平分线',
            '垂直平分线上的点到线段两端距离相等 → AE=BE',
            '∵AE=BE，∴∠EBA=∠A=36°',
            '∠EBC=∠ABC−∠EBA=72°−36°=36°，∠BEC=180°−72°−36°=72°',
            '∵∠BEC=∠C=72°，∴BE=BC → AE=BE=BC'
        ];

        var hintColors = [
            '', COLOR_RED, COLOR_BLUE, '#000000',
            COLOR_GREEN, COLOR_BLUE, COLOR_BLUE, COLOR_GREEN
        ];

        // ===== 当前步骤 =====
        var currentStep = 0;

        // ===== 渲染指定步骤 =====
        function renderStep(step) {
            currentStep = step;

            // 更新所有步骤元素的可见性
            var keys = Object.keys(elementSteps);
            for (var i = 0; i < keys.length; i++) {
                var id = keys[i];
                if (step >= elementSteps[id]) {
                    showEl(id);
                } else {
                    hideEl(id);
                }
            }

            // 更新提示文字
            var hintEl = document.getElementById('scene1-hint-text');
            hintEl.textContent = hints[step];
            hintEl.setAttribute('fill', hintColors[step] || '#333');
            if (step === 0) {
                hintEl.style.opacity = '0';
            } else {
                hintEl.style.opacity = '1';
            }

            // 更新按钮状态
            document.getElementById('scene1-btn-prev').disabled = (step === 0);
            document.getElementById('scene1-btn-next').disabled = (step === 7);

            // 更新步骤指示器
            document.getElementById('scene1-step-indicator').textContent = '步骤 ' + step + '/7';
        }

        // ===== 按钮事件 =====
        document.getElementById('scene1-btn-prev').addEventListener('click', function() {
            if (currentStep > 0) renderStep(currentStep - 1);
        });
        document.getElementById('scene1-btn-next').addEventListener('click', function() {
            if (currentStep < 7) renderStep(currentStep + 1);
        });

        // ===== 初始化：计算并设置所有动态SVG属性 =====

        // 角度弧线
        document.getElementById('scene1-arc-c').setAttribute('d', arcPath(C, B, A, 20));
        document.getElementById('scene1-arc-b').setAttribute('d', arcPath(B, C, A, 20));
        document.getElementById('scene1-arc-a').setAttribute('d', arcPath(A, B, C, 20));
        document.getElementById('scene1-arc-eba').setAttribute('d', arcPath(B, E, A, 15));
        document.getElementById('scene1-arc-ebc').setAttribute('d', arcPath(B, E, C, 25));
        document.getElementById('scene1-arc-bec').setAttribute('d', arcPath(E, B, C, 15));

        // 等长标记（垂直于AB的短线）
        // AB方向向量：B-A = (-93, 285)，长度≈301.5
        // 垂直方向单位向量：(285/301.5, 93/301.5) ≈ (0.945, 0.308)
        var abLen = Math.sqrt(93*93 + 285*285);
        var perpX = 285 / abLen;
        var perpY = 93 / abLen;
        var markHalf = 5;

        // AD中点
        var adMidX = (A[0] + D[0]) / 2;
        var adMidY = (A[1] + D[1]) / 2;
        var markAd = document.getElementById('scene1-mark-ad');
        markAd.setAttribute('x1', adMidX - markHalf * perpX);
        markAd.setAttribute('y1', adMidY - markHalf * perpY);
        markAd.setAttribute('x2', adMidX + markHalf * perpX);
        markAd.setAttribute('y2', adMidY + markHalf * perpY);

        // DB中点
        var dbMidX = (D[0] + B[0]) / 2;
        var dbMidY = (D[1] + B[1]) / 2;
        var markDb = document.getElementById('scene1-mark-db');
        markDb.setAttribute('x1', dbMidX - markHalf * perpX);
        markDb.setAttribute('y1', dbMidY - markHalf * perpY);
        markDb.setAttribute('x2', dbMidX + markHalf * perpX);
        markDb.setAttribute('y2', dbMidY + markHalf * perpY);

        // 直角符号（在D点，一边沿DB方向，一边沿DE方向）
        var uABx = -93 / abLen;  // D→B方向单位向量
        var uABy = 285 / abLen;
        var uDEdx = 285 / abLen; // D→E方向单位向量（垂直于AB）
        var uDEdy = 93 / abLen;
        var ra = 10; // 直角符号边长
        var raPts = [
            D[0] + ra * uABx + ',' + (D[1] + ra * uABy),
            D[0] + ra * uABx + ra * uDEdx + ',' + (D[1] + ra * uABy + ra * uDEdy),
            D[0] + ra * uDEdx + ',' + (D[1] + ra * uDEdy)
        ];
        document.getElementById('scene1-right-angle').setAttribute('points', raPts.join(' '));

        // ===== 初始渲染 =====
        renderStep(0);

    })();
    </script>
</body>
</html>
