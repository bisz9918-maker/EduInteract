<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>光通过平行玻璃砖的折射光路</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-svg { display: block; width: 800px; height: 500px; }

        /* Step visibility with transition */
        .scene1-step-hidden { opacity: 0; transition: opacity 0.4s ease; pointer-events: none; }
        .scene1-step-visible { opacity: 1; transition: opacity 0.4s ease; pointer-events: auto; }

        /* Button styles */
        #scene1-btn-prev, #scene1-btn-next {
            position: absolute;
            width: 120px;
            height: 35px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #scene1-btn-prev {
            left: 250px;
            bottom: 10px;
            background: #e0e0e0;
            color: #333333;
        }
        #scene1-btn-next {
            left: 430px;
            bottom: 10px;
            background: #1565c0;
            color: #ffffff;
        }
        #scene1-btn-prev:hover:not(:disabled) { background: #d0d0d0; }
        #scene1-btn-next:hover:not(:disabled) { background: #0d47a1; }
        #scene1-btn-prev:disabled, #scene1-btn-next:disabled {
            background: #bdbdbd;
            color: #757575;
            cursor: not-allowed;
        }

        /* Highlight effect for step 3 */
        .scene1-highlight { stroke-width: 3.5px !important; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <defs>
                <!-- Arrow marker for light rays -->
                <marker id="scene1-arrow" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="10" markerHeight="7" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0"/>
                </marker>
            </defs>

            <!-- ===== STEP 0: Base elements (always visible) ===== -->
            <!-- Glass brick: (240,170) 320x100 -->
            <rect id="scene1-glass" x="240" y="170" width="320" height="100" fill="#e3f2fd" fill-opacity="0.2" stroke="#000000" stroke-width="2"/>

            <!-- Top surface normal: dashed vertical line at x=330 -->
            <line id="scene1-normal-top" x1="330" y1="50" x2="330" y2="270" stroke="#888888" stroke-width="1.5" stroke-dasharray="6,4"/>

            <!-- Incident ray: (211,70) -> (330,170) with arrow -->
            <line id="scene1-incident-ray" x1="211" y1="70" x2="330" y2="170" stroke="#1565c0" stroke-width="2.5" marker-end="url(#scene1-arrow)"/>

            <!-- Incident angle i₁ arc: center(330,170) r=40, from normal-up to incident-ray direction -->
            <path id="scene1-arc-i1" d="M 330 130 A 40 40 0 0 0 299.4 144.2" fill="none" stroke="#c62828" stroke-width="2"/>

            <!-- Label "i₁" at (290, 130) -->
            <text id="scene1-label-i1" x="290" y="130" fill="#c62828" font-size="14" text-anchor="middle" dominant-baseline="middle">i₁</text>

            <!-- Medium label "空气" (top) at (400, 140) -->
            <text id="scene1-label-air-top" x="400" y="140" fill="#000000" font-size="14" text-anchor="middle" dominant-baseline="middle">空气</text>

            <!-- Medium label "玻璃" at (400, 220) -->
            <text id="scene1-label-glass" x="400" y="220" fill="#000000" font-size="14" text-anchor="middle" dominant-baseline="middle">玻璃</text>

            <!-- ===== STEP 1: Refraction inside glass ===== -->
            <g id="scene1-step1" class="scene1-step-hidden">
                <!-- Refracted ray inside glass: (330,170) -> (389,270) with arrow -->
                <line id="scene1-refract-ray" x1="330" y1="170" x2="389" y2="270" stroke="#1565c0" stroke-width="2.5" marker-end="url(#scene1-arrow)"/>

                <!-- Refraction angle r₁ arc: center(330,170) r=30, from normal-down to refracted-ray direction -->
                <path id="scene1-arc-r1" d="M 330 200 A 30 30 0 0 0 345.3 196.0" fill="none" stroke="#c62828" stroke-width="2"/>

                <!-- Label "r₁" at (355, 205) -->
                <text id="scene1-label-r1" x="355" y="205" fill="#c62828" font-size="14" text-anchor="middle" dominant-baseline="middle">r₁</text>

                <!-- Highlight text "i₁ > r₁" at (310, 165) -->
                <text id="scene1-highlight-i1r1" x="310" y="165" fill="#c62828" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="middle">i₁ > r₁</text>
            </g>

            <!-- ===== STEP 2: Emergence from glass ===== -->
            <g id="scene1-step2" class="scene1-step-hidden">
                <!-- Bottom surface normal: dashed vertical line at x=389 -->
                <line id="scene1-normal-bottom" x1="389" y1="170" x2="389" y2="390" stroke="#888888" stroke-width="1.5" stroke-dasharray="6,4"/>

                <!-- Emergent ray: (389,270) -> (508,370) with arrow -->
                <line id="scene1-emerge-ray" x1="389" y1="270" x2="508" y2="370" stroke="#1565c0" stroke-width="2.5" marker-end="url(#scene1-arrow)"/>

                <!-- Incident angle i₂ arc at bottom: center(389,270) r=30, from normal-up to internal-ray direction -->
                <path id="scene1-arc-i2" d="M 389 240 A 30 30 0 0 0 373.7 244.0" fill="none" stroke="#c62828" stroke-width="2"/>

                <!-- Label "i₂" at (355, 240) -->
                <text id="scene1-label-i2" x="355" y="240" fill="#c62828" font-size="14" text-anchor="middle" dominant-baseline="middle">i₂</text>

                <!-- Refraction angle r₂ arc at bottom: center(389,270) r=40, from normal-down to emergent-ray direction -->
                <path id="scene1-arc-r2" d="M 389 310 A 40 40 0 0 0 419.6 295.8" fill="none" stroke="#c62828" stroke-width="2"/>

                <!-- Label "r₂" at (430, 310) -->
                <text id="scene1-label-r2" x="430" y="310" fill="#c62828" font-size="14" text-anchor="middle" dominant-baseline="middle">r₂</text>

                <!-- Highlight text "r₂ > i₂" at (420, 280) -->
                <text id="scene1-highlight-r2i2" x="420" y="280" fill="#c62828" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="middle">r₂ > i₂</text>

                <!-- Medium label "空气" (bottom) at (400, 310) -->
                <text id="scene1-label-air-bottom" x="400" y="310" fill="#000000" font-size="14" text-anchor="middle" dominant-baseline="middle">空气</text>
            </g>

            <!-- ===== STEP 3: Conclusion - parallel rays & lateral displacement ===== -->
            <g id="scene1-step3" class="scene1-step-hidden">
                <!-- Extension of incident ray (dashed reference line) from bottom surface -->
                <line id="scene1-extension" x1="449" y1="270" x2="568" y2="370" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>

                <!-- Parallel symbol "∥" at (520, 380) -->
                <text id="scene1-parallel" x="520" y="380" fill="#2e7d32" font-size="20" font-weight="bold" text-anchor="middle" dominant-baseline="middle">∥</text>

                <!-- Side displacement dashed line: (465,295) -> (495,315) -->
                <line id="scene1-displacement" x1="465" y1="295" x2="495" y2="315" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="4,3"/>

                <!-- Side displacement label "侧移" at (505, 325) -->
                <text id="scene1-label-displacement" x="505" y="325" fill="#2e7d32" font-size="13" text-anchor="middle" dominant-baseline="middle">侧移</text>

                <!-- Conclusion text at (400, 420) -->
                <text id="scene1-conclusion" x="400" y="420" fill="#2e7d32" font-size="15" font-weight="bold" text-anchor="middle" dominant-baseline="middle">入射光线 ∥ 出射光线</text>
            </g>
        </svg>

        <!-- Control buttons -->
        <button id="scene1-btn-prev" disabled>◀ 上一步</button>
        <button id="scene1-btn-next">下一步 ▶</button>
    </div>

    <script>
    (function() {
        'use strict';

        // Layout coordinate table (from spec):
        // Glass brick: (240,170)-(560,270), 320x100
        // Incident ray: (211,70)->(330,170)
        // Top normal: (330,50)->(330,270)
        // Refracted ray: (330,170)->(389,270)
        // Bottom normal: (389,170)->(389,390)
        // Emergent ray: (389,270)->(508,370)
        // Buttons: prev(250,455) 120x35, next(430,455) 120x35

        var currentStep = 0;
        var maxStep = 3;

        // Get elements by ID (scene1- prefix for isolation)
        var btnPrev = document.getElementById('scene1-btn-prev');
        var btnNext = document.getElementById('scene1-btn-next');
        var step1Group = document.getElementById('scene1-step1');
        var step2Group = document.getElementById('scene1-step2');
        var step3Group = document.getElementById('scene1-step3');
        var incidentRay = document.getElementById('scene1-incident-ray');
        var emergeRay = document.getElementById('scene1-emerge-ray');

        // Update visibility of step elements and button states
        function updateStep() {
            // Step 1: refracted ray, r₁ arc, label, highlight
            if (currentStep >= 1) {
                step1Group.classList.remove('scene1-step-hidden');
                step1Group.classList.add('scene1-step-visible');
            } else {
                step1Group.classList.remove('scene1-step-visible');
                step1Group.classList.add('scene1-step-hidden');
            }

            // Step 2: bottom normal, emergent ray, angles, labels, highlight
            if (currentStep >= 2) {
                step2Group.classList.remove('scene1-step-hidden');
                step2Group.classList.add('scene1-step-visible');
            } else {
                step2Group.classList.remove('scene1-step-visible');
                step2Group.classList.add('scene1-step-hidden');
            }

            // Step 3: parallel symbol, displacement, conclusion, highlight rays
            if (currentStep >= 3) {
                step3Group.classList.remove('scene1-step-hidden');
                step3Group.classList.add('scene1-step-visible');
                incidentRay.classList.add('scene1-highlight');
                emergeRay.classList.add('scene1-highlight');
            } else {
                step3Group.classList.remove('scene1-step-visible');
                step3Group.classList.add('scene1-step-hidden');
                incidentRay.classList.remove('scene1-highlight');
                emergeRay.classList.remove('scene1-highlight');
            }

            // Button disabled states
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === maxStep);
        }

        // Event listeners for buttons
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < maxStep) {
                currentStep++;
                updateStep();
            }
        });

        // Initialize: show step 0 elements, hide steps 1-3
        updateStep();
    })();
    </script>
</body>
</html>
