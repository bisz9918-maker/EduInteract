<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>原电池装置</title>
    <style>
        body { margin: 0; padding: 0; background: #fff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #fff; margin: 0 auto; overflow: hidden; }
        #scene1-svg { width: 800px; height: 500px; display: block; }
        #scene1-controls { position: absolute; bottom: 8px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene1-controls button { padding: 6px 18px; font-size: 14px; border: 1px solid #999; border-radius: 4px; cursor: pointer; font-family: inherit; }
        #scene1-controls button:disabled { opacity: 0.4; cursor: default; }
        #scene1-btn-prev { background: #e0e0e0; color: #333; }
        #scene1-btn-next { background: #1565c0; color: #fff; border-color: #1565c0; }
        #scene1-btn-next:disabled { background: #90caf9; border-color: #90caf9; }
        .step-hidden { display: none; opacity: 0; }
        .step-visible { display: block; opacity: 1; transition: opacity 0.4s ease-in; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <marker id="s1-blk" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#000"/></marker>
                <marker id="s1-blu" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#1565c0"/></marker>
                <marker id="s1-grn" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2e7d32"/></marker>
                <marker id="s1-org" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#e65100"/></marker>
            </defs>

            <!-- 容器外框 -->
            <line x1="180" y1="390" x2="620" y2="390" stroke="#000" stroke-width="2"/>
            <line x1="180" y1="130" x2="180" y2="390" stroke="#000" stroke-width="2"/>
            <line x1="620" y1="130" x2="620" y2="390" stroke="#000" stroke-width="2"/>
            <line x1="170" y1="130" x2="630" y2="130" stroke="#000" stroke-width="2.5"/>

            <!-- H2SO4溶液 -->
            <rect x="182" y="152" width="436" height="236" fill="#1565c0" opacity="0.2"/>

            <!-- 电极A -->
            <rect id="scene1-electrode-a" x="270" y="150" width="40" height="240" fill="#666" stroke="#000" stroke-width="1.5"/>
            <polyline points="165,220 165,320 175,320 175,220" fill="none" stroke="#000" stroke-width="1"/>
            <line x1="175" y1="270" x2="268" y2="270" stroke="#000" stroke-width="1"/>
            <text id="scene1-label-a-electrode" x="158" y="275" text-anchor="end" font-size="18" fill="#000" font-weight="bold">A</text>

            <!-- 电极B -->
            <rect id="scene1-electrode-b" x="490" y="150" width="40" height="240" fill="#666" stroke="#000" stroke-width="1.5"/>
            <polyline points="635,220 635,320 625,320 625,220" fill="none" stroke="#000" stroke-width="1"/>
            <line x1="625" y1="270" x2="532" y2="270" stroke="#000" stroke-width="1"/>
            <text id="scene1-label-b-electrode" x="642" y="275" text-anchor="start" font-size="18" fill="#000" font-weight="bold">B</text>

            <!-- H2SO4标签 - moved up to avoid crowding with "b" -->
            <line x1="640" y1="320" x2="622" y2="320" stroke="#000" stroke-width="1"/>
            <line x1="622" y1="320" x2="540" y2="350" stroke="#000" stroke-width="1"/>
            <text id="scene1-label-h2so4" x="645" y="325" text-anchor="start" font-size="16" fill="#000">H₂SO₄</text>

            <!-- 导线 -->
            <polyline id="scene1-wire-a" points="290,150 290,80 378,72" fill="none" stroke="#000" stroke-width="2"/>
            <polyline id="scene1-wire-b" points="510,150 510,80 422,72" fill="none" stroke="#000" stroke-width="2"/>

            <!-- 灯泡 -->
            <rect id="scene1-bulb-base" x="388" y="72" width="24" height="18" fill="#888" stroke="#000" stroke-width="1.5" rx="2"/>
            <circle id="scene1-bulb" cx="400" cy="50" r="22" fill="none" stroke="#000" stroke-width="1.5"/>
            <path d="M393,62 L393,48 Q393,42 400,42 Q407,42 407,48 L407,62" fill="none" stroke="#000" stroke-width="1.2"/>
            <circle id="scene1-bulb-glow" cx="400" cy="50" r="35" fill="#ffeb3b" opacity="0" class="step-hidden"/>

            <!-- 入口a -->
            <line id="scene1-arrow-a" x1="120" y1="370" x2="175" y2="370" stroke="#000" stroke-width="2" marker-end="url(#s1-blk)"/>
            <text id="scene1-label-a" x="105" y="375" text-anchor="end" font-size="16" fill="#000">a</text>

            <!-- 入口b -->
            <line id="scene1-arrow-b" x1="680" y1="370" x2="625" y2="370" stroke="#000" stroke-width="2" marker-end="url(#s1-blk)"/>
            <text id="scene1-label-b" x="695" y="375" text-anchor="start" font-size="16" fill="#000">b</text>

            <!-- 出口c -->
            <line id="scene1-arrow-c" x1="180" y1="150" x2="125" y2="150" stroke="#000" stroke-width="2" marker-end="url(#s1-blk)"/>
            <text id="scene1-label-c" x="108" y="155" text-anchor="end" font-size="16" fill="#000">c</text>

            <!-- 出口d -->
            <line id="scene1-arrow-d" x1="620" y1="150" x2="675" y2="150" stroke="#000" stroke-width="2" marker-end="url(#s1-blk)"/>
            <text id="scene1-label-d" x="692" y="155" text-anchor="start" font-size="16" fill="#000">d</text>

            <!-- 步骤1：电子流向 -->
            <g id="scene1-step1-group" class="step-hidden">
                <line id="scene1-e-flow-left" x1="300" y1="79" x2="360" y2="74" stroke="#1565c0" stroke-width="3" marker-end="url(#s1-blu)"/>
                <text id="scene1-label-e-left" x="330" y="68" text-anchor="middle" font-size="16" fill="#1565c0" font-weight="bold">e⁻</text>
                <line id="scene1-e-flow-right" x1="500" y1="79" x2="440" y2="74" stroke="#1565c0" stroke-width="3" marker-end="url(#s1-blu)"/>
                <text id="scene1-label-e-right" x="470" y="68" text-anchor="middle" font-size="16" fill="#1565c0" font-weight="bold">e⁻</text>
            </g>

            <!-- 步骤2：正负极 -->
            <g id="scene1-step2-group" class="step-hidden">
                <text id="scene1-label-negative" x="255" y="118" text-anchor="end" font-size="18" fill="#c62828" font-weight="bold">负极</text>
                <text id="scene1-label-positive" x="545" y="118" text-anchor="start" font-size="18" fill="#1565c0" font-weight="bold">正极</text>
                <text id="scene1-hint-step2" x="400" y="418" text-anchor="middle" font-size="14" fill="#888">电子流出极为负极，电子流入极为正极</text>
            </g>

            <!-- 步骤3：气体入口名称 -->
            <g id="scene1-step3-group" class="step-hidden">
                <line id="scene1-arrow-a-green" x1="120" y1="370" x2="175" y2="370" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#s1-grn)"/>
                <line id="scene1-arrow-b-green" x1="680" y1="370" x2="625" y2="370" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#s1-grn)"/>
                <text id="scene1-label-inlet-a" x="55" y="412" text-anchor="start" font-size="14" fill="#2e7d32">通入C₂H₈N₂</text>
                <text id="scene1-label-inlet-b" x="630" y="412" text-anchor="start" font-size="14" fill="#2e7d32">通入N₂O₄</text>
            </g>

            <!-- 步骤4：气体出口名称 -->
            <g id="scene1-step4-group" class="step-hidden">
                <line id="scene1-arrow-c-orange" x1="180" y1="150" x2="125" y2="150" stroke="#e65100" stroke-width="2.5" marker-end="url(#s1-org)"/>
                <line id="scene1-arrow-d-orange" x1="620" y1="150" x2="675" y2="150" stroke="#e65100" stroke-width="2.5" marker-end="url(#s1-org)"/>
                <text id="scene1-label-outlet-c" x="55" y="115" text-anchor="start" font-size="14" fill="#e65100">排出CO₂、N₂</text>
                <text id="scene1-label-outlet-d" x="630" y="115" text-anchor="start" font-size="14" fill="#e65100">排出N₂、H₂O</text>
                <text id="scene1-hint-step4" x="400" y="418" text-anchor="middle" font-size="14" fill="#888">产物均为空气成分，不污染空气</text>
            </g>

            <!-- 步骤指示器 -->
            <text id="scene1-step-indicator" x="400" y="455" text-anchor="middle" font-size="14" fill="#888">步骤 0 / 4</text>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() { 'use strict';
        var currentStep = 0, maxStep = 4;
        var btnPrev = document.getElementById('scene1-btn-prev');
        var btnNext = document.getElementById('scene1-btn-next');
        var stepIndicator = document.getElementById('scene1-step-indicator');
        var stepGroups = {
            1: document.getElementById('scene1-step1-group'),
            2: document.getElementById('scene1-step2-group'),
            3: document.getElementById('scene1-step3-group'),
            4: document.getElementById('scene1-step4-group')
        };
        var bulbGlow = document.getElementById('scene1-bulb-glow');
        var arrowA = document.getElementById('scene1-arrow-a');
        var arrowB = document.getElementById('scene1-arrow-b');
        var arrowC = document.getElementById('scene1-arrow-c');
        var arrowD = document.getElementById('scene1-arrow-d');
        var hintStep2 = document.getElementById('scene1-hint-step2');

        function showEl(el) { el.classList.remove('step-hidden'); el.classList.add('step-visible'); el.style.display = ''; el.style.opacity = '1'; }
        function hideEl(el) { el.classList.remove('step-visible'); el.classList.add('step-hidden'); el.style.display = 'none'; el.style.opacity = '0'; }

        function updateDisplay() {
            stepIndicator.textContent = '步骤 ' + currentStep + ' / ' + maxStep;
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === maxStep);
            for (var s = 1; s <= maxStep; s++) {
                (s <= currentStep) ? showEl(stepGroups[s]) : hideEl(stepGroups[s]);
            }
            (currentStep >= 1) ? (showEl(bulbGlow), bulbGlow.style.opacity = '0.4') : hideEl(bulbGlow);
            (currentStep >= 3) ? (arrowA.style.display = 'none', arrowB.style.display = 'none') : (arrowA.style.display = '', arrowB.style.display = '');
            (currentStep >= 4) ? (arrowC.style.display = 'none', arrowD.style.display = 'none') : (arrowC.style.display = '', arrowD.style.display = '');
            if (currentStep === 4) hideEl(hintStep2);
        }

        btnNext.addEventListener('click', function() { if (currentStep < maxStep) { currentStep++; updateDisplay(); } });
        btnPrev.addEventListener('click', function() { if (currentStep > 0) { currentStep--; updateDisplay(); } });
        updateDisplay();
    })();
    </script>
</body>
</html>
