<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>处理②的遗传分析——杂交结果与自交后代推导</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-svg { width: 800px; height: 500px; display: block; }
        #scene2-controls {
            position: absolute; bottom: 10px; left: 0; right: 0;
            display: flex; justify-content: center; gap: 12px; z-index: 10;
        }
        #scene2-controls button {
            padding: 6px 18px; font-size: 14px; cursor: pointer;
            border: 1px solid #999; border-radius: 4px; background: #fff; color: #333;
            transition: background 0.2s, color 0.2s;
        }
        #scene2-controls button:hover:not(:disabled) { background: #e8e8e8; }
        #scene2-controls button:disabled { opacity: 0.4; cursor: default; }

        /* 淡入动画 */
        .scene2-fade-in {
            opacity: 0;
            transition: opacity 300ms ease-in;
        }
        .scene2-fade-in.scene2-visible {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- 箭头标记 -->
                <marker id="scene2-arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
                    <polygon points="0 0, 8 3, 0 6" fill="#888888" />
                </marker>
            </defs>

            <!-- ===== 步骤0：亲本信息（始终可见） ===== -->
            <!-- 植株甲框 -->
            <rect id="scene2-parent-a-box" x="100" y="35" width="160" height="60" rx="5"
                  fill="rgba(21,101,192,0.1)" stroke="#1565c0" stroke-width="2" />
            <text x="180" y="65" text-anchor="middle" dominant-baseline="middle"
                  font-size="14" fill="#000000">植株甲（母本）：aabb</text>

            <!-- ×符号 -->
            <text x="300" y="65" text-anchor="middle" dominant-baseline="middle"
                  font-size="24" font-weight="bold" fill="#000000">×</text>

            <!-- 植株乙框 -->
            <rect id="scene2-parent-b-box" x="340" y="35" width="160" height="60" rx="5"
                  fill="rgba(21,101,192,0.1)" stroke="#1565c0" stroke-width="2" />
            <text x="420" y="65" text-anchor="middle" dominant-baseline="middle"
                  font-size="14" fill="#000000">植株乙（父本）：AABB</text>

            <!-- ===== 步骤1：杂交子代 ===== -->
            <g id="scene2-step1-group" class="scene2-fade-in">
                <!-- 箭头1：亲本→子代 -->
                <path id="scene2-arrow-1" d="M400,95 L400,125"
                      stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5"
                      fill="none" marker-end="url(#scene2-arrowhead)" />
                <!-- 子代框 -->
                <rect id="scene2-f1-box" x="280" y="130" width="240" height="60" rx="5"
                      fill="rgba(198,40,40,0.1)" stroke="#c62828" stroke-width="2" />
                <text x="400" y="160" text-anchor="middle" dominant-baseline="middle"
                      font-size="15" fill="#000000">子代（F1）：AaBb</text>
            </g>

            <!-- ===== 步骤2：豆荚颜色分析 ===== -->
            <g id="scene2-step2-group" class="scene2-fade-in">
                <!-- 箭头2：子代→豆荚分析 -->
                <path id="scene2-arrow-2" d="M320,190 L200,215 L200,220"
                      stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5"
                      fill="none" marker-end="url(#scene2-arrowhead)" />
                <!-- 豆荚分析框 -->
                <rect id="scene2-pod-box" x="80" y="220" width="200" height="60" rx="5"
                      fill="rgba(21,101,192,0.1)" stroke="#1565c0" stroke-width="2" />
                <text x="180" y="250" text-anchor="middle" dominant-baseline="middle"
                      font-size="13" fill="#000000">
                    豆荚颜色：<tspan fill="#1565c0" font-weight="bold">黄色</tspan>（母本aa决定）
                </text>
            </g>

            <!-- ===== 步骤3：子叶颜色分析 ===== -->
            <g id="scene2-step3-group" class="scene2-fade-in">
                <!-- 箭头3：子代→子叶分析 -->
                <path id="scene2-arrow-3" d="M480,190 L520,215 L520,220"
                      stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5"
                      fill="none" marker-end="url(#scene2-arrowhead)" />
                <!-- 子叶分析框 -->
                <rect id="scene2-cotyledon-box" x="420" y="220" width="200" height="60" rx="5"
                      fill="rgba(21,101,192,0.1)" stroke="#1565c0" stroke-width="2" />
                <text x="520" y="250" text-anchor="middle" dominant-baseline="middle"
                      font-size="13" fill="#000000">
                    子叶颜色：<tspan fill="#1565c0" font-weight="bold">黄色</tspan>（受精卵Bb决定）
                </text>
            </g>

            <!-- ===== 步骤4：第二年自交 ===== -->
            <g id="scene2-step4-group" class="scene2-fade-in">
                <!-- 箭头4：子代→自交 -->
                <path id="scene2-arrow-4" d="M400,190 L400,305"
                      stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5"
                      fill="none" marker-end="url(#scene2-arrowhead)" />
                <!-- 自交框 -->
                <rect id="scene2-selfing-box" x="280" y="310" width="240" height="50" rx="5"
                      fill="rgba(198,40,40,0.1)" stroke="#c62828" stroke-width="2" />
                <text x="400" y="335" text-anchor="middle" dominant-baseline="middle"
                      font-size="14" fill="#000000">第二年自交：AaBb × AaBb</text>
            </g>

            <!-- ===== 步骤5：自交结果 ===== -->
            <g id="scene2-step5-group" class="scene2-fade-in">
                <!-- 箭头5：自交→结果1 -->
                <path id="scene2-arrow-5" d="M340,360 L200,385 L200,390"
                      stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5"
                      fill="none" marker-end="url(#scene2-arrowhead)" />
                <!-- 结果框1 -->
                <rect id="scene2-result1-box" x="100" y="390" width="200" height="50" rx="5"
                      fill="rgba(46,125,50,0.1)" stroke="#2e7d32" stroke-width="2" />
                <text x="200" y="415" text-anchor="middle" dominant-baseline="middle"
                      font-size="14" fill="#000000">
                    豆荚黄色（aa）：<tspan fill="#2e7d32" font-weight="bold">1/4</tspan>
                </text>

                <!-- 箭头6：自交→结果2 -->
                <path id="scene2-arrow-6" d="M460,360 L500,385 L500,390"
                      stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5"
                      fill="none" marker-end="url(#scene2-arrowhead)" />
                <!-- 结果框2 -->
                <rect id="scene2-result2-box" x="400" y="390" width="200" height="50" rx="5"
                      fill="rgba(46,125,50,0.1)" stroke="#2e7d32" stroke-width="2" />
                <text x="500" y="415" text-anchor="middle" dominant-baseline="middle"
                      font-size="14" fill="#000000">
                    胚基因型AABb：<tspan fill="#2e7d32" font-weight="bold">1/8</tspan>
                </text>
            </g>
        </svg>

        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-btn-prev" disabled>◀ 上一步</button>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2 实现
        // 布局坐标表（来自spec.json）：
        // 植株甲框: rect(100,35) 160x60 | 植株乙框: rect(340,35) 160x60
        // ×符号: text(300,65) | 子代框: rect(280,130) 240x60
        // 豆荚分析框: rect(80,220) 200x60 | 子叶分析框: rect(420,220) 200x60
        // 自交框: rect(280,310) 240x50 | 结果框1: rect(100,390) 200x50 | 结果框2: rect(400,390) 200x50

        var currentStep = 0;
        var maxStep = 5;

        // 各步骤对应的元素组ID
        var stepGroups = [
            null,                          // 步骤0：亲本信息（始终可见，无group）
            'scene2-step1-group',          // 步骤1：杂交子代
            'scene2-step2-group',          // 步骤2：豆荚颜色分析
            'scene2-step3-group',          // 步骤3：子叶颜色分析
            'scene2-step4-group',          // 步骤4：第二年自交
            'scene2-step5-group'           // 步骤5：自交结果
        ];

        var btnPrev = document.getElementById('scene2-btn-prev');
        var btnNext = document.getElementById('scene2-btn-next');

        function updateDisplay() {
            // 更新各步骤组的可见性
            for (var i = 1; i <= maxStep; i++) {
                var group = document.getElementById(stepGroups[i]);
                if (i <= currentStep) {
                    group.classList.add('scene2-visible');
                } else {
                    group.classList.remove('scene2-visible');
                }
            }
            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === maxStep);
        }

        btnNext.addEventListener('click', function() {
            if (currentStep < maxStep) {
                currentStep++;
                updateDisplay();
            }
        });

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        });

        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
