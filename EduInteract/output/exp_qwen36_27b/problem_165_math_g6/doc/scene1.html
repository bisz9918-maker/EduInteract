<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地砖面积与块数反比例关系</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-svg { width: 800px; height: 500px; display: block; }

        /* Controls */
        #scene1-controls {
            position: absolute; bottom: 10px; left: 0; right: 0;
            display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10;
        }
        #scene1-controls button {
            width: 100px; height: 36px; border: 1px solid #999; border-radius: 4px;
            background: #e0e0e0; color: #000; font-size: 14px; cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
        }
        #scene1-controls button:hover:not(:disabled) { background: #bdbdbd; }
        #scene1-controls button:disabled { opacity: 0.4; cursor: default; }
        #scene1-step-indicator { font-size: 14px; color: #333; min-width: 40px; text-align: center; }

        /* Answer bounce animation */
        @keyframes answerBounce {
            0% { transform: scale(0.5); opacity: 0; }
            60% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .answer-bounce { animation: answerBounce 0.6s ease-out forwards; }

        /* Fade-in animation */
        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- ==================== STEP 0-1: Tile comparison ==================== -->
            <g id="scene1-step01-group">
                <!-- 2dm tile (left) -->
                <rect id="scene1-tile-2dm" x="150" y="130" width="100" height="100"
                      fill="rgba(198,40,40,0.2)" stroke="#000000" stroke-width="2" rx="2"/>
                <!-- 2dm label - to the left of tile, outside the rect -->
                <text id="scene1-label-2dm" x="138" y="180" text-anchor="end" dominant-baseline="middle"
                      font-size="16" fill="#000000" font-weight="bold">2dm</text>

                <!-- 3dm tile (right) -->
                <rect id="scene1-tile-3dm" x="525" y="80" width="150" height="150"
                      fill="rgba(21,101,192,0.2)" stroke="#000000" stroke-width="2" rx="2"/>
                <!-- 3dm label - to the left of tile, outside the rect -->
                <text id="scene1-label-3dm" x="513" y="155" text-anchor="end" dominant-baseline="middle"
                      font-size="16" fill="#000000" font-weight="bold">3dm</text>

                <!-- Area labels (step 1 only) -->
                <g id="scene1-area-labels" style="display:none;">
                    <text id="scene1-label-area-2dm" x="200" y="255" text-anchor="middle" dominant-baseline="middle"
                          font-size="16" fill="#000000">
                        2×2=<tspan fill="#c62828" font-weight="bold">4 dm²</tspan>
                    </text>
                    <text id="scene1-label-area-3dm" x="600" y="250" text-anchor="middle" dominant-baseline="middle"
                          font-size="16" fill="#000000">
                        3×3=<tspan fill="#1565c0" font-weight="bold">9 dm²</tspan>
                    </text>
                </g>
            </g>

            <!-- ==================== STEP 2: Laying comparison ==================== -->
            <g id="scene1-step2-group" style="display:none;">
                <!-- Left area: 6dm×6dm with 3dm tiles (2×2 grid) -->
                <g id="scene1-area-left">
                    <rect x="80" y="50" width="300" height="300"
                          fill="rgba(21,101,192,0.1)" stroke="#000000" stroke-width="2" rx="2"/>
                    <!-- Grid lines for 2×2 (3dm = 150px each) -->
                    <line x1="230" y1="50" x2="230" y2="350" stroke="#888888" stroke-width="1" stroke-dasharray="6,4"/>
                    <line x1="80" y1="200" x2="380" y2="200" stroke="#888888" stroke-width="1" stroke-dasharray="6,4"/>
                </g>
                <!-- Left area title -->
                <text id="scene1-label-left-title" x="230" y="38" text-anchor="middle" dominant-baseline="middle"
                      font-size="16" fill="#000000" font-weight="bold">6dm×6dm</text>
                <!-- Left area count -->
                <text id="scene1-label-left-count" x="230" y="375" text-anchor="middle" dominant-baseline="middle"
                      font-size="18" fill="#1565c0" font-weight="bold">4块</text>

                <!-- Right area: 6dm×6dm with 2dm tiles (3×3 grid) -->
                <g id="scene1-area-right">
                    <rect x="420" y="50" width="300" height="300"
                          fill="rgba(198,40,40,0.1)" stroke="#000000" stroke-width="2" rx="2"/>
                    <!-- Grid lines for 3×3 (2dm = 100px each) -->
                    <line x1="520" y1="50" x2="520" y2="350" stroke="#888888" stroke-width="1" stroke-dasharray="6,4"/>
                    <line x1="620" y1="50" x2="620" y2="350" stroke="#888888" stroke-width="1" stroke-dasharray="6,4"/>
                    <line x1="420" y1="150" x2="720" y2="150" stroke="#888888" stroke-width="1" stroke-dasharray="6,4"/>
                    <line x1="420" y1="250" x2="720" y2="250" stroke="#888888" stroke-width="1" stroke-dasharray="6,4"/>
                </g>
                <!-- Right area title -->
                <text id="scene1-label-right-title" x="570" y="38" text-anchor="middle" dominant-baseline="middle"
                      font-size="16" fill="#000000" font-weight="bold">6dm×6dm</text>
                <!-- Right area count -->
                <text id="scene1-label-right-count" x="570" y="375" text-anchor="middle" dominant-baseline="middle"
                      font-size="18" fill="#c62828" font-weight="bold">9块</text>

                <!-- Comparison label -->
                <text id="scene1-label-compare" x="400" y="200" text-anchor="middle" dominant-baseline="middle"
                      font-size="20" fill="#333333" font-weight="bold">对比</text>
            </g>

            <!-- ==================== STEP 3: Derivation & Answer ==================== -->
            <g id="scene1-step3-group" style="display:none;">
                <!-- Left small area (180×180, 3dm tiles at 90px) -->
                <g id="scene1-area-left-small">
                    <rect x="100" y="40" width="180" height="180"
                          fill="rgba(21,101,192,0.1)" stroke="#000000" stroke-width="2" rx="2"/>
                    <!-- Grid lines for 2×2 (90px each) -->
                    <line x1="190" y1="40" x2="190" y2="220" stroke="#888888" stroke-width="1" stroke-dasharray="4,3"/>
                    <line x1="100" y1="130" x2="280" y2="130" stroke="#888888" stroke-width="1" stroke-dasharray="4,3"/>
                </g>
                <text id="scene1-label-left-count-small" x="190" y="245" text-anchor="middle" dominant-baseline="middle"
                      font-size="18" fill="#1565c0" font-weight="bold">4块</text>

                <!-- Right small area (180×180, 2dm tiles at 60px) -->
                <g id="scene1-area-right-small">
                    <rect x="520" y="40" width="180" height="180"
                          fill="rgba(198,40,40,0.1)" stroke="#000000" stroke-width="2" rx="2"/>
                    <!-- Grid lines for 3×3 (60px each) -->
                    <line x1="580" y1="40" x2="580" y2="220" stroke="#888888" stroke-width="1" stroke-dasharray="4,3"/>
                    <line x1="640" y1="40" x2="640" y2="220" stroke="#888888" stroke-width="1" stroke-dasharray="4,3"/>
                    <line x1="520" y1="100" x2="700" y2="100" stroke="#888888" stroke-width="1" stroke-dasharray="4,3"/>
                    <line x1="520" y1="160" x2="700" y2="160" stroke="#888888" stroke-width="1" stroke-dasharray="4,3"/>
                </g>
                <text id="scene1-label-right-count-small" x="610" y="245" text-anchor="middle" dominant-baseline="middle"
                      font-size="18" fill="#c62828" font-weight="bold">9块</text>

                <!-- Formula 1 -->
                <text id="scene1-formula-1" x="400" y="300" text-anchor="middle" dominant-baseline="middle"
                      font-size="16" fill="#000000" style="display:none;">
                    总面积 = 400 × 9 = <tspan font-weight="bold">3600 dm²</tspan>
                </text>
                <!-- Formula 2 -->
                <text id="scene1-formula-2" x="400" y="350" text-anchor="middle" dominant-baseline="middle"
                      font-size="16" fill="#000000" style="display:none;">
                    2dm地砖 = 3600 ÷ 4 = <tspan font-weight="bold">900 块</tspan>
                </text>
                <!-- Answer -->
                <g id="scene1-answer" style="display:none;">
                    <text x="400" y="410" text-anchor="middle" dominant-baseline="middle"
                          font-size="32" fill="#2e7d32" font-weight="bold">答案：900 块</text>
                </g>
            </g>
        </svg>

        <!-- Controls -->
        <div id="scene1-controls">
            <button id="scene1-step-prev" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">1/4</span>
            <button id="scene1-step-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() { 'use strict';

        // ===== State =====
        var currentStep = 0;
        var totalSteps = 4; // 0, 1, 2, 3

        // ===== DOM References =====
        var btnPrev = document.getElementById('scene1-step-prev');
        var btnNext = document.getElementById('scene1-step-next');
        var indicator = document.getElementById('scene1-step-indicator');

        var step01Group = document.getElementById('scene1-step01-group');
        var areaLabels = document.getElementById('scene1-area-labels');
        var step2Group = document.getElementById('scene1-step2-group');
        var step3Group = document.getElementById('scene1-step3-group');
        var formula1 = document.getElementById('scene1-formula-1');
        var formula2 = document.getElementById('scene1-formula-2');
        var answer = document.getElementById('scene1-answer');

        // ===== Helper: show/hide using display =====
        function showEl(el) {
            el.style.display = '';
            el.style.opacity = '';
        }
        function hideEl(el) {
            el.style.display = 'none';
            el.style.opacity = '0';
        }

        // ===== Render Step =====
        function renderStep(step) {
            // Reset all
            hideEl(step01Group);
            hideEl(areaLabels);
            hideEl(step2Group);
            hideEl(step3Group);
            hideEl(formula1);
            hideEl(formula2);
            hideEl(answer);

            // Remove animation classes
            answer.classList.remove('answer-bounce');
            formula1.classList.remove('fade-in');
            formula2.classList.remove('fade-in');

            switch(step) {
                case 0:
                    showEl(step01Group);
                    break;
                case 1:
                    showEl(step01Group);
                    showEl(areaLabels);
                    break;
                case 2:
                    showEl(step2Group);
                    break;
                case 3:
                    showEl(step3Group);
                    // Staggered animation for formulas and answer
                    setTimeout(function() {
                        showEl(formula1);
                        formula1.classList.add('fade-in');
                    }, 200);
                    setTimeout(function() {
                        showEl(formula2);
                        formula2.classList.add('fade-in');
                    }, 500);
                    setTimeout(function() {
                        showEl(answer);
                        answer.classList.add('answer-bounce');
                    }, 800);
                    break;
            }

            // Update buttons
            btnPrev.disabled = (step === 0);
            btnNext.disabled = (step === totalSteps - 1);
            indicator.textContent = (step + 1) + '/' + totalSteps;
        }

        // ===== Event Listeners =====
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep(currentStep);
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                renderStep(currentStep);
            }
        });

        // ===== Initial Render =====
        renderStep(0);

    })();
    </script>
</body>
</html>
