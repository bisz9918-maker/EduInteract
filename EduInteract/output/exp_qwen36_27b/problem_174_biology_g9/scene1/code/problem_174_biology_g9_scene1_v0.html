<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>突触结构与兴奋传递</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-svg { width: 800px; height: 500px; display: block; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 16px; z-index: 10; }
        #scene1-controls button { padding: 8px 24px; font-size: 14px; cursor: pointer; border: 1px solid #555; background: #f0f0f0; border-radius: 6px; font-family: inherit; }
        #scene1-controls button:hover:not(:disabled) { background: #ddd; }
        #scene1-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 14px; color: #666; min-width: 70px; text-align: center; }
        #scene1-meter-needle { transform-origin: 400px 40px; transition: transform 0.35s ease; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <marker id="scene1-ah-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0"/>
                </marker>
                <marker id="scene1-ah-black" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
                </marker>
            </defs>

            <!-- Neuron A -->
            <g id="scene1-neuron-a">
                <path d="M 110,400 Q 155,388 200,372 Q 235,358 262,332" stroke="#000" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                <path d="M 262,332 Q 278,312 298,322 Q 306,342 282,348 Q 256,342 262,332 Z" stroke="#000" stroke-width="2" fill="none"/>
            </g>
            <circle cx="272" cy="330" r="2.2" fill="#000"/>
            <circle cx="282" cy="326" r="2.2" fill="#000"/>
            <circle cx="292" cy="332" r="2.2" fill="#000"/>
            <circle cx="278" cy="338" r="2.2" fill="#000"/>
            <circle cx="288" cy="338" r="2.2" fill="#000"/>

            <!-- Neuron B -->
            <g id="scene1-neuron-b">
                <line x1="100" y1="250" x2="315" y2="250" stroke="#000" stroke-width="3"/>
                <line x1="385" y1="250" x2="540" y2="250" stroke="#000" stroke-width="3"/>
                <ellipse cx="350" cy="250" rx="35" ry="45" stroke="#000" stroke-width="2" fill="none"/>
            </g>
            <circle cx="338" cy="238" r="2.2" fill="#000"/>
            <circle cx="350" cy="234" r="2.2" fill="#000"/>
            <circle cx="362" cy="238" r="2.2" fill="#000"/>
            <circle cx="343" cy="248" r="2.2" fill="#000"/>
            <circle cx="357" cy="248" r="2.2" fill="#000"/>
            <circle cx="338" cy="258" r="2.2" fill="#000"/>
            <circle cx="350" cy="258" r="2.2" fill="#000"/>
            <circle cx="362" cy="258" r="2.2" fill="#000"/>

            <!-- Synapse B→C -->
            <path d="M 540,220 Q 549,250 540,280" stroke="#000" stroke-width="2" fill="none"/>
            <path d="M 585,220 Q 576,250 585,280" stroke="#000" stroke-width="2" fill="none"/>

            <!-- Neuron C -->
            <g id="scene1-neuron-c">
                <ellipse cx="620" cy="250" rx="35" ry="45" stroke="#000" stroke-width="2" fill="none"/>
                <line x1="655" y1="250" x2="750" y2="250" stroke="#000" stroke-width="3"/>
            </g>

            <!-- Synapse A→B -->
            <path d="M 266,316 Q 280,308 294,316" stroke="#000" stroke-width="2" fill="none"/>
            <path d="M 318,292 Q 335,298 352,292" stroke="#000" stroke-width="2" fill="none"/>

            <!-- Galvanometer wires -->
            <line x1="375" y1="40" x2="150" y2="60" stroke="#000" stroke-width="1.5"/>
            <line x1="150" y1="60" x2="150" y2="250" stroke="#000" stroke-width="1.5"/>
            <line x1="425" y1="40" x2="700" y2="60" stroke="#000" stroke-width="1.5"/>
            <line x1="700" y1="60" x2="700" y2="250" stroke="#000" stroke-width="1.5"/>

            <!-- Galvanometer -->
            <circle cx="400" cy="40" r="25" stroke="#000" stroke-width="2" fill="none"/>
            <line id="scene1-meter-needle" x1="400" y1="40" x2="400" y2="18" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>

            <!-- Measurement points -->
            <circle cx="150" cy="250" r="3.5" fill="#000"/>
            <circle cx="350" cy="210" r="3.5" fill="#000"/>
            <circle cx="620" cy="210" r="3.5" fill="#000"/>
            <circle cx="700" cy="250" r="3.5" fill="#000"/>

            <!-- Stimulation arrows -->
            <line x1="350" y1="172" x2="350" y2="200" stroke="#000" stroke-width="1.5" marker-end="url(#scene1-ah-black)"/>
            <line x1="620" y1="172" x2="620" y2="200" stroke="#000" stroke-width="1.5" marker-end="url(#scene1-ah-black)"/>

            <!-- Labels -->
            <text x="175" y="420" font-size="16" fill="#000" font-weight="bold">A</text>
            <text x="350" y="358" font-size="16" fill="#000" text-anchor="middle" font-weight="bold">B</text>
            <text x="620" y="318" font-size="16" fill="#000" text-anchor="middle" font-weight="bold">C</text>
            <text x="138" y="244" font-size="14" fill="#000" text-anchor="end">a</text>
            <text x="350" y="162" font-size="14" fill="#000" text-anchor="middle">b</text>
            <text x="620" y="162" font-size="14" fill="#000" text-anchor="middle">c</text>
            <text x="712" y="244" font-size="14" fill="#000" text-anchor="start">d</text>
            <text x="400" y="86" font-size="13" fill="#000" text-anchor="middle">灵敏电流计</text>

            <!-- ANIMATED ELEMENTS -->
            <rect id="scene1-box-ab" x="248" y="283" width="108" height="58" stroke="#888" stroke-width="1.5" stroke-dasharray="5,5" fill="none" opacity="0"/>
            <rect id="scene1-box-bc" x="533" y="213" width="58" height="74" stroke="#888" stroke-width="1.5" stroke-dasharray="5,5" fill="none" opacity="0"/>

            <text id="scene1-lightning-b" x="350" y="128" font-size="22" fill="#ff9800" text-anchor="middle" opacity="0">⚡</text>
            <line id="scene1-path-ba" x1="338" y1="236" x2="162" y2="246" stroke="#1565c0" stroke-width="3.5" fill="none" marker-end="url(#scene1-ah-blue)" opacity="0"/>
            <line id="scene1-path-bs" x1="362" y1="236" x2="528" y2="246" stroke="#1565c0" stroke-width="3.5" fill="none" marker-end="url(#scene1-ah-blue)" opacity="0"/>
            <line id="scene1-path-cd" x1="642" y1="246" x2="692" y2="246" stroke="#1565c0" stroke-width="3.5" fill="none" marker-end="url(#scene1-ah-blue)" opacity="0"/>
            <circle id="scene1-vesicle" cx="540" cy="250" r="3" fill="#000" opacity="0"/>

            <text id="scene1-lightning-c" x="620" y="128" font-size="22" fill="#ff9800" text-anchor="middle" opacity="0">⚡</text>
            <text id="scene1-block" x="562" y="258" font-size="28" fill="#c62828" text-anchor="middle" font-weight="bold" opacity="0">✕</text>

            <!-- Step 4 summary: moved to y=355 to avoid neuron A path overlap -->
            <text id="scene1-sum-b" x="250" y="355" font-size="15" fill="#1565c0" text-anchor="middle" font-weight="bold" opacity="0">刺激b：偏转2次</text>
            <text id="scene1-sum-c" x="550" y="355" font-size="15" fill="#c62828" text-anchor="middle" font-weight="bold" opacity="0">刺激c：偏转1次</text>

            <text id="scene1-hint" x="400" y="445" font-size="14" fill="#333" text-anchor="middle">观察突触结构，识别神经元与突触数量</text>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 0/4</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        "use strict";
        var currentStep = 0, totalSteps = 4, animTimer = null;
        var btnPrev = document.getElementById("scene1-btn-prev");
        var btnNext = document.getElementById("scene1-btn-next");
        var stepInd = document.getElementById("scene1-step-indicator");
        var hint = document.getElementById("scene1-hint");
        var needle = document.getElementById("scene1-meter-needle");
        var neuronA = document.getElementById("scene1-neuron-a");
        var neuronB = document.getElementById("scene1-neuron-b");
        var neuronC = document.getElementById("scene1-neuron-c");
        var boxAB = document.getElementById("scene1-box-ab");
        var boxBC = document.getElementById("scene1-box-bc");
        var lightningB = document.getElementById("scene1-lightning-b");
        var lightningC = document.getElementById("scene1-lightning-c");
        var pathBA = document.getElementById("scene1-path-ba");
        var pathBS = document.getElementById("scene1-path-bs");
        var pathCD = document.getElementById("scene1-path-cd");
        var vesicle = document.getElementById("scene1-vesicle");
        var block = document.getElementById("scene1-block");
        var sumB = document.getElementById("scene1-sum-b");
        var sumC = document.getElementById("scene1-sum-c");

        var hints = [
            "观察突触结构，识别神经元与突触数量",
            "3个神经元，2个突触（①错误）",
            "刺激b：兴奋双向传导，电流计偏转2次",
            "刺激c：兴奋单向传递，电流计偏转1次",
            "②错误：刺激b偏转2次，刺激c偏转1次"
        ];

        function show(el) { el.style.display = ""; el.style.opacity = "1"; }
        function hide(el) { el.style.display = "none"; el.style.opacity = "0"; }

        function setStroke(group, color) {
            var els = group.querySelectorAll("path, line, ellipse");
            for (var i = 0; i < els.length; i++) els[i].setAttribute("stroke", color);
        }

        function resetAll() {
            if (animTimer) { clearTimeout(animTimer); animTimer = null; }
            hide(boxAB); hide(boxBC); hide(lightningB); hide(lightningC);
            hide(pathBA); hide(pathBS); hide(pathCD);
            hide(vesicle); hide(block); hide(sumB); hide(sumC);
            setStroke(neuronA, "#000"); setStroke(neuronB, "#000"); setStroke(neuronC, "#000");
            needle.style.transform = "rotate(0deg)";
            vesicle.setAttribute("cx", "540");
        }

        function animateVesicle() {
            var start = performance.now(), duration = 600;
            function frame(t) {
                var p = Math.min((t - start) / duration, 1);
                vesicle.setAttribute("cx", String(540 + p * 45));
                if (p < 1) requestAnimationFrame(frame);
            }
            requestAnimationFrame(frame);
        }

        function playStep2() {
            show(lightningB);
            animTimer = setTimeout(function() {
                show(pathBA);
                animTimer = setTimeout(function() {
                    needle.style.transform = "rotate(-30deg)";
                    animTimer = setTimeout(function() {
                        needle.style.transform = "rotate(0deg)";
                        animTimer = setTimeout(function() {
                            show(pathBS);
                            animTimer = setTimeout(function() {
                                show(vesicle); animateVesicle();
                                animTimer = setTimeout(function() {
                                    show(pathCD);
                                    animTimer = setTimeout(function() {
                                        needle.style.transform = "rotate(30deg)";
                                        animTimer = setTimeout(function() {
                                            needle.style.transform = "rotate(0deg)";
                                            animTimer = null;
                                        }, 500);
                                    }, 350);
                                }, 700);
                            }, 350);
                        }, 550);
                    }, 500);
                }, 350);
            }, 400);
        }

        function playStep3() {
            show(lightningC);
            animTimer = setTimeout(function() {
                show(pathCD);
                animTimer = setTimeout(function() {
                    needle.style.transform = "rotate(30deg)";
                    animTimer = setTimeout(function() {
                        needle.style.transform = "rotate(0deg)";
                        animTimer = setTimeout(function() {
                            show(block); animTimer = null;
                        }, 400);
                    }, 500);
                }, 350);
            }, 400);
        }

        function renderStep(step) {
            resetAll();
            hint.textContent = hints[step];
            stepInd.textContent = "步骤 " + step + "/4";
            btnPrev.disabled = (step === 0);
            btnNext.disabled = (step === totalSteps);
            switch (step) {
                case 0: break;
                case 1:
                    setStroke(neuronA, "#1565c0"); setStroke(neuronB, "#2e7d32"); setStroke(neuronC, "#c62828");
                    show(boxAB); show(boxBC); break;
                case 2: playStep2(); break;
                case 3: playStep3(); break;
                case 4: show(sumB); show(sumC); break;
            }
        }

        btnPrev.addEventListener("click", function() { if (currentStep > 0) { currentStep--; renderStep(currentStep); } });
        btnNext.addEventListener("click", function() { if (currentStep < totalSteps) { currentStep++; renderStep(currentStep); } });
        renderStep(0);
    })();
    </script>
</body>
</html>
