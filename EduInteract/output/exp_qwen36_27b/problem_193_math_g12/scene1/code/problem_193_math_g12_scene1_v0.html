<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三视图还原几何体 - 半圆锥与三棱锥组合</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "SimHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-svg { width: 800px; height: 500px; display: block; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            padding: 8px 20px; font-size: 14px; border: none; border-radius: 4px;
            cursor: pointer; background: #1976d2; color: #fff; min-width: 100px;
            transition: background 0.2s;
        }
        #scene1-controls button:disabled { background: #cccccc; cursor: default; }
        #scene1-controls button:hover:not(:disabled) { background: #1565c0; }
        #scene1-step-info { font-size: 14px; color: #333; max-width: 380px; text-align: center; }
        .fade-element { transition: opacity 0.4s ease; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <clipPath id="scene1-semicircle-clip">
                    <path d="M 125,230 A 50,50 0 0,1 225,230 Z" />
                </clipPath>
                <clipPath id="scene1-3d-semicone-clip">
                    <path d="M 560,65 L 475,285 A 85,38 0 0,1 645,285 Z" />
                </clipPath>
            </defs>

            <!-- ===== 分隔线 ===== -->
            <line x1="320" y1="20" x2="320" y2="420" stroke="#888888" stroke-width="1" stroke-dasharray="6,4" />

            <!-- ===== 正视图 ===== -->
            <g id="scene1-front-view">
                <!-- 三角形轮廓 -->
                <polygon points="90,35 30,135 150,135" fill="none" stroke="#000000" stroke-width="2" />
                <!-- 中线 -->
                <line x1="90" y1="35" x2="90" y2="135" stroke="#000000" stroke-width="1" />
                <!-- 底边尺寸线 -->
                <line x1="30" y1="148" x2="150" y2="148" stroke="#000000" stroke-width="1" />
                <line x1="90" y1="145" x2="90" y2="151" stroke="#000000" stroke-width="1" />
                <!-- 高度尺寸线 -->
                <line x1="118" y1="35" x2="118" y2="135" stroke="#000000" stroke-width="1" />
                <!-- 底边标注 -->
                <text x="58" y="162" text-anchor="middle" font-size="14" fill="#000000">1</text>
                <text x="122" y="162" text-anchor="middle" font-size="14" fill="#000000">1</text>
                <!-- 高度标注：放在尺寸线右侧，远离三角形 -->
                <text x="128" y="88" text-anchor="start" font-size="14" fill="#000000">a</text>
                <!-- 视图名：放在底部，远离尺寸标注 -->
                <text x="90" y="188" text-anchor="middle" font-size="14" fill="#000000">正视图</text>
            </g>

            <!-- ===== 侧视图 ===== -->
            <g id="scene1-side-view">
                <!-- 三角形轮廓 -->
                <polygon points="230,35 170,135 290,135" fill="none" stroke="#000000" stroke-width="2" />
                <!-- 中线 -->
                <line x1="230" y1="35" x2="230" y2="135" stroke="#000000" stroke-width="1" />
                <!-- 底边尺寸线 -->
                <line x1="170" y1="148" x2="290" y2="148" stroke="#000000" stroke-width="1" />
                <line x1="230" y1="145" x2="230" y2="151" stroke="#000000" stroke-width="1" />
                <!-- 高度尺寸线 -->
                <line x1="258" y1="35" x2="258" y2="135" stroke="#000000" stroke-width="1" />
                <!-- 底边标注 -->
                <text x="198" y="162" text-anchor="middle" font-size="14" fill="#000000">1</text>
                <text x="262" y="162" text-anchor="middle" font-size="14" fill="#000000">1</text>
                <!-- 高度标注 -->
                <text x="268" y="88" text-anchor="start" font-size="14" fill="#000000">a</text>
                <!-- 视图名 -->
                <text x="230" y="188" text-anchor="middle" font-size="14" fill="#000000">侧视图</text>
            </g>

            <!-- ===== 俯视图 ===== -->
            <g id="scene1-top-view">
                <!-- 半圆（上半圆） -->
                <path d="M 125,230 A 50,50 0 0,1 225,230 Z" fill="none" stroke="#000000" stroke-width="2" />
                <!-- 半圆直径线 -->
                <line x1="125" y1="230" x2="225" y2="230" stroke="#000000" stroke-width="2" />
                <!-- 三角形 -->
                <polygon points="125,230 225,230 175,330" fill="none" stroke="#000000" stroke-width="2" />
                <!-- 中线 -->
                <line x1="175" y1="230" x2="175" y2="330" stroke="#000000" stroke-width="1" />
                <!-- 底边尺寸线 -->
                <line x1="125" y1="342" x2="225" y2="342" stroke="#000000" stroke-width="1" />
                <line x1="175" y1="339" x2="175" y2="345" stroke="#000000" stroke-width="1" />
                <!-- 三角形高尺寸线 -->
                <line x1="200" y1="230" x2="200" y2="330" stroke="#000000" stroke-width="1" />
                <!-- 底边标注 -->
                <text x="143" y="356" text-anchor="middle" font-size="14" fill="#000000">1</text>
                <text x="207" y="356" text-anchor="middle" font-size="14" fill="#000000">1</text>
                <!-- 三角形高标注：放在尺寸线右侧，远离三角形 -->
                <text x="210" y="286" text-anchor="start" font-size="14" fill="#000000">1</text>
                <!-- 视图名：远离底边标注 -->
                <text x="175" y="388" text-anchor="middle" font-size="14" fill="#000000">俯视图</text>
            </g>

            <!-- ===== 俯视图高亮区域（初始隐藏） ===== -->
            <path id="scene1-top-semicircle-highlight" class="fade-element"
                  d="M 125,230 A 50,50 0 0,1 225,230 Z"
                  fill="#1565c0" fill-opacity="0" stroke="none" opacity="0" />
            <polygon id="scene1-top-triangle-highlight" class="fade-element"
                     points="125,230 225,230 175,330"
                     fill="#2e7d32" fill-opacity="0" stroke="none" opacity="0" />

            <!-- ===== 三维几何体 ===== -->
            <g id="scene1-3d-geometry">
                <!-- 半圆锥底面（椭圆上半弧） -->
                <path d="M 475,285 A 85,38 0 0,1 645,285" fill="none" stroke="#000000" stroke-width="2" />
                <!-- 三棱锥底面三角形 -->
                <polygon points="475,285 645,285 560,375" fill="none" stroke="#000000" stroke-width="2" />
                <!-- 公共底边 -->
                <line x1="475" y1="285" x2="645" y2="285" stroke="#000000" stroke-width="2" />
                <!-- 半圆锥侧面轮廓线 -->
                <line x1="560" y1="65" x2="475" y2="285" stroke="#000000" stroke-width="2" />
                <line x1="560" y1="65" x2="645" y2="285" stroke="#000000" stroke-width="2" />
                <!-- 三棱锥侧面轮廓线 -->
                <line x1="560" y1="65" x2="560" y2="375" stroke="#000000" stroke-width="2" />
                <!-- 顶点 -->
                <circle cx="560" cy="65" r="3" fill="#000000" />
            </g>

            <!-- ===== 3D高亮区域（初始隐藏） ===== -->
            <path id="scene1-3d-semicone-highlight" class="fade-element"
                  d="M 560,65 L 475,285 A 85,38 0 0,1 645,285 Z"
                  fill="#1565c0" fill-opacity="0" stroke="none" opacity="0" />
            <polygon id="scene1-3d-triprism-highlight" class="fade-element"
                     points="560,65 475,285 645,285 560,375"
                     fill="#2e7d32" fill-opacity="0" stroke="none" opacity="0" />

            <!-- ===== 步骤1标签：半圆锥（移到几何体外部左侧） ===== -->
            <text id="scene1-label-semicone" class="fade-element" x="430" y="170" text-anchor="start" font-size="14" fill="#1565c0" opacity="0">半圆锥</text>

            <!-- ===== 步骤2标签：三棱锥（移到几何体外部右侧） ===== -->
            <text id="scene1-label-triprism" class="fade-element" x="660" y="320" text-anchor="start" font-size="14" fill="#2e7d32" opacity="0">三棱锥</text>

            <!-- ===== 步骤3尺寸标注 ===== -->
            <text id="scene1-label-r1" class="fade-element" x="460" y="275" text-anchor="end" font-size="14" fill="#000000" opacity="0">r=1</text>
            <text id="scene1-label-base2" class="fade-element" x="560" y="405" text-anchor="middle" font-size="14" fill="#000000" opacity="0">底边=2</text>
            <text id="scene1-label-h1" class="fade-element" x="660" y="340" text-anchor="start" font-size="14" fill="#000000" opacity="0">高=1</text>
            <text id="scene1-label-a3d" class="fade-element" x="600" y="175" text-anchor="start" font-size="14" fill="#000000" opacity="0">a</text>

            <!-- ===== 步骤4元素 ===== -->
            <line id="scene1-symmetry-plane" class="fade-element" x1="560" y1="65" x2="560" y2="375"
                  stroke="#c62828" stroke-width="1" stroke-dasharray="6,4" opacity="0" />
            <line id="scene1-common-base" class="fade-element" x1="475" y1="285" x2="645" y2="285"
                  stroke="#c62828" stroke-width="2" opacity="0" />
            <circle id="scene1-vertex-highlight" class="fade-element" cx="560" cy="65" r="5" fill="#c62828" opacity="0" />
            <text id="scene1-label-a3d-red" class="fade-element" x="600" y="175" text-anchor="start" font-size="14" fill="#c62828" font-weight="bold" opacity="0">a</text>

        </svg>

        <!-- ===== 控件栏 ===== -->
        <div id="scene1-controls">
            <button id="scene1-prev-btn" disabled>◀ 上一步</button>
            <span id="scene1-step-info">步骤 1/5：观察三视图，注意各视图的形状和尺寸</span>
            <button id="scene1-next-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() { 'use strict';

        var currentStep = 0;
        var totalSteps = 5;

        var prevBtn = document.getElementById('scene1-prev-btn');
        var nextBtn = document.getElementById('scene1-next-btn');
        var stepInfo = document.getElementById('scene1-step-info');

        var topSemiHighlight = document.getElementById('scene1-top-semicircle-highlight');
        var topTriHighlight = document.getElementById('scene1-top-triangle-highlight');
        var semiHighlight = document.getElementById('scene1-3d-semicone-highlight');
        var triHighlight = document.getElementById('scene1-3d-triprism-highlight');
        var labelSemi = document.getElementById('scene1-label-semicone');
        var labelTri = document.getElementById('scene1-label-triprism');
        var labelR1 = document.getElementById('scene1-label-r1');
        var labelBase2 = document.getElementById('scene1-label-base2');
        var labelH1 = document.getElementById('scene1-label-h1');
        var labelA3d = document.getElementById('scene1-label-a3d');
        var symmetryPlane = document.getElementById('scene1-symmetry-plane');
        var commonBase = document.getElementById('scene1-common-base');
        var vertexHighlight = document.getElementById('scene1-vertex-highlight');
        var labelA3dRed = document.getElementById('scene1-label-a3d-red');

        var stepTexts = [
            "步骤 1/5：观察三视图，注意各视图的形状和尺寸",
            "步骤 2/5：俯视图半圆 → 对应半圆锥（蓝色高亮）",
            "步骤 3/5：俯视图三角形 → 对应三棱锥（绿色高亮）",
            "步骤 4/5：标注关键尺寸——半圆锥r=1，三棱锥底边=2高=1，锥体高=a",
            "步骤 5/5：两个锥体共享同一顶点和同一高度a"
        ];

        function showEl(el) {
            el.style.display = '';
            el.style.opacity = '1';
        }
        function hideEl(el) {
            el.style.display = 'none';
            el.style.opacity = '0';
        }

        function renderStep(step) {
            stepInfo.textContent = stepTexts[step];
            prevBtn.disabled = (step === 0);
            nextBtn.disabled = (step === totalSteps - 1);

            hideEl(topSemiHighlight);
            hideEl(topTriHighlight);
            hideEl(semiHighlight);
            hideEl(triHighlight);
            hideEl(labelSemi);
            hideEl(labelTri);
            hideEl(labelR1);
            hideEl(labelBase2);
            hideEl(labelH1);
            hideEl(labelA3d);
            hideEl(symmetryPlane);
            hideEl(commonBase);
            hideEl(vertexHighlight);
            hideEl(labelA3dRed);

            if (step >= 1) {
                topSemiHighlight.setAttribute('fill-opacity', '0.2');
                semiHighlight.setAttribute('fill-opacity', '0.2');
                showEl(topSemiHighlight);
                showEl(semiHighlight);
                showEl(labelSemi);
            }
            if (step >= 2) {
                topTriHighlight.setAttribute('fill-opacity', '0.2');
                triHighlight.setAttribute('fill-opacity', '0.2');
                showEl(topTriHighlight);
                showEl(triHighlight);
                showEl(labelTri);
            }
            if (step >= 3) {
                showEl(labelR1);
                showEl(labelBase2);
                showEl(labelH1);
                showEl(labelA3d);
            }
            if (step >= 4) {
                showEl(symmetryPlane);
                showEl(commonBase);
                showEl(vertexHighlight);
                showEl(labelA3dRed);
                hideEl(labelA3d);
            }
        }

        prevBtn.addEventListener('click', function() {
            if (currentStep > 0) { currentStep--; renderStep(currentStep); }
        });
        nextBtn.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) { currentStep++; renderStep(currentStep); }
        });

        renderStep(0);

    })();
    </script>
</body>
</html>
