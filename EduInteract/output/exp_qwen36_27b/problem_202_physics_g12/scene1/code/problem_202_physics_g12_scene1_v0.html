<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>带电粒子在复合场中的运动</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls {
            position: absolute; bottom: 10px; left: 0; right: 0;
            display: flex; justify-content: center; gap: 12px; z-index: 10;
        }
        #scene1-controls button {
            padding: 6px 16px; font-size: 14px; cursor: pointer;
            border: 1px solid #333; border-radius: 4px; background: #f5f5f5;
            font-family: "Microsoft YaHei", sans-serif;
        }
        #scene1-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene1-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene1-step-indicator {
            padding: 6px 16px; font-size: 14px;
            border: 1px solid #333; border-radius: 4px; background: #e3f2fd;
            line-height: 28px; display: inline-block; min-width: 80px; text-align: center;
        }
        #scene1-bg-electric {
            position: absolute; left: 145px; top: 30px; width: 340px; height: 390px;
            background: #1565c0; opacity: 0.1; pointer-events: none; z-index: 0;
        }
        #scene1-bg-magnetic {
            position: absolute; left: 485px; top: 30px; width: 255px; height: 390px;
            background: #1565c0; opacity: 0.05; pointer-events: none; z-index: 0;
        }
        .step-element { opacity: 0; transition: opacity 0.5s ease-in; pointer-events: none; }
        .step-element.visible { opacity: 1; pointer-events: auto; }
        @keyframes scene1-pulse {
            0%, 100% { r: 4; }
            50% { r: 7; }
        }
        .scene1-pulse { animation: scene1-pulse 1s ease-in-out 2; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <div id="scene1-bg-electric"></div>
        <div id="scene1-bg-magnetic"></div>

        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500" style="position:absolute; top:0; left:0; z-index:1;">
            <defs>
                <marker id="scene1-arrow-black" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
                    <path d="M0,0 L8,3 L0,6 Z" fill="#000"/>
                </marker>
                <marker id="scene1-arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
                    <path d="M0,0 L8,3 L0,6 Z" fill="#c62828"/>
                </marker>
                <marker id="scene1-arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
                    <path d="M0,0 L8,3 L0,6 Z" fill="#1565c0"/>
                </marker>
                <marker id="scene1-arrow-orange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
                    <path d="M0,0 L8,3 L0,6 Z" fill="#ff6f00"/>
                </marker>
            </defs>

            <!-- ===== 坐标系 ===== -->
            <g id="scene1-axes">
                <line x1="60" y1="167" x2="740" y2="167" stroke="#000" stroke-width="2" marker-end="url(#scene1-arrow-black)"/>
                <line x1="485" y1="420" x2="485" y2="30" stroke="#000" stroke-width="2" marker-end="url(#scene1-arrow-black)"/>
                <circle cx="485" cy="167" r="3" fill="#000"/>
            </g>

            <!-- ===== 边界线 x=-2L ===== -->
            <line x1="145" y1="30" x2="145" y2="420" stroke="#888" stroke-width="1" stroke-dasharray="5,5"/>

            <!-- ===== 电场线 ===== -->
            <g id="scene1-field-lines">
                <line x1="180" y1="60" x2="180" y2="155" stroke="#1565c0" stroke-width="1.5" marker-end="url(#scene1-arrow-blue)"/>
                <line x1="230" y1="60" x2="230" y2="155" stroke="#1565c0" stroke-width="1.5" marker-end="url(#scene1-arrow-blue)"/>
                <line x1="280" y1="60" x2="280" y2="155" stroke="#1565c0" stroke-width="1.5" marker-end="url(#scene1-arrow-blue)"/>
                <line x1="330" y1="60" x2="330" y2="155" stroke="#1565c0" stroke-width="1.5" marker-end="url(#scene1-arrow-blue)"/>
                <line x1="380" y1="60" x2="380" y2="155" stroke="#1565c0" stroke-width="1.5" marker-end="url(#scene1-arrow-blue)"/>
                <line x1="430" y1="60" x2="430" y2="155" stroke="#1565c0" stroke-width="1.5" marker-end="url(#scene1-arrow-blue)"/>
                <line x1="180" y1="410" x2="180" y2="180" stroke="#1565c0" stroke-width="1.5" marker-end="url(#scene1-arrow-blue)"/>
                <line x1="230" y1="410" x2="230" y2="180" stroke="#1565c0" stroke-width="1.5" marker-end="url(#scene1-arrow-blue)"/>
                <line x1="280" y1="410" x2="280" y2="180" stroke="#1565c0" stroke-width="1.5" marker-end="url(#scene1-arrow-blue)"/>
                <line x1="330" y1="410" x2="330" y2="180" stroke="#1565c0" stroke-width="1.5" marker-end="url(#scene1-arrow-blue)"/>
                <line x1="380" y1="410" x2="380" y2="180" stroke="#1565c0" stroke-width="1.5" marker-end="url(#scene1-arrow-blue)"/>
                <line x1="430" y1="410" x2="430" y2="180" stroke="#1565c0" stroke-width="1.5" marker-end="url(#scene1-arrow-blue)"/>
            </g>

            <!-- ===== 磁场×标记（4列，避开标签区域） ===== -->
            <g id="scene1-field-markers" font-size="14" fill="#1565c0" text-anchor="middle" dominant-baseline="central">
                <text x="610" y="90">×</text><text x="660" y="90">×</text><text x="710" y="90">×</text><text x="760" y="90">×</text>
                <text x="610" y="130">×</text><text x="660" y="130">×</text><text x="710" y="130">×</text><text x="760" y="130">×</text>
                <text x="610" y="170">×</text><text x="660" y="170">×</text><text x="710" y="170">×</text><text x="760" y="170">×</text>
                <text x="610" y="210">×</text><text x="660" y="210">×</text><text x="710" y="210">×</text><text x="760" y="210">×</text>
                <text x="610" y="250">×</text><text x="660" y="250">×</text><text x="710" y="250">×</text><text x="760" y="250">×</text>
                <text x="610" y="290">×</text><text x="660" y="290">×</text><text x="710" y="290">×</text><text x="760" y="290">×</text>
                <text x="610" y="330">×</text><text x="660" y="330">×</text><text x="710" y="330">×</text><text x="760" y="330">×</text>
                <text x="610" y="370">×</text><text x="660" y="370">×</text><text x="710" y="370">×</text><text x="760" y="370">×</text>
                <text x="610" y="410">×</text><text x="660" y="410">×</text><text x="710" y="410">×</text><text x="760" y="410">×</text>
            </g>

            <!-- ===== 固定标签 ===== -->
            <g id="scene1-labels-fixed" font-size="12" fill="#000">
                <text x="730" y="158">x</text>
                <text x="492" y="38">y</text>
                <text x="490" y="175">O</text>
                <text x="145" y="45" text-anchor="middle">x=-2L</text>
                <text x="315" y="45" text-anchor="middle">E</text>
                <text x="315" y="385" text-anchor="middle">E</text>
                <text x="635" y="75" text-anchor="middle">B</text>
            </g>

            <!-- ===== 固定点（A、C） ===== -->
            <g id="scene1-points-fixed">
                <circle id="scene1-point-A" cx="145" cy="103" r="4" fill="#c62828"/>
                <text x="155" y="95" font-size="12" fill="#000">A(-2L,L)</text>
                <circle id="scene1-point-C" cx="145" cy="167" r="4" fill="#c62828"/>
                <text x="155" y="195" font-size="12" fill="#000">C(-2L,0)</text>
            </g>

            <!-- ===== 步骤1：Ⅱ象限运动 ===== -->
            <g id="scene1-step1" class="step-element">
                <line x1="150" y1="103" x2="190" y2="103" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrow-red)"/>
                <text x="175" y="78" font-size="12" fill="#c62828" text-anchor="middle">v₀</text>
                <line x1="145" y1="103" x2="145" y2="135" stroke="#ff6f00" stroke-width="1.5" marker-end="url(#scene1-arrow-orange)"/>
                <text x="165" y="140" font-size="12" fill="#ff6f00">F_电</text>
                <path d="M 145,103 C 230,103 230,167 315,167" fill="none" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5"/>
            </g>

            <!-- ===== 步骤2：OC中点，速度分解 ===== -->
            <g id="scene1-step2" class="step-element">
                <circle id="scene1-point-mid" cx="315" cy="167" r="4" fill="#c62828"/>
                <text x="315" y="195" font-size="12" fill="#000" text-anchor="middle">OC中点</text>
                <line x1="315" y1="167" x2="350" y2="167" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrow-red)"/>
                <text x="330" y="150" font-size="12" fill="#c62828" text-anchor="middle">v_x=v₀</text>
                <line x1="315" y1="167" x2="315" y2="200" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrow-red)"/>
                <text x="350" y="225" font-size="12" fill="#c62828">v_y</text>
            </g>

            <!-- ===== 步骤3：Ⅲ象限运动，到达A' ===== -->
            <g id="scene1-step3" class="step-element">
                <path d="M 315,167 C 400,167 400,230 485,230" fill="none" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5"/>
                <circle id="scene1-point-Ap" cx="485" cy="230" r="4" fill="#c62828"/>
                <text x="495" y="280" font-size="12" fill="#000">A'(0,-L)</text>
                <!-- v_y=0 移到A'点上方，远离(0,L/4) -->
                <text x="525" y="110" font-size="12" fill="#c62828">v_y=0</text>
            </g>

            <!-- ===== 步骤4：磁场中圆周运动 ===== -->
            <g id="scene1-step4" class="step-element">
                <path id="scene1-traj-magnetic" d="M 485,230 A 40,40 0 0,1 485,151"
                      fill="none" stroke="#2e7d32" stroke-width="2"
                      stroke-dasharray="126" stroke-dashoffset="126"/>
                <circle id="scene1-point-center" cx="485" cy="190" r="3" fill="none" stroke="#2e7d32" stroke-width="1.5"/>
                <text x="505" y="235" font-size="12" fill="#2e7d32">圆心</text>
                <line x1="485" y1="190" x2="525" y2="190" stroke="#2e7d32" stroke-width="1" stroke-dasharray="3,3"/>
                <text x="545" y="155" font-size="12" fill="#2e7d32">R=5L/8</text>
                <line x1="485" y1="230" x2="485" y2="200" stroke="#ff6f00" stroke-width="1.5" marker-end="url(#scene1-arrow-orange)"/>
                <text x="535" y="310" font-size="12" fill="#ff6f00">F_洛</text>
            </g>

            <!-- ===== 步骤5：磁场出口 ===== -->
            <g id="scene1-step5" class="step-element">
                <circle id="scene1-point-exit" cx="485" cy="151" r="4" fill="#c62828"/>
                <text x="495" y="145" font-size="12" fill="#000">(0,L/4)</text>
                <line x1="480" y1="151" x2="440" y2="151" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrow-red)"/>
                <text x="460" y="140" font-size="12" fill="#c62828" text-anchor="middle">v₀</text>
            </g>

            <!-- ===== 步骤6：电场中返回x=-2L ===== -->
            <g id="scene1-step6" class="step-element">
                <path d="M 485,151 C 400,151 230,404 145,404" fill="none" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5"/>
                <circle id="scene1-point-end" cx="145" cy="404" r="4" fill="#c62828"/>
                <text x="160" y="415" font-size="12" fill="#000">(-2L,-15L/4)</text>
            </g>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 0/6</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        'use strict';
        var currentStep = 0;
        var maxStep = 6;
        var btnPrev = document.getElementById('scene1-btn-prev');
        var btnNext = document.getElementById('scene1-btn-next');
        var stepIndicator = document.getElementById('scene1-step-indicator');

        function updateStep() {
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === maxStep);
            stepIndicator.textContent = '步骤 ' + currentStep + '/' + maxStep;

            for (var i = 1; i <= maxStep; i++) {
                var stepGroup = document.getElementById('scene1-step' + i);
                if (stepGroup) {
                    if (i <= currentStep) {
                        stepGroup.classList.add('visible');
                    } else {
                        stepGroup.classList.remove('visible');
                    }
                }
            }

            var trajMagnetic = document.getElementById('scene1-traj-magnetic');
            if (trajMagnetic) {
                if (currentStep >= 4) {
                    trajMagnetic.style.transition = 'stroke-dashoffset 1s ease';
                    trajMagnetic.setAttribute('stroke-dashoffset', '0');
                } else {
                    trajMagnetic.style.transition = 'none';
                    trajMagnetic.setAttribute('stroke-dashoffset', '126');
                }
            }

            var pulseMap = {
                1: 'scene1-point-A',
                2: 'scene1-point-mid',
                3: 'scene1-point-Ap',
                5: 'scene1-point-exit',
                6: 'scene1-point-end'
            };
            if (pulseMap[currentStep]) {
                var point = document.getElementById(pulseMap[currentStep]);
                if (point) {
                    point.classList.remove('scene1-pulse');
                    void point.offsetWidth;
                    point.classList.add('scene1-pulse');
                    setTimeout(function() {
                        point.classList.remove('scene1-pulse');
                    }, 2000);
                }
            }
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) { currentStep--; updateStep(); }
        });
        btnNext.addEventListener('click', function() {
            if (currentStep < maxStep) { currentStep++; updateStep(); }
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') btnPrev.click();
            else if (e.key === 'ArrowRight') btnNext.click();
        });
        updateStep();
    })();
    </script>
</body>
</html>
