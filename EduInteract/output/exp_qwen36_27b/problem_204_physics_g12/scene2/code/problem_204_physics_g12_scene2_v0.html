<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>向心力需求与力供给关系图</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; overflow: hidden; }
        #scene2-svg { display: block; }
        .scene2-btn { cursor: pointer; }
        .scene2-btn:hover rect { fill: #bbdefb; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- ===== 坐标轴 ===== -->
            <!-- 横轴 -->
            <line id="scene2-axis-x" x1="100" y1="380" x2="700" y2="380" stroke="#333" stroke-width="1.5"/>
            <polygon points="700,380 690,375 690,385" fill="#333"/>
            <!-- 纵轴 -->
            <line id="scene2-axis-y" x1="100" y1="380" x2="100" y2="60" stroke="#333" stroke-width="1.5"/>
            <polygon points="100,60 95,70 105,70" fill="#333"/>

            <!-- ===== 横轴刻度线和标签 ===== -->
            <line x1="100" y1="380" x2="100" y2="386" stroke="#333" stroke-width="1"/>
            <text x="100" y="400" text-anchor="middle" font-size="12" fill="#555">0</text>

            <line x1="200" y1="380" x2="200" y2="386" stroke="#333" stroke-width="1"/>
            <text x="200" y="400" text-anchor="middle" font-size="12" fill="#555">25</text>

            <line x1="233.3" y1="380" x2="233.3" y2="386" stroke="#333" stroke-width="1"/>
            <text x="233.3" y="400" text-anchor="middle" font-size="12" fill="#555">33.3</text>

            <line x1="300" y1="380" x2="300" y2="386" stroke="#333" stroke-width="1"/>
            <text x="300" y="400" text-anchor="middle" font-size="12" fill="#555">50</text>

            <line x1="500" y1="380" x2="500" y2="386" stroke="#333" stroke-width="1"/>
            <text x="500" y="400" text-anchor="middle" font-size="12" fill="#555">100</text>

            <line x1="600" y1="380" x2="600" y2="386" stroke="#333" stroke-width="1"/>
            <text x="600" y="400" text-anchor="middle" font-size="12" fill="#555">125</text>

            <line x1="700" y1="380" x2="700" y2="386" stroke="#333" stroke-width="1"/>
            <text x="700" y="400" text-anchor="middle" font-size="12" fill="#555">150</text>

            <!-- ===== 纵轴刻度线和标签 ===== -->
            <line x1="94" y1="327" x2="100" y2="327" stroke="#333" stroke-width="1"/>
            <text x="88" y="327" text-anchor="end" dominant-baseline="middle" font-size="12" fill="#555">0.5</text>

            <line x1="94" y1="273" x2="100" y2="273" stroke="#333" stroke-width="1"/>
            <text x="88" y="273" text-anchor="end" dominant-baseline="middle" font-size="12" fill="#555">1.0</text>

            <line x1="94" y1="220" x2="100" y2="220" stroke="#333" stroke-width="1"/>
            <text x="88" y="220" text-anchor="end" dominant-baseline="middle" font-size="12" fill="#555">1.5</text>

            <line x1="94" y1="167" x2="100" y2="167" stroke="#333" stroke-width="1"/>
            <text x="88" y="167" text-anchor="end" dominant-baseline="middle" font-size="12" fill="#555">2.0</text>

            <line x1="94" y1="113" x2="100" y2="113" stroke="#333" stroke-width="1"/>
            <text x="88" y="113" text-anchor="end" dominant-baseline="middle" font-size="12" fill="#555">2.5</text>

            <line x1="94" y1="60" x2="100" y2="60" stroke="#333" stroke-width="1"/>
            <text x="88" y="60" text-anchor="end" dominant-baseline="middle" font-size="12" fill="#555">3.0</text>

            <!-- ===== 轴标签 ===== -->
            <text x="400" y="418" text-anchor="middle" font-size="14" fill="#333">ω²/(rad/s)²</text>
            <text x="55" y="220" text-anchor="middle" font-size="14" fill="#333">F/(mg)</text>

            <!-- ===== 水平参考线 ===== -->
            <!-- f_max = 0.5mg -->
            <line id="scene2-line-fmax" x1="100" y1="327" x2="700" y2="327" stroke="#c62828" stroke-width="1.5" stroke-dasharray="8,4"/>
            <!-- T_AB_max = 2mg -->
            <line id="scene2-line-tabmax" x1="100" y1="167" x2="700" y2="167" stroke="#888888" stroke-width="1.5" stroke-dasharray="8,4"/>
            <!-- 总供给 = 2.5mg -->
            <line id="scene2-line-total" x1="100" y1="113" x2="700" y2="113" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="8,4"/>

            <!-- ===== 向心力曲线 ===== -->
            <!-- F_A = mω²r_A, F/(mg) = 0.02ω² -->
            <line id="scene2-curve-fa" x1="100" y1="380" x2="700" y2="60" stroke="#c62828" stroke-width="2.5"/>
            <!-- F_B = mω²r_B, F/(mg) = 0.01ω² -->
            <line id="scene2-curve-fb" x1="100" y1="380" x2="700" y2="220" stroke="#1565c0" stroke-width="2.5"/>

            <!-- ===== 曲线标签 ===== -->
            <text x="660" y="95" text-anchor="start" font-size="13" fill="#c62828" font-weight="bold">F_A=mω²r_A</text>
            <text x="660" y="200" text-anchor="start" font-size="13" fill="#1565c0" font-weight="bold">F_B=mω²r_B</text>

            <!-- ===== 水平线标签 ===== -->
            <text x="660" y="318" text-anchor="start" font-size="12" fill="#c62828">f_max=0.5mg</text>
            <text x="660" y="158" text-anchor="start" font-size="12" fill="#888888">T_AB_max=2mg</text>
            <text x="660" y="115" text-anchor="start" font-size="12" fill="#2e7d32">f_max+T_AB=2.5mg</text>

            <!-- ===== 临界点标注（初始隐藏） ===== -->
            <!-- ω_0 临界标注 -->
            <g id="scene2-crit-omega0-group" opacity="0" style="transition: opacity 0.5s;">
                <line x1="200" y1="380" x2="200" y2="60" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
                <circle cx="200" cy="327" r="5" fill="#c62828"/>
                <text x="200" y="308" text-anchor="middle" font-size="13" fill="#c62828" font-weight="bold">ω₀²=25</text>
                <text x="200" y="290" text-anchor="middle" font-size="11" fill="#c62828">AB绳开始有弹力</text>
            </g>

            <!-- ω_1 临界标注 -->
            <g id="scene2-crit-omega1-group" opacity="0" style="transition: opacity 0.5s;">
                <line x1="233.3" y1="380" x2="233.3" y2="60" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
                <circle cx="233.3" cy="327" r="5" fill="#c62828"/>
                <text x="233.3" y="308" text-anchor="middle" font-size="13" fill="#c62828" font-weight="bold">ω₁²=100/3</text>
                <text x="233.3" y="290" text-anchor="middle" font-size="11" fill="#c62828">OB绳开始有弹力</text>
            </g>

            <!-- ω_2 临界标注 -->
            <g id="scene2-crit-omega2-group" opacity="0" style="transition: opacity 0.5s;">
                <line x1="600" y1="380" x2="600" y2="60" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
                <circle cx="600" cy="113" r="5" fill="#c62828"/>
                <text x="600" y="94" text-anchor="middle" font-size="13" fill="#c62828" font-weight="bold">ω₂²=125</text>
                <text x="600" y="76" text-anchor="middle" font-size="11" fill="#c62828">A开始滑动</text>
            </g>

            <!-- ===== 当前ω²高亮线和交点 ===== -->
            <line id="scene2-highlight-line" x1="100" y1="380" x2="100" y2="60" stroke="#2e7d32" stroke-width="2" opacity="0.7"/>
            <circle id="scene2-highlight-point-a" cx="100" cy="380" r="6" fill="#c62828" stroke="#fff" stroke-width="2"/>
            <circle id="scene2-highlight-point-b" cx="100" cy="380" r="6" fill="#1565c0" stroke="#fff" stroke-width="2"/>

            <!-- ===== 当前ω值显示框 ===== -->
            <rect id="scene2-display-box" x="580" y="25" width="160" height="35" rx="5" fill="#fff" stroke="#2e7d32" stroke-width="1.5"/>
            <text id="scene2-display-text" x="660" y="47" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#2e7d32" font-weight="bold">ω = 0.00 rad/s</text>

            <!-- ===== 图例 ===== -->
            <rect id="scene2-legend-box" x="110" y="420" width="200" height="20" rx="3" fill="rgba(255,255,255,0.85)" stroke="#ccc" stroke-width="1"/>
            <line x1="118" y1="430" x2="138" y2="430" stroke="#c62828" stroke-width="2.5"/>
            <text x="143" y="430" text-anchor="start" dominant-baseline="middle" font-size="12" fill="#333">A向心力</text>
            <line x1="205" y1="430" x2="225" y2="430" stroke="#1565c0" stroke-width="2.5"/>
            <text x="230" y="430" text-anchor="start" dominant-baseline="middle" font-size="12" fill="#333">B向心力</text>

            <!-- ===== 滑块 ===== -->
            <rect id="scene2-slider-track" x="120" y="455" width="560" height="6" rx="3" fill="#e0e0e0"/>
            <circle id="scene2-slider-handle" cx="120" cy="458" r="12" fill="#1565c0" stroke="#fff" stroke-width="2" style="cursor: grab;"/>
            <text x="120" y="478" text-anchor="start" font-size="12" fill="#555">ω²=</text>
            <text id="scene2-slider-value" x="400" y="478" text-anchor="middle" font-size="13" fill="#1565c0" font-weight="bold">0.0</text>

            <!-- ===== 快捷按钮 ===== -->
            <g id="scene2-btn-omega0" class="scene2-btn" onclick="window._scene2Jump(25)">
                <rect x="150" y="484" width="70" height="18" rx="4" fill="#e3f2fd" stroke="#1565c0" stroke-width="1"/>
                <text x="185" y="493" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1565c0" font-weight="bold">ω₀</text>
            </g>
            <g id="scene2-btn-omega1" class="scene2-btn" onclick="window._scene2Jump(33.333)">
                <rect x="240" y="484" width="80" height="18" rx="4" fill="#e3f2fd" stroke="#1565c0" stroke-width="1"/>
                <text x="280" y="493" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1565c0" font-weight="bold">ω₁</text>
            </g>
            <g id="scene2-btn-omega2" class="scene2-btn" onclick="window._scene2Jump(125)">
                <rect x="340" y="484" width="70" height="18" rx="4" fill="#e3f2fd" stroke="#1565c0" stroke-width="1"/>
                <text x="375" y="493" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#1565c0" font-weight="bold">ω₂</text>
            </g>
        </svg>
    </div>
    <script>
    (function() {
        'use strict';

        // ===== 常量 =====
        var ORIGIN_X = 100, ORIGIN_Y = 380;
        var X_SCALE = 4;       // px per unit of ω²
        var Y_SCALE = 106.67;  // px per unit of F/(mg)
        var SLIDER_X_MIN = 120, SLIDER_X_MAX = 680;
        var SLIDER_Y = 458;
        var OMEGA2_MAX = 150;

        var OMEGA0_SQ = 25;
        var OMEGA1_SQ = 100 / 3;
        var OMEGA2_SQ = 125;

        // ===== 状态 =====
        var currentOmega2 = 0;
        var isDragging = false;
        var isAnimating = false;

        // ===== DOM 引用 =====
        var svg = document.getElementById('scene2-svg');
        var highlightLine = document.getElementById('scene2-highlight-line');
        var pointA = document.getElementById('scene2-highlight-point-a');
        var pointB = document.getElementById('scene2-highlight-point-b');
        var displayText = document.getElementById('scene2-display-text');
        var sliderHandle = document.getElementById('scene2-slider-handle');
        var sliderValue = document.getElementById('scene2-slider-value');
        var critOmega0 = document.getElementById('scene2-crit-omega0-group');
        var critOmega1 = document.getElementById('scene2-crit-omega1-group');
        var critOmega2 = document.getElementById('scene2-crit-omega2-group');

        // ===== 坐标映射 =====
        function omega2ToX(o2) { return ORIGIN_X + o2 * X_SCALE; }
        function fToY(f) { return ORIGIN_Y - f * Y_SCALE; }
        function sliderXToOmega2(x) {
            return Math.max(0, Math.min(OMEGA2_MAX, (x - SLIDER_X_MIN) / (SLIDER_X_MAX - SLIDER_X_MIN) * OMEGA2_MAX));
        }
        function omega2ToSliderX(o2) {
            return SLIDER_X_MIN + (o2 / OMEGA2_MAX) * (SLIDER_X_MAX - SLIDER_X_MIN);
        }
        function fA(o2) { return 0.02 * o2; }
        function fB(o2) { return 0.01 * o2; }

        // ===== 更新函数 =====
        function update() {
            var x = omega2ToX(currentOmega2);
            var ya = fToY(fA(currentOmega2));
            var yb = fToY(fB(currentOmega2));
            var sx = omega2ToSliderX(currentOmega2);

            // 高亮线
            highlightLine.setAttribute('x1', x);
            highlightLine.setAttribute('x2', x);

            // 交点
            pointA.setAttribute('cx', x);
            pointA.setAttribute('cy', ya);
            pointB.setAttribute('cx', x);
            pointB.setAttribute('cy', yb);

            // 显示框
            var omega = Math.sqrt(currentOmega2);
            displayText.textContent = 'ω = ' + omega.toFixed(2) + ' rad/s';

            // 滑块手柄
            sliderHandle.setAttribute('cx', sx);

            // 滑块值
            sliderValue.textContent = currentOmega2.toFixed(1);

            // 临界点可见性
            var show0 = currentOmega2 >= OMEGA0_SQ - 3;
            var show1 = currentOmega2 >= OMEGA1_SQ - 3;
            var show2 = currentOmega2 >= OMEGA2_SQ - 5;
            critOmega0.setAttribute('opacity', show0 ? '1' : '0');
            critOmega1.setAttribute('opacity', show1 ? '1' : '0');
            critOmega2.setAttribute('opacity', show2 ? '1' : '0');
        }

        // ===== 获取SVG坐标 =====
        function getSVGX(clientX) {
            var rect = svg.getBoundingClientRect();
            return clientX - rect.left;
        }

        // ===== 滑块拖拽 =====
        function onDragStart(e) {
            if (isAnimating) return;
            isDragging = true;
            sliderHandle.style.cursor = 'grabbing';
            e.preventDefault();
        }

        function onDragMove(e) {
            if (!isDragging) return;
            var clientX = e.touches ? e.touches[0].clientX : e.clientX;
            var svgX = getSVGX(clientX);
            currentOmega2 = sliderXToOmega2(svgX);
            update();
            e.preventDefault();
        }

        function onDragEnd(e) {
            if (!isDragging) return;
            isDragging = false;
            sliderHandle.style.cursor = 'grab';
        }

        // 滑块轨道点击
        function onTrackClick(e) {
            if (isAnimating) return;
            var clientX = e.touches ? e.touches[0].clientX : e.clientX;
            var svgX = getSVGX(clientX);
            // 检查是否点击在轨道范围内
            if (svgX >= SLIDER_X_MIN - 15 && svgX <= SLIDER_X_MAX + 15) {
                currentOmega2 = sliderXToOmega2(svgX);
                update();
            }
        }

        // 绑定滑块事件
        sliderHandle.addEventListener('mousedown', onDragStart);
        sliderHandle.addEventListener('touchstart', onDragStart, { passive: false });
        document.addEventListener('mousemove', onDragMove);
        document.addEventListener('touchmove', onDragMove, { passive: false });
        document.addEventListener('mouseup', onDragEnd);
        document.addEventListener('touchend', onDragEnd);

        var sliderTrack = document.getElementById('scene2-slider-track');
        sliderTrack.addEventListener('mousedown', onTrackClick);
        sliderTrack.addEventListener('touchstart', onTrackClick, { passive: false });

        // ===== 快捷按钮动画 =====
        function animateTo(targetOmega2) {
            if (isAnimating) return;
            isAnimating = true;
            var startOmega2 = currentOmega2;
            var startTime = performance.now();
            var duration = 300;

            function step(timestamp) {
                var elapsed = timestamp - startTime;
                var progress = Math.min(elapsed / duration, 1);
                var eased = 1 - Math.pow(1 - progress, 3);
                currentOmega2 = startOmega2 + (targetOmega2 - startOmega2) * eased;
                update();
                if (progress < 1) {
                    requestAnimationFrame(step);
                } else {
                    isAnimating = false;
                }
            }
            requestAnimationFrame(step);
        }

        // 暴露给全局的跳转函数
        window._scene2Jump = function(val) {
            animateTo(val);
        };

        // ===== 初始化 =====
        update();

    })();
    </script>
</body>
</html>
