<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>垂直平分线与角度推导</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; margin: 0 auto; overflow: hidden; }
        #scene1-svg { width: 800px; height: 500px; display: block; }
        #scene1-controls {
            position: absolute; bottom: 12px; left: 0; right: 0;
            display: flex; justify-content: center; align-items: center; gap: 16px; z-index: 10;
        }
        #scene1-controls button {
            padding: 7px 20px; font-size: 14px; cursor: pointer;
            border: 1px solid #bbb; border-radius: 4px; background: #fff; color: #333;
            font-family: inherit;
        }
        #scene1-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene1-controls button:hover:not(:disabled) { background: #e8e8e8; }
        #scene1-step-indicator { font-size: 14px; color: #666; min-width: 80px; text-align: center; }

        .step-element { opacity: 0; transition: opacity 0.3s ease-in; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <!-- ===== 推导文字面板边框 ===== -->
            <line x1="570" y1="30" x2="780" y2="30" stroke="#ddd" stroke-width="1"/>
            <line x1="570" y1="480" x2="780" y2="480" stroke="#ddd" stroke-width="1"/>
            <line x1="570" y1="30" x2="570" y2="480" stroke="#ddd" stroke-width="1"/>
            <line x1="780" y1="30" x2="780" y2="480" stroke="#ddd" stroke-width="1"/>

            <!-- 面板标题 -->
            <text x="675" y="48" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">推导过程</text>
            <line x1="580" y1="56" x2="760" y2="56" stroke="#ddd" stroke-width="1"/>

            <!-- ===== 步骤0：△ABC 基础图形（始终可见） ===== -->
            <!-- 三角形三边 -->
            <line x1="320" y1="220" x2="520" y2="360" stroke="#000" stroke-width="2" stroke-linecap="round"/>
            <line x1="320" y1="220" x2="120" y2="360" stroke="#000" stroke-width="2" stroke-linecap="round"/>
            <line x1="120" y1="360" x2="520" y2="360" stroke="#000" stroke-width="2" stroke-linecap="round"/>

            <!-- 顶点 -->
            <circle cx="320" cy="220" r="3.5" fill="#000"/>
            <circle cx="520" cy="360" r="3.5" fill="#000"/>
            <circle cx="120" cy="360" r="3.5" fill="#000"/>

            <!-- 顶点标签 -->
            <text x="320" y="205" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">A</text>
            <text x="538" y="378" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">B</text>
            <text x="102" y="378" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">C</text>

            <!-- ∠BAC 角弧（半径45，从35°到145°） -->
            <path d="M 356.86,245.81 A 45,45 0 0,1 283.14,245.81" fill="none" stroke="#000" stroke-width="1.5"/>
            <!-- ∠BAC=110° 标签：远离三角形边 -->
            <text x="320" y="310" text-anchor="middle" font-size="13" fill="#000">∠BAC=110°</text>

            <!-- 面板文字 - 步骤0（始终可见） -->
            <text x="585" y="72" font-size="13" font-weight="bold" fill="#333">已知：</text>
            <text x="585" y="105" font-size="13" fill="#333">∠BAC = 110°</text>
            <text x="585" y="138" font-size="13" fill="#333">∠B + ∠C = 70°</text>

            <!-- ===== 步骤1：AB的垂直平分线EG ===== -->
            <g id="scene1-step1" class="step-element">
                <!-- 垂直平分线EG（蓝色虚线） -->
                <line x1="362.4" y1="372.3" x2="437.2" y2="265.4" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="6,4" stroke-linecap="round"/>
                <!-- 中点G -->
                <circle cx="420" cy="290" r="3.5" fill="#000"/>
                <!-- G标签：远离虚线 -->
                <text x="480" y="240" text-anchor="middle" font-size="14" font-weight="bold" fill="#000">G</text>
                <!-- 线段AE（蓝色实线） -->
                <line x1="320" y1="220" x2="371" y2="360" stroke="#1565c0" stroke-width="2" stroke-linecap="round"/>
                <!-- 交点E -->
                <circle cx="371" cy="360" r="3.5" fill="#000"/>
                <text x="371" y="395" text-anchor="middle" font-size="14" font-weight="bold" fill="#000">E</text>
                <!-- 直角标记（G处） -->
                <polygon points="420,290 411.86,284.19 406.20,292.27 414.34,298.08" fill="none" stroke="#888" stroke-width="1"/>
                <!-- ∠EAB角弧（半径35，从35°到70°） -->
                <path d="M 348.67,240.08 A 35,35 0 0,1 331.97,252.89" fill="none" stroke="#1565c0" stroke-width="1.5"/>
                <!-- ∠EAB=∠B 标签：远离三角形边 -->
                <text x="410" y="218" text-anchor="middle" font-size="12" fill="#1565c0">∠EAB=∠B</text>
                <!-- 等长标记 EA=EB（蓝色短划线） -->
                <line x1="341.74" y1="291.37" x2="349.26" y2="288.63" stroke="#1565c0" stroke-width="2" stroke-linecap="round"/>
                <line x1="445.5" y1="355" x2="445.5" y2="365" stroke="#1565c0" stroke-width="2" stroke-linecap="round"/>

                <!-- 面板文字 - 步骤1 -->
                <text x="585" y="182" font-size="13" fill="#1565c0">EG 垂直平分 AB</text>
                <text x="585" y="215" font-size="13" fill="#1565c0">⇒ EA = EB</text>
                <text x="585" y="248" font-size="13" fill="#1565c0">⇒ ∠EAB = ∠B</text>
            </g>

            <!-- ===== 步骤2：AC的垂直平分线FH ===== -->
            <g id="scene1-step2" class="step-element">
                <!-- 垂直平分线FH（红色虚线） -->
                <line x1="277.6" y1="372.3" x2="202.8" y2="265.4" stroke="#c62828" stroke-width="1.5" stroke-dasharray="6,4" stroke-linecap="round"/>
                <!-- 中点H -->
                <circle cx="220" cy="290" r="3.5" fill="#000"/>
                <!-- H标签：远离虚线 -->
                <text x="148" y="240" text-anchor="middle" font-size="14" font-weight="bold" fill="#000">H</text>
                <!-- 线段AF（红色实线） -->
                <line x1="320" y1="220" x2="269" y2="360" stroke="#c62828" stroke-width="2" stroke-linecap="round"/>
                <!-- 交点F -->
                <circle cx="269" cy="360" r="3.5" fill="#000"/>
                <text x="269" y="395" text-anchor="middle" font-size="14" font-weight="bold" fill="#000">F</text>
                <!-- 直角标记（H处） -->
                <polygon points="220,290 228.14,284.19 233.80,292.27 225.66,298.08" fill="none" stroke="#888" stroke-width="1"/>
                <!-- ∠FAC角弧（半径35，从110°到145°） -->
                <path d="M 308.03,252.89 A 35,35 0 0,1 291.33,240.08" fill="none" stroke="#c62828" stroke-width="1.5"/>
                <!-- ∠FAC=∠C 标签：远离三角形边 -->
                <text x="225" y="218" text-anchor="middle" font-size="12" fill="#c62828">∠FAC=∠C</text>
                <!-- 等长标记 FA=FC（红色短划线） -->
                <line x1="290.74" y1="288.63" x2="298.26" y2="291.37" stroke="#c62828" stroke-width="2" stroke-linecap="round"/>
                <line x1="194.5" y1="355" x2="194.5" y2="365" stroke="#c62828" stroke-width="2" stroke-linecap="round"/>

                <!-- 面板文字 - 步骤2 -->
                <text x="585" y="288" font-size="13" fill="#c62828">FH 垂直平分 AC</text>
                <text x="585" y="321" font-size="13" fill="#c62828">⇒ FA = FC</text>
                <text x="585" y="354" font-size="13" fill="#c62828">⇒ ∠FAC = ∠C</text>
            </g>

            <!-- ===== 步骤3：计算∠EAF ===== -->
            <g id="scene1-step3" class="step-element">
                <!-- ∠EAF角弧（绿色加粗，半径40，从70°到110°） -->
                <path d="M 333.68,257.59 A 40,40 0 0,1 306.32,257.59" fill="none" stroke="#2e7d32" stroke-width="2.5"/>
                <!-- ∠EAF=40° 标签：远离三角形边 -->
                <text x="320" y="345" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e7d32">∠EAF=40°</text>

                <!-- 面板文字 - 步骤3（增大间距避免CROWDED） -->
                <text x="585" y="378" font-size="13" fill="#2e7d32">∠EAF = ∠BAC − ∠EAB − ∠FAC</text>
                <text x="585" y="411" font-size="13" fill="#2e7d32">= 110° − ∠B − ∠C</text>
                <text x="585" y="444" font-size="13" fill="#2e7d32">= 110° − 70° = 40°</text>

                <!-- 结论框（上移避免CLIPPED，与上方文字保持间距） -->
                <line x1="590" y1="452" x2="760" y2="452" stroke="#2e7d32" stroke-width="2"/>
                <line x1="590" y1="482" x2="760" y2="482" stroke="#2e7d32" stroke-width="2"/>
                <line x1="590" y1="452" x2="590" y2="482" stroke="#2e7d32" stroke-width="2"/>
                <line x1="760" y1="452" x2="760" y2="482" stroke="#2e7d32" stroke-width="2"/>
                <text x="675" y="471" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e7d32">答案：∠EAF = 40°</text>
            </g>
        </svg>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 0/3</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // ===== 布局坐标表（对照 spec.json） =====
        // A(320,220) B(520,360) C(120,360)
        // G(420,290) AB中点  H(220,290) AC中点
        // E(371,360) AB垂直平分线交BC  F(269,360) AC垂直平分线交BC

        var currentStep = 0;
        var maxStep = 3;

        var btnPrev = document.getElementById('scene1-btn-prev');
        var btnNext = document.getElementById('scene1-btn-next');
        var stepIndicator = document.getElementById('scene1-step-indicator');

        // 工具函数：显示/隐藏元素
        function showEl(el) {
            el.style.display = '';
            el.style.opacity = '1';
        }
        function hideEl(el) {
            el.style.display = 'none';
            el.style.opacity = '0';
        }

        function updateStep() {
            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === maxStep);
            stepIndicator.textContent = '步骤 ' + currentStep + '/' + maxStep;

            // 更新各步骤元素可见性
            for (var i = 1; i <= maxStep; i++) {
                var el = document.getElementById('scene1-step' + i);
                if (i <= currentStep) {
                    showEl(el);
                } else {
                    hideEl(el);
                }
            }
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < maxStep) {
                currentStep++;
                updateStep();
            }
        });

        // 初始化：隐藏所有步骤元素
        updateStep();
    })();
    </script>
</body>
</html>
