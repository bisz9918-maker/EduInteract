<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抛物线结论验证 - 场景2</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-svg { position: absolute; top: 0; left: 0; }

        /* Conclusion card (HTML overlay) */
        #scene2-conclusion-card {
            position: absolute; left: 530px; top: 55px; width: 240px;
            background: #fff; border: 2px solid #1565c0; border-radius: 8px;
            padding: 10px 15px; box-sizing: border-box;
        }
        .scene2-concl-row {
            height: 55px; display: flex; align-items: center; font-size: 13px; color: #000;
        }
        .scene2-concl-row .scene2-mark {
            margin-left: auto; font-size: 20px; min-width: 24px; text-align: center;
        }

        /* Derivation box (HTML overlay) */
        #scene2-derivation-box {
            position: absolute; left: 60px; top: 375px; width: 460px; height: 55px;
            background: #fff; border: 1px solid #888888; border-radius: 6px;
            padding: 8px 15px; box-sizing: border-box; display: none;
        }
        #scene2-derivation-box .scene2-deriv-line {
            font-size: 13px; color: #333; line-height: 24px;
        }

        /* Answer box (HTML overlay) */
        #scene2-answer-box {
            position: absolute; left: 200px; top: 380px; width: 220px; height: 40px;
            background: rgba(46,125,50,0.20); border: 1px solid #2e7d32; border-radius: 6px;
            display: none; align-items: center; justify-content: center;
        }
        #scene2-answer-box .scene2-answer-text {
            font-size: 16px; font-weight: bold; color: #2e7d32;
        }

        /* Controls */
        #scene2-controls {
            position: absolute; bottom: 10px; left: 0; right: 0;
            display: flex; justify-content: center; gap: 12px; z-index: 10;
        }
        #scene2-controls button {
            padding: 6px 24px; border: none; border-radius: 6px;
            font-size: 14px; cursor: pointer; font-family: inherit;
        }
        #scene2-prev-btn { background: #e0e0e0; color: #333; }
        #scene2-prev-btn:hover:not(:disabled) { background: #d0d0d0; }
        #scene2-prev-btn:disabled { opacity: 0.4; cursor: default; }
        #scene2-next-btn { background: #1565c0; color: #fff; }
        #scene2-next-btn:hover:not(:disabled) { background: #0d47a1; }
        #scene2-next-btn:disabled { opacity: 0.4; cursor: default; }

        .scene2-fade { transition: opacity 0.3s ease; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <marker id="scene2-arrow-x" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
                </marker>
                <marker id="scene2-arrow-y" markerWidth="7" markerHeight="10" refX="3.5" refY="0" orient="auto">
                    <polygon points="0 10, 3.5 0, 7 10" fill="#000"/>
                </marker>
            </defs>

            <!-- X axis -->
            <line x1="50" y1="340" x2="490" y2="340" stroke="#000" stroke-width="2" marker-end="url(#scene2-arrow-x)"/>
            <!-- Y axis -->
            <line x1="160" y1="370" x2="160" y2="60" stroke="#000" stroke-width="2" marker-end="url(#scene2-arrow-y)"/>

            <!-- Tick marks on x-axis -->
            <line x1="105" y1="336" x2="105" y2="344" stroke="#000" stroke-width="1"/>
            <line x1="160" y1="336" x2="160" y2="344" stroke="#000" stroke-width="1"/>
            <line x1="215" y1="336" x2="215" y2="344" stroke="#000" stroke-width="1"/>
            <line x1="325" y1="336" x2="325" y2="344" stroke="#000" stroke-width="1"/>
            <!-- Tick mark on y-axis -->
            <line x1="156" y1="175" x2="164" y2="175" stroke="#000" stroke-width="1"/>

            <!-- Symmetry axis x=1 -->
            <line id="scene2-axis" x1="215" y1="370" x2="215" y2="60" stroke="#888888" stroke-width="1.5" stroke-dasharray="6,4"/>

            <!-- Fill areas (hidden by default) -->
            <!-- Blue fill: 0 < x < 1 (y increasing) -->
            <path id="scene2-fill-blue" class="scene2-fade"
                d="M 160,340 L 160,175 L 171,155 L 182,140 L 193,129 L 204,122 L 215,120 L 215,340 Z"
                fill="#1565c0" style="opacity:0"/>
            <!-- Red fill: 1 < x < 3 (y decreasing) -->
            <path id="scene2-fill-red" class="scene2-fade"
                d="M 215,340 L 215,120 L 226,122 L 237,129 L 248,140 L 259,155 L 270,175 L 281,199 L 292,228 L 303,261 L 314,298 L 325,340 Z"
                fill="#c62828" style="opacity:0"/>
            <!-- Green fill: -1 < x < 3 (y > 0) -->
            <path id="scene2-fill-green" class="scene2-fade"
                d="M 105,340 L 116,298 L 128,261 L 139,228 L 150,199 L 160,175 L 171,155 L 182,140 L 193,129 L 204,122 L 215,120 L 226,122 L 237,129 L 248,140 L 259,155 L 270,175 L 281,199 L 292,228 L 303,261 L 314,298 L 325,340 Z"
                fill="#2e7d32" style="opacity:0"/>

            <!-- Parabola y = -x² + 2x + 3 (accurate polyline) -->
            <path id="scene2-parabola"
                d="M 105,340 L 116,298 L 128,261 L 139,228 L 150,199 L 160,175 L 171,155 L 182,140 L 193,129 L 204,122 L 215,120 L 226,122 L 237,129 L 248,140 L 259,155 L 270,175 L 281,199 L 292,228 L 303,261 L 314,298 L 325,340"
                fill="none" stroke="#000" stroke-width="2.5"/>

            <!-- Key points -->
            <circle id="scene2-pt-neg1" cx="105" cy="340" r="4" fill="#000"/>
            <circle id="scene2-pt-0" cx="160" cy="175" r="4" fill="#000"/>
            <circle id="scene2-pt-3" cx="325" cy="340" r="4" fill="#000"/>
            <circle id="scene2-pt-vertex" cx="215" cy="120" r="4" fill="#000"/>

            <!-- Axis labels -->
            <text x="510" y="335" font-size="14" font-weight="bold" fill="#000">x</text>
            <text x="155" y="45" font-size="14" font-weight="bold" fill="#000">y</text>

            <!-- Tick value labels -->
            <text x="105" y="360" font-size="12" fill="#000" text-anchor="middle">-1</text>
            <text x="150" y="360" font-size="12" fill="#000" text-anchor="middle">O</text>
            <text x="215" y="360" font-size="12" fill="#000" text-anchor="middle">1</text>
            <text x="325" y="360" font-size="12" fill="#000" text-anchor="middle">3</text>
            <!-- y-axis "3" label: moved left of parabola bbox (x<105) -->
            <text x="100" y="180" font-size="12" fill="#000" text-anchor="end">3</text>

            <!-- Point coordinate labels: placed outside parabola bbox -->
            <!-- (-1,0): left of parabola (x<105) -->
            <text x="70" y="325" font-size="12" fill="#000" font-family="monospace">(-1,0)</text>
            <!-- (0,3): above parabola (y<120) -->
            <text x="175" y="110" font-size="12" fill="#000" font-family="monospace">(0,3)</text>
            <!-- (3,0): right of parabola (x>325) -->
            <text x="335" y="330" font-size="12" fill="#000" font-family="monospace">(3,0)</text>
            <!-- (1,4): above parabola (y<120) -->
            <text x="225" y="105" font-size="12" fill="#000" font-family="monospace">(1,4)</text>

            <!-- Symmetry axis label (above parabola) -->
            <text x="220" y="55" font-size="12" fill="#888888">x = 1</text>
        </svg>

        <!-- Conclusion card (HTML overlay, outside SVG) -->
        <div id="scene2-conclusion-card">
            <div class="scene2-concl-row">① 4ac &lt; b² <span class="scene2-mark" id="scene2-mark-1"></span></div>
            <div class="scene2-concl-row">② 3a + c &gt; 0 <span class="scene2-mark" id="scene2-mark-2"></span></div>
            <div class="scene2-concl-row">③ x &gt; 0 时 y 随 x 增大而减小 <span class="scene2-mark" id="scene2-mark-3"></span></div>
            <div class="scene2-concl-row">④ y &gt; 0 时 -1 &lt; x &lt; 3 <span class="scene2-mark" id="scene2-mark-4"></span></div>
            <div class="scene2-concl-row">⑤ 方程两根 x₁=-1, x₂=3 <span class="scene2-mark" id="scene2-mark-5"></span></div>
        </div>

        <!-- Derivation box (HTML overlay) -->
        <div id="scene2-derivation-box">
            <div class="scene2-deriv-line" id="scene2-deriv-line1"></div>
            <div class="scene2-deriv-line" id="scene2-deriv-line2"></div>
        </div>

        <!-- Answer box (HTML overlay) -->
        <div id="scene2-answer-box">
            <span class="scene2-answer-text" id="scene2-answer-text"></span>
        </div>

        <!-- Controls -->
        <div id="scene2-controls">
            <button id="scene2-prev-btn" disabled>◀ 上一步</button>
            <button id="scene2-next-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        'use strict';

        var currentStep = 0;
        var totalSteps = 6;

        // DOM references
        var prevBtn = document.getElementById('scene2-prev-btn');
        var nextBtn = document.getElementById('scene2-next-btn');
        var ptNeg1 = document.getElementById('scene2-pt-neg1');
        var pt3 = document.getElementById('scene2-pt-3');
        var fillBlue = document.getElementById('scene2-fill-blue');
        var fillRed = document.getElementById('scene2-fill-red');
        var fillGreen = document.getElementById('scene2-fill-green');
        var derivBox = document.getElementById('scene2-derivation-box');
        var derivLine1 = document.getElementById('scene2-deriv-line1');
        var derivLine2 = document.getElementById('scene2-deriv-line2');
        var answerBox = document.getElementById('scene2-answer-box');
        var answerText = document.getElementById('scene2-answer-text');

        // Step data
        var stepData = [
            // Step 0: initial
            { derivation: ['', ''], marks: ['', '', '', '', ''], highlights: [], fills: [], answer: '' },
            // Step 1: ① 4ac < b²
            { derivation: ['Δ = b² - 4ac > 0（两个交点）', '⇒ b² > 4ac ⇒ 4ac < b² ✓'], marks: ['✓', '', '', '', ''], highlights: ['neg1', '3'], fills: [], answer: '' },
            // Step 2: ② 3a + c > 0
            { derivation: ['由 a - b + c = 0，b = -2a', '⇒ 3a + c = 0，故 3a + c > 0 不成立 ✗'], marks: ['✓', '✗', '', '', ''], highlights: [], fills: [], answer: '' },
            // Step 3: ③ 单调性
            { derivation: ['0 < x < 1 时 y 递增，x > 1 时 y 递减', '故结论③错误 ✗'], marks: ['✓', '✗', '✗', '', ''], highlights: [], fills: ['blue', 'red'], answer: '' },
            // Step 4: ④ y > 0 范围
            { derivation: ['y > 0 对应 -1 < x < 3', '结论④正确 ✓'], marks: ['✓', '✗', '✗', '✓', ''], highlights: [], fills: ['green'], answer: '' },
            // Step 5: ⑤ 方程的根
            { derivation: ['方程 ax²+bx+c=0 的根 = 抛物线与x轴交点横坐标', 'x₁=-1, x₂=3 ✓'], marks: ['✓', '✗', '✗', '✓', '✓'], highlights: ['neg1', '3'], fills: [], answer: '' },
            // Step 6: 总结
            { derivation: ['', ''], marks: ['✓', '✗', '✗', '✓', '✓'], highlights: [], fills: [], answer: '正确结论：①④⑤，共 3 个 → 答案 B' }
        ];

        function renderStep() {
            var data = stepData[currentStep];

            // Derivation box
            if (data.derivation[0] || data.derivation[1]) {
                derivLine1.textContent = data.derivation[0];
                derivLine2.textContent = data.derivation[1];
                derivBox.style.display = 'block';
                derivBox.style.opacity = '1';
            } else {
                derivBox.style.opacity = '0';
                derivBox.style.display = 'none';
            }

            // Answer box
            if (data.answer) {
                answerText.textContent = data.answer;
                answerBox.style.display = 'flex';
                answerBox.style.opacity = '1';
            } else {
                answerBox.style.opacity = '0';
                answerBox.style.display = 'none';
            }

            // Conclusion marks
            for (var i = 0; i < 5; i++) {
                var mark = document.getElementById('scene2-mark-' + (i + 1));
                if (data.marks[i]) {
                    mark.textContent = data.marks[i];
                    mark.style.color = data.marks[i] === '✓' ? '#2e7d32' : '#c62828';
                } else {
                    mark.textContent = '';
                }
            }

            // Point highlights
            var hlNeg1 = data.highlights.indexOf('neg1') >= 0;
            var hl3 = data.highlights.indexOf('3') >= 0;
            ptNeg1.setAttribute('r', hlNeg1 ? '6' : '4');
            ptNeg1.setAttribute('fill', hlNeg1 ? '#2e7d32' : '#000');
            pt3.setAttribute('r', hl3 ? '6' : '4');
            pt3.setAttribute('fill', hl3 ? '#2e7d32' : '#000');

            // Fill areas
            fillBlue.style.opacity = data.fills.indexOf('blue') >= 0 ? '0.15' : '0';
            fillRed.style.opacity = data.fills.indexOf('red') >= 0 ? '0.15' : '0';
            fillGreen.style.opacity = data.fills.indexOf('green') >= 0 ? '0.20' : '0';

            // Button states
            prevBtn.disabled = currentStep === 0;
            nextBtn.disabled = currentStep === totalSteps;
        }

        prevBtn.addEventListener('click', function() {
            if (currentStep > 0) { currentStep--; renderStep(); }
        });
        nextBtn.addEventListener('click', function() {
            if (currentStep < totalSteps) { currentStep++; renderStep(); }
        });

        renderStep();
    })();
    </script>
</body>
</html>
