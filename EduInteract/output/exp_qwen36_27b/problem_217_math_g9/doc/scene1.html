<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二次函数图像与结论验证</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-svg { width: 800px; height: 500px; display: block; }
        #scene1-controls {
            position: absolute;
            bottom: 12px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 16px;
            z-index: 10;
        }
        #scene1-controls button {
            padding: 6px 20px;
            font-size: 14px;
            border: 2px solid #1565c0;
            background: #ffffff;
            color: #1565c0;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
        }
        #scene1-controls button:disabled {
            border-color: #cccccc;
            color: #cccccc;
            cursor: not-allowed;
            background: #f5f5f5;
        }
        #scene1-controls button:hover:not(:disabled) {
            background: #e3f2fd;
        }
        .scene1-step-group {
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <defs>
                <marker id="scene1-arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#000000" />
                </marker>
            </defs>

            <!-- Axes -->
            <line id="scene1-axis-x" x1="120" y1="250" x2="420" y2="250" stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrow)" />
            <line id="scene1-axis-y" x1="220" y1="425" x2="220" y2="80" stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrow)" />

            <!-- Axis labels -->
            <text x="410" y="240" font-size="14" fill="#000000" font-style="italic">x</text>
            <text x="210" y="90" font-size="14" fill="#000000" font-style="italic">y</text>
            <text x="205" y="265" font-size="13" fill="#000000">O</text>

            <!-- Interval block (step 3, behind parabola) -->
            <path id="scene1-interval-block" d="" fill="#2e7d32" opacity="0" />

            <!-- Parabola -->
            <path id="scene1-parabola" d="" fill="none" stroke="#000000" stroke-width="2.5" />

            <!-- Step 1 elements -->
            <g id="scene1-step1-group" class="scene1-step-group" opacity="0">
                <circle id="scene1-point-a" cx="185" cy="250" r="4" fill="#000000" />
                <circle id="scene1-point-b" cx="325" cy="250" r="4" fill="#000000" />
                <circle id="scene1-point-c" cx="220" cy="355" r="4" fill="#000000" />
                <!-- A label with white bg -->
                <rect x="138" y="227" width="58" height="18" fill="#ffffff" rx="2" />
                <text id="scene1-label-a" x="140" y="241" font-size="13" fill="#000000">A(-1,0)</text>
                <!-- B label with white bg -->
                <rect x="338" y="227" width="48" height="18" fill="#ffffff" rx="2" />
                <text id="scene1-label-b" x="340" y="241" font-size="13" fill="#000000">B(3,0)</text>
                <!-- C label with white bg -->
                <rect x="232" y="375" width="52" height="18" fill="#ffffff" rx="2" />
                <text id="scene1-label-c" x="234" y="389" font-size="13" fill="#000000">C(0,-3)</text>
                <!-- AB=4 label with white bg, moved below x-axis -->
                <rect x="238" y="285" width="38" height="18" fill="#ffffff" rx="2" />
                <text id="scene1-label-ab" x="255" y="299" font-size="13" fill="#1565c0" text-anchor="middle">AB=4</text>
                <text id="scene1-conclusion-1" x="480" y="130" font-size="14" fill="#2e7d32">① AB=4 ✓</text>
            </g>

            <!-- Step 2 elements -->
            <g id="scene1-step2-group" class="scene1-step-group" opacity="0">
                <polygon id="scene1-triangle-obc" points="220,250 325,250 220,355" fill="#c62828" opacity="0.1" />
                <line id="scene1-line-bc" x1="325" y1="250" x2="220" y2="355" stroke="#c62828" stroke-width="2" />
                <!-- OB=3 with white bg -->
                <rect x="252" y="224" width="42" height="18" fill="#ffffff" rx="2" />
                <text id="scene1-label-ob" x="272" y="238" font-size="13" fill="#c62828" text-anchor="middle">OB=3</text>
                <!-- OC=3 with white bg -->
                <rect x="160" y="297" width="38" height="18" fill="#ffffff" rx="2" />
                <text id="scene1-label-oc" x="195" y="311" font-size="13" fill="#c62828" text-anchor="end">OC=3</text>
                <!-- ∠ABC=45° with white bg, moved further right -->
                <rect x="400" y="204" width="72" height="18" fill="#ffffff" rx="2" />
                <text id="scene1-label-angle" x="402" y="218" font-size="13" fill="#c62828">∠ABC=45°</text>
                <text id="scene1-conclusion-2" x="480" y="170" font-size="14" fill="#2e7d32">② ∠ABC=45° ✓</text>
            </g>

            <!-- Step 3 elements -->
            <g id="scene1-step3-group" class="scene1-step-group" opacity="0">
                <circle id="scene1-point-vertex" cx="255" cy="390" r="4" fill="#1565c0" />
                <!-- (1,-4) with white bg -->
                <rect x="270" y="394" width="42" height="18" fill="#ffffff" rx="2" />
                <text id="scene1-label-vertex" x="272" y="408" font-size="13" fill="#1565c0">(1,-4)</text>
                <!-- -4≤y<-3 with white bg, moved further left -->
                <rect x="115" y="324" width="62" height="18" fill="#ffffff" rx="2" />
                <text id="scene1-label-range" x="117" y="338" font-size="13" fill="#2e7d32">-4≤y&lt;-3</text>
                <!-- 0<x<2 with white bg, moved up and left away from arrow -->
                <rect x="225" y="360" width="42" height="18" fill="#ffffff" rx="2" />
                <text id="scene1-label-interval" x="245" y="374" font-size="13" fill="#2e7d32" text-anchor="middle">0&lt;x&lt;2</text>
                <text id="scene1-conclusion-3" x="480" y="210" font-size="14" fill="#2e7d32">③ -4≤y&lt;-3 ✓</text>
            </g>

            <!-- Step 4 elements -->
            <g id="scene1-step4-group" class="scene1-step-group" opacity="0">
                <line id="scene1-symmetry-axis" x1="255" y1="80" x2="255" y2="425" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5" />
                <text id="scene1-label-axis" x="255" y="75" font-size="13" fill="#888888" text-anchor="middle">x=1</text>
                <line x1="307" y1="290" x2="335" y2="220" stroke="#1565c0" stroke-width="2" />
                <polygon points="335,220 326,232 337,227" fill="#1565c0" />
                <text id="scene1-conclusion-4" x="480" y="250" font-size="14" fill="#2e7d32">④ x&gt;1递增 ✓</text>
            </g>

            <!-- Step 5 elements -->
            <g id="scene1-step5-group" class="scene1-step-group" opacity="0">
                <text id="scene1-answer" x="480" y="310" font-size="16" fill="#2e7d32" font-weight="bold">答案：D（4个）</text>
            </g>

            <!-- Step info text -->
            <text id="scene1-step-info" x="400" y="445" font-size="14" fill="#333333" text-anchor="middle">观察抛物线 y=x²-2x-3 的图像</text>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Layout coordinate table (from spec):
        // Origin O(220,250), Scale 35px/unit
        // A(-1,0)->(185,250), B(3,0)->(325,250), C(0,-3)->(220,355)
        // Vertex(1,-4)->(255,390)

        function generateParabolaPath() {
            var d = '';
            var first = true;
            for (var x = -2; x <= 4; x += 0.05) {
                var y = x * x - 2 * x - 3;
                var cx = 220 + x * 35;
                var cy = 250 - y * 35;
                if (first) {
                    d += 'M' + cx.toFixed(2) + ',' + cy.toFixed(2);
                    first = false;
                } else {
                    d += ' L' + cx.toFixed(2) + ',' + cy.toFixed(2);
                }
            }
            return d;
        }

        function generateIntervalPath() {
            var d = 'M220,355';
            for (var x = 0; x <= 2; x += 0.05) {
                var y = x * x - 2 * x - 3;
                var cx = 220 + x * 35;
                var cy = 250 - y * 35;
                d += ' L' + cx.toFixed(2) + ',' + cy.toFixed(2);
            }
            d += ' Z';
            return d;
        }

        document.getElementById('scene1-parabola').setAttribute('d', generateParabolaPath());
        document.getElementById('scene1-interval-block').setAttribute('d', generateIntervalPath());

        var currentStep = 0;
        var totalSteps = 5;

        var stepInfoTexts = [
            '观察抛物线 y=x²-2x-3 的图像',
            '结论①：A(-1,0)、B(3,0)，AB=4 ✓',
            '结论②：OB=OC=3，∠ABC=45° ✓',
            '结论③：顶点(1,-4)，-4≤y&lt;-3 ✓',
            '结论④：对称轴x=1，x>1时递增 ✓',
            '四个结论全部正确，答案选 D'
        ];

        function showStep(step) {
            currentStep = step;
            for (var i = 1; i <= totalSteps; i++) {
                var group = document.getElementById('scene1-step' + i + '-group');
                if (i <= step) {
                    group.setAttribute('opacity', '1');
                } else {
                    group.setAttribute('opacity', '0');
                }
            }
            var intervalBlock = document.getElementById('scene1-interval-block');
            if (step >= 3) {
                intervalBlock.setAttribute('opacity', '0.15');
            } else {
                intervalBlock.setAttribute('opacity', '0');
            }
            document.getElementById('scene1-step-info').textContent = stepInfoTexts[step];
            document.getElementById('scene1-btn-prev').disabled = (step === 0);
            document.getElementById('scene1-btn-next').disabled = (step === totalSteps);
        }

        document.getElementById('scene1-btn-prev').addEventListener('click', function() {
            if (currentStep > 0) showStep(currentStep - 1);
        });
        document.getElementById('scene1-btn-next').addEventListener('click', function() {
            if (currentStep < totalSteps) showStep(currentStep + 1);
        });

        showStep(0);
    })();
    </script>
</body>
</html>
