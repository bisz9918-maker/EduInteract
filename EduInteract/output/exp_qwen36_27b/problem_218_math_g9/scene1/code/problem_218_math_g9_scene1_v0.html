<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>直角三角板角度推导 - ∠CDF求解</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            margin: 0 auto;
            overflow: hidden;
            background: #ffffff;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
            display: block;
        }
        #scene1-controls {
            position: absolute;
            bottom: 12px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            z-index: 10;
        }
        #scene1-controls button {
            padding: 7px 18px;
            font-size: 14px;
            border: 1px solid #999;
            border-radius: 4px;
            cursor: pointer;
            background: #e0e0e0;
            color: #333;
            font-family: inherit;
            transition: background 0.2s, opacity 0.2s;
        }
        #scene1-controls button:hover:not(:disabled) {
            background: #d0d0d0;
        }
        #scene1-controls button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        #scene1-btn-next {
            background: #1565c0 !important;
            color: #fff !important;
            border-color: #1565c0 !important;
        }
        #scene1-btn-next:hover:not(:disabled) {
            background: #1976d2 !important;
        }
        #scene1-btn-next:disabled {
            background: #90caf9 !important;
            border-color: #90caf9 !important;
        }
        #scene1-step-indicator {
            font-size: 14px;
            color: #333;
            min-width: 90px;
            text-align: center;
            user-select: none;
        }

        .scene1-hidden {
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }
        .scene1-visible {
            opacity: 1;
            transition: opacity 0.4s ease;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <!-- ===== Base Geometry (always visible) ===== -->
            <g id="scene1-base">
                <!-- Line EF (horizontal baseline) -->
                <line x1="100" y1="380" x2="660" y2="380" stroke="#000" stroke-width="2" id="scene1-line-ef"/>

                <!-- Triangle ABC (isosceles right triangle, blue) -->
                <polygon points="420,140 180,220 500,380" fill="#1565c0" fill-opacity="0.12" stroke="#1565c0" stroke-width="2" id="scene1-tri-abc"/>

                <!-- Triangle DEF (30-60-90 triangle, green) -->
                <polygon points="455,245 100,380 660,380" fill="#2e7d32" fill-opacity="0.12" stroke="#2e7d32" stroke-width="2" id="scene1-tri-def"/>

                <!-- Vertex labels with white background circles to prevent overlap with fills -->
                <circle cx="420" cy="122" r="10" fill="#fff" stroke="none"/>
                <text x="420" y="125" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">A</text>

                <circle cx="162" cy="207" r="10" fill="#fff" stroke="none"/>
                <text x="162" y="210" text-anchor="end" font-size="16" font-weight="bold" fill="#000">B</text>

                <circle cx="500" cy="397" r="10" fill="#fff" stroke="none"/>
                <text x="500" y="400" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">C</text>

                <circle cx="482" cy="232" r="10" fill="#fff" stroke="none"/>
                <text x="482" y="235" text-anchor="start" font-size="16" font-weight="bold" fill="#000">D</text>

                <circle cx="82" cy="397" r="10" fill="#fff" stroke="none"/>
                <text x="82" y="400" text-anchor="end" font-size="16" font-weight="bold" fill="#000">E</text>

                <circle cx="678" cy="397" r="10" fill="#fff" stroke="none"/>
                <text x="678" y="400" text-anchor="start" font-size="16" font-weight="bold" fill="#000">F</text>
            </g>

            <!-- ===== Step 1: ∠ACB = 45° ===== -->
            <g id="scene1-step1" class="scene1-hidden">
                <!-- Right angle symbol at A -->
                <polyline points="405.77,144.74 410.51,158.97 424.74,154.23" fill="none" stroke="#000" stroke-width="1.5"/>

                <!-- Equal length mark on AB -->
                <line x1="303.16" y1="174.31" x2="291.78" y2="170.51" stroke="#000" stroke-width="1.5"/>

                <!-- Equal length mark on AC -->
                <line x1="450.51" y1="256.84" x2="454.31" y2="268.22" stroke="#000" stroke-width="1.5"/>

                <!-- ∠ACB arc (r=30, blue) -->
                <path d="M 490.51 351.54 A 30 30 0 0 0 473.17 366.58" fill="none" stroke="#1565c0" stroke-width="2"/>
                <!-- White background for label to prevent overlap with polygon fill -->
                <circle cx="550" cy="352" r="14" fill="#fff" stroke="none"/>
                <text x="550" y="355" font-size="14" fill="#1565c0">45°</text>

                <!-- Formula 1 -->
                <text x="590" y="180" font-size="14" fill="#000">∠ACB = 45°</text>
            </g>

            <!-- ===== Step 2: ∠ACE = 85° ===== -->
            <g id="scene1-step2" class="scene1-hidden">
                <!-- ∠BCE arc (r=35, blue - known condition) -->
                <path d="M 468.95 364.35 A 35 35 0 0 0 465 380" fill="none" stroke="#1565c0" stroke-width="2"/>
                <!-- White background for label -->
                <circle cx="445" cy="362" r="14" fill="#fff" stroke="none"/>
                <text x="445" y="365" font-size="14" fill="#1565c0">40°</text>

                <!-- ∠ACE arc (r=40, red - derived) -->
                <path d="M 487.35 342.05 A 40 40 0 0 0 460 380" fill="none" stroke="#c62828" stroke-width="2.5"/>
                <!-- White background for label -->
                <circle cx="428" cy="347" r="14" fill="#fff" stroke="none"/>
                <text x="428" y="350" font-size="14" fill="#c62828">85°</text>

                <!-- Formula 2 -->
                <text x="590" y="230" font-size="14" fill="#000">∠ACE = 45°+40° = 85°</text>
            </g>

            <!-- ===== Step 3: ∠ACF = 95° ===== -->
            <g id="scene1-step3" class="scene1-hidden">
                <!-- ∠ACF arc (r=45, red - derived) -->
                <path d="M 485.77 337.31 A 45 45 0 0 1 545 380" fill="none" stroke="#c62828" stroke-width="2.5"/>
                <!-- White background for label - moved further right to avoid 45° overlap -->
                <circle cx="570" cy="340" r="14" fill="#fff" stroke="none"/>
                <text x="570" y="343" font-size="14" fill="#c62828">95°</text>

                <!-- Formula 3 -->
                <text x="590" y="280" font-size="14" fill="#000">∠ACF = 180°−85° = 95°</text>
            </g>

            <!-- ===== Step 4: ∠F = 60° ===== -->
            <g id="scene1-step4" class="scene1-hidden">
                <!-- Right angle symbol at D -->
                <polyline points="441.00,250.32 453.54,258.58 467.54,253.26" fill="none" stroke="#000" stroke-width="1.5"/>

                <!-- ∠E arc (r=30, blue - known condition) -->
                <path d="M 130 380 A 30 30 0 0 0 128.00 369.35" fill="none" stroke="#1565c0" stroke-width="2"/>
                <!-- White background for label -->
                <circle cx="125" cy="357" r="14" fill="#fff" stroke="none"/>
                <text x="125" y="360" font-size="14" fill="#1565c0">30°</text>

                <!-- ∠F arc (r=30, red - derived) -->
                <path d="M 630 380 A 30 30 0 0 1 634.93 363.49" fill="none" stroke="#c62828" stroke-width="2.5"/>
                <!-- White background for label -->
                <circle cx="648" cy="357" r="14" fill="#fff" stroke="none"/>
                <text x="648" y="360" font-size="14" fill="#c62828">60°</text>

                <!-- Formula 4 - moved left to avoid clipping -->
                <text x="590" y="330" font-size="14" fill="#000">∠F = 180°−90°−30° = 60°</text>
            </g>

            <!-- ===== Step 5: ∠CDF = 25° (Conclusion) ===== -->
            <g id="scene1-step5" class="scene1-hidden">
                <!-- △CDF highlight (red outline) -->
                <polygon points="455,245 500,380 660,380" fill="none" stroke="#c62828" stroke-width="3"/>

                <!-- ∠CDF arc (r=30, red, thick) -->
                <path d="M 464.49 273.46 A 30 30 0 0 0 479.07 261.51" fill="none" stroke="#c62828" stroke-width="3"/>
                <!-- White background for label - moved away from D -->
                <circle cx="500" cy="257" r="14" fill="#fff" stroke="none"/>
                <text x="500" y="260" font-size="14" fill="#c62828" font-weight="bold">25°</text>

                <!-- Conclusion text with white background rect -->
                <rect x="240" y="428" width="320" height="24" rx="4" fill="#fff" stroke="#c62828" stroke-width="1.5"/>
                <text x="400" y="446" text-anchor="middle" font-size="17" font-weight="bold" fill="#c62828">∠CDF = 180°−95°−60° = 25°</text>
            </g>
        </svg>

        <!-- Controls -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 0/5</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        'use strict';

        var currentStep = 0;
        var totalSteps = 5;

        var btnPrev = document.getElementById('scene1-btn-prev');
        var btnNext = document.getElementById('scene1-btn-next');
        var stepIndicator = document.getElementById('scene1-step-indicator');
        var triAbc = document.getElementById('scene1-tri-abc');
        var triDef = document.getElementById('scene1-tri-def');
        var lineEf = document.getElementById('scene1-line-ef');

        function renderStep(step) {
            // Update step indicator
            stepIndicator.textContent = '步骤 ' + step + '/' + totalSteps;

            // Update button states
            btnPrev.disabled = (step === 0);
            btnNext.disabled = (step === totalSteps);

            // Show/hide step elements
            for (var i = 1; i <= totalSteps; i++) {
                var el = document.getElementById('scene1-step' + i);
                if (i <= step) {
                    el.classList.add('scene1-visible');
                    el.classList.remove('scene1-hidden');
                } else {
                    el.classList.add('scene1-hidden');
                    el.classList.remove('scene1-visible');
                }
            }

            // Update highlight effects based on current step
            if (step >= 1) {
                triAbc.setAttribute('stroke-width', '3');
            } else {
                triAbc.setAttribute('stroke-width', '2');
            }

            if (step >= 3) {
                lineEf.setAttribute('stroke-width', '3');
            } else {
                lineEf.setAttribute('stroke-width', '2');
            }

            if (step >= 4) {
                triDef.setAttribute('stroke-width', '3');
            } else {
                triDef.setAttribute('stroke-width', '2');
            }
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep(currentStep);
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                renderStep(currentStep);
            }
        });

        // Initial render
        renderStep(0);

    })();
    </script>
</body>
</html>
