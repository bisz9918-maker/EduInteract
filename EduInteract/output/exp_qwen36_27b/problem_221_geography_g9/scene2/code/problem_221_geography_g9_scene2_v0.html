<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>农历十五圆月升起时间推算</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-svg { width: 800px; height: 500px; display: block; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene2-controls button {
            padding: 6px 18px; font-size: 14px; cursor: pointer;
            border: 1px solid #999; border-radius: 4px; background: #f5f5f5; color: #333;
            transition: background 0.2s, color 0.2s;
        }
        #scene2-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene2-controls button:disabled { background: #e8e8e8; color: #bbb; cursor: default; border-color: #ccc; }

        /* Step-based visibility with transitions */
        .step1-element { opacity: 0; transition: opacity 0.5s ease-in-out; pointer-events: none; }
        .step1-element.visible { opacity: 1; pointer-events: auto; }
        .step2-element { opacity: 0; transition: opacity 0.5s ease-in-out; pointer-events: none; }
        .step2-element.visible { opacity: 1; pointer-events: auto; }

        /* Moon rise animation */
        #scene2-moon-rise-circle {
            transition: transform 0.6s ease-out, opacity 0.5s ease-in-out;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Arrowhead marker for light rays -->
                <marker id="scene2-arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
                    <polygon points="0 0, 8 3, 0 6" fill="#555" />
                </marker>
                <!-- Arrowhead for orange arrows -->
                <marker id="scene2-arrowhead-orange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
                    <polygon points="0 0, 8 3, 0 6" fill="#e65100" />
                </marker>
                <!-- Sun glow -->
                <radialGradient id="scene2-sun-glow" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#ffeb3b" />
                    <stop offset="60%" stop-color="#c62828" />
                    <stop offset="100%" stop-color="#b71c1c" />
                </radialGradient>
                <!-- Earth gradient -->
                <radialGradient id="scene2-earth-grad" cx="40%" cy="40%" r="60%">
                    <stop offset="0%" stop-color="#42a5f5" />
                    <stop offset="100%" stop-color="#1565c0" />
                </radialGradient>
                <!-- Moon gradient -->
                <radialGradient id="scene2-moon-grad" cx="30%" cy="30%" r="70%">
                    <stop offset="0%" stop-color="#ffffff" />
                    <stop offset="100%" stop-color="#e0e0e0" />
                </radialGradient>
                <!-- Full moon glow -->
                <radialGradient id="scene2-fullmoon-glow" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#fffde7" />
                    <stop offset="70%" stop-color="#fff9c4" />
                    <stop offset="100%" stop-color="#f0f0f0" />
                </radialGradient>
            </defs>

            <!-- ===== STEP 0: Sun-Earth-Moon alignment (always visible) ===== -->

            <!-- Light rays from Sun -->
            <g id="scene2-light-rays">
                <!-- Sun to Earth ray -->
                <line x1="148" y1="218" x2="238" y2="218" stroke="#555" stroke-width="1" stroke-dasharray="5,5" marker-end="url(#scene2-arrowhead)" />
                <!-- Sun to Moon ray -->
                <line x1="148" y1="222" x2="363" y2="222" stroke="#555" stroke-width="1" stroke-dasharray="5,5" marker-end="url(#scene2-arrowhead)" />
            </g>

            <!-- Sun -->
            <circle id="scene2-sun" cx="120" cy="220" r="28" fill="url(#scene2-sun-glow)" stroke="#b71c1c" stroke-width="1.5" />
            <!-- Sun rays decoration -->
            <g stroke="#ff9800" stroke-width="1.5" opacity="0.6">
                <line x1="120" y1="182" x2="120" y2="172" />
                <line x1="120" y1="258" x2="120" y2="268" />
                <line x1="82" y1="220" x2="72" y2="220" />
                <line x1="158" y1="220" x2="168" y2="220" />
                <line x1="93" y1="193" x2="86" y2="186" />
                <line x1="147" y1="193" x2="154" y2="186" />
                <line x1="93" y1="247" x2="86" y2="254" />
                <line x1="147" y1="247" x2="154" y2="254" />
            </g>

            <!-- Earth (main diagram) -->
            <circle id="scene2-earth-main" cx="260" cy="220" r="20" fill="url(#scene2-earth-grad)" stroke="#0d47a1" stroke-width="1" />
            <!-- Earth terminator (night side) -->
            <path d="M 260 200 A 20 20 0 0 1 260 240" fill="none" stroke="#0d47a1" stroke-width="0.5" />
            <path d="M 260 200 A 20 20 0 0 0 260 240 Z" fill="#0d47a1" opacity="0.3" />

            <!-- Moon (main diagram) -->
            <circle id="scene2-moon-main" cx="380" cy="220" r="15" fill="url(#scene2-moon-grad)" stroke="#bdbdbd" stroke-width="1" />

            <!-- Labels for Sun, Earth, Moon -->
            <text x="120" y="265" text-anchor="middle" font-size="12" fill="#333">太阳</text>
            <text x="260" y="258" text-anchor="middle" font-size="12" fill="#333">地球</text>
            <text x="380" y="252" text-anchor="middle" font-size="12" fill="#333">月球</text>

            <!-- Top label: 农历十五：满月 -->
            <text id="scene2-label-fullmoon" x="250" y="145" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">农历十五：满月</text>

            <!-- Bottom label: 日-地-月一线 -->
            <text id="scene2-label-alignment" x="250" y="290" text-anchor="middle" font-size="12" fill="#666">日-地-月一线</text>

            <!-- ===== STEP 1: Earth side view + moon rising (visible when step >= 1) ===== -->

            <!-- Earth side view group -->
            <g id="scene2-earth-side" class="step1-element">
                <!-- Earth circle -->
                <circle cx="590" cy="220" r="50" fill="url(#scene2-earth-grad)" stroke="#0d47a1" stroke-width="1.5" />
                <!-- Equator line -->
                <line x1="540" y1="220" x2="640" y2="220" stroke="#90caf9" stroke-width="0.8" stroke-dasharray="3,3" />
                <!-- Longitude arcs -->
                <path d="M 590 170 Q 575 220 590 270" fill="none" stroke="#90caf9" stroke-width="0.8" stroke-dasharray="3,3" />
                <path d="M 590 170 Q 605 220 590 270" fill="none" stroke="#90caf9" stroke-width="0.8" stroke-dasharray="3,3" />
                <!-- Night side shading -->
                <path d="M 590 170 A 50 50 0 0 0 590 270 Z" fill="#0d47a1" opacity="0.2" />
                <!-- 31°N latitude line -->
                <line x1="545" y1="188" x2="635" y2="188" stroke="#90caf9" stroke-width="0.5" stroke-dasharray="2,2" />
            </g>

            <!-- Shanghai marker -->
            <circle id="scene2-shanghai-dot" cx="615" cy="188" r="3" fill="#c62828" class="step1-element" />
            <text id="scene2-label-shanghai" x="655" y="183" font-size="12" fill="#333" class="step1-element">上海(31°N,121°E)</text>

            <!-- Horizon line -->
            <line id="scene2-horizon" x1="510" y1="275" x2="690" y2="275" stroke="#333" stroke-width="1.5" class="step1-element" />
            <text id="scene2-label-horizon" x="695" y="270" font-size="12" fill="#333" class="step1-element">东方地平线</text>

            <!-- Moon rising indicator -->
            <g id="scene2-moon-rise" class="step1-element">
                <circle id="scene2-moon-rise-circle" cx="670" cy="255" r="10" fill="url(#scene2-fullmoon-glow)" stroke="#bdbdbd" stroke-width="1" />
            </g>

            <!-- Rising arrow -->
            <line id="scene2-rise-arrow" x1="670" y1="275" x2="670" y2="267" stroke="#e65100" stroke-width="2" marker-end="url(#scene2-arrowhead-orange)" class="step1-element" />

            <!-- Label: 圆月：日落时升起 (y=310) -->
            <text id="scene2-label-rise-rule" x="590" y="310" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" class="step1-element">圆月：日落时升起</text>

            <!-- Label: 当前地方时 (y=348, increased from 340 for 12px+ gap) -->
            <text id="scene2-label-current-time" x="590" y="348" text-anchor="middle" font-size="14" fill="#2e7d32" class="step1-element">当前地方时：约16:34</text>

            <!-- ===== STEP 2: Time calculation (visible when step >= 2) ===== -->

            <!-- Label: 日落时间 (y=386, increased from 370 for 12px+ gap) -->
            <text id="scene2-label-sunset" x="590" y="386" text-anchor="middle" font-size="14" fill="#2e7d32" class="step2-element">日落时间：约17:15</text>

            <!-- Wait time arrow (y=410, adjusted) -->
            <line id="scene2-wait-arrow" x1="540" y1="410" x2="640" y2="410" stroke="#e65100" stroke-width="2" marker-end="url(#scene2-arrowhead-orange)" class="step2-element" />

            <!-- Label: 等待时间 (y=435, adjusted) -->
            <text id="scene2-label-wait" x="590" y="435" text-anchor="middle" font-size="14" fill="#e65100" font-weight="bold" class="step2-element">等待时间：约1小时</text>
        </svg>

        <!-- Controls -->
        <div id="scene2-controls">
            <button id="scene2-btn-prev" disabled>◀ 上一步</button>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() { 'use strict';

        var currentStep = 0;
        var totalSteps = 2;

        // DOM references
        var btnPrev = document.getElementById('scene2-btn-prev');
        var btnNext = document.getElementById('scene2-btn-next');

        // Step 1 elements
        var step1Elements = document.querySelectorAll('.step1-element');
        // Step 2 elements
        var step2Elements = document.querySelectorAll('.step2-element');

        function updateStep() {
            // Update step 1 elements
            step1Elements.forEach(function(el) {
                if (currentStep >= 1) {
                    el.classList.add('visible');
                } else {
                    el.classList.remove('visible');
                }
            });

            // Update step 2 elements
            step2Elements.forEach(function(el) {
                if (currentStep >= 2) {
                    el.classList.add('visible');
                } else {
                    el.classList.remove('visible');
                }
            });

            // Update button states
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps);
        }

        function goToStep(step) {
            if (step < 0 || step > totalSteps) return;
            currentStep = step;
            updateStep();
        }

        // Event listeners
        btnPrev.addEventListener('click', function() {
            goToStep(currentStep - 1);
        });

        btnNext.addEventListener('click', function() {
            goToStep(currentStep + 1);
        });

        // Initialize
        updateStep();

    })();
    </script>
</body>
</html>
