<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>等效平衡 - 三个容器初始状态对比</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-svg { width: 800px; height: 500px; display: block; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            padding: 8px 24px; font-size: 15px; border: none; border-radius: 6px;
            cursor: pointer; background: #1565c0; color: #fff; transition: background 0.2s;
        }
        #scene1-controls button:hover:not(:disabled) { background: #0d47a1; }
        #scene1-controls button:disabled { background: #bdbdbd; cursor: default; }

        /* 淡入动画 */
        .fade-element { opacity: 0; transition: opacity 300ms ease-in-out; }
        .fade-element.visible { opacity: 1; }

        /* 容器高亮 - 对线段和椭圆生效 */
        .container-highlight line,
        .container-highlight ellipse { stroke: #1565c0 !important; stroke-width: 3 !important; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- ===== 甲容器（4条线段组成方框） ===== -->
            <g id="scene1-container-jia" stroke="#000000" stroke-width="2" fill="none">
                <line x1="90" y1="140" x2="230" y2="140" />
                <line x1="90" y1="260" x2="230" y2="260" />
                <line x1="90" y1="140" x2="90" y2="260" />
                <line x1="230" y1="140" x2="230" y2="260" />
            </g>
            <!-- 甲容器标签 -->
            <text id="scene1-label-jia" x="160" y="290" text-anchor="middle" font-size="18" fill="#000000" font-weight="bold">甲</text>
            <!-- 甲容器内物质（步骤1显示） -->
            <g id="scene1-substance-jia" class="fade-element">
                <text x="160" y="180" text-anchor="middle" font-size="16" fill="#000000">0.2 mol</text>
                <text x="160" y="220" text-anchor="middle" font-size="16" fill="#000000">NO<tspan baseline-shift="sub" font-size="12">2</tspan></text>
            </g>
            <!-- 甲条件标注（步骤2显示） -->
            <text id="scene1-condition-jia" x="160" y="120" text-anchor="middle" font-size="16" fill="#2e7d32" font-weight="bold" class="fade-element">恒容</text>

            <!-- ===== 乙容器（3条线段+顶部椭圆+活塞） ===== -->
            <g id="scene1-container-yi" stroke="#000000" stroke-width="2" fill="none">
                <line x1="330" y1="140" x2="330" y2="260" />
                <line x1="330" y1="260" x2="470" y2="260" />
                <line x1="470" y1="140" x2="470" y2="260" />
                <ellipse id="scene1-container-yi-top" cx="400" cy="140" rx="70" ry="12" />
            </g>
            <!-- 乙活塞 -->
            <rect id="scene1-piston-yi" x="335" y="125" width="130" height="15" rx="2" ry="2"
                  fill="#888888" stroke="#555555" stroke-width="2" />
            <line x1="350" y1="132" x2="450" y2="132" stroke="#666666" stroke-width="1" />
            <!-- 乙容器标签 -->
            <text id="scene1-label-yi" x="400" y="290" text-anchor="middle" font-size="18" fill="#000000" font-weight="bold">乙</text>
            <!-- 乙容器内物质（步骤1显示） -->
            <g id="scene1-substance-yi" class="fade-element">
                <text x="400" y="180" text-anchor="middle" font-size="16" fill="#000000">0.2 mol</text>
                <text x="400" y="220" text-anchor="middle" font-size="16" fill="#000000">NO<tspan baseline-shift="sub" font-size="12">2</tspan></text>
            </g>
            <!-- 乙条件标注（步骤2显示） -->
            <text id="scene1-condition-yi" x="400" y="110" text-anchor="middle" font-size="16" fill="#c62828" font-weight="bold" class="fade-element">恒压</text>

            <!-- ===== 丙容器（4条线段组成方框） ===== -->
            <g id="scene1-container-bing" stroke="#000000" stroke-width="2" fill="none">
                <line x1="570" y1="140" x2="710" y2="140" />
                <line x1="570" y1="260" x2="710" y2="260" />
                <line x1="570" y1="140" x2="570" y2="260" />
                <line x1="710" y1="140" x2="710" y2="260" />
            </g>
            <!-- 丙容器标签 -->
            <text id="scene1-label-bing" x="640" y="290" text-anchor="middle" font-size="18" fill="#000000" font-weight="bold">丙</text>
            <!-- 丙容器内物质（步骤1显示） -->
            <g id="scene1-substance-bing" class="fade-element">
                <text x="640" y="180" text-anchor="middle" font-size="16" fill="#000000">0.1 mol</text>
                <text x="640" y="220" text-anchor="middle" font-size="16" fill="#000000">N<tspan baseline-shift="sub" font-size="12">2</tspan>O<tspan baseline-shift="sub" font-size="12">4</tspan></text>
            </g>
            <!-- 丙条件标注（步骤2显示） -->
            <text id="scene1-condition-bing" x="640" y="120" text-anchor="middle" font-size="16" fill="#2e7d32" font-weight="bold" class="fade-element">恒容</text>

            <!-- ===== 反应方程式（步骤3显示） ===== -->
            <g id="scene1-equation-group" class="fade-element">
                <text id="scene1-equation" x="400" y="365" text-anchor="middle" font-size="20" fill="#1565c0" font-weight="bold">
                    2NO<tspan baseline-shift="sub" font-size="15">2</tspan>(g) ⇌ N<tspan baseline-shift="sub" font-size="15">2</tspan>O<tspan baseline-shift="sub" font-size="15">4</tspan>(g)
                </text>
                <text id="scene1-hint" x="400" y="415" text-anchor="middle" font-size="16" fill="#1565c0">气体分子数减少</text>
            </g>
        </svg>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        'use strict';

        var currentStep = 0;
        var maxStep = 3;

        // DOM 元素引用
        var btnPrev = document.getElementById('scene1-btn-prev');
        var btnNext = document.getElementById('scene1-btn-next');
        var containerJia = document.getElementById('scene1-container-jia');
        var containerYi = document.getElementById('scene1-container-yi');
        var containerBing = document.getElementById('scene1-container-bing');
        var substanceJia = document.getElementById('scene1-substance-jia');
        var substanceYi = document.getElementById('scene1-substance-yi');
        var substanceBing = document.getElementById('scene1-substance-bing');
        var conditionJia = document.getElementById('scene1-condition-jia');
        var conditionYi = document.getElementById('scene1-condition-yi');
        var conditionBing = document.getElementById('scene1-condition-bing');
        var equationGroup = document.getElementById('scene1-equation-group');

        // 工具函数：显示/隐藏元素
        function showElement(el) {
            el.classList.add('visible');
            el.style.display = '';
            el.style.opacity = '';
        }
        function hideElement(el) {
            el.classList.remove('visible');
        }

        // 渲染当前步骤
        function renderStep(step) {
            // 容器高亮控制（仅步骤1高亮）
            if (step >= 1) {
                containerJia.classList.add('container-highlight');
                containerYi.classList.add('container-highlight');
                containerBing.classList.add('container-highlight');
            } else {
                containerJia.classList.remove('container-highlight');
                containerYi.classList.remove('container-highlight');
                containerBing.classList.remove('container-highlight');
            }

            // 步骤1+：显示物质
            if (step >= 1) {
                showElement(substanceJia);
                showElement(substanceYi);
                showElement(substanceBing);
            } else {
                hideElement(substanceJia);
                hideElement(substanceYi);
                hideElement(substanceBing);
            }

            // 步骤2+：显示条件标注
            if (step >= 2) {
                showElement(conditionJia);
                showElement(conditionYi);
                showElement(conditionBing);
            } else {
                hideElement(conditionJia);
                hideElement(conditionYi);
                hideElement(conditionBing);
            }

            // 步骤3：显示反应方程式
            if (step >= 3) {
                showElement(equationGroup);
            } else {
                hideElement(equationGroup);
            }

            // 按钮状态
            btnPrev.disabled = (step === 0);
            btnNext.disabled = (step === maxStep);
        }

        // 事件绑定
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep(currentStep);
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < maxStep) {
                currentStep++;
                renderStep(currentStep);
            }
        });

        // 初始渲染
        renderStep(0);

    })();
    </script>
</body>
</html>
