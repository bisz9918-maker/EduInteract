<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三棱柱外接球</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }

        /* Step visibility: hidden by default, shown via .visible class */
        .step-element { opacity: 0; transition: opacity 0.4s ease-in; pointer-events: none; }
        .step-element.visible { opacity: 1; pointer-events: auto; }

        button { padding: 6px 16px; font-size: 14px; cursor: pointer; border: 1px solid #333; border-radius: 4px; background: #f5f5f5; font-family: inherit; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        button:hover:not(:disabled) { background: #e0e0e0; }

        #scene1-step-indicator { font-size: 14px; color: #333; min-width: 80px; text-align: center; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- ===== Step 5: Sphere (drawn first = behind everything) ===== -->
            <g id="scene1-step5" class="step-element">
                <ellipse cx="415" cy="255" rx="163" ry="130" fill="rgba(21,101,192,0.15)" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="6,4"/>
            </g>

            <!-- ===== Step 0: Prism edges (always visible) ===== -->
            <g id="scene1-prism">
                <!-- Visible edges: solid black, 2px -->
                <!-- A₁B₁ -->
                <line x1="400" y1="380" x2="520" y2="380" stroke="#000" stroke-width="2" stroke-linecap="round"/>
                <!-- B₁C₁ -->
                <line x1="400" y1="380" x2="310" y2="290" stroke="#000" stroke-width="2" stroke-linecap="round"/>
                <!-- AB -->
                <line x1="400" y1="220" x2="520" y2="220" stroke="#000" stroke-width="2" stroke-linecap="round"/>
                <!-- BC -->
                <line x1="400" y1="220" x2="310" y2="130" stroke="#000" stroke-width="2" stroke-linecap="round"/>
                <!-- AA₁ -->
                <line x1="520" y1="220" x2="520" y2="380" stroke="#000" stroke-width="2" stroke-linecap="round"/>
                <!-- BB₁ -->
                <line x1="400" y1="220" x2="400" y2="380" stroke="#000" stroke-width="2" stroke-linecap="round"/>

                <!-- Hidden edges: dashed gray, 1.5px -->
                <!-- A₁C₁ -->
                <line x1="520" y1="380" x2="310" y2="290" stroke="#888" stroke-width="1.5" stroke-dasharray="6,4" stroke-linecap="round"/>
                <!-- AC -->
                <line x1="520" y1="220" x2="310" y2="130" stroke="#888" stroke-width="1.5" stroke-dasharray="6,4" stroke-linecap="round"/>
                <!-- CC₁ -->
                <line x1="310" y1="130" x2="310" y2="290" stroke="#888" stroke-width="1.5" stroke-dasharray="6,4" stroke-linecap="round"/>
            </g>

            <!-- ===== Step 0: Vertex dots ===== -->
            <g id="scene1-vertex-dots">
                <circle cx="400" cy="380" r="3" fill="#000"/>
                <circle cx="520" cy="380" r="3" fill="#000"/>
                <circle cx="310" cy="290" r="3" fill="#000"/>
                <circle cx="400" cy="220" r="3" fill="#000"/>
                <circle cx="520" cy="220" r="3" fill="#000"/>
                <circle cx="310" cy="130" r="3" fill="#000"/>
            </g>

            <!-- ===== Step 0: Vertex labels ===== -->
            <g id="scene1-vertex-labels">
                <text x="535" y="395" font-size="14" font-weight="bold" text-anchor="start">A<tspan baseline-shift="sub" font-size="10">1</tspan></text>
                <text x="400" y="400" font-size="14" font-weight="bold" text-anchor="middle">B<tspan baseline-shift="sub" font-size="10">1</tspan></text>
                <text x="290" y="285" font-size="14" font-weight="bold" text-anchor="end">C<tspan baseline-shift="sub" font-size="10">1</tspan></text>
                <text x="535" y="215" font-size="14" font-weight="bold" text-anchor="start">A</text>
                <text x="400" y="205" font-size="14" font-weight="bold" text-anchor="middle">B</text>
                <text x="290" y="125" font-size="14" font-weight="bold" text-anchor="end">C</text>
            </g>

            <!-- ===== Step 1: Known conditions ===== -->
            <g id="scene1-step1" class="step-element">
                <!-- Right angle symbol at B₁ (15×15 square corner) -->
                <polyline points="415,380 415,365 400,365" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="miter"/>

                <!-- Length labels -->
                <text x="460" y="395" font-size="14" font-weight="bold" text-anchor="middle">6</text>
                <text x="420" y="335" font-size="14" font-weight="bold" text-anchor="middle">2√34</text>
                <text x="540" y="300" font-size="14" font-weight="bold" text-anchor="start">8</text>

                <!-- Perpendicular label -->
                <text x="550" y="330" font-size="12" text-anchor="start">
                    AA<tspan baseline-shift="sub" font-size="8">1</tspan>⊥平面A<tspan baseline-shift="sub" font-size="8">1</tspan>B<tspan baseline-shift="sub" font-size="8">1</tspan>C<tspan baseline-shift="sub" font-size="8">1</tspan>
                </text>
            </g>

            <!-- ===== Step 2: Base circumcircle ===== -->
            <g id="scene1-step2" class="step-element">
                <!-- Highlighted base edges (blue, thicker) -->
                <line x1="400" y1="380" x2="520" y2="380" stroke="#1565c0" stroke-width="2.5" stroke-linecap="round"/>
                <line x1="400" y1="380" x2="310" y2="290" stroke="#1565c0" stroke-width="2.5" stroke-linecap="round"/>
                <line x1="520" y1="380" x2="310" y2="290" stroke="#1565c0" stroke-width="2" stroke-dasharray="6,4" stroke-linecap="round"/>

                <!-- Base circumcircle (blue dashed ellipse) -->
                <ellipse cx="415" cy="335" rx="117" ry="58" fill="none" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="6,4"/>

                <!-- Base center M₁ (green dot) -->
                <circle cx="415" cy="335" r="4" fill="#2e7d32"/>
                <text x="430" y="355" font-size="14" font-weight="bold" text-anchor="start" fill="#2e7d32">M<tspan baseline-shift="sub" font-size="10">1</tspan></text>
                <text x="450" y="365" font-size="13" text-anchor="start" fill="#2e7d32">r=√34</text>
            </g>

            <!-- ===== Step 3: Top circumcircle ===== -->
            <g id="scene1-step3" class="step-element">
                <!-- Highlighted top edges (blue, thicker) -->
                <line x1="400" y1="220" x2="520" y2="220" stroke="#1565c0" stroke-width="2.5" stroke-linecap="round"/>
                <line x1="400" y1="220" x2="310" y2="130" stroke="#1565c0" stroke-width="2.5" stroke-linecap="round"/>
                <line x1="520" y1="220" x2="310" y2="130" stroke="#1565c0" stroke-width="2" stroke-dasharray="6,4" stroke-linecap="round"/>

                <!-- Top circumcircle (blue dashed ellipse) -->
                <ellipse cx="415" cy="175" rx="117" ry="58" fill="none" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="6,4"/>

                <!-- Top center M (green dot) -->
                <circle cx="415" cy="175" r="4" fill="#2e7d32"/>
                <text x="430" y="160" font-size="14" font-weight="bold" text-anchor="start" fill="#2e7d32">M</text>
            </g>

            <!-- ===== Step 4: Sphere center and radius ===== -->
            <g id="scene1-step4" class="step-element">
                <!-- Line MM₁ (gray dashed) -->
                <line x1="415" y1="175" x2="415" y2="335" stroke="#888" stroke-width="1.5" stroke-dasharray="6,4"/>

                <!-- Sphere center O (red dot) -->
                <circle cx="415" cy="255" r="5" fill="#c62828"/>
                <text x="430" y="255" font-size="14" font-weight="bold" text-anchor="start" fill="#c62828">O</text>

                <!-- Radius OA₁ (red dashed) -->
                <line x1="415" y1="255" x2="520" y2="380" stroke="#c62828" stroke-width="2" stroke-dasharray="6,4"/>
                <text x="475" y="315" font-size="14" font-weight="bold" text-anchor="start" fill="#c62828">R</text>
            </g>
        </svg>

        <!-- Controls bar at bottom -->
        <div id="scene1-controls">
            <button id="scene1-prev-btn" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 0/5</span>
            <button id="scene1-next-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() { 'use strict';
        var currentStep = 0;

        var prevBtn = document.getElementById('scene1-prev-btn');
        var nextBtn = document.getElementById('scene1-next-btn');
        var stepIndicator = document.getElementById('scene1-step-indicator');

        function updateStep() {
            // Update button states
            prevBtn.disabled = (currentStep === 0);
            nextBtn.disabled = (currentStep === 5);
            stepIndicator.textContent = '步骤 ' + currentStep + '/5';

            // Show/hide step elements based on current step
            for (var i = 1; i <= 5; i++) {
                var el = document.getElementById('scene1-step' + i);
                if (el) {
                    if (currentStep >= i) {
                        el.classList.add('visible');
                        el.style.display = '';
                        el.style.opacity = '';
                    } else {
                        el.classList.remove('visible');
                    }
                }
            }
        }

        prevBtn.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });

        nextBtn.addEventListener('click', function() {
            if (currentStep < 5) {
                currentStep++;
                updateStep();
            }
        });

        // Initialize
        updateStep();
    })();
    </script>
</body>
</html>
