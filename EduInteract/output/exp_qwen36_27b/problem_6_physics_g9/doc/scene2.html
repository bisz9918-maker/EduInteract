<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 铁球受力分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-svg { width: 800px; height: 500px; display: block; }
        .scene2-transition { transition: all 0.6s ease-in-out; }
        #scene2-controls {
            position: absolute;
            bottom: 10px;
            left: 0; right: 0;
            display: flex;
            justify-content: center;
            gap: 12px;
            z-index: 10;
        }
        #scene2-controls button {
            padding: 8px 24px;
            font-size: 15px;
            border: 2px solid #1565c0;
            border-radius: 4px;
            cursor: pointer;
            background: #e3f2fd;
            color: #1565c0;
            font-weight: bold;
            transition: all 0.2s;
        }
        #scene2-controls button:hover { background: #bbdefb; }
        #scene2-controls button.active { background: #1565c0; color: #ffffff; }
        .scene2-compare { opacity: 0; transition: opacity 0.6s ease-in-out; }
        .scene2-compare.visible { opacity: 1; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500">
            <defs>
                <marker id="scene2-arrowhead-gray" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
                    <path d="M0,0 L12,4 L0,8 Z" fill="#888888"/>
                </marker>
                <marker id="scene2-arrowhead-red" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
                    <path d="M0,0 L12,4 L0,8 Z" fill="#c62828"/>
                </marker>
                <marker id="scene2-arrowhead-green" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
                    <path d="M0,0 L12,4 L0,8 Z" fill="#2e7d32"/>
                </marker>
            </defs>

            <!-- State Title -->
            <text id="scene2-title" x="400" y="48" text-anchor="middle" font-size="20" font-weight="bold" fill="#1565c0">
                状态1（滑片初始位置）
            </text>

            <!-- Iron Ball -->
            <circle id="scene2-ball" cx="250" cy="220" r="45" fill="#000000" stroke="#000000" stroke-width="2"/>
            <text x="250" y="285" text-anchor="middle" font-size="14" fill="#333333" font-weight="bold">铁球</text>

            <!-- Gravity Arrow (G) - Fixed -->
            <line id="scene2-arrow-g" x1="200" y1="265" x2="200" y2="335" stroke="#888888" stroke-width="3" marker-end="url(#scene2-arrowhead-gray)"/>
            <text id="scene2-label-g" x="200" y="358" text-anchor="middle" font-size="16" fill="#888888" font-weight="bold">G</text>

            <!-- Attraction Arrow (F_abs) - Changes -->
            <line id="scene2-arrow-f-abs" class="scene2-transition" x1="250" y1="265" x2="250" y2="355" stroke="#c62828" stroke-width="3" marker-end="url(#scene2-arrowhead-red)"/>
            <text id="scene2-label-f-abs" x="250" y="378" text-anchor="middle" font-size="15" fill="#c62828" font-weight="bold">F<tspan baseline-shift="sub" font-size="11">吸1</tspan></text>

            <!-- Spring Force Arrow (F_spring) - Changes -->
            <line id="scene2-arrow-f-spring" class="scene2-transition" x1="300" y1="175" x2="300" y2="65" stroke="#2e7d32" stroke-width="3" marker-end="url(#scene2-arrowhead-green)"/>
            <text id="scene2-label-f-spring" x="325" y="100" font-size="15" fill="#2e7d32" font-weight="bold">F<tspan baseline-shift="sub" font-size="11">弹1</tspan></text>

            <!-- Balance Equation Box -->
            <rect id="scene2-equation-box" x="480" y="180" width="280" height="60" rx="6" fill="#f5f5f5" stroke="#cccccc" stroke-width="1"/>
            <text id="scene2-equation-text" x="620" y="215" text-anchor="middle" font-size="18" fill="#333333" font-weight="bold">
                F<tspan baseline-shift="sub" font-size="13">弹1</tspan> = G + F<tspan baseline-shift="sub" font-size="13">吸1</tspan>
            </text>

            <!-- Spring Scale -->
            <rect id="scene2-scale-housing" x="650" y="80" width="60" height="300" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2"/>
            <line x1="680" y1="80" x2="680" y2="60" stroke="#000000" stroke-width="2"/>
            <path d="M670,60 Q680,45 690,60" fill="none" stroke="#000000" stroke-width="2"/>
            <line x1="680" y1="380" x2="680" y2="400" stroke="#000000" stroke-width="2"/>
            <path d="M670,400 Q680,415 690,400" fill="none" stroke="#000000" stroke-width="2"/>
            <line x1="650" y1="120" x2="660" y2="120" stroke="#000000" stroke-width="1"/>
            <line x1="650" y1="160" x2="660" y2="160" stroke="#000000" stroke-width="1"/>
            <line x1="650" y1="200" x2="660" y2="200" stroke="#000000" stroke-width="1"/>
            <line x1="650" y1="240" x2="660" y2="240" stroke="#000000" stroke-width="1"/>
            <line x1="650" y1="280" x2="660" y2="280" stroke="#000000" stroke-width="1"/>
            <line x1="650" y1="320" x2="660" y2="320" stroke="#000000" stroke-width="1"/>
            <line x1="650" y1="360" x2="660" y2="360" stroke="#000000" stroke-width="1"/>
            <line id="scene2-scale-pointer" class="scene2-transition" x1="650" y1="250" x2="710" y2="250" stroke="#c62828" stroke-width="3"/>
            <text id="scene2-scale-reading" x="725" y="255" font-size="16" fill="#c62828" font-weight="bold">F<tspan baseline-shift="sub" font-size="11">1</tspan></text>

            <!-- Comparison Annotations (hidden in state 1) -->
            <text id="scene2-compare-abs" class="scene2-compare" x="250" y="410" text-anchor="middle" font-size="15" fill="#c62828" font-weight="bold">F<tspan baseline-shift="sub" font-size="11">吸</tspan>↓</text>
            <text id="scene2-compare-spring" class="scene2-compare" x="325" y="130" font-size="15" fill="#2e7d32" font-weight="bold">F<tspan baseline-shift="sub" font-size="11">弹</tspan>↓</text>
            <text id="scene2-compare-result" class="scene2-compare" x="600" y="320" text-anchor="middle" font-size="16" fill="#2e7d32" font-weight="bold">F<tspan baseline-shift="sub" font-size="11">2</tspan> &lt; F<tspan baseline-shift="sub" font-size="11">1</tspan></text>
        </svg>

        <div id="scene2-controls">
            <button id="scene2-btn-state1" class="active">◀ 状态1</button>
            <button id="scene2-btn-state2">状态2 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        'use strict';
        let currentState = 1;
        let isAnimating = false;

        const title = document.getElementById('scene2-title');
        const arrowFAbs = document.getElementById('scene2-arrow-f-abs');
        const arrowFSpring = document.getElementById('scene2-arrow-f-spring');
        const labelFAbs = document.getElementById('scene2-label-f-abs');
        const labelFSpring = document.getElementById('scene2-label-f-spring');
        const equationText = document.getElementById('scene2-equation-text');
        const scalePointer = document.getElementById('scene2-scale-pointer');
        const scaleReading = document.getElementById('scene2-scale-reading');
        const btnState1 = document.getElementById('scene2-btn-state1');
        const btnState2 = document.getElementById('scene2-btn-state2');
        const compareAbs = document.getElementById('scene2-compare-abs');
        const compareSpring = document.getElementById('scene2-compare-spring');
        const compareResult = document.getElementById('scene2-compare-result');

        const states = {
            1: {
                title: '状态1（滑片初始位置）',
                fAbsY2: 355,
                fSpringY2: 65,
                fAbsLabel: 'F<tspan baseline-shift="sub" font-size="11">吸1</tspan>',
                fSpringLabel: 'F<tspan baseline-shift="sub" font-size="11">弹1</tspan>',
                equation: 'F<tspan baseline-shift="sub" font-size="13">弹1</tspan> = G + F<tspan baseline-shift="sub" font-size="13">吸1</tspan>',
                pointerY: 250,
                reading: 'F<tspan baseline-shift="sub" font-size="11">1</tspan>',
                showCompare: false
            },
            2: {
                title: '状态2（滑片右移后）',
                fAbsY2: 305,
                fSpringY2: 105,
                fAbsLabel: 'F<tspan baseline-shift="sub" font-size="11">吸2</tspan>',
                fSpringLabel: 'F<tspan baseline-shift="sub" font-size="11">弹2</tspan>',
                equation: 'F<tspan baseline-shift="sub" font-size="13">弹2</tspan> = G + F<tspan baseline-shift="sub" font-size="13">吸2</tspan>',
                pointerY: 220,
                reading: 'F<tspan baseline-shift="sub" font-size="11">2</tspan>',
                showCompare: true
            }
        };

        function switchState(target) {
            if (target === currentState || isAnimating) return;
            isAnimating = true;
            currentState = target;
            const s = states[target];

            title.textContent = s.title;
            arrowFAbs.setAttribute('y2', s.fAbsY2);
            labelFAbs.innerHTML = s.fAbsLabel;
            arrowFSpring.setAttribute('y2', s.fSpringY2);
            labelFSpring.innerHTML = s.fSpringLabel;
            equationText.innerHTML = s.equation;
            scalePointer.setAttribute('y1', s.pointerY);
            scalePointer.setAttribute('y2', s.pointerY);
            scaleReading.innerHTML = s.reading;
            scaleReading.setAttribute('y', s.pointerY + 5);

            if (s.showCompare) {
                compareAbs.classList.add('visible');
                compareSpring.classList.add('visible');
                compareResult.classList.add('visible');
            } else {
                compareAbs.classList.remove('visible');
                compareSpring.classList.remove('visible');
                compareResult.classList.remove('visible');
            }

            if (target === 1) {
                btnState1.classList.add('active');
                btnState2.classList.remove('active');
            } else {
                btnState2.classList.add('active');
                btnState1.classList.remove('active');
            }

            setTimeout(function() { isAnimating = false; }, 650);
        }

        btnState1.addEventListener('click', function() { switchState(1); });
        btnState2.addEventListener('click', function() { switchState(2); });
    })();
    </script>
</body>
</html>
