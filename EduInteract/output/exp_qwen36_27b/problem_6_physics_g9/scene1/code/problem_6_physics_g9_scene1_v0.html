<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>滑动变阻器与电磁铁</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 16px; z-index: 10; }
        #scene1-controls button { padding: 8px 20px; font-size: 14px; border: 1px solid #333; border-radius: 4px; background: #f5f5f5; cursor: pointer; font-family: inherit; }
        #scene1-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene1-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 14px; color: #333; min-width: 80px; text-align: center; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- Background -->
            <rect width="800" height="500" fill="#ffffff"/>

            <!-- Arrow markers -->
            <defs>
                <marker id="scene1-arrow-gray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
                    <polygon points="0,0 8,3 0,6" fill="#888"/>
                </marker>
                <marker id="scene1-arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
                    <polygon points="0,0 8,3 0,6" fill="#c62828"/>
                </marker>
                <marker id="scene1-arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
                    <polygon points="0,0 8,3 0,6" fill="#2e7d32"/>
                </marker>
            </defs>

            <!-- ===== Fixed support (hatched) ===== -->
            <g id="scene1-support">
                <rect x="500" y="5" width="50" height="15" fill="#cccccc" stroke="#333" stroke-width="1"/>
                <line x1="502" y1="5" x2="508" y2="0" stroke="#333" stroke-width="1"/>
                <line x1="510" y1="5" x2="516" y2="0" stroke="#333" stroke-width="1"/>
                <line x1="518" y1="5" x2="524" y2="0" stroke="#333" stroke-width="1"/>
                <line x1="526" y1="5" x2="532" y2="0" stroke="#333" stroke-width="1"/>
                <line x1="534" y1="5" x2="540" y2="0" stroke="#333" stroke-width="1"/>
                <line x1="542" y1="5" x2="548" y2="0" stroke="#333" stroke-width="1"/>
            </g>

            <!-- ===== Spring dynamometer ===== -->
            <g id="scene1-dynamometer">
                <rect x="505" y="20" width="40" height="100" fill="#f5f5f5" stroke="#333" stroke-width="1.5" rx="3"/>
                <!-- Scale marks -->
                <line x1="508" y1="35" x2="512" y2="35" stroke="#333" stroke-width="0.5"/>
                <line x1="508" y1="50" x2="512" y2="50" stroke="#333" stroke-width="0.5"/>
                <line x1="508" y1="65" x2="512" y2="65" stroke="#333" stroke-width="0.5"/>
                <line x1="508" y1="80" x2="512" y2="80" stroke="#333" stroke-width="0.5"/>
                <line x1="508" y1="95" x2="512" y2="95" stroke="#333" stroke-width="0.5"/>
                <!-- Spring (zigzag) -->
                <polyline points="525,25 520,35 530,45 520,55 530,65 520,75 530,85 520,95 530,105 525,115" fill="none" stroke="#666" stroke-width="1.5"/>
                <!-- Hook -->
                <path d="M525,115 L525,125 Q525,130 520,130 Q515,130 515,125" fill="none" stroke="#333" stroke-width="1.5"/>
                <!-- Pointer (dynamic) -->
                <line id="scene1-spring-pointer" x1="542" y1="80" x2="548" y2="80" stroke="#c62828" stroke-width="2"/>
            </g>

            <!-- ===== Steel ball ===== -->
            <g id="scene1-ball">
                <circle cx="525" cy="145" r="10" fill="#333"/>
                <text x="545" y="148" font-size="12" fill="#333">铁球</text>
            </g>

            <!-- ===== Electromagnet ===== -->
            <g id="scene1-electromagnet">
                <!-- Core -->
                <rect x="505" y="170" width="40" height="160" fill="#eeeeee" stroke="#333" stroke-width="1.5"/>
                <!-- Coil loops (left side) -->
                <path d="M505,185 Q490,195 505,205" fill="none" stroke="#333" stroke-width="1.5"/>
                <path d="M505,210 Q490,220 505,230" fill="none" stroke="#333" stroke-width="1.5"/>
                <path d="M505,235 Q490,245 505,255" fill="none" stroke="#333" stroke-width="1.5"/>
                <path d="M505,260 Q490,270 505,280" fill="none" stroke="#333" stroke-width="1.5"/>
                <path d="M505,285 Q490,295 505,305" fill="none" stroke="#333" stroke-width="1.5"/>
                <path d="M505,310 Q490,320 505,330" fill="none" stroke="#333" stroke-width="1.5"/>
                <!-- Coil loops (right side) -->
                <path d="M545,185 Q560,195 545,205" fill="none" stroke="#333" stroke-width="1.5"/>
                <path d="M545,210 Q560,220 545,230" fill="none" stroke="#333" stroke-width="1.5"/>
                <path d="M545,235 Q560,245 545,255" fill="none" stroke="#333" stroke-width="1.5"/>
                <path d="M545,260 Q560,270 545,280" fill="none" stroke="#333" stroke-width="1.5"/>
                <path d="M545,285 Q560,295 545,305" fill="none" stroke="#333" stroke-width="1.5"/>
                <path d="M545,310 Q560,320 545,330" fill="none" stroke="#333" stroke-width="1.5"/>
                <!-- Label -->
                <text x="570" y="255" font-size="14" fill="#333">电磁铁</text>
            </g>

            <!-- ===== Circuit wires (drawn before components so components cover connection points) ===== -->
            <g id="scene1-wires" stroke="#000" stroke-width="2" fill="none">
                <!-- Wire from fixed resistor left to ammeter top -->
                <polyline points="180,110 100,110 100,155"/>
                <!-- Wire from ammeter bottom to rheostat left -->
                <line x1="100" y1="205" x2="100" y2="350"/>
                <!-- Wire from rheostat right to battery(-) -->
                <line x1="220" y1="350" x2="265" y2="350"/>
                <!-- Wire from battery(+) to switch -->
                <line x1="280" y1="350" x2="300" y2="350"/>
                <!-- Wire from switch to electromagnet bottom -->
                <polyline points="340,350 525,350 525,330"/>
                <!-- Wire from electromagnet top to fixed resistor right -->
                <polyline points="525,170 300,170 300,110"/>
            </g>

            <!-- ===== Fixed resistor ===== -->
            <g id="scene1-resistor">
                <rect x="180" y="100" width="120" height="20" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
            </g>

            <!-- ===== Ammeter ===== -->
            <g id="scene1-ammeter">
                <circle cx="100" cy="180" r="25" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
                <text x="100" y="185" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">A</text>
                <!-- Needle (dynamic) -->
                <line id="scene1-ammeter-needle" x1="100" y1="180" x2="119" y2="169" stroke="#c62828" stroke-width="2"/>
            </g>

            <!-- ===== Sliding rheostat ===== -->
            <g id="scene1-rheostat">
                <rect x="100" y="340" width="120" height="20" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
                <!-- Red highlight for active portion (dynamic) -->
                <rect id="scene1-rheostat-highlight" x="100" y="340" width="30" height="20" fill="#c62828" opacity="0.3"/>
                <!-- Slider arrow (dynamic) -->
                <g id="scene1-slider">
                    <line x1="130" y1="325" x2="130" y2="340" stroke="#c62828" stroke-width="2"/>
                    <polygon points="125,325 135,325 130,318" fill="#c62828"/>
                </g>
            </g>

            <!-- ===== Battery ===== -->
            <g id="scene1-battery">
                <!-- Long line (positive) -->
                <line x1="280" y1="335" x2="280" y2="365" stroke="#333" stroke-width="2"/>
                <!-- Short line (negative) -->
                <line x1="265" y1="340" x2="265" y2="360" stroke="#333" stroke-width="3"/>
                <text x="285" y="345" font-size="11" fill="#333">+</text>
                <text x="255" y="345" font-size="11" fill="#333">-</text>
            </g>

            <!-- ===== Switch (closed) ===== -->
            <g id="scene1-switch">
                <circle cx="300" cy="350" r="3" fill="#333"/>
                <circle cx="340" cy="350" r="3" fill="#333"/>
                <line x1="300" y1="350" x2="340" y2="350" stroke="#333" stroke-width="2"/>
            </g>

            <!-- ===== Magnetic field lines (dynamic opacity) ===== -->
            <g id="scene1-magnetic-lines" opacity="1">
                <!-- Left side field lines -->
                <path d="M495,200 Q465,200 465,250 Q465,300 495,300" fill="none" stroke="#1565c0" stroke-width="1.5" opacity="0.8"/>
                <path d="M490,210 Q455,210 455,250 Q455,290 490,290" fill="none" stroke="#1565c0" stroke-width="1.5" opacity="0.6"/>
                <path d="M485,220 Q445,220 445,250 Q445,280 485,280" fill="none" stroke="#1565c0" stroke-width="1.5" opacity="0.4"/>
                <!-- Right side field lines -->
                <path d="M555,200 Q585,200 585,250 Q585,300 555,300" fill="none" stroke="#1565c0" stroke-width="1.5" opacity="0.8"/>
                <path d="M560,210 Q595,210 595,250 Q595,290 560,290" fill="none" stroke="#1565c0" stroke-width="1.5" opacity="0.6"/>
                <path d="M565,220 Q605,220 605,250 Q605,280 565,280" fill="none" stroke="#1565c0" stroke-width="1.5" opacity="0.4"/>
                <!-- Top field line -->
                <path d="M510,170 Q510,150 525,140 Q540,150 540,170" fill="none" stroke="#1565c0" stroke-width="1.5" opacity="0.6"/>
                <!-- Bottom field line -->
                <path d="M510,330 Q510,350 525,360 Q540,350 540,330" fill="none" stroke="#1565c0" stroke-width="1.5" opacity="0.6"/>
            </g>

            <!-- ===== Force arrows (dynamic, hidden initially) ===== -->
            <g id="scene1-force-arrows" opacity="0">
                <!-- G (gravity, downward, gray) -->
                <line id="scene1-force-g" x1="515" y1="145" x2="515" y2="185" stroke="#888" stroke-width="2" marker-end="url(#scene1-arrow-gray)"/>
                <text x="500" y="175" font-size="12" fill="#888">G</text>

                <!-- F_吸 (attraction, downward, red) -->
                <line id="scene1-force-f-attraction" x1="535" y1="145" x2="535" y2="170" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrow-red)"/>
                <text id="scene1-label-f-attraction" x="542" y="165" font-size="12" fill="#c62828">F_吸</text>

                <!-- F_弹 (spring force, upward, green) -->
                <line id="scene1-force-f-spring" x1="525" y1="145" x2="525" y2="105" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene1-arrow-green)"/>
                <text id="scene1-label-f-spring" x="538" y="120" font-size="12" fill="#2e7d32">F_弹</text>
            </g>

            <!-- ===== Labels (dynamic) ===== -->
            <g id="scene1-labels">
                <text id="scene1-label-r-up" x="150" y="330" font-size="14" fill="#c62828" opacity="0">R↑</text>
                <text id="scene1-label-i-down" x="130" y="160" font-size="14" fill="#c62828" opacity="0">I↓</text>
                <text id="scene1-label-magnetic" x="570" y="100" font-size="14" fill="#1565c0" opacity="0">磁性减弱</text>
                <text id="scene1-label-f-attraction-down" x="570" y="170" font-size="14" fill="#c62828" opacity="0">F_吸↓</text>
                <text id="scene1-label-equation" x="640" y="180" font-size="13" fill="#333" opacity="0">F_弹 = G + F_吸</text>
            </g>

            <!-- ===== Conclusion box (dynamic, hidden initially) ===== -->
            <g id="scene1-conclusion" opacity="0">
                <rect x="630" y="200" width="150" height="130" fill="#f5f5f5" stroke="#333" stroke-width="1.5" rx="5"/>
                <text x="640" y="225" font-size="13" fill="#2e7d32" font-weight="bold">弹簧测力计示数变小 ✓</text>
                <text x="640" y="250" font-size="12" fill="#333">A. 总电阻变小 ✗</text>
                <text x="640" y="270" font-size="12" fill="#2e7d32" font-weight="bold">B. 示数变小 ✓</text>
                <text x="640" y="290" font-size="12" fill="#333">C. 磁性增强 ✗</text>
                <text x="640" y="310" font-size="12" fill="#333">D. 电流变大 ✗</text>
            </g>
        </svg>

        <!-- Controls -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 0 / 4</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1: 滑动变阻器滑片右移引起的电路与电磁铁连锁变化
        // 布局坐标表（来自 spec.json）：
        // 定值电阻: (180,100)-(300,120) | 电流表: cx=100,cy=180,r=25
        // 滑动变阻器: (100,340)-(220,360) | 滑片初始: x=130
        // 电源: (265,340)-(280,365) | 开关: (300,350)-(340,350)
        // 电磁铁: (505,170)-(545,330) | 弹簧测力计: (505,20)-(545,120)
        // 铁球: cx=525,cy=145,r=10 | 结论框: (630,200)-(780,330)

        let currentStep = 0;
        const maxStep = 4;

        // DOM elements
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');

        // SVG dynamic elements
        const slider = document.getElementById('scene1-slider');
        const rheostatHighlight = document.getElementById('scene1-rheostat-highlight');
        const ammeterNeedle = document.getElementById('scene1-ammeter-needle');
        const magneticLines = document.getElementById('scene1-magnetic-lines');
        const forceArrows = document.getElementById('scene1-force-arrows');
        const springPointer = document.getElementById('scene1-spring-pointer');
        const forceFAttraction = document.getElementById('scene1-force-f-attraction');

        // Labels
        const labelRUp = document.getElementById('scene1-label-r-up');
        const labelIDown = document.getElementById('scene1-label-i-down');
        const labelMagnetic = document.getElementById('scene1-label-magnetic');
        const labelFAttractionDown = document.getElementById('scene1-label-f-attraction-down');
        const labelEquation = document.getElementById('scene1-label-equation');

        // Conclusion
        const conclusion = document.getElementById('scene1-conclusion');

        // Easing function
        function easeInOut(t) {
            return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
        }

        // Get target value for a given step
        function getTarget(prop, step) {
            switch (prop) {
                case 'sliderOffset': return step >= 1 ? 40 : 0;
                case 'highlightWidth': return step >= 1 ? 70 : 30;
                case 'needleAngle': return step >= 1 ? 15 : 60;
                case 'magOpacity': return step >= 2 ? 0.3 : 1;
                case 'forceOpacity': return step >= 3 ? 1 : 0;
                case 'fAttrY': return step >= 3 ? 160 : (step >= 2 ? 170 : 170);
                case 'springY': return step >= 4 ? 55 : 80;
                case 'labelRUp': return step >= 1 ? 1 : 0;
                case 'labelIDown': return step >= 1 ? 1 : 0;
                case 'labelMagnetic': return step >= 2 ? 1 : 0;
                case 'labelFAttractionDown': return step >= 2 ? 1 : 0;
                case 'labelEquation': return step >= 3 ? 1 : 0;
                case 'conclusion': return step >= 4 ? 1 : 0;
                default: return 0;
            }
        }

        function updateScene(step) {
            const duration = 400;
            const start = performance.now();
            const prevStep = currentStep;
            currentStep = step;

            // Update button states
            btnPrev.disabled = step === 0;
            btnNext.disabled = step === maxStep;
            stepIndicator.textContent = '步骤 ' + step + ' / ' + maxStep;

            function animate(now) {
                const t = Math.min((now - start) / duration, 1);
                const e = easeInOut(t);

                // Helper: interpolate between prev and target
                function lerp(prop) {
                    const from = getTarget(prop, prevStep);
                    const to = getTarget(prop, step);
                    return from + e * (to - from);
                }

                // Slider position
                const sliderOffset = lerp('sliderOffset');
                slider.setAttribute('transform', 'translate(' + sliderOffset + ', 0)');

                // Rheostat highlight width
                rheostatHighlight.setAttribute('width', lerp('highlightWidth'));

                // Ammeter needle angle
                const angle = lerp('needleAngle');
                const needleLen = 22;
                const nx = 100 + needleLen * Math.sin(angle * Math.PI / 180);
                const ny = 180 - needleLen * Math.cos(angle * Math.PI / 180);
                ammeterNeedle.setAttribute('x2', nx);
                ammeterNeedle.setAttribute('y2', ny);

                // Magnetic lines opacity
                magneticLines.setAttribute('opacity', lerp('magOpacity'));

                // Force arrows opacity
                forceArrows.setAttribute('opacity', lerp('forceOpacity'));

                // F_吸 arrow length
                forceFAttraction.setAttribute('y2', lerp('fAttrY'));

                // Spring pointer
                const springY = lerp('springY');
                springPointer.setAttribute('y1', springY);
                springPointer.setAttribute('y2', springY);

                // Labels
                labelRUp.setAttribute('opacity', lerp('labelRUp'));
                labelIDown.setAttribute('opacity', lerp('labelIDown'));
                labelMagnetic.setAttribute('opacity', lerp('labelMagnetic'));
                labelFAttractionDown.setAttribute('opacity', lerp('labelFAttractionDown'));
                labelEquation.setAttribute('opacity', lerp('labelEquation'));

                // Conclusion
                conclusion.setAttribute('opacity', lerp('conclusion'));

                if (t < 1) {
                    requestAnimationFrame(animate);
                }
            }

            requestAnimationFrame(animate);
        }

        // Event listeners
        btnNext.addEventListener('click', function() {
            if (currentStep < maxStep) {
                updateScene(currentStep + 1);
            }
        });

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                updateScene(currentStep - 1);
            }
        });

        // Initialize to step 0
        updateScene(0);
    })();
    </script>
</body>
</html>
