<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四棱锥表面积计算 - 场景2</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "SimHei", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-svg { width: 800px; height: 500px; display: block; }

        #scene2-controls {
            position: absolute; bottom: 8px; left: 0; right: 0;
            display: flex; justify-content: center; align-items: center; gap: 16px; z-index: 10;
        }
        #scene2-controls button {
            padding: 5px 16px; font-size: 14px; cursor: pointer;
            border: 1px solid #999; border-radius: 4px; background: #f5f5f5;
            transition: background 0.2s; font-family: inherit;
        }
        #scene2-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene2-controls button:disabled { opacity: 0.4; cursor: default; }
        #scene2-step-indicator { font-size: 14px; color: #333; min-width: 70px; text-align: center; }

        .scene2-face { transition: fill 0.3s ease, opacity 0.3s ease; }
        .scene2-formula { transition: opacity 0.3s ease; }
        .scene2-answer { transition: opacity 0.3s ease; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- ===== 四棱锥立体图 ===== -->
            <g id="scene2-pyramid">
                <!-- 底面 ABCD -->
                <polygon id="scene2-face-abcd" class="scene2-face"
                    points="180,320 380,320 420,270 220,270"
                    fill="#fafafa" stroke="none" opacity="1"/>
                <!-- 侧面 △PAD (左) -->
                <polygon id="scene2-face-pad" class="scene2-face"
                    points="280,160 180,320 220,270"
                    fill="#fafafa" stroke="none" opacity="1"/>
                <!-- 侧面 △PBC (右) -->
                <polygon id="scene2-face-pbc" class="scene2-face"
                    points="280,160 380,320 420,270"
                    fill="#fafafa" stroke="none" opacity="1"/>
                <!-- 侧面 △PCD (后) -->
                <polygon id="scene2-face-pcd" class="scene2-face"
                    points="280,160 420,270 220,270"
                    fill="#fafafa" stroke="none" opacity="1"/>
                <!-- 侧面 △PAB (前) -->
                <polygon id="scene2-face-pab" class="scene2-face"
                    points="280,160 180,320 380,320"
                    fill="#fafafa" stroke="none" opacity="1"/>

                <!-- 棱线 (实线) -->
                <line x1="180" y1="320" x2="380" y2="320" stroke="#000" stroke-width="2"/>
                <line x1="380" y1="320" x2="420" y2="270" stroke="#000" stroke-width="2"/>
                <line x1="420" y1="270" x2="220" y2="270" stroke="#000" stroke-width="2"/>
                <line x1="220" y1="270" x2="180" y2="320" stroke="#000" stroke-width="2"/>
                <line x1="280" y1="160" x2="180" y2="320" stroke="#000" stroke-width="2"/>
                <line x1="280" y1="160" x2="380" y2="320" stroke="#000" stroke-width="2"/>
                <line x1="280" y1="160" x2="420" y2="270" stroke="#000" stroke-width="2"/>
                <line x1="280" y1="160" x2="220" y2="270" stroke="#000" stroke-width="2"/>

                <!-- 辅助线 (虚线) -->
                <line id="scene2-line-po" x1="280" y1="160" x2="280" y2="320"
                    stroke="#888888" stroke-width="1" stroke-dasharray="5,3" opacity="0.7"/>
                <line id="scene2-line-om" x1="280" y1="320" x2="320" y2="270"
                    stroke="#888888" stroke-width="1" stroke-dasharray="5,3" opacity="0.7"/>
                <line id="scene2-line-pm" x1="280" y1="160" x2="320" y2="270"
                    stroke="#888888" stroke-width="1" stroke-dasharray="5,3" opacity="0.7"/>

                <!-- 直角标记 -->
                <polyline id="scene2-rightangle-o" points="280,310 290,310 290,320"
                    fill="none" stroke="#888" stroke-width="1" opacity="0.7"/>
            </g>

            <!-- ===== 顶点标签 (移到多边形边界框外) ===== -->
            <text id="scene2-label-p" x="265" y="148" font-size="14" font-weight="bold" fill="#000">P</text>
            <text id="scene2-label-a" x="162" y="338" font-size="14" font-weight="bold" fill="#000">A</text>
            <text id="scene2-label-b" x="398" y="338" font-size="14" font-weight="bold" fill="#000">B</text>
            <text id="scene2-label-c" x="438" y="268" font-size="14" font-weight="bold" fill="#000">C</text>
            <!-- D: 移到 face-pad 边界框(x≥180)左侧 -->
            <text id="scene2-label-d" x="155" y="250" font-size="14" font-weight="bold" fill="#000">D</text>
            <!-- O: 移到 AB 线下方 -->
            <text id="scene2-label-o" x="295" y="368" font-size="13" font-weight="bold" fill="#555">O</text>
            <!-- M: 移到所有多边形边界框下方(y>320) -->
            <text id="scene2-label-m" x="340" y="335" font-size="13" font-weight="bold" fill="#555">M</text>

            <!-- ===== 数值标注 ===== -->
            <text id="scene2-val-ab" x="280" y="385" font-size="12" fill="#000" text-anchor="middle">AB = 6</text>
            <text id="scene2-val-ad" x="150" y="300" font-size="12" fill="#000" text-anchor="end">AD = 2</text>
            <!-- PO=4: 移到 face-pab 边界框(x≥180)左侧，且与D不重叠 -->
            <text id="scene2-val-po" x="135" y="220" font-size="12" fill="#000" text-anchor="end">PO = 4</text>
            <text id="scene2-val-ao" x="230" y="378" font-size="11" fill="#666" text-anchor="middle">3</text>
            <text id="scene2-val-ob" x="330" y="378" font-size="11" fill="#666" text-anchor="middle">3</text>

            <!-- ===== 公式推导区 (右侧) ===== -->
            <g id="scene2-formula-area">
                <text id="scene2-formula-title" x="580" y="65" font-size="15" font-weight="bold" fill="#333">表面积计算</text>

                <g id="scene2-formula-row1" class="scene2-formula" opacity="0">
                    <text x="580" y="100" font-size="14" fill="#2e7d32" font-weight="bold">底面 ABCD：</text>
                    <text x="580" y="135" font-size="13" fill="#2e7d32">S<tspan baseline-shift="sub" font-size="10">底</tspan> = 6 × 2 = <tspan font-weight="bold">12</tspan></text>
                </g>

                <g id="scene2-formula-row2" class="scene2-formula" opacity="0">
                    <text x="580" y="180" font-size="14" fill="#1565c0" font-weight="bold">侧面 △PAB：</text>
                    <text x="580" y="215" font-size="13" fill="#1565c0">等腰△，底 AB=6，高 PO=4</text>
                    <text x="580" y="250" font-size="13" fill="#c62828">PA = PB = √(3²+4²) = <tspan font-weight="bold">5</tspan></text>
                    <text x="580" y="285" font-size="13" fill="#1565c0">S<tspan baseline-shift="sub" font-size="10">△PAB</tspan> = ½ × 6 × 4 = <tspan font-weight="bold">12</tspan></text>
                </g>

                <g id="scene2-formula-row3" class="scene2-formula" opacity="0">
                    <text x="580" y="330" font-size="14" fill="#1565c0" font-weight="bold">侧面 △PCD：</text>
                    <text x="580" y="365" font-size="13" fill="#1565c0">取 CD 中点 M，PM ⊥ CD</text>
                    <text x="580" y="400" font-size="13" fill="#c62828">PM = √(4²+2²) = <tspan font-weight="bold">2√5</tspan></text>
                    <text x="580" y="435" font-size="13" fill="#1565c0">S<tspan baseline-shift="sub" font-size="10">△PCD</tspan> = ½ × 6 × 2√5 = <tspan font-weight="bold">6√5</tspan></text>
                </g>

                <g id="scene2-formula-row4" class="scene2-formula" opacity="0">
                    <text x="580" y="100" font-size="14" fill="#1565c0" font-weight="bold">侧面 △PAD / △PBC：</text>
                    <text x="580" y="135" font-size="13" fill="#1565c0">PA=5, AD=2, PD=√29</text>
                    <text x="580" y="170" font-size="13" fill="#c62828">5²+2²=29=PD² ⇒ ∠PAD=90°</text>
                    <text x="580" y="205" font-size="13" fill="#1565c0">S<tspan baseline-shift="sub" font-size="10">△PAD</tspan> = S<tspan baseline-shift="sub" font-size="10">△PBC</tspan> = ½ × 5 × 2 = <tspan font-weight="bold">5</tspan></text>
                </g>
            </g>

            <!-- ===== 步骤5: 汇总与答案 ===== -->
            <g id="scene2-formula-row5" class="scene2-formula" opacity="0">
                <text x="580" y="100" font-size="14" fill="#333" font-weight="bold">总表面积汇总：</text>
                <text x="580" y="135" font-size="13" fill="#333">S = 12 + 12 + 6√5 + 5 + 5</text>
            </g>

            <g id="scene2-answer" class="scene2-answer" opacity="0">
                <text x="400" y="400" font-size="22" font-weight="bold" fill="#c62828" text-anchor="middle">S<tspan baseline-shift="sub" font-size="15">总</tspan> = 34 + 6√5</text>
            </g>
        </svg>

        <div id="scene2-controls">
            <button id="scene2-btn-prev">◀ 上一步</button>
            <span id="scene2-step-indicator">步骤 0/5</span>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        'use strict';

        var currentStep = 0;
        var maxStep = 5;

        var btnPrev = document.getElementById('scene2-btn-prev');
        var btnNext = document.getElementById('scene2-btn-next');
        var stepIndicator = document.getElementById('scene2-step-indicator');

        var faceAbcd = document.getElementById('scene2-face-abcd');
        var facePab = document.getElementById('scene2-face-pab');
        var facePcd = document.getElementById('scene2-face-pcd');
        var facePad = document.getElementById('scene2-face-pad');
        var facePbc = document.getElementById('scene2-face-pbc');

        var formulaRow1 = document.getElementById('scene2-formula-row1');
        var formulaRow2 = document.getElementById('scene2-formula-row2');
        var formulaRow3 = document.getElementById('scene2-formula-row3');
        var formulaRow4 = document.getElementById('scene2-formula-row4');
        var formulaRow5 = document.getElementById('scene2-formula-row5');
        var answer = document.getElementById('scene2-answer');
        var formulaTitle = document.getElementById('scene2-formula-title');

        function show(el) {
            el.style.display = '';
            el.setAttribute('opacity', '1');
        }
        function hide(el) {
            el.style.display = 'none';
            el.setAttribute('opacity', '0');
        }

        function renderStep(step) {
            faceAbcd.setAttribute('fill', '#fafafa');
            facePab.setAttribute('fill', '#fafafa');
            facePcd.setAttribute('fill', '#fafafa');
            facePad.setAttribute('fill', '#fafafa');
            facePbc.setAttribute('fill', '#fafafa');

            hide(formulaRow1);
            hide(formulaRow2);
            hide(formulaRow3);
            hide(formulaRow4);
            hide(formulaRow5);
            hide(answer);

            formulaTitle.textContent = '表面积计算';

            if (step >= 1) {
                faceAbcd.setAttribute('fill', 'rgba(46,125,50,0.2)');
                show(formulaRow1);
            }
            if (step >= 2) {
                facePab.setAttribute('fill', 'rgba(21,101,192,0.2)');
                show(formulaRow2);
            }
            if (step >= 3) {
                facePcd.setAttribute('fill', 'rgba(21,101,192,0.2)');
                show(formulaRow3);
            }
            if (step >= 4) {
                facePad.setAttribute('fill', 'rgba(21,101,192,0.2)');
                facePbc.setAttribute('fill', 'rgba(21,101,192,0.2)');
                show(formulaRow4);
            }
            if (step >= 5) {
                faceAbcd.setAttribute('fill', '#fafafa');
                facePab.setAttribute('fill', '#fafafa');
                facePcd.setAttribute('fill', '#fafafa');
                facePad.setAttribute('fill', '#fafafa');
                facePbc.setAttribute('fill', '#fafafa');

                hide(formulaRow1);
                hide(formulaRow2);
                hide(formulaRow3);
                hide(formulaRow4);
                formulaTitle.textContent = '最终结果';
                show(formulaRow5);
                show(answer);
            }

            stepIndicator.textContent = '步骤 ' + step + '/5';
            btnPrev.disabled = (step === 0);
            btnNext.disabled = (step === maxStep);
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) { currentStep--; renderStep(currentStep); }
        });
        btnNext.addEventListener('click', function() {
            if (currentStep < maxStep) { currentStep++; renderStep(currentStep); }
        });

        renderStep(0);
    })();
    </script>
</body>
</html>
