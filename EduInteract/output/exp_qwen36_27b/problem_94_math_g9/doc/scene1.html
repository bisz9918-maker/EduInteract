<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三棱柱表面展开图</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-svg { width: 800px; height: 500px; display: block; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            padding: 8px 20px; font-size: 14px; border: 1px solid #333; border-radius: 4px;
            background: #f5f5f5; cursor: pointer; min-width: 120px;
        }
        #scene1-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene1-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        .hidden-el { opacity: 0; pointer-events: none; display: none; }
        .fade-el { transition: opacity 0.4s ease-in-out; }
        .move-el { transition: transform 0.6s ease-in-out, opacity 0.4s ease-in-out; }
        .highlight-edge { transition: stroke 0.3s ease-in-out, stroke-width 0.3s ease-in-out, stroke-dasharray 0.3s ease-in-out; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 步骤标题 -->
            <text id="scene1-step-title" x="400" y="45" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">三棱柱立体图</text>

            <!-- ===== 三棱柱立体图组 (步骤0-2) ===== -->
            <g id="scene1-prism-group" class="fade-el">
                <!-- 底面三角形 -->
                <polygon id="scene1-base-tri" points="340,320 460,320 400,250" fill="#1565c0" fill-opacity="0.2" stroke="#000" stroke-width="2"/>
                <!-- 顶面三角形 -->
                <polygon id="scene1-top-tri" points="350,200 470,200 410,130" fill="#1565c0" fill-opacity="0.2" stroke="#000" stroke-width="2"/>
                <!-- 侧棱 AA' -->
                <line id="scene1-edge-aa" x1="340" y1="320" x2="350" y2="200" stroke="#000" stroke-width="2"/>
                <!-- 侧棱 BB' -->
                <line id="scene1-edge-bb" x1="460" y1="320" x2="470" y2="200" stroke="#000" stroke-width="2"/>
                <!-- 侧棱 CC' (剪开位置) -->
                <line id="scene1-edge-cc" class="highlight-edge" x1="400" y1="250" x2="410" y2="130" stroke="#000" stroke-width="2"/>
            </g>

            <!-- ===== 立体图标签 (步骤1-2) ===== -->
            <text id="scene1-label-base" class="fade-el hidden-el" x="290" y="345" font-size="14" fill="#000">三角形底面</text>
            <text id="scene1-label-top" class="fade-el hidden-el" x="370" y="108" font-size="14" fill="#000">三角形顶面</text>
            <text id="scene1-label-side" class="fade-el hidden-el" x="500" y="260" font-size="14" fill="#000">矩形侧面</text>
            <text id="scene1-label-cut" class="fade-el hidden-el" x="445" y="195" font-size="14" fill="#c62828" font-weight="bold">侧棱（剪开位置）</text>

            <!-- ===== 展开图组 (步骤3-5) ===== -->
            <g id="scene1-net-group" class="move-el hidden-el">
                <!-- 三个矩形 -->
                <rect id="scene1-net-rect1" x="280" y="170" width="80" height="160" fill="#e3f2fd" fill-opacity="0.15" stroke="#000" stroke-width="2"/>
                <rect id="scene1-net-rect2" x="360" y="170" width="80" height="160" fill="#e3f2fd" fill-opacity="0.15" stroke="#000" stroke-width="2"/>
                <rect id="scene1-net-rect3" x="440" y="170" width="80" height="160" fill="#e3f2fd" fill-opacity="0.15" stroke="#000" stroke-width="2"/>
                <!-- 折叠辅助线 -->
                <line id="scene1-fold1" x1="360" y1="170" x2="360" y2="330" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
                <line id="scene1-fold2" x1="440" y1="170" x2="440" y2="330" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
                <!-- 上三角形 -->
                <polygon id="scene1-net-tri-top" points="280,170 360,170 320,110" fill="#1565c0" fill-opacity="0.2" stroke="#000" stroke-width="2" class="fade-el hidden-el"/>
                <!-- 下三角形 -->
                <polygon id="scene1-net-tri-bottom" points="440,330 520,330 480,390" fill="#1565c0" fill-opacity="0.2" stroke="#000" stroke-width="2" class="fade-el hidden-el"/>
            </g>

            <!-- ===== 展开图标签 (步骤4) ===== -->
            <text id="scene1-label-net-side" class="fade-el hidden-el" x="400" y="355" font-size="14" fill="#000">矩形侧面</text>
            <text id="scene1-label-net-top" class="fade-el hidden-el" x="320" y="92" font-size="14" fill="#000">三角形底面</text>
            <text id="scene1-label-net-bottom" class="fade-el hidden-el" x="480" y="412" font-size="14" fill="#000">三角形底面</text>

            <!-- ===== 选项A组 (步骤5) ===== -->
            <g id="scene1-optiona-group" class="fade-el hidden-el">
                <!-- 三个矩形 -->
                <rect id="scene1-opta-rect1" x="430" y="170" width="80" height="160" fill="#e3f2fd" fill-opacity="0.15" stroke="#000" stroke-width="2"/>
                <rect id="scene1-opta-rect2" x="510" y="170" width="80" height="160" fill="#e3f2fd" fill-opacity="0.15" stroke="#000" stroke-width="2"/>
                <rect id="scene1-opta-rect3" x="590" y="170" width="80" height="160" fill="#e3f2fd" fill-opacity="0.15" stroke="#000" stroke-width="2"/>
                <!-- 折叠辅助线 -->
                <line id="scene1-opta-fold1" x1="510" y1="170" x2="510" y2="330" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
                <line id="scene1-opta-fold2" x1="590" y1="170" x2="590" y2="330" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
                <!-- 上三角形 -->
                <polygon id="scene1-opta-tri-top" points="430,170 510,170 470,110" fill="#1565c0" fill-opacity="0.2" stroke="#000" stroke-width="2"/>
                <!-- 下三角形 -->
                <polygon id="scene1-opta-tri-bottom" points="590,330 670,330 630,390" fill="#1565c0" fill-opacity="0.2" stroke="#000" stroke-width="2"/>
            </g>

            <!-- ===== 步骤5标签 ===== -->
            <text id="scene1-label-net-label" class="fade-el hidden-el" x="250" y="425" font-size="14" fill="#000" text-anchor="middle">展开图</text>
            <text id="scene1-label-opta-label" class="fade-el hidden-el" x="550" y="425" font-size="14" fill="#000" text-anchor="middle">选项A</text>
            <text id="scene1-label-correct" class="fade-el hidden-el" x="550" y="92" font-size="16" fill="#2e7d32" font-weight="bold" text-anchor="middle">✓ 正确</text>
            <!-- 中间箭头 -->
            <text id="scene1-label-arrow" class="fade-el hidden-el" x="400" y="290" font-size="24" fill="#333" text-anchor="middle">→</text>

            <!-- 步骤指示器 -->
            <text id="scene1-step-indicator" x="400" y="440" text-anchor="middle" font-size="14" fill="#666">步骤 0 / 6</text>
        </svg>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() { 'use strict';

        var currentStep = 0;
        var totalSteps = 6;

        // DOM references
        var titleEl = document.getElementById('scene1-step-title');
        var indicatorEl = document.getElementById('scene1-step-indicator');
        var btnPrev = document.getElementById('scene1-btn-prev');
        var btnNext = document.getElementById('scene1-btn-next');

        // SVG groups
        var prismGroup = document.getElementById('scene1-prism-group');
        var netGroup = document.getElementById('scene1-net-group');
        var optionAGroup = document.getElementById('scene1-optiona-group');

        // Labels
        var labelBase = document.getElementById('scene1-label-base');
        var labelTop = document.getElementById('scene1-label-top');
        var labelSide = document.getElementById('scene1-label-side');
        var labelCut = document.getElementById('scene1-label-cut');
        var labelNetSide = document.getElementById('scene1-label-net-side');
        var labelNetTop = document.getElementById('scene1-label-net-top');
        var labelNetBottom = document.getElementById('scene1-label-net-bottom');
        var labelNetLabel = document.getElementById('scene1-label-net-label');
        var labelOptaLabel = document.getElementById('scene1-label-opta-label');
        var labelCorrect = document.getElementById('scene1-label-correct');
        var labelArrow = document.getElementById('scene1-label-arrow');

        // Net sub-elements
        var netTriTop = document.getElementById('scene1-net-tri-top');
        var netTriBottom = document.getElementById('scene1-net-tri-bottom');

        // Edge CC
        var edgeCC = document.getElementById('scene1-edge-cc');

        // Step titles
        var stepTitles = [
            '三棱柱立体图',
            '标注底面和侧面',
            '沿侧棱剪开',
            '侧面展开为矩形条',
            '底面连接 → 完整展开图',
            '展开图 = 选项A ✓'
        ];

        // Helper: show element
        function show(el) {
            el.classList.remove('hidden-el');
            el.style.opacity = '1';
            el.style.display = '';
        }

        // Helper: hide element
        function hide(el) {
            el.classList.add('hidden-el');
            el.style.opacity = '0';
            el.style.display = 'none';
        }

        function updateUI() {
            // Update title and indicator
            titleEl.textContent = stepTitles[currentStep];
            indicatorEl.textContent = '步骤 ' + currentStep + ' / ' + (totalSteps - 1);

            // Button states
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps - 1);

            // Reset all elements first
            hide(prismGroup);
            hide(netGroup);
            hide(optionAGroup);
            hide(labelBase);
            hide(labelTop);
            hide(labelSide);
            hide(labelCut);
            hide(labelNetSide);
            hide(labelNetTop);
            hide(labelNetBottom);
            hide(labelNetLabel);
            hide(labelOptaLabel);
            hide(labelCorrect);
            hide(labelArrow);
            hide(netTriTop);
            hide(netTriBottom);

            // Reset edge CC style
            edgeCC.setAttribute('stroke', '#000');
            edgeCC.setAttribute('stroke-width', '2');
            edgeCC.setAttribute('stroke-dasharray', '');

            // Reset net group transform
            netGroup.style.transform = '';

            // Step-specific visibility
            switch(currentStep) {
                case 0:
                    show(prismGroup);
                    break;
                case 1:
                    show(prismGroup);
                    show(labelBase);
                    show(labelTop);
                    show(labelSide);
                    break;
                case 2:
                    show(prismGroup);
                    show(labelBase);
                    show(labelTop);
                    show(labelSide);
                    show(labelCut);
                    // Highlight edge CC
                    edgeCC.setAttribute('stroke', '#c62828');
                    edgeCC.setAttribute('stroke-width', '3');
                    edgeCC.setAttribute('stroke-dasharray', '8,4');
                    break;
                case 3:
                    show(netGroup);
                    break;
                case 4:
                    show(netGroup);
                    show(netTriTop);
                    show(netTriBottom);
                    show(labelNetSide);
                    show(labelNetTop);
                    show(labelNetBottom);
                    break;
                case 5:
                    show(netGroup);
                    show(netTriTop);
                    show(netTriBottom);
                    show(optionAGroup);
                    show(labelNetLabel);
                    show(labelOptaLabel);
                    show(labelCorrect);
                    show(labelArrow);
                    // Move net group to left
                    netGroup.style.transform = 'translate(-150px, 0)';
                    break;
            }
        }

        // Event listeners
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateUI();
            }
        });

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateUI();
            }
        });

        // Initial state
        updateUI();

    })();
    </script>
</body>
</html>
