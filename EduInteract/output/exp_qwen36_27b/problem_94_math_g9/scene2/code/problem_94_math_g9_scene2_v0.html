<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三棱柱表面展开图判定</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-svg { width: 800px; height: 500px; display: block; }
        #scene2-controls {
            position: absolute; bottom: 10px; left: 0; right: 0;
            display: flex; justify-content: center; align-items: center; gap: 16px; z-index: 10;
        }
        #scene2-controls button {
            width: 120px; height: 36px; font-size: 15px; cursor: pointer;
            border: 2px solid #1976d2; border-radius: 6px; background: #ffffff; color: #1976d2;
            font-family: inherit; transition: all 0.2s;
        }
        #scene2-controls button:hover:not(:disabled) { background: #e3f2fd; }
        #scene2-controls button:disabled { border-color: #cccccc; color: #cccccc; cursor: not-allowed; background: #fafafa; }
        #scene2-controls button.scene2-btn-next-active { background: #1976d2; color: #ffffff; }
        #scene2-controls button.scene2-btn-next-active:hover:not(:disabled) { background: #1565c0; }
        #scene2-step-indicator { font-size: 16px; color: #333333; min-width: 80px; text-align: center; }

        /* SVG transitions */
        .scene2-opt-group { transition: opacity 0.3s ease; }
        .scene2-opt-group rect, .scene2-opt-group polygon {
            transition: stroke 0.3s ease, stroke-width 0.3s ease, stroke-dasharray 0.3s ease, fill 0.3s ease;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- Title -->
            <text id="scene2-title" x="400" y="50" text-anchor="middle" font-size="18" fill="#333333" font-weight="bold">
                下列四个图形中是三棱柱的表面展开图的是（ ）
            </text>

            <!-- ===== Option A ===== -->
            <g id="scene2-optA" class="scene2-opt-group">
                <rect x="40" y="130" width="40" height="100" fill="#e3f2fd" fill-opacity="0.15" stroke="#000000" stroke-width="2"/>
                <rect x="80" y="130" width="40" height="100" fill="#e3f2fd" fill-opacity="0.15" stroke="#000000" stroke-width="2"/>
                <rect x="120" y="130" width="40" height="100" fill="#e3f2fd" fill-opacity="0.15" stroke="#000000" stroke-width="2"/>
                <polygon points="40,130 80,130 60,95" fill="#1565c0" fill-opacity="0.2" stroke="#000000" stroke-width="2"/>
                <polygon points="120,230 160,230 140,265" fill="#1565c0" fill-opacity="0.2" stroke="#000000" stroke-width="2"/>
            </g>
            <text id="scene2-labelA" x="100" y="285" text-anchor="middle" font-size="16" fill="#333333" font-weight="bold">A</text>
            <text id="scene2-judgeA" x="100" y="318" text-anchor="middle" font-size="24" fill="#2e7d32" font-weight="bold" opacity="0">✓ 正确</text>
            <text id="scene2-reasonA" x="100" y="380" text-anchor="middle" font-size="13" fill="#2e7d32" opacity="0">两三角形异侧，可折叠</text>

            <!-- ===== Option B ===== -->
            <g id="scene2-optB" class="scene2-opt-group">
                <rect x="240" y="130" width="40" height="100" fill="#e3f2fd" fill-opacity="0.15" stroke="#000000" stroke-width="2"/>
                <rect x="280" y="130" width="40" height="100" fill="#e3f2fd" fill-opacity="0.15" stroke="#000000" stroke-width="2"/>
                <rect x="320" y="130" width="40" height="100" fill="#e3f2fd" fill-opacity="0.15" stroke="#000000" stroke-width="2"/>
                <polygon points="240,130 280,130 260,95" fill="#1565c0" fill-opacity="0.2" stroke="#000000" stroke-width="2"/>
                <polygon points="320,130 360,130 340,95" fill="#1565c0" fill-opacity="0.2" stroke="#000000" stroke-width="2"/>
            </g>
            <text id="scene2-labelB" x="300" y="285" text-anchor="middle" font-size="16" fill="#333333" font-weight="bold">B</text>
            <text id="scene2-judgeB" x="300" y="318" text-anchor="middle" font-size="24" fill="#c62828" font-weight="bold" opacity="0">✗ 错误</text>
            <text id="scene2-reasonB" x="300" y="380" text-anchor="middle" font-size="13" fill="#c62828" opacity="0">两三角形同侧，底面重叠</text>

            <!-- ===== Option C ===== -->
            <g id="scene2-optC" class="scene2-opt-group">
                <rect x="440" y="130" width="40" height="100" fill="#e3f2fd" fill-opacity="0.15" stroke="#000000" stroke-width="2"/>
                <rect x="480" y="130" width="40" height="100" fill="#e3f2fd" fill-opacity="0.15" stroke="#000000" stroke-width="2"/>
                <rect x="520" y="130" width="40" height="100" fill="#e3f2fd" fill-opacity="0.15" stroke="#000000" stroke-width="2"/>
                <polygon points="440,230 480,230 460,265" fill="#1565c0" fill-opacity="0.2" stroke="#000000" stroke-width="2"/>
            </g>
            <text id="scene2-labelC" x="500" y="285" text-anchor="middle" font-size="16" fill="#333333" font-weight="bold">C</text>
            <text id="scene2-judgeC" x="500" y="318" text-anchor="middle" font-size="24" fill="#c62828" font-weight="bold" opacity="0">✗ 错误</text>
            <text id="scene2-reasonC" x="500" y="380" text-anchor="middle" font-size="13" fill="#c62828" opacity="0">缺少一个底面</text>

            <!-- ===== Option D ===== -->
            <g id="scene2-optD" class="scene2-opt-group">
                <rect x="640" y="130" width="40" height="100" fill="#e3f2fd" fill-opacity="0.15" stroke="#000000" stroke-width="2"/>
                <rect x="680" y="130" width="40" height="100" fill="#e3f2fd" fill-opacity="0.15" stroke="#000000" stroke-width="2"/>
                <rect x="720" y="130" width="40" height="100" fill="#e3f2fd" fill-opacity="0.15" stroke="#000000" stroke-width="2"/>
            </g>
            <text id="scene2-labelD" x="700" y="285" text-anchor="middle" font-size="16" fill="#333333" font-weight="bold">D</text>
            <text id="scene2-judgeD" x="700" y="318" text-anchor="middle" font-size="24" fill="#c62828" font-weight="bold" opacity="0">✗ 错误</text>
            <text id="scene2-reasonD" x="700" y="380" text-anchor="middle" font-size="13" fill="#c62828" opacity="0">无三角形底面</text>

            <!-- Summary text (step 5) -->
            <text id="scene2-summary" x="400" y="330" text-anchor="middle" font-size="28" fill="#2e7d32" font-weight="bold" opacity="0">正确答案：A</text>
        </svg>

        <!-- Controls (HTML, positioned inside SVG area bottom) -->
        <div id="scene2-controls">
            <button id="scene2-btn-prev" disabled>◀ 上一步</button>
            <span id="scene2-step-indicator">步骤 0/5</span>
            <button id="scene2-btn-next" class="scene2-btn-next-active">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() { 'use strict';

        var currentStep = 0;
        var totalSteps = 5;

        // DOM references
        var title = document.getElementById('scene2-title');
        var btnPrev = document.getElementById('scene2-btn-prev');
        var btnNext = document.getElementById('scene2-btn-next');
        var stepIndicator = document.getElementById('scene2-step-indicator');

        var optA = document.getElementById('scene2-optA');
        var optB = document.getElementById('scene2-optB');
        var optC = document.getElementById('scene2-optC');
        var optD = document.getElementById('scene2-optD');

        var judgeA = document.getElementById('scene2-judgeA');
        var judgeB = document.getElementById('scene2-judgeB');
        var judgeC = document.getElementById('scene2-judgeC');
        var judgeD = document.getElementById('scene2-judgeD');

        var reasonA = document.getElementById('scene2-reasonA');
        var reasonB = document.getElementById('scene2-reasonB');
        var reasonC = document.getElementById('scene2-reasonC');
        var reasonD = document.getElementById('scene2-reasonD');

        var summary = document.getElementById('scene2-summary');

        var labelA = document.getElementById('scene2-labelA');
        var labelB = document.getElementById('scene2-labelB');
        var labelC = document.getElementById('scene2-labelC');
        var labelD = document.getElementById('scene2-labelD');

        // Helper: show/hide elements
        function showEl(el) {
            el.style.display = '';
            el.style.opacity = '1';
        }
        function hideEl(el) {
            el.style.display = 'none';
            el.style.opacity = '0';
        }

        // Reset all options to default style
        function resetOptions() {
            [optA, optB, optC, optD].forEach(function(g) {
                g.style.opacity = '1';
                var children = g.children;
                for (var i = 0; i < children.length; i++) {
                    children[i].setAttribute('stroke', '#000000');
                    children[i].setAttribute('stroke-width', '2');
                    children[i].setAttribute('stroke-dasharray', '');
                }
            });
            [labelA, labelB, labelC, labelD].forEach(function(l) {
                l.setAttribute('fill', '#333333');
            });
        }

        // Apply highlight to an option group
        function highlightOption(g, color, width, dasharray) {
            var children = g.children;
            for (var i = 0; i < children.length; i++) {
                children[i].setAttribute('stroke', color);
                children[i].setAttribute('stroke-width', String(width));
                if (dasharray) {
                    children[i].setAttribute('stroke-dasharray', dasharray);
                } else {
                    children[i].setAttribute('stroke-dasharray', '');
                }
            }
        }

        // Render step
        function renderStep(step) {
            // Reset everything first
            resetOptions();
            hideEl(judgeA); hideEl(judgeB); hideEl(judgeC); hideEl(judgeD);
            hideEl(reasonA); hideEl(reasonB); hideEl(reasonC); hideEl(reasonD);
            hideEl(summary);

            // Update title
            var titles = [
                '下列四个图形中是三棱柱的表面展开图的是（ ）',
                '分析选项A',
                '分析选项B',
                '分析选项C',
                '分析选项D',
                '总结'
            ];
            title.textContent = titles[step];

            // Update step indicator
            stepIndicator.textContent = '步骤 ' + step + '/5';

            // Update buttons
            btnPrev.disabled = (step === 0);
            btnNext.disabled = (step === totalSteps);
            if (step < totalSteps) {
                btnNext.classList.add('scene2-btn-next-active');
            } else {
                btnNext.classList.remove('scene2-btn-next-active');
            }

            // Step-specific rendering
            switch(step) {
                case 0:
                    break;

                case 1:
                    highlightOption(optA, '#1565c0', 3, '');
                    showEl(judgeA);
                    showEl(reasonA);
                    break;

                case 2:
                    highlightOption(optB, '#c62828', 3, '6,3');
                    showEl(judgeB);
                    showEl(reasonB);
                    break;

                case 3:
                    highlightOption(optC, '#c62828', 3, '6,3');
                    showEl(judgeC);
                    showEl(reasonC);
                    break;

                case 4:
                    highlightOption(optD, '#c62828', 3, '6,3');
                    showEl(judgeD);
                    showEl(reasonD);
                    break;

                case 5:
                    highlightOption(optA, '#2e7d32', 3, '');
                    showEl(judgeA);
                    showEl(reasonA);

                    // Gray out B, C, D
                    [optB, optC, optD].forEach(function(g) {
                        g.style.opacity = '0.5';
                        var children = g.children;
                        for (var i = 0; i < children.length; i++) {
                            children[i].setAttribute('stroke', '#999999');
                            children[i].setAttribute('stroke-width', '1');
                        }
                    });
                    [labelB, labelC, labelD].forEach(function(l) {
                        l.setAttribute('fill', '#999999');
                    });

                    showEl(summary);
                    break;
            }
        }

        // Event listeners
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep(currentStep);
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                renderStep(currentStep);
            }
        });

        // Initial render
        renderStep(0);

    })();
    </script>
</body>
</html>
