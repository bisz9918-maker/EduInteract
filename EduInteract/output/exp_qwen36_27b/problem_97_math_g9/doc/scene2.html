<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2: 一次函数 y=ax+b 的图象象限判断</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-svg { width: 800px; height: 500px; display: block; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 16px; z-index: 10; }
        #scene2-controls button { padding: 8px 20px; font-size: 15px; border: 2px solid #1976d2; background: #ffffff; color: #1976d2; border-radius: 6px; cursor: pointer; transition: all 0.2s; font-family: inherit; }
        #scene2-controls button:hover:not(:disabled) { background: #1976d2; color: #fff; }
        #scene2-controls button:disabled { opacity: 0.4; cursor: not-allowed; border-color: #999; color: #999; }
        #scene2-step-indicator { font-size: 15px; color: #555; min-width: 100px; text-align: center; font-weight: bold; }
        .scene2-hidden { display: none; }
        .scene2-visible { display: block; opacity: 1; transition: opacity 0.5s ease-in-out; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <marker id="scene2-arrow-x" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#000" /></marker>
                <marker id="scene2-arrow-y" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#000" /></marker>
            </defs>
            <!-- Coordinate System -->
            <line id="scene2-axis-x" x1="100" y1="280" x2="700" y2="280" stroke="#000" stroke-width="2" marker-end="url(#scene2-arrow-x)" />
            <line id="scene2-axis-y" x1="400" y1="430" x2="400" y2="50" stroke="#000" stroke-width="2" marker-end="url(#scene2-arrow-y)" />
            <text id="scene2-origin" x="420" y="270" font-size="16" fill="#000" font-weight="bold">O</text>
            <text x="715" y="302" font-size="18" fill="#000" font-weight="bold">x</text>
            <text x="385" y="42" font-size="18" fill="#000" font-weight="bold">y</text>
            <!-- Quadrant Labels - positioned OUTSIDE fill rects -->
            <text id="scene2-quadrant-1" x="715" y="120" font-size="18" fill="#888" text-anchor="middle">Ⅰ</text>
            <text id="scene2-quadrant-2" x="85" y="120" font-size="18" fill="#888" text-anchor="middle">Ⅱ</text>
            <text id="scene2-quadrant-3" x="85" y="445" font-size="18" fill="#888" text-anchor="middle">Ⅲ</text>
            <text id="scene2-quadrant-4" x="715" y="445" font-size="18" fill="#888" text-anchor="middle">Ⅳ</text>
            <!-- Condition text (no box rect to avoid overlap) -->
            <text id="scene2-condition-text" x="205" y="40" font-size="15" fill="#333" text-anchor="middle" font-weight="bold">已知：a&lt;0，b&lt;0</text>
            <!-- Step 1: Line y=ax+b -->
            <g id="scene2-line-group" class="scene2-hidden">
                <line id="scene2-line" x1="160" y1="190" x2="620" y2="390" stroke="#c62828" stroke-width="2.5" />
                <circle cx="400" cy="294" r="4" fill="#c62828" />
                <circle cx="367" cy="280" r="4" fill="#c62828" />
            </g>
            <text id="scene2-line-label" class="scene2-hidden" x="95" y="145" font-size="16" fill="#c62828" font-weight="bold" text-anchor="end">y=ax+b</text>
            <!-- Step 2: Quadrant fills -->
            <g id="scene2-fill-group" class="scene2-hidden">
                <rect id="scene2-quadrant-fill-1" x="400" y="50" width="300" height="230" fill="#c62828" opacity="0.1" />
                <rect id="scene2-quadrant-fill-2" x="100" y="50" width="300" height="230" fill="#1565c0" opacity="0.15" />
                <rect id="scene2-quadrant-fill-3" x="100" y="280" width="300" height="150" fill="#1565c0" opacity="0.15" />
                <rect id="scene2-quadrant-fill-4" x="400" y="280" width="300" height="150" fill="#1565c0" opacity="0.15" />
            </g>
            <text id="scene2-not-pass-label" class="scene2-hidden" x="715" y="160" font-size="18" fill="#c62828" font-weight="bold" text-anchor="middle">不经过</text>
            <!-- Step 3: Conclusion (no box rect to avoid overlap) -->
            <text id="scene2-conclusion-text1" class="scene2-hidden" x="620" y="440" font-size="14" fill="#2e7d32" text-anchor="middle" font-weight="bold">一次函数 y=ax+b 的图象不经过第一象限</text>
            <text id="scene2-conclusion-text2" class="scene2-hidden" x="620" y="460" font-size="14" fill="#2e7d32" text-anchor="middle" font-weight="bold">答案：A. 第一象限</text>
        </svg>
        <div id="scene2-controls">
            <button id="scene2-btn-prev" disabled>◀ 上一步</button>
            <span id="scene2-step-indicator">步骤 0/3</span>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>
    <script>
    (function() { 'use strict';
        var currentStep = 0, totalSteps = 3;
        var btnPrev = document.getElementById('scene2-btn-prev');
        var btnNext = document.getElementById('scene2-btn-next');
        var stepIndicator = document.getElementById('scene2-step-indicator');
        var lineGroup = document.getElementById('scene2-line-group');
        var lineLabel = document.getElementById('scene2-line-label');
        var fillGroup = document.getElementById('scene2-fill-group');
        var notPassLabel = document.getElementById('scene2-not-pass-label');
        var conclusionText1 = document.getElementById('scene2-conclusion-text1');
        var conclusionText2 = document.getElementById('scene2-conclusion-text2');
        function show(el) { el.style.display = ''; el.classList.remove('scene2-hidden'); el.classList.add('scene2-visible'); }
        function hide(el) { el.style.display = 'none'; el.classList.remove('scene2-visible'); el.classList.add('scene2-hidden'); }
        function updateStep() {
            if (currentStep >= 1) { show(lineGroup); show(lineLabel); } else { hide(lineGroup); hide(lineLabel); }
            if (currentStep >= 2) { show(fillGroup); show(notPassLabel); } else { hide(fillGroup); hide(notPassLabel); }
            if (currentStep >= 3) { show(conclusionText1); show(conclusionText2); } else { hide(conclusionText1); hide(conclusionText2); }
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps);
            stepIndicator.textContent = '步骤 ' + currentStep + '/' + totalSteps;
        }
        btnPrev.addEventListener('click', function() { if (currentStep > 0) { currentStep--; updateStep(); } });
        btnNext.addEventListener('click', function() { if (currentStep < totalSteps) { currentStep++; updateStep(); } });
        updateStep();
    })();
    </script>
</body>
</html>
