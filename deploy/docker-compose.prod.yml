services:
  teacher-app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: teacher-app:latest
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      - ../.env:/app/.env:ro
      - app-data:/app/data
      - app-output:/app/output
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SERVER_PORT=8765
      - PYTHON=/usr/bin/python3

volumes:
  app-data:
  app-output:
