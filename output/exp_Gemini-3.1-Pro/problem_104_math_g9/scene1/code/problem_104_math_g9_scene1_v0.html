<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .math-panel { position: absolute; top: 80px; left: 520px; width: 260px; height: 350px; font-size: 16px; line-height: 1.6; }
        .hidden { opacity: 0; display: none; }
        .fade { transition: opacity 0.3s; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- Definitions -->
            <defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#000" />
                </marker>
            </defs>
            
            <!-- Highlights -->
            <polygon id="scene1-hl-b1oc1" points="50,261.4 50,400 130,400" fill="#1565c0" fill-opacity="0" stroke="#1565c0" stroke-width="0" />
            <polygon id="scene1-hl-d1e1c1" points="268.6,320 268.6,400 130,400" fill="#1565c0" fill-opacity="0" stroke="#1565c0" stroke-width="0" />
            <polygon id="scene1-hl-sq2" points="268.6,320 268.6,400 348.6,400 348.6,320" fill="#1565c0" fill-opacity="0" stroke="#1565c0" stroke-width="0" />
            <polygon id="scene1-hl-b2e2c2" points="348.6,320 348.6,400 394.8,400" fill="#1565c0" fill-opacity="0" stroke="#1565c0" stroke-width="0" />

            <!-- Axes -->
            <line x1="30" y1="400" x2="500" y2="400" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
            <line x1="50" y1="420" x2="50" y2="100" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
            <text x="490" y="420" font-size="16" font-style="italic">x</text>
            <text x="30" y="110" font-size="16" font-style="italic">y</text>

            <!-- Squares -->
            <polygon points="188.6,181.4 50,261.4 130,400 268.6,320" fill="#000" fill-opacity="0.1" stroke="#000" stroke-width="1" />
            <polygon points="268.6,320 268.6,400 348.6,400 348.6,320" fill="#000" fill-opacity="0.1" stroke="#000" stroke-width="1" />
            <polygon points="428.6,273.8 348.6,320 394.8,400 474.8,353.8" fill="#000" fill-opacity="0.1" stroke="#000" stroke-width="1" />

            <!-- Parallel lines highlight (Step 4) -->
            <line id="scene1-line-b1c1" x1="50" y1="261.4" x2="130" y2="400" stroke="#c62828" stroke-width="3" opacity="0" />
            <line id="scene1-line-b2c2" x1="348.6" y1="320" x2="394.8" y2="400" stroke="#c62828" stroke-width="3" opacity="0" />

            <!-- Angles -->
            <!-- C1B1O = 30 -->
            <path d="M 50 291.4 A 30 30 0 0 0 65 287.4" fill="none" stroke="#000" stroke-width="1.5" />
            <text x="75" y="280" font-size="14">30°</text>

            <!-- B1C1O = 60 (Step 1) -->
            <g id="scene1-ang-b1c1o" opacity="0">
                <path d="M 105 400 A 25 25 0 0 1 117.5 378.3" fill="none" stroke="#1565c0" stroke-width="1.5" id="scene1-arc-b1c1o" />
                <text x="85" y="375" font-size="14" fill="#1565c0" id="scene1-txt-b1c1o">60°</text>
            </g>

            <!-- D1C1E1 = 30 (Step 2) -->
            <g id="scene1-ang-d1c1e1" opacity="0">
                <path d="M 165 400 A 35 35 0 0 0 160.3 382.5" fill="none" stroke="#1565c0" stroke-width="1.5" />
                <text x="175" y="375" font-size="14" fill="#1565c0">30°</text>
                <!-- Right angle at C1 for square -->
                <polyline points="121.3,385 130,370 138.7,375" fill="none" stroke="#000" stroke-width="1" />
            </g>

            <!-- B2C2E2 = 60 (Step 4) -->
            <g id="scene1-ang-b2c2e2" opacity="0">
                <path d="M 369.8 400 A 25 25 0 0 1 382.3 378.3" fill="none" stroke="#1565c0" stroke-width="1.5" id="scene1-arc-b2c2e2" />
                <text x="350" y="375" font-size="14" fill="#1565c0" id="scene1-txt-b2c2e2">60°</text>
            </g>

            <!-- Labels -->
            <text x="35" y="415" font-size="16">O</text>
            <text x="25" y="261.4" font-size="16">B₁</text>
            <text x="125" y="420" font-size="16">C₁</text>
            <text x="245" y="305" font-size="16">D₁</text>
            <text x="188.6" y="170" font-size="16">A₁</text>
            <text x="263.6" y="420" font-size="16">E₁</text>
            <text x="343.6" y="420" font-size="16">E₂</text>
            <text x="325" y="305" font-size="16">B₂</text>
            <text x="390" y="420" font-size="16">C₂</text>
            <text x="480" y="353.8" font-size="16">D₂</text>
            <text x="428.6" y="260" font-size="16">A₂</text>

            <!-- Side lengths -->
            <text x="195" y="350" font-size="16">1</text>
            <text id="scene1-len-d1e1" x="280" y="365" font-size="16" fill="#1565c0" opacity="0">1/2</text>
            <text id="scene1-len-b2e2" x="305" y="365" font-size="16" fill="#1565c0" opacity="0">1/2</text>
            <text id="scene1-len-b2c2" x="360" y="340" font-size="16" fill="#1565c0" opacity="0">√3/3</text>

        </svg>
        
        <div class="math-panel" id="scene1-math-panel">
            <!-- MathJax content will be injected here -->
        </div>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 5;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const mathPanel = document.getElementById('scene1-math-panel');

        const elements = {
            hlB1OC1: document.getElementById('scene1-hl-b1oc1'),
            hlD1E1C1: document.getElementById('scene1-hl-d1e1c1'),
            hlSq2: document.getElementById('scene1-hl-sq2'),
            hlB2E2C2: document.getElementById('scene1-hl-b2e2c2'),
            angB1C1O: document.getElementById('scene1-ang-b1c1o'),
            angD1C1E1: document.getElementById('scene1-ang-d1c1e1'),
            angB2C2E2: document.getElementById('scene1-ang-b2c2e2'),
            lenD1E1: document.getElementById('scene1-len-d1e1'),
            lenB2E2: document.getElementById('scene1-len-b2e2'),
            lenB2C2: document.getElementById('scene1-len-b2c2'),
            lineB1C1: document.getElementById('scene1-line-b1c1'),
            lineB2C2: document.getElementById('scene1-line-b2c2'),
            arcB1C1O: document.getElementById('scene1-arc-b1c1o'),
            txtB1C1O: document.getElementById('scene1-txt-b1c1o'),
            arcB2C2E2: document.getElementById('scene1-arc-b2c2e2'),
            txtB2C2E2: document.getElementById('scene1-txt-b2c2e2')
        };

        const stepsMath = [
            `已知正方形 $A_1B_1C_1D_1$ 边长 $a_1 = 1$<br>$\angle C_1B_1O = 30^\circ$`,
            `在 $	ext{Rt}	riangle B_1OC_1$ 中：<br>$\angle B_1C_1O = 90^\circ - 30^\circ = 60^\circ$`,
            `$\angle B_1C_1D_1 = 90^\circ$<br>$	herefore \angle D_1C_1E_1 = 180^\circ - 90^\circ - 60^\circ = 30^\circ$<br>在 $	ext{Rt}	riangle D_1E_1C_1$ 中：<br>$D_1E_1 = C_1D_1 \cdot \sin 30^\circ = 1 	imes rac{1}{2} = rac{1}{2}$`,
            `正方形 $D_1E_1E_2B_2$ 的边长为 $rac{1}{2}$<br>即 $B_2E_2 = rac{1}{2}$`,
            `$ecause B_1C_1 \parallel B_2C_2$<br>$	herefore \angle B_2C_2E_2 = \angle B_1C_1O = 60^\circ$<br>在 $	ext{Rt}	riangle B_2E_2C_2$ 中：<br>$B_2C_2 = rac{B_2E_2}{\sin 60^\circ} = rac{1/2}{\sqrt{3}/2} = rac{\sqrt{3}}{3}$`,
            `同理可推得：<br>$a_2 = rac{\sqrt{3}}{3} a_1$<br>$a_3 = rac{\sqrt{3}}{3} a_2$<br>$\dots$<br>$a_n = (rac{\sqrt{3}}{3})^{n-1} a_1$<br>$	herefore a_{2016} = (rac{\sqrt{3}}{3})^{2015}$`
        ];

        function setOpacity(el, val) {
            if (el) el.style.opacity = val;
        }

        function setHighlight(el, active) {
            if (el) {
                el.setAttribute('fill-opacity', active ? '0.2' : '0');
                el.setAttribute('stroke-width', active ? '2' : '0');
            }
        }

        function renderStep() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;

            // Reset all
            setHighlight(elements.hlB1OC1, false);
            setHighlight(elements.hlD1E1C1, false);
            setHighlight(elements.hlSq2, false);
            setHighlight(elements.hlB2E2C2, false);
            
            setOpacity(elements.angB1C1O, currentStep >= 1 ? 1 : 0);
            setOpacity(elements.angD1C1E1, currentStep >= 2 ? 1 : 0);
            setOpacity(elements.lenD1E1, currentStep >= 2 ? 1 : 0);
            setOpacity(elements.lenB2E2, currentStep >= 3 ? 1 : 0);
            setOpacity(elements.angB2C2E2, currentStep >= 4 ? 1 : 0);
            setOpacity(elements.lenB2C2, currentStep >= 4 ? 1 : 0);
            setOpacity(elements.lineB1C1, currentStep >= 4 ? 1 : 0);
            setOpacity(elements.lineB2C2, currentStep >= 4 ? 1 : 0);

            // Colors for step 4
            if (currentStep >= 4) {
                elements.arcB1C1O.setAttribute('stroke', '#c62828');
                elements.txtB1C1O.setAttribute('fill', '#c62828');
                elements.arcB2C2E2.setAttribute('stroke', '#c62828');
                elements.txtB2C2E2.setAttribute('fill', '#c62828');
            } else {
                elements.arcB1C1O.setAttribute('stroke', '#1565c0');
                elements.txtB1C1O.setAttribute('fill', '#1565c0');
                elements.arcB2C2E2.setAttribute('stroke', '#1565c0');
                elements.txtB2C2E2.setAttribute('fill', '#1565c0');
            }

            // Highlights
            if (currentStep === 1) setHighlight(elements.hlB1OC1, true);
            if (currentStep === 2) setHighlight(elements.hlD1E1C1, true);
            if (currentStep === 3) setHighlight(elements.hlSq2, true);
            if (currentStep === 4) setHighlight(elements.hlB2E2C2, true);

            // MathJax
            mathPanel.innerHTML = stepsMath[currentStep];
            if (window.MathJax) {
                MathJax.typesetPromise([mathPanel]).catch(function (err) {
                    console.error(err.message);
                });
            }
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                renderStep();
            }
        });

        // Initial render
        renderStep();
    })();
    </script>
</body>
</html>
