<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisualSolver Scene</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:hover { background: #e9e9e9; }
        button:disabled { cursor: not-allowed; opacity: 0.5; }
        .scene1-text-box { position: absolute; top: 100px; left: 580px; width: 200px; font-size: 16px; line-height: 1.5; opacity: 0; transition: opacity 0.3s ease; }
        svg { position: absolute; top: 0; left: 0; }
        .scene1-transition { transition: all 0.3s ease; }
    </style>
    <!-- MathJax -->
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500">
            <!-- Polygons -->
            <polygon id="scene1-poly-aed" points="400,100 325,400 580,400" fill="#1565c0" fill-opacity="0" class="scene1-transition" />
            <polygon id="scene1-poly-aef" points="400,100 325,400 100,280" fill="#c62828" fill-opacity="0" class="scene1-transition" />

            <!-- Lines -->
            <line x1="400" y1="100" x2="100" y2="400" stroke="#000000" stroke-width="2" />
            <line x1="400" y1="100" x2="700" y2="400" stroke="#000000" stroke-width="2" />
            <line x1="100" y1="400" x2="700" y2="400" stroke="#000000" stroke-width="2" />
            <line id="scene1-line-ad" x1="400" y1="100" x2="580" y2="400" stroke="#000000" stroke-width="2" class="scene1-transition" />
            <line id="scene1-line-ae" x1="400" y1="100" x2="325" y2="400" stroke="#000000" stroke-width="2" class="scene1-transition" />
            <line id="scene1-line-af" x1="400" y1="100" x2="100" y2="280" stroke="#000000" stroke-width="2" class="scene1-transition" />
            <line id="scene1-line-ef" x1="325" y1="400" x2="100" y2="280" stroke="#000000" stroke-width="2" class="scene1-transition" />
            <line x1="100" y1="400" x2="100" y2="280" stroke="#000000" stroke-width="2" />
            <line id="scene1-line-de" x1="325" y1="400" x2="580" y2="400" stroke="#000000" stroke-width="2" class="scene1-transition" />

            <!-- Angle Markers -->
            <path d="M 385.86 114.14 L 400 128.28 L 414.14 114.14" fill="none" stroke="#000000" stroke-width="2" />
            <path id="scene1-angle-daf" d="M 410.29 117.15 L 393.14 127.44 L 382.85 110.29" fill="none" stroke="#000000" stroke-width="2" class="scene1-transition" />
            <path id="scene1-angle-dae" d="M 420.58 134.30 A 40 40 0 0 1 390.30 138.81" fill="none" stroke="#000000" stroke-width="2" class="scene1-transition" />
            <path id="scene1-angle-eaf" d="M 390.30 138.81 A 40 40 0 0 1 365.70 120.58" fill="none" stroke="#2e7d32" stroke-width="3" opacity="0" class="scene1-transition" />

            <!-- Angle Texts -->
            <text id="scene1-text-dae" x="425" y="155" font-size="14" fill="#000000" class="scene1-transition">45°</text>
            <text id="scene1-text-eaf" x="325" y="115" font-size="14" fill="#2e7d32" opacity="0" class="scene1-transition">45°</text>

            <!-- Tick Marks -->
            <g id="scene1-tick-ad" opacity="0" class="scene1-transition" stroke="#1565c0" stroke-width="2">
                <line x1="495.79" y1="249.93" x2="487.21" y2="255.07" />
                <line x1="492.79" y1="244.93" x2="484.21" y2="250.07" />
            </g>
            <g id="scene1-tick-af" opacity="0" class="scene1-transition" stroke="#c62828" stroke-width="2">
                <line x1="250.07" y1="195.79" x2="244.93" y2="187.21" />
                <line x1="255.07" y1="192.79" x2="249.93" y2="184.21" />
            </g>
            <g id="scene1-tick-de" opacity="0" class="scene1-transition" stroke="#1565c0" stroke-width="2">
                <line x1="452.5" y1="395" x2="452.5" y2="405" />
            </g>
            <g id="scene1-tick-ef" opacity="0" class="scene1-transition" stroke="#c62828" stroke-width="2">
                <line x1="210.15" y1="344.41" x2="214.85" y2="335.59" />
            </g>

            <!-- Vertices Labels -->
            <text x="395" y="90" font-size="16" fill="#000000">A</text>
            <text x="85" y="420" font-size="16" fill="#000000">B</text>
            <text x="705" y="420" font-size="16" fill="#000000">C</text>
            <text x="575" y="420" font-size="16" fill="#000000">D</text>
            <text x="320" y="420" font-size="16" fill="#000000">E</text>
            <text x="75" y="285" font-size="16" fill="#000000">F</text>
        </svg>

        <div id="scene1-text-box" class="scene1-text-box">
            <div id="scene1-text-content"></div>
        </div>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentState = 0;
        const maxState = 3;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const textBox = document.getElementById('scene1-text-box');
        const textContent = document.getElementById('scene1-text-content');

        const angleDaf = document.getElementById('scene1-angle-daf');
        const angleDae = document.getElementById('scene1-angle-dae');
        const angleEaf = document.getElementById('scene1-angle-eaf');
        const textDae = document.getElementById('scene1-text-dae');
        const textEaf = document.getElementById('scene1-text-eaf');

        const lineAd = document.getElementById('scene1-line-ad');
        const lineAe = document.getElementById('scene1-line-ae');
        const lineAf = document.getElementById('scene1-line-af');
        const lineEf = document.getElementById('scene1-line-ef');
        const lineDe = document.getElementById('scene1-line-de');

        const tickAd = document.getElementById('scene1-tick-ad');
        const tickAf = document.getElementById('scene1-tick-af');
        const tickDe = document.getElementById('scene1-tick-de');
        const tickEf = document.getElementById('scene1-tick-ef');

        const polyAed = document.getElementById('scene1-poly-aed');
        const polyAef = document.getElementById('scene1-poly-aef');

        function updateState() {
            btnPrev.disabled = currentState === 0;
            btnNext.disabled = currentState === maxState;

            // Reset all to state 0
            angleDaf.setAttribute('stroke', '#000000');
            angleDaf.setAttribute('stroke-width', '2');
            angleDae.setAttribute('stroke', '#000000');
            angleDae.setAttribute('stroke-width', '2');
            textDae.setAttribute('fill', '#000000');
            
            angleEaf.style.opacity = '0';
            textEaf.style.opacity = '0';
            
            lineAd.setAttribute('stroke', '#000000');
            lineAd.setAttribute('stroke-width', '2');
            lineAe.setAttribute('stroke', '#000000');
            lineAe.setAttribute('stroke-width', '2');
            lineAf.setAttribute('stroke', '#000000');
            lineAf.setAttribute('stroke-width', '2');
            lineEf.setAttribute('stroke', '#000000');
            lineEf.setAttribute('stroke-width', '2');
            lineDe.setAttribute('stroke', '#000000');
            lineDe.setAttribute('stroke-width', '2');

            tickAd.style.opacity = '0';
            tickAf.style.opacity = '0';
            tickDe.style.opacity = '0';
            tickEf.style.opacity = '0';

            polyAed.setAttribute('fill-opacity', '0');
            polyAef.setAttribute('fill-opacity', '0');

            textBox.style.opacity = '0';

            if (currentState >= 1) {
                angleDaf.setAttribute('stroke', '#2e7d32');
                angleDaf.setAttribute('stroke-width', '3');
                angleDae.setAttribute('stroke', '#2e7d32');
                angleDae.setAttribute('stroke-width', '3');
                textDae.setAttribute('fill', '#2e7d32');
                
                angleEaf.style.opacity = '1';
                textEaf.style.opacity = '1';

                textBox.style.opacity = '1';
                textContent.innerHTML = '因为 $\angle DAF = 90^\circ$<br>$\angle DAE = 45^\circ$<br>所以 $\angle EAF = 45^\circ$<br>即 $\angle DAE = \angle EAF$';
                if (window.MathJax) MathJax.typesetPromise([textContent]);
            }

            if (currentState >= 2) {
                lineAd.setAttribute('stroke', '#1565c0');
                lineAd.setAttribute('stroke-width', '3');
                lineAf.setAttribute('stroke', '#c62828');
                lineAf.setAttribute('stroke-width', '3');
                lineAe.setAttribute('stroke', '#2e7d32');
                lineAe.setAttribute('stroke-width', '3');

                tickAd.style.opacity = '1';
                tickAf.style.opacity = '1';

                textContent.innerHTML = '在 $	riangle AED$ 和 $	riangle AEF$ 中：<br>$AD = AF$ (已知)<br>$\angle DAE = \angle EAF$ (已证)<br>$AE = AE$ (公共边)';
                if (window.MathJax) MathJax.typesetPromise([textContent]);
            }

            if (currentState >= 3) {
                polyAed.setAttribute('fill-opacity', '0.2');
                polyAef.setAttribute('fill-opacity', '0.2');

                lineDe.setAttribute('stroke', '#1565c0');
                lineDe.setAttribute('stroke-width', '3');
                lineEf.setAttribute('stroke', '#c62828');
                lineEf.setAttribute('stroke-width', '3');

                tickDe.style.opacity = '1';
                tickEf.style.opacity = '1';

                textContent.innerHTML = '所以 $	riangle AED \cong 	riangle AEF$ (SAS)<br>从而得出：<br>$DE = EF$';
                if (window.MathJax) MathJax.typesetPromise([textContent]);
            }
        }

        btnPrev.addEventListener('click', () => {
            if (currentState > 0) {
                currentState--;
                updateState();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentState < maxState) {
                currentState++;
                updateState();
            }
        });

        // Initialize
        updateState();
    })();
    </script>
</body>
</html>
