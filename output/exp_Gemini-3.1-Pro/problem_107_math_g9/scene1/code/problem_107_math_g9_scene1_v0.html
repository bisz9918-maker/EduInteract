<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene1-text { font-size: 18px; fill: #000; user-select: none; }
        .scene1-bold { font-weight: bold; }
        .scene1-hidden { opacity: 0 !important; pointer-events: none; }
        .scene1-transition { transition: opacity 0.5s ease, stroke-width 0.5s ease, stroke 0.5s ease, fill 0.5s ease; }
        #scene1-conclusion { position: absolute; top: 390px; left: 50px; width: 700px; height: 50px; text-align: center; font-size: 18px; line-height: 25px; }
        
        @keyframes scene1-blink {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
        .scene1-blinking { animation: scene1-blink 1s linear 3; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <!-- Background Truss -->
            <g id="scene1-bg-truss" class="scene1-transition">
                <polygon points="54,350 400,150 746,350" fill="#fce4b6" stroke="#000000" stroke-width="2" />
                <line x1="400" y1="150" x2="400" y2="350" stroke="#000000" stroke-width="2" />
                <line x1="227" y1="250" x2="227" y2="350" stroke="#000000" stroke-width="2" />
                <line x1="573" y1="250" x2="573" y2="350" stroke="#000000" stroke-width="2" />
                <line x1="227" y1="250" x2="400" y2="350" stroke="#000000" stroke-width="2" />
                <line x1="573" y1="250" x2="400" y2="350" stroke="#000000" stroke-width="2" />
            </g>

            <!-- Core Geometry -->
            <polygon id="scene1-poly-abc" points="54,350 400,150 400,350" fill="none" stroke="none" stroke-width="3" class="scene1-transition" />
            <polygon id="scene1-poly-ade" points="54,350 227,250 227,350" fill="none" stroke="none" stroke-width="3" class="scene1-transition" />
            
            <g id="scene1-core-lines" class="scene1-transition">
                <line id="scene1-line-ab" x1="54" y1="350" x2="400" y2="150" stroke="transparent" stroke-width="3" class="scene1-transition" />
                <line id="scene1-line-bc" x1="400" y1="150" x2="400" y2="350" stroke="transparent" stroke-width="3" class="scene1-transition" />
                <line id="scene1-line-ac" x1="54" y1="350" x2="400" y2="350" stroke="transparent" stroke-width="3" class="scene1-transition" />
                <line id="scene1-line-de" x1="227" y1="250" x2="227" y2="350" stroke="transparent" stroke-width="3" class="scene1-transition" />
                <line id="scene1-line-ad" x1="54" y1="350" x2="227" y2="250" stroke="transparent" stroke-width="3" class="scene1-transition" />
            </g>

            <!-- Angle A -->
            <g id="scene1-angle-a" class="scene1-transition scene1-hidden">
                <path d="M 94 350 A 40 40 0 0 0 88.6 330" fill="none" stroke="#2e7d32" stroke-width="2" />
                <text x="105" y="340" class="scene1-text" fill="#2e7d32">30°</text>
            </g>

            <!-- Right Angle Symbols -->
            <g id="scene1-right-angles" class="scene1-transition scene1-hidden">
                <polyline points="385,350 385,335 400,335" fill="none" stroke="#2e7d32" stroke-width="2" />
                <polyline points="212,350 212,335 227,335" fill="none" stroke="#2e7d32" stroke-width="2" />
            </g>

            <!-- Equal Length Marks -->
            <g id="scene1-equal-marks" class="scene1-transition scene1-hidden">
                <!-- Midpoint of AD: (140.5, 300) -->
                <line x1="135.5" y1="291.3" x2="145.5" y2="308.7" stroke="#2e7d32" stroke-width="2" />
                <!-- Midpoint of DB: (313.5, 200) -->
                <line x1="308.5" y1="191.3" x2="318.5" y2="208.7" stroke="#2e7d32" stroke-width="2" />
            </g>

            <!-- Parallel Arrows -->
            <g id="scene1-parallel-arrows" class="scene1-transition scene1-hidden">
                <!-- On DE -->
                <polygon points="227,290 222,300 232,300" fill="#c62828" />
                <!-- On BC -->
                <polygon points="400,240 395,250 405,250" fill="#c62828" />
            </g>

            <!-- Labels -->
            <g id="scene1-labels" class="scene1-transition scene1-hidden">
                <text x="34" y="355" class="scene1-text">A</text>
                <text x="395" y="140" class="scene1-text">B</text>
                <text x="405" y="370" class="scene1-text">C</text>
                <text x="205" y="245" class="scene1-text">D</text>
                <text x="220" y="370" class="scene1-text">E</text>
            </g>

            <!-- Values -->
            <text id="scene1-val-8" x="180" y="200" class="scene1-text scene1-bold scene1-transition scene1-hidden">8</text>
            <text id="scene1-val-4-ad" x="125" y="285" class="scene1-text scene1-bold scene1-transition scene1-hidden" fill="#1565c0">4</text>
            <text id="scene1-val-4-bc" x="415" y="255" class="scene1-text scene1-bold scene1-transition scene1-hidden" fill="#c62828">4</text>

        </svg>

        <div id="scene1-conclusion"></div>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 4;
        
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        
        const bgTruss = document.getElementById('scene1-bg-truss');
        const labels = document.getElementById('scene1-labels');
        const angleA = document.getElementById('scene1-angle-a');
        const rightAngles = document.getElementById('scene1-right-angles');
        const equalMarks = document.getElementById('scene1-equal-marks');
        const val8 = document.getElementById('scene1-val-8');
        const val4ad = document.getElementById('scene1-val-4-ad');
        const val4bc = document.getElementById('scene1-val-4-bc');
        const polyAde = document.getElementById('scene1-poly-ade');
        const polyAbc = document.getElementById('scene1-poly-abc');
        const parallelArrows = document.getElementById('scene1-parallel-arrows');
        const conclusion = document.getElementById('scene1-conclusion');
        
        const lineAb = document.getElementById('scene1-line-ab');
        const lineBc = document.getElementById('scene1-line-bc');
        const lineAc = document.getElementById('scene1-line-ac');
        const lineDe = document.getElementById('scene1-line-de');
        const lineAd = document.getElementById('scene1-line-ad');
        
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        
        let isAnimating = false;
        let currentAnimationId = 0;

        async function typeWriter(text, element, animId) {
            element.innerHTML = '';
            let currentHTML = '';
            let i = 0;
            while (i < text.length) {
                if (animId !== currentAnimationId) return;
                if (text.substring(i, i+2) === '\(') {
                    let end = text.indexOf('\)', i);
                    currentHTML += text.substring(i, end+2);
                    i = end + 2;
                } else {
                    currentHTML += text[i];
                    i++;
                }
                element.innerHTML = currentHTML;
                if (window.MathJax) {
                    MathJax.typesetPromise([element]).catch(()=>{});
                }
                await sleep(30);
            }
        }

        async function updateStep(step) {
            isAnimating = true;
            currentAnimationId++;
            const animId = currentAnimationId;
            
            btnPrev.disabled = step === 0;
            btnNext.disabled = step === maxStep;
            
            // Reset all
            bgTruss.style.opacity = '1';
            labels.classList.add('scene1-hidden');
            angleA.classList.add('scene1-hidden');
            rightAngles.classList.add('scene1-hidden');
            equalMarks.classList.add('scene1-hidden');
            val8.classList.add('scene1-hidden');
            val4ad.classList.add('scene1-hidden');
            val4bc.classList.add('scene1-hidden');
            parallelArrows.classList.add('scene1-hidden');
            
            polyAde.setAttribute('fill', 'none');
            polyAbc.setAttribute('fill', 'none');
            
            lineAb.setAttribute('stroke', 'transparent');
            lineBc.setAttribute('stroke', 'transparent');
            lineAc.setAttribute('stroke', 'transparent');
            lineDe.setAttribute('stroke', 'transparent');
            lineAd.setAttribute('stroke', 'transparent');
            
            angleA.classList.remove('scene1-blinking');
            lineDe.classList.remove('scene1-blinking');
            lineBc.classList.remove('scene1-blinking');
            
            conclusion.innerHTML = '';
            
            if (step >= 1) {
                bgTruss.style.opacity = '0.2';
                labels.classList.remove('scene1-hidden');
                lineAb.setAttribute('stroke', '#000');
                lineBc.setAttribute('stroke', '#000');
                lineAc.setAttribute('stroke', '#000');
                lineDe.setAttribute('stroke', '#000');
            }
            
            if (step >= 2) {
                angleA.classList.remove('scene1-hidden');
                rightAngles.classList.remove('scene1-hidden');
                equalMarks.classList.remove('scene1-hidden');
                val8.classList.remove('scene1-hidden');
            }
            
            if (step === 3) {
                polyAde.setAttribute('fill', 'rgba(21, 101, 192, 0.2)');
                lineAd.setAttribute('stroke', '#1565c0');
                val4ad.classList.remove('scene1-hidden');
                
                angleA.classList.add('scene1-blinking');
                lineDe.classList.add('scene1-blinking');
                
                const text = "解法一：在 Rt\(\triangle ADE\) 中，\(\angle A=30^\circ\)，\(AD = \frac{1}{2} AB = 4\) \(\therefore DE = \frac{1}{2} AD = 2\)";
                typeWriter(text, conclusion, animId);
            }
            
            if (step === 4) {
                polyAbc.setAttribute('fill', 'rgba(198, 40, 40, 0.2)');
                val4bc.classList.remove('scene1-hidden');
                
                angleA.classList.add('scene1-blinking');
                lineBc.classList.add('scene1-blinking');
                
                lineDe.setAttribute('stroke', '#c62828');
                lineBc.setAttribute('stroke', '#c62828');
                parallelArrows.classList.remove('scene1-hidden');
                
                const text = "解法二：在 Rt\(\triangle ABC\) 中，\(BC = \frac{1}{2} AB = 4\)。\(\because DE\perp AC, BC\perp AC \therefore DE \parallel BC\)。又\(\because D\)是\(AB\)中点，\(\therefore DE\)是中位线 \(\therefore DE = \frac{1}{2} BC = 2\)";
                typeWriter(text, conclusion, animId);
            }
            
            isAnimating = false;
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateStep(currentStep);
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateStep(currentStep);
            }
        });

        updateStep(0);
    })();
    </script>
</body>
</html>
