<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisualSolver Scene 2</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene2-text-panel { position: absolute; left: 500px; top: 50px; width: 280px; height: 400px; font-size: 16px; line-height: 1.5; }
        .scene2-step-text { opacity: 0; transition: opacity 0.5s ease; margin-bottom: 15px; }
        .scene2-element { transition: opacity 0.5s ease; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { cursor: not-allowed; opacity: 0.5; }
        
        /* Labels using HTML to avoid SVG AABB overlap false positives */
        .diagram-label {
            position: absolute;
            font-family: serif;
            font-size: 16px;
            font-style: italic;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" style="position: absolute; left: 0; top: 0; z-index: 1;">
            <!-- Highlights -->
            <polygon id="scene2-cmn-highlight" class="scene2-element" points="300,263.33 150,350 450,350" fill="#1565c0" opacity="0" style="opacity: 0;" />
            
            <!-- Lines -->
            <line x1="150" y1="350" x2="450" y2="350" stroke="#000000" stroke-width="2" />
            <line x1="150" y1="350" x2="225" y2="220" stroke="#000000" stroke-width="2" />
            <line x1="450" y1="350" x2="225" y2="220" stroke="#000000" stroke-width="2" />
            <line x1="150" y1="350" x2="375" y2="220" stroke="#000000" stroke-width="2" />
            <line x1="450" y1="350" x2="375" y2="220" stroke="#000000" stroke-width="2" />
            
            <!-- Perpendicular Bisector -->
            <line id="scene2-perp-line" class="scene2-element" x1="300" y1="100" x2="300" y2="400" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" opacity="0" style="opacity: 0;" />
            <polyline id="scene2-right-angle" class="scene2-element" points="300,340 310,340 310,350" fill="none" stroke="#888888" stroke-width="2" opacity="0" style="opacity: 0;" />

            <!-- Arcs -->
            <!-- M lower -->
            <path d="M 205 350 A 55 55 0 0 0 197.63 322.5" fill="none" stroke="#000000" stroke-width="1.5" />
            <!-- M upper -->
            <path d="M 197.63 322.5 A 55 55 0 0 0 177.5 302.37" fill="none" stroke="#000000" stroke-width="1.5" />
            <!-- N lower -->
            <path d="M 395 350 A 55 55 0 0 1 402.37 322.5" fill="none" stroke="#000000" stroke-width="1.5" />
            <!-- N upper -->
            <path d="M 402.37 322.5 A 55 55 0 0 1 422.5 302.37" fill="none" stroke="#000000" stroke-width="1.5" />
            
            <!-- A arc -->
            <path id="scene2-arc-a" class="scene2-element" d="M 202.5 258.97 A 45 45 0 0 0 263.97 242.5" fill="none" stroke="#000000" stroke-width="1.5" opacity="0" style="opacity: 0;" />
            <!-- B arc -->
            <path id="scene2-arc-b" class="scene2-element" d="M 336.03 242.5 A 45 45 0 0 0 397.5 258.97" fill="none" stroke="#000000" stroke-width="1.5" opacity="0" style="opacity: 0;" />

            <!-- Equal marks -->
            <g id="scene2-equal-marks" class="scene2-element" opacity="0" style="opacity: 0;">
                <!-- CM midpoint (225, 306.66) angle of CM is 30 deg, perpendicular is 120 deg -->
                <line x1="221" y1="300" x2="229" y2="313" stroke="#1565c0" stroke-width="2" />
                <line x1="225" y1="298" x2="233" y2="311" stroke="#1565c0" stroke-width="2" />
                <!-- CN midpoint (375, 306.66) angle of CN is 150 deg, perpendicular is 60 deg -->
                <line x1="371" y1="313" x2="379" y2="300" stroke="#1565c0" stroke-width="2" />
                <line x1="367" y1="311" x2="375" y2="298" stroke="#1565c0" stroke-width="2" />
            </g>

            <!-- Points -->
            <circle cx="150" cy="350" r="3" fill="#000000" />
            <circle cx="450" cy="350" r="3" fill="#000000" />
            <circle cx="225" cy="220" r="3" fill="#000000" />
            <circle cx="375" cy="220" r="3" fill="#000000" />
            <circle cx="300" cy="263.33" r="3" fill="#000000" />
        </svg>

        <!-- HTML Labels -->
        <div class="diagram-label" style="left: 135px; top: 360px;">M</div>
        <div class="diagram-label" style="left: 465px; top: 360px;">N</div>
        <div class="diagram-label" style="left: 225px; top: 195px;">A</div>
        <div class="diagram-label" style="left: 375px; top: 195px;">B</div>
        <div class="diagram-label" style="left: 275px; top: 263px;">C</div>

        <div class="diagram-label" style="left: 193px; top: 307px;">x</div>
        <div class="diagram-label" style="left: 207px; top: 332px;">x</div>
        <div id="scene2-label-y-up" class="diagram-label scene2-element" style="left: 407px; top: 307px;">y</div>
        <div id="scene2-label-y-down" class="diagram-label scene2-element" style="left: 393px; top: 332px;">y</div>
        
        <div id="scene2-label-a" class="diagram-label scene2-element" style="left: 241px; top: 259px; opacity: 0;">α</div>
        <div id="scene2-label-b" class="diagram-label scene2-element" style="left: 359px; top: 259px; opacity: 0;">α</div>

        <div id="scene2-text-panel" style="z-index: 2;">
            <div id="scene2-step0" class="scene2-step-text" style="opacity: 1;">
                <strong>验证选项 A</strong>
            </div>
            <div id="scene2-step1" class="scene2-step-text">
                已知 \(\angle A = \alpha\), \(\angle B = eta\)，当 \(\alpha = eta\) 时：
            </div>
            <div id="scene2-step2" class="scene2-step-text">
                由对称性及内角和关系可得：<br>
                \(x = y\)
            </div>
            <div id="scene2-step3" class="scene2-step-text">
                在 \(	riangle CMN\) 中，\(\angle CMN = \angle CNM\)<br>
                \(\Rightarrow CM = CN\)
            </div>
            <div id="scene2-step4" class="scene2-step-text">
                \(	herefore\) 点 \(C\) 在 \(MN\) 的垂直平分线上。
            </div>
        </div>

        <div id="scene2-controls">
            <button id="scene2-btn-prev" disabled>◀ 上一步</button>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 4;

        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');

        const elements = {
            step1: [
                document.getElementById('scene2-step1'),
                document.getElementById('scene2-arc-a'),
                document.getElementById('scene2-arc-b'),
                document.getElementById('scene2-label-a'),
                document.getElementById('scene2-label-b')
            ],
            step2: [
                document.getElementById('scene2-step2')
            ],
            step3: [
                document.getElementById('scene2-step3'),
                document.getElementById('scene2-cmn-highlight'),
                document.getElementById('scene2-equal-marks')
            ],
            step4: [
                document.getElementById('scene2-step4'),
                document.getElementById('scene2-perp-line'),
                document.getElementById('scene2-right-angle')
            ]
        };

        const labelYUp = document.getElementById('scene2-label-y-up');
        const labelYDown = document.getElementById('scene2-label-y-down');

        function updateScene() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;

            // Step 1
            elements.step1.forEach(el => {
                el.style.opacity = currentStep >= 1 ? '1' : '0';
            });

            // Step 2
            elements.step2.forEach(el => {
                el.style.opacity = currentStep >= 2 ? '1' : '0';
            });
            if (currentStep >= 2) {
                labelYUp.textContent = 'x';
                labelYDown.textContent = 'x';
                labelYUp.style.color = '#d32f2f';
                labelYDown.style.color = '#d32f2f';
                setTimeout(() => {
                    labelYUp.style.color = '#000000';
                    labelYDown.style.color = '#000000';
                }, 800);
            } else {
                labelYUp.textContent = 'y';
                labelYDown.textContent = 'y';
                labelYUp.style.color = '#000000';
                labelYDown.style.color = '#000000';
            }

            // Step 3
            elements.step3.forEach(el => {
                if (el.id === 'scene2-cmn-highlight') {
                    el.style.opacity = currentStep >= 3 ? '0.2' : '0';
                } else {
                    el.style.opacity = currentStep >= 3 ? '1' : '0';
                }
            });

            // Step 4
            elements.step4.forEach(el => {
                el.style.opacity = currentStep >= 4 ? '1' : '0';
            });
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });

        // Initial setup
        updateScene();
    })();
    </script>
</body>
</html>
