<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>受力分析与二力平衡</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button:hover:not(:disabled) { background: #e9e9e9; }
        
        .scene2-element { transition: opacity 0.3s ease; }
        .scene2-hidden { opacity: 0 !important; pointer-events: none; }
        
        #scene2-text-area {
            position: absolute;
            top: 390px;
            left: 100px;
            width: 600px;
            height: 40px;
            text-align: center;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        @keyframes scene2-blink {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
        .scene2-blinking {
            animation: scene2-blink 1s infinite;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500">
            <defs>
                <marker id="scene2-arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0" />
                </marker>
                <marker id="scene2-arrow-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#888888" />
                </marker>
                <marker id="scene2-arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828" />
                </marker>
                <marker id="scene2-arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32" />
                </marker>
                <pattern id="scene2-hatch" patternUnits="userSpaceOnUse" width="10" height="10">
                    <path d="M-1,1 l2,-2 M0,10 l10,-10 M9,11 l2,-2" stroke="#000" stroke-width="1"/>
                </pattern>
            </defs>

            <!-- 桌面 -->
            <line x1="100" y1="350" x2="700" y2="350" stroke="#000" stroke-width="2" />
            <rect x="100" y="350" width="600" height="10" fill="url(#scene2-hatch)" />

            <!-- 左容器 -->
            <polygon id="scene2-left-liquid" points="185,250 315,250 300,350 200,350" fill="#bdbdbd" stroke="none" class="scene2-element" />
            <polygon id="scene2-left-overall" points="170,150 330,150 300,350 200,350" fill="#888888" fill-opacity="0.2" stroke="none" class="scene2-element scene2-hidden" />
            <polygon points="170,150 330,150 300,350 200,350" fill="none" stroke="#000" stroke-width="2" />
            <line x1="185" y1="250" x2="315" y2="250" stroke="#000" stroke-width="1" id="scene2-left-liquid-line" class="scene2-element" />

            <!-- 右容器 -->
            <polygon id="scene2-right-liquid" points="485,250 615,250 630,350 470,350" fill="#bdbdbd" stroke="none" class="scene2-element" />
            <polygon id="scene2-right-overall" points="500,150 600,150 630,350 470,350" fill="#888888" fill-opacity="0.2" stroke="none" class="scene2-element scene2-hidden" />
            <polygon points="500,150 600,150 630,350 470,350" fill="none" stroke="#000" stroke-width="2" />
            <line x1="485" y1="250" x2="615" y2="250" stroke="#000" stroke-width="1" id="scene2-right-liquid-line" class="scene2-element" />

            <!-- 速度向量 -->
            <g id="scene2-vel-left" class="scene2-element">
                <line x1="250" y1="120" x2="310" y2="120" stroke="#1565c0" stroke-width="2" marker-end="url(#scene2-arrow-blue)" />
                <text x="280" y="95" fill="#1565c0" font-size="16" font-style="italic" text-anchor="middle">v</text>
                <path id="scene2-cross-left" d="M 270 100 L 290 120 M 290 100 L 270 120" stroke="#c62828" stroke-width="3" class="scene2-element scene2-hidden" />
            </g>
            <g id="scene2-vel-right" class="scene2-element">
                <line x1="550" y1="120" x2="630" y2="120" stroke="#1565c0" stroke-width="2" marker-end="url(#scene2-arrow-blue)" />
                <text x="590" y="95" fill="#1565c0" font-size="16" font-style="italic" text-anchor="middle">2v</text>
                <path id="scene2-cross-right" d="M 580 100 L 600 120 M 600 100 L 580 120" stroke="#c62828" stroke-width="3" class="scene2-element scene2-hidden" />
            </g>

            <!-- 竖直方向受力 (Step 1) -->
            <g id="scene2-forces-vertical" class="scene2-element scene2-hidden">
                <!-- 左侧 -->
                <line x1="250" y1="250" x2="250" y2="330" stroke="#888888" stroke-width="2" marker-end="url(#scene2-arrow-grey)" />
                <text x="160" y="300" fill="#888888" font-size="16" text-anchor="end">G<tspan dy="5" font-size="12">总</tspan></text>
                
                <line x1="250" y1="250" x2="250" y2="170" stroke="#888888" stroke-width="2" marker-end="url(#scene2-arrow-grey)" />
                <text x="160" y="200" fill="#888888" font-size="16" text-anchor="end">N</text>

                <!-- 右侧 -->
                <line x1="550" y1="250" x2="550" y2="330" stroke="#888888" stroke-width="2" marker-end="url(#scene2-arrow-grey)" />
                <text x="640" y="300" fill="#888888" font-size="16" text-anchor="start">G<tspan dy="5" font-size="12">总</tspan></text>
                
                <line x1="550" y1="250" x2="550" y2="170" stroke="#888888" stroke-width="2" marker-end="url(#scene2-arrow-grey)" />
                <text x="640" y="200" fill="#888888" font-size="16" text-anchor="start">N</text>
                
                <!-- 重心点 -->
                <circle cx="250" cy="250" r="3" fill="#888888" />
                <circle cx="550" cy="250" r="3" fill="#888888" />
            </g>

            <!-- 摩擦力 (Step 2) -->
            <g id="scene2-forces-friction" class="scene2-element scene2-hidden">
                <!-- 左侧 -->
                <line id="scene2-vec-f1" x1="250" y1="348" x2="170" y2="348" stroke="#c62828" stroke-width="2" marker-end="url(#scene2-arrow-red)" />
                <text x="160" y="343" fill="#c62828" font-size="16" font-style="italic" text-anchor="end">f<tspan dy="5" font-size="12">1</tspan></text>
                
                <!-- 右侧 -->
                <line id="scene2-vec-f2" x1="550" y1="348" x2="470" y2="348" stroke="#c62828" stroke-width="2" marker-end="url(#scene2-arrow-red)" />
                <text x="460" y="343" fill="#c62828" font-size="16" font-style="italic" text-anchor="end">f<tspan dy="5" font-size="12">2</tspan></text>
            </g>

            <!-- 拉力 (Step 3) -->
            <g id="scene2-forces-pull" class="scene2-element scene2-hidden">
                <!-- 左侧 -->
                <line id="scene2-vec-F1" x1="315" y1="250" x2="395" y2="250" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene2-arrow-green)" />
                <text x="355" y="240" fill="#2e7d32" font-size="16" font-style="italic" text-anchor="middle">F<tspan dy="5" font-size="12">1</tspan></text>
                
                <!-- 右侧 -->
                <line id="scene2-vec-F2" x1="615" y1="250" x2="695" y2="250" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene2-arrow-green)" />
                <text x="655" y="240" fill="#2e7d32" font-size="16" font-style="italic" text-anchor="middle">F<tspan dy="5" font-size="12">2</tspan></text>
            </g>
        </svg>

        <div id="scene2-text-area"></div>

        <div id="scene2-controls">
            <button id="scene2-btn-prev" disabled>◀ 上一步</button>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 3;

        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        const textArea = document.getElementById('scene2-text-area');

        const els = {
            leftLiquid: document.getElementById('scene2-left-liquid'),
            leftLiquidLine: document.getElementById('scene2-left-liquid-line'),
            leftOverall: document.getElementById('scene2-left-overall'),
            rightLiquid: document.getElementById('scene2-right-liquid'),
            rightLiquidLine: document.getElementById('scene2-right-liquid-line'),
            rightOverall: document.getElementById('scene2-right-overall'),
            forcesVertical: document.getElementById('scene2-forces-vertical'),
            forcesFriction: document.getElementById('scene2-forces-friction'),
            forcesPull: document.getElementById('scene2-forces-pull'),
            velLeft: document.getElementById('scene2-vel-left'),
            velRight: document.getElementById('scene2-vel-right'),
            crossLeft: document.getElementById('scene2-cross-left'),
            crossRight: document.getElementById('scene2-cross-right'),
            vecF1: document.getElementById('scene2-vec-F1'),
            vecF2: document.getElementById('scene2-vec-F2'),
            vecf1: document.getElementById('scene2-vec-f1'),
            vecf2: document.getElementById('scene2-vec-f2')
        };

        function show(el) {
            if(el) el.classList.remove('scene2-hidden');
        }

        function hide(el) {
            if(el) el.classList.add('scene2-hidden');
        }

        function updateScene() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;

            // Reset blinking
            els.vecF1.parentNode.classList.remove('scene2-blinking');
            els.vecf1.parentNode.classList.remove('scene2-blinking');

            if (currentStep >= 1) {
                hide(els.leftLiquid);
                hide(els.leftLiquidLine);
                show(els.leftOverall);
                hide(els.rightLiquid);
                hide(els.rightLiquidLine);
                show(els.rightOverall);
                show(els.forcesVertical);
            } else {
                show(els.leftLiquid);
                show(els.leftLiquidLine);
                hide(els.leftOverall);
                show(els.rightLiquid);
                show(els.rightLiquidLine);
                hide(els.rightOverall);
                hide(els.forcesVertical);
            }

            if (currentStep >= 2) {
                show(els.forcesFriction);
            } else {
                hide(els.forcesFriction);
            }

            if (currentStep >= 3) {
                show(els.forcesPull);
                els.velLeft.style.opacity = '0.3';
                els.velRight.style.opacity = '0.3';
                show(els.crossLeft);
                show(els.crossRight);
                
                els.forcesPull.classList.add('scene2-blinking');
                els.forcesFriction.classList.add('scene2-blinking');
            } else {
                hide(els.forcesPull);
                els.velLeft.style.opacity = '1';
                els.velRight.style.opacity = '1';
                hide(els.crossLeft);
                hide(els.crossRight);
                
                els.forcesPull.classList.remove('scene2-blinking');
                els.forcesFriction.classList.remove('scene2-blinking');
            }

            // Update text
            let textHtml = '';
            if (currentStep === 1) {
                textHtml = '竖直方向受力平衡：\( G_{总} = N \)';
            } else if (currentStep === 2) {
                textHtml = '压力相同、接触面相同 \(\Rightarrow f_1 = f_2\)';
            } else if (currentStep === 3) {
                textHtml = '匀速直线运动 \(\Rightarrow\) 二力平衡 \(\Rightarrow F_1 = f_1, F_2 = f_2 \Rightarrow F_1 = F_2\)';
            }
            
            textArea.innerHTML = textHtml;
            if (window.MathJax && currentStep > 0) {
                MathJax.typesetPromise([textArea]);
            }
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });

        // Initial render
        updateScene();
    })();
    </script>
</body>
</html>
