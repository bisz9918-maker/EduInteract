<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>凸透镜成像规律</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 20px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 15px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-step-text { font-size: 14px; font-weight: bold; min-width: 150px; text-align: center; }
        
        .axis-line { stroke: #000; stroke-width: 2; }
        .lens { fill: none; stroke: #000; stroke-width: 2; }
        .lens-axis { stroke: #000; stroke-width: 1; stroke-dasharray: 4,4; }
        .point { fill: #000; }
        .label { font-size: 14px; fill: #000; text-anchor: middle; }
        
        .candle-body { fill: #e53935; stroke: #b71c1c; stroke-width: 1; }
        .candle-flame { fill: #ff9800; }
        
        .image-body { fill: #e53935; stroke: #b71c1c; stroke-width: 1; opacity: 0.7; }
        .image-flame { fill: #ff9800; opacity: 0.7; }
        
        .screen-poly { fill: #eeeeee; stroke: #000; stroke-width: 1.5; }
        .screen-stand { stroke: #000; stroke-width: 2; }
        
        .ray { fill: none; stroke: #1565c0; stroke-width: 1.5; }
        .ray-arrow { fill: #1565c0; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <defs>
                <marker id="scene1-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" class="ray-arrow" />
                </marker>
            </defs>

            <!-- Main Axis -->
            <line class="axis-line" x1="50" y1="300" x2="750" y2="300" />
            
            <!-- Lens -->
            <ellipse class="lens" cx="400" cy="300" rx="12" ry="70" />
            <line class="lens-axis" x1="400" y1="220" x2="400" y2="380" />
            <text class="label" x="400" y="210">凸透镜</text>
            
            <!-- Points -->
            <circle class="point" cx="400" cy="300" r="3" />
            <text class="label" x="380" y="320">O</text>
            
            <circle class="point" cx="310" cy="300" r="3" />
            <text class="label" x="310" y="320">F</text>
            
            <circle class="point" cx="220" cy="300" r="3" />
            <text class="label" x="220" y="320">2F</text>
            
            <circle class="point" cx="490" cy="300" r="3" />
            <text class="label" x="500" y="280">F</text>
            
            <circle class="point" cx="580" cy="300" r="3" />
            <text class="label" x="580" y="280">2F</text>
            
            <!-- Screen -->
            <g id="scene1-screen-group">
                <line class="screen-stand" x1="535" y1="250" x2="535" y2="300" />
                <polygon class="screen-poly" points="515,150 555,130 555,230 515,250" />
                <text class="label" id="scene1-screen-label" x="535" y="115">光屏</text>
            </g>
            
            <!-- Rays -->
            <line id="scene1-ray1-seg1" class="ray" />
            <line id="scene1-ray1-seg2a" class="ray" />
            <line id="scene1-ray1-seg2b" class="ray" marker-end="url(#scene1-arrow)" />
            
            <line id="scene1-ray2-seg1" class="ray" />
            <line id="scene1-ray2-seg2" class="ray" marker-end="url(#scene1-arrow)" />
            
            <!-- Candle (Object) -->
            <g id="scene1-candle-group">
                <rect class="candle-body" x="125" y="240" width="10" height="60" />
                <path class="candle-flame" d="M 130 240 Q 125 230 130 225 Q 135 230 130 240" />
                <text class="label" id="scene1-candle-label" x="130" y="215">蜡烛</text>
            </g>
            
            <!-- Image -->
            <g id="scene1-image-group">
                <rect class="image-body" x="530" y="300" width="10" height="30" />
                <path class="image-flame" d="M 535 330 Q 530 340 535 345 Q 540 340 535 330" />
            </g>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <span id="scene1-step-text">步骤 0/2: 初始状态</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        const states = [
            {
                step: 0,
                text: "步骤 0/2: 初始状态",
                candleX: 130,
                candleH: 60,
                screenX: 535,
                imageX: 535,
                imageH: 30
            },
            {
                step: 1,
                text: "步骤 1/2: 蜡烛变短",
                candleX: 130,
                candleH: 30,
                screenX: 535,
                imageX: 535,
                imageH: 15
            },
            {
                step: 2,
                text: "步骤 2/2: 物距减小",
                candleX: 265,
                candleH: 60,
                screenX: 670,
                imageX: 670,
                imageH: 120
            }
        ];
        
        let currentStep = 0;
        
        const candleBody = d3.select(".candle-body");
        const candleFlame = d3.select(".candle-flame");
        const candleLabel = d3.select("#scene1-candle-label");
        
        const imageBody = d3.select(".image-body");
        const imageFlame = d3.select(".image-flame");
        
        const screenStand = d3.select(".screen-stand");
        const screenPoly = d3.select(".screen-poly");
        const screenLabel = d3.select("#scene1-screen-label");
        
        const ray1Seg1 = d3.select("#scene1-ray1-seg1");
        const ray1Seg2a = d3.select("#scene1-ray1-seg2a");
        const ray1Seg2b = d3.select("#scene1-ray1-seg2b");
        
        const ray2Seg1 = d3.select("#scene1-ray2-seg1");
        const ray2Seg2 = d3.select("#scene1-ray2-seg2");
        
        const btnPrev = document.getElementById("scene1-btn-prev");
        const btnNext = document.getElementById("scene1-btn-next");
        const stepText = document.getElementById("scene1-step-text");
        
        function updateScene(stepIndex, duration = 1000) {
            const state = states[stepIndex];
            
            btnPrev.disabled = stepIndex === 0;
            btnNext.disabled = stepIndex === states.length - 1;
            stepText.textContent = state.text;
            
            const t = d3.transition().duration(duration).ease(d3.easeCubicInOut);
            
            const cx = state.candleX;
            const cy = 300 - state.candleH;
            const ix = state.imageX;
            const iy = 300 + state.imageH;
            
            // Candle
            candleBody.transition(t)
                .attr("x", cx - 5)
                .attr("y", cy)
                .attr("height", state.candleH);
                
            candleFlame.transition(t)
                .attr("d", `M ${cx} ${cy} Q ${cx - 5} ${cy - 10} ${cx} ${cy - 15} Q ${cx + 5} ${cy - 10} ${cx} ${cy}`);
                
            candleLabel.transition(t)
                .attr("x", cx)
                .attr("y", cy - 25);
                
            // Screen
            screenStand.transition(t)
                .attr("x1", state.screenX)
                .attr("x2", state.screenX);
                
            screenPoly.transition(t)
                .attr("points", `${state.screenX - 20},150 ${state.screenX + 20},130 ${state.screenX + 20},230 ${state.screenX - 20},250`);
                
            screenLabel.transition(t)
                .attr("x", state.screenX);
                
            // Image
            imageBody.transition(t)
                .attr("x", ix - 5)
                .attr("y", 300)
                .attr("height", state.imageH);
                
            imageFlame.transition(t)
                .attr("d", `M ${ix} ${iy} Q ${ix - 5} ${iy + 10} ${ix} ${iy + 15} Q ${ix + 5} ${iy + 10} ${ix} ${iy}`);
                
            // Rays
            ray1Seg1.transition(t)
                .attr("x1", cx).attr("y1", cy)
                .attr("x2", 400).attr("y2", cy);
                
            ray1Seg2a.transition(t)
                .attr("x1", 400).attr("y1", cy)
                .attr("x2", 490).attr("y2", 300);
                
            const r1dx = ix - 490;
            const r1dy = iy - 300;
            const r1len = Math.sqrt(r1dx*r1dx + r1dy*r1dy);
            const extX1 = ix + (r1dx/r1len)*30;
            const extY1 = iy + (r1dy/r1len)*30;
            
            ray1Seg2b.transition(t)
                .attr("x1", 490).attr("y1", 300)
                .attr("x2", extX1).attr("y2", extY1);
                
            ray2Seg1.transition(t)
                .attr("x1", cx).attr("y1", cy)
                .attr("x2", 400).attr("y2", 300);
                
            const r2dx = ix - 400;
            const r2dy = iy - 300;
            const r2len = Math.sqrt(r2dx*r2dx + r2dy*r2dy);
            const extX2 = ix + (r2dx/r2len)*30;
            const extY2 = iy + (r2dy/r2len)*30;
            
            ray2Seg2.transition(t)
                .attr("x1", 400).attr("y1", 300)
                .attr("x2", extX2).attr("y2", extY2);
        }
        
        btnPrev.addEventListener("click", () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene(currentStep);
            }
        });
        
        btnNext.addEventListener("click", () => {
            if (currentStep < states.length - 1) {
                currentStep++;
                updateScene(currentStep);
            }
        });
        
        // Initialize
        updateScene(0, 0);
        
    })();
    </script>
</body>
</html>
