<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f0f0f0; border-radius: 4px; }
        button.active { background: #1565c0; color: white; border-color: #1565c0; }
        .text-label { font-size: 14px; fill: #000; }
        .title { font-size: 20px; font-weight: bold; fill: #000; text-anchor: middle; }
        .desc-text { font-size: 16px; fill: #000; text-anchor: middle; }
        .eye-icon { fill: none; stroke: #000; stroke-width: 2; }
        .eye-pupil { fill: #000; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500">
            <defs>
                <marker id="scene2-arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0" />
                </marker>
                <marker id="scene2-arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828" />
                </marker>
                <g id="scene2-eye-template">
                    <path class="eye-icon" d="M -15 0 Q 0 -10 15 0 Q 0 10 -15 0 Z" />
                    <circle class="eye-pupil" cx="0" cy="0" r="4" />
                </g>
            </defs>

            <!-- 标题 -->
            <text x="400" y="45" class="title">光屏表面的漫反射与镜面反射对比</text>

            <!-- 共同元素：入射光线 -->
            <g id="scene2-incident-rays">
                <line x1="100" y1="150" x2="250" y2="350" stroke="#1565c0" stroke-width="2" marker-end="url(#scene2-arrow-blue)" />
                <line x1="175" y1="150" x2="325" y2="350" stroke="#1565c0" stroke-width="2" marker-end="url(#scene2-arrow-blue)" />
                <line x1="250" y1="150" x2="400" y2="350" stroke="#1565c0" stroke-width="2" marker-end="url(#scene2-arrow-blue)" />
                <line x1="325" y1="150" x2="475" y2="350" stroke="#1565c0" stroke-width="2" marker-end="url(#scene2-arrow-blue)" />
                <line x1="400" y1="150" x2="550" y2="350" stroke="#1565c0" stroke-width="2" marker-end="url(#scene2-arrow-blue)" />
                <text x="150" y="110" class="text-label" text-anchor="middle">平行入射光线</text>
            </g>

            <!-- 状态1：镜面反射 -->
            <g id="scene2-state1">
                <!-- 表面 -->
                <line x1="150" y1="350" x2="650" y2="350" stroke="#000" stroke-width="2" />
                <text x="660" y="355" class="text-label" dominant-baseline="middle">光滑表面</text>

                <!-- 反射光线 -->
                <line x1="250" y1="350" x2="437.5" y2="100" stroke="#c62828" stroke-width="2" marker-end="url(#scene2-arrow-red)" />
                <line x1="325" y1="350" x2="512.5" y2="100" stroke="#c62828" stroke-width="2" marker-end="url(#scene2-arrow-red)" />
                <line x1="400" y1="350" x2="587.5" y2="100" stroke="#c62828" stroke-width="2" marker-end="url(#scene2-arrow-red)" />
                <line x1="475" y1="350" x2="662.5" y2="100" stroke="#c62828" stroke-width="2" marker-end="url(#scene2-arrow-red)" />
                <line x1="550" y1="350" x2="737.5" y2="100" stroke="#c62828" stroke-width="2" marker-end="url(#scene2-arrow-red)" />

                <!-- 眼睛 -->
                <use href="#scene2-eye-template" x="587.5" y="80" transform="rotate(36.87, 587.5, 80)" />
                <text x="587.5" y="65" class="text-label" text-anchor="middle">能看到光</text>
                
                <use href="#scene2-eye-template" x="350" y="120" transform="rotate(36.87, 350, 120)" opacity="0.3" />
                <text x="350" y="100" class="text-label" text-anchor="middle" fill="#666">看不到光</text>

                <!-- 说明文字 -->
                <text x="400" y="410" class="desc-text">镜面反射：只能在特定方向观察到</text>
            </g>

            <!-- 状态2：漫反射 -->
            <g id="scene2-state2" style="display: none; opacity: 0;">
                <!-- 表面 -->
                <path d="M 150 350 L 175 350 L 200 340 L 225 360 L 250 350 L 275 340 L 300 350 L 325 350 L 350 350 L 375 360 L 400 350 L 425 340 L 450 360 L 475 350 L 500 340 L 525 340 L 550 350 L 575 360 L 600 350 L 625 350 L 650 350" fill="none" stroke="#000" stroke-width="2" />
                <text x="660" y="355" class="text-label" dominant-baseline="middle">粗糙表面</text>

                <!-- 反射光线 -->
                <line x1="250" y1="350" x2="75" y2="175" stroke="#c62828" stroke-width="2" marker-end="url(#scene2-arrow-red)" />
                <line x1="325" y1="350" x2="475" y2="150" stroke="#c62828" stroke-width="2" marker-end="url(#scene2-arrow-red)" />
                <line x1="400" y1="350" x2="350" y2="100" stroke="#c62828" stroke-width="2" marker-end="url(#scene2-arrow-red)" />
                <line x1="475" y1="350" x2="475" y2="150" stroke="#c62828" stroke-width="2" marker-end="url(#scene2-arrow-red)" />
                <line x1="550" y1="350" x2="700" y2="250" stroke="#c62828" stroke-width="2" marker-end="url(#scene2-arrow-red)" />

                <!-- 眼睛 -->
                <use href="#scene2-eye-template" x="75" y="175" transform="rotate(-45, 75, 175)" />
                <text x="75" y="145" class="text-label" text-anchor="middle">能看到</text>
                
                <use href="#scene2-eye-template" x="475" y="130" transform="rotate(90, 475, 130)" />
                <text x="475" y="100" class="text-label" text-anchor="middle">能看到</text>
                
                <use href="#scene2-eye-template" x="720" y="237" transform="rotate(33.69, 720, 237)" />
                <text x="720" y="207" class="text-label" text-anchor="middle">能看到</text>

                <!-- 说明文字 -->
                <text x="400" y="410" class="desc-text">漫反射：可以从不同方向观察到</text>
            </g>
        </svg>

        <div id="scene2-controls">
            <button id="scene2-btn-state1" class="active">状态1：光滑玻璃板 (镜面反射)</button>
            <button id="scene2-btn-state2">状态2：粗糙光屏 (漫反射)</button>
        </div>
    </div>
    <script>
    (function() {
        const btnState1 = document.getElementById('scene2-btn-state1');
        const btnState2 = document.getElementById('scene2-btn-state2');
        const state1Group = document.getElementById('scene2-state1');
        const state2Group = document.getElementById('scene2-state2');

        function show(el) {
            el.style.display = 'block';
            // 强制重绘以确保过渡效果（如果后续添加）
            el.offsetHeight; 
            el.style.opacity = '1';
        }

        function hide(el) {
            el.style.opacity = '0';
            el.style.display = 'none';
        }

        btnState1.addEventListener('click', () => {
            btnState1.classList.add('active');
            btnState2.classList.remove('active');
            show(state1Group);
            hide(state2Group);
        });

        btnState2.addEventListener('click', () => {
            btnState2.classList.add('active');
            btnState1.classList.remove('active');
            show(state2Group);
            hide(state1Group);
        });
    })();
    </script>
</body>
</html>
