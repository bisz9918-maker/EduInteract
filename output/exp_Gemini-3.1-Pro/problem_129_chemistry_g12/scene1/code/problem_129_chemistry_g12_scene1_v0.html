<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .scene1-text { font-size: 14px; font-family: sans-serif; }
        .scene1-math { font-size: 14px; }
        
        /* Animations */
        @keyframes scene1-slideInRight {
            from { transform: translateX(-20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes scene1-slideInLeft {
            from { transform: translateX(20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes scene1-slideOutRight {
            from { transform: translateX(0); opacity: 0; }
            to { transform: translateX(20px); opacity: 1; }
        }
        @keyframes scene1-slideOutLeft {
            from { transform: translateX(0); opacity: 0; }
            to { transform: translateX(-20px); opacity: 1; }
        }
        
        .scene1-anim-slideInRight { animation: scene1-slideInRight 0.5s forwards; }
        .scene1-anim-slideInLeft { animation: scene1-slideInLeft 0.5s forwards; }
        .scene1-anim-slideOutRight { animation: scene1-slideOutRight 0.5s forwards; }
        .scene1-anim-slideOutLeft { animation: scene1-slideOutLeft 0.5s forwards; }
        
        .scene1-step-el { transition: opacity 0.3s; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <defs>
                <marker id="scene1-arrow-black" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
                </marker>
                <marker id="scene1-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828" />
                </marker>
            </defs>
            
            <!-- Electrolyte -->
            <rect x="300" y="170" width="200" height="200" fill="#e3f2fd" opacity="0.5" />
            <text x="400" y="395" text-anchor="middle" class="scene1-text" fill="#888888">H₂SO₄</text>
            
            <!-- Container -->
            <path d="M 300 150 L 300 180 L 250 180 L 250 210 L 300 210 L 300 330 L 250 330 L 250 360 L 300 360 L 300 370 L 500 370 L 500 360 L 550 360 L 550 330 L 500 330 L 500 210 L 550 210 L 550 180 L 500 180 L 500 150" fill="none" stroke="#000000" stroke-width="2" />
            
            <!-- Electrodes -->
            <rect x="330" y="160" width="30" height="210" fill="#888888" opacity="0.3" stroke="#888888" />
            <rect x="440" y="160" width="30" height="210" fill="#888888" opacity="0.3" stroke="#888888" />
            <text x="325" y="145" text-anchor="end" class="scene1-text" fill="#888888">A</text>
            <text x="475" y="145" text-anchor="start" class="scene1-text" fill="#888888">B</text>
            
            <!-- Wire and Bulb -->
            <polyline points="345,160 345,90 385,90" fill="none" stroke="#000000" stroke-width="2" />
            <polyline points="415,90 455,90 455,160" fill="none" stroke="#000000" stroke-width="2" />
            <circle cx="400" cy="90" r="15" fill="none" stroke="#000000" stroke-width="2" />
            <path d="M 392 95 L 400 85 L 408 95" fill="none" stroke="#000000" stroke-width="1" />
            
            <!-- Port Labels -->
            <text x="225" y="335" text-anchor="middle" class="scene1-text" fill="#888888">a</text>
            <text x="225" y="185" text-anchor="middle" class="scene1-text" fill="#888888">c</text>
            <text x="575" y="335" text-anchor="middle" class="scene1-text" fill="#888888">b</text>
            <text x="575" y="185" text-anchor="middle" class="scene1-text" fill="#888888">d</text>
            
            <!-- Port Arrows (Black) -->
            <line x1="210" y1="345" x2="240" y2="345" stroke="#000000" stroke-width="1.5" marker-end="url(#scene1-arrow-black)" />
            <line x1="240" y1="195" x2="210" y2="195" stroke="#000000" stroke-width="1.5" marker-end="url(#scene1-arrow-black)" />
            <line x1="590" y1="345" x2="560" y2="345" stroke="#000000" stroke-width="1.5" marker-end="url(#scene1-arrow-black)" />
            <line x1="560" y1="195" x2="590" y2="195" stroke="#000000" stroke-width="1.5" marker-end="url(#scene1-arrow-black)" />
            
            <!-- e- flow -->
            <g id="scene1-e-flow">
                <line x1="350" y1="75" x2="380" y2="75" stroke="#000000" stroke-width="1.5" marker-end="url(#scene1-arrow-black)" id="scene1-e-arrow1" />
                <text x="365" y="65" text-anchor="middle" class="scene1-text" id="scene1-e-text1">e⁻</text>
                <line x1="420" y1="75" x2="450" y2="75" stroke="#000000" stroke-width="1.5" marker-end="url(#scene1-arrow-black)" id="scene1-e-arrow2" />
                <text x="435" y="65" text-anchor="middle" class="scene1-text" id="scene1-e-text2">e⁻</text>
            </g>
            
            <!-- Step 1: Polarity -->
            <g id="scene1-step1-group" class="scene1-step-el" style="opacity: 0; display: none;">
                <text x="200" y="120" text-anchor="middle" class="scene1-text" fill="#c62828" font-weight="bold">负极 (失电子, 氧化反应)</text>
                <text x="600" y="120" text-anchor="middle" class="scene1-text" fill="#c62828" font-weight="bold">正极 (得电子, 还原反应)</text>
            </g>
            
            <!-- Step 2: Inputs -->
            <g id="scene1-step2-group" class="scene1-step-el" style="opacity: 0; display: none;">
                <text x="140" y="350" text-anchor="end" class="scene1-text" fill="#1565c0" id="scene1-input-a">C₂H₈N₂</text>
                <text x="660" y="350" text-anchor="start" class="scene1-text" fill="#2e7d32" id="scene1-input-b">N₂O₄</text>
            </g>
            
            <!-- Step 3: Outputs and Reactions -->
            <g id="scene1-step3-group" class="scene1-step-el" style="opacity: 0; display: none;">
                <text x="140" y="200" text-anchor="end" class="scene1-text" fill="#1565c0" id="scene1-output-c">CO₂, N₂</text>
                <text x="660" y="200" text-anchor="start" class="scene1-text" fill="#2e7d32" id="scene1-output-d">N₂</text>
                
                <text x="180" y="270" text-anchor="end" class="scene1-text" fill="#1565c0">C₂H₈N₂ → CO₂ + N₂</text>
                <text x="620" y="270" text-anchor="start" class="scene1-text" fill="#2e7d32">N₂O₄ → N₂</text>
                
                <text x="400" y="430" text-anchor="middle" class="scene1-text" fill="#1565c0">正确负极反应: C₂H₈N₂ - 16e⁻ + 4H₂O === <tspan fill="#c62828" font-weight="bold">2</tspan>CO₂ + N₂ + 16H⁺</text>
                <text x="400" y="465" text-anchor="middle" class="scene1-text" fill="#888888" text-decoration="line-through">错误选项D: C₂H₈N₂ - 16e⁻ + 8H₂O === CO₂ + N₂ + 16H⁺</text>
            </g>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 3;
        
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        
        const eArrow1 = document.getElementById('scene1-e-arrow1');
        const eArrow2 = document.getElementById('scene1-e-arrow2');
        const eText1 = document.getElementById('scene1-e-text1');
        const eText2 = document.getElementById('scene1-e-text2');
        
        const step1Group = document.getElementById('scene1-step1-group');
        const step2Group = document.getElementById('scene1-step2-group');
        const step3Group = document.getElementById('scene1-step3-group');
        
        const inputA = document.getElementById('scene1-input-a');
        const inputB = document.getElementById('scene1-input-b');
        const outputC = document.getElementById('scene1-output-c');
        const outputD = document.getElementById('scene1-output-d');
        
        function show(el) {
            el.style.display = '';
            // trigger reflow
            void el.offsetWidth;
            el.style.opacity = '1';
        }
        
        function hide(el) {
            el.style.opacity = '0';
            setTimeout(() => {
                if (el.style.opacity === '0') {
                    el.style.display = 'none';
                }
            }, 300);
        }
        
        function updateScene() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
            
            // Step 1: Polarity
            if (currentStep >= 1) {
                eArrow1.setAttribute('stroke', '#c62828');
                eArrow1.setAttribute('marker-end', 'url(#scene1-arrow-red)');
                eArrow2.setAttribute('stroke', '#c62828');
                eArrow2.setAttribute('marker-end', 'url(#scene1-arrow-red)');
                eText1.setAttribute('fill', '#c62828');
                eText1.setAttribute('font-weight', 'bold');
                eText2.setAttribute('fill', '#c62828');
                eText2.setAttribute('font-weight', 'bold');
                show(step1Group);
            } else {
                eArrow1.setAttribute('stroke', '#000000');
                eArrow1.setAttribute('marker-end', 'url(#scene1-arrow-black)');
                eArrow2.setAttribute('stroke', '#000000');
                eArrow2.setAttribute('marker-end', 'url(#scene1-arrow-black)');
                eText1.setAttribute('fill', '#000000');
                eText1.removeAttribute('font-weight');
                eText2.setAttribute('fill', '#000000');
                eText2.removeAttribute('font-weight');
                hide(step1Group);
            }
            
            // Step 2: Inputs
            if (currentStep >= 2) {
                show(step2Group);
                if (currentStep === 2) {
                    inputA.className.baseVal = 'scene1-text scene1-anim-slideInRight';
                    inputB.className.baseVal = 'scene1-text scene1-anim-slideInLeft';
                } else {
                    inputA.className.baseVal = 'scene1-text';
                    inputB.className.baseVal = 'scene1-text';
                }
            } else {
                hide(step2Group);
            }
            
            // Step 3: Outputs
            if (currentStep >= 3) {
                show(step3Group);
                if (currentStep === 3) {
                    outputC.className.baseVal = 'scene1-text scene1-anim-slideOutLeft';
                    outputD.className.baseVal = 'scene1-text scene1-anim-slideOutRight';
                } else {
                    outputC.className.baseVal = 'scene1-text';
                    outputD.className.baseVal = 'scene1-text';
                }
            } else {
                hide(step3Group);
            }
        }
        
        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });
        
        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });
        
        // Initial state
        updateScene();
    })();
    </script>
</body>
</html>
