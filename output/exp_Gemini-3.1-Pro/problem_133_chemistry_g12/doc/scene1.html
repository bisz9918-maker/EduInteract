<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisualSolver Scene</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 20px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button:hover:not(:disabled) { background: #e9e9e9; }
        
        .scene1-transition { transition: all 0.5s ease; }
        .scene1-text { font-size: 18px; fill: #000000; text-anchor: middle; dominant-baseline: middle; }
        .scene1-tick-text { font-size: 16px; fill: #000000; text-anchor: middle; dominant-baseline: middle; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- Left Area -->
            <rect id="scene1-left-area" class="scene1-transition" x="100" y="180" width="145" height="140" fill="#1565c0" fill-opacity="0.2" />
            
            <!-- Right Area -->
            <rect id="scene1-right-area" class="scene1-transition" x="255" y="180" width="445" height="140" fill="#2e7d32" fill-opacity="0.2" />

            <!-- Container Outline -->
            <rect x="100" y="180" width="600" height="140" fill="none" stroke="#000000" stroke-width="2" />

            <!-- Piston -->
            <rect id="scene1-piston" class="scene1-transition" x="245" y="180" width="10" height="140" fill="#000000" />

            <!-- Ticks and Labels -->
            <line x1="100" y1="320" x2="100" y2="330" stroke="#000000" stroke-width="2" />
            <text x="100" y="350" class="scene1-tick-text">0</text>
            
            <line x1="250" y1="320" x2="250" y2="330" stroke="#000000" stroke-width="2" />
            <text x="250" y="350" class="scene1-tick-text">1</text>
            
            <line x1="400" y1="320" x2="400" y2="330" stroke="#000000" stroke-width="2" />
            <text x="400" y="350" class="scene1-tick-text">2</text>
            
            <line x1="550" y1="320" x2="550" y2="330" stroke="#000000" stroke-width="2" />
            <text x="550" y="350" class="scene1-tick-text">3</text>
            
            <line x1="700" y1="320" x2="700" y2="330" stroke="#000000" stroke-width="2" />
            <text x="700" y="350" class="scene1-tick-text">4</text>

            <!-- Area Labels (Moved above container to avoid overlap with rects) -->
            <text id="scene1-left-label" class="scene1-text scene1-transition" x="172.5" y="110">空气</text>
            <text id="scene1-right-label" class="scene1-text scene1-transition" x="477.5" y="110">O₂, H₂混合气</text>

            <!-- State Parameters -->
            <text id="scene1-left-params" class="scene1-text scene1-transition" x="172.5" y="150">V = 1, P = P₀</text>
            <text id="scene1-right-params" class="scene1-text scene1-transition" x="477.5" y="150">V = 3, P = P₀, n = 3</text>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 3;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');

        const piston = document.getElementById('scene1-piston');
        const leftArea = document.getElementById('scene1-left-area');
        const rightArea = document.getElementById('scene1-right-area');
        const leftLabel = document.getElementById('scene1-left-label');
        const rightLabel = document.getElementById('scene1-right-label');
        const leftParams = document.getElementById('scene1-left-params');
        const rightParams = document.getElementById('scene1-right-params');

        function updateState() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;

            if (currentStep === 0) {
                piston.setAttribute('x', '245');
                
                leftArea.setAttribute('width', '145');
                leftArea.setAttribute('fill-opacity', '0.2');
                
                rightArea.setAttribute('x', '255');
                rightArea.setAttribute('width', '445');
                rightArea.setAttribute('fill', '#2e7d32');
                rightArea.setAttribute('fill-opacity', '0.2');

                leftLabel.setAttribute('x', '172.5');
                rightLabel.setAttribute('x', '477.5');
                rightLabel.textContent = 'O₂, H₂混合气';

                leftParams.setAttribute('x', '172.5');
                leftParams.textContent = 'V = 1, P = P₀';
                
                rightParams.setAttribute('x', '477.5');
                rightParams.textContent = 'V = 3, P = P₀, n = 3';
            } 
            else if (currentStep === 1) {
                piston.setAttribute('x', '395');
                
                leftArea.setAttribute('width', '295');
                leftArea.setAttribute('fill-opacity', '0.2');
                
                rightArea.setAttribute('x', '405');
                rightArea.setAttribute('width', '295');
                rightArea.setAttribute('fill', '#c62828');
                rightArea.setAttribute('fill-opacity', '0.2');

                leftLabel.setAttribute('x', '247.5');
                rightLabel.setAttribute('x', '552.5');
                rightLabel.textContent = '剩余气体';

                leftParams.setAttribute('x', '247.5');
                leftParams.textContent = 'V = 2';
                
                rightParams.setAttribute('x', '552.5');
                rightParams.textContent = 'V = 2';
            }
            else if (currentStep === 2) {
                piston.setAttribute('x', '395');
                
                leftArea.setAttribute('width', '295');
                leftArea.setAttribute('fill-opacity', '0.4');
                
                rightArea.setAttribute('x', '405');
                rightArea.setAttribute('width', '295');
                rightArea.setAttribute('fill', '#c62828');
                rightArea.setAttribute('fill-opacity', '0.2');

                leftLabel.setAttribute('x', '247.5');
                rightLabel.setAttribute('x', '552.5');
                rightLabel.textContent = '剩余气体';

                leftParams.setAttribute('x', '247.5');
                leftParams.textContent = 'V = 2, P = 0.5P₀';
                
                rightParams.setAttribute('x', '552.5');
                rightParams.textContent = 'V = 2, P = 0.5P₀';
            }
            else if (currentStep === 3) {
                piston.setAttribute('x', '395');
                
                leftArea.setAttribute('width', '295');
                leftArea.setAttribute('fill-opacity', '0.2');
                
                rightArea.setAttribute('x', '405');
                rightArea.setAttribute('width', '295');
                rightArea.setAttribute('fill', '#c62828');
                rightArea.setAttribute('fill-opacity', '0.4');

                leftLabel.setAttribute('x', '247.5');
                rightLabel.setAttribute('x', '552.5');
                rightLabel.textContent = '剩余气体';

                leftParams.setAttribute('x', '247.5');
                leftParams.textContent = 'V = 2, P = 0.5P₀';
                
                rightParams.setAttribute('x', '552.5');
                rightParams.textContent = 'V = 2, P = 0.5P₀, n = 1';
            }
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateState();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateState();
            }
        });

        // Initialize
        updateState();
    })();
    </script>
</body>
</html>
