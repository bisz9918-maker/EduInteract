<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f8f9fa; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene1-element { transition: opacity 0.4s ease; }
        #scene1-desc { position: absolute; bottom: 60px; left: 20px; right: 20px; text-align: center; font-size: 16px; color: #333; line-height: 1.5; z-index: 5; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <!-- 动态文本区 -->
        <div id="scene1-desc">观察有机物A的键线式结构，依次验证四个选项。</div>

        <svg id="scene1-svg" width="800" height="500">
            <!-- 步骤1：碳骨架高亮 -->
            <g id="scene1-step1-elements" class="scene1-element" style="opacity: 0; display: none;">
                <!-- 主链和支链高亮 (避开O原子) -->
                <path d="M155,270 L190,290" stroke="#1565c0" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.4" />
                <path d="M260,250 L295,270 L330,250 L365,270 L400,250 L435,270 L470,250 L505,270 L540,250 L575,270 L610,250 L645,270" stroke="#1565c0" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.4" />
                <path d="M295,270 L295,230" stroke="#1565c0" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.4" />
                <path d="M365,190 L400,210" stroke="#1565c0" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.4" />
                <path d="M435,310 L470,290" stroke="#1565c0" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.4" />
                <path d="M470,250 L470,190" stroke="#1565c0" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.4" />
                <path d="M610,250 L645,230" stroke="#1565c0" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.4" />
                
                <!-- 碳原子编号 -->
                <g fill="#1565c0" font-size="14px" font-weight="bold" text-anchor="middle">
                    <text x="140" y="275">1</text>
                    <text x="165" y="315">2</text>
                    <text x="260" y="230">3</text>
                    <text x="295" y="295">4</text>
                    <text x="315" y="240">5</text>
                    <text x="365" y="295">6</text>
                    <text x="400" y="230">7</text>
                    <text x="455" y="295">8</text>
                    <text x="485" y="240">9</text>
                    <text x="505" y="295">10</text>
                    <text x="540" y="230">11</text>
                    <text x="575" y="295">12</text>
                    <text x="610" y="230">13</text>
                    <text x="660" y="275">14</text>
                    <text x="660" y="235">15</text>
                    <text x="270" y="215">16</text>
                    <text x="385" y="170">17</text>
                    <text x="415" y="215">18</text>
                    <text x="465" y="325">19</text>
                    <text x="485" y="295">20</text>
                    <text x="470" y="175">21</text>
                </g>
            </g>

            <!-- 步骤2 & 4：酯基和双键高亮 -->
            <g id="scene1-step2-elements" class="scene1-element" style="opacity: 0; display: none;">
                <!-- 酯基高亮 (红) -->
                <path d="M190,318 L190,290 L214.6,276" stroke="#c62828" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.4" />
                <path d="M365,162 L365,190 L340.4,204" stroke="#c62828" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.4" />
                <path d="M435,338 L435,310 L410.4,296" stroke="#c62828" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.4" />
                <!-- 双键高亮 (绿) -->
                <path d="M260,250 L295,270" stroke="#2e7d32" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.4" />
                <path d="M400,250 L435,270" stroke="#2e7d32" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.4" />
                <path d="M505,270 L540,250" stroke="#2e7d32" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.4" />
                <path d="M575,270 L610,250" stroke="#2e7d32" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.4" />
            </g>

            <!-- 步骤3：手性碳标记 -->
            <g id="scene1-step3-elements" class="scene1-element" style="opacity: 0; display: none;">
                <!-- 手性基团高亮 (以C3为例) -->
                <path d="M330,250 L295,270" stroke="#1565c0" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.4" />
                <path d="M330,250 L365,270" stroke="#2e7d32" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.4" />
                <path d="M330,250 L330,222" stroke="#fbc02d" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.4" />
                <path d="M330,250 L330,290" stroke="#c62828" stroke-width="12" stroke-linecap="round" stroke-dasharray="4,4" fill="none" opacity="0.4" />
                
                <!-- 隐藏的H原子 -->
                <line x1="330" y1="250" x2="330" y2="290" stroke="#000" stroke-width="2" stroke-dasharray="4,4" />
                <text x="330" y="315" font-size="14px" fill="#000" text-anchor="middle">H</text>

                <!-- 星号 -->
                <text x="345" y="235" font-size="20px" font-weight="bold" fill="#c62828" text-anchor="middle">*</text>
                <text x="350" y="295" font-size="20px" font-weight="bold" fill="#c62828" text-anchor="middle">*</text>
            </g>

            <!-- 步骤4：反应类型标签 -->
            <g id="scene1-step4-elements" class="scene1-element" style="opacity: 0; display: none;">
                <!-- 加成/氧化 -->
                <text x="525" y="170" font-size="14px" fill="#2e7d32" text-anchor="middle">加成反应(消耗4mol H₂)、氧化反应</text>
                <path d="M525,175 L525,255" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="4,4" fill="none" marker-end="url(#arrow-green)" />
                
                <!-- 取代/水解 -->
                <text x="325" y="390" font-size="14px" fill="#c62828" text-anchor="middle">取代/水解反应(消耗3mol NaOH)</text>
                <path d="M325,375 L410,335" stroke="#c62828" stroke-width="1.5" stroke-dasharray="4,4" fill="none" marker-end="url(#arrow-red)" />
            </g>

            <!-- 基础分子骨架 (始终显示) -->
            <g id="scene1-base-skeleton" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <!-- 箭头定义 -->
                <defs>
                    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                        <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32" />
                    </marker>
                    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                        <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828" />
                    </marker>
                </defs>

                <!-- 主链和支链 (断开O原子处) -->
                <path d="M155,270 L190,290 L214.6,276" fill="none" />
                <path d="M235.4,264 L260,250 L295,270 L330,250 L365,270 L389.6,284" fill="none" />
                <path d="M410.4,296 L435,310 L470,290" fill="none" />
                
                <path d="M295,270 L295,230" fill="none" />
                
                <path d="M330,250 L330,222" fill="none" />
                <path d="M340.4,204 L365,190 L400,210" fill="none" />
                
                <path d="M470,250 L470,190" fill="none" />
                <path d="M470,250 L505,270 L540,250 L575,270 L610,250 L645,270" fill="none" />
                <path d="M610,250 L645,230" fill="none" />

                <!-- 双键副线 -->
                <line x1="262" y1="256" x2="293" y2="276" />
                <line x1="402" y1="256" x2="433" y2="276" />
                <line x1="507" y1="276" x2="538" y2="256" />
                <line x1="577" y1="276" x2="608" y2="256" />

                <!-- 羰基双键 -->
                <line x1="190" y1="290" x2="190" y2="318" />
                <line x1="185" y1="292" x2="185" y2="316" />
                
                <line x1="365" y1="190" x2="365" y2="162" />
                <line x1="360" y1="188" x2="360" y2="164" />
                
                <line x1="435" y1="310" x2="435" y2="338" />
                <line x1="430" y1="312" x2="430" y2="336" />

                <!-- 氧原子标签 -->
                <g stroke="none">
                    <text x="225" y="275" font-size="14px" fill="#000000" text-anchor="middle">O</text>
                    <text x="190" y="335" font-size="14px" fill="#000000" text-anchor="middle">O</text>
                    <text x="330" y="215" font-size="14px" fill="#000000" text-anchor="middle">O</text>
                    <text x="365" y="155" font-size="14px" fill="#000000" text-anchor="middle">O</text>
                    <text x="400" y="295" font-size="14px" fill="#000000" text-anchor="middle">O</text>
                    <text x="435" y="355" font-size="14px" fill="#000000" text-anchor="middle">O</text>
                </g>
            </g>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 4;
        
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const descText = document.getElementById('scene1-desc');
        
        const step1Els = document.getElementById('scene1-step1-elements');
        const step2Els = document.getElementById('scene1-step2-elements');
        const step3Els = document.getElementById('scene1-step3-elements');
        const step4Els = document.getElementById('scene1-step4-elements');

        const descriptions = [
            "观察有机物A的键线式结构，依次验证四个选项。",
            "验证选项A：高亮主链和支链的碳骨架并编号，得出总碳数为21。",
            "验证选项A：3个酯基(红)提供3个不饱和度，4个双键(绿)提供4个不饱和度。总不饱和度为7，推导分子式为 C₂₁H₂₆O₆，选项A正确。",
            "验证选项B：含有2个手性碳原子(标*)。以左侧手性碳为例，连接4个不同基团，选项B正确。",
            "验证选项C和D：4个双键可发生加成(消耗4mol H₂)和氧化反应；3个酯基可发生取代/水解反应(消耗3mol NaOH)。选项C错误，D正确。"
        ];

        function show(el) {
            if (!el) return;
            el.style.display = '';
            el.getBoundingClientRect();
            el.style.opacity = '1';
        }

        function hide(el) {
            if (!el) return;
            el.style.opacity = '0';
            setTimeout(() => {
                if (el.style.opacity === '0') {
                    el.style.display = 'none';
                }
            }, 400);
        }

        function updateStep() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
            
            descText.textContent = descriptions[currentStep];

            hide(step1Els);
            hide(step2Els);
            hide(step3Els);
            hide(step4Els);

            if (currentStep === 1) {
                show(step1Els);
            } else if (currentStep === 2) {
                show(step2Els);
            } else if (currentStep === 3) {
                show(step3Els);
            } else if (currentStep === 4) {
                show(step2Els);
                show(step4Els);
            }
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateStep();
            }
        });

        updateStep();
    })();
    </script>
</body>
</html>
