<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f0f0f0; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* 动画类 */
        .fade { transition: opacity 0.5s ease; }
        .scale-up { transition: transform 0.5s ease, opacity 0.5s ease; transform-origin: center; }
        .scale-up.hidden { transform: scale(0); opacity: 0; }
        .scale-up.visible { transform: scale(1); opacity: 1; }
        
        .slide-down { transition: transform 0.5s ease, opacity 0.5s ease; }
        .slide-down.hidden { transform: translateY(-20px); opacity: 0; }
        .slide-down.visible { transform: translateY(0); opacity: 1; }
        
        .draw-path { stroke-dasharray: 500; stroke-dashoffset: 500; transition: stroke-dashoffset 1s ease; }
        .draw-path.visible { stroke-dashoffset: 0; }
        
        .hidden { opacity: 0; pointer-events: none; }
        .visible { opacity: 1; pointer-events: auto; }
        
        text { font-size: 14px; fill: #333; }
        .title { font-weight: bold; font-size: 16px; }
        .highlight { fill: #1565c0; font-weight: bold; }
        .highlight-red { fill: #c62828; font-weight: bold; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- 步骤0: 初始状态 -->
            <g id="scene1-step0">
                <text x="160" y="40" text-anchor="middle" class="title">植株甲 (aa黄色豆荚, bb绿色子叶)</text>
                <!-- 雌蕊简图 -->
                <path d="M110,140 C110,120 115,100 120,100 C125,100 130,120 130,140 C140,150 140,170 120,170 C100,170 100,150 110,140 Z" fill="rgba(0,0,0,0.1)" stroke="#333" stroke-width="2"/>
                <text x="120" y="190" text-anchor="middle" font-size="12">雌蕊(子房)</text>
                
                <text x="160" y="410" text-anchor="middle" class="title">植株乙 (AA绿色豆荚, BB黄色子叶)</text>
                <!-- 雄蕊简图 -->
                <path d="M115,350 L115,310 M125,350 L125,310" stroke="#333" stroke-width="2"/>
                <ellipse cx="115" cy="305" rx="6" ry="8" fill="rgba(0,0,0,0.1)" stroke="#333" stroke-width="1"/>
                <ellipse cx="125" cy="305" rx="6" ry="8" fill="rgba(0,0,0,0.1)" stroke="#333" stroke-width="1"/>
                <text x="120" y="375" text-anchor="middle" font-size="12">雄蕊(花药)</text>
            </g>
            
            <!-- 步骤1: 处理① -->
            <g id="scene1-step1" class="fade hidden">
                <line x1="160" y1="130" x2="320" y2="90" stroke="#888" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#scene1-arrow)"/>
                <text x="240" y="75" text-anchor="middle" class="highlight-red">处理①: 生长素</text>
                
                <!-- 滴管 -->
                <g id="scene1-dropper" class="slide-down hidden">
                    <path d="M375,30 L385,30 L385,50 L382,60 L378,60 L375,50 Z" fill="#ccc" stroke="#333"/>
                    <circle cx="380" cy="65" r="3" fill="#c62828"/>
                </g>
                
                <!-- 无子豆荚 -->
                <g id="scene1-pod1" class="scale-up hidden" style="transform-origin: 420px 90px;">
                    <path d="M380,90 Q420,60 460,90 Q420,120 380,90 Z" fill="#fbc02d" stroke="#f57f17" stroke-width="2"/>
                    <text x="420" y="135" text-anchor="middle">无子豆荚 (aa, 黄色)</text>
                </g>
            </g>
            
            <!-- 步骤2: 处理② -->
            <g id="scene1-step2" class="fade hidden">
                <!-- 授粉箭头 -->
                <path id="scene1-pollinate-path" d="M100,300 Q40,200 100,100" fill="none" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#scene1-arrow-red)"/>
                <text x="80" y="220" text-anchor="end" class="highlight-red">处理②: 授粉</text>
                
                <line x1="160" y1="150" x2="320" y2="220" stroke="#888" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#scene1-arrow)"/>
                
                <!-- 有子豆荚 -->
                <g id="scene1-pod2" class="scale-up hidden" style="transform-origin: 420px 220px;">
                    <path d="M380,220 Q420,190 460,220 Q420,250 380,220 Z" fill="#fbc02d" stroke="#f57f17" stroke-width="2"/>
                    <circle cx="400" cy="220" r="5" fill="#81c784" stroke="#388e3c"/>
                    <circle cx="420" cy="220" r="5" fill="#81c784" stroke="#388e3c"/>
                    <circle cx="440" cy="220" r="5" fill="#81c784" stroke="#388e3c"/>
                    <text x="420" y="260" text-anchor="middle">有子豆荚 (aa, 黄色)</text>
                    <text x="420" y="295" text-anchor="middle" class="highlight">种子胚 (AaBb)</text>
                </g>
            </g>
            
            <!-- 步骤3: 第二年播种 -->
            <g id="scene1-step3" class="fade hidden">
                <line x1="480" y1="220" x2="600" y2="150" stroke="#888" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#scene1-arrow)"/>
                <text x="540" y="140" text-anchor="middle">第二年播种</text>
                
                <text x="680" y="50" text-anchor="middle" class="title">F1植株 (AaBb)</text>
                <!-- F1植株简图 -->
                <path d="M680,130 L680,70 M680,100 L660,80 M680,110 L700,90" stroke="#4caf50" stroke-width="3" fill="none"/>
                
                <!-- F1豆荚 -->
                <g id="scene1-pod3" class="scale-up hidden" style="transform-origin: 680px 150px;">
                    <path d="M640,150 Q680,120 720,150 Q680,180 640,150 Z" fill="#81c784" stroke="#388e3c" stroke-width="2"/>
                    <text x="680" y="190" text-anchor="middle">F1豆荚 (Aa, 绿色)</text>
                    <text x="680" y="225" text-anchor="middle" class="highlight-red">黄色豆荚占 0</text>
                </g>
            </g>
            
            <!-- 步骤4: F2代种子 -->
            <g id="scene1-step4" class="fade hidden">
                <line x1="680" y1="240" x2="680" y2="270" stroke="#888" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#scene1-arrow)"/>
                <text x="710" y="255" text-anchor="middle">自交</text>
                
                <text x="680" y="300" text-anchor="middle" class="title">F2胚: AABb</text>
                <text x="680" y="335" text-anchor="middle">P(AA) = 1/4</text>
                <text x="680" y="370" text-anchor="middle">P(Bb) = 1/2</text>
                <text x="680" y="405" text-anchor="middle" class="highlight">概率 = 1/8</text>
            </g>
            
            <!-- 箭头定义 -->
            <defs>
                <marker id="scene1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M0,0 L10,5 L0,10 Z" fill="#888"/>
                </marker>
                <marker id="scene1-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M0,0 L10,5 L0,10 Z" fill="#c62828"/>
                </marker>
            </defs>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 4;
        
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        
        const steps = [
            document.getElementById('scene1-step0'),
            document.getElementById('scene1-step1'),
            document.getElementById('scene1-step2'),
            document.getElementById('scene1-step3'),
            document.getElementById('scene1-step4')
        ];
        
        // 动画元素
        const dropper = document.getElementById('scene1-dropper');
        const pod1 = document.getElementById('scene1-pod1');
        const pod2 = document.getElementById('scene1-pod2');
        const pod3 = document.getElementById('scene1-pod3');
        
        function updateScene() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
            
            // 步骤显隐
            for (let i = 1; i <= maxStep; i++) {
                if (i <= currentStep) {
                    steps[i].classList.remove('hidden');
                    steps[i].classList.add('visible');
                } else {
                    steps[i].classList.remove('visible');
                    steps[i].classList.add('hidden');
                }
            }
            
            // 触发动画
            if (currentStep >= 1) {
                setTimeout(() => {
                    dropper.classList.remove('hidden');
                    dropper.classList.add('visible');
                    setTimeout(() => {
                        pod1.classList.remove('hidden');
                        pod1.classList.add('visible');
                    }, 500);
                }, 100);
            } else {
                dropper.classList.remove('visible');
                dropper.classList.add('hidden');
                pod1.classList.remove('visible');
                pod1.classList.add('hidden');
            }
            
            if (currentStep >= 2) {
                setTimeout(() => {
                    pod2.classList.remove('hidden');
                    pod2.classList.add('visible');
                }, 500);
            } else {
                pod2.classList.remove('visible');
                pod2.classList.add('hidden');
            }
            
            if (currentStep >= 3) {
                setTimeout(() => {
                    pod3.classList.remove('hidden');
                    pod3.classList.add('visible');
                }, 500);
            } else {
                pod3.classList.remove('visible');
                pod3.classList.add('hidden');
            }
        }
        
        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });
        
        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });
        
        // 初始化
        updateScene();
    })();
    </script>
</body>
</html>
