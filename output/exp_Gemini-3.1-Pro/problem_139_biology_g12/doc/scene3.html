<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f0f0f0; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .step-element { transition: opacity 0.3s ease; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg width="800" height="500">
            <defs>
                <marker id="arrow-down" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
                </marker>
                <marker id="arrow-right" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
                </marker>
            </defs>

            <!-- Step 0: Initial State -->
            <g id="scene3-step0" class="step-element">
                <text x="200" y="35" font-size="20" text-anchor="middle" fill="#000000" font-weight="bold">紫花测交计算</text>
                
                <!-- 紫花群体基因型及比例 -->
                <rect x="60" y="55" width="280" height="80" rx="8" fill="#f8f9fa" stroke="#e0e0e0" stroke-width="2" />
                <text x="200" y="80" font-size="16" text-anchor="middle" fill="#000000">紫花群体基因型及比例</text>
                <text x="130" y="120" font-size="16" text-anchor="middle" fill="#000000">1/3 AAbb</text>
                <text x="270" y="120" font-size="16" text-anchor="middle" fill="#000000">2/3 Aabb</text>
            </g>

            <!-- Step 1 -->
            <g id="scene3-step1" class="step-element" style="opacity: 0; display: none;">
                <line x1="200" y1="135" x2="200" y2="160" stroke="#000000" stroke-width="2" marker-end="url(#arrow-down)" />
                
                <!-- 产生配子及比例 -->
                <rect x="60" y="165" width="280" height="80" rx="8" fill="#f8f9fa" stroke="#e0e0e0" stroke-width="2" />
                <text x="200" y="190" font-size="16" text-anchor="middle" fill="#000000">产生配子及比例</text>
                <text x="130" y="230" font-size="16" text-anchor="middle" fill="#1565c0">A配子: 2/3</text>
                <text x="270" y="230" font-size="16" text-anchor="middle" fill="#1565c0">a配子: 1/3</text>
                
                <text x="200" y="270" font-size="16" text-anchor="middle" fill="#000000">测交 × aabb (只产生 a 配子)</text>
            </g>

            <!-- Step 2 -->
            <g id="scene3-step2" class="step-element" style="opacity: 0; display: none;">
                <line x1="200" y1="280" x2="200" y2="310" stroke="#000000" stroke-width="2" marker-end="url(#arrow-down)" />
                
                <!-- 测交后代 -->
                <rect x="60" y="315" width="280" height="80" rx="8" fill="#f8f9fa" stroke="#e0e0e0" stroke-width="2" />
                <text x="200" y="340" font-size="16" text-anchor="middle" fill="#000000">测交后代</text>
                <text x="130" y="380" font-size="16" text-anchor="middle" fill="#1565c0">2/3 Aabb (紫花)</text>
                <text x="270" y="380" font-size="16" text-anchor="middle" fill="#1565c0">1/3 aabb (白花)</text>
                
                <text x="200" y="430" font-size="18" text-anchor="middle" fill="#1565c0" font-weight="bold">结果: 2紫 : 1白</text>
            </g>

            <!-- Step 3 -->
            <g id="scene3-step3" class="step-element" style="opacity: 0; display: none;">
                <text x="600" y="40" font-size="20" text-anchor="middle" fill="#000000" font-weight="bold">白花突变推导</text>
                
                <!-- 目标表型 -->
                <rect x="460" y="55" width="280" height="60" rx="8" fill="#f8f9fa" stroke="#e0e0e0" stroke-width="2" />
                <text x="600" y="90" font-size="16" text-anchor="middle" fill="#1565c0">目标表型: 蓝花 (aaB_)</text>
            </g>

            <!-- Step 4 -->
            <g id="scene3-step4" class="step-element" style="opacity: 0; display: none;">
                <!-- 白花来源 -->
                <rect x="460" y="135" width="280" height="60" rx="8" fill="#f8f9fa" stroke="#e0e0e0" stroke-width="2" />
                <text x="600" y="170" font-size="16" text-anchor="middle" fill="#000000">白花来源: A_B_ 或 aabb</text>
                
                <!-- Path 1 -->
                <text x="520" y="245" font-size="16" text-anchor="middle" fill="#000000"><tspan fill="#c62828" font-weight="bold">A</tspan>aBB / <tspan fill="#c62828" font-weight="bold">A</tspan>aBb</text>
                <line x1="575" y1="240" x2="620" y2="240" stroke="#000000" stroke-width="2" marker-end="url(#arrow-right)" />
                <text x="600" y="230" font-size="14" text-anchor="middle" fill="#c62828">A→a</text>
                <text x="680" y="245" font-size="16" text-anchor="middle" fill="#000000"><tspan fill="#c62828" font-weight="bold">a</tspan>aB_ (蓝花)</text>
                
                <!-- Path 2 -->
                <text x="520" y="305" font-size="16" text-anchor="middle" fill="#000000">aab<tspan fill="#c62828" font-weight="bold">b</tspan></text>
                <line x1="575" y1="300" x2="620" y2="300" stroke="#000000" stroke-width="2" marker-end="url(#arrow-right)" />
                <text x="600" y="290" font-size="14" text-anchor="middle" fill="#c62828">b→B</text>
                <text x="680" y="305" font-size="16" text-anchor="middle" fill="#000000">aaB<tspan fill="#c62828" font-weight="bold">b</tspan> (蓝花)</text>
                
                <!-- Conclusion -->
                <rect x="460" y="345" width="280" height="80" rx="8" fill="#f8f9fa" stroke="#e0e0e0" stroke-width="2" />
                <text x="600" y="375" font-size="16" text-anchor="middle" fill="#000000">可能的突变前基因型:</text>
                <text x="600" y="410" font-size="18" text-anchor="middle" fill="#c62828" font-weight="bold">AaBB, AaBb, aabb</text>
            </g>
        </svg>
        <div id="scene3-controls">
            <button id="scene3-btn-prev" disabled>◀ 上一步</button>
            <button id="scene3-btn-next">下一步 ▶</button>
        </div>
    </div>
    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 4;
        const btnPrev = document.getElementById('scene3-btn-prev');
        const btnNext = document.getElementById('scene3-btn-next');
        
        function updateSteps() {
            for (let i = 0; i <= maxStep; i++) {
                const el = document.getElementById(`scene3-step${i}`);
                if (i <= currentStep) {
                    el.style.display = 'block';
                    // small delay to allow display:block to apply before opacity transition
                    setTimeout(() => {
                        el.style.opacity = '1';
                    }, 10);
                } else {
                    el.style.opacity = '0';
                    setTimeout(() => {
                        if (i > currentStep) el.style.display = 'none';
                    }, 300);
                }
            }
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
        }
        
        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateSteps();
            }
        });
        
        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateSteps();
            }
        });
        
        updateSteps();
    })();
    </script>
</body>
</html>
