<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene3-transition { transition: all 0.5s ease; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg id="scene3-svg" width="800" height="500">
            <defs>
                <pattern id="scene3-hatch" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
                    <line x1="0" y1="0" x2="0" y2="10" stroke="#888888" stroke-width="2" />
                </pattern>
                <rect id="scene3-cell-bg" x="-30" y="-30" width="60" height="60" />
                <line id="scene3-diag-line" x1="0" y1="0" x2="60" y2="60" stroke="#000000" stroke-width="1" />
                <line id="scene3-cross-line1" x1="-20" y1="-20" x2="20" y2="20" stroke="#c62828" stroke-width="4" />
                <line id="scene3-cross-line2" x1="20" y1="-20" x2="-20" y2="20" stroke="#c62828" stroke-width="4" />
                <rect id="scene3-lethal-mask" x="0" y="0" width="60" height="300" fill="url(#scene3-hatch)" />
            </defs>
            
            <!-- Grid Backgrounds -->
            <g id="scene3-cell-bgs"></g>
            
            <!-- Grid Lines -->
            <!-- Outer border -->
            <line x1="80" y1="100" x2="380" y2="100" stroke="#000000" stroke-width="1" />
            <line x1="80" y1="400" x2="380" y2="400" stroke="#000000" stroke-width="1" />
            <line x1="80" y1="100" x2="80" y2="400" stroke="#000000" stroke-width="1" />
            <line x1="380" y1="100" x2="380" y2="400" stroke="#000000" stroke-width="1" />
            
            <!-- Inner vertical lines -->
            <line x1="140" y1="100" x2="140" y2="400" stroke="#000000" stroke-width="1" />
            <line x1="200" y1="100" x2="200" y2="400" stroke="#000000" stroke-width="1" />
            <line x1="260" y1="100" x2="260" y2="400" stroke="#000000" stroke-width="1" />
            <line x1="320" y1="100" x2="320" y2="400" stroke="#000000" stroke-width="1" />
            
            <!-- Inner horizontal lines -->
            <line x1="80" y1="160" x2="380" y2="160" stroke="#000000" stroke-width="1" />
            <line x1="80" y1="220" x2="380" y2="220" stroke="#000000" stroke-width="1" />
            <line x1="80" y1="280" x2="380" y2="280" stroke="#000000" stroke-width="1" />
            <line x1="80" y1="340" x2="380" y2="340" stroke="#000000" stroke-width="1" />
            
            <!-- Diagonal line -->
            <use href="#scene3-diag-line" x="80" y="100" />
            
            <!-- Labels -->
            <text x="95" y="145" font-size="14" fill="#000000">♀</text>
            <text x="125" y="115" font-size="14" fill="#000000">♂</text>
            
            <!-- Male Gametes -->
            <text x="170" y="135" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">VR</text>
            <text x="230" y="135" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">Vr</text>
            <text x="290" y="135" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">vR</text>
            <text x="350" y="135" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">vr</text>
            
            <!-- Female Gametes -->
            <text x="110" y="195" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">VR</text>
            <text x="110" y="255" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">Vr</text>
            <text x="110" y="315" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">vR</text>
            <text x="110" y="375" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">vr</text>
            
            <!-- Zygotes Texts -->
            <g id="scene3-zygotes"></g>
            
            <!-- Lethal Mask -->
            <g id="scene3-lethal-group" class="scene3-transition" style="opacity: 0; display: none;">
                <use href="#scene3-lethal-mask" x="260" y="100" opacity="0.5" />
                <use href="#scene3-cross-line1" x="290" y="130" />
                <use href="#scene3-cross-line2" x="290" y="130" />
                <text x="290" y="85" font-size="14" font-weight="bold" fill="#c62828" text-anchor="middle">假设雄配子 vR 致死</text>
            </g>
            
            <!-- Stats Panel -->
            <text x="450" y="100" font-size="18" font-weight="bold" fill="#000000">表现型统计</text>
            
            <!-- Phenotype 1 -->
            <text x="450" y="155" font-size="14" fill="#000000">长翅细眼 (V_R_)</text>
            <rect x="580" y="140" width="20" height="20" fill="#1565c0" opacity="0.2" />
            <rect id="scene3-bar-1" class="scene3-transition" x="610" y="140" width="0" height="20" fill="#1565c0" />
            <text id="scene3-val-1" class="scene3-transition" x="620" y="155" font-size="14" fill="#000000">0</text>
            
            <!-- Phenotype 2 -->
            <text x="450" y="215" font-size="14" fill="#000000">长翅粗眼 (V_rr)</text>
            <rect x="580" y="200" width="20" height="20" fill="#2e7d32" opacity="0.2" />
            <rect id="scene3-bar-2" class="scene3-transition" x="610" y="200" width="0" height="20" fill="#2e7d32" />
            <text id="scene3-val-2" class="scene3-transition" x="620" y="215" font-size="14" fill="#000000">0</text>
            
            <!-- Phenotype 3 -->
            <text x="450" y="275" font-size="14" fill="#000000">残翅细眼 (vvR_)</text>
            <rect x="580" y="260" width="20" height="20" fill="#c62828" opacity="0.2" />
            <rect id="scene3-bar-3" class="scene3-transition" x="610" y="260" width="0" height="20" fill="#c62828" />
            <text id="scene3-val-3" class="scene3-transition" x="620" y="275" font-size="14" fill="#000000">0</text>
            
            <!-- Phenotype 4 -->
            <text x="450" y="335" font-size="14" fill="#000000">残翅粗眼 (vvrr)</text>
            <rect x="580" y="320" width="20" height="20" fill="#888888" opacity="0.2" />
            <rect id="scene3-bar-4" class="scene3-transition" x="610" y="320" width="0" height="20" fill="#888888" />
            <text id="scene3-val-4" class="scene3-transition" x="620" y="335" font-size="14" fill="#000000">0</text>
            
            <!-- Ratio -->
            <text id="scene3-ratio" class="scene3-transition" x="450" y="400" font-size="16" font-weight="bold" fill="#000000" style="opacity: 0;"></text>
        </svg>
        
        <div id="scene3-controls">
            <button id="scene3-btn-prev">◀ 上一步</button>
            <button id="scene3-btn-next">下一步 ▶</button>
        </div>
    </div>
    <script>
    (function() {
        const gametes = ['VR', 'Vr', 'vR', 'vr'];
        const cols = [170, 230, 290, 350];
        const rows = [195, 255, 315, 375];
        
        const bgsGroup = document.getElementById('scene3-cell-bgs');
        const textsGroup = document.getElementById('scene3-zygotes');
        
        const cells = [];
        
        for (let i = 0; i < 4; i++) {
            for (let j = 0; j < 4; j++) {
                const fG = gametes[i];
                const mG = gametes[j];
                
                // Determine genotype string
                const vStr = (fG.includes('V') || mG.includes('V')) ? (fG.includes('V') && mG.includes('V') ? 'VV' : 'Vv') : 'vv';
                const rStr = (fG.includes('R') || mG.includes('R')) ? (fG.includes('R') && mG.includes('R') ? 'RR' : 'Rr') : 'rr';
                const genotype = vStr + rStr;
                
                // Determine phenotype
                let type = 0;
                let color = '';
                if (vStr.includes('V') && rStr.includes('R')) { type = 1; color = '#1565c0'; }
                else if (vStr.includes('V') && !rStr.includes('R')) { type = 2; color = '#2e7d32'; }
                else if (!vStr.includes('V') && rStr.includes('R')) { type = 3; color = '#c62828'; }
                else { type = 4; color = '#888888'; }
                
                const cx = cols[j];
                const cy = rows[i];
                
                // Background use element
                const bg = document.createElementNS('http://www.w3.org/2000/svg', 'use');
                bg.setAttribute('href', '#scene3-cell-bg');
                bg.setAttribute('x', cx);
                bg.setAttribute('y', cy);
                bg.setAttribute('fill', color);
                bg.setAttribute('opacity', '0');
                bg.setAttribute('class', 'scene3-transition');
                bgsGroup.appendChild(bg);
                
                // Text
                const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                txt.setAttribute('x', cx);
                txt.setAttribute('y', cy + 5);
                txt.setAttribute('font-size', '14');
                txt.setAttribute('fill', '#000000');
                txt.setAttribute('text-anchor', 'middle');
                txt.setAttribute('opacity', '0');
                txt.setAttribute('class', 'scene3-transition');
                txt.textContent = genotype;
                textsGroup.appendChild(txt);
                
                cells.push({ bg, txt, type, col: j });
            }
        }
        
        let currentStep = 0;
        const maxStep = 3;
        
        const btnPrev = document.getElementById('scene3-btn-prev');
        const btnNext = document.getElementById('scene3-btn-next');
        const lethalGroup = document.getElementById('scene3-lethal-group');
        const ratioText = document.getElementById('scene3-ratio');
        
        function updateScene() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
            
            let counts = [0, 0, 0, 0];
            
            cells.forEach(cell => {
                if (currentStep >= 1) {
                    cell.txt.style.opacity = '1';
                    cell.bg.style.opacity = '0.2';
                    
                    if (currentStep >= 2 && cell.col === 2) {
                        cell.txt.style.opacity = '0.3';
                    }
                    if (currentStep >= 3 && cell.col === 2) {
                        cell.bg.style.opacity = '0';
                    } else {
                        counts[cell.type - 1]++;
                    }
                } else {
                    cell.txt.style.opacity = '0';
                    cell.bg.style.opacity = '0';
                }
            });
            
            if (currentStep >= 2) {
                lethalGroup.style.display = 'block';
                // small delay to allow display:block to apply before opacity transition
                setTimeout(() => { lethalGroup.style.opacity = '1'; }, 10);
            } else {
                lethalGroup.style.opacity = '0';
                setTimeout(() => { if(currentStep < 2) lethalGroup.style.display = 'none'; }, 500);
            }
            
            for (let i = 1; i <= 4; i++) {
                const bar = document.getElementById(`scene3-bar-${i}`);
                const val = document.getElementById(`scene3-val-${i}`);
                const count = counts[i-1];
                
                bar.setAttribute('width', count * 15);
                val.textContent = count;
                val.setAttribute('x', 610 + count * 15 + 10);
                
                if (currentStep >= 1) {
                    val.style.opacity = '1';
                } else {
                    val.style.opacity = '0';
                }
            }
            
            if (currentStep >= 1) {
                ratioText.style.opacity = '1';
                if (currentStep >= 3) {
                    ratioText.textContent = '比例 = 7 : 3 : 1 : 1';
                } else {
                    ratioText.textContent = '比例 = 9 : 3 : 3 : 1';
                }
            } else {
                ratioText.style.opacity = '0';
            }
        }
        
        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });
        
        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });
        
        updateScene();
    })();
    </script>
</body>
</html>
