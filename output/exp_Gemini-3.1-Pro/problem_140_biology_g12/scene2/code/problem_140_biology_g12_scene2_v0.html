<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 5px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        button { padding: 6px 12px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .step-text { font-size: 14px; color: #333; min-width: 80px; text-align: center; }
        
        .fade { transition: opacity 0.5s ease; }
        .hidden { opacity: 0; pointer-events: none; }
        .visible { opacity: 1; pointer-events: auto; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500">
            <defs>
                <marker id="scene2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#888888" />
                </marker>
            </defs>

            <!-- Step 0: Initial State -->
            <g id="scene2-step0" class="fade visible">
                <!-- 父本初级精母细胞 -->
                <text x="200" y="40" text-anchor="middle" font-size="14" fill="#333333">初级精母细胞</text>
                <circle cx="200" cy="95" r="40" stroke="#000000" stroke-width="2" fill="#fafafa" />
                <!-- XE -->
                <path d="M 185 75 L 185 115" stroke="#c62828" stroke-width="6" stroke-linecap="round" />
                <text x="145" y="100" text-anchor="middle" font-size="14" fill="#c62828">X<tspan dy="-5" font-size="0.75em">E</tspan><tspan dy="5"></tspan></text>
                <!-- Y -->
                <path d="M 215 75 L 215 105 A 5 5 0 0 1 205 105" stroke="#1565c0" stroke-width="6" stroke-linecap="round" fill="none" />
                <text x="255" y="100" text-anchor="middle" font-size="14" fill="#1565c0">Y</text>

                <!-- 母本初级卵母细胞 -->
                <text x="600" y="40" text-anchor="middle" font-size="14" fill="#333333">初级卵母细胞</text>
                <circle cx="600" cy="95" r="40" stroke="#000000" stroke-width="2" fill="#fafafa" />
                <!-- Xe 1 -->
                <path d="M 585 75 L 585 115" stroke="#2e7d32" stroke-width="6" stroke-linecap="round" />
                <text x="545" y="100" text-anchor="middle" font-size="14" fill="#2e7d32">X<tspan dy="-5" font-size="0.75em">e</tspan><tspan dy="5"></tspan></text>
                <!-- Xe 2 -->
                <path d="M 615 75 L 615 115" stroke="#2e7d32" stroke-width="6" stroke-linecap="round" />
                <text x="655" y="100" text-anchor="middle" font-size="14" fill="#2e7d32">X<tspan dy="-5" font-size="0.75em">e</tspan><tspan dy="5"></tspan></text>
            </g>

            <!-- Step 1: Maternal Meiosis -->
            <g id="scene2-step1" class="fade hidden">
                <line x1="600" y1="145" x2="600" y2="245" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#scene2-arrow)" />
                <text x="615" y="195" text-anchor="start" font-size="14" fill="#333333">正常减数分裂</text>
                
                <!-- 卵细胞 -->
                <circle cx="600" cy="285" r="30" stroke="#000000" stroke-width="2" fill="#fafafa" />
                <path d="M 600 270 L 600 300" stroke="#2e7d32" stroke-width="6" stroke-linecap="round" />
                <text x="555" y="290" text-anchor="middle" font-size="14" fill="#2e7d32">X<tspan dy="-5" font-size="0.75em">e</tspan><tspan dy="5"></tspan></text>
                <text x="600" y="335" text-anchor="middle" font-size="14" fill="#333333">卵细胞</text>
            </g>

            <!-- Step 2: Paternal Meiosis I Abnormal -->
            <g id="scene2-step2" class="fade hidden">
                <line x1="200" y1="145" x2="200" y2="175" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#scene2-arrow)" />
                <text x="190" y="165" text-anchor="end" font-size="14" fill="#333333">减数第一次分裂异常</text>
                
                <!-- 次级精母细胞 -->
                <circle cx="200" cy="220" r="35" stroke="#000000" stroke-width="2" fill="#fafafa" />
                <path d="M 185 205 L 185 235" stroke="#c62828" stroke-width="6" stroke-linecap="round" />
                <text x="145" y="225" text-anchor="middle" font-size="14" fill="#c62828">X<tspan dy="-5" font-size="0.75em">E</tspan><tspan dy="5"></tspan></text>
                <path d="M 215 205 L 215 230 A 5 5 0 0 1 205 230" stroke="#1565c0" stroke-width="6" stroke-linecap="round" fill="none" />
                <text x="255" y="225" text-anchor="middle" font-size="14" fill="#1565c0">Y</text>
            </g>

            <!-- Step 3: Paternal Meiosis II Normal -->
            <g id="scene2-step3" class="fade hidden">
                <line x1="200" y1="265" x2="200" y2="295" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#scene2-arrow)" />
                <text x="190" y="285" text-anchor="end" font-size="14" fill="#333333">减数第二次分裂正常</text>
                
                <!-- 异常精子 -->
                <circle cx="200" cy="335" r="30" stroke="#000000" stroke-width="2" fill="#fafafa" />
                <path d="M 185 320 L 185 350" stroke="#c62828" stroke-width="6" stroke-linecap="round" />
                <text x="145" y="340" text-anchor="middle" font-size="14" fill="#c62828">X<tspan dy="-5" font-size="0.75em">E</tspan><tspan dy="5"></tspan></text>
                <path d="M 215 320 L 215 340 A 5 5 0 0 1 205 340" stroke="#1565c0" stroke-width="6" stroke-linecap="round" fill="none" />
                <text x="255" y="340" text-anchor="middle" font-size="14" fill="#1565c0">Y</text>
                <text x="200" y="385" text-anchor="middle" font-size="14" fill="#333333">异常精子</text>
            </g>

            <!-- Step 4: Fertilization -->
            <g id="scene2-step4" class="fade hidden">
                <line x1="230" y1="355" x2="350" y2="395" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#scene2-arrow)" />
                <line x1="570" y1="305" x2="450" y2="395" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#scene2-arrow)" />
                <text x="400" y="330" text-anchor="middle" font-size="14" fill="#333333">受精作用</text>
                
                <!-- 受精卵 -->
                <circle cx="400" cy="415" r="40" stroke="#000000" stroke-width="2" fill="#fafafa" />
                <path d="M 375 395 L 375 435" stroke="#c62828" stroke-width="6" stroke-linecap="round" />
                <text x="335" y="420" text-anchor="middle" font-size="14" fill="#c62828">X<tspan dy="-5" font-size="0.75em">E</tspan><tspan dy="5"></tspan></text>
                
                <path d="M 400 395 L 400 435" stroke="#2e7d32" stroke-width="6" stroke-linecap="round" />
                <text x="400" y="470" text-anchor="middle" font-size="14" fill="#2e7d32">X<tspan dy="-5" font-size="0.75em">e</tspan><tspan dy="5"></tspan></text>
                
                <path d="M 425 395 L 425 425 A 5 5 0 0 1 415 425" stroke="#1565c0" stroke-width="6" stroke-linecap="round" fill="none" />
                <text x="465" y="420" text-anchor="middle" font-size="14" fill="#1565c0">Y</text>
                
                <text x="400" y="365" text-anchor="middle" font-size="14" fill="#333333">受精卵</text>
            </g>
        </svg>

        <div id="scene2-controls">
            <button id="scene2-btn-prev" disabled>◀ 上一步</button>
            <div class="step-text" id="scene2-step-text">步骤 0 / 4</div>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 4;
        
        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        const stepText = document.getElementById('scene2-step-text');
        
        function updateView() {
            for (let i = 1; i <= maxStep; i++) {
                const group = document.getElementById(`scene2-step${i}`);
                if (i <= currentStep) {
                    group.classList.remove('hidden');
                    group.classList.add('visible');
                } else {
                    group.classList.remove('visible');
                    group.classList.add('hidden');
                }
            }
            
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
            stepText.textContent = `步骤 ${currentStep} / ${maxStep}`;
        }
        
        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateView();
            }
        });
        
        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateView();
            }
        });
        
        updateView();
    })();
    </script>
</body>
</html>
