<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button.active { background: #e0e0e0; border-color: #999; font-weight: bold; }
        .cell-bg { transition: all 0.3s; }
        .gene-dot { transition: all 0.3s; }
        .dynamic-label { font-size: 14px; text-anchor: middle; transition: opacity 0.3s; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- Cells -->
            <!-- Cell a -->
            <g transform="translate(100, 160)" id="scene1-cell-a">
                <circle cx="0" cy="0" r="45" fill="none" stroke="#000" stroke-width="1.5" class="cell-bg" id="scene1-bg-a"/>
                <line x1="-12" y1="-25" x2="-12" y2="15" stroke="#000" stroke-width="2"/>
                <circle cx="-12" cy="-10" r="3" fill="#000" class="gene-dot nuc-gene" id="scene1-nuc-a1"/>
                <line x1="12" y1="-25" x2="12" y2="15" stroke="#000" stroke-width="2"/>
                <circle cx="12" cy="-10" r="3" fill="#000" class="gene-dot nuc-gene" id="scene1-nuc-a2"/>
                <circle cx="0" cy="28" r="8" fill="none" stroke="#000" stroke-width="1.5"/>
                <circle cx="-6" cy="22" r="3" fill="#000" class="gene-dot cyto-gene" id="scene1-cyto-a"/>
                <text x="0" y="60" font-size="18" font-weight="bold" text-anchor="middle">a</text>
                <text x="0" y="85" class="dynamic-label" id="scene1-label-a"></text>
            </g>
            <!-- Cell b -->
            <g transform="translate(220, 160)" id="scene1-cell-b">
                <circle cx="0" cy="0" r="45" fill="none" stroke="#000" stroke-width="1.5" class="cell-bg" id="scene1-bg-b"/>
                <line x1="-12" y1="-25" x2="-12" y2="15" stroke="#000" stroke-width="2"/>
                <circle cx="-12" cy="-10" r="3" fill="#000" class="gene-dot nuc-gene" id="scene1-nuc-b1"/>
                <line x1="12" y1="-25" x2="12" y2="15" stroke="#000" stroke-width="2"/>
                <circle cx="0" cy="28" r="8" fill="none" stroke="#000" stroke-width="1.5"/>
                <circle cx="-6" cy="22" r="3" fill="#000" class="gene-dot cyto-gene" id="scene1-cyto-b"/>
                <text x="0" y="60" font-size="18" font-weight="bold" text-anchor="middle">b</text>
                <text x="0" y="85" class="dynamic-label" id="scene1-label-b"></text>
            </g>
            <!-- Cell c -->
            <g transform="translate(340, 160)" id="scene1-cell-c">
                <circle cx="0" cy="0" r="45" fill="none" stroke="#000" stroke-width="1.5" class="cell-bg" id="scene1-bg-c"/>
                <line x1="-12" y1="-25" x2="-12" y2="15" stroke="#000" stroke-width="2"/>
                <line x1="12" y1="-25" x2="12" y2="15" stroke="#000" stroke-width="2"/>
                <circle cx="0" cy="28" r="8" fill="none" stroke="#000" stroke-width="1.5"/>
                <circle cx="-6" cy="22" r="3" fill="#000" class="gene-dot cyto-gene" id="scene1-cyto-c"/>
                <text x="0" y="60" font-size="18" font-weight="bold" text-anchor="middle">c</text>
                <text x="0" y="85" class="dynamic-label" id="scene1-label-c"></text>
            </g>
            <!-- Cell d -->
            <g transform="translate(460, 160)" id="scene1-cell-d">
                <circle cx="0" cy="0" r="45" fill="none" stroke="#000" stroke-width="1.5" class="cell-bg" id="scene1-bg-d"/>
                <line x1="-12" y1="-25" x2="-12" y2="15" stroke="#000" stroke-width="2"/>
                <circle cx="-12" cy="-10" r="3" fill="#000" class="gene-dot nuc-gene" id="scene1-nuc-d1"/>
                <line x1="12" y1="-25" x2="12" y2="15" stroke="#000" stroke-width="2"/>
                <circle cx="12" cy="-10" r="3" fill="#000" class="gene-dot nuc-gene" id="scene1-nuc-d2"/>
                <circle cx="0" cy="28" r="8" fill="none" stroke="#000" stroke-width="1.5"/>
                <text x="0" y="60" font-size="18" font-weight="bold" text-anchor="middle">d</text>
                <text x="0" y="85" class="dynamic-label" id="scene1-label-d"></text>
            </g>
            <!-- Cell e -->
            <g transform="translate(580, 160)" id="scene1-cell-e">
                <circle cx="0" cy="0" r="45" fill="none" stroke="#000" stroke-width="1.5" class="cell-bg" id="scene1-bg-e"/>
                <line x1="-12" y1="-25" x2="-12" y2="15" stroke="#000" stroke-width="2"/>
                <circle cx="-12" cy="-10" r="3" fill="#000" class="gene-dot nuc-gene" id="scene1-nuc-e1"/>
                <line x1="12" y1="-25" x2="12" y2="15" stroke="#000" stroke-width="2"/>
                <circle cx="0" cy="28" r="8" fill="none" stroke="#000" stroke-width="1.5"/>
                <text x="0" y="60" font-size="18" font-weight="bold" text-anchor="middle">e</text>
                <text x="0" y="85" class="dynamic-label" id="scene1-label-e"></text>
            </g>
            <!-- Cell f -->
            <g transform="translate(700, 160)" id="scene1-cell-f">
                <circle cx="0" cy="0" r="45" fill="none" stroke="#000" stroke-width="1.5" class="cell-bg" id="scene1-bg-f"/>
                <line x1="-12" y1="-25" x2="-12" y2="15" stroke="#000" stroke-width="2"/>
                <line x1="12" y1="-25" x2="12" y2="15" stroke="#000" stroke-width="2"/>
                <circle cx="0" cy="28" r="8" fill="none" stroke="#000" stroke-width="1.5"/>
                <text x="0" y="60" font-size="18" font-weight="bold" text-anchor="middle">f</text>
                <text x="0" y="85" class="dynamic-label" id="scene1-label-f"></text>
            </g>

            <!-- Legends -->
            <g transform="translate(120, 320)">
                <line x1="0" y1="-10" x2="0" y2="10" stroke="#000" stroke-width="2"/>
                <text x="15" y="5" font-size="14">表示未整合基因S的2号染色体DNA</text>
            </g>
            <g transform="translate(120, 360)">
                <line x1="0" y1="-10" x2="0" y2="10" stroke="#000" stroke-width="2"/>
                <circle cx="0" cy="-2" r="3" fill="#000"/>
                <text x="15" y="5" font-size="14">表示已整合基因S的2号染色体DNA</text>
            </g>
            <g transform="translate(450, 320)">
                <circle cx="0" cy="0" r="8" fill="none" stroke="#000" stroke-width="1.5"/>
                <text x="15" y="5" font-size="14">表示未整合基因S的线粒体环状DNA</text>
            </g>
            <g transform="translate(450, 360)">
                <circle cx="0" cy="0" r="8" fill="none" stroke="#000" stroke-width="1.5"/>
                <circle cx="-6" cy="-6" r="3" fill="#000"/>
                <text x="15" y="5" font-size="14">表示已整合基因S的线粒体环状DNA</text>
            </g>

            <!-- Status Text -->
            <text x="400" y="420" font-size="16" text-anchor="middle" id="scene1-status-text">请点击下方按钮查看不同状态</text>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-state1">核基因抗性</button>
            <button id="scene1-btn-state2">质基因抗性</button>
            <button id="scene1-btn-state3">理想种子</button>
        </div>
    </div>
    <script>
    (function() {
        const btn1 = document.getElementById('scene1-btn-state1');
        const btn2 = document.getElementById('scene1-btn-state2');
        const btn3 = document.getElementById('scene1-btn-state3');
        const statusText = document.getElementById('scene1-status-text');

        function resetState() {
            // Reset all gene dots
            document.querySelectorAll('.gene-dot').forEach(dot => {
                dot.setAttribute('fill', '#000');
                dot.setAttribute('r', '3');
            });
            // Reset all cell backgrounds
            document.querySelectorAll('.cell-bg').forEach(bg => {
                bg.setAttribute('stroke', '#000');
                bg.setAttribute('stroke-width', '1.5');
                bg.setAttribute('fill', 'none');
            });
            // Reset dynamic labels
            document.querySelectorAll('.dynamic-label').forEach(label => {
                label.textContent = '';
                label.removeAttribute('font-weight');
            });
            // Reset buttons
            btn1.classList.remove('active');
            btn2.classList.remove('active');
            btn3.classList.remove('active');
        }

        btn1.addEventListener('click', () => {
            resetState();
            btn1.classList.add('active');
            statusText.textContent = '状态1：核基因抗性。细胞 a, b, d, e 含有核基因S，表现为抗性且遗传稳定。';
            
            // Highlight nuclear genes
            ['a1', 'a2', 'b1', 'd1', 'd2', 'e1'].forEach(id => {
                const dot = document.getElementById('scene1-nuc-' + id);
                if (dot) {
                    dot.setAttribute('fill', '#c62828');
                    dot.setAttribute('r', '4');
                }
            });

            // Set labels
            const labelA = document.getElementById('scene1-label-a');
            labelA.textContent = '核纯合(SS)';
            labelA.setAttribute('fill', '#c62828');

            const labelD = document.getElementById('scene1-label-d');
            labelD.textContent = '核纯合(SS)';
            labelD.setAttribute('fill', '#c62828');

            const labelB = document.getElementById('scene1-label-b');
            labelB.textContent = '核杂合(S-)';
            labelB.setAttribute('fill', '#c62828');

            const labelE = document.getElementById('scene1-label-e');
            labelE.textContent = '核杂合(S-)';
            labelE.setAttribute('fill', '#c62828');
        });

        btn2.addEventListener('click', () => {
            resetState();
            btn2.classList.add('active');
            statusText.textContent = '状态2：质基因抗性。细胞 a, b, c 含有质基因S，表现为抗性但会逐代减弱。';

            // Highlight cytoplasmic genes
            ['a', 'b', 'c'].forEach(id => {
                const dot = document.getElementById('scene1-cyto-' + id);
                if (dot) {
                    dot.setAttribute('fill', '#1565c0');
                    dot.setAttribute('r', '4');
                }
            });

            // Set labels
            ['a', 'b', 'c'].forEach(id => {
                const label = document.getElementById('scene1-label-' + id);
                label.textContent = '质抗性(减弱)';
                label.setAttribute('fill', '#1565c0');
            });
        });

        btn3.addEventListener('click', () => {
            resetState();
            btn3.classList.add('active');
            statusText.textContent = '状态3：理想种子。细胞 d 核基因为纯合子且无质基因干扰，符合长期种植要求。';

            // Highlight cell d
            const bgD = document.getElementById('scene1-bg-d');
            bgD.setAttribute('stroke', '#2e7d32');
            bgD.setAttribute('stroke-width', '4');
            bgD.setAttribute('fill', 'rgba(46, 125, 50, 0.2)');

            // Set label
            const labelD = document.getElementById('scene1-label-d');
            labelD.textContent = '理想种子';
            labelD.setAttribute('fill', '#2e7d32');
            labelD.setAttribute('font-weight', 'bold');
        });

        // Initialize state 1
        btn1.click();
    })();
    </script>
</body>
</html>
