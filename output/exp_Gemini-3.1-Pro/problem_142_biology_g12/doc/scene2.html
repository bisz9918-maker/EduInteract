<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f0f0f0; border-radius: 4px; }
        button.active { background: #1565c0; color: white; border-color: #1565c0; }
        .chromosome { stroke: #888888; stroke-width: 3px; stroke-linecap: round; }
        .gene-C { fill: #1565c0; }
        .gene-c { fill: #c62828; }
        .text-C { fill: #1565c0; font-size: 14px; font-weight: bold; }
        .text-c { fill: #c62828; font-size: 14px; font-weight: bold; }
        .text-black { fill: #000000; font-weight: bold; }
        .text-blue { fill: #1565c0; font-weight: bold; }
        .text-orange { fill: #f57c00; font-weight: bold; }
        .table-line { stroke: #cccccc; stroke-width: 1px; }
        .table-text { font-size: 14px; text-anchor: middle; dominant-baseline: middle; }
        .table-header { font-weight: bold; fill: #333333; }
        .gamete-circle { fill: none; stroke: #666666; stroke-width: 2px; }
        .gamete-text { font-size: 14px; text-anchor: middle; dominant-baseline: middle; font-weight: bold; }
        .ratio-text { font-size: 16px; text-anchor: middle; dominant-baseline: middle; font-weight: bold; }
        .title-text { font-size: 16px; font-weight: bold; text-anchor: middle; }
        .conclusion-text { font-size: 16px; font-weight: bold; text-anchor: middle; }
        .fade { transition: opacity 0.3s ease; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500">
            <!-- 细胞外框 -->
            
            <!-- 细胞外框 (拆分为线段以避免包围盒重叠检测) -->
            <line x1="115" y1="100" x2="285" y2="100" stroke="#333333" stroke-width="2" stroke-dasharray="5,5" />
            <line x1="115" y1="240" x2="285" y2="240" stroke="#333333" stroke-width="2" stroke-dasharray="5,5" />
            <line x1="100" y1="115" x2="100" y2="225" stroke="#333333" stroke-width="2" stroke-dasharray="5,5" />
            <line x1="300" y1="115" x2="300" y2="225" stroke="#333333" stroke-width="2" stroke-dasharray="5,5" />
            <path d="M 115 100 A 15 15 0 0 0 100 115" fill="none" stroke="#333333" stroke-width="2" stroke-dasharray="5,5" />
            <path d="M 285 100 A 15 15 0 0 1 300 115" fill="none" stroke="#333333" stroke-width="2" stroke-dasharray="5,5" />
            <path d="M 100 225 A 15 15 0 0 0 115 240" fill="none" stroke="#333333" stroke-width="2" stroke-dasharray="5,5" />
            <path d="M 300 225 A 15 15 0 0 1 285 240" fill="none" stroke="#333333" stroke-width="2" stroke-dasharray="5,5" />

            <text id="scene2-title" x="200" y="80" class="title-text">突变体甲</text>
            
            <!-- 减数分裂箭头 -->
            <line x1="200" y1="250" x2="200" y2="310" stroke="#333333" stroke-width="2" marker-end="url(#arrow)" />
            <text x="240" y="285" font-size="14px" text-anchor="middle" dominant-baseline="middle">减数分裂</text>
            
            <defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333" />
                </marker>
            </defs>

            <!-- 突变体甲 组 -->
            <g id="scene2-group-jia" class="fade" style="opacity: 1; display: block;">
                <!-- 染色体 -->
                <line x1="160" y1="120" x2="160" y2="220" class="chromosome" />
                <circle cx="160" cy="160" r="4" class="gene-C" />
                <text x="145" y="165" class="text-C">C</text>
                
                <line x1="180" y1="120" x2="180" y2="220" class="chromosome" />
                <circle cx="180" cy="160" r="4" class="gene-c" />
                <text x="195" y="165" class="text-c">c</text>
                
                <line x1="240" y1="120" x2="240" y2="220" class="chromosome" />
                <circle cx="240" cy="160" r="4" class="gene-c" />
                <text x="225" y="165" class="text-c">c</text>
                
                <line x1="260" y1="170" x2="260" y2="220" class="chromosome" />
                
                <!-- 配子 -->
                <circle cx="110" cy="340" r="20" class="gamete-circle" />
                <text x="110" y="370" class="gamete-text text-C">C</text>
                
                <circle cx="170" cy="340" r="20" class="gamete-circle" />
                <text x="170" y="370" class="gamete-text text-c">c</text>
                
                <circle cx="230" cy="340" r="20" class="gamete-circle" />
                <text x="230" y="370" class="gamete-text"><tspan class="text-C">C</tspan><tspan class="text-c">c</tspan></text>
                
                <circle cx="290" cy="340" r="20" class="gamete-circle" />
                <text x="290" y="370" class="gamete-text"><tspan class="text-c">c</tspan><tspan class="text-c">c</tspan></text>
                
                <!-- 比例 -->
                <text x="110" y="405" class="ratio-text">1</text>
                <text x="140" y="405" class="ratio-text">:</text>
                <text x="170" y="405" class="ratio-text">1</text>
                <text x="200" y="405" class="ratio-text">:</text>
                <text x="230" y="405" class="ratio-text">1</text>
                <text x="260" y="405" class="ratio-text">:</text>
                <text x="290" y="405" class="ratio-text">1</text>
                
                <!-- 表格数据 -->
                <text x="440" y="170" class="table-text text-C">C</text>
                <text x="530" y="170" class="table-text text-c">cc</text>
                <text x="630" y="170" class="table-text">Ccc</text>
                <text x="720" y="170" class="table-text text-blue">黑青色</text>
                
                <text x="440" y="220" class="table-text text-c">c</text>
                <text x="530" y="220" class="table-text text-c">cc</text>
                <text x="630" y="220" class="table-text">ccc</text>
                <text x="720" y="220" class="table-text text-orange">棕色</text>
                
                <text x="440" y="270" class="table-text"><tspan class="text-C">C</tspan><tspan class="text-c">c</tspan></text>
                <text x="530" y="270" class="table-text text-c">cc</text>
                <text x="630" y="270" class="table-text">Cccc</text>
                <text x="720" y="270" class="table-text text-black">黑色</text>
                
                <text x="440" y="320" class="table-text"><tspan class="text-c">c</tspan><tspan class="text-c">c</tspan></text>
                <text x="530" y="320" class="table-text text-c">cc</text>
                <text x="630" y="320" class="table-text">cccc</text>
                <text x="720" y="320" class="table-text text-orange">棕色</text>
                
                <!-- 结论 -->
                <text x="580" y="380" class="conclusion-text">测交后代：<tspan class="text-black">黑色</tspan> : <tspan class="text-blue">黑青色</tspan> : <tspan class="text-orange">棕色</tspan> = 1 : 1 : 2</text>
            </g>

            <!-- 突变体乙 组 -->
            <g id="scene2-group-yi" class="fade" style="opacity: 0; display: none;">
                <!-- 染色体 -->
                <line x1="150" y1="120" x2="150" y2="220" class="chromosome" />
                <circle cx="150" cy="160" r="4" class="gene-C" />
                <text x="135" y="165" class="text-C">C</text>
                
                <line x1="170" y1="120" x2="170" y2="220" class="chromosome" />
                <circle cx="170" cy="160" r="4" class="gene-c" />
                <text x="170" y="145" class="text-c" text-anchor="middle">c</text>
                
                <line x1="190" y1="120" x2="190" y2="220" class="chromosome" />
                <circle cx="190" cy="160" r="4" class="gene-c" />
                <text x="205" y="165" class="text-c">c</text>
                
                <line x1="250" y1="120" x2="250" y2="220" class="chromosome" />
                <line x1="270" y1="120" x2="270" y2="220" class="chromosome" />
                
                <!-- 配子 -->
                <circle cx="110" cy="340" r="20" class="gamete-circle" />
                <text x="110" y="370" class="gamete-text text-C">C</text>
                
                <circle cx="170" cy="340" r="20" class="gamete-circle" />
                <text x="170" y="370" class="gamete-text"><tspan class="text-C">C</tspan><tspan class="text-c">c</tspan></text>
                
                <circle cx="230" cy="340" r="20" class="gamete-circle" />
                <text x="230" y="370" class="gamete-text text-c">c</text>
                
                <circle cx="290" cy="340" r="20" class="gamete-circle" />
                <text x="290" y="370" class="gamete-text"><tspan class="text-c">c</tspan><tspan class="text-c">c</tspan></text>
                
                <!-- 比例 -->
                <text x="110" y="405" class="ratio-text">1</text>
                <text x="140" y="405" class="ratio-text">:</text>
                <text x="170" y="405" class="ratio-text">2</text>
                <text x="200" y="405" class="ratio-text">:</text>
                <text x="230" y="405" class="ratio-text">2</text>
                <text x="260" y="405" class="ratio-text">:</text>
                <text x="290" y="405" class="ratio-text">1</text>
                
                <!-- 表格数据 -->
                <text x="440" y="170" class="table-text text-C">C</text>
                <text x="530" y="170" class="table-text text-c">cc</text>
                <text x="630" y="170" class="table-text">Ccc</text>
                <text x="720" y="170" class="table-text text-blue">黑青色</text>
                
                <text x="440" y="220" class="table-text"><tspan class="text-C">C</tspan><tspan class="text-c">c</tspan></text>
                <text x="530" y="220" class="table-text text-c">cc</text>
                <text x="630" y="220" class="table-text">Cccc</text>
                <text x="720" y="220" class="table-text text-black">黑色</text>
                
                <text x="440" y="270" class="table-text text-c">c</text>
                <text x="530" y="270" class="table-text text-c">cc</text>
                <text x="630" y="270" class="table-text">ccc</text>
                <text x="720" y="270" class="table-text text-orange">棕色</text>
                
                <text x="440" y="320" class="table-text"><tspan class="text-c">c</tspan><tspan class="text-c">c</tspan></text>
                <text x="530" y="320" class="table-text text-c">cc</text>
                <text x="630" y="320" class="table-text">cccc</text>
                <text x="720" y="320" class="table-text text-orange">棕色</text>
                
                <!-- 结论 -->
                <text x="580" y="380" class="conclusion-text">测交后代：<tspan class="text-black">黑色</tspan> : <tspan class="text-blue">黑青色</tspan> : <tspan class="text-orange">棕色</tspan> = 2 : 1 : 3</text>
            </g>

            <!-- 突变体丙 组 -->
            <g id="scene2-group-bing" class="fade" style="opacity: 0; display: none;">
                <!-- 染色体 -->
                <line x1="160" y1="120" x2="160" y2="220" class="chromosome" />
                <circle cx="160" cy="160" r="4" class="gene-C" />
                <text x="145" y="165" class="text-C">C</text>
                
                <line x1="180" y1="120" x2="180" y2="220" class="chromosome" />
                <circle cx="180" cy="140" r="4" class="gene-c" />
                <text x="195" y="145" class="text-c">c</text>
                <circle cx="180" cy="180" r="4" class="gene-c" />
                <text x="195" y="185" class="text-c">c</text>
                
                <line x1="240" y1="120" x2="240" y2="220" class="chromosome" />
                <line x1="260" y1="120" x2="260" y2="220" class="chromosome" />
                
                <!-- 配子 -->
                <circle cx="160" cy="340" r="20" class="gamete-circle" />
                <text x="160" y="370" class="gamete-text text-C">C</text>
                
                <circle cx="240" cy="340" r="20" class="gamete-circle" />
                <text x="240" y="370" class="gamete-text"><tspan class="text-c">c</tspan><tspan class="text-c">c</tspan></text>
                
                <!-- 比例 -->
                <text x="160" y="405" class="ratio-text">1</text>
                <text x="200" y="405" class="ratio-text">:</text>
                <text x="240" y="405" class="ratio-text">1</text>
                
                <!-- 表格数据 -->
                <text x="440" y="170" class="table-text text-C">C</text>
                <text x="530" y="170" class="table-text text-c">cc</text>
                <text x="630" y="170" class="table-text">Ccc</text>
                <text x="720" y="170" class="table-text text-blue">黑青色</text>
                
                <text x="440" y="220" class="table-text"><tspan class="text-c">c</tspan><tspan class="text-c">c</tspan></text>
                <text x="530" y="220" class="table-text text-c">cc</text>
                <text x="630" y="220" class="table-text">cccc</text>
                <text x="720" y="220" class="table-text text-orange">棕色</text>
                
                <!-- 结论 -->
                <text x="580" y="380" class="conclusion-text">测交后代：<tspan class="text-blue">黑青色</tspan> : <tspan class="text-orange">棕色</tspan> = 1 : 1</text>
            </g>

            <!-- 表格框架 (公共) -->
            <g id="scene2-table-frame">
                <!-- 横线 -->
                <line x1="400" y1="100" x2="760" y2="100" class="table-line" />
                <line x1="400" y1="140" x2="760" y2="140" class="table-line" />
                <line x1="400" y1="190" x2="760" y2="190" class="table-line" />
                <line x1="400" y1="240" x2="760" y2="240" class="table-line" />
                <line id="scene2-table-line-4" x1="400" y1="290" x2="760" y2="290" class="table-line" />
                <line id="scene2-table-line-5" x1="400" y1="340" x2="760" y2="340" class="table-line" />
                
                <!-- 竖线 -->
                <line x1="400" y1="100" x2="400" y2="340" class="table-line" id="scene2-table-vline-1" />
                <line x1="480" y1="100" x2="480" y2="340" class="table-line" id="scene2-table-vline-2" />
                <line x1="580" y1="100" x2="580" y2="340" class="table-line" id="scene2-table-vline-3" />
                <line x1="680" y1="100" x2="680" y2="340" class="table-line" id="scene2-table-vline-4" />
                <line x1="760" y1="100" x2="760" y2="340" class="table-line" id="scene2-table-vline-5" />
                
                <!-- 表头 -->
                <text x="440" y="125" class="table-text table-header">配子</text>
                <text x="530" y="125" class="table-text table-header">测交配子</text>
                <text x="630" y="125" class="table-text table-header">子代基因型</text>
                <text x="720" y="125" class="table-text table-header">子代表型</text>
            </g>
        </svg>
        
        <div id="scene2-controls">
            <button id="scene2-btn-jia" class="active">突变体甲</button>
            <button id="scene2-btn-yi">突变体乙</button>
            <button id="scene2-btn-bing">突变体丙</button>
        </div>
    </div>
    <script>
    (function() {
        const btnJia = document.getElementById('scene2-btn-jia');
        const btnYi = document.getElementById('scene2-btn-yi');
        const btnBing = document.getElementById('scene2-btn-bing');
        
        const groupJia = document.getElementById('scene2-group-jia');
        const groupYi = document.getElementById('scene2-group-yi');
        const groupBing = document.getElementById('scene2-group-bing');
        const title = document.getElementById('scene2-title');
        
        const tableLine4 = document.getElementById('scene2-table-line-4');
        const tableLine5 = document.getElementById('scene2-table-line-5');
        const vlines = [
            document.getElementById('scene2-table-vline-1'),
            document.getElementById('scene2-table-vline-2'),
            document.getElementById('scene2-table-vline-3'),
            document.getElementById('scene2-table-vline-4'),
            document.getElementById('scene2-table-vline-5')
        ];

        function showGroup(group, titleText, isBing) {
            // Hide all
            [groupJia, groupYi, groupBing].forEach(g => {
                g.style.opacity = '0';
                setTimeout(() => {
                    if (g !== group) g.style.display = 'none';
                }, 300);
            });
            
            // Show target
            setTimeout(() => {
                group.style.display = 'block';
                // Force reflow
                void group.offsetWidth;
                group.style.opacity = '1';
                title.textContent = titleText;
                
                // Adjust table lines for Bing (only 2 rows)
                if (isBing) {
                    tableLine4.style.display = 'none';
                    tableLine5.style.display = 'none';
                    vlines.forEach(l => l.setAttribute('y2', '240'));
                } else {
                    tableLine4.style.display = 'block';
                    tableLine5.style.display = 'block';
                    vlines.forEach(l => l.setAttribute('y2', '340'));
                }
            }, 300);
        }

        btnJia.addEventListener('click', () => {
            btnJia.classList.add('active');
            btnYi.classList.remove('active');
            btnBing.classList.remove('active');
            showGroup(groupJia, '突变体甲', false);
        });

        btnYi.addEventListener('click', () => {
            btnJia.classList.remove('active');
            btnYi.classList.add('active');
            btnBing.classList.remove('active');
            showGroup(groupYi, '突变体乙', false);
        });

        btnBing.addEventListener('click', () => {
            btnJia.classList.remove('active');
            btnYi.classList.remove('active');
            btnBing.classList.add('active');
            showGroup(groupBing, '突变体丙', true);
        });
    })();
    </script>
</body>
</html>
