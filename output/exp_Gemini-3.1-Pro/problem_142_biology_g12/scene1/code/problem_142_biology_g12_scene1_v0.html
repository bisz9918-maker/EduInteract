<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        button { padding: 6px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .step-indicator { font-size: 14px; font-weight: bold; min-width: 40px; text-align: center; }
        
        /* SVG text styles */
        text { font-family: sans-serif; }
        .title { font-size: 18px; font-weight: bold; }
        .normal-text { font-size: 16px; }
        .gene-b { fill: #2e7d32; font-weight: bold; }
        .gene-c { fill: #1565c0; font-weight: bold; }
        .gene-a { fill: #c62828; font-weight: bold; }
        
        /* Transitions */
        .anim-element { transition: opacity 0.3s ease; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500">
            <defs>
                <marker id="arrow-black" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#000" />
                </marker>
                <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32" />
                </marker>
                <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0" />
                </marker>
                <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828" />
                </marker>
            </defs>

            <!-- Step 0: Base Pathway -->
            <!-- White Box (using lines to avoid bounding box overlap with text) -->
            <line x1="50" y1="250" x2="130" y2="250" stroke="#000" stroke-width="1.5" />
            <line x1="130" y1="250" x2="130" y2="290" stroke="#000" stroke-width="1.5" />
            <line x1="130" y1="290" x2="50" y2="290" stroke="#000" stroke-width="1.5" />
            <line x1="50" y1="290" x2="50" y2="250" stroke="#000" stroke-width="1.5" />
            <text x="90" y="275" text-anchor="middle" dominant-baseline="middle" class="normal-text">白色物质</text>
            
            <!-- Brown Box -->
            <line x1="190" y1="250" x2="270" y2="250" stroke="#000" stroke-width="1.5" />
            <line x1="270" y1="250" x2="270" y2="290" stroke="#000" stroke-width="1.5" />
            <line x1="270" y1="290" x2="190" y2="290" stroke="#000" stroke-width="1.5" />
            <line x1="190" y1="290" x2="190" y2="250" stroke="#000" stroke-width="1.5" />
            <text x="230" y="275" text-anchor="middle" dominant-baseline="middle" class="normal-text">棕色物质</text>
            
            <!-- Black Box -->
            <line x1="330" y1="250" x2="410" y2="250" stroke="#000" stroke-width="1.5" />
            <line x1="410" y1="250" x2="410" y2="290" stroke="#000" stroke-width="1.5" />
            <line x1="410" y1="290" x2="330" y2="290" stroke="#000" stroke-width="1.5" />
            <line x1="330" y1="290" x2="330" y2="250" stroke="#000" stroke-width="1.5" />
            <text x="370" y="275" text-anchor="middle" dominant-baseline="middle" class="normal-text">黑色物质</text>
            
            <!-- Arrows -->
            <line x1="130" y1="270" x2="185" y2="270" stroke="#000" stroke-width="2" marker-end="url(#arrow-black)" />
            <line x1="270" y1="270" x2="325" y2="270" stroke="#000" stroke-width="2" marker-end="url(#arrow-black)" />
            
            <!-- Enzyme Labels -->
            <text x="160" y="255" text-anchor="middle" class="normal-text">酶</text>
            <text x="300" y="255" text-anchor="middle" class="normal-text">酶</text>

            <!-- Right Side Title -->
            <text x="450" y="45" class="title">基因型与表型推导</text>

            <!-- Step 1: Genes B and C -->
            <g id="scene1-step1-group" class="anim-element" style="opacity: 0; display: none;">
                <!-- Gene B -->
                <text x="160" y="175" text-anchor="middle" class="normal-text gene-b">B</text>
                <line x1="160" y1="185" x2="160" y2="240" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow-green)" />
                
                <!-- Gene C -->
                <text x="300" y="175" text-anchor="middle" class="normal-text gene-c">C</text>
                <line x1="300" y1="185" x2="300" y2="240" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-blue)" />
                
                <!-- Text -->
                <text x="450" y="85" class="normal-text">无A基因 (aa) 时：</text>
                <text x="470" y="125" class="normal-text">aa <tspan class="gene-b">B_</tspan> <tspan class="gene-c">C_</tspan> → 黑色</text>
                <text x="470" y="165" class="normal-text">aa <tspan class="gene-b">B_</tspan> cc → 棕色</text>
                <text x="470" y="205" class="normal-text">aa bb __ → 白色</text>
            </g>

            <!-- Step 2: Gene A -->
            <g id="scene1-step2-group" class="anim-element" style="opacity: 0; display: none;">
                <!-- Gene A -->
                <text x="60" y="175" text-anchor="middle" class="normal-text gene-a">A</text>
                <line x1="75" y1="170" x2="145" y2="170" stroke="#c62828" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-red)" />
                <text x="110" y="160" text-anchor="middle" class="normal-text gene-a" font-size="14">抑制</text>
                
                <!-- Text -->
                <text x="450" y="255" class="normal-text">有A基因 (<tspan class="gene-a">A_</tspan>) 时：</text>
                <text x="470" y="295" class="normal-text"><tspan class="gene-a">A_</tspan> __ __ → 白色 (A抑制B)</text>
            </g>

            <!-- Step 3: Questions -->
            <g id="scene1-step3-group" class="anim-element" style="opacity: 0; display: none;">
                <text x="450" y="345" class="normal-text">(1) 纯合棕色猪: aa<tspan class="gene-b">BB</tspan>cc</text>
                <text x="450" y="385" class="normal-text">(2) 正常黑色猪单杂合交配:</text>
                <text x="470" y="425" class="normal-text">aa<tspan class="gene-b">BB</tspan>Cc × aa<tspan class="gene-b">BB</tspan>Cc → 黑色:棕色 = 3:1</text>
                <text x="470" y="465" class="normal-text">aaBb<tspan class="gene-c">CC</tspan> × aaBb<tspan class="gene-c">CC</tspan> → 黑色:白色 = 3:1</text>
            </g>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <div id="scene1-step-indicator" class="step-indicator">0 / 3</div>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 3;
        
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const indicator = document.getElementById('scene1-step-indicator');
        
        const step1Group = document.getElementById('scene1-step1-group');
        const step2Group = document.getElementById('scene1-step2-group');
        const step3Group = document.getElementById('scene1-step3-group');
        
        const groups = [
            { el: step1Group, step: 1 },
            { el: step2Group, step: 2 },
            { el: step3Group, step: 3 }
        ];
        
        function updateScene() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
            indicator.textContent = currentStep + ' / ' + maxStep;
            
            groups.forEach(g => {
                if (currentStep >= g.step) {
                    g.el.style.display = '';
                    // force reflow
                    void g.el.offsetWidth;
                    g.el.style.opacity = '1';
                } else {
                    g.el.style.opacity = '0';
                    setTimeout(() => {
                        if (currentStep < g.step) {
                            g.el.style.display = 'none';
                        }
                    }, 300);
                }
            });
        }
        
        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });
        
        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });
        
        // Initialize
        updateScene();
    })();
    </script>
</body>
</html>
