<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>遗传病推导</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:hover { background: #e9e9e9; }
        button:disabled { cursor: not-allowed; opacity: 0.5; }
        
        .node, .link { transition: stroke 0.3s, stroke-width 0.3s; }
        .highlight-red { stroke: #c62828 !important; stroke-width: 4px !important; }
        .highlight-blue { stroke: #1565c0 !important; stroke-width: 4px !important; }
        
        .text-label { font-size: 14px; text-anchor: middle; dominant-baseline: middle; }
        .text-gen { font-size: 16px; font-weight: bold; text-anchor: middle; dominant-baseline: middle; }
        .text-title { font-size: 20px; font-weight: bold; text-anchor: middle; dominant-baseline: middle; }
        .text-legend { font-size: 14px; dominant-baseline: middle; }
        
        #scene1-text-content {
            font-size: 16px;
            line-height: 1.6;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
            border-left: 6px solid #999;
            height: 100%;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500">
            <defs>
                <pattern id="pattern-jia" width="6" height="6" patternUnits="userSpaceOnUse">
                    <path d="M 6,0 L 0,6 M -1,1 L 1,-1 M 5,7 L 7,5" stroke="black" stroke-width="1"/>
                </pattern>
                <pattern id="pattern-yi" width="6" height="6" patternUnits="userSpaceOnUse">
                    <path d="M 6,0 L 0,6 M -1,1 L 1,-1 M 5,7 L 7,5 M 0,0 L 6,6 M -1,5 L 1,7 M 5,-1 L 7,1" stroke="black" stroke-width="1"/>
                </pattern>
            </defs>
            
            <!-- Title -->
            <text x="400" y="40" class="text-title">甲、乙两病遗传类型的推导</text>
            
            <!-- Generations -->
            <text x="40" y="100" class="text-gen">I</text>
            <text x="40" y="220" class="text-gen">II</text>
            <text x="40" y="340" class="text-gen">III</text>
            
            <!-- Links -->
            <g stroke="black" stroke-width="2" fill="none">
                <!-- I generation -->
                <path id="scene1-link-I1-I2" class="link" d="M 215 100 L 285 100" />
                <path id="scene1-link-I-down" class="link" d="M 250 100 L 250 160" />
                <path id="scene1-link-II-horiz" class="link" d="M 180 160 L 320 160" />
                <path id="scene1-link-II4-up" class="link" d="M 180 160 L 180 205" />
                <path id="scene1-link-II5-up" class="link" d="M 250 160 L 250 205" />
                <path id="scene1-link-II6-up" class="link" d="M 320 160 L 320 205" />
                
                <!-- II generation left -->
                <path id="scene1-link-II3-II4" class="link" d="M 115 220 L 165 220" />
                <path id="scene1-link-II34-down" class="link" d="M 140 220 L 140 325" />
                
                <!-- II generation right -->
                <path id="scene1-link-II6-II7" class="link" d="M 335 220 L 385 220" />
                <path id="scene1-link-II67-down" class="link" d="M 360 220 L 360 325" />
            </g>
            
            <!-- Nodes -->
            <g stroke="black" stroke-width="1.5">
                <!-- I-1 -->
                <rect id="scene1-node-I1" class="node" x="185" y="85" width="30" height="30" fill="url(#pattern-jia)" />
                <text x="200" y="135" class="text-label" stroke="none" fill="black">1</text>
                
                <!-- I-2 -->
                <circle id="scene1-node-I2" class="node" cx="300" cy="100" r="15" fill="#ffffff" />
                <text x="300" y="135" class="text-label" stroke="none" fill="black">2</text>
                
                <!-- II-3 -->
                <rect id="scene1-node-II3" class="node" x="85" y="205" width="30" height="30" fill="url(#pattern-jia)" />
                <text x="100" y="255" class="text-label" stroke="none" fill="black">3</text>
                
                <!-- II-4 -->
                <circle id="scene1-node-II4" class="node" cx="180" cy="220" r="15" fill="#ffffff" />
                <text x="180" y="255" class="text-label" stroke="none" fill="black">4</text>
                
                <!-- II-5 -->
                <circle id="scene1-node-II5" class="node" cx="250" cy="220" r="15" fill="url(#pattern-yi)" />
                <text x="250" y="255" class="text-label" stroke="none" fill="black">5</text>
                
                <!-- II-6 -->
                <circle id="scene1-node-II6" class="node" cx="320" cy="220" r="15" fill="#ffffff" />
                <text x="320" y="255" class="text-label" stroke="none" fill="black">6</text>
                
                <!-- II-7 -->
                <rect id="scene1-node-II7" class="node" x="385" y="205" width="30" height="30" fill="#ffffff" />
                <text x="400" y="255" class="text-label" stroke="none" fill="black">7</text>
                
                <!-- III-8 -->
                <text x="140" y="340" class="text-label" stroke="none" fill="black" font-size="24" font-weight="bold">?</text>
                <text x="140" y="375" class="text-label" stroke="none" fill="black">8</text>
                
                <!-- III-9 -->
                <rect id="scene1-node-III9" class="node" x="345" y="325" width="30" height="30" fill="#ffffff" />
                <text x="360" y="375" class="text-label" stroke="none" fill="black">9</text>
            </g>
            
            <!-- Legend -->
            <g stroke="black" stroke-width="1.5">
                <rect x="485" y="65" width="30" height="30" fill="url(#pattern-jia)" />
                <text x="525" y="80" class="text-legend" stroke="none" fill="black">患甲病男性</text>
                
                <circle cx="500" cy="130" r="15" fill="url(#pattern-yi)" />
                <text x="525" y="130" class="text-legend" stroke="none" fill="black">患乙病女性</text>
                
                <rect x="465" y="165" width="30" height="30" fill="#ffffff" />
                <circle cx="515" cy="180" r="15" fill="#ffffff" />
                <text x="540" y="180" class="text-legend" stroke="none" fill="black">正常男、女</text>
            </g>
            
            <!-- Text Area -->
            <foreignObject x="460" y="220" width="320" height="200">
                <div xmlns="http://www.w3.org/1999/xhtml" id="scene1-text-content">
                    请点击「下一步」开始推导。
                </div>
            </foreignObject>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 4;
        
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const textContent = document.getElementById('scene1-text-content');
        
        const nodes = {
            I1: document.getElementById('scene1-node-I1'),
            I2: document.getElementById('scene1-node-I2'),
            II4: document.getElementById('scene1-node-II4'),
            II5: document.getElementById('scene1-node-II5'),
            II6: document.getElementById('scene1-node-II6')
        };
        
        const links = {
            I1_I2: document.getElementById('scene1-link-I1-I2'),
            I_down: document.getElementById('scene1-link-I-down'),
            II_horiz: document.getElementById('scene1-link-II-horiz'),
            II4_up: document.getElementById('scene1-link-II4-up'),
            II5_up: document.getElementById('scene1-link-II5-up'),
            II6_up: document.getElementById('scene1-link-II6-up')
        };
        
        function clearHighlights() {
            Object.values(nodes).forEach(node => {
                node.classList.remove('highlight-red', 'highlight-blue');
            });
            Object.values(links).forEach(link => {
                link.classList.remove('highlight-red', 'highlight-blue');
            });
            textContent.style.borderColor = '#999';
        }
        
        function updateState() {
            clearHighlights();
            
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
            
            switch(currentStep) {
                case 0:
                    textContent.innerHTML = '请点击「下一步」开始推导。';
                    break;
                case 1:
                    nodes.I1.classList.add('highlight-red');
                    nodes.I2.classList.add('highlight-red');
                    nodes.II5.classList.add('highlight-red');
                    links.I1_I2.classList.add('highlight-red');
                    links.I_down.classList.add('highlight-red');
                    links.II_horiz.classList.add('highlight-red');
                    links.II5_up.classList.add('highlight-red');
                    
                    textContent.style.borderColor = '#c62828';
                    textContent.innerHTML = '<b>步骤1：寻找隐性病</b><br/><br/>观察个体 I-1、I-2 和 II-5。<br/>I-1 和 I-2 均不患乙病，但生出了患乙病的女儿 II-5。<br/><br/>根据“<b>无中生有为隐性</b>”，推断出<b>乙病为隐性遗传病</b>。';
                    break;
                case 2:
                    textContent.style.borderColor = '#999';
                    textContent.innerHTML = '<b>步骤2：确定甲、乙病类型</b><br/><br/>题干已知：“一种是显性遗传病，另一种是伴性遗传病”。<br/><br/>既然乙病是隐性，那么<b>甲病必然是显性遗传病</b>。<br/>同时，<b>乙病为伴性遗传病</b>（即伴X染色体隐性遗传）。';
                    break;
                case 3:
                    nodes.I1.classList.add('highlight-blue');
                    nodes.II4.classList.add('highlight-blue');
                    nodes.II6.classList.add('highlight-blue');
                    links.I1_I2.classList.add('highlight-blue');
                    links.I_down.classList.add('highlight-blue');
                    links.II_horiz.classList.add('highlight-blue');
                    links.II4_up.classList.add('highlight-blue');
                    links.II6_up.classList.add('highlight-blue');
                    
                    textContent.style.borderColor = '#1565c0';
                    textContent.innerHTML = '<b>步骤3：排除伴X显性</b><br/><br/>假设甲病为伴X染色体显性遗传。<br/>患病父亲 (I-1) 的致病X染色体必然传给所有女儿，其女儿应全部患病。<br/><br/>但观察发现，女儿 II-4 和 II-6 均正常，产生矛盾。<br/>因此，<b>甲病为常染色体显性遗传</b>。';
                    break;
                case 4:
                    textContent.style.borderColor = '#4caf50';
                    textContent.innerHTML = '<b>最终结论</b><br/><br/>通过以上推导，我们得出：<br/><br/>• <b>甲病</b>：常染色体显性遗传病<br/>• <b>乙病</b>：伴X染色体隐性遗传病';
                    break;
            }
        }
        
        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateState();
            }
        });
        
        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateState();
            }
        });
        
        updateState();
    })();
    </script>
</body>
</html>
