<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f0f0f0; border-radius: 4px; }
        button.active { background: #1565c0; color: white; border-color: #1565c0; }
        .text-center { text-anchor: middle; dominant-baseline: middle; }
        .text-left { text-anchor: start; dominant-baseline: middle; }
        .text-right { text-anchor: end; dominant-baseline: middle; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg width="800" height="500">
            <defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
                </marker>
            </defs>
            
            <!-- 分割线 -->
            <line x1="400" y1="40" x2="400" y2="420" stroke="#cccccc" stroke-width="1" stroke-dasharray="4 4" />
            
            <!-- 标题 -->
            <text x="200" y="40" class="text-center" font-size="16" font-weight="bold">M果蝇产生机制</text>
            <text x="600" y="40" class="text-center" font-size="16" font-weight="bold">测交实验验证</text>

            <!-- 左侧：M果蝇产生机制 -->
            <text x="100" y="90" class="text-center" font-size="14">X<tspan dy="-5" font-size="0.7em">R</tspan><tspan dy="5">X</tspan><tspan dy="-5" font-size="0.7em">R</tspan><tspan dy="5"> (红眼雌)</tspan></text>
            <text x="200" y="90" class="text-center" font-size="14">×</text>
            <text x="300" y="90" class="text-center" font-size="14">X<tspan dy="-5" font-size="0.7em">r</tspan><tspan dy="5">Y (白眼雄)</tspan></text>
            
            <line x1="100" y1="100" x2="100" y2="140" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
            <line x1="300" y1="100" x2="300" y2="140" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
            
            <text id="scene3-left-gamete-egg" x="100" y="160" class="text-center" font-size="14" fill="#1565c0">X<tspan dy="-5" font-size="0.7em">R</tspan></text>
            <text id="scene3-left-gamete-sperm" x="300" y="160" class="text-center" font-size="14" fill="#1565c0">Y</text>
            
            <line x1="100" y1="170" x2="180" y2="210" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
            <line x1="300" y1="170" x2="220" y2="210" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
            
            <text id="scene3-left-f1-genotype" x="200" y="230" class="text-center" font-size="14" fill="#1565c0">X<tspan dy="-5" font-size="0.7em">R</tspan><tspan dy="5">Y</tspan></text>
            <text x="200" y="265" class="text-center" font-size="14">白眼雄果蝇</text>
            
            <g id="scene3-left-env-box">
        <line x1="140" y1="215" x2="260" y2="215" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="4 4" />
        <line x1="260" y1="215" x2="260" y2="280" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="4 4" />
        <line x1="260" y1="280" x2="140" y2="280" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="4 4" />
        <line x1="140" y1="280" x2="140" y2="215" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="4 4" />
    </g>
            
            <text id="scene3-left-desc" x="200" y="310" class="text-center" font-size="14" fill="#2e7d32">环境改变引起表现型变化，基因型未变</text>
            
            <!-- XO 细胞图 (初始隐藏) -->
            <g id="scene3-left-xo-cell" transform="translate(200, 360)" style="display: none; opacity: 0;">
                <circle cx="0" cy="0" r="35" fill="none" stroke="#000000" stroke-width="1.5" />
                <!-- 2对V型常染色体 -->
                <path d="M -15 -15 L -5 -5 L -15 5" fill="none" stroke="#000000" stroke-width="2" />
                <path d="M 15 -15 L 5 -5 L 15 5" fill="none" stroke="#000000" stroke-width="2" />
                <path d="M -10 -20 L 0 -10 L -10 0" fill="none" stroke="#000000" stroke-width="2" />
                <path d="M 10 -20 L 0 -10 L 10 0" fill="none" stroke="#000000" stroke-width="2" />
                <!-- 1对点状常染色体 -->
                <circle cx="-5" cy="15" r="2" fill="#000000" />
                <circle cx="5" cy="15" r="2" fill="#000000" />
                <!-- 1条棒状X染色体 -->
                <line x1="-15" y1="20" x2="-5" y2="20" stroke="#000000" stroke-width="3" stroke-linecap="round" />
                <text x="0" y="45" class="text-center" font-size="12" fill="#c62828">XO(雄性，不育)</text>
            </g>

            <!-- 右侧：测交实验验证 -->
            <text id="scene3-right-p-m" x="500" y="90" class="text-center" font-size="14" fill="#1565c0">X<tspan dy="-5" font-size="0.7em">R</tspan><tspan dy="5">Y</tspan></text>
            <text x="600" y="90" class="text-center" font-size="14">×</text>
            <text x="700" y="90" class="text-center" font-size="14">X<tspan dy="-5" font-size="0.7em">r</tspan><tspan dy="5">X</tspan><tspan dy="-5" font-size="0.7em">r</tspan><tspan dy="5"> (白眼雌)</tspan></text>
            
            <line x1="500" y1="100" x2="500" y2="140" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
            <line x1="700" y1="100" x2="700" y2="140" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
            
            <text id="scene3-right-gamete-m" x="500" y="160" class="text-center" font-size="14" fill="#1565c0">X<tspan dy="-5" font-size="0.7em">R</tspan><tspan dy="5">, Y</tspan></text>
            <text x="700" y="160" class="text-center" font-size="14">X<tspan dy="-5" font-size="0.7em">r</tspan></text>
            
            <g id="scene3-right-f2-arrows">
                <line x1="500" y1="170" x2="580" y2="210" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
                <line x1="700" y1="170" x2="620" y2="210" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
            </g>
            
            <text id="scene3-right-f2-result1" x="600" y="230" class="text-center" font-size="14" fill="#1565c0">X<tspan dy="-5" font-size="0.7em">R</tspan><tspan dy="5">X</tspan><tspan dy="-5" font-size="0.7em">r</tspan><tspan dy="5"> (红眼雌)</tspan></text>
            <text id="scene3-right-f2-result2" x="600" y="250" class="text-center" font-size="14" fill="#1565c0">X<tspan dy="-5" font-size="0.7em">r</tspan><tspan dy="5">Y (白眼雄)</tspan></text>
            
            <text id="scene3-right-f2-conclusion" x="600" y="300" class="text-center" font-size="14" fill="#1565c0">出现红眼雌果蝇</text>
            
            <text id="scene3-right-cross" x="500" y="160" class="text-center" font-size="30" fill="#c62828" style="display: none; opacity: 0;">×</text>
        </svg>
        
        <div id="scene3-controls">
            <button id="scene3-btn-env" class="active">环境改变</button>
            <button id="scene3-btn-mut">基因突变</button>
            <button id="scene3-btn-chr">染色体不分离</button>
        </div>
    </div>
    <script>
    (function() {
        const btnEnv = document.getElementById('scene3-btn-env');
        const btnMut = document.getElementById('scene3-btn-mut');
        const btnChr = document.getElementById('scene3-btn-chr');
        
        const leftGameteEgg = document.getElementById('scene3-left-gamete-egg');
        const leftGameteSperm = document.getElementById('scene3-left-gamete-sperm');
        const leftF1Genotype = document.getElementById('scene3-left-f1-genotype');
        const leftEnvBox = document.getElementById('scene3-left-env-box');
        const leftDesc = document.getElementById('scene3-left-desc');
        const leftXoCell = document.getElementById('scene3-left-xo-cell');
        
        const rightPM = document.getElementById('scene3-right-p-m');
        const rightGameteM = document.getElementById('scene3-right-gamete-m');
        const rightF2Arrows = document.getElementById('scene3-right-f2-arrows');
        const rightF2Result1 = document.getElementById('scene3-right-f2-result1');
        const rightF2Result2 = document.getElementById('scene3-right-f2-result2');
        const rightF2Conclusion = document.getElementById('scene3-right-f2-conclusion');
        const rightCross = document.getElementById('scene3-right-cross');
        
        function show(el) {
            el.style.display = '';
            el.style.opacity = '1';
        }
        
        function hide(el) {
            el.style.display = 'none';
            el.style.opacity = '0';
        }
        
        function updateState(state) {
            btnEnv.classList.remove('active');
            btnMut.classList.remove('active');
            btnChr.classList.remove('active');
            
            if (state === 1) {
                btnEnv.classList.add('active');
                
                leftGameteEgg.innerHTML = 'X<tspan dy="-5" font-size="0.7em">R</tspan>';
                leftGameteEgg.setAttribute('fill', '#1565c0');
                leftGameteSperm.innerHTML = 'Y';
                leftGameteSperm.setAttribute('fill', '#1565c0');
                leftF1Genotype.innerHTML = 'X<tspan dy="-5" font-size="0.7em">R</tspan><tspan dy="5">Y</tspan>';
                leftF1Genotype.setAttribute('fill', '#1565c0');
                
                show(leftEnvBox);
                leftDesc.innerHTML = '环境改变引起表现型变化，基因型未变';
                leftDesc.setAttribute('fill', '#2e7d32');
                hide(leftXoCell);
                
                rightPM.innerHTML = 'X<tspan dy="-5" font-size="0.7em">R</tspan><tspan dy="5">Y</tspan>';
                rightPM.setAttribute('fill', '#1565c0');
                
                show(rightGameteM);
                rightGameteM.innerHTML = 'X<tspan dy="-5" font-size="0.7em">R</tspan><tspan dy="5">, Y</tspan>';
                rightGameteM.setAttribute('fill', '#1565c0');
                
                show(rightF2Arrows);
                show(rightF2Result1);
                show(rightF2Result2);
                rightF2Result1.innerHTML = 'X<tspan dy="-5" font-size="0.7em">R</tspan><tspan dy="5">X</tspan><tspan dy="-5" font-size="0.7em">r</tspan><tspan dy="5"> (红眼雌)</tspan>';
                rightF2Result1.setAttribute('fill', '#1565c0');
                rightF2Result2.innerHTML = 'X<tspan dy="-5" font-size="0.7em">r</tspan><tspan dy="5">Y (白眼雄)</tspan>';
                rightF2Result2.setAttribute('fill', '#1565c0');
                
                rightF2Conclusion.innerHTML = '出现红眼雌果蝇';
                rightF2Conclusion.setAttribute('fill', '#1565c0');
                
                hide(rightCross);
            } else if (state === 2) {
                btnMut.classList.add('active');
                
                leftGameteEgg.innerHTML = 'X<tspan dy="-5" font-size="0.7em">r</tspan>';
                leftGameteEgg.setAttribute('fill', '#c62828');
                leftGameteSperm.innerHTML = 'Y';
                leftGameteSperm.setAttribute('fill', '#1565c0');
                leftF1Genotype.innerHTML = '<tspan fill="#c62828">X<tspan dy="-5" font-size="0.7em">r</tspan></tspan><tspan dy="5" fill="#1565c0">Y</tspan>';
                
                hide(leftEnvBox);
                leftDesc.innerHTML = '亲本雌果蝇发生基因突变产生X<tspan dy="-5" font-size="0.7em">r</tspan><tspan dy="5">卵细胞</tspan>';
                leftDesc.setAttribute('fill', '#c62828');
                hide(leftXoCell);
                
                rightPM.innerHTML = 'X<tspan dy="-5" font-size="0.7em">r</tspan><tspan dy="5">Y</tspan>';
                rightPM.setAttribute('fill', '#c62828');
                
                show(rightGameteM);
                rightGameteM.innerHTML = 'X<tspan dy="-5" font-size="0.7em">r</tspan><tspan dy="5">, Y</tspan>';
                rightGameteM.setAttribute('fill', '#c62828');
                
                show(rightF2Arrows);
                show(rightF2Result1);
                show(rightF2Result2);
                rightF2Result1.innerHTML = 'X<tspan dy="-5" font-size="0.7em">r</tspan><tspan dy="5">X</tspan><tspan dy="-5" font-size="0.7em">r</tspan><tspan dy="5"> (白眼雌)</tspan>';
                rightF2Result1.setAttribute('fill', '#c62828');
                rightF2Result2.innerHTML = 'X<tspan dy="-5" font-size="0.7em">r</tspan><tspan dy="5">Y (白眼雄)</tspan>';
                rightF2Result2.setAttribute('fill', '#c62828');
                
                rightF2Conclusion.innerHTML = '子代全为白眼';
                rightF2Conclusion.setAttribute('fill', '#c62828');
                
                hide(rightCross);
            } else if (state === 3) {
                btnChr.classList.add('active');
                
                leftGameteEgg.innerHTML = 'O';
                leftGameteEgg.setAttribute('fill', '#c62828');
                leftGameteSperm.innerHTML = 'X<tspan dy="-5" font-size="0.7em">r</tspan>';
                leftGameteSperm.setAttribute('fill', '#1565c0');
                leftF1Genotype.innerHTML = '<tspan fill="#1565c0">X<tspan dy="-5" font-size="0.7em">r</tspan></tspan><tspan dy="5" fill="#c62828">O</tspan>';
                
                hide(leftEnvBox);
                leftDesc.innerHTML = '减数分裂时X染色体不分离产生O卵细胞';
                leftDesc.setAttribute('fill', '#c62828');
                show(leftXoCell);
                
                rightPM.innerHTML = 'X<tspan dy="-5" font-size="0.7em">r</tspan><tspan dy="5">O</tspan>';
                rightPM.setAttribute('fill', '#c62828');
                
                hide(rightGameteM);
                hide(rightF2Arrows);
                hide(rightF2Result1);
                hide(rightF2Result2);
                
                rightF2Conclusion.innerHTML = 'M果蝇不育，无子代';
                rightF2Conclusion.setAttribute('fill', '#c62828');
                
                show(rightCross);
            }
        }
        
        btnEnv.addEventListener('click', () => updateState(1));
        btnMut.addEventListener('click', () => updateState(2));
        btnChr.addEventListener('click', () => updateState(3));
        
        // Initialize
        updateState(1);
    })();
    </script>
</body>
</html>
