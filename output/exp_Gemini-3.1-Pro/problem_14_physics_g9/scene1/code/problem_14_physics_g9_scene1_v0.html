<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        .scene1-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; background: #f0f0f0; border: 1px solid #ccc; border-radius: 4px; }
        .scene1-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 14px; font-weight: bold; min-width: 40px; text-align: center; }
        #scene1-top-text { position: absolute; top: 20px; left: 50px; width: 700px; height: 110px; text-align: center; font-size: 16px; line-height: 1.5; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        
        /* SVG Styles */
        .scene1-main-line { stroke: #000000; stroke-width: 2px; fill: none; }
        .scene1-fill-none { fill: none; }
        .scene1-fill-black { fill: #000000; }
        .scene1-fill-white { fill: #ffffff; }
        .scene1-text { font-family: sans-serif; font-size: 16px; fill: #000000; }
        .scene1-text-small { font-size: 14px; }
        
        /* Highlight Styles */
        .scene1-hl-blue { stroke: #1565c0; stroke-width: 6px; fill: none; opacity: 0.2; }
        .scene1-hl-blue-text { fill: #1565c0; font-weight: bold; }
        .scene1-hl-red { stroke: #c62828; stroke-width: 2px; fill: none; }
        .scene1-hl-red-fill { fill: #c62828; }
        .scene1-hl-green { stroke: #2e7d32; stroke-width: 2px; fill: none; }
        .scene1-hl-green-fill { fill: #2e7d32; }
        
        /* Transitions */
        .scene1-anim { transition: opacity 0.3s ease, transform 0.3s ease; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <div id="scene1-top-text"></div>
        
        <svg width="800" height="500" id="scene1-svg">
            <defs>
                <!-- Arrowheads -->
                <marker id="scene1-arrow-black" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" class="scene1-fill-black" />
                </marker>
                <marker id="scene1-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" class="scene1-hl-red-fill" />
                </marker>
                <marker id="scene1-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" class="scene1-hl-green-fill" />
                </marker>
                <marker id="scene1-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0" />
                </marker>
                
                <!-- Patterns for wall and ground -->
                <pattern id="scene1-ground-pattern" width="10" height="10" patternUnits="userSpaceOnUse">
                    <path d="M 0 0 L 10 10" stroke="#000000" stroke-width="1" />
                </pattern>
                <pattern id="scene1-wall-pattern" width="10" height="10" patternUnits="userSpaceOnUse">
                    <path d="M 10 0 L 0 10" stroke="#000000" stroke-width="1" />
                </pattern>
            </defs>

            <!-- Ground and Wall -->
            <rect x="50" y="350" width="700" height="10" fill="url(#scene1-ground-pattern)" />
            <line x1="50" y1="350" x2="750" y2="350" class="scene1-main-line" />
            
            <rect x="90" y="150" width="10" height="200" fill="url(#scene1-wall-pattern)" />
            <line x1="100" y1="150" x2="100" y2="350" class="scene1-main-line" />

            <!-- Pulleys -->
            <!-- Fixed Pulley -->
            <circle cx="200" cy="280" r="30" class="scene1-main-line scene1-fill-white" />
            <circle cx="200" cy="280" r="4" class="scene1-fill-black" />
            <line x1="100" y1="280" x2="200" y2="280" class="scene1-main-line" /> <!-- Wall connection -->
            
            <!-- Movable Pulley -->
            <circle cx="450" cy="280" r="30" class="scene1-main-line scene1-fill-white" />
            <circle cx="450" cy="280" r="4" class="scene1-fill-black" />
            <line x1="450" y1="280" x2="550" y2="280" class="scene1-main-line" /> <!-- Object connection -->

            <!-- Object A -->
            <g id="scene1-obj-a-group">
                <rect id="scene1-obj-a" x="550" y="250" width="100" height="100" class="scene1-main-line scene1-fill-white" />
                <text x="600" y="240" text-anchor="middle" class="scene1-text" font-size="24">A</text>
            </g>
            
            <!-- Object A Ghost (Step 5) -->
            <g id="scene1-obj-a-ghost" class="scene1-anim" style="opacity: 0; display: none;">
                <rect x="650" y="250" width="100" height="100" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" fill="none" opacity="0.5" />
                <text x="700" y="240" text-anchor="middle" class="scene1-text" font-size="24" opacity="0.5">A</text>
            </g>

            <!-- Main Rope -->
            <!-- 动滑轮钩子(420,280)->定滑轮上(200,250)->定滑轮下(200,310)->动滑轮下(450,310)->动滑轮上(450,250)->自由端(280,250) -->
            <!-- Note: The plan says hook is at 420,280. Let's draw the hook -->
            <path d="M 450 280 L 420 280" class="scene1-main-line" />
            
            <path id="scene1-rope-main" d="
                M 420 280 
                L 200 250 
                A 30 30 0 0 0 200 310 
                L 450 310 
                A 30 30 0 0 0 450 250 
                L 280 250" 
                class="scene1-main-line" />

            <!-- Rope Highlights (Step 1) -->
            <g id="scene1-rope-hl-group" class="scene1-anim" style="opacity: 0; display: none;">
                <!-- Rope 1: 450,250 to 280,250 -->
                <line x1="450" y1="250" x2="280" y2="250" class="scene1-hl-blue" />
                <text x="380" y="240" class="scene1-text scene1-hl-blue-text">1</text>
                
                <!-- Rope 2: 420,280 to 200,250 -->
                <line x1="420" y1="280" x2="200" y2="250" class="scene1-hl-blue" />
                <text x="380" y="275" class="scene1-text scene1-hl-blue-text">2</text>
                
                <!-- Rope 3: 200,310 to 450,310 -->
                <line x1="200" y1="310" x2="450" y2="310" class="scene1-hl-blue" />
                <text x="380" y="325" class="scene1-text scene1-hl-blue-text">3</text>
            </g>
            
            <!-- Rope Highlight Free End (Step 4) -->
            <g id="scene1-rope-hl-free" class="scene1-anim" style="opacity: 0; display: none;">
                <line x1="450" y1="250" x2="280" y2="250" class="scene1-hl-blue" />
            </g>

            <!-- Force F -->
            <g id="scene1-force-f">
                <line x1="350" y1="250" x2="280" y2="250" class="scene1-main-line" marker-end="url(#scene1-arrow-black)" />
                <text x="315" y="235" text-anchor="middle" class="scene1-text">F=5N</text>
            </g>

            <!-- Knowns: v_A, η -->
            <text x="600" y="190" text-anchor="middle" class="scene1-text">v_A=1m/s</text>
            <text x="600" y="150" text-anchor="middle" class="scene1-text">η=80%</text>

            <!-- Force T (Step 2, 3) -->
            <g id="scene1-force-t" class="scene1-anim" style="opacity: 0; display: none;">
                <line x1="550" y1="290" x2="480" y2="290" class="scene1-hl-red" marker-end="url(#scene1-arrow-red)" />
                <text x="515" y="280" text-anchor="middle" class="scene1-text scene1-hl-red-fill">T</text>
            </g>

            <!-- Force f (Step 2, 3, 5) -->
            <g id="scene1-force-f-fric" class="scene1-anim" style="opacity: 0; display: none;">
                <line x1="600" y1="350" x2="670" y2="350" class="scene1-hl-red" marker-end="url(#scene1-arrow-red)" />
                <text id="scene1-text-f" x="635" y="370" text-anchor="middle" class="scene1-text scene1-hl-red-fill">f</text>
            </g>

            <!-- Velocity v_F (Step 4) -->
            <g id="scene1-vel-f" class="scene1-anim" style="opacity: 0; display: none;">
                <line x1="280" y1="230" x2="210" y2="230" class="scene1-hl-green" marker-end="url(#scene1-arrow-green)" />
                <text x="245" y="215" text-anchor="middle" class="scene1-text scene1-hl-green-fill">v_F=3m/s</text>
            </g>

            <!-- Displacement s_A (Step 5) -->
            <g id="scene1-disp-a" class="scene1-anim" style="opacity: 0; display: none;">
                <line x1="600" y1="380" x2="700" y2="380" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-blue)" />
                <text x="650" y="400" text-anchor="middle" class="scene1-text scene1-hl-blue-text">s_A=10m</text>
            </g>

        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn">◀ 上一步</button>
            <div id="scene1-step-indicator">0 / 5</div>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const totalSteps = 5;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        const topText = document.getElementById('scene1-top-text');

        // Elements
        const ropeHlGroup = document.getElementById('scene1-rope-hl-group');
        const objA = document.getElementById('scene1-obj-a');
        const forceT = document.getElementById('scene1-force-t');
        const forceFric = document.getElementById('scene1-force-f-fric');
        const textF = document.getElementById('scene1-text-f');
        const ropeHlFree = document.getElementById('scene1-rope-hl-free');
        const velF = document.getElementById('scene1-vel-f');
        const objAGhost = document.getElementById('scene1-obj-a-ghost');
        const dispA = document.getElementById('scene1-disp-a');

        const stepTexts = [
            "已知：物体A重50N，拉力F=5N，滑轮组机械效率η=80%，物体运动速度v_A=1m/s。",
            "步骤1：观察滑轮组结构。与动滑轮相连的绳子段数 n = 3。<br>因此，绳子自由端的速度 v_F = n × v_A = 3 × 1m/s = 3m/s。",
            "步骤2：分析物体A的受力。物体A做匀速直线运动，受力平衡。<br>水平方向受向左的拉力T和向右的摩擦力f，合力为0。选项A错误。",
            "步骤3：计算摩擦力f。机械效率 η = W_有 / W_总 = (f × s_A) / (F × s_F) = f / (n × F)。<br>所以 f = n × F × η = 3 × 5N × 80% = 12N。选项B正确。",
            "步骤4：计算拉力F的功率。P = F × v_F = 5N × 3m/s = 15W。<br>选项C错误。",
            "步骤5：计算10s内的有用功。10s内物体A的位移 s_A = v_A × t = 1m/s × 10s = 10m。<br>有用功 W_有 = f × s_A = 12N × 10m = 120J。选项D错误。"
        ];

        function show(el) {
            if (!el) return;
            el.style.display = '';
            // Small delay to allow display to apply before opacity transition
            setTimeout(() => { el.style.opacity = '1'; }, 10);
        }

        function hide(el) {
            if (!el) return;
            el.style.opacity = '0';
            setTimeout(() => { el.style.display = 'none'; }, 300);
        }

        function renderStep(step) {
            stepIndicator.textContent = `${step} / ${totalSteps}`;
            btnPrev.disabled = step === 0;
            btnNext.disabled = step === totalSteps;
            
            topText.innerHTML = stepTexts[step];

            // Reset all
            hide(ropeHlGroup);
            objA.setAttribute('stroke', '#000000');
            objA.setAttribute('stroke-width', '2');
            hide(forceT);
            hide(forceFric);
            hide(ropeHlFree);
            hide(velF);
            hide(objAGhost);
            hide(dispA);
            textF.textContent = "f";

            if (step === 1) {
                show(ropeHlGroup);
            } else if (step === 2) {
                objA.setAttribute('stroke', '#c62828');
                objA.setAttribute('stroke-width', '4');
                show(forceT);
                show(forceFric);
            } else if (step === 3) {
                objA.setAttribute('stroke', '#c62828');
                objA.setAttribute('stroke-width', '4');
                show(forceT);
                show(forceFric);
                textF.textContent = "f=12N";
            } else if (step === 4) {
                show(ropeHlFree);
                show(velF);
            } else if (step === 5) {
                show(forceFric);
                textF.textContent = "f=12N";
                show(objAGhost);
                show(dispA);
            }
            
            // Re-render MathJax if needed (though we used simple text here, we can trigger it if we add $ $)
            if (window.MathJax) {
                MathJax.typesetPromise([topText]).catch((err) => console.log(err.message));
            }
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                renderStep(currentStep);
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < totalSteps) {
                currentStep++;
                renderStep(currentStep);
            }
        });

        // Initial render
        renderStep(0);
    })();
    </script>
</body>
</html>
