<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .node-rect { fill: #ffffff; stroke: #000000; stroke-width: 2; transition: all 0.3s; }
        .node-text { font-size: 20px; text-anchor: middle; dominant-baseline: central; font-family: serif; }
        .path-line { fill: none; stroke: #000000; stroke-width: 2; transition: all 0.3s; }
        .label-text { font-size: 14px; transition: all 0.3s; opacity: 0; }
        .label-text.show { opacity: 1; }
        .highlight-blue .node-rect { stroke: #1565c0; stroke-width: 3; fill: rgba(21, 101, 192, 0.1); }
        .highlight-green .node-rect { stroke: #2e7d32; stroke-width: 3; fill: rgba(46, 125, 50, 0.1); }
        .highlight-blue .path-line { stroke: #1565c0; stroke-width: 3; }
        .highlight-green .path-line { stroke: #2e7d32; stroke-width: 3; }
        .label-blue { fill: #1565c0; }
        .label-green { fill: #2e7d32; }
        
        #scene1-explanation {
            position: absolute;
            right: 15px;
            top: 80px;
            width: 190px;
            height: 340px;
            background: #f5f5f5;
            border-radius: 8px;
            padding: 15px;
            box-sizing: border-box;
            font-size: 14px;
            line-height: 1.5;
            color: #333;
        }
        button {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #ccc;
            background: #fff;
            border-radius: 4px;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .reaction-label {
            font-size: 14px;
            fill: #666;
        }
        .reaction-bg {
            fill: #ffffff;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500">
            <defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
                </marker>
                <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0" />
                </marker>
                <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32" />
                </marker>
                
                <rect id="node-rect" x="-30" y="-25" width="60" height="50" />
                <circle id="reaction-circle" cx="0" cy="0" r="10" />
            </defs>

            <!-- Paths -->
            <g id="scene1-paths">
                <!-- Reaction 1 -->
                <g id="scene1-path1">
                    <line x1="120" y1="100" x2="160" y2="100" class="path-line" />
                    <line x1="160" y1="100" x2="160" y2="175" class="path-line" />
                    <line x1="120" y1="235" x2="160" y2="235" class="path-line" />
                    <line x1="160" y1="235" x2="160" y2="175" class="path-line" />
                    <line x1="160" y1="175" x2="220" y2="175" class="path-line" />
                    <line x1="220" y1="175" x2="220" y2="100" class="path-line" />
                    <line x1="220" y1="100" x2="254" y2="100" class="path-line" marker-end="url(#arrow)" />
                    <line x1="220" y1="175" x2="220" y2="235" class="path-line" />
                    <line x1="220" y1="235" x2="254" y2="235" class="path-line" marker-end="url(#arrow)" />
                </g>
                <!-- Reaction 2 -->
                <g id="scene1-path2">
                    <line x1="120" y1="265" x2="160" y2="265" class="path-line" />
                    <line x1="160" y1="265" x2="160" y2="325" class="path-line" />
                    <line x1="120" y1="400" x2="160" y2="400" class="path-line" />
                    <line x1="160" y1="400" x2="160" y2="325" class="path-line" />
                    <line x1="160" y1="325" x2="220" y2="325" class="path-line" />
                    <line x1="220" y1="325" x2="220" y2="265" class="path-line" />
                    <line x1="220" y1="265" x2="254" y2="265" class="path-line" marker-end="url(#arrow)" />
                    <line x1="220" y1="325" x2="220" y2="400" class="path-line" />
                    <line x1="220" y1="400" x2="254" y2="400" class="path-line" marker-end="url(#arrow)" />
                </g>
                <!-- Reaction 3 -->
                <g id="scene1-path3">
                    <line x1="90" y1="75" x2="90" y2="40" class="path-line" />
                    <line x1="90" y1="40" x2="390" y2="40" class="path-line" />
                    <line x1="390" y1="40" x2="390" y2="250" class="path-line" />
                    <line x1="290" y1="425" x2="290" y2="460" class="path-line" />
                    <line x1="290" y1="460" x2="390" y2="460" class="path-line" />
                    <line x1="390" y1="460" x2="390" y2="250" class="path-line" />
                    <line x1="390" y1="250" x2="420" y2="250" class="path-line" />
                    <line x1="420" y1="250" x2="420" y2="175" class="path-line" />
                    <line x1="420" y1="175" x2="454" y2="175" class="path-line" marker-end="url(#arrow)" />
                    <line x1="420" y1="250" x2="420" y2="325" class="path-line" />
                    <line x1="420" y1="325" x2="454" y2="325" class="path-line" marker-end="url(#arrow)" />
                </g>
            </g>

            <!-- Reaction Labels -->
            <g id="scene1-reaction-labels">
                <g transform="translate(190, 155)">
                    <use href="#reaction-circle" class="reaction-bg" />
                    <text class="reaction-label" text-anchor="middle" dominant-baseline="central">①</text>
                </g>
                <g transform="translate(190, 310)">
                    <use href="#reaction-circle" class="reaction-bg" />
                    <text class="reaction-label" text-anchor="middle" dominant-baseline="central">②</text>
                </g>
                <g transform="translate(405, 230)">
                    <use href="#reaction-circle" class="reaction-bg" />
                    <text class="reaction-label" text-anchor="middle" dominant-baseline="central">③</text>
                </g>
            </g>

            <!-- Nodes -->
            <g id="scene1-nodes">
                <g id="scene1-node-a" transform="translate(90, 100)">
                    <use href="#node-rect" class="node-rect" />
                    <text class="node-text">A</text>
                </g>
                <g id="scene1-node-b" transform="translate(90, 250)">
                    <use href="#node-rect" class="node-rect" />
                    <text class="node-text">B</text>
                </g>
                <g id="scene1-node-c" transform="translate(90, 400)">
                    <use href="#node-rect" class="node-rect" />
                    <text class="node-text">C</text>
                </g>
                <g id="scene1-node-e1" transform="translate(290, 100)">
                    <use href="#node-rect" class="node-rect" />
                    <text class="node-text">E</text>
                </g>
                <g id="scene1-node-d" transform="translate(290, 250)">
                    <use href="#node-rect" class="node-rect" />
                    <text class="node-text">D</text>
                </g>
                <g id="scene1-node-f" transform="translate(290, 400)">
                    <use href="#node-rect" class="node-rect" />
                    <text class="node-text">F</text>
                </g>
                <g id="scene1-node-e2" transform="translate(490, 175)">
                    <use href="#node-rect" class="node-rect" />
                    <text class="node-text">E</text>
                </g>
                <g id="scene1-node-g" transform="translate(490, 325)">
                    <use href="#node-rect" class="node-rect" />
                    <text class="node-text">G</text>
                </g>
            </g>

            <!-- Inference Labels -->
            <g id="scene1-labels">
                <text id="scene1-label-a" x="50" y="100" class="label-text label-blue" text-anchor="end" dominant-baseline="central">碱</text>
                <text id="scene1-label-b" x="50" y="250" class="label-text label-blue" text-anchor="end" dominant-baseline="central">酸</text>
                <text id="scene1-label-c" x="50" y="400" class="label-text label-blue" text-anchor="end" dominant-baseline="central">CuO</text>
                <text id="scene1-label-d" x="330" y="250" class="label-text label-blue" text-anchor="start" dominant-baseline="central">H₂O</text>
                <text id="scene1-label-f" x="330" y="400" class="label-text label-blue" text-anchor="start" dominant-baseline="central">铜盐</text>
                <text id="scene1-label-g" x="530" y="325" class="label-text label-blue" text-anchor="start" dominant-baseline="central">Cu(OH)₂</text>
            </g>
        </svg>

        <div id="scene1-explanation">
            请点击「下一步」开始推导。
        </div>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 5;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const explanation = document.getElementById('scene1-explanation');

        const nodes = {
            a: document.getElementById('scene1-node-a'),
            b: document.getElementById('scene1-node-b'),
            c: document.getElementById('scene1-node-c'),
            d: document.getElementById('scene1-node-d'),
            e1: document.getElementById('scene1-node-e1'),
            f: document.getElementById('scene1-node-f'),
            e2: document.getElementById('scene1-node-e2'),
            g: document.getElementById('scene1-node-g')
        };

        const paths = {
            p1: document.getElementById('scene1-path1'),
            p2: document.getElementById('scene1-path2'),
            p3: document.getElementById('scene1-path3')
        };

        const labels = {
            a: document.getElementById('scene1-label-a'),
            b: document.getElementById('scene1-label-b'),
            c: document.getElementById('scene1-label-c'),
            d: document.getElementById('scene1-label-d'),
            f: document.getElementById('scene1-label-f'),
            g: document.getElementById('scene1-label-g')
        };

        const stepData = [
            {
                text: "请点击「下一步」开始推导。",
                highlights: {},
                labels: {}
            },
            {
                text: "已知条件突破：<br>B 为最常见的酸<br>D 为人体中含量最多的物质，即 H₂O<br>G 为蓝色不溶物，即 Cu(OH)₂",
                highlights: { b: 'blue', d: 'blue', g: 'blue' },
                labels: { b: 'blue', d: 'blue', g: 'blue' }
            },
            {
                text: "分析反应③：<br>A + F → E + Cu(OH)₂↓<br>生成物有 Cu(OH)₂ 沉淀，推断反应物 A 和 F 为可溶性碱和可溶性铜盐。",
                highlights: { b: 'green', d: 'green', g: 'green', a: 'blue', f: 'blue', e2: 'blue', p3: 'blue' },
                labels: { b: 'green', d: 'green', g: 'green' }
            },
            {
                text: "分析反应①：<br>A + 酸(B) → E + H₂O(D)<br>中和反应生成水，故 A 必为碱。<br>结合上一步，A 为可溶性碱，F 为可溶性铜盐。",
                highlights: { e2: 'green', g: 'green', a: 'blue', b: 'blue', e1: 'blue', d: 'blue', p1: 'blue', f: 'green' },
                labels: { b: 'blue', d: 'blue', g: 'green', a: 'blue', f: 'green' }
            },
            {
                text: "分析反应②：<br>酸(B) + C → H₂O(D) + 铜盐(F)<br>金属氧化物与酸反应生成盐和水，推断 C 为氧化铜 (CuO)。",
                highlights: { a: 'green', b: 'blue', e1: 'green', d: 'blue', c: 'blue', f: 'blue', p2: 'blue', g: 'green' },
                labels: { a: 'green', b: 'blue', d: 'blue', f: 'blue', g: 'green', c: 'blue' }
            },
            {
                text: "推导完成！<br>(1) C 的化学式为 CuO<br>(2) 反应③是复分解反应<br>(3) A 属于碱",
                highlights: { a: 'green', b: 'green', c: 'green', d: 'green', f: 'green', g: 'green', e1: 'green', e2: 'green' },
                labels: { a: 'green', b: 'green', c: 'green', d: 'green', f: 'green', g: 'green' }
            }
        ];

        function updateScene() {
            const data = stepData[currentStep];
            explanation.innerHTML = data.text;

            // Reset all
            Object.values(nodes).forEach(n => { n.classList.remove('highlight-blue', 'highlight-green'); });
            Object.values(paths).forEach(p => { 
                p.classList.remove('highlight-blue', 'highlight-green'); 
                p.querySelectorAll('.path-line[marker-end]').forEach(line => {
                    line.setAttribute('marker-end', 'url(#arrow)');
                });
            });
            Object.values(labels).forEach(l => { 
                l.classList.remove('show', 'label-blue', 'label-green'); 
            });

            // Apply highlights
            for (const [key, color] of Object.entries(data.highlights)) {
                if (nodes[key]) nodes[key].classList.add(`highlight-${color}`);
                if (paths[key]) {
                    paths[key].classList.add(`highlight-${color}`);
                    paths[key].querySelectorAll('.path-line[marker-end]').forEach(line => {
                        line.setAttribute('marker-end', `url(#arrow-${color})`);
                    });
                }
            }

            // Apply labels
            for (const [key, color] of Object.entries(data.labels)) {
                if (labels[key]) {
                    labels[key].classList.add('show', `label-${color}`);
                }
            }

            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });

        updateScene();
    })();
    </script>
</body>
</html>
