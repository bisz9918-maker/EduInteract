<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .molecule { transition: transform 0.8s ease, opacity 0.8s ease; }
        .fade { transition: opacity 0.8s ease; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- Definitions -->
            <defs>
                <g id="scene1-ww">
                    <circle cx="-9" cy="0" r="9" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                    <circle cx="9" cy="0" r="9" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                </g>
                <g id="scene1-bb">
                    <circle cx="-9" cy="0" r="9" fill="#000000" stroke="#000000" stroke-width="2"/>
                    <circle cx="9" cy="0" r="9" fill="#000000" stroke="#000000" stroke-width="2"/>
                </g>
                <g id="scene1-wbw">
                    <circle cx="-10" cy="6" r="9" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                    <circle cx="10" cy="6" r="9" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                    <circle cx="0" cy="-6" r="9" fill="#000000" stroke="#000000" stroke-width="2"/>
                </g>
                <marker id="scene1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
                </marker>
                <marker id="scene1-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0" />
                </marker>
            </defs>

            <!-- Containers -->
            <rect x="150" y="85" width="200" height="150" fill="none" stroke="#000000" stroke-width="2"/>
            <rect x="450" y="85" width="200" height="150" fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- Main Arrow -->
            <line x1="370" y1="160" x2="430" y2="160" stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrow)"/>
            
            <!-- Container Labels -->
            <text x="250" y="260" font-size="18" text-anchor="middle" fill="#000000">反应前</text>
            <text x="550" y="260" font-size="18" text-anchor="middle" fill="#000000">反应后</text>

            <!-- Unreacted Hints (Step 1) -->
            <g id="scene1-hint-left" class="fade" style="opacity: 0;">
                <circle cx="310" cy="115" r="22" fill="none" stroke="#1565c0" stroke-width="2" stroke-dasharray="4"/>
                <circle cx="310" cy="205" r="22" fill="none" stroke="#1565c0" stroke-width="2" stroke-dasharray="4"/>
                <text x="310" y="60" font-size="16" text-anchor="middle" fill="#1565c0">未反应的分子</text>
                <line x1="310" y1="65" x2="310" y2="85" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-blue)"/>
            </g>
            <g id="scene1-hint-right" class="fade" style="opacity: 0;">
                <circle cx="600" cy="120" r="22" fill="none" stroke="#1565c0" stroke-width="2" stroke-dasharray="4"/>
                <circle cx="500" cy="200" r="22" fill="none" stroke="#1565c0" stroke-width="2" stroke-dasharray="4"/>
                <text x="550" y="60" font-size="16" text-anchor="middle" fill="#1565c0">未反应的分子</text>
                <line x1="550" y1="65" x2="580" y2="95" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-blue)"/>
                <line x1="550" y1="65" x2="520" y2="175" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-blue)"/>
            </g>

            <!-- Molecules -->
            <!-- Left Container -->
            <use href="#scene1-ww" id="scene1-mol-l-ww1" class="molecule" style="transform: translate(190px, 115px) rotate(45deg);"/>
            <use href="#scene1-ww" id="scene1-mol-l-ww2" class="molecule" style="transform: translate(190px, 205px) rotate(-45deg);"/>
            <use href="#scene1-bb" id="scene1-mol-l-bb" class="molecule" style="transform: translate(250px, 160px) rotate(30deg);"/>
            <use href="#scene1-ww" id="scene1-mol-l-ww3" class="molecule" style="transform: translate(310px, 115px) rotate(-45deg);"/>
            <use href="#scene1-ww" id="scene1-mol-l-ww4" class="molecule" style="transform: translate(310px, 205px) rotate(45deg);"/>
            
            <!-- Right Container -->
            <use href="#scene1-wbw" id="scene1-mol-r-wbw1" class="molecule" style="transform: translate(500px, 110px) rotate(0deg);"/>
            <use href="#scene1-wbw" id="scene1-mol-r-wbw2" class="molecule" style="transform: translate(600px, 190px) rotate(0deg);"/>
            <use href="#scene1-ww" id="scene1-mol-r-ww1" class="molecule" style="transform: translate(600px, 120px) rotate(-45deg);"/>
            <use href="#scene1-ww" id="scene1-mol-r-ww2" class="molecule" style="transform: translate(500px, 200px) rotate(-45deg);"/>

            <!-- Net Reaction Symbols (Step 2) -->
            <text id="scene1-net-plus" class="fade" x="260" y="310" font-size="24" text-anchor="middle" fill="#000000" style="opacity: 0;">+</text>
            <text id="scene1-net-arrow" class="fade" x="400" y="310" font-size="24" text-anchor="middle" fill="#000000" style="opacity: 0;">→</text>
            
            <!-- Labels (Step 3) -->
            <text id="scene1-label-type1" class="fade" x="400" y="265" font-size="18" text-anchor="middle" fill="#c62828" style="opacity: 0;">多变一 → 化合反应</text>
            <text id="scene1-label-sub1" class="fade" x="195" y="335" font-size="16" text-anchor="middle" fill="#c62828" style="opacity: 0;">单质</text>
            <text id="scene1-label-sub2" class="fade" x="300" y="335" font-size="16" text-anchor="middle" fill="#c62828" style="opacity: 0;">单质</text>
            <text id="scene1-label-sub3" class="fade" x="550" y="335" font-size="16" text-anchor="middle" fill="#c62828" style="opacity: 0;">化合物</text>

            <!-- Conclusions (Step 4) -->
            <text id="scene1-conc1" class="fade" x="400" y="375" font-size="18" text-anchor="middle" fill="#000000" style="opacity: 0;">生成物只有化合物 (排除B)</text>
            <text id="scene1-conc2" class="fade" x="400" y="415" font-size="18" text-anchor="middle" fill="#000000" style="opacity: 0;">反应前后分子种类发生改变 (排除C)</text>
            <text id="scene1-conc3" class="fade" x="400" y="455" font-size="18" text-anchor="middle" fill="#000000" style="opacity: 0;">参加反应的分子个数比 <tspan fill="#2e7d32" font-weight="bold">2:1</tspan> (排除D)</text>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 4;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');

        const hintLeft = document.getElementById('scene1-hint-left');
        const hintRight = document.getElementById('scene1-hint-right');
        
        const molLWW1 = document.getElementById('scene1-mol-l-ww1');
        const molLWW2 = document.getElementById('scene1-mol-l-ww2');
        const molLBB = document.getElementById('scene1-mol-l-bb');
        const molLWW3 = document.getElementById('scene1-mol-l-ww3');
        const molLWW4 = document.getElementById('scene1-mol-l-ww4');
        
        const molRWBW1 = document.getElementById('scene1-mol-r-wbw1');
        const molRWBW2 = document.getElementById('scene1-mol-r-wbw2');
        const molRWW1 = document.getElementById('scene1-mol-r-ww1');
        const molRWW2 = document.getElementById('scene1-mol-r-ww2');

        const netPlus = document.getElementById('scene1-net-plus');
        const netArrow = document.getElementById('scene1-net-arrow');
        
        const labelType1 = document.getElementById('scene1-label-type1');
        const labelSub1 = document.getElementById('scene1-label-sub1');
        const labelSub2 = document.getElementById('scene1-label-sub2');
        const labelSub3 = document.getElementById('scene1-label-sub3');

        const conc1 = document.getElementById('scene1-conc1');
        const conc2 = document.getElementById('scene1-conc2');
        const conc3 = document.getElementById('scene1-conc3');

        function updateScene() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;

            // Step 0: Initial
            if (currentStep < 1) {
                hintLeft.style.opacity = '0';
                hintRight.style.opacity = '0';
            }
            
            // Step 1: Highlight unreacted
            if (currentStep >= 1) {
                hintLeft.style.opacity = currentStep === 1 ? '1' : '0.2';
                hintRight.style.opacity = currentStep === 1 ? '1' : '0.2';
                molLWW3.style.opacity = currentStep === 1 ? '1' : '0.2';
                molLWW4.style.opacity = currentStep === 1 ? '1' : '0.2';
                molRWW1.style.opacity = currentStep === 1 ? '1' : '0.2';
                molRWW2.style.opacity = currentStep === 1 ? '1' : '0.2';
            } else {
                molLWW3.style.opacity = '1';
                molLWW4.style.opacity = '1';
                molRWW1.style.opacity = '1';
                molRWW2.style.opacity = '1';
            }

            // Step 2: Net reaction
            if (currentStep >= 2) {
                molLWW1.style.transform = 'translate(170px, 305px) rotate(0deg)';
                molLWW2.style.transform = 'translate(220px, 305px) rotate(0deg)';
                molLBB.style.transform = 'translate(300px, 305px) rotate(0deg)';
                molRWBW1.style.transform = 'translate(510px, 305px) rotate(0deg)';
                molRWBW2.style.transform = 'translate(590px, 305px) rotate(0deg)';
                
                netPlus.style.opacity = '1';
                netArrow.style.opacity = '1';
            } else {
                molLWW1.style.transform = 'translate(190px, 115px) rotate(45deg)';
                molLWW2.style.transform = 'translate(190px, 205px) rotate(-45deg)';
                molLBB.style.transform = 'translate(250px, 160px) rotate(30deg)';
                molRWBW1.style.transform = 'translate(500px, 110px) rotate(0deg)';
                molRWBW2.style.transform = 'translate(600px, 190px) rotate(0deg)';
                
                netPlus.style.opacity = '0';
                netArrow.style.opacity = '0';
            }

            // Step 3: Labels
            if (currentStep >= 3) {
                labelType1.style.opacity = '1';
                labelSub1.style.opacity = '1';
                labelSub2.style.opacity = '1';
                labelSub3.style.opacity = '1';
            } else {
                labelType1.style.opacity = '0';
                labelSub1.style.opacity = '0';
                labelSub2.style.opacity = '0';
                labelSub3.style.opacity = '0';
            }

            // Step 4: Conclusions
            if (currentStep >= 4) {
                conc1.style.opacity = '1';
                conc2.style.opacity = '1';
                conc3.style.opacity = '1';
            } else {
                conc1.style.opacity = '0';
                conc2.style.opacity = '0';
                conc3.style.opacity = '0';
            }
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });

        // Initialize
        updateScene();
    })();
    </script>
</body>
</html>
