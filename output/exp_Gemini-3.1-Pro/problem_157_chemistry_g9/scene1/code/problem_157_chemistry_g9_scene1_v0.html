<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { cursor: not-allowed; opacity: 0.5; }
        .scene1-hidden { display: none !important; opacity: 0 !important; }
        .scene1-fade { transition: opacity 0.3s ease; }
        .scene1-text { font-size: 16px; fill: #000; }
        .scene1-axis { stroke: #000; stroke-width: 2; }
        .scene1-dashed { stroke: #888; stroke-width: 1.5; stroke-dasharray: 4,4; }
        .scene1-curve { fill: none; stroke: #000; stroke-width: 2; }
        .scene1-point { fill: #000; }
        .scene1-box { fill: rgba(255, 255, 255, 0.9); stroke: #c62828; stroke-width: 1; rx: 4; }
        .scene1-box-green { stroke: #2e7d32; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <!-- Definitions -->
            <defs>
                <marker id="scene1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#000" />
                </marker>
                <marker id="scene1-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32" />
                </marker>
            </defs>

            <!-- Axes -->
            <line x1="120" y1="400" x2="720" y2="400" class="scene1-axis" marker-end="url(#scene1-arrow)" />
            <line x1="120" y1="400" x2="120" y2="40" class="scene1-axis" marker-end="url(#scene1-arrow)" />
            <text x="700" y="425" class="scene1-text">温度(℃)</text>
            <text x="120" y="30" class="scene1-text" text-anchor="middle">溶解度(克)</text>
            <text x="105" y="415" class="scene1-text">0</text>

            <!-- Dashed Lines -->
            <line x1="120" y1="300" x2="600" y2="300" class="scene1-dashed" />
            <line x1="120" y1="150" x2="450" y2="150" class="scene1-dashed" />
            <line x1="250" y1="400" x2="250" y2="300" class="scene1-dashed" />
            <line x1="450" y1="400" x2="450" y2="150" class="scene1-dashed" />
            <line x1="600" y1="400" x2="600" y2="300" class="scene1-dashed" />

            <!-- Labels -->
            <text x="90" y="305" class="scene1-text">S₁</text>
            <text x="90" y="155" class="scene1-text">S₂</text>
            <text x="250" y="420" class="scene1-text" text-anchor="middle">t₁</text>
            <text x="450" y="420" class="scene1-text" text-anchor="middle">t₂</text>
            <text x="600" y="420" class="scene1-text" text-anchor="middle">t₃</text>

            <!-- Curve -->
            <!-- M 120 370 Q 200 320 250 300 Q 350 260 450 150 Q 500 90 530 40 -->
            <path id="scene1-curve-path" d="M 120 370 Q 200 320 250 300 Q 350 260 450 150 Q 500 90 530 40" class="scene1-curve" />

            <!-- Points -->
            <circle cx="250" cy="300" r="4" class="scene1-point" />
            
            <circle id="scene1-pt-m" cx="450" cy="300" r="4" class="scene1-point" />
            <text x="465" y="320" class="scene1-text">M</text>

            <circle id="scene1-pt-b" cx="600" cy="300" r="4" class="scene1-point" />
            <text x="615" y="315" class="scene1-text">B</text>

            <!-- Dynamic Elements for Steps -->
            <!-- Step 1 -->
            <g id="scene1-step1-group" class="scene1-fade" style="opacity: 0; display: none;">
                <rect x="280" y="80" width="160" height="40" class="scene1-box" />
                <foreignObject x="280" y="80" width="160" height="40">
                    <div xmlns="http://www.w3.org/1999/xhtml" style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #c62828;">
                        $rac{S_2}{100+S_2} 	imes 100\%$
                    </div>
                </foreignObject>
                <text x="630" y="280" class="scene1-text" fill="#1565c0">不饱和状态</text>
            </g>

            <!-- Step 2 -->
            <g id="scene1-step2-group" class="scene1-fade" style="opacity: 0; display: none;">
                <rect x="340" y="40" width="120" height="30" class="scene1-box" style="stroke: #000; fill: #fff;" />
                <text x="400" y="60" class="scene1-text" text-anchor="middle" dominant-baseline="middle">恒温加水20g</text>
                
                <line x1="450" y1="160" x2="450" y2="220" stroke="#000" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#scene1-arrow)" />
                <line x1="600" y1="310" x2="600" y2="370" stroke="#000" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#scene1-arrow)" />
                
                <foreignObject x="480" y="230" width="200" height="40">
                    <div xmlns="http://www.w3.org/1999/xhtml" style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 14px;">
                        $rac{S_2}{120+S_2} > rac{S_1}{120+S_1}$
                    </div>
                </foreignObject>
            </g>

            <!-- Step 3 -->
            <g id="scene1-step3-group" class="scene1-fade" style="opacity: 0; display: none;">
                <path d="M 450 150 Q 350 260 250 300" fill="none" stroke="#2e7d32" stroke-width="4" />
                <rect x="180" y="180" width="180" height="30" class="scene1-box scene1-box-green" style="fill: #fff;" />
                <text x="270" y="200" class="scene1-text" fill="#2e7d32" text-anchor="middle" dominant-baseline="middle">仍为饱和，但溶解度减小</text>
                <g id="scene1-particles"></g>
            </g>

            <!-- Step 4 -->
            <g id="scene1-step4-group" class="scene1-fade" style="opacity: 0; display: none;">
                <line x1="440" y1="300" x2="260" y2="300" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene1-arrow-green)" />
                <text x="350" y="285" class="scene1-text" fill="#2e7d32" text-anchor="middle">降温至 t₁℃</text>
                
                <line x1="450" y1="290" x2="450" y2="160" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene1-arrow-green)" />
                <text x="460" y="225" class="scene1-text" fill="#2e7d32">加溶质 (S₂-S₁)g</text>
                
                <g transform="translate(480, 320)">
                    <path d="M 0 15 Q 5 5 10 15 T 20 15" fill="none" stroke="#1565c0" stroke-width="2" />
                    <path d="M 5 10 Q 10 0 15 10 T 25 10" fill="none" stroke="#1565c0" stroke-width="2" />
                    <path d="M 10 5 Q 15 -5 20 5 T 30 5" fill="none" stroke="#1565c0" stroke-width="2" />
                </g>
                <text x="480" y="355" class="scene1-text" fill="#1565c0">恒温蒸发溶剂</text>
            </g>

            <!-- Point A (needs to be on top for animation) -->
            <circle id="scene1-pt-a" cx="450" cy="150" r="4" class="scene1-point" />
            <text id="scene1-text-a" x="425" y="140" class="scene1-text">A</text>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const totalSteps = 4;
        
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        
        const ptA = document.getElementById('scene1-pt-a');
        const textA = document.getElementById('scene1-text-a');
        const ptB = document.getElementById('scene1-pt-b');
        const ptM = document.getElementById('scene1-pt-m');
        const curvePath = document.getElementById('scene1-curve-path');
        
        const groups = [
            null, // step 0 has no specific group
            document.getElementById('scene1-step1-group'),
            document.getElementById('scene1-step2-group'),
            document.getElementById('scene1-step3-group'),
            document.getElementById('scene1-step4-group')
        ];

        let animationFrameId = null;
        let particles = [];
        const particlesGroup = document.getElementById('scene1-particles');

        function show(el) {
            if (!el) return;
            el.style.display = '';
            // trigger reflow
            void el.offsetWidth;
            el.style.opacity = '1';
        }

        function hide(el) {
            if (!el) return;
            el.style.opacity = '0';
            setTimeout(() => {
                if (el.style.opacity === '0') {
                    el.style.display = 'none';
                }
            }, 300);
        }

        function updateState() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps;
            
            // Reset all
            for (let i = 1; i <= totalSteps; i++) {
                hide(groups[i]);
            }
            
            ptA.setAttribute('fill', '#000');
            ptB.setAttribute('fill', '#000');
            ptM.setAttribute('fill', '#000');
            ptA.setAttribute('cx', '450');
            ptA.setAttribute('cy', '150');
            textA.setAttribute('x', '425');
            textA.setAttribute('y', '140');
            curvePath.style.stroke = '#000';
            
            cancelAnimationFrame(animationFrameId);
            particlesGroup.innerHTML = '';
            particles = [];

            if (currentStep === 1) {
                show(groups[1]);
                ptA.setAttribute('fill', '#c62828');
                ptB.setAttribute('fill', '#1565c0');
            } 
            else if (currentStep === 2) {
                show(groups[2]);
                // Blink curve
                let blinkCount = 0;
                const blinkInterval = setInterval(() => {
                    curvePath.style.stroke = curvePath.style.stroke === 'rgb(0, 0, 0)' ? '#c62828' : '#000';
                    blinkCount++;
                    if (blinkCount >= 6) {
                        clearInterval(blinkInterval);
                        curvePath.style.stroke = '#000';
                    }
                }, 300);
            }
            else if (currentStep === 3) {
                show(groups[3]);
                animateStep3();
            }
            else if (currentStep === 4) {
                show(groups[4]);
                ptM.setAttribute('fill', '#1565c0');
            }
        }

        function animateStep3() {
            let startTime = null;
            const duration = 2000; // 2 seconds
            
            function step(timestamp) {
                if (!startTime) startTime = timestamp;
                const progress = Math.min((timestamp - startTime) / duration, 1);
                
                // Bezier curve interpolation for Q 350 260
                // P0 = (450, 150), P1 = (350, 260), P2 = (250, 300)
                const t = progress;
                const x = Math.pow(1-t, 2)*450 + 2*(1-t)*t*350 + Math.pow(t, 2)*250;
                const y = Math.pow(1-t, 2)*150 + 2*(1-t)*t*260 + Math.pow(t, 2)*300;
                
                ptA.setAttribute('cx', x);
                ptA.setAttribute('cy', y);
                textA.setAttribute('x', x - 25);
                textA.setAttribute('y', y - 10);
                
                // Add particles
                if (Math.random() < 0.3) {
                    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    circle.setAttribute('r', '2');
                    circle.setAttribute('fill', '#c62828');
                    particlesGroup.appendChild(circle);
                    particles.push({
                        el: circle,
                        x: x + (Math.random() - 0.5) * 10,
                        y: y,
                        vy: 1 + Math.random() * 2
                    });
                }
                
                // Update particles
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.y += p.vy;
                    p.el.setAttribute('cx', p.x);
                    p.el.setAttribute('cy', p.y);
                    if (p.y > 400) {
                        p.el.remove();
                        particles.splice(i, 1);
                    }
                }
                
                if (progress < 1 || particles.length > 0) {
                    animationFrameId = requestAnimationFrame(step);
                }
            }
            animationFrameId = requestAnimationFrame(step);
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateState();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < totalSteps) {
                currentStep++;
                updateState();
            }
        });

        // Initialize
        updateState();
    })();
    </script>
</body>
</html>
