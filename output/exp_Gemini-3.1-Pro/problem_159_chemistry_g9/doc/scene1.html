<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene1-hidden { opacity: 0; display: none; }
        .scene1-fade { transition: opacity 0.5s ease; }
        .scene1-path-anim { stroke-dasharray: 1000; stroke-dashoffset: 1000; transition: stroke-dashoffset 1s ease-in-out; }
        .scene1-path-anim.scene1-drawn { stroke-dashoffset: 0; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500">
            <defs>
                <marker id="scene1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#000" />
                </marker>
            </defs>

            <!-- 图A -->
            <g id="scene1-group-a" class="scene1-fade">
                <g id="scene1-border-a" opacity="0" stroke="#1565c0" stroke-width="2">
    <line x1="70" y1="20" x2="390" y2="20" />
    <line x1="390" y1="20" x2="390" y2="230" />
    <line x1="390" y1="230" x2="70" y2="230" />
    <line x1="70" y1="230" x2="70" y2="20" />
  </g>
                <text x="230" y="225" font-size="16" text-anchor="middle" font-weight="bold">A</text>
                <!-- 坐标轴 -->
                <line x1="120" y1="200" x2="360" y2="200" stroke="#000" stroke-width="1.5" marker-end="url(#scene1-arrow)" />
                <line x1="120" y1="200" x2="120" y2="60" stroke="#000" stroke-width="1.5" marker-end="url(#scene1-arrow)" />
                <text x="360" y="215" font-size="12" text-anchor="end">氧化钙质量/g</text>
                <text x="120" y="50" font-size="12" text-anchor="middle">溶质质量/g</text>
                <text x="110" y="215" font-size="12" text-anchor="middle">0</text>
                <!-- 原曲线 -->
                <line x1="120" y1="120" x2="340" y2="120" stroke="#000" stroke-width="2" />
                <!-- 修正曲线 -->
                <polyline id="scene1-correct-a" points="120,120 180,170 340,150" fill="none" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5" opacity="0" />
                <!-- 标签 -->
                <text id="scene1-eq-a" x="240" y="80" font-size="14" fill="#c62828" text-anchor="middle" opacity="0">CaO + H₂O = Ca(OH)₂</text>
                <text id="scene1-desc-a" x="240" y="185" font-size="12" fill="#c62828" text-anchor="middle" opacity="0">溶剂减少，放热溶解度降，最终溶质减少</text>
            </g>

            <!-- 图B -->
            <g id="scene1-group-b" class="scene1-fade">
                <g id="scene1-border-b" opacity="0" stroke="#1565c0" stroke-width="2">
    <line x1="430" y1="20" x2="750" y2="20" />
    <line x1="750" y1="20" x2="750" y2="230" />
    <line x1="750" y1="230" x2="430" y2="230" />
    <line x1="430" y1="230" x2="430" y2="20" />
  </g>
                <text x="590" y="225" font-size="16" text-anchor="middle" font-weight="bold">B</text>
                <!-- 坐标轴 -->
                <line x1="480" y1="200" x2="720" y2="200" stroke="#000" stroke-width="1.5" marker-end="url(#scene1-arrow)" />
                <line x1="480" y1="200" x2="480" y2="60" stroke="#000" stroke-width="1.5" marker-end="url(#scene1-arrow)" />
                <text x="720" y="215" font-size="12" text-anchor="end">反应时间/min</text>
                <text x="480" y="50" font-size="12" text-anchor="middle">固体质量/g</text>
                <text x="470" y="215" font-size="12" text-anchor="middle">0</text>
                <!-- 原曲线 -->
                <line x1="480" y1="100" x2="640" y2="200" stroke="#000" stroke-width="2" />
                <!-- 修正曲线 -->
                <polyline id="scene1-correct-b" points="480,100 600,150 700,150" fill="none" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5" opacity="0" />
                <!-- 标签 -->
                <text id="scene1-eq-b" x="640" y="70" font-size="14" fill="#c62828" text-anchor="middle" opacity="0">2KMnO₄ = K₂MnO₄ + MnO₂ + O₂↑</text>
                <text id="scene1-desc-b" x="680" y="170" font-size="12" fill="#c62828" text-anchor="middle" opacity="0">
    <tspan x="680" dy="0">剩余固体为K₂MnO₄和MnO₂</tspan>
    <tspan x="680" dy="16">质量不为0</tspan>
  </text>
            </g>

            <!-- 图C -->
            <g id="scene1-group-c" class="scene1-fade">
                <g id="scene1-border-c" opacity="0" stroke="#1565c0" stroke-width="2">
    <line x1="70" y1="240" x2="390" y2="240" />
    <line x1="390" y1="240" x2="390" y2="450" />
    <line x1="390" y1="450" x2="70" y2="450" />
    <line x1="70" y1="450" x2="70" y2="240" />
  </g>
                <text x="230" y="445" font-size="16" text-anchor="middle" font-weight="bold">C</text>
                <!-- 坐标轴 -->
                <line x1="120" y1="420" x2="360" y2="420" stroke="#000" stroke-width="1.5" marker-end="url(#scene1-arrow)" />
                <line x1="120" y1="420" x2="120" y2="280" stroke="#000" stroke-width="1.5" marker-end="url(#scene1-arrow)" />
                <text x="360" y="435" font-size="12" text-anchor="end">时间</text>
                <text x="120" y="270" font-size="12" text-anchor="middle">固体质量(g)</text>
                <text x="110" y="435" font-size="12" text-anchor="middle">0</text>
                <!-- 原曲线 -->
                <polyline points="120,320 180,320 280,380 340,380" fill="none" stroke="#000" stroke-width="2" />
                <!-- 确认曲线 -->
                <polyline id="scene1-correct-c" points="120,320 180,320 280,380 340,380" fill="none" stroke="#2e7d32" stroke-width="3" opacity="0" />
                <!-- 标签 -->
                <text id="scene1-eq-c" x="240" y="280" font-size="14" fill="#2e7d32" text-anchor="middle" opacity="0">CaCO₃ = CaO + CO₂↑</text>
                <text id="scene1-desc-c1" x="150" y="310" font-size="12" fill="#2e7d32" text-anchor="middle" opacity="0">未反应</text>
                <text id="scene1-desc-c2" x="260" y="320" font-size="12" fill="#2e7d32" text-anchor="start" opacity="0">质量减少</text>
                <text id="scene1-desc-c3" x="310" y="395" font-size="12" fill="#2e7d32" text-anchor="middle" opacity="0">反应结束，剩余CaO</text>
            </g>

            <!-- 图D -->
            <g id="scene1-group-d" class="scene1-fade">
                <g id="scene1-border-d" opacity="0" stroke="#1565c0" stroke-width="2">
    <line x1="430" y1="240" x2="750" y2="240" />
    <line x1="750" y1="240" x2="750" y2="450" />
    <line x1="750" y1="450" x2="430" y2="450" />
    <line x1="430" y1="450" x2="430" y2="240" />
  </g>
                <text x="590" y="445" font-size="16" text-anchor="middle" font-weight="bold">D</text>
                <!-- 坐标轴 -->
                <line x1="480" y1="420" x2="720" y2="420" stroke="#000" stroke-width="1.5" marker-end="url(#scene1-arrow)" />
                <line x1="480" y1="420" x2="480" y2="280" stroke="#000" stroke-width="1.5" marker-end="url(#scene1-arrow)" />
                <text x="720" y="435" font-size="12" text-anchor="end">温度</text>
                <text x="480" y="270" font-size="12" text-anchor="middle">溶解度(L)</text>
                <text x="470" y="435" font-size="12" text-anchor="middle">0</text>
                <!-- 原曲线 -->
                <line x1="480" y1="360" x2="700" y2="340" stroke="#000" stroke-width="2" />
                <!-- 修正曲线 -->
                <path id="scene1-correct-d" d="M 480 360 Q 590 360 700 400" fill="none" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5" opacity="0" />
                <!-- 标签 -->
                <text id="scene1-eq-d" x="620" y="290" font-size="14" fill="#c62828" text-anchor="middle" opacity="0">气体溶解度随温度升高而减小</text>
                <text id="scene1-desc-d" x="600" y="425" font-size="12" fill="#c62828" text-anchor="middle" opacity="0">曲线应呈下降趋势</text>
            </g>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const totalSteps = 4;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');

        const groups = {
            a: document.getElementById('scene1-group-a'),
            b: document.getElementById('scene1-group-b'),
            c: document.getElementById('scene1-group-c'),
            d: document.getElementById('scene1-group-d')
        };

        const borders = {
            a: document.getElementById('scene1-border-a'),
            b: document.getElementById('scene1-border-b'),
            c: document.getElementById('scene1-border-c'),
            d: document.getElementById('scene1-border-d')
        };

        const elements = {
            a: [document.getElementById('scene1-correct-a'), document.getElementById('scene1-eq-a'), document.getElementById('scene1-desc-a')],
            b: [document.getElementById('scene1-correct-b'), document.getElementById('scene1-eq-b'), document.getElementById('scene1-desc-b')],
            c: [document.getElementById('scene1-correct-c'), document.getElementById('scene1-eq-c'), document.getElementById('scene1-desc-c1'), document.getElementById('scene1-desc-c2'), document.getElementById('scene1-desc-c3')],
            d: [document.getElementById('scene1-correct-d'), document.getElementById('scene1-eq-d'), document.getElementById('scene1-desc-d')]
        };

        function updateState() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps;

            // Reset all
            Object.values(groups).forEach(g => g.style.opacity = '1');
            Object.values(borders).forEach(b => b.style.opacity = '0');
            Object.values(elements).forEach(arr => arr.forEach(el => el.style.opacity = '0'));

            if (currentStep === 0) {
                // Initial state
            } else if (currentStep === 1) {
                groups.b.style.opacity = '0.3';
                groups.c.style.opacity = '0.3';
                groups.d.style.opacity = '0.3';
                borders.a.style.opacity = '1';
                elements.a.forEach(el => el.style.opacity = '1');
            } else if (currentStep === 2) {
                groups.a.style.opacity = '0.3';
                groups.c.style.opacity = '0.3';
                groups.d.style.opacity = '0.3';
                borders.b.style.opacity = '1';
                elements.b.forEach(el => el.style.opacity = '1');
            } else if (currentStep === 3) {
                groups.a.style.opacity = '0.3';
                groups.b.style.opacity = '0.3';
                groups.d.style.opacity = '0.3';
                borders.c.style.opacity = '1';
                elements.c.forEach(el => el.style.opacity = '1');
            } else if (currentStep === 4) {
                groups.a.style.opacity = '0.3';
                groups.b.style.opacity = '0.3';
                groups.c.style.opacity = '0.3';
                borders.d.style.opacity = '1';
                elements.d.forEach(el => el.style.opacity = '1');
            }
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateState();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < totalSteps) {
                currentStep++;
                updateState();
            }
        });

        updateState();
    })();
    </script>
</body>
</html>
