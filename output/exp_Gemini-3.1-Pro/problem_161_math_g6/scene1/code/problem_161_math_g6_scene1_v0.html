<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 20px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 16px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene1-text { font-size: 18px; opacity: 0; transition: opacity 0.3s; }
        .scene1-text.visible { opacity: 1; }
        .scene1-highlight { transition: opacity 0.3s; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500">
            <!-- Base graphics -->
            <g id="scene1-base">
                <rect x="80" y="130" width="400" height="200" fill="none" stroke="#000000" stroke-width="2" />
                <line x1="166" y1="130" x2="166" y2="330" stroke="#000000" stroke-width="2" />
                <line x1="223" y1="130" x2="223" y2="330" stroke="#000000" stroke-width="2" />
                <line x1="394" y1="130" x2="394" y2="330" stroke="#000000" stroke-width="2" />
            </g>
            
            <!-- Highlights container -->
            <g id="scene1-highlights"></g>

            <!-- Texts -->
            <text id="scene1-text-1" class="scene1-text" x="520" y="160" fill="#1565c0">由1个基本图形组成：4个</text>
            <text id="scene1-text-2" class="scene1-text" x="520" y="210" fill="#2e7d32">由2个基本图形组成：3个</text>
            <text id="scene1-text-3" class="scene1-text" x="520" y="260" fill="#c62828">由3个基本图形组成：2个</text>
            <text id="scene1-text-4" class="scene1-text" x="520" y="310" fill="#000000">由4个基本图形组成：1个</text>
            <text id="scene1-text-5" class="scene1-text" x="520" y="370" fill="#000000" font-weight="bold">总计：4 + 3 + 2 + 1 = 10</text>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 5;
        let animationVersion = 0;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const highlightsContainer = document.getElementById('scene1-highlights');

        const texts = [
            null,
            document.getElementById('scene1-text-1'),
            document.getElementById('scene1-text-2'),
            document.getElementById('scene1-text-3'),
            document.getElementById('scene1-text-4'),
            document.getElementById('scene1-text-5')
        ];

        // x positions of the vertical lines: 80, 166, 223, 394, 480
        const xs = [80, 166, 223, 394, 480];

        const stepData = {
            1: { color: '#1565c0', opacity: 0.3, rects: [[0,1], [1,2], [2,3], [3,4]] },
            2: { color: '#2e7d32', opacity: 0.3, rects: [[0,2], [1,3], [2,4]] },
            3: { color: '#c62828', opacity: 0.3, rects: [[0,3], [1,4]] },
            4: { color: '#000000', opacity: 0.2, rects: [[0,4]] },
            5: { color: '#000000', opacity: 0, rects: [] } // No highlights for step 5, just text
        };

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        async function renderStep(step) {
            const currentVersion = ++animationVersion;
            
            // Clear highlights
            highlightsContainer.innerHTML = '';
            
            // Update texts visibility
            for (let i = 1; i <= maxStep; i++) {
                if (i <= step) {
                    texts[i].classList.add('visible');
                } else {
                    texts[i].classList.remove('visible');
                }
            }

            if (step === 0) return;

            const data = stepData[step];
            if (!data || data.rects.length === 0) return;

            for (let i = 0; i < data.rects.length; i++) {
                if (currentVersion !== animationVersion) return;

                const [startIdx, endIdx] = data.rects[i];
                const x = xs[startIdx];
                const width = xs[endIdx] - x;

                const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                rect.setAttribute('x', x);
                rect.setAttribute('y', 130);
                rect.setAttribute('width', width);
                rect.setAttribute('height', 200);
                rect.setAttribute('fill', data.color);
                rect.setAttribute('opacity', '0');
                rect.classList.add('scene1-highlight');
                
                highlightsContainer.appendChild(rect);

                // Trigger reflow
                rect.getBoundingClientRect();
                rect.setAttribute('opacity', data.opacity);

                if (i < data.rects.length - 1) {
                    await sleep(400);
                }
            }
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateButtons();
                renderStep(currentStep);
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateButtons();
                renderStep(currentStep);
            }
        });

        function updateButtons() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
        }

        // Initialize
        updateButtons();
        renderStep(0);
    })();
    </script>
</body>
</html>
