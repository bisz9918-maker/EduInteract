<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 20px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 15px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 16px; font-weight: bold; min-width: 60px; text-align: center; }
        
        /* SVG Elements */
        .scene1-dynamic { transition: opacity 0.3s ease; opacity: 0; }
        .scene1-show { opacity: 1; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- Base Graphics -->
            <!-- Outer contour and inner lines -->
            <path d="M 220 230 L 220 350 L 580 350 L 580 110 L 400 110 L 400 230 Z" fill="none" stroke="#000000" stroke-width="2" />
            <line x1="220" y1="350" x2="580" y2="110" stroke="#000000" stroke-width="2" /> <!-- AC -->
            <line x1="400" y1="350" x2="580" y2="110" stroke="#000000" stroke-width="2" /> <!-- BC -->
            <line x1="400" y1="350" x2="400" y2="230" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" /> <!-- BE -->
            
            <!-- Dynamic Elements -->
            <!-- Step 1: Blue Triangle ABC -->
            <polygon id="scene1-triangle-abc" points="220,350 400,350 580,110" fill="#1565c0" fill-opacity="0.2" stroke="#1565c0" stroke-width="3" class="scene1-dynamic" />
            
            <!-- Step 2: Red Base AB -->
            <line id="scene1-base-ab" x1="220" y1="350" x2="400" y2="350" stroke="#c62828" stroke-width="4" class="scene1-dynamic" />
            
            <!-- Step 3: Red Dashed Extension BD -->
            <line id="scene1-ext-bd" x1="400" y1="350" x2="580" y2="350" stroke="#c62828" stroke-width="4" stroke-dasharray="6,4" class="scene1-dynamic" />
            
            <!-- Step 4: Green Height CD & Right Angle -->
            <line id="scene1-height-cd" x1="580" y1="110" x2="580" y2="350" stroke="#2e7d32" stroke-width="4" class="scene1-dynamic" />
            <polyline id="scene1-right-angle" points="565,350 565,335 580,335" fill="none" stroke="#2e7d32" stroke-width="2" class="scene1-dynamic" />
            
            <!-- Labels -->
            <text x="210" y="370" font-family="Arial" font-size="20" fill="#000000" text-anchor="middle">A</text>
            <text x="400" y="370" font-family="Arial" font-size="20" fill="#000000" text-anchor="middle">B</text>
            <text x="580" y="370" font-family="Arial" font-size="20" fill="#000000" text-anchor="middle">D</text>
            <text x="590" y="100" font-family="Arial" font-size="20" fill="#000000" text-anchor="middle">C</text>
            <text x="385" y="220" font-family="Arial" font-size="20" fill="#000000" text-anchor="end" transform="translate(-5, -15)">E</text>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <div id="scene1-step-indicator">0 / 4</div>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 4;
        
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        
        const elTriangle = document.getElementById('scene1-triangle-abc');
        const elBase = document.getElementById('scene1-base-ab');
        const elExt = document.getElementById('scene1-ext-bd');
        const elHeight = document.getElementById('scene1-height-cd');
        const elRightAngle = document.getElementById('scene1-right-angle');
        
        function updateState() {
            // Update buttons
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
            stepIndicator.textContent = currentStep + ' / ' + maxStep;
            
            // Update visibility
            elTriangle.classList.toggle('scene1-show', currentStep >= 1);
            elBase.classList.toggle('scene1-show', currentStep >= 2);
            elExt.classList.toggle('scene1-show', currentStep >= 3);
            elHeight.classList.toggle('scene1-show', currentStep >= 4);
            elRightAngle.classList.toggle('scene1-show', currentStep >= 4);
        }
        
        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateState();
            }
        });
        
        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateState();
            }
        });
        
        // Initialize
        updateState();
    })();
    </script>
</body>
</html>
