<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .math-formula { position: absolute; opacity: 0; transition: opacity 0.3s, background-color 0.3s; text-align: center; padding: 4px; border-radius: 4px; }
        .conclusion { position: absolute; opacity: 0; transition: opacity 0.3s; text-align: center; color: #c62828; font-weight: bold; font-size: 18px; width: 100%; left: 0; }
        svg { position: absolute; top: 0; left: 0; }
        .shape { transition: fill 0.3s, stroke 0.3s, stroke-width 0.3s; }
        .anim-el { transition: opacity 0.3s; }
        .shape-label { position: absolute; transform: translateX(-50%); font-size: 24px; font-family: serif; font-weight: bold; pointer-events: none; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- Base lines -->
            <line x1="50" y1="120" x2="750" y2="120" stroke="#000" stroke-width="2" />
            <line x1="50" y1="320" x2="750" y2="320" stroke="#000" stroke-width="2" />

            <!-- Ticks and labels -->
            <g id="scene1-ticks" stroke="#000" stroke-width="2">
                <!-- Top ticks -->
                <line x1="100" y1="110" x2="100" y2="120" />
                <line x1="220" y1="110" x2="220" y2="120" />
                <line x1="340" y1="110" x2="340" y2="120" />
                <line x1="460" y1="110" x2="460" y2="120" />
                <line x1="580" y1="110" x2="580" y2="120" />
                <line x1="700" y1="110" x2="700" y2="120" />
                
                <!-- Bottom ticks -->
                <line x1="100" y1="320" x2="100" y2="330" />
                <line x1="220" y1="320" x2="220" y2="330" />
                <line x1="340" y1="320" x2="340" y2="330" />
                <line x1="460" y1="320" x2="460" y2="330" />
                <line x1="580" y1="320" x2="580" y2="330" />
                <line x1="700" y1="320" x2="700" y2="330" />
            </g>

            <g id="scene1-labels" font-size="16" font-family="serif" text-anchor="middle">
                <!-- Top labels -->
                <text x="100" y="100">0</text>
                <text x="220" y="100">1</text>
                <text x="340" y="100">2</text>
                <text x="460" y="100">3</text>
                <text x="580" y="100">4</text>
                <text x="700" y="100">5</text>

                <!-- Bottom labels -->
                <text x="100" y="350">0</text>
                <text x="220" y="350">1</text>
                <text x="340" y="350">2</text>
                <text x="460" y="350">3</text>
                <text x="580" y="350">4</text>
                <text x="700" y="350">5</text>
            </g>

            <!-- Shapes -->
            <polygon id="scene1-fig1" class="shape" points="100,320 340,320 220,120" fill="transparent" stroke="#000" stroke-width="2" />
            <polygon id="scene1-fig2" class="shape" points="340,320 460,320 580,120 460,120" fill="transparent" stroke="#000" stroke-width="2" />
            <polygon id="scene1-fig3" class="shape" points="640,320 700,320 700,120 580,120" fill="transparent" stroke="#000" stroke-width="2" />

            <!-- Step 1: Height h -->
            <g id="scene1-step1-h" class="anim-el" opacity="0">
                <line x1="70" y1="120" x2="70" y2="320" stroke="#888" stroke-width="2" stroke-dasharray="5,5" />
                <polyline points="70,310 80,310 80,320" fill="none" stroke="#888" stroke-width="2" />
                <polyline points="70,130 80,130 80,120" fill="none" stroke="#888" stroke-width="2" />
                <text x="55" y="225" font-size="18" font-family="serif" font-style="italic" fill="#888" text-anchor="end">h</text>
            </g>

            <!-- Step 2: Fig 1 dimension -->
            <g id="scene1-step2-dim" class="anim-el" opacity="0">
                <line x1="100" y1="370" x2="340" y2="370" stroke="#1565c0" stroke-width="2" />
                <line x1="100" y1="365" x2="100" y2="375" stroke="#1565c0" stroke-width="2" />
                <line x1="340" y1="365" x2="340" y2="375" stroke="#1565c0" stroke-width="2" />
                <text x="220" y="390" font-size="16" font-family="serif" fill="#1565c0" text-anchor="middle">2</text>
            </g>

            <!-- Step 3: Fig 2 dimension -->
            <g id="scene1-step3-dim" class="anim-el" opacity="0">
                <line x1="340" y1="370" x2="460" y2="370" stroke="#2e7d32" stroke-width="2" />
                <line x1="340" y1="365" x2="340" y2="375" stroke="#2e7d32" stroke-width="2" />
                <line x1="460" y1="365" x2="460" y2="375" stroke="#2e7d32" stroke-width="2" />
                <text x="400" y="390" font-size="16" font-family="serif" fill="#2e7d32" text-anchor="middle">1</text>
            </g>

            <!-- Step 4: Fig 3 dimensions -->
            <g id="scene1-step4-dim" class="anim-el" opacity="0">
                <!-- Top dim -->
                <line x1="580" y1="70" x2="700" y2="70" stroke="#c62828" stroke-width="2" />
                <line x1="580" y1="65" x2="580" y2="75" stroke="#c62828" stroke-width="2" />
                <line x1="700" y1="65" x2="700" y2="75" stroke="#c62828" stroke-width="2" />
                <text x="640" y="60" font-size="16" font-family="serif" fill="#c62828" text-anchor="middle">1</text>
                
                <!-- Bottom dim -->
                <line x1="640" y1="370" x2="700" y2="370" stroke="#c62828" stroke-width="2" />
                <line x1="640" y1="365" x2="640" y2="375" stroke="#c62828" stroke-width="2" />
                <line x1="700" y1="365" x2="700" y2="375" stroke="#c62828" stroke-width="2" />
                <text x="670" y="390" font-size="16" font-family="serif" fill="#c62828" text-anchor="middle">0.5</text>
            </g>
        </svg>

        <!-- Shape labels (HTML to avoid SVG overlap check with polygons) -->
        <div class="shape-label" style="left: 220px; top: 225px;">1</div>
        <div class="shape-label" style="left: 440px; top: 225px;">2</div>
        <div class="shape-label" style="left: 660px; top: 225px;">3</div>

        <!-- Formulas -->
        <div id="scene1-s1" class="math-formula" style="left: 100px; top: 400px; width: 240px; color: #1565c0;">
            \( S_1 = rac{1}{2} 	imes 2 	imes h = h \)
        </div>
        <div id="scene1-s2" class="math-formula" style="left: 340px; top: 400px; width: 120px; color: #2e7d32;">
            \( S_2 = 1 	imes h = h \)
        </div>
        <div id="scene1-s3" class="math-formula" style="left: 500px; top: 400px; width: 260px; color: #c62828;">
            \( S_3 = rac{1}{2} 	imes (1 + 0.5) 	imes h = 0.75h \)
        </div>

        <!-- Conclusion -->
        <div id="scene1-conclusion" class="conclusion" style="top: 445px;">
            结论：图3的面积最小
        </div>

        <!-- Controls -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let step = 0;
        const maxStep = 5;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');

        const fig1 = document.getElementById('scene1-fig1');
        const fig2 = document.getElementById('scene1-fig2');
        const fig3 = document.getElementById('scene1-fig3');

        const step1H = document.getElementById('scene1-step1-h');
        const step2Dim = document.getElementById('scene1-step2-dim');
        const step3Dim = document.getElementById('scene1-step3-dim');
        const step4Dim = document.getElementById('scene1-step4-dim');

        const s1 = document.getElementById('scene1-s1');
        const s2 = document.getElementById('scene1-s2');
        const s3 = document.getElementById('scene1-s3');
        const conclusion = document.getElementById('scene1-conclusion');

        function updateState() {
            btnPrev.disabled = step === 0;
            btnNext.disabled = step === maxStep;

            // Step 1: Height h
            step1H.style.opacity = step >= 1 ? '1' : '0';

            // Step 2: Fig 1
            if (step >= 2) {
                fig1.setAttribute('stroke', '#1565c0');
                fig1.setAttribute('stroke-width', '3');
                fig1.setAttribute('fill', 'rgba(21,101,192,0.2)');
                step2Dim.style.opacity = '1';
                s1.style.opacity = '1';
            } else {
                fig1.setAttribute('stroke', '#000');
                fig1.setAttribute('stroke-width', '2');
                fig1.setAttribute('fill', 'transparent');
                step2Dim.style.opacity = '0';
                s1.style.opacity = '0';
            }

            // Step 3: Fig 2
            if (step >= 3) {
                fig2.setAttribute('stroke', '#2e7d32');
                fig2.setAttribute('stroke-width', '3');
                fig2.setAttribute('fill', 'rgba(46,125,50,0.2)');
                step3Dim.style.opacity = '1';
                s2.style.opacity = '1';
            } else {
                fig2.setAttribute('stroke', '#000');
                fig2.setAttribute('stroke-width', '2');
                fig2.setAttribute('fill', 'transparent');
                step3Dim.style.opacity = '0';
                s2.style.opacity = '0';
            }

            // Step 4: Fig 3
            if (step >= 4) {
                fig3.setAttribute('stroke', '#c62828');
                fig3.setAttribute('stroke-width', '3');
                fig3.setAttribute('fill', 'rgba(198,40,40,0.2)');
                step4Dim.style.opacity = '1';
                s3.style.opacity = '1';
            } else {
                fig3.setAttribute('stroke', '#000');
                fig3.setAttribute('stroke-width', '2');
                fig3.setAttribute('fill', 'transparent');
                step4Dim.style.opacity = '0';
                s3.style.opacity = '0';
            }

            // Step 5: Conclusion
            if (step >= 5) {
                s3.style.backgroundColor = 'rgba(255,235,59,0.5)';
                conclusion.style.opacity = '1';
            } else {
                s3.style.backgroundColor = 'transparent';
                conclusion.style.opacity = '0';
            }
        }

        btnPrev.addEventListener('click', () => {
            if (step > 0) {
                step--;
                updateState();
            }
        });

        btnNext.addEventListener('click', () => {
            if (step < maxStep) {
                step++;
                updateState();
            }
        });

        updateState();
    })();
    </script>
</body>
</html>
