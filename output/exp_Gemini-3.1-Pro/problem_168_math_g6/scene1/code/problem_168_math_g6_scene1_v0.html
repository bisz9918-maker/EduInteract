<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* 公式区样式 */
        #scene1-formula-area { position: absolute; left: 450px; top: 100px; width: 300px; height: 220px; font-size: 18px; line-height: 1.8; }
        .scene1-formula-line { opacity: 0; transition: opacity 0.3s; }
        
        /* SVG 元素过渡 */
        .scene1-transition { transition: all 0.5s ease; }
        
        /* 展开线段动画 */
        .scene1-expand-line { stroke-dasharray: 600; stroke-dashoffset: 600; transition: stroke-dashoffset 1s ease-in-out; }
        .scene1-expand-line.expanded { stroke-dashoffset: 0; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- 辅助对齐线 (初始隐藏) -->
            <g id="scene1-guidelines" opacity="0" class="scene1-transition">
                <line x1="100" y1="360" x2="100" y2="390" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" />
                <line x1="602.6" y1="360" x2="602.6" y2="390" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" />
                <line x1="288.5" y1="360" x2="288.5" y2="390" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" />
            </g>

            <!-- 展开线段 (初始隐藏) -->
            <g id="scene1-expanded-lines" opacity="0" class="scene1-transition">
                <!-- 大圆周长 -->
                <line x1="100" y1="360" x2="602.6" y2="360" stroke="#2e7d32" stroke-width="4" class="scene1-expand-line" id="scene1-line-C" />
                <text x="351" y="350" fill="#2e7d32" font-size="16" text-anchor="middle" class="scene1-transition" opacity="0" id="scene1-label-exp-C">C</text>
                
                <!-- 左小圆周长 -->
                <line x1="100" y1="390" x2="288.5" y2="390" stroke="#1565c0" stroke-width="4" class="scene1-expand-line" id="scene1-line-C1" />
                <text x="194" y="410" fill="#1565c0" font-size="16" text-anchor="middle" class="scene1-transition" opacity="0" id="scene1-label-exp-C1">C₁</text>
                
                <!-- 右小圆周长 -->
                <line x1="288.5" y1="390" x2="602.6" y2="390" stroke="#c62828" stroke-width="4" class="scene1-expand-line" id="scene1-line-C2" />
                <text x="445" y="410" fill="#c62828" font-size="16" text-anchor="middle" class="scene1-transition" opacity="0" id="scene1-label-exp-C2">C₂</text>
            </g>

            <!-- 几何图形区 -->
            <!-- 大圆 -->
            <circle id="scene1-circle-large" cx="250" cy="160" r="80" fill="none" stroke="#000000" stroke-width="2" class="scene1-transition" />
            <text id="scene1-label-C" x="250" y="265" text-anchor="middle" fill="#2e7d32" font-size="16" opacity="0" class="scene1-transition">C</text>
            
            <!-- 左小圆 -->
            <circle id="scene1-circle-small1" cx="200" cy="160" r="30" fill="none" stroke="#000000" stroke-width="2" class="scene1-transition" />
            <text id="scene1-label-C1" x="150" y="125" fill="#1565c0" font-size="16" opacity="0" class="scene1-transition">C₁</text>
            
            <!-- 右小圆 -->
            <circle id="scene1-circle-small2" cx="280" cy="160" r="50" fill="none" stroke="#000000" stroke-width="2" class="scene1-transition" />
            <text id="scene1-label-C2" x="345" y="110" fill="#c62828" font-size="16" opacity="0" class="scene1-transition">C₂</text>

            <!-- 水平直径 -->
            <line id="scene1-diameter-main" x1="170" y1="160" x2="330" y2="160" stroke="#000000" stroke-width="1.5" class="scene1-transition" />

            <!-- 直径标注 (初始隐藏) -->
            <g id="scene1-diameter-marks" opacity="0" class="scene1-transition">
                <!-- d1 -->
                <line x1="170" y1="260" x2="230" y2="260" stroke="#1565c0" stroke-width="1.5" />
                <line x1="170" y1="255" x2="170" y2="265" stroke="#1565c0" stroke-width="1.5" />
                <line x1="230" y1="255" x2="230" y2="265" stroke="#1565c0" stroke-width="1.5" />
                <text x="200" y="280" fill="#1565c0" font-size="16" text-anchor="middle">d₁</text>
                
                <!-- d2 -->
                <line x1="230" y1="260" x2="330" y2="260" stroke="#c62828" stroke-width="1.5" />
                <line x1="230" y1="255" x2="230" y2="265" stroke="#c62828" stroke-width="1.5" />
                <line x1="330" y1="255" x2="330" y2="265" stroke="#c62828" stroke-width="1.5" />
                <text x="280" y="280" fill="#c62828" font-size="16" text-anchor="middle">d₂</text>
                
                <!-- D -->
                <line x1="170" y1="60" x2="330" y2="60" stroke="#2e7d32" stroke-width="1.5" />
                <line x1="170" y1="55" x2="170" y2="65" stroke="#2e7d32" stroke-width="1.5" />
                <line x1="330" y1="55" x2="330" y2="65" stroke="#2e7d32" stroke-width="1.5" />
                <text x="250" y="50" fill="#2e7d32" font-size="16" text-anchor="middle">D</text>
            </g>
        </svg>

        <!-- 公式区 -->
        <div id="scene1-formula-area">
            <div id="scene1-f1" class="scene1-formula-line">\( d_1 + d_2 = D \)</div>
            <div id="scene1-f2" class="scene1-formula-line">\( C_1 = \pi d_1, \quad C_2 = \pi d_2, \quad C = \pi D \)</div>
            <div id="scene1-f3" class="scene1-formula-line">\( C_1 + C_2 = \pi d_1 + \pi d_2 = \pi(d_1 + d_2) \)</div>
            <div id="scene1-f4" class="scene1-formula-line" style="color: #2e7d32; font-weight: bold;">\( C_1 + C_2 = \pi D = C \)</div>
        </div>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 5;
        
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        
        // SVG 元素
        const circleLarge = document.getElementById('scene1-circle-large');
        const circleSmall1 = document.getElementById('scene1-circle-small1');
        const circleSmall2 = document.getElementById('scene1-circle-small2');
        const labelC = document.getElementById('scene1-label-C');
        const labelC1 = document.getElementById('scene1-label-C1');
        const labelC2 = document.getElementById('scene1-label-C2');
        const diameterMarks = document.getElementById('scene1-diameter-marks');
        
        // 展开线段元素
        const expandedLines = document.getElementById('scene1-expanded-lines');
        const guidelines = document.getElementById('scene1-guidelines');
        const lineC = document.getElementById('scene1-line-C');
        const lineC1 = document.getElementById('scene1-line-C1');
        const lineC2 = document.getElementById('scene1-line-C2');
        const labelExpC = document.getElementById('scene1-label-exp-C');
        const labelExpC1 = document.getElementById('scene1-label-exp-C1');
        const labelExpC2 = document.getElementById('scene1-label-exp-C2');
        
        // 公式元素
        const f1 = document.getElementById('scene1-f1');
        const f2 = document.getElementById('scene1-f2');
        const f3 = document.getElementById('scene1-f3');
        const f4 = document.getElementById('scene1-f4');

        function updateState() {
            // 按钮状态
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
            
            // 步骤 0: 初始状态
            if (currentStep < 1) {
                diameterMarks.style.opacity = '0';
                f1.style.opacity = '0';
            }
            
            // 步骤 1: 显示直径标注和公式1
            if (currentStep >= 1) {
                diameterMarks.style.opacity = '1';
                f1.style.opacity = '1';
            }
            
            // 步骤 2: 圆变色，显示周长标签和公式2
            if (currentStep >= 2) {
                circleSmall1.setAttribute('stroke', '#1565c0');
                circleSmall1.setAttribute('fill', 'rgba(21, 101, 192, 0.1)');
                labelC1.style.opacity = '1';
                
                circleSmall2.setAttribute('stroke', '#c62828');
                circleSmall2.setAttribute('fill', 'rgba(198, 40, 40, 0.1)');
                labelC2.style.opacity = '1';
                
                circleLarge.setAttribute('stroke', '#2e7d32');
                labelC.style.opacity = '1';
                
                f2.style.opacity = '1';
            } else {
                circleSmall1.setAttribute('stroke', '#000000');
                circleSmall1.setAttribute('fill', 'none');
                labelC1.style.opacity = '0';
                
                circleSmall2.setAttribute('stroke', '#000000');
                circleSmall2.setAttribute('fill', 'none');
                labelC2.style.opacity = '0';
                
                circleLarge.setAttribute('stroke', '#000000');
                labelC.style.opacity = '0';
                
                f2.style.opacity = '0';
            }
            
            // 步骤 3: 公式3
            if (currentStep >= 3) {
                f3.style.opacity = '1';
            } else {
                f3.style.opacity = '0';
            }
            
            // 步骤 4: 公式4 (结论)
            if (currentStep >= 4) {
                f4.style.opacity = '1';
            } else {
                f4.style.opacity = '0';
            }
            
            // 步骤 5: 展开线段
            if (currentStep >= 5) {
                expandedLines.style.opacity = '1';
                guidelines.style.opacity = '1';
                
                // 触发动画
                setTimeout(() => {
                    lineC.classList.add('expanded');
                    lineC1.classList.add('expanded');
                    lineC2.classList.add('expanded');
                    
                    setTimeout(() => {
                        labelExpC.style.opacity = '1';
                        labelExpC1.style.opacity = '1';
                        labelExpC2.style.opacity = '1';
                    }, 800);
                }, 50);
            } else {
                expandedLines.style.opacity = '0';
                guidelines.style.opacity = '0';
                
                lineC.classList.remove('expanded');
                lineC1.classList.remove('expanded');
                lineC2.classList.remove('expanded');
                
                labelExpC.style.opacity = '0';
                labelExpC1.style.opacity = '0';
                labelExpC2.style.opacity = '0';
            }
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateState();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateState();
            }
        });

        // 初始化
        updateState();
    })();
    </script>
</body>
</html>
