<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .axis-line { stroke: #000; stroke-width: 1.5; }
        .axis-arrow { fill: #000; }
        .text-label { font-size: 16px; fill: #000; text-anchor: middle; dominant-baseline: middle; transition: all 0.3s; }
        .point { fill: #000; }
        .main-line { stroke: #000; stroke-width: 1.5; }
        .tick-mark { stroke: #000; stroke-width: 1.5; }
        .arc { stroke: #000; stroke-width: 1.5; fill: none; }
        
        .highlight-blue { stroke: #1565c0; fill: #1565c0; }
        .highlight-red { stroke: #c62828; fill: #c62828; }
        
        .step-element { opacity: 0; transition: opacity 0.3s; }
        .step-active { opacity: 1; }
        
        .dynamic-sector { fill: #1565c0; opacity: 0; transition: opacity 0.3s; }
        .dynamic-sector.active { opacity: 0.2; }
        
        .conclusion-text { font-size: 18px; fill: #000; }
        .conclusion-red { fill: #c62828; font-weight: bold; }
        .conclusion-blue { fill: #1565c0; font-weight: bold; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- Definitions for arrows -->
            <defs>
                <marker id="arrow-up" viewBox="0 0 10 10" refX="5" refY="0" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 10 L 5 0 L 10 10 z" class="axis-arrow" />
                </marker>
                <marker id="arrow-down" viewBox="0 0 10 10" refX="5" refY="10" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 5 10 L 10 0 z" class="axis-arrow" />
                </marker>
                <marker id="arrow-left" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 10 0 L 0 5 L 10 10 z" class="axis-arrow" />
                </marker>
                <marker id="arrow-right" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" class="axis-arrow" />
                </marker>
                <marker id="arrow-up-blue" viewBox="0 0 10 10" refX="5" refY="0" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 10 L 5 0 L 10 10 z" fill="#1565c0" />
                </marker>
            </defs>

            <!-- Dynamic Sector (Step 1) -->
            <path id="scene1-sector" class="dynamic-sector" d="M 350 250 L 350 90 A 160 160 0 0 1 452.8 127.4 Z" />

            <!-- Axes -->
            <line id="scene1-axis-n" x1="350" y1="250" x2="350" y2="50" class="axis-line" marker-end="url(#arrow-up)" />
            <line id="scene1-axis-s" x1="350" y1="250" x2="350" y2="410" class="axis-line" marker-end="url(#arrow-down)" />
            <line id="scene1-axis-w" x1="350" y1="250" x2="150" y2="250" class="axis-line" marker-end="url(#arrow-left)" />
            <line id="scene1-axis-e" x1="350" y1="250" x2="550" y2="250" class="axis-line" marker-end="url(#arrow-right)" />

            <!-- Axis Labels -->
            <text id="scene1-label-n" x="350" y="35" class="text-label">北</text>
            <text id="scene1-label-s" x="350" y="430" class="text-label">南</text>
            <text id="scene1-label-w" x="130" y="250" class="text-label">西</text>
            <text id="scene1-label-e" x="570" y="250" class="text-label">东</text>

            <!-- Main Line and Points -->
            <line id="scene1-main-line" x1="350" y1="250" x2="452.8" y2="127.4" class="main-line" />
            
            <!-- Dynamic Red Lines (Step 2) -->
            <line id="scene1-red-line1" x1="350" y1="250" x2="401.4" y2="188.7" class="main-line step-element" stroke="#c62828" stroke-width="3" />
            <line id="scene1-red-line2" x1="401.4" y1="188.7" x2="452.8" y2="127.4" class="main-line step-element" stroke="#c62828" stroke-width="3" />

            <!-- Midpoint Tick -->
            <line id="scene1-tick" x1="397.6" y1="191.9" x2="405.2" y2="185.5" class="tick-mark" />

            <!-- Points -->
            <circle id="scene1-pt-radar" cx="350" cy="250" r="3" class="point" />
            <circle id="scene1-pt-cruiser" cx="452.8" cy="127.4" r="3" class="point" />

            <!-- Point Labels -->
            <text id="scene1-label-radar" x="350" y="270" class="text-label">雷达站</text>
            <text id="scene1-label-cruiser" x="485" y="115" class="text-label">巡洋舰</text>

            <!-- Angle Arc -->
            <path id="scene1-arc" d="M 350 200 A 50 50 0 0 1 382.1 211.7" class="arc" />
            <!-- Move 40° label to the left of the North axis, higher up -->
            <text id="scene1-label-angle" x="320" y="160" class="text-label">40°</text>

            <!-- Scale -->
            <line id="scene1-scale-line" x1="600" y1="400" x2="680" y2="400" class="main-line" />
            <line id="scene1-scale-tick1" x1="600" y1="395" x2="600" y2="405" class="tick-mark" />
            <line id="scene1-scale-tick2" x1="680" y1="395" x2="680" y2="405" class="tick-mark" />
            <text id="scene1-label-scale" x="640" y="380" class="text-label">50 km</text>

            <!-- Dynamic Distance Labels (Step 2) -->
            <!-- Move 50km labels further right and down to avoid overlapping line -->
            <text id="scene1-label-dist1" x="435" y="265" class="text-label step-element conclusion-red">50 km</text>
            <text id="scene1-label-dist2" x="485" y="205" class="text-label step-element conclusion-red">50 km</text>

            <!-- Conclusion Texts -->
            <!-- Move conclusion texts further left to avoid clipping -->
            <text id="scene1-text-step1" x="530" y="80" class="conclusion-text step-element conclusion-blue" text-anchor="start">方向：北偏东40°</text>
            <text id="scene1-text-step2" x="530" y="120" class="conclusion-text step-element conclusion-red" text-anchor="start">距离：50 + 50 = 100 km</text>
            <text id="scene1-text-step3" x="530" y="160" class="conclusion-text step-element" text-anchor="start" font-weight="bold">结论：北偏东40°方向100km</text>
            <text id="scene1-text-step3-ans" x="530" y="200" class="conclusion-text step-element conclusion-red" text-anchor="start" font-size="24px">选择 C</text>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 3;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');

        const elements = {
            axisN: document.getElementById('scene1-axis-n'),
            labelN: document.getElementById('scene1-label-n'),
            labelE: document.getElementById('scene1-label-e'),
            labelAngle: document.getElementById('scene1-label-angle'),
            sector: document.getElementById('scene1-sector'),
            textStep1: document.getElementById('scene1-text-step1'),
            
            scaleLine: document.getElementById('scene1-scale-line'),
            labelScale: document.getElementById('scene1-label-scale'),
            redLine1: document.getElementById('scene1-red-line1'),
            redLine2: document.getElementById('scene1-red-line2'),
            labelDist1: document.getElementById('scene1-label-dist1'),
            labelDist2: document.getElementById('scene1-label-dist2'),
            textStep2: document.getElementById('scene1-text-step2'),
            
            textStep3: document.getElementById('scene1-text-step3'),
            textStep3Ans: document.getElementById('scene1-text-step3-ans'),
            labelScaleText: document.getElementById('scene1-label-scale')
        };

        function updateScene() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;

            // Reset all
            elements.axisN.style.stroke = '#000';
            elements.axisN.style.strokeWidth = '1.5';
            elements.axisN.setAttribute('marker-end', 'url(#arrow-up)');
            
            elements.labelN.style.fill = '#000';
            elements.labelN.style.transform = 'scale(1)';
            elements.labelE.style.fill = '#000';
            elements.labelE.style.transform = 'scale(1)';
            elements.labelAngle.style.fill = '#000';
            elements.labelAngle.style.transform = 'scale(1)';
            
            elements.sector.classList.remove('active');
            elements.textStep1.classList.remove('step-active');
            
            elements.scaleLine.style.stroke = '#000';
            elements.scaleLine.style.strokeWidth = '1.5';
            elements.labelScaleText.style.fill = '#000';
            elements.labelScaleText.style.fontWeight = 'normal';
            
            elements.redLine1.classList.remove('step-active');
            elements.redLine2.classList.remove('step-active');
            elements.labelDist1.classList.remove('step-active');
            elements.labelDist2.classList.remove('step-active');
            elements.textStep2.classList.remove('step-active');
            
            elements.textStep3.classList.remove('step-active');
            elements.textStep3Ans.classList.remove('step-active');

            if (currentStep >= 1) {
                elements.axisN.style.stroke = '#1565c0';
                elements.axisN.style.strokeWidth = '3';
                elements.axisN.setAttribute('marker-end', 'url(#arrow-up-blue)');
                
                elements.labelN.style.fill = '#1565c0';
                elements.labelN.style.transform = 'scale(1)'; // Removed scaling to avoid overlap
                elements.labelE.style.fill = '#1565c0';
                elements.labelE.style.transform = 'scale(1)'; // Removed scaling to avoid overlap
                elements.labelAngle.style.fill = '#1565c0';
                elements.labelAngle.style.transform = 'scale(1)'; // Removed scaling to avoid overlap
                
                elements.sector.classList.add('active');
                elements.textStep1.classList.add('step-active');
            }

            if (currentStep >= 2) {
                if (currentStep === 2) {
                    elements.axisN.style.stroke = '#000';
                    elements.axisN.style.strokeWidth = '1.5';
                    elements.axisN.setAttribute('marker-end', 'url(#arrow-up)');
                    
                    elements.labelN.style.fill = '#000';
                    elements.labelN.style.transform = 'scale(1)';
                    elements.labelE.style.fill = '#000';
                    elements.labelE.style.transform = 'scale(1)';
                    elements.labelAngle.style.fill = '#000';
                    elements.labelAngle.style.transform = 'scale(1)';
                    
                    elements.sector.classList.remove('active');
                }
                
                elements.scaleLine.style.stroke = '#c62828';
                elements.scaleLine.style.strokeWidth = '3';
                elements.labelScaleText.style.fill = '#c62828';
                elements.labelScaleText.style.fontWeight = 'bold';
                
                elements.redLine1.classList.add('step-active');
                elements.redLine2.classList.add('step-active');
                elements.labelDist1.classList.add('step-active');
                elements.labelDist2.classList.add('step-active');
                elements.textStep2.classList.add('step-active');
            }

            if (currentStep === 3) {
                elements.axisN.style.stroke = '#1565c0';
                elements.axisN.style.strokeWidth = '3';
                elements.axisN.setAttribute('marker-end', 'url(#arrow-up-blue)');
                
                elements.labelN.style.fill = '#1565c0';
                elements.labelN.style.transform = 'scale(1)'; // Removed scaling to avoid overlap
                elements.labelE.style.fill = '#1565c0';
                elements.labelE.style.transform = 'scale(1)'; // Removed scaling to avoid overlap
                elements.labelAngle.style.fill = '#1565c0';
                elements.labelAngle.style.transform = 'scale(1)'; // Removed scaling to avoid overlap
                
                elements.sector.classList.add('active');
                
                elements.textStep3.classList.add('step-active');
                elements.textStep3Ans.classList.add('step-active');
            }
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });

        // Initialize
        updateScene();
    })();
    </script>
</body>
</html>
