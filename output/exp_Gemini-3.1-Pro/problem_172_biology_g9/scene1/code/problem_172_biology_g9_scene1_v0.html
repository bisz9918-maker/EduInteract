<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 20px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .node-rect {
            fill: #ffffff;
            stroke: #000000;
            stroke-width: 2px;
            transition: all 0.3s ease;
        }
        .node-text {
            fill: #000000;
            font-size: 16px;
            text-anchor: middle;
            dominant-baseline: middle;
            transition: all 0.3s ease;
        }
        .link-line {
            stroke: #000000;
            stroke-width: 2px;
        }
        .label-text {
            fill: #888888;
            font-size: 14px;
            text-anchor: middle;
            dominant-baseline: middle;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500">
            <!-- Lines -->
            <line class="link-line" x1="400" y1="80" x2="220" y2="130" />
            <line class="link-line" x1="400" y1="80" x2="580" y2="130" />
            <line class="link-line" x1="220" y1="170" x2="110" y2="230" />
            <line class="link-line" x1="220" y1="170" x2="330" y2="230" />
            <line class="link-line" x1="110" y1="270" x2="110" y2="328" />
            <line class="link-line" x1="330" y1="270" x2="330" y2="328" />
            <line class="link-line" x1="580" y1="170" x2="580" y2="328" />

            <!-- Labels moved to the side of the lines to avoid overlap -->
            <text id="scene1-label1" class="label-text" x="180" y="90">顺浓度梯度，不消耗能量</text>
            <text id="scene1-label2" class="label-text" x="620" y="90">逆浓度梯度，消耗能量</text>

            <!-- Nodes -->
            <!-- Root -->
            <rect class="node-rect" x="310" y="40" width="180" height="40" />
            <text class="node-text" x="400" y="60">物质跨膜运输方式</text>

            <!-- 被动运输 -->
            <rect class="node-rect" x="150" y="130" width="140" height="40" />
            <text class="node-text" x="220" y="150">被动运输</text>

            <!-- ① -->
            <rect id="scene1-node1-rect" class="node-rect" x="510" y="130" width="140" height="40" />
            <text id="scene1-node1-text" class="node-text" x="580" y="150">①</text>

            <!-- 自由扩散 -->
            <rect class="node-rect" x="50" y="230" width="120" height="40" />
            <text class="node-text" x="110" y="250">自由扩散</text>

            <!-- ② -->
            <rect id="scene1-node2-rect" class="node-rect" x="260" y="230" width="140" height="40" />
            <text id="scene1-node2-text" class="node-text" x="330" y="250">②</text>

            <!-- 氧气进入红细胞 -->
            <rect class="node-rect" x="30" y="328" width="160" height="44" />
            <text class="node-text" x="110" y="350">氧气进入红细胞</text>

            <!-- ③ -->
            <rect id="scene1-node3-rect" class="node-rect" x="240" y="328" width="180" height="44" />
            <text id="scene1-node3-text" class="node-text" x="330" y="350">③</text>

            <!-- ④ -->
            <rect id="scene1-node4-rect" class="node-rect" x="440" y="328" width="280" height="44" />
            <text id="scene1-node4-text" class="node-text" x="580" y="350">④</text>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 2;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');

        const node1Rect = document.getElementById('scene1-node1-rect');
        const node1Text = document.getElementById('scene1-node1-text');
        const node2Rect = document.getElementById('scene1-node2-rect');
        const node2Text = document.getElementById('scene1-node2-text');
        const node3Rect = document.getElementById('scene1-node3-rect');
        const node3Text = document.getElementById('scene1-node3-text');
        const node4Rect = document.getElementById('scene1-node4-rect');
        const node4Text = document.getElementById('scene1-node4-text');
        
        const label1 = document.getElementById('scene1-label1');
        const label2 = document.getElementById('scene1-label2');

        function updateState() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;

            if (currentStep >= 1) {
                node1Text.textContent = "① 主动运输";
                node2Text.textContent = "② 协助扩散";
                
                node1Rect.style.stroke = "#1565c0";
                node1Rect.style.fill = "rgba(21, 101, 192, 0.1)";
                node1Text.style.fill = "#1565c0";
                
                node2Rect.style.stroke = "#1565c0";
                node2Rect.style.fill = "rgba(21, 101, 192, 0.1)";
                node2Text.style.fill = "#1565c0";

                label1.style.opacity = 1;
                label2.style.opacity = 1;
            } else {
                node1Text.textContent = "①";
                node2Text.textContent = "②";
                
                node1Rect.style.stroke = "#000000";
                node1Rect.style.fill = "#ffffff";
                node1Text.style.fill = "#000000";
                
                node2Rect.style.stroke = "#000000";
                node2Rect.style.fill = "#ffffff";
                node2Text.style.fill = "#000000";

                label1.style.opacity = 0;
                label2.style.opacity = 0;
            }

            if (currentStep >= 2) {
                node3Text.textContent = "③ 葡萄糖进入红细胞";
                node4Text.textContent = "④ 葡萄糖进入小肠上皮细胞、离子等";
                
                node3Rect.style.stroke = "#c62828";
                node3Rect.style.fill = "rgba(198, 40, 40, 0.1)";
                node3Text.style.fill = "#c62828";
                
                node4Rect.style.stroke = "#c62828";
                node4Rect.style.fill = "rgba(198, 40, 40, 0.1)";
                node4Text.style.fill = "#c62828";
            } else {
                node3Text.textContent = "③";
                node4Text.textContent = "④";
                
                node3Rect.style.stroke = "#000000";
                node3Rect.style.fill = "#ffffff";
                node3Text.style.fill = "#000000";
                
                node4Rect.style.stroke = "#000000";
                node4Rect.style.fill = "#ffffff";
                node4Text.style.fill = "#000000";
            }
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateState();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateState();
            }
        });

        updateState();
    })();
    </script>
</body>
</html>
