<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-step-text { font-size: 14px; user-select: none; }
        
        .transition-all { transition: all 0.5s ease; }
        
        @keyframes dash-flow {
            to { stroke-dashoffset: -20; }
        }
        .flowing-dash {
            stroke-dasharray: 10 10;
            animation: dash-flow 1s linear infinite;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- Figure 乙 (Right) -->
            <g id="scene1-fig-yi">
                <circle id="scene1-circle-1" cx="630" cy="300" r="140" fill="none" stroke="#000" stroke-width="2" class="transition-all" />
                <circle id="scene1-circle-2" cx="560" cy="300" r="70" fill="none" stroke="#000" stroke-width="2" class="transition-all" />
                <circle id="scene1-circle-3" cx="525" cy="300" r="35" fill="none" stroke="#000" stroke-width="2" class="transition-all" />
                
                <text id="scene1-label-yi-1" x="730" y="130" font-size="16" text-anchor="middle" class="transition-all">①</text>
                <line id="scene1-ptr-yi-1" x1="730" y1="140" x2="730" y2="202" stroke="#000" stroke-width="1" />
                
                <text id="scene1-label-yi-2" x="630" y="130" font-size="16" text-anchor="middle" class="transition-all">②</text>
                <line id="scene1-ptr-yi-2" x1="630" y1="140" x2="630" y2="300" stroke="#000" stroke-width="1" />
                
                <text id="scene1-label-yi-3" x="530" y="130" font-size="16" text-anchor="middle" class="transition-all">③</text>
                <line id="scene1-ptr-yi-3" x1="530" y1="140" x2="530" y2="265" stroke="#000" stroke-width="1" />
            </g>

            <!-- Figure 甲 (Left) -->
            <g id="scene1-fig-jia">
                <!-- Chromosome -->
                <path id="scene1-chromosome" d="M 120 200 C 140 180, 160 220, 150 250 C 140 280, 120 320, 140 300 C 160 280, 150 250, 160 250 C 170 250, 180 280, 200 300 C 220 320, 200 280, 190 250 C 180 220, 200 180, 180 200 C 160 220, 170 250, 160 250 C 150 250, 140 220, 120 200 Z" fill="none" stroke="#000" stroke-width="2" class="transition-all" />
                
                <!-- DNA unwinding -->
                <path id="scene1-dna-unwind" d="M 140 300 C 130 330, 100 350, 120 390 C 140 430, 200 450, 220 410 C 240 370, 220 330, 260 290" fill="none" stroke="#000" stroke-width="2" class="transition-all" />
                
                <!-- Proteins -->
                <circle id="scene1-protein-1" cx="220" cy="330" r="10" fill="none" stroke="#000" stroke-width="2" class="transition-all" />
                <circle id="scene1-protein-2" cx="240" cy="310" r="10" fill="none" stroke="#000" stroke-width="2" class="transition-all" />
                <circle id="scene1-protein-3" cx="260" cy="290" r="10" fill="none" stroke="#000" stroke-width="2" class="transition-all" />
                
                <!-- DNA double helix -->
                <path id="scene1-dna-helix" d="M 260 290 Q 275 250 290 270 T 320 270 T 350 270 T 380 270 T 410 270 T 440 270" fill="none" stroke="#000" stroke-width="2" class="transition-all" />
                <path id="scene1-dna-helix-2" d="M 260 290 Q 275 290 290 270 T 320 270 T 350 270 T 380 270 T 410 270 T 440 270" fill="none" stroke="#000" stroke-width="2" class="transition-all" />
                
                <!-- Gene highlight -->
                <path id="scene1-gene-highlight" d="M 320 270 T 350 270 T 380 270" fill="none" stroke="#2e7d32" stroke-width="6" opacity="0" class="transition-all" />
                
                <!-- Labels -->
                <text id="scene1-label-jia-1" x="150" y="130" font-size="16" text-anchor="middle" class="transition-all">1</text>
                <line id="scene1-ptr-jia-1" x1="150" y1="140" x2="140" y2="210" stroke="#000" stroke-width="1" />
                
                <text id="scene1-label-jia-2" x="300" y="130" font-size="16" text-anchor="middle" class="transition-all">2</text>
                <line id="scene1-ptr-jia-2" x1="300" y1="140" x2="300" y2="260" stroke="#000" stroke-width="1" />
                
                <text id="scene1-label-jia-4" x="380" y="130" font-size="16" text-anchor="middle" class="transition-all">4</text>
                <line id="scene1-ptr-jia-4" x1="380" y1="140" x2="380" y2="260" stroke="#000" stroke-width="1" />
                
                <text id="scene1-label-jia-3" x="330" y="350" font-size="16" text-anchor="middle" class="transition-all">3</text>
                <line id="scene1-ptr-jia-3" x1="330" y1="335" x2="270" y2="300" stroke="#000" stroke-width="1" />
            </g>

            <!-- Mapping Lines -->
            <g id="scene1-mapping-lines" opacity="0" class="transition-all">
                <!-- Map 1 -->
                <line x1="150" y1="115" x2="150" y2="40" stroke="#888" stroke-width="2" class="flowing-dash" />
                <line x1="150" y1="40" x2="730" y2="40" stroke="#888" stroke-width="2" class="flowing-dash" />
                <line x1="730" y1="40" x2="730" y2="115" stroke="#888" stroke-width="2" class="flowing-dash" />
                <!-- Map 2 -->
                <line x1="300" y1="115" x2="300" y2="50" stroke="#888" stroke-width="2" class="flowing-dash" />
                <line x1="300" y1="50" x2="630" y2="50" stroke="#888" stroke-width="2" class="flowing-dash" />
                <line x1="630" y1="50" x2="630" y2="115" stroke="#888" stroke-width="2" class="flowing-dash" />
                <!-- Map 4 -->
                <line x1="380" y1="115" x2="380" y2="60" stroke="#888" stroke-width="2" class="flowing-dash" />
                <line x1="380" y1="60" x2="530" y2="60" stroke="#888" stroke-width="2" class="flowing-dash" />
                <line x1="530" y1="60" x2="530" y2="115" stroke="#888" stroke-width="2" class="flowing-dash" />
            </g>

            <!-- Hint Texts -->
            <text id="scene1-hint-3" x="330" y="395" font-size="14" fill="#c62828" text-anchor="middle" opacity="0" class="transition-all">不含特定遗传信息</text>
            <line id="scene1-hint3-ptr" x1="330" y1="380" x2="330" y2="360" stroke="#c62828" stroke-width="1" opacity="0" class="transition-all" />
            
            <text id="scene1-hint-4" x="435" y="220" font-size="14" fill="#2e7d32" text-anchor="middle" opacity="0" class="transition-all">含特定遗传信息</text>
            <line id="scene1-hint4-ptr" x1="435" y1="230" x2="390" y2="260" stroke="#2e7d32" stroke-width="1" opacity="0" class="transition-all" />
            
            <!-- Figure Titles -->
            <text x="180" y="460" font-size="18" text-anchor="middle">甲</text>
            <text x="630" y="460" font-size="18" text-anchor="middle">乙</text>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <span id="scene1-step-text">步骤 0 / 4</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 4;
        
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepText = document.getElementById('scene1-step-text');
        
        // Elements
        const el = {
            chrom: document.getElementById('scene1-chromosome'),
            dnaUnwind: document.getElementById('scene1-dna-unwind'),
            dnaHelix: document.getElementById('scene1-dna-helix'),
            dnaHelix2: document.getElementById('scene1-dna-helix-2'),
            geneHighlight: document.getElementById('scene1-gene-highlight'),
            prot1: document.getElementById('scene1-protein-1'),
            prot2: document.getElementById('scene1-protein-2'),
            prot3: document.getElementById('scene1-protein-3'),
            
            c1: document.getElementById('scene1-circle-1'),
            c2: document.getElementById('scene1-circle-2'),
            c3: document.getElementById('scene1-circle-3'),
            
            lJia1: document.getElementById('scene1-label-jia-1'),
            lJia2: document.getElementById('scene1-label-jia-2'),
            lJia3: document.getElementById('scene1-label-jia-3'),
            lJia4: document.getElementById('scene1-label-jia-4'),
            
            lYi1: document.getElementById('scene1-label-yi-1'),
            lYi2: document.getElementById('scene1-label-yi-2'),
            lYi3: document.getElementById('scene1-label-yi-3'),
            
            mapLines: document.getElementById('scene1-mapping-lines'),
            
            hint3: document.getElementById('scene1-hint-3'),
            hint4: document.getElementById('scene1-hint-4'),
            hint3Ptr: document.getElementById('scene1-hint3-ptr'),
            hint4Ptr: document.getElementById('scene1-hint4-ptr')
        };
        
        function updateStep() {
            stepText.textContent = `步骤 ${currentStep} / ${maxStep}`;
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
            
            // Reset all
            el.chrom.setAttribute('fill', 'none');
            el.dnaHelix.setAttribute('stroke', '#000');
            el.dnaHelix2.setAttribute('stroke', '#000');
            el.dnaUnwind.setAttribute('stroke', '#000');
            el.geneHighlight.style.opacity = '0';
            el.prot1.setAttribute('fill', 'none');
            el.prot2.setAttribute('fill', 'none');
            el.prot3.setAttribute('fill', 'none');
            el.prot3.setAttribute('stroke', '#000');
            
            el.c1.setAttribute('fill', 'none');
            el.c2.setAttribute('fill', 'none');
            el.c3.setAttribute('fill', 'none');
            
            el.lJia1.textContent = '1';
            el.lJia2.textContent = '2';
            el.lJia3.textContent = '3';
            el.lJia4.textContent = '4';
            
            el.lYi1.textContent = '①';
            el.lYi2.textContent = '②';
            el.lYi3.textContent = '③';
            
            el.mapLines.style.opacity = '0';
            el.hint3.style.opacity = '0';
            el.hint4.style.opacity = '0';
            el.hint3Ptr.style.opacity = '0';
            el.hint4Ptr.style.opacity = '0';
            
            if (currentStep >= 1) {
                el.chrom.setAttribute('fill', 'rgba(21, 101, 192, 0.2)');
                el.dnaHelix.setAttribute('stroke', '#2e7d32');
                el.dnaHelix2.setAttribute('stroke', '#2e7d32');
                el.dnaUnwind.setAttribute('stroke', '#2e7d32');
                el.geneHighlight.style.opacity = '1';
                el.prot1.setAttribute('fill', '#e0e0e0');
                el.prot2.setAttribute('fill', '#e0e0e0');
                el.prot3.setAttribute('fill', '#e0e0e0');
                
                el.lJia1.textContent = '1 染色体';
                el.lJia2.textContent = '2 DNA';
                el.lJia3.textContent = '3 蛋白质';
                el.lJia4.textContent = '4 基因';
            }
            
            if (currentStep >= 2) {
                el.c1.setAttribute('fill', 'rgba(21, 101, 192, 0.2)');
                el.c2.setAttribute('fill', 'rgba(46, 125, 50, 0.1)');
                el.c3.setAttribute('fill', 'rgba(46, 125, 50, 0.3)');
                
                el.lYi1.textContent = '① 染色体';
                el.lYi2.textContent = '② DNA';
                el.lYi3.textContent = '③ 基因';
            }
            
            if (currentStep >= 3) {
                el.mapLines.style.opacity = '1';
            }
            
            if (currentStep >= 4) {
                el.prot3.setAttribute('fill', '#c62828');
                el.prot3.setAttribute('stroke', '#c62828');
                el.hint3.style.opacity = '1';
                el.hint4.style.opacity = '1';
                el.hint3Ptr.style.opacity = '1';
                el.hint4Ptr.style.opacity = '1';
            }
        }
        
        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });
        
        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateStep();
            }
        });
        
        updateStep();
    })();
    </script>
</body>
</html>
