<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>探究吸入气与呼出气成分</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 20px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-step-text { font-size: 16px; font-weight: bold; min-width: 120px; text-align: center; }
        
        /* Animations */
        @keyframes bubble-rise {
            0% { transform: translateY(0); opacity: 0.8; }
            100% { transform: translateY(-60px); opacity: 0; }
        }
        .bubble { animation: bubble-rise 1.5s infinite linear; }
        .bubble:nth-child(2) { animation-delay: 0.5s; }
        .bubble:nth-child(3) { animation-delay: 1s; }

        @keyframes flow-x {
            0% { transform: translateX(-15px); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateX(15px); opacity: 0; }
        }
        @keyframes flow-y {
            0% { transform: translateY(-15px); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(15px); opacity: 0; }
        }
        @keyframes flow-y-up {
            0% { transform: translateY(15px); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(-15px); opacity: 0; }
        }

        .anim-flow-right { animation: flow-x 1.5s infinite linear; }
        .anim-flow-down { animation: flow-y 1.5s infinite linear; }
        .anim-flow-up { animation: flow-y-up 1.5s infinite linear; }

        #scene1-liquid2 { transition: fill 1s ease-in-out, opacity 1s ease-in-out; }
        .fade { transition: opacity 0.5s ease-in-out; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500">
            <defs>
                <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0" />
                </marker>
                <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828" />
                </marker>
            </defs>

            <!-- Liquids -->
            <path id="scene1-liquid1" d="M 200 260 L 260 260 L 260 330 A 30 30 0 0 1 200 330 Z" fill="#e0f7fa" opacity="0.5" />
            <path id="scene1-liquid2" d="M 540 260 L 600 260 L 600 330 A 30 30 0 0 1 540 330 Z" fill="#e0f7fa" opacity="0.5" />

            <!-- Bubbles -->
            <g id="scene1-bubbles1" class="fade" opacity="0" fill="none" stroke="#1565c0" stroke-width="2">
                <circle cx="215" cy="320" r="4" class="bubble" />
                <circle cx="215" cy="320" r="5" class="bubble" />
                <circle cx="215" cy="320" r="3" class="bubble" />
            </g>
            <g id="scene1-bubbles2" class="fade" opacity="0" fill="none" stroke="#c62828" stroke-width="2">
                <circle cx="555" cy="320" r="4" class="bubble" />
                <circle cx="555" cy="320" r="5" class="bubble" />
                <circle cx="555" cy="320" r="3" class="bubble" />
            </g>

            <!-- Test tubes -->
            <path d="M 200 160 L 200 330 A 30 30 0 0 0 260 330 L 260 160" stroke="black" stroke-width="2" fill="none" />
            <path d="M 540 160 L 540 330 A 30 30 0 0 0 600 330 L 600 160" stroke="black" stroke-width="2" fill="none" />

            <!-- Tubes Background (Black) -->
            <g stroke="black" stroke-width="10" fill="none" stroke-linejoin="round" stroke-linecap="butt">
                <path d="M 100 110 L 215 110 L 215 320" />
                <path d="M 245 210 L 245 120 L 555 120 L 555 320" />
                <path d="M 400 70 L 400 120" />
                <path d="M 585 210 L 585 110 L 680 110" />
            </g>

            <!-- Tubes Foreground (White) -->
            <g stroke="white" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="butt">
                <path d="M 100 110 L 215 110 L 215 320" />
                <path d="M 245 210 L 245 120 L 555 120 L 555 320" />
                <path d="M 400 70 L 400 120" />
                <path d="M 585 210 L 585 110 L 680 110" />
            </g>

            <!-- Rubber Stoppers -->
            <rect x="200" y="160" width="60" height="30" fill="#ffcc80" opacity="0.8" />
            <rect x="540" y="160" width="60" height="30" fill="#ffcc80" opacity="0.8" />

            <!-- Valves -->
            <g id="scene1-valveX" stroke="#c62828" stroke-width="4" class="fade">
                <line x1="320" y1="120" x2="320" y2="105" />
                <line x1="310" y1="105" x2="330" y2="105" />
            </g>
            <g id="scene1-valveY" stroke="#c62828" stroke-width="4" class="fade">
                <line x1="480" y1="120" x2="480" y2="105" />
                <line x1="470" y1="105" x2="490" y2="105" />
            </g>

            <!-- Arrows Inhale (Blue) -->
            <g id="scene1-arrows-inhale" class="fade" opacity="0" stroke="#1565c0" stroke-width="3">
                <g class="anim-flow-right"><line x1="140" y1="110" x2="170" y2="110" marker-end="url(#arrow-blue)" /></g>
                <g class="anim-flow-down"><line x1="215" y1="150" x2="215" y2="180" marker-end="url(#arrow-blue)" /></g>
                <g class="anim-flow-up"><line x1="245" y1="180" x2="245" y2="150" marker-end="url(#arrow-blue)" /></g>
                <g class="anim-flow-right"><line x1="280" y1="120" x2="310" y2="120" marker-end="url(#arrow-blue)" /></g>
                <g class="anim-flow-right"><line x1="350" y1="120" x2="380" y2="120" marker-end="url(#arrow-blue)" /></g>
                <g class="anim-flow-up"><line x1="400" y1="105" x2="400" y2="75" marker-end="url(#arrow-blue)" /></g>
            </g>

            <!-- Arrows Exhale (Red) -->
            <g id="scene1-arrows-exhale" class="fade" opacity="0" stroke="#c62828" stroke-width="3">
                <g class="anim-flow-down"><line x1="400" y1="75" x2="400" y2="105" marker-end="url(#arrow-red)" /></g>
                <g class="anim-flow-right"><line x1="420" y1="120" x2="450" y2="120" marker-end="url(#arrow-red)" /></g>
                <g class="anim-flow-right"><line x1="500" y1="120" x2="530" y2="120" marker-end="url(#arrow-red)" /></g>
                <g class="anim-flow-down"><line x1="555" y1="150" x2="555" y2="180" marker-end="url(#arrow-red)" /></g>
                <g class="anim-flow-up"><line x1="585" y1="180" x2="585" y2="150" marker-end="url(#arrow-red)" /></g>
                <g class="anim-flow-right"><line x1="610" y1="110" x2="640" y2="110" marker-end="url(#arrow-red)" /></g>
            </g>

            <!-- Texts -->
            <text x="400" y="55" font-size="20" text-anchor="middle" font-family="sans-serif">M</text>
            <text x="320" y="95" font-size="16" text-anchor="middle" font-family="sans-serif">夹X</text>
            <text x="480" y="95" font-size="16" text-anchor="middle" font-family="sans-serif">夹Y</text>
            <text x="230" y="380" font-size="18" text-anchor="middle" font-family="sans-serif">试管1</text>
            <text x="570" y="380" font-size="18" text-anchor="middle" font-family="sans-serif">试管2</text>
            
            <text x="400" y="290" font-size="16" text-anchor="middle" font-family="sans-serif">石灰水</text>
            <line x1="365" y1="285" x2="265" y2="285" stroke="black" stroke-width="1" />
            <line x1="435" y1="285" x2="535" y2="285" stroke="black" stroke-width="1" />

            <text id="scene1-label-clear" class="fade" x="230" y="410" font-size="18" text-anchor="middle" fill="#1565c0" font-family="sans-serif" opacity="0" style="display: none;">澄清</text>
            <text id="scene1-label-turbid" class="fade" x="570" y="410" font-size="18" text-anchor="middle" fill="#c62828" font-family="sans-serif" opacity="0" style="display: none;">浑浊</text>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <div id="scene1-step-text">0 / 3 : 初始状态</div>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 3;
        
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepText = document.getElementById('scene1-step-text');
        
        const valveX = document.getElementById('scene1-valveX');
        const valveY = document.getElementById('scene1-valveY');
        const arrowsInhale = document.getElementById('scene1-arrows-inhale');
        const arrowsExhale = document.getElementById('scene1-arrows-exhale');
        const bubbles1 = document.getElementById('scene1-bubbles1');
        const bubbles2 = document.getElementById('scene1-bubbles2');
        const liquid2 = document.getElementById('scene1-liquid2');
        const labelClear = document.getElementById('scene1-label-clear');
        const labelTurbid = document.getElementById('scene1-label-turbid');

        const stepNames = [
            "初始状态",
            "吸气过程",
            "呼气过程",
            "对比结论"
        ];

        function show(el) {
            el.style.display = '';
            // trigger reflow
            void el.offsetWidth;
            el.style.opacity = '1';
        }

        function hide(el) {
            el.style.opacity = '0';
            setTimeout(() => {
                if (el.style.opacity === '0') {
                    el.style.display = 'none';
                }
            }, 500);
        }

        function updateScene() {
            stepText.textContent = `${currentStep} / ${maxStep} : ${stepNames[currentStep]}`;
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;

            // Reset all
            valveX.setAttribute('stroke', '#c62828');
            valveY.setAttribute('stroke', '#c62828');
            hide(arrowsInhale);
            hide(arrowsExhale);
            hide(bubbles1);
            hide(bubbles2);
            liquid2.setAttribute('fill', '#e0f7fa');
            liquid2.setAttribute('opacity', '0.5');
            hide(labelClear);
            hide(labelTurbid);

            if (currentStep === 1) {
                valveX.setAttribute('stroke', '#2e7d32');
                show(arrowsInhale);
                show(bubbles1);
            } else if (currentStep === 2) {
                valveY.setAttribute('stroke', '#2e7d32');
                show(arrowsExhale);
                show(bubbles2);
                liquid2.setAttribute('fill', '#cfd8dc');
                liquid2.setAttribute('opacity', '0.9');
            } else if (currentStep === 3) {
                liquid2.setAttribute('fill', '#cfd8dc');
                liquid2.setAttribute('opacity', '0.9');
                show(labelClear);
                show(labelTurbid);
            }
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });

        // Initialize
        updateScene();
    })();
    </script>
</body>
</html>
