<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三圈环流剖面图</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 6px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button:hover:not(:disabled) { background: #e9e9e9; }
        
        .fade { transition: opacity 0.5s ease; }
        
        @keyframes flash {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .flashing { animation: flash 1s infinite; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <defs>
                <marker id="arrow-black" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
                </marker>
                <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0" />
                </marker>
                <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828" />
                </marker>
            </defs>

            <!-- Step 0: Base elements -->
            <g id="scene1-step0">
                <!-- Earth surface arc -->
                <path d="M 300 450 A 350 350 0 0 1 650 100" fill="none" stroke="#000000" stroke-width="2" />
                
                <!-- Shadow lines (inner side of the arc) -->
                <g id="scene1-shadows" stroke="#000000" stroke-width="1"></g>

                <!-- Letters (Inner side, moved further in to avoid overlap) -->
                <text x="390" y="460" font-size="16" fill="#000000">A</text>
                <text x="400" y="405" font-size="16" fill="#000000">B</text>
                <text x="430" y="335" font-size="16" fill="#000000">C</text>
                <text x="480" y="270" font-size="16" fill="#000000">D</text>
                <text x="545" y="220" font-size="16" fill="#000000">E</text>
                <text x="620" y="185" font-size="16" fill="#000000">F</text>
                <text x="705" y="170" font-size="16" fill="#000000">N</text>

                <!-- Circulation cells (approximate paths) -->
                <!-- Low latitude cell (A to C) -->
                <path d="M 300 450 L 300 370 Q 320 350 360 350 L 370 350 L 347 275" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-black)" marker-mid="url(#arrow-black)" />
                <path d="M 347 275 Q 320 360 300 450" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-black)" />
                
                <!-- Mid latitude cell (C to E) -->
                <path d="M 347 275 L 370 200 Q 400 180 450 180 L 460 180 L 475 147" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-black)" />
                <path d="M 475 147 Q 400 220 347 275" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-black)" />

                <!-- High latitude cell (E to N) -->
                <path d="M 475 147 L 500 80 Q 550 60 630 60 L 650 60 L 650 100" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-black)" />
                <path d="M 650 100 Q 550 120 475 147" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow-black)" />
            </g>

            <!-- Step 1: Latitudes -->
            <g id="scene1-step1" class="fade" style="opacity: 0; display: none;">
                <!-- Points -->
                <circle cx="300" cy="450" r="4" fill="#c62828" /> <!-- A: Red (Ascending) -->
                <circle cx="347" cy="275" r="4" fill="#1565c0" /> <!-- C: Blue (Descending) -->
                <circle cx="475" cy="147" r="4" fill="#c62828" /> <!-- E: Red (Ascending) -->
                <circle cx="650" cy="100" r="4" fill="#1565c0" id="scene1-n-point" /> <!-- N: Blue (Descending) -->

                <!-- Labels (Moved further out) -->
                <text x="230" y="465" font-size="16" fill="#000000" text-anchor="end">0°</text>
                <text x="270" y="280" font-size="16" fill="#000000" text-anchor="end">30°N</text>
                <text x="400" y="130" font-size="16" fill="#000000" text-anchor="end">60°N</text>
                <text x="600" y="80" font-size="16" fill="#000000" text-anchor="end">90°N</text>
            </g>

            <!-- Step 2: Pressure belts and causes -->
            <g id="scene1-step2" class="fade" style="opacity: 0; display: none;">
                <!-- Pressure belts labels -->
                <text x="190" y="465" font-size="16" fill="#c62828" text-anchor="end">赤道低气压带</text>
                <text x="220" y="280" font-size="16" fill="#1565c0" text-anchor="end">副热带高气压带</text>
                <text x="350" y="130" font-size="16" fill="#c62828" text-anchor="end">副极地低气压带</text>
                <text x="600" y="60" font-size="16" fill="#1565c0" text-anchor="end">极地高气压带</text>

                <!-- Causes arrows and text -->
                <!-- N: Cooling and descending -->
                <line x1="650" y1="60" x2="650" y2="90" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-blue)" />
                <text x="600" y="105" font-size="14" fill="#1565c0" text-anchor="end">热力原因：冷却下沉</text>

                <!-- E: Cold and warm meeting -->
                <path d="M 455 160 Q 465 155 470 145" fill="none" stroke="#c62828" stroke-width="2" marker-end="url(#arrow-red)" />
                <path d="M 495 135 Q 485 140 480 145" fill="none" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-blue)" />
                <line x1="475" y1="147" x2="475" y2="117" stroke="#c62828" stroke-width="2" marker-end="url(#arrow-red)" />
                <text x="350" y="105" font-size="14" fill="#c62828" text-anchor="end">动力原因：冷暖交汇抬升</text>
            </g>

            <!-- Step 3: Wind belts -->
            <g id="scene1-step3" class="fade" style="opacity: 0; display: none;">
                <!-- Wind belts highlights -->
                <path d="M 300 450 A 350 350 0 0 1 347 275" fill="none" stroke="#2e7d32" stroke-width="12" opacity="0.4" />
                <path d="M 347 275 A 350 350 0 0 1 475 147" fill="none" stroke="#2e7d32" stroke-width="12" opacity="0.4" />
                <path d="M 475 147 A 350 350 0 0 1 650 100" fill="none" stroke="#2e7d32" stroke-width="12" opacity="0.4" />

                <!-- Wind belts labels -->
                <text x="220" y="370" font-size="16" fill="#2e7d32" text-anchor="end">东北信风带</text>
                <text x="320" y="220" font-size="16" fill="#2e7d32" text-anchor="end">盛行西风带</text>
                <text x="440" y="80" font-size="16" fill="#2e7d32" text-anchor="end">极地东风带</text>
            </g>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Generate shadow lines
        const shadowsGroup = document.getElementById('scene1-shadows');
        const cx = 650, cy = 450, r = 350;
        for (let angle = 92; angle <= 178; angle += 2) {
            const rad = angle * Math.PI / 180;
            const x1 = cx + r * Math.cos(rad);
            const y1 = cy - r * Math.sin(rad);
            const x2 = cx + (r - 10) * Math.cos(rad);
            const y2 = cy - (r - 10) * Math.sin(rad);
            
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', x1);
            line.setAttribute('y1', y1);
            line.setAttribute('x2', x2);
            line.setAttribute('y2', y2);
            shadowsGroup.appendChild(line);
        }

        let currentStep = 0;
        const maxStep = 3;
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const nPoint = document.getElementById('scene1-n-point');

        function show(el) {
            el.style.display = '';
            // trigger reflow
            void el.offsetWidth;
            el.style.opacity = '1';
        }

        function hide(el) {
            el.style.opacity = '0';
            setTimeout(() => {
                if (el.style.opacity === '0') {
                    el.style.display = 'none';
                }
            }, 500);
        }

        function updateStep() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;

            const step1 = document.getElementById('scene1-step1');
            const step2 = document.getElementById('scene1-step2');
            const step3 = document.getElementById('scene1-step3');

            if (currentStep >= 1) {
                show(step1);
                nPoint.classList.add('flashing');
            } else {
                hide(step1);
                nPoint.classList.remove('flashing');
            }

            if (currentStep >= 2) {
                show(step2);
            } else {
                hide(step2);
            }

            if (currentStep >= 3) {
                show(step3);
            } else {
                hide(step3);
            }
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateStep();
            }
        });
    })();
    </script>
</body>
</html>
