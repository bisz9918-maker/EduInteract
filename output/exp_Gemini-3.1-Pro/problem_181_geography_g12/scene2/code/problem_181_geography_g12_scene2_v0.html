<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .scene2-hidden { opacity: 0; display: none; }
        .scene2-visible { opacity: 1; display: block; transition: opacity 0.5s; }
        
        .scene2-text { font-size: 14px; fill: #000; }
        .scene2-text-red { font-size: 14px; fill: #c62828; font-weight: bold; }
        .scene2-text-green { font-size: 14px; fill: #2e7d32; font-weight: bold; }
        
        #scene2-anim-ring { transition: r 1s ease-in-out; }
        .scene2-wind-arrow { transition: stroke 0.5s; }
        #scene2-pressure-belt { transition: stroke 0.5s; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500">
            <defs>
                <marker id="scene2-arrow-black" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
                </marker>
                <marker id="scene2-arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0" />
                </marker>
                <marker id="scene2-arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#888888" />
                </marker>
                <marker id="scene2-arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828" />
                </marker>
            </defs>

            <!-- Step 2 Highlights -->
            <circle id="scene2-highlight-a" cx="400" cy="230" r="150" fill="none" stroke="#2e7d32" stroke-width="60" opacity="0" />
            <circle id="scene2-highlight-b" cx="400" cy="230" r="90" fill="none" stroke="#2e7d32" stroke-width="60" opacity="0" />

            <!-- Grid -->
            <circle cx="400" cy="230" r="180" fill="none" stroke="#000000" stroke-width="1" />
            <circle cx="400" cy="230" r="120" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" />
            <circle cx="400" cy="230" r="60" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" />
            <line x1="400" y1="50" x2="400" y2="410" stroke="#000000" stroke-width="1" />
            <line x1="220" y1="230" x2="580" y2="230" stroke="#000000" stroke-width="1" />

            <!-- Step 3 Reference -->
            <circle id="scene2-ref-30" cx="400" cy="230" r="120" fill="none" stroke="#c62828" stroke-width="2" stroke-dasharray="6,4" opacity="0" />
            
            <!-- Pressure Belt -->
            <circle id="scene2-pressure-belt" cx="400" cy="230" r="105" fill="none" stroke="#000000" stroke-width="4" />
            
            <!-- Dynamic Ring -->
            <circle id="scene2-anim-ring" cx="400" cy="230" r="120" fill="none" stroke="rgba(0,0,0,0.4)" stroke-width="4" opacity="0" />

            <!-- Wind Arrows Container -->
            <g id="scene2-wind-arrows"></g>

            <!-- Step 1 Deflection -->
            <g id="scene2-step1-elements" opacity="0">
                <line x1="485" y1="315" x2="527" y2="357" stroke="#888888" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#scene2-arrow-gray)" />
                <path d="M 527 357 Q 500 380 472 384" fill="none" stroke="#c62828" stroke-width="2" marker-end="url(#scene2-arrow-red)" />
            </g>

            <!-- Labels -->
            <!-- Adjusted label positions to avoid overlap with circles and lines -->
            <text x="400" y="40" class="scene2-text" text-anchor="middle">0°</text>
            <text x="445" y="135" class="scene2-text">30°</text>
            <text x="445" y="195" class="scene2-text">60°</text>
            <text x="400" y="430" class="scene2-text" text-anchor="middle">180°</text>
            <text x="210" y="220" class="scene2-text" text-anchor="end">90°</text>
            <text x="590" y="220" class="scene2-text">90°</text>
            <text x="540" y="370" class="scene2-text">a</text>
            <text x="290" y="250" class="scene2-text">b</text>

            <!-- Conclusion Texts -->
            <text id="scene2-text-step1" x="780" y="300" class="scene2-text-red" text-anchor="end" opacity="0">风向向右偏转 → 北半球</text>
            <text id="scene2-text-step2-a" x="780" y="350" class="scene2-text-green" text-anchor="end" opacity="0">a: 东北信风带 (对应图甲B)</text>
            <text id="scene2-text-step2-b" x="250" y="350" class="scene2-text-green" text-anchor="end" opacity="0">b: 盛行西风带 (对应图甲D)</text>
            <text id="scene2-text-step3-1" x="250" y="80" class="scene2-text-red" text-anchor="end" opacity="0">副热带高气压带位于30°N以北</text>
            <text id="scene2-text-step3-2" x="250" y="115" class="scene2-text-red" text-anchor="end" opacity="0">气压带风带北移 → 北半球夏季</text>
        </svg>

        <div id="scene2-controls">
            <button id="scene2-btn-prev" disabled>◀ 上一步</button>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let step = 0;
        const maxStep = 3;
        
        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        
        // Generate wind arrows
        const windArrowsGroup = document.getElementById('scene2-wind-arrows');
        const cx = 400, cy = 230;
        
        function polarToCartesian(centerX, centerY, radius, angleInDegrees) {
            const angleInRadians = (angleInDegrees - 90) * Math.PI / 180.0;
            return {
                x: centerX + (radius * Math.cos(angleInRadians)),
                y: centerY + (radius * Math.sin(angleInRadians))
            };
        }

        // a wind arrows (r=120 to r=170, clockwise)
        for(let i=0; i<4; i++) {
            const angle = i * 90 + 45;
            const start = polarToCartesian(cx, cy, 120, angle);
            const end = polarToCartesian(cx, cy, 170, angle + 20);
            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("d", `M ${start.x} ${start.y} A 150 150 0 0 1 ${end.x} ${end.y}`);
            path.setAttribute("fill", "none");
            path.setAttribute("stroke", "#000000");
            path.setAttribute("stroke-width", "2");
            path.setAttribute("marker-end", "url(#scene2-arrow-black)");
            path.classList.add("scene2-wind-arrow");
            path.dataset.type = "a";
            windArrowsGroup.appendChild(path);
        }

        // b wind arrows (r=120 to r=70, counter-clockwise)
        for(let i=0; i<4; i++) {
            const angle = i * 90 + 45;
            const start = polarToCartesian(cx, cy, 120, angle);
            const end = polarToCartesian(cx, cy, 70, angle - 30);
            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("d", `M ${start.x} ${start.y} A 150 150 0 0 0 ${end.x} ${end.y}`);
            path.setAttribute("fill", "none");
            path.setAttribute("stroke", "#000000");
            path.setAttribute("stroke-width", "2");
            path.setAttribute("marker-end", "url(#scene2-arrow-black)");
            path.classList.add("scene2-wind-arrow");
            path.dataset.type = "b";
            windArrowsGroup.appendChild(path);
        }

        function setOpacity(id, opacity) {
            const el = document.getElementById(id);
            if(el) el.style.opacity = opacity;
        }

        function updateScene() {
            btnPrev.disabled = step === 0;
            btnNext.disabled = step === maxStep;

            // Step 1: Deflection
            const arrows = document.querySelectorAll('.scene2-wind-arrow');
            if (step >= 1) {
                arrows.forEach(a => {
                    a.setAttribute("stroke", "#1565c0");
                    a.setAttribute("marker-end", "url(#scene2-arrow-blue)");
                });
                setOpacity('scene2-step1-elements', 1);
                setOpacity('scene2-text-step1', 1);
            } else {
                arrows.forEach(a => {
                    a.setAttribute("stroke", "#000000");
                    a.setAttribute("marker-end", "url(#scene2-arrow-black)");
                });
                setOpacity('scene2-step1-elements', 0);
                setOpacity('scene2-text-step1', 0);
            }

            // Step 2: Wind Belts
            if (step >= 2) {
                setOpacity('scene2-highlight-a', 0.2);
                setOpacity('scene2-highlight-b', 0.2);
                setOpacity('scene2-text-step2-a', 1);
                setOpacity('scene2-text-step2-b', 1);
            } else {
                setOpacity('scene2-highlight-a', 0);
                setOpacity('scene2-highlight-b', 0);
                setOpacity('scene2-text-step2-a', 0);
                setOpacity('scene2-text-step2-b', 0);
            }

            // Step 3: Season
            const pressureBelt = document.getElementById('scene2-pressure-belt');
            const animRing = document.getElementById('scene2-anim-ring');
            if (step >= 3) {
                pressureBelt.setAttribute("stroke", "#1565c0");
                setOpacity('scene2-ref-30', 1);
                setOpacity('scene2-anim-ring', 1);
                setOpacity('scene2-text-step3-1', 1);
                setOpacity('scene2-text-step3-2', 1);
                
                // Trigger animation
                setTimeout(() => {
                    animRing.setAttribute("r", "105");
                }, 50);
            } else {
                pressureBelt.setAttribute("stroke", "#000000");
                setOpacity('scene2-ref-30', 0);
                setOpacity('scene2-anim-ring', 0);
                setOpacity('scene2-text-step3-1', 0);
                setOpacity('scene2-text-step3-2', 0);
                animRing.setAttribute("r", "120");
            }
        }

        btnPrev.addEventListener('click', () => {
            if (step > 0) {
                step--;
                updateScene();
            }
        });

        btnNext.addEventListener('click', () => {
            if (step < maxStep) {
                step++;
                updateScene();
            }
        });

        // Initialize
        updateScene();
    })();
    </script>
</body>
</html>
