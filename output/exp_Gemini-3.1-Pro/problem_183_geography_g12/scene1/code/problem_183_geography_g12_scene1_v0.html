<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* SVG Styles */
        .scene1-orbit { fill: none; stroke: #000000; stroke-width: 1; }
        .scene1-sun { fill: #f57f17; }
        .scene1-sun-ray { stroke: #f57f17; stroke-width: 2; }
        .scene1-earth { fill: #ffffff; stroke: #000000; stroke-width: 1; transition: stroke 0.3s, stroke-width 0.3s; }
        .scene1-earth.highlight { stroke: #1565c0; stroke-width: 3; }
        .scene1-axis { stroke: #000000; stroke-width: 1; }
        .scene1-equator { stroke: #000000; stroke-width: 1; }
        .scene1-tropic { stroke: #f57f17; stroke-width: 1.5; stroke-dasharray: 4,2; opacity: 0; transition: opacity 0.3s; }
        .scene1-tropic.show { opacity: 1; }
        
        .scene1-ray-line { stroke: #999999; stroke-width: 1; stroke-dasharray: 4,4; transition: stroke 0.3s, stroke-width 0.3s; }
        .scene1-ray-line.highlight { stroke: #f57f17; stroke-width: 2; }
        
        .scene1-arrow { fill: none; stroke: #000000; stroke-width: 1.5; opacity: 0; transition: opacity 0.3s; }
        .scene1-arrow.show { opacity: 1; }
        
        /* HTML Labels */
        .scene1-label {
            position: absolute;
            transform: translate(-50%, -50%);
            font-size: 16px;
            color: #000000;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background-color 0.3s, border 0.3s;
            border: 1px solid transparent;
            background-color: transparent;
            white-space: nowrap;
        }
        .scene1-label.show-bg {
            background-color: #fff9c4;
            border: 1px solid #f57f17;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500">
            <!-- Orbit -->
            <ellipse cx="400" cy="220" rx="260" ry="130" class="scene1-orbit" />
            
            <!-- Orbit Arrows (Step 4) -->
            <g id="scene1-arrows" class="scene1-arrow">
                <!-- Top arrow -->
                <path d="M 400 90 L 390 85 L 390 95 Z" fill="#000" />
                <!-- Bottom arrow -->
                <path d="M 400 350 L 410 345 L 410 355 Z" fill="#000" />
                <!-- Left arrow -->
                <path d="M 140 220 L 145 230 L 135 230 Z" fill="#000" />
                <!-- Right arrow -->
                <path d="M 660 220 L 655 210 L 665 210 Z" fill="#000" />
            </g>

            <!-- Rays from Sun to Earths -->
            <line id="scene1-ray-a" x1="400" y1="220" x2="140" y2="220" class="scene1-ray-line" />
            <line id="scene1-ray-c" x1="400" y1="220" x2="660" y2="220" class="scene1-ray-line" />
            <line id="scene1-ray-d" x1="400" y1="220" x2="400" y2="90" class="scene1-ray-line" />
            <line id="scene1-ray-b" x1="400" y1="220" x2="400" y2="350" class="scene1-ray-line" />

            <!-- Sun -->
            <g transform="translate(400, 220)">
                <circle r="15" class="scene1-sun" />
                <!-- Sun rays -->
                <line x1="0" y1="-20" x2="0" y2="-25" class="scene1-sun-ray" />
                <line x1="0" y1="20" x2="0" y2="25" class="scene1-sun-ray" />
                <line x1="-20" y1="0" x2="-25" y2="0" class="scene1-sun-ray" />
                <line x1="20" y1="0" x2="25" y2="0" class="scene1-sun-ray" />
                <line x1="-14" y1="-14" x2="-18" y2="-18" class="scene1-sun-ray" />
                <line x1="14" y1="14" x2="18" y2="18" class="scene1-sun-ray" />
                <line x1="-14" y1="14" x2="-18" y2="18" class="scene1-sun-ray" />
                <line x1="14" y1="-14" x2="18" y2="-18" class="scene1-sun-ray" />
            </g>

            <!-- Earth A (Left) -->
            <g transform="translate(140, 220)">
                <circle id="scene1-earth-a" r="40" class="scene1-earth" />
                <line x1="-22" y1="50" x2="22" y2="-50" class="scene1-axis" />
                <line x1="-36.7" y1="-16" x2="36.7" y2="16" class="scene1-equator" />
                <line id="scene1-tropic-a" x1="-27.2" y1="-29.3" x2="40" y2="0" class="scene1-tropic" />
            </g>

            <!-- Earth C (Right) -->
            <g transform="translate(660, 220)">
                <circle id="scene1-earth-c" r="40" class="scene1-earth" />
                <line x1="-22" y1="50" x2="22" y2="-50" class="scene1-axis" />
                <line x1="-36.7" y1="-16" x2="36.7" y2="16" class="scene1-equator" />
                <line id="scene1-tropic-c" x1="-40" y1="0" x2="27.2" y2="29.3" class="scene1-tropic" />
            </g>

            <!-- Earth D (Top) -->
            <g transform="translate(400, 90)">
                <circle id="scene1-earth-d" r="40" class="scene1-earth" />
                <line x1="-22" y1="50" x2="22" y2="-50" class="scene1-axis" />
                <line x1="-36.7" y1="-16" x2="36.7" y2="16" class="scene1-equator" />
            </g>

            <!-- Earth B (Bottom) -->
            <g transform="translate(400, 350)">
                <circle id="scene1-earth-b" r="40" class="scene1-earth" />
                <line x1="-22" y1="50" x2="22" y2="-50" class="scene1-axis" />
                <line x1="-36.7" y1="-16" x2="36.7" y2="16" class="scene1-equator" />
            </g>
        </svg>

        <!-- HTML Labels -->
        <div id="scene1-label-a" class="scene1-label" style="left: 70px; top: 220px;">A</div>
        <div id="scene1-label-c" class="scene1-label" style="left: 730px; top: 220px;">C</div>
        <div id="scene1-label-d" class="scene1-label" style="left: 330px; top: 80px;">D</div>
        <div id="scene1-label-b" class="scene1-label" style="left: 470px; top: 360px;">B</div>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 4;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');

        // Elements
        const rayA = document.getElementById('scene1-ray-a');
        const rayC = document.getElementById('scene1-ray-c');
        const earthA = document.getElementById('scene1-earth-a');
        const earthC = document.getElementById('scene1-earth-c');
        const tropicA = document.getElementById('scene1-tropic-a');
        const tropicC = document.getElementById('scene1-tropic-c');
        const arrows = document.getElementById('scene1-arrows');
        
        const labelA = document.getElementById('scene1-label-a');
        const labelC = document.getElementById('scene1-label-c');
        const labelD = document.getElementById('scene1-label-d');
        const labelB = document.getElementById('scene1-label-b');

        function updateState() {
            // Reset all
            rayA.classList.remove('highlight');
            rayC.classList.remove('highlight');
            earthA.classList.remove('highlight');
            earthC.classList.remove('highlight');
            tropicA.classList.remove('show');
            tropicC.classList.remove('show');
            arrows.classList.remove('show');
            
            labelA.classList.remove('show-bg');
            labelA.textContent = 'A';
            labelC.classList.remove('show-bg');
            labelC.textContent = 'C';
            labelD.classList.remove('show-bg');
            labelD.textContent = 'D';
            labelB.classList.remove('show-bg');
            labelB.textContent = 'B';

            if (currentStep >= 1) {
                rayA.classList.add('highlight');
                rayC.classList.add('highlight');
            }
            
            if (currentStep >= 2) {
                earthA.classList.add('highlight');
                tropicA.classList.add('show');
                labelA.classList.add('show-bg');
                labelA.textContent = 'A: 夏至';
            }
            
            if (currentStep >= 3) {
                earthC.classList.add('highlight');
                tropicC.classList.add('show');
                labelC.classList.add('show-bg');
                labelC.textContent = 'C: 冬至';
            }
            
            if (currentStep >= 4) {
                arrows.classList.add('show');
                labelD.classList.add('show-bg');
                labelD.textContent = 'D: 春分';
                labelB.classList.add('show-bg');
                labelB.textContent = 'B: 秋分';
            }

            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateState();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateState();
            }
        });

        // Initialize
        updateState();
    })();
    </script>
</body>
</html>
