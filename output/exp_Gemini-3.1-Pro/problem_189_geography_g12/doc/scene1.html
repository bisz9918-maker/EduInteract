<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; background: #f0f0f0; border: 1px solid #ccc; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .step-element { opacity: 0; transition: opacity 0.5s ease; pointer-events: none; }
        
        .scene1-state-0 .step-1, .scene1-state-0 .step-2, .scene1-state-0 .step-3, .scene1-state-0 .step-4 { opacity: 0; }
        .scene1-state-1 .step-1 { opacity: 1; }
        .scene1-state-1 .step-2, .scene1-state-1 .step-3, .scene1-state-1 .step-4 { opacity: 0; }
        .scene1-state-2 .step-1, .scene1-state-2 .step-2 { opacity: 1; }
        .scene1-state-2 .step-3, .scene1-state-2 .step-4 { opacity: 0; }
        .scene1-state-3 .step-1, .scene1-state-3 .step-2, .scene1-state-3 .step-3 { opacity: 1; }
        .scene1-state-3 .step-4 { opacity: 0; }
        .scene1-state-4 .step-1, .scene1-state-4 .step-2, .scene1-state-4 .step-4 { opacity: 1; }
        .scene1-state-4 .step-3 { opacity: 0; }

        .path-anim { stroke-dasharray: 1000; stroke-dashoffset: 1000; }
        .scene1-state-2 .path-anim, .scene1-state-3 .path-anim, .scene1-state-4 .path-anim { stroke-dashoffset: 0; transition: stroke-dashoffset 2s linear; }
        
        @keyframes flash { 0%, 100% { r: 4; fill: #c62828; } 50% { r: 6; fill: #ff5252; } }
        .scene1-state-3 .flash-a { animation: flash 1s infinite; }
        .scene1-state-3 .flash-cd { animation: flash 1s infinite; }

        /* HTML Text Labels */
        .html-label { position: absolute; font-size: 14px; pointer-events: none; transform: translate(-50%, -50%); white-space: nowrap; }
        .html-label.left { transform: translate(-100%, -50%); }
        .html-label.right { transform: translate(0, -50%); }
        .html-label.top { transform: translate(-50%, -100%); }
        .html-label.bottom { transform: translate(-50%, 0); }
        
        .hide-on-step2 { transition: opacity 0.5s ease; }
        .scene1-state-2 .hide-on-step2, .scene1-state-3 .hide-on-step2, .scene1-state-4 .hide-on-step2 { opacity: 0; }
    </style>
</head>
<body>
    <div id="scene1-container" class="scene1-state-0">
        <svg width="800" height="500">
            <defs>
                <clipPath id="scene1-clip-east">
                    <circle cx="240" cy="220" r="150" />
                </clipPath>
                <clipPath id="scene1-clip-west">
                    <circle cx="560" cy="220" r="150" />
                </clipPath>
                <marker id="scene1-arrow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0" />
                </marker>
                <marker id="scene1-arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32" />
                </marker>
                <marker id="scene1-arrow-orange" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#f57f17" />
                </marker>
            </defs>

            <circle cx="240" cy="220" r="150" fill="none" stroke="#000" stroke-width="1" />
            <g clip-path="url(#scene1-clip-east)">
                <line x1="90" y1="220" x2="390" y2="220" stroke="#000" stroke-width="1" />
                <line x1="90" y1="160" x2="390" y2="160" stroke="#888" stroke-width="1" stroke-dasharray="4,4" />
                <line x1="90" y1="280" x2="390" y2="280" stroke="#888" stroke-width="1" stroke-dasharray="4,4" />
                <line x1="90" y1="82" x2="390" y2="82" stroke="#888" stroke-width="1" stroke-dasharray="4,4" />
                <line x1="90" y1="358" x2="390" y2="358" stroke="#888" stroke-width="1" stroke-dasharray="4,4" />
                <line x1="240" y1="70" x2="240" y2="370" stroke="#000" stroke-width="1" />
                <ellipse cx="240" cy="220" rx="75" ry="150" fill="none" stroke="#000" stroke-width="1" />
                <ellipse cx="240" cy="220" rx="130" ry="150" fill="none" stroke="#000" stroke-width="1" />
            </g>

            <circle cx="560" cy="220" r="150" fill="none" stroke="#000" stroke-width="1" />
            <g clip-path="url(#scene1-clip-west)">
                <line x1="410" y1="220" x2="710" y2="220" stroke="#000" stroke-width="1" />
                <line x1="410" y1="160" x2="710" y2="160" stroke="#888" stroke-width="1" stroke-dasharray="4,4" />
                <line x1="410" y1="280" x2="710" y2="280" stroke="#888" stroke-width="1" stroke-dasharray="4,4" />
                <line x1="410" y1="82" x2="710" y2="82" stroke="#888" stroke-width="1" stroke-dasharray="4,4" />
                <line x1="410" y1="358" x2="710" y2="358" stroke="#888" stroke-width="1" stroke-dasharray="4,4" />
                <line x1="560" y1="70" x2="560" y2="370" stroke="#000" stroke-width="1" />
                <ellipse cx="560" cy="220" rx="75" ry="150" fill="none" stroke="#000" stroke-width="1" />
                <ellipse cx="560" cy="220" rx="130" ry="150" fill="none" stroke="#000" stroke-width="1" />
            </g>

            <circle cx="90" cy="280" r="4" fill="#000" />
            <circle cx="240" cy="220" r="4" fill="#000" />
            <circle cx="390" cy="160" r="4" fill="#000" />
            <circle cx="410" cy="160" r="4" fill="#000" />
            <circle cx="560" cy="220" r="4" fill="#000" />
            <circle cx="710" cy="280" r="4" fill="#000" />

            <g class="step-element step-1">
                <path d="M 240 70 A 150 150 0 0 0 240 370" stroke="#1565c0" stroke-width="3" fill="none" />
                <line x1="240" y1="70" x2="240" y2="370" stroke="#1565c0" stroke-width="3" />
                <path d="M 240 70 A 150 150 0 0 1 240 370" stroke="#1565c0" stroke-width="3" fill="none" />
                <path d="M 560 70 A 150 150 0 0 0 560 370" stroke="#1565c0" stroke-width="3" fill="none" />
                <line x1="560" y1="70" x2="560" y2="370" stroke="#1565c0" stroke-width="3" />
                <path d="M 560 70 A 150 150 0 0 1 560 370" stroke="#1565c0" stroke-width="3" fill="none" />
            </g>

            <g class="step-element step-2">
                <path d="M 710 280 Q 635 280 560 220 T 410 160" fill="none" stroke="#1565c0" stroke-width="2" class="path-anim" />
                <path d="M 390 160 Q 315 160 240 220 T 90 280" fill="none" stroke="#1565c0" stroke-width="2" class="path-anim" />
                <polygon points="560,220 568,215 565,225" fill="#1565c0" />
                <polygon points="240,220 248,215 245,225" fill="#1565c0" />
                <circle cx="90" cy="280" r="4" fill="#c62828" />
                <circle cx="240" cy="220" r="4" fill="#c62828" />
                <circle cx="390" cy="160" r="4" fill="#c62828" />
                <circle cx="410" cy="160" r="4" fill="#c62828" />
                <circle cx="560" cy="220" r="4" fill="#c62828" />
                <circle cx="710" cy="280" r="4" fill="#c62828" />
            </g>

            <g class="step-element step-3">
                <circle cx="90" cy="280" r="4" fill="#c62828" class="flash-a" />
                <circle cx="390" cy="160" r="4" fill="#c62828" class="flash-cd" />
                <circle cx="410" cy="160" r="4" fill="#c62828" class="flash-cd" />
                <line x1="390" y1="160" x2="390" y2="100" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene1-arrow-green)" />
                <line x1="390" y1="160" x2="390" y2="220" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene1-arrow-green)" />
                <line x1="410" y1="160" x2="410" y2="100" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene1-arrow-green)" />
                <line x1="410" y1="160" x2="410" y2="220" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene1-arrow-green)" />
                <g transform="translate(100, 410)">
                    <circle cx="0" cy="0" r="40" fill="none" stroke="#000" stroke-width="1" />
                    <line x1="0" y1="-45" x2="0" y2="45" stroke="#000" stroke-width="1" />
                    <line x1="-40" y1="0" x2="40" y2="0" stroke="#000" stroke-width="1" />
                    <line x1="-35" y1="-18" x2="35" y2="-18" stroke="#888" stroke-width="1" stroke-dasharray="2,2" />
                    <line x1="-16" y1="-37" x2="16" y2="37" stroke="#000" stroke-width="1" />
                    <path d="M -16 -37 L 16 37 A 40 40 0 0 0 0 -40 Z" fill="#000" opacity="0.3" />
                    <line x1="-60" y1="0" x2="-45" y2="0" stroke="#f57f17" stroke-width="2" marker-end="url(#scene1-arrow-orange)" />
                    <line x1="-60" y1="-20" x2="-45" y2="-20" stroke="#f57f17" stroke-width="2" marker-end="url(#scene1-arrow-orange)" />
                    <line x1="-60" y1="20" x2="-45" y2="20" stroke="#f57f17" stroke-width="2" marker-end="url(#scene1-arrow-orange)" />
                </g>
            </g>

            <g class="step-element step-4">
                <circle cx="360" cy="162" r="4" fill="#c62828" />
            </g>
        </svg>

        <!-- HTML Labels -->
        <!-- Base Labels -->
        <div class="html-label top" style="left: 240px; top: 55px;">N</div>
        <div class="html-label bottom" style="left: 240px; top: 385px;">S</div>
        <div class="html-label bottom" style="left: 240px; top: 405px;">东半球</div>
        <div class="html-label top" style="left: 560px; top: 55px;">N</div>
        <div class="html-label bottom" style="left: 560px; top: 385px;">S</div>
        <div class="html-label bottom" style="left: 560px; top: 405px;">西半球</div>

        <div class="html-label left hide-on-step2" style="left: 75px; top: 280px;">A</div>
        <div class="html-label right hide-on-step2" style="left: 255px; top: 220px;">B</div>
        <div class="html-label left hide-on-step2" style="left: 375px; top: 160px;">C</div>
        <div class="html-label right hide-on-step2" style="left: 425px; top: 160px;">D</div>
        <div class="html-label right hide-on-step2" style="left: 575px; top: 220px;">E</div>
        <div class="html-label right hide-on-step2" style="left: 725px; top: 280px;">F</div>

        <!-- Step 1 Labels -->
        <div class="html-label left step-element step-1" style="left: 75px; top: 220px; color: #1565c0;">20°W</div>
        <div class="html-label top step-element step-1" style="left: 240px; top: 35px; color: #1565c0;">70°E</div>
        <div class="html-label step-element step-1" style="left: 400px; top: 235px; color: #1565c0;">160°E</div>
        <div class="html-label top step-element step-1" style="left: 560px; top: 35px; color: #1565c0;">110°W</div>
        <div class="html-label right step-element step-1" style="left: 725px; top: 220px; color: #1565c0;">20°W</div>

        <!-- Step 2 Labels -->
        <div class="html-label left step-element step-2" style="left: 75px; top: 280px; color: #c62828; font-size: 12px;">A(冬至)</div>
        <div class="html-label right step-element step-2" style="left: 255px; top: 235px; color: #c62828; font-size: 12px;">B(秋分)</div>
        <div class="html-label left step-element step-2" style="left: 375px; top: 145px; color: #c62828; font-size: 12px;">C(夏至)</div>
        <div class="html-label right step-element step-2" style="left: 425px; top: 145px; color: #c62828; font-size: 12px;">D(夏至)</div>
        <div class="html-label right step-element step-2" style="left: 575px; top: 235px; color: #c62828; font-size: 12px;">E(春分)</div>
        <div class="html-label right step-element step-2" style="left: 725px; top: 280px; color: #c62828; font-size: 12px;">F(冬至)</div>

        <!-- Step 3 Labels -->
        <div class="html-label top step-element step-3" style="left: 90px; top: 260px; color: #c62828; font-size: 12px;">直射南回归线</div>
        <div class="html-label bottom step-element step-3" style="left: 400px; top: 175px; color: #c62828; font-size: 12px;">直射北回归线</div>
        <div class="html-label step-element step-3" style="left: 120px; top: 390px; font-size: 10px;">极夜</div>

        <!-- Step 4 Labels -->
        <div class="html-label top step-element step-4" style="left: 360px; top: 150px; color: #c62828; font-size: 12px;">远日点(7月初)</div>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 4;
        const container = document.getElementById('scene1-container');
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');

        function updateState() {
            container.className = 'scene1-state-' + currentStep;
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateState();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateState();
            }
        });
    })();
    </script>
</body>
</html>
