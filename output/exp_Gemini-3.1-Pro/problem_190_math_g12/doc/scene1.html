<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        .scene1-btn { padding: 6px 12px; font-size: 14px; cursor: pointer; background: #f0f0f0; border: 1px solid #ccc; border-radius: 4px; }
        .scene1-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-step-desc { font-size: 14px; color: #333; min-width: 200px; text-align: center; background: rgba(255,255,255,0.8); padding: 4px 8px; border-radius: 4px; }
        
        /* 3D 标签样式 */
        .scene1-label { position: absolute; font-size: 16px; font-family: "Times New Roman", Times, serif; font-style: italic; color: #000; pointer-events: none; transform: translate(-50%, -50%); z-index: 5; }
        .scene1-label-offset-up { transform: translate(-50%, -120%); }
        .scene1-label-offset-down { transform: translate(-50%, 20%); }
        .scene1-label-offset-left { transform: translate(-120%, -50%); }
        .scene1-label-offset-right { transform: translate(20%, -50%); }
        .scene1-label-offset-upright { transform: translate(20%, -120%); }
        
        #scene1-cross { position: absolute; font-size: 20px; color: red; pointer-events: none; transform: translate(-50%, -50%); z-index: 6; display: none; }
    </style>
    <!-- 引入 Three.js ES Module -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div id="scene1-container">
        <!-- Three.js Canvas 将被插入到这里 -->
        
        <!-- 3D 标签 -->
        <div id="scene1-label-P" class="scene1-label scene1-label-offset-up">P</div>
        <div id="scene1-label-A" class="scene1-label scene1-label-offset-left">A</div>
        <div id="scene1-label-B" class="scene1-label scene1-label-offset-down">B</div>
        <div id="scene1-label-C" class="scene1-label scene1-label-offset-right">C</div>
        <div id="scene1-label-D" class="scene1-label scene1-label-offset-upright">D</div>
        <div id="scene1-label-E" class="scene1-label scene1-label-offset-right" style="display:none;">E</div>
        <div id="scene1-label-l" class="scene1-label scene1-label-offset-left" style="display:none; color: blue;">l</div>
        
        <!-- 矛盾标记 -->
        <div id="scene1-cross">❌</div>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn" disabled>◀ 上一步</button>
            <div id="scene1-step-desc">初始状态：四棱锥 P-ABCD</div>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 坐标表
        // P: (-1, 4, 0)
        // A: (-3, 0, 1)
        // B: (0, 0, 1.5)
        // C: (2, 0, 0)
        // D: (-1, 0, -2)
        // E: (5.67, 0, 2.44) (AB与DC延长线交点)
        // l: (-3.5, 2, -0.5)至(-0.5, 2, 1.5)
        // 矛盾标记: (-1.5, 0, 1.25)
        // 平行线1: (-1.7, 0, 1.22)至(-2.7, 0.6, 0.85)
        // 平行线2: (-0.83, 0, 1.36)至(-2.5, 1.0, 0.75)

        const container = document.getElementById('scene1-container');
        const width = 800;
        const height = 500;

        // 场景、相机、渲染器
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);

        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
        camera.position.set(2, 6, 10);
        camera.lookAt(0, 1, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(width, height);
        container.insertBefore(renderer.domElement, container.firstChild);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 1, 0);

        // 顶点数据
        const pts = {
            P: new THREE.Vector3(-1, 4, 0),
            A: new THREE.Vector3(-3, 0, 1),
            B: new THREE.Vector3(0, 0, 1.5),
            C: new THREE.Vector3(2, 0, 0),
            D: new THREE.Vector3(-1, 0, -2),
            E: new THREE.Vector3(5.67, 0, 2.44)
        };

        // 材质
        const matSolidBlack = new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 2 });
        const matDashedGray = new THREE.LineDashedMaterial({ color: 0x888888, dashSize: 0.2, gapSize: 0.1, linewidth: 2 });
        const matSolidRed = new THREE.LineBasicMaterial({ color: 0xff0000, linewidth: 2 });
        const matSolidRedThick = new THREE.LineBasicMaterial({ color: 0xff0000, linewidth: 3 });
        const matDashedBlue = new THREE.LineDashedMaterial({ color: 0x0000ff, dashSize: 0.2, gapSize: 0.1, linewidth: 2 });

        const matFaceGreen = new THREE.MeshBasicMaterial({ color: 0x2e7d32, transparent: true, opacity: 0.1, side: THREE.DoubleSide });
        const matFaceBlue = new THREE.MeshBasicMaterial({ color: 0x1565c0, transparent: true, opacity: 0.2, side: THREE.DoubleSide });
        const matFaceRed = new THREE.MeshBasicMaterial({ color: 0xc62828, transparent: true, opacity: 0.2, side: THREE.DoubleSide });

        // 辅助函数：创建线段
        function createLine(p1, p2, material) {
            const geometry = new THREE.BufferGeometry().setFromPoints([p1, p2]);
            const line = new THREE.Line(geometry, material);
            if (material.isLineDashedMaterial) {
                line.computeLineDistances();
            }
            scene.add(line);
            return line;
        }

        // 辅助函数：创建多边形面
        function createFace(points, material) {
            const shape = new THREE.Shape();
            // 投影到 2D 平面创建 Shape (这里简单处理，因为 Three.js ShapeGeometry 默认在 XY 平面)
            // 更好的方法是使用 BufferGeometry 和 Earcut，或者直接手动指定三角形顶点
            // 对于简单的凸多边形，手动指定三角形索引更稳妥
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            
            // 简单的三角剖分 (假设凸多边形)
            const indices = [];
            for (let i = 1; i < points.length - 1; i++) {
                indices.push(0, i, i + 1);
            }
            geometry.setIndex(indices);
            geometry.computeVertexNormals();

            const mesh = new THREE.Mesh(geometry, material);
            scene.add(mesh);
            return mesh;
        }

        // --- 构建基础图形 ---
        // 可见棱
        const edgePA = createLine(pts.P, pts.A, matSolidBlack);
        const edgePB = createLine(pts.P, pts.B, matSolidBlack);
        const edgePC = createLine(pts.P, pts.C, matSolidBlack);
        const edgeAB = createLine(pts.A, pts.B, matSolidBlack);
        const edgeBC = createLine(pts.B, pts.C, matSolidBlack);

        // 不可见棱
        const edgePD = createLine(pts.P, pts.D, matDashedGray);
        const edgeAD = createLine(pts.A, pts.D, matDashedGray);
        const edgeCD = createLine(pts.C, pts.D, matDashedGray);

        // 底面 ABCD
        const faceABCD = createFace([pts.A, pts.B, pts.C, pts.D], matFaceGreen);

        // --- 步骤1 元素 ---
        const facePAB = createFace([pts.P, pts.A, pts.B], matFaceBlue);
        facePAB.visible = false;
        
        // 高亮 DC (覆盖在原有虚线上)
        const edgeDCHighlight = createLine(pts.C, pts.D, matSolidRed);
        edgeDCHighlight.visible = false;

        // 假设直线 l
        const ptL1 = new THREE.Vector3(-3.5, 2, -0.5);
        const ptL2 = new THREE.Vector3(-0.5, 2, 1.5);
        const lineL = createLine(ptL1, ptL2, matDashedBlue);
        lineL.visible = false;

        // --- 步骤2 元素 ---
        const lineBE = createLine(pts.B, pts.E, matSolidRed);
        const lineCE = createLine(pts.C, pts.E, matSolidRed);
        const linePE = createLine(pts.P, pts.E, matSolidRedThick);
        lineBE.visible = false;
        lineCE.visible = false;
        linePE.visible = false;

        const facePDC = createFace([pts.P, pts.D, pts.C], matFaceRed);
        facePDC.visible = false;

        // --- 步骤3 元素 ---
        const ptPara1_1 = new THREE.Vector3(-1.7, 0, 1.22);
        const ptPara1_2 = new THREE.Vector3(-2.7, 0.6, 0.85);
        const linePara1 = createLine(ptPara1_1, ptPara1_2, matDashedBlue);
        linePara1.visible = false;

        const ptPara2_1 = new THREE.Vector3(-0.83, 0, 1.36);
        const ptPara2_2 = new THREE.Vector3(-2.5, 1.0, 0.75);
        const linePara2 = createLine(ptPara2_1, ptPara2_2, matDashedBlue);
        linePara2.visible = false;


        // --- 标签更新逻辑 ---
        const labels = [
            { id: 'scene1-label-P', pos: pts.P },
            { id: 'scene1-label-A', pos: pts.A },
            { id: 'scene1-label-B', pos: pts.B },
            { id: 'scene1-label-C', pos: pts.C },
            { id: 'scene1-label-D', pos: pts.D },
            { id: 'scene1-label-E', pos: pts.E },
            { id: 'scene1-label-l', pos: ptL1 },
            { id: 'scene1-cross', pos: new THREE.Vector3(-1.5, 0, 1.25) }
        ];

        function updateLabels() {
            const halfWidth = width / 2;
            const halfHeight = height / 2;

            labels.forEach(labelInfo => {
                const el = document.getElementById(labelInfo.id);
                if (!el || el.style.display === 'none') return;

                const pos = labelInfo.pos.clone();
                pos.project(camera);

                // 检查是否在相机前方
                if (pos.z > 1) {
                    el.style.display = 'none';
                    return;
                } else if (el.id !== 'scene1-label-E' && el.id !== 'scene1-label-l' && el.id !== 'scene1-cross') {
                    // 基础标签始终显示，除非被步骤逻辑隐藏
                    el.style.display = '';
                }

                const x = (pos.x * halfWidth) + halfWidth;
                const y = -(pos.y * halfHeight) + halfHeight;

                el.style.left = `${x}px`;
                el.style.top = `${y}px`;
            });
        }

        // --- 交互逻辑 ---
        let currentStep = 0;
        const maxStep = 3;
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepDesc = document.getElementById('scene1-step-desc');
        
        const labelE = document.getElementById('scene1-label-E');
        const labelL = document.getElementById('scene1-label-l');
        const crossMark = document.getElementById('scene1-cross');

        let crossTimeout = null;

        function updateStep() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;

            // 重置所有步骤元素
            facePAB.visible = false;
            edgeDCHighlight.visible = false;
            lineL.visible = false;
            labelL.style.display = 'none';
            crossMark.style.display = 'none';
            if (crossTimeout) clearTimeout(crossTimeout);

            lineBE.visible = false;
            lineCE.visible = false;
            linePE.visible = false;
            labelE.style.display = 'none';
            facePDC.visible = false;

            linePara1.visible = false;
            linePara2.visible = false;

            switch (currentStep) {
                case 0:
                    stepDesc.textContent = "初始状态：四棱锥 P-ABCD";
                    break;
                case 1:
                    stepDesc.textContent = "命题①：假设 PAB 内存在 l // DC，推导矛盾";
                    facePAB.visible = true;
                    edgeDCHighlight.visible = true;
                    lineL.visible = true;
                    labelL.style.display = '';
                    
                    // 延迟显示矛盾标记
                    crossTimeout = setTimeout(() => {
                        crossMark.style.display = '';
                    }, 500);
                    break;
                case 2:
                    stepDesc.textContent = "命题③：延长 AB, DC 交于 E，PE 为面面交线";
                    lineBE.visible = true;
                    lineCE.visible = true;
                    linePE.visible = true;
                    labelE.style.display = '';
                    facePDC.visible = true;
                    break;
                case 3:
                    stepDesc.textContent = "命题②：PAB 内存在无数条直线平行于 PE";
                    lineBE.visible = true;
                    lineCE.visible = true;
                    linePE.visible = true;
                    labelE.style.display = '';
                    facePDC.visible = true;
                    
                    linePara1.visible = true;
                    linePara2.visible = true;
                    break;
            }
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateStep();
            }
        });

        // --- 渲染循环 ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            updateLabels();
            renderer.render(scene, camera);
        }

        // 初始化
        updateStep();
        animate();

    </script>
</body>
</html>
