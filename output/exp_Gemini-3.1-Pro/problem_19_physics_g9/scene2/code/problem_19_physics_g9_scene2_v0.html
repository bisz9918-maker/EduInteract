<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene2-formula-box { position: absolute; top: 40px; left: 150px; width: 500px; height: 140px; background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 8px; padding: 15px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; font-size: 16px; line-height: 1.5; }
        
        /* SVG Elements */
        .scene2-element { transition: opacity 0.3s ease, r 0.3s ease, stroke-width 0.3s ease; }
        .scene2-hidden { opacity: 0; pointer-events: none; }
        .scene2-visible { opacity: 1; }
        
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #fff; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene2-step-text { font-size: 14px; min-width: 80px; text-align: center; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <div id="scene2-formula-box"></div>
        
        <svg width="800" height="500">
            <!-- 主线段 -->
            <line id="scene2-line-ab" x1="100" y1="250" x2="700" y2="250" stroke="black" stroke-width="6" />
            
            <!-- 高亮线段 -->
            <line id="scene2-hl-cd" class="scene2-element scene2-hidden" x1="250" y1="250" x2="550" y2="250" stroke="#1565c0" stroke-width="8" />
            <line id="scene2-hl-c1d1" class="scene2-element scene2-hidden" x1="130" y1="250" x2="670" y2="250" stroke="#c62828" stroke-width="8" />

            <!-- 点 -->
            <circle id="scene2-pt-a" cx="100" cy="250" r="4" fill="black" />
            <circle id="scene2-pt-b" cx="700" cy="250" r="4" fill="black" />
            
            <circle id="scene2-pt-c" class="scene2-element scene2-hidden" cx="250" cy="250" r="4" fill="#1565c0" />
            <circle id="scene2-pt-d" class="scene2-element scene2-hidden" cx="550" cy="250" r="4" fill="#1565c0" />
            
            <circle id="scene2-pt-c1" class="scene2-element scene2-hidden" cx="130" cy="250" r="4" fill="#c62828" />
            <circle id="scene2-pt-d1" class="scene2-element scene2-hidden" cx="670" cy="250" r="4" fill="#c62828" />

            <!-- 点标签 -->
            <text id="scene2-lbl-a" x="100" y="235" text-anchor="middle" font-size="16" fill="black">A</text>
            <text id="scene2-lbl-b" x="700" y="235" text-anchor="middle" font-size="16" fill="black">B</text>
            
            <text id="scene2-lbl-c" class="scene2-element scene2-hidden" x="250" y="235" text-anchor="middle" font-size="16" fill="#1565c0">c</text>
            <text id="scene2-lbl-d" class="scene2-element scene2-hidden" x="550" y="235" text-anchor="middle" font-size="16" fill="#1565c0">d</text>
            
            <text id="scene2-lbl-c1" class="scene2-element scene2-hidden" x="130" y="235" text-anchor="middle" font-size="16" fill="#c62828">c'</text>
            <text id="scene2-lbl-d1" class="scene2-element scene2-hidden" x="670" y="235" text-anchor="middle" font-size="16" fill="#c62828">d'</text>

            <!-- 测距线 (0.6A) -->
            <g id="scene2-dim-06a" class="scene2-element scene2-hidden">
                <path d="M 100 265 L 100 270 L 250 270 L 250 265" fill="none" stroke="#1565c0" stroke-width="1.5" />
                <text x="175" y="288" text-anchor="middle" font-size="14" fill="#1565c0">6cm</text>
                
                <path d="M 250 265 L 250 270 L 550 270 L 550 265" fill="none" stroke="#1565c0" stroke-width="1.5" />
                <text x="400" y="288" text-anchor="middle" font-size="14" fill="#1565c0">12cm</text>
                
                <path d="M 550 265 L 550 270 L 700 270 L 700 265" fill="none" stroke="#1565c0" stroke-width="1.5" />
                <text x="625" y="288" text-anchor="middle" font-size="14" fill="#1565c0">6cm</text>
            </g>

            <!-- 测距线 (3A) -->
            <g id="scene2-dim-3a" class="scene2-element scene2-hidden">
                <path id="scene2-dim-3a-ac1" class="scene2-element scene2-hidden" d="M 100 315 L 100 320 L 130 320 L 130 315" fill="none" stroke="#c62828" stroke-width="1.5" />
                <text id="scene2-lbl-3a-ac1" class="scene2-element scene2-hidden" x="115" y="338" text-anchor="middle" font-size="14" fill="#c62828">1.2cm</text>
                
                <path id="scene2-dim-3a-c1d1" class="scene2-element scene2-hidden" d="M 130 315 L 130 320 L 670 320 L 670 315" fill="none" stroke="#c62828" stroke-width="1.5" />
                <text id="scene2-lbl-3a-c1d1" class="scene2-element scene2-hidden" x="400" y="338" text-anchor="middle" font-size="14" fill="#c62828">21.6cm</text>
                
                <path id="scene2-dim-3a-d1b" class="scene2-element scene2-hidden" d="M 670 315 L 670 320 L 700 320 L 700 315" fill="none" stroke="#c62828" stroke-width="1.5" />
                <text id="scene2-lbl-3a-d1b" class="scene2-element scene2-hidden" x="685" y="338" text-anchor="middle" font-size="14" fill="#c62828">1.2cm</text>
            </g>

            <!-- 总长标注 -->
            <g id="scene2-dim-l">
                <path d="M 100 365 L 100 370 L 700 370 L 700 365" fill="none" stroke="#757575" stroke-width="1.5" />
                <text id="scene2-lbl-l" x="400" y="388" text-anchor="middle" font-size="14" fill="#757575">L</text>
            </g>
        </svg>

        <div id="scene2-controls">
            <button id="scene2-btn-prev">◀ 上一步</button>
            <div id="scene2-step-text">0 / 5</div>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 5;
        
        const formulaBox = document.getElementById('scene2-formula-box');
        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        const stepText = document.getElementById('scene2-step-text');
        
        const formulas = [
            "设铅笔芯总长度为 $L$。",
            "0.6A量程下，滑片在 $c$ 点时电流最大：<br>$I_1 = 0.6\text{A}, I_2 = 0.2\text{A}$<br>$\Rightarrow R_{Ac} : R_{cB} = I_2 : I_1 = 1 : 3$<br>$\Rightarrow Ac : cB = 1 : 3$",
            "由对称性，滑片在 $d$ 点时 $dB : Ad = 1 : 3$。<br>中间滑动范围 $cd = L - Ac - dB = L/2 = 12\text{cm}$。<br>解得 $L = 24\text{cm}$，则 $Ac = dB = 6\text{cm}$。",
            "3A量程下，滑片在 $c'$ 点时电流最大为 3A。<br>根据反比关系：$R_{Ac'} \times 3\text{A} = R_{Ac} \times 0.6\text{A}$<br>$\Rightarrow Ac' = Ac \times \frac{0.6}{3} = 6\text{cm} \times 0.2 = 1.2\text{cm}$",
            "同理 $d'B = 1.2\text{cm}$。<br>新的滑动范围 $c'd' = L - Ac' - d'B = 24 - 1.2 - 1.2 = 21.6\text{cm}$。",
            "在 $c'$ 点时，两电流表示数比值最大：<br>$Ac' = 1.2\text{cm}, c'B = 24 - 1.2 = 22.8\text{cm}$<br>$I_1 : I_2 = R_{c'B} : R_{Ac'} = c'B : Ac' = 22.8 : 1.2 = 19 : 1$"
        ];

        function show(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene2-hidden');
                el.classList.add('scene2-visible');
            }
        }

        function hide(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene2-visible');
                el.classList.add('scene2-hidden');
            }
        }
        
        function setRadius(id, r) {
            const el = document.getElementById(id);
            if (el) el.setAttribute('r', r);
        }

        function updateScene() {
            // Update UI
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
            stepText.textContent = `${currentStep} / ${maxStep}`;
            
            // Update Formula
            formulaBox.innerHTML = formulas[currentStep];
            if (window.MathJax) {
                MathJax.typesetPromise([formulaBox]).catch(function (err) {
                    console.error(err.message);
                });
            }

            // Reset all dynamic elements
            hide('scene2-pt-c'); hide('scene2-lbl-c');
            hide('scene2-pt-d'); hide('scene2-lbl-d');
            hide('scene2-pt-c1'); hide('scene2-lbl-c1');
            hide('scene2-pt-d1'); hide('scene2-lbl-d1');
            hide('scene2-dim-06a');
            hide('scene2-dim-3a');
            hide('scene2-dim-3a-ac1'); hide('scene2-lbl-3a-ac1');
            hide('scene2-dim-3a-c1d1'); hide('scene2-lbl-3a-c1d1');
            hide('scene2-dim-3a-d1b'); hide('scene2-lbl-3a-d1b');
            hide('scene2-hl-cd');
            hide('scene2-hl-c1d1');
            
            setRadius('scene2-pt-c', 4);
            setRadius('scene2-pt-c1', 4);
            
            document.getElementById('scene2-lbl-l').textContent = "L";

            // Apply step logic
            if (currentStep >= 1) {
                show('scene2-pt-c'); show('scene2-lbl-c');
                show('scene2-pt-d'); show('scene2-lbl-d');
            }
            if (currentStep === 1) {
                setRadius('scene2-pt-c', 6);
            }
            if (currentStep >= 2) {
                show('scene2-dim-06a');
                document.getElementById('scene2-lbl-l').textContent = "L = 24cm";
            }
            if (currentStep === 2) {
                show('scene2-hl-cd');
            }
            if (currentStep >= 3) {
                show('scene2-pt-c1'); show('scene2-lbl-c1');
                show('scene2-dim-3a');
                show('scene2-dim-3a-ac1'); show('scene2-lbl-3a-ac1');
            }
            if (currentStep === 3) {
                setRadius('scene2-pt-c1', 6);
            }
            if (currentStep >= 4) {
                show('scene2-pt-d1'); show('scene2-lbl-d1');
                show('scene2-dim-3a-c1d1'); show('scene2-lbl-3a-c1d1');
                show('scene2-dim-3a-d1b'); show('scene2-lbl-3a-d1b');
            }
            if (currentStep === 4) {
                show('scene2-hl-c1d1');
            }
            if (currentStep === 5) {
                setRadius('scene2-pt-c1', 6);
            }
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });

        // Initial render
        // Wait a bit for MathJax to load if it's slow
        setTimeout(updateScene, 100);
    })();
    </script>
</body>
</html>
