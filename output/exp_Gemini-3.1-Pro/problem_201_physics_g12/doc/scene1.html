<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        button { padding: 6px 12px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button:hover:not(:disabled) { background: #e9e9e9; }
        
        .scene1-highlight { stroke-width: 4px !important; filter: drop-shadow(0 0 4px currentColor); }
        .scene1-hover-zone { cursor: pointer; }
        
        /* 隐藏类 */
        .scene1-hidden { display: none !important; opacity: 0 !important; }
        
        /* 文本样式 */
        text { font-family: 'Times New Roman', Times, serif; font-size: 16px; }
        .scene1-italic { font-style: italic; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <defs>
                <!-- 黑色箭头 -->
                <marker id="scene1-arrow-black" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
                </marker>
                <!-- 蓝色箭头 -->
                <marker id="scene1-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0" />
                </marker>
                <!-- 红色箭头 -->
                <marker id="scene1-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828" />
                </marker>
                <!-- 灰色箭头 -->
                <marker id="scene1-arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#888888" />
                </marker>
                <!-- 灰色反向箭头 -->
                <marker id="scene1-arrow-gray-rev" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 10 0 L 0 5 L 10 10 z" fill="#888888" />
                </marker>
            </defs>

            <!-- 步骤0：基础元素 -->
            <g id="scene1-step0">
                <!-- 电场线 -->
                <g stroke="#000000" stroke-width="1" marker-end="url(#scene1-arrow-black)">
                    <line x1="50" y1="60" x2="750" y2="60" />
                    <line x1="50" y1="120" x2="750" y2="120" />
                    <line x1="50" y1="180" x2="750" y2="180" />
                    <line x1="50" y1="240" x2="750" y2="240" />
                    <line x1="50" y1="300" x2="750" y2="300" />
                    <line x1="50" y1="360" x2="750" y2="360" />
                </g>
                <text x="730" y="45" class="scene1-italic">E</text>

                <!-- 轨迹 -->
                <path d="M 200,350 Q 200,150 600,150" fill="none" stroke="#000000" stroke-width="2" />

                <!-- A点 -->
                <circle cx="200" cy="350" r="4" fill="#000000" />
                <text x="180" y="365" class="scene1-italic">A</text>

                <!-- B点 -->
                <circle cx="600" cy="150" r="4" fill="#000000" />
                <text x="600" y="135" class="scene1-italic">B</text>

                <!-- v0 矢量 -->
                <line x1="200" y1="350" x2="200" y2="270" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-blue)" />
                <text x="175" y="310" fill="#1565c0" class="scene1-italic">v<tspan dy="5" font-size="12">0</tspan></text>

                <!-- vB 矢量 -->
                <line x1="600" y1="150" x2="760" y2="150" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-blue)" />
                <text x="680" y="135" fill="#1565c0" class="scene1-italic">v<tspan dy="5" font-size="12">B</tspan></text>
            </g>

            <!-- 步骤1：受力分析 -->
            <g id="scene1-step1" class="scene1-hidden">
                <!-- M点 -->
                <circle cx="300" cy="200" r="4" fill="#000000" />
                
                <!-- mg 矢量 -->
                <line id="scene1-mg-vec" x1="300" y1="200" x2="300" y2="250" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrow-red)" />
                <text id="scene1-mg-txt" x="170" y="225" fill="#c62828" class="scene1-italic">mg</text>

                <!-- Fe 矢量 -->
                <line id="scene1-fe-vec" x1="300" y1="200" x2="400" y2="200" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrow-red)" />
                <text id="scene1-fe-txt" x="350" y="130" fill="#c62828" class="scene1-italic">F<tspan dy="5" font-size="12">e</tspan></text>
            </g>

            <!-- 步骤2：运动分解动画 -->
            <g id="scene1-step2" class="scene1-hidden">
                <!-- 动点 P -->
                <circle id="scene1-p-dot" cx="200" cy="350" r="4" fill="#000000" />
                
                <!-- vy 矢量 -->
                <line id="scene1-vy-vec" x1="200" y1="350" x2="200" y2="270" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-blue)" />
                <text id="scene1-vy-txt" x="175" y="330" fill="#1565c0" class="scene1-italic">v<tspan dy="5" font-size="12">y</tspan></text>

                <!-- vx 矢量 -->
                <line id="scene1-vx-vec" x1="200" y1="350" x2="200" y2="350" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-blue)" />
                <text id="scene1-vx-txt" x="240" y="370" fill="#1565c0" class="scene1-italic">v<tspan dy="5" font-size="12">x</tspan></text>
            </g>

            <!-- 步骤3：位移与做功 -->
            <g id="scene1-step3" class="scene1-hidden">
                <!-- 辅助线 -->
                <line x1="200" y1="350" x2="120" y2="350" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" />
                <line x1="600" y1="150" x2="120" y2="150" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" />
                <line x1="200" y1="350" x2="200" y2="420" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" />
                <line x1="600" y1="150" x2="600" y2="420" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" />

                <!-- h 标注线 -->
                <line id="scene1-h-line" x1="120" y1="350" x2="120" y2="150" stroke="#888888" stroke-width="2" marker-start="url(#scene1-arrow-gray-rev)" marker-end="url(#scene1-arrow-gray)" />
                <text id="scene1-h-txt" x="95" y="250" fill="#888888" class="scene1-italic">h</text>
                <!-- h 悬停区 -->
                <line id="scene1-h-hover" class="scene1-hover-zone" x1="120" y1="350" x2="120" y2="150" stroke="transparent" stroke-width="20" />

                <!-- x 标注线 -->
                <line id="scene1-x-line" x1="200" y1="420" x2="600" y2="420" stroke="#888888" stroke-width="2" marker-start="url(#scene1-arrow-gray-rev)" marker-end="url(#scene1-arrow-gray)" />
                <text id="scene1-x-txt" x="400" y="445" fill="#888888" class="scene1-italic">x</text>
                <!-- x 悬停区 -->
                <line id="scene1-x-hover" class="scene1-hover-zone" x1="200" y1="420" x2="600" y2="420" stroke="transparent" stroke-width="20" />
            </g>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1 / 4</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const totalSteps = 4;
        
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        
        const step1Group = document.getElementById('scene1-step1');
        const step2Group = document.getElementById('scene1-step2');
        const step3Group = document.getElementById('scene1-step3');
        
        // 动画相关
        let animFrameId = null;
        let animStartTime = null;
        const animDuration = 2500; // 2.5s
        
        const pDot = document.getElementById('scene1-p-dot');
        const vyVec = document.getElementById('scene1-vy-vec');
        const vyTxt = document.getElementById('scene1-vy-txt');
        const vxVec = document.getElementById('scene1-vx-vec');
        const vxTxt = document.getElementById('scene1-vx-txt');
        
        // 高亮相关
        const hHover = document.getElementById('scene1-h-hover');
        const hLine = document.getElementById('scene1-h-line');
        const hTxt = document.getElementById('scene1-h-txt');
        const mgVec = document.getElementById('scene1-mg-vec');
        const mgTxt = document.getElementById('scene1-mg-txt');
        
        const xHover = document.getElementById('scene1-x-hover');
        const xLine = document.getElementById('scene1-x-line');
        const xTxt = document.getElementById('scene1-x-txt');
        const feVec = document.getElementById('scene1-fe-vec');
        const feTxt = document.getElementById('scene1-fe-txt');

        function show(el) { el.classList.remove('scene1-hidden'); }
        function hide(el) { el.classList.add('scene1-hidden'); }

        function updateStep() {
            stepIndicator.textContent = `步骤 ${currentStep + 1} / ${totalSteps}`;
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps - 1;
            
            // 停止动画
            if (animFrameId) {
                cancelAnimationFrame(animFrameId);
                animFrameId = null;
            }
            
            // 重置状态
            hide(step1Group);
            hide(step2Group);
            hide(step3Group);
            
            if (currentStep === 1) {
                show(step1Group);
            } else if (currentStep === 2) {
                show(step2Group);
                startAnimation();
            } else if (currentStep === 3) {
                show(step1Group); // 重新显示受力
                show(step3Group);
            }
        }

        function startAnimation() {
            animStartTime = null;
            function animate(timestamp) {
                if (!animStartTime) animStartTime = timestamp;
                let progress = (timestamp - animStartTime) / animDuration;
                if (progress > 1) {
                    animStartTime = timestamp; // 循环
                    progress = 0;
                }
                
                // Px = 200 + 400 * t^2
                // Py = 350 - 400 * t + 200 * t^2
                const t = progress;
                const px = 200 + 400 * t * t;
                const py = 350 - 400 * t + 200 * t * t;
                
                pDot.setAttribute('cx', px);
                pDot.setAttribute('cy', py);
                
                // vy 长度 = 80 * (1 - t)
                const vyLen = 80 * (1 - t);
                vyVec.setAttribute('x1', px);
                vyVec.setAttribute('y1', py);
                vyVec.setAttribute('x2', px);
                vyVec.setAttribute('y2', py - vyLen);
                vyTxt.setAttribute('x', px - 25);
                vyTxt.setAttribute('y', py - vyLen / 2);
                
                // vx 长度 = 160 * t
                const vxLen = 160 * t;
                vxVec.setAttribute('x1', px);
                vxVec.setAttribute('y1', py);
                vxVec.setAttribute('x2', px + vxLen);
                vxVec.setAttribute('y2', py);
                vxTxt.setAttribute('x', px + vxLen / 2);
                vxTxt.setAttribute('y', py + 20);
                
                // 隐藏长度为0的箭头
                vyVec.style.display = vyLen < 2 ? 'none' : '';
                vyTxt.style.display = vyLen < 2 ? 'none' : '';
                vxVec.style.display = vxLen < 2 ? 'none' : '';
                vxTxt.style.display = vxLen < 2 ? 'none' : '';
                
                animFrameId = requestAnimationFrame(animate);
            }
            animFrameId = requestAnimationFrame(animate);
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateStep();
            }
        });

        // 悬停交互
        hHover.addEventListener('mouseenter', () => {
            hLine.classList.add('scene1-highlight');
            hTxt.classList.add('scene1-highlight');
            mgVec.classList.add('scene1-highlight');
            mgTxt.classList.add('scene1-highlight');
        });
        hHover.addEventListener('mouseleave', () => {
            hLine.classList.remove('scene1-highlight');
            hTxt.classList.remove('scene1-highlight');
            mgVec.classList.remove('scene1-highlight');
            mgTxt.classList.remove('scene1-highlight');
        });

        xHover.addEventListener('mouseenter', () => {
            xLine.classList.add('scene1-highlight');
            xTxt.classList.add('scene1-highlight');
            feVec.classList.add('scene1-highlight');
            feTxt.classList.add('scene1-highlight');
        });
        xHover.addEventListener('mouseleave', () => {
            xLine.classList.remove('scene1-highlight');
            xTxt.classList.remove('scene1-highlight');
            feVec.classList.remove('scene1-highlight');
            feTxt.classList.remove('scene1-highlight');
        });

        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
