<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .step-group { transition: opacity 0.3s ease; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500">
            <!-- 坐标系 -->
            <defs>
                <marker id="scene2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#000" />
                </marker>
            </defs>
            
            <!-- X轴 -->
            <line x1="100" y1="400" x2="750" y2="400" stroke="#000" stroke-width="2" marker-end="url(#scene2-arrow)" />
            <text x="760" y="405" font-size="16" fill="#000">ω<tspan dy="-5" font-size="12">2</tspan></text>
            
            <!-- Y轴 -->
            <line x1="100" y1="400" x2="100" y2="50" stroke="#000" stroke-width="2" marker-end="url(#scene2-arrow)" />
            <text x="100" y="40" font-size="16" fill="#000" text-anchor="middle">F/mg</text>
            
            <!-- 原点 -->
            <text x="85" y="415" font-size="14" fill="#000">O</text>
            
            <!-- 阈值线 -->
            <line x1="100" y1="340" x2="700" y2="340" stroke="#888" stroke-width="1" stroke-dasharray="5,5" />
            <text x="75" y="345" font-size="14" fill="#000" text-anchor="end">0.5</text>
            
            <line x1="100" y1="160" x2="700" y2="160" stroke="#888" stroke-width="1" stroke-dasharray="5,5" />
            <text x="75" y="165" font-size="14" fill="#000" text-anchor="end">2.0</text>
            
            <!-- 图例框 -->
            <rect x="120" y="40" width="110" height="150" fill="none" stroke="#000" stroke-width="1" />
            
            <!-- 图例内容 -->
            <line x1="130" y1="65" x2="160" y2="65" stroke="#c62828" stroke-width="2" />
            <text x="180" y="70" font-size="14" fill="#000">f<tspan dy="5" font-size="10">A</tspan></text>
            
            <line x1="130" y1="100" x2="160" y2="100" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5" />
            <text x="180" y="105" font-size="14" fill="#000">f<tspan dy="5" font-size="10">B</tspan></text>
            
            <line x1="130" y1="135" x2="160" y2="135" stroke="#1565c0" stroke-width="2" />
            <text x="180" y="140" font-size="14" fill="#000">T<tspan dy="5" font-size="10">AB</tspan></text>
            
            <line x1="130" y1="170" x2="160" y2="170" stroke="#2e7d32" stroke-width="2" />
            <text x="180" y="175" font-size="14" fill="#000">T<tspan dy="5" font-size="10">OB</tspan></text>
            
            <!-- 步骤1 -->
            <g id="scene2-step1" class="step-group" style="opacity: 0; display: none;">
                <line x1="100" y1="400" x2="225" y2="339" stroke="#c62828" stroke-width="2" />
                <line x1="100" y1="400" x2="225" y2="370" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5" />
                
                <line x1="225" y1="339" x2="225" y2="400" stroke="#888" stroke-width="1" stroke-dasharray="5,5" />
                <circle cx="225" cy="339" r="4" fill="#000" />
                <text x="225" y="420" font-size="14" fill="#000" text-anchor="middle">25</text>
            </g>
            
            <!-- 步骤2 -->
            <g id="scene2-step2" class="step-group" style="opacity: 0; display: none;">
                <line x1="225" y1="339" x2="267" y2="339" stroke="#c62828" stroke-width="2" />
                <line x1="225" y1="370" x2="267" y2="341" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5" />
                <line x1="225" y1="400" x2="267" y2="380" stroke="#1565c0" stroke-width="2" />
                
                <line x1="267" y1="341" x2="267" y2="400" stroke="#888" stroke-width="1" stroke-dasharray="5,5" />
                <circle cx="267" cy="341" r="4" fill="#000" />
                <text x="267" y="420" font-size="14" fill="#000" text-anchor="middle">33.3</text>
            </g>
            
            <!-- 步骤3 -->
            <g id="scene2-step3" class="step-group" style="opacity: 0; display: none;">
                <line x1="267" y1="339" x2="700" y2="339" stroke="#c62828" stroke-width="2" />
                <line x1="267" y1="341" x2="700" y2="341" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5" />
                <line x1="267" y1="380" x2="700" y2="172" stroke="#1565c0" stroke-width="2" />
                <line x1="267" y1="400" x2="700" y2="88" stroke="#2e7d32" stroke-width="2" />
                
                <line x1="600" y1="160" x2="600" y2="400" stroke="#888" stroke-width="1" stroke-dasharray="5,5" />
                <circle cx="600" cy="160" r="4" fill="#000" />
                <text x="600" y="420" font-size="14" fill="#000" text-anchor="middle">100</text>
            </g>
        </svg>
        
        <div id="scene2-controls">
            <button id="scene2-btn-prev" disabled>◀ 上一步</button>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 3;
        
        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        
        function updateScene() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
            
            for (let i = 1; i <= maxStep; i++) {
                const group = document.getElementById(`scene2-step${i}`);
                if (i <= currentStep) {
                    group.style.display = 'block';
                    // Trigger reflow for transition
                    void group.offsetWidth;
                    group.style.opacity = '1';
                } else {
                    group.style.opacity = '0';
                    setTimeout(() => {
                        if (i > currentStep) {
                            group.style.display = 'none';
                        }
                    }, 300);
                }
            }
        }
        
        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });
        
        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });
        
        // Initialize
        updateScene();
    })();
    </script>
</body>
</html>
