<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A、B两球在匀强电场中的加速与弹性碰撞过程</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-step-text { font-size: 14px; min-width: 180px; text-align: center; }
        
        .scene1-transition { transition: transform 1s ease-in-out, opacity 0.3s ease-in-out; }
        .scene1-fade { transition: opacity 0.3s ease-in-out; }
        
        text { font-family: 'Times New Roman', Times, serif; font-size: 16px; }
        .scene1-math { font-style: italic; }
        .scene1-sub { font-size: 12px; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <defs>
                <marker id="scene1-arrow-black" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
                </marker>
                <marker id="scene1-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 1 L 10 5 L 0 9 z" fill="#c62828" />
                </marker>
                <marker id="scene1-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 1 L 10 5 L 0 9 z" fill="#1565c0" />
                </marker>
            </defs>

            <!-- 电场线 -->
            <line x1="50" y1="80" x2="750" y2="80" stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrow-black)" />
            <line x1="50" y1="380" x2="750" y2="380" stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrow-black)" />
            <text x="760" y="85" fill="#000000" class="scene1-math">E</text>
            <text x="760" y="385" fill="#000000" class="scene1-math">E</text>

            <!-- 运动基准线 -->
            <line x1="50" y1="230" x2="750" y2="230" stroke="#888888" stroke-width="2" stroke-dasharray="8,8" />

            <!-- 位移标注 L -->
            <g id="scene1-dim-L" class="scene1-fade" opacity="1">
                <line x1="100" y1="240" x2="100" y2="285" stroke="#000000" stroke-width="1" />
                <line x1="200" y1="240" x2="200" y2="285" stroke="#000000" stroke-width="1" />
                <line x1="100" y1="275" x2="200" y2="275" stroke="#000000" stroke-width="1" marker-start="url(#scene1-arrow-black)" marker-end="url(#scene1-arrow-black)" />
                <text x="150" y="295" fill="#000000" text-anchor="middle" class="scene1-math">L</text>
            </g>

            <!-- 位移标注 4L -->
            <g id="scene1-dim-4L" class="scene1-fade" opacity="0">
                <line x1="200" y1="240" x2="200" y2="285" stroke="#000000" stroke-width="1" />
                <line x1="600" y1="240" x2="600" y2="285" stroke="#000000" stroke-width="1" />
                <line x1="200" y1="275" x2="600" y2="275" stroke="#000000" stroke-width="1" marker-start="url(#scene1-arrow-black)" marker-end="url(#scene1-arrow-black)" />
                <text x="400" y="295" fill="#000000" text-anchor="middle" class="scene1-math">4L</text>
            </g>

            <!-- A球及其标签 -->
            <g id="scene1-group-A" class="scene1-transition" transform="translate(100, 0)">
                <circle cx="0" cy="230" r="10" fill="#c62828" />
                <text x="-10" y="205" fill="#c62828" text-anchor="end" class="scene1-math">m, +q</text>
                <text x="-10" y="255" fill="#c62828" text-anchor="end" class="scene1-math">A</text>
                
                <!-- A球速度箭头 -->
                <g id="scene1-vel-A" class="scene1-fade" opacity="0">
                    <line x1="0" y1="170" x2="40" y2="170" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrow-red)" id="scene1-vel-A-line" />
                    <text x="20" y="160" fill="#c62828" text-anchor="middle" class="scene1-math" id="scene1-vel-A-text">v<tspan class="scene1-sub" dy="4">1</tspan></text>
                </g>
            </g>

            <!-- B球及其标签 -->
            <g id="scene1-group-B" class="scene1-transition" transform="translate(200, 0)">
                <circle cx="0" cy="230" r="10" fill="#1565c0" />
                <text x="10" y="205" fill="#1565c0" text-anchor="start" class="scene1-math">m</text>
                <text x="10" y="255" fill="#1565c0" text-anchor="start" class="scene1-math">B</text>

                <!-- B球速度箭头 -->
                <g id="scene1-vel-B" class="scene1-fade" opacity="0">
                    <line x1="0" y1="130" x2="40" y2="130" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-blue)" id="scene1-vel-B-line" />
                    <text x="20" y="120" fill="#1565c0" text-anchor="middle" class="scene1-math" id="scene1-vel-B-text">v<tspan class="scene1-sub" dy="4">1</tspan></text>
                </g>
            </g>

        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <div id="scene1-step-text">初始状态</div>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 4;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepText = document.getElementById('scene1-step-text');

        const groupA = document.getElementById('scene1-group-A');
        const groupB = document.getElementById('scene1-group-B');
        
        const velA = document.getElementById('scene1-vel-A');
        const velALine = document.getElementById('scene1-vel-A-line');
        const velAText = document.getElementById('scene1-vel-A-text');
        
        const velB = document.getElementById('scene1-vel-B');
        const velBLine = document.getElementById('scene1-vel-B-line');
        const velBText = document.getElementById('scene1-vel-B-text');

        const dimL = document.getElementById('scene1-dim-L');
        const dim4L = document.getElementById('scene1-dim-4L');

        const steps = [
            {
                text: "初始状态",
                posA: 100, posB: 200,
                showL: 1, show4L: 0,
                velAOp: 0, velALen: 40, velALabel: 'v<tspan class="scene1-sub" dy="4">1</tspan>',
                velBOp: 0, velBLen: 40, velBLabel: 'v<tspan class="scene1-sub" dy="4">1</tspan>'
            },
            {
                text: "步骤 1/4：第一次碰撞前",
                posA: 180, posB: 200,
                showL: 1, show4L: 0,
                velAOp: 1, velALen: 40, velALabel: 'v<tspan class="scene1-sub" dy="4">1</tspan>',
                velBOp: 0, velBLen: 40, velBLabel: 'v<tspan class="scene1-sub" dy="4">1</tspan>'
            },
            {
                text: "步骤 2/4：第一次碰撞后",
                posA: 180, posB: 200,
                showL: 1, show4L: 0,
                velAOp: 0, velALen: 40, velALabel: 'v<tspan class="scene1-sub" dy="4">1</tspan>',
                velBOp: 1, velBLen: 40, velBLabel: 'v<tspan class="scene1-sub" dy="4">1</tspan>'
            },
            {
                text: "步骤 3/4：第二次碰撞前",
                posA: 580, posB: 600,
                showL: 1, show4L: 1,
                velAOp: 1, velALen: 80, velALabel: '2v<tspan class="scene1-sub" dy="4">1</tspan>',
                velBOp: 1, velBLen: 40, velBLabel: 'v<tspan class="scene1-sub" dy="4">1</tspan>'
            },
            {
                text: "步骤 4/4：第二次碰撞后",
                posA: 580, posB: 600,
                showL: 1, show4L: 1,
                velAOp: 1, velALen: 40, velALabel: 'v<tspan class="scene1-sub" dy="4">1</tspan>',
                velBOp: 1, velBLen: 80, velBLabel: '2v<tspan class="scene1-sub" dy="4">1</tspan>'
            }
        ];

        function updateScene() {
            const state = steps[currentStep];
            
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
            stepText.textContent = state.text;

            groupA.style.transform = `translate(${state.posA}px, 0)`;
            groupB.style.transform = `translate(${state.posB}px, 0)`;

            dimL.style.opacity = state.showL;
            dim4L.style.opacity = state.show4L;

            velA.style.opacity = state.velAOp;
            velALine.setAttribute('x2', state.velALen);
            velAText.setAttribute('x', state.velALen / 2);
            velAText.innerHTML = state.velALabel;

            velB.style.opacity = state.velBOp;
            velBLine.setAttribute('x2', state.velBLen);
            velBText.setAttribute('x', state.velBLen / 2);
            velBText.innerHTML = state.velBLabel;
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });

        // Initialize
        updateScene();
    })();
    </script>
</body>
</html>
