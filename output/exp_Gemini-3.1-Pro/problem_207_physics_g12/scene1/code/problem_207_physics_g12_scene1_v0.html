<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisualSolver Scene</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:hover { background: #e9e9e9; }
        button:disabled { cursor: not-allowed; opacity: 0.5; }
        .math { font-family: 'Times New Roman', Times, serif; font-style: italic; }
        .sub { font-size: 0.7em; vertical-align: sub; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <defs>
                <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828" />
                </marker>
                <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32" />
                </marker>
                <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0" />
                </marker>
                <pattern id="ground-hatch" width="10" height="10" patternUnits="userSpaceOnUse">
                    <path d="M 0 10 L 10 0" stroke="#000000" stroke-width="1" />
                </pattern>
            </defs>

            <!-- Ground -->
            <line x1="50" y1="400" x2="750" y2="400" stroke="#000000" stroke-width="2" />
            <rect x="50" y="400" width="700" height="10" fill="url(#ground-hatch)" />

            <!-- Incline -->
            <polygon points="80,120 400,360 400,400 80,400" fill="rgba(0,0,0,0.05)" stroke="#000000" stroke-width="2" />

            <!-- Board B -->
            <rect x="400" y="360" width="150" height="40" fill="rgba(0,0,0,0.1)" stroke="#000000" stroke-width="2" />
            <text x="475" y="385" font-size="18" text-anchor="middle" dominant-baseline="middle" font-family="Times New Roman" font-style="italic">B</text>

            <!-- Angle alpha -->
            <path d="M 360 360 A 40 40 0 0 1 368 336" fill="none" stroke="#888888" stroke-width="1.5" />
            <line x1="400" y1="360" x2="320" y2="360" stroke="#888888" stroke-width="1.5" stroke-dasharray="4,4" />
            <!-- Using MathJax for alpha -->
            <foreignObject x="315" y="330" width="60" height="30">
                <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 14px; text-align: center;">
                    \(\alpha=37^\circ\)
                </div>
            </foreignObject>

            <!-- Displacement s -->
            <line x1="140" y1="40" x2="460" y2="280" stroke="#888888" stroke-width="1.5" />
            <line x1="80" y1="120" x2="140" y2="40" stroke="#888888" stroke-width="1.5" stroke-dasharray="4,4" />
            <line x1="400" y1="360" x2="460" y2="280" stroke="#888888" stroke-width="1.5" stroke-dasharray="4,4" />
            <foreignObject x="260" y="135" width="60" height="30">
                <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 14px; text-align: center;">
                    \(s=9	ext{m}\)
                </div>
            </foreignObject>

            <!-- Trajectory -->
            <line id="scene1-trajectory" x1="121" y1="132" x2="121" y2="132" stroke="#1565c0" stroke-width="2" stroke-dasharray="4,4" opacity="0" />

            <!-- Block A Group -->
            <g id="scene1-blockA-group" transform="translate(121, 132) rotate(36.87)">
                <rect x="-15" y="-15" width="30" height="30" fill="#ffffff" stroke="#000000" stroke-width="2" />
                <text x="-25" y="25" font-size="18" text-anchor="middle" font-family="Times New Roman" font-style="italic" transform="rotate(-36.87)">A</text>
            </g>

            <!-- Forces -->
            <g id="scene1-forces" style="opacity: 0; display: none;">
                <!-- mg -->
                <line x1="121" y1="132" x2="121" y2="212" stroke="#c62828" stroke-width="2" marker-end="url(#arrow-red)" />
                <text x="135" y="202" font-size="16" fill="#c62828" font-family="Times New Roman" font-style="italic">mg</text>
                
                <!-- F_N -->
                <line x1="121" y1="132" x2="159.4" y2="80.8" stroke="#c62828" stroke-width="2" marker-end="url(#arrow-red)" />
                <text x="165" y="75" font-size="16" fill="#c62828" font-family="Times New Roman" font-style="italic">F<tspan class="sub" dy="2">N</tspan></text>
                
                <!-- f -->
                <line x1="121" y1="132" x2="95.4" y2="112.8" stroke="#c62828" stroke-width="2" marker-end="url(#arrow-red)" />
                <text x="85" y="105" font-size="16" fill="#c62828" font-family="Times New Roman" font-style="italic">f</text>
                
                <!-- a_1 -->
                <line x1="146" y1="152" x2="178" y2="176" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow-green)" />
                <text x="180" y="165" font-size="16" fill="#2e7d32" font-family="Times New Roman" font-style="italic">a<tspan class="sub" dy="2">1</tspan></text>
            </g>

            <!-- Final Velocity -->
            <g id="scene1-velocity" style="opacity: 0; display: none;">
                <line x1="393" y1="336" x2="441" y2="372" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-blue)" />
                <foreignObject x="440" y="380" width="80" height="30">
                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 14px; color: #1565c0;">
                        \(v_1=6	ext{m/s}\)
                    </div>
                </foreignObject>
            </g>

        </svg>
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    <script>
    (function() {
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const forces = document.getElementById('scene1-forces');
        const velocity = document.getElementById('scene1-velocity');
        const blockGroup = document.getElementById('scene1-blockA-group');
        const trajectory = document.getElementById('scene1-trajectory');
        
        let step = 0;
        let isAnimating = false;

        function show(el) {
            el.style.display = '';
            // trigger reflow
            void el.offsetWidth;
            el.style.opacity = '1';
        }

        function hide(el) {
            el.style.opacity = '0';
            setTimeout(() => {
                if (el.style.opacity === '0') {
                    el.style.display = 'none';
                }
            }, 500);
        }

        function updateScene() {
            if (step === 0) {
                btnPrev.disabled = true;
                btnNext.disabled = false;
                
                hide(forces);
                hide(velocity);
                trajectory.style.opacity = "0";
                
                blockGroup.setAttribute("transform", "translate(121, 132) rotate(36.87)");
            } else if (step === 1) {
                btnPrev.disabled = false;
                btnNext.disabled = false;
                
                show(forces);
                hide(velocity);
                trajectory.style.opacity = "0";
                
                blockGroup.setAttribute("transform", "translate(121, 132) rotate(36.87)");
            } else if (step === 2) {
                btnPrev.disabled = false;
                btnNext.disabled = true;
                
                hide(forces);
                
                isAnimating = true;
                btnPrev.disabled = true;
                
                trajectory.style.opacity = "1";
                
                let startX = 121, startY = 132;
                let endX = 393, endY = 336;
                let startTime = null;
                const duration = 1500;
                
                function animate(time) {
                    if (!startTime) startTime = time;
                    let progress = (time - startTime) / duration;
                    if (progress > 1) progress = 1;
                    
                    let easeProgress = progress * progress;
                    
                    let currentX = startX + (endX - startX) * easeProgress;
                    let currentY = startY + (endY - startY) * easeProgress;
                    
                    blockGroup.setAttribute("transform", `translate(${currentX}, ${currentY}) rotate(36.87)`);
                    trajectory.setAttribute("x2", currentX);
                    trajectory.setAttribute("y2", currentY);
                    
                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    } else {
                        isAnimating = false;
                        btnPrev.disabled = false;
                        show(velocity);
                    }
                }
                requestAnimationFrame(animate);
            }
        }

        btnPrev.addEventListener('click', () => {
            if (isAnimating) return;
            if (step > 0) {
                step--;
                updateScene();
            }
        });

        btnNext.addEventListener('click', () => {
            if (isAnimating) return;
            if (step < 2) {
                step++;
                updateScene();
            }
        });
        
        // Initialize transitions
        forces.style.transition = "opacity 0.5s";
        velocity.style.transition = "opacity 0.5s";
    })();
    </script>
</body>
</html>
