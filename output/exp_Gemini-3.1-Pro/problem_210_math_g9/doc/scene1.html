<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        .label { font-size: 14px; user-select: none; }
        .math-label { font-size: 14px; user-select: none; font-style: italic; font-family: "Times New Roman", Times, serif; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <defs>
                <clipPath id="scene1-square-clip">
                    <rect x="340" y="80" width="120" height="120" />
                </clipPath>
                <marker id="scene1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#000" />
                </marker>
                
                <!-- 静态几何图形定义 -->
                <line id="scene1-horizon-def" x1="150" y1="200" x2="650" y2="200" />
                <rect id="scene1-square-def" x="340" y="80" width="120" height="120" />
                <polygon id="scene1-triangle-def" points="0,0 120,0 60,-103.923" />
                
                <!-- 坐标系定义 -->
                <line id="scene1-axis-t-def" x1="250" y1="400" x2="680" y2="400" />
                <line id="scene1-axis-s-def" x1="250" y1="400" x2="250" y2="260" />
                
                <!-- 阶段分割线定义 -->
                <line id="scene1-grid-1-def" x1="350" y1="300" x2="350" y2="400" />
                <line id="scene1-grid-2-def" x1="450" y1="300" x2="450" y2="400" />
                <line id="scene1-grid-3-def" x1="550" y1="300" x2="550" y2="400" />
            </defs>
            
            <!-- 几何区背景 -->
            <use href="#scene1-horizon-def" stroke="#000" stroke-width="1.5" />
            <use href="#scene1-square-def" fill="none" stroke="#000" stroke-width="1.5" />
            
            <!-- 正方形顶点标签 -->
            <text x="330" y="220" class="math-label" text-anchor="middle">D</text>
            <text x="470" y="220" class="math-label" text-anchor="middle">E</text>
            <text x="480" y="55" class="math-label" text-anchor="start">F</text>
            <text x="320" y="55" class="math-label" text-anchor="end">G</text>
            
            <!-- 重叠区域 -->
            <use id="scene1-overlap" href="#scene1-triangle-def" x="220" y="200" fill="#1565c0" opacity="0.3" clip-path="url(#scene1-square-clip)" />
            
            <!-- 动态三角形 -->
            <use id="scene1-triangle" href="#scene1-triangle-def" x="220" y="200" fill="none" stroke="#000" stroke-width="1.5" />
            
            <!-- 三角形顶点标签 -->
            <text id="scene1-label-A" x="210" y="190" class="math-label" text-anchor="end">A</text>
            <text id="scene1-label-B" x="350" y="190" class="math-label" text-anchor="start">B</text>
            <text id="scene1-label-C" x="280" y="80" class="math-label" text-anchor="middle">C</text>
            
            <!-- 动态标注线 -->
            <g id="scene1-dimensions" opacity="0" style="display: none;">
                <!-- 底边标注 -->
                <line id="scene1-dim-base" x1="340" y1="230" x2="340" y2="230" stroke="#c62828" stroke-width="1.5" />
                <line x1="340" y1="225" x2="340" y2="235" stroke="#c62828" stroke-width="1.5" />
                <line id="scene1-dim-base-end" x1="340" y1="225" x2="340" y2="235" stroke="#c62828" stroke-width="1.5" />
                <text id="scene1-label-t" x="340" y="248" class="math-label" fill="#c62828" text-anchor="middle">t</text>
                
                <!-- 高度标注 -->
                <line id="scene1-dim-height" x1="325" y1="200" x2="325" y2="200" stroke="#c62828" stroke-width="1.5" />
                <line x1="320" y1="200" x2="330" y2="200" stroke="#c62828" stroke-width="1.5" />
                <line id="scene1-dim-height-end" x1="320" y1="200" x2="330" y2="200" stroke="#c62828" stroke-width="1.5" />
                <text id="scene1-label-ht" x="315" y="200" class="math-label" fill="#c62828" text-anchor="end" dominant-baseline="middle">√3t</text>
            </g>
            
            <!-- 坐标系 -->
            <use href="#scene1-axis-t-def" stroke="#000" stroke-width="1.5" marker-end="url(#scene1-arrow)" />
            <use href="#scene1-axis-s-def" stroke="#000" stroke-width="1.5" marker-end="url(#scene1-arrow)" />
            <text x="680" y="425" class="math-label" text-anchor="middle">t</text>
            <text x="235" y="265" class="math-label" text-anchor="end">S</text>
            <text x="235" y="425" class="math-label" text-anchor="end">O</text>
            
            <!-- 刻度 -->
            <line x1="350" y1="400" x2="350" y2="405" stroke="#000" stroke-width="1.5" />
            <text x="350" y="425" class="label" text-anchor="middle">0.5</text>
            <line x1="450" y1="400" x2="450" y2="405" stroke="#000" stroke-width="1.5" />
            <text x="450" y="425" class="label" text-anchor="middle">1</text>
            <line x1="550" y1="400" x2="550" y2="405" stroke="#000" stroke-width="1.5" />
            <text x="550" y="425" class="label" text-anchor="middle">1.5</text>
            <line x1="650" y1="400" x2="650" y2="405" stroke="#000" stroke-width="1.5" />
            <text x="650" y="425" class="label" text-anchor="middle">2</text>
            
            <line x1="245" y1="300" x2="250" y2="300" stroke="#000" stroke-width="1.5" />
            <text x="240" y="305" class="label" text-anchor="end">√3/4</text>
            
            <!-- 阶段分割线 -->
            <use href="#scene1-grid-1-def" stroke="#888" stroke-width="1" stroke-dasharray="4,4" />
            <use href="#scene1-grid-2-def" stroke="#888" stroke-width="1" stroke-dasharray="4,4" />
            <use href="#scene1-grid-3-def" stroke="#888" stroke-width="1" stroke-dasharray="4,4" />
            
            <!-- S-t 曲线 -->
            <path id="scene1-curve" d="M 250 400" fill="none" stroke="#1565c0" stroke-width="2.5" />
            <circle id="scene1-dot" cx="250" cy="400" r="4" fill="#c62828" />
            
        </svg>
        
        <div id="scene1-controls">
            <span class="math-label">t = <span id="scene1-t-val">0.00</span></span>
            <input type="range" id="scene1-slider" min="0" max="2" step="0.01" value="0" style="width: 300px;">
        </div>
    </div>
    <script>
    (function() {
        const slider = document.getElementById('scene1-slider');
        const tVal = document.getElementById('scene1-t-val');
        const triangle = document.getElementById('scene1-triangle');
        const overlap = document.getElementById('scene1-overlap');
        const labelA = document.getElementById('scene1-label-A');
        const labelB = document.getElementById('scene1-label-B');
        const labelC = document.getElementById('scene1-label-C');
        const curve = document.getElementById('scene1-curve');
        const dot = document.getElementById('scene1-dot');
        
        const dimensions = document.getElementById('scene1-dimensions');
        const dimBase = document.getElementById('scene1-dim-base');
        const dimBaseEnd = document.getElementById('scene1-dim-base-end');
        const labelT = document.getElementById('scene1-label-t');
        const dimHeight = document.getElementById('scene1-dim-height');
        const dimHeightEnd = document.getElementById('scene1-dim-height-end');
        const labelHt = document.getElementById('scene1-label-ht');
        
        function updateScene() {
            const t = parseFloat(slider.value);
            tVal.textContent = t.toFixed(2);
            
            // 1. 更新三角形位置
            const offset = 120 * t;
            const startX = 220 + offset;
            
            triangle.setAttribute('x', startX);
            overlap.setAttribute('x', startX);
            
            labelA.setAttribute('x', startX - 10);
            labelB.setAttribute('x', startX + 130);
            labelC.setAttribute('x', startX + 60);
            
            // 2. 更新标注线 (0 < t <= 0.5)
            if (t > 0 && t <= 0.5) {
                dimensions.style.opacity = 1;
                dimensions.style.display = 'block';
                
                const baseX = 340 + offset;
                dimBase.setAttribute('x2', baseX);
                dimBaseEnd.setAttribute('x1', baseX);
                dimBaseEnd.setAttribute('x2', baseX);
                labelT.setAttribute('x', 340 + offset / 2);
                
                const h = 207.846 * t;
                const topY = 200 - h;
                dimHeight.setAttribute('y2', topY);
                dimHeightEnd.setAttribute('y1', topY);
                dimHeightEnd.setAttribute('y2', topY);
                labelHt.setAttribute('y', 200 - h / 2);
            } else {
                dimensions.style.opacity = 0;
                dimensions.style.display = 'none';
            }
            
            // 3. 更新曲线
            let d = 'M 250 400';
            const steps = Math.floor(t / 0.02);
            for (let i = 1; i <= steps; i++) {
                const currT = i * 0.02;
                let S = 0;
                if (currT <= 0.5) {
                    S = (Math.sqrt(3)/2) * currT * currT;
                } else if (currT <= 1.5) {
                    S = Math.sqrt(3)/4 - (Math.sqrt(3)/2) * (currT - 1) * (currT - 1);
                } else {
                    S = (Math.sqrt(3)/2) * (2 - currT) * (2 - currT);
                }
                const px = 250 + currT * 200;
                const py = 400 - S * 230.94;
                d += ` L ${px} ${py}`;
            }
            
            // 添加当前精确点
            let currentS = 0;
            if (t <= 0.5) {
                currentS = (Math.sqrt(3)/2) * t * t;
            } else if (t <= 1.5) {
                currentS = Math.sqrt(3)/4 - (Math.sqrt(3)/2) * (t - 1) * (t - 1);
            } else {
                currentS = (Math.sqrt(3)/2) * (2 - t) * (2 - t);
            }
            const currentPx = 250 + t * 200;
            const currentPy = 400 - currentS * 230.94;
            if (t > 0) {
                d += ` L ${currentPx} ${currentPy}`;
            }
            
            curve.setAttribute('d', d);
            dot.setAttribute('cx', currentPx);
            dot.setAttribute('cy', currentPy);
        }
        
        slider.addEventListener('input', updateScene);
        updateScene();
    })();
    </script>
</body>
</html>
