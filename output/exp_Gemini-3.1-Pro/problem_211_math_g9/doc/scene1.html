        <div id="scene1-desc">本题探讨全等三角形的判定条件。请点击「下一步」开始推导。</div>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator" class="step-indicator">0 / 5</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 5;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        const desc = document.getElementById('scene1-desc');

        const elements = {
            step1: ['scene1-hl-ab', 'scene1-hl-cd', 'scene1-marker-para', 'scene1-marker-eq', 'scene1-angle-abe', 'scene1-angle-cdf'],
            step2: ['scene1-hl-be', 'scene1-hl-fd'],
            step3: ['scene1-hl-bf', 'scene1-hl-de'],
            step4: ['scene1-angle-1', 'scene1-angle-2'],
            step5: ['scene1-hl-ae', 'scene1-hl-cf', 'scene1-hl-ae-dash', 'scene1-arc-e', 'scene1-tri-abe', 'scene1-tri-abe-dash', 'scene1-label-e-dash']
        };

        const descriptions = [
            "本题探讨全等三角形的判定条件。请点击「下一步」开始推导。",
            "已知条件：AB=CD (边S)，且 AB∥CD 推出内错角 ∠ABE=∠CDF (角A)。",
            "选项B：添加 BE=FD，结合已知条件构成 SAS（边角边），判定 △ABE ≌ △CDF 成立。",
            "选项C：添加 BF=DE，两边同时减去 EF 得到 BE=FD，同样构成 SAS，判定成立。",
            "选项D：添加 ∠1=∠2，结合已知条件构成 ASA（角边角），判定成立。",
            "选项A：添加 AE=CF，构成 SSA（边边角）。如图，AE=AE'，存在两种可能的三角形，无法唯一判定全等。"
        ];

        function show(id) {
            const el = document.getElementById(id);
            if (el) el.style.opacity = '1';
        }

        function hide(id) {
            const el = document.getElementById(id);
            if (el) el.style.opacity = '0';
        }

        function updateState() {
            stepIndicator.textContent = `${currentStep} / ${maxStep}`;
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
            desc.innerHTML = descriptions[currentStep];

            // Hide all step elements first
            Object.values(elements).flat().forEach(hide);

            // Show elements based on current step
            if (currentStep >= 1) {
                elements.step1.forEach(show);
            }
            if (currentStep === 2) {
                elements.step2.forEach(show);
            }
            if (currentStep === 3) {
                elements.step3.forEach(show);
            }
            if (currentStep === 4) {
                elements.step4.forEach(show);
            }
            if (currentStep === 5) {
                elements.step5.forEach(show);
            }
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateState();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateState();
            }
        });

        // Initialize
        updateState();
    })();
    </script>
