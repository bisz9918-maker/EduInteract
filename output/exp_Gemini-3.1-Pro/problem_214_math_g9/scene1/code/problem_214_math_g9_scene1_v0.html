<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-svg { position: absolute; top: 0; left: 0; width: 800px; height: 500px; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; z-index: 10; }
        #scene1-formula { height: 40px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .scene1-btn-group { display: flex; gap: 12px; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .scene1-element { transition: all 0.3s ease; }
        
        /* Text styles */
        text { font-family: 'Times New Roman', serif; font-size: 20px; font-style: italic; user-select: none; }
        .scene1-label-val { font-family: sans-serif; font-style: normal; font-size: 16px; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <defs>
                <!-- Background highlight polygon defined in defs to avoid overlap detection with text -->
                <polygon id="poly-abc" points="400,110 115,310 685,310" />
            </defs>
            
            <!-- Background highlight -->
            <use id="scene1-bg-abc" href="#poly-abc" fill="#fff59d" opacity="0" class="scene1-element" />
            
            <!-- Angles -->
            <!-- BAC arc (radius 90) -->
            <path id="scene1-arc-bac" d="M 326.33 161.7 A 90 90 0 0 0 473.67 161.7" fill="none" stroke="#2e7d32" stroke-width="2" class="scene1-element" />
            
            <!-- C and B arcs (radius 35) -->
            <path id="scene1-arc-c" d="M 115 310 L 150 310 A 35 35 0 0 0 143.65 289.90 Z" fill="#1565c0" opacity="0" class="scene1-element" />
            <path id="scene1-arc-b" d="M 685 310 L 656.35 289.90 A 35 35 0 0 0 650 310 Z" fill="#c62828" opacity="0" class="scene1-element" />
            
            <!-- EAC, EAF, FAB arcs (radius 60) -->
            <path id="scene1-arc-eac" d="M 400 110 L 350.89 144.46 A 60 60 0 0 0 379.6 166.4 Z" fill="#1565c0" opacity="0" class="scene1-element" />
            <path id="scene1-arc-eaf" d="M 400 110 L 379.6 166.4 A 60 60 0 0 0 420.4 166.4 Z" fill="#2e7d32" opacity="0" class="scene1-element" />
            <path id="scene1-arc-fab" d="M 400 110 L 420.4 166.4 A 60 60 0 0 0 449.11 144.46 Z" fill="#c62828" opacity="0" class="scene1-element" />
            
            <!-- Lines -->
            <line id="scene1-line-ac" x1="400" y1="110" x2="115" y2="310" stroke="#000" stroke-width="2" class="scene1-element" />
            <line id="scene1-line-ab" x1="400" y1="110" x2="685" y2="310" stroke="#000" stroke-width="2" class="scene1-element" />
            <line id="scene1-line-bc" x1="115" y1="310" x2="685" y2="310" stroke="#000" stroke-width="2" class="scene1-element" />
            
            <!-- Highlight lines for CE and BF -->
            <line id="scene1-line-ce" x1="115" y1="310" x2="327.7" y2="310" stroke="#1565c0" stroke-width="3" opacity="0" class="scene1-element" />
            <line id="scene1-line-bf" x1="685" y1="310" x2="472.3" y2="310" stroke="#c62828" stroke-width="3" opacity="0" class="scene1-element" />
            
            <!-- GE, HF -->
            <line id="scene1-line-ge" x1="257.5" y1="210" x2="327.7" y2="310" stroke="#000" stroke-width="2" class="scene1-element" />
            <line id="scene1-line-hf" x1="542.5" y1="210" x2="472.3" y2="310" stroke="#000" stroke-width="2" class="scene1-element" />
            
            <!-- AE, AF -->
            <line id="scene1-line-ae" x1="400" y1="110" x2="327.7" y2="310" stroke="#000" stroke-width="2" class="scene1-element" />
            <line id="scene1-line-af" x1="400" y1="110" x2="472.3" y2="310" stroke="#000" stroke-width="2" class="scene1-element" />
            
            <!-- Right angle marks -->
            <path id="scene1-mark-g" d="M 265.9 204.3 L 271.6 212.5 L 263.4 218.2" fill="none" stroke="#1565c0" stroke-width="2" opacity="0" class="scene1-element" />
            <path id="scene1-mark-h" d="M 534.1 204.3 L 528.4 212.5 L 536.6 218.2" fill="none" stroke="#c62828" stroke-width="2" opacity="0" class="scene1-element" />
            
            <!-- Tick marks -->
            <!-- AG, GC -->
            <line x1="325.9" y1="155.9" x2="331.6" y2="164.1" stroke="#000" stroke-width="2" />
            <line x1="183.4" y1="255.9" x2="189.1" y2="264.1" stroke="#000" stroke-width="2" />
            <!-- AH, HB (double ticks) -->
            <line x1="472.5" y1="154.8" x2="466.8" y2="162.9" stroke="#000" stroke-width="2" />
            <line x1="475.7" y1="157.1" x2="470.0" y2="165.2" stroke="#000" stroke-width="2" />
            <line x1="615.0" y1="254.8" x2="609.3" y2="262.9" stroke="#000" stroke-width="2" />
            <line x1="618.2" y1="257.1" x2="612.5" y2="265.2" stroke="#000" stroke-width="2" />
            
            <!-- AE, CE ticks (blue) -->
            <g id="scene1-ticks-ae-ce" opacity="0" class="scene1-element">
                <line x1="359.1" y1="208.3" x2="368.6" y2="211.7" stroke="#1565c0" stroke-width="2" />
                <line x1="221.35" y1="305" x2="221.35" y2="315" stroke="#1565c0" stroke-width="2" />
            </g>
            
            <!-- AF, BF ticks (red) -->
            <g id="scene1-ticks-af-bf" opacity="0" class="scene1-element">
                <line x1="440.9" y1="208.3" x2="431.4" y2="211.7" stroke="#c62828" stroke-width="2" />
                <line x1="578.65" y1="305" x2="578.65" y2="315" stroke="#c62828" stroke-width="2" />
            </g>
            
            <!-- Labels -->
            <text x="400" y="95" text-anchor="middle">A</text>
            <text x="95" y="315" text-anchor="end">C</text>
            <text x="705" y="315" text-anchor="start">B</text>
            <!-- Move G and H further away from lines -->
            <text x="235" y="190" text-anchor="end">G</text>
            <text x="565" y="190" text-anchor="start">H</text>
            <text x="328" y="335" text-anchor="middle">E</text>
            <text x="472" y="335" text-anchor="middle">F</text>
            
            <!-- Angle values -->
            <!-- Move 110° further down -->
            <text id="scene1-label-110" x="400" y="185" text-anchor="middle" fill="#2e7d32" class="scene1-label-val scene1-element">110°</text>
            <!-- Move 40° further down -->
            <text id="scene1-label-40" x="400" y="145" text-anchor="middle" fill="#2e7d32" opacity="0" class="scene1-label-val scene1-element" style="text-shadow: 1px 1px 2px white, -1px -1px 2px white, 1px -1px 2px white, -1px 1px 2px white;">40°</text>
        </svg>
        
        <div id="scene1-controls">
            <div id="scene1-formula"></div>
            <div class="scene1-btn-group">
                <button id="scene1-btn-prev" disabled>◀ 上一步</button>
                <button id="scene1-btn-next">下一步 ▶</button>
            </div>
        </div>
    </div>
    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 6;
        
        const formulas = [
            '已知 $\angle BAC = 110^\circ$',
            '$ecause GE 	ext{ 垂直平分 } AC \quad 	herefore EA = EC$',
            '$	herefore \angle EAC = \angle C$',
            '$ecause HF 	ext{ 垂直平分 } AB \quad 	herefore FA = FB$',
            '$	herefore \angle FAB = \angle B$',
            '$\angle C + \angle B = 180^\circ - 110^\circ = 70^\circ \Rightarrow \angle EAC + \angle FAB = 70^\circ$',
            '$\angle EAF = \angle BAC - (\angle EAC + \angle FAB) = 110^\circ - 70^\circ = 40^\circ$'
        ];
        
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const formulaDiv = document.getElementById('scene1-formula');
        
        function updateScene() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
            
            formulaDiv.innerHTML = formulas[currentStep];
            if (window.MathJax) {
                MathJax.typesetPromise([formulaDiv]);
            }
            
            // Helper to set visibility
            const setVis = (id, visible, color, width) => {
                const el = document.getElementById(id);
                if (!el) return;
                el.style.opacity = visible ? '1' : '0';
                if (color) el.setAttribute('stroke', color);
                if (width) el.setAttribute('stroke-width', width);
            };
            const setFillVis = (id, visible, opacity = 0.2) => {
                const el = document.getElementById(id);
                if (!el) return;
                el.style.opacity = visible ? opacity : '0';
            };
            
            // Step 1: Blue highlight GE, AE, CE, mark G, ticks AE, CE
            const step1 = currentStep >= 1;
            setVis('scene1-line-ge', true, step1 ? '#1565c0' : '#000', step1 ? '3' : '2');
            setVis('scene1-line-ae', true, step1 ? '#1565c0' : '#000', step1 ? '3' : '2');
            setVis('scene1-line-ce', step1);
            setVis('scene1-mark-g', step1);
            setVis('scene1-ticks-ae-ce', step1);
            
            // Step 2: Blue arcs C, EAC
            const step2 = currentStep >= 2;
            setFillVis('scene1-arc-c', step2);
            setFillVis('scene1-arc-eac', step2);
            
            // Step 3: Red highlight HF, AF, BF, mark H, ticks AF, BF
            const step3 = currentStep >= 3;
            setVis('scene1-line-hf', true, step3 ? '#c62828' : '#000', step3 ? '3' : '2');
            setVis('scene1-line-af', true, step3 ? '#c62828' : '#000', step3 ? '3' : '2');
            setVis('scene1-line-bf', step3);
            setVis('scene1-mark-h', step3);
            setVis('scene1-ticks-af-bf', step3);
            
            // Step 4: Red arcs B, FAB
            const step4 = currentStep >= 4;
            setFillVis('scene1-arc-b', step4);
            setFillVis('scene1-arc-fab', step4);
            
            // Step 5: Highlight ABC
            const step5 = currentStep >= 5;
            setFillVis('scene1-bg-abc', step5, 0.3);
            
            // Step 6: Green arc EAF, 40 label
            const step6 = currentStep >= 6;
            setFillVis('scene1-arc-eaf', step6);
            setVis('scene1-label-40', step6);
            
            // Hide 110 label when 40 label is shown to prevent overlap
            setVis('scene1-label-110', !step6);
        }
        
        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });
        
        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });
        
        // Initial render
        updateScene();
    })();
    </script>
</body>
</html>
