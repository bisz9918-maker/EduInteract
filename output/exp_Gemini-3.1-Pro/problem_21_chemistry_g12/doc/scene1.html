<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .step-element { transition: opacity 0.3s; opacity: 0; pointer-events: none; }
        .step-element.active { opacity: 1; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="red" />
                </marker>
                <radialGradient id="red-halo" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="red" stop-opacity="0.6" />
                    <stop offset="100%" stop-color="red" stop-opacity="0" />
                </radialGradient>
            </defs>
            
            <!-- Base Elements -->
            <g id="scene1-base">
                <!-- Beaker -->
                <path d="M 140 200 L 150 200 L 150 350 C 150 360, 160 360, 160 360 L 290 360 C 290 360, 300 360, 300 350 L 300 200 L 310 200" fill="none" stroke="black" stroke-width="2" />
                <!-- Liquid -->
                <rect x="151" y="250" width="148" height="109" fill="#87CEEB" fill-opacity="0.3" />
                <path d="M 151 250 Q 188 245, 225 250 T 299 250" fill="none" stroke="#87CEEB" stroke-width="1" />
                
                <!-- Filter Paper -->
                <ellipse cx="530" cy="280" rx="130" ry="65" fill="#87CEEB" fill-opacity="0.1" stroke="black" stroke-width="1" />
                
                <!-- Electrodes -->
                <!-- Zinc -->
                <rect x="180" y="120" width="20" height="200" fill="#cccccc" stroke="black" stroke-width="1" />
                <!-- Copper -->
                <rect x="250" y="120" width="20" height="200" fill="#b87333" fill-opacity="0.8" stroke="black" stroke-width="1" />
                
                <!-- Graphite a -->
                <polygon points="460,120 480,120 480,260 470,280 460,260" fill="#666666" stroke="black" stroke-width="1" />
                <!-- Graphite b -->
                <polygon points="580,120 600,120 600,260 590,280 580,260" fill="#666666" stroke="black" stroke-width="1" />
                
                <!-- Wires -->
                <polyline points="190,120 190,60 590,60 590,120" fill="none" stroke="black" stroke-width="2" />
                <polyline points="260,120 260,90 470,90 470,120" fill="none" stroke="black" stroke-width="2" />
                
                <!-- Base Labels -->
                <text x="170" y="160" font-size="16" text-anchor="end" fill="black">锌</text>
                <text x="280" y="160" font-size="16" text-anchor="start" fill="black">铜</text>
                <text x="450" y="160" font-size="16" text-anchor="end" fill="black">a</text>
                <text x="610" y="160" font-size="16" text-anchor="start" fill="black">b</text>
                
                <text x="330" y="340" font-size="16" fill="black">稀硫酸</text>
                <line x1="280" y1="320" x2="325" y2="335" stroke="black" stroke-width="1" />
                
                <text x="760" y="340" font-size="16" fill="black" text-anchor="end">饱和食盐水滤纸</text>
                <line x1="580" y1="310" x2="660" y2="335" stroke="black" stroke-width="1" />
            </g>
            
            <!-- Step 1: Device Types -->
            <g id="scene1-step1" class="step-element">
                <line x1="375" y1="40" x2="375" y2="420" stroke="gray" stroke-width="2" stroke-dasharray="5,5" />
                <text x="225" y="390" font-size="18" font-weight="bold" fill="#0066cc" text-anchor="middle">原电池</text>
                <text x="530" y="390" font-size="18" font-weight="bold" fill="#0066cc" text-anchor="middle">电解池</text>
            </g>
            
            <!-- Step 2: Electrodes -->
            <g id="scene1-step2" class="step-element">
                <text x="160" y="100" font-size="16" font-weight="bold" fill="#0066cc" text-anchor="end">负极</text>
                <text x="290" y="100" font-size="16" font-weight="bold" fill="#0066cc" text-anchor="start">正极</text>
                <text x="440" y="100" font-size="16" font-weight="bold" fill="#0066cc" text-anchor="end">阳极</text>
                <text x="620" y="100" font-size="16" font-weight="bold" fill="#0066cc" text-anchor="start">阴极</text>
            </g>
            
            <!-- Step 3: Electron Flow -->
            <g id="scene1-step3" class="step-element">
                <!-- Top wire e- flow (Zn to b) -->
                <line x1="370" y1="40" x2="410" y2="40" stroke="red" stroke-width="2" marker-end="url(#arrow)" />
                <text x="390" y="30" font-size="16" font-weight="bold" fill="red" text-anchor="middle">e⁻</text>
                
                <!-- Bottom wire e- flow (a to Cu) -->
                <line x1="380" y1="110" x2="340" y2="110" stroke="red" stroke-width="2" marker-end="url(#arrow)" />
                <text x="360" y="125" font-size="16" font-weight="bold" fill="red" text-anchor="middle">e⁻</text>
                
                <!-- No electron flow in solution -->
                <g transform="translate(225, 220)">
                    <line x1="-10" y1="-10" x2="10" y2="10" stroke="red" stroke-width="3" />
                    <line x1="-10" y1="10" x2="10" y2="-10" stroke="red" stroke-width="3" />
                    <text x="0" y="25" font-size="14" fill="red" text-anchor="middle">无电子通过</text>
                </g>
                <g transform="translate(530, 190)">
                    <line x1="-10" y1="-10" x2="10" y2="10" stroke="red" stroke-width="3" />
                    <line x1="-10" y1="10" x2="10" y2="-10" stroke="red" stroke-width="3" />
                    <text x="0" y="25" font-size="14" fill="red" text-anchor="middle">无电子通过</text>
                </g>
            </g>
            
            <!-- Step 4: Reactions and Phenomena -->
            <g id="scene1-step4" class="step-element">
                <!-- Red halo at b -->
                <circle cx="590" cy="280" r="40" fill="url(#red-halo)" />
                <text x="590" y="370" font-size="16" font-weight="bold" fill="red" text-anchor="middle">变红</text>
                
                <!-- Bubbles -->
                <!-- Cu -->
                <circle cx="280" cy="240" r="3" fill="none" stroke="green" />
                <circle cx="275" cy="230" r="4" fill="none" stroke="green" />
                <circle cx="285" cy="220" r="3" fill="none" stroke="green" />
                <text x="280" y="210" font-size="14" fill="green" text-anchor="middle">H₂↑</text>
                
                <!-- a -->
                <circle cx="440" cy="240" r="3" fill="none" stroke="green" />
                <circle cx="435" cy="230" r="4" fill="none" stroke="green" />
                <circle cx="445" cy="220" r="3" fill="none" stroke="green" />
                <text x="440" y="210" font-size="14" fill="green" text-anchor="middle">Cl₂↑</text>
                
                <!-- b -->
                <circle cx="620" cy="240" r="3" fill="none" stroke="green" />
                <circle cx="615" cy="230" r="4" fill="none" stroke="green" />
                <circle cx="625" cy="220" r="3" fill="none" stroke="green" />
                <text x="620" y="210" font-size="14" fill="green" text-anchor="middle">H₂↑</text>
                
                <!-- Reactions -->
                <text x="225" y="440" font-size="16" font-weight="bold" fill="red" text-anchor="middle">2H⁺ + 2e⁻ = H₂↑</text>
                <text x="470" y="440" font-size="16" font-weight="bold" fill="red" text-anchor="middle">2Cl⁻ - 2e⁻ = Cl₂↑</text>
                <text x="650" y="470" font-size="16" font-weight="bold" fill="red" text-anchor="middle">2H₂O + 2e⁻ = H₂↑ + 2OH⁻</text>
            </g>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
            <button id="scene1-btn-reset">↺ 重置</button>
        </div>
    </div>
    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 4;
        
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const btnReset = document.getElementById('scene1-btn-reset');
        
        function updateSteps() {
            for (let i = 1; i <= maxStep; i++) {
                const el = document.getElementById(`scene1-step${i}`);
                if (i <= currentStep) {
                    el.classList.add('active');
                } else {
                    el.classList.remove('active');
                }
            }
            
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
        }
        
        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateSteps();
            }
        });
        
        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateSteps();
            }
        });
        
        btnReset.addEventListener('click', () => {
            currentStep = 0;
            updateSteps();
        });
        
        updateSteps();
    })();
    </script>
</body>
</html>
