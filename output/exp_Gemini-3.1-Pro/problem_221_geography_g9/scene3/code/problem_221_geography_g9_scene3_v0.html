<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 3</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button:hover:not(:disabled) { background: #e9e9e9; }
        
        .scene3-element { transition: opacity 0.5s ease; }
        
        #scene3-explanation {
            position: absolute;
            top: 20px;
            left: 450px;
            width: 330px;
            height: 200px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            box-sizing: border-box;
            font-size: 14px;
            line-height: 1.6;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg width="800" height="500" id="scene3-svg">
            <defs>
                <marker id="scene3-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828" />
                </marker>
            </defs>

            <!-- Step 0: 基础结构 -->
            <g id="scene3-step0" class="scene3-element">
                <!-- 地面 -->
                <line x1="150" y1="400" x2="750" y2="400" stroke="#000000" stroke-width="4" />
                <text x="650" y="420" font-size="14px" fill="#000000">地面</text>
                
                <!-- 外墙 -->
                <line x1="200" y1="100" x2="200" y2="400" stroke="#000000" stroke-width="4" />
                <text x="120" y="200" font-size="14px" fill="#000000">建筑物外墙</text>
                
                <!-- O点 -->
                <text x="185" y="415" font-size="14px" fill="#000000">O</text>
                
                <!-- 直角O -->
                <polyline points="200,385 215,385 215,400" fill="none" stroke="#000000" stroke-width="1.5" />
            </g>

            <!-- Step 1: 光线1与太阳高度角 -->
            <g id="scene3-step1" class="scene3-element" style="opacity: 0; display: none;">
                <!-- 光线1 -->
                <line x1="691" y1="140" x2="591" y2="400" stroke="#c62828" stroke-width="2" marker-end="url(#scene3-arrow-red)" />
                <text x="660" y="130" font-size="14px" fill="#c62828">太阳光线</text>
                
                <!-- H角弧 (E点 591,400, 半径40, 角度 0 到 -69度) -->
                <!-- 69度弧度 = 69 * PI / 180 = 1.204 -->
                <!-- x = 591 + 40 * cos(-69) = 591 + 40 * 0.358 = 605.3 -->
                <!-- y = 400 + 40 * sin(-69) = 400 - 40 * 0.933 = 362.7 -->
                <path d="M 631 400 A 40 40 0 0 0 605.3 362.7 L 591 400 Z" fill="#c62828" fill-opacity="0.2" stroke="#c62828" stroke-width="1" />
                <text x="680" y="340" font-size="14px" fill="#c62828">H=69°</text>
            </g>

            <!-- Step 2: 电池板与垂直光线 -->
            <g id="scene3-step2" class="scene3-element" style="opacity: 0; display: none;">
                <!-- 电池板 W(200,250) - P(340,304) -->
                <line x1="200" y1="250" x2="340" y2="304" stroke="#1565c0" stroke-width="6" />
                <text x="290" y="65" font-size="14px" fill="#1565c0">太阳能电池板</text>
                
                <!-- W点 -->
                <text x="180" y="240" font-size="14px" fill="#1565c0">W</text>
                
                <!-- 光线2 (垂直射向电池板中点C) -->
                <!-- 中点C = (270, 277) -->
                <!-- 电池板斜率 = (304-250)/(340-200) = 54/140 = 0.3857 (约21度) -->
                <!-- 垂直斜率 = -1/0.3857 = -2.59 -->
                <!-- 光线2起点 (350, 68.6) -->
                <line x1="350" y1="68.6" x2="270" y2="277" stroke="#c62828" stroke-width="2" marker-end="url(#scene3-arrow-red)" />
                
                <!-- 直角C -->
                <!-- C(270,277), 沿电池板方向向量 (140,54) -> 单位向量 (0.933, 0.36) -->
                <!-- 沿光线反方向向量 (80, -208.4) -> 单位向量 (0.358, -0.933) -->
                <!-- 边长15: 沿电池板 (14, 5.4), 沿光线反向 (5.4, -14) -->
                <!-- 点1: C + 沿电池板 = (284, 282.4) -->
                <!-- 点2: C + 沿电池板 + 沿光线反向 = (289.4, 268.4) -->
                <!-- 点3: C + 沿光线反向 = (275.4, 263) -->
                <polyline points="284,282.4 289.4,268.4 275.4,263" fill="none" stroke="#000000" stroke-width="1.5" />
            </g>

            <!-- Step 3: 几何推导 -->
            <g id="scene3-step3" class="scene3-element" style="opacity: 0; display: none;">
                <!-- 延长线 P(340,304) - E(591,400) -->
                <line x1="340" y1="304" x2="591" y2="400" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" />
                
                <!-- E点 -->
                <text x="600" y="420" font-size="14px" fill="#000000">E</text>
                
                <!-- α角弧 (W点 200,250, 半径40, 角度 21 到 90度) -->
                <!-- 21度: x = 200 + 40*cos(21) = 237.3, y = 250 + 40*sin(21) = 264.3 -->
                <!-- 90度: x = 200, y = 290 -->
                <path d="M 237.3 264.3 A 40 40 0 0 1 200 290 L 200 250 Z" fill="#1565c0" fill-opacity="0.2" stroke="#1565c0" stroke-width="1" />
                <text x="225" y="320" font-size="14px" fill="#1565c0">α=69°</text>
                
                <!-- β角弧 (E点 591,400, 半径30, 角度 180 到 201度) -->
                <!-- 180度: x = 561, y = 400 -->
                <!-- 201度: x = 591 - 30*cos(21) = 563, y = 400 - 30*sin(21) = 389.2 -->
                <path d="M 561 400 A 30 30 0 0 1 563 389.2 L 591 400 Z" fill="#888888" fill-opacity="0.2" stroke="#888888" stroke-width="1" />
                <text x="535" y="305" font-size="14px" fill="#888888">β</text>
                
                <!-- 直角E (光线1与延长线交角) -->
                <!-- E(591,400) -->
                <!-- 沿延长线反向向量 (-251, -96) -> 单位向量 (-0.933, -0.358) -->
                <!-- 沿光线1反向向量 (100, -260) -> 单位向量 (0.358, -0.933) -->
                <!-- 边长15: 沿延长线反向 (-14, -5.4), 沿光线1反向 (5.4, -14) -->
                <!-- 点1: E + 沿延长线反向 = (577, 394.6) -->
                <!-- 点2: E + 沿延长线反向 + 沿光线1反向 = (582.4, 380.6) -->
                <!-- 点3: E + 沿光线1反向 = (596.4, 386) -->
                <polyline points="577,394.6 582.4,380.6 596.4,386" fill="none" stroke="#000000" stroke-width="1.5" />
            </g>
        </svg>

        <div id="scene3-explanation"></div>

        <div id="scene3-controls">
            <button id="scene3-btn-prev" disabled>◀ 上一步</button>
            <button id="scene3-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 3;
        
        const btnPrev = document.getElementById('scene3-btn-prev');
        const btnNext = document.getElementById('scene3-btn-next');
        const explanation = document.getElementById('scene3-explanation');
        
        const explanations = [
            "<b>初始状态</b><br><br>如图所示，建筑物外墙与地面垂直相交于O点。<br>我们需要确定太阳能电池板与外墙的最合适夹角。",
            "<b>第一步：计算正午太阳高度角 H</b><br><br>该日太阳直射点纬度为 10°N。<br>上海纬度为 31°N。<br>正午太阳高度角公式：<br>$$H = 90^\circ - |31^\circ - 10^\circ| = 69^\circ$$",
            "<b>第二步：太阳能电池板安装要求</b><br><br>为了获得最大的太阳辐射能，太阳能电池板应与正午太阳光线<b>垂直</b>。<br>即光线与电池板的交角为 90°。",
            "<b>第三步：几何推导</b><br><br>延长电池板交地面于E点。<br>在直角△OWE中，$\angle OWE (\alpha) + \angle OEW (\beta) = 90^\circ$<br>由于光线平行，光线1与地面的夹角 $H = 69^\circ$。<br>光线1垂直于电池板延长线，所以在直角三角形中，$\beta + H = 90^\circ$<br>因此，$\alpha = H = 69^\circ$。"
        ];
        
        function updateScene() {
            // Update buttons
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
            
            // Update explanation
            explanation.innerHTML = explanations[currentStep];
            if (window.MathJax) {
                MathJax.typesetPromise([explanation]).catch(function (err) {
                    console.error(err.message);
                });
            }
            
            // Update SVG elements visibility
            for (let i = 1; i <= maxStep; i++) {
                const el = document.getElementById(`scene3-step${i}`);
                if (i <= currentStep) {
                    el.style.display = 'inline';
                    // Small delay to allow display:inline to apply before changing opacity for transition
                    setTimeout(() => { el.style.opacity = '1'; }, 10);
                } else {
                    el.style.opacity = '0';
                    setTimeout(() => { if (currentStep < i) el.style.display = 'none'; }, 500);
                }
            }
        }
        
        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });
        
        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });
        
        // Initialize
        updateScene();
    })();
    </script>
</body>
</html>
