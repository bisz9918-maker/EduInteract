<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .step-element { transition: opacity 0.5s ease; opacity: 0; pointer-events: none; }
        .step-element.active { opacity: 1; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- Definitions for markers -->
            <defs>
                <marker id="scene1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828" />
                </marker>
            </defs>
            
            <!-- Grid Lines -->
            <g id="scene1-grid" stroke="#000000" stroke-width="1">
                <!-- Vertical lines -->
                <line x1="100" y1="100" x2="100" y2="400" />
                <line x1="160" y1="100" x2="160" y2="400" />
                <line x1="220" y1="100" x2="220" y2="400" />
                <line x1="280" y1="100" x2="280" y2="400" />
                <line x1="340" y1="100" x2="340" y2="400" />
                <line x1="400" y1="100" x2="400" y2="400" id="scene1-line-0-lon" />
                <line x1="460" y1="100" x2="460" y2="400" />
                <line x1="520" y1="100" x2="520" y2="400" />
                <line x1="580" y1="100" x2="580" y2="400" />
                <line x1="640" y1="100" x2="640" y2="400" />
                <line x1="700" y1="100" x2="700" y2="400" />
                
                <!-- Horizontal lines -->
                <line x1="100" y1="100" x2="700" y2="100" />
                <line x1="100" y1="160" x2="700" y2="160" />
                <line x1="100" y1="220" x2="700" y2="220" />
                <line x1="100" y1="280" x2="700" y2="280" />
                <line x1="100" y1="340" x2="700" y2="340" id="scene1-line-0-lat" />
                <line x1="100" y1="400" x2="700" y2="400" />
            </g>

            <!-- Labels -->
            <g id="scene1-labels" fill="#000000" font-size="14" text-anchor="middle">
                <!-- Longitude labels -->
                <text x="100" y="80">150°</text>
                <text x="160" y="80">120°</text>
                <text x="220" y="80">90°</text>
                <text x="280" y="80">60°</text>
                <text x="340" y="80">30°</text>
                <text x="400" y="80">0°</text>
                <text x="460" y="80">30°</text>
                <text x="520" y="80">60°</text>
                <text x="580" y="80">90°</text>
                <text x="640" y="80">120°</text>
                <text x="700" y="80">150°</text>
                
                <!-- Latitude labels -->
                <text x="730" y="105" text-anchor="start">40°</text>
                <text x="730" y="165" text-anchor="start">30°</text>
                <text x="730" y="225" text-anchor="start">20°</text>
                <text x="730" y="285" text-anchor="start">10°</text>
                <text x="730" y="345" text-anchor="start">0°</text>
                <text x="730" y="405" text-anchor="start">10°</text>
            </g>

            <!-- Points -->
            <g id="scene1-points" fill="#000000">
                <circle cx="160" cy="340" r="4" />
                <text x="145" y="330" font-size="14" text-anchor="middle">①</text>
                
                <circle cx="640" cy="340" r="4" />
                <text x="655" y="330" font-size="14" text-anchor="middle">②</text>
                
                <circle cx="640" cy="160" r="4" />
                <text x="625" y="175" font-size="14" text-anchor="middle">③</text>
                
                <circle cx="160" cy="160" r="4" />
                <text x="145" y="175" font-size="14" text-anchor="middle">④</text>
            </g>

            <!-- Step 1 Elements -->
            <g id="scene1-step1" class="step-element">
                <line x1="400" y1="100" x2="400" y2="400" stroke="#1565c0" stroke-width="3" />
                <line x1="100" y1="340" x2="700" y2="340" stroke="#1565c0" stroke-width="3" />
                <text x="370" y="70" fill="#1565c0" font-size="16" font-weight="bold" text-anchor="middle">W</text>
                <text x="430" y="70" fill="#1565c0" font-size="16" font-weight="bold" text-anchor="middle">E</text>
                <text x="765" y="310" fill="#1565c0" font-size="16" font-weight="bold" text-anchor="start">N</text>
                <text x="765" y="370" fill="#1565c0" font-size="16" font-weight="bold" text-anchor="start">S</text>
            </g>

            <!-- Step 2 Elements -->
            <g id="scene1-step2" class="step-element">
                <text x="160" y="375" fill="#1565c0" font-size="14" text-anchor="middle">①(0°, 120°W)</text>
                <text x="640" y="385" fill="#1565c0" font-size="14" text-anchor="middle">②(0°, 120°E)</text>
                <text x="640" y="130" fill="#1565c0" font-size="14" text-anchor="middle">③(30°N, 120°E)</text>
                <text x="160" y="130" fill="#1565c0" font-size="14" text-anchor="middle">④(30°N, 120°W)</text>
            </g>

            <!-- Step 3 Elements -->
            <g id="scene1-step3" class="step-element">
                <!-- Highlight points 1 and 3 -->
                <circle cx="160" cy="340" r="6" fill="#c62828" />
                <circle cx="640" cy="160" r="6" fill="#c62828" />
                
                <!-- South Arrow -->
                <line x1="645" y1="165" x2="645" y2="240" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrow)" />
                <text x="630" y="210" fill="#c62828" font-size="14" text-anchor="end">正南</text>
                
                <!-- East Arrow 1 -->
                <line x1="645" y1="165" x2="700" y2="165" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrow)" />
                <text x="675" y="150" fill="#c62828" font-size="14" text-anchor="middle">正东</text>
                
                <!-- Dashed connection -->
                <line x1="700" y1="165" x2="720" y2="165" stroke="#888888" stroke-width="2" stroke-dasharray="4,4" />
                <line x1="80" y1="165" x2="100" y2="165" stroke="#888888" stroke-width="2" stroke-dasharray="4,4" />
                
                <!-- East Arrow 2 -->
                <line x1="100" y1="165" x2="155" y2="165" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrow)" />
                
                <!-- Southeast Arrow -->
                <line x1="645" y1="165" x2="680" y2="200" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrow)" />
                <text x="685" y="225" fill="#c62828" font-size="14" text-anchor="start">东南</text>
            </g>

            <!-- Step 4 Elements -->
            <g id="scene1-step4" class="step-element">
                <!-- Singapore Star -->
                <path d="M 608 324 L 611 331 L 618 331 L 612 336 L 614 344 L 608 339 L 602 344 L 604 336 L 598 331 L 605 331 Z" fill="#c62828" />
                
                <!-- Singapore Label with text-shadow -->
                <text x="445" y="310" fill="#c62828" font-size="14" text-anchor="start" style="text-shadow: 1px 1px 2px white, -1px -1px 2px white, 1px -1px 2px white, -1px 1px 2px white;">新加坡(1°N, 104°E)</text>
                
                <!-- Distance Circle -->
                <circle cx="624" cy="337" r="25" stroke="#2e7d32" stroke-width="2" stroke-dasharray="4,4" fill="none" />
            </g>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 4;
        
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        
        function updateSteps() {
            for (let i = 1; i <= maxStep; i++) {
                const el = document.getElementById('scene1-step' + i);
                if (el) {
                    if (i <= currentStep) {
                        el.classList.add('active');
                    } else {
                        el.classList.remove('active');
                    }
                }
            }
            
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
        }
        
        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateSteps();
            }
        });
        
        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateSteps();
            }
        });
        
        updateSteps();
    })();
    </script>
</body>
</html>
