<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冬至日太阳照射情况与地方时分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button:hover:not(:disabled) { background: #e9e9e9; }
        .transition { transition: opacity 0.4s ease, stroke 0.4s ease, stroke-width 0.4s ease; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500">
            <defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#000" />
                </marker>
                <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828" />
                </marker>
            </defs>

            <!-- 基础图形 -->
            <circle cx="400" cy="240" r="160" fill="none" stroke="#000" stroke-width="1.5" />
            
            <!-- 经纬网 -->
            <line x1="253" y1="176" x2="547" y2="304" stroke="#000" stroke-width="1" /> <!-- 赤道 -->
            <line x1="291" y1="123" x2="560" y2="240" stroke="#000" stroke-width="1" /> <!-- 北回归线 -->
            <line x1="240" y1="240" x2="509" y2="357" stroke="#000" stroke-width="1" /> <!-- 南回归线 -->
            <line x1="400" y1="80" x2="517" y2="131" stroke="#000" stroke-width="1" stroke-dasharray="4,2" /> <!-- 北极圈 -->
            <line x1="283" y1="349" x2="400" y2="400" stroke="#000" stroke-width="1" stroke-dasharray="4,2" /> <!-- 南极圈 -->
            
            <!-- 经线 -->
            <path d="M 464,93 A 40,160 -23.5 0,0 336,387" fill="none" stroke="#000" stroke-width="1" />
            <path d="M 464,93 A 80,160 -23.5 0,0 336,387" fill="none" stroke="#000" stroke-width="1" />
            <path d="M 464,93 A 120,160 -23.5 0,0 336,387" fill="none" stroke="#000" stroke-width="1" />
            <path d="M 464,93 A 40,160 -23.5 0,1 336,387" fill="none" stroke="#000" stroke-width="1" />
            <path d="M 464,93 A 80,160 -23.5 0,1 336,387" fill="none" stroke="#000" stroke-width="1" />
            <path d="M 464,93 A 120,160 -23.5 0,1 336,387" fill="none" stroke="#000" stroke-width="1" />

            <!-- 晨昏线与夜半球 -->
            <line x1="400" y1="80" x2="400" y2="400" stroke="#000" stroke-width="1.5" />
            <path d="M 400,80 A 160,160 0 0,1 400,400 L 400,80 Z" fill="rgba(0,0,0,0.15)" />

            <!-- 地轴 -->
            <line x1="474" y1="70" x2="326" y2="410" stroke="#000" stroke-width="1.5" stroke-dasharray="5,5" />

            <!-- 太阳光线 -->
            <g id="scene1-sunlights">
                <line x1="100" y1="140" x2="230" y2="140" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)" />
                <line id="scene1-sun-center" class="transition" x1="100" y1="240" x2="230" y2="240" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)" />
                <line x1="100" y1="340" x2="230" y2="340" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)" />
            </g>
            <text x="70" y="190" font-size="16" text-anchor="middle">太</text>
            <text x="70" y="230" font-size="16" text-anchor="middle">阳</text>
            <text x="70" y="270" font-size="16" text-anchor="middle">光</text>
            <text x="70" y="310" font-size="16" text-anchor="middle">线</text>

            <!-- 关键点与基础标签 -->
            <circle cx="464" cy="93" r="3" fill="#000" /> <text x="480" y="70" font-size="14">N</text>
            <circle cx="336" cy="387" r="3" fill="#000" /> <text x="300" y="425" font-size="14">S</text>
            <circle cx="400" cy="170" r="3" fill="#000" /> <text x="370" y="145" font-size="14">A</text>
            <circle cx="291" cy="123" r="3" fill="#000" /> <text x="255" y="95" font-size="14">B</text>
            <circle cx="560" cy="240" r="3" fill="#000" /> <text x="585" y="245" font-size="14">C</text>

            <!-- 高亮元素 (初始隐藏) -->
            <!-- Step 1 -->
            <line id="scene1-sun-extend" class="transition" x1="230" y1="240" x2="240" y2="240" stroke="#c62828" stroke-width="2" stroke-dasharray="4,2" opacity="0" />
            <line id="scene1-hl-capricorn" class="transition" x1="240" y1="240" x2="509" y2="357" stroke="#c62828" stroke-width="3" opacity="0" />
            <text id="scene1-txt-subsolar" class="transition" x="150" y="275" fill="#c62828" font-size="14" opacity="0">直射点</text>
            <text id="scene1-txt-capricorn" class="transition" x="540" y="385" fill="#c62828" font-size="14" opacity="0">南回归线</text>

            <!-- Step 2 -->
            <line id="scene1-hl-cancer-day" class="transition" x1="291" y1="123" x2="400" y2="170" stroke="#fbc02d" stroke-width="3" opacity="0" />
            <line id="scene1-hl-cancer-night" class="transition" x1="400" y1="170" x2="560" y2="240" stroke="#1565c0" stroke-width="3" opacity="0" />
            <text id="scene1-txt-daynight" class="transition" x="600" y="150" fill="#1565c0" font-size="14" opacity="0">昼短夜长</text>
            <line id="scene1-hl-arctic" class="transition" x1="400" y1="80" x2="517" y2="131" stroke="#1565c0" stroke-width="3" opacity="0" />
            <text id="scene1-txt-polarnight" class="transition" x="550" y="90" fill="#1565c0" font-size="14" opacity="0">极夜</text>

            <!-- Step 3 -->
            <path id="scene1-hl-meridian-day" class="transition" d="M 464,93 A 160,160 0 0,0 336,387" fill="none" stroke="#fbc02d" stroke-width="3" opacity="0" />
            <path id="scene1-hl-meridian-night" class="transition" d="M 464,93 A 160,160 0 0,1 336,387" fill="none" stroke="#1565c0" stroke-width="3" opacity="0" />
            <text id="scene1-txt-1200" class="transition" x="120" y="80" fill="#fbc02d" font-size="14" opacity="0">12:00 (正午)</text>
            <text id="scene1-txt-2400" class="transition" x="620" y="210" fill="#1565c0" font-size="14" opacity="0">24:00 (子夜)</text>

        </svg>
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 3;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');

        const sunCenter = document.getElementById('scene1-sun-center');
        const sunExtend = document.getElementById('scene1-sun-extend');
        const hlCapricorn = document.getElementById('scene1-hl-capricorn');
        const txtSubsolar = document.getElementById('scene1-txt-subsolar');
        const txtCapricorn = document.getElementById('scene1-txt-capricorn');

        const hlCancerDay = document.getElementById('scene1-hl-cancer-day');
        const hlCancerNight = document.getElementById('scene1-hl-cancer-night');
        const txtDaynight = document.getElementById('scene1-txt-daynight');
        const hlArctic = document.getElementById('scene1-hl-arctic');
        const txtPolarnight = document.getElementById('scene1-txt-polarnight');

        const hlMeridianDay = document.getElementById('scene1-hl-meridian-day');
        const hlMeridianNight = document.getElementById('scene1-hl-meridian-night');
        const txt1200 = document.getElementById('scene1-txt-1200');
        const txt2400 = document.getElementById('scene1-txt-2400');

        function show(el) {
            el.style.opacity = '1';
            el.style.display = '';
        }

        function hide(el) {
            el.style.opacity = '0';
        }

        function updateView() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;

            // Step 1
            if (currentStep >= 1) {
                sunCenter.setAttribute('stroke', '#c62828');
                sunCenter.setAttribute('stroke-width', '2.5');
                sunCenter.setAttribute('marker-end', 'url(#arrow-red)');
                show(sunExtend);
                show(hlCapricorn);
                show(txtSubsolar);
                show(txtCapricorn);
            } else {
                sunCenter.setAttribute('stroke', '#000');
                sunCenter.setAttribute('stroke-width', '1.5');
                sunCenter.setAttribute('marker-end', 'url(#arrow)');
                hide(sunExtend);
                hide(hlCapricorn);
                hide(txtSubsolar);
                hide(txtCapricorn);
            }

            // Step 2
            if (currentStep >= 2) {
                show(hlCancerDay);
                show(hlCancerNight);
                show(txtDaynight);
                show(hlArctic);
                show(txtPolarnight);
            } else {
                hide(hlCancerDay);
                hide(hlCancerNight);
                hide(txtDaynight);
                hide(hlArctic);
                hide(txtPolarnight);
            }

            // Step 3
            if (currentStep >= 3) {
                show(hlMeridianDay);
                show(hlMeridianNight);
                show(txt1200);
                show(txt2400);
            } else {
                hide(hlMeridianDay);
                hide(hlMeridianNight);
                hide(txt1200);
                hide(txt2400);
            }
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateView();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateView();
            }
        });

        updateView();
    })();
    </script>
</body>
</html>
