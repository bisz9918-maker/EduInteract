<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H2O2 分子结构</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 20px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* SVG Elements */
        .scene1-plane { fill: #1565c0; fill-opacity: 0.1; stroke: #1565c0; stroke-opacity: 0.5; stroke-width: 2; }
        .scene1-bond { stroke: #000000; stroke-linecap: round; }
        .scene1-bond-highlight { stroke: #ffeb3b; stroke-linecap: round; stroke-width: 10; opacity: 0; transition: opacity 0.3s; }
        .scene1-atom-o { fill: #c62828; }
        .scene1-atom-h { fill: #1565c0; }
        .scene1-label { font-size: 16px; fill: #333; user-select: none; }
        .scene1-label-small { font-size: 14px; fill: #555; user-select: none; }
        
        /* Step visibility classes */
        .scene1-step1-el, .scene1-step2-el, .scene1-step3-el { opacity: 0; transition: opacity 0.5s; pointer-events: none; }
        
        /* Molecule transform transition */
        #scene1-mol1 { transition: transform 0.8s ease; transform-origin: 400px 220px; }
        #scene1-mol2 { transition: transform 0.8s ease, opacity 0.8s ease; transform-origin: 400px 220px; opacity: 0; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- Definitions -->
            <defs>
                <marker id="scene1-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828" />
                </marker>
            </defs>

            <!-- Molecule 2 (Hidden initially) -->
            <g id="scene1-mol2" transform="translate(120, 0) scale(0.75)">
                <!-- Planes -->
                <polygon points="320,220 280,80 440,80 480,220" class="scene1-plane" />
                <polygon points="320,220 420,320 580,320 480,220" class="scene1-plane" />
                <!-- Bonds -->
                <line x1="360" y1="220" x2="440" y2="220" class="scene1-bond" stroke-width="4" />
                <line x1="360" y1="220" x2="340" y2="120" class="scene1-bond" stroke-width="3" />
                <line x1="440" y1="220" x2="500" y2="280" class="scene1-bond" stroke-width="3" />
                <!-- Atoms -->
                <circle cx="360" cy="220" r="12" class="scene1-atom-o" />
                <circle cx="440" cy="220" r="12" class="scene1-atom-o" />
                <circle cx="340" cy="120" r="8" class="scene1-atom-h" />
                <circle cx="500" cy="280" r="8" class="scene1-atom-h" />
                <!-- Labels -->
                <text x="345" y="255" class="scene1-label">O</text>
                <text x="455" y="255" class="scene1-label">O</text>
                <text x="310" y="115" class="scene1-label">H</text>
                <text x="520" y="295" class="scene1-label">H</text>
            </g>

            <!-- Hydrogen Bond (Step 3) -->
            <g id="scene1-hbond-group" class="scene1-step3-el">
                <!-- Start: mol1 O1 (360,220) transformed by translate(-120,0) scale(0.75) around (400,220) -->
                <!-- End: mol2 H1 (340,120) transformed by translate(120,0) scale(0.75) around (400,220) -->
                <!-- Let's calculate exact coordinates later, use approximate for now -->
                <line x1="350" y1="220" x2="475" y2="145" stroke="#2e7d32" stroke-width="3" stroke-dasharray="5,5" />
                <text x="390" y="160" class="scene1-label" fill="#2e7d32">氢键</text>
                <text x="400" y="350" class="scene1-label" text-anchor="middle" fill="#333">分子间还存在范德华力</text>
            </g>

            <!-- Molecule 1 -->
            <g id="scene1-mol1">
                <!-- Planes -->
                <polygon points="320,220 280,80 440,80 480,220" class="scene1-plane" />
                <polygon points="320,220 420,320 580,320 480,220" class="scene1-plane" />
                
                <!-- Bond Highlights (Step 1) -->
                <line x1="360" y1="220" x2="440" y2="220" class="scene1-bond-highlight scene1-step1-el" id="scene1-hl-oo" />
                <line x1="360" y1="220" x2="340" y2="120" class="scene1-bond-highlight scene1-step1-el" id="scene1-hl-oh1" />
                <line x1="440" y1="220" x2="500" y2="280" class="scene1-bond-highlight scene1-step1-el" id="scene1-hl-oh2" />

                <!-- Bonds -->
                <line x1="360" y1="220" x2="440" y2="220" class="scene1-bond" stroke-width="4" />
                <line x1="360" y1="220" x2="340" y2="120" class="scene1-bond" stroke-width="3" />
                <line x1="440" y1="220" x2="500" y2="280" class="scene1-bond" stroke-width="3" />
                
                <!-- Atoms -->
                <circle cx="360" cy="220" r="12" class="scene1-atom-o" />
                <circle cx="440" cy="220" r="12" class="scene1-atom-o" />
                <circle cx="340" cy="120" r="8" class="scene1-atom-h" />
                <circle cx="500" cy="280" r="8" class="scene1-atom-h" />
                
                <!-- Labels -->
                <text x="345" y="255" class="scene1-label">O</text>
                <text x="455" y="255" class="scene1-label">O</text>
                <text x="310" y="115" class="scene1-label">H</text>
                <text x="520" y="295" class="scene1-label">H</text>

                <!-- Step 1 Labels -->
                <text x="400" y="255" class="scene1-label-small scene1-step1-el" text-anchor="middle" fill="#f57f17">非极性键</text>
                <text x="310" y="170" class="scene1-label-small scene1-step1-el" text-anchor="end" fill="#f57f17">极性键</text>
                <text x="510" y="250" class="scene1-label-small scene1-step1-el" text-anchor="start" fill="#f57f17">极性键</text>

                <!-- Step 2 Charge Centers -->
                <g class="scene1-step2-el">
                    <line x1="400" y1="220" x2="416" y2="204" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrow)" />
                    <circle cx="400" cy="220" r="10" fill="#fff" stroke="#1565c0" stroke-width="2" />
                    <text x="400" y="224" font-size="14" text-anchor="middle" fill="#1565c0">-</text>
                    
                    <circle cx="420" cy="200" r="10" fill="#fff" stroke="#c62828" stroke-width="2" />
                    <text x="420" y="204" font-size="14" text-anchor="middle" fill="#c62828">+</text>
                    
                    <text x="500" y="190" class="scene1-label" fill="#c62828">正负电荷中心不重合</text>
                    <text x="500" y="215" class="scene1-label" fill="#c62828">→ 极性分子</text>
                </g>
            </g>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 3;
        
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const mol1 = document.getElementById('scene1-mol1');
        const mol2 = document.getElementById('scene1-mol2');
        
        const step1Els = document.querySelectorAll('.scene1-step1-el');
        const step2Els = document.querySelectorAll('.scene1-step2-el');
        const step3Els = document.querySelectorAll('.scene1-step3-el');

        function updateScene() {
            // Update buttons
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;

            // Reset all
            step1Els.forEach(el => el.style.opacity = '0');
            step2Els.forEach(el => el.style.opacity = '0');
            step3Els.forEach(el => el.style.opacity = '0');
            
            mol1.style.transform = 'none';
            mol2.style.opacity = '0';
            mol2.style.transform = 'translate(120px, 0) scale(0.75)';

            if (currentStep === 1) {
                step1Els.forEach(el => el.style.opacity = '1');
            } else if (currentStep === 2) {
                step2Els.forEach(el => el.style.opacity = '1');
            } else if (currentStep === 3) {
                mol1.style.transform = 'translate(-120px, 0) scale(0.75)';
                mol2.style.opacity = '1';
                mol2.style.transform = 'translate(120px, 0) scale(0.75)';
                step3Els.forEach(el => el.style.opacity = '1');
            }
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });

        // Initialize
        updateScene();
    })();
    </script>
</body>
</html>
