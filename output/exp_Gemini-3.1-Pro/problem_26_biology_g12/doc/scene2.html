<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .step-element { opacity: 0; transition: opacity 0.3s ease; }
        .step-element.visible { opacity: 1; }
        
        text { font-family: sans-serif; font-size: 16px; fill: #000000; }
        .bold { font-weight: bold; }
        .blue { fill: #1565c0; }
        .red { fill: #c62828; }
        .green { fill: #2e7d32; }
        .branch-line { stroke: #888888; stroke-width: 1.5; fill: none; }
        .brace { stroke: #000000; stroke-width: 1.5; fill: none; }
        .brace.blue { stroke: #1565c0; }
        .brace.green { stroke: #2e7d32; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500">
            <!-- Step 0: P Generation -->
            <g id="scene2-step0" class="step-element visible">
                <text x="50" y="50" class="bold">P</text>
                <text x="200" y="50">残翅♀ aaX<tspan baseline-shift="super" font-size="0.7em">B</tspan>X<tspan baseline-shift="super" font-size="0.7em">B</tspan></text>
                <text x="400" y="50" text-anchor="middle">×</text>
                <text x="500" y="50">小翅♂ AAX<tspan baseline-shift="super" font-size="0.7em">b</tspan>Y</text>
            </g>

            <!-- Step 1: Gametes and F1 -->
            <g id="scene2-step1" class="step-element">
                <text x="50" y="90" class="bold">配子</text>
                <text x="250" y="90" text-anchor="middle">aX<tspan baseline-shift="super" font-size="0.7em">B</tspan></text>
                <text x="550" y="90" text-anchor="middle">AX<tspan baseline-shift="super" font-size="0.7em">b</tspan>, AY</text>
                
                <text x="50" y="130" class="bold">F<tspan baseline-shift="sub" font-size="0.7em">1</tspan></text>
                <text x="100" y="130">长翅♀ AaX<tspan baseline-shift="super" font-size="0.7em">B</tspan>X<tspan baseline-shift="super" font-size="0.7em">b</tspan></text>
                <text x="280" y="130" text-anchor="middle">×</text>
                <text x="350" y="130">长翅♂ AaX<tspan baseline-shift="super" font-size="0.7em">B</tspan>Y</text>
            </g>

            <!-- Step 2: F2 Autosomes -->
            <g id="scene2-step2" class="step-element">
                <text x="50" y="300" class="bold">F<tspan baseline-shift="sub" font-size="0.7em">2</tspan></text>
                <text x="100" y="220">3/4 A_</text>
                <text x="100" y="390">1/4 aa</text>
            </g>

            <!-- Step 3: Branching lines and F2 Sex chromosomes -->
            <g id="scene2-step3" class="step-element">
                <!-- Branching lines for 3/4 A_ -->
                <line x1="150" y1="215" x2="220" y2="160" class="branch-line" />
                <line x1="150" y1="215" x2="220" y2="200" class="branch-line" />
                <line x1="150" y1="215" x2="220" y2="240" class="branch-line" />
                <line x1="150" y1="215" x2="220" y2="280" class="branch-line" />
                
                <!-- Branching lines for 1/4 aa -->
                <line x1="150" y1="385" x2="220" y2="330" class="branch-line" />
                <line x1="150" y1="385" x2="220" y2="370" class="branch-line" />
                <line x1="150" y1="385" x2="220" y2="410" class="branch-line" />
                <line x1="150" y1="385" x2="220" y2="450" class="branch-line" />

                <!-- Sex chromosomes -->
                <text x="230" y="160">1/4 X<tspan baseline-shift="super" font-size="0.7em">B</tspan>X<tspan baseline-shift="super" font-size="0.7em">B</tspan></text>
                <text x="230" y="200">1/4 X<tspan baseline-shift="super" font-size="0.7em">B</tspan>X<tspan baseline-shift="super" font-size="0.7em">b</tspan></text>
                <text x="230" y="240">1/4 X<tspan baseline-shift="super" font-size="0.7em">B</tspan>Y</text>
                <text x="230" y="280">1/4 X<tspan baseline-shift="super" font-size="0.7em">b</tspan>Y</text>

                <text x="230" y="330">1/4 X<tspan baseline-shift="super" font-size="0.7em">B</tspan>X<tspan baseline-shift="super" font-size="0.7em">B</tspan></text>
                <text x="230" y="370">1/4 X<tspan baseline-shift="super" font-size="0.7em">B</tspan>X<tspan baseline-shift="super" font-size="0.7em">b</tspan></text>
                <text x="230" y="410">1/4 X<tspan baseline-shift="super" font-size="0.7em">B</tspan>Y</text>
                <text x="230" y="450">1/4 X<tspan baseline-shift="super" font-size="0.7em">b</tspan>Y</text>
            </g>

            <!-- Step 4: Combined Genotypes, Phenotypes, Braces, and Statistics -->
            <g id="scene2-step4" class="step-element">
                <!-- Equals -->
                <text x="330" y="160" text-anchor="middle">=</text>
                <text x="330" y="200" text-anchor="middle">=</text>
                <text x="330" y="240" text-anchor="middle">=</text>
                <text x="330" y="280" text-anchor="middle">=</text>
                <text x="330" y="330" text-anchor="middle">=</text>
                <text x="330" y="370" text-anchor="middle">=</text>
                <text x="330" y="410" text-anchor="middle">=</text>
                <text x="330" y="450" text-anchor="middle">=</text>

                <!-- Combined Genotypes -->
                <text x="360" y="160">3/16 A_X<tspan baseline-shift="super" font-size="0.7em">B</tspan>X<tspan baseline-shift="super" font-size="0.7em">B</tspan></text>
                <text x="360" y="200">3/16 A_X<tspan baseline-shift="super" font-size="0.7em">B</tspan>X<tspan baseline-shift="super" font-size="0.7em">b</tspan></text>
                <text x="360" y="240">3/16 A_X<tspan baseline-shift="super" font-size="0.7em">B</tspan>Y</text>
                <text x="360" y="280">3/16 A_X<tspan baseline-shift="super" font-size="0.7em">b</tspan>Y</text>
                <text x="360" y="330">1/16 aaX<tspan baseline-shift="super" font-size="0.7em">B</tspan>X<tspan baseline-shift="super" font-size="0.7em">B</tspan></text>
                <text x="360" y="370">1/16 aaX<tspan baseline-shift="super" font-size="0.7em">B</tspan>X<tspan baseline-shift="super" font-size="0.7em">b</tspan></text>
                <text x="360" y="410">1/16 aaX<tspan baseline-shift="super" font-size="0.7em">B</tspan>Y</text>
                <text x="360" y="450">1/16 aaX<tspan baseline-shift="super" font-size="0.7em">b</tspan>Y</text>

                <!-- Phenotypes -->
                <text x="510" y="160" class="blue">长翅♀</text>
                <text x="510" y="200" class="blue">长翅♀</text>
                <text x="510" y="240" class="blue">长翅♂</text>
                <text x="510" y="280" class="red">小翅♂</text>
                <text x="510" y="330" class="green">残翅♀</text>
                <text x="510" y="370" class="green">残翅♀</text>
                <text x="510" y="410" class="green">残翅♂</text>
                <text x="510" y="450" class="green">残翅♂</text>

                <!-- Braces -->
                <path d="M 580 155 C 590 155, 590 200, 600 200 C 590 200, 590 245, 580 245" class="brace blue" />
                <path d="M 580 325 C 590 325, 590 390, 600 390 C 590 390, 590 455, 580 455" class="brace green" />

                <!-- Statistics -->
                <text x="610" y="205" class="blue">9/16 长翅</text>
                <text x="610" y="280" class="red">3/16 小翅</text>
                <text x="610" y="395" class="green">4/16 残翅</text>
            </g>
        </svg>
        
        <div id="scene2-controls">
            <button id="scene2-prev" disabled>◀ 上一步</button>
            <button id="scene2-next">下一步 ▶</button>
        </div>
    </div>
    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 4;
        
        const prevBtn = document.getElementById('scene2-prev');
        const nextBtn = document.getElementById('scene2-next');
        
        function updateSteps() {
            for (let i = 0; i <= maxStep; i++) {
                const el = document.getElementById('scene2-step' + i);
                if (el) {
                    if (i <= currentStep) {
                        el.classList.add('visible');
                        el.style.display = '';
                    } else {
                        el.classList.remove('visible');
                        // Use a small timeout to allow opacity transition before hiding
                        setTimeout(() => {
                            if (i > currentStep) el.style.display = 'none';
                        }, 300);
                    }
                }
            }
            
            prevBtn.disabled = currentStep === 0;
            nextBtn.disabled = currentStep === maxStep;
        }
        
        prevBtn.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateSteps();
            }
        });
        
        nextBtn.addEventListener('click', () => {
            if (currentStep < maxStep) {
                // Ensure display is block before making visible
                const el = document.getElementById('scene2-step' + (currentStep + 1));
                if (el) el.style.display = '';
                
                // Small delay to ensure display: block is applied before opacity changes
                setTimeout(() => {
                    currentStep++;
                    updateSteps();
                }, 10);
            }
        });
        
        // Initialize
        for (let i = 1; i <= maxStep; i++) {
            const el = document.getElementById('scene2-step' + i);
            if (el) el.style.display = 'none';
        }
        updateSteps();
    })();
    </script>
</body>
</html>
