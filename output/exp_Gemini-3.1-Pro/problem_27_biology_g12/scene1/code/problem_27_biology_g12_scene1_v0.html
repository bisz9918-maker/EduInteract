<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisualSolver Scene</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        button { padding: 6px 12px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:hover { background: #eee; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .step-indicator { font-size: 14px; color: #333; min-width: 40px; text-align: center; }
        
        /* SVG Styles */
        svg { display: block; }
        .line { stroke: black; stroke-width: 2; fill: none; }
        .node-normal { fill: white; stroke: black; stroke-width: 2; }
        .node-a { fill: black; stroke: black; stroke-width: 2; }
        .node-b { fill: #999999; stroke: black; stroke-width: 2; }
        .label { font-size: 14px; fill: #333333; }
        .title { font-size: 18px; font-weight: bold; text-anchor: middle; }
        .formula { font-size: 16px; text-anchor: middle; fill: #2e7d32; }
        .genotype { font-size: 14px; fill: #2e7d32; text-anchor: middle; }
        
        /* Highlights */
        .hl-red { stroke: #c62828; stroke-width: 3; fill: rgba(198,40,40,0.2); opacity: 0; transition: opacity 0.3s; }
        .hl-blue { stroke: #1565c0; stroke-width: 3; fill: rgba(21,101,192,0.2); opacity: 0; transition: opacity 0.3s; }
        
        /* Step visibility */
        .step-el { opacity: 0; transition: opacity 0.3s; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- Highlights (Bottom Layer) -->
            <g id="scene1-highlights">
                <!-- Step 1: I-1, I-2, II-3 (Red) -->
                <circle cx="120" cy="100" r="22" class="hl-red scene1-step1-hl" />
                <circle cx="200" cy="100" r="22" class="hl-red scene1-step1-hl" />
                <circle cx="160" cy="220" r="22" class="hl-red scene1-step1-hl" />
                
                <!-- Step 2: II-10, III-4 (Red) -->
                <circle cx="620" cy="220" r="22" class="hl-red scene1-step2-hl" />
                <circle cx="620" cy="340" r="22" class="hl-red scene1-step2-hl" />
                
                <!-- Step 3: I-3, I-4, II-8 (Blue) -->
                <circle cx="520" cy="100" r="22" class="hl-blue scene1-step3-hl" />
                <circle cx="600" cy="100" r="22" class="hl-blue scene1-step3-hl" />
                <circle cx="460" cy="220" r="22" class="hl-blue scene1-step3-hl" />
                
                <!-- Step 4: I-3, II-7, II-9 (Blue) -->
                <circle cx="520" cy="100" r="22" class="hl-blue scene1-step4-hl" />
                <circle cx="400" cy="220" r="22" class="hl-blue scene1-step4-hl" />
                <circle cx="540" cy="220" r="22" class="hl-blue scene1-step4-hl" />
            </g>

            <!-- Lines (Middle Layer) -->
            <g id="scene1-lines">
                <!-- Family 1 -->
                <path class="line" d="M 135 100 L 185 100" />
                <path class="line" d="M 160 100 L 160 160" />
                <path class="line" d="M 100 160 L 280 160" />
                <path class="line" d="M 100 160 L 100 205" />
                <path class="line" d="M 160 160 L 160 205" />
                <path class="line" d="M 220 160 L 220 205" />
                <path class="line" d="M 280 160 L 280 205" />
                
                <path class="line" d="M 55 220 L 85 220" />
                <path class="line" d="M 70 220 L 70 325" />
                
                <path class="line" d="M 295 220 L 325 220" />
                <path class="line" d="M 310 220 L 310 325" />
                
                <!-- Family 2 -->
                <path class="line" d="M 535 100 L 585 100" />
                <path class="line" d="M 560 100 L 560 160" />
                <path class="line" d="M 460 160 L 620 160" />
                <path class="line" d="M 460 160 L 460 205" />
                <path class="line" d="M 540 160 L 540 205" />
                <path class="line" d="M 620 160 L 620 205" />
                
                <path class="line" d="M 415 220 L 445 220" />
                <path class="line" d="M 430 220 L 430 325" />
                
                <path class="line" d="M 635 220 L 685 220" />
                <path class="line" d="M 660 220 L 660 280" />
                <path class="line" d="M 620 280 L 700 280" />
                <path class="line" d="M 620 280 L 620 325" />
                <path class="line" d="M 700 280 L 700 325" />
                
                <!-- III-2 & III-3 -->
                <path class="line" d="M 325 340 L 415 340" />
                <path class="line" d="M 370 340 L 370 380" />
                <text x="370" y="335" class="label" text-anchor="middle">?</text>
            </g>

            <!-- Nodes (Top Layer) -->
            <g id="scene1-nodes">
                <!-- I -->
                <circle cx="120" cy="100" r="15" class="node-normal" />
                <rect x="185" y="85" width="30" height="30" class="node-normal" />
                <rect x="505" y="85" width="30" height="30" class="node-b" />
                <circle cx="600" cy="100" r="15" class="node-b" />
                
                <!-- II -->
                <rect x="25" y="205" width="30" height="30" class="node-normal" />
                <circle cx="100" cy="220" r="15" class="node-normal" />
                <rect x="145" y="205" width="30" height="30" class="node-a" />
                <!-- XX Male -->
                <rect x="205" y="205" width="30" height="30" class="node-normal" />
                <circle cx="220" cy="220" r="5" class="node-normal" />
                
                <circle cx="280" cy="220" r="15" class="node-normal" />
                <rect x="325" y="205" width="30" height="30" class="node-normal" />
                <circle cx="400" cy="220" r="15" class="node-b" />
                <rect x="445" y="205" width="30" height="30" class="node-normal" />
                <circle cx="540" cy="220" r="15" class="node-b" />
                <rect x="605" y="205" width="30" height="30" class="node-b" />
                <circle cx="700" cy="220" r="15" class="node-normal" />
                
                <!-- III -->
                <circle cx="70" cy="340" r="15" class="node-normal" />
                <rect x="295" y="325" width="30" height="30" class="node-a" />
                <circle cx="430" cy="340" r="15" class="node-b" />
                <rect x="605" y="325" width="30" height="30" class="node-a" />
                <rect x="685" y="325" width="30" height="30" class="node-normal" />
            </g>

            <!-- Labels -->
            <g id="scene1-labels">
                <text x="102" y="82" class="label" text-anchor="end">Ⅰ1</text>
                <text x="218" y="82" class="label" text-anchor="start">Ⅰ2</text>
                <text x="502" y="82" class="label" text-anchor="end">Ⅰ3</text>
                <text x="618" y="82" class="label" text-anchor="start">Ⅰ4</text>
                
                <text x="50" y="202" class="label" text-anchor="end">Ⅱ1</text>
                <text x="85" y="202" class="label" text-anchor="end">Ⅱ2</text>
                <text x="145" y="202" class="label" text-anchor="end">Ⅱ3</text>
                <text x="205" y="202" class="label" text-anchor="end">Ⅱ4</text>
                <text x="265" y="202" class="label" text-anchor="end">Ⅱ5</text>
                <text x="325" y="202" class="label" text-anchor="end">Ⅱ6</text>
                <text x="415" y="202" class="label" text-anchor="start">Ⅱ7</text>
                <text x="475" y="202" class="label" text-anchor="start">Ⅱ8</text>
                <text x="555" y="202" class="label" text-anchor="start">Ⅱ9</text>
                <text x="635" y="202" class="label" text-anchor="start">Ⅱ10</text>
                <text x="718" y="202" class="label" text-anchor="start">Ⅱ11</text>
                
                <text x="52" y="322" class="label" text-anchor="end">Ⅲ1</text>
                <text x="292" y="322" class="label" text-anchor="end">Ⅲ2</text>
                <text x="448" y="322" class="label" text-anchor="start">Ⅲ3</text>
                <text x="602" y="322" class="label" text-anchor="end">Ⅲ4</text>
                <text x="718" y="322" class="label" text-anchor="start">Ⅲ5</text>
            </g>

            <!-- Dynamic Texts -->
            <text id="scene1-title" x="400" y="45" class="title">甲病和乙病的遗传方式推导</text>
            
            <!-- Step 5 Elements -->
            <text x="310" y="380" class="genotype step-el scene1-step5-el">aa</text>
            <text x="430" y="380" class="genotype step-el scene1-step5-el">AABb 或 AAX<tspan dy="-5" font-size="10">B</tspan>X<tspan dy="5">b</tspan></text>
            <text x="400" y="440" class="formula step-el scene1-step5-el">正常概率 = 1 × 1/2 = 1/2</text>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <div class="step-indicator" id="scene1-step-text">0 / 5</div>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 5;
        
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepText = document.getElementById('scene1-step-text');
        const title = document.getElementById('scene1-title');
        
        const titles = [
            "甲病和乙病的遗传方式推导",
            "Ⅰ1、Ⅰ2正常，生出患甲病Ⅱ3 → 甲病为隐性遗传",
            "Ⅱ10正常，生出患甲病Ⅲ4 → 甲病只能是常染色体隐性",
            "Ⅰ3、Ⅰ4患乙病，生出正常Ⅱ8 → 乙病为显性遗传",
            "Ⅰ3患病，其女儿Ⅱ9患病；(Ⅱ7患病) → 符合伴X显性特征",
            "计算 Ⅲ2 和 Ⅲ3 生出正常孩子的概率"
        ];
        
        const titleColors = ["#000000", "#c62828", "#c62828", "#1565c0", "#1565c0", "#2e7d32"];

        function updateScene() {
            // Update controls
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
            stepText.textContent = currentStep + " / " + maxStep;
            
            // Update title
            title.textContent = titles[currentStep];
            title.style.fill = titleColors[currentStep];
            
            // Hide all highlights and step elements
            document.querySelectorAll('.hl-red, .hl-blue, .step-el').forEach(el => {
                el.style.opacity = '0';
            });
            
            // Show current step elements
            if (currentStep > 0 && currentStep < 5) {
                document.querySelectorAll('.scene1-step' + currentStep + '-hl').forEach(el => {
                    el.style.opacity = '1';
                });
            } else if (currentStep === 5) {
                document.querySelectorAll('.scene1-step5-el').forEach(el => {
                    el.style.opacity = '1';
                });
            }
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });

        // Initialize
        updateScene();
    })();
    </script>
</body>
</html>
