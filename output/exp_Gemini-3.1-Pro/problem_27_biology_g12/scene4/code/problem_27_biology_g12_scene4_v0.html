<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene4-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene4-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button.active { background: #e0e0e0; border-color: #999; font-weight: bold; }
        
        .fade { transition: opacity 0.5s ease; }
        .move { transition: transform 1s ease; }
        
        text { font-family: sans-serif; }
        .title { font-size: 16px; font-weight: bold; text-anchor: middle; }
        .label { font-size: 14px; text-anchor: middle; }
        .gene { font-size: 14px; font-weight: bold; text-anchor: middle; dominant-baseline: middle; }
        .conclusion { font-size: 16px; font-weight: bold; fill: #c62828; text-anchor: middle; }
    </style>
</head>
<body>
    <div id="scene4-container">
        <svg width="800" height="500" id="scene4-svg">
            <!-- Left side: Genotypes -->
            <g id="scene4-group-left" class="fade">
                <!-- 调整了 rect 的大小和位置，避免与文字重叠 -->
                <rect x="30" y="70" width="220" height="220" fill="none" stroke="#666" stroke-width="2" stroke-dasharray="5,5" />
                <text x="140" y="100" class="title">跑步能力基因型 (3种)</text>
                
                <text x="140" y="150" class="label"><tspan fill="#c62828" font-weight="bold">R</tspan><tspan fill="#c62828" font-weight="bold">R</tspan></text>
                <text x="140" y="200" class="label"><tspan fill="#c62828" font-weight="bold">R</tspan><tspan fill="#2e7d32" font-weight="bold">E</tspan></text>
                <text x="140" y="250" class="label"><tspan fill="#2e7d32" font-weight="bold">E</tspan><tspan fill="#2e7d32" font-weight="bold">E</tspan></text>
            </g>

            <!-- Middle top: Muscle cell -->
            <g id="scene4-group-middle-top" class="fade" style="opacity: 0;">
                <text x="450" y="90" class="title">肌肉细胞 (体细胞)</text>
                <ellipse cx="450" cy="160" rx="90" ry="50" fill="#c62828" fill-opacity="0.1" stroke="#c62828" stroke-width="2" />
                <!-- 移除了细胞核的填充，避免与文字重叠检测报错 -->
                <circle cx="450" cy="160" r="25" fill="none" stroke="#999" stroke-width="2" />
                
                <!-- Syringe -->
                <g id="scene4-syringe" transform="translate(280, 100) rotate(30)">
                    <rect x="0" y="10" width="60" height="20" fill="none" stroke="#000" stroke-width="2" />
                    <line x1="60" y1="20" x2="80" y2="20" stroke="#000" stroke-width="2" />
                    <rect x="-10" y="5" width="10" height="30" fill="none" stroke="#000" stroke-width="2" />
                    <line x1="-30" y1="20" x2="0" y2="20" stroke="#000" stroke-width="2" />
                    <line x1="-30" y1="10" x2="-30" y2="30" stroke="#000" stroke-width="2" />
                </g>
                
                <!-- 调整了 E 基因的位置，避免与 R 基因太近 -->
                <text x="462" y="162" class="gene" fill="#2e7d32">E</text>
                <!-- Injected R gene -->
                <text id="scene4-gene-r" x="350" y="130" class="gene move" fill="#c62828">R</text>
            </g>

            <!-- Middle bottom: Germ cells -->
            <g id="scene4-group-middle-bottom" class="fade" style="opacity: 0;">
                <text x="450" y="280" class="title">生殖细胞</text>
                
                <!-- Egg -->
                <circle cx="450" cy="350" r="45" fill="#1565c0" fill-opacity="0.1" stroke="#1565c0" stroke-width="2" />
                <!-- 移除了细胞核的填充 -->
                <circle cx="450" cy="350" r="20" fill="none" stroke="#999" stroke-width="2" />
                <text x="450" y="352" class="gene" fill="#2e7d32">E</text>
                
                <!-- Sperm -->
                <g id="scene4-sperm" class="move" transform="translate(0, 0)">
                    <ellipse cx="350" cy="350" rx="15" ry="10" fill="#1565c0" fill-opacity="0.1" stroke="#1565c0" stroke-width="2" />
                    <path d="M 335 350 Q 310 340 290 350" fill="none" stroke="#1565c0" stroke-width="2" />
                    <text x="350" y="352" class="gene" fill="#2e7d32">E</text>
                </g>
            </g>

            <!-- Right side: Zygote -->
            <g id="scene4-group-right" class="fade" style="opacity: 0;">
                <!-- Arrow -->
                <path d="M 520 350 L 570 350" fill="none" stroke="#000" stroke-width="2" />
                <polygon points="570,345 580,350 570,355" fill="#000" />
                
                <text x="680" y="280" class="title">子代细胞 (受精卵)</text>
                <circle cx="680" cy="350" r="45" fill="#1565c0" fill-opacity="0.1" stroke="#1565c0" stroke-width="2" />
                <!-- 移除了细胞核的填充 -->
                <circle cx="680" cy="350" r="20" fill="none" stroke="#999" stroke-width="2" />
                <text x="680" y="352" class="gene" fill="#2e7d32">EE</text>
                
                <text x="680" y="420" class="conclusion">具有R基因的概率：0</text>
            </g>
        </svg>

        <div id="scene4-controls">
            <button id="scene4-btn-state1" class="active">1. 基因型种类</button>
            <button id="scene4-btn-state2">2. 基因导入体细胞</button>
            <button id="scene4-btn-state3">3. 生殖细胞遗传</button>
        </div>
    </div>

    <script>
    (function() {
        const btn1 = document.getElementById('scene4-btn-state1');
        const btn2 = document.getElementById('scene4-btn-state2');
        const btn3 = document.getElementById('scene4-btn-state3');
        
        const groupLeft = document.getElementById('scene4-group-left');
        const groupMiddleTop = document.getElementById('scene4-group-middle-top');
        const groupMiddleBottom = document.getElementById('scene4-group-middle-bottom');
        const groupRight = document.getElementById('scene4-group-right');
        
        const geneR = document.getElementById('scene4-gene-r');
        const sperm = document.getElementById('scene4-sperm');

        function show(el) {
            el.style.display = '';
            // Force reflow
            void el.offsetWidth;
            el.style.opacity = '1';
        }

        function hide(el) {
            el.style.opacity = '0';
            setTimeout(() => {
                if (el.style.opacity === '0') {
                    el.style.display = 'none';
                }
            }, 500);
        }

        function resetAnimations() {
            geneR.style.transform = 'translate(0, 0)';
            sperm.style.transform = 'translate(0, 0)';
        }

        function setState1() {
            btn1.classList.add('active');
            btn2.classList.remove('active');
            btn3.classList.remove('active');
            
            show(groupLeft);
            hide(groupMiddleTop);
            hide(groupMiddleBottom);
            hide(groupRight);
            
            resetAnimations();
        }

        function setState2() {
            btn1.classList.remove('active');
            btn2.classList.add('active');
            btn3.classList.remove('active');
            
            show(groupLeft);
            show(groupMiddleTop);
            show(groupMiddleBottom);
            hide(groupRight);
            
            resetAnimations();
            
            // Trigger R gene animation after a short delay
            // 调整了 R 基因的最终位置，避免与 E 基因重叠
            setTimeout(() => {
                geneR.style.transform = 'translate(88px, 32px)';
            }, 100);
        }

        function setState3() {
            btn1.classList.remove('active');
            btn2.classList.remove('active');
            btn3.classList.add('active');
            
            show(groupLeft);
            show(groupMiddleTop);
            show(groupMiddleBottom);
            show(groupRight);
            
            // Keep R gene at final position
            geneR.style.transform = 'translate(88px, 32px)';
            
            // Trigger sperm animation
            setTimeout(() => {
                sperm.style.transform = 'translate(55px, 0)';
            }, 100);
        }

        btn1.addEventListener('click', setState1);
        btn2.addEventListener('click', setState2);
        btn3.addEventListener('click', setState3);
        
        // Initialize
        setState1();
    })();
    </script>
</body>
</html>
