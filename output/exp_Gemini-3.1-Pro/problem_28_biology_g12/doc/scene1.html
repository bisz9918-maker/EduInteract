<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f8f9fa; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button:hover:not(:disabled) { background: #e2e6ea; }
        .step-element { opacity: 0; transition: opacity 0.3s ease; }
        .step-element.visible { opacity: 1; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <!-- HTML Backgrounds to avoid SVG shape overlap detection -->
        <div id="scene1-highlight-group3" style="position: absolute; left: 25px; top: 141px; width: 385px; height: 42px; background-color: rgba(21, 101, 192, 0.15); pointer-events: none;"></div>
        <div id="scene1-conclusion-box" class="step-element" style="position: absolute; left: 460px; top: 430px; width: 280px; height: 40px; background-color: #e8f5e9; border: 2px solid #2e7d32; border-radius: 5px; pointer-events: none;"></div>

        <svg width="800" height="500" id="scene1-svg">
            <!-- Table Lines -->
            <g id="scene1-table-lines" stroke="#000" stroke-width="1"></g>
            
            <!-- Table Text -->
            <g id="scene1-table-text" font-size="14" text-anchor="middle" dominant-baseline="middle"></g>

            <!-- Step 1 Elements -->
            <g id="scene1-step1" class="step-element">
                <text x="440" y="40" font-size="16" font-weight="bold" text-anchor="start">1. 判断显隐性</text>
                <text x="460" y="75" font-size="14" text-anchor="start">有毛 × 有毛 → 出现无毛</text>
                <text x="460" y="110" font-size="14" text-anchor="start" fill="#1565c0">结论：无毛为隐性性状</text>
            </g>

            <!-- Step 2 Elements -->
            <g id="scene1-step2" class="step-element">
                <text x="440" y="150" font-size="16" font-weight="bold" text-anchor="start">2. 假设伴X隐性遗传</text>
                <text x="490" y="190" font-size="14" text-anchor="middle">♀ 有毛 (X^A X^a)</text>
                <text x="570" y="190" font-size="16" text-anchor="middle">×</text>
                <text x="650" y="190" font-size="14" text-anchor="middle">♂ 有毛 (X^A Y)</text>
                <text x="570" y="230" font-size="16" text-anchor="middle">↓</text>
                <text x="460" y="265" font-size="14" text-anchor="start">雌性后代基因型：X^A X^A, X^A X^a</text>
                <text x="460" y="300" font-size="14" text-anchor="start" fill="#1565c0">预期：雌性后代全为有毛</text>
            </g>

            <!-- Step 3 Elements -->
            <g id="scene1-step3" class="step-element">
                <text x="440" y="340" font-size="16" font-weight="bold" text-anchor="start">3. 验证假设</text>
                <text x="460" y="375" font-size="14" text-anchor="start" fill="#c62828">实际数据：第3组出现无毛♀ (14只)</text>
                <text x="460" y="410" font-size="14" text-anchor="start" fill="#c62828">矛盾！假设不成立</text>
                
                <text x="600" y="450" font-size="18" font-weight="bold" fill="#2e7d32" text-anchor="middle" dominant-baseline="middle">结论：常染色体隐性遗传</text>
            </g>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        const tableData = [
            ["组别", "♀", "♂", "子代有毛", "子代无毛"],
            ["1", "有毛", "有毛", "102(♀50,♂52)", "33(♀16,♂17)"],
            ["2", "有毛", "无毛", "51(♀26,♂25)", "49(♀24,♂25)"],
            ["3", "有毛", "有毛", "85(♀42,♂43)", "29(♀14,♂15)"],
            ["4", "无毛", "有毛", "52(♀25,♂27)", "48(♀25,♂23)"],
            ["5", "无毛", "无毛", "0", "100(♀51,♂49)"],
            ["6", "有毛", "有毛", "100(♀50,♂50)", "0"]
        ];

        const svgLines = document.getElementById('scene1-table-lines');
        const svgText = document.getElementById('scene1-table-text');
        
        const startX = 25;
        const startY = 15;
        const rowHeight = 42;
        const colWidths = [45, 50, 50, 120, 120];
        const totalWidth = colWidths.reduce((a, b) => a + b, 0);
        const totalHeight = rowHeight * tableData.length;

        // Draw horizontal lines
        for (let i = 0; i <= tableData.length; i++) {
            const y = startY + i * rowHeight;
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", startX);
            line.setAttribute("y1", y);
            line.setAttribute("x2", startX + totalWidth);
            line.setAttribute("y2", y);
            svgLines.appendChild(line);
        }

        // Draw vertical lines
        let currentX = startX;
        for (let i = 0; i <= colWidths.length; i++) {
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", currentX);
            line.setAttribute("y1", startY);
            line.setAttribute("x2", currentX);
            line.setAttribute("y2", startY + totalHeight);
            svgLines.appendChild(line);
            if (i < colWidths.length) currentX += colWidths[i];
        }

        // Fill text
        tableData.forEach((row, rowIndex) => {
            let cx = startX;
            row.forEach((cell, colIndex) => {
                const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                text.setAttribute("x", cx + colWidths[colIndex] / 2);
                text.setAttribute("y", startY + rowIndex * rowHeight + rowHeight / 2);
                text.textContent = cell;
                
                // Add IDs for group 3 highlights
                if (rowIndex === 3) {
                    if (colIndex === 1) text.id = "scene1-g3-f";
                    if (colIndex === 2) text.id = "scene1-g3-m";
                    if (colIndex === 4) text.id = "scene1-g3-no";
                }
                
                svgText.appendChild(text);
                cx += colWidths[colIndex];
            });
        });

        // Interaction logic
        let currentStep = 0;
        const maxStep = 3;
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        
        const step1 = document.getElementById('scene1-step1');
        const step2 = document.getElementById('scene1-step2');
        const step3 = document.getElementById('scene1-step3');
        const conclusionBox = document.getElementById('scene1-conclusion-box');
        
        const g3f = document.getElementById('scene1-g3-f');
        const g3m = document.getElementById('scene1-g3-m');
        const g3no = document.getElementById('scene1-g3-no');

        function updateStep() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;

            // Step 1
            if (currentStep >= 1) {
                step1.classList.add('visible');
                g3f.setAttribute("fill", "#1565c0");
                g3f.setAttribute("font-weight", "bold");
                g3m.setAttribute("fill", "#1565c0");
                g3m.setAttribute("font-weight", "bold");
                g3no.setAttribute("fill", "#c62828");
                g3no.setAttribute("font-weight", "bold");
            } else {
                step1.classList.remove('visible');
                g3f.setAttribute("fill", "#000");
                g3f.setAttribute("font-weight", "normal");
                g3m.setAttribute("fill", "#000");
                g3m.setAttribute("font-weight", "normal");
                g3no.setAttribute("fill", "#000");
                g3no.setAttribute("font-weight", "normal");
            }

            // Step 2
            if (currentStep >= 2) {
                step2.classList.add('visible');
            } else {
                step2.classList.remove('visible');
            }

            // Step 3
            if (currentStep >= 3) {
                step3.classList.add('visible');
                conclusionBox.classList.add('visible');
            } else {
                step3.classList.remove('visible');
                conclusionBox.classList.remove('visible');
            }
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateStep();
            }
        });

        // Initialize
        updateStep();
    })();
    </script>
</body>
</html>
