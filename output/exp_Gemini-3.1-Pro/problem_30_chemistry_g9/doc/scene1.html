<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        button { padding: 6px 12px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .scene1-element { transition: all 0.3s ease; }
        
        .fill-default { fill: #f5f5f5; }
        .fill-blue { fill: rgba(21, 101, 192, 0.2); }
        .fill-green { fill: rgba(46, 125, 50, 0.2); }
        
        .stroke-default { stroke: #000000; }
        .stroke-blue { stroke: #1565c0; }
        .stroke-green { stroke: #2e7d32; }
        
        .text-default { fill: #000000; }
        .text-blue { fill: #1565c0; }
        .text-green { fill: #2e7d32; }
        
        .stroke-width-2 { stroke-width: 2px; }
        .stroke-width-3 { stroke-width: 3px; }
        
        .opacity-0 { opacity: 0; }
        .opacity-1 { opacity: 1; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <defs>
                <marker id="scene1-arrow-default" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
                </marker>
                <marker id="scene1-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0" />
                </marker>
                <marker id="scene1-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32" />
                </marker>
            </defs>

            <!-- 连线 -->
            <line id="scene1-line-xy" class="scene1-element stroke-default stroke-width-2" x1="120" y1="170" x2="280" y2="170" />
            <line id="scene1-line-yfe" class="scene1-element stroke-default stroke-width-2" x1="280" y1="170" x2="440" y2="170" />
            <line id="scene1-line-xm" class="scene1-element stroke-default stroke-width-2" x1="120" y1="170" x2="200" y2="310" />
            <line id="scene1-line-ym" class="scene1-element stroke-default stroke-width-2" x1="280" y1="170" x2="200" y2="310" />
            <line id="scene1-line-yn" class="scene1-element stroke-default stroke-width-2" x1="280" y1="170" x2="360" y2="310" />
            <line id="scene1-line-nfe" class="scene1-element stroke-default stroke-width-2" x1="360" y1="310" x2="432.5" y2="183" marker-end="url(#scene1-arrow-default)" />

            <!-- 辅助线 -->
            <g id="scene1-aux-y3" class="scene1-element opacity-0">
                <line x1="280" y1="90" x2="280" y2="60" class="stroke-default stroke-width-2" stroke-dasharray="5,5" />
                <line x1="280" y1="60" x2="580" y2="60" class="stroke-default stroke-width-2" stroke-dasharray="5,5" />
                <line x1="580" y1="60" x2="580" y2="213" class="stroke-default stroke-width-2" stroke-dasharray="5,5" />
                <line x1="580" y1="213" x2="610" y2="213" class="stroke-default stroke-width-2" stroke-dasharray="5,5" />
            </g>
            <g id="scene1-aux-n2" class="scene1-element opacity-0">
                <line x1="360" y1="395" x2="360" y2="420" class="stroke-default stroke-width-2" stroke-dasharray="5,5" />
                <line x1="360" y1="420" x2="590" y2="420" class="stroke-default stroke-width-2" stroke-dasharray="5,5" />
                <line x1="590" y1="420" x2="590" y2="153" class="stroke-default stroke-width-2" stroke-dasharray="5,5" />
                <line x1="590" y1="153" x2="610" y2="153" class="stroke-default stroke-width-2" stroke-dasharray="5,5" />
            </g>
            <g id="scene1-aux-x4" class="scene1-element opacity-0">
                <line x1="120" y1="90" x2="120" y2="40" class="stroke-default stroke-width-2" stroke-dasharray="5,5" />
                <line x1="120" y1="40" x2="570" y2="40" class="stroke-default stroke-width-2" stroke-dasharray="5,5" />
                <line x1="570" y1="40" x2="570" y2="273" class="stroke-default stroke-width-2" stroke-dasharray="5,5" />
                <line x1="570" y1="273" x2="610" y2="273" class="stroke-default stroke-width-2" stroke-dasharray="5,5" />
            </g>
            <g id="scene1-aux-m5" class="scene1-element opacity-0">
                <line x1="200" y1="395" x2="200" y2="440" class="stroke-default stroke-width-2" stroke-dasharray="5,5" />
                <line x1="200" y1="440" x2="580" y2="440" class="stroke-default stroke-width-2" stroke-dasharray="5,5" />
                <line x1="580" y1="440" x2="580" y2="333" class="stroke-default stroke-width-2" stroke-dasharray="5,5" />
                <line x1="580" y1="333" x2="610" y2="333" class="stroke-default stroke-width-2" stroke-dasharray="5,5" />
            </g>
            <g id="scene1-aux-fe1" class="scene1-element opacity-0">
                <line x1="440" y1="150" x2="440" y2="93" class="stroke-default stroke-width-2" stroke-dasharray="5,5" />
                <line x1="440" y1="93" x2="610" y2="93" class="stroke-default stroke-width-2" stroke-dasharray="5,5" />
            </g>

            <!-- 节点 -->
            <circle id="scene1-node-x" class="scene1-element fill-default stroke-default stroke-width-2" cx="120" cy="170" r="15" />
            <text class="scene1-element text-default" x="95" y="175" text-anchor="end" font-size="16">X</text>
            
            <circle id="scene1-node-y" class="scene1-element fill-default stroke-default stroke-width-2" cx="280" cy="170" r="15" />
            <text class="scene1-element text-default" x="280" y="145" text-anchor="middle" font-size="16">Y</text>
            
            <circle id="scene1-node-fe" class="scene1-element fill-default stroke-default stroke-width-2" cx="440" cy="170" r="15" />
            <text class="scene1-element text-default" x="465" y="175" text-anchor="start" font-size="16">铁</text>
            
            <circle id="scene1-node-m" class="scene1-element fill-default stroke-default stroke-width-2" cx="200" cy="310" r="15" />
            <text class="scene1-element text-default" x="175" y="330" text-anchor="end" font-size="16">M</text>
            
            <circle id="scene1-node-n" class="scene1-element fill-default stroke-default stroke-width-2" cx="360" cy="310" r="15" />
            <text class="scene1-element text-default" x="385" y="330" text-anchor="start" font-size="16">N</text>

            <!-- 物质标签 -->
            <text id="scene1-label-x" class="scene1-element text-default opacity-0" x="120" y="105" text-anchor="middle" font-size="14">氢氧化钙/碳酸钠</text>
            <text id="scene1-label-y" class="scene1-element text-default opacity-0" x="280" y="105" text-anchor="middle" font-size="14">稀盐酸</text>
            <text id="scene1-label-m" class="scene1-element text-default opacity-0" x="200" y="385" text-anchor="middle" font-size="14">碳酸钠/氢氧化钙</text>
            <text id="scene1-label-n" class="scene1-element text-default opacity-0" x="360" y="385" text-anchor="middle" font-size="14">氧化铁</text>

            <!-- 备选物质卡片 -->
            <g id="scene1-card-1" class="scene1-element">
                <rect class="scene1-element fill-default stroke-default stroke-width-2" x="620" y="85" width="16" height="16" rx="2" />
                <text class="scene1-element text-default" x="645" y="98" text-anchor="start" font-size="14">铁</text>
            </g>
            <g id="scene1-card-2" class="scene1-element">
                <rect class="scene1-element fill-default stroke-default stroke-width-2" x="620" y="145" width="16" height="16" rx="2" />
                <text class="scene1-element text-default" x="645" y="158" text-anchor="start" font-size="14">氧化铁</text>
            </g>
            <g id="scene1-card-3" class="scene1-element">
                <rect class="scene1-element fill-default stroke-default stroke-width-2" x="620" y="205" width="16" height="16" rx="2" />
                <text class="scene1-element text-default" x="645" y="218" text-anchor="start" font-size="14">稀盐酸</text>
            </g>
            <g id="scene1-card-4" class="scene1-element">
                <rect class="scene1-element fill-default stroke-default stroke-width-2" x="620" y="265" width="16" height="16" rx="2" />
                <text class="scene1-element text-default" x="645" y="278" text-anchor="start" font-size="14">氢氧化钙溶液</text>
            </g>
            <g id="scene1-card-5" class="scene1-element">
                <rect class="scene1-element fill-default stroke-default stroke-width-2" x="620" y="325" width="16" height="16" rx="2" />
                <text class="scene1-element text-default" x="645" y="338" text-anchor="start" font-size="14">碳酸钠溶液</text>
            </g>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 0 / 4</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 4;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');

        function setClass(id, cls) {
            const el = document.getElementById(id);
            if (el) {
                el.className.baseVal = 'scene1-element ' + cls;
            }
        }
        
        function setGroupClass(id, rectCls, textCls) {
            const g = document.getElementById(id);
            if (g) {
                const rect = g.querySelector('rect');
                const text = g.querySelector('text');
                if (rect) rect.className.baseVal = 'scene1-element ' + rectCls;
                if (text) text.className.baseVal = 'scene1-element ' + textCls;
            }
        }

        function setAuxClass(id, cls) {
            const g = document.getElementById(id);
            if (g) {
                g.className.baseVal = 'scene1-element ' + (cls.includes('opacity-1') ? 'opacity-1' : 'opacity-0');
                const lines = g.querySelectorAll('line');
                let colorCls = 'stroke-default';
                if (cls.includes('blue')) colorCls = 'stroke-blue';
                if (cls.includes('green')) colorCls = 'stroke-green';
                lines.forEach(l => l.className.baseVal = colorCls + ' stroke-width-2');
            }
        }

        function setArrow(id, color) {
            const el = document.getElementById(id);
            if (el) {
                el.setAttribute('marker-end', `url(#scene1-arrow-${color})`);
            }
        }

        function updateScene() {
            stepIndicator.textContent = `步骤 ${currentStep} / ${maxStep}`;
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;

            const allNodes = ['x', 'y', 'fe', 'm', 'n'];
            const allLines = ['xy', 'yfe', 'xm', 'ym', 'yn', 'nfe'];
            const allCards = [1, 2, 3, 4, 5];
            const allLabels = ['x', 'y', 'm', 'n'];
            const allAux = ['y3', 'n2', 'x4', 'm5', 'fe1'];

            allNodes.forEach(n => setClass(`scene1-node-${n}`, 'fill-default stroke-default stroke-width-2'));
            allLines.forEach(l => setClass(`scene1-line-${l}`, 'stroke-default stroke-width-2'));
            setArrow('scene1-line-nfe', 'default');
            allCards.forEach(c => setGroupClass(`scene1-card-${c}`, 'fill-default stroke-default stroke-width-2', 'text-default'));
            allLabels.forEach(l => setClass(`scene1-label-${l}`, 'text-default opacity-0'));
            allAux.forEach(a => setAuxClass(`scene1-aux-${a}`, 'opacity-0'));

            if (currentStep >= 1) {
                setClass('scene1-node-y', 'fill-blue stroke-blue stroke-width-2');
                setGroupClass('scene1-card-3', 'fill-blue stroke-blue stroke-width-2', 'text-blue');
                
                setClass('scene1-line-xy', 'stroke-blue stroke-width-3');
                setClass('scene1-line-yfe', 'stroke-blue stroke-width-3');
                setClass('scene1-line-ym', 'stroke-blue stroke-width-3');
                setClass('scene1-line-yn', 'stroke-blue stroke-width-3');
                
                setClass('scene1-label-y', 'text-blue opacity-1');
                setAuxClass('scene1-aux-y3', 'blue opacity-1');
            }

            if (currentStep >= 2) {
                setClass('scene1-node-y', 'fill-green stroke-green stroke-width-2');
                setGroupClass('scene1-card-3', 'fill-green stroke-green stroke-width-2', 'text-green');
                setClass('scene1-label-y', 'text-green opacity-1');
                setAuxClass('scene1-aux-y3', 'green opacity-1');
                
                setClass('scene1-line-xy', 'stroke-default stroke-width-2');
                setClass('scene1-line-yfe', 'stroke-default stroke-width-2');
                setClass('scene1-line-ym', 'stroke-default stroke-width-2');
                
                setClass('scene1-node-n', 'fill-blue stroke-blue stroke-width-2');
                setGroupClass('scene1-card-2', 'fill-blue stroke-blue stroke-width-2', 'text-blue');
                
                setClass('scene1-line-yn', 'stroke-blue stroke-width-3');
                setClass('scene1-line-nfe', 'stroke-blue stroke-width-3');
                setArrow('scene1-line-nfe', 'blue');
                
                setClass('scene1-label-n', 'text-blue opacity-1');
                setAuxClass('scene1-aux-n2', 'blue opacity-1');
            }

            if (currentStep >= 3) {
                setClass('scene1-node-n', 'fill-green stroke-green stroke-width-2');
                setGroupClass('scene1-card-2', 'fill-green stroke-green stroke-width-2', 'text-green');
                setClass('scene1-label-n', 'text-green opacity-1');
                setAuxClass('scene1-aux-n2', 'green opacity-1');
                
                setClass('scene1-line-yn', 'stroke-default stroke-width-2');
                setClass('scene1-line-nfe', 'stroke-default stroke-width-2');
                setArrow('scene1-line-nfe', 'default');
                
                setClass('scene1-node-x', 'fill-blue stroke-blue stroke-width-2');
                setClass('scene1-node-m', 'fill-blue stroke-blue stroke-width-2');
                setGroupClass('scene1-card-4', 'fill-blue stroke-blue stroke-width-2', 'text-blue');
                setGroupClass('scene1-card-5', 'fill-blue stroke-blue stroke-width-2', 'text-blue');
                
                setClass('scene1-line-xm', 'stroke-blue stroke-width-3');
                
                setClass('scene1-label-x', 'text-blue opacity-1');
                setClass('scene1-label-m', 'text-blue opacity-1');
                setAuxClass('scene1-aux-x4', 'blue opacity-1');
                setAuxClass('scene1-aux-m5', 'blue opacity-1');
            }

            if (currentStep >= 4) {
                setClass('scene1-node-x', 'fill-green stroke-green stroke-width-2');
                setClass('scene1-node-m', 'fill-green stroke-green stroke-width-2');
                setGroupClass('scene1-card-4', 'fill-green stroke-green stroke-width-2', 'text-green');
                setGroupClass('scene1-card-5', 'fill-green stroke-green stroke-width-2', 'text-green');
                setClass('scene1-label-x', 'text-green opacity-1');
                setClass('scene1-label-m', 'text-green opacity-1');
                setAuxClass('scene1-aux-x4', 'green opacity-1');
                setAuxClass('scene1-aux-m5', 'green opacity-1');
                
                setClass('scene1-line-xm', 'stroke-default stroke-width-2');
                
                setClass('scene1-node-fe', 'fill-green stroke-green stroke-width-2');
                setGroupClass('scene1-card-1', 'fill-green stroke-green stroke-width-2', 'text-green');
                setAuxClass('scene1-aux-fe1', 'green opacity-1');
            }
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });

        updateScene();
    })();
    </script>
</body>
</html>
