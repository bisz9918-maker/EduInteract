<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button.active { background: #e0e0e0; border-color: #999; font-weight: bold; }
        .hidden { display: none; opacity: 0; }
        .visible { display: block; opacity: 1; transition: opacity 0.3s; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500">
            <!-- State 1 -->
            <g id="scene2-state1">
                <text x="400" y="60" text-anchor="middle" font-size="24" font-weight="bold">选项 C 分析：N(Fe₂O₃) 转化为 Fe</text>
                
                <!-- Eq 1 -->
                <text x="350" y="160" text-anchor="end" font-size="20">Fe₂O₃ + 3<tspan fill="#c62828">CO</tspan></text>
                <text x="380" y="160" text-anchor="middle" font-size="20">═</text>
                <text x="380" y="120" text-anchor="middle" font-size="14">高温</text>
                <text x="410" y="160" text-anchor="start" font-size="20">2Fe + 3<tspan fill="#c62828">CO₂</tspan></text>
                <text x="560" y="160" text-anchor="start" font-size="20">【非置换反应】</text>
                
                <text x="325" y="200" text-anchor="middle" font-size="16" fill="#c62828">化合物</text>
                <line x1="325" y1="180" x2="325" y2="165" stroke="#c62828" stroke-width="1.5" marker-end="url(#arrow-red)"/>
                
                <text x="485" y="200" text-anchor="middle" font-size="16" fill="#c62828">化合物</text>
                <line x1="485" y1="180" x2="485" y2="165" stroke="#c62828" stroke-width="1.5" marker-end="url(#arrow-red)"/>

                <!-- Eq 2 -->
                <text x="350" y="280" text-anchor="end" font-size="20">2Fe₂O₃ + 3<tspan fill="#1565c0">C</tspan></text>
                <text x="380" y="280" text-anchor="middle" font-size="20">═</text>
                <text x="380" y="240" text-anchor="middle" font-size="14">高温</text>
                <text x="410" y="280" text-anchor="start" font-size="20">4<tspan fill="#1565c0">Fe</tspan> + 3CO₂↑</text>
                <text x="560" y="280" text-anchor="start" font-size="20">【置换反应】</text>
                
                <text x="335" y="320" text-anchor="middle" font-size="16" fill="#1565c0">单质</text>
                <line x1="335" y1="300" x2="335" y2="285" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
                
                <text x="430" y="320" text-anchor="middle" font-size="16" fill="#1565c0">单质</text>
                <line x1="430" y1="300" x2="430" y2="285" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

                <text x="400" y="400" text-anchor="middle" font-size="20" fill="#c62828" font-weight="bold">结论：N 转化为铁的反应不一定是置换反应，选项 C 错误</text>
            </g>

            <!-- State 2 -->
            <g id="scene2-state2" class="hidden">
                <text x="400" y="60" text-anchor="middle" font-size="24" font-weight="bold">选项 D 分析：X, Y, M 两两反应</text>
                
                <!-- Triangle Graph -->
                <line x1="120" y1="160" x2="280" y2="160" stroke="#999" stroke-width="2"/>
                <line x1="120" y1="160" x2="200" y2="300" stroke="#999" stroke-width="2"/>
                <line x1="280" y1="160" x2="200" y2="300" stroke="#999" stroke-width="2"/>
                
                <circle cx="120" cy="160" r="25" fill="#fff" stroke="#000" stroke-width="2"/>
                <text x="120" y="166" text-anchor="middle" font-size="20">X</text>
                <text x="120" y="205" text-anchor="middle" font-size="16">Na₂CO₃</text>
                
                <circle cx="280" cy="160" r="25" fill="#fff" stroke="#000" stroke-width="2"/>
                <text x="280" y="166" text-anchor="middle" font-size="20">Y</text>
                <text x="280" y="205" text-anchor="middle" font-size="16">HCl</text>
                
                <circle cx="200" cy="300" r="25" fill="#fff" stroke="#000" stroke-width="2"/>
                <text x="200" y="306" text-anchor="middle" font-size="20">M</text>
                <text x="200" y="345" text-anchor="middle" font-size="16">Ca(OH)₂</text>

                <!-- Equations -->
                <!-- Eq 1: Na2CO3 + 2HCl = 2NaCl + H2O + CO2 -->
                <text x="350" y="160" text-anchor="start" font-size="20">Na₂CO₃ + 2HCl ═ 2NaCl + H₂O + CO₂↑</text>
                <path d="M 370 145 Q 410 120 450 145" fill="none" stroke="#1565c0" stroke-width="2"/>
                
                <!-- Eq 2: 2HCl + Ca(OH)2 = CaCl2 + 2H2O -->
                <text x="350" y="240" text-anchor="start" font-size="20">2HCl + Ca(OH)₂ ═ CaCl₂ + 2H₂O</text>
                <path d="M 380 225 Q 420 200 460 225" fill="none" stroke="#1565c0" stroke-width="2"/>
                
                <!-- Eq 3: Na2CO3 + Ca(OH)2 = CaCO3 + 2NaOH -->
                <text x="350" y="320" text-anchor="start" font-size="20">Na₂CO₃ + Ca(OH)₂ ═ CaCO₃↓ + 2NaOH</text>
                <path d="M 370 305 Q 430 280 490 305" fill="none" stroke="#1565c0" stroke-width="2"/>

                <text x="750" y="240" text-anchor="end" font-size="20" fill="#2e7d32" font-weight="bold">【均为复分解反应】</text>
                <text x="400" y="420" text-anchor="middle" font-size="20" fill="#2e7d32" font-weight="bold">结论：X、Y、M 两两之间均发生复分解反应，选项 D 正确</text>
            </g>

            <defs>
                <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828"/>
                </marker>
                <marker id="arrow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0"/>
                </marker>
            </defs>
        </svg>
        <div id="scene2-controls">
            <button id="scene2-btn-c" class="active">分析选项 C</button>
            <button id="scene2-btn-d">分析选项 D</button>
        </div>
    </div>
    <script>
    (function() {
        const btnC = document.getElementById('scene2-btn-c');
        const btnD = document.getElementById('scene2-btn-d');
        const state1 = document.getElementById('scene2-state1');
        const state2 = document.getElementById('scene2-state2');

        function showState(state) {
            if (state === 1) {
                state1.style.display = '';
                state1.style.opacity = '1';
                state2.style.display = 'none';
                state2.style.opacity = '0';
                btnC.classList.add('active');
                btnD.classList.remove('active');
            } else {
                state1.style.display = 'none';
                state1.style.opacity = '0';
                state2.style.display = '';
                state2.style.opacity = '1';
                btnC.classList.remove('active');
                btnD.classList.add('active');
            }
        }

        btnC.addEventListener('click', () => showState(1));
        btnD.addEventListener('click', () => showState(2));
        
        // Initialize
        showState(1);
    })();
    </script>
</body>
</html>
