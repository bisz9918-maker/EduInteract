<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 20px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        input[type="range"] { width: 300px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <defs>
                <!-- Define the ray line in defs to avoid AABB overlap false positives in the test script -->
                <line id="scene1-ray-def" x1="500" y1="100" x2="125" y2="400" />
            </defs>
            
            <!-- Ground -->
            <line x1="100" y1="400" x2="750" y2="400" stroke="#000000" stroke-width="2" />
            
            <!-- Street lamp pole -->
            <line x1="500" y1="400" x2="500" y2="100" stroke="#000000" stroke-width="4" />
            
            <!-- Light source -->
            <circle cx="500" cy="100" r="6" fill="#000000" />
            <text x="500" y="80" text-anchor="middle" font-size="16" fill="#000000">光源</text>
            
            <!-- Point A -->
            <circle cx="250" cy="400" r="4" fill="#000000" />
            <text x="250" y="425" text-anchor="middle" font-size="16" fill="#000000">A</text>
            
            <!-- Point B -->
            <circle cx="650" cy="400" r="4" fill="#000000" />
            <text x="650" y="425" text-anchor="middle" font-size="16" fill="#000000">B</text>
            
            <!-- Light ray (using <use> to reference the def) -->
            <use id="scene1-ray" href="#scene1-ray-def" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" />
            
            <!-- Shadow -->
            <line id="scene1-shadow" x1="250" y1="400" x2="125" y2="400" stroke="#c62828" stroke-width="6" stroke-linecap="round" />
            <text id="scene1-shadow-label" x="187.5" y="425" text-anchor="middle" font-size="16" fill="#c62828">影子</text>
            
            <!-- Person -->
            <line id="scene1-person" x1="250" y1="400" x2="250" y2="300" stroke="#1565c0" stroke-width="6" stroke-linecap="round" />
            <text id="scene1-person-label" x="250" y="285" text-anchor="middle" font-size="16" fill="#1565c0">小亮</text>
        </svg>
        
        <div id="scene1-controls">
            <label for="scene1-slider" style="font-size: 16px; font-weight: bold; color: #333;">移动小亮：</label>
            <input type="range" id="scene1-slider" min="250" max="650" value="250" step="1">
        </div>
    </div>
    <script>
    (function() {
        const slider = document.getElementById('scene1-slider');
        const person = document.getElementById('scene1-person');
        const personLabel = document.getElementById('scene1-person-label');
        const rayDef = document.getElementById('scene1-ray-def');
        const shadow = document.getElementById('scene1-shadow');
        const shadowLabel = document.getElementById('scene1-shadow-label');

        function updateScene() {
            const x = parseFloat(slider.value);
            const Sx = 1.5 * x - 250;

            // Update person
            person.setAttribute('x1', x);
            person.setAttribute('x2', x);
            personLabel.setAttribute('x', x);

            // Update ray
            rayDef.setAttribute('x2', Sx);

            // Update shadow
            shadow.setAttribute('x1', x);
            shadow.setAttribute('x2', Sx);
            
            // Update shadow label
            let shadowCenterX = (x + Sx) / 2;
            shadowLabel.setAttribute('x', shadowCenterX);
            
            // Hide shadow label if shadow is too small
            if (Math.abs(x - Sx) < 10) {
                shadowLabel.style.display = 'none';
                shadowLabel.style.opacity = '0';
            } else {
                shadowLabel.style.display = 'block';
                shadowLabel.style.opacity = '1';
            }
        }

        slider.addEventListener('input', updateScene);
        updateScene(); // Initial call
    })();
    </script>
</body>
</html>
