<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-info-panel {
            position: absolute;
            left: 20px;
            top: 60px;
            width: 210px;
            height: 250px;
            background: #f8f9fa;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 15px;
            box-sizing: border-box;
            font-size: 14px;
            line-height: 1.5;
            color: #333;
            transition: all 0.3s ease;
        }
        .scene1-btn {
            padding: 6px 16px;
            font-size: 14px;
            cursor: pointer;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
            transition: background 0.2s;
        }
        .scene1-btn:hover:not(:disabled) { background: #f0f0f0; }
        .scene1-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 14px; font-weight: bold; width: 40px; text-align: center; }
        
        /* SVG Transitions */
        #scene1-svg circle, #scene1-svg line, #scene1-svg text {
            transition: all 0.3s ease;
        }

        .node-label {
            position: absolute;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            font-weight: bold;
            pointer-events: none;
            color: #000;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <div id="scene1-info-panel">
            <div id="scene1-info-content"></div>
        </div>
        
        <svg id="scene1-svg" width="800" height="500">
            <defs>
                <!-- Markers for different colors -->
                <marker id="scene1-arrow-black" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
                </marker>
                <marker id="scene1-arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0" />
                </marker>
                <marker id="scene1-arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828" />
                </marker>
                <marker id="scene1-arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#888888" />
                </marker>
            </defs>

            <!-- Edges -->
            <line id="scene1-edge-ab" x1="460" y1="125" x2="340" y2="215" stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrow-black)" />
            <line id="scene1-edge-bd" x1="340" y1="245" x2="460" y2="335" stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrow-black)" />
            <line id="scene1-edge-dc" x1="500" y1="335" x2="620" y2="245" stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrow-black)" />
            <line id="scene1-edge-ca" x1="620" y1="215" x2="500" y2="125" stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrow-black)" />
            <line id="scene1-edge-da" x1="480" y1="325" x2="480" y2="135" stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrow-black)" />

            <!-- Nodes -->
            <circle id="scene1-node-a" cx="480" cy="110" r="25" fill="rgba(0,0,0,0.1)" stroke="#000000" stroke-width="2" />
            <circle id="scene1-node-b" cx="320" cy="230" r="25" fill="rgba(0,0,0,0.1)" stroke="#000000" stroke-width="2" />
            <circle id="scene1-node-c" cx="640" cy="230" r="25" fill="rgba(0,0,0,0.1)" stroke="#000000" stroke-width="2" />
            <circle id="scene1-node-d" cx="480" cy="350" r="25" fill="rgba(0,0,0,0.1)" stroke="#000000" stroke-width="2" />

            <!-- Labels -->
            <text id="scene1-label-a" x="480" y="65" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#000000">卵</text>
            <text id="scene1-label-b" x="235" y="230" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#000000" opacity="0">若虫</text>
            <text id="scene1-label-c" x="725" y="230" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#000000" opacity="0">成虫</text>
            <text id="scene1-label-d" x="480" y="405" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#000000" opacity="0">成虫</text>
        </svg>

        <!-- HTML Node Labels to avoid SVG overlap detection with circles -->
        <div class="node-label" style="left: 455px; top: 85px;">A</div>
        <div class="node-label" style="left: 295px; top: 205px;">B</div>
        <div class="node-label" style="left: 615px; top: 205px;">C</div>
        <div class="node-label" style="left: 455px; top: 325px;">D</div>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn" disabled>◀ 上一步</button>
            <div id="scene1-step-indicator">1 / 4</div>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const totalSteps = 4;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        const infoContent = document.getElementById('scene1-info-content');

        // SVG Elements
        const edges = {
            ab: document.getElementById('scene1-edge-ab'),
            bd: document.getElementById('scene1-edge-bd'),
            dc: document.getElementById('scene1-edge-dc'),
            ca: document.getElementById('scene1-edge-ca'),
            da: document.getElementById('scene1-edge-da')
        };
        const nodes = {
            a: document.getElementById('scene1-node-a'),
            b: document.getElementById('scene1-node-b'),
            c: document.getElementById('scene1-node-c'),
            d: document.getElementById('scene1-node-d')
        };
        const labels = {
            b: document.getElementById('scene1-label-b'),
            c: document.getElementById('scene1-label-c'),
            d: document.getElementById('scene1-label-d')
        };

        const stepsData = [
            {
                info: "<b>初始状态</b><br><br>请点击“下一步”查看不同昆虫的发育路径，并验证选项。",
                edges: {
                    ab: { color: '#000000', width: 2, dash: 'none' },
                    bd: { color: '#000000', width: 2, dash: 'none' },
                    dc: { color: '#000000', width: 2, dash: 'none' },
                    ca: { color: '#000000', width: 2, dash: 'none' },
                    da: { color: '#000000', width: 2, dash: 'none' }
                },
                nodes: {
                    a: { color: '#000000', dash: 'none' },
                    b: { color: '#000000', dash: 'none' },
                    c: { color: '#000000', dash: 'none' },
                    d: { color: '#000000', dash: 'none' }
                },
                labels: {
                    b: { text: "若虫", color: "#000000", opacity: 0 },
                    c: { text: "成虫", color: "#000000", opacity: 0 },
                    d: { text: "成虫", color: "#000000", opacity: 0 }
                }
            },
            {
                info: "<b>不完全变态</b><br><br>路径：A→B→D→A<br><br>选项B：蝗虫是D(成虫)，正确。<br>选项D：蟋蟀发育不需要C期，错误。",
                edges: {
                    ab: { color: '#1565c0', width: 4, dash: 'none' },
                    bd: { color: '#1565c0', width: 4, dash: 'none' },
                    dc: { color: '#888888', width: 2, dash: '5,5' },
                    ca: { color: '#888888', width: 2, dash: '5,5' },
                    da: { color: '#1565c0', width: 4, dash: 'none' }
                },
                nodes: {
                    a: { color: '#1565c0', dash: 'none' },
                    b: { color: '#1565c0', dash: 'none' },
                    c: { color: '#888888', dash: '5,5' },
                    d: { color: '#1565c0', dash: 'none' }
                },
                labels: {
                    b: { text: "若虫", color: "#1565c0", opacity: 1 },
                    c: { text: "成虫", color: "#888888", opacity: 0 },
                    d: { text: "成虫", color: "#1565c0", opacity: 1 }
                }
            },
            {
                info: "<b>完全变态</b><br><br>路径：A→B→D→C→A<br><br>选项A：蚊的D是蛹期，正确。<br>选项C：家蚕延长B(幼虫)期可提高产量，正确。",
                edges: {
                    ab: { color: '#c62828', width: 4, dash: 'none' },
                    bd: { color: '#c62828', width: 4, dash: 'none' },
                    dc: { color: '#c62828', width: 4, dash: 'none' },
                    ca: { color: '#c62828', width: 4, dash: 'none' },
                    da: { color: '#888888', width: 2, dash: '5,5' }
                },
                nodes: {
                    a: { color: '#c62828', dash: 'none' },
                    b: { color: '#c62828', dash: 'none' },
                    c: { color: '#c62828', dash: 'none' },
                    d: { color: '#c62828', dash: 'none' }
                },
                labels: {
                    b: { text: "幼虫", color: "#c62828", opacity: 1 },
                    c: { text: "成虫", color: "#c62828", opacity: 1 },
                    d: { text: "蛹", color: "#c62828", opacity: 1 }
                }
            },
            {
                info: "<b>总结</b><br><br>综合两种发育模型，节点具有双重身份。<br><br>本题选不正确的，故选 <b>D</b>。",
                edges: {
                    ab: { color: '#000000', width: 2, dash: 'none' },
                    bd: { color: '#000000', width: 2, dash: 'none' },
                    dc: { color: '#000000', width: 2, dash: 'none' },
                    ca: { color: '#000000', width: 2, dash: 'none' },
                    da: { color: '#000000', width: 2, dash: 'none' }
                },
                nodes: {
                    a: { color: '#000000', dash: 'none' },
                    b: { color: '#000000', dash: 'none' },
                    c: { color: '#000000', dash: 'none' },
                    d: { color: '#000000', dash: 'none' }
                },
                labels: {
                    b: { text: "若虫 / 幼虫", color: "#000000", opacity: 1 },
                    c: { text: "无 / 成虫", color: "#000000", opacity: 1 },
                    d: { text: "成虫 / 蛹", color: "#000000", opacity: 1 }
                }
            }
        ];

        function getMarkerId(color) {
            if (color === '#000000') return 'url(#scene1-arrow-black)';
            if (color === '#1565c0') return 'url(#scene1-arrow-blue)';
            if (color === '#c62828') return 'url(#scene1-arrow-red)';
            if (color === '#888888') return 'url(#scene1-arrow-gray)';
            return 'url(#scene1-arrow-black)';
        }

        function updateScene() {
            const data = stepsData[currentStep];
            
            // Update Info
            infoContent.innerHTML = data.info;
            
            // Update Edges
            for (const key in edges) {
                const edgeData = data.edges[key];
                edges[key].setAttribute('stroke', edgeData.color);
                edges[key].setAttribute('stroke-width', edgeData.width);
                edges[key].setAttribute('stroke-dasharray', edgeData.dash);
                edges[key].setAttribute('marker-end', getMarkerId(edgeData.color));
            }
            
            // Update Nodes
            for (const key in nodes) {
                const nodeData = data.nodes[key];
                nodes[key].setAttribute('stroke', nodeData.color);
                nodes[key].setAttribute('stroke-dasharray', nodeData.dash);
            }
            
            // Update Labels
            for (const key in labels) {
                const labelData = data.labels[key];
                labels[key].textContent = labelData.text;
                labels[key].setAttribute('fill', labelData.color);
                labels[key].setAttribute('opacity', labelData.opacity);
            }

            // Update Controls
            stepIndicator.textContent = `${currentStep + 1} / ${totalSteps}`;
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps - 1;
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateScene();
            }
        });

        // Initialize
        updateScene();
    })();
    </script>
</body>
</html>
