<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 6px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .dna-line { stroke-width: 4; stroke-linecap: round; }
        .line-15n { stroke: #c62828; }
        .line-14n { stroke: #1565c0; }
        .rep-line { stroke: #888888; stroke-width: 1.5; stroke-dasharray: 4 4; }
        .label-text { font-size: 14px; fill: #333; text-anchor: middle; dominant-baseline: middle; }
        .legend-text { font-size: 14px; fill: #333; dominant-baseline: middle; }
        .conclusion-text { font-size: 16px; fill: #333; text-anchor: middle; font-weight: bold; }
        .highlight-red { fill: #c62828; }
        
        /* Animation classes */
        .step-element { opacity: 0; transition: opacity 0.5s ease; }
        .step-element.visible { opacity: 1; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg width="800" height="500" id="scene3-svg">
            <!-- 图例 -->
            <line x1="650" y1="40" x2="680" y2="40" class="dna-line line-15n" />
            <text x="690" y="42" class="legend-text">15N 母链</text>
            <line x1="650" y1="60" x2="680" y2="60" class="dna-line line-14n" />
            <text x="690" y="62" class="legend-text">14N 新链</text>

            <!-- 代数标签 -->
            <text x="60" y="85" class="label-text">亲代</text>
            <text x="60" y="165" class="label-text step-element step-1 step-2 step-3">第1代</text>
            <text x="60" y="245" class="label-text step-element step-2 step-3">第2代</text>
            <text x="60" y="325" class="label-text step-element step-3">第3代</text>

            <!-- 复制连线 -->
            <!-- 亲代到第1代 -->
            <g class="step-element step-1 step-2 step-3">
                <line x1="400" y1="95" x2="240" y2="145" class="rep-line" />
                <line x1="400" y1="95" x2="560" y2="145" class="rep-line" />
            </g>
            <!-- 第1代到第2代 -->
            <g class="step-element step-2 step-3">
                <line x1="240" y1="175" x2="160" y2="225" class="rep-line" />
                <line x1="240" y1="175" x2="320" y2="225" class="rep-line" />
                <line x1="560" y1="175" x2="480" y2="225" class="rep-line" />
                <line x1="560" y1="175" x2="640" y2="225" class="rep-line" />
            </g>
            <!-- 第2代到第3代 -->
            <g class="step-element step-3">
                <line x1="160" y1="255" x2="120" y2="305" class="rep-line" />
                <line x1="160" y1="255" x2="200" y2="305" class="rep-line" />
                <line x1="320" y1="255" x2="280" y2="305" class="rep-line" />
                <line x1="320" y1="255" x2="360" y2="305" class="rep-line" />
                <line x1="480" y1="255" x2="440" y2="305" class="rep-line" />
                <line x1="480" y1="255" x2="520" y2="305" class="rep-line" />
                <line x1="640" y1="255" x2="600" y2="305" class="rep-line" />
                <line x1="640" y1="255" x2="680" y2="305" class="rep-line" />
            </g>

            <!-- DNA 分子 -->
            <!-- 亲代 -->
            <g id="scene3-dna-parent">
                <line x1="380" y1="81" x2="420" y2="81" class="dna-line line-15n" />
                <line x1="380" y1="89" x2="420" y2="89" class="dna-line line-15n" />
            </g>

            <!-- 第1代 -->
            <g class="step-element step-1 step-2 step-3">
                <!-- 1-1 -->
                <line x1="220" y1="161" x2="260" y2="161" class="dna-line line-15n" />
                <line x1="220" y1="169" x2="260" y2="169" class="dna-line line-14n" />
                <!-- 1-2 -->
                <line x1="540" y1="161" x2="580" y2="161" class="dna-line line-14n" />
                <line x1="540" y1="169" x2="580" y2="169" class="dna-line line-15n" />
            </g>

            <!-- 第2代 -->
            <g class="step-element step-2 step-3">
                <!-- 2-1 -->
                <line x1="140" y1="241" x2="180" y2="241" class="dna-line line-15n" />
                <line x1="140" y1="249" x2="180" y2="249" class="dna-line line-14n" />
                <!-- 2-2 -->
                <line x1="300" y1="241" x2="340" y2="241" class="dna-line line-14n" />
                <line x1="300" y1="249" x2="340" y2="249" class="dna-line line-14n" />
                <!-- 2-3 -->
                <line x1="460" y1="241" x2="500" y2="241" class="dna-line line-14n" />
                <line x1="460" y1="249" x2="500" y2="249" class="dna-line line-14n" />
                <!-- 2-4 -->
                <line x1="620" y1="241" x2="660" y2="241" class="dna-line line-14n" />
                <line x1="620" y1="249" x2="660" y2="249" class="dna-line line-15n" />
            </g>

            <!-- 第3代 -->
            <g class="step-element step-3">
                <!-- 3-1 -->
                <line x1="100" y1="321" x2="140" y2="321" class="dna-line line-15n" />
                <line x1="100" y1="329" x2="140" y2="329" class="dna-line line-14n" />
                <!-- 3-2 -->
                <line x1="180" y1="321" x2="220" y2="321" class="dna-line line-14n" />
                <line x1="180" y1="329" x2="220" y2="329" class="dna-line line-14n" />
                <!-- 3-3 -->
                <line x1="260" y1="321" x2="300" y2="321" class="dna-line line-14n" />
                <line x1="260" y1="329" x2="300" y2="329" class="dna-line line-14n" />
                <!-- 3-4 -->
                <line x1="340" y1="321" x2="380" y2="321" class="dna-line line-14n" />
                <line x1="340" y1="329" x2="380" y2="329" class="dna-line line-14n" />
                <!-- 3-5 -->
                <line x1="420" y1="321" x2="460" y2="321" class="dna-line line-14n" />
                <line x1="420" y1="329" x2="460" y2="329" class="dna-line line-14n" />
                <!-- 3-6 -->
                <line x1="500" y1="321" x2="540" y2="321" class="dna-line line-14n" />
                <line x1="500" y1="329" x2="540" y2="329" class="dna-line line-14n" />
                <!-- 3-7 -->
                <line x1="580" y1="321" x2="620" y2="321" class="dna-line line-14n" />
                <line x1="580" y1="329" x2="620" y2="329" class="dna-line line-14n" />
                <!-- 3-8 -->
                <line x1="660" y1="321" x2="700" y2="321" class="dna-line line-14n" />
                <line x1="660" y1="329" x2="700" y2="329" class="dna-line line-15n" />
            </g>

            <!-- 结论文本 -->
            <g class="step-element step-3">
                <text x="400" y="390" class="conclusion-text">复制3次后，共8个DNA分子。含14N的分子有8个，占比 100%。</text>
                <text x="400" y="430" class="conclusion-text highlight-red">选项D错误</text>
            </g>
        </svg>

        <div id="scene3-controls">
            <button id="scene3-btn-prev" disabled>◀ 上一步</button>
            <button id="scene3-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 3;
        const btnPrev = document.getElementById('scene3-btn-prev');
        const btnNext = document.getElementById('scene3-btn-next');
        const stepElements = document.querySelectorAll('.step-element');

        function updateScene() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;

            stepElements.forEach(el => {
                if (el.classList.contains(`step-${currentStep}`)) {
                    el.classList.add('visible');
                } else {
                    // We want elements from previous steps to remain visible
                    let shouldBeVisible = false;
                    for (let i = 1; i <= currentStep; i++) {
                        if (el.classList.contains(`step-${i}`)) {
                            shouldBeVisible = true;
                            break;
                        }
                    }
                    if (shouldBeVisible) {
                        el.classList.add('visible');
                    } else {
                        el.classList.remove('visible');
                    }
                }
            });
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });

        // Initialize
        updateScene();
    })();
    </script>
</body>
</html>
