<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .fade { transition: opacity 0.3s ease; }
        .hidden { opacity: 0; pointer-events: none; }
        .visible { opacity: 1; pointer-events: auto; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- 基础图形 (Step 0) -->
            <g id="scene1-step0-group">
                <!-- 河岸 -->
                <line x1="100" y1="113" x2="700" y2="113" stroke="#000" stroke-width="2" />
                <line x1="100" y1="350" x2="700" y2="350" stroke="#000" stroke-width="2" />
                
                <!-- 三角形 ABC -->
                <polygon points="279,350 579,350 342,113" fill="none" stroke="#000" stroke-width="2" id="scene1-triangle-abc" />
                
                <!-- 顶点标签 -->
                <text x="279" y="370" font-size="16" fill="#000" text-anchor="middle">A</text>
                <text x="579" y="370" font-size="16" fill="#000" text-anchor="middle">B</text>
                <text x="342" y="100" font-size="16" fill="#000" text-anchor="middle">C</text>
            </g>

            <!-- 已知条件 (Step 1) -->
            <g id="scene1-step1-group" class="fade hidden">
                <!-- ∠A = 75° -->
                <path d="M 309 350 A 30 30 0 0 0 286.5 321" fill="none" stroke="#1565c0" stroke-width="2" />
                <line x1="295" y1="335" x2="255" y2="335" stroke="#1565c0" stroke-width="1" stroke-dasharray="2,2" />
                <text x="245" y="340" font-size="14" fill="#1565c0" text-anchor="end">75°</text>
                
                <!-- ∠B = 45° -->
                <path d="M 539 350 A 40 40 0 0 1 550.7 321.7" fill="none" stroke="#1565c0" stroke-width="2" />
                <line x1="545" y1="335" x2="605" y2="335" stroke="#1565c0" stroke-width="1" stroke-dasharray="2,2" />
                <text x="610" y="340" font-size="14" fill="#1565c0" text-anchor="start">45°</text>
                
                <!-- AB = 96 -->
                <text x="429" y="370" font-size="14" fill="#1565c0" text-anchor="middle">96</text>
            </g>

            <!-- 推导条件 (Step 2) -->
            <g id="scene1-step2-group" class="fade hidden">
                <!-- ∠C = 60° -->
                <path d="M 334.5 141.5 A 30 30 0 0 0 363.2 134.2" fill="none" stroke="#2e7d32" stroke-width="2" />
                <line x1="348" y1="142" x2="260" y2="142" stroke="#2e7d32" stroke-width="1" stroke-dasharray="2,2" />
                <text x="250" y="147" font-size="14" fill="#2e7d32" text-anchor="end">60°</text>
            </g>

            <!-- 高线 (Step 3) -->
            <g id="scene1-step3-group" class="fade hidden">
                <!-- 高线 CD -->
                <line x1="342" y1="113" x2="342" y2="350" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5" id="scene1-line-cd" />
                
                <!-- 垂足 D -->
                <text x="342" y="370" font-size="16" fill="#000" text-anchor="middle">D</text>
                
                <!-- 直角符号 -->
                <polyline points="342,340 352,340 352,350" fill="none" stroke="#c62828" stroke-width="2" />
                
                <!-- 河宽 h -->
                <line x1="342" y1="231" x2="265" y2="231" stroke="#c62828" stroke-width="1" stroke-dasharray="2,2" />
                <text x="255" y="236" font-size="16" fill="#c62828" text-anchor="end">h</text>
            </g>

            <!-- 高亮区域 (Step 4 & 5) -->
            <g id="scene1-step4-highlight" class="fade hidden">
                <polygon points="279,350 579,350 342,113" fill="#1565c0" opacity="0.1" />
                <line x1="279" y1="350" x2="342" y2="113" stroke="#1565c0" stroke-width="4" />
            </g>
            
            <g id="scene1-step5-highlight" class="fade hidden">
                <polygon points="279,350 342,113 342,350" fill="#c62828" opacity="0.1" />
                <line x1="342" y1="113" x2="342" y2="350" stroke="#c62828" stroke-width="4" />
            </g>

            <!-- 提示文本 -->
            <text x="400" y="420" font-size="16" fill="#000" text-anchor="middle" id="scene1-hint-text"></text>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 5;
        
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const hintText = document.getElementById('scene1-hint-text');
        
        const step1Group = document.getElementById('scene1-step1-group');
        const step2Group = document.getElementById('scene1-step2-group');
        const step3Group = document.getElementById('scene1-step3-group');
        const step4Highlight = document.getElementById('scene1-step4-highlight');
        const step5Highlight = document.getElementById('scene1-step5-highlight');
        
        const hints = [
            "",
            "已知：∠CAB = 75°, ∠CBA = 45°, AB = 96",
            "计算第三角：∠C = 180° - 75° - 45° = 60°",
            "作高线 CD，设河宽为 h",
            "在 △ABC 中，由正弦定理得：AC / sin 45° = AB / sin 60°",
            "在 Rt△ACD 中，h = AC · sin 75°"
        ];

        function updateScene() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
            
            hintText.textContent = hints[currentStep];
            
            function setVisible(el, isVisible) {
                if (isVisible) {
                    el.classList.remove('hidden');
                    el.classList.add('visible');
                } else {
                    el.classList.remove('visible');
                    el.classList.add('hidden');
                }
            }
            
            setVisible(step1Group, currentStep >= 1);
            setVisible(step2Group, currentStep >= 2);
            setVisible(step3Group, currentStep >= 3);
            setVisible(step4Highlight, currentStep === 4);
            setVisible(step5Highlight, currentStep === 5);
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });

        updateScene();
    })();
    </script>
</body>
</html>
