<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .wire { fill: none; stroke: #000000; stroke-width: 2; transition: stroke 0.3s, stroke-width 0.3s; }
        .wire-red { stroke: #c62828; stroke-width: 4; }
        .wire-green { stroke: #2e7d32; stroke-width: 4; }
        .wire-blue { stroke: #1565c0; stroke-width: 4; }
        
        .aux-line { fill: none; stroke: #888888; stroke-width: 2; stroke-dasharray: 5,5; }
        #scene1-aux-lines { opacity: 0; transition: opacity 0.5s; }
        #scene1-aux-lines.show { opacity: 1; }
        
        .fade { opacity: 0; transition: opacity 0.5s; }
        .fade.show { opacity: 1; }
        
        #scene1-physical-group { transition: transform 0.8s ease-in-out; }
        #scene1-circuit-group { opacity: 0; transition: opacity 0.8s ease-in-out; }
        #scene1-circuit-group.show { opacity: 1; }
        
        .arrow { display: none; }
        .arrow.show { display: block; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <defs>
                <polygon id="scene1-arrow-red" points="-6,-4 6,0 -6,4" fill="#c62828" />
                <polygon id="scene1-arrow-green" points="-6,-4 6,0 -6,4" fill="#2e7d32" />
                <polygon id="scene1-arrow-blue" points="-6,-4 6,0 -6,4" fill="#1565c0" />
            </defs>
            
            <!-- Auxiliary lines -->
            <g id="scene1-aux-lines">
                <!-- Merge aux lines -->
                <line x1="80" y1="350" x2="80" y2="445" class="aux-line" />
                <line x1="80" y1="445" x2="540" y2="445" class="aux-line" />
                <line x1="540" y1="445" x2="540" y2="250" class="aux-line" />
                
                <!-- Split aux lines -->
                <line x1="420" y1="350" x2="420" y2="430" class="aux-line" />
                <line x1="420" y1="430" x2="740" y2="430" class="aux-line" />
                <line x1="740" y1="430" x2="740" y2="250" class="aux-line" />
            </g>
            
            <!-- Physical Group -->
            <g id="scene1-physical-group">
                <!-- Wires -->
                <path id="scene1-wire-w1" class="wire" d="M 280 120 Q 425 70 570 120" />
                <path id="scene1-wire-w2" class="wire" d="M 530 120 Q 600 235 570 350" />
                <path id="scene1-wire-w3" class="wire" d="M 570 350 Q 420 390 270 350" />
                <path id="scene1-wire-w4" class="wire" d="M 530 350 Q 480 285 420 220" />
                <path id="scene1-wire-w5" class="wire" d="M 380 220 Q 320 285 230 350" />
                <path id="scene1-wire-w6" class="wire" d="M 230 350 Q 170 235 220 120" />
                
                <!-- Components -->
                <!-- Power -->
                <rect x="220" y="100" width="60" height="40" fill="#fff" stroke="#000" stroke-width="2" />
                <text x="250" y="60" text-anchor="middle" font-size="16">电源</text>
                <text x="210" y="90" text-anchor="middle" font-size="16">-</text>
                <text x="290" y="90" text-anchor="middle" font-size="16">+</text>
                
                <!-- Switch -->
                <rect x="525" y="110" width="50" height="20" fill="#fff" stroke="#000" stroke-width="2" />
                <line x1="530" y1="120" x2="560" y2="100" stroke="#000" stroke-width="2" />
                <text x="550" y="55" text-anchor="middle" font-size="16">开关</text>
                
                <!-- Ammeter -->
                <rect x="370" y="195" width="60" height="50" fill="#fff" stroke="#000" stroke-width="2" />
                <text x="400" y="150" text-anchor="middle" font-size="16">电流表</text>
                <text x="350" y="180" text-anchor="middle" font-size="16">-</text>
                <text x="450" y="180" text-anchor="middle" font-size="16">+</text>
                
                <!-- L1 -->
                <circle cx="250" cy="340" r="15" fill="#fff" stroke="#000" stroke-width="2" />
                <path d="M 240 350 L 260 330 M 240 330 L 260 350" stroke="#000" stroke-width="2" />
                <rect x="225" y="355" width="50" height="10" fill="#fff" stroke="#000" stroke-width="2" />
                <text x="250" y="400" text-anchor="middle" font-size="16">L1</text>
                
                <!-- L2 -->
                <circle cx="550" cy="340" r="15" fill="#fff" stroke="#000" stroke-width="2" />
                <path d="M 540 350 L 560 330 M 540 330 L 560 350" stroke="#000" stroke-width="2" />
                <rect x="525" y="355" width="50" height="10" fill="#fff" stroke="#000" stroke-width="2" />
                <text x="550" y="400" text-anchor="middle" font-size="16">L2</text>
                
                <!-- Split/Merge Points -->
                <circle id="scene1-split-pt" cx="570" cy="350" r="5" fill="#c62828" class="fade" />
                <text id="scene1-split-lbl" x="610" y="375" text-anchor="middle" font-size="16" fill="#c62828" class="fade">分流点</text>
                
                <circle id="scene1-merge-pt" cx="230" cy="350" r="5" fill="#1565c0" class="fade" />
                <text id="scene1-merge-lbl" x="180" y="385" text-anchor="middle" font-size="16" fill="#1565c0" class="fade">汇流点</text>
                
                <!-- Arrows -->
                <g id="scene1-arrow-w1" class="arrow"><use href="#scene1-arrow-red" /><animateMotion dur="2s" repeatCount="indefinite"><mpath href="#scene1-wire-w1"/></animateMotion></g>
                <g id="scene1-arrow-w2" class="arrow"><use href="#scene1-arrow-red" /><animateMotion dur="2s" repeatCount="indefinite"><mpath href="#scene1-wire-w2"/></animateMotion></g>
                <g id="scene1-arrow-w3" class="arrow"><use href="#scene1-arrow-green" /><animateMotion dur="2s" repeatCount="indefinite"><mpath href="#scene1-wire-w3"/></animateMotion></g>
                <g id="scene1-arrow-w4" class="arrow"><use href="#scene1-arrow-blue" /><animateMotion dur="2s" repeatCount="indefinite"><mpath href="#scene1-wire-w4"/></animateMotion></g>
                <g id="scene1-arrow-w5" class="arrow"><use href="#scene1-arrow-blue" /><animateMotion dur="2s" repeatCount="indefinite"><mpath href="#scene1-wire-w5"/></animateMotion></g>
                <g id="scene1-arrow-w6" class="arrow"><use href="#scene1-arrow-red" /><animateMotion dur="2s" repeatCount="indefinite"><mpath href="#scene1-wire-w6"/></animateMotion></g>
            </g>
            
            <!-- Circuit Group -->
            <g id="scene1-circuit-group">
                <!-- Wires -->
                <path id="scene1-c-w1a-1" class="wire" d="M 660 100 L 740 100" />
                <path id="scene1-c-w1a-2" class="wire" d="M 740 100 L 740 140" />
                <path id="scene1-c-w1b" class="wire" d="M 740 180 L 740 250" />
                
                <path id="scene1-c-w3a-1" class="wire" d="M 740 250 L 740 350" />
                <path id="scene1-c-w3a-2" class="wire" d="M 740 350 L 655 350" />
                <path id="scene1-c-w3b-1" class="wire" d="M 625 350 L 540 350" />
                <path id="scene1-c-w3b-2" class="wire" d="M 540 350 L 540 250" />
                
                <path id="scene1-c-w4a" class="wire" d="M 740 250 L 695 250" />
                <path id="scene1-c-w4b" class="wire" d="M 665 250 L 615 250" />
                <path id="scene1-c-w4c" class="wire" d="M 585 250 L 540 250" />
                
                <path id="scene1-c-w6-1" class="wire" d="M 540 250 L 540 100" />
                <path id="scene1-c-w6-2" class="wire" d="M 540 100 L 620 100" />
                
                <!-- Components -->
                <!-- Power -->
                <line x1="620" y1="100" x2="660" y2="100" stroke="#000" stroke-width="2" />
                <line x1="635" y1="90" x2="635" y2="110" stroke="#000" stroke-width="2" />
                <line x1="645" y1="80" x2="645" y2="120" stroke="#000" stroke-width="2" />
                <text x="640" y="70" text-anchor="middle" font-size="16">电源</text>
                
                <!-- Switch -->
                <circle cx="740" cy="140" r="3" fill="#fff" stroke="#000" stroke-width="2" />
                <circle cx="740" cy="180" r="3" fill="#fff" stroke="#000" stroke-width="2" />
                <line x1="740" y1="140" x2="760" y2="170" stroke="#000" stroke-width="2" />
                <text x="700" y="165" text-anchor="middle" font-size="16">开关</text>
                
                <!-- L2 -->
                <circle cx="680" cy="250" r="15" fill="#fff" stroke="#000" stroke-width="2" />
                <path d="M 670 240 L 690 260 M 670 260 L 690 240" stroke="#000" stroke-width="2" />
                <text x="680" y="220" text-anchor="middle" font-size="16">L2</text>
                
                <!-- Ammeter -->
                <circle cx="600" cy="250" r="15" fill="#fff" stroke="#000" stroke-width="2" />
                <text x="600" y="220" text-anchor="middle" font-size="16">电流表</text>
                
                <!-- L1 -->
                <circle cx="640" cy="350" r="15" fill="#fff" stroke="#000" stroke-width="2" />
                <path d="M 630 340 L 650 360 M 630 360 L 650 340" stroke="#000" stroke-width="2" />
                <text x="640" y="320" text-anchor="middle" font-size="16">L1</text>
                
                <!-- Split/Merge Points -->
                <circle cx="740" cy="250" r="4" fill="#000" />
                <text x="710" y="270" text-anchor="middle" font-size="16">分流点</text>
                
                <circle cx="540" cy="250" r="4" fill="#000" />
                <text x="510" y="270" text-anchor="middle" font-size="16">汇流点</text>
                
                <!-- Arrows for Circuit -->
                <g id="scene1-c-arrow-w1a" class="arrow"><use href="#scene1-arrow-red" /><animateMotion dur="2s" repeatCount="indefinite"><mpath href="#scene1-c-w1a-1"/></animateMotion></g>
                <g id="scene1-c-arrow-w1b" class="arrow"><use href="#scene1-arrow-red" /><animateMotion dur="2s" repeatCount="indefinite"><mpath href="#scene1-c-w1b"/></animateMotion></g>
                <g id="scene1-c-arrow-w3a" class="arrow"><use href="#scene1-arrow-green" /><animateMotion dur="2s" repeatCount="indefinite"><mpath href="#scene1-c-w3a-1"/></animateMotion></g>
                <g id="scene1-c-arrow-w3b" class="arrow"><use href="#scene1-arrow-green" /><animateMotion dur="2s" repeatCount="indefinite"><mpath href="#scene1-c-w3b-1"/></animateMotion></g>
                <g id="scene1-c-arrow-w4a" class="arrow"><use href="#scene1-arrow-blue" /><animateMotion dur="2s" repeatCount="indefinite"><mpath href="#scene1-c-w4a"/></animateMotion></g>
                <g id="scene1-c-arrow-w4b" class="arrow"><use href="#scene1-arrow-blue" /><animateMotion dur="2s" repeatCount="indefinite"><mpath href="#scene1-c-w4b"/></animateMotion></g>
                <g id="scene1-c-arrow-w4c" class="arrow"><use href="#scene1-arrow-blue" /><animateMotion dur="2s" repeatCount="indefinite"><mpath href="#scene1-c-w4c"/></animateMotion></g>
                <g id="scene1-c-arrow-w6" class="arrow"><use href="#scene1-arrow-red" /><animateMotion dur="2s" repeatCount="indefinite"><mpath href="#scene1-c-w6-1"/></animateMotion></g>
            </g>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 5;
        
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        
        const physicalGroup = document.getElementById('scene1-physical-group');
        const circuitGroup = document.getElementById('scene1-circuit-group');
        const auxLines = document.getElementById('scene1-aux-lines');
        
        const wires = {
            w1: document.getElementById('scene1-wire-w1'),
            w2: document.getElementById('scene1-wire-w2'),
            w3: document.getElementById('scene1-wire-w3'),
            w4: document.getElementById('scene1-wire-w4'),
            w5: document.getElementById('scene1-wire-w5'),
            w6: document.getElementById('scene1-wire-w6'),
            cw1a1: document.getElementById('scene1-c-w1a-1'),
            cw1a2: document.getElementById('scene1-c-w1a-2'),
            cw1b: document.getElementById('scene1-c-w1b'),
            cw3a1: document.getElementById('scene1-c-w3a-1'),
            cw3a2: document.getElementById('scene1-c-w3a-2'),
            cw3b1: document.getElementById('scene1-c-w3b-1'),
            cw3b2: document.getElementById('scene1-c-w3b-2'),
            cw4a: document.getElementById('scene1-c-w4a'),
            cw4b: document.getElementById('scene1-c-w4b'),
            cw4c: document.getElementById('scene1-c-w4c'),
            cw61: document.getElementById('scene1-c-w6-1'),
            cw62: document.getElementById('scene1-c-w6-2')
        };
        
        const arrows = {
            w1: document.getElementById('scene1-arrow-w1'),
            w2: document.getElementById('scene1-arrow-w2'),
            w3: document.getElementById('scene1-arrow-w3'),
            w4: document.getElementById('scene1-arrow-w4'),
            w5: document.getElementById('scene1-arrow-w5'),
            w6: document.getElementById('scene1-arrow-w6'),
            cw1a: document.getElementById('scene1-c-arrow-w1a'),
            cw1b: document.getElementById('scene1-c-arrow-w1b'),
            cw3a: document.getElementById('scene1-c-arrow-w3a'),
            cw3b: document.getElementById('scene1-c-arrow-w3b'),
            cw4a: document.getElementById('scene1-c-arrow-w4a'),
            cw4b: document.getElementById('scene1-c-arrow-w4b'),
            cw4c: document.getElementById('scene1-c-arrow-w4c'),
            cw6: document.getElementById('scene1-c-arrow-w6')
        };
        
        const splitPt = document.getElementById('scene1-split-pt');
        const splitLbl = document.getElementById('scene1-split-lbl');
        const mergePt = document.getElementById('scene1-merge-pt');
        const mergeLbl = document.getElementById('scene1-merge-lbl');
        
        function updateScene() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
            
            // Reset all
            Object.values(wires).forEach(w => w.className.baseVal = 'wire');
            Object.values(arrows).forEach(a => a.classList.remove('show'));
            splitPt.classList.remove('show');
            splitLbl.classList.remove('show');
            mergePt.classList.remove('show');
            mergeLbl.classList.remove('show');
            physicalGroup.style.transform = 'translate(0, 0)';
            circuitGroup.classList.remove('show');
            auxLines.classList.remove('show');
            
            if (currentStep >= 1) {
                wires.w1.className.baseVal = 'wire wire-red';
                wires.w2.className.baseVal = 'wire wire-red';
                arrows.w1.classList.add('show');
                arrows.w2.classList.add('show');
                splitPt.classList.add('show');
                splitLbl.classList.add('show');
            }
            if (currentStep >= 2) {
                wires.w3.className.baseVal = 'wire wire-green';
                arrows.w3.classList.add('show');
            }
            if (currentStep >= 3) {
                wires.w4.className.baseVal = 'wire wire-blue';
                wires.w5.className.baseVal = 'wire wire-blue';
                arrows.w4.classList.add('show');
                arrows.w5.classList.add('show');
                mergePt.classList.add('show');
                mergeLbl.classList.add('show');
            }
            if (currentStep >= 4) {
                wires.w6.className.baseVal = 'wire wire-red';
                arrows.w6.classList.add('show');
            }
            if (currentStep >= 5) {
                physicalGroup.style.transform = 'translate(-150px, 0)';
                circuitGroup.classList.add('show');
                auxLines.classList.add('show');
                
                // Circuit wires color
                wires.cw1a1.className.baseVal = 'wire wire-red';
                wires.cw1a2.className.baseVal = 'wire wire-red';
                wires.cw1b.className.baseVal = 'wire wire-red';
                wires.cw3a1.className.baseVal = 'wire wire-green';
                wires.cw3a2.className.baseVal = 'wire wire-green';
                wires.cw3b1.className.baseVal = 'wire wire-green';
                wires.cw3b2.className.baseVal = 'wire wire-green';
                wires.cw4a.className.baseVal = 'wire wire-blue';
                wires.cw4b.className.baseVal = 'wire wire-blue';
                wires.cw4c.className.baseVal = 'wire wire-blue';
                wires.cw61.className.baseVal = 'wire wire-red';
                wires.cw62.className.baseVal = 'wire wire-red';
                
                arrows.cw1a.classList.add('show');
                arrows.cw1b.classList.add('show');
                arrows.cw3a.classList.add('show');
                arrows.cw3b.classList.add('show');
                arrows.cw4a.classList.add('show');
                arrows.cw4b.classList.add('show');
                arrows.cw4c.classList.add('show');
                arrows.cw6.classList.add('show');
            }
        }
        
        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });
        
        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });
        
        updateScene();
    })();
    </script>
</body>
</html>
