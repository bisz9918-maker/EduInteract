<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 20px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene2-data-panel { position: absolute; top: 100px; right: 20px; width: 220px; height: 250px; background: rgba(255,255,255,0.9); border: 1px solid #ccc; border-radius: 8px; padding: 15px; box-sizing: border-box; font-size: 16px; line-height: 1.8; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .math-text { font-family: 'Times New Roman', Times, serif; font-style: italic; }
        input[type=range] { width: 300px; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500">
            <!-- 静态元素 -->
            <ellipse cx="320" cy="250" rx="180" ry="108" fill="none" stroke="#000000" stroke-width="2" />
            <line x1="140" y1="250" x2="500" y2="250" stroke="#000000" stroke-width="1" />
            
            <!-- 切线 AC, BD -->
            <line x1="140" y1="50" x2="140" y2="450" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" />
            <line x1="500" y1="50" x2="500" y2="450" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" />
            
            <!-- 动态线段 -->
            <line id="scene2-line-pc" stroke="#1565c0" stroke-width="3" />
            <line id="scene2-line-pd" stroke="#1565c0" stroke-width="3" />
            <line id="scene2-line-pf1" stroke="#c62828" stroke-width="2" />
            <line id="scene2-line-pf2" stroke="#c62828" stroke-width="2" />
            <line id="scene2-line-cd" stroke="#000000" stroke-width="1" />
            
            <!-- 静态点 -->
            <circle cx="320" cy="250" r="3" fill="#000000" />
            <circle cx="464" cy="250" r="3" fill="#000000" />
            <circle cx="176" cy="250" r="3" fill="#000000" />
            <circle cx="140" cy="250" r="3" fill="#000000" />
            <circle cx="500" cy="250" r="3" fill="#000000" />
            
            <!-- 静态标签 -->
            <text x="320" y="275" font-family="sans-serif" font-size="16" fill="#000000" text-anchor="middle">O</text>
            <text x="464" y="275" font-family="sans-serif" font-size="16" fill="#000000" text-anchor="middle">F<tspan baseline-shift="sub" font-size="12">1</tspan></text>
            <text x="176" y="275" font-family="sans-serif" font-size="16" fill="#000000" text-anchor="middle">F<tspan baseline-shift="sub" font-size="12">2</tspan></text>
            <text x="125" y="275" font-family="sans-serif" font-size="16" fill="#000000" text-anchor="middle">A</text>
            <text x="515" y="275" font-family="sans-serif" font-size="16" fill="#000000" text-anchor="middle">B</text>
            
            <!-- 动态点 -->
            <circle id="scene2-point-p" r="4" fill="#000000" />
            <circle id="scene2-point-c" r="3" fill="#000000" />
            <circle id="scene2-point-d" r="3" fill="#000000" />
            
            <!-- 动态标签 -->
            <text id="scene2-label-p" font-family="sans-serif" font-size="16" fill="#000000" text-anchor="middle">P</text>
            <text id="scene2-label-c" font-family="sans-serif" font-size="16" fill="#000000" text-anchor="end">C</text>
            <text id="scene2-label-d" font-family="sans-serif" font-size="16" fill="#000000" text-anchor="start">D</text>
        </svg>
        
        <div id="scene2-data-panel">
            <div><span class="math-text">PC</span> = <span id="scene2-val-pc">0.0</span></div>
            <div><span class="math-text">PD</span> = <span id="scene2-val-pd">0.0</span></div>
            <div style="color: #1565c0; font-weight: bold; margin-bottom: 10px;"><span class="math-text">PC &middot; PD</span> = <span id="scene2-val-prod1">0.0</span></div>
            
            <div><span class="math-text">PF<sub>1</sub></span> = <span id="scene2-val-pf1">0.0</span></div>
            <div><span class="math-text">PF<sub>2</sub></span> = <span id="scene2-val-pf2">0.0</span></div>
            <div style="color: #c62828; font-weight: bold;"><span class="math-text">PF<sub>1</sub> &middot; PF<sub>2</sub></span> = <span id="scene2-val-prod2">0.0</span></div>
        </div>
        
        <div id="scene2-controls">
            <label for="scene2-slider" style="font-size: 14px;">拖动改变点 P 位置：</label>
            <input type="range" id="scene2-slider" min="0.9" max="2.24" step="0.01" value="2.09">
        </div>
    </div>
    <script>
    (function() {
        const slider = document.getElementById('scene2-slider');
        
        const linePC = document.getElementById('scene2-line-pc');
        const linePD = document.getElementById('scene2-line-pd');
        const linePF1 = document.getElementById('scene2-line-pf1');
        const linePF2 = document.getElementById('scene2-line-pf2');
        const lineCD = document.getElementById('scene2-line-cd');
        
        const pointP = document.getElementById('scene2-point-p');
        const pointC = document.getElementById('scene2-point-c');
        const pointD = document.getElementById('scene2-point-d');
        
        const labelP = document.getElementById('scene2-label-p');
        const labelC = document.getElementById('scene2-label-c');
        const labelD = document.getElementById('scene2-label-d');
        
        const valPC = document.getElementById('scene2-val-pc');
        const valPD = document.getElementById('scene2-val-pd');
        const valProd1 = document.getElementById('scene2-val-prod1');
        const valPF1 = document.getElementById('scene2-val-pf1');
        const valPF2 = document.getElementById('scene2-val-pf2');
        const valProd2 = document.getElementById('scene2-val-prod2');
        
        const cx = 320, cy = 250;
        const rx = 180, ry = 108;
        const f1x = 464, f1y = 250;
        const f2x = 176, f2y = 250;
        const ax = 140, bx = 500;
        
        function updateScene() {
            const theta = parseFloat(slider.value);
            
            // P 点坐标
            const px = cx + rx * Math.cos(theta);
            const py = cy - ry * Math.sin(theta);
            
            // C 点坐标 (x=140)
            const cy_c = cy - ry * (1 + Math.cos(theta)) / Math.sin(theta);
            
            // D 点坐标 (x=500)
            const dy_d = cy - ry * (1 - Math.cos(theta)) / Math.sin(theta);
            
            // 更新点
            pointP.setAttribute('cx', px);
            pointP.setAttribute('cy', py);
            pointC.setAttribute('cx', ax);
            pointC.setAttribute('cy', cy_c);
            pointD.setAttribute('cx', bx);
            pointD.setAttribute('cy', dy_d);
            
            // 更新线段
            linePC.setAttribute('x1', px); linePC.setAttribute('y1', py);
            linePC.setAttribute('x2', ax); linePC.setAttribute('y2', cy_c);
            
            linePD.setAttribute('x1', px); linePD.setAttribute('y1', py);
            linePD.setAttribute('x2', bx); linePD.setAttribute('y2', dy_d);
            
            linePF1.setAttribute('x1', px); linePF1.setAttribute('y1', py);
            linePF1.setAttribute('x2', f1x); linePF1.setAttribute('y2', f1y);
            
            linePF2.setAttribute('x1', px); linePF2.setAttribute('y1', py);
            linePF2.setAttribute('x2', f2x); linePF2.setAttribute('y2', f2y);
            
            lineCD.setAttribute('x1', ax); lineCD.setAttribute('y1', cy_c);
            lineCD.setAttribute('x2', bx); lineCD.setAttribute('y2', dy_d);
            
            // 更新标签位置
            labelP.setAttribute('x', px + 25 * Math.cos(theta));
            labelP.setAttribute('y', py - 25 * Math.sin(theta) - 20);
            
            labelC.setAttribute('x', ax - 10);
            labelC.setAttribute('y', cy_c + 5);
            
            labelD.setAttribute('x', bx + 10);
            labelD.setAttribute('y', dy_d + 5);
            
            // 计算距离
            const distPC = Math.hypot(px - ax, py - cy_c);
            const distPD = Math.hypot(px - bx, py - dy_d);
            const distPF1 = Math.hypot(px - f1x, py - f1y);
            const distPF2 = Math.hypot(px - f2x, py - f2y);
            
            // 更新数据面板
            valPC.textContent = distPC.toFixed(1);
            valPD.textContent = distPD.toFixed(1);
            valProd1.textContent = (distPC * distPD).toFixed(1);
            
            valPF1.textContent = distPF1.toFixed(1);
            valPF2.textContent = distPF2.toFixed(1);
            valProd2.textContent = (distPF1 * distPF2).toFixed(1);
        }
        
        slider.addEventListener('input', updateScene);
        
        // 初始化
        updateScene();
    })();
    </script>
</body>
</html>
