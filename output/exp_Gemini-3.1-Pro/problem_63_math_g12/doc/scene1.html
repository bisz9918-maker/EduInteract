<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双曲线与圆的综合几何推导</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .step-indicator { display: flex; align-items: center; font-size: 14px; font-weight: bold; }
        
        /* SVG Elements */
        .scene1-element { transition: all 0.4s ease; }
        .scene1-hidden { opacity: 0; pointer-events: none; }
        .scene1-visible { opacity: 1; }
        
        #scene1-formulas {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 18px;
            pointer-events: none;
        }
        .scene1-formula {
            margin-bottom: 10px;
            transition: opacity 0.4s ease;
            opacity: 0;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <div id="scene1-formulas">
            <div id="scene1-formula1" class="scene1-formula">\( |F'P| - |PF| = 2a \)</div>
            <div id="scene1-formula2" class="scene1-formula">\( 2b - 2a = 2a \implies b = 2a \)</div>
            <div id="scene1-formula3" class="scene1-formula">渐近线 \( y = \pm 2x \)</div>
        </div>
        
        <svg id="scene1-svg" width="800" height="500">
            <defs>
                <marker id="scene1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#000" />
                </marker>
            </defs>
            
            <!-- 坐标轴 -->
            <line x1="0" y1="250" x2="790" y2="250" stroke="#000" stroke-width="1" marker-end="url(#scene1-arrow)" />
            <line x1="400" y1="500" x2="400" y2="10" stroke="#000" stroke-width="1" marker-end="url(#scene1-arrow)" />
            <text x="760" y="275" font-size="16" font-style="italic">x</text>
            <text x="365" y="30" font-size="16" font-style="italic">y</text>
            <text x="365" y="275" font-size="16" font-style="italic">O</text>
            
            <!-- 渐近线 -->
            <line id="scene1-asymp1" x1="275" y1="500" x2="525" y2="0" stroke="#888" stroke-width="1" stroke-dasharray="5,5" class="scene1-element" />
            <line id="scene1-asymp2" x1="275" y1="0" x2="525" y2="500" stroke="#888" stroke-width="1" stroke-dasharray="5,5" class="scene1-element" />
            
            <!-- 圆 -->
            <circle cx="400" cy="250" r="160" fill="none" stroke="#000" stroke-width="1.5" />
            
            <!-- 高亮三角形 OMF -->
            <polygon id="scene1-tri-omf" points="400,250 543.1,178.4 578.9,250" fill="#2e7d32" opacity="0" class="scene1-element" />
            
            <!-- 双曲线 (通过JS生成路径) -->
            <path id="scene1-hyperbola-right" fill="none" stroke="#000" stroke-width="1.5" />
            <path id="scene1-hyperbola-left" fill="none" stroke="#000" stroke-width="1.5" />
            
            <!-- 辅助线 -->
            <line id="scene1-line-om" x1="400" y1="250" x2="543.1" y2="178.4" stroke="#1565c0" stroke-width="2" class="scene1-element scene1-hidden" />
            <line id="scene1-line-fp" x1="221.1" y1="250" x2="507.3" y2="106.9" stroke="#1565c0" stroke-width="2" class="scene1-element scene1-hidden" />
            <line id="scene1-line-ff" x1="221.1" y1="250" x2="578.9" y2="250" stroke="#000" stroke-width="2" class="scene1-element scene1-hidden" />
            
            <!-- 切线 l -->
            <line id="scene1-line-l" x1="471.5" y1="35.3" x2="614.7" y2="321.6" stroke="#000" stroke-width="1.5" />
            
            <!-- 线段 PF 分段 -->
            <line id="scene1-line-pm" x1="507.3" y1="106.9" x2="543.1" y2="178.4" stroke="#000" stroke-width="1.5" class="scene1-element" />
            <line id="scene1-line-mf" x1="543.1" y1="178.4" x2="578.9" y2="250" stroke="#000" stroke-width="1.5" class="scene1-element" />
            
            <!-- 直角符号 -->
            <polygon id="scene1-right-angle" points="543.1,178.4 530.4,184.8 536.8,197.5 549.5,191.1" fill="none" stroke="#000" stroke-width="1" class="scene1-element scene1-hidden" />
            
            <!-- 点 -->
            <circle cx="400" cy="250" r="3" fill="#000" /> <!-- O -->
            <circle cx="578.9" cy="250" r="3" fill="#000" /> <!-- F -->
            <circle id="scene1-pt-fprime" cx="221.1" cy="250" r="3" fill="#000" class="scene1-element scene1-hidden" /> <!-- F' -->
            <circle cx="507.3" cy="106.9" r="3" fill="#000" /> <!-- P -->
            <circle cx="543.1" cy="178.4" r="3" fill="#000" /> <!-- M -->
            
            <!-- 标签 -->
            <text x="585" y="275" font-size="16" font-style="italic">F</text>
            <text id="scene1-label-fprime" x="205" y="275" font-size="16" font-style="italic" class="scene1-element scene1-hidden">F'</text>
            <text x="480" y="90" font-size="16" font-style="italic">P</text>
            <text x="565" y="165" font-size="16" font-style="italic">M</text>
            
            <!-- 长度标签 -->
            <text id="scene1-label-b" x="455" y="190" font-size="16" font-style="italic" fill="#1565c0" class="scene1-element scene1-hidden">b</text>
            <text id="scene1-label-c" x="490" y="275" font-size="16" font-style="italic" class="scene1-element scene1-hidden">c</text>
            <text id="scene1-label-a-mf" x="585" y="215" font-size="16" font-style="italic" fill="#c62828" class="scene1-element scene1-hidden">a</text>
            <text id="scene1-label-a-pm" x="550" y="125" font-size="16" font-style="italic" fill="#c62828" class="scene1-element scene1-hidden">a</text>
            <text id="scene1-label-2b" x="345" y="155" font-size="16" font-style="italic" fill="#1565c0" class="scene1-element scene1-hidden">2b</text>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <div class="step-indicator"><span id="scene1-step-text">0</span> / 4</div>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // 生成双曲线路径
        function generateHyperbola(a, b, cx, cy, isRight) {
            let path = "";
            const yMax = 250;
            const steps = 50;
            for (let i = -steps; i <= steps; i++) {
                const y = (i / steps) * yMax;
                const x = a * Math.sqrt(1 + (y * y) / (b * b));
                const px = isRight ? cx + x : cx - x;
                const py = cy - y;
                if (i === -steps) {
                    path += `M ${px} ${py} `;
                } else {
                    path += `L ${px} ${py} `;
                }
            }
            return path;
        }

        document.getElementById('scene1-hyperbola-right').setAttribute('d', generateHyperbola(80, 160, 400, 250, true));
        document.getElementById('scene1-hyperbola-left').setAttribute('d', generateHyperbola(80, 160, 400, 250, false));

        let currentStep = 0;
        const maxStep = 4;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepText = document.getElementById('scene1-step-text');

        function updateScene() {
            stepText.textContent = currentStep;
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;

            // 辅助函数：控制显隐
            const show = (id) => {
                const el = document.getElementById(id);
                if(el) {
                    el.classList.remove('scene1-hidden');
                    el.classList.add('scene1-visible');
                }
            };
            const hide = (id) => {
                const el = document.getElementById(id);
                if(el) {
                    el.classList.remove('scene1-visible');
                    el.classList.add('scene1-hidden');
                }
            };

            // Step 1
            if (currentStep >= 1) {
                show('scene1-line-om');
                document.getElementById('scene1-tri-omf').style.opacity = '0.2';
                show('scene1-right-angle');
                show('scene1-label-b');
                show('scene1-label-c');
                document.getElementById('scene1-line-mf').setAttribute('stroke', '#c62828');
                document.getElementById('scene1-line-mf').setAttribute('stroke-width', '2');
                show('scene1-label-a-mf');
            } else {
                hide('scene1-line-om');
                document.getElementById('scene1-tri-omf').style.opacity = '0';
                hide('scene1-right-angle');
                hide('scene1-label-b');
                hide('scene1-label-c');
                document.getElementById('scene1-line-mf').setAttribute('stroke', '#000');
                document.getElementById('scene1-line-mf').setAttribute('stroke-width', '1.5');
                hide('scene1-label-a-mf');
            }

            // Step 2
            if (currentStep >= 2) {
                document.getElementById('scene1-line-pm').setAttribute('stroke', '#c62828');
                document.getElementById('scene1-line-pm').setAttribute('stroke-width', '2');
                show('scene1-label-a-pm');
            } else {
                document.getElementById('scene1-line-pm').setAttribute('stroke', '#000');
                document.getElementById('scene1-line-pm').setAttribute('stroke-width', '1.5');
                hide('scene1-label-a-pm');
            }

            // Step 3
            if (currentStep >= 3) {
                show('scene1-pt-fprime');
                show('scene1-label-fprime');
                show('scene1-line-fp');
                show('scene1-line-ff');
                show('scene1-label-2b');
            } else {
                hide('scene1-pt-fprime');
                hide('scene1-label-fprime');
                hide('scene1-line-fp');
                hide('scene1-line-ff');
                hide('scene1-label-2b');
            }

            // Step 4
            if (currentStep >= 4) {
                document.getElementById('scene1-formula1').style.opacity = '1';
                document.getElementById('scene1-formula2').style.opacity = '1';
                document.getElementById('scene1-formula3').style.opacity = '1';
                
                document.getElementById('scene1-asymp1').setAttribute('stroke', '#000');
                document.getElementById('scene1-asymp1').setAttribute('stroke-width', '2');
                document.getElementById('scene1-asymp1').setAttribute('stroke-dasharray', 'none');
                
                document.getElementById('scene1-asymp2').setAttribute('stroke', '#000');
                document.getElementById('scene1-asymp2').setAttribute('stroke-width', '2');
                document.getElementById('scene1-asymp2').setAttribute('stroke-dasharray', 'none');
            } else {
                document.getElementById('scene1-formula1').style.opacity = '0';
                document.getElementById('scene1-formula2').style.opacity = '0';
                document.getElementById('scene1-formula3').style.opacity = '0';
                
                document.getElementById('scene1-asymp1').setAttribute('stroke', '#888');
                document.getElementById('scene1-asymp1').setAttribute('stroke-width', '1');
                document.getElementById('scene1-asymp1').setAttribute('stroke-dasharray', '5,5');
                
                document.getElementById('scene1-asymp2').setAttribute('stroke', '#888');
                document.getElementById('scene1-asymp2').setAttribute('stroke-width', '1');
                document.getElementById('scene1-asymp2').setAttribute('stroke-dasharray', '5,5');
            }
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });

        // Initialize
        updateScene();
    })();
    </script>
</body>
</html>
