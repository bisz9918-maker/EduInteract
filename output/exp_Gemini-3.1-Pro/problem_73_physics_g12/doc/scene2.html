<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* SVG 元素样式 */
        .scene2-axis { stroke: #000; stroke-width: 1.5; fill: none; }
        .scene2-axis-arrow { fill: #000; }
        .scene2-dashed { stroke: #888; stroke-width: 1; stroke-dasharray: 4,4; fill: none; }
        .scene2-curve { stroke: #000; stroke-width: 2; fill: none; }
        .scene2-text { font-size: 16px; font-family: serif; fill: #000; }
        .scene2-text-blue { font-size: 16px; font-family: serif; fill: #1565c0; }
        .scene2-line { stroke: #000; stroke-width: 2; fill: none; }
        .scene2-rod { fill: #000; transition: all 1s ease-in-out; }
        .scene2-annotation { stroke: #1565c0; stroke-width: 1.5; fill: none; transition: opacity 0.5s; }
        .scene2-annotation-arrow { fill: #1565c0; transition: opacity 0.5s; }
        .scene2-fade { transition: opacity 0.5s; }
        
        /* 公式区域样式 */
        #scene2-formula-area { position: absolute; left: 400px; top: 240px; width: 380px; height: 180px; font-size: 16px; }
        .scene2-formula-step { opacity: 0; transition: opacity 0.5s; margin-bottom: 10px; }
        .scene2-highlight { color: #c62828; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500">
            <!-- v-t 图像 -->
            <!-- 坐标轴 -->
            <path class="scene2-axis" d="M 250 200 L 550 200" />
            <polygon class="scene2-axis-arrow" points="550,196 558,200 550,204" />
            <path class="scene2-axis" d="M 250 200 L 250 50" />
            <polygon class="scene2-axis-arrow" points="246,50 250,42 254,50" />
            
            <!-- 渐近线 -->
            <line class="scene2-dashed" x1="250" y1="90" x2="550" y2="90" />
            
            <!-- 速度曲线 -->
            <path class="scene2-curve" d="M 250 200 Q 300 95 500 95" />
            
            <!-- 标签 -->
            <text class="scene2-text" x="245" y="45">v</text>
            <text class="scene2-text" x="560" y="205">t</text>
            <text class="scene2-text" x="230" y="215">O</text>
            <text class="scene2-text" x="215" y="95">v_m</text>
            
            <!-- 斜面下滑示意图 -->
            <!-- 斜面底线 -->
            <line class="scene2-line" x1="60" y1="420" x2="340" y2="420" />
            <!-- 斜面 -->
            <line class="scene2-line" x1="80" y1="420" x2="300" y2="293" />
            <!-- 角度θ -->
            <path class="scene2-line" d="M 120 420 A 40 40 0 0 0 114 400" />
            <text class="scene2-text" x="135" y="410">θ</text>
            
            <!-- 导体棒 -->
            <circle id="scene2-rod" class="scene2-rod" cx="260" cy="316" r="6" />
            
            <!-- 运动标注 (初始隐藏) -->
            <g id="scene2-annotations" class="scene2-fade" style="opacity: 0;">
                <!-- 位移x标注 -->
                <line class="scene2-annotation" x1="250" y1="299" x2="130" y2="368" />
                <polygon class="scene2-annotation-arrow" points="134,363 126,370 136,367" />
                <text class="scene2-text-blue" x="140" y="290">x</text>
                
                <!-- 高度h标注 -->
                <line class="scene2-dashed scene2-annotation" x1="260" y1="316" x2="260" y2="385" />
                <text class="scene2-text-blue" x="265" y="355">h</text>
                
                <!-- 水平辅助线 -->
                <line class="scene2-dashed" x1="140" y1="385" x2="280" y2="385" />
            </g>
        </svg>
        
        <!-- 公式区域 -->
        <div id="scene2-formula-area">
            <div id="scene2-formula-step1" class="scene2-formula-step">
                $$mgx \sin	heta - \color{#c62828}{Q_{电}} = rac{1}{2}mv_m^2$$
            </div>
            <div id="scene2-formula-step2" class="scene2-formula-step">
                $$x = 4 	ext{ m}$$
            </div>
            <div id="scene2-formula-step3" class="scene2-formula-step">
                $$q = rac{\Delta \Phi}{R_{总}} = rac{BLx}{R} = \color{#c62828}{4 	ext{ C}}$$
            </div>
        </div>
        
        <div id="scene2-controls">
            <button id="scene2-btn-prev" disabled>◀ 上一步</button>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>
    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 3;
        
        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        const rod = document.getElementById('scene2-rod');
        const annotations = document.getElementById('scene2-annotations');
        const fStep1 = document.getElementById('scene2-formula-step1');
        const fStep2 = document.getElementById('scene2-formula-step2');
        const fStep3 = document.getElementById('scene2-formula-step3');
        
        function updateScene() {
            // 按钮状态
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
            
            // 导体棒位置
            if (currentStep >= 1) {
                rod.setAttribute('cx', '140');
                rod.setAttribute('cy', '385');
                annotations.style.opacity = '1';
                fStep1.style.opacity = '1';
            } else {
                rod.setAttribute('cx', '260');
                rod.setAttribute('cy', '316');
                annotations.style.opacity = '0';
                fStep1.style.opacity = '0';
            }
            
            // 公式显示
            fStep2.style.opacity = currentStep >= 2 ? '1' : '0';
            fStep3.style.opacity = currentStep >= 3 ? '1' : '0';
        }
        
        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });
        
        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });
        
        // 初始化
        updateScene();
    })();
    </script>
</body>
</html>
