<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-status { font-size: 14px; min-width: 120px; text-align: center; }
        
        /* SVG Elements */
        .plate { stroke: #000; stroke-width: 2; }
        .ball { fill: #fff; stroke: #000; stroke-width: 2; }
        .rod { stroke: #000; stroke-width: 2; }
        .label { font-size: 14px; fill: #000; }
        .label-red { font-size: 14px; fill: #c62828; }
        .label-blue { font-size: 14px; fill: #1565c0; }
        .arrow-red { stroke: #c62828; stroke-width: 2; }
        .arrow-blue { stroke: #1565c0; stroke-width: 2; }
        .dashed-line { stroke: #888; stroke-width: 1; stroke-dasharray: 4 4; }
        .dashed-blue { stroke: #1565c0; stroke-width: 1; stroke-dasharray: 4 4; }
        
        /* Transitions */
        g { transition: opacity 0.5s ease; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <defs>
                <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#c62828" />
                </marker>
                <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0" />
                </marker>
                <marker id="arrowhead-black" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#000" />
                </marker>
                <marker id="arrowhead-black-rev" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
                    <polygon points="10 0, 0 3.5, 10 7" fill="#000" />
                </marker>
            </defs>

            <!-- Base Elements (Always visible) -->
            <g id="scene1-group-base">
                <!-- Plates -->
                <line x1="100" y1="200" x2="240" y2="200" class="plate" />
                <line x1="260" y1="200" x2="400" y2="200" class="plate" />
                <line x1="100" y1="380" x2="400" y2="380" class="plate" />
                
                <!-- Plate distance marker -->
                <line x1="70" y1="200" x2="70" y2="380" stroke="#000" stroke-width="1" marker-start="url(#arrowhead-black-rev)" marker-end="url(#arrowhead-black)" />
                <text x="40" y="295" class="label">d=3L</text>
                <line x1="60" y1="200" x2="100" y2="200" class="dashed-line" />
                <line x1="60" y1="380" x2="100" y2="380" class="dashed-line" />
            </g>

            <!-- Initial State -->
            <g id="scene1-group-initial">
                <!-- Rods -->
                <line x1="250" y1="88" x2="250" y2="132" class="rod" />
                <line x1="250" y1="148" x2="250" y2="192" class="rod" />
                <text x="230" y="115" class="label">L</text>
                <text x="230" y="175" class="label">L</text>
                
                <!-- Balls -->
                <circle cx="250" cy="80" r="8" class="ball" />
                <text x="270" y="85" class="label">3</text>
                
                <circle cx="250" cy="140" r="8" class="ball" />
                <text x="270" y="145" class="label">2</text>
                
                <circle cx="250" cy="200" r="8" class="ball" />
                <text x="270" y="205" class="label">1</text>
            </g>

            <!-- Final State -->
            <g id="scene1-group-final" style="opacity: 0;">
                <!-- Rods -->
                <line x1="250" y1="268" x2="250" y2="312" class="rod" />
                <line x1="250" y1="328" x2="250" y2="372" class="rod" />
                
                <!-- Balls -->
                <circle cx="250" cy="260" r="8" class="ball" />
                <text x="270" y="265" class="label">3'</text>
                
                <circle cx="250" cy="320" r="8" class="ball" />
                <text x="270" y="325" class="label">2'</text>
                
                <circle cx="250" cy="380" r="8" class="ball" />
                <text x="270" y="385" class="label">1'</text>
            </g>

            <!-- Gravity Work -->
            <g id="scene1-group-gravity" style="opacity: 0;">
                <line x1="340" y1="140" x2="340" y2="320" class="arrow-red" marker-end="url(#arrowhead-red)" />
                <text x="350" y="140" class="label-red">总重力 3mg</text>
                <text x="350" y="235" class="label-red">总位移 3L</text>
                <line x1="260" y1="140" x2="340" y2="140" class="dashed-line" />
                <line x1="260" y1="320" x2="340" y2="320" class="dashed-line" />
            </g>

            <!-- E-field Work -->
            <g id="scene1-group-efield" style="opacity: 0;">
                <!-- Auxiliary dashed lines -->
                <line x1="400" y1="200" x2="720" y2="200" class="dashed-blue" />
                <line x1="260" y1="260" x2="720" y2="260" class="dashed-blue" />
                <line x1="260" y1="320" x2="620" y2="320" class="dashed-blue" />
                <line x1="400" y1="380" x2="520" y2="380" class="dashed-blue" />
                
                <!-- Ball 1 E-field displacement -->
                <line x1="500" y1="200" x2="500" y2="380" class="arrow-blue" marker-end="url(#arrowhead-blue)" />
                <text x="510" y="295" class="label-blue">球1位移 3L</text>
                
                <!-- Ball 2 E-field displacement -->
                <line x1="600" y1="200" x2="600" y2="320" class="arrow-blue" marker-end="url(#arrowhead-blue)" />
                <text x="610" y="265" class="label-blue">球2位移 2L</text>
                
                <!-- Ball 3 E-field displacement -->
                <line x1="700" y1="200" x2="700" y2="260" class="arrow-blue" marker-end="url(#arrowhead-blue)" />
                <text x="710" y="235" class="label-blue">球3位移 L</text>
            </g>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <div id="scene1-status">步骤 0 / 3: 初始状态</div>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 3;
        
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const statusText = document.getElementById('scene1-status');
        
        const groupInitial = document.getElementById('scene1-group-initial');
        const groupFinal = document.getElementById('scene1-group-final');
        const groupGravity = document.getElementById('scene1-group-gravity');
        const groupEfield = document.getElementById('scene1-group-efield');
        
        const stepDescriptions = [
            "步骤 0 / 3: 初始状态",
            "步骤 1 / 3: 最终状态",
            "步骤 2 / 3: 重力做功分析",
            "步骤 3 / 3: 电场力做功分析"
        ];
        
        function updateState() {
            // Update buttons
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
            statusText.textContent = stepDescriptions[currentStep];
            
            // Step 0: Initial only
            if (currentStep === 0) {
                groupInitial.style.opacity = '1';
                groupFinal.style.opacity = '0';
                groupGravity.style.opacity = '0';
                groupEfield.style.opacity = '0';
            }
            // Step 1: Initial (0.3), Final (1)
            else if (currentStep === 1) {
                groupInitial.style.opacity = '0.3';
                groupFinal.style.opacity = '1';
                groupGravity.style.opacity = '0';
                groupEfield.style.opacity = '0';
            }
            // Step 2: Gravity work
            else if (currentStep === 2) {
                groupInitial.style.opacity = '0.3';
                groupFinal.style.opacity = '1';
                groupGravity.style.opacity = '1';
                groupEfield.style.opacity = '0';
            }
            // Step 3: E-field work
            else if (currentStep === 3) {
                groupInitial.style.opacity = '0.3';
                groupFinal.style.opacity = '1';
                groupGravity.style.opacity = '0.2';
                groupEfield.style.opacity = '1';
            }
        }
        
        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateState();
            }
        });
        
        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateState();
            }
        });
        
        // Initialize
        updateState();
    })();
    </script>
</body>
</html>
