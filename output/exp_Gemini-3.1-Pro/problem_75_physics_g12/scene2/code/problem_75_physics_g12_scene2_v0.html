<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 20px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        input[type="range"] { width: 400px; }
        .math-label { font-family: 'Times New Roman', Times, serif; font-style: italic; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500">
            <defs>
                <marker id="scene2-arrow-down-red" viewBox="0 0 10 10" refX="5" refY="10" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 5 10 L 10 0 z" fill="#c62828" />
                </marker>
                <marker id="scene2-arrow-up-blue" viewBox="0 0 10 10" refX="5" refY="0" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 10 L 5 0 L 10 10 z" fill="#1565c0" />
                </marker>
                <marker id="scene2-arrow-down-orange" viewBox="0 0 10 10" refX="5" refY="10" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 5 10 L 10 0 z" fill="#f57c00" />
                </marker>
                <marker id="scene2-arrow-up-orange" viewBox="0 0 10 10" refX="5" refY="0" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 10 L 5 0 L 10 10 z" fill="#f57c00" />
                </marker>
                <marker id="scene2-arrow-down-green" viewBox="0 0 10 10" refX="5" refY="10" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 5 10 L 10 0 z" fill="#2e7d32" />
                </marker>
                <marker id="scene2-arrow-axis" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
                </marker>
            </defs>

            <!-- 极板与环境 -->
            <line x1="80" y1="180" x2="190" y2="180" stroke="#000000" stroke-width="4" />
            <line x1="210" y1="180" x2="320" y2="180" stroke="#000000" stroke-width="4" />
            <line x1="80" y1="360" x2="320" y2="360" stroke="#000000" stroke-width="4" />
            
            <!-- 极板间距 -->
            <line x1="120" y1="180" x2="120" y2="360" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" />
            <line x1="115" y1="180" x2="125" y2="180" stroke="#888888" stroke-width="1" />
            <line x1="115" y1="360" x2="125" y2="360" stroke="#888888" stroke-width="1" />
            <text x="90" y="275" font-size="16" class="math-label">d=3L</text>

            <!-- v-x 坐标系 -->
            <line x1="500" y1="360" x2="730" y2="360" stroke="#000000" stroke-width="2" marker-end="url(#scene2-arrow-axis)" />
            <line x1="500" y1="360" x2="500" y2="150" stroke="#000000" stroke-width="2" marker-end="url(#scene2-arrow-axis)" />
            <text x="735" y="365" font-size="16" class="math-label">x</text>
            <text x="485" y="145" font-size="16" class="math-label">v</text>
            
            <!-- X轴刻度 -->
            <line x1="560" y1="360" x2="560" y2="365" stroke="#000000" stroke-width="1" />
            <text x="555" y="380" font-size="14" class="math-label">L</text>
            <line x1="620" y1="360" x2="620" y2="365" stroke="#000000" stroke-width="1" />
            <text x="610" y="380" font-size="14" class="math-label">2L</text>
            <line x1="680" y1="360" x2="680" y2="365" stroke="#000000" stroke-width="1" />
            <text x="670" y="380" font-size="14" class="math-label">3L</text>

            <!-- v-x 曲线 -->
            <path id="scene2-vx-curve" d="M 500 360" fill="none" stroke="#2e7d32" stroke-width="2" />
            
            <!-- 曲线当前点及辅助线 -->
            <line id="scene2-vx-guide-x" x1="500" y1="360" x2="500" y2="360" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" />
            <line id="scene2-vx-guide-y" x1="500" y1="360" x2="500" y2="360" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" />
            <circle id="scene2-vx-point" cx="500" cy="360" r="4" fill="#2e7d32" />

            <!-- 动态系统 (小球、杆、受力) -->
            <g id="scene2-system" transform="translate(0, 0)">
                <!-- 绝缘杆 -->
                <line x1="200" y1="60" x2="200" y2="180" stroke="#000000" stroke-width="2" />
                
                <!-- 小球 -->
                <circle cx="200" cy="60" r="6" fill="rgba(0,0,0,0.2)" stroke="#000000" stroke-width="1" />
                <circle cx="200" cy="120" r="6" fill="rgba(0,0,0,0.2)" stroke="#000000" stroke-width="1" />
                <circle cx="200" cy="180" r="6" fill="rgba(0,0,0,0.2)" stroke="#000000" stroke-width="1" />

                <!-- 重力箭头 -->
                <line x1="220" y1="120" x2="220" y2="180" stroke="#c62828" stroke-width="2" marker-end="url(#scene2-arrow-down-red)" />
                <text x="230" y="155" font-size="14" fill="#c62828" class="math-label">3mg</text>

                <!-- 电场力箭头 -->
                <line id="scene2-force-e" x1="180" y1="120" x2="180" y2="90" stroke="#1565c0" stroke-width="2" marker-end="url(#scene2-arrow-up-blue)" opacity="0" />
                <text id="scene2-force-e-label" x="145" y="110" font-size="14" fill="#1565c0" class="math-label" opacity="0">qE</text>

                <!-- 合力箭头 -->
                <line id="scene2-force-net" x1="260" y1="120" x2="260" y2="150" stroke="#f57c00" stroke-width="2" marker-end="url(#scene2-arrow-down-orange)" opacity="0" />
                <text id="scene2-force-net-label" x="270" y="140" font-size="14" fill="#f57c00" class="math-label" opacity="0">F_合</text>

                <!-- 速度箭头 -->
                <line id="scene2-velocity" x1="240" y1="180" x2="240" y2="180" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene2-arrow-down-green)" opacity="0" />
                <text id="scene2-velocity-label" x="250" y="180" font-size="14" fill="#2e7d32" class="math-label" opacity="0">v</text>
            </g>
        </svg>

        <div id="scene2-controls">
            <input type="range" id="scene2-slider" min="0" max="180" value="0" step="1">
        </div>
    </div>

    <script>
    (function() {
        const slider = document.getElementById('scene2-slider');
        const system = document.getElementById('scene2-system');
        
        const forceE = document.getElementById('scene2-force-e');
        const forceELabel = document.getElementById('scene2-force-e-label');
        
        const forceNet = document.getElementById('scene2-force-net');
        const forceNetLabel = document.getElementById('scene2-force-net-label');
        
        const velocity = document.getElementById('scene2-velocity');
        const velocityLabel = document.getElementById('scene2-velocity-label');
        
        const vxCurve = document.getElementById('scene2-vx-curve');
        const vxPoint = document.getElementById('scene2-vx-point');
        const vxGuideX = document.getElementById('scene2-vx-guide-x');
        const vxGuideY = document.getElementById('scene2-vx-guide-y');

        function updateScene() {
            const x = parseInt(slider.value);
            
            // 1. 更新系统位置
            system.setAttribute('transform', `translate(0, ${x})`);
            
            // 2. 计算物理量
            let v = 0;
            let fe = 0;
            let fnet = 0; // 正为下，负为上
            let feLabelText = '';
            
            if (x === 0) {
                v = 0;
                fe = 0;
                fnet = 30; // 初始只有重力，但为了显示连贯，这里可以不显示电场力和合力，或者显示合力=3mg
            } else if (x <= 60) {
                v = 100 * Math.sqrt(x / 60);
                fe = 30;
                fnet = 30;
                feLabelText = 'qE';
            } else if (x <= 120) {
                v = 100;
                fe = 60;
                fnet = 0;
                feLabelText = '2qE';
            } else {
                v = 100 * Math.sqrt((180 - x) / 60);
                fe = 90;
                fnet = -30;
                feLabelText = '3qE';
            }

            // 3. 更新电场力
            if (fe > 0) {
                forceE.setAttribute('y2', 120 - fe);
                forceE.setAttribute('opacity', '1');
                forceELabel.textContent = feLabelText;
                forceELabel.setAttribute('y', 120 - fe / 2 + 5);
                forceELabel.setAttribute('opacity', '1');
            } else {
                forceE.setAttribute('opacity', '0');
                forceELabel.setAttribute('opacity', '0');
            }

            // 4. 更新合力
            if (x > 0 && fnet !== 0) {
                forceNet.setAttribute('opacity', '1');
                forceNetLabel.setAttribute('opacity', '1');
                if (fnet > 0) {
                    forceNet.setAttribute('y2', 120 + fnet);
                    forceNet.setAttribute('marker-end', 'url(#scene2-arrow-down-orange)');
                    forceNetLabel.setAttribute('y', 120 + fnet / 2 + 5);
                } else {
                    forceNet.setAttribute('y2', 120 + fnet); // fnet is negative
                    forceNet.setAttribute('marker-end', 'url(#scene2-arrow-up-orange)');
                    forceNetLabel.setAttribute('y', 120 + fnet / 2 + 5);
                }
                // F_合 label text update with subscript
                forceNetLabel.innerHTML = 'F<tspan font-size="10" dy="4">合</tspan>';
            } else {
                forceNet.setAttribute('opacity', '0');
                forceNetLabel.setAttribute('opacity', '0');
            }

            // 5. 更新速度
            if (v > 0) {
                velocity.setAttribute('y2', 180 + v);
                velocity.setAttribute('opacity', '1');
                velocityLabel.setAttribute('y', 180 + v / 2 + 5);
                velocityLabel.setAttribute('opacity', '1');
            } else {
                velocity.setAttribute('opacity', '0');
                velocityLabel.setAttribute('opacity', '0');
            }

            // 6. 更新 v-x 曲线
            let pathD = 'M 500 360';
            for (let i = 1; i <= x; i++) {
                let currV = 0;
                if (i <= 60) {
                    currV = 100 * Math.sqrt(i / 60);
                } else if (i <= 120) {
                    currV = 100;
                } else {
                    currV = 100 * Math.sqrt((180 - i) / 60);
                }
                pathD += ` L ${500 + i} ${360 - currV}`;
            }
            vxCurve.setAttribute('d', pathD);

            // 7. 更新当前点及辅助线
            const currX = 500 + x;
            const currY = 360 - v;
            vxPoint.setAttribute('cx', currX);
            vxPoint.setAttribute('cy', currY);
            
            if (x > 0) {
                vxGuideX.setAttribute('x1', currX);
                vxGuideX.setAttribute('y1', currY);
                vxGuideX.setAttribute('x2', currX);
                vxGuideX.setAttribute('y2', 360);
                vxGuideX.setAttribute('opacity', '1');

                vxGuideY.setAttribute('x1', currX);
                vxGuideY.setAttribute('y1', currY);
                vxGuideY.setAttribute('x2', 500);
                vxGuideY.setAttribute('y2', currY);
                vxGuideY.setAttribute('opacity', '1');
            } else {
                vxGuideX.setAttribute('opacity', '0');
                vxGuideY.setAttribute('opacity', '0');
            }
        }

        slider.addEventListener('input', updateScene);
        
        // 初始化
        updateScene();
    })();
    </script>
</body>
</html>
