<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交变电压下的电场与受力变化</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        .label { font-size: 16px; fill: #000; user-select: none; }
        .math { font-style: italic; font-family: "Times New Roman", Times, serif; }
        .axis { stroke: #000; stroke-width: 1.5; }
        .dashed { stroke-dasharray: 5, 5; }
        .waveform { stroke: #000; stroke-width: 2; fill: none; }
        .cursor { stroke: #c62828; stroke-width: 2; stroke-dasharray: 4, 4; }
        .plate { stroke: #000; stroke-width: 1; }
        .target { fill: #cccccc; stroke: #000; stroke-width: 1; }
        .efield { stroke: #888888; stroke-width: 1.5; stroke-dasharray: 6, 4; }
        .force { stroke: #2e7d32; stroke-width: 2; }
        .particle { fill: #c62828; }
        
        input[type=range] { width: 300px; }
        #scene1-time-display { font-size: 16px; min-width: 120px; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500">
            <defs>
                <marker id="arrow-axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 1 L 10 5 L 0 9 z" fill="#000" />
                </marker>
                <marker id="arrow-efield-down" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 1 L 10 5 L 0 9 z" fill="#888888" />
                </marker>
                <marker id="arrow-efield-up" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 10 1 L 0 5 L 10 9 z" fill="#888888" />
                </marker>
                <marker id="arrow-force" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 1 L 10 5 L 0 9 z" fill="#2e7d32" />
                </marker>
            </defs>

            <!-- 极板与靶 -->
            <rect id="scene1-plateA" class="plate" x="200" y="80" width="400" height="4" fill="#c62828" />
            <rect id="scene1-plateB" class="plate" x="200" y="216" width="400" height="4" fill="#1565c0" />
            <rect class="target" x="600" y="80" width="4" height="140" />
            
            <!-- 中心线 -->
            <line class="axis dashed" x1="150" y1="150" x2="600" y2="150" />
            
            <!-- 电场线 -->
            <g id="scene1-efields">
                <line class="efield" x1="300" y1="90" x2="300" y2="210" marker-mid="url(#arrow-efield-down)" />
                <line class="efield" x1="400" y1="90" x2="400" y2="210" marker-mid="url(#arrow-efield-down)" />
                <line class="efield" x1="500" y1="90" x2="500" y2="210" marker-mid="url(#arrow-efield-down)" />
            </g>

            <!-- 粒子与受力 -->
            <circle class="particle" cx="200" cy="150" r="6" />
            <line id="scene1-force" class="force" x1="200" y1="150" x2="200" y2="190" marker-end="url(#arrow-force)" />
            <text id="scene1-force-label" class="label math" x="215" y="190" fill="#2e7d32">F</text>
            <text class="label math" x="185" y="140" fill="#c62828">q</text>
            <line id="scene1-velocity" class="axis" x1="200" y1="150" x2="240" y2="150" marker-end="url(#arrow-axis)" />
            <text class="label math" x="220" y="135">v<tspan dy="4" font-size="12">0</tspan></text>

            <!-- 标签 -->
            <text class="label math" x="180" y="85">A</text>
            <text class="label math" x="180" y="220">B</text>
            <text class="label math" x="615" y="85">M</text>
            <text class="label math" x="615" y="220">N</text>
            <text class="label math" x="135" y="155">O</text>
            <text class="label math" x="615" y="155">O'</text>

            <!-- U-t 坐标系 -->
            <line class="axis" x1="200" y1="350" x2="650" y2="350" marker-end="url(#arrow-axis)" />
            <line class="axis" x1="200" y1="430" x2="200" y2="260" marker-end="url(#arrow-axis)" />
            
            <!-- U-t 波形图 -->
            <path class="waveform" d="M 200 290 L 320 290 L 320 410 L 380 410 L 380 290 L 500 290 L 500 410 L 560 410 L 560 290 L 620 290" />
            
            <!-- 辅助虚线 -->
            <line class="axis dashed" x1="200" y1="290" x2="620" y2="290" stroke-width="1" stroke="#aaa" />
            <line class="axis dashed" x1="200" y1="410" x2="560" y2="410" stroke-width="1" stroke="#aaa" />
            <line class="axis dashed" x1="320" y1="350" x2="320" y2="410" stroke-width="1" stroke="#aaa" />
            <line class="axis dashed" x1="380" y1="290" x2="380" y2="350" stroke-width="1" stroke="#aaa" />
            <line class="axis dashed" x1="500" y1="350" x2="500" y2="410" stroke-width="1" stroke="#aaa" />
            <line class="axis dashed" x1="560" y1="290" x2="560" y2="350" stroke-width="1" stroke="#aaa" />

            <!-- 坐标轴标签 -->
            <text class="label math" x="660" y="355">t</text>
            <text class="label math" x="180" y="260">U</text>
            <text class="label math" x="170" y="295">U<tspan dy="4" font-size="12">0</tspan></text>
            <text class="label math" x="160" y="415">-U<tspan dy="4" font-size="12">0</tspan></text>
            <text class="label math" x="180" y="365">0</text>
            
            <text class="label math" x="305" y="370">2T/3</text>
            <text class="label math" x="375" y="370">T</text>
            <text class="label math" x="485" y="370">5T/3</text>
            <text class="label math" x="550" y="370">2T</text>

            <!-- 时间游标 -->
            <line id="scene1-cursor" class="cursor" x1="200" y1="260" x2="200" y2="430" />
        </svg>

        <div id="scene1-controls">
            <span id="scene1-time-display">时间 t: 0.00 T</span>
            <input type="range" id="scene1-slider" min="0" max="2.2" step="0.01" value="0">
        </div>
    </div>

    <script>
    (function() {
        const slider = document.getElementById('scene1-slider');
        const timeDisplay = document.getElementById('scene1-time-display');
        const cursor = document.getElementById('scene1-cursor');
        const plateA = document.getElementById('scene1-plateA');
        const plateB = document.getElementById('scene1-plateB');
        const efields = document.getElementById('scene1-efields');
        const force = document.getElementById('scene1-force');
        const forceLabel = document.getElementById('scene1-force-label');

        function updateScene() {
            const t = parseFloat(slider.value);
            timeDisplay.textContent = `时间 t: ${t.toFixed(2)} T`;
            
            // 游标位置: 200 + t * 180 (因为 T 对应 180px)
            const cursorX = 200 + t * 180;
            cursor.setAttribute('x1', cursorX);
            cursor.setAttribute('x2', cursorX);

            // 判断极性
            // 周期为 T, t % 1.0 < 2/3 为正
            const tMod = t % 1.0;
            // 处理浮点数精度
            const isPositive = (tMod < (2/3) - 0.001) || (tMod > 0.999 && tMod < 1.0);

            if (isPositive) {
                plateA.setAttribute('fill', '#c62828'); // 红
                plateB.setAttribute('fill', '#1565c0'); // 蓝
                
                // 电场向下
                efields.innerHTML = `
                    <line class="efield" x1="300" y1="90" x2="300" y2="210" marker-mid="url(#arrow-efield-down)" />
                    <line class="efield" x1="400" y1="90" x2="400" y2="210" marker-mid="url(#arrow-efield-down)" />
                    <line class="efield" x1="500" y1="90" x2="500" y2="210" marker-mid="url(#arrow-efield-down)" />
                `;
                
                // 受力向下
                force.setAttribute('y2', '190');
                forceLabel.setAttribute('y', '190');
            } else {
                plateA.setAttribute('fill', '#1565c0'); // 蓝
                plateB.setAttribute('fill', '#c62828'); // 红
                
                // 电场向上
                efields.innerHTML = `
                    <line class="efield" x1="300" y1="210" x2="300" y2="90" marker-mid="url(#arrow-efield-up)" />
                    <line class="efield" x1="400" y1="210" x2="400" y2="90" marker-mid="url(#arrow-efield-up)" />
                    <line class="efield" x1="500" y1="210" x2="500" y2="90" marker-mid="url(#arrow-efield-up)" />
                `;
                
                // 受力向上
                force.setAttribute('y2', '110');
                forceLabel.setAttribute('y', '115');
            }
        }

        slider.addEventListener('input', updateScene);
        updateScene(); // 初始化
    })();
    </script>
</body>
</html>
