<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f8f9fa; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button:hover:not(:disabled) { background: #e2e6ea; }
        
        /* 动画类 */
        .fade { transition: opacity 0.5s ease-in-out; }
        .draw-path { transition: stroke-dashoffset 1s linear; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" id="scene2-svg">
            <!-- 极板A、B -->
            <line x1="150" y1="130" x2="600" y2="130" stroke="black" stroke-width="4" />
            <line x1="150" y1="370" x2="600" y2="370" stroke="black" stroke-width="4" />
            <text x="130" y="135" font-size="16" text-anchor="end">A</text>
            <text x="130" y="375" font-size="16" text-anchor="end">B</text>

            <!-- 靶MN -->
            <line x1="600" y1="130" x2="600" y2="370" stroke="black" stroke-width="6" />
            <!-- 靶的斜线纹理 -->
            <defs>
                <pattern id="scene2-hatch" width="4" height="4" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
                    <line x1="0" y1="0" x2="0" y2="4" stroke="black" stroke-width="1" />
                </pattern>
            </defs>
            <rect x="603" y="130" width="6" height="240" fill="url(#scene2-hatch)" />
            <text x="615" y="135" font-size="16">M</text>
            <text x="615" y="380" font-size="16">N</text>

            <!-- 中心线OO' -->
            <line x1="150" y1="250" x2="600" y2="250" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" />
            <text x="130" y="255" font-size="16" text-anchor="end">O</text>
            <text x="615" y="255" font-size="16">O'</text>

            <!-- 轨迹1 (t0=0) -->
            <polyline id="scene2-traj1" fill="none" stroke="#1565c0" stroke-width="3" class="draw-path" />
            <g id="scene2-traj1-label" class="fade" style="opacity: 0;">
                <line x1="600" y1="355" x2="640" y2="355" stroke="#888888" stroke-width="1" stroke-dasharray="3,3" />
                <text x="645" y="360" font-size="16" fill="#1565c0">7/18 aT<tspan dy="-5" font-size="12">2</tspan></text>
            </g>

            <!-- 轨迹2 (t0=2T/3) -->
            <polyline id="scene2-traj2" fill="none" stroke="#c62828" stroke-width="3" class="draw-path" />
            <g id="scene2-traj2-label" class="fade" style="opacity: 0;">
                <line x1="600" y1="235" x2="640" y2="235" stroke="#888888" stroke-width="1" stroke-dasharray="3,3" />
                <text x="645" y="240" font-size="16" fill="#c62828">-1/18 aT<tspan dy="-5" font-size="12">2</tspan></text>
            </g>

            <!-- 打靶范围 -->
            <line id="scene2-target-range" x1="600" y1="235" x2="600" y2="355" stroke="#2e7d32" stroke-width="6" class="fade" style="opacity: 0;" />

            <!-- d/2 标注 -->
            <g id="scene2-d-half" class="fade" style="opacity: 0;">
                <!-- 箭头 -->
                <defs>
                    <marker id="scene2-arrow-up" viewBox="0 0 10 10" refX="5" refY="0" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                        <path d="M 0 10 L 5 0 L 10 10 z" fill="#888888" />
                    </marker>
                    <marker id="scene2-arrow-down" viewBox="0 0 10 10" refX="5" refY="10" markerWidth="6" markerHeight="6" orient="auto">
                        <path d="M 0 0 L 5 10 L 10 0 z" fill="#888888" />
                    </marker>
                </defs>
                <line x1="120" y1="250" x2="120" y2="370" stroke="#888888" stroke-width="1" marker-start="url(#scene2-arrow-up)" marker-end="url(#scene2-arrow-down)" />
                <text x="110" y="315" font-size="16" fill="#888888" text-anchor="end">d/2</text>
                <!-- 辅助线 -->
                <line x1="120" y1="250" x2="150" y2="250" stroke="#888888" stroke-width="1" stroke-dasharray="3,3" />
                <line x1="120" y1="370" x2="150" y2="370" stroke="#888888" stroke-width="1" stroke-dasharray="3,3" />
            </g>

            <!-- 闪烁圆点 -->
            <circle id="scene2-blink-dot" cx="600" cy="355" r="5" fill="#1565c0" class="fade" style="opacity: 0;" />

            <!-- 不等式文本 -->
            <text id="scene2-inequality" x="400" y="420" font-size="18" text-anchor="middle" class="fade" style="opacity: 0;">7/18 aT<tspan dy="-5" font-size="12">2</tspan> &lt; d/2</text>
        </svg>

        <div id="scene2-controls">
            <button id="scene2-btn-prev" disabled>◀ 上一步</button>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 4;

        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');

        // 元素引用
        const traj1 = document.getElementById('scene2-traj1');
        const traj1Label = document.getElementById('scene2-traj1-label');
        const traj2 = document.getElementById('scene2-traj2');
        const traj2Label = document.getElementById('scene2-traj2-label');
        const targetRange = document.getElementById('scene2-target-range');
        const dHalf = document.getElementById('scene2-d-half');
        const blinkDot = document.getElementById('scene2-blink-dot');
        const inequality = document.getElementById('scene2-inequality');

        // 生成轨迹点
        function generateTraj1() {
            let points = [];
            for (let x = 150; x <= 600; x += 5) {
                let y;
                if (x <= 450) {
                    y = 250 + Math.pow(x - 150, 2) / 1500;
                } else {
                    y = 310 + 0.4 * (x - 450) - Math.pow(x - 450, 2) / 1500;
                }
                points.push(`${x},${y}`);
            }
            return points.join(' ');
        }

        function generateTraj2() {
            let points = [];
            for (let x = 150; x <= 600; x += 5) {
                let y;
                if (x <= 300) {
                    y = 250 - Math.pow(x - 150, 2) / 1500;
                } else {
                    y = 235 - 0.2 * (x - 300) + Math.pow(x - 300, 2) / 1500;
                }
                points.push(`${x},${y}`);
            }
            return points.join(' ');
        }

        // 初始化轨迹
        traj1.setAttribute('points', generateTraj1());
        traj2.setAttribute('points', generateTraj2());

        // 设置轨迹动画初始状态
        const traj1Length = traj1.getTotalLength();
        traj1.style.strokeDasharray = traj1Length;
        traj1.style.strokeDashoffset = traj1Length;

        const traj2Length = traj2.getTotalLength();
        traj2.style.strokeDasharray = traj2Length;
        traj2.style.strokeDashoffset = traj2Length;

        // 闪烁动画
        let blinkInterval;
        function startBlink() {
            blinkDot.style.opacity = 1;
            let visible = true;
            blinkInterval = setInterval(() => {
                visible = !visible;
                blinkDot.style.opacity = visible ? 1 : 0;
            }, 500);
        }
        function stopBlink() {
            clearInterval(blinkInterval);
            blinkDot.style.opacity = 0;
        }

        function updateScene() {
            // 按钮状态
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;

            // 步骤 1: 轨迹 1
            if (currentStep >= 1) {
                traj1.style.strokeDashoffset = 0;
                setTimeout(() => { if(currentStep >= 1) traj1Label.style.opacity = 1; }, 1000);
            } else {
                traj1.style.strokeDashoffset = traj1Length;
                traj1Label.style.opacity = 0;
            }

            // 步骤 2: 轨迹 2
            if (currentStep >= 2) {
                traj2.style.strokeDashoffset = 0;
                setTimeout(() => { if(currentStep >= 2) traj2Label.style.opacity = 1; }, 1000);
            } else {
                traj2.style.strokeDashoffset = traj2Length;
                traj2Label.style.opacity = 0;
            }

            // 步骤 3: 打靶范围
            if (currentStep >= 3) {
                targetRange.style.opacity = 1;
            } else {
                targetRange.style.opacity = 0;
            }

            // 步骤 4: 临界条件
            if (currentStep >= 4) {
                dHalf.style.opacity = 1;
                inequality.style.opacity = 1;
                startBlink();
            } else {
                dHalf.style.opacity = 0;
                inequality.style.opacity = 0;
                stopBlink();
            }
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });

        // 初始化
        updateScene();
    })();
    </script>
</body>
</html>
