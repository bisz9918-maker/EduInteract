<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* SVG Styles */
        svg { display: block; }
        .axis { stroke: #000000; stroke-width: 2px; }
        .axis-arrow { fill: #000000; }
        .grid-line { stroke: #888888; stroke-width: 1px; stroke-dasharray: 4,4; }
        .text-label { font-size: 16px; fill: #000000; stroke: white; stroke-width: 3px; paint-order: stroke; }
        
        .line-t0 { stroke: #1565c0; stroke-width: 2px; fill: none; }
        .line-t2 { stroke: #c62828; stroke-width: 2px; fill: none; }
        .line-at { stroke: #000000; stroke-width: 2px; fill: none; }
        
        .area-pos { fill: #1565c0; opacity: 0.2; }
        .area-neg { fill: #c62828; opacity: 0.2; }
        
        .point-intersect { fill: #000000; }

        /* Step visibility classes */
        .step-el { transition: opacity 0.3s ease, visibility 0.3s; opacity: 0; visibility: hidden; pointer-events: none; }
        .step-el.visible { opacity: 1; visibility: visible; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg width="800" height="500" id="scene3-svg">
            <defs>
                <rect id="scene3-area-pos" x="150" y="160" width="200" height="120" />
                <rect id="scene3-area-neg" x="350" y="280" width="100" height="120" />
                <polyline id="scene3-poly-t0" points="150,280 350,160 450,220" />
                <polyline id="scene3-poly-t2" points="150,280 250,340 450,220" />
            </defs>

            <!-- Axes -->
            <line x1="150" y1="280" x2="770" y2="280" class="axis" />
            <polygon points="770,275 780,280 770,285" class="axis-arrow" />
            
            <line x1="150" y1="400" x2="150" y2="60" class="axis" />
            <polygon points="145,60 150,50 155,60" class="axis-arrow" />
            
            <!-- Base Labels -->
            <text x="140" y="295" class="text-label" text-anchor="end">O</text>
            <text x="775" y="315" class="text-label" text-anchor="middle">t</text>
            
            <!-- Y Axis Labels (Dynamic) -->
            <text x="140" y="70" class="text-label step-el" id="scene3-label-vy" text-anchor="end">v_y</text>
            <text x="140" y="70" class="text-label step-el" id="scene3-label-a" text-anchor="end">a</text>
            
            <!-- X Axis Ticks -->
            <text x="250" y="305" class="text-label step-el" id="scene3-tick-t3" text-anchor="middle">T/3</text>
            <text x="350" y="305" class="text-label step-el" id="scene3-tick-2t3" text-anchor="middle">2T/3</text>
            <text x="450" y="305" class="text-label step-el" id="scene3-tick-t" text-anchor="middle">T</text>
            <text x="650" y="305" class="text-label step-el" id="scene3-tick-5t3" text-anchor="middle">5T/3</text>
            <text x="730" y="305" class="text-label step-el" id="scene3-tick-2t" text-anchor="middle">2T</text>
            
            <!-- Y Axis Ticks (v_y) -->
            <text x="140" y="225" class="text-label step-el" id="scene3-tick-at3" text-anchor="end">aT/3</text>
            <text x="140" y="165" class="text-label step-el" id="scene3-tick-2at3" text-anchor="end">2aT/3</text>
            <text x="140" y="345" class="text-label step-el" id="scene3-tick-nat3" text-anchor="end">-aT/3</text>
            
            <!-- Y Axis Ticks (a) -->
            <text x="140" y="165" class="text-label step-el" id="scene3-tick-a" text-anchor="end">a</text>
            <text x="140" y="405" class="text-label step-el" id="scene3-tick-na" text-anchor="end">-a</text>
            
            <!-- Grid Lines -->
            <g id="scene3-grid-vy" class="step-el">
                <line x1="150" y1="220" x2="450" y2="220" class="grid-line" />
                <line x1="150" y1="160" x2="350" y2="160" class="grid-line" />
                <line x1="150" y1="340" x2="250" y2="340" class="grid-line" />
                <line x1="250" y1="280" x2="250" y2="340" class="grid-line" />
                <line x1="350" y1="280" x2="350" y2="160" class="grid-line" />
                <line x1="450" y1="280" x2="450" y2="220" class="grid-line" />
            </g>
            
            <!-- Lines -->
            <use href="#scene3-poly-t0" class="line-t0 step-el" id="scene3-line-t0" />
            <use href="#scene3-poly-t2" class="line-t2 step-el" id="scene3-line-t2" />
            
            <circle cx="450" cy="220" r="4" class="point-intersect step-el" id="scene3-point-intersect" />
            
            <!-- a-t Graph -->
            <g id="scene3-graph-at" class="step-el">
                <!-- Areas -->
                <use href="#scene3-area-pos" class="area-pos" />
                <use href="#scene3-area-neg" class="area-neg" />
                
                <!-- Square Wave -->
                <line x1="150" y1="160" x2="350" y2="160" class="line-at" />
                <line x1="350" y1="160" x2="350" y2="400" class="grid-line" />
                <line x1="350" y1="400" x2="450" y2="400" class="line-at" />
                <line x1="450" y1="400" x2="450" y2="160" class="grid-line" />
                <line x1="450" y1="160" x2="650" y2="160" class="line-at" />
                <line x1="650" y1="160" x2="650" y2="400" class="grid-line" />
                <line x1="650" y1="400" x2="730" y2="400" class="line-at" />
            </g>
            
        </svg>
        
        <div id="scene3-controls">
            <button id="scene3-btn-prev">◀ 上一步</button>
            <button id="scene3-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 3;
        
        const btnPrev = document.getElementById('scene3-btn-prev');
        const btnNext = document.getElementById('scene3-btn-next');
        
        // Elements
        const elVy = document.getElementById('scene3-label-vy');
        const elA = document.getElementById('scene3-label-a');
        
        const tickT3 = document.getElementById('scene3-tick-t3');
        const tick2T3 = document.getElementById('scene3-tick-2t3');
        const tickT = document.getElementById('scene3-tick-t');
        const tick5T3 = document.getElementById('scene3-tick-5t3');
        const tick2T = document.getElementById('scene3-tick-2t');
        
        const tickAT3 = document.getElementById('scene3-tick-at3');
        const tick2AT3 = document.getElementById('scene3-tick-2at3');
        const tickNAT3 = document.getElementById('scene3-tick-nat3');
        
        const tickA = document.getElementById('scene3-tick-a');
        const tickNA = document.getElementById('scene3-tick-na');
        
        const gridVy = document.getElementById('scene3-grid-vy');
        const lineT0 = document.getElementById('scene3-line-t0');
        const lineT2 = document.getElementById('scene3-line-t2');
        const ptIntersect = document.getElementById('scene3-point-intersect');
        
        const graphAt = document.getElementById('scene3-graph-at');
        
        function updateScene() {
            // Reset all
            const allEls = document.querySelectorAll('.step-el');
            allEls.forEach(el => el.classList.remove('visible'));
            
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
            
            if (currentStep >= 0 && currentStep <= 2) {
                elVy.classList.add('visible');
            }
            
            if (currentStep >= 1 && currentStep <= 2) {
                tick2T3.classList.add('visible');
                tickT.classList.add('visible');
                tickAT3.classList.add('visible');
                tick2AT3.classList.add('visible');
                gridVy.classList.add('visible');
                lineT0.classList.add('visible');
            }
            
            if (currentStep === 2) {
                tickT3.classList.add('visible');
                tickNAT3.classList.add('visible');
                lineT2.classList.add('visible');
                ptIntersect.classList.add('visible');
            }
            
            if (currentStep === 3) {
                elA.classList.add('visible');
                tick2T3.classList.add('visible');
                tickT.classList.add('visible');
                tick5T3.classList.add('visible');
                tick2T.classList.add('visible');
                tickA.classList.add('visible');
                tickNA.classList.add('visible');
                graphAt.classList.add('visible');
            }
        }
        
        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });
        
        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });
        
        // Init
        updateScene();
    })();
    </script>
</body>
</html>
