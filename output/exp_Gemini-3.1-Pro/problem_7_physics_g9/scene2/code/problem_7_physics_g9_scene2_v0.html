<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .scene2-formula-step {
            position: absolute;
            left: 400px;
            width: 350px;
            opacity: 0;
            transition: opacity 0.5s ease;
            font-size: 16px;
            line-height: 1.5;
        }
        #scene2-step1-formula { top: 60px; }
        #scene2-step2-formula { top: 160px; }
        #scene2-step3-formula { top: 300px; }

        .scene2-vector {
            transition: opacity 0.5s ease;
            opacity: 0;
        }

        @keyframes scene2-breathe {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        .scene2-anim-t {
            transform-origin: 215px 290px;
        }
        .scene2-anim-f {
            transform-origin: 185px 290px;
        }
        
        .scene2-breathing {
            animation: scene2-breathe 1.5s infinite ease-in-out;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <div style="position: absolute; left: 50px; top: 150px; width: 300px; height: 270px; background-color: #e3f2fd; opacity: 0.3;"></div>
  <div style="position: absolute; left: 150px; top: 150px; width: 100px; height: 60px; background-color: white; opacity: 0.3;"></div>
  <div style="position: absolute; left: 160px; top: 250px; width: 80px; height: 80px; background-color: white;"></div>
        <svg width="800" height="500" id="scene2-svg" style="position: relative; z-index: 1;">
            <defs>
                <marker id="scene2-arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0" />
                </marker>
                <marker id="scene2-arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828" />
                </marker>
                <marker id="scene2-arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32" />
                </marker>
            </defs>

            <!-- Water body -->
            
            
            <!-- Water surface -->
            <line x1="50" y1="150" x2="350" y2="150" stroke="black" stroke-width="2" />
            
            <!-- Water ripples -->
            <line x1="50" y1="190" x2="350" y2="190" stroke="#90caf9" stroke-width="1" stroke-dasharray="5,5" />
            <line x1="50" y1="230" x2="350" y2="230" stroke="#90caf9" stroke-width="1" stroke-dasharray="5,5" />
            <line x1="50" y1="270" x2="350" y2="270" stroke="#90caf9" stroke-width="1" stroke-dasharray="5,5" />
            <line x1="50" y1="310" x2="350" y2="310" stroke="#90caf9" stroke-width="1" stroke-dasharray="5,5" />
            <line x1="50" y1="350" x2="350" y2="350" stroke="#90caf9" stroke-width="1" stroke-dasharray="5,5" />
            <line x1="50" y1="390" x2="350" y2="390" stroke="#90caf9" stroke-width="1" stroke-dasharray="5,5" />

            <!-- Jia block (faded) -->
            <g opacity="0.3">
                <line x1="150" y1="150" x2="250" y2="150" stroke="#888888" stroke-width="2" />
  <line x1="250" y1="150" x2="250" y2="210" stroke="#888888" stroke-width="2" />
  <line x1="250" y1="210" x2="150" y2="210" stroke="#888888" stroke-width="2" />
  <line x1="150" y1="210" x2="150" y2="150" stroke="#888888" stroke-width="2" />
                <text x="130" y="165" fill="#888888" font-size="18" text-anchor="middle" dominant-baseline="middle">甲</text>
            </g>

            <!-- Rope (faded) -->
            <line x1="200" y1="210" x2="200" y2="250" stroke="#888888" stroke-width="2" opacity="0.3" />

            <!-- Yi block -->
            <line x1="160" y1="250" x2="240" y2="250" stroke="black" stroke-width="2" />
  <line x1="240" y1="250" x2="240" y2="330" stroke="black" stroke-width="2" />
  <line x1="240" y1="330" x2="160" y2="330" stroke="black" stroke-width="2" />
  <line x1="160" y1="330" x2="160" y2="250" stroke="black" stroke-width="2" />
            <text x="140" y="290" fill="black" font-size="18" text-anchor="middle" dominant-baseline="middle">乙</text>

            <!-- Vectors -->
            <!-- G_Yi -->
            <g id="scene2-vec-g" class="scene2-vector">
                <line x1="200" y1="290" x2="200" y2="380" stroke="#1565c0" stroke-width="2" marker-end="url(#scene2-arrow-blue)" />
                <text x="230" y="375" fill="#1565c0" font-size="16">G_乙</text>
            </g>

            <!-- F_buoyancy -->
            <g id="scene2-vec-f" class="scene2-vector scene2-anim-f">
                <line x1="185" y1="290" x2="185" y2="210" stroke="#c62828" stroke-width="2" marker-end="url(#scene2-arrow-red)" />
                <text x="90" y="220" fill="#c62828" font-size="16">F_浮乙</text>
            </g>

            <!-- Tension T -->
            <g id="scene2-vec-t" class="scene2-vector scene2-anim-t">
                <line x1="215" y1="290" x2="215" y2="240" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene2-arrow-green)" />
                <text x="240" y="245" fill="#2e7d32" font-size="16">T</text>
            </g>
        </svg>

        <!-- Formulas -->
        <div id="scene2-step1-formula" class="scene2-formula-step">
            <b>1. 乙物块受力分析</b><br>
            乙物块受到重力、浮力和绳子的拉力，处于平衡状态：<br>
            $$G_乙 = F_{浮乙} + T$$
        </div>

        <div id="scene2-step2-formula" class="scene2-formula-step">
            <b>2. 密度推导</b><br>
            由于绳子有拉力，即 $T > 0$，所以：<br>
            $$G_乙 > F_{浮乙}$$
            $$ho_乙 g V_乙 > ho_水 g V_乙$$
            $$ho_乙 > ho_水$$
            <span style="color: #d32f2f; font-weight: bold;">结论：选项C错误</span>
        </div>

        <div id="scene2-step3-formula" class="scene2-formula-step">
            <b>3. 质量推导</b><br>
            结合情境一可知，绳子的拉力 $T = G_丙$。<br>
            代入平衡方程得：<br>
            $$G_乙 = F_{浮乙} + G_丙$$
            由于乙浸没在水中，即 $F_{浮乙} > 0$，所以：<br>
            $$G_乙 > G_丙 \implies m_乙 > m_丙$$
            <span style="color: #388e3c; font-weight: bold;">结论：选项D正确</span>
        </div>

        <div id="scene2-controls">
            <button id="scene2-btn-prev" disabled>◀ 上一步</button>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 3;

        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');

        const vecG = document.getElementById('scene2-vec-g');
        const vecF = document.getElementById('scene2-vec-f');
        const vecT = document.getElementById('scene2-vec-t');

        const form1 = document.getElementById('scene2-step1-formula');
        const form2 = document.getElementById('scene2-step2-formula');
        const form3 = document.getElementById('scene2-step3-formula');

        function updateStep() {
            // Update buttons
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;

            // Step 1: Show vectors and formula 1
            if (currentStep >= 1) {
                vecG.style.opacity = 1;
                vecF.style.opacity = 1;
                vecT.style.opacity = 1;
                form1.style.opacity = 1;
            } else {
                vecG.style.opacity = 0;
                vecF.style.opacity = 0;
                vecT.style.opacity = 0;
                form1.style.opacity = 0;
            }

            // Step 2: T breathing, formula 2
            if (currentStep >= 2) {
                form2.style.opacity = 1;
            } else {
                form2.style.opacity = 0;
            }

            if (currentStep === 2) {
                vecT.classList.add('scene2-breathing');
            } else {
                vecT.classList.remove('scene2-breathing');
            }

            // Step 3: F breathing, formula 3
            if (currentStep >= 3) {
                form3.style.opacity = 1;
            } else {
                form3.style.opacity = 0;
            }

            if (currentStep === 3) {
                vecF.classList.add('scene2-breathing');
            } else {
                vecF.classList.remove('scene2-breathing');
            }
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateStep();
            }
        });

        // Initialize
        updateStep();
    })();
    </script>
</body>
</html>
