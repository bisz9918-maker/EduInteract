<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button:hover:not(:disabled) { background: #e9e9e9; }
        
        /* SVG Styles */
        .scene1-line { stroke: #000; stroke-width: 2; fill: none; }
        .scene1-dashed { stroke: #888; stroke-width: 1.5; stroke-dasharray: 5,5; fill: none; }
        .scene1-water { stroke: #1565c0; stroke-width: 2; stroke-dasharray: 8,4; fill: none; }
        .scene1-dim { stroke: #2e7d32; stroke-width: 1.5; fill: none; }
        .scene1-vector { stroke: #c62828; stroke-width: 2; fill: none; }
        .scene1-text { font-size: 14px; fill: #000; user-select: none; }
        .scene1-text-dim { font-size: 14px; fill: #2e7d32; user-select: none; }
        .scene1-text-vector { font-size: 14px; fill: #c62828; user-select: none; }
        .scene1-mass { fill: #fff; stroke: #000; stroke-width: 2; }
        .scene1-point { fill: #000; }
        .scene1-rect { fill: #000; }
        
        .scene1-transition { transition: opacity 0.4s ease; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <defs>
                <!-- 绿色标注箭头 -->
                <marker id="scene1-arrow-dim-start" markerWidth="8" markerHeight="8" refX="0" refY="4" orient="auto">
                    <path d="M 8 0 L 0 4 L 8 8 Z" fill="#2e7d32" />
                </marker>
                <marker id="scene1-arrow-dim-end" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
                    <path d="M 0 0 L 8 4 L 0 8 Z" fill="#2e7d32" />
                </marker>
                <!-- 红色矢量箭头 -->
                <marker id="scene1-arrow-vector" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
                    <path d="M 0 0 L 8 4 L 0 8 Z" fill="#c62828" />
                </marker>
            </defs>

            <!-- 辅助虚线 -->
            <g id="scene1-aux-lines" class="scene1-transition">
                <line x1="300" y1="80" x2="380" y2="80" class="scene1-dashed" id="scene1-aux-o-h" />
                <line x1="204" y1="152" x2="300" y2="152" class="scene1-dashed" id="scene1-aux-m0-h" />
                <line x1="300" y1="200" x2="460" y2="200" class="scene1-dashed" id="scene1-aux-m1-h" />
                <line x1="204" y1="220" x2="204" y2="370" class="scene1-dashed" id="scene1-aux-bank-v" />
                <line x1="300" y1="80" x2="300" y2="340" class="scene1-dashed" id="scene1-aux-o-v" />
                <line x1="444" y1="308" x2="444" y2="370" class="scene1-dashed" id="scene1-aux-m2-v" />
            </g>

            <!-- 静态环境 (步骤0) -->
            <g id="scene1-env" class="scene1-transition">
                <!-- 岸边 -->
                <polyline points="50,220 204,220 204,400" class="scene1-line" />
                <!-- 岸边斜线装饰 -->
                <line x1="180" y1="220" x2="170" y2="230" class="scene1-line" stroke-width="1" />
                <line x1="150" y1="220" x2="140" y2="230" class="scene1-line" stroke-width="1" />
                <line x1="120" y1="220" x2="110" y2="230" class="scene1-line" stroke-width="1" />
                <line x1="90" y1="220" x2="80" y2="230" class="scene1-line" stroke-width="1" />
                <line x1="204" y1="250" x2="194" y2="260" class="scene1-line" stroke-width="1" />
                <line x1="204" y1="280" x2="194" y2="290" class="scene1-line" stroke-width="1" />
                <line x1="204" y1="310" x2="194" y2="320" class="scene1-line" stroke-width="1" />
                <line x1="204" y1="340" x2="194" y2="350" class="scene1-line" stroke-width="1" />
                
                <!-- 水面 -->
                <line x1="204" y1="308" x2="750" y2="308" class="scene1-water" />
                
                <!-- 浮台 -->
                <rect x="394" y="308" width="100" height="12" class="scene1-rect" />
                <text x="490" y="335" class="scene1-text">浮台</text>
                
                <!-- 悬挂点 O -->
                <circle cx="300" cy="80" r="3" class="scene1-point" />
                <text x="300" y="65" class="scene1-text" text-anchor="middle">O</text>
                
                <!-- 总高度 H -->
                <line x1="380" y1="80" x2="380" y2="308" class="scene1-dim" marker-start="url(#scene1-arrow-dim-start)" marker-end="url(#scene1-arrow-dim-end)" />
                <text x="395" y="194" class="scene1-text-dim">H</text>
            </g>

            <!-- 初始状态 (步骤0) -->
            <g id="scene1-state0" class="scene1-transition">
                <line x1="300" y1="80" x2="204" y2="152" class="scene1-line" />
                <circle cx="204" cy="152" r="6" class="scene1-mass" />
                <text x="235" y="90" class="scene1-text">l</text>
                <text x="190" y="145" class="scene1-text" text-anchor="end">m</text>
                
                <!-- 夹角 α -->
                <path d="M 300 120 A 40 40 0 0 0 268 104" class="scene1-line" stroke-width="1" />
                <text x="285" y="120" class="scene1-text">α</text>
            </g>

            <!-- 摆动过程 (步骤1) -->
            <g id="scene1-state1" class="scene1-transition">
                <!-- 摆动圆弧 -->
                <path d="M 204 152 A 120 120 0 0 0 300 200" class="scene1-dashed" />
                
                <!-- 最低点绳子和质点 -->
                <line x1="300" y1="80" x2="300" y2="200" class="scene1-line" />
                <circle cx="300" cy="200" r="6" class="scene1-mass" />
                
                <!-- 下降高度 Δh -->
                <line x1="285" y1="152" x2="285" y2="200" class="scene1-dim" marker-start="url(#scene1-arrow-dim-start)" marker-end="url(#scene1-arrow-dim-end)" />
                <text x="250" y="180" class="scene1-text-dim" text-anchor="end">Δh</text>
                
                <!-- 速度 v -->
                <line x1="300" y1="200" x2="350" y2="200" class="scene1-vector" marker-end="url(#scene1-arrow-vector)" />
                <text x="355" y="195" class="scene1-text-vector">v</text>
            </g>

            <!-- 最低点受力 (步骤2) -->
            <g id="scene1-state2" class="scene1-transition">
                <!-- 重力 mg -->
                <line x1="300" y1="200" x2="300" y2="260" class="scene1-vector" marker-end="url(#scene1-arrow-vector)" />
                <text x="330" y="255" class="scene1-text-vector">mg</text>
                
                <!-- 拉力 F -->
                <line x1="300" y1="194" x2="300" y2="100" class="scene1-vector" marker-end="url(#scene1-arrow-vector)" />
                <text x="310" y="120" class="scene1-text-vector">F</text>
            </g>

            <!-- 平抛运动 (步骤3) -->
            <g id="scene1-state3" class="scene1-transition">
                <!-- 平抛抛物线 -->
                <path d="M 300 200 Q 372 200 444 308" class="scene1-dashed" />
                
                <!-- 落水点质点 -->
                <circle cx="444" cy="308" r="6" class="scene1-mass" />
                
                <!-- 平抛高度 h' -->
                <line x1="460" y1="200" x2="460" y2="308" class="scene1-dim" marker-start="url(#scene1-arrow-dim-start)" marker-end="url(#scene1-arrow-dim-end)" />
                <text x="475" y="254" class="scene1-text-dim">h'</text>
                
                <!-- 水平距离 x -->
                <line x1="300" y1="340" x2="444" y2="340" class="scene1-dim" marker-start="url(#scene1-arrow-dim-start)" marker-end="url(#scene1-arrow-dim-end)" />
                <text x="372" y="355" class="scene1-text-dim" text-anchor="middle">x</text>
            </g>

            <!-- 几何关系 (步骤4) -->
            <g id="scene1-state4" class="scene1-transition">
                <!-- 水平距离 x1 -->
                <line x1="204" y1="340" x2="300" y2="340" class="scene1-dim" marker-start="url(#scene1-arrow-dim-start)" marker-end="url(#scene1-arrow-dim-end)" />
                <text x="252" y="355" class="scene1-text-dim" text-anchor="middle">x₁</text>
                
                <!-- 总距离 d -->
                <line x1="204" y1="370" x2="444" y2="370" class="scene1-dim" marker-start="url(#scene1-arrow-dim-start)" marker-end="url(#scene1-arrow-dim-end)" />
                <text x="324" y="385" class="scene1-text-dim" text-anchor="middle">d</text>
            </g>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 4;
        
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        
        const state0 = document.getElementById('scene1-state0');
        const state1 = document.getElementById('scene1-state1');
        const state2 = document.getElementById('scene1-state2');
        const state3 = document.getElementById('scene1-state3');
        const state4 = document.getElementById('scene1-state4');
        
        const auxM0H = document.getElementById('scene1-aux-m0-h');
        const auxM1H = document.getElementById('scene1-aux-m1-h');
        const auxBankV = document.getElementById('scene1-aux-bank-v');
        const auxOV = document.getElementById('scene1-aux-o-v');
        const auxM2V = document.getElementById('scene1-aux-m2-v');
        
        function setOpacity(el, opacity) {
            if (el) {
                el.style.opacity = opacity;
                el.style.display = opacity === 0 ? 'none' : '';
            }
        }
        
        function updateState() {
            // 步骤0：初始状态
            setOpacity(state0, currentStep >= 0 ? (currentStep >= 1 ? 0.3 : 1) : 0);
            
            // 步骤1：摆动过程
            setOpacity(state1, currentStep >= 1 ? (currentStep >= 3 ? 0.3 : 1) : 0);
            setOpacity(auxM0H, currentStep >= 1 ? 1 : 0);
            
            // 步骤2：最低点受力
            setOpacity(state2, currentStep >= 2 ? (currentStep >= 3 ? 0.3 : 1) : 0);
            
            // 步骤3：平抛运动
            setOpacity(state3, currentStep >= 3 ? 1 : 0);
            setOpacity(auxM1H, currentStep >= 3 ? 1 : 0);
            setOpacity(auxOV, currentStep >= 3 ? 1 : 0);
            setOpacity(auxM2V, currentStep >= 3 ? 1 : 0);
            
            // 步骤4：几何关系
            setOpacity(state4, currentStep >= 4 ? 1 : 0);
            setOpacity(auxBankV, currentStep >= 4 ? 1 : 0);
            
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
        }
        
        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateState();
            }
        });
        
        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateState();
            }
        });
        
        // 初始化
        updateState();
    })();
    </script>
</body>
</html>
