<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .math-label { position: absolute; pointer-events: none; font-size: 14px; }
        .text-label { position: absolute; pointer-events: none; font-size: 14px; color: #000; }
        .step-element { opacity: 0; transition: opacity 0.3s ease; pointer-events: none; }
        .step-active { opacity: 1; }
        .highlight-block { stroke: #ff9800; stroke-width: 3; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <defs>
                <marker id="scene1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828" />
                </marker>
                <marker id="scene1-arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(198, 40, 40, 0.5)" />
                </marker>
                <marker id="scene1-arrow-black" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
                </marker>
                <marker id="scene1-arrow-black-rev" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 10 0 L 0 5 L 10 10 z" fill="#000000" />
                </marker>
                <pattern id="scene1-hatch" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
                    <line x1="0" y1="0" x2="0" y2="10" stroke="#000" stroke-width="1" />
                </pattern>
            </defs>

            <!-- Base Scene (Step 0) -->
            <g id="scene1-base">
                <!-- Walls and surfaces -->
                <rect x="80" y="150" width="20" height="200" fill="url(#scene1-hatch)" />
                <line x1="100" y1="150" x2="100" y2="350" stroke="#000" stroke-width="2" />
                
                <line x1="100" y1="280" x2="400" y2="280" stroke="#000" stroke-width="2" />
                <line x1="400" y1="280" x2="400" y2="450" stroke="#000" stroke-width="2" />
                <line x1="400" y1="450" x2="700" y2="450" stroke="#000" stroke-width="2" />
                
                <rect x="530" y="30" width="100" height="20" fill="url(#scene1-hatch)" />
                <line x1="530" y1="50" x2="630" y2="50" stroke="#000" stroke-width="2" />
                
                <!-- Pulley -->
                <line x1="580" y1="50" x2="580" y2="90" stroke="#000" stroke-width="2" />
                <circle cx="580" cy="90" r="20" fill="none" stroke="#000" stroke-width="2" />
                <circle cx="580" cy="90" r="3" fill="#000" />
                
                <!-- Blocks -->
                <rect id="scene1-block-a" x="280" y="240" width="40" height="40" fill="#1565c0" fill-opacity="0.2" stroke="#000" stroke-width="1.5" />
                <text x="300" y="265" font-size="16" text-anchor="middle" fill="#000">A</text>
                
                <rect id="scene1-block-b" x="580" y="300" width="40" height="40" fill="#1565c0" fill-opacity="0.2" stroke="#000" stroke-width="1.5" />
                <text x="600" y="325" font-size="16" text-anchor="middle" fill="#000">B</text>
                
                <!-- Spring -->
                <polyline points="100,260 110,250 130,270 150,250 170,270 190,250 210,270 230,250 250,270 270,250 280,260" fill="none" stroke="#000" stroke-width="1.5" />
                
                <!-- Strings -->
                <line x1="320" y1="240" x2="562" y2="100" stroke="#000" stroke-width="1.5" />
                <line x1="600" y1="90" x2="600" y2="300" stroke="#000" stroke-width="1.5" />
                
                <!-- 30 deg arc -->
                <line x1="320" y1="240" x2="400" y2="240" stroke="#000" stroke-width="1" stroke-dasharray="4,4" />
                <path d="M 360 240 A 40 40 0 0 0 354.6 219.8" fill="none" stroke="#000" stroke-width="1" />
            </g>

            <!-- Step 1: B Forces -->
            <g id="scene1-step1" class="step-element">
                <line x1="600" y1="320" x2="600" y2="390" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrow)" />
                <line x1="600" y1="300" x2="600" y2="210" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrow)" />
            </g>

            <!-- Step 2: A Forces -->
            <g id="scene1-step2" class="step-element">
                <line x1="300" y1="260" x2="300" y2="340" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrow)" />
                <line x1="300" y1="280" x2="300" y2="180" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrow)" />
                <line x1="280" y1="260" x2="180" y2="260" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrow)" />
                <line x1="320" y1="240" x2="420" y2="182" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrow)" />
            </g>

            <!-- Step 3: A Force Components -->
            <g id="scene1-step3" class="step-element">
                <line x1="320" y1="240" x2="420" y2="240" stroke="rgba(198, 40, 40, 0.5)" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#scene1-arrow-dim)" />
                <line x1="420" y1="240" x2="420" y2="182" stroke="rgba(198, 40, 40, 0.5)" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#scene1-arrow-dim)" />
            </g>

            <!-- Step 4: Amplitude -->
            <g id="scene1-step4" class="step-element">
                <line x1="200" y1="220" x2="200" y2="350" stroke="#888" stroke-width="1.5" stroke-dasharray="4,4" />
                <line x1="280" y1="220" x2="280" y2="350" stroke="#888" stroke-width="1.5" stroke-dasharray="4,4" />
                <line x1="200" y1="330" x2="280" y2="330" stroke="#000" stroke-width="1.5" marker-start="url(#scene1-arrow-black-rev)" marker-end="url(#scene1-arrow-black)" />
            </g>
        </svg>

        <!-- HTML Labels -->
        <div id="scene1-labels">
            <!-- Base -->
            <div class="math-label" style="left: 385px; top: 210px;">$30^\circ$</div>
            
            <!-- Step 1 -->
            <div id="scene1-label-b-mg" class="math-label step-element" style="left: 610px; top: 370px; color: #c62828;">$mg$</div>
            <div id="scene1-label-b-t" class="math-label step-element" style="left: 610px; top: 210px; color: #c62828;">$T_{拉}$</div>
            <div id="scene1-formula-1" class="math-label step-element" style="left: 650px; top: 270px;">$T_{拉} = mg$</div>
            
            <!-- Step 2 -->
            <div id="scene1-label-a-mg" class="math-label step-element" style="left: 310px; top: 320px; color: #c62828;">$mg$</div>
            <div id="scene1-label-a-n" class="math-label step-element" style="left: 280px; top: 150px; color: #c62828;">$N$</div>
            <div id="scene1-label-a-fk" class="math-label step-element" style="left: 230px; top: 230px; color: #c62828;">$F_k$</div>
            <div id="scene1-label-a-t" class="math-label step-element" style="left: 350px; top: 130px; color: #c62828;">$T_{拉}$</div>
            
            <!-- Step 3 -->
            <div id="scene1-label-a-tx" class="math-label step-element" style="left: 370px; top: 250px; color: #c62828;">$T_x$</div>
            <div id="scene1-formula-2" class="math-label step-element" style="left: 150px; top: 90px;">$F_k = T_{拉} \cos 30^\circ = rac{\sqrt{3}}{2}mg$</div>
            
            <!-- Step 4 -->
            <div id="scene1-label-orig" class="text-label step-element" style="left: 170px; top: 355px; color: #888;">原长位置</div>
            <div id="scene1-label-init" class="text-label step-element" style="left: 250px; top: 355px; color: #888;">初始位置</div>
            <div id="scene1-label-amp" class="math-label step-element" style="left: 225px; top: 305px;">$x_0=A$</div>
            <div id="scene1-formula-3" class="math-label step-element" style="left: 150px; top: 50px;">$x_0 = rac{F_k}{k} = rac{\sqrt{3}mg}{2k}$</div>
            <div id="scene1-text-desc" class="text-label step-element" style="left: 200px; top: 420px; width: 400px; text-align: center;">剪断细线后，A从静止释放，此初始伸长量即为简谐运动的振幅 A</div>
        </div>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 4;
        
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const blockA = document.getElementById('scene1-block-a');
        const blockB = document.getElementById('scene1-block-b');
        
        const stepElements = {
            1: [
                document.getElementById('scene1-step1'),
                document.getElementById('scene1-label-b-mg'),
                document.getElementById('scene1-label-b-t'),
                document.getElementById('scene1-formula-1')
            ],
            2: [
                document.getElementById('scene1-step2'),
                document.getElementById('scene1-label-a-mg'),
                document.getElementById('scene1-label-a-n'),
                document.getElementById('scene1-label-a-fk'),
                document.getElementById('scene1-label-a-t')
            ],
            3: [
                document.getElementById('scene1-step3'),
                document.getElementById('scene1-label-a-tx'),
                document.getElementById('scene1-formula-2')
            ],
            4: [
                document.getElementById('scene1-step4'),
                document.getElementById('scene1-label-orig'),
                document.getElementById('scene1-label-init'),
                document.getElementById('scene1-label-amp'),
                document.getElementById('scene1-formula-3'),
                document.getElementById('scene1-text-desc')
            ]
        };

        function updateView() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
            
            // Highlight blocks
            if (currentStep === 1) {
                blockB.classList.add('highlight-block');
                blockA.classList.remove('highlight-block');
            } else if (currentStep >= 2) {
                blockB.classList.remove('highlight-block');
                blockA.classList.add('highlight-block');
            } else {
                blockB.classList.remove('highlight-block');
                blockA.classList.remove('highlight-block');
            }
            
            // Show/hide step elements
            for (let i = 1; i <= maxStep; i++) {
                const els = stepElements[i];
                if (els) {
                    els.forEach(el => {
                        if (el) {
                            if (i <= currentStep) {
                                el.classList.add('step-active');
                            } else {
                                el.classList.remove('step-active');
                            }
                        }
                    });
                }
            }
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateView();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateView();
            }
        });

        // Initialize
        updateView();
    })();
    </script>
</body>
</html>
