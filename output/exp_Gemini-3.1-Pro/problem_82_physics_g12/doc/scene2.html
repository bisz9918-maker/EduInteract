<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button.active { background: #e0e0e0; border-color: #999; font-weight: bold; }
        .scene2-text { font-size: 16px; font-family: sans-serif; }
        #scene2-state-text { position: absolute; top: 40px; left: 400px; width: 350px; font-size: 16px; line-height: 1.5; color: #333; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500">
            <defs>
                <marker id="scene2-arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828" />
                </marker>
                <marker id="scene2-arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32" />
                </marker>
                <marker id="scene2-arrow-gray-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#888888" />
                </marker>
                <marker id="scene2-arrow-gray-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#888888" />
                </marker>
            </defs>

            <!-- Background -->
            <g id="scene2-diagonal-line"></g>
            <line x1="500" y1="160" x2="500" y2="400" stroke="#888888" stroke-width="4" />
            <line x1="50" y1="400" x2="750" y2="400" stroke="#888888" stroke-width="4" />

            <!-- State 1 Group -->
            <g id="scene2-state1-group">
                <!-- B ball initial -->
                <circle cx="292" cy="280" r="15" fill="#1565c0" />
                <text x="230" y="240" class="scene2-text" fill="#1565c0">B (2m)</text>
                
                <!-- Forces on initial B -->
                <line x1="292" y1="280" x2="344" y2="250" stroke="#c62828" stroke-width="2" marker-end="url(#scene2-arrow-red)" />
                <text x="340" y="235" class="scene2-text" fill="#c62828">T<tspan dy="4" font-size="12">AB</tspan></text>
                
                <line x1="292" y1="280" x2="240" y2="310" stroke="#c62828" stroke-width="2" marker-end="url(#scene2-arrow-red)" />
                <text x="200" y="335" class="scene2-text" fill="#c62828">T<tspan dy="4" font-size="12">BC</tspan></text>
                
                <line x1="292" y1="280" x2="292" y2="340" stroke="#c62828" stroke-width="2" marker-end="url(#scene2-arrow-red)" />
                <text x="305" y="345" class="scene2-text" fill="#c62828">2mg</text>

                <!-- B ball vertical -->
                <circle cx="500" cy="280" r="15" fill="#1565c0" />
                <text x="525" y="275" class="scene2-text" fill="#1565c0">B</text>

                <!-- Forces on vertical B -->
                <line x1="500" y1="280" x2="500" y2="220" stroke="#c62828" stroke-width="2" marker-end="url(#scene2-arrow-red)" />
                <text x="515" y="230" class="scene2-text" fill="#c62828">T<tspan dy="4" font-size="12">BC</tspan></text>
                
                <line x1="500" y1="280" x2="500" y2="340" stroke="#c62828" stroke-width="2" marker-end="url(#scene2-arrow-red)" />
                <text x="515" y="340" class="scene2-text" fill="#c62828">2mg</text>
            </g>

            <!-- State 2 Group -->
            <g id="scene2-state2-group" style="display: none; opacity: 0;">
                <!-- B ball initial (transparent) -->
                <circle cx="292" cy="280" r="15" fill="#1565c0" opacity="0.3" />
                <text x="240" y="240" class="scene2-text" fill="#1565c0" opacity="0.5">v=0</text>

                <!-- B ball final -->
                <circle cx="500" cy="385" r="15" fill="#1565c0" />
                <text x="460" y="380" class="scene2-text" fill="#1565c0">B</text>

                <!-- Velocity -->
                <line x1="500" y1="385" x2="500" y2="445" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene2-arrow-green)" />
                <text x="515" y="440" class="scene2-text" fill="#2e7d32">v<tspan dy="4" font-size="12">B</tspan></text>

                <!-- Height auxiliary lines -->
                <line x1="292" y1="280" x2="650" y2="280" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5" />
                <line x1="500" y1="385" x2="650" y2="385" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5" />
                
                <!-- Height difference arrow -->
                <line x1="620" y1="280" x2="620" y2="385" stroke="#888888" stroke-width="1.5" marker-start="url(#scene2-arrow-gray-start)" marker-end="url(#scene2-arrow-gray-end)" />
                <text x="630" y="335" class="scene2-text" fill="#666666">0.5L</text>
            </g>
        </svg>

        <div id="scene2-state-text">
            <!-- Text will be injected here -->
        </div>

        <div id="scene2-controls">
            <button id="scene2-btn-state1" class="active">受力分析法</button>
            <button id="scene2-btn-state2">动能定理法</button>
        </div>
    </div>

    <script>
    (function() {
        // Generate diagonal line segments to avoid huge bounding box overlap detection
        const diagGroup = document.getElementById('scene2-diagonal-line');
        const x1 = 84, y1 = 400, x2 = 500, y2 = 160;
        const segments = 50;
        for (let i = 0; i < segments; i++) {
            const sx1 = x1 + (x2 - x1) * (i / segments);
            const sy1 = y1 + (y2 - y1) * (i / segments);
            const sx2 = x1 + (x2 - x1) * ((i + 1) / segments);
            const sy2 = y1 + (y2 - y1) * ((i + 1) / segments);
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', sx1);
            line.setAttribute('y1', sy1);
            line.setAttribute('x2', sx2);
            line.setAttribute('y2', sy2);
            line.setAttribute('stroke', '#888888');
            line.setAttribute('stroke-width', '4');
            diagGroup.appendChild(line);
        }

        const btnState1 = document.getElementById('scene2-btn-state1');
        const btnState2 = document.getElementById('scene2-btn-state2');
        const groupState1 = document.getElementById('scene2-state1-group');
        const groupState2 = document.getElementById('scene2-state2-group');
        const stateText = document.getElementById('scene2-state-text');

        const textState1 = "<strong>受力分析法：</strong><br>绳子拉力为变力，直接求功困难。";
        const textState2 = "<strong>动能定理法：</strong><br>\( W_G + W_\text{绳} = \Delta E_k \)<br>\( W_G = 2mg \times 0.5L \)";

        function show(el) {
            el.style.display = '';
            setTimeout(() => { el.style.opacity = '1'; }, 10);
        }

        function hide(el) {
            el.style.opacity = '0';
            el.style.display = 'none';
        }

        function updateMath() {
            if (window.MathJax) {
                MathJax.typesetPromise([stateText]).catch(function (err) {
                    console.error(err.message);
                });
            }
        }

        function setState1() {
            btnState1.classList.add('active');
            btnState2.classList.remove('active');
            show(groupState1);
            hide(groupState2);
            stateText.innerHTML = textState1;
            updateMath();
        }

        function setState2() {
            btnState2.classList.add('active');
            btnState1.classList.remove('active');
            hide(groupState1);
            show(groupState2);
            stateText.innerHTML = textState2;
            updateMath();
        }

        btnState1.addEventListener('click', setState1);
        btnState2.addEventListener('click', setState2);

        // Initial state
        setState1();
    })();
    </script>
</body>
</html>
