<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .fade { transition: opacity 0.5s, transform 0.5s; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500">
            <!-- Definitions -->
            <defs>
                <marker id="scene2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#000" />
                </marker>
                <marker id="scene2-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0" />
                </marker>
                <marker id="scene2-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828" />
                </marker>
            </defs>

            <!-- Magnetic Field B -->
            <g id="scene2-b-field">
                <!-- Dots -->
            </g>

            <!-- Rails -->
            <line x1="100" y1="120" x2="400" y2="120" stroke="#000" stroke-width="2" />
            <line x1="100" y1="220" x2="400" y2="220" stroke="#000" stroke-width="2" />
            <line x1="400" y1="120" x2="400" y2="220" stroke="#000" stroke-width="2" />

            <!-- Resistor R -->
            <rect x="390" y="150" width="20" height="40" fill="#fff" stroke="#000" stroke-width="2" />
            <text x="420" y="175" font-size="16" fill="#000">R</text>

            <!-- Swept Area -->
            <rect id="scene2-area" class="fade" x="150" y="120" width="200" height="100" fill="#1565c0" opacity="0" />
            
            <!-- Initial Rod -->
            <line id="scene2-rod-initial" x1="350" y1="120" x2="350" y2="220" stroke="#000" stroke-width="4" />

            <!-- Final Rod -->
            <line id="scene2-rod-final" class="fade" x1="150" y1="120" x2="150" y2="220" stroke="#000" stroke-width="4" opacity="0" />

            <!-- Displacement x -->
            <g id="scene2-displacement" class="fade" opacity="0">
                <line x1="350" y1="250" x2="150" y2="250" stroke="#000" stroke-width="2" marker-end="url(#scene2-arrow)" />
                <line x1="350" y1="225" x2="350" y2="260" stroke="#000" stroke-width="1" stroke-dasharray="4,4" />
                <line x1="150" y1="225" x2="150" y2="260" stroke="#000" stroke-width="1" stroke-dasharray="4,4" />
                <text x="250" y="270" font-size="16" fill="#000" text-anchor="middle">$x$</text>
            </g>

            <!-- Forces -->
            <g id="scene2-forces" class="fade" opacity="0">
                <line x1="150" y1="170" x2="70" y2="170" stroke="#1565c0" stroke-width="2" marker-end="url(#scene2-arrow-blue)" />
                <text x="70" y="150" font-size="16" fill="#1565c0">$F$</text>
                
                <line x1="150" y1="180" x2="230" y2="180" stroke="#c62828" stroke-width="2" marker-end="url(#scene2-arrow-red)" />
            </g>

            <!-- Bar Chart Axes -->
            <g id="scene2-chart-axes" class="fade" opacity="0">
                <line x1="480" y1="350" x2="750" y2="350" stroke="#000" stroke-width="2" marker-end="url(#scene2-arrow)" />
                <line x1="500" y1="350" x2="500" y2="100" stroke="#000" stroke-width="2" marker-end="url(#scene2-arrow)" />
            </g>

            <!-- Bars -->
            <g id="scene2-bars" class="fade" opacity="0">
                <!-- WF -->
                <rect x="530" y="150" width="40" height="200" fill="#1565c0" />
                <text x="550" y="370" font-size="16" fill="#1565c0" text-anchor="middle">$W_F$</text>

                <!-- ΔEk -->
                <rect x="630" y="340" width="40" height="10" fill="#2e7d32" />
                <text x="680" y="345" font-size="16" fill="#2e7d32" alignment-baseline="middle">$\Delta E_k$</text>

                <!-- Qf -->
                <rect x="630" y="274" width="40" height="66" fill="#888888" />
                <text x="680" y="307" font-size="16" fill="#888888" alignment-baseline="middle">$Q_f$</text>

                <!-- Q总 -->
                <g id="scene2-q-total">
                    <rect x="630" y="150" width="40" height="124" fill="#c62828" />
                    <text x="680" y="212" font-size="16" fill="#c62828" alignment-baseline="middle">$Q_{总}$</text>
                </g>

                <!-- QR and Qr -->
                <g id="scene2-q-parts" class="fade" opacity="0" display="none">
                    <rect x="630" y="175" width="40" height="99" fill="#b71c1c" />
                    <text x="680" y="225" font-size="16" fill="#b71c1c" alignment-baseline="middle">$Q_R$</text>

                    <rect x="630" y="150" width="40" height="25" fill="#ef5350" />
                    <text x="680" y="162" font-size="16" fill="#ef5350" alignment-baseline="middle">$Q_r$</text>
                </g>
            </g>
        </svg>

        <!-- Formulas and HTML Texts -->
        <div id="scene2-area-text" class="fade" style="position: absolute; left: 250px; top: 135px; transform: translateX(-50%); opacity: 0; font-size: 16px; color: #000;">
            $\Delta S$
        </div>
        <div id="scene2-force-f-text" class="fade" style="position: absolute; left: 230px; top: 195px; opacity: 0; font-size: 16px; color: #c62828;">
            $f$
        </div>
        <div id="scene2-formula-q" class="fade" style="position: absolute; left: 250px; top: 320px; transform: translateX(-50%); opacity: 0; font-size: 18px;">
            $q = rac{\Delta \Phi}{R+r}$
        </div>
        <div id="scene2-formula-energy" class="fade" style="position: absolute; left: 615px; top: 80px; transform: translateX(-50%); opacity: 0; font-size: 18px; text-align: center;">
            $W_F = \Delta E_k + Q_f + Q_{总}$<br>
            <span id="scene2-formula-q-parts" class="fade" style="opacity: 0;">$Q_{总} = Q_R + Q_r$</span>
        </div>

        <div id="scene2-controls">
            <button id="scene2-btn-prev" disabled>◀ 上一步</button>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Generate B field dots
        const bField = document.getElementById('scene2-b-field');
        for (let x = 120; x <= 380; x += 40) {
            for (let y = 140; y <= 200; y += 40) {
                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', x);
                circle.setAttribute('cy', y);
                circle.setAttribute('r', 2);
                circle.setAttribute('fill', '#000');
                bField.appendChild(circle);
                
                const outerCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                outerCircle.setAttribute('cx', x);
                outerCircle.setAttribute('cy', y);
                outerCircle.setAttribute('r', 6);
                outerCircle.setAttribute('fill', 'none');
                outerCircle.setAttribute('stroke', '#000');
                outerCircle.setAttribute('stroke-width', '1');
                bField.appendChild(outerCircle);
            }
        }
        const bText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        bText.setAttribute('x', 100);
        bText.setAttribute('y', 110);
        bText.setAttribute('font-size', '16');
        bText.textContent = 'B';
        bField.appendChild(bText);

        let currentStep = 0;
        const maxStep = 4;

        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');

        const rodInitial = document.getElementById('scene2-rod-initial');
        const rodFinal = document.getElementById('scene2-rod-final');
        const area = document.getElementById('scene2-area');
        const areaText = document.getElementById('scene2-area-text');
        const displacement = document.getElementById('scene2-displacement');
        const forces = document.getElementById('scene2-forces');
        const forceFText = document.getElementById('scene2-force-f-text');
        const chartAxes = document.getElementById('scene2-chart-axes');
        const bars = document.getElementById('scene2-bars');
        const qTotal = document.getElementById('scene2-q-total');
        const qParts = document.getElementById('scene2-q-parts');
        const formulaQ = document.getElementById('scene2-formula-q');
        const formulaEnergy = document.getElementById('scene2-formula-energy');
        const formulaQParts = document.getElementById('scene2-formula-q-parts');

        function updateScene() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;

            // Step 0: Initial
            if (currentStep >= 1) {
                rodInitial.setAttribute('stroke', '#888');
                rodInitial.setAttribute('stroke-dasharray', '5,5');
                rodFinal.style.opacity = 1;
                area.style.opacity = 0.2;
                areaText.style.opacity = 1;
                displacement.style.opacity = 1;
                formulaQ.style.opacity = 1;
            } else {
                rodInitial.setAttribute('stroke', '#000');
                rodInitial.removeAttribute('stroke-dasharray');
                rodFinal.style.opacity = 0;
                area.style.opacity = 0;
                areaText.style.opacity = 0;
                displacement.style.opacity = 0;
                formulaQ.style.opacity = 0;
            }

            // Step 2: Forces
            if (currentStep >= 2) {
                forces.style.opacity = 1;
                forceFText.style.opacity = 1;
            } else {
                forces.style.opacity = 0;
                forceFText.style.opacity = 0;
            }

            // Step 3: Chart
            if (currentStep >= 3) {
                chartAxes.style.opacity = 1;
                bars.style.opacity = 1;
                formulaEnergy.style.opacity = 1;
            } else {
                chartAxes.style.opacity = 0;
                bars.style.opacity = 0;
                formulaEnergy.style.opacity = 0;
            }

            // Step 4: Q parts
            if (currentStep >= 4) {
                qTotal.style.display = 'none';
                qParts.style.display = 'block';
                // small delay to allow display:block to apply before opacity transition
                setTimeout(() => {
                    qParts.style.opacity = 1;
                    formulaQParts.style.opacity = 1;
                }, 10);
            } else {
                qTotal.style.display = 'block';
                qParts.style.opacity = 0;
                formulaQParts.style.opacity = 0;
                setTimeout(() => {
                    if (currentStep < 4) qParts.style.display = 'none';
                }, 500);
            }
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });

        updateScene();
    })();
    </script>
</body>
</html>
