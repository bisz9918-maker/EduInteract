<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene1-panel { position: absolute; width: 150px; height: 150px; font-size: 14px; line-height: 1.5; }
        #scene1-panel-left { left: 20px; top: 100px; }
        #scene1-panel-right { left: 630px; top: 100px; }
        .scene1-conclusion { color: #d32f2f; font-weight: bold; opacity: 0; transition: opacity 0.5s; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <div id="scene1-panel-left" class="scene1-panel">
            <div><strong>氧气 (O₂)</strong></div>
            <div id="scene1-o2-state">
                $P_{O_2} = P_0 + rac{mg}{4S}$<br>
                $V_{O_2} = 4S \cdot rac{H}{4} = SH$
            </div>
            <div id="scene1-o2-conclusion" class="scene1-conclusion">活塞a上升H/16<br>等温压缩</div>
        </div>
        <div id="scene1-panel-right" class="scene1-panel">
            <div><strong>氮气 (N₂)</strong></div>
            <div id="scene1-n2-state">
                $P_{N_2} = P_0 + rac{mg}{S}$<br>
                $V_{N_2} = 4S \cdot rac{3H}{4} + S \cdot rac{H}{2}$
            </div>
            <div id="scene1-n2-conclusion" class="scene1-conclusion">活塞b升至顶部<br>等压膨胀</div>
        </div>

        <div id="scene1-o2-label-html" style="position: absolute; left: 350px; top: 136px; transform: translate(-50%, -50%); font-size: 14px; color: #1565c0; pointer-events: none; z-index: 5;">氧气(O₂)</div><div id="scene1-n2-label-html" style="position: absolute; left: 350px; top: 270px; transform: translate(-50%, -50%); font-size: 14px; color: #2e7d32; pointer-events: none; z-index: 5;">氮气(N₂)</div><div id="scene1-piston-a-text-html" style="position: absolute; left: 350px; top: 173px; transform: translate(-50%, -50%); font-size: 12px; color: #ffffff; pointer-events: none; z-index: 5;">a</div><div id="scene1-piston-b-text-html" style="position: absolute; left: 535px; top: 237px; transform: translate(-50%, -50%); font-size: 12px; color: #ffffff; pointer-events: none; z-index: 5;">b</div><svg width="800" height="500" id="scene1-svg">
            <defs>
                <pattern id="scene1-adiabatic-pattern" width="8" height="8" patternUnits="userSpaceOnUse">
                    <path d="M-2,10 l12,-12 M-2,2 l4,-4 M6,10 l4,-4" stroke="#888888" stroke-width="1" />
                </pattern>
                <marker id="scene1-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
                </marker>
            </defs>

            <!-- 绝热壁 -->
            <!-- A左绝热壁 -->
            <rect x="230" y="104" width="20" height="276" fill="url(#scene1-adiabatic-pattern)" stroke="#000000" />
            <!-- A右绝热壁 -->
            <rect x="450" y="104" width="20" height="246" fill="url(#scene1-adiabatic-pattern)" stroke="#000000" />
            <!-- B左绝热壁 -->
            <rect x="490" y="104" width="20" height="246" fill="url(#scene1-adiabatic-pattern)" stroke="#000000" />
            <!-- B右绝热壁 -->
            <rect x="560" y="104" width="20" height="276" fill="url(#scene1-adiabatic-pattern)" stroke="#000000" />
            <!-- 底部绝热壁 -->
            <rect x="230" y="360" width="350" height="20" fill="url(#scene1-adiabatic-pattern)" stroke="#000000" />
            
            <!-- A顶部导热壁 -->
            <rect x="230" y="94" width="240" height="10" fill="#c62828" stroke="#000000" />
            <text x="350" y="85" text-anchor="middle" font-size="14" fill="#c62828">导热</text>

            <!-- 气缸内腔边框 (仅为了清晰，实际由壁包围) -->
            <rect x="250" y="104" width="200" height="256" fill="none" stroke="#000000" stroke-width="1" />
            <rect x="510" y="104" width="50" height="256" fill="none" stroke="#000000" stroke-width="1" />
            <rect x="450" y="350" width="60" height="10" fill="none" stroke="#000000" stroke-width="1" />
            <!-- 擦除连通管处的边框线 -->
            <line x1="450" y1="350" x2="450" y2="360" stroke="#ffffff" stroke-width="2" />
            <line x1="510" y1="350" x2="510" y2="360" stroke="#ffffff" stroke-width="2" />

            <!-- 气体区域 -->
            <!-- 氧气 -->
            <rect id="scene1-o2-rect" x="250" y="104" width="200" height="64" fill="#1565c0" opacity="0.2" />
            
            
            <!-- 氮气 -->
            <path id="scene1-n2-path" d="M250,178 L450,178 L450,350 L510,350 L510,242 L560,242 L560,360 L250,360 Z" fill="#2e7d32" opacity="0.2" />
            

            <!-- 活塞 -->
            <rect id="scene1-piston-a" x="250" y="168" width="200" height="10" fill="#000000" />
            
            
            <rect id="scene1-piston-b" x="510" y="232" width="50" height="10" fill="#000000" />
            

            <!-- 加热丝 -->
            <polyline id="scene1-heater" points="300,345 320,335 340,355 360,335 380,355 400,345" fill="none" stroke="#333333" stroke-width="2" />

            <!-- 标注 -->
            <!-- 大气压 -->
            <line x1="535" y1="60" x2="535" y2="90" stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrow)" />
            <text x="535" y="50" text-anchor="middle" font-size="14">P₀</text>

            <!-- 高度标注 H -->
            <line x1="210" y1="104" x2="210" y2="360" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" />
            <line x1="205" y1="104" x2="215" y2="104" stroke="#888888" stroke-width="1" />
            <line x1="205" y1="360" x2="215" y2="360" stroke="#888888" stroke-width="1" />
            <text x="190" y="232" text-anchor="end" alignment-baseline="middle" font-size="14">H</text>

            <!-- 高度标注 H/4 (活塞a初始) -->
            <line id="scene1-h-a-line" x1="230" y1="104" x2="230" y2="168" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" />
            <line x1="225" y1="104" x2="235" y2="104" stroke="#888888" stroke-width="1" />
            <line id="scene1-h-a-tick" x1="225" y1="168" x2="235" y2="168" stroke="#888888" stroke-width="1" />
            <text id="scene1-h-a-text" x="205" y="136" text-anchor="end" alignment-baseline="middle" font-size="14">H/4</text>

            <!-- 高度标注 H/2 (活塞b初始) -->
            <line id="scene1-h-b-line" x1="590" y1="104" x2="590" y2="232" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" />
            <line x1="585" y1="104" x2="595" y2="104" stroke="#888888" stroke-width="1" />
            <line id="scene1-h-b-tick" x1="585" y1="232" x2="595" y2="232" stroke="#888888" stroke-width="1" />
            <text id="scene1-h-b-text" x="615" y="168" text-anchor="start" alignment-baseline="middle" font-size="14">H/2</text>

            <!-- 气缸标签 -->
            <text x="350" y="400" text-anchor="middle" font-size="16">A (4S)</text>
            <text x="535" y="400" text-anchor="middle" font-size="16">B (S)</text>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 4;
        
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        
        const pistonA = document.getElementById('scene1-piston-a');
        const pistonAText = document.getElementById('scene1-piston-a-text-html');
        const pistonB = document.getElementById('scene1-piston-b');
        const pistonBText = document.getElementById('scene1-piston-b-text-html');
        
        const o2Rect = document.getElementById('scene1-o2-rect');
        const o2Label = document.getElementById('scene1-o2-label-html');
        const n2Path = document.getElementById('scene1-n2-path');
        
        const heater = document.getElementById('scene1-heater');
        
        const hALine = document.getElementById('scene1-h-a-line');
        const hATick = document.getElementById('scene1-h-a-tick');
        const hAText = document.getElementById('scene1-h-a-text');
        
        const hBLine = document.getElementById('scene1-h-b-line');
        const hBTick = document.getElementById('scene1-h-b-tick');
        const hBText = document.getElementById('scene1-h-b-text');
        
        const o2State = document.getElementById('scene1-o2-state');
        const n2State = document.getElementById('scene1-n2-state');
        const o2Conclusion = document.getElementById('scene1-o2-conclusion');
        const n2Conclusion = document.getElementById('scene1-n2-conclusion');

        // 状态定义
        const states = [
            { aY: 168, bY: 232, heaterColor: "#333333", o2Opacity: 0.2, n2Opacity: 0.2, aText: "H/4", bText: "H/2" }, // 0: 初始
            { aY: 168, bY: 104, heaterColor: "#e53935", o2Opacity: 0.2, n2Opacity: 0.2, aText: "H/4", bText: "0" },   // 1: b上升
            { aY: 168, bY: 104, heaterColor: "#333333", o2Opacity: 0.2, n2Opacity: 0.5, aText: "H/4", bText: "0" },   // 2: b上升结论
            { aY: 152, bY: 104, heaterColor: "#e53935", o2Opacity: 0.2, n2Opacity: 0.2, aText: "3H/16", bText: "0" }, // 3: a上升
            { aY: 152, bY: 104, heaterColor: "#333333", o2Opacity: 0.5, n2Opacity: 0.2, aText: "3H/16", bText: "0" }  // 4: a上升结论
        ];

        let animationFrame;
        let currentAY = states[0].aY;
        let currentBY = states[0].bY;

        function updateGeometry(aY, bY) {
            // 活塞A
            pistonA.setAttribute('y', aY);
            if(pistonAText) pistonAText.style.top = (aY + 5) + 'px';
            
            // 活塞B
            pistonB.setAttribute('y', bY);
            if(pistonBText) pistonBText.style.top = (bY + 5) + 'px';
            
            // 氧气
            o2Rect.setAttribute('height', aY - 104);
            if(o2Label) o2Label.style.top = (104 + (aY - 104) / 2) + 'px';
            
            // 氮气
            const pathD = `M250,${aY + 10} L450,${aY + 10} L450,350 L510,350 L510,${bY + 10} L560,${bY + 10} L560,360 L250,360 Z`;
            n2Path.setAttribute('d', pathD);
            
            // 标注A
            hALine.setAttribute('y2', aY);
            hATick.setAttribute('y1', aY);
            hATick.setAttribute('y2', aY);
            hAText.setAttribute('y', 104 + (aY - 104) / 2);
            
            // 标注B
            if (bY > 104) {
                hBLine.setAttribute('y2', bY);
                hBTick.setAttribute('y1', bY);
                hBTick.setAttribute('y2', bY);
                hBText.setAttribute('y', 104 + (bY - 104) / 2);
                hBLine.style.display = 'block';
                hBTick.style.display = 'block';
                hBText.style.display = 'block';
            } else {
                hBLine.style.display = 'none';
                hBTick.style.display = 'none';
                hBText.style.display = 'none';
            }
        }

        function animateTo(targetAY, targetBY, duration = 1000) {
            const startAY = currentAY;
            const startBY = currentBY;
            const startTime = performance.now();

            function step(currentTime) {
                let progress = (currentTime - startTime) / duration;
                if (progress > 1) progress = 1;
                
                // easeInOutQuad
                const ease = progress < 0.5 ? 2 * progress * progress : 1 - Math.pow(-2 * progress + 2, 2) / 2;

                currentAY = startAY + (targetAY - startAY) * ease;
                currentBY = startBY + (targetBY - startBY) * ease;

                updateGeometry(currentAY, currentBY);

                if (progress < 1) {
                    animationFrame = requestAnimationFrame(step);
                }
            }
            
            if (animationFrame) cancelAnimationFrame(animationFrame);
            animationFrame = requestAnimationFrame(step);
        }

        function updateState(step) {
            const state = states[step];
            
            animateTo(state.aY, state.bY);
            
            heater.setAttribute('stroke', state.heaterColor);
            o2Rect.setAttribute('opacity', state.o2Opacity);
            n2Path.setAttribute('opacity', state.n2Opacity);
            
            hAText.textContent = state.aText;
            hBText.textContent = state.bText;

            // 更新面板
            if (step >= 2) {
                n2Conclusion.style.opacity = 1;
                n2State.innerHTML = `$P_{N_2} = P_0 + \frac{mg}{S}$<br>$V_{N_2} = 4S \cdot \frac{3H}{4} + S \cdot H$`;
            } else {
                n2Conclusion.style.opacity = 0;
                n2State.innerHTML = `$P_{N_2} = P_0 + \frac{mg}{S}$<br>$V_{N_2} = 4S \cdot \frac{3H}{4} + S \cdot \frac{H}{2}$`;
            }

            if (step >= 4) {
                o2Conclusion.style.opacity = 1;
                o2State.innerHTML = `$P_{O_2} = P_0 + \frac{mg}{4S} + \Delta P$<br>$V_{O_2} = 4S \cdot \frac{3H}{16}$`;
            } else {
                o2Conclusion.style.opacity = 0;
                o2State.innerHTML = `$P_{O_2} = P_0 + \frac{mg}{4S}$<br>$V_{O_2} = 4S \cdot \frac{H}{4} = SH$`;
            }
            
            if (window.MathJax) {
                MathJax.typesetPromise();
            }

            btnPrev.disabled = step === 0;
            btnNext.disabled = step === maxStep;
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateState(currentStep);
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateState(currentStep);
            }
        });

        // 初始化
        updateGeometry(currentAY, currentBY);
    })();
    </script>
</body>
</html>
