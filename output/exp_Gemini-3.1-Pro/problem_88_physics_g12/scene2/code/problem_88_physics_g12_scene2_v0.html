<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f8f9fa; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button:hover:not(:disabled) { background: #e2e6ea; }
        
        /* 动画过渡 */
        .scene2-transition { transition: all 0.8s ease; }
        .scene2-fade { transition: opacity 0.5s ease; }
        
        /* 隐藏状态 */
        .scene2-hidden { opacity: 0; pointer-events: none; }
        .scene2-visible { opacity: 1; pointer-events: auto; }
        
        /* 颜色 */
        .scene2-stroke-main { stroke: #000000; stroke-width: 2; fill: none; }
        .scene2-stroke-blue { stroke: #1565c0; stroke-width: 2; fill: none; }
        .scene2-stroke-red { stroke: #c62828; stroke-width: 2; fill: none; }
        .scene2-stroke-gray { stroke: #888888; stroke-width: 2; fill: none; }
        .scene2-stroke-green { stroke: #2e7d32; stroke-width: 2; fill: none; }
        
        .scene2-fill-main { fill: #000000; }
        .scene2-fill-blue { fill: #1565c0; }
        .scene2-fill-red { fill: #c62828; }
        .scene2-fill-gray { fill: #888888; }
        .scene2-fill-green { fill: #2e7d32; }
        .scene2-fill-white { fill: #ffffff; }
        
        .scene2-text { font-size: 16px; font-family: sans-serif; }
        .scene2-text-blue { fill: #1565c0; }
        .scene2-text-red { fill: #c62828; }
        .scene2-text-green { fill: #2e7d32; }
        .scene2-text-gray { fill: #888888; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500">
            <defs>
                <marker id="scene2-arrow-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" class="scene2-fill-main" />
                </marker>
                <marker id="scene2-arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" class="scene2-fill-gray" />
                </marker>
            </defs>

            <!-- 电路图组 -->
            <g id="scene2-circuit-group" class="scene2-transition" transform="translate(0, 0)">
                <!-- 导线 -->
                <line x1="300" y1="150" x2="500" y2="150" class="scene2-stroke-main" />
                <line x1="300" y1="290" x2="500" y2="290" class="scene2-stroke-main" />
                <line x1="300" y1="150" x2="300" y2="290" class="scene2-stroke-main" />
                <line x1="500" y1="150" x2="500" y2="290" class="scene2-stroke-main" />
                
                <!-- 交流电源 -->
                <circle cx="300" cy="240" r="20" class="scene2-stroke-main scene2-fill-white" />
                <path d="M 285 240 Q 292.5 230 300 240 T 315 240" class="scene2-stroke-main" />
                
                <!-- 电源标签 -->
                <foreignObject x="180" y="225" width="110" height="30">
                    <div id="scene2-power-label" xmlns="http://www.w3.org/1999/xhtml" style="font-size: 14px;">
                        $e = E_m \cos	heta$
                    </div>
                </foreignObject>
                
                <!-- 内阻 r -->
                <rect x="290" y="170" width="20" height="30" class="scene2-stroke-main scene2-fill-white" />
                <foreignObject x="210" y="175" width="80" height="30">
                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 14px;">
                        $r=rac{1}{3}R$
                    </div>
                </foreignObject>
                
                <!-- 外阻 R -->
                <rect id="scene2-resistor-R" x="490" y="200" width="20" height="40" class="scene2-stroke-main scene2-fill-white scene2-transition" />
                <foreignObject x="490" y="245" width="40" height="30">
                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 14px;">
                        $R$
                    </div>
                </foreignObject>
                
                <!-- 节点 c, d -->
                <circle cx="300" cy="150" r="3" class="scene2-fill-main" />
                <text x="280" y="145" class="scene2-text">c</text>
                <circle cx="300" cy="290" r="3" class="scene2-fill-main" />
                <text x="280" y="305" class="scene2-text">d</text>
                
                <!-- U_cd 标注 (步骤1出现) -->
                <g id="scene2-ucd-group" class="scene2-fade scene2-hidden">
                    <polyline points="535,190 550,190 550,250 535,250" class="scene2-stroke-blue" />
                    <foreignObject x="560" y="225" width="40" height="30">
                        <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 14px; color: #1565c0;">
                            $U_{cd}$
                        </div>
                    </foreignObject>
                </g>
                
                <!-- 步骤1公式 -->
                <foreignObject id="scene2-step1-formula" x="250" y="330" width="300" height="40" class="scene2-fade scene2-hidden">
                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 14px;">
                        $U_{cd} = rac{R}{R+r} E_m = rac{3}{4} BLv_0$
                    </div>
                </foreignObject>
            </g>

            <!-- 坐标系与曲线 (步骤2) -->
            <g id="scene2-graph-group" class="scene2-fade scene2-hidden">
                <!-- 坐标轴 -->
                <line x1="450" y1="300" x2="750" y2="300" class="scene2-stroke-main" marker-end="url(#scene2-arrow-main)" />
                <line x1="450" y1="300" x2="450" y2="100" class="scene2-stroke-main" marker-end="url(#scene2-arrow-main)" />
                <text x="740" y="325" class="scene2-text">t</text>
                <text x="430" y="95" class="scene2-text">e</text>
                
                <!-- 余弦曲线 -->
                <polyline id="scene2-cosine-curve" points="" class="scene2-stroke-red" />
                
                <!-- 标签 -->
                <foreignObject x="400" y="130" width="40" height="30">
                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 14px;">
                        $E_m$
                    </div>
                </foreignObject>
                
                <!-- E_rms 虚线 -->
                <line x1="450" y1="194" x2="600" y2="194" class="scene2-stroke-blue" stroke-dasharray="5,5" />
                <foreignObject x="390" y="175" width="50" height="30">
                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 14px; color: #1565c0;">
                        $E_{rms}$
                    </div>
                </foreignObject>
                
                <foreignObject x="635" y="305" width="40" height="30">
                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 14px;">
                        $rac{T}{4}$
                    </div>
                </foreignObject>
                
                <!-- 步骤2公式 -->
                <foreignObject x="450" y="360" width="300" height="60">
                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 14px;">
                        $Q_{总} = rac{E_{rms}^2}{R+r} \cdot rac{T}{4}$<br/>
                        $Q_R = rac{3}{4} Q_{总}$
                    </div>
                </foreignObject>
            </g>

            <!-- 能量流向图 (步骤3) -->
            <g id="scene2-energy-group" class="scene2-fade scene2-hidden">
                <!-- W_F 节点 -->
                <rect x="340" y="80" width="120" height="50" class="scene2-stroke-gray scene2-fill-white" />
                <foreignObject x="340" y="95" width="120" height="30">
                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 14px; text-align: center; color: #888888;">
                        $W_F$ (拉力做功)
                    </div>
                </foreignObject>
                
                <!-- 分支箭头1 -->
                <polyline points="400,130 400,160 250,160 250,195" class="scene2-stroke-gray" marker-end="url(#scene2-arrow-gray)" />
                
                <!-- 分支箭头2 -->
                <polyline points="400,130 400,160 550,160 550,195" class="scene2-stroke-gray" marker-end="url(#scene2-arrow-gray)" />
                
                <!-- ΔE_p 节点 -->
                <rect x="160" y="200" width="180" height="50" class="scene2-stroke-green scene2-fill-white" />
                <foreignObject x="160" y="215" width="180" height="30">
                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 14px; text-align: center; color: #2e7d32;">
                        $\Delta E_p$ (重力势能增加)
                    </div>
                </foreignObject>
                
                <!-- Q_总 节点 -->
                <rect x="470" y="200" width="160" height="50" class="scene2-stroke-red scene2-fill-white" />
                <foreignObject x="470" y="215" width="160" height="30">
                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 14px; text-align: center; color: #c62828;">
                        $Q_{总}$ (总焦耳热)
                    </div>
                </foreignObject>
                
                <!-- 分支箭头3 -->
                <line x1="550" y1="250" x2="550" y2="315" class="scene2-stroke-gray" marker-end="url(#scene2-arrow-gray)" />
                
                <!-- Q_R 节点 -->
                <rect x="490" y="320" width="120" height="50" class="scene2-stroke-red scene2-fill-white" />
                <foreignObject x="490" y="335" width="120" height="30">
                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 14px; text-align: center; color: #c62828;">
                        $Q_R$ (R上热量)
                    </div>
                </foreignObject>
            </g>
        </svg>

        <div id="scene2-controls">
            <button id="scene2-btn-prev" disabled>◀ 上一步</button>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 3;
        
        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        
        const circuitGroup = document.getElementById('scene2-circuit-group');
        const powerLabel = document.getElementById('scene2-power-label');
        const resistorR = document.getElementById('scene2-resistor-R');
        const ucdGroup = document.getElementById('scene2-ucd-group');
        const step1Formula = document.getElementById('scene2-step1-formula');
        
        const graphGroup = document.getElementById('scene2-graph-group');
        const cosineCurve = document.getElementById('scene2-cosine-curve');
        
        const energyGroup = document.getElementById('scene2-energy-group');
        
        // 生成余弦曲线点集
        function generateCosinePoints() {
            let points = "";
            const startX = 450;
            const startY = 300;
            const amplitude = 150; // 300 - 150
            const periodWidth = 200; // 650 - 450 (T/4)
            
            for (let x = 0; x <= periodWidth; x += 2) {
                const theta = (x / periodWidth) * (Math.PI / 2);
                const y = startY - amplitude * Math.cos(theta);
                points += `${startX + x},${y} `;
            }
            cosineCurve.setAttribute('points', points.trim());
        }
        generateCosinePoints();
        
        function updateScene() {
            // 按钮状态
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
            
            // 步骤 0: 初始状态
            if (currentStep === 0) {
                circuitGroup.setAttribute('transform', 'translate(0, 0)');
                circuitGroup.classList.remove('scene2-hidden');
                circuitGroup.classList.add('scene2-visible');
                
                powerLabel.innerHTML = '$e = E_m \cos\theta$';
                if (window.MathJax) MathJax.typesetPromise([powerLabel]);
                
                resistorR.classList.remove('scene2-stroke-blue');
                resistorR.classList.add('scene2-stroke-main');
                
                ucdGroup.classList.remove('scene2-visible');
                ucdGroup.classList.add('scene2-hidden');
                
                step1Formula.classList.remove('scene2-visible');
                step1Formula.classList.add('scene2-hidden');
                
                graphGroup.classList.remove('scene2-visible');
                graphGroup.classList.add('scene2-hidden');
                
                energyGroup.classList.remove('scene2-visible');
                energyGroup.classList.add('scene2-hidden');
            }
            
            // 步骤 1: 求初始电压
            if (currentStep === 1) {
                circuitGroup.setAttribute('transform', 'translate(0, 0)');
                circuitGroup.classList.remove('scene2-hidden');
                circuitGroup.classList.add('scene2-visible');
                
                powerLabel.innerHTML = '$E_m = BLv_0$';
                if (window.MathJax) MathJax.typesetPromise([powerLabel]);
                
                resistorR.classList.remove('scene2-stroke-main');
                resistorR.classList.add('scene2-stroke-blue');
                
                ucdGroup.classList.remove('scene2-hidden');
                ucdGroup.classList.add('scene2-visible');
                
                step1Formula.classList.remove('scene2-hidden');
                step1Formula.classList.add('scene2-visible');
                
                graphGroup.classList.remove('scene2-visible');
                graphGroup.classList.add('scene2-hidden');
                
                energyGroup.classList.remove('scene2-visible');
                energyGroup.classList.add('scene2-hidden');
            }
            
            // 步骤 2: 求热量
            if (currentStep === 2) {
                circuitGroup.setAttribute('transform', 'translate(-150, 0)');
                circuitGroup.classList.remove('scene2-hidden');
                circuitGroup.classList.add('scene2-visible');
                
                graphGroup.classList.remove('scene2-hidden');
                graphGroup.classList.add('scene2-visible');
                
                energyGroup.classList.remove('scene2-visible');
                energyGroup.classList.add('scene2-hidden');
            }
            
            // 步骤 3: 求拉力功
            if (currentStep === 3) {
                circuitGroup.classList.remove('scene2-visible');
                circuitGroup.classList.add('scene2-hidden');
                
                graphGroup.classList.remove('scene2-visible');
                graphGroup.classList.add('scene2-hidden');
                
                energyGroup.classList.remove('scene2-hidden');
                energyGroup.classList.add('scene2-visible');
            }
        }
        
        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });
        
        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });
        
        // 初始化
        updateScene();
    })();
    </script>
</body>
</html>
