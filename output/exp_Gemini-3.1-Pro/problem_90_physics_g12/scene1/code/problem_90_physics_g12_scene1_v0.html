<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .step-group { opacity: 0; display: none; transition: opacity 0.3s; }
        .step-group.active { opacity: 1; display: block; }
        .math-text { font-size: 16px; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <defs>
                <marker id="arrow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0" />
                </marker>
                <marker id="arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32" />
                </marker>
            </defs>

            <!-- Step 0: 图甲 -->
            <g id="scene1-step0" class="step-group active">
                <!-- 玻璃管(甲) -->
                <polyline points="380,60 380,370 420,370 420,60" fill="none" stroke="#000" stroke-width="2" />
                <!-- 水银柱(甲) -->
                <rect x="380" y="170" width="40" height="25" fill="#424242" />
                <!-- 空气柱l1(甲) -->
                <rect x="380" y="195" width="40" height="175" fill="#1565c0" opacity="0.2" />
                
                <!-- 标注线 L -->
                <line x1="530" y1="60" x2="530" y2="370" stroke="#000" stroke-width="1" />
                <line x1="525" y1="60" x2="535" y2="60" stroke="#000" stroke-width="1" />
                <line x1="525" y1="370" x2="535" y2="370" stroke="#000" stroke-width="1" />
                <line x1="420" y1="60" x2="530" y2="60" stroke="#888" stroke-dasharray="4 4" />
                <line x1="420" y1="370" x2="530" y2="370" stroke="#888" stroke-dasharray="4 4" />
                <text x="580" y="220" font-size="16">$L=62	ext{cm}$</text>

                <!-- 标注线 l1(甲) -->
                <line x1="440" y1="195" x2="440" y2="370" stroke="#000" stroke-width="1" />
                <line x1="435" y1="195" x2="445" y2="195" stroke="#000" stroke-width="1" />
                <line x1="435" y1="370" x2="445" y2="370" stroke="#000" stroke-width="1" />
                <line x1="420" y1="195" x2="440" y2="195" stroke="#888" stroke-dasharray="4 4" />
                <text x="450" y="287" font-size="16">$l_1=35	ext{cm}$</text>

                <!-- 标注线 h(甲) -->
                <line x1="440" y1="170" x2="440" y2="195" stroke="#000" stroke-width="1" />
                <line x1="435" y1="170" x2="445" y2="170" stroke="#000" stroke-width="1" />
                <line x1="420" y1="170" x2="440" y2="170" stroke="#888" stroke-dasharray="4 4" />
                <text x="450" y="180" font-size="16">$h=5	ext{cm}$</text>

                <!-- 箭头 P0(甲) -->
                <line x1="320" y1="130" x2="320" y2="165" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-blue)" />
                <text x="290" y="155" fill="#1565c0" font-size="16">$P_0$</text>
                
                <!-- 箭头 Ph(甲) -->
                <line x1="350" y1="130" x2="350" y2="165" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow-green)" />
                <text x="230" y="155" fill="#2e7d32" font-size="16">$P_h$</text>

                <!-- 箭头 P1(甲) -->
                <line x1="335" y1="230" x2="335" y2="200" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-blue)" />
                <text x="305" y="220" fill="#1565c0" font-size="16">$P_1$</text>

                <!-- 公式 -->
                <foreignObject x="50" y="150" width="200" height="50">
                    <div xmlns="http://www.w3.org/1999/xhtml" class="math-text">
                        $P_1 = P_0 + P_h$
                    </div>
                </foreignObject>
            </g>

            <!-- Step 1: 图乙 -->
            <g id="scene1-step1" class="step-group">
                <!-- 玻璃管(乙) -->
                <polyline points="380,370 380,60 420,60 420,370" fill="none" stroke="#000" stroke-width="2" />
                <!-- 水银柱(乙) -->
                <rect x="380" y="260" width="40" height="25" fill="#424242" />
                <!-- 上空气柱l2(乙) -->
                <rect x="380" y="60" width="40" height="200" fill="#1565c0" opacity="0.2" />
                
                <!-- 标注线 L -->
                <line x1="530" y1="60" x2="530" y2="370" stroke="#000" stroke-width="1" />
                <line x1="525" y1="60" x2="535" y2="60" stroke="#000" stroke-width="1" />
                <line x1="525" y1="370" x2="535" y2="370" stroke="#000" stroke-width="1" />
                <line x1="420" y1="60" x2="530" y2="60" stroke="#888" stroke-dasharray="4 4" />
                <line x1="420" y1="370" x2="530" y2="370" stroke="#888" stroke-dasharray="4 4" />
                <text x="580" y="220" font-size="16">$L=62	ext{cm}$</text>

                <!-- 标注线 l2(乙) -->
                <line x1="440" y1="60" x2="440" y2="260" stroke="#000" stroke-width="1" />
                <line x1="435" y1="60" x2="445" y2="60" stroke="#000" stroke-width="1" />
                <line x1="435" y1="260" x2="445" y2="260" stroke="#000" stroke-width="1" />
                <line x1="420" y1="260" x2="440" y2="260" stroke="#888" stroke-dasharray="4 4" />
                <text x="450" y="165" font-size="16">$l_2=40	ext{cm}$</text>

                <!-- 标注线 h(乙) -->
                <line x1="440" y1="260" x2="440" y2="285" stroke="#000" stroke-width="1" />
                <line x1="435" y1="285" x2="445" y2="285" stroke="#000" stroke-width="1" />
                <line x1="420" y1="285" x2="440" y2="285" stroke="#888" stroke-dasharray="4 4" />
                <text x="450" y="277" font-size="16">$h=5	ext{cm}$</text>

                <!-- 箭头 P2(乙) -->
                <line x1="320" y1="220" x2="320" y2="255" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-blue)" />
                <text x="290" y="245" fill="#1565c0" font-size="16">$P_2$</text>
                
                <!-- 箭头 Ph(乙) -->
                <line x1="350" y1="220" x2="350" y2="255" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow-green)" />
                <text x="230" y="245" fill="#2e7d32" font-size="16">$P_h$</text>

                <!-- 箭头 P0(乙) -->
                <line x1="335" y1="325" x2="335" y2="290" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-blue)" />
                <text x="305" y="315" fill="#1565c0" font-size="16">$P_0$</text>

                <!-- 公式 -->
                <foreignObject x="50" y="150" width="200" height="50">
                    <div xmlns="http://www.w3.org/1999/xhtml" class="math-text">
                        $P_2 = P_0 - P_h$
                    </div>
                </foreignObject>
            </g>

            <!-- Step 2: 图乙高亮 -->
            <g id="scene1-step2" class="step-group">
                <!-- 玻璃管(乙) -->
                <polyline points="380,370 380,60 420,60 420,370" fill="none" stroke="#000" stroke-width="2" />
                <!-- 水银柱(乙) -->
                <rect x="380" y="260" width="40" height="25" fill="#424242" />
                <!-- 上空气柱l2(乙) -->
                <rect x="380" y="60" width="40" height="200" fill="#1565c0" opacity="0.2" />
                <!-- 下空气柱(乙) 高亮 -->
                <rect x="380" y="285" width="40" height="85" fill="#1565c0" opacity="0.4" />
                
                <!-- 标注线 L -->
                <line x1="530" y1="60" x2="530" y2="370" stroke="#000" stroke-width="1" />
                <line x1="525" y1="60" x2="535" y2="60" stroke="#000" stroke-width="1" />
                <line x1="525" y1="370" x2="535" y2="370" stroke="#000" stroke-width="1" />
                <line x1="420" y1="60" x2="530" y2="60" stroke="#888" stroke-dasharray="4 4" />
                <line x1="420" y1="370" x2="530" y2="370" stroke="#888" stroke-dasharray="4 4" />
                <text x="580" y="220" font-size="16">$L=62	ext{cm}$</text>

                <!-- 标注线 l2(乙) -->
                <line x1="440" y1="60" x2="440" y2="260" stroke="#000" stroke-width="1" />
                <line x1="435" y1="60" x2="445" y2="60" stroke="#000" stroke-width="1" />
                <line x1="435" y1="260" x2="445" y2="260" stroke="#000" stroke-width="1" />
                <line x1="420" y1="260" x2="440" y2="260" stroke="#888" stroke-dasharray="4 4" />
                <text x="450" y="165" font-size="16">$l_2=40	ext{cm}$</text>

                <!-- 标注线 h(乙) -->
                <line x1="440" y1="260" x2="440" y2="285" stroke="#000" stroke-width="1" />
                <line x1="435" y1="285" x2="445" y2="285" stroke="#000" stroke-width="1" />
                <line x1="420" y1="285" x2="440" y2="285" stroke="#888" stroke-dasharray="4 4" />
                <text x="450" y="277" font-size="16">$h=5	ext{cm}$</text>

                <!-- 标注线 l_下2(乙) -->
                <line x1="440" y1="285" x2="440" y2="370" stroke="#000" stroke-width="1" />
                <line x1="435" y1="370" x2="445" y2="370" stroke="#000" stroke-width="1" />
                <text x="450" y="332" font-size="16">$l_{下2}$</text>

                <!-- 箭头 P2(乙) -->
                <line x1="320" y1="220" x2="320" y2="255" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-blue)" />
                <text x="290" y="245" fill="#1565c0" font-size="16">$P_2$</text>
                
                <!-- 箭头 Ph(乙) -->
                <line x1="350" y1="220" x2="350" y2="255" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow-green)" />
                <text x="230" y="245" fill="#2e7d32" font-size="16">$P_h$</text>

                <!-- 箭头 P0(乙) -->
                <line x1="335" y1="325" x2="335" y2="290" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-blue)" />
                <text x="305" y="315" fill="#1565c0" font-size="16">$P_0$</text>

                <!-- 公式 -->
                <foreignObject x="50" y="150" width="200" height="50">
                    <div xmlns="http://www.w3.org/1999/xhtml" class="math-text">
                        $P_2 = P_0 - P_h$
                    </div>
                </foreignObject>
                <foreignObject x="600" y="320" width="180" height="50">
                    <div xmlns="http://www.w3.org/1999/xhtml" class="math-text">
                        $l_{下2} = L - l_2 - h = 17	ext{cm}$
                    </div>
                </foreignObject>
            </g>

            <!-- Step 3: 图丙 -->
            <g id="scene1-step3" class="step-group">
                <!-- 玻璃管(丙) -->
                <polyline points="380,370 380,60 420,60 420,370" fill="none" stroke="#000" stroke-width="2" />
                <!-- 水银柱(丙) -->
                <rect x="380" y="235" width="40" height="25" fill="#424242" />
                <!-- 上空气柱l1(丙) -->
                <rect x="380" y="60" width="40" height="175" fill="#1565c0" opacity="0.2" />
                <!-- 下空气柱(丙) 高亮 -->
                <rect x="380" y="260" width="40" height="75" fill="#1565c0" opacity="0.4" />
                <!-- 活塞(丙) -->
                <rect x="382" y="335" width="36" height="4" fill="#c62828" />
                
                <!-- 标注线 L -->
                <line x1="530" y1="60" x2="530" y2="370" stroke="#000" stroke-width="1" />
                <line x1="525" y1="60" x2="535" y2="60" stroke="#000" stroke-width="1" />
                <line x1="525" y1="370" x2="535" y2="370" stroke="#000" stroke-width="1" />
                <line x1="420" y1="60" x2="530" y2="60" stroke="#888" stroke-dasharray="4 4" />
                <line x1="420" y1="370" x2="530" y2="370" stroke="#888" stroke-dasharray="4 4" />
                <text x="580" y="220" font-size="16">$L=62	ext{cm}$</text>

                <!-- 标注线 l1(丙) -->
                <line x1="440" y1="60" x2="440" y2="235" stroke="#000" stroke-width="1" />
                <line x1="435" y1="60" x2="445" y2="60" stroke="#000" stroke-width="1" />
                <line x1="435" y1="235" x2="445" y2="235" stroke="#000" stroke-width="1" />
                <line x1="420" y1="235" x2="440" y2="235" stroke="#888" stroke-dasharray="4 4" />
                <text x="450" y="152" font-size="16">$l_1=35	ext{cm}$</text>

                <!-- 标注线 h(丙) -->
                <line x1="440" y1="235" x2="440" y2="260" stroke="#000" stroke-width="1" />
                <line x1="435" y1="260" x2="445" y2="260" stroke="#000" stroke-width="1" />
                <line x1="420" y1="260" x2="440" y2="260" stroke="#888" stroke-dasharray="4 4" />
                <text x="450" y="245" font-size="16">$h=5	ext{cm}$</text>

                <!-- 箭头 P1(丙) -->
                <line x1="320" y1="195" x2="320" y2="230" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-blue)" />
                <text x="290" y="220" fill="#1565c0" font-size="16">$P_1$</text>
                
                <!-- 箭头 Ph(丙) -->
                <line x1="350" y1="195" x2="350" y2="230" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow-green)" />
                <text x="230" y="220" fill="#2e7d32" font-size="16">$P_h$</text>

                <!-- 箭头 P_下3(丙) -->
                <line x1="335" y1="300" x2="335" y2="265" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-blue)" />
                <text x="295" y="290" fill="#1565c0" font-size="16">$P_{下3}$</text>

                <!-- 公式 -->
                <foreignObject x="50" y="150" width="200" height="50">
                    <div xmlns="http://www.w3.org/1999/xhtml" class="math-text">
                        $P_{下3} = P_1 + P_h$
                    </div>
                </foreignObject>
            </g>

            <!-- Step 4: 图丙完整标注 -->
            <g id="scene1-step4" class="step-group">
                <!-- 玻璃管(丙) -->
                <polyline points="380,370 380,60 420,60 420,370" fill="none" stroke="#000" stroke-width="2" />
                <!-- 水银柱(丙) -->
                <rect x="380" y="235" width="40" height="25" fill="#424242" />
                <!-- 上空气柱l1(丙) -->
                <rect x="380" y="60" width="40" height="175" fill="#1565c0" opacity="0.2" />
                <!-- 下空气柱(丙) 高亮 -->
                <rect x="380" y="260" width="40" height="75" fill="#1565c0" opacity="0.4" />
                <!-- 活塞(丙) -->
                <rect x="382" y="335" width="36" height="4" fill="#c62828" />
                
                <!-- 标注线 L -->
                <line x1="530" y1="60" x2="530" y2="370" stroke="#000" stroke-width="1" />
                <line x1="525" y1="60" x2="535" y2="60" stroke="#000" stroke-width="1" />
                <line x1="525" y1="370" x2="535" y2="370" stroke="#000" stroke-width="1" />
                <line x1="420" y1="60" x2="530" y2="60" stroke="#888" stroke-dasharray="4 4" />
                <line x1="420" y1="370" x2="530" y2="370" stroke="#888" stroke-dasharray="4 4" />
                <text x="580" y="220" font-size="16">$L=62	ext{cm}$</text>

                <!-- 标注线 l1(丙) -->
                <line x1="440" y1="60" x2="440" y2="235" stroke="#000" stroke-width="1" />
                <line x1="435" y1="60" x2="445" y2="60" stroke="#000" stroke-width="1" />
                <line x1="435" y1="235" x2="445" y2="235" stroke="#000" stroke-width="1" />
                <line x1="420" y1="235" x2="440" y2="235" stroke="#888" stroke-dasharray="4 4" />
                <text x="450" y="152" font-size="16">$l_1=35	ext{cm}$</text>

                <!-- 标注线 h(丙) -->
                <line x1="440" y1="235" x2="440" y2="260" stroke="#000" stroke-width="1" />
                <line x1="435" y1="260" x2="445" y2="260" stroke="#000" stroke-width="1" />
                <line x1="420" y1="260" x2="440" y2="260" stroke="#888" stroke-dasharray="4 4" />
                <text x="450" y="245" font-size="16">$h=5	ext{cm}$</text>

                <!-- 标注线 l_下3(丙) -->
                <line x1="440" y1="260" x2="440" y2="335" stroke="#000" stroke-width="1" />
                <line x1="435" y1="335" x2="445" y2="335" stroke="#000" stroke-width="1" />
                <line x1="420" y1="335" x2="440" y2="335" stroke="#888" stroke-dasharray="4 4" />
                <text x="450" y="302" font-size="16">$l_{下3}$</text>

                <!-- 标注线 d(丙) -->
                <line x1="440" y1="335" x2="440" y2="370" stroke="#000" stroke-width="1" />
                <line x1="435" y1="370" x2="445" y2="370" stroke="#000" stroke-width="1" />
                <text x="450" y="357" font-size="16">$d$</text>

                <!-- 箭头 P1(丙) -->
                <line x1="320" y1="195" x2="320" y2="230" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-blue)" />
                <text x="290" y="220" fill="#1565c0" font-size="16">$P_1$</text>
                
                <!-- 箭头 Ph(丙) -->
                <line x1="350" y1="195" x2="350" y2="230" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow-green)" />
                <text x="230" y="220" fill="#2e7d32" font-size="16">$P_h$</text>

                <!-- 箭头 P_下3(丙) -->
                <line x1="335" y1="300" x2="335" y2="265" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-blue)" />
                <text x="295" y="290" fill="#1565c0" font-size="16">$P_{下3}$</text>

                <!-- 公式 -->
                <foreignObject x="50" y="150" width="200" height="50">
                    <div xmlns="http://www.w3.org/1999/xhtml" class="math-text">
                        $P_{下3} = P_1 + P_h$
                    </div>
                </foreignObject>
                <foreignObject x="600" y="300" width="180" height="80">
                    <div xmlns="http://www.w3.org/1999/xhtml" class="math-text">
                        $L = l_1 + h + l_{下3} + d$<br/>
                        $d = 7	ext{cm}$
                    </div>
                </foreignObject>
            </g>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 4;
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');

        function updateStep() {
            for (let i = 0; i <= maxStep; i++) {
                const group = document.getElementById(`scene1-step${i}`);
                if (i === currentStep) {
                    group.classList.add('active');
                } else {
                    group.classList.remove('active');
                }
            }
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateStep();
            }
        });
    })();
    </script>
</body>
</html>
