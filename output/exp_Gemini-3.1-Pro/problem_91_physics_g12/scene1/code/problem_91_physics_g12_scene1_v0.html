<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisualSolver Scene</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        button { padding: 6px 12px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 14px; color: #333; min-width: 80px; text-align: center; }
        
        /* SVG Styles */
        .scene1-text { font-family: 'Times New Roman', Times, serif; font-size: 16px; fill: #000; }
        .scene1-text-math { font-style: italic; }
        .scene1-ball-pos { stroke: #c62828; stroke-width: 2; fill: rgba(198, 40, 40, 0.3); transition: all 0.3s; }
        .scene1-ball-neg { stroke: #1565c0; stroke-width: 2; fill: rgba(21, 101, 192, 0.3); transition: all 0.3s; }
        .scene1-line-dashed { stroke: #888888; stroke-width: 1.5; stroke-dasharray: 5,5; }
        .scene1-force { stroke: #000000; stroke-width: 2; fill: none; }
        .scene1-force-dashed { stroke: #888888; stroke-width: 2; stroke-dasharray: 4,4; fill: none; }
        .scene1-accel { stroke: #2e7d32; stroke-width: 3; fill: none; }
        .scene1-box { stroke: #888888; stroke-width: 3; stroke-dasharray: 8,8; fill: none; }
        
        /* Transitions */
        .scene1-element { transition: opacity 0.3s ease; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <defs>
                <!-- Black Arrowhead -->
                <marker id="scene1-arrow-black" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
                </marker>
                <!-- Gray Dashed Arrowhead -->
                <marker id="scene1-arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#888888" />
                </marker>
                <!-- Green Thick Arrowhead -->
                <marker id="scene1-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32" />
                </marker>
            </defs>

            <!-- 整体框 (Step 3) -->
            <g id="scene1-group-box" class="scene1-element" style="opacity: 0; display: none;">
                <!-- Top -->
                <line x1="270" y1="90" x2="540" y2="90" class="scene1-box" />
                <!-- Bottom -->
                <line x1="270" y1="410" x2="540" y2="410" class="scene1-box" />
                <!-- Left -->
                <line x1="250" y1="110" x2="250" y2="390" class="scene1-box" />
                <!-- Right -->
                <line x1="560" y1="110" x2="560" y2="390" class="scene1-box" />
                <!-- Corners -->
                <path d="M 270 90 Q 250 90 250 110" class="scene1-box" />
                <path d="M 540 90 Q 560 90 560 110" class="scene1-box" />
                <path d="M 270 410 Q 250 410 250 390" class="scene1-box" />
                <path d="M 540 410 Q 560 410 560 390" class="scene1-box" />
                
                <text x="405" y="440" class="scene1-text scene1-text-math" text-anchor="middle">F = 3ma</text>
            </g>

            <!-- 辅助线 (All Steps) -->
            <g id="scene1-group-lines">
                <line x1="327" y1="165" x2="327" y2="335" class="scene1-line-dashed" />
                <line x1="340" y1="158" x2="487" y2="242" class="scene1-line-dashed" />
                <line x1="340" y1="342" x2="487" y2="258" class="scene1-line-dashed" />
                
                <text x="295" y="255" class="scene1-text scene1-text-math" text-anchor="end">r</text>
                <text x="430" y="150" class="scene1-text scene1-text-math">r</text>
                <text x="420" y="355" class="scene1-text scene1-text-math">r</text>
            </g>

            <!-- 加速度 (All Steps) -->
            <g id="scene1-group-accel">
                <line x1="380" y1="60" x2="480" y2="60" class="scene1-accel" marker-end="url(#scene1-arrow-green)" />
                <text x="430" y="50" class="scene1-text scene1-text-math" fill="#2e7d32" text-anchor="middle">a</text>
            </g>

            <!-- 外力 F (All Steps) -->
            <g id="scene1-group-f">
                <line x1="515" y1="250" x2="615" y2="250" class="scene1-force" marker-end="url(#scene1-arrow-black)" />
                <text x="625" y="255" class="scene1-text scene1-text-math">F</text>
            </g>

            <!-- 受力分析 (Step 1 & 2) -->
            <g id="scene1-group-forces" class="scene1-element" style="opacity: 0; display: none;">
                <!-- F_BA -->
                <line x1="327" y1="135" x2="327" y2="55" class="scene1-force" marker-end="url(#scene1-arrow-black)" />
                <text x="345" y="95" class="scene1-text scene1-text-math">F<tspan dy="5" font-size="12">BA</tspan></text>
                
                <!-- F_CA -->
                <line x1="340" y1="158" x2="465" y2="230" class="scene1-force" marker-end="url(#scene1-arrow-black)" />
                <text x="380" y="245" class="scene1-text scene1-text-math">F<tspan dy="5" font-size="12">CA</tspan></text>
            </g>

            <!-- 正交分解 (Step 2) -->
            <g id="scene1-group-components" class="scene1-element" style="opacity: 0; display: none;">
                <!-- F_CAx -->
                <line x1="342" y1="150" x2="465" y2="150" class="scene1-force-dashed" marker-end="url(#scene1-arrow-gray)" />
                <text x="390" y="140" class="scene1-text scene1-text-math" fill="#888888" text-anchor="middle">F<tspan dy="5" font-size="12">CAx</tspan></text>
                
                <!-- F_CAy -->
                <line x1="327" y1="165" x2="327" y2="230" class="scene1-force-dashed" marker-end="url(#scene1-arrow-gray)" />
                <text x="305" y="200" class="scene1-text scene1-text-math" fill="#888888" text-anchor="end">F<tspan dy="5" font-size="12">CAy</tspan></text>
            </g>

            <!-- 小球 (All Steps) -->
            <g id="scene1-group-balls">
                <!-- Ball A -->
                <circle id="scene1-ball-a" cx="327" cy="150" r="15" class="scene1-ball-pos" />
                <text x="305" y="125" class="scene1-text" text-anchor="end">A</text>
                <text x="280" y="155" class="scene1-text scene1-text-math" text-anchor="end">+q</text>
                
                <!-- Ball B -->
                <circle id="scene1-ball-b" cx="327" cy="350" r="15" class="scene1-ball-pos" />
                <text x="305" y="380" class="scene1-text" text-anchor="end">B</text>
                <text x="280" y="355" class="scene1-text scene1-text-math" text-anchor="end">+q</text>
                
                <!-- Ball C -->
                <circle id="scene1-ball-c" cx="500" cy="250" r="15" class="scene1-ball-neg" />
                <text x="525" y="275" class="scene1-text">C</text>
                <text id="scene1-label-q" x="525" y="225" class="scene1-text scene1-text-math scene1-element" style="opacity: 0; display: none;">-Q</text>
            </g>

        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <div id="scene1-step-indicator">步骤 0 / 3</div>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 3;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');

        // Elements
        const ballA = document.getElementById('scene1-ball-a');
        const ballB = document.getElementById('scene1-ball-b');
        const ballC = document.getElementById('scene1-ball-c');
        const labelQ = document.getElementById('scene1-label-q');
        const groupForces = document.getElementById('scene1-group-forces');
        const groupComponents = document.getElementById('scene1-group-components');
        const groupBox = document.getElementById('scene1-group-box');

        function show(el) {
            el.style.display = '';
            // Force reflow
            void el.offsetWidth;
            el.style.opacity = '1';
        }

        function hide(el) {
            el.style.opacity = '0';
            setTimeout(() => {
                if (el.style.opacity === '0') {
                    el.style.display = 'none';
                }
            }, 300);
        }

        function updateScene() {
            // Update buttons
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
            stepIndicator.textContent = `步骤 ${currentStep} / ${maxStep}`;

            // Step 0: Initial
            if (currentStep === 0) {
                ballA.style.strokeWidth = '2';
                ballB.style.opacity = '1';
                ballC.style.opacity = '1';
                
                hide(labelQ);
                hide(groupForces);
                hide(groupComponents);
                hide(groupBox);
            }
            // Step 1: Isolate A, qualitative
            else if (currentStep === 1) {
                ballA.style.strokeWidth = '4';
                ballB.style.opacity = '0.3';
                ballC.style.opacity = '0.3';
                
                show(labelQ);
                show(groupForces);
                hide(groupComponents);
                hide(groupBox);
            }
            // Step 2: Isolate A, quantitative (components)
            else if (currentStep === 2) {
                ballA.style.strokeWidth = '4';
                ballB.style.opacity = '0.3';
                ballC.style.opacity = '0.3';
                
                show(labelQ);
                show(groupForces);
                show(groupComponents);
                hide(groupBox);
            }
            // Step 3: Whole system
            else if (currentStep === 3) {
                ballA.style.strokeWidth = '2';
                ballB.style.opacity = '1';
                ballC.style.opacity = '1';
                
                show(labelQ);
                hide(groupForces);
                hide(groupComponents);
                show(groupBox);
            }
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });

        // Initialize
        updateScene();
    })();
    </script>
</body>
</html>
