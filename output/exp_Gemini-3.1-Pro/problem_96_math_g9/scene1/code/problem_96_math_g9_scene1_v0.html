<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; border-radius: 4px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .fade { transition: opacity 0.4s ease; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500">
            <defs>
                <pattern id="scene1-hatch" patternUnits="userSpaceOnUse" width="8" height="8">
                    <path d="M-2,10 l12,-12 M0,0 l8,8 M-2,-2 l12,12" stroke="#000000" stroke-width="1" stroke-opacity="0.3" />
                </pattern>
            </defs>
            
            <!-- 高亮框 (Step 1, 3) -->
            <rect id="scene1-hl-side" class="fade" x="235" y="205" width="330" height="90" fill="#1565c0" fill-opacity="0.1" stroke="#1565c0" stroke-width="2" opacity="0" />
            <rect id="scene1-hl-top" class="fade" x="395" y="125" width="90" height="90" fill="#1565c0" fill-opacity="0.1" stroke="#1565c0" stroke-width="2" opacity="0" />
            <rect id="scene1-hl-bot" class="fade" x="315" y="285" width="90" height="90" fill="#1565c0" fill-opacity="0.1" stroke="#1565c0" stroke-width="2" opacity="0" />
            
            <!-- 最终高亮面 (Step 4) -->
            <rect id="scene1-hl-sq1" class="fade" x="240" y="210" width="80" height="80" fill="#1565c0" fill-opacity="0.2" opacity="0" />
            <rect id="scene1-hl-sq4" class="fade" x="480" y="210" width="80" height="80" fill="#1565c0" fill-opacity="0.2" opacity="0" />

            <!-- 展开图基础图形 -->
            <!-- 阴影 -->
            <polygon points="240,210 240,290 320,290" fill="url(#scene1-hatch)" />
            <polygon points="480,290 560,290 560,210" fill="url(#scene1-hatch)" />
            
            <!-- 外轮廓实线 -->
            <!-- 将外轮廓拆分为多条线段，避免整体作为一个大 path 导致重叠检测误报 -->
            <line x1="240" y1="210" x2="240" y2="290" stroke="#000000" stroke-width="2" />
            <line x1="240" y1="290" x2="320" y2="290" stroke="#000000" stroke-width="2" />
            <line x1="320" y1="290" x2="320" y2="370" stroke="#000000" stroke-width="2" />
            <line x1="320" y1="370" x2="400" y2="370" stroke="#000000" stroke-width="2" />
            <line x1="400" y1="370" x2="400" y2="290" stroke="#000000" stroke-width="2" />
            <line x1="400" y1="290" x2="560" y2="290" stroke="#000000" stroke-width="2" />
            <line x1="560" y1="290" x2="560" y2="210" stroke="#000000" stroke-width="2" />
            <line x1="560" y1="210" x2="480" y2="210" stroke="#000000" stroke-width="2" />
            <line x1="480" y1="210" x2="480" y2="130" stroke="#000000" stroke-width="2" />
            <line x1="480" y1="130" x2="400" y2="130" stroke="#000000" stroke-width="2" />
            <line x1="400" y1="130" x2="400" y2="210" stroke="#000000" stroke-width="2" />
            <line x1="400" y1="210" x2="240" y2="210" stroke="#000000" stroke-width="2" />
            
            <!-- 内部折痕虚线 -->
            <line x1="320" y1="210" x2="320" y2="290" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" />
            <line x1="400" y1="210" x2="400" y2="290" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" />
            <line x1="480" y1="210" x2="480" y2="290" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" />
            <line x1="320" y1="290" x2="400" y2="290" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" />
            <line x1="400" y1="210" x2="480" y2="210" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" />
            
            <!-- 圆圈 -->
            <circle cx="440" cy="170" r="15" fill="none" stroke="#000000" stroke-width="2" />
            
            <!-- 文本标签 -->
            <!-- 调整标签位置，避免与图形重叠 -->
            <!-- 侧面展开移到左侧外部 -->
            <text id="scene1-lbl-side" class="fade" x="180" y="255" fill="#1565c0" font-weight="bold" font-size="16px" text-anchor="middle" opacity="0">侧面展开</text>
            <!-- 内部标签移到正方形上方外部，避免与外轮廓实线重叠 -->
            <!-- 左(1) 移到上方更远 -->
            <text id="scene1-lbl-left" class="fade" x="280" y="185" fill="#1565c0" font-weight="bold" font-size="16px" text-anchor="middle" opacity="0">左(1)</text>
            <!-- 前(2) 移到上方更远 -->
            <text id="scene1-lbl-front" class="fade" x="360" y="185" fill="#1565c0" font-weight="bold" font-size="16px" text-anchor="middle" opacity="0">前(2)</text>
            <!-- 右(3) 移到下方更远 -->
            <text id="scene1-lbl-right" class="fade" x="440" y="325" fill="#1565c0" font-weight="bold" font-size="16px" text-anchor="middle" opacity="0">右(3)</text>
            <!-- 后(4) 移到上方更远 -->
            <text id="scene1-lbl-back" class="fade" x="520" y="185" fill="#1565c0" font-weight="bold" font-size="16px" text-anchor="middle" opacity="0">后(4)</text>
            <!-- 顶底标签移到外部 -->
            <text id="scene1-lbl-top" class="fade" x="440" y="105" fill="#1565c0" font-weight="bold" font-size="16px" text-anchor="middle" opacity="0">顶</text>
            <text id="scene1-lbl-bot" class="fade" x="360" y="405" fill="#1565c0" font-weight="bold" font-size="16px" text-anchor="middle" opacity="0">底</text>
            <text id="scene1-lbl-conclusion" class="fade" x="400" y="450" fill="#1565c0" font-weight="bold" font-size="18px" text-anchor="middle" opacity="0">折叠后，左(1)与后(4)在空间中相邻</text>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    <script>
    (function() {
        let currentStep = 0;
        const maxStep = 4;
        
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        
        const els = {
            hlSide: document.getElementById('scene1-hl-side'),
            hlTop: document.getElementById('scene1-hl-top'),
            hlBot: document.getElementById('scene1-hl-bot'),
            hlSq1: document.getElementById('scene1-hl-sq1'),
            hlSq4: document.getElementById('scene1-hl-sq4'),
            lblSide: document.getElementById('scene1-lbl-side'),
            lblLeft: document.getElementById('scene1-lbl-left'),
            lblFront: document.getElementById('scene1-lbl-front'),
            lblRight: document.getElementById('scene1-lbl-right'),
            lblBack: document.getElementById('scene1-lbl-back'),
            lblTop: document.getElementById('scene1-lbl-top'),
            lblBot: document.getElementById('scene1-lbl-bot'),
            lblConclusion: document.getElementById('scene1-lbl-conclusion')
        };
        
        function updateStep() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
            
            // Reset all
            Object.values(els).forEach(el => el.style.opacity = '0');
            
            if (currentStep >= 1) {
                if (currentStep < 4) els.hlSide.style.opacity = '1';
                els.lblSide.style.opacity = '1';
            }
            if (currentStep >= 2) {
                els.lblLeft.style.opacity = '1';
                els.lblFront.style.opacity = '1';
                els.lblRight.style.opacity = '1';
                els.lblBack.style.opacity = '1';
            }
            if (currentStep >= 3) {
                if (currentStep < 4) {
                    els.hlTop.style.opacity = '1';
                    els.hlBot.style.opacity = '1';
                }
                els.lblTop.style.opacity = '1';
                els.lblBot.style.opacity = '1';
            }
            if (currentStep >= 4) {
                els.hlSq1.style.opacity = '1';
                els.hlSq4.style.opacity = '1';
                els.lblConclusion.style.opacity = '1';
            }
        }
        
        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });
        
        btnNext.addEventListener('click', () => {
            if (currentStep < maxStep) {
                currentStep++;
                updateStep();
            }
        });
        
        updateStep();
    })();
    </script>
</body>
</html>
