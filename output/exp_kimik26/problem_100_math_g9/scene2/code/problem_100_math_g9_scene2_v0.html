                    <rect x="160" y="50" width="40" height="80" fill="none" stroke="#000" stroke-width="1.5"/>

                    <polygon points="240,130 280,130 280,150" fill="#a0a0a0" fill-opacity="0.4" stroke="#000" stroke-width="1"/>

                    <use href="#scene2-mark-x-small" x="350" y="40"/>
                </g>

                <!-- 图②区域 -->
                <g>
                    <rect x="520" y="50" width="40" height="80" fill="none" stroke="#000" stroke-width="1.5"/>
                    <rect x="560" y="50" width="80" height="80" fill="none" stroke="#000" stroke-width="1.5"/>
                    <rect x="640" y="50" width="40" height="80" fill="none" stroke="#000" stroke-width="1.5"/>
                    <polygon points="520,130 560,130 520,150" fill="#a0a0a0" fill-opacity="0.4" stroke="#000" stroke-width="1"/>
                    <polygon points="640,130 680,130 680,150" fill="#a0a0a0" fill-opacity="0.4" stroke="#000" stroke-width="1"/>
                    <text x="590" y="170" text-anchor="middle" font-size="16" fill="#000">②</text>
                    <use href="#scene2-mark-x-small" x="710" y="40"/>
                </g>

                <!-- 图③区域（上移40px） -->
                <g>
                    <rect x="180" y="160" width="80" height="80" fill="none" stroke="#000" stroke-width="1.5"/>
                    <polygon points="180,240 140,200 180,160" fill="none" stroke="#000" stroke-width="1"/>
                    <line x1="140" y1="200" x2="180" y2="240" stroke="#000" stroke-width="1"/>
                    <polygon points="260,240 300,200 260,160" fill="none" stroke="#000" stroke-width="1"/>
                    <line x1="300" y1="200" x2="260" y2="240" stroke="#000" stroke-width="1"/>
                    <polygon points="180,240 260,240 220,307" fill="#a0a0a0" fill-opacity="0.4" stroke="#000" stroke-width="1"/>

        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-btn-prev" class="scene2-btn" disabled>◀ 上一步</button>
            <span id="scene2-step-indicator">步骤 0/5</span>
            <button id="scene2-btn-next" class="scene2-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        var currentStep = 0;
        var totalSteps = 5;
        var stepGroups = [];
        for (var i = 0; i <= totalSteps; i++) {
            stepGroups.push(document.getElementById('scene2-step' + i));
        }
        var btnPrev = document.getElementById('scene2-btn-prev');
        var btnNext = document.getElementById('scene2-btn-next');
        var indicator = document.getElementById('scene2-step-indicator');

        function updateStep() {
            for (var i = 0; i <= totalSteps; i++) {
                stepGroups[i].style.display = 'none';
            }
            stepGroups[currentStep].style.display = 'block';
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps);
            indicator.textContent = '步骤 ' + currentStep + '/' + totalSteps;
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateStep();
            }
        });

        updateStep();
    })();
    </script>
</body>
</html>
