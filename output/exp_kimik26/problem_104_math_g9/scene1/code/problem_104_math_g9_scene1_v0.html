<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正方形序列递推规律</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            padding: 6px 16px; font-size: 14px; border: none; border-radius: 4px;
            background: #1565c0; color: #fff; cursor: pointer; transition: opacity 0.2s;
        }
        #scene1-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene1-step-hint { position: absolute; bottom: 48px; left: 0; right: 0; text-align: center; font-size: 14px; color: #666; pointer-events: none; }
        #scene1-step-count { position: absolute; bottom: 66px; left: 0; right: 0; text-align: center; font-size: 12px; color: #999; pointer-events: none; }

        /* SVG element styles */
        .scene1-axis { stroke: #000; stroke-width: 2; fill: none; }
        .scene1-arrow { fill: #000; }
        .scene1-square-normal { stroke: #000; stroke-width: 1.5; fill: rgba(192,192,192,0.2); }
        .scene1-square-dimmed { stroke: #888; stroke-width: 1.5; fill: rgba(192,192,192,0.1); opacity: 0.3; }
        .scene1-highlight-blue { stroke: #1565c0; stroke-width: 2.5; fill: rgba(21,101,192,0.15); }
        .scene1-highlight-red { stroke: #c62828; stroke-width: 2.5; fill: rgba(198,40,40,0.15); }
        .scene1-label { font-size: 14px; fill: #000; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        .scene1-label-sub { font-size: 11px; baseline-shift: sub; }
        .scene1-aux-line { stroke: #888; stroke-width: 1; stroke-dasharray: 4,4; fill: none; }
        .scene1-angle-arc { stroke: #c62828; stroke-width: 1.5; fill: none; }
        .scene1-angle-arc-blue { stroke: #1565c0; stroke-width: 1.5; fill: none; }
        .scene1-right-angle { stroke: #000; stroke-width: 1.5; fill: none; }
        .scene1-annotation-green { font-size: 16px; fill: #2e7d32; font-family: "Microsoft YaHei", sans-serif; }
        .scene1-annotation-red { font-size: 16px; fill: #c62828; font-family: "Microsoft YaHei", sans-serif; }
        .scene1-annotation-black { font-size: 16px; fill: #000; font-family: "Microsoft YaHei", sans-serif; }
        .scene1-formula-red { font-size: 18px; fill: #c62828; font-weight: bold; font-family: "Microsoft YaHei", sans-serif; }
        .scene1-formula-black { font-size: 18px; fill: #000; font-weight: bold; font-family: "Microsoft YaHei", sans-serif; }
        .scene1-formula-green { font-size: 20px; fill: #2e7d32; font-weight: bold; font-family: "Microsoft YaHei", sans-serif; }
        .scene1-parallel-line { stroke: #c62828; stroke-width: 1.5; stroke-dasharray: 6,4; fill: none; }
        .scene1-parallel-text { font-size: 14px; fill: #c62828; font-family: "Microsoft YaHei", sans-serif; }
        .scene1-hidden { display: none; }
        .scene1-dimmed { opacity: 0.15; }
        .scene1-faded { opacity: 0.3; }

        /* Smooth transitions */
        .scene1-transition { transition: opacity 0.3s ease, stroke 0.3s ease, fill 0.3s ease, stroke-width 0.3s ease; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- Coordinate axes -->
            <g id="scene1-axes">
                <line x1="120" y1="420" x2="720" y2="420" class="scene1-axis" />
                <line x1="120" y1="420" x2="120" y2="100" class="scene1-axis" />
                <!-- Arrow x -->
                <polygon points="720,420 710,415 710,425" class="scene1-arrow" />
                <!-- Arrow y -->
                <polygon points="120,100 115,110 125,110" class="scene1-arrow" />
                <!-- Axis labels -->
                <text x="730" y="435" class="scene1-label">x</text>
                <text x="105" y="85" class="scene1-label">y</text>
                <text x="110" y="435" class="scene1-label" text-anchor="end">O</text>
            </g>

            <!-- Squares -->
            <!-- Large square 1: A1B1C1D1 -->
            <g id="scene1-square-large-1" class="scene1-transition">
                <polygon points="241,229 120,299 190,420 311,350" class="scene1-square-normal" />
            </g>
            <!-- Small square 1: D1E1E2B2 -->
            <g id="scene1-square-small-1" class="scene1-transition">
                <polygon points="311,350 311,420 381,420 381,350" class="scene1-square-normal" />
            </g>
            <!-- Large square 2: A2B2C2D2 -->
            <g id="scene1-square-large-2" class="scene1-transition">
                <polygon points="451,310 381,350 422,420 492,380" class="scene1-square-normal" />
            </g>
            <!-- Small square 2: D2E3E4B3 -->
            <g id="scene1-square-small-2" class="scene1-transition">
                <polygon points="492,380 492,420 532,420 532,380" class="scene1-square-normal" />
            </g>
            <!-- Large square 3: A3B3C3D3 -->
            <g id="scene1-square-large-3" class="scene1-transition">
                <polygon points="573,356 532,380 555,420 596,397" class="scene1-square-normal" />
            </g>

            <!-- Perpendicular lines -->
            <g id="scene1-perp-d1e1" class="scene1-hidden scene1-transition">
                <line x1="311" y1="350" x2="311" y2="420" class="scene1-aux-line" />
            </g>
            <g id="scene1-perp-b2h2" class="scene1-hidden scene1-transition">
                <line x1="381" y1="350" x2="381" y2="420" class="scene1-aux-line" />
            </g>
            <g id="scene1-perp-d2e3" class="scene1-hidden scene1-transition">
                <line x1="492" y1="380" x2="492" y2="420" class="scene1-aux-line" />
            </g>
            <g id="scene1-perp-b3h3" class="scene1-hidden scene1-transition">
                <line x1="532" y1="380" x2="532" y2="420" class="scene1-aux-line" />
            </g>

            <!-- Horizontal dashed line for y_B2 -->
            <g id="scene1-horiz-yb2" class="scene1-hidden scene1-transition">
                <line x1="120" y1="350" x2="381" y2="350" class="scene1-aux-line" />
            </g>

            <!-- Parallel relation line -->
            <g id="scene1-parallel-line" class="scene1-hidden scene1-transition">
                <line x1="150" y1="250" x2="550" y2="250" class="scene1-parallel-line" />
                <text x="350" y="245" class="scene1-parallel-text" text-anchor="middle">B₁C₁ ∥ B₂C₂ ∥ B₃C₃</text>
            </g>

            <!-- Right angle marks -->
            <g id="scene1-right-o" class="scene1-hidden scene1-transition">
                <polyline points="132,420 132,408 120,408" class="scene1-right-angle" fill="none" />
            </g>
            <g id="scene1-right-h2" class="scene1-hidden scene1-transition">
                <polyline points="393,420 393,408 381,408" class="scene1-right-angle" fill="none" />
            </g>
            <g id="scene1-right-h3" class="scene1-hidden scene1-transition">
                <polyline points="544,420 544,408 532,408" class="scene1-right-angle" fill="none" />
            </g>

            <!-- Angle arcs -->
            <g id="scene1-angle-30" class="scene1-hidden scene1-transition">
                <!-- Arc at B1, from 60° to 90° (SVG coordinates), radius 25 -->
                <path d="M 132.5,320.65 A 25,25 0 0,1 145,299" class="scene1-angle-arc" fill="none" />
                <text x="280" y="280" class="scene1-annotation-red" font-size="14px">30°</text>
            </g>
            <g id="scene1-angle-60-c1" class="scene1-hidden scene1-transition">
                <!-- Arc at C1, from 180° to 240°, radius 20 -->
                <path d="M 170,420 A 20,20 0 0,1 160,402.68" class="scene1-angle-arc" fill="none" />
                <text x="140" y="400" class="scene1-annotation-red" font-size="14px">60°</text>
            </g>
            <g id="scene1-angle-60-c2" class="scene1-hidden scene1-transition">
                <!-- Arc at C2, from 180° to 240°, radius 15 -->
                <path d="M 407,420 A 15,15 0 0,1 399.5,407.01" class="scene1-angle-arc-blue" fill="none" />
                <text x="350" y="390" class="scene1-annotation-red" font-size="14px">60°</text>
            </g>

            <!-- Point labels -->
            <g id="scene1-labels">
                <text x="241" y="219" class="scene1-label" text-anchor="middle">A₁</text>
                <text x="105" y="299" class="scene1-label" text-anchor="end">B₁</text>
                <text x="190" y="435" class="scene1-label" text-anchor="middle">C₁</text>
                <text x="325" y="340" class="scene1-label">D₁</text>
                <text x="311" y="435" class="scene1-label" text-anchor="middle">E₁</text>
                <text x="381" y="435" class="scene1-label" text-anchor="middle" id="scene1-label-e2">E₂</text>
                <text x="370" y="345" class="scene1-label" text-anchor="end" id="scene1-label-b2">B₂</text>
                <text x="451" y="300" class="scene1-label" text-anchor="middle">A₂</text>
                <text x="422" y="435" class="scene1-label" text-anchor="middle">C₂</text>
                <text x="485" y="365" class="scene1-label" text-anchor="end" id="scene1-label-d2">D₂</text>
                <text x="492" y="435" class="scene1-label" text-anchor="middle">E₃</text>
                <text x="525" y="435" class="scene1-label" text-anchor="middle" id="scene1-label-e4">E₄</text>
                <text x="540" y="365" class="scene1-label" id="scene1-label-b3">B₃</text>
                <text x="573" y="346" class="scene1-label" text-anchor="middle">A₃</text>
                <text x="565" y="435" class="scene1-label" text-anchor="middle">C₃</text>
                <text x="610" y="380" class="scene1-label" id="scene1-label-d3">D₃</text>
                <!-- H2 and H3 labels (initially hidden) -->
                <text x="370" y="435" class="scene1-label scene1-hidden" text-anchor="middle" id="scene1-label-h2">H₂</text>
                <text x="545" y="475" class="scene1-label scene1-hidden" text-anchor="middle" id="scene1-label-h3">H₃</text>
            </g>

            <!-- Annotations -->
            <g id="scene1-anno-a1" class="scene1-hidden scene1-transition">
                <text x="95" y="370" class="scene1-annotation-green">a₁=1</text>
            </g>
            <g id="scene1-anno-de1" class="scene1-hidden scene1-transition">
                <text x="331" y="385" class="scene1-annotation-green">D₁E₁=1/2</text>
            </g>
            <g id="scene1-anno-side-half" class="scene1-hidden scene1-transition">
                <text x="330" y="290" class="scene1-annotation-red">边长=1/2</text>
            </g>
            <g id="scene1-anno-yb2" class="scene1-hidden scene1-transition">
                <text x="200" y="340" class="scene1-annotation-black">y_B₂=1/2</text>
            </g>
            <g id="scene1-anno-b2h2" class="scene1-hidden scene1-transition">
                <text x="390" y="415" class="scene1-annotation-black">B₂H₂=1/2</text>
            </g>
            <g id="scene1-anno-a2-formula" class="scene1-hidden scene1-transition">
                <text x="400" y="260" class="scene1-formula-red">a₂ = B₂H₂ / sin60° = √3/3</text>
            </g>
            <g id="scene1-anno-a2-val" class="scene1-hidden scene1-transition">
                <text x="500" y="310" class="scene1-annotation-red">a₂=√3/3</text>
            </g>
            <g id="scene1-anno-d2e3" class="scene1-hidden scene1-transition">
                <text x="450" y="355" class="scene1-annotation-green">D₂E₃=√3/6</text>
            </g>
            <g id="scene1-anno-side-sqrt3-6" class="scene1-hidden scene1-transition">
                <text x="500" y="310" class="scene1-annotation-red">边长=√3/6</text>
            </g>
            <g id="scene1-anno-b3h3" class="scene1-hidden scene1-transition">
                <text x="565" y="415" class="scene1-annotation-black">B₃H₃=√3/6</text>
            </g>
            <g id="scene1-anno-a3" class="scene1-hidden scene1-transition">
                <text x="610" y="335" class="scene1-annotation-red">a₃=1/3</text>
            </g>

            <!-- Formula texts (right side) -->
            <g id="scene1-formula-recurrence" class="scene1-hidden scene1-transition">
                <text x="580" y="150" class="scene1-formula-red">递推关系：</text>
                <text x="580" y="195" class="scene1-formula-red">aₙ₊₁ = aₙ · √3/3</text>
                <text x="580" y="240" class="scene1-formula-red">公比 q = √3/3</text>
            </g>
            <g id="scene1-formula-general" class="scene1-hidden scene1-transition">
                <text x="580" y="150" class="scene1-formula-black">通项公式：</text>
                <text x="580" y="195" class="scene1-formula-black">aₙ = (√3/3)ⁿ⁻¹</text>
                <text x="580" y="245" class="scene1-formula-green">a₂₀₁₆ = (√3/3)²⁰¹⁵</text>
                <text x="580" y="290" class="scene1-formula-green">答案：C</text>
            </g>
        </svg>

        <div id="scene1-step-count">步骤 1 / 8</div>
        <div id="scene1-step-hint">观察图形，注意大正方形与小正方形交替放置的规律</div>
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 implementation
        let currentStep = 0;
        const totalSteps = 8;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepHint = document.getElementById('scene1-step-hint');
        const stepCount = document.getElementById('scene1-step-count');

        // Element references
        const els = {
            sqL1: document.getElementById('scene1-square-large-1'),
            sqS1: document.getElementById('scene1-square-small-1'),
            sqL2: document.getElementById('scene1-square-large-2'),
            sqS2: document.getElementById('scene1-square-small-2'),
            sqL3: document.getElementById('scene1-square-large-3'),
            perpD1E1: document.getElementById('scene1-perp-d1e1'),
            perpB2H2: document.getElementById('scene1-perp-b2h2'),
            perpD2E3: document.getElementById('scene1-perp-d2e3'),
            perpB3H3: document.getElementById('scene1-perp-b3h3'),
            horizYB2: document.getElementById('scene1-horiz-yb2'),
            parallelLine: document.getElementById('scene1-parallel-line'),
            rightO: document.getElementById('scene1-right-o'),
            rightH2: document.getElementById('scene1-right-h2'),
            rightH3: document.getElementById('scene1-right-h3'),
            angle30: document.getElementById('scene1-angle-30'),
            angle60C1: document.getElementById('scene1-angle-60-c1'),
            angle60C2: document.getElementById('scene1-angle-60-c2'),
            labelE2: document.getElementById('scene1-label-e2'),
            labelE4: document.getElementById('scene1-label-e4'),
            labelH2: document.getElementById('scene1-label-h2'),
            labelH3: document.getElementById('scene1-label-h3'),
            annoA1: document.getElementById('scene1-anno-a1'),
            annoDE1: document.getElementById('scene1-anno-de1'),
            annoSideHalf: document.getElementById('scene1-anno-side-half'),
            annoYB2: document.getElementById('scene1-anno-yb2'),
            annoB2H2: document.getElementById('scene1-anno-b2h2'),
            annoA2Formula: document.getElementById('scene1-anno-a2-formula'),
            annoA2Val: document.getElementById('scene1-anno-a2-val'),
            annoD2E3: document.getElementById('scene1-anno-d2e3'),
            annoSideSqrt36: document.getElementById('scene1-anno-side-sqrt3-6'),
            annoB3H3: document.getElementById('scene1-anno-b3h3'),
            annoA3: document.getElementById('scene1-anno-a3'),
            formulaRecurrence: document.getElementById('scene1-formula-recurrence'),
            formulaGeneral: document.getElementById('scene1-formula-general'),
        };

        function setClass(el, className, add) {
            if (!el) return;
            if (add) el.classList.add(className);
            else el.classList.remove(className);
        }

        function show(el) {
            if (!el) return;
            el.classList.remove('scene1-hidden');
            el.style.display = '';
            el.style.opacity = '';
        }

        function hide(el) {
            if (!el) return;
            el.classList.add('scene1-hidden');
        }

        function resetAll() {
            // Reset all squares to normal
            ['sqL1','sqS1','sqL2','sqS2','sqL3'].forEach(k => {
                setClass(els[k], 'scene1-square-normal', true);
                setClass(els[k], 'scene1-square-dimmed', false);
                setClass(els[k], 'scene1-highlight-blue', false);
                setClass(els[k], 'scene1-highlight-red', false);
                els[k].style.opacity = '';
            });
            // Hide all optional elements
            Object.values(els).forEach(el => {
                if (el && el.id && el.id.startsWith('scene1-')) {
                    hide(el);
                }
            });
            // Always show labels that are not optional
            show(document.getElementById('scene1-labels'));
            show(els.labelE2);
            show(els.labelE4);
            hide(els.labelH2);
            hide(els.labelH3);
        }

        const stepHints = [
            "观察图形，注意大正方形与小正方形交替放置的规律",
            "在Rt△OB₁C₁中，∠C₁B₁O = 30°，B₁C₁ = 1",
            "直角三角形两锐角互余，∠OC₁B₁ = 60°",
            "C₁D₁ ⊥ B₁C₁，故C₁D₁与x轴夹角30°，D₁E₁ = C₁D₁·sin30° = 1/2",
            "小正方形D₁E₁E₂B₂的边长等于D₁的纵坐标，即1/2",
            "在Rt△B₂H₂C₂中，a₂ = B₂H₂ / sin60° = √3/3",
            "观察规律：每个大正方形边长是前一个的√3/3倍",
            "等比数列通项公式：aₙ = a₁·qⁿ⁻¹，代入n=2016"
        ];

        function applyStep(step) {
            resetAll();
            stepCount.textContent = '步骤 ' + (step + 1) + ' / ' + totalSteps;
            stepHint.textContent = stepHints[step];
            btnPrev.disabled = step === 0;
            btnNext.disabled = step === totalSteps - 1;

            switch(step) {
                case 0:
                    // Step 0: Show all squares normal, highlight known conditions
                    show(els.sqL1); show(els.sqS1); show(els.sqL2); show(els.sqS2); show(els.sqL3);
                    show(els.angle30);
                    show(els.annoA1);
                    show(els.parallelLine);
                    break;
                case 1:
                    // Step 1: Focus large square 1, dim others
                    setClass(els.sqL1, 'scene1-highlight-blue', true);
                    setClass(els.sqS1, 'scene1-square-dimmed', true);
                    setClass(els.sqL2, 'scene1-square-dimmed', true);
                    setClass(els.sqS2, 'scene1-square-dimmed', true);
                    setClass(els.sqL3, 'scene1-square-dimmed', true);
                    show(els.angle30);
                    show(els.rightO);
                    break;
                case 2:
                    // Step 2: Keep large square 1 highlighted, add 60° at C1
                    setClass(els.sqL1, 'scene1-highlight-blue', true);
                    setClass(els.sqS1, 'scene1-square-dimmed', true);
                    setClass(els.sqL2, 'scene1-square-dimmed', true);
                    setClass(els.sqS2, 'scene1-square-dimmed', true);
                    setClass(els.sqL3, 'scene1-square-dimmed', true);
                    show(els.angle30);
                    show(els.angle60C1);
                    show(els.rightO);
                    break;
                case 3:
                    // Step 3: Derive D1 y-coordinate
                    setClass(els.sqL1, 'scene1-highlight-blue', true);
                    setClass(els.sqS1, 'scene1-square-dimmed', true);
                    setClass(els.sqL2, 'scene1-square-dimmed', true);
                    setClass(els.sqS2, 'scene1-square-dimmed', true);
                    setClass(els.sqL3, 'scene1-square-dimmed', true);
                    show(els.perpD1E1);
                    show(els.annoDE1);
                    break;
                case 4:
                    // Step 4: Small square side length
                    setClass(els.sqL1, 'scene1-square-normal', true);
                    setClass(els.sqS1, 'scene1-highlight-red', true);
                    setClass(els.sqL2, 'scene1-square-dimmed', true);
                    setClass(els.sqS2, 'scene1-square-dimmed', true);
                    setClass(els.sqL3, 'scene1-square-dimmed', true);
                    show(els.annoSideHalf);
                    show(els.horizYB2);
                    show(els.annoYB2);
                    break;
                case 5:
                    // Step 5: Derive a2
                    setClass(els.sqS1, 'scene1-square-normal', true);
                    setClass(els.sqL2, 'scene1-highlight-blue', true);
                    setClass(els.sqL1, 'scene1-square-dimmed', true);
                    setClass(els.sqS2, 'scene1-square-dimmed', true);
                    setClass(els.sqL3, 'scene1-square-dimmed', true);
                    show(els.perpB2H2);
                    show(els.rightH2);
                    hide(els.labelE2);
                    show(els.labelH2);
                    show(els.annoB2H2);
                    show(els.angle60C2);
                    show(els.annoA2Formula);
                    show(els.annoA2Val);
                    break;
                case 6:
                    // Step 6: Discover recurrence
                    setClass(els.sqL2, 'scene1-highlight-blue', true);
                    setClass(els.sqS2, 'scene1-highlight-red', true);
                    setClass(els.sqL3, 'scene1-highlight-blue', true);
                    setClass(els.sqL1, 'scene1-faded', true);
                    els.sqL1.style.opacity = '0.3';
                    setClass(els.sqS1, 'scene1-faded', true);
                    els.sqS1.style.opacity = '0.3';
                    show(els.perpD2E3);
                    show(els.perpB3H3);
                    show(els.rightH3);
                    hide(els.labelE4);
                    show(els.labelH3);
                    show(els.annoD2E3);
                    show(els.annoSideSqrt36);
                    show(els.annoB3H3);
                    show(els.annoA3);
                    show(els.formulaRecurrence);
                    break;
                case 7:
                    // Step 7: General formula and answer
                    show(els.sqL1); show(els.sqS1); show(els.sqL2); show(els.sqS2); show(els.sqL3);
                    setClass(els.sqL1, 'scene1-square-normal', true);
                    setClass(els.sqS1, 'scene1-square-normal', true);
                    setClass(els.sqL2, 'scene1-square-normal', true);
                    setClass(els.sqS2, 'scene1-square-normal', true);
                    setClass(els.sqL3, 'scene1-square-normal', true);
                    show(els.formulaGeneral);
                    break;
            }
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                applyStep(currentStep);
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                applyStep(currentStep);
            }
        });

        // Initialize
        applyStep(0);
    })();
    </script>
</body>
</html>
