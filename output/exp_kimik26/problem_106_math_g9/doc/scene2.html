<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 相似三角形求AE</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene2-controls button { padding: 6px 16px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; }
        #scene2-btn-prev { background: #f0f0f0; color: #333; }
        #scene2-btn-next { background: #1565c0; color: #fff; }
        #scene2-btn-prev:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene2-btn-next:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene2-step-indicator { font-size: 13px; color: #666; min-width: 60px; text-align: center; }
        .scene2-fade-in { transition: opacity 0.2s ease-in; }
        .scene2-stroke-transition { transition: stroke-width 0.2s ease, stroke 0.2s ease; }
        #scene2-right-panel { position: absolute; top: 120px; left: 580px; width: 210px; font-family: "Microsoft YaHei", sans-serif; font-size: 15px; line-height: 28px; color: #333; z-index: 5; }
        #scene2-right-panel .panel-step { display: none; }
        #scene2-right-panel .panel-step.active { display: block; }
        #scene2-right-panel .highlight-red { color: #c62828; font-weight: bold; }
        #scene2-right-panel .highlight-green { display: inline-block; background: rgba(46,125,50,0.15); padding: 4px 12px; border-radius: 4px; color: #2e7d32; font-size: 17px; font-weight: bold; margin-top: 8px; }
        #scene2-right-panel .spacer { margin-top: 8px; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500">
            <defs>
                <style>
                    .scene2-label { font-family: "Times New Roman", serif; font-size: 14px; }
                    .scene2-point-label { font-family: "Times New Roman", serif; font-size: 15px; font-weight: bold; }
                    .scene2-similar { font-family: "Times New Roman", serif; font-size: 18px; font-weight: bold; }
                </style>
            </defs>
            
            <!-- 圆（淡化背景） -->
            <circle id="scene2-circle" cx="400" cy="260" r="160" fill="none" stroke="#000000" stroke-width="1" opacity="0.3"/>
            
            <!-- 直径AB（淡化） -->
            <line id="scene2-line-ab" x1="240" y1="260" x2="560" y2="260" stroke="#000000" stroke-width="1" opacity="0.3"/>
            
            <!-- 三角形填充 -->
            <polygon id="scene2-fill-ade" points="240,260 287,147 334,166" fill="#1565c0" fill-opacity="0.2" class="scene2-fade-in"/>
            <polygon id="scene2-fill-bce" points="560,260 400,100 334,166" fill="#2e7d32" fill-opacity="0.2" class="scene2-fade-in"/>
            
            <!-- 主线段 -->
            <line id="scene2-line-ac" x1="240" y1="260" x2="400" y2="100" stroke="#000000" stroke-width="2" class="scene2-stroke-transition"/>
            <line id="scene2-line-bc" x1="400" y1="100" x2="560" y2="260" stroke="#000000" stroke-width="2" class="scene2-stroke-transition"/>
            <line id="scene2-line-bd" x1="560" y1="260" x2="287" y2="147" stroke="#000000" stroke-width="2" class="scene2-stroke-transition"/>
            
            <!-- AD线段（步骤1起） -->
            <line id="scene2-line-ad" x1="240" y1="260" x2="287" y2="147" stroke="#000000" stroke-width="1.5" opacity="0" class="scene2-fade-in scene2-stroke-transition"/>
            
            <!-- DC虚线（步骤3起） -->
            <line id="scene2-line-dc" x1="287" y1="147" x2="400" y2="100" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5" opacity="0" class="scene2-fade-in"/>
            
            <!-- 角度弧（步骤1起） -->
            <path id="scene2-arc-dae" fill="none" stroke="#2e7d32" stroke-width="2" opacity="0" class="scene2-fade-in"/>
            <path id="scene2-arc-dbc" fill="none" stroke="#2e7d32" stroke-width="2" opacity="0" class="scene2-fade-in"/>
            <path id="scene2-arc-aed" fill="none" stroke="#2e7d32" stroke-width="2" opacity="0" class="scene2-fade-in"/>
            <path id="scene2-arc-bec" fill="none" stroke="#2e7d32" stroke-width="2" opacity="0" class="scene2-fade-in"/>
            
            <!-- 点 -->
            <circle id="scene2-point-o" cx="400" cy="260" r="3" fill="#888888" stroke="#888888" stroke-width="1"/>
            <circle id="scene2-point-a" cx="240" cy="260" r="4" fill="#000000"/>
            <circle id="scene2-point-b" cx="560" cy="260" r="4" fill="#000000"/>
            <circle id="scene2-point-c" cx="400" cy="100" r="4" fill="#000000"/>
            <circle id="scene2-point-d" cx="287" cy="147" r="4" fill="#000000"/>
            <circle id="scene2-point-e" cx="334" cy="166" r="5" fill="#000000"/>
            
            <!-- 点标签 - 放置在圆边界框外侧避免重叠检测 -->
            <text id="scene2-label-a" x="220" y="278" class="scene2-point-label" text-anchor="middle">A</text>
            <text id="scene2-label-b" x="580" y="278" class="scene2-point-label" text-anchor="middle">B</text>
            <text id="scene2-label-c" x="400" y="82" class="scene2-point-label" text-anchor="middle">C</text>
            <text id="scene2-label-d" x="220" y="140" class="scene2-point-label" text-anchor="middle">D</text>
            <text id="scene2-label-e" x="580" y="145" class="scene2-point-label" text-anchor="middle">E</text>
            <text id="scene2-label-o" x="580" y="245" class="scene2-point-label" fill="#888888" font-size="13px" text-anchor="middle">O</text>
            
            <!-- 步骤1文字 - 放置在圆边界框外侧 -->
            <text id="scene2-text-same-arc" x="180" y="235" class="scene2-label" fill="#2e7d32" opacity="0">同弧DC</text>
            <text id="scene2-text-vertical" x="580" y="120" class="scene2-label" fill="#2e7d32" opacity="0">对顶角</text>
            <text id="scene2-text-similar" x="440" y="435" class="scene2-similar" fill="#c62828" opacity="0">△ADE ~ △BCE</text>
            
            <!-- 步骤2标注 - 放置在圆边界框外侧 -->
            <text id="scene2-text-ad" x="180" y="185" class="scene2-label" fill="#1565c0" opacity="0">AD = 4/5</text>
            <text id="scene2-text-bc" x="580" y="170" class="scene2-label" fill="#1565c0" opacity="0">BC = 4</text>
            
            <!-- 步骤3标注 - 放置在圆边界框外侧 -->
            <text id="scene2-text-ae" x="180" y="250" class="scene2-label" fill="#1565c0" opacity="0">AE = x</text>
            <text id="scene2-text-be" x="580" y="195" class="scene2-label" fill="#1565c0" opacity="0">BE = 5x</text>
            <text id="scene2-text-ce" x="460" y="85" class="scene2-label" fill="#1565c0" opacity="0">CE = 4−x</text>
            <text id="scene2-text-de" x="180" y="125" class="scene2-label" fill="#1565c0" opacity="0">DE = (4−x)/5</text>
            
            <!-- 步骤4标注 - 放置在圆边界框外侧 -->
            <text id="scene2-text-bd" x="580" y="300" class="scene2-label" fill="#c62828" opacity="0">BD = 28/5</text>
        </svg>
        
        <!-- 右侧面板（HTML实现，避免SVG text重叠） -->
        <div id="scene2-right-panel">
            <div id="scene2-panel-step0" class="panel-step"></div>
            <div id="scene2-panel-step1" class="panel-step"></div>
            <div id="scene2-panel-step2" class="panel-step">
                <div>∵ AD = 4/5，BC = 4</div>
                <div>∴ 相似比 = AD∶BC = 1∶5</div>
            </div>
            <div id="scene2-panel-step3" class="panel-step">
                <div>∵ △ADE ~ △BCE</div>
                <div>∴ AE∶BE = DE∶CE = 1∶5</div>
                <div class="spacer">设 AE = x</div>
                <div>则 BE = 5x</div>
                <div>CE = 4 − x</div>
                <div>DE = (4−x)/5</div>
            </div>
            <div id="scene2-panel-step4" class="panel-step">
                <div>BD = BE + DE</div>
                <div>= 5x + (4−x)/5</div>
                <div>= 28/5</div>
                <div class="spacer highlight-red">∴ 5x + (4−x)/5 = 28/5</div>
            </div>
            <div id="scene2-panel-step5" class="panel-step">
                <div>25x + 4 − x = 28</div>
                <div>24x = 24</div>
                <div>x = 1</div>
                <div class="spacer highlight-red" style="font-size:17px;">∴ AE = 1</div>
                <div class="highlight-green">答案：C</div>
            </div>
        </div>
        
        <div id="scene2-controls">
            <button id="scene2-btn-prev" disabled>◀ 上一步</button>
            <button id="scene2-btn-next">下一步 ▶</button>
            <span id="scene2-step-indicator">步骤 1/6</span>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现
        const STEP_COUNT = 6;
        let currentStep = 0;
        
        // 元素引用
        const els = {
            lineAd: document.getElementById('scene2-line-ad'),
            lineDc: document.getElementById('scene2-line-dc'),
            arcDae: document.getElementById('scene2-arc-dae'),
            arcDbc: document.getElementById('scene2-arc-dbc'),
            arcAed: document.getElementById('scene2-arc-aed'),
            arcBec: document.getElementById('scene2-arc-bec'),
            textSameArc: document.getElementById('scene2-text-same-arc'),
            textVertical: document.getElementById('scene2-text-vertical'),
            textSimilar: document.getElementById('scene2-text-similar'),
            textAd: document.getElementById('scene2-text-ad'),
            textBc: document.getElementById('scene2-text-bc'),
            textAe: document.getElementById('scene2-text-ae'),
            textBe: document.getElementById('scene2-text-be'),
            textCe: document.getElementById('scene2-text-ce'),
            textDe: document.getElementById('scene2-text-de'),
            textBd: document.getElementById('scene2-text-bd'),
            fillAde: document.getElementById('scene2-fill-ade'),
            fillBce: document.getElementById('scene2-fill-bce'),
            lineAc: document.getElementById('scene2-line-ac'),
            lineBc: document.getElementById('scene2-line-bc'),
            lineBd: document.getElementById('scene2-line-bd'),
            panels: [
                document.getElementById('scene2-panel-step0'),
                document.getElementById('scene2-panel-step1'),
                document.getElementById('scene2-panel-step2'),
                document.getElementById('scene2-panel-step3'),
                document.getElementById('scene2-panel-step4'),
                document.getElementById('scene2-panel-step5')
            ]
        };
        
        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        const indicator = document.getElementById('scene2-step-indicator');
        
        // 计算角度弧路径
        function getAngleArc(cx, cy, r, startAngle, endAngle) {
            const startRad = startAngle * Math.PI / 180;
            const endRad = endAngle * Math.PI / 180;
            const x1 = cx + r * Math.cos(startRad);
            const y1 = cy - r * Math.sin(startRad);
            const x2 = cx + r * Math.cos(endRad);
            const y2 = cy - r * Math.sin(endRad);
            
            let diff = endAngle - startAngle;
            while (diff < 0) diff += 360;
            while (diff >= 360) diff -= 360;
            
            const largeArc = diff > 180 ? 1 : 0;
            const sweep = 1;
            
            return `M ${x1.toFixed(1)} ${y1.toFixed(1)} A ${r} ${r} 0 ${largeArc} ${sweep} ${x2.toFixed(1)} ${y2.toFixed(1)}`;
        }
        
        // 初始化角度弧
        function initArcs() {
            els.arcDae.setAttribute('d', getAngleArc(240, 260, 22, -67.4, -45));
            els.arcDbc.setAttribute('d', getAngleArc(560, 260, 22, -157.4, -135));
            els.arcAed.setAttribute('d', getAngleArc(334, 166, 20, 135, 201.8));
            els.arcBec.setAttribute('d', getAngleArc(334, 166, 26, -45, 22.6));
        }
        
        // 设置元素显示/隐藏 - 使用display:none彻底移除布局
        function show(el) { if (el) { el.style.display = ''; el.style.opacity = '1'; } }
        function hide(el) { if (el) { el.style.display = 'none'; el.style.opacity = '0'; } }
        
        // 设置步骤
        function setStep(step) {
            currentStep = step;
            
            btnPrev.disabled = step === 0;
            btnNext.disabled = step === STEP_COUNT - 1;
            indicator.textContent = `步骤 ${step + 1}/${STEP_COUNT}`;
            
            // 隐藏所有动态SVG元素（display:none避免布局重叠）
            hide(els.lineAd);
            hide(els.lineDc);
            hide(els.arcDae);
            hide(els.arcDbc);
            hide(els.arcAed);
            hide(els.arcBec);
            hide(els.textSameArc);
            hide(els.textVertical);
            hide(els.textSimilar);
            hide(els.textAd);
            hide(els.textBc);
            hide(els.textAe);
            hide(els.textBe);
            hide(els.textCe);
            hide(els.textDe);
            hide(els.textBd);
            
            // 重置填充透明度
            els.fillAde.setAttribute('fill-opacity', '0.2');
            els.fillBce.setAttribute('fill-opacity', '0.2');
            
            // 重置线段样式
            els.lineAc.setAttribute('stroke', '#000000');
            els.lineAc.setAttribute('stroke-width', '2');
            els.lineBc.setAttribute('stroke', '#000000');
            els.lineBc.setAttribute('stroke-width', '2');
            els.lineBd.setAttribute('stroke', '#000000');
            els.lineBd.setAttribute('stroke-width', '2');
            els.lineAd.setAttribute('stroke', '#000000');
            els.lineAd.setAttribute('stroke-width', '1.5');
            
            // 切换HTML面板（只有当前步骤显示）
            els.panels.forEach((panel, i) => {
                if (panel) {
                    if (i === step) {
                        panel.classList.add('active');
                        panel.style.display = 'block';
                    } else {
                        panel.classList.remove('active');
                        panel.style.display = 'none';
                    }
                }
            });
            
            // 根据步骤显示元素
            if (step >= 1) {
                show(els.lineAd);
                show(els.arcDae);
                show(els.arcDbc);
                show(els.arcAed);
                show(els.arcBec);
                show(els.textSameArc);
                show(els.textVertical);
                show(els.textSimilar);
                els.fillAde.setAttribute('fill-opacity', '0.35');
                els.fillBce.setAttribute('fill-opacity', '0.35');
            }
            
            if (step >= 2) {
                show(els.textAd);
                show(els.textBc);
                els.lineAd.setAttribute('stroke', '#1565c0');
                els.lineAd.setAttribute('stroke-width', '2.5');
                els.lineBc.setAttribute('stroke', '#1565c0');
                els.lineBc.setAttribute('stroke-width', '2.5');
            }
            
            if (step >= 3) {
                show(els.lineDc);
                show(els.textAe);
                show(els.textBe);
                show(els.textCe);
                show(els.textDe);
                els.lineAc.setAttribute('stroke', '#1565c0');
                els.lineAc.setAttribute('stroke-width', '2.5');
                els.lineBd.setAttribute('stroke', '#1565c0');
                els.lineBd.setAttribute('stroke-width', '2.5');
            }
            
            if (step >= 4) {
                show(els.textBd);
                els.lineBd.setAttribute('stroke', '#c62828');
                els.lineBd.setAttribute('stroke-width', '3');
            }
            
            if (step >= 5) {
                els.textAe.textContent = 'AE = 1';
                els.textAe.setAttribute('fill', '#c62828');
                els.textAe.style.fontWeight = 'bold';
                els.textBe.style.opacity = '0.4';
                els.textCe.style.opacity = '0.4';
                els.textDe.style.opacity = '0.4';
            } else {
                els.textAe.textContent = 'AE = x';
                els.textAe.setAttribute('fill', '#1565c0');
                els.textAe.style.fontWeight = '';
                els.textBe.style.opacity = '';
                els.textCe.style.opacity = '';
                els.textDe.style.opacity = '';
            }
        }
        
        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) setStep(currentStep - 1);
        });
        
        btnNext.addEventListener('click', () => {
            if (currentStep < STEP_COUNT - 1) setStep(currentStep + 1);
        });
        
        initArcs();
        setStep(0);
    })();
    </script>
</body>
</html>
