<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>屋架设计图 - 中位线与直角三角形性质</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            padding: 6px 16px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #f5f5f5;
            color: #333;
        }
        #scene1-controls button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        #scene1-step-indicator {
            font-size: 14px;
            color: #555;
            min-width: 70px;
            text-align: center;
        }
        #scene1-options-bar {
            position: absolute;
            bottom: 55px;
            left: 0;
            right: 0;
            display: none;
            justify-content: center;
            gap: 14px;
            z-index: 10;
        }
        #scene1-options-bar.active {
            display: flex;
        }
        .scene1-option {
            width: 60px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            font-size: 14px;
            border: 1px solid #bbb;
            background: #e0e0e0;
            color: #888;
        }
        .scene1-option.correct {
            background: #2e7d32;
            border-color: #2e7d32;
            color: #fff;
            font-weight: bold;
        }
        svg { display: block; }
        .scene1-formula { font-size: 16px; fill: #000; text-anchor: end; }
        .scene1-label { font-size: 14px; fill: #000; text-anchor: middle; }
        .scene1-value-blue { font-size: 16px; fill: #1565c0; text-anchor: middle; font-weight: bold; }
        .scene1-value-red { font-size: 16px; fill: #c62828; text-anchor: middle; font-weight: bold; }
        .scene1-value-green { font-size: 16px; fill: #2e7d32; text-anchor: middle; font-weight: bold; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <!-- 基础结构（始终显示） -->
            <!-- △ABC 填充 -->
            <polygon id="scene1-tri-abc-fill" points="180,300 500,115 500,300" fill="#ffd700" fill-opacity="0.2" />

            <!-- △ADE 填充（步骤3显示） -->
            <polygon id="scene1-tri-ade-fill" points="180,300 340,207.5 340,300" fill="#ffcdd2" fill-opacity="0" />

            <!-- 线段 AC（横梁） -->
            <line id="scene1-segment-ac" x1="180" y1="300" x2="500" y2="300" stroke="#000" stroke-width="2.5" />

            <!-- 线段 AB（斜梁） -->
            <line id="scene1-segment-ab" x1="180" y1="300" x2="500" y2="115" stroke="#000" stroke-width="2.5" />

            <!-- 线段 BC（立柱） -->
            <line id="scene1-segment-bc" x1="500" y1="115" x2="500" y2="300" stroke="#000" stroke-width="2.5" />

            <!-- 线段 DE（立柱） -->
            <line id="scene1-segment-de" x1="340" y1="207.5" x2="340" y2="300" stroke="#000" stroke-width="2.5" />

            <!-- 点标记 -->
            <circle cx="180" cy="300" r="3" fill="#000" />
            <circle cx="500" cy="115" r="3" fill="#000" />
            <circle cx="500" cy="300" r="3" fill="#000" />
            <circle cx="340" cy="207.5" r="3" fill="#000" />
            <circle cx="340" cy="300" r="3" fill="#000" />

            <!-- 点标签（始终显示） -->
            <text id="scene1-label-a" x="155" y="318" class="scene1-label">A</text>
            <text id="scene1-label-b" x="500" y="95" class="scene1-label">B</text>
            <text id="scene1-label-c" x="530" y="318" class="scene1-label">C</text>
            <text id="scene1-label-d" x="310" y="110" class="scene1-label">D</text>
            <text id="scene1-label-e" x="340" y="355" class="scene1-label">E</text>

            <!-- 步骤1元素：已知条件 -->
            <g id="scene1-step1-group" display="none">
                <!-- 角度弧 ∠A -->
                <path id="scene1-angle-a" d="M 205,300 A 25,25 0 0,0 201.65,287.5" fill="none" stroke="#1565c0" stroke-width="2" />
                <!-- 中点标记 D（垂直于AB的短横线） -->
                <line x1="337" y1="202.3" x2="343" y2="212.7" stroke="#1565c0" stroke-width="2" />
                <!-- 标签 AB=8m -->
                <text x="400" y="95" class="scene1-value-blue">AB = 8m</text>
                <!-- 标签 30° -->
                <text x="215" y="340" class="scene1-value-blue">30°</text>
            </g>

            <!-- 步骤2元素：垂直与平行 -->
            <g id="scene1-step2-group" display="none">
                <!-- 直角符号 C -->
                <path d="M 488,300 L 500,300 L 500,288" fill="none" stroke="#c62828" stroke-width="2" />
                <!-- 直角符号 E -->
                <path d="M 328,300 L 340,300 L 340,288" fill="none" stroke="#c62828" stroke-width="2" />
                <!-- 平行指示虚线 -->
                <line x1="380" y1="220" x2="460" y2="220" stroke="#c62828" stroke-width="1.5" stroke-dasharray="5,5" />
                <!-- 标签 DE ∥ BC -->
                <text x="550" y="250" class="scene1-value-red">DE ∥ BC</text>
            </g>

            <!-- 步骤3元素：解法一（三角函数） -->
            <g id="scene1-step3-group" display="none">
                <!-- AD = 4m 标签 -->
                <text x="120" y="250" class="scene1-value-blue">AD = 4m</text>
            </g>

            <!-- 步骤4元素：解法二（中位线） -->
            <g id="scene1-step4-group" display="none">
                <!-- BC = 4m 标签 -->
                <text x="530" y="210" class="scene1-value-red">BC = 4m</text>
            </g>

            <!-- 步骤5元素：结论 -->
            <g id="scene1-step5-group" display="none">
                <!-- DE = 2m 标签 -->
                <text x="120" y="250" class="scene1-value-green">DE = 2m</text>
            </g>

            <!-- 公式文本行（步骤3/4/5显示） -->
            <text id="scene1-formula-line1" x="780" y="380" class="scene1-formula" display="none"></text>
            <text id="scene1-formula-line2" x="780" y="420" class="scene1-formula" display="none"></text>
        </svg>

        <!-- 选项按钮（HTML实现，步骤5显示） -->
        <div id="scene1-options-bar">
            <div class="scene1-option">A. 1m</div>
            <div class="scene1-option correct">B. 2m</div>
            <div class="scene1-option">C. 3m</div>
            <div class="scene1-option">D. 4m</div>
        </div>

        <div id="scene1-controls">
            <button id="scene1-prev-btn">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/6</span>
            <button id="scene1-next-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        let currentStep = 0;
        const totalSteps = 6;

        const prevBtn = document.getElementById('scene1-prev-btn');
        const nextBtn = document.getElementById('scene1-next-btn');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        const optionsBar = document.getElementById('scene1-options-bar');

        const segmentAB = document.getElementById('scene1-segment-ab');
        const segmentBC = document.getElementById('scene1-segment-bc');
        const segmentAC = document.getElementById('scene1-segment-ac');
        const segmentDE = document.getElementById('scene1-segment-de');
        const triABC = document.getElementById('scene1-tri-abc-fill');
        const triADE = document.getElementById('scene1-tri-ade-fill');
        const formulaLine1 = document.getElementById('scene1-formula-line1');
        const formulaLine2 = document.getElementById('scene1-formula-line2');

        const step1Group = document.getElementById('scene1-step1-group');
        const step2Group = document.getElementById('scene1-step2-group');
        const step3Group = document.getElementById('scene1-step3-group');
        const step4Group = document.getElementById('scene1-step4-group');
        const step5Group = document.getElementById('scene1-step5-group');

        function setDisplay(el, show) {
            if (!el) return;
            el.style.display = show ? 'block' : 'none';
            el.style.opacity = show ? '1' : '0';
        }

        function setStroke(el, color, width, dash) {
            if (!el) return;
            el.setAttribute('stroke', color);
            el.setAttribute('stroke-width', width);
            if (dash) {
                el.setAttribute('stroke-dasharray', dash);
            } else {
                el.removeAttribute('stroke-dasharray');
            }
        }

        function setOpacity(el, val) {
            if (!el) return;
            el.setAttribute('fill-opacity', val);
        }

        function updateScene() {
            // 更新按钮状态
            prevBtn.disabled = currentStep === 0;
            nextBtn.disabled = currentStep === totalSteps - 1;
            stepIndicator.textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;

            // 选项栏显隐
            if (currentStep === 5) {
                optionsBar.classList.add('active');
            } else {
                optionsBar.classList.remove('active');
            }

            // 重置所有线段为默认状态
            setStroke(segmentAB, '#000', '2.5', null);
            setStroke(segmentBC, '#000', '2.5', null);
            setStroke(segmentAC, '#000', '2.5', null);
            setStroke(segmentDE, '#000', '2.5', null);
            setOpacity(triABC, '0.2');
            setOpacity(triADE, '0');

            // 隐藏所有步骤组和公式
            setDisplay(step1Group, false);
            setDisplay(step2Group, false);
            setDisplay(step3Group, false);
            setDisplay(step4Group, false);
            setDisplay(step5Group, false);
            setDisplay(formulaLine1, false);
            setDisplay(formulaLine2, false);
            formulaLine1.textContent = '';
            formulaLine2.textContent = '';

            switch (currentStep) {
                case 0:
                    // 步骤0：屋架结构 - 基础显示
                    break;
                case 1:
                    // 步骤1：已知条件
                    setDisplay(step1Group, true);
                    setStroke(segmentAB, '#1565c0', '3', null);
                    break;
                case 2:
                    // 步骤2：垂直与平行
                    setDisplay(step1Group, true);
                    setDisplay(step2Group, true);
                    setStroke(segmentBC, '#c62828', '3', null);
                    setStroke(segmentDE, '#c62828', '3', null);
                    break;
                case 3:
                    // 步骤3：解法一（三角函数）
                    setDisplay(step1Group, true);
                    setDisplay(step2Group, true);
                    setDisplay(step3Group, true);
                    // BC 和 AC 淡化
                    setStroke(segmentBC, '#888', '2.5', '5,5');
                    setStroke(segmentAC, '#888', '2.5', '5,5');
                    // △ABC 填充隐藏
                    setOpacity(triABC, '0');
                    // △ADE 填充显示
                    setOpacity(triADE, '0.2');
                    // DE 保持红色高亮
                    setStroke(segmentDE, '#c62828', '3', null);
                    // AB 恢复黑色
                    setStroke(segmentAB, '#000', '2.5', null);
                    // 公式
                    setDisplay(formulaLine1, true);
                    setDisplay(formulaLine2, true);
                    formulaLine1.textContent = '在Rt△ADE中，AD = AB/2 = 4m';
                    formulaLine2.textContent = 'DE = AD·sin30° = 4 × (1/2) = 2m';
                    break;
                case 4:
                    // 步骤4：解法二（中位线）
                    setDisplay(step1Group, true);
                    setDisplay(step2Group, true);
                    setDisplay(step4Group, true);
                    // 恢复 BC 和 AC
                    setStroke(segmentBC, '#c62828', '3', null);
                    setStroke(segmentAC, '#000', '2.5', null);
                    // △ABC 填充恢复
                    setOpacity(triABC, '0.2');
                    // DE 淡化
                    setStroke(segmentDE, '#888', '2.5', '5,5');
                    // AB 恢复黑色
                    setStroke(segmentAB, '#000', '2.5', null);
                    // 公式
                    setDisplay(formulaLine1, true);
                    setDisplay(formulaLine2, true);
                    formulaLine1.textContent = '在Rt△ABC中，BC = AB·sin30° = 8 × (1/2) = 4m';
                    formulaLine2.textContent = 'DE = BC/2 = 2m（三角形中位线定理）';
                    break;
                case 5:
                    // 步骤5：结论
                    setDisplay(step1Group, true);
                    setDisplay(step2Group, true);
                    setDisplay(step5Group, true);
                    // 所有线段恢复黑色
                    setStroke(segmentAB, '#000', '2.5', null);
                    setStroke(segmentBC, '#000', '2.5', null);
                    setStroke(segmentAC, '#000', '2.5', null);
                    // DE 加粗绿色
                    setStroke(segmentDE, '#2e7d32', '3', null);
                    // △ABC 填充恢复
                    setOpacity(triABC, '0.2');
                    // 公式
                    setDisplay(formulaLine1, true);
                    setDisplay(formulaLine2, true);
                    formulaLine1.textContent = 'DE = 2m';
                    formulaLine2.textContent = '正确答案：B';
                    break;
            }
        }

        prevBtn.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        nextBtn.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateScene();
            }
        });

        // 初始化
        updateScene();
    })();
    </script>
</body>
</html>
