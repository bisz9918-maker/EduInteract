<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scene 2 - 滑动摩擦力与匀速直线运动</title>
<style>
body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei","SimHei",sans-serif; }
#scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
#scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; pointer-events: none; }
#scene2-controls button { padding: 6px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: #f5f5f5; pointer-events: auto; height: 32px; }
#scene2-controls button:hover { background: #e0e0e0; }
#scene2-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
#scene2-step-indicator { font-size: 12px; color: #666666; min-width: 60px; text-align: center; pointer-events: none; }
.scene2-step1 { opacity: 0; transition: opacity 0.3s ease; }
.scene2-step2 { opacity: 0; transition: opacity 0.3s ease; }
.scene2-step3 { opacity: 0; transition: opacity 0.3s ease; }
.scene2-step1.active { opacity: 1; }
.scene2-step2.active { opacity: 1; }
.scene2-step3.active { opacity: 1; }
.scene2-velocity-fade { transition: opacity 0.3s ease; }
#scene2-bubble { position: absolute; left: 260px; top: 170px; width: 280px; height: 36px; border-radius: 18px; background: #ffffff; border: 1.5px solid #c62828; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #c62828; z-index: 5; opacity: 0; transition: opacity 0.3s ease; pointer-events: none; }
#scene2-bubble.active { opacity: 1; }
#scene2-conclusion { position: absolute; left: 320px; top: 408px; width: 160px; height: 36px; border-radius: 18px; background: #e8f5e9; border: 1.5px solid #2e7d32; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: bold; color: #2e7d32; z-index: 5; opacity: 0; transition: opacity 0.3s ease; pointer-events: none; }
#scene2-conclusion.active { opacity: 1; }
</style>
</head>
<body>
<div id="scene2-container">
<svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500" style="position:absolute;top:0;left:0;">
<defs>
<marker id="scene2-arrow-black" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#000000"/></marker>
<marker id="scene2-arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#1565c0"/></marker>
<marker id="scene2-arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#c62828"/></marker>
<pattern id="scene2-hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#aaaaaa" stroke-width="1"/></pattern>
</defs>
<rect x="80" y="350" width="640" height="20" fill="url(#scene2-hatch)" opacity="0.6"/>
<line x1="80" y1="350" x2="720" y2="350" stroke="#000000" stroke-width="2"/>
<polygon points="200,250 300,250 280,350 220,350" fill="none" stroke="#000000" stroke-width="2"/>
<polygon points="204,270 296,270 280,350 220,350" fill="#e3f2fd" stroke="none"/>
<polygon points="520,250 580,250 600,350 500,350" fill="none" stroke="#000000" stroke-width="2"/>
<polygon points="516,270 584,270 600,350 500,350" fill="#e3f2fd" stroke="none"/>
<line x1="210" y1="235" x2="250" y2="235" stroke="#1565c0" stroke-width="2" marker-end="url(#scene2-arrow-blue)"/>
<text x="230" y="228" text-anchor="middle" fill="#1565c0" font-size="14" font-family="serif">v</text>
<line id="scene2-velocity-right-arrow" class="scene2-velocity-fade" x1="530" y1="235" x2="590" y2="235" stroke="#1565c0" stroke-width="2" marker-end="url(#scene2-arrow-blue)"/>
<text id="scene2-velocity-right-label" class="scene2-velocity-fade" x="560" y="228" text-anchor="middle" fill="#1565c0" font-size="14" font-family="serif">2v</text>
<line x1="300" y1="300" x2="380" y2="300" stroke="#1565c0" stroke-width="2" marker-end="url(#scene2-arrow-blue)"/>
<text x="340" y="290" text-anchor="middle" fill="#1565c0" font-size="14" font-family="serif">F₁</text>
<line x1="600" y1="300" x2="680" y2="300" stroke="#1565c0" stroke-width="2" marker-end="url(#scene2-arrow-blue)"/>
<text x="640" y="290" text-anchor="middle" fill="#1565c0" font-size="14" font-family="serif">F₂</text>
<g id="scene2-step1-group" class="scene2-step1">
<line x1="250" y1="300" x2="250" y2="360" stroke="#000000" stroke-width="2" marker-end="url(#scene2-arrow-black)"/>
<text x="180" y="330" text-anchor="middle" fill="#000000" font-size="14" font-family="serif">G₁</text>
<line x1="550" y1="300" x2="550" y2="360" stroke="#000000" stroke-width="2" marker-end="url(#scene2-arrow-black)"/>
<text x="620" y="330" text-anchor="middle" fill="#000000" font-size="14" font-family="serif">G₂</text>
<line x1="250" y1="350" x2="250" y2="290" stroke="#000000" stroke-width="2" marker-end="url(#scene2-arrow-black)"/>
<text x="310" y="325" text-anchor="start" fill="#000000" font-size="14" font-family="serif">F_N₁</text>
<line x1="550" y1="350" x2="550" y2="290" stroke="#000000" stroke-width="2" marker-end="url(#scene2-arrow-black)"/>
<text x="490" y="325" text-anchor="end" fill="#000000" font-size="14" font-family="serif">F_N₂</text>
<text x="250" y="385" text-anchor="middle" fill="#000000" font-size="14" font-family="serif">G₁ = G₂</text>
<text x="550" y="385" text-anchor="middle" fill="#000000" font-size="14" font-family="serif">F_N₁ = F_N₂</text>
</g>
<g id="scene2-step2-group" class="scene2-step2">
<line x1="220" y1="300" x2="140" y2="300" stroke="#c62828" stroke-width="2" marker-end="url(#scene2-arrow-red)"/>
<text x="180" y="290" text-anchor="middle" fill="#c62828" font-size="14" font-family="serif">f₁</text>
<line x1="520" y1="300" x2="440" y2="300" stroke="#c62828" stroke-width="2" marker-end="url(#scene2-arrow-red)"/>
<text x="480" y="290" text-anchor="middle" fill="#c62828" font-size="14" font-family="serif">f₂</text>
<text x="250" y="135" text-anchor="middle" fill="#c62828" font-size="14" font-family="serif">f₁ = μF_N₁</text>
<text x="550" y="135" text-anchor="middle" fill="#c62828" font-size="14" font-family="serif">f₂ = μF_N₂</text>
<text x="400" y="160" text-anchor="middle" fill="#c62828" font-size="16" font-weight="bold" font-family="serif">f₁ = f₂</text>
</g>
<g id="scene2-step3-group" class="scene2-step3">
<text x="250" y="405" text-anchor="middle" fill="#2e7d32" font-size="16" font-family="serif">F₁ = f₁</text>
<text x="550" y="405" text-anchor="middle" fill="#2e7d32" font-size="16" font-family="serif">F₂ = f₂</text>
</g>
</svg>
<div id="scene2-bubble">滑动摩擦力与运动速度无关</div>
<div id="scene2-conclusion">② F₁ = F₂ ✓</div>
<div id="scene2-controls">
<button id="scene2-btn-prev">◀ 上一步</button>
<div id="scene2-step-indicator">步骤 1/4</div>
<button id="scene2-btn-next">下一步 ▶</button>
</div>
</div>
<script>
(function(){
var currentStep=0;
var totalSteps=4;
var btnPrev=document.getElementById('scene2-btn-prev');
var btnNext=document.getElementById('scene2-btn-next');
var indicator=document.getElementById('scene2-step-indicator');
var step1Group=document.getElementById('scene2-step1-group');
var step2Group=document.getElementById('scene2-step2-group');
var step3Group=document.getElementById('scene2-step3-group');
var bubble=document.getElementById('scene2-bubble');
var conclusion=document.getElementById('scene2-conclusion');
var velocityRightArrow=document.getElementById('scene2-velocity-right-arrow');
var velocityRightLabel=document.getElementById('scene2-velocity-right-label');
function showStep(step){
currentStep=step;
btnPrev.disabled=(currentStep===0);
btnNext.disabled=(currentStep===totalSteps-1);
indicator.textContent='步骤 '+(currentStep+1)+'/'+totalSteps;
if(currentStep>=1){step1Group.classList.add('active');}else{step1Group.classList.remove('active');}
if(currentStep>=2){step2Group.classList.add('active');bubble.classList.add('active');}else{step2Group.classList.remove('active');bubble.classList.remove('active');}
if(currentStep>=3){step3Group.classList.add('active');conclusion.classList.add('active');}else{step3Group.classList.remove('active');conclusion.classList.remove('active');}
if(currentStep>=2){velocityRightArrow.style.opacity='0.4';velocityRightLabel.style.opacity='0.4';}else{velocityRightArrow.style.opacity='1';velocityRightLabel.style.opacity='1';}
}
btnPrev.addEventListener('click',function(){if(currentStep>0)showStep(currentStep-1);});
btnNext.addEventListener('click',function(){if(currentStep<totalSteps-1)showStep(currentStep+1);});
showStep(0);
})();
</script>
</body>
</html>
