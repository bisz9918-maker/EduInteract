<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 1 - 三角形旋转角度推导</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 16px; z-index: 10; }
        #scene1-controls button {
            padding: 8px 20px; font-size: 14px; cursor: pointer;
            border: 1px solid #ccc; border-radius: 4px; background: #f5f5f5;
            transition: all 0.2s ease;
        }
        #scene1-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene1-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 14px; color: #666; min-width: 80px; text-align: center; }

        /* 步骤分组显隐控制：同时控制 opacity 和 display */
        .scene1-step-group {
            opacity: 0;
            display: none;
            transition: opacity 0.4s ease-in-out;
            pointer-events: none;
        }
        .scene1-step-group.visible {
            opacity: 1;
            display: block;
            pointer-events: auto;
        }

        /* 始终显示的元素 */
        .scene1-always { opacity: 1; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" viewBox="0 0 800 500">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene1-arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#2e7d32"/>
                </marker>
            </defs>

            <!-- ==================== 始终显示的基础图形 ==================== -->
            <!-- △OAB 蓝色 -->
            <g class="scene1-always">
                <line x1="200" y1="400" x2="417" y2="275" stroke="#1565c0" stroke-width="2.5"/>
                <line x1="417" y1="275" x2="440" y2="400" stroke="#1565c0" stroke-width="2.5"/>
                <line x1="200" y1="400" x2="440" y2="400" stroke="#1565c0" stroke-width="2.5"/>
            </g>
            <!-- △OCD 红色 -->
            <g class="scene1-always">
                <line x1="200" y1="400" x2="157" y2="154" stroke="#c62828" stroke-width="2.5"/>
                <line x1="157" y1="154" x2="282" y2="175" stroke="#c62828" stroke-width="2.5"/>
                <line x1="200" y1="400" x2="282" y2="175" stroke="#c62828" stroke-width="2.5"/>
            </g>
            <!-- 顶点圆点 -->
            <g class="scene1-always">
                <circle cx="200" cy="400" r="3" fill="#000"/>
                <circle cx="417" cy="275" r="3" fill="#000"/>
                <circle cx="440" cy="400" r="3" fill="#000"/>
                <circle cx="157" cy="154" r="3" fill="#000"/>
                <circle cx="282" cy="175" r="3" fill="#000"/>
            </g>
            <!-- 顶点标签 -->
            <g class="scene1-always">
                <text x="175" y="420" font-size="14" fill="#000" font-family="sans-serif">O</text>
                <text x="480" y="250" font-size="14" fill="#000" font-family="sans-serif">A</text>
                <text x="460" y="415" font-size="14" fill="#000" font-family="sans-serif">B</text>
                <text x="125" y="140" font-size="14" fill="#000" font-family="sans-serif">C</text>
                <text x="310" y="145" font-size="14" fill="#000" font-family="sans-serif">D</text>
            </g>

            <!-- 动态步骤说明文本（单一元素，JS控制内容与样式） -->
            <text id="scene1-step-text" x="20" y="80" font-size="14" fill="#333" font-family="sans-serif">已知：∠A=100°，∠D=50°，旋转角=70°</text>

            <!-- ==================== 步骤0：初始条件 ==================== -->
            <g id="scene1-step-0" class="scene1-step-group visible">
                <!-- ∠A 弧线 (圆心A, 半径20px) -->
                <path d="M 437,290 A 20,20 0 0,0 430,310" fill="none" stroke="#1565c0" stroke-width="1.5"/>
                <!-- ∠D 弧线 (圆心D, 半径20px) -->
                <path d="M 262,175 A 20,20 0 0,1 282,155" fill="none" stroke="#c62828" stroke-width="1.5"/>
                <!-- 旋转箭头1: OA→OC, 圆心O, 半径130px -->
                <path d="M 312,335 A 130,130 0 0,0 177,272" fill="none" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#scene1-arrow-green)"/>
                <!-- 旋转箭头2: OB→OD, 圆心O, 半径150px -->
                <path d="M 350,400 A 150,150 0 0,0 251,259" fill="none" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#scene1-arrow-green)"/>
                <!-- 标签 -->
                <text x="450" y="320" font-size="14" fill="#1565c0" font-family="sans-serif">∠A=100°</text>
                <text x="520" y="260" font-size="14" fill="#c62828" font-family="sans-serif">∠D=50°</text>
            </g>

            <!-- ==================== 步骤1：旋转角与对应边 ==================== -->
            <g id="scene1-step-1" class="scene1-step-group">
                <!-- ∠AOC 弧线 (圆心O, 半径90px) -->
                <path d="M 277,355 A 90,90 0 0,0 184,311" fill="none" stroke="#2e7d32" stroke-width="1.5"/>
                <!-- ∠BOD 弧线 (圆心O, 半径75px) -->
                <path d="M 275,400 A 75,75 0 0,0 225,330" fill="none" stroke="#2e7d32" stroke-width="1.5"/>
                <!-- ∠AOC 扇形环填充 (半径80~110px) -->
                <path d="M 277,355 A 90,90 0 0,0 184,311 L 157,288 A 120,120 0 0,1 295,347 Z" fill="#2e7d32" fill-opacity="0.15"/>
                <!-- ∠BOD 扇形环填充 (半径60~80px) -->
                <path d="M 260,400 A 60,60 0 0,0 220,344 L 200,320 A 85,85 0 0,1 275,400 Z" fill="#2e7d32" fill-opacity="0.15"/>
                <!-- 等长 tick: OA -->
                <line x1="241" y1="371" x2="245" y2="379" stroke="#1565c0" stroke-width="1.5"/>
                <!-- 等长 tick: OC -->
                <line x1="187" y1="349" x2="195" y2="352" stroke="#c62828" stroke-width="1.5"/>
                <!-- 等长 tick: OB -->
                <line x1="260" y1="396" x2="260" y2="404" stroke="#1565c0" stroke-width="1.5"/>
                <!-- 等长 tick: OD -->
                <line x1="217" y1="342" x2="224" y2="345" stroke="#c62828" stroke-width="1.5"/>
                <!-- 标签 -->
                <text x="90" y="310" font-size="14" fill="#2e7d32" font-family="sans-serif">∠AOC=70°</text>
                <text x="370" y="435" font-size="14" fill="#2e7d32" font-family="sans-serif">∠BOD=70°</text>
            </g>

            <!-- ==================== 步骤2：全等性质 ==================== -->
            <g id="scene1-step-2" class="scene1-step-group">
                <!-- ∠B 弧线 (圆心B, 半径20px) -->
                <path d="M 420,390 A 20,20 0 0,0 440,380" fill="none" stroke="#1565c0" stroke-width="1.5"/>
                <!-- 对应顶点虚线 A→C -->
                <line x1="417" y1="275" x2="157" y2="154" stroke="#999" stroke-width="1" stroke-dasharray="4,4" opacity="0.6"/>
                <!-- 对应顶点虚线 B→D -->
                <line x1="440" y1="400" x2="282" y2="175" stroke="#999" stroke-width="1" stroke-dasharray="4,4" opacity="0.6"/>
                <!-- 标签 -->
                <text x="480" y="380" font-size="14" fill="#1565c0" font-family="sans-serif">∠B=50°</text>
            </g>

            <!-- ==================== 步骤3：计算∠AOB ==================== -->
            <g id="scene1-step-3" class="scene1-step-group">
                <!-- ∠AOB 弧线 (圆心O, 半径40px) -->
                <path d="M 240,400 A 40,40 0 0,0 234,360" fill="none" stroke="#1565c0" stroke-width="1.5"/>
                <!-- ∠AOB 扇形填充 (半径0~45px) -->
                <path d="M 200,400 L 240,400 A 40,40 0 0,0 239,360 Z" fill="#1565c0" fill-opacity="0.2"/>
                <!-- 标签 -->
                <text x="250" y="350" font-size="14" fill="#1565c0" font-family="sans-serif">∠AOB=30°</text>
            </g>

            <!-- ==================== 步骤4：计算∠AOD与答案 ==================== -->
            <g id="scene1-step-4" class="scene1-step-group">
                <!-- ∠AOD 弧线 (圆心O, 半径55px) -->
                <path d="M 247,372 A 55,55 0 0,0 218,348" fill="none" stroke="#c62828" stroke-width="1.5"/>
                <!-- ∠AOD 扇形填充 (半径0~55px) -->
                <path d="M 200,400 L 247,372 A 55,55 0 0,0 218,348 Z" fill="#c62828" fill-opacity="0.2"/>
                <!-- 标签 -->
                <text x="80" y="250" font-size="14" fill="#c62828" font-family="sans-serif">∠AOD=40°</text>
                <!-- 答案 -->
                <text x="620" y="420" font-size="20" fill="#c62828" font-family="sans-serif" font-weight="bold">C. 40°</text>
            </g>
        </svg>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/5</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        var currentStep = 0;
        var totalSteps = 5;
        var btnPrev = document.getElementById('scene1-btn-prev');
        var btnNext = document.getElementById('scene1-btn-next');
        var indicator = document.getElementById('scene1-step-indicator');
        var stepText = document.getElementById('scene1-step-text');

        var stepTexts = [
            { text: '已知：∠A=100°，∠D=50°，旋转角=70°', color: '#333', fontSize: '14', fontWeight: 'normal' },
            { text: '旋转角相等：∠AOC = ∠BOD = 70°', color: '#2e7d32', fontSize: '14', fontWeight: 'normal' },
            { text: '△OAB ≌ △OCD，对应角相等', color: '#333', fontSize: '14', fontWeight: 'normal' },
            { text: '在△OAB中：∠AOB = 180° − 100° − 50° = 30°', color: '#1565c0', fontSize: '16', fontWeight: 'bold' },
            { text: '∠AOD = ∠BOD − ∠AOB = 70° − 30° = 40°', color: '#c62828', fontSize: '16', fontWeight: 'bold' }
        ];

        function updateStep(step) {
            currentStep = step;
            // 更新步骤指示器
            indicator.textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;
            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps - 1);
            // 更新各步骤分组显隐：同时控制 display 和 opacity
            for (var i = 0; i < totalSteps; i++) {
                var group = document.getElementById('scene1-step-' + i);
                if (group) {
                    if (i <= currentStep) {
                        group.style.display = 'block';
                        // 强制重排后添加 visible 类以触发过渡
                        requestAnimationFrame(function(g) {
                            return function() { g.classList.add('visible'); };
                        }(group));
                    } else {
                        group.classList.remove('visible');
                        group.style.display = 'none';
                    }
                }
            }
            // 更新步骤说明文本
            var info = stepTexts[currentStep];
            stepText.textContent = info.text;
            stepText.setAttribute('fill', info.color);
            stepText.setAttribute('font-size', info.fontSize);
            stepText.setAttribute('font-weight', info.fontWeight);
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                updateStep(currentStep - 1);
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                updateStep(currentStep + 1);
            }
        });

        // 初始化
        updateStep(0);
    })();
    </script>
</body>
</html>
