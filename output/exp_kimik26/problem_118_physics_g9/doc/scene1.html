<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电路动态分析 - 场景1</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            padding: 6px 16px; font-size: 14px; cursor: pointer;
            border: 1px solid #ccc; border-radius: 4px; background: #f5f5f5;
            min-width: 80px; height: 32px;
        }
        #scene1-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene1-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 14px; color: #333; min-width: 90px; text-align: center; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene1-arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#1565c0"/>
                </marker>
                <marker id="scene1-arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#c62828"/>
                </marker>
                <marker id="scene1-arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#2e7d32"/>
                </marker>
            </defs>

            <!-- ========== 基础电路元件（步骤0始终可见） ========== -->
            <!-- 导线框架 -->
            <line id="scene1-wire-left" x1="250" y1="150" x2="250" y2="300" stroke="#000000" stroke-width="2"/>
            <line id="scene1-wire-top" x1="250" y1="150" x2="550" y2="150" stroke="#000000" stroke-width="2"/>
            <line id="scene1-wire-right" x1="550" y1="150" x2="550" y2="300" stroke="#000000" stroke-width="2"/>
            <line id="scene1-wire-bottom" x1="250" y1="300" x2="550" y2="300" stroke="#000000" stroke-width="2"/>

            <!-- 电源 -->
            <line id="scene1-power-pos" x1="360" y1="290" x2="360" y2="310" stroke="#000000" stroke-width="2"/>
            <line id="scene1-power-neg" x1="380" y1="295" x2="380" y2="305" stroke="#000000" stroke-width="2"/>
            <text id="scene1-label-plus" x="360" y="280" text-anchor="middle" font-size="14" fill="#000000">+</text>
            <text id="scene1-label-minus" x="380" y="280" text-anchor="middle" font-size="14" fill="#000000">−</text>

            <!-- 开关S -->
            <g id="scene1-switch-group">
                <circle cx="480" cy="300" r="3" fill="#000000"/>
                <line x1="480" y1="300" x2="490" y2="290" stroke="#000000" stroke-width="2"/>
                <line x1="490" y1="300" x2="490" y2="290" stroke="#000000" stroke-width="2"/>
            </g>
            <text id="scene1-label-s" x="480" y="280" text-anchor="middle" font-size="14" fill="#000000">S</text>

            <!-- 电阻R₁ -->
            <rect id="scene1-resistor-r1" x="240" y="200" width="20" height="60" fill="none" stroke="#000000" stroke-width="2"/>
            <text id="scene1-label-r1" x="220" y="235" text-anchor="middle" font-size="14" fill="#000000">R₁</text>

            <!-- 电阻R₂ -->
            <rect id="scene1-resistor-r2" x="320" y="140" width="180" height="20" fill="none" stroke="#000000" stroke-width="2"/>
            <text id="scene1-label-r2" x="410" y="95" text-anchor="middle" font-size="14" fill="#000000">R₂</text>

            <!-- 滑片P（初始位置） -->
            <g id="scene1-slider-p">
                <line x1="430" y1="140" x2="430" y2="130" stroke="#000000" stroke-width="2"/>
                <polygon points="430,130 425,120 435,120" fill="#000000"/>
            </g>
            <text id="scene1-label-p" x="460" y="95" text-anchor="middle" font-size="14" fill="#000000">P</text>

            <!-- 电流表A -->
            <circle id="scene1-ammeter-a" cx="550" cy="220" r="15" fill="none" stroke="#000000" stroke-width="2"/>
            <text id="scene1-label-a" x="550" y="245" text-anchor="middle" font-size="14" fill="#000000">A</text>

            <!-- 电压表V₁ -->
            <circle id="scene1-voltmeter-v1" cx="300" cy="90" r="15" fill="none" stroke="#000000" stroke-width="2"/>
            <text id="scene1-label-v1" x="275" y="95" text-anchor="middle" font-size="14" fill="#000000">V₁</text>
            <!-- V₁接线柱 -->
            <line id="scene1-v1-left-wire" x1="300" y1="105" x2="250" y2="150" stroke="#000000" stroke-width="1"/>
            <line id="scene1-v1-right-wire" x1="300" y1="105" x2="430" y2="150" stroke="#000000" stroke-width="1"/>

            <!-- 电压表V₂ -->
            <circle id="scene1-voltmeter-v2" cx="400" cy="360" r="15" fill="none" stroke="#000000" stroke-width="2"/>
            <text id="scene1-label-v2" x="400" y="385" text-anchor="middle" font-size="14" fill="#000000">V₂</text>
            <!-- V₂接线柱 -->
            <line id="scene1-v2-left-wire" x1="400" y1="345" x2="360" y2="300" stroke="#000000" stroke-width="1"/>
            <line id="scene1-v2-right-wire" x1="400" y1="345" x2="380" y2="300" stroke="#000000" stroke-width="1"/>

            <!-- ========== 步骤1：电流路径高亮 ========== -->
            <g id="scene1-step1-group" style="display:none; opacity:0;">
                <!-- 电流路径：底部左段 (360,300)→(250,300) -->
                <line x1="360" y1="300" x2="250" y2="300" stroke="#1565c0" stroke-width="3"/>
                <polygon points="305,296 305,304 297,300" fill="#1565c0"/>
                <!-- 左侧 (250,300)→(250,150) -->
                <line x1="250" y1="300" x2="250" y2="150" stroke="#1565c0" stroke-width="3"/>
                <polygon points="246,225 254,225 250,217" fill="#1565c0"/>
                <!-- 顶部 (250,150)→(550,150) -->
                <line x1="250" y1="150" x2="550" y2="150" stroke="#1565c0" stroke-width="3"/>
                <polygon points="400,146 400,154 408,150" fill="#1565c0"/>
                <!-- 右侧 (550,150)→(550,300) -->
                <line x1="550" y1="150" x2="550" y2="300" stroke="#1565c0" stroke-width="3"/>
                <polygon points="546,225 554,225 550,233" fill="#1565c0"/>
                <!-- 底部右段 (550,300)→(380,300) -->
                <line x1="550" y1="300" x2="380" y2="300" stroke="#1565c0" stroke-width="3"/>
                <polygon points="465,296 465,304 457,300" fill="#1565c0"/>
                <!-- 标注 -->
                <text x="580" y="250" font-size="14" fill="#1565c0">测总电流I</text>
            </g>

            <!-- ========== 步骤2：电表测量对象标注 ========== -->
            <g id="scene1-step2-group" style="display:none; opacity:0;">
                <!-- V₁测量范围：R₂接入部分红色填充 -->
                <rect id="scene1-step2-u1-fill" x="320" y="140" width="110" height="20" fill="#c62828" fill-opacity="0.15" stroke="none"/>
                <text id="scene1-step2-u1-label" x="375" y="100" text-anchor="middle" font-size="14" fill="#c62828">U₁</text>
                <!-- V₂测量范围：电源外围绿色虚线框 -->
                <rect id="scene1-step2-u2-frame" x="350" y="280" width="40" height="40" fill="none" stroke="#2e7d32" stroke-width="1" stroke-dasharray="4,2"/>
                <text id="scene1-step2-u2-label" x="370" y="380" text-anchor="middle" font-size="14" fill="#2e7d32">U₂</text>
            </g>

            <!-- ========== 步骤3：滑片P左移 ========== -->
            <g id="scene1-step3-group" style="display:none; opacity:0;">
                <!-- 接入电阻高亮（蓝色填充） -->
                <rect id="scene1-step3-access-fill" x="320" y="140" width="40" height="20" fill="#1565c0" fill-opacity="0.2" stroke="none"/>
                <!-- 未接入电阻导线（灰色虚线） -->
                <line id="scene1-step3-unused-wire" x1="360" y1="150" x2="500" y2="150" stroke="#888888" stroke-width="2" stroke-dasharray="5,3"/>
                <!-- 滑片P新位置 -->
                <g id="scene1-step3-slider-p">
                    <line x1="360" y1="140" x2="360" y2="130" stroke="#000000" stroke-width="2"/>
                    <polygon points="360,130 355,120 365,120" fill="#000000"/>
                </g>
                <!-- 标注 -->
                <text id="scene1-step3-label-access" x="180" y="95" text-anchor="middle" font-size="14" fill="#1565c0">R₂接入↓</text>
            </g>

            <!-- ========== 步骤4：变化趋势 ========== -->
            <g id="scene1-step4-group" style="display:none; opacity:0;">
                <!-- I↑ 蓝色箭头 -->
                <line x1="580" y1="210" x2="580" y2="185" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-blue)"/>
                <text x="580" y="180" text-anchor="middle" font-size="14" fill="#1565c0">I↑</text>
                <!-- U₁↓ 红色箭头 -->
                <line x1="230" y1="75" x2="230" y2="105" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrow-red)"/>
                <text x="100" y="70" text-anchor="middle" font-size="14" fill="#c62828">U₁↓</text>
                <!-- U₂不变 绿色横线 -->
                <line x1="440" y1="360" x2="470" y2="360" stroke="#2e7d32" stroke-width="2"/>
                <text x="455" y="355" text-anchor="middle" font-size="14" fill="#2e7d32">U₂不变</text>
            </g>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1 / 5</span>
            <button id="scene1-btn-next">下一步 ▶</button>
            <button id="scene1-btn-reset">重置</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        let currentStep = 0;
        const totalSteps = 5;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const btnReset = document.getElementById('scene1-btn-reset');
        const stepIndicator = document.getElementById('scene1-step-indicator');

        const step1Group = document.getElementById('scene1-step1-group');
        const step2Group = document.getElementById('scene1-step2-group');
        const step3Group = document.getElementById('scene1-step3-group');
        const step4Group = document.getElementById('scene1-step4-group');

        const sliderP = document.getElementById('scene1-slider-p');
        const labelP = document.getElementById('scene1-label-p');
        const v1RightWire = document.getElementById('scene1-v1-right-wire');
        const step2U1Fill = document.getElementById('scene1-step2-u1-fill');

        function updateUI() {
            stepIndicator.textContent = '步骤 ' + (currentStep + 1) + ' / ' + totalSteps;
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps - 1;

            // 步骤1：电流路径
            if (currentStep >= 1) {
                step1Group.style.display = 'block';
                step1Group.style.opacity = '1';
            } else {
                step1Group.style.display = 'none';
                step1Group.style.opacity = '0';
            }

            // 步骤2：电表测量标注
            if (currentStep >= 2) {
                step2Group.style.display = 'block';
                step2Group.style.opacity = '1';
            } else {
                step2Group.style.display = 'none';
                step2Group.style.opacity = '0';
            }

            // 步骤3：滑片移动
            if (currentStep >= 3) {
                step3Group.style.display = 'block';
                step3Group.style.opacity = '1';
                // 隐藏初始滑片，显示移动后的滑片
                sliderP.style.display = 'none';
                labelP.setAttribute('x', '420');
                labelP.setAttribute('y', '95');
                // 更新V₁右接线柱
                v1RightWire.setAttribute('x2', '360');
                // 步骤2的U₁填充同步缩短
                if (step2U1Fill) {
                    step2U1Fill.setAttribute('width', '40');
                }
            } else {
                step3Group.style.display = 'none';
                step3Group.style.opacity = '0';
                sliderP.style.display = 'block';
                labelP.setAttribute('x', '460');
                labelP.setAttribute('y', '95');
                v1RightWire.setAttribute('x2', '430');
                if (step2U1Fill) {
                    step2U1Fill.setAttribute('width', '110');
                }
            }

            // 步骤4：变化趋势
            if (currentStep >= 4) {
                step4Group.style.display = 'block';
                step4Group.style.opacity = '1';
            } else {
                step4Group.style.display = 'none';
                step4Group.style.opacity = '0';
            }
        }

        function nextStep() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateUI();
            }
        }

        function prevStep() {
            if (currentStep > 0) {
                currentStep--;
                updateUI();
            }
        }

        function resetStep() {
            currentStep = 0;
            updateUI();
        }

        btnPrev.addEventListener('click', prevStep);
        btnNext.addEventListener('click', nextStep);
        btnReset.addEventListener('click', resetStep);

        // 初始状态
        updateUI();
    })();
    </script>
</body>
</html>
