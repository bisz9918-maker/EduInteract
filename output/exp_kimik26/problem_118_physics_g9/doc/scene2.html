<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 电路动态分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "SimHei", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene2-btn { padding: 6px 16px; font-size: 14px; cursor: pointer; background: #f0f0f0; border: 1px solid #999999; border-radius: 4px; color: #333333; font-family: inherit; }
        .scene2-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .scene2-step-indicator { padding: 6px 16px; font-size: 14px; color: #333333; background: #f8f8f8; border: 1px solid #cccccc; border-radius: 4px; min-width: 100px; text-align: center; font-family: inherit; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" viewBox="0 0 800 500">
            <!-- 电路图部分 -->
            <g id="scene2-circuit-group">
                <!-- 导线回路 -->
                <!-- 上边导线（R2两侧） -->
                <line x1="80" y1="140" x2="115" y2="140" stroke="#000000" stroke-width="2"/>
                <line x1="185" y1="140" x2="220" y2="140" stroke="#000000" stroke-width="2"/>
                <!-- 右边导线（A上下） -->
                <line x1="220" y1="140" x2="220" y2="202" stroke="#000000" stroke-width="2"/>
                <line x1="220" y1="238" x2="220" y2="300" stroke="#000000" stroke-width="2"/>
                <!-- 下边导线（电源两侧） -->
                <line x1="220" y1="300" x2="170" y2="300" stroke="#000000" stroke-width="2"/>
                <line x1="130" y1="300" x2="80" y2="300" stroke="#000000" stroke-width="2"/>
                <!-- 左边导线（R1上下） -->
                <line x1="80" y1="140" x2="80" y2="195" stroke="#000000" stroke-width="2"/>
                <line x1="80" y1="245" x2="80" y2="300" stroke="#000000" stroke-width="2"/>
                
                <!-- R1 电阻 -->
                <rect x="72" y="195" width="16" height="50" fill="none" stroke="#000000" stroke-width="2"/>
                <text x="45" y="225" font-size="16" fill="#000000" text-anchor="middle">R₁</text>
                
                <!-- R2 滑动变阻器 -->
                <rect x="115" y="132" width="70" height="16" fill="none" stroke="#000000" stroke-width="2"/>
                <!-- 滑片 P -->
                <line x1="150" y1="132" x2="150" y2="118" stroke="#000000" stroke-width="1.5"/>
                <polygon points="150,118 146,110 154,110" fill="#000000"/>
                <text x="210" y="112" font-size="12" fill="#000000">P</text>
                <text x="150" y="168" font-size="13" fill="#000000" text-anchor="middle">R₂</text>
                
                <!-- 电流表 A -->
                <circle cx="220" cy="220" r="18" fill="none" stroke="#000000" stroke-width="2"/>
                <text x="248" y="225" font-size="14" fill="#000000">A</text>
                <text x="255" y="245" font-size="16" fill="#000000">I</text>
                
                <!-- 电源（电池符号） -->
                <!-- 连接导线 -->
                <line x1="170" y1="300" x2="155" y2="300" stroke="#000000" stroke-width="2"/>
                <line x1="130" y1="300" x2="145" y2="300" stroke="#000000" stroke-width="2"/>
                <!-- 正极（长线） -->
                <line x1="155" y1="290" x2="155" y2="310" stroke="#000000" stroke-width="3"/>
                <!-- 负极（短线） -->
                <line x1="145" y1="295" x2="145" y2="305" stroke="#000000" stroke-width="2"/>
                
                <!-- 开关 S -->
                <circle cx="190" cy="300" r="3" fill="none" stroke="#000000" stroke-width="1.5"/>
                <line x1="190" y1="300" x2="198" y2="292" stroke="#000000" stroke-width="2"/>
                <circle cx="198" cy="300" r="3" fill="none" stroke="#000000" stroke-width="1.5"/>
                <text x="202" y="290" font-size="12" fill="#000000">S</text>
                
                <!-- V1 电压表及引线 -->
                <polyline points="100,140 100,100 200,100 200,140" fill="none" stroke="#000000" stroke-width="1.5"/>
                <circle cx="150" cy="100" r="14" fill="none" stroke="#000000" stroke-width="2"/>
                <text x="150" y="78" font-size="12" fill="#000000" text-anchor="middle">V₁</text>
                <text x="185" y="55" font-size="16" fill="#000000">U₁</text>
                
                <!-- V2 电压表及引线 -->
                <polyline points="80,300 80,350 220,350 220,300" fill="none" stroke="#000000" stroke-width="1.5"/>
                <circle cx="150" cy="350" r="14" fill="none" stroke="#000000" stroke-width="2"/>
                <text x="150" y="382" font-size="12" fill="#000000" text-anchor="middle">V₂</text>
                <text x="185" y="400" font-size="16" fill="#000000">U₂</text>
            </g>
            
            <!-- 高亮框 -->
            <rect id="scene2-highlight-r1" x="65" y="188" width="30" height="64" fill="#2e7d32" opacity="0.15" style="display:none"/>
            <rect id="scene2-highlight-r2" x="110" y="128" width="80" height="24" fill="#1565c0" opacity="0.15" style="display:none"/>
            
            <!-- 右侧内容区 -->
            <!-- 步骤0：初始状态 -->
            <g id="scene2-step-0" style="display:block">
                <text x="480" y="80" font-size="20" fill="#333333" text-anchor="middle" font-weight="bold">串联电路基本关系</text>
                <line x1="320" y1="100" x2="760" y2="100" stroke="#cccccc" stroke-width="1"/>
                <text x="480" y="140" font-size="16" fill="#333333" text-anchor="middle">U₂ = I(R₁ + R₂接入)</text>
                <text x="480" y="180" font-size="16" fill="#333333" text-anchor="middle">U₁ = I · R₂接入</text>
                <text x="480" y="220" font-size="16" fill="#333333" text-anchor="middle">U₂ − U₁ = I · R₁</text>
                <text x="480" y="280" font-size="16" fill="#1565c0" text-anchor="middle" font-weight="bold">滑片 P 左移 → R₂接入 减小</text>
            </g>
            
            <!-- 步骤1：选项A -->
            <g id="scene2-step-1" style="display:none">
                <text x="480" y="80" font-size="20" fill="#333333" text-anchor="middle" font-weight="bold">选项 A：U₂/I 的变化</text>
                <line x1="320" y1="100" x2="760" y2="100" stroke="#cccccc" stroke-width="1"/>
                <text x="480" y="140" font-size="18" fill="#333333" text-anchor="middle">U₂/I = R₁ + R₂接入</text>
                <text x="480" y="190" font-size="16" fill="#333333" text-anchor="middle">电源电压 U₂ 恒定</text>
                <text x="480" y="230" font-size="16" fill="#333333" text-anchor="middle">R₂接入 减小</text>
                <text x="480" y="280" font-size="16" fill="#333333" text-anchor="middle">R₂接入 ↓ → U₂/I ↓</text>
                <text x="480" y="340" font-size="22" fill="#2e7d32" text-anchor="middle" font-weight="bold">√ 正确</text>
            </g>
            
            <!-- 步骤2：选项B -->
            <g id="scene2-step-2" style="display:none">
                <text x="480" y="80" font-size="20" fill="#333333" text-anchor="middle" font-weight="bold">选项 B：(U₂−U₁)/I 的变化</text>
                <line x1="320" y1="100" x2="760" y2="100" stroke="#cccccc" stroke-width="1"/>
                <text x="480" y="140" font-size="18" fill="#333333" text-anchor="middle">(U₂−U₁)/I = U_R₁/I = R₁</text>
                <text x="480" y="190" font-size="16" fill="#333333" text-anchor="middle">U₂−U₁ 为 R₁ 两端电压</text>
                <text x="480" y="230" font-size="16" fill="#333333" text-anchor="middle">R₁ 是定值电阻</text>
                <text x="480" y="280" font-size="16" fill="#333333" text-anchor="middle">比值 = R₁，保持不变</text>
                <text x="480" y="340" font-size="22" fill="#2e7d32" text-anchor="middle" font-weight="bold">√ 正确，比值 = R₁ 不变</text>
            </g>
            
            <!-- 步骤3：选项C -->
            <g id="scene2-step-3" style="display:none">
                <text x="480" y="80" font-size="20" fill="#333333" text-anchor="middle" font-weight="bold">选项 C：ΔU₁/ΔI 的变化</text>
                <line x1="320" y1="100" x2="760" y2="100" stroke="#cccccc" stroke-width="1"/>
                <text x="480" y="140" font-size="18" fill="#333333" text-anchor="middle">U₁ = U₂ − I·R₁</text>
                <text x="480" y="190" font-size="18" fill="#333333" text-anchor="middle">ΔU₁ = −R₁·ΔI</text>
                <text x="480" y="240" font-size="18" fill="#333333" text-anchor="middle">|ΔU₁/ΔI| = R₁</text>
                <text x="480" y="300" font-size="16" fill="#333333" text-anchor="middle">比值的绝对值等于定值电阻 R₁</text>
                <text x="480" y="360" font-size="22" fill="#2e7d32" text-anchor="middle" font-weight="bold">√ 正确</text>
            </g>
            
            <!-- 步骤4：选项D -->
            <g id="scene2-step-4" style="display:none">
                <text x="480" y="80" font-size="20" fill="#333333" text-anchor="middle" font-weight="bold">选项 D：ΔU₁ 与 ΔU₂ 的比较</text>
                <line x1="320" y1="100" x2="760" y2="100" stroke="#cccccc" stroke-width="1"/>
                <text x="480" y="140" font-size="18" fill="#333333" text-anchor="middle">ΔU₂ = 0（电源电压恒定）</text>
                <text x="480" y="190" font-size="18" fill="#333333" text-anchor="middle">ΔU₁ = −R₁·ΔI ≠ 0</text>
                <text x="480" y="240" font-size="18" fill="#333333" text-anchor="middle">|ΔU₁| > 0 = |ΔU₂|</text>
                <text x="480" y="300" font-size="16" fill="#333333" text-anchor="middle">两者大小不同</text>
                <text x="480" y="360" font-size="22" fill="#c62828" text-anchor="middle" font-weight="bold">× 错误</text>
            </g>
        </svg>
        
        <div id="scene2-controls">
            <button id="scene2-btn-prev" class="scene2-btn">◀ 上一步</button>
            <div id="scene2-step-indicator" class="scene2-step-indicator">步骤 1/5</div>
            <button id="scene2-btn-next" class="scene2-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        var currentStep = 0;
        var totalSteps = 5;
        
        var btnPrev = document.getElementById('scene2-btn-prev');
        var btnNext = document.getElementById('scene2-btn-next');
        var indicator = document.getElementById('scene2-step-indicator');
        var highlightR1 = document.getElementById('scene2-highlight-r1');
        var highlightR2 = document.getElementById('scene2-highlight-r2');
        
        function updateStep(step) {
            currentStep = step;
            
            // 隐藏所有步骤
            for (var i = 0; i < totalSteps; i++) {
                var el = document.getElementById('scene2-step-' + i);
                if (el) el.style.display = 'none';
            }
            
            // 显示当前步骤
            var currentEl = document.getElementById('scene2-step-' + currentStep);
            if (currentEl) currentEl.style.display = 'block';
            
            // 更新高亮框
            highlightR1.style.display = 'none';
            highlightR2.style.display = 'none';
            
            if (currentStep === 1) {
                highlightR1.style.display = 'block';
                highlightR2.style.display = 'block';
            } else if (currentStep === 2 || currentStep === 3) {
                highlightR1.style.display = 'block';
            }
            // 步骤0和步骤4不显示高亮
            
            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps - 1);
            
            // 更新指示器
            indicator.textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;
        }
        
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) updateStep(currentStep - 1);
        });
        
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) updateStep(currentStep + 1);
        });
        
        // 初始化
        updateStep(0);
    })();
    </script>
</body>
</html>
