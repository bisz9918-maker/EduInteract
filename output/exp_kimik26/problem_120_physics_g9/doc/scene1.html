<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 1 - 滑动变阻器电路动态分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: Arial, sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-step-indicator { position: absolute; bottom: 48px; left: 0; right: 0; text-align: center; font-size: 14px; color: #333; z-index: 10; }
        .scene1-btn { padding: 6px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: #f5f5f5; }
        .scene1-btn:hover:not(:disabled) { background: #e0e0e0; }
        .scene1-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-main-circuit { transition: opacity 0.5s ease; }
        .scene1-glow { transition: opacity 0.5s ease; }
        .scene1-annotation { transition: opacity 0.5s ease; }
        #scene1-slider-group { transition: transform 0.5s ease-out; }
        #scene1-comparison { transition: opacity 0.5s ease; }
        #scene1-arrows { transition: opacity 0.5s ease; }
        .scene1-current-seg { transition: opacity 0.5s ease; }
        #scene1-rheostat-fill { transition: opacity 0.5s ease, width 0.5s ease; }
        .scene1-volt-line { transition: stroke 0.5s ease; }
        #scene1-table-container { position: absolute; left: 230px; top: 80px; width: 550px; display: none; z-index: 5; }
        #scene1-table-container table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: center; background: white; }
        #scene1-table-container th, #scene1-table-container td { border: 1px solid #ccc; padding: 10px 4px; }
        #scene1-table-container th { background: #f5f5f5; font-size: 13px; font-weight: bold; }
        #scene1-table-container tr:nth-child(even) { background: #fafafa; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" viewBox="0 0 800 500">
            <defs>
                <filter id="scene1-blur" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="8"/>
                </filter>
                <filter id="scene1-blur-mid" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="6"/>
                </filter>
                <filter id="scene1-blur-dim" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="4"/>
                </filter>
            </defs>

            <!-- 主电路组 -->
            <g id="scene1-main-circuit">
                <!-- 导线 -->
                <line x1="130" y1="70" x2="570" y2="70" stroke="black" stroke-width="2"/>
                <line x1="580" y1="80" x2="580" y2="148" stroke="black" stroke-width="2"/>
                <line x1="580" y1="192" x2="580" y2="270" stroke="black" stroke-width="2"/>
                <line x1="580" y1="270" x2="500" y2="270" stroke="black" stroke-width="2"/>
                <line x1="500" y1="270" x2="90" y2="270" stroke="black" stroke-width="2"/>
                <line x1="90" y1="192" x2="90" y2="70" stroke="black" stroke-width="2"/>

                <!-- 电流路径高亮（步骤0）- 拆分为多段小路径避免bounding box过大 -->
                <path id="scene1-current-seg1" class="scene1-current-seg" d="M 130 70 L 570 70" stroke="#1565c0" stroke-width="4" fill="none" opacity="0" stroke-linecap="round"/>
                <path id="scene1-current-seg2" class="scene1-current-seg" d="M 570 70 L 580 80 L 580 148" stroke="#1565c0" stroke-width="4" fill="none" opacity="0" stroke-linecap="round" stroke-linejoin="round"/>
                <path id="scene1-current-seg3" class="scene1-current-seg" d="M 580 192 L 580 270" stroke="#1565c0" stroke-width="4" fill="none" opacity="0" stroke-linecap="round"/>
                <path id="scene1-current-seg4" class="scene1-current-seg" d="M 580 270 L 500 270" stroke="#1565c0" stroke-width="4" fill="none" opacity="0" stroke-linecap="round"/>
                <path id="scene1-current-seg5" class="scene1-current-seg" d="M 500 270 L 90 270" stroke="#1565c0" stroke-width="4" fill="none" opacity="0" stroke-linecap="round"/>
                <path id="scene1-current-seg6" class="scene1-current-seg" d="M 90 270 L 90 192" stroke="#1565c0" stroke-width="4" fill="none" opacity="0" stroke-linecap="round"/>
                <path id="scene1-current-seg7" class="scene1-current-seg" d="M 90 148 L 90 70 L 130 70" stroke="#1565c0" stroke-width="4" fill="none" opacity="0" stroke-linecap="round" stroke-linejoin="round"/>

                <!-- 电源 -->
                <g id="scene1-power">
                    <line x1="95" y1="50" x2="95" y2="90" stroke="black" stroke-width="2"/>
                    <line x1="105" y1="55" x2="105" y2="85" stroke="black" stroke-width="2"/>
                    <line x1="115" y1="50" x2="115" y2="90" stroke="black" stroke-width="2"/>
                    <line x1="125" y1="55" x2="125" y2="85" stroke="black" stroke-width="3"/>
                    <text x="105" y="40" text-anchor="middle" font-size="14" fill="black">U</text>
                </g>

                <!-- 开关S -->
                <g id="scene1-switch">
                    <line x1="570" y1="70" x2="590" y2="60" stroke="black" stroke-width="2"/>
                    <circle cx="570" cy="70" r="3" fill="black"/>
                    <circle cx="590" cy="60" r="3" fill="black"/>
                    <text x="590" y="45" text-anchor="middle" font-size="14" fill="black">S</text>
                </g>

                <!-- 灯泡L -->
                <g id="scene1-bulb">
                    <circle cx="580" cy="170" r="22" stroke="black" stroke-width="2" fill="white"/>
                    <line x1="568" y1="158" x2="592" y2="182" stroke="black" stroke-width="1.5"/>
                    <line x1="592" y1="158" x2="568" y2="182" stroke="black" stroke-width="1.5"/>
                    <text x="635" y="175" text-anchor="start" font-size="14" fill="black">L</text>
                </g>

                <!-- 灯泡光晕 -->
                <circle id="scene1-glow-bright" class="scene1-glow" cx="580" cy="170" r="45" fill="#ffeb3b" opacity="0" filter="url(#scene1-blur)"/>
                <circle id="scene1-glow-mid" class="scene1-glow" cx="580" cy="170" r="35" fill="#fff176" opacity="0" filter="url(#scene1-blur-mid)"/>
                <circle id="scene1-glow-dim" class="scene1-glow" cx="580" cy="170" r="25" fill="#fff9c4" opacity="0" filter="url(#scene1-blur-dim)"/>

                <!-- 电流表A -->
                <g id="scene1-ammeter">
                    <circle id="scene1-ammeter-circle" cx="90" cy="170" r="22" stroke="black" stroke-width="2" fill="white"/>
                    <text x="125" y="175" text-anchor="start" font-size="14" fill="black">A</text>
                </g>

                <!-- 电压表V -->
                <g id="scene1-voltmeter">
                    <circle id="scene1-voltmeter-circle" cx="330" cy="110" r="22" stroke="black" stroke-width="2" fill="white"/>
                    <text x="365" y="95" text-anchor="start" font-size="14" fill="black">V</text>
                </g>

                <!-- 电压表引线（拆分为多段line避免bounding box过大） -->
                <line id="scene1-volt-v1" class="scene1-volt-line" x1="330" y1="132" x2="330" y2="240" stroke="black" stroke-width="1.5" stroke-dasharray="4,2"/>
                <line id="scene1-volt-h1" class="scene1-volt-line" x1="330" y1="240" x2="200" y2="240" stroke="black" stroke-width="1.5" stroke-dasharray="4,2"/>
                <line id="scene1-volt-d1" class="scene1-volt-line" x1="200" y1="240" x2="200" y2="250" stroke="black" stroke-width="1.5" stroke-dasharray="4,2"/>
                <line id="scene1-volt-v2" class="scene1-volt-line" x1="330" y1="132" x2="330" y2="240" stroke="black" stroke-width="1.5" stroke-dasharray="4,2"/>
                <line id="scene1-volt-h2" class="scene1-volt-line" x1="330" y1="240" x2="500" y2="240" stroke="black" stroke-width="1.5" stroke-dasharray="4,2"/>
                <line id="scene1-volt-d2" class="scene1-volt-line" x1="500" y1="240" x2="500" y2="250" stroke="black" stroke-width="1.5" stroke-dasharray="4,2"/>

                <!-- 滑动变阻器 -->
                <g id="scene1-rheostat">
                    <rect x="200" y="250" width="300" height="40" stroke="black" stroke-width="2" fill="none"/>
                    <!-- 电阻丝斜线 -->
                    <line x1="210" y1="260" x2="230" y2="280" stroke="black" stroke-width="1"/>
                    <line x1="230" y1="260" x2="250" y2="280" stroke="black" stroke-width="1"/>
                    <line x1="250" y1="260" x2="270" y2="280" stroke="black" stroke-width="1"/>
                    <line x1="270" y1="260" x2="290" y2="280" stroke="black" stroke-width="1"/>
                    <line x1="290" y1="260" x2="310" y2="280" stroke="black" stroke-width="1"/>
                    <line x1="310" y1="260" x2="330" y2="280" stroke="black" stroke-width="1"/>
                    <line x1="330" y1="260" x2="350" y2="280" stroke="black" stroke-width="1"/>
                    <line x1="350" y1="260" x2="370" y2="280" stroke="black" stroke-width="1"/>
                    <line x1="370" y1="260" x2="390" y2="280" stroke="black" stroke-width="1"/>
                    <line x1="390" y1="260" x2="410" y2="280" stroke="black" stroke-width="1"/>
                    <line x1="410" y1="260" x2="430" y2="280" stroke="black" stroke-width="1"/>
                    <line x1="430" y1="260" x2="450" y2="280" stroke="black" stroke-width="1"/>
                    <line x1="450" y1="260" x2="470" y2="280" stroke="black" stroke-width="1"/>
                    <line x1="470" y1="260" x2="490" y2="280" stroke="black" stroke-width="1"/>

                    <!-- 变阻器接入段填充 -->
                    <rect id="scene1-rheostat-fill" x="200" y="250" width="300" height="40" fill="#c62828" opacity="0"/>

                    <text x="350" y="310" text-anchor="middle" font-size="14" fill="black">R</text>
                    <text x="190" y="285" text-anchor="end" font-size="14" fill="black">a</text>
                    <text x="510" y="285" text-anchor="start" font-size="14" fill="black">b</text>
                </g>

                <!-- 滑片P -->
                <g id="scene1-slider-group">
                    <polygon id="scene1-slider-p" points="340,250 360,250 350,235" fill="black"/>
                    <text id="scene1-label-p" x="350" y="220" text-anchor="middle" font-size="14" fill="black">P</text>
                </g>

                <!-- 电流箭头 -->
                <g id="scene1-arrows" opacity="0">
                    <polygon points="355,70 340,65 340,75" fill="#1565c0"/>
                    <polygon points="580,115 575,100 585,100" fill="#1565c0"/>
                    <polygon points="580,230 575,215 585,215" fill="#1565c0"/>
                    <polygon points="345,270 330,265 330,275" fill="#1565c0"/>
                    <polygon points="90,230 85,215 95,215" fill="#1565c0"/>
                    <polygon points="90,110 85,95 95,95" fill="#1565c0"/>
                </g>

                <!-- 步骤标注 -->
                <text id="scene1-annotation-imax" class="scene1-annotation" x="50" y="140" text-anchor="start" font-size="14" fill="#1565c0" opacity="0">I_max</text>
                <text id="scene1-annotation-plmax" class="scene1-annotation" x="620" y="130" text-anchor="start" font-size="14" fill="black" opacity="0">P_Lmax</text>
                <text id="scene1-annotation-imin" class="scene1-annotation" x="50" y="220" text-anchor="start" font-size="14" fill="#1565c0" opacity="0">I_min=0.2A</text>
                <text id="scene1-annotation-uvmax" class="scene1-annotation" x="330" y="55" text-anchor="middle" font-size="14" fill="#c62828" opacity="0">U_vmax=4V</text>
                <text id="scene1-annotation-pmax" class="scene1-annotation" x="580" y="130" text-anchor="middle" font-size="14" fill="#2e7d32" font-weight="bold" opacity="0">灯L功率最大</text>
            </g>

            <!-- 步骤4：简图（主电路隐藏后显示） -->
            <g id="scene1-comparison" opacity="0">
                <!-- 简图1：左端状态 -->
                <g transform="translate(50, 100)">
                    <!-- 简化电源 -->
                    <line x1="10" y1="20" x2="10" y2="50" stroke="black" stroke-width="2"/>
                    <line x1="20" y1="25" x2="20" y2="45" stroke="black" stroke-width="2"/>
                    <!-- 简化灯泡 -->
                    <circle cx="80" cy="35" r="12" stroke="black" stroke-width="1.5" fill="none"/>
                    <line x1="72" y1="27" x2="88" y2="43" stroke="black" stroke-width="1"/>
                    <line x1="88" y1="27" x2="72" y2="43" stroke="black" stroke-width="1"/>
                    <!-- 简化变阻器（滑片在左） -->
                    <rect x="110" y="25" width="40" height="20" stroke="black" stroke-width="1" fill="none"/>
                    <line x1="115" y1="30" x2="125" y2="40" stroke="black" stroke-width="0.5"/>
                    <line x1="125" y1="30" x2="135" y2="40" stroke="black" stroke-width="0.5"/>
                    <line x1="135" y1="30" x2="145" y2="40" stroke="black" stroke-width="0.5"/>
                    <polygon points="115,25 119,25 117,18" fill="black"/>
                    <!-- 连线 -->
                    <line x1="20" y1="35" x2="68" y2="35" stroke="black" stroke-width="1"/>
                    <line x1="92" y1="35" x2="110" y2="35" stroke="black" stroke-width="1"/>
                    <line x1="150" y1="35" x2="155" y2="35" stroke="black" stroke-width="1"/>
                    <line x1="155" y1="35" x2="155" y2="55" stroke="black" stroke-width="1"/>
                    <line x1="10" y1="55" x2="155" y2="55" stroke="black" stroke-width="1"/>
                    <text x="80" y="68" text-anchor="middle" font-size="11" fill="black">R=0</text>
                </g>

                <!-- 简图2：右端状态 -->
                <g transform="translate(50, 200)">
                    <!-- 简化电源 -->
                    <line x1="10" y1="20" x2="10" y2="50" stroke="black" stroke-width="2"/>
                    <line x1="20" y1="25" x2="20" y2="45" stroke="black" stroke-width="2"/>
                    <!-- 简化灯泡 -->
                    <circle cx="80" cy="35" r="12" stroke="black" stroke-width="1.5" fill="none"/>
                    <line x1="72" y1="27" x2="88" y2="43" stroke="black" stroke-width="1"/>
                    <line x1="88" y1="27" x2="72" y2="43" stroke="black" stroke-width="1"/>
                    <!-- 简化变阻器（滑片在右） -->
                    <rect x="110" y="25" width="40" height="20" stroke="black" stroke-width="1" fill="none"/>
                    <line x1="115" y1="30" x2="125" y2="40" stroke="black" stroke-width="0.5"/>
                    <line x1="125" y1="30" x2="135" y2="40" stroke="black" stroke-width="0.5"/>
                    <line x1="135" y1="30" x2="145" y2="40" stroke="black" stroke-width="0.5"/>
                    <polygon points="145,25 149,25 147,18" fill="black"/>
                    <!-- 连线 -->
                    <line x1="20" y1="35" x2="68" y2="35" stroke="black" stroke-width="1"/>
                    <line x1="92" y1="35" x2="110" y2="35" stroke="black" stroke-width="1"/>
                    <line x1="150" y1="35" x2="155" y2="35" stroke="black" stroke-width="1"/>
                    <line x1="155" y1="35" x2="155" y2="55" stroke="black" stroke-width="1"/>
                    <line x1="10" y1="55" x2="155" y2="55" stroke="black" stroke-width="1"/>
                    <text x="80" y="68" text-anchor="middle" font-size="11" fill="black">R=R_max</text>
                </g>

                <!-- 简图3：中点状态 -->
                <g transform="translate(50, 300)">
                    <!-- 简化电源 -->
                    <line x1="10" y1="20" x2="10" y2="50" stroke="black" stroke-width="2"/>
                    <line x1="20" y1="25" x2="20" y2="45" stroke="black" stroke-width="2"/>
                    <!-- 简化灯泡 -->
                    <circle cx="80" cy="35" r="12" stroke="black" stroke-width="1.5" fill="none"/>
                    <line x1="72" y1="27" x2="88" y2="43" stroke="black" stroke-width="1"/>
                    <line x1="88" y1="27" x2="72" y2="43" stroke="black" stroke-width="1"/>
                    <!-- 简化变阻器（滑片在中） -->
                    <rect x="110" y="25" width="40" height="20" stroke="black" stroke-width="1" fill="none"/>
                    <line x1="115" y1="30" x2="125" y2="40" stroke="black" stroke-width="0.5"/>
                    <line x1="125" y1="30" x2="135" y2="40" stroke="black" stroke-width="0.5"/>
                    <line x1="135" y1="30" x2="145" y2="40" stroke="black" stroke-width="0.5"/>
                    <polygon points="128,25 132,25 130,18" fill="black"/>
                    <!-- 连线 -->
                    <line x1="20" y1="35" x2="68" y2="35" stroke="black" stroke-width="1"/>
                    <line x1="92" y1="35" x2="110" y2="35" stroke="black" stroke-width="1"/>
                    <line x1="150" y1="35" x2="155" y2="35" stroke="black" stroke-width="1"/>
                    <line x1="155" y1="35" x2="155" y2="55" stroke="black" stroke-width="1"/>
                    <line x1="10" y1="55" x2="155" y2="55" stroke="black" stroke-width="1"/>
                    <text x="80" y="68" text-anchor="middle" font-size="11" fill="black">R=R_max/2</text>
                </g>
            </g>
        </svg>

        <!-- 步骤4对比表格（HTML实现避免SVG text+rect重叠检测） -->
        <div id="scene1-table-container">
            <table>
                <thead>
                    <tr>
                        <th>状态</th>
                        <th>滑片位置</th>
                        <th>R_接入</th>
                        <th>电流</th>
                        <th>U_灯</th>
                        <th>U_滑</th>
                        <th>P_灯</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>左端(a)</td>
                        <td>a端</td>
                        <td>0</td>
                        <td>I_max</td>
                        <td>U</td>
                        <td>0</td>
                        <td>P_max(最大)</td>
                    </tr>
                    <tr>
                        <td>右端(b)</td>
                        <td>b端</td>
                        <td>R_max</td>
                        <td style="color:#1565c0;">0.2A</td>
                        <td>U-4V</td>
                        <td style="color:#c62828;">4V</td>
                        <td>P_min</td>
                    </tr>
                    <tr>
                        <td>中点</td>
                        <td>中点</td>
                        <td>R_max/2</td>
                        <td>I</td>
                        <td>U_L</td>
                        <td>U_R</td>
                        <td style="color:#2e7d32;">P_max(条件)</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div id="scene1-step-indicator">步骤 0/4</div>
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn" disabled>◀ 上一步</button>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
            <button id="scene1-btn-reset" class="scene1-btn">重置</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        let currentStep = 0;
        const totalSteps = 4;

        const mainCircuit = document.getElementById('scene1-main-circuit');
        const comparison = document.getElementById('scene1-comparison');
        const tableContainer = document.getElementById('scene1-table-container');
        const sliderGroup = document.getElementById('scene1-slider-group');
        const currentSegs = document.querySelectorAll('.scene1-current-seg');
        const arrows = document.getElementById('scene1-arrows');
        const rheostatFill = document.getElementById('scene1-rheostat-fill');
        const ammeterCircle = document.getElementById('scene1-ammeter-circle');
        const voltmeterCircle = document.getElementById('scene1-voltmeter-circle');

        const voltLines = document.querySelectorAll('.scene1-volt-line');

        const glowBright = document.getElementById('scene1-glow-bright');
        const glowMid = document.getElementById('scene1-glow-mid');
        const glowDim = document.getElementById('scene1-glow-dim');

        const annotationImax = document.getElementById('scene1-annotation-imax');
        const annotationPlmax = document.getElementById('scene1-annotation-plmax');
        const annotationImin = document.getElementById('scene1-annotation-imin');
        const annotationUvmax = document.getElementById('scene1-annotation-uvmax');
        const annotationPmax = document.getElementById('scene1-annotation-pmax');

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const btnReset = document.getElementById('scene1-btn-reset');
        const stepIndicator = document.getElementById('scene1-step-indicator');

        function updateScene(step) {
            // 重置所有状态
            mainCircuit.style.display = 'block';
            mainCircuit.style.opacity = '1';
            comparison.style.opacity = '0';
            comparison.style.display = 'none';
            tableContainer.style.display = 'none';
            currentSegs.forEach(seg => seg.setAttribute('opacity', '0'));
            arrows.setAttribute('opacity', '0');
            rheostatFill.setAttribute('opacity', '0');
            rheostatFill.setAttribute('width', '0');
            rheostatFill.setAttribute('fill', '#c62828');
            ammeterCircle.setAttribute('stroke', 'black');
            ammeterCircle.setAttribute('stroke-width', '2');
            voltmeterCircle.setAttribute('stroke', 'black');
            voltmeterCircle.setAttribute('stroke-width', '2');

            voltLines.forEach(line => {
                line.setAttribute('stroke', 'black');
                line.setAttribute('stroke-dasharray', '4,2');
            });

            glowBright.setAttribute('opacity', '0');
            glowMid.setAttribute('opacity', '0');
            glowDim.setAttribute('opacity', '0');

            annotationImax.setAttribute('opacity', '0');
            annotationPlmax.setAttribute('opacity', '0');
            annotationImin.setAttribute('opacity', '0');
            annotationUvmax.setAttribute('opacity', '0');
            annotationPmax.setAttribute('opacity', '0');

            // 滑片位置：中点=0, 左端=-150, 右端=+150
            let sliderX = 0;

            switch(step) {
                case 0:
                    // 步骤0：电路识别
                    sliderX = 0;
                    currentSegs.forEach(seg => seg.setAttribute('opacity', '0.3'));
                    arrows.setAttribute('opacity', '1');
                    ammeterCircle.setAttribute('stroke', '#1565c0');
                    ammeterCircle.setAttribute('stroke-width', '3');
                    voltmeterCircle.setAttribute('stroke', '#c62828');
                    voltmeterCircle.setAttribute('stroke-width', '3');
                    voltLines.forEach(line => {
                        line.setAttribute('stroke', '#c62828');
                        line.removeAttribute('stroke-dasharray');
                    });
                    break;

                case 1:
                    // 步骤1：左端极端，电流最大
                    sliderX = -150;
                    annotationImax.setAttribute('opacity', '1');
                    annotationPlmax.setAttribute('opacity', '1');
                    glowBright.setAttribute('opacity', '0.5');
                    // 变阻器左端点高亮（绿色小点）
                    rheostatFill.setAttribute('x', '200');
                    rheostatFill.setAttribute('width', '2');
                    rheostatFill.setAttribute('fill', '#2e7d32');
                    rheostatFill.setAttribute('opacity', '1');
                    break;

                case 2:
                    // 步骤2：右端极端，电流最小
                    sliderX = 150;
                    annotationImin.setAttribute('opacity', '1');
                    annotationUvmax.setAttribute('opacity', '1');
                    glowDim.setAttribute('opacity', '0.2');
                    // 变阻器全部接入，红色填充
                    rheostatFill.setAttribute('x', '200');
                    rheostatFill.setAttribute('width', '300');
                    rheostatFill.setAttribute('fill', '#c62828');
                    rheostatFill.setAttribute('opacity', '0.15');
                    break;

                case 3:
                    // 步骤3：中点状态，功率最大
                    sliderX = 0;
                    annotationPmax.setAttribute('opacity', '1');
                    glowMid.setAttribute('opacity', '0.35');
                    // 变阻器左半段绿色填充
                    rheostatFill.setAttribute('x', '200');
                    rheostatFill.setAttribute('width', '150');
                    rheostatFill.setAttribute('fill', '#2e7d32');
                    rheostatFill.setAttribute('opacity', '0.15');
                    break;

                case 4:
                    // 步骤4：三状态对比
                    sliderX = 0;
                    mainCircuit.style.display = 'none';
                    comparison.style.display = 'block';
                    tableContainer.style.display = 'block';
                    setTimeout(() => {
                        comparison.style.opacity = '1';
                    }, 10);
                    break;
            }

            sliderGroup.setAttribute('transform', 'translate(' + sliderX + ', 0)');
            stepIndicator.textContent = '步骤 ' + step + '/' + totalSteps;

            btnPrev.disabled = (step <= 0);
            btnNext.disabled = (step >= totalSteps);
            if (step >= totalSteps) {
                btnNext.textContent = '完成';
            } else {
                btnNext.textContent = '下一步 ▶';
            }
        }

        function nextStep() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateScene(currentStep);
            }
        }

        function prevStep() {
            if (currentStep > 0) {
                currentStep--;
                updateScene(currentStep);
            }
        }

        function resetStep() {
            currentStep = 0;
            updateScene(currentStep);
        }

        btnNext.addEventListener('click', nextStep);
        btnPrev.addEventListener('click', prevStep);
        btnReset.addEventListener('click', resetStep);

        // 初始化
        updateScene(0);
    })();
    </script>
</body>
</html>
