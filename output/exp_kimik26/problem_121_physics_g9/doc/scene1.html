<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>六物块连接体受力分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-controls button { padding: 6px 16px; font-size: 14px; cursor: pointer; border: 1px solid #999; border-radius: 4px; background: #f0f0f0; color: #333; }
        #scene1-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene1-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene1-step-label { font-size: 14px; font-weight: bold; color: #333; min-width: 160px; text-align: center; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <defs>
                <!-- 蓝色箭头头部（向右） -->
                <marker id="scene1-arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0" />
                </marker>
                <!-- 红色箭头头部（向左） -->
                <marker id="scene1-arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#c62828" />
                </marker>
            </defs>

            <!-- ========== 基础元素（始终显示） ========== -->
            <g id="scene1-base">
                <!-- 地面基线 -->
                <line x1="100" y1="300" x2="600" y2="300" stroke="#000000" stroke-width="2" />
                <!-- 地面斜线纹理由 JS 生成插入此处 -->
            </g>

            <!-- 物块 1~6 -->
            <g id="scene1-blocks">
                <rect id="scene1-block-1" x="150" y="260" width="60" height="40" fill="none" stroke="#000000" stroke-width="2" />
                <rect id="scene1-block-2" x="210" y="260" width="60" height="40" fill="none" stroke="#000000" stroke-width="2" />
                <rect id="scene1-block-3" x="270" y="260" width="60" height="40" fill="none" stroke="#000000" stroke-width="2" />
                <rect id="scene1-block-4" x="330" y="260" width="60" height="40" fill="none" stroke="#000000" stroke-width="2" />
                <rect id="scene1-block-5" x="390" y="260" width="60" height="40" fill="none" stroke="#000000" stroke-width="2" />
                <rect id="scene1-block-6" x="450" y="260" width="60" height="40" fill="none" stroke="#000000" stroke-width="2" />
            </g>

            <!-- 编号标签 -->
            <g id="scene1-labels">
                <text x="180" y="250" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">1</text>
                <text x="240" y="250" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">2</text>
                <text x="300" y="250" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">3</text>
                <text x="360" y="250" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">4</text>
                <text x="420" y="250" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">5</text>
                <text x="480" y="250" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">6</text>
            </g>

            <!-- 外力 F -->
            <g id="scene1-force-f">
                <line x1="90" y1="280" x2="150" y2="280" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrowhead-blue)" />
                <text x="120" y="270" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565c0">F = 6N</text>
            </g>

            <!-- ========== 步骤1：整体法 ========== -->
            <g id="scene1-group-overall" style="display:none">
                <!-- 整体虚线框 -->
                <rect x="145" y="255" width="370" height="50" fill="none" stroke="#1565c0" stroke-width="2" stroke-dasharray="5,5" />
                <!-- 总摩擦力箭头 f_total（向左） -->
                <line x1="390" y1="320" x2="330" y2="320" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrowhead-red)" />
                <text x="360" y="335" text-anchor="middle" font-size="14" font-weight="bold" fill="#c62828">f_total = 6N</text>
            </g>

            <!-- ========== 步骤2：单个摩擦力 ========== -->
            <g id="scene1-group-singlef" style="display:none">
                <!-- 6 个 f=1N 短箭头（向左） -->
                <line x1="195" y1="320" x2="165" y2="320" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrowhead-red)" />
                <line x1="255" y1="320" x2="225" y2="320" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrowhead-red)" />
                <line x1="315" y1="320" x2="285" y2="320" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrowhead-red)" />
                <line x1="375" y1="320" x2="345" y2="320" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrowhead-red)" />
                <line x1="435" y1="320" x2="405" y2="320" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrowhead-red)" />
                <line x1="495" y1="320" x2="465" y2="320" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrowhead-red)" />
                <!-- 标签 -->
                <text x="180" y="335" text-anchor="middle" font-size="12" font-weight="bold" fill="#c62828">f = 1N</text>
                <text x="240" y="335" text-anchor="middle" font-size="12" font-weight="bold" fill="#c62828">f = 1N</text>
                <text x="300" y="335" text-anchor="middle" font-size="12" font-weight="bold" fill="#c62828">f = 1N</text>
                <text x="360" y="335" text-anchor="middle" font-size="12" font-weight="bold" fill="#c62828">f = 1N</text>
                <text x="420" y="335" text-anchor="middle" font-size="12" font-weight="bold" fill="#c62828">f = 1N</text>
                <text x="480" y="335" text-anchor="middle" font-size="12" font-weight="bold" fill="#c62828">f = 1N</text>
            </g>

            <!-- ========== 步骤3：隔离法 ========== -->
            <g id="scene1-group-isolate" style="display:none">
                <!-- 4-5-6 高亮填充 -->
                <rect x="330" y="260" width="60" height="40" fill="#1565c0" fill-opacity="0.15" pointer-events="none" />
                <rect x="390" y="260" width="60" height="40" fill="#1565c0" fill-opacity="0.15" pointer-events="none" />
                <rect x="450" y="260" width="60" height="40" fill="#1565c0" fill-opacity="0.15" pointer-events="none" />
                <!-- 隔离虚线框 -->
                <rect x="325" y="255" width="190" height="50" fill="none" stroke="#1565c0" stroke-width="2" stroke-dasharray="5,5" />
                <!-- N 箭头（3-4 接触面向右） -->
                <line x1="330" y1="280" x2="360" y2="280" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrowhead-blue)" />
                <!-- N 标签移到箭头左上方，避免与物块3、4重叠 -->
                <text x="330" y="235" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565c0">N</text>
                <!-- 3f 箭头（向左） -->
                <line x1="450" y1="320" x2="420" y2="320" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrowhead-red)" />
                <text x="435" y="335" text-anchor="middle" font-size="14" font-weight="bold" fill="#c62828">3f = 3N</text>
            </g>

            <!-- ========== 右侧公式区 ========== -->
            <g id="scene1-formula-step0">
                <text x="580" y="150" font-size="16" font-weight="bold" fill="#000000">匀速直线运动</text>
            </g>

            <g id="scene1-formula-step1" style="display:none">
                <text x="580" y="120" font-size="16" font-weight="bold" fill="#1565c0">整体法</text>
                <text x="580" y="155" font-size="14" fill="#000000">F = f_total</text>
                <text x="580" y="190" font-size="14" fill="#000000">6 N = 6 N</text>
            </g>

            <g id="scene1-formula-step2" style="display:none">
                <text x="580" y="120" font-size="16" font-weight="bold" fill="#1565c0">每个物块</text>
                <text x="580" y="155" font-size="14" fill="#000000">f = 6N / 6</text>
                <text x="580" y="190" font-size="14" fill="#000000">= 1N</text>
            </g>

            <g id="scene1-formula-step3" style="display:none">
                <text x="580" y="120" font-size="16" font-weight="bold" fill="#1565c0">隔离 4-5-6</text>
                <text x="580" y="155" font-size="14" fill="#000000">N = 3f</text>
                <text x="580" y="190" font-size="14" fill="#000000">= 3N</text>
            </g>

            <g id="scene1-formula-conclusion" style="display:none">
                <text x="580" y="230" font-size="16" font-weight="bold" fill="#2e7d32">∴ N = 3N</text>
                <text x="580" y="270" font-size="16" font-weight="bold" fill="#2e7d32">答案：B</text>
            </g>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <span id="scene1-step-label">步骤0：题意</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        var currentStep = 0;
        var totalSteps = 4;
        var stepNames = [
            "步骤0：题意",
            "步骤1：整体法",
            "步骤2：单个摩擦力",
            "步骤3：隔离法",
            "步骤4：结论"
        ];

        var btnPrev = document.getElementById("scene1-btn-prev");
        var btnNext = document.getElementById("scene1-btn-next");
        var stepLabel = document.getElementById("scene1-step-label");

        var groupOverall = document.getElementById("scene1-group-overall");
        var groupSingleF = document.getElementById("scene1-group-singlef");
        var groupIsolate = document.getElementById("scene1-group-isolate");

        var formulaStep0 = document.getElementById("scene1-formula-step0");
        var formulaStep1 = document.getElementById("scene1-formula-step1");
        var formulaStep2 = document.getElementById("scene1-formula-step2");
        var formulaStep3 = document.getElementById("scene1-formula-step3");
        var formulaConclusion = document.getElementById("scene1-formula-conclusion");

        // 生成地面斜线纹理
        var baseGroup = document.getElementById("scene1-base");
        for (var x = 100; x <= 600; x += 20) {
            var line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", x);
            line.setAttribute("y1", 300);
            line.setAttribute("x2", x + 8);
            line.setAttribute("y2", 315);
            line.setAttribute("stroke", "#888888");
            line.setAttribute("stroke-width", "1");
            baseGroup.appendChild(line);
        }

        function setDisplay(el, show) {
            if (!el) return;
            el.style.display = show ? "block" : "none";
        }

        function render() {
            stepLabel.textContent = stepNames[currentStep];
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps);

            // 公式区：只显示当前步骤对应的公式
            setDisplay(formulaStep0, currentStep === 0);
            setDisplay(formulaStep1, currentStep === 1);
            setDisplay(formulaStep2, currentStep === 2);
            setDisplay(formulaStep3, currentStep === 3 || currentStep === 4);
            setDisplay(formulaConclusion, currentStep === 4);

            // 视觉元素组
            setDisplay(groupOverall, currentStep === 1);
            setDisplay(groupSingleF, currentStep === 2);
            setDisplay(groupIsolate, currentStep === 3 || currentStep === 4);
        }

        btnPrev.addEventListener("click", function() {
            if (currentStep > 0) {
                currentStep--;
                render();
            }
        });

        btnNext.addEventListener("click", function() {
            if (currentStep < totalSteps) {
                currentStep++;
                render();
            }
        });

        // 初始渲染
        render();
    })();
    </script>
</body>
</html>
