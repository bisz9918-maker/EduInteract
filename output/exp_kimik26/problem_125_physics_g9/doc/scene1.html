<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>凸透镜成像规律 - 场景1</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            width: 70px; height: 28px; background: #1565c0; color: #fff; border: none; border-radius: 4px;
            font-size: 14px; cursor: pointer; transition: opacity 0.2s;
        }
        #scene1-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 12px; color: #666; min-width: 60px; text-align: center; }
        svg { display: block; }
        .step-element { transition: opacity 0.3s ease; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <defs>
                <!-- 蓝色箭头（入射光线/物侧） -->
                <marker id="scene1-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0"/>
                </marker>
                <!-- 红色箭头（折射光线/像侧） -->
                <marker id="scene1-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828"/>
                </marker>
            </defs>

            <!-- ===== 步骤0：题目装置（始终显示） ===== -->
            <!-- 主光轴 -->
            <line id="scene1-axis" x1="50" y1="250" x2="750" y2="250" stroke="#888888" stroke-width="1.5" stroke-dasharray="6,4"/>

            <!-- 凸透镜 -->
            <line id="scene1-lens" x1="400" y1="210" x2="400" y2="290" stroke="#000000" stroke-width="4"/>
            <line x1="395" y1="210" x2="405" y2="210" stroke="#000000" stroke-width="1.5"/>
            <line x1="395" y1="290" x2="405" y2="290" stroke="#000000" stroke-width="1.5"/>

            <!-- 蜡烛 -->
            <g id="scene1-candle">
                <!-- 烛身 -->
                <rect x="145" y="220" width="10" height="30" fill="none" stroke="#1565c0" stroke-width="1.5"/>
                <!-- 烛焰（泪滴形，尖端朝上） -->
                <path d="M 150,220 C 142,210 142,190 150,180 C 158,190 158,210 150,220" fill="#1565c0" stroke="#1565c0" stroke-width="1"/>
            </g>

            <!-- 光屏 -->
            <rect id="scene1-screen" x="550" y="190" width="30" height="120" fill="none" stroke="#000000" stroke-width="1.5"/>

            <!-- 焦点/光心标记点（绿色实心圆） -->
            <circle cx="200" cy="250" r="6" fill="#2e7d32"/>
            <circle cx="300" cy="250" r="6" fill="#2e7d32"/>
            <circle cx="400" cy="250" r="6" fill="#2e7d32"/>
            <circle cx="500" cy="250" r="6" fill="#2e7d32"/>
            <circle cx="600" cy="250" r="6" fill="#2e7d32"/>

            <!-- 步骤0常驻标签 -->
            <text x="130" y="155" font-size="15" fill="#333" text-anchor="middle">蜡烛</text>
            <text x="400" y="165" font-size="15" fill="#333" text-anchor="middle">凸透镜</text>
            <text x="565" y="170" font-size="15" fill="#333" text-anchor="middle">光屏</text>
            <text x="200" y="320" font-size="14" fill="#2e7d32" text-anchor="middle">2F</text>
            <text x="300" y="320" font-size="14" fill="#2e7d32" text-anchor="middle">F</text>
            <text x="385" y="320" font-size="14" fill="#2e7d32" text-anchor="middle">O</text>
            <text x="500" y="320" font-size="14" fill="#2e7d32" text-anchor="middle">F</text>
            <text x="600" y="320" font-size="14" fill="#2e7d32" text-anchor="middle">2F</text>

            <!-- ===== 步骤1：特殊光线① ===== -->
            <!-- 入射光线①：水平向右 -->
            <line id="scene1-ray1-incident" class="step-element" x1="150" y1="180" x2="400" y2="180" stroke="#1565c0" stroke-width="1.5" marker-end="url(#scene1-arrow-blue)" opacity="0"/>
            <!-- 折射光线①：过右焦点到像点 -->
            <line id="scene1-ray1-refracted" class="step-element" x1="400" y1="180" x2="567" y2="297" stroke="#c62828" stroke-width="1.5" marker-end="url(#scene1-arrow-red)" opacity="0"/>

            <!-- ===== 步骤2：特殊光线② ===== -->
            <!-- 入射光线②：过光心直达像点 -->
            <line id="scene1-ray2-incident" class="step-element" x1="150" y1="180" x2="567" y2="297" stroke="#1565c0" stroke-width="1.5" marker-end="url(#scene1-arrow-blue)" opacity="0"/>

            <!-- ===== 步骤3：确定像点 ===== -->
            <!-- 倒立实像（红色倒立烛焰） -->
            <g id="scene1-image" class="step-element" opacity="0">
                <path d="M 567,250 C 561,260 561,280 567,297 C 573,280 573,260 567,250" fill="#c62828" stroke="#c62828" stroke-width="1"/>
            </g>

            <!-- ===== 步骤4：标注范围 ===== -->
            <!-- 物距高亮区 -->
            <rect id="scene1-highlight-u" class="step-element" x="150" y="235" width="250" height="30" fill="#1565c0" fill-opacity="0.15" stroke="none" opacity="0"/>
            <!-- 像距高亮区 -->
            <rect id="scene1-highlight-v" class="step-element" x="400" y="235" width="167" height="30" fill="#c62828" fill-opacity="0.15" stroke="none" opacity="0"/>
            <!-- 物距标签 -->
            <text id="scene1-label-ugt2f" class="step-element" x="275" y="165" font-size="14" fill="#1565c0" text-anchor="middle" opacity="0">u &gt; 2f</text>
            <!-- 像距标签 -->
            <text id="scene1-label-vrange" class="step-element" x="483" y="165" font-size="14" fill="#c62828" text-anchor="middle" opacity="0">f &lt; v &lt; 2f</text>
            <!-- 成像性质标签 -->
            <text id="scene1-label-property" class="step-element" x="685" y="165" font-size="14" fill="#333" text-anchor="middle" opacity="0">倒立、缩小、实像</text>

            <!-- ===== 步骤5：验证A选项 ===== -->
            <!-- 物下移箭头（蓝色向下） -->
            <line id="scene1-arrow-object" class="step-element" x1="150" y1="180" x2="150" y2="220" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-blue)" opacity="0"/>
            <!-- 像上移箭头（红色向上） -->
            <line id="scene1-arrow-image" class="step-element" x1="567" y1="297" x2="567" y2="260" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrow-red)" opacity="0"/>
            <!-- 移动说明标签 -->
            <text id="scene1-label-movement" class="step-element" x="400" y="400" font-size="15" fill="#333" text-anchor="middle" opacity="0">物下移 → 像上移</text>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/6</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现：凸透镜成倒立缩小实像的光路分析
        let currentStep = 0;
        const totalSteps = 6; // 步骤 0~5

        // 每个步骤新增的元素 ID（步骤 N 及之后保持显示）
        const stepElements = {
            1: ['scene1-ray1-incident', 'scene1-ray1-refracted'],
            2: ['scene1-ray2-incident'],
            3: ['scene1-image'],
            4: ['scene1-highlight-u', 'scene1-highlight-v', 'scene1-label-ugt2f', 'scene1-label-vrange', 'scene1-label-property'],
            5: ['scene1-arrow-object', 'scene1-arrow-image', 'scene1-label-movement']
        };

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const indicator = document.getElementById('scene1-step-indicator');

        function render() {
            // 根据当前步骤设置各元素透明度
            for (let step = 1; step <= 5; step++) {
                const ids = stepElements[step] || [];
                const visible = currentStep >= step;
                ids.forEach(id => {
                    const el = document.getElementById(id);
                    if (el) {
                        el.style.opacity = visible ? '1' : '0';
                    }
                });
            }

            // 更新按钮禁用状态
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === 5;
            indicator.textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                render();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < 5) {
                currentStep++;
                render();
            }
        });

        // 初始渲染
        render();
    })();
    </script>
</body>
</html>
