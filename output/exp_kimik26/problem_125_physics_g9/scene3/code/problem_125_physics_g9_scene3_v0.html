<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>场景3：漫反射与镜面反射对比</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene3-controls button {
            padding: 8px 20px;
            font-size: 14px;
            border: 2px solid #333;
            border-radius: 6px;
            cursor: pointer;
            background: #f5f5f5;
            color: #333;
            transition: all 0.3s ease;
        }
        #scene3-controls button.active {
            background: #1565c0;
            color: #fff;
            border-color: #1565c0;
        }
        /* SVG group transitions */
        #scene3-left-panel, #scene3-right-panel {
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Blue arrow marker for incident rays -->
                <marker id="scene3-arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#1565c0"/>
                </marker>
                <!-- Red arrow marker for reflected rays -->
                <marker id="scene3-arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#c62828"/>
                </marker>
            </defs>

            <!-- ==================== LEFT PANEL: Rough Surface (Diffuse Reflection) ==================== -->
            <g id="scene3-left-panel">
                <!-- Title -->
                <text x="210" y="75" text-anchor="middle" font-size="16" fill="#000000" font-weight="bold">粗糙光屏</text>

                <!-- Rough surface rectangle -->
                <rect id="scene3-rough-surface" x="80" y="320" width="260" height="40" fill="#8d6e63" stroke="#000000" stroke-width="2"/>
                <!-- Rough texture lines -->
                <line x1="100" y1="330" x2="110" y2="340" stroke="#000000" stroke-width="1"/>
                <line x1="140" y1="325" x2="150" y2="340" stroke="#000000" stroke-width="1"/>
                <line x1="180" y1="335" x2="190" y2="345" stroke="#000000" stroke-width="1"/>
                <line x1="220" y1="330" x2="230" y2="345" stroke="#000000" stroke-width="1"/>
                <line x1="260" y1="325" x2="270" y2="340" stroke="#000000" stroke-width="1"/>

                <!-- Normal line (dashed) -->
                <line x1="220" y1="240" x2="220" y2="320" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>

                <!-- Incident rays (blue) -->
                <line id="scene3-incident-ray-left-1" x1="60" y1="160" x2="180" y2="320" stroke="#1565c0" stroke-width="2" marker-end="url(#scene3-arrow-blue)"/>
                <line id="scene3-incident-ray-left-2" x1="100" y1="160" x2="220" y2="320" stroke="#1565c0" stroke-width="2" marker-end="url(#scene3-arrow-blue)"/>
                <line id="scene3-incident-ray-left-3" x1="140" y1="160" x2="260" y2="320" stroke="#1565c0" stroke-width="2" marker-end="url(#scene3-arrow-blue)"/>

                <!-- Reflected rays (red, scattered) -->
                <line id="scene3-reflect-ray-left-1" x1="220" y1="320" x2="340" y2="240" stroke="#c62828" stroke-width="2" marker-end="url(#scene3-arrow-red)"/>
                <line id="scene3-reflect-ray-left-2" x1="220" y1="320" x2="360" y2="280" stroke="#c62828" stroke-width="2" marker-end="url(#scene3-arrow-red)"/>
                <line id="scene3-reflect-ray-left-3" x1="220" y1="320" x2="360" y2="320" stroke="#c62828" stroke-width="2" marker-end="url(#scene3-arrow-red)"/>
                <line id="scene3-reflect-ray-left-4" x1="220" y1="320" x2="340" y2="360" stroke="#c62828" stroke-width="2" marker-end="url(#scene3-arrow-red)"/>
                <line id="scene3-reflect-ray-left-5" x1="220" y1="320" x2="320" y2="400" stroke="#c62828" stroke-width="2" marker-end="url(#scene3-arrow-red)"/>

                <!-- Eye icons (green = visible) -->
                <!-- Eye 1 at (340, 220) -->
                <g transform="translate(340, 220)">
                    <ellipse cx="0" cy="0" rx="15" ry="10" fill="#2e7d32" stroke="#000000" stroke-width="1"/>
                    <circle cx="0" cy="0" r="5" fill="#ffffff"/>
                    <circle cx="2" cy="0" r="2" fill="#000000"/>
                </g>
                <!-- Eye 2 at (360, 360) -->
                <g transform="translate(360, 360)">
                    <ellipse cx="0" cy="0" rx="15" ry="10" fill="#2e7d32" stroke="#000000" stroke-width="1"/>
                    <circle cx="0" cy="0" r="5" fill="#ffffff"/>
                    <circle cx="2" cy="0" r="2" fill="#000000"/>
                </g>

                <!-- Labels -->
                <text x="40" y="145" font-size="14" fill="#000000">入射光</text>
                <text x="280" y="220" font-size="14" fill="#000000">反射光</text>
                <text x="320" y="180" font-size="13" fill="#000000">各个方向都能看到</text>
                <text x="375" y="220" font-size="12" fill="#000000">可见</text>
                <text x="395" y="365" font-size="12" fill="#000000">可见</text>
                <text x="210" y="425" text-anchor="middle" font-size="14" fill="#000000">漫反射 → 光屏应选用粗糙表面</text>
            </g>

            <!-- ==================== RIGHT PANEL: Smooth Surface (Specular Reflection) ==================== -->
            <g id="scene3-right-panel">
                <!-- Title -->
                <text x="590" y="75" text-anchor="middle" font-size="16" fill="#000000" font-weight="bold">光滑玻璃板</text>

                <!-- Smooth surface rectangle -->
                <rect id="scene3-smooth-surface" x="460" y="320" width="260" height="40" fill="#90caf9" stroke="#000000" stroke-width="2"/>

                <!-- Normal line (dashed) -->
                <line x1="600" y1="240" x2="600" y2="320" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>

                <!-- Incident rays (blue) -->
                <line id="scene3-incident-ray-right-1" x1="440" y1="160" x2="560" y2="320" stroke="#1565c0" stroke-width="2" marker-end="url(#scene3-arrow-blue)"/>
                <line id="scene3-incident-ray-right-2" x1="480" y1="160" x2="600" y2="320" stroke="#1565c0" stroke-width="2" marker-end="url(#scene3-arrow-blue)"/>
                <line id="scene3-incident-ray-right-3" x1="520" y1="160" x2="640" y2="320" stroke="#1565c0" stroke-width="2" marker-end="url(#scene3-arrow-blue)"/>

                <!-- Reflected rays (red, parallel/specular) -->
                <line id="scene3-reflect-ray-right-1" x1="560" y1="320" x2="720" y2="80" stroke="#c62828" stroke-width="2" marker-end="url(#scene3-arrow-red)"/>
                <line id="scene3-reflect-ray-right-2" x1="600" y1="320" x2="760" y2="80" stroke="#c62828" stroke-width="2" marker-end="url(#scene3-arrow-red)"/>
                <line id="scene3-reflect-ray-right-3" x1="640" y1="320" x2="800" y2="80" stroke="#c62828" stroke-width="2" marker-end="url(#scene3-arrow-red)"/>

                <!-- Eye icons: green visible at (720, 180), gray invisible at (720, 400) -->
                <!-- Eye 1 (visible) -->
                <g transform="translate(720, 180)">
                    <ellipse cx="0" cy="0" rx="15" ry="10" fill="#2e7d32" stroke="#000000" stroke-width="1"/>
                    <circle cx="0" cy="0" r="5" fill="#ffffff"/>
                    <circle cx="2" cy="0" r="2" fill="#000000"/>
                </g>
                <!-- Eye 2 (invisible) -->
                <g transform="translate(720, 400)">
                    <ellipse cx="0" cy="0" rx="15" ry="10" fill="#bdbdbd" stroke="#000000" stroke-width="1"/>
                    <circle cx="0" cy="0" r="5" fill="#ffffff"/>
                    <circle cx="2" cy="0" r="2" fill="#000000"/>
                </g>

                <!-- Labels -->
                <text x="660" y="65" font-size="14" fill="#000000">反射光</text>
                <text x="590" y="385" text-anchor="middle" font-size="13" fill="#000000">只有在特定方向才能看到</text>
                <text x="740" y="65" font-size="12" fill="#000000">可见</text>
                <text x="740" y="385" font-size="12" fill="#000000">不可见</text>
                <text x="590" y="425" text-anchor="middle" font-size="14" fill="#000000">镜面反射 → 不适合做光屏</text>
            </g>
        </svg>

        <div id="scene3-controls">
            <button id="scene3-btn-rough" class="active">粗糙光屏（漫反射）</button>
            <button id="scene3-btn-smooth">光滑玻璃板（镜面反射）</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 3: Diffuse vs Specular Reflection
        var currentState = 1; // 1 = rough (diffuse), 2 = smooth (specular)

        var leftPanel = document.getElementById('scene3-left-panel');
        var rightPanel = document.getElementById('scene3-right-panel');
        var btnRough = document.getElementById('scene3-btn-rough');
        var btnSmooth = document.getElementById('scene3-btn-smooth');

        function setState(state) {
            currentState = state;
            if (state === 1) {
                leftPanel.style.opacity = '1.0';
                rightPanel.style.opacity = '0.25';
                btnRough.classList.add('active');
                btnSmooth.classList.remove('active');
            } else {
                leftPanel.style.opacity = '0.25';
                rightPanel.style.opacity = '1.0';
                btnRough.classList.remove('active');
                btnSmooth.classList.add('active');
            }
        }

        btnRough.addEventListener('click', function() { setState(1); });
        btnSmooth.addEventListener('click', function() { setState(2); });

        // Initialize
        setState(1);
    })();
    </script>
</body>
</html>
