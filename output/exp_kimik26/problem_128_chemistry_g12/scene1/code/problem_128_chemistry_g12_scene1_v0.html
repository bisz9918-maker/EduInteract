<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>正三棱柱晶胞</title>
<style>
body{margin:0;padding:0;background:#fff;font-family:"Microsoft YaHei","PingFang SC",sans-serif;overflow:hidden}
#scene1-container{position:relative;width:800px;height:500px;background:#fff;margin:0 auto;overflow:hidden}
#scene1-svg{position:absolute;top:0;left:0}
#scene1-step-text{position:absolute;left:200px;top:20px;width:400px;height:28px;line-height:28px;text-align:center;font-size:16px;font-weight:bold;color:#1565c0;pointer-events:none;z-index:10}
#scene1-legend-box{position:absolute;left:660px;top:348px;width:120px;height:88px;background:rgba(255,255,255,.92);border:1px solid #eee;border-radius:4px;padding:7px 10px;box-sizing:border-box;pointer-events:none;z-index:10}
.scene1-legend-item{display:flex;align-items:center;height:22px;font-size:13px;color:#333;transition:opacity .3s}
.scene1-legend-icon{margin-right:6px;flex-shrink:0}
#scene1-controls{position:absolute;bottom:20px;left:0;right:0;display:flex;justify-content:center;gap:20px;z-index:10}
#scene1-controls button{width:95px;height:32px;font-size:14px;border:1px solid #ccc;border-radius:4px;background:#f5f5f5;cursor:pointer;transition:all .2s}
#scene1-controls button:hover:not(:disabled){background:#e0e0e0}
#scene1-controls button:disabled{opacity:.4;cursor:not-allowed}
</style>
</head>
<body>
<div id="scene1-container">
<svg id="scene1-svg" width="800" height="500">
<!-- Prism wireframe -->
<g id="prism-frame">
<!-- Bottom face (dashed, behind) -->
<polyline points="400,200 280,320 520,320 400,200" fill="none" stroke="#888888" stroke-width="1.5" stroke-dasharray="6,4"/>
<!-- Side edges -->
<line x1="400" y1="80" x2="400" y2="200" stroke="#000000" stroke-width="2"/>
<line x1="310" y1="180" x2="280" y2="320" stroke="#000000" stroke-width="2"/>
<line x1="490" y1="180" x2="520" y2="320" stroke="#000000" stroke-width="2"/>
<!-- Top face (solid, front) -->
<polyline points="400,80 310,180 490,180 400,80" fill="none" stroke="#000000" stroke-width="2"/>
</g>

<!-- A particles (vertices) -->
<g id="group-a" style="display:none">
<circle cx="400" cy="80" r="10" fill="#1565c0"/><text x="400" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#000">A</text>
<circle cx="310" cy="180" r="10" fill="#1565c0"/><text x="296" y="184" text-anchor="end" font-size="13" font-weight="bold" fill="#000">A</text>
<circle cx="490" cy="180" r="10" fill="#1565c0"/><text x="504" y="184" text-anchor="start" font-size="13" font-weight="bold" fill="#000">A</text>
<circle cx="400" cy="200" r="10" fill="#1565c0"/><text x="400" y="220" text-anchor="middle" font-size="13" font-weight="bold" fill="#000">A</text>
<circle cx="280" cy="320" r="10" fill="#1565c0"/><text x="266" y="324" text-anchor="end" font-size="13" font-weight="bold" fill="#000">A</text>
<circle cx="520" cy="320" r="10" fill="#1565c0"/><text x="534" y="324" text-anchor="start" font-size="13" font-weight="bold" fill="#000">A</text>
</g>

<!-- B particles (edge midpoints) -->
<g id="group-b" style="display:none">
<!-- Side edges -->
<circle cx="400" cy="140" r="6" fill="#c62828"/><text x="412" y="144" text-anchor="start" font-size="12" font-weight="bold" fill="#000">B</text>
<circle cx="295" cy="250" r="6" fill="#c62828"/><text x="307" y="254" text-anchor="start" font-size="12" font-weight="bold" fill="#000">B</text>
<circle cx="505" cy="250" r="6" fill="#c62828"/><text x="517" y="254" text-anchor="start" font-size="12" font-weight="bold" fill="#000">B</text>
<!-- Top face edges -->
<circle cx="355" cy="130" r="6" fill="#c62828"/><text x="355" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#000">B</text>
<circle cx="400" cy="180" r="6" fill="#c62828"/><text x="400" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#000">B</text>
<circle cx="445" cy="130" r="6" fill="#c62828"/><text x="445" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#000">B</text>
<!-- Bottom face edges -->
<circle cx="340" cy="260" r="6" fill="#c62828"/><text x="340" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#000">B</text>
<circle cx="400" cy="320" r="6" fill="#c62828"/><text x="400" y="338" text-anchor="middle" font-size="12" font-weight="bold" fill="#000">B</text>
<circle cx="460" cy="260" r="6" fill="#c62828"/><text x="460" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#000">B</text>
</g>

<!-- C particles (internal) -->
<g id="group-c" style="display:none">
<circle cx="400" cy="150" r="8" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
<text x="385" y="154" text-anchor="end" font-size="12" font-weight="bold" fill="#000">C</text>
<circle cx="400" cy="270" r="8" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
<text x="385" y="274" text-anchor="end" font-size="12" font-weight="bold" fill="#000">C</text>
</g>
</svg>

<div id="scene1-step-text">正三棱柱晶胞 — 拖拽旋转观察结构</div>
<div id="scene1-legend-box">
<div class="scene1-legend-item" id="scene1-legend-a"><svg class="scene1-legend-icon" width="12" height="12"><circle cx="6" cy="6" r="6" fill="#1565c0"/></svg><span>A 顶点</span></div>
<div class="scene1-legend-item" id="scene1-legend-b"><svg class="scene1-legend-icon" width="12" height="12"><circle cx="6" cy="6" r="4" fill="#c62828"/></svg><span>B 棱上</span></div>
<div class="scene1-legend-item" id="scene1-legend-c"><svg class="scene1-legend-icon" width="12" height="12"><circle cx="6" cy="6" r="5" fill="none" stroke="#2e7d32" stroke-width="1.5"/></svg><span>C 内部</span></div>
</div>
<div id="scene1-controls">
<button id="scene1-btn-prev" disabled>◀ 上一步</button>
<button id="scene1-btn-next">下一步 ▶</button>
</div>
</div>

<script>
(function(){
var cur=0;
var stepText=document.getElementById('scene1-step-text');
var btnPrev=document.getElementById('scene1-btn-prev');
var btnNext=document.getElementById('scene1-btn-next');
var legA=document.getElementById('scene1-legend-a');
var legB=document.getElementById('scene1-legend-b');
var legC=document.getElementById('scene1-legend-c');
var gA=document.getElementById('group-a');
var gB=document.getElementById('group-b');
var gC=document.getElementById('group-c');

var cfg=[
 {t:'正三棱柱晶胞 — 拖拽旋转观察结构',sA:0,sB:0,sC:0,hA:0,hB:0,hC:0,lA:.3,lB:.3,lC:.3},
 {t:'步骤 1/4：顶点微粒 A × 6（每个被6个晶胞共享）',sA:1,sB:0,sC:0,hA:1,hB:0,hC:0,lA:1,lB:.3,lC:.3},
 {t:'步骤 2/4：棱上微粒 B × 9（侧棱×3 + 底面棱×6）',sA:1,sB:1,sC:0,hA:0,hB:1,hC:0,lA:.3,lB:1,lC:.3},
 {t:'步骤 3/4：内部微粒 C × 2（上下两点，投影可能重合）',sA:1,sB:1,sC:1,hA:0,hB:0,hC:1,lA:.3,lB:.3,lC:1},
 {t:'步骤 4/4：晶胞中 A:B:C = 1:4:2',sA:1,sB:1,sC:1,hA:0,hB:0,hC:0,lA:1,lB:1,lC:1}
];

function setDisplay(el,show){el.style.display=show?'block':'none';}
function setHighlight(group,on,color){
 var circles=group.querySelectorAll('circle');
 for(var i=0;i<circles.length;i++){
  var c=circles[i];
  if(on){
   c.setAttribute('stroke',color);
   c.setAttribute('stroke-width','2');
   var r=parseFloat(c.getAttribute('r'));
   c.setAttribute('data-or',r);
   c.setAttribute('r',r*1.2);
  }else{
   var or=c.getAttribute('data-or');
   if(or){c.setAttribute('r',or);}
   c.removeAttribute('stroke');
   c.removeAttribute('stroke-width');
  }
 }
}

function upd(){
 var c=cfg[cur];
 stepText.textContent=c.t;
 btnPrev.disabled=cur===0;
 btnNext.disabled=cur===4;
 legA.style.opacity=c.lA;
 legB.style.opacity=c.lB;
 legC.style.opacity=c.lC;
 setDisplay(gA,c.sA);
 setDisplay(gB,c.sB);
 setDisplay(gC,c.sC);
 setHighlight(gA,c.hA,'#1565c0');
 setHighlight(gB,c.hB,'#c62828');
 setHighlight(gC,c.hC,'#2e7d32');
}

btnPrev.addEventListener('click',function(){if(cur>0){cur--;upd();}});
btnNext.addEventListener('click',function(){if(cur<4){cur++;upd();}});
upd();
})();
</script>
</body>
</html>
