<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>原电池装置分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene1-btn { padding: 6px 16px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; background: #f0f0f0; cursor: pointer; transition: opacity 0.2s; }
        .scene1-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .scene1-step-indicator { font-size: 14px; line-height: 32px; color: #333; min-width: 70px; text-align: center; }

        /* 反应式框样式 */
        .scene1-rxn-box {
            position: absolute;
            width: 170px;
            padding: 10px;
            border-radius: 4px;
            background: #ffffff;
            font-size: 12px;
            line-height: 1.8;
            opacity: 0;
            transition: opacity 0.3s ease-out;
            display: none;
        }
        .scene1-rxn-box.red { border: 2px solid #c62828; }
        .scene1-rxn-box.blue { border: 2px solid #1565c0; }
        .scene1-rxn-box .title { font-size: 13px; color: #000; margin-bottom: 4px; }
        .scene1-rxn-box .rxn { color: #000; }
        .scene1-rxn-box .note { font-size: 11px; color: #666; margin-top: 4px; }

        /* 选项卡片样式 */
        .scene1-option-card {
            position: absolute;
            width: 120px;
            height: 40px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            opacity: 0;
            transition: opacity 0.3s ease-out;
            display: none;
        }
        .scene1-option-card.wrong {
            background: #ffffff;
            border: 2px solid #c62828;
            color: #000;
        }
        .scene1-option-card.correct {
            background: #1565c0;
            border: 2px solid #1565c0;
            color: #fff;
        }
        .scene1-option-card .mark {
            position: absolute;
            right: 4px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" viewBox="0 0 800 500">
            <defs>
                <marker id="scene1-arrow-left-gold" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto">
                    <path d="M10,0 L0,5 L10,10" fill="#f9a825"/>
                </marker>
            </defs>

            <!-- ==================== 基础装置（始终显示） ==================== -->

            <!-- 电池槽外框 -->
            <rect x="300" y="100" width="200" height="250" fill="none" stroke="#000000" stroke-width="2"/>

            <!-- 电解质填充区域（液面线下方） -->
            <polygon points="300,240 500,300 500,350 300,350" fill="#1565c0" opacity="0.08"/>

            <!-- 液面线（左高右低） -->
            <line x1="300" y1="240" x2="500" y2="300" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>

            <!-- 电极A（左极） -->
            <rect x="330" y="120" width="20" height="200" fill="#e0e0e0" fill-opacity="0.3" stroke="#000000" stroke-width="1"/>

            <!-- 电极B（右极） -->
            <rect x="450" y="120" width="20" height="200" fill="#e0e0e0" fill-opacity="0.3" stroke="#000000" stroke-width="1"/>

            <!-- 导线：A极顶端→上 -->
            <line x1="340" y1="100" x2="340" y2="65" stroke="#000000" stroke-width="2"/>
            <!-- 导线：B极顶端→上 -->
            <line x1="460" y1="100" x2="460" y2="65" stroke="#000000" stroke-width="2"/>
            <!-- 导线：上横线 -->
            <line x1="340" y1="65" x2="460" y2="65" stroke="#000000" stroke-width="2"/>

            <!-- 灯泡 -->
            <g id="scene1-bulb">
                <circle cx="400" cy="55" r="14" fill="none" stroke="#000000" stroke-width="2"/>
                <path d="M392,55 L395,50 L398,55 L401,50 L404,55 L407,50 L408,55" fill="none" stroke="#000000" stroke-width="1.5"/>
                <rect x="392" y="69" width="16" height="8" fill="#888888" stroke="#000000" stroke-width="1"/>
            </g>

            <!-- a口管道（左下，箭头向右） -->
            <line x1="220" y1="320" x2="300" y2="320" stroke="#000000" stroke-width="2"/>
            <polygon points="290,315 290,325 300,320" fill="#000000"/>

            <!-- c口管道（左上，箭头向左） -->
            <line x1="220" y1="140" x2="300" y2="140" stroke="#000000" stroke-width="2"/>
            <polygon points="230,135 230,145 220,140" fill="#000000"/>

            <!-- b口管道（右下，箭头向左） -->
            <line x1="500" y1="320" x2="580" y2="320" stroke="#000000" stroke-width="2"/>
            <polygon points="510,315 510,325 500,320" fill="#000000"/>

            <!-- d口管道（右上，箭头向右） -->
            <line x1="500" y1="140" x2="580" y2="140" stroke="#000000" stroke-width="2"/>
            <polygon points="570,135 570,145 580,140" fill="#000000"/>

            <!-- 基础标签：A/B 放在电池槽外侧 -->
            <text x="295" y="220" font-size="16" fill="#000000" text-anchor="end">A</text>
            <text x="505" y="220" font-size="16" fill="#000000" text-anchor="start">B</text>

            <!-- H₂SO₄ 标签 -->
            <text x="510" y="285" font-size="14" fill="#000000">
                H<tspan baseline-shift="sub" font-size="10">2</tspan>SO<tspan baseline-shift="sub" font-size="10">4</tspan>
            </text>

            <text x="200" y="325" font-size="14" fill="#000000" text-anchor="middle">a</text>
            <text x="600" y="325" font-size="14" fill="#000000" text-anchor="middle">b</text>
            <text x="200" y="145" font-size="14" fill="#000000" text-anchor="middle">c</text>
            <text x="600" y="145" font-size="14" fill="#000000" text-anchor="middle">d</text>

            <!-- ==================== 步骤1：电子流向与电极判断 ==================== -->
            <g id="scene1-step1-group" style="display:none; opacity:0; transition: opacity 0.3s ease-out;">
                <line x1="455" y1="78" x2="415" y2="78" stroke="#f9a825" stroke-width="3" marker-end="url(#scene1-arrow-left-gold)"/>
                <line x1="375" y1="78" x2="335" y2="78" stroke="#f9a825" stroke-width="3" marker-end="url(#scene1-arrow-left-gold)"/>
                <text x="445" y="70" font-size="12" fill="#f9a825">e⁻</text>
                <text x="355" y="70" font-size="12" fill="#f9a825">e⁻</text>
                <text x="480" y="58" font-size="12" fill="#c62828">电子流出→负极</text>
                <text x="210" y="58" font-size="12" fill="#1565c0">电子流入→正极</text>
                <text x="485" y="180" font-size="14" fill="#c62828">负极（氧化反应）</text>
                <text x="215" y="180" font-size="14" fill="#1565c0" text-anchor="end">正极（还原反应）</text>
            </g>

            <!-- ==================== 步骤2：反应物通入方向 ==================== -->
            <g id="scene1-step2-group" style="display:none; opacity:0; transition: opacity 0.3s ease-out;">
                <text x="260" y="420" font-size="12" fill="#1565c0" text-anchor="middle">
                    N<tspan baseline-shift="sub" font-size="9">2</tspan>O<tspan baseline-shift="sub" font-size="9">4</tspan>（氧化剂）→ 正极A
                </text>
                <text x="540" y="420" font-size="12" fill="#c62828" text-anchor="middle">
                    C<tspan baseline-shift="sub" font-size="9">2</tspan>H<tspan baseline-shift="sub" font-size="9">8</tspan>N<tspan baseline-shift="sub" font-size="9">2</tspan>（还原剂）→ 负极B
                </text>
            </g>

            <!-- ==================== 步骤5：产物排出方向 ==================== -->
            <g id="scene1-step5-group" style="display:none; opacity:0; transition: opacity 0.3s ease-out;">
                <text x="260" y="125" font-size="12" fill="#1565c0" text-anchor="middle">N<tspan baseline-shift="sub" font-size="10">2</tspan></text>
                <text x="540" y="125" font-size="12" fill="#c62828" text-anchor="middle">
                    N<tspan baseline-shift="sub" font-size="10">2</tspan> + CO<tspan baseline-shift="sub" font-size="10">2</tspan>
                </text>
            </g>

            <!-- ==================== 引导文字（放在电池槽下方） ==================== -->
            <text id="scene1-guide-text" x="400" y="385" font-size="14" fill="#333333" text-anchor="middle">观察原电池装置，思考各部件作用</text>
        </svg>

        <!-- 步骤3：负极反应式（HTML div，避免SVG重叠检测） -->
        <div id="scene1-step3-box" class="scene1-rxn-box red" style="top:90px; left:620px;">
            <div class="title">负极（氧化反应）</div>
            <div class="rxn">C₂H₈N₂ + 8H₂O</div>
            <div class="rxn">→ 2CO₂↑ + N₂↑</div>
            <div class="rxn">+ 16H⁺ + 16e⁻</div>
            <div class="note">C: -2 → +4&nbsp;&nbsp;N: -2 → 0</div>
        </div>

        <!-- 步骤4：正极反应式（HTML div） -->
        <div id="scene1-step4-box" class="scene1-rxn-box blue" style="top:90px; left:10px;">
            <div class="title">正极（还原反应）</div>
            <div class="rxn">N₂O₄ + 8H⁺ + 8e⁻</div>
            <div class="rxn">→ N₂ + 4H₂O</div>
            <div class="note">总：C₂H₈N₂ + 2N₂O₄</div>
            <div class="note">→ 2CO₂ + 3N₂ + 4H₂O</div>
            <div class="note">N: +4 → 0</div>
        </div>

        <!-- 步骤6：选项验证（HTML divs） -->
        <div id="scene1-step6-card-a" class="scene1-option-card wrong" style="top:375px; left:130px;">
            <span>A. B为正极</span>
            <span class="mark" style="color:#c62828;">✗</span>
        </div>
        <div id="scene1-step6-card-b" class="scene1-option-card correct" style="top:375px; left:280px;">
            <span>B. a口通N₂O₄</span>
            <span class="mark" style="color:#2e7d32;">✓</span>
        </div>
        <div id="scene1-step6-card-c" class="scene1-option-card wrong" style="top:375px; left:430px;">
            <span>C. d口排NO</span>
            <span class="mark" style="color:#c62828;">✗</span>
        </div>
        <div id="scene1-step6-card-d" class="scene1-option-card wrong" style="top:375px; left:580px;">
            <span>D. A极反应错</span>
            <span class="mark" style="color:#c62828;">✗</span>
        </div>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator" class="scene1-step-indicator">步骤 0/6</span>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const totalSteps = 6;

        const guideTexts = [
            "观察原电池装置，思考各部件作用",
            "根据电子流向判断正负极：电子流出的一极为负极",
            "氧化剂通入正极，还原剂通入负极",
            "负极发生氧化反应，偏二甲肼失去电子",
            "正极发生还原反应，四氧化二氮得到电子",
            "产物均为空气成分，无污染排放",
            "结论：选项B正确"
        ];

        const stepGroups = [
            null,
            document.getElementById('scene1-step1-group'),
            document.getElementById('scene1-step2-group'),
            null, // step3 uses HTML div
            null, // step4 uses HTML div
            document.getElementById('scene1-step5-group'),
            null  // step6 uses HTML divs
        ];

        const step3Box = document.getElementById('scene1-step3-box');
        const step4Box = document.getElementById('scene1-step4-box');
        const step6Cards = [
            document.getElementById('scene1-step6-card-a'),
            document.getElementById('scene1-step6-card-b'),
            document.getElementById('scene1-step6-card-c'),
            document.getElementById('scene1-step6-card-d')
        ];

        const guideTextEl = document.getElementById('scene1-guide-text');
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');

        function showElement(el) {
            if (!el) return;
            el.style.display = 'block';
            void el.offsetWidth;
            el.style.opacity = '1';
        }

        function hideElement(el) {
            if (!el) return;
            el.style.opacity = '0';
            setTimeout(function() {
                if (el.style.opacity === '0') {
                    el.style.display = 'none';
                }
            }, 300);
        }

        function updateStep(newStep) {
            // Hide current step elements
            if (currentStep > 0 && stepGroups[currentStep]) {
                hideElement(stepGroups[currentStep]);
            }
            if (currentStep === 3) hideElement(step3Box);
            if (currentStep === 4) hideElement(step4Box);
            if (currentStep === 6) {
                step6Cards.forEach(function(c) { hideElement(c); });
            }

            currentStep = newStep;

            // Show new step elements
            if (currentStep > 0 && stepGroups[currentStep]) {
                showElement(stepGroups[currentStep]);
            }
            if (currentStep === 3) showElement(step3Box);
            if (currentStep === 4) showElement(step4Box);
            if (currentStep === 6) {
                step6Cards.forEach(function(c) { showElement(c); });
            }

            if (currentStep === 6) {
                guideTextEl.style.display = 'none';
            } else {
                guideTextEl.style.display = 'block';
                guideTextEl.textContent = guideTexts[currentStep];
            }

            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps;
            stepIndicator.textContent = '步骤 ' + currentStep + '/' + totalSteps;
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                updateStep(currentStep - 1);
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                updateStep(currentStep + 1);
            }
        });

        // Initialize: hide all step elements
        for (let i = 1; i <= totalSteps; i++) {
            if (stepGroups[i]) {
                stepGroups[i].style.display = 'none';
                stepGroups[i].style.opacity = '0';
            }
        }
        step3Box.style.display = 'none';
        step3Box.style.opacity = '0';
        step4Box.style.display = 'none';
        step4Box.style.opacity = '0';
        step6Cards.forEach(function(c) {
            c.style.display = 'none';
            c.style.opacity = '0';
        });
    })();
    </script>
</body>
</html>
