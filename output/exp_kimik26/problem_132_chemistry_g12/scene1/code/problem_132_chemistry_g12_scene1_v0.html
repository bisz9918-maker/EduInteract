<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 1 - 罂粟碱分子结构分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: Arial, Helvetica, sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 16px; z-index: 10; }
        #scene1-btn-prev, #scene1-btn-next {
            padding: 6px 16px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px;
            cursor: pointer; background: #f0f0f0; color: #333;
        }
        #scene1-btn-next { background: #1565c0; color: #fff; border-color: #1565c0; }
        #scene1-btn-prev:disabled, #scene1-btn-next:disabled {
            opacity: 0.5; cursor: not-allowed;
        }
        #scene1-step-indicator { font-size: 14px; color: #666; min-width: 80px; text-align: center; }
        .scene1-fade { transition: opacity 0.3s ease; }
        .scene1-scale { transition: transform 0.3s ease; }

        /* 原子计数面板 - HTML div 绝对定位在 SVG 外部 */
        #scene1-atom-panel {
            position: absolute; left: 540px; top: 250px; width: 200px;
            background: #f5f5f5; border: 1px solid #cccccc; border-radius: 4px;
            padding: 12px 16px; display: none; z-index: 5;
        }
        #scene1-atom-panel h4 { margin: 0 0 10px 0; font-size: 15px; text-align: center; color: #000; }
        #scene1-atom-panel p { margin: 6px 0; font-size: 14px; color: #000; opacity: 0; transition: opacity 0.2s; }
        #scene1-atom-panel p.show { opacity: 1; }
        #scene1-atom-panel .formula { margin-top: 10px; font-size: 16px; font-weight: bold; text-align: center; color: #000; opacity: 0; transition: opacity 0.2s; }
        #scene1-atom-panel .formula.show { opacity: 1; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <!-- 原子计数面板（HTML div，步骤3显示） -->
        <div id="scene1-atom-panel">
            <h4>原子计数</h4>
            <p id="scene1-line-c">C：9 + 7 + 4 = 20</p>
            <p id="scene1-line-h">H：4 + 5 + 12 = 21</p>
            <p id="scene1-line-n">N：1</p>
            <p id="scene1-line-o">O：4</p>
            <div id="scene1-line-formula" class="formula">C₂₀H₂₁NO₄</div>
        </div>

        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <defs>
                <style>
                    .scene1-bond { stroke: #000; stroke-width: 2; fill: none; }
                    .scene1-label { font-size: 14px; fill: #000; font-family: Arial, Helvetica, sans-serif; }
                    .scene1-label-bold { font-size: 16px; fill: #000; font-family: Arial, Helvetica, sans-serif; font-weight: bold; }
                    .scene1-label-large { font-size: 18px; fill: #000; font-family: Arial, Helvetica, sans-serif; font-weight: bold; }
                    .scene1-h-circle { fill: #c62828; }
                </style>
            </defs>

            <!-- ==================== 完整分子结构 ==================== -->
            <g id="scene1-molecule" class="scene1-fade">
                <!-- 左下苯环（异喹啉苯并部分） -->
                <polygon points="320,236 341,236 341,284 320,284 299,272 299,248" class="scene1-bond"/>
                <!-- 内部双键 -->
                <line x1="299" y1="248" x2="320" y2="236" class="scene1-bond"/>
                <line x1="299" y1="272" x2="320" y2="284" class="scene1-bond"/>

                <!-- 右下吡啶环 -->
                <polygon points="362,236 383,248 383,272 362,284 341,284 341,236" class="scene1-bond"/>
                <!-- 内部双键 -->
                <line x1="362" y1="236" x2="383" y2="248" class="scene1-bond"/>
                <line x1="383" y1="272" x2="362" y2="284" class="scene1-bond"/>

                <!-- N 原子 -->
                <text x="362" y="304" class="scene1-label" text-anchor="middle">N</text>

                <!-- 左上 OCH3 键 -->
                <line x1="299" y1="248" x2="280" y2="248" class="scene1-bond"/>
                <text x="265" y="252" class="scene1-label" text-anchor="end">OCH₃</text>

                <!-- 左下 OCH3 键 -->
                <line x1="299" y1="272" x2="280" y2="272" class="scene1-bond"/>
                <text x="265" y="276" class="scene1-label" text-anchor="end">OCH₃</text>

                <!-- CH2 桥 -->
                <line x1="362" y1="236" x2="420" y2="209" class="scene1-bond"/>
                <text x="391" y="208" class="scene1-label" text-anchor="middle">CH₂</text>

                <!-- 上方苯环（苄基） -->
                <polygon points="420,161 441,173 441,197 420,209 399,197 399,173" class="scene1-bond"/>
                <!-- 内部双键 -->
                <line x1="399" y1="173" x2="420" y2="161" class="scene1-bond"/>
                <line x1="441" y1="197" x2="420" y2="209" class="scene1-bond"/>

                <!-- 顶部 OCH3 键 -->
                <line x1="420" y1="161" x2="420" y2="148" class="scene1-bond"/>
                <text x="420" y="140" class="scene1-label" text-anchor="middle">OCH₃</text>

                <!-- 右侧 OCH3 键 -->
                <line x1="441" y1="197" x2="455" y2="197" class="scene1-bond"/>
                <text x="465" y="201" class="scene1-label" text-anchor="start">OCH₃</text>
            </g>

            <!-- ==================== 高亮区域 ==================== -->
            <!-- 异喹啉母核高亮（步骤1） -->
            <g id="scene1-highlight-isoquinoline" class="scene1-fade" style="display:none">
                <path d="M 285,225 L 430,225 L 430,300 L 285,300 Z" fill="#1565c0" fill-opacity="0.15"/>
                <text x="450" y="254" class="scene1-label" text-anchor="start">异喹啉母核</text>
            </g>

            <!-- 苄基侧链高亮（步骤2） -->
            <g id="scene1-highlight-benzyl" class="scene1-fade" style="display:none">
                <path d="M 380,150 L 510,150 L 510,240 L 380,240 Z" fill="#2e7d32" fill-opacity="0.15"/>
                <text x="520" y="174" class="scene1-label" text-anchor="start">3,4-二甲氧基苄基</text>
                <text x="520" y="194" class="scene1-label" text-anchor="start">甲氧基取代基</text>
            </g>

            <!-- 甲氧基高亮（步骤2） -->
            <g id="scene1-highlight-och3" class="scene1-fade" style="display:none">
                <circle cx="265" cy="252" r="6" fill="#c62828" fill-opacity="0.2"/>
                <circle cx="265" cy="276" r="6" fill="#c62828" fill-opacity="0.2"/>
                <circle cx="420" cy="140" r="6" fill="#c62828" fill-opacity="0.2"/>
                <circle cx="465" cy="201" r="6" fill="#c62828" fill-opacity="0.2"/>
            </g>

            <!-- ==================== 左侧苯环氢标记（步骤4） ==================== -->
            <g id="scene1-group-left-ring" class="scene1-fade" style="display:none">
                <g id="scene1-left-ring-scale" class="scene1-scale">
                    <!-- 5-H 圆圈在上顶点 (320,236) -->
                    <circle cx="320" cy="236" r="6" class="scene1-h-circle"/>
                    <text x="320" y="222" class="scene1-label" text-anchor="middle">5-H</text>

                    <!-- 8-H 圆圈在下顶点 (320,284) -->
                    <circle cx="320" cy="284" r="6" class="scene1-h-circle"/>
                    <text x="320" y="304" class="scene1-label" text-anchor="middle">8-H</text>
                </g>
                <!-- 说明文字 -->
                <text x="400" y="365" class="scene1-label" text-anchor="middle">左侧苯环可取代位：5-H、8-H，二者化学环境不同，贡献2种一溴代物</text>
            </g>

            <!-- ==================== 右侧苯环氢标记（步骤5） ==================== -->
            <g id="scene1-group-right-ring" class="scene1-fade" style="display:none">
                <g id="scene1-right-ring-scale" class="scene1-scale">
                    <!-- 2'-H 圆圈在右下顶点 (441,197) -->
                    <circle cx="441" cy="197" r="6" class="scene1-h-circle"/>
                    <text x="455" y="220" class="scene1-label" text-anchor="start">2'-H</text>

                    <!-- 5'-H 圆圈在左上顶点 (399,173) -->
                    <circle cx="399" cy="173" r="6" class="scene1-h-circle"/>
                    <text x="375" y="165" class="scene1-label" text-anchor="end">5'-H</text>

                    <!-- 6'-H 圆圈在左下顶点 (399,197) -->
                    <circle cx="399" cy="197" r="6" class="scene1-h-circle"/>
                    <text x="375" y="201" class="scene1-label" text-anchor="end">6'-H</text>
                </g>
                <!-- 说明文字 -->
                <text x="400" y="365" class="scene1-label" text-anchor="middle">右侧苯环可取代位：2'-H、5'-H、6'-H，三者彼此不等价，贡献3种一溴代物</text>
            </g>

            <!-- ==================== 汇总结论（步骤6） ==================== -->
            <g id="scene1-summary" class="scene1-fade" style="display:none">
                <text x="400" y="330" class="scene1-label-bold" text-anchor="middle">一溴代物同分异构体总数</text>
                <text x="400" y="365" class="scene1-label-large" text-anchor="middle">2 + 3 = 5 种</text>
                <text x="400" y="400" class="scene1-label" text-anchor="middle">1 mol 该化合物完全燃烧消耗 O₂：23.25 mol</text>
                <text x="400" y="435" class="scene1-label-bold" text-anchor="middle" fill="#1565c0">正确答案：A</text>
            </g>
        </svg>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 0 / 6</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        var currentStep = 0;
        var totalSteps = 6;

        // 获取元素
        var btnPrev = document.getElementById('scene1-btn-prev');
        var btnNext = document.getElementById('scene1-btn-next');
        var indicator = document.getElementById('scene1-step-indicator');
        var molecule = document.getElementById('scene1-molecule');
        var highlightIso = document.getElementById('scene1-highlight-isoquinoline');
        var highlightBenzyl = document.getElementById('scene1-highlight-benzyl');
        var highlightOch3 = document.getElementById('scene1-highlight-och3');
        var atomPanel = document.getElementById('scene1-atom-panel');
        var lineC = document.getElementById('scene1-line-c');
        var lineH = document.getElementById('scene1-line-h');
        var lineN = document.getElementById('scene1-line-n');
        var lineO = document.getElementById('scene1-line-o');
        var lineFormula = document.getElementById('scene1-line-formula');
        var leftRing = document.getElementById('scene1-group-left-ring');
        var leftRingScale = document.getElementById('scene1-left-ring-scale');
        var rightRing = document.getElementById('scene1-group-right-ring');
        var rightRingScale = document.getElementById('scene1-right-ring-scale');
        var summary = document.getElementById('scene1-summary');

        var animTimer = null;

        function cancelAnim() {
            if (animTimer) {
                clearTimeout(animTimer);
                animTimer = null;
            }
        }

        function show(el) {
            if (el) { el.style.display = 'block'; el.style.opacity = '1'; }
        }
        function hide(el) {
            if (el) { el.style.display = 'none'; }
        }
        function setOpacity(el, val) {
            if (el) el.style.opacity = val;
        }

        function resetAll() {
            cancelAnim();
            setOpacity(molecule, 1);
            hide(highlightIso);
            hide(highlightBenzyl);
            hide(highlightOch3);
            hide(atomPanel);
            lineC.classList.remove('show');
            lineH.classList.remove('show');
            lineN.classList.remove('show');
            lineO.classList.remove('show');
            lineFormula.classList.remove('show');
            hide(leftRing);
            hide(rightRing);
            hide(summary);
            leftRingScale.setAttribute('transform', '');
            rightRingScale.setAttribute('transform', '');
        }

        function renderStep() {
            resetAll();
            indicator.textContent = '步骤 ' + currentStep + ' / ' + totalSteps;
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps);
            btnNext.textContent = (currentStep === totalSteps) ? '完成' : '下一步 ▶';

            switch (currentStep) {
                case 0:
                    show(molecule);
                    break;

                case 1:
                    setOpacity(molecule, 0.3);
                    show(highlightIso);
                    break;

                case 2:
                    setOpacity(molecule, 0.3);
                    show(highlightBenzyl);
                    show(highlightOch3);
                    break;

                case 3:
                    show(molecule);
                    show(atomPanel);
                    animTimer = setTimeout(function() {
                        lineC.classList.add('show');
                        animTimer = setTimeout(function() {
                            lineH.classList.add('show');
                            animTimer = setTimeout(function() {
                                lineN.classList.add('show');
                                animTimer = setTimeout(function() {
                                    lineO.classList.add('show');
                                    animTimer = setTimeout(function() {
                                        lineFormula.classList.add('show');
                                        animTimer = null;
                                    }, 200);
                                }, 200);
                            }, 200);
                        }, 200);
                    }, 200);
                    break;

                case 4:
                    setOpacity(molecule, 0.3);
                    show(leftRing);
                    leftRingScale.setAttribute('transform', 'translate(320,260) scale(1.1) translate(-320,-260)');
                    break;

                case 5:
                    setOpacity(molecule, 0.3);
                    show(rightRing);
                    rightRingScale.setAttribute('transform', 'translate(420,185) scale(1.1) translate(-420,-185)');
                    break;

                case 6:
                    show(molecule);
                    show(summary);
                    break;
            }
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                renderStep();
            }
        });

        renderStep();
    })();
    </script>
</body>
</html>
