<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 氢氧混合气体反应计算</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 16px; z-index: 10; }
        #scene2-controls button {
            padding: 6px 18px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            background: #1565c0;
            color: #ffffff;
            cursor: pointer;
            font-family: inherit;
        }
        #scene2-controls button:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }
        #scene2-step-indicator {
            font-size: 13px;
            color: #333333;
            min-width: 50px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 步骤0：初始条件 -->
            <g id="scene2-step0">
                <!-- 容器外框（四段线） -->
                <line x1="80" y1="60" x2="320" y2="60" stroke="#000000" stroke-width="2"/>
                <line x1="80" y1="130" x2="320" y2="130" stroke="#000000" stroke-width="2"/>
                <line x1="80" y1="60" x2="80" y2="130" stroke="#000000" stroke-width="2"/>
                <line x1="320" y1="60" x2="320" y2="130" stroke="#000000" stroke-width="2"/>
                <!-- 活塞虚线 -->
                <line x1="200" y1="60" x2="200" y2="130" stroke="#000000" stroke-width="2" stroke-dasharray="5,3"/>
                <!-- 左侧空气文字 -->
                <text x="140" y="100" text-anchor="middle" font-size="14" fill="#000000">空气</text>
                <!-- 右侧混合气文字 -->
                <text x="260" y="100" text-anchor="middle" font-size="14" fill="#000000">O<tspan baseline-shift="sub" font-size="0.7em">2</tspan>、H<tspan baseline-shift="sub" font-size="0.7em">2</tspan>的混合气</text>
                <!-- 体积标注 -->
                <text x="135" y="155" text-anchor="middle" font-size="16" fill="#1565c0" font-weight="bold">1</text>
                <text x="265" y="155" text-anchor="middle" font-size="16" fill="#1565c0" font-weight="bold">3</text>
                <!-- 活塞标注 -->
                <text x="200" y="155" text-anchor="middle" font-size="12" fill="#888888">活塞</text>
                <!-- 右侧比例式 -->
                <text x="420" y="75" text-anchor="start" font-size="16" fill="#1565c0">n(空气)∶n(混) = 1∶3</text>
                <text x="420" y="112" text-anchor="start" font-size="14" fill="#000000">设 n(空气) = 1 mol</text>
                <text x="420" y="149" text-anchor="start" font-size="14" fill="#000000">设 n(混) = 3 mol</text>
            </g>

            <!-- 步骤1：压强推导 -->
            <g id="scene2-step1" display="none">
                <text x="400" y="65" text-anchor="middle" font-size="18" fill="#1565c0" font-weight="bold">P<tspan baseline-shift="sub" font-size="0.7em">1</tspan>V<tspan baseline-shift="sub" font-size="0.7em">1</tspan>/n<tspan baseline-shift="sub" font-size="0.7em">1</tspan> = P<tspan baseline-shift="sub" font-size="0.7em">2</tspan>V<tspan baseline-shift="sub" font-size="0.7em">2</tspan>/n<tspan baseline-shift="sub" font-size="0.7em">2</tspan></text>
                <text x="400" y="115" text-anchor="middle" font-size="14" fill="#000000">左侧空气：V<tspan baseline-shift="sub" font-size="0.7em">1</tspan>=1 → V<tspan baseline-shift="sub" font-size="0.7em">2</tspan>=2（活塞中央），得 P<tspan baseline-shift="sub" font-size="0.7em">2</tspan> = P<tspan baseline-shift="sub" font-size="0.7em">1</tspan>/2</text>
                <text x="400" y="160" text-anchor="middle" font-size="14" fill="#000000">由 P<tspan baseline-shift="sub" font-size="0.7em">1</tspan>V<tspan baseline-shift="sub" font-size="0.7em">1</tspan>/n<tspan baseline-shift="sub" font-size="0.7em">1</tspan> = P<tspan baseline-shift="sub" font-size="0.7em">2</tspan>V<tspan baseline-shift="sub" font-size="0.7em">2</tspan>/n<tspan baseline-shift="sub" font-size="0.7em">2</tspan>，左侧 n<tspan baseline-shift="sub" font-size="0.7em">2</tspan> = 1 mol</text>
                <text x="400" y="205" text-anchor="middle" font-size="14" fill="#000000">右侧混合气：P<tspan baseline-shift="sub" font-size="0.7em">1</tspan>·3/3 = (P<tspan baseline-shift="sub" font-size="0.7em">1</tspan>/2)·2/n<tspan baseline-shift="sub" font-size="0.7em">末</tspan></text>
                <!-- n末高亮框（四段线描边） -->
                <line x1="310" y1="230" x2="490" y2="230" stroke="#c62828" stroke-width="2"/>
                <line x1="310" y1="260" x2="490" y2="260" stroke="#c62828" stroke-width="2"/>
                <line x1="310" y1="230" x2="310" y2="260" stroke="#c62828" stroke-width="2"/>
                <line x1="490" y1="230" x2="490" y2="260" stroke="#c62828" stroke-width="2"/>
                <text x="400" y="252" text-anchor="middle" font-size="16" fill="#c62828" font-weight="bold">n<tspan baseline-shift="sub" font-size="0.7em">末</tspan> = 1 mol</text>
            </g>

            <!-- 步骤2：化学方程式 -->
            <g id="scene2-step2" display="none">
                <text x="400" y="85" text-anchor="middle" font-size="16" fill="#000000" font-weight="bold">2H<tspan baseline-shift="sub" font-size="0.7em">2</tspan> + O<tspan baseline-shift="sub" font-size="0.7em">2</tspan> → 2H<tspan baseline-shift="sub" font-size="0.7em">2</tspan>O(l)</text>
                <text x="400" y="135" text-anchor="middle" font-size="14" fill="#c62828">H<tspan baseline-shift="sub" font-size="0.7em">2</tspan>O 为液态，不占气体体积</text>
                <text x="400" y="185" text-anchor="middle" font-size="14" fill="#000000">反应后气体总物质的量减少：3 mol → 1 mol</text>
            </g>

            <!-- 步骤3：H₂过量计算（情况一） -->
            <g id="scene2-step3" display="none">
                <!-- 左计算框（四段线描边） -->
                <line x1="40" y1="160" x2="395" y2="160" stroke="#2e7d32" stroke-width="1.5"/>
                <line x1="40" y1="360" x2="395" y2="360" stroke="#2e7d32" stroke-width="1.5"/>
                <line x1="40" y1="160" x2="40" y2="360" stroke="#2e7d32" stroke-width="1.5"/>
                <line x1="395" y1="160" x2="395" y2="360" stroke="#2e7d32" stroke-width="1.5"/>
                <text x="217" y="195" text-anchor="middle" font-size="16" fill="#2e7d32" font-weight="bold">情况一：H<tspan baseline-shift="sub" font-size="0.7em">2</tspan> 过量</text>
                <text x="217" y="245" text-anchor="middle" font-size="14" fill="#000000">设 O<tspan baseline-shift="sub" font-size="0.7em">2</tspan> = y，H<tspan baseline-shift="sub" font-size="0.7em">2</tspan> = 3 − y</text>
                <text x="217" y="295" text-anchor="middle" font-size="14" fill="#000000">O<tspan baseline-shift="sub" font-size="0.7em">2</tspan> 完全反应，剩余 H<tspan baseline-shift="sub" font-size="0.7em">2</tspan> = (3−y) − 2y = 1</text>
                <text x="217" y="345" text-anchor="middle" font-size="14" fill="#000000">解得 y = 2/3，H<tspan baseline-shift="sub" font-size="0.7em">2</tspan> = 7/3</text>
                <text x="217" y="385" text-anchor="middle" font-size="15" fill="#2e7d32" font-weight="bold">体积比 7∶2 → 选项 ④</text>
            </g>

            <!-- 步骤4：O₂过量计算（情况二） -->
            <g id="scene2-step4" display="none">
                <!-- 右计算框（四段线描边） -->
                <line x1="405" y1="160" x2="760" y2="160" stroke="#6a1b9a" stroke-width="1.5"/>
                <line x1="405" y1="360" x2="760" y2="360" stroke="#6a1b9a" stroke-width="1.5"/>
                <line x1="405" y1="160" x2="405" y2="360" stroke="#6a1b9a" stroke-width="1.5"/>
                <line x1="760" y1="160" x2="760" y2="360" stroke="#6a1b9a" stroke-width="1.5"/>
                <text x="582" y="195" text-anchor="middle" font-size="16" fill="#6a1b9a" font-weight="bold">情况二：O<tspan baseline-shift="sub" font-size="0.7em">2</tspan> 过量</text>
                <text x="582" y="245" text-anchor="middle" font-size="14" fill="#000000">设 H<tspan baseline-shift="sub" font-size="0.7em">2</tspan> = x，O<tspan baseline-shift="sub" font-size="0.7em">2</tspan> = 3 − x</text>
                <text x="582" y="295" text-anchor="middle" font-size="14" fill="#000000">H<tspan baseline-shift="sub" font-size="0.7em">2</tspan> 完全反应，剩余 O<tspan baseline-shift="sub" font-size="0.7em">2</tspan> = (3−x) − x/2 = 1</text>
                <text x="582" y="345" text-anchor="middle" font-size="14" fill="#000000">解得 x = 4/3，O<tspan baseline-shift="sub" font-size="0.7em">2</tspan> = 5/3</text>
                <text x="582" y="385" text-anchor="middle" font-size="15" fill="#6a1b9a" font-weight="bold">体积比 4∶5 → 选项 ③</text>
            </g>

            <!-- 步骤5：结论 -->
            <g id="scene2-step5" display="none">
                <!-- 结论标题 -->
                <text x="400" y="60" text-anchor="middle" font-size="16" fill="#000000" font-weight="bold">结论：两种过量情况</text>
                <!-- 答案高亮框（四段线描边） -->
                <line x1="300" y1="85" x2="500" y2="85" stroke="#c62828" stroke-width="2"/>
                <line x1="300" y1="115" x2="500" y2="115" stroke="#c62828" stroke-width="2"/>
                <line x1="300" y1="85" x2="300" y2="115" stroke="#c62828" stroke-width="2"/>
                <line x1="500" y1="85" x2="500" y2="115" stroke="#c62828" stroke-width="2"/>
                <text x="400" y="106" text-anchor="middle" font-size="18" fill="#c62828" font-weight="bold">答案 C. ③④</text>
                <!-- 左计算框（简化显示） -->
                <line x1="40" y1="160" x2="395" y2="160" stroke="#2e7d32" stroke-width="1.5"/>
                <line x1="40" y1="360" x2="395" y2="360" stroke="#2e7d32" stroke-width="1.5"/>
                <line x1="40" y1="160" x2="40" y2="360" stroke="#2e7d32" stroke-width="1.5"/>
                <line x1="395" y1="160" x2="395" y2="360" stroke="#2e7d32" stroke-width="1.5"/>
                <text x="217" y="195" text-anchor="middle" font-size="16" fill="#2e7d32" font-weight="bold">情况一：H<tspan baseline-shift="sub" font-size="0.7em">2</tspan> 过量</text>
                <text x="217" y="250" text-anchor="middle" font-size="14" fill="#000000">剩余 H<tspan baseline-shift="sub" font-size="0.7em">2</tspan> = 1 mol</text>
                <text x="217" y="305" text-anchor="middle" font-size="14" fill="#000000">V(H<tspan baseline-shift="sub" font-size="0.7em">2</tspan>)∶V(O<tspan baseline-shift="sub" font-size="0.7em">2</tspan>) = 7∶2</text>
                <text x="217" y="350" text-anchor="middle" font-size="15" fill="#2e7d32" font-weight="bold">→ 选项 ④</text>
                <!-- 右计算框（简化显示） -->
                <line x1="405" y1="160" x2="760" y2="160" stroke="#6a1b9a" stroke-width="1.5"/>
                <line x1="405" y1="360" x2="760" y2="360" stroke="#6a1b9a" stroke-width="1.5"/>
                <line x1="405" y1="160" x2="405" y2="360" stroke="#6a1b9a" stroke-width="1.5"/>
                <line x1="760" y1="160" x2="760" y2="360" stroke="#6a1b9a" stroke-width="1.5"/>
                <text x="582" y="195" text-anchor="middle" font-size="16" fill="#6a1b9a" font-weight="bold">情况二：O<tspan baseline-shift="sub" font-size="0.7em">2</tspan> 过量</text>
                <text x="582" y="250" text-anchor="middle" font-size="14" fill="#000000">剩余 O<tspan baseline-shift="sub" font-size="0.7em">2</tspan> = 1 mol</text>
                <text x="582" y="305" text-anchor="middle" font-size="14" fill="#000000">V(H<tspan baseline-shift="sub" font-size="0.7em">2</tspan>)∶V(O<tspan baseline-shift="sub" font-size="0.7em">2</tspan>) = 4∶5</text>
                <text x="582" y="350" text-anchor="middle" font-size="15" fill="#6a1b9a" font-weight="bold">→ 选项 ③</text>
                <!-- 选项区 -->
                <text x="180" y="420" text-anchor="middle" font-size="14" fill="#000000">A. ①②</text>
                <text x="330" y="420" text-anchor="middle" font-size="14" fill="#000000">B. ②④</text>
                <text x="480" y="420" text-anchor="middle" font-size="14" fill="#000000">C. ③④</text>
                <text x="630" y="420" text-anchor="middle" font-size="14" fill="#000000">D. ①③</text>
                <!-- 选项C高亮框（四段线描边） -->
                <line x1="440" y1="405" x2="520" y2="405" stroke="#c62828" stroke-width="2"/>
                <line x1="440" y1="430" x2="520" y2="430" stroke="#c62828" stroke-width="2"/>
                <line x1="440" y1="405" x2="440" y2="430" stroke="#c62828" stroke-width="2"/>
                <line x1="520" y1="405" x2="520" y2="430" stroke="#c62828" stroke-width="2"/>
            </g>

            <!-- 步骤3/4/5 共享的选项区（步骤3、4显示，不高亮） -->
            <g id="scene2-options" display="none">
                <text x="180" y="420" text-anchor="middle" font-size="14" fill="#000000">A. ①②</text>
                <text x="330" y="420" text-anchor="middle" font-size="14" fill="#000000">B. ②④</text>
                <text x="480" y="420" text-anchor="middle" font-size="14" fill="#000000">C. ③④</text>
                <text x="630" y="420" text-anchor="middle" font-size="14" fill="#000000">D. ①③</text>
            </g>
        </svg>

        <div id="scene2-controls">
            <button id="scene2-prev-btn">◀ 上一步</button>
            <span id="scene2-step-indicator">1 / 6</span>
            <button id="scene2-next-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        var state = 0;
        var maxState = 5;

        var stepGroups = [];
        for (var i = 0; i <= maxState; i++) {
            stepGroups.push(document.getElementById('scene2-step' + i));
        }
        var optionsGroup = document.getElementById('scene2-options');
        var prevBtn = document.getElementById('scene2-prev-btn');
        var nextBtn = document.getElementById('scene2-next-btn');
        var indicator = document.getElementById('scene2-step-indicator');

        function updateScene() {
            for (var i = 0; i <= maxState; i++) {
                if (stepGroups[i]) {
                    stepGroups[i].setAttribute('display', 'none');
                }
            }
            if (optionsGroup) {
                optionsGroup.setAttribute('display', 'none');
            }

            if (stepGroups[state]) {
                stepGroups[state].setAttribute('display', 'block');
            }

            if ((state === 3 || state === 4) && optionsGroup) {
                optionsGroup.setAttribute('display', 'block');
            }

            if (prevBtn) {
                prevBtn.disabled = (state === 0);
            }
            if (nextBtn) {
                nextBtn.disabled = (state === maxState);
            }
            if (indicator) {
                indicator.textContent = (state + 1) + ' / ' + (maxState + 1);
            }
        }

        function scene2_prev() {
            if (state > 0) {
                state--;
                updateScene();
            }
        }

        function scene2_next() {
            if (state < maxState) {
                state++;
                updateScene();
            }
        }

        if (prevBtn) {
            prevBtn.addEventListener('click', scene2_prev);
        }
        if (nextBtn) {
            nextBtn.addEventListener('click', scene2_next);
        }

        updateScene();
    })();
    </script>
</body>
</html>
