<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 3 - 立方烷同分异构体分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: Arial, sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene3-controls button { width: 80px; height: 30px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; background: #f0f0f0; border-radius: 4px; }
        #scene3-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene3-step-text { font-size: 14px; color: #333; min-width: 60px; text-align: center; }
        .fade-element { transition: opacity 0.3s ease-in-out; }
        .highlight-transition { transition: stroke 0.2s ease, stroke-width 0.2s ease; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg width="800" height="500" viewBox="0 0 800 500">
            <!-- 立方烷线框 -->
            <g id="scene3-cube-group" class="fade-element">
                <!-- 实线：可见棱 -->
                <!-- 前面四边 -->
                <line x1="120" y1="140" x2="180" y2="140" stroke="#1565c0" stroke-width="2" />
                <line x1="180" y1="140" x2="180" y2="200" stroke="#1565c0" stroke-width="2" />
                <line x1="180" y1="200" x2="120" y2="200" stroke="#1565c0" stroke-width="2" />
                <line x1="120" y1="200" x2="120" y2="140" stroke="#1565c0" stroke-width="2" />
                <!-- 右面可见边 -->
                <line x1="180" y1="140" x2="210" y2="110" stroke="#1565c0" stroke-width="2" />
                <line x1="210" y1="110" x2="210" y2="170" stroke="#1565c0" stroke-width="2" />
                <line x1="210" y1="170" x2="180" y2="200" stroke="#1565c0" stroke-width="2" />
                <!-- 顶面可见边 -->
                <line x1="120" y1="140" x2="150" y2="110" stroke="#1565c0" stroke-width="2" />
                <line x1="150" y1="110" x2="210" y2="110" stroke="#1565c0" stroke-width="2" />
                <!-- 虚线：不可见棱 -->
                <line x1="120" y1="200" x2="150" y2="170" stroke="#1565c0" stroke-width="2" stroke-dasharray="4,4" opacity="0.5" />
                <line x1="150" y1="170" x2="210" y2="170" stroke="#1565c0" stroke-width="2" stroke-dasharray="4,4" opacity="0.5" />
                <line x1="150" y1="170" x2="150" y2="110" stroke="#1565c0" stroke-width="2" stroke-dasharray="4,4" opacity="0.5" />
            </g>

            <!-- 立方烷标签 -->
            <text id="scene3-label-cube-title" x="155" y="95" text-anchor="middle" font-size="16" fill="#000" class="fade-element">C（立方烷）</text>
            <text id="scene3-label-cube-formula" x="155" y="220" text-anchor="middle" font-size="14" fill="#000" class="fade-element">C₈H₈</text>

            <!-- 苯乙烯结构（初始隐藏） -->
            <g id="scene3-styrene-group" class="fade-element" opacity="0">
                <!-- 苯环正六边形 -->
                <polygon id="scene3-benzene-hex" points="560,105 607.6,132.5 607.6,187.5 560,215 512.4,187.5 512.4,132.5" fill="none" stroke="#1565c0" stroke-width="2" />
                <!-- 凯库勒双键1: V1-V2 内侧偏移 -->
                <line x1="564" y1="108" x2="603.6" y2="132.5" stroke="#1565c0" stroke-width="1.5" />
                <!-- 凯库勒双键2: V3-V4 内侧偏移 -->
                <line x1="603.6" y1="187.5" x2="564" y2="212" stroke="#1565c0" stroke-width="1.5" />
                <!-- 凯库勒双键3: V5-V6 内侧偏移 -->
                <line x1="516.4" y1="187.5" x2="516.4" y2="132.5" stroke="#1565c0" stroke-width="1.5" />

                <!-- 乙烯基侧链 -->
                <!-- 单键1: V2到α碳 -->
                <line x1="607.6" y1="132.5" x2="650" y2="132.5" stroke="#1565c0" stroke-width="2" />
                <!-- 碳碳双键上线 -->
                <line id="scene3-vinyl-double-top" class="highlight-transition" x1="650" y1="128.5" x2="695" y2="128.5" stroke="#1565c0" stroke-width="1.5" />
                <!-- 碳碳双键下线 -->
                <line id="scene3-vinyl-double-bottom" class="highlight-transition" x1="650" y1="136.5" x2="695" y2="136.5" stroke="#1565c0" stroke-width="1.5" />
                <!-- 单键2: β碳 -->
                <line x1="695" y1="132.5" x2="735" y2="132.5" stroke="#1565c0" stroke-width="2" />
            </g>

            <!-- 苯乙烯标签（初始隐藏） -->
            <text id="scene3-label-styrene-title" x="560" y="75" text-anchor="middle" font-size="16" fill="#000" class="fade-element" opacity="0">苯乙烯</text>
            <text id="scene3-label-aromatic" x="470" y="160" text-anchor="middle" font-size="14" fill="#000" class="fade-element" opacity="0">芳香烃</text>
            <text id="scene3-label-structure" x="690" y="105" text-anchor="middle" font-size="14" fill="#000" class="fade-element" opacity="0">C₆H₅-CH=CH₂</text>
            <text id="scene3-label-styrene-formula" x="560" y="240" text-anchor="middle" font-size="14" fill="#000" class="fade-element" opacity="0">分子式：C₈H₈</text>
            <text id="scene3-label-double-bond" x="670" y="165" text-anchor="middle" font-size="14" fill="#000" class="fade-element" opacity="0">碳碳双键</text>

            <!-- 烧杯（初始隐藏） -->
            <g id="scene3-beaker-group" class="fade-element" opacity="0">
                <!-- 烧杯轮廓 -->
                <path d="M 220,320 L 280,320 L 272,385 L 228,385 Z" fill="none" stroke="#333" stroke-width="2" />
                <!-- 溶液填充 -->
                <path d="M 222,340 L 278,340 L 271,375 L 229,375 Z" fill="#9c27b0" fill-opacity="0.3" stroke="none" />
            </g>
            <text id="scene3-label-kmno4" x="250" y="310" text-anchor="middle" font-size="14" fill="#000" class="fade-element" opacity="0">酸性 KMnO₄ 溶液</text>

            <!-- 结论标签（初始隐藏） -->
            <text id="scene3-label-fade" x="400" y="350" text-anchor="middle" font-size="16" fill="#2e7d32" class="fade-element" opacity="0">可使酸性高锰酸钾溶液褪色</text>
            <text id="scene3-label-conclusion" x="650" y="380" text-anchor="middle" font-size="18" fill="#2e7d32" font-weight="bold" class="fade-element" opacity="0">选项 C ✓</text>

            <!-- 底部说明文字 -->
            <text id="scene3-bottom-text" x="400" y="415" text-anchor="middle" font-size="14" fill="#333" class="fade-element">立方烷（C）是一种笼状烃，分子式为 C₈H₈</text>
        </svg>

        <div id="scene3-controls">
            <button id="scene3-btn-prev" disabled>◀ 上一步</button>
            <span id="scene3-step-text">步骤 1/5</span>
            <button id="scene3-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 3 实现
        let currentStep = 0;
        const totalSteps = 5;

        const btnPrev = document.getElementById('scene3-btn-prev');
        const btnNext = document.getElementById('scene3-btn-next');
        const stepText = document.getElementById('scene3-step-text');
        const bottomText = document.getElementById('scene3-bottom-text');

        // 元素引用
        const styreneGroup = document.getElementById('scene3-styrene-group');
        const labelStyreneTitle = document.getElementById('scene3-label-styrene-title');
        const labelAromatic = document.getElementById('scene3-label-aromatic');
        const labelStructure = document.getElementById('scene3-label-structure');
        const labelStyreneFormula = document.getElementById('scene3-label-styrene-formula');
        const labelDoubleBond = document.getElementById('scene3-label-double-bond');
        const vinylDoubleTop = document.getElementById('scene3-vinyl-double-top');
        const vinylDoubleBottom = document.getElementById('scene3-vinyl-double-bottom');
        const beakerGroup = document.getElementById('scene3-beaker-group');
        const labelKmno4 = document.getElementById('scene3-label-kmno4');
        const labelFade = document.getElementById('scene3-label-fade');
        const labelConclusion = document.getElementById('scene3-label-conclusion');

        const bottomTexts = [
            "立方烷（C）是一种笼状烃，分子式为 C₈H₈",
            "苯乙烯（C₆H₅-CH=CH₂）与立方烷分子式相同，互为同分异构体，且属于芳香烃",
            "苯乙烯分子中含有碳碳双键（C=C）",
            "碳碳双键可被酸性高锰酸钾溶液氧化",
            "苯乙烯可使酸性 KMnO₄ 溶液褪色，因此选项 C 正确"
        ];

        function setOpacity(el, val) {
            if (el) el.style.opacity = val;
        }

        function renderStep() {
            stepText.textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps - 1;
            bottomText.textContent = bottomTexts[currentStep];

            // 步骤0: 只显示立方烷
            if (currentStep === 0) {
                setOpacity(styreneGroup, 0);
                setOpacity(labelStyreneTitle, 0);
                setOpacity(labelAromatic, 0);
                setOpacity(labelStructure, 0);
                setOpacity(labelStyreneFormula, 0);
                setOpacity(labelDoubleBond, 0);
                setOpacity(beakerGroup, 0);
                setOpacity(labelKmno4, 0);
                setOpacity(labelFade, 0);
                setOpacity(labelConclusion, 0);
                vinylDoubleTop.setAttribute('stroke', '#1565c0');
                vinylDoubleTop.setAttribute('stroke-width', '1.5');
                vinylDoubleBottom.setAttribute('stroke', '#1565c0');
                vinylDoubleBottom.setAttribute('stroke-width', '1.5');
            }
            // 步骤1: 显示苯乙烯
            else if (currentStep === 1) {
                setOpacity(styreneGroup, 1);
                setOpacity(labelStyreneTitle, 1);
                setOpacity(labelAromatic, 1);
                setOpacity(labelStructure, 1);
                setOpacity(labelStyreneFormula, 1);
                setOpacity(labelDoubleBond, 0);
                setOpacity(beakerGroup, 0);
                setOpacity(labelKmno4, 0);
                setOpacity(labelFade, 0);
                setOpacity(labelConclusion, 0);
                vinylDoubleTop.setAttribute('stroke', '#1565c0');
                vinylDoubleTop.setAttribute('stroke-width', '1.5');
                vinylDoubleBottom.setAttribute('stroke', '#1565c0');
                vinylDoubleBottom.setAttribute('stroke-width', '1.5');
            }
            // 步骤2: 高亮双键
            else if (currentStep === 2) {
                setOpacity(styreneGroup, 1);
                setOpacity(labelStyreneTitle, 1);
                setOpacity(labelAromatic, 1);
                setOpacity(labelStructure, 1);
                setOpacity(labelStyreneFormula, 1);
                setOpacity(labelDoubleBond, 1);
                setOpacity(beakerGroup, 0);
                setOpacity(labelKmno4, 0);
                setOpacity(labelFade, 0);
                setOpacity(labelConclusion, 0);
                vinylDoubleTop.setAttribute('stroke', '#c62828');
                vinylDoubleTop.setAttribute('stroke-width', '3');
                vinylDoubleBottom.setAttribute('stroke', '#c62828');
                vinylDoubleBottom.setAttribute('stroke-width', '3');
            }
            // 步骤3: 显示烧杯
            else if (currentStep === 3) {
                setOpacity(styreneGroup, 1);
                setOpacity(labelStyreneTitle, 1);
                setOpacity(labelAromatic, 1);
                setOpacity(labelStructure, 1);
                setOpacity(labelStyreneFormula, 1);
                setOpacity(labelDoubleBond, 1);
                setOpacity(beakerGroup, 1);
                setOpacity(labelKmno4, 1);
                setOpacity(labelFade, 0);
                setOpacity(labelConclusion, 0);
                vinylDoubleTop.setAttribute('stroke', '#c62828');
                vinylDoubleTop.setAttribute('stroke-width', '3');
                vinylDoubleBottom.setAttribute('stroke', '#c62828');
                vinylDoubleBottom.setAttribute('stroke-width', '3');
            }
            // 步骤4: 显示结论
            else if (currentStep === 4) {
                setOpacity(styreneGroup, 1);
                setOpacity(labelStyreneTitle, 1);
                setOpacity(labelAromatic, 1);
                setOpacity(labelStructure, 1);
                setOpacity(labelStyreneFormula, 1);
                setOpacity(labelDoubleBond, 1);
                setOpacity(beakerGroup, 1);
                setOpacity(labelKmno4, 1);
                setOpacity(labelFade, 1);
                setOpacity(labelConclusion, 1);
                vinylDoubleTop.setAttribute('stroke', '#c62828');
                vinylDoubleTop.setAttribute('stroke-width', '3');
                vinylDoubleBottom.setAttribute('stroke', '#c62828');
                vinylDoubleBottom.setAttribute('stroke-width', '3');
            }
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                renderStep();
            }
        });

        // 初始渲染
        renderStep();
    })();
    </script>
</body>
</html>
