<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>溶液导电性实验装置</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            padding: 6px 16px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px;
            background: #e0e0e0; cursor: pointer; color: #333; min-width: 80px;
        }
        #scene1-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 13px; color: #666; min-width: 70px; text-align: center; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- 灯泡发光滤镜 -->
                <filter id="scene1-bulb-glow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
                    <feMerge>
                        <feMergeNode in="blur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
                <!-- 箭头标记 -->
                <marker id="scene1-arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                    <polygon points="0 0, 8 3, 0 6" fill="#1565c0"/>
                </marker>
                <marker id="scene1-arrowhead-electron" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                    <polygon points="0 0, 8 3, 0 6" fill="#1565c0"/>
                </marker>
            </defs>

            <!-- ==================== 左侧实验装置组 ==================== -->
            <g id="scene1-apparatus-group">
                <!-- 电池 -->
                <rect id="scene1-battery-body" x="200" y="60" width="80" height="30" fill="none" stroke="#000" stroke-width="2"/>
                <rect id="scene1-battery-pos" x="275" y="55" width="10" height="10" fill="#c62828" stroke="#000" stroke-width="1"/>
                <rect id="scene1-battery-neg" x="195" y="55" width="10" height="10" fill="#000" stroke="#000" stroke-width="1"/>

                <!-- 导线 -->
                <path id="scene1-wire-l1" d="M200,75 L140,75 L140,218" fill="none" stroke="#000" stroke-width="2"/>
                <path id="scene1-wire-l2" d="M140,262 L140,220 L360,220" fill="none" stroke="#000" stroke-width="2"/>
                <path id="scene1-wire-l3" d="M280,75 L400,75 L400,220" fill="none" stroke="#000" stroke-width="2"/>

                <!-- 电子流动箭头（步骤1显示） -->
                <path id="scene1-electron-arrow1" d="M210,75 L150,75 L150,210" fill="none" stroke="#1565c0" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#scene1-arrowhead-electron)" visibility="hidden"/>
                <path id="scene1-electron-arrow2" d="M150,270 L150,230 L350,230" fill="none" stroke="#1565c0" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#scene1-arrowhead-electron)" visibility="hidden"/>
                <path id="scene1-electron-arrow3" d="M390,230 L390,75 L290,75" fill="none" stroke="#1565c0" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#scene1-arrowhead-electron)" visibility="hidden"/>

                <!-- 灯泡 -->
                <circle id="scene1-bulb-outer" cx="140" cy="240" r="22" fill="none" stroke="#000" stroke-width="2"/>
                <path id="scene1-bulb-filament" d="M130,240 L140,230 L150,240" fill="none" stroke="#000" stroke-width="2"/>
                <circle id="scene1-bulb-fill" cx="140" cy="240" r="20" fill="#f9a825" fill-opacity="0.3"/>

                <!-- 烧杯 -->
                <line id="scene1-beaker-left" x1="320" y1="240" x2="330" y2="380" stroke="#000" stroke-width="2"/>
                <line id="scene1-beaker-right" x1="440" y1="240" x2="430" y2="380" stroke="#000" stroke-width="2"/>
                <line id="scene1-beaker-bottom" x1="330" y1="380" x2="430" y2="380" stroke="#000" stroke-width="2"/>
                <line id="scene1-beaker-top" x1="320" y1="240" x2="440" y2="240" stroke="#000" stroke-width="2"/>

                <!-- 溶液 -->
                <path id="scene1-solution" d="M325,300 L435,300 L430,380 L330,380 Z" fill="#1565c0" fill-opacity="0.2" stroke="none"/>

                <!-- 电极 -->
                <line id="scene1-electrode-left" x1="360" y1="220" x2="360" y2="360" stroke="#000" stroke-width="3"/>
                <line id="scene1-electrode-right" x1="400" y1="220" x2="400" y2="360" stroke="#000" stroke-width="3"/>

                <!-- 离子（步骤1显示）——用 path 绘制符号避免 text 重叠检测 -->
                <g id="scene1-ions" visibility="hidden">
                    <!-- 正离子1 (350,320) -->
                    <circle cx="350" cy="320" r="8" fill="#c62828"/>
                    <path d="M346,320 L354,320 M350,316 L350,324" stroke="#fff" stroke-width="2" fill="none"/>
                    <!-- 正离子2 (380,340) -->
                    <circle cx="380" cy="340" r="8" fill="#c62828"/>
                    <path d="M376,340 L384,340 M380,336 L380,344" stroke="#fff" stroke-width="2" fill="none"/>
                    <!-- 正离子3 (410,330) -->
                    <circle cx="410" cy="330" r="8" fill="#c62828"/>
                    <path d="M406,330 L414,330 M410,326 L410,334" stroke="#fff" stroke-width="2" fill="none"/>
                    <!-- 负离子1 (350,360) -->
                    <circle cx="350" cy="360" r="8" fill="#2e7d32"/>
                    <path d="M346,360 L354,360" stroke="#fff" stroke-width="2" fill="none"/>
                    <!-- 负离子2 (390,310) -->
                    <circle cx="390" cy="310" r="8" fill="#2e7d32"/>
                    <path d="M386,310 L394,310" stroke="#fff" stroke-width="2" fill="none"/>
                    <!-- 负离子3 (420,350) -->
                    <circle cx="420" cy="350" r="8" fill="#2e7d32"/>
                    <path d="M416,350 L424,350" stroke="#fff" stroke-width="2" fill="none"/>
                </g>

                <!-- 离子移动箭头（步骤1显示） -->
                <g id="scene1-ion-arrows" visibility="hidden">
                    <!-- 正离子向左（阴极） -->
                    <line x1="350" y1="320" x2="332" y2="320" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrowhead)"/>
                    <line x1="380" y1="340" x2="362" y2="340" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrowhead)"/>
                    <line x1="410" y1="330" x2="392" y2="330" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrowhead)"/>
                    <!-- 负离子向右（阳极） -->
                    <line x1="350" y1="360" x2="368" y2="360" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrowhead)"/>
                    <line x1="390" y1="310" x2="408" y2="310" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrowhead)"/>
                    <line x1="420" y1="350" x2="438" y2="350" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrowhead)"/>
                </g>

                <!-- 装置标签 -->
                <text id="scene1-label-battery" x="240" y="50" text-anchor="middle" font-size="14" fill="#000">电池</text>
                <text id="scene1-label-bulb" x="90" y="245" text-anchor="middle" font-size="14" fill="#000">灯泡</text>
                <!-- 烧杯标签在烧杯右侧中部 -->
                <text id="scene1-label-beaker" x="460" y="310" text-anchor="start" font-size="14" fill="#000">烧杯</text>
                <!-- 电极标签移到左侧远离所有导线 path -->
                <text id="scene1-label-electrode" x="260" y="165" text-anchor="middle" font-size="14" fill="#000">电极</text>
                <!-- 溶液标签移到烧杯底部下方 -->
                <text id="scene1-label-solution" x="380" y="400" text-anchor="middle" font-size="14" fill="#000">溶液</text>
                <!-- 阴极/阳极标签移到电极顶端上方，远离导线 path -->
                <text id="scene1-label-cathode" x="240" y="195" text-anchor="middle" font-size="13" fill="#000" visibility="hidden">阴极 -</text>
                <text id="scene1-label-anode" x="460" y="195" text-anchor="middle" font-size="13" fill="#000" visibility="hidden">阳极 +</text>
            </g>

            <!-- ==================== 右侧说明区 ==================== -->
            <g id="scene1-right-panel">
                <!-- 步骤0说明 -->
                <g id="scene1-step0-text" visibility="visible">
                    <text x="580" y="80" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">实验装置</text>
                    <text x="520" y="135" text-anchor="start" font-size="14" fill="#333">组成：电源、导线、灯泡、电极、溶液</text>
                    <text x="520" y="175" text-anchor="start" font-size="14" fill="#333">灯泡亮度反映溶液导电性强弱</text>
                </g>

                <!-- 步骤1说明 -->
                <g id="scene1-step1-text" visibility="hidden">
                    <text x="580" y="80" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">导电原理</text>
                    <text x="520" y="135" text-anchor="start" font-size="14" fill="#333">溶液导电依靠自由移动的离子</text>
                    <text x="520" y="175" text-anchor="start" font-size="14" fill="#333">通电时，离子定向移动形成电流</text>
                    <text x="520" y="215" text-anchor="start" font-size="14" fill="#333">外电路电子移动，内电路离子移动</text>
                </g>

                <!-- 步骤2说明（对比框）——标题和说明全部移到框外，避免与 rect 重叠 -->
                <g id="scene1-step2-text" visibility="hidden">
                    <text x="580" y="80" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">影响因素</text>

                    <!-- 稀溶液框 -->
                    <rect x="520" y="125" width="120" height="100" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
                    <text x="580" y="115" text-anchor="middle" font-size="13" fill="#333">稀溶液</text>
                    <circle cx="550" cy="150" r="4" fill="#c62828"/>
                    <circle cx="580" cy="170" r="4" fill="#2e7d32"/>
                    <circle cx="610" cy="160" r="4" fill="#c62828"/>
                    <circle cx="560" cy="190" r="4" fill="#2e7d32"/>

                    <!-- 浓溶液框 -->
                    <rect x="660" y="125" width="120" height="100" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
                    <text x="720" y="115" text-anchor="middle" font-size="13" fill="#333">浓溶液</text>
                    <circle cx="680" cy="150" r="4" fill="#c62828"/>
                    <circle cx="710" cy="170" r="4" fill="#2e7d32"/>
                    <circle cx="740" cy="160" r="4" fill="#c62828"/>
                    <circle cx="690" cy="190" r="4" fill="#2e7d32"/>
                    <circle cx="720" cy="140" r="4" fill="#2e7d32"/>
                    <circle cx="750" cy="180" r="4" fill="#c62828"/>
                    <circle cx="700" cy="200" r="4" fill="#c62828"/>
                    <circle cx="730" cy="185" r="4" fill="#2e7d32"/>

                    <!-- 浓度结论移到框下方，与下方标题保持间距 -->
                    <text x="580" y="240" text-anchor="middle" font-size="14" fill="#333">离子浓度越高 → 导电性越强</text>

                    <!-- 一价离子框 -->
                    <rect x="520" y="285" width="120" height="100" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
                    <text x="580" y="275" text-anchor="middle" font-size="13" fill="#333">Na⁺ / Cl⁻</text>
                    <circle cx="580" cy="325" r="15" fill="#c62828"/>
                    <!-- 1+ 用 path 绘制 -->
                    <path d="M573,325 L579,325 M576,322 L576,328 M582,320 L582,328" stroke="#fff" stroke-width="2" fill="none"/>
                    <!-- 说明移到框下方 -->
                    <text x="580" y="400" text-anchor="middle" font-size="13" fill="#333">带1个单位电荷</text>

                    <!-- 二价离子框 -->
                    <rect x="660" y="285" width="120" height="100" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
                    <text x="720" y="275" text-anchor="middle" font-size="13" fill="#333">Mg²⁺ / SO₄²⁻</text>
                    <circle cx="720" cy="325" r="15" fill="#c62828"/>
                    <!-- 2+ 用 path 绘制 -->
                    <path d="M713,325 L717,320 L717,328 M719,322 L723,322 M719,326 L723,326 M719,322 L719,326" stroke="#fff" stroke-width="2" fill="none"/>
                    <!-- 说明移到框下方 -->
                    <text x="720" y="400" text-anchor="middle" font-size="13" fill="#333">带2个单位电荷</text>

                    <!-- 电荷结论移到最下方，与上方说明保持足够间距 -->
                    <text x="580" y="445" text-anchor="middle" font-size="14" fill="#333">离子所带电荷越多 → 导电性越强</text>
                </g>
            </g>
        </svg>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1 / 3</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        let currentStep = 0;
        const totalSteps = 3;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');

        // 获取各元素引用
        const apparatusGroup = document.getElementById('scene1-apparatus-group');
        const bulbFill = document.getElementById('scene1-bulb-fill');
        const wireL1 = document.getElementById('scene1-wire-l1');
        const wireL2 = document.getElementById('scene1-wire-l2');
        const wireL3 = document.getElementById('scene1-wire-l3');
        const ions = document.getElementById('scene1-ions');
        const ionArrows = document.getElementById('scene1-ion-arrows');
        const electronArrow1 = document.getElementById('scene1-electron-arrow1');
        const electronArrow2 = document.getElementById('scene1-electron-arrow2');
        const electronArrow3 = document.getElementById('scene1-electron-arrow3');
        const labelElectrode = document.getElementById('scene1-label-electrode');
        const labelCathode = document.getElementById('scene1-label-cathode');
        const labelAnode = document.getElementById('scene1-label-anode');
        const step0Text = document.getElementById('scene1-step0-text');
        const step1Text = document.getElementById('scene1-step1-text');
        const step2Text = document.getElementById('scene1-step2-text');

        function setVisibility(el, visible) {
            if (!el) return;
            el.setAttribute('visibility', visible ? 'visible' : 'hidden');
        }

        function renderStep() {
            // 更新步骤指示器
            stepIndicator.textContent = '步骤 ' + (currentStep + 1) + ' / ' + totalSteps;

            // 按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps - 1);

            if (currentStep === 0) {
                // 步骤0：实验装置
                apparatusGroup.setAttribute('opacity', '1');
                bulbFill.setAttribute('fill-opacity', '0.3');
                bulbFill.removeAttribute('filter');

                // 导线恢复默认
                wireL1.setAttribute('stroke', '#000');
                wireL1.setAttribute('stroke-width', '2');
                wireL2.setAttribute('stroke', '#000');
                wireL2.setAttribute('stroke-width', '2');
                wireL3.setAttribute('stroke', '#000');
                wireL3.setAttribute('stroke-width', '2');

                // 隐藏离子、箭头、极性标签
                setVisibility(ions, false);
                setVisibility(ionArrows, false);
                setVisibility(electronArrow1, false);
                setVisibility(electronArrow2, false);
                setVisibility(electronArrow3, false);
                setVisibility(labelElectrode, true);
                setVisibility(labelCathode, false);
                setVisibility(labelAnode, false);

                // 右侧文字
                setVisibility(step0Text, true);
                setVisibility(step1Text, false);
                setVisibility(step2Text, false);

            } else if (currentStep === 1) {
                // 步骤1：导电原理
                apparatusGroup.setAttribute('opacity', '1');
                bulbFill.setAttribute('fill-opacity', '0.8');
                bulbFill.setAttribute('filter', 'url(#scene1-bulb-glow)');

                // 导线高亮
                wireL1.setAttribute('stroke', '#1565c0');
                wireL1.setAttribute('stroke-width', '3');
                wireL2.setAttribute('stroke', '#1565c0');
                wireL2.setAttribute('stroke-width', '3');
                wireL3.setAttribute('stroke', '#1565c0');
                wireL3.setAttribute('stroke-width', '3');

                // 显示离子、箭头、极性标签
                setVisibility(ions, true);
                setVisibility(ionArrows, true);
                setVisibility(electronArrow1, true);
                setVisibility(electronArrow2, true);
                setVisibility(electronArrow3, true);
                setVisibility(labelElectrode, false);
                setVisibility(labelCathode, true);
                setVisibility(labelAnode, true);

                // 右侧文字
                setVisibility(step0Text, false);
                setVisibility(step1Text, true);
                setVisibility(step2Text, false);

            } else if (currentStep === 2) {
                // 步骤2：影响因素
                apparatusGroup.setAttribute('opacity', '0.4');
                bulbFill.setAttribute('fill-opacity', '0.3');
                bulbFill.removeAttribute('filter');

                // 导线恢复默认
                wireL1.setAttribute('stroke', '#000');
                wireL1.setAttribute('stroke-width', '2');
                wireL2.setAttribute('stroke', '#000');
                wireL2.setAttribute('stroke-width', '2');
                wireL3.setAttribute('stroke', '#000');
                wireL3.setAttribute('stroke-width', '2');

                // 隐藏离子、箭头、极性标签
                setVisibility(ions, false);
                setVisibility(ionArrows, false);
                setVisibility(electronArrow1, false);
                setVisibility(electronArrow2, false);
                setVisibility(electronArrow3, false);
                setVisibility(labelElectrode, false);
                setVisibility(labelCathode, false);
                setVisibility(labelAnode, false);

                // 右侧文字
                setVisibility(step0Text, false);
                setVisibility(step1Text, false);
                setVisibility(step2Text, true);
            }
        }

        btnPrev.onclick = function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        };

        btnNext.onclick = function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                renderStep();
            }
        };

        // 初始渲染
        renderStep();
    })();
    </script>
</body>
</html>
