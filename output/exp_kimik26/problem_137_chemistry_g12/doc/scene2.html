<script>
(function(){
var currentStep=0;
var totalSteps=5;
var btnPrev=document.getElementById('scene2-btn-prev');
var btnNext=document.getElementById('scene2-btn-next');
var indicator=document.getElementById('scene2-step-indicator');
var stepGroups={
1:document.getElementById('scene2-step1-group'),
2:document.getElementById('scene2-step2-group'),
3:document.getElementById('scene2-step3-group'),
4:document.getElementById('scene2-step4-group'),
5:document.getElementById('scene2-step5-group')
};
var panelBText=document.getElementById('scene2-panel-b-text');
var panelBMark=document.getElementById('scene2-panel-b-mark');
var panelBNote=document.getElementById('scene2-panel-b-note');
var panelCText=document.getElementById('scene2-panel-c-text');
var panelCMark=document.getElementById('scene2-panel-c-mark');
var panelCNote1=document.getElementById('scene2-panel-c-note1');
var panelCNote2=document.getElementById('scene2-panel-c-note2');
var panelDText=document.getElementById('scene2-panel-d-text');
var panelDMark=document.getElementById('scene2-panel-d-mark');
function setDisplay(el,show){
if(!el)return;
if(show){
el.style.display='block';
requestAnimationFrame(function(){el.style.opacity='1';});
}else{
el.style.opacity='0';
setTimeout(function(){if(el.style.opacity==='0')el.style.display='none';},300);
}
}
function updatePanel(){
if(currentStep===5){
setDisplay(panelBText,false);setDisplay(panelBMark,false);setDisplay(panelBNote,false);
setDisplay(panelCText,false);setDisplay(panelCMark,false);setDisplay(panelCNote1,false);setDisplay(panelCNote2,false);
setDisplay(panelDText,false);setDisplay(panelDMark,false);
return;
}
setDisplay(panelBText,true);setDisplay(panelCText,true);setDisplay(panelDText,true);
setDisplay(panelBMark,false);
setDisplay(panelBNote,false);
setDisplay(panelCMark,false);
setDisplay(panelCNote1,false);
setDisplay(panelCNote2,false);
setDisplay(panelDMark,false);
if(currentStep>=1){setDisplay(panelBMark,true);setDisplay(panelBNote,true);}
if(currentStep>=2){setDisplay(panelCMark,true);setDisplay(panelCNote1,true);}
if(currentStep>=3){setDisplay(panelCNote2,true);}
if(currentStep>=4){setDisplay(panelDMark,true);}
}
function goToStep(step){
if(step<0||step>totalSteps)return;
currentStep=step;
for(var i=1;i<=totalSteps;i++){setDisplay(stepGroups[i],i===step);}
updatePanel();
btnPrev.disabled=(currentStep===0);
btnNext.disabled=(currentStep===totalSteps);
indicator.textContent='步骤 '+currentStep+'/'+totalSteps;
}
btnPrev.addEventListener('click',function(){goToStep(currentStep-1);});
btnNext.addEventListener('click',function(){goToStep(currentStep+1);});
goToStep(0);
})();
</script>
