<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>化合物A结构分析</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "SimHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }

        /* 按钮样式 */
        #scene1-btn-prev, #scene1-btn-next {
            padding: 6px 16px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #333;
            background: #f5f5f5;
            border-radius: 4px;
        }
        #scene1-btn-prev:hover, #scene1-btn-next:hover {
            background: #e0e0e0;
        }
        #scene1-btn-prev:disabled, #scene1-btn-next:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* 步骤标题 */
        #scene1-step-title {
            position: absolute;
            bottom: 50px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            color: #333;
            z-index: 10;
        }

        /* SVG 样式 */
        svg { display: block; }

        /* 键线样式 */
        .bond { stroke: #000000; stroke-width: 2; fill: none; stroke-linecap: round; transition: stroke 0.3s ease, stroke-width 0.3s ease; }
        .bond-ester { stroke: #c62828; stroke-width: 3; fill: none; stroke-linecap: round; transition: stroke 0.3s ease, stroke-width 0.3s ease; }
        .bond-cc-double { stroke: #1565c0; stroke-width: 3; fill: none; stroke-linecap: round; transition: stroke 0.3s ease, stroke-width 0.3s ease; }
        .bond-cc-triple { stroke: #2e7d32; stroke-width: 3; fill: none; stroke-linecap: round; transition: stroke 0.3s ease, stroke-width 0.3s ease; }

        /* 虚线框 */
        .acetyl-box { fill: none; stroke: #c62828; stroke-width: 1.5; stroke-dasharray: 5,5; opacity: 0; transition: opacity 0.3s ease; }
        .acetyl-box.active { opacity: 1; }

        /* 编号圆圈 */
        .number-circle { fill: #f9a825; stroke: #000000; stroke-width: 1; }
        .number-text { font-size: 11px; text-anchor: middle; dominant-baseline: central; font-family: sans-serif; }
        .number-red { fill: #c62828; }
        .number-black { fill: #000000; }
        .number-group { opacity: 0; transition: opacity 0.3s ease; }
        .number-group.active { opacity: 1; }

        /* 标注 */
        .label-text { font-size: 14px; font-weight: bold; text-anchor: middle; opacity: 0; transition: opacity 0.3s ease; }
        .label-text.active { opacity: 1; }
        .label-ester { fill: #c62828; }
        .label-cc-double { fill: #1565c0; }
        .label-cc-triple { fill: #2e7d32; }

        /* 氢分区标注 */
        .h-label { font-size: 13px; text-anchor: middle; opacity: 0; transition: opacity 0.3s ease; }
        .h-label.active { opacity: 1; }

        /* 计数表 */
        .count-table { font-size: 14px; }
        .count-table-header { fill: #e3f2fd; stroke: #000000; stroke-width: 1; }
        .count-table-cell { fill: #ffffff; stroke: #000000; stroke-width: 1; }
        .count-table-text { font-size: 14px; text-anchor: middle; dominant-baseline: central; }
        .count-number { opacity: 0; transition: opacity 0.3s ease; }
        .count-number.active { opacity: 1; }

        /* 化学式结论 */
        .formula-result { font-size: 16px; font-weight: bold; text-anchor: middle; fill: #c62828; opacity: 0; transition: opacity 0.3s ease; }
        .formula-result.active { opacity: 1; }

        /* 图例 */
        .legend-item { font-size: 12px; text-anchor: start; dominant-baseline: central; }
        .legend-line { stroke-width: 3; stroke-linecap: round; }

        /* 氧原子标记 */
        .atom-label { font-size: 12px; text-anchor: middle; dominant-baseline: central; fill: #000000; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- 分子键线式 -->
            <g id="scene1-molecule">
                <!-- 左侧链: C5-C4=C3-O1-C2(=O2)-C1 -->
                <line id="scene1-bond-c5c4" class="bond" x1="280" y1="300" x2="230" y2="300" />
                <line id="scene1-bond-c4c3-main" class="bond" x1="230" y1="300" x2="190" y2="270" />
                <line id="scene1-bond-c4c3-sub" class="bond" x1="231.8" y1="297.6" x2="191.8" y2="267.6" />

                <line id="scene1-bond-c2c1" class="bond" x1="120" y1="300" x2="90" y2="270" />

                <!-- 上侧链: C5-C6-O3-C7(=O4)-C8 -->
                <line id="scene1-bond-c5c6" class="bond" x1="280" y1="300" x2="280" y2="250" />
                <line id="scene1-bond-c6o3" class="bond" x1="280" y1="250" x2="280" y2="220" />
                <line id="scene1-bond-o3c7" class="bond" x1="280" y1="220" x2="280" y2="190" />
                <line id="scene1-bond-c7o4-main" class="bond" x1="280" y1="190" x2="305" y2="175" />
                <line id="scene1-bond-c7o4-sub" class="bond" x1="281.5" y1="192.6" x2="306.5" y2="177.6" />
                <line id="scene1-bond-c7c8" class="bond" x1="280" y1="190" x2="310" y2="160" />

                <!-- 下侧链: C5-O5-C9(=O6)-C10 -->
                <line id="scene1-bond-c5o5" class="bond" x1="280" y1="300" x2="280" y2="335" />
                <line id="scene1-bond-o5c9" class="bond" x1="280" y1="335" x2="280" y2="370" />
                <line id="scene1-bond-c9o6-main" class="bond" x1="280" y1="370" x2="265" y2="385" />
                <line id="scene1-bond-c9o6-sub" class="bond" x1="277.9" y1="367.9" x2="262.9" y2="382.9" />
                <line id="scene1-bond-c9c10" class="bond" x1="280" y1="370" x2="310" y2="400" />

                <!-- 右侧链: C5-C11-C12(=C13)-C12a-C14-C15≡C16-C17-C18(=C19)-C20 -->
                <line id="scene1-bond-c5c11" class="bond" x1="280" y1="300" x2="320" y2="300" />
                <line id="scene1-bond-c11c12-main" class="bond" x1="320" y1="300" x2="340" y2="300" />
                <line id="scene1-bond-c11c12-sub" class="bond" x1="320" y1="296" x2="340" y2="296" />
                <line id="scene1-bond-c12c12a" class="bond" x1="340" y1="300" x2="340" y2="260" />
                <line id="scene1-bond-c12c13" class="bond" x1="340" y1="300" x2="360" y2="300" />
                <line id="scene1-bond-c13c14" class="bond" x1="360" y1="300" x2="380" y2="300" />
                <line id="scene1-bond-c14c15" class="bond" x1="380" y1="300" x2="400" y2="300" />
                <line id="scene1-bond-c15c16-main" class="bond" x1="400" y1="300" x2="420" y2="300" />
                <line id="scene1-bond-c15c16-sub1" class="bond" x1="400" y1="296" x2="420" y2="296" />
                <line id="scene1-bond-c15c16-sub2" class="bond" x1="400" y1="304" x2="420" y2="304" />
                <line id="scene1-bond-c16c17" class="bond" x1="420" y1="300" x2="440" y2="300" />
                <line id="scene1-bond-c17c18-main" class="bond" x1="440" y1="300" x2="460" y2="300" />
                <line id="scene1-bond-c17c18-sub" class="bond" x1="440" y1="296" x2="460" y2="296" />
                <line id="scene1-bond-c18c19" class="bond" x1="460" y1="300" x2="480" y2="330" />
                <line id="scene1-bond-c18c20" class="bond" x1="460" y1="300" x2="480" y2="270" />
            </g>

            <!-- 氧原子标记 -->
            <text x="145" y="280" class="atom-label">O</text>
            <text x="98" y="265" class="atom-label">O</text>
            <text x="285" y="215" class="atom-label">O</text>
            <text x="295" y="170" class="atom-label">O</text>
            <text x="285" y="348" class="atom-label">O</text>
            <text x="255" y="395" class="atom-label">O</text>

            <!-- 乙酰基虚线框 -->
            <rect id="scene1-box-acetyl-left" class="acetyl-box" x="75" y="245" width="90" height="70" rx="3" />

            <!-- 碳编号 (21个) -->

                <!-- 3: C3 上偏 黑 -->
                <circle cx="190" cy="255" r="10" class="number-circle" />

                <!-- 4: C4 下偏 黑 -->
                <circle cx="230" cy="315" r="10" class="number-circle" />
                <text x="230" y="315" class="number-text number-black">4</text>
                <!-- 5: C5 左偏 黑 -->
                <circle cx="265" cy="300" r="10" class="number-circle" />
                <text x="265" y="300" class="number-text number-black">5</text>
                <!-- 6: C6 左偏 黑 -->
                <circle cx="265" cy="250" r="10" class="number-circle" />
                <text x="265" y="250" class="number-text number-black">6</text>
                <!-- 7: C7 左偏 红 -->
                <circle cx="265" cy="190" r="10" class="number-circle" />
                <text x="265" y="190" class="number-text number-red">7</text>
                <!-- 8: C8 右偏 红 -->
                <circle cx="325" cy="160" r="10" class="number-circle" />
                <text x="325" y="160" class="number-text number-red">8</text>
                <!-- 9: C9 左偏 红 -->
                <circle cx="265" cy="370" r="10" class="number-circle" />
                <text x="265" y="370" class="number-text number-red">9</text>
                <!-- 10: C10 右偏 红 -->
                <circle cx="325" cy="400" r="10" class="number-circle" />
                <text x="325" y="400" class="number-text number-red">10</text>
                <!-- 11: C11 下偏 黑 -->
                <circle cx="320" cy="315" r="10" class="number-circle" />
                <text x="320" y="315" class="number-text number-black">11</text>
                <!-- 12: C12 上偏 黑 -->
                <circle cx="340" cy="285" r="10" class="number-circle" />
                <text x="340" y="285" class="number-text number-black">12</text>
                <!-- 13: C12a 右偏 黑 -->
                <circle cx="355" cy="260" r="10" class="number-circle" />
                <text x="355" y="260" class="number-text number-black">13</text>
                <!-- 14: C13 下偏 黑 -->
                <circle cx="360" cy="315" r="10" class="number-circle" />
                <text x="360" y="315" class="number-text number-black">14</text>
                <!-- 15: C14 上偏 黑 -->
                <circle cx="380" cy="285" r="10" class="number-circle" />
                <text x="380" y="285" class="number-text number-black">15</text>
                <!-- 16: C15 下偏 黑 -->
                <circle cx="400" cy="315" r="10" class="number-circle" />
                <text x="400" y="315" class="number-text number-black">16</text>
                <!-- 17: C16 上偏 黑 -->
                <circle cx="420" cy="285" r="10" class="number-circle" />
                <text x="420" y="285" class="number-text number-black">17</text>
                <!-- 18: C17 下偏 黑 -->
                <circle cx="440" cy="315" r="10" class="number-circle" />
                <text x="440" y="315" class="number-text number-black">18</text>
                <!-- 19: C18 上偏 黑 -->
                <circle cx="460" cy="285" r="10" class="number-circle" />
                <text x="460" y="285" class="number-text number-black">19</text>
                <!-- 20: C19 右偏 黑 -->
                <circle cx="495" cy="330" r="10" class="number-circle" />
                <text x="495" y="330" class="number-text number-black">20</text>
                <!-- 21: C20 右偏 黑 -->
                <circle cx="495" cy="270" r="10" class="number-circle" />
                <text x="495" y="270" class="number-text number-black">21</text>
            </g>

            <!-- 官能团标注 -->
            <text id="scene1-label-ester" class="label-text label-ester" x="150" y="140">酯基 ×3</text>
            <text id="scene1-label-cc-double" class="label-text label-cc-double" x="350" y="140">C=C ×3</text>
            <text id="scene1-label-cc-triple" class="label-text label-cc-triple" x="480" y="140">C≡C ×1</text>

            <!-- 氢分区标注 -->
            <text id="scene1-h-acetyl" class="h-label" x="150" y="340">乙酰基 9H</text>
            <text id="scene1-h-double" class="h-label" x="400" y="240">双键氢 4H</text>
            <text id="scene1-h-saturated" class="h-label" x="400" y="340">饱和碳氢 13H</text>

            <!-- 右侧计数表 -->
            <g id="scene1-count-table" transform="translate(520, 140)">
                <!-- 表头背景 -->
                <rect x="0" y="0" width="220" height="40" class="count-table-header" />
                <text x="110" y="20" class="count-table-text" style="font-weight:bold;">原子计数</text>
                <!-- C行 -->
                <rect x="0" y="40" width="110" height="40" class="count-table-cell" />
                <rect x="110" y="40" width="110" height="40" class="count-table-cell" />
                <text x="55" y="60" class="count-table-text">C</text>
                <text id="scene1-table-c" class="count-table-text count-number" x="165" y="60">21</text>
                <!-- H行 -->
                <rect x="0" y="80" width="110" height="40" class="count-table-cell" />
                <rect x="110" y="80" width="110" height="40" class="count-table-cell" />
                <text x="55" y="100" class="count-table-text">H</text>
                <text id="scene1-table-h" class="count-table-text count-number" x="165" y="100">26</text>
                <!-- O行 -->
                <rect x="0" y="120" width="110" height="40" class="count-table-cell" />
                <rect x="110" y="120" width="110" height="40" class="count-table-cell" />
                <text x="55" y="140" class="count-table-text">O</text>
                <text id="scene1-table-o" class="count-table-text count-number" x="165" y="140">6</text>
            </g>

            <!-- 化学式结论 -->
            <text id="scene1-formula-result" class="formula-result" x="620" y="330">分子式：C₂₁H₂₆O₆</text>

            <!-- 底部图例 -->
            <g id="scene1-legend" transform="translate(0, 415)">
                <line x1="80" y1="0" x2="100" y2="0" class="legend-line" style="stroke:#c62828;" />
                <text x="105" y="0" class="legend-item">酯基</text>
                <line x1="200" y1="0" x2="220" y2="0" class="legend-line" style="stroke:#1565c0;" />
                <text x="225" y="0" class="legend-item">C=C</text>
                <line x1="320" y1="0" x2="340" y2="0" class="legend-line" style="stroke:#2e7d32;" />
                <text x="345" y="0" class="legend-item">C≡C</text>
                <circle cx="460" cy="0" r="6" fill="#f9a825" stroke="#000" stroke-width="1" />

        <div id="scene1-step-title">完整分子结构</div>

        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>

    </div>

    <script>
    (function() {
        let currentStep = 0;
        const totalSteps = 6;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepTitle = document.getElementById('scene1-step-title');

        // 酯基键 ID 列表 (三个乙酰基的所有键)
        const esterBondIds = [
            'scene1-bond-c3o1', 'scene1-bond-o1c2',
            'scene1-bond-c2o2-main', 'scene1-bond-c2o2-sub', 'scene1-bond-c2c1',
            'scene1-bond-c6o3', 'scene1-bond-o3c7',
            'scene1-bond-c7o4-main', 'scene1-bond-c7o4-sub', 'scene1-bond-c7c8',
            'scene1-bond-c5o5', 'scene1-bond-o5c9',
            'scene1-bond-c9o6-main', 'scene1-bond-c9o6-sub', 'scene1-bond-c9c10'
        ];

        // C=C 键 ID 列表
        const ccDoubleBondIds = [
            'scene1-bond-c4c3-main', 'scene1-bond-c4c3-sub',
            'scene1-bond-c11c12-main', 'scene1-bond-c11c12-sub',
            'scene1-bond-c17c18-main', 'scene1-bond-c17c18-sub'
        ];

        // C≡C 键 ID 列表
        const ccTripleBondIds = [
            'scene1-bond-c15c16-main', 'scene1-bond-c15c16-sub1', 'scene1-bond-c15c16-sub2'
        ];

        // 乙酰基虚线框 ID
        const acetylBoxIds = [
            'scene1-box-acetyl-left', 'scene1-box-acetyl-up', 'scene1-box-acetyl-down'
        ];

        function setBondClass(ids, className) {
            ids.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.setAttribute('class', className);
            });
        }

        function resetAllBonds() {
            const allBondIds = esterBondIds.concat(ccDoubleBondIds).concat(ccTripleBondIds);
            const uniqueIds = [...new Set(allBondIds)];
            setBondClass(uniqueIds, 'bond');
        }

        function showElement(id, show) {
            const el = document.getElementById(id);
            if (!el) return;
            if (show) {
                el.classList.add('active');
            } else {
                el.classList.remove('active');
            }
        }

        function renderStep() {
            // 重置所有键为黑色
            resetAllBonds();

            // 隐藏所有可选元素
            showElement('scene1-label-ester', false);
            showElement('scene1-label-cc-double', false);
            showElement('scene1-label-cc-triple', false);
            acetylBoxIds.forEach(id => showElement(id, false));
            showElement('scene1-numbers', false);
            showElement('scene1-h-acetyl', false);
            showElement('scene1-h-double', false);
            showElement('scene1-h-saturated', false);
            showElement('scene1-table-c', false);
            showElement('scene1-table-h', false);
            showElement('scene1-table-o', false);
            showElement('scene1-formula-result', false);

            // 更新按钮状态
            btnPrev.disabled = currentStep <= 0;
            btnNext.disabled = currentStep >= totalSteps;

            // 根据步骤设置内容
            switch(currentStep) {
                case 0:
                    stepTitle.textContent = '完整分子结构';
                    break;
                case 1:
                    stepTitle.textContent = '酯基识别（–OCOCH₃）';
                    setBondClass(esterBondIds, 'bond-ester');
                    acetylBoxIds.forEach(id => showElement(id, true));
                    showElement('scene1-label-ester', true);
                    showElement('scene1-table-o', true);
                    break;
                case 2:
                    stepTitle.textContent = '碳碳双键识别（C=C）';
                    setBondClass(esterBondIds, 'bond-ester');
                    setBondClass(ccDoubleBondIds, 'bond-cc-double');
                    acetylBoxIds.forEach(id => showElement(id, true));
                    showElement('scene1-label-ester', true);
                    showElement('scene1-label-cc-double', true);
                    showElement('scene1-table-o', true);
                    break;
                case 3:
                    stepTitle.textContent = '碳碳三键识别（C≡C）';
                    setBondClass(esterBondIds, 'bond-ester');
                    setBondClass(ccDoubleBondIds, 'bond-cc-double');
                    setBondClass(ccTripleBondIds, 'bond-cc-triple');
                    acetylBoxIds.forEach(id => showElement(id, true));
                    showElement('scene1-label-ester', true);
                    showElement('scene1-label-cc-double', true);
                    showElement('scene1-label-cc-triple', true);
                    showElement('scene1-table-o', true);
                    break;
                case 4:
                    stepTitle.textContent = '碳原子编号与计数';
                    setBondClass(esterBondIds, 'bond-ester');
                    setBondClass(ccDoubleBondIds, 'bond-cc-double');
                    setBondClass(ccTripleBondIds, 'bond-cc-triple');
                    acetylBoxIds.forEach(id => showElement(id, true));
                    showElement('scene1-label-ester', true);
                    showElement('scene1-label-cc-double', true);
                    showElement('scene1-label-cc-triple', true);
                    showElement('scene1-numbers', true);
                    showElement('scene1-table-c', true);
                    showElement('scene1-table-o', true);
                    break;
                case 5:
                    stepTitle.textContent = '氢原子分区计数';
                    setBondClass(esterBondIds, 'bond-ester');
                    setBondClass(ccDoubleBondIds, 'bond-cc-double');
                    setBondClass(ccTripleBondIds, 'bond-cc-triple');
                    acetylBoxIds.forEach(id => showElement(id, true));
                    showElement('scene1-label-ester', true);
                    showElement('scene1-label-cc-double', true);
                    showElement('scene1-label-cc-triple', true);
                    showElement('scene1-numbers', true);
                    showElement('scene1-h-acetyl', true);
                    showElement('scene1-h-double', true);
                    showElement('scene1-h-saturated', true);
                    showElement('scene1-table-c', true);
                    showElement('scene1-table-h', true);
                    showElement('scene1-table-o', true);
                    break;
                case 6:
                    stepTitle.textContent = '化学式验证结论 — 选项A正确';
                    setBondClass(esterBondIds, 'bond-ester');
                    setBondClass(ccDoubleBondIds, 'bond-cc-double');
                    setBondClass(ccTripleBondIds, 'bond-cc-triple');
                    acetylBoxIds.forEach(id => showElement(id, true));
                    showElement('scene1-label-ester', true);
                    showElement('scene1-label-cc-double', true);
                    showElement('scene1-label-cc-triple', true);
                    showElement('scene1-numbers', true);
                    showElement('scene1-h-acetyl', true);
                    showElement('scene1-h-double', true);
                    showElement('scene1-h-saturated', true);
                    showElement('scene1-table-c', true);
                    showElement('scene1-table-h', true);
                    showElement('scene1-table-o', true);
                    showElement('scene1-formula-result', true);
                    break;
            }
        }

        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < totalSteps) {
                currentStep++;
                renderStep();
            }
        });

        // 初始渲染
        renderStep();
    })();
    </script>
</body>
</html>
