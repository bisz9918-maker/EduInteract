<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基因工程基本操作流程 - 场景3</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 20px; z-index: 10; }
        #scene3-controls button {
            padding: 6px 18px; font-size: 14px; border: 1px solid #1565c0; border-radius: 4px;
            background: #1565c0; color: #fff; cursor: pointer; transition: opacity 0.2s;
        }
        #scene3-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene3-controls button:hover:not(:disabled) { background: #0d47a1; }
        #scene3-step-indicator { font-size: 14px; color: #333; min-width: 80px; text-align: center; }
        .scene3-step-group { transition: opacity 0.3s ease-out; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg id="scene3-svg" width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <!-- 步骤0：获取目的基因与载体 -->
            <g id="scene3-step-0" class="scene3-step-group">
                <!-- DNA上链（波浪线） -->
                <path d="M120,100 Q130,90 140,100 Q150,110 160,100 Q170,90 180,100 Q190,110 200,100 Q210,90 220,100 Q230,110 240,100 Q250,90 260,100 Q270,110 280,100" fill="none" stroke="#000" stroke-width="2"/>
                <!-- DNA下链（波浪线） -->
                <path d="M120,140 Q130,150 140,140 Q150,130 160,140 Q170,150 180,140 Q190,130 200,140 Q210,150 220,140 Q230,130 240,140 Q250,150 260,140 Q270,130 280,140" fill="none" stroke="#000" stroke-width="2"/>
                <!-- 碱基对横线 -->
                <line x1="130" y1="120" x2="140" y2="120" stroke="#888" stroke-width="1"/>
                <line x1="150" y1="120" x2="160" y2="120" stroke="#888" stroke-width="1"/>
                <line x1="170" y1="120" x2="180" y2="120" stroke="#888" stroke-width="1"/>
                <line x1="190" y1="120" x2="200" y2="120" stroke="#c62828" stroke-width="2"/>
                <line x1="210" y1="120" x2="220" y2="120" stroke="#c62828" stroke-width="2"/>
                <line x1="230" y1="120" x2="240" y2="120" stroke="#888" stroke-width="1"/>
                <line x1="250" y1="120" x2="260" y2="120" stroke="#888" stroke-width="1"/>
                <!-- 目的基因b高亮段 -->
                <path d="M180,100 Q190,90 200,100 Q210,110 220,100" fill="none" stroke="#c62828" stroke-width="4"/>
                <path d="M180,140 Q190,150 200,140 Q210,130 220,140" fill="none" stroke="#c62828" stroke-width="4"/>
                <!-- 目的基因b标签 -->
                <text x="200" y="165" text-anchor="middle" font-size="14" fill="#333">目的基因 b</text>
                <!-- 质粒外环 -->
                <circle cx="520" cy="120" r="55" fill="none" stroke="#1565c0" stroke-width="8"/>
                <!-- 质粒内环（镂空） -->
                <circle cx="520" cy="120" r="45" fill="#fff" stroke="none"/>
                <!-- 标记基因弧 -->
                <path d="M 520 70 A 50 50 0 0 1 545 82" fill="none" stroke="#ffeb3b" stroke-width="6" stroke-linecap="round"/>
                <!-- 质粒标签 -->
                <text x="520" y="195" text-anchor="middle" font-size="14" fill="#333">质粒（载体）</text>
                <!-- 说明文字 -->
                <text x="400" y="240" text-anchor="middle" font-size="14" fill="#333">最常用的运输工具是质粒</text>
            </g>

            <!-- 步骤1：限制酶切割 -->
            <g id="scene3-step-1" class="scene3-step-group" style="display:none;opacity:0">
                <!-- DNA左段上链 -->
                <path d="M100,115 Q110,105 120,115 Q130,125 140,115 Q150,105 160,115 Q170,125 180,115" fill="none" stroke="#000" stroke-width="2"/>
                <!-- DNA左段下链 -->
                <path d="M100,155 Q110,165 120,155 Q130,145 140,155 Q150,165 160,155 Q170,145 180,155" fill="none" stroke="#000" stroke-width="2"/>
                <!-- DNA右段上链 -->
                <path d="M220,115 Q230,105 240,115 Q250,125 260,115 Q270,105 280,115 Q290,125 300,115" fill="none" stroke="#000" stroke-width="2"/>
                <!-- DNA右段下链 -->
                <path d="M220,155 Q230,165 240,155 Q250,145 260,155 Q270,165 280,155 Q290,145 300,155" fill="none" stroke="#000" stroke-width="2"/>
                <!-- 黏性末端上 -->
                <path d="M180,115 L185,130" fill="none" stroke="#c62828" stroke-width="2"/>
                <!-- 黏性末端下 -->
                <path d="M220,155 L215,140" fill="none" stroke="#c62828" stroke-width="2"/>
                <!-- 限制酶图标（剪刀形状） -->
                <g transform="translate(182,50)">
                    <rect x="0" y="0" width="35" height="35" rx="4" fill="#ffeb3b" stroke="#f9a825" stroke-width="1"/>
                    <path d="M10,10 L18,25 M25,10 L18,25" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
                    <circle cx="18" cy="8" r="2" fill="#333"/>
                </g>
                <!-- 限制酶标签 -->
                <text x="200" y="45" text-anchor="middle" font-size="13" fill="#333">限制酶</text>
                <!-- 同一种限制酶标签（下移避免与标题重叠） -->
                <text x="360" y="78" text-anchor="middle" font-size="13" fill="#333">同一种限制酶</text>
                <!-- 黏性末端标签 -->
                <text x="200" y="180" text-anchor="middle" font-size="13" fill="#333">黏性末端</text>
                <!-- 切开的质粒（顶部缺口） -->
                <path d="M 520 65 A 55 55 0 1 1 519.9 65" fill="none" stroke="#1565c0" stroke-width="8" stroke-linecap="round"/>
                <!-- 质粒标签 -->
                <text x="520" y="205" text-anchor="middle" font-size="14" fill="#333">质粒</text>
            </g>

            <!-- 步骤2：构建重组DNA分子 -->
            <g id="scene3-step-2" class="scene3-step-group" style="display:none;opacity:0">
                <!-- 重组质粒外环 -->
                <circle cx="400" cy="180" r="75" fill="none" stroke="#1565c0" stroke-width="12"/>
                <!-- 重组质粒内环 -->
                <circle cx="400" cy="180" r="60" fill="#fff" stroke="none"/>
                <!-- 插入目的基因段（右上象限弧） -->
                <path d="M 460 127 A 67 67 0 0 1 467 180" fill="none" stroke="#c62828" stroke-width="10" stroke-linecap="round"/>
                <!-- DNA连接酶图标（放在质环左侧避免与标题重叠） -->
                <g transform="translate(290,40)">
                    <rect x="0" y="0" width="35" height="35" rx="4" fill="#ff9800" stroke="#e65100" stroke-width="1"/>
                    <path d="M8,18 L27,18 M12,12 L23,24 M12,24 L23,12" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
                </g>
                <!-- DNA连接酶标签（放在图标下方） -->
                <text x="307" y="115" text-anchor="middle" font-size="13" fill="#333">DNA连接酶</text>
                <!-- 目的基因b标签 -->
                <text x="490" y="130" text-anchor="start" font-size="13" fill="#333">目的基因 b</text>
                <!-- 重组质粒标签 -->
                <text x="400" y="275" text-anchor="middle" font-size="14" fill="#333">重组质粒（重组DNA分子）</text>
            </g>

            <!-- 步骤3：将重组质粒导入花菜体细胞 -->
            <g id="scene3-step-3" class="scene3-step-group" style="display:none;opacity:0">
                <!-- 重组质粒（缩小版） -->
                <circle cx="180" cy="190" r="45" fill="none" stroke="#1565c0" stroke-width="8"/>
                <circle cx="180" cy="190" r="35" fill="#fff" stroke="none"/>
                <path d="M 225 145 A 50 50 0 0 1 230 190" fill="none" stroke="#c62828" stroke-width="7" stroke-linecap="round"/>
                <!-- 重组质粒标签 -->
                <text x="180" y="255" text-anchor="middle" font-size="13" fill="#333">重组质粒</text>
                <!-- 导入箭头（虚线） -->
                <line x1="230" y1="190" x2="385" y2="190" stroke="#888" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#scene3-arrowhead)"/>
                <!-- 农杆菌转化法标签 -->
                <text x="300" y="175" text-anchor="middle" font-size="13" fill="#333">农杆菌转化法</text>
                <!-- 花菜细胞壁 -->
                <circle cx="480" cy="210" r="90" fill="none" stroke="#1565c0" stroke-width="3"/>
                <!-- 花菜细胞膜 -->
                <circle cx="480" cy="210" r="85" fill="none" stroke="#888" stroke-width="1"/>
                <!-- 细胞核 -->
                <circle cx="480" cy="210" r="30" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
                <!-- 核内质粒（红蓝相间小圆点） -->
                <circle cx="480" cy="210" r="8" fill="#1565c0" stroke="none"/>
                <path d="M 480 202 A 8 8 0 0 1 480 218" fill="#c62828" stroke="none"/>
                <!-- 花菜体细胞标签 -->
                <text x="480" y="320" text-anchor="middle" font-size="14" fill="#333">花菜体细胞</text>
            </g>

            <!-- 步骤4：目的基因表达与性状表现 -->
            <g id="scene3-step-4" class="scene3-step-group" style="display:none;opacity:0">
                <!-- 细胞轮廓 -->
                <circle cx="180" cy="240" r="80" fill="#f5f5f5" stroke="#888" stroke-width="2"/>
                <!-- 细胞核 -->
                <circle cx="180" cy="215" r="25" fill="#fff" stroke="#000" stroke-width="2"/>
                <!-- 核内DNA（双螺旋小图标） -->
                <g transform="translate(170,208)">
                    <path d="M0,0 Q5,7 10,0 M0,4 Q5,11 10,4" fill="none" stroke="#c62828" stroke-width="1.5"/>
                    <line x1="2" y1="2" x2="8" y2="2" stroke="#c62828" stroke-width="1"/>
                    <line x1="2" y1="6" x2="8" y2="6" stroke="#c62828" stroke-width="1"/>
                </g>
                <!-- 转录箭头（起点外移避免压核） -->
                <line x1="205" y1="220" x2="220" y2="235" stroke="#000" stroke-width="2" marker-end="url(#scene3-arrowhead-small)"/>
                <!-- 转录标签（左移上移避免与细胞核重叠） -->
                <text x="95" y="175" text-anchor="middle" font-size="12" fill="#333">转录</text>
                <!-- mRNA -->
                <path d="M225,235 Q230,230 235,235 Q240,240 245,235 Q250,230 255,235" fill="none" stroke="#1565c0" stroke-width="2"/>
                <!-- mRNA标签（右移上移避免与细胞重叠） -->
                <text x="285" y="205" text-anchor="middle" font-size="12" fill="#333">mRNA</text>
                <!-- 翻译箭头 -->
                <line x1="255" y1="235" x2="275" y2="235" stroke="#000" stroke-width="2" marker-end="url(#scene3-arrowhead-small)"/>
                <!-- 翻译标签（右移避免与mRNA拥挤） -->
                <text x="340" y="205" text-anchor="middle" font-size="12" fill="#333">翻译</text>
                <!-- 蛋白质 -->
                <circle cx="295" cy="235" r="12" fill="#2e7d32" stroke="none"/>
                <!-- 蛋白质标签（下移避免压蛋白质） -->
                <text x="295" y="265" text-anchor="middle" font-size="12" fill="#333">蛋白质</text>
                <!-- 基因表达标签 -->
                <text x="180" y="335" text-anchor="middle" font-size="13" fill="#333">基因表达</text>

                <!-- 花菜植株 -->
                <!-- 根部 -->
                <path d="M540,340 Q530,360 520,370 M550,340 Q550,365 545,375 M560,340 Q570,360 580,370" fill="none" stroke="#8d6e63" stroke-width="3" stroke-linecap="round"/>
                <!-- 花轴 -->
                <line x1="550" y1="340" x2="550" y2="200" stroke="#2e7d32" stroke-width="6" stroke-linecap="round"/>
                <!-- 花柄1 -->
                <line x1="550" y1="280" x2="510" y2="250" stroke="#2e7d32" stroke-width="3" stroke-linecap="round"/>
                <!-- 花柄2 -->
                <line x1="550" y1="280" x2="590" y2="250" stroke="#2e7d32" stroke-width="3" stroke-linecap="round"/>
                <!-- 花1 -->
                <g transform="translate(510,240)">
                    <circle cx="0" cy="-8" r="8" fill="#2e7d32"/>
                    <circle cx="8" cy="0" r="8" fill="#2e7d32"/>
                    <circle cx="0" cy="8" r="8" fill="#2e7d32"/>
                    <circle cx="-8" cy="0" r="8" fill="#2e7d32"/>
                    <circle cx="0" cy="0" r="5" fill="#4caf50"/>
                </g>
                <!-- 花2 -->
                <g transform="translate(590,240)">
                    <circle cx="0" cy="-8" r="8" fill="#2e7d32"/>
                    <circle cx="8" cy="0" r="8" fill="#2e7d32"/>
                    <circle cx="0" cy="8" r="8" fill="#2e7d32"/>
                    <circle cx="-8" cy="0" r="8" fill="#2e7d32"/>
                    <circle cx="0" cy="0" r="5" fill="#4caf50"/>
                </g>
                <!-- 顶花 -->
                <g transform="translate(550,190)">
                    <circle cx="0" cy="-10" r="10" fill="#2e7d32"/>
                    <circle cx="10" cy="0" r="10" fill="#2e7d32"/>
                    <circle cx="0" cy="10" r="10" fill="#2e7d32"/>
                    <circle cx="-10" cy="0" r="10" fill="#2e7d32"/>
                    <circle cx="0" cy="0" r="6" fill="#4caf50"/>
                </g>
                <!-- 叶子1 -->
                <ellipse cx="520" cy="310" rx="30" ry="15" fill="#2e7d32"/>
                <!-- 叶子2 -->
                <ellipse cx="580" cy="310" rx="30" ry="15" fill="#2e7d32"/>
                <!-- 花菜植株标签 -->
                <text x="550" y="395" text-anchor="middle" font-size="14" fill="#333">花菜植株</text>
                <!-- 绿色性状标签（下移避免拥挤） -->
                <text x="550" y="430" text-anchor="middle" font-size="13" fill="#333">花轴、花柄、花呈绿色</text>
            </g>

            <!-- 箭头标记定义 -->
            <defs>
                <marker id="scene3-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#888"/>
                </marker>
                <marker id="scene3-arrowhead-small" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                    <polygon points="0 0, 8 3, 0 6" fill="#000"/>
                </marker>
            </defs>
        </svg>

        <!-- 控件栏 -->
        <div id="scene3-controls">
            <button id="scene3-btn-prev" disabled>◀ 上一步</button>
            <span id="scene3-step-indicator">步骤 1 / 5</span>
            <button id="scene3-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 3 实现：基因工程基本操作流程分步导航
        var currentStep = 0;
        var totalSteps = 5;
        var stepTitles = [
            "步骤1：获取目的基因与载体",
            "步骤2：限制酶切割",
            "步骤3：构建重组DNA分子",
            "步骤4：将重组质粒导入花菜体细胞",
            "步骤5：目的基因表达与性状表现"
        ];

        var btnPrev = document.getElementById("scene3-btn-prev");
        var btnNext = document.getElementById("scene3-btn-next");
        var indicator = document.getElementById("scene3-step-indicator");

        function show(el) {
            el.style.display = "block";
            // 强制重排后设置opacity实现淡入
            requestAnimationFrame(function() {
                el.style.opacity = "1";
            });
        }

        function hide(el) {
            el.style.opacity = "0";
            setTimeout(function() {
                el.style.display = "none";
            }, 300);
        }

        function renderStep() {
            // 更新步骤标题（在SVG顶部添加/更新标题文本）
            var existingTitle = document.getElementById("scene3-step-title");
            if (existingTitle) {
                existingTitle.textContent = stepTitles[currentStep];
            } else {
                var svg = document.getElementById("scene3-svg");
                var title = document.createElementNS("http://www.w3.org/2000/svg", "text");
                title.setAttribute("id", "scene3-step-title");
                title.setAttribute("x", "400");
                title.setAttribute("y", "42");
                title.setAttribute("text-anchor", "middle");
                title.setAttribute("font-size", "16");
                title.setAttribute("font-weight", "bold");
                title.setAttribute("fill", "#1565c0");
                title.textContent = stepTitles[currentStep];
                svg.insertBefore(title, svg.firstChild);
            }

            // 切换步骤组显示
            for (var i = 0; i < totalSteps; i++) {
                var group = document.getElementById("scene3-step-" + i);
                if (i === currentStep) {
                    show(group);
                } else {
                    hide(group);
                }
            }

            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps - 1);
            indicator.textContent = "步骤 " + (currentStep + 1) + " / " + totalSteps;
        }

        btnPrev.addEventListener("click", function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        });

        btnNext.addEventListener("click", function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                renderStep();
            }
        });

        // 初始化
        renderStep();
    })();
    </script>
</body>
</html>
