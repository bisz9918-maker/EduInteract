<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 1 - 基因控制花色合成</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            padding: 6px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc;
            border-radius: 4px; background: #f5f5f5; color: #333;
        }
        #scene1-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene1-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 13px; color: #666; min-width: 70px; text-align: center; }

        /* 高亮样式 */
        .highlight-red { stroke: #c62828 !important; }
        .highlight-red-fill { fill: rgba(198,40,40,0.15) !important; stroke: #c62828 !important; }
        .highlight-blue { stroke: #1565c0 !important; }
        .highlight-blue-fill { fill: rgba(21,101,192,0.15) !important; stroke: #1565c0 !important; }
        .highlight-green { stroke: #2e7d32 !important; }
        .highlight-green-fill { fill: rgba(46,125,50,0.15) !important; stroke: #2e7d32 !important; }

        /* 步骤控制 */
        .step-hidden { display: none; }
        .step-visible { display: block; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <defs>
                <!-- 箭头标记 -->
                <marker id="scene1-arrowhead-black" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
                </marker>
                <marker id="scene1-arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#c62828"/>
                </marker>
                <marker id="scene1-arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0"/>
                </marker>
            </defs>

            <!-- ========== 左侧路径（基因B → 蓝色色素）========== -->
            <!-- 基因B框 -->
            <rect id="scene1-gene-b-box" x="200" y="50" width="80" height="30" rx="4" ry="4"
                  fill="#fff" stroke="#000" stroke-width="1.5"/>
            <foreignObject id="scene1-gene-b-label-fo" x="200" y="50" width="80" height="30">
                <div xmlns="http://www.w3.org/1999/xhtml" style="width:80px;height:30px;display:flex;align-items:center;justify-content:center;font-size:14px;font-family:'Microsoft YaHei','PingFang SC',sans-serif;color:#000;">基因B</div>
            </foreignObject>

            <!-- 转录箭头B -->
            <line id="scene1-arrow-transcript-b" x1="240" y1="80" x2="240" y2="125"
                  stroke="#000" stroke-width="2" marker-end="url(#scene1-arrowhead-black)"/>
            <!-- 标注①左 -->
            <text id="scene1-label-one-left" x="185" y="105" text-anchor="middle" dominant-baseline="middle"
                  font-size="14" fill="#000">①</text>

            <!-- mRNA_B -->
            <text id="scene1-mrna-b" x="240" y="135" text-anchor="middle" dominant-baseline="middle"
                  font-size="14" fill="#000">mRNA</text>

            <!-- mRNA_B结合线（虚线） -->
            <line id="scene1-mrna-bind-line-b" x1="270" y1="135" x2="300" y2="135"
                  stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>

            <!-- 翻译箭头B -->
            <line id="scene1-arrow-translate-b" x1="240" y1="145" x2="240" y2="195"
                  stroke="#000" stroke-width="2" marker-end="url(#scene1-arrowhead-black)"/>
            <!-- 标注②左 -->
            <text id="scene1-label-two-left" x="185" y="172" text-anchor="middle" dominant-baseline="middle"
                  font-size="14" fill="#000">②</text>

            <!-- 酶B框 -->
            <rect id="scene1-enzyme-b-box" x="200" y="195" width="80" height="30" rx="4" ry="4"
                  fill="#fff" stroke="#000" stroke-width="1.5"/>
            <foreignObject id="scene1-enzyme-b-label-fo" x="200" y="195" width="80" height="30">
                <div xmlns="http://www.w3.org/1999/xhtml" style="width:80px;height:30px;display:flex;align-items:center;justify-content:center;font-size:14px;font-family:'Microsoft YaHei','PingFang SC',sans-serif;color:#000;">酶B</div>
            </foreignObject>

            <!-- 酶B作用线 -->
            <line id="scene1-enzyme-b-line" x1="240" y1="225" x2="240" y2="305"
                  stroke="#000" stroke-width="2"/>
            <!-- 作用点B -->
            <circle id="scene1-site-b" cx="240" cy="305" r="4" fill="#000"/>

            <!-- 蓝色色素框 -->
            <rect id="scene1-pigment-blue-box" x="120" y="290" width="100" height="30" rx="4" ry="4"
                  fill="rgba(0,131,143,0.2)" stroke="#00838f" stroke-width="1.5"/>
            <foreignObject id="scene1-pigment-blue-label-fo" x="120" y="290" width="100" height="30">
                <div xmlns="http://www.w3.org/1999/xhtml" style="width:100px;height:30px;display:flex;align-items:center;justify-content:center;font-size:14px;font-family:'Microsoft YaHei','PingFang SC',sans-serif;color:#000;">蓝色色素</div>
            </foreignObject>

            <!-- 前体→蓝色箭头 -->
            <line id="scene1-arrow-to-blue" x1="340" y1="305" x2="220" y2="305"
                  stroke="#000" stroke-width="2" marker-end="url(#scene1-arrowhead-black)"/>


            <!-- ========== 右侧路径（基因A → 紫色色素）========== -->
            <!-- 基因A框 -->
            <rect id="scene1-gene-a-box" x="520" y="50" width="80" height="30" rx="4" ry="4"
                  fill="#fff" stroke="#000" stroke-width="1.5"/>
            <foreignObject id="scene1-gene-a-label-fo" x="520" y="50" width="80" height="30">
                <div xmlns="http://www.w3.org/1999/xhtml" style="width:80px;height:30px;display:flex;align-items:center;justify-content:center;font-size:14px;font-family:'Microsoft YaHei','PingFang SC',sans-serif;color:#000;">基因A</div>
            </foreignObject>

            <!-- 转录箭头A -->
            <line id="scene1-arrow-transcript-a" x1="560" y1="80" x2="560" y2="125"
                  stroke="#000" stroke-width="2" marker-end="url(#scene1-arrowhead-black)"/>
            <!-- 标注①右 -->
            <text id="scene1-label-one-right" x="615" y="105" text-anchor="middle" dominant-baseline="middle"
                  font-size="14" fill="#000">①</text>

            <!-- mRNA_A -->
            <text id="scene1-mrna-a" x="560" y="135" text-anchor="middle" dominant-baseline="middle"
                  font-size="14" fill="#000">mRNA</text>

            <!-- mRNA_A结合线（虚线） -->
            <line id="scene1-mrna-bind-line-a" x1="530" y1="135" x2="500" y2="135"
                  stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>

            <!-- 翻译箭头A -->
            <line id="scene1-arrow-translate-a" x1="560" y1="145" x2="560" y2="195"
                  stroke="#000" stroke-width="2" marker-end="url(#scene1-arrowhead-black)"/>
            <!-- 标注②右 -->
            <text id="scene1-label-two-right" x="615" y="172" text-anchor="middle" dominant-baseline="middle"
                  font-size="14" fill="#000">②</text>

            <!-- 酶A框 -->
            <rect id="scene1-enzyme-a-box" x="520" y="195" width="80" height="30" rx="4" ry="4"
                  fill="#fff" stroke="#000" stroke-width="1.5"/>
            <foreignObject id="scene1-enzyme-a-label-fo" x="520" y="195" width="80" height="30">
                <div xmlns="http://www.w3.org/1999/xhtml" style="width:80px;height:30px;display:flex;align-items:center;justify-content:center;font-size:14px;font-family:'Microsoft YaHei','PingFang SC',sans-serif;color:#000;">酶A</div>
            </foreignObject>

            <!-- 酶A作用线 -->
            <line id="scene1-enzyme-a-line" x1="560" y1="225" x2="560" y2="305"
                  stroke="#000" stroke-width="2"/>
            <!-- 作用点A -->
            <circle id="scene1-site-a" cx="560" cy="305" r="4" fill="#000"/>

            <!-- 紫色色素框 -->
            <rect id="scene1-pigment-purple-box" x="580" y="290" width="100" height="30" rx="4" ry="4"
                  fill="rgba(123,31,162,0.2)" stroke="#7b1fa2" stroke-width="1.5"/>
            <foreignObject id="scene1-pigment-purple-label-fo" x="580" y="290" width="100" height="30">
                <div xmlns="http://www.w3.org/1999/xhtml" style="width:100px;height:30px;display:flex;align-items:center;justify-content:center;font-size:14px;font-family:'Microsoft YaHei','PingFang SC',sans-serif;color:#000;">紫色色素</div>
            </foreignObject>

            <!-- 前体→紫色箭头 -->
            <line id="scene1-arrow-to-purple" x1="460" y1="305" x2="580" y2="305"
                  stroke="#000" stroke-width="2" marker-end="url(#scene1-arrowhead-black)"/>


            <!-- ========== 中央元素 ========== -->
            <!-- 白色前体框 -->
            <rect id="scene1-precursor-box" x="340" y="290" width="120" height="30" rx="4" ry="4"
                  fill="#f5f5f5" stroke="#888" stroke-width="1.5"/>
            <foreignObject id="scene1-precursor-label-fo" x="340" y="290" width="120" height="30">
                <div xmlns="http://www.w3.org/1999/xhtml" style="width:120px;height:30px;display:flex;align-items:center;justify-content:center;font-size:14px;font-family:'Microsoft YaHei','PingFang SC',sans-serif;color:#000;">白色前体物质</div>
            </foreignObject>

            <!-- mRNA结合说明框（虚线圆角矩形） -->
            <rect id="scene1-mrna-bind-box" x="300" y="90" width="200" height="70" rx="6" ry="6"
                  fill="none" stroke="#888" stroke-width="1" stroke-dasharray="5,4"/>
            <!-- 结合说明文字 -->
            <foreignObject id="scene1-bind-text-fo" x="300" y="90" width="200" height="70">
                <div xmlns="http://www.w3.org/1999/xhtml" style="width:200px;height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-family:'Microsoft YaHei','PingFang SC',sans-serif;color:#000;text-align:center;line-height:1.5;">
                    <div>A、B基因同时存在时</div>
                    <div>两种mRNA结合</div>
                    <div>使酶A、酶B不能合成</div>
                </div>
            </foreignObject>


            <!-- ========== 结论文字（步骤1、2） ========== -->
            <text id="scene1-conclusion-step1" x="400" y="345" text-anchor="middle" dominant-baseline="middle"
                  font-size="14" fill="#000" class="step-hidden">①、②过程合称基因的表达</text>
            <text id="scene1-conclusion-step2" x="400" y="365" text-anchor="middle" dominant-baseline="middle"
                  font-size="14" fill="#000" class="step-hidden">基因通过控制酶的合成来控制代谢过程，进而控制生物性状</text>


            <!-- ========== 基因型对应表（步骤3） ========== -->
            <g id="scene1-genotype-table" class="step-hidden">
                <!-- 表头 -->
                <text x="320" y="330" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#000" font-weight="bold">基因型</text>
                <text x="480" y="330" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#000" font-weight="bold">表现型</text>
                <!-- 分隔线 -->
                <line x1="400" y1="338" x2="400" y2="452" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
                <!-- 表行1 -->
                <text x="320" y="358" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#000">A_bb</text>
                <text x="480" y="358" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#000">紫花</text>
                <!-- 表行2 -->
                <text x="320" y="388" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#000">aaB_</text>
                <text x="480" y="388" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#000">蓝花</text>
                <!-- 表行3 -->
                <text x="320" y="418" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#000">A_B_</text>
                <text x="480" y="418" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#000">白花</text>
                <!-- 表行4 -->
                <text x="320" y="448" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#000">aabb</text>
                <text x="480" y="448" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#000">白花</text>
            </g>
        </svg>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1 / 4</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        var currentStep = 0; // 0~3
        var totalSteps = 4;

        // 元素引用
        var btnPrev = document.getElementById('scene1-btn-prev');
        var btnNext = document.getElementById('scene1-btn-next');
        var indicator = document.getElementById('scene1-step-indicator');

        // 左侧路径元素（红色高亮组）- SVG元素
        var leftPathIds = [
            'scene1-gene-b-box',
            'scene1-arrow-transcript-b',
            'scene1-label-one-left',
            'scene1-mrna-b',
            'scene1-arrow-translate-b',
            'scene1-label-two-left',
            'scene1-enzyme-b-box',
            'scene1-enzyme-b-line',
            'scene1-site-b',
            'scene1-arrow-to-blue',
            'scene1-pigment-blue-box'
        ];

        // 右侧路径元素（蓝色高亮组）- SVG元素
        var rightPathIds = [
            'scene1-gene-a-box',
            'scene1-arrow-transcript-a',
            'scene1-label-one-right',
            'scene1-mrna-a',
            'scene1-arrow-translate-a',
            'scene1-label-two-right',
            'scene1-enzyme-a-box',
            'scene1-enzyme-a-line',
            'scene1-site-a',
            'scene1-arrow-to-purple',
            'scene1-pigment-purple-box'
        ];

        // 中央结合区域元素（绿色高亮组）
        var bindRegionIds = [
            'scene1-mrna-bind-box',
            'scene1-mrna-bind-line-b',
            'scene1-mrna-bind-line-a'
        ];

        // foreignObject标签ID（用于颜色高亮）
        var leftLabelFoIds = ['scene1-gene-b-label-fo', 'scene1-enzyme-b-label-fo', 'scene1-pigment-blue-label-fo'];
        var rightLabelFoIds = ['scene1-gene-a-label-fo', 'scene1-enzyme-a-label-fo', 'scene1-pigment-purple-label-fo'];
        var bindTextFoId = 'scene1-bind-text-fo';

        // 结论文字
        var conclusionStep1 = document.getElementById('scene1-conclusion-step1');
        var conclusionStep2 = document.getElementById('scene1-conclusion-step2');
        var genotypeTable = document.getElementById('scene1-genotype-table');

        function setFoColor(foId, color) {
            var fo = document.getElementById(foId);
            if (fo) {
                var divs = fo.querySelectorAll('div');
                divs.forEach(function(d) { d.style.color = color; });
            }
        }

        function resetFoColor(foId) {
            var fo = document.getElementById(foId);
            if (fo) {
                var divs = fo.querySelectorAll('div');
                divs.forEach(function(d) { d.style.color = '#000'; });
            }
        }

        function updateStep(newStep) {
            currentStep = newStep;

            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps - 1);
            indicator.textContent = '步骤 ' + (currentStep + 1) + ' / ' + totalSteps;

            // 清除所有高亮
            clearHighlights();

            // 隐藏所有结论和表格
            conclusionStep1.setAttribute('class', 'step-hidden');
            conclusionStep2.setAttribute('class', 'step-hidden');
            genotypeTable.setAttribute('class', 'step-hidden');

            // 根据步骤设置高亮和显示内容
            if (currentStep === 1) {
                // 步骤1：左右路径高亮
                leftPathIds.forEach(function(id) {
                    var el = document.getElementById(id);
                    if (el) {
                        if (el.tagName === 'rect') {
                            el.classList.add('highlight-red-fill');
                        } else {
                            el.classList.add('highlight-red');
                        }
                    }
                });
                rightPathIds.forEach(function(id) {
                    var el = document.getElementById(id);
                    if (el) {
                        if (el.tagName === 'rect') {
                            el.classList.add('highlight-blue-fill');
                        } else {
                            el.classList.add('highlight-blue');
                        }
                    }
                });
                // foreignObject标签变红/蓝
                leftLabelFoIds.forEach(function(id) { setFoColor(id, '#c62828'); });
                rightLabelFoIds.forEach(function(id) { setFoColor(id, '#1565c0'); });

                // 更新箭头标记为对应颜色
                document.getElementById('scene1-arrow-transcript-b').setAttribute('marker-end', 'url(#scene1-arrowhead-red)');
                document.getElementById('scene1-arrow-translate-b').setAttribute('marker-end', 'url(#scene1-arrowhead-red)');
                document.getElementById('scene1-arrow-to-blue').setAttribute('marker-end', 'url(#scene1-arrowhead-red)');
                document.getElementById('scene1-arrow-transcript-a').setAttribute('marker-end', 'url(#scene1-arrowhead-blue)');
                document.getElementById('scene1-arrow-translate-a').setAttribute('marker-end', 'url(#scene1-arrowhead-blue)');
                document.getElementById('scene1-arrow-to-purple').setAttribute('marker-end', 'url(#scene1-arrowhead-blue)');

                conclusionStep1.setAttribute('class', 'step-visible');
            } else if (currentStep === 2) {
                // 步骤2：中央结合区域高亮
                bindRegionIds.forEach(function(id) {
                    var el = document.getElementById(id);
                    if (el) {
                        if (el.tagName === 'rect') {
                            el.classList.add('highlight-green-fill');
                            el.setAttribute('stroke-dasharray', 'none');
                            el.setAttribute('stroke-width', '3');
                        } else {
                            el.classList.add('highlight-green');
                            el.setAttribute('stroke-dasharray', 'none');
                            el.setAttribute('stroke-width', '3');
                        }
                    }
                });
                // 结合说明文字变绿
                setFoColor(bindTextFoId, '#2e7d32');

                conclusionStep2.setAttribute('class', 'step-visible');
            } else if (currentStep === 3) {
                // 步骤3：显示基因型表
                genotypeTable.setAttribute('class', 'step-visible');
            }
        }

        function clearHighlights() {
            // 移除所有高亮类
            var allIds = leftPathIds.concat(rightPathIds).concat(bindRegionIds);
            allIds.forEach(function(id) {
                var el = document.getElementById(id);
                if (el) {
                    el.classList.remove('highlight-red', 'highlight-red-fill', 'highlight-blue', 'highlight-blue-fill', 'highlight-green', 'highlight-green-fill');
                    // 恢复默认样式
                    if (id === 'scene1-mrna-bind-box') {
                        el.setAttribute('stroke-dasharray', '5,4');
                        el.setAttribute('stroke-width', '1');
                        el.setAttribute('stroke', '#888');
                        el.setAttribute('fill', 'none');
                    } else if (id === 'scene1-mrna-bind-line-b' || id === 'scene1-mrna-bind-line-a') {
                        el.setAttribute('stroke-dasharray', '4,3');
                        el.setAttribute('stroke-width', '1');
                        el.setAttribute('stroke', '#888');
                    } else if (id === 'scene1-pigment-blue-box') {
                        el.setAttribute('stroke', '#00838f');
                        el.setAttribute('fill', 'rgba(0,131,143,0.2)');
                    } else if (id === 'scene1-pigment-purple-box') {
                        el.setAttribute('stroke', '#7b1fa2');
                        el.setAttribute('fill', 'rgba(123,31,162,0.2)');
                    } else if (id.indexOf('gene') !== -1 || id.indexOf('enzyme') !== -1) {
                        el.setAttribute('stroke', '#000');
                        el.setAttribute('fill', '#fff');
                    } else if (id.indexOf('arrow') !== -1) {
                        el.setAttribute('stroke', '#000');
                    } else if (id.indexOf('site') !== -1) {
                        el.setAttribute('fill', '#000');
                    } else if (id.indexOf('label') !== -1 || id.indexOf('mrna') !== -1) {
                        el.setAttribute('fill', '#000');
                    }
                }
            });
            // 恢复foreignObject标签颜色
            leftLabelFoIds.forEach(function(id) { resetFoColor(id); });
            rightLabelFoIds.forEach(function(id) { resetFoColor(id); });
            resetFoColor(bindTextFoId);

            // 恢复箭头标记
            document.getElementById('scene1-arrow-transcript-b').setAttribute('marker-end', 'url(#scene1-arrowhead-black)');
            document.getElementById('scene1-arrow-translate-b').setAttribute('marker-end', 'url(#scene1-arrowhead-black)');
            document.getElementById('scene1-arrow-to-blue').setAttribute('marker-end', 'url(#scene1-arrowhead-black)');
            document.getElementById('scene1-arrow-transcript-a').setAttribute('marker-end', 'url(#scene1-arrowhead-black)');
            document.getElementById('scene1-arrow-translate-a').setAttribute('marker-end', 'url(#scene1-arrowhead-black)');
            document.getElementById('scene1-arrow-to-purple').setAttribute('marker-end', 'url(#scene1-arrowhead-black)');
        }

        // 事件绑定
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) updateStep(currentStep - 1);
        });
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) updateStep(currentStep + 1);
        });

        // 初始化
        updateStep(0);
    })();
    </script>
</body>
</html>
