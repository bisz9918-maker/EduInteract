<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 双杂合子自交遗传图解</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 16px; z-index: 10; }
        #scene2-controls button {
            padding: 6px 16px; font-size: 14px; cursor: pointer;
            border: 1px solid #333; border-radius: 4px; background: #f5f5f5;
        }
        #scene2-controls button:hover { background: #e0e0e0; }
        #scene2-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene2-step-indicator { font-size: 14px; color: #333; min-width: 70px; text-align: center; }
        .scene2-hidden { display: none; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- ========== 步骤1: P代杂交基础条件 ========== -->
            <g id="scene2-step1-group">
                <!-- P 标签 -->
                <text x="20" y="105" font-size="16" fill="#000" font-weight="bold">P</text>
                <!-- 左框 AAbb/紫花 -->
                <rect x="30" y="70" width="90" height="60" fill="#fff" stroke="#000" stroke-width="1.5" />
                <text x="75" y="93" font-size="13" fill="#000" text-anchor="middle">AAbb</text>
                <text x="75" y="132" font-size="13" fill="#7b1fa2" text-anchor="middle">紫花</text>
                <!-- × 号 -->
                <text x="150" y="105" font-size="16" fill="#000" text-anchor="middle">×</text>
                <!-- 右框 aaBB/蓝花 -->
                <rect x="170" y="70" width="90" height="60" fill="#fff" stroke="#000" stroke-width="1.5" />
                <text x="215" y="93" font-size="13" fill="#000" text-anchor="middle">aaBB</text>
                <text x="215" y="132" font-size="13" fill="#00838f" text-anchor="middle">蓝花</text>
                <!-- P 代配子 (偏移避免与虚线重叠) -->
                <text x="55" y="175" font-size="13" fill="#000" text-anchor="middle">Ab</text>
                <text x="235" y="175" font-size="13" fill="#000" text-anchor="middle">aB</text>
                <!-- P→F₁ 虚线 -->
                <line x1="75" y1="155" x2="130" y2="200" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" />
                <line x1="215" y1="155" x2="170" y2="200" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" />
            </g>

            <!-- ========== 步骤2: F₁代与配子 ========== -->
            <g id="scene2-step2-group" class="scene2-hidden">
                <!-- F₁ 框 AaBb/白花 -->
                <rect x="95" y="200" width="90" height="60" fill="#fff" stroke="#1565c0" stroke-width="2" />
                <text x="140" y="223" font-size="14" fill="#1565c0" text-anchor="middle" font-weight="bold">AaBb</text>
                <text x="140" y="262" font-size="13" fill="#9e9e9e" text-anchor="middle">白花</text>
                <!-- F₁ 标签 -->
                <text x="55" y="233" font-size="16" fill="#000" font-weight="bold" text-anchor="end">F₁</text>
                <!-- ⊗ 自交符号 -->
                <text x="200" y="233" font-size="16" fill="#000" text-anchor="start">⊗</text>
                <!-- F₁ 配子 -->
                <text x="50" y="308" font-size="13" fill="#000" font-weight="bold">配子</text>
                <text x="110" y="308" font-size="13" fill="#c62828" text-anchor="middle">AB</text>
                <text x="140" y="308" font-size="13" fill="#c62828" text-anchor="middle">Ab</text>
                <text x="170" y="308" font-size="13" fill="#c62828" text-anchor="middle">aB</text>
                <text x="200" y="308" font-size="13" fill="#c62828" text-anchor="middle">ab</text>
            </g>

            <!-- ========== 步骤3: F₂棋盘格 ========== -->
            <g id="scene2-step3-group" class="scene2-hidden">
                <!-- F₂ 标签 -->
                <text x="280" y="60" font-size="16" fill="#000" font-weight="bold">F₂</text>
                <!-- 横表头 -->
                <text x="357" y="60" font-size="13" fill="#000" text-anchor="middle">AB</text>
                <text x="442" y="60" font-size="13" fill="#000" text-anchor="middle">Ab</text>
                <text x="527" y="60" font-size="13" fill="#000" text-anchor="middle">aB</text>
                <text x="612" y="60" font-size="13" fill="#000" text-anchor="middle">ab</text>
                <!-- 纵表头 -->
                <text x="295" y="105" font-size="13" fill="#000" text-anchor="middle">AB</text>
                <text x="295" y="170" font-size="13" fill="#000" text-anchor="middle">Ab</text>
                <text x="295" y="235" font-size="13" fill="#000" text-anchor="middle">aB</text>
                <text x="295" y="300" font-size="13" fill="#000" text-anchor="middle">ab</text>
                <!-- 棋盘格 16 格 -->
                <!-- 第1行 -->
                <rect x="320" y="80" width="75" height="50" fill="#fff" stroke="#000" stroke-width="1" />
                <rect x="405" y="80" width="75" height="50" fill="#fff" stroke="#000" stroke-width="1" />
                <rect x="490" y="80" width="75" height="50" fill="#fff" stroke="#000" stroke-width="1" />
                <rect x="575" y="80" width="75" height="50" fill="#fff" stroke="#000" stroke-width="1" />
                <!-- 第2行 -->
                <rect x="320" y="145" width="75" height="50" fill="#fff" stroke="#000" stroke-width="1" />
                <rect x="405" y="145" width="75" height="50" fill="#fff" stroke="#000" stroke-width="1" />
                <rect x="490" y="145" width="75" height="50" fill="#fff" stroke="#000" stroke-width="1" />
                <rect x="575" y="145" width="75" height="50" fill="#fff" stroke="#000" stroke-width="1" />
                <!-- 第3行 -->
                <rect x="320" y="210" width="75" height="50" fill="#fff" stroke="#000" stroke-width="1" />
                <rect x="405" y="210" width="75" height="50" fill="#fff" stroke="#000" stroke-width="1" />
                <rect x="490" y="210" width="75" height="50" fill="#fff" stroke="#000" stroke-width="1" />
                <rect x="575" y="210" width="75" height="50" fill="#fff" stroke="#000" stroke-width="1" />
                <!-- 第4行 -->
                <rect x="320" y="275" width="75" height="50" fill="#fff" stroke="#000" stroke-width="1" />
                <rect x="405" y="275" width="75" height="50" fill="#fff" stroke="#000" stroke-width="1" />
                <rect x="490" y="275" width="75" height="50" fill="#fff" stroke="#000" stroke-width="1" />
                <rect x="575" y="275" width="75" height="50" fill="#fff" stroke="#000" stroke-width="1" />
                <!-- 基因型文字 -->
                <!-- 第1行 -->
                <text x="357" y="108" font-size="12" fill="#000" text-anchor="middle">AABB</text>
                <text x="442" y="108" font-size="12" fill="#000" text-anchor="middle">AABb</text>
                <text x="527" y="108" font-size="12" fill="#000" text-anchor="middle">AaBB</text>
                <text x="612" y="108" font-size="12" fill="#000" text-anchor="middle">AaBb</text>
                <!-- 第2行 -->
                <text x="357" y="173" font-size="12" fill="#000" text-anchor="middle">AABb</text>
                <text x="442" y="173" font-size="12" fill="#000" text-anchor="middle">AAbb</text>
                <text x="527" y="173" font-size="12" fill="#000" text-anchor="middle">AaBb</text>
                <text x="612" y="173" font-size="12" fill="#000" text-anchor="middle">Aabb</text>
                <!-- 第3行 -->
                <text x="357" y="238" font-size="12" fill="#000" text-anchor="middle">AaBB</text>
                <text x="442" y="238" font-size="12" fill="#000" text-anchor="middle">AaBb</text>
                <text x="527" y="238" font-size="12" fill="#000" text-anchor="middle">aaBB</text>
                <text x="612" y="238" font-size="12" fill="#000" text-anchor="middle">aaBb</text>
                <!-- 第4行 -->
                <text x="357" y="303" font-size="12" fill="#000" text-anchor="middle">AaBb</text>
                <text x="442" y="303" font-size="12" fill="#000" text-anchor="middle">Aabb</text>
                <text x="527" y="303" font-size="12" fill="#000" text-anchor="middle">aaBb</text>
                <text x="612" y="303" font-size="12" fill="#000" text-anchor="middle">aabb</text>
            </g>

            <!-- ========== 步骤4: 表现型高亮覆盖层 ========== -->
            <g id="scene2-step4-group" class="scene2-hidden">
                <!-- 白花覆盖层 (10格) -->
                <rect x="320" y="80" width="75" height="50" fill="rgba(158,158,158,0.3)" />
                <rect x="405" y="80" width="75" height="50" fill="rgba(158,158,158,0.3)" />
                <rect x="490" y="80" width="75" height="50" fill="rgba(158,158,158,0.3)" />
                <rect x="575" y="80" width="75" height="50" fill="rgba(158,158,158,0.3)" />
                <rect x="320" y="145" width="75" height="50" fill="rgba(158,158,158,0.3)" />
                <rect x="490" y="145" width="75" height="50" fill="rgba(158,158,158,0.3)" />
                <rect x="320" y="210" width="75" height="50" fill="rgba(158,158,158,0.3)" />
                <rect x="405" y="210" width="75" height="50" fill="rgba(158,158,158,0.3)" />
                <rect x="320" y="275" width="75" height="50" fill="rgba(158,158,158,0.3)" />
                <rect x="575" y="275" width="75" height="50" fill="rgba(158,158,158,0.3)" />
                <!-- 紫花覆盖层 (3格) -->
                <rect x="405" y="145" width="75" height="50" fill="rgba(123,31,162,0.3)" />
                <rect x="575" y="145" width="75" height="50" fill="rgba(123,31,162,0.3)" />
                <rect x="405" y="275" width="75" height="50" fill="rgba(123,31,162,0.3)" />
                <!-- 蓝花覆盖层 (3格) -->
                <rect x="490" y="210" width="75" height="50" fill="rgba(0,131,143,0.3)" />
                <rect x="490" y="275" width="75" height="50" fill="rgba(0,131,143,0.3)" />
                <rect x="575" y="210" width="75" height="50" fill="rgba(0,131,143,0.3)" />
            </g>

            <!-- ========== 步骤5: 比例汇总 ========== -->
            <g id="scene2-step5-group" class="scene2-hidden">
                <!-- 标题 -->
                <text x="320" y="335" font-size="14" fill="#2e7d32" font-weight="bold">F₂表现型比例</text>
                <!-- 比例条 -->
                <rect x="320" y="350" width="213" height="30" fill="#9e9e9e" />
                <rect x="538" y="350" width="64" height="30" fill="#7b1fa2" />
                <rect x="607" y="350" width="64" height="30" fill="#00838f" />
                <!-- 比例文字 -->
                <text x="426" y="368" font-size="12" fill="#fff" text-anchor="middle" dominant-baseline="middle">白花 10/16</text>
                <text x="570" y="368" font-size="12" fill="#fff" text-anchor="middle" dominant-baseline="middle">紫花 3/16</text>
                <text x="639" y="368" font-size="12" fill="#fff" text-anchor="middle" dominant-baseline="middle">蓝花 3/16</text>
            </g>
        </svg>

        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-prev-btn">◀ 上一步</button>
            <span id="scene2-step-indicator">步骤 1/5</span>
            <button id="scene2-next-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2 实现
        let currentStep = 1;
        const totalSteps = 5;

        const prevBtn = document.getElementById('scene2-prev-btn');
        const nextBtn = document.getElementById('scene2-next-btn');
        const indicator = document.getElementById('scene2-step-indicator');

        function updateScene() {
            indicator.textContent = '步骤 ' + currentStep + '/' + totalSteps;
            prevBtn.disabled = (currentStep === 1);
            nextBtn.disabled = (currentStep === totalSteps);

            for (let i = 1; i <= totalSteps; i++) {
                const group = document.getElementById('scene2-step' + i + '-group');
                if (group) {
                    if (i <= currentStep) {
                        group.style.display = 'block';
                        group.style.opacity = '1';
                    } else {
                        group.style.display = 'none';
                        group.style.opacity = '0';
                    }
                }
            }
        }

        prevBtn.addEventListener('click', function() {
            if (currentStep > 1) {
                currentStep--;
                updateScene();
            }
        });

        nextBtn.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateScene();
            }
        });

        updateScene();
    })();
    </script>
</body>
</html>
