<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>叠放木块系统静摩擦力变化分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-step-title { position: absolute; bottom: 48px; left: 0; right: 0; text-align: center; font-size: 15px; color: #333; font-weight: bold; }
        .scene1-btn { padding: 6px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: #f8f8f8; }
        .scene1-btn:hover { background: #e8e8e8; }
        .scene1-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .scene1-highlight { fill: #1565c0; fill-opacity: 0.2; }
        .scene1-dim { opacity: 0.3; }
        .scene1-force-group { display: none; }
        .scene1-force-group.active { display: block; }
        /* 柔和过渡 */
        #scene1-svg * { transition: opacity 0.25s ease; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <div id="scene1-step-title">步骤 1/9：初始装置</div>
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <defs>
                <!-- 箭头标记 -->
                <marker id="scene1-arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#2e7d32"/>
                </marker>
                <marker id="scene1-arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#1565c0"/>
                </marker>
                <marker id="scene1-arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#c62828"/>
                </marker>
            </defs>

            <!-- ==================== 左侧装置区 ==================== -->
            <!-- 实验台阴影斜线 -->
            <g id="scene1-table-shadow">
                <line x1="70" y1="305" x2="90" y2="320" stroke="#000" stroke-width="1"/>
                <line x1="90" y1="305" x2="110" y2="320" stroke="#000" stroke-width="1"/>
                <line x1="110" y1="305" x2="130" y2="320" stroke="#000" stroke-width="1"/>
                <line x1="130" y1="305" x2="150" y2="320" stroke="#000" stroke-width="1"/>
                <line x1="150" y1="305" x2="170" y2="320" stroke="#000" stroke-width="1"/>
                <line x1="170" y1="305" x2="190" y2="320" stroke="#000" stroke-width="1"/>
                <line x1="190" y1="305" x2="210" y2="320" stroke="#000" stroke-width="1"/>
                <line x1="210" y1="305" x2="230" y2="320" stroke="#000" stroke-width="1"/>
                <line x1="230" y1="305" x2="250" y2="320" stroke="#000" stroke-width="1"/>
                <line x1="250" y1="305" x2="270" y2="320" stroke="#000" stroke-width="1"/>
                <line x1="270" y1="305" x2="290" y2="320" stroke="#000" stroke-width="1"/>
                <line x1="290" y1="305" x2="310" y2="320" stroke="#000" stroke-width="1"/>
                <line x1="310" y1="305" x2="330" y2="320" stroke="#000" stroke-width="1"/>
                <line x1="330" y1="305" x2="350" y2="320" stroke="#000" stroke-width="1"/>
                <line x1="350" y1="305" x2="370" y2="320" stroke="#000" stroke-width="1"/>
            </g>
            <!-- 实验台台面 -->
            <line id="scene1-table-top" x1="60" y1="300" x2="380" y2="300" stroke="#000" stroke-width="3"/>
            <!-- 左侧支撑 -->
            <line id="scene1-table-leg" x1="60" y1="300" x2="60" y2="360" stroke="#000" stroke-width="3"/>

            <!-- 左侧滑轮 -->
            <g id="scene1-pulley-left">
                <line x1="80" y1="218" x2="80" y2="300" stroke="#000" stroke-width="2"/>
                <circle cx="80" cy="200" r="18" stroke="#000" stroke-width="2" fill="none"/>
                <line x1="80" y1="182" x2="80" y2="218" stroke="#000" stroke-width="1"/>
                <line x1="62" y1="200" x2="98" y2="200" stroke="#000" stroke-width="1"/>
            </g>
            <!-- 右侧滑轮 -->
            <g id="scene1-pulley-right">
                <line x1="360" y1="218" x2="360" y2="300" stroke="#000" stroke-width="2"/>
                <circle cx="360" cy="200" r="18" stroke="#000" stroke-width="2" fill="none"/>
                <line x1="360" y1="182" x2="360" y2="218" stroke="#000" stroke-width="1"/>
                <line x1="342" y1="200" x2="378" y2="200" stroke="#000" stroke-width="1"/>
            </g>

            <!-- 木块B -->
            <rect id="scene1-block-b" x="160" y="260" width="120" height="40" stroke="#000" stroke-width="2" fill="none"/>
            <!-- 木块A -->
            <rect id="scene1-block-a" x="190" y="220" width="60" height="40" stroke="#000" stroke-width="2" fill="none"/>

            <!-- 标签 A B — 放在木块上方，避免与内部元素重叠 -->
            <text id="scene1-label-a" x="220" y="212" text-anchor="middle" font-size="14" fill="#000">A</text>
            <text id="scene1-label-b" x="220" y="252" text-anchor="middle" font-size="14" fill="#000">B</text>

            <!-- 左侧钩码（初始状态） -->
            <g id="scene1-left-weights-init">
                <rect x="65" y="260" width="30" height="20" rx="3" stroke="#000" stroke-width="1.5" fill="#e0e0e0"/>
                <text x="80" y="274" text-anchor="middle" font-size="12" fill="#000">4</text>
                <rect x="65" y="282" width="30" height="20" rx="3" stroke="#000" stroke-width="1.5" fill="#e0e0e0"/>
                <text x="80" y="296" text-anchor="middle" font-size="12" fill="#000">5</text>
            </g>
            <!-- 左侧钩码（变化后：仅4号） -->
            <g id="scene1-left-weights-changed" style="display:none">
                <rect x="65" y="260" width="30" height="20" rx="3" stroke="#000" stroke-width="1.5" fill="#e0e0e0"/>
                <text x="80" y="274" text-anchor="middle" font-size="12" fill="#000">4</text>
            </g>

            <!-- 右侧钩码 -->
            <g id="scene1-right-weights">
                <rect x="345" y="260" width="30" height="20" rx="3" stroke="#000" stroke-width="1.5" fill="#e0e0e0"/>
                <text x="360" y="274" text-anchor="middle" font-size="12" fill="#000">1</text>
                <rect x="345" y="282" width="30" height="20" rx="3" stroke="#000" stroke-width="1.5" fill="#e0e0e0"/>
                <text x="360" y="296" text-anchor="middle" font-size="12" fill="#000">2</text>
                <rect x="345" y="304" width="30" height="20" rx="3" stroke="#000" stroke-width="1.5" fill="#e0e0e0"/>
                <text x="360" y="318" text-anchor="middle" font-size="12" fill="#000">3</text>
            </g>

            <!-- 5号在A上（变化后显示）— 放在A的右上角，避免与A标签重叠 -->
            <g id="scene1-weight5-on-a" style="display:none">
                <rect x="230" y="198" width="26" height="18" rx="3" stroke="#000" stroke-width="1.5" fill="#e0e0e0"/>
                <text x="243" y="211" text-anchor="middle" font-size="11" fill="#000">5</text>
            </g>

            <!-- 左侧绳（初始：连到A左侧，经左侧滑轮到钩码） -->
            <polyline id="scene1-rope-left-init" points="190,240 98,200 80,218 80,260" stroke="#000" stroke-width="1.5" fill="none"/>

            <!-- 右侧绳 -->
            <polyline id="scene1-rope-right" points="280,280 342,200 360,218 360,260" stroke="#000" stroke-width="1.5" fill="none"/>

            <!-- ==================== 右侧受力图区 ==================== -->
            <!-- 隔离体虚线框 -->
            <rect id="scene1-isolation-box" x="500" y="170" width="220" height="160" stroke="#888" stroke-width="1" stroke-dasharray="5,5" fill="none" style="display:none"/>

            <!-- 步骤0：右侧提示文本 -->
            <g id="scene1-force-step0" class="scene1-force-group active">
                <text x="610" y="230" text-anchor="middle" font-size="14" fill="#333">初始状态</text>
                <text x="610" y="255" text-anchor="middle" font-size="13" fill="#555">左侧2个钩码拉A</text>
                <text x="610" y="280" text-anchor="middle" font-size="13" fill="#555">右侧3个钩码拉B</text>
            </g>

            <!-- 步骤1：隔离A·初始 -->
            <g id="scene1-force-step1" class="scene1-force-group">
                <!-- A轮廓 -->
                <rect x="580" y="200" width="80" height="40" stroke="#000" stroke-width="2" fill="none"/>
                <!-- G_A 向下 -->
                <line x1="620" y1="240" x2="620" y2="280" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene1-arrow-green)"/>
                <text x="630" y="290" font-size="12" fill="#2e7d32">G_A</text>
                <!-- N_BA 向上 -->
                <line x1="620" y1="240" x2="620" y2="205" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-blue)"/>
                <text x="630" y="198" font-size="12" fill="#1565c0">N_BA</text>
                <!-- T左=2G 向左 -->
                <line x1="580" y1="220" x2="525" y2="220" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-blue)"/>
                <text x="500" y="216" font-size="12" fill="#1565c0">T左=2G</text>
                <!-- f_BA=2G 向右 -->
                <line x1="660" y1="220" x2="710" y2="220" stroke="#c62828" stroke-width="3" marker-end="url(#scene1-arrow-red)"/>
                <text x="715" y="216" font-size="12" fill="#c62828">f_BA=2G</text>
            </g>

            <!-- 步骤2：隔离B·初始 -->
            <g id="scene1-force-step2" class="scene1-force-group">
                <!-- B轮廓 -->
                <rect x="570" y="240" width="100" height="50" stroke="#000" stroke-width="2" fill="none"/>
                <!-- G_B 向下 -->
                <line x1="620" y1="290" x2="620" y2="325" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene1-arrow-green)"/>
                <text x="630" y="335" font-size="12" fill="#2e7d32">G_B</text>
                <!-- N_AB 向下（A对B的压力） -->
                <line x1="620" y1="240" x2="620" y2="210" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-blue)"/>
                <text x="630" y="204" font-size="12" fill="#1565c0">N_AB</text>
                <!-- N_台 向上 -->
                <line x1="620" y1="290" x2="620" y2="255" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-blue)"/>
                <text x="630" y="248" font-size="12" fill="#1565c0">N_台</text>
                <!-- T右=3G 向右 -->
                <line x1="670" y1="265" x2="720" y2="265" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-blue)"/>
                <text x="725" y="261" font-size="12" fill="#1565c0">T右=3G</text>
                <!-- f_AB=2G 向左 -->
                <line x1="570" y1="255" x2="520" y2="255" stroke="#c62828" stroke-width="3" marker-end="url(#scene1-arrow-red)"/>
                <text x="500" y="251" font-size="12" fill="#c62828">f_AB=2G</text>
                <!-- f_台=G 向左 -->
                <line x1="620" y1="290" x2="575" y2="290" stroke="#c62828" stroke-width="3" marker-end="url(#scene1-arrow-red)"/>
                <text x="555" y="286" font-size="12" fill="#c62828">f_台=G</text>
            </g>

            <!-- 步骤3：整体法·初始 -->
            <g id="scene1-force-step3" class="scene1-force-group">
                <!-- 整体轮廓 A+B -->
                <rect x="580" y="200" width="80" height="40" stroke="#000" stroke-width="2" fill="none"/>
                <rect x="570" y="240" width="100" height="50" stroke="#000" stroke-width="2" fill="none"/>
                <!-- 总重力向下 -->
                <line x1="620" y1="290" x2="620" y2="335" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene1-arrow-green)"/>
                <text x="630" y="345" font-size="12" fill="#2e7d32">G_A+G_B</text>
                <!-- N_台 向上 -->
                <line x1="620" y1="290" x2="620" y2="255" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-blue)"/>
                <text x="630" y="248" font-size="12" fill="#1565c0">N_台</text>
                <!-- 向左2G -->
                <line x1="580" y1="220" x2="525" y2="220" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-blue)"/>
                <text x="505" y="216" font-size="12" fill="#1565c0">2G</text>
                <!-- 向右3G -->
                <line x1="670" y1="265" x2="720" y2="265" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-blue)"/>
                <text x="725" y="261" font-size="12" fill="#1565c0">3G</text>
                <!-- f_台=G 向左 -->
                <line x1="620" y1="290" x2="575" y2="290" stroke="#c62828" stroke-width="3" marker-end="url(#scene1-arrow-red)"/>
                <text x="555" y="286" font-size="12" fill="#c62828">f_台=G</text>
            </g>

            <!-- 步骤4：变化装置提示 -->
            <g id="scene1-force-step4" class="scene1-force-group">
                <text x="610" y="230" text-anchor="middle" font-size="14" fill="#333">变化后</text>
                <text x="610" y="255" text-anchor="middle" font-size="13" fill="#555">5号移至A上</text>
                <text x="610" y="280" text-anchor="middle" font-size="13" fill="#555">左侧拉力减为1个钩码</text>
            </g>

            <!-- 步骤5：隔离A+5·变化后 -->
            <g id="scene1-force-step5" class="scene1-force-group">
                <!-- A轮廓 -->
                <rect x="580" y="210" width="80" height="40" stroke="#000" stroke-width="2" fill="none"/>
                <!-- 5号轮廓 -->
                <rect x="605" y="190" width="30" height="20" rx="3" stroke="#000" stroke-width="1.5" fill="#e0e0e0"/>
                <!-- 总重力向下 -->
                <line x1="620" y1="250" x2="620" y2="290" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene1-arrow-green)"/>
                <text x="630" y="300" font-size="12" fill="#2e7d32">G_A+G_5</text>
                <!-- N_BA' 向上 -->
                <line x1="620" y1="250" x2="620" y2="215" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-blue)"/>
                <text x="630" y="208" font-size="12" fill="#1565c0">N_BA'</text>
                <!-- T左'=G 向左 -->
                <line x1="580" y1="230" x2="540" y2="230" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-blue)"/>
                <text x="515" y="226" font-size="12" fill="#1565c0">T左'=G</text>
                <!-- f_BA'=G 向右 -->
                <line x1="660" y1="230" x2="700" y2="230" stroke="#c62828" stroke-width="3" marker-end="url(#scene1-arrow-red)"/>
                <text x="705" y="226" font-size="12" fill="#c62828">f_BA'=G</text>
            </g>

            <!-- 步骤6：隔离B·变化后 -->
            <g id="scene1-force-step6" class="scene1-force-group">
                <!-- B轮廓 -->
                <rect x="570" y="250" width="100" height="50" stroke="#000" stroke-width="2" fill="none"/>
                <!-- G_B 向下 -->
                <line x1="620" y1="300" x2="620" y2="335" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene1-arrow-green)"/>
                <text x="630" y="345" font-size="12" fill="#2e7d32">G_B</text>
                <!-- N_AB' 向下 -->
                <line x1="620" y1="250" x2="620" y2="220" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-blue)"/>
                <text x="630" y="214" font-size="12" fill="#1565c0">N_AB'</text>
                <!-- N_台' 向上 -->
                <line x1="620" y1="300" x2="620" y2="265" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-blue)"/>
                <text x="630" y="258" font-size="12" fill="#1565c0">N_台'</text>
                <!-- T右=3G 向右 -->
                <line x1="670" y1="275" x2="720" y2="275" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-blue)"/>
                <text x="725" y="271" font-size="12" fill="#1565c0">T右=3G</text>
                <!-- f_AB'=G 向左 -->
                <line x1="570" y1="265" x2="530" y2="265" stroke="#c62828" stroke-width="3" marker-end="url(#scene1-arrow-red)"/>
                <text x="510" y="261" font-size="12" fill="#c62828">f_AB'=G</text>
                <!-- f_台'=2G 向左 -->
                <line x1="620" y1="300" x2="565" y2="300" stroke="#c62828" stroke-width="3" marker-end="url(#scene1-arrow-red)"/>
                <text x="540" y="296" font-size="12" fill="#c62828">f_台'=2G</text>
            </g>

            <!-- 步骤7：整体法·变化后 -->
            <g id="scene1-force-step7" class="scene1-force-group">
                <!-- 整体轮廓 A+5+B -->
                <rect x="580" y="210" width="80" height="40" stroke="#000" stroke-width="2" fill="none"/>
                <rect x="605" y="190" width="30" height="20" rx="3" stroke="#000" stroke-width="1.5" fill="#e0e0e0"/>
                <rect x="570" y="250" width="100" height="50" stroke="#000" stroke-width="2" fill="none"/>
                <!-- 总重力向下 -->
                <line x1="620" y1="300" x2="620" y2="345" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene1-arrow-green)"/>
                <text x="630" y="355" font-size="12" fill="#2e7d32">G_总'</text>
                <!-- N_台' 向上 -->
                <line x1="620" y1="300" x2="620" y2="265" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-blue)"/>
                <text x="630" y="258" font-size="12" fill="#1565c0">N_台'</text>
                <!-- 向左G -->
                <line x1="580" y1="230" x2="540" y2="230" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-blue)"/>
                <text x="520" y="226" font-size="12" fill="#1565c0">G</text>
                <!-- 向右3G -->
                <line x1="670" y1="275" x2="720" y2="275" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-blue)"/>
                <text x="725" y="271" font-size="12" fill="#1565c0">3G</text>
                <!-- f_台'=2G 向左 -->
                <line x1="620" y1="300" x2="565" y2="300" stroke="#c62828" stroke-width="3" marker-end="url(#scene1-arrow-red)"/>
                <text x="540" y="296" font-size="12" fill="#c62828">f_台'=2G</text>
            </g>

            <!-- 步骤8：对比总结 — 重新设计表格布局避免重叠 -->
            <g id="scene1-force-step8" class="scene1-force-group">
                <!-- 表格外框 -->
                <rect x="480" y="155" width="260" height="140" stroke="#000" stroke-width="1.5" fill="none"/>
                <!-- 表头行背景 -->
                <rect x="480" y="155" width="260" height="38" stroke="#000" stroke-width="1" fill="#f5f5f5"/>
                <!-- 行分隔 -->
                <line x1="480" y1="193" x2="740" y2="193" stroke="#000" stroke-width="1"/>
                <line x1="480" y1="233" x2="740" y2="233" stroke="#000" stroke-width="1"/>
                <!-- 列分隔 -->
                <line x1="600" y1="155" x2="600" y2="295" stroke="#000" stroke-width="1"/>
                <line x1="670" y1="155" x2="670" y2="295" stroke="#000" stroke-width="1"/>
                <!-- 表头文字 — 简化避免重叠 -->
                <text x="540" y="178" text-anchor="middle" font-size="13" fill="#000">接触面</text>
                <text x="635" y="172" text-anchor="middle" font-size="12" fill="#000">初始摩擦力</text>
                <text x="635" y="186" text-anchor="middle" font-size="12" fill="#000">大小</text>
                <text x="705" y="172" text-anchor="middle" font-size="12" fill="#000">变化后摩擦力</text>
                <text x="705" y="186" text-anchor="middle" font-size="12" fill="#000">大小</text>
                <!-- 行1 -->
                <text x="540" y="220" text-anchor="middle" font-size="13" fill="#000">A、B之间</text>
                <text x="635" y="220" text-anchor="middle" font-size="14" fill="#c62828" font-weight="bold">2G</text>
                <text x="705" y="220" text-anchor="middle" font-size="14" fill="#c62828" font-weight="bold">G</text>
                <!-- 行2 -->
                <text x="540" y="260" text-anchor="middle" font-size="13" fill="#000">实验台与B之间</text>
                <text x="635" y="260" text-anchor="middle" font-size="14" fill="#c62828" font-weight="bold">G</text>
                <text x="705" y="260" text-anchor="middle" font-size="14" fill="#c62828" font-weight="bold">2G</text>
                <!-- 结论文字 — 下移避免与表格重叠 -->
                <text x="610" y="320" text-anchor="middle" font-size="13" fill="#c62828" font-weight="bold">实验台与B之间：G → 2G，增大</text>
                <text x="610" y="340" text-anchor="middle" font-size="13" fill="#c62828" font-weight="bold">A、B之间：2G → G，减小</text>
            </g>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn" disabled>◀ 上一步</button>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        var currentStep = 0;
        var totalSteps = 9;
        var titles = [
            "步骤 1/9：初始装置",
            "步骤 2/9：隔离体A受力分析（初始）",
            "步骤 3/9：隔离体B受力分析（初始）",
            "步骤 4/9：整体法受力分析（初始）",
            "步骤 5/9：变化后装置",
            "步骤 6/9：隔离体A+5受力分析（变化后）",
            "步骤 7/9：隔离体B受力分析（变化后）",
            "步骤 8/9：整体法受力分析（变化后）",
            "步骤 9/9：对比总结"
        ];

        var elTitle = document.getElementById('scene1-step-title');
        var btnPrev = document.getElementById('scene1-btn-prev');
        var btnNext = document.getElementById('scene1-btn-next');

        // 左侧装置元素
        var blockA = document.getElementById('scene1-block-a');
        var blockB = document.getElementById('scene1-block-b');
        var tableTop = document.getElementById('scene1-table-top');
        var tableLeg = document.getElementById('scene1-table-leg');
        var tableShadow = document.getElementById('scene1-table-shadow');
        var pulleyLeft = document.getElementById('scene1-pulley-left');
        var pulleyRight = document.getElementById('scene1-pulley-right');
        var leftWeightsInit = document.getElementById('scene1-left-weights-init');
        var leftWeightsChanged = document.getElementById('scene1-left-weights-changed');
        var rightWeights = document.getElementById('scene1-right-weights');
        var weight5OnA = document.getElementById('scene1-weight5-on-a');
        var ropeLeftInit = document.getElementById('scene1-rope-left-init');
        var ropeRight = document.getElementById('scene1-rope-right');
        var labelA = document.getElementById('scene1-label-a');
        var labelB = document.getElementById('scene1-label-b');
        var isolationBox = document.getElementById('scene1-isolation-box');

        function setDisplay(el, show) {
            if (!el) return;
            el.style.display = show ? 'block' : 'none';
        }

        function setOpacity(el, val) {
            if (!el) return;
            el.style.opacity = val;
        }

        function addClass(el, cls) {
            if (!el) return;
            el.classList.add(cls);
        }

        function removeClass(el, cls) {
            if (!el) return;
            el.classList.remove(cls);
        }

        function clearHighlight() {
            [blockA, blockB, tableTop, tableLeg, tableShadow, pulleyLeft, pulleyRight,
             leftWeightsInit, leftWeightsChanged, rightWeights, weight5OnA,
             ropeLeftInit, ropeRight, labelA, labelB].forEach(function(el) {
                if (!el) return;
                removeClass(el, 'scene1-highlight');
                removeClass(el, 'scene1-dim');
                setOpacity(el, '1');
            });
        }

        function showForceGroup(step) {
            for (var i = 0; i < totalSteps; i++) {
                var g = document.getElementById('scene1-force-step' + i);
                if (g) {
                    if (i === step) {
                        g.classList.add('active');
                        g.style.display = 'block';
                    } else {
                        g.classList.remove('active');
                        g.style.display = 'none';
                    }
                }
            }
        }

        function updateStep(step) {
            currentStep = step;
            elTitle.textContent = titles[step];
            btnPrev.disabled = (step === 0);
            btnNext.disabled = (step === totalSteps - 1);

            clearHighlight();
            showForceGroup(step);

            // 控制隔离框显示
            setDisplay(isolationBox, step >= 1 && step <= 7);

            // 步骤0：初始装置，全部正常显示
            if (step === 0) {
                setDisplay(leftWeightsInit, true);
                setDisplay(leftWeightsChanged, false);
                setDisplay(weight5OnA, false);
            }
            // 步骤1：隔离A初始，仅A高亮，其余淡化
            else if (step === 1) {
                setDisplay(leftWeightsInit, true);
                setDisplay(leftWeightsChanged, false);
                setDisplay(weight5OnA, false);
                addClass(blockA, 'scene1-highlight');
                [blockB, tableTop, tableLeg, tableShadow, pulleyLeft, pulleyRight,
                 leftWeightsInit, rightWeights, ropeLeftInit, ropeRight, labelA, labelB].forEach(function(el) {
                    if (el && el !== blockA) addClass(el, 'scene1-dim');
                });
            }
            // 步骤2：隔离B初始，仅B高亮，其余淡化
            else if (step === 2) {
                setDisplay(leftWeightsInit, true);
                setDisplay(leftWeightsChanged, false);
                setDisplay(weight5OnA, false);
                addClass(blockB, 'scene1-highlight');
                [blockA, tableTop, tableLeg, tableShadow, pulleyLeft, pulleyRight,
                 leftWeightsInit, rightWeights, ropeLeftInit, ropeRight, labelA, labelB].forEach(function(el) {
                    if (el && el !== blockB) addClass(el, 'scene1-dim');
                });
            }
            // 步骤3：整体法初始，A+B高亮，台面淡化
            else if (step === 3) {
                setDisplay(leftWeightsInit, true);
                setDisplay(leftWeightsChanged, false);
                setDisplay(weight5OnA, false);
                addClass(blockA, 'scene1-highlight');
                addClass(blockB, 'scene1-highlight');
                [tableTop, tableLeg, tableShadow, pulleyLeft, pulleyRight,
                 leftWeightsInit, rightWeights, ropeLeftInit, ropeRight, labelA, labelB].forEach(function(el) {
                    if (el) addClass(el, 'scene1-dim');
                });
            }
            // 步骤4：变化装置，全部正常，5号在A上
            else if (step === 4) {
                setDisplay(leftWeightsInit, false);
                setDisplay(leftWeightsChanged, true);
                setDisplay(weight5OnA, true);
            }
            // 步骤5：隔离A+5变化后，A和5高亮，其余淡化
            else if (step === 5) {
                setDisplay(leftWeightsInit, false);
                setDisplay(leftWeightsChanged, true);
                setDisplay(weight5OnA, true);
                addClass(blockA, 'scene1-highlight');
                addClass(weight5OnA, 'scene1-highlight');
                [blockB, tableTop, tableLeg, tableShadow, pulleyLeft, pulleyRight,
                 leftWeightsChanged, rightWeights, ropeLeftInit, ropeRight, labelA, labelB].forEach(function(el) {
                    if (el) addClass(el, 'scene1-dim');
                });
            }
            // 步骤6：隔离B变化后，仅B高亮，其余淡化
            else if (step === 6) {
                setDisplay(leftWeightsInit, false);
                setDisplay(leftWeightsChanged, true);
                setDisplay(weight5OnA, true);
                addClass(blockB, 'scene1-highlight');
                [blockA, tableTop, tableLeg, tableShadow, pulleyLeft, pulleyRight,
                 leftWeightsChanged, rightWeights, weight5OnA, ropeLeftInit, ropeRight, labelA, labelB].forEach(function(el) {
                    if (el && el !== blockB) addClass(el, 'scene1-dim');
                });
            }
            // 步骤7：整体法变化后，A+5+B高亮，台面淡化
            else if (step === 7) {
                setDisplay(leftWeightsInit, false);
                setDisplay(leftWeightsChanged, true);
                setDisplay(weight5OnA, true);
                addClass(blockA, 'scene1-highlight');
                addClass(blockB, 'scene1-highlight');
                addClass(weight5OnA, 'scene1-highlight');
                [tableTop, tableLeg, tableShadow, pulleyLeft, pulleyRight,
                 leftWeightsChanged, rightWeights, ropeLeftInit, ropeRight, labelA, labelB].forEach(function(el) {
                    if (el) addClass(el, 'scene1-dim');
                });
            }
            // 步骤8：对比总结，变化后装置正常显示
            else if (step === 8) {
                setDisplay(leftWeightsInit, false);
                setDisplay(leftWeightsChanged, true);
                setDisplay(weight5OnA, true);
            }
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) updateStep(currentStep - 1);
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) updateStep(currentStep + 1);
        });

        // 初始化
        updateStep(0);
    })();
    </script>
</body>
</html>
