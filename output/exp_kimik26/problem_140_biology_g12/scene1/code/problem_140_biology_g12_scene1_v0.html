<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>果蝇M染色体基因分布</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            padding: 6px 16px; font-size: 14px; cursor: pointer;
            border: 1px solid #ccc; border-radius: 4px; background: #f5f5f5;
            transition: opacity 0.2s;
        }
        #scene1-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene1-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene1-step-label { font-size: 13px; color: #333; min-width: 140px; text-align: center; }
        .scene1-hidden { display: none; }
        .scene1-fade { transition: opacity 0.3s ease; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene1-arrow-start" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto">
                    <path d="M10,0 L0,5 L10,10" fill="#000" />
                </marker>
                <marker id="scene1-arrow-end" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
                    <path d="M0,0 L10,5 L0,10" fill="#000" />
                </marker>
            </defs>

            <!-- ===== 高亮层（叠在染色体下方） ===== -->
            <!-- 1、2号蓝色高亮 -->
            <path id="scene1-hl-1" class="scene1-hidden scene1-fade" d="M340,300 C390,300 390,380 340,380" stroke="#1565c0" stroke-width="34" fill="none" stroke-linecap="round" opacity="0.2" />
            <path id="scene1-hl-2" class="scene1-hidden scene1-fade" d="M420,300 L420,360 C420,380 440,380 450,380" stroke="#1565c0" stroke-width="34" fill="none" stroke-linecap="round" opacity="0.2" />
            <!-- 3、4号红色高亮 -->
            <path id="scene1-hl-3" class="scene1-hidden scene1-fade" d="M230,130 C180,130 180,250 230,250" stroke="#c62828" stroke-width="34" fill="none" stroke-linecap="round" opacity="0.2" />
            <path id="scene1-hl-4" class="scene1-hidden scene1-fade" d="M280,150 C330,150 330,270 280,270" stroke="#c62828" stroke-width="34" fill="none" stroke-linecap="round" opacity="0.2" />
            <!-- 5、6号绿色高亮 -->
            <path id="scene1-hl-5" class="scene1-hidden scene1-fade" d="M520,130 C570,130 570,250 520,250" stroke="#2e7d32" stroke-width="34" fill="none" stroke-linecap="round" opacity="0.2" />
            <path id="scene1-hl-6" class="scene1-hidden scene1-fade" d="M580,150 C530,150 530,270 580,270" stroke="#2e7d32" stroke-width="34" fill="none" stroke-linecap="round" opacity="0.2" />

            <!-- ===== 染色体图形 ===== -->
            <!-- 3号染色体（左弯棒状） -->
            <path id="scene1-chr-3" d="M230,130 C180,130 180,250 230,250" stroke="#333333" stroke-width="24" fill="none" stroke-linecap="round" />
            <!-- 4号染色体（右弯棒状） -->
            <path id="scene1-chr-4" d="M280,150 C330,150 330,270 280,270" stroke="#333333" stroke-width="24" fill="none" stroke-linecap="round" />
            <!-- 5号染色体（右弯棒状） -->
            <path id="scene1-chr-5" d="M520,130 C570,130 570,250 520,250" stroke="#333333" stroke-width="24" fill="none" stroke-linecap="round" />
            <!-- 6号染色体（左弯棒状） -->
            <path id="scene1-chr-6" d="M580,150 C530,150 530,270 580,270" stroke="#333333" stroke-width="24" fill="none" stroke-linecap="round" />
            <!-- 1号染色体 X（右弯棒状） -->
            <path id="scene1-chr-1" d="M340,300 C390,300 390,380 340,380" stroke="#333333" stroke-width="24" fill="none" stroke-linecap="round" />
            <!-- 2号染色体 Y（J形弯钩） -->
            <path id="scene1-chr-2" d="M420,300 L420,360 C420,380 440,380 450,380" stroke="#333333" stroke-width="24" fill="none" stroke-linecap="round" />
            <!-- 7号点状染色体 -->
            <circle id="scene1-chr-7" cx="390" cy="190" r="7" fill="#ffffff" stroke="#888888" stroke-width="1.5" />
            <!-- 8号点状染色体 -->
            <circle id="scene1-chr-8" cx="410" cy="190" r="7" fill="#ffffff" stroke="#888888" stroke-width="1.5" />

            <!-- ===== 染色体序号标签（步骤0出现，始终显示） ===== -->
            <text id="scene1-num-3" x="230" y="115" text-anchor="middle" font-size="12" fill="#000">3</text>
            <text id="scene1-num-4" x="280" y="135" text-anchor="middle" font-size="12" fill="#000">4</text>
            <text id="scene1-num-5" x="520" y="115" text-anchor="middle" font-size="12" fill="#000">5</text>
            <text id="scene1-num-6" x="580" y="125" text-anchor="middle" font-size="12" fill="#000">6</text>
            <text id="scene1-num-7" x="380" y="175" text-anchor="middle" font-size="12" fill="#000">7</text>
            <text id="scene1-num-8" x="420" y="175" text-anchor="middle" font-size="12" fill="#000">8</text>
            <text id="scene1-num-1" x="340" y="400" text-anchor="middle" font-size="12" fill="#000">1</text>
            <text id="scene1-num-2" x="420" y="400" text-anchor="middle" font-size="12" fill="#000">2</text>

            <!-- ===== 步骤1元素：性染色体 ===== -->
            <text id="scene1-type-X" class="scene1-hidden scene1-fade" x="340" y="285" text-anchor="middle" font-size="14" fill="#000" font-weight="bold">X</text>
            <text id="scene1-type-Y" class="scene1-hidden scene1-fade" x="420" y="285" text-anchor="middle" font-size="14" fill="#000" font-weight="bold">Y</text>
            <text id="scene1-gene-E" class="scene1-hidden scene1-fade" x="395" y="365" text-anchor="middle" font-size="14" fill="#000" font-weight="bold">E</text>
            <!-- 配对箭头 -->
            <line id="scene1-pair-arrow" class="scene1-hidden scene1-fade" x1="390" y1="340" x2="410" y2="340" stroke="#000" stroke-width="2" marker-start="url(#scene1-arrow-start)" marker-end="url(#scene1-arrow-end)" />
            <text id="scene1-tip-pair" class="scene1-hidden scene1-fade" x="400" y="325" text-anchor="middle" font-size="13" fill="#000">可配对</text>

            <!-- ===== 步骤2元素：连锁基因 ===== -->
            <text id="scene1-gene-V" class="scene1-hidden scene1-fade" x="165" y="160" text-anchor="middle" font-size="14" fill="#000" font-weight="bold">V</text>
            <text id="scene1-gene-B" class="scene1-hidden scene1-fade" x="165" y="220" text-anchor="middle" font-size="14" fill="#000" font-weight="bold">B</text>
            <text id="scene1-gene-v" class="scene1-hidden scene1-fade" x="345" y="170" text-anchor="middle" font-size="14" fill="#000" font-weight="bold">v</text>
            <text id="scene1-gene-b" class="scene1-hidden scene1-fade" x="345" y="230" text-anchor="middle" font-size="14" fill="#000" font-weight="bold">b</text>
            <!-- 连锁虚线 -->
            <line id="scene1-linkage-3" class="scene1-hidden scene1-fade" x1="150" y1="160" x2="150" y2="220" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" />
            <line id="scene1-linkage-4" class="scene1-hidden scene1-fade" x1="355" y1="170" x2="355" y2="230" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" />

            <!-- ===== 步骤3元素：独立遗传 ===== -->
            <text id="scene1-gene-R" class="scene1-hidden scene1-fade" x="610" y="160" text-anchor="middle" font-size="14" fill="#000" font-weight="bold">R</text>
            <text id="scene1-gene-r" class="scene1-hidden scene1-fade" x="500" y="170" text-anchor="middle" font-size="14" fill="#000" font-weight="bold">r</text>
            <text id="scene1-tip-independent" class="scene1-hidden scene1-fade" x="550" y="290" text-anchor="middle" font-size="13" fill="#000">独立遗传</text>

            <!-- ===== 步骤4元素：完整基因型 ===== -->
            <text id="scene1-genotype" class="scene1-hidden scene1-fade" x="400" y="440" text-anchor="middle" font-size="16" fill="#000" font-weight="bold">
                BbVvRrX<tspan baseline-shift="super" font-size="11">E</tspan> Y
            </text>
            <text id="scene1-genotype-note" class="scene1-hidden scene1-fade" x="400" y="475" text-anchor="middle" font-size="13" fill="#000">
                （V与B连锁，v与b连锁）
            </text>
        </svg>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <span id="scene1-step-label">步骤0：整体概览</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        var currentStep = 0;
        var totalSteps = 4;

        var btnPrev = document.getElementById('scene1-btn-prev');
        var btnNext = document.getElementById('scene1-btn-next');
        var stepLabel = document.getElementById('scene1-step-label');

        var stepNames = [
            '步骤0：整体概览',
            '步骤1：性染色体',
            '步骤2：连锁基因',
            '步骤3：独立遗传',
            '步骤4：完整基因型'
        ];

        // 步骤1-3的元素（用于步骤4时清除高亮但保留标签）
        var step1Els = ['scene1-type-X', 'scene1-type-Y', 'scene1-gene-E', 'scene1-pair-arrow', 'scene1-tip-pair'];
        var step2Els = ['scene1-gene-V', 'scene1-gene-B', 'scene1-gene-v', 'scene1-gene-b', 'scene1-linkage-3', 'scene1-linkage-4'];
        var step3Els = ['scene1-gene-R', 'scene1-gene-r', 'scene1-tip-independent'];

        function show(elId) {
            var el = document.getElementById(elId);
            if (el) {
                el.classList.remove('scene1-hidden');
                el.style.opacity = '1';
            }
        }

        function hide(elId) {
            var el = document.getElementById(elId);
            if (el) {
                el.classList.add('scene1-hidden');
                el.style.opacity = '0';
            }
        }

        function renderStep() {
            // 更新按钮状态
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps;
            stepLabel.textContent = stepNames[currentStep];

            // 隐藏所有动态元素
            var allDynamic = step1Els.concat(step2Els).concat(step3Els).concat([
                'scene1-genotype', 'scene1-genotype-note',
                'scene1-hl-1', 'scene1-hl-2', 'scene1-hl-3', 'scene1-hl-4', 'scene1-hl-5', 'scene1-hl-6'
            ]);
            allDynamic.forEach(hide);

            // 根据当前步骤显示元素
            if (currentStep >= 1) {
                step1Els.forEach(show);
            }
            if (currentStep >= 2) {
                step2Els.forEach(show);
            }
            if (currentStep >= 3) {
                step3Els.forEach(show);
            }
            if (currentStep >= 4) {
                show('scene1-genotype');
                show('scene1-genotype-note');
            }

            // 高亮控制：只有当前聚焦的步骤显示高亮
            if (currentStep === 1) {
                show('scene1-hl-1');
                show('scene1-hl-2');
            }
            if (currentStep === 2) {
                show('scene1-hl-3');
                show('scene1-hl-4');
            }
            if (currentStep === 3) {
                show('scene1-hl-5');
                show('scene1-hl-6');
            }
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                renderStep();
            }
        });

        // 初始渲染
        renderStep();
    })();
    </script>
</body>
</html>
