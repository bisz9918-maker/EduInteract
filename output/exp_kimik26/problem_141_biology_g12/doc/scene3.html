<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 3 - 实验②杂交分析与综合筛选</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene3-controls button { padding: 6px 16px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; font-family: "Microsoft YaHei", sans-serif; }
        #scene3-btn-prev { background: #f5f5f5; color: #333; }
        #scene3-btn-next { background: #1565c0; color: #fff; border-color: #1565c0; }
        #scene3-step-indicator { font-size: 14px; color: #333; min-width: 60px; text-align: center; }
        .scene3-step-group { display: none; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <marker id="scene3-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#888888"/>
                </marker>
                <marker id="scene3-arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0"/>
                </marker>
            </defs>

            <!-- ==================== 步骤0：实验②设计说明 ==================== -->
            <g id="scene3-step-0" class="scene3-step-group">
                <text x="400" y="42" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">实验②：抗性植株作父本 × 无抗性植株作母本</text>
                <text x="400" y="75" text-anchor="middle" font-size="13" fill="#666">父本提供精子，母本提供卵细胞，精子内的线粒体不会进入卵细胞</text>

                <!-- 父本框（四条线边框） -->
                <line x1="120" y1="95" x2="280" y2="95" stroke="#1565c0" stroke-width="1.5"/>
                <line x1="280" y1="95" x2="280" y2="185" stroke="#1565c0" stroke-width="1.5"/>
                <line x1="280" y1="185" x2="120" y2="185" stroke="#1565c0" stroke-width="1.5"/>
                <line x1="120" y1="185" x2="120" y2="95" stroke="#1565c0" stroke-width="1.5"/>
                <text x="200" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565c0">抗性植株（父本）</text>
                <text x="200" y="150" text-anchor="middle" font-size="12" fill="#c62828">含核S或线粒体S⁺</text>
                <text x="200" y="180" text-anchor="middle" font-size="12" fill="#666">精子仅传递核基因</text>

                <!-- 乘号 -->
                <text x="330" y="145" text-anchor="middle" font-size="20" fill="#333">×</text>

                <!-- 母本框（四条线边框） -->
                <line x1="380" y1="95" x2="540" y2="95" stroke="#888888" stroke-width="1.5"/>
                <line x1="540" y1="95" x2="540" y2="185" stroke="#888888" stroke-width="1.5"/>
                <line x1="540" y1="185" x2="380" y2="185" stroke="#888888" stroke-width="1.5"/>
                <line x1="380" y1="185" x2="380" y2="95" stroke="#888888" stroke-width="1.5"/>
                <text x="460" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#666">无抗性植株（母本）</text>
                <text x="460" y="150" text-anchor="middle" font-size="12" fill="#333">核ss，无线粒体S</text>
                <text x="460" y="180" text-anchor="middle" font-size="12" fill="#666">卵细胞含核+细胞质</text>

                <!-- 箭头 -->
                <path d="M 560 140 L 590 140" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#scene3-arrowhead)"/>

                <!-- 后代框（四条线边框） -->
                <line x1="610" y1="95" x2="770" y2="95" stroke="#2e7d32" stroke-width="1.5"/>
                <line x1="770" y1="95" x2="770" y2="185" stroke="#2e7d32" stroke-width="1.5"/>
                <line x1="770" y1="185" x2="610" y2="185" stroke="#2e7d32" stroke-width="1.5"/>
                <line x1="610" y1="185" x2="610" y2="95" stroke="#2e7d32" stroke-width="1.5"/>
                <text x="690" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e7d32">杂交系一代</text>
                <text x="690" y="150" text-anchor="middle" font-size="12" fill="#333">检测抗性表现</text>
                <text x="690" y="180" text-anchor="middle" font-size="12" fill="#666">判断父本类型</text>

                <!-- 关键条件框（四条线边框，红色） -->
                <line x1="150" y1="215" x2="650" y2="215" stroke="#c62828" stroke-width="2"/>
                <line x1="650" y1="215" x2="650" y2="280" stroke="#c62828" stroke-width="2"/>
                <line x1="650" y1="280" x2="150" y2="280" stroke="#c62828" stroke-width="2"/>
                <line x1="150" y1="280" x2="150" y2="215" stroke="#c62828" stroke-width="2"/>
                <text x="400" y="238" text-anchor="middle" font-size="15" font-weight="bold" fill="#c62828">关键：精子内的线粒体不会进入卵细胞</text>
                <text x="400" y="276" text-anchor="middle" font-size="13" fill="#c62828">因此，父本的线粒体S⁺无法通过精子传递给后代</text>

                <!-- 精子示意图 -->
                <ellipse cx="300" cy="330" rx="25" ry="18" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
                <line x1="300" y1="318" x2="300" y2="342" stroke="#333" stroke-width="1.5"/>
                <text x="300" y="362" text-anchor="middle" font-size="13" fill="#333">精子：仅含核基因</text>
                <text x="300" y="405" text-anchor="middle" font-size="13" fill="#c62828">无线粒体（无红色圆）</text>

                <!-- 卵细胞示意图 -->
                <ellipse cx="500" cy="330" rx="30" ry="22" fill="#fce4ec" stroke="#c62828" stroke-width="1.5"/>
                <line x1="500" y1="316" x2="500" y2="344" stroke="#333" stroke-width="1.5"/>
                <circle cx="515" cy="335" r="5" fill="#fff" stroke="#888" stroke-width="1.2"/>
                <text x="500" y="370" text-anchor="middle" font-size="13" fill="#333">卵细胞：含核基因+线粒体</text>
            </g>

            <!-- ==================== 步骤1：d父本杂交 ==================== -->
            <g id="scene3-step-1" class="scene3-step-group">
                <text x="400" y="42" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">步骤1：父本d（ss，线粒体S⁺）的杂交</text>
                <text x="400" y="75" text-anchor="middle" font-size="13" fill="#666">父本d：核基因ss，线粒体含S（红色实心圆）</text>

                <!-- 父本框 -->
                <line x1="50" y1="95" x2="200" y2="95" stroke="#1565c0" stroke-width="1.5"/>
                <line x1="200" y1="95" x2="200" y2="240" stroke="#1565c0" stroke-width="1.5"/>
                <line x1="200" y1="240" x2="50" y2="240" stroke="#1565c0" stroke-width="1.5"/>
                <line x1="50" y1="240" x2="50" y2="95" stroke="#1565c0" stroke-width="1.5"/>
                <text x="125" y="87" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565c0">父本 d</text>
                <line x1="95" y1="115" x2="95" y2="160" stroke="#000" stroke-width="2.5"/>
                <line x1="135" y1="115" x2="135" y2="160" stroke="#000" stroke-width="2.5"/>
                <circle cx="155" cy="185" r="10" fill="#c62828" stroke="#c62828" stroke-width="1.5"/>
                <text x="125" y="215" text-anchor="middle" font-size="13" fill="#333">ss</text>
                <text x="125" y="245" text-anchor="middle" font-size="12" fill="#c62828">线粒体S⁺</text>

                <!-- 母本框 -->
                <line x1="600" y1="95" x2="750" y2="95" stroke="#888888" stroke-width="1.5"/>
                <line x1="750" y1="95" x2="750" y2="240" stroke="#888888" stroke-width="1.5"/>
                <line x1="750" y1="240" x2="600" y2="240" stroke="#888888" stroke-width="1.5"/>
                <line x1="600" y1="240" x2="600" y2="95" stroke="#888888" stroke-width="1.5"/>
                <text x="675" y="87" text-anchor="middle" font-size="14" font-weight="bold" fill="#666">母本（无抗性）</text>
                <line x1="645" y1="115" x2="645" y2="160" stroke="#000" stroke-width="2.5"/>
                <line x1="685" y1="115" x2="685" y2="160" stroke="#000" stroke-width="2.5"/>
                <circle cx="705" cy="185" r="10" fill="#fff" stroke="#888" stroke-width="1.5"/>
                <text x="675" y="215" text-anchor="middle" font-size="13" fill="#333">ss</text>
                <text x="675" y="245" text-anchor="middle" font-size="12" fill="#888">无线粒体S</text>

                <!-- 精子区（虚线边框） -->
                <line x1="230" y1="135" x2="330" y2="135" stroke="#888" stroke-width="1" stroke-dasharray="5,3"/>
                <line x1="330" y1="135" x2="330" y2="225" stroke="#888" stroke-width="1" stroke-dasharray="5,3"/>
                <line x1="330" y1="225" x2="230" y2="225" stroke="#888" stroke-width="1" stroke-dasharray="5,3"/>
                <line x1="230" y1="225" x2="230" y2="135" stroke="#888" stroke-width="1" stroke-dasharray="5,3"/>
                <text x="280" y="127" text-anchor="middle" font-size="13" fill="#333">精子</text>
                <ellipse cx="265" cy="180" rx="16" ry="22" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.2"/>
                <line x1="265" y1="167" x2="265" y2="193" stroke="#000" stroke-width="1.5"/>
                <text x="265" y="220" text-anchor="middle" font-size="12" fill="#333">仅核s</text>

                <!-- 卵细胞区（虚线边框） -->
                <line x1="470" y1="135" x2="570" y2="135" stroke="#888" stroke-width="1" stroke-dasharray="5,3"/>
                <line x1="570" y1="135" x2="570" y2="225" stroke="#888" stroke-width="1" stroke-dasharray="5,3"/>
                <line x1="570" y1="225" x2="470" y2="225" stroke="#888" stroke-width="1" stroke-dasharray="5,3"/>
                <line x1="470" y1="225" x2="470" y2="135" stroke="#888" stroke-width="1" stroke-dasharray="5,3"/>
                <text x="520" y="127" text-anchor="middle" font-size="13" fill="#333">卵细胞</text>
                <ellipse cx="520" cy="180" rx="20" ry="26" fill="#fce4ec" stroke="#c62828" stroke-width="1.2"/>
                <line x1="520" y1="164" x2="520" y2="196" stroke="#000" stroke-width="1.5"/>
                <circle cx="535" cy="185" r="5" fill="#fff" stroke="#888" stroke-width="1"/>
                <text x="520" y="220" text-anchor="middle" font-size="12" fill="#333">核s + 线粒体</text>

                <!-- 传递线 -->
                <path d="M 200 150 L 230 170" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#scene3-arrowhead)"/>
                <path d="M 600 150 L 570 170" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#scene3-arrowhead)"/>

                <!-- 后代框 -->
                <line x1="280" y1="300" x2="520" y2="300" stroke="#2e7d32" stroke-width="1.5"/>
                <line x1="520" y1="300" x2="520" y2="400" stroke="#2e7d32" stroke-width="1.5"/>
                <line x1="520" y1="400" x2="280" y2="400" stroke="#2e7d32" stroke-width="1.5"/>
                <line x1="280" y1="400" x2="280" y2="300" stroke="#2e7d32" stroke-width="1.5"/>
                <text x="400" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e7d32">杂交系一代</text>
                <line x1="360" y1="320" x2="360" y2="360" stroke="#000" stroke-width="2.5"/>
                <line x1="400" y1="320" x2="400" y2="360" stroke="#000" stroke-width="2.5"/>
                <circle cx="420" cy="375" r="8" fill="#fff" stroke="#888" stroke-width="1.5"/>
                <text x="400" y="395" text-anchor="middle" font-size="14" fill="#c62828">全部ss，全部无抗性</text>

                <!-- 结合线 -->
                <path d="M 265 225 L 340 300" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" fill="none"/>
                <path d="M 520 225 L 450 300" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" fill="none"/>

                <!-- 结论 -->
                <text x="400" y="435" text-anchor="middle" font-size="15" font-weight="bold" fill="#c62828">父本d → 杂交系一代全部无抗性</text>
            </g>

            <!-- ==================== 步骤2：e父本杂交 ==================== -->
            <g id="scene3-step-2" class="scene3-step-group">
                <text x="400" y="42" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">步骤2：父本e（Ss，线粒体S⁺）的杂交</text>
                <text x="400" y="75" text-anchor="middle" font-size="13" fill="#666">父本e：核基因Ss，线粒体含S（红色实心圆）</text>

                <!-- 父本框 -->
                <line x1="50" y1="95" x2="200" y2="95" stroke="#1565c0" stroke-width="1.5"/>
                <line x1="200" y1="95" x2="200" y2="240" stroke="#1565c0" stroke-width="1.5"/>
                <line x1="200" y1="240" x2="50" y2="240" stroke="#1565c0" stroke-width="1.5"/>
                <line x1="50" y1="240" x2="50" y2="95" stroke="#1565c0" stroke-width="1.5"/>
                <text x="125" y="87" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565c0">父本 e</text>
                <line x1="95" y1="115" x2="95" y2="160" stroke="#1565c0" stroke-width="2.5"/>
                <path d="M 95 107 L 95 115" stroke="#1565c0" stroke-width="2" marker-end="url(#scene3-arrowhead-blue)"/>
                <line x1="135" y1="115" x2="135" y2="160" stroke="#000" stroke-width="2.5"/>
                <circle cx="155" cy="185" r="10" fill="#c62828" stroke="#c62828" stroke-width="1.5"/>
                <text x="125" y="215" text-anchor="middle" font-size="13" fill="#333">Ss</text>
                <text x="125" y="245" text-anchor="middle" font-size="12" fill="#c62828">线粒体S⁺</text>

                <!-- 母本框 -->
                <line x1="600" y1="95" x2="750" y2="95" stroke="#888888" stroke-width="1.5"/>
                <line x1="750" y1="95" x2="750" y2="240" stroke="#888888" stroke-width="1.5"/>
                <line x1="750" y1="240" x2="600" y2="240" stroke="#888888" stroke-width="1.5"/>
                <line x1="600" y1="240" x2="600" y2="95" stroke="#888888" stroke-width="1.5"/>
                <text x="675" y="87" text-anchor="middle" font-size="14" font-weight="bold" fill="#666">母本（无抗性）</text>
                <line x1="645" y1="115" x2="645" y2="160" stroke="#000" stroke-width="2.5"/>
                <line x1="685" y1="115" x2="685" y2="160" stroke="#000" stroke-width="2.5"/>
                <circle cx="705" cy="185" r="10" fill="#fff" stroke="#888" stroke-width="1.5"/>
                <text x="675" y="215" text-anchor="middle" font-size="13" fill="#333">ss</text>
                <text x="675" y="245" text-anchor="middle" font-size="12" fill="#888">无线粒体S</text>

                <!-- 精子区（虚线边框） -->
                <line x1="210" y1="135" x2="350" y2="135" stroke="#888" stroke-width="1" stroke-dasharray="5,3"/>
                <line x1="350" y1="135" x2="350" y2="225" stroke="#888" stroke-width="1" stroke-dasharray="5,3"/>
                <line x1="350" y1="225" x2="210" y2="225" stroke="#888" stroke-width="1" stroke-dasharray="5,3"/>
                <line x1="210" y1="225" x2="210" y2="135" stroke="#888" stroke-width="1" stroke-dasharray="5,3"/>
                <text x="280" y="127" text-anchor="middle" font-size="13" fill="#333">精子（2种）</text>
                <!-- 精子1 -->
                <ellipse cx="250" cy="180" rx="14" ry="20" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.2"/>
                <line x1="250" y1="168" x2="250" y2="192" stroke="#1565c0" stroke-width="1.5"/>
                <path d="M 250 161 L 250 168" stroke="#1565c0" stroke-width="1.5" marker-end="url(#scene3-arrowhead-blue)"/>
                <text x="250" y="220" text-anchor="middle" font-size="12" fill="#1565c0">1/2 S</text>
                <!-- 精子2 -->
                <ellipse cx="310" cy="180" rx="14" ry="20" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.2"/>
                <line x1="310" y1="168" x2="310" y2="192" stroke="#000" stroke-width="1.5"/>
                <text x="310" y="220" text-anchor="middle" font-size="12" fill="#333">1/2 s</text>

                <!-- 卵细胞区（虚线边框） -->
                <line x1="470" y1="135" x2="570" y2="135" stroke="#888" stroke-width="1" stroke-dasharray="5,3"/>
                <line x1="570" y1="135" x2="570" y2="225" stroke="#888" stroke-width="1" stroke-dasharray="5,3"/>
                <line x1="570" y1="225" x2="470" y2="225" stroke="#888" stroke-width="1" stroke-dasharray="5,3"/>
                <line x1="470" y1="225" x2="470" y2="135" stroke="#888" stroke-width="1" stroke-dasharray="5,3"/>
                <text x="520" y="127" text-anchor="middle" font-size="13" fill="#333">卵细胞</text>
                <ellipse cx="520" cy="180" rx="20" ry="26" fill="#fce4ec" stroke="#c62828" stroke-width="1.2"/>
                <line x1="520" y1="164" x2="520" y2="196" stroke="#000" stroke-width="1.5"/>
                <circle cx="535" cy="185" r="5" fill="#fff" stroke="#888" stroke-width="1"/>
                <text x="520" y="220" text-anchor="middle" font-size="12" fill="#333">核s + 线粒体</text>

                <!-- 传递线 -->
                <path d="M 200 150 L 230 170" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#scene3-arrowhead)"/>
                <path d="M 600 150 L 570 170" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#scene3-arrowhead)"/>

                <!-- 后代框 -->
                <line x1="240" y1="300" x2="560" y2="300" stroke="#2e7d32" stroke-width="1.5"/>
                <line x1="560" y1="300" x2="560" y2="400" stroke="#2e7d32" stroke-width="1.5"/>
                <line x1="560" y1="400" x2="240" y2="400" stroke="#2e7d32" stroke-width="1.5"/>
                <line x1="240" y1="400" x2="240" y2="300" stroke="#2e7d32" stroke-width="1.5"/>
                <text x="400" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e7d32">杂交系一代</text>
                <!-- 左区 Ss -->
                <line x1="330" y1="320" x2="330" y2="350" stroke="#1565c0" stroke-width="2.5"/>
                <path d="M 330 313 L 330 320" stroke="#1565c0" stroke-width="2" marker-end="url(#scene3-arrowhead-blue)"/>
                <line x1="350" y1="320" x2="350" y2="350" stroke="#000" stroke-width="2.5"/>
                <text x="340" y="362" text-anchor="middle" font-size="13" fill="#2e7d32">Ss（抗）</text>
                <!-- 右区 ss -->
                <line x1="430" y1="320" x2="430" y2="350" stroke="#000" stroke-width="2.5"/>
                <line x1="450" y1="320" x2="450" y2="350" stroke="#000" stroke-width="2.5"/>
                <text x="440" y="362" text-anchor="middle" font-size="13" fill="#333">ss（不抗）</text>
                <!-- 比例 -->
                <text x="400" y="405" text-anchor="middle" font-size="15" font-weight="bold" fill="#1565c0">1 抗 : 1 不抗</text>

                <!-- 结合线 -->
                <path d="M 250 225 L 320 300" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" fill="none"/>
                <path d="M 310 225 L 340 300" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" fill="none"/>
                <path d="M 520 225 L 450 300" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" fill="none"/>

                <!-- 结论 -->
                <text x="400" y="445" text-anchor="middle" font-size="15" font-weight="bold" fill="#c62828">父本e → 杂交系一代表现型比例 1:1</text>
            </g>

            <!-- ==================== 步骤3：c父本杂交 ==================== -->
            <g id="scene3-step-3" class="scene3-step-group">
                <text x="400" y="42" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">步骤3：父本c（SS，无线粒体S）的杂交</text>
                <text x="400" y="75" text-anchor="middle" font-size="13" fill="#666">父本c：核基因SS，无线粒体S —— b、f结果相同</text>

                <!-- 父本框 -->
                <line x1="50" y1="95" x2="200" y2="95" stroke="#1565c0" stroke-width="1.5"/>
                <line x1="200" y1="95" x2="200" y2="240" stroke="#1565c0" stroke-width="1.5"/>
                <line x1="200" y1="240" x2="50" y2="240" stroke="#1565c0" stroke-width="1.5"/>
                <line x1="50" y1="240" x2="50" y2="95" stroke="#1565c0" stroke-width="1.5"/>

    <script>
    (function() {
        let currentStep = 0;
        const totalSteps = 6;
        const stepGroups = [];
        for (let i = 0; i < totalSteps; i++) {
            stepGroups.push(document.getElementById('scene3-step-' + i));
        }
        const indicator = document.getElementById('scene3-step-indicator');
        const btnPrev = document.getElementById('scene3-btn-prev');
        const btnNext = document.getElementById('scene3-btn-next');

        function renderStep() {
            for (let i = 0; i < totalSteps; i++) {
                if (stepGroups[i]) {
                    stepGroups[i].style.display = (i === currentStep) ? 'block' : 'none';
                }
            }
            indicator.textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps - 1);
            btnPrev.style.opacity = btnPrev.disabled ? '0.5' : '1';
            btnNext.style.opacity = btnNext.disabled ? '0.5' : '1';
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                renderStep();
            }
        });

        renderStep();
    })();
