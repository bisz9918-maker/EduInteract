<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>转基因幼苗类型识别</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "SimHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        .scene1-btn { padding: 6px 16px; font-size: 14px; border-radius: 4px; cursor: pointer; border: 1px solid #999; background: #f0f0f0; font-family: "Microsoft YaHei", "SimHei", sans-serif; }
        .scene1-btn-primary { background: #1565c0; color: white; border-color: #1565c0; }
        .scene1-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 13px; color: #666; min-width: 60px; text-align: center; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" viewBox="0 0 800 500">
            <!-- 图例区 -->
            <g id="scene1-legend">
                <!-- 图例1: 未整合染色体 -->
                <line x1="86" y1="25" x2="86" y2="45" stroke="#000" stroke-width="3" stroke-linecap="round"/>
                <text x="98" y="38" font-size="12" fill="#333">未整合S的染色体</text>
                
                <!-- 图例2: 已整合染色体 -->
                <line x1="246" y1="25" x2="246" y2="45" stroke="#000" stroke-width="3" stroke-linecap="round"/>
                <path d="M246,15 L242,25 L250,25 Z" fill="#1565c0"/>
                <text x="258" y="38" font-size="12" fill="#333">已整合S的染色体</text>
                
                <!-- 图例3: 未整合线粒体 -->
                <circle cx="406" cy="35" r="7" fill="none" stroke="#000" stroke-width="2"/>
                <text x="418" y="38" font-size="12" fill="#333">未整合S的线粒体</text>
                
                <!-- 图例4: 已整合线粒体 -->
                <circle cx="566" cy="35" r="7" fill="#c62828" stroke="#c62828" stroke-width="2"/>
                <text x="578" y="38" font-size="12" fill="#333">已整合S的线粒体</text>
            </g>
            
            <!-- 细胞a: ss, 无线粒体S -->
            <g id="scene1-cell-a">
                <circle id="scene1-circle-a" cx="175" cy="135" r="45" fill="none" stroke="#000" stroke-width="2"/>
                <line id="scene1-chr-a-left" x1="157" y1="105" x2="157" y2="165" stroke="#000" stroke-width="3" stroke-linecap="round"/>
                <line id="scene1-chr-a-right" x1="193" y1="105" x2="193" y2="165" stroke="#000" stroke-width="3" stroke-linecap="round"/>
                <text id="scene1-label-a" x="175" y="193" font-size="15" fill="#000" text-anchor="middle">a</text>
                <text id="scene1-genotype-a" x="175" y="77" font-size="14" fill="#1565c0" text-anchor="middle" style="display:none;">ss</text>
            </g>
            
            <!-- 细胞b: Ss, 无线粒体S -->
            <g id="scene1-cell-b">
                <circle id="scene1-circle-b" cx="325" cy="135" r="45" fill="none" stroke="#000" stroke-width="2"/>
                <line id="scene1-chr-b-left" x1="307" y1="105" x2="307" y2="165" stroke="#000" stroke-width="3" stroke-linecap="round"/>
                <line id="scene1-chr-b-right" x1="343" y1="105" x2="343" y2="165" stroke="#000" stroke-width="3" stroke-linecap="round"/>
                <path id="scene1-arrow-b-left" d="M307,95 L303,105 L311,105 Z" fill="#1565c0"/>
                <text id="scene1-label-b" x="325" y="193" font-size="15" fill="#000" text-anchor="middle">b</text>
                <text id="scene1-genotype-b" x="325" y="77" font-size="14" fill="#1565c0" text-anchor="middle" style="display:none;">Ss</text>
            </g>
            
            <!-- 细胞c: SS, 无线粒体S -->
            <g id="scene1-cell-c">
                <circle id="scene1-circle-c" cx="475" cy="135" r="45" fill="none" stroke="#000" stroke-width="2"/>
                <line id="scene1-chr-c-left" x1="457" y1="105" x2="457" y2="165" stroke="#000" stroke-width="3" stroke-linecap="round"/>
                <line id="scene1-chr-c-right" x1="493" y1="105" x2="493" y2="165" stroke="#000" stroke-width="3" stroke-linecap="round"/>
                <path id="scene1-arrow-c-left" d="M457,95 L453,105 L461,105 Z" fill="#1565c0"/>
                <path id="scene1-arrow-c-right" d="M493,95 L489,105 L497,105 Z" fill="#1565c0"/>
                <text id="scene1-label-c" x="475" y="193" font-size="15" fill="#000" text-anchor="middle">c</text>
                <text id="scene1-genotype-c" x="475" y="77" font-size="14" fill="#1565c0" text-anchor="middle" style="display:none;">SS</text>
            </g>
            
            <!-- 细胞d: ss, 有线粒体S -->
            <g id="scene1-cell-d">
                <circle id="scene1-circle-d" cx="175" cy="295" r="45" fill="none" stroke="#000" stroke-width="2"/>
                <line id="scene1-chr-d-left" x1="157" y1="265" x2="157" y2="325" stroke="#000" stroke-width="3" stroke-linecap="round"/>
                <line id="scene1-chr-d-right" x1="193" y1="265" x2="193" y2="325" stroke="#000" stroke-width="3" stroke-linecap="round"/>
                <circle id="scene1-mito-d" cx="197" cy="317" r="9" fill="#c62828" stroke="#c62828" stroke-width="2"/>
                <text id="scene1-label-d" x="175" y="353" font-size="15" fill="#000" text-anchor="middle">d</text>
                <text id="scene1-genotype-d" x="175" y="237" font-size="14" fill="#1565c0" text-anchor="middle" style="display:none;">ss</text>
                <text id="scene1-mitolabel-d" x="225" y="322" font-size="13" fill="#c62828" style="display:none;">S+</text>
            </g>
            
            <!-- 细胞e: Ss, 有线粒体S -->
            <g id="scene1-cell-e">
                <circle id="scene1-circle-e" cx="325" cy="295" r="45" fill="none" stroke="#000" stroke-width="2"/>
                <line id="scene1-chr-e-left" x1="307" y1="265" x2="307" y2="325" stroke="#000" stroke-width="3" stroke-linecap="round"/>
                <line id="scene1-chr-e-right" x1="343" y1="265" x2="343" y2="325" stroke="#000" stroke-width="3" stroke-linecap="round"/>
                <path id="scene1-arrow-e-left" d="M307,255 L303,265 L311,265 Z" fill="#1565c0"/>
                <circle id="scene1-mito-e" cx="347" cy="317" r="9" fill="#c62828" stroke="#c62828" stroke-width="2"/>
                <text id="scene1-label-e" x="325" y="353" font-size="15" fill="#000" text-anchor="middle">e</text>
                <text id="scene1-genotype-e" x="325" y="237" font-size="14" fill="#1565c0" text-anchor="middle" style="display:none;">Ss</text>
                <text id="scene1-mitolabel-e" x="375" y="322" font-size="13" fill="#c62828" style="display:none;">S+</text>
            </g>
            
            <!-- 细胞f: SS, 有线粒体S -->
            <g id="scene1-cell-f">
                <circle id="scene1-circle-f" cx="475" cy="295" r="45" fill="none" stroke="#000" stroke-width="2"/>
                <line id="scene1-chr-f-left" x1="457" y1="265" x2="457" y2="325" stroke="#000" stroke-width="3" stroke-linecap="round"/>
                <line id="scene1-chr-f-right" x1="493" y1="265" x2="493" y2="325" stroke="#000" stroke-width="3" stroke-linecap="round"/>
                <path id="scene1-arrow-f-left" d="M457,255 L453,265 L461,265 Z" fill="#1565c0"/>
                <path id="scene1-arrow-f-right" d="M493,255 L489,265 L497,265 Z" fill="#1565c0"/>
                <circle id="scene1-mito-f" cx="497" cy="317" r="9" fill="#c62828" stroke="#c62828" stroke-width="2"/>
                <text id="scene1-label-f" x="475" y="353" font-size="15" fill="#000" text-anchor="middle">f</text>
                <text id="scene1-genotype-f" x="475" y="237" font-size="14" fill="#1565c0" text-anchor="middle" style="display:none;">SS</text>
                <text id="scene1-mitolabel-f" x="525" y="322" font-size="13" fill="#c62828" style="display:none;">S+</text>
            </g>
            
            <!-- 说明文字 -->
            <text id="scene1-desc-text" x="400" y="400" font-size="15" fill="#333" text-anchor="middle">观察六种转基因幼苗类型的染色体与线粒体状态</text>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/4</span>
            <button id="scene1-btn-next" class="scene1-btn scene1-btn-primary">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现：六种转基因幼苗类型识别与长期种植筛选
        
        let currentStep = 0;
        const totalSteps = 4;
        
        const descTexts = [
            "观察六种转基因幼苗类型的染色体与线粒体状态",
            "核基因型分析：蓝色箭头表示2号染色体已整合S基因",
            "线粒体状态分析：红色实心圆表示线粒体已整合S基因（会逐代减弱）",
            "长期种植筛选：核基因纯合SS（c和f）可稳定遗传，符合要求"
        ];
        
        const genotypeIds = ['scene1-genotype-a', 'scene1-genotype-b', 'scene1-genotype-c', 
                            'scene1-genotype-d', 'scene1-genotype-e', 'scene1-genotype-f'];
        const mitoLabelIds = ['scene1-mitolabel-d', 'scene1-mitolabel-e', 'scene1-mitolabel-f'];
        const nuclearHighlightIds = ['scene1-arrow-b-left', 'scene1-arrow-c-left', 'scene1-arrow-c-right',
                                    'scene1-arrow-e-left', 'scene1-arrow-f-left', 'scene1-arrow-f-right'];
        const mitoIds = ['scene1-mito-d', 'scene1-mito-e', 'scene1-mito-f'];
        const selectedCellCircleIds = ['scene1-circle-c', 'scene1-circle-f'];
        
        function setDisplay(id, show) {
            const el = document.getElementById(id);
            if (el) el.style.display = show ? 'block' : 'none';
        }
        
        function setAttr(id, attr, value) {
            const el = document.getElementById(id);
            if (el) el.setAttribute(attr, value);
        }
        
        function removeAttr(id, attr) {
            const el = document.getElementById(id);
            if (el) el.removeAttribute(attr);
        }
        
        function updateUI() {
            // 更新说明文字
            const descEl = document.getElementById('scene1-desc-text');
            if (descEl) descEl.textContent = descTexts[currentStep];
            
            // 更新步骤指示器
            const indicatorEl = document.getElementById('scene1-step-indicator');
            if (indicatorEl) indicatorEl.textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;
            
            // 更新按钮状态
            const prevBtn = document.getElementById('scene1-btn-prev');
            const nextBtn = document.getElementById('scene1-btn-next');
            if (prevBtn) prevBtn.disabled = (currentStep === 0);
            if (nextBtn) nextBtn.disabled = (currentStep === totalSteps - 1);
            
            // 步骤0：初始状态，隐藏所有标注
            // 步骤1：显示核基因型，高亮蓝色箭头
            // 步骤2：显示线粒体状态，高亮线粒体
            // 步骤3：高亮c和f为绿色
            
            // 基因型标签显示/隐藏
            genotypeIds.forEach(function(id) {
                setDisplay(id, currentStep >= 1);
            });
            
            // 线粒体状态标签显示/隐藏
            mitoLabelIds.forEach(function(id) {
                setDisplay(id, currentStep >= 2);
            });
            
            // 核基因高亮（蓝色箭头添加发光效果）
            nuclearHighlightIds.forEach(function(id) {
                if (currentStep >= 1) {
                    setAttr(id, 'filter', 'drop-shadow(0 0 3px #1565c0)');
                } else {
                    removeAttr(id, 'filter');
                }
            });
            
            // 线粒体高亮
            mitoIds.forEach(function(id) {
                if (currentStep >= 2) {
                    setAttr(id, 'stroke-width', '3');
                    setAttr(id, 'filter', 'drop-shadow(0 0 3px #c62828)');
                } else {
                    setAttr(id, 'stroke-width', '2');
                    removeAttr(id, 'filter');
                }
            });
            
            // 筛选高亮（c和f绿色）
            selectedCellCircleIds.forEach(function(id) {
                if (currentStep >= 3) {
                    setAttr(id, 'stroke', '#2e7d32');
                    setAttr(id, 'stroke-width', '4');
                    setAttr(id, 'fill', 'rgba(46, 125, 50, 0.12)');
                } else {
                    setAttr(id, 'stroke', '#000');
                    setAttr(id, 'stroke-width', '2');
                    setAttr(id, 'fill', 'none');
                }
            });
        }
        
        document.getElementById('scene1-btn-prev').addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateUI();
            }
        });
        
        document.getElementById('scene1-btn-next').addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateUI();
            }
        });
        
        // 初始化
        updateUI();
    })();
    </script>
</body>
</html>
