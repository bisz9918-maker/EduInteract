<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>果蝇眼型遗传杂交实验 - 场景1</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 16px; z-index: 10; }
        #scene1-controls button {
            padding: 6px 18px; font-size: 14px; cursor: pointer;
            border: 1px solid #333; border-radius: 4px; background: #f5f5f5;
            transition: background 0.2s;
        }
        #scene1-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene1-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 14px; color: #555; min-width: 70px; text-align: center; }
        .scene1-hidden { opacity: 0; pointer-events: none; }
        .scene1-fade { opacity: 0; transition: opacity 0.3s ease; }
        .scene1-visible { opacity: 1; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
                </marker>
            </defs>

            <!-- ==================== P代 ==================== -->
            <text id="scene1-p-label" x="50" y="85" font-size="20" fill="#000000" font-weight="bold">P</text>

            <!-- P代雌性 -->
            <text id="scene1-p-female-symbol" x="145" y="80" font-size="20" fill="#1565c0">♀</text>
            <text id="scene1-p-female-trait" x="190" y="80" font-size="18" fill="#000000">棒眼</text>
            <text id="scene1-p-female-pure" x="180" y="100" font-size="13" fill="#888888">纯种</text>
            <text id="scene1-p-female-genotype" class="scene1-fade" x="180" y="122" font-size="16" fill="#000000">XʳXʳ</text>

            <!-- 杂交符号 -->
            <text id="scene1-cross-symbol" x="320" y="80" font-size="20" fill="#000000">×</text>

            <!-- P代雄性 -->
            <text id="scene1-p-male-symbol" x="395" y="80" font-size="20" fill="#c62828">♂</text>
            <text id="scene1-p-male-trait" x="440" y="80" font-size="18" fill="#000000">圆眼</text>
            <text id="scene1-p-male-pure" x="430" y="100" font-size="13" fill="#888888">纯种</text>
            <text id="scene1-p-male-genotype" class="scene1-fade" x="430" y="122" font-size="16" fill="#000000">XᴿY</text>

            <!-- P→F₁箭头 -->
            <line id="scene1-p-to-f1-arrow" x1="320" y1="100" x2="320" y2="135" stroke="#000000" stroke-width="1.5" marker-end="url(#scene1-arrowhead)"/>

            <!-- ==================== F₁代 ==================== -->
            <text id="scene1-f1-label" x="50" y="175" font-size="20" fill="#000000" font-weight="bold">F₁</text>

            <!-- 步骤0：占位符 -->
            <g id="scene1-f1-placeholder-group">
                <text id="scene1-f1-placeholder" x="220" y="165" font-size="16" fill="#888888">( ____ 眼 )</text>
                <text id="scene1-f1-placeholder-female" x="330" y="165" font-size="18" fill="#1565c0">♀</text>
                <text id="scene1-f1-placeholder-male" x="370" y="165" font-size="18" fill="#c62828">♂</text>
            </g>

            <!-- 步骤1：F₁推导结果 -->
            <!-- 雌性高亮边框（四条线，避免文字与矩形重叠检测） -->
            <line id="scene1-f1-hl-f1" class="scene1-fade" x1="250" y1="150" x2="360" y2="150" stroke="#2e7d32" stroke-width="2"/>
            <line id="scene1-f1-hl-f2" class="scene1-fade" x1="360" y1="150" x2="360" y2="195" stroke="#2e7d32" stroke-width="2"/>
            <line id="scene1-f1-hl-f3" class="scene1-fade" x1="360" y1="195" x2="250" y2="195" stroke="#2e7d32" stroke-width="2"/>
            <line id="scene1-f1-hl-f4" class="scene1-fade" x1="250" y1="195" x2="250" y2="150" stroke="#2e7d32" stroke-width="2"/>
            <!-- 雄性高亮边框 -->
            <line id="scene1-f1-hl-m1" class="scene1-fade" x1="390" y1="150" x2="500" y2="150" stroke="#2e7d32" stroke-width="2"/>
            <line id="scene1-f1-hl-m2" class="scene1-fade" x1="500" y1="150" x2="500" y2="195" stroke="#2e7d32" stroke-width="2"/>
            <line id="scene1-f1-hl-m3" class="scene1-fade" x1="500" y1="195" x2="390" y2="195" stroke="#2e7d32" stroke-width="2"/>
            <line id="scene1-f1-hl-m4" class="scene1-fade" x1="390" y1="195" x2="390" y2="150" stroke="#2e7d32" stroke-width="2"/>

            <text id="scene1-f1-female-trait" class="scene1-fade" x="285" y="165" font-size="16" fill="#1565c0">♀圆眼</text>
            <text id="scene1-f1-female-genotype" class="scene1-fade" x="270" y="185" font-size="14" fill="#000000">XᴿXʳ</text>
            <text id="scene1-f1-male-trait" class="scene1-fade" x="425" y="165" font-size="16" fill="#c62828">♂棒眼</text>
            <text id="scene1-f1-male-genotype" class="scene1-fade" x="410" y="185" font-size="14" fill="#000000">XʳY</text>

            <!-- 步骤2：F₁→F₂箭头与交配标签 -->
            <line id="scene1-f1-to-f2-arrow" class="scene1-fade" x1="320" y1="200" x2="320" y2="235" stroke="#000000" stroke-width="1.5" marker-end="url(#scene1-arrowhead)"/>
            <text id="scene1-f1-mating-label" class="scene1-fade" x="420" y="205" font-size="14" fill="#000000">F₁雌雄交配</text>

            <!-- ==================== F₂代 ==================== -->
            <text id="scene1-f2-label" x="50" y="330" font-size="20" fill="#000000" font-weight="bold">F₂</text>

            <!-- 步骤3：棋盘格 -->
            <!-- 高亮边框（绿色，略大于黑框） -->
            <line id="scene1-f2-hl-1" class="scene1-fade" x1="258" y1="233" x2="522" y2="233" stroke="#2e7d32" stroke-width="2"/>
            <line id="scene1-f2-hl-2" class="scene1-fade" x1="522" y1="233" x2="522" y2="427" stroke="#2e7d32" stroke-width="2"/>
            <line id="scene1-f2-hl-3" class="scene1-fade" x1="522" y1="427" x2="258" y2="427" stroke="#2e7d32" stroke-width="2"/>
            <line id="scene1-f2-hl-4" class="scene1-fade" x1="258" y1="427" x2="258" y2="233" stroke="#2e7d32" stroke-width="2"/>
            <!-- 外框（黑色） -->
            <line id="scene1-f2-b1" class="scene1-fade" x1="260" y1="235" x2="520" y2="235" stroke="#000000" stroke-width="1.5"/>
            <line id="scene1-f2-b2" class="scene1-fade" x1="520" y1="235" x2="520" y2="425" stroke="#000000" stroke-width="1.5"/>
            <line id="scene1-f2-b3" class="scene1-fade" x1="520" y1="425" x2="260" y2="425" stroke="#000000" stroke-width="1.5"/>
            <line id="scene1-f2-b4" class="scene1-fade" x1="260" y1="425" x2="260" y2="235" stroke="#000000" stroke-width="1.5"/>
            <!-- 中竖线 -->
            <line id="scene1-f2-grid-vline" class="scene1-fade" x1="390" y1="235" x2="390" y2="425" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
            <!-- 中横线 -->
            <line id="scene1-f2-grid-hline" class="scene1-fade" x1="260" y1="330" x2="520" y2="330" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>

            <!-- 雌配子表头 -->
            <text id="scene1-f2-female-gamete-r" class="scene1-fade" x="325" y="265" font-size="14" fill="#1565c0" text-anchor="middle">Xᴿ</text>
            <text id="scene1-f2-female-gamete-r2" class="scene1-fade" x="455" y="265" font-size="14" fill="#1565c0" text-anchor="middle">Xʳ</text>

            <!-- 雄配子表头 -->
            <text id="scene1-f2-male-gamete-r" class="scene1-fade" x="235" y="305" font-size="14" fill="#c62828" text-anchor="middle">Xʳ</text>
            <text id="scene1-f2-male-gamete-y" class="scene1-fade" x="235" y="375" font-size="14" fill="#c62828" text-anchor="middle">Y</text>

            <!-- 左上格：XᴿXʳ ♀圆眼 -->
            <text id="scene1-f2-cell-xrxr-genotype" class="scene1-fade" x="325" y="282" font-size="13" fill="#000000" text-anchor="middle">XᴿXʳ</text>
            <text id="scene1-f2-cell-xrxr-trait" class="scene1-fade" x="325" y="318" font-size="13" fill="#1565c0" text-anchor="middle">♀圆眼</text>

            <!-- 右上格：XʳXʳ ♀棒眼 -->
            <text id="scene1-f2-cell-xrxr2-genotype" class="scene1-fade" x="455" y="282" font-size="13" fill="#000000" text-anchor="middle">XʳXʳ</text>
            <text id="scene1-f2-cell-xrxr2-trait" class="scene1-fade" x="455" y="318" font-size="13" fill="#1565c0" text-anchor="middle">♀棒眼</text>

            <!-- 左下格：XᴿY ♂圆眼 -->
            <text id="scene1-f2-cell-xry-genotype" class="scene1-fade" x="325" y="350" font-size="13" fill="#000000" text-anchor="middle">XᴿY</text>
            <text id="scene1-f2-cell-xry-trait" class="scene1-fade" x="325" y="400" font-size="13" fill="#c62828" text-anchor="middle">♂圆眼</text>

            <!-- 右下格：XʳY ♂棒眼 -->
            <text id="scene1-f2-cell-xry2-genotype" class="scene1-fade" x="455" y="350" font-size="13" fill="#000000" text-anchor="middle">XʳY</text>
            <text id="scene1-f2-cell-xry2-trait" class="scene1-fade" x="455" y="400" font-size="13" fill="#c62828" text-anchor="middle">♂棒眼</text>

            <!-- 比例汇总 -->
            <text id="scene1-f2-ratio" class="scene1-fade" x="400" y="445" font-size="14" fill="#000000" text-anchor="middle">♀圆眼 : ♀棒眼 : ♂圆眼 : ♂棒眼 = 1 : 1 : 1 : 1</text>
        </svg>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/4</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        let currentStep = 0; // 0~3

        // 元素引用
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');

        // 按步骤分组的元素ID列表
        const stepElements = {
            0: ['scene1-f1-placeholder-group'],
            1: [
                'scene1-p-female-genotype', 'scene1-p-male-genotype',
                'scene1-f1-female-trait', 'scene1-f1-female-genotype',
                'scene1-f1-male-trait', 'scene1-f1-male-genotype',
                'scene1-f1-hl-f1', 'scene1-f1-hl-f2', 'scene1-f1-hl-f3', 'scene1-f1-hl-f4',
                'scene1-f1-hl-m1', 'scene1-f1-hl-m2', 'scene1-f1-hl-m3', 'scene1-f1-hl-m4'
            ],
            2: [
                'scene1-f1-to-f2-arrow', 'scene1-f1-mating-label'
            ],
            3: [
                'scene1-f2-hl-1', 'scene1-f2-hl-2', 'scene1-f2-hl-3', 'scene1-f2-hl-4',
                'scene1-f2-b1', 'scene1-f2-b2', 'scene1-f2-b3', 'scene1-f2-b4',
                'scene1-f2-grid-vline', 'scene1-f2-grid-hline',
                'scene1-f2-female-gamete-r', 'scene1-f2-female-gamete-r2',
                'scene1-f2-male-gamete-r', 'scene1-f2-male-gamete-y',
                'scene1-f2-cell-xrxr-genotype', 'scene1-f2-cell-xrxr-trait',
                'scene1-f2-cell-xrxr2-genotype', 'scene1-f2-cell-xrxr2-trait',
                'scene1-f2-cell-xry-genotype', 'scene1-f2-cell-xry-trait',
                'scene1-f2-cell-xry2-genotype', 'scene1-f2-cell-xry2-trait',
                'scene1-f2-ratio'
            ]
        };

        function getElement(id) {
            return document.getElementById(id);
        }

        function showElement(id) {
            const el = getElement(id);
            if (!el) return;
            el.style.display = '';
            requestAnimationFrame(() => {
                el.classList.remove('scene1-hidden');
                el.classList.add('scene1-visible');
            });
        }

        function hideElement(id) {
            const el = getElement(id);
            if (!el) return;
            el.classList.remove('scene1-visible');
            el.classList.add('scene1-hidden');
            setTimeout(() => {
                if (el.classList.contains('scene1-hidden')) {
                    el.style.display = 'none';
                }
            }, 300);
        }

        function setOpacityVisible(id) {
            const el = getElement(id);
            if (!el) return;
            el.style.display = '';
            el.classList.remove('scene1-hidden');
            requestAnimationFrame(() => {
                el.classList.add('scene1-visible');
            });
        }

        function setOpacityHidden(id) {
            const el = getElement(id);
            if (!el) return;
            el.classList.remove('scene1-visible');
            requestAnimationFrame(() => {
                el.classList.add('scene1-hidden');
            });
        }

        function render() {
            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === 3);
            stepIndicator.textContent = '步骤 ' + (currentStep + 1) + '/4';

            // 步骤0元素：占位符（立即显示/隐藏，避免与step1重叠）
            const placeholder = getElement('scene1-f1-placeholder-group');
            if (placeholder) {
                if (currentStep === 0) {
                    placeholder.style.display = '';
                    placeholder.classList.remove('scene1-hidden');
                    placeholder.classList.add('scene1-visible');
                } else {
                    placeholder.style.display = 'none';
                    placeholder.classList.remove('scene1-visible');
                    placeholder.classList.add('scene1-hidden');
                }
            }

            // 步骤1元素：P代基因型 + F₁结果 + 高亮
            stepElements[1].forEach(id => {
                if (currentStep >= 1) {
                    setOpacityVisible(id);
                } else {
                    setOpacityHidden(id);
                }
            });

            // 步骤2元素：F₁→F₂箭头 + 交配标签
            stepElements[2].forEach(id => {
                if (currentStep >= 2) {
                    setOpacityVisible(id);
                } else {
                    setOpacityHidden(id);
                }
            });

            // 步骤3元素：F₂棋盘格 + 比例
            stepElements[3].forEach(id => {
                if (currentStep >= 3) {
                    setOpacityVisible(id);
                } else {
                    setOpacityHidden(id);
                }
            });
        }

        // 初始化：先隐藏所有非步骤0的fade元素
        function init() {
            const allFade = document.querySelectorAll('.scene1-fade');
            allFade.forEach(el => {
                el.style.display = 'none';
                el.classList.add('scene1-hidden');
            });

            const placeholder = getElement('scene1-f1-placeholder-group');
            if (placeholder) {
                placeholder.style.display = '';
                placeholder.classList.remove('scene1-hidden');
                placeholder.classList.add('scene1-visible');
            }

            render();
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                render();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < 3) {
                currentStep++;
                render();
            }
        });

        init();
    })();
    </script>
</body>
</html>
