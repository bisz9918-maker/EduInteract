<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scene 3 - 遗传概率计算</title>
<style>
body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "SimHei", sans-serif; }
#scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
#scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
#scene3-controls button { padding: 6px 16px; font-size: 14px; cursor: pointer; border: none; border-radius: 4px; background: #1565c0; color: white; }
#scene3-controls button:hover:not(:disabled) { background: #0d47a1; }
#scene3-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
#scene3-step-indicator { font-size: 14px; color: #333; min-width: 60px; text-align: center; }
svg { display: block; }
.pedigree-label { font-size: 12px; fill: #333; text-anchor: middle; }
.step-group { transition: opacity 0.25s ease; }
</style>
</head>
<body>
<div id="scene3-container">
<svg id="scene3-svg" width="800" height="500">
  <defs>
    <!-- 甲病斜线填充 pattern -->
    <pattern id="scene3-pattern-甲病" patternUnits="userSpaceOnUse" width="8" height="8">
      <rect width="8" height="8" fill="white"/>
      <line x1="0" y1="8" x2="8" y2="0" stroke="#1565c0" stroke-width="1.5"/>
    </pattern>
    <!-- 乙病红点填充 pattern -->
    <pattern id="scene3-pattern-乙病" patternUnits="userSpaceOnUse" width="6" height="6">
      <rect width="6" height="6" fill="white"/>
      <circle cx="3" cy="3" r="1.2" fill="#c62828"/>
    </pattern>
  </defs>

  <!-- 系谱图分组（步骤0、1共用） -->
  <g id="scene3-pedigree-group" class="step-group">
    <!-- 代际标签 -->
    <text x="90" y="83" font-size="13" fill="#333" text-anchor="middle">Ⅰ</text>
    <text x="90" y="143" font-size="13" fill="#333" text-anchor="middle">Ⅱ</text>

    <!-- 婚姻线 -->
    <line x1="158" y1="80" x2="202" y2="80" stroke="#000" stroke-width="1.5"/>
    <!-- 垂线 -->
    <line x1="180" y1="80" x2="180" y2="110" stroke="#000" stroke-width="1.5"/>
    <!-- 子女横线 -->
    <line x1="120" y1="110" x2="240" y2="110" stroke="#000" stroke-width="1.5"/>
    <!-- 子女垂线 -->
    <line x1="120" y1="110" x2="120" y2="132" stroke="#000" stroke-width="1.5"/>
    <line x1="180" y1="110" x2="180" y2="132" stroke="#000" stroke-width="1.5"/>
    <line x1="240" y1="110" x2="240" y2="132" stroke="#000" stroke-width="1.5"/>

    <!-- Ⅰ-1 患甲病男 -->
    <rect x="142" y="72" width="16" height="16" fill="url(#scene3-pattern-甲病)" stroke="#000" stroke-width="1.5"/>
    <text x="150" y="60" class="pedigree-label">Ⅰ-1</text>

    <!-- Ⅰ-2 正常女 -->
    <circle cx="210" cy="80" r="8" fill="white" stroke="#000" stroke-width="1.5"/>
    <text x="210" y="60" class="pedigree-label">Ⅰ-2</text>

    <!-- Ⅱ-3 患甲病男 -->
    <rect x="112" y="132" width="16" height="16" fill="url(#scene3-pattern-甲病)" stroke="#000" stroke-width="1.5"/>
    <text x="120" y="163" class="pedigree-label">Ⅱ-3</text>

    <!-- Ⅱ-4 正常女 -->
    <circle cx="180" cy="140" r="8" fill="white" stroke="#000" stroke-width="1.5"/>
    <text x="180" y="163" class="pedigree-label">Ⅱ-4</text>

    <!-- Ⅱ-5 患乙病女 -->
    <circle cx="240" cy="140" r="8" fill="url(#scene3-pattern-乙病)" stroke="#000" stroke-width="1.5"/>
    <text x="240" y="163" class="pedigree-label">Ⅱ-5</text>
  </g>

  <!-- 步骤0：表型说明 -->
  <g id="scene3-step0-group" class="step-group">
    <text x="350" y="80" font-size="14" fill="#333">Ⅱ-3：患甲病男性，不患乙病</text>
    <text x="350" y="105" font-size="14" fill="#333">Ⅱ-4：正常女性，不患甲病</text>
    <text x="350" y="130" font-size="12" fill="#888">目标：计算Ⅱ-3与Ⅱ-4婚配后</text>
    <text x="350" y="150" font-size="12" fill="#888">生育两病兼患孩子的概率</text>
  </g>

  <!-- 步骤1：基因型推导 -->
  <g id="scene3-step1-group" class="step-group" style="display:none; opacity:0;">
    <!-- 高亮圈 -->
    <circle cx="120" cy="140" r="12" fill="none" stroke="#1565c0" stroke-width="2"/>
    <circle cx="180" cy="140" r="12" fill="none" stroke="#c62828" stroke-width="2"/>

    <!-- Ⅱ-3推导 -->
    <text x="340" y="80" font-size="15" fill="#1565c0" font-weight="bold">Ⅱ-3 基因型推导</text>
    <text x="340" y="105" font-size="12" fill="#333">父亲Ⅰ-1患甲病（Aa），母亲Ⅰ-2正常（aa）</text>
    <text x="340" y="125" font-size="12" fill="#333">Ⅱ-3患甲病 → 必含 A 基因 → Aa</text>
    <text x="340" y="145" font-size="12" fill="#333">Ⅱ-3不患乙病 → X^BY</text>
    <text x="340" y="175" font-size="14" fill="#1565c0" font-weight="bold">∴ Ⅱ-3：AaX^BY</text>

    <!-- Ⅱ-4推导 -->
    <text x="340" y="210" font-size="15" fill="#c62828" font-weight="bold">Ⅱ-4 基因型推导</text>
    <text x="340" y="235" font-size="12" fill="#333">Ⅱ-4不患甲病 → aa</text>
    <text x="340" y="255" font-size="12" fill="#333">Ⅱ-5患乙病（X^bO），父亲Ⅰ-1正常（X^BY）</text>
    <text x="340" y="275" font-size="12" fill="#333">→ 母亲Ⅰ-2必为携带者 X^BX^b</text>
    <text x="340" y="295" font-size="12" fill="#333">Ⅱ-4从父亲得 X^B，从母亲得 1/2 X^B 或 1/2 X^b</text>
    <text x="340" y="325" font-size="14" fill="#c62828" font-weight="bold">∴ Ⅱ-4：aa（1/2 X^BX^B 或 1/2 X^BX^b）</text>
  </g>

  <!-- 步骤2：甲病概率 -->
  <g id="scene3-step2-group" class="step-group" style="display:none; opacity:0;">
    <text x="80" y="55" font-size="15" fill="#333" font-weight="bold">步骤2：甲病概率计算（Aa × aa）</text>

    <!-- Punnett square 外框 -->
    <rect x="120" y="120" width="160" height="160" fill="none" stroke="#000" stroke-width="1"/>
    <!-- 格子线 -->
    <line x1="200" y1="120" x2="200" y2="280" stroke="#000" stroke-width="1"/>
    <line x1="120" y1="200" x2="280" y2="200" stroke="#000" stroke-width="1"/>

    <!-- 列标签 -->
    <text x="160" y="115" font-size="13" fill="#333" text-anchor="middle">a</text>
    <text x="240" y="115" font-size="13" fill="#333" text-anchor="middle">a</text>
    <!-- 行标签 -->
    <text x="115" y="165" font-size="13" fill="#333" text-anchor="end">A</text>
    <text x="115" y="245" font-size="13" fill="#333" text-anchor="end">a</text>

    <!-- 格子文字 -->
    <text x="160" y="165" font-size="14" fill="#1565c0" font-weight="bold" text-anchor="middle">Aa</text>
    <text x="240" y="165" font-size="14" fill="#1565c0" font-weight="bold" text-anchor="middle">Aa</text>
    <text x="160" y="245" font-size="14" fill="#888" text-anchor="middle">aa</text>
    <text x="240" y="245" font-size="14" fill="#888" text-anchor="middle">aa</text>

    <!-- 结果标注 -->
    <text x="300" y="165" font-size="13" fill="#1565c0">1/2 患甲病（Aa）</text>
    <text x="300" y="245" font-size="13" fill="#888">1/2 正常（aa）</text>

    <!-- 结论 -->
    <text x="180" y="310" font-size="15" fill="#1565c0" font-weight="bold" text-anchor="middle">∴ P(甲病) = 1/2</text>
  </g>

  <!-- 步骤3：乙病概率 -->
  <g id="scene3-step3-group" class="step-group" style="display:none; opacity:0;">
    <text x="380" y="55" font-size="15" fill="#333" font-weight="bold">步骤3：乙病概率计算（伴X隐性遗传）</text>

    <!-- 分支树连接线 -->
    <!-- 根到第一层 -->
    <line x1="415" y1="255" x2="440" y2="225" stroke="#000" stroke-width="1.5"/>
    <line x1="415" y1="265" x2="440" y2="300" stroke="#000" stroke-width="1.5"/>
    <!-- 第一层下到第二层 -->
    <line x1="520" y1="295" x2="555" y2="283" stroke="#000" stroke-width="1.5"/>
    <line x1="520" y1="305" x2="555" y2="323" stroke="#000" stroke-width="1.5"/>
    <!-- 第二层下到第三层 -->
    <line x1="585" y1="315" x2="635" y2="310" stroke="#000" stroke-width="1.5"/>
    <line x1="585" y1="325" x2="635" y2="340" stroke="#000" stroke-width="1.5"/>

    <!-- 节点文字 -->
    <text x="400" y="265" font-size="14" fill="#c62828" font-weight="bold">Ⅱ-4</text>

    <text x="480" y="225" font-size="12" fill="#888">1/2 X^BX^B</text>
    <text x="480" y="305" font-size="12" fill="#c62828" font-weight="bold">1/2 X^BX^b</text>

    <text x="560" y="285" font-size="12" fill="#888">1/2 女</text>
    <text x="560" y="325" font-size="12" fill="#c62828">1/2 男</text>

    <text x="640" y="310" font-size="12" fill="#888">1/2 X^B（正常）</text>
    <text x="640" y="340" font-size="12" fill="#c62828" font-weight="bold">1/2 X^b（患乙病）</text>

    <!-- 末端概率 -->
    <text x="540" y="225" font-size="12" fill="#888">→ P=0</text>
    <text x="620" y="285" font-size="11" fill="#888">→ P=0（父亲传X^B）</text>
    <text x="700" y="310" font-size="12" fill="#888">P=0</text>
    <text x="700" y="340" font-size="13" fill="#c62828" font-weight="bold">P=1/8</text>

    <!-- 注释 -->
    <text x="380" y="365" font-size="11" fill="#888" font-style="italic">注：女孩不可能患乙病，父亲Ⅱ-3必传X^B</text>

    <!-- 结论 -->
    <text x="480" y="395" font-size="14" fill="#c62828" font-weight="bold">P(乙病) = 1/2 × 1/2 × 1/2 = 1/8</text>
  </g>

  <!-- 步骤4：联合概率 -->
  <g id="scene3-step4-group" class="step-group" style="display:none; opacity:0;">
    <text x="250" y="80" font-size="15" fill="#333" font-weight="bold">步骤4：两病兼患联合概率</text>

    <text x="150" y="200" font-size="16" fill="#1565c0" font-weight="bold" text-anchor="middle">P(甲病) = 1/2</text>
    <text x="300" y="200" font-size="20" fill="#333" text-anchor="middle">×</text>
    <text x="450" y="200" font-size="16" fill="#c62828" font-weight="bold" text-anchor="middle">P(乙病) = 1/8</text>

    <text x="400" y="280" font-size="14" fill="#333" text-anchor="middle">P(两病兼患) = P(甲病) × P(乙病)</text>
    <text x="400" y="320" font-size="14" fill="#333" text-anchor="middle">= 1/2 × 1/8</text>

    <!-- 高亮框 -->
    <rect x="270" y="340" width="150" height="50" fill="rgba(46,125,50,0.1)" stroke="#2e7d32" stroke-width="3" rx="4"/>
    <text x="345" y="375" font-size="24" fill="#2e7d32" font-weight="bold" text-anchor="middle">= 1/16</text>

    <text x="400" y="430" font-size="14" fill="#333" text-anchor="middle">∴ Ⅱ-3与Ⅱ-4生育两病兼患孩子的概率为 1/16</text>
  </g>
</svg>

<div id="scene3-controls">
  <button id="scene3-btn-prev" disabled>◀ 上一步</button>
  <span id="scene3-step-indicator">步骤 0/4</span>
  <button id="scene3-btn-next">下一步 ▶</button>
</div>
</div>

<script>
(function() {
  let currentStep = 0;
  const totalSteps = 4;

  const pedigreeGroup = document.getElementById('scene3-pedigree-group');
  const stepGroups = [
    document.getElementById('scene3-step0-group'),
    document.getElementById('scene3-step1-group'),
    document.getElementById('scene3-step2-group'),
    document.getElementById('scene3-step3-group'),
    document.getElementById('scene3-step4-group')
  ];
  const btnPrev = document.getElementById('scene3-btn-prev');
  const btnNext = document.getElementById('scene3-btn-next');
  const indicator = document.getElementById('scene3-step-indicator');

  function show(el) {
    el.style.display = 'block';
    requestAnimationFrame(function() {
      el.style.opacity = '1';
    });
  }

  function hide(el) {
    el.style.opacity = '0';
    setTimeout(function() {
      if (currentStep !== parseInt(el.id.replace('scene3-step','').replace('-group',''),10)) {
        el.style.display = 'none';
      }
    }, 250);
  }

  function updateStep(newStep) {
    var oldStep = currentStep;
    currentStep = newStep;

    // 更新按钮状态
    btnPrev.disabled = currentStep === 0;
    if (currentStep === totalSteps) {
      btnNext.textContent = '完成';
      btnNext.disabled = true;
    } else {
      btnNext.textContent = '下一步 ▶';
      btnNext.disabled = false;
    }

    // 更新指示器
    indicator.textContent = '步骤 ' + currentStep + '/' + totalSteps;

    // 系谱图在步骤0和1显示
    if (currentStep <= 1) {
      show(pedigreeGroup);
    } else {
      hide(pedigreeGroup);
    }

    // 更新步骤分组
    stepGroups.forEach(function(g, i) {
      if (i === currentStep) {
        show(g);
      } else {
        g.style.opacity = '0';
        setTimeout(function() {
          if (i !== currentStep) {
            g.style.display = 'none';
          }
        }, 250);
      }
    });
  }

  btnPrev.addEventListener('click', function() {
    if (currentStep > 0) updateStep(currentStep - 1);
  });

  btnNext.addEventListener('click', function() {
    if (currentStep < totalSteps) updateStep(currentStep + 1);
  });

  // 初始化
  updateStep(0);
})();
</script>
</body>
</html>
