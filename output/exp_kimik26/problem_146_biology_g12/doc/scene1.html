<circle cx="565" cy="240" r="30" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
<path d="M560,235 L565,245 L570,235" fill="none" stroke="#c62828" stroke-width="3" stroke-linecap="round"/>
<circle cx="565" cy="245" r="3" fill="#000000"/>
<text x="565" y="285" text-anchor="middle" font-size="14" fill="#000000">Y</text>
<text x="400" y="350" text-anchor="middle" font-size="18" fill="#2e7d32" font-weight="bold">四种配子类型</text>
</g>
</svg>
<div id="scene1-controls">
<button id="scene1-btn-prev" class="scene1-btn">◀ 上一步</button>
<span id="scene1-step-indicator">步骤 1 / 6</span>
<button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
</div>
</div>
<script>
(function() {
let scene1_currentStep = 0;
const totalSteps = 6;
const titles = [
"果蝇性染色体异常类型",
"正常果蝇体细胞染色体组成",
"减数第一次分裂中期",
"减数第二次分裂后期",
"XXY雌果蝇减数分裂联会",
"XXY雌果蝇产生的配子类型"
];
const prevBtn = document.getElementById("scene1-btn-prev");
const nextBtn = document.getElementById("scene1-btn-next");
const indicator = document.getElementById("scene1-step-indicator");
const titleEl = document.getElementById("scene1-title");
function scene1_showStep(idx) {
if (idx < 0 || idx >= totalSteps) return;
scene1_currentStep = idx;
for (let i = 0; i < totalSteps; i++) {
const group = document.getElementById("scene1-step" + i + "-group");
if (group) group.classList.remove("active");
}
const currentGroup = document.getElementById("scene1-step" + idx + "-group");
if (currentGroup) currentGroup.classList.add("active");
titleEl.textContent = titles[idx];
indicator.textContent = "步骤 " + (idx + 1) + " / " + totalSteps;
prevBtn.disabled = (idx === 0);
nextBtn.disabled = (idx === totalSteps - 1);
}
prevBtn.addEventListener("click", function() { scene1_showStep(scene1_currentStep - 1); });
nextBtn.addEventListener("click", function() { scene1_showStep(scene1_currentStep + 1); });
scene1_showStep(0);
})();
</script>
</body>
</html>
