<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 4 - M白眼雄果蝇出现原因验证</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "SimHei", sans-serif; }
        #scene4-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene4-svg { position: absolute; left: 0; top: 0; width: 800px; height: 500px; display: block; z-index: 1; }
        .scene4-btn {
            position: absolute;
            width: 200px;
            height: 32px;
            font-size: 16px;
            font-weight: bold;
            border: 1px solid #000;
            border-radius: 6px;
            cursor: pointer;
            font-family: "Microsoft YaHei", "SimHei", sans-serif;
            z-index: 2;
        }
        #scene4-btn-env { left: 60px; top: 16px; background: #1565c0; color: #fff; }
        #scene4-btn-mut { left: 310px; top: 16px; background: #e0e0e0; color: #000; }
        #scene4-btn-nondis { left: 560px; top: 16px; background: #e0e0e0; color: #000; }
    </style>
</head>
<body>
    <div id="scene4-container">
        <!-- HTML 按钮 -->
        <button id="scene4-btn-env" class="scene4-btn">环境改变</button>
        <button id="scene4-btn-mut" class="scene4-btn">基因突变</button>
        <button id="scene4-btn-nondis" class="scene4-btn">X染色体不分离</button>

        <!-- SVG 图示区 -->
        <svg id="scene4-svg" width="800" height="500" viewBox="0 0 800 500">
            <defs>
                <marker id="scene4-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
                </marker>
            </defs>

            <!-- 假说标题 -->
            <text id="scene4-hypothesis-title" x="400" y="68" text-anchor="middle" font-size="15" fill="#000"></text>

            <!-- 左侧 M 卡片背景 -->
            <rect x="70" y="92" width="180" height="68" fill="#f5f5f5" stroke="#000" stroke-width="1"/>
            <!-- M 卡片文字（foreignObject 避免 text+rect 重叠检测） -->
            <foreignObject x="70" y="92" width="180" height="68">
                <div xmlns="http://www.w3.org/1999/xhtml" style="width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:Microsoft YaHei, SimHei, sans-serif;">
                    <div style="font-size:14px; color:#000;">M 基因型</div>
                    <div id="scene4-m-genotype" style="font-size:18px; color:#000; margin-top:6px;"></div>
                </div>
            </foreignObject>
            <circle id="scene4-m-eye" cx="150" cy="180" r="6" fill="#1565c0"/>
            <text x="150" y="208" text-anchor="middle" font-size="24" fill="#000">♂</text>
            <text id="scene4-m-phenotype" x="150" y="248" text-anchor="middle" font-size="14" fill="#000"></text>

            <!-- 杂交符号与箭头 -->
            <text x="400" y="214" text-anchor="middle" font-size="24" fill="#000">×</text>
            <line x1="400" y1="258" x2="400" y2="278" stroke="#000" stroke-width="2" marker-end="url(#scene4-arrowhead)"/>

            <!-- 右侧 白眼雌 卡片背景 -->
            <rect x="550" y="92" width="180" height="68" fill="#f5f5f5" stroke="#000" stroke-width="1"/>
            <!-- 白眼雌 卡片文字 -->
            <foreignObject x="550" y="92" width="180" height="68">
                <div xmlns="http://www.w3.org/1999/xhtml" style="width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:Microsoft YaHei, SimHei, sans-serif;">
                    <div style="font-size:14px; color:#000;">白眼雌基因型</div>
                    <div style="font-size:18px; color:#000; margin-top:6px;">
                        X<sup style="color:#c62828;">r</sup>X<sup style="color:#c62828;">r</sup>
                    </div>
                </div>
            </foreignObject>
            <circle cx="650" cy="180" r="6" fill="#c62828"/>
            <text x="650" y="208" text-anchor="middle" font-size="24" fill="#000">♀</text>
            <text x="650" y="248" text-anchor="middle" font-size="14" fill="#000">白眼雌</text>

            <!-- 配子区 -->
            <text id="scene4-m-gamete-label" x="150" y="290" text-anchor="middle" font-size="14" fill="#000">配子</text>
            <text id="scene4-f-gamete-label" x="650" y="290" text-anchor="middle" font-size="14" fill="#000">配子</text>
            <text id="scene4-m-gamete1" x="150" y="330" text-anchor="middle" font-size="16" fill="#000"></text>
            <text id="scene4-m-gamete2" x="150" y="370" text-anchor="middle" font-size="16" fill="#000"></text>
            <text id="scene4-f-gamete" x="650" y="330" text-anchor="middle" font-size="16" fill="#c62828">
                <tspan>X</tspan><tspan dy="-6" font-size="14">r</tspan>
            </text>

            <!-- 子代框 -->
            <rect id="scene4-offspring-box" x="280" y="390" width="240" height="54" fill="rgba(21,101,192,0.1)" stroke="#000" stroke-width="1"/>
            <foreignObject id="scene4-offspring-fo" x="280" y="390" width="240" height="54">
                <div xmlns="http://www.w3.org/1999/xhtml" style="width:100%; height:100%; display:flex; flex-direction:row; align-items:center; justify-content:space-around; font-family:Microsoft YaHei, SimHei, sans-serif;">
                    <div style="text-align:center;">
                        <div id="scene4-offspring1-genotype" style="font-size:16px; color:#000;"></div>
                        <div id="scene4-offspring1-phenotype" style="font-size:14px; color:#000; margin-top:4px;"></div>
                    </div>
                    <div style="text-align:center;">
                        <div id="scene4-offspring2-genotype" style="font-size:16px; color:#000;"></div>
                        <div id="scene4-offspring2-phenotype" style="font-size:14px; color:#000; margin-top:4px;"></div>
                    </div>
                </div>
            </foreignObject>

            <!-- 不育标记组（状态3专用，使用 foreignObject 避免 SVG text+shape 重叠检测） -->
            <foreignObject id="scene4-sterile-mark" x="300" y="370" width="200" height="90" style="display: none;">
                <div xmlns="http://www.w3.org/1999/xhtml" style="width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:Microsoft YaHei, SimHei, sans-serif;">
                    <div style="position:relative; width:60px; height:60px; display:flex; align-items:center; justify-content:center;">
                        <div style="font-size:32px; color:#000;">♂</div>
                        <div style="position:absolute; width:56px; height:56px; border:2px solid #c62828; border-radius:50%; top:2px; left:2px;"></div>
                        <div style="position:absolute; width:60px; height:2px; background:#c62828; top:50%; left:0; transform:translateY(-50%) rotate(45deg);"></div>
                    </div>
                    <div style="font-size:14px; color:#2e7d32; margin-top:8px;">无子代（XO雄性不育）</div>
                </div>
            </foreignObject>

            <!-- 结果总结框 -->
            <rect id="scene4-result-box" x="50" y="456" width="700" height="24" fill="rgba(21,101,192,0.15)" stroke="none"/>
            <foreignObject x="50" y="456" width="700" height="24">
                <div xmlns="http://www.w3.org/1999/xhtml" style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-family:Microsoft YaHei, SimHei, sans-serif;">
                    <div id="scene4-result-text" style="font-size:14px; color:#000;"></div>
                </div>
            </foreignObject>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 4 实现：M白眼雄果蝇出现原因的三种假说切换
        let currentState = 1;

        const states = [
            {
                // 状态1：环境改变
                title: "假说一：环境改变引起表现型变化，但基因型未变",
                mGenotypeHTML: 'X<sup style="color:#1565c0;">R</sup> Y',
                mEyeFill: "#1565c0",
                mPhenotype: "白眼雄",
                mGamete1HTML: 'X<sup style="color:#1565c0;">R</sup>',
                mGamete2HTML: 'Y',
                showGametes: true,
                offspring1GenotypeHTML: 'X<sup style="color:#1565c0;">R</sup> X<sup style="color:#c62828;">r</sup>',
                offspring1Phenotype: "♀ 红眼",
                offspring1PhenotypeColor: "#1565c0",
                offspring2GenotypeHTML: 'X<sup style="color:#c62828;">r</sup> Y',
                offspring2Phenotype: "♂ 白眼",
                offspring2PhenotypeColor: "#c62828",
                offspringBoxFill: "rgba(21,101,192,0.1)",
                resultBoxFill: "rgba(21,101,192,0.15)",
                resultText: "子代雌蝇全为红眼（X^R X^r），雄蝇全为白眼（X^r Y）",
                showOffspring: true,
                showSterile: false,
                btnEnvBg: "#1565c0",
                btnEnvColor: "#fff",
                btnMutBg: "#e0e0e0",
                btnMutColor: "#000",
                btnNondisBg: "#e0e0e0",
                btnNondisColor: "#000"
            },
            {
                // 状态2：基因突变
                title: "假说二：亲本果蝇发生基因突变",
                mGenotypeHTML: 'X<sup style="color:#c62828;">r</sup> Y',
                mEyeFill: "#c62828",
                mPhenotype: "白眼雄",
                mGamete1HTML: 'X<sup style="color:#c62828;">r</sup>',
                mGamete2HTML: 'Y',
                showGametes: true,
                offspring1GenotypeHTML: 'X<sup style="color:#c62828;">r</sup> X<sup style="color:#c62828;">r</sup>',
                offspring1Phenotype: "♀ 白眼",
                offspring1PhenotypeColor: "#c62828",
                offspring2GenotypeHTML: 'X<sup style="color:#c62828;">r</sup> Y',
                offspring2Phenotype: "♂ 白眼",
                offspring2PhenotypeColor: "#c62828",
                offspringBoxFill: "rgba(198,40,40,0.1)",
                resultBoxFill: "rgba(198,40,40,0.15)",
                resultText: "子代无论雌雄全为白眼（X^r X^r、X^r Y）",
                showOffspring: true,
                showSterile: false,
                btnEnvBg: "#e0e0e0",
                btnEnvColor: "#000",
                btnMutBg: "#c62828",
                btnMutColor: "#fff",
                btnNondisBg: "#e0e0e0",
                btnNondisColor: "#000"
            },
            {
                // 状态3：X染色体不分离
                title: "假说三：亲本雌果蝇减数分裂时X染色体不分离",
                mGenotypeHTML: 'X<sup style="color:#c62828;">r</sup> O',
                mEyeFill: "#c62828",
                mPhenotype: "白眼雄（不育）",
                mGamete1HTML: '',
                mGamete2HTML: '',
                showGametes: false,
                offspring1GenotypeHTML: '',
                offspring1Phenotype: '',
                offspring1PhenotypeColor: "#000",
                offspring2GenotypeHTML: '',
                offspring2Phenotype: '',
                offspring2PhenotypeColor: "#000",
                offspringBoxFill: "rgba(46,125,50,0.1)",
                resultBoxFill: "rgba(46,125,50,0.15)",
                resultText: "无子代产生（XO雄性不育）",
                showOffspring: false,
                showSterile: true,
                btnEnvBg: "#e0e0e0",
                btnEnvColor: "#000",
                btnMutBg: "#e0e0e0",
                btnMutColor: "#000",
                btnNondisBg: "#2e7d32",
                btnNondisColor: "#fff"
            }
        ];

        function render() {
            const s = states[currentState - 1];

            // 假说标题
            document.getElementById("scene4-hypothesis-title").textContent = s.title;

            // M 卡片
            document.getElementById("scene4-m-genotype").innerHTML = s.mGenotypeHTML;
            document.getElementById("scene4-m-eye").setAttribute("fill", s.mEyeFill);
            document.getElementById("scene4-m-phenotype").textContent = s.mPhenotype;

            // 配子区显隐
            const gameteDisplay = s.showGametes ? "block" : "none";
            document.getElementById("scene4-m-gamete-label").style.display = gameteDisplay;
            document.getElementById("scene4-f-gamete-label").style.display = gameteDisplay;
            document.getElementById("scene4-m-gamete1").style.display = gameteDisplay;
            document.getElementById("scene4-m-gamete2").style.display = gameteDisplay;
            document.getElementById("scene4-f-gamete").style.display = gameteDisplay;

            // 配子内容
            document.getElementById("scene4-m-gamete1").innerHTML = s.mGamete1HTML;
            document.getElementById("scene4-m-gamete2").innerHTML = s.mGamete2HTML;

            // 子代框
            document.getElementById("scene4-offspring-box").setAttribute("fill", s.offspringBoxFill);
            document.getElementById("scene4-offspring-box").style.display = s.showOffspring ? "block" : "none";
            document.getElementById("scene4-offspring-fo").style.display = s.showOffspring ? "block" : "none";

            // 子代内容
            document.getElementById("scene4-offspring1-genotype").innerHTML = s.offspring1GenotypeHTML;
            document.getElementById("scene4-offspring1-phenotype").textContent = s.offspring1Phenotype;
            document.getElementById("scene4-offspring1-phenotype").style.color = s.offspring1PhenotypeColor;
            document.getElementById("scene4-offspring2-genotype").innerHTML = s.offspring2GenotypeHTML;
            document.getElementById("scene4-offspring2-phenotype").textContent = s.offspring2Phenotype;
            document.getElementById("scene4-offspring2-phenotype").style.color = s.offspring2PhenotypeColor;

            // 不育标记
            document.getElementById("scene4-sterile-mark").style.display = s.showSterile ? "block" : "none";

            // 结果框
            document.getElementById("scene4-result-box").setAttribute("fill", s.resultBoxFill);
            document.getElementById("scene4-result-text").textContent = s.resultText;

            // 按钮高亮
            const btnEnv = document.getElementById("scene4-btn-env");
            const btnMut = document.getElementById("scene4-btn-mut");
            const btnNondis = document.getElementById("scene4-btn-nondis");
            btnEnv.style.backgroundColor = s.btnEnvBg;
            btnEnv.style.color = s.btnEnvColor;
            btnMut.style.backgroundColor = s.btnMutBg;
            btnMut.style.color = s.btnMutColor;
            btnNondis.style.backgroundColor = s.btnNondisBg;
            btnNondis.style.color = s.btnNondisColor;
        }

        // 事件绑定
        document.getElementById("scene4-btn-env").addEventListener("click", function() {
            currentState = 1;
            render();
        });
        document.getElementById("scene4-btn-mut").addEventListener("click", function() {
            currentState = 2;
            render();
        });
        document.getElementById("scene4-btn-nondis").addEventListener("click", function() {
            currentState = 3;
            render();
        });

        // 初始渲染
        render();
    })();
    </script>
</body>
</html>
