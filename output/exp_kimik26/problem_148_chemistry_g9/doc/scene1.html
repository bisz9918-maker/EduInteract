<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>甲烷与水反应制水煤气微观示意图</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 20px; z-index: 10; }

        .scene1-btn {
            padding: 6px 16px;
            font-size: 14px;
            border-radius: 4px;
            border: 1px solid #ccc;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        #scene1-btn-prev {
            background: #f0f0f0;
            color: #333;
        }
        #scene1-btn-prev:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        #scene1-btn-next {
            background: #1565c0;
            color: #fff;
            border-color: #1565c0;
        }
        #scene1-btn-next:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        #scene1-step-indicator {
            font-size: 14px;
            color: #666;
            min-width: 60px;
            text-align: center;
        }

        .scene1-step-el {
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .scene1-step-el.active {
            display: block;
            opacity: 1;
        }

        #scene1-table-group {
            display: none;
            opacity: 0;
            transform: translateY(40px);
            transition: transform 0.4s ease-out, opacity 0.3s ease;
        }
        #scene1-table-group.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        @keyframes scene1-flash {
            0%, 100% { stroke: #000; stroke-width: 1; }
            50% { stroke: #1565c0; stroke-width: 3; }
        }
        .scene1-flash-anim {
            animation: scene1-flash 0.4s ease-in-out 3;
        }
        .scene1-highlight-blue {
            stroke: #1565c0 !important;
            stroke-width: 3 !important;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <pattern id="scene1-carbon-pattern" patternUnits="userSpaceOnUse" width="8" height="8">
                    <rect width="8" height="8" fill="#e0e0e0"/>
                    <line x1="0" y1="0" x2="8" y2="8" stroke="#888" stroke-width="1"/>
                </pattern>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
                </marker>
            </defs>

            <!-- 左框（反应前） -->
            <rect id="scene1-box-left" x="60" y="50" width="260" height="130" fill="rgba(0,0,0,0.03)" stroke="#000" stroke-width="1"/>
            <!-- 右框（反应后） -->
            <rect id="scene1-box-right" x="420" y="50" width="260" height="130" fill="rgba(0,0,0,0.03)" stroke="#000" stroke-width="1"/>

            <!-- 反应箭头 -->
            <line x1="330" y1="135" x2="410" y2="135" stroke="#000" stroke-width="2" marker-end="url(#scene1-arrowhead)"/>
            <text x="370" y="118" text-anchor="middle" font-size="14" fill="#000">高温</text>

            <!-- 甲分子 CH₄ -->
            <g id="scene1-mol-jia">
                <line x1="150" y1="135" x2="150" y2="103" stroke="#000" stroke-width="1"/>
                <line x1="150" y1="135" x2="150" y2="167" stroke="#000" stroke-width="1"/>
                <line x1="150" y1="135" x2="118" y2="135" stroke="#000" stroke-width="1"/>
                <line x1="150" y1="135" x2="182" y2="135" stroke="#000" stroke-width="1"/>
                <circle class="scene1-atom-c" cx="150" cy="135" r="12" fill="url(#scene1-carbon-pattern)" stroke="#000" stroke-width="1"/>
                <circle class="scene1-atom-h" cx="150" cy="103" r="10" fill="#fff" stroke="#000" stroke-width="1"/>
                <circle class="scene1-atom-h" cx="150" cy="167" r="10" fill="#fff" stroke="#000" stroke-width="1"/>
                <circle class="scene1-atom-h" cx="118" cy="135" r="10" fill="#fff" stroke="#000" stroke-width="1"/>
                <circle class="scene1-atom-h" cx="182" cy="135" r="10" fill="#fff" stroke="#000" stroke-width="1"/>
            </g>
            <text x="150" y="225" text-anchor="middle" font-size="14" fill="#000">甲</text>

            <!-- 乙分子 H₂O -->
            <g id="scene1-mol-yi">
                <line x1="250" y1="135" x2="230" y2="110" stroke="#000" stroke-width="1"/>
                <line x1="250" y1="135" x2="270" y2="160" stroke="#000" stroke-width="1"/>
                <circle class="scene1-atom-o" cx="250" cy="135" r="12" fill="#000" stroke="#000" stroke-width="1"/>
                <circle class="scene1-atom-h" cx="230" cy="110" r="10" fill="#fff" stroke="#000" stroke-width="1"/>
                <circle class="scene1-atom-h" cx="270" cy="160" r="10" fill="#fff" stroke="#000" stroke-width="1"/>
            </g>
            <text x="250" y="225" text-anchor="middle" font-size="14" fill="#000">乙</text>

            <!-- 丙分子 CO -->
            <g id="scene1-mol-bing">
                <line x1="520" y1="135" x2="560" y2="135" stroke="#000" stroke-width="1"/>
                <circle class="scene1-atom-c" cx="520" cy="135" r="12" fill="url(#scene1-carbon-pattern)" stroke="#000" stroke-width="1"/>
                <circle class="scene1-atom-o" cx="560" cy="135" r="12" fill="#000" stroke="#000" stroke-width="1"/>
            </g>
            <text x="540" y="225" text-anchor="middle" font-size="14" fill="#000">丙</text>

            <!-- 丁分子 H₂ -->
            <g id="scene1-mol-ding">
                <line x1="620" y1="120" x2="620" y2="150" stroke="#000" stroke-width="1"/>
                <circle class="scene1-atom-h" cx="620" cy="120" r="10" fill="#fff" stroke="#000" stroke-width="1"/>
                <circle class="scene1-atom-h" cx="620" cy="150" r="10" fill="#fff" stroke="#000" stroke-width="1"/>
            </g>
            <text x="620" y="225" text-anchor="middle" font-size="14" fill="#000">丁</text>

            <!-- 图例 -->
            <g id="scene1-legend">
                <circle class="scene1-atom-h" cx="700" cy="90" r="10" fill="#fff" stroke="#000" stroke-width="1"/>
                <text x="715" y="95" font-size="12" fill="#000">— 氢原子</text>
                <circle class="scene1-atom-o" cx="700" cy="125" r="10" fill="#000" stroke="#000" stroke-width="1"/>
                <text x="715" y="130" font-size="12" fill="#000">— 氧原子</text>
                <circle class="scene1-atom-c" cx="700" cy="160" r="10" fill="url(#scene1-carbon-pattern)" stroke="#000" stroke-width="1"/>
                <text x="715" y="165" font-size="12" fill="#000">— 碳原子</text>
            </g>

            <!-- 反应前/后标签 -->
            <text x="190" y="325" text-anchor="middle" font-size="14" fill="#000">反应前</text>
            <text x="550" y="325" text-anchor="middle" font-size="14" fill="#000">反应后</text>

            <!-- 步骤2：化学式标签 -->
            <g id="scene1-formulas" class="scene1-step-el" data-step="2">
                <text x="150" y="275" text-anchor="middle" font-size="16" fill="#1565c0" font-weight="bold">CH₄</text>
                <text x="250" y="275" text-anchor="middle" font-size="16" fill="#1565c0" font-weight="bold">H₂O</text>
                <text x="540" y="275" text-anchor="middle" font-size="16" fill="#1565c0" font-weight="bold">CO</text>
                <text x="620" y="275" text-anchor="middle" font-size="16" fill="#1565c0" font-weight="bold">H₂</text>
            </g>

            <!-- 步骤2：虚线框 -->
            <g id="scene1-dashed-boxes" class="scene1-step-el" data-step="2">
                <rect x="105" y="90" width="90" height="90" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
                <rect x="215" y="95" width="70" height="80" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
                <rect x="505" y="115" width="70" height="45" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
                <rect x="605" y="105" width="30" height="55" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
            </g>

            <!-- 步骤3：原子计数表格 -->
            <g id="scene1-table-group" data-step="3">
                <!-- 表格边框线 -->
                <line x1="220" y1="340" x2="580" y2="340" stroke="#000" stroke-width="1"/>
                <line x1="220" y1="360" x2="580" y2="360" stroke="#000" stroke-width="1"/>
                <line x1="220" y1="380" x2="580" y2="380" stroke="#000" stroke-width="1"/>
                <line x1="220" y1="400" x2="580" y2="400" stroke="#000" stroke-width="1"/>
                <line x1="220" y1="420" x2="580" y2="420" stroke="#000" stroke-width="1"/>
                <line x1="220" y1="340" x2="220" y2="420" stroke="#000" stroke-width="1"/>
                <line x1="320" y1="340" x2="320" y2="420" stroke="#000" stroke-width="1"/>
                <line x1="440" y1="340" x2="440" y2="420" stroke="#000" stroke-width="1"/>
                <line x1="580" y1="340" x2="580" y2="420" stroke="#000" stroke-width="1"/>
                <!-- 表头 -->
                <text x="270" y="355" text-anchor="middle" font-size="13" fill="#000">原子种类</text>
                <text x="380" y="355" text-anchor="middle" font-size="13" fill="#000">反应前数目</text>
                <text x="510" y="355" text-anchor="middle" font-size="13" fill="#000">反应后数目</text>
                <!-- C行 -->
                <text x="270" y="375" text-anchor="middle" font-size="14" fill="#000">C</text>
                <text x="380" y="375" text-anchor="middle" font-size="14" fill="#000" id="scene1-table-c-before">1</text>
                <text x="510" y="375" text-anchor="middle" font-size="14" fill="#000" id="scene1-table-c-after">1</text>
                <!-- H行 -->
                <text x="270" y="395" text-anchor="middle" font-size="14" fill="#000">H</text>
                <text x="380" y="395" text-anchor="middle" font-size="14" fill="#000" id="scene1-table-h-before">6</text>
                <text x="510" y="395" text-anchor="middle" font-size="14" fill="#000" id="scene1-table-h-after">2</text>
                <!-- O行 -->
                <text x="270" y="415" text-anchor="middle" font-size="14" fill="#000">O</text>
                <text x="380" y="415" text-anchor="middle" font-size="14" fill="#000" id="scene1-table-o-before">1</text>
                <text x="510" y="415" text-anchor="middle" font-size="14" fill="#000" id="scene1-table-o-after">1</text>
                <!-- 不等式提示 -->
                <text x="600" y="395" text-anchor="start" font-size="16" fill="#c62828" font-weight="bold" id="scene1-inequality">2≠6</text>
            </g>

            <!-- 步骤4：补充虚线H₂分子 -->
            <g id="scene1-extra-h2" class="scene1-step-el" data-step="4">
                <line x1="620" y1="155" x2="620" y2="185" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
                <circle cx="620" cy="155" r="10" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
                <circle cx="620" cy="185" r="10" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
                <line x1="620" y1="65" x2="620" y2="95" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
                <circle cx="620" cy="65" r="10" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
                <circle cx="620" cy="95" r="10" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
            </g>

            <!-- 步骤4：配平方程式 -->
            <g id="scene1-equation" class="scene1-step-el" data-step="4">
                <text x="400" y="450" text-anchor="middle" font-size="14" fill="#000" font-weight="bold">CH₄ + H₂O →(高温) CO + 3H₂</text>
            </g>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 0/4</span>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const totalSteps = 4;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');

        const formulas = document.getElementById('scene1-formulas');
        const dashedBoxes = document.getElementById('scene1-dashed-boxes');
        const tableGroup = document.getElementById('scene1-table-group');
        const extraH2 = document.getElementById('scene1-extra-h2');
        const equation = document.getElementById('scene1-equation');

        const hAfterEl = document.getElementById('scene1-table-h-after');
        const inequalityEl = document.getElementById('scene1-inequality');
        const cBeforeEl = document.getElementById('scene1-table-c-before');
        const cAfterEl = document.getElementById('scene1-table-c-after');
        const hBeforeEl = document.getElementById('scene1-table-h-before');
        const oBeforeEl = document.getElementById('scene1-table-o-before');
        const oAfterEl = document.getElementById('scene1-table-o-after');

        const hAtoms = document.querySelectorAll('.scene1-atom-h');
        const oAtoms = document.querySelectorAll('.scene1-atom-o');
        const cAtoms = document.querySelectorAll('.scene1-atom-c');

        function showEl(el) {
            if (!el) return;
            el.style.display = 'block';
            void el.offsetWidth;
            el.classList.add('active');
        }

        function hideEl(el) {
            if (!el) return;
            el.classList.remove('active');
            el.style.display = 'none';
        }

        function updateUI() {
            stepIndicator.textContent = '步骤 ' + currentStep + '/' + totalSteps;
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps;

            hideEl(formulas);
            hideEl(dashedBoxes);
            hideEl(tableGroup);
            hideEl(extraH2);
            hideEl(equation);

            hAtoms.forEach(el => el.classList.remove('scene1-highlight-blue', 'scene1-flash-anim'));
            oAtoms.forEach(el => el.classList.remove('scene1-highlight-blue', 'scene1-flash-anim'));
            cAtoms.forEach(el => el.classList.remove('scene1-highlight-blue', 'scene1-flash-anim'));

            hAfterEl.setAttribute('fill', '#000');
            hAfterEl.textContent = '2';
            inequalityEl.textContent = '2≠6';
            inequalityEl.setAttribute('fill', '#c62828');
            [cBeforeEl, cAfterEl, hBeforeEl, oBeforeEl, oAfterEl].forEach(el => el.setAttribute('fill', '#000'));

            if (currentStep >= 2) {
                showEl(formulas);
                showEl(dashedBoxes);
            }
            if (currentStep >= 3) {
                showEl(tableGroup);
                hAfterEl.setAttribute('fill', '#c62828');
            }
            if (currentStep >= 4) {
                showEl(extraH2);
                showEl(equation);
                hAfterEl.textContent = '6';
                hAfterEl.setAttribute('fill', '#2e7d32');
                inequalityEl.textContent = '';
                [cBeforeEl, cAfterEl, hBeforeEl, oBeforeEl, oAfterEl].forEach(el => el.setAttribute('fill', '#2e7d32'));
            }

            if (currentStep === 1) {
                runFlashAnimation();
            }
        }

        function runFlashAnimation() {
            const groups = [hAtoms, oAtoms, cAtoms];
            let groupIndex = 0;

            function flashNextGroup() {
                if (groupIndex >= groups.length) {
                    hAtoms.forEach(el => el.classList.add('scene1-highlight-blue'));
                    oAtoms.forEach(el => el.classList.add('scene1-highlight-blue'));
                    cAtoms.forEach(el => el.classList.add('scene1-highlight-blue'));
                    return;
                }
                const group = groups[groupIndex];
                group.forEach(el => el.classList.add('scene1-flash-anim'));
                setTimeout(() => {
                    group.forEach(el => el.classList.remove('scene1-flash-anim'));
                    groupIndex++;
                    setTimeout(flashNextGroup, 200);
                }, 1200);
            }

            flashNextGroup();
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateUI();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateUI();
            }
        });

        updateUI();
    })();
    </script>
</body>
</html>
