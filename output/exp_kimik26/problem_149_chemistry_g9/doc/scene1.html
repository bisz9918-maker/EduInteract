<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>化学反应微观模拟</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            padding: 6px 16px; font-size: 13px; border: 1px solid #1565c0;
            background: #e3f2fd; color: #1565c0; border-radius: 4px; cursor: pointer;
            transition: all 0.2s; min-width: 80px;
        }
        #scene1-controls button:hover:not(:disabled) { background: #1565c0; color: #fff; }
        #scene1-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene1-step-dots { display: flex; gap: 6px; align-items: center; }
        .scene1-dot { width: 8px; height: 8px; border-radius: 50%; background: #e0e0e0; transition: background 0.3s; }
        .scene1-dot.active { background: #1565c0; }
        #scene1-step-desc { position: absolute; bottom: 48px; left: 0; right: 0; text-align: center; font-size: 12px; color: #666; }

        /* 动画类 */
        .scene1-highlight { filter: url(#scene1-glow); }
        .scene1-dimmed { opacity: 0.3; }
        .scene1-dimmed-stroke { stroke: #888888; stroke-dasharray: 4,4; }
        .scene1-pulse { animation: scene1-pulse-anim 1s ease-in-out 2; }
        @keyframes scene1-pulse-anim {
            0%, 100% { filter: url(#scene1-glow); }
            50% { filter: url(#scene1-glow-strong); }
        }
        .scene1-fade-in { animation: scene1-fade-in-anim 0.3s ease forwards; }
        @keyframes scene1-fade-in-anim { from { opacity: 0; } to { opacity: 1; } }

        /* 分子移动过渡 */
        .scene1-movable { transition: transform 0.5s ease-out; }
        .scene1-bond { transition: opacity 0.3s ease; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <defs>
                <!-- 发光滤镜 -->
                <filter id="scene1-glow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="3" result="blur"/>
                    <feMerge>
                        <feMergeNode in="blur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
                <filter id="scene1-glow-strong" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="6" result="blur"/>
                    <feMerge>
                        <feMergeNode in="blur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
                <!-- 箭头标记 -->
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
                </marker>
            </defs>

            <!-- ========== 公共元素（始终显示） ========== -->
            <g id="scene1-common">
                <!-- 原子图例 - 水平排列，标签在圆圈右侧，避免重叠 -->
                <circle cx="40" cy="25" r="10" fill="#1565c0" stroke="#000" stroke-width="1.5"/>
                <text x="75" y="30" text-anchor="middle" font-size="14" fill="#333">a原子</text>
                <circle cx="120" cy="25" r="16" fill="#2e7d32" stroke="#000" stroke-width="1.5"/>
                <text x="158" y="30" text-anchor="middle" font-size="14" fill="#333">b原子</text>
                <circle cx="220" cy="25" r="22" fill="#c62828" stroke="#000" stroke-width="1.5"/>
                <text x="265" y="30" text-anchor="middle" font-size="14" fill="#333">c原子</text>
            </g>

            <!-- ========== 步骤提示文字 ========== -->
            <g id="scene1-step-hint-group">
                <text id="scene1-step-hint" x="400" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565c0"></text>
            </g>

            <!-- ========== 步骤0-1,5-6: 图甲和图乙主容器 ========== -->
            <g id="scene1-main-view">
                <!-- 图甲容器 -->
                <rect id="scene1-jia-box" x="50" y="95" width="280" height="200" rx="4" fill="none" stroke="#000" stroke-width="2"/>
                <text id="scene1-jia-label" x="190" y="325" text-anchor="middle" font-size="16" fill="#333">甲</text>

                <!-- 图甲-bc分子1 -->
                <g id="scene1-jia-bc1">
                    <line x1="150" y1="150" x2="190" y2="150" stroke="#000" stroke-width="2"/>
                    <circle cx="150" cy="150" r="16" fill="#2e7d32" stroke="#000" stroke-width="1.5"/>
                    <circle cx="190" cy="150" r="22" fill="#c62828" stroke="#000" stroke-width="1.5"/>
                </g>
                <!-- 图甲-bc分子2 -->
                <g id="scene1-jia-bc2">
                    <line x1="150" y1="230" x2="190" y2="230" stroke="#000" stroke-width="2"/>
                    <circle cx="150" cy="230" r="16" fill="#2e7d32" stroke="#000" stroke-width="1.5"/>
                    <circle cx="190" cy="230" r="22" fill="#c62828" stroke="#000" stroke-width="1.5"/>
                </g>
                <!-- 图甲-a₂分子1 -->
                <g id="scene1-jia-a2-1">
                    <line x1="90" y1="140" x2="110" y2="140" stroke="#000" stroke-width="2"/>
                    <circle cx="90" cy="140" r="10" fill="#1565c0" stroke="#000" stroke-width="1.5"/>
                    <circle cx="110" cy="140" r="10" fill="#1565c0" stroke="#000" stroke-width="1.5"/>
                </g>
                <!-- 图甲-a₂分子2 -->
                <g id="scene1-jia-a2-2">
                    <line x1="90" y1="240" x2="110" y2="240" stroke="#000" stroke-width="2"/>
                    <circle cx="90" cy="240" r="10" fill="#1565c0" stroke="#000" stroke-width="1.5"/>
                    <circle cx="110" cy="240" r="10" fill="#1565c0" stroke="#000" stroke-width="1.5"/>
                </g>
                <!-- 图甲-a₂分子3 -->
                <g id="scene1-jia-a2-3">
                    <line x1="230" y1="140" x2="250" y2="140" stroke="#000" stroke-width="2"/>
                    <circle cx="230" cy="140" r="10" fill="#1565c0" stroke="#000" stroke-width="1.5"/>
                    <circle cx="250" cy="140" r="10" fill="#1565c0" stroke="#000" stroke-width="1.5"/>
                </g>
                <!-- 图甲-a₂分子4 -->
                <g id="scene1-jia-a2-4">
                    <line x1="230" y1="240" x2="250" y2="240" stroke="#000" stroke-width="2"/>
                    <circle cx="230" cy="240" r="10" fill="#1565c0" stroke="#000" stroke-width="1.5"/>
                    <circle cx="250" cy="240" r="10" fill="#1565c0" stroke="#000" stroke-width="1.5"/>
                </g>

                <!-- 图甲→图乙箭头 -->
                <g id="scene1-arrow-group">
                    <line x1="350" y1="195" x2="450" y2="195" stroke="#000" stroke-width="3" marker-end="url(#scene1-arrowhead)"/>
                </g>

                <!-- 图乙容器 -->
                <rect id="scene1-yi-box" x="470" y="95" width="280" height="200" rx="4" fill="none" stroke="#000" stroke-width="2"/>
                <text id="scene1-yi-label" x="610" y="325" text-anchor="middle" font-size="16" fill="#333">乙</text>

                <!-- 图乙-a₂c分子1 -->
                <g id="scene1-yi-a2c1">
                    <line x1="610" y1="110" x2="590" y2="130" stroke="#000" stroke-width="2"/>
                    <line x1="610" y1="110" x2="630" y2="130" stroke="#000" stroke-width="2"/>
                    <circle cx="610" cy="110" r="22" fill="#c62828" stroke="#000" stroke-width="1.5"/>
                    <circle cx="590" cy="130" r="10" fill="#1565c0" stroke="#000" stroke-width="1.5"/>
                    <circle cx="630" cy="130" r="10" fill="#1565c0" stroke="#000" stroke-width="1.5"/>
                </g>
                <!-- 图乙-a₂c分子2 -->
                <g id="scene1-yi-a2c2">
                    <line x1="610" y1="165" x2="590" y2="185" stroke="#000" stroke-width="2"/>
                    <line x1="610" y1="165" x2="630" y2="185" stroke="#000" stroke-width="2"/>
                    <circle cx="610" cy="165" r="22" fill="#c62828" stroke="#000" stroke-width="1.5"/>
                    <circle cx="590" cy="185" r="10" fill="#1565c0" stroke="#000" stroke-width="1.5"/>
                    <circle cx="630" cy="185" r="10" fill="#1565c0" stroke="#000" stroke-width="1.5"/>
                </g>
                <!-- 图乙-b原子1 -->
                <g id="scene1-yi-b1">
                    <circle cx="570" cy="215" r="16" fill="#2e7d32" stroke="#000" stroke-width="1.5"/>
                </g>
                <!-- 图乙-b原子2 -->
                <g id="scene1-yi-b2">
                    <circle cx="650" cy="215" r="16" fill="#2e7d32" stroke="#000" stroke-width="1.5"/>
                </g>
                <!-- 图乙-剩余a₂分子1 -->
                <g id="scene1-yi-a2-rem1">
                    <line x1="590" y1="255" x2="610" y2="255" stroke="#000" stroke-width="2"/>
                    <circle cx="590" cy="255" r="10" fill="#1565c0" stroke="#000" stroke-width="1.5"/>
                    <circle cx="610" cy="255" r="10" fill="#1565c0" stroke="#000" stroke-width="1.5"/>
                </g>
                <!-- 图乙-剩余a₂分子2 -->
                <g id="scene1-yi-a2-rem2">
                    <line x1="590" y1="280" x2="610" y2="280" stroke="#000" stroke-width="2"/>
                    <circle cx="590" cy="280" r="10" fill="#1565c0" stroke="#000" stroke-width="1.5"/>
                    <circle cx="610" cy="280" r="10" fill="#1565c0" stroke="#000" stroke-width="1.5"/>
                </g>
            </g>

            <!-- ========== 步骤1: 数量标签（放在图甲右侧外侧） ========== -->
            <g id="scene1-step1-labels" style="display:none">
                <text x="340" y="125" font-size="13" fill="#333">2个 bc 分子</text>
                <text x="340" y="160" font-size="13" fill="#333">4个 a₂ 分子</text>
            </g>

            <!-- ========== 步骤5-6: 图乙标签（放在图乙左侧外侧） ========== -->
            <g id="scene1-step5-labels" style="display:none">
                <text x="460" y="120" text-anchor="end" font-size="13" fill="#333">2个 a₂c 分子</text>
                <text x="460" y="150" text-anchor="end" font-size="13" fill="#333">2个 b 原子</text>
                <text x="460" y="180" text-anchor="end" font-size="13" fill="#888">2个 a₂ 分子（剩余）</text>
            </g>

            <!-- ========== 步骤6: 结论标签 ========== -->
            <g id="scene1-step6-conclusion" style="display:none">
                <text x="400" y="75" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e7d32">反应生成的粒子：a₂c、b，共2种</text>
            </g>

            <!-- ========== 步骤2-4: 中央动画区 ========== -->
            <g id="scene1-animate-area" style="display:none">
                <!-- 中央区边框 -->
                <rect x="150" y="110" width="500" height="220" rx="4" fill="none" stroke="#1565c0" stroke-width="2" stroke-dasharray="6,4"/>

                <!-- 左侧缩略图甲 -->
                <g id="scene1-thumb-jia" transform="translate(30,150) scale(0.35)">
                    <rect x="0" y="0" width="280" height="200" rx="4" fill="none" stroke="#000" stroke-width="4"/>
                    <!-- bc1 -->
                    <line x1="150" y1="60" x2="190" y2="60" stroke="#000" stroke-width="4"/>
                    <circle cx="150" cy="60" r="16" fill="#2e7d32" stroke="#000" stroke-width="3"/>
                    <circle cx="190" cy="60" r="22" fill="#c62828" stroke="#000" stroke-width="3"/>
                    <!-- bc2 -->
                    <line x1="150" y1="140" x2="190" y2="140" stroke="#000" stroke-width="4"/>
                    <circle cx="150" cy="140" r="16" fill="#2e7d32" stroke="#000" stroke-width="3"/>
                    <circle cx="190" cy="140" r="22" fill="#c62828" stroke="#000" stroke-width="3"/>
                    <!-- a2-1 -->
                    <line x1="90" y1="50" x2="110" y2="50" stroke="#000" stroke-width="4"/>
                    <circle cx="90" cy="50" r="10" fill="#1565c0" stroke="#000" stroke-width="3"/>
                    <circle cx="110" cy="50" r="10" fill="#1565c0" stroke="#000" stroke-width="3"/>
                    <!-- a2-2 -->
                    <line x1="90" y1="150" x2="110" y2="150" stroke="#000" stroke-width="4"/>
                    <circle cx="90" cy="150" r="10" fill="#1565c0" stroke="#000" stroke-width="3"/>
                    <circle cx="110" cy="150" r="10" fill="#1565c0" stroke="#000" stroke-width="3"/>
                    <!-- a2-3 -->
                    <line x1="230" y1="50" x2="250" y2="50" stroke="#000" stroke-width="4"/>
                    <circle cx="230" cy="50" r="10" fill="#1565c0" stroke="#000" stroke-width="3"/>
                    <circle cx="250" cy="50" r="10" fill="#1565c0" stroke="#000" stroke-width="3"/>
                    <!-- a2-4 -->
                    <line x1="230" y1="150" x2="250" y2="150" stroke="#000" stroke-width="4"/>
                    <circle cx="230" cy="150" r="10" fill="#1565c0" stroke="#000" stroke-width="3"/>
                    <circle cx="250" cy="150" r="10" fill="#1565c0" stroke="#000" stroke-width="3"/>
                </g>

                <!-- 右侧缩略图乙 -->
                <g id="scene1-thumb-yi" transform="translate(670,150) scale(0.35)">
                    <rect x="0" y="0" width="280" height="200" rx="4" fill="none" stroke="#000" stroke-width="4"/>
                    <!-- a2c1 -->
                    <line x1="140" y1="20" x2="120" y2="40" stroke="#000" stroke-width="4"/>
                    <line x1="140" y1="20" x2="160" y2="40" stroke="#000" stroke-width="4"/>
                    <circle cx="140" cy="20" r="22" fill="#c62828" stroke="#000" stroke-width="3"/>
                    <circle cx="120" cy="40" r="10" fill="#1565c0" stroke="#000" stroke-width="3"/>
                    <circle cx="160" cy="40" r="10" fill="#1565c0" stroke="#000" stroke-width="3"/>
                    <!-- a2c2 -->
                    <line x1="140" y1="75" x2="120" y2="95" stroke="#000" stroke-width="4"/>
                    <line x1="140" y1="75" x2="160" y2="95" stroke="#000" stroke-width="4"/>
                    <circle cx="140" cy="75" r="22" fill="#c62828" stroke="#000" stroke-width="3"/>
                    <circle cx="120" cy="95" r="10" fill="#1565c0" stroke="#000" stroke-width="3"/>
                    <circle cx="160" cy="95" r="10" fill="#1565c0" stroke="#000" stroke-width="3"/>
                    <!-- b1 -->
                    <circle cx="100" cy="125" r="16" fill="#2e7d32" stroke="#000" stroke-width="3"/>
                    <!-- b2 -->
                    <circle cx="180" cy="125" r="16" fill="#2e7d32" stroke="#000" stroke-width="3"/>
                    <!-- rem a2-1 -->
                    <line x1="120" y1="165" x2="140" y2="165" stroke="#000" stroke-width="4"/>
                    <circle cx="120" cy="165" r="10" fill="#1565c0" stroke="#000" stroke-width="3"/>
                    <circle cx="140" cy="165" r="10" fill="#1565c0" stroke="#000" stroke-width="3"/>
                    <!-- rem a2-2 -->
                    <line x1="120" y1="190" x2="140" y2="190" stroke="#000" stroke-width="4"/>
                    <circle cx="120" cy="190" r="10" fill="#1565c0" stroke="#000" stroke-width="3"/>
                    <circle cx="140" cy="190" r="10" fill="#1565c0" stroke="#000" stroke-width="3"/>
                </g>

                <!-- 步骤2: 参与反应的分子 -->
                <g id="scene1-step2-molecules" style="display:none">
                    <!-- bc分子1 -->
                    <g class="scene1-movable" id="scene1-anim-bc1">
                        <line class="scene1-bond" x1="280" y1="190" x2="320" y2="190" stroke="#000" stroke-width="2"/>
                        <circle cx="280" cy="190" r="16" fill="#2e7d32" stroke="#000" stroke-width="1.5"/>
                        <circle cx="320" cy="190" r="22" fill="#c62828" stroke="#000" stroke-width="1.5"/>
                    </g>
                    <!-- bc分子2 -->
                    <g class="scene1-movable" id="scene1-anim-bc2">
                        <line class="scene1-bond" x1="280" y1="250" x2="320" y2="250" stroke="#000" stroke-width="2"/>
                        <circle cx="280" cy="250" r="16" fill="#2e7d32" stroke="#000" stroke-width="1.5"/>
                        <circle cx="320" cy="250" r="22" fill="#c62828" stroke="#000" stroke-width="1.5"/>
                    </g>
                    <!-- a₂分子1 -->
                    <g class="scene1-movable" id="scene1-anim-a2-1">
                        <line class="scene1-bond" x1="380" y1="190" x2="400" y2="190" stroke="#000" stroke-width="2"/>
                        <circle cx="380" cy="190" r="10" fill="#1565c0" stroke="#000" stroke-width="1.5"/>
                        <circle cx="400" cy="190" r="10" fill="#1565c0" stroke="#000" stroke-width="1.5"/>
                    </g>
                    <!-- a₂分子2 -->
                    <g class="scene1-movable" id="scene1-anim-a2-2">
                        <line class="scene1-bond" x1="380" y1="250" x2="400" y2="250" stroke="#000" stroke-width="2"/>
                        <circle cx="380" cy="250" r="10" fill="#1565c0" stroke="#000" stroke-width="1.5"/>
                        <circle cx="400" cy="250" r="10" fill="#1565c0" stroke="#000" stroke-width="1.5"/>
                    </g>
                </g>

                <!-- 步骤3: 独立原子（键断裂后） -->
                <g id="scene1-step3-atoms" style="display:none">
                    <!-- 2个b原子 -->
                    <circle cx="280" cy="190" r="16" fill="#2e7d32" stroke="#000" stroke-width="1.5"/>
                    <circle cx="280" cy="250" r="16" fill="#2e7d32" stroke="#000" stroke-width="1.5"/>
                    <!-- 2个c原子 -->
                    <circle cx="340" cy="190" r="22" fill="#c62828" stroke="#000" stroke-width="1.5"/>
                    <circle cx="340" cy="250" r="22" fill="#c62828" stroke="#000" stroke-width="1.5"/>
                    <!-- 4个a原子 -->
                    <circle cx="400" cy="170" r="10" fill="#1565c0" stroke="#000" stroke-width="1.5"/>
                    <circle cx="420" cy="170" r="10" fill="#1565c0" stroke="#000" stroke-width="1.5"/>
                    <circle cx="400" cy="230" r="10" fill="#1565c0" stroke="#000" stroke-width="1.5"/>
                    <circle cx="420" cy="230" r="10" fill="#1565c0" stroke="#000" stroke-width="1.5"/>
                    <!-- 标注 -->
                    <text x="400" y="360" text-anchor="middle" font-size="14" fill="#1565c0">化学反应中，原子种类和数目不变</text>
                </g>

                <!-- 步骤4: 重组分子 -->
                <g id="scene1-step4-reform" style="display:none">
                    <!-- a₂c分子1 -->
                    <g id="scene1-reform-a2c1">
                        <line class="scene1-bond" x1="340" y1="170" x2="320" y2="190" stroke="#000" stroke-width="2"/>
                        <line class="scene1-bond" x1="340" y1="170" x2="360" y2="190" stroke="#000" stroke-width="2"/>
                        <circle cx="340" cy="170" r="22" fill="#c62828" stroke="#000" stroke-width="1.5"/>
                        <circle cx="320" cy="190" r="10" fill="#1565c0" stroke="#000" stroke-width="1.5"/>
                        <circle cx="360" cy="190" r="10" fill="#1565c0" stroke="#000" stroke-width="1.5"/>
                    </g>
                    <!-- a₂c分子2 -->
                    <g id="scene1-reform-a2c2">
                        <line class="scene1-bond" x1="340" y1="250" x2="320" y2="270" stroke="#000" stroke-width="2"/>
                        <line class="scene1-bond" x1="340" y1="250" x2="360" y2="270" stroke="#000" stroke-width="2"/>
                        <circle cx="340" cy="250" r="22" fill="#c62828" stroke="#000" stroke-width="1.5"/>
                        <circle cx="320" cy="270" r="10" fill="#1565c0" stroke="#000" stroke-width="1.5"/>
                        <circle cx="360" cy="270" r="10" fill="#1565c0" stroke="#000" stroke-width="1.5"/>
                    </g>
                    <!-- b原子1 -->
                    <circle cx="280" cy="190" r="16" fill="#2e7d32" stroke="#000" stroke-width="1.5"/>
                    <!-- b原子2 -->
                    <circle cx="280" cy="250" r="16" fill="#2e7d32" stroke="#000" stroke-width="1.5"/>
                </g>
            </g>

            <!-- ========== 步骤7: 反应类型判断 ========== -->
            <g id="scene1-step7-panel" style="display:none">
                <!-- 左栏标题 -->
                <text x="200" y="120" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565c0">反应物</text>
                <!-- 示例a₂ -->
                <g transform="translate(100,170)">
                    <line x1="0" y1="0" x2="30" y2="0" stroke="#000" stroke-width="2"/>
                    <circle cx="0" cy="0" r="10" fill="#1565c0" stroke="#000" stroke-width="1.5"/>
                    <circle cx="30" cy="0" r="10" fill="#1565c0" stroke="#000" stroke-width="1.5"/>
                </g>
                <text x="115" y="205" text-anchor="middle" font-size="13" fill="#333">a₂（单质）</text>
                <!-- 示例bc -->
                <g transform="translate(100,260)">
                    <line x1="0" y1="0" x2="40" y2="0" stroke="#000" stroke-width="2"/>
                    <circle cx="0" cy="0" r="16" fill="#2e7d32" stroke="#000" stroke-width="1.5"/>
                    <circle cx="40" cy="0" r="22" fill="#c62828" stroke="#000" stroke-width="1.5"/>
                </g>
                <text x="120" y="300" text-anchor="middle" font-size="13" fill="#333">bc（化合物）</text>

                <!-- 右栏标题 -->
                <text x="600" y="120" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565c0">生成物</text>
                <!-- 示例b -->
                <circle cx="520" cy="170" r="16" fill="#2e7d32" stroke="#000" stroke-width="1.5"/>
                <text x="520" y="205" text-anchor="middle" font-size="13" fill="#333">b（单质）</text>
                <!-- 示例a₂c -->
                <g transform="translate(520,260)">
                    <line x1="0" y1="0" x2="-20" y2="20" stroke="#000" stroke-width="2"/>
                    <line x1="0" y1="0" x2="20" y2="20" stroke="#000" stroke-width="2"/>
                    <circle cx="0" cy="0" r="22" fill="#c62828" stroke="#000" stroke-width="1.5"/>
                    <circle cx="-20" cy="20" r="10" fill="#1565c0" stroke="#000" stroke-width="1.5"/>
                    <circle cx="20" cy="20" r="10" fill="#1565c0" stroke="#000" stroke-width="1.5"/>
                </g>
                <text x="520" y="305" text-anchor="middle" font-size="13" fill="#333">a₂c（化合物）</text>

                <!-- 中间特征 -->
                <text x="400" y="185" text-anchor="middle" font-size="14" fill="#333">单质 + 化合物</text>
                <text x="400" y="230" text-anchor="middle" font-size="20" font-weight="bold" fill="#1565c0">→</text>
                <text x="400" y="275" text-anchor="middle" font-size="14" fill="#333">新单质 + 新化合物</text>

                <!-- 结论 -->
                <text x="400" y="350" text-anchor="middle" font-size="22" font-weight="bold" fill="#2e7d32">置换反应</text>
            </g>

            <!-- ========== 步骤8: 化学方程式 ========== -->
            <g id="scene1-step8-equation" style="display:none">
                <text x="400" y="150" text-anchor="middle" font-size="18" font-family="monospace" fill="#333">2bc + 2a₂ → 2a₂c + 2b</text>
                <text x="400" y="195" text-anchor="middle" font-size="14" fill="#666">抽象模型</text>

                <text x="400" y="280" text-anchor="middle" font-size="18" font-family="monospace" fill="#333">H₂ + CuO → H₂O + Cu</text>
                <text x="470" y="235" text-anchor="middle" font-size="12" fill="#666">△</text>
                <text x="400" y="325" text-anchor="middle" font-size="14" fill="#666">具体实例</text>

                <text x="400" y="380" text-anchor="middle" font-size="14" fill="#666">
                    <tspan fill="#1565c0">蓝色=a(H)</tspan>   <tspan fill="#2e7d32">绿色=b(Cu)</tspan>   <tspan fill="#c62828">红色=c(O)</tspan>
                </text>
            </g>
        </svg>

        <!-- 控件栏 -->
        <div id="scene1-step-desc">步骤0：观察反应前后的微观示意图</div>
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <div id="scene1-step-dots"></div>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        var currentStep = 0;
        var totalSteps = 9; // 0-8
        var stepHints = [
            "步骤0：观察反应前后的微观示意图",
            "步骤1：统计反应前的粒子种类和数量",
            "步骤2：判断实际参与反应的粒子——2个bc分子和2个a₂分子参与反应，剩余2个a₂分子未反应",
            "步骤3：化学键断裂，分子拆分为原子——原子是化学变化中的最小粒子",
            "步骤4：原子重新组合，形成新的分子——2个a₂c分子和2个b原子",
            "步骤5：分析反应后的粒子——区分生成物与剩余反应物",
            "步骤6：回答问题（1）——反应生成的粒子有2种",
            "步骤7：判断反应类型——单质与化合物反应生成新单质和新化合物，属于置换反应",
            "步骤8：书写化学方程式——抽象模型与具体反应的对应关系"
        ];

        var btnPrev = document.getElementById('scene1-btn-prev');
        var btnNext = document.getElementById('scene1-btn-next');
        var stepDesc = document.getElementById('scene1-step-desc');
        var stepHint = document.getElementById('scene1-step-hint');
        var stepHintGroup = document.getElementById('scene1-step-hint-group');
        var dotsContainer = document.getElementById('scene1-step-dots');

        // 创建步骤指示器
        for (var i = 0; i < totalSteps; i++) {
            var dot = document.createElement('span');
            dot.className = 'scene1-dot' + (i === 0 ? ' active' : '');
            dotsContainer.appendChild(dot);
        }

        // 元素引用
        var mainView = document.getElementById('scene1-main-view');
        var step1Labels = document.getElementById('scene1-step1-labels');
        var step5Labels = document.getElementById('scene1-step5-labels');
        var step6Conclusion = document.getElementById('scene1-step6-conclusion');
        var animateArea = document.getElementById('scene1-animate-area');
        var step2Molecules = document.getElementById('scene1-step2-molecules');
        var step3Atoms = document.getElementById('scene1-step3-atoms');
        var step4Reform = document.getElementById('scene1-step4-reform');
        var step7Panel = document.getElementById('scene1-step7-panel');
        var step8Equation = document.getElementById('scene1-step8-equation');
        var arrowGroup = document.getElementById('scene1-arrow-group');

        // 图甲图乙中的具体元素
        var jiaBc1 = document.getElementById('scene1-jia-bc1');
        var jiaBc2 = document.getElementById('scene1-jia-bc2');
        var jiaA2_1 = document.getElementById('scene1-jia-a2-1');
        var jiaA2_2 = document.getElementById('scene1-jia-a2-2');
        var jiaA2_3 = document.getElementById('scene1-jia-a2-3');
        var jiaA2_4 = document.getElementById('scene1-jia-a2-4');
        var yiA2c1 = document.getElementById('scene1-yi-a2c1');
        var yiA2c2 = document.getElementById('scene1-yi-a2c2');
        var yiB1 = document.getElementById('scene1-yi-b1');
        var yiB2 = document.getElementById('scene1-yi-b2');
        var yiA2Rem1 = document.getElementById('scene1-yi-a2-rem1');
        var yiA2Rem2 = document.getElementById('scene1-yi-a2-rem2');

        function setDisplay(el, show) {
            if (!el) return;
            el.style.display = show ? 'block' : 'none';
        }

        function setOpacity(el, val) {
            if (!el) return;
            el.style.opacity = val;
        }

        function addClass(el, cls) {
            if (!el) return;
            el.classList.add(cls);
        }

        function removeClass(el, cls) {
            if (!el) return;
            el.classList.remove(cls);
        }

        function renderStep() {
            // 更新按钮状态
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps - 1;

            // 更新步骤提示
            stepDesc.textContent = stepHints[currentStep];
            stepHint.textContent = stepHints[currentStep];

            // 更新指示器
            var dots = dotsContainer.querySelectorAll('.scene1-dot');
            dots.forEach(function(d, i) {
                d.classList.toggle('active', i === currentStep);
            });

            // 清除所有高亮和动画类
            var allHighlights = document.querySelectorAll('.scene1-highlight, .scene1-pulse, .scene1-dimmed, .scene1-dimmed-stroke');
            allHighlights.forEach(function(el) {
                el.classList.remove('scene1-highlight', 'scene1-pulse', 'scene1-dimmed', 'scene1-dimmed-stroke');
            });

            // 重置所有opacity
            [jiaBc1, jiaBc2, jiaA2_1, jiaA2_2, jiaA2_3, jiaA2_4,
             yiA2c1, yiA2c2, yiB1, yiB2, yiA2Rem1, yiA2Rem2].forEach(function(el) {
                if (el) setOpacity(el, 1);
            });

            // 默认显示状态
            setDisplay(stepHintGroup, true);
            setDisplay(step1Labels, false);
            setDisplay(step5Labels, false);
            setDisplay(step6Conclusion, false);
            setDisplay(animateArea, false);
            setDisplay(step2Molecules, false);
            setDisplay(step3Atoms, false);
            setDisplay(step4Reform, false);
            setDisplay(step7Panel, false);
            setDisplay(step8Equation, false);
            setDisplay(mainView, false);
            setDisplay(arrowGroup, false);

            switch (currentStep) {
                case 0:
                    setDisplay(mainView, true);
                    setDisplay(arrowGroup, true);
                    break;

                case 1:
                    setDisplay(mainView, true);
                    setDisplay(arrowGroup, true);
                    setDisplay(step1Labels, true);
                    // 高亮图甲所有分子
                    [jiaBc1, jiaBc2, jiaA2_1, jiaA2_2, jiaA2_3, jiaA2_4].forEach(function(el) {
                        addClass(el, 'scene1-highlight');
                    });
                    break;

                case 2:
                    // 隐藏主视图，显示动画区
                    setDisplay(animateArea, true);
                    setDisplay(step2Molecules, true);
                    break;

                case 3:
                    setDisplay(animateArea, true);
                    setDisplay(step3Atoms, true);
                    break;

                case 4:
                    setDisplay(animateArea, true);
                    setDisplay(step4Reform, true);
                    // 生成物高亮
                    addClass(document.getElementById('scene1-reform-a2c1'), 'scene1-highlight');
                    addClass(document.getElementById('scene1-reform-a2c2'), 'scene1-highlight');
                    break;

                case 5:
                    setDisplay(mainView, true);
                    setDisplay(arrowGroup, true);
                    setDisplay(step5Labels, true);
                    // 生成物高亮
                    addClass(yiA2c1, 'scene1-highlight');
                    addClass(yiA2c2, 'scene1-highlight');
                    addClass(yiB1, 'scene1-highlight');
                    addClass(yiB2, 'scene1-highlight');
                    // 剩余反应物淡化
                    addClass(yiA2Rem1, 'scene1-dimmed');
                    addClass(yiA2Rem2, 'scene1-dimmed');
                    // 图甲淡化
                    [jiaBc1, jiaBc2, jiaA2_1, jiaA2_2, jiaA2_3, jiaA2_4].forEach(function(el) {
                        addClass(el, 'scene1-dimmed');
                    });
                    break;

                case 6:
                    setDisplay(mainView, true);
                    setDisplay(arrowGroup, true);
                    setDisplay(step5Labels, true);
                    setDisplay(step6Conclusion, true);
                    // 隐藏步骤提示，避免与结论重叠
                    setDisplay(stepHintGroup, false);
                    // 生成物脉冲发光
                    addClass(yiA2c1, 'scene1-pulse');
                    addClass(yiA2c2, 'scene1-pulse');
                    addClass(yiB1, 'scene1-pulse');
                    addClass(yiB2, 'scene1-pulse');
                    // 剩余反应物淡化
                    addClass(yiA2Rem1, 'scene1-dimmed');
                    addClass(yiA2Rem2, 'scene1-dimmed');
                    // 图甲淡化
                    [jiaBc1, jiaBc2, jiaA2_1, jiaA2_2, jiaA2_3, jiaA2_4].forEach(function(el) {
                        addClass(el, 'scene1-dimmed');
                    });
                    break;

                case 7:
                    setDisplay(step7Panel, true);
                    break;

                case 8:
                    setDisplay(step8Equation, true);
                    break;
            }
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                renderStep();
            }
        });

        // 初始渲染
        renderStep();
    })();
    </script>
</body>
</html>
