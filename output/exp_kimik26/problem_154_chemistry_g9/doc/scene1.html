<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scene 1 - 物质转化关系推断</title>
<style>
  body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
  #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
  #scene1-svg { position: absolute; top: 0; left: 0; z-index: 1; }
  #scene1-text-layer { position: absolute; top: 0; left: 0; width: 800px; height: 500px; z-index: 5; pointer-events: none; }
  .scene1-box-text { position: absolute; display: flex; align-items: center; justify-content: center; font-size: 16px; color: #000000; pointer-events: none; text-align: center; line-height: 1.2; }
  .scene1-reaction-label { position: absolute; display: flex; align-items: center; justify-content: center; font-size: 16px; color: #000000; pointer-events: none; text-align: center; }
  .scene1-hint { position: absolute; border: 1px dashed #888888; background: #ffffff; padding: 4px 8px; font-size: 12px; color: #888888; border-radius: 4px; pointer-events: none; white-space: nowrap; }
  #scene1-panel { position: absolute; left: 520px; top: 40px; width: 260px; height: 380px; background: #f5f5f5; border: 1px solid #e0e0e0; padding: 16px; box-sizing: border-box; z-index: 5; font-size: 14px; color: #333333; line-height: 1.6; overflow: auto; }
  #scene1-panel-title { font-size: 16px; font-weight: bold; margin-bottom: 12px; color: #1565c0; }
  #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
  #scene1-controls button { width: 90px; height: 32px; border: none; border-radius: 4px; background: #1565c0; color: #ffffff; font-size: 14px; cursor: pointer; font-family: inherit; }
  #scene1-controls button:hover { background: #0d47a1; }
  #scene1-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
  #scene1-step-indicator { font-size: 12px; color: #666666; min-width: 60px; text-align: center; }
</style>
</head>
<body>
<div id="scene1-container">
  <!-- SVG 层：仅包含图形（框轮廓、连线、箭头） -->
  <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
    <defs>
      <marker id="scene1-arrow-black" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
      </marker>
      <marker id="scene1-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828" />
      </marker>
    </defs>

    <!-- 连线层（默认黑色1.5px） -->
    <!-- 反应①输入 -->
    <path id="scene1-line-a-r1" d="M 115 70 L 150 95" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#scene1-arrow-black)" />
    <path id="scene1-line-b-r1" d="M 115 180 L 150 95" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#scene1-arrow-black)" />
    <!-- 反应②输入 -->
    <path id="scene1-line-b-r2" d="M 115 180 L 150 235" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#scene1-arrow-black)" />
    <path id="scene1-line-c-r2" d="M 115 300 L 150 235" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#scene1-arrow-black)" />
    <!-- 反应①输出 -->
    <path id="scene1-line-r1-e1" d="M 150 95 L 215 70" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#scene1-arrow-black)" />
    <path id="scene1-line-r1-d" d="M 150 95 L 150 180 L 215 180" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#scene1-arrow-black)" />
    <!-- 反应②输出 -->
    <path id="scene1-line-r2-d" d="M 150 235 L 150 180 L 215 180" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#scene1-arrow-black)" />
    <path id="scene1-line-r2-f" d="M 150 235 L 215 300" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#scene1-arrow-black)" />
    <!-- 反应③输入（A顶部绕行，F底部绕行） -->
    <path id="scene1-line-a-r3-up" d="M 115 70 L 115 30" stroke="#000000" stroke-width="1.5" fill="none" />
    <path id="scene1-line-a-r3-across" d="M 115 30 L 380 30" stroke="#000000" stroke-width="1.5" fill="none" />
    <path id="scene1-line-a-r3-down" d="M 380 30 L 380 130" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#scene1-arrow-black)" />
    <path id="scene1-line-f-r3-up" d="M 305 300 L 305 340" stroke="#000000" stroke-width="1.5" fill="none" />
    <path id="scene1-line-f-r3-across" d="M 305 340 L 380 340" stroke="#000000" stroke-width="1.5" fill="none" />
    <path id="scene1-line-f-r3-down" d="M 380 340 L 380 230" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#scene1-arrow-black)" />
    <!-- 反应③竖线 -->
    <line id="scene1-line-r3-vertical" x1="380" y1="130" x2="380" y2="230" stroke="#000000" stroke-width="1.5" />
    <!-- 反应③输出 -->
    <path id="scene1-line-r3-e2" d="M 380 130 L 415 130" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#scene1-arrow-black)" />
    <path id="scene1-line-r3-g" d="M 380 230 L 415 260" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#scene1-arrow-black)" />

    <!-- 物质框轮廓（8个） -->
    <rect id="scene1-box-a" x="25" y="49" width="90" height="42" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2" />
    <rect id="scene1-box-b" x="25" y="159" width="90" height="42" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2" />
    <rect id="scene1-box-c" x="25" y="279" width="90" height="42" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2" />
    <rect id="scene1-box-e1" x="215" y="49" width="90" height="42" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2" />
    <rect id="scene1-box-d" x="215" y="159" width="90" height="42" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2" />
    <rect id="scene1-box-f" x="215" y="279" width="90" height="42" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2" />
    <rect id="scene1-box-e2" x="415" y="109" width="90" height="42" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2" />
    <rect id="scene1-box-g" x="415" y="239" width="90" height="42" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2" />
  </svg>

  <!-- HTML 文字层：框内文字、反应编号、提示标签 -->
  <div id="scene1-text-layer">
    <!-- 框内文字 -->
    <div id="scene1-text-a" class="scene1-box-text" style="left:25px;top:49px;width:90px;height:42px;">A</div>
    <div id="scene1-text-b" class="scene1-box-text" style="left:25px;top:159px;width:90px;height:42px;">B</div>
    <div id="scene1-text-c" class="scene1-box-text" style="left:25px;top:279px;width:90px;height:42px;">C</div>
    <div id="scene1-text-e1" class="scene1-box-text" style="left:215px;top:49px;width:90px;height:42px;">E</div>
    <div id="scene1-text-d" class="scene1-box-text" style="left:215px;top:159px;width:90px;height:42px;">D</div>
    <div id="scene1-text-f" class="scene1-box-text" style="left:215px;top:279px;width:90px;height:42px;">F</div>
    <div id="scene1-text-e2" class="scene1-box-text" style="left:415px;top:109px;width:90px;height:42px;">E</div>
    <div id="scene1-text-g" class="scene1-box-text" style="left:415px;top:239px;width:90px;height:42px;">G</div>

    <!-- 反应编号 -->
    <div id="scene1-label-r1" class="scene1-reaction-label" style="left:142px;top:69px;width:32px;height:22px;">①</div>
    <div id="scene1-label-r2" class="scene1-reaction-label" style="left:142px;top:219px;width:32px;height:22px;">②</div>
    <div id="scene1-label-r3" class="scene1-reaction-label" style="left:379px;top:169px;width:32px;height:22px;">③</div>

    <!-- 步骤0提示标签 -->
    <div id="scene1-hint-b" class="scene1-hint" style="left:125px;top:165px;display:none;">最常见酸</div>
    <div id="scene1-hint-d" class="scene1-hint" style="left:315px;top:165px;display:none;">人体最多物质</div>
    <div id="scene1-hint-g" class="scene1-hint" style="left:515px;top:245px;display:none;">蓝色不溶物</div>
  </div>

  <!-- 右侧面板 -->
  <div id="scene1-panel">
    <div id="scene1-panel-title">推断提示</div>
    <div id="scene1-panel-body"></div>
  </div>

  <!-- 控件栏 -->
  <div id="scene1-controls">
    <button id="scene1-btn-prev" disabled>◀ 上一步</button>
    <span id="scene1-step-indicator">步骤 1 / 6</span>
    <button id="scene1-btn-next">下一步 ▶</button>
  </div>
</div>

<script>
(function() {
  // Scene 1 状态与配置
  let currentStep = 0;
  const totalSteps = 6;

  // 元素引用缓存
  const els = {};
  function cacheElements() {
    const ids = [
      'box-a','box-b','box-c','box-e1','box-d','box-f','box-e2','box-g',
      'text-a','text-b','text-c','text-e1','text-d','text-f','text-e2','text-g',
      'label-r1','label-r2','label-r3',
      'line-a-r1','line-b-r1','line-b-r2','line-c-r2',
      'line-r1-e1','line-r1-d','line-r2-d','line-r2-f',
      'line-a-r3-up','line-a-r3-across','line-a-r3-down',
      'line-f-r3-up','line-f-r3-across','line-f-r3-down',
      'line-r3-vertical','line-r3-e2','line-r3-g',
      'hint-b','hint-d','hint-g',
      'panel-title','panel-body',
      'btn-prev','btn-next','step-indicator'
    ];
    ids.forEach(id => {
      els[id] = document.getElementById('scene1-' + id);
    });
  }

  // 设置框内文字（支持多行，用 <br> 分隔）
  function setBoxText(boxId, html) {
    const el = els['text-' + boxId];
    if (el) el.innerHTML = html;
  }

  // 高亮框（修改 SVG rect 和 HTML text 颜色）
  function highlightBox(boxId, color) {
    const rect = els['box-' + boxId];
    const text = els['text-' + boxId];
    if (!rect || !text) return;
    if (color === 'blue') {
      rect.setAttribute('stroke', '#1565c0');
      rect.setAttribute('fill', 'rgba(21,101,192,0.15)');
      text.style.color = '#1565c0';
      text.style.fontWeight = 'bold';
    } else if (color === 'green') {
      rect.setAttribute('stroke', '#2e7d32');
      rect.setAttribute('fill', 'rgba(46,125,50,0.15)');
      text.style.color = '#2e7d32';
      text.style.fontWeight = 'bold';
    }
  }

  // 高亮连线
  function highlightLine(lineId, active) {
    const line = els['line-' + lineId];
    if (!line) return;
    if (active) {
      line.setAttribute('stroke', '#c62828');
      line.setAttribute('stroke-width', '3');
      if (line.tagName === 'path') {
        line.setAttribute('marker-end', 'url(#scene1-arrow-red)');
      }
    } else {
      line.setAttribute('stroke', '#000000');
      line.setAttribute('stroke-width', '1.5');
      if (line.tagName === 'path') {
        line.setAttribute('marker-end', 'url(#scene1-arrow-black)');
      }
    }
  }

  // 高亮反应编号
  function highlightLabel(labelId, active) {
    const label = els['label-' + labelId];
    if (!label) return;
    if (active) {
      label.style.color = '#c62828';
      label.style.fontWeight = 'bold';
      label.style.background = 'rgba(198,40,40,0.1)';
      label.style.borderRadius = '4px';
    } else {
      label.style.color = '#000000';
      label.style.fontWeight = 'normal';
      label.style.background = 'transparent';
    }
  }

  // 重置所有视觉元素到默认状态
  function resetAll() {
    const boxIds = ['a','b','c','e1','d','f','e2','g'];
    boxIds.forEach(id => {
      const rect = els['box-' + id];
      const text = els['text-' + id];
      if (rect) {
        rect.setAttribute('stroke', '#000000');
        rect.setAttribute('fill', '#ffffff');
        rect.setAttribute('stroke-width', '2');
      }
      if (text) {
        text.style.color = '#000000';
        text.style.fontWeight = 'normal';
      }
    });

    const lineIds = [
      'a-r1','b-r1','b-r2','c-r2','r1-e1','r1-d','r2-d','r2-f',
      'a-r3-up','a-r3-across','a-r3-down',
      'f-r3-up','f-r3-across','f-r3-down',
      'r3-e2','r3-g'
    ];
    lineIds.forEach(id => {
      const line = els['line-' + id];
      if (line) {
        line.setAttribute('stroke', '#000000');
        line.setAttribute('stroke-width', '1.5');
        if (line.tagName === 'path') {
          line.setAttribute('marker-end', 'url(#scene1-arrow-black)');
        }
      }
    });

    const vLine = els['line-r3-vertical'];
    if (vLine) {
      vLine.setAttribute('stroke', '#000000');
      vLine.setAttribute('stroke-width', '1.5');
    }

    ['r1','r2','r3'].forEach(id => {
      highlightLabel(id, false);
    });

    ['b','d','g'].forEach(id => {
      const hint = els['hint-' + id];
      if (hint) hint.style.display = 'none';
    });
  }

  // 更新右侧面板
  function updatePanel(title, html) {
    if (els['panel-title']) els['panel-title'].textContent = title;
    if (els['panel-body']) els['panel-body'].innerHTML = html;
  }

  // 更新按钮状态
  function updateButtons() {
    if (els['btn-prev']) els['btn-prev'].disabled = (currentStep === 0);
    if (els['btn-next']) {
      els['btn-next'].textContent = (currentStep === totalSteps - 1) ? '重新开始' : '下一步 ▶';
    }
    if (els['step-indicator']) {
      els['step-indicator'].textContent = '步骤 ' + (currentStep + 1) + ' / ' + totalSteps;
    }
  }

  // 主更新函数
  function updateScene(step) {
    resetAll();

    switch(step) {
      case 0:
        setBoxText('a', 'A');
        setBoxText('b', 'B');
        setBoxText('c', 'C');
        setBoxText('e1', 'E');
        setBoxText('d', 'D');
        setBoxText('f', 'F');
        setBoxText('e2', 'E');
        setBoxText('g', 'G');
        if (els['hint-b']) els['hint-b'].style.display = 'block';
        if (els['hint-d']) els['hint-d'].style.display = 'block';
        if (els['hint-g']) els['hint-g'].style.display = 'block';
        updatePanel('推断提示', '从特征描述找突破口<br><br>① B为最常见的酸<br>② D为人体中含量最多的物质<br>③ G为蓝色不溶物');
        break;

      case 1:
        setBoxText('a', 'A');
        setBoxText('b', 'HCl');
        setBoxText('c', 'C');
        setBoxText('e1', 'E');
        setBoxText('d', 'H₂O');
        setBoxText('f', 'F');
        setBoxText('e2', 'E');
        setBoxText('g', 'Cu(OH)₂');
        highlightBox('b', 'blue');
        highlightBox('d', 'blue');
        highlightBox('g', 'blue');
        updatePanel('突破口确定', '① 最常见酸 → <b style="color:#1565c0;">HCl</b><br>② 人体最多物质 → <b style="color:#1565c0;">H₂O</b><br>③ 蓝色不溶物 → <b style="color:#1565c0;">Cu(OH)₂</b>');
        break;

      case 2:
        setBoxText('a', '碱<br>NaOH');
        setBoxText('b', 'HCl');
        setBoxText('c', 'C');
        setBoxText('e1', 'NaCl');
        setBoxText('d', 'H₂O');
        setBoxText('f', 'F');
        setBoxText('e2', 'E');
        setBoxText('g', 'Cu(OH)₂');
        highlightBox('b', 'blue');
        highlightBox('d', 'blue');
        highlightBox('g', 'blue');
        highlightBox('a', 'green');
        highlightBox('e1', 'green');
        highlightLine('a-r1', true);
        highlightLine('b-r1', true);
        highlightLine('r1-e1', true);
        highlightLine('r1-d', true);
        highlightLabel('r1', true);
        updatePanel('反应①分析', '<b>NaOH + HCl → NaCl + H₂O</b><br><br>酸 + 碱 → 盐 + 水<br><br>A 与 B 反应生成 E 和 D，推断 A 为碱（NaOH），E 为盐（NaCl）。');
        break;

      case 3:
        setBoxText('a', '碱<br>NaOH');
        setBoxText('b', 'HCl');
        setBoxText('c', 'CuO');
        setBoxText('e1', 'NaCl');
        setBoxText('d', 'H₂O');
        setBoxText('f', 'CuCl₂');
        setBoxText('e2', 'E');
        setBoxText('g', 'Cu(OH)₂');
        highlightBox('b', 'blue');
        highlightBox('d', 'blue');
        highlightBox('g', 'blue');
        highlightBox('a', 'green');
        highlightBox('e1', 'green');
        highlightBox('c', 'green');
        highlightBox('f', 'green');
        highlightLine('b-r2', true);
        highlightLine('c-r2', true);
        highlightLine('r2-d', true);
        highlightLine('r2-f', true);
        highlightLabel('r2', true);
        updatePanel('反应②分析', '<b>CuO + 2HCl → CuCl₂ + H₂O</b><br><br>金属氧化物 + 酸 → 盐 + 水<br><br>B 与 C 反应生成 D 和 F，推断 C 为 CuO，F 为 CuCl₂。');
        break;

      case 4:
        setBoxText('a', '碱<br>NaOH');
        setBoxText('b', 'HCl');
        setBoxText('c', 'CuO');
        setBoxText('e1', 'NaCl');
        setBoxText('d', 'H₂O');
        setBoxText('f', 'CuCl₂');
        setBoxText('e2', 'NaCl');
        setBoxText('g', 'Cu(OH)₂');
        highlightBox('b', 'blue');
        highlightBox('d', 'blue');
        highlightBox('g', 'blue');
        highlightBox('a', 'green');
        highlightBox('e1', 'green');
        highlightBox('c', 'green');
        highlightBox('f', 'green');
        highlightBox('e2', 'green');
        highlightLine('a-r3-up', true);
        highlightLine('a-r3-across', true);
        highlightLine('a-r3-down', true);
        highlightLine('f-r3-up', true);
        highlightLine('f-r3-across', true);
        highlightLine('f-r3-down', true);
        highlightLine('r3-e2', true);
        highlightLine('r3-g', true);
        const vLine = els['line-r3-vertical'];
        if (vLine) {
          vLine.setAttribute('stroke', '#c62828');
          vLine.setAttribute('stroke-width', '3');
        }
        highlightLabel('r3', true);
        updatePanel('反应③验证', '<b>CuCl₂ + 2NaOH → Cu(OH)₂↓ + 2NaCl</b><br><br>两种化合物互相交换成分，生成另外两种化合物<br>→ <b style="color:#c62828;">复分解反应</b>');
        break;

      case 5:
        setBoxText('a', 'NaOH');
        setBoxText('b', 'HCl');
        setBoxText('c', 'CuO');
        setBoxText('e1', 'NaCl');
        setBoxText('d', 'H₂O');
        setBoxText('f', 'CuCl₂');
        setBoxText('e2', 'NaCl');
        setBoxText('g', 'Cu(OH)₂');
        highlightBox('b', 'blue');
        highlightBox('d', 'blue');
        highlightBox('g', 'blue');
        highlightBox('a', 'green');
        highlightBox('e1', 'green');
        highlightBox('c', 'green');
        highlightBox('f', 'green');
        highlightBox('e2', 'green');
        updatePanel('答案汇总', '（1）C 物质的化学式为 <b style="color:#2e7d32;">CuO</b><br><br>（2）反应③的基本类型是 <b style="color:#2e7d32;">复分解反应</b><br><br>（3）A 物质所属类别为 <b style="color:#2e7d32;">碱</b>');
        break;
    }

    updateButtons();
  }

  // 事件绑定
  function init() {
    cacheElements();

    if (els['btn-prev']) {
      els['btn-prev'].addEventListener('click', function() {
        if (currentStep > 0) {
          currentStep--;
          updateScene(currentStep);
        }
      });
    }

    if (els['btn-next']) {
      els['btn-next'].addEventListener('click', function() {
        if (currentStep < totalSteps - 1) {
          currentStep++;
          updateScene(currentStep);
        } else {
          currentStep = 0;
          updateScene(currentStep);
        }
      });
    }

    // 初始渲染
    updateScene(currentStep);
  }

  init();
})();
</script>
</body>
</html>
