<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三视图对比验证</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        
        /* 控件栏 */
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 30px; z-index: 10; }
        
        .scene2-btn {
            width: 80px; height: 40px; border: 1px solid #888888; border-radius: 5px;
            background: #ffffff; color: #000000; font-size: 16px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-family: inherit;
        }
        .scene2-btn.active {
            background: #1565c0; border-color: #1565c0; color: #ffffff;
        }
        
        /* 闪烁动画 */
        @keyframes scene2-blink {
            0%, 100% { stroke: #000000; stroke-width: 1.5; }
            50% { stroke: #1565c0; stroke-width: 3; }
        }
        .scene2-blink {
            animation: scene2-blink 600ms ease-in-out 1;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" style="position: absolute; top: 0; left: 0;">
            <!-- 标题 -->
            <text x="150" y="42" font-size="16" font-weight="bold" text-anchor="middle" fill="#000000">题目视图</text>
            <text x="650" y="42" font-size="16" font-weight="bold" text-anchor="middle" fill="#000000">选项视图</text>
            
            <!-- 左栏：题目视图（固定不变） -->
            <g id="scene2-left-group">
                <!-- 正面：矩形 -->
                <rect x="80" y="55" width="80" height="100" fill="none" stroke="#000000" stroke-width="1.5"/>
                <text x="120" y="175" font-size="14" text-anchor="middle" fill="#000000">正面</text>
                
                <!-- 侧面：矩形+竖线 -->
                <rect x="80" y="190" width="60" height="100" fill="none" stroke="#000000" stroke-width="1.5"/>
                <line x1="95" y1="190" x2="95" y2="290" stroke="#000000" stroke-width="1.5"/>
                <text x="110" y="310" font-size="14" text-anchor="middle" fill="#000000">侧面</text>
                
                <!-- 上面：等腰梯形 -->
                <path d="M80,385 L160,385 L140,325 L100,325 Z" fill="none" stroke="#000000" stroke-width="1.5"/>
                <text x="120" y="405" font-size="14" text-anchor="middle" fill="#000000">上面</text>
            </g>
            
            <!-- 右栏：选项视图标签（固定） -->
            <g id="scene2-right-labels">
                <text x="680" y="175" font-size="14" text-anchor="middle" fill="#000000">正面</text>
                <text x="670" y="310" font-size="14" text-anchor="middle" fill="#000000">侧面</text>
                <text x="680" y="405" font-size="14" text-anchor="middle" fill="#000000">上面</text>
            </g>
            
            <!-- 提示文字（初始状态显示） -->
            <g id="scene2-hint-group">
                <text x="650" y="240" font-size="14" text-anchor="middle" fill="#888888">请点击下方按钮</text>
                <text x="650" y="275" font-size="14" text-anchor="middle" fill="#888888">选择要观察的物体</text>
            </g>
            
            <!-- 选项①视图 -->
            <g id="scene2-option1" style="display: none;">
                <!-- 正面：凹字形 -->
                <rect class="scene2-opt-shape" x="640" y="55" width="80" height="100" fill="none" stroke="#000000" stroke-width="1.5"/>
                <line x1="660" y1="55" x2="660" y2="125" stroke="#000000" stroke-width="1.5"/>
                <line x1="700" y1="55" x2="700" y2="125" stroke="#000000" stroke-width="1.5"/>
                <line x1="660" y1="125" x2="700" y2="125" stroke="#000000" stroke-width="1.5"/>
                <!-- 侧面 -->
                <rect class="scene2-opt-shape" x="640" y="190" width="60" height="100" fill="none" stroke="#000000" stroke-width="1.5"/>
                <line x1="660" y1="190" x2="660" y2="290" stroke="#000000" stroke-width="1.5"/>
                <!-- 上面 -->
                <rect class="scene2-opt-shape" x="640" y="325" width="80" height="60" fill="none" stroke="#000000" stroke-width="1.5"/>
                <line x1="660" y1="325" x2="660" y2="355" stroke="#000000" stroke-width="1.5"/>
                <line x1="700" y1="325" x2="700" y2="355" stroke="#000000" stroke-width="1.5"/>
                <line x1="660" y1="355" x2="700" y2="355" stroke="#000000" stroke-width="1.5"/>
            </g>
            
            <!-- 选项②视图 -->
            <g id="scene2-option2" style="display: none;">
                <!-- 正面：底座+三角形 -->
                <rect class="scene2-opt-shape" x="640" y="95" width="80" height="60" fill="none" stroke="#000000" stroke-width="1.5"/>
                <path class="scene2-opt-shape" d="M640,95 L720,95 L680,55 Z" fill="none" stroke="#000000" stroke-width="1.5"/>
                <line x1="640" y1="95" x2="720" y2="95" stroke="#888888" stroke-width="1.5"/>
                <!-- 侧面 -->
                <rect class="scene2-opt-shape" x="640" y="190" width="60" height="100" fill="none" stroke="#000000" stroke-width="1.5"/>
                <!-- 上面 -->
                <path class="scene2-opt-shape" d="M640,385 L720,385 L680,325 Z" fill="none" stroke="#000000" stroke-width="1.5"/>
            </g>
            
            <!-- 选项③视图 -->
            <g id="scene2-option3" style="display: none;">
                <!-- 正面：矩形 -->
                <rect class="scene2-opt-shape scene2-opt3-shape" x="640" y="55" width="80" height="100" fill="none" stroke="#000000" stroke-width="1.5"/>
                <!-- 侧面：下部矩形+上部梯形 -->
                <rect class="scene2-opt-shape scene2-opt3-shape" x="640" y="230" width="60" height="60" fill="none" stroke="#000000" stroke-width="1.5"/>
                <path class="scene2-opt-shape scene2-opt3-shape" d="M640,230 L700,230 L685,190 L655,190 Z" fill="none" stroke="#000000" stroke-width="1.5"/>
                <!-- 上面：梯形 -->
                <path class="scene2-opt-shape scene2-opt3-shape" d="M640,385 L720,385 L700,325 L660,325 Z" fill="none" stroke="#000000" stroke-width="1.5"/>
            </g>
            
            <!-- 对比标记 -->
            <g id="scene2-marks" style="display: none;">
                <!-- 正面标记 -->
                <g id="scene2-mark-front-group" transform="translate(400, 105)">
                    <circle r="12" fill="#c62828" id="scene2-mark-front-circle"/>
                    <path id="scene2-mark-front-symbol" d="M-6,-6 L6,6 M6,-6 L-6,6" stroke="#ffffff" stroke-width="2" fill="none"/>
                </g>
                <!-- 侧面标记 -->
                <g id="scene2-mark-side-group" transform="translate(400, 240)">
                    <circle r="12" fill="#c62828" id="scene2-mark-side-circle"/>
                    <path id="scene2-mark-side-symbol" d="M-6,-6 L6,6 M6,-6 L-6,6" stroke="#ffffff" stroke-width="2" fill="none"/>
                </g>
                <!-- 上面标记 -->
                <g id="scene2-mark-top-group" transform="translate(400, 355)">
                    <circle r="12" fill="#c62828" id="scene2-mark-top-circle"/>
                    <path id="scene2-mark-top-symbol" d="M-6,-6 L6,6 M6,-6 L-6,6" stroke="#ffffff" stroke-width="2" fill="none"/>
                </g>
            </g>
            
            <!-- 对比说明文字 -->
            <g id="scene2-notes" style="display: none;">
                <text id="scene2-note-front" x="400" y="130" font-size="12" text-anchor="middle" fill="#c62828"></text>
                <text id="scene2-note-side" x="400" y="265" font-size="12" text-anchor="middle" fill="#c62828"></text>
                <text id="scene2-note-top" x="400" y="380" font-size="12" text-anchor="middle" fill="#c62828"></text>
            </g>
            
            <!-- 虚线框（错误状态） -->
            <g id="scene2-error-frames" style="display: none;">
                <rect x="635" y="50" width="90" height="110" fill="none" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5"/>
                <rect x="635" y="185" width="70" height="110" fill="none" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5"/>
                <rect x="635" y="320" width="90" height="70" fill="none" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5"/>
            </g>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button class="scene2-btn" id="scene2-btn-1">①</button>
            <button class="scene2-btn" id="scene2-btn-2">②</button>
            <button class="scene2-btn" id="scene2-btn-3">③</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现：三视图对比验证与排除法应用
        
        // 状态常量
        const STATE_NONE = 0;
        const STATE_1 = 1;
        const STATE_2 = 2;
        const STATE_3 = 3;
        
        let currentState = STATE_NONE;
        
        // 获取元素引用
        const hintGroup = document.getElementById('scene2-hint-group');
        const option1 = document.getElementById('scene2-option1');
        const option2 = document.getElementById('scene2-option2');
        const option3 = document.getElementById('scene2-option3');
        const marks = document.getElementById('scene2-marks');
        const notes = document.getElementById('scene2-notes');
        const errorFrames = document.getElementById('scene2-error-frames');
        
        const markFrontCircle = document.getElementById('scene2-mark-front-circle');
        const markFrontSymbol = document.getElementById('scene2-mark-front-symbol');
        const markSideCircle = document.getElementById('scene2-mark-side-circle');
        const markSideSymbol = document.getElementById('scene2-mark-side-symbol');
        const markTopCircle = document.getElementById('scene2-mark-top-circle');
        const markTopSymbol = document.getElementById('scene2-mark-top-symbol');
        
        const noteFront = document.getElementById('scene2-note-front');
        const noteSide = document.getElementById('scene2-note-side');
        const noteTop = document.getElementById('scene2-note-top');
        
        const btn1 = document.getElementById('scene2-btn-1');
        const btn2 = document.getElementById('scene2-btn-2');
        const btn3 = document.getElementById('scene2-btn-3');
        
        // 符号路径
        const PATH_CHECK = "M-6,0 L-2,4 L6,-6";
        const PATH_CROSS = "M-6,-6 L6,6 M6,-6 L-6,6";
        
        // 清除所有选项元素的填充和动画类
        function clearOptionStyles() {
            document.querySelectorAll('.scene2-opt-shape').forEach(function(el) {
                el.style.fill = 'none';
                el.style.fillOpacity = '1';
                el.classList.remove('scene2-blink');
            });
            noteFront.setAttribute('fill', '#c62828');
            noteSide.setAttribute('fill', '#c62828');
            noteTop.setAttribute('fill', '#c62828');
        }
        
        // 设置状态
        function setState(state) {
            currentState = state;
            
            // 重置按钮样式
            btn1.classList.remove('active');
            btn2.classList.remove('active');
            btn3.classList.remove('active');
            
            // 隐藏所有动态元素
            hintGroup.style.display = 'none';
            option1.style.display = 'none';
            option2.style.display = 'none';
            option3.style.display = 'none';
            marks.style.display = 'none';
            notes.style.display = 'none';
            errorFrames.style.display = 'none';
            
            // 清除样式
            clearOptionStyles();
            
            if (state === STATE_NONE) {
                hintGroup.style.display = 'block';
                return;
            }
            
            // 显示对比标记和说明
            marks.style.display = 'block';
            notes.style.display = 'block';
            
            if (state === STATE_1) {
                btn1.classList.add('active');
                option1.style.display = 'block';
                errorFrames.style.display = 'block';
                
                // 红叉
                markFrontCircle.setAttribute('fill', '#c62828');
                markFrontSymbol.setAttribute('d', PATH_CROSS);
                markSideCircle.setAttribute('fill', '#c62828');
                markSideSymbol.setAttribute('d', PATH_CROSS);
                markTopCircle.setAttribute('fill', '#c62828');
                markTopSymbol.setAttribute('d', PATH_CROSS);
                
                noteFront.textContent = '正面不符';
                noteSide.textContent = '侧面不符';
                noteTop.textContent = '上面不符';
            } else if (state === STATE_2) {
                btn2.classList.add('active');
                option2.style.display = 'block';
                errorFrames.style.display = 'block';
                
                // 红叉
                markFrontCircle.setAttribute('fill', '#c62828');
                markFrontSymbol.setAttribute('d', PATH_CROSS);
                markSideCircle.setAttribute('fill', '#c62828');
                markSideSymbol.setAttribute('d', PATH_CROSS);
                markTopCircle.setAttribute('fill', '#c62828');
                markTopSymbol.setAttribute('d', PATH_CROSS);
                
                noteFront.textContent = '含三角形';
                noteSide.textContent = '侧面不符';
                noteTop.textContent = '不是梯形';
            } else if (state === STATE_3) {
                btn3.classList.add('active');
                option3.style.display = 'block';
                
                // 绿勾
                markFrontCircle.setAttribute('fill', '#2e7d32');
                markFrontSymbol.setAttribute('d', PATH_CHECK);
                markSideCircle.setAttribute('fill', '#2e7d32');
                markSideSymbol.setAttribute('d', PATH_CHECK);
                markTopCircle.setAttribute('fill', '#2e7d32');
                markTopSymbol.setAttribute('d', PATH_CHECK);
                
                // 说明文字
                noteFront.textContent = '全部匹配';
                noteFront.setAttribute('fill', '#2e7d32');
                noteSide.textContent = '';
                noteTop.textContent = '';
                
                // 绿色填充
                document.querySelectorAll('.scene2-opt3-shape').forEach(function(el) {
                    el.style.fill = '#2e7d32';
                    el.style.fillOpacity = '0.2';
                });
                
                // 闪烁动画
                setTimeout(function() {
                    document.querySelectorAll('.scene2-opt3-shape').forEach(function(el) {
                        el.classList.add('scene2-blink');
                    });
                }, 50);
            }
        }
        
        // 事件绑定
        btn1.addEventListener('click', function() { setState(STATE_1); });
        btn2.addEventListener('click', function() { setState(STATE_2); });
        btn3.addEventListener('click', function() { setState(STATE_3); });
        
        // 初始状态
        setState(STATE_NONE);
    })();
    </script>
</body>
</html>
