<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>等高三角形面积比较</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            padding: 6px 16px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #cccccc;
            border-radius: 4px;
            background: #f5f5f5;
            transition: opacity 0.2s;
        }
        #scene1-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene1-step-label { font-size: 14px; color: #666666; min-width: 80px; text-align: center; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 上线 -->
            <line x1="100" y1="100" x2="700" y2="100" stroke="#000000" stroke-width="2"/>
            <!-- 下线 -->
            <line x1="100" y1="280" x2="700" y2="280" stroke="#000000" stroke-width="2"/>

            <!-- 上线刻度线和标签 -->
            <g id="scene1-top-ticks">
                <line x1="100" y1="100" x2="100" y2="120" stroke="#000000" stroke-width="1"/>
                <line x1="220" y1="100" x2="220" y2="120" stroke="#000000" stroke-width="1"/>
                <line x1="340" y1="100" x2="340" y2="120" stroke="#000000" stroke-width="1"/>
                <line x1="460" y1="100" x2="460" y2="120" stroke="#000000" stroke-width="1"/>
                <line x1="580" y1="100" x2="580" y2="120" stroke="#000000" stroke-width="1"/>
                <line x1="700" y1="100" x2="700" y2="120" stroke="#000000" stroke-width="1"/>
                <text x="100" y="90" text-anchor="middle" font-size="14" fill="#000000">0</text>
                <text x="220" y="90" text-anchor="middle" font-size="14" fill="#000000">1</text>
                <text x="340" y="90" text-anchor="middle" font-size="14" fill="#000000">2</text>
                <text x="460" y="90" text-anchor="middle" font-size="14" fill="#000000">3</text>
                <text x="580" y="90" text-anchor="middle" font-size="14" fill="#000000">4</text>
                <text x="700" y="90" text-anchor="middle" font-size="14" fill="#000000">5</text>
            </g>

            <!-- 下线刻度线和标签 -->
            <g id="scene1-bottom-ticks">
                <line x1="100" y1="260" x2="100" y2="280" stroke="#000000" stroke-width="1"/>
                <line x1="220" y1="260" x2="220" y2="280" stroke="#000000" stroke-width="1"/>
                <line x1="340" y1="260" x2="340" y2="280" stroke="#000000" stroke-width="1"/>
                <line x1="460" y1="260" x2="460" y2="280" stroke="#000000" stroke-width="1"/>
                <line x1="580" y1="260" x2="580" y2="280" stroke="#000000" stroke-width="1"/>
                <line x1="700" y1="260" x2="700" y2="280" stroke="#000000" stroke-width="1"/>
                <text x="100" y="300" text-anchor="middle" font-size="14" fill="#000000">0</text>
                <text x="220" y="300" text-anchor="middle" font-size="14" fill="#000000">1</text>
                <text x="340" y="300" text-anchor="middle" font-size="14" fill="#000000">2</text>
                <text x="460" y="300" text-anchor="middle" font-size="14" fill="#000000">3</text>
                <text x="580" y="300" text-anchor="middle" font-size="14" fill="#000000">4</text>
                <text x="700" y="300" text-anchor="middle" font-size="14" fill="#000000">5</text>
            </g>

            <!-- 三角形1 -->
            <polygon id="scene1-tri-1" points="220,100 100,280 340,280" fill="#1565c0" fill-opacity="0.2" stroke="#1565c0" stroke-width="2"/>
            <!-- 三角形1标签：放在三角形上方偏左 -->
            <text id="scene1-label-1" x="160" y="60" text-anchor="middle" font-size="16" fill="#000000">1</text>

            <!-- 三角形2 -->
            <polygon id="scene1-tri-2" points="460,100 340,280 580,280" fill="#2e7d32" fill-opacity="0.2" stroke="#2e7d32" stroke-width="2"/>
            <!-- 三角形2标签：放在三角形上方偏右 -->
            <text id="scene1-label-2" x="520" y="60" text-anchor="middle" font-size="16" fill="#000000">2</text>

            <!-- 三角形3 -->
            <polygon id="scene1-tri-3" points="580,100 580,280 700,280" fill="#c62828" fill-opacity="0.2" stroke="#c62828" stroke-width="2"/>
            <!-- 三角形3标签：放在上方偏左，远离刻度"4" -->
            <text id="scene1-label-3" x="620" y="60" text-anchor="middle" font-size="16" fill="#000000">3</text>

            <!-- 步骤1：底边标注 -->
            <g id="scene1-step1-group" style="display:none">
                <text x="220" y="320" text-anchor="middle" font-size="14" fill="#000000">底=2</text>
                <text x="460" y="320" text-anchor="middle" font-size="14" fill="#000000">底=2</text>
                <text x="640" y="320" text-anchor="middle" font-size="14" fill="#000000">底=1</text>
            </g>

            <!-- 步骤2：高线、垂足标记、h标注 -->
            <g id="scene1-step2-group" style="display:none">
                <!-- 高线1 -->
                <line x1="220" y1="100" x2="220" y2="280" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
                <polyline points="210,280 220,280 220,270" fill="none" stroke="#888888" stroke-width="1"/>
                <!-- h1放在高线右侧上方 -->
                <text x="250" y="60" text-anchor="start" font-size="16" fill="#000000">h</text>
                <!-- 高线2 -->
                <line x1="460" y1="100" x2="460" y2="280" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
                <polyline points="450,280 460,280 460,270" fill="none" stroke="#888888" stroke-width="1"/>
                <!-- h2 -->
                <text x="490" y="60" text-anchor="start" font-size="16" fill="#000000">h</text>
                <!-- 高线3 -->
                <line x1="580" y1="100" x2="580" y2="280" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
                <polyline points="570,280 580,280 580,270" fill="none" stroke="#888888" stroke-width="1"/>
                <!-- h3放在远离"3"标签的位置 -->
                <text x="660" y="60" text-anchor="start" font-size="16" fill="#000000">h</text>
            </g>

            <!-- 步骤3：公式计算（无背景框） -->
            <g id="scene1-step3-group" style="display:none">
                <text x="400" y="365" text-anchor="middle" font-size="16" fill="#000000" font-weight="bold">S = ½ × 底 × 高</text>
                <text x="400" y="400" text-anchor="middle" font-size="14" fill="#000000">S₁ = ½×2×h = h     S₂ = ½×2×h = h     S₃ = ½×1×h = 0.5h</text>
            </g>

            <!-- 步骤4：结论文字 -->
            <g id="scene1-step4-group" style="display:none">
                <text id="scene1-conclusion" x="400" y="450" text-anchor="middle" font-size="18" fill="#c62828" font-weight="bold">图3面积最小</text>
            </g>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" onclick="scene1PrevStep()">◀ 上一步</button>
            <span id="scene1-step-label">步骤 0/4</span>
            <button id="scene1-btn-next" onclick="scene1NextStep()">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现：等高三角形面积比较
        let currentStep = 0;
        const totalSteps = 4;

        const step1Group = document.getElementById('scene1-step1-group');
        const step2Group = document.getElementById('scene1-step2-group');
        const step3Group = document.getElementById('scene1-step3-group');
        const step4Group = document.getElementById('scene1-step4-group');

        const tri1 = document.getElementById('scene1-tri-1');
        const tri2 = document.getElementById('scene1-tri-2');
        const tri3 = document.getElementById('scene1-tri-3');

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepLabel = document.getElementById('scene1-step-label');

        function setDisplay(el, show) {
            if (!el) return;
            el.style.display = show ? 'block' : 'none';
        }

        function renderStep() {
            // 更新步骤标签
            stepLabel.textContent = '步骤 ' + currentStep + '/' + totalSteps;

            // 按钮禁用状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps);

            // 步骤1：底边标注
            setDisplay(step1Group, currentStep >= 1);

            // 步骤2：高线
            setDisplay(step2Group, currentStep >= 2);

            // 步骤3：公式
            setDisplay(step3Group, currentStep >= 3);

            // 步骤4：结论 + 高亮样式
            setDisplay(step4Group, currentStep >= 4);

            if (currentStep >= 4) {
                // 图3高亮
                tri3.setAttribute('stroke-width', '4');
                tri3.setAttribute('fill-opacity', '0.4');
                // 图1淡化
                tri1.setAttribute('stroke', '#90caf9');
                tri1.setAttribute('fill-opacity', '0.1');
                // 图2淡化
                tri2.setAttribute('stroke', '#a5d6a7');
                tri2.setAttribute('fill-opacity', '0.1');
            } else {
                // 恢复默认样式
                tri1.setAttribute('stroke', '#1565c0');
                tri1.setAttribute('fill-opacity', '0.2');
                tri1.setAttribute('stroke-width', '2');

                tri2.setAttribute('stroke', '#2e7d32');
                tri2.setAttribute('fill-opacity', '0.2');
                tri2.setAttribute('stroke-width', '2');

                tri3.setAttribute('stroke', '#c62828');
                tri3.setAttribute('fill-opacity', '0.2');
                tri3.setAttribute('stroke-width', '2');
            }
        }

        window.scene1PrevStep = function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        };

        window.scene1NextStep = function() {
            if (currentStep < totalSteps) {
                currentStep++;
                renderStep();
            }
        };

        // 初始渲染
        renderStep();
    })();
    </script>
</body>
</html>
