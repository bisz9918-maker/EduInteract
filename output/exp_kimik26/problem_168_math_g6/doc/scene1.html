<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>两小圆周长之和与大圆周长的关系</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            padding: 8px 16px;
            background: #e3f2fd;
            border: 1px solid #90caf9;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        #scene1-controls button:hover:not(:disabled) { background: #bbdefb; }
        #scene1-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 14px; color: #555; min-width: 80px; text-align: center; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 大圆 -->
            <circle id="scene1-big-circle" cx="350" cy="140" r="120" stroke="#000000" stroke-width="2" fill="none"/>
            
            <!-- 直径线 -->
            <line id="scene1-diameter-line" x1="230" y1="140" x2="470" y2="140" stroke="#1565c0" stroke-width="2"/>
            
            <!-- 左小圆 -->
            <circle id="scene1-left-circle" cx="265" cy="140" r="35" stroke="#000000" stroke-width="2" fill="none"/>
            
            <!-- 右小圆 -->
            <circle id="scene1-right-circle" cx="385" cy="140" r="85" stroke="#000000" stroke-width="2" fill="none"/>
            
            <!-- 切分点 -->
            <circle id="scene1-split-point" cx="300" cy="140" r="3" fill="#000000"/>
            
            <!-- d₁ 标注线组 -->
            <g id="scene1-d1-group" style="display:none">
                <line id="scene1-d1-line" x1="230" y1="277" x2="300" y2="277" stroke="#1565c0" stroke-width="1"/>
                <line x1="230" y1="275" x2="230" y2="279" stroke="#1565c0" stroke-width="1"/>
                <line id="scene1-d1-right-tick" x1="300" y1="275" x2="300" y2="279" stroke="#1565c0" stroke-width="1"/>
                <text id="scene1-d1-label" x="265" y="272" text-anchor="middle" fill="#1565c0" font-size="14">d₁</text>
            </g>
            
            <!-- d₂ 标注线组 -->
            <g id="scene1-d2-group" style="display:none">
                <line id="scene1-d2-line" x1="300" y1="304" x2="470" y2="304" stroke="#1565c0" stroke-width="1"/>
                <line id="scene1-d2-left-tick" x1="300" y1="302" x2="300" y2="306" stroke="#1565c0" stroke-width="1"/>
                <line x1="470" y1="302" x2="470" y2="306" stroke="#1565c0" stroke-width="1"/>
                <text id="scene1-d2-label" x="385" y="299" text-anchor="middle" fill="#1565c0" font-size="14">d₂</text>
            </g>
            
            <!-- D 标注线组 -->
            <g id="scene1-D-group" style="display:none">
                <line x1="230" y1="344" x2="470" y2="344" stroke="#1565c0" stroke-width="1"/>
                <line x1="230" y1="342" x2="230" y2="346" stroke="#1565c0" stroke-width="1"/>
                <line x1="470" y1="342" x2="470" y2="346" stroke="#1565c0" stroke-width="1"/>
                <text x="380" y="337" text-anchor="middle" fill="#1565c0" font-size="14">D</text>
            </g>
            
            <!-- 步骤1公式 -->
            <text id="scene1-step1-formula" x="400" y="370" text-anchor="middle" fill="#000000" font-size="14" style="display:none">d₁ + d₂ = D</text>
            
            <!-- 步骤2公式组 -->
            <g id="scene1-step2-group" style="display:none">
                <text x="240" y="366" fill="#000000" font-size="14">∵ d₁ + d₂ = D</text>
                <text x="240" y="399" fill="#000000" font-size="14">∴ C大 = πD</text>
                <text x="240" y="432" fill="#000000" font-size="14">C小和 = πd₁ + πd₂ = πD</text>
                <text x="480" y="399" fill="#2e7d32" font-size="20" font-weight="bold">一样长</text>
            </g>
            
            <!-- 步骤3数值面板 -->
            <g id="scene1-step3-group" style="display:none">
                <text id="scene1-val-d1" x="260" y="366" fill="#000000" font-size="14">d₁ = 70</text>
                <text id="scene1-val-d2" x="260" y="399" fill="#000000" font-size="14">d₂ = 170</text>
                <text id="scene1-val-cbig" x="480" y="366" fill="#000000" font-size="14">C大 ≈ 753.98</text>
                <text id="scene1-val-csmall" x="480" y="399" fill="#000000" font-size="14">C小和 ≈ 753.98</text>
                <text id="scene1-step3-conclusion" x="400" y="432" text-anchor="middle" fill="#2e7d32" font-size="16" font-weight="bold">C大 = C小和 ✓</text>
            </g>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/4</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现
        let currentStep = 0;
        const totalSteps = 4;
        
        // 固定几何参数
        const LEFT_X = 230;
        const RIGHT_X = 470;
        const CENTER_Y = 140;
        const TOTAL_D = RIGHT_X - LEFT_X; // 240
        
        // 拖拽状态
        let dragging = false;
        let splitX = 300;
        
        // 获取元素
        const svg = document.getElementById('scene1-svg');
        const splitPoint = document.getElementById('scene1-split-point');
        const leftCircle = document.getElementById('scene1-left-circle');
        const rightCircle = document.getElementById('scene1-right-circle');
        const d1Group = document.getElementById('scene1-d1-group');
        const d2Group = document.getElementById('scene1-d2-group');
        const DGroup = document.getElementById('scene1-D-group');
        const step1Formula = document.getElementById('scene1-step1-formula');
        const step2Group = document.getElementById('scene1-step2-group');
        const step3Group = document.getElementById('scene1-step3-group');
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        
        // 动态元素
        const d1Line = document.getElementById('scene1-d1-line');
        const d1RightTick = document.getElementById('scene1-d1-right-tick');
        const d1Label = document.getElementById('scene1-d1-label');
        const d2Line = document.getElementById('scene1-d2-line');
        const d2LeftTick = document.getElementById('scene1-d2-left-tick');
        const d2Label = document.getElementById('scene1-d2-label');
        const valD1 = document.getElementById('scene1-val-d1');
        const valD2 = document.getElementById('scene1-val-d2');
        const valCbig = document.getElementById('scene1-val-cbig');
        const valCsmall = document.getElementById('scene1-val-csmall');
        
        function show(el) {
            el.style.display = '';
            el.style.opacity = '1';
        }
        
        function hide(el) {
            el.style.display = 'none';
            el.style.opacity = '0';
        }
        
        function updateGeometry(x) {
            splitX = x;
            const d1 = x - LEFT_X;
            const d2 = RIGHT_X - x;
            const r1 = d1 / 2;
            const r2 = d2 / 2;
            const cx1 = LEFT_X + r1;
            const cx2 = x + r2;
            
            // 更新小圆
            leftCircle.setAttribute('cx', cx1);
            leftCircle.setAttribute('r', r1);
            rightCircle.setAttribute('cx', cx2);
            rightCircle.setAttribute('r', r2);
            
            // 更新切分点
            splitPoint.setAttribute('cx', x);
            
            // 更新标注线
            d1Line.setAttribute('x2', x);
            d1RightTick.setAttribute('x1', x);
            d1RightTick.setAttribute('x2', x);
            d1Label.setAttribute('x', (LEFT_X + x) / 2);
            
            d2Line.setAttribute('x1', x);
            d2LeftTick.setAttribute('x1', x);
            d2LeftTick.setAttribute('x2', x);
            d2Label.setAttribute('x', (x + RIGHT_X) / 2);
            
            // 更新数值
            const cBig = Math.PI * TOTAL_D;
            const cSmall = Math.PI * d1 + Math.PI * d2;
            valD1.textContent = 'd₁ = ' + d1.toFixed(0);
            valD2.textContent = 'd₂ = ' + d2.toFixed(0);
            valCbig.textContent = 'C大 ≈ ' + cBig.toFixed(2);
            valCsmall.textContent = 'C小和 ≈ ' + cSmall.toFixed(2);
        }
        
        function render(step) {
            currentStep = step;
            stepIndicator.textContent = '步骤 ' + (step + 1) + '/' + totalSteps;
            btnPrev.disabled = step === 0;
            if (step === totalSteps - 1) {
                btnNext.textContent = '重播 ▶';
            } else {
                btnNext.textContent = '下一步 ▶';
            }
            
            // 重置所有动态元素
            hide(d1Group);
            hide(d2Group);
            hide(DGroup);
            hide(step1Formula);
            hide(step2Group);
            hide(step3Group);
            
            // 重置切分点样式
            splitPoint.setAttribute('r', '3');
            splitPoint.setAttribute('fill', '#000000');
            splitPoint.setAttribute('stroke', 'none');
            splitPoint.style.cursor = 'default';
            
            // 重置几何到初始状态
            updateGeometry(300);
            
            if (step >= 1) {
                show(d1Group);
                show(d2Group);
                show(DGroup);
            }
            
            if (step === 1) {
                show(step1Formula);
            }
            
            if (step === 2) {
                show(step2Group);
            }
            
            if (step === 3) {
                show(step3Group);
                // 切分点变为可拖拽样式
                splitPoint.setAttribute('r', '6');
                splitPoint.setAttribute('fill', '#c62828');
                splitPoint.setAttribute('stroke', '#ffffff');
                splitPoint.setAttribute('stroke-width', '2');
                splitPoint.style.cursor = 'grab';
            }
        }
        
        // 按钮事件
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                render(currentStep - 1);
            }
        });
        
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                render(currentStep + 1);
            } else {
                render(0);
            }
        });
        
        // 拖拽事件
        splitPoint.addEventListener('mousedown', function(e) {
            if (currentStep !== 3) return;
            dragging = true;
            splitPoint.style.cursor = 'grabbing';
            e.preventDefault();
        });
        
        document.addEventListener('mousemove', function(e) {
            if (!dragging) return;
            const rect = svg.getBoundingClientRect();
            let x = e.clientX - rect.left;
            // 限制范围，保证最小直径50
            x = Math.max(LEFT_X + 50, Math.min(RIGHT_X - 50, x));
            updateGeometry(x);
        });
        
        document.addEventListener('mouseup', function() {
            if (dragging) {
                dragging = false;
                splitPoint.style.cursor = 'grab';
            }
        });
        
        // 触摸事件支持
        splitPoint.addEventListener('touchstart', function(e) {
            if (currentStep !== 3) return;
            dragging = true;
            e.preventDefault();
        });
        
        document.addEventListener('touchmove', function(e) {
            if (!dragging) return;
            const rect = svg.getBoundingClientRect();
            let x = e.touches[0].clientX - rect.left;
            x = Math.max(LEFT_X + 50, Math.min(RIGHT_X - 50, x));
            updateGeometry(x);
        });
        
        document.addEventListener('touchend', function() {
            dragging = false;
        });
        
        // 初始渲染
        render(0);
    })();
    </script>
</body>
</html>
