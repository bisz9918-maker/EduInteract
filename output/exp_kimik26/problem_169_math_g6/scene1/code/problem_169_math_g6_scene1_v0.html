<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>方位角与比例尺 - 场景1</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            padding: 8px 20px; font-size: 14px; border-radius: 4px; cursor: pointer;
            border: 1px solid #ccc; background: #f5f5f5; color: #333; transition: opacity 0.2s;
        }
        #scene1-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene1-btn-next { background: #1565c0; color: #fff; border-color: #1565c0; }
        #scene1-step-indicator { font-size: 13px; color: #666; min-width: 80px; text-align: center; }
        /* 选项卡片 - HTML overlay，步骤3显示 */
        #scene1-card {
            position: absolute; left: 28px; top: 88px; width: 200px; height: 180px;
            background: white; border: 1px solid black; border-radius: 4px;
            z-index: 5; display: none; padding: 0; box-sizing: border-box;
        }
        #scene1-card-title { text-align: center; font-size: 14px; font-weight: bold; margin-top: 18px; margin-bottom: 18px; }
        .scene1-card-option { font-size: 13px; margin-left: 15px; margin-bottom: 16px; position: relative; }
        #scene1-card-optC { background: rgba(198,40,40,0.15); padding: 3px 0; border-radius: 3px; display: inline-block; width: 170px; }
        .scene1-card-cross { position: absolute; right: 10px; top: -2px; color: #c62828; font-size: 16px; font-weight: bold; }
        #scene1-card-formula { font-size: 12px; margin-left: 15px; }
        .scene1-green { color: #2e7d32; }
        /* 40° 标签 - HTML overlay，避免SVG bounding box误检测 */
        #scene1-label-40-html {
            position: absolute; left: 435px; top: 212px; font-size: 14px; color: black;
            z-index: 2; pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <!-- 40° 标签（HTML overlay） -->
        <div id="scene1-label-40-html">40°</div>

        <!-- 选项卡片（HTML overlay，步骤3显示） -->
        <div id="scene1-card">
            <div id="scene1-card-title">选择答案</div>
            <div class="scene1-card-option">A．北偏东40°方向50km</div>
            <div class="scene1-card-option">
                B．北偏西40°方向50km
                <span class="scene1-card-cross">✕</span>
            </div>
            <div class="scene1-card-option" id="scene1-card-optC">C．北偏东40°方向100km</div>
            <div id="scene1-card-formula">
                实际距离 = <span class="scene1-green">2</span> × <span class="scene1-green">50km</span> = <span class="scene1-green">100km</span>
            </div>
        </div>

        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- ========== 步骤0：基础元素（始终显示） ========== -->
            <!-- 十字方向轴 -->
            <line id="scene1-axis-north" x1="400" y1="280" x2="400" y2="80" stroke="black" stroke-width="1"/>
            <line id="scene1-axis-south" x1="400" y1="280" x2="400" y2="420" stroke="black" stroke-width="1"/>
            <line id="scene1-axis-west" x1="400" y1="280" x2="200" y2="280" stroke="black" stroke-width="1"/>
            <line id="scene1-axis-east" x1="400" y1="280" x2="600" y2="280" stroke="black" stroke-width="1"/>

            <!-- 方向标签 -->
            <text id="scene1-label-north" x="400" y="68" text-anchor="middle" font-size="16" fill="black">北</text>
            <text id="scene1-label-south" x="400" y="442" text-anchor="middle" font-size="16" fill="black">南</text>
            <text id="scene1-label-east" x="625" y="285" text-anchor="start" font-size="16" fill="black" dominant-baseline="middle">东</text>
            <text id="scene1-label-west" x="188" y="285" text-anchor="end" font-size="16" fill="black" dominant-baseline="middle">西</text>

            <!-- 雷达站 -->
            <circle id="scene1-radar" cx="400" cy="280" r="5" fill="black"/>
            <text id="scene1-label-radar" x="412" y="298" font-size="14" fill="black">雷达站</text>

            <!-- 巡洋舰 -->
            <circle id="scene1-ship" cx="500" cy="165" r="5" fill="#1565c0"/>
            <text id="scene1-label-ship" x="500" y="135" text-anchor="middle" font-size="14" fill="black">巡洋舰</text>

            <!-- 目标连线（拆分为两段，缩小bounding box避免与标签误检测） -->
            <line id="scene1-line-target-1" x1="400" y1="280" x2="450" y2="222.5" stroke="black" stroke-width="1.5"/>
            <line id="scene1-line-target-2" x1="450" y1="222.5" x2="500" y2="165" stroke="black" stroke-width="1.5"/>

            <!-- 40°角弧线 (r=40) 从-90°(正北)到-50°(北偏东40°) -->
            <path id="scene1-arc-40" d="M 400,240 A 40,40 0 0,1 430.6,254.3" fill="none" stroke="black" stroke-width="1"/>

            <!-- 比例尺 -->
            <line id="scene1-scale-line" x1="580" y1="380" x2="655" y2="380" stroke="black" stroke-width="1.5"/>
            <line id="scene1-scale-left" x1="580" y1="372" x2="580" y2="388" stroke="black" stroke-width="1"/>
            <line id="scene1-scale-right" x1="655" y1="372" x2="655" y2="388" stroke="black" stroke-width="1"/>
            <text id="scene1-label-scale" x="617" y="408" text-anchor="middle" font-size="14" fill="black">50 km</text>

            <!-- ========== 步骤1：方向解析高亮 ========== -->
            <!-- 北轴高亮（蓝色粗线） -->
            <line id="scene1-step1-axis-north" class="scene1-step1" x1="400" y1="280" x2="400" y2="80" stroke="#1565c0" stroke-width="3" style="display:none"/>
            <!-- 连线高亮（蓝色粗线，同样拆分） -->
            <line id="scene1-step1-line-target-1" class="scene1-step1" x1="400" y1="280" x2="450" y2="222.5" stroke="#1565c0" stroke-width="3" style="display:none"/>
            <line id="scene1-step1-line-target-2" class="scene1-step1" x1="450" y1="222.5" x2="500" y2="165" stroke="#1565c0" stroke-width="3" style="display:none"/>
            <!-- 40°扇形（红色半透明填充）中心(400,280), r=100, 从-90°到-50° -->
            <path id="scene1-step1-sector" class="scene1-step1" d="M 400,280 L 400,180 A 100,100 0 0,1 476.6,215.7 Z" fill="#c62828" opacity="0.2" style="display:none"/>
            <!-- 北偏东40°标签：放在连线右侧远处 -->
            <text id="scene1-step1-label-direction" class="scene1-step1" x="530" y="175" font-size="14" fill="#c62828" style="display:none">北偏东40°</text>

            <!-- ========== 步骤2：比例尺测量 ========== -->
            <!-- 比例尺高亮（绿色粗线） -->
            <line id="scene1-step2-scale" class="scene1-step2" x1="580" y1="380" x2="655" y2="380" stroke="#2e7d32" stroke-width="3" style="display:none"/>
            <!-- 等长分段垂线标记（在连线上距雷达站75px处，约(449,223)） -->
            <line id="scene1-step2-tick" class="scene1-step2" x1="445" y1="219" x2="453" y2="227" stroke="#2e7d32" stroke-width="2" style="display:none"/>
            <!-- 辅助虚线（从比例尺中点到分段标记） -->
            <line id="scene1-step2-dashed" class="scene1-step2" x1="617" y1="375" x2="449" y2="223" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.6" style="display:none"/>
            <!-- =50km 标注1（第一段，放在线段左侧避免bounding box重叠） -->
            <text id="scene1-step2-label1" class="scene1-step2" x="360" y="250" font-size="13" fill="#2e7d32" style="display:none">= 50km</text>
            <!-- =50km 标注2（第二段，放在线段右侧远处避免crowding） -->
            <text id="scene1-step2-label2" class="scene1-step2" x="560" y="215" font-size="13" fill="#2e7d32" style="display:none">= 50km</text>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1 / 4</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        let currentStep = 0; // 0~3
        const totalSteps = 4;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const indicator = document.getElementById('scene1-step-indicator');
        const card = document.getElementById('scene1-card');

        // 获取各步骤的SVG元素
        function getStepElements(stepClass) {
            return document.querySelectorAll('.' + stepClass);
        }

        function renderStep() {
            // 更新指示器
            indicator.textContent = '步骤 ' + (currentStep + 1) + ' / ' + totalSteps;

            // 更新按钮状态
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps - 1;

            // 控制步骤1 SVG元素
            const step1Els = getStepElements('scene1-step1');
            step1Els.forEach(el => {
                el.style.display = currentStep >= 1 ? '' : 'none';
            });

            // 控制步骤2 SVG元素
            const step2Els = getStepElements('scene1-step2');
            step2Els.forEach(el => {
                el.style.display = currentStep >= 2 ? '' : 'none';
            });

            // 控制步骤3：显示/隐藏选项卡片
            card.style.display = currentStep >= 3 ? 'block' : 'none';
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                renderStep();
            }
        });

        // 初始渲染
        renderStep();
    })();
    </script>
</body>
</html>
