<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 1 - 串联电路结构分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            padding: 6px 16px; font-size: 14px; border: none; border-radius: 4px;
            background: #1565c0; color: #ffffff; cursor: pointer; min-width: 100px; height: 32px;
        }
        #scene1-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene1-label { font-size: 14px; fill: #000000; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        .scene1-step-label { font-size: 14px; fill: #000000; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        .scene1-hl-path { stroke: #c62828; stroke-width: 3; fill: none; }
        .scene1-hl-v1 { stroke: #2e7d32; stroke-width: 3; fill: none; }
        .scene1-hl-v2 { stroke: #f57c00; stroke-width: 3; fill: none; }
        .scene1-arrow { fill: #c62828; }

        /* HTML overlay summary box */
        #scene1-summary-html {
            position: absolute;
            left: 520px;
            top: 310px;
            width: 260px;
            padding: 8px 10px;
            box-sizing: border-box;
            background: #e3f2fd;
            border: 2px solid #1565c0;
            border-radius: 4px;
            font-size: 13px;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            color: #000000;
            line-height: 1.6;
            opacity: 0;
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" viewBox="0 0 800 500">
            <!-- 底层导线 -->
            <g id="scene1-wires">
                <!-- 上横线左段 -->
                <line x1="180" y1="140" x2="490" y2="140" stroke="#000000" stroke-width="2"/>
                <!-- 上横线右段 -->
                <line x1="550" y1="140" x2="620" y2="140" stroke="#000000" stroke-width="2"/>
                <!-- 左竖线上段（开关上端） -->
                <line x1="180" y1="140" x2="180" y2="155" stroke="#000000" stroke-width="2"/>
                <!-- 左竖线中段（开关下到灯泡上） -->
                <line x1="180" y1="185" x2="180" y2="282" stroke="#000000" stroke-width="2"/>
                <!-- 左竖线下段（灯泡下到下横线） -->
                <line x1="180" y1="318" x2="180" y2="380" stroke="#000000" stroke-width="2"/>
                <!-- 下横线 -->
                <line x1="180" y1="380" x2="620" y2="380" stroke="#000000" stroke-width="2"/>
                <!-- 右竖线上段（电流表上） -->
                <line x1="620" y1="140" x2="620" y2="230" stroke="#000000" stroke-width="2"/>
                <!-- 右竖线下段（电流表下） -->
                <line x1="620" y1="270" x2="620" y2="380" stroke="#000000" stroke-width="2"/>
                <!-- 电源正极引线 -->
                <line x1="320" y1="140" x2="320" y2="215" stroke="#000000" stroke-width="2"/>
                <!-- 电源负极引线 -->
                <line x1="320" y1="245" x2="320" y2="380" stroke="#000000" stroke-width="2"/>
            </g>

            <!-- 开关符号 -->
            <g id="scene1-part-switch">
                <circle cx="180" cy="155" r="3" fill="#000000"/>
                <circle cx="180" cy="185" r="3" fill="#000000"/>
                <line x1="180" y1="155" x2="195" y2="175" stroke="#000000" stroke-width="2"/>
            </g>

            <!-- 小灯泡符号 -->
            <g id="scene1-part-bulb">
                <circle cx="180" cy="300" r="18" stroke="#000000" stroke-width="2" fill="none"/>
                <line x1="172" y1="292" x2="188" y2="308" stroke="#000000" stroke-width="1.5"/>
                <line x1="188" y1="292" x2="172" y2="308" stroke="#000000" stroke-width="1.5"/>
            </g>

            <!-- 滑动变阻器符号 -->
            <g id="scene1-part-rheostat">
                <!-- 电阻丝 -->
                <line x1="490" y1="140" x2="550" y2="140" stroke="#000000" stroke-width="2"/>
                <!-- 滑片 -->
                <line x1="520" y1="125" x2="520" y2="140" stroke="#000000" stroke-width="2"/>
                <line x1="510" y1="125" x2="530" y2="125" stroke="#000000" stroke-width="2"/>
            </g>

            <!-- 电流表A符号（圆框+外部标签） -->
            <g id="scene1-part-ammeter">
                <circle cx="620" cy="250" r="20" stroke="#000000" stroke-width="2" fill="none"/>
                <text x="645" y="255" class="scene1-label" font-size="14">A</text>
            </g>

            <!-- 电源符号（电池组） -->
            <g id="scene1-part-power">
                <!-- 正极（长线） -->
                <line x1="305" y1="215" x2="335" y2="215" stroke="#000000" stroke-width="3"/>
                <!-- 负极（短线） -->
                <line x1="310" y1="245" x2="330" y2="245" stroke="#000000" stroke-width="2"/>
                <!-- 连接线 -->
                <line x1="320" y1="215" x2="320" y2="245" stroke="#000000" stroke-width="2"/>
            </g>

            <!-- 电压表V₁符号（圆框+外部标签） -->
            <g id="scene1-part-v1">
                <circle cx="120" cy="120" r="20" stroke="#000000" stroke-width="2" fill="none"/>
                <text x="90" y="125" text-anchor="middle" class="scene1-label" font-size="14">V₁</text>
            </g>

            <!-- V₁引线 -->
            <g id="scene1-wires-v1">
                <polyline points="120,100 320,100 320,140" stroke="#000000" stroke-width="2" fill="none"/>
                <polyline points="120,140 120,380 320,380" stroke="#000000" stroke-width="2" fill="none"/>
            </g>

            <!-- 电压表V₂符号（圆框+外部标签） -->
            <g id="scene1-part-v2">
                <circle cx="280" cy="390" r="20" stroke="#000000" stroke-width="2" fill="none"/>
                <text x="310" y="395" class="scene1-label" font-size="14">V₂</text>
            </g>

            <!-- V₂引线 -->
            <g id="scene1-wires-v2">
                <polyline points="280,370 180,370 180,282" stroke="#000000" stroke-width="2" fill="none"/>
                <polyline points="280,410 180,410 180,318" stroke="#000000" stroke-width="2" fill="none"/>
            </g>

            <!-- 元件名称标签 -->
            <g id="scene1-labels">
                <text x="80" y="165" class="scene1-label">开关</text>
                <text x="50" y="305" class="scene1-label">小灯泡</text>
                <text x="520" y="95" text-anchor="middle" class="scene1-label">滑动变阻器</text>
                <text x="680" y="255" class="scene1-label">电流表</text>
                <text x="360" y="240" class="scene1-label">电源</text>
            </g>

            <!-- 高亮层：电流路径（步骤1） -->
            <g id="scene1-hl-path-group" style="opacity:0">
                <line x1="180" y1="140" x2="490" y2="140" class="scene1-hl-path" id="scene1-hl-path-1"/>
                <line x1="550" y1="140" x2="620" y2="140" class="scene1-hl-path" id="scene1-hl-path-2"/>
                <line x1="180" y1="140" x2="180" y2="155" class="scene1-hl-path" id="scene1-hl-path-3"/>
                <line x1="180" y1="185" x2="180" y2="282" class="scene1-hl-path" id="scene1-hl-path-4"/>
                <line x1="180" y1="318" x2="180" y2="380" class="scene1-hl-path" id="scene1-hl-path-5"/>
                <line x1="180" y1="380" x2="620" y2="380" class="scene1-hl-path" id="scene1-hl-path-6"/>
                <line x1="620" y1="140" x2="620" y2="230" class="scene1-hl-path" id="scene1-hl-path-7"/>
                <line x1="620" y1="270" x2="620" y2="380" class="scene1-hl-path" id="scene1-hl-path-8"/>
                <line x1="320" y1="140" x2="320" y2="215" class="scene1-hl-path" id="scene1-hl-path-9"/>
                <line x1="320" y1="245" x2="320" y2="380" class="scene1-hl-path" id="scene1-hl-path-10"/>
                <!-- 电流方向箭头 -->
                <polygon points="250,140 240,135 240,145" class="scene1-arrow" id="scene1-arrow-1"/>
                <polygon points="585,140 575,135 575,145" class="scene1-arrow" id="scene1-arrow-2"/>
                <polygon points="180,220 175,210 185,210" class="scene1-arrow" id="scene1-arrow-3"/>
                <polygon points="180,350 175,340 185,340" class="scene1-arrow" id="scene1-arrow-4"/>
                <polygon points="400,380 390,375 390,385" class="scene1-arrow" id="scene1-arrow-5"/>
                <polygon points="620,190 615,180 625,180" class="scene1-arrow" id="scene1-arrow-6"/>
                <polygon points="620,320 615,310 625,310" class="scene1-arrow" id="scene1-arrow-7"/>
                <polygon points="320,170 315,160 325,160" class="scene1-arrow" id="scene1-arrow-8"/>
                <polygon points="320,320 315,310 325,310" class="scene1-arrow" id="scene1-arrow-9"/>
            </g>

            <!-- 高亮层：电流表A（步骤2） -->
            <g id="scene1-hl-ammeter-group" style="opacity:0">
                <circle cx="620" cy="250" r="20" stroke="#1565c0" stroke-width="2" fill="#1565c0" fill-opacity="0.15"/>
            </g>

            <!-- 高亮层：电压表V₁（步骤3） -->
            <g id="scene1-hl-v1-group" style="opacity:0">
                <circle cx="120" cy="120" r="20" stroke="#2e7d32" stroke-width="2" fill="#2e7d32" fill-opacity="0.15"/>
                <polyline points="120,100 320,100 320,140" class="scene1-hl-v1" id="scene1-hl-v1-wire1"/>
                <polyline points="120,140 120,380 320,380" class="scene1-hl-v1" id="scene1-hl-v1-wire2"/>
            </g>

            <!-- 高亮层：电压表V₂（步骤4） -->
            <g id="scene1-hl-v2-group" style="opacity:0">
                <circle cx="280" cy="390" r="20" stroke="#f57c00" stroke-width="2" fill="#f57c00" fill-opacity="0.15"/>
                <polyline points="280,370 180,370 180,282" class="scene1-hl-v2" id="scene1-hl-v2-wire1"/>
                <polyline points="280,410 180,410 180,318" class="scene1-hl-v2" id="scene1-hl-v2-wire2"/>
            </g>

            <!-- 步骤标注文字 -->
            <g id="scene1-step-labels">
                <text x="400" y="80" text-anchor="middle" class="scene1-step-label" id="scene1-label-step1" style="opacity:0">串联电路</text>
                <text x="660" y="190" text-anchor="middle" class="scene1-step-label" id="scene1-label-step2" style="opacity:0">电流表测串联电路电流</text>
                <text x="150" y="70" text-anchor="middle" class="scene1-step-label" id="scene1-label-step3" style="opacity:0">电压表V₁测电源电压（电源电压恒定）</text>
                <text x="340" y="430" class="scene1-step-label" id="scene1-label-step4" style="opacity:0">电压表V₂测小灯泡电压</text>
            </g>
        </svg>

        <!-- HTML overlay: 总结框 -->
        <div id="scene1-summary-html">
            <div>① 电路为串联电路（电流只有一条路径）</div>
            <div>② 电流表A测串联电路中的电流</div>
            <div>③ 电压表V₁测电源电压，电压表V₂测小灯泡两端电压</div>
        </div>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        let currentStep = 0;
        const maxStep = 5;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');

        // 高亮元素组
        const hlPathGroup = document.getElementById('scene1-hl-path-group');
        const hlAmmeterGroup = document.getElementById('scene1-hl-ammeter-group');
        const hlV1Group = document.getElementById('scene1-hl-v1-group');
        const hlV2Group = document.getElementById('scene1-hl-v2-group');
        const summaryBox = document.getElementById('scene1-summary-html');

        // 标注文字
        const labelStep1 = document.getElementById('scene1-label-step1');
        const labelStep2 = document.getElementById('scene1-label-step2');
        const labelStep3 = document.getElementById('scene1-label-step3');
        const labelStep4 = document.getElementById('scene1-label-step4');

        function setOpacity(el, value) {
            if (el) {
                el.style.opacity = value;
            }
        }

        function updateStep() {
            // 先隐藏所有步骤专属元素
            setOpacity(hlPathGroup, 0);
            setOpacity(hlAmmeterGroup, 0);
            setOpacity(hlV1Group, 0);
            setOpacity(hlV2Group, 0);
            setOpacity(summaryBox, 0);
            setOpacity(labelStep1, 0);
            setOpacity(labelStep2, 0);
            setOpacity(labelStep3, 0);
            setOpacity(labelStep4, 0);

            // 根据当前步骤显示对应元素
            if (currentStep === 1) {
                setOpacity(hlPathGroup, 1);
                setOpacity(labelStep1, 1);
            } else if (currentStep === 2) {
                setOpacity(hlAmmeterGroup, 1);
                setOpacity(labelStep2, 1);
            } else if (currentStep === 3) {
                setOpacity(hlV1Group, 1);
                setOpacity(labelStep3, 1);
            } else if (currentStep === 4) {
                setOpacity(hlV2Group, 1);
                setOpacity(labelStep4, 1);
            } else if (currentStep === 5) {
                setOpacity(summaryBox, 1);
            }

            // 更新按钮状态
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < maxStep) {
                currentStep++;
                updateStep();
            }
        });

        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
