<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>突触结构识别</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            padding: 6px 16px; font-size: 14px; cursor: pointer;
            border: 1px solid #333; border-radius: 4px; background: #f5f5f5;
        }
        #scene1-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 13px; color: #555; min-width: 80px; text-align: center; }
        .scene1-step-group { transition: opacity 0.3s ease; }
        .scene1-hidden { display: none; opacity: 0; }
        .scene1-visible { display: block; opacity: 1; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 步骤0：基础结构 -->
            <g id="scene1-step0-group">
                <!-- 神经元A：胞体 + 轴突 + 突触小体 -->
                <ellipse id="scene1-neuron-a-body" cx="150" cy="340" rx="38" ry="26" fill="none" stroke="#000" stroke-width="1.5"/>
                <path id="scene1-neuron-a-axon" d="M188,332 Q220,315 250,300 T274,290" fill="none" stroke="#000" stroke-width="1.5"/>
                <ellipse id="scene1-neuron-a-bouton" cx="290" cy="290" rx="16" ry="12" fill="none" stroke="#000" stroke-width="1.5"/>
                <!-- 神经元B：胞体 + 轴突 + 突触小体 -->
                <ellipse id="scene1-neuron-b-body" cx="365" cy="285" rx="48" ry="36" fill="none" stroke="#000" stroke-width="1.5"/>
                <line id="scene1-neuron-b-axon" x1="413" y1="285" x2="455" y2="285" stroke="#000" stroke-width="1.5"/>
                <ellipse id="scene1-neuron-b-bouton" cx="470" cy="285" rx="15" ry="12" fill="none" stroke="#000" stroke-width="1.5"/>
                <!-- 神经元C：胞体 + 轴突 -->
                <ellipse id="scene1-neuron-c-body" cx="585" cy="285" rx="42" ry="30" fill="none" stroke="#000" stroke-width="1.5"/>
                <line id="scene1-neuron-c-axon" x1="627" y1="285" x2="670" y2="285" stroke="#000" stroke-width="1.5"/>
                <!-- 电流计 -->
                <circle id="scene1-galvanometer" cx="430" cy="90" r="22" fill="none" stroke="#000" stroke-width="1.5"/>
                <text id="scene1-g-label" x="430" y="64" text-anchor="middle" font-size="16" fill="#000">G</text>
                <text id="scene1-galvanometer-label" x="370" y="90" text-anchor="end" font-size="14" fill="#000">电流计</text>
                <!-- 引线 -->
                <line id="scene1-wire-left" x1="430" y1="112" x2="305" y2="250" stroke="#000" stroke-width="1"/>
                <line id="scene1-wire-right" x1="430" y1="112" x2="670" y2="250" stroke="#000" stroke-width="1"/>
                <!-- 测量点 -->
                <circle id="scene1-point-a" cx="305" cy="250" r="3" fill="#000"/>
                <circle id="scene1-point-b" cx="365" cy="248" r="3" fill="#000"/>
                <circle id="scene1-point-c" cx="585" cy="248" r="3" fill="#000"/>
                <circle id="scene1-point-d" cx="670" cy="250" r="3" fill="#000"/>
                <!-- 基础标签：远离引线 -->
                <text id="scene1-label-a" x="285" y="230" text-anchor="middle" font-size="14" fill="#000">a</text>
                <text id="scene1-label-b" x="365" y="220" text-anchor="middle" font-size="14" fill="#000">b</text>
                <text id="scene1-label-c" x="615" y="210" text-anchor="middle" font-size="14" fill="#000">c</text>
                <text id="scene1-label-d" x="690" y="230" text-anchor="middle" font-size="14" fill="#000">d</text>
                <text id="scene1-label-A" x="150" y="390" text-anchor="middle" font-size="14" fill="#000">A</text>
                <text id="scene1-label-B" x="365" y="360" text-anchor="middle" font-size="14" fill="#000">B</text>
                <text id="scene1-label-C" x="585" y="345" text-anchor="middle" font-size="14" fill="#000">C</text>
            </g>

            <!-- 步骤1：神经元高亮（填充色淡入） -->
            <g id="scene1-step1-group" class="scene1-step-group scene1-hidden">
                <ellipse cx="150" cy="340" rx="38" ry="26" fill="#1565c0" fill-opacity="0.15" stroke="#1565c0" stroke-width="2.5"/>
                <ellipse cx="365" cy="285" rx="48" ry="36" fill="#2e7d32" fill-opacity="0.15" stroke="#2e7d32" stroke-width="2.5"/>
                <ellipse cx="585" cy="285" rx="42" ry="30" fill="#c62828" fill-opacity="0.15" stroke="#c62828" stroke-width="2.5"/>
            </g>

            <!-- 步骤2：突触结构与数量 -->
            <g id="scene1-step2-group" class="scene1-step-group scene1-hidden">
                <!-- 突触小泡A -->
                <circle cx="295" cy="288" r="3" fill="#1565c0" stroke="#1565c0" stroke-width="1"/>
                <circle cx="300" cy="292" r="2.5" fill="#1565c0" stroke="#1565c0" stroke-width="1"/>
                <circle cx="292" cy="293" r="2.5" fill="#1565c0" stroke="#1565c0" stroke-width="1"/>
                <!-- 突触小泡B -->
                <circle cx="475" cy="282" r="3" fill="#2e7d32" stroke="#2e7d32" stroke-width="1"/>
                <circle cx="480" cy="286" r="2.5" fill="#2e7d32" stroke="#2e7d32" stroke-width="1"/>
                <circle cx="468" cy="287" r="2.5" fill="#2e7d32" stroke="#2e7d32" stroke-width="1"/>
                <!-- 高亮框 -->
                <rect x="295" y="270" width="50" height="40" fill="#ffeb3b" fill-opacity="0.2" stroke="none"/>
                <rect x="460" y="265" width="50" height="40" fill="#ffeb3b" fill-opacity="0.2" stroke="none"/>
                <!-- 突触1标注（左下方，远离图形） -->
                <text x="200" y="400" text-anchor="middle" font-size="12" fill="#000">突触前膜</text>
                <text x="265" y="415" text-anchor="middle" font-size="12" fill="#000">突触间隙</text>
                <text x="330" y="400" text-anchor="middle" font-size="12" fill="#000">突触后膜</text>
                <!-- 突触2标注（右上方，远离引线和c标签） -->
                <text x="520" y="210" text-anchor="middle" font-size="12" fill="#000">突触前膜</text>
                <text x="585" y="195" text-anchor="middle" font-size="12" fill="#000">突触间隙</text>
                <text x="650" y="210" text-anchor="middle" font-size="12" fill="#000">突触后膜</text>
                <!-- 错误提示（顶部偏左，远离电流计） -->
                <text x="200" y="55" text-anchor="middle" font-size="16" fill="#c62828" font-weight="bold">共2个突触</text>
            </g>

            <!-- 步骤3：结构类型判断 -->
            <g id="scene1-step3-group" class="scene1-step-group scene1-hidden">
                <!-- 引线到A突触小体 -->
                <line x1="240" y1="270" x2="275" y2="290" stroke="#888" stroke-width="1" stroke-dasharray="4,2"/>
                <text x="235" y="265" text-anchor="end" font-size="12" fill="#000">突触小体</text>
                <!-- B左侧树突/胞体（左下方，远离突触标注） -->
                <text x="310" y="445" text-anchor="middle" font-size="12" fill="#000">树突/胞体</text>
                <!-- B右侧轴突 -->
                <text x="430" y="310" text-anchor="middle" font-size="12" fill="#000">轴突</text>
                <!-- C左侧树突或胞体（右下方，远离突触标注） -->
                <text x="520" y="445" text-anchor="middle" font-size="12" fill="#000">树突或胞体</text>
            </g>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1 / 4</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        var currentStep = 0;
        var totalSteps = 4;
        var btnPrev = document.getElementById('scene1-btn-prev');
        var btnNext = document.getElementById('scene1-btn-next');
        var indicator = document.getElementById('scene1-step-indicator');
        var groups = [
            document.getElementById('scene1-step0-group'),
            document.getElementById('scene1-step1-group'),
            document.getElementById('scene1-step2-group'),
            document.getElementById('scene1-step3-group')
        ];

        function render() {
            for (var i = 1; i < groups.length; i++) {
                if (i <= currentStep) {
                    groups[i].classList.remove('scene1-hidden');
                    groups[i].classList.add('scene1-visible');
                } else {
                    groups[i].classList.remove('scene1-visible');
                    groups[i].classList.add('scene1-hidden');
                }
            }
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps - 1;
            indicator.textContent = '步骤 ' + (currentStep + 1) + ' / ' + totalSteps;
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                render();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                render();
            }
        });

        render();
    })();
    </script>
</body>
</html>
