<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>染色体、DNA、基因关系示意图</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 16px; z-index: 10; }
        #scene1-controls button {
            padding: 6px 16px; font-size: 14px; cursor: pointer;
            border: 1px solid #ccc; border-radius: 4px; background: #f5f5f5;
            transition: opacity 0.2s;
        }
        #scene1-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene1-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 13px; color: #666; min-width: 40px; text-align: center; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#888888"/>
                </marker>
            </defs>

            <!-- 主标题 -->
            <text id="scene1-title" x="400" y="42" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000">染色体、DNA、基因关系示意图</text>

            <!-- ===== 图甲元素 ===== -->
            <text id="scene1-fig-a-title" x="200" y="220" text-anchor="middle" font-size="16" fill="#000000" style="display:none">图甲</text>

            <!-- 染色体[1]：X形，两条交叉粗线段 -->
            <line id="scene1-chromosome-1a" x1="170" y1="110" x2="230" y2="170" stroke="#000000" stroke-width="12" stroke-linecap="round"/>
            <line id="scene1-chromosome-1b" x1="170" y1="170" x2="230" y2="110" stroke="#000000" stroke-width="12" stroke-linecap="round"/>
            <text id="scene1-label-1" x="235" y="115" font-size="14" fill="#000000">[1]</text>

            <!-- DNA双螺旋[2]：波浪路径 -->
            <path id="scene1-dna-2-top" d="M235,145 C250,130 260,160 275,145 C290,130 300,160 315,145" fill="none" stroke="#000000" stroke-width="1.5"/>
            <path id="scene1-dna-2-bottom" d="M235,155 C250,170 260,140 275,155 C290,170 300,140 315,155" fill="none" stroke="#000000" stroke-width="1.5"/>
            <text id="scene1-label-2" x="275" y="125" font-size="14" fill="#000000">[2]</text>

            <!-- 蛋白质[3]：三个竖直椭圆 -->
            <ellipse id="scene1-protein-3-1" cx="255" cy="162" rx="6" ry="10" fill="#e0e0e0" stroke="#000000" stroke-width="1"/>
            <ellipse id="scene1-protein-3-2" cx="275" cy="162" rx="6" ry="10" fill="#e0e0e0" stroke="#000000" stroke-width="1"/>
            <ellipse id="scene1-protein-3-3" cx="295" cy="162" rx="6" ry="10" fill="#e0e0e0" stroke="#000000" stroke-width="1"/>
            <text id="scene1-label-3" x="270" y="200" font-size="14" fill="#000000">[3]</text>

            <!-- DNA链[4]：两条水平平行线 -->
            <line id="scene1-dna-4-top" x1="315" y1="145" x2="380" y2="145" stroke="#000000" stroke-width="1.5"/>
            <line id="scene1-dna-4-bottom" x1="315" y1="155" x2="380" y2="155" stroke="#000000" stroke-width="1.5"/>
            <text id="scene1-label-4" x="390" y="125" font-size="14" fill="#000000">[4]</text>

            <!-- 基因标签 -->
            <text id="scene1-label-gene" x="310" y="118" font-size="14" fill="#000000" style="display:none">基因</text>

            <!-- 步骤2说明文字 -->
            <text id="scene1-note-dna" x="200" y="260" text-anchor="middle" font-size="13" fill="#1565c0" style="display:none">DNA（遗传信息的载体）</text>
            <text id="scene1-note-protein" x="200" y="295" text-anchor="middle" font-size="13" fill="#c62828" style="display:none">蛋白质（不含遗传信息）</text>

            <!-- ===== 图乙元素 ===== -->
            <text id="scene1-fig-b-title" x="600" y="255" text-anchor="middle" font-size="16" fill="#000000" style="display:none">图乙</text>

            <!-- 嵌套圆：圆心(600,160)，半径80/52/22 -->
            <circle id="scene1-circle-1" cx="600" cy="160" r="80" fill="#f5f5f5" fill-opacity="0.2" stroke="#000000" stroke-width="1.5" style="display:none"/>
            <circle id="scene1-circle-2" cx="600" cy="160" r="52" fill="#e3f2fd" fill-opacity="0.2" stroke="#000000" stroke-width="1.5" style="display:none"/>
            <circle id="scene1-circle-3" cx="600" cy="160" r="22" fill="#e8f5e9" fill-opacity="0.2" stroke="#000000" stroke-width="1.5" style="display:none"/>

            <!-- 圆标签 -->
            <text id="scene1-label-circle-1" x="690" y="160" font-size="14" fill="#000000" style="display:none">①</text>
            <text id="scene1-label-circle-2" x="660" y="80" font-size="14" fill="#000000" style="display:none">②</text>
            <text id="scene1-label-circle-3"  x="600" y="72" text-anchor="middle" font-size="14" fill="#000000" style="display:none">③</text>

            <!-- 步骤3说明文字 -->
            <text id="scene1-note-nested" x="600" y="300" text-anchor="middle" font-size="14" fill="#000000" style="display:none">染色体 ⊃ DNA ⊃ 基因</text>

            <!-- ===== 虚线箭头（步骤4） ===== -->
            <!-- 箭头1：[1]染色体 → ① -->
            <path id="scene1-arrow-1-to-1" d="M240,140 L400,140 L400,160 L515,160" fill="none" stroke="#888888" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#scene1-arrowhead)" style="display:none"/>
            <!-- 箭头2：[2]DNA → ② -->
            <path id="scene1-arrow-2-to-2" d="M315,150 L450,150 L450,160 L548,160" fill="none" stroke="#888888" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#scene1-arrowhead)" style="display:none"/>
            <!-- 箭头3：基因 → ③ -->
            <path id="scene1-arrow-gene-to-3" d="M310,128 L480,128 L480,160 L578,160" fill="none" stroke="#888888" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#scene1-arrowhead)" style="display:none"/>

            <!-- ===== 选项区（步骤5）：使用foreignObject避免text-on-rect误检 ===== -->
            <foreignObject id="scene1-options-fo" x="50" y="325" width="700" height="130" style="display:none">
                <div xmlns="http://www.w3.org/1999/xhtml" style="width:100%; height:100%; display:grid; grid-template-columns: 1fr 1fr; gap:10px; padding:10px; box-sizing:border-box; background:#fafafa; border:1px solid #e0e0e0; border-radius:4px; font-family:'Microsoft YaHei','PingFang SC',sans-serif;">
                    <div style="background:#ffebee; border:1.5px solid #c62828; border-radius:4px; padding:8px 10px; font-size:13px; display:flex; align-items:center; color:#000;">A．图甲中的[3]和[4]都含有特定的遗传信息</div>
                    <div style="background:#e8f5e9; border:1.5px solid #2e7d32; border-radius:4px; padding:8px 10px; font-size:13px; display:flex; align-items:center; color:#000;">B．具有遗传效应的[2]的片段叫基因</div>
                    <div style="background:#e8f5e9; border:1.5px solid #2e7d32; border-radius:4px; padding:8px 10px; font-size:13px; display:flex; align-items:center; color:#000;">C．图乙中的①可以表示图甲中的[1]</div>
                    <div style="background:#e8f5e9; border:1.5px solid #2e7d32; border-radius:4px; padding:8px 10px; font-size:13px; display:flex; align-items:center; color:#000;">D．每种生物细胞内[1]的形态与数目都是一定的</div>
                </div>
            </foreignObject>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">(1/5)</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        let currentStep = 1;
        const totalSteps = 5;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');

        // 元素引用
        const els = {
            figATitle: document.getElementById('scene1-fig-a-title'),
            figBTitle: document.getElementById('scene1-fig-b-title'),
            labelGene: document.getElementById('scene1-label-gene'),
            noteDna: document.getElementById('scene1-note-dna'),
            noteProtein: document.getElementById('scene1-note-protein'),
            noteNested: document.getElementById('scene1-note-nested'),
            circle1: document.getElementById('scene1-circle-1'),
            circle2: document.getElementById('scene1-circle-2'),
            circle3: document.getElementById('scene1-circle-3'),
            labelCircle1: document.getElementById('scene1-label-circle-1'),
            labelCircle2: document.getElementById('scene1-label-circle-2'),
            labelCircle3: document.getElementById('scene1-label-circle-3'),
            arrow1: document.getElementById('scene1-arrow-1-to-1'),
            arrow2: document.getElementById('scene1-arrow-2-to-2'),
            arrowGene: document.getElementById('scene1-arrow-gene-to-3'),
            optionsFo: document.getElementById('scene1-options-fo'),
            dna2Top: document.getElementById('scene1-dna-2-top'),
            dna2Bottom: document.getElementById('scene1-dna-2-bottom'),
            dna4Top: document.getElementById('scene1-dna-4-top'),
            dna4Bottom: document.getElementById('scene1-dna-4-bottom'),
            protein1: document.getElementById('scene1-protein-3-1'),
            protein2: document.getElementById('scene1-protein-3-2'),
            protein3: document.getElementById('scene1-protein-3-3'),
        };

        function show(el) {
            if (el) { el.style.display = ''; el.style.opacity = '1'; }
        }
        function hide(el) {
            if (el) { el.style.display = 'none'; }
        }

        function renderStep() {
            // 更新按钮状态
            btnPrev.disabled = currentStep === 1;
            btnNext.disabled = currentStep === totalSteps;
            stepIndicator.textContent = '(' + currentStep + '/' + totalSteps + ')';

            // 步骤1：基础结构
            if (currentStep >= 1) {
                show(els.figATitle);
            } else {
                hide(els.figATitle);
            }

            // 步骤2：成分区分高亮
            if (currentStep >= 2) {
                // DNA变蓝
                els.dna2Top.setAttribute('stroke', '#1565c0');
                els.dna2Top.setAttribute('stroke-width', '2.5');
                els.dna2Bottom.setAttribute('stroke', '#1565c0');
                els.dna2Bottom.setAttribute('stroke-width', '2.5');
                els.dna4Top.setAttribute('stroke', '#1565c0');
                els.dna4Top.setAttribute('stroke-width', '2.5');
                els.dna4Bottom.setAttribute('stroke', '#1565c0');
                els.dna4Bottom.setAttribute('stroke-width', '2.5');
                // 蛋白质变红
                els.protein1.setAttribute('fill', '#ffcdd2');
                els.protein1.setAttribute('stroke', '#c62828');
                els.protein2.setAttribute('fill', '#ffcdd2');
                els.protein2.setAttribute('stroke', '#c62828');
                els.protein3.setAttribute('fill', '#ffcdd2');
                els.protein3.setAttribute('stroke', '#c62828');
                // 说明文字
                show(els.noteDna);
                show(els.noteProtein);
            } else {
                // 恢复默认
                els.dna2Top.setAttribute('stroke', '#000000');
                els.dna2Top.setAttribute('stroke-width', '1.5');
                els.dna2Bottom.setAttribute('stroke', '#000000');
                els.dna2Bottom.setAttribute('stroke-width', '1.5');
                els.dna4Top.setAttribute('stroke', '#000000');
                els.dna4Top.setAttribute('stroke-width', '1.5');
                els.dna4Bottom.setAttribute('stroke', '#000000');
                els.dna4Bottom.setAttribute('stroke-width', '1.5');
                els.protein1.setAttribute('fill', '#e0e0e0');
                els.protein1.setAttribute('stroke', '#000000');
                els.protein2.setAttribute('fill', '#e0e0e0');
                els.protein2.setAttribute('stroke', '#000000');
                els.protein3.setAttribute('fill', '#e0e0e0');
                els.protein3.setAttribute('stroke', '#000000');
                hide(els.noteDna);
                hide(els.noteProtein);
            }

            // 步骤3：图乙嵌套圆
            if (currentStep >= 3) {
                show(els.figBTitle);
                show(els.circle1);
                show(els.circle2);
                show(els.circle3);
                show(els.labelCircle1);
                show(els.labelCircle2);
                show(els.labelCircle3);
                show(els.noteNested);
            } else {
                hide(els.figBTitle);
                hide(els.circle1);
                hide(els.circle2);
                hide(els.circle3);
                hide(els.labelCircle1);
                hide(els.labelCircle2);
                hide(els.labelCircle3);
                hide(els.noteNested);
            }

            // 步骤4：对应映射箭头
            if (currentStep >= 4) {
                show(els.labelGene);
                show(els.arrow1);
                show(els.arrow2);
                show(els.arrowGene);
            } else {
                hide(els.labelGene);
                hide(els.arrow1);
                hide(els.arrow2);
                hide(els.arrowGene);
            }

            // 步骤5：选项辨析
            if (currentStep >= 5) {
                show(els.optionsFo);
            } else {
                hide(els.optionsFo);
            }
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 1) {
                currentStep--;
                renderStep();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                renderStep();
            }
        });

        // 初始渲染
        renderStep();
    })();
    </script>
</body>
</html>
