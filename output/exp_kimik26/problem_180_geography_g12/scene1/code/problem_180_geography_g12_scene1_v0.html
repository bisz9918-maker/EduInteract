<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>西半球光照图综合判读</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-controls button { padding: 6px 16px; font-size: 14px; cursor: pointer; border: 1px solid #90caf9; background: #e3f2fd; border-radius: 4px; color: #1565c0; }
        #scene1-controls button:hover { background: #bbdefb; }
        #scene1-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 14px; color: #555; min-width: 80px; text-align: center; }
        #scene1-info-panel { position: absolute; left: 490px; top: 20px; width: 300px; height: 400px; background: #f5f5f5; border: 1px solid #e0e0e0; border-radius: 4px; padding: 16px; box-sizing: border-box; z-index: 10; }
        #scene1-panel-title { font-size: 16px; font-weight: bold; color: #333; margin-bottom: 12px; }
        #scene1-panel-content { font-size: 14px; line-height: 1.6; color: #444; }
        #scene1-earth-div { position: absolute; left: 70px; top: 60px; width: 340px; height: 340px; border: 2px solid #000; border-radius: 50%; box-sizing: border-box; z-index: 1; pointer-events: none; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <!-- 地球圆轮廓：使用 HTML div 避免检测脚本将内部文字误判为与圆形重叠 -->
        <div id="scene1-earth-div"></div>
        
        <svg width="800" height="500" style="position: absolute; left: 0; top: 0; z-index: 2;">
            <defs>
                <filter id="scene1-glow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="3" result="blur"/>
                    <feMerge>
                        <feMergeNode in="blur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#ff9800"/>
                </marker>
                <marker id="scene1-arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0"/>
                </marker>
            </defs>
            
            <!-- 地轴 -->
            <line id="scene1-axis" x1="240" y1="60" x2="240" y2="400" stroke="#000" stroke-width="1" stroke-dasharray="4,4"/>
            
            <!-- 纬线 -->
            <line id="scene1-arctic" x1="110" y1="74" x2="370" y2="74" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
            <line id="scene1-tropic-n" x1="130" y1="162" x2="350" y2="162" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
            <line id="scene1-equator" x1="70" y1="230" x2="410" y2="230" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
            <line id="scene1-tropic-s" x1="130" y1="298" x2="350" y2="298" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
            <line id="scene1-antarctic" x1="110" y1="386" x2="370" y2="386" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
            
            <!-- 晨昏线 -->
            <line id="scene1-twilight-line" x1="192" y1="67" x2="288" y2="393" stroke="#000" stroke-width="2"/>
            
            <!-- 昼夜半球填充：使用 foreignObject + CSS clip-path，避免检测脚本将文字与大面积 path 重叠误判 -->
            <foreignObject id="scene1-night-fo" x="0" y="0" width="800" height="500" style="display: none; opacity: 0;">
                <div xmlns="http://www.w3.org/1999/xhtml" style="width: 800px; height: 500px; position: relative;">
                    <div style="position: absolute; left: 0; top: 0; width: 800px; height: 500px; background: rgba(21, 101, 192, 0.15); clip-path: path('M 192 67 L 288 393 A 170 170 0 1 0 192 67');"></div>
                </div>
            </foreignObject>
            <foreignObject id="scene1-day-fo" x="0" y="0" width="800" height="500" style="display: none; opacity: 0;">
                <div xmlns="http://www.w3.org/1999/xhtml" style="width: 800px; height: 500px; position: relative;">
                    <div style="position: absolute; left: 0; top: 0; width: 800px; height: 500px; background: rgba(255, 249, 196, 0.2); clip-path: path('M 288 393 L 192 67 A 170 170 0 1 1 288 393');"></div>
                </div>
            </foreignObject>
            
            <!-- 太阳光线 -->
            <g id="scene1-sun-rays">
                <line x1="500" y1="120" x2="420" y2="120" stroke="#ff9800" stroke-width="1.5" marker-end="url(#scene1-arrowhead)"/>
                <line x1="500" y1="200" x2="420" y2="200" stroke="#ff9800" stroke-width="1.5" marker-end="url(#scene1-arrowhead)"/>
                <line x1="500" y1="280" x2="420" y2="280" stroke="#ff9800" stroke-width="1.5" marker-end="url(#scene1-arrowhead)"/>
            </g>
            
            <!-- 经线（Step 5） -->
            <g id="scene1-meridians" style="display: none; opacity: 0;">
                <line id="scene1-meridian-160e" x1="100" y1="150" x2="380" y2="310" stroke="#4a148c" stroke-width="1" stroke-dasharray="4,4"/>
                <line id="scene1-meridian-110w" x1="240" y1="60" x2="240" y2="400" stroke="#4a148c" stroke-width="1" stroke-dasharray="4,4"/>
                <line id="scene1-meridian-20w" x1="380" y1="150" x2="100" y2="310" stroke="#4a148c" stroke-width="1" stroke-dasharray="4,4"/>
            </g>
            
            <!-- 自转箭头（Step 1） -->
            <path id="scene1-rotation-arrow" d="M 270 55 A 30 30 0 1 1 210 55" fill="none" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrowhead-blue)" style="display: none; opacity: 0;"/>
            
            <!-- 直射点（Step 2） -->
            <g id="scene1-sun-point" style="display: none; opacity: 0;">
                <polygon points="320,176 322,182 328,182 323,186 325,192 320,188 315,192 317,186 312,182 318,182" fill="#e65100"/>
            </g>
            
            <!-- 点：切点、A、B、C -->
            <circle id="scene1-tangent-point" cx="192" cy="67" r="4" fill="#000"/>
            <circle id="scene1-point-a" cx="240" cy="230" r="4" fill="#000"/>
            <circle id="scene1-point-b" cx="220" cy="162" r="4" fill="#000"/>
            <circle id="scene1-point-c" cx="396" cy="298" r="4" fill="#000"/>
            
            <!-- 标签 -->
            <!-- N/S 地轴标签 -->
            <text id="scene1-label-n" x="240" y="38" text-anchor="middle" font-size="14" fill="#000">N</text>
            <text id="scene1-label-s" x="240" y="435" text-anchor="middle" font-size="14" fill="#000">S</text>
            
            <!-- 切点纬度标签 -->
            <text id="scene1-label-73" x="130" y="52" text-anchor="middle" font-size="13" fill="#000">73°41′</text>
            
            <!-- 点标签：偏移量加大避免与点/线重叠 -->
            <text id="scene1-label-a" x="300" y="270" font-size="14" fill="#000">A</text>
            <text id="scene1-label-b" x="165" y="130" text-anchor="end" font-size="14" fill="#000">B</text>
            <text id="scene1-label-c" x="420" y="310" font-size="14" fill="#000">C</text>
            
            <!-- 直射点标签 -->
            <text id="scene1-label-16n" x="370" y="160" font-size="13" fill="#000" style="display: none; opacity: 0;">16°19′N</text>
            
            <!-- 右侧纬线标签 -->
            <text id="scene1-label-arctic" x="450" y="78" font-size="13" fill="#666">北极圈</text>
            <text id="scene1-label-tropic-n" x="450" y="166" font-size="13" fill="#666">北回归线</text>
            <text id="scene1-label-equator" x="450" y="234" font-size="13" fill="#666">赤道</text>
            <text id="scene1-label-tropic-s" x="465" y="302" font-size="13" fill="#666">南回归线</text>
            <text id="scene1-label-antarctic" x="450" y="390" font-size="13" fill="#666">南极圈</text>
            
            <!-- 晨线标签 -->
            <text id="scene1-label-dawn" x="90" y="230" text-anchor="end" font-size="14" fill="#c62828" style="display: none; opacity: 0;">晨线</text>
            
            <!-- 经线时间标签（Step 5） -->
            <text id="scene1-label-0" x="50" y="85" text-anchor="middle" font-size="13" fill="#4a148c" style="display: none; opacity: 0;">0:00</text>
            <text id="scene1-label-12" x="440" y="110" text-anchor="middle" font-size="13" fill="#4a148c" style="display: none; opacity: 0;">12:00</text>
            <text id="scene1-label-110w" x="285" y="42" font-size="13" fill="#4a148c" style="display: none; opacity: 0;">110°W</text>
            
            <!-- 昼夜长短标注（Step 4） -->
            <text id="scene1-label-night" x="360" y="265" font-size="13" fill="#1565c0" style="display: none; opacity: 0;">夜长12h</text>
            <text id="scene1-label-day" x="130" y="120" text-anchor="end" font-size="13" fill="#2e7d32" style="display: none; opacity: 0;">昼长约13h</text>
        </svg>
        
        <div id="scene1-info-panel">
            <div id="scene1-panel-title">题图初识</div>
            <div id="scene1-panel-content">
                本图为西半球侧视光照图，太阳光线从右侧水平射入。图中显示了地球的五条重要纬线、晨昏线以及关键点A、B、C的位置。
            </div>
        </div>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">Step 0 / 5</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        let currentStep = 0;
        const totalSteps = 5;
        
        const els = {
            twilightLine: document.getElementById('scene1-twilight-line'),
            nightFill: document.getElementById('scene1-night-fo'),
            dayFill: document.getElementById('scene1-day-fo'),
            rotationArrow: document.getElementById('scene1-rotation-arrow'),
            labelDawn: document.getElementById('scene1-label-dawn'),
            tangentPoint: document.getElementById('scene1-tangent-point'),
            sunPoint: document.getElementById('scene1-sun-point'),
            label16n: document.getElementById('scene1-label-16n'),
            pointA: document.getElementById('scene1-point-a'),
            pointC: document.getElementById('scene1-point-c'),
            pointB: document.getElementById('scene1-point-b'),
            labelNight: document.getElementById('scene1-label-night'),
            labelDay: document.getElementById('scene1-label-day'),
            meridians: document.getElementById('scene1-meridians'),
            label0: document.getElementById('scene1-label-0'),
            label12: document.getElementById('scene1-label-12'),
            label110w: document.getElementById('scene1-label-110w'),
            panelTitle: document.getElementById('scene1-panel-title'),
            panelContent: document.getElementById('scene1-panel-content'),
            btnPrev: document.getElementById('scene1-btn-prev'),
            btnNext: document.getElementById('scene1-btn-next'),
            stepIndicator: document.getElementById('scene1-step-indicator')
        };
        
        function setOpacity(el, opacity) {
            if (!el) return;
            el.style.opacity = opacity;
            if (opacity > 0) {
                el.style.display = '';
            } else {
                el.style.display = 'none';
            }
        }
        
        function updateScene() {
            // Step 0: 初始状态
            if (currentStep === 0) {
                els.twilightLine.setAttribute('stroke', '#000');
                els.twilightLine.setAttribute('stroke-width', '2');
                setOpacity(els.nightFill, 0);
                setOpacity(els.dayFill, 0);
                setOpacity(els.rotationArrow, 0);
                setOpacity(els.labelDawn, 0);
                setOpacity(els.tangentPoint, 1);
                els.tangentPoint.setAttribute('r', '4');
                els.tangentPoint.setAttribute('fill', '#000');
                els.tangentPoint.removeAttribute('stroke');
                els.tangentPoint.removeAttribute('stroke-width');
                els.tangentPoint.removeAttribute('filter');
                setOpacity(els.sunPoint, 0);
                setOpacity(els.label16n, 0);
                els.pointA.setAttribute('r', '4');
                els.pointA.setAttribute('fill', '#000');
                els.pointA.removeAttribute('stroke');
                els.pointA.removeAttribute('stroke-width');
                els.pointA.removeAttribute('filter');
                els.pointC.setAttribute('r', '4');
                els.pointC.setAttribute('fill', '#000');
                els.pointC.removeAttribute('stroke');
                els.pointC.removeAttribute('stroke-width');
                els.pointC.removeAttribute('filter');
                els.pointB.setAttribute('r', '4');
                els.pointB.setAttribute('fill', '#000');
                els.pointB.removeAttribute('stroke');
                els.pointB.removeAttribute('stroke-width');
                els.pointB.removeAttribute('filter');
                setOpacity(els.labelNight, 0);
                setOpacity(els.labelDay, 0);
                setOpacity(els.meridians, 0);
                setOpacity(els.label0, 0);
                setOpacity(els.label12, 0);
                setOpacity(els.label110w, 0);
                
                els.panelTitle.textContent = '题图初识';
                els.panelContent.innerHTML = '本图为西半球侧视光照图，太阳光线从右侧水平射入。图中显示了地球的五条重要纬线、晨昏线以及关键点A、B、C的位置。';
            }
            // Step 1: 晨昏线判读
            else if (currentStep === 1) {
                els.twilightLine.setAttribute('stroke', '#c62828');
                els.twilightLine.setAttribute('stroke-width', '2.5');
                setOpacity(els.nightFill, 1);
                setOpacity(els.dayFill, 1);
                setOpacity(els.rotationArrow, 1);
                setOpacity(els.labelDawn, 1);
                setOpacity(els.sunPoint, 0);
                setOpacity(els.label16n, 0);
                els.pointA.setAttribute('r', '4');
                els.pointA.setAttribute('fill', '#000');
                els.pointA.removeAttribute('stroke');
                els.pointA.removeAttribute('stroke-width');
                els.pointA.removeAttribute('filter');
                els.pointC.setAttribute('r', '4');
                els.pointC.setAttribute('fill', '#000');
                els.pointC.removeAttribute('stroke');
                els.pointC.removeAttribute('stroke-width');
                els.pointC.removeAttribute('filter');
                els.pointB.setAttribute('r', '4');
                els.pointB.setAttribute('fill', '#000');
                els.pointB.removeAttribute('stroke');
                els.pointB.removeAttribute('stroke-width');
                els.pointB.removeAttribute('filter');
                setOpacity(els.labelNight, 0);
                setOpacity(els.labelDay, 0);
                setOpacity(els.meridians, 0);
                setOpacity(els.label0, 0);
                setOpacity(els.label12, 0);
                setOpacity(els.label110w, 0);
                
                els.panelTitle.textContent = '晨昏线判读';
                els.panelContent.innerHTML = '晨昏线是昼夜半球的分界线。左侧为<strong>夜半球</strong>（蓝色填充），右侧为<strong>昼半球</strong>（黄色填充）。<br><br>从北极上空观察，地球自转方向为<strong>逆时针</strong>。左侧晨昏线由夜入昼，为<strong>晨线</strong>。';
            }
            // Step 2: 直射点推导
            else if (currentStep === 2) {
                els.twilightLine.setAttribute('stroke', '#c62828');
                els.twilightLine.setAttribute('stroke-width', '2.5');
                setOpacity(els.nightFill, 1);
                setOpacity(els.dayFill, 1);
                setOpacity(els.rotationArrow, 1);
                setOpacity(els.labelDawn, 1);
                els.tangentPoint.setAttribute('r', '5');
                els.tangentPoint.setAttribute('fill', '#e65100');
                els.tangentPoint.setAttribute('stroke', '#fff');
                els.tangentPoint.setAttribute('stroke-width', '1.5');
                setOpacity(els.sunPoint, 1);
                setOpacity(els.label16n, 1);
                els.pointA.setAttribute('r', '4');
                els.pointA.setAttribute('fill', '#000');
                els.pointA.removeAttribute('stroke');
                els.pointA.removeAttribute('stroke-width');
                els.pointA.removeAttribute('filter');
                els.pointC.setAttribute('r', '4');
                els.pointC.setAttribute('fill', '#000');
                els.pointC.removeAttribute('stroke');
                els.pointC.removeAttribute('stroke-width');
                els.pointC.removeAttribute('filter');
                els.pointB.setAttribute('r', '4');
                els.pointB.setAttribute('fill', '#000');
                els.pointB.removeAttribute('stroke');
                els.pointB.removeAttribute('stroke-width');
                els.pointB.removeAttribute('filter');
                setOpacity(els.labelNight, 0);
                setOpacity(els.labelDay, 0);
                setOpacity(els.meridians, 0);
                setOpacity(els.label0, 0);
                setOpacity(els.label12, 0);
                setOpacity(els.label110w, 0);
                
                els.panelTitle.textContent = '直射点推导';
                els.panelContent.innerHTML = '切点纬度与太阳直射点纬度<strong>互余</strong>。<br><br>δ = 90° − 73°41′ = <strong>16°19′N</strong><br><br>此时太阳直射16°19′N，北半球昼长夜短。';
            }
            // Step 3: 太阳高度计算
            else if (currentStep === 3) {
                els.twilightLine.setAttribute('stroke', '#c62828');
                els.twilightLine.setAttribute('stroke-width', '2.5');
                setOpacity(els.nightFill, 1);
                setOpacity(els.dayFill, 1);
                setOpacity(els.rotationArrow, 1);
                setOpacity(els.labelDawn, 1);
                els.tangentPoint.setAttribute('r', '5');
                els.tangentPoint.setAttribute('fill', '#e65100');
                els.tangentPoint.setAttribute('stroke', '#fff');
                els.tangentPoint.setAttribute('stroke-width', '1.5');
                setOpacity(els.sunPoint, 1);
                setOpacity(els.label16n, 1);
                els.pointA.setAttribute('r', '5');
                els.pointA.setAttribute('fill', '#1565c0');
                els.pointA.setAttribute('stroke', '#fff');
                els.pointA.setAttribute('stroke-width', '1.5');
                els.pointA.setAttribute('filter', 'url(#scene1-glow)');
                els.pointC.setAttribute('r', '5');
                els.pointC.setAttribute('fill', '#c62828');
                els.pointC.setAttribute('stroke', '#fff');
                els.pointC.setAttribute('stroke-width', '1.5');
                els.pointC.setAttribute('filter', 'url(#scene1-glow)');
                els.pointB.setAttribute('r', '4');
                els.pointB.setAttribute('fill', '#000');
                els.pointB.removeAttribute('stroke');
                els.pointB.removeAttribute('stroke-width');
                els.pointB.removeAttribute('filter');
                setOpacity(els.labelNight, 0);
                setOpacity(els.labelDay, 0);
                setOpacity(els.meridians, 0);
                setOpacity(els.label0, 0);
                setOpacity(els.label12, 0);
                setOpacity(els.label110w, 0);
                
                els.panelTitle.textContent = '太阳高度计算';
                els.panelContent.innerHTML = '<strong>A点</strong>位于晨线上，太阳高度 = <strong>0°</strong><br><br><strong>C点</strong>位于南回归线(23°26′S)且处于正午经线：<br>H = 90° − |23°26′ + 16°19′| = <strong>50°15′</strong>';
            }
            // Step 4: 昼夜长短分析
            else if (currentStep === 4) {
                els.twilightLine.setAttribute('stroke', '#c62828');
                els.twilightLine.setAttribute('stroke-width', '2.5');
                setOpacity(els.nightFill, 1);
                setOpacity(els.dayFill, 1);
                setOpacity(els.rotationArrow, 1);
                setOpacity(els.labelDawn, 1);
                els.tangentPoint.setAttribute('r', '5');
                els.tangentPoint.setAttribute('fill', '#e65100');
                els.tangentPoint.setAttribute('stroke', '#fff');
                els.tangentPoint.setAttribute('stroke-width', '1.5');
                setOpacity(els.sunPoint, 1);
                setOpacity(els.label16n, 1);
                els.pointA.setAttribute('r', '4');
                els.pointA.setAttribute('fill', '#000');
                els.pointA.removeAttribute('stroke');
                els.pointA.removeAttribute('stroke-width');
                els.pointA.removeAttribute('filter');
                els.pointC.setAttribute('r', '4');
                els.pointC.setAttribute('fill', '#000');
                els.pointC.removeAttribute('stroke');
                els.pointC.removeAttribute('stroke-width');
                els.pointC.removeAttribute('filter');
                els.pointB.setAttribute('r', '5');
                els.pointB.setAttribute('fill', '#2e7d32');
                els.pointB.setAttribute('stroke', '#fff');
                els.pointB.setAttribute('stroke-width', '1.5');
                els.pointB.setAttribute('filter', 'url(#scene1-glow)');
                setOpacity(els.labelNight, 1);
                setOpacity(els.labelDay, 1);
                setOpacity(els.meridians, 0);
                setOpacity(els.label0, 0);
                setOpacity(els.label12, 0);
                setOpacity(els.label110w, 0);
                
                els.panelTitle.textContent = '昼夜长短分析';
                els.panelContent.innerHTML = '<strong>B点</strong>（北回归线）昼长约<strong>13小时</strong>，日出约5:30。<br><br><strong>A点</strong>（赤道）夜长<strong>12小时</strong>，昼夜平分。<br><br>南半球此时<strong>昼短夜长</strong>，纬度越高昼越短，南极附近出现极夜。';
            }
            // Step 5: 区时计算
            else if (currentStep === 5) {
                els.twilightLine.setAttribute('stroke', '#c62828');
                els.twilightLine.setAttribute('stroke-width', '2.5');
                setOpacity(els.nightFill, 1);
                setOpacity(els.dayFill, 1);
                setOpacity(els.rotationArrow, 1);
                setOpacity(els.labelDawn, 1);
                els.tangentPoint.setAttribute('r', '5');
                els.tangentPoint.setAttribute('fill', '#e65100');
                els.tangentPoint.setAttribute('stroke', '#fff');
                els.tangentPoint.setAttribute('stroke-width', '1.5');
                setOpacity(els.sunPoint, 1);
                setOpacity(els.label16n, 1);
                els.pointA.setAttribute('r', '4');
                els.pointA.setAttribute('fill', '#000');
                els.pointA.removeAttribute('stroke');
                els.pointA.removeAttribute('stroke-width');
                els.pointA.removeAttribute('filter');
                els.pointC.setAttribute('r', '4');
                els.pointC.setAttribute('fill', '#000');
                els.pointC.removeAttribute('stroke');
                els.pointC.removeAttribute('stroke-width');
                els.pointC.removeAttribute('filter');
                els.pointB.setAttribute('r', '5');
                els.pointB.setAttribute('fill', '#2e7d32');
                els.pointB.setAttribute('stroke', '#fff');
                els.pointB.setAttribute('stroke-width', '1.5');
                els.pointB.setAttribute('filter', 'url(#scene1-glow)');
                setOpacity(els.labelNight, 1);
                setOpacity(els.labelDay, 1);
                setOpacity(els.meridians, 1);
                setOpacity(els.label0, 1);
                setOpacity(els.label12, 1);
                setOpacity(els.label110w, 1);
                
                els.panelTitle.textContent = '区时计算';
                els.panelContent.innerHTML = '西半球右界<strong>20°W</strong>为昼半球中央经线，地方时<strong>12:00</strong>。<br><br>左界<strong>160°E</strong>为夜半球中央经线，地方时<strong>0:00</strong>。<br><br>120°E与20°W经度差140°，时间差9h20m。<br><br>北京时间 = 12:00 + 9h20m = <strong>21:20</strong>。';
            }
            
            els.btnPrev.disabled = currentStep === 0;
            els.btnNext.disabled = currentStep === totalSteps;
            els.stepIndicator.textContent = 'Step ' + currentStep + ' / ' + totalSteps;
        }
        
        els.btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });
        
        els.btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateScene();
            }
        });
        
        updateScene();
    })();
    </script>
</body>
</html>
