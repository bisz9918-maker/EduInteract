<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三圈环流剖面图</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 16px; z-index: 10; }
        #scene1-controls button {
            padding: 6px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc;
            border-radius: 4px; background: #f5f5f5; transition: background 0.2s;
        }
        #scene1-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene1-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 13px; color: #555; min-width: 70px; text-align: center; }
        .scene1-hidden { display: none; }
        .scene1-fade { opacity: 0; transition: opacity 0.4s ease; }
        .scene1-visible { opacity: 1; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <defs>
                <!-- 箭头标记定义 -->
                <marker id="scene1-arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#c62828"/>
                </marker>
                <marker id="scene1-arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#1565c0"/>
                </marker>
                <marker id="scene1-arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#2e7d32"/>
                </marker>
                <marker id="scene1-arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#6a1b9a"/>
                </marker>
                <marker id="scene1-arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#ef6c00"/>
                </marker>
                <marker id="scene1-arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#888888"/>
                </marker>
            </defs>

            <!-- 步骤0：基础框架 - 始终显示 -->
            <!-- 地表线 A→N，分为6段以避免与字母标签的bounding box重叠 -->
            <line id="scene1-seg-ab" x1="100" y1="370" x2="200" y2="322" stroke="#000000" stroke-width="2"/>
            <line id="scene1-seg-bc" x1="200" y1="322" x2="300" y2="274" stroke="#000000" stroke-width="2"/>
            <line id="scene1-seg-cd" x1="300" y1="274" x2="400" y2="226" stroke="#000000" stroke-width="2"/>
            <line id="scene1-seg-de" x1="400" y1="226" x2="500" y2="178" stroke="#000000" stroke-width="2"/>
            <line id="scene1-seg-ef" x1="500" y1="178" x2="600" y2="130" stroke="#000000" stroke-width="2"/>
            <line id="scene1-seg-fn" x1="600" y1="130" x2="680" y2="90" stroke="#000000" stroke-width="2"/>

            <!-- 字母标签（位于地表线各点右下方，避免与线段bounding box重叠） -->
            <text id="scene1-label-a" x="108" y="390" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">A</text>
            <text id="scene1-label-b" x="208" y="342" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">B</text>
            <text id="scene1-label-c" x="308" y="294" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">C</text>
            <text id="scene1-label-d" x="420" y="265" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">D</text>
            <text id="scene1-label-e" x="508" y="198" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">E</text>
            <text id="scene1-label-f" x="625" y="170" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">F</text>
            <text id="scene1-label-n" x="700" y="125" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">N</text>

            <!-- 步骤1：纬度定位 -->
            <g id="scene1-step1-group" class="scene1-fade">
                <!-- 引出线 -->
                <line x1="100" y1="370" x2="60" y2="400" stroke="#888888" stroke-width="1" stroke-dasharray="4,3"/>
                <line x1="300" y1="274" x2="280" y2="400" stroke="#888888" stroke-width="1" stroke-dasharray="4,3"/>
                <line x1="500" y1="178" x2="500" y2="400" stroke="#888888" stroke-width="1" stroke-dasharray="4,3"/>
                <line x1="680" y1="90" x2="755" y2="105" stroke="#888888" stroke-width="1" stroke-dasharray="4,3"/>
                <!-- 纬度标注（底部横向排列） -->
                <text x="60" y="415" font-size="12" fill="#000000" text-anchor="middle">0°</text>
                <text x="280" y="415" font-size="12" fill="#000000" text-anchor="middle">30°N</text>
                <text x="500" y="415" font-size="12" fill="#000000" text-anchor="middle">60°N</text>
                <text x="755" y="120" font-size="12" fill="#000000" text-anchor="middle">90°N</text>
            </g>

            <!-- 步骤2：低纬环流 -->
            <g id="scene1-step2-group" class="scene1-fade">
                <!-- 低纬环流圈（哈德莱） -->
                <path d="M160,320 Q120,260 150,200 Q180,150 250,180 Q300,210 280,260 Q270,290 230,300 Q190,310 160,320 Z" fill="none" stroke="#1565c0" stroke-width="1.5"/>
                <!-- 上升箭头A -->
                <line x1="100" y1="360" x2="100" y2="290" stroke="#c62828" stroke-width="3" marker-end="url(#scene1-arrow-red)"/>
                <!-- 下沉箭头C -->
                <line x1="300" y1="210" x2="300" y2="260" stroke="#1565c0" stroke-width="3" marker-end="url(#scene1-arrow-blue)"/>
                <!-- 近地面东北信风 -->
                <line x1="240" y1="285" x2="160" y2="325" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#scene1-arrow-green)"/>
                <!-- 高空风低纬 -->
                <line x1="120" y1="210" x2="260" y2="170" stroke="#888888" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#scene1-arrow-gray)"/>
                <!-- 东北信风带标签（底部，与纬度标签错开） -->
                <line x1="200" y1="325" x2="180" y2="400" stroke="#888888" stroke-width="1" stroke-dasharray="4,3"/>
                <text x="180" y="430" font-size="12" fill="#2e7d32" text-anchor="middle">东北信风带</text>
            </g>

            <!-- 步骤3：中纬环流 -->
            <g id="scene1-step3-group" class="scene1-fade">
                <!-- 中纬环流圈（费雷尔） -->
                <path d="M340,250 Q290,200 320,150 Q360,110 430,140 Q480,170 460,220 Q440,250 400,250 Q360,250 340,250 Z" fill="none" stroke="#1565c0" stroke-width="1.5"/>
                <!-- 上升箭头E -->
                <line x1="500" y1="160" x2="500" y2="110" stroke="#c62828" stroke-width="3" marker-end="url(#scene1-arrow-red)"/>
                <!-- 近地面盛行西风 -->
                <line x1="360" y1="230" x2="440" y2="190" stroke="#6a1b9a" stroke-width="2.5" marker-end="url(#scene1-arrow-purple)"/>
                <!-- 高空风中纬 -->
                <line x1="480" y1="160" x2="340" y2="200" stroke="#888888" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#scene1-arrow-gray)"/>
                <!-- 盛行西风带标签 -->
                <line x1="400" y1="235" x2="400" y2="400" stroke="#888888" stroke-width="1" stroke-dasharray="4,3"/>
                <text x="400" y="430" font-size="12" fill="#6a1b9a" text-anchor="middle">盛行西风带</text>
            </g>

            <!-- 步骤4：高纬环流 -->
            <g id="scene1-step4-group" class="scene1-fade">
                <!-- 高纬环流圈（极地） -->
                <path d="M540,145 Q490,105 520,65 Q560,35 620,65 Q670,95 650,135 Q630,155 590,155 Q550,155 540,145 Z" fill="none" stroke="#1565c0" stroke-width="1.5"/>
                <!-- 下沉箭头N -->
                <line x1="680" y1="40" x2="680" y2="80" stroke="#1565c0" stroke-width="3" marker-end="url(#scene1-arrow-blue)"/>
                <!-- 近地面极地东风 -->
                <line x1="640" y1="120" x2="570" y2="155" stroke="#ef6c00" stroke-width="2.5" marker-end="url(#scene1-arrow-orange)"/>
                <!-- 高空风高纬 -->
                <line x1="660" y1="100" x2="560" y2="130" stroke="#888888" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#scene1-arrow-gray)"/>
                <!-- 极地东风带标签 -->
                <line x1="600" y1="155" x2="620" y2="400" stroke="#888888" stroke-width="1" stroke-dasharray="4,3"/>
                <text x="620" y="430" font-size="12" fill="#ef6c00" text-anchor="middle">极地东风带</text>
            </g>

            <!-- 步骤5：气压带与成因 -->
            <g id="scene1-step5-group" class="scene1-fade">
                <!-- 气压带填充（位于地表线上方） -->
                <ellipse cx="100" cy="330" rx="40" ry="20" fill="#ffcdd2" opacity="0.2"/>
                <ellipse cx="300" cy="240" rx="40" ry="20" fill="#bbdefb" opacity="0.2"/>
                <ellipse cx="500" cy="150" rx="30" ry="15" fill="#ffcdd2" opacity="0.2"/>
                <ellipse cx="680" cy="55" rx="35" ry="15" fill="#bbdefb" opacity="0.2"/>
                <!-- 引出线（垂直向下） -->
                <line x1="100" y1="370" x2="100" y2="440" stroke="#888888" stroke-width="1" stroke-dasharray="4,3"/>
                <line x1="300" y1="274" x2="300" y2="440" stroke="#888888" stroke-width="1" stroke-dasharray="4,3"/>
                <line x1="500" y1="178" x2="500" y2="440" stroke="#888888" stroke-width="1" stroke-dasharray="4,3"/>
                <line x1="680" y1="90" x2="680" y2="440" stroke="#888888" stroke-width="1" stroke-dasharray="4,3"/>
                <!-- 气压带名称（底部第三行，与上方标签间距充足） -->
                <text x="100" y="460" font-size="12" fill="#000000" text-anchor="middle">赤道低气压带（热力）</text>
                <text x="300" y="460" font-size="12" fill="#000000" text-anchor="middle">副热带高气压带（动力）</text>
                <text x="500" y="460" font-size="12" fill="#000000" text-anchor="middle">副极地低气压带（动力）</text>
                <text x="680" y="460" font-size="12" fill="#000000" text-anchor="middle">极地高气压带（热力）</text>
            </g>

            <!-- 步骤6：答案高亮 -->
            <g id="scene1-step6-group" class="scene1-fade">
                <!-- 答案高亮框C（文字置于框上方，避免重叠） -->
                <rect x="320" y="330" width="80" height="30" fill="#ffebee" opacity="0.3" stroke="#c62828" stroke-width="2"/>
                <text x="360" y="325" font-size="14" font-weight="bold" fill="#c62828" text-anchor="middle">30°</text>
                <!-- 答案高亮框E（文字置于框上方，避免重叠） -->
                <rect x="520" y="230" width="80" height="30" fill="#ffebee" opacity="0.3" stroke="#c62828" stroke-width="2"/>
                <text x="560" y="225" font-size="14" font-weight="bold" fill="#c62828" text-anchor="middle">60°</text>
            </g>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 0/6</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现 - 北半球三圈环流侧视剖面分步导航
        const currentStepEl = document.getElementById('scene1-step-indicator');
        const prevBtn = document.getElementById('scene1-btn-prev');
        const nextBtn = document.getElementById('scene1-btn-next');

        let currentStep = 0;
        const totalSteps = 6;

        // 每步对应的SVG组元素ID
        const stepGroups = [
            null, // step0 无额外组
            'scene1-step1-group',
            'scene1-step2-group',
            'scene1-step3-group',
            'scene1-step4-group',
            'scene1-step5-group',
            'scene1-step6-group'
        ];

        function updateDisplay() {
            // 更新步骤指示器
            currentStepEl.textContent = '步骤 ' + currentStep + '/' + totalSteps;

            // 更新按钮状态
            prevBtn.disabled = currentStep === 0;
            nextBtn.disabled = currentStep === totalSteps;

            // 控制各步骤组的显示/隐藏
            for (let i = 1; i <= totalSteps; i++) {
                const group = document.getElementById(stepGroups[i]);
                if (group) {
                    if (i <= currentStep) {
                        group.classList.remove('scene1-hidden');
                        group.classList.add('scene1-visible');
                    } else {
                        group.classList.add('scene1-hidden');
                        group.classList.remove('scene1-visible');
                    }
                }
            }
        }

        prevBtn.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        });

        nextBtn.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateDisplay();
            }
        });

        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
