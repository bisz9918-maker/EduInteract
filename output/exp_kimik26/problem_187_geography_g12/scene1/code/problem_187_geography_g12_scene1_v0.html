<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太阳能热水器倾角与正午太阳高度</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            padding: 6px 16px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            background: #1565c0;
            color: #fff;
            cursor: pointer;
            min-width: 90px;
            height: 32px;
        }
        #scene1-controls button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #scene1-step-indicator {
            font-size: 14px;
            color: #333333;
            min-width: 80px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <defs>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0" />
                </marker>
            </defs>
            
            <!-- 步骤标题 -->
            <text id="scene1-step-title" x="400" y="45" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">6月22日四地太阳能热水器倾角示意图</text>
            
            <!-- 步骤0: 题图复现 -->
            <g id="scene1-step0-group">
                <!-- 地面线 -->
                <line x1="60" y1="280" x2="180" y2="280" stroke="#000000" stroke-width="2"/>
                <line x1="240" y1="280" x2="360" y2="280" stroke="#000000" stroke-width="2"/>
                <line x1="420" y1="280" x2="540" y2="280" stroke="#000000" stroke-width="2"/>
                <line x1="600" y1="280" x2="720" y2="280" stroke="#000000" stroke-width="2"/>
                
                <!-- 集热板 -->
                <line x1="90" y1="280" x2="179" y2="269" stroke="#000000" stroke-width="2"/>
                <line x1="270" y1="280" x2="359" y2="235" stroke="#000000" stroke-width="2"/>
                <line x1="450" y1="280" x2="539" y2="235" stroke="#000000" stroke-width="2"/>
                <line x1="630" y1="280" x2="719" y2="259" stroke="#000000" stroke-width="2"/>
                
                <!-- 角度弧 -->
                <path d="M 108 280 A 18 18 0 0 0 107 278" fill="none" stroke="#c62828" stroke-width="1.5"/>
                <path d="M 288 280 A 18 18 0 0 0 286 272" fill="none" stroke="#c62828" stroke-width="1.5"/>
                <path d="M 468 280 A 18 18 0 0 0 466 272" fill="none" stroke="#c62828" stroke-width="1.5"/>
                <path d="M 648 280 A 18 18 0 0 0 647 276" fill="none" stroke="#c62828" stroke-width="1.5"/>
                
                <!-- 角度值 -->
                <text x="120" y="255" text-anchor="middle" font-size="14" fill="#c62828">6°34′</text>
                <text x="320" y="220" text-anchor="middle" font-size="14" fill="#c62828">26°34′</text>
                <text x="520" y="220" text-anchor="middle" font-size="14" fill="#c62828">26°34′</text>
                <text x="720" y="240" text-anchor="middle" font-size="14" fill="#c62828">13°34′</text>
                
                <!-- 地点 -->
                <text x="120" y="310" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">A</text>
                <text x="320" y="310" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">B</text>
                <text x="520" y="310" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">C</text>
                <text x="720" y="310" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">D</text>
                
                <!-- 世界时 -->
                <text x="120" y="345" text-anchor="middle" font-size="14" fill="#888888">4时</text>
                <text x="320" y="345" text-anchor="middle" font-size="14" fill="#888888">8时</text>
                <text x="520" y="345" text-anchor="middle" font-size="14" fill="#888888">12时</text>
                <text x="720" y="345" text-anchor="middle" font-size="14" fill="#888888">24时(0时)</text>
            </g>
            
            <!-- 步骤1: 原理放大 -->
            <g id="scene1-step1-group" style="display:none">
                <!-- 左半部几何模型 -->
                <line x1="100" y1="320" x2="340" y2="320" stroke="#000000" stroke-width="2"/>
                <polygon points="160,320 266,245 266,320" fill="#e0e0e0" fill-opacity="0.2" stroke="none"/>
                <line x1="160" y1="320" x2="266" y2="245" stroke="#000000" stroke-width="2"/>
                <line x1="340" y1="130" x2="266" y2="245" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrowhead)"/>
                
                <text x="80" y="335" text-anchor="middle" font-size="14" fill="#000000">北</text>
                <text x="350" y="335" text-anchor="middle" font-size="14" fill="#000000">南</text>
                
                <!-- α弧（集热板与地面夹角） -->
                <path d="M 185 320 A 25 25 0 0 0 180 306" fill="none" stroke="#c62828" stroke-width="1.5"/>
                <text x="140" y="305" text-anchor="middle" font-size="16" fill="#c62828" font-style="italic">α</text>
                
                <!-- H弧（光线与地面夹角） -->
                <path d="M 193 320 A 25 25 0 0 1 204 299" fill="none" stroke="#1565c0" stroke-width="1.5"/>
                <text x="145" y="250" text-anchor="middle" font-size="16" fill="#1565c0" font-style="italic">H</text>
                
                <!-- 右半部说明 -->
                <text x="560" y="120" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">太阳能热水器倾角几何模型</text>
                <text x="560" y="180" text-anchor="middle" font-size="14" fill="#333333">水平地面</text>
                <text x="560" y="220" text-anchor="middle" font-size="14" fill="#333333">集热板向南倾斜，倾角为 α</text>
                <text x="560" y="260" text-anchor="middle" font-size="14" fill="#333333">太阳光线从正南方向射来</text>
                <text x="560" y="300" text-anchor="middle" font-size="14" fill="#333333">太阳高度角 H：光线与地面夹角</text>
            </g>
            
            <!-- 步骤2: 关系推导 -->
            <g id="scene1-step2-group" style="display:none">
                <!-- 几何模型（同步骤1） -->
                <line x1="100" y1="320" x2="340" y2="320" stroke="#000000" stroke-width="2"/>
                <polygon points="160,320 266,245 266,320" fill="#e0e0e0" fill-opacity="0.2" stroke="none"/>
                <line x1="160" y1="320" x2="266" y2="245" stroke="#000000" stroke-width="2"/>
                <line x1="340" y1="130" x2="266" y2="245" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrowhead)"/>
                
                <text x="80" y="335" text-anchor="middle" font-size="14" fill="#000000">北</text>
                <text x="350" y="335" text-anchor="middle" font-size="14" fill="#000000">南</text>
                
                <!-- α弧（集热板与地面夹角） -->
                <path d="M 185 320 A 25 25 0 0 0 180 306" fill="none" stroke="#c62828" stroke-width="1.5"/>
                <text x="140" y="305" text-anchor="middle" font-size="16" fill="#c62828" font-style="italic">α</text>
                
                <!-- H弧（光线与地面夹角） -->
                <path d="M 193 320 A 25 25 0 0 1 204 299" fill="none" stroke="#1565c0" stroke-width="1.5"/>
                <text x="145" y="250" text-anchor="middle" font-size="16" fill="#1565c0" font-style="italic">H</text>
                
                <!-- 新增：辅助垂线 -->
                <line x1="266" y1="245" x2="266" y2="320" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5"/>
                
                <!-- 直角符号 -->
                <path d="M 266 308 L 266 320 L 278 320" fill="none" stroke="#888888" stroke-width="1.5"/>
                
                <!-- 光线与垂线夹角弧（第二个α） -->
                <path d="M 266 265 A 20 20 0 0 0 255 262" fill="none" stroke="#c62828" stroke-width="1.5"/>
                <text x="360" y="190" text-anchor="middle" font-size="16" fill="#c62828" font-style="italic">α</text>
                
                <!-- 右半部公式 -->
                <text x="560" y="160" text-anchor="middle" font-size="16" fill="#333333">∵ 集热板 ⊥ 太阳光线</text>
                <text x="560" y="200" text-anchor="middle" font-size="16" fill="#333333">∵ 垂线 ⊥ 地面</text>
                <text x="560" y="250" text-anchor="middle" font-size="18" fill="#c62828" font-weight="bold">∴ α + H = 90°</text>
                <text x="560" y="300" text-anchor="middle" font-size="18" fill="#2e7d32" font-weight="bold">∴ H = 90° − α</text>
            </g>
            
            <!-- 步骤3: 四地计算 -->
            <g id="scene1-step3-group" style="display:none">
                <!-- 地点标题 -->
                <text x="120" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">①地 (A)</text>
                <text x="320" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">②地 (B)</text>
                <text x="520" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">③地 (C)</text>
                <text x="700" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">④地 (D)</text>
                
                <!-- 小图地面 -->
                <line x1="50" y1="180" x2="170" y2="180" stroke="#000000" stroke-width="2"/>
                <line x1="250" y1="180" x2="370" y2="180" stroke="#000000" stroke-width="2"/>
                <line x1="450" y1="180" x2="570" y2="180" stroke="#000000" stroke-width="2"/>
                <line x1="630" y1="180" x2="750" y2="180" stroke="#000000" stroke-width="2"/>
                
                <!-- 小图集热板 -->
                <line x1="70" y1="180" x2="169" y2="170" stroke="#000000" stroke-width="2"/>
                <line x1="270" y1="180" x2="359" y2="140" stroke="#000000" stroke-width="2"/>
                <line x1="470" y1="180" x2="559" y2="140" stroke="#000000" stroke-width="2"/>
                <line x1="650" y1="180" x2="749" y2="159" stroke="#000000" stroke-width="2"/>
                
                <!-- 小图角度弧 -->
                <path d="M 88 180 A 18 18 0 0 0 87 178" fill="none" stroke="#c62828" stroke-width="1.5"/>
                <path d="M 288 180 A 18 18 0 0 0 286 172" fill="none" stroke="#c62828" stroke-width="1.5"/>
                <path d="M 488 180 A 18 18 0 0 0 486 172" fill="none" stroke="#c62828" stroke-width="1.5"/>
                <path d="M 668 180 A 18 18 0 0 0 667 176" fill="none" stroke="#c62828" stroke-width="1.5"/>
                
                <!-- 倾角值 -->
                <text x="120" y="210" text-anchor="middle" font-size="14" fill="#c62828">α = 6°34′</text>
                <text x="320" y="210" text-anchor="middle" font-size="14" fill="#c62828">α = 26°34′</text>
                <text x="520" y="210" text-anchor="middle" font-size="14" fill="#c62828">α = 26°34′</text>
                <text x="700" y="210" text-anchor="middle" font-size="14" fill="#c62828">α = 13°34′</text>
                
                <!-- 计算式 -->
                <text x="120" y="250" text-anchor="middle" font-size="14" fill="#333333">
                    <tspan fill="#1565c0">90°</tspan> − <tspan fill="#c62828">6°34′</tspan>
                </text>
                <text x="320" y="250" text-anchor="middle" font-size="14" fill="#333333">
                    <tspan fill="#1565c0">90°</tspan> − <tspan fill="#c62828">26°34′</tspan>
                </text>
                <text x="520" y="250" text-anchor="middle" font-size="14" fill="#333333">
                    <tspan fill="#1565c0">90°</tspan> − <tspan fill="#c62828">26°34′</tspan>
                </text>
                <text x="700" y="250" text-anchor="middle" font-size="14" fill="#333333">
                    <tspan fill="#1565c0">90°</tspan> − <tspan fill="#c62828">13°34′</tspan>
                </text>
                
                <!-- 结果 -->
                <text x="120" y="290" text-anchor="middle" font-size="16" fill="#2e7d32" font-weight="bold">= 83°26′</text>
                <text x="320" y="290" text-anchor="middle" font-size="16" fill="#2e7d32" font-weight="bold">= 63°26′</text>
                <text x="520" y="290" text-anchor="middle" font-size="16" fill="#2e7d32" font-weight="bold">= 63°26′</text>
                <text x="700" y="290" text-anchor="middle" font-size="16" fill="#2e7d32" font-weight="bold">= 76°26′</text>
                
                <!-- 世界时小字 -->
                <text x="120" y="330" text-anchor="middle" font-size="12" fill="#888888">世界时4时</text>
                <text x="320" y="330" text-anchor="middle" font-size="12" fill="#888888">世界时8时</text>
                <text x="520" y="330" text-anchor="middle" font-size="12" fill="#888888">世界时12时</text>
                <text x="700" y="330" text-anchor="middle" font-size="12" fill="#888888">世界时24时</text>
            </g>
            
            <!-- 步骤4: 排序结论 -->
            <g id="scene1-step4-group" style="display:none">
                <!-- 结果标签（无背景框，纯文字排列） -->
                <text x="150" y="105" text-anchor="middle" font-size="16" fill="#2e7d32" font-weight="bold">A地</text>
                <text x="150" y="145" text-anchor="middle" font-size="14" fill="#2e7d32">H = 83°26′</text>
                
                <text x="330" y="105" text-anchor="middle" font-size="16" fill="#2e7d32" font-weight="bold">D地</text>
                <text x="330" y="145" text-anchor="middle" font-size="14" fill="#2e7d32">H = 76°26′</text>
                
                <text x="510" y="105" text-anchor="middle" font-size="16" fill="#2e7d32" font-weight="bold">B地</text>
                <text x="510" y="145" text-anchor="middle" font-size="14" fill="#2e7d32">H = 63°26′</text>
                
                <text x="690" y="105" text-anchor="middle" font-size="16" fill="#2e7d32" font-weight="bold">C地</text>
                <text x="690" y="145" text-anchor="middle" font-size="14" fill="#2e7d32">H = 63°26′</text>
                
                <!-- 箭头 -->
                <line x1="220" y1="120" x2="260" y2="120" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrowhead)"/>
                <line x1="400" y1="120" x2="440" y2="120" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrowhead)"/>
                <text x="600" y="125" text-anchor="middle" font-size="16" fill="#1565c0">=</text>
                
                <!-- 排序标题 -->
                <text x="400" y="220" text-anchor="middle" font-size="16" fill="#000000" font-weight="bold">正午太阳高度由大到小</text>
                
                <!-- 排序结果 -->
                <text x="400" y="270" text-anchor="middle" font-size="20" fill="#2e7d32" font-weight="bold">A  >  D  >  B = C</text>
                
                <!-- 数值标注 -->
                <text x="400" y="310" text-anchor="middle" font-size="14" fill="#666666">83°26′   76°26′   63°26′   63°26′</text>
            </g>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-prev-btn" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/5</span>
            <button id="scene1-next-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        var currentStep = 0;
        var totalSteps = 5;
        var stepTitles = [
            "6月22日四地太阳能热水器倾角示意图",
            "太阳能热水器倾角几何模型",
            "倾角与正午太阳高度的互余关系",
            "四地正午太阳高度计算",
            "正午太阳高度排序结论"
        ];
        
        var stepGroups = [
            document.getElementById("scene1-step0-group"),
            document.getElementById("scene1-step1-group"),
            document.getElementById("scene1-step2-group"),
            document.getElementById("scene1-step3-group"),
            document.getElementById("scene1-step4-group")
        ];
        
        var titleEl = document.getElementById("scene1-step-title");
        var prevBtn = document.getElementById("scene1-prev-btn");
        var nextBtn = document.getElementById("scene1-next-btn");
        var indicator = document.getElementById("scene1-step-indicator");
        
        function renderStep() {
            // 隐藏所有步骤组
            for (var i = 0; i < stepGroups.length; i++) {
                if (stepGroups[i]) {
                    stepGroups[i].style.display = "none";
                }
            }
            
            // 显示当前步骤组
            if (stepGroups[currentStep]) {
                stepGroups[currentStep].style.display = "block";
            }
            
            // 更新标题
            if (titleEl) {
                titleEl.textContent = stepTitles[currentStep] || "";
            }
            
            // 更新指示器
            if (indicator) {
                indicator.textContent = "步骤 " + (currentStep + 1) + "/" + totalSteps;
            }
            
            // 更新按钮状态
            if (prevBtn) {
                prevBtn.disabled = currentStep === 0;
            }
            if (nextBtn) {
                nextBtn.disabled = currentStep === totalSteps - 1;
            }
        }
        
        if (prevBtn) {
            prevBtn.addEventListener("click", function() {
                if (currentStep > 0) {
                    currentStep--;
                    renderStep();
                }
            });
        }
        
        if (nextBtn) {
            nextBtn.addEventListener("click", function() {
                if (currentStep < totalSteps - 1) {
                    currentStep++;
                    renderStep();
                }
            });
        }
        
        // 初始渲染
        renderStep();
    })();
    </script>
</body>
</html>
