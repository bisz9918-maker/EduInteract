<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太阳直射点的回归运动</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            padding: 6px 16px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #f5f5f5;
        }
        #scene1-controls button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #scene1-step-indicator {
            font-size: 14px;
            color: #333;
            min-width: 80px;
            text-align: center;
        }
        /* 步骤元素的显隐控制 */
        .scene1-step-group {
            opacity: 0;
            transition: opacity 300ms ease;
            pointer-events: none;
        }
        .scene1-step-group.active {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <!-- ========== 步骤0：三条纬线（始终显示） ========== -->
            <g id="scene1-group-lines" class="scene1-step-group active">
                <!-- 北回归线 -->
                <line id="scene1-line-tropic-north" x1="80" y1="130" x2="680" y2="130" stroke="#888888" stroke-width="1.5" stroke-dasharray="6,4" />
                <text id="scene1-label-tropic-north" x="690" y="135" font-size="14" fill="#333" dominant-baseline="middle">北回归线</text>

                <!-- 赤道 -->
                <line id="scene1-line-equator" x1="80" y1="250" x2="680" y2="250" stroke="#000000" stroke-width="2" />
                <text id="scene1-label-equator" x="690" y="255" font-size="14" fill="#333" dominant-baseline="middle">赤道</text>

                <!-- 南回归线 -->
                <line id="scene1-line-tropic-south" x1="80" y1="370" x2="680" y2="370" stroke="#888888" stroke-width="1.5" stroke-dasharray="6,4" />
                <text id="scene1-label-tropic-south" x="690" y="375" font-size="14" fill="#333" dominant-baseline="middle">南回归线</text>
            </g>

            <!-- ========== 步骤1：轨迹折线（用独立线段替代polyline，避免大bounding box） + 高亮点 + 点标签 ========== -->
            <g id="scene1-group-path" class="scene1-step-group">
                <!-- 轨迹线段 ①→②→③→④→① -->
                <line id="scene1-path-1" x1="160" y1="250" x2="320" y2="130" stroke="#1565c0" stroke-width="2" />
                <line id="scene1-path-2" x1="320" y1="130" x2="480" y2="250" stroke="#1565c0" stroke-width="2" />
                <line id="scene1-path-3" x1="480" y1="250" x2="640" y2="370" stroke="#1565c0" stroke-width="2" />
                <line id="scene1-path-4" x1="640" y1="370" x2="160" y2="250" stroke="#1565c0" stroke-width="2" />

                <!-- 四个关键点（步骤1高亮：r=9 + 描边） -->
                <circle id="scene1-point-1" cx="160" cy="250" r="9" fill="#d32f2f" stroke="#000000" stroke-width="1.5" />
                <circle id="scene1-point-2" cx="320" cy="130" r="9" fill="#d32f2f" stroke="#000000" stroke-width="1.5" />
                <circle id="scene1-point-3" cx="480" cy="250" r="9" fill="#d32f2f" stroke="#000000" stroke-width="1.5" />
                <circle id="scene1-point-4" cx="640" cy="370" r="9" fill="#d32f2f" stroke="#000000" stroke-width="1.5" />

                <!-- 点标签 -->
                <text id="scene1-label-point-1" x="140" y="275" font-size="16" fill="#333" text-anchor="middle" dominant-baseline="middle">①</text>
                <text id="scene1-label-point-2" x="320" y="108" font-size="16" fill="#333" text-anchor="middle" dominant-baseline="middle">②</text>
                <text id="scene1-label-point-3" x="510" y="230" font-size="16" fill="#333" text-anchor="middle" dominant-baseline="middle">③</text>
                <text id="scene1-label-point-4" x="665" y="385" font-size="16" fill="#333" text-anchor="middle" dominant-baseline="middle">④</text>
            </g>

            <!-- ========== 步骤2：日期标签 ========== -->
            <g id="scene1-group-dates" class="scene1-step-group">
                <text id="scene1-label-date-1" x="55" y="220" font-size="14" fill="#333" text-anchor="start">3月21日</text>
                <text id="scene1-label-date-2" x="220" y="90" font-size="14" fill="#333" text-anchor="start">6月22日</text>
                <text id="scene1-label-date-3" x="540" y="220" font-size="14" fill="#333" text-anchor="start">9月23日</text>
                <text id="scene1-label-date-4" x="540" y="400" font-size="14" fill="#333" text-anchor="start">12月22日</text>
            </g>

            <!-- ========== 步骤3：节气标签 ========== -->
            <g id="scene1-group-solar-terms" class="scene1-step-group">
                <text id="scene1-label-solar-term-1" x="55" y="265" font-size="14" fill="#333" text-anchor="start">春分</text>
                <text id="scene1-label-solar-term-2" x="380" y="90" font-size="14" fill="#333" text-anchor="start">夏至</text>
                <text id="scene1-label-solar-term-3" x="625" y="240" font-size="14" fill="#333" text-anchor="start">秋分</text>
                <text id="scene1-label-solar-term-4" x="540" y="450" font-size="14" fill="#333" text-anchor="start">冬至</text>
            </g>

            <!-- ========== 步骤4：方向文字（放置在轨迹外侧空白区） ========== -->
            <g id="scene1-group-directions" class="scene1-step-group">
                <text id="scene1-text-direction-1" x="150" y="110" font-size="13" fill="#2e7d32" text-anchor="middle">向北移动 ↗</text>
                <text id="scene1-text-direction-2" x="550" y="125" font-size="13" fill="#2e7d32" text-anchor="middle">向南移动 ↘</text>
                <text id="scene1-text-direction-3" x="660" y="330" font-size="13" fill="#2e7d32" text-anchor="middle">向南移动 ↘</text>
                <text id="scene1-text-direction-4" x="280" y="395" font-size="13" fill="#2e7d32" text-anchor="middle">向北移动 ↖</text>
            </g>
        </svg>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/5</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现：太阳直射点的回归运动 - 分步导航

        // 状态变量
        var currentStep = 0;
        var totalSteps = 5;

        // DOM 元素引用
        var btnPrev = document.getElementById('scene1-btn-prev');
        var btnNext = document.getElementById('scene1-btn-next');
        var stepIndicator = document.getElementById('scene1-step-indicator');

        // 各步骤对应的元素组
        var groupPath = document.getElementById('scene1-group-path');
        var groupDates = document.getElementById('scene1-group-dates');
        var groupSolarTerms = document.getElementById('scene1-group-solar-terms');
        var groupDirections = document.getElementById('scene1-group-directions');

        // 四个点元素（用于步骤1→2的尺寸变化）
        var points = [
            document.getElementById('scene1-point-1'),
            document.getElementById('scene1-point-2'),
            document.getElementById('scene1-point-3'),
            document.getElementById('scene1-point-4')
        ];

        // 渲染当前步骤
        function renderStep() {
            // 步骤指示器
            stepIndicator.textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;

            // 按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps - 1);

            // 步骤0：只显示纬线（始终显示，由CSS控制）
            // 步骤1：显示轨迹 + 高亮点
            if (currentStep >= 1) {
                groupPath.classList.add('active');
                // 步骤1高亮样式
                if (currentStep === 1) {
                    points.forEach(function(p) {
                        p.setAttribute('r', '9');
                        p.setAttribute('stroke', '#000000');
                        p.setAttribute('stroke-width', '1.5');
                    });
                } else {
                    // 步骤2+ 恢复常规尺寸
                    points.forEach(function(p) {
                        p.setAttribute('r', '6');
                        p.setAttribute('stroke', 'none');
                        p.setAttribute('stroke-width', '0');
                    });
                }
            } else {
                groupPath.classList.remove('active');
            }

            // 步骤2：显示日期
            if (currentStep >= 2) {
                groupDates.classList.add('active');
            } else {
                groupDates.classList.remove('active');
            }

            // 步骤3：显示节气
            if (currentStep >= 3) {
                groupSolarTerms.classList.add('active');
            } else {
                groupSolarTerms.classList.remove('active');
            }

            // 步骤4：显示方向箭头
            if (currentStep >= 4) {
                groupDirections.classList.add('active');
            } else {
                groupDirections.classList.remove('active');
            }
        }

        // 事件绑定
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                renderStep();
            }
        });

        // 初始化
        renderStep();
    })();
    </script>
</body>
</html>
