<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太阳直射点回归运动 - 地球光照图</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene2-controls button {
            padding: 6px 16px; font-size: 14px; border: 1px solid #bdbdbd; border-radius: 4px;
            background: #e0e0e0; color: #333; cursor: pointer; transition: all 0.2s;
            min-width: 100px; height: 30px; line-height: 18px;
        }
        #scene2-controls button:hover { background: #bdbdbd; }
        #scene2-controls button.active { background: #1565c0; color: #ffffff; border-color: #1565c0; }
        .scene2-label { font-size: 12px; fill: #000000; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        .scene2-title { font-size: 15px; fill: #000000; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; font-weight: bold; }
        .scene2-info { font-size: 12px; fill: #333333; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 太阳光线（左侧水平入射） -->
            <g id="scene2-sunrays">
                <line x1="40" y1="160" x2="155" y2="160" stroke="#1565c0" stroke-width="1.5"/>
                <polygon points="155,156 165,160 155,164" fill="#1565c0"/>
                <line x1="40" y1="200" x2="155" y2="200" stroke="#1565c0" stroke-width="1.5"/>
                <polygon points="155,196 165,200 155,204" fill="#1565c0"/>
                <line x1="40" y1="240" x2="155" y2="240" stroke="#1565c0" stroke-width="1.5"/>
                <polygon points="155,236 165,240 155,244" fill="#1565c0"/>
                <line x1="40" y1="280" x2="155" y2="280" stroke="#1565c0" stroke-width="1.5"/>
                <polygon points="155,276 165,280 155,284" fill="#1565c0"/>
                <line x1="40" y1="320" x2="155" y2="320" stroke="#1565c0" stroke-width="1.5"/>
                <polygon points="155,316 165,320 155,324" fill="#1565c0"/>
            </g>

            <!-- 地球圆 -->
            <circle id="scene2-earth-circle" cx="300" cy="240" r="140" fill="none" stroke="#000000" stroke-width="2"/>

            <!-- 地轴 -->
            <line id="scene2-axis-line" x1="245" y1="368" x2="355" y2="112" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4"/>

            <!-- 纬线（虚线） -->
            <g id="scene2-latitudes" stroke="#888888" stroke-width="1" stroke-dasharray="4,4">
                <!-- 赤道 -->
                <line x1="172" y1="184" x2="428" y2="296"/>
                <!-- 北回归线 -->
                <line x1="205" y1="138" x2="440" y2="240"/>
                <!-- 南回归线 -->
                <line x1="160" y1="240" x2="395" y2="342"/>
                <!-- 北极圈 -->
                <line x1="300" y1="100" x2="402" y2="145"/>
                <!-- 南极圈 -->
                <line x1="198" y1="336" x2="300" y2="380"/>
            </g>

            <!-- 夜半球（动态） -->
            <path id="scene2-night-hemisphere" d="M 300 240 L 428 184 A 140 140 0 1 1 172 296 Z" fill="#000000" fill-opacity="0.15"/>

            <!-- 极昼范围（动态） -->
            <path id="scene2-polar-day-zone" d="M 300 100 A 140 140 0 0 1 402 145 L 355 112 Z" fill="#2e7d32" fill-opacity="0.25"/>

            <!-- 极夜范围（动态） -->
            <path id="scene2-polar-night-zone" d="M 198 336 A 140 140 0 0 1 300 380 L 245 368 Z" fill="#c62828" fill-opacity="0.25"/>

            <!-- 晨昏线（动态） -->
            <line id="scene2-terminator-line" x1="428" y1="184" x2="172" y2="296" stroke="#c62828" stroke-width="2"/>

            <!-- 太阳直射点（动态） -->
            <circle id="scene2-sunspot" cx="205" cy="138" r="5" fill="#c62828"/>

            <!-- 标签 -->
            <g id="scene2-labels">
                <!-- 地轴标签 -->
                <text x="410" y="85" class="scene2-label" text-anchor="start">北极</text>
                <text x="170" y="415" class="scene2-label" text-anchor="end">南极</text>

                <!-- 纬线标签 -->
                <text x="465" y="240" class="scene2-label" text-anchor="start">赤道</text>
                <text x="465" y="120" class="scene2-label" text-anchor="start">北回归线</text>
                <text x="465" y="360" class="scene2-label" text-anchor="start">南回归线</text>

                <!-- 晨昏线标签（动态显示） -->
                <text id="scene2-terminator-label" x="460" y="170" class="scene2-label" text-anchor="start">晨昏线</text>

                <!-- 直射点标签（动态） -->
                <text id="scene2-sunspot-label" x="95" y="138" class="scene2-label" text-anchor="start">太阳直射点</text>

                <!-- 极昼极夜标签 -->
                <text id="scene2-polar-day-label" x="330" y="65" class="scene2-label" text-anchor="start" fill="#2e7d32">极昼范围</text>
                <text id="scene2-polar-night-label" x="190" y="400" class="scene2-label" text-anchor="start" fill="#c62828">极夜范围</text>

                <!-- 昼夜半球标签 -->
                <text x="75" y="85" class="scene2-label" text-anchor="middle">昼半球</text>
                <text x="520" y="280" class="scene2-label" text-anchor="middle">夜半球</text>
            </g>

            <!-- 右侧信息面板 -->
            <g id="scene2-info-panel">
                <text id="scene2-info-title" x="545" y="55" class="scene2-title">夏至日（6月22日前后）</text>
                <text id="scene2-info-direct" x="545" y="95" class="scene2-info">直射点：北回归线（23.5°N）</text>
                <text id="scene2-info-daynight" x="545" y="130" class="scene2-info">北半球昼最长夜最短</text>
                <text id="scene2-info-polarday" x="545" y="165" class="scene2-info">极昼：北极圈及其以北</text>
                <text id="scene2-info-polarnight" x="545" y="200" class="scene2-info">极夜：南极圈及其以南</text>
                <text id="scene2-info-height" x="545" y="240" class="scene2-info">正午太阳高度：北回归线以北最大</text>
            </g>

            <!-- 图例 -->
            <g id="scene2-legend">
                <line x1="545" y1="320" x2="575" y2="320" stroke="#1565c0" stroke-width="1.5"/>
                <text x="583" y="324" class="scene2-label" text-anchor="start">太阳光线</text>

                <line x1="545" y1="350" x2="575" y2="350" stroke="#c62828" stroke-width="2"/>
                <text x="583" y="354" class="scene2-label" text-anchor="start">晨昏线</text>

                <rect x="545" y="374" width="12" height="12" fill="#2e7d32" fill-opacity="0.25"/>
                <text x="583" y="385" class="scene2-label" text-anchor="start">极昼范围</text>

                <rect x="545" y="404" width="12" height="12" fill="#c62828" fill-opacity="0.25"/>
                <text x="583" y="415" class="scene2-label" text-anchor="start">极夜范围</text>

                <rect x="545" y="434" width="12" height="12" fill="#000000" fill-opacity="0.15"/>
                <text x="583" y="445" class="scene2-label" text-anchor="start">夜半球</text>
            </g>
        </svg>

        <div id="scene2-controls">
            <button id="scene2-btn-summer" class="active">夏至 ②</button>
            <button id="scene2-btn-equinox">春秋分 ①③</button>
            <button id="scene2-btn-winter">冬至 ④</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2 实现 - 太阳直射点回归运动地球光照图

        // 状态定义
        const states = {
            summer: {
                name: '夏至',
                sunspot: { cx: 205, cy: 138 },
                terminator: { x1: 428, y1: 184, x2: 172, y2: 296 },
                nightPath: 'M 300 240 L 428 184 A 140 140 0 1 1 172 296 Z',
                polarDayPath: 'M 300 100 A 140 140 0 0 1 402 145 L 355 112 Z',
                polarNightPath: 'M 198 336 A 140 140 0 0 1 300 380 L 245 368 Z',
                polarDayOpacity: 0.25,
                polarNightOpacity: 0.25,
                sunspotLabel: { x: 95, y: 138 },
                terminatorLabel: { x: 460, y: 170 },
                title: '夏至日（6月22日前后）',
                direct: '直射点：北回归线（23.5°N）',
                daynight: '北半球昼最长夜最短',
                polarday: '极昼：北极圈及其以北',
                polarnight: '极夜：南极圈及其以南',
                height: '正午太阳高度：北回归线以北最大'
            },
            equinox: {
                name: '春秋分',
                sunspot: { cx: 172, cy: 184 },
                terminator: { x1: 300, y1: 100, x2: 300, y2: 380 },
                nightPath: 'M 300 240 L 300 100 A 140 140 0 1 1 300 380 Z',
                polarDayPath: 'M 300 100 A 140 140 0 0 1 402 145 L 355 112 Z',
                polarNightPath: 'M 198 336 A 140 140 0 0 1 300 380 L 245 368 Z',
                polarDayOpacity: 0,
                polarNightOpacity: 0,
                sunspotLabel: { x: 95, y: 184 },
                terminatorLabel: { x: 325, y: 75 },
                title: '春分/秋分日',
                direct: '直射点：赤道（0°）',
                daynight: '全球昼夜平分',
                polarday: '极昼/极夜：无',
                polarnight: '',
                height: '正午太阳高度：赤道最大'
            },
            winter: {
                name: '冬至',
                sunspot: { cx: 160, cy: 240 },
                terminator: { x1: 428, y1: 296, x2: 172, y2: 184 },
                nightPath: 'M 300 240 L 428 296 A 140 140 0 1 0 172 184 Z',
                polarDayPath: 'M 198 336 A 140 140 0 0 1 300 380 L 245 368 Z',
                polarNightPath: 'M 300 100 A 140 140 0 0 1 402 145 L 355 112 Z',
                polarDayOpacity: 0.25,
                polarNightOpacity: 0.25,
                sunspotLabel: { x: 95, y: 240 },
                terminatorLabel: { x: 460, y: 300 },
                title: '冬至日（12月22日前后）',
                direct: '直射点：南回归线（23.5°S）',
                daynight: '北半球昼最短夜最长',
                polarday: '极昼：南极圈及其以南',
                polarnight: '极夜：北极圈及其以北',
                height: '正午太阳高度：南回归线以南最大'
            }
        };

        let currentState = 'summer';
        let animating = false;

        // DOM 元素引用
        const els = {
            sunspot: document.getElementById('scene2-sunspot'),
            terminator: document.getElementById('scene2-terminator-line'),
            night: document.getElementById('scene2-night-hemisphere'),
            polarDay: document.getElementById('scene2-polar-day-zone'),
            polarNight: document.getElementById('scene2-polar-night-zone'),
            sunspotLabel: document.getElementById('scene2-sunspot-label'),
            terminatorLabel: document.getElementById('scene2-terminator-label'),
            infoTitle: document.getElementById('scene2-info-title'),
            infoDirect: document.getElementById('scene2-info-direct'),
            infoDaynight: document.getElementById('scene2-info-daynight'),
            infoPolarday: document.getElementById('scene2-info-polarday'),
            infoPolarnight: document.getElementById('scene2-info-polarnight'),
            infoHeight: document.getElementById('scene2-info-height'),
            btnSummer: document.getElementById('scene2-btn-summer'),
            btnEquinox: document.getElementById('scene2-btn-equinox'),
            btnWinter: document.getElementById('scene2-btn-winter')
        };

        // 缓动函数 ease-out
        function easeOut(t) {
            return 1 - Math.pow(1 - t, 3);
        }

        // 动画函数
        function animateTo(targetStateName) {
            if (animating || currentState === targetStateName) return;
            animating = true;

            const from = states[currentState];
            const to = states[targetStateName];
            const duration = 400;
            const startTime = performance.now();

            // 获取当前值
            const startSunspot = { cx: parseFloat(els.sunspot.getAttribute('cx')), cy: parseFloat(els.sunspot.getAttribute('cy')) };
            const startTerminator = {
                x1: parseFloat(els.terminator.getAttribute('x1')),
                y1: parseFloat(els.terminator.getAttribute('y1')),
                x2: parseFloat(els.terminator.getAttribute('x2')),
                y2: parseFloat(els.terminator.getAttribute('y2'))
            };
            const startSunspotLabel = {
                x: parseFloat(els.sunspotLabel.getAttribute('x')),
                y: parseFloat(els.sunspotLabel.getAttribute('y'))
            };
            const startTerminatorLabel = {
                x: parseFloat(els.terminatorLabel.getAttribute('x')),
                y: parseFloat(els.terminatorLabel.getAttribute('y'))
            };
            const startPolarDayOpacity = parseFloat(els.polarDay.getAttribute('fill-opacity') || 0);
            const startPolarNightOpacity = parseFloat(els.polarNight.getAttribute('fill-opacity') || 0);

            function frame(now) {
                const elapsed = now - startTime;
                const t = Math.min(elapsed / duration, 1);
                const e = easeOut(t);

                // 插值太阳直射点
                els.sunspot.setAttribute('cx', startSunspot.cx + (to.sunspot.cx - startSunspot.cx) * e);
                els.sunspot.setAttribute('cy', startSunspot.cy + (to.sunspot.cy - startSunspot.cy) * e);

                // 插值晨昏线
                els.terminator.setAttribute('x1', startTerminator.x1 + (to.terminator.x1 - startTerminator.x1) * e);
                els.terminator.setAttribute('y1', startTerminator.y1 + (to.terminator.y1 - startTerminator.y1) * e);
                els.terminator.setAttribute('x2', startTerminator.x2 + (to.terminator.x2 - startTerminator.x2) * e);
                els.terminator.setAttribute('y2', startTerminator.y2 + (to.terminator.y2 - startTerminator.y2) * e);

                // 插值标签位置
                els.sunspotLabel.setAttribute('x', startSunspotLabel.x + (to.sunspotLabel.x - startSunspotLabel.x) * e);
                els.sunspotLabel.setAttribute('y', startSunspotLabel.y + (to.sunspotLabel.y - startSunspotLabel.y) * e);
                els.terminatorLabel.setAttribute('x', startTerminatorLabel.x + (to.terminatorLabel.x - startTerminatorLabel.x) * e);
                els.terminatorLabel.setAttribute('y', startTerminatorLabel.y + (to.terminatorLabel.y - startTerminatorLabel.y) * e);

                // 插值极昼极夜透明度
                els.polarDay.setAttribute('fill-opacity', startPolarDayOpacity + (to.polarDayOpacity - startPolarDayOpacity) * e);
                els.polarNight.setAttribute('fill-opacity', startPolarNightOpacity + (to.polarNightOpacity - startPolarNightOpacity) * e);

                if (t < 1) {
                    requestAnimationFrame(frame);
                } else {
                    // 动画结束，设置最终值
                    els.night.setAttribute('d', to.nightPath);
                    els.polarDay.setAttribute('d', to.polarDayPath);
                    els.polarNight.setAttribute('d', to.polarNightPath);
                    els.infoTitle.textContent = to.title;
                    els.infoDirect.textContent = to.direct;
                    els.infoDaynight.textContent = to.daynight;
                    els.infoPolarday.textContent = to.polarday;
                    els.infoPolarnight.textContent = to.polarnight;
                    els.infoHeight.textContent = to.height;

                    currentState = targetStateName;
                    animating = false;
                }
            }

            // 在动画开始时立即切换path（path不做插值，直接切换）
            els.night.setAttribute('d', to.nightPath);
            els.polarDay.setAttribute('d', to.polarDayPath);
            els.polarNight.setAttribute('d', to.polarNightPath);

            // 更新文字信息（无动画）
            els.infoTitle.textContent = to.title;
            els.infoDirect.textContent = to.direct;
            els.infoDaynight.textContent = to.daynight;
            els.infoPolarday.textContent = to.polarday;
            els.infoPolarnight.textContent = to.polarnight;
            els.infoHeight.textContent = to.height;

            requestAnimationFrame(frame);
        }

        // 按钮事件
        els.btnSummer.addEventListener('click', function() {
            setActiveButton('summer');
            animateTo('summer');
        });
        els.btnEquinox.addEventListener('click', function() {
            setActiveButton('equinox');
            animateTo('equinox');
        });
        els.btnWinter.addEventListener('click', function() {
            setActiveButton('winter');
            animateTo('winter');
        });

        function setActiveButton(stateName) {
            els.btnSummer.classList.remove('active');
            els.btnEquinox.classList.remove('active');
            els.btnWinter.classList.remove('active');
            if (stateName === 'summer') els.btnSummer.classList.add('active');
            if (stateName === 'equinox') els.btnEquinox.classList.add('active');
            if (stateName === 'winter') els.btnWinter.classList.add('active');
        }
    })();
    </script>
</body>
</html>
