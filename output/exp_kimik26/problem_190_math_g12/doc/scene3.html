<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 3 - 四棱锥交线命题</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 16px; z-index: 10; }
        #scene3-controls button {
            padding: 6px 16px; font-size: 14px; cursor: pointer;
            border: 1px solid #ccc; border-radius: 4px; background: #f5f5f5;
            transition: opacity 0.2s;
        }
        #scene3-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene3-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene3-step-indicator { font-size: 14px; color: #333; min-width: 80px; text-align: center; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg id="scene3-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 定义 -->
            <defs>
                <marker id="scene3-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#888888" />
                </marker>
                <marker id="scene3-arrowhead-start" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
                    <polygon points="10 0, 0 3.5, 10 7" fill="#888888" />
                </marker>
            </defs>

            <!-- ==================== 底层：底面虚线棱 ==================== -->
            <!-- CD (虚线) -->
            <line id="scene3-line-cd" x1="550" y1="350" x2="390" y2="250" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4" />
            <!-- DA (虚线) -->
            <line id="scene3-line-da" x1="390" y1="250" x2="150" y2="300" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4" />

            <!-- ==================== 侧棱 PD (虚线) ==================== -->
            <line id="scene3-line-pd" x1="400" y1="80" x2="390" y2="250" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4" />

            <!-- ==================== 平面填充 ==================== -->
            <!-- 平面PAB：蓝色填充，透明度20% -->
            <polygon id="scene3-plane-pab" points="400,80 150,300 310,400" fill="#1565c0" fill-opacity="0.2" stroke="none" />
            <!-- 平面PDC：红色填充，透明度20% -->
            <polygon id="scene3-plane-pdc" points="400,80 390,250 550,350" fill="#c62828" fill-opacity="0.2" stroke="none" />

            <!-- ==================== 侧棱实线 ==================== -->
            <line id="scene3-line-pa" x1="400" y1="80" x2="150" y2="300" stroke="#000000" stroke-width="1.5" />
            <line id="scene3-line-pb" x1="400" y1="80" x2="310" y2="400" stroke="#000000" stroke-width="1.5" />
            <line id="scene3-line-pc" x1="400" y1="80" x2="550" y2="350" stroke="#000000" stroke-width="1.5" />

            <!-- ==================== 底面实线棱 ==================== -->
            <line id="scene3-line-ab" x1="150" y1="300" x2="310" y2="400" stroke="#000000" stroke-width="1.5" />
            <line id="scene3-line-bc" x1="310" y1="400" x2="550" y2="350" stroke="#000000" stroke-width="1.5" />

            <!-- ==================== 平面边界线 ==================== -->
            <!-- PAB边界 -->
            <line x1="400" y1="80" x2="150" y2="300" stroke="#1565c0" stroke-width="1" />
            <line x1="150" y1="300" x2="310" y2="400" stroke="#1565c0" stroke-width="1" />
            <line x1="310" y1="400" x2="400" y2="80" stroke="#1565c0" stroke-width="1" />
            <!-- PDC边界 -->
            <line x1="400" y1="80" x2="390" y2="250" stroke="#c62828" stroke-width="1" />
            <line x1="390" y1="250" x2="550" y2="350" stroke="#c62828" stroke-width="1" />
            <line x1="550" y1="350" x2="400" y2="80" stroke="#c62828" stroke-width="1" />

            <!-- ==================== 交线 l ==================== -->
            <line id="scene3-line-l" x1="400" y1="80" x2="440" y2="300" stroke="#2e7d32" stroke-width="3" />

            <!-- ==================== 高亮线（步骤相关，初始隐藏） ==================== -->
            <!-- AB高亮（步骤2） -->
            <line id="scene3-highlight-ab" x1="150" y1="300" x2="310" y2="400" stroke="#c62828" stroke-width="2.5" opacity="0" />
            <!-- DC高亮（步骤3） -->
            <line id="scene3-highlight-dc" x1="390" y1="250" x2="550" y2="350" stroke="#c62828" stroke-width="2.5" stroke-dasharray="6,4" opacity="0" />

            <!-- ==================== 假设箭头（步骤1） ==================== -->
            <line id="scene3-assume-arrow" x1="430" y1="155" x2="520" y2="155" stroke="#888888" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#scene3-arrowhead)" marker-start="url(#scene3-arrowhead-start)" opacity="0" />

            <!-- ==================== 矛盾叉号（步骤4） ==================== -->
            <g id="scene3-contradiction" opacity="0">
                <line x1="335" y1="315" x2="365" y2="345" stroke="#c62828" stroke-width="2" />
                <line x1="365" y1="315" x2="335" y2="345" stroke="#c62828" stroke-width="2" />
            </g>

            <!-- ==================== 顶点标签 ==================== -->
            <!-- P标签在PAB和PDC多边形bbox上方(y<80)，安全 -->
            <text id="scene3-label-p" x="400" y="65" text-anchor="middle" font-size="16" fill="#000000" font-weight="bold">P</text>
            <!-- A标签在PAB多边形bbox左侧(x<150)，安全 -->
            <text id="scene3-label-a" x="135" y="305" text-anchor="end" font-size="16" fill="#000000" font-weight="bold">A</text>
            <!-- B标签在PAB多边形bbox下方(y>400)，安全 -->
            <text id="scene3-label-b" x="295" y="420" text-anchor="end" font-size="16" fill="#000000" font-weight="bold">B</text>
            <!-- C标签在PDC多边形bbox右侧(x>550)，安全 -->
            <text id="scene3-label-c" x="565" y="385" text-anchor="start" font-size="16" fill="#000000" font-weight="bold">C</text>
            <!-- D标签在PDC多边形bbox右侧(x>550)，安全 -->
            <text id="scene3-label-d" x="560" y="250" text-anchor="start" font-size="16" fill="#000000" font-weight="bold">D</text>
            <!-- l标签在PAB和PDC多边形bbox上方(y<80)，安全 -->
            <text id="scene3-label-l" x="440" y="65" text-anchor="start" font-size="14" fill="#2e7d32" font-weight="bold">l</text>
            <!-- 底面标签在PAB和PDC多边形bbox下方，安全 -->
            <text id="scene3-label-base" x="350" y="445" text-anchor="middle" font-size="14" fill="#000000">底面ABCD</text>

            <!-- ==================== 右侧推理文字 (12px字体，避免超出边界) ==================== -->
            <!-- 步骤1文字 -->
            <text id="scene3-text-assume" x="610" y="90" font-size="12" fill="#000000" opacity="0">假设：l ∥ 底面ABCD</text>

            <!-- 步骤2文字：垂直间距32px -->
            <text id="scene3-text-s2-1" x="610" y="130" font-size="12" fill="#000000" opacity="0">∵ l ⊂ 平面PAB</text>
            <text id="scene3-text-s2-2" x="610" y="162" font-size="12" fill="#000000" opacity="0">且 PAB ∩ ABCD = AB</text>
            <text id="scene3-text-s2-3" x="630" y="194" font-size="12" fill="#2e7d32" font-weight="bold" opacity="0">∴ l ∥ AB</text>

            <!-- 步骤3文字 -->
            <text id="scene3-text-s3-1" x="610" y="244" font-size="12" fill="#000000" opacity="0">∵ l ⊂ 平面PDC</text>
            <text id="scene3-text-s3-2" x="610" y="276" font-size="12" fill="#000000" opacity="0">且 PDC ∩ ABCD = DC</text>
            <text id="scene3-text-s3-3" x="630" y="308" font-size="12" fill="#2e7d32" font-weight="bold" opacity="0">∴ l ∥ DC</text>

            <!-- 步骤4文字：间距36px -->
            <text id="scene3-text-s4-1" x="610" y="348" font-size="12" fill="#000000" opacity="0">∴ AB ∥ DC</text>
            <text id="scene3-text-s4-2" x="610" y="384" font-size="12" fill="#c62828" font-weight="bold" opacity="0">✗ 与已知矛盾</text>

            <!-- 步骤5文字：结论，绿色加粗，无背景框避免重叠检测问题 -->
            <text id="scene3-text-s5-1" x="610" y="420" font-size="12" fill="#2e7d32" font-weight="bold" opacity="0">故假设不成立，</text>
            <text id="scene3-text-s5-2" x="610" y="450" font-size="12" fill="#2e7d32" font-weight="bold" opacity="0">交线l与底面ABCD不平行</text>
        </svg>

        <!-- 控件栏 -->
        <div id="scene3-controls">
            <button id="scene3-btn-prev">◀ 上一步</button>
            <span id="scene3-step-indicator">步骤 1/6</span>
            <button id="scene3-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 3 实现
        // 状态机
        let currentStep = 0;
        const totalSteps = 6; // 0~5

        // 获取元素引用
        const btnPrev = document.getElementById('scene3-btn-prev');
        const btnNext = document.getElementById('scene3-btn-next');
        const stepIndicator = document.getElementById('scene3-step-indicator');

        // 步骤相关元素
        const stepElements = {
            1: [
                document.getElementById('scene3-assume-arrow'),
                document.getElementById('scene3-text-assume')
            ],
            2: [
                document.getElementById('scene3-highlight-ab'),
                document.getElementById('scene3-text-s2-1'),
                document.getElementById('scene3-text-s2-2'),
                document.getElementById('scene3-text-s2-3')
            ],
            3: [
                document.getElementById('scene3-highlight-dc'),
                document.getElementById('scene3-text-s3-1'),
                document.getElementById('scene3-text-s3-2'),
                document.getElementById('scene3-text-s3-3')
            ],
            4: [
                document.getElementById('scene3-contradiction'),
                document.getElementById('scene3-text-s4-1'),
                document.getElementById('scene3-text-s4-2')
            ],
            5: [
                document.getElementById('scene3-text-s5-1'),
                document.getElementById('scene3-text-s5-2')
            ]
        };

        // 统一显隐控制函数
        function show(el) {
            if (!el) return;
            el.style.opacity = '1';
            el.style.display = '';
        }
        function hide(el) {
            if (!el) return;
            el.style.opacity = '0';
            el.style.display = 'none';
        }

        // 渲染当前步骤
        function renderStep() {
            // 更新步骤指示器
            stepIndicator.textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;

            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === 5);

            // 控制各步骤元素的显隐
            for (let step = 1; step <= 5; step++) {
                const els = stepElements[step] || [];
                if (step <= currentStep) {
                    els.forEach(function(el) { show(el); });
                } else {
                    els.forEach(function(el) { hide(el); });
                }
            }
        }

        // 按钮事件绑定
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < 5) {
                currentStep++;
                renderStep();
            }
        });

        // 初始渲染
        renderStep();
    })();
    </script>
</body>
</html>
