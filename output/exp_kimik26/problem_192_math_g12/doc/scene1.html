            'r3c3': ['scene1-arrow-r3c3-r4c3', 'scene1-arrow-r3c3-r4c4'],
            'r4c1': ['scene1-arrow-r4c1-r5c1', 'scene1-arrow-r4c1-r5c2'],
            'r4c2': ['scene1-arrow-r4c2-r5c2', 'scene1-arrow-r4c2-r5c3'],
            'r4c3': ['scene1-arrow-r4c3-r5c3', 'scene1-arrow-r4c3-r5c4'],
            'r4c4': ['scene1-arrow-r4c4-r5c4', 'scene1-arrow-r4c4-r5c5']
        };

        // ===== DOM 引用 =====
        var btnPrev = document.getElementById('scene1-btn-prev');
        var btnNext = document.getElementById('scene1-btn-next');
        var btnReveal = document.getElementById('scene1-btn-reveal');
        var eqGroup = document.getElementById('scene1-eq-group');
        var eqDiv = document.getElementById('scene1-eq-div');
        var calcGroup = document.getElementById('scene1-calc-group');
        var calcDiv = document.getElementById('scene1-calc-div');
        var answerGroup = document.getElementById('scene1-answer-group');

        // ===== 辅助函数 =====
        function getNodeEl(nodeId) {
            return document.getElementById('scene1-node-' + nodeId);
        }
        function getNodeRect(nodeId) {
            var g = getNodeEl(nodeId);
            return g ? g.querySelector('rect') : null;
        }
        function getNodeDiv(nodeId) {
            return document.getElementById('scene1-node-' + nodeId + '-div');
        }
        function getArrowEl(arrowId) {
            return document.getElementById(arrowId);
        }

        function setNodeStyle(nodeId, style) {
            var rect = getNodeRect(nodeId);
            var div = getNodeDiv(nodeId);
            if (!rect) return;
            var color = '#000';
            var fill = '#fff';
            var strokeWidth = '1';
            switch (style) {
                case 'blue':
                    color = '#1565c0'; fill = 'rgba(21,101,192,0.2)'; strokeWidth = '2';
                    break;
                case 'green':
                    color = '#2e7d32'; fill = 'rgba(46,125,50,0.2)'; strokeWidth = '2';
                    break;
                case 'red':
                    color = '#c62828'; fill = 'rgba(198,40,40,0.2)'; strokeWidth = '2';
                    break;
                case 'dim':
                    color = '#888'; fill = '#fff'; strokeWidth = '1';
                    break;
                case 'default':
                default:
                    color = '#000'; fill = '#fff'; strokeWidth = '1';
                    break;
            }
            rect.setAttribute('fill', fill);
            rect.setAttribute('stroke', color);
            rect.setAttribute('stroke-width', strokeWidth);
            if (div) div.style.color = color;
        }

        function setArrowStyle(arrowId, style) {
            var arrow = getArrowEl(arrowId);
            if (!arrow) return;
            switch (style) {
                case 'green':
                    arrow.setAttribute('stroke', '#2e7d32');
                    arrow.setAttribute('stroke-width', '2');
                    arrow.setAttribute('opacity', '1');
                    break;
                case 'dim':
                    arrow.setAttribute('stroke', '#888');
                    arrow.setAttribute('stroke-width', '1');
                    arrow.setAttribute('opacity', '0.4');
                    break;
                case 'default':
                default:
                    arrow.setAttribute('stroke', '#000');
                    arrow.setAttribute('stroke-width', '1');
                    arrow.setAttribute('opacity', '1');
                    break;
            }
        }

        function show(el) { if (el) { el.style.display = ''; el.style.opacity = '1'; } }
        function hide(el) { if (el) { el.style.display = 'none'; el.style.opacity = '0'; } }

        // ===== 渲染函数 =====
        function render() {
            var allNodes = ['r1c1','r2c1','r2c2','r3c1','r3c2','r3c3','r4c1','r4c2','r4c3','r4c4','r5c1','r5c2','r5c3','r5c4','r5c5'];
            var allArrows = document.querySelectorAll('#scene1-arrows path');
            var r6Nodes = ['r6c1','r6c2','r6c3','r6c4','r6c5','r6c6'];

            // 重置所有节点为默认
            allNodes.forEach(function(n) { setNodeStyle(n, 'default'); });
            // 重置所有箭头为默认
            for (var i = 0; i < allArrows.length; i++) {
                setArrowStyle(allArrows[i].id, 'default');
            }
            // 隐藏行6
            r6Nodes.forEach(function(n) {
                var el = getNodeEl(n);
                if (el) el.style.display = 'none';
            });
            // 隐藏等式框、计算框、答案标注
            hide(eqGroup);
            hide(calcGroup);
            hide(answerGroup);

            // 按钮默认状态
            btnPrev.disabled = false;
            btnNext.disabled = false;
            btnReveal.style.display = 'none';
            btnReveal.disabled = false;

            if (currentStep === 0) {
                // 步骤0：显示行1-5，所有箭头，无高亮
                btnPrev.disabled = true;
            } else if (currentStep === 1) {
                // 步骤1：高亮选中的节点和子节点
                show(eqGroup);
                if (eqDiv) eqDiv.textContent = eqTexts[selectedNode] || '';

                // 淡化所有节点和箭头
                allNodes.forEach(function(n) { setNodeStyle(n, 'dim'); });
                for (var j = 0; j < allArrows.length; j++) {
                    setArrowStyle(allArrows[j].id, 'dim');
                }

                // 高亮选中节点（蓝色）
                setNodeStyle(selectedNode, 'blue');
                // 高亮子节点（绿色）
                var children = childMap[selectedNode] || [];
                children.forEach(function(c) { setNodeStyle(c, 'green'); });
                // 高亮对应箭头（绿色）
                var arrows = arrowMap[selectedNode] || [];
                arrows.forEach(function(a) { setArrowStyle(a, 'green'); });
            } else if (currentStep === 2) {
                // 步骤2：倒推第6行
                show(calcGroup);

                // 淡化所有节点和箭头
                allNodes.forEach(function(n) { setNodeStyle(n, 'dim'); });
                for (var k = 0; k < allArrows.length; k++) {
                    setArrowStyle(allArrows[k].id, 'dim');
                }

                // 显示行6节点1（1/6）蓝色高亮
                var r6c1 = getNodeEl('r6c1');
                if (r6c1) { r6c1.style.display = ''; setNodeStyle('r6c1', 'blue'); }

                // 显示行6节点2位置
                var r6c2 = getNodeEl('r6c2');
                if (r6c2) { r6c2.style.display = ''; }
                var r6c2Rect = document.getElementById('scene1-node-r6c2-rect');
                var r6c2Div = document.getElementById('scene1-node-r6c2-div');

                // 高亮第5行第1个节点（1/5）蓝色
                setNodeStyle('r5c1', 'blue');

                if (!step2Revealed) {
                    // 未揭示：虚线框，无文字
                    if (r6c2Rect) {
                        r6c2Rect.setAttribute('fill', 'none');
                        r6c2Rect.setAttribute('stroke', '#888');
                        r6c2Rect.setAttribute('stroke-width', '1');
                        r6c2Rect.setAttribute('stroke-dasharray', '4,3');
                    }
                    if (r6c2Div) { r6c2Div.textContent = ''; }
                    if (calcDiv) calcDiv.textContent = '第6行第2个数 = ?';

                    // 按钮布局：上一步、揭示计算、下一步
                    btnReveal.style.display = '';
                } else {
                    // 已揭示：红色高亮，显示1/30
                    if (r6c2Rect) {
                        r6c2Rect.setAttribute('fill', 'rgba(198,40,40,0.2)');
                        r6c2Rect.setAttribute('stroke', '#c62828');
                        r6c2Rect.setAttribute('stroke-width', '2');
                        r6c2Rect.removeAttribute('stroke-dasharray');
                    }
                    if (r6c2Div) {
                        r6c2Div.textContent = '1/30';
                        r6c2Div.style.color = '#c62828';
                    }
                    // 计算文本使用 HTML span 实现红色加粗
                    if (calcDiv) {
                        calcDiv.innerHTML = '1/5 − 1/6 = 6/30 − 5/30 = <span style="color:#c62828;font-weight:bold;">1/30</span>';
                    }
                }
            } else if (currentStep === 3) {
                // 步骤3：确认答案
                show(calcGroup);
                show(answerGroup);
                btnNext.disabled = true;

                // 显示所有行6节点
                r6Nodes.forEach(function(n) {
                    var el = getNodeEl(n);
                    if (el) el.style.display = '';
                });

                // 恢复所有节点默认样式
                allNodes.forEach(function(n) { setNodeStyle(n, 'default'); });
                // 恢复所有箭头默认样式
                for (var m = 0; m < allArrows.length; m++) {
                    setArrowStyle(allArrows[m].id, 'default');
                }
                // 行6其他节点默认样式
                ['r6c1','r6c3','r6c4','r6c5','r6c6'].forEach(function(n) { setNodeStyle(n, 'default'); });

                // 第6行第2个保持红色高亮
                setNodeStyle('r6c2', 'red');

                // 计算文本保持显示
                if (calcDiv) {
                    calcDiv.innerHTML = '1/5 − 1/6 = 6/30 − 5/30 = <span style="color:#c62828;font-weight:bold;">1/30</span>';
                }
            }
        }

        // ===== 事件绑定 =====
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                if (currentStep < 2) step2Revealed = false;
                render();
            }
        });
        btnNext.addEventListener('click', function() {
            if (currentStep < 3) {
                currentStep++;
                render();
            }
        });
        btnReveal.addEventListener('click', function() {
            step2Revealed = true;
            render();
        });

        // 步骤1节点点击事件
        var clickableNodes = ['r1c1','r2c1','r2c2','r3c1','r3c2','r3c3','r4c1','r4c2','r4c3','r4c4'];
        clickableNodes.forEach(function(nodeId) {
            var el = getNodeEl(nodeId);
            if (el) {
                el.style.cursor = 'pointer';
                el.addEventListener('click', function() {
                    if (currentStep === 1) {
                        selectedNode = nodeId;
                        render();
                    }
                });
            }
        });

        // 初始渲染
        render();
    })();
    </script>
</body>
</html>
