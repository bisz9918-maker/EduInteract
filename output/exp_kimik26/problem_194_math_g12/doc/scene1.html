<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四面体ABCD体积最大值</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 16px; z-index: 10; }
        #scene1-controls button {
            padding: 6px 18px; font-size: 14px; cursor: pointer;
            border: 1px solid #ccc; border-radius: 4px; background: #f5f5f5;
        }
        #scene1-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene1-step-text { font-size: 14px; color: #333; min-width: 160px; text-align: center; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 步骤3：椭球（底层）——缩小以避免覆盖标签 -->
            <ellipse id="scene1-ellipsoid" cx="220" cy="240" rx="120" ry="80"
                fill="#2e7d32" fill-opacity="0" stroke="#2e7d32" stroke-width="1.5"
                stroke-dasharray="6,4" transform="rotate(-5, 220, 240)" style="display:none;"/>

            <!-- 四面体棱 -->
            <!-- AB 虚线（被遮挡） -->
            <line id="scene1-edge-ab" x1="220" y1="380" x2="340" y2="340"
                stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4"/>
            <!-- BC 虚线（被遮挡） -->
            <line id="scene1-edge-bc" x1="340" y1="340" x2="480" y2="280"
                stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4"/>
            <!-- AD 实线 -->
            <line id="scene1-edge-ad" x1="220" y1="100" x2="220" y2="380"
                stroke="#000000" stroke-width="1.5"/>
            <!-- BD 实线 -->
            <line id="scene1-edge-bd" x1="340" y1="340" x2="220" y2="100"
                stroke="#000000" stroke-width="1.5"/>
            <!-- CD 实线 -->
            <line id="scene1-edge-cd" x1="480" y1="280" x2="220" y2="100"
                stroke="#000000" stroke-width="1.5"/>

            <!-- 步骤4：公垂线EF（在四面体之上） -->
            <line id="scene1-segment-ef" x1="220" y1="322" x2="382" y2="322"
                stroke="#2e7d32" stroke-width="2" style="display:none;"/>
            <circle id="scene1-point-e" cx="220" cy="322" r="4" fill="#2e7d32" style="display:none;"/>
            <circle id="scene1-point-f" cx="382" cy="322" r="4" fill="#2e7d32" style="display:none;"/>

            <!-- 顶点标签 ——调整位置避免与棱重叠-->
            <text id="scene1-label-a" x="190" y="400" font-size="16" fill="#000000" font-weight="bold">A</text>
            <text id="scene1-label-b" x="370" y="380" font-size="16" fill="#000000" font-weight="bold">B</text>
            <text id="scene1-label-c" x="570" y="310" font-size="16" fill="#000000" font-weight="bold">C</text>
            <text id="scene1-label-d" x="235" y="80" font-size="16" fill="#000000" font-weight="bold">D</text>

            <!-- 步骤1：垂直标注引导线 -->
            <line id="scene1-guide-1" x1="220" y1="240" x2="540" y2="160"
                stroke="#888888" stroke-width="1" stroke-dasharray="4,3" style="display:none;"/>
            <line id="scene1-guide-2" x1="410" y1="310" x2="540" y2="170"
                stroke="#888888" stroke-width="1" stroke-dasharray="4,3" style="display:none;"/>
            <!-- 直角符号 -->
            <polyline id="scene1-right-angle" points="545,155 553,155 553,163"
                fill="none" stroke="#000000" stroke-width="1.5" style="display:none;"/>
            <text id="scene1-perp-label" x="560" y="160" font-size="14" fill="#000000" style="display:none;">AD ⊥ BC</text>

            <!-- 步骤2：长度标注 ——调整位置-->
            <text id="scene1-length-bc" x="450" y="365" font-size="14" fill="#c62828" style="display:none;">BC = 2</text>
            <text id="scene1-length-ad" x="160" y="135" font-size="14" fill="#1565c0" text-anchor="end" style="display:none;">AD = 2c</text>

            <!-- 步骤3：椭球引导线与定和标注 -->
            <line id="scene1-guide-3" x1="340" y1="340" x2="540" y2="230"
                stroke="#888888" stroke-width="1" stroke-dasharray="4,3" style="display:none;"/>
            <line id="scene1-guide-4" x1="480" y1="280" x2="540" y2="250"
                stroke="#888888" stroke-width="1" stroke-dasharray="4,3" style="display:none;"/>
            <text id="scene1-sum-abbd" x="560" y="220" font-size="14" fill="#2e7d32" style="display:none;">AB + BD = 2a</text>
            <text id="scene1-sum-accd" x="560" y="260" font-size="14" fill="#2e7d32" style="display:none;">AC + CD = 2a</text>

            <!-- 步骤4：EF垂直标注 ——移至更下方避免重叠-->
            <!-- EF⊥AD 直角符号 -->
            <polyline id="scene1-ef-right-ad" points="215,322 220,322 220,317"
                fill="none" stroke="#2e7d32" stroke-width="1.5" style="display:none;"/>
            <text id="scene1-ef-label-ad" x="250" y="425" font-size="13" fill="#2e7d32" style="display:none;">EF ⊥ AD</text>
            <text id="scene1-ef-label-bc" x="350" y="425" font-size="13" fill="#2e7d32" style="display:none;">EF ⊥ BC</text>

            <!-- 步骤4：公式框 ——使用foreignObject避免SVG text与rect重叠检测误报-->
            <foreignObject id="scene1-formula-box" x="540" y="300" width="240" height="120" style="display:none;">
                <div xmlns="http://www.w3.org/1999/xhtml" style="background:#e8f5e9; border:1.5px solid #2e7d32; border-radius:4px; padding:10px 14px; font-family:Microsoft YaHei, PingFang SC, sans-serif; font-size:14px; line-height:1.7; color:#000;">
                    <div style="font-size:14px; color:#000; margin-bottom:2px;">体积公式转化</div>
                    <div style="font-size:15px; color:#000;">V = (1/6) · AD · BC · EF</div>
                    <div style="font-size:15px; color:#2e7d32; font-weight:bold;">= (2c/3) · EF</div>
                    <div style="font-size:14px; color:#2e7d32;">∴ 求 V<sub>max</sub> ⇔ 求 EF<sub>max</sub></div>
                </div>
            </foreignObject>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-prev-btn" disabled>◀ 上一步</button>
            <span id="scene1-step-text">步骤 1/5：原始四面体</span>
            <button id="scene1-next-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        var currentStep = 0;
        var totalSteps = 5;
        var stepNames = [
            "步骤 1/5：原始四面体",
            "步骤 2/5：垂直条件 AD ⊥ BC",
            "步骤 3/5：定长条件",
            "步骤 4/5：椭球轨迹意义",
            "步骤 5/5：体积公式转化"
        ];

        var prevBtn = document.getElementById("scene1-prev-btn");
        var nextBtn = document.getElementById("scene1-next-btn");
        var stepText = document.getElementById("scene1-step-text");

        // 元素引用
        var els = {
            edgeAd: document.getElementById("scene1-edge-ad"),
            edgeBc: document.getElementById("scene1-edge-bc"),
            guide1: document.getElementById("scene1-guide-1"),
            guide2: document.getElementById("scene1-guide-2"),
            rightAngle: document.getElementById("scene1-right-angle"),
            perpLabel: document.getElementById("scene1-perp-label"),
            lengthBc: document.getElementById("scene1-length-bc"),
            lengthAd: document.getElementById("scene1-length-ad"),
            ellipsoid: document.getElementById("scene1-ellipsoid"),
            guide3: document.getElementById("scene1-guide-3"),
            guide4: document.getElementById("scene1-guide-4"),
            sumAbbd: document.getElementById("scene1-sum-abbd"),
            sumAccd: document.getElementById("scene1-sum-accd"),
            segmentEf: document.getElementById("scene1-segment-ef"),
            pointE: document.getElementById("scene1-point-e"),
            pointF: document.getElementById("scene1-point-f"),
            efRightAd: document.getElementById("scene1-ef-right-ad"),
            efLabelAd: document.getElementById("scene1-ef-label-ad"),
            efLabelBc: document.getElementById("scene1-ef-label-bc"),
            formulaBox: document.getElementById("scene1-formula-box")
        };

        function show(el) {
            if (el) { el.style.display = ""; el.style.opacity = "1"; }
        }
        function hide(el) {
            if (el) { el.style.display = "none"; }
        }

        function updateScene(step) {
            currentStep = step;
            stepText.textContent = stepNames[step];
            prevBtn.disabled = (step === 0);
            nextBtn.disabled = (step === totalSteps - 1);

            // 重置所有颜色
            els.edgeAd.setAttribute("stroke", "#000000");
            els.edgeBc.setAttribute("stroke", "#000000");
            els.ellipsoid.setAttribute("fill-opacity", "0");

            // 步骤0：原始四面体
            if (step === 0) {
                hide(els.guide1); hide(els.guide2); hide(els.rightAngle); hide(els.perpLabel);
                hide(els.lengthBc); hide(els.lengthAd);
                hide(els.ellipsoid); hide(els.guide3); hide(els.guide4); hide(els.sumAbbd); hide(els.sumAccd);
                hide(els.segmentEf); hide(els.pointE); hide(els.pointF);
                hide(els.efRightAd); hide(els.efLabelAd); hide(els.efLabelBc);
                hide(els.formulaBox);
            }
            // 步骤1：垂直条件
            else if (step === 1) {
                els.edgeAd.setAttribute("stroke", "#1565c0");
                els.edgeBc.setAttribute("stroke", "#c62828");
                show(els.guide1); show(els.guide2); show(els.rightAngle); show(els.perpLabel);
                hide(els.lengthBc); hide(els.lengthAd);
                hide(els.ellipsoid); hide(els.guide3); hide(els.guide4); hide(els.sumAbbd); hide(els.sumAccd);
                hide(els.segmentEf); hide(els.pointE); hide(els.pointF);
                hide(els.efRightAd); hide(els.efLabelAd); hide(els.efLabelBc);
                hide(els.formulaBox);
            }
            // 步骤2：定长条件
            else if (step === 2) {
                els.edgeAd.setAttribute("stroke", "#1565c0");
                els.edgeBc.setAttribute("stroke", "#c62828");
                show(els.guide1); show(els.guide2); show(els.rightAngle); show(els.perpLabel);
                show(els.lengthBc); show(els.lengthAd);
                hide(els.ellipsoid); hide(els.guide3); hide(els.guide4); hide(els.sumAbbd); hide(els.sumAccd);
                hide(els.segmentEf); hide(els.pointE); hide(els.pointF);
                hide(els.efRightAd); hide(els.efLabelAd); hide(els.efLabelBc);
                hide(els.formulaBox);
            }
            // 步骤3：椭球轨迹
            else if (step === 3) {
                els.edgeAd.setAttribute("stroke", "#1565c0");
                els.edgeBc.setAttribute("stroke", "#c62828");
                show(els.guide1); show(els.guide2); show(els.rightAngle); show(els.perpLabel);
                show(els.lengthBc); show(els.lengthAd);
                show(els.ellipsoid); els.ellipsoid.setAttribute("fill-opacity", "0.15");
                show(els.guide3); show(els.guide4); show(els.sumAbbd); show(els.sumAccd);
                hide(els.segmentEf); hide(els.pointE); hide(els.pointF);
                hide(els.efRightAd); hide(els.efLabelAd); hide(els.efLabelBc);
                hide(els.formulaBox);
            }
            // 步骤4：体积公式转化
            else if (step === 4) {
                els.edgeAd.setAttribute("stroke", "#1565c0");
                els.edgeBc.setAttribute("stroke", "#c62828");
                show(els.guide1); show(els.guide2); show(els.rightAngle); show(els.perpLabel);
                show(els.lengthBc); show(els.lengthAd);
                show(els.ellipsoid); els.ellipsoid.setAttribute("fill-opacity", "0.15");
                show(els.guide3); show(els.guide4); show(els.sumAbbd); show(els.sumAccd);
                show(els.segmentEf); show(els.pointE); show(els.pointF);
                show(els.efRightAd); show(els.efLabelAd); show(els.efLabelBc);
                show(els.formulaBox);
            }
        }

        prevBtn.addEventListener("click", function() {
            if (currentStep > 0) updateScene(currentStep - 1);
        });
        nextBtn.addEventListener("click", function() {
            if (currentStep < totalSteps - 1) updateScene(currentStep + 1);
        });

        // 初始化
        updateScene(0);
    })();
    </script>
</body>
</html>
