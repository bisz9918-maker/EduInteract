<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圆中切线割线问题</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-container svg { position: absolute; top: 0; left: 0; }
        #scene1-formula-panel {
            position: absolute;
            left: 550px;
            top: 80px;
            width: 220px;
            height: 280px;
            background: #f5f5f5;
            border: 1px solid #dddddd;
            border-radius: 4px;
            padding: 15px;
            box-sizing: border-box;
            font-size: 14px;
            line-height: 1.6;
            color: #333;
            z-index: 5;
        }
        #scene1-formula-panel .formula-title {
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 10px;
            color: #000;
        }
        #scene1-formula-panel .formula-step {
            margin-bottom: 8px;
        }
        #scene1-formula-panel .highlight-red {
            color: #c62828;
            font-weight: bold;
            font-size: 16px;
        }
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }
        #scene1-controls button {
            padding: 8px 16px;
            font-size: 14px;
            font-family: "Microsoft YaHei", sans-serif;
            cursor: pointer;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #fff;
            min-width: 100px;
        }
        #scene1-controls button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #scene1-controls button:hover:not(:disabled) {
            background: #f0f0f0;
        }
        #scene1-step-indicator {
            font-size: 14px;
            color: #666;
            min-width: 60px;
            text-align: center;
        }
        /* 过渡效果 */
        .scene1-transition {
            transition: opacity 0.3s ease, stroke 0.3s ease, stroke-width 0.3s ease, fill-opacity 0.3s ease;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 圆O -->
            <circle id="scene1-circle" cx="320" cy="237" r="173" fill="none" stroke="#000000" stroke-width="2" class="scene1-transition"/>
            
            <!-- 直径AC -->
            <line id="scene1-line-ac" x1="320" y1="64" x2="320" y2="410" stroke="#000000" stroke-width="2" class="scene1-transition"/>
            
            <!-- 切线PA -->
            <line id="scene1-line-pa" x1="120" y1="410" x2="320" y2="410" stroke="#000000" stroke-width="2" class="scene1-transition"/>
            
            <!-- 割线PC -->
            <line id="scene1-line-pc" x1="120" y1="410" x2="320" y2="64" stroke="#000000" stroke-width="2" class="scene1-transition"/>
            
            <!-- 线段AB -->
            <line id="scene1-line-ab" x1="320" y1="410" x2="170" y2="323.5" stroke="#000000" stroke-width="2" class="scene1-transition"/>
            
            <!-- 线段PB -->
            <line id="scene1-line-pb" x1="120" y1="410" x2="170" y2="323.5" stroke="#000000" stroke-width="2" class="scene1-transition"/>
            
            <!-- 线段BC -->
            <line id="scene1-line-bc" x1="170" y1="323.5" x2="320" y2="64" stroke="#000000" stroke-width="2" class="scene1-transition"/>
            
            <!-- 半径OA -->
            <line id="scene1-line-oa" x1="320" y1="237" x2="320" y2="410" stroke="#000000" stroke-width="2" class="scene1-transition" style="display:none"/>
            
            <!-- Rt△PAC填充 -->
            <polygon id="scene1-triangle-fill" points="120,410 320,410 320,64" fill="#1565c0" fill-opacity="0" stroke="none" class="scene1-transition"/>
            
            <!-- 直角符号 -->
            <path id="scene1-right-angle" d="M 308,410 L 308,398 L 320,398" fill="none" stroke="#1565c0" stroke-width="2" style="display:none" class="scene1-transition"/>
            
            <!-- 点标签 -->
            <text id="scene1-label-p" x="100" y="430" font-size="16" fill="#000000" font-family="Microsoft YaHei, sans-serif">P</text>
            <text id="scene1-label-a" x="420" y="445" font-size="16" fill="#000000" font-family="Microsoft YaHei, sans-serif">A</text>
            <text id="scene1-label-b" x="110" y="300" font-size="16" fill="#000000" font-family="Microsoft YaHei, sans-serif">B</text>
            <text id="scene1-label-c" x="315" y="45" font-size="16" fill="#000000" font-family="Microsoft YaHei, sans-serif">C</text>
            <text id="scene1-label-o" x="500" y="237" font-size="16" fill="#000000" font-family="Microsoft YaHei, sans-serif">O</text>
            
            <!-- 数值标注 -->
            <text id="scene1-text-pa" x="210" y="430" font-size="14" fill="#1565c0" font-family="Microsoft YaHei, sans-serif" style="display:none">PA = 2</text>
            <text id="scene1-text-pb" x="80" y="360" font-size="14" fill="#1565c0" font-family="Microsoft YaHei, sans-serif" style="display:none">PB = 1</text>
            <text id="scene1-text-pc" x="80" y="250" font-size="14" fill="#2e7d32" font-family="Microsoft YaHei, sans-serif" style="display:none">PC = 4</text>
            <text id="scene1-text-bc" x="500" y="170" font-size="14" fill="#2e7d32" font-family="Microsoft YaHei, sans-serif" style="display:none">BC = 3</text>
            <text id="scene1-text-ac" x="500" y="120" font-size="14" fill="#2e7d32" font-family="Microsoft YaHei, sans-serif" style="display:none">AC = 2√3</text>
            <text id="scene1-text-r" x="500" y="323.5" font-size="14" fill="#c62828" font-family="Microsoft YaHei, sans-serif" style="display:none">R = √3</text>
        </svg>
        
        <!-- 公式面板 -->
        <div id="scene1-formula-panel">
            <div class="formula-title" id="scene1-formula-title">已知条件</div>
            <div id="scene1-formula-content">
                <div class="formula-step">PA 是圆 O 的切线，切点为 A</div>
                <div class="formula-step">AC 是圆 O 的直径</div>
                <div class="formula-step">PA = 2，PB = 1</div>
            </div>
        </div>
        
        <!-- 控制栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">1 / 6</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现
        var currentStep = 0;
        var totalSteps = 6;
        
        // 获取元素
        var btnPrev = document.getElementById('scene1-btn-prev');
        var btnNext = document.getElementById('scene1-btn-next');
        var stepIndicator = document.getElementById('scene1-step-indicator');
        var formulaTitle = document.getElementById('scene1-formula-title');
        var formulaContent = document.getElementById('scene1-formula-content');
        
        // 图形元素
        var lineAC = document.getElementById('scene1-line-ac');
        var linePA = document.getElementById('scene1-line-pa');
        var linePC = document.getElementById('scene1-line-pc');
        var lineBC = document.getElementById('scene1-line-bc');
        var lineOA = document.getElementById('scene1-line-oa');
        var rightAngle = document.getElementById('scene1-right-angle');
        var triangleFill = document.getElementById('scene1-triangle-fill');
        
        // 标注元素
        var textPA = document.getElementById('scene1-text-pa');
        var textPB = document.getElementById('scene1-text-pb');
        var textPC = document.getElementById('scene1-text-pc');
        var textBC = document.getElementById('scene1-text-bc');
        var textAC = document.getElementById('scene1-text-ac');
        var textR = document.getElementById('scene1-text-r');
        
        function setDisplay(el, show) {
            if (!el) return;
            el.style.display = show ? 'block' : 'none';
            if (el.tagName.toLowerCase() === 'polygon') {
                el.style.display = show ? 'block' : 'none';
            }
        }
        
        function setStroke(el, color, width) {
            if (!el) return;
            el.setAttribute('stroke', color);
            el.setAttribute('stroke-width', width);
        }
        
        function setFillOpacity(el, opacity) {
            if (!el) return;
            el.setAttribute('fill-opacity', opacity);
        }
        
        function renderStep() {
            // 重置所有元素到默认状态
            setStroke(lineAC, '#000000', '2');
            setStroke(linePA, '#000000', '2');
            setStroke(linePC, '#000000', '2');
            setStroke(lineBC, '#000000', '2');
            setStroke(lineOA, '#000000', '2');
            setDisplay(rightAngle, false);
            setFillOpacity(triangleFill, 0);
            setDisplay(textPA, false);
            setDisplay(textPB, false);
            setDisplay(textPC, false);
            setDisplay(textBC, false);
            setDisplay(textAC, false);
            setDisplay(textR, false);
            setDisplay(lineOA, false);
            
            switch (currentStep) {
                case 0:
                    // 步骤0：识图 - 显示已知条件
                    formulaTitle.textContent = '已知条件';
                    formulaContent.innerHTML = 
                        '<div class="formula-step">PA 是圆 O 的切线，切点为 A</div>' +
                        '<div class="formula-step">AC 是圆 O 的直径</div>' +
                        '<div class="formula-step">PA = 2，PB = 1</div>';
                    setDisplay(textPA, true);
                    setDisplay(textPB, true);
                    break;
                    
                case 1:
                    // 步骤1：发现垂直
                    formulaTitle.textContent = '发现垂直关系';
                    formulaContent.innerHTML = 
                        '<div class="formula-step">切线 ⊥ 过切点的直径</div>' +
                        '<div class="formula-step">→ ∠PAC = 90°</div>' +
                        '<div class="formula-step">因此 △PAC 是直角三角形</div>';
                    setDisplay(rightAngle, true);
                    setStroke(linePA, '#1565c0', '3');
                    setStroke(lineAC, '#1565c0', '3');
                    setDisplay(textPA, true);
                    setDisplay(textPB, true);
                    break;
                    
                case 2:
                    // 步骤2：应用切割线定理
                    formulaTitle.textContent = '应用切割线定理';
                    formulaContent.innerHTML = 
                        '<div class="formula-step">切割线定理：PA² = PB · PC</div>' +
                        '<div class="formula-step">代入已知：2² = 1 × PC</div>';
                    setStroke(linePC, '#2e7d32', '3');
                    setStroke(lineAC, '#888888', '2');
                    setDisplay(textPA, true);
                    setDisplay(textPB, true);
                    break;
                    
                case 3:
                    // 步骤3：计算长度
                    formulaTitle.textContent = '计算线段长度';
                    formulaContent.innerHTML = 
                        '<div class="formula-step">PA² = PB · PC</div>' +
                        '<div class="formula-step">4 = 1 × PC → PC = 4</div>' +
                        '<div class="formula-step">BC = PC − PB = 4 − 1 = 3</div>';
                    setStroke(linePC, '#2e7d32', '3');
                    setStroke(lineBC, '#2e7d32', '3');
                    setStroke(lineAC, '#888888', '2');
                    setDisplay(textPA, true);
                    setDisplay(textPB, true);
                    setDisplay(textPC, true);
                    setDisplay(textBC, true);
                    break;
                    
                case 4:
                    // 步骤4：勾股定理
                    formulaTitle.textContent = '勾股定理求直径';
                    formulaContent.innerHTML = 
                        '<div class="formula-step">在 Rt△PAC 中：</div>' +
                        '<div class="formula-step">AC² + PA² = PC²</div>' +
                        '<div class="formula-step">AC² = 16 − 4 = 12</div>' +
                        '<div class="formula-step">AC = 2√3</div>';
                    setDisplay(rightAngle, true);
                    setStroke(linePA, '#1565c0', '3');
                    setStroke(lineAC, '#1565c0', '3');
                    setFillOpacity(triangleFill, 0.2);
                    setDisplay(textPA, true);
                    setDisplay(textPB, true);
                    setDisplay(textPC, true);
                    setDisplay(textBC, true);
                    setDisplay(textAC, true);
                    break;
                    
                case 5:
                    // 步骤5：得出结论
                    formulaTitle.textContent = '得出结论';
                    formulaContent.innerHTML = 
                        '<div class="formula-step">圆的半径 R = AC / 2</div>' +
                        '<div class="formula-step">R = 2√3 / 2 = √3</div>' +
                        '<div class="formula-step highlight-red">R = √3</div>';
                    setDisplay(rightAngle, true);
                    setStroke(linePA, '#1565c0', '3');
                    setStroke(lineAC, '#1565c0', '3');
                    setFillOpacity(triangleFill, 0.15);
                    setDisplay(lineOA, true);
                    setStroke(lineOA, '#c62828', '3');
                    setDisplay(textPA, true);
                    setDisplay(textPB, true);
                    setDisplay(textPC, true);
                    setDisplay(textBC, true);
                    setDisplay(textAC, true);
                    setDisplay(textR, true);
                    break;
            }
            
            // 更新按钮状态
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps - 1;
            stepIndicator.textContent = (currentStep + 1) + ' / ' + totalSteps;
        }
        
        // 事件绑定
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        });
        
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                renderStep();
            }
        });
        
        // 初始渲染
        renderStep();
    })();
    </script>
</body>
</html>
