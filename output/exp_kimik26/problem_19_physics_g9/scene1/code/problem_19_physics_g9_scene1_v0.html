<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>铅笔芯并联电路分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        .scene1-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: #f0f0f0; }
        .scene1-btn:hover { background: #e0e0e0; }
        .scene1-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 14px; color: #333; min-width: 80px; text-align: center; }

        /* 数据面板样式 */
        #scene1-panel { position: absolute; left: 440px; top: 20px; width: 340px; height: 410px; background: #f5f5f5; border: 1px solid #ddd; font-family: sans-serif; box-sizing: border-box; z-index: 5; }
        #scene1-panel-header { text-align: center; font-size: 16px; font-weight: bold; padding: 12px 0 8px; color: #000; }
        .scene1-panel-row { display: flex; justify-content: space-between; padding: 5px 20px; font-size: 14px; color: #000; }
        .scene1-dial-row { display: flex; align-items: center; padding: 5px 20px; }
        .scene1-dial-row span:first-child { font-size: 14px; width: 30px; color: #000; }
        .scene1-dial { width: 56px; height: 56px; border: 1px solid #000; border-radius: 50%; position: relative; margin: 0 12px; background: #fff; box-sizing: border-box; }
        .scene1-pointer { position: absolute; left: 50%; top: 50%; width: 22px; height: 2px; background: #000; transform-origin: 0 50%; transform: translate(0, -50%) rotate(180deg); }
        .scene1-dial.glow-blue { box-shadow: 0 0 6px 2px #1565c0; border-color: #1565c0; border-width: 2px; }
        .scene1-dial.glow-red { box-shadow: 0 0 6px 2px #c62828; border-color: #c62828; border-width: 2px; }
        #scene1-panel-formula { display: none; padding: 10px 20px; font-size: 13px; line-height: 1.8; color: #000; }
        #scene1-panel-answer { display: none; text-align: center; font-size: 24px; color: #2e7d32; font-weight: bold; padding: 15px 0; }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .blink { animation: blink 0.8s infinite; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 箭头标记定义 -->
            <defs>
                <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#1565c0"/>
                </marker>
                <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#c62828"/>
                </marker>
            </defs>

            <!-- 顶部导线（用独立line代替polyline，避免bbox过大） -->
            <line x1="220" y1="30" x2="80" y2="30" stroke="#000" stroke-width="2"/>
            <line x1="80" y1="30" x2="80" y2="162" stroke="#000" stroke-width="2"/>
            <line x1="220" y1="30" x2="380" y2="30" stroke="#000" stroke-width="2"/>
            <line x1="380" y1="30" x2="380" y2="162" stroke="#000" stroke-width="2"/>

            <!-- 电源 -->
            <g id="scene1-battery">
                <line x1="220" y1="45" x2="220" y2="55" stroke="#000" stroke-width="3"/>
                <line x1="210" y1="55" x2="230" y2="55" stroke="#000" stroke-width="2"/>
                <line x1="215" y1="60" x2="225" y2="60" stroke="#000" stroke-width="2"/>
                <line x1="210" y1="65" x2="230" y2="65" stroke="#000" stroke-width="2"/>
                <line x1="220" y1="65" x2="220" y2="75" stroke="#000" stroke-width="2"/>
            </g>
            <text x="255" y="60" font-size="14" fill="#000">电源</text>

            <!-- 开关S -->
            <g id="scene1-switch">
                <line x1="220" y1="75" x2="220" y2="110" stroke="#000" stroke-width="2"/>
                <line x1="220" y1="110" x2="220" y2="140" stroke="#000" stroke-width="2"/>
                <line x1="220" y1="110" x2="235" y2="125" stroke="#000" stroke-width="2"/>
                <circle cx="220" cy="110" r="2" fill="#000"/>
                <circle cx="220" cy="140" r="2" fill="#000"/>
            </g>
            <text x="245" y="110" font-size="14" fill="#000">S</text>

            <!-- S下导线到P-S水平线 -->
            <line x1="220" y1="140" x2="220" y2="160" stroke="#000" stroke-width="2"/>

            <!-- A1 -->
            <circle cx="80" cy="180" r="18" fill="#fff" stroke="#000" stroke-width="2"/>
            <text x="35" y="180" font-size="14" text-anchor="middle" fill="#000" dominant-baseline="middle">A₁</text>
            <line x1="80" y1="198" x2="80" y2="320" stroke="#000" stroke-width="2"/>

            <!-- A2 -->
            <circle cx="380" cy="180" r="18" fill="#fff" stroke="#000" stroke-width="2"/>
            <text x="425" y="180" font-size="14" text-anchor="middle" fill="#000" dominant-baseline="middle">A₂</text>
            <line x1="380" y1="198" x2="380" y2="320" stroke="#000" stroke-width="2"/>

            <!-- P-S水平线和竖线（动态） -->
            <line id="scene1-ps-h" x1="220" y1="160" x2="230" y2="160" stroke="#000" stroke-width="2"/>
            <line id="scene1-ps-v" x1="230" y1="160" x2="230" y2="320" stroke="#000" stroke-width="2"/>

            <!-- 铅笔芯AB -->
            <line x1="80" y1="320" x2="380" y2="320" stroke="#333" stroke-width="4"/>
            <text x="80" y="340" font-size="14" text-anchor="middle" fill="#000">A</text>
            <text x="380" y="340" font-size="14" text-anchor="middle" fill="#000">B</text>

            <!-- 滑片P -->
            <g id="scene1-p-group" transform="translate(230, 320)">
                <polygon points="-6,0 6,0 0,-10" fill="#000"/>
            </g>
            <text id="scene1-p-label" x="230" y="265" font-size="14" text-anchor="middle" fill="#000">P</text>

            <!-- 刻度尺 -->
            <line x1="80" y1="350" x2="380" y2="350" stroke="#000" stroke-width="1"/>
            <line x1="80" y1="350" x2="80" y2="360" stroke="#000" stroke-width="1"/>
            <line x1="155" y1="350" x2="155" y2="360" stroke="#000" stroke-width="1"/>
            <line x1="230" y1="350" x2="230" y2="360" stroke="#000" stroke-width="1"/>
            <line x1="305" y1="350" x2="305" y2="360" stroke="#000" stroke-width="1"/>
            <line x1="380" y1="350" x2="380" y2="360" stroke="#000" stroke-width="1"/>
            <g id="scene1-short-ticks"></g>
            <text x="80" y="375" font-size="12" text-anchor="middle" fill="#000">0</text>
            <text x="155" y="375" font-size="12" text-anchor="middle" fill="#000">6</text>
            <text x="230" y="375" font-size="12" text-anchor="middle" fill="#000">12</text>
            <text x="305" y="375" font-size="12" text-anchor="middle" fill="#000">18</text>
            <text x="380" y="375" font-size="12" text-anchor="middle" fill="#000">24</text>

            <!-- 边界标记 -->
            <g id="scene1-mark-c" style="display:none; opacity:0;">
                <polygon points="155,310 151,318 159,318" fill="#2e7d32"/>
                <text x="155" y="295" font-size="12" text-anchor="middle" fill="#2e7d32">c</text>
            </g>
            <g id="scene1-mark-d" style="display:none; opacity:0;">
                <polygon points="305,310 301,318 309,318" fill="#2e7d32"/>
                <text x="305" y="295" font-size="12" text-anchor="middle" fill="#2e7d32">d</text>
            </g>
            <g id="scene1-mark-cp" style="display:none; opacity:0;">
                <polygon points="95,310 91,318 99,318" fill="#1565c0"/>
                <text x="95" y="295" font-size="12" text-anchor="middle" fill="#1565c0">c'</text>
            </g>
            <g id="scene1-mark-dp" style="display:none; opacity:0;">
                <polygon points="365,310 361,318 369,318" fill="#1565c0"/>
                <text x="365" y="295" font-size="12" text-anchor="middle" fill="#1565c0">d'</text>
            </g>

            <!-- 允许范围 -->
            <rect id="scene1-range-cd" x="155" y="316" width="150" height="8" fill="#2e7d32" fill-opacity="0.2" style="display:none; opacity:0;"/>
            <rect id="scene1-range-cpd" x="95" y="316" width="270" height="8" fill="#2e7d32" fill-opacity="0.2" style="display:none; opacity:0;"/>

            <!-- 电流路径箭头 -->
            <g id="scene1-arrows-left" style="display:none; opacity:0;">
                <line x1="150" y1="25" x2="120" y2="25" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-blue)"/>
                <line x1="80" y1="120" x2="80" y2="150" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-blue)"/>
                <line x1="120" y1="315" x2="150" y2="315" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-blue)"/>
            </g>
            <g id="scene1-arrows-right" style="display:none; opacity:0;">
                <line x1="290" y1="25" x2="320" y2="25" stroke="#c62828" stroke-width="2" marker-end="url(#arrow-red)"/>
                <line x1="380" y1="120" x2="380" y2="150" stroke="#c62828" stroke-width="2" marker-end="url(#arrow-red)"/>
                <line x1="340" y1="315" x2="310" y2="315" stroke="#c62828" stroke-width="2" marker-end="url(#arrow-red)"/>
            </g>
        </svg>

        <!-- 数据面板（HTML实现，避免SVG文字与背景矩形重叠检测误报） -->
        <div id="scene1-panel">
            <div id="scene1-panel-header">数据面板</div>
            <div id="scene1-panel-data">
                <div class="scene1-panel-row"><span>量程</span><span id="scene1-panel-range">--</span></div>
                <div class="scene1-panel-row"><span>x</span><span id="scene1-panel-x">--</span></div>
                <div class="scene1-panel-row"><span>R₁</span><span id="scene1-panel-r1">--</span></div>
                <div class="scene1-panel-row"><span>R₂</span><span id="scene1-panel-r2">--</span></div>
                <div class="scene1-dial-row">
                    <span>I₁</span>
                    <div class="scene1-dial" id="scene1-dial-a1"><div class="scene1-pointer" id="scene1-pointer-a1"></div></div>
                    <span id="scene1-panel-i1">--</span>
                </div>
                <div class="scene1-dial-row">
                    <span>I₂</span>
                    <div class="scene1-dial" id="scene1-dial-a2"><div class="scene1-pointer" id="scene1-pointer-a2"></div></div>
                    <span id="scene1-panel-i2">--</span>
                </div>
                <div class="scene1-panel-row"><span>I₁:I₂</span><span id="scene1-panel-ratio">--</span></div>
                <div class="scene1-panel-row"><span>允许范围</span><span id="scene1-panel-allow">--</span></div>
            </div>
            <div id="scene1-panel-formula"></div>
            <div id="scene1-panel-answer">A、D</div>
        </div>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 0/7</span>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        let currentStep = 0;
        let xP = 230; // 滑片P的x坐标，初始中点
        const xMin = 80, xMax = 380;
        const L = 24; // 总长度cm
        const Ur = 3.6; // U/r = 3.6 A·cm

        // SVG元素引用
        const svg = document.getElementById('scene1-svg');
        const pGroup = document.getElementById('scene1-p-group');
        const pLabel = document.getElementById('scene1-p-label');
        const psH = document.getElementById('scene1-ps-h');
        const psV = document.getElementById('scene1-ps-v');

        // 标记和范围
        const markC = document.getElementById('scene1-mark-c');
        const markD = document.getElementById('scene1-mark-d');
        const markCp = document.getElementById('scene1-mark-cp');
        const markDp = document.getElementById('scene1-mark-dp');
        const rangeCd = document.getElementById('scene1-range-cd');
        const rangeCpd = document.getElementById('scene1-range-cpd');
        const arrowsLeft = document.getElementById('scene1-arrows-left');
        const arrowsRight = document.getElementById('scene1-arrows-right');

        // HTML面板元素引用
        const panelRange = document.getElementById('scene1-panel-range');
        const panelX = document.getElementById('scene1-panel-x');
        const panelR1 = document.getElementById('scene1-panel-r1');
        const panelR2 = document.getElementById('scene1-panel-r2');
        const panelI1 = document.getElementById('scene1-panel-i1');
        const panelI2 = document.getElementById('scene1-panel-i2');
        const panelRatio = document.getElementById('scene1-panel-ratio');
        const panelAllow = document.getElementById('scene1-panel-allow');
        const dialA1 = document.getElementById('scene1-dial-a1');
        const dialA2 = document.getElementById('scene1-dial-a2');
        const pointerA1 = document.getElementById('scene1-pointer-a1');
        const pointerA2 = document.getElementById('scene1-pointer-a2');
        const panelData = document.getElementById('scene1-panel-data');
        const panelFormula = document.getElementById('scene1-panel-formula');
        const panelAnswer = document.getElementById('scene1-panel-answer');

        // 按钮
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');

        // 生成短刻度
        const tickGroup = document.getElementById('scene1-short-ticks');
        for (let i = 1; i < 20; i++) {
            if (i % 5 !== 0) {
                const x = 80 + i * 15;
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', x);
                line.setAttribute('y1', 350);
                line.setAttribute('x2', x);
                line.setAttribute('y2', 355);
                line.setAttribute('stroke', '#000');
                line.setAttribute('stroke-width', '1');
                tickGroup.appendChild(line);
            }
        }

        // 工具函数
        function pxToCm(px) { return (px - 80) / 12.5; }
        function cmToPx(cm) { return 80 + cm * 12.5; }

        function show(el) {
            if (!el) return;
            el.style.display = 'block';
            void el.offsetWidth;
            el.style.opacity = '1';
        }
        function hide(el) {
            if (!el) return;
            el.style.opacity = '0';
            setTimeout(function() {
                if (el.style.opacity === '0') el.style.display = 'none';
            }, 300);
        }

        function setPointer(i, imax, pointerEl) {
            const ratio = Math.min(i, imax) / imax;
            const angle = 180 - ratio * 180; // 180°(0A,9点) -> 0°(满偏,3点)
            pointerEl.style.transform = 'translate(0, -50%) rotate(' + angle + 'deg)';
        }

        function updatePanel(xPx, rangeMax) {
            const x = pxToCm(xPx);
            const r1 = x;
            const r2 = L - x;
            const i1 = x > 0.01 ? Ur / x : 999;
            const i2 = r2 > 0.01 ? Ur / r2 : 999;

            panelX.textContent = x.toFixed(1) + ' cm';
            panelR1.textContent = r1.toFixed(1) + ' Ω';
            panelR2.textContent = r2.toFixed(1) + ' Ω';
            panelI1.textContent = i1 > 100 ? '∞' : i1.toFixed(2) + ' A';
            panelI2.textContent = i2 > 100 ? '∞' : i2.toFixed(2) + ' A';

            if (i1 > 100 || i2 > 100 || i1 < 0.001 || i2 < 0.001) {
                panelRatio.textContent = '∞';
            } else {
                const ratioVal = i1 / i2;
                if (ratioVal >= 1) {
                    panelRatio.textContent = ratioVal.toFixed(1) + ':1';
                } else {
                    panelRatio.textContent = '1:' + (1/ratioVal).toFixed(1);
                }
            }

            // 更新指针
            setPointer(i1, rangeMax, pointerA1);
            setPointer(i2, rangeMax, pointerA2);

            // 满偏高亮
            dialA1.classList.remove('glow-blue');
            dialA2.classList.remove('glow-red');
            if (i1 >= rangeMax - 0.01) {
                dialA1.classList.add('glow-blue');
            }
            if (i2 >= rangeMax - 0.01) {
                dialA2.classList.add('glow-red');
            }
        }

        function moveP(targetX, duration, callback) {
            const startX = xP;
            const startTime = performance.now();

            function animate(now) {
                const elapsed = now - startTime;
                const t = Math.min(elapsed / duration, 1);
                const ease = 1 - Math.pow(1 - t, 3);
                xP = startX + (targetX - startX) * ease;
                updatePPosition();

                if (t < 1) {
                    requestAnimationFrame(animate);
                } else {
                    if (callback) callback();
                }
            }
            requestAnimationFrame(animate);
        }

        function updatePPosition() {
            pGroup.setAttribute('transform', 'translate(' + xP + ', 320)');
            pLabel.setAttribute('x', xP);
            psH.setAttribute('x2', xP);
            psV.setAttribute('x1', xP);
            psV.setAttribute('x2', xP);
        }

        // 拖拽功能
        let isDragging = false;

        function getMousePos(evt) {
            const rect = svg.getBoundingClientRect();
            const clientX = evt.clientX || (evt.touches && evt.touches[0] ? evt.touches[0].clientX : 0);
            const clientY = evt.clientY || (evt.touches && evt.touches[0] ? evt.touches[0].clientY : 0);
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function onPointerDown(evt) {
            if (currentStep !== 2) return;
            const pos = getMousePos(evt);
            if (Math.abs(pos.x - xP) < 25 && Math.abs(pos.y - 320) < 35) {
                isDragging = true;
            }
        }

        function onPointerMove(evt) {
            if (!isDragging || currentStep !== 2) return;
            if (evt.type === 'touchmove') evt.preventDefault();
            const pos = getMousePos(evt);
            xP = Math.max(xMin, Math.min(xMax, pos.x));
            updatePPosition();
            updatePanel(xP, 10);
        }

        function onPointerUp() {
            isDragging = false;
        }

        svg.addEventListener('mousedown', onPointerDown);
        svg.addEventListener('mousemove', onPointerMove);
        svg.addEventListener('mouseup', onPointerUp);
        svg.addEventListener('mouseleave', onPointerUp);

        svg.addEventListener('touchstart', onPointerDown, {passive: true});
        svg.addEventListener('touchmove', onPointerMove, {passive: false});
        svg.addEventListener('touchend', onPointerUp);

        // 步骤更新
        let animationCallbacks = [];

        function clearAnimations() {
            animationCallbacks.forEach(function(id) { clearTimeout(id); });
            animationCallbacks = [];
        }

        function updateScene(step) {
            clearAnimations();
            currentStep = step;
            stepIndicator.textContent = '步骤 ' + step + '/7';
            btnPrev.disabled = step === 0;
            btnNext.disabled = step === 7;

            // 重置所有特殊状态
            markC.classList.remove('blink');
            markD.classList.remove('blink');
            markCp.classList.remove('blink');
            markDp.classList.remove('blink');
            hide(markC);
            hide(markD);
            hide(markCp);
            hide(markDp);
            hide(rangeCd);
            hide(rangeCpd);
            hide(arrowsLeft);
            hide(arrowsRight);
            dialA1.classList.remove('glow-blue');
            dialA2.classList.remove('glow-red');

            // 恢复面板显示
            panelData.style.display = 'block';
            panelFormula.style.display = 'none';
            panelFormula.innerHTML = '';
            panelAnswer.style.display = 'none';

            switch(step) {
                case 0:
                    panelRange.textContent = '--';
                    panelAllow.textContent = '--';
                    updatePanel(230, 0.6);
                    break;

                case 1:
                    show(arrowsLeft);
                    show(arrowsRight);
                    panelRange.textContent = '--';
                    panelAllow.textContent = '--';
                    updatePanel(xP, 0.6);
                    break;

                case 2:
                    panelRange.textContent = '不限';
                    panelAllow.textContent = '--';
                    updatePanel(xP, 10);
                    break;

                case 3:
                    panelRange.textContent = '0-0.6A';
                    moveP(155, 400, function() {
                        updatePanel(xP, 0.6);
                    });
                    show(markC);
                    markC.classList.add('blink');
                    panelAllow.textContent = '--';
                    break;

                case 4:
                    panelRange.textContent = '0-0.6A';
                    moveP(305, 400, function() {
                        updatePanel(xP, 0.6);
                    });
                    show(markC);
                    show(markD);
                    markD.classList.add('blink');
                    show(rangeCd);
                    panelAllow.textContent = '12cm';
                    break;

                case 5:
                    panelRange.textContent = '0-0.6A';
                    moveP(230, 400, function() {
                        updatePanel(xP, 0.6);
                    });
                    show(markC);
                    // 显示公式，隐藏数据
                    panelData.style.display = 'none';
                    panelFormula.style.display = 'block';
                    panelFormula.innerHTML =
                        '<div>c点：I₁:I₂ = 3:1 → (L-x):x = 3:1</div>' +
                        '<div>　　→ x<sub>c</sub> = L/4 = 6cm</div>' +
                        '<div>d点：I₂ = 0.6A → x<sub>d</sub> = 3L/4 = 18cm</div>' +
                        '<div>cd = x<sub>d</sub> - x<sub>c</sub> = L/2 = 12cm</div>' +
                        '<div style="color:#2e7d32; font-weight:bold;">∴ L = 24cm，U/r = 3.6 A·cm</div>';
                    panelAllow.textContent = '12cm';
                    break;

                case 6:
                    panelRange.textContent = '0-3A';
                    moveP(95, 400, function() {
                        updatePanel(xP, 3);
                        var tid = setTimeout(function() {
                            moveP(365, 400, function() {
                                updatePanel(xP, 3);
                            });
                        }, 600);
                        animationCallbacks.push(tid);
                    });
                    show(markCp);
                    show(markDp);
                    show(rangeCpd);
                    panelAllow.textContent = '21.6cm';
                    break;

                case 7:
                    panelRange.textContent = '0-3A';
                    moveP(95, 400, function() {
                        updatePanel(xP, 3);
                    });
                    show(markCp);
                    show(markDp);
                    show(rangeCpd);
                    // 显示公式和答案，隐藏数据
                    panelData.style.display = 'none';
                    panelFormula.style.display = 'block';
                    panelFormula.innerHTML =
                        '<div style="color:#2e7d32; font-weight:bold;">最大比值 = 3 : 3.6/22.8 = 19 : 1</div>' +
                        '<div style="color:#2e7d32; font-weight:bold;">允许范围 c\'d\' = 21.6cm</div>';
                    panelAnswer.style.display = 'block';
                    panelAllow.textContent = '21.6cm';
                    break;
            }
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) updateScene(currentStep - 1);
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < 7) updateScene(currentStep + 1);
        });

        // 初始化
        updateScene(0);
    })();
    </script>
</body>
</html>
