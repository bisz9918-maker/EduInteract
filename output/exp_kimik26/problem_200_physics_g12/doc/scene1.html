<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 1 - U形管压强分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "SimHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-controls button { padding: 6px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: #f5f5f5; }
        #scene1-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene1-step-indicator { font-size: 14px; color: #666; min-width: 80px; text-align: center; }
        .scene1-overlay { position: absolute; z-index: 5; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" viewBox="0 0 800 500">
            <defs>
                <!-- 水银斜线填充 pattern -->
                <pattern id="scene1-mercury-pattern" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
                    <line x1="0" y1="0" x2="0" y2="8" stroke="#2e7d32" stroke-width="1.5" opacity="0.4"/>
                </pattern>
                <!-- 箭头 marker -->
                <marker id="scene1-arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32"/>
                </marker>
                <marker id="scene1-arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#c62828"/>
                </marker>
                <marker id="scene1-arrowhead-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#9e9e9e"/>
                </marker>
            </defs>
            
            <!-- 封闭气体区域 -->
            <rect id="scene1-gas" x="280" y="210" width="40" height="190" fill="#ffcdd2" fill-opacity="0.1" stroke="#c62828" stroke-width="2"/>
            
            <!-- B 管外框 -->
            <rect id="scene1-pipe-b" x="280" y="170" width="40" height="230" fill="none" stroke="#000" stroke-width="2"/>
            
            <!-- A 管外框 -->
            <rect id="scene1-pipe-a" x="220" y="145" width="160" height="25" fill="none" stroke="#000" stroke-width="2"/>
            
            <!-- A 管水银 -->
            <rect id="scene1-mercury-a" x="220" y="150" width="160" height="20" fill="url(#scene1-mercury-pattern)" stroke="#2e7d32" stroke-width="1"/>
            
            <!-- B 管水银 -->
            <rect id="scene1-mercury-b" x="280" y="170" width="40" height="40" fill="url(#scene1-mercury-pattern)" stroke="#2e7d32" stroke-width="1"/>
            
            <!-- 活塞 -->
            <rect id="scene1-piston" x="210" y="140" width="180" height="5" fill="#bbb" stroke="#333" stroke-width="1"/>
            
            <!-- F 箭头 -->
            <line id="scene1-f-arrow" x1="300" y1="140" x2="300" y2="115" stroke="#9e9e9e" stroke-width="2" marker-end="url(#scene1-arrowhead-gray)"/>
            
            <!-- 基础标签 -->
            <text id="scene1-label-a" x="200" y="158" font-size="16" fill="#000" dominant-baseline="middle">A</text>
            <text id="scene1-label-b" x="260" y="185" font-size="16" fill="#000" dominant-baseline="middle">B</text>
            <text id="scene1-label-p0" x="210" y="120" font-size="14" fill="#000" dominant-baseline="middle">p₀=75cmHg</text>
            <text id="scene1-label-f" x="350" y="120" font-size="14" fill="#000" dominant-baseline="middle">F</text>
            <text id="scene1-label-gas" x="340" y="305" font-size="14" fill="#000" dominant-baseline="middle">封闭气体</text>
            <text id="scene1-label-l" x="150" y="305" font-size="14" fill="#000" dominant-baseline="middle">L=112cm</text>
            
            <!-- h₁ 尺寸标注 -->
            <line x1="380" y1="150" x2="390" y2="150" stroke="#000" stroke-width="1"/>
            <line x1="380" y1="170" x2="390" y2="170" stroke="#000" stroke-width="1"/>
            <line x1="390" y1="150" x2="390" y2="170" stroke="#000" stroke-width="1"/>
            <line x1="386" y1="154" x2="390" y2="150" stroke="#000" stroke-width="1"/>
            <line x1="394" y1="154" x2="390" y2="150" stroke="#000" stroke-width="1"/>
            <line x1="386" y1="166" x2="390" y2="170" stroke="#000" stroke-width="1"/>
            <line x1="394" y1="166" x2="390" y2="170" stroke="#000" stroke-width="1"/>
            <text id="scene1-label-h1" x="400" y="160" font-size="14" fill="#000" dominant-baseline="middle">h₁=5cm</text>
            
            <!-- h₂ 尺寸标注 -->
            <line x1="320" y1="170" x2="340" y2="170" stroke="#000" stroke-width="1"/>
            <line x1="320" y1="210" x2="340" y2="210" stroke="#000" stroke-width="1"/>
            <line x1="340" y1="170" x2="340" y2="210" stroke="#000" stroke-width="1"/>
            <line x1="336" y1="174" x2="340" y2="170" stroke="#000" stroke-width="1"/>
            <line x1="344" y1="174" x2="340" y2="170" stroke="#000" stroke-width="1"/>
            <line x1="336" y1="206" x2="340" y2="210" stroke="#000" stroke-width="1"/>
            <line x1="344" y1="206" x2="340" y2="210" stroke="#000" stroke-width="1"/>
            <text id="scene1-label-h2" x="350" y="200" font-size="14" fill="#000" dominant-baseline="middle">h₂=10cm</text>
            
            <!-- L 尺寸标注 -->
            <line x1="280" y1="210" x2="270" y2="210" stroke="#000" stroke-width="1"/>
            <line x1="280" y1="400" x2="270" y2="400" stroke="#000" stroke-width="1"/>
            <line x1="270" y1="210" x2="270" y2="400" stroke="#000" stroke-width="1"/>
            <line x1="266" y1="214" x2="270" y2="210" stroke="#000" stroke-width="1"/>
            <line x1="274" y1="214" x2="270" y2="210" stroke="#000" stroke-width="1"/>
            <line x1="266" y1="396" x2="270" y2="400" stroke="#000" stroke-width="1"/>
            <line x1="274" y1="396" x2="270" y2="400" stroke="#000" stroke-width="1"/>
            
            <!-- 步骤2路径箭头（SVG线条） -->
            <line id="scene1-path-main" x1="300" y1="150" x2="300" y2="210" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#scene1-arrowhead-green)" style="display:none"/>
            <line id="scene1-path-wrong" x1="240" y1="210" x2="240" y2="150" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#scene1-arrowhead-red)" style="display:none"/>
        </svg>
        
        <!-- 步骤1 HTML覆盖层 -->
        <div id="scene1-step1-overlay" class="scene1-overlay" style="display:none; left:440px; top:120px; width:300px;">
            <div style="border:1px dashed #888; padding:15px; background:rgba(255,255,255,0.95);">
                <div style="font-size:14px; font-weight:bold; margin-bottom:10px;">水银体积守恒</div>
                <div style="font-size:14px; margin-bottom:10px;">4h₁+h₂=4×5+10=30</div>
                <div style="font-size:13px; color:#666;">（以S_B为单位）</div>
            </div>
        </div>
        
        <!-- 步骤1面积比标签（HTML覆盖层） -->
        <div id="scene1-label-sa" class="scene1-overlay" style="display:none; left:340px; top:130px; font-size:14px; color:#1565c0;">S_A=4S</div>
        <div id="scene1-label-sb" class="scene1-overlay" style="display:none; left:290px; top:405px; font-size:14px; color:#c62828;">S_B=S</div>
        
        <!-- 步骤2 HTML覆盖层 -->
        <div id="scene1-step2-overlay" class="scene1-overlay" style="display:none; left:450px; top:240px; width:280px;">
            <div style="font-size:14px; font-weight:bold; margin-bottom:10px;">压强分析路径</div>
            <div style="font-size:14px; margin-bottom:10px;">从A管水银面→B管气体界面</div>
            <div style="font-size:14px; margin-bottom:10px;">总深度 h₁+h₂=15cm</div>
            <div style="font-size:14px;">压强增加 15cmHg</div>
        </div>
        
        <!-- 步骤2路径标签（HTML覆盖层） -->
        <div id="scene1-label-ph1" class="scene1-overlay" style="display:none; left:390px; top:145px; font-size:14px; color:#2e7d32;">+h₁</div>
        <div id="scene1-label-ph2" class="scene1-overlay" style="display:none; left:390px; top:185px; font-size:14px; color:#2e7d32;">+h₂</div>
        <div id="scene1-label-pgas" class="scene1-overlay" style="display:none; left:390px; top:215px; font-size:14px; color:#2e7d32;">p_gas</div>
        
        <!-- 步骤3 HTML覆盖层 -->
        <div id="scene1-step3-overlay" class="scene1-overlay" style="display:none; left:440px; top:260px; width:300px;">
            <div style="border:2px solid #2e7d32; padding:15px; background:rgba(232,245,233,0.6);">
                <div style="font-size:14px; font-weight:bold; margin-bottom:10px;">封闭气体压强</div>
                <div style="font-size:14px; margin-bottom:8px;">p_gas=p_A+h₁+h₂</div>
                <div style="font-size:14px; margin-bottom:8px;">=75+5+10</div>
                <div style="font-size:16px; color:#2e7d32; font-weight:bold;">=90 cmHg</div>
            </div>
        </div>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1 / 4</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        var currentStep = 0;
        var totalSteps = 4;
        
        var btnPrev = document.getElementById('scene1-btn-prev');
        var btnNext = document.getElementById('scene1-btn-next');
        var indicator = document.getElementById('scene1-step-indicator');
        
        // SVG元素
        var svgEls = {
            pipeA: document.getElementById('scene1-pipe-a'),
            pipeB: document.getElementById('scene1-pipe-b'),
            gas: document.getElementById('scene1-gas'),
            mercuryA: document.getElementById('scene1-mercury-a'),
            mercuryB: document.getElementById('scene1-mercury-b'),
            pathMain: document.getElementById('scene1-path-main'),
            pathWrong: document.getElementById('scene1-path-wrong')
        };
        
        // HTML覆盖层元素
        var overlayEls = {
            step1: document.getElementById('scene1-step1-overlay'),
            step2: document.getElementById('scene1-step2-overlay'),
            step3: document.getElementById('scene1-step3-overlay'),
            labelSa: document.getElementById('scene1-label-sa'),
            labelSb: document.getElementById('scene1-label-sb'),
            labelPh1: document.getElementById('scene1-label-ph1'),
            labelPh2: document.getElementById('scene1-label-ph2'),
            labelPgas: document.getElementById('scene1-label-pgas')
        };
        
        function setDisplay(el, show) {
            if (!el) return;
            el.style.display = show ? 'block' : 'none';
        }
        
        function renderStep(step) {
            // 重置所有高亮
            svgEls.pipeA.setAttribute('stroke', '#000');
            svgEls.pipeA.setAttribute('stroke-width', '2');
            svgEls.pipeB.setAttribute('stroke', '#000');
            svgEls.pipeB.setAttribute('stroke-width', '2');
            svgEls.gas.setAttribute('fill-opacity', '0.1');
            svgEls.gas.setAttribute('stroke-width', '2');
            svgEls.mercuryA.setAttribute('opacity', '1');
            svgEls.mercuryB.setAttribute('opacity', '1');
            
            // 隐藏所有步骤元素
            setDisplay(overlayEls.step1, false);
            setDisplay(overlayEls.step2, false);
            setDisplay(overlayEls.step3, false);
            setDisplay(overlayEls.labelSa, false);
            setDisplay(overlayEls.labelSb, false);
            setDisplay(overlayEls.labelPh1, false);
            setDisplay(overlayEls.labelPh2, false);
            setDisplay(overlayEls.labelPgas, false);
            setDisplay(svgEls.pathMain, false);
            setDisplay(svgEls.pathWrong, false);
            
            if (step >= 1) {
                // 步骤1：面积比与体积守恒
                svgEls.pipeA.setAttribute('stroke', '#1565c0');
                svgEls.pipeA.setAttribute('stroke-width', '3');
                svgEls.pipeB.setAttribute('stroke', '#c62828');
                svgEls.pipeB.setAttribute('stroke-width', '3');
                setDisplay(overlayEls.labelSa, true);
                setDisplay(overlayEls.labelSb, true);
                setDisplay(overlayEls.step1, true);
            }
            
            if (step >= 2) {
                // 步骤2：压强分析路径
                setDisplay(svgEls.pathMain, true);
                setDisplay(svgEls.pathWrong, true);
                setDisplay(overlayEls.labelPh1, true);
                setDisplay(overlayEls.labelPh2, true);
                setDisplay(overlayEls.labelPgas, true);
                setDisplay(overlayEls.step2, true);
                // 水银加深高亮
                svgEls.mercuryA.setAttribute('opacity', '0.8');
                svgEls.mercuryB.setAttribute('opacity', '0.8');
            }
            
            if (step >= 3) {
                // 步骤3：计算结论
                setDisplay(overlayEls.step3, true);
                // 隐藏步骤2的文字说明（避免与结论重叠）
                setDisplay(overlayEls.step2, false);
                svgEls.gas.setAttribute('fill-opacity', '0.25');
                svgEls.gas.setAttribute('stroke-width', '3');
            }
            
            // 更新按钮状态
            btnPrev.disabled = step === 0;
            btnNext.disabled = step === totalSteps - 1;
            indicator.textContent = '步骤 ' + (step + 1) + ' / ' + totalSteps;
        }
        
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep(currentStep);
            }
        });
        
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                renderStep(currentStep);
            }
        });
        
        // 初始渲染
        renderStep(currentStep);
    })();
    </script>
</body>
</html>
