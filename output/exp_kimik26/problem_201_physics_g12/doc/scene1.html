<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>带电粒子在复合场中的运动 - 场景1</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            padding: 6px 18px; font-size: 14px; cursor: pointer;
            background: #f5f5f5; border: 1px solid #cccccc; border-radius: 4px;
            transition: background 0.2s;
        }
        #scene1-controls button:hover { background: #e0e0e0; }
        #scene1-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene1-step-display { font-size: 14px; color: #333; min-width: 40px; text-align: center; }

        /* 步骤元素的淡入效果 */
        .scene1-step-el { transition: opacity 0.3s ease; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500" style="display:block;">
            <defs>
                <!-- 箭头标记定义 -->
                <marker id="scene1-arrow-red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
                    <path d="M0,0 L10,4 L0,8 Z" fill="#c62828"/>
                </marker>
                <marker id="scene1-arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
                    <path d="M0,0 L10,4 L0,8 Z" fill="#2e7d32"/>
                </marker>
                <marker id="scene1-arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
                    <path d="M0,0 L10,4 L0,8 Z" fill="#1565c0"/>
                </marker>
                <marker id="scene1-arrow-blue-small" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                    <path d="M0,0 L8,3 L0,6 Z" fill="#1565c0"/>
                </marker>
            </defs>

            <!-- 右侧说明区背景 -->
            <rect x="530" y="20" width="250" height="400" fill="#fafafa" stroke="#e0e0e0" stroke-width="1" rx="4"/>

            <!-- ========== 基础元素（所有步骤都显示） ========== -->
            <!-- 电场线 -->
            <g id="scene1-field-lines" class="scene1-step-el" data-step="base">
                <line x1="30" y1="120" x2="500" y2="120" stroke="#1565c0" stroke-width="1" marker-end="url(#scene1-arrow-blue-small)"/>
                <line x1="30" y1="220" x2="500" y2="220" stroke="#1565c0" stroke-width="1" marker-end="url(#scene1-arrow-blue-small)"/>
                <line x1="30" y1="320" x2="500" y2="320" stroke="#1565c0" stroke-width="1" marker-end="url(#scene1-arrow-blue-small)"/>
            </g>

            <!-- A点 -->
            <g id="scene1-point-a" class="scene1-step-el" data-step="base">
                <circle cx="150" cy="320" r="4" fill="#000000" stroke="#000000" stroke-width="1.5"/>
                <text x="130" y="340" font-size="16" fill="#000000" font-family="serif" font-style="italic">A</text>
            </g>

            <!-- v₀ 箭头 -->
            <g id="scene1-v0-arrow" class="scene1-step-el" data-step="base">
                <line x1="150" y1="320" x2="150" y2="240" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrow-red)"/>
                <text x="115" y="275" font-size="16" fill="#c62828" font-family="serif" font-style="italic">v₀</text>
            </g>

            <!-- ========== 步骤0 基础条件说明 ========== -->
            <g id="scene1-desc-0" class="scene1-step-el" data-step="0">
                <foreignObject x="540" y="30" width="230" height="380">
                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:#333;line-height:1.6;">
                        <p><strong>基础条件</strong></p>
                        <p>粒子从 A 点以初速度 v₀ 竖直向上射入水平匀强电场。</p>
                    </div>
                </foreignObject>
            </g>

            <!-- ========== 步骤1 受力分析 ========== -->
            <!-- mg 箭头 -->
            <g id="scene1-mg-arrow" class="scene1-step-el" data-step="1">
                <line x1="150" y1="320" x2="150" y2="395" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene1-arrow-green)"/>
                <text x="135" y="415" font-size="16" fill="#2e7d32" font-family="serif" font-style="italic">mg</text>
            </g>

            <!-- qE 箭头 -->
            <g id="scene1-qe-arrow" class="scene1-step-el" data-step="1">
                <line x1="150" y1="320" x2="235" y2="320" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-blue)"/>
                <text x="245" y="325" font-size="16" fill="#1565c0" font-family="serif" font-style="italic">qE</text>
            </g>

            <!-- 步骤1说明文字 -->
            <g id="scene1-desc-1" class="scene1-step-el" data-step="1">
                <foreignObject x="540" y="30" width="230" height="380">
                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:#333;line-height:1.6;">
                        <p><strong>受力分析</strong></p>
                        <p>重力 <span style="color:#2e7d32;font-style:italic;">mg</span> 竖直向下</p>
                        <p>电场力 <span style="color:#1565c0;font-style:italic;">qE</span> 水平向右</p>
                    </div>
                </foreignObject>
            </g>

            <!-- ========== 步骤2 运动轨迹 ========== -->
            <!-- B点 -->
            <g id="scene1-point-b" class="scene1-step-el" data-step="2">
                <circle cx="350" cy="220" r="4" fill="#000000" stroke="#000000" stroke-width="1.5"/>
                <text x="335" y="210" font-size="16" fill="#000000" font-family="serif" font-style="italic">B</text>
            </g>

            <!-- 轨迹 -->
            <path id="scene1-trajectory" class="scene1-step-el" data-step="2" fill="none" stroke="#000000" stroke-width="1.5"/>

            <!-- v_B 箭头 -->
            <g id="scene1-vb-arrow" class="scene1-step-el" data-step="2">
                <line x1="350" y1="220" x2="430" y2="220" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrow-red)"/>
                <text x="395" y="205" font-size="16" fill="#c62828" font-family="serif" font-style="italic">v_B=2v₀</text>
            </g>

            <!-- 步骤2说明文字 -->
            <g id="scene1-desc-2" class="scene1-step-el" data-step="2">
                <foreignObject x="540" y="30" width="230" height="380">
                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:#333;line-height:1.6;">
                        <p><strong>运动轨迹</strong></p>
                        <p>粒子做曲线运动，到达 B 点时速度水平向右，大小为 2v₀。</p>
                    </div>
                </foreignObject>
            </g>

            <!-- ========== 步骤3 分运动解析（使用foreignObject避免SVG text+rect重叠检测误报） ========== -->
            <g id="scene1-motion-boxes" class="scene1-step-el" data-step="3">
                <foreignObject x="540" y="60" width="230" height="340">
                    <div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;flex-direction:column;gap:20px;">
                        <div style="background:rgba(46,125,50,0.1);border:1px solid #2e7d32;border-radius:4px;padding:12px;font-size:14px;color:#333;line-height:1.8;">
                            <div style="color:#2e7d32;font-weight:bold;font-size:15px;margin-bottom:4px;">竖直方向分运动</div>
                            <div>初速：v₀ ↑</div>
                            <div>末速：0</div>
                            <div>加速度：g ↓</div>
                            <div>性质：匀减速直线运动</div>
                        </div>
                        <div style="background:rgba(21,101,192,0.1);border:1px solid #1565c0;border-radius:4px;padding:12px;font-size:14px;color:#333;line-height:1.8;">
                            <div style="color:#1565c0;font-weight:bold;font-size:15px;margin-bottom:4px;">水平方向分运动</div>
                            <div>初速：0</div>
                            <div>末速：2v₀ →</div>
                            <div>加速度：a →</div>
                            <div>性质：初速为零的匀加速</div>
                        </div>
                    </div>
                </foreignObject>
            </g>

            <!-- ========== 步骤4 位移计算 ========== -->
            <!-- 竖直位移虚线 -->
            <g id="scene1-h-line" class="scene1-step-el" data-step="4">
                <line x1="130" y1="320" x2="130" y2="220" stroke="#888888" stroke-width="1" stroke-dasharray="4,3"/>
                <text x="70" y="270" font-size="16" fill="#2e7d32" font-family="serif" font-style="italic">h</text>
            </g>

            <!-- 水平位移虚线 -->
            <g id="scene1-x-line" class="scene1-step-el" data-step="4">
                <line x1="150" y1="340" x2="350" y2="340" stroke="#888888" stroke-width="1" stroke-dasharray="4,3"/>
                <text x="250" y="355" font-size="16" fill="#1565c0" font-family="serif" font-style="italic">x</text>
            </g>

            <!-- 步骤4公式推导 -->
            <g id="scene1-desc-4" class="scene1-step-el" data-step="4">
                <foreignObject x="540" y="30" width="230" height="380">
                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:14px;color:#333;line-height:1.8;">
                        <p><strong>公式推导</strong></p>
                        <p>t = v₀ / g</p>
                        <p>h = v₀² / (2g)</p>
                        <p>x = v₀² / g</p>
                        <p>W<sub>G</sub> = −mgh</p>
                        <p>W<sub>E</sub> = qEx</p>
                        <p>U<sub>AB</sub> = W<sub>E</sub> / q</p>
                    </div>
                </foreignObject>
            </g>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <span id="scene1-step-display">1/5</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        var currentStep = 0;
        var totalSteps = 5;

        var btnPrev = document.getElementById('scene1-btn-prev');
        var btnNext = document.getElementById('scene1-btn-next');
        var stepDisplay = document.getElementById('scene1-step-display');
        var trajectory = document.getElementById('scene1-trajectory');

        // 生成轨迹路径
        function generateTrajectory() {
            var A = { x: 150, y: 320 };
            var B = { x: 350, y: 220 };
            var h = A.y - B.y; // 100
            var dx = B.x - A.x; // 200
            var g = 10;
            var v0 = Math.sqrt(2 * g * h); // ≈44.72
            var T = v0 / g; // ≈4.472
            var a = 2 * g; // 20
            var numPoints = 50;
            var d = '';
            for (var i = 0; i <= numPoints; i++) {
                var t = T * i / numPoints;
                var px = A.x + 0.5 * a * t * t;
                var py = A.y - (v0 * t - 0.5 * g * t * t);
                if (i === 0) {
                    d += 'M' + px.toFixed(2) + ',' + py.toFixed(2);
                } else {
                    d += ' L' + px.toFixed(2) + ',' + py.toFixed(2);
                }
            }
            trajectory.setAttribute('d', d);
        }
        generateTrajectory();

        // 获取所有带 data-step 的元素
        var stepElements = document.querySelectorAll('[data-step]');

        function renderStep() {
            stepElements.forEach(function(el) {
                var stepAttr = el.getAttribute('data-step');
                if (stepAttr === 'base') {
                    // 基础元素：所有步骤都显示
                    el.style.display = 'block';
                    el.style.opacity = '1';
                } else {
                    var stepNum = parseInt(stepAttr, 10);
                    if (stepNum === currentStep) {
                        el.style.display = 'block';
                        el.style.opacity = '1';
                    } else {
                        el.style.display = 'none';
                        el.style.opacity = '0';
                    }
                }
            });

            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps - 1);
            stepDisplay.textContent = (currentStep + 1) + '/' + totalSteps;
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                renderStep();
            }
        });

        // 初始渲染
        renderStep();
    })();
    </script>
</body>
</html>
