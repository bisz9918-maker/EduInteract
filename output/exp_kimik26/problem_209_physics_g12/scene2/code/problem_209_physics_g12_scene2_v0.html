<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>斜面物块受力分析 - 场景2</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene2-controls button {
            padding: 6px 16px; font-size: 14px; cursor: pointer;
            border: 1px solid #ccc; border-radius: 4px; background: #f0f0f0;
            min-width: 80px; height: 32px;
        }
        #scene2-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene2-step-indicator { font-size: 14px; color: #555; min-width: 70px; text-align: center; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500">
            <defs>
                <!-- 箭头标记定义 -->
                <marker id="scene2-arrow-black" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#000000"/>
                </marker>
                <marker id="scene2-arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#c62828"/>
                </marker>
                <marker id="scene2-arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#1565c0"/>
                </marker>
            </defs>

            <!-- 斜面三角形 -->
            <polygon id="scene2-slope" points="80,380 340,380 340,230" fill="#8d6e63" opacity="0.1" stroke="#000000" stroke-width="2"/>

            <!-- 水平地面 -->
            <line id="scene2-ground" x1="60" y1="380" x2="360" y2="380" stroke="#000000" stroke-width="2"/>

            <!-- 物块 -->
            <polygon id="scene2-block" points="170,314 204,294 217,316 182,336" fill="#eeeeee" opacity="0.3" stroke="#000000" stroke-width="2"/>

            <!-- 角度弧线 -->
            <path id="scene2-angle-arc" d="M 105,380 A 25,25 0 0,0 101.7,367.5" fill="none" stroke="#000000" stroke-width="1.5"/>

            <!-- 重力mg箭头 -->
            <line id="scene2-force-mg" x1="193" y1="315" x2="193" y2="385" stroke="#000000" stroke-width="2" marker-end="url(#scene2-arrow-black)" opacity="0"/>

            <!-- 支持力N箭头 -->
            <line id="scene2-force-n" x1="193" y1="315" x2="218" y2="358" stroke="#1565c0" stroke-width="2" marker-end="url(#scene2-arrow-blue)" opacity="0"/>

            <!-- 上滑摩擦力f箭头（沿斜面向下） -->
            <line id="scene2-force-f-up" x1="193" y1="315" x2="158" y2="335" stroke="#c62828" stroke-width="2" marker-end="url(#scene2-arrow-red)" opacity="0"/>

            <!-- 下滑摩擦力f箭头（沿斜面向上） -->
            <line id="scene2-force-f-down" x1="193" y1="315" x2="228" y2="295" stroke="#1565c0" stroke-width="2" marker-end="url(#scene2-arrow-blue)" opacity="0"/>

            <!-- 重力分解-沿斜面分量 -->
            <line id="scene2-decomp-parallel" x1="193" y1="315" x2="163" y2="333" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" opacity="0"/>

            <!-- 重力分解-垂直斜面分量 -->
            <line id="scene2-decomp-perp" x1="193" y1="315" x2="223" y2="368" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" opacity="0"/>

            <!-- 分解辅助虚线1: 重力终点到沿斜面分量终点 -->
            <line id="scene2-aux-line1" x1="193" y1="385" x2="163" y2="333" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" opacity="0"/>

            <!-- 分解辅助虚线2: 重力终点到垂直分量终点 -->
            <line id="scene2-aux-line2" x1="193" y1="385" x2="223" y2="368" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" opacity="0"/>

            <!-- 标签 -->
            <text id="scene2-label-theta" x="70" y="365" font-size="16" fill="#000000" font-family="serif">θ</text>
            <text id="scene2-label-m" x="188" y="220" font-size="16" fill="#000000">m</text>
            <text id="scene2-label-mg" x="200" y="405" font-size="16" fill="#000000" opacity="0">mg</text>
            <text id="scene2-label-n" x="230" y="220" font-size="16" fill="#1565c0" opacity="0">N</text>
            <text id="scene2-label-f-up" x="60" y="295" font-size="16" fill="#c62828" opacity="0">f</text>
            <text id="scene2-label-f-down" x="350" y="255" font-size="16" fill="#1565c0" opacity="0">f</text>
            <text id="scene2-label-mg-sin" x="55" y="225" font-size="12" fill="#000000" opacity="0">mg sinθ</text>
            <text id="scene2-label-mg-cos" x="350" y="405" font-size="12" fill="#000000" opacity="0">mg cosθ</text>

            <!-- 公式区文本 - 步骤0: 已知条件 -->
            <g id="scene2-formulas-step0" opacity="1">
                <text x="520" y="68" font-size="18" font-weight="bold" fill="#000000">已知条件</text>
                <text x="520" y="115" font-size="16" fill="#000000">斜面倾角：θ</text>
                <text x="520" y="157" font-size="16" fill="#000000">初速度：v₀</text>
                <text x="520" y="199" font-size="16" fill="#000000">上滑时间 t₁，下滑时间 2t₁</text>
                <text x="520" y="241" font-size="16" fill="#000000">末速度大小 v₁</text>
            </g>

            <!-- 公式区文本 - 步骤1: 上滑阶段受力分析 -->
            <g id="scene2-formulas-step1" opacity="0">
                <text x="520" y="68" font-size="18" font-weight="bold" fill="#c62828">上滑阶段受力分析</text>
                <text x="520" y="115" font-size="16" fill="#c62828">mg sinθ + μmg cosθ = ma₁</text>
                <text x="520" y="157" font-size="16" fill="#c62828">…(1)</text>
            </g>

            <!-- 公式区文本 - 步骤2: 下滑阶段受力分析 -->
            <g id="scene2-formulas-step2" opacity="0">
                <text x="520" y="68" font-size="18" font-weight="bold" fill="#1565c0">下滑阶段受力分析</text>
                <text x="520" y="115" font-size="16" fill="#1565c0">mg sinθ − μmg cosθ = ma₂</text>
                <text x="520" y="157" font-size="16" fill="#1565c0">…(2)</text>
            </g>

            <!-- 公式区文本 - 步骤3: 联立推导 -->
            <g id="scene2-formulas-step3" opacity="0">
                <text x="520" y="68" font-size="18" font-weight="bold" fill="#2e7d32">联立推导</text>
                <text x="520" y="115" font-size="16" fill="#000000">(1): mg sinθ + μmg cosθ = ma₁</text>
                <text x="520" y="157" font-size="16" fill="#000000">(2): mg sinθ − μmg cosθ = ma₂</text>
                <text x="520" y="199" font-size="16" fill="#2e7d32" font-weight="bold">(1) − (2):</text>
                <text x="520" y="241" font-size="16" fill="#000000">2μmg cosθ = m(a₁ − a₂)</text>
                <text x="520" y="283" font-size="16" fill="#000000">μ = (a₁ − a₂) / (2g cosθ)</text>
                <text x="520" y="325" font-size="14" fill="#888888">其中 a₁ = v₀/t₁ , a₂ = v₁/(2t₁)</text>
                <text x="520" y="367" font-size="16" fill="#000000">μ = [v₀/t₁ − v₁/(2t₁)] / (2g cosθ)</text>
                <text x="520" y="409" font-size="16" fill="#2e7d32" font-weight="bold">μ = (2v₀ − v₁) / (4g t₁ cosθ)</text>
            </g>
        </svg>

        <div id="scene2-controls">
            <button id="scene2-btn-prev" disabled>◀ 上一步</button>
            <span id="scene2-step-indicator">步骤 1/4</span>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2 实现 - 斜面物块受力分析与动摩擦因数推导

        // 状态变量
        let currentStep = 0; // 0,1,2,3
        const totalSteps = 4;

        // DOM 元素引用
        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        const stepIndicator = document.getElementById('scene2-step-indicator');

        // 受力矢量元素
        const forceMg = document.getElementById('scene2-force-mg');
        const forceN = document.getElementById('scene2-force-n');
        const forceFUp = document.getElementById('scene2-force-f-up');
        const forceFDown = document.getElementById('scene2-force-f-down');

        // 分解虚线元素
        const decompParallel = document.getElementById('scene2-decomp-parallel');
        const decompPerp = document.getElementById('scene2-decomp-perp');
        const auxLine1 = document.getElementById('scene2-aux-line1');
        const auxLine2 = document.getElementById('scene2-aux-line2');

        // 标签元素
        const labelMg = document.getElementById('scene2-label-mg');
        const labelN = document.getElementById('scene2-label-n');
        const labelFUp = document.getElementById('scene2-label-f-up');
        const labelFDown = document.getElementById('scene2-label-f-down');
        const labelMgSin = document.getElementById('scene2-label-mg-sin');
        const labelMgCos = document.getElementById('scene2-label-mg-cos');

        // 公式区元素
        const formulasStep0 = document.getElementById('scene2-formulas-step0');
        const formulasStep1 = document.getElementById('scene2-formulas-step1');
        const formulasStep2 = document.getElementById('scene2-formulas-step2');
        const formulasStep3 = document.getElementById('scene2-formulas-step3');

        // 辅助函数：显示/隐藏元素
        function show(el) {
            if (!el) return;
            el.style.opacity = '1';
            el.style.display = '';
        }
        function hide(el) {
            if (!el) return;
            el.style.opacity = '0';
            el.style.display = 'none';
        }

        // 渲染函数：根据 currentStep 更新所有元素的显示状态
        function render() {
            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps - 1);
            stepIndicator.textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;

            // 步骤0: 已知条件 - 只显示斜面、物块、角度、已知条件公式
            if (currentStep === 0) {
                hide(forceMg); hide(forceN); hide(forceFUp); hide(forceFDown);
                hide(decompParallel); hide(decompPerp); hide(auxLine1); hide(auxLine2);
                hide(labelMg); hide(labelN); hide(labelFUp); hide(labelFDown);
                hide(labelMgSin); hide(labelMgCos);
                show(formulasStep0); hide(formulasStep1); hide(formulasStep2); hide(formulasStep3);
            }
            // 步骤1: 上滑受力分析
            else if (currentStep === 1) {
                show(forceMg); show(forceN); show(forceFUp); hide(forceFDown);
                show(decompParallel); show(decompPerp); show(auxLine1); show(auxLine2);
                show(labelMg); show(labelN); show(labelFUp); hide(labelFDown);
                show(labelMgSin); show(labelMgCos);
                hide(formulasStep0); show(formulasStep1); hide(formulasStep2); hide(formulasStep3);
            }
            // 步骤2: 下滑受力分析
            else if (currentStep === 2) {
                show(forceMg); show(forceN); hide(forceFUp); show(forceFDown);
                show(decompParallel); show(decompPerp); show(auxLine1); show(auxLine2);
                show(labelMg); show(labelN); hide(labelFUp); show(labelFDown);
                show(labelMgSin); show(labelMgCos);
                hide(formulasStep0); hide(formulasStep1); show(formulasStep2); hide(formulasStep3);
            }
            // 步骤3: 联立推导
            else if (currentStep === 3) {
                show(forceMg); show(forceN); hide(forceFUp); show(forceFDown);
                // 步骤3淡化分解虚线，仅保留mg、N、f以不分散注意力
                hide(decompParallel); hide(decompPerp); hide(auxLine1); hide(auxLine2);
                show(labelMg); show(labelN); hide(labelFUp); show(labelFDown);
                hide(labelMgSin); hide(labelMgCos);
                hide(formulasStep0); hide(formulasStep1); hide(formulasStep2); show(formulasStep3);
            }
        }

        // 事件绑定
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                render();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                render();
            }
        });

        // 初始渲染
        render();
    })();
    </script>
</body>
</html>
