<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scene 1</title>
<style>
body{margin:0;padding:0;background:#fff;font-family:"Microsoft YaHei",sans-serif}
#scene1-container{position:relative;width:800px;height:500px;background:#fff;margin:0 auto;overflow:hidden}
#scene1-controls{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:12px;z-index:10}
.scene1-btn{padding:6px 16px;font-size:14px;border:1px solid #333;background:#fff;cursor:pointer;border-radius:4px;transition:all .2s}
.scene1-btn.active-btn{border:2px solid #2e7d32;color:#2e7d32;font-weight:bold}
.scene1-btn:hover{background:#f5f5f5}
</style>
</head>
<body>
<div id="scene1-container">
<svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
<line id="b1" x1="260" y1="220" x2="540" y2="220" stroke="#000" stroke-width="2"/>
<line id="b2" x1="260" y1="220" x2="250" y2="400" stroke="#000" stroke-width="2"/>
<line id="b3" x1="540" y1="220" x2="550" y2="400" stroke="#000" stroke-width="2"/>
<line id="b4" x1="250" y1="400" x2="550" y2="400" stroke="#000" stroke-width="2"/>
<line id="ll" x1="270" y1="250" x2="530" y2="250" stroke="#888" stroke-width="1.5" stroke-dasharray="5,5"/>
<rect id="cr" x="322" y="140" width="16" height="220" fill="#424242" stroke="#000" stroke-width="1.5"/>
<rect id="fr" x="462" y="140" width="16" height="220" fill="#bdbdbd" stroke="#000" stroke-width="1.5"/>
<line id="wm" x1="330" y1="140" x2="470" y2="140" stroke="#888" stroke-width="2"/>
<line id="k1g" x1="390" y1="140" x2="410" y2="140" stroke="#fff" stroke-width="3"/>
<line id="sk1" x1="390" y1="140" x2="405" y2="125" stroke="#888" stroke-width="2"/>
<line id="wlv" x1="360" y1="140" x2="360" y2="80" stroke="#888" stroke-width="2"/>
<line id="wlh" x1="360" y1="80" x2="500" y2="80" stroke="#888" stroke-width="2"/>
<line id="wrv" x1="440" y1="140" x2="440" y2="80" stroke="#888" stroke-width="2"/>
<line id="wrh" x1="440" y1="80" x2="620" y2="80" stroke="#888" stroke-width="2"/>
<line id="k2g" x1="490" y1="80" x2="510" y2="80" stroke="#fff" stroke-width="3"/>
<line id="sk2" x1="490" y1="80" x2="505" y2="65" stroke="#888" stroke-width="2"/>
<line id="bwl" x1="540" y1="80" x2="560" y2="80" stroke="#888" stroke-width="2"/>
<line id="bwr" x1="600" y1="80" x2="620" y2="80" stroke="#888" stroke-width="2"/>
<line id="bn" x1="560" y1="70" x2="560" y2="90" stroke="#888" stroke-width="2.5"/>
<line id="bp" x1="600" y1="65" x2="600" y2="95" stroke="#888" stroke-width="2.5"/>
<text id="lc" x="305" y="250" text-anchor="end" font-size="16" fill="#000">C</text>
<text id="lfe" x="495" y="250" text-anchor="start" font-size="16" fill="#000">Fe</text>
<text id="ls" x="400" y="420" text-anchor="middle" font-size="14" fill="#000">饱和NaCl溶液</text>
<text id="lk1" x="400" y="118" text-anchor="middle" font-size="14" fill="#000">K₁</text>
<text id="lk2" x="500" y="58" text-anchor="middle" font-size="14" fill="#000">K₂</text>
<text id="lpw" x="580" y="48" text-anchor="middle" font-size="14" fill="#000">电源</text>
<text id="ln" x="555" y="110" text-anchor="middle" font-size="16" fill="#1565c0" opacity="0">−</text>
<text id="lp" x="640" y="110" text-anchor="middle" font-size="16" fill="#c62828" opacity="0">＋</text>
<g id="gb" opacity="0" style="display:none">
<line id="am" x1="430" y1="155" x2="370" y2="155" stroke="#c62828" stroke-width="2" marker-end="url(#ah)"/>
<text id="lem" x="440" y="160" font-size="14" fill="#c62828">e⁻</text>
<text id="lno" x="500" y="200" text-anchor="start" font-size="14" fill="#c62828">负极（氧化）</text>
<text id="lpr" x="300" y="200" text-anchor="end" font-size="14" fill="#1565c0">正极（还原）</text>
</g>
<g id="ge" opacity="0" style="display:none">
<line id="al" x1="480" y1="95" x2="380" y2="95" stroke="#c62828" stroke-width="2" marker-end="url(#ah)"/>
<text id="lel" x="490" y="100" font-size="14" fill="#c62828">e⁻</text>
<line id="ar" x1="460" y1="95" x2="580" y2="95" stroke="#c62828" stroke-width="2" marker-end="url(#ah)"/>
<text id="ler" x="590" y="100" font-size="14" fill="#c62828">e⁻</text>
<text id="lao" x="500" y="200" text-anchor="start" font-size="14" fill="#c62828">阳极（氧化）</text>
<text id="lcr" x="300" y="200" text-anchor="end" font-size="14" fill="#1565c0">阴极（还原）</text>
</g>
<defs><marker id="ah" markerWidth="10" markerHeight="7" refX="2" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#c62828"/></marker></defs>
</svg>
<div id="scene1-controls">
<button id="btn0" class="scene1-btn active-btn">基础装置</button>
<button id="btn1" class="scene1-btn">原电池(K₁闭)</button>
<button id="btn2" class="scene1-btn">电解池(K₂闭)</button>
</div>
</div>
<script>
(function(){
var st=0;
var b0=document.getElementById('btn0'),b1=document.getElementById('btn1'),b2=document.getElementById('btn2');
var wm=document.getElementById('wm'),wlv=document.getElementById('wlv'),wlh=document.getElementById('wlh'),wrv=document.getElementById('wrv'),wrh=document.getElementById('wrh');
var bwl=document.getElementById('bwl'),bwr=document.getElementById('bwr'),bn=document.getElementById('bn'),bp=document.getElementById('bp');
var sk1=document.getElementById('sk1'),sk2=document.getElementById('sk2');
var ln=document.getElementById('ln'),lp=document.getElementById('lp');
var gb=document.getElementById('gb'),ge=document.getElementById('ge');
function rs(){
b0.classList.remove('active-btn');b1.classList.remove('active-btn');b2.classList.remove('active-btn');
wm.setAttribute('stroke','#888');wlv.setAttribute('stroke','#888');wlh.setAttribute('stroke','#888');wrv.setAttribute('stroke','#888');wrh.setAttribute('stroke','#888');
bwl.setAttribute('stroke','#888');bwr.setAttribute('stroke','#888');bn.setAttribute('stroke','#888');bp.setAttribute('stroke','#888');
sk1.setAttribute('x2','405');sk1.setAttribute('y2','125');sk1.setAttribute('stroke','#888');
sk2.setAttribute('x2','505');sk2.setAttribute('y2','65');sk2.setAttribute('stroke','#888');
gb.setAttribute('opacity','0');gb.style.display='none';
ge.setAttribute('opacity','0');ge.style.display='none';
ln.setAttribute('opacity','0');lp.setAttribute('opacity','0');
if(st===0){b0.classList.add('active-btn');}
else if(st===1){b1.classList.add('active-btn');sk1.setAttribute('x2','410');sk1.setAttribute('y2','140');sk1.setAttribute('stroke','#000');wm.setAttribute('stroke','#000');gb.style.display='block';gb.setAttribute('opacity','1');}
else if(st===2){b2.classList.add('active-btn');sk2.setAttribute('x2','510');sk2.setAttribute('y2','80');sk2.setAttribute('stroke','#000');wlv.setAttribute('stroke','#000');wlh.setAttribute('stroke','#000');wrv.setAttribute('stroke','#000');wrh.setAttribute('stroke','#000');bwl.setAttribute('stroke','#000');bwr.setAttribute('stroke','#000');bn.setAttribute('stroke','#000');bp.setAttribute('stroke','#000');ln.setAttribute('opacity','1');lp.setAttribute('opacity','1');ge.style.display='block';ge.setAttribute('opacity','1');}
}
function ss(s){st=s;rs();}
b0.addEventListener('click',function(){ss(0);});
b1.addEventListener('click',function(){ss(1);});
b2.addEventListener('click',function(){ss(2);});
rs();
})();
</script>
</body>
</html>
