<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>垂直平分线性质与∠EAF角度推导</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 16px; z-index: 10; }
        #scene1-controls button {
            padding: 6px 16px; font-size: 14px; cursor: pointer;
            background: #f5f5f5; border: 1px solid #cccccc; border-radius: 4px;
            transition: background 0.2s;
        }
        #scene1-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene1-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 14px; color: #333; min-width: 70px; text-align: center; }

        /* 动态元素过渡 */
        .scene1-dynamic { transition: opacity 0.3s ease, stroke 0.3s ease, stroke-width 0.3s ease, fill-opacity 0.3s ease; }
        .scene1-hidden { opacity: 0; pointer-events: none; }
        .scene1-visible { opacity: 1; }

        /* 高亮样式 */
        .scene1-highlight-blue { stroke: #1565c0 !important; stroke-width: 2.5px !important; }
        .scene1-highlight-red { stroke: #c62828 !important; }
        .scene1-fill-red { fill: #c62828; fill-opacity: 0.2; }
        .scene1-fill-blue { fill: #1565c0; fill-opacity: 0.2; }
        .scene1-fill-blue-dim { fill: #1565c0; fill-opacity: 0.1; }
        .scene1-arc-green { stroke: #2e7d32; }
        .scene1-arc-red { stroke: #c62828; }
        .scene1-arc-blue { stroke: #1565c0; }
        .scene1-text-red { fill: #c62828; font-weight: bold; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" viewBox="0 0 800 500">
            <!-- 定义 -->
            <defs>
                <marker id="scene1-dot" markerWidth="6" markerHeight="6" refX="3" refY="3">
                    <circle cx="3" cy="3" r="3" fill="#000"/>
                </marker>
            </defs>

            <!-- 背景填充区域（动态） -->
            <!-- △EAB 填充 -->
            <path id="scene1-fill-eab" class="scene1-dynamic scene1-hidden scene1-fill-red" d="M 400 170 L 476 380 L 700 380 Z" />
            <!-- △FAC 填充 -->
            <path id="scene1-fill-fac" class="scene1-dynamic scene1-hidden scene1-fill-red" d="M 400 170 L 324 380 L 100 380 Z" />
            <!-- △ABC 填充 -->
            <path id="scene1-fill-abc" class="scene1-dynamic scene1-hidden scene1-fill-blue" d="M 400 170 L 700 380 L 100 380 Z" />
            <!-- ∠EAF 扇形填充 -->
            <path id="scene1-fill-eaf-sector" class="scene1-dynamic scene1-hidden scene1-fill-red" d="M 400 170 L 400 220 A 50 50 0 0 1 400 220 Z" />

            <!-- 主三角形和线段 -->
            <!-- BC 底边 -->
            <line id="scene1-line-bc" x1="100" y1="380" x2="700" y2="380" stroke="#000" stroke-width="2" />
            <!-- AB -->
            <line id="scene1-line-ab" x1="400" y1="170" x2="700" y2="380" stroke="#000" stroke-width="2" />
            <!-- AC -->
            <line id="scene1-line-ac" x1="100" y1="380" x2="400" y2="170" stroke="#000" stroke-width="2" />
            <!-- AE -->
            <line id="scene1-line-ae" x1="400" y1="170" x2="476" y2="380" stroke="#000" stroke-width="2" />
            <!-- AF -->
            <line id="scene1-line-af" x1="400" y1="170" x2="324" y2="380" stroke="#000" stroke-width="2" />

            <!-- 垂直平分线 -->
            <line id="scene1-perp-ge" class="scene1-dynamic" x1="550" y1="275" x2="476" y2="380" stroke="#000" stroke-width="2" />
            <line id="scene1-perp-hf" class="scene1-dynamic" x1="250" y1="275" x2="324" y2="380" stroke="#000" stroke-width="2" />

            <!-- 直角标记 -->
            <!-- G 处直角标记 -->
            <path id="scene1-right-g" class="scene1-dynamic scene1-hidden" d="M 541.8 269.3 L 550 275 L 544.2 283.2 M 541.8 269.3 L 536.0 277.5 L 544.2 283.2" stroke="#000" stroke-width="1.5" fill="none" />
            <!-- H 处直角标记 -->
            <path id="scene1-right-h" class="scene1-dynamic scene1-hidden" d="M 258.2 269.3 L 250 275 L 255.8 283.2 M 258.2 269.3 L 264.0 277.5 L 255.8 283.2" stroke="#000" stroke-width="1.5" fill="none" />

            <!-- 等长标记 -->
            <!-- EA 等长标记 -->
            <line id="scene1-tick-ea" class="scene1-dynamic scene1-hidden" x1="434.2" y1="276.4" x2="441.8" y2="273.6" stroke="#c62828" stroke-width="2" />
            <!-- EB 等长标记 -->
            <line id="scene1-tick-eb" class="scene1-dynamic scene1-hidden" x1="588" y1="376" x2="588" y2="384" stroke="#c62828" stroke-width="2" />
            <!-- FA 等长标记 -->
            <line id="scene1-tick-fa" class="scene1-dynamic scene1-hidden" x1="358.2" y1="273.6" x2="365.8" y2="276.4" stroke="#c62828" stroke-width="2" />
            <!-- FC 等长标记 -->
            <line id="scene1-tick-fc" class="scene1-dynamic scene1-hidden" x1="212" y1="376" x2="212" y2="384" stroke="#c62828" stroke-width="2" />

            <!-- 角弧 -->
            <!-- ∠BAC 弧 (110°) -->
            <path id="scene1-arc-bac" class="scene1-dynamic scene1-hidden scene1-arc-blue" d="M 367.2 193.0 A 40 40 0 0 1 432.8 193.0" stroke-width="2" fill="none" />
            <!-- ∠EAB 弧 (35°) -->
            <path id="scene1-arc-eab" class="scene1-dynamic scene1-hidden scene1-arc-green" d="M 390.4 196.3 A 28 28 0 0 1 422.9 186.1" stroke-width="2" fill="none" />
            <!-- ∠FAC 弧 (35°) -->
            <path id="scene1-arc-fac" class="scene1-dynamic scene1-hidden scene1-arc-green" d="M 377.1 186.1 A 28 28 0 0 1 409.6 196.3" stroke-width="2" fill="none" />
            <!-- ∠EAF 弧 (40°) -->
            <path id="scene1-arc-eaf" class="scene1-dynamic scene1-hidden scene1-arc-red" d="M 382.9 202.9 A 35 35 0 0 1 417.1 202.9" stroke-width="2" fill="none" />
            <!-- ∠B 弧 (35°) -->
            <path id="scene1-arc-b" class="scene1-dynamic scene1-hidden scene1-arc-green" d="M 678.0 373.5 A 22 22 0 0 1 700 358" stroke-width="2" fill="none" />
            <!-- ∠C 弧 (35°) -->
            <path id="scene1-arc-c" class="scene1-dynamic scene1-hidden scene1-arc-green" d="M 100 358 A 22 22 0 0 1 122.0 373.5" stroke-width="2" fill="none" />

            <!-- 顶点圆点 -->
            <circle cx="400" cy="170" r="3" fill="#000" />
            <circle cx="700" cy="380" r="3" fill="#000" />
            <circle cx="100" cy="380" r="3" fill="#000" />
            <circle cx="476" cy="380" r="3" fill="#000" />
            <circle cx="324" cy="380" r="3" fill="#000" />
            <circle cx="550" cy="275" r="3" fill="#000" />
            <circle cx="250" cy="275" r="3" fill="#000" />

            <!-- 标签 -->
            <text id="scene1-label-a" x="400" y="135" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">A</text>
            <text id="scene1-label-b" x="730" y="375" text-anchor="start" font-size="16" font-weight="bold" fill="#000">B</text>
            <text id="scene1-label-c" x="70" y="375" text-anchor="end" font-size="16" font-weight="bold" fill="#000">C</text>
            <text id="scene1-label-e" x="530" y="395" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">E</text>
            <text id="scene1-label-f" x="270" y="395" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">F</text>
            <text id="scene1-label-g" x="550" y="163" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">G</text>
            <text id="scene1-label-h" x="250" y="163" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">H</text>

            <!-- 角度标注 -->
            <text id="scene1-text-110" class="scene1-dynamic scene1-hidden" x="490" y="160" text-anchor="start" font-size="14" fill="#1565c0" font-weight="bold">110°</text>
            <text id="scene1-text-40" class="scene1-dynamic scene1-hidden" x="440" y="150" text-anchor="start" font-size="14" fill="#c62828" font-weight="bold">40°</text>
            <text id="scene1-text-35b" class="scene1-dynamic scene1-hidden" x="730" y="320" text-anchor="end" font-size="14" fill="#2e7d32" font-weight="bold">35°</text>
            <text id="scene1-text-35c" class="scene1-dynamic scene1-hidden" x="70" y="320" text-anchor="start" font-size="14" fill="#2e7d32" font-weight="bold">35°</text>

            <!-- 推导公式 -->
            <text id="scene1-text-formula" x="400" y="415" text-anchor="middle" font-size="14" fill="#000"></text>

            <!-- 选项区 -->
            <text id="scene1-text-options" class="scene1-dynamic scene1-hidden" x="400" y="440" text-anchor="middle" font-size="13" fill="#000">
                <tspan>A. 35°</tspan>
                <tspan dx="20">B. 40°</tspan>
                <tspan dx="20">C. 45°</tspan>
                <tspan dx="20">D. 50°</tspan>
            </text>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 0/4</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        let currentStep = 0;
        const totalSteps = 4;

        // 元素引用
        const els = {
            perpGE: document.getElementById('scene1-perp-ge'),
            perpHF: document.getElementById('scene1-perp-hf'),
            rightG: document.getElementById('scene1-right-g'),
            rightH: document.getElementById('scene1-right-h'),
            tickEA: document.getElementById('scene1-tick-ea'),
            tickEB: document.getElementById('scene1-tick-eb'),
            tickFA: document.getElementById('scene1-tick-fa'),
            tickFC: document.getElementById('scene1-tick-fc'),
            fillEAB: document.getElementById('scene1-fill-eab'),
            fillFAC: document.getElementById('scene1-fill-fac'),
            fillABC: document.getElementById('scene1-fill-abc'),
            fillEAFSector: document.getElementById('scene1-fill-eaf-sector'),
            arcBAC: document.getElementById('scene1-arc-bac'),
            arcEAB: document.getElementById('scene1-arc-eab'),
            arcFAC: document.getElementById('scene1-arc-fac'),
            arcEAF: document.getElementById('scene1-arc-eaf'),
            arcB: document.getElementById('scene1-arc-b'),
            arcC: document.getElementById('scene1-arc-c'),
            text110: document.getElementById('scene1-text-110'),
            text40: document.getElementById('scene1-text-40'),
            text35B: document.getElementById('scene1-text-35b'),
            text35C: document.getElementById('scene1-text-35c'),
            formula: document.getElementById('scene1-text-formula'),
            options: document.getElementById('scene1-text-options'),
            btnPrev: document.getElementById('scene1-btn-prev'),
            btnNext: document.getElementById('scene1-btn-next'),
            indicator: document.getElementById('scene1-step-indicator')
        };

        // 修正 ∠EAF 扇形路径
        // 圆心 A(400,170), R=50, 从 AF 方向(110°) 到 AE 方向(70°), 顺时针
        const cx = 400, cy = 170, r = 50;
        const startAngle = 110 * Math.PI / 180;
        const endAngle = 70 * Math.PI / 180;
        const x1 = cx + r * Math.cos(startAngle);
        const y1 = cy + r * Math.sin(startAngle);
        const x2 = cx + r * Math.cos(endAngle);
        const y2 = cy + r * Math.sin(endAngle);
        els.fillEAFSector.setAttribute('d', `M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 0 1 ${x2} ${y2} Z`);

        function show(el) {
            if (!el) return;
            el.classList.remove('scene1-hidden');
            el.classList.add('scene1-visible');
        }
        function hide(el) {
            if (!el) return;
            el.classList.remove('scene1-visible');
            el.classList.add('scene1-hidden');
        }
        function setText(el, text) {
            if (el) el.textContent = text;
        }
        function addClass(el, cls) {
            if (el) el.classList.add(cls);
        }
        function removeClass(el, cls) {
            if (el) el.classList.remove(cls);
        }

        function resetDynamic() {
            // 隐藏所有动态元素
            hide(els.rightG); hide(els.rightH);
            hide(els.tickEA); hide(els.tickEB); hide(els.tickFA); hide(els.tickFC);
            hide(els.fillEAB); hide(els.fillFAC); hide(els.fillABC); hide(els.fillEAFSector);
            hide(els.arcBAC); hide(els.arcEAB); hide(els.arcFAC); hide(els.arcEAF);
            hide(els.arcB); hide(els.arcC);
            hide(els.text110); hide(els.text40); hide(els.text35B); hide(els.text35C);
            hide(els.options);

            // 重置高亮
            removeClass(els.perpGE, 'scene1-highlight-blue');
            removeClass(els.perpHF, 'scene1-highlight-blue');
            removeClass(els.fillABC, 'scene1-fill-blue-dim');
            addClass(els.fillABC, 'scene1-fill-blue');

            // 重置选项高亮
            const opts = els.options.querySelectorAll('tspan');
            opts.forEach(t => { t.style.fill = ''; t.style.fontWeight = ''; });
        }

        function applyStep(step) {
            resetDynamic();
            currentStep = step;
            els.indicator.textContent = `步骤 ${step}/${totalSteps}`;
            els.btnPrev.disabled = (step === 0);
            els.btnNext.disabled = (step === totalSteps);

            switch(step) {
                case 0:
                    setText(els.formula, '');
                    break;
                case 1:
                    addClass(els.perpGE, 'scene1-highlight-blue');
                    show(els.rightG);
                    show(els.tickEA); show(els.tickEB);
                    show(els.fillEAB);
                    show(els.arcEAB); show(els.arcB);
                    show(els.text35B);
                    setText(els.formula, '(1) EA = EB ⇒ ∠EAB = ∠B');
                    break;
                case 2:
                    addClass(els.perpHF, 'scene1-highlight-blue');
                    show(els.rightH);
                    show(els.tickFA); show(els.tickFC);
                    show(els.fillFAC);
                    show(els.arcFAC); show(els.arcC);
                    show(els.text35C);
                    setText(els.formula, '(2) FA = FC ⇒ ∠FAC = ∠C');
                    break;
                case 3:
                    show(els.fillABC);
                    show(els.arcBAC);
                    show(els.arcEAB); show(els.arcFAC);
                    show(els.arcB); show(els.arcC);
                    show(els.text110); show(els.text35B); show(els.text35C);
                    setText(els.formula, '(3) ∠B + ∠C = 180° − 110° = 70°');
                    break;
                case 4:
                    removeClass(els.fillABC, 'scene1-fill-blue');
                    addClass(els.fillABC, 'scene1-fill-blue-dim');
                    show(els.fillABC);
                    show(els.fillEAFSector);
                    show(els.arcEAF); show(els.arcBAC);
                    show(els.text40); show(els.text110);
                    setText(els.formula, '(4) ∠EAF = 110° − 70° = 40°');
                    show(els.options);
                    // 高亮选项 B
                    const opts = els.options.querySelectorAll('tspan');
                    if (opts[1]) { opts[1].style.fill = '#c62828'; opts[1].style.fontWeight = 'bold'; }
                    break;
            }
        }

        els.btnPrev.addEventListener('click', () => { if (currentStep > 0) applyStep(currentStep - 1); });
        els.btnNext.addEventListener('click', () => { if (currentStep < totalSteps) applyStep(currentStep + 1); });

        // 初始状态
        applyStep(0);
    })();
    </script>
</body>
</html>
