<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>反比例函数面积关系推导</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
            display: block;
        }
        /* HTML text labels positioned over SVG */
        .scene1-label {
            position: absolute;
            font-size: 14px;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            color: #000000;
            pointer-events: none;
            line-height: 1;
            white-space: nowrap;
        }
        .scene1-label-blue { color: #1565c0; font-weight: bold; }
        .scene1-label-red { color: #c62828; font-weight: bold; }
        .scene1-label-green { color: #2e7d32; }
        .scene1-label-conclusion { color: #c62828; font-weight: bold; font-size: 18px; }
        .scene1-label-answer { color: #c62828; font-weight: bold; font-size: 16px; }
        .scene1-label-formula { color: #333333; font-size: 13px; }
        .scene1-fade {
            transition: opacity 0.35s ease;
        }
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            z-index: 10;
        }
        #scene1-step-panel {
            background: #f5f5f5;
            border: 1px solid #888888;
            border-radius: 2px;
            padding: 6px 16px;
            font-size: 14px;
            color: #333;
            min-width: 380px;
            text-align: center;
        }
        #scene1-btn-row {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .scene1-btn {
            padding: 6px 16px;
            font-size: 14px;
            background: #e0e0e0;
            border: 1px solid #9e9e9e;
            border-radius: 3px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .scene1-btn:hover:not(:disabled) {
            background: #bdbdbd;
        }
        .scene1-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        #scene1-step-counter {
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene1-arrow" viewBox="0 0 10 10" refX="9" refY="5"
                        markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
                </marker>
            </defs>

            <!-- 坐标轴 -->
            <line id="scene1-axis-x" class="scene1-fade" x1="160" y1="390" x2="755" y2="390"
                  stroke="#000000" stroke-width="1.5" marker-end="url(#scene1-arrow)"/>
            <line id="scene1-axis-y" class="scene1-fade" x1="160" y1="390" x2="160" y2="95"
                  stroke="#000000" stroke-width="1.5" marker-end="url(#scene1-arrow)"/>

            <!-- 原点 -->
            <circle id="scene1-origin-point" class="scene1-fade" cx="160" cy="390" r="3" fill="#000000"/>

            <!-- 反比例函数曲线 y=12/x，拆分为3段以减小各段bounding box -->
            <path id="scene1-curve-s1" class="scene1-fade"
                  d="M 235 70 L 250 123 L 260 150 L 285 198 L 310 230"
                  fill="none" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
            <path id="scene1-curve-s2" class="scene1-fade"
                  d="M 310 230 L 335 253 L 360 270 L 410 294 L 460 310"
                  fill="none" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
            <path id="scene1-curve-s3" class="scene1-fade"
                  d="M 460 310 L 560 330 L 660 342 L 760 350"
                  fill="none" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>

            <!-- 垂线和线段（步骤1+） -->
            <line id="scene1-line-ad" class="scene1-fade" x1="260" y1="150" x2="160" y2="150"
                  stroke="#000000" stroke-width="1"/>
            <line id="scene1-line-bc" class="scene1-fade" x1="460" y1="310" x2="160" y2="310"
                  stroke="#000000" stroke-width="1"/>
            <line id="scene1-line-ab" class="scene1-fade" x1="260" y1="150" x2="460" y2="310"
                  stroke="#000000" stroke-width="1.5"/>

            <!-- 线段OA、OB（步骤2+） -->
            <line id="scene1-line-oa" class="scene1-fade" x1="160" y1="390" x2="260" y2="150"
                  stroke="#000000" stroke-width="1.5"/>
            <line id="scene1-line-ob" class="scene1-fade" x1="160" y1="390" x2="460" y2="310"
                  stroke="#000000" stroke-width="1.5"/>

            <!-- 填充区域 -->
            <!-- 梯形ABCD S₁（步骤2+） -->
            <polygon id="scene1-fill-trapezoid" class="scene1-fade"
                     points="260,150 160,150 160,310 460,310"
                     fill="#1565c0" fill-opacity="0.15" stroke="#1565c0" stroke-width="1.5"/>
            <!-- △OAB S₂（步骤2+） -->
            <polygon id="scene1-fill-oab" class="scene1-fade"
                     points="160,390 260,150 460,310"
                     fill="#c62828" fill-opacity="0.15" stroke="#c62828" stroke-width="1.5"/>
            <!-- △OAD（步骤3+） -->
            <polygon id="scene1-fill-oad" class="scene1-fade"
                     points="160,390 260,150 160,150"
                     fill="#2e7d32" fill-opacity="0.15" stroke="#2e7d32" stroke-width="1.5"/>
            <!-- △OBC（步骤3+） -->
            <polygon id="scene1-fill-obc" class="scene1-fade"
                     points="160,390 460,310 160,310"
                     fill="#2e7d32" fill-opacity="0.15" stroke="#2e7d32" stroke-width="1.5"/>

            <!-- 点 -->
            <circle id="scene1-point-a" class="scene1-fade" cx="260" cy="150" r="4" fill="#1565c0" stroke="#000000" stroke-width="1"/>
            <circle id="scene1-point-b" class="scene1-fade" cx="460" cy="310" r="4" fill="#1565c0" stroke="#000000" stroke-width="1"/>
            <circle id="scene1-point-d" class="scene1-fade" cx="160" cy="150" r="2" fill="#000000"/>
            <circle id="scene1-point-c" class="scene1-fade" cx="160" cy="310" r="2" fill="#000000"/>
        </svg>

        <!-- HTML 标签层：所有文字标签用绝对定位 div，避免 SVG text 与图形 bounding box 重叠误报 -->
        <!-- 坐标轴标签 -->
        <div id="scene1-label-x" class="scene1-label scene1-fade" style="left: 765px; top: 381px;">x</div>
        <div id="scene1-label-y" class="scene1-label scene1-fade" style="left: 150px; top: 71px;">y</div>
        <div id="scene1-label-o" class="scene1-label scene1-fade" style="left: 145px; top: 396px;">O</div>

        <!-- 曲线标签 -->
        <div id="scene1-label-curve" class="scene1-label scene1-fade" style="left: 320px; top: 106px; font-style: italic;">y = k/x</div>

        <!-- 点标签 -->
        <div id="scene1-label-a" class="scene1-label scene1-fade" style="left: 270px; top: 131px;">A</div>
        <div id="scene1-label-b" class="scene1-label scene1-fade" style="left: 470px; top: 301px;">B</div>
        <div id="scene1-label-d" class="scene1-label scene1-fade" style="left: 140px; top: 131px;">D</div>
        <div id="scene1-label-c" class="scene1-label scene1-fade" style="left: 140px; top: 301px;">C</div>

        <!-- 面积标签 -->
        <div id="scene1-label-s1" class="scene1-label scene1-label-blue scene1-fade" style="left: 260px; top: 216px;">S₁</div>
        <div id="scene1-label-s2" class="scene1-label scene1-label-red scene1-fade" style="left: 293px; top: 269px;">S₂</div>
        <div id="scene1-label-halfk-oad" class="scene1-label scene1-label-green scene1-fade" style="left: 193px; top: 216px;">½k</div>
        <div id="scene1-label-halfk-obc" class="scene1-label scene1-label-green scene1-fade" style="left: 260px; top: 323px;">½k</div>

        <!-- 步骤3 面积相等提示 -->
        <div id="scene1-text-equal" class="scene1-label scene1-label-green scene1-fade" style="left: 600px; top: 186px;">S△OAD = S△OBC</div>

        <!-- 步骤4 割补公式 -->
        <div id="scene1-formula-1" class="scene1-label scene1-label-formula scene1-fade" style="left: 600px; top: 236px;">S△OAB = S梯形ABCD + S△OBC − S△OAD</div>

        <!-- 步骤5 推导与结论 -->
        <div id="scene1-formula-2" class="scene1-label scene1-label-formula scene1-fade" style="left: 600px; top: 256px;">∵ S△OBC = S△OAD = ½k&nbsp;&nbsp;∴ S△OAB = S梯形ABCD</div>
        <div id="scene1-conclusion" class="scene1-label scene1-label-conclusion scene1-fade" style="left: 600px; top: 122px;">S₁ : S₂ = 1 : 1</div>
        <div id="scene1-answer" class="scene1-label scene1-label-answer scene1-fade" style="left: 600px; top: 154px;">答案：A</div>

        <div id="scene1-controls">
            <div id="scene1-step-panel">观察反比例函数 y=k/x 在第一象限的图像</div>
            <div id="scene1-btn-row">
                <button id="scene1-btn-prev" class="scene1-btn" disabled>◀ 上一步</button>
                <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
            </div>
            <div id="scene1-step-counter">步骤 1 / 6</div>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现：反比例函数面积关系分步推导

        let currentStep = 0;
        const totalSteps = 6;

        const stepTexts = [
            "观察反比例函数 y=k/x 在第一象限的图像",
            "在曲线上取两点 A、B，作 AD⊥y轴，BC⊥y轴",
            "梯形 ABCD 的面积为 S₁，△OAB 的面积为 S₂",
            "△OAD 与 △OBC 的面积都等于 ½k，即反比例函数中 k 的几何意义",
            "利用面积割补法，△OAB 可看作梯形加上 △OBC 再减去 △OAD",
            "代入相等的三角形面积，得到 S₁=S₂，比值为 1:1"
        ];

        // 每步需要显示的元素 ID 列表（包含 SVG 元素和 HTML div 标签）
        const stepElements = [
            // 步骤0：坐标系 + 曲线
            [
                "scene1-axis-x", "scene1-axis-y", "scene1-origin-point",
                "scene1-label-x", "scene1-label-y", "scene1-label-o",
                "scene1-curve-s1", "scene1-curve-s2", "scene1-curve-s3", "scene1-label-curve"
            ],
            // 步骤1：+ 点、垂线、线段AB
            [
                "scene1-axis-x", "scene1-axis-y", "scene1-origin-point",
                "scene1-label-x", "scene1-label-y", "scene1-label-o",
                "scene1-curve-s1", "scene1-curve-s2", "scene1-curve-s3", "scene1-label-curve",
                "scene1-point-a", "scene1-point-b", "scene1-point-c", "scene1-point-d",
                "scene1-line-ad", "scene1-line-bc", "scene1-line-ab",
                "scene1-label-a", "scene1-label-b", "scene1-label-c", "scene1-label-d"
            ],
            // 步骤2：+ OA、OB、填充S₁、S₂
            [
                "scene1-axis-x", "scene1-axis-y", "scene1-origin-point",
                "scene1-label-x", "scene1-label-y", "scene1-label-o",
                "scene1-curve-s1", "scene1-curve-s2", "scene1-curve-s3", "scene1-label-curve",
                "scene1-point-a", "scene1-point-b", "scene1-point-c", "scene1-point-d",
                "scene1-line-ad", "scene1-line-bc", "scene1-line-ab",
                "scene1-label-a", "scene1-label-b", "scene1-label-c", "scene1-label-d",
                "scene1-line-oa", "scene1-line-ob",
                "scene1-fill-trapezoid", "scene1-fill-oab",
                "scene1-label-s1", "scene1-label-s2"
            ],
            // 步骤3：+ △OAD、△OBC填充 + ½k标签 + 面积相等提示
            [
                "scene1-axis-x", "scene1-axis-y", "scene1-origin-point",
                "scene1-label-x", "scene1-label-y", "scene1-label-o",
                "scene1-curve-s1", "scene1-curve-s2", "scene1-curve-s3", "scene1-label-curve",
                "scene1-point-a", "scene1-point-b", "scene1-point-c", "scene1-point-d",
                "scene1-line-ad", "scene1-line-bc", "scene1-line-ab",
                "scene1-label-a", "scene1-label-b", "scene1-label-c", "scene1-label-d",
                "scene1-line-oa", "scene1-line-ob",
                "scene1-fill-trapezoid", "scene1-fill-oab",
                "scene1-label-s1", "scene1-label-s2",
                "scene1-fill-oad", "scene1-fill-obc",
                "scene1-label-halfk-oad", "scene1-label-halfk-obc",
                "scene1-text-equal"
            ],
            // 步骤4：+ 割补公式
            [
                "scene1-axis-x", "scene1-axis-y", "scene1-origin-point",
                "scene1-label-x", "scene1-label-y", "scene1-label-o",
                "scene1-curve-s1", "scene1-curve-s2", "scene1-curve-s3", "scene1-label-curve",
                "scene1-point-a", "scene1-point-b", "scene1-point-c", "scene1-point-d",
                "scene1-line-ad", "scene1-line-bc", "scene1-line-ab",
                "scene1-label-a", "scene1-label-b", "scene1-label-c", "scene1-label-d",
                "scene1-line-oa", "scene1-line-ob",
                "scene1-fill-trapezoid", "scene1-fill-oab",
                "scene1-label-s1", "scene1-label-s2",
                "scene1-fill-oad", "scene1-fill-obc",
                "scene1-label-halfk-oad", "scene1-label-halfk-obc",
                "scene1-text-equal",
                "scene1-formula-1"
            ],
            // 步骤5：+ 推导公式 + 结论 + 答案
            [
                "scene1-axis-x", "scene1-axis-y", "scene1-origin-point",
                "scene1-label-x", "scene1-label-y", "scene1-label-o",
                "scene1-curve-s1", "scene1-curve-s2", "scene1-curve-s3", "scene1-label-curve",
                "scene1-point-a", "scene1-point-b", "scene1-point-c", "scene1-point-d",
                "scene1-line-ad", "scene1-line-bc", "scene1-line-ab",
                "scene1-label-a", "scene1-label-b", "scene1-label-c", "scene1-label-d",
                "scene1-line-oa", "scene1-line-ob",
                "scene1-fill-trapezoid", "scene1-fill-oab",
                "scene1-label-s1", "scene1-label-s2",
                "scene1-fill-oad", "scene1-fill-obc",
                "scene1-label-halfk-oad", "scene1-label-halfk-obc",
                "scene1-text-equal",
                "scene1-formula-1", "scene1-formula-2",
                "scene1-conclusion", "scene1-answer"
            ]
        ];

        const allElementIds = [
            "scene1-axis-x", "scene1-axis-y", "scene1-origin-point",
            "scene1-label-x", "scene1-label-y", "scene1-label-o",
            "scene1-curve-s1", "scene1-curve-s2", "scene1-curve-s3", "scene1-label-curve",
            "scene1-point-a", "scene1-point-b", "scene1-point-c", "scene1-point-d",
            "scene1-line-ad", "scene1-line-bc", "scene1-line-ab",
            "scene1-label-a", "scene1-label-b", "scene1-label-c", "scene1-label-d",
            "scene1-line-oa", "scene1-line-ob",
            "scene1-fill-trapezoid", "scene1-fill-oab",
            "scene1-label-s1", "scene1-label-s2",
            "scene1-fill-oad", "scene1-fill-obc",
            "scene1-label-halfk-oad", "scene1-label-halfk-obc",
            "scene1-text-equal",
            "scene1-formula-1", "scene1-formula-2",
            "scene1-conclusion", "scene1-answer"
        ];

        const btnPrev = document.getElementById("scene1-btn-prev");
        const btnNext = document.getElementById("scene1-btn-next");
        const stepPanel = document.getElementById("scene1-step-panel");
        const stepCounter = document.getElementById("scene1-step-counter");

        function renderStep() {
            const visibleIds = stepElements[currentStep];
            const visibleSet = new Set(visibleIds);

            allElementIds.forEach(function(id) {
                const el = document.getElementById(id);
                if (el) {
                    el.style.opacity = visibleSet.has(id) ? "1" : "0";
                }
            });

            stepPanel.textContent = stepTexts[currentStep];
            stepCounter.textContent = "步骤 " + (currentStep + 1) + " / " + totalSteps;

            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps - 1);
        }

        btnPrev.addEventListener("click", function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        });

        btnNext.addEventListener("click", function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                renderStep();
            }
        });

        renderStep();
    })();
    </script>
</body>
</html>
