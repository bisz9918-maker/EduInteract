<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>光照图综合判读</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            padding: 6px 16px; font-size: 14px; border: none; border-radius: 4px; cursor: pointer;
            font-family: inherit; transition: opacity 0.2s;
        }
        #scene1-prev-btn { background: #e0e0e0; color: #333; }
        #scene1-next-btn { background: #1565c0; color: #fff; }
        #scene1-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 14px; color: #666; min-width: 50px; text-align: center; }
        .scene1-hidden { display: none; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0"/>
                </marker>
            </defs>

            <!-- 基础光照图（始终显示） -->
            <rect id="scene1-grid-frame" x="200" y="60" width="300" height="260" fill="none" stroke="#000" stroke-width="1.5"/>
            <line id="scene1-meridian-375" x1="200" y1="60" x2="200" y2="320" stroke="#000" stroke-width="1"/>
            <line id="scene1-meridian-30" x1="350" y1="60" x2="350" y2="320" stroke="#000" stroke-width="1"/>
            <line id="scene1-meridian-225" x1="500" y1="60" x2="500" y2="320" stroke="#000" stroke-width="1"/>
            <line id="scene1-parallel-0" x1="200" y1="120" x2="500" y2="120" stroke="#000" stroke-width="1"/>
            <line id="scene1-parallel-235" x1="200" y1="280" x2="500" y2="280" stroke="#000" stroke-width="1"/>
            <line id="scene1-dawn-line" x1="294" y1="60" x2="500" y2="280" stroke="#000" stroke-width="1.5"/>
            <polygon id="scene1-night-fill" points="200,60 294,60 500,280 200,280" fill="#2e7d32" fill-opacity="0.2" stroke="none"/>

            <!-- 经纬度标签 -->
            <text id="scene1-label-375w" x="200" y="38" text-anchor="middle" font-size="13" fill="#333">37.5°W</text>
            <text id="scene1-label-30w" x="350" y="38" text-anchor="middle" font-size="13" fill="#333">30°W</text>
            <text id="scene1-label-225w" x="500" y="38" text-anchor="middle" font-size="13" fill="#333">22.5°W</text>
            <text id="scene1-label-0" x="185" y="125" text-anchor="end" font-size="13" fill="#333">0°</text>
            <text id="scene1-label-235s" x="185" y="285" text-anchor="end" font-size="13" fill="#333">23.5°S</text>

            <!-- 甲、乙点 -->
            <circle id="scene1-point-jia" cx="350" cy="120" r="4" fill="#c62828"/>
            <circle id="scene1-point-yi" cx="500" cy="280" r="4" fill="#c62828"/>
            <text id="scene1-label-jia" x="520" y="120" font-size="14" fill="#333">甲</text>
            <text id="scene1-label-yi" x="520" y="285" font-size="14" fill="#333">乙</text>

            <!-- ===== 步骤1 元素 ===== -->
            <g id="scene1-step1-group" class="scene1-hidden">
                <line id="scene1-line-20w" x1="550" y1="60" x2="550" y2="320" stroke="#888" stroke-width="1" stroke-dasharray="5,4"/>
                <text id="scene1-label-20w" x="550" y="38" text-anchor="middle" font-size="13" fill="#888">20°W</text>
                <text id="scene1-label-west" x="120" y="38" text-anchor="middle" font-size="14" fill="#2e7d32" font-weight="bold">西半球</text>
                <text id="scene1-label-east" x="600" y="38" text-anchor="middle" font-size="14" fill="#1565c0" font-weight="bold">东半球</text>
                <circle id="scene1-highlight-jia" cx="350" cy="120" r="8" fill="none" stroke="#c62828" stroke-width="2"/>
                <text id="scene1-label-600" x="130" y="145" font-size="14" fill="#c62828" font-weight="bold">6:00</text>
                <!-- 赤道晨线下移，与6:00保持≥12px间距 -->
                <text id="scene1-label-equator-dawn" x="130" y="185" font-size="12" fill="#666">赤道晨线</text>
            </g>

            <!-- ===== 步骤2 元素 ===== -->
            <g id="scene1-step2-group" class="scene1-hidden">
                <text id="scene1-label-direct-north" x="420" y="38" text-anchor="middle" font-size="14" fill="#2e7d32" font-weight="bold">直射北半球</text>
                <path id="scene1-derive-arrow" d="M 380 120 Q 470 120 560 180" fill="none" stroke="#1565c0" stroke-width="1.5" marker-end="url(#scene1-arrowhead)"/>
                <g id="scene1-derive-step2" class="scene1-hidden">
                    <text x="570" y="150" font-size="13" fill="#333">甲地 30°W 地方时 6:00</text>
                    <text x="570" y="185" font-size="13" fill="#1565c0">↓ 向东 90°</text>
                    <text x="570" y="220" font-size="13" fill="#1565c0">60°E 地方时 12:00</text>
                    <text x="570" y="260" font-size="14" fill="#c62828" font-weight="bold">∴ 直射经线 60°E</text>
                    <circle cx="740" cy="140" r="6" fill="#c62828"/>
                    <line x1="740" y1="128" x2="740" y2="132" stroke="#c62828" stroke-width="1.5"/>
                    <line x1="740" y1="148" x2="740" y2="152" stroke="#c62828" stroke-width="1.5"/>
                    <line x1="728" y1="140" x2="732" y2="140" stroke="#c62828" stroke-width="1.5"/>
                    <line x1="748" y1="140" x2="752" y2="140" stroke="#c62828" stroke-width="1.5"/>
                    <line x1="731" y1="131" x2="734" y2="134" stroke="#c62828" stroke-width="1.5"/>
                    <line x1="746" y1="146" x2="749" y2="149" stroke="#c62828" stroke-width="1.5"/>
                    <line x1="731" y1="149" x2="734" y2="146" stroke="#c62828" stroke-width="1.5"/>
                    <line x1="746" y1="134" x2="749" y2="131" stroke="#c62828" stroke-width="1.5"/>
                </g>
                <g id="scene1-derive-step3" class="scene1-hidden">
                    <text x="570" y="150" font-size="13" fill="#333">乙地 22.5°W</text>
                    <text x="570" y="185" font-size="13" fill="#333">与甲地经度差 7.5°</text>
                    <text x="570" y="220" font-size="13" fill="#333">时差 30 分钟</text>
                    <text x="570" y="255" font-size="13" fill="#c62828" font-weight="bold">日出时刻 6:30</text>
                    <text x="570" y="295" font-size="13" fill="#333">昼长 = (12:00 − 6:30) × 2</text>
                    <text x="570" y="335" font-size="14" fill="#c62828" font-weight="bold">= 11 小时</text>
                </g>
            </g>

            <!-- ===== 步骤3 元素 ===== -->
            <g id="scene1-step3-group" class="scene1-hidden">
                <circle id="scene1-highlight-yi" cx="500" cy="280" r="8" fill="none" stroke="#c62828" stroke-width="2"/>
                <!-- 日出6:30下移，与23.5°S保持≥12px间距 -->
                <text id="scene1-label-630" x="130" y="325" font-size="14" fill="#c62828" font-weight="bold">日出 6:30</text>
            </g>

            <!-- ===== 步骤4 元素 ===== -->
            <g id="scene1-step4-group" class="scene1-hidden">
                <line id="scene1-timeline-axis" x1="100" y1="370" x2="700" y2="370" stroke="#333" stroke-width="1.5"/>
                <line x1="200" y1="365" x2="200" y2="375" stroke="#333" stroke-width="1"/>
                <line x1="500" y1="365" x2="500" y2="375" stroke="#333" stroke-width="1"/>
                <line x1="600" y1="365" x2="600" y2="375" stroke="#333" stroke-width="1"/>
                <rect id="scene1-wait-highlight" x="500" y="348" width="100" height="16" fill="#2e7d32" fill-opacity="0.2" stroke="none"/>
                <text x="200" y="390" text-anchor="middle" font-size="12" fill="#333">30°W</text>
                <text x="200" y="405" text-anchor="middle" font-size="12" fill="#333">6:00</text>
                <text x="500" y="390" text-anchor="middle" font-size="12" fill="#1565c0" font-weight="bold">上海(东八区)</text>
                <text x="500" y="405" text-anchor="middle" font-size="12" fill="#1565c0" font-weight="bold">16:00</text>
                <text x="600" y="390" text-anchor="middle" font-size="12" fill="#c62828" font-weight="bold">满月升起</text>
                <text x="600" y="405" text-anchor="middle" font-size="12" fill="#c62828" font-weight="bold">18:00</text>
                <text id="scene1-label-wait" x="550" y="450" text-anchor="middle" font-size="13" fill="#2e7d32" font-weight="bold">等待约 2 小时</text>
            </g>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-prev-btn" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">1 / 5</span>
            <button id="scene1-next-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        var currentStep = 0;
        var totalSteps = 5;
        var prevBtn = document.getElementById('scene1-prev-btn');
        var nextBtn = document.getElementById('scene1-next-btn');
        var indicator = document.getElementById('scene1-step-indicator');
        var step1Group = document.getElementById('scene1-step1-group');
        var step2Group = document.getElementById('scene1-step2-group');
        var step3Group = document.getElementById('scene1-step3-group');
        var step4Group = document.getElementById('scene1-step4-group');
        var deriveStep2 = document.getElementById('scene1-derive-step2');
        var deriveStep3 = document.getElementById('scene1-derive-step3');

        function showStep(n) {
            step1Group.style.display = (n >= 1) ? 'block' : 'none';
            step2Group.style.display = (n >= 2) ? 'block' : 'none';
            step3Group.style.display = (n >= 3) ? 'block' : 'none';
            step4Group.style.display = (n >= 4) ? 'block' : 'none';
            if (n === 2) {
                deriveStep2.style.display = 'block';
                deriveStep3.style.display = 'none';
                deriveStep3.style.opacity = '1';
            } else if (n === 3) {
                deriveStep2.style.display = 'none';
                deriveStep3.style.display = 'block';
                deriveStep3.style.opacity = '1';
            } else if (n >= 4) {
                deriveStep2.style.display = 'none';
                deriveStep3.style.display = 'block';
                deriveStep3.style.opacity = '0.3';
            } else {
                deriveStep2.style.display = 'none';
                deriveStep3.style.display = 'none';
                deriveStep3.style.opacity = '1';
            }
            prevBtn.disabled = (n <= 0);
            nextBtn.disabled = (n >= totalSteps - 1);
            indicator.textContent = (n + 1) + ' / ' + totalSteps;
        }

        prevBtn.addEventListener('click', function() {
            if (currentStep > 0) { currentStep--; showStep(currentStep); }
        });
        nextBtn.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) { currentStep++; showStep(currentStep); }
        });
        showStep(0);
    })();
    </script>
</body>
</html>
