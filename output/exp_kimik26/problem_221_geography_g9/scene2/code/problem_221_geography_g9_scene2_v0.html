<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 正午太阳高度角与太阳能电池板安装角</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 16px; z-index: 10; }
        #scene2-controls button {
            padding: 6px 18px; font-size: 14px; cursor: pointer;
            border: 1px solid #1565c0; border-radius: 4px; background: #ffffff; color: #1565c0;
            transition: all 0.2s ease;
        }
        #scene2-controls button:hover:not(:disabled) { background: #1565c0; color: #ffffff; }
        #scene2-controls button:disabled { opacity: 0.4; cursor: not-allowed; border-color: #888; color: #888; }
        #scene2-step-indicator { font-size: 13px; color: #555; min-width: 70px; text-align: center; }
        .scene2-fade { transition: opacity 0.25s ease; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 定义 -->
            <defs>
                <marker id="scene2-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#1565c0"/>
                </marker>
            </defs>

            <!-- === 左侧纬度轴区域 === -->
            <!-- 纬度轴线 (60,100)-(60,340) -->
            <line id="scene2-lat-axis" class="scene2-fade" x1="60" y1="100" x2="60" y2="340" stroke="#000" stroke-width="1.5"/>
            <!-- 31°N刻度 -->
            <line id="scene2-tick-31n" class="scene2-fade" x1="55" y1="140" x2="65" y2="140" stroke="#c62828" stroke-width="2"/>
            <!-- 10°N刻度 -->
            <line id="scene2-tick-10n" class="scene2-fade" x1="55" y1="220" x2="65" y2="220" stroke="#1565c0" stroke-width="2"/>
            <!-- 0°刻度 -->
            <line id="scene2-tick-0" class="scene2-fade" x1="55" y1="280" x2="65" y2="280" stroke="#000" stroke-width="1.5"/>
            <!-- 上海点 -->
            <circle id="scene2-dot-shanghai" class="scene2-fade" cx="60" cy="140" r="4" fill="#c62828"/>
            <!-- 直射点 -->
            <circle id="scene2-dot-sun" class="scene2-fade" cx="60" cy="220" r="4" fill="#1565c0"/>
            <!-- 纬度标签：放在轴线右侧避免左侧裁切 -->
            <text id="scene2-label-31n" class="scene2-fade" x="75" y="145" font-size="13" fill="#333">31°N</text>
            <text id="scene2-label-shanghai" class="scene2-fade" x="75" y="128" font-size="13" fill="#c62828">上海</text>
            <text id="scene2-label-10n" class="scene2-fade" x="75" y="225" font-size="13" fill="#333">10°N</text>
            <text id="scene2-label-sun" class="scene2-fade" x="75" y="208" font-size="13" fill="#1565c0">直射点</text>
            <text id="scene2-label-0" class="scene2-fade" x="75" y="285" font-size="13" fill="#333">0° 赤道</text>

            <!-- === 中央主图区 === -->
            <!-- 地面填充 (280,380)-(580,400) -->
            <rect id="scene2-ground-fill" class="scene2-fade" x="280" y="380" width="300" height="20" fill="#2e7d32" fill-opacity="0.25"/>
            <!-- 地面线 -->
            <line id="scene2-ground-line" class="scene2-fade" x1="280" y1="380" x2="580" y2="380" stroke="#000" stroke-width="2"/>
            <!-- 墙面 (540,380)-(540,260) -->
            <line id="scene2-wall" class="scene2-fade" x1="540" y1="380" x2="540" y2="260" stroke="#000" stroke-width="6"/>
            <!-- 电池板：rect 70×8，绕(540,260)旋转-21° -->
            <rect id="scene2-panel" class="scene2-fade" x="540" y="256" width="70" height="8" fill="#1565c0" fill-opacity="0.35" stroke="#1565c0" stroke-width="1" transform="rotate(-21, 540, 260)"/>
            <!-- 太阳光线 (620,52)-(494,380)，带箭头 -->
            <line id="scene2-sun-ray" class="scene2-fade" x1="620" y1="52" x2="494" y2="380" stroke="#1565c0" stroke-width="2" marker-end="url(#scene2-arrow)"/>
            <!-- 法线 (551,303)-(594,191) -->
            <line id="scene2-normal" class="scene2-fade" x1="551" y1="303" x2="594" y2="191" stroke="#2e7d32" stroke-width="2" stroke-dasharray="6,4"/>

            <!-- H角度弧：中心(494,380)，半径35，从0°到69° -->
            <path id="scene2-arc-h" class="scene2-fade" d="M 529 380 A 35 35 0 0 0 506.44 347.32" fill="none" stroke="#c62828" stroke-width="2"/>
            <!-- θ角度弧：中心(540,260)，半径30，从90°到21°（顺时针69°） -->
            <path id="scene2-arc-theta" class="scene2-fade" d="M 540 230 A 30 30 0 0 0 568.01 249.24" fill="none" stroke="#c62828" stroke-width="2"/>

            <!-- 主图区标签：全部外移避免与图形重叠 -->
            <text id="scene2-label-ground" class="scene2-fade" x="420" y="420" font-size="13" fill="#333" text-anchor="middle">地面</text>
            <text id="scene2-label-sunray" class="scene2-fade" x="630" y="85" font-size="13" fill="#1565c0">太阳光线</text>
            <text id="scene2-label-h" class="scene2-fade" x="445" y="350" font-size="14" fill="#c62828" font-weight="bold">H = 69°</text>
            <!-- 墙面标签放在墙面右侧偏下，远离所有斜线 -->
            <text id="scene2-label-wall" class="scene2-fade" x="620" y="340" font-size="13" fill="#333">墙面</text>
            <!-- 电池板标签放在电池板右上方，远离θ标签 -->
            <text id="scene2-label-panel" class="scene2-fade" x="685" y="200" font-size="13" fill="#1565c0">电池板</text>
            <!-- θ标签放在电池板左侧偏上，远离弧线和光线 -->
            <text id="scene2-label-theta" class="scene2-fade" x="625" y="185" font-size="14" fill="#c62828" font-weight="bold">θ = 69°</text>
            <!-- 法线标签放在法线延长线上方，与θ保持足够间距 -->
            <text id="scene2-label-normal" class="scene2-fade" x="620" y="140" font-size="13" fill="#2e7d32">法线</text>

            <!-- 顶部说明文字 -->
            <text id="scene2-top-text" class="scene2-fade" x="400" y="48" font-size="15" fill="#333" text-anchor="middle" font-weight="bold"></text>
            <text id="scene2-formula-text" class="scene2-fade" x="400" y="92" font-size="14" fill="#555" text-anchor="middle"></text>
        </svg>

        <div id="scene2-controls">
            <button id="scene2-btn-prev">◀ 上一步</button>
            <span id="scene2-step-indicator">步骤 1/4</span>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2 实现
        var currentStep = 0;
        var totalSteps = 4;

        // 元素ID列表
        var latAxisIds = [
            'scene2-lat-axis','scene2-tick-31n','scene2-tick-10n','scene2-tick-0',
            'scene2-dot-shanghai','scene2-dot-sun',
            'scene2-label-31n','scene2-label-shanghai','scene2-label-10n','scene2-label-sun','scene2-label-0'
        ];
        var groundIds = ['scene2-ground-fill','scene2-ground-line','scene2-label-ground'];
        var sunRayIds = ['scene2-sun-ray','scene2-label-sunray'];
        var arcHIds = ['scene2-arc-h','scene2-label-h'];
        var wallIds = ['scene2-wall','scene2-label-wall'];
        var panelIds = ['scene2-panel','scene2-label-panel'];
        var arcThetaIds = ['scene2-arc-theta','scene2-label-theta'];
        var normalIds = ['scene2-normal','scene2-label-normal'];

        var topText = document.getElementById('scene2-top-text');
        var formulaText = document.getElementById('scene2-formula-text');
        var stepIndicator = document.getElementById('scene2-step-indicator');
        var btnPrev = document.getElementById('scene2-btn-prev');
        var btnNext = document.getElementById('scene2-btn-next');

        function setOpacity(ids, opacity) {
            ids.forEach(function(id) {
                var el = document.getElementById(id);
                if (el) { el.style.opacity = opacity; }
            });
        }

        function renderStep() {
            // 步骤指示器
            stepIndicator.textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps - 1);

            // 默认全部隐藏
            setOpacity(latAxisIds, 0);
            setOpacity(groundIds, 0);
            setOpacity(sunRayIds, 0);
            setOpacity(arcHIds, 0);
            setOpacity(wallIds, 0);
            setOpacity(panelIds, 0);
            setOpacity(arcThetaIds, 0);
            setOpacity(normalIds, 0);
            topText.textContent = '';
            formulaText.textContent = '';

            switch(currentStep) {
                case 0:
                    // 步骤0：条件解读
                    setOpacity(latAxisIds, 1);
                    topText.textContent = '晨昏线与经线夹角 = 太阳直射点纬度 = 10°';
                    break;
                case 1:
                    // 步骤1：太阳高度计算
                    setOpacity(latAxisIds, 0.35);
                    setOpacity(groundIds, 1);
                    setOpacity(sunRayIds, 1);
                    setOpacity(arcHIds, 1);
                    topText.textContent = '正午太阳高度角 H = 90° - |φ - δ|';
                    formulaText.textContent = 'H = 90° - (31° - 10°) = 69°';
                    break;
                case 2:
                    // 步骤2：几何剖面
                    setOpacity(latAxisIds, 0.35);
                    setOpacity(groundIds, 1);
                    setOpacity(sunRayIds, 1);
                    setOpacity(arcHIds, 1);
                    setOpacity(wallIds, 1);
                    setOpacity(panelIds, 1);
                    setOpacity(arcThetaIds, 1);
                    topText.textContent = '电池板平面与太阳光线垂直时，接收效率最高';
                    break;
                case 3:
                    // 步骤3：结论推导
                    setOpacity(latAxisIds, 0.35);
                    setOpacity(groundIds, 1);
                    setOpacity(sunRayIds, 1);
                    setOpacity(arcHIds, 1);
                    setOpacity(wallIds, 1);
                    setOpacity(panelIds, 1);
                    setOpacity(arcThetaIds, 1);
                    setOpacity(normalIds, 1);
                    topText.textContent = '电池板法线 ∥ 太阳光线 → θ = H = 69°';
                    break;
            }
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) { currentStep--; renderStep(); }
        });
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) { currentStep++; renderStep(); }
        });

        // 初始渲染
        renderStep();
    })();
    </script>
</body>
</html>
