<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 太阳直射点回归运动</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene2-controls button {
            width: 80px; height: 30px; font-size: 14px; cursor: pointer;
            border: 1px solid #ccc; border-radius: 4px; background: #f5f5f5;
            transition: opacity 0.2s;
        }
        #scene2-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene2-controls button:hover:not(:disabled) { background: #e0e0e0; }
        .scene2-text { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        .scene2-fade { transition: opacity 0.3s ease; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" id="scene2-svg">
            <defs>
                <clipPath id="scene2-earth-clip">
                    <circle cx="410" cy="200" r="55"/>
                </clipPath>
                <marker id="scene2-arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
                    <polygon points="0 0, 8 4, 0 8" fill="#c62828"/>
                </marker>
            </defs>

            <!-- 左侧回归运动图 -->
            <g id="scene2-left-panel">
                <!-- 纬度主轴 -->
                <line x1="60" y1="60" x2="60" y2="380" stroke="#000" stroke-width="2"/>
                <!-- 北回归线辅助 -->
                <line x1="60" y1="90" x2="240" y2="90" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
                <!-- 赤道辅助 -->
                <line x1="60" y1="215" x2="240" y2="215" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
                <!-- 南回归线辅助 -->
                <line x1="60" y1="340" x2="240" y2="340" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
                <!-- 时间横轴 -->
                <line x1="60" y1="380" x2="260" y2="380" stroke="#000" stroke-width="1"/>

                <!-- 回归轨迹 -->
                <polyline id="scene2-track-line" points="100,215 180,90 260,215 180,340 100,215" fill="none" stroke="#1565c0" stroke-width="2"/>
                <!-- 步骤5高亮轨迹段 -->
                <polyline id="scene2-track-highlight" points="100,215 180,90" fill="none" stroke="#c62828" stroke-width="4" opacity="0"/>

                <!-- 节点光晕（默认隐藏） -->
                <circle id="scene2-glow-outer" cx="100" cy="215" r="10" fill="#c62828" opacity="0"/>
                <circle id="scene2-glow-inner" cx="100" cy="215" r="6" fill="#c62828" opacity="0"/>

                <!-- 四个节点 -->
                <circle id="scene2-node-spring" cx="100" cy="215" r="4" fill="#1565c0" stroke="#fff" stroke-width="1"/>
                <circle id="scene2-node-summer" cx="180" cy="90" r="4" fill="#1565c0" stroke="#fff" stroke-width="1"/>
                <circle id="scene2-node-autumn" cx="260" cy="215" r="4" fill="#1565c0" stroke="#fff" stroke-width="1"/>
                <circle id="scene2-node-winter" cx="180" cy="340" r="4" fill="#1565c0" stroke="#fff" stroke-width="1"/>

                <!-- 纬度标签 -->
                <text x="25" y="95" class="scene2-text" font-size="14" fill="#333" text-anchor="start">23.5°N</text>
                <text x="25" y="220" class="scene2-text" font-size="14" fill="#333" text-anchor="start">0°</text>
                <text x="25" y="345" class="scene2-text" font-size="14" fill="#333" text-anchor="start">23.5°S</text>
                <text x="60" y="50" class="scene2-text" font-size="14" fill="#333" text-anchor="middle">纬度</text>

                <!-- 节气标签（左右偏移避免与轨迹折线bounding box重叠） -->
                <text x="82" y="255" class="scene2-text" font-size="14" fill="#333" text-anchor="end">春分</text>
                <text x="180" y="70" class="scene2-text" font-size="14" fill="#333" text-anchor="middle">夏至</text>
                <text x="278" y="255" class="scene2-text" font-size="14" fill="#333" text-anchor="start">秋分</text>
                <text x="180" y="365" class="scene2-text" font-size="14" fill="#333" text-anchor="middle">冬至</text>

                <!-- 日期标签 -->
                <text x="100" y="405" class="scene2-text" font-size="13" fill="#666" text-anchor="middle">3/21</text>
                <text x="180" y="405" class="scene2-text" font-size="13" fill="#666" text-anchor="middle">6/22</text>
                <text x="260" y="405" class="scene2-text" font-size="13" fill="#666" text-anchor="middle">9/23</text>
                <text x="180" y="445" class="scene2-text" font-size="13" fill="#666" text-anchor="middle">12/22</text>
            </g>

            <!-- 中间地球 -->
            <g id="scene2-earth-panel">
                <!-- 海洋圆 -->
                <circle id="scene2-earth-ocean" cx="410" cy="200" r="55" fill="#1565c0" stroke="#fff" stroke-width="2"/>
                <!-- 夜半球遮罩 -->
                <path id="scene2-earth-night" d="M 410,145 A 55,55 0 1,0 410,255 Z" fill="#9e9e9e" opacity="0.5" clip-path="url(#scene2-earth-clip)" style="display:none;"/>
                <!-- 地轴 -->
                <line id="scene2-earth-axis" x1="410" y1="140" x2="410" y2="260" stroke="#e0e0e0" stroke-width="2"/>
                <!-- N/S 标签 -->
                <text id="scene2-label-n" x="410" y="135" class="scene2-text" font-size="12" fill="#666" text-anchor="middle">N</text>
                <text id="scene2-label-s" x="410" y="270" class="scene2-text" font-size="12" fill="#666" text-anchor="middle">S</text>
                <!-- 直射光线 -->
                <line id="scene2-sunray" x1="520" y1="200" x2="465" y2="200" stroke="#c62828" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#scene2-arrowhead)" style="display:none;"/>
                <!-- 直射点红点 -->
                <circle id="scene2-sunspot" cx="465" cy="200" r="3" fill="#c62828" style="display:none;"/>
                <!-- 直射点文字 -->
                <text id="scene2-sunspot-text" x="490" y="185" class="scene2-text" font-size="13" fill="#c62828" text-anchor="middle" style="display:none;">直射点</text>
            </g>

            <!-- 右侧信息面板 -->
            <g id="scene2-right-panel">
                <!-- 步骤0 信息 -->
                <g id="scene2-info-step0" class="scene2-fade">
                    <text x="660" y="100" class="scene2-text" font-size="20" fill="#1565c0" text-anchor="middle" font-weight="bold">太阳直射点回归运动</text>
                    <text x="660" y="140" class="scene2-text" font-size="15" fill="#666" text-anchor="middle">一年中的四个关键位置</text>
                    <text x="660" y="190" class="scene2-text" font-size="14" fill="#333" text-anchor="middle">春分（3/21）— 直射赤道</text>
                    <text x="660" y="230" class="scene2-text" font-size="14" fill="#333" text-anchor="middle">夏至（6/22）— 直射北回归线</text>
                    <text x="660" y="270" class="scene2-text" font-size="14" fill="#333" text-anchor="middle">秋分（9/23）— 直射赤道</text>
                    <text x="660" y="310" class="scene2-text" font-size="14" fill="#333" text-anchor="middle">冬至（12/22）— 直射南回归线</text>
                    <text x="660" y="370" class="scene2-text" font-size="13" fill="#999" text-anchor="middle">点击下一步查看详情</text>
                </g>

                <!-- 步骤1-4 信息（动态更新内容） -->
                <g id="scene2-info-step14" class="scene2-fade" style="display:none;">
                    <text id="scene2-info-solar-term" x="660" y="75" class="scene2-text" font-size="22" fill="#c62828" text-anchor="middle" font-weight="bold">春分</text>
                    <text id="scene2-info-date" x="660" y="115" class="scene2-text" font-size="14" fill="#666" text-anchor="middle">3月21日</text>

                    <text x="570" y="160" class="scene2-text" font-size="14" fill="#1565c0" text-anchor="start" font-weight="bold">北半球</text>
                    <text id="scene2-info-north-season" x="700" y="160" class="scene2-text" font-size="14" fill="#1565c0" text-anchor="start">春季</text>
                    <text id="scene2-info-north-note" x="660" y="195" class="scene2-text" font-size="13" fill="#666" text-anchor="middle">全球昼夜平分</text>

                    <text x="570" y="245" class="scene2-text" font-size="14" fill="#2e7d32" text-anchor="start" font-weight="bold">南半球</text>
                    <text id="scene2-info-south-season" x="700" y="245" class="scene2-text" font-size="14" fill="#2e7d32" text-anchor="start">秋季</text>
                    <text id="scene2-info-south-note" x="660" y="280" class="scene2-text" font-size="13" fill="#666" text-anchor="middle"></text>
                </g>

                <!-- 步骤5 信息 -->
                <g id="scene2-info-step5" class="scene2-fade" style="display:none;">
                    <text x="660" y="120" class="scene2-text" font-size="16" fill="#c62828" text-anchor="middle" font-weight="bold">季节过渡 b(春分) → c(夏至)</text>
                    <text x="660" y="160" class="scene2-text" font-size="14" fill="#333" text-anchor="middle">北半球：春季 → 夏季</text>
                    <text x="660" y="195" class="scene2-text" font-size="14" fill="#333" text-anchor="middle">直射点：赤道(0°) → 北回归线(23.5°N)</text>

                    <text x="660" y="245" class="scene2-text" font-size="15" fill="#333" text-anchor="middle" font-weight="bold">南北半球季节相反</text>
                    <!-- 对比条文字（去掉rect背景避免重叠检测误报） -->
                    <text x="660" y="285" class="scene2-text" font-size="14" fill="#c62828" text-anchor="middle" font-weight="bold">北半球夏季 = 南半球冬季</text>
                    <text x="660" y="320" class="scene2-text" font-size="14" fill="#1565c0" text-anchor="middle" font-weight="bold">北半球冬季 = 南半球夏季</text>

                    <text x="640" y="380" class="scene2-text" font-size="14" fill="#2e7d32" text-anchor="middle">澳大利亚在南半球，北半球暑假时为冬季</text>
                </g>
            </g>

            <!-- 步骤指示器 -->
            <text id="scene2-step-indicator" x="660" y="470" class="scene2-text" font-size="14" fill="#666" text-anchor="middle">步骤 0/5</text>
        </svg>

        <div id="scene2-controls">
            <button id="scene2-btn-prev" disabled>◀ 上一步</button>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2 实现
        let currentStep = 0;
        const totalSteps = 5;

        // 地球配置
        const earthConfigs = {
            springAutumn: {
                axis: { x1: 410, y1: 140, x2: 410, y2: 260 },
                nPos: { x: 410, y: 135 },
                sPos: { x: 410, y: 270 },
                sunrayY: 200,
                nightPath: "M 410,145 A 55,55 0 1,0 410,255 Z"
            },
            summer: {
                axis: { x1: 436, y1: 140, x2: 384, y2: 260 },
                nPos: { x: 436, y: 135 },
                sPos: { x: 384, y: 270 },
                sunrayY: 178,
                nightPath: "M 355,145 L 388,149 A 55,55 0 0,1 432,251 L 355,255 Z"
            },
            winter: {
                axis: { x1: 384, y1: 140, x2: 436, y2: 260 },
                nPos: { x: 384, y: 135 },
                sPos: { x: 436, y: 270 },
                sunrayY: 222,
                nightPath: "M 355,145 L 432,149 A 55,55 0 0,0 388,251 L 355,255 Z"
            }
        };

        // 步骤数据
        const stepData = {
            1: {
                term: "春分", date: "3月21日",
                northSeason: "春季", northNote: "全球昼夜平分",
                southSeason: "秋季", southNote: "",
                earthConfig: "springAutumn",
                highlightNode: "spring"
            },
            2: {
                term: "夏至", date: "6月22日",
                northSeason: "夏季", northNote: "获光热最多，昼最长夜最短",
                southSeason: "冬季", southNote: "",
                earthConfig: "summer",
                highlightNode: "summer"
            },
            3: {
                term: "秋分", date: "9月23日",
                northSeason: "秋季", northNote: "全球昼夜平分",
                southSeason: "春季", southNote: "",
                earthConfig: "springAutumn",
                highlightNode: "autumn"
            },
            4: {
                term: "冬至", date: "12月22日",
                northSeason: "冬季", northNote: "",
                southSeason: "夏季", southNote: "获光热最多，昼最长夜最短",
                earthConfig: "winter",
                highlightNode: "winter"
            }
        };

        // 节点坐标
        const nodeCoords = {
            spring: { cx: 100, cy: 215 },
            summer: { cx: 180, cy: 90 },
            autumn: { cx: 260, cy: 215 },
            winter: { cx: 180, cy: 340 }
        };

        // 获取元素
        const els = {
            btnPrev: document.getElementById("scene2-btn-prev"),
            btnNext: document.getElementById("scene2-btn-next"),
            stepIndicator: document.getElementById("scene2-step-indicator"),
            glowOuter: document.getElementById("scene2-glow-outer"),
            glowInner: document.getElementById("scene2-glow-inner"),
            nodes: {
                spring: document.getElementById("scene2-node-spring"),
                summer: document.getElementById("scene2-node-summer"),
                autumn: document.getElementById("scene2-node-autumn"),
                winter: document.getElementById("scene2-node-winter")
            },
            trackHighlight: document.getElementById("scene2-track-highlight"),
            earthAxis: document.getElementById("scene2-earth-axis"),
            earthNight: document.getElementById("scene2-earth-night"),
            labelN: document.getElementById("scene2-label-n"),
            labelS: document.getElementById("scene2-label-s"),
            sunray: document.getElementById("scene2-sunray"),
            sunspot: document.getElementById("scene2-sunspot"),
            sunspotText: document.getElementById("scene2-sunspot-text"),
            infoStep0: document.getElementById("scene2-info-step0"),
            infoStep14: document.getElementById("scene2-info-step14"),
            infoStep5: document.getElementById("scene2-info-step5"),
            infoSolarTerm: document.getElementById("scene2-info-solar-term"),
            infoDate: document.getElementById("scene2-info-date"),
            infoNorthSeason: document.getElementById("scene2-info-north-season"),
            infoNorthNote: document.getElementById("scene2-info-north-note"),
            infoSouthSeason: document.getElementById("scene2-info-south-season"),
            infoSouthNote: document.getElementById("scene2-info-south-note")
        };

        function show(el) {
            if (el) { el.style.display = "block"; el.style.opacity = "1"; }
        }
        function hide(el) {
            if (el) { el.style.display = "none"; el.style.opacity = "0"; }
        }

        function setNodeHighlight(nodeName) {
            // 重置所有节点
            Object.keys(els.nodes).forEach(key => {
                els.nodes[key].setAttribute("fill", "#1565c0");
                els.nodes[key].setAttribute("r", "4");
            });
            // 高亮指定节点
            if (nodeName && els.nodes[nodeName]) {
                els.nodes[nodeName].setAttribute("fill", "#c62828");
                els.nodes[nodeName].setAttribute("r", "6");
                const coords = nodeCoords[nodeName];
                els.glowOuter.setAttribute("cx", coords.cx);
                els.glowOuter.setAttribute("cy", coords.cy);
                els.glowInner.setAttribute("cx", coords.cx);
                els.glowInner.setAttribute("cy", coords.cy);
                els.glowOuter.style.opacity = "0.3";
                els.glowInner.style.opacity = "0.6";
            } else {
                els.glowOuter.style.opacity = "0";
                els.glowInner.style.opacity = "0";
            }
        }

        function setEarthConfig(configName) {
            const cfg = earthConfigs[configName];
            if (!cfg) return;
            els.earthAxis.setAttribute("x1", cfg.axis.x1);
            els.earthAxis.setAttribute("y1", cfg.axis.y1);
            els.earthAxis.setAttribute("x2", cfg.axis.x2);
            els.earthAxis.setAttribute("y2", cfg.axis.y2);
            els.labelN.setAttribute("x", cfg.nPos.x);
            els.labelN.setAttribute("y", cfg.nPos.y);
            els.labelS.setAttribute("x", cfg.sPos.x);
            els.labelS.setAttribute("y", cfg.sPos.y);
            els.earthNight.setAttribute("d", cfg.nightPath);
            els.sunray.setAttribute("y1", cfg.sunrayY);
            els.sunray.setAttribute("y2", cfg.sunrayY);
            els.sunspot.setAttribute("cy", cfg.sunrayY);
            els.sunspotText.setAttribute("y", cfg.sunrayY - 15);
        }

        function renderStep() {
            // 更新按钮状态
            els.btnPrev.disabled = currentStep === 0;
            els.btnNext.disabled = currentStep === totalSteps;
            els.stepIndicator.textContent = "步骤 " + currentStep + "/" + totalSteps;

            // 隐藏所有信息面板
            hide(els.infoStep0);
            hide(els.infoStep14);
            hide(els.infoStep5);

            // 隐藏地球动态元素（默认）
            hide(els.earthNight);
            hide(els.sunray);
            hide(els.sunspot);
            hide(els.sunspotText);
            els.trackHighlight.setAttribute("opacity", "0");

            if (currentStep === 0) {
                // 步骤0：全景
                show(els.infoStep0);
                setNodeHighlight(null);
                // 地球显示中性状态（春分/秋分）
                setEarthConfig("springAutumn");
            } else if (currentStep >= 1 && currentStep <= 4) {
                // 步骤1-4：节气详情
                show(els.infoStep14);
                const data = stepData[currentStep];
                els.infoSolarTerm.textContent = data.term;
                els.infoDate.textContent = data.date;
                els.infoNorthSeason.textContent = data.northSeason;
                els.infoNorthNote.textContent = data.northNote;
                els.infoSouthSeason.textContent = data.southSeason;
                els.infoSouthNote.textContent = data.southNote;
                setNodeHighlight(data.highlightNode);
                setEarthConfig(data.earthConfig);
                show(els.earthNight);
                show(els.sunray);
                show(els.sunspot);
                show(els.sunspotText);
            } else if (currentStep === 5) {
                // 步骤5：季节过渡与对比
                show(els.infoStep5);
                // 高亮春分+夏至节点
                setNodeHighlight(null);
                els.nodes.spring.setAttribute("fill", "#c62828");
                els.nodes.spring.setAttribute("r", "6");
                els.nodes.summer.setAttribute("fill", "#c62828");
                els.nodes.summer.setAttribute("r", "6");
                // 显示轨迹段高亮
                els.trackHighlight.setAttribute("opacity", "1");
                // 地球显示夏至状态
                setEarthConfig("summer");
                show(els.earthNight);
                show(els.sunray);
                show(els.sunspot);
                show(els.sunspotText);
            }
        }

        // 事件绑定
        els.btnPrev.addEventListener("click", function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        });
        els.btnNext.addEventListener("click", function() {
            if (currentStep < totalSteps) {
                currentStep++;
                renderStep();
            }
        });

        // 初始渲染
        renderStep();
    })();
    </script>
</body>
</html>
