<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scene 1 - 经纬网结构与地理坐标读取</title>
<style>
body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
#scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
#scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
.scene1-btn { padding: 6px 16px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; font-family: inherit; transition: opacity 0.2s ease; }
.scene1-btn:disabled { opacity: 0.4; cursor: not-allowed; }
#scene1-btn-prev { background: #f0f0f0; color: #333; }
#scene1-btn-next { background: #1565c0; color: #fff; border-color: #1565c0; }
#scene1-step-indicator { font-size: 14px; color: #333; min-width: 80px; text-align: center; user-select: none; }
.scene1-hidden { display: none; }
.scene1-visible { display: inline; }
</style>
</head>
<body>
<div id="scene1-container">
<svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
<line id="scene1-lon-120e" x1="140" y1="120" x2="140" y2="400" stroke="#000000" stroke-width="0.8" />
<line id="scene1-lon-140e" x1="236" y1="120" x2="236" y2="400" stroke="#000000" stroke-width="0.8" />
<line id="scene1-lon-160e" x1="332" y1="120" x2="332" y2="400" stroke="#000000" stroke-width="0.8" />
<line id="scene1-lon-180"  x1="428" y1="120" x2="428" y2="400" stroke="#000000" stroke-width="0.8" />
<line id="scene1-lon-160w" x1="524" y1="120" x2="524" y2="400" stroke="#000000" stroke-width="0.8" />
<line id="scene1-lon-140w" x1="620" y1="120" x2="620" y2="400" stroke="#000000" stroke-width="0.8" />
<line id="scene1-lat-80n" x1="140" y1="120" x2="620" y2="120" stroke="#000000" stroke-width="0.8" />
<line id="scene1-lat-60n" x1="140" y1="176" x2="620" y2="176" stroke="#000000" stroke-width="0.8" />
<line id="scene1-lat-40n" x1="140" y1="232" x2="620" y2="232" stroke="#000000" stroke-width="0.8" />
<line id="scene1-lat-20n" x1="140" y1="288" x2="620" y2="288" stroke="#000000" stroke-width="0.8" />
<line id="scene1-lat-0"   x1="140" y1="344" x2="620" y2="344" stroke="#000000" stroke-width="0.8" />
<line id="scene1-lat-20s" x1="140" y1="400" x2="620" y2="400" stroke="#000000" stroke-width="0.8" />
<circle id="scene1-point-a" cx="236" cy="120" r="4" fill="#000000" />
<circle id="scene1-point-b" cx="620" cy="232" r="4" fill="#000000" />
<circle id="scene1-point-c" cx="236" cy="316" r="4" fill="#000000" />
<circle id="scene1-point-d" cx="620" cy="400" r="4" fill="#000000" />
<circle id="scene1-point-a-hl" cx="236" cy="120" r="7" fill="none" stroke="#1565c0" stroke-width="2.5" class="scene1-hidden" />
<circle id="scene1-point-b-hl" cx="620" cy="232" r="7" fill="none" stroke="#c62828" stroke-width="2.5" class="scene1-hidden" />
<circle id="scene1-point-c-hl" cx="236" cy="316" r="7" fill="none" stroke="#1565c0" stroke-width="2.5" class="scene1-hidden" />
<circle id="scene1-point-d-hl" cx="620" cy="400" r="7" fill="none" stroke="#c62828" stroke-width="2.5" class="scene1-hidden" />
<text id="scene1-label-a" x="275" y="106" font-size="14" fill="#000000" font-weight="bold">A</text>
<text id="scene1-label-b" x="605" y="216" font-size="14" fill="#000000" font-weight="bold">B</text>
<text id="scene1-label-c" x="252" y="298" font-size="14" fill="#000000" font-weight="bold">C</text>
<text id="scene1-label-d" x="590" y="368" font-size="14" fill="#000000" font-weight="bold">D</text>
<text id="scene1-label-lon-120e" x="140" y="96" font-size="11" fill="#1565c0" text-anchor="middle" class="scene1-hidden">120°E</text>
<text id="scene1-label-lon-140e" x="236" y="96" font-size="11" fill="#1565c0" text-anchor="middle" class="scene1-hidden">140°E</text>
<text id="scene1-label-lon-160e" x="332" y="96" font-size="11" fill="#1565c0" text-anchor="middle" class="scene1-hidden">160°E</text>
<text id="scene1-label-lon-180"  x="428" y="96" font-size="11" fill="#c62828" text-anchor="middle" class="scene1-hidden">180°</text>
<text id="scene1-label-lon-160w" x="524" y="96" font-size="11" fill="#c62828" text-anchor="middle" class="scene1-hidden">160°W</text>
<text id="scene1-label-lon-140w" x="620" y="96" font-size="11" fill="#c62828" text-anchor="middle" class="scene1-hidden">140°W</text>
<text id="scene1-label-lat-80n" x="128" y="125" font-size="11" fill="#c62828" text-anchor="end" class="scene1-hidden">80°</text>
<text id="scene1-label-lat-60n" x="128" y="181" font-size="11" fill="#c62828" text-anchor="end" class="scene1-hidden">60°</text>
<text id="scene1-label-lat-40n" x="128" y="237" font-size="11" fill="#c62828" text-anchor="end" class="scene1-hidden">40°</text>
<text id="scene1-label-lat-20n" x="128" y="293" font-size="11" fill="#c62828" text-anchor="end" class="scene1-hidden">20°</text>
<text id="scene1-label-lat-0"   x="128" y="349" font-size="11" fill="#2e7d32" text-anchor="end" class="scene1-hidden">0°</text>
<text id="scene1-label-lat-20s" x="128" y="405" font-size="11" fill="#2e7d32" text-anchor="end" class="scene1-hidden">20°S</text>
<text id="scene1-text-east" x="175" y="62" font-size="9" fill="#1565c0" class="scene1-hidden">→ 向东递增为东经</text>
<text id="scene1-text-west" x="500" y="62" font-size="9" fill="#c62828" text-anchor="end" class="scene1-hidden">180°以东为西经</text>
<text id="scene1-text-north" x="22" y="95" font-size="10" fill="#c62828" class="scene1-hidden">向北递增 ↑ 北纬</text>
<text id="scene1-text-south" x="22" y="440" font-size="10" fill="#2e7d32" class="scene1-hidden">向南递增 ↓ 南纬</text>
<line id="scene1-line-a" x1="236" y1="120" x2="300" y2="140" stroke="#888888" stroke-width="1" stroke-dasharray="4,3" class="scene1-hidden" />
<foreignObject id="scene1-box-a" x="300" y="128" width="140" height="24" class="scene1-hidden"><div xmlns="http://www.w3.org/1999/xhtml" style="background:#fff; border:1px solid #333; border-radius:2px; text-align:center; font-size:13px; line-height:22px; font-family:sans-serif; white-space:nowrap;">A(140°E, 80°N)</div></foreignObject>
<line id="scene1-line-b" x1="620" y1="232" x2="460" y2="245" stroke="#888888" stroke-width="1" stroke-dasharray="4,3" class="scene1-hidden" />
<foreignObject id="scene1-box-b" x="460" y="233" width="140" height="24" class="scene1-hidden"><div xmlns="http://www.w3.org/1999/xhtml" style="background:#fff; border:1px solid #333; border-radius:2px; text-align:center; font-size:13px; line-height:22px; font-family:sans-serif; white-space:nowrap;">B(140°W, 40°N)</div></foreignObject>
<line id="scene1-line-c" x1="236" y1="316" x2="260" y2="350" stroke="#888888" stroke-width="1" stroke-dasharray="4,3" class="scene1-hidden" />
<foreignObject id="scene1-box-c" x="260" y="338" width="140" height="24" class="scene1-hidden"><div xmlns="http://www.w3.org/1999/xhtml" style="background:#fff; border:1px solid #333; border-radius:2px; text-align:center; font-size:13px; line-height:22px; font-family:sans-serif; white-space:nowrap;">C(140°E, 10°N)</div></foreignObject>
<line id="scene1-line-d" x1="620" y1="400" x2="460" y2="382" stroke="#888888" stroke-width="1" stroke-dasharray="4,3" class="scene1-hidden" />
<foreignObject id="scene1-box-d" x="430" y="370" width="140" height="24" class="scene1-hidden"><div xmlns="http://www.w3.org/1999/xhtml" style="background:#fff; border:1px solid #333; border-radius:2px; text-align:center; font-size:13px; line-height:22px; font-family:sans-serif; white-space:nowrap;">D(140°W, 20°S)</div></foreignObject>
<foreignObject id="scene1-summary-table" x="640" y="160" width="140" height="160" class="scene1-hidden">
<table xmlns="http://www.w3.org/1999/xhtml" style="width:100%; height:100%; border-collapse:collapse; font-size:12px; font-family:sans-serif; background:#f5f5f5; border:1px solid #333; text-align:center;">
<tr style="font-weight:bold;"><td style="border:1px solid #333; width:35%; height:32px;">点</td><td style="border:1px solid #333; width:32%; height:32px;">经度</td><td style="border:1px solid #333; width:33%; height:32px;">纬度</td></tr>
<tr><td style="border:1px solid #333; height:32px;">A</td><td style="border:1px solid #333; height:32px;">140°E</td><td style="border:1px solid #333; height:32px;">80°N</td></tr>
<tr><td style="border:1px solid #333; height:32px;">B</td><td style="border:1px solid #333; height:32px;">140°W</td><td style="border:1px solid #333; height:32px;">40°N</td></tr>
<tr><td style="border:1px solid #333; height:32px;">C</td><td style="border:1px solid #333; height:32px;">140°E</td><td style="border:1px solid #333; height:32px;">10°N</td></tr>
<tr><td style="border:1px solid #333; height:32px;">D</td><td style="border:1px solid #333; height:32px;">140°W</td><td style="border:1px solid #333; height:32px;">20°S</td></tr>
</table>
</foreignObject>
<text id="scene1-step-hint" x="400" y="36" font-size="14" fill="#000000" text-anchor="middle" font-weight="bold">经纬网结构 — 观察网格与点的分布</text>
</svg>
<div id="scene1-controls">
<button id="scene1-btn-prev" class="scene1-btn" disabled>◀ 上一步</button>
<div id="scene1-step-indicator">步骤 0/7</div>
<button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
</div>
</div>
<script>
(function() {
var currentStep = 0;
var totalSteps = 7;
var stepHints = [
"经纬网结构 — 观察网格与点的分布",
"经度判读 — 向东递增为东经，180°以东为西经",
"纬度判读 — 向北递增为北纬，向南递增为南纬",
"A点坐标 — 140°E, 80°N",
"B点坐标 — 140°W, 40°N",
"C点坐标 — 140°E, 10°N",
"D点坐标 — 140°W, 20°S",
"坐标汇总 — 四点完整坐标对照"
];
var stepConfig = [
{ show: [], highlightLines: [], highlightPoints: [] },
{
show: [
'scene1-label-lon-120e','scene1-label-lon-140e','scene1-label-lon-160e',
'scene1-label-lon-180','scene1-label-lon-160w','scene1-label-lon-140w',
'scene1-text-east','scene1-text-west'
],
highlightLines: ['scene1-lon-120e','scene1-lon-140e','scene1-lon-160e','scene1-lon-180','scene1-lon-160w','scene1-lon-140w'],
highlightPoints: []
},
{
show: [
'scene1-label-lon-120e','scene1-label-lon-140e','scene1-label-lon-160e',
'scene1-label-lon-180','scene1-label-lon-160w','scene1-label-lon-140w',
'scene1-label-lat-80n','scene1-label-lat-60n','scene1-label-lat-40n',
'scene1-label-lat-20n','scene1-label-lat-0','scene1-label-lat-20s',
'scene1-text-north','scene1-text-south'
],
highlightLines: ['scene1-lat-80n','scene1-lat-60n','scene1-lat-40n','scene1-lat-20n','scene1-lat-0','scene1-lat-20s'],
highlightPoints: []
},
{ show: ['scene1-line-a','scene1-box-a'], highlightLines: ['scene1-lon-140e','scene1-lat-80n'], highlightPoints: ['scene1-point-a-hl'] },
{ show: ['scene1-line-b','scene1-box-b'], highlightLines: ['scene1-lon-140w','scene1-lat-40n'], highlightPoints: ['scene1-point-b-hl'] },
{ show: ['scene1-line-c','scene1-box-c'], highlightLines: ['scene1-lon-140e'], highlightPoints: ['scene1-point-c-hl'] },
{ show: ['scene1-line-d','scene1-box-d'], highlightLines: ['scene1-lon-140w','scene1-lat-20s'], highlightPoints: ['scene1-point-d-hl'] },
{
show: ['scene1-line-a','scene1-box-a','scene1-line-b','scene1-box-b','scene1-line-c','scene1-box-c','scene1-line-d','scene1-box-d','scene1-summary-table'],
highlightLines: [],
highlightPoints: ['scene1-point-a-hl','scene1-point-b-hl','scene1-point-c-hl','scene1-point-d-hl']
}
];
var lineHighlightColors = {
'scene1-lon-120e': '#1565c0', 'scene1-lon-140e': '#1565c0', 'scene1-lon-160e': '#1565c0',
'scene1-lon-180': '#c62828', 'scene1-lon-160w': '#c62828', 'scene1-lon-140w': '#c62828',
'scene1-lat-80n': '#c62828', 'scene1-lat-60n': '#c62828', 'scene1-lat-40n': '#c62828',
'scene1-lat-20n': '#c62828', 'scene1-lat-0': '#2e7d32', 'scene1-lat-20s': '#2e7d32'
};
function getEl(id) { return document.getElementById(id); }
function showEl(id) { var el = getEl(id); if (el) { el.classList.remove('scene1-hidden'); el.classList.add('scene1-visible'); } }
function hideEl(id) { var el = getEl(id); if (el) { el.classList.remove('scene1-visible'); el.classList.add('scene1-hidden'); } }
function resetLineStyle(id) { var el = getEl(id); if (el) { el.setAttribute('stroke', '#000000'); el.setAttribute('stroke-width', '0.8'); } }
function highlightLine(id) { var el = getEl(id); if (el) { var color = lineHighlightColors[id] || '#000000'; var width = (id === 'scene1-lat-0') ? '3' : '2'; el.setAttribute('stroke', color); el.setAttribute('stroke-width', width); } }
function renderStep(step) {
getEl('scene1-step-hint').textContent = stepHints[step];
getEl('scene1-step-indicator').textContent = '步骤 ' + step + '/' + totalSteps;
getEl('scene1-btn-prev').disabled = (step === 0);
getEl('scene1-btn-next').disabled = (step === totalSteps);
var allOptional = [
'scene1-label-lon-120e','scene1-label-lon-140e','scene1-label-lon-160e',
'scene1-label-lon-180','scene1-label-lon-160w','scene1-label-lon-140w',
'scene1-label-lat-80n','scene1-label-lat-60n','scene1-label-lat-40n',
'scene1-label-lat-20n','scene1-label-lat-0','scene1-label-lat-20s',
'scene1-text-east','scene1-text-west','scene1-text-north','scene1-text-south',
'scene1-line-a','scene1-box-a','scene1-line-b','scene1-box-b',
'scene1-line-c','scene1-box-c','scene1-line-d','scene1-box-d',
'scene1-summary-table',
'scene1-point-a-hl','scene1-point-b-hl','scene1-point-c-hl','scene1-point-d-hl'
];
allOptional.forEach(hideEl);
var allLines = [
'scene1-lon-120e','scene1-lon-140e','scene1-lon-160e','scene1-lon-180','scene1-lon-160w','scene1-lon-140w',
'scene1-lat-80n','scene1-lat-60n','scene1-lat-40n','scene1-lat-20n','scene1-lat-0','scene1-lat-20s'
];
allLines.forEach(resetLineStyle);
var cfg = stepConfig[step];
if (cfg) {
cfg.show.forEach(showEl);
cfg.highlightLines.forEach(highlightLine);
cfg.highlightPoints.forEach(showEl);
}
}
getEl('scene1-btn-prev').addEventListener('click', function() { if (currentStep > 0) { currentStep--; renderStep(currentStep); } });
getEl('scene1-btn-next').addEventListener('click', function() { if (currentStep < totalSteps) { currentStep++; renderStep(currentStep); } });
renderStep(0);
})();
</script>
</body>
</html>
