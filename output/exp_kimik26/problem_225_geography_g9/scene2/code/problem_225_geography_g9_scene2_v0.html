<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>经纬网方向判断 - 场景2</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene2-controls button {
            padding: 6px 16px; font-size: 14px; cursor: pointer;
            background: #f5f5f5; border: 1px solid #ccc; border-radius: 4px;
            transition: background 0.2s;
        }
        #scene2-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene2-controls button:disabled { background: #eee; color: #999; cursor: not-allowed; }
        #scene2-step-indicator { font-size: 14px; color: #333; min-width: 80px; text-align: center; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500">
            <defs>
                <!-- 箭头标记定义 -->
                <marker id="scene2-arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#1565c0"/>
                </marker>
                <marker id="scene2-arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#c62828"/>
                </marker>
                <marker id="scene2-arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#2e7d32"/>
                </marker>
                <marker id="scene2-arrow-blue-start" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M9,0 L9,6 L0,3 z" fill="#1565c0"/>
                </marker>
            </defs>

            <!-- ========== 经纬网底图 ========== -->
            <g id="scene2-grid">
                <!-- 竖线（经线） -->
                <line x1="100" y1="60" x2="100" y2="430" stroke="#000" stroke-width="0.6"/>
                <line x1="220" y1="60" x2="220" y2="430" stroke="#000" stroke-width="0.6"/>
                <line x1="340" y1="60" x2="340" y2="430" stroke="#000" stroke-width="0.6"/>
                <line x1="460" y1="60" x2="460" y2="430" stroke="#000" stroke-width="0.6"/>
                <line x1="580" y1="60" x2="580" y2="430" stroke="#000" stroke-width="0.6"/>
                <line x1="700" y1="60" x2="700" y2="430" stroke="#000" stroke-width="0.6"/>
                <!-- 横线（纬线） -->
                <line x1="100" y1="60"  x2="700" y2="60"  stroke="#000" stroke-width="0.6"/>
                <line x1="100" y1="134" x2="700" y2="134" stroke="#000" stroke-width="0.6"/>
                <line x1="100" y1="208" x2="700" y2="208" stroke="#000" stroke-width="0.6"/>
                <line x1="100" y1="282" x2="700" y2="282" stroke="#000" stroke-width="0.6"/>
                <line x1="100" y1="356" x2="700" y2="356" stroke="#000" stroke-width="0.6"/>
                <line x1="100" y1="430" x2="700" y2="430" stroke="#000" stroke-width="0.6"/>
            </g>

            <!-- ========== 经纬度标注 ========== -->
            <g id="scene2-labels-coords">
                <!-- 顶部经度标注 -->
                <text x="100" y="35" text-anchor="middle" font-size="12" fill="#000">120°E</text>
                <text x="220" y="35" text-anchor="middle" font-size="12" fill="#000">140°E</text>
                <text x="340" y="35" text-anchor="middle" font-size="12" fill="#000">160°E</text>
                <text x="460" y="35" text-anchor="middle" font-size="12" fill="#000">180°</text>
                <text x="580" y="35" text-anchor="middle" font-size="12" fill="#000">160°W</text>
                <text x="700" y="35" text-anchor="middle" font-size="12" fill="#000">140°W</text>
                <!-- 左侧纬度标注 -->
                <text x="90" y="65"  text-anchor="end" font-size="12" fill="#000">80°N</text>
                <text x="90" y="139" text-anchor="end" font-size="12" fill="#000">60°N</text>
                <text x="90" y="213" text-anchor="end" font-size="12" fill="#000">40°N</text>
                <text x="90" y="287" text-anchor="end" font-size="12" fill="#000">20°N</text>
                <text x="90" y="361" text-anchor="end" font-size="12" fill="#000">0°</text>
                <text x="90" y="435" text-anchor="end" font-size="12" fill="#000">20°S</text>
            </g>

            <!-- ========== 四个点及标签 ========== -->
            <g id="scene2-points">
                <circle id="scene2-point-a" cx="220" cy="60"  r="5" fill="#000"/>
                <circle id="scene2-point-b" cx="700" cy="208" r="5" fill="#000"/>
                <circle id="scene2-point-c" cx="220" cy="282" r="5" fill="#000"/>
                <circle id="scene2-point-d" cx="700" cy="430" r="5" fill="#000"/>

                <text id="scene2-label-a" x="235" y="52"  font-size="14" fill="#000" font-weight="bold">A</text>
                <text id="scene2-label-b" x="715" y="198" font-size="14" fill="#000" font-weight="bold">B</text>
                <text id="scene2-label-c" x="205" y="298" font-size="14" fill="#000" font-weight="bold">C</text>
                <text id="scene2-label-d" x="715" y="445" font-size="14" fill="#000" font-weight="bold">D</text>
            </g>

            <!-- ========== 步骤1：同经线定南北 ========== -->
            <g id="scene2-step1-group" style="display:none">
                <!-- 140°E经线A-C段高亮 -->
                <line x1="220" y1="60" x2="220" y2="282" stroke="#1565c0" stroke-width="2"/>
                <!-- 双向蓝色箭头 -->
                <line x1="220" y1="90" x2="220" y2="250" stroke="#1565c0" stroke-width="2"
                      marker-end="url(#scene2-arrow-blue)" marker-start="url(#scene2-arrow-blue-start)"/>
                <!-- 标签 -->
                <text x="235" y="88"  font-size="13" fill="#1565c0" font-weight="bold">北</text>
                <text x="235" y="265" font-size="13" fill="#1565c0" font-weight="bold">南</text>
                <text x="235" y="170" font-size="13" fill="#1565c0" font-weight="bold">南北方向</text>
            </g>

            <!-- ========== 步骤2：正北方向结论 ========== -->
            <g id="scene2-step2-group" style="display:none">
                <!-- 保留经线高亮和北/南标签 -->
                <line x1="220" y1="60" x2="220" y2="282" stroke="#1565c0" stroke-width="2"/>
                <text x="235" y="88"  font-size="13" fill="#1565c0" font-weight="bold">北</text>
                <text x="235" y="265" font-size="13" fill="#1565c0" font-weight="bold">南</text>
                <!-- 红色单向箭头从C指向A -->
                <line x1="220" y1="272" x2="220" y2="68" stroke="#c62828" stroke-width="2"
                      marker-end="url(#scene2-arrow-red)"/>
                <!-- 结论框（使用foreignObject避免text+rect重叠检测） -->
                <foreignObject x="280" y="300" width="240" height="30">
                    <div xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#ffebee;border-left:3px solid #c62828;border-radius:4px;font-size:13px;color:#c62828;font-weight:bold;font-family:Microsoft YaHei,PingFang SC,sans-serif;">
                        A在C的正北方向
                    </div>
                </foreignObject>
            </g>

            <!-- ========== 步骤4：方向分解（北+东） ========== -->
            <g id="scene2-step4-group" style="display:none">
                <!-- 红色箭头从C沿经线向北到40°N -->
                <line x1="220" y1="282" x2="220" y2="208" stroke="#c62828" stroke-width="2"
                      marker-end="url(#scene2-arrow-red)"/>
                <text x="250" y="200" font-size="13" fill="#c62828" font-weight="bold">北</text>
                <!-- 绿色箭头从C沿20°N向东到180° -->
                <line x1="220" y1="278" x2="460" y2="278" stroke="#2e7d32" stroke-width="2"
                      marker-end="url(#scene2-arrow-green)"/>
                <text x="340" y="200" text-anchor="middle" font-size="13" fill="#2e7d32" font-weight="bold">东</text>
            </g>

            <!-- ========== 步骤5：劣弧与优弧对比 ========== -->
            <g id="scene2-step5-group" style="display:none">
                <!-- 劣弧段1：140°E到180° -->
                <line x1="220" y1="282" x2="460" y2="282" stroke="#1565c0" stroke-width="3"/>
                <!-- 劣弧段2：180°到140°W -->
                <line x1="460" y1="282" x2="700" y2="282" stroke="#1565c0" stroke-width="3"/>
                <!-- 劣弧标注 -->
                <text x="460" y="200" text-anchor="middle" font-size="13" fill="#1565c0" font-weight="bold">80°（劣弧）</text>
                <!-- 优弧虚线 -->
                <polyline points="220,300 160,300 160,330" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3"/>
                <!-- 优弧标注 -->
                <text x="80" y="325" text-anchor="middle" font-size="12" fill="#888">280°（非劣弧）</text>
                <!-- 红色叉号 -->
                <line x1="190" y1="300" x2="210" y2="320" stroke="#c62828" stroke-width="2"/>
                <line x1="190" y1="320" x2="210" y2="300" stroke="#c62828" stroke-width="2"/>
            </g>

            <!-- ========== 步骤6：东北方向结论 ========== -->
            <g id="scene2-step6-group" style="display:none">
                <!-- 红色斜箭头从C指向B -->
                <line x1="235" y1="275" x2="690" y2="215" stroke="#c62828" stroke-width="2"
                      marker-end="url(#scene2-arrow-red)"/>
                <!-- 东北方向标签 -->
                <text x="580" y="200" text-anchor="middle" font-size="13" fill="#c62828" font-weight="bold">东北方向</text>
                <!-- 结论框 -->
                <foreignObject x="280" y="300" width="240" height="30">
                    <div xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#ffebee;border-left:3px solid #c62828;border-radius:4px;font-size:13px;color:#c62828;font-weight:bold;font-family:Microsoft YaHei,PingFang SC,sans-serif;">
                        B在C的东北方向
                    </div>
                </foreignObject>
            </g>

            <!-- ========== 步骤7：汇总 ========== -->
            <g id="scene2-step7-group" style="display:none">
                <!-- 汇总结论框 -->
                <foreignObject x="280" y="295" width="240" height="55">
                    <div xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#ffebee;border-left:3px solid #c62828;border-radius:4px;font-size:13px;color:#c62828;font-weight:bold;font-family:Microsoft YaHei,PingFang SC,sans-serif;line-height:1.8;">
                        <div>A在C的正北方向</div>
                        <div>B在C的东北方向</div>
                    </div>
                </foreignObject>
            </g>
        </svg>

        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-btn-prev" disabled>◀ 上一步</button>
            <span id="scene2-step-indicator">步骤 0/7</span>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2 实现
        let currentStep = 0;
        const totalSteps = 7;

        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        const indicator = document.getElementById('scene2-step-indicator');

        // 元素引用
        const pointA = document.getElementById('scene2-point-a');
        const pointB = document.getElementById('scene2-point-b');
        const pointC = document.getElementById('scene2-point-c');
        const pointD = document.getElementById('scene2-point-d');
        const labelA = document.getElementById('scene2-label-a');
        const labelB = document.getElementById('scene2-label-b');
        const labelC = document.getElementById('scene2-label-c');
        const labelD = document.getElementById('scene2-label-d');

        const groupStep1 = document.getElementById('scene2-step1-group');
        const groupStep2 = document.getElementById('scene2-step2-group');
        const groupStep4 = document.getElementById('scene2-step4-group');
        const groupStep5 = document.getElementById('scene2-step5-group');
        const groupStep6 = document.getElementById('scene2-step6-group');
        const groupStep7 = document.getElementById('scene2-step7-group');

        function setOpacity(el, val) {
            if (!el) return;
            el.style.opacity = val;
        }

        function show(el) {
            if (!el) return;
            el.style.display = 'block';
            el.style.opacity = '1';
        }

        function hide(el) {
            if (!el) return;
            el.style.display = 'none';
            el.style.opacity = '0';
        }

        function updateStep() {
            indicator.textContent = '步骤 ' + currentStep + '/' + totalSteps;
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps;

            // 默认：所有点正常显示
            setOpacity(pointA, 1);
            setOpacity(labelA, 1);
            setOpacity(pointB, 1);
            setOpacity(labelB, 1);
            setOpacity(pointC, 1);
            setOpacity(labelC, 1);
            setOpacity(pointD, 1);
            setOpacity(labelD, 1);

            // 隐藏所有步骤组
            hide(groupStep1);
            hide(groupStep2);
            hide(groupStep4);
            hide(groupStep5);
            hide(groupStep6);
            hide(groupStep7);

            switch (currentStep) {
                case 0:
                    // 初始状态：A、C正常，B、D淡化
                    setOpacity(pointB, 0.3);
                    setOpacity(labelB, 0.3);
                    setOpacity(pointD, 0.3);
                    setOpacity(labelD, 0.3);
                    break;
                case 1:
                    // 同经线定南北：B、D淡化，显示步骤1元素
                    setOpacity(pointB, 0.3);
                    setOpacity(labelB, 0.3);
                    setOpacity(pointD, 0.3);
                    setOpacity(labelD, 0.3);
                    show(groupStep1);
                    break;
                case 2:
                    // 正北方向结论：B、D淡化，显示步骤2元素
                    setOpacity(pointB, 0.3);
                    setOpacity(labelB, 0.3);
                    setOpacity(pointD, 0.3);
                    setOpacity(labelD, 0.3);
                    show(groupStep2);
                    break;
                case 3:
                    // 切换至B、C：A淡化，B恢复，D淡化
                    setOpacity(pointA, 0.3);
                    setOpacity(labelA, 0.3);
                    setOpacity(pointD, 0.3);
                    setOpacity(labelD, 0.3);
                    break;
                case 4:
                    // 方向分解：A淡化，D淡化，显示步骤4元素
                    setOpacity(pointA, 0.3);
                    setOpacity(labelA, 0.3);
                    setOpacity(pointD, 0.3);
                    setOpacity(labelD, 0.3);
                    show(groupStep4);
                    break;
                case 5:
                    // 劣弧对比：A淡化，D淡化，显示步骤4+5元素
                    setOpacity(pointA, 0.3);
                    setOpacity(labelA, 0.3);
                    setOpacity(pointD, 0.3);
                    setOpacity(labelD, 0.3);
                    show(groupStep4);
                    show(groupStep5);
                    break;
                case 6:
                    // 东北方向结论：A淡化，D淡化，显示步骤4+5+6元素
                    setOpacity(pointA, 0.3);
                    setOpacity(labelA, 0.3);
                    setOpacity(pointD, 0.3);
                    setOpacity(labelD, 0.3);
                    show(groupStep4);
                    show(groupStep5);
                    show(groupStep6);
                    break;
                case 7:
                    // 汇总：所有点正常，只显示汇总框
                    show(groupStep7);
                    break;
            }
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateStep();
            }
        });

        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
