<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 1 - 晨昏线光照图</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: Arial, "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-btn-prev, #scene1-btn-next {
            padding: 6px 16px; font-size: 14px; border: none; border-radius: 4px;
            background: #1565c0; color: #fff; cursor: pointer; transition: opacity 0.2s;
        }
        #scene1-btn-prev:disabled, #scene1-btn-next:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene1-step-title { font-size: 14px; color: #333; min-width: 180px; text-align: center; }
        .scene1-step-group { transition: opacity 0.3s ease-in-out; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <defs>
                <pattern id="scene1-hatch" patternUnits="userSpaceOnUse" width="8" height="8">
                    <path d="M0,8 L8,0" stroke="#1565c0" stroke-width="1"/>
                </pattern>
                <marker id="arrowhead-right" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#888"/>
                </marker>
                <marker id="arrowhead-left" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
                    <polygon points="10 0, 0 3.5, 10 7" fill="#888"/>
                </marker>
            </defs>

            <!-- ========== 步骤0：原图基础条件（始终显示） ========== -->
            <g id="scene1-grid">
                <!-- 网格边框由4条已有线段构成 -->
                <line x1="120" y1="80" x2="620" y2="80" stroke="#000" stroke-width="1"/>
                <line x1="120" y1="181" x2="620" y2="181" stroke="#000" stroke-width="1" stroke-dasharray="4,4"/>
                <line x1="120" y1="380" x2="620" y2="380" stroke="#000" stroke-width="1"/>
                <line x1="120" y1="80" x2="120" y2="380" stroke="#000" stroke-width="1"/>
                <line x1="220" y1="80" x2="220" y2="380" stroke="#000" stroke-width="1"/>
                <line x1="320" y1="80" x2="320" y2="380" stroke="#000" stroke-width="1"/>
                <line x1="420" y1="80" x2="420" y2="380" stroke="#000" stroke-width="1"/>
                <line x1="520" y1="80" x2="520" y2="380" stroke="#000" stroke-width="1"/>
                <line x1="620" y1="80" x2="620" y2="380" stroke="#000" stroke-width="1"/>
            </g>

            <rect id="scene1-shadow" x="120" y="80" width="200" height="300" fill="url(#scene1-hatch)" stroke="none" opacity="0.5"/>

            <line id="scene1-ao-line" x1="200" y1="181" x2="320" y2="380" stroke="#c62828" stroke-width="2" stroke-linecap="round"/>
            <line id="scene1-bo-line" x1="520" y1="80" x2="320" y2="380" stroke="#2e7d32" stroke-width="2" stroke-linecap="round"/>

            <circle id="scene1-point-a" cx="200" cy="181" r="4" fill="#000"/>
            <circle id="scene1-point-b" cx="520" cy="80" r="4" fill="#000"/>
            <circle id="scene1-point-o" cx="320" cy="380" r="4" fill="#000"/>

            <!-- 点标签：全部放在网格外侧，避免压线 -->
            <text id="scene1-label-a" x="100" y="181" font-size="14" fill="#000" font-weight="bold">A</text>
            <text id="scene1-label-b" x="535" y="58" font-size="14" fill="#000" font-weight="bold">B</text>
            <text id="scene1-label-o" x="360" y="415" font-size="14" fill="#000" font-weight="bold">O</text>

            <!-- 右侧纬度标签 -->
            <text id="scene1-lat-0" x="640" y="85" font-size="14" fill="#000">0°</text>
            <text id="scene1-lat-235" x="640" y="186" font-size="14" fill="#000">23.5°N</text>
            <text id="scene1-lat-70" x="640" y="385" font-size="14" fill="#000">70°N</text>

            <!-- ========== 步骤1：日期界线 ========== -->
            <g id="scene1-step1-group" class="scene1-step-group" style="display:none; opacity:0;">
                <rect x="120" y="80" width="200" height="300" fill="#1565c0" opacity="0.12"/>
                <line x1="120" y1="80" x2="120" y2="380" stroke="#c62828" stroke-width="2"/>
                <line x1="320" y1="80" x2="320" y2="380" stroke="#1565c0" stroke-width="2"/>
                <!-- 底部经度标签 -->
                <text x="120" y="420" font-size="12" fill="#000" text-anchor="middle">180°</text>
                <text x="220" y="420" font-size="12" fill="#000" text-anchor="middle">135°W</text>
                <text x="320" y="420" font-size="12" fill="#000" text-anchor="middle">90°W</text>
                <text x="420" y="420" font-size="12" fill="#000" text-anchor="middle">45°W</text>
                <text x="520" y="420" font-size="12" fill="#000" text-anchor="middle">0°</text>
                <text x="620" y="420" font-size="12" fill="#000" text-anchor="middle">45°E</text>
                <!-- 日期界线标注，纵向间距30px以上 -->
                <text x="120" y="470" font-size="12" fill="#c62828" text-anchor="middle">180°经线</text>
                <text x="320" y="470" font-size="12" fill="#1565c0" text-anchor="middle">0时经线 90°W</text>
            </g>

            <!-- ========== 步骤2：地方时推算 ========== -->
            <g id="scene1-step2-group" class="scene1-step-group" style="display:none; opacity:0;">
                <!-- B点时间：放在B标签下方，间距充足 -->
                <text x="535" y="100" font-size="13" fill="#2e7d32" font-weight="bold">6:00</text>
                <!-- O点时间：放在O标签下方 -->
                <text x="290" y="435" font-size="13" fill="#1565c0" font-weight="bold" text-anchor="end">0:00</text>
                <!-- A点信息：放在网格左侧外部，间距25px -->
                <text x="20" y="195" font-size="12" fill="#000">日落约20:00</text>
                <text x="20" y="240" font-size="12" fill="#000">夜长约8h</text>
                <!-- 时间差辅助箭头（位于网格下方） -->
                <path d="M330,390 Q420,405 510,390" fill="none" stroke="#888" stroke-width="1" marker-end="url(#arrowhead-right)" marker-start="url(#arrowhead-left)"/>
                <text x="540" y="400" font-size="12" fill="#000">90°→6h</text>
            </g>

            <!-- ========== 步骤3：直射点定位 ========== -->
            <g id="scene1-step3-group" class="scene1-step-group" style="display:none; opacity:0;">
                <!-- 太阳符号（左上角，远离网格） -->
                <circle cx="70" cy="50" r="15" fill="#ff9800"/>
                <g stroke="#ff9800" stroke-width="2">
                    <line x1="70" y1="28" x2="70" y2="18"/>
                    <line x1="70" y1="72" x2="70" y2="82"/>
                    <line x1="48" y1="50" x2="38" y2="50"/>
                    <line x1="92" y1="50" x2="102" y2="50"/>
                    <line x1="54" y1="34" x2="46" y2="26"/>
                    <line x1="86" y1="34" x2="94" y2="26"/>
                    <line x1="54" y1="66" x2="46" y2="74"/>
                    <line x1="86" y1="66" x2="94" y2="74"/>
                </g>
                <!-- 直射点标签，纵向间距25px以上，避免与太阳圆重叠（圆底y=65） -->
                <text x="70" y="85" font-size="12" fill="#000" text-anchor="middle">太阳直射点</text>
                <text x="70" y="115" font-size="12" fill="#000" text-anchor="middle">90°E, 23.5°N</text>
                <text x="70" y="150" font-size="13" fill="#c62828" font-weight="bold" text-anchor="middle">夏至日</text>
                <!-- 从90°W引虚线到太阳 -->
                <line x1="320" y1="100" x2="65" y2="100" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
                <text x="190" y="60" font-size="11" fill="#888" text-anchor="middle">相对经线 12时</text>
            </g>

            <!-- ========== 步骤4：结论汇总 ========== -->
            <g id="scene1-step4-group" class="scene1-step-group" style="display:none; opacity:0;">
                <!-- 极昼区填充 -->
                <rect x="120" y="370" width="500" height="10" fill="#ffd700" opacity="0.3"/>
                <!-- 极昼区标签（左侧外部，远离填充区，间距25px） -->
                <text x="30" y="355" font-size="12" fill="#b8860b" font-weight="bold">极昼区</text>
                <text x="30" y="310" font-size="11" fill="#000">北极圈66.5°N以北</text>
                <!-- 结论汇总（右侧外部，行距25px，x=775避免裁切） -->
                <text x="775" y="110" font-size="14" fill="#000" font-weight="bold" text-anchor="end">结论汇总</text>
                <text x="775" y="140" font-size="11" fill="#000" text-anchor="end">① 夏至日</text>
                <text x="775" y="165" font-size="11" fill="#000" text-anchor="end">北极圈以北极昼</text>
                <text x="775" y="190" font-size="11" fill="#000" text-anchor="end">② B: 6:00</text>
                <text x="775" y="215" font-size="11" fill="#000" text-anchor="end">O: 0:00</text>
                <text x="775" y="240" font-size="11" fill="#000" text-anchor="end">③ A: ~150°W</text>
                <text x="775" y="265" font-size="11" fill="#000" text-anchor="end">夜长 ~8h</text>
                <text x="775" y="290" font-size="11" fill="#000" text-anchor="end">④ 90°E, 23.5°N</text>
                <text x="775" y="315" font-size="11" fill="#000" text-anchor="end">⑤ 47°</text>
            </g>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <span id="scene1-step-title">步骤 1/5：原图条件</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        var currentStep = 0;
        var totalSteps = 5;
        var stepTitles = [
            "步骤 1/5：原图条件",
            "步骤 2/5：日期界线",
            "步骤 3/5：地方时推算",
            "步骤 4/5：直射点定位",
            "步骤 5/5：结论汇总"
        ];

        var btnPrev = document.getElementById("scene1-btn-prev");
        var btnNext = document.getElementById("scene1-btn-next");
        var stepTitle = document.getElementById("scene1-step-title");

        var groupIds = [
            null,
            "scene1-step1-group",
            "scene1-step2-group",
            "scene1-step3-group",
            "scene1-step4-group"
        ];

        function setGroupOpacity(id, opacity) {
            var g = document.getElementById(id);
            if (!g) return;
            if (opacity === 1) {
                g.style.display = "block";
                requestAnimationFrame(function() {
                    g.style.opacity = "1";
                });
            } else {
                g.style.opacity = "0";
                setTimeout(function() {
                    g.style.display = "none";
                }, 300);
            }
        }

        function updateUI() {
            stepTitle.textContent = stepTitles[currentStep];
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps - 1;

            for (var i = 1; i < groupIds.length; i++) {
                setGroupOpacity(groupIds[i], i <= currentStep ? 1 : 0);
            }
        }

        btnPrev.addEventListener("click", function() {
            if (currentStep > 0) {
                currentStep--;
                updateUI();
            }
        });

        btnNext.addEventListener("click", function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateUI();
            }
        });

        updateUI();
    })();
    </script>
</body>
</html>
