<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 等效平衡与转化率</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene2-controls button {
            padding: 6px 16px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #f5f5f5;
            transition: background 0.2s;
        }
        #scene2-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene2-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene2-step-label { font-size: 14px; color: #333; min-width: 70px; text-align: center; }

        /* 步骤元素的淡入动画 */
        .scene2-step-element {
            opacity: 0;
            transition: opacity 0.4s ease-out;
        }
        .scene2-step-element.active {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene2-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#888888" />
                </marker>
                <marker id="scene2-arrowhead-start" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
                    <polygon points="10 0, 0 3.5, 10 7" fill="#888888" />
                </marker>
            </defs>

            <!-- ==================== 甲容器（左侧） ==================== -->
            <!-- 甲气体填充（红色） -->
            <path id="scene2-gas-jia" d="M 115,220 L 205,220 L 205,250 A 45,45 0 0,1 115,250 Z"
                  fill="#c62828" fill-opacity="0.2" stroke="none" />
            <!-- 甲容器轮廓 -->
            <path id="scene2-container-jia"
                  d="M 140,110 L 180,110 L 180,130 L 210,130 L 210,250 A 50,50 0 0,1 110,250 L 110,130 L 140,130 Z"
                  fill="none" stroke="#000000" stroke-width="2" />
            <!-- 甲初始标签 -->
            <text x="160" y="95" text-anchor="middle" font-size="16" fill="#c62828" font-weight="bold">
                <tspan>0.2 mol NO</tspan><tspan baseline-shift="sub" font-size="11">2</tspan>
            </text>
            <!-- 甲名称标签 -->
            <text x="160" y="320" text-anchor="middle" font-size="18" fill="#000000" font-weight="bold">甲</text>

            <!-- ==================== 丙容器（右侧） ==================== -->
            <!-- 丙气体填充（蓝色） -->
            <path id="scene2-gas-bing" d="M 595,220 L 685,220 L 685,250 A 45,45 0 0,1 595,250 Z"
                  fill="#1565c0" fill-opacity="0.2" stroke="none" />
            <!-- 丙容器轮廓 -->
            <path id="scene2-container-bing"
                  d="M 620,110 L 660,110 L 660,130 L 690,130 L 690,250 A 50,50 0 0,1 590,250 L 590,130 L 620,130 Z"
                  fill="none" stroke="#000000" stroke-width="2" />
            <!-- 丙初始标签 -->
            <text x="640" y="95" text-anchor="middle" font-size="16" fill="#1565c0" font-weight="bold">
                <tspan>0.1 mol N</tspan><tspan baseline-shift="sub" font-size="11">2</tspan><tspan>O</tspan><tspan baseline-shift="sub" font-size="11">4</tspan>
            </text>
            <!-- 丙名称标签 -->
            <text x="640" y="320" text-anchor="middle" font-size="18" fill="#000000" font-weight="bold">丙</text>

            <!-- ==================== 步骤1：甲平衡式组 ==================== -->
            <g id="scene2-step1-group" class="scene2-step-element">
                <text x="230" y="130" text-anchor="start" font-size="15" fill="#c62828">
                    α（NO<tspan baseline-shift="sub" font-size="10">2</tspan>转化率）
                </text>
                <text x="230" y="170" text-anchor="start" font-size="15" fill="#c62828">
                    n(NO<tspan baseline-shift="sub" font-size="10">2</tspan>)=0.2(1−α)
                </text>
                <text x="230" y="210" text-anchor="start" font-size="15" fill="#1565c0">
                    n(N<tspan baseline-shift="sub" font-size="10">2</tspan>O<tspan baseline-shift="sub" font-size="10">4</tspan>)=0.1α
                </text>
            </g>

            <!-- ==================== 步骤2：丙平衡式组 ==================== -->
            <g id="scene2-step2-group" class="scene2-step-element">
                <text x="570" y="130" text-anchor="end" font-size="15" fill="#1565c0">
                    β（N<tspan baseline-shift="sub" font-size="10">2</tspan>O<tspan baseline-shift="sub" font-size="10">4</tspan>转化率）
                </text>
                <text x="570" y="170" text-anchor="end" font-size="15" fill="#1565c0">
                    n(N<tspan baseline-shift="sub" font-size="10">2</tspan>O<tspan baseline-shift="sub" font-size="10">4</tspan>)=0.1(1−β)
                </text>
                <text x="570" y="210" text-anchor="end" font-size="15" fill="#c62828">
                    n(NO<tspan baseline-shift="sub" font-size="10">2</tspan>)=0.2β
                </text>
            </g>

            <!-- ==================== 步骤3：中间推导区 ==================== -->
            <g id="scene2-step3-group" class="scene2-step-element">
                <!-- 等效平衡标题 -->
                <text x="400" y="232" text-anchor="middle" font-size="16" fill="#2e7d32" font-weight="bold">恒温恒容等效平衡</text>
                <!-- 双向箭头 -->
                <line x1="340" y1="255" x2="460" y2="255" stroke="#888888" stroke-width="1.5"
                      stroke-dasharray="4,2" marker-end="url(#scene2-arrowhead)" marker-start="url(#scene2-arrowhead-start)" />
                <!-- 一边倒标注 -->
                <text x="400" y="275" text-anchor="middle" font-size="14" fill="#000000">
                    一边倒：0.1 mol N<tspan baseline-shift="sub" font-size="10">2</tspan>O<tspan baseline-shift="sub" font-size="10">4</tspan> → 0.2 mol NO<tspan baseline-shift="sub" font-size="10">2</tspan>
                </text>
                <!-- 等式1 -->
                <text x="400" y="318" text-anchor="middle" font-size="15" fill="#000000">0.2(1−α) = 0.2β</text>
                <!-- 等式2 -->
                <text x="400" y="355" text-anchor="middle" font-size="15" fill="#000000">0.1α = 0.1(1−β)</text>
                <!-- 推导结论 -->
                <text x="400" y="392" text-anchor="middle" font-size="18" fill="#2e7d32" font-weight="bold">α + β = 1</text>
            </g>

            <!-- ==================== 步骤4：结论高亮 ==================== -->
            <g id="scene2-step4-group" class="scene2-step-element">
                <text x="400" y="432" text-anchor="middle" font-size="16" fill="#2e7d32" font-weight="bold">
                    α=β=0.5 时两者转化率相同，C 选项错误
                </text>
            </g>
        </svg>

        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-btn-prev">◀ 上一步</button>
            <span id="scene2-step-label">步骤 0/4</span>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2 实现
        let currentStep = 0;
        const totalSteps = 4;

        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        const stepLabel = document.getElementById('scene2-step-label');

        const stepGroups = [
            null, // 步骤0没有专门的组（基础元素始终显示）
            document.getElementById('scene2-step1-group'),
            document.getElementById('scene2-step2-group'),
            document.getElementById('scene2-step3-group'),
            document.getElementById('scene2-step4-group')
        ];

        function renderStep() {
            // 更新步骤标签
            stepLabel.textContent = '步骤 ' + currentStep + '/' + totalSteps;

            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps);
            if (currentStep === totalSteps) {
                btnNext.textContent = '完成';
            } else {
                btnNext.textContent = '下一步 ▶';
            }

            // 控制各步骤元素的显隐
            for (let i = 1; i <= totalSteps; i++) {
                const group = stepGroups[i];
                if (!group) continue;
                if (i <= currentStep) {
                    group.classList.add('active');
                    group.style.display = 'block';
                } else {
                    group.classList.remove('active');
                    group.style.display = 'none';
                }
            }
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                renderStep();
            }
        });

        // 初始渲染
        renderStep();
    })();
    </script>
</body>
</html>
