<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 测交实验验证分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 16px; z-index: 10; }
        #scene2-controls button {
            padding: 8px 20px; font-size: 14px; cursor: pointer;
            border: 1px solid #333; border-radius: 4px; background: #f5f5f5;
            transition: opacity 0.2s;
        }
        #scene2-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene2-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene2-step-indicator { font-size: 14px; color: #333; min-width: 40px; text-align: center; }
        .scene2-straight { fill: rgba(21,101,192,0.12); stroke: #1565c0; }
        .scene2-curly { fill: rgba(198,40,40,0.12); stroke: #c62828; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" viewBox="0 0 800 500" id="scene2-svg">
            <rect x="0" y="0" width="800" height="500" fill="#ffffff"/>

            <!-- ==================== 步骤标题 ==================== -->
            <text id="scene2-title" x="400" y="55" text-anchor="middle" font-size="17" font-weight="bold" fill="#000">题目测交方案 — 伴X隐性遗传</text>

            <!-- ==================== 步骤1：左栏伴X隐性遗传图解 ==================== -->
            <g id="scene2-step1-group">
                <!-- 假说标题 -->
                <text x="185" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#000">伴X隐性遗传假说</text>

                <!-- 亲本表现型 -->
                <text x="80" y="120" text-anchor="middle" font-size="13" fill="#000">F₁直刚毛♀果蝇</text>
                <text x="290" y="120" text-anchor="middle" font-size="13" fill="#000">F₂卷刚毛♂果蝇</text>

                <!-- 亲本基因型 -->

                <text x="185" y="147" text-anchor="middle" font-size="16" fill="#000">×</text>

                <!-- 配子标签 -->
                <text x="80" y="175" text-anchor="middle" font-size="13" fill="#555">配子</text>
                <text x="290" y="175" text-anchor="middle" font-size="13" fill="#555">配子</text>

                <!-- 配子 -->
                <text x="60" y="203" text-anchor="middle" font-size="14" fill="#1565c0" font-weight="bold">Xᴬ</text>
                <text x="100" y="203" text-anchor="middle" font-size="14" fill="#c62828" font-weight="bold">Xᵃ</text>
                <text x="270" y="203" text-anchor="middle" font-size="14" fill="#c62828" font-weight="bold">Xᵃ</text>
                <text x="310" y="203" text-anchor="middle" font-size="14" fill="#000" font-weight="bold">Y</text>

                <!-- 配子到子代虚线 -->
                <line x1="60" y1="210" x2="57" y2="255" stroke="#888" stroke-width="1" stroke-dasharray="4,2"/>
                <line x1="60" y1="210" x2="142" y2="255" stroke="#888" stroke-width="1" stroke-dasharray="4,2"/>
                <line x1="100" y1="210" x2="227" y2="255" stroke="#888" stroke-width="1" stroke-dasharray="4,2"/>
                <line x1="100" y1="210" x2="312" y2="255" stroke="#888" stroke-width="1" stroke-dasharray="4,2"/>
                <line x1="270" y1="210" x2="57" y2="255" stroke="#888" stroke-width="1" stroke-dasharray="4,2"/>
                <line x1="270" y1="210" x2="227" y2="255" stroke="#888" stroke-width="1" stroke-dasharray="4,2"/>
                <line x1="310" y1="210" x2="142" y2="255" stroke="#888" stroke-width="1" stroke-dasharray="4,2"/>
                <line x1="310" y1="210" x2="312" y2="255" stroke="#888" stroke-width="1" stroke-dasharray="4,2"/>

                <!-- 子代基因型（框上方） -->
                <text x="57" y="245" text-anchor="middle" font-size="13" fill="#000">XᴬXᵃ</text>
                <text x="142" y="245" text-anchor="middle" font-size="13" fill="#000">XᴬY</text>
                <text x="227" y="245" text-anchor="middle" font-size="13" fill="#000">XᵃXᵃ</text>
                <text x="312" y="245" text-anchor="middle" font-size="13" fill="#000">XᵃY</text>

                <!-- 子代框 -->
                <rect x="17" y="255" width="80" height="44" rx="4" class="scene2-straight"/>
                <rect x="102" y="255" width="80" height="44" rx="4" class="scene2-straight"/>
                <rect x="187" y="255" width="80" height="44" rx="4" class="scene2-curly"/>
                <rect x="272" y="255" width="80" height="44" rx="4" class="scene2-curly"/>

                <!-- 子代表现型（框下方） -->
                <text x="57" y="320" text-anchor="middle" font-size="12" fill="#000">直刚毛♀</text>
                <text x="142" y="320" text-anchor="middle" font-size="12" fill="#000">直刚毛♂</text>
                <text x="227" y="320" text-anchor="middle" font-size="12" fill="#000">卷刚毛♀</text>
                <text x="312" y="320" text-anchor="middle" font-size="12" fill="#000">卷刚毛♂</text>

                <!-- 比例 -->
                <text x="185" y="360" text-anchor="middle" font-size="14" fill="#000">比例  1 : 1 : 1 : 1</text>
            </g>

            <!-- ==================== 步骤2：右栏常染色体隐性 + 中间判定 ==================== -->
            <g id="scene2-step2-group" display="none">
                <!-- 假说标题 -->
                <text x="615" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#000">常染色体隐性遗传假说</text>

                <!-- 亲本表现型 -->
                <text x="510" y="120" text-anchor="middle" font-size="13" fill="#000">F₁直刚毛♀果蝇</text>
                <text x="720" y="120" text-anchor="middle" font-size="13" fill="#000">F₂卷刚毛♂果蝇</text>

                <!-- 亲本基因型 -->
                <text x="510" y="147" text-anchor="middle" font-size="14" fill="#000">Aa</text>
                <text x="720" y="147" text-anchor="middle" font-size="14" fill="#000">aa</text>
                <text x="615" y="147" text-anchor="middle" font-size="16" fill="#000">×</text>

                <!-- 配子标签 -->
                <text x="510" y="175" text-anchor="middle" font-size="13" fill="#555">配子</text>
                <text x="720" y="175" text-anchor="middle" font-size="13" fill="#555">配子</text>

                <!-- 配子 -->
                <text x="490" y="203" text-anchor="middle" font-size="14" fill="#1565c0" font-weight="bold">A</text>
                <text x="530" y="203" text-anchor="middle" font-size="14" fill="#c62828" font-weight="bold">a</text>
                <text x="700" y="203" text-anchor="middle" font-size="14" fill="#c62828" font-weight="bold">a</text>
                <text x="740" y="203" text-anchor="middle" font-size="14" fill="#c62828" font-weight="bold">a</text>

                <!-- 配子到子代虚线 -->
                <line x1="490" y1="210" x2="487" y2="255" stroke="#888" stroke-width="1" stroke-dasharray="4,2"/>
                <line x1="490" y1="210" x2="572" y2="255" stroke="#888" stroke-width="1" stroke-dasharray="4,2"/>
                <line x1="530" y1="210" x2="657" y2="255" stroke="#888" stroke-width="1" stroke-dasharray="4,2"/>
                <line x1="530" y1="210" x2="742" y2="255" stroke="#888" stroke-width="1" stroke-dasharray="4,2"/>
                <line x1="700" y1="210" x2="487" y2="255" stroke="#888" stroke-width="1" stroke-dasharray="4,2"/>
                <line x1="700" y1="210" x2="657" y2="255" stroke="#888" stroke-width="1" stroke-dasharray="4,2"/>
                <line x1="740" y1="210" x2="572" y2="255" stroke="#888" stroke-width="1" stroke-dasharray="4,2"/>
                <line x1="740" y1="210" x2="742" y2="255" stroke="#888" stroke-width="1" stroke-dasharray="4,2"/>

                <!-- 子代基因型（框上方） -->
                <text x="487" y="245" text-anchor="middle" font-size="13" fill="#000">Aa</text>
                <text x="572" y="245" text-anchor="middle" font-size="13" fill="#000">Aa</text>
                <text x="657" y="245" text-anchor="middle" font-size="13" fill="#000">aa</text>
                <text x="742" y="245" text-anchor="middle" font-size="13" fill="#000">aa</text>

                <!-- 子代框 -->
                <rect x="447" y="255" width="80" height="44" rx="4" class="scene2-straight"/>
                <rect x="532" y="255" width="80" height="44" rx="4" class="scene2-straight"/>
                <rect x="617" y="255" width="80" height="44" rx="4" class="scene2-curly"/>
                <rect x="702" y="255" width="80" height="44" rx="4" class="scene2-curly"/>

                <!-- 子代表现型（框下方） -->
                <text x="487" y="320" text-anchor="middle" font-size="12" fill="#000">直刚毛♀</text>
                <text x="572" y="320" text-anchor="middle" font-size="12" fill="#000">直刚毛♂</text>
                <text x="657" y="320" text-anchor="middle" font-size="12" fill="#000">卷刚毛♀</text>
                <text x="742" y="320" text-anchor="middle" font-size="12" fill="#000">卷刚毛♂</text>

                <!-- 比例 -->
                <text x="615" y="360" text-anchor="middle" font-size="14" fill="#000">比例  1 : 1 : 1 : 1</text>

                <!-- 中间判定文字 -->
                <text x="400" y="170" text-anchor="middle" font-size="15" fill="#888" font-weight="bold">表现型比例相同</text>
                <text x="400" y="210" text-anchor="middle" font-size="15" fill="#888" font-weight="bold">无法区分遗传方式</text>
            </g>

            <!-- ==================== 步骤3：新方案伴X隐性（左栏） ==================== -->
            <g id="scene2-step3-group" display="none">
                <!-- 假说标题 -->
                <text x="185" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#000">伴X隐性遗传假说</text>

                <!-- 亲本表现型 -->
                <text x="80" y="120" text-anchor="middle" font-size="13" fill="#000">卷刚毛♀果蝇</text>
                <text x="290" y="120" text-anchor="middle" font-size="13" fill="#000">直刚毛♂果蝇</text>

                <!-- 亲本基因型 -->
                <text x="80" y="147" text-anchor="middle" font-size="14" fill="#000">XᵃXᵃ</text>
                <text x="290" y="147" text-anchor="middle" font-size="14" fill="#000">XᴬY</text>
                <text x="185" y="147" text-anchor="middle" font-size="16" fill="#000">×</text>

                <!-- 配子标签 -->
                <text x="80" y="175" text-anchor="middle" font-size="13" fill="#555">配子</text>
                <text x="290" y="175" text-anchor="middle" font-size="13" fill="#555">配子</text>

                <!-- 配子 -->
                <text x="80" y="203" text-anchor="middle" font-size="14" fill="#c62828" font-weight="bold">Xᵃ</text>
                <text x="270" y="203" text-anchor="middle" font-size="14" fill="#1565c0" font-weight="bold">Xᴬ</text>
                <text x="310" y="203" text-anchor="middle" font-size="14" fill="#000" font-weight="bold">Y</text>

                <!-- 配子到子代虚线 -->
                <line x1="80" y1="210" x2="142" y2="255" stroke="#888" stroke-width="1" stroke-dasharray="4,2"/>
                <line x1="80" y1="210" x2="227" y2="255" stroke="#888" stroke-width="1" stroke-dasharray="4,2"/>
                <line x1="270" y1="210" x2="142" y2="255" stroke="#888" stroke-width="1" stroke-dasharray="4,2"/>
                <line x1="310" y1="210" x2="227" y2="255" stroke="#888" stroke-width="1" stroke-dasharray="4,2"/>

                <!-- 子代基因型（框上方） -->
                <text x="142" y="245" text-anchor="middle" font-size="13" fill="#000">XᴬXᵃ</text>
                <text x="227" y="245" text-anchor="middle" font-size="13" fill="#000">XᵃY</text>

                <!-- 子代框 -->
                <rect x="102" y="255" width="80" height="44" rx="4" class="scene2-straight"/>
                <rect x="187" y="255" width="80" height="44" rx="4" class="scene2-curly"/>

                <!-- 子代表现型（框下方） -->
                <text x="142" y="320" text-anchor="middle" font-size="12" fill="#000">直刚毛♀</text>
                <text x="227" y="320" text-anchor="middle" font-size="12" fill="#000">卷刚毛♂</text>

                <!-- 比例 -->
                <text x="185" y="360" text-anchor="middle" font-size="14" fill="#000">比例  1 : 1</text>

                <!-- 高亮文字 -->
                <text x="185" y="395" text-anchor="middle" font-size="14" fill="#2e7d32" font-weight="bold">雌性全直刚毛，雄性全卷刚毛</text>
            </g>

            <!-- ==================== 步骤4：新方案常染色体隐性（右栏）+ 中间判定 ==================== -->
            <g id="scene2-step4-group" display="none">
                <!-- 假说标题 -->
                <text x="615" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#000">常染色体隐性遗传假说</text>

                <!-- 亲本表现型 -->
                <text x="510" y="120" text-anchor="middle" font-size="13" fill="#000">卷刚毛♀果蝇</text>
                <text x="720" y="120" text-anchor="middle" font-size="13" fill="#000">直刚毛♂果蝇</text>

                <!-- 亲本基因型 -->
                <text x="510" y="147" text-anchor="middle" font-size="14" fill="#000">aa</text>
                <text x="720" y="147" text-anchor="middle" font-size="14" fill="#000">AA</text>
                <text x="615" y="147" text-anchor="middle" font-size="16" fill="#000">×</text>

                <!-- 配子标签 -->
                <text x="510" y="175" text-anchor="middle" font-size="13" fill="#555">配子</text>
                <text x="720" y="175" text-anchor="middle" font-size="13" fill="#555">配子</text>

                <!-- 配子 -->
                <text x="510" y="203" text-anchor="middle" font-size="14" fill="#c62828" font-weight="bold">a</text>
                <text x="720" y="203" text-anchor="middle" font-size="14" fill="#1565c0" font-weight="bold">A</text>

                <!-- 配子到子代虚线 -->
                <line x1="510" y1="210" x2="615" y2="255" stroke="#888" stroke-width="1" stroke-dasharray="4,2"/>
                <line x1="720" y1="210" x2="615" y2="255" stroke="#888" stroke-width="1" stroke-dasharray="4,2"/>

                <!-- 子代基因型（框上方） -->
                <text x="615" y="245" text-anchor="middle" font-size="13" fill="#000">Aa</text>

                <!-- 子代框 -->
                <rect x="575" y="255" width="80" height="44" rx="4" class="scene2-straight"/>

                <!-- 子代表现型（框下方） -->
                <text x="615" y="320" text-anchor="middle" font-size="12" fill="#000">直刚毛♀♂</text>

                <!-- 比例 -->
                <text x="615" y="360" text-anchor="middle" font-size="14" fill="#000">全为直刚毛</text>

                <!-- 右栏底部文字 -->
                <text x="615" y="395" text-anchor="middle" font-size="14" fill="#000">雌雄全为直刚毛，与性别无关</text>

                <!-- 中间判定文字 -->
                <text x="400" y="170" text-anchor="middle" font-size="15" fill="#2e7d32" font-weight="bold">结果截然不同</text>
                <text x="400" y="210" text-anchor="middle" font-size="15" fill="#2e7d32" font-weight="bold">可以区分假说</text>
            </g>

            <!-- ==================== 步骤5：总结对比视图 ==================== -->
            <g id="scene2-step5-group" display="none">
                <!-- 分隔线 -->
                <line x1="400" y1="95" x2="400" y2="285" stroke="#ccc" stroke-width="1" stroke-dasharray="6,3"/>

                <!-- 左列标题 -->
                <text x="200" y="120" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e7d32">伴X隐性遗传</text>
                <text x="200" y="155" text-anchor="middle" font-size="14" fill="#000">卷刚毛♀ × 直刚毛♂</text>
                <text x="200" y="195" text-anchor="middle" font-size="15" fill="#000" font-weight="bold">♀ 全直刚毛</text>
                <text x="200" y="235" text-anchor="middle" font-size="15" fill="#000" font-weight="bold">♂ 全卷刚毛</text>
                <text x="200" y="275" text-anchor="middle" font-size="14" fill="#2e7d32" font-weight="bold">性状与性别关联</text>

                <!-- 右列标题 -->
                <text x="600" y="120" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">常染色体隐性遗传</text>
                <text x="600" y="155" text-anchor="middle" font-size="14" fill="#000">卷刚毛♀ × 直刚毛♂</text>
                <text x="600" y="195" text-anchor="middle" font-size="15" fill="#000" font-weight="bold">♀ 全直刚毛</text>
                <text x="600" y="235" text-anchor="middle" font-size="15" fill="#000" font-weight="bold">♂ 全直刚毛</text>
                <text x="600" y="275" text-anchor="middle" font-size="14" fill="#000">性状与性别无关</text>

                <!-- 中间箭头 -->
                <line x1="360" y1="190" x2="440" y2="190" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene2-arrowhead)"/>
                <text x="400" y="175" text-anchor="middle" font-size="14" fill="#2e7d32" font-weight="bold">截然不同</text>

                <!-- 结论区 -->
                <line x1="100" y1="300" x2="700" y2="300" stroke="#2e7d32" stroke-width="1"/>
                <text x="400" y="335" text-anchor="middle" font-size="17" font-weight="bold" fill="#2e7d32">验证结论</text>
                <text x="400" y="375" text-anchor="middle" font-size="15" fill="#000">新方案（卷刚毛♀ × 直刚毛♂）</text>
                <text x="400" y="415" text-anchor="middle" font-size="15" fill="#000" font-weight="bold">结果不同 → 可验证假说</text>
            </g>

            <!-- 箭头标记定义 -->
            <defs>
                <marker id="scene2-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32"/>
                </marker>
            </defs>
        </svg>

        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-btn-prev" disabled>◀ 上一步</button>
            <span id="scene2-step-indicator">1 / 5</span>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        var currentStep = 1;
        var totalSteps = 5;

        var titleEl = document.getElementById('scene2-title');
        var indicatorEl = document.getElementById('scene2-step-indicator');
        var btnPrev = document.getElementById('scene2-btn-prev');
        var btnNext = document.getElementById('scene2-btn-next');

        var group1 = document.getElementById('scene2-step1-group');
        var group2 = document.getElementById('scene2-step2-group');
        var group3 = document.getElementById('scene2-step3-group');
        var group4 = document.getElementById('scene2-step4-group');
        var group5 = document.getElementById('scene2-step5-group');

        var titles = [
            '',
            '题目测交方案 — 伴X隐性遗传',
            '题目测交方案 — 两种假说对比',
            '新测交方案 — 伴X隐性遗传',
            '新测交方案 — 两种假说对比',
            '验证结论总结'
        ];

        function updateDisplay() {
            titleEl.textContent = titles[currentStep];
            indicatorEl.textContent = currentStep + ' / ' + totalSteps;
            btnPrev.disabled = currentStep === 1;
            btnNext.disabled = currentStep === totalSteps;

            group1.style.display = (currentStep === 1 || currentStep === 2) ? 'block' : 'none';
            group2.style.display = (currentStep === 2) ? 'block' : 'none';
            group3.style.display = (currentStep === 3 || currentStep === 4) ? 'block' : 'none';
            group4.style.display = (currentStep === 4) ? 'block' : 'none';
            group5.style.display = (currentStep === 5) ? 'block' : 'none';
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 1) {
                currentStep--;
                updateDisplay();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateDisplay();
            }
        });

        updateDisplay();
    })();
    </script>
</body>
</html>
