<!DOCTYPE html>
<html lang="zh">
<head>

    <title>黑腹果蝇翅型遗传图解</title>
    <style>

        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 14px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 16px; z-index: 10; }
        #scene2-controls button {
            padding: 7px 18px; font-size: 13px; border: none; border-radius: 4px;
            background: #1565c0; color: #ffffff; cursor: pointer; font-family: inherit;
            transition: background 0.2s;
        }
        #scene2-controls button:hover:not(:disabled) { background: #0d47a1; }
        #scene2-controls button:disabled { background: #bdbdbd; cursor: not-allowed; }
        #scene2-step-indicator { font-size: 13px; color: #333333; min-width: 70px; text-align: center; }

            <!-- ==================== 步骤0: 正交 P 世代及配子 ==================== -->

                <text x="640" y="296" text-anchor="middle" font-size="12" fill="#000">
                    X<tspan baseline-shift="super" font-size="9">b</tspan>Y
                </text>

                <!-- 右概率 -->
                <text x="480" y="326" text-anchor="middle" font-size="12" fill="#666">1/16</text>
                <text x="520" y="326" text-anchor="middle" font-size="12" fill="#666">1/16</text>
                <text x="600" y="326" text-anchor="middle" font-size="12" fill="#666">1/16</text>
                <text x="640" y="326" text-anchor="middle" font-size="12" fill="#666">1/16</text>

                <!-- 右表现型（统一残翅） -->
                <text x="560" y="356" text-anchor="middle" font-size="12" fill="#2e7d32">残翅</text>

                <!-- 汇总 -->
                <text x="740" y="300" text-anchor="middle" font-size="14" font-weight="bold" fill="#000">F₂ 汇总</text>
                <text x="740" y="335" text-anchor="middle" font-size="13" fill="#1565c0">长翅 6/16</text>
                <text x="740" y="370" text-anchor="middle" font-size="13" fill="#c62828">小翅 6/16</text>
                <text x="740" y="405" text-anchor="middle" font-size="13" fill="#2e7d32">残翅 4/16</text>

        </svg>

        <div id="scene2-controls">
            <button id="scene2-btn-prev" disabled>◀ 上一步</button>
            <span id="scene2-step-indicator">步骤 1/6</span>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        let currentStep = 0;
        const totalSteps = 6;
        const prevBtn = document.getElementById('scene2-btn-prev');
        const nextBtn = document.getElementById('scene2-btn-next');
        const indicator = document.getElementById('scene2-step-indicator');

        function updateUI() {
            // 隐藏所有步骤组
            for (let i = 0; i < totalSteps; i++) {
                const g = document.getElementById('scene2-step-' + i);
                if (g) {
                    g.style.display = 'none';
                    g.style.opacity = '0';
                }
            }
            // 显示当前步骤组
            const currentG = document.getElementById('scene2-step-' + currentStep);
            if (currentG) {
                currentG.style.display = 'block';
                // 淡入效果
                requestAnimationFrame(function() {
                    currentG.style.opacity = '1';
                });
            }

            // 更新按钮状态
            prevBtn.disabled = (currentStep === 0);
            nextBtn.disabled = (currentStep === totalSteps - 1);
            indicator.textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;
        }

        prevBtn.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateUI();
            }
        });

        nextBtn.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateUI();
            }
        });

        // 初始化
        updateUI();
    })();
    </script>
</body>
</html>
