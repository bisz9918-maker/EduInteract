<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scene 2 - 遗传概率计算图解</title>
<style>
  body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
  #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
  #scene2-controls { position: absolute; bottom: 0; left: 0; right: 0; height: 58px; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; background: #f5f5f5; border-top: 1px solid #ddd; }
  .scene2-btn {
    padding: 6px 14px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px;
    background: #fff; cursor: pointer; user-select: none; transition: all 0.15s;
  }
  .scene2-btn:hover:not(:disabled) { background: #e0e0e0; }
  .scene2-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .scene2-btn.active-ar { background: #1565c0; color: #fff; border-color: #1565c0; }
  .scene2-btn.active-xr { background: #c62828; color: #fff; border-color: #c62828; }
  #scene2-step-indicator { font-size: 13px; color: #555; min-width: 70px; text-align: center; }
  .scene2-info-box {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border: 1px solid #000; border-radius: 4px; background: #fff;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    line-height: 1.4;
  }
  .scene2-info-box .label { font-size: 14px; font-weight: bold; color: #000; }
  .scene2-info-box .line { font-size: 13px; color: #000; }
  .scene2-info-box .line-small { font-size: 12px; color: #000; }
  .scene2-derive-box {
    display: flex; align-items: center; justify-content: center;
    border: 1px solid #000; border-radius: 4px; background: #fff;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    font-size: 12px; color: #000;
  }
  .scene2-derive-box.hl-blue { background: #e3f2fd; }
  .scene2-derive-box.hl-red { background: #ffcdd2; }
</style>
</head>
<body>
<div id="scene2-container">
<svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500" style="display:block;">
  <!-- 分隔虚线 -->
  <line x1="40" y1="228" x2="760" y2="228" stroke="#888" stroke-width="1" stroke-dasharray="5,5"/>

  <!-- ===== 上半区固定元素 ===== -->
  <text id="scene2-title-upper" x="400" y="42" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">婚配一：Ⅱ5 × Ⅱ6</text>

  <!-- Ⅱ5 信息框 -->
  <foreignObject x="45" y="56" width="130" height="78">
    <div class="scene2-info-box" style="width:130px;height:78px;">
      <div class="label">Ⅱ5</div>
      <div class="line">甲: Aa</div>
      <div class="line" id="scene2-text-ii5-b-ar">乙: Bb</div>
      <div class="line" id="scene2-text-ii5-b-xr" style="display:none">乙: XᴮY</div>
    </div>
  </foreignObject>

  <!-- Ⅱ6 信息框 -->
  <foreignObject x="45" y="142" width="130" height="78">
    <div class="scene2-info-box" style="width:130px;height:78px;">
      <div class="label">Ⅱ6</div>
      <div class="line">甲: Aa</div>
      <div class="line" id="scene2-text-ii6-b-ar">乙: Bb</div>
      <div class="line" id="scene2-text-ii6-b-xr" style="display:none">乙: XᴮXᵇ</div>
    </div>
  </foreignObject>

  <!-- ===== 下半区固定元素 ===== -->
  <text id="scene2-title-lower" x="400" y="248" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">婚配二：Ⅲ2 × Ⅲ3</text>
  <text id="scene2-cond1" x="130" y="278" text-anchor="middle" font-size="13" fill="#000">已知: Ⅰ3 = AA</text>
  <text id="scene2-cond2" x="130" y="305" text-anchor="middle" font-size="13" fill="#000">Ⅱ7 = AA</text>

  <!-- Ⅲ2 信息框 -->
  <foreignObject x="40" y="315" width="140" height="66">
    <div class="scene2-info-box" style="width:140px;height:66px;">
      <div class="label">Ⅲ2</div>
      <div class="line-small">甲: ⅓AA ⅔Aa</div>
      <div class="line" id="scene2-text-iii2-b-ar">乙: bb</div>
      <div class="line" id="scene2-text-iii2-b-xr" style="display:none">乙: XᵇY</div>
    </div>
  </foreignObject>

  <!-- Ⅲ3 信息框 -->
  <foreignObject x="40" y="389" width="140" height="58">
    <div class="scene2-info-box" style="width:140px;height:58px;">
      <div class="label">Ⅲ3</div>
      <div class="line">甲: aa</div>
      <div class="line" id="scene2-text-iii3-b-ar">乙: BB</div>
      <div class="line" id="scene2-text-iii3-b-xr" style="display:none">乙: XᴮXᴮ</div>
    </div>
  </foreignObject>

  <!-- ===== 步骤1：Ⅱ5×Ⅱ6 介绍 ===== -->
  <g id="scene2-step-1-group">
    <text x="400" y="108" text-anchor="middle" font-size="24" font-weight="bold" fill="#000">×</text>
    <path d="M 175 95 L 340 100" stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#scene2-arrowhead)"/>
    <path d="M 175 181 L 340 116" stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#scene2-arrowhead)"/>
    <text id="scene2-step1-desc-ar" x="400" y="162" text-anchor="middle" font-size="13" fill="#555">乙病假设：常染色体隐性遗传 (Bb × Bb)</text>
    <text id="scene2-step1-desc-xr" x="400" y="162" text-anchor="middle" font-size="13" fill="#555" style="display:none">乙病假设：X染色体隐性遗传 (XᴮY × XᴮXᵇ)</text>
  </g>

  <!-- ===== 步骤2：甲病 Aa×Aa 棋盘格（无填充rect，仅用线条） ===== -->
  <g id="scene2-step-2-group" style="display:none">
    <line x1="330" y1="58" x2="330" y2="166" stroke="#000" stroke-width="1"/>
    <line x1="470" y1="58" x2="470" y2="166" stroke="#000" stroke-width="1"/>
    <line x1="330" y1="58" x2="470" y2="58" stroke="#000" stroke-width="1"/>
    <line x1="330" y1="166" x2="470" y2="166" stroke="#000" stroke-width="1"/>
    <line x1="330" y1="92" x2="470" y2="92" stroke="#000" stroke-width="1"/>
    <line x1="330" y1="126" x2="470" y2="126" stroke="#000" stroke-width="1"/>
    <line x1="400" y1="58" x2="400" y2="166" stroke="#000" stroke-width="1"/>
    <text x="365" y="78" text-anchor="middle" font-size="13" fill="#000">A</text>
    <text x="435" y="78" text-anchor="middle" font-size="13" fill="#000">a</text>
    <text x="315" y="112" text-anchor="middle" font-size="13" fill="#000">A</text>
    <text x="315" y="146" text-anchor="middle" font-size="13" fill="#000">a</text>
    <text x="365" y="116" text-anchor="middle" font-size="13" fill="#1565c0">AA</text>
    <text x="435" y="116" text-anchor="middle" font-size="13" fill="#1565c0">Aa</text>
    <text x="365" y="150" text-anchor="middle" font-size="13" fill="#1565c0">Aa</text>
    <text x="435" y="150" text-anchor="middle" font-size="13" fill="#c62828">aa</text>
    <text x="620" y="88" text-anchor="middle" font-size="14" fill="#1565c0">P(甲病正常) = 3/4</text>
    <text x="620" y="128" text-anchor="middle" font-size="14" fill="#c62828">P(甲病患病) = 1/4</text>
  </g>

  <!-- ===== 步骤3：乙病分支（无填充rect） ===== -->
  <g id="scene2-step-3-group" style="display:none">
    <!-- 常隐模式 -->
    <g id="scene2-step-3-ar">
      <line x1="330" y1="58" x2="330" y2="166" stroke="#000" stroke-width="1"/>
      <line x1="470" y1="58" x2="470" y2="166" stroke="#000" stroke-width="1"/>
      <line x1="330" y1="58" x2="470" y2="58" stroke="#000" stroke-width="1"/>
      <line x1="330" y1="166" x2="470" y2="166" stroke="#000" stroke-width="1"/>
      <line x1="330" y1="92" x2="470" y2="92" stroke="#000" stroke-width="1"/>
      <line x1="330" y1="126" x2="470" y2="126" stroke="#000" stroke-width="1"/>
      <line x1="400" y1="58" x2="400" y2="166" stroke="#000" stroke-width="1"/>
      <text x="365" y="78" text-anchor="middle" font-size="13" fill="#000">B</text>
      <text x="435" y="78" text-anchor="middle" font-size="13" fill="#000">b</text>
      <text x="315" y="112" text-anchor="middle" font-size="13" fill="#000">B</text>
      <text x="315" y="146" text-anchor="middle" font-size="13" fill="#000">b</text>
      <text x="365" y="116" text-anchor="middle" font-size="13" fill="#1565c0">BB</text>
      <text x="435" y="116" text-anchor="middle" font-size="13" fill="#1565c0">Bb</text>
      <text x="365" y="150" text-anchor="middle" font-size="13" fill="#1565c0">Bb</text>
      <text x="435" y="150" text-anchor="middle" font-size="13" fill="#c62828">bb</text>
      <text x="620" y="88" text-anchor="middle" font-size="14" fill="#1565c0">P(乙病正常) = 3/4</text>
      <text x="620" y="128" text-anchor="middle" font-size="14" fill="#c62828">P(乙病患病) = 1/4</text>
    </g>
    <!-- X隐模式 -->
    <g id="scene2-step-3-xr" style="display:none">
      <text x="300" y="62" text-anchor="middle" font-size="13" fill="#000">父: XᴮY</text>
      <text x="500" y="62" text-anchor="middle" font-size="13" fill="#000">母: XᴮXᵇ</text>
      <line x1="330" y1="76" x2="330" y2="180" stroke="#000" stroke-width="1"/>
      <line x1="470" y1="76" x2="470" y2="180" stroke="#000" stroke-width="1"/>
      <line x1="330" y1="76" x2="470" y2="76" stroke="#000" stroke-width="1"/>
      <line x1="330" y1="180" x2="470" y2="180" stroke="#000" stroke-width="1"/>
      <line x1="330" y1="110" x2="470" y2="110" stroke="#000" stroke-width="1"/>
      <line x1="400" y1="76" x2="400" y2="180" stroke="#000" stroke-width="1"/>
      <text x="355" y="96" text-anchor="middle" font-size="12" fill="#000">Xᴮ</text>
      <text x="355" y="138" text-anchor="middle" font-size="12" fill="#000">Y</text>
      <text x="365" y="96" text-anchor="middle" font-size="12" fill="#000">Xᴮ</text>
      <text x="435" y="96" text-anchor="middle" font-size="12" fill="#000">Xᵇ</text>
      <text x="365" y="128" text-anchor="middle" font-size="11" fill="#1565c0">女正常</text>
      <text x="435" y="128" text-anchor="middle" font-size="11" fill="#1565c0">女正常</text>
      <text x="365" y="164" text-anchor="middle" font-size="11" fill="#1565c0">男正常</text>
      <text x="435" y="164" text-anchor="middle" font-size="11" fill="#c62828">男患病</text>
      <text x="620" y="88" text-anchor="middle" font-size="14" fill="#1565c0">P(乙病正常) = 3/4</text>
      <text x="620" y="128" text-anchor="middle" font-size="14" fill="#c62828">P(乙病患病) = 1/4</text>
    </g>
  </g>

  <!-- ===== 步骤4：组合计算（无高亮rect） ===== -->
  <g id="scene2-step-4-group" style="display:none">
    <text x="280" y="78" text-anchor="start" font-size="16" fill="#000">P(正常男孩) =</text>
    <text x="300" y="112" text-anchor="start" font-size="15" fill="#000">P(甲病正常) × P(乙病正常) × P(男)</text>
    <text x="300" y="150" text-anchor="start" font-size="17" fill="#000">= 3/4 × 3/4 × 1/2</text>
    <text x="300" y="188" text-anchor="start" font-size="20" font-weight="bold" fill="#2e7d32">= 9/32</text>
  </g>

  <!-- ===== 步骤5：Ⅲ2×Ⅲ3 介绍 ===== -->
  <g id="scene2-step-5-group" style="display:none">
    <text x="400" y="348" text-anchor="middle" font-size="24" font-weight="bold" fill="#000">×</text>
    <path d="M 180 343 L 350 342" stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#scene2-arrowhead)"/>
    <path d="M 180 413 L 350 354" stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#scene2-arrowhead)"/>
    <text x="400" y="300" text-anchor="middle" font-size="13" fill="#555">Ⅲ2：甲病正常、乙病患病</text>
    <text x="400" y="410" text-anchor="middle" font-size="13" fill="#555">Ⅲ3：甲病患病、乙病正常</text>
  </g>

  <!-- ===== 步骤6：Ⅲ3甲病基因型推导 ===== -->
  <g id="scene2-step-6-group" style="display:none">
    <foreignObject x="220" y="278" width="80" height="28">
      <div class="scene2-derive-box" style="width:80px;height:28px;">Ⅰ3(AA)</div>
    </foreignObject>
    <foreignObject x="420" y="278" width="80" height="28">
      <div class="scene2-derive-box" style="width:80px;height:28px;">Ⅰ4(Aa)</div>
    </foreignObject>
    <text x="400" y="295" text-anchor="middle" font-size="14" fill="#000">×</text>
    <line x1="300" y1="306" x2="285" y2="330" stroke="#000" stroke-width="1"/>
    <line x1="400" y1="306" x2="400" y2="330" stroke="#000" stroke-width="1"/>
    <line x1="500" y1="306" x2="515" y2="330" stroke="#000" stroke-width="1"/>
    <foreignObject x="215" y="330" width="70" height="26">
      <div class="scene2-derive-box hl-blue" style="width:70px;height:26px;">Ⅱ7(AA)</div>
    </foreignObject>
    <foreignObject x="365" y="330" width="70" height="26">
      <div class="scene2-derive-box" style="width:70px;height:26px;">Ⅱ8(Aa)</div>
    </foreignObject>
    <foreignObject x="475" y="330" width="70" height="26">
      <div class="scene2-derive-box" style="width:70px;height:26px;">Ⅱ9(aa)</div>
    </foreignObject>
    <line x1="400" y1="356" x2="400" y2="375" stroke="#000" stroke-width="1"/>
    <foreignObject x="365" y="375" width="70" height="26">
      <div class="scene2-derive-box hl-red" style="width:70px;height:26px;">Ⅲ3(aa)</div>
    </foreignObject>
    <text x="580" y="298" text-anchor="start" font-size="12" fill="#555">∵ Ⅲ3患甲病(aa)</text>
    <text x="580" y="332" text-anchor="start" font-size="12" fill="#555">∴ Ⅱ8必为Aa</text>
    <text x="580" y="366" text-anchor="start" font-size="12" fill="#555">Ⅲ3 = aa</text>
  </g>

  <!-- ===== 步骤7：Ⅲ2×Ⅲ3 计算（无高亮rect） ===== -->
  <g id="scene2-step-7-group" style="display:none">
    <text x="300" y="307" text-anchor="start" font-size="13" fill="#000">甲病：Ⅲ2(⅓AA或⅔Aa) × Ⅲ3(aa)</text>
    <text x="320" y="342" text-anchor="start" font-size="15" fill="#000">P(正常) = ⅓×1 + ⅔×½ = ⅔</text>
    <text x="300" y="377" text-anchor="start" font-size="13" fill="#000">乙病：bb × BB（或 XᵇY × XᴮXᴮ）</text>
    <text x="320" y="412" text-anchor="start" font-size="15" fill="#000">P(正常) = 1</text>
    <line x1="280" y1="428" x2="600" y2="428" stroke="#888" stroke-width="1" stroke-dasharray="5,5"/>
    <text x="300" y="450" text-anchor="start" font-size="17" font-weight="bold" fill="#2e7d32">P(正常孩子) = ⅔ × 1 = ⅔</text>
  </g>

  <!-- 箭头定义 -->
  <defs>
    <marker id="scene2-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
    </marker>
  </defs>
</svg>

<!-- 控件栏 -->
<div id="scene2-controls">
  <button id="scene2-btn-mode-ar" class="scene2-btn active-ar">常隐</button>
  <button id="scene2-btn-mode-xr" class="scene2-btn">X隐</button>
  <button id="scene2-btn-prev" class="scene2-btn" disabled>◀ 上一步</button>
  <span id="scene2-step-indicator">步骤 1/7</span>
  <button id="scene2-btn-next" class="scene2-btn">下一步 ▶</button>
</div>
</div>

<script>
(function() {
  var currentStep = 1;
  var diseaseMode = 'AR';
  var totalSteps = 7;

  var btnPrev = document.getElementById('scene2-btn-prev');
  var btnNext = document.getElementById('scene2-btn-next');
  var btnAR = document.getElementById('scene2-btn-mode-ar');
  var btnXR = document.getElementById('scene2-btn-mode-xr');
  var indicator = document.getElementById('scene2-step-indicator');

  var stepGroups = [];
  for (var i = 1; i <= totalSteps; i++) {
    stepGroups[i] = document.getElementById('scene2-step-' + i + '-group');
  }

  var elII5B_AR = document.getElementById('scene2-text-ii5-b-ar');
  var elII5B_XR = document.getElementById('scene2-text-ii5-b-xr');
  var elII6B_AR = document.getElementById('scene2-text-ii6-b-ar');
  var elII6B_XR = document.getElementById('scene2-text-ii6-b-xr');
  var elIII2B_AR = document.getElementById('scene2-text-iii2-b-ar');
  var elIII2B_XR = document.getElementById('scene2-text-iii2-b-xr');
  var elIII3B_AR = document.getElementById('scene2-text-iii3-b-ar');
  var elIII3B_XR = document.getElementById('scene2-text-iii3-b-xr');
  var elStep1Desc_AR = document.getElementById('scene2-step1-desc-ar');
  var elStep1Desc_XR = document.getElementById('scene2-step1-desc-xr');
  var elStep3_AR = document.getElementById('scene2-step-3-ar');
  var elStep3_XR = document.getElementById('scene2-step-3-xr');

  function show(el) { if(el) { el.style.display = 'block'; el.style.opacity = '1'; } }
  function hide(el) { if(el) { el.style.display = 'none'; } }
  function setOpacity(el, val) { if(el) el.style.opacity = String(val); }

  function updateModeDisplay() {
    if (diseaseMode === 'AR') {
      show(elII5B_AR); hide(elII5B_XR);
      show(elII6B_AR); hide(elII6B_XR);
      show(elIII2B_AR); hide(elIII2B_XR);
      show(elIII3B_AR); hide(elIII3B_XR);
      show(elStep1Desc_AR); hide(elStep1Desc_XR);
      btnAR.classList.add('active-ar');
      btnXR.classList.remove('active-xr');
    } else {
      hide(elII5B_AR); show(elII5B_XR);
      hide(elII6B_AR); show(elII6B_XR);
      hide(elIII2B_AR); show(elIII2B_XR);
      hide(elIII3B_AR); show(elIII3B_XR);
      hide(elStep1Desc_AR); show(elStep1Desc_XR);
      btnAR.classList.remove('active-ar');
      btnXR.classList.add('active-xr');
    }
    if (diseaseMode === 'AR') {
      show(elStep3_AR); hide(elStep3_XR);
    } else {
      hide(elStep3_AR); show(elStep3_XR);
    }
  }

  function updateStepDisplay() {
    for (var i = 1; i <= totalSteps; i++) {
      hide(stepGroups[i]);
    }
    show(stepGroups[currentStep]);
    if (currentStep >= 5 && stepGroups[4]) {
      show(stepGroups[4]);
      setOpacity(stepGroups[4], 0.25);
    } else if (stepGroups[4]) {
      setOpacity(stepGroups[4], 1);
    }
    btnPrev.disabled = (currentStep === 1);
    btnNext.disabled = (currentStep === totalSteps);
    indicator.textContent = '步骤 ' + currentStep + '/' + totalSteps;
  }

  function goNext() {
    if (currentStep < totalSteps) {
      currentStep++;
      updateStepDisplay();
    }
  }

  function goPrev() {
    if (currentStep > 1) {
      currentStep--;
      updateStepDisplay();
    }
  }

  function setModeAR() {
    diseaseMode = 'AR';
    updateModeDisplay();
  }

  function setModeXR() {
    diseaseMode = 'XR';
    updateModeDisplay();
  }

  btnNext.addEventListener('click', goNext);
  btnPrev.addEventListener('click', goPrev);
  btnAR.addEventListener('click', setModeAR);
  btnXR.addEventListener('click', setModeXR);

  updateModeDisplay();
  updateStepDisplay();
})();
</script>
</body>
</html>
