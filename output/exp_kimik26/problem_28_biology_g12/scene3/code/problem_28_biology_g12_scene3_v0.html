<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密码子碱基替换与基因突变类型</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene3-controls button {
            width: 150px; height: 36px; font-size: 14px; border: 1px solid #cccccc;
            border-radius: 4px; cursor: pointer; background: #ffffff; color: #333333;
            transition: all 0.2s ease; font-family: inherit;
        }
        #scene3-controls button:hover { opacity: 0.85; }
        #scene3-controls button.active-original { background: #1565c0; color: #ffffff; border-color: #1565c0; }
        #scene3-controls button.active-synonymous { background: #2e7d32; color: #ffffff; border-color: #2e7d32; }
        #scene3-controls button.active-missense { background: #c62828; color: #ffffff; border-color: #c62828; }
        #scene3-controls button.active-nonsense { background: #c62828; color: #ffffff; border-color: #c62828; }
        .scene3-element { transition: all 0.2s ease; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg id="scene3-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 标题 -->
            <text id="scene3-title" x="400" y="45" text-anchor="middle" font-size="20" font-weight="bold" fill="#333333">密码子碱基替换与基因突变类型</text>

            <!-- mRNA骨架线 -->
            <line id="scene3-mrna-line" x1="130" y1="150" x2="700" y2="150" stroke="#000000" stroke-width="2"/>

            <!-- 5'和3'端标签 -->
            <text id="scene3-label-5prime" x="120" y="150" text-anchor="middle" font-size="16" fill="#000000">5'</text>
            <text id="scene3-label-3prime" x="695" y="150" text-anchor="middle" font-size="16" fill="#000000">3'</text>

            <!-- 密码子1框 (AUG) - 用4条line组成边框 -->
            <line class="scene3-codon-line scene3-codon-1-line scene3-element" x1="150" y1="120" x2="240" y2="120" stroke="#1565c0" stroke-width="2"/>
            <line class="scene3-codon-line scene3-codon-1-line scene3-element" x1="240" y1="120" x2="240" y2="180" stroke="#1565c0" stroke-width="2"/>
            <line class="scene3-codon-line scene3-codon-1-line scene3-element" x1="240" y1="180" x2="150" y2="180" stroke="#1565c0" stroke-width="2"/>
            <line class="scene3-codon-line scene3-codon-1-line scene3-element" x1="150" y1="180" x2="150" y2="120" stroke="#1565c0" stroke-width="2"/>

            <!-- 密码子2框 (GCU) -->
            <line class="scene3-codon-line scene3-codon-2-line scene3-element" x1="260" y1="120" x2="350" y2="120" stroke="#1565c0" stroke-width="2"/>
            <line class="scene3-codon-line scene3-codon-2-line scene3-element" x1="350" y1="120" x2="350" y2="180" stroke="#1565c0" stroke-width="2"/>
            <line class="scene3-codon-line scene3-codon-2-line scene3-element" x1="350" y1="180" x2="260" y2="180" stroke="#1565c0" stroke-width="2"/>
            <line class="scene3-codon-line scene3-codon-2-line scene3-element" x1="260" y1="180" x2="260" y2="120" stroke="#1565c0" stroke-width="2"/>

            <!-- 密码子3框 (UCA) -->
            <line class="scene3-codon-line scene3-codon-3-line scene3-element" x1="370" y1="120" x2="460" y2="120" stroke="#1565c0" stroke-width="2"/>
            <line class="scene3-codon-line scene3-codon-3-line scene3-element" x1="460" y1="120" x2="460" y2="180" stroke="#1565c0" stroke-width="2"/>
            <line class="scene3-codon-line scene3-codon-3-line scene3-element" x1="460" y1="180" x2="370" y2="180" stroke="#1565c0" stroke-width="2"/>
            <line class="scene3-codon-line scene3-codon-3-line scene3-element" x1="370" y1="180" x2="370" y2="120" stroke="#1565c0" stroke-width="2"/>

            <!-- 密码子4框 (GAA) -->
            <line class="scene3-codon-line scene3-codon-4-line scene3-element" x1="480" y1="120" x2="570" y2="120" stroke="#1565c0" stroke-width="2"/>
            <line class="scene3-codon-line scene3-codon-4-line scene3-element" x1="570" y1="120" x2="570" y2="180" stroke="#1565c0" stroke-width="2"/>
            <line class="scene3-codon-line scene3-codon-4-line scene3-element" x1="570" y1="180" x2="480" y2="180" stroke="#1565c0" stroke-width="2"/>
            <line class="scene3-codon-line scene3-codon-4-line scene3-element" x1="480" y1="180" x2="480" y2="120" stroke="#1565c0" stroke-width="2"/>

            <!-- 密码子5框 (UGG) -->
            <line class="scene3-codon-line scene3-codon-5-line scene3-element" x1="590" y1="120" x2="680" y2="120" stroke="#1565c0" stroke-width="2"/>
            <line class="scene3-codon-line scene3-codon-5-line scene3-element" x1="680" y1="120" x2="680" y2="180" stroke="#1565c0" stroke-width="2"/>
            <line class="scene3-codon-line scene3-codon-5-line scene3-element" x1="680" y1="180" x2="590" y2="180" stroke="#1565c0" stroke-width="2"/>
            <line class="scene3-codon-line scene3-codon-5-line scene3-element" x1="590" y1="180" x2="590" y2="120" stroke="#1565c0" stroke-width="2"/>

            <!-- 密码子编号 -->
            <text id="scene3-codon-1-num" x="195" y="100" text-anchor="middle" font-size="14" fill="#888888">-1-</text>
            <text id="scene3-codon-2-num" x="305" y="100" text-anchor="middle" font-size="14" fill="#888888">-2-</text>
            <text id="scene3-codon-3-num" x="415" y="100" text-anchor="middle" font-size="14" fill="#888888">-3-</text>
            <text id="scene3-codon-4-num" x="525" y="100" text-anchor="middle" font-size="14" fill="#888888">-4-</text>
            <text id="scene3-codon-5-num" x="635" y="100" text-anchor="middle" font-size="14" fill="#888888">-5-</text>

            <!-- 碱基（密码子1: AUG） -->
            <text id="scene3-base-1-1" class="scene3-element" x="165" y="155" text-anchor="middle" font-size="22" font-family="monospace" fill="#000000">A</text>
            <text id="scene3-base-1-2" class="scene3-element" x="195" y="155" text-anchor="middle" font-size="22" font-family="monospace" fill="#000000">U</text>
            <text id="scene3-base-1-3" class="scene3-element" x="225" y="155" text-anchor="middle" font-size="22" font-family="monospace" fill="#000000">G</text>

            <!-- 碱基（密码子2: GCU） -->
            <text id="scene3-base-2-1" class="scene3-element" x="275" y="155" text-anchor="middle" font-size="22" font-family="monospace" fill="#000000">G</text>
            <text id="scene3-base-2-2" class="scene3-element" x="305" y="155" text-anchor="middle" font-size="22" font-family="monospace" fill="#000000">C</text>
            <text id="scene3-base-2-3" class="scene3-element" x="335" y="155" text-anchor="middle" font-size="22" font-family="monospace" fill="#000000">U</text>

            <!-- 碱基（密码子3: UCA） -->
            <text id="scene3-base-3-1" class="scene3-element" x="385" y="155" text-anchor="middle" font-size="22" font-family="monospace" fill="#000000">U</text>
            <text id="scene3-base-3-2" class="scene3-element" x="415" y="155" text-anchor="middle" font-size="22" font-family="monospace" fill="#000000">C</text>
            <text id="scene3-base-3-3" class="scene3-element" x="445" y="155" text-anchor="middle" font-size="22" font-family="monospace" fill="#000000">A</text>

            <!-- 碱基（密码子4: GAA） -->
            <text id="scene3-base-4-1" class="scene3-element" x="495" y="155" text-anchor="middle" font-size="22" font-family="monospace" fill="#000000">G</text>
            <text id="scene3-base-4-2" class="scene3-element" x="525" y="155" text-anchor="middle" font-size="22" font-family="monospace" fill="#000000">A</text>
            <text id="scene3-base-4-3" class="scene3-element" x="555" y="155" text-anchor="middle" font-size="22" font-family="monospace" fill="#000000">A</text>

            <!-- 碱基（密码子5: UGG） -->
            <text id="scene3-base-5-1" class="scene3-element" x="605" y="155" text-anchor="middle" font-size="22" font-family="monospace" fill="#000000">U</text>
            <text id="scene3-base-5-2" class="scene3-element" x="635" y="155" text-anchor="middle" font-size="22" font-family="monospace" fill="#000000">G</text>
            <text id="scene3-base-5-3" class="scene3-element" x="665" y="155" text-anchor="middle" font-size="22" font-family="monospace" fill="#000000">G</text>

            <!-- 氨基酸标签 -->
            <text id="scene3-aa-1" class="scene3-element" x="195" y="215" text-anchor="middle" font-size="16" fill="#000000">Met</text>
            <text id="scene3-aa-2" class="scene3-element" x="305" y="215" text-anchor="middle" font-size="16" fill="#000000">Ala</text>
            <text id="scene3-aa-3" class="scene3-element" x="415" y="215" text-anchor="middle" font-size="16" fill="#000000">Ser</text>
            <text id="scene3-aa-4" class="scene3-element" x="525" y="215" text-anchor="middle" font-size="16" fill="#000000">Glu</text>
            <text id="scene3-aa-5" class="scene3-element" x="635" y="215" text-anchor="middle" font-size="16" fill="#000000">Trp</text>

            <!-- 突变箭头（默认隐藏） -->
            <path id="scene3-mutation-arrow" class="scene3-element" d="M 415 90 L 415 120" stroke="#2e7d32" stroke-width="2" fill="none" marker-end="url(#arrowhead)" style="display:none;"/>
            <defs>
                <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32"/>
                </marker>
            </defs>

            <!-- 突变类型标签（默认隐藏） -->
            <text id="scene3-mutation-label" class="scene3-element" x="415" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e7d32" style="display:none;">同义突变</text>

            <!-- 功能影响说明文字（双行，避免过长被裁剪） -->
            <text id="scene3-desc-line1" class="scene3-element" x="400" y="315" text-anchor="middle" font-size="14" fill="#000000">原始mRNA序列及其编码的氨基酸序列，作为突变分析的基准对照。</text>
            <text id="scene3-desc-line2" class="scene3-element" x="400" y="355" text-anchor="middle" font-size="14" fill="#000000" style="display:none;"></text>
        </svg>

        <!-- 控件栏 -->
        <div id="scene3-controls">
            <button id="scene3-btn-original">原始序列</button>
            <button id="scene3-btn-synonymous">同义突变</button>
            <button id="scene3-btn-missense">错义突变</button>
            <button id="scene3-btn-nonsense">无义突变</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 3 实现
        const STATE = { ORIGINAL: 0, SYNONYMOUS: 1, MISSENSE: 2, NONSENSE: 3 };
        let currentState = STATE.ORIGINAL;

        // 获取元素引用
        const els = {
            codonLines: [
                document.querySelectorAll('.scene3-codon-1-line'),
                document.querySelectorAll('.scene3-codon-2-line'),
                document.querySelectorAll('.scene3-codon-3-line'),
                document.querySelectorAll('.scene3-codon-4-line'),
                document.querySelectorAll('.scene3-codon-5-line')
            ],
            bases: {
                '1-1': document.getElementById('scene3-base-1-1'),
                '1-2': document.getElementById('scene3-base-1-2'),
                '1-3': document.getElementById('scene3-base-1-3'),
                '2-1': document.getElementById('scene3-base-2-1'),
                '2-2': document.getElementById('scene3-base-2-2'),
                '2-3': document.getElementById('scene3-base-2-3'),
                '3-1': document.getElementById('scene3-base-3-1'),
                '3-2': document.getElementById('scene3-base-3-2'),
                '3-3': document.getElementById('scene3-base-3-3'),
                '4-1': document.getElementById('scene3-base-4-1'),
                '4-2': document.getElementById('scene3-base-4-2'),
                '4-3': document.getElementById('scene3-base-4-3'),
                '5-1': document.getElementById('scene3-base-5-1'),
                '5-2': document.getElementById('scene3-base-5-2'),
                '5-3': document.getElementById('scene3-base-5-3')
            },
            aas: [
                document.getElementById('scene3-aa-1'),
                document.getElementById('scene3-aa-2'),
                document.getElementById('scene3-aa-3'),
                document.getElementById('scene3-aa-4'),
                document.getElementById('scene3-aa-5')
            ],
            arrow: document.getElementById('scene3-mutation-arrow'),
            arrowMarker: document.querySelector('#arrowhead polygon'),
            mutationLabel: document.getElementById('scene3-mutation-label'),
            descLine1: document.getElementById('scene3-desc-line1'),
            descLine2: document.getElementById('scene3-desc-line2'),
            btns: {
                original: document.getElementById('scene3-btn-original'),
                synonymous: document.getElementById('scene3-btn-synonymous'),
                missense: document.getElementById('scene3-btn-missense'),
                nonsense: document.getElementById('scene3-btn-nonsense')
            }
        };

        function resetAll() {
            // 重置所有密码子框线条为蓝色
            els.codonLines.forEach(lines => {
                lines.forEach(line => {
                    line.setAttribute('stroke', '#1565c0');
                    line.setAttribute('stroke-width', '2');
                });
            });
            // 重置所有碱基
            Object.values(els.bases).forEach(base => {
                base.setAttribute('fill', '#000000');
                base.style.fontWeight = 'normal';
            });
            // 重置碱基内容
            els.bases['3-3'].textContent = 'A';
            els.bases['4-2'].textContent = 'A';
            els.bases['3-2'].textContent = 'C';
            // 重置氨基酸
            els.aas[0].textContent = 'Met';
            els.aas[1].textContent = 'Ala';
            els.aas[2].textContent = 'Ser';
            els.aas[3].textContent = 'Glu';
            els.aas[4].textContent = 'Trp';
            els.aas.forEach(aa => {
                aa.setAttribute('fill', '#000000');
                aa.style.fontWeight = 'normal';
                aa.style.opacity = '1';
            });
            // 隐藏箭头和标签
            els.arrow.style.display = 'none';
            els.mutationLabel.style.display = 'none';
            // 重置说明文字
            els.descLine2.style.display = 'none';
            els.descLine2.textContent = '';
            // 重置按钮样式
            Object.values(els.btns).forEach(btn => {
                btn.className = '';
            });
        }

        function renderState(state) {
            resetAll();
            currentState = state;

            switch (state) {
                case STATE.ORIGINAL:
                    els.btns.original.className = 'active-original';
                    els.descLine1.textContent = '原始mRNA序列及其编码的氨基酸序列，作为突变分析的基准对照。';
                    break;

                case STATE.SYNONYMOUS:
                    els.btns.synonymous.className = 'active-synonymous';
                    // 密码子3框线条变绿
                    els.codonLines[2].forEach(line => {
                        line.setAttribute('stroke', '#2e7d32');
                        line.setAttribute('stroke-width', '2.5');
                    });
                    // 碱基变化: C3-3 A→U
                    els.bases['3-3'].textContent = 'U';
                    els.bases['3-3'].setAttribute('fill', '#2e7d32');
                    els.bases['3-3'].style.fontWeight = 'bold';
                    // 箭头位置
                    els.arrow.setAttribute('d', 'M 415 90 L 415 120');
                    els.arrow.setAttribute('stroke', '#2e7d32');
                    els.arrow.style.display = 'block';
                    els.arrowMarker.setAttribute('fill', '#2e7d32');
                    // 标签
                    els.mutationLabel.textContent = '同义突变';
                    els.mutationLabel.setAttribute('x', '415');
                    els.mutationLabel.setAttribute('fill', '#2e7d32');
                    els.mutationLabel.style.display = 'block';
                    // 说明（双行）
                    els.descLine1.textContent = '密码子 UCA → UCU，编码氨基酸仍为 Ser（丝氨酸）。';
                    els.descLine2.textContent = '由于密码子的简并性，碱基替换未改变氨基酸序列，蛋白质功能通常不变。';
                    els.descLine2.style.display = 'block';
                    break;

                case STATE.MISSENSE:
                    els.btns.missense.className = 'active-missense';
                    // 密码子4框线条变红
                    els.codonLines[3].forEach(line => {
                        line.setAttribute('stroke', '#c62828');
                        line.setAttribute('stroke-width', '2.5');
                    });
                    // 碱基变化: C4-2 A→U
                    els.bases['4-2'].textContent = 'U';
                    els.bases['4-2'].setAttribute('fill', '#c62828');
                    els.bases['4-2'].style.fontWeight = 'bold';
                    // 箭头位置
                    els.arrow.setAttribute('d', 'M 525 90 L 525 120');
                    els.arrow.setAttribute('stroke', '#c62828');
                    els.arrow.style.display = 'block';
                    els.arrowMarker.setAttribute('fill', '#c62828');
                    // 标签
                    els.mutationLabel.textContent = '错义突变';
                    els.mutationLabel.setAttribute('x', '525');
                    els.mutationLabel.setAttribute('fill', '#c62828');
                    els.mutationLabel.style.display = 'block';
                    // 氨基酸变化
                    els.aas[3].textContent = 'Val';
                    els.aas[3].setAttribute('fill', '#c62828');
                    // 说明（双行）
                    els.descLine1.textContent = '密码子 GAA → GUA，编码氨基酸由 Glu（谷氨酸）变为 Val（缬氨酸）。';
                    els.descLine2.textContent = '氨基酸改变可能导致蛋白质空间结构变化，功能下降（如甲状腺激素受体功能下降）。';
                    els.descLine2.style.display = 'block';
                    break;

                case STATE.NONSENSE:
                    els.btns.nonsense.className = 'active-nonsense';
                    // 密码子3框线条变红
                    els.codonLines[2].forEach(line => {
                        line.setAttribute('stroke', '#c62828');
                        line.setAttribute('stroke-width', '2.5');
                    });
                    // 碱基变化: C3-2 C→G
                    els.bases['3-2'].textContent = 'G';
                    els.bases['3-2'].setAttribute('fill', '#c62828');
                    els.bases['3-2'].style.fontWeight = 'bold';
                    // 箭头位置
                    els.arrow.setAttribute('d', 'M 415 90 L 415 120');
                    els.arrow.setAttribute('stroke', '#c62828');
                    els.arrow.style.display = 'block';
                    els.arrowMarker.setAttribute('fill', '#c62828');
                    // 标签
                    els.mutationLabel.textContent = '无义突变';
                    els.mutationLabel.setAttribute('x', '415');
                    els.mutationLabel.setAttribute('fill', '#c62828');
                    els.mutationLabel.style.display = 'block';
                    // 氨基酸变化
                    els.aas[2].textContent = 'STOP';
                    els.aas[2].setAttribute('fill', '#c62828');
                    els.aas[2].style.fontWeight = 'bold';
                    // 后续氨基酸变灰
                    els.aas[3].style.opacity = '0.4';
                    els.aas[3].setAttribute('fill', '#888888');
                    els.aas[4].style.opacity = '0.4';
                    els.aas[4].setAttribute('fill', '#888888');
                    // 说明（双行）
                    els.descLine1.textContent = '密码子 UCA → UGA（终止密码子），翻译在此提前终止，肽链截短。';
                    els.descLine2.textContent = '产生的蛋白质通常完全丧失功能。';
                    els.descLine2.style.display = 'block';
                    break;
            }
        }

        // 绑定按钮事件
        els.btns.original.addEventListener('click', () => renderState(STATE.ORIGINAL));
        els.btns.synonymous.addEventListener('click', () => renderState(STATE.SYNONYMOUS));
        els.btns.missense.addEventListener('click', () => renderState(STATE.MISSENSE));
        els.btns.nonsense.addEventListener('click', () => renderState(STATE.NONSENSE));

        // 初始渲染
        renderState(STATE.ORIGINAL);
    })();
    </script>
</body>
</html>
