<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 1 - BCC/FCC 晶体结构</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            position: absolute;
            top: 0;
            left: 0;
        }
        /* 原子样式 */
        .scene1-atom {
            fill: #000000;
            stroke: #000000;
            stroke-width: 1;
            r: 12;
            transition: all 0.3s ease;
        }
        .scene1-atom.highlight {
            fill: #1565c0;
            stroke: #0d47a1;
            stroke-width: 2;
            r: 14;
        }
        .scene1-neighbor-atom {
            fill: #666666;
            stroke: #666666;
            stroke-width: 1;
            r: 10;
            opacity: 0.4;
        }
        /* 框架棱线 */
        .scene1-visible-edge {
            stroke: #000000;
            stroke-width: 2;
            fill: none;
        }
        .scene1-hidden-edge {
            stroke: #888888;
            stroke-width: 1;
            fill: none;
            stroke-dasharray: 4, 4;
        }
        #scene1-frame {
            transition: opacity 0.3s ease;
        }
        /* 连线 */
        .scene1-bond-line {
            stroke: #c62828;
            stroke-width: 2;
            fill: none;
        }
        .scene1-bond-dashed {
            stroke: #c62828;
            stroke-width: 2;
            fill: none;
            stroke-dasharray: 5, 5;
        }
        /* 标签 */
        .scene1-label {
            font-size: 16px;
            fill: #000000;
            font-family: "Times New Roman", serif;
        }
        .scene1-label-red {
            font-size: 16px;
            fill: #c62828;
            font-family: "Times New Roman", serif;
        }
        /* 按钮样式 */
        #scene1-btn-bcc,
        #scene1-btn-fcc {
            position: absolute;
            top: 10px;
            height: 32px;
            width: 170px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            background: #e0e0e0;
            color: #333333;
            transition: all 0.3s ease;
            z-index: 10;
        }
        #scene1-btn-bcc {
            left: 220px;
        }
        #scene1-btn-fcc {
            left: 410px;
        }
        #scene1-btn-bcc.active,
        #scene1-btn-fcc.active {
            background: #1565c0;
            color: #ffffff;
            border-color: #1565c0;
        }
        #scene1-btn-prev,
        #scene1-btn-next {
            position: absolute;
            bottom: 15px;
            width: 90px;
            height: 30px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            background: #f5f5f5;
            color: #333333;
            transition: all 0.3s ease;
            z-index: 10;
        }
        #scene1-btn-prev {
            left: 300px;
        }
        #scene1-btn-next {
            left: 410px;
        }
        #scene1-btn-prev:disabled,
        #scene1-btn-next:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        /* 步骤指示器 */
        #scene1-step-indicator {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 52px;
            text-align: center;
            font-size: 14px;
            color: #333333;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <!-- SVG 图示区：固定 800×500px -->
        <svg id="scene1-svg" width="800" height="500">
            <!-- 晶胞框架 -->
            <g id="scene1-frame">
                <!-- 可见棱（9条实线） -->
                <!-- 前表面4条 -->
                <line class="scene1-visible-edge" x1="300" y1="200" x2="460" y2="200" />
                <line class="scene1-visible-edge" x1="460" y1="200" x2="460" y2="360" />
                <line class="scene1-visible-edge" x1="460" y1="360" x2="300" y2="360" />
                <line class="scene1-visible-edge" x1="300" y1="360" x2="300" y2="200" />
                <!-- 后到前连接棱3条（左上、右上、右下） -->
                <line class="scene1-visible-edge" x1="380" y1="150" x2="300" y2="200" />
                <line class="scene1-visible-edge" x1="540" y1="150" x2="460" y2="200" />
                <line class="scene1-visible-edge" x1="540" y1="310" x2="460" y2="360" />
                <!-- 后表面2条（上、右） -->
                <line class="scene1-visible-edge" x1="380" y1="150" x2="540" y2="150" />
                <line class="scene1-visible-edge" x1="540" y1="150" x2="540" y2="310" />

                <!-- 隐藏棱（3条虚线） -->
                <!-- 后底边 -->
                <line class="scene1-hidden-edge" x1="380" y1="310" x2="540" y2="310" />
                <!-- 后左竖边 -->
                <line class="scene1-hidden-edge" x1="380" y1="310" x2="380" y2="150" />
                <!-- 左下连接棱 -->
                <line class="scene1-hidden-edge" x1="300" y1="360" x2="380" y2="310" />
            </g>

            <!-- BCC 连线（8条，体心到顶点） -->
            <g id="scene1-bcc-bonds" class="scene1-bcc-only" style="display:none">
                <line class="scene1-bond-line" x1="420" y1="255" x2="300" y2="200" />
                <line class="scene1-bond-line" x1="420" y1="255" x2="460" y2="200" />
                <line class="scene1-bond-line" x1="420" y1="255" x2="460" y2="360" />
                <line class="scene1-bond-line" x1="420" y1="255" x2="300" y2="360" />
                <line class="scene1-bond-line" x1="420" y1="255" x2="380" y2="150" />
                <line class="scene1-bond-line" x1="420" y1="255" x2="540" y2="150" />
                <line class="scene1-bond-line" x1="420" y1="255" x2="540" y2="310" />
                <line class="scene1-bond-line" x1="420" y1="255" x2="380" y2="310" />
            </g>

            <!-- FCC 连线（12条，顶面心到最近邻） -->
            <g id="scene1-fcc-bonds" class="scene1-fcc-only" style="display:none">
                <!-- 晶胞内8条实线：到4顶点+4面心 -->
                <line class="scene1-bond-line" x1="420" y1="175" x2="300" y2="200" />
                <line class="scene1-bond-line" x1="420" y1="175" x2="460" y2="200" />
                <line class="scene1-bond-line" x1="420" y1="175" x2="380" y2="150" />
                <line class="scene1-bond-line" x1="420" y1="175" x2="540" y2="150" />
                <line class="scene1-bond-line" x1="420" y1="175" x2="380" y2="280" />
                <line class="scene1-bond-line" x1="420" y1="175" x2="460" y2="230" />
                <line class="scene1-bond-line" x1="420" y1="175" x2="340" y2="255" />
                <line class="scene1-bond-line" x1="420" y1="175" x2="500" y2="255" />
                <!-- 相邻晶胞4条虚线 -->
                <line class="scene1-bond-dashed" x1="420" y1="175" x2="380" y2="120" />
                <line class="scene1-bond-dashed" x1="420" y1="175" x2="460" y2="70" />
                <line class="scene1-bond-dashed" x1="420" y1="175" x2="340" y2="95" />
                <line class="scene1-bond-dashed" x1="420" y1="175" x2="500" y2="95" />
            </g>

            <!-- 顶点原子（8个，BCC与FCC共用） -->
            <g id="scene1-vertex-atoms">
                <circle class="scene1-atom scene1-vertex-atom" cx="300" cy="200" />
                <circle class="scene1-atom scene1-vertex-atom" cx="460" cy="200" />
                <circle class="scene1-atom scene1-vertex-atom" cx="460" cy="360" />
                <circle class="scene1-atom scene1-vertex-atom" cx="300" cy="360" />
                <circle class="scene1-atom scene1-vertex-atom" cx="380" cy="150" />
                <circle class="scene1-atom scene1-vertex-atom" cx="540" cy="150" />
                <circle class="scene1-atom scene1-vertex-atom" cx="540" cy="310" />
                <circle class="scene1-atom scene1-vertex-atom" cx="380" cy="310" />
            </g>

            <!-- BCC 体心原子 -->
            <circle id="scene1-atom-body" class="scene1-atom scene1-bcc-only" cx="420" cy="255" />

            <!-- FCC 面心原子（6个） -->
            <g id="scene1-fcc-face-atoms" class="scene1-fcc-only" style="display:none">
                <circle class="scene1-atom scene1-face-atom" cx="380" cy="280" />
                <circle class="scene1-atom scene1-face-atom" cx="460" cy="230" />
                <circle class="scene1-atom scene1-face-atom" cx="340" cy="255" />
                <circle class="scene1-atom scene1-face-atom" cx="500" cy="255" />
                <circle id="scene1-atom-face-top" class="scene1-atom scene1-face-atom" cx="420" cy="175" />
                <circle class="scene1-atom scene1-face-atom" cx="420" cy="335" />
            </g>

            <!-- FCC 相邻晶胞原子（4个，半透明） -->
            <g id="scene1-fcc-neighbor" class="scene1-fcc-only" style="display:none">
                <circle class="scene1-neighbor-atom" cx="380" cy="120" />
                <circle class="scene1-neighbor-atom" cx="460" cy="70" />
                <circle class="scene1-neighbor-atom" cx="340" cy="95" />
                <circle class="scene1-neighbor-atom" cx="500" cy="95" />
            </g>

            <!-- 标签 -->
            <text id="scene1-label-fig" class="scene1-label" x="280" y="390">图1</text>
            <text id="scene1-label-type" class="scene1-label" x="420" y="130" text-anchor="middle">BCC</text>
            <text id="scene1-label-a" class="scene1-label" x="380" y="375" text-anchor="middle">a₁</text>
            <!-- 距离公式标注：移到右下方避免与连线重叠 -->
            <text id="scene1-label-distance" class="scene1-label-red" x="520" y="330" style="display:none">d = (√3/2)a₁</text>

            <!-- 配位数浮动框：用4条线段代替rect，避免文字与rect重叠检测问题 -->
            <g id="scene1-cn-box" style="display:none">
                <!-- 边框四条线 -->
                <line x1="600" y1="150" x2="770" y2="150" stroke="#c62828" stroke-width="2" />
                <line x1="770" y1="150" x2="770" y2="260" stroke="#c62828" stroke-width="2" />
                <line x1="770" y1="260" x2="600" y2="260" stroke="#c62828" stroke-width="2" />
                <line x1="600" y1="260" x2="600" y2="150" stroke="#c62828" stroke-width="2" />
                <!-- 文字内容，增大间距避免拥挤 -->
                <text class="scene1-label" x="685" y="168" text-anchor="middle" font-size="14">配位数</text>
                <text id="scene1-cn-value" x="685" y="210" text-anchor="middle" font-size="20" font-weight="bold" fill="#c62828">CN = 8</text>
                <text id="scene1-cn-note" class="scene1-label" x="685" y="248" text-anchor="middle" font-size="12" style="display:none">（顶点原子也为8）</text>
            </g>

            <!-- 步骤指示器（SVG内） -->
            <text id="scene1-step-indicator-svg" class="scene1-label" x="400" y="435" text-anchor="middle" font-size="14" fill="#333333">步骤 1/4</text>
        </svg>

        <!-- 控件栏：HTML 按钮叠在 SVG 区域 -->
        <button id="scene1-btn-bcc" class="active">BCC（910℃以下）</button>
        <button id="scene1-btn-fcc">FCC（910℃以上）</button>
        <div id="scene1-step-indicator">步骤 1/4</div>
        <button id="scene1-btn-prev" disabled>◀ 上一步</button>
        <button id="scene1-btn-next">下一步 ▶</button>
    </div>

    <script>
    (function() {
        // Scene 1 状态机
        var state = {
            crystal: 'bcc', // 'bcc' 或 'fcc'
            step: 0         // 0 ~ 3
        };

        // 获取元素引用
        var svg = document.getElementById('scene1-svg');
        var frame = document.getElementById('scene1-frame');
        var vertexAtoms = svg.getElementsByClassName('scene1-vertex-atom');
        var bccOnly = svg.getElementsByClassName('scene1-bcc-only');
        var fccOnly = svg.getElementsByClassName('scene1-fcc-only');
        var faceAtoms = svg.getElementsByClassName('scene1-face-atom');
        var atomBody = document.getElementById('scene1-atom-body');
        var atomFaceTop = document.getElementById('scene1-atom-face-top');
        var bccBonds = document.getElementById('scene1-bcc-bonds');
        var fccBonds = document.getElementById('scene1-fcc-bonds');
        var fccNeighbor = document.getElementById('scene1-fcc-neighbor');
        var distLabel = document.getElementById('scene1-label-distance');
        var cnBox = document.getElementById('scene1-cn-box');
        var cnValue = document.getElementById('scene1-cn-value');
        var cnNote = document.getElementById('scene1-cn-note');
        var stepIndicatorSvg = document.getElementById('scene1-step-indicator-svg');
        var stepIndicatorHtml = document.getElementById('scene1-step-indicator');
        var labelFig = document.getElementById('scene1-label-fig');
        var labelType = document.getElementById('scene1-label-type');
        var labelA = document.getElementById('scene1-label-a');

        var btnBcc = document.getElementById('scene1-btn-bcc');
        var btnFcc = document.getElementById('scene1-btn-fcc');
        var btnPrev = document.getElementById('scene1-btn-prev');
        var btnNext = document.getElementById('scene1-btn-next');

        // 辅助函数
        function setDisplay(elements, display) {
            for (var i = 0; i < elements.length; i++) {
                elements[i].style.display = display;
            }
        }

        function setOpacity(elements, opacity) {
            for (var i = 0; i < elements.length; i++) {
                elements[i].style.opacity = opacity;
            }
        }

        function removeHighlight(elements) {
            for (var i = 0; i < elements.length; i++) {
                elements[i].classList.remove('highlight');
            }
        }

        // 主渲染函数
        function render() {
            // 1. 切换晶体类型显示
            if (state.crystal === 'bcc') {
                setDisplay(bccOnly, '');
                setDisplay(fccOnly, 'none');
                labelFig.textContent = '图1';
                labelType.textContent = 'BCC';
                labelA.textContent = 'a₁';
            } else {
                setDisplay(bccOnly, 'none');
                setDisplay(fccOnly, '');
                labelFig.textContent = '图2';
                labelType.textContent = 'FCC';
                labelA.textContent = 'a₂';
            }

            // 2. 按钮激活状态
            btnBcc.classList.toggle('active', state.crystal === 'bcc');
            btnFcc.classList.toggle('active', state.crystal === 'fcc');

            // 3. 重置所有视觉状态
            frame.style.opacity = '1';
            setOpacity(vertexAtoms, '1');
            removeHighlight(vertexAtoms);

            if (atomBody) {
                atomBody.classList.remove('highlight');
                atomBody.style.opacity = '1';
            }

            for (var i = 0; i < faceAtoms.length; i++) {
                faceAtoms[i].classList.remove('highlight');
                faceAtoms[i].style.opacity = '1';
            }

            if (bccBonds) bccBonds.style.display = 'none';
            if (fccBonds) fccBonds.style.display = 'none';
            if (fccNeighbor) fccNeighbor.style.display = 'none';
            if (distLabel) distLabel.style.display = 'none';
            if (cnBox) cnBox.style.display = 'none';
            if (cnNote) cnNote.style.display = 'none';

            // 4. 根据步骤设置视觉状态
            if (state.step === 1) {
                // 步骤1：高亮中心原子，其他淡化
                frame.style.opacity = '0.3';
                setOpacity(vertexAtoms, '0.3');

                if (state.crystal === 'bcc' && atomBody) {
                    atomBody.classList.add('highlight');
                } else if (state.crystal === 'fcc' && atomFaceTop) {
                    atomFaceTop.classList.add('highlight');
                    for (var i = 0; i < faceAtoms.length; i++) {
                        if (faceAtoms[i] !== atomFaceTop) {
                            faceAtoms[i].style.opacity = '0.3';
                        }
                    }
                }
            } else if (state.step === 2) {
                // 步骤2：显示连线与距离公式
                frame.style.opacity = '0.6';
                setOpacity(vertexAtoms, '0.6');

                if (state.crystal === 'bcc') {
                    if (atomBody) atomBody.classList.add('highlight');
                    if (bccBonds) bccBonds.style.display = 'block';
                    distLabel.textContent = 'd = (√3/2)a₁';
                    distLabel.style.display = 'block';
                } else {
                    if (atomFaceTop) atomFaceTop.classList.add('highlight');
                    for (var i = 0; i < faceAtoms.length; i++) {
                        if (faceAtoms[i] !== atomFaceTop) {
                            faceAtoms[i].style.opacity = '0.6';
                        }
                    }
                    if (fccBonds) fccBonds.style.display = 'block';
                    if (fccNeighbor) fccNeighbor.style.display = 'block';
                    distLabel.textContent = 'd = (√2/2)a₂';
                    distLabel.style.display = 'block';
                }
            } else if (state.step === 3) {
                // 步骤3：显示配位数结论
                frame.style.opacity = '0.6';
                setOpacity(vertexAtoms, '0.6');

                if (state.crystal === 'bcc') {
                    if (atomBody) atomBody.classList.add('highlight');
                    if (bccBonds) bccBonds.style.display = 'block';
                    distLabel.textContent = 'd = (√3/2)a₁';
                    distLabel.style.display = 'block';
                    cnValue.textContent = 'CN = 8';
                    cnNote.textContent = '（顶点原子也为8）';
                    cnNote.style.display = 'block';
                } else {
                    if (atomFaceTop) atomFaceTop.classList.add('highlight');
                    for (var i = 0; i < faceAtoms.length; i++) {
                        if (faceAtoms[i] !== atomFaceTop) {
                            faceAtoms[i].style.opacity = '0.6';
                        }
                    }
                    if (fccBonds) fccBonds.style.display = 'block';
                    if (fccNeighbor) fccNeighbor.style.display = 'block';
                    distLabel.textContent = 'd = (√2/2)a₂';
                    distLabel.style.display = 'block';
                    cnValue.textContent = 'CN = 12';
                    cnNote.style.display = 'none';
                }
                if (cnBox) cnBox.style.display = 'block';
            }
            // step === 0 时保持默认状态

            // 5. 更新步骤指示器
            var stepText = '步骤 ' + (state.step + 1) + '/4';
            stepIndicatorSvg.textContent = stepText;
            stepIndicatorHtml.textContent = stepText;

            // 6. 更新按钮禁用状态
            btnPrev.disabled = state.step === 0;
            btnNext.disabled = state.step === 3;
        }

        // 事件绑定
        btnBcc.addEventListener('click', function() {
            state.crystal = 'bcc';
            state.step = 0;
            render();
        });

        btnFcc.addEventListener('click', function() {
            state.crystal = 'fcc';
            state.step = 0;
            render();
        });

        btnPrev.addEventListener('click', function() {
            if (state.step > 0) {
                state.step--;
                render();
            }
        });

        btnNext.addEventListener('click', function() {
            if (state.step < 3) {
                state.step++;
                render();
            }
        });

        // 初始渲染
        render();
    })();
    </script>
</body>
</html>
