<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scene 2</title>
<style>
body{margin:0;padding:0;background:#fff;font-family:"Microsoft YaHei","PingFang SC",sans-serif}
#scene2-container{position:relative;width:800px;height:500px;background:#fff;margin:0 auto;overflow:hidden}
#scene2-controls{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:20px;z-index:10}
#scene2-btn-prev,#scene2-btn-next{padding:8px 20px;font-size:14px;cursor:pointer;border:1px solid #333;border-radius:4px;background:#f5f5f5;transition:opacity .2s}
#scene2-btn-prev:hover:not(:disabled),#scene2-btn-next:hover:not(:disabled){background:#e0e0e0}
#scene2-btn-prev:disabled,#scene2-btn-next:disabled{opacity:.4;cursor:not-allowed}
#scene2-step-text{font-size:14px;color:#555;min-width:80px;text-align:center}
.scene2-piston-closed{fill:#bdbdbd;stroke:#000;stroke-width:1}
.scene2-piston-open{fill:#fff;stroke:#2e7d32;stroke-width:3}
.scene2-molecule{transition:opacity .5s ease}
.scene2-fade-out{opacity:0}
@keyframes scene2-drop-fall{0%{transform:translate(0,0);opacity:1}100%{transform:translate(-15px,15px);opacity:1}}
.scene2-drop-anim{animation:scene2-drop-fall .4s ease-in forwards}
.scene2-red-liquid{transition:opacity .4s ease}
.scene2-label{transition:opacity .3s ease}
</style>
</head>
<body>
<div id="scene2-container">
<svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500">
<defs>
<marker id="scene2-arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#c62828"/></marker>
<marker id="scene2-arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#1565c0"/></marker>
</defs>
<!-- A瓶 -->
<circle cx="240" cy="110" r="45" stroke="#000" stroke-width="2" fill="none"/>
<rect x="230" y="155" width="20" height="35" stroke="#000" stroke-width="2" fill="none"/>
<!-- B瓶 -->
<circle cx="440" cy="110" r="45" stroke="#000" stroke-width="2" fill="none"/>
<rect x="430" y="155" width="20" height="35" stroke="#000" stroke-width="2" fill="none"/>
<!-- 胶头滴管 -->
<ellipse cx="495" cy="45" rx="12" ry="15" stroke="#000" stroke-width="2" fill="#f8bbd0"/>
<rect x="488" y="60" width="14" height="115" stroke="#000" stroke-width="2" fill="none"/>
<line x1="495" y1="175" x2="455" y2="190" stroke="#000" stroke-width="3"/>
<!-- 导管 -->
<path d="M240,190 L240,210 L300,210" stroke="#000" stroke-width="4" fill="none"/>
<path d="M440,190 L440,210 L380,210" stroke="#000" stroke-width="4" fill="none"/>
<line x1="300" y1="210" x2="380" y2="210" stroke="#000" stroke-width="4"/>
<line x1="340" y1="210" x2="340" y2="360" stroke="#000" stroke-width="4"/>
<!-- 活塞 -->
<circle id="scene2-piston-a" cx="380" cy="210" r="10" class="scene2-piston-closed"/>
<circle id="scene2-piston-b" cx="340" cy="340" r="10" class="scene2-piston-closed"/>
<circle id="scene2-piston-c" cx="300" cy="210" r="10" class="scene2-piston-closed"/>
<!-- 烧杯 -->
<line x1="210" y1="330" x2="220" y2="410" stroke="#000" stroke-width="2"/>
<line x1="470" y1="330" x2="460" y2="410" stroke="#000" stroke-width="2"/>
<path d="M220,410 Q340,430 460,410" stroke="#000" stroke-width="2" fill="none"/>
<line x1="210" y1="330" x2="470" y2="330" stroke="#000" stroke-width="2"/>
<!-- 烧杯液体 -->
<path d="M220,350 L220,410 Q340,430 460,410 L460,350 Z" fill="#e3f2fd" opacity="0.3"/>
<line x1="220" y1="350" x2="460" y2="350" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
<!-- 静态标签 -->
<text x="170" y="85" font-size="18" fill="#000" font-weight="bold">A</text>
<text x="370" y="85" font-size="18" fill="#000" font-weight="bold">B</text>
<text x="240" y="55" font-size="16" fill="#000" text-anchor="middle">HCl</text>
<text x="440" y="55" font-size="16" fill="#000" text-anchor="middle">NH₃</text>
<text x="500" y="100" font-size="14" fill="#000">装有水的胶头滴管</text>
<text x="380" y="235" font-size="16" fill="#000" text-anchor="middle">a</text>
<text x="355" y="320" font-size="16" fill="#000">b</text>
<text x="300" y="235" font-size="16" fill="#000" text-anchor="middle">c</text>
<text x="480" y="395" font-size="16" fill="#000">水</text>
<!-- 步骤0标签 -->
<text id="scene2-label-phenol-clear" class="scene2-label" x="420" y="350" font-size="14" fill="#1565c0" opacity="1">酚酞（无色）</text>
<!-- 步骤1元素 -->
<circle id="scene2-water-drop" cx="455" cy="175" r="5" fill="#1565c0" opacity="0"/>
<text id="scene2-label-nh3-soluble" class="scene2-label" x="500" y="150" font-size="14" fill="#c62828" opacity="0">NH₃极易溶于水</text>
<!-- 步骤2元素 -->
<line id="scene2-pressure-arrow" x1="490" y1="170" x2="465" y2="170" stroke="#c62828" stroke-width="3" marker-end="url(#scene2-arrow-red)" opacity="0"/>
<text id="scene2-label-pressure" class="scene2-label" x="500" y="170" font-size="14" fill="#c62828" opacity="0">P_B 急剧↓</text>
<!-- 步骤3元素 -->
<text id="scene2-label-atm" class="scene2-label" x="170" y="310" font-size="14" fill="#c62828" opacity="0">大气压</text>
<line id="scene2-atm-arrow" x1="200" y1="300" x2="200" y2="330" stroke="#c62828" stroke-width="3" marker-end="url(#scene2-arrow-red)" opacity="0"/>
<line id="scene2-flow-arrow" x1="340" y1="340" x2="340" y2="220" stroke="#1565c0" stroke-width="3" marker-end="url(#scene2-arrow-blue)" opacity="0"/>
<!-- 步骤4元素 -->
<rect id="scene2-red-liquid-down" class="scene2-red-liquid" x="336" y="210" width="8" height="130" fill="#c62828" opacity="0"/>
<rect id="scene2-red-liquid-middle" class="scene2-red-liquid" x="340" y="206" width="40" height="8" fill="#c62828" opacity="0"/>
<rect id="scene2-red-liquid-b-neck" class="scene2-red-liquid" x="436" y="155" width="8" height="55" fill="#c62828" opacity="0"/>
<path id="scene2-red-liquid-b-body" class="scene2-red-liquid" d="M395,155 A45,45 0 0,0 485,155 Z" fill="#c62828" opacity="0"/>
<text id="scene2-label-phenol-red" class="scene2-label" x="500" y="230" font-size="14" fill="#c62828" opacity="0">酚酞变红——氨水呈碱性</text>
<!-- NH3分子 -->
<g id="scene2-molecule-group" class="scene2-molecule">
<circle cx="420" cy="95" r="3" fill="#c62828"/>
<circle cx="445" cy="90" r="3" fill="#c62828"/>
<circle cx="460" cy="105" r="3" fill="#c62828"/>
<circle cx="430" cy="125" r="3" fill="#c62828"/>
<circle cx="450" cy="130" r="3" fill="#c62828"/>
<circle cx="435" cy="110" r="3" fill="#c62828"/>
<circle cx="455" cy="115" r="3" fill="#c62828"/>
<circle cx="425" cy="105" r="3" fill="#c62828"/>
</g>
</svg>
<div id="scene2-controls">
<button id="scene2-btn-prev" disabled>◀ 上一步</button>
<span id="scene2-step-text">步骤 1/5</span>
<button id="scene2-btn-next">下一步 ▶</button>
</div>
</div>
<script>
(function(){
var currentStep=0;
var totalSteps=5;
var btnPrev=document.getElementById('scene2-btn-prev');
var btnNext=document.getElementById('scene2-btn-next');
var stepText=document.getElementById('scene2-step-text');
var moleculeGroup=document.getElementById('scene2-molecule-group');
var waterDrop=document.getElementById('scene2-water-drop');
var labelPhenolClear=document.getElementById('scene2-label-phenol-clear');
var labelNh3Soluble=document.getElementById('scene2-label-nh3-soluble');
var pressureArrow=document.getElementById('scene2-pressure-arrow');
var labelPressure=document.getElementById('scene2-label-pressure');
var pistonA=document.getElementById('scene2-piston-a');
var pistonB=document.getElementById('scene2-piston-b');
var labelAtm=document.getElementById('scene2-label-atm');
var atmArrow=document.getElementById('scene2-atm-arrow');
var flowArrow=document.getElementById('scene2-flow-arrow');
var redLiquidDown=document.getElementById('scene2-red-liquid-down');
var redLiquidMiddle=document.getElementById('scene2-red-liquid-middle');
var redLiquidBNeck=document.getElementById('scene2-red-liquid-b-neck');
var redLiquidBBody=document.getElementById('scene2-red-liquid-b-body');
var labelPhenolRed=document.getElementById('scene2-label-phenol-red');
function setOp(el,val){if(!el)return;el.style.opacity=val;if(val===0){el.style.display='none'}else{el.style.display=''}}
function renderStep(){
if(currentStep===0){
moleculeGroup.classList.remove('scene2-fade-out');moleculeGroup.style.opacity='1';moleculeGroup.style.display='';
setOp(waterDrop,0);setOp(labelNh3Soluble,0);setOp(pressureArrow,0);setOp(labelPressure,0);
pistonA.setAttribute('class','scene2-piston-closed');pistonB.setAttribute('class','scene2-piston-closed');
setOp(labelAtm,0);setOp(atmArrow,0);setOp(flowArrow,0);
setOp(redLiquidDown,0);setOp(redLiquidMiddle,0);setOp(redLiquidBNeck,0);setOp(redLiquidBBody,0);setOp(labelPhenolRed,0);
setOp(labelPhenolClear,1);waterDrop.classList.remove('scene2-drop-anim');
}else if(currentStep===1){
moleculeGroup.classList.add('scene2-fade-out');setOp(waterDrop,1);waterDrop.classList.add('scene2-drop-anim');
setOp(labelNh3Soluble,1);setOp(labelPhenolClear,1);setOp(pressureArrow,0);setOp(labelPressure,0);
pistonA.setAttribute('class','scene2-piston-closed');pistonB.setAttribute('class','scene2-piston-closed');
setOp(labelAtm,0);setOp(atmArrow,0);setOp(flowArrow,0);
setOp(redLiquidDown,0);setOp(redLiquidMiddle,0);setOp(redLiquidBNeck,0);setOp(redLiquidBBody,0);setOp(labelPhenolRed,0);
}else if(currentStep===2){
moleculeGroup.classList.add('scene2-fade-out');setOp(waterDrop,0);setOp(labelNh3Soluble,1);
setOp(pressureArrow,1);setOp(labelPressure,1);setOp(labelPhenolClear,1);
pistonA.setAttribute('class','scene2-piston-closed');pistonB.setAttribute('class','scene2-piston-closed');
setOp(labelAtm,0);setOp(atmArrow,0);setOp(flowArrow,0);
setOp(redLiquidDown,0);setOp(redLiquidMiddle,0);setOp(redLiquidBNeck,0);setOp(redLiquidBBody,0);setOp(labelPhenolRed,0);
waterDrop.classList.remove('scene2-drop-anim');
}else if(currentStep===3){
moleculeGroup.classList.add('scene2-fade-out');setOp(waterDrop,0);setOp(labelNh3Soluble,1);
setOp(pressureArrow,1);setOp(labelPressure,1);setOp(labelPhenolClear,1);
pistonA.setAttribute('class','scene2-piston-open');pistonB.setAttribute('class','scene2-piston-open');
setOp(labelAtm,1);setOp(atmArrow,1);setOp(flowArrow,1);
setOp(redLiquidDown,0);setOp(redLiquidMiddle,0);setOp(redLiquidBNeck,0);setOp(redLiquidBBody,0);setOp(labelPhenolRed,0);
waterDrop.classList.remove('scene2-drop-anim');
}else if(currentStep===4){
moleculeGroup.classList.add('scene2-fade-out');setOp(waterDrop,0);setOp(labelNh3Soluble,1);
setOp(pressureArrow,1);setOp(labelPressure,1);setOp(labelPhenolClear,0);
pistonA.setAttribute('class','scene2-piston-open');pistonB.setAttribute('class','scene2-piston-open');
setOp(labelAtm,1);setOp(atmArrow,1);setOp(flowArrow,1);
setOp(redLiquidDown,0.3);setOp(redLiquidMiddle,0.3);setOp(redLiquidBNeck,0.3);setOp(redLiquidBBody,0.3);setOp(labelPhenolRed,1);
waterDrop.classList.remove('scene2-drop-anim');
}
stepText.textContent='步骤 '+(currentStep+1)+'/'+totalSteps;
btnPrev.disabled=currentStep===0;
btnNext.disabled=currentStep===totalSteps-1;
}
btnPrev.addEventListener('click',function(){if(currentStep>0){currentStep--;renderStep()}});
btnNext.addEventListener('click',function(){if(currentStep<totalSteps-1){currentStep++;renderStep()}});
renderStep();
})();
</script>
</body>
</html>
