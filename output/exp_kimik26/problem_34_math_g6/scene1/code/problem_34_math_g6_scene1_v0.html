<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>长方形剪去正方形后的周长</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: Arial, Helvetica, sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 20px; z-index: 10; }
        #scene1-controls button {
            width: 100px; height: 30px; font-size: 14px; cursor: pointer;
            border: 1px solid #999; border-radius: 4px; background: #f0f0f0;
        }
        #scene1-controls button:disabled { opacity: 0.4; pointer-events: none; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 原长方形（步骤0） -->
            <rect id="scene1-original-rect" x="100" y="150" width="300" height="200" fill="none" stroke="#000000" stroke-width="2"/>

            <!-- 剪后轮廓线段（步骤1起显示） -->
            <line id="scene1-edge-top" x1="100" y1="150" x2="400" y2="150" stroke="#000000" stroke-width="2" style="display:none"/>
            <line id="scene1-edge-right-top" x1="400" y1="150" x2="400" y2="200" stroke="#000000" stroke-width="2" style="display:none"/>
            <line id="scene1-edge-right-bottom" x1="400" y1="300" x2="400" y2="350" stroke="#000000" stroke-width="2" style="display:none"/>
            <line id="scene1-edge-bottom" x1="100" y1="350" x2="400" y2="350" stroke="#000000" stroke-width="2" style="display:none"/>
            <line id="scene1-edge-left" x1="100" y1="150" x2="100" y2="350" stroke="#000000" stroke-width="2" style="display:none"/>

            <!-- 缺口边界（步骤1起显示） -->
            <line id="scene1-notch-top" x1="300" y1="200" x2="400" y2="200" stroke="#000000" stroke-width="2" style="display:none"/>
            <line id="scene1-notch-left" x1="300" y1="200" x2="300" y2="300" stroke="#000000" stroke-width="2" style="display:none"/>
            <line id="scene1-notch-bottom" x1="300" y1="300" x2="400" y2="300" stroke="#000000" stroke-width="2" style="display:none"/>

            <!-- 被剪去的原右侧边中间段（灰色虚线，步骤1-3显示） -->
            <line id="scene1-removed-edge" x1="400" y1="200" x2="400" y2="300" stroke="#888888" stroke-width="1.5" stroke-dasharray="6,4" style="display:none"/>

            <!-- 剪去区域填充 -->
            <rect id="scene1-cut-fill" x="300" y="200" width="100" height="100" fill="#e0e0e0" fill-opacity="0.2" stroke="none" style="display:none"/>

            <!-- 平移轨迹（步骤3显示） -->
            <line id="scene1-trace-line" x1="300" y1="250" x2="400" y2="250" stroke="#1565c0" stroke-width="2" stroke-dasharray="6,4" style="display:none"/>
            <polygon id="scene1-trace-arrow" points="400,250 390,245 390,255" fill="#1565c0" style="display:none"/>

            <!-- 平移动画线段（步骤3创建并动画） -->
            <line id="scene1-anim-line" x1="300" y1="200" x2="300" y2="300" stroke="#c62828" stroke-width="2.5" style="display:none"/>

            <!-- 尺寸标注 -->
            <text id="scene1-label-6cm" x="250" y="372" text-anchor="middle" font-size="14" fill="#000000">6cm</text>
            <text id="scene1-label-4cm" x="70" y="255" text-anchor="middle" font-size="14" fill="#000000">4cm</text>
            <text id="scene1-label-2cm-depth" x="350" y="175" text-anchor="middle" font-size="14" fill="#000000" style="display:none">2cm</text>
            <text id="scene1-label-2cm-height" x="275" y="255" text-anchor="middle" font-size="14" fill="#000000" style="display:none">2cm</text>

            <!-- 文本说明框 -->
            <rect id="scene1-text-panel" x="460" y="140" width="300" height="240" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="5"/>
            <foreignObject x="460" y="140" width="300" height="240">
                <div id="scene1-text-content" xmlns="http://www.w3.org/1999/xhtml" style="padding:12px 16px; font-family:Arial,Helvetica,sans-serif; font-size:14px; line-height:1.6; color:#000000;">
                    <div id="scene1-text-title" style="font-size:16px; font-weight:bold; margin-bottom:8px;">原长方形</div>
                    <div id="scene1-text-body">长 = 6 cm，宽 = 4 cm<br>原周长 = 2×(6+4) = 20 cm</div>
                </div>
            </foreignObject>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        let currentStep = 0;
        const totalSteps = 4;
        let animating = false;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');

        // 元素引用
        const els = {
            originalRect: document.getElementById('scene1-original-rect'),
            edgeTop: document.getElementById('scene1-edge-top'),
            edgeRightTop: document.getElementById('scene1-edge-right-top'),
            edgeRightBottom: document.getElementById('scene1-edge-right-bottom'),
            edgeBottom: document.getElementById('scene1-edge-bottom'),
            edgeLeft: document.getElementById('scene1-edge-left'),
            notchTop: document.getElementById('scene1-notch-top'),
            notchLeft: document.getElementById('scene1-notch-left'),
            notchBottom: document.getElementById('scene1-notch-bottom'),
            removedEdge: document.getElementById('scene1-removed-edge'),
            cutFill: document.getElementById('scene1-cut-fill'),
            traceLine: document.getElementById('scene1-trace-line'),
            traceArrow: document.getElementById('scene1-trace-arrow'),
            animLine: document.getElementById('scene1-anim-line'),
            label6cm: document.getElementById('scene1-label-6cm'),
            label4cm: document.getElementById('scene1-label-4cm'),
            label2cmDepth: document.getElementById('scene1-label-2cm-depth'),
            label2cmHeight: document.getElementById('scene1-label-2cm-height'),
            textTitle: document.getElementById('scene1-text-title'),
            textBody: document.getElementById('scene1-text-body')
        };

        function show(el) { if(el) { el.style.display = 'inline'; el.style.opacity = '1'; } }
        function hide(el) { if(el) { el.style.display = 'none'; } }

        function setStroke(el, color, width) {
            if(el) { el.setAttribute('stroke', color); el.setAttribute('stroke-width', width); }
        }

        function updateText(title, body, titleColor) {
            els.textTitle.textContent = title;
            if(titleColor) els.textTitle.style.color = titleColor;
            else els.textTitle.style.color = '#000000';
            els.textBody.innerHTML = body;
        }

        function renderStep() {
            // 更新按钮状态
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps;

            // 重置所有元素到默认状态
            hide(els.edgeTop); hide(els.edgeRightTop); hide(els.edgeRightBottom);
            hide(els.edgeBottom); hide(els.edgeLeft);
            hide(els.notchTop); hide(els.notchLeft); hide(els.notchBottom);
            hide(els.removedEdge); hide(els.cutFill);
            hide(els.traceLine); hide(els.traceArrow); hide(els.animLine);
            hide(els.label2cmDepth); hide(els.label2cmHeight);
            setStroke(els.notchTop, '#000000', '2');
            setStroke(els.notchLeft, '#000000', '2');
            setStroke(els.notchBottom, '#000000', '2');
            setStroke(els.animLine, '#c62828', '2.5');

            switch(currentStep) {
                case 0:
                    show(els.originalRect);
                    show(els.label6cm); show(els.label4cm);
                    updateText('原长方形', '长 = 6 cm，宽 = 4 cm<br>原周长 = 2×(6+4) = 20 cm');
                    break;
                case 1:
                    hide(els.originalRect);
                    show(els.edgeTop); show(els.edgeRightTop); show(els.edgeRightBottom);
                    show(els.edgeBottom); show(els.edgeLeft);
                    show(els.notchTop); show(els.notchLeft); show(els.notchBottom);
                    show(els.removedEdge); show(els.cutFill);
                    show(els.label6cm); show(els.label4cm);
                    show(els.label2cmDepth); show(els.label2cmHeight);
                    updateText('剪去正方形', '缺口：2 cm × 2 cm<br>观察：哪些边消失了？<br>哪些边是新出现的？');
                    break;
                case 2:
                    hide(els.originalRect);
                    show(els.edgeTop); show(els.edgeRightTop); show(els.edgeRightBottom);
                    show(els.edgeBottom); show(els.edgeLeft);
                    show(els.notchTop); show(els.notchLeft); show(els.notchBottom);
                    show(els.removedEdge); show(els.cutFill);
                    show(els.label6cm); show(els.label4cm);
                    show(els.label2cmDepth); show(els.label2cmHeight);
                    // 红色高亮新增边界
                    setStroke(els.notchTop, '#c62828', '2.5');
                    setStroke(els.notchLeft, '#c62828', '2.5');
                    setStroke(els.notchBottom, '#c62828', '2.5');
                    updateText('边界分析', '上：6 + 下：6 + 左：4<br>右上：1 + 右下：1<br>内上：2 + 内左：2 + 内下：2<br>周长 = 24 cm');
                    break;
                case 3:
                    hide(els.originalRect);
                    show(els.edgeTop); show(els.edgeRightTop); show(els.edgeRightBottom);
                    show(els.edgeBottom); show(els.edgeLeft);
                    show(els.notchTop); show(els.notchLeft); show(els.notchBottom);
                    show(els.removedEdge); show(els.cutFill);
                    show(els.label6cm); show(els.label4cm);
                    show(els.label2cmDepth); show(els.label2cmHeight);
                    show(els.traceLine); show(els.traceArrow);
                    // 缺口边界保持红色
                    setStroke(els.notchTop, '#c62828', '2.5');
                    setStroke(els.notchLeft, '#c62828', '2.5');
                    setStroke(els.notchBottom, '#c62828', '2.5');
                    updateText('平移法', '将内左竖边（2cm）<br>向右平移填补缺口<br>→ 右侧竖直总长不变<br>新增水平边：2 + 2 = 4 cm');
                    // 启动平移动画
                    if(!animating) {
                        animating = true;
                        runTranslateAnimation();
                    }
                    break;
                case 4:
                    hide(els.originalRect);
                    show(els.edgeTop); show(els.edgeRightTop); show(els.edgeRightBottom);
                    show(els.edgeBottom); show(els.edgeLeft);
                    show(els.notchTop); show(els.notchBottom);
                    hide(els.notchLeft);
                    hide(els.removedEdge);
                    show(els.cutFill);
                    show(els.label6cm); show(els.label4cm);
                    show(els.label2cmDepth); show(els.label2cmHeight);
                    hide(els.traceLine); hide(els.traceArrow);
                    show(els.animLine);
                    // 所有边界恢复黑色
                    setStroke(els.notchTop, '#000000', '2');
                    setStroke(els.notchBottom, '#000000', '2');
                    setStroke(els.animLine, '#000000', '2');
                    els.animLine.setAttribute('x1', '400');
                    els.animLine.setAttribute('x2', '400');
                    updateText('得出结论', '周长 = 原周长 + 新增<br>= 20 + 4<br>= <span style="color:#2e7d32; font-weight:bold;">24（厘米）</span><br><span style="color:#2e7d32; font-weight:bold; font-size:16px;">答案：D．24</span>', '#2e7d32');
                    break;
            }
        }

        function runTranslateAnimation() {
            const startX = 300;
            const endX = 400;
            const duration = 800;
            const startTime = performance.now();

            show(els.animLine);
            els.animLine.setAttribute('x1', startX);
            els.animLine.setAttribute('x2', startX);

            function frame(now) {
                const elapsed = now - startTime;
                let t = Math.min(elapsed / duration, 1);
                // easeOut cubic
                t = 1 - Math.pow(1 - t, 3);
                const x = startX + (endX - startX) * t;
                els.animLine.setAttribute('x1', x);
                els.animLine.setAttribute('x2', x);

                if(t < 1) {
                    requestAnimationFrame(frame);
                } else {
                    // 动画完成后的样式调整
                    setStroke(els.animLine, '#000000', '2');
                    hide(els.removedEdge);
                    hide(els.notchLeft);
                    animating = false;
                }
            }
            requestAnimationFrame(frame);
        }

        btnPrev.addEventListener('click', function() {
            if(currentStep > 0) {
                currentStep--;
                animating = false;
                renderStep();
            }
        });

        btnNext.addEventListener('click', function() {
            if(currentStep < totalSteps) {
                currentStep++;
                animating = false;
                renderStep();
            }
        });

        // 初始渲染
        renderStep();
    })();
    </script>
</body>
</html>
