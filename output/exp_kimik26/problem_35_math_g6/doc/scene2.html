<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圆剪拼近似长方形</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" style="position:absolute; top:0; left:0;">
            <!-- 左侧圆区域 -->
            <g id="scene2-circle-group">
                <!-- 扇形填充（底层） -->
                <g id="scene2-circle-sectors"></g>
                <!-- 圆轮廓 -->
                <circle id="scene2-circle" cx="200" cy="185" r="80" fill="none" stroke="#000000" stroke-width="2"/>
                <!-- 分割线 -->
                <g id="scene2-circle-lines"></g>
                <!-- 半径线段 -->
                <line x1="200" y1="185" x2="280" y2="185" stroke="#000000" stroke-width="1"/>
                <!-- 圆心标记（移到圆下方避免重叠） -->
                <text x="205" y="275" font-size="14" fill="#000000" font-family="serif" font-style="italic">O</text>
                <!-- 半径标注（移到圆右侧避免重叠） -->
                <text x="285" y="182" font-size="14" fill="#c62828">r = 10cm</text>
                <!-- 圆上方份数标签 -->
                <text id="scene2-n-label" x="200" y="90" font-size="16" fill="#000000" text-anchor="middle" font-weight="bold">n = 16</text>
            </g>

            <!-- 右侧拼合图形区域 -->
            <g id="scene2-rect-group">
                <!-- 填充背景 -->
                <rect x="440" y="145" width="251" height="80" fill="#1565c0" fill-opacity="0.15" stroke="none"/>
                <!-- 外框 -->
                <rect x="440" y="145" width="251" height="80" fill="none" stroke="#000000" stroke-width="2"/>
                <!-- 上边缘弧 -->
                <g id="scene2-rect-top-arcs"></g>
                <!-- 下边缘弧 -->
                <g id="scene2-rect-bottom-arcs"></g>
                <!-- 内部锯齿线 -->
                <path id="scene2-rect-zigzag" fill="none" stroke="#000000" stroke-width="1"/>
                <!-- 标签（上移/下移避免与 n=4 时的弧重叠） -->
                <text x="565" y="105" font-size="14" fill="#000000" text-anchor="middle">近似长方形</text>
                <text x="565" y="275" font-size="14" fill="#1565c0" text-anchor="middle">长 = πr = 31.4cm</text>
                <text x="690" y="185" font-size="14" fill="#c62828" text-anchor="start">宽 = r = 10cm</text>
            </g>
        </svg>

        <!-- 控件栏 -->
        <div id="scene2-controls">
            <div style="display:flex; align-items:center; gap:10px; background:#f5f5f5; padding:8px 16px; border-radius:8px;">
                <span style="font-size:14px; color:#333;">份数 n：</span>
                <input id="scene2-slider-n" type="range" min="4" max="64" step="4" value="16" style="width:300px;">
                <span id="scene2-slider-value" style="font-size:14px; color:#1565c0; font-weight:bold; min-width:50px;">n = 16</span>
            </div>
        </div>

        <!-- 数值面板 -->
        <div id="scene2-panel" style="position:absolute; bottom:60px; left:250px; width:300px; height:80px; background:#e3f2fd; border:1px solid #1565c0; border-radius:8px; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:4px;">
            <div style="font-size:14px; color:#000000;">长 ≈ πr = 31.4 cm</div>
            <div style="font-size:14px; color:#000000;">宽 = r = 10 cm</div>
            <div style="font-size:14px; color:#2e7d32; font-weight:bold;">周长 = 82.8 cm</div>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2 实现：圆剪拼近似长方形
        // 常量定义
        var cx = 200, cy = 185, r = 80; // 圆心和半径（8px/cm，r=10cm）
        var x0 = 440, y0 = 145, w = 251, h = 80; // 拼合图形左上角和尺寸
        var y1 = y0 + h; // 225

        var slider = document.getElementById('scene2-slider-n');
        var sliderValue = document.getElementById('scene2-slider-value');
        var nLabel = document.getElementById('scene2-n-label');
        var circleLines = document.getElementById('scene2-circle-lines');
        var circleSectors = document.getElementById('scene2-circle-sectors');
        var topArcs = document.getElementById('scene2-rect-top-arcs');
        var bottomArcs = document.getElementById('scene2-rect-bottom-arcs');
        var zigzag = document.getElementById('scene2-rect-zigzag');

        function drawCircle(n) {
            // 清空
            circleLines.innerHTML = '';
            circleSectors.innerHTML = '';

            var angleStep = 2 * Math.PI / n;

            for (var i = 0; i < n; i++) {
                var angle = i * angleStep;
                var x = cx + r * Math.cos(angle);
                var y = cy + r * Math.sin(angle);

                // 分割线
                var line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', cx);
                line.setAttribute('y1', cy);
                line.setAttribute('x2', x);
                line.setAttribute('y2', y);
                line.setAttribute('stroke', '#888888');
                line.setAttribute('stroke-width', '1');
                line.setAttribute('stroke-dasharray', '4,4');
                circleLines.appendChild(line);

                // 扇形填充
                var nextAngle = (i + 1) * angleStep;
                var x2 = cx + r * Math.cos(nextAngle);
                var y2 = cy + r * Math.sin(nextAngle);
                var largeArc = angleStep > Math.PI ? 1 : 0;

                var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                var d = 'M ' + cx + ',' + cy + ' L ' + x + ',' + y +
                        ' A ' + r + ',' + r + ' 0 ' + largeArc + ',1 ' + x2 + ',' + y2 + ' Z';
                path.setAttribute('d', d);
                path.setAttribute('fill', '#1565c0');
                path.setAttribute('fill-opacity', '0.15');
                path.setAttribute('stroke', 'none');
                circleSectors.appendChild(path);
            }
        }

        function drawRectShape(n) {
            // 清空
            topArcs.innerHTML = '';
            bottomArcs.innerHTML = '';

            var segW = w / n;
            var A = 256 / n;

            // 上边缘弧（偶数索引，每个弧宽 segW）
            for (var i = 0; i < n; i += 2) {
                var sx = x0 + i * segW;
                var ex = x0 + (i + 1) * segW;
                var cx_ = x0 + (i + 0.5) * segW;
                var cy_ = y0 - A;

                var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                var d = 'M ' + sx + ',' + y0 + ' Q ' + cx_ + ',' + cy_ + ' ' + ex + ',' + y0;
                path.setAttribute('d', d);
                path.setAttribute('fill', 'none');
                path.setAttribute('stroke', '#1565c0');
                path.setAttribute('stroke-width', '2');
                topArcs.appendChild(path);
            }

            // 下边缘弧（奇数索引，每个弧宽 segW）
            for (var i = 1; i < n; i += 2) {
                var sx = x0 + i * segW;
                var ex = x0 + (i + 1) * segW;
                var cx_ = x0 + (i + 0.5) * segW;
                var cy_ = y1 + A;

                var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                var d = 'M ' + sx + ',' + y1 + ' Q ' + cx_ + ',' + cy_ + ' ' + ex + ',' + y1;
                path.setAttribute('d', d);
                path.setAttribute('fill', 'none');
                path.setAttribute('stroke', '#c62828');
                path.setAttribute('stroke-width', '2');
                bottomArcs.appendChild(path);
            }

            // 内部锯齿线（ sector 分界线）
            var zigzagD = 'M ' + x0 + ',' + y0;
            for (var i = 1; i <= n; i++) {
                var px = x0 + i * segW;
                var py = (i % 2 === 1) ? y1 : y0;
                zigzagD += ' L ' + px + ',' + py;
            }
            zigzag.setAttribute('d', zigzagD);
        }

        function update(n) {
            n = parseInt(n);
            sliderValue.textContent = 'n = ' + n;
            nLabel.textContent = 'n = ' + n;
            drawCircle(n);
            drawRectShape(n);
        }

        slider.addEventListener('input', function(e) {
            update(e.target.value);
        });

        // 初始绘制
        update(16);
    })();
    </script>
</body>
</html>
