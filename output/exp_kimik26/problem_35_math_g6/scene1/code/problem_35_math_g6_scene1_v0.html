<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圆剪拼成长方形</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            padding: 6px 16px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #f5f5f5;
        }
        #scene1-controls button:hover { background: #e0e0e0; }
        #scene1-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 14px; color: #333; min-width: 70px; text-align: center; }

        /* 动画类 */
        .scene1-fade-out-right {
            transform: translateX(80px);
            opacity: 0;
            transition: all 0.5s ease;
        }
        .scene1-fade-in {
            opacity: 1 !important;
            transition: all 0.5s ease;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <defs>
                <!-- 蓝色箭头 marker -->
                <marker id="scene1-arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#1565c0"/>
                </marker>
                <marker id="scene1-arrow-blue-start" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M9,0 L9,6 L0,3 z" fill="#1565c0"/>
                </marker>
                <!-- 红色箭头 marker -->
                <marker id="scene1-arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#c62828"/>
                </marker>
                <marker id="scene1-arrow-red-start" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M9,0 L9,6 L0,3 z" fill="#c62828"/>
                </marker>
            </defs>

            <!-- ========== 圆相关元素 ========== -->
            <g id="scene1-circle-group">
                <!-- 圆轮廓 -->
                <circle id="scene1-circle" cx="180" cy="210" r="100" stroke="#000000" fill="none" stroke-width="2"/>
                <!-- 16条等分线 -->
                <g id="scene1-dividers" style="display:none; opacity:0;"></g>
                <!-- 16个扇形 -->
                <g id="scene1-sectors" style="display:none; opacity:0;"></g>
            </g>

            <!-- 半径标注线 -->
            <line id="scene1-radius-line" x1="180" y1="210" x2="280" y2="210" stroke="#c62828" stroke-width="2" style="display:none; opacity:0;"/>
            <circle id="scene1-radius-dot1" cx="180" cy="210" r="3" fill="#c62828" style="display:none; opacity:0;"/>
            <circle id="scene1-radius-dot2" cx="280" cy="210" r="3" fill="#c62828" style="display:none; opacity:0;"/>
            <!-- 半径标签 -->
            <text id="scene1-radius-label" x="260" y="90" font-size="14" fill="#000000" text-anchor="middle" style="display:none; opacity:0;">r = 10 cm</text>

            <!-- 过渡箭头 -->
            <path id="scene1-transition-arrow" d="M300,210 L370,210 M360,205 L370,210 L360,215" stroke="#000000" stroke-width="2" fill="none" style="display:none; opacity:0;"/>

            <!-- ========== 长方形相关元素 ========== -->
            <g id="scene1-rect-group" style="display:none; opacity:0;">
                <!-- 长方形外轮廓 -->
                <rect id="scene1-rect-outline" x="400" y="160" width="314" height="100" stroke="#000000" fill="none" stroke-width="2"/>
                <!-- 长方形内部锯齿中线 -->
                <polyline id="scene1-rect-sawtooth" fill="none" stroke="#888888" stroke-width="1"/>
                <!-- 上半齿 -->
                <g id="scene1-teeth-top"></g>
                <!-- 下半齿 -->
                <g id="scene1-teeth-bottom"></g>
            </g>

            <!-- ========== 长宽标注 ========== -->
            <!-- 长标注双箭头 -->
            <line id="scene1-arrow-length" x1="400" y1="285" x2="714" y2="285" stroke="#1565c0" stroke-width="2"
                  marker-start="url(#scene1-arrow-blue-start)" marker-end="url(#scene1-arrow-blue)" style="display:none; opacity:0;"/>
            <text id="scene1-label-length" x="557" y="355" font-size="14" fill="#1565c0" text-anchor="middle" style="display:none; opacity:0;">长 = πr = 31.4 cm</text>

            <!-- 宽标注双箭头 -->
            <line id="scene1-arrow-width" x1="720" y1="160" x2="720" y2="260" stroke="#c62828" stroke-width="2"
                  marker-start="url(#scene1-arrow-red-start)" marker-end="url(#scene1-arrow-red)" style="display:none; opacity:0;"/>
            <text id="scene1-label-width" x="390" y="210" font-size="14" fill="#c62828" text-anchor="end" style="display:none; opacity:0;">宽 = r = 10 cm</text>

            <!-- 弧长指示线（上） -->
            <line id="scene1-arc-indicator-top" x1="480" y1="160" x2="480" y2="130" stroke="#1565c0" stroke-width="1" stroke-dasharray="4,4" style="display:none; opacity:0;"/>
            <text id="scene1-arc-label-top" x="480" y="120" font-size="12" fill="#1565c0" text-anchor="middle" style="display:none; opacity:0;">= 半圆周长</text>

            <!-- 弧长指示线（下） -->
            <line id="scene1-arc-indicator-bottom" x1="640" y1="260" x2="640" y2="290" stroke="#c62828" stroke-width="1" stroke-dasharray="4,4" style="display:none; opacity:0;"/>
            <text id="scene1-arc-label-bottom" x="640" y="320" font-size="12" fill="#c62828" text-anchor="middle" style="display:none; opacity:0;">= 半圆周长</text>

            <!-- ========== 算式与答案 ========== -->
            <text id="scene1-formula" x="400" y="380" font-size="18" fill="#000000" text-anchor="start" style="display:none; opacity:0;">2 × (31.4 + 10) = 82.8 (cm)</text>
            <text id="scene1-answer-d" x="680" y="380" font-size="18" fill="#2e7d32" font-weight="bold" text-anchor="start" style="display:none; opacity:0;">D. 82.8</text>

            <!-- ========== 易错提示 ========== -->
            <text id="scene1-diff-text" x="400" y="418" font-size="14" fill="#c62828" text-anchor="start" style="display:none; opacity:0;">82.8 − 62.8 = 20 = 2r</text>
            <text id="scene1-hint-text" x="400" y="450" font-size="14" fill="#c62828" text-anchor="start" style="display:none; opacity:0;">注意：易错选 B（圆周长 62.8 cm）</text>

            <!-- 红色遮罩 -->
            <rect id="scene1-mask-left" x="400" y="160" width="6" height="100" fill="#c62828" opacity="0.3" style="display:none; opacity:0;"/>
            <rect id="scene1-mask-right" x="708" y="160" width="6" height="100" fill="#c62828" opacity="0.3" style="display:none; opacity:0;"/>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-prev-btn">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/6</span>
            <button id="scene1-next-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        const TOTAL_STEPS = 6;
        let currentStep = 0;

        // 元素引用
        const els = {
            circleGroup: document.getElementById('scene1-circle-group'),
            circle: document.getElementById('scene1-circle'),
            dividers: document.getElementById('scene1-dividers'),
            sectors: document.getElementById('scene1-sectors'),
            radiusLine: document.getElementById('scene1-radius-line'),
            radiusDot1: document.getElementById('scene1-radius-dot1'),
            radiusDot2: document.getElementById('scene1-radius-dot2'),
            radiusLabel: document.getElementById('scene1-radius-label'),
            transitionArrow: document.getElementById('scene1-transition-arrow'),
            rectGroup: document.getElementById('scene1-rect-group'),
            rectOutline: document.getElementById('scene1-rect-outline'),
            arrowLength: document.getElementById('scene1-arrow-length'),
            labelLength: document.getElementById('scene1-label-length'),
            arrowWidth: document.getElementById('scene1-arrow-width'),
            labelWidth: document.getElementById('scene1-label-width'),
            arcIndicatorTop: document.getElementById('scene1-arc-indicator-top'),
            arcLabelTop: document.getElementById('scene1-arc-label-top'),
            arcIndicatorBottom: document.getElementById('scene1-arc-indicator-bottom'),
            arcLabelBottom: document.getElementById('scene1-arc-label-bottom'),
            formula: document.getElementById('scene1-formula'),
            answerD: document.getElementById('scene1-answer-d'),
            diffText: document.getElementById('scene1-diff-text'),
            hintText: document.getElementById('scene1-hint-text'),
            maskLeft: document.getElementById('scene1-mask-left'),
            maskRight: document.getElementById('scene1-mask-right'),
            prevBtn: document.getElementById('scene1-prev-btn'),
            nextBtn: document.getElementById('scene1-next-btn'),
            stepIndicator: document.getElementById('scene1-step-indicator')
        };

        // 工具函数：显示/隐藏元素
        function show(el) {
            if (!el) return;
            el.style.display = '';
            el.style.opacity = '1';
        }
        function hide(el) {
            if (!el) return;
            el.style.display = 'none';
            el.style.opacity = '0';
        }
        function setOpacity(el, val) {
            if (!el) return;
            el.style.opacity = String(val);
        }

        // 生成16条等分线
        function generateDividers() {
            const cx = 180, cy = 210, r = 100;
            let html = '';
            for (let i = 0; i < 16; i++) {
                const angle = (i * 22.5) * Math.PI / 180;
                const x2 = cx + r * Math.cos(angle);
                const y2 = cy + r * Math.sin(angle);
                html += `<line x1="${cx}" y1="${cy}" x2="${x2}" y2="${y2}" stroke="#888888" stroke-width="1"/>`;
            }
            els.dividers.innerHTML = html;
        }

        // 生成16个扇形
        function generateSectors() {
            const cx = 180, cy = 210, r = 100;
            let html = '';
            for (let i = 0; i < 16; i++) {
                const startAngle = (i * 22.5) * Math.PI / 180;
                const endAngle = ((i + 1) * 22.5) * Math.PI / 180;
                const x1 = cx + r * Math.cos(startAngle);
                const y1 = cy + r * Math.sin(startAngle);
                const x2 = cx + r * Math.cos(endAngle);
                const y2 = cy + r * Math.sin(endAngle);
                const fill = (i % 2 === 0) ? '#1565c0' : '#e0e0e0';
                // 大弧标志：角度小于180度用0
                html += `<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 0,1 ${x2},${y2} Z" fill="${fill}" fill-opacity="0.2" stroke="none"/>`;
            }
            els.sectors.innerHTML = html;
        }

        // 生成长方形锯齿中线和齿
        function generateRectTeeth() {
            const x0 = 400, yTop = 160, yBottom = 260;
            const totalWidth = 314;
            const n = 16;
            const toothW = totalWidth / n; // 19.625

            // 锯齿中线 polyline
            let points = '';
            for (let i = 0; i <= n; i++) {
                const x = x0 + i * toothW;
                const y = (i % 2 === 0) ? yTop : yBottom;
                points += `${x},${y} `;
            }
            document.getElementById('scene1-rect-sawtooth').setAttribute('points', points.trim());

            // 上半齿（顶点朝下，底边在上边）
            let topHtml = '';
            for (let k = 0; k < 8; k++) {
                const i = k * 2;
                const xL = x0 + i * toothW;
                const xR = x0 + (i + 1) * toothW;
                const xV = x0 + (i + 0.5) * toothW;
                const fill = (k % 2 === 0) ? '#1565c0' : '#e0e0e0';
                topHtml += `<path d="M${xL},${yTop} L${xR},${yTop} L${xV},${(yTop+yBottom)/2} Z" fill="${fill}" fill-opacity="0.2" stroke="none"/>`;
            }
            document.getElementById('scene1-teeth-top').innerHTML = topHtml;

            // 下半齿（顶点朝上，底边在下边）
            let bottomHtml = '';
            for (let k = 0; k < 8; k++) {
                const i = k * 2;
                const xL = x0 + i * toothW;
                const xR = x0 + (i + 1) * toothW;
                const xV = x0 + (i + 0.5) * toothW;
                const fill = (k % 2 === 0) ? '#e0e0e0' : '#1565c0';
                bottomHtml += `<path d="M${xL},${yBottom} L${xR},${yBottom} L${xV},${(yTop+yBottom)/2} Z" fill="${fill}" fill-opacity="0.2" stroke="none"/>`;
            }
            document.getElementById('scene1-teeth-bottom').innerHTML = bottomHtml;
        }

        // 渲染步骤
        function renderStep() {
            // 更新指示器
            els.stepIndicator.textContent = `步骤 ${currentStep + 1}/${TOTAL_STEPS}`;
            els.prevBtn.disabled = (currentStep === 0);
            els.nextBtn.disabled = (currentStep === TOTAL_STEPS - 1);

            // 先清除动画类
            els.circleGroup.classList.remove('scene1-fade-out-right');
            els.rectGroup.classList.remove('scene1-fade-in');

            // 步骤0：显示圆轮廓、半径标注
            if (currentStep === 0) {
                show(els.circle);
                hide(els.dividers);
                hide(els.sectors);
                show(els.radiusLine);
                show(els.radiusDot1);
                show(els.radiusDot2);
                show(els.radiusLabel);
                hide(els.transitionArrow);
                hide(els.rectGroup);
                hide(els.arrowLength);
                hide(els.labelLength);
                hide(els.arrowWidth);
                hide(els.labelWidth);
                hide(els.arcIndicatorTop);
                hide(els.arcLabelTop);
                hide(els.arcIndicatorBottom);
                hide(els.arcLabelBottom);
                hide(els.formula);
                hide(els.answerD);
                hide(els.diffText);
                hide(els.hintText);
                hide(els.maskLeft);
                hide(els.maskRight);
                els.rectOutline.setAttribute('stroke-width', '2');
                els.rectOutline.setAttribute('stroke', '#000000');
            }
            // 步骤1：显示16等分扇形
            else if (currentStep === 1) {
                show(els.circle);
                show(els.dividers);
                show(els.sectors);
                show(els.radiusLine);
                show(els.radiusDot1);
                show(els.radiusDot2);
                show(els.radiusLabel);
                hide(els.transitionArrow);
                hide(els.rectGroup);
                hide(els.arrowLength);
                hide(els.labelLength);
                hide(els.arrowWidth);
                hide(els.labelWidth);
                hide(els.arcIndicatorTop);
                hide(els.arcLabelTop);
                hide(els.arcIndicatorBottom);
                hide(els.arcLabelBottom);
                hide(els.formula);
                hide(els.answerD);
                hide(els.diffText);
                hide(els.hintText);
                hide(els.maskLeft);
                hide(els.maskRight);
                els.rectOutline.setAttribute('stroke-width', '2');
                els.rectOutline.setAttribute('stroke', '#000000');
            }
            // 步骤2：过渡动画，圆淡出，长方形淡入
            else if (currentStep === 2) {
                show(els.circle);
                show(els.dividers);
                show(els.sectors);
                show(els.radiusLine);
                show(els.radiusDot1);
                show(els.radiusDot2);
                show(els.radiusLabel);
                show(els.transitionArrow);
                show(els.rectGroup);
                hide(els.arrowLength);
                hide(els.labelLength);
                hide(els.arrowWidth);
                hide(els.labelWidth);
                hide(els.arcIndicatorTop);
                hide(els.arcLabelTop);
                hide(els.arcIndicatorBottom);
                hide(els.arcLabelBottom);
                hide(els.formula);
                hide(els.answerD);
                hide(els.diffText);
                hide(els.hintText);
                hide(els.maskLeft);
                hide(els.maskRight);
                els.rectOutline.setAttribute('stroke-width', '2');
                els.rectOutline.setAttribute('stroke', '#000000');

                // 触发动画
                requestAnimationFrame(() => {
                    els.circleGroup.classList.add('scene1-fade-out-right');
                    els.rectGroup.classList.add('scene1-fade-in');
                });

                // 动画结束后隐藏圆组
                setTimeout(() => {
                    if (currentStep === 2) {
                        hide(els.circleGroup);
                    }
                }, 500);
            }
            // 步骤3：显示长宽标注
            else if (currentStep === 3) {
                hide(els.circleGroup);
                hide(els.transitionArrow);
                show(els.rectGroup);
                show(els.arrowLength);
                show(els.labelLength);
                show(els.arrowWidth);
                show(els.labelWidth);
                show(els.arcIndicatorTop);
                show(els.arcLabelTop);
                show(els.arcIndicatorBottom);
                show(els.arcLabelBottom);
                hide(els.formula);
                hide(els.answerD);
                hide(els.diffText);
                hide(els.hintText);
                hide(els.maskLeft);
                hide(els.maskRight);
                // 长方形上下长边加粗蓝色，左右宽边加粗红色
                els.rectOutline.setAttribute('stroke-width', '2');
                els.rectOutline.setAttribute('stroke', '#000000');
            }
            // 步骤4：显示算式和答案
            else if (currentStep === 4) {
                hide(els.circleGroup);
                hide(els.transitionArrow);
                show(els.rectGroup);
                show(els.arrowLength);
                show(els.labelLength);
                show(els.arrowWidth);
                show(els.labelWidth);
                show(els.arcIndicatorTop);
                show(els.arcLabelTop);
                show(els.arcIndicatorBottom);
                show(els.arcLabelBottom);
                show(els.formula);
                show(els.answerD);
                hide(els.diffText);
                hide(els.hintText);
                hide(els.maskLeft);
                hide(els.maskRight);
                // 长方形外轮廓整体加粗红色
                els.rectOutline.setAttribute('stroke', '#c62828');
                els.rectOutline.setAttribute('stroke-width', '3');
            }
            // 步骤5：显示易错提示和遮罩
            else if (currentStep === 5) {
                hide(els.circleGroup);
                hide(els.transitionArrow);
                show(els.rectGroup);
                show(els.arrowLength);
                show(els.labelLength);
                show(els.arrowWidth);
                show(els.labelWidth);
                show(els.arcIndicatorTop);
                show(els.arcLabelTop);
                show(els.arcIndicatorBottom);
                show(els.arcLabelBottom);
                show(els.formula);
                show(els.answerD);
                show(els.diffText);
                show(els.hintText);
                show(els.maskLeft);
                show(els.maskRight);
                els.rectOutline.setAttribute('stroke', '#c62828');
                els.rectOutline.setAttribute('stroke-width', '3');
            }
        }

        // 初始化
        generateDividers();
        generateSectors();
        generateRectTeeth();
        renderStep();

        // 事件绑定
        els.prevBtn.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        });
        els.nextBtn.addEventListener('click', () => {
            if (currentStep < TOTAL_STEPS - 1) {
                currentStep++;
                renderStep();
            }
        });
    })();
    </script>
</body>
</html>
