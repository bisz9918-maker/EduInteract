<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小旗旋转 - 场景1</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            padding: 6px 16px; font-size: 14px; cursor: pointer;
            border: 1px solid #ccc; border-radius: 4px; background: #f5f5f5;
        }
        #scene1-controls button:hover { background: #e0e0e0; }
        #scene1-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene1-step-text { position: absolute; bottom: 2px; left: 0; right: 0; text-align: center; font-size: 13px; color: #666; z-index: 10; }
        .scene1-hidden { display: none; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 坐标网格 -->
            <g id="scene1-grid">
                <!-- 竖线 x=0~10 -->
                <g stroke="#888" stroke-width="0.5" stroke-dasharray="3,3">
                    <line x1="100" y1="120" x2="100" y2="420"/>
                    <line x1="130" y1="120" x2="130" y2="420"/>
                    <line x1="160" y1="120" x2="160" y2="420"/>
                    <line x1="190" y1="120" x2="190" y2="420"/>
                    <line x1="220" y1="120" x2="220" y2="420"/>
                    <line x1="250" y1="120" x2="250" y2="420"/>
                    <line x1="280" y1="120" x2="280" y2="420"/>
                    <line x1="310" y1="120" x2="310" y2="420"/>
                    <line x1="340" y1="120" x2="340" y2="420"/>
                    <line x1="370" y1="120" x2="370" y2="420"/>
                    <line x1="400" y1="120" x2="400" y2="420"/>
                </g>
                <!-- 横线 y=0~10 -->
                <g stroke="#888" stroke-width="0.5" stroke-dasharray="3,3">
                    <line x1="100" y1="420" x2="400" y2="420"/>
                    <line x1="100" y1="390" x2="400" y2="390"/>
                    <line x1="100" y1="360" x2="400" y2="360"/>
                    <line x1="100" y1="330" x2="400" y2="330"/>
                    <line x1="100" y1="300" x2="400" y2="300"/>
                    <line x1="100" y1="270" x2="400" y2="270"/>
                    <line x1="100" y1="240" x2="400" y2="240"/>
                    <line x1="100" y1="210" x2="400" y2="210"/>
                    <line x1="100" y1="180" x2="400" y2="180"/>
                    <line x1="100" y1="150" x2="400" y2="150"/>
                    <line x1="100" y1="120" x2="400" y2="120"/>
                </g>
            </g>

            <!-- 坐标轴 -->
            <g id="scene1-axes">
                <line x1="90" y1="420" x2="410" y2="420" stroke="#000" stroke-width="2"/>
                <line x1="100" y1="430" x2="100" y2="110" stroke="#000" stroke-width="2"/>
                <!-- x轴箭头 -->
                <polygon points="410,420 400,415 400,425" fill="#000"/>
                <!-- y轴箭头 -->
                <polygon points="100,110 95,120 105,120" fill="#000"/>
            </g>

            <!-- 刻度标签 -->
            <g id="scene1-tick-labels" font-size="12" fill="#000" text-anchor="middle">
                <text x="100" y="440">0</text>
                <text x="130" y="440">1</text>
                <text x="160" y="440">2</text>
                <text x="190" y="440">3</text>
                <text x="220" y="440">4</text>
                <text x="250" y="440">5</text>
                <text x="280" y="440">6</text>
                <text x="310" y="440">7</text>
                <text x="340" y="440">8</text>
                <text x="370" y="440">9</text>
                <text x="400" y="440">10</text>
            </g>
            <g id="scene1-tick-labels-y" font-size="12" fill="#000" text-anchor="end">
                <!-- 将y轴0向左移，避免与x轴0拥挤 -->
                <text x="82" y="424">0</text>
                <text x="90" y="394">1</text>
                <text x="90" y="364">2</text>
                <text x="90" y="334">3</text>
                <text x="90" y="304">4</text>
                <text x="90" y="274">5</text>
                <text x="90" y="244">6</text>
                <text x="90" y="214">7</text>
                <text x="90" y="184">8</text>
                <text x="90" y="154">9</text>
                <text x="90" y="124">10</text>
            </g>

            <!-- 原始小旗 -->
            <g id="scene1-flag-original">
                <!-- 旗杆 -->
                <line x1="250" y1="330" x2="250" y2="210" stroke="#000" stroke-width="1.5"/>
                <!-- 旗面 -->
                <polygon points="250,210 190,210 250,240" fill="rgba(0,0,0,0.1)" stroke="#000" stroke-width="1.5"/>
            </g>

            <!-- 旋转后小旗 (步骤4起显示) -->
            <g id="scene1-flag-rotated" class="scene1-hidden">
                <!-- 旗杆 -->
                <line x1="250" y1="330" x2="370" y2="330" stroke="#c62828" stroke-width="1.5"/>
                <!-- 旗面 -->
                <polygon points="370,330 370,270 340,330" fill="rgba(198,40,40,0.2)" stroke="#c62828" stroke-width="1.5"/>
            </g>

            <!-- O点 -->
            <g id="scene1-point-o">
                <circle cx="250" cy="330" r="6" fill="#000" stroke="none"/>
            </g>
            <!-- O点蓝色描边高亮 (步骤1起) -->
            <g id="scene1-point-o-highlight" class="scene1-hidden">
                <circle cx="250" cy="330" r="8" fill="none" stroke="#1565c0" stroke-width="2"/>
            </g>

            <!-- P点蓝色小圆点高亮 (步骤1起) -->
            <g id="scene1-point-p-highlight" class="scene1-hidden">
                <circle cx="250" cy="210" r="5" fill="none" stroke="#1565c0" stroke-width="2"/>
            </g>

            <!-- O到P的蓝色实线 (步骤1起，与旗杆重合高亮) -->
            <g id="scene1-line-op" class="scene1-hidden">
                <line x1="250" y1="330" x2="250" y2="210" stroke="#1565c0" stroke-width="2"/>
            </g>

            <!-- 局部虚线坐标系 (步骤2起) -->
            <g id="scene1-local-coords" class="scene1-hidden" stroke="#1565c0" stroke-width="1" stroke-dasharray="4,4">
                <line x1="235" y1="330" x2="265" y2="330"/>
                <line x1="250" y1="300" x2="250" y2="360"/>
            </g>

            <!-- O到P'的蓝色虚线 (步骤3起) -->
            <g id="scene1-line-op2" class="scene1-hidden">
                <line x1="250" y1="330" x2="370" y2="330" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="5,5"/>
            </g>

            <!-- 旋转弧线 (步骤3起) -->
            <g id="scene1-arc" class="scene1-hidden">
                <defs>
                    <marker id="scene1-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                        <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0"/>
                    </marker>
                </defs>
                <!-- 圆心(250,330)，半径40，从(250,290)顺时针到(290,330) -->
                <path d="M 250 290 A 40 40 0 0 1 290 330" fill="none" stroke="#1565c0" stroke-width="1.5" marker-end="url(#scene1-arrowhead)"/>
            </g>

            <!-- 标签 -->
            <g id="scene1-labels" font-family="sans-serif">
                <!-- 顶点P标签 -->
                <text id="scene1-label-p" x="265" y="195" font-size="16" fill="#000">(5,7)</text>
                <!-- O点标签 -->
                <text id="scene1-label-o" x="235" y="355" font-size="16" fill="#000" font-weight="bold" text-anchor="end">O</text>
                <!-- O坐标标签 (步骤1起) -->
                <text id="scene1-label-o-coord" x="265" y="360" font-size="14" fill="#1565c0" class="scene1-hidden">(5,3)</text>
                <!-- 新顶点P'标签 (步骤4起) -->
                <text id="scene1-label-p2" x="385" y="355" font-size="16" fill="#c62828" class="scene1-hidden">(9,3)</text>
                <!-- 向量OP标注 (步骤2起) -->
                <text id="scene1-label-op" x="270" y="270" font-size="14" fill="#1565c0" class="scene1-hidden">OP→=(0,4)</text>
                <!-- 向量OP'标注 (步骤3起) - 放在弧线上方，避免与其他元素重叠 -->
                <text id="scene1-label-op2" x="300" y="315" font-size="14" fill="#1565c0" class="scene1-hidden">OP'→=(4,0)</text>
            </g>

            <!-- 右侧信息面板 -->
            <g id="scene1-info-panel" font-family="sans-serif">
                <!-- 步骤1信息 -->
                <g id="scene1-info-step1" class="scene1-hidden">
                    <text x="450" y="140" font-size="18" font-weight="bold" fill="#000">步骤1：识别旋转中心</text>
                    <text x="450" y="180" font-size="16" fill="#000">旋转中心 O(5,3)</text>
                    <text x="450" y="220" font-size="16" fill="#000">顶点 P(5,7)</text>
                </g>
                <!-- 步骤2信息 -->
                <g id="scene1-info-step2" class="scene1-hidden">
                    <text x="450" y="140" font-size="18" font-weight="bold" fill="#000">步骤2：分析相对位置</text>
                    <text x="450" y="180" font-size="16" fill="#000">Δx = 5 − 5 = 0</text>
                    <text x="450" y="220" font-size="16" fill="#000">Δy = 7 − 3 = 4</text>
                </g>
                <!-- 步骤3信息 -->
                <g id="scene1-info-step3" class="scene1-hidden">
                    <text x="450" y="140" font-size="18" font-weight="bold" fill="#000">步骤3：顺时针旋转90°</text>
                    <text x="450" y="180" font-size="16" fill="#000">旋转规则：(x,y) → (y,−x)</text>
                    <text x="450" y="220" font-size="16" fill="#000">(0,4) → (4,0)</text>
                </g>
                <!-- 步骤4信息 -->
                <g id="scene1-info-step4" class="scene1-hidden">
                    <text x="450" y="140" font-size="18" font-weight="bold" fill="#000">步骤4：计算新坐标</text>
                    <text x="450" y="180" font-size="16" fill="#000">O(5,3) + (4,0)</text>
                    <text x="450" y="220" font-size="16" fill="#000">= (9,3)</text>
                </g>
                <!-- 步骤5信息 -->
                <g id="scene1-info-step5" class="scene1-hidden">
                    <text x="450" y="140" font-size="18" font-weight="bold" fill="#000">步骤5：选择答案</text>
                    <text x="450" y="180" font-size="16" fill="#000">正确答案是 C</text>
                    <!-- 选项 - 左移标记，右移选项文字，增加间距 -->
                    <text x="520" y="240" font-size="20" fill="#000">A. (7,5)</text>
                    <text x="520" y="285" font-size="20" fill="#000">B. (10,3)</text>
                    <text x="520" y="330" font-size="20" fill="#2e7d32" font-weight="bold">C. (9,3)</text>
                    <text x="520" y="375" font-size="20" fill="#000">D. (1,3)</text>
                    <!-- 错误标记 -->
                    <text x="455" y="240" font-size="20" fill="#c62828">×</text>
                    <text x="455" y="285" font-size="20" fill="#c62828">×</text>
                    <text x="455" y="375" font-size="20" fill="#c62828">×</text>
                    <!-- 正确标记 -->
                    <text x="455" y="330" font-size="20" fill="#2e7d32">✓</text>
                </g>
            </g>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
        <div id="scene1-step-text">步骤 0/5：初始状态</div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        var currentStep = 0;
        var totalSteps = 5;

        var btnPrev = document.getElementById('scene1-btn-prev');
        var btnNext = document.getElementById('scene1-btn-next');
        var stepText = document.getElementById('scene1-step-text');

        var stepNames = [
            '初始状态',
            '识别旋转中心',
            '分析相对位置',
            '顺时针旋转90°',
            '计算新坐标',
            '选择答案'
        ];

        // 各步骤需要显示的元素ID列表
        // 注意：OP'标注仅在步骤3显示，步骤4-5隐藏以避免与旋转后小旗和(9,3)标签重叠
        var stepElements = {
            0: [],
            1: ['scene1-line-op', 'scene1-label-o-coord', 'scene1-point-o-highlight', 'scene1-point-p-highlight', 'scene1-info-step1'],
            2: ['scene1-line-op', 'scene1-label-o-coord', 'scene1-point-o-highlight', 'scene1-point-p-highlight', 'scene1-local-coords', 'scene1-label-op', 'scene1-info-step2'],
            3: ['scene1-line-op', 'scene1-label-o-coord', 'scene1-point-o-highlight', 'scene1-point-p-highlight', 'scene1-local-coords', 'scene1-label-op', 'scene1-line-op2', 'scene1-arc', 'scene1-label-op2', 'scene1-info-step3'],
            4: ['scene1-line-op', 'scene1-label-o-coord', 'scene1-point-o-highlight', 'scene1-point-p-highlight', 'scene1-local-coords', 'scene1-label-op', 'scene1-line-op2', 'scene1-arc', 'scene1-flag-rotated', 'scene1-label-p2', 'scene1-info-step4'],
            5: ['scene1-line-op', 'scene1-label-o-coord', 'scene1-point-o-highlight', 'scene1-point-p-highlight', 'scene1-local-coords', 'scene1-label-op', 'scene1-line-op2', 'scene1-arc', 'scene1-flag-rotated', 'scene1-label-p2', 'scene1-info-step5']
        };

        function show(el) {
            if (typeof el === 'string') el = document.getElementById(el);
            if (el) {
                el.style.display = '';
                el.style.opacity = '1';
                el.classList.remove('scene1-hidden');
            }
        }

        function hide(el) {
            if (typeof el === 'string') el = document.getElementById(el);
            if (el) {
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }

        function updateStep() {
            // 隐藏所有步骤元素
            var allIds = [];
            for (var s = 1; s <= totalSteps; s++) {
                var ids = stepElements[s];
                for (var i = 0; i < ids.length; i++) {
                    if (allIds.indexOf(ids[i]) === -1) allIds.push(ids[i]);
                }
            }
            for (var j = 0; j < allIds.length; j++) {
                hide(allIds[j]);
            }

            // 显示当前步骤元素
            var toShow = stepElements[currentStep] || [];
            for (var k = 0; k < toShow.length; k++) {
                show(toShow[k]);
            }

            // 更新按钮状态
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps;

            // 更新步骤文字
            stepText.textContent = '步骤 ' + currentStep + '/' + totalSteps + '：' + stepNames[currentStep];
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateStep();
            }
        });

        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
