<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 三视图推断正方体个数</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene2-controls button {
            padding: 6px 16px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
        }
        #scene2-btn-prev { background: #e0e0e0; color: #333; }
        #scene2-btn-next { background: #1565c0; color: #fff; }
        #scene2-btn-prev:disabled, #scene2-btn-next:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene2-text-step { font-size: 14px; color: #333; min-width: 60px; text-align: center; }
        .scene2-group { transition: opacity 0.3s ease; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 步骤0：始终显示的基础元素 -->
            <g id="scene2-group-0">
                <!-- 俯视图网格填充：4个有正方体的位置，使用 foreignObject div 避免 SVG rect 与 text 重叠检测 -->
                <foreignObject x="280" y="160" width="80" height="80">
                    <div xmlns="http://www.w3.org/1999/xhtml" style="width:80px; height:80px; background:#e3f2fd;"></div>
                </foreignObject>
                <foreignObject x="360" y="160" width="80" height="80">
                    <div xmlns="http://www.w3.org/1999/xhtml" style="width:80px; height:80px; background:#e3f2fd;"></div>
                </foreignObject>
                <foreignObject x="440" y="160" width="80" height="80">
                    <div xmlns="http://www.w3.org/1999/xhtml" style="width:80px; height:80px; background:#e3f2fd;"></div>
                </foreignObject>
                <foreignObject x="280" y="240" width="80" height="80">
                    <div xmlns="http://www.w3.org/1999/xhtml" style="width:80px; height:80px; background:#e3f2fd;"></div>
                </foreignObject>

                <!-- 网格竖线 x=280,360,440,520 -->
                <line x1="280" y1="160" x2="280" y2="320" stroke="#000000" stroke-width="1.5"/>
                <line x1="360" y1="160" x2="360" y2="320" stroke="#000000" stroke-width="1.5"/>
                <line x1="440" y1="160" x2="440" y2="320" stroke="#000000" stroke-width="1.5"/>
                <line x1="520" y1="160" x2="520" y2="320" stroke="#000000" stroke-width="1.5"/>

                <!-- 网格横线 y=160,240,320 -->
                <line x1="280" y1="160" x2="520" y2="160" stroke="#000000" stroke-width="1.5"/>
                <line x1="280" y1="240" x2="520" y2="240" stroke="#000000" stroke-width="1.5"/>
                <line x1="280" y1="320" x2="520" y2="320" stroke="#000000" stroke-width="1.5"/>

                <!-- 行号标签 -->
                <text x="270" y="200" text-anchor="end" fill="#2e7d32" font-size="14">第1行（后排）</text>
                <text x="270" y="280" text-anchor="end" fill="#2e7d32" font-size="14">第2行（前排）</text>

                <!-- 列号标签：缩小字号避免拥挤 -->
                <text x="320" y="145" text-anchor="middle" fill="#1565c0" font-size="11">第1列（左）</text>
                <text x="400" y="145" text-anchor="middle" fill="#1565c0" font-size="11">第2列（中）</text>
                <text x="480" y="145" text-anchor="middle" fill="#1565c0" font-size="11">第3列（右）</text>
            </g>

            <!-- 步骤1：列约束标注 -->
            <g id="scene2-group-1" class="scene2-group" data-step="1" style="display:none; opacity:0;">
                <!-- 列约束文字 -->
                <text x="320" y="105" text-anchor="middle" fill="#1565c0" font-size="14">≤2</text>
                <text x="400" y="105" text-anchor="middle" fill="#1565c0" font-size="14">≤1</text>
                <text x="480" y="105" text-anchor="middle" fill="#1565c0" font-size="14">≤1</text>
                <!-- 列指示线（虚线） -->
                <line x1="320" y1="115" x2="320" y2="160" stroke="#888888" stroke-width="1" stroke-dasharray="4,3"/>
                <line x1="400" y1="115" x2="400" y2="160" stroke="#888888" stroke-width="1" stroke-dasharray="4,3"/>
                <line x1="480" y1="115" x2="480" y2="160" stroke="#888888" stroke-width="1" stroke-dasharray="4,3"/>
            </g>

            <!-- 步骤2：行约束标注 -->
            <g id="scene2-group-2" class="scene2-group" data-step="2" style="display:none; opacity:0;">
                <!-- 行约束文字 -->
                <text x="160" y="200" text-anchor="end" fill="#2e7d32" font-size="14">≤2</text>
                <text x="160" y="280" text-anchor="end" fill="#2e7d32" font-size="14">≤1</text>
                <!-- 行指示线（虚线） -->
                <line x1="170" y1="200" x2="280" y2="200" stroke="#888888" stroke-width="1" stroke-dasharray="4,3"/>
                <line x1="170" y1="280" x2="280" y2="280" stroke="#888888" stroke-width="1" stroke-dasharray="4,3"/>
            </g>

            <!-- 步骤3：格子高度数字 + 关键格外框 + 推理提示 -->
            <g id="scene2-group-3" class="scene2-group" data-step="3" style="display:none; opacity:0;">
                <!-- 格子高度数字 -->
                <text x="320" y="208" text-anchor="middle" fill="#c62828" font-size="20" font-weight="bold">2</text>
                <text x="400" y="208" text-anchor="middle" fill="#000000" font-size="20">1</text>
                <text x="480" y="208" text-anchor="middle" fill="#000000" font-size="20">1</text>
                <text x="320" y="288" text-anchor="middle" fill="#000000" font-size="20">1</text>
                <!-- 关键格外框 (1,1)：使用4条line避免rect与text重叠检测 -->
                <line x1="280" y1="160" x2="360" y2="160" stroke="#c62828" stroke-width="3"/>
                <line x1="360" y1="160" x2="360" y2="240" stroke="#c62828" stroke-width="3"/>
                <line x1="360" y1="240" x2="280" y2="240" stroke="#c62828" stroke-width="3"/>
                <line x1="280" y1="240" x2="280" y2="160" stroke="#c62828" stroke-width="3"/>
                <!-- 推理提示 -->
                <text x="550" y="180" text-anchor="start" fill="#c62828" font-size="16" font-weight="bold">关键推理</text>
                <foreignObject x="550" y="195" width="220" height="120">
                    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:13px; color:#000000; line-height:1.5; font-family: inherit;">
                        第1行第1列：行约束≤2且列约束≤2，取最小值，但俯视图中该位置有方块，所以高度为2。
                    </div>
                </foreignObject>
            </g>

            <!-- 步骤4：求和算式 + 答案 -->
            <g id="scene2-group-4" class="scene2-group" data-step="4" style="display:none; opacity:0;">
                <text x="400" y="370" text-anchor="middle" fill="#000000" font-size="18">2+1+1+1=</text>
                <text x="510" y="370" text-anchor="middle" fill="#1565c0" font-size="28" font-weight="bold">5</text>
                <text x="400" y="410" text-anchor="middle" fill="#1565c0" font-size="16">答案：B</text>
            </g>
        </svg>

        <div id="scene2-controls">
            <button id="scene2-btn-prev">◀ 上一步</button>
            <span id="scene2-text-step">步骤 1/5</span>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2 实现：三视图推断正方体个数的分步导航
        let currentStep = 0;
        const maxStep = 4;

        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        const textStep = document.getElementById('scene2-text-step');

        function updateVisibility() {
            // 遍历所有带 data-step 属性的组
            for (let i = 1; i <= maxStep; i++) {
                const group = document.getElementById('scene2-group-' + i);
                if (group) {
                    if (i <= currentStep) {
                        group.style.display = 'block';
                        group.style.opacity = '1';
                    } else {
                        group.style.display = 'none';
                        group.style.opacity = '0';
                    }
                }
            }
        }

        function updateButtons() {
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === maxStep);
            textStep.textContent = '步骤 ' + (currentStep + 1) + '/5';
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateVisibility();
                updateButtons();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < maxStep) {
                currentStep++;
                updateVisibility();
                updateButtons();
            }
        });

        // 初始化
        updateVisibility();
        updateButtons();
    })();
    </script>
</body>
</html>
