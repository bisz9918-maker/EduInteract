<!DOCTYPE html>
<html lang="zh">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNA 半保留复制与突变传递</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }

        /* 统计面板（HTML div，避免SVG重叠检测误报） */
        #scene2-stat-panel {
            position: absolute; top: 45px; right: 15px; width: 300px;
            background: #f5f5f5; border: 1px solid #e0e0e0; border-radius: 4px;
            padding: 14px 18px; box-sizing: border-box; z-index: 5;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }
        #scene2-stat-title { font-size: 15px; font-weight: bold; color: #333; text-align: center; margin-bottom: 14px; }
        .scene2-stat-line { font-size: 13px; color: #444; line-height: 2.1; margin: 0; }
        .scene2-conclusion-red { font-size: 14px; font-weight: bold; color: #c62828; line-height: 1.7; margin-top: 10px; }
        .scene2-hint { font-size: 12px; color: #666; line-height: 1.5; margin-top: 10px; padding: 8px; border: 1px dashed #888; border-radius: 2px; }
        .scene2-legend { font-size: 12px; color: #555; margin-top: 10px; display: flex; align-items: center; gap: 6px; }
        .scene2-legend-box { width: 30px; height: 8px; border-radius: 1px; display: inline-block; }

        /* 控件栏 */
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 24px; z-index: 10; }
        #scene2-controls button {
            padding: 6px 16px; font-size: 14px; cursor: pointer;
            background: #e3f2fd; border: 1px solid #1565c0; color: #1565c0; border-radius: 4px;
            transition: all 0.2s; font-family: inherit;
        }
        #scene2-controls button:hover:not(:disabled) { background: #bbdefb; }
        #scene2-controls button:disabled {
            background: #f5f5f5; border-color: #bdbdbd; color: #9e9e9e; cursor: not-allowed;
        }
        #scene2-scene-info { text-align: center; font-size: 13px; color: #555; line-height: 1.5; }
        #scene2-step-indicator { font-size: 12px; color: #888; margin-top: 2px; }

        svg { display: block; }
        .scene2-element { transition: opacity 0.3s ease; }
    </style>
</head>

            { // 步骤0：同位素初始
                scene: '同位素标记',
                statTitle: '原始 DNA',
                statLines: ['类型：¹⁵N-¹⁵N（全重）', '状态：准备复制', '', '', '', ''],
                conclusions: ['', '', ''],
                hints: ['', ''],
                showLegend: false
            },
            { // 步骤1：复制1次
                scene: '同位素标记',
                statTitle: '复制 1 次后',
                statLines: ['总 DNA：2', '杂合 DNA（¹⁵N-¹⁴N）：2', '全轻 DNA（¹⁴N-¹⁴N）：0', '含 ¹⁴N 的 DNA：2', '比例：2/2 = 100%', ''],
                conclusions: ['', '', ''],
                hints: ['', ''],
                showLegend: false
            },
            { // 步骤2：复制2次
                scene: '同位素标记',
                statTitle: '复制 2 次后',
                statLines: ['总 DNA：4', '杂合 DNA（¹⁵N-¹⁴N）：2', '全轻 DNA（¹⁴N-¹⁴N）：2', '含 ¹⁴N 的 DNA：4', '比例：4/4 = 100%', ''],
                conclusions: ['', '', ''],
                hints: ['', ''],
                showLegend: false
            },
            { // 步骤3：复制3次
                scene: '同位素标记',
                statTitle: '复制 3 次后',
                statLines: ['总 DNA：8', '杂合 DNA（¹⁵N-¹⁴N）：2', '全轻 DNA（¹⁴N-¹⁴N）：6', '含 ¹⁴N 的 DNA：8', '比例：8/8 = 100%', ''],
                conclusions: ['含 ¹⁴N 占 100%', '→ 选项 D 错误', ''],
                hints: ['注：若问"只含 ¹⁴N"，', '则为 6/8 = 3/4'],
                showLegend: true
            },
            { // 步骤4：突变场景初始
                scene: '突变传递',
                statTitle: '突变初始状态',
                statLines: ['突变类型：T→A', '位置：①处后', '状态：单链突变', '', '', ''],
                conclusions: ['', '', ''],
                hints: ['', ''],
                showLegend: false
            },
            { // 步骤5：突变复制1次
                scene: '突变传递',
                statTitle: '突变 DNA 复制 1 次',
                statLines: ['总 DNA：2', '突变 DNA：1', '正常 DNA：1', '突变比例：1/2', '', ''],
                conclusions: ['', '', ''],
                hints: ['', ''],
                showLegend: false
            },
            { // 步骤6：突变复制2次
                scene: '突变传递',
                statTitle: '突变 DNA 复制 2 次',
                statLines: ['总 DNA：4', '突变 DNA：2', '正常 DNA：2', '突变比例：2/4 = 1/2', '', ''],
                conclusions: ['', '', ''],
                hints: ['', ''],
                showLegend: false
            },
            { // 步骤7：推导n次
                scene: '突变传递',
                statTitle: '复制 n 次推导',
                statLines: ['总 DNA：2ⁿ', '突变 DNA：2ⁿ⁻¹', '正常 DNA：2ⁿ⁻¹', '突变比例：2ⁿ⁻¹/2ⁿ = 1/2', '', ''],
                conclusions: ['发生改变的基因占 1/2，', '而非 1/4', '→ 选项 C 错误'],
                hints: ['', ''],
                showLegend: false
            }
        ];

        function renderStep() {
            const config = stepConfigs[currentStep];

            // 更新场景标签和步骤指示
            sceneLabel.textContent = '场景：' + config.scene;
            stepIndicator.textContent = '步骤 ' + currentStep + ' / ' + totalSteps;

            // 更新按钮状态
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps;

            // 显示/隐藏带有 data-steps 属性的 SVG 元素
            document.querySelectorAll('[data-steps]').forEach(function(el) {
                const stepsAttr = el.getAttribute('data-steps');
                if (stepsAttr) {
                    const steps = stepsAttr.split(',').map(function(s) { return parseInt(s.trim(), 10); });
                    if (steps.indexOf(currentStep) !== -1) {
                        el.style.display = 'block';
                        el.style.opacity = '1';
                    } else {
                        el.style.display = 'none';
                        el.style.opacity = '0';
                    }
                }
            });

            // 更新统计面板
            statTitle.textContent = config.statTitle;
            for (let i = 0; i < statLines.length; i++) {
                statLines[i].textContent = config.statLines[i] || '';
                statLines[i].style.display = config.statLines[i] ? 'block' : 'none';
            }

            // 更新结论
            conclusion1.textContent = config.conclusions[0] || '';
            conclusion1.style.display = config.conclusions[0] ? 'block' : 'none';
            conclusion2.textContent = config.conclusions[1] || '';
            conclusion2.style.display = config.conclusions[1] ? 'block' : 'none';
            conclusion3.textContent = config.conclusions[2] || '';
            conclusion3.style.display = config.conclusions[2] ? 'block' : 'none';

            // 更新提示
            if (config.hints[0]) {
                hintText1.textContent = config.hints[0];
                hintText2.textContent = config.hints[1] || '';
                hintBox.style.display = 'block';
            } else {
                hintBox.style.display = 'none';
            }

            // 更新图例
            legendBox.style.display = config.showLegend ? 'block' : 'none';
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                renderStep();
            }
        });

        // 初始渲染
        renderStep();
    })();
    </script>
</body>
</html>
