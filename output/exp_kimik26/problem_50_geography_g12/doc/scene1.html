<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 1 - 昼半球与太阳直射点</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            padding: 6px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc;
            border-radius: 4px; background: #f5f5f5; min-width: 80px; height: 32px;
        }
        #scene1-controls button:hover { background: #e0e0e0; }
        #scene1-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 14px; color: #333; min-width: 200px; text-align: center; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" viewBox="0 0 800 500" style="position:absolute; top:0; left:0;">
            <!-- 步骤0：基础空间框架 -->
            <!-- 晨昏圈大圆 -->
            <circle id="scene1-circle-main" cx="400" cy="270" r="150" fill="#ff9800" fill-opacity="0.15" stroke="#000000" stroke-width="2"/>
            
            <!-- 地心A -->
            <circle id="scene1-point-a" cx="400" cy="270" r="4" fill="#000000"/>
            <text id="scene1-label-a" x="590" y="265" font-size="14" fill="#000000" font-family="sans-serif">A</text>
            
            <!-- 赤道 -->
            <line id="scene1-line-equator" x1="250" y1="270" x2="550" y2="270" stroke="#1565c0" stroke-width="1.5"/>
            <text id="scene1-label-equator" x="555" y="275" font-size="14" fill="#1565c0" font-family="sans-serif">赤道</text>
            
            <!-- 160°E经线（垂直直径） -->
            <line id="scene1-line-meridian" x1="400" y1="120" x2="400" y2="420" stroke="#c62828" stroke-width="1.5"/>
            
            <!-- B点 -->
            <circle id="scene1-point-b" cx="400" cy="390" r="4" fill="#c62828"/>
            <text id="scene1-label-b" x="200" y="415" font-size="14" fill="#c62828" font-family="sans-serif">B</text>
            
            <!-- C点 -->
            <circle id="scene1-point-c" cx="400" cy="150" r="4" fill="#c62828"/>
            <text id="scene1-label-c" x="200" y="135" font-size="14" fill="#c62828" font-family="sans-serif">C</text>
            
            <!-- 步骤1：半球分界 -->
            <text id="scene1-label-160e" x="410" y="105" font-size="14" fill="#c62828" font-family="sans-serif">160°E</text>
            <text id="scene1-label-east" x="130" y="275" font-size="14" fill="#2e7d32" font-family="sans-serif">东半球</text>
            <text id="scene1-label-west" x="620" y="275" font-size="14" fill="#888888" font-family="sans-serif">西半球</text>
            
            <!-- 步骤2：极昼极夜边界 -->
            <line id="scene1-lat-75n" x1="310" y1="150" x2="490" y2="150" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
            <text id="scene1-label-75n" x="570" y="145" font-size="13" fill="#888888" font-family="sans-serif">75°N</text>
            
            <line id="scene1-lat-75s" x1="310" y1="390" x2="490" y2="390" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
            <text id="scene1-label-75s" x="570" y="405" font-size="13" fill="#888888" font-family="sans-serif">75°S</text>
            
            <!-- 步骤3：直射纬度推导 -->
            <line id="scene1-lat-15n" x1="260" y1="210" x2="540" y2="210" stroke="#2e7d32" stroke-width="1"/>
            <text id="scene1-label-15n" x="620" y="200" font-size="13" fill="#2e7d32" font-family="sans-serif">15°N</text>
            
            <text id="scene1-label-formula" x="110" y="170" font-size="14" fill="#333333" font-family="sans-serif">90° − 75° = 15°N</text>
            
            <!-- 太阳直射点（星形） -->
            <polygon id="scene1-sun-point" points="400,204 402,210 408,210 403,214 405,220 400,216 395,220 397,214 392,210 398,210" fill="#ff9800"/>
            <text id="scene1-label-sunpoint" x="620" y="155" font-size="13" fill="#ff9800" font-family="sans-serif">太阳直射点</text>
            
            <!-- 步骤4：坐标定位与光照 -->
            <text id="scene1-label-sun-coord" x="620" y="245" font-size="13" fill="#333333" font-family="sans-serif">(15°N, 160°E)</text>
            <text id="scene1-label-c-coord" x="620" y="115" font-size="13" fill="#333333" font-family="sans-serif">C(75°N, 160°E)</text>
            
            <!-- 太阳光线 -->
            <g id="scene1-sun-rays">
                <line x1="620" y1="190" x2="550" y2="190" stroke="#ff9800" stroke-width="1.5" marker-end="url(#arrowhead)"/>
                <line x1="620" y1="210" x2="550" y2="210" stroke="#ff9800" stroke-width="1.5" marker-end="url(#arrowhead)"/>
                <line x1="620" y1="230" x2="550" y2="230" stroke="#ff9800" stroke-width="1.5" marker-end="url(#arrowhead)"/>
            </g>
            
            <!-- 步骤5：时间计算 -->
            <line id="scene1-time-line" x1="400" y1="120" x2="280" y2="120" stroke="#1565c0" stroke-width="1" stroke-dasharray="4,4"/>
            <text id="scene1-label-1200" x="570" y="105" font-size="13" fill="#1565c0" font-family="sans-serif">12:00</text>
            <text id="scene1-label-120e" x="130" y="125" font-size="13" fill="#1565c0" font-family="sans-serif">120°E</text>
            <text id="scene1-label-920" x="130" y="85" font-size="13" fill="#c62828" font-family="sans-serif">9:20</text>
            <text id="scene1-label-40deg" x="360" y="105" font-size="13" fill="#333333" font-family="sans-serif">40°</text>
            <text id="scene1-label-2h40m" x="130" y="210" font-size="13" fill="#333333" font-family="sans-serif">2h40m</text>
            <text id="scene1-label-bjt" x="340" y="65" font-size="15" fill="#c62828" font-family="sans-serif" font-weight="bold">北京时间 9:20</text>
            
            <!-- 箭头定义 -->
            <defs>
                <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#ff9800"/>
                </marker>
            </defs>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 0/5：基础空间框架</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现
        var currentStep = 0;
        var totalSteps = 5;
        
        var stepNames = [
            "基础空间框架",
            "半球分界",
            "极昼极夜边界",
            "直射纬度推导",
            "坐标定位与光照",
            "时间计算"
        ];
        
        // 元素ID到可见步骤的映射
        var elementSteps = {
            // 步骤0：始终可见
            "scene1-circle-main": [0,1,2,3,4,5],
            "scene1-point-a": [0,1,2,3,4,5],
            "scene1-label-a": [0,1,2,3,4,5],
            "scene1-line-equator": [0,1,2,3,4,5],
            "scene1-label-equator": [0,1,2,3,4,5],
            "scene1-line-meridian": [0,1,2,3,4,5],
            "scene1-point-b": [0,1,2,3,4,5],
            "scene1-label-b": [0,1,2,3,4,5],
            "scene1-point-c": [0,1,2,3,4,5],
            "scene1-label-c": [0,1,2,3,4,5],
            
            // 步骤1
            "scene1-label-160e": [1,2,3,4,5],
            "scene1-label-east": [1,2,3,4,5],
            "scene1-label-west": [1,2,3,4,5],
            
            // 步骤2
            "scene1-lat-75n": [2,3,4,5],
            "scene1-label-75n": [2,3,4,5],
            "scene1-lat-75s": [2,3,4,5],
            "scene1-label-75s": [2,3,4,5],
            
            // 步骤3
            "scene1-lat-15n": [3,4,5],
            "scene1-label-15n": [3,4,5],
            "scene1-label-formula": [3,4,5],
            "scene1-sun-point": [3,4,5],
            "scene1-label-sunpoint": [3,4,5],
            
            // 步骤4
            "scene1-label-sun-coord": [4,5],
            "scene1-label-c-coord": [4,5],
            "scene1-sun-rays": [4,5],
            
            // 步骤5
            "scene1-time-line": [5],
            "scene1-label-1200": [5],
            "scene1-label-120e": [5],
            "scene1-label-920": [5],
            "scene1-label-40deg": [5],
            "scene1-label-2h40m": [5],
            "scene1-label-bjt": [5]
        };
        
        function renderStep() {
            // 更新步骤指示器
            document.getElementById("scene1-step-indicator").textContent = 
                "步骤 " + currentStep + "/" + totalSteps + "：" + stepNames[currentStep];
            
            // 更新按钮状态
            document.getElementById("scene1-btn-prev").disabled = (currentStep === 0);
            document.getElementById("scene1-btn-next").disabled = (currentStep === totalSteps);
            
            // 遍历所有元素，控制显隐
            for (var id in elementSteps) {
                var el = document.getElementById(id);
                if (el) {
                    var steps = elementSteps[id];
                    if (steps.indexOf(currentStep) !== -1) {
                        el.style.display = "";
                        el.style.opacity = "1";
                    } else {
                        el.style.display = "none";
                        el.style.opacity = "0";
                    }
                }
            }
        }
        
        document.getElementById("scene1-btn-prev").addEventListener("click", function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        });
        
        document.getElementById("scene1-btn-next").addEventListener("click", function() {
            if (currentStep < totalSteps) {
                currentStep++;
                renderStep();
            }
        });
        
        // 初始渲染
        renderStep();
    })();
    </script>
</body>
</html>
