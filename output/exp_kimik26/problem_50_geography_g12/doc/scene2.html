<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 线速度与正午太阳高度角</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene2-controls button { padding: 6px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: #f5f5f5; }
        #scene2-controls button:hover { background: #e0e0e0; }
        #scene2-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene2-step-indicator { font-size: 14px; color: #333; min-width: 60px; text-align: center; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" viewBox="0 0 800 500">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene2-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32" />
                </marker>
            </defs>
            
            <!-- 基础元素（步骤0始终显示） -->
            <!-- 地球圆：圆心(280,250) 半径160 -->
            <circle id="scene2-earth-circle" cx="280" cy="250" r="160" stroke="#000000" stroke-width="1.5" fill="none"/>
            <!-- 赤道线：(120,250)-(440,250) -->
            <line id="scene2-equator" x1="120" y1="250" x2="440" y2="250" stroke="#1565c0" stroke-width="1.5"/>
            
            <!-- A/B/C 点 -->
            <circle id="scene2-point-a" cx="280" cy="250" r="4" fill="#c62828"/>
            <circle id="scene2-point-b" cx="321" cy="405" r="4" fill="#c62828"/>
            <circle id="scene2-point-c" cx="321" cy="96" r="4" fill="#c62828"/>
            
            <!-- 基础标签（放在地球圆bbox之外避免重叠） -->
            <text id="scene2-label-a" x="105" y="255" font-size="14" fill="#000">A</text>
            <text id="scene2-label-b" x="360" y="450" font-size="14" fill="#000">B</text>
            <text id="scene2-label-c" x="335" y="45" font-size="14" fill="#000">C</text>
            <text id="scene2-label-equator" x="445" y="175" font-size="14" fill="#1565c0">赤道</text>
            
            <!-- 步骤1：线速度 -->
            <g id="scene2-step1-group" style="display: none;">
                <!-- 线速度箭头 -->
                <line x1="280" y1="250" x2="355" y2="250" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene2-arrowhead)"/>
                <line x1="321" y1="96" x2="340" y2="96" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene2-arrowhead)"/>
                <line x1="321" y1="405" x2="340" y2="405" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene2-arrowhead)"/>
                <!-- 右侧信息面板：线速度标签 -->
                <text x="530" y="50" font-size="12" fill="#2e7d32">ωR·cos75° (C点)</text>
                <text x="530" y="200" font-size="12" fill="#2e7d32">ωR (A点)</text>
                <text x="530" y="450" font-size="12" fill="#2e7d32">ωR·cos75° (B点)</text>
                <!-- 线速度结论 -->
                <text x="530" y="320" font-size="18" font-weight="bold" fill="#000">v_A > v_B = v_C</text>
            </g>
            
            <!-- 步骤2：公式 -->
            <g id="scene2-step2-group" style="display: none;">
                <text x="530" y="110" font-size="16" fill="#000">H = 90° - |φ - δ|</text>
                <text x="530" y="145" font-size="14" fill="#666">δ = 15°N</text>
            </g>
            
            <!-- 步骤3：太阳光线与地平面 -->
            <g id="scene2-step3-group" style="display: none;">
                <!-- 太阳光线（与水平约-15°，斜率≈-0.268） -->
                <line x1="520" y1="186" x2="120" y2="293" stroke="#ff9800" stroke-width="1.5"/>
                <line x1="520" y1="43" x2="160" y2="139" stroke="#ff9800" stroke-width="1.5"/>
                <line x1="520" y1="330" x2="120" y2="437" stroke="#ff9800" stroke-width="1.5"/>
                <!-- 地平面切线（灰色虚线） -->
                <line x1="280" y1="210" x2="280" y2="290" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
                <line x1="292" y1="88" x2="350" y2="104" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
                <line x1="292" y1="397" x2="350" y2="413" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
                <!-- 太阳高度角弧线 -->
                <path d="M 280 275 A 25 25 0 0 0 304.1 243.5" stroke="#1565c0" stroke-width="2" fill="none"/>
                <path d="M 345.1 102.5 A 25 25 0 0 0 345.1 89.5" stroke="#1565c0" stroke-width="2" fill="none"/>
                <!-- 右侧信息面板：角度标注 -->
                <text id="scene2-angle-a" x="680" y="310" font-size="14" fill="#1565c0">75°</text>
                <text id="scene2-angle-c" x="680" y="50" font-size="14" fill="#1565c0">30°</text>
                <text id="scene2-angle-b" x="680" y="450" font-size="14" fill="#1565c0">0°</text>
            </g>
            
            <!-- 步骤4：结论高亮 -->
            <g id="scene2-step4-group" style="display: none;">
                <text x="530" y="360" font-size="16" font-weight="bold" fill="#c62828">H_A(75°) > H_C(30°) > H_B(0°)</text>
            </g>
        </svg>
        
        <div id="scene2-controls">
            <button id="scene2-btn-prev">◀ 上一步</button>
            <span id="scene2-step-indicator">步骤 0/4</span>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        let currentStep = 0;
        const totalSteps = 4;
        
        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        const indicator = document.getElementById('scene2-step-indicator');
        
        const groups = [
            null,
            document.getElementById('scene2-step1-group'),
            document.getElementById('scene2-step2-group'),
            document.getElementById('scene2-step3-group'),
            document.getElementById('scene2-step4-group')
        ];
        
        const angleA = document.getElementById('scene2-angle-a');
        const angleC = document.getElementById('scene2-angle-c');
        const angleB = document.getElementById('scene2-angle-b');
        
        function renderStep() {
            indicator.textContent = '步骤 ' + currentStep + '/' + totalSteps;
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps;
            
            for (let i = 1; i <= totalSteps; i++) {
                if (groups[i]) {
                    groups[i].style.display = i <= currentStep ? 'block' : 'none';
                }
            }
            
            // Step 2: dim step 1 elements
            if (currentStep === 2 && groups[1]) {
                groups[1].style.opacity = '0.3';
            } else if (groups[1]) {
                groups[1].style.opacity = '1';
            }
            
            // Step 4: highlight angle labels
            if (angleA) {
                angleA.setAttribute('fill', currentStep === 4 ? '#c62828' : '#1565c0');
                angleA.setAttribute('font-weight', currentStep === 4 ? 'bold' : 'normal');
            }
            if (angleC) {
                angleC.setAttribute('fill', currentStep === 4 ? '#c62828' : '#1565c0');
                angleC.setAttribute('font-weight', currentStep === 4 ? 'bold' : 'normal');
            }
            if (angleB) {
                angleB.setAttribute('fill', currentStep === 4 ? '#c62828' : '#1565c0');
                angleB.setAttribute('font-weight', currentStep === 4 ? 'bold' : 'normal');
            }
        }
        
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        });
        
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                renderStep();
            }
        });
        
        renderStep();
    })();
    </script>
</body>
</html>
