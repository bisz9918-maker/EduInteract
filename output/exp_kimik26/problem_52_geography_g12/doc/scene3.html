<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 3 - 地方时、昼长与正午太阳高度</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene3-controls button {
            padding: 6px 18px; font-size: 14px; cursor: pointer;
            border: 1px solid #1565c0; border-radius: 4px;
            background: #ffffff; color: #1565c0;
            transition: all 0.2s;
        }
        #scene3-controls button:hover { background: #1565c0; color: #ffffff; }
        #scene3-controls button:disabled { opacity: 0.4; cursor: not-allowed; background: #ffffff; color: #1565c0; }

        /* 步骤元素的显隐控制：使用 display 确保隐藏时不参与布局 */
        .scene3-step-el { transition: opacity 0.3s ease; }
        .scene3-hidden { display: none; }
        .scene3-visible { display: block; opacity: 1; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg id="scene3-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene3-arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#1565c0"/>
                </marker>
                <marker id="scene3-arrow-blue-start" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M9,0 L9,6 L0,3 z" fill="#1565c0"/>
                </marker>
                <marker id="scene3-arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#c62828"/>
                </marker>
                <marker id="scene3-arrow-red-start" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M9,0 L9,6 L0,3 z" fill="#c62828"/>
                </marker>
            </defs>

            <!-- ==================== 全局标题 ==================== -->
            <text id="scene3-main-title" x="400" y="36" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">地方时、昼长与正午太阳高度综合计算</text>
            <text id="scene3-step-indicator" x="400" y="68" text-anchor="middle" font-size="13" fill="#666666">步骤 1 / 7</text>

            <!-- ==================== 左栏：地方时计算 ==================== -->
            <text id="scene3-left-title" x="140" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#1565c0">地方时计算</text>

            <!-- 经度差线段 -->
            <line id="scene3-longitude-line" x1="50" y1="134" x2="230" y2="134" stroke="#000000" stroke-width="2"/>
            <circle id="scene3-point-jia" cx="50" cy="134" r="4" fill="#1565c0"/>
            <circle id="scene3-point-yi" cx="230" cy="134" r="4" fill="#1565c0"/>

            <!-- 蓝色双向箭头（90°短弧向西） -->
            <line id="scene3-blue-arrow" x1="60" y1="119" x2="220" y2="119" stroke="#1565c0" stroke-width="2" marker-end="url(#scene3-arrow-blue)" marker-start="url(#scene3-arrow-blue-start)"/>
            <text id="scene3-90-label" x="140" y="132" text-anchor="middle" font-size="13" fill="#1565c0">90° 短弧向西</text>

            <!-- 甲、乙标签 -->
            <text id="scene3-label-jia" x="50" y="164" text-anchor="middle" font-size="13" fill="#000000">甲 140°W</text>
            <text id="scene3-label-yi" x="235" y="92" text-anchor="middle" font-size="13" fill="#000000">乙 130°E</text>

            <!-- 步骤1：时间换算公式 -->
            <g id="scene3-step1-group" class="scene3-step-el scene3-hidden">
                <text id="scene3-formula-step1" x="140" y="199" text-anchor="middle" font-size="14" fill="#000000">90° ÷ 15°/h = 6h</text>
                <!-- 红色向左箭头 -->
                <line id="scene3-arrow-west" x1="210" y1="229" x2="70" y2="229" stroke="#c62828" stroke-width="2" marker-end="url(#scene3-arrow-red)"/>
                <text id="scene3-direction-text" x="140" y="256" text-anchor="middle" font-size="13" fill="#c62828">乙在甲西边，时间晚6h</text>
            </g>

            <!-- 步骤2：地方时结果 -->
            <g id="scene3-step2-group" class="scene3-step-el scene3-hidden">
                <text id="scene3-result-formula" x="140" y="294" text-anchor="middle" font-size="14" fill="#000000">16时 − 6时 = 10时</text>
                <text id="scene3-result-time" x="140" y="329" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e7d32">乙地：6月22日 10时</text>
            </g>

            <!-- ==================== 中栏：正午太阳高度 ==================== -->
            <text id="scene3-mid-title" x="400" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#1565c0">正午太阳高度</text>

            <!-- 地平面线 -->
            <line id="scene3-ground-line" x1="320" y1="320" x2="480" y2="320" stroke="#000000" stroke-width="2"/>
            <!-- 铅垂线（虚线） -->
            <line id="scene3-plumb-line" x1="400" y1="320" x2="400" y2="220" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
            <!-- 北京标签 -->
            <text id="scene3-beijing-label" x="400" y="346" text-anchor="middle" font-size="13" fill="#000000">北京 39°N</text>

            <!-- 步骤3：赤道小圆 -->
            <g id="scene3-step3-group" class="scene3-step-el scene3-hidden">
                <!-- 赤道小圆：左半圆阴影 -->
                <circle id="scene3-equator-circle" cx="400" cy="370" r="15" fill="none" stroke="#000000" stroke-width="1"/>
                <path id="scene3-equator-shadow" d="M 400 355 A 15 15 0 0 0 400 385 Z" fill="rgba(136,136,136,0.3)"/>
                <line id="scene3-equator-diameter" x1="385" y1="370" x2="415" y2="370" stroke="#000000" stroke-width="1"/>
                <text id="scene3-c-label" x="400" y="400" text-anchor="middle" font-size="12" fill="#000000">C点 赤道</text>
                <text id="scene3-equator-hours" x="400" y="437" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e7d32">昼长 12 小时</text>
            </g>

            <!-- 步骤4：太阳直射点 -->
            <g id="scene3-step4-group" class="scene3-step-el scene3-hidden">
                <circle id="scene3-sunspot" cx="360" cy="180" r="4" fill="#c62828"/>
                <text id="scene3-sunspot-label" x="325" y="175" text-anchor="middle" font-size="12" fill="#c62828">23°26′N</text>
            </g>

            <!-- 步骤5：正午太阳高度推导 -->
            <g id="scene3-step5-group" class="scene3-step-el scene3-hidden">
                <!-- 太阳光线 -->
                <line id="scene3-sunray" x1="360" y1="180" x2="400" y2="320" stroke="#c62828" stroke-width="2"/>
                <!-- 角度弧线 -->
                <path id="scene3-angle-arc" d="M 370 320 A 30 30 0 0 1 391.7 291.2" fill="none" stroke="#c62828" stroke-width="1.5"/>
                <!-- H标注 -->
                <text id="scene3-h-label" x="440" y="290" text-anchor="start" font-size="13" fill="#c62828">H=74°26′</text>
                <!-- 公式卡片 -->
                <foreignObject x="300" y="100" width="200" height="46">
                    <div xmlns="http://www.w3.org/1999/xhtml" style="background:rgba(21,101,192,0.15); border:1px solid #1565c0; border-radius:4px; display:flex; align-items:center; justify-content:center; height:100%; font-size:12px; font-family:Microsoft YaHei, PingFang SC, sans-serif; color:#000000; white-space:nowrap;">
                        H = 90° − (39° − 23°26′) = 74°26′
                    </div>
                </foreignObject>
            </g>

            <!-- ==================== 右栏：地球公转轨道 ==================== -->
            <text id="scene3-right-title" x="660" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#1565c0">地球公转轨道</text>

            <!-- 公转椭圆 -->
            <ellipse id="scene3-orbit" cx="660" cy="260" rx="100" ry="70" fill="none" stroke="#1565c0" stroke-width="2"/>
            <!-- 太阳外晕 -->
            <circle id="scene3-sun-glow" cx="731" cy="260" r="14" fill="rgba(255,143,0,0.25)"/>
            <!-- 太阳本体 -->
            <circle id="scene3-sun-body" cx="731" cy="260" r="8" fill="#ff8f00"/>
            <!-- 太阳标签 -->
            <text id="scene3-sun-label" x="731" y="340" text-anchor="middle" font-size="12" fill="#000000">太阳</text>

            <!-- 6月22日地球点 -->
            <circle id="scene3-earth-jun22" cx="710" cy="200" r="5" fill="#1565c0"/>
            <text id="scene3-earth-label" x="710" y="185" text-anchor="middle" font-size="12" fill="#000000">6月22日</text>

            <!-- 步骤6：远日点高亮 -->
            <g id="scene3-step6-group" class="scene3-step-el scene3-hidden">
                <circle id="scene3-aphelion-dot" cx="760" cy="260" r="5" fill="#c62828"/>
                <text id="scene3-aphelion-label" x="760" y="370" text-anchor="middle" font-size="12" fill="#c62828">远日点</text>
                <text id="scene3-aphelion-conclusion" x="660" y="355" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e7d32">靠近远日点</text>
            </g>
        </svg>

        <div id="scene3-controls">
            <button id="scene3-btn-prev">◀ 上一步</button>
            <button id="scene3-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 3 实现 - 地方时、昼长与正午太阳高度综合计算

        // 状态变量
        let currentStep = 0;
        const totalSteps = 7; // 步骤 0 ~ 6

        // DOM 元素引用
        const stepIndicator = document.getElementById('scene3-step-indicator');
        const btnPrev = document.getElementById('scene3-btn-prev');
        const btnNext = document.getElementById('scene3-btn-next');

        // 各步骤控制的元素组
        const stepGroups = [
            null, // 步骤0没有新增组（基础状态）
            document.getElementById('scene3-step1-group'),
            document.getElementById('scene3-step2-group'),
            document.getElementById('scene3-step3-group'),
            document.getElementById('scene3-step4-group'),
            document.getElementById('scene3-step5-group'),
            document.getElementById('scene3-step6-group')
        ];

        // 步骤6需要高亮的元素
        const earthJun22 = document.getElementById('scene3-earth-jun22');
        const earthLabel = document.getElementById('scene3-earth-label');

        // 更新步骤显示
        function updateStep() {
            // 更新步骤指示器
            stepIndicator.textContent = '步骤 ' + (currentStep + 1) + ' / ' + totalSteps;

            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps - 1);

            // 控制各步骤组的显隐：使用 display 确保隐藏元素不参与布局
            for (let i = 1; i < stepGroups.length; i++) {
                const group = stepGroups[i];
                if (!group) continue;
                if (i <= currentStep) {
                    group.style.display = 'block';
                    group.classList.remove('scene3-hidden');
                    group.classList.add('scene3-visible');
                } else {
                    group.style.display = 'none';
                    group.classList.remove('scene3-visible');
                    group.classList.add('scene3-hidden');
                }
            }

            // 步骤6特殊处理：高亮6月22日地球点
            if (currentStep >= 6) {
                earthJun22.setAttribute('fill', '#c62828');
                earthLabel.setAttribute('fill', '#c62828');
            } else {
                earthJun22.setAttribute('fill', '#1565c0');
                earthLabel.setAttribute('fill', '#000000');
            }
        }

        // 按钮事件
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateStep();
            }
        });

        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
