<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 1 - 东西半球划分与经度判定</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 16px; z-index: 10; }
        #scene1-controls button {
            padding: 6px 18px; font-size: 14px; cursor: pointer;
            border: 1px solid #bbb; border-radius: 4px; background: #fff; color: #333;
            transition: background 0.2s;
        }
        #scene1-controls button:hover:not(:disabled) { background: #f5f5f5; }
        #scene1-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene1-step-text { font-size: 14px; color: #555; min-width: 80px; text-align: center; }
        .step-hidden { display: none; }
        .step-visible { display: block; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义 -->
            <defs>
                <marker id="scene1-arrowhead" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
                    <polygon points="0 0, 6 2, 0 4" fill="#000"/>
                </marker>
            </defs>

            <!-- ==================== 基础图形（步骤0始终显示） ==================== -->

            <!-- 北半球填充（蓝） -->
            <path id="scene1-fill-north" d="M 280 250 A 120 120 0 0 1 520 250 Z" fill="#1565c0" fill-opacity="0.20" stroke="none"/>

            <!-- 南半球填充（绿） -->
            <path id="scene1-fill-south" d="M 280 250 A 120 120 0 0 0 520 250 Z" fill="#2e7d32" fill-opacity="0.20" stroke="none"/>

            <!-- 北半球轮廓 -->
            <path id="scene1-hemi-north-path" d="M 280 250 A 120 120 0 0 1 520 250" fill="none" stroke="#000000" stroke-width="1.5"/>

            <!-- 南半球轮廓 -->
            <path id="scene1-hemi-south-path" d="M 280 250 A 120 120 0 0 0 520 250" fill="none" stroke="#000000" stroke-width="1.5"/>

            <!-- 赤道线 -->
            <line id="scene1-equator" x1="280" y1="250" x2="520" y2="250" stroke="#000000" stroke-width="1.5"/>

            <!-- 北极点N -->
            <text id="scene1-pole-n" x="400" y="118" text-anchor="middle" font-size="14" fill="#000000" font-weight="bold">N</text>

            <!-- 南极点S -->
            <text id="scene1-pole-s" x="400" y="382" text-anchor="middle" font-size="14" fill="#000000" font-weight="bold">S</text>

            <!-- 北半球经线 7条 (x: 280,320,360,400,440,480,520) -->
            <line id="scene1-meridian-n-1" x1="400" y1="130" x2="280" y2="250" stroke="#000000" stroke-width="1"/>
            <line id="scene1-meridian-n-2" x1="400" y1="130" x2="320" y2="250" stroke="#000000" stroke-width="1"/>
            <line id="scene1-meridian-n-3" x1="400" y1="130" x2="360" y2="250" stroke="#000000" stroke-width="1"/>
            <line id="scene1-meridian-n-4" x1="400" y1="130" x2="400" y2="250" stroke="#000000" stroke-width="1"/>
            <line id="scene1-meridian-n-5" x1="400" y1="130" x2="440" y2="250" stroke="#000000" stroke-width="1"/>
            <line id="scene1-meridian-n-6" x1="400" y1="130" x2="480" y2="250" stroke="#000000" stroke-width="1"/>
            <line id="scene1-meridian-n-7" x1="400" y1="130" x2="520" y2="250" stroke="#000000" stroke-width="1"/>

            <!-- 南半球经线 8条 (x: 333,360,387,413,440,467,493,520) -->
            <line id="scene1-meridian-s-1" x1="400" y1="370" x2="333" y2="250" stroke="#000000" stroke-width="1"/>
            <line id="scene1-meridian-s-2" x1="400" y1="370" x2="360" y2="250" stroke="#000000" stroke-width="1"/>
            <line id="scene1-meridian-s-3" x1="400" y1="370" x2="387" y2="250" stroke="#000000" stroke-width="1"/>
            <line id="scene1-meridian-s-4" x1="400" y1="370" x2="413" y2="250" stroke="#000000" stroke-width="1"/>
            <line id="scene1-meridian-s-5" x1="400" y1="370" x2="440" y2="250" stroke="#000000" stroke-width="1"/>
            <line id="scene1-meridian-s-6" x1="400" y1="370" x2="467" y2="250" stroke="#000000" stroke-width="1"/>
            <line id="scene1-meridian-s-7" x1="400" y1="370" x2="493" y2="250" stroke="#000000" stroke-width="1"/>
            <line id="scene1-meridian-s-8" x1="400" y1="370" x2="520" y2="250" stroke="#000000" stroke-width="1"/>

            <!-- 东半球/西半球文字 —— 移到半球外部避免与填充/经线重叠 -->
            <text id="scene1-label-east" x="240" y="180" text-anchor="middle" font-size="13" fill="#000000">东半球</text>
            <text id="scene1-label-west" x="560" y="320" text-anchor="middle" font-size="13" fill="#000000">西半球</text>

            <!-- 基础经度标注 -->
            <text id="scene1-label-20w-north" x="260" y="242" text-anchor="middle" font-size="12" fill="#000000">20°W</text>
            <text id="scene1-label-160e-north" x="550" y="245" text-anchor="start" font-size="12" fill="#000000">160°E</text>
            <text id="scene1-label-20w-south" x="545" y="262" text-anchor="start" font-size="12" fill="#000000">20°W</text>

            <!-- 图1-9 -->
            <text id="scene1-fig-label" x="400" y="420" text-anchor="middle" font-size="13" fill="#000000">图1-9</text>

            <!-- ==================== 标准划分示意图（右上角，步骤0显示） ==================== -->
            <g id="scene1-diagram">
                <!-- 示意图外圆 -->
                <circle cx="700" cy="110" r="50" fill="none" stroke="#000000" stroke-width="1"/>
                <!-- 左半圆填充（东半球，蓝） -->
                <path d="M 700 60 A 50 50 0 0 1 700 160 Z" fill="#1565c0" fill-opacity="0.25" stroke="none"/>
                <!-- 右半圆填充（西半球，绿） -->
                <path d="M 700 60 A 50 50 0 0 0 700 160 Z" fill="#2e7d32" fill-opacity="0.25" stroke="none"/>
                <!-- 分界线 -->
                <line x1="700" y1="60" x2="700" y2="160" stroke="#000000" stroke-width="1" stroke-dasharray="3,2"/>
                <!-- 示意图标注 —— 外移避免与小圆内部填充重叠 -->
                <text x="680" y="55" text-anchor="middle" font-size="10" fill="#000000">20°W</text>
                <text x="730" y="55" text-anchor="middle" font-size="10" fill="#000000">160°E</text>
                <text x="625" y="110" text-anchor="middle" font-size="10" fill="#000000">东半球</text>
                <text x="765" y="110" text-anchor="middle" font-size="10" fill="#000000">西半球</text>
            </g>

            <!-- ==================== 步骤1：20°W分界线高亮 ==================== -->
            <!-- 北半球最左侧经线高亮 (x=280) -->
            <line id="scene1-highlight-20w-north" class="step-hidden" x1="400" y1="130" x2="280" y2="250" stroke="#1565c0" stroke-width="2.5"/>
            <!-- 南半球最右侧经线高亮 (x=520) -->
            <line id="scene1-highlight-20w-south" class="step-hidden" x1="400" y1="370" x2="520" y2="250" stroke="#1565c0" stroke-width="2.5"/>
            <!-- 分界线说明文字 -->
            <text id="scene1-text-divider" class="step-hidden" x="400" y="100" text-anchor="middle" font-size="13" fill="#1565c0" font-weight="bold">20°W — 东西半球分界线</text>

            <!-- ==================== 步骤2：北半球高亮，求A ==================== -->
            <!-- 北半球高亮框 -->
            <path id="scene1-highlight-north" class="step-hidden" d="M 280 250 A 120 120 0 0 1 520 250" fill="none" stroke="#1565c0" stroke-width="3"/>
            <!-- A点 -->
            <circle id="scene1-point-a" class="step-hidden" cx="520" cy="250" r="5" fill="#c62828"/>
            <text id="scene1-label-a" class="step-hidden" x="535" y="230" text-anchor="start" font-size="13" fill="#c62828" font-weight="bold">A</text>
            <text id="scene1-label-a-lon" class="step-hidden" x="550" y="245" text-anchor="start" font-size="12" fill="#c62828" font-weight="bold">160°E</text>
            <!-- 北半球推导文字 -->
            <text id="scene1-text-north-deduce" class="step-hidden" x="520" y="150" text-anchor="start" font-size="12" fill="#1565c0">东半球范围：20°W → 0° → 160°E（跨180°）</text>

            <!-- ==================== 步骤3：南半球高亮，求B ==================== -->
            <!-- 南半球高亮框 -->
            <path id="scene1-highlight-south" class="step-hidden" d="M 280 250 A 120 120 0 0 0 520 250" fill="none" stroke="#2e7d32" stroke-width="3"/>
            <!-- B点 -->
            <circle id="scene1-point-b" class="step-hidden" cx="333" cy="250" r="5" fill="#c62828"/>
            <text id="scene1-label-b" class="step-hidden" x="318" y="250" text-anchor="end" font-size="13" fill="#c62828" font-weight="bold">B</text>
            <text id="scene1-label-b-lon" class="step-hidden" x="318" y="270" text-anchor="end" font-size="12" fill="#c62828" font-weight="bold">160°W</text>
            <!-- 南半球推导文字 -->
            <text id="scene1-text-south-deduce" class="step-hidden" x="260" y="340" text-anchor="start" font-size="12" fill="#2e7d32">西半球：20°W向西，每20°一条经线，共7格→B=160°W</text>

            <!-- ==================== 步骤4：甲、乙、C定位 ==================== -->
            <!-- 甲点 -->
            <circle id="scene1-point-jia" class="step-hidden" cx="360" cy="250" r="5" fill="#c62828"/>
            <text id="scene1-label-jia" class="step-hidden" x="360" y="265" text-anchor="middle" font-size="13" fill="#c62828" font-weight="bold">甲</text>
            <text id="scene1-label-jia-lon" class="step-hidden" x="360" y="280" text-anchor="middle" font-size="12" fill="#c62828" font-weight="bold">140°W</text>

            <!-- 乙点 -->
            <circle id="scene1-point-yi" class="step-hidden" cx="480" cy="250" r="5" fill="#c62828"/>
            <text id="scene1-label-yi" class="step-hidden" x="480" y="225" text-anchor="middle" font-size="13" fill="#c62828" font-weight="bold">乙</text>
            <text id="scene1-label-yi-lon" class="step-hidden" x="480" y="210" text-anchor="middle" font-size="12" fill="#c62828" font-weight="bold">130°E</text>

            <!-- C点 -->
            <circle id="scene1-point-c" class="step-hidden" cx="400" cy="250" r="5" fill="#c62828"/>
            <text id="scene1-label-c" class="step-hidden" x="400" y="225" text-anchor="middle" font-size="13" fill="#c62828" font-weight="bold">C</text>
            <text id="scene1-label-c-lon" class="step-hidden" x="400" y="210" text-anchor="middle" font-size="12" fill="#c62828" font-weight="bold">70°E</text>

            <!-- 总结文字 -->
            <text id="scene1-text-summary" class="step-hidden" x="400" y="435" text-anchor="middle" font-size="13" fill="#c62828" font-weight="bold">甲 = 140°W，乙 = 130°E，C = 70°E</text>
        </svg>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <span id="scene1-step-text">初始</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        var currentStep = 0;
        var maxStep = 4;

        var btnPrev = document.getElementById('scene1-btn-prev');
        var btnNext = document.getElementById('scene1-btn-next');
        var stepText = document.getElementById('scene1-step-text');

        // 各步骤需要显示的元素ID列表
        var stepConfig = {
            0: {
                show: [],
                hide: ['scene1-highlight-20w-north','scene1-highlight-20w-south','scene1-text-divider',
                       'scene1-highlight-north','scene1-point-a','scene1-label-a','scene1-label-a-lon','scene1-text-north-deduce',
                       'scene1-highlight-south','scene1-point-b','scene1-label-b','scene1-label-b-lon','scene1-text-south-deduce',
                       'scene1-point-jia','scene1-label-jia','scene1-label-jia-lon',
                       'scene1-point-yi','scene1-label-yi','scene1-label-yi-lon',
                       'scene1-point-c','scene1-label-c','scene1-label-c-lon','scene1-text-summary']
            },
            1: {
                show: ['scene1-highlight-20w-north','scene1-highlight-20w-south','scene1-text-divider'],
                hide: ['scene1-highlight-north','scene1-point-a','scene1-label-a','scene1-label-a-lon','scene1-text-north-deduce',
                       'scene1-highlight-south','scene1-point-b','scene1-label-b','scene1-label-b-lon','scene1-text-south-deduce',
                       'scene1-point-jia','scene1-label-jia','scene1-label-jia-lon',
                       'scene1-point-yi','scene1-label-yi','scene1-label-yi-lon',
                       'scene1-point-c','scene1-label-c','scene1-label-c-lon','scene1-text-summary']
            },
            2: {
                show: ['scene1-highlight-20w-north','scene1-highlight-20w-south','scene1-text-divider',
                       'scene1-highlight-north','scene1-point-a','scene1-label-a','scene1-label-a-lon','scene1-text-north-deduce'],
                hide: ['scene1-highlight-south','scene1-point-b','scene1-label-b','scene1-label-b-lon','scene1-text-south-deduce',
                       'scene1-point-jia','scene1-label-jia','scene1-label-jia-lon',
                       'scene1-point-yi','scene1-label-yi','scene1-label-yi-lon',
                       'scene1-point-c','scene1-label-c','scene1-label-c-lon','scene1-text-summary']
            },
            3: {
                show: ['scene1-highlight-20w-north','scene1-highlight-20w-south','scene1-text-divider',
                       'scene1-highlight-north','scene1-point-a','scene1-label-a','scene1-label-a-lon','scene1-text-north-deduce',
                       'scene1-highlight-south','scene1-point-b','scene1-label-b','scene1-label-b-lon','scene1-text-south-deduce'],
                hide: ['scene1-point-jia','scene1-label-jia','scene1-label-jia-lon',
                       'scene1-point-yi','scene1-label-yi','scene1-label-yi-lon',
                       'scene1-point-c','scene1-label-c','scene1-label-c-lon','scene1-text-summary']
            },
            4: {
                show: ['scene1-highlight-20w-north','scene1-highlight-20w-south','scene1-text-divider',
                       'scene1-highlight-north','scene1-point-a','scene1-label-a','scene1-label-a-lon','scene1-text-north-deduce',
                       'scene1-highlight-south','scene1-point-b','scene1-label-b','scene1-label-b-lon','scene1-text-south-deduce',
                       'scene1-point-jia','scene1-label-jia','scene1-label-jia-lon',
                       'scene1-point-yi','scene1-label-yi','scene1-label-yi-lon',
                       'scene1-point-c','scene1-label-c','scene1-label-c-lon','scene1-text-summary'],
                hide: []
            }
        };

        var stepLabels = ['初始', '步骤 1/5', '步骤 2/5', '步骤 3/5', '步骤 4/5'];

        function setVisible(id, visible) {
            var el = document.getElementById(id);
            if (!el) return;
            if (visible) {
                el.style.display = '';
                el.style.opacity = '1';
            } else {
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }

        function renderStep() {
            var cfg = stepConfig[currentStep];
            // 先全部按配置处理
            var allIds = [];
            for (var s = 0; s <= maxStep; s++) {
                if (stepConfig[s].show) allIds = allIds.concat(stepConfig[s].show);
                if (stepConfig[s].hide) allIds = allIds.concat(stepConfig[s].hide);
            }
            // 去重
            var uniqueIds = [];
            for (var i = 0; i < allIds.length; i++) {
                if (uniqueIds.indexOf(allIds[i]) === -1) uniqueIds.push(allIds[i]);
            }
            // 默认隐藏所有动态元素
            for (var i = 0; i < uniqueIds.length; i++) {
                setVisible(uniqueIds[i], false);
            }
            // 显示当前步骤的元素
            for (var s = 0; s <= currentStep; s++) {
                var showList = stepConfig[s].show;
                for (var j = 0; j < showList.length; j++) {
                    setVisible(showList[j], true);
                }
            }

            stepText.textContent = stepLabels[currentStep];
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < maxStep) {
                currentStep++;
                renderStep();
            }
        });

        // 初始渲染
        renderStep();
    })();
    </script>
</body>
</html>
