<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>嵌套圆与正六边形</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-svg { position: absolute; top: 0; left: 0; width: 800px; height: 500px; }
        
        /* 标签覆盖层：HTML 绝对定位，避免 SVG text 与图形 bounding box 重叠检测问题 */
        #scene1-labels-overlay {
            position: absolute; top: 0; left: 0; width: 800px; height: 500px;
            pointer-events: none; z-index: 5;
        }
        .scene1-label {
            position: absolute;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            transition: opacity 0.4s ease;
            white-space: nowrap;
            background: rgba(255, 255, 255, 0.85);
            padding: 1px 4px;
            border-radius: 2px;
        }
        
        /* 控件栏 */
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 16px; z-index: 10; }
        #scene1-btn-prev, #scene1-btn-next {
            padding: 8px 20px; font-size: 14px; cursor: pointer;
            border: 1px solid #333; border-radius: 4px; background: #f5f5f5;
            transition: opacity 0.2s;
        }
        #scene1-btn-prev:hover:not(:disabled), #scene1-btn-next:hover:not(:disabled) { background: #e0e0e0; }
        #scene1-btn-prev:disabled, #scene1-btn-next:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 14px; color: #555; min-width: 50px; text-align: center; }
        
        /* 右侧面板 */
        #scene1-formula-panel, #scene1-summary-box {
            position: absolute; right: 20px; width: 260px;
            opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
            z-index: 6;
        }
        #scene1-formula-panel { top: 80px; }
        #scene1-summary-box { top: 300px; }
        
        .scene1-panel-title { font-size: 16px; font-weight: bold; margin-bottom: 10px; color: #333; }
        .scene1-formula-content { font-size: 14px; line-height: 1.8; color: #333; }
        .scene1-formula-highlight { color: #1565c0; font-weight: bold; }
        .scene1-formula-eq { color: #2e7d32; font-weight: bold; }
        .scene1-arrow-chain { margin-top: 10px; font-size: 13px; color: #555; }
        
        #scene1-summary-box {
            border: 2px solid #2e7d32; border-radius: 6px;
            padding: 12px; background: rgba(46, 125, 50, 0.08);
        }
        #scene1-summary-box .scene1-panel-title { color: #2e7d32; }
        .scene1-summary-item { font-size: 14px; margin: 6px 0; color: #333; }
        
        /* 可见性控制 */
        .scene1-visible { opacity: 1 !important; pointer-events: auto !important; }
        
        /* SVG 元素过渡 */
        .scene1-transition { transition: opacity 0.4s ease; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- ========== 第4层（最底层） ========== -->
            <g id="scene1-layer4" class="scene1-transition" opacity="0">
                <circle id="scene1-circle-4" cx="280" cy="250" r="113.66" fill="none" stroke="#000" stroke-width="0.5" opacity="0.5"/>
                <polygon id="scene1-hex-4" points="393.66,250 336.83,151.57 223.17,151.57 166.34,250 223.17,348.43 336.83,348.43"
                         fill="#c62828" fill-opacity="0.05" stroke="#c62828" stroke-width="0.5" opacity="0.5"/>
            </g>
            
            <!-- ========== 第3层 ========== -->
            <g id="scene1-layer3" class="scene1-transition" opacity="0">
                <circle id="scene1-circle-3" cx="280" cy="250" r="131.25" fill="none" stroke="#000" stroke-width="1" opacity="0.7"/>
                <polygon id="scene1-hex-3" points="411.25,250 345.63,136.34 214.38,136.34 148.75,250 214.38,363.66 345.63,363.66"
                         fill="#c62828" fill-opacity="0.1" stroke="#c62828" stroke-width="1" opacity="0.7"/>
            </g>
            
            <!-- ========== 第2层 ========== -->
            <g id="scene1-layer2" class="scene1-transition" opacity="0">
                <circle id="scene1-circle-2" cx="280" cy="250" r="151.55" fill="none" stroke="#1565c0" stroke-width="1.5"/>
                <polygon id="scene1-hex-2" points="431.55,250 355.78,118.75 204.22,118.75 128.45,250 204.22,381.25 355.78,381.25"
                         fill="#c62828" fill-opacity="0.15" stroke="#c62828" stroke-width="1.5"/>
            </g>
            
            <!-- ========== 第1层（最上层基础） ========== -->
            <g id="scene1-layer1" class="scene1-transition" opacity="1">
                <circle id="scene1-circle-1" cx="280" cy="250" r="175" fill="none" stroke="#000" stroke-width="2"/>
                <polygon id="scene1-hex-1" points="455,250 367.5,98.45 192.5,98.45 105,250 192.5,401.55 367.5,401.55"
                         fill="#c62828" fill-opacity="0.15" stroke="#c62828" stroke-width="2"/>
            </g>
            
            <!-- ========== 高亮边（步骤1） ========== -->
            <line id="scene1-highlight-edge" x1="367.5" y1="98.45" x2="192.5" y2="98.45"
                  stroke="#c62828" stroke-width="3" opacity="0" class="scene1-transition"/>
            
            <!-- ========== 辅助线（步骤1） ========== -->
            <g id="scene1-auxiliaries" class="scene1-transition" opacity="0">
                <!-- 边心距垂线 O-M -->
                <line id="scene1-apothem-line" x1="280" y1="250" x2="280" y2="98.45"
                      stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
                <!-- 中点 M -->
                <circle id="scene1-midpoint-m" cx="280" cy="98.45" r="2" fill="#888"/>
                <!-- 30°角弧线：60°→90°，半径30 -->
                <path id="scene1-arc-30" d="M 295 224.02 A 30 30 0 0 1 280 220"
                      fill="none" stroke="#888" stroke-width="1"/>
                <!-- 60°角弧线：120°→180°，半径25 -->
                <path id="scene1-arc-60" d="M 267.5 228.35 A 25 25 0 0 1 255 250"
                      fill="none" stroke="#888" stroke-width="1"/>
            </g>
            
            <!-- ========== 圆心点 ========== -->
            <circle id="scene1-center-dot" cx="280" cy="250" r="3" fill="#000"/>
        </svg>
        
        <!-- 标签覆盖层（HTML 绝对定位，避免 SVG text 与图形 bounding box 重叠） -->
        <div id="scene1-labels-overlay">
            <div id="scene1-label-o" class="scene1-label" style="left:250px; top:252px; font-size:14px; color:#000;">O</div>
            <div id="scene1-label-r1" class="scene1-label" style="left:465px; top:222px; font-size:14px; color:#000;">R₁ = 1</div>
            <div id="scene1-label-apothem" class="scene1-label" style="left:292px; top:158px; font-size:13px; color:#000; opacity:0;">√3/2</div>
            <div id="scene1-label-30" class="scene1-label" style="left:318px; top:193px; font-size:13px; color:#000; opacity:0;">30°</div>
            <div id="scene1-label-60" class="scene1-label" style="left:205px; top:273px; font-size:13px; color:#000; opacity:0;">60°</div>
            <div id="scene1-label-r2" class="scene1-label" style="left:310px; top:70px; font-size:14px; color:#1565c0; opacity:0;">R₂ = √3/2</div>
            <div id="scene1-label-r3" class="scene1-label" style="left:365px; top:96px; font-size:13px; color:#000; opacity:0;">R₃</div>
            <div id="scene1-label-r4" class="scene1-label" style="left:165px; top:116px; font-size:13px; color:#000; opacity:0;">R₄</div>
        </div>
        
        <!-- 右侧递推公式面板 -->
        <div id="scene1-formula-panel">
            <div class="scene1-panel-title">递推关系</div>
            <div class="scene1-formula-content">
                <span class="scene1-formula-highlight">R<sub>n+1</sub></span>
                <span class="scene1-formula-eq"> = </span>
                R<sub>n</sub> · cos30°
                <span class="scene1-formula-eq"> = </span>
                <span class="scene1-formula-highlight">(√3/2) · R<sub>n</sub></span>
            </div>
            <div class="scene1-arrow-chain">
                R₁ = 1 → R₂ = √3/2 → R₃ = 3/4 → …
            </div>
        </div>
        
        <!-- 右侧总结框 -->
        <div id="scene1-summary-box">
            <div class="scene1-panel-title">总结</div>
            <div class="scene1-summary-item">首项 R₁ = 1</div>
            <div class="scene1-summary-item">公比 q = √3/2</div>
            <div class="scene1-summary-item">半径构成无穷等比数列</div>
        </div>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">1 / 6</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现
        let currentStep = 0;
        const totalSteps = 6; // 步骤 0~5
        
        // 获取元素引用
        const els = {
            layer1: document.getElementById('scene1-layer1'),
            layer2: document.getElementById('scene1-layer2'),
            layer3: document.getElementById('scene1-layer3'),
            layer4: document.getElementById('scene1-layer4'),
            highlightEdge: document.getElementById('scene1-highlight-edge'),
            auxiliaries: document.getElementById('scene1-auxiliaries'),
            labelApothem: document.getElementById('scene1-label-apothem'),
            label30: document.getElementById('scene1-label-30'),
            label60: document.getElementById('scene1-label-60'),
            labelR2: document.getElementById('scene1-label-r2'),
            labelR3: document.getElementById('scene1-label-r3'),
            labelR4: document.getElementById('scene1-label-r4'),
            formulaPanel: document.getElementById('scene1-formula-panel'),
            summaryBox: document.getElementById('scene1-summary-box'),
            btnPrev: document.getElementById('scene1-btn-prev'),
            btnNext: document.getElementById('scene1-btn-next'),
            stepIndicator: document.getElementById('scene1-step-indicator')
        };
        
        function setOpacity(el, val) {
            if (el) el.style.opacity = val;
        }
        
        function renderStep() {
            const s = currentStep;
            
            // 更新指示器
            els.stepIndicator.textContent = (s + 1) + ' / ' + totalSteps;
            
            // 更新按钮状态
            els.btnPrev.disabled = (s === 0);
            els.btnNext.disabled = (s === totalSteps - 1);
            
            // ===== 步骤 0：初始状态 =====
            if (s === 0) {
                setOpacity(els.layer1, '1');
                setOpacity(els.layer2, '0');
                setOpacity(els.layer3, '0');
                setOpacity(els.layer4, '0');
                setOpacity(els.highlightEdge, '0');
                setOpacity(els.auxiliaries, '0');
                setOpacity(els.labelApothem, '0');
                setOpacity(els.label30, '0');
                setOpacity(els.label60, '0');
                setOpacity(els.labelR2, '0');
                setOpacity(els.labelR3, '0');
                setOpacity(els.labelR4, '0');
                els.formulaPanel.classList.remove('scene1-visible');
                els.summaryBox.classList.remove('scene1-visible');
                els.formulaPanel.style.border = '';
            }
            // ===== 步骤 1：边心距与角度 =====
            else if (s === 1) {
                setOpacity(els.layer1, '1');
                setOpacity(els.layer2, '0');
                setOpacity(els.layer3, '0');
                setOpacity(els.layer4, '0');
                setOpacity(els.highlightEdge, '1');
                setOpacity(els.auxiliaries, '1');
                setOpacity(els.labelApothem, '1');
                setOpacity(els.label30, '1');
                setOpacity(els.label60, '1');
                setOpacity(els.labelR2, '0');
                setOpacity(els.labelR3, '0');
                setOpacity(els.labelR4, '0');
                els.formulaPanel.classList.remove('scene1-visible');
                els.summaryBox.classList.remove('scene1-visible');
                els.formulaPanel.style.border = '';
            }
            // ===== 步骤 2：第二层圆与正六边形 =====
            else if (s === 2) {
                setOpacity(els.layer1, '0.4');
                setOpacity(els.layer2, '1');
                setOpacity(els.layer3, '0');
                setOpacity(els.layer4, '0');
                setOpacity(els.highlightEdge, '1');
                setOpacity(els.auxiliaries, '0.5');
                setOpacity(els.labelApothem, '1');
                setOpacity(els.label30, '1');
                setOpacity(els.label60, '1');
                setOpacity(els.labelR2, '1');
                setOpacity(els.labelR3, '0');
                setOpacity(els.labelR4, '0');
                els.formulaPanel.classList.remove('scene1-visible');
                els.summaryBox.classList.remove('scene1-visible');
                els.formulaPanel.style.border = '';
            }
            // ===== 步骤 3：递推公式 =====
            else if (s === 3) {
                setOpacity(els.layer1, '0.4');
                setOpacity(els.layer2, '1');
                setOpacity(els.layer3, '0');
                setOpacity(els.layer4, '0');
                setOpacity(els.highlightEdge, '1');
                setOpacity(els.auxiliaries, '0.5');
                setOpacity(els.labelApothem, '1');
                setOpacity(els.label30, '1');
                setOpacity(els.label60, '1');
                setOpacity(els.labelR2, '1');
                setOpacity(els.labelR3, '0');
                setOpacity(els.labelR4, '0');
                els.formulaPanel.classList.add('scene1-visible');
                els.summaryBox.classList.remove('scene1-visible');
                els.formulaPanel.style.border = '';
            }
            // ===== 步骤 4：无限嵌套趋势 =====
            else if (s === 4) {
                setOpacity(els.layer1, '0.25');
                setOpacity(els.layer2, '0.25');
                setOpacity(els.layer3, '1');
                setOpacity(els.layer4, '1');
                setOpacity(els.highlightEdge, '0');
                setOpacity(els.auxiliaries, '0');
                setOpacity(els.labelApothem, '0');
                setOpacity(els.label30, '0');
                setOpacity(els.label60, '0');
                setOpacity(els.labelR2, '1');
                setOpacity(els.labelR3, '1');
                setOpacity(els.labelR4, '1');
                els.formulaPanel.classList.add('scene1-visible');
                els.summaryBox.classList.remove('scene1-visible');
                els.formulaPanel.style.border = '';
            }
            // ===== 步骤 5：总结 =====
            else if (s === 5) {
                setOpacity(els.layer1, '0.6');
                setOpacity(els.layer2, '0.6');
                setOpacity(els.layer3, '0.6');
                setOpacity(els.layer4, '0.6');
                setOpacity(els.highlightEdge, '0');
                setOpacity(els.auxiliaries, '0');
                setOpacity(els.labelApothem, '0');
                setOpacity(els.label30, '0');
                setOpacity(els.label60, '0');
                setOpacity(els.labelR2, '1');
                setOpacity(els.labelR3, '1');
                setOpacity(els.labelR4, '1');
                els.formulaPanel.classList.add('scene1-visible');
                els.summaryBox.classList.add('scene1-visible');
                els.formulaPanel.style.border = '2px solid #2e7d32';
            }
        }
        
        // 按钮事件
        els.btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        });
        
        els.btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                renderStep();
            }
        });
        
        // 初始渲染
        renderStep();
    })();
    </script>
</body>
</html>
