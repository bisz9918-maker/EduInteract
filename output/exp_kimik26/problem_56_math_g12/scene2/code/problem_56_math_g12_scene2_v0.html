<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 圆的面积构成等比数列</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene2-controls button {
            padding: 6px 16px; font-size: 14px; cursor: pointer;
            border: 1px solid #999; border-radius: 4px; background: #f0f0f0;
            min-width: 100px; height: 32px;
        }
        #scene2-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene2-step-indicator { font-size: 14px; color: #333; min-width: 80px; text-align: center; }
        /* 步骤元素的过渡效果 */
        .scene2-step-el { transition: opacity 200ms ease; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 定义 -->
            <defs>
                <style>
                    .s2-title { font-size: 18px; font-weight: bold; fill: #000; }
                    .s2-formula { font-size: 15px; fill: #000; }
                    .s2-blue { fill: #1565c0; }
                    .s2-red { fill: #c62828; }
                    .s2-green { fill: #2e7d32; }
                    .s2-gray { fill: #666; font-size: 13px; }
                    .s2-axis-label { font-size: 13px; fill: #000; text-anchor: middle; }
                    .s2-axis-label-green { font-size: 13px; fill: #2e7d32; text-anchor: middle; }
                    .s2-bar-label { font-size: 13px; fill: #000; text-anchor: middle; }
                    .s2-brace { stroke: #2e7d32; stroke-width: 1.5; fill: none; }
                    .s2-dash { stroke: #888; stroke-width: 1; stroke-dasharray: 3,3; fill: none; }
                    .s2-axis-line { stroke: #000; stroke-width: 1.5; fill: none; }
                    .s2-bar { stroke-width: 1.5; }
                </style>
            </defs>

            <!-- 标题: 步骤0显示 -->
            <text id="scene2-title" class="scene2-step-el s2-title" x="400" y="50" text-anchor="middle" data-step="0">圆的面积构成等比数列及无穷求和</text>

            <!-- 公式区 -->
            <!-- S₁ = π·R₁² = π (m²) : 步骤0, π蓝色 -->
            <text id="scene2-formula-s1" class="scene2-step-el s2-formula" x="80" y="84" data-step="0">
                S<tspan dy="3" font-size="11px">1</tspan><tspan dy="-3"> = π·R</tspan><tspan dy="3" font-size="11px">1</tspan><tspan dy="-3">² = </tspan><tspan class="s2-blue">π</tspan> (m²)
            </text>

            <!-- S₂ = π·R₂² = 3π/4 (m²) : 步骤1 -->
            <text id="scene2-formula-s2" class="scene2-step-el s2-formula" x="80" y="124" data-step="1">
                S<tspan dy="3" font-size="11px">2</tspan><tspan dy="-3"> = π·R</tspan><tspan dy="3" font-size="11px">2</tspan><tspan dy="-3">² = 3π/4 (m²)</tspan>
            </text>

            <!-- S₂/S₁ = 3/4 : 步骤1, 全红色 -->
            <text id="scene2-formula-ratio" class="scene2-step-el s2-formula s2-red" x="400" y="124" data-step="1">
                S<tspan dy="3" font-size="11px">2</tspan><tspan dy="-3">/S</tspan><tspan dy="3" font-size="11px">1</tspan><tspan dy="-3"> = 3/4</tspan>
            </text>

            <!-- S₃ = π·(3/4)² = 9π/16 (m²) : 步骤2 -->
            <text id="scene2-formula-s3" class="scene2-step-el s2-formula" x="80" y="164" data-step="2">
                S<tspan dy="3" font-size="11px">3</tspan><tspan dy="-3"> = π·(3/4)² = 9π/16 (m²)</tspan>
            </text>

            <!-- Sₙ = π·(3/4)^(n-1) : 步骤2, (3/4)红色 -->
            <text id="scene2-formula-general" class="scene2-step-el s2-formula" x="400" y="164" data-step="2">
                S<tspan dy="3" font-size="11px">n</tspan><tspan dy="-3"> = π·</tspan><tspan class="s2-red">(3/4)</tspan><tspan font-size="11px">^(n-1)</tspan>
            </text>

            <!-- S = S₁/(1-q) : 步骤3, 全绿色 -->
            <text id="scene2-formula-sum" class="scene2-step-el s2-formula s2-green" x="80" y="204" data-step="3">
                S = S<tspan dy="3" font-size="11px">1</tspan><tspan dy="-3">/(1-q)</tspan>
            </text>

            <!-- |q| < 1 : 步骤3, 全绿色 -->
            <text id="scene2-formula-condition" class="scene2-step-el s2-formula s2-green" x="400" y="204" data-step="3">
                |q| &lt; 1
            </text>

            <!-- S = π/(1-3/4) = 4π (m²) : 步骤4, 4π绿色 -->
            <text id="scene2-formula-result" class="scene2-step-el s2-formula" x="80" y="244" data-step="4">
                S = π/(1-3/4) = <tspan class="s2-green">4π</tspan> (m²)
            </text>

            <!-- 步骤5说明: 所有圆面积之和 S = 4π (m²) : 步骤5, 4π绿色 -->
            <text id="scene2-formula-final" class="scene2-step-el s2-formula" x="80" y="280" data-step="5">
                所有圆面积之和 S = <tspan class="s2-green">4π</tspan> (m²)
            </text>

            <!-- 条形图标题: 步骤5 -->
            <text id="scene2-bar-title" class="scene2-step-el s2-gray" x="80" y="310" data-step="5">面积条形图（单位：π）</text>

            <!-- 方括号: 步骤5 -->
            <g id="scene2-brace-group" class="scene2-step-el" data-step="5">
                <line class="s2-brace" x1="80" y1="338" x2="640" y2="338" />
                <line class="s2-brace" x1="80" y1="338" x2="80" y2="348" />
                <line class="s2-brace" x1="640" y1="338" x2="640" y2="348" />
                <text class="s2-green" x="360" y="336" text-anchor="middle" font-size="13px">总和 = 4π</text>
            </g>

            <!-- 条形图标签 -->
            <text id="scene2-label-s1" class="scene2-step-el s2-bar-label" x="150" y="372" data-step="0">S₁</text>
            <text id="scene2-label-s2" class="scene2-step-el s2-bar-label" x="272" y="372" data-step="1">S₂</text>
            <text id="scene2-label-s3" class="scene2-step-el s2-bar-label" x="364" y="372" data-step="2">S₃</text>

            <!-- 条形图 -->
            <!-- 条形1 S₁=π: 蓝色, 步骤0, x=80, w=140 -->
            <rect id="scene2-bar-1" class="scene2-step-el s2-bar" x="80" y="378" width="140" height="22"
                  fill="#1565c0" fill-opacity="0.25" stroke="#1565c0" data-step="0" />

            <!-- 条形2 S₂=3π/4: 红色, 步骤1, x=220, w=105 -->
            <rect id="scene2-bar-2" class="scene2-step-el s2-bar" x="220" y="378" width="105" height="22"
                  fill="#c62828" fill-opacity="0.25" stroke="#c62828" data-step="1" />

            <!-- 条形3 S₃=9π/16: 蓝色, 步骤2, x=325, w=79 -->
            <rect id="scene2-bar-3" class="scene2-step-el s2-bar" x="325" y="378" width="79" height="22"
                  fill="#1565c0" fill-opacity="0.25" stroke="#1565c0" data-step="2" />

            <!-- 条形4 S₄=27π/64: 红色, 步骤4, x=404, w=59 -->
            <rect id="scene2-bar-4" class="scene2-step-el s2-bar" x="404" y="378" width="59" height="22"
                  fill="#c62828" fill-opacity="0.25" stroke="#c62828" data-step="4" />

            <!-- 条形5 S₅=81π/256: 蓝色, 步骤5, x=463, w=44 -->
            <rect id="scene2-bar-5" class="scene2-step-el s2-bar" x="463" y="378" width="44" height="22"
                  fill="#1565c0" fill-opacity="0.25" stroke="#1565c0" data-step="5" />

            <!-- 条形6 S₆=243π/1024: 红色, 步骤5, x=507, w=33 -->
            <rect id="scene2-bar-6" class="scene2-step-el s2-bar" x="507" y="378" width="33" height="22"
                  fill="#c62828" fill-opacity="0.25" stroke="#c62828" data-step="5" />

            <!-- 条形剩余: 绿色虚线, 步骤5, x=540, w=100 -->
            <rect id="scene2-bar-rest" class="scene2-step-el s2-bar" x="540" y="378" width="100" height="22"
                  fill="#2e7d32" fill-opacity="0.15" stroke="#2e7d32" stroke-dasharray="4,2" data-step="5" />

            <!-- 基线: 步骤0 -->
            <line id="scene2-base-line" class="scene2-step-el s2-axis-line" x1="80" y1="406" x2="640" y2="406" data-step="0" />

            <!-- 辅助虚线: 步骤5 -->
            <g id="scene2-dash-lines" class="scene2-step-el" data-step="5">
                <line class="s2-dash" x1="220" y1="378" x2="220" y2="418" />
                <line class="s2-dash" x1="360" y1="378" x2="360" y2="418" />
                <line class="s2-dash" x1="500" y1="378" x2="500" y2="418" />
                <line class="s2-dash" x1="640" y1="378" x2="640" y2="418" />
            </g>

            <!-- 数轴线: 步骤5 -->
            <line id="scene2-axis-line" class="scene2-step-el s2-axis-line" x1="80" y1="418" x2="640" y2="418" data-step="5" />

            <!-- 刻度标签: 步骤5 -->
            <g id="scene2-axis-labels" class="scene2-step-el" data-step="5">
                <text class="s2-axis-label" x="80" y="436">0</text>
                <text class="s2-axis-label" x="220" y="436">π</text>
                <text class="s2-axis-label" x="360" y="436">2π</text>
                <text class="s2-axis-label" x="500" y="436">3π</text>
                <text class="s2-axis-label-green" x="640" y="436">4π</text>
            </g>
        </svg>

        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-btn-prev" disabled>◀ 上一步</button>
            <span id="scene2-step-indicator">步骤 1 / 6</span>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2 实现
        let currentStep = 0;
        const totalSteps = 6; // 步骤 0~5

        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        const stepIndicator = document.getElementById('scene2-step-indicator');
        const stepElements = document.querySelectorAll('.scene2-step-el');

        function updateScene() {
            // 更新步骤指示器
            stepIndicator.textContent = '步骤 ' + (currentStep + 1) + ' / ' + totalSteps;

            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps - 1);

            // 更新元素显隐
            stepElements.forEach(function(el) {
                const stepMin = parseInt(el.getAttribute('data-step'), 10);
                if (currentStep >= stepMin) {
                    el.style.display = '';
                    el.style.opacity = '1';
                } else {
                    el.style.display = 'none';
                    el.style.opacity = '0';
                }
            });
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateScene();
            }
        });

        // 初始化
        updateScene();
    })();
    </script>
</body>
</html>
