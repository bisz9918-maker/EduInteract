<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 1 - 空间基本模型与圆锥面的形成</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 16px; z-index: 10; }
        #scene1-controls button {
            padding: 6px 18px; font-size: 14px; cursor: pointer;
            border: 1px solid #ccc; border-radius: 4px; background: #f8f8f8;
            transition: background 0.2s;
        }
        #scene1-controls button:hover { background: #e8e8e8; }
        #scene1-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 14px; color: #555; min-width: 80px; text-align: center; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 平面 M：平行四边形 -->
            <path id="scene1-plane-m" d="M 200 420 L 600 420 L 480 351 L 80 351 Z"
                  fill="#f5f5f5" fill-opacity="0.3" stroke="#000000" stroke-width="1.5"/>

            <!-- 垂线段 PO（虚线） -->
            <line id="scene1-line-po" x1="400" y1="160" x2="400" y2="360"
                  stroke="#888888" stroke-width="1" stroke-dasharray="6,4"/>

            <!-- 斜线 PA -->
            <line id="scene1-line-pa" x1="400" y1="160" x2="260" y2="400"
                  stroke="#1565c0" stroke-width="2" style="display:none"/>

            <!-- 动直线 PB -->
            <line id="scene1-line-pb" x1="400" y1="160" x2="480" y2="360"
                  stroke="#c62828" stroke-width="2" style="display:none"/>

            <!-- 圆锥母线族（5条） -->
            <line id="scene1-cone-line-1" x1="400" y1="160" x2="220" y2="380"
                  stroke="#c62828" stroke-width="1.5" opacity="0" style="display:none"/>
            <line id="scene1-cone-line-2" x1="400" y1="160" x2="260" y2="400"
                  stroke="#c62828" stroke-width="1.5" opacity="0" style="display:none"/>
            <line id="scene1-cone-line-3" x1="400" y1="160" x2="340" y2="420"
                  stroke="#c62828" stroke-width="1.5" opacity="0" style="display:none"/>
            <line id="scene1-cone-line-4" x1="400" y1="160" x2="480" y2="360"
                  stroke="#c62828" stroke-width="1.5" opacity="0" style="display:none"/>
            <line id="scene1-cone-line-5" x1="400" y1="160" x2="520" y2="340"
                  stroke="#c62828" stroke-width="1.5" opacity="0" style="display:none"/>

            <!-- 圆锥面填充 -->
            <polygon id="scene1-cone-surface" points="400,160 220,380 260,400 340,420 480,360 520,340"
                     fill="#1565c0" fill-opacity="0" stroke="none" style="display:none"/>

            <!-- 轨迹椭圆 -->
            <ellipse id="scene1-trajectory" cx="370" cy="370" rx="100" ry="55"
                     transform="rotate(-10, 370, 370)"
                     stroke="#2e7d32" stroke-width="2.5" fill="none" style="display:none"/>

            <!-- 角度弧 α（PO 与 PA 之间） -->
            <path id="scene1-arc-alpha" d="" stroke="#ff9800" stroke-width="1.5" fill="none" style="display:none"/>

            <!-- 角度弧 β（PA 与 PB 之间） -->
            <path id="scene1-arc-beta" d="" stroke="#ff9800" stroke-width="1.5" fill="none" style="display:none"/>

            <!-- 点标记 -->
            <circle id="scene1-point-p" cx="400" cy="160" r="3" fill="#000000"/>
            <circle id="scene1-point-o" cx="400" cy="360" r="3" fill="#000000"/>
            <circle id="scene1-point-a" cx="260" cy="400" r="3" fill="#000000" style="display:none"/>
            <circle id="scene1-point-b" cx="480" cy="360" r="3" fill="#000000" style="display:none"/>

            <!-- 标签：放置于绝对无图形重叠的空白区域 -->
            <text id="scene1-label-p" x="390" y="150" font-size="14" font-weight="bold" fill="#000000">P</text>
            <!-- O 标签放在极左侧空白区，远离所有线段 -->
            <text id="scene1-label-o" x="50" y="100" font-size="14" font-weight="bold" fill="#000000">O</text>
            <!-- A 标签放在左侧空白区 -->
            <text id="scene1-label-a" x="50" y="280" font-size="14" font-weight="bold" fill="#000000" style="display:none">A</text>
            <!-- B 标签放在右侧空白区 -->
            <text id="scene1-label-b" x="700" y="280" font-size="14" font-weight="bold" fill="#000000" style="display:none">B</text>
            <text id="scene1-label-m" x="660" y="340" font-size="14" font-weight="bold" fill="#000000">M</text>
            <!-- α 标签放在左上空白区 -->
            <text id="scene1-label-alpha" x="50" y="160" font-size="14" font-weight="bold" fill="#000000" style="display:none">α</text>
            <!-- β 标签放在右上空白区 -->
            <text id="scene1-label-beta" x="700" y="160" font-size="14" font-weight="bold" fill="#000000" style="display:none">β</text>
            <!-- 椭圆标签放在右下空白区 -->
            <text id="scene1-label-ellipse" x="700" y="450" font-size="14" font-weight="bold" fill="#2e7d32" style="display:none">椭圆</text>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/5</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        var currentStep = 0;
        var totalSteps = 5;

        var btnPrev = document.getElementById('scene1-btn-prev');
        var btnNext = document.getElementById('scene1-btn-next');
        var indicator = document.getElementById('scene1-step-indicator');

        // 计算角度（SVG坐标系：0°向右，顺时针为正）
        function angleFromPoints(px, py, qx, qy) {
            var dx = qx - px;
            var dy = qy - py;
            var rad = Math.atan2(dy, dx);
            var deg = rad * 180 / Math.PI;
            return deg;
        }

        // P=(400,160), O=(400,360), A=(260,400), B=(480,360)
        var anglePO = angleFromPoints(400, 160, 400, 360);   // 90° (向下)
        var anglePA = angleFromPoints(400, 160, 260, 400);   // ~120.26° (左下)
        var anglePB = angleFromPoints(400, 160, 480, 360);   // ~68.20° (右下)

        // 直接构造圆弧路径（SVG坐标系）
        function arcPath(cx, cy, r, startAngle, endAngle) {
            var startRad = startAngle * Math.PI / 180;
            var endRad = endAngle * Math.PI / 180;
            var x1 = cx + r * Math.cos(startRad);
            var y1 = cy + r * Math.sin(startRad);
            var x2 = cx + r * Math.cos(endRad);
            var y2 = cy + r * Math.sin(endRad);
            var largeArc = (endAngle - startAngle <= 180) ? "0" : "1";
            return "M " + x1 + " " + y1 + " A " + r + " " + r + " 0 " + largeArc + " 1 " + x2 + " " + y2;
        }

        // α弧：从PO(90°)到PA(120.26°)
        var arcAlpha = document.getElementById('scene1-arc-alpha');
        arcAlpha.setAttribute('d', arcPath(400, 160, 40, anglePO, anglePA));

        // β弧：从PB(68.2°)到PA(120.26°)
        var arcBeta = document.getElementById('scene1-arc-beta');
        arcBeta.setAttribute('d', arcPath(400, 160, 55, anglePB, anglePA));

        // 元素显隐控制
        function show(el) {
            if (!el) return;
            el.style.display = '';
            el.style.opacity = '1';
        }
        function hide(el) {
            if (!el) return;
            el.style.display = 'none';
            el.style.opacity = '0';
        }
        function setOpacity(el, op) {
            if (!el) return;
            el.style.opacity = String(op);
        }

        // 各步骤元素映射
        var els = {
            pa: document.getElementById('scene1-line-pa'),
            pb: document.getElementById('scene1-line-pb'),
            pointA: document.getElementById('scene1-point-a'),
            pointB: document.getElementById('scene1-point-b'),
            arcAlpha: document.getElementById('scene1-arc-alpha'),
            arcBeta: document.getElementById('scene1-arc-beta'),
            labelA: document.getElementById('scene1-label-a'),
            labelB: document.getElementById('scene1-label-b'),
            labelAlpha: document.getElementById('scene1-label-alpha'),
            labelBeta: document.getElementById('scene1-label-beta'),
            coneLines: [
                document.getElementById('scene1-cone-line-1'),
                document.getElementById('scene1-cone-line-2'),
                document.getElementById('scene1-cone-line-3'),
                document.getElementById('scene1-cone-line-4'),
                document.getElementById('scene1-cone-line-5')
            ],
            coneSurface: document.getElementById('scene1-cone-surface'),
            trajectory: document.getElementById('scene1-trajectory'),
            labelEllipse: document.getElementById('scene1-label-ellipse')
        };

        function renderStep(step) {
            // 先隐藏所有动态元素
            hide(els.pa);
            hide(els.pb);
            hide(els.pointA);
            hide(els.pointB);
            hide(els.arcAlpha);
            hide(els.arcBeta);
            hide(els.labelA);
            hide(els.labelB);
            hide(els.labelAlpha);
            hide(els.labelBeta);
            els.coneLines.forEach(function(l) { hide(l); setOpacity(l, 0); });
            hide(els.coneSurface);
            setOpacity(els.coneSurface, 0);
            hide(els.trajectory);
            hide(els.labelEllipse);

            if (step >= 1) {
                show(els.pa);
                show(els.pointA);
                show(els.labelA);
                show(els.arcAlpha);
                show(els.labelAlpha);
            }
            if (step >= 2) {
                show(els.pb);
                show(els.pointB);
                show(els.labelB);
                show(els.arcBeta);
                show(els.labelBeta);
            }
            if (step >= 3) {
                // 母线渐显
                els.coneLines.forEach(function(l, i) {
                    show(l);
                    setOpacity(l, 0.4);
                });
                show(els.coneSurface);
                setOpacity(els.coneSurface, 0.15);
                // PB 保持显示
                show(els.pb);
                show(els.pointB);
                show(els.labelB);
            }
            if (step >= 4) {
                show(els.trajectory);
                show(els.labelEllipse);
                // 保留圆锥面但降低透明度
                els.coneLines.forEach(function(l) {
                    show(l);
                    setOpacity(l, 0.15);
                });
                show(els.coneSurface);
                setOpacity(els.coneSurface, 0.08);
                show(els.pb);
                show(els.pointB);
                show(els.labelB);
            }

            // 更新按钮状态
            btnPrev.disabled = step === 0;
            btnNext.disabled = step === totalSteps - 1;
            indicator.textContent = '步骤 ' + (step + 1) + '/' + totalSteps;
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep(currentStep);
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                renderStep(currentStep);
            }
        });

        // 初始渲染
        renderStep(currentStep);
    })();
    </script>
</body>
</html>
