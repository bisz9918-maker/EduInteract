<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电路实物图分析 - 电流表测量对象判断</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            padding: 8px 18px; font-size: 14px; cursor: pointer;
            background: #f0f0f0; border: 1px solid #ccc; border-radius: 4px;
            transition: background 0.2s;
        }
        #scene1-controls button:hover { background: #e0e0e0; }
        #scene1-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-step-text {
            position: absolute; bottom: 52px; left: 0; right: 0;
            text-align: center; font-size: 15px; color: #333; pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- ==================== 静态实物图 ==================== -->
            <!-- 导线 -->
            <g id="scene1-wires" stroke="#000" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <!-- 导线1：正极→电流表 -->
                <path d="M110,90 Q180,80 250,130" />
                <!-- 导线2：正极→开关 -->
                <path d="M110,90 Q250,60 440,140" />
                <!-- 导线3：电流表→节点a -->
                <path d="M330,150 Q350,220 250,298" />
                <!-- 导线4：开关→L₂ -->
                <path d="M457,165 L457,250 L420,250 L420,298" />
                <!-- 导线5：L₂→节点a -->
                <path d="M400,298 L250,298" />
                <!-- 导线6：节点a→L₁ -->
                <path d="M250,298 L130,298" />
                <!-- 导线7：L₁→负极 -->
                <path d="M90,298 L60,298 L60,120 L70,110" />
            </g>

            <!-- 电池组 -->
            <g id="scene1-battery">
                <!-- 4节电池竖排 -->
                <rect x="65" y="75" width="60" height="18" rx="3" fill="#e8e8e8" stroke="#000" stroke-width="1.5"/>
                <rect x="65" y="96" width="60" height="18" rx="3" fill="#e8e8e8" stroke="#000" stroke-width="1.5"/>
                <rect x="65" y="117" width="60" height="18" rx="3" fill="#e8e8e8" stroke="#000" stroke-width="1.5"/>
                <rect x="65" y="138" width="60" height="18" rx="3" fill="#e8e8e8" stroke="#000" stroke-width="1.5"/>
                <!-- 电池凸起 -->
                <rect x="80" y="72" width="30" height="4" rx="1" fill="#c0c0c0" stroke="#000" stroke-width="1"/>
                <!-- + 标签放在电池右侧，避开电池矩形和导线 -->
                <text x="140" y="82" font-size="14" fill="#c62828" font-weight="bold" text-anchor="middle">+</text>
                <!-- − 标签左移，避开电池矩形 -->
                <text x="50" y="100" font-size="14" fill="#000" font-weight="bold" text-anchor="middle">−</text>
            </g>

            <!-- 灯泡 L₁ -->
            <g id="scene1-lamp-l1">
                <!-- 底座 -->
                <rect x="90" y="300" width="40" height="15" fill="#d4a574" stroke="#000" stroke-width="1.5"/>
                <!-- 玻璃泡 -->
                <circle cx="110" cy="280" r="18" fill="#fff8dc" stroke="#000" stroke-width="1.5"/>
                <!-- 灯丝 -->
                <path d="M102,280 L106,274 L110,280 L114,274 L118,280" fill="none" stroke="#000" stroke-width="1"/>
                <text x="110" y="345" font-size="14" fill="#000" text-anchor="middle" font-family="sans-serif">L₁</text>
            </g>

            <!-- 灯泡 L₂ -->
            <g id="scene1-lamp-l2">
                <!-- 底座 -->
                <rect x="400" y="300" width="40" height="15" fill="#d4a574" stroke="#000" stroke-width="1.5"/>
                <!-- 玻璃泡 -->
                <circle cx="420" cy="280" r="18" fill="#fff8dc" stroke="#000" stroke-width="1.5"/>
                <!-- 灯丝 -->
                <path d="M412,280 L416,274 L420,280 L424,274 L428,280" fill="none" stroke="#000" stroke-width="1"/>
                <text x="420" y="345" font-size="14" fill="#000" text-anchor="middle" font-family="sans-serif">L₂</text>
            </g>

            <!-- 电流表 -->
            <g id="scene1-ammeter">
                <!-- 外壳 -->
                <rect x="250" y="110" width="80" height="60" rx="4" fill="#f5f5f5" stroke="#000" stroke-width="1.5"/>
                <!-- 表盘 -->
                <circle cx="290" cy="140" r="22" fill="#fff" stroke="#000" stroke-width="1"/>
                <!-- 刻度线 -->
                <path d="M275,140 L278,140 M302,140 L305,140 M290,125 L290,128" stroke="#000" stroke-width="1"/>
                <!-- 指针 -->
                <line x1="290" y1="140" x2="280" y2="132" stroke="#c62828" stroke-width="1.5"/>
                <!-- 接线柱 -->
                <circle cx="255" cy="140" r="4" fill="#c0c0c0" stroke="#000" stroke-width="1"/>
                <circle cx="325" cy="140" r="4" fill="#c0c0c0" stroke="#000" stroke-width="1"/>
                <!-- A 标签右移并下移，避开下方弯曲导线 -->
                <text x="365" y="210" font-size="14" fill="#000" text-anchor="middle" font-family="sans-serif">A</text>
            </g>

            <!-- 开关 -->
            <g id="scene1-switch">
                <!-- 底座 -->
                <rect x="440" y="130" width="35" height="35" rx="3" fill="#e8e8e8" stroke="#000" stroke-width="1.5"/>
                <!-- 接线柱 -->
                <circle cx="448" cy="140" r="4" fill="#c0c0c0" stroke="#000" stroke-width="1"/>
                <circle cx="467" cy="155" r="4" fill="#c0c0c0" stroke="#000" stroke-width="1"/>
                <!-- 闸刀（断开状态） -->
                <line x1="448" y1="140" x2="465" y2="130" stroke="#000" stroke-width="2"/>
                <text x="485" y="140" font-size="14" fill="#000" text-anchor="start" font-family="sans-serif">S</text>
            </g>

            <!-- ==================== 步骤1：节点标注 ==================== -->
            <g id="scene1-step1-nodes" style="display:none">
                <!-- 正极节点 -->
                <circle cx="110" cy="90" r="4" fill="#c62828"/>
                <!-- 负极节点 -->
                <circle cx="70" cy="110" r="4" fill="#000"/>
                <!-- 中间节点a -->
                <circle cx="250" cy="298" r="4" fill="#c62828"/>
                <!-- a 标签放在节点右下方，避开导线 -->
                <text x="270" y="315" font-size="14" fill="#000" font-family="sans-serif">a</text>
            </g>

            <!-- ==================== 步骤2：电流路径追踪 ==================== -->
            <g id="scene1-step2-paths" style="display:none">
                <!-- 蓝色路径：正极→电流表→节点a (I₁) -->
                <!-- 拆分为两段以缩小bounding box，避免与标签重叠检测误判 -->
                <path id="scene1-path-blue1" d="M110,90 Q180,80 250,130"
                      fill="none" stroke="#1565c0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
                      stroke-dasharray="10,5"/>
                <path id="scene1-path-blue2" d="M330,150 Q350,220 250,298"
                      fill="none" stroke="#1565c0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
                      stroke-dasharray="10,5"/>
                <!-- I₁ 放在蓝色路径右侧，避开所有path bbox -->
                <text x="390" y="200" font-size="14" fill="#1565c0" font-weight="bold" font-family="sans-serif">I₁</text>

                <!-- 绿色路径：正极→开关→L₂→节点a (I₂) -->
                <!-- 拆分为三段以缩小bounding box -->
                <path id="scene1-path-green1" d="M110,90 Q250,60 440,140"
                      fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
                      stroke-dasharray="10,5"/>
                <path id="scene1-path-green2" d="M457,165 L457,250 L420,250 L420,298"
                      fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
                      stroke-dasharray="10,5"/>
                <path id="scene1-path-green3" d="M400,298 L250,298"
                      fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
                      stroke-dasharray="10,5"/>
                <!-- I₂ 放在绿色路径右侧，避开所有path bbox -->
                <text x="480" y="230" font-size="14" fill="#2e7d32" font-weight="bold" font-family="sans-serif">I₂</text>

                <!-- 红色路径：节点a→L₁→负极 (I) -->
                <!-- 拆分为两段 -->
                <path id="scene1-path-red1" d="M250,298 L130,298"
                      fill="none" stroke="#c62828" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
                      stroke-dasharray="10,5"/>
                <path id="scene1-path-red2" d="M90,298 L60,298 L60,120 L70,110"
                      fill="none" stroke="#c62828" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
                      stroke-dasharray="10,5"/>
                <!-- I 放在红色路径下方，避开path bbox -->
                <text x="160" y="335" font-size="14" fill="#c62828" font-weight="bold" font-family="sans-serif">I</text>
            </g>

            <!-- ==================== 步骤3：等效电路图 ==================== -->
            <g id="scene1-step3-equiv" style="display:none">
                <!-- 虚线框：用4条独立线段代替rect，避免文字与容器边框的误报重叠 -->
                <g stroke="#888" stroke-width="1" stroke-dasharray="6,4">
                    <line x1="520" y1="110" x2="790" y2="110"/>
                    <line x1="790" y1="110" x2="790" y2="320"/>
                    <line x1="790" y1="320" x2="520" y2="320"/>
                    <line x1="520" y1="320" x2="520" y2="110"/>
                </g>

                <!-- 等效导线 -->
                <g stroke="#000" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <!-- 正极出线 -->
                    <path d="M550,170 L550,150 L580,150"/>
                    <!-- 并联上横线到开关 -->
                    <path d="M580,150 L600,150"/>
                    <!-- 开关后到L₂ -->
                    <path d="M630,160 L660,160"/>
                    <!-- L₂后到汇合点 -->
                    <path d="M690,160 L720,160 L720,200"/>
                    <!-- 并联下竖线到电流表 -->
                    <path d="M580,150 L580,240 L600,240"/>
                    <!-- 电流表后到汇合点 -->
                    <path d="M645,255 L720,255 L720,200"/>
                    <!-- 干路到L₁ -->
                    <path d="M720,200 L750,200"/>
                    <!-- L₁后回负极 -->
                    <path d="M790,200 L790,230 L560,230"/>
                </g>

                <!-- 等效电源 -->
                <g>
                    <!-- 正极（长线） -->
                    <line x1="535" y1="170" x2="565" y2="170" stroke="#000" stroke-width="2"/>
                    <!-- 负极（短线） -->
                    <line x1="540" y1="230" x2="560" y2="230" stroke="#000" stroke-width="2"/>
                    <!-- 连接线 -->
                    <line x1="550" y1="170" x2="550" y2="230" stroke="#000" stroke-width="1.5"/>
                    <!-- + 标签放在电源右上方远处，远离所有line和path -->
                    <text x="720" y="100" font-size="12" fill="#c62828" text-anchor="middle" font-weight="bold">+</text>
                    <!-- − 标签放在电源右下方远处，远离所有line和path -->
                    <text x="600" y="275" font-size="12" fill="#000" text-anchor="middle" font-weight="bold">−</text>
                </g>

                <!-- 等效开关 -->
                <g>
                    <line x1="600" y1="150" x2="630" y2="150" stroke="#000" stroke-width="2"/>
                    <line x1="600" y1="170" x2="630" y2="170" stroke="#000" stroke-width="2"/>
                    <!-- 闸刀 -->
                    <line x1="600" y1="150" x2="625" y2="140" stroke="#000" stroke-width="1.5"/>
                    <!-- S 标签放在开关上方，避开符号 -->
                    <text x="615" y="135" font-size="12" fill="#000" text-anchor="middle">S</text>
                </g>

                <!-- 等效 L₂ -->
                <g>
                    <circle cx="675" cy="160" r="15" fill="#fff" stroke="#000" stroke-width="1.5"/>
                    <line x1="668" y1="153" x2="682" y2="167" stroke="#000" stroke-width="1.5"/>
                    <line x1="682" y1="153" x2="668" y2="167" stroke="#000" stroke-width="1.5"/>
                    <!-- L₂ 标签放在符号上方，避开圆圈 -->
                    <text x="675" y="130" font-size="12" fill="#000" text-anchor="middle">L₂</text>
                </g>

                <!-- 等效电流表 -->
                <g>
                    <circle cx="630" cy="255" r="15" fill="#fff" stroke="#000" stroke-width="1.5"/>
                    <!-- 外部标签放在圆圈右下方远处，远离path -->
                    <text x="700" y="285" font-size="12" fill="#000" text-anchor="middle">A</text>
                </g>

                <!-- 等效 L₁ -->
                <g>
                    <circle cx="775" cy="200" r="15" fill="#fff" stroke="#000" stroke-width="1.5"/>
                    <line x1="768" y1="193" x2="782" y2="207" stroke="#000" stroke-width="1.5"/>
                    <line x1="782" y1="193" x2="768" y2="207" stroke="#000" stroke-width="1.5"/>
                    <!-- L₁ 标签放在符号左上方远处，避开圆圈和path，避免右侧裁切 -->
                    <text x="700" y="130" font-size="12" fill="#000" text-anchor="middle">L₁</text>
                </g>
            </g>

            <!-- ==================== 步骤4：结论高亮 ==================== -->
            <g id="scene1-step4-highlight" style="display:none">
                <!-- 实物图高亮路径：电流表→节点a→L₁→负极 -->
                <path d="M330,150 Q350,220 250,298 M250,298 L130,298 M90,298 L60,298 L60,120 L70,110"
                      fill="none" stroke="#1565c0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
                <!-- 半透明填充背景 -->
                <path d="M330,150 Q350,220 250,298 L130,298 L90,298 L60,298 L60,120 L70,110"
                      fill="rgba(21,101,192,0.15)" stroke="none"/>

                <!-- 等效电路高亮 -->
                <g id="scene1-step4-equiv-highlight" style="display:none">
                    <!-- 电流表支路高亮 -->
                    <path d="M580,150 L580,240 L600,240 M645,255 L720,255 L720,200"
                          fill="none" stroke="#1565c0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                    <!-- L₁支路高亮 -->
                    <path d="M720,200 L750,200 M790,200 L790,230 L560,230"
                          fill="none" stroke="#1565c0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                    <!-- 半透明填充 -->
                    <path d="M580,150 L580,240 L600,240 L645,255 L720,255 L720,200 L750,200 L790,200 L790,230 L560,230 L550,230 L550,170 L580,170 Z"
                          fill="rgba(21,101,192,0.15)" stroke="none" opacity="0.6"/>
                </g>

                <!-- 结论标签：放在等效电路框下方，避开所有图形 -->
                <text x="650" y="345" font-size="14" fill="#1565c0" font-weight="bold" text-anchor="middle">电流表与 L₁ 串联</text>
                <!-- 最终结论文字：放在SVG中下部，避开底部控件区 -->
                <text x="400" y="425" font-size="15" fill="#c62828" font-weight="bold" text-anchor="middle">电流表测量的是通过灯 L₁ 的电流（选项 A）</text>
            </g>
        </svg>

        <!-- 步骤提示文字 -->
        <div id="scene1-step-text">步骤 0：识别电路实物图中的各个元件</div>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        var currentStep = 0;
        var maxStep = 4;
        var animFrameId = null;
        var dashOffset = 0;

        var btnPrev = document.getElementById('scene1-btn-prev');
        var btnNext = document.getElementById('scene1-btn-next');
        var stepText = document.getElementById('scene1-step-text');

        var step1Nodes = document.getElementById('scene1-step1-nodes');
        var step2Paths = document.getElementById('scene1-step2-paths');
        var step3Equiv = document.getElementById('scene1-step3-equiv');
        var step4Highlight = document.getElementById('scene1-step4-highlight');
        var step4EquivHighlight = document.getElementById('scene1-step4-equiv-highlight');

        // 收集所有电流路径元素用于动画
        var flowPaths = [];
        var pb1 = document.getElementById('scene1-path-blue1');
        var pb2 = document.getElementById('scene1-path-blue2');
        var pg1 = document.getElementById('scene1-path-green1');
        var pg2 = document.getElementById('scene1-path-green2');
        var pg3 = document.getElementById('scene1-path-green3');
        var pr1 = document.getElementById('scene1-path-red1');
        var pr2 = document.getElementById('scene1-path-red2');
        if (pb1) flowPaths.push(pb1);
        if (pb2) flowPaths.push(pb2);
        if (pg1) flowPaths.push(pg1);
        if (pg2) flowPaths.push(pg2);
        if (pg3) flowPaths.push(pg3);
        if (pr1) flowPaths.push(pr1);
        if (pr2) flowPaths.push(pr2);

        var stepTexts = [
            "步骤 0：识别电路实物图中的各个元件",
            "步骤 1：标注电路中的关键节点，建立节点意识",
            "步骤 2：观察电流从正极出发后的分流路径",
            "步骤 3：将实物连接转化为标准等效电路符号",
            "步骤 4：电流表与 L₁ 串联，测量的是通过 L₁ 的电流"
        ];

        function show(el) {
            if (el) { el.style.display = 'block'; el.style.opacity = '1'; }
        }
        function hide(el) {
            if (el) { el.style.display = 'none'; }
        }

        function startFlowAnimation() {
            if (animFrameId) cancelAnimationFrame(animFrameId);
            function animate() {
                dashOffset -= 1;
                flowPaths.forEach(function(p) {
                    if (p) p.style.strokeDashoffset = dashOffset;
                });
                animFrameId = requestAnimationFrame(animate);
            }
            animate();
        }

        function stopFlowAnimation() {
            if (animFrameId) {
                cancelAnimationFrame(animFrameId);
                animFrameId = null;
            }
        }

        function renderStep() {
            // 更新按钮状态
            btnPrev.disabled = currentStep <= 0;
            btnNext.disabled = currentStep >= maxStep;

            // 更新步骤文字
            stepText.textContent = stepTexts[currentStep];

            // 控制各步骤元素显隐
            if (currentStep >= 1) show(step1Nodes); else hide(step1Nodes);
            if (currentStep >= 2) show(step2Paths); else hide(step2Paths);
            if (currentStep >= 3) show(step3Equiv); else hide(step3Equiv);
            if (currentStep >= 4) show(step4Highlight); else hide(step4Highlight);

            // 步骤4中等效电路高亮需要等效电路先显示
            if (currentStep >= 4) show(step4EquivHighlight); else hide(step4EquivHighlight);

            // 电流流动动画
            if (currentStep === 2) {
                startFlowAnimation();
            } else {
                stopFlowAnimation();
            }
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < maxStep) {
                currentStep++;
                renderStep();
            }
        });

        // 初始渲染
        renderStep();
    })();
    </script>
</body>
</html>
