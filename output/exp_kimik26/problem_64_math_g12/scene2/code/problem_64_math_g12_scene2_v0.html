<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 四棱柱底面条件</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene2-btn {
            width: 120px; height: 32px; border: none; border-radius: 4px;
            font-size: 14px; font-family: inherit; cursor: pointer;
            background: #e0e0e0; color: #333333; transition: background 0.2s, color 0.2s;
        }
        .scene2-btn:hover { background: #d0d0d0; }
        .scene2-btn.scene2-btn-active { background: #1565c0; color: #ffffff; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 顶部说明文字 -->
            <text x="400" y="45" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000">底面ABCD满足以下条件时，均有AC⊥B₁D₁</text>
            <text x="400" y="78" text-anchor="middle" font-size="14" fill="#666666">（三种条件由弱到强均可，满足其一即可）</text>

            <!-- ========== 状态1：AC⊥BD（一般对角线垂直四边形） ========== -->
            <g id="scene2-state1">
                <!-- 填充 -->
                <polygon points="400,130 300,250 400,370 500,250" fill="#888888" fill-opacity="0.12" stroke="none"/>
                <!-- 四边形边线 -->
                <polygon points="400,130 300,250 400,370 500,250" fill="none" stroke="#000000" stroke-width="2"/>
                <!-- 对角线AC -->
                <line x1="400" y1="130" x2="400" y2="370" stroke="#1565c0" stroke-width="2"/>
                <!-- 对角线BD -->
                <line x1="300" y1="250" x2="500" y2="250" stroke="#1565c0" stroke-width="2"/>
                <!-- 交点O -->
                <circle cx="400" cy="250" r="3" fill="#1565c0"/>
                <!-- 直角标记（O点右上） -->
                <path d="M400,250 L412,250 L412,238" fill="none" stroke="#c62828" stroke-width="2" stroke-linejoin="round"/>
                <!-- O标签 -->
                <text x="210" y="225" text-anchor="middle" font-size="16" fill="#000000">O</text>
                <!-- 状态说明文字 -->
                <text x="400" y="430" text-anchor="middle" font-size="16">
                    <tspan fill="#2e7d32">条件：</tspan><tspan fill="#c62828">AC⊥BD</tspan>
                </text>
            </g>

            <!-- ========== 状态2：菱形 ========== -->
            <g id="scene2-state2" display="none">
                <!-- 填充 -->
                <polygon points="400,110 280,250 400,390 520,250" fill="#2e7d32" fill-opacity="0.10" stroke="none"/>
                <!-- 四边形边线 -->
                <polygon points="400,110 280,250 400,390 520,250" fill="none" stroke="#000000" stroke-width="2"/>
                <!-- 对角线AC -->
                <line x1="400" y1="110" x2="400" y2="390" stroke="#1565c0" stroke-width="2"/>
                <!-- 对角线BD -->
                <line x1="280" y1="250" x2="520" y2="250" stroke="#1565c0" stroke-width="2"/>
                <!-- 交点O -->
                <circle cx="400" cy="250" r="3" fill="#1565c0"/>
                <!-- 直角标记（O点右上） -->
                <path d="M400,250 L412,250 L412,238" fill="none" stroke="#c62828" stroke-width="2" stroke-linejoin="round"/>
                <!-- 等长标记 AB -->
                <line x1="335" y1="176" x2="345" y2="184" stroke="#c62828" stroke-width="2"/>
                <!-- 等长标记 BC -->
                <line x1="335" y1="324" x2="345" y2="316" stroke="#c62828" stroke-width="2"/>
                <!-- 等长标记 CD -->
                <line x1="455" y1="316" x2="465" y2="324" stroke="#c62828" stroke-width="2"/>
                <!-- 等长标记 DA -->
                <line x1="455" y1="184" x2="465" y2="176" stroke="#c62828" stroke-width="2"/>
                <!-- O标签 -->
                <text x="210" y="220" text-anchor="middle" font-size="16" fill="#000000">O</text>
                <!-- 状态说明文字 -->
                <text x="400" y="430" text-anchor="middle" font-size="16">
                    <tspan fill="#2e7d32">条件：</tspan><tspan fill="#c62828">ABCD是菱形</tspan>
                </text>
            </g>

            <!-- ========== 状态3：正方形 ========== -->
            <g id="scene2-state3" display="none">
                <!-- 填充 -->
                <polygon points="400,110 260,250 400,390 540,250" fill="#1565c0" fill-opacity="0.10" stroke="none"/>
                <!-- 四边形边线 -->
                <polygon points="400,110 260,250 400,390 540,250" fill="none" stroke="#000000" stroke-width="2"/>
                <!-- 对角线AC -->
                <line x1="400" y1="110" x2="400" y2="390" stroke="#1565c0" stroke-width="2"/>
                <!-- 对角线BD -->
                <line x1="260" y1="250" x2="540" y2="250" stroke="#1565c0" stroke-width="2"/>
                <!-- 交点O -->
                <circle cx="400" cy="250" r="3" fill="#1565c0"/>
                <!-- 直角标记（O点右上） -->
                <path d="M400,250 L412,250 L412,238" fill="none" stroke="#c62828" stroke-width="2" stroke-linejoin="round"/>
                <!-- 等长标记 AB -->
                <line x1="326" y1="176" x2="334" y2="184" stroke="#c62828" stroke-width="2"/>
                <!-- 等长标记 BC -->
                <line x1="326" y1="324" x2="334" y2="316" stroke="#c62828" stroke-width="2"/>
                <!-- 等长标记 CD -->
                <line x1="466" y1="316" x2="474" y2="324" stroke="#c62828" stroke-width="2"/>
                <!-- 等长标记 DA -->
                <line x1="466" y1="184" x2="474" y2="176" stroke="#c62828" stroke-width="2"/>
                <!-- AC=BD 标注 -->
                <text x="580" y="220" font-size="14" fill="#c62828">AC=BD</text>
                <!-- O标签 -->
                <text x="210" y="220" text-anchor="middle" font-size="16" fill="#000000">O</text>
                <!-- 状态说明文字 -->
                <text x="400" y="430" text-anchor="middle" font-size="16">
                    <tspan fill="#2e7d32">条件：</tspan><tspan fill="#c62828">ABCD是正方形</tspan>
                </text>
            </g>

            <!-- ========== 共享标签（A/B/C/D，始终显示） ========== -->
            <g id="scene2-shared-labels">
                <text x="370" y="108" text-anchor="middle" font-size="16" fill="#000000">A</text>
                <text x="245" y="245" text-anchor="middle" font-size="16" fill="#000000">B</text>
                <text x="395" y="400" text-anchor="middle" font-size="16" fill="#000000">C</text>
                <text x="555" y="245" text-anchor="middle" font-size="16" fill="#000000">D</text>
            </g>
        </svg>

        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-btn1" class="scene2-btn scene2-btn-active">AC⊥BD</button>
            <button id="scene2-btn2" class="scene2-btn">菱形</button>
            <button id="scene2-btn3" class="scene2-btn">正方形</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2 实现 - 多状态切换
        var currentState = 1;

        var state1 = document.getElementById('scene2-state1');
        var state2 = document.getElementById('scene2-state2');
        var state3 = document.getElementById('scene2-state3');
        var btn1 = document.getElementById('scene2-btn1');
        var btn2 = document.getElementById('scene2-btn2');
        var btn3 = document.getElementById('scene2-btn3');

        function show(el) {
            el.style.display = 'block';
            el.style.opacity = '1';
        }
        function hide(el) {
            el.style.display = 'none';
            el.style.opacity = '0';
        }

        function switchState(n) {
            currentState = n;
            hide(state1);
            hide(state2);
            hide(state3);
            btn1.classList.remove('scene2-btn-active');
            btn2.classList.remove('scene2-btn-active');
            btn3.classList.remove('scene2-btn-active');

            if (n === 1) {
                show(state1);
                btn1.classList.add('scene2-btn-active');
            } else if (n === 2) {
                show(state2);
                btn2.classList.add('scene2-btn-active');
            } else if (n === 3) {
                show(state3);
                btn3.classList.add('scene2-btn-active');
            }
        }

        btn1.addEventListener('click', function() { switchState(1); });
        btn2.addEventListener('click', function() { switchState(2); });
        btn3.addEventListener('click', function() { switchState(3); });
    })();
    </script>
</body>
</html>
