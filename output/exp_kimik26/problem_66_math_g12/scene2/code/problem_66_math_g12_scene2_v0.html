<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 垂直于 DE 的截面分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene2-controls button {
            padding: 6px 16px; font-size: 14px; cursor: pointer;
            border: 1px solid #ccc; border-radius: 4px; background: #f8f8f8;
        }
        #scene2-controls button:hover { background: #e8e8e8; }
        #scene2-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene2-step-indicator { font-size: 14px; color: #666; min-width: 60px; text-align: center; }
        .scene2-hidden { display: none; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 定义 -->
            <defs>
                <!-- 双向箭头标记 -->
                <marker id="scene2-arrow-start" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M10,0 L0,3 L10,6 L8,3 z" fill="#000"/>
                </marker>
                <marker id="scene2-arrow-end" markerWidth="10" markerHeight="10" refX="10" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L10,3 L0,6 L2,3 z" fill="#000"/>
                </marker>
            </defs>

            <!-- 平面 BCED 填充 -->
            <rect id="scene2-plane-bced" x="180" y="340" width="240" height="40" fill="#f5f5f5" opacity="0.3"/>
            <!-- BCED 上边界线 -->
            <line id="scene2-line-bced-top" x1="180" y1="340" x2="420" y2="340" stroke="#000" stroke-width="1"/>

            <!-- 圆下半（虚线，灰色） -->
            <path id="scene2-circle-lower" d="M 380 240 A 100 100 0 0 1 180 240" stroke="#888888" stroke-width="1" fill="none" stroke-dasharray="5,5"/>
            <!-- 圆上半（实线，黑色） -->
            <path id="scene2-circle-upper" d="M 180 240 A 100 100 0 0 0 380 240" stroke="#000" stroke-width="1" fill="none"/>

            <!-- AF 线段 -->
            <line id="scene2-line-af" x1="280" y1="140" x2="280" y2="340" stroke="#000" stroke-width="2"/>

            <!-- G 点 -->
            <circle id="scene2-point-g" cx="280" cy="240" r="4" fill="#000"/>

            <!-- A'G 线段（动态） -->
            <line id="scene2-line-ag" x1="351" y1="311" x2="280" y2="240" stroke="#1565c0" stroke-width="1"/>

            <!-- A' 点（动态） -->
            <circle id="scene2-point-aprime" cx="351" cy="311" r="5" fill="#1565c0"/>

            <!-- DE 方向示意（步骤1显示） -->
            <g id="scene2-de-group" class="scene2-hidden">
                <!-- DE 引线 -->
                <line id="scene2-de-leader" x1="280" y1="240" x2="330" y2="200" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
                <!-- DE 小圆 -->
                <circle id="scene2-de-circle" cx="330" cy="200" r="10" stroke="#000" stroke-width="1" fill="none"/>
                <!-- DE 叉号 -->
                <line id="scene2-de-cross1" x1="323" y1="193" x2="337" y2="207" stroke="#000" stroke-width="1"/>
                <line id="scene2-de-cross2" x1="337" y1="193" x2="323" y2="207" stroke="#000" stroke-width="1"/>
            </g>

            <!-- A'P 垂线和 P 点（步骤2显示） -->
            <g id="scene2-ap-group" class="scene2-hidden">
                <line id="scene2-line-ap" x1="351" y1="311" x2="280" y2="311" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5"/>
                <circle id="scene2-point-p" cx="280" cy="311" r="3" fill="#c62828"/>
            </g>

            <!-- h 双向箭头（步骤3显示） -->
            <g id="scene2-h-group" class="scene2-hidden">
                <line id="scene2-h-arrow" x1="280" y1="240" x2="380" y2="240" stroke="#000" stroke-width="1.5" marker-start="url(#scene2-arrow-start)" marker-end="url(#scene2-arrow-end)"/>
            </g>

            <!-- 标签：全部放在图形外侧，避免重叠 -->
            <!-- A 在 AF 顶端左侧 -->
            <text id="scene2-label-a" x="250" y="145" font-size="16" fill="#000" text-anchor="end">A</text>
            <!-- F 在 AF 底端左侧，高于 BCED 上边界线(y=340)，远离圆左端(x=180) -->
            <text id="scene2-label-f" x="160" y="330" font-size="16" fill="#000" text-anchor="end">F</text>
            <!-- G 在 G 点右侧，远离 DE 引线 -->
            <text id="scene2-label-g" x="340" y="235" font-size="16" fill="#000">G</text>
            <!-- A' 标签动态跟随，放在圆 bounding box 右侧(x>380) -->
            <text id="scene2-label-aprime" x="400" y="320" font-size="16" fill="#1565c0">A′</text>
            <!-- P 在圆 bounding box 左侧(x<180)，远离 GF -->
            <text id="scene2-label-p" x="140" y="320" font-size="14" fill="#c62828" text-anchor="end" class="scene2-hidden">P</text>
            <!-- AG 在 AF 左侧中段，圆 bounding box 左侧 -->
            <text id="scene2-label-ag" x="160" y="190" font-size="14" fill="#000" text-anchor="end">AG</text>
            <!-- GF 在 AF 左侧中下段，圆 bounding box 左侧 -->
            <text id="scene2-label-gf" x="160" y="290" font-size="14" fill="#000" text-anchor="end">GF</text>
            <!-- DE 在示意右侧 -->
            <text id="scene2-label-de" x="350" y="195" font-size="14" fill="#000">DE</text>
            <!-- h 在箭头上方偏左，与 G 标签不重叠 -->
            <text id="scene2-label-h" x="300" y="220" font-size="14" fill="#000" text-anchor="middle" class="scene2-hidden">h</text>
            <!-- 平面BCED 在填充区域下方(y>380) -->
            <text id="scene2-label-bced" x="300" y="400" font-size="14" fill="#666" text-anchor="middle">平面BCED</text>

            <!-- 右侧说明文字组 -->
            <!-- 步骤0：无推导文字 -->
            <g id="scene2-text-group-0" class="scene2-hidden">
            </g>

            <!-- 步骤1：命题(3) -->
            <g id="scene2-text-group-1" class="scene2-hidden">
                <text x="520" y="100" font-size="16" font-weight="bold" fill="#000">命题(3)：平面 A′GF ⊥ 平面 BCED</text>
                <text x="520" y="150" font-size="14" fill="#333">∵ AF ⊥ BC，DE ∥ BC，∴ DE ⊥ AF</text>
                <text x="520" y="200" font-size="14" fill="#333">∵ A′ 绕 DE 旋转，∴ DE ⊥ A′G</text>
                <text x="520" y="250" font-size="14" fill="#333">∴ DE ⊥ 平面 A′GF</text>
                <text x="520" y="300" font-size="14" fill="#333">∴ 平面 A′GF ⊥ 平面 BCED</text>
            </g>

            <!-- 步骤2：命题(1) -->
            <g id="scene2-text-group-2" class="scene2-hidden">
                <text x="520" y="100" font-size="16" font-weight="bold" fill="#000">命题(1)：射影在线段 AF 上</text>
                <text x="520" y="150" font-size="14" fill="#333">∵ 平面 A′GF ⊥ 平面 BCED，交线为 GF</text>
                <text x="520" y="200" font-size="14" fill="#333">A′P ⊥ GF 于 P（A′P ⊂ 平面 A′GF）</text>
                <text x="520" y="250" font-size="14" fill="#333">∴ A′ 在平面 ABC 上的射影为 P</text>
                <text x="520" y="300" font-size="14" fill="#333">P ∈ GF ⊂ AF，∴ 射影在线段 AF 上</text>
            </g>

            <!-- 步骤3：命题(2) -->
            <g id="scene2-text-group-3" class="scene2-hidden">
                <text x="520" y="100" font-size="16" font-weight="bold" fill="#000">命题(2)：体积有最大值</text>
                <text x="520" y="150" font-size="14" fill="#333">V_{A′-FED} = (1/3) · S△FED · h</text>
                <text x="520" y="200" font-size="14" fill="#333">h = A′ 到直线 GF 的距离</text>
                <text x="520" y="250" font-size="14" fill="#333">h_max = AG（当 A′G ⊥ AF 时）</text>
                <text x="520" y="300" font-size="14" fill="#333">∴ V_max = (1/3) · S△FED · AG</text>
            </g>
        </svg>

        <div id="scene2-controls">
            <button id="scene2-btn-prev">◀ 上一步</button>
            <span id="scene2-step-indicator">步骤 1/4</span>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2 实现
        let currentStep = 0;
        const totalSteps = 4;

        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        const stepIndicator = document.getElementById('scene2-step-indicator');

        // 元素引用
        const deGroup = document.getElementById('scene2-de-group');
        const apGroup = document.getElementById('scene2-ap-group');
        const hGroup = document.getElementById('scene2-h-group');
        const lineAG = document.getElementById('scene2-line-ag');
        const pointAprime = document.getElementById('scene2-point-aprime');
        const labelAprime = document.getElementById('scene2-label-aprime');
        const labelP = document.getElementById('scene2-label-p');
        const labelH = document.getElementById('scene2-label-h');

        // 文字组
        const textGroups = [
            document.getElementById('scene2-text-group-0'),
            document.getElementById('scene2-text-group-1'),
            document.getElementById('scene2-text-group-2'),
            document.getElementById('scene2-text-group-3')
        ];

        function show(el) {
            if (!el) return;
            el.style.display = 'block';
            el.style.opacity = '1';
        }
        function hide(el) {
            if (!el) return;
            el.style.display = 'none';
            el.style.opacity = '0';
        }

        function renderStep(step) {
            // 更新指示器
            stepIndicator.textContent = '步骤 ' + (step + 1) + '/' + totalSteps;

            // 隐藏所有文字组
            textGroups.forEach(g => hide(g));

            // 根据步骤显示元素
            if (step === 0) {
                // 基础截面图
                hide(deGroup);
                hide(apGroup);
                hide(hGroup);
                hide(labelP);
                hide(labelH);

                // A' 在初始位置
                pointAprime.setAttribute('cx', '351');
                pointAprime.setAttribute('cy', '311');
                pointAprime.setAttribute('fill', '#1565c0');
                labelAprime.setAttribute('x', '400');
                labelAprime.setAttribute('y', '320');
                labelAprime.setAttribute('fill', '#1565c0');

                lineAG.setAttribute('x1', '351');
                lineAG.setAttribute('y1', '311');
                lineAG.setAttribute('x2', '280');
                lineAG.setAttribute('y2', '240');
                lineAG.setAttribute('stroke', '#1565c0');
                lineAG.setAttribute('stroke-width', '1');

                show(textGroups[0]);
            } else if (step === 1) {
                // 命题(3)：面面垂直
                show(deGroup);
                hide(apGroup);
                hide(hGroup);
                hide(labelP);
                hide(labelH);

                // A' 在初始位置，A'G 加粗
                pointAprime.setAttribute('cx', '351');
                pointAprime.setAttribute('cy', '311');
                pointAprime.setAttribute('fill', '#1565c0');
                labelAprime.setAttribute('x', '400');
                labelAprime.setAttribute('y', '320');
                labelAprime.setAttribute('fill', '#1565c0');

                lineAG.setAttribute('x1', '351');
                lineAG.setAttribute('y1', '311');
                lineAG.setAttribute('x2', '280');
                lineAG.setAttribute('y2', '240');
                lineAG.setAttribute('stroke', '#1565c0');
                lineAG.setAttribute('stroke-width', '2');

                show(textGroups[1]);
            } else if (step === 2) {
                // 命题(1)：射影位置
                hide(deGroup);
                show(apGroup);
                hide(hGroup);
                show(labelP);
                hide(labelH);

                // A' 在初始位置
                pointAprime.setAttribute('cx', '351');
                pointAprime.setAttribute('cy', '311');
                pointAprime.setAttribute('fill', '#1565c0');
                labelAprime.setAttribute('x', '400');
                labelAprime.setAttribute('y', '320');
                labelAprime.setAttribute('fill', '#1565c0');

                lineAG.setAttribute('x1', '351');
                lineAG.setAttribute('y1', '311');
                lineAG.setAttribute('x2', '280');
                lineAG.setAttribute('y2', '240');
                lineAG.setAttribute('stroke', '#1565c0');
                lineAG.setAttribute('stroke-width', '1');

                show(textGroups[2]);
            } else if (step === 3) {
                // 命题(2)：体积最值
                hide(deGroup);
                hide(apGroup);
                show(hGroup);
                hide(labelP);
                show(labelH);

                // A' 移动到最大位置，颜色变绿
                pointAprime.setAttribute('cx', '380');
                pointAprime.setAttribute('cy', '240');
                pointAprime.setAttribute('fill', '#2e7d32');
                labelAprime.setAttribute('x', '400');
                labelAprime.setAttribute('y', '238');
                labelAprime.setAttribute('fill', '#2e7d32');

                lineAG.setAttribute('x1', '380');
                lineAG.setAttribute('y1', '240');
                lineAG.setAttribute('x2', '280');
                lineAG.setAttribute('y2', '240');
                lineAG.setAttribute('stroke', '#2e7d32');
                lineAG.setAttribute('stroke-width', '2');

                show(textGroups[3]);
            }
        }

        btnPrev.addEventListener('click', function() {
            currentStep = (currentStep - 1 + totalSteps) % totalSteps;
            renderStep(currentStep);
        });

        btnNext.addEventListener('click', function() {
            currentStep = (currentStep + 1) % totalSteps;
            renderStep(currentStep);
        });

        // 初始渲染
        renderStep(currentStep);
    })();
    </script>
</body>
</html>
