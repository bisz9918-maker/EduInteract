<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>倾斜导轨上的导体棒</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 16px; z-index: 10; }
        #scene1-controls button {
            padding: 6px 16px; font-size: 14px; cursor: pointer;
            border: 1px solid #888; border-radius: 4px; background: #f0f0f0;
            transition: opacity 0.2s;
        }
        #scene1-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene1-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene1-step-text { font-size: 14px; color: #333; min-width: 80px; text-align: center; }
        .scene1-info-line { margin: 6px 0; font-size: 14px; line-height: 1.5; }
        .scene1-info-title { font-size: 16px; font-weight: bold; margin-bottom: 10px; color: #333; }
        .scene1-formula { font-family: "Times New Roman", serif; font-style: italic; margin: 4px 0; }
        .scene1-highlight { color: #1565c0; font-weight: bold; }
        .scene1-result { color: #2e7d32; font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene1-arrow-black" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#000"/>
                </marker>
                <marker id="scene1-arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#1565c0"/>
                </marker>
                <marker id="scene1-arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#2e7d32"/>
                </marker>
                <marker id="scene1-arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#c62828"/>
                </marker>
                <marker id="scene1-arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#888"/>
                </marker>
            </defs>

            <!-- U形框架 -->
            <line id="scene1-frame-left" x1="210" y1="290" x2="150" y2="320" stroke="#000" stroke-width="2"/>
            <line id="scene1-frame-right" x1="460" y1="146" x2="400" y2="176" stroke="#000" stroke-width="2"/>
            <line id="scene1-frame-bottom" x1="150" y1="320" x2="400" y2="176" stroke="#000" stroke-width="2"/>

            <!-- 导体棒MN -->
            <line id="scene1-rod-mn" x1="189" y1="301" x2="439" y2="157" stroke="#000" stroke-width="6" stroke-linecap="round"/>

            <!-- 水平参考虚线 -->
            <line id="scene1-horiz-line" x1="260" y1="176" x2="520" y2="176" stroke="#888" stroke-width="1" stroke-dasharray="5,5"/>

            <!-- B方向箭头（垂直斜面向外） -->
            <line id="scene1-b-arrow" x1="250" y1="280" x2="215" y2="219" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-blue)"/>

            <!-- θ角弧线 -->
            <path id="scene1-theta-arc" d="M 425 176 A 25 25 0 0 0 400 151" fill="none" stroke="#1565c0" stroke-width="2"/>

            <!-- 力矢量箭头（初始隐藏） -->
            <!-- 重力mg -->
            <line id="scene1-force-mg" x1="314" y1="229" x2="314" y2="329" stroke="#000" stroke-width="2" marker-end="url(#scene1-arrow-black)" opacity="0"/>
            <!-- 支持力N -->
            <line id="scene1-force-n" x1="314" y1="229" x2="274" y2="160" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene1-arrow-green)" opacity="0"/>
            <!-- 安培力F_安 -->
            <line id="scene1-force-fa" x1="314" y1="229" x2="375" y2="194" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrow-red)" opacity="0"/>

            <!-- 重力分解分量（初始隐藏） -->
            <line id="scene1-decomp-mgsin" x1="314" y1="229" x2="271" y2="254" stroke="#888" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#scene1-arrow-gray)" opacity="0"/>
            <line id="scene1-decomp-mgcos" x1="314" y1="229" x2="357" y2="304" stroke="#888" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#scene1-arrow-gray)" opacity="0"/>

            <!-- 标签：放置在远离所有线段的空白区域 -->
            <!-- M: 左下角空白区 -->
            <text id="scene1-label-m" x="80" y="380" font-size="16" fill="#000" font-family="serif">M</text>
            <!-- N: 右上角空白区 -->
            <text id="scene1-label-n-end" x="500" y="110" font-size="16" fill="#000" font-family="serif">N</text>
            <!-- B: 左侧中部空白区，远离B箭头 -->
            <text id="scene1-label-b" x="80" y="200" font-size="16" fill="#1565c0" font-family="serif">B</text>
            <!-- θ: 右侧中部空白区 -->
            <text id="scene1-label-theta" x="500" y="220" font-size="16" fill="#1565c0" font-family="serif">θ</text>
            <!-- L: 右下角空白区 -->
            <text id="scene1-label-l" x="450" y="380" font-size="16" fill="#000" font-family="serif">L</text>
            <!-- mg: 重力箭头下方空白区 -->
            <text id="scene1-label-mg" x="280" y="420" font-size="16" fill="#000" font-family="serif" opacity="0">mg</text>
            <!-- N(力): 左上角空白区 -->
            <text id="scene1-label-force-n" x="220" y="100" font-size="16" fill="#2e7d32" font-family="serif" opacity="0">N</text>
            <!-- F_安: 中上部空白区，在信息框左侧 -->
            <text id="scene1-label-fa" x="420" y="100" font-size="16" fill="#c62828" font-family="serif" opacity="0">F<tspan dy="4" font-size="12">安</tspan></text>
            <!-- mg sinθ: 左侧下部空白区 -->
            <text id="scene1-label-mgsin" x="80" y="320" font-size="14" fill="#888" font-family="serif" opacity="0">mg sinθ</text>
            <!-- mg cosθ: 右下角空白区 -->
            <text id="scene1-label-mgcos" x="450" y="400" font-size="14" fill="#888" font-family="serif" opacity="0">mg cosθ</text>

            <!-- 右侧信息框背景 -->
            <rect id="scene1-info-bg" x="520" y="60" width="240" height="380" fill="#f8f9fa" stroke="#888" stroke-width="1" rx="4"/>

            <!-- 右侧信息框内容（使用foreignObject嵌入HTML） -->
            <foreignObject id="scene1-info-fo" x="520" y="60" width="240" height="380">
                <div xmlns="http://www.w3.org/1999/xhtml" id="scene1-info-content" style="padding: 12px; box-sizing: border-box; height: 100%; overflow: auto;">
                    <div class="scene1-info-title">倾斜导轨上的导体棒</div>
                    <div class="scene1-info-line">U形导体框架，导体棒MN可无摩擦滑动。</div>
                </div>
            </foreignObject>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <span id="scene1-step-text">步骤 1/6</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        var currentStep = 0;
        var totalSteps = 6;

        var btnPrev = document.getElementById('scene1-btn-prev');
        var btnNext = document.getElementById('scene1-btn-next');
        var stepText = document.getElementById('scene1-step-text');
        var infoContent = document.getElementById('scene1-info-content');

        // 元素引用
        var els = {
            forceMg: document.getElementById('scene1-force-mg'),
            forceN: document.getElementById('scene1-force-n'),
            forceFa: document.getElementById('scene1-force-fa'),
            decompMgsin: document.getElementById('scene1-decomp-mgsin'),
            decompMgcos: document.getElementById('scene1-decomp-mgcos'),
            labelMg: document.getElementById('scene1-label-mg'),
            labelForceN: document.getElementById('scene1-label-force-n'),
            labelFa: document.getElementById('scene1-label-fa'),
            labelMgsin: document.getElementById('scene1-label-mgsin'),
            labelMgcos: document.getElementById('scene1-label-mgcos'),
            labelL: document.getElementById('scene1-label-l'),
            thetaArc: document.getElementById('scene1-theta-arc'),
            bArrow: document.getElementById('scene1-b-arrow'),
            labelB: document.getElementById('scene1-label-b'),
            labelTheta: document.getElementById('scene1-label-theta'),
            labelM: document.getElementById('scene1-label-m'),
            labelN: document.getElementById('scene1-label-n-end'),
            rodMn: document.getElementById('scene1-rod-mn'),
            frameLeft: document.getElementById('scene1-frame-left'),
            frameRight: document.getElementById('scene1-frame-right'),
            frameBottom: document.getElementById('scene1-frame-bottom'),
            horizLine: document.getElementById('scene1-horiz-line')
        };

        function setOpacity(el, val) {
            if (el) el.setAttribute('opacity', val);
        }

        function setStrokeWidth(el, val) {
            if (el) el.setAttribute('stroke-width', val);
        }

        function setFill(el, val) {
            if (el) el.setAttribute('fill', val);
        }

        function renderStep() {
            stepText.textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps - 1;

            // 重置所有动态元素
            setOpacity(els.forceMg, 0);
            setOpacity(els.forceN, 0);
            setOpacity(els.forceFa, 0);
            setOpacity(els.decompMgsin, 0);
            setOpacity(els.decompMgcos, 0);
            setOpacity(els.labelMg, 0);
            setOpacity(els.labelForceN, 0);
            setOpacity(els.labelFa, 0);
            setOpacity(els.labelMgsin, 0);
            setOpacity(els.labelMgcos, 0);
            setStrokeWidth(els.thetaArc, 2);
            setStrokeWidth(els.rodMn, 6);
            setStrokeWidth(els.bArrow, 2);
            setFill(els.labelB, '#1565c0');
            setFill(els.labelTheta, '#1565c0');
            setFill(els.labelL, '#000');

            switch (currentStep) {
                case 0:
                    infoContent.innerHTML = '<div class="scene1-info-title">倾斜导轨上的导体棒</div><div class="scene1-info-line">U形导体框架，导体棒MN可无摩擦滑动。</div><div class="scene1-info-line">磁场B垂直于斜面，框架倾角为θ。</div>';
                    break;
                case 1:
                    infoContent.innerHTML = '<div class="scene1-info-title">已知条件</div>' +
                        '<div class="scene1-info-line"><span class="scene1-highlight">L = 1 m</span>（导轨宽度）</div>' +
                        '<div class="scene1-info-line"><span class="scene1-highlight">θ = 30°</span>（斜面倾角）</div>' +
                        '<div class="scene1-info-line"><span class="scene1-highlight">B = 0.2 T</span>（磁感应强度）</div>' +
                        '<div class="scene1-info-line"><span class="scene1-highlight">m = 0.2 kg</span>（导体棒质量）</div>' +
                        '<div class="scene1-info-line"><span class="scene1-highlight">R = 0.2 Ω</span>（导体棒电阻）</div>';
                    setStrokeWidth(els.thetaArc, 3);
                    setStrokeWidth(els.rodMn, 8);
                    setFill(els.labelL, '#1565c0');
                    setFill(els.labelTheta, '#1565c0');
                    break;
                case 2:
                    infoContent.innerHTML = '<div class="scene1-info-title">受力分析</div><div class="scene1-info-line">导体棒受三个力：</div>' +
                        '<div class="scene1-info-line">• 重力 mg（竖直向下）</div>' +
                        '<div class="scene1-info-line">• 支持力 N（垂直斜面向上）</div>' +
                        '<div class="scene1-info-line">• 安培力 F<sub>安</sub>（沿斜面向上）</div>';
                    setOpacity(els.forceMg, 1);
                    setOpacity(els.forceN, 1);
                    setOpacity(els.forceFa, 1);
                    setOpacity(els.labelMg, 1);
                    setOpacity(els.labelForceN, 1);
                    setOpacity(els.labelFa, 1);
                    break;
                case 3:
                    infoContent.innerHTML = '<div class="scene1-info-title">重力分解</div><div class="scene1-info-line">将重力沿斜面和垂直斜面分解：</div>' +
                        '<div class="scene1-info-line">• mg sinθ（沿斜面向下）</div>' +
                        '<div class="scene1-info-line">• mg cosθ（垂直斜面向下）</div>';
                    setOpacity(els.forceMg, 1);
                    setOpacity(els.forceN, 1);
                    setOpacity(els.forceFa, 1);
                    setOpacity(els.labelMg, 1);
                    setOpacity(els.labelForceN, 1);
                    setOpacity(els.labelFa, 1);
                    setOpacity(els.decompMgsin, 1);
                    setOpacity(els.decompMgcos, 1);
                    setOpacity(els.labelMgsin, 1);
                    setOpacity(els.labelMgcos, 1);
                    break;
                case 4:
                    infoContent.innerHTML = '<div class="scene1-info-title">平衡方程</div>' +
                        '<div class="scene1-formula">mg sinθ = F<sub>安</sub></div>' +
                        '<div class="scene1-formula">F<sub>安</sub> = BIL</div>' +
                        '<div class="scene1-formula">I = BLv<sub>m</sub> / R</div>' +
                        '<div class="scene1-formula">mg sinθ = B²L²v<sub>m</sub> / R</div>';
                    setOpacity(els.forceMg, 1);
                    setOpacity(els.forceN, 1);
                    setOpacity(els.forceFa, 1);
                    setOpacity(els.labelMg, 1);
                    setOpacity(els.labelForceN, 1);
                    setOpacity(els.labelFa, 1);
                    setOpacity(els.decompMgsin, 1);
                    setOpacity(els.decompMgcos, 1);
                    setOpacity(els.labelMgsin, 1);
                    setOpacity(els.labelMgcos, 1);
                    setStrokeWidth(els.forceFa, 3);
                    setStrokeWidth(els.decompMgsin, 2);
                    break;
                case 5:
                    infoContent.innerHTML = '<div class="scene1-info-title">代入求解</div>' +
                        '<div class="scene1-formula">v<sub>m</sub> = mgR sinθ / (B²L²)</div>' +
                        '<div class="scene1-formula">= 0.2×9.8×0.2×0.5 / (0.04×1)</div>' +
                        '<div class="scene1-formula">= 4.9 m/s</div>' +
                        '<div class="scene1-result" style="margin-top:12px;">v<sub>m</sub> ≈ 5 m/s</div>';
                    setOpacity(els.forceMg, 1);
                    setOpacity(els.forceN, 1);
                    setOpacity(els.forceFa, 1);
                    setOpacity(els.labelMg, 1);
                    setOpacity(els.labelForceN, 1);
                    setOpacity(els.labelFa, 1);
                    setOpacity(els.decompMgsin, 1);
                    setOpacity(els.decompMgcos, 1);
                    setOpacity(els.labelMgsin, 1);
                    setOpacity(els.labelMgcos, 1);
                    break;
            }
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                renderStep();
            }
        });

        // 初始渲染
        renderStep();
    })();
    </script>
</body>
</html>
