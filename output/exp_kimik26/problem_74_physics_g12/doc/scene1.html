<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电磁感应 - 线圈穿过磁场</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            padding: 6px 14px; font-size: 14px; cursor: pointer;
            border: 1px solid #333; border-radius: 4px; background: #f0f0f0;
            transition: background 0.2s;
        }
        #scene1-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene1-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene1-step-display {
            padding: 6px 14px; font-size: 14px; border: 1px solid #333;
            border-radius: 4px; background: #fff; min-width: 80px; text-align: center;
            user-select: none;
        }
        .scene1-transition {
            transition: transform 0.4s ease-in-out, opacity 0.2s ease-in-out;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene1-arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0"/>
                </marker>
                <marker id="scene1-arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32"/>
                </marker>
                <marker id="scene1-arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#c62828"/>
                </marker>
                <marker id="scene1-arrowhead-blue-start" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
                    <polygon points="10 0, 0 3.5, 10 7" fill="#1565c0"/>
                </marker>
                <marker id="scene1-arrowhead-green-start" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
                    <polygon points="10 0, 0 3.5, 10 7" fill="#2e7d32"/>
                </marker>
            </defs>

            <!-- 顶部固定横线（天花板） -->
            <line x1="200" y1="32" x2="680" y2="32" stroke="#000" stroke-width="2"/>

            <!-- 左滑轮 -->
            <circle cx="320" cy="50" r="18" fill="#e0e0e0" stroke="#000" stroke-width="2"/>
            <circle cx="320" cy="50" r="4" fill="#000"/>

            <!-- 右滑轮 -->
            <circle cx="560" cy="50" r="18" fill="#e0e0e0" stroke="#000" stroke-width="2"/>
            <circle cx="560" cy="50" r="4" fill="#000"/>

            <!-- 磁场区域（固定） -->
            <g id="scene1-magnet-group">
                <rect x="277" y="120" width="85" height="65" fill="#e3f2fd" fill-opacity="0.2" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3"/>
                <!-- 9个×符号，使用path绘制小交叉 -->
                <g stroke="#1565c0" stroke-width="1.5">
                    <path d="M286 128 L294 136 M294 128 L286 136"/>
                    <path d="M316 128 L324 136 M324 128 L316 136"/>
                    <path d="M346 128 L354 136 M354 128 L346 136"/>
                    <path d="M286 146 L294 154 M294 146 L286 154"/>
                    <path d="M316 146 L324 154 M324 146 L316 154"/>
                    <path d="M346 146 L354 154 M354 146 L346 154"/>
                    <path d="M286 164 L294 172 M294 164 L286 172"/>
                    <path d="M316 164 L324 172 M324 164 L316 172"/>
                    <path d="M346 164 L354 172 M354 164 L346 172"/>
                </g>
            </g>

            <!-- B=0.5T 标签（磁场右上方，远离所有动态元素） -->
            <text id="scene1-label-B" x="400" y="65" font-size="14" fill="#2e7d32" text-anchor="start">B=0.5T</text>

            <!-- ⊗方向标记（磁场右侧远处） -->
            <text id="scene1-label-otimes" x="420" y="152" font-size="14" fill="#000" text-anchor="start">⊗</text>

            <!-- h=0.20m 尺寸线（磁场左侧，文字放上方远处避免与m1重叠） -->
            <g id="scene1-dim-h">
                <line x1="255" y1="120" x2="255" y2="185" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#scene1-arrowhead-green)" marker-start="url(#scene1-arrowhead-green-start)"/>
                <text x="245" y="55" font-size="13" fill="#2e7d32" text-anchor="end">h=0.20m</text>
            </g>

            <!-- 绳子（三段） -->
            <g id="scene1-rope-group">
                <line id="scene1-rope-left" x1="320" y1="68" x2="320" y2="250" stroke="#000" stroke-width="2"/>
                <line id="scene1-rope-horiz" x1="320" y1="32" x2="560" y2="32" stroke="#000" stroke-width="2"/>
                <line id="scene1-rope-right" x1="560" y1="68" x2="560" y2="185" stroke="#000" stroke-width="2"/>
            </g>

            <!-- 线圈组（可移动） -->
            <g id="scene1-coil-group" class="scene1-transition" transform="translate(0,0)">
                <!-- 线圈矩形 -->
                <rect x="287" y="250" width="65" height="65" fill="#f5f5f5" fill-opacity="0.15" stroke="#000" stroke-width="2"/>
                <!-- 高亮边（放入线圈组内以随线圈移动） -->
                <line id="scene1-highlight-ab" x1="287" y1="250" x2="352" y2="250" stroke="#1565c0" stroke-width="4" opacity="0" class="scene1-transition"/>
                <line id="scene1-highlight-cd" x1="287" y1="315" x2="352" y2="315" stroke="#1565c0" stroke-width="4" opacity="0" class="scene1-transition"/>
                <!-- 顶点标签 -->
                <text id="scene1-label-a" x="275" y="242" font-size="14" fill="#000" text-anchor="end">a</text>
                <text id="scene1-label-b" x="360" y="242" font-size="14" fill="#000" text-anchor="start">b</text>
                <text id="scene1-label-c" x="360" y="325" font-size="14" fill="#000" text-anchor="start">c</text>
                <text id="scene1-label-d" x="275" y="325" font-size="14" fill="#000" text-anchor="end">d</text>
                <!-- m1标签（线圈左侧外部） -->
                <text id="scene1-label-m1" x="260" y="282" font-size="14" fill="#2e7d32" text-anchor="end">m₁</text>
                <!-- R标签（线圈下方外部，远离d和l） -->
                <text id="scene1-label-R" x="250" y="340" font-size="13" fill="#2e7d32" text-anchor="end">R=0.10Ω</text>
                <!-- l=0.20m 尺寸线（线圈左侧外部，远离h） -->
                <g id="scene1-dim-l">
                    <line x1="230" y1="250" x2="230" y2="315" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#scene1-arrowhead-green)" marker-start="url(#scene1-arrowhead-green-start)"/>
                    <text x="180" y="285" font-size="13" fill="#2e7d32" text-anchor="end">l=0.20m</text>
                </g>
            </g>

            <!-- 砝码组（可移动） -->
            <g id="scene1-weight-group" class="scene1-transition" transform="translate(0,0)">
                <rect x="540" y="185" width="40" height="50" fill="#e0e0e0" stroke="#000" stroke-width="2"/>
                <text id="scene1-label-m2" x="595" y="210" font-size="14" fill="#2e7d32" text-anchor="start">m₂</text>
            </g>

            <!-- 运动方向箭头（默认隐藏） -->
            <g id="scene1-arrow-up" opacity="0" class="scene1-transition">
                <line x1="420" y1="240" x2="420" y2="210" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrowhead-blue)"/>
                <text x="425" y="225" font-size="14" fill="#1565c0" text-anchor="start">v</text>
            </g>
            <g id="scene1-arrow-down" opacity="0" class="scene1-transition">
                <line x1="510" y1="210" x2="510" y2="240" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrowhead-blue)"/>
                <text x="505" y="230" font-size="14" fill="#1565c0" text-anchor="end">v</text>
            </g>

            <!-- 过程标记（默认隐藏，左侧远处） -->
            <text id="scene1-text-start" x="60" y="230" font-size="14" fill="#c62828" text-anchor="middle" opacity="0" class="scene1-transition">过程开始</text>
            <text id="scene1-text-end" x="120" y="40" font-size="14" fill="#c62828" text-anchor="middle" opacity="0" class="scene1-transition">过程结束</text>

            <!-- 切割提示（默认隐藏，右侧远处） -->
            <text id="scene1-text-cut-ab" x="460" y="155" font-size="13" fill="#1565c0" text-anchor="start" opacity="0" class="scene1-transition">ab边切割磁感线</text>
            <text id="scene1-text-cut-cd" x="460" y="110" font-size="13" fill="#1565c0" text-anchor="start" opacity="0" class="scene1-transition">cd边切割磁感线</text>

            <!-- 位移标注（默认隐藏，左侧远处） -->
            <g id="scene1-text-displacement-l" opacity="0" class="scene1-transition">
                <line x1="180" y1="185" x2="180" y2="215" stroke="#c62828" stroke-width="1.5" marker-end="url(#scene1-arrowhead-red)" marker-start="url(#scene1-arrowhead-red)"/>
                <text x="170" y="203" font-size="13" fill="#c62828" text-anchor="end">位移=l</text>
            </g>
            <g id="scene1-text-displacement-2l" opacity="0" class="scene1-transition">
                <line x1="170" y1="120" x2="170" y2="185" stroke="#c62828" stroke-width="1.5" marker-end="url(#scene1-arrowhead-red)" marker-start="url(#scene1-arrowhead-red)"/>
                <text x="160" y="155" font-size="13" fill="#c62828" text-anchor="end">位移=2l</text>
            </g>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <div id="scene1-step-display">步骤 1/6</div>
            <button id="scene1-btn-next">下一步 ▶</button>
            <button id="scene1-btn-reset">重置</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        let currentStep = 0;
        const totalSteps = 6; // 0~5

        const stepConfigs = [
            { coilDy: 0, weightDy: 0, show: [], highlight: null },
            { coilDy: -65, weightDy: 65, show: ['scene1-text-start', 'scene1-arrow-up', 'scene1-arrow-down'], highlight: null },
            { coilDy: -100, weightDy: 100, show: ['scene1-text-start', 'scene1-arrow-up', 'scene1-arrow-down', 'scene1-text-cut-ab', 'scene1-highlight-ab'], highlight: 'ab' },
            { coilDy: -130, weightDy: 130, show: ['scene1-text-start', 'scene1-arrow-up', 'scene1-arrow-down', 'scene1-text-displacement-l'], highlight: null },
            { coilDy: -165, weightDy: 165, show: ['scene1-text-start', 'scene1-arrow-up', 'scene1-arrow-down', 'scene1-text-cut-cd', 'scene1-highlight-cd'], highlight: 'cd' },
            { coilDy: -195, weightDy: 195, show: ['scene1-text-start', 'scene1-arrow-up', 'scene1-arrow-down', 'scene1-text-displacement-2l', 'scene1-text-end'], highlight: null }
        ];

        const allDynamicIds = [
            'scene1-text-start', 'scene1-text-end',
            'scene1-arrow-up', 'scene1-arrow-down',
            'scene1-highlight-ab', 'scene1-highlight-cd',
            'scene1-text-cut-ab', 'scene1-text-cut-cd',
            'scene1-text-displacement-l', 'scene1-text-displacement-2l'
        ];

        const coilGroup = document.getElementById('scene1-coil-group');
        const weightGroup = document.getElementById('scene1-weight-group');
        const ropeLeft = document.getElementById('scene1-rope-left');
        const ropeRight = document.getElementById('scene1-rope-right');
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const btnReset = document.getElementById('scene1-btn-reset');
        const stepDisplay = document.getElementById('scene1-step-display');

        function render() {
            const cfg = stepConfigs[currentStep];
            coilGroup.setAttribute('transform', 'translate(0,' + cfg.coilDy + ')');
            weightGroup.setAttribute('transform', 'translate(0,' + cfg.weightDy + ')');
            ropeLeft.setAttribute('y2', 250 + cfg.coilDy);
            ropeRight.setAttribute('y2', 185 + cfg.weightDy);

            allDynamicIds.forEach(id => {
                const el = document.getElementById(id);
                if (!el) return;
                if (cfg.show.includes(id)) {
                    el.style.opacity = '1';
                    el.style.display = '';
                } else {
                    el.style.opacity = '0';
                    setTimeout(() => {
                        if (!stepConfigs[currentStep].show.includes(id)) el.style.display = 'none';
                    }, 250);
                }
            });

            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps - 1;
            stepDisplay.textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;
        }

        btnPrev.addEventListener('click', () => { if (currentStep > 0) { currentStep--; render(); } });
        btnNext.addEventListener('click', () => { if (currentStep < totalSteps - 1) { currentStep++; render(); } });
        btnReset.addEventListener('click', () => { currentStep = 0; render(); });

        render();
    })();
    </script>
</body>
</html>
