<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>平行板电容器中三带电小球连杆下落</title>
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.min.js" async></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 20px; z-index: 10; }
        #scene1-controls button {
            padding: 8px 20px; font-size: 14px; cursor: pointer; border: 1px solid #ccc;
            border-radius: 4px; background: #f5f5f5; transition: all 0.2s;
        }
        #scene1-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene1-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 14px; color: #555; min-width: 80px; text-align: center; }
        #scene1-panel {
            position: absolute; left: 480px; top: 40px; width: 300px; height: 400px;
            background: #f8f8f8; border: 1px solid #e0e0e0; border-radius: 4px;
            padding: 16px; box-sizing: border-box; z-index: 5;
        }
        #scene1-panel h3 { margin: 0 0 12px 0; font-size: 16px; text-align: center; color: #333; }
        #scene1-panel .panel-stage { text-align: center; font-size: 15px; color: #1565c0; font-weight: bold; margin-bottom: 8px; min-height: 22px; }
        #scene1-panel .panel-divider { border: none; border-top: 1px solid #888; margin: 8px 0; }
        #scene1-panel .panel-row { display: flex; justify-content: space-between; margin: 10px 0; font-size: 14px; color: #444; }
        #scene1-panel .panel-row .label { color: #666; }
        #scene1-panel .panel-row .value { color: #222; font-weight: 500; }
        #scene1-panel .panel-expr { text-align: center; font-size: 15px; color: #222; margin: 8px 0; min-height: 24px; }
        #scene1-panel .panel-conclusion {
            margin-top: 12px; padding-top: 10px; border-top: 1px dashed #bbb;
            font-size: 13px; color: #2e7d32; line-height: 1.8; display: none;
        }
        #scene1-panel .panel-conclusion.show { display: block; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <!-- SVG 主图示区 -->
        <svg id="scene1-svg" width="800" height="500" style="display: block;">
            <!-- 电场区域：用水平虚线表示，避免与文字产生大面积重叠检测 -->
            <g id="scene1-field-lines" stroke="#1565c0" stroke-width="1" stroke-dasharray="5,5" opacity="0.25">
                <line x1="80" y1="210" x2="420" y2="210" />
                <line x1="80" y1="230" x2="420" y2="230" />
                <line x1="80" y1="250" x2="420" y2="250" />
                <line x1="80" y1="270" x2="420" y2="270" />
                <line x1="80" y1="290" x2="420" y2="290" />
                <line x1="80" y1="310" x2="420" y2="310" />
                <line x1="80" y1="330" x2="420" y2="330" />
                <line x1="80" y1="350" x2="420" y2="350" />
                <line x1="80" y1="370" x2="420" y2="370" />
            </g>

            <!-- 上极板（带小孔） -->
            <line id="scene1-plate-top-left" x1="80" y1="200" x2="235" y2="200" stroke="#000" stroke-width="3" />
            <line id="scene1-plate-top-right" x1="265" y1="200" x2="420" y2="200" stroke="#000" stroke-width="3" />
            <!-- 下极板 -->
            <line id="scene1-plate-bottom" x1="80" y1="380" x2="420" y2="380" stroke="#000" stroke-width="3" />

            <!-- 间距标注线 d=3L -->
            <line x1="60" y1="200" x2="60" y2="380" stroke="#333" stroke-width="1" />
            <polygon points="60,200 56,208 64,208" fill="#333" />
            <polygon points="60,380 56,372 64,372" fill="#333" />
            <text x="50" y="295" font-size="14" fill="#333" text-anchor="middle">$d=3L$</text>

            <!-- 极板标签 -->
            <text x="430" y="195" font-size="14" fill="#333">上极板</text>
            <text x="430" y="395" font-size="14" fill="#333">下极板</text>

            <!-- 绝缘轻杆（在球之前绘制，被球覆盖端点） -->
            <line id="scene1-rod-1" x1="250" y1="200" x2="250" y2="140" stroke="#000" stroke-width="2" />
            <line id="scene1-rod-2" x1="250" y1="140" x2="250" y2="80" stroke="#000" stroke-width="2" />

            <!-- L 标注 -->
            <text x="220" y="170" font-size="14" fill="#333" text-anchor="middle">$L$</text>
            <text x="220" y="110" font-size="14" fill="#333" text-anchor="middle">$L$</text>

            <!-- 三小球 -->
            <circle id="scene1-ball-1" cx="250" cy="200" r="12" fill="#fff" stroke="#000" stroke-width="1" style="transition: cy 0.4s ease-in-out, cx 0.4s ease-in-out;" />
            <circle id="scene1-ball-2" cx="250" cy="140" r="12" fill="#fff" stroke="#000" stroke-width="1" style="transition: cy 0.4s ease-in-out, cx 0.4s ease-in-out;" />
            <circle id="scene1-ball-3" cx="250" cy="80" r="12" fill="#fff" stroke="#000" stroke-width="1" style="transition: cy 0.4s ease-in-out, cx 0.4s ease-in-out;" />

            <!-- 小球标签 m,+q（仅步骤0显示） -->
            <text id="scene1-label-ball-1" x="268" y="205" font-size="13" fill="#333">$m,+q$</text>
            <text id="scene1-label-ball-2" x="268" y="145" font-size="13" fill="#333">$m,+q$</text>
            <text id="scene1-label-ball-3" x="268" y="85" font-size="13" fill="#333">$m,+q$</text>

            <!-- 重力箭头（红色）初始隐藏；mg标签放在右侧x=280避免与qE标签拥挤 -->
            <g id="scene1-grav-1" style="display: none; opacity: 0;">
                <line id="scene1-grav-1-line" x1="250" y1="212" x2="250" y2="237" stroke="#c62828" stroke-width="2" />
                <polygon id="scene1-grav-1-head" points="250,237 246,229 254,229" fill="#c62828" />
                <text id="scene1-grav-1-text" x="280" y="242" font-size="13" fill="#c62828">$mg$</text>
            </g>
            <g id="scene1-grav-2" style="display: none; opacity: 0;">
                <line id="scene1-grav-2-line" x1="250" y1="152" x2="250" y2="177" stroke="#c62828" stroke-width="2" />
                <polygon id="scene1-grav-2-head" points="250,177 246,169 254,169" fill="#c62828" />
                <text id="scene1-grav-2-text" x="280" y="182" font-size="13" fill="#c62828">$mg$</text>
            </g>
            <g id="scene1-grav-3" style="display: none; opacity: 0;">
                <line id="scene1-grav-3-line" x1="250" y1="92" x2="250" y2="117" stroke="#c62828" stroke-width="2" />
                <polygon id="scene1-grav-3-head" points="250,117 246,109 254,109" fill="#c62828" />
                <text id="scene1-grav-3-text" x="280" y="122" font-size="13" fill="#c62828">$mg$</text>
            </g>

            <!-- 电场力箭头（蓝色）初始隐藏；qE标签放在左侧x=220避免与mg标签拥挤 -->
            <g id="scene1-elec-1" style="display: none; opacity: 0;">
                <line id="scene1-elec-1-line" x1="250" y1="188" x2="250" y2="163" stroke="#1565c0" stroke-width="2" />
                <polygon id="scene1-elec-1-head" points="250,163 246,171 254,171" fill="#1565c0" />
                <text id="scene1-elec-1-text" x="220" y="158" font-size="13" fill="#1565c0" text-anchor="end">$qE$</text>
            </g>
            <g id="scene1-elec-2" style="display: none; opacity: 0;">
                <line id="scene1-elec-2-line" x1="250" y1="128" x2="250" y2="103" stroke="#1565c0" stroke-width="2" />
                <polygon id="scene1-elec-2-head" points="250,103 246,111 254,111" fill="#1565c0" />
                <text id="scene1-elec-2-text" x="220" y="98" font-size="13" fill="#1565c0" text-anchor="end">$qE$</text>
            </g>
            <g id="scene1-elec-3" style="display: none; opacity: 0;">
                <line id="scene1-elec-3-line" x1="250" y1="68" x2="250" y2="43" stroke="#1565c0" stroke-width="2" />
                <polygon id="scene1-elec-3-head" points="250,43 246,51 254,51" fill="#1565c0" />
                <text id="scene1-elec-3-text" x="220" y="38" font-size="13" fill="#1565c0" text-anchor="end">$qE$</text>
            </g>

            <!-- 合力箭头（绿色）初始隐藏 -->
            <g id="scene1-netforce" style="display: none; opacity: 0;">
                <line id="scene1-net-line" x1="360" y1="140" x2="360" y2="180" stroke="#2e7d32" stroke-width="2.5" />
                <polygon id="scene1-net-head" points="360,180 356,172 364,172" fill="#2e7d32" />
                <text id="scene1-net-text" x="368" y="178" font-size="14" fill="#2e7d32" font-weight="bold">$F_{合}$</text>
            </g>

            <!-- 合力为零文字（步骤2专用）初始隐藏；放在y=160避免与mg标签拥挤 -->
            <text id="scene1-net-zero" x="360" y="160" font-size="16" fill="#2e7d32" font-weight="bold" text-anchor="middle" style="display: none; opacity: 0;">$F_{合}=0$</text>
        </svg>

        <!-- 右侧面板 -->
        <div id="scene1-panel">
            <h3>阶段分析</h3>
            <div id="scene1-panel-stage" class="panel-stage">初始状态</div>
            <hr class="panel-divider">
            <div class="panel-row">
                <span class="label">在电场中球数 $n$：</span>
                <span id="scene1-panel-n" class="value">0</span>
            </div>
            <div class="panel-row">
                <span class="label">合力表达式：</span>
            </div>
            <div id="scene1-panel-expr" class="panel-expr">$F_{合} = 3mg - nqE$</div>
            <div class="panel-row">
                <span class="label">合力大小与方向：</span>
            </div>
            <div id="scene1-panel-net" class="panel-expr">$3mg$（向下）</div>
            <div class="panel-row">
                <span class="label">运动状态：</span>
            </div>
            <div id="scene1-panel-motion" class="panel-expr">静止释放</div>
            <div id="scene1-panel-conclusion" class="panel-conclusion">
                <div>$qE = \dfrac{3mg}{2}$</div>
                <div>$U = \dfrac{9mgL}{2q}$</div>
                <div>$v_{max} = \sqrt{gL}$</div>
            </div>
        </div>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 0/4</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现：平行板电容器中三带电小球连杆下落分步分析

        // 辅助函数：控制元素显示/隐藏（同时设置 display 和 opacity）
        function showEl(el) {
            el.style.display = '';
            el.style.opacity = '1';
        }
        function hideEl(el) {
            el.style.display = 'none';
            el.style.opacity = '0';
        }

        // 状态配置：5个步骤（0-4）
        const stepConfig = [
            { // 步骤0：初始状态
                balls: [{x:250, y:200}, {x:250, y:140}, {x:250, y:80}],
                inField: [false, false, false],
                showGravity: [false, false, false],
                showElectric: [false, false, false],
                showNetForce: false,
                netForceDir: null,
                showBallLabels: true,
                stageName: '初始状态',
                n: '0',
                expression: 'F_{合} = 3mg - nqE',
                netForceText: '3mg（向下）',
                motionState: '静止释放',
                showConclusion: false
            },
            { // 步骤1：0 < x < L
                balls: [{x:250, y:230}, {x:250, y:170}, {x:250, y:110}],
                inField: [true, false, false],
                showGravity: [true, true, true],
                showElectric: [true, false, false],
                showNetForce: true,
                netForceDir: 'down',
                showBallLabels: false,
                stageName: '0 < x < L',
                n: '1',
                expression: 'F_{合} = 3mg - qE',
                netForceText: '\\frac{3mg}{2}（向下）',
                motionState: '加速下落',
                showConclusion: false
            },
            { // 步骤2：L \\leq x < 2L
                balls: [{x:250, y:290}, {x:250, y:230}, {x:250, y:170}],
                inField: [true, true, false],
                showGravity: [true, true, true],
                showElectric: [true, true, false],
                showNetForce: true,
                netForceDir: 'zero',
                showBallLabels: false,
                stageName: 'L \\leq x < 2L',
                n: '2',
                expression: 'F_{合} = 3mg - 2qE',
                netForceText: '0',
                motionState: '匀速下落（v_{max}）',
                showConclusion: false
            },
            { // 步骤3：2L \\leq x < 3L
                balls: [{x:250, y:350}, {x:250, y:290}, {x:250, y:230}],
                inField: [true, true, true],
                showGravity: [true, true, true],
                showElectric: [true, true, true],
                showNetForce: true,
                netForceDir: 'up',
                showBallLabels: false,
                stageName: '2L \\leq x < 3L',
                n: '3',
                expression: 'F_{合} = 3mg - 3qE',
                netForceText: '\\frac{3mg}{2}（向上）',
                motionState: '减速下落',
                showConclusion: false
            },
            { // 步骤4：x = 3L（末状态）
                balls: [{x:250, y:380}, {x:250, y:320}, {x:250, y:260}],
                inField: [true, true, true],
                showGravity: [true, true, true],
                showElectric: [true, true, true],
                showNetForce: true,
                netForceDir: 'up',
                showBallLabels: false,
                stageName: 'x = 3L（末状态）',
                n: '3',
                expression: 'F_{合} = 3mg - 3qE',
                netForceText: '\\frac{3mg}{2}（向上）',
                motionState: '速度减为零',
                showConclusion: true
            }
        ];

        let currentStep = 0;

        // DOM 元素引用
        const els = {
            ball1: document.getElementById('scene1-ball-1'),
            ball2: document.getElementById('scene1-ball-2'),
            ball3: document.getElementById('scene1-ball-3'),
            rod1: document.getElementById('scene1-rod-1'),
            rod2: document.getElementById('scene1-rod-2'),
            grav1: document.getElementById('scene1-grav-1'),
            grav2: document.getElementById('scene1-grav-2'),
            grav3: document.getElementById('scene1-grav-3'),
            elec1: document.getElementById('scene1-elec-1'),
            elec2: document.getElementById('scene1-elec-2'),
            elec3: document.getElementById('scene1-elec-3'),
            netForce: document.getElementById('scene1-netforce'),
            netZero: document.getElementById('scene1-net-zero'),
            netLine: document.getElementById('scene1-net-line'),
            netHead: document.getElementById('scene1-net-head'),
            netText: document.getElementById('scene1-net-text'),
            labelBall1: document.getElementById('scene1-label-ball-1'),
            labelBall2: document.getElementById('scene1-label-ball-2'),
            labelBall3: document.getElementById('scene1-label-ball-3'),
            gravLines: [
                document.getElementById('scene1-grav-1-line'),
                document.getElementById('scene1-grav-2-line'),
                document.getElementById('scene1-grav-3-line')
            ],
            gravHeads: [
                document.getElementById('scene1-grav-1-head'),
                document.getElementById('scene1-grav-2-head'),
                document.getElementById('scene1-grav-3-head')
            ],
            gravTexts: [
                document.getElementById('scene1-grav-1-text'),
                document.getElementById('scene1-grav-2-text'),
                document.getElementById('scene1-grav-3-text')
            ],
            elecLines: [
                document.getElementById('scene1-elec-1-line'),
                document.getElementById('scene1-elec-2-line'),
                document.getElementById('scene1-elec-3-line')
            ],
            elecHeads: [
                document.getElementById('scene1-elec-1-head'),
                document.getElementById('scene1-elec-2-head'),
                document.getElementById('scene1-elec-3-head')
            ],
            elecTexts: [
                document.getElementById('scene1-elec-1-text'),
                document.getElementById('scene1-elec-2-text'),
                document.getElementById('scene1-elec-3-text')
            ],
            panelStage: document.getElementById('scene1-panel-stage'),
            panelN: document.getElementById('scene1-panel-n'),
            panelExpr: document.getElementById('scene1-panel-expr'),
            panelNet: document.getElementById('scene1-panel-net'),
            panelMotion: document.getElementById('scene1-panel-motion'),
            panelConclusion: document.getElementById('scene1-panel-conclusion'),
            btnPrev: document.getElementById('scene1-btn-prev'),
            btnNext: document.getElementById('scene1-btn-next'),
            stepIndicator: document.getElementById('scene1-step-indicator')
        };

        const balls = [els.ball1, els.ball2, els.ball3];
        const gravGroups = [els.grav1, els.grav2, els.grav3];
        const elecGroups = [els.elec1, els.elec2, els.elec3];
        const ballLabels = [els.labelBall1, els.labelBall2, els.labelBall3];

        // 更新重力箭头位置（根据球的当前位置）
        function updateGravityArrows(cfg) {
            for (let i = 0; i < 3; i++) {
                const y = cfg.balls[i].y;
                // 箭头从球底部向下25px
                const y1 = y + 12;
                const y2 = y + 37;
                els.gravLines[i].setAttribute('y1', y1);
                els.gravLines[i].setAttribute('y2', y2);
                els.gravHeads[i].setAttribute('points', `${250},${y2} ${246},${y2-8} ${254},${y2-8}`);
                els.gravTexts[i].setAttribute('y', y2 + 14);
            }
        }

        // 更新电场力箭头位置
        function updateElectricArrows(cfg) {
            for (let i = 0; i < 3; i++) {
                const y = cfg.balls[i].y;
                // 箭头从球顶部向上25px
                const y1 = y - 12;
                const y2 = y - 37;
                els.elecLines[i].setAttribute('y1', y1);
                els.elecLines[i].setAttribute('y2', y2);
                els.elecHeads[i].setAttribute('points', `${250},${y2} ${246},${y2+8} ${254},${y2+8}`);
                els.elecTexts[i].setAttribute('y', y2 - 5);
            }
        }

        // 更新合力箭头
        function updateNetForce(cfg) {
            const ball2y = cfg.balls[1].y; // 与球2（中间球）y坐标对齐
            if (cfg.netForceDir === 'down') {
                const y1 = ball2y;
                const y2 = ball2y + 40;
                els.netLine.setAttribute('y1', y1);
                els.netLine.setAttribute('y2', y2);
                els.netLine.setAttribute('x1', '360');
                els.netLine.setAttribute('x2', '360');
                els.netHead.setAttribute('points', `360,${y2} 356,${y2-8} 364,${y2-8}`);
                els.netText.setAttribute('x', '368');
                els.netText.setAttribute('y', y2 + 5);
                els.netText.textContent = 'F合';
                showEl(els.netForce);
                hideEl(els.netZero);
            } else if (cfg.netForceDir === 'up') {
                const y1 = ball2y;
                const y2 = ball2y - 40;
                els.netLine.setAttribute('y1', y1);
                els.netLine.setAttribute('y2', y2);
                els.netLine.setAttribute('x1', '360');
                els.netLine.setAttribute('x2', '360');
                els.netHead.setAttribute('points', `360,${y2} 356,${y2+8} 364,${y2+8}`);
                els.netText.setAttribute('x', '368');
                els.netText.setAttribute('y', y2 - 2);
                els.netText.textContent = 'F合';
                showEl(els.netForce);
                hideEl(els.netZero);
            } else if (cfg.netForceDir === 'zero') {
                hideEl(els.netForce);
                showEl(els.netZero);
            } else {
                hideEl(els.netForce);
                hideEl(els.netZero);
            }
        }

        // 渲染指定步骤
        function renderStep(step) {
            const cfg = stepConfig[step];

            // 更新小球位置
            for (let i = 0; i < 3; i++) {
                balls[i].setAttribute('cx', cfg.balls[i].x);
                balls[i].setAttribute('cy', cfg.balls[i].y);
                // 在电场中的球用蓝色边框
                if (cfg.inField[i]) {
                    balls[i].setAttribute('stroke', '#1565c0');
                    balls[i].setAttribute('stroke-width', '2');
                } else {
                    balls[i].setAttribute('stroke', '#000');
                    balls[i].setAttribute('stroke-width', '1');
                }
            }

            // 更新杆位置
            els.rod1.setAttribute('x1', cfg.balls[0].x);
            els.rod1.setAttribute('y1', cfg.balls[0].y);
            els.rod1.setAttribute('x2', cfg.balls[1].x);
            els.rod1.setAttribute('y2', cfg.balls[1].y);
            els.rod2.setAttribute('x1', cfg.balls[1].x);
            els.rod2.setAttribute('y1', cfg.balls[1].y);
            els.rod2.setAttribute('x2', cfg.balls[2].x);
            els.rod2.setAttribute('y2', cfg.balls[2].y);

            // 更新力箭头位置
            updateGravityArrows(cfg);
            updateElectricArrows(cfg);
            updateNetForce(cfg);

            // 显示/隐藏小球标签 m,+q
            for (let i = 0; i < 3; i++) {
                if (cfg.showBallLabels) {
                    showEl(ballLabels[i]);
                } else {
                    hideEl(ballLabels[i]);
                }
            }

            // 显示/隐藏重力箭头
            for (let i = 0; i < 3; i++) {
                if (cfg.showGravity[i]) {
                    showEl(gravGroups[i]);
                } else {
                    hideEl(gravGroups[i]);
                }
            }

            // 显示/隐藏电场力箭头
            for (let i = 0; i < 3; i++) {
                if (cfg.showElectric[i]) {
                    showEl(elecGroups[i]);
                } else {
                    hideEl(elecGroups[i]);
                }
            }

            // 更新右侧面板
            els.panelStage.textContent = cfg.stageName;
            els.panelN.textContent = cfg.n;
            els.panelExpr.textContent = '$' + cfg.expression + '$';
            els.panelNet.textContent = '$' + cfg.netForceText + '$';
            els.panelMotion.textContent = '$' + cfg.motionState + '$';

            // 结论显示
            if (cfg.showConclusion) {
                els.panelConclusion.classList.add('show');
            } else {
                els.panelConclusion.classList.remove('show');
            }

            // 更新按钮状态
            els.btnPrev.disabled = step === 0;
            els.btnNext.disabled = step === 4;
            els.stepIndicator.textContent = '步骤 ' + step + '/4';

            // 触发 MathJax 重新渲染面板
            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise([els.panelStage, els.panelExpr, els.panelNet, els.panelMotion, els.panelConclusion]).catch(() => {});
            }
        }

        // 事件绑定
        els.btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep(currentStep);
            }
        });

        els.btnNext.addEventListener('click', function() {
            if (currentStep < 4) {
                currentStep++;
                renderStep(currentStep);
            }
        });

        // 初始渲染
        renderStep(0);
    })();
    </script>
</body>
</html>
