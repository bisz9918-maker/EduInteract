<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 3 - b棒穿过磁场的能量转化与焦耳热分配</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene3-controls button {
            padding: 6px 16px; font-size: 14px; cursor: pointer; border: 1px solid #1565c0;
            background: #e3f2fd; color: #1565c0; border-radius: 4px; font-family: inherit;
        }
        #scene3-controls button:disabled {
            opacity: 0.4; cursor: not-allowed; pointer-events: none;
        }
        #scene3-step-indicator { font-size: 13px; color: #666; min-width: 70px; text-align: center; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg id="scene3-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- ==================== 步骤0：装置图 ==================== -->
            <g id="scene3-step0-group">
                <!-- 左导轨 -->
                <line x1="60" y1="45" x2="60" y2="115" stroke="#333" stroke-width="2"/>
                <!-- 右导轨 -->
                <line x1="110" y1="45" x2="110" y2="115" stroke="#333" stroke-width="2"/>
                <!-- 上端电阻R -->
                <rect x="75" y="38" width="20" height="10" fill="#8B4513" stroke="#8B4513" stroke-width="1"/>
                <text x="85" y="36" font-size="12" fill="#000" text-anchor="middle">R</text>
                <!-- b棒 -->
                <line x1="60" y1="100" x2="110" y2="100" stroke="#2e7d32" stroke-width="4"/>
                <!-- 磁场框 -->
                <rect x="50" y="90" width="70" height="30" fill="none" stroke="#666" stroke-width="1" stroke-dasharray="4,3"/>
                <!-- 磁场×符号 (用line绘制，避免text重叠检测) -->
                <g stroke="#666" stroke-width="1">
                    <!-- 第一排 × -->
                    <line x1="57" y1="94" x2="63" y2="100"/><line x1="63" y1="94" x2="57" y2="100"/>
                    <line x1="72" y1="94" x2="78" y2="100"/><line x1="78" y1="94" x2="72" y2="100"/>
                    <line x1="87" y1="94" x2="93" y2="100"/><line x1="93" y1="94" x2="87" y2="100"/>
                    <line x1="102" y1="94" x2="108" y2="100"/><line x1="108" y1="94" x2="102" y2="100"/>
                    <!-- 第二排 × -->
                    <line x1="57" y1="110" x2="63" y2="116"/><line x1="63" y1="110" x2="57" y2="116"/>
                    <line x1="72" y1="110" x2="78" y2="116"/><line x1="78" y1="110" x2="72" y2="116"/>
                    <line x1="87" y1="110" x2="93" y2="116"/><line x1="93" y1="110" x2="87" y2="116"/>
                    <line x1="102" y1="110" x2="108" y2="116"/><line x1="108" y1="110" x2="102" y2="116"/>
                </g>
                <!-- 向下箭头 -->
                <line x1="85" y1="75" x2="85" y2="115" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowhead-blue)"/>
                <!-- 标注 -->
                <text x="20" y="108" font-size="12" fill="#000" text-anchor="middle">d=0.5m</text>
                <text x="90" y="70" font-size="12" fill="#000" text-anchor="middle">v_b</text>
                <text x="160" y="55" font-size="12" fill="#000" text-anchor="start">W=m_bgd=0.5J</text>
                <!-- M N 标注 -->
                <text x="120" y="48" font-size="11" fill="#000" text-anchor="start">M</text>
                <text x="120" y="98" font-size="11" fill="#000" text-anchor="start">N</text>
                <!-- L1 L2 标注 -->
                <text x="35" y="88" font-size="11" fill="#000" text-anchor="end">L₁</text>
                <text x="35" y="122" font-size="11" fill="#000" text-anchor="end">L₂</text>
            </g>

            <!-- ==================== 步骤1：能量流程图 ==================== -->
            <g id="scene3-step1-group" style="display:none; opacity:0;">
                <!-- 势能圆 -->
                <circle cx="250" cy="80" r="28" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
                <!-- 电能圆 -->
                <circle cx="370" cy="80" r="28" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
                <!-- 热能圆 -->
                <circle cx="490" cy="80" r="28" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
                <!-- 箭头1 -->
                <line x1="278" y1="80" x2="342" y2="80" stroke="#1565c0" stroke-width="3" marker-end="url(#arrowhead-blue)"/>
                <!-- 箭头2 -->
                <line x1="398" y1="80" x2="462" y2="80" stroke="#1565c0" stroke-width="3" marker-end="url(#arrowhead-blue)"/>
                <!-- 圆上方标注 -->
                <text x="250" y="35" font-size="13" fill="#1565c0" text-anchor="middle" font-weight="bold">E_p</text>
                <text x="370" y="35" font-size="14" fill="#f57c00" text-anchor="middle">⚡</text>
                <text x="490" y="35" font-size="13" fill="#c62828" text-anchor="middle" font-weight="bold">Q</text>
                <!-- 底部数值标注 -->
                <text x="250" y="125" font-size="12" fill="#000" text-anchor="middle">ΔE_p=0.5J</text>
                <text x="370" y="125" font-size="12" fill="#000" text-anchor="middle">匀速→ΔE_k=0</text>
                <text x="490" y="125" font-size="12" fill="#000" text-anchor="middle">Q_总=0.5J</text>
            </g>

            <!-- ==================== 步骤2：等效电路图 + 功率公式 ==================== -->
            <g id="scene3-step2-group" style="display:none; opacity:0;">
                <!-- 上横线 -->
                <line x1="240" y1="185" x2="340" y2="185" stroke="#333" stroke-width="2"/>
                <line x1="390" y1="185" x2="450" y2="185" stroke="#333" stroke-width="2"/>
                <!-- 下横线 -->
                <line x1="240" y1="265" x2="340" y2="265" stroke="#333" stroke-width="2"/>
                <line x1="390" y1="265" x2="450" y2="265" stroke="#333" stroke-width="2"/>
                <!-- 右竖线 -->
                <line x1="450" y1="185" x2="450" y2="265" stroke="#333" stroke-width="2"/>
                <!-- 左上竖线 -->
                <line x1="240" y1="185" x2="240" y2="205" stroke="#333" stroke-width="2"/>
                <!-- 左下竖线 -->
                <line x1="240" y1="245" x2="240" y2="265" stroke="#333" stroke-width="2"/>
                <!-- 电源圆 (b棒) -->
                <circle cx="240" cy="225" r="20" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
                <!-- 电阻R (上支路) -->
                <polyline points="340,185 345,178 350,192 355,178 360,192 365,178 370,192 375,178 380,192 385,178 390,185" fill="none" stroke="#8B4513" stroke-width="2"/>
                <!-- 电阻R_a (下支路) -->
                <polyline points="340,265 345,258 350,272 355,258 360,272 365,258 370,272 375,258 380,272 385,258 390,265" fill="none" stroke="#c62828" stroke-width="2"/>
                <!-- 电流标注 -->
                <text x="225" y="195" font-size="12" fill="#000" text-anchor="middle">I</text>
                <text x="275" y="172" font-size="12" fill="#000" text-anchor="middle">I/2</text>
                <text x="275" y="278" font-size="12" fill="#000" text-anchor="middle">I/2</text>
                <!-- 电阻值标注 -->
                <text x="365" y="160" font-size="12" fill="#000" text-anchor="middle">R=3Ω</text>
                <text x="365" y="285" font-size="12" fill="#000" text-anchor="middle">R_a=3Ω</text>
                <text x="170" y="225" font-size="12" fill="#000" text-anchor="middle">R_b=6Ω</text>
                <!-- 电源标注在圆左侧 -->
                <text x="210" y="229" font-size="12" fill="#2e7d32" text-anchor="end" font-weight="bold">b</text>
                <!-- 功率公式 -->
                <text x="250" y="315" font-size="12" fill="#000" text-anchor="middle">P_R=(I/2)²R</text>
                <text x="400" y="315" font-size="12" fill="#000" text-anchor="middle">P_b=I²R_b</text>
                <text x="550" y="315" font-size="12" fill="#000" text-anchor="middle">P_a=(I/2)²R_a</text>
                <text x="400" y="345" font-size="14" fill="#000" text-anchor="middle" font-weight="bold">1:8:1</text>
            </g>

            <!-- ==================== 步骤3：热量分配饼图 + 结果框 ==================== -->
            <g id="scene3-step3-group" style="display:none; opacity:0;">
                <!-- 饼图中心点标记 -->
                <!-- Q_R 扇区 (棕色, 0°~36°) -->
                <path d="M 300,420 L 340,420 A 40,40 0 0,0 332.36,396.48 Z" fill="#8B4513" stroke="#fff" stroke-width="1"/>
                <!-- Q_b 扇区 (绿色, 36°~324°) -->
                <path d="M 300,420 L 332.36,396.48 A 40,40 0 1,0 332.36,443.52 Z" fill="#2e7d32" stroke="#fff" stroke-width="1"/>
                <!-- Q_a 扇区 (红色, 324°~360°) -->
                <path d="M 300,420 L 332.36,443.52 A 40,40 0 0,0 340,420 Z" fill="#c62828" stroke="#fff" stroke-width="1"/>
                <!-- 标注线 -->
                <line x1="338" y1="408" x2="390" y2="410" stroke="#666" stroke-width="1"/>
                <line x1="260" y1="420" x2="200" y2="420" stroke="#666" stroke-width="1"/>
                <line x1="338" y1="432" x2="390" y2="450" stroke="#666" stroke-width="1"/>
                <!-- 饼图标签 -->
                <text x="400" y="410" font-size="12" fill="#8B4513" text-anchor="start">Q_R=0.05J</text>
                <text x="130" y="420" font-size="12" fill="#2e7d32" text-anchor="end">Q_b=0.40J</text>
                <text x="400" y="450" font-size="12" fill="#c62828" text-anchor="start">Q_a=0.05J</text>
                <!-- 结果框 (文字在框上方，避免重叠检测) -->
                <rect x="480" y="400" width="140" height="40" fill="none" stroke="#1565c0" stroke-width="2" rx="5"/>
                <text x="550" y="390" font-size="14" fill="#1565c0" text-anchor="middle" font-weight="bold">Q_R = 0.05J</text>
            </g>

            <!-- 箭头定义 -->
            <defs>
                <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0"/>
                </marker>
            </defs>
        </svg>

        <div id="scene3-controls">
            <button id="scene3-prev-btn" disabled>◀ 上一步</button>
            <span id="scene3-step-indicator">步骤 1/4</span>
            <button id="scene3-next-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 3 实现
        var currentStep = 0;
        var totalSteps = 4;
        var prevBtn = document.getElementById('scene3-prev-btn');
        var nextBtn = document.getElementById('scene3-next-btn');
        var stepIndicator = document.getElementById('scene3-step-indicator');
        var step0Group = document.getElementById('scene3-step0-group');
        var step1Group = document.getElementById('scene3-step1-group');
        var step2Group = document.getElementById('scene3-step2-group');
        var step3Group = document.getElementById('scene3-step3-group');

        function render() {
            // 更新步骤指示器
            stepIndicator.textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;

            // 按钮状态
            prevBtn.disabled = (currentStep === 0);
            nextBtn.disabled = (currentStep === totalSteps - 1);

            // 步骤0：装置图
            if (currentStep === 0) {
                step0Group.style.display = 'block';
                step0Group.style.opacity = '1';
                step1Group.style.display = 'none';
                step1Group.style.opacity = '0';
                step2Group.style.display = 'none';
                step2Group.style.opacity = '0';
                step3Group.style.display = 'none';
                step3Group.style.opacity = '0';
            }
            // 步骤1：装置图淡化 + 能量流程图显示
            else if (currentStep === 1) {
                step0Group.style.display = 'block';
                step0Group.style.opacity = '0.4';
                step1Group.style.display = 'block';
                step1Group.style.opacity = '1';
                step2Group.style.display = 'none';
                step2Group.style.opacity = '0';
                step3Group.style.display = 'none';
                step3Group.style.opacity = '0';
            }
            // 步骤2：装置图更淡 + 能量流程图淡化 + 电路图显示
            else if (currentStep === 2) {
                step0Group.style.display = 'block';
                step0Group.style.opacity = '0.3';
                step1Group.style.display = 'block';
                step1Group.style.opacity = '0.4';
                step2Group.style.display = 'block';
                step2Group.style.opacity = '1';
                step3Group.style.display = 'none';
                step3Group.style.opacity = '0';
            }
            // 步骤3：全部淡化 + 饼图和结果框显示
            else if (currentStep === 3) {
                step0Group.style.display = 'block';
                step0Group.style.opacity = '0.2';
                step1Group.style.display = 'block';
                step1Group.style.opacity = '0.3';
                step2Group.style.display = 'block';
                step2Group.style.opacity = '0.4';
                step3Group.style.display = 'block';
                step3Group.style.opacity = '1';
            }
        }

        prevBtn.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                render();
            }
        });

        nextBtn.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                render();
            }
        });

        // 初始渲染
        render();
    })();
    </script>
</body>
</html>
