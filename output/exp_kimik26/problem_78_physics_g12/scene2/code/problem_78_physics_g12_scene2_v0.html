<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>导体棒磁场运动分析 - 场景2</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "SimHei", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene2-controls button {
            padding: 6px 16px; font-size: 14px; cursor: pointer;
            border: 1px solid #ccc; border-radius: 4px; background: #f5f5f5;
        }
        #scene2-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene2-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene2-step-indicator { font-size: 13px; color: #666; min-width: 80px; text-align: center; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 定义：磁场图案 -->
            <defs>
                <pattern id="scene2-mag-pattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
                    <path d="M 6,6 L 14,14 M 14,6 L 6,14" stroke="#999" stroke-width="1"/>
                </pattern>
                <pattern id="scene2-mag-pattern-small" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
                    <path d="M 5,5 L 11,11 M 11,5 L 5,11" stroke="#999" stroke-width="0.8"/>
                </pattern>
            </defs>

            <!-- 公共标题 -->
            <text id="scene2-title" x="400" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">导体棒磁场运动分析</text>
            <text id="scene2-step-name" x="400" y="48" text-anchor="middle" font-size="13" fill="#666">问题引入</text>

            <!-- ========== 步骤0：问题引入 ========== -->
            <g id="scene2-step0-group">
                <!-- 待求目标 -->
                <text x="400" y="82" text-anchor="middle" font-size="18" font-weight="bold" fill="#1565c0">求：v_a : v_b = ?</text>

                <!-- 左导轨 -->
                <line x1="300" y1="100" x2="300" y2="380" stroke="#333" stroke-width="2"/>
                <!-- 右导轨 -->
                <line x1="400" y1="100" x2="400" y2="380" stroke="#333" stroke-width="2"/>
                <!-- 顶部导线 -->
                <line x1="300" y1="100" x2="400" y2="100" stroke="#333" stroke-width="1.5"/>

                <!-- 电阻R -->
                <rect x="335" y="85" width="30" height="15" fill="none" stroke="#8B4513" stroke-width="1.5"/>
                <text x="375" y="78" font-size="12" fill="#8B4513">R=3Ω</text>

                <!-- a棒（红色，M位置） -->
                <line x1="300" y1="140" x2="400" y2="140" stroke="#c62828" stroke-width="5"/>
                <text x="415" y="148" font-size="13" fill="#c62828">a</text>
                <text x="430" y="120" font-size="12" fill="#666">M</text>

                <!-- b棒（绿色，N位置） -->
                <line x1="300" y1="200" x2="400" y2="200" stroke="#2e7d32" stroke-width="5"/>
                <text x="415" y="208" font-size="13" fill="#2e7d32">b</text>
                <text x="430" y="180" font-size="12" fill="#666">N</text>

                <!-- L1虚线 -->
                <line x1="290" y1="260" x2="410" y2="260" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
                <text x="420" y="260" font-size="13" fill="#666">L₁</text>

                <!-- L2虚线 -->
                <line x1="290" y1="340" x2="410" y2="340" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
                <text x="420" y="340" font-size="13" fill="#666">L₂</text>

                <!-- 磁场区域 -->
                <rect x="300" y="260" width="100" height="80" fill="url(#scene2-mag-pattern)" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>

                <text x="350" y="130" font-size="13" fill="#333">B</text>

                <!-- d双箭头 -->
                <line x1="275" y1="260" x2="275" y2="340" stroke="#333" stroke-width="1"/>
                <polygon points="275,260 271,268 279,268" fill="#333"/>
                <polygon points="275,340 271,332 279,332" fill="#333"/>
                <text x="250" y="305" font-size="12" fill="#333">d=0.5m</text>

                <!-- 右侧参数列 -->
                <text x="520" y="140" font-size="13" fill="#c62828">m_a = 0.2 kg</text>
                <text x="520" y="175" font-size="13" fill="#c62828">R_a = 3 Ω</text>
                <text x="520" y="210" font-size="13" fill="#2e7d32">m_b = 0.1 kg</text>
                <text x="520" y="245" font-size="13" fill="#2e7d32">R_b = 6 Ω</text>
                <text x="520" y="280" font-size="13" fill="#8B4513">R = 3 Ω</text>
                <text x="520" y="315" font-size="13" fill="#333">d = 0.5 m</text>
                <text x="520" y="350" font-size="13" fill="#333">g = 10 m/s²</text>
                <text x="520" y="385" font-size="13" fill="#1565c0">匀速穿过磁场</text>
            </g>

            <!-- ========== 步骤1：b棒在磁场中 ========== -->
            <g id="scene2-step1-group" display="none">
                <!-- 左侧面板：导轨局部图 -->
                <line x1="100" y1="70" x2="100" y2="290" stroke="#333" stroke-width="2"/>
                <line x1="200" y1="70" x2="200" y2="290" stroke="#333" stroke-width="2"/>
                <line x1="100" y1="70" x2="200" y2="70" stroke="#333" stroke-width="1.5"/>

                <!-- 电阻R -->
                <rect x="135" y="58" width="30" height="12" fill="none" stroke="#8B4513" stroke-width="1.5"/>
                <text x="175" y="52" font-size="11" fill="#8B4513">R=3Ω</text>

                <!-- L1虚线 -->
                <line x1="85" y1="150" x2="215" y2="150" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
                <text x="225" y="150" font-size="12" fill="#666">L₁</text>

                <!-- L2虚线 -->
                <line x1="85" y1="250" x2="215" y2="250" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
                <text x="225" y="250" font-size="12" fill="#666">L₂</text>

                <!-- 磁场框 -->
                <rect x="100" y="150" width="100" height="100" fill="url(#scene2-mag-pattern-small)" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>

                <text x="145" y="135" font-size="12" fill="#333">B</text>

                <!-- 磁场中的b棒（绿色粗线） -->
                <line x1="100" y1="200" x2="200" y2="200" stroke="#2e7d32" stroke-width="6"/>
                <text x="215" y="200" font-size="12" fill="#2e7d32">b</text>

                <!-- 下方导轨上的a棒（红色细线半透明） -->
                <line x1="100" y1="275" x2="200" y2="275" stroke="#c62828" stroke-width="3" opacity="0.4"/>
                <text x="215" y="275" font-size="12" fill="#c62828" opacity="0.6">a</text>

                <!-- d双箭头 -->
                <line x1="65" y1="150" x2="65" y2="250" stroke="#333" stroke-width="1"/>
                <polygon points="65,150 61,158 69,158" fill="#333"/>
                <polygon points="65,250 61,242 69,242" fill="#333"/>
                <text x="55" y="195" font-size="11" fill="#333">d</text>

                <!-- 速度箭头 -->
                <line x1="230" y1="200" x2="230" y2="230" stroke="#1565c0" stroke-width="1.5"/>
                <polygon points="230,230 226,222 234,222" fill="#1565c0"/>
                <text x="240" y="218" font-size="12" fill="#1565c0">v_b</text>

                <!-- 受力图 -->
                <rect x="275" y="190" width="20" height="20" fill="none" stroke="#ccc" stroke-width="1"/>
                <line x1="285" y1="210" x2="285" y2="240" stroke="#c62828" stroke-width="1.5"/>
                <polygon points="285,240 281,232 289,232" fill="#c62828"/>
                <text x="285" y="255" text-anchor="middle" font-size="11" fill="#c62828">m_b g</text>
                <line x1="285" y1="190" x2="285" y2="160" stroke="#1565c0" stroke-width="1.5"/>
                <polygon points="285,160 281,168 289,168" fill="#1565c0"/>
                <text x="285" y="150" text-anchor="middle" font-size="11" fill="#1565c0">F_安b</text>

                <!-- 右侧面板：等效电路图 -->
                <line x1="430" y1="90" x2="680" y2="90" stroke="#333" stroke-width="1.5"/>
                <line x1="430" y1="270" x2="680" y2="270" stroke="#333" stroke-width="1.5"/>
                <line x1="680" y1="90" x2="680" y2="270" stroke="#333" stroke-width="1.5"/>

                <!-- 电源符号组 -->
                <line x1="430" y1="100" x2="430" y2="120" stroke="#1565c0" stroke-width="2"/>
                <line x1="420" y1="120" x2="440" y2="120" stroke="#1565c0" stroke-width="2"/>
                <line x1="425" y1="130" x2="435" y2="130" stroke="#1565c0" stroke-width="2"/>
                <line x1="420" y1="140" x2="440" y2="140" stroke="#1565c0" stroke-width="2"/>
                <line x1="425" y1="150" x2="435" y2="150" stroke="#1565c0" stroke-width="2"/>
                <line x1="430" y1="150" x2="430" y2="160" stroke="#1565c0" stroke-width="2"/>
                <text x="340" y="130" font-size="12" fill="#1565c0">ε_b = BLv_b</text>

                <!-- 内阻R_b（绿色） -->
                <rect x="420" y="180" width="20" height="50" fill="none" stroke="#2e7d32" stroke-width="1.5"/>
                <text x="450" y="205" font-size="11" fill="#2e7d32">R_b=6Ω</text>

                <!-- 并联支路R（棕色） -->
                <rect x="530" y="130" width="20" height="50" fill="none" stroke="#8B4513" stroke-width="1.5"/>
                <text x="565" y="155" font-size="11" fill="#8B4513">R=3Ω</text>

                <!-- 并联支路R_a（红色） -->
                <rect x="620" y="130" width="20" height="50" fill="none" stroke="#c62828" stroke-width="1.5"/>
                <text x="655" y="155" font-size="11" fill="#c62828">R_a=3Ω</text>

                <!-- 连接导线 -->
                <line x1="450" y1="90" x2="530" y2="90" stroke="#333" stroke-width="1"/>
                <line x1="550" y1="90" x2="620" y2="90" stroke="#333" stroke-width="1"/>
                <line x1="640" y1="90" x2="680" y2="90" stroke="#333" stroke-width="1"/>
                <line x1="530" y1="180" x2="530" y2="270" stroke="#333" stroke-width="1"/>
                <line x1="620" y1="180" x2="620" y2="270" stroke="#333" stroke-width="1"/>
                <line x1="450" y1="270" x2="680" y2="270" stroke="#333" stroke-width="1"/>

                <!-- 电流箭头 -->
                <line x1="480" y1="90" x2="520" y2="90" stroke="#1565c0" stroke-width="1.5"/>
                <polygon points="520,90 512,86 512,94" fill="#1565c0"/>
                <text x="490" y="80" font-size="11" fill="#1565c0">I_b</text>

                <!-- 总电阻标注 -->
                <text x="550" y="295" text-anchor="middle" font-size="13" fill="#2e7d32">R_总b = 7.5 Ω</text>

                <!-- 公式区 -->
                <text x="50" y="325" font-size="14" fill="#333">受力平衡：m_b g = F_安b = B I_b L</text>
                <text x="50" y="361" font-size="14" fill="#333">电源电动势：ε_b = BLv_b，内阻 R_b = 6Ω</text>
                <text x="50" y="397" font-size="14" fill="#333">外电路并联：R_并 = (R·R_a)/(R+R_a) = (3×3)/(3+3) = 1.5Ω</text>
                <text x="50" y="433" font-size="14" fill="#333">总电阻：R_总b = R_b + R_并 = 6 + 1.5 = 7.5Ω，I_b = BLv_b / R_总b</text>
            </g>

            <!-- ========== 步骤2：a棒在磁场中 ========== -->
            <g id="scene2-step2-group" display="none">
                <line x1="100" y1="70" x2="100" y2="290" stroke="#333" stroke-width="2"/>
                <line x1="200" y1="70" x2="200" y2="290" stroke="#333" stroke-width="2"/>
                <line x1="100" y1="70" x2="200" y2="70" stroke="#333" stroke-width="1.5"/>

                <rect x="135" y="58" width="30" height="12" fill="none" stroke="#8B4513" stroke-width="1.5"/>
                <text x="175" y="52" font-size="11" fill="#8B4513">R=3Ω</text>

                <line x1="85" y1="150" x2="215" y2="150" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
                <text x="225" y="150" font-size="12" fill="#666">L₁</text>

                <line x1="85" y1="250" x2="215" y2="250" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
                <text x="225" y="250" font-size="12" fill="#666">L₂</text>

                <rect x="100" y="150" width="100" height="100" fill="url(#scene2-mag-pattern-small)" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>

                <text x="145" y="135" font-size="12" fill="#333">B</text>

                <line x1="100" y1="200" x2="200" y2="200" stroke="#c62828" stroke-width="6"/>
                <text x="215" y="200" font-size="12" fill="#c62828">a</text>

                <line x1="100" y1="275" x2="200" y2="275" stroke="#2e7d32" stroke-width="3" opacity="0.4"/>
                <text x="215" y="275" font-size="12" fill="#2e7d32" opacity="0.6">b</text>

                <line x1="65" y1="150" x2="65" y2="250" stroke="#333" stroke-width="1"/>
                <polygon points="65,150 61,158 69,158" fill="#333"/>
                <polygon points="65,250 61,242 69,242" fill="#333"/>
                <text x="55" y="195" font-size="11" fill="#333">d</text>

                <line x1="230" y1="200" x2="230" y2="230" stroke="#1565c0" stroke-width="1.5"/>
                <polygon points="230,230 226,222 234,222" fill="#1565c0"/>
                <text x="240" y="218" font-size="12" fill="#1565c0">v_a</text>

                <rect x="275" y="190" width="20" height="20" fill="none" stroke="#ccc" stroke-width="1"/>
                <line x1="285" y1="210" x2="285" y2="240" stroke="#c62828" stroke-width="1.5"/>
                <polygon points="285,240 281,232 289,232" fill="#c62828"/>
                <text x="285" y="255" text-anchor="middle" font-size="11" fill="#c62828">m_a g</text>
                <line x1="285" y1="190" x2="285" y2="160" stroke="#1565c0" stroke-width="1.5"/>
                <polygon points="285,160 281,168 289,168" fill="#1565c0"/>
                <text x="285" y="150" text-anchor="middle" font-size="11" fill="#1565c0">F_安a</text>

                <!-- 右侧面板：等效电路图 -->
                <line x1="430" y1="90" x2="680" y2="90" stroke="#333" stroke-width="1.5"/>
                <line x1="430" y1="270" x2="680" y2="270" stroke="#333" stroke-width="1.5"/>
                <line x1="680" y1="90" x2="680" y2="270" stroke="#333" stroke-width="1.5"/>

                <line x1="430" y1="100" x2="430" y2="120" stroke="#1565c0" stroke-width="2"/>
                <line x1="420" y1="120" x2="440" y2="120" stroke="#1565c0" stroke-width="2"/>
                <line x1="425" y1="130" x2="435" y2="130" stroke="#1565c0" stroke-width="2"/>
                <line x1="420" y1="140" x2="440" y2="140" stroke="#1565c0" stroke-width="2"/>
                <line x1="425" y1="150" x2="435" y2="150" stroke="#1565c0" stroke-width="2"/>
                <line x1="430" y1="150" x2="430" y2="160" stroke="#1565c0" stroke-width="2"/>
                <text x="340" y="130" font-size="12" fill="#1565c0">ε_a = BLv_a</text>

                <rect x="420" y="180" width="20" height="50" fill="none" stroke="#c62828" stroke-width="1.5"/>
                <text x="450" y="205" font-size="11" fill="#c62828">R_a=3Ω</text>

                <rect x="530" y="130" width="20" height="50" fill="none" stroke="#8B4513" stroke-width="1.5"/>
                <text x="565" y="155" font-size="11" fill="#8B4513">R=3Ω</text>

                <rect x="620" y="130" width="20" height="50" fill="none" stroke="#2e7d32" stroke-width="1.5"/>
                <text x="655" y="155" font-size="11" fill="#2e7d32">R_b=6Ω</text>

                <line x1="450" y1="90" x2="530" y2="90" stroke="#333" stroke-width="1"/>
                <line x1="550" y1="90" x2="620" y2="90" stroke="#333" stroke-width="1"/>
                <line x1="640" y1="90" x2="680" y2="90" stroke="#333" stroke-width="1"/>
                <line x1="530" y1="180" x2="530" y2="270" stroke="#333" stroke-width="1"/>
                <line x1="620" y1="180" x2="620" y2="270" stroke="#333" stroke-width="1"/>
                <line x1="450" y1="270" x2="680" y2="270" stroke="#333" stroke-width="1"/>

                <line x1="480" y1="90" x2="520" y2="90" stroke="#1565c0" stroke-width="1.5"/>
                <polygon points="520,90 512,86 512,94" fill="#1565c0"/>
                <text x="490" y="80" font-size="11" fill="#1565c0">I_a</text>

                <text x="550" y="295" text-anchor="middle" font-size="13" fill="#c62828">R_总a = 5 Ω</text>

                <text x="50" y="325" font-size="14" fill="#333">受力平衡：m_a g = F_安a = B I_a L</text>
                <text x="50" y="361" font-size="14" fill="#333">电源电动势：ε_a = BLv_a，内阻 R_a = 3Ω</text>
                <text x="50" y="397" font-size="14" fill="#333">外电路并联：R_并 = (R·R_b)/(R+R_b) = (3×6)/(3+6) = 2Ω</text>
                <text x="50" y="433" font-size="14" fill="#333">总电阻：R_总a = R_a + R_并 = 3 + 2 = 5Ω，I_a = BLv_a / R_总a</text>
            </g>

            <!-- ========== 步骤3：速度比推导 ========== -->
            <g id="scene2-step3-group" display="none">
                <text x="200" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e7d32">状态①：b在磁场中</text>
                <text x="570" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#c62828">状态②：a在磁场中</text>

                <!-- 左侧小导轨图 -->
                <g transform="translate(60,90)">
                    <line x1="20" y1="0" x2="20" y2="100" stroke="#333" stroke-width="1.5"/>
                    <line x1="80" y1="0" x2="80" y2="100" stroke="#333" stroke-width="1.5"/>
                    <line x1="20" y1="0" x2="80" y2="0" stroke="#333" stroke-width="1"/>
                    <rect x="42" y="-8" width="16" height="8" fill="none" stroke="#8B4513" stroke-width="1"/>
                    <line x1="10" y1="40" x2="90" y2="40" stroke="#888" stroke-width="0.8" stroke-dasharray="3,3"/>
                    <line x1="10" y1="90" x2="90" y2="90" stroke="#888" stroke-width="0.8" stroke-dasharray="3,3"/>
                    <rect x="20" y="40" width="60" height="50" fill="url(#scene2-mag-pattern-small)" stroke="#888" stroke-width="0.8" stroke-dasharray="2,2"/>
                    <line x1="20" y1="65" x2="80" y2="65" stroke="#2e7d32" stroke-width="4"/>
                    <text x="85" y="68" font-size="9" fill="#2e7d32">b</text>
                </g>

                <!-- 左侧小电路图 -->
                <g transform="translate(200,90)">
                    <line x1="0" y1="10" x2="150" y2="10" stroke="#333" stroke-width="1"/>
                    <line x1="0" y1="90" x2="150" y2="90" stroke="#333" stroke-width="1"/>
                    <line x1="150" y1="10" x2="150" y2="90" stroke="#333" stroke-width="1"/>
                    <line x1="0" y1="20" x2="0" y2="35" stroke="#1565c0" stroke-width="1.5"/>
                    <line x1="-8" y1="35" x2="8" y2="35" stroke="#1565c0" stroke-width="1.5"/>
                    <line x1="-5" y1="42" x2="5" y2="42" stroke="#1565c0" stroke-width="1.5"/>
                    <line x1="-8" y1="49" x2="8" y2="49" stroke="#1565c0" stroke-width="1.5"/>
                    <line x1="0" y1="49" x2="0" y2="60" stroke="#1565c0" stroke-width="1.5"/>
                    <rect x="-8" y="65" width="16" height="25" fill="none" stroke="#2e7d32" stroke-width="1"/>
                    <rect x="55" y="30" width="14" height="25" fill="none" stroke="#8B4513" stroke-width="1"/>
                    <rect x="110" y="30" width="14" height="25" fill="none" stroke="#c62828" stroke-width="1"/>
                    <line x1="16" y1="10" x2="55" y2="10" stroke="#333" stroke-width="0.8"/>
                    <line x1="69" y1="10" x2="110" y2="10" stroke="#333" stroke-width="0.8"/>
                    <line x1="124" y1="10" x2="150" y2="10" stroke="#333" stroke-width="0.8"/>
                    <line x1="55" y1="55" x2="55" y2="90" stroke="#333" stroke-width="0.8"/>
                    <line x1="110" y1="55" x2="110" y2="90" stroke="#333" stroke-width="0.8"/>
                </g>

                <!-- 右侧小导轨图 -->
                <g transform="translate(430,90)">
                    <line x1="20" y1="0" x2="20" y2="100" stroke="#333" stroke-width="1.5"/>
                    <line x1="80" y1="0" x2="80" y2="100" stroke="#333" stroke-width="1.5"/>
                    <line x1="20" y1="0" x2="80" y2="0" stroke="#333" stroke-width="1"/>
                    <rect x="42" y="-8" width="16" height="8" fill="none" stroke="#8B4513" stroke-width="1"/>

    <script>
    (function() {
        var currentStep = 0;
        var totalSteps = 3;
        var stepNames = [
            "问题引入",
            "b棒在磁场中的受力与等效电路",
            "a棒在磁场中的受力与等效电路",
            "联立推导速度比"
        ];

        var btnPrev = document.getElementById("scene2-btn-prev");
        var btnNext = document.getElementById("scene2-btn-next");
        var stepIndicator = document.getElementById("scene2-step-indicator");
        var stepNameText = document.getElementById("scene2-step-name");

        var groups = [
            document.getElementById("scene2-step0-group"),
            document.getElementById("scene2-step1-group"),
            document.getElementById("scene2-step2-group"),
            document.getElementById("scene2-step3-group")
        ];

        function updateStep() {
            for (var i = 0; i < groups.length; i++) {
                groups[i].setAttribute("display", i === currentStep ? "block" : "none");
            }
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps);
            stepIndicator.textContent = "步骤 " + currentStep + " / " + totalSteps;
            stepNameText.textContent = stepNames[currentStep];
        }

        btnPrev.addEventListener("click", function() {
            if (currentStep > 0) { currentStep--; updateStep(); }
        });

        btnNext.addEventListener("click", function() {
            if (currentStep < totalSteps) { currentStep++; updateStep(); }
        });

        updateStep();
    })();
    </script>
