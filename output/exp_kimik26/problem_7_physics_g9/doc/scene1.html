<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浮力情境分析 - 场景1</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "SimHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            padding: 6px 16px; font-size: 14px; cursor: pointer;
            border: 1px solid #cccccc; border-radius: 4px; background: #f5f5f5;
            font-family: "Microsoft YaHei", "SimHei", sans-serif;
        }
        #scene1-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene1-controls button:disabled { background: #eeeeee; color: #aaaaaa; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 14px; color: #666666; min-width: 80px; text-align: center; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <defs>
                <!-- 箭头标记定义 -->
                <marker id="scene1-arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L10,5 L0,10 L2,5 Z" fill="#1565c0"/>
                </marker>
                <marker id="scene1-arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L10,5 L0,10 L2,5 Z" fill="#c62828"/>
                </marker>
                <marker id="scene1-arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L10,5 L0,10 L2,5 Z" fill="#2e7d32"/>
                </marker>
            </defs>

            <!-- ========== 基础结构（步骤0始终可见） ========== -->
            <!-- 左水面线 -->
            <line x1="120" y1="150" x2="280" y2="150" stroke="#000000" stroke-width="2"/>
            <!-- 左水面波浪装饰 -->
            <path d="M120,150 Q125,144 130,150 Q135,144 140,150 Q135,156 130,150 Q125,156 120,150" fill="none" stroke="#000000" stroke-width="1.5"/>
            <path d="M260,150 Q265,144 270,150 Q275,144 280,150 Q275,156 270,150 Q265,156 260,150" fill="none" stroke="#000000" stroke-width="1.5"/>

            <!-- 右水面线 -->
            <line x1="520" y1="150" x2="680" y2="150" stroke="#000000" stroke-width="2"/>
            <!-- 右水面波浪装饰 -->
            <path d="M520,150 Q525,144 530,150 Q535,144 540,150 Q535,156 530,150 Q525,156 520,150" fill="none" stroke="#000000" stroke-width="1.5"/>
            <path d="M660,150 Q665,144 670,150 Q675,144 680,150 Q675,156 670,150 Q665,156 660,150" fill="none" stroke="#000000" stroke-width="1.5"/>

            <!-- 左水下虚线 -->
            <g id="scene1-left-dashed">
                <line x1="120" y1="170" x2="280" y2="170" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
                <line x1="120" y1="190" x2="280" y2="190" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
                <line x1="120" y1="210" x2="280" y2="210" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
                <line x1="120" y1="230" x2="280" y2="230" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
                <line x1="120" y1="250" x2="280" y2="250" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
                <line x1="120" y1="270" x2="280" y2="270" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
                <line x1="120" y1="290" x2="280" y2="290" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
                <line x1="120" y1="310" x2="280" y2="310" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
                <line x1="120" y1="330" x2="280" y2="330" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
                <line x1="120" y1="350" x2="280" y2="350" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
            </g>

            <!-- 右水下虚线 -->
            <g id="scene1-right-dashed">
                <line x1="520" y1="170" x2="680" y2="170" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
                <line x1="520" y1="190" x2="680" y2="190" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
                <line x1="520" y1="210" x2="680" y2="210" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
                <line x1="520" y1="230" x2="680" y2="230" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
                <line x1="520" y1="250" x2="680" y2="250" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
                <line x1="520" y1="270" x2="680" y2="270" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
                <line x1="520" y1="290" x2="680" y2="290" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
                <line x1="520" y1="310" x2="680" y2="310" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
                <line x1="520" y1="330" x2="680" y2="330" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
                <line x1="520" y1="350" x2="680" y2="350" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
            </g>

            <!-- 左图物块甲 -->
            <rect id="scene1-block-jia-left" x="160" y="150" width="80" height="60" fill="#e3f2fd" fill-opacity="0.15" stroke="#000000" stroke-width="2" rx="2"/>
            <!-- 左图物块乙 -->
            <rect id="scene1-block-yi" x="175" y="240" width="50" height="40" fill="#ffebee" fill-opacity="0.15" stroke="#000000" stroke-width="2" rx="2"/>
            <!-- 绳子 -->
            <line id="scene1-rope" x1="200" y1="210" x2="200" y2="240" stroke="#888888" stroke-width="2"/>

            <!-- 右图物块甲 -->
            <rect id="scene1-block-jia-right" x="560" y="150" width="80" height="60" fill="#e3f2fd" fill-opacity="0.15" stroke="#000000" stroke-width="2" rx="2"/>
            <!-- 右图物块丙 -->
            <rect id="scene1-block-bing" x="575" y="110" width="50" height="40" fill="#e8f5e9" fill-opacity="0.15" stroke="#000000" stroke-width="2" rx="2"/>

            <!-- 物块标签（移至物块外侧避免重叠） -->
            <text x="110" y="183" text-anchor="start" font-size="14" font-weight="bold" fill="#000000">甲</text>
            <text x="240" y="275" text-anchor="start" font-size="14" font-weight="bold" fill="#000000">乙</text>
            <text x="510" y="183" text-anchor="start" font-size="14" font-weight="bold" fill="#000000">甲</text>
            <text x="560" y="100" text-anchor="start" font-size="14" font-weight="bold" fill="#000000">丙</text>

            <!-- 水面标签 -->
            <text x="290" y="148" text-anchor="start" font-size="14" font-weight="bold" fill="#000000">水面</text>
            <text x="690" y="148" text-anchor="start" font-size="14" font-weight="bold" fill="#000000">水面</text>

            <!-- ========== 步骤1：高亮排水体积 ========== -->
            <g id="scene1-step1" style="display:none; opacity:0;">
                <!-- 左甲高亮 -->
                <rect x="160" y="150" width="80" height="60" fill="#1565c0" fill-opacity="0.2" stroke="none" rx="2"/>
                <!-- 右甲高亮 -->
                <rect x="560" y="150" width="80" height="60" fill="#1565c0" fill-opacity="0.2" stroke="none" rx="2"/>
                <!-- V_排=V_甲 标签（移至物块左上方避免与"水面"重叠） -->
                <text x="70" y="140" text-anchor="start" font-size="14" fill="#1565c0" font-weight="bold">V_排 = V_甲</text>
                <text x="450" y="140" text-anchor="start" font-size="14" fill="#1565c0" font-weight="bold">V_排 = V_甲</text>
            </g>

            <!-- ========== 步骤2：左图隔离受力分析 ========== -->
            <g id="scene1-step2" style="display:none; opacity:0;">
                <!-- 甲受力：F_甲1 向上 -->
                <line x1="200" y1="180" x2="200" y2="110" stroke="#1565c0" stroke-width="3" marker-end="url(#scene1-arrow-blue)"/>
                <text x="90" y="100" text-anchor="start" font-size="14" fill="#1565c0" font-weight="bold">F_甲1</text>
                <!-- 甲受力：G_甲 向下 -->
                <line x1="175" y1="180" x2="175" y2="230" stroke="#c62828" stroke-width="3" marker-end="url(#scene1-arrow-red)"/>
                <text x="130" y="250" text-anchor="start" font-size="14" fill="#c62828" font-weight="bold">G_甲</text>
                <!-- 甲受力：T 向下 -->
                <line x1="225" y1="180" x2="225" y2="210" stroke="#2e7d32" stroke-width="3" marker-end="url(#scene1-arrow-green)"/>
                <text x="255" y="200" text-anchor="start" font-size="14" fill="#2e7d32" font-weight="bold">T</text>

                <!-- 乙受力：F_乙 向上 -->
                <line x1="200" y1="260" x2="200" y2="220" stroke="#1565c0" stroke-width="3" marker-end="url(#scene1-arrow-blue)"/>
                <text x="100" y="215" text-anchor="start" font-size="14" fill="#1565c0" font-weight="bold">F_乙</text>
                <!-- 乙受力：G_乙 向下 -->
                <line x1="175" y1="260" x2="175" y2="300" stroke="#c62828" stroke-width="3" marker-end="url(#scene1-arrow-red)"/>
                <text x="130" y="320" text-anchor="start" font-size="14" fill="#c62828" font-weight="bold">G_乙</text>
                <!-- 乙受力：T 向上 -->
                <line x1="225" y1="260" x2="225" y2="230" stroke="#2e7d32" stroke-width="3" marker-end="url(#scene1-arrow-green)"/>
                <text x="265" y="235" text-anchor="start" font-size="14" fill="#2e7d32" font-weight="bold">T</text>
            </g>

            <!-- ========== 步骤3：右图隔离受力分析 ========== -->
            <g id="scene1-step3" style="display:none; opacity:0;">
                <!-- 甲受力：F_甲2 向上 -->
                <line x1="600" y1="180" x2="600" y2="110" stroke="#1565c0" stroke-width="3" marker-end="url(#scene1-arrow-blue)"/>
                <text x="450" y="90" text-anchor="start" font-size="14" fill="#1565c0" font-weight="bold">F_甲2</text>
                <!-- 甲受力：G_甲 向下 -->
                <line x1="575" y1="180" x2="575" y2="230" stroke="#c62828" stroke-width="3" marker-end="url(#scene1-arrow-red)"/>
                <text x="530" y="250" text-anchor="start" font-size="14" fill="#c62828" font-weight="bold">G_甲</text>
                <!-- 甲受力：N 向下（丙对甲的压力） -->
                <line x1="625" y1="180" x2="625" y2="210" stroke="#2e7d32" stroke-width="3" marker-end="url(#scene1-arrow-green)"/>
                <text x="655" y="200" text-anchor="start" font-size="14" fill="#2e7d32" font-weight="bold">N</text>

                <!-- 丙受力：G_丙 向下 -->
                <line x1="590" y1="130" x2="590" y2="170" stroke="#c62828" stroke-width="3" marker-end="url(#scene1-arrow-red)"/>
                <text x="450" y="195" text-anchor="start" font-size="14" fill="#c62828" font-weight="bold">G_丙</text>
                <!-- 丙受力：N 向上（甲对丙的支持力） -->
                <line x1="610" y1="150" x2="610" y2="120" stroke="#2e7d32" stroke-width="3" marker-end="url(#scene1-arrow-green)"/>
                <text x="655" y="95" text-anchor="start" font-size="14" fill="#2e7d32" font-weight="bold">N</text>
            </g>

            <!-- ========== 步骤4：浮力对比与结论 ========== -->
            <g id="scene1-step4" style="display:none; opacity:0;">
                <!-- 左图公式 -->
                <text x="200" y="360" text-anchor="middle" font-size="16" fill="#1565c0" font-weight="bold">F_甲1 = ρ_水·g·V_甲</text>
                <!-- 右图公式 -->
                <text x="600" y="360" text-anchor="middle" font-size="16" fill="#1565c0" font-weight="bold">F_甲2 = ρ_水·g·V_甲</text>
                <!-- 中间结论 -->
                <text x="400" y="390" text-anchor="middle" font-size="18" fill="#000000" font-weight="bold">∴ F_甲1 = F_甲2</text>
                <!-- 判定 -->
                <text x="400" y="430" text-anchor="middle" font-size="16" fill="#2e7d32" font-weight="bold">选项A正确</text>
            </g>
        </svg>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/5</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        let currentStep = 0;
        const totalSteps = 5; // 步骤0~4

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const indicator = document.getElementById('scene1-step-indicator');

        // 获取所有步骤组
        const stepGroups = [];
        for (let i = 1; i <= 4; i++) {
            stepGroups.push(document.getElementById('scene1-step' + i));
        }

        function updateStep(newStep) {
            if (newStep < 0 || newStep >= totalSteps) return;
            currentStep = newStep;

            // 更新步骤组显隐
            for (let i = 0; i < stepGroups.length; i++) {
                if (stepGroups[i]) {
                    if (i + 1 <= currentStep) {
                        stepGroups[i].style.display = 'block';
                        stepGroups[i].style.opacity = '1';
                    } else {
                        stepGroups[i].style.display = 'none';
                        stepGroups[i].style.opacity = '0';
                    }
                }
            }

            // 更新指示器
            indicator.textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;

            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps - 1);
            if (currentStep === totalSteps - 1) {
                btnNext.textContent = '完成';
            } else {
                btnNext.textContent = '下一步 ▶';
            }
        }

        btnPrev.addEventListener('click', function() {
            updateStep(currentStep - 1);
        });

        btnNext.addEventListener('click', function() {
            updateStep(currentStep + 1);
        });

        // 初始化
        updateStep(0);
    })();
    </script>
</body>
</html>
