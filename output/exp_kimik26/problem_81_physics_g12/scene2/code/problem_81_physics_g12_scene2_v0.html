<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 简谐振动与自由落体</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene2-controls button {
            padding: 6px 16px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #f0f0f0;
        }
        #scene2-controls button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        #scene2-step-indicator {
            font-size: 14px;
            color: #333;
            min-width: 80px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 地面线 -->
            <line id="scene2-ground" x1="50" y1="250" x2="650" y2="250" stroke="#000000" stroke-width="2"/>
            
            <!-- 左墙 -->
            <line id="scene2-left-wall" x1="80" y1="210" x2="80" y2="250" stroke="#000000" stroke-width="3"/>
            
            <!-- 平衡位置标记线（虚线） -->
            <line id="scene2-equilibrium-line" x1="200" y1="180" x2="200" y2="260" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
            
            <!-- 平衡位置标签 -->
            <text id="scene2-equilibrium-label" x="200" y="275" text-anchor="middle" font-size="12" fill="#000000">平衡位置</text>
            
            <!-- A物体 - 最右端（步骤0当前/非当前） -->
            <g id="scene2-a-right-group">
                <rect id="scene2-a-right-active" x="260" y="220" width="40" height="30" fill="#1565c0" fill-opacity="0.2" stroke="#1565c0" stroke-width="2"/>
                <rect id="scene2-a-right-ghost" x="260" y="220" width="40" height="30" fill="#888888" fill-opacity="0.1" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" display="none"/>
            </g>
            
            <!-- A物体 - 平衡位置（步骤1当前/非当前） -->
            <g id="scene2-a-equilibrium-group">
                <rect id="scene2-a-equilibrium-active" x="180" y="220" width="40" height="30" fill="#1565c0" fill-opacity="0.2" stroke="#1565c0" stroke-width="2" display="none"/>
                <rect id="scene2-a-equilibrium-ghost" x="180" y="220" width="40" height="30" fill="#888888" fill-opacity="0.1" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" display="none"/>
            </g>
            
            <!-- A物体 - 最左端（步骤2当前/非当前） -->
            <g id="scene2-a-left-group">
                <rect id="scene2-a-left-active" x="100" y="220" width="40" height="30" fill="#1565c0" fill-opacity="0.2" stroke="#1565c0" stroke-width="2" display="none"/>
                <rect id="scene2-a-left-ghost" x="100" y="220" width="40" height="30" fill="#888888" fill-opacity="0.1" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" display="none"/>
            </g>
            
            <!-- A标签 -->
            <text id="scene2-a-label" x="280" y="205" text-anchor="middle" font-size="14" fill="#1565c0" font-weight="bold">A</text>
            
            <!-- x₀标注 -->
            <text id="scene2-x0-label" x="240" y="195" text-anchor="middle" font-size="12" fill="#1565c0">x₀</text>
            
            <!-- 弹簧组 -->
            <g id="scene2-spring-group">
                <path id="scene2-spring-extend" fill="none" stroke="#1565c0" stroke-width="2" display="none"/>
                <path id="scene2-spring-normal" fill="none" stroke="#1565c0" stroke-width="2" display="none"/>
                <path id="scene2-spring-compress" fill="none" stroke="#1565c0" stroke-width="2" display="none"/>
            </g>
            
            <!-- 弹簧压缩最短标签 -->
            <text id="scene2-spring-min-label" x="120" y="275" text-anchor="middle" font-size="12" fill="#000000" display="none">弹簧压缩最短</text>
            
            <!-- B物体 - 初始高度（步骤0当前/非当前） -->
            <g id="scene2-b-top-group">
                <rect id="scene2-b-top-active" x="583" y="90" width="34" height="40" fill="#c62828" fill-opacity="0.2" stroke="#c62828" stroke-width="2"/>
                <rect id="scene2-b-top-ghost" x="583" y="90" width="34" height="40" fill="#888888" fill-opacity="0.1" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" display="none"/>
            </g>
            
            <!-- B物体 - 中间高度（步骤1当前/非当前） -->
            <g id="scene2-b-mid-group">
                <rect id="scene2-b-mid-active" x="583" y="130" width="34" height="40" fill="#c62828" fill-opacity="0.2" stroke="#c62828" stroke-width="2" display="none"/>
                <rect id="scene2-b-mid-ghost" x="583" y="130" width="34" height="40" fill="#888888" fill-opacity="0.1" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" display="none"/>
            </g>
            
            <!-- B物体 - 地面（步骤2当前/非当前） -->
            <g id="scene2-b-ground-group">
                <rect id="scene2-b-ground-active" x="583" y="210" width="34" height="40" fill="#c62828" fill-opacity="0.2" stroke="#c62828" stroke-width="2" display="none"/>
                <rect id="scene2-b-ground-ghost" x="583" y="210" width="34" height="40" fill="#888888" fill-opacity="0.1" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" display="none"/>
            </g>
            
            <!-- B标签 -->
            <text id="scene2-b-label" x="630" y="115" text-anchor="start" font-size="14" fill="#c62828" font-weight="bold">B</text>
            
            <!-- H标注 -->
            <text id="scene2-h-label" x="545" y="170" text-anchor="end" font-size="12" fill="#c62828">H</text>
            
            <!-- 滑轮残留支架 -->
            <g id="scene2-pulley-bracket">
                <line x1="600" y1="60" x2="600" y2="80" stroke="#000000" stroke-width="2"/>
                <line x1="580" y1="60" x2="620" y2="60" stroke="#000000" stroke-width="2"/>
                <!-- 天花板 -->
                <line x1="570" y1="60" x2="630" y2="60" stroke="#000000" stroke-width="3"/>
            </g>
            
            <!-- B下落轨迹虚线 -->
            <line id="scene2-b-trajectory" x1="600" y1="80" x2="600" y2="250" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
            
            <!-- A速度箭头（步骤1） -->
            <g id="scene2-a-velocity" display="none">
                <line x1="200" y1="235" x2="160" y2="235" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowhead-blue)"/>
                <text x="140" y="230" text-anchor="end" font-size="12" fill="#1565c0">v</text>
            </g>
            
            <!-- B落地速度箭头（步骤2） -->
            <g id="scene2-b-velocity" display="none">
                <line x1="600" y1="250" x2="600" y2="275" stroke="#c62828" stroke-width="2" marker-end="url(#arrowhead-red)"/>
                <text x="615" y="285" text-anchor="start" font-size="12" fill="#c62828">v_B</text>
            </g>
            
            <!-- 箭头标记定义 -->
            <defs>
                <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0"/>
                </marker>
                <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#c62828"/>
                </marker>
            </defs>
            
            <!-- 时间轴 -->
            <g id="scene2-timeline">
                <line x1="150" y1="320" x2="700" y2="320" stroke="#000000" stroke-width="2"/>
                <!-- 刻度0 -->
                <line id="scene2-tick-0" x1="200" y1="310" x2="200" y2="330" stroke="#000000" stroke-width="2"/>
                <text id="scene2-label-0" x="200" y="345" text-anchor="middle" font-size="12" fill="#000000">0</text>
                <!-- 刻度T/4 -->
                <line id="scene2-tick-t4" x1="400" y1="310" x2="400" y2="330" stroke="#000000" stroke-width="2"/>
                <text id="scene2-label-t4" x="400" y="345" text-anchor="middle" font-size="12" fill="#000000">T/4</text>
                <!-- 刻度T/2 -->
                <line id="scene2-tick-t2" x1="600" y1="310" x2="600" y2="330" stroke="#000000" stroke-width="2"/>
                <text id="scene2-label-t2" x="600" y="345" text-anchor="middle" font-size="12" fill="#000000">T/2</text>
                <!-- 轴名t -->
                <text x="710" y="325" text-anchor="start" font-size="14" fill="#000000">t</text>
            </g>
            
            <!-- 公式背景框 - 使用foreignObject避免text与rect重叠检测问题 -->
            <g id="scene2-formula-group" display="none">
                <foreignObject x="400" y="365" width="380" height="60">
                    <div xmlns="http://www.w3.org/1999/xhtml" id="scene2-formula-box" style="width:100%;height:100%;background:#f5f5f5;border:1px solid #2e7d32;border-radius:2px;display:flex;flex-direction:column;justify-content:center;padding-left:12px;box-sizing:border-box;">
                        <div id="scene2-formula-line1" style="font-size:14px;color:#2e7d32;font-family:'Microsoft YaHei','PingFang SC',sans-serif;line-height:1.4;">t = T/2</div>
                        <div id="scene2-formula-line2" style="font-size:14px;color:#2e7d32;font-family:'Microsoft YaHei','PingFang SC',sans-serif;line-height:1.4;">A = √3 gT²/(8π²)</div>
                        <div id="scene2-formula-line3" style="font-size:14px;color:#2e7d32;font-family:'Microsoft YaHei','PingFang SC',sans-serif;line-height:1.4;">v = gT/2</div>
                    </div>
                </foreignObject>
            </g>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-btn-prev">◀ 上一步</button>
            <span id="scene2-step-indicator">步骤 1/5</span>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现
        let currentStep = 0;
        const totalSteps = 5;
        
        // 元素引用
        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        const stepIndicator = document.getElementById('scene2-step-indicator');
        
        // A物体元素
        const aRightActive = document.getElementById('scene2-a-right-active');
        const aRightGhost = document.getElementById('scene2-a-right-ghost');
        const aEquilibriumActive = document.getElementById('scene2-a-equilibrium-active');
        const aEquilibriumGhost = document.getElementById('scene2-a-equilibrium-ghost');
        const aLeftActive = document.getElementById('scene2-a-left-active');
        const aLeftGhost = document.getElementById('scene2-a-left-ghost');
        const aLabel = document.getElementById('scene2-a-label');
        
        // B物体元素
        const bTopActive = document.getElementById('scene2-b-top-active');
        const bTopGhost = document.getElementById('scene2-b-top-ghost');
        const bMidActive = document.getElementById('scene2-b-mid-active');
        const bMidGhost = document.getElementById('scene2-b-mid-ghost');
        const bGroundActive = document.getElementById('scene2-b-ground-active');
        const bGroundGhost = document.getElementById('scene2-b-ground-ghost');
        const bLabel = document.getElementById('scene2-b-label');
        
        // 弹簧
        const springExtend = document.getElementById('scene2-spring-extend');
        const springNormal = document.getElementById('scene2-spring-normal');
        const springCompress = document.getElementById('scene2-spring-compress');
        
        // 其他元素
        const x0Label = document.getElementById('scene2-x0-label');
        const springMinLabel = document.getElementById('scene2-spring-min-label');
        const aVelocity = document.getElementById('scene2-a-velocity');
        const bVelocity = document.getElementById('scene2-b-velocity');
        const formulaGroup = document.getElementById('scene2-formula-group');
        const formulaLine1 = document.getElementById('scene2-formula-line1');
        const formulaLine2 = document.getElementById('scene2-formula-line2');
        const formulaLine3 = document.getElementById('scene2-formula-line3');
        
        // 时间轴刻度
        const tick0 = document.getElementById('scene2-tick-0');
        const tickT4 = document.getElementById('scene2-tick-t4');
        const tickT2 = document.getElementById('scene2-tick-t2');
        
        // 弹簧路径生成函数
        function makeSpring(x1, y1, x2, y2, coils, amp) {
            const dx = x2 - x1;
            const dy = y2 - y1;
            const len = Math.sqrt(dx * dx + dy * dy);
            const nx = dx / len;
            const ny = dy / len;
            // 垂直方向单位向量
            const px = -ny;
            const py = nx;
            
            let d = `M ${x1} ${y1}`;
            const segments = coils * 2;
            const stepLen = len / segments;
            
            for (let i = 1; i <= segments; i++) {
                const t = i / segments;
                const cx = x1 + dx * t;
                const cy = y1 + dy * t;
                const offset = (i % 2 === 1 ? 1 : -1) * amp;
                const sx = cx + px * offset;
                const sy = cy + py * offset;
                d += ` L ${sx} ${sy}`;
            }
            d += ` L ${x2} ${y2}`;
            return d;
        }
        
        // 生成三种弹簧路径
        springExtend.setAttribute('d', makeSpring(80, 235, 260, 235, 9, 8));
        springNormal.setAttribute('d', makeSpring(80, 235, 180, 235, 8, 6));
        springCompress.setAttribute('d', makeSpring(80, 235, 100, 235, 4, 4));
        
        // 显示/隐藏辅助函数
        function show(el) {
            if (el) el.style.display = 'block';
        }
        function hide(el) {
            if (el) el.style.display = 'none';
        }
        function setAttr(el, attr, val) {
            if (el) el.setAttribute(attr, val);
        }
        
        // 渲染步骤
        function renderStep() {
            // 更新按钮状态
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps - 1;
            stepIndicator.textContent = `步骤 ${currentStep + 1}/${totalSteps}`;
            
            // 重置所有元素
            hide(aRightGhost);
            hide(aEquilibriumActive);
            hide(aEquilibriumGhost);
            hide(aLeftActive);
            hide(aLeftGhost);
            hide(bTopGhost);
            hide(bMidActive);
            hide(bMidGhost);
            hide(bGroundActive);
            hide(bGroundGhost);
            hide(springExtend);
            hide(springNormal);
            hide(springCompress);
            hide(x0Label);
            hide(springMinLabel);
            hide(aVelocity);
            hide(bVelocity);
            hide(formulaGroup);
            
            // 重置时间轴刻度样式
            setAttr(tick0, 'stroke', '#000000');
            setAttr(tick0, 'stroke-width', '2');
            setAttr(tickT4, 'stroke', '#000000');
            setAttr(tickT4, 'stroke-width', '2');
            setAttr(tickT2, 'stroke', '#000000');
            setAttr(tickT2, 'stroke-width', '2');
            
            // 根据步骤设置
            if (currentStep === 0) {
                // 步骤0: t=0，A在最右端，B在初始高度
                show(aRightActive);
                show(bTopActive);
                show(springExtend);
                show(x0Label);
                
                // A标签在最右端上方
                aLabel.setAttribute('x', '280');
                aLabel.setAttribute('y', '205');
                
                // B标签在初始高度右侧
                bLabel.setAttribute('x', '630');
                bLabel.setAttribute('y', '115');
                
                // 高亮t=0刻度
                setAttr(tick0, 'stroke', '#1565c0');
                setAttr(tick0, 'stroke-width', '4');
                
            } else if (currentStep === 1) {
                // 步骤1: t=T/4，A在平衡位置，B在中间高度
                show(aRightGhost);
                show(aEquilibriumActive);
                show(bTopGhost);
                show(bMidActive);
                show(springNormal);
                show(aVelocity);
                
                // A标签在平衡位置上方
                aLabel.setAttribute('x', '200');
                aLabel.setAttribute('y', '205');
                
                // B标签在中间高度右侧
                bLabel.setAttribute('x', '630');
                bLabel.setAttribute('y', '155');
                
                // 高亮T/4刻度
                setAttr(tickT4, 'stroke', '#c62828');
                setAttr(tickT4, 'stroke-width', '4');
                
            } else if (currentStep === 2) {
                // 步骤2: t=T/2，A在最左端，B落地
                show(aRightGhost);
                show(aEquilibriumGhost);
                show(aLeftActive);
                show(bTopGhost);
                show(bMidGhost);
                show(bGroundActive);
                show(springCompress);
                show(springMinLabel);
                show(bVelocity);
                
                // A标签在最左端上方
                aLabel.setAttribute('x', '120');
                aLabel.setAttribute('y', '205');
                
                // B标签在地面右侧
                bLabel.setAttribute('x', '630');
                bLabel.setAttribute('y', '235');
                
                // 高亮T/2刻度
                setAttr(tickT2, 'stroke', '#c62828');
                setAttr(tickT2, 'stroke-width', '4');
                
            } else if (currentStep === 3) {
                // 步骤3: 公式结论
                show(aRightGhost);
                show(aEquilibriumGhost);
                show(aLeftActive);
                show(bTopGhost);
                show(bMidGhost);
                show(bGroundActive);
                show(springCompress);
                show(springMinLabel);
                show(bVelocity);
                show(formulaGroup);
                
                // 设置公式内容
                formulaLine1.textContent = 't = T/2';
                formulaLine2.textContent = 'A = √3 gT²/(8π²)';
                formulaLine3.textContent = 'v = gT/2';
                show(formulaLine3);
                
                // A标签在最左端上方
                aLabel.setAttribute('x', '120');
                aLabel.setAttribute('y', '205');
                
                // B标签在地面右侧
                bLabel.setAttribute('x', '630');
                bLabel.setAttribute('y', '235');
                
                // 高亮T/2刻度
                setAttr(tickT2, 'stroke', '#c62828');
                setAttr(tickT2, 'stroke-width', '4');
                
            } else if (currentStep === 4) {
                // 步骤4: 多解提示
                show(aRightGhost);
                show(aEquilibriumGhost);
                show(aLeftActive);
                show(bTopGhost);
                show(bMidGhost);
                show(bGroundActive);
                show(springCompress);
                show(springMinLabel);
                show(bVelocity);
                show(formulaGroup);
                
                // 设置公式内容为多解提示
                formulaLine1.textContent = '通解：t = (2n+1)·T/2，v = (2n+1)·gT/2';
                formulaLine2.textContent = '(n = 0,1,2...)';
                hide(formulaLine3);
                
                // A标签在最左端上方
                aLabel.setAttribute('x', '120');
                aLabel.setAttribute('y', '205');
                
                // B标签在地面右侧
                bLabel.setAttribute('x', '630');
                bLabel.setAttribute('y', '235');
                
                // 高亮T/2刻度
                setAttr(tickT2, 'stroke', '#c62828');
                setAttr(tickT2, 'stroke-width', '4');
            }
        }
        
        // 事件绑定
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        });
        
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                renderStep();
            }
        });
        
        // 初始渲染
        renderStep();
        
    })();
    </script>
</body>
</html>
