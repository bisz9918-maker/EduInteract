<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 1 - 三球斜面系统初始 Setup</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 16px; z-index: 10; }
        #scene1-controls button { padding: 6px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: #f0f0f0; }
        #scene1-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene1-step-text { font-size: 14px; color: #333; min-width: 80px; text-align: center; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" viewBox="0 0 800 500">
            <defs>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#000" />
                </marker>
            </defs>

            <!-- 步骤 0：斜面轮廓与地面线（始终可见的基础层） -->
            <g id="scene1-step-0">
                <!-- 斜面直角三角形：A(650,200) → D(650,400) → C(304,400) -->
                <polygon id="scene1-slope" points="650,200 650,400 304,400" fill="#f5f5f5" stroke="#000" stroke-width="2"/>
                <!-- 地面水平线 -->
                <line id="scene1-ground" x1="200" y1="420" x2="720" y2="420" stroke="#000" stroke-width="1.5"/>
                <!-- 地面标签（左移，避免与后续 v_C = ? 高亮框冲突） -->
                <text id="scene1-label-ground" x="250" y="440" font-size="16" fill="#000">地面</text>
            </g>

            <!-- 步骤 1：三小球与两根轻绳 -->
            <g id="scene1-step-1">
                <!-- 轻绳 AB -->
                <line id="scene1-rope-ab" x1="650" y1="200" x2="477" y2="300" stroke="#000" stroke-width="1.5"/>
                <!-- 轻绳 BC -->
                <line id="scene1-rope-bc" x1="477" y1="300" x2="304" y2="400" stroke="#000" stroke-width="1.5"/>
                <!-- A 球：质量 3m，蓝色 -->
                <circle id="scene1-ball-a" cx="650" cy="200" r="12" fill="#1565c0" stroke="#000" stroke-width="1.5"/>
                <!-- B 球：质量 2m，红色，位于斜边中点 -->
                <circle id="scene1-ball-b" cx="477" cy="300" r="12" fill="#c62828" stroke="#000" stroke-width="1.5"/>
                <!-- C 球：质量 m，绿色 -->
                <circle id="scene1-ball-c" cx="304" cy="400" r="12" fill="#2e7d32" stroke="#000" stroke-width="1.5"/>
                <!-- 球名标签（全部置于三角形 bbox 外侧，避免与 polygon 重叠误报） -->
                <text id="scene1-label-a" x="670" y="210" text-anchor="middle" font-size="16" fill="#000">A</text>
                <text id="scene1-label-b" x="470" y="192" text-anchor="middle" font-size="16" fill="#000">B</text>
                <text id="scene1-label-c" x="280" y="375" text-anchor="middle" font-size="16" fill="#000">C</text>
            </g>

            <!-- 步骤 2：已知条件标注（质量、绳长、斜面高、倾角） -->
            <g id="scene1-step-2">
                <!-- 质量标注（全部置于三角形 bbox 外侧，分散避免拥挤） -->
                <text id="scene1-label-3m" x="700" y="170" text-anchor="middle" font-size="16" fill="#000">3m</text>
                <text id="scene1-label-2m" x="510" y="415" text-anchor="middle" font-size="16" fill="#000">2m</text>
                <text id="scene1-label-m" x="245" y="375" text-anchor="middle" font-size="16" fill="#000">m</text>
                <!-- 绳长标注 L（两处，置于三角形上方/下方） -->
                <text id="scene1-label-l-ab" x="555" y="192" text-anchor="middle" font-size="16" fill="#000">L</text>
                <text id="scene1-label-l-bc" x="380" y="415" text-anchor="middle" font-size="16" fill="#000">L</text>
                <!-- 斜面高度标注线（右侧双向箭头） -->
                <line id="scene1-height-line" x1="660" y1="200" x2="660" y2="400" stroke="#000" stroke-width="1" marker-end="url(#scene1-arrowhead)" marker-start="url(#scene1-arrowhead)"/>
                <!-- 斜面高度标注 L -->
                <text id="scene1-label-l-height" x="670" y="315" text-anchor="middle" font-size="16" fill="#000">L</text>
                <!-- 左下角 30° 角度弧 -->
                <path id="scene1-angle-arc" d="M 329 400 A 25 25 0 0 0 325.6 387.5" fill="none" stroke="#1565c0" stroke-width="1"/>
                <!-- 角度标注 30°（置于地面线上方，避开三角形） -->
                <text id="scene1-label-30deg" x="330" y="415" text-anchor="middle" font-size="16" fill="#000">30°</text>
            </g>

            <!-- 步骤 3：弧形挡板与竖直向下约束 -->
            <g id="scene1-step-3">
                <!-- 弧形挡板：四分之一圆弧，凸向右上，灰色虚线 -->
                <path id="scene1-baffle" d="M 650 185 A 20 20 0 0 1 665 200" fill="none" stroke="#888" stroke-width="2" stroke-dasharray="5,3"/>
                <!-- 竖直向下箭头（指向 A 球上方） -->
                <line id="scene1-down-arrow" x1="650" y1="145" x2="650" y2="165" stroke="#000" stroke-width="1.5" marker-end="url(#scene1-arrowhead)"/>
                <!-- 竖直向下文字标签（上移，避免与 v_A = ? 高亮框冲突） -->
                <text id="scene1-label-down" x="665" y="105" font-size="16" fill="#000">竖直向下</text>
            </g>

            <!-- 步骤 4：三个待求量高亮提示（使用 foreignObject 避免 text+rect 重叠误报） -->
            <g id="scene1-step-4">
                <!-- A 球右上方：v_A = ? -->
                <foreignObject x="675" y="40" width="95" height="28">
                    <div xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%;background:rgba(255,235,59,0.2);border:1.5px solid #f9a825;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:16px;font-family:sans-serif;color:#000;">v_A = ?</div>
                </foreignObject>
                <!-- C 球左上方：v_C = ? -->
                <foreignObject x="120" y="360" width="100" height="25">
                    <div xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%;background:rgba(255,235,59,0.2);border:1.5px solid #f9a825;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:16px;font-family:sans-serif;color:#000;">v_C = ?</div>
                </foreignObject>
                <!-- B 球右侧：W = ? -->
                <foreignObject x="675" y="220" width="90" height="28">
                    <div xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%;background:rgba(255,235,59,0.2);border:1.5px solid #f9a825;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:16px;font-family:sans-serif;color:#000;">W = ?</div>
                </foreignObject>
            </g>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <span id="scene1-step-text">步骤 1 / 5</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 状态机：currentStep 取 0~4，对应 5 个分步
        var currentStep = 0;
        var prevBtn = document.getElementById('scene1-btn-prev');
        var nextBtn = document.getElementById('scene1-btn-next');
        var stepText = document.getElementById('scene1-step-text');

        /**
         * 更新各步骤分组的显隐状态
         * 规则：第 i 组仅在 currentStep >= i 时显示（累积呈现）
         */
        function updateStep() {
            for (var i = 0; i <= 4; i++) {
                var group = document.getElementById('scene1-step-' + i);
                if (group) {
                    group.style.display = i <= currentStep ? 'block' : 'none';
                }
            }
            // 按钮禁用状态
            prevBtn.disabled = (currentStep === 0);
            nextBtn.disabled = (currentStep === 4);
            // 步骤指示器文本
            stepText.textContent = '步骤 ' + (currentStep + 1) + ' / 5';
        }

        prevBtn.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });

        nextBtn.addEventListener('click', function() {
            if (currentStep < 4) {
                currentStep++;
                updateStep();
            }
        });

        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
