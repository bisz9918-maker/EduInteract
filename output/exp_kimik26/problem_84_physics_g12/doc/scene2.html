<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 电磁感应导轨问题</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "SimHei", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        .scene2-btn {
            padding: 6px 18px; font-size: 14px; cursor: pointer;
            border: 1px solid #333; border-radius: 4px; background: #f5f5f5;
            font-family: "Microsoft YaHei", "SimHei", sans-serif;
        }
        .scene2-btn:hover:not(:disabled) { background: #e0e0e0; }
        .scene2-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene2-step-indicator { font-size: 13px; color: #555; min-width: 70px; text-align: center; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500">
            <!-- ==================== v-t 图像区 ==================== -->
            <!-- 坐标轴 -->
            <line id="scene2-vt-xaxis" x1="100" y1="195" x2="340" y2="195" stroke="#000" stroke-width="1.5"/>
            <line id="scene2-vt-yaxis" x1="100" y1="195" x2="100" y2="55" stroke="#000" stroke-width="1.5"/>
            <!-- 箭头 -->
            <polygon id="scene2-vt-xarrow" points="340,195 335,192 335,198" fill="#000"/>
            <polygon id="scene2-vt-yarrow" points="100,55 97,60 103,60" fill="#000"/>
            <!-- 渐近线 v=2m/s (y=83) -->
            <line id="scene2-vt-asymptote" x1="100" y1="83" x2="340" y2="83" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
            <!-- v-t 曲线下方面积填充 -->
            <path id="scene2-vt-area" d="M 80,195 L 106,132 L 132,99 L 158,89 L 184,86 L 340,86 L 340,195 Z" fill="#1565c0" fill-opacity="0.2" stroke="none"/>
            <!-- v-t 曲线 -->
            <path id="scene2-vt-curve" d="M 80,195 L 106,132 L 132,99 L 158,89 L 184,86 L 340,86" fill="none" stroke="#1565c0" stroke-width="2"/>
            <!-- 轴标签 -->
            <text id="scene2-vt-xlabel" x="360" y="198" font-size="13" fill="#000" text-anchor="middle">t/s</text>
            <text id="scene2-vt-ylabel" x="95" y="45" font-size="13" fill="#000" text-anchor="end">v/(m·s⁻¹)</text>
            <!-- 渐近线标注 -->
            <text id="scene2-vt-asym-label" x="350" y="78" font-size="12" fill="#1565c0" text-anchor="start">v=2m/s</text>
            <!-- x轴刻度 0~5 -->
            <text id="scene2-vt-t0" x="80" y="212" font-size="11" fill="#000" text-anchor="middle">0</text>
            <text id="scene2-vt-t1" x="132" y="212" font-size="11" fill="#000" text-anchor="middle">1</text>
            <text id="scene2-vt-t2" x="184" y="212" font-size="11" fill="#000" text-anchor="middle">2</text>
            <text id="scene2-vt-t3" x="236" y="212" font-size="11" fill="#000" text-anchor="middle">3</text>
            <text id="scene2-vt-t4" x="288" y="212" font-size="11" fill="#000" text-anchor="middle">4</text>
            <text id="scene2-vt-t5" x="340" y="212" font-size="11" fill="#000" text-anchor="middle">5</text>
            <!-- y轴刻度 1,2 -->
            <text id="scene2-vt-v1" x="72" y="138" font-size="11" fill="#000" text-anchor="end">1</text>
            <text id="scene2-vt-v2" x="72" y="78" font-size="11" fill="#000" text-anchor="end">2</text>

            <!-- ==================== 公式推导区 (无外框) ==================== -->
            <text id="scene2-formula-title" x="580" y="58" font-size="15" fill="#000" text-anchor="middle" font-weight="bold">电量求位移</text>
            <!-- 推导公式 -->
            <text id="scene2-formula-1" x="420" y="95" font-size="15" fill="#000" text-anchor="start">q = Ī·Δt</text>
            <text id="scene2-formula-2" x="420" y="132" font-size="15" fill="#000" text-anchor="start">q = ΔΦ/(R+r)</text>
            <text id="scene2-formula-3" x="420" y="170" font-size="15" fill="#000" text-anchor="start">q = BLx/(R+r)</text>
            <text id="scene2-formula-4" x="420" y="208" font-size="16" fill="#1565c0" text-anchor="start" font-weight="bold">x = q(R+r)/(BL) = 2.8 m</text>
            <!-- 参数 (无框, 30px spacing) -->
            <text id="scene2-param-1" x="710" y="95" font-size="11" fill="#000" text-anchor="middle">B = 1 T</text>
            <text id="scene2-param-2" x="710" y="125" font-size="11" fill="#000" text-anchor="middle">L = 1 m</text>
            <text id="scene2-param-3" x="710" y="155" font-size="11" fill="#000" text-anchor="middle">R = 0.8 Ω</text>
            <text id="scene2-param-4" x="710" y="185" font-size="11" fill="#000" text-anchor="middle">r = 0.2 Ω</text>
            <text id="scene2-param-5" x="710" y="215" font-size="11" fill="#000" text-anchor="middle">q = 2.8 C</text>

            <!-- ==================== 能量流向图区 (无外框, 文字着色) ==================== -->
            <text id="scene2-energy-title" x="400" y="228" font-size="15" fill="#000" text-anchor="middle" font-weight="bold">功能关系</text>
            <!-- 能量项 -->
            <text id="scene2-energy-fx-text" x="100" y="280" font-size="16" fill="#c62828" text-anchor="middle" font-weight="bold">Fx</text>
            <text id="scene2-energy-eq" x="170" y="280" font-size="18" fill="#000" text-anchor="middle">=</text>
            <text id="scene2-energy-ek-text" x="260" y="280" font-size="16" fill="#1565c0" text-anchor="middle" font-weight="bold">½mv²</text>
            <text id="scene2-energy-plus1" x="355" y="280" font-size="18" fill="#000" text-anchor="middle">+</text>
            <text id="scene2-energy-fr-text" x="420" y="280" font-size="16" fill="#2e7d32" text-anchor="middle" font-weight="bold">fx</text>
            <text id="scene2-energy-plus2" x="495" y="280" font-size="18" fill="#000" text-anchor="middle">+</text>
            <text id="scene2-energy-qt-text" x="590" y="280" font-size="16" fill="#c62828" text-anchor="middle" font-weight="bold">Q_total</text>
            <!-- 数值标签 -->
            <text id="scene2-energy-fx-val" x="100" y="320" font-size="14" fill="#c62828" text-anchor="middle" font-weight="bold">8.4 J</text>
            <text id="scene2-energy-ek-val" x="260" y="320" font-size="14" fill="#1565c0" text-anchor="middle" font-weight="bold">0.4 J</text>
            <text id="scene2-energy-fr-val" x="420" y="320" font-size="14" fill="#2e7d32" text-anchor="middle" font-weight="bold">2.8 J</text>
            <text id="scene2-energy-qt-val" x="590" y="320" font-size="14" fill="#c62828" text-anchor="middle" font-weight="bold">5.2 J</text>

            <!-- ==================== 热量分配区 (无外框) ==================== -->
            <text id="scene2-heat-title" x="400" y="358" font-size="15" fill="#000" text-anchor="middle" font-weight="bold">热量分配</text>
            <text id="scene2-heat-ratio" x="400" y="380" font-size="11" fill="#000" text-anchor="middle">Q_R : Q_r = R : r = 4 : 1</text>
            <!-- 数值在条形上方 -->
            <text id="scene2-heat-qr-val" x="300" y="410" font-size="13" fill="#c62828" text-anchor="middle" font-weight="bold">4.16 J</text>
            <text id="scene2-heat-qs-val" x="470" y="410" font-size="13" fill="#2e7d32" text-anchor="middle" font-weight="bold">1.04 J</text>
            <!-- Q_R 条形 -->
            <rect id="scene2-heat-qr-bar" x="180" y="417" width="240" height="16" fill="#c62828" rx="2"/>
            <!-- Q_r 条形 -->
            <rect id="scene2-heat-qs-bar" x="440" y="417" width="60" height="16" fill="#2e7d32" rx="2"/>
            <!-- 电阻标注在条形下方 -->
            <text id="scene2-heat-qr-label" x="300" y="445" font-size="12" fill="#000" text-anchor="middle">R = 0.8 Ω</text>
            <text id="scene2-heat-qs-label" x="470" y="445" font-size="12" fill="#000" text-anchor="middle">r = 0.2 Ω</text>
        </svg>

        <div id="scene2-controls">
            <button id="scene2-btn-prev" class="scene2-btn">◀ 上一步</button>
            <span id="scene2-step-indicator">步骤 1/5</span>
            <button id="scene2-btn-next" class="scene2-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2 实现
        var currentStep = 0;
        var totalSteps = 5;

        // 元素引用
        var btnPrev = document.getElementById('scene2-btn-prev');
        var btnNext = document.getElementById('scene2-btn-next');
        var stepIndicator = document.getElementById('scene2-step-indicator');

        // v-t 区域元素
        var vtElements = [
            'scene2-vt-xaxis','scene2-vt-yaxis','scene2-vt-xarrow','scene2-vt-yarrow',
            'scene2-vt-asymptote','scene2-vt-area','scene2-vt-curve',
            'scene2-vt-xlabel','scene2-vt-ylabel','scene2-vt-asym-label',
            'scene2-vt-t0','scene2-vt-t1','scene2-vt-t2','scene2-vt-t3','scene2-vt-t4','scene2-vt-t5',
            'scene2-vt-v1','scene2-vt-v2'
        ];

        // 公式推导区域元素
        var formulaElements = [
            'scene2-formula-title',
            'scene2-formula-1','scene2-formula-2','scene2-formula-3','scene2-formula-4',
            'scene2-param-1','scene2-param-2','scene2-param-3','scene2-param-4','scene2-param-5'
        ];

        // 能量流向图区域元素
        var energyElements = [
            'scene2-energy-title',
            'scene2-energy-fx-text','scene2-energy-eq',
            'scene2-energy-ek-text','scene2-energy-plus1',
            'scene2-energy-fr-text','scene2-energy-plus2',
            'scene2-energy-qt-text',
            'scene2-energy-fx-val','scene2-energy-ek-val','scene2-energy-fr-val','scene2-energy-qt-val'
        ];

        // 热量分配区域元素
        var heatElements = [
            'scene2-heat-title','scene2-heat-ratio',
            'scene2-heat-qr-bar','scene2-heat-qr-val','scene2-heat-qr-label',
            'scene2-heat-qs-bar','scene2-heat-qs-val','scene2-heat-qs-label'
        ];

        function setOpacity(ids, opacity) {
            ids.forEach(function(id) {
                var el = document.getElementById(id);
                if (el) el.setAttribute('opacity', opacity);
            });
        }

        function render() {
            // 更新步骤指示器
            stepIndicator.textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;

            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps - 1);

            // 根据步骤设置各区域透明度
            switch (currentStep) {
                case 0: // 运动图像
                    setOpacity(vtElements, 1.0);
                    setOpacity(formulaElements, 0.15);
                    setOpacity(energyElements, 0.15);
                    setOpacity(heatElements, 0.15);
                    break;
                case 1: // 电量求位移
                    setOpacity(vtElements, 0.25);
                    setOpacity(formulaElements, 1.0);
                    setOpacity(energyElements, 0.15);
                    setOpacity(heatElements, 0.15);
                    break;
                case 2: // 功能关系
                    setOpacity(vtElements, 0.25);
                    setOpacity(formulaElements, 0.25);
                    setOpacity(energyElements, 1.0);
                    // 隐藏数值标签
                    setOpacity(['scene2-energy-fx-val','scene2-energy-ek-val','scene2-energy-fr-val','scene2-energy-qt-val'], 0);
                    setOpacity(heatElements, 0.15);
                    break;
                case 3: // 总热量
                    setOpacity(vtElements, 0.25);
                    setOpacity(formulaElements, 0.25);
                    setOpacity(energyElements, 1.0);
                    // 显示数值标签
                    setOpacity(['scene2-energy-fx-val','scene2-energy-ek-val','scene2-energy-fr-val','scene2-energy-qt-val'], 1.0);
                    setOpacity(heatElements, 0.15);
                    break;
                case 4: // 热量分配
                    setOpacity(vtElements, 0.25);
                    setOpacity(formulaElements, 0.25);
                    setOpacity(energyElements, 0.25);
                    setOpacity(heatElements, 1.0);
                    break;
            }
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                render();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                render();
            }
        });

        // 初始渲染
        render();
    })();
    </script>
</body>
</html>
