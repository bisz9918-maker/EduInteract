<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 平行板电容器带电微粒运动</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        
        /* 控件样式 */
        .scene2-control-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 140px;
            background: rgba(255,255,255,0.95);
            border-top: 1px solid #e0e0e0;
            padding: 10px 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .scene2-slider-row {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
        }
        .scene2-slider-row label { font-weight: bold; min-width: 60px; }
        .scene2-slider-row input[type="range"] { width: 300px; }
        .scene2-slider-row .scene2-val { min-width: 50px; font-weight: bold; color: #1565c0; }
        .scene2-btn {
            padding: 6px 14px;
            font-size: 13px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #f5f5f5;
            cursor: pointer;
            transition: background 0.2s;
        }
        .scene2-btn:hover { background: #e0e0e0; }
        .scene2-btn.active { background: #1565c0; color: white; border-color: #1565c0; }
        
        .scene2-data-row {
            display: flex;
            gap: 30px;
            font-size: 13px;
            flex-wrap: wrap;
        }
        .scene2-data-item { display: flex; gap: 6px; }
        .scene2-data-item .label { color: #666; }
        .scene2-data-item .value { font-weight: bold; color: #333; }
        .scene2-status { font-weight: bold; }
        .scene2-status.ok { color: #2e7d32; }
        .scene2-status.fail { color: #c62828; }
        
        .scene2-const-row {
            font-size: 12px;
            color: #888;
            border-top: 1px solid #eee;
            padding-top: 6px;
            margin-top: 2px;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" style="display:block;">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene2-arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#c62828"/>
                </marker>
                <marker id="scene2-arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#1565c0"/>
                </marker>
                <marker id="scene2-arrow-black" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#000000"/>
                </marker>
            </defs>
            
            <!-- 右边界虚线 -->
            <line id="scene2-right-boundary" x1="700" y1="120" x2="700" y2="280" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
            
            <!-- 中位线（入射高度） -->
            <line id="scene2-midline" x1="100" y1="200" x2="700" y2="200" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
            
            <!-- 上极板 B -->
            <line id="scene2-plate-top" x1="100" y1="120" x2="700" y2="120" stroke="#000000" stroke-width="3"/>
            <!-- 下极板 A -->
            <line id="scene2-plate-bottom" x1="100" y1="280" x2="700" y2="280" stroke="#000000" stroke-width="3"/>
            
            <!-- 接地符号 -->
            <g id="scene2-ground">
                <line x1="80" y1="120" x2="80" y2="135" stroke="#000" stroke-width="2"/>
                <line x1="70" y1="135" x2="90" y2="135" stroke="#000" stroke-width="2"/>
                <line x1="73" y1="140" x2="87" y2="140" stroke="#000" stroke-width="1.5"/>
                <line x1="76" y1="145" x2="84" y2="145" stroke="#000" stroke-width="1"/>
            </g>
            
            <!-- 电场线 1~6 -->
            <g id="scene2-field-lines">
                <g class="scene2-field-line" data-x="150">
                    <line x1="150" y1="135" x2="150" y2="265" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="4,4"/>
                    <polygon points="150,130 146,140 154,140" fill="#1565c0"/>
                </g>
                <g class="scene2-field-line" data-x="250">
                    <line x1="250" y1="135" x2="250" y2="265" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="4,4"/>
                    <polygon points="250,130 246,140 254,140" fill="#1565c0"/>
                </g>
                <g class="scene2-field-line" data-x="350">
                    <line x1="350" y1="135" x2="350" y2="265" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="4,4"/>
                    <polygon points="350,130 346,140 354,140" fill="#1565c0"/>
                </g>
                <g class="scene2-field-line" data-x="450">
                    <line x1="450" y1="135" x2="450" y2="265" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="4,4"/>
                    <polygon points="450,130 446,140 454,140" fill="#1565c0"/>
                </g>
                <g class="scene2-field-line" data-x="550">
                    <line x1="550" y1="135" x2="550" y2="265" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="4,4"/>
                    <polygon points="550,130 546,140 554,140" fill="#1565c0"/>
                </g>
                <g class="scene2-field-line" data-x="650">
                    <line x1="650" y1="135" x2="650" y2="265" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="4,4"/>
                    <polygon points="650,130 646,140 654,140" fill="#1565c0"/>
                </g>
            </g>
            
            <!-- 出口提示区 -->
            <rect id="scene2-exit-zone" x="685" y="120" width="15" height="160" fill="#2e7d32" fill-opacity="0" stroke="none"/>
            
            <!-- O点标记 -->
            <circle id="scene2-point-o" cx="400" cy="280" r="3" fill="#000000"/>
            
            <!-- 入射微粒 -->
            <g id="scene2-particle">
                <circle cx="100" cy="200" r="4" fill="#1565c0" stroke="#000" stroke-width="1"/>
                <line x1="97" y1="200" x2="103" y2="200" stroke="#fff" stroke-width="1"/>
                <line x1="100" y1="197" x2="100" y2="203" stroke="#fff" stroke-width="1"/>
            </g>
            
            <!-- 轨迹 -->
            <path id="scene2-trajectory-main" d="" stroke="#1565c0" stroke-width="2" fill="none"/>
            <path id="scene2-trajectory-end" d="" stroke="#c62828" stroke-width="3" fill="none"/>
            
            <!-- 受力分析区 -->
            <g id="scene2-force-area">
                <!-- mg 箭头（恒向下）: x=620, y=55→90 -->
                <line id="scene2-force-mg" x1="620" y1="55" x2="620" y2="90" stroke="#c62828" stroke-width="2" marker-end="url(#scene2-arrow-red)"/>
                <!-- F_电箭头: 动态调整 -->
                <line id="scene2-force-electric" x1="650" y1="90" x2="650" y2="55" stroke="#1565c0" stroke-width="2" marker-end="url(#scene2-arrow-blue)"/>
                <!-- 平衡提示 -->
                <text id="scene2-balance-tip" x="640" y="125" font-size="12" fill="#f9a825" text-anchor="middle" opacity="0">a=0，重力与电场力平衡</text>
            </g>
            
            <!-- 标签 -->
            <!-- L 双向箭头 -->
            <line x1="100" y1="100" x2="700" y2="100" stroke="#000" stroke-width="1"/>
            <line x1="100" y1="96" x2="100" y2="104" stroke="#000" stroke-width="1"/>
            <line x1="700" y1="96" x2="700" y2="104" stroke="#000" stroke-width="1"/>
            <text x="400" y="90" font-size="16" fill="#000" text-anchor="middle">L</text>
            
            <!-- d 双向箭头 -->
            <line x1="715" y1="120" x2="715" y2="280" stroke="#000" stroke-width="1"/>
            <line x1="711" y1="120" x2="719" y2="120" stroke="#000" stroke-width="1"/>
            <line x1="711" y1="280" x2="719" y2="280" stroke="#000" stroke-width="1"/>
            <text x="730" y="205" font-size="16" fill="#000" text-anchor="start">d</text>
            
            <!-- 极板标签 -->
            <text x="80" y="115" font-size="16" fill="#000" text-anchor="middle">B</text>
            <text x="80" y="295" font-size="16" fill="#000" text-anchor="middle">A</text>
            
            <!-- 微粒标签 -->
            <text x="70" y="200" font-size="16" fill="#000" text-anchor="end" dominant-baseline="middle">v₀</text>
            <text x="70" y="225" font-size="14" fill="#000" text-anchor="end">m, q</text>
            
            <!-- O点标签 -->
            <text x="400" y="300" font-size="14" fill="#000" text-anchor="middle">O</text>
            
            <!-- 受力标签 -->
            <text id="scene2-label-mg" x="610" y="105" font-size="14" fill="#c62828" text-anchor="end">mg</text>
            <text id="scene2-label-Fe" x="660" y="45" font-size="14" fill="#1565c0" text-anchor="start">Fₑ</text>
            <text x="690" y="75" font-size="14" fill="#000" text-anchor="start">a</text>
        </svg>
        
        <!-- 控件面板 -->
        <div class="scene2-control-panel">
            <div class="scene2-slider-row">
                <label>φₐ</label>
                <input type="range" id="scene2-slider" min="-2" max="12" step="0.5" value="0">
                <span class="scene2-val" id="scene2-val-phi">0 V</span>
                <button class="scene2-btn" id="scene2-btn-crit1">临界1 (6V)</button>
                <button class="scene2-btn" id="scene2-btn-crit2">临界2 (10V)</button>
            </div>
            <div class="scene2-data-row">
                <div class="scene2-data-item">
                    <span class="label">E =</span>
                    <span class="value" id="scene2-val-E">0 V/m</span>
                </div>
                <div class="scene2-data-item">
                    <span class="label">a =</span>
                    <span class="value" id="scene2-val-a">10.0 m/s²</span>
                </div>
                <div class="scene2-data-item">
                    <span class="label">Fₑ =</span>
                    <span class="value" id="scene2-val-F">0 N</span>
                </div>
                <div class="scene2-data-item">
                    <span class="label">状态：</span>
                    <span class="scene2-status fail" id="scene2-status">打到 A 板，无法射出</span>
                </div>
            </div>
            <div class="scene2-const-row">
                m = 2.0×10⁻⁶ kg, q = +1.0×10⁻⁸ C, v₀ = 2.5 m/s, L = 0.1 m, d = 0.4 cm, g = 10 m/s²
            </div>
        </div>
    </div>
    
    <script>
    (function() {
        // ===== 常量定义 =====
        const L = 0.1;          // 极板长度 (m)
        const d = 0.004;        // 板间距 (m)
        const m = 2.0e-6;       // 质量 (kg)
        const q = 1.0e-8;       // 电量 (C)
        const g = 10;           // 重力加速度 (m/s²)
        const v0 = 2.5;         // 初速度 (m/s)
        
        // 坐标转换
        const x0_px = 100, x1_px = 700;
        const y_top_px = 120, y_bot_px = 280;
        const px_per_m_x = (x1_px - x0_px) / L;  // 6000 px/m
        const px_per_m_y = (y_bot_px - y_top_px) / d;  // 40000 px/m
        const y_center_px = (y_top_px + y_bot_px) / 2;  // 200
        
        // DOM 元素引用
        const slider = document.getElementById('scene2-slider');
        const valPhi = document.getElementById('scene2-val-phi');
        const valE = document.getElementById('scene2-val-E');
        const valA = document.getElementById('scene2-val-a');
        const valF = document.getElementById('scene2-val-F');
        const statusEl = document.getElementById('scene2-status');
        const btnCrit1 = document.getElementById('scene2-btn-crit1');
        const btnCrit2 = document.getElementById('scene2-btn-crit2');
        
        const trajMain = document.getElementById('scene2-trajectory-main');
        const trajEnd = document.getElementById('scene2-trajectory-end');
        const exitZone = document.getElementById('scene2-exit-zone');
        const forceElectric = document.getElementById('scene2-force-electric');
        const labelFe = document.getElementById('scene2-label-Fe');
        const balanceTip = document.getElementById('scene2-balance-tip');
        const fieldLines = document.querySelectorAll('.scene2-field-line');
        
        // ===== 工具函数 =====
        function show(el) { el.style.display = ''; el.style.opacity = '1'; }
        function hide(el) { el.style.display = 'none'; el.style.opacity = '0'; }
        
        // 生成轨迹路径
        function computeTrajectory(phiA) {
            const E = phiA / d;  // V/m
            const F_e = q * E;   // N
            const a = g - F_e / m;  // m/s²
            
            const t_total = L / v0;  // 0.04 s
            const N = 50;
            const dt = t_total / N;
            
            // 判断是否打到极板
            let t_hit = Infinity;
            let hitPlate = null;  // 'A', 'B', or null
            
            if (Math.abs(a) > 1e-10) {
                // 打到A板：y = d/2
                const t_A = Math.sqrt(d / Math.abs(a));
                if (a > 0 && t_A < t_total) {
                    t_hit = t_A;
                    hitPlate = 'A';
                }
                // 打到B板：y = -d/2
                const t_B = Math.sqrt(d / Math.abs(a));
                if (a < 0 && t_B < t_total) {
                    t_hit = t_B;
                    hitPlate = 'B';
                }
            }
            
            const t_end = Math.min(t_total, t_hit);
            const actualN = Math.max(2, Math.floor(N * (t_end / t_total)));
            
            const points = [];
            for (let i = 0; i <= actualN; i++) {
                const t = i * dt * (t_end / t_total);
                const x_m = v0 * t;
                const y_m = 0.5 * a * t * t;  // 相对于中位线
                const x_px = x0_px + x_m * px_per_m_x;
                const y_px = y_center_px + y_m * px_per_m_y;
                points.push({x: x_px, y: y_px});
            }
            
            return { points, a, E, F_e, hitPlate, t_end, t_total };
        }
        
        // 更新电场线
        function updateFieldLines(phiA) {
            fieldLines.forEach(g => {
                const line = g.querySelector('line');
                const arrow = g.querySelector('polygon');
                const x = parseFloat(g.getAttribute('data-x'));
                
                if (Math.abs(phiA) < 0.1) {
                    hide(g);
                    return;
                }
                show(g);
                
                if (phiA > 0) {
                    // 向上
                    line.setAttribute('y1', '265');
                    line.setAttribute('y2', '135');
                    line.setAttribute('stroke', '#1565c0');
                    arrow.setAttribute('points', `${x},130 ${x-4},140 ${x+4},140`);
                    arrow.setAttribute('fill', '#1565c0');
                } else {
                    // 向下
                    line.setAttribute('y1', '135');
                    line.setAttribute('y2', '265');
                    line.setAttribute('stroke', '#c62828');
                    arrow.setAttribute('points', `${x},270 ${x-4},260 ${x+4},260`);
                    arrow.setAttribute('fill', '#c62828');
                }
            });
        }
        
        // 更新受力区
        function updateForceArea(phiA, a) {
            if (Math.abs(phiA) < 0.1) {
                hide(forceElectric);
                hide(labelFe);
            } else {
                show(forceElectric);
                show(labelFe);
                
                if (phiA > 0) {
                    // 电场力向上
                    forceElectric.setAttribute('x1', '650');
                    forceElectric.setAttribute('y1', '90');
                    forceElectric.setAttribute('x2', '650');
                    forceElectric.setAttribute('y2', '55');
                    forceElectric.setAttribute('stroke', '#1565c0');
                    forceElectric.setAttribute('marker-end', 'url(#scene2-arrow-blue)');
                    labelFe.setAttribute('x', '660');
                    labelFe.setAttribute('y', '45');
                    labelFe.setAttribute('fill', '#1565c0');
                } else {
                    // 电场力向下
                    forceElectric.setAttribute('x1', '650');
                    forceElectric.setAttribute('y1', '55');
                    forceElectric.setAttribute('x2', '650');
                    forceElectric.setAttribute('y2', '90');
                    forceElectric.setAttribute('stroke', '#c62828');
                    forceElectric.setAttribute('marker-end', 'url(#scene2-arrow-red)');
                    labelFe.setAttribute('x', '660');
                    labelFe.setAttribute('y', '105');
                    labelFe.setAttribute('fill', '#c62828');
                }
            }
            
            // 平衡提示
            if (Math.abs(a) < 0.1) {
                show(balanceTip);
            } else {
                hide(balanceTip);
            }
        }
        
        // 更新轨迹显示
        function updateTrajectory(phiA) {
            const data = computeTrajectory(phiA);
            const { points, a, E, F_e, hitPlate, t_end, t_total } = data;
            
            if (points.length < 2) {
                trajMain.setAttribute('d', '');
                trajEnd.setAttribute('d', '');
                return;
            }
            
            // 分段：前80%为主体，后20%为末段
            const splitIdx = Math.floor(points.length * 0.8);
            const mainPoints = points.slice(0, splitIdx + 1);
            const endPoints = points.slice(splitIdx);
            
            const mainD = mainPoints.map((p, i) => (i === 0 ? 'M' : 'L') + p.x + ',' + p.y).join(' ');
            const endD = endPoints.map((p, i) => (i === 0 ? 'M' : 'L') + p.x + ',' + p.y).join(' ');
            
            trajMain.setAttribute('d', mainD);
            trajEnd.setAttribute('d', endD);
            
            // 判定状态
            let statusText, statusClass, endColor;
            const canExit = !hitPlate && t_end >= t_total - 1e-10;
            
            if (hitPlate === 'A') {
                if (Math.abs(phiA - 6) < 0.3) {
                    statusText = '临界：刚好到达 A 板右端，无法射出';
                } else {
                    statusText = '打到 A 板，无法射出';
                }
                statusClass = 'fail';
                endColor = '#c62828';
                exitZone.setAttribute('fill-opacity', '0');
            } else if (hitPlate === 'B') {
                if (Math.abs(phiA - 10) < 0.3) {
                    statusText = '临界：刚好到达 B 板右端，无法射出';
                } else {
                    statusText = '打到 B 板，无法射出';
                }
                statusClass = 'fail';
                endColor = '#c62828';
                exitZone.setAttribute('fill-opacity', '0');
            } else if (canExit) {
                statusText = '可从右侧射出';
                statusClass = 'ok';
                endColor = '#2e7d32';
                exitZone.setAttribute('fill-opacity', '0.15');
            } else {
                statusText = '打到极板，无法射出';
                statusClass = 'fail';
                endColor = '#c62828';
                exitZone.setAttribute('fill-opacity', '0');
            }
            
            trajEnd.setAttribute('stroke', endColor);
            statusEl.textContent = statusText;
            statusEl.className = 'scene2-status ' + statusClass;
            
            // 更新数值
            valPhi.textContent = phiA.toFixed(1) + ' V';
            valE.textContent = E.toFixed(0) + ' V/m';
            valA.textContent = a.toFixed(2) + ' m/s²';
            valF.textContent = F_e.toExponential(2) + ' N';
            
            // 更新电场线和受力区
            updateFieldLines(phiA);
            updateForceArea(phiA, a);
        }
        
        // 滑块事件
        slider.addEventListener('input', function() {
            const phiA = parseFloat(this.value);
            updateTrajectory(phiA);
        });
        
        // 临界按钮动画
        function animateTo(targetPhi, duration) {
            const startPhi = parseFloat(slider.value);
            const startTime = performance.now();
            
            function frame(now) {
                const elapsed = now - startTime;
                const t = Math.min(elapsed / duration, 1);
                const current = startPhi + (targetPhi - startPhi) * t;
                slider.value = current;
                updateTrajectory(current);
                
                if (t < 1) {
                    requestAnimationFrame(frame);
                }
            }
            requestAnimationFrame(frame);
        }
        
        btnCrit1.addEventListener('click', function() {
            animateTo(6, 300);
        });
        
        btnCrit2.addEventListener('click', function() {
            animateTo(10, 300);
        });
        
        // 初始更新
        updateTrajectory(0);
    })();
    </script>
</body>
</html>
