<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 1 - 金属棒圆弧轨道电磁感应</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-slider { width: 600px; }
        .scene1-slider-label { font-size: 14px; color: #333; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 左圆弧轨道：圆心(180,150)，r=130，从(180,280)到(310,150) -->
            <path id="scene1-arc-left" d="M 180,280 A 130,130 0 0,1 310,150" fill="none" stroke="#000000" stroke-width="2" />
            <!-- 右圆弧轨道：圆心(280,150)，r=130，从(280,280)到(410,150) -->
            <path id="scene1-arc-right" d="M 280,280 A 130,130 0 0,1 410,150" fill="none" stroke="#000000" stroke-width="2" />

            <!-- 圆心 O -->
            <circle cx="180" cy="150" r="3" fill="#000000" />
            <text id="scene1-label-o" x="162" y="145" font-size="16" fill="#000000">O</text>

            <!-- 半径虚线(下) -->
            <line x1="180" y1="150" x2="180" y2="280" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" />
            <text x="145" y="215" font-size="14" fill="#000000">r</text>
            <!-- 半径虚线(右) -->
            <line x1="180" y1="150" x2="310" y2="150" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" />
            <text x="240" y="135" font-size="14" fill="#000000">r</text>

            <!-- 端点标签 -->
            <text x="160" y="285" font-size="16" fill="#000000">c</text>
            <text x="290" y="340" font-size="16" fill="#000000">d</text>
            <text x="295" y="130" font-size="16" fill="#000000">a</text>
            <text x="435" y="140" font-size="16" fill="#000000">b</text>

            <!-- 间距 L 标注 -->
            <line x1="180" y1="300" x2="280" y2="300" stroke="#000000" stroke-width="1" />
            <line x1="180" y1="295" x2="180" y2="305" stroke="#000000" stroke-width="1" />
            <line x1="280" y1="295" x2="280" y2="305" stroke="#000000" stroke-width="1" />
            <text x="225" y="315" font-size="14" fill="#000000" text-anchor="middle">L</text>

            <!-- 电阻 R 及导线 -->
            <!-- 连接a到R上端 -->
            <path d="M 310,150 L 310,120 L 360,120 L 360,110" fill="none" stroke="#000000" stroke-width="1.5" />
            <!-- 连接b到R上端 -->
            <path d="M 410,150 L 410,120 L 400,120 L 400,110" fill="none" stroke="#000000" stroke-width="1.5" />
            <!-- 电阻符号 -->
            <rect x="360" y="110" width="40" height="20" fill="none" stroke="#000000" stroke-width="1.5" />
            <!-- 电阻锯齿 -->
            <polyline points="360,120 365,115 370,125 375,115 380,125 385,115 390,120" fill="none" stroke="#000000" stroke-width="1" />
            <text x="380" y="85" font-size="14" fill="#000000" text-anchor="middle">R</text>

            <!-- 磁场：6条竖直蓝色虚线箭头 -->
            <g id="scene1-magnetic-field">
                <line x1="190" y1="280" x2="190" y2="160" stroke="#1565c0" stroke-width="1" stroke-dasharray="5,5" marker-end="url(#arrow-blue)" />
                <line x1="230" y1="280" x2="230" y2="160" stroke="#1565c0" stroke-width="1" stroke-dasharray="5,5" marker-end="url(#arrow-blue)" />
                <line x1="270" y1="280" x2="270" y2="160" stroke="#1565c0" stroke-width="1" stroke-dasharray="5,5" marker-end="url(#arrow-blue)" />
                <line x1="310" y1="280" x2="310" y2="160" stroke="#1565c0" stroke-width="1" stroke-dasharray="5,5" marker-end="url(#arrow-blue)" />
                <line x1="350" y1="280" x2="350" y2="160" stroke="#1565c0" stroke-width="1" stroke-dasharray="5,5" marker-end="url(#arrow-blue)" />
                <line x1="390" y1="280" x2="390" y2="160" stroke="#1565c0" stroke-width="1" stroke-dasharray="5,5" marker-end="url(#arrow-blue)" />
            </g>
            <!-- 磁场标签 B↑ -->
            <text x="100" y="220" font-size="16" fill="#1565c0">B↑</text>

            <!-- 箭头定义 -->
            <defs>
                <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
                    <path d="M 0,0 L 10,5 L 0,10 L 3,5 Z" fill="#1565c0" />
                </marker>
                <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
                    <path d="M 0,0 L 10,5 L 0,10 L 3,5 Z" fill="#c62828" />
                </marker>
            </defs>

            <!-- 动态元素：圆心到棒半径虚线 -->
            <line id="scene1-radius-rod" x1="180" y1="150" x2="180" y2="280" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" />

            <!-- 动态元素：角度 θ 弧线 -->
            <path id="scene1-angle-arc" d="M 180,190 A 40,40 0 0,0 180,190" fill="none" stroke="#888888" stroke-width="1.5" opacity="0" />
            <text id="scene1-label-theta" x="270" y="142" font-size="16" fill="#000000">θ</text>

            <!-- 动态元素：金属棒 -->
            <line id="scene1-rod" x1="180" y1="280" x2="280" y2="280" stroke="#000000" stroke-width="3" />

            <!-- 速度分解：v₀, vₓ, vᵤ -->
            <!-- v₀ 箭头（沿切线） -->
            <line id="scene1-v0-arrow" x1="230" y1="280" x2="280" y2="280" stroke="#c62828" stroke-width="1.5" marker-end="url(#arrow-red)" />
            <text id="scene1-label-v0" x="450" y="260" font-size="14" fill="#c62828">v₀</text>
            <line id="scene1-v0-leader" x1="280" y1="280" x2="445" y2="260" stroke="#888888" stroke-width="1" stroke-dasharray="3,3" />

            <!-- vₓ 箭头（水平） -->
            <line id="scene1-vx-arrow" x1="230" y1="280" x2="280" y2="280" stroke="#c62828" stroke-width="1.5" marker-end="url(#arrow-red)" />
            <text id="scene1-label-vx" x="450" y="300" font-size="14" fill="#c62828">vₓ</text>
            <line id="scene1-vx-leader" x1="280" y1="280" x2="445" y2="300" stroke="#888888" stroke-width="1" stroke-dasharray="3,3" />

            <!-- vᵤ 箭头（竖直） -->
            <line id="scene1-vy-arrow" x1="230" y1="280" x2="230" y2="230" stroke="#c62828" stroke-width="1.5" marker-end="url(#arrow-red)" />
            <text id="scene1-label-vy" x="450" y="230" font-size="14" fill="#c62828">vᵤ</text>
            <line id="scene1-vy-leader" x1="230" y1="230" x2="445" y2="230" stroke="#888888" stroke-width="1" stroke-dasharray="3,3" />

            <!-- 速度分解辅助虚线 -->
            <line id="scene1-v0-vx-dash" x1="280" y1="280" x2="280" y2="280" stroke="#888888" stroke-width="1" stroke-dasharray="3,3" />
            <line id="scene1-v0-vy-dash" x1="280" y1="280" x2="230" y2="280" stroke="#888888" stroke-width="1" stroke-dasharray="3,3" />

            <!-- 等效电路（右侧面板） -->
            <text x="620" y="40" font-size="16" fill="#000000" text-anchor="middle" font-weight="bold">等效电路</text>
            <!-- 串联导线 -->
            <line x1="500" y1="100" x2="700" y2="100" stroke="#000000" stroke-width="1.5" />
            <!-- 电源 ε（电池符号） -->
            <line x1="530" y1="85" x2="530" y2="115" stroke="#000000" stroke-width="1.5" />
            <line x1="520" y1="92" x2="520" y2="108" stroke="#000000" stroke-width="1.5" />
            <line x1="520" y1="100" x2="500" y2="100" stroke="#000000" stroke-width="1.5" />
            <line x1="530" y1="100" x2="545" y2="100" stroke="#000000" stroke-width="1.5" />
            <text x="525" y="75" font-size="14" fill="#000000" text-anchor="middle">ε</text>
            <!-- 内阻 R/3 -->
            <rect x="575" y="90" width="50" height="20" fill="none" stroke="#000000" stroke-width="1.5" />
            <!-- 斜线填充 -->
            <line x1="575" y1="90" x2="595" y2="110" stroke="#888888" stroke-width="1" />
            <line x1="585" y1="90" x2="605" y2="110" stroke="#888888" stroke-width="1" />
            <line x1="595" y1="90" x2="615" y2="110" stroke="#888888" stroke-width="1" />
            <line x1="605" y1="90" x2="625" y2="110" stroke="#888888" stroke-width="1" />
            <text x="600" y="75" font-size="14" fill="#000000" text-anchor="middle">R/3</text>
            <!-- 外阻 R -->
            <rect x="635" y="90" width="50" height="20" fill="none" stroke="#000000" stroke-width="1.5" />
            <!-- 横线填充 -->
            <line x1="635" y1="95" x2="685" y2="95" stroke="#1565c0" stroke-width="1" />
            <line x1="635" y1="100" x2="685" y2="100" stroke="#1565c0" stroke-width="1" />
            <line x1="635" y1="105" x2="685" y2="105" stroke="#1565c0" stroke-width="1" />
            <text x="660" y="75" font-size="14" fill="#000000" text-anchor="middle">R</text>

            <!-- 实时数据面板 -->
            <text x="620" y="195" font-size="16" fill="#000000" text-anchor="middle" font-weight="bold">实时数据</text>
            <text id="scene1-data-theta" x="510" y="250" font-size="14" fill="#000000">θ = 0°</text>
            <text id="scene1-data-vx" x="510" y="290" font-size="14" fill="#000000">vₓ = v₀</text>
            <text id="scene1-data-eps" x="510" y="330" font-size="14" fill="#2e7d32">ε = BLv₀</text>
            <text id="scene1-data-u" x="510" y="370" font-size="14" fill="#2e7d32">U = ¾BLv₀</text>
        </svg>

        <div id="scene1-controls">
            <span class="scene1-slider-label">cd</span>
            <input type="range" id="scene1-slider" min="0" max="100" value="0" />
            <span class="scene1-slider-label">ab</span>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        var slider = document.getElementById('scene1-slider');
        var theta = 0;

        var rod = document.getElementById('scene1-rod');
        var radiusRod = document.getElementById('scene1-radius-rod');
        var angleArc = document.getElementById('scene1-angle-arc');
        var v0Arrow = document.getElementById('scene1-v0-arrow');
        var vxArrow = document.getElementById('scene1-vx-arrow');
        var vyArrow = document.getElementById('scene1-vy-arrow');
        var labelV0 = document.getElementById('scene1-label-v0');
        var labelVx = document.getElementById('scene1-label-vx');
        var labelVy = document.getElementById('scene1-label-vy');
        var v0Leader = document.getElementById('scene1-v0-leader');
        var vxLeader = document.getElementById('scene1-vx-leader');
        var vyLeader = document.getElementById('scene1-vy-leader');
        var v0VxDash = document.getElementById('scene1-v0-vx-dash');
        var v0VyDash = document.getElementById('scene1-v0-vy-dash');
        var dataTheta = document.getElementById('scene1-data-theta');
        var dataVx = document.getElementById('scene1-data-vx');
        var dataEps = document.getElementById('scene1-data-eps');
        var dataU = document.getElementById('scene1-data-u');

        var cx = 180, cy = 150, r = 130, L = 100;
        var v0Len = 50;

        function render() {
            var sin = Math.sin(theta);
            var cos = Math.cos(theta);
            var deg = theta * 180 / Math.PI;

            var x1 = cx + r * sin;
            var y1 = cy + r * cos;
            var x2 = x1 + L;
            var y2 = y1;

            rod.setAttribute('x1', x1);
            rod.setAttribute('y1', y1);
            rod.setAttribute('x2', x2);
            rod.setAttribute('y2', y2);

            radiusRod.setAttribute('x2', x1);
            radiusRod.setAttribute('y2', y1);

            var arcStartX = cx;
            var arcStartY = cy + 40;
            var arcEndX = cx + 40 * sin;
            var arcEndY = cy + 40 * cos;
            if (theta < 0.01) {
                angleArc.setAttribute('d', 'M ' + arcStartX + ',' + arcStartY + ' A 40,40 0 0,0 ' + arcEndX + ',' + arcEndY);
                angleArc.setAttribute('opacity', '0');
            } else {
                angleArc.setAttribute('d', 'M ' + arcStartX + ',' + arcStartY + ' A 40,40 0 0,0 ' + arcEndX + ',' + arcEndY);
                angleArc.setAttribute('opacity', '1');
            }

            var mx = (x1 + x2) / 2;
            var my = y1;

            // v₀ 箭头（沿切线）
            var v0x = mx + v0Len * cos;
            var v0y = my - v0Len * sin;
            v0Arrow.setAttribute('x1', mx);
            v0Arrow.setAttribute('y1', my);
            v0Arrow.setAttribute('x2', v0x);
            v0Arrow.setAttribute('y2', v0y);
            // v₀标签固定在右侧安全区，y随箭头动态调整，与vᵤ保持足够间距
            var v0LabelY = v0y - 55;
            if (v0LabelY < 30) v0LabelY = 30;
            labelV0.setAttribute('x', 450);
            labelV0.setAttribute('y', v0LabelY);
            v0Leader.setAttribute('x1', v0x);
            v0Leader.setAttribute('y1', v0y);
            v0Leader.setAttribute('x2', 445);
            v0Leader.setAttribute('y2', v0LabelY);

            // vₓ 水平分量
            var vxx = mx + v0Len * cos;
            var vxy = my;
            vxArrow.setAttribute('x1', mx);
            vxArrow.setAttribute('y1', my);
            vxArrow.setAttribute('x2', vxx);
            vxArrow.setAttribute('y2', vxy);
            var vxLabelY = vxy + 55;
            if (vxLabelY > 420) vxLabelY = 420;
            labelVx.setAttribute('x', 450);
            labelVx.setAttribute('y', vxLabelY);
            vxLeader.setAttribute('x1', vxx);
            vxLeader.setAttribute('y1', vxy);
            vxLeader.setAttribute('x2', 445);
            vxLeader.setAttribute('y2', vxLabelY);

            // vᵤ 竖直分量
            var vyx = mx;
            var vyy = my - v0Len * sin;
            vyArrow.setAttribute('x1', mx);
            vyArrow.setAttribute('y1', my);
            vyArrow.setAttribute('x2', vyx);
            vyArrow.setAttribute('y2', vyy);
            var vyLabelY = vyy - 85;
            if (vyLabelY < 30) vyLabelY = 30;
            // 确保vᵤ与v₀标签不重叠：vᵤ必须在v₀上方至少12px
            if (vyLabelY > v0LabelY - 20) vyLabelY = v0LabelY - 20;
            labelVy.setAttribute('x', 450);
            labelVy.setAttribute('y', vyLabelY);
            vyLeader.setAttribute('x1', vyx);
            vyLeader.setAttribute('y1', vyy);
            vyLeader.setAttribute('x2', 445);
            vyLeader.setAttribute('y2', vyLabelY);

            // 辅助虚线
            v0VxDash.setAttribute('x1', v0x);
            v0VxDash.setAttribute('y1', v0y);
            v0VxDash.setAttribute('x2', vxx);
            v0VxDash.setAttribute('y2', vxy);
            v0VyDash.setAttribute('x1', v0x);
            v0VyDash.setAttribute('y1', v0y);
            v0VyDash.setAttribute('x2', vyx);
            v0VyDash.setAttribute('y2', vyy);

            if (sin < 0.01) {
                vyArrow.style.display = 'none';
                labelVy.style.display = 'none';
                vyLeader.style.display = 'none';
                v0VyDash.style.display = 'none';
            } else {
                vyArrow.style.display = '';
                labelVy.style.display = '';
                vyLeader.style.display = '';
                v0VyDash.style.display = '';
            }
            if (cos < 0.01) {
                vxArrow.style.display = 'none';
                labelVx.style.display = 'none';
                vxLeader.style.display = 'none';
                v0VxDash.style.display = 'none';
            } else {
                vxArrow.style.display = '';
                labelVx.style.display = '';
                vxLeader.style.display = '';
                v0VxDash.style.display = '';
            }

            dataTheta.textContent = 'θ = ' + deg.toFixed(1) + '°';
            dataVx.textContent = 'vₓ = v₀cosθ = ' + (cos < 0.01 ? '0' : 'v₀·' + cos.toFixed(3));
            dataEps.textContent = 'ε = BLv₀cosθ = ' + (cos < 0.01 ? '0' : 'BLv₀·' + cos.toFixed(3));
            dataU.textContent = 'U = ¾BLv₀cosθ = ' + (cos < 0.01 ? '0' : '¾BLv₀·' + cos.toFixed(3));
        }

        slider.addEventListener('input', function() {
            theta = (parseInt(slider.value) / 100) * (Math.PI / 2);
            render();
        });

        render();
    })();
    </script>
</body>
</html>
