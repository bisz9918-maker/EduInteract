<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 平行板类平抛运动</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene2-controls button {
            padding: 6px 16px; font-size: 14px; cursor: pointer;
            border: 1px solid #ccc; border-radius: 4px; background: #f5f5f5;
            min-width: 90px; height: 32px;
        }
        #scene2-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene2-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene2-step-indicator { font-size: 14px; color: #666; min-width: 80px; text-align: center; }
        .scene2-fade { transition: opacity 0.2s ease; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500">
            <defs>
                <!-- 箭头标记 -->
                <marker id="scene2-arrowhead-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                    <polygon points="0,0 8,3 0,6" fill="#2e7d32"/>
                </marker>
                <marker id="scene2-arrowhead-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                    <polygon points="0,0 8,3 0,6" fill="#c62828"/>
                </marker>
                <marker id="scene2-arrowhead-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                    <polygon points="0,0 8,3 0,6" fill="#1565c0"/>
                </marker>
                <marker id="scene2-arrowhead-black" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                    <polygon points="0,0 8,3 0,6" fill="#000000"/>
                </marker>
                <marker id="scene2-arrowhead-rev-green" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto">
                    <polygon points="8,0 0,3 8,6" fill="#2e7d32"/>
                </marker>
                <marker id="scene2-arrowhead-rev-red" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto">
                    <polygon points="8,0 0,3 8,6" fill="#c62828"/>
                </marker>
                <marker id="scene2-arrowhead-rev-black" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto">
                    <polygon points="8,0 0,3 8,6" fill="#000000"/>
                </marker>
            </defs>

            <!-- 步骤0：基础装置 -->
            <!-- 板间高亮区 -->
            <rect id="scene2-field-area" x="100" y="100" width="160" height="160" fill="#1565c0" fill-opacity="0.1" stroke="none" class="scene2-fade"/>
            <!-- A板 -->
            <rect id="scene2-plate-a" x="100" y="84" width="160" height="16" fill="#e3f2fd" stroke="#000" stroke-width="1"/>
            <!-- B板 -->
            <rect id="scene2-plate-b" x="100" y="260" width="160" height="16" fill="#e3f2fd" stroke="#000" stroke-width="1"/>
            <!-- 中心线RO -->
            <line id="scene2-center-line" x1="92" y1="180" x2="720" y2="180" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
            <!-- R点 -->
            <text id="scene2-r-point" x="92" y="184" font-size="14" text-anchor="middle" fill="#000">⊕</text>
            <!-- v0箭头 -->
            <line id="scene2-arrow-v0" x1="92" y1="180" x2="132" y2="180" stroke="#2e7d32" stroke-width="1.2" marker-end="url(#scene2-arrowhead-green)" class="scene2-fade"/>
            <!-- 电场线 -->
            <line id="scene2-efield-1" x1="140" y1="100" x2="140" y2="260" stroke="#1565c0" stroke-width="0.8" marker-end="url(#scene2-arrowhead-blue)" class="scene2-fade"/>
            <line id="scene2-efield-2" x1="180" y1="100" x2="180" y2="260" stroke="#1565c0" stroke-width="0.8" marker-end="url(#scene2-arrowhead-blue)" class="scene2-fade"/>
            <line id="scene2-efield-3" x1="220" y1="100" x2="220" y2="260" stroke="#1565c0" stroke-width="0.8" marker-end="url(#scene2-arrowhead-blue)" class="scene2-fade"/>
            <!-- MN线 -->
            <line id="scene2-mn-line" x1="260" y1="100" x2="260" y2="260" stroke="#000" stroke-width="1"/>
            <!-- PS线 -->
            <line id="scene2-ps-line" x1="500" y1="50" x2="500" y2="450" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
            <!-- O点 -->
            <circle id="scene2-o-point" cx="620" cy="180" r="4" fill="#000"/>
            <!-- EF荧光屏 -->
            <line id="scene2-screen-line" x1="720" y1="160" x2="720" y2="200" stroke="#000" stroke-width="4"/>
            <line id="scene2-screen-hatch1" x1="720" y1="160" x2="730" y2="170" stroke="#000" stroke-width="1"/>
            <line id="scene2-screen-hatch2" x1="720" y1="170" x2="730" y2="180" stroke="#000" stroke-width="1"/>
            <line id="scene2-screen-hatch3" x1="720" y1="180" x2="730" y2="190" stroke="#000" stroke-width="1"/>
            <line id="scene2-screen-hatch4" x1="720" y1="190" x2="730" y2="200" stroke="#000" stroke-width="1"/>

            <!-- 步骤1：受力分析 -->
            <line id="scene2-arrow-f" x1="140" y1="200" x2="140" y2="240" stroke="#c62828" stroke-width="1.2" marker-end="url(#scene2-arrowhead-red)" class="scene2-fade"/>

            <!-- 步骤2：运动分解 -->
            <line id="scene2-arrow-vy" x1="200" y1="200" x2="200" y2="230" stroke="#2e7d32" stroke-width="1.2" marker-end="url(#scene2-arrowhead-green)" class="scene2-fade"/>

            <!-- 步骤3：轨迹与合速度 -->
            <path id="scene2-trajectory-in" d="M 92 180 Q 176 180 260 240" fill="none" stroke="#000" stroke-width="1.5" class="scene2-fade"/>
            <line id="scene2-arrow-v" x1="260" y1="240" x2="308" y2="276" stroke="#2e7d32" stroke-width="1.2" marker-end="url(#scene2-arrowhead-green)" class="scene2-fade"/>

            <!-- 步骤4：板内偏转与角度 -->
            <line id="scene2-arrow-y1" x1="265" y1="180" x2="265" y2="240" stroke="#c62828" stroke-width="1.2" marker-start="url(#scene2-arrowhead-rev-red)" marker-end="url(#scene2-arrowhead-red)" class="scene2-fade"/>
            <path id="scene2-arc-theta" d="M 285 240 A 25 25 0 0 0 260 215" fill="none" stroke="#000" stroke-width="1" class="scene2-fade"/>

            <!-- 步骤5：无电场区域延伸 -->
            <line id="scene2-trajectory-out" x1="260" y1="240" x2="500" y2="420" stroke="#000" stroke-width="1.5" class="scene2-fade"/>
            <line id="scene2-arrow-Y" x1="505" y1="180" x2="505" y2="420" stroke="#c62828" stroke-width="1.2" marker-start="url(#scene2-arrowhead-rev-red)" marker-end="url(#scene2-arrowhead-red)" class="scene2-fade"/>

            <!-- 步骤6：反向延长线推论 -->
            <circle id="scene2-c-point" cx="180" cy="180" r="4" fill="#888" class="scene2-fade"/>
            <line id="scene2-backward-line" x1="100" y1="120" x2="260" y2="240" stroke="#888" stroke-width="1" stroke-dasharray="4,4" class="scene2-fade"/>

            <!-- 步骤7：相似三角形 -->
            <polygon id="scene2-triangle-small" points="180,180 260,180 260,240" fill="#1565c0" fill-opacity="0.2" stroke="#1565c0" stroke-width="1" class="scene2-fade"/>
            <polygon id="scene2-triangle-large" points="180,180 500,180 500,420" fill="#1565c0" fill-opacity="0.2" stroke="#1565c0" stroke-width="1" class="scene2-fade"/>

            <!-- 长度标注箭头 -->
            <line id="scene2-arrow-l" x1="100" y1="290" x2="260" y2="290" stroke="#000" stroke-width="1" marker-start="url(#scene2-arrowhead-rev-black)" marker-end="url(#scene2-arrowhead-black)"/>
            <line id="scene2-arrow-d" x1="280" y1="100" x2="280" y2="260" stroke="#000" stroke-width="1" marker-start="url(#scene2-arrowhead-rev-black)" marker-end="url(#scene2-arrowhead-black)"/>
            <line id="scene2-arrow-L" x1="260" y1="56" x2="500" y2="56" stroke="#000" stroke-width="1" marker-start="url(#scene2-arrowhead-rev-black)" marker-end="url(#scene2-arrowhead-black)"/>

            <!-- 标签 -->
            <!-- 基础标签 -->
            <text id="scene2-label-A" x="120" y="78" font-size="16" fill="#000">A</text>
            <text id="scene2-label-B" x="120" y="292" font-size="16" fill="#000">B</text>
            <text id="scene2-label-R" x="58" y="184" font-size="14" text-anchor="end" fill="#000">R</text>
            <text id="scene2-label-v0" x="148" y="92" font-size="14" fill="#000">v₀</text>
            <text id="scene2-label-M" x="260" y="68" font-size="14" text-anchor="middle" fill="#000">M</text>
            <text id="scene2-label-N" x="260" y="438" font-size="14" text-anchor="middle" fill="#000">N</text>
            <text id="scene2-label-P" x="500" y="40" font-size="14" text-anchor="middle" fill="#000">P</text>
            <text id="scene2-label-S" x="500" y="462" font-size="14" text-anchor="middle" fill="#000">S</text>
            <text id="scene2-label-O" x="620" y="172" font-size="14" text-anchor="middle" fill="#000">O</text>
            <text id="scene2-label-E" x="735" y="172" font-size="14" fill="#000">E</text>
            <text id="scene2-label-F" x="735" y="208" font-size="14" fill="#000">F</text>
            <text id="scene2-label-l" x="170" y="310" font-size="14" text-anchor="middle" fill="#000">l</text>
            <text id="scene2-label-d" x="292" y="168" font-size="14" fill="#000">d</text>
            <text id="scene2-label-L" x="380" y="44" font-size="14" text-anchor="middle" fill="#000">L</text>
            <text id="scene2-label-UAB" x="180" y="68" font-size="14" text-anchor="middle" fill="#000">U<sub>AB</sub>=300V</text>

            <!-- 步骤标签 -->
            <text id="scene2-label-f" x="108" y="220" font-size="14" fill="#c62828" class="scene2-fade">F=qE</text>
            <text id="scene2-label-vy" x="188" y="215" font-size="14" fill="#2e7d32" class="scene2-fade">vᵧ</text>
            <text id="scene2-label-v" x="316" y="258" font-size="14" fill="#2e7d32" class="scene2-fade">v</text>
            <text id="scene2-label-y1" x="272" y="210" font-size="14" fill="#c62828" class="scene2-fade">y₁</text>
            <text id="scene2-label-theta" x="288" y="228" font-size="14" fill="#000" class="scene2-fade">θ</text>
            <text id="scene2-label-Y" x="512" y="300" font-size="14" fill="#c62828" class="scene2-fade">Y</text>
            <text id="scene2-label-C" x="180" y="196" font-size="14" text-anchor="middle" fill="#888" class="scene2-fade">C</text>
            <text id="scene2-label-tan" x="300" y="240" font-size="14" fill="#c62828" font-weight="bold" class="scene2-fade">tanθ=0.75</text>
        </svg>

        <div id="scene2-controls">
            <button id="scene2-btn-prev">◀ 上一步</button>
            <button id="scene2-btn-reset">重置</button>
            <span id="scene2-step-indicator">步骤 0 / 8</span>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2 实现
        var currentStep = 0;
        var totalSteps = 8;

        // 元素ID列表，按步骤分组
        var stepElements = {
            0: [], // 步骤0显示所有基础元素（默认显示）
            1: ['scene2-arrow-f', 'scene2-label-f'],
            2: ['scene2-arrow-vy', 'scene2-label-vy'],
            3: ['scene2-trajectory-in', 'scene2-arrow-v', 'scene2-label-v'],
            4: ['scene2-arrow-y1', 'scene2-label-y1', 'scene2-arc-theta', 'scene2-label-theta'],
            5: ['scene2-trajectory-out', 'scene2-arrow-Y', 'scene2-label-Y'],
            6: ['scene2-c-point', 'scene2-backward-line', 'scene2-label-C'],
            7: ['scene2-triangle-small', 'scene2-triangle-large'],
            8: ['scene2-label-tan']
        };

        // 步骤8需要修改的标签
        var labelY1 = document.getElementById('scene2-label-y1');
        var labelY = document.getElementById('scene2-label-Y');

        function show(el) {
            if (!el) return;
            el.style.display = '';
            el.style.opacity = '1';
        }
        function hide(el) {
            if (!el) return;
            el.style.opacity = '0';
            // 延迟后设置display:none，让过渡效果完成
            setTimeout(function() {
                if (el.style.opacity === '0') el.style.display = 'none';
            }, 200);
        }

        function updateStep() {
            // 更新步骤指示器
            document.getElementById('scene2-step-indicator').textContent = '步骤 ' + currentStep + ' / ' + totalSteps;

            // 更新按钮状态
            document.getElementById('scene2-btn-prev').disabled = (currentStep === 0);
            document.getElementById('scene2-btn-next').disabled = (currentStep === totalSteps);

            // 控制各步骤元素的显示/隐藏
            for (var step = 1; step <= totalSteps; step++) {
                var ids = stepElements[step] || [];
                ids.forEach(function(id) {
                    var el = document.getElementById(id);
                    if (step <= currentStep) {
                        show(el);
                    } else {
                        hide(el);
                    }
                });
            }

            // 步骤8特殊处理：更新标签内容
            if (currentStep >= 8) {
                if (labelY1) labelY1.textContent = 'y₁=3cm';
                if (labelY) labelY.textContent = 'Y=12cm';
            } else {
                if (labelY1) labelY1.textContent = 'y₁';
                if (labelY) labelY.textContent = 'Y';
            }
        }

        // 初始化：隐藏所有步骤元素
        for (var step = 1; step <= totalSteps; step++) {
            var ids = stepElements[step] || [];
            ids.forEach(function(id) {
                var el = document.getElementById(id);
                if (el) {
                    el.style.display = 'none';
                    el.style.opacity = '0';
                }
            });
        }

        // 绑定按钮事件
        document.getElementById('scene2-btn-prev').addEventListener('click', function() {
            if (currentStep > 0) { currentStep--; updateStep(); }
        });
        document.getElementById('scene2-btn-next').addEventListener('click', function() {
            if (currentStep < totalSteps) { currentStep++; updateStep(); }
        });
        document.getElementById('scene2-btn-reset').addEventListener('click', function() {
            currentStep = 0; updateStep();
        });

        // 初始更新
        updateStep();
    })();
    </script>
</body>
</html>
