<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>等边双三角形中的相似关系</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            padding: 6px 16px; font-size: 14px; cursor: pointer;
            border: 1px solid #333; border-radius: 4px; background: #f5f5f5;
        }
        #scene1-controls button:hover { background: #e0e0e0; }
        #scene1-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 14px; color: #333; min-width: 70px; text-align: center; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500" style="display:block;">
            <!-- △ACD 填充 -->
            <polygon id="scene1-tri-acd-fill" points="180,320 345,320 262,177" fill="none" stroke="none"/>
            <!-- △BCE 填充 -->
            <polygon id="scene1-tri-bce-fill" points="345,320 620,320 483,82" fill="none" stroke="none"/>
            
            <!-- 线段 -->
            <line id="scene1-line-ab" x1="180" y1="320" x2="620" y2="320" stroke="#000000" stroke-width="2"/>
            <line id="scene1-line-ac" x1="180" y1="320" x2="345" y2="320" stroke="#000000" stroke-width="2"/>
            <line id="scene1-line-cb" x1="345" y1="320" x2="620" y2="320" stroke="#000000" stroke-width="2"/>
            <line id="scene1-line-ad" x1="180" y1="320" x2="262" y2="177" stroke="#000000" stroke-width="2"/>
            <line id="scene1-line-cd" x1="345" y1="320" x2="262" y2="177" stroke="#000000" stroke-width="2"/>
            <line id="scene1-line-be" x1="620" y1="320" x2="483" y2="82" stroke="#000000" stroke-width="2"/>
            <line id="scene1-line-ce" x1="345" y1="320" x2="483" y2="82" stroke="#000000" stroke-width="2"/>
            <line id="scene1-line-de" x1="262" y1="177" x2="483" y2="82" stroke="#000000" stroke-width="2"/>
            <line id="scene1-line-af" x1="180" y1="320" x2="551" y2="201" stroke="#000000" stroke-width="2"/>
            
            <!-- 步骤3虚线 -->
            <line id="scene1-line-ae" x1="180" y1="320" x2="483" y2="82" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5" style="display:none"/>
            <line id="scene1-line-db" x1="262" y1="177" x2="620" y2="320" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5" style="display:none"/>
            
            <!-- 步骤2 CG线段 -->
            <line id="scene1-line-cg" x1="345" y1="320" x2="319" y2="275" stroke="#c62828" stroke-width="2.5" style="display:none"/>
            
            <!-- 步骤4 CP线段 -->
            <line id="scene1-line-cp" x1="400" y1="320" x2="400" y2="130" stroke="#000000" stroke-width="2" style="display:none"/>
            
            <!-- 步骤5 AF分段 -->
            <line id="scene1-seg-ag" x1="180" y1="320" x2="373" y2="272" stroke="#c62828" stroke-width="3" style="display:none"/>
            <line id="scene1-seg-gh" x1="373" y1="272" x2="437" y2="257" stroke="#1565c0" stroke-width="3" style="display:none"/>
            <line id="scene1-seg-hf" x1="437" y1="257" x2="565" y2="225" stroke="#2e7d32" stroke-width="3" style="display:none"/>
            
            <!-- 点标记 -->
            <circle id="scene1-point-a" cx="180" cy="320" r="4" fill="#000000"/>
            <circle id="scene1-point-b" cx="620" cy="320" r="4" fill="#000000"/>
            <circle id="scene1-point-c" cx="345" cy="320" r="4" fill="#000000"/>
            <circle id="scene1-point-d" cx="262" cy="177" r="4" fill="#000000"/>
            <circle id="scene1-point-e" cx="483" cy="82" r="4" fill="#000000"/>
            <circle id="scene1-point-p" cx="373" cy="129" r="4" fill="#000000"/>
            <circle id="scene1-point-f" cx="551" cy="201" r="4" fill="#000000"/>
            <circle id="scene1-point-g" cx="319" cy="275" r="4" fill="#000000"/>
            <circle id="scene1-point-h" cx="383" cy="255" r="4" fill="#000000"/>
            
            <!-- 中点标记 -->
            <line id="scene1-mark-p" x1="373" y1="123" x2="373" y2="135" stroke="#000000" stroke-width="1.5"/>
            <line id="scene1-mark-f" x1="551" y1="195" x2="551" y2="207" stroke="#000000" stroke-width="1.5"/>
            
            <!-- 直角符号（步骤4） -->
            <polyline id="scene1-right-angle" points="400,320 400,312 408,312 408,320" fill="none" stroke="#000000" stroke-width="1.5" style="display:none"/>
            
            <!-- 60°角标（步骤1） -->
            <path id="scene1-angle-a" d="M 200,320 A 20,20 0 0 0 190,302.7" fill="none" stroke="#000000" stroke-width="1.5" style="display:none"/>
            <path id="scene1-angle-c1" d="M 325,320 A 20,20 0 0 0 335,302.7" fill="none" stroke="#000000" stroke-width="1.5" style="display:none"/>
            <path id="scene1-angle-c2" d="M 365,320 A 20,20 0 0 1 355,302.7" fill="none" stroke="#000000" stroke-width="1.5" style="display:none"/>
            <path id="scene1-angle-d" d="M 275,177 A 20,20 0 0 1 270,195" fill="none" stroke="#000000" stroke-width="1.5" style="display:none"/>
            <path id="scene1-angle-b" d="M 600,320 A 20,20 0 0 1 610,302.7" fill="none" stroke="#000000" stroke-width="1.5" style="display:none"/>
            <path id="scene1-angle-e" d="M 463,82 A 20,20 0 0 0 473,100" fill="none" stroke="#000000" stroke-width="1.5" style="display:none"/>
            
            <!-- 等长标记（步骤1） -->
            <line id="scene1-tick-ac" x1="258" y1="328" x2="266" y2="336" stroke="#000000" stroke-width="1.5" style="display:none"/>
            <line id="scene1-tick-cd" x1="299" y1="254" x2="307" y2="246" stroke="#000000" stroke-width="1.5" style="display:none"/>
            <line id="scene1-tick-da" x1="216" y1="254" x2="224" y2="246" stroke="#000000" stroke-width="1.5" style="display:none"/>
            <line id="scene1-tick-cb" x1="478" y1="328" x2="486" y2="336" stroke="#000000" stroke-width="1.5" style="display:none"/>
            <line id="scene1-tick-ce" x1="408" y1="208" x2="416" y2="200" stroke="#000000" stroke-width="1.5" style="display:none"/>
            <line id="scene1-tick-eb" x1="547" y1="208" x2="555" y2="200" stroke="#000000" stroke-width="1.5" style="display:none"/>
            
            <!-- 平行箭头（步骤2） -->
            <g id="scene1-parallel-arrows" style="display:none">
                <line x1="332" y1="297" x2="342" y2="297" stroke="#c62828" stroke-width="1.5" marker-end="url(#scene1-arrow-red)"/>
                <line x1="517" y1="260" x2="527" y2="260" stroke="#c62828" stroke-width="1.5" marker-end="url(#scene1-arrow-red)"/>
            </g>
            
            <!-- 箭头定义 -->
            <defs>
                <marker id="scene1-arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#c62828"/>
                </marker>
            </defs>
            
            <!-- 标签 -->
            <text id="scene1-label-a" x="165" y="345" font-size="14" fill="#000000" text-anchor="middle">A</text>
            <text id="scene1-label-b" x="635" y="345" font-size="14" fill="#000000" text-anchor="middle">B</text>
            <text id="scene1-label-c" x="355" y="345" font-size="14" fill="#000000" text-anchor="middle">C</text>
            <text id="scene1-label-d" x="235" y="145" font-size="14" fill="#000000" text-anchor="middle">D</text>
            <text id="scene1-label-e" x="505" y="55" font-size="14" fill="#000000" text-anchor="middle">E</text>
            <text id="scene1-label-p" x="395" y="85" font-size="14" fill="#000000" text-anchor="middle">P</text>
            <text id="scene1-label-f" x="590" y="230" font-size="14" fill="#000000" text-anchor="middle">F</text>
            <text id="scene1-label-g" x="285" y="315" font-size="14" fill="#000000" text-anchor="middle">G</text>
            <text id="scene1-label-h" x="425" y="285" font-size="14" fill="#000000" text-anchor="middle">H</text>
            
            <!-- AB=8 标注 -->
            <text id="scene1-text-ab8" x="400" y="365" font-size="14" fill="#000000" text-anchor="middle">AB = 8</text>
            
            <!-- 步骤4标注 -->
            <text id="scene1-text-ac4" x="290" y="358" font-size="14" fill="#000000" text-anchor="middle" style="display:none">AC = 4</text>
            <text id="scene1-text-cb4" x="510" y="358" font-size="14" fill="#000000" text-anchor="middle" style="display:none">CB = 4</text>
            <text id="scene1-text-cp" x="450" y="225" font-size="14" fill="#000000" text-anchor="start" style="display:none">CP = 2√3</text>
            
            <!-- 右侧结论文字 -->
            <text id="scene1-text-conclusion" x="650" y="150" font-size="14" fill="#000000" text-anchor="start" style="display:none"></text>
            <text id="scene1-text-ratio" x="660" y="200" font-size="16" fill="#c62828" text-anchor="start" font-weight="bold" style="display:none">AG : GH : HF = 3 : 1 : 2</text>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 0/5</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现
        var currentStep = 0;
        var isAnimating = false;
        
        // 基础坐标
        var A = {x: 180, y: 320};
        var B = {x: 620, y: 320};
        var C1 = {x: 345, y: 320}; // 图1 C点
        var C2 = {x: 400, y: 320}; // 图2 C点
        
        // 获取元素引用
        function getEl(id) { return document.getElementById(id); }
        
        // 显示/隐藏元素
        function show(id) { var el = getEl(id); if(el) { el.style.display = ''; el.style.opacity = '1'; } }
        function hide(id) { var el = getEl(id); if(el) { el.style.display = 'none'; } }
        function setStroke(id, color, width) { var el = getEl(id); if(el) { el.setAttribute('stroke', color); if(width) el.setAttribute('stroke-width', width); } }
        function setFill(id, color) { var el = getEl(id); if(el) { el.setAttribute('fill', color); } }
        
        // 计算几何坐标
        function computeGeometry(cx) {
            var C = {x: cx, y: 320};
            var AC = C.x - A.x;
            var CB = B.x - C.x;
            var h1 = AC * Math.sqrt(3) / 2;
            var h2 = CB * Math.sqrt(3) / 2;
            var D = {x: A.x + AC/2, y: A.y - h1};
            var E = {x: C.x + CB/2, y: C.y - h2};
            var P = {x: (D.x + E.x)/2, y: (D.y + E.y)/2};
            var F = {x: (B.x + E.x)/2, y: (B.y + E.y)/2};
            
            // G = AF ∩ DC
            var t_g = solveIntersection(A, F, D, C);
            var G = {x: A.x + t_g * (F.x - A.x), y: A.y + t_g * (F.y - A.y)};
            
            // H = AF ∩ CE
            var t_h = solveIntersection(A, F, C, E);
            var H = {x: A.x + t_h * (F.x - A.x), y: A.y + t_h * (F.y - A.y)};
            
            return {A: A, B: B, C: C, D: D, E: E, P: P, F: F, G: G, H: H, AC: AC, CB: CB};
        }
        
        // 解两线段交点参数 t (P = A + t*(B-A))
        function solveIntersection(A, B, C, D) {
            var dx1 = B.x - A.x, dy1 = B.y - A.y;
            var dx2 = D.x - C.x, dy2 = D.y - C.y;
            var det = dx1 * dy2 - dy1 * dx2;
            if (Math.abs(det) < 1e-9) return 0.5;
            var dx3 = C.x - A.x, dy3 = C.y - A.y;
            var t = (dx3 * dy2 - dy3 * dx2) / det;
            return t;
        }
        
        // 更新SVG元素坐标
        function updateGeometry(geom) {
            var g = geom;
            // 更新点坐标
            setAttr('scene1-point-c', 'cx', g.C.x); setAttr('scene1-point-c', 'cy', g.C.y);
            setAttr('scene1-point-d', 'cx', g.D.x); setAttr('scene1-point-d', 'cy', g.D.y);
            setAttr('scene1-point-e', 'cx', g.E.x); setAttr('scene1-point-e', 'cy', g.E.y);
            setAttr('scene1-point-p', 'cx', g.P.x); setAttr('scene1-point-p', 'cy', g.P.y);
            setAttr('scene1-point-f', 'cx', g.F.x); setAttr('scene1-point-f', 'cy', g.F.y);
            setAttr('scene1-point-g', 'cx', g.G.x); setAttr('scene1-point-g', 'cy', g.G.y);
            setAttr('scene1-point-h', 'cx', g.H.x); setAttr('scene1-point-h', 'cy', g.H.y);
            
            // 更新线段端点
            setLine('scene1-line-ac', A.x, A.y, g.C.x, g.C.y);
            setLine('scene1-line-cb', g.C.x, g.C.y, B.x, B.y);
            setLine('scene1-line-ad', A.x, A.y, g.D.x, g.D.y);
            setLine('scene1-line-cd', g.C.x, g.C.y, g.D.x, g.D.y);
            setLine('scene1-line-be', B.x, B.y, g.E.x, g.E.y);
            setLine('scene1-line-ce', g.C.x, g.C.y, g.E.x, g.E.y);
            setLine('scene1-line-de', g.D.x, g.D.y, g.E.x, g.E.y);
            setLine('scene1-line-af', A.x, A.y, g.F.x, g.F.y);
            setLine('scene1-line-ae', A.x, A.y, g.E.x, g.E.y);
            setLine('scene1-line-db', g.D.x, g.D.y, B.x, B.y);
            setLine('scene1-line-cg', g.C.x, g.C.y, g.G.x, g.G.y);
            setLine('scene1-line-cp', g.C.x, g.C.y, g.P.x, g.P.y);
            setLine('scene1-seg-ag', A.x, A.y, g.G.x, g.G.y);
            setLine('scene1-seg-gh', g.G.x, g.G.y, g.H.x, g.H.y);
            setLine('scene1-seg-hf', g.H.x, g.H.y, g.F.x, g.F.y);
            
            // 更新三角形填充
            setPoly('scene1-tri-acd-fill', [A.x, A.y, g.C.x, g.C.y, g.D.x, g.D.y]);
            setPoly('scene1-tri-bce-fill', [g.C.x, g.C.y, B.x, B.y, g.E.x, g.E.y]);
            
            // 更新中点标记
            setLine('scene1-mark-p', g.P.x, g.P.y - 6, g.P.x, g.P.y + 6);
            setLine('scene1-mark-f', g.F.x, g.F.y - 6, g.F.x, g.F.y + 6);
            
            // 更新标签位置（使用更大偏移避免与线段重叠）
            setAttr('scene1-label-c', 'x', g.C.x + 10); setAttr('scene1-label-c', 'y', g.C.y + 25);
            setAttr('scene1-label-d', 'x', g.D.x - 27); setAttr('scene1-label-d', 'y', g.D.y - 32);
            setAttr('scene1-label-e', 'x', g.E.x + 22); setAttr('scene1-label-e', 'y', g.E.y - 27);
            setAttr('scene1-label-p', 'x', g.P.x + 22); setAttr('scene1-label-p', 'y', g.P.y - 44);
            setAttr('scene1-label-f', 'x', g.F.x + 30); setAttr('scene1-label-f', 'y', g.F.y + 22);
            setAttr('scene1-label-g', 'x', g.G.x - 30); setAttr('scene1-label-g', 'y', g.G.y + 30);
            setAttr('scene1-label-h', 'x', g.H.x + 30); setAttr('scene1-label-h', 'y', g.H.y + 25);
            
            // 更新直角符号
            var ra = getEl('scene1-right-angle');
            if(ra) {
                var pts = [g.C.x, g.C.y, g.C.x, g.C.y - 8, g.C.x + 8, g.C.y - 8, g.C.x + 8, g.C.y];
                ra.setAttribute('points', pts.join(' '));
            }
            
            // 更新等长标记
            updateTick('scene1-tick-ac', A, g.C);
            updateTick('scene1-tick-cd', g.C, g.D);
            updateTick('scene1-tick-da', g.D, A);
            updateTick('scene1-tick-cb', g.C, B);
            updateTick('scene1-tick-ce', g.C, g.E);
            updateTick('scene1-tick-eb', g.E, B);
            
            // 更新平行箭头
            var parr = getEl('scene1-parallel-arrows');
            if(parr) {
                var cgMid = {x: (g.C.x + g.G.x)/2, y: (g.C.y + g.G.y)/2};
                var beMid = {x: (B.x + g.E.x)/2, y: (B.y + g.E.y)/2};
                var lines = parr.querySelectorAll('line');
                if(lines.length >= 2) {
                    lines[0].setAttribute('x1', cgMid.x - 5); lines[0].setAttribute('y1', cgMid.y);
                    lines[0].setAttribute('x2', cgMid.x + 5); lines[0].setAttribute('y2', cgMid.y);
                    lines[1].setAttribute('x1', beMid.x - 5); lines[1].setAttribute('y1', beMid.y);
                    lines[1].setAttribute('x2', beMid.x + 5); lines[1].setAttribute('y2', beMid.y);
                }
            }
            
            // 更新60°角标
            updateAngleArc('scene1-angle-a', A, g.C, g.D, 20);
            updateAngleArc('scene1-angle-c1', g.C, A, g.D, 20);
            updateAngleArc('scene1-angle-c2', g.C, B, g.E, 20);
            updateAngleArc('scene1-angle-d', g.D, A, g.C, 20);
            updateAngleArc('scene1-angle-b', B, g.C, g.E, 20);
            updateAngleArc('scene1-angle-e', g.E, B, g.C, 20);
        }
        
        function setAttr(id, attr, val) { var el = getEl(id); if(el) el.setAttribute(attr, val); }
        function setLine(id, x1, y1, x2, y2) { var el = getEl(id); if(el) { el.setAttribute('x1', x1); el.setAttribute('y1', y1); el.setAttribute('x2', x2); el.setAttribute('y2', y2); } }
        function setPoly(id, pts) { var el = getEl(id); if(el) { var s = ''; for(var i=0;i<pts.length;i+=2) s += (i>0?' ':'') + pts[i] + ',' + pts[i+1]; el.setAttribute('points', s); } }
        
        function updateTick(id, P1, P2) {
            var el = getEl(id);
            if(!el) return;
            var mx = (P1.x + P2.x) / 2;
            var my = (P1.y + P2.y) / 2;
            var dx = P2.x - P1.x;
            var dy = P2.y - P1.y;
            var len = Math.sqrt(dx*dx + dy*dy);
            if(len < 1) return;
            var nx = -dy / len;
            var ny = dx / len;
            var half = 4;
            el.setAttribute('x1', mx - half * nx);
            el.setAttribute('y1', my - half * ny);
            el.setAttribute('x2', mx + half * nx);
            el.setAttribute('y2', my + half * ny);
        }
        
        function updateAngleArc(id, vertex, P1, P2, r) {
            var el = getEl(id);
            if(!el) return;
            var a1 = Math.atan2(P1.y - vertex.y, P1.x - vertex.x);
            var a2 = Math.atan2(P2.y - vertex.y, P2.x - vertex.x);
            var largeArc = 0;
            var sweep = 1;
            var diff = a2 - a1;
            while(diff <= -Math.PI) diff += 2*Math.PI;
            while(diff > Math.PI) diff -= 2*Math.PI;
            if(Math.abs(diff) > Math.PI) largeArc = 1;
            if(diff < 0) sweep = 0;
            var x1 = vertex.x + r * Math.cos(a1);
            var y1 = vertex.y + r * Math.sin(a1);
            var x2 = vertex.x + r * Math.cos(a2);
            var y2 = vertex.y + r * Math.sin(a2);
            el.setAttribute('d', 'M ' + x1 + ',' + y1 + ' A ' + r + ',' + r + ' 0 ' + largeArc + ' ' + sweep + ' ' + x2 + ',' + y2);
        }
        
        // 缓动函数
        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }
        
        // C点动画
        function animateC(targetX, duration, callback) {
            isAnimating = true;
            var startX = parseFloat(getEl('scene1-point-c').getAttribute('cx'));
            var startTime = performance.now();
            
            function frame(now) {
                var elapsed = now - startTime;
                var progress = Math.min(elapsed / duration, 1);
                var eased = easeInOutCubic(progress);
                var cx = startX + (targetX - startX) * eased;
                var geom = computeGeometry(cx);
                updateGeometry(geom);
                
                if(progress < 1) {
                    requestAnimationFrame(frame);
                } else {
                    isAnimating = false;
                    if(callback) callback();
                }
            }
            requestAnimationFrame(frame);
        }
        
        // 渲染步骤
        function renderStep() {
            var step = currentStep;
            getEl('scene1-step-indicator').textContent = '步骤 ' + step + '/5';
            getEl('scene1-btn-prev').disabled = (step === 0);
            getEl('scene1-btn-next').disabled = (step === 5);
            
            // 重置所有特殊样式
            setStroke('scene1-line-ad', '#000000', 2);
            setStroke('scene1-line-cd', '#000000', 2);
            setStroke('scene1-line-be', '#000000', 2);
            setStroke('scene1-line-ce', '#000000', 2);
            setStroke('scene1-line-af', '#000000', 2);
            setFill('scene1-tri-acd-fill', 'none');
            setFill('scene1-tri-bce-fill', 'none');
            setStroke('scene1-tri-acd-fill', 'none');
            setStroke('scene1-tri-bce-fill', 'none');
            
            // 隐藏所有步骤专属元素
            hide('scene1-angle-a'); hide('scene1-angle-c1'); hide('scene1-angle-c2');
            hide('scene1-angle-d'); hide('scene1-angle-b'); hide('scene1-angle-e');
            hide('scene1-tick-ac'); hide('scene1-tick-cd'); hide('scene1-tick-da');
            hide('scene1-tick-cb'); hide('scene1-tick-ce'); hide('scene1-tick-eb');
            hide('scene1-line-cg'); hide('scene1-parallel-arrows');
            hide('scene1-line-ae'); hide('scene1-line-db');
            hide('scene1-line-cp'); hide('scene1-right-angle');
            hide('scene1-text-ac4'); hide('scene1-text-cb4'); hide('scene1-text-cp');
            hide('scene1-seg-ag'); hide('scene1-seg-gh'); hide('scene1-seg-hf');
            hide('scene1-text-conclusion'); hide('scene1-text-ratio');
            show('scene1-line-af');
            
            if(step === 0) {
                // 步骤0：基础图1
                var geom = computeGeometry(C1.x);
                updateGeometry(geom);
            }
            else if(step === 1) {
                // 步骤1：高亮等边三角形
                var geom = computeGeometry(C1.x);
                updateGeometry(geom);
                setFill('scene1-tri-acd-fill', 'rgba(21,101,192,0.15)');
                setStroke('scene1-tri-acd-fill', '#1565c0');
                setFill('scene1-tri-bce-fill', 'rgba(46,125,50,0.15)');
                setStroke('scene1-tri-bce-fill', '#2e7d32');
                show('scene1-angle-a'); show('scene1-angle-c1'); show('scene1-angle-c2');
                show('scene1-angle-d'); show('scene1-angle-b'); show('scene1-angle-e');
                show('scene1-tick-ac'); show('scene1-tick-cd'); show('scene1-tick-da');
                show('scene1-tick-cb'); show('scene1-tick-ce'); show('scene1-tick-eb');
            }
            else if(step === 2) {
                // 步骤2：平行与相似
                var geom = computeGeometry(C1.x);
                updateGeometry(geom);
                setFill('scene1-tri-acd-fill', 'rgba(21,101,192,0.15)');
                setStroke('scene1-tri-acd-fill', '#1565c0');
                setFill('scene1-tri-bce-fill', 'rgba(46,125,50,0.15)');
                setStroke('scene1-tri-bce-fill', '#2e7d32');
                show('scene1-line-cg');
                show('scene1-parallel-arrows');
                setStroke('scene1-line-ad', '#c62828', 2.5);
                setStroke('scene1-line-cd', '#c62828', 2.5);
                setStroke('scene1-line-be', '#c62828', 2.5);
                setStroke('scene1-line-af', '#c62828', 2.5);
                var tc = getEl('scene1-text-conclusion');
                tc.textContent = '△ACG ~ △ABF';
                tc.setAttribute('fill', '#c62828');
                show('scene1-text-conclusion');
            }
            else if(step === 3) {
                // 步骤3：旋转全等
                var geom = computeGeometry(C1.x);
                updateGeometry(geom);
                show('scene1-line-ae'); show('scene1-line-db');
                setStroke('scene1-line-ad', '#1565c0', 2.5);
                setStroke('scene1-line-cd', '#1565c0', 2.5);
                setStroke('scene1-line-be', '#1565c0', 2.5);
                setStroke('scene1-line-ce', '#1565c0', 2.5);
                var tc = getEl('scene1-text-conclusion');
                tc.textContent = '△ACE ≅ △DCB';
                tc.setAttribute('fill', '#1565c0');
                show('scene1-text-conclusion');
            }
            else if(step === 4) {
                // 步骤4：C移至中点（动画完成后状态）
                var geom = computeGeometry(C2.x);
                updateGeometry(geom);
                show('scene1-line-cp');
                show('scene1-right-angle');
                show('scene1-text-ac4'); show('scene1-text-cb4'); show('scene1-text-cp');
            }
            else if(step === 5) {
                // 步骤5：比例结论
                var geom = computeGeometry(C2.x);
                updateGeometry(geom);
                hide('scene1-line-af');
                show('scene1-seg-ag'); show('scene1-seg-gh'); show('scene1-seg-hf');
                show('scene1-text-ratio');
            }
        }
        
        // 事件绑定
        getEl('scene1-btn-prev').addEventListener('click', function() {
            if(currentStep > 0 && !isAnimating) {
                currentStep--;
                if(currentStep < 4) {
                    // 回退到步骤3或更早，C重置到图1位置
                    var geom = computeGeometry(C1.x);
                    updateGeometry(geom);
                }
                renderStep();
            }
        });
        
        getEl('scene1-btn-next').addEventListener('click', function() {
            if(currentStep < 5 && !isAnimating) {
                currentStep++;
                if(currentStep === 4) {
                    // 从步骤3进入步骤4，先隐藏步骤3元素，再播放动画
                    hide('scene1-line-ae'); hide('scene1-line-db');
                    hide('scene1-text-conclusion');
                    setStroke('scene1-line-ad', '#000000', 2);
                    setStroke('scene1-line-cd', '#000000', 2);
                    setStroke('scene1-line-be', '#000000', 2);
                    setStroke('scene1-line-ce', '#000000', 2);
                    animateC(C2.x, 800, function() {
                        show('scene1-line-cp');
                        show('scene1-right-angle');
                        show('scene1-text-ac4');
                        show('scene1-text-cb4');
                        show('scene1-text-cp');
                    });
                } else {
                    renderStep();
                }
            }
        });
        
        // 初始化
        renderStep();
        
    })();
    </script>
</body>
</html>
