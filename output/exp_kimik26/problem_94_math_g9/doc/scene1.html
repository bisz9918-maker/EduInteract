<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三棱柱表面展开图</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; align-items: center; z-index: 10; }
        #scene1-controls button { padding: 6px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: #f5f5f5; }
        #scene1-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
        #scene1-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene1-step-text { font-size: 14px; color: #333; min-width: 60px; text-align: center; }

        /* 面的过渡动画 */
        .scene1-face-anim { transition: transform 0.6s ease-out, opacity 0.6s ease-out; }
        .scene1-fade-anim { transition: opacity 0.4s ease-out; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- ===== 立体图棱线组 ===== -->
            <g id="scene1-solid-edges">
                <!-- 虚线棱（被遮挡） -->
                <line id="scene1-edge-ac" x1="160" y1="360" x2="220" y2="280" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
                <line id="scene1-edge-ad" x1="160" y1="360" x2="160" y2="200" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
                <line id="scene1-edge-df" x1="160" y1="200" x2="220" y2="120" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
                <!-- 实线棱 -->
                <line id="scene1-edge-ab" x1="160" y1="360" x2="280" y2="360" stroke="#000000" stroke-width="2"/>
                <line id="scene1-edge-bc" x1="280" y1="360" x2="220" y2="280" stroke="#000000" stroke-width="2"/>
                <line id="scene1-edge-de" x1="160" y1="200" x2="280" y2="200" stroke="#000000" stroke-width="2"/>
                <line id="scene1-edge-ef" x1="280" y1="200" x2="220" y2="120" stroke="#000000" stroke-width="2"/>
                <line id="scene1-edge-be" x1="280" y1="360" x2="280" y2="200" stroke="#000000" stroke-width="2"/>
                <line id="scene1-edge-cf" x1="220" y1="280" x2="220" y2="120" stroke="#000000" stroke-width="2"/>
            </g>

            <!-- ===== 步骤1：淡灰轮廓（参照） ===== -->
            <g id="scene1-ghost-faces" class="scene1-fade-anim" opacity="0">
                <polygon points="160,360 280,360 220,280" fill="none" stroke="#888888" stroke-width="1" opacity="0.3"/>
                <polygon points="160,200 280,200 220,120" fill="none" stroke="#888888" stroke-width="1" opacity="0.3"/>
                <polygon points="160,360 280,360 280,200 160,200" fill="none" stroke="#888888" stroke-width="1" opacity="0.3"/>
                <polygon points="280,360 220,280 220,120 280,200" fill="none" stroke="#888888" stroke-width="1" opacity="0.3"/>
                <polygon points="160,360 220,280 220,120 160,200" fill="none" stroke="#888888" stroke-width="1" opacity="0.3"/>
            </g>

            <!-- ===== 步骤1：分离的面（可移动） ===== -->
            <g id="scene1-separated-faces" class="scene1-face-anim" opacity="0">
                <!-- 底面ABC -->
                <polygon id="scene1-sep-abc" points="160,360 280,360 220,280" fill="#c62828" fill-opacity="0.2" stroke="#c62828" stroke-width="2"/>
                <!-- 顶面DEF -->
                <polygon id="scene1-sep-def" points="160,200 280,200 220,120" fill="#c62828" fill-opacity="0.2" stroke="#c62828" stroke-width="2"/>
                <!-- 前面ABED -->
                <polygon id="scene1-sep-abed" points="160,360 280,360 280,200 160,200" fill="#1565c0" fill-opacity="0.2" stroke="#1565c0" stroke-width="2"/>
                <!-- 右侧面BCFE -->
                <polygon id="scene1-sep-bcfe" points="280,360 220,280 220,120 280,200" fill="#1565c0" fill-opacity="0.2" stroke="#1565c0" stroke-width="2"/>
                <!-- 左侧面ACFD -->
                <polygon id="scene1-sep-acfd" points="160,360 220,280 220,120 160,200" fill="#1565c0" fill-opacity="0.2" stroke="#1565c0" stroke-width="2"/>
            </g>

            <!-- ===== 顶点标签 ===== -->
            <g id="scene1-vertex-labels">
                <text id="scene1-label-a" x="140" y="378" font-size="14" font-style="italic" fill="#000000" text-anchor="end">A</text>
                <text id="scene1-label-b" x="310" y="378" font-size="14" font-style="italic" fill="#000000">B</text>
                <text id="scene1-label-c" x="330" y="278" font-size="14" font-style="italic" fill="#000000" text-anchor="middle">C</text>
                <text id="scene1-label-d" x="105" y="188" font-size="14" font-style="italic" fill="#000000" text-anchor="end">D</text>
                <text id="scene1-label-e" x="310" y="188" font-size="14" font-style="italic" fill="#000000">E</text>
                <text id="scene1-label-f" x="220" y="55" font-size="14" font-style="italic" fill="#000000" text-anchor="middle">F</text>
            </g>

            <!-- ===== 步骤1：面组成标签 ===== -->
            <g id="scene1-step1-labels" class="scene1-fade-anim" opacity="0">
                <text id="scene1-label-side" x="370" y="250" font-size="16" fill="#000000">侧面 ×3</text>
                <text id="scene1-label-base" x="370" y="300" font-size="16" fill="#000000">底面 ×2</text>
                <text id="scene1-label-total" x="320" y="40" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">共 5 个面</text>
            </g>

            <!-- ===== 步骤2：剪开线 ===== -->
            <line id="scene1-cut-line" x1="282" y1="360" x2="282" y2="200" stroke="#2e7d32" stroke-width="2" stroke-dasharray="6,4" class="scene1-fade-anim" opacity="0"/>

            <!-- ===== 展开图组 ===== -->
            <g id="scene1-unfold-group" class="scene1-fade-anim" opacity="0">
                <rect id="scene1-unfold-rect1" x="420" y="170" width="120" height="160" fill="#1565c0" fill-opacity="0" stroke="#000000" stroke-width="2"/>
                <rect id="scene1-unfold-rect2" x="540" y="170" width="120" height="160" fill="#1565c0" fill-opacity="0" stroke="#000000" stroke-width="2"/>
                <rect id="scene1-unfold-rect3" x="660" y="170" width="120" height="160" fill="#1565c0" fill-opacity="0" stroke="#000000" stroke-width="2"/>
                <polygon id="scene1-unfold-base" points="540,330 660,330 600,410" fill="#c62828" fill-opacity="0" stroke="#000000" stroke-width="2"/>
                <polygon id="scene1-unfold-top" points="540,170 660,170 600,90" fill="#c62828" fill-opacity="0" stroke="#000000" stroke-width="2"/>
            </g>

            <!-- ===== 步骤3：特征文字 ===== -->
            <g id="scene1-features" class="scene1-fade-anim" opacity="0">
                <text id="scene1-feature-1" x="50" y="40" font-size="16" fill="#2e7d32">① 3个矩形侧面</text>
                <text id="scene1-feature-2" x="50" y="78" font-size="16" fill="#2e7d32">② 2个三角形底面</text>
                <text id="scene1-feature-3" x="50" y="116" font-size="16" fill="#2e7d32">③ 三角形分居矩形条两侧</text>
                <text id="scene1-check-1" x="680" y="95" font-size="18" fill="#2e7d32">✓</text>
                <text id="scene1-check-2" x="680" y="410" font-size="18" fill="#2e7d32">✓</text>
            </g>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <span id="scene1-step-text">步骤 1/4</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        var currentStep = 0; // 0,1,2,3
        var totalSteps = 4;

        var btnPrev = document.getElementById('scene1-btn-prev');
        var btnNext = document.getElementById('scene1-btn-next');
        var stepText = document.getElementById('scene1-step-text');

        var solidEdges = document.getElementById('scene1-solid-edges');
        var ghostFaces = document.getElementById('scene1-ghost-faces');
        var separatedFaces = document.getElementById('scene1-separated-faces');
        var vertexLabels = document.getElementById('scene1-vertex-labels');
        var step1Labels = document.getElementById('scene1-step1-labels');
        var cutLine = document.getElementById('scene1-cut-line');
        var unfoldGroup = document.getElementById('scene1-unfold-group');
        var features = document.getElementById('scene1-features');

        var sepAbc = document.getElementById('scene1-sep-abc');
        var sepDef = document.getElementById('scene1-sep-def');
        var sepAbed = document.getElementById('scene1-sep-abed');
        var sepBcfe = document.getElementById('scene1-sep-bcfe');
        var sepAcfd = document.getElementById('scene1-sep-acfd');

        var unfoldRect1 = document.getElementById('scene1-unfold-rect1');
        var unfoldRect2 = document.getElementById('scene1-unfold-rect2');
        var unfoldRect3 = document.getElementById('scene1-unfold-rect3');
        var unfoldBase = document.getElementById('scene1-unfold-base');
        var unfoldTop = document.getElementById('scene1-unfold-top');

        function show(el) {
            if (!el) return;
            el.style.display = 'block';
            el.style.opacity = '1';
        }

        function hide(el) {
            if (!el) return;
            el.style.display = 'none';
            el.style.opacity = '0';
        }

        function setOpacity(el, val) {
            if (!el) return;
            el.style.opacity = val;
        }

        function setTransform(el, tx, ty) {
            if (!el) return;
            el.style.transform = 'translate(' + tx + 'px,' + ty + 'px)';
        }

        function renderStep() {
            stepText.textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps - 1);

            if (currentStep === 0) {
                // 步骤0：初始立体图
                show(solidEdges);
                hide(ghostFaces);
                hide(separatedFaces);
                show(vertexLabels);
                hide(step1Labels);
                hide(cutLine);
                hide(unfoldGroup);
                hide(features);

                // 重置分离面的位置
                setTransform(sepAbc, 0, 0);
                setTransform(sepDef, 0, 0);
                setTransform(sepAbed, 0, 0);
                setTransform(sepBcfe, 0, 0);
                setTransform(sepAcfd, 0, 0);

                // 重置展开图填充
                unfoldRect1.setAttribute('fill-opacity', '0');
                unfoldRect2.setAttribute('fill-opacity', '0');
                unfoldRect3.setAttribute('fill-opacity', '0');
                unfoldBase.setAttribute('fill-opacity', '0');
                unfoldTop.setAttribute('fill-opacity', '0');
            } else if (currentStep === 1) {
                // 步骤1：面分离
                show(solidEdges);
                show(ghostFaces);
                show(separatedFaces);
                show(vertexLabels);
                show(step1Labels);
                hide(cutLine);
                hide(unfoldGroup);
                hide(features);

                // 分离偏移
                setTransform(sepAbc, 0, 50);
                setTransform(sepDef, 0, -50);
                setTransform(sepAbed, 0, 30);
                setTransform(sepBcfe, 30, 30);
                setTransform(sepAcfd, -30, -30);

                unfoldRect1.setAttribute('fill-opacity', '0');
                unfoldRect2.setAttribute('fill-opacity', '0');
                unfoldRect3.setAttribute('fill-opacity', '0');
                unfoldBase.setAttribute('fill-opacity', '0');
                unfoldTop.setAttribute('fill-opacity', '0');
            } else if (currentStep === 2) {
                // 步骤2：展开动画
                setOpacity(solidEdges, 0.2);
                setOpacity(ghostFaces, 0.3);
                hide(separatedFaces);
                show(vertexLabels);
                hide(step1Labels);
                show(cutLine);
                show(unfoldGroup);
                hide(features);

                // 分离面飞到展开图位置（大致方向，然后淡出）
                setTransform(sepAbc, 380, 30);
                setTransform(sepDef, 380, -30);
                setTransform(sepAbed, 380, 0);
                setTransform(sepBcfe, 380, 0);
                setTransform(sepAcfd, 380, 0);

                unfoldRect1.setAttribute('fill-opacity', '0');
                unfoldRect2.setAttribute('fill-opacity', '0');
                unfoldRect3.setAttribute('fill-opacity', '0');
                unfoldBase.setAttribute('fill-opacity', '0');
                unfoldTop.setAttribute('fill-opacity', '0');
            } else if (currentStep === 3) {
                // 步骤3：特征总结
                hide(solidEdges);
                hide(ghostFaces);
                hide(separatedFaces);
                hide(vertexLabels);
                hide(step1Labels);
                hide(cutLine);
                show(unfoldGroup);
                show(features);

                unfoldRect1.setAttribute('fill-opacity', '0.1');
                unfoldRect2.setAttribute('fill-opacity', '0.1');
                unfoldRect3.setAttribute('fill-opacity', '0.1');
                unfoldBase.setAttribute('fill-opacity', '0.1');
                unfoldTop.setAttribute('fill-opacity', '0.1');
            }
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                renderStep();
            }
        });

        // 初始渲染
        renderStep();
    })();
    </script>
</body>
</html>
