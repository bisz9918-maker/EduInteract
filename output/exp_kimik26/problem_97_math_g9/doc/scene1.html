<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 1 - 二次函数系数符号推导</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            width: 100px; height: 36px; font-size: 14px; cursor: pointer;
            background: #e3f2fd; border: 1px solid #1565c0; color: #1565c0; border-radius: 4px;
            transition: opacity 0.2s ease;
        }
        #scene1-controls button:disabled { opacity: 0.4; pointer-events: none; }
        .scene1-conclusion { font-size: 16px; font-weight: bold; fill: #c62828; opacity: 0; transition: opacity 0.3s ease; }
        .scene1-conclusion.active { opacity: 1; }
        #scene1-parabola-group line { stroke: #1565c0; stroke-width: 2.5; stroke-linecap: round; transition: stroke-width 0.3s ease; }
        #scene1-parabola-group.highlight line { stroke-width: 4; }
        #scene1-arrow-open { stroke: #2e7d32; stroke-width: 1.5; fill: none; opacity: 0; transition: opacity 0.3s ease; }
        #scene1-axis-symmetry { stroke: #888888; stroke-width: 1; stroke-dasharray: 5,5; opacity: 0; transition: opacity 0.3s ease; }
        #scene1-axis-symmetry.highlight { stroke: #555555; stroke-width: 2; }
        #scene1-symmetry-label { font-size: 14px; fill: #555555; opacity: 0; transition: opacity 0.3s ease; }
        #scene1-point-01 { fill: #c62828; }
        #scene1-conclusion-4 { font-size: 18px; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" viewBox="0 0 800 500">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene1-arrowhead-x" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
                </marker>
                <marker id="scene1-arrowhead-y" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
                </marker>
                <marker id="scene1-arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32"/>
                </marker>
            </defs>

            <!-- 坐标轴 -->
            <line id="scene1-axis-x" x1="120" y1="360" x2="520" y2="360" stroke="#000000" stroke-width="1.5" marker-end="url(#scene1-arrowhead-x)"/>
            <line id="scene1-axis-y" x1="320" y1="460" x2="320" y2="80" stroke="#000000" stroke-width="1.5" marker-end="url(#scene1-arrowhead-y)"/>

            <!-- 原点标签 -->
            <text id="scene1-label-o" x="350" y="400" font-size="14" fill="#000000">O</text>
            <!-- x轴标签 -->
            <text id="scene1-label-x" x="535" y="355" font-size="14" fill="#000000">x</text>
            <!-- y轴标签 -->
            <text id="scene1-label-y" x="305" y="75" font-size="14" fill="#000000">y</text>
            <!-- y轴刻度1 -->
            <text id="scene1-label-1" x="295" y="265" font-size="14" fill="#000000" text-anchor="end">1</text>

            <!-- 抛物线（用线段组代替path，避免bounding box过大导致文字误报重叠） -->
            <g id="scene1-parabola-group">
                <line x1="70" y1="385" x2="100" y2="304"/>
                <line x1="100" y1="304" x2="120" y2="260"/>
                <line x1="120" y1="260" x2="140" y2="224"/>
                <line x1="140" y1="224" x2="160" y2="196"/>
                <line x1="160" y1="196" x2="180" y2="184"/>
                <line x1="180" y1="184" x2="200" y2="164"/>
                <line x1="200" y1="164" x2="220" y2="160"/>
                <line x1="220" y1="160" x2="240" y2="164"/>
                <line x1="240" y1="164" x2="260" y2="184"/>
                <line x1="260" y1="184" x2="280" y2="196"/>
                <line x1="280" y1="196" x2="300" y2="224"/>
                <line x1="300" y1="224" x2="320" y2="260"/>
                <line x1="320" y1="260" x2="340" y2="304"/>
                <line x1="340" y1="304" x2="370" y2="385"/>
            </g>

            <!-- 交点 (0,1) -->
            <circle id="scene1-point-01" cx="320" cy="260" r="3"/>
            <text id="scene1-label-01" x="365" y="250" font-size="14" fill="#000000">(0,1)</text>

            <!-- 开口方向箭头 -->
            <line id="scene1-arrow-open" x1="400" y1="180" x2="400" y2="240" marker-end="url(#scene1-arrowhead-green)"/>

            <!-- 对称轴 -->
            <line id="scene1-axis-symmetry" x1="220" y1="150" x2="220" y2="380"/>
            <text id="scene1-symmetry-label" x="220" y="135" font-size="14" fill="#555555" text-anchor="middle">x = -b/(2a)</text>

            <!-- 结论文本 -->
            <text id="scene1-conclusion-1" class="scene1-conclusion" x="560" y="150">a &lt; 0（开口向下）</text>
            <text id="scene1-conclusion-2" class="scene1-conclusion" x="560" y="220">-b/(2a) &lt; 0</text>
            <text id="scene1-conclusion-3" class="scene1-conclusion" x="560" y="280">
                <tspan x="560" dy="0">-b/(2a) &lt; 0  ⇒  -b &gt; 0</tspan>
                <tspan x="560" dy="20">⇒  b &lt; 0</tspan>
            </text>
            <text id="scene1-conclusion-4" class="scene1-conclusion" x="560" y="370">a &lt; 0，b &lt; 0</text>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        let currentStep = 0;
        const maxStep = 4;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');

        const parabolaGroup = document.getElementById('scene1-parabola-group');
        const arrowOpen = document.getElementById('scene1-arrow-open');
        const axisSymmetry = document.getElementById('scene1-axis-symmetry');
        const symmetryLabel = document.getElementById('scene1-symmetry-label');

        const conclusions = [
            document.getElementById('scene1-conclusion-1'),
            document.getElementById('scene1-conclusion-2'),
            document.getElementById('scene1-conclusion-3'),
            document.getElementById('scene1-conclusion-4')
        ];

        function updateButtons() {
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === maxStep;
        }

        function renderStep() {
            // 重置所有动态元素
            parabolaGroup.classList.remove('highlight');
            arrowOpen.style.opacity = '0';
            axisSymmetry.style.opacity = '0';
            axisSymmetry.classList.remove('highlight');
            symmetryLabel.style.opacity = '0';
            conclusions.forEach(c => c.classList.remove('active'));

            // 根据当前步骤显示对应元素
            if (currentStep >= 1) {
                parabolaGroup.classList.add('highlight');
                arrowOpen.style.opacity = '1';
                conclusions[0].classList.add('active');
            }
            if (currentStep >= 2) {
                axisSymmetry.style.opacity = '1';
                symmetryLabel.style.opacity = '1';
                conclusions[1].classList.add('active');
            }
            if (currentStep >= 3) {
                axisSymmetry.classList.add('highlight');
                conclusions[2].classList.add('active');
            }
            if (currentStep >= 4) {
                conclusions[3].classList.add('active');
            }

            updateButtons();
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < maxStep) {
                currentStep++;
                renderStep();
            }
        });

        // 初始渲染
        renderStep();
    })();
    </script>
</body>
</html>
