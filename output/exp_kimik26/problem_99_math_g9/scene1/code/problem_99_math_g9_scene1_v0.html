<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>等边三角形折叠问题 - 场景1</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
            display: block;
        }
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }
        #scene1-controls button {
            width: 90px;
            height: 32px;
            border: 1px solid #1565c0;
            border-radius: 4px;
            background: #ffffff;
            color: #1565c0;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        #scene1-controls button:hover:not(:disabled) {
            background: #1565c0;
            color: #ffffff;
        }
        #scene1-controls button:disabled {
            border-color: #cccccc;
            color: #cccccc;
            cursor: not-allowed;
        }
        #scene1-step-indicator {
            font-size: 12px;
            color: #666666;
            min-width: 80px;
            text-align: center;
        }
        .scene1-hidden {
            display: none !important;
        }
        .scene1-fade {
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 步骤0：基础图形（始终显示） -->
            <g id="scene1-step0-base">
                <!-- 等边三角形ABC（用三条线段绘制，避免polygon大bounding box导致标签误报重叠） -->
                <line id="scene1-line-ac" x1="280" y1="360" x2="400" y2="152" stroke="#000000" stroke-width="2"/>
                <line id="scene1-line-bc" x1="400" y1="152" x2="520" y2="360" stroke="#000000" stroke-width="2"/>
                <line id="scene1-line-ab" x1="520" y1="360" x2="280" y2="360" stroke="#000000" stroke-width="2"/>

                <!-- 折痕EF -->
                <line id="scene1-crease-ef" x1="344" y1="249" x2="470" y2="273" stroke="#1565c0" stroke-width="2"/>

                <!-- 点A -->
                <circle id="scene1-point-a" cx="280" cy="360" r="3" fill="#000000"/>
                <text id="scene1-label-a" x="260" y="375" font-size="14" fill="#000000" text-anchor="middle">A</text>

                <!-- 点B -->
                <circle id="scene1-point-b" cx="520" cy="360" r="3" fill="#000000"/>
                <text id="scene1-label-b" x="540" y="375" font-size="14" fill="#000000" text-anchor="middle">B</text>

                <!-- 点C -->
                <circle id="scene1-point-c" cx="400" cy="152" r="3" fill="#000000"/>
                <text id="scene1-label-c" x="400" y="135" font-size="14" fill="#000000" text-anchor="middle">C</text>

                <!-- 点D -->
                <circle id="scene1-point-d" cx="360" cy="360" r="3" fill="#000000"/>
                <text id="scene1-label-d" x="360" y="395" font-size="14" fill="#000000" text-anchor="middle">D</text>

                <!-- 点E -->
                <circle id="scene1-point-e" cx="344" cy="249" r="3" fill="#000000"/>
                <text id="scene1-label-e" x="272" y="245" font-size="14" fill="#000000" text-anchor="middle">E</text>

                <!-- 点F -->
                <circle id="scene1-point-f" cx="470" cy="273" r="3" fill="#000000"/>
                <text id="scene1-label-f" x="528" y="275" font-size="14" fill="#000000" text-anchor="middle">F</text>

                <!-- 已知条件标注 -->
                <text id="scene1-label-ad" x="315" y="380" font-size="13" fill="#c62828" text-anchor="middle">AD = 1</text>
                <text id="scene1-label-bd" x="445" y="380" font-size="13" fill="#c62828" text-anchor="middle">BD = 2</text>
                <text id="scene1-label-bf" x="590" y="305" font-size="13" fill="#c62828" text-anchor="middle">BF = 5/4</text>
            </g>

            <!-- 步骤1：辅助线CD + 折痕加粗 -->
            <g id="scene1-step1-cd" class="scene1-hidden scene1-fade">
                <!-- 辅助线CD -->
                <line id="scene1-line-cd" x1="400" y1="152" x2="360" y2="360" stroke="#888888" stroke-width="1.5" stroke-dasharray="6,4"/>
                <!-- 折痕加粗 -->
                <line id="scene1-crease-ef-bold" x1="344" y1="249" x2="470" y2="273" stroke="#1565c0" stroke-width="3"/>
            </g>

            <!-- 步骤2：折叠轴对称效果 -->
            <g id="scene1-step2-fold" class="scene1-hidden scene1-fade">
                <!-- 折叠示意△DEF（淡蓝填充，虚线边框） -->
                <polygon id="scene1-tri-def" points="360,360 344,249 470,273" fill="#1565c0" fill-opacity="0.15" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="6,4"/>
                <!-- C点降低不透明度（暗示原位置） -->
                <circle id="scene1-point-c-ghost" cx="400" cy="152" r="3" fill="#000000" fill-opacity="0.4"/>
                <text id="scene1-label-c-ghost" x="400" y="135" font-size="14" fill="#000000" fill-opacity="0.4" text-anchor="middle">C</text>
                <!-- 折叠箭头（从C到D的贝塞尔曲线） -->
                <path id="scene1-fold-arrow" d="M 400,152 Q 480,256 360,360" fill="none" stroke="#888888" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#scene1-arrowhead)"/>
                <!-- 重合标注 -->
                <text id="scene1-label-coincide" x="530" y="240" font-size="13" fill="#888888" text-anchor="middle">重合</text>
            </g>

            <!-- 步骤3：垂直平分线性质 -->
            <g id="scene1-step3-equals" class="scene1-hidden scene1-fade">
                <!-- 等长标记 EC -->
                <line x1="368.5" y1="198.5" x2="375.5" y2="202.5" stroke="#2e7d32" stroke-width="1.5"/>
                <!-- 等长标记 ED -->
                <line x1="356.0" y1="303.9" x2="348.0" y2="305.1" stroke="#2e7d32" stroke-width="1.5"/>
                <!-- 等长标记 FC -->
                <line x1="431.5" y1="214.5" x2="438.5" y2="210.5" stroke="#2e7d32" stroke-width="1.5"/>
                <!-- 等长标记 FD -->
                <line x1="417.5" y1="319.6" x2="412.5" y2="313.4" stroke="#2e7d32" stroke-width="1.5"/>
                <!-- 等量关系标注 -->
                <text id="scene1-label-ec-ed" x="263" y="305" font-size="13" fill="#2e7d32" text-anchor="middle">EC = ED</text>
                <text id="scene1-label-fc-fd" x="545" y="340" font-size="13" fill="#2e7d32" text-anchor="middle">FC = FD</text>
            </g>

            <!-- 步骤4：聚焦待求量 -->
            <g id="scene1-step4-target" class="scene1-hidden scene1-fade">
                <!-- CE线段高亮（红色） -->
                <line id="scene1-line-ce-highlight" x1="344" y1="249" x2="400" y2="152" stroke="#c62828" stroke-width="2"/>
                <!-- CE=x 标注 -->
                <text id="scene1-label-ce-x" x="265" y="192" font-size="13" fill="#c62828" text-anchor="middle">CE = x</text>
            </g>

            <!-- 箭头标记定义 -->
            <defs>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#888888"/>
                </marker>
            </defs>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1 / 5</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        // 状态变量
        let currentStep = 0;
        const totalSteps = 5; // 步骤0~4，显示为1~5

        // 元素引用
        const stepGroups = {
            1: document.getElementById('scene1-step1-cd'),
            2: document.getElementById('scene1-step2-fold'),
            3: document.getElementById('scene1-step3-equals'),
            4: document.getElementById('scene1-step4-target')
        };

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');

        // 基础折痕元素（步骤1时需要隐藏原折痕，显示加粗折痕）
        const baseCrease = document.getElementById('scene1-crease-ef');

        // 基础C点元素
        const basePointC = document.getElementById('scene1-point-c');
        const baseLabelC = document.getElementById('scene1-label-c');

        // 渲染当前步骤
        function renderStep() {
            // 更新步骤指示器
            stepIndicator.textContent = '步骤 ' + (currentStep + 1) + ' / ' + totalSteps;

            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps - 1);

            // 控制各步骤元素的显示/隐藏
            for (let i = 1; i <= 4; i++) {
                if (stepGroups[i]) {
                    if (i <= currentStep) {
                        stepGroups[i].classList.remove('scene1-hidden');
                    } else {
                        stepGroups[i].classList.add('scene1-hidden');
                    }
                }
            }

            // 步骤1及以上：隐藏基础折痕（因为步骤1有粗折痕覆盖）
            if (currentStep >= 1) {
                baseCrease.style.display = 'none';
            } else {
                baseCrease.style.display = 'block';
            }

            // 步骤2及以上：隐藏基础C点，显示ghost C点（在step2-fold组内）
            if (currentStep >= 2) {
                basePointC.style.display = 'none';
                baseLabelC.style.display = 'none';
            } else {
                basePointC.style.display = 'block';
                baseLabelC.style.display = 'block';
            }
        }

        // 上一步按钮事件
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        });

        // 下一步按钮事件
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                renderStep();
            }
        });

        // 初始化渲染
        renderStep();
    })();
    </script>
</body>
</html>
