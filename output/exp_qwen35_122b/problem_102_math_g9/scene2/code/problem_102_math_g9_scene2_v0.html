<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 抛物线与直线交点</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .slider-container { display: flex; align-items: center; gap: 8px; }
        .value-display { font-size: 14px; font-weight: bold; color: #1565c0; min-width: 40px; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" id="scene2-svg">
            <!-- 坐标系 -->
            <line id="scene2-axis-x" x1="50" y1="380" x2="750" y2="380" stroke="#000000" stroke-width="2"/>
            <line id="scene2-axis-y" x1="200" y1="30" x2="200" y2="430" stroke="#000000" stroke-width="2"/>
            
            <!-- 箭头 -->
            <polygon id="scene2-arrow-x" points="750,380 735,375 735,385" fill="#000000"/>
            <polygon id="scene2-arrow-y" points="200,30 195,45 205,45" fill="#000000"/>
            
            <!-- 轴标签 -->
            <text id="scene2-label-x" x="730" y="370" font-size="16" fill="#000000">x</text>
            <text id="scene2-label-y" x="210" y="40" font-size="16" fill="#000000">y</text>
            
            <!-- 原点 O -->
            <circle id="scene2-point-O" cx="200" cy="380" r="4" fill="#000000"/>
            <text id="scene2-label-O" x="180" y="395" font-size="14" fill="#000000">O</text>
            
            <!-- 点 A, B, M, N -->
            <circle id="scene2-point-A" cx="100" cy="100" r="6" fill="#000000"/>
            <text id="scene2-label-A" x="50" y="95" font-size="14" fill="#000000">A(-1,4)</text>
            
            <circle id="scene2-point-B" cx="400" cy="310" r="6" fill="#000000"/>
            <text id="scene2-label-B" x="430" y="340" font-size="14" fill="#000000">B(2,1)</text>
            
            <circle id="scene2-point-M" cx="700" cy="380" r="6" fill="#000000"/>
            <text id="scene2-label-M" x="710" y="410" font-size="14" fill="#000000">M(5,0)</text>
            
            <circle id="scene2-point-N" cx="200" cy="30" r="6" fill="#000000"/>
            <text id="scene2-label-N" x="220" y="5" font-size="14" fill="#000000">N(0,5)</text>
            
            <!-- 直线 AB -->
            <line id="scene2-line-AB" x1="100" y1="100" x2="700" y2="380" stroke="#000000" stroke-width="2"/>
            
            <!-- 线段 AN (蓝色高亮) -->
            <line id="scene2-seg-AN" x1="100" y1="100" x2="200" y2="30" stroke="#1565c0" stroke-width="3"/>
            
            <!-- 线段 BM (红色高亮) -->
            <line id="scene2-seg-BM" x1="400" y1="310" x2="700" y2="380" stroke="#c62828" stroke-width="3"/>
            
            <!-- 抛物线 -->
            <path id="scene2-parabola" d="" fill="none" stroke="#2e7d32" stroke-width="2"/>
            <path id="scene2-parabola-fill" d="" fill="#2e7d32" opacity="0.1"/>
            
            <!-- 交点 P1, P2 -->
            <circle id="scene2-point-P1" cx="200" cy="30" r="8" fill="#2e7d32" opacity="0"/>
            <text id="scene2-label-P1" x="185" y="20" font-size="14" fill="#2e7d32" font-weight="bold">P1</text>
            
            <circle id="scene2-point-P2" cx="400" cy="310" r="8" fill="#2e7d32" opacity="0"/>
            <text id="scene2-label-P2" x="410" y="320" font-size="14" fill="#2e7d32" font-weight="bold">P2</text>
            
            <!-- 滑块轨道 -->
            <line id="scene2-slider-track" x1="250" y1="450" x2="550" y2="450" stroke="#888888" stroke-width="4"/>
            
            <!-- 滑块按钮 -->
            <circle id="scene2-slider-thumb" cx="400" cy="450" r="12" fill="#1565c0"/>
            
            <!-- 滑块标签 -->
            <text id="scene2-label-b" x="200" y="485" font-size="14" fill="#000000">b=</text>
            <text id="scene2-text-bval" x="245" y="485" font-size="14" fill="#1565c0" font-weight="bold">2.5</text>
            
            <!-- 右上角数值显示区 -->
            <g id="scene2-info-panel">
                <text id="scene2-label-x1" x="620" y="80" font-size="14" fill="#000000">x₁=</text>
                <text id="scene2-text-x1val" x="665" y="80" font-size="14" fill="#2e7d32" font-weight="bold">0.00</text>
                
                <text id="scene2-label-x2" x="620" y="105" font-size="14" fill="#000000">x₂=</text>
                <text id="scene2-text-x2val" x="665" y="105" font-size="14" fill="#2e7d32" font-weight="bold">2.00</text>
            </g>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene2-controls">
            <div class="slider-container">
                <span style="font-size: 14px;">b:</span>
                <input type="range" id="scene2-slider-input" min="0" max="4" step="0.01" value="2.5" style="width: 300px;">
                <span id="scene2-slider-value" class="value-display">2.50</span>
            </div>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现
        // 坐标系映射规则：
        // - 原点 O(0,0) 在画布 (200, 380)
        // - x 轴：1 单位 = 100px（向右为正）
        // - y 轴：1 单位 = 70px（向上为正）
        
        const svg = document.getElementById('scene2-svg');
        const parabola = document.getElementById('scene2-parabola');
        const parabolaFill = document.getElementById('scene2-parabola-fill');
        const pointP1 = document.getElementById('scene2-point-P1');
        const pointP2 = document.getElementById('scene2-point-P2');
        const labelP1 = document.getElementById('scene2-label-P1');
        const labelP2 = document.getElementById('scene2-label-P2');
        const sliderThumb = document.getElementById('scene2-slider-thumb');
        const sliderInput = document.getElementById('scene2-slider-input');
        const sliderValue = document.getElementById('scene2-slider-value');
        const textBval = document.getElementById('scene2-text-bval');
        const textX1val = document.getElementById('scene2-text-x1val');
        const textX2val = document.getElementById('scene2-text-x2val');
        
        // 坐标转换函数
        function mathToScreen(x, y) {
            return {
                x: 200 + x * 100,
                y: 380 - y * 70
            };
        }
        
        function screenToMath(screenX, screenY) {
            return {
                x: (screenX - 200) / 100,
                y: (380 - screenY) / 70
            };
        }
        
        // 绘制抛物线 y = x² - bx + 2 (只绘制 x∈[-1,5] 范围，避免与标签重叠)
        function drawParabola(b) {
            let pathD = '';
            let fillPoints = '';
            const startX = -1;
            const endX = 5;
            const step = 0.05;
            
            for (let x = startX; x <= endX; x += step) {
                const y = x * x - b * x + 2;
                // 只绘制 y 在合理范围内的点
                if (y < -2 || y > 6) continue;
                const screen = mathToScreen(x, y);
                if (x === startX || pathD === '') {
                    pathD += `M ${screen.x} ${screen.y}`;
                    fillPoints += `${screen.x} ${screen.y}`;
                } else {
                    pathD += ` L ${screen.x} ${screen.y}`;
                    fillPoints += ` ${screen.x} ${screen.y}`;
                }
            }
            
            // 闭合填充区域（连接到 x 轴两端）
            const startScreen = mathToScreen(startX, 0);
            const endScreen = mathToScreen(endX, 0);
            fillPoints += ` ${endScreen.x} ${endScreen.y} ${startScreen.x} ${startScreen.y}`;
            
            parabola.setAttribute('d', pathD);
            parabolaFill.setAttribute('d', fillPoints);
        }
        
        // 计算交点：解方程 x² - bx + 2 = -x + 5
        // 整理：x² - (b-1)x - 3 = 0
        function calculateIntersections(b) {
            const a = 1;
            const coef = -(b - 1);
            const c = -3;
            
            const discriminant = coef * coef - 4 * a * c;
            if (discriminant < 0) {
                return null;
            }
            
            const x1 = (-coef - Math.sqrt(discriminant)) / (2 * a);
            const x2 = (-coef + Math.sqrt(discriminant)) / (2 * a);
            
            // 直线 AB 方程：y = -x + 5
            const y1 = -x1 + 5;
            const y2 = -x2 + 5;
            
            return {
                x1: x1, y1: y1,
                x2: x2, y2: y2
            };
        }
        
        // 更新交点显示
        function updateIntersections(b) {
            const intersections = calculateIntersections(b);
            
            if (intersections) {
                const { x1, y1, x2, y2 } = intersections;
                
                const screenP1 = mathToScreen(x1, y1);
                const screenP2 = mathToScreen(x2, y2);
                
                pointP1.setAttribute('cx', screenP1.x);
                pointP1.setAttribute('cy', screenP1.y);
                pointP1.setAttribute('opacity', '1');
                
                pointP2.setAttribute('cx', screenP2.x);
                pointP2.setAttribute('cy', screenP2.y);
                pointP2.setAttribute('opacity', '1');
                
                // 更新标签位置 - 根据交点位置动态调整偏移
                if (x1 < -0.5) {
                    labelP1.setAttribute('x', screenP1.x - 35);
                    labelP1.setAttribute('y', screenP1.y - 10);
                } else {
                    labelP1.setAttribute('x', screenP1.x - 25);
                    labelP1.setAttribute('y', screenP1.y - 15);
                }
                
                if (x2 > 3.5) {
                    labelP2.setAttribute('x', screenP2.x + 15);
                    labelP2.setAttribute('y', screenP2.y + 10);
                } else {
                    labelP2.setAttribute('x', screenP2.x + 20);
                    labelP2.setAttribute('y', screenP2.y + 10);
                }
                
                // 更新数值显示
                textX1val.textContent = x1.toFixed(2);
                textX2val.textContent = x2.toFixed(2);
                
                // 检查交点是否在线段范围内
                const p1InRange = x1 >= -1 && x1 <= 0;
                const p2InRange = x2 >= 2 && x2 <= 5;
                
                if (!p1InRange || !p2InRange) {
                    pointP1.setAttribute('fill', '#888888');
                    pointP2.setAttribute('fill', '#888888');
                } else {
                    pointP1.setAttribute('fill', '#2e7d32');
                    pointP2.setAttribute('fill', '#2e7d32');
                }
            }
        }
        
        // 更新滑块位置
        function updateSliderThumb(b) {
            const minB = 0;
            const maxB = 4;
            const trackStart = 250;
            const trackEnd = 550;
            const trackLength = trackEnd - trackStart;
            
            const ratio = (b - minB) / (maxB - minB);
            const thumbX = trackStart + ratio * trackLength;
            
            sliderThumb.setAttribute('cx', thumbX);
        }
        
        // 主更新函数
        function update(b) {
            drawParabola(b);
            updateIntersections(b);
            updateSliderThumb(b);
            sliderValue.textContent = b.toFixed(2);
            textBval.textContent = b.toFixed(2);
        }
        
        // 滑块事件处理
        sliderInput.addEventListener('input', function(e) {
            const b = parseFloat(e.target.value);
            update(b);
        });
        
        // 初始化
        update(2.5);
    })();
    </script>
</body>
</html>
