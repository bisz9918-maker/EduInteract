<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - △AED 与△AEF 的全等关系证明</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Microsoft YaHei', sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene2-btn { padding: 8px 20px; font-size: 14px; cursor: pointer; border: 2px solid #333; border-radius: 4px; background: #f5f5f5; }
        .scene2-btn:hover:not(:disabled) { background: #e0e0e0; }
        .scene2-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" id="scene2-svg">
            <!-- 定义 -->
            <defs>
                <marker id="scene2-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#888888" />
                </marker>
            </defs>

            <!-- 基础边线 -->
            <!-- BC 底边 -->
            <line x1="150" y1="400" x2="650" y2="400" stroke="#000000" stroke-width="3" id="scene2-line-bc"/>
            <!-- AB 边 -->
            <line x1="400" y1="100" x2="150" y2="400" stroke="#000000" stroke-width="2" id="scene2-line-ab"/>
            <!-- AC 边 -->
            <line x1="400" y1="100" x2="650" y2="400" stroke="#000000" stroke-width="2" id="scene2-line-ac"/>
            <!-- AF 边 -->
            <line x1="400" y1="100" x2="180" y2="220" stroke="#000000" stroke-width="2" id="scene2-line-af"/>
            <!-- AD 边 -->
            <line x1="400" y1="100" x2="480" y2="400" stroke="#000000" stroke-width="2" id="scene2-line-ad"/>
            <!-- AE 边 -->
            <line x1="400" y1="100" x2="280" y2="400" stroke="#000000" stroke-width="2" id="scene2-line-ae"/>
            <!-- EF 边 -->
            <line x1="280" y1="400" x2="180" y2="220" stroke="#000000" stroke-width="2" id="scene2-line-ef"/>
            <!-- ED 边 -->
            <line x1="280" y1="400" x2="480" y2="400" stroke="#000000" stroke-width="2" id="scene2-line-ed"/>

            <!-- 三角形填充 -->
            <polygon points="400,100 280,400 480,400" fill="#bbdefb" opacity="0.2" id="scene2-poly-aed"/>
            <polygon points="400,100 280,400 180,220" fill="#c8e6c9" opacity="0.2" id="scene2-poly-aef"/>

            <!-- 顶点 -->
            <circle cx="400" cy="100" r="6" fill="#000000" id="scene2-vertex-a"/>
            <circle cx="150" cy="400" r="6" fill="#000000" id="scene2-vertex-b"/>
            <circle cx="650" cy="400" r="6" fill="#000000" id="scene2-vertex-c"/>
            <circle cx="280" cy="400" r="6" fill="#000000" id="scene2-vertex-e"/>
            <circle cx="480" cy="400" r="6" fill="#000000" id="scene2-vertex-d"/>
            <circle cx="180" cy="220" r="6" fill="#000000" id="scene2-vertex-f"/>

            <!-- 顶点标签 -->
            <text x="390" y="85" font-size="16" fill="#000000" id="scene2-label-a">A</text>
            <text x="140" y="415" font-size="16" fill="#000000" id="scene2-label-b">B</text>
            <text x="660" y="415" font-size="16" fill="#000000" id="scene2-label-c">C</text>
            <text x="280" y="420" font-size="16" fill="#000000" id="scene2-label-e">E</text>
            <text x="480" y="420" font-size="16" fill="#000000" id="scene2-label-d">D</text>
            <text x="155" y="235" font-size="16" fill="#000000" id="scene2-label-f">F</text>

            <!-- 步骤 1：高亮等长边 AD=AF -->
            <line x1="400" y1="100" x2="180" y2="220" stroke="#2e7d32" stroke-width="4" display="none" id="scene2-line-af-highlight"/>
            <line x1="400" y1="100" x2="480" y2="400" stroke="#2e7d32" stroke-width="4" display="none" id="scene2-line-ad-highlight"/>
            <text x="570" y="140" font-size="14" fill="#2e7d32" font-weight="bold" display="none" id="scene2-text-ad-af">AD=AF</text>

            <!-- 步骤 2：高亮公共边 AE -->
            <line x1="400" y1="100" x2="280" y2="400" stroke="#1565c0" stroke-width="4" display="none" id="scene2-line-ae-highlight"/>
            <text x="160" y="240" font-size="14" fill="#1565c0" font-weight="bold" display="none" id="scene2-text-ae-common">AE(公共)</text>

            <!-- 步骤 3：高亮夹角 -->
            <!-- ∠DAE 角标（红色圆弧，半径 50） -->
            <path d="M 435,135 A 50,50 0 0 1 385,185" stroke="#c62828" stroke-width="2" fill="none" display="none" id="scene2-arc-dae"/>
            <text x="470" y="140" font-size="13" fill="#c62828" font-weight="bold" display="none" id="scene2-text-dae">45°</text>
            <!-- ∠FAE 角标（红色圆弧，半径 70） -->
            <path d="M 355,125 A 70,70 0 0 0 315,195" stroke="#c62828" stroke-width="2" fill="none" display="none" id="scene2-arc-fae"/>
            <text x="220" y="120" font-size="13" fill="#c62828" font-weight="bold" display="none" id="scene2-text-fae">45°</text>

            <!-- 步骤 4：旋转轨迹 -->
            <!-- 旋转轨迹弧（从 D 到 F 的 90°圆弧，半径≈320） -->
            <path d="M 480,400 A 320,320 0 0 1 180,220" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" fill="none" display="none" id="scene2-arc-rotation"/>
            <!-- D→F 轨迹线 -->
            <line x1="480" y1="400" x2="180" y2="220" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" display="none" id="scene2-line-df-trajectory"/>
            <!-- 旋转方向箭头 -->
            <path d="M 500,380 A 350,350 0 0 1 200,240" stroke="#888888" stroke-width="2" fill="none" marker-end="url(#scene2-arrowhead)" display="none" id="scene2-arrow-rotation"/>

            <!-- △AED 旋转组（用于动画） -->
            <g id="scene2-group-aed-rotate">
                <polygon points="400,100 280,400 480,400" fill="#bbdefb" opacity="0.2" id="scene2-poly-aed-rot"/>
            </g>

            <!-- 步骤 5：结论文本 -->
            <text x="620" y="80" font-size="16" fill="#000000" font-weight="bold" display="none" id="scene2-text-conclusion">△AED≌△AEF (SAS)</text>
        </svg>

        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button class="scene2-btn" id="scene2-btn-prev" disabled>◀ 上一步</button>
            <button class="scene2-btn" id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2 实现
        // 坐标表对照：
        // A(400,100), B(150,400), C(650,400), E(280,400), D(480,400), F(180,220)
        // BC 底边：(150,400)-(650,400)
        // △AED: (400,100)-(280,400)-(480,400)
        // △AEF: (400,100)-(280,400)-(180,220)

        const scene2 = {
            currentStep: 0,
            maxStep: 5,
            isAnimating: false,
            animationFrame: null,
            rotationAngle: 0,
            svg: null,

            // 元素 ID 映射
            elements: {
                // 步骤 1 元素
                lineAfHighlight: 'scene2-line-af-highlight',
                lineAdHighlight: 'scene2-line-ad-highlight',
                textAdAf: 'scene2-text-ad-af',
                // 步骤 2 元素
                lineAeHighlight: 'scene2-line-ae-highlight',
                textAeCommon: 'scene2-text-ae-common',
                // 步骤 3 元素
                arcDae: 'scene2-arc-dae',
                textDae: 'scene2-text-dae',
                arcFae: 'scene2-arc-fae',
                textFae: 'scene2-text-fae',
                // 步骤 4 元素
                arcRotation: 'scene2-arc-rotation',
                lineDfTrajectory: 'scene2-line-df-trajectory',
                arrowRotation: 'scene2-arrow-rotation',
                polyAedRot: 'scene2-poly-aed-rot',
                // 步骤 5 元素
                textConclusion: 'scene2-text-conclusion'
            },

            init: function() {
                this.svg = document.getElementById('scene2-svg');
                this.bindEvents();
                this.updateScene();
            },

            bindEvents: function() {
                document.getElementById('scene2-btn-prev').addEventListener('click', () => this.prevStep());
                document.getElementById('scene2-btn-next').addEventListener('click', () => this.nextStep());
            },

            prevStep: function() {
                if (this.currentStep > 0 && !this.isAnimating) {
                    this.currentStep--;
                    this.updateScene();
                }
            },

            nextStep: function() {
                if (this.currentStep < this.maxStep && !this.isAnimating) {
                    if (this.currentStep === 3) {
                        // 步骤 3→4 触发旋转动画
                        this.animateRotation();
                    } else {
                        this.currentStep++;
                        this.updateScene();
                    }
                }
            },

            animateRotation: function() {
                this.isAnimating = true;
                this.rotationAngle = 0;
                const duration = 1500; // 1.5 秒
                const startTime = performance.now();
                const groupAed = document.getElementById('scene2-group-aed-rotate');

                const animate = (currentTime) => {
                    const elapsed = currentTime - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    this.rotationAngle = progress * 90; // 从 0°到 90°

                    // 应用旋转变换
                    groupAed.setAttribute('transform', 
                        `rotate(${this.rotationAngle}, 400, 100)`);

                    // 随着旋转，逐渐增加重叠区域的透明度
                    const polyAedRot = document.getElementById('scene2-poly-aed-rot');
                    polyAedRot.setAttribute('opacity', 0.2 + progress * 0.3);

                    if (progress < 1) {
                        this.animationFrame = requestAnimationFrame(animate);
                    } else {
                        this.isAnimating = false;
                        this.currentStep = 4;
                        this.updateScene();
                    }
                };

                this.animationFrame = requestAnimationFrame(animate);
            },

            updateScene: function() {
                const e = this.elements;

                // 更新按钮状态
                document.getElementById('scene2-btn-prev').disabled = (this.currentStep === 0);
                document.getElementById('scene2-btn-next').disabled = (this.currentStep === this.maxStep);

                // 步骤 0：基础图形已显示，隐藏所有标记
                if (this.currentStep === 0) {
                    this.hideAllMarkers();
                    return;
                }

                // 步骤 1：高亮等长边 AD=AF
                if (this.currentStep >= 1) {
                    this.show(e.lineAfHighlight);
                    this.show(e.lineAdHighlight);
                    this.show(e.textAdAf);
                } else {
                    this.hide(e.lineAfHighlight);
                    this.hide(e.lineAdHighlight);
                    this.hide(e.textAdAf);
                }

                // 步骤 2：高亮公共边 AE
                if (this.currentStep >= 2) {
                    this.show(e.lineAeHighlight);
                    this.show(e.textAeCommon);
                } else {
                    this.hide(e.lineAeHighlight);
                    this.hide(e.textAeCommon);
                }

                // 步骤 3：高亮夹角
                if (this.currentStep >= 3) {
                    this.show(e.arcDae);
                    this.show(e.textDae);
                    this.show(e.arcFae);
                    this.show(e.textFae);
                } else {
                    this.hide(e.arcDae);
                    this.hide(e.textDae);
                    this.hide(e.arcFae);
                    this.hide(e.textFae);
                }

                // 步骤 4：旋转轨迹（动画完成后显示）
                if (this.currentStep >= 4) {
                    this.show(e.arcRotation);
                    this.show(e.lineDfTrajectory);
                    this.show(e.arrowRotation);
                } else {
                    this.hide(e.arcRotation);
                    this.hide(e.lineDfTrajectory);
                    this.hide(e.arrowRotation);
                }

                // 步骤 5：显示结论
                if (this.currentStep >= 5) {
                    this.show(e.textConclusion);
                } else {
                    this.hide(e.textConclusion);
                }
            },

            hideAllMarkers: function() {
                const e = this.elements;
                this.hide(e.lineAfHighlight);
                this.hide(e.lineAdHighlight);
                this.hide(e.textAdAf);
                this.hide(e.lineAeHighlight);
                this.hide(e.textAeCommon);
                this.hide(e.arcDae);
                this.hide(e.textDae);
                this.hide(e.arcFae);
                this.hide(e.textFae);
                this.hide(e.arcRotation);
                this.hide(e.lineDfTrajectory);
                this.hide(e.arrowRotation);
                this.hide(e.textConclusion);
            },

            show: function(id) {
                const el = document.getElementById(id);
                if (el) {
                    el.style.display = 'block';
                    el.style.opacity = '1';
                }
            },

            hide: function(id) {
                const el = document.getElementById(id);
                if (el) {
                    el.style.display = 'none';
                    el.style.opacity = '0';
                }
            }
        };

        // 初始化场景
        scene2.init();
    })();
    </script>
</body>
</html>
