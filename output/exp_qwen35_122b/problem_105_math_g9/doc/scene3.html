<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 3 - 线段 BE、DC、DE 的数量关系推导</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 20px; z-index: 10; }
        #scene3-controls button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: #fff; }
        #scene3-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene3-step-indicator { font-size: 14px; color: #666; }
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .flash { animation: flash 0.8s ease-in-out; }
        @keyframes flash { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义 -->
            <defs>
                <style>
                    .element { transition: opacity 0.5s ease-in-out; }
                    .formula-text { font-size: 14px; font-family: "Microsoft YaHei", sans-serif; }
                    .highlight { font-weight: bold; }
                </style>
            </defs>

            <!-- 基础图形：△ABC -->
            <polygon id="scene3-tri-abc" class="element" points="420,100 150,380 690,380" fill="none" stroke="#000000" stroke-width="2"/>

            <!-- 基础图形：△ADF -->
            <polygon id="scene3-tri-adf" class="element" points="420,100 420,380 150,180" fill="none" stroke="#000000" stroke-width="2"/>

            <!-- 基础图形：BE 线段（红色高亮） -->
            <line id="scene3-seg-be" class="element" x1="150" y1="380" x2="270" y2="380" stroke="#c62828" stroke-width="4"/>

            <!-- 基础图形：DC 线段（红色高亮） -->
            <line id="scene3-seg-dc" class="element" x1="420" y1="380" x2="690" y2="380" stroke="#c62828" stroke-width="4"/>

            <!-- 基础图形：DE 线段（红色高亮） -->
            <line id="scene3-seg-de" class="element" x1="270" y1="380" x2="420" y2="380" stroke="#c62828" stroke-width="4"/>

            <!-- 步骤 1：EF 线段（绿色） -->
            <line id="scene3-seg-ef" class="element" x1="270" y1="380" x2="150" y2="180" stroke="#2e7d32" stroke-width="3" style="opacity: 0;"/>

            <!-- 步骤 2：BF 辅助线（灰色虚线） -->
            <line id="scene3-seg-bf" class="element" x1="150" y1="380" x2="150" y2="180" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" style="opacity: 0;"/>

            <!-- 步骤 3：Rt△EBF 填充（淡红，放在底层） -->
            <polygon id="scene3-rt-ebf" class="element" points="270,380 150,380 150,180" fill="#c62828" fill-opacity="0.25" style="opacity: 0;"/>

            <!-- 点 A -->
            <circle id="scene3-point-a" class="element" cx="420" cy="100" r="5" fill="#000000"/>
            <!-- 点 B -->
            <circle id="scene3-point-b" class="element" cx="150" cy="380" r="5" fill="#000000"/>
            <!-- 点 C -->
            <circle id="scene3-point-c" class="element" cx="690" cy="380" r="5" fill="#000000"/>
            <!-- 点 D -->
            <circle id="scene3-point-d" class="element" cx="420" cy="380" r="5" fill="#000000"/>
            <!-- 点 E -->
            <circle id="scene3-point-e" class="element" cx="270" cy="380" r="5" fill="#000000"/>
            <!-- 点 F -->
            <circle id="scene3-point-f" class="element" cx="150" cy="180" r="5" fill="#000000"/>

            <!-- 标签 A -->
            <text id="scene3-label-a" class="element" x="420" y="85" text-anchor="middle" fill="#000000" font-size="14">A</text>
            <!-- 标签 B -->
            <text id="scene3-label-b" class="element" x="135" y="395" text-anchor="middle" fill="#000000" font-size="14">B</text>
            <!-- 标签 C -->
            <text id="scene3-label-c" class="element" x="700" y="395" text-anchor="middle" fill="#000000" font-size="14">C</text>
            <!-- 标签 D -->
            <text id="scene3-label-d" class="element" x="415" y="400" text-anchor="middle" fill="#000000" font-size="14">D</text>
            <!-- 标签 E -->
            <text id="scene3-label-e" class="element" x="265" y="400" text-anchor="middle" fill="#000000" font-size="14">E</text>
            <!-- 标签 F -->
            <text id="scene3-label-f" class="element" x="130" y="180" text-anchor="end" fill="#000000" font-size="14">F</text>

            <!-- 标签 BE（移到线段下方） -->
            <text id="scene3-label-be" class="element" x="210" y="405" text-anchor="middle" fill="#c62828" font-size="12">BE</text>
            <!-- 标签 DC（移到线段下方） -->
            <text id="scene3-label-dc" class="element" x="555" y="405" text-anchor="middle" fill="#c62828" font-size="12">DC</text>
            <!-- 标签 DE（移到线段下方） -->
            <text id="scene3-label-de" class="element" x="345" y="405" text-anchor="middle" fill="#c62828" font-size="12">DE</text>

            <!-- 标签 EF（移到线段右侧更远处，避开 EF 线段和三角形） -->
            <text id="scene3-label-ef" class="element" x="300" y="290" text-anchor="start" fill="#2e7d32" font-size="12" style="opacity: 0;">EF</text>

            <!-- 标签 BF（移到线段左侧） -->
            <text id="scene3-label-bf" class="element" x="125" y="280" text-anchor="end" fill="#888888" font-size="12" style="opacity: 0;">BF</text>

            <!-- ∠BAC 直角符号（步骤 0） -->
            <path id="scene3-rightangle-bac" class="element" d="M 405,115 L 420,115 L 420,130" fill="none" stroke="#000000" stroke-width="1.5"/>

            <!-- ∠DAF 直角符号（步骤 0，用蓝色区分） -->
            <path id="scene3-rightangle-daf" class="element" d="M 405,115 L 420,115 L 420,130" fill="none" stroke="#1976d2" stroke-width="1.5"/>

            <!-- ∠DAE 角度弧（步骤 0） -->
            <path id="scene3-angle-dae" class="element" d="M 420,100 m 0,50 a 50,50 0 0,0 -35.4,35.4" fill="none" stroke="#000000" stroke-width="1.5"/>
            <!-- 45°标签（移到弧线外侧更左处，避开三角形） -->
            <text id="scene3-angle-dae-label" class="element" x="290" y="125" text-anchor="middle" fill="#000000" font-size="12">45°</text>

            <!-- ∠EBF 直角符号（步骤 3） -->
            <path id="scene3-rightangle-ebf" class="element" d="M 165,365 L 180,365 L 180,380" fill="none" stroke="#c62828" stroke-width="1.5" style="opacity: 0;"/>

            <!-- 公式框背景（始终显示，放在公式文本之前） -->
            <rect id="scene3-formula-box" class="element" x="620" y="150" width="160" height="150" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>

            <!-- 公式文本行 1（步骤 1） -->
            <text id="scene3-formula-line1" class="element formula-text" x="630" y="175" fill="#2e7d32" style="opacity: 0;">DE = EF</text>

            <!-- 公式文本行 2（步骤 2） -->
            <text id="scene3-formula-line2" class="element formula-text" x="630" y="205" fill="#2e7d32" style="opacity: 0;">BF = DC</text>

            <!-- 公式文本行 3（步骤 3） -->
            <text id="scene3-formula-line3" class="element formula-text" x="630" y="245" fill="#1565c0" style="opacity: 0;">BE² + BF² = EF²</text>

            <!-- 公式文本行 4（步骤 4） -->
            <text id="scene3-formula-line4" class="element formula-text highlight" x="630" y="285" fill="#1565c0" style="opacity: 0;">BE² + DC² = DE²</text>
        </svg>

        <!-- 控件栏 -->
        <div id="scene3-controls">
            <button id="scene3-prev-btn" disabled>◀ 上一步</button>
            <span id="scene3-step-indicator">步骤 1/6</span>
            <button id="scene3-next-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 3 实现
        // 布局坐标表对照：
        // | 元素 | 位置/范围 | 备注 |
        // |------|-----------|------|
        // | △ABC | A(420,100), B(150,380), C(690,380) | 等腰直角三角形 |
        // | △ADF | A(420,100), D(420,380), F(150,180) | 等腰直角三角形 |
        // | BC 线段 | (150,380)-(690,380) | 底边 |
        // | BE 线段 | (150,380)-(270,380) | 红色高亮 |
        // | DC 线段 | (420,380)-(690,380) | 红色高亮 |
        // | DE 线段 | (270,380)-(420,380) | 红色高亮 |
        // | EF 线段 | (270,380)-(150,180) | 绿色 |
        // | BF 辅助线 | (150,380)-(150,180) | 灰色虚线 |
        // | 公式框 | (620,150)-(780,300) | 淡灰背景 |

        const TOTAL_STEPS = 6;
        let currentStep = 0;

        // 工具函数：显示元素
        function show(el) {
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '1';
                el.classList.add('fade-in');
            }
        }

        // 工具函数：隐藏元素
        function hide(el) {
            if (el) {
                el.style.opacity = '0';
                setTimeout(() => {
                    if (el) el.style.display = 'none';
                }, 500);
                el.classList.remove('fade-in', 'flash');
            }
        }

        // 工具函数：高亮元素
        function highlight(el) {
            if (el) {
                el.classList.add('flash');
                setTimeout(() => el.classList.remove('flash'), 800);
            }
        }

        // 更新场景显示
        function updateScene() {
            const prevBtn = document.getElementById('scene3-prev-btn');
            const nextBtn = document.getElementById('scene3-next-btn');
            const indicator = document.getElementById('scene3-step-indicator');

            // 更新按钮状态
            prevBtn.disabled = (currentStep === 0);
            nextBtn.disabled = (currentStep === TOTAL_STEPS - 1);
            nextBtn.textContent = (currentStep === TOTAL_STEPS - 1) ? '完成' : '下一步 ▶';

            // 更新步骤指示器
            indicator.textContent = `步骤 ${currentStep + 1}/${TOTAL_STEPS}`;

            // 根据步骤控制元素显示
            const segEf = document.getElementById('scene3-seg-ef');
            const labelEf = document.getElementById('scene3-label-ef');
            const formulaLine1 = document.getElementById('scene3-formula-line1');

            const segBf = document.getElementById('scene3-seg-bf');
            const labelBf = document.getElementById('scene3-label-bf');
            const formulaLine2 = document.getElementById('scene3-formula-line2');

            const rtEbf = document.getElementById('scene3-rt-ebf');
            const rightangleEbf = document.getElementById('scene3-rightangle-ebf');
            const formulaLine3 = document.getElementById('scene3-formula-line3');

            const formulaLine4 = document.getElementById('scene3-formula-line4');

            // 重置所有步骤相关元素
            [segEf, labelEf, formulaLine1, segBf, labelBf, formulaLine2, rtEbf, rightangleEbf, formulaLine3, formulaLine4].forEach(el => {
                if (el) {
                    el.style.opacity = '0';
                    el.style.display = 'none';
                    el.classList.remove('fade-in', 'flash', 'highlight');
                }
            });

            // 根据当前步骤显示对应元素
            if (currentStep >= 1) {
                show(segEf);
                show(labelEf);
                show(formulaLine1);
            }

            if (currentStep >= 2) {
                show(segBf);
                show(labelBf);
                show(formulaLine2);
            }

            if (currentStep >= 3) {
                show(rtEbf);
                show(rightangleEbf);
                show(formulaLine3);
            }

            if (currentStep >= 4) {
                formulaLine3.classList.add('highlight');
                show(formulaLine4);
            }

            if (currentStep >= 5) {
                highlight(formulaLine4);
            }
        }

        // 事件绑定
        document.getElementById('scene3-prev-btn').addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        document.getElementById('scene3-next-btn').addEventListener('click', function() {
            if (currentStep < TOTAL_STEPS - 1) {
                currentStep++;
                updateScene();
            }
        });

        // 初始化
        updateScene();
    })();
    </script>
</body>
</html>
