<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>屋架设计图 - 直角三角形与中点性质</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Microsoft YaHei', sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene1-btn { width: 120px; height: 40px; font-size: 15px; cursor: pointer; border: none; border-radius: 6px; transition: all 0.2s; }
        .scene1-btn-enabled { background: #1976d2; color: white; }
        .scene1-btn-enabled:hover { background: #1565c0; }
        .scene1-btn-disabled { background: #bdbdbd; color: #757575; cursor: not-allowed; }
        #scene1-info-panel { position: absolute; top: 10px; right: 10px; width: 220px; background: #f5f5f5; border: 1px solid #ddd; border-radius: 6px; padding: 10px; font-size: 13px; }
        .scene1-info-title { font-weight: bold; color: #333; margin-bottom: 5px; }
        .scene1-info-item { margin: 4px 0; color: #666; }
        .scene1-info-blue { color: #1565c0; }
        .scene1-info-green { color: #2e7d32; }
        .scene1-info-red { color: #c62828; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义 -->
            <defs>
                <style>
                    .scene1-line { stroke: #000000; stroke-width: 2; fill: none; }
                    .scene1-label { font-size: 16px; fill: #000000; font-family: 'Microsoft YaHei', sans-serif; }
                    .scene1-right-angle { stroke: #1565c0; stroke-width: 1.5; fill: none; }
                    .scene1-dot { fill: #2e7d32; }
                    .scene1-highlight { fill: #c62828; opacity: 0.2; }
                </style>
            </defs>

            <!-- 横梁 AC -->
            <line id="scene1-line-ac" x1="150" y1="350" x2="400" y2="350" class="scene1-line"/>
            <!-- 斜梁 AB -->
            <line id="scene1-line-ab" x1="150" y1="350" x2="400" y2="100" class="scene1-line"/>
            <!-- 立柱 BC -->
            <line id="scene1-line-bc" x1="400" y1="100" x2="400" y2="350" class="scene1-line"/>
            <!-- 立柱 DE -->
            <line id="scene1-line-de" x1="275" y1="225" x2="275" y2="350" class="scene1-line"/>

            <!-- 顶点 A -->
            <circle id="scene1-vertex-a" cx="150" cy="350" r="4" fill="#000000"/>
            <!-- 顶点 B -->
            <circle id="scene1-vertex-b" cx="400" cy="100" r="4" fill="#000000"/>
            <!-- 顶点 C -->
            <circle id="scene1-vertex-c" cx="400" cy="350" r="4" fill="#000000"/>
            <!-- 顶点 D -->
            <circle id="scene1-vertex-d" cx="275" cy="225" r="4" fill="#000000"/>
            <!-- 顶点 E -->
            <circle id="scene1-vertex-e" cx="275" cy="350" r="4" fill="#000000"/>

            <!-- 顶点标签 (调整位置，避免与线段重叠) -->
            <text id="scene1-label-a" x="130" y="365" class="scene1-label">A</text>
            <text id="scene1-label-b" x="390" y="85" class="scene1-label">B</text>
            <text id="scene1-label-c" x="410" y="365" class="scene1-label">C</text>
            <text id="scene1-label-d" x="340" y="210" class="scene1-label">D</text>
            <text id="scene1-label-e" x="260" y="365" class="scene1-label">E</text>

            <!-- 步骤 1: 直角符号 -->
            <path id="scene1-rt-c" d="M 390 350 L 390 340 L 400 340" class="scene1-right-angle" style="display: none;"/>
            <path id="scene1-rt-e" d="M 275 350 L 275 340 L 285 340" class="scene1-right-angle" style="display: none;"/>

            <!-- 步骤 2: 中点标记 -->
            <circle id="scene1-dot-d" cx="275" cy="225" r="5" class="scene1-dot" style="display: none;"/>

            <!-- 步骤 3: △ABC 高亮 -->
            <polygon id="scene1-highlight-abc" points="150,350 400,100 400,350" class="scene1-highlight" style="display: none;"/>

            <!-- 步骤 4: △ADE 高亮 -->
            <polygon id="scene1-highlight-ade" points="150,350 275,225 275,350" class="scene1-highlight" style="display: none;"/>
        </svg>

        <!-- 信息面板：显示当前步骤的标注和计算 -->
        <div id="scene1-info-panel">
            <div class="scene1-info-title">已知条件与计算</div>
            <div id="scene1-info-content"></div>
        </div>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn scene1-btn-disabled">◀ 上一步</button>
            <button id="scene1-btn-next" class="scene1-btn scene1-btn-enabled">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1: 屋架设计图 - 直角三角形与中点性质
        // 布局坐标表对照：
        // | 元素 | 位置 | 备注 |
        // | 横梁 AC | (150,350)-(400,350) | 水平线段 |
        // | 斜梁 AB | (150,350)-(400,100) | 斜线段 |
        // | 立柱 BC | (400,100)-(400,350) | 竖直线段 |
        // | 立柱 DE | (275,225)-(275,350) | 竖直线段 |
        // | 点 A | (150,350) | 左下角顶点 |
        // | 点 B | (400,100) | 顶部顶点 |
        // | 点 C | (400,350) | 底部垂足 |
        // | 点 D | (275,225) | AB 中点 |
        // | 点 E | (275,350) | AC 上垂足 |

        const MAX_STEP = 5;
        let currentStep = 0;

        // 元素 ID 映射
        const elements = {
            rtC: 'scene1-rt-c',
            rtE: 'scene1-rt-e',
            dotD: 'scene1-dot-d',
            highlightAbc: 'scene1-highlight-abc',
            highlightAde: 'scene1-highlight-ade',
            infoContent: 'scene1-info-content',
            btnPrev: 'scene1-btn-prev',
            btnNext: 'scene1-btn-next'
        };

        // 各步骤的信息内容
        const stepInfo = [
            '', // 步骤 0: 无额外信息
            '<div class="scene1-info-item scene1-info-blue">• AB = 8m</div><div class="scene1-info-item scene1-info-blue">• ∠A = 30°</div><div class="scene1-info-item">• BC ⊥ AC</div><div class="scene1-info-item">• DE ⊥ AC</div>',
            '<div class="scene1-info-item scene1-info-blue">• AB = 8m</div><div class="scene1-info-item scene1-info-blue">• ∠A = 30°</div><div class="scene1-info-item">• BC ⊥ AC</div><div class="scene1-info-item">• DE ⊥ AC</div><div class="scene1-info-item scene1-info-green">• D 是 AB 中点</div><div class="scene1-info-item scene1-info-green">• AD = DB = 4m</div>',
            '<div class="scene1-info-item scene1-info-blue">• AB = 8m</div><div class="scene1-info-item scene1-info-blue">• ∠A = 30°</div><div class="scene1-info-item">• BC ⊥ AC</div><div class="scene1-info-item">• DE ⊥ AC</div><div class="scene1-info-item scene1-info-green">• D 是 AB 中点</div><div class="scene1-info-item scene1-info-green">• AD = DB = 4m</div><div class="scene1-info-item scene1-info-red">• BC = AB×sin30° = 4m</div>',
            '<div class="scene1-info-item scene1-info-blue">• AB = 8m</div><div class="scene1-info-item scene1-info-blue">• ∠A = 30°</div><div class="scene1-info-item">• BC ⊥ AC</div><div class="scene1-info-item">• DE ⊥ AC</div><div class="scene1-info-item scene1-info-green">• D 是 AB 中点</div><div class="scene1-info-item scene1-info-green">• AD = DB = 4m</div><div class="scene1-info-item scene1-info-red">• BC = 4m</div><div class="scene1-info-item scene1-info-red">• DE = AD×sin30° = 2m</div>',
            '<div class="scene1-info-item scene1-info-blue">• AB = 8m</div><div class="scene1-info-item scene1-info-blue">• ∠A = 30°</div><div class="scene1-info-item">• BC ⊥ AC</div><div class="scene1-info-item">• DE ⊥ AC</div><div class="scene1-info-item scene1-info-green">• D 是 AB 中点</div><div class="scene1-info-item scene1-info-green">• AD = DB = 4m</div><div class="scene1-info-item scene1-info-red">• BC = 4m</div><div class="scene1-info-item scene1-info-red">• DE = 2m</div><div class="scene1-info-item scene1-info-red" style="font-weight:bold; margin-top:5px;">✓ 故选 B</div>'
        ];

        // 工具函数
        function show(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }

        function hide(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }

        // 更新显示状态
        function updateDisplay() {
            // 步骤 1: 直角符号
            if (currentStep >= 1) {
                show(elements.rtC);
                show(elements.rtE);
            } else {
                hide(elements.rtC);
                hide(elements.rtE);
            }

            // 步骤 2: 中点标记
            if (currentStep >= 2) {
                show(elements.dotD);
            } else {
                hide(elements.dotD);
            }

            // 步骤 3: △ABC 高亮
            if (currentStep >= 3) {
                show(elements.highlightAbc);
            } else {
                hide(elements.highlightAbc);
            }

            // 步骤 4: △ADE 高亮
            if (currentStep >= 4) {
                show(elements.highlightAde);
            } else {
                hide(elements.highlightAde);
            }

            // 更新信息面板
            document.getElementById(elements.infoContent).innerHTML = stepInfo[currentStep];

            // 更新按钮状态
            const btnPrev = document.getElementById(elements.btnPrev);
            const btnNext = document.getElementById(elements.btnNext);

            if (currentStep === 0) {
                btnPrev.className = 'scene1-btn scene1-btn-disabled';
                btnPrev.disabled = true;
            } else {
                btnPrev.className = 'scene1-btn scene1-btn-enabled';
                btnPrev.disabled = false;
            }

            if (currentStep === MAX_STEP) {
                btnNext.className = 'scene1-btn scene1-btn-disabled';
                btnNext.disabled = true;
            } else {
                btnNext.className = 'scene1-btn scene1-btn-enabled';
                btnNext.disabled = false;
            }
        }

        // 事件绑定
        document.getElementById(elements.btnPrev).addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        });

        document.getElementById(elements.btnNext).addEventListener('click', function() {
            if (currentStep < MAX_STEP) {
                currentStep++;
                updateDisplay();
            }
        });

        // 初始化
        updateDisplay();
    })();
    </script>
</body>
</html>
