<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黄金三角形几何性质 - Scene 1</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Microsoft YaHei', sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene1-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 2px solid #1565c0; border-radius: 6px; background: #fff; color: #1565c0; transition: all 0.2s; }
        .scene1-btn:hover:not(:disabled) { background: #1565c0; color: #fff; }
        .scene1-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene1-highlight { stroke: #c62828 !important; stroke-width: 3px !important; }
        .scene1-mark { stroke: #2e7d32; stroke-width: 2px; }
        .scene1-angle-arc { fill: none; stroke: #888888; stroke-width: 1px; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- 三角形 ABC 填充 -->
            <polygon id="scene1-tri-fill" points="400,80 280,380 520,380" fill="#1565c0" fill-opacity="0.1"/>
            
            <!-- 边 AB -->
            <line id="scene1-line-ab" x1="400" y1="80" x2="280" y2="380" stroke="#000000" stroke-width="2"/>
            <!-- 边 AC -->
            <line id="scene1-line-ac" x1="400" y1="80" x2="520" y2="380" stroke="#000000" stroke-width="2"/>
            <!-- 边 BC -->
            <line id="scene1-line-bc" x1="280" y1="380" x2="520" y2="380" stroke="#000000" stroke-width="2"/>
            
            <!-- 线段 DE (步骤 0) -->
            <line id="scene1-line-de" x1="340" y1="230" x2="483" y2="287" stroke="#1565c0" stroke-width="2" data-step="0"/>
            
            <!-- 线段 BE (步骤 2) -->
            <line id="scene1-line-be" x1="280" y1="380" x2="483" y2="287" stroke="#1565c0" stroke-width="2" data-step="2" style="display:none"/>
            
            <!-- 直角符号 (步骤 0) -->
            <path id="scene1-right-angle" d="M 340,230 L 340,242 L 352,242" fill="none" stroke="#000000" stroke-width="1.5" data-step="0"/>
            <line id="scene1-right-angle-line" x1="340" y1="242" x2="352" y2="242" stroke="#000000" stroke-width="1.5" data-step="0"/>
            
            <!-- 等长标记：AB=AC (步骤 0) -->
            <path id="scene1-mark-ab-ac" d="M 335,180 L 340,185 M 330,185 L 335,190" fill="none" stroke="#2e7d32" stroke-width="2" data-step="0"/>
            <path id="scene1-mark-ab-ac-2" d="M 465,175 L 470,180 M 460,180 L 465,185" fill="none" stroke="#2e7d32" stroke-width="2" data-step="0"/>
            
            <!-- 等长标记：DA=DB (步骤 1) -->
            <path id="scene1-mark-da-db" d="M 355,205 L 360,210" fill="none" stroke="#2e7d32" stroke-width="2" data-step="1" style="display:none"/>
            
            <!-- 等长标记：EA=EB (步骤 2) -->
            <path id="scene1-mark-ea-eb" d="M 440,230 Q 445,235 450,230" fill="none" stroke="#2e7d32" stroke-width="2" data-step="2" style="display:none"/>
            <path id="scene1-mark-ea-eb-2" d="M 380,320 Q 385,325 390,320" fill="none" stroke="#2e7d32" stroke-width="2" data-step="2" style="display:none"/>
            
            <!-- 等长标记：BE=BC (步骤 3) -->
            <path id="scene1-mark-be-bc" d="M 380,340 L 385,345 M 385,340 L 390,345" fill="none" stroke="#2e7d32" stroke-width="2" stroke-dasharray="2,2" data-step="3" style="display:none"/>
            <path id="scene1-mark-be-bc-2" d="M 400,360 L 405,365 M 405,360 L 410,365" fill="none" stroke="#2e7d32" stroke-width="2" stroke-dasharray="2,2" data-step="3" style="display:none"/>
            
            <!-- 角度弧线：∠B=72° (步骤 0) -->
            <path id="scene1-arc-b" d="M 310,380 A 30,30 0 0 0 300,355" fill="none" stroke="#888888" stroke-width="1" data-step="0"/>
            
            <!-- 角度弧线：∠C=72° (步骤 0) -->
            <path id="scene1-arc-c" d="M 490,380 A 30,30 0 0 1 500,355" fill="none" stroke="#888888" stroke-width="1" data-step="0"/>
            
            <!-- 角度弧线：∠A=36° (步骤 1) -->
            <path id="scene1-arc-a" d="M 400,110 A 30,30 0 0 1 425,120" fill="none" stroke="#888888" stroke-width="1" data-step="1" style="display:none"/>
            
            <!-- 角度弧线：∠EBA=36° (步骤 2) -->
            <path id="scene1-arc-eba" d="M 310,360 A 25,25 0 0 0 320,345" fill="none" stroke="#888888" stroke-width="1" data-step="2" style="display:none"/>
            
            <!-- 角度弧线：∠EBC=36° (步骤 3) -->
            <path id="scene1-arc-ebc" d="M 310,375 A 25,25 0 0 1 330,375" fill="none" stroke="#888888" stroke-width="1" data-step="3" style="display:none"/>
            
            <!-- 顶点圆点 -->
            <circle id="scene1-vertex-a" cx="400" cy="80" r="4" fill="#000000"/>
            <circle id="scene1-vertex-b" cx="280" cy="380" r="4" fill="#000000"/>
            <circle id="scene1-vertex-c" cx="520" cy="380" r="4" fill="#000000"/>
            <circle id="scene1-vertex-d" cx="340" cy="230" r="4" fill="#000000" data-step="0"/>
            <circle id="scene1-vertex-e" cx="483" cy="287" r="4" fill="#000000" data-step="0"/>
            
            <!-- 文字标签 - 全部移到三角形外部，远离边线 -->
            <text id="scene1-label-a" x="400" y="50" text-anchor="middle" font-size="14" fill="#000000">A</text>
            <text id="scene1-label-b" x="255" y="405" text-anchor="middle" font-size="14" fill="#000000">B</text>
            <text id="scene1-label-c" x="545" y="405" text-anchor="middle" font-size="14" fill="#000000">C</text>
            <text id="scene1-label-d" x="305" y="215" text-anchor="middle" font-size="14" fill="#000000" data-step="0">D</text>
            <text id="scene1-label-e" x="515" y="275" text-anchor="middle" font-size="14" fill="#000000" data-step="0">E</text>
            
            <!-- 边长标注 - 移到三角形左侧和右侧外部 -->
            <text id="scene1-label-ab" x="250" y="200" text-anchor="middle" font-size="12" fill="#000000">AB=4</text>
            <text id="scene1-label-ac" x="550" y="200" text-anchor="middle" font-size="12" fill="#000000">AC=4</text>
            
            <!-- 角度标注 - 移到三角形外部 -->
            <text id="scene1-label-angle-b" x="255" y="345" text-anchor="middle" font-size="12" fill="#000000">72°</text>
            <text id="scene1-label-angle-c" x="545" y="345" text-anchor="middle" font-size="12" fill="#000000">72°</text>
            <text id="scene1-label-angle-a" x="400" y="135" text-anchor="middle" font-size="12" fill="#000000" data-step="1" style="display:none">36°</text>
            <text id="scene1-label-angle-eba" x="255" y="310" text-anchor="middle" font-size="12" fill="#000000" data-step="2" style="display:none">36°</text>
            <text id="scene1-label-angle-ebc" x="295" y="345" text-anchor="middle" font-size="12" fill="#000000" data-step="3" style="display:none">36°</text>
            
            <!-- 边长关系标注 (步骤 4) - 移到外部 -->
            <text id="scene1-label-ae" x="555" y="240" text-anchor="middle" font-size="12" fill="#000000" data-step="4" style="display:none">AE=x</text>
            <text id="scene1-label-ec" x="560" y="310" text-anchor="middle" font-size="12" fill="#000000" data-step="4" style="display:none">EC=4-x</text>
            <text id="scene1-label-be-bc" x="320" y="275" text-anchor="middle" font-size="12" fill="#000000" data-step="4" style="display:none">BE=BC=x</text>
            
            <!-- 结论文本 (步骤 5) -->
            <text id="scene1-conclusion" x="400" y="420" text-anchor="middle" font-size="16" font-weight="bold" fill="#c62828" data-step="5" style="display:none">cosA = (√5+1)/4</text>
            
            <!-- 选项 C 高亮 (步骤 5) -->
            <circle id="scene1-option-c" cx="650" cy="420" r="20" fill="none" stroke="#c62828" stroke-width="2" data-step="5" style="display:none"/>
            <text id="scene1-option-c-label" x="650" y="425" text-anchor="middle" font-size="14" font-weight="bold" fill="#c62828" data-step="5" style="display:none">C</text>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn">◀ 上一步</button>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1: 黄金三角形几何性质
        // 坐标表：
        // A(400,80), B(280,380), C(520,380)
        // D(340,230) - AB 中点
        // E(483,287) - DE 与 AC 交点
        
        const scene1 = {
            currentStep: 0,
            totalSteps: 5,
            
            // 获取元素
            getEl: function(id) {
                return document.getElementById(id);
            },
            
            // 显示元素（同时设置 display 和 opacity）
            show: function(el) {
                if (el) {
                    el.style.display = '';
                    el.style.opacity = '1';
                }
            },
            
            // 隐藏元素
            hide: function(el) {
                if (el) {
                    el.style.display = 'none';
                    el.style.opacity = '0';
                }
            },
            
            // 移除高亮
            removeHighlight: function(el) {
                if (el) {
                    el.classList.remove('scene1-highlight');
                }
            },
            
            // 添加高亮
            addHighlight: function(el) {
                if (el) {
                    el.classList.add('scene1-highlight');
                }
            },
            
            // 更新步骤显示
            updateStep: function() {
                const s = this.currentStep;
                
                // 重置所有高亮
                this.removeHighlight(this.getEl('scene1-line-de'));
                this.removeHighlight(this.getEl('scene1-line-be'));
                
                // 步骤 0: 基础三角形
                if (s >= 0) {
                    // 显示基础元素
                    this.show(this.getEl('scene1-line-de'));
                    this.show(this.getEl('scene1-right-angle'));
                    this.show(this.getEl('scene1-right-angle-line'));
                    this.show(this.getEl('scene1-mark-ab-ac'));
                    this.show(this.getEl('scene1-mark-ab-ac-2'));
                    this.show(this.getEl('scene1-arc-b'));
                    this.show(this.getEl('scene1-arc-c'));
                    this.show(this.getEl('scene1-vertex-d'));
                    this.show(this.getEl('scene1-vertex-e'));
                    this.show(this.getEl('scene1-label-d'));
                    this.show(this.getEl('scene1-label-e'));
                }
                
                // 步骤 1: 垂直平分线性质
                if (s >= 1) {
                    this.addHighlight(this.getEl('scene1-line-de'));
                    this.show(this.getEl('scene1-mark-da-db'));
                    this.show(this.getEl('scene1-arc-a'));
                    this.show(this.getEl('scene1-label-angle-a'));
                }
                
                // 步骤 2: 连接 BE
                if (s >= 2) {
                    this.show(this.getEl('scene1-line-be'));
                    this.addHighlight(this.getEl('scene1-line-be'));
                    this.show(this.getEl('scene1-mark-ea-eb'));
                    this.show(this.getEl('scene1-mark-ea-eb-2'));
                    this.show(this.getEl('scene1-arc-eba'));
                    this.show(this.getEl('scene1-label-angle-eba'));
                }
                
                // 步骤 3: 角度关系
                if (s >= 3) {
                    this.show(this.getEl('scene1-arc-ebc'));
                    this.show(this.getEl('scene1-label-angle-ebc'));
                    this.show(this.getEl('scene1-mark-be-bc'));
                    this.show(this.getEl('scene1-mark-be-bc-2'));
                }
                
                // 步骤 4: 边长关系
                if (s >= 4) {
                    this.show(this.getEl('scene1-label-ae'));
                    this.show(this.getEl('scene1-label-ec'));
                    this.show(this.getEl('scene1-label-be-bc'));
                }
                
                // 步骤 5: 结论
                if (s >= 5) {
                    this.show(this.getEl('scene1-conclusion'));
                    this.show(this.getEl('scene1-option-c'));
                    this.show(this.getEl('scene1-option-c-label'));
                }
                
                // 更新按钮状态
                const prevBtn = this.getEl('scene1-btn-prev');
                const nextBtn = this.getEl('scene1-btn-next');
                
                prevBtn.disabled = (s === 0);
                
                if (s === 5) {
                    nextBtn.textContent = '完成';
                    nextBtn.disabled = true;
                } else {
                    nextBtn.textContent = '下一步 ▶';
                    nextBtn.disabled = false;
                }
            },
            
            // 下一步
            nextStep: function() {
                if (this.currentStep < this.totalSteps) {
                    this.currentStep++;
                    this.updateStep();
                }
            },
            
            // 上一步
            prevStep: function() {
                if (this.currentStep > 0) {
                    this.currentStep--;
                    this.updateStep();
                }
            },
            
            // 初始化
            init: function() {
                const prevBtn = this.getEl('scene1-btn-prev');
                const nextBtn = this.getEl('scene1-btn-next');
                
                prevBtn.addEventListener('click', this.prevStep.bind(this));
                nextBtn.addEventListener('click', this.nextStep.bind(this));
                
                this.updateStep();
            }
        };
        
        scene1.init();
    })();
    </script>
</body>
</html>
