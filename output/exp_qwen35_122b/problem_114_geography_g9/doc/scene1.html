<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地球自转方向与南北半球判断</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Microsoft YaHei', sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene1-controls button { padding: 8px 20px; font-size: 14px; border: none; border-radius: 4px; cursor: pointer; transition: all 0.2s; }
        #scene1-prev-btn { background: #9e9e9e; color: #ffffff; }
        #scene1-prev-btn:hover:not(:disabled) { background: #757575; }
        #scene1-prev-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-next-btn { background: #1565c0; color: #ffffff; }
        #scene1-next-btn:hover:not(:disabled) { background: #0d47a1; }
        #scene1-next-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 左图：北极俯视图 -->
            <g id="scene1-left-diagram">
                <!-- 标题（上移避免裁切） -->
                <text id="scene1-left-title" x="200" y="45" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">北极俯视图</text>
                <!-- 同心圆 -->
                <circle id="scene1-left-circle-outer" cx="200" cy="250" r="120" stroke="#000000" stroke-width="2" fill="none"/>
                <circle id="scene1-left-circle-middle" cx="200" cy="250" r="80" stroke="#000000" stroke-width="1" fill="none"/>
                <circle id="scene1-left-circle-inner" cx="200" cy="250" r="40" stroke="#000000" stroke-width="1" fill="none"/>
                <!-- 放射线（8 条） -->
                <line id="scene1-left-line-1" x1="200" y1="130" x2="200" y2="370" stroke="#000000" stroke-width="1"/>
                <line id="scene1-left-line-2" x1="80" y1="250" x2="320" y2="250" stroke="#000000" stroke-width="1"/>
                <line id="scene1-left-line-3" x1="116" y1="165" x2="284" y2="335" stroke="#000000" stroke-width="1"/>
                <line id="scene1-left-line-4" x1="116" y1="335" x2="284" y2="165" stroke="#000000" stroke-width="1"/>
                <!-- 经线标签 -->
                <text id="scene1-left-label-180" x="200" y="105" text-anchor="middle" font-size="14" fill="#000000">180°</text>
                <text id="scene1-left-label-0" x="200" y="390" text-anchor="middle" font-size="14" fill="#000000">0°</text>
                <!-- 逆时针箭头（初始灰色，步骤 1 高亮） -->
                <path id="scene1-arrow-left" d="M 50,250 A 150,150 0 0,1 80,100" stroke="#9e9e9e" stroke-width="3" fill="none" marker-end="url(#arrowhead-left)"/>
                <defs>
                    <marker id="arrowhead-left" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                        <polygon points="0 0, 10 3.5, 0 7" fill="#9e9e9e"/>
                    </marker>
                </defs>
                <!-- 地球自转方向标签（移到左侧更远处，y 值调整避免裁切） -->
                <text id="scene1-arrow-label-left" x="20" y="200" font-size="12" fill="#9e9e9e" transform="rotate(-90, 20, 200)">地球自转方向</text>
                <!-- A 点（步骤 3 显示） -->
                <circle id="scene1-point-a" cx="143" cy="193" r="4" fill="#c62828" display="none"/>
                <text id="scene1-label-a" x="100" y="180" font-size="14" font-weight="bold" fill="#000000" display="none">A</text>
            </g>

            <!-- 右图：南极俯视图 -->
            <g id="scene1-right-diagram">
                <!-- 标题（上移避免裁切） -->
                <text id="scene1-right-title" x="600" y="45" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">南极俯视图</text>
                <!-- 同心圆 -->
                <circle id="scene1-right-circle-outer" cx="600" cy="250" r="120" stroke="#000000" stroke-width="2" fill="none"/>
                <circle id="scene1-right-circle-middle" cx="600" cy="250" r="80" stroke="#000000" stroke-width="1" fill="none"/>
                <circle id="scene1-right-circle-inner" cx="600" cy="250" r="40" stroke="#000000" stroke-width="1" fill="none"/>
                <!-- 放射线（8 条） -->
                <line id="scene1-right-line-1" x1="600" y1="130" x2="600" y2="370" stroke="#000000" stroke-width="1"/>
                <line id="scene1-right-line-2" x1="480" y1="250" x2="720" y2="250" stroke="#000000" stroke-width="1"/>
                <line id="scene1-right-line-3" x1="516" y1="165" x2="684" y2="335" stroke="#000000" stroke-width="1"/>
                <line id="scene1-right-line-4" x1="516" y1="335" x2="684" y2="165" stroke="#000000" stroke-width="1"/>
                <!-- 经线标签 -->
                <text id="scene1-right-label-180" x="600" y="105" text-anchor="middle" font-size="14" fill="#000000">180°</text>
                <text id="scene1-right-label-0" x="600" y="390" text-anchor="middle" font-size="14" fill="#000000">0°</text>
                <!-- 顺时针箭头（初始灰色，步骤 2 高亮） -->
                <path id="scene1-arrow-right" d="M 570,100 A 150,150 0 0,0 550,250" stroke="#9e9e9e" stroke-width="3" fill="none" marker-end="url(#arrowhead-right)"/>
                <defs>
                    <marker id="arrowhead-right" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                        <polygon points="0 0, 10 3.5, 0 7" fill="#9e9e9e"/>
                    </marker>
                </defs>
                <!-- 地球自转方向标签（移到右侧更远处，y 值调整避免裁切） -->
                <text id="scene1-arrow-label-right" x="780" y="200" font-size="12" fill="#9e9e9e" transform="rotate(90, 780, 200)">地球自转方向</text>
                <!-- B 点（步骤 4 显示） -->
                <circle id="scene1-point-b" cx="657" cy="307" r="4" fill="#2e7d32" display="none"/>
                <text id="scene1-label-b" x="700" y="325" font-size="14" font-weight="bold" fill="#000000" display="none">B</text>
            </g>

            <!-- 提示框（上移避免与按钮重叠） -->
            <rect id="scene1-hint-box" x="250" y="400" width="300" height="50" fill="#e3f2fd" fill-opacity="0.5" stroke="#1565c0" stroke-width="1" rx="4"/>
            <text id="scene1-hint-text" x="400" y="430" text-anchor="middle" font-size="14" fill="#1565c0">观察两幅极地投影图的自转方向</text>

            <!-- 结论选项框（步骤 5 显示） -->
            <rect id="scene1-conclusion-box" x="280" y="360" width="240" height="50" fill="none" stroke="#2e7d32" stroke-width="3" display="none"/>
            <text id="scene1-conclusion-text" x="400" y="385" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e7d32" display="none">正确选项：C</text>
            <text id="scene1-conclusion-detail" x="400" y="405" text-anchor="middle" font-size="12" fill="#2e7d32" display="none">B 点在南半球</text>
        </svg>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-prev-btn" disabled>◀ 上一步</button>
            <button id="scene1-next-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现：地球自转方向与南北半球判断
        // 布局坐标表（参考）：
        // | 元素 | 位置 | 备注 |
        // | 左图中心 | (200,250) | 北极俯视图 |
        // | 右图中心 | (600,250) | 南极俯视图 |
        // | A 点 | (143,193) | 左图 135°方向，半径 80px |
        // | B 点 | (657,307) | 右图 315°方向，半径 80px |
        // | 提示框 | (250,400)-(550,450) | 动态文字提示区 |
        // | 按钮 | y=450~480 | 控件栏 |

        var currentStep = 0;
        var maxStep = 5;

        // 提示文字内容
        var hintTexts = [
            '观察两幅极地投影图的自转方向',
            '逆时针旋转 → 北极俯视图 → 北半球',
            '顺时针旋转 → 南极俯视图 → 南半球',
            'A 点位于北半球（北极俯视图）',
            'B 点位于南半球（南极俯视图）',
            '口诀：北逆南顺'
        ];

        function updateStep() {
            // 更新提示文字
            var hintTextEl = document.getElementById('scene1-hint-text');
            hintTextEl.textContent = hintTexts[currentStep];

            // 更新箭头高亮状态
            var arrowLeft = document.getElementById('scene1-arrow-left');
            var arrowLeftLabel = document.getElementById('scene1-arrow-label-left');
            var arrowRight = document.getElementById('scene1-arrow-right');
            var arrowRightLabel = document.getElementById('scene1-arrow-label-right');

            if (currentStep >= 1) {
                // 左图箭头高亮
                arrowLeft.setAttribute('stroke', '#1565c0');
                arrowLeft.setAttribute('stroke-width', '4');
                arrowLeftLabel.setAttribute('fill', '#1565c0');
                arrowLeftLabel.setAttribute('font-weight', 'bold');
            } else {
                arrowLeft.setAttribute('stroke', '#9e9e9e');
                arrowLeft.setAttribute('stroke-width', '3');
                arrowLeftLabel.setAttribute('fill', '#9e9e9e');
                arrowLeftLabel.removeAttribute('font-weight');
            }

            if (currentStep >= 2) {
                // 右图箭头高亮
                arrowRight.setAttribute('stroke', '#1565c0');
                arrowRight.setAttribute('stroke-width', '4');
                arrowRightLabel.setAttribute('fill', '#1565c0');
                arrowRightLabel.setAttribute('font-weight', 'bold');
            } else {
                arrowRight.setAttribute('stroke', '#9e9e9e');
                arrowRight.setAttribute('stroke-width', '3');
                arrowRightLabel.setAttribute('fill', '#9e9e9e');
                arrowRightLabel.removeAttribute('font-weight');
            }

            // 更新 A 点显示（步骤 3 起显示）
            var pointA = document.getElementById('scene1-point-a');
            var labelA = document.getElementById('scene1-label-a');
            if (currentStep >= 3) {
                pointA.style.display = 'block';
                labelA.style.display = 'block';
            } else {
                pointA.style.display = 'none';
                labelA.style.display = 'none';
            }

            // 更新 B 点显示（步骤 4 起显示）
            var pointB = document.getElementById('scene1-point-b');
            var labelB = document.getElementById('scene1-label-b');
            if (currentStep >= 4) {
                pointB.style.display = 'block';
                labelB.style.display = 'block';
            } else {
                pointB.style.display = 'none';
                labelB.style.display = 'none';
            }

            // 更新结论框显示（步骤 5 显示）
            var conclusionBox = document.getElementById('scene1-conclusion-box');
            var conclusionText = document.getElementById('scene1-conclusion-text');
            var conclusionDetail = document.getElementById('scene1-conclusion-detail');
            if (currentStep >= 5) {
                conclusionBox.style.display = 'block';
                conclusionText.style.display = 'block';
                conclusionDetail.style.display = 'block';
            } else {
                conclusionBox.style.display = 'none';
                conclusionText.style.display = 'none';
                conclusionDetail.style.display = 'none';
            }

            // 更新按钮状态
            var prevBtn = document.getElementById('scene1-prev-btn');
            var nextBtn = document.getElementById('scene1-next-btn');

            prevBtn.disabled = (currentStep === 0);
            nextBtn.disabled = (currentStep === maxStep);
        }

        // 绑定按钮事件
        document.getElementById('scene1-prev-btn').addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });

        document.getElementById('scene1-next-btn').addEventListener('click', function() {
            if (currentStep < maxStep) {
                currentStep++;
                updateStep();
            }
        });

        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
