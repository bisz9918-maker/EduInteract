<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 1 - 滑动变阻器对电路的影响</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 15px; z-index: 10; }
        #scene1-slider-label { font-size: 14px; color: #333; }
        #scene1-slider { width: 300px; height: 20px; }
        .reading-box { position: absolute; background: #fff; border: 2px solid #333; border-radius: 5px; padding: 5px 10px; font-size: 13px; font-weight: bold; }
        #scene1-ammeter-reading { left: 510px; bottom: 70px; }
        #scene1-voltmeter-reading { left: 260px; bottom: 70px; }
        .reading-increase { color: #c62828; }
        .reading-decrease { color: #2e7d32; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <!-- SVG 图示区：固定 800×500px -->
        <svg width="800" height="500" id="scene1-svg">
            <!-- 导线层（底层） -->
            <!-- 电源正极向上 -->
            <line x1="100" y1="240" x2="100" y2="180" stroke="#000" stroke-width="2"/>
            <!-- 电源到开关 -->
            <line x1="100" y1="240" x2="140" y2="240" stroke="#000" stroke-width="2"/>
            <!-- 开关到滑动变阻器左端 -->
            <line x1="160" y1="240" x2="160" y2="180" stroke="#000" stroke-width="2"/>
            <line x1="160" y1="180" x2="200" y2="180" stroke="#000" stroke-width="2"/>
            <!-- 滑动变阻器 -->
            <line x1="380" y1="180" x2="420" y2="180" stroke="#000" stroke-width="2"/>
            <!-- 滑动变阻器到螺线管 -->
            <line x1="420" y1="180" x2="420" y2="200" stroke="#000" stroke-width="2"/>
            <!-- 螺线管底部到电流表 -->
            <line x1="460" y1="200" x2="500" y2="200" stroke="#000" stroke-width="2"/>
            <!-- 电流表到节点 -->
            <line x1="550" y1="200" x2="580" y2="200" stroke="#000" stroke-width="2"/>
            <line x1="580" y1="200" x2="580" y2="260" stroke="#000" stroke-width="2"/>
            <!-- 节点到定值电阻 -->
            <line x1="580" y1="260" x2="520" y2="260" stroke="#000" stroke-width="2"/>
            <!-- 定值电阻到电源负极 -->
            <line x1="480" y1="260" x2="480" y2="280" stroke="#000" stroke-width="2"/>
            <line x1="480" y1="280" x2="100" y2="280" stroke="#000" stroke-width="2"/>
            <line x1="100" y1="280" x2="100" y2="260" stroke="#000" stroke-width="2"/>
            
            <!-- 电压表并联连线（虚线） -->
            <line x1="200" y1="180" x2="200" y2="230" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
            <line x1="380" y1="180" x2="380" y2="230" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
            <line x1="200" y1="230" x2="280" y2="230" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
            <line x1="300" y1="230" x2="380" y2="230" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
            
            <!-- 元件层 -->
            <!-- 电源（电池符号） -->
            <line x1="90" y1="230" x2="90" y2="270" stroke="#000" stroke-width="3"/>
            <line x1="110" y1="240" x2="110" y2="260" stroke="#000" stroke-width="2"/>
            <text x="75" y="245" font-size="14" fill="#000">+</text>
            <text x="75" y="265" font-size="14" fill="#000">-</text>
            
            <!-- 开关 S -->
            <line x1="140" y1="240" x2="155" y2="240" stroke="#000" stroke-width="2"/>
            <line x1="155" y1="240" x2="160" y2="250" stroke="#000" stroke-width="2"/>
            <circle cx="140" cy="240" r="4" fill="#000"/>
            <circle cx="160" cy="250" r="4" fill="#000"/>
            <text x="145" y="225" font-size="14" fill="#000" font-weight="bold">S</text>
            
            <!-- 滑动变阻器 R（电阻丝矩形） -->
            <rect x="200" y="170" width="180" height="20" fill="#fff" stroke="#000" stroke-width="2"/>
            <text x="285" y="135" font-size="14" fill="#000" font-weight="bold">R</text>
            
            <!-- 滑片（箭头） -->
            <g id="scene1-wiper" style="cursor: pointer;">
                <line x1="300" y1="150" x2="300" y2="185" stroke="#1565c0" stroke-width="3"/>
                <polygon points="300,185 295,195 305,195" fill="#1565c0"/>
            </g>
            
            <!-- 滑片拖动区域（半透明高亮） -->
            <rect x="200" y="130" width="180" height="40" fill="#1565c0" fill-opacity="0.1" stroke="#1565c0" stroke-width="1" stroke-dasharray="4,4"/>
            
            <!-- 电压表 V -->
            <circle cx="280" cy="230" r="22" fill="#fff" stroke="#000" stroke-width="2"/>
            <text x="265" y="265" font-size="14" fill="#000" font-weight="bold">V</text>
            
            <!-- 螺线管 B（线圈示意图） -->
            <g id="scene1-solenoid">
                <line x1="420" y1="180" x2="420" y2="280" stroke="#000" stroke-width="2"/>
                <line x1="460" y1="180" x2="460" y2="280" stroke="#000" stroke-width="2"/>
                <!-- 线圈绕组 -->
                <path d="M420,190 Q440,185 460,190" fill="none" stroke="#000" stroke-width="2"/>
                <path d="M420,215 Q440,210 460,215" fill="none" stroke="#000" stroke-width="2"/>
                <path d="M420,240 Q440,235 460,240" fill="none" stroke="#000" stroke-width="2"/>
                <path d="M420,265 Q440,260 460,265" fill="none" stroke="#000" stroke-width="2"/>
            </g>
            <text x="470" y="235" font-size="14" fill="#000" font-weight="bold">B</text>
            
            <!-- 电流表 A -->
            <circle cx="530" cy="200" r="22" fill="#fff" stroke="#000" stroke-width="2"/>
            <text x="490" y="235" font-size="14" fill="#000" font-weight="bold">A</text>
            
            <!-- 定值电阻 R₀ -->
            <rect x="480" y="250" width="60" height="20" fill="#fff" stroke="#000" stroke-width="2"/>
            <text x="495" y="240" font-size="14" fill="#000" font-weight="bold">R₀</text>
            
            <!-- 弹簧测力计 -->
            <line x1="600" y1="20" x2="630" y2="20" stroke="#000" stroke-width="2"/>
            <!-- 斜线填充表示固定端 -->
            <line x1="600" y1="20" x2="605" y2="15" stroke="#000" stroke-width="1"/>
            <line x1="605" y1="20" x2="610" y2="15" stroke="#000" stroke-width="1"/>
            <line x1="610" y1="20" x2="615" y2="15" stroke="#000" stroke-width="1"/>
            <line x1="615" y1="20" x2="620" y2="15" stroke="#000" stroke-width="1"/>
            <line x1="620" y1="20" x2="625" y2="15" stroke="#000" stroke-width="1"/>
            <line x1="625" y1="20" x2="630" y2="15" stroke="#000" stroke-width="1"/>
            <!-- 弹簧 -->
            <path d="M610,20 L610,35 L615,35 L615,45 L610,45 L610,55 L615,55 L615,65 L610,65 L610,80" fill="none" stroke="#000" stroke-width="1.5"/>
            
            <!-- 磁铁 A -->
            <rect x="600" y="80" width="20" height="50" fill="#fff" stroke="#000" stroke-width="2"/>
            <!-- S 极（上半部分） -->
            <rect x="600" y="80" width="20" height="25" fill="#fff" stroke="#000" stroke-width="1"/>
            <text x="585" y="98" font-size="14" fill="#000" font-weight="bold">S</text>
            <!-- N 极（下半部分，灰色） -->
            <rect x="600" y="105" width="20" height="25" fill="#9e9e9e" stroke="#000" stroke-width="1"/>
            <text x="585" y="123" font-size="14" fill="#000" font-weight="bold">N</text>
            <text x="550" y="108" font-size="14" fill="#000" font-weight="bold">A</text>
        </svg>
        
        <!-- 控件栏叠在 SVG 底部 -->
        <div id="scene1-controls">
            <span id="scene1-slider-label">滑片位置</span>
            <input type="range" id="scene1-slider" min="200" max="380" value="300" step="1">
        </div>
        
        <!-- 电表读数框 -->
        <div id="scene1-ammeter-reading" class="reading-box">I = 0.50 A</div>
        <div id="scene1-voltmeter-reading" class="reading-box">U = 5.00 V</div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现
        // 布局坐标表对照：
        // | 元素 | 位置/范围 | 备注 |
        // | 电源 | (90,230)-(110,270) | 左侧竖直放置 |
        // | 开关 S | (140,240)-(160,250) | 闭合状态 |
        // | 滑动变阻器 R | (200,170)-(380,190) | 电阻丝部分 |
        // | 滑片 | (300,150)-(300,195) | 初始中间位置 |
        // | 螺线管 B | (420,180)-(460,280) | 竖直线圈 |
        // | 电流表 A | (508,178)-(552,222) | 串联 |
        // | 电压表 V | (258,208)-(302,252) | 并联在滑动变阻器 |
        // | 弹簧测力计 | (600,20)-(630,80) | 顶部固定 |
        // | 磁铁 A | (600,80)-(620,130) | N 极在下 |
        // | 定值电阻 R₀ | (480,250)-(540,270) | 水平放置 |
        
        // 电路参数设定
        const U_POWER = 12;      // 电源电压 12V
        const R0 = 10;           // 定值电阻 10Ω
        const R_MAX = 14;        // 滑动变阻器最大电阻 14Ω
        const SLIDER_MIN = 200;  // 滑片最小 x 坐标
        const SLIDER_MAX = 380;  // 滑片最大 x 坐标
        const SLIDER_WIDTH = SLIDER_MAX - SLIDER_MIN; // 180px
        
        // 状态变量
        let wiperX = 300;  // 滑片当前 x 坐标
        let prevCurrent = 0.50;  // 用于判断电流变化方向
        let prevVoltage = 5.00;  // 用于判断电压变化方向
        
        // 获取 DOM 元素
        const wiper = document.getElementById('scene1-wiper');
        const slider = document.getElementById('scene1-slider');
        const ammeterReading = document.getElementById('scene1-ammeter-reading');
        const voltmeterReading = document.getElementById('scene1-voltmeter-reading');
        
        // 计算函数
        function calculateValues(x) {
            // 滑片位置与接入电阻的关系
            // 滑片越靠右，接入电阻越小
            const ratio = (SLIDER_MAX - x) / SLIDER_WIDTH;
            const R_access = R_MAX * ratio;  // 接入电阻
            
            // 总电阻
            const R_total = R0 + R_access;
            
            // 电流 I = U / R_total
            const I = U_POWER / R_total;
            
            // 电压表读数（滑动变阻器两端电压）
            const U_V = I * R_access;
            
            return { I, U_V, R_access };
        }
        
        // 更新显示
        function updateDisplay(x) {
            const values = calculateValues(x);
            
            // 更新滑片位置
            wiperX = x;
            wiper.setAttribute('transform', `translate(${x - 300}, 0)`);
            
            // 更新滑块控件
            slider.value = x;
            
            // 更新电流表读数
            const currentStr = values.I.toFixed(2);
            ammeterReading.textContent = `I = ${currentStr} A`;
            
            // 判断电流变化方向并设置颜色
            if (values.I > prevCurrent + 0.01) {
                ammeterReading.className = 'reading-box reading-increase';
            } else if (values.I < prevCurrent - 0.01) {
                ammeterReading.className = 'reading-box reading-decrease';
            }
            prevCurrent = values.I;
            
            // 更新电压表读数
            const voltageStr = values.U_V.toFixed(2);
            voltmeterReading.textContent = `U = ${voltageStr} V`;
            
            // 判断电压变化方向并设置颜色
            if (values.U_V > prevVoltage + 0.01) {
                voltmeterReading.className = 'reading-box reading-increase';
            } else if (values.U_V < prevVoltage - 0.01) {
                voltmeterReading.className = 'reading-box reading-decrease';
            }
            prevVoltage = values.U_V;
        }
        
        // 拖拽处理
        let isDragging = false;
        
        function handleDragStart(e) {
            isDragging = true;
            handleDragMove(e);
        }
        
        function handleDragMove(e) {
            if (!isDragging) return;
            
            const svg = document.getElementById('scene1-svg');
            const rect = svg.getBoundingClientRect();
            
            // 计算鼠标/触摸在 SVG 中的 x 坐标
            let clientX = e.clientX;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
            }
            
            let svgX = clientX - rect.left;
            
            // 限制在拖动区域内
            svgX = Math.max(SLIDER_MIN, Math.min(SLIDER_MAX, svgX));
            
            updateDisplay(svgX);
        }
        
        function handleDragEnd() {
            isDragging = false;
        }
        
        // 绑定滑片拖拽事件
        wiper.addEventListener('mousedown', handleDragStart);
        wiper.addEventListener('touchstart', handleDragStart);
        
        document.addEventListener('mousemove', handleDragMove);
        document.addEventListener('touchmove', handleDragMove);
        
        document.addEventListener('mouseup', handleDragEnd);
        document.addEventListener('touchend', handleDragEnd);
        
        // 绑定滑块控件事件
        slider.addEventListener('input', function(e) {
            updateDisplay(parseInt(e.target.value));
        });
        
        // 初始化显示
        updateDisplay(300);
    })();
    </script>
</body>
</html>
