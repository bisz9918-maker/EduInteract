<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水平滑轮组结构与运动关系分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Microsoft YaHei', sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene1-btn { 
            padding: 8px 20px; 
            font-size: 14px; 
            border: none; 
            border-radius: 5px; 
            background: #1565c0; 
            color: white; 
            cursor: pointer; 
            transition: background 0.3s;
        }
        .scene1-btn:hover:not(:disabled) { background: #0d47a1; }
        .scene1-btn:disabled { background: #90a4ae; cursor: not-allowed; }
        svg { display: block; }
        .scene1-text { font-size: 16px; fill: #000000; }
        .scene1-text-small { font-size: 14px; fill: #000000; }
        .scene1-text-large { font-size: 18px; fill: #000000; }
        .scene1-label-f { fill: #c62828; font-size: 18px; font-weight: bold; }
        .scene1-label-f-small { fill: #c62828; font-size: 14px; }
        .scene1-label-fx { fill: #2e7d32; font-size: 16px; }
        .scene1-label-blue { fill: #1565c0; font-size: 18px; font-weight: bold; }
        .scene1-label-blue-small { fill: #1565c0; font-size: 14px; }
        .scene1-highlight { opacity: 0; transition: opacity 0.3s ease-in-out; }
        .scene1-show { opacity: 1; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene1-arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#c62828"/>
                </marker>
                <marker id="scene1-arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#2e7d32"/>
                </marker>
            </defs>

            <!-- 步骤 0：基础结构 -->
            <g id="scene1-step0">
                <!-- 桌面 -->
                <line x1="80" y1="280" x2="400" y2="280" stroke="#000000" stroke-width="2"/>
                <!-- 桌面阴影线 -->
                <g stroke="#000000" stroke-width="1" opacity="0.3">
                    <line x1="80" y1="284" x2="70" y2="300"/>
                    <line x1="100" y1="284" x2="90" y2="300"/>
                    <line x1="120" y1="284" x2="110" y2="300"/>
                    <line x1="140" y1="284" x2="130" y2="300"/>
                    <line x1="160" y1="284" x2="150" y2="300"/>
                    <line x1="180" y1="284" x2="170" y2="300"/>
                    <line x1="200" y1="284" x2="190" y2="300"/>
                    <line x1="220" y1="284" x2="210" y2="300"/>
                    <line x1="240" y1="284" x2="230" y2="300"/>
                    <line x1="260" y1="284" x2="250" y2="300"/>
                    <line x1="280" y1="284" x2="270" y2="300"/>
                    <line x1="300" y1="284" x2="290" y2="300"/>
                    <line x1="320" y1="284" x2="310" y2="300"/>
                    <line x1="340" y1="284" x2="330" y2="300"/>
                    <line x1="360" y1="284" x2="350" y2="300"/>
                    <line x1="380" y1="284" x2="370" y2="300"/>
                </g>

                <!-- 物体 A -->
                <rect x="120" y="200" width="100" height="80" fill="#f5f5f5" fill-opacity="0.5" stroke="#000000" stroke-width="2"/>
                <text x="170" y="252" text-anchor="middle" class="scene1-text-large">A</text>

                <!-- 动滑轮 1（最左侧） -->
                <circle cx="420" cy="240" r="25" fill="none" stroke="#000000" stroke-width="2"/>
                <!-- 动滑轮 2（中间） -->
                <circle cx="470" cy="240" r="25" fill="none" stroke="#000000" stroke-width="2"/>
                <!-- 定滑轮（最右侧，固定） -->
                <circle cx="520" cy="240" r="25" fill="none" stroke="#000000" stroke-width="2"/>

                <!-- 墙面 -->
                <line x1="570" y1="180" x2="570" y2="300" stroke="#000000" stroke-width="3"/>
                <!-- 墙面阴影线 -->
                <g stroke="#000000" stroke-width="1" opacity="0.3">
                    <line x1="574" y1="180" x2="590" y2="195"/>
                    <line x1="574" y1="200" x2="590" y2="215"/>
                    <line x1="574" y1="220" x2="590" y2="235"/>
                    <line x1="574" y1="240" x2="590" y2="255"/>
                    <line x1="574" y1="260" x2="590" y2="275"/>
                    <line x1="574" y1="280" x2="590" y2="295"/>
                </g>

                <!-- 绳子主线 -->
                <!-- 段 1：从物体 A 右侧到动滑轮 1 左侧 -->
                <line x1="220" y1="240" x2="395" y2="240" stroke="#000000" stroke-width="2"/>
                <!-- 段 2：绕过动滑轮 1 上半部分 -->
                <path d="M395,240 A25,25 0 0,1 395,190" fill="none" stroke="#000000" stroke-width="2"/>
                <!-- 段 3：从动滑轮 1 顶部到动滑轮 2 顶部 -->
                <line x1="395" y1="190" x2="445" y2="190" stroke="#000000" stroke-width="2"/>
                <!-- 段 4：绕过动滑轮 2 上半部分 -->
                <path d="M445,190 A25,25 0 0,1 445,240" fill="none" stroke="#000000" stroke-width="2"/>
                <!-- 段 5：从动滑轮 2 右侧到定滑轮右侧 -->
                <line x1="495" y1="240" x2="495" y2="265" stroke="#000000" stroke-width="2"/>
                <line x1="495" y1="265" x2="545" y2="265" stroke="#000000" stroke-width="2"/>
                <line x1="545" y1="265" x2="545" y2="240" stroke="#000000" stroke-width="2"/>
                <!-- 段 6：绕过定滑轮下半部分 -->
                <path d="M545,240 A25,25 0 0,0 495,240" fill="none" stroke="#000000" stroke-width="2"/>
                <!-- 段 7：从定滑轮顶部向上到拉力 F -->
                <line x1="520" y1="215" x2="520" y2="180" stroke="#000000" stroke-width="2"/>

                <!-- 拉力 F 箭头 -->
                <line x1="550" y1="175" x2="500" y2="175" stroke="#c62828" stroke-width="3" marker-end="url(#scene1-arrow-red)"/>
                <text x="515" y="155" text-anchor="middle" class="scene1-label-f">F</text>

                <!-- 摩擦力 f 箭头 -->
                <line x1="170" y1="295" x2="130" y2="295" stroke="#2e7d32" stroke-width="3" marker-end="url(#scene1-arrow-green)"/>
                <text x="150" y="315" text-anchor="middle" class="scene1-label-fx">f</text>
            </g>

            <!-- 步骤 1：n=3 标注和承重绳子高亮 -->
            <g id="scene1-step1" class="scene1-highlight">
                <!-- 三段承重绳子高亮（蓝色加粗） -->
                <line x1="220" y1="240" x2="395" y2="240" stroke="#1565c0" stroke-width="4" opacity="0.7"/>
                <line x1="395" y1="190" x2="445" y2="190" stroke="#1565c0" stroke-width="4" opacity="0.7"/>
                <line x1="495" y1="240" x2="545" y2="240" stroke="#1565c0" stroke-width="4" opacity="0.7"/>
                
                <!-- n=3 标注 -->
                <text x="445" y="145" text-anchor="middle" class="scene1-label-blue">n=3</text>
                <!-- 蓝色括号示意三段绳子 -->
                <path d="M405,155 L405,175 L485,175 L485,155" fill="none" stroke="#1565c0" stroke-width="2" opacity="0.5"/>
            </g>

            <!-- 步骤 2：距离关系标注 -->
            <g id="scene1-step2" class="scene1-highlight">
                <!-- S 物标注（绿色虚线） -->
                <line x1="170" y1="330" x2="220" y2="330" stroke="#2e7d32" stroke-width="1" stroke-dasharray="5,5"/>
                <text x="195" y="350" text-anchor="middle" class="scene1-label-fx">S<tspan baseline-shift="sub" font-size="12">物</tspan></text>
                
                <!-- S 绳标注（蓝色虚线）- 移到更上方 -->
                <line x1="500" y1="115" x2="550" y2="115" stroke="#1565c0" stroke-width="1" stroke-dasharray="5,5"/>
                <text x="525" y="105" text-anchor="middle" class="scene1-label-blue-small">S<tspan baseline-shift="sub" font-size="12">绳</tspan></text>
                
                <!-- 距离关系公式 - 移到更上方，与 S 绳保持间距 -->
                <text x="525" y="80" text-anchor="middle" class="scene1-label-blue-small">S<tspan baseline-shift="sub" font-size="12">绳</tspan> = 3 × S<tspan baseline-shift="sub" font-size="12">物</tspan></text>
            </g>

            <!-- 步骤 3：速度关系标注 -->
            <g id="scene1-step3" class="scene1-highlight">
                <!-- v 物标注 - 下移，与 S 物保持间距 -->
                <text x="195" y="375" text-anchor="middle" class="scene1-label-fx">v<tspan baseline-shift="sub" font-size="12">物</tspan></text>
                
                <!-- v 绳标注 - 移到更上方，与公式保持间距 -->
                <text x="525" y="50" text-anchor="middle" class="scene1-label-blue-small">v<tspan baseline-shift="sub" font-size="12">绳</tspan></text>
                
                <!-- 速度关系公式 - 移到更上方 -->
                <text x="525" y="25" text-anchor="middle" class="scene1-label-blue-small">v<tspan baseline-shift="sub" font-size="12">绳</tspan> = 3 × v<tspan baseline-shift="sub" font-size="12">物</tspan></text>
            </g>

            <!-- 步骤 4：总结框 - 移到顶部，避开所有其他元素 -->
            <g id="scene1-step4" class="scene1-highlight">
                <!-- 总结框背景 - 移到最顶部 -->
                <rect x="150" y="5" width="500" height="60" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" rx="5"/>
                <!-- 总结文字 -->
                <text x="400" y="28" text-anchor="middle" class="scene1-text-large" fill="#1565c0">滑轮组规律：</text>
                <text x="400" y="50" text-anchor="middle" class="scene1-text" fill="#000000">n=3 → S<tspan baseline-shift="sub" font-size="14">绳</tspan>=n×S<tspan baseline-shift="sub" font-size="14">物</tspan>，v<tspan baseline-shift="sub" font-size="14">绳</tspan>=n×v<tspan baseline-shift="sub" font-size="14">物</tspan></text>
            </g>
        </svg>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn" disabled>◀ 上一步</button>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        // 布局坐标表对照：
        // | 元素 | 类型 | 位置/范围 |
        // | 桌面 | 线段 | (80,280)-(400,280) |
        // | 物体 A | 矩形 | (120,200)-(220,280) |
        // | A 标签 | text | (170,252) |
        // | 动滑轮 1 | 圆 | (420,240) r=25 |
        // | 动滑轮 2 | 圆 | (470,240) r=25 |
        // | 定滑轮 | 圆 | (520,240) r=25 |
        // | 墙面 | 竖线 | (570,180)-(570,300) |
        // | F 标签 | text | (515,155) |
        // | f 标签 | text | (150,315) |
        // | n=3 标注 | text | (445,145) |
        // | S 物标注 | text | (195,350) |
        // | S 绳标注 | text | (525,105) |
        // | v 物标注 | text | (195,375) |
        // | v 绳标注 | text | (525,50) |

        var currentStep = 0;
        var totalSteps = 4;

        // 获取 DOM 元素
        var btnPrev = document.getElementById('scene1-btn-prev');
        var btnNext = document.getElementById('scene1-btn-next');
        var stepGroups = [
            document.getElementById('scene1-step0'),
            document.getElementById('scene1-step1'),
            document.getElementById('scene1-step2'),
            document.getElementById('scene1-step3'),
            document.getElementById('scene1-step4')
        ];

        // 更新显示状态
        function updateDisplay() {
            // 显示当前步骤及之前的所有步骤元素
            for (var i = 0; i <= totalSteps; i++) {
                if (i <= currentStep) {
                    stepGroups[i].classList.add('scene1-show');
                    stepGroups[i].style.opacity = '1';
                } else {
                    stepGroups[i].classList.remove('scene1-show');
                    stepGroups[i].style.opacity = '0';
                }
            }

            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps);
        }

        // 上一步按钮点击
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        });

        // 下一步按钮点击
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateDisplay();
            }
        });

        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
