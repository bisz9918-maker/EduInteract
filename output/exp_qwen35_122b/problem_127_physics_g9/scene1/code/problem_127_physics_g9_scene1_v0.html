<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>光通过平行玻璃砖的折射光路</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            width: 120px;
            height: 30px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #333;
            border-radius: 4px;
            background: #f5f5f5;
        }
        #scene1-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene1-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene1-element { transition: opacity 0.3s ease; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500">
            <!-- 玻璃砖 -->
            <rect id="scene1-glass-brick" class="scene1-element" x="250" y="180" width="300" height="140" 
                  fill="#e3f2fd" fill-opacity="0.2" stroke="#000000" stroke-width="2"/>
            
            <!-- 标签：空气（上）- 移到左上角远离光线 -->
            <text id="scene1-label-air-top" class="scene1-element" x="120" y="60" text-anchor="middle" 
                  font-size="14" fill="#000000">空气</text>
            
            <!-- 标签：玻璃 - 调整到玻璃砖右侧外部 -->
            <text id="scene1-label-glass" class="scene1-element" x="570" y="250" text-anchor="middle" 
                  font-size="14" fill="#000000">玻璃</text>
            
            <!-- 标签：空气（下）- 调整位置到右下角 -->
            <text id="scene1-label-air-bottom" class="scene1-element" x="600" y="440" text-anchor="middle" 
                  font-size="14" fill="#000000">空气</text>
            
            <!-- 入射光线 -->
            <g id="scene1-incident-ray" class="scene1-element">
                <line x1="150" y1="80" x2="350" y2="180" stroke="#c62828" stroke-width="2.5"/>
                <polygon points="350,180 340,170 345,175" fill="#c62828" transform="rotate(-45 350 180)"/>
            </g>
            
            <!-- 法线 1 -->
            <line id="scene1-normal-1" class="scene1-element" x1="350" y1="120" x2="350" y2="240" 
                  stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
            
            <!-- 法线 2 -->
            <line id="scene1-normal-2" class="scene1-element" x1="450" y1="260" x2="450" y2="380" 
                  stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
            
            <!-- 入射角弧线 i₁ -->
            <path id="scene1-angle-i1" class="scene1-element" d="M 378.28 151.72 A 40 40 0 0 0 350 140" 
                  fill="none" stroke="#1565c0" stroke-width="1.5"/>
            <text id="scene1-label-i1" class="scene1-element" x="390" y="140" font-size="14" fill="#1565c0">i₁</text>
            
            <!-- 折射角弧线 r₁ - 调整标签位置到玻璃砖左侧外部 -->
            <path id="scene1-angle-r1" class="scene1-element" d="M 350 235 A 55 55 0 0 1 389.1 200.9" 
                  fill="none" stroke="#1565c0" stroke-width="1.5"/>
            <text id="scene1-label-r1" class="scene1-element" x="230" y="240" font-size="14" fill="#1565c0">r₁</text>
            
            <!-- 玻璃内光线 -->
            <g id="scene1-glass-ray" class="scene1-element">
                <line x1="350" y1="180" x2="450" y2="320" stroke="#c62828" stroke-width="2.5"/>
                <polygon points="450,320 440,310 445,315" fill="#c62828" transform="rotate(-54.5 450 320)"/>
            </g>
            
            <!-- 入射角弧线 i₂ - 调整弧线位置到法线右侧（玻璃砖外部上方），标签移到玻璃砖外部上方 -->
            <path id="scene1-angle-i2" class="scene1-element" d="M 450 280 A 40 40 0 0 0 478.28 291.72" 
                  fill="none" stroke="#1565c0" stroke-width="1.5"/>
            <text id="scene1-label-i2" class="scene1-element" x="485" y="255" font-size="14" fill="#1565c0">i₂</text>
            
            <!-- 折射角弧线 r₂ -->
            <path id="scene1-angle-r2" class="scene1-element" d="M 450 375 A 55 55 0 0 1 489.1 340.9" 
                  fill="none" stroke="#1565c0" stroke-width="1.5"/>
            <text id="scene1-label-r2" class="scene1-element" x="400" y="370" font-size="14" fill="#1565c0">r₂</text>
            
            <!-- 出射光线 -->
            <g id="scene1-emergent-ray" class="scene1-element">
                <line x1="450" y1="320" x2="650" y2="420" stroke="#c62828" stroke-width="2.5"/>
                <polygon points="650,420 640,410 645,415" fill="#c62828" transform="rotate(-26.6 650 420)"/>
            </g>
            
            <!-- 入射光线延长线 -->
            <line id="scene1-incident-extended" class="scene1-element" x1="150" y1="80" x2="550" y2="280" 
                  stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
            
            <!-- 侧移量标注线 -->
            <line id="scene1-shift-line" class="scene1-element" x1="550" y1="280" x2="550" y2="380" 
                  stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="5,5"/>
            
            <!-- 侧移量标签 - 调整位置到更右侧 -->
            <text id="scene1-label-shift" class="scene1-element" x="570" y="320" font-size="14" fill="#2e7d32">侧移量 d</text>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-step-prev">◀ 上一步</button>
            <button id="scene1-step-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1: 光通过平行玻璃砖的折射光路
        // 布局坐标表（实现对照依据）：
        // | 元素 | 位置/范围 | 备注 |
        // | 玻璃砖 | (250,180)-(550,320) | 居中放置 |
        // | 入射光线 | (150,80)-(350,180) | 从左上到玻璃砖上表面 |
        // | 玻璃内光线 | (350,180)-(450,320) | 在玻璃砖内部 |
        // | 出射光线 | (450,320)-(650,420) | 从玻璃砖下表面射出 |
        // | 法线 1 | (350,120)-(350,240) | 上表面折射点处 |
        // | 法线 2 | (450,260)-(450,380) | 下表面折射点处 |
        // | 标签"空气"上 | (120,60) | 左上角，远离光线 |
        // | 标签"玻璃" | (570,250) | 玻璃砖右侧外部 |
        // | 标签"空气"下 | (600,440) | 右下角 |
        
        const currentStepMax = 5;
        let currentStep = 0;
        
        // 元素 ID 映射（按步骤分组）
        const stepElements = {
            0: ['scene1-glass-brick', 'scene1-label-air-top', 'scene1-label-glass', 'scene1-label-air-bottom', 'scene1-incident-ray'],
            1: ['scene1-normal-1', 'scene1-angle-i1', 'scene1-label-i1'],
            2: ['scene1-glass-ray', 'scene1-angle-r1', 'scene1-label-r1'],
            3: ['scene1-normal-2', 'scene1-angle-i2', 'scene1-label-i2'],
            4: ['scene1-emergent-ray', 'scene1-angle-r2', 'scene1-label-r2'],
            5: ['scene1-incident-extended', 'scene1-shift-line', 'scene1-label-shift']
        };
        
        // 获取按钮元素
        const prevBtn = document.getElementById('scene1-step-prev');
        const nextBtn = document.getElementById('scene1-step-next');
        
        // 更新元素显示状态
        function updateDisplay() {
            // 步骤 0 的元素始终显示
            stepElements[0].forEach(id => {
                const el = document.getElementById(id);
                if (el) { el.style.display = 'block'; el.style.opacity = '1'; }
            });
            
            // 其他步骤的元素根据当前步骤显示
            for (let step = 1; step <= currentStepMax; step++) {
                stepElements[step].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) {
                        if (step <= currentStep) {
                            el.style.display = 'block';
                            el.style.opacity = '1';
                        } else {
                            el.style.display = 'none';
                            el.style.opacity = '0';
                        }
                    }
                });
            }
            
            // 更新按钮状态
            prevBtn.disabled = (currentStep === 0);
            nextBtn.disabled = (currentStep === currentStepMax);
        }
        
        // 下一步按钮点击
        nextBtn.addEventListener('click', function() {
            if (currentStep < currentStepMax) {
                currentStep++;
                updateDisplay();
            }
        });
        
        // 上一步按钮点击
        prevBtn.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        });
        
        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
