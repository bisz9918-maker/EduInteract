<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>光的折射 - 玻璃砖光路分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Microsoft YaHei', sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene2-btn {
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border: 2px solid #666;
            border-radius: 6px;
            background: #f5f5f5;
            cursor: pointer;
            transition: all 0.2s;
        }
        .scene2-btn:hover { background: #e0e0e0; }
        .scene2-btn.active { background: #2196F3; color: white; border-color: #1976D2; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500">
            <!-- 选项 A -->
            <g id="scene2-opt-A">
                <!-- 边框 -->
                <rect id="scene2-opt-A-border" x="50" y="80" width="140" height="240" fill="none" stroke="#C62828" stroke-width="3"/>
                <!-- 玻璃砖 -->
                <rect x="60" y="120" width="120" height="60" fill="#E3F2BD" stroke="#1976D2" stroke-width="2"/>
                <!-- 法线 -->
                <line x1="120" y1="80" x2="120" y2="220" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
                <!-- 光路 -->
                <polyline id="scene2-opt-A-light" points="80,60 120,120 120,180 120,240" fill="none" stroke="#C62828" stroke-width="2.5"/>
                <!-- 箭头 -->
                <polygon points="120,115 125,120 115,120" fill="#C62828"/>
                <polygon points="120,175 125,180 115,180" fill="#C62828"/>
                <polygon points="120,235 125,240 115,240" fill="#C62828"/>
                <!-- 标识（向下移动避免重叠） -->
                <text x="115" y="355" font-size="18" font-weight="bold" fill="#333">A</text>
                <!-- 标注 -->
                <text id="scene2-opt-A-label" x="60" y="390" font-size="12" fill="#C62828">错误：出射时仍向法线偏折</text>
            </g>

            <!-- 选项 B -->
            <g id="scene2-opt-B">
                <!-- 边框 -->
                <rect id="scene2-opt-B-border" x="210" y="80" width="140" height="240" fill="none" stroke="#2E7D32" stroke-width="3"/>
                <!-- 玻璃砖 -->
                <rect x="220" y="120" width="120" height="60" fill="#E3F2BD" stroke="#1976D2" stroke-width="2"/>
                <!-- 法线 -->
                <line x1="280" y1="80" x2="280" y2="220" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
                <!-- 光路 -->
                <polyline id="scene2-opt-B-light" points="240,60 280,120 280,180 320,240" fill="none" stroke="#C62828" stroke-width="2.5"/>
                <!-- 箭头 -->
                <polygon points="280,115 285,120 275,120" fill="#C62828"/>
                <polygon points="280,175 285,180 275,180" fill="#C62828"/>
                <polygon points="315,235 320,240 310,238" fill="#C62828"/>
                <!-- 标识（向下移动避免重叠） -->
                <text x="305" y="355" font-size="18" font-weight="bold" fill="#333">B</text>
                <!-- 标注 -->
                <text id="scene2-opt-B-label" x="220" y="390" font-size="12" fill="#2E7D32" font-weight="bold">正确：符合折射定律</text>
            </g>

            <!-- 选项 C -->
            <g id="scene2-opt-C">
                <!-- 边框 -->
                <rect id="scene2-opt-C-border" x="370" y="80" width="140" height="240" fill="none" stroke="#C62828" stroke-width="3"/>
                <!-- 玻璃砖 -->
                <rect x="380" y="120" width="120" height="60" fill="#E3F2BD" stroke="#1976D2" stroke-width="2"/>
                <!-- 法线 -->
                <line x1="440" y1="80" x2="440" y2="220" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
                <!-- 光路 -->
                <polyline id="scene2-opt-C-light" points="400,60 440,120 440,180 400,240" fill="none" stroke="#C62828" stroke-width="2.5"/>
                <!-- 箭头 -->
                <polygon points="440,115 445,120 435,120" fill="#C62828"/>
                <polygon points="435,180 440,185 435,175" fill="#C62828"/>
                <polygon points="405,235 410,240 400,238" fill="#C62828"/>
                <!-- 标识（向下移动避免重叠） -->
                <text x="435" y="355" font-size="18" font-weight="bold" fill="#333">C</text>
                <!-- 标注 -->
                <text id="scene2-opt-C-label" x="380" y="390" font-size="12" fill="#C62828">错误：发生全反射</text>
            </g>

            <!-- 选项 D -->
            <g id="scene2-opt-D">
                <!-- 边框 -->
                <rect id="scene2-opt-D-border" x="530" y="80" width="140" height="240" fill="none" stroke="#C62828" stroke-width="3"/>
                <!-- 玻璃砖 -->
                <rect x="540" y="120" width="120" height="60" fill="#E3F2BD" stroke="#1976D2" stroke-width="2"/>
                <!-- 法线 -->
                <line x1="600" y1="80" x2="600" y2="220" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
                <!-- 光路 -->
                <polyline id="scene2-opt-D-light" points="560,60 600,120 600,180 600,240" fill="none" stroke="#C62828" stroke-width="2.5"/>
                <!-- 箭头 -->
                <polygon points="600,115 605,120 595,120" fill="#C62828"/>
                <polygon points="600,175 605,180 595,180" fill="#C62828"/>
                <polygon points="600,235 605,240 595,240" fill="#C62828"/>
                <!-- 标识（向下移动避免重叠） -->
                <text x="595" y="355" font-size="18" font-weight="bold" fill="#333">D</text>
                <!-- 标注 -->
                <text id="scene2-opt-D-label" x="540" y="390" font-size="12" fill="#C62828">错误：无折射现象</text>
            </g>
        </svg>

        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-btn-A" class="scene2-btn">选项 A</button>
            <button id="scene2-btn-B" class="scene2-btn active">选项 B</button>
            <button id="scene2-btn-C" class="scene2-btn">选项 C</button>
            <button id="scene2-btn-D" class="scene2-btn">选项 D</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2: 光通过玻璃砖的折射现象——四个选项对比分析
        // 布局坐标表（参考）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 备注 |
        // |------|------|-----------|------|------|
        // | 选项 A 边框 | rect | (50,80)-(190,320) | 140×240 | 红色边框 |
        // | 选项 B 边框 | rect | (210,80)-(350,320) | 140×240 | 绿色边框（正确） |
        // | 选项 C 边框 | rect | (370,80)-(510,320) | 140×240 | 红色边框 |
        // | 选项 D 边框 | rect | (530,80)-(670,320) | 140×240 | 红色边框 |
        // | 玻璃砖 | rect | 各选项内 (x+10,120)-(x+130,180) | 120×60 | 浅蓝填充 |
        // | 法线 | line | 各选项中心垂直虚线 | 0×140 | 灰色虚线 |
        // | 光路 | polyline | 各选项内折线 | - | 红色带箭头 |

        const options = ['A', 'B', 'C', 'D'];
        const optionColors = {
            'A': { border: '#C62828', label: '#C62828' },
            'B': { border: '#2E7D32', label: '#2E7D32' },
            'C': { border: '#C62828', label: '#C62828' },
            'D': { border: '#C62828', label: '#C62828' }
        };

        let currentOption = 'B'; // 初始状态：默认选中选项 B

        function updateOption(option) {
            if (!options.includes(option)) return;

            // 更新所有选项的边框颜色和标注样式
            options.forEach(opt => {
                const borderEl = document.getElementById('scene2-opt-' + opt + '-border');
                const labelEl = document.getElementById('scene2-opt-' + opt + '-label');
                const btnEl = document.getElementById('scene2-btn-' + opt);

                if (opt === option) {
                    // 高亮当前选项
                    borderEl.setAttribute('stroke', optionColors[opt].border);
                    borderEl.setAttribute('stroke-width', '4');
                    labelEl.setAttribute('font-weight', 'bold');
                    btnEl.classList.add('active');
                } else {
                    // 其他选项恢复
                    borderEl.setAttribute('stroke', optionColors[opt].border);
                    borderEl.setAttribute('stroke-width', '3');
                    labelEl.setAttribute('font-weight', opt === 'B' ? 'bold' : 'normal');
                    btnEl.classList.remove('active');
                }
            });

            currentOption = option;
        }

        // 绑定按钮事件
        options.forEach(opt => {
            const btn = document.getElementById('scene2-btn-' + opt);
            if (btn) {
                btn.addEventListener('click', function() {
                    updateOption(opt);
                });
            }
        });

        // 初始化：确保选项 B 高亮
        updateOption('B');
    })();
    </script>
</body>
</html>
