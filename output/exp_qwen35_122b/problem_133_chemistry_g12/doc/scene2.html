<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - H₂与 O₂反应计算对比</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Microsoft YaHei', sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene2-btn {
            padding: 10px 20px;
            font-size: 14px;
            border: 2px solid #666;
            border-radius: 6px;
            background: #f5f5f5;
            cursor: pointer;
            transition: all 0.2s;
        }
        .scene2-btn:hover { background: #e0e0e0; }
        .scene2-btn.active {
            border-color: #1565c0;
            background: #e3f2fd;
            font-weight: bold;
        }
        .scene2-btn.active.case2 {
            border-color: #c62828;
            background: #ffebee;
        }
        svg { width: 800px; height: 500px; }
        .scene2-text { font-family: 'Microsoft YaHei', sans-serif; }
        .scene2-title { font-size: 16px; font-weight: bold; }
        .scene2-data { font-size: 13px; }
        .scene2-result { font-size: 15px; font-weight: bold; }
        .scene2-answer { font-size: 17px; font-weight: bold; fill: #2e7d32; }
        .scene2-condition { font-size: 14px; fill: #333; }
        .scene2-case1-highlight { fill: #1565c0; }
        .scene2-case2-highlight { fill: #c62828; }
        .scene2-divider { stroke: #cccccc; stroke-width: 1; }
        .scene2-table-header { font-size: 13px; fill: #555; }
        .scene2-table-line { stroke: #dddddd; stroke-width: 1; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 反应方程式 (y=40，避免顶部裁切) -->
            <text x="400" y="40" text-anchor="middle" class="scene2-text scene2-title" font-size="18">2H₂ + O₂ → 2H₂O(l)</text>
            
            <!-- 垂直分隔线 -->
            <line x1="400" y1="80" x2="400" y2="300" class="scene2-divider"/>
            
            <!-- 表头 -->
            <text x="250" y="115" text-anchor="middle" class="scene2-text scene2-table-header">初始量 | 消耗量 | 剩余量</text>
            
            <!-- 情况 1 区域 -->
            <g id="scene2-case1-group" style="display: none;">
                <text x="250" y="85" text-anchor="middle" class="scene2-text scene2-title scene2-case1-highlight">情况 1：O₂完全反应</text>
                
                <!-- 表格线 -->
                <line x1="50" y1="130" x2="390" y2="130" class="scene2-table-line"/>
                <line x1="50" y1="165" x2="390" y2="165" class="scene2-table-line"/>
                <line x1="50" y1="200" x2="390" y2="200" class="scene2-table-line"/>
                <line x1="50" y1="235" x2="390" y2="235" class="scene2-table-line"/>
                <line x1="170" y1="130" x2="170" y2="235" class="scene2-table-line"/>
                <line x1="290" y1="130" x2="290" y2="235" class="scene2-table-line"/>
                
                <!-- 情况 1 数据行 (表格布局) -->
                <!-- 初始量行 -->
                <text x="110" y="150" text-anchor="middle" class="scene2-text scene2-data">V(H₂)=7/3</text>
                <text x="230" y="150" text-anchor="middle" class="scene2-text scene2-data">V(O₂)=2/3</text>
                
                <!-- 消耗量行 -->
                <text x="110" y="185" text-anchor="middle" class="scene2-text scene2-data">ΔV(H₂)=4/3</text>
                <text x="230" y="185" text-anchor="middle" class="scene2-text scene2-data">ΔV(O₂)=2/3</text>
                
                <!-- 剩余量行 -->
                <text x="110" y="220" text-anchor="middle" class="scene2-text scene2-data">V(H₂)=1</text>
                <text x="230" y="220" text-anchor="middle" class="scene2-text scene2-data">V(O₂)=0</text>
                
                <!-- 情况 1 结果框 (独立显示，文字在框外) -->
                <rect x="100" y="250" width="200" height="35" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" rx="5"/>
                <text x="200" y="272" text-anchor="middle" class="scene2-text scene2-result scene2-case1-highlight">H₂:O₂ = 7:2</text>
            </g>
            
            <!-- 情况 2 区域 -->
            <g id="scene2-case2-group" style="display: none;">
                <text x="600" y="85" text-anchor="middle" class="scene2-text scene2-title scene2-case2-highlight">情况 2：H₂完全反应</text>
                
                <!-- 表格线 -->
                <line x1="410" y1="130" x2="750" y2="130" class="scene2-table-line"/>
                <line x1="410" y1="165" x2="750" y2="165" class="scene2-table-line"/>
                <line x1="410" y1="200" x2="750" y2="200" class="scene2-table-line"/>
                <line x1="410" y1="235" x2="750" y2="235" class="scene2-table-line"/>
                <line x1="530" y1="130" x2="530" y2="235" class="scene2-table-line"/>
                <line x1="650" y1="130" x2="650" y2="235" class="scene2-table-line"/>
                
                <!-- 情况 2 数据行 -->
                <!-- 初始量行 -->
                <text x="470" y="150" text-anchor="middle" class="scene2-text scene2-data">V(H₂)=4/3</text>
                <text x="590" y="150" text-anchor="middle" class="scene2-text scene2-data">V(O₂)=5/3</text>
                
                <!-- 消耗量行 -->
                <text x="470" y="185" text-anchor="middle" class="scene2-text scene2-data">ΔV(H₂)=4/3</text>
                <text x="590" y="185" text-anchor="middle" class="scene2-text scene2-data">ΔV(O₂)=2/3</text>
                
                <!-- 剩余量行 -->
                <text x="470" y="220" text-anchor="middle" class="scene2-text scene2-data">V(H₂)=0</text>
                <text x="590" y="220" text-anchor="middle" class="scene2-text scene2-data">V(O₂)=1/3</text>
                
                <!-- 情况 2 结果框 -->
                <rect x="450" y="250" width="200" height="35" fill="#ffebee" stroke="#c62828" stroke-width="2" rx="5"/>
                <text x="550" y="272" text-anchor="middle" class="scene2-text scene2-result scene2-case2-highlight">H₂:O₂ = 4:5</text>
            </g>
            
            <!-- 答案标注 -->
            <text x="400" y="310" text-anchor="middle" class="scene2-text scene2-answer">答案：C．③④</text>
            
            <!-- 条件说明框 (使用独立矩形，文字在框内居中) -->
            <rect x="50" y="350" width="700" height="45" fill="#fafafa" stroke="#888880" stroke-width="2" stroke-dasharray="5,5" rx="5"/>
            <text x="400" y="375" text-anchor="middle" class="scene2-text scene2-condition">已知：右边 H₂+O₂总体积=3，反应后剩余气体体积=1</text>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-btn-case1" class="scene2-btn">情况 1：O₂完全反应</button>
            <button id="scene2-btn-case2" class="scene2-btn">情况 2：H₂完全反应</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现 - H₂与 O₂反应计算对比
        // 状态机：currentCase = 0 (初始), 1 (情况 1), 2 (情况 2)
        
        let currentCase = 0;
        
        const case1Group = document.getElementById('scene2-case1-group');
        const case2Group = document.getElementById('scene2-case2-group');
        const btnCase1 = document.getElementById('scene2-btn-case1');
        const btnCase2 = document.getElementById('scene2-btn-case2');
        
        function showCase1() {
            currentCase = 1;
            case1Group.style.display = 'block';
            case2Group.style.display = 'none';
            btnCase1.classList.add('active');
            btnCase2.classList.remove('active', 'case2');
        }
        
        function showCase2() {
            currentCase = 2;
            case1Group.style.display = 'none';
            case2Group.style.display = 'block';
            btnCase2.classList.add('active', 'case2');
            btnCase1.classList.remove('active');
        }
        
        function reset() {
            currentCase = 0;
            case1Group.style.display = 'none';
            case2Group.style.display = 'none';
            btnCase1.classList.remove('active');
            btnCase2.classList.remove('active', 'case2');
        }
        
        btnCase1.addEventListener('click', showCase1);
        btnCase2.addEventListener('click', showCase2);
        
        // 初始状态：显示表头，等待用户选择
        case1Group.style.display = 'none';
        case2Group.style.display = 'none';
    })();
    </script>
</body>
</html>
