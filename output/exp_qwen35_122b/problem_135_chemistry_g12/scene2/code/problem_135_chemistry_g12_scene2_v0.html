<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 醋酸与氨水导电性变化</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene2-btn { padding: 8px 16px; border: 2px solid #1565c0; background: #ffffff; color: #1565c0; border-radius: 6px; cursor: pointer; font-size: 13px; transition: all 0.3s; }
        .scene2-btn:hover { background: #e3f2fd; }
        .scene2-btn.active { background: #1565c0; color: #ffffff; }
        #scene2-description { position: absolute; bottom: 55px; left: 50%; transform: translateX(-50%); background: #f5f5f5; padding: 8px 20px; border-radius: 6px; font-size: 14px; max-width: 600px; text-align: center; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" id="scene2-svg">
            <!-- 左侧烧杯装置区 -->
            <g id="scene2-apparatus">
                <!-- 烧杯轮廓 -->
                <path d="M 80 120 L 80 300 Q 80 320 140 320 Q 200 320 200 300 L 200 120" fill="none" stroke="#000000" stroke-width="2"/>
                <!-- 烧杯底部椭圆 -->
                <ellipse cx="140" cy="320" rx="60" ry="12" fill="none" stroke="#000000" stroke-width="2"/>
                
                <!-- 溶液区域 -->
                <rect id="scene2-solution" x="90" y="200" width="100" height="110" fill="#1565c0" fill-opacity="0.15" rx="3"/>
                
                <!-- 左电极 -->
                <rect id="scene2-electrode-left" x="100" y="120" width="15" height="140" fill="#424242"/>
                <!-- 右电极 -->
                <rect id="scene2-electrode-right" x="185" y="120" width="15" height="140" fill="#424242"/>
                
                <!-- 导线 1（左电极到灯泡） -->
                <path d="M 107 120 L 50 120 L 50 240" fill="none" stroke="#000000" stroke-width="2"/>
                <!-- 导线 2（灯泡底座到左电极下方） -->
                <path d="M 50 290 L 50 300 L 80 300" fill="none" stroke="#000000" stroke-width="2"/>
                <!-- 导线 3（右电极到灯泡） -->
                <path d="M 192 120 L 250 120 L 250 240" fill="none" stroke="#000000" stroke-width="2"/>
                <!-- 导线 4（灯泡底座到右电极下方） -->
                <path d="M 70 290 L 70 300 L 220 300" fill="none" stroke="#000000" stroke-width="2"/>
                
                <!-- 灯泡 -->
                <circle id="scene2-bulb" cx="50" cy="265" r="20" fill="#ffeb3b" fill-opacity="0.10"/>
                <!-- 灯泡底座 -->
                <rect id="scene2-bulb-base" x="35" y="285" width="30" height="15" fill="#757575"/>
                
                <!-- 电池组 -->
                <rect id="scene2-battery" x="320" y="80" width="100" height="30" fill="#8d6e63" rx="3"/>
                <text id="scene2-battery-label" x="370" y="75" text-anchor="middle" font-size="14" fill="#000000">电池</text>
                
                <!-- 电池连接线 1 -->
                <path d="M 370 110 L 370 120 L 107 120" fill="none" stroke="#000000" stroke-width="2"/>
                <!-- 电池连接线 2 -->
                <path d="M 370 110 L 370 120 L 192 120" fill="none" stroke="#000000" stroke-width="2"/>
            </g>
            
            <!-- 右侧曲线图区 -->
            <g id="scene2-chart">
                <!-- 图表边框 -->
                <rect id="scene2-chart-border" x="450" y="100" width="300" height="250" fill="none" stroke="#000000" stroke-width="1" stroke-dasharray="5,3"/>
                
                <!-- X 轴 -->
                <line id="scene2-xaxis" x1="470" y1="330" x2="730" y2="330" stroke="#000000" stroke-width="2"/>
                <!-- Y 轴 -->
                <line id="scene2-yaxis" x1="470" y1="330" x2="470" y2="120" stroke="#000000" stroke-width="2"/>
                
                <!-- X 轴标签（移到更下方） -->
                <text id="scene2-xlabel" x="600" y="375" text-anchor="middle" font-size="14" fill="#000000">加入氨水体积</text>
                <!-- Y 轴标签 -->
                <text id="scene2-ylabel" x="430" y="225" text-anchor="middle" font-size="14" fill="#000000">导电性</text>
                
                <!-- 导电性曲线（分段显示） -->
                <path id="scene2-curve-seg1" d="M 470 280 L 550 200" fill="none" stroke="#1565c0" stroke-width="3" opacity="0"/>
                <path id="scene2-curve-seg2" d="M 550 200 L 630 140" fill="none" stroke="#1565c0" stroke-width="3" opacity="0"/>
                <path id="scene2-curve-seg3" d="M 630 140 L 710 200" fill="none" stroke="#1565c0" stroke-width="3" opacity="0"/>
                
                <!-- 曲线点 -->
                <circle id="scene2-point0" cx="470" cy="280" r="6" fill="#1565c0" opacity="0"/>
                <circle id="scene2-point1" cx="550" cy="200" r="6" fill="#1565c0" opacity="0"/>
                <circle id="scene2-point2" cx="630" cy="140" r="6" fill="#1565c0" opacity="0"/>
                <circle id="scene2-point3" cx="710" cy="200" r="6" fill="#1565c0" opacity="0"/>
                
                <!-- 曲线点标签（移到图表边框外部更远处，避免与边框重叠） -->
                <text id="scene2-label0" x="430" y="285" text-anchor="end" font-size="12" fill="#000000" opacity="0">初始</text>
                <text id="scene2-label1" x="460" y="165" text-anchor="end" font-size="12" fill="#000000" opacity="0">反应中</text>
                <text id="scene2-label2" x="525" y="75" text-anchor="end" font-size="12" fill="#000000" opacity="0">恰好完全</text>
                <text id="scene2-label3" x="755" y="205" text-anchor="start" font-size="12" fill="#000000" opacity="0">过量</text>
            </g>
            
            <!-- 溶液内标注（移到烧杯右侧更远处，增加行间距到 30px） -->
            <text id="scene2-solution-text1" x="250" y="215" text-anchor="start" font-size="13" fill="#000000" opacity="0">CH₃COOH</text>
            <text id="scene2-solution-text2" x="250" y="255" text-anchor="start" font-size="13" fill="#000000" opacity="0">(弱电解质)</text>
            <text id="scene2-solution-text3" x="250" y="207" text-anchor="start" font-size="11" fill="#000000" opacity="0">CH₃COOH + NH₃·H₂O</text>
            <text id="scene2-solution-text4" x="250" y="257" text-anchor="start" font-size="11" fill="#000000" opacity="0">→ CH₃COO⁻ + NH₄⁺</text>
            <text id="scene2-solution-text5" x="250" y="215" text-anchor="start" font-size="13" fill="#000000" opacity="0">CH₃COONH₄</text>
            <text id="scene2-solution-text6" x="250" y="255" text-anchor="start" font-size="13" fill="#000000" opacity="0">(强电解质)</text>
            <text id="scene2-solution-text7" x="250" y="215" text-anchor="start" font-size="12" fill="#000000" opacity="0">过量 NH₃·H₂O</text>
            <text id="scene2-solution-text8" x="250" y="255" text-anchor="start" font-size="12" fill="#000000" opacity="0">(稀释)</text>
            
            <!-- 结论标注（移到更上方，远离"恰好完全"标签） -->
            <text id="scene2-conclusion" x="600" y="70" text-anchor="middle" font-size="14" fill="#d32f2f" font-weight="bold" opacity="0">导电性：弱 → 强 → 弱</text>
        </svg>
        
        <!-- 阶段说明 -->
        <div id="scene2-description">初始状态：醋酸为弱电解质，部分电离，离子浓度低，导电性弱</div>
        
        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-step0-btn" class="scene2-btn active">初始醋酸</button>
            <button id="scene2-step1-btn" class="scene2-btn">反应中</button>
            <button id="scene2-step2-btn" class="scene2-btn">恰好完全</button>
            <button id="scene2-step3-btn" class="scene2-btn">过量氨水</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现 - 醋酸与氨水导电性变化
        
        // 状态变量
        var currentStep = 0;
        var totalSteps = 4;
        
        // 元素引用
        var solution = document.getElementById('scene2-solution');
        var bulb = document.getElementById('scene2-bulb');
        var solutionTexts = [
            {t1: document.getElementById('scene2-solution-text1'), t2: document.getElementById('scene2-solution-text2')},
            {t1: document.getElementById('scene2-solution-text3'), t2: document.getElementById('scene2-solution-text4')},
            {t1: document.getElementById('scene2-solution-text5'), t2: document.getElementById('scene2-solution-text6')},
            {t1: document.getElementById('scene2-solution-text7'), t2: document.getElementById('scene2-solution-text8')}
        ];
        var curveSegs = [
            document.getElementById('scene2-curve-seg1'),
            document.getElementById('scene2-curve-seg2'),
            document.getElementById('scene2-curve-seg3')
        ];
        var points = [
            document.getElementById('scene2-point0'),
            document.getElementById('scene2-point1'),
            document.getElementById('scene2-point2'),
            document.getElementById('scene2-point3')
        ];
        var labels = [
            document.getElementById('scene2-label0'),
            document.getElementById('scene2-label1'),
            document.getElementById('scene2-label2'),
            document.getElementById('scene2-label3')
        ];
        var conclusion = document.getElementById('scene2-conclusion');
        var description = document.getElementById('scene2-description');
        var buttons = [
            document.getElementById('scene2-step0-btn'),
            document.getElementById('scene2-step1-btn'),
            document.getElementById('scene2-step2-btn'),
            document.getElementById('scene2-step3-btn')
        ];
        
        // 步骤描述
        var descriptions = [
            "初始状态：醋酸为弱电解质，部分电离，离子浓度低，导电性弱",
            "加入氨水：生成强电解质 CH₃COONH₄，离子浓度增加，导电性增强",
            "恰好完全反应：全部生成强电解质，离子浓度最高，导电性最强",
            "过量氨水：稀释作用使离子浓度降低，导电性减弱"
        ];
        
        // 工具函数：显示元素
        function show(el) {
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '1';
                el.setAttribute('opacity', '1');
            }
        }
        
        // 工具函数：隐藏元素
        function hide(el) {
            if (el) {
                el.style.display = 'none';
                el.style.opacity = '0';
                el.setAttribute('opacity', '0');
            }
        }
        
        // 更新步骤
        function updateStep(step) {
            currentStep = step;
            
            // 更新按钮状态
            buttons.forEach(function(btn, idx) {
                if (idx === step) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            
            // 更新溶液透明度
            var solutionOpacity = [0.15, 0.30, 0.30, 0.20][step];
            solution.setAttribute('fill-opacity', solutionOpacity);
            
            // 更新灯泡亮度
            var bulbOpacity = [0.10, 0.50, 0.50, 0.20][step];
            bulb.setAttribute('fill-opacity', bulbOpacity);
            
            // 更新溶液标注
            for (var i = 0; i < 4; i++) {
                if (i === step) {
                    show(solutionTexts[i].t1);
                    show(solutionTexts[i].t2);
                } else {
                    hide(solutionTexts[i].t1);
                    hide(solutionTexts[i].t2);
                }
            }
            
            // 更新曲线和点
            for (var j = 0; j < 4; j++) {
                if (j <= step) {
                    show(points[j]);
                    show(labels[j]);
                } else {
                    hide(points[j]);
                    hide(labels[j]);
                }
            }
            
            // 更新曲线段
            if (step >= 1) {
                show(curveSegs[0]);
            } else {
                hide(curveSegs[0]);
            }
            if (step >= 2) {
                show(curveSegs[1]);
            } else {
                hide(curveSegs[1]);
            }
            if (step >= 3) {
                show(curveSegs[2]);
            } else {
                hide(curveSegs[2]);
            }
            
            // 更新描述
            description.textContent = descriptions[step];
            
            // 步骤 3 完成后显示结论
            if (step === 3) {
                show(conclusion);
            } else {
                hide(conclusion);
            }
        }
        
        // 绑定按钮事件
        buttons.forEach(function(btn, idx) {
            btn.addEventListener('click', function() {
                updateStep(idx);
            });
        });
        
        // 初始化：显示步骤 0
        updateStep(0);
    })();
    </script>
</body>
</html>
