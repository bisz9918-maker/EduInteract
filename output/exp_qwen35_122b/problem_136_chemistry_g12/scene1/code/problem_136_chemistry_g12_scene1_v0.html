<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星际有机分子结构分析 - Scene 1</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Microsoft YaHei', sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; background: #f5f5f5; padding: 10px 0; }
        .scene1-btn { padding: 10px 20px; font-size: 14px; border: none; border-radius: 5px; cursor: pointer; background: #1565c0; color: white; transition: all 0.3s; }
        .scene1-btn:hover:not(:disabled) { background: #0d47a1; }
        .scene1-btn:disabled { background: #bdbdbd; cursor: not-allowed; }
        .scene1-bond-highlight { stroke: #1565c0 !important; stroke-width: 4 !important; }
        .scene1-ball-highlight { stroke: #1565c0 !important; stroke-width: 3 !important; }
        .scene1-ball-error { stroke: #c62828 !important; stroke-width: 3 !important; }
        .scene1-conclusion-correct { fill: #2e7d32 !important; font-weight: bold; }
        .scene1-conclusion-wrong { fill: #c62828 !important; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="460" xmlns="http://www.w3.org/2000/svg">
            <!-- 背景 -->
            <rect id="scene1-bg" width="800" height="460" fill="#ffffff"/>
            
            <!-- 结论文字（步骤 6 显示） -->
            <g id="scene1-conclusion" style="display:none">
                <text id="scene1-conclusion-text" x="400" y="50" text-anchor="middle" font-size="18" fill="#2e7d32">正确答案：B</text>
                <text id="scene1-option-a" x="100" y="85" font-size="14" fill="#c62828">A. 错误</text>
                <text id="scene1-option-b" x="280" y="85" font-size="14" fill="#2e7d32">B. 正确</text>
                <text id="scene1-option-c" x="460" y="85" font-size="14" fill="#c62828">C. 错误</text>
                <text id="scene1-option-d" x="640" y="85" font-size="14" fill="#c62828">D. 错误</text>
            </g>
            
            <!-- 分子结构组 -->
            <g id="scene1-molecule">
                <!-- 球体 -->
                <circle id="scene1-ball-H" cx="120" cy="220" r="15" fill="white" stroke="#000000" stroke-width="2"/>
                <circle id="scene1-ball-C1" cx="170" cy="220" r="15" fill="#000000"/>
                <circle id="scene1-ball-C2" cx="220" cy="220" r="15" fill="#000000"/>
                <circle id="scene1-ball-C3" cx="270" cy="220" r="15" fill="#000000"/>
                <circle id="scene1-ball-C4" cx="320" cy="220" r="15" fill="#000000"/>
                <circle id="scene1-ball-C5" cx="370" cy="220" r="15" fill="#000000"/>
                <circle id="scene1-ball-C6" cx="420" cy="220" r="15" fill="#000000"/>
                <circle id="scene1-ball-C7" cx="470" cy="220" r="15" fill="#000000"/>
                <circle id="scene1-ball-C8" cx="520" cy="220" r="15" fill="#000000"/>
                <circle id="scene1-ball-C9" cx="570" cy="220" r="15" fill="#000000"/>
                <circle id="scene1-ball-C10" cx="620" cy="220" r="15" fill="#000000"/>
                <circle id="scene1-ball-3" cx="670" cy="220" r="15" fill="none" stroke="#888888" stroke-width="2" stroke-dasharray="5,3"/>
                
                <!-- 化学键 -->
                <line id="scene1-bond-0" x1="135" y1="220" x2="155" y2="220" stroke="#000000" stroke-width="2"/>
                <line id="scene1-bond-1" x1="185" y1="220" x2="205" y2="220" stroke="#000000" stroke-width="2"/>
                <line id="scene1-bond-2" x1="235" y1="220" x2="255" y2="220" stroke="#000000" stroke-width="2"/>
                <line id="scene1-bond-3" x1="285" y1="220" x2="305" y2="220" stroke="#000000" stroke-width="2"/>
                <line id="scene1-bond-4" x1="335" y1="220" x2="355" y2="220" stroke="#000000" stroke-width="2"/>
                <line id="scene1-bond-5" x1="385" y1="220" x2="405" y2="220" stroke="#000000" stroke-width="2"/>
                <line id="scene1-bond-6" x1="435" y1="220" x2="455" y2="220" stroke="#000000" stroke-width="2"/>
                <line id="scene1-bond-7" x1="485" y1="220" x2="505" y2="220" stroke="#000000" stroke-width="2"/>
                <line id="scene1-bond-8" x1="535" y1="220" x2="555" y2="220" stroke="#000000" stroke-width="2"/>
                <line id="scene1-bond-9" x1="585" y1="220" x2="605" y2="220" stroke="#000000" stroke-width="2"/>
                <line id="scene1-bond-10" x1="635" y1="220" x2="655" y2="220" stroke="#000000" stroke-width="2"/>
            </g>
            
            <!-- 标签组 -->
            <g id="scene1-labels">
                <text id="scene1-label-H" x="120" y="260" text-anchor="middle" font-size="14" fill="#000000">氢原子</text>
                <text id="scene1-label-C" x="220" y="260" text-anchor="middle" font-size="14" fill="#000000">碳原子</text>
                <text id="scene1-label-1" x="445" y="285" text-anchor="middle" font-size="14" fill="#000000">①</text>
                <text id="scene1-label-2" x="595" y="285" text-anchor="middle" font-size="14" fill="#000000">②</text>
                <text id="scene1-label-3" x="670" y="260" text-anchor="middle" font-size="14" fill="#000000">③</text>
            </g>
            
            <!-- 键计数组（步骤 2 显示） -->
            <g id="scene1-counts" style="display:none">
                <text id="scene1-count-C1" x="170" y="195" text-anchor="middle" font-size="12" fill="#888888">2</text>
                <text id="scene1-count-C2" x="220" y="195" text-anchor="middle" font-size="12" fill="#888888">2</text>
                <text id="scene1-count-C3" x="270" y="195" text-anchor="middle" font-size="12" fill="#888888">2</text>
                <text id="scene1-count-C4" x="320" y="195" text-anchor="middle" font-size="12" fill="#888888">2</text>
                <text id="scene1-count-C5" x="370" y="195" text-anchor="middle" font-size="12" fill="#888888">2</text>
                <text id="scene1-count-C6" x="420" y="195" text-anchor="middle" font-size="12" fill="#888888">2</text>
                <text id="scene1-count-C7" x="470" y="195" text-anchor="middle" font-size="12" fill="#888888">2</text>
                <text id="scene1-count-C8" x="520" y="195" text-anchor="middle" font-size="12" fill="#888888">2</text>
                <text id="scene1-count-C9" x="570" y="195" text-anchor="middle" font-size="12" fill="#888888">2</text>
                <text id="scene1-count-C10" x="620" y="195" text-anchor="middle" font-size="12" fill="#888888">2</text>
            </g>
            
            <!-- 键类型组（步骤 3-4 显示） -->
            <g id="scene1-bond-types" style="display:none">
                <text id="scene1-bond-type-1" x="445" y="320" text-anchor="middle" font-size="14" fill="#2e7d32">C-C 双键</text>
                <text id="scene1-bond-type-2" x="595" y="320" text-anchor="middle" font-size="14" fill="#2e7d32">C-C 单键</text>
            </g>
            
            <!-- 原子③一价标签（步骤 5 显示） -->
            <text id="scene1-label-3-valence" x="670" y="295" text-anchor="middle" font-size="14" fill="#c62828" style="display:none">一价原子</text>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-prev-btn" class="scene1-btn" disabled>◀ 上一步</button>
            <button id="scene1-next-btn" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现
        // 布局坐标表对照：
        // 氢原子球：(120,220), r=15
        // 碳原子 1-10 球：(170,220)~(620,220) 间隔 50px
        // 原子③球：(670,220), r=15
        // 化学键：连接相邻球体，20px 长度
        // 标签：氢原子 (120,260), 碳原子 (220,260), ①(445,285), ②(595,285), ③(670,260)
        // 键计数标签：各碳原子上方 (y=195)
        // 键类型标签：①(445,320), ②(595,320) - 向下移动 10px 增加间距
        // 一价标签：(670,295) - 向下移动 10px 增加间距
        
        const scene1 = {
            currentStep: 0,
            totalSteps: 6,
            
            elements: {
                prevBtn: document.getElementById('scene1-prev-btn'),
                nextBtn: document.getElementById('scene1-next-btn'),
                molecule: document.getElementById('scene1-molecule'),
                labels: document.getElementById('scene1-labels'),
                counts: document.getElementById('scene1-counts'),
                bondTypes: document.getElementById('scene1-bond-types'),
                conclusion: document.getElementById('scene1-conclusion'),
                label3Valence: document.getElementById('scene1-label-3-valence'),
                bond6: document.getElementById('scene1-bond-6'),
                bond9: document.getElementById('scene1-bond-9'),
                ballH: document.getElementById('scene1-ball-H'),
                ballC6: document.getElementById('scene1-ball-C6'),
                ballC7: document.getElementById('scene1-ball-C7'),
                ballC9: document.getElementById('scene1-ball-C9'),
                ballC10: document.getElementById('scene1-ball-C10'),
                ball3: document.getElementById('scene1-ball-3'),
                bondType1: document.getElementById('scene1-bond-type-1'),
                bondType2: document.getElementById('scene1-bond-type-2')
            },
            
            init: function() {
                this.elements.prevBtn.addEventListener('click', () => this.prevStep());
                this.elements.nextBtn.addEventListener('click', () => this.nextStep());
                this.updateScene();
            },
            
            prevStep: function() {
                if (this.currentStep > 0) {
                    this.currentStep--;
                    this.updateScene();
                }
            },
            
            nextStep: function() {
                if (this.currentStep < this.totalSteps) {
                    this.currentStep++;
                    this.updateScene();
                }
            },
            
            updateScene: function() {
                const e = this.elements;
                
                // 重置所有高亮
                e.bond6.classList.remove('scene1-bond-highlight');
                e.bond9.classList.remove('scene1-bond-highlight');
                e.ballC6.classList.remove('scene1-ball-highlight');
                e.ballC7.classList.remove('scene1-ball-highlight');
                e.ballC9.classList.remove('scene1-ball-highlight');
                e.ballC10.classList.remove('scene1-ball-highlight');
                e.ball3.classList.remove('scene1-ball-error');
                
                // 控制元素显示/隐藏
                e.counts.style.display = 'none';
                e.bondTypes.style.display = 'none';
                e.conclusion.style.display = 'none';
                e.label3Valence.style.display = 'none';
                e.bondType1.style.display = 'none';
                e.bondType2.style.display = 'none';
                
                switch(this.currentStep) {
                    case 0:
                        // 显示基础结构
                        break;
                    case 1:
                        // 高亮原子识别 - 氢原子和碳原子闪烁
                        e.ballH.classList.add('scene1-ball-highlight');
                        setTimeout(() => e.ballH.classList.remove('scene1-ball-highlight'), 300);
                        setTimeout(() => e.ballH.classList.add('scene1-ball-highlight'), 600);
                        setTimeout(() => e.ballH.classList.remove('scene1-ball-highlight'), 900);
                        for (let i = 1; i <= 10; i++) {
                            const ball = document.getElementById('scene1-ball-C' + i);
                            ball.classList.add('scene1-ball-highlight');
                            setTimeout(() => ball.classList.remove('scene1-ball-highlight'), 300);
                            setTimeout(() => ball.classList.add('scene1-ball-highlight'), 600);
                            setTimeout(() => ball.classList.remove('scene1-ball-highlight'), 900);
                        }
                        break;
                    case 2:
                        // 显示键计数
                        e.counts.style.display = 'block';
                        break;
                    case 3:
                        // 高亮①键，显示键类型
                        e.counts.style.display = 'block';
                        e.bond6.classList.add('scene1-bond-highlight');
                        e.bondTypes.style.display = 'block';
                        e.bondType1.style.display = 'block';
                        break;
                    case 4:
                        // 高亮②键，显示键类型
                        e.counts.style.display = 'block';
                        e.bond6.classList.add('scene1-bond-highlight');
                        e.bond9.classList.add('scene1-bond-highlight');
                        e.bondTypes.style.display = 'block';
                        e.bondType1.style.display = 'block';
                        e.bondType2.style.display = 'block';
                        break;
                    case 5:
                        // 高亮原子③
                        e.counts.style.display = 'block';
                        e.bond6.classList.add('scene1-bond-highlight');
                        e.bond9.classList.add('scene1-bond-highlight');
                        e.bondTypes.style.display = 'block';
                        e.bondType1.style.display = 'block';
                        e.bondType2.style.display = 'block';
                        e.ball3.classList.add('scene1-ball-error');
                        e.label3Valence.style.display = 'block';
                        break;
                    case 6:
                        // 显示结论
                        e.counts.style.display = 'block';
                        e.bond6.classList.add('scene1-bond-highlight');
                        e.bond9.classList.add('scene1-bond-highlight');
                        e.bondTypes.style.display = 'block';
                        e.bondType1.style.display = 'block';
                        e.bondType2.style.display = 'block';
                        e.ball3.classList.add('scene1-ball-error');
                        e.label3Valence.style.display = 'block';
                        e.conclusion.style.display = 'block';
                        break;
                }
                
                // 更新按钮状态
                e.prevBtn.disabled = (this.currentStep === 0);
                e.nextBtn.textContent = (this.currentStep === this.totalSteps) ? '完成' : '下一步 ▶';
            }
        };
        
        scene1.init();
    })();
    </script>
</body>
</html>
