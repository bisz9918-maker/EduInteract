<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2: 手性碳原子的识别与判断</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Microsoft YaHei', sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene2-btn { padding: 8px 16px; background: #1976d2; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .scene2-btn:disabled { background: #bdbdbd; cursor: not-allowed; }
        .scene2-btn:hover:not(:disabled) { background: #1565c0; }
        #scene2-step-indicator { font-size: 14px; color: #000000; line-height: 36px; }
        svg { display: block; }
        .scene2-text { font-size: 14px; font-family: 'Microsoft YaHei', sans-serif; }
        .scene2-title { font-size: 16px; font-weight: bold; }
        .scene2-substituent { font-size: 14px; font-weight: bold; }
        .scene2-bg { fill: #f5f5f5; rx: 8; }
        .scene2-control-bg { fill: #e0e0e0; rx: 8; }
        .scene2-skeleton { stroke: #000000; stroke-width: 2; fill: none; }
        .scene2-carbon { stroke: #000000; stroke-width: 1; }
        .scene2-line { stroke-width: 2; }
        .scene2-result-bg { fill: #ffffff; stroke: #dddddd; stroke-width: 1; }
        .scene2-result-text { font-size: 13px; fill: #000000; }
        .scene2-transition { transition: all 0.3s ease; }
        .scene2-highlight { animation: scene2-flash 0.5s ease-in-out; }
        @keyframes scene2-flash {
            0%, 100% { fill: #888888; }
            50% { fill: #ffd54f; }
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500">
            <!-- 左侧定义区背景 (非常小，只包围中心碳) -->
            <rect id="scene2-def-bg" class="scene2-bg" x="150" y="150" width="100" height="60"/>
            
            <!-- 定义区标题 (在背景上方) -->
            <text id="scene2-def-title" class="scene2-text scene2-title" x="100" y="55" fill="#000000">手性碳定义</text>
            
            <!-- 定义区中心碳 C* -->
            <circle id="scene2-center-carbon" class="scene2-carbon scene2-transition" cx="200" cy="180" r="6" fill="#2e7d32"/>
            
            <!-- 取代基 R1 (左上，标签在背景外) -->
            <line id="scene2-sub-r1-line" class="scene2-line scene2-transition" x1="200" y1="180" x2="140" y2="130" stroke="#1565c0"/>
            <text id="scene2-sub-r1" class="scene2-text scene2-substituent" x="100" y="120" fill="#1565c0">R₁</text>
            
            <!-- 取代基 R2 (右上，标签在背景外) -->
            <line id="scene2-sub-r2-line" class="scene2-line scene2-transition" x1="200" y1="180" x2="260" y2="130" stroke="#c62828"/>
            <text id="scene2-sub-r2" class="scene2-text scene2-substituent" x="290" y="120" fill="#c62828">R₂</text>
            
            <!-- 取代基 R3 (左下，标签在背景外) -->
            <line id="scene2-sub-r3-line" class="scene2-line scene2-transition" x1="200" y1="180" x2="140" y2="230" stroke="#2e7d32"/>
            <text id="scene2-sub-r3" class="scene2-text scene2-substituent" x="100" y="250" fill="#2e7d32">R₃</text>
            
            <!-- 取代基 R4 (右下，标签在背景外) -->
            <line id="scene2-sub-r4-line" class="scene2-line scene2-transition" x1="200" y1="180" x2="260" y2="230" stroke="#f57c00"/>
            <text id="scene2-sub-r4" class="scene2-text scene2-substituent" x="290" y="250" fill="#f57c00">R₄</text>
            
            <!-- 定义说明文字 (在背景下方) -->
            <text id="scene2-def-text" class="scene2-text" x="100" y="320" fill="#000000">中心碳原子连接</text>
            <text id="scene2-def-text2" class="scene2-text" x="100" y="340" fill="#000000">4 个不同基团</text>
            
            <!-- 右侧分子区背景 (非常小，只包围 C2) -->
            <rect id="scene2-mol-bg" class="scene2-bg" x="560" y="170" width="40" height="40"/>
            
            <!-- 分子区标题 (在背景上方) -->
            <text id="scene2-mol-title" class="scene2-text scene2-title" x="520" y="55" fill="#000000">分子局部放大</text>
            
            <!-- 分子骨架主线 -->
            <line id="scene2-mol-skeleton" class="scene2-skeleton" x1="470" y1="180" x2="730" y2="180"/>
            
            <!-- 候选碳 C1 -->
            <circle id="scene2-candidate-c1" class="scene2-carbon scene2-transition" cx="520" cy="180" r="5" fill="#888888"/>
            <text id="scene2-c1-label" class="scene2-text" x="515" y="165" fill="#000000">C1</text>
            
            <!-- 候选碳 C2 -->
            <circle id="scene2-candidate-c2" class="scene2-carbon scene2-transition" cx="580" cy="180" r="5" fill="#888888"/>
            <text id="scene2-c2-label" class="scene2-text" x="575" y="165" fill="#000000">C2</text>
            
            <!-- 候选碳 C3 -->
            <circle id="scene2-candidate-c3" class="scene2-carbon scene2-transition" cx="640" cy="180" r="5" fill="#888888"/>
            <text id="scene2-c3-label" class="scene2-text" x="635" y="165" fill="#000000">C3</text>
            
            <!-- C2 上取代基 -->
            <line id="scene2-c2-sub-up-line" class="scene2-line scene2-transition" x1="580" y1="180" x2="580" y2="130" stroke="#1565c0" style="display: none;"/>
            <text id="scene2-c2-sub-up" class="scene2-text scene2-substituent" x="555" y="120" fill="#1565c0" style="display: none;">-CH₃</text>
            
            <!-- C2 下取代基 -->
            <line id="scene2-c2-sub-down-line" class="scene2-line scene2-transition" x1="580" y1="180" x2="580" y2="230" stroke="#c62828" style="display: none;"/>
            <text id="scene2-c2-sub-down" class="scene2-text scene2-substituent" x="555" y="250" fill="#c62828" style="display: none;">-H</text>
            
            <!-- C2 左取代基 -->
            <line id="scene2-c2-sub-left-line" class="scene2-line scene2-transition" x1="580" y1="180" x2="520" y2="180" stroke="#2e7d32" style="display: none;"/>
            <text id="scene2-c2-sub-left" class="scene2-text scene2-substituent" x="480" y="185" fill="#2e7d32" style="display: none;">-R</text>
            
            <!-- C2 右取代基 -->
            <line id="scene2-c2-sub-right-line" class="scene2-line scene2-transition" x1="580" y1="180" x2="640" y2="180" stroke="#f57c00" style="display: none;"/>
            <text id="scene2-c2-sub-right" class="scene2-text scene2-substituent" x="650" y="185" fill="#f57c00" style="display: none;">-R'</text>
            
            <!-- 判断结果框背景 (移到右侧，避开文字) -->
            <rect id="scene2-result-box" class="scene2-result-bg" x="560" y="320" width="190" height="50"/>
            
            <!-- 判断结果文字 (移到右侧，避开背景) -->
            <text id="scene2-result-text" class="scene2-result-text" x="575" y="340">手性碳定义：中心 sp³ 碳连接 4 个不同取代基</text>
            
            <!-- 控件栏背景 -->
            <rect id="scene2-control-bg" class="scene2-control-bg" x="20" y="420" width="760" height="60"/>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-btn-prev" class="scene2-btn" disabled>◀ 上一步</button>
            <span id="scene2-step-indicator">步骤 1 / 4</span>
            <button id="scene2-btn-next" class="scene2-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2: 手性碳原子的识别与判断
        const TOTAL_STEPS = 4;
        let currentStep = 0;

        // 获取 DOM 元素
        const els = {
            prevBtn: document.getElementById('scene2-btn-prev'),
            nextBtn: document.getElementById('scene2-btn-next'),
            stepIndicator: document.getElementById('scene2-step-indicator'),
            resultText: document.getElementById('scene2-result-text'),
            // 分子区候选碳
            c1: document.getElementById('scene2-candidate-c1'),
            c2: document.getElementById('scene2-candidate-c2'),
            c3: document.getElementById('scene2-candidate-c3'),
            c1Label: document.getElementById('scene2-c1-label'),
            c2Label: document.getElementById('scene2-c2-label'),
            c3Label: document.getElementById('scene2-c3-label'),
            // C2 取代基
            c2SubUpLine: document.getElementById('scene2-c2-sub-up-line'),
            c2SubDownLine: document.getElementById('scene2-c2-sub-down-line'),
            c2SubLeftLine: document.getElementById('scene2-c2-sub-left-line'),
            c2SubRightLine: document.getElementById('scene2-c2-sub-right-line'),
            c2SubUp: document.getElementById('scene2-c2-sub-up'),
            c2SubDown: document.getElementById('scene2-c2-sub-down'),
            c2SubLeft: document.getElementById('scene2-c2-sub-left'),
            c2SubRight: document.getElementById('scene2-c2-sub-right'),
        };

        // 步骤内容
        const stepContents = [
            {
                result: '手性碳定义：中心 sp³ 碳连接 4 个不同取代基',
                c1Fill: '#888888', c2Fill: '#888888', c3Fill: '#888888',
                c1Opacity: 1, c2Opacity: 1, c3Opacity: 1,
                c2SubsVisible: false,
                c1Highlight: false, c2Highlight: false, c3Highlight: false
            },
            {
                result: '步骤 1：识别分子中的 sp³ 碳原子',
                c1Fill: '#888888', c2Fill: '#888888', c3Fill: '#888888',
                c1Opacity: 1, c2Opacity: 1, c3Opacity: 1,
                c2SubsVisible: false,
                c1Highlight: true, c2Highlight: true, c3Highlight: true
            },
            {
                result: '步骤 2：验证 C2 连接的四个基团是否不同',
                c1Fill: '#888888', c2Fill: '#2e7d32', c3Fill: '#888888',
                c1Opacity: 0.5, c2Opacity: 1, c3Opacity: 0.5,
                c2SubsVisible: true,
                c1Highlight: false, c2Highlight: false, c3Highlight: false
            },
            {
                result: '步骤 3：C2 连接 4 个不同基团 → 是手性碳',
                c1Fill: '#888888', c2Fill: '#2e7d32', c3Fill: '#888888',
                c1Opacity: 0.5, c2Opacity: 1, c3Opacity: 0.5,
                c2SubsVisible: true,
                c1Highlight: false, c2Highlight: false, c3Highlight: false
            }
        ];

        // 更新显示
        function updateDisplay() {
            const step = stepContents[currentStep];
            
            // 更新结果文字
            els.resultText.textContent = step.result;
            
            // 更新步骤指示器
            els.stepIndicator.textContent = `步骤 ${currentStep + 1} / ${TOTAL_STEPS}`;
            
            // 更新按钮状态
            els.prevBtn.disabled = currentStep === 0;
            els.nextBtn.disabled = currentStep === TOTAL_STEPS - 1;
            
            // 更新候选碳样式
            els.c1.setAttribute('fill', step.c1Fill);
            els.c2.setAttribute('fill', step.c2Fill);
            els.c3.setAttribute('fill', step.c3Fill);
            
            els.c1.style.opacity = step.c1Opacity;
            els.c2.style.opacity = step.c2Opacity;
            els.c3.style.opacity = step.c3Opacity;
            
            els.c1Label.style.opacity = step.c1Opacity;
            els.c2Label.style.opacity = step.c2Opacity;
            els.c3Label.style.opacity = step.c3Opacity;
            
            // 处理高亮动画
            if (step.c1Highlight) {
                els.c1.classList.add('scene2-highlight');
                setTimeout(() => els.c1.classList.remove('scene2-highlight'), 500);
            }
            if (step.c2Highlight) {
                els.c2.classList.add('scene2-highlight');
                setTimeout(() => els.c2.classList.remove('scene2-highlight'), 500);
            }
            if (step.c3Highlight) {
                els.c3.classList.add('scene2-highlight');
                setTimeout(() => els.c3.classList.remove('scene2-highlight'), 500);
            }
            
            // 更新 C2 取代基可见性
            const subs = [
                els.c2SubUpLine, els.c2SubDownLine, els.c2SubLeftLine, els.c2SubRightLine,
                els.c2SubUp, els.c2SubDown, els.c2SubLeft, els.c2SubRight
            ];
            subs.forEach(el => {
                if (step.c2SubsVisible) {
                    el.style.display = 'block';
                    el.style.opacity = '1';
                } else {
                    el.style.display = 'none';
                    el.style.opacity = '0';
                }
            });
        }

        // 事件绑定
        els.prevBtn.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        });

        els.nextBtn.addEventListener('click', () => {
            if (currentStep < TOTAL_STEPS - 1) {
                currentStep++;
                updateDisplay();
            }
        });

        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
