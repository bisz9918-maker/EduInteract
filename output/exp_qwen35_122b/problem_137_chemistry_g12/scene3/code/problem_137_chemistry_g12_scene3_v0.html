<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 3 - 官能团反应活性与定量计算</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene3-btn { padding: 8px 20px; font-size: 14px; border: none; border-radius: 4px; cursor: pointer; transition: all 0.3s; }
        .scene3-btn-prev { background: #757575; color: white; }
        .scene3-btn-prev:hover:not(:disabled) { background: #616161; }
        .scene3-btn-prev:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene3-btn-next { background: #1976d2; color: white; }
        .scene3-btn-next:hover:not(:disabled) { background: #1565c0; }
        .scene3-text-title { font-size: 16px; font-weight: bold; fill: #212121; }
        .scene3-text-label { font-size: 14px; fill: #424242; }
        .scene3-text-equation { font-size: 15px; font-weight: bold; fill: #2e7d32; }
        .scene3-text-conclusion { font-size: 18px; font-weight: bold; fill: #2e7d32; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg width="800" height="500">
            <!-- 标题 (调整 y 坐标避免裁切，从 35 改为 40) -->
            <text x="400" y="40" text-anchor="middle" class="scene3-text-title">官能团反应活性与定量计算</text>
            
            <!-- 分子结构图 (80,80)-(480,280) -->
            <g id="scene3-mol-struct">
                <!-- 左侧乙酸酯基 CH3-COO- -->
                <line x1="80" y1="150" x2="100" y2="150" stroke="black" stroke-width="2"/>
                <line x1="100" y1="150" x2="110" y2="135" stroke="black" stroke-width="2"/>
                <line x1="100" y1="150" x2="110" y2="165" stroke="black" stroke-width="2"/>
                <line x1="110" y1="135" x2="125" y2="135" stroke="black" stroke-width="2"/>
                <line x1="110" y1="165" x2="125" y2="165" stroke="black" stroke-width="2"/>
                
                <!-- C=C 双键 1 (左侧) -->
                <line x1="125" y1="135" x2="155" y2="120" stroke="black" stroke-width="2"/>
                <line x1="125" y1="145" x2="155" y2="130" stroke="black" stroke-width="2"/>
                
                <!-- 主链继续 -->
                <line x1="155" y1="120" x2="185" y2="120" stroke="black" stroke-width="2"/>
                
                <!-- 分支点 1 -->
                <line x1="185" y1="120" x2="205" y2="100" stroke="black" stroke-width="2"/>
                <line x1="185" y1="120" x2="205" y2="140" stroke="black" stroke-width="2"/>
                
                <!-- 上方酯基分支 -->
                <line x1="205" y1="100" x2="225" y2="85" stroke="black" stroke-width="2"/>
                <line x1="225" y1="85" x2="240" y2="85" stroke="black" stroke-width="2"/>
                <line x1="240" y1="85" x2="250" y2="70" stroke="black" stroke-width="2"/>
                <line x1="240" y1="85" x2="250" y2="100" stroke="black" stroke-width="2"/>
                <line x1="250" y1="70" x2="265" y2="70" stroke="black" stroke-width="2"/>
                <line x1="250" y1="100" x2="265" y2="100" stroke="black" stroke-width="2"/>
                
                <!-- 下方酯基分支 -->
                <line x1="205" y1="140" x2="225" y2="155" stroke="black" stroke-width="2"/>
                <line x1="225" y1="155" x2="240" y2="155" stroke="black" stroke-width="2"/>
                <line x1="240" y1="155" x2="250" y2="140" stroke="black" stroke-width="2"/>
                <line x1="240" y1="155" x2="250" y2="170" stroke="black" stroke-width="2"/>
                <line x1="250" y1="140" x2="265" y2="140" stroke="black" stroke-width="2"/>
                <line x1="250" y1="170" x2="265" y2="170" stroke="black" stroke-width="2"/>
                
                <!-- 主链继续向右 -->
                <line x1="185" y1="120" x2="220" y2="120" stroke="black" stroke-width="2"/>
                
                <!-- C=C 双键 2 -->
                <line x1="220" y1="110" x2="250" y2="100" stroke="black" stroke-width="2"/>
                <line x1="220" y1="120" x2="250" y2="110" stroke="black" stroke-width="2"/>
                
                <!-- 主链继续 -->
                <line x1="250" y1="100" x2="280" y2="100" stroke="black" stroke-width="2"/>
                
                <!-- C=C 双键 3 (带甲基分支) -->
                <line x1="280" y1="90" x2="310" y2="80" stroke="black" stroke-width="2"/>
                <line x1="280" y1="100" x2="310" y2="90" stroke="black" stroke-width="2"/>
                <line x1="295" y1="95" x2="295" y2="70" stroke="black" stroke-width="2"/>
                
                <!-- 主链继续 -->
                <line x1="310" y1="80" x2="340" y2="80" stroke="black" stroke-width="2"/>
                
                <!-- C=C 双键 4 -->
                <line x1="340" y1="70" x2="370" y2="60" stroke="black" stroke-width="2"/>
                <line x1="340" y1="80" x2="370" y2="70" stroke="black" stroke-width="2"/>
                
                <!-- 主链继续 -->
                <line x1="370" y1="60" x2="400" y2="60" stroke="black" stroke-width="2"/>
                
                <!-- C=C 双键 5 (末端带甲基) -->
                <line x1="400" y1="50" x2="430" y2="40" stroke="black" stroke-width="2"/>
                <line x1="400" y1="60" x2="430" y2="50" stroke="black" stroke-width="2"/>
                <line x1="415" y1="55" x2="415" y2="30" stroke="black" stroke-width="2"/>
                
                <!-- 末端甲基 -->
                <line x1="430" y1="40" x2="450" y2="35" stroke="black" stroke-width="2"/>
            </g>
            
            <!-- C=C 高亮框 (5 个，步骤 1 显示) -->
            <g id="scene3-c-c-highlights" style="display: none;">
                <rect x="123" y="118" width="34" height="28" class="scene3-highlight-c"/>
                <rect x="218" y="98" width="34" height="28" class="scene3-highlight-c"/>
                <rect x="278" y="78" width="34" height="28" class="scene3-highlight-c"/>
                <rect x="338" y="58" width="34" height="28" class="scene3-highlight-c"/>
                <rect x="398" y="38" width="34" height="28" class="scene3-highlight-c"/>
            </g>
            
            <!-- -COO- 高亮框 (3 个，步骤 2 显示) -->
            <g id="scene3-ester-highlights" style="display: none;">
                <rect x="108" y="123" width="22" height="50" class="scene3-highlight-e"/>
                <rect x="238" y="63" width="32" height="50" class="scene3-highlight-e"/>
                <rect x="238" y="133" width="32" height="50" class="scene3-highlight-e"/>
            </g>
            
            <!-- 官能团统计区 (520,80)-(750,180)，调整 y 坐标增加间距 -->
            <g id="scene3-functional-groups">
                <text x="520" y="105" class="scene3-text-title">官能团统计：</text>
                <text x="520" y="145" class="scene3-text-label" style="font-weight: bold; fill: #c62828;">C=C × 5</text>
                <text x="520" y="185" class="scene3-text-label" style="font-weight: bold; fill: #1565c0;">-COO- × 3</text>
            </g>
            
            <!-- H₂反应方程式区 (80,300)-(400,360)，步骤 1 显示，移除背景矩形 -->
            <g id="scene3-h2-reaction" style="display: none;">
                <text x="80" y="320" class="scene3-text-equation">C=C + H₂ → C-C</text>
                <text x="80" y="340" class="scene3-text-label">(加成反应)</text>
                <text x="320" y="335" class="scene3-text-equation" style="font-size: 18px;">5 mol H₂</text>
            </g>
            
            <!-- NaOH 反应方程式区 (420,300)-(750,360)，步骤 2 显示，移除背景矩形，调整 x 坐标避免右边缘裁切 -->
            <g id="scene3-naoh-reaction" style="display: none;">
                <text x="420" y="320" class="scene3-text-equation">-COO- + NaOH → -COONa + -OH</text>
                <text x="420" y="340" class="scene3-text-label">(水解反应)</text>
                <text x="660" y="335" class="scene3-text-equation" style="font-size: 18px;">3 mol NaOH</text>
            </g>
            
            <!-- 计量关系结论区 (80,370)-(750,420)，步骤 3 显示，移除背景矩形 -->
            <g id="scene3-conclusion" style="display: none;">
                <text x="415" y="395" text-anchor="middle" class="scene3-text-conclusion">1 mol A 最多消耗 5 mol H₂和 3 mol NaOH</text>
            </g>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene3-controls">
            <button id="scene3-btn-prev" class="scene3-btn scene3-btn-prev" disabled>◀ 上一步</button>
            <button id="scene3-btn-next" class="scene3-btn scene3-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 3 实现
        // 布局坐标表：
        // | 元素 | 类型 | 位置/范围 | 大小 | 备注 |
        // |------|------|-----------|------|------|
        // | 分子结构图 | SVG 路径 | (80,80)-(480,280) | 400×200 | 上方左侧 |
        // | C=C 高亮框 | 矩形 | 覆盖 5 个双键位置 | - | 红色半透明 |
        // | -COO- 高亮框 | 矩形 | 覆盖 3 个酯基位置 | - | 蓝色半透明 |
        // | 官能团统计区 | 文本框 | (520,80)-(750,180) | 230×100 | 上方右侧 |
        // | H₂反应方程式区 | 文本框 | (80,300)-(400,360) | 320×60 | 中间左侧 |
        // | NaOH 反应方程式区 | 文本框 | (420,300)-(750,360) | 330×60 | 中间右侧 |
        // | 计量关系区 | 文本框 | (80,370)-(750,420) | 670×50 | 下方 |
        // | 控件栏 | div | (250,440)-(550,490) | 300×50 | 底部居中 |
        
        const scene3 = {
            currentStep: 0,
            totalSteps: 3,
            
            elements: {
                btnPrev: null,
                btnNext: null,
                cCHighlights: null,
                esterHighlights: null,
                h2Reaction: null,
                naohReaction: null,
                conclusion: null
            },
            
            init: function() {
                this.elements.btnPrev = document.getElementById('scene3-btn-prev');
                this.elements.btnNext = document.getElementById('scene3-btn-next');
                this.elements.cCHighlights = document.getElementById('scene3-c-c-highlights');
                this.elements.esterHighlights = document.getElementById('scene3-ester-highlights');
                this.elements.h2Reaction = document.getElementById('scene3-h2-reaction');
                this.elements.naohReaction = document.getElementById('scene3-naoh-reaction');
                this.elements.conclusion = document.getElementById('scene3-conclusion');
                
                this.elements.btnPrev.addEventListener('click', () => this.prevStep());
                this.elements.btnNext.addEventListener('click', () => this.nextStep());
                
                this.updateView();
            },
            
            updateView: function() {
                // 更新按钮状态
                this.elements.btnPrev.disabled = (this.currentStep === 0);
                
                if (this.currentStep === this.totalSteps) {
                    this.elements.btnNext.textContent = '完成';
                    this.elements.btnNext.disabled = true;
                } else {
                    this.elements.btnNext.textContent = '下一步 ▶';
                    this.elements.btnNext.disabled = false;
                }
                
                // 步骤 0: 只显示分子结构和官能团统计
                // 步骤 1: 显示 C=C 高亮 + H₂反应
                // 步骤 2: 显示 -COO- 高亮 + NaOH 反应
                // 步骤 3: 显示结论
                
                // 控制 C=C 高亮（步骤 1+ 显示）
                if (this.currentStep >= 1) {
                    this.elements.cCHighlights.style.display = 'block';
                    setTimeout(() => { this.elements.cCHighlights.style.opacity = '1'; }, 10);
                } else {
                    this.elements.cCHighlights.style.display = 'none';
                    this.elements.cCHighlights.style.opacity = '1';
                }
                
                // 控制 -COO- 高亮（步骤 2+ 显示）
                if (this.currentStep >= 2) {
                    this.elements.esterHighlights.style.display = 'block';
                    setTimeout(() => { this.elements.esterHighlights.style.opacity = '1'; }, 10);
                } else {
                    this.elements.esterHighlights.style.display = 'none';
                    this.elements.esterHighlights.style.opacity = '1';
                }
                
                // 控制 H₂反应（步骤 1+ 显示）
                if (this.currentStep >= 1) {
                    this.elements.h2Reaction.style.display = 'block';
                    setTimeout(() => { this.elements.h2Reaction.style.opacity = '1'; }, 10);
                } else {
                    this.elements.h2Reaction.style.display = 'none';
                    this.elements.h2Reaction.style.opacity = '1';
                }
                
                // 控制 NaOH 反应（步骤 2+ 显示）
                if (this.currentStep >= 2) {
                    this.elements.naohReaction.style.display = 'block';
                    setTimeout(() => { this.elements.naohReaction.style.opacity = '1'; }, 10);
                } else {
                    this.elements.naohReaction.style.display = 'none';
                    this.elements.naohReaction.style.opacity = '1';
                }
                
                // 控制结论（步骤 3 显示）
                if (this.currentStep >= 3) {
                    this.elements.conclusion.style.display = 'block';
                    setTimeout(() => { this.elements.conclusion.style.opacity = '1'; }, 10);
                } else {
                    this.elements.conclusion.style.display = 'none';
                    this.elements.conclusion.style.opacity = '1';
                }
            },
            
            nextStep: function() {
                if (this.currentStep < this.totalSteps) {
                    this.currentStep++;
                    this.updateView();
                }
            },
            
            prevStep: function() {
                if (this.currentStep > 0) {
                    this.currentStep--;
                    this.updateView();
                }
            }
        };
        
        scene3.init();
    })();
    </script>
</body>
</html>
