<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>叠放木块系统受力分析 - Scene 1</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene1-btn { width: 100px; height: 30px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        #scene1-btnPrev { background: #e0e0e0; color: #666; }
        #scene1-btnPrev:disabled { cursor: not-allowed; opacity: 0.6; }
        #scene1-btnNext { background: #1976d2; color: white; }
        #scene1-btnNext:hover { background: #1565c0; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500">
            <!-- 实验台台面 -->
            <rect id="scene1-table" x="150" y="320" width="500" height="20" fill="none" stroke="#000" stroke-width="2"/>
            <!-- 实验台阴影线 -->
            <g id="scene1-tableShade">
                <line x1="150" y1="340" x2="170" y2="360" stroke="#888" stroke-width="1"/>
                <line x1="170" y1="340" x2="190" y2="360" stroke="#888" stroke-width="1"/>
                <line x1="190" y1="340" x2="210" y2="360" stroke="#888" stroke-width="1"/>
                <line x1="210" y1="340" x2="230" y2="360" stroke="#888" stroke-width="1"/>
                <line x1="230" y1="340" x2="250" y2="360" stroke="#888" stroke-width="1"/>
                <line x1="250" y1="340" x2="270" y2="360" stroke="#888" stroke-width="1"/>
                <line x1="270" y1="340" x2="290" y2="360" stroke="#888" stroke-width="1"/>
                <line x1="290" y1="340" x2="310" y2="360" stroke="#888" stroke-width="1"/>
                <line x1="310" y1="340" x2="330" y2="360" stroke="#888" stroke-width="1"/>
                <line x1="330" y1="340" x2="350" y2="360" stroke="#888" stroke-width="1"/>
                <line x1="350" y1="340" x2="370" y2="360" stroke="#888" stroke-width="1"/>
                <line x1="370" y1="340" x2="390" y2="360" stroke="#888" stroke-width="1"/>
                <line x1="390" y1="340" x2="410" y2="360" stroke="#888" stroke-width="1"/>
                <line x1="410" y1="340" x2="430" y2="360" stroke="#888" stroke-width="1"/>
                <line x1="430" y1="340" x2="450" y2="360" stroke="#888" stroke-width="1"/>
                <line x1="450" y1="340" x2="470" y2="360" stroke="#888" stroke-width="1"/>
                <line x1="470" y1="340" x2="490" y2="360" stroke="#888" stroke-width="1"/>
                <line x1="490" y1="340" x2="510" y2="360" stroke="#888" stroke-width="1"/>
                <line x1="510" y1="340" x2="530" y2="360" stroke="#888" stroke-width="1"/>
                <line x1="530" y1="340" x2="550" y2="360" stroke="#888" stroke-width="1"/>
                <line x1="550" y1="340" x2="570" y2="360" stroke="#888" stroke-width="1"/>
                <line x1="570" y1="340" x2="590" y2="360" stroke="#888" stroke-width="1"/>
                <line x1="590" y1="340" x2="610" y2="360" stroke="#888" stroke-width="1"/>
                <line x1="610" y1="340" x2="630" y2="360" stroke="#888" stroke-width="1"/>
                <line x1="630" y1="340" x2="650" y2="360" stroke="#888" stroke-width="1"/>
            </g>
            <!-- 木块 B -->
            <rect id="scene1-blockB" x="250" y="220" width="300" height="100" fill="#e3f2fd" fill-opacity="0.3" stroke="#000" stroke-width="2"/>
            <!-- 木块 A -->
            <rect id="scene1-blockA" x="325" y="140" width="150" height="80" fill="#e3f2fd" fill-opacity="0.3" stroke="#000" stroke-width="2"/>
            <!-- 左侧滑轮 -->
            <circle id="scene1-pulleyLeft" cx="120" cy="180" r="25" fill="none" stroke="#000" stroke-width="2"/>
            <!-- 右侧滑轮 -->
            <circle id="scene1-pulleyRight" cx="680" cy="180" r="25" fill="none" stroke="#000" stroke-width="2"/>
            <!-- 左侧轻线 -->
            <polyline id="scene1-lineLeft" points="325,180 120,180 120,280" fill="none" stroke="#000" stroke-width="1.5"/>
            <!-- 右侧轻线 -->
            <polyline id="scene1-lineRight" points="550,240 680,240 680,280" fill="none" stroke="#000" stroke-width="1.5"/>
            <!-- 左侧钩码 4 -->
            <rect id="scene1-hook4" x="105" y="280" width="30" height="30" fill="#fff3e0" fill-opacity="0.4" stroke="#000" stroke-width="1.5"/>
            <!-- 左侧钩码 5 -->
            <rect id="scene1-hook5" x="105" y="315" width="30" height="30" fill="#fff3e0" fill-opacity="0.4" stroke="#000" stroke-width="1.5"/>
            <!-- 右侧钩码 1 -->
            <rect id="scene1-hook1" x="665" y="280" width="30" height="30" fill="#fff3e0" fill-opacity="0.4" stroke="#000" stroke-width="1.5"/>
            <!-- 右侧钩码 2 -->
            <rect id="scene1-hook2" x="665" y="315" width="30" height="30" fill="#fff3e0" fill-opacity="0.4" stroke="#000" stroke-width="1.5"/>
            <!-- 右侧钩码 3 -->
            <rect id="scene1-hook3" x="665" y="350" width="30" height="30" fill="#fff3e0" fill-opacity="0.4" stroke="#000" stroke-width="1.5"/>
            <!-- T_A 箭头 -->
            <g id="scene1-arrowTA" opacity="0">
                <line x1="325" y1="180" x2="200" y2="180" stroke="#1565c0" stroke-width="3" marker-end="url(#arrowhead-blue)"/>
            </g>
            <!-- T_B 箭头 -->
            <g id="scene1-arrowTB" opacity="0">
                <line x1="550" y1="260" x2="675" y2="260" stroke="#1565c0" stroke-width="3" marker-end="url(#arrowhead-blue)"/>
            </g>
            <!-- f_AB 箭头 -->
            <g id="scene1-arrowfAB" opacity="0">
                <line x1="325" y1="220" x2="400" y2="220" stroke="#c62828" stroke-width="3" marker-end="url(#arrowhead-red)"/>
            </g>
            <!-- f_B台 箭头 -->
            <g id="scene1-arrowfB" opacity="0">
                <line x1="250" y1="320" x2="350" y2="320" stroke="#c62828" stroke-width="3" marker-end="url(#arrowhead-red)"/>
            </g>
            <!-- 箭头标记定义 -->
            <defs>
                <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0"/>
                </marker>
                <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#c62828"/>
                </marker>
            </defs>
            <!-- 木块标签 A -->
            <text id="scene1-textA" x="400" y="185" text-anchor="middle" font-size="20" font-weight="bold" fill="#000">A</text>
            <!-- 木块标签 B -->
            <text id="scene1-textB" x="400" y="275" text-anchor="middle" font-size="20" font-weight="bold" fill="#000">B</text>
            <!-- 钩码标签 4 -->
            <text id="scene1-text4" x="120" y="300" text-anchor="middle" font-size="14" fill="#000">4</text>
            <!-- 钩码标签 5 -->
            <text id="scene1-text5" x="120" y="335" text-anchor="middle" font-size="14" fill="#000">5</text>
            <!-- 钩码标签 1 -->
            <text id="scene1-text1" x="680" y="300" text-anchor="middle" font-size="14" fill="#000">1</text>
            <!-- 钩码标签 2 -->
            <text id="scene1-text2" x="680" y="335" text-anchor="middle" font-size="14" fill="#000">2</text>
            <!-- 钩码标签 3 -->
            <text id="scene1-text3" x="680" y="370" text-anchor="middle" font-size="14" fill="#000">3</text>
            <!-- T_A 标签 -->
            <text id="scene1-labelTA" x="260" y="165" text-anchor="middle" font-size="14" fill="#1565c0" opacity="0">T<sub>A</sub>=2mg</text>
            <!-- T_B 标签 -->
            <text id="scene1-labelTB" x="600" y="245" text-anchor="middle" font-size="14" fill="#1565c0" opacity="0">T<sub>B</sub>=3mg</text>
            <!-- f_AB 标签 -->
            <text id="scene1-labelfAB" x="362" y="245" text-anchor="middle" font-size="14" fill="#c62828" opacity="0">f<sub>AB</sub></text>
            <!-- f_B台 标签 -->
            <text id="scene1-labelfB" x="300" y="350" text-anchor="middle" font-size="14" fill="#c62828" opacity="0">f<sub>B台</sub></text>
        </svg>
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btnPrev" class="scene1-btn" disabled>◀ 上一步</button>
            <button id="scene1-btnNext" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>
    <script>
    (function() {
        // Scene 1: 叠放木块系统受力分析
        // 布局坐标表参考：
        // | 元素 | 位置/范围 | 备注 |
        // | 实验台台面 | (150,320)-(650,340) | 水平居中 |
        // | 木块 B | (250,220)-(550,320) | 300×100 |
        // | 木块 A | (325,140)-(475,220) | 150×80 |
        // | 左侧滑轮 | 中心 (120,180), r=25 |
        // | 右侧滑轮 | 中心 (680,180), r=25 |
        // | T_A 箭头 | (325,180)-(200,180) | 向左 |
        // | T_B 箭头 | (550,260)-(675,260) | 向右 |
        // | f_AB 箭头 | (325,220)-(400,220) | 向右 |
        // | f_B台 箭头 | (250,320)-(350,320) | 向左 |

        const TOTAL_STEPS = 5;
        let currentStep = 0;

        // 元素 ID 映射
        const elements = {
            // 基础结构（始终显示）
            base: [
                'scene1-table', 'scene1-tableShade',
                'scene1-blockA', 'scene1-blockB',
                'scene1-pulleyLeft', 'scene1-pulleyRight',
                'scene1-lineLeft', 'scene1-lineRight',
                'scene1-hook4', 'scene1-hook5',
                'scene1-hook1', 'scene1-hook2', 'scene1-hook3',
                'scene1-textA', 'scene1-textB',
                'scene1-text4', 'scene1-text5',
                'scene1-text1', 'scene1-text2', 'scene1-text3'
            ],
            // 步骤 1: T_A
            step1: ['scene1-arrowTA', 'scene1-labelTA'],
            // 步骤 2: T_B
            step2: ['scene1-arrowTB', 'scene1-labelTB'],
            // 步骤 3: f_AB
            step3: ['scene1-arrowfAB', 'scene1-labelfAB'],
            // 步骤 4: f_B台
            step4: ['scene1-arrowfB', 'scene1-labelfB']
        };

        // 获取元素
        function getEl(id) {
            return document.getElementById(id);
        }

        // 显示元素（淡入）
        function show(elId) {
            const el = getEl(elId);
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '0';
                requestAnimationFrame(() => {
                    el.style.transition = 'opacity 300ms ease-out';
                    el.style.opacity = '1';
                });
            }
        }

        // 隐藏元素（淡出）
        function hide(elId) {
            const el = getEl(elId);
            if (el) {
                el.style.transition = 'opacity 200ms ease-out';
                el.style.opacity = '0';
                setTimeout(() => {
                    el.style.display = 'none';
                }, 200);
            }
        }

        // 更新显示状态
        function updateDisplay() {
            // 基础元素始终显示
            elements.base.forEach(id => {
                const el = getEl(id);
                if (el) {
                    el.style.display = 'block';
                    el.style.opacity = '1';
                }
            });

            // 根据当前步骤显示力箭头和标签
            if (currentStep >= 1) {
                elements.step1.forEach(show);
            } else {
                elements.step1.forEach(hide);
            }

            if (currentStep >= 2) {
                elements.step2.forEach(show);
            } else {
                elements.step2.forEach(hide);
            }

            if (currentStep >= 3) {
                elements.step3.forEach(show);
            } else {
                elements.step3.forEach(hide);
            }

            if (currentStep >= 4) {
                elements.step4.forEach(show);
            } else {
                elements.step4.forEach(hide);
            }

            // 更新按钮状态
            const btnPrev = getEl('scene1-btnPrev');
            const btnNext = getEl('scene1-btnNext');

            btnPrev.disabled = (currentStep === 0);
            btnNext.textContent = (currentStep === TOTAL_STEPS - 1) ? '完成' : '下一步 ▶';
        }

        // 下一步
        function nextStep() {
            if (currentStep < TOTAL_STEPS - 1) {
                currentStep++;
                updateDisplay();
            }
        }

        // 上一步
        function prevStep() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        }

        // 绑定事件
        getEl('scene1-btnNext').addEventListener('click', nextStep);
        getEl('scene1-btnPrev').addEventListener('click', prevStep);

        // 初始化
        updateDisplay();
    })();
    </script>
</body>
</html>
