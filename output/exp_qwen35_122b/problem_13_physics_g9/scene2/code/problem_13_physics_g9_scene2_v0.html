<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 5 号钩码移至 A 上后的受力变化</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-svg { width: 800px; height: 500px; }
        #scene2-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 100; }
        .scene2-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; background: #1976d2; color: white; border: none; border-radius: 4px; }
        .scene2-btn:disabled { background: #bdbdbd; cursor: not-allowed; }
        .scene2-step-indicator { padding: 8px 16px; font-size: 14px; background: #f5f5f5; border-radius: 4px; min-width: 80px; text-align: center; }
        .scene2-conclusion { position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%); background: #fff9c4; padding: 10px 20px; border-radius: 4px; border: 2px solid #fbc02d; font-size: 14px; display: none; z-index: 100; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <!-- SVG 图示区：固定 800×500px -->
        <svg id="scene2-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene2-arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0"/>
                </marker>
                <marker id="scene2-arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#c62828"/>
                </marker>
                <marker id="scene2-arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32"/>
                </marker>
            </defs>

            <!-- 实验台：矩形 (150,320)-(650,380) -->
            <rect id="scene2-platform" x="150" y="320" width="500" height="60" fill="#e0e0e0" stroke="#424242" stroke-width="2"/>
            <!-- 实验台斜线阴影 -->
            <pattern id="scene2-hatch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
                <line x1="0" y1="0" x2="0" y2="10" stroke="#9e9e9e" stroke-width="1"/>
            </pattern>
            <rect id="scene2-platform-hatch" x="150" y="320" width="500" height="60" fill="url(#scene2-hatch)"/>

            <!-- 木块 B：矩形 (300,240)-(500,320) -->
            <rect id="scene2-rect-B" x="300" y="240" width="200" height="80" fill="rgba(227, 242, 253, 0.5)" stroke="#1976d2" stroke-width="2"/>
            <text id="scene2-label-B" x="400" y="280" text-anchor="middle" font-size="18" font-weight="bold" fill="#1976d2">B</text>

            <!-- 木块 A：矩形 (350,170)-(450,240) -->
            <rect id="scene2-rect-A" x="350" y="170" width="100" height="70" fill="rgba(227, 242, 253, 0.5)" stroke="#1976d2" stroke-width="2"/>
            <text id="scene2-label-A" x="400" y="205" text-anchor="middle" font-size="18" font-weight="bold" fill="#1976d2">A</text>

            <!-- 5 号钩码：矩形 (385,125)-(415,170) -->
            <rect id="scene2-rect-5" x="385" y="125" width="30" height="45" fill="rgba(255, 243, 224, 0.6)" stroke="#f57c00" stroke-width="2"/>
            <text id="scene2-label-5" x="400" y="147" text-anchor="middle" font-size="14" fill="#e65100">5</text>

            <!-- 左侧滑轮：圆形 (120,180) 半径 15 -->
            <circle id="scene2-pulley-left" cx="120" cy="180" r="15" fill="none" stroke="#424242" stroke-width="2"/>

            <!-- 右侧滑轮：圆形 (680,180) 半径 15 -->
            <circle id="scene2-pulley-right" cx="680" cy="180" r="15" fill="none" stroke="#424242" stroke-width="2"/>

            <!-- 左侧轻线：折线 (350,205)-(120,205)-(120,280) -->
            <polyline id="scene2-line-left" points="350,205 120,205 120,280" stroke="#424242" stroke-width="1.5" fill="none"/>

            <!-- 右侧轻线：折线 (500,280)-(680,280)-(680,360) -->
            <polyline id="scene2-line-right" points="500,280 680,280 680,360" stroke="#424242" stroke-width="1.5" fill="none"/>

            <!-- 左侧钩码组：矩形 (95,280)-(135,340) 仅 4 号钩码 -->
            <rect id="scene2-rect-4" x="95" y="280" width="40" height="60" fill="rgba(255, 243, 224, 0.6)" stroke="#f57c00" stroke-width="2"/>
            <text id="scene2-label-4" x="115" y="310" text-anchor="middle" font-size="14" fill="#e65100">4</text>

            <!-- 右侧钩码组：三个矩形 (665,320)-(705,350)、(665,350)-(705,380)、(665,380)-(705,410) 1、2、3 号 -->
            <rect id="scene2-rect-1" x="665" y="320" width="40" height="30" fill="rgba(255, 243, 224, 0.6)" stroke="#f57c00" stroke-width="2"/>
            <text id="scene2-label-1" x="685" y="335" text-anchor="middle" font-size="14" fill="#e65100">1</text>
            <rect id="scene2-rect-2" x="665" y="350" width="40" height="30" fill="rgba(255, 243, 224, 0.6)" stroke="#f57c00" stroke-width="2"/>
            <text id="scene2-label-2" x="685" y="365" text-anchor="middle" font-size="14" fill="#e65100">2</text>
            <rect id="scene2-rect-3" x="665" y="380" width="40" height="30" fill="rgba(255, 243, 224, 0.6)" stroke="#f57c00" stroke-width="2"/>
            <text id="scene2-label-3" x="685" y="395" text-anchor="middle" font-size="14" fill="#e65100">3</text>

            <!-- 初始 T_A 虚线箭头 (310,195)-(350,195) 灰色虚线，长度 40px -->
            <line id="scene2-dash-TA" x1="310" y1="195" x2="350" y2="195" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" opacity="0.5"/>
            <polygon id="scene2-dash-TA-arrow" points="350,195 340,191 340,199" fill="#888888" opacity="0.5"/>
            <text id="scene2-label-dash-TA" x="330" y="180" text-anchor="middle" font-size="12" fill="#888888" opacity="0.5">2mg</text>

            <!-- 初始 f_AB 虚线箭头 (400,245)-(450,245) 红色虚线，长度 50px -->
            <line id="scene2-dash-fAB" x1="400" y1="245" x2="450" y2="245" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5" opacity="0.5"/>
            <polygon id="scene2-dash-fAB-arrow" points="450,245 440,241 440,249" fill="#c62828" opacity="0.5"/>
            <text id="scene2-label-dash-fAB" x="425" y="230" text-anchor="middle" font-size="12" fill="#c62828" opacity="0.5">2mg</text>

            <!-- 初始 f_B台 虚线箭头 (400,325)-(350,325) 绿色虚线，长度 30px -->
            <line id="scene2-dash-fB" x1="400" y1="325" x2="350" y2="325" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5,5" opacity="0.5"/>
            <polygon id="scene2-dash-fB-arrow" points="350,325 360,321 360,329" fill="#2e7d32" opacity="0.5"/>
            <text id="scene2-label-dash-fB" x="375" y="340" text-anchor="middle" font-size="12" fill="#2e7d32" opacity="0.5">1mg</text>

            <!-- T_A'箭头 (330,205)-(350,205) 蓝色实线，长度 20px -->
            <line id="scene2-arrow-TA" x1="330" y1="205" x2="350" y2="205" stroke="#1565c0" stroke-width="2.5" opacity="0"/>
            <polygon id="scene2-arrow-TA-head" points="350,205 340,201 340,209" fill="#1565c0" opacity="0"/>
            <text id="scene2-label-TA" x="310" y="190" text-anchor="middle" font-size="14" fill="#1565c0" opacity="0">T<sub>A</sub>'=mg</text>

            <!-- T_B 箭头 (500,280)-(520,280) 蓝色实线，长度 20px -->
            <line id="scene2-arrow-TB" x1="500" y1="280" x2="520" y2="280" stroke="#1565c0" stroke-width="2.5" opacity="0"/>
            <polygon id="scene2-arrow-TB-head" points="520,280 510,276 510,284" fill="#1565c0" opacity="0"/>
            <text id="scene2-label-TB" x="525" y="265" text-anchor="middle" font-size="14" fill="#1565c0" opacity="0">T<sub>B</sub>=3mg</text>

            <!-- f_AB'箭头 (400,240)-(430,240) 红色实线，长度 30px -->
            <line id="scene2-arrow-fAB" x1="400" y1="240" x2="430" y2="240" stroke="#c62828" stroke-width="2.5" opacity="0"/>
            <polygon id="scene2-arrow-fAB-head" points="430,240 420,236 420,244" fill="#c62828" opacity="0"/>
            <text id="scene2-label-fAB" x="435" y="225" text-anchor="middle" font-size="14" fill="#c62828" opacity="0">f'<sub>AB</sub></text>
            <text id="scene2-label-decrease" x="450" y="225" text-anchor="middle" font-size="12" fill="#c62828" font-weight="bold" opacity="0">减小</text>

            <!-- f_B台'箭头 (400,320)-(370,320) 绿色实线，长度 30px -->
            <line id="scene2-arrow-fB" x1="400" y1="320" x2="370" y2="320" stroke="#2e7d32" stroke-width="2.5" opacity="0"/>
            <polygon id="scene2-arrow-fB-head" points="370,320 380,316 380,324" fill="#2e7d32" opacity="0"/>
            <text id="scene2-label-fB" x="335" y="335" text-anchor="middle" font-size="14" fill="#2e7d32" opacity="0">f'<sub>B 台</sub></text>
            <text id="scene2-label-increase" x="325" y="350" text-anchor="middle" font-size="12" fill="#2e7d32" font-weight="bold" opacity="0">增大</text>

            <!-- 控件栏（放在 SVG 内部底部） -->
            <rect x="200" y="465" width="400" height="30" fill="#f5f5f5" rx="4"/>
            <g id="scene2-svg-controls">
                <button x="220" y="475" id="scene2-svg-btn-prev" style="display:none">◀ 上一步</button>
                <text id="scene2-svg-step-indicator" x="400" y="485" text-anchor="middle" font-size="14" fill="#333">步骤 0/4</text>
                <button x="580" y="475" id="scene2-svg-btn-next" style="display:none">下一步 ▶</button>
            </g>
        </svg>

        <!-- 结论框 -->
        <div id="scene2-conclusion" class="scene2-conclusion">
            结论：f<sub>AB</sub> 减小，f<sub>B 台</sub> 增大 &nbsp;|&nbsp; 正确答案：B、D
        </div>

        <!-- 控件栏（HTML 版本，放在 SVG 上方） -->
        <div id="scene2-controls">
            <button id="scene2-btn-prev" class="scene2-btn" disabled>◀ 上一步</button>
            <div id="scene2-step-indicator" class="scene2-step-indicator">步骤 0/4</div>
            <button id="scene2-btn-next" class="scene2-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2 实现
        // 布局坐标表对照：
        // | 元素 | 位置/范围 | 备注 |
        // | 实验台 | (150,320)-(650,380) | 底部水平，带斜线阴影 |
        // | 木块 B | (300,240)-(500,320) | 置于实验台上 |
        // | 木块 A | (350,170)-(450,240) | 置于 B 上方中央 |
        // | 5 号钩码 | (385,125)-(415,170) | 放在 A 上方 |
        // | 左侧滑轮 | (120,180) 半径 15 | 实验台左边缘上方 |
        // | 右侧滑轮 | (680,180) 半径 15 | 实验台右边缘上方 |
        // | 左侧钩码组 | (95,280)-(135,340) | 仅 4 号钩码 |
        // | 右侧钩码组 | (665,320)-(705,410) | 1、2、3 号三个钩码 |

        const scene2 = {
            currentStep: 0,
            totalSteps: 4,

            // 步骤配置：每一步需要显示的元素
            stepConfig: {
                0: {
                    // 初始状态：仅显示系统结构
                    show: [],
                    hide: ['TA', 'TB', 'fAB', 'fB', 'decrease', 'increase', 'TA-label', 'TB-label', 'fAB-label', 'fB-label', 'conclusion']
                },
                1: {
                    // 高亮左侧新拉力 T_A'
                    show: ['TA', 'TA-label', 'dash-TA'],
                    hide: ['TB', 'fAB', 'fB', 'TB-label', 'fAB-label', 'fB-label', 'decrease', 'increase', 'dash-TB', 'dash-fAB', 'dash-fB', 'conclusion']
                },
                2: {
                    // 高亮右侧拉力 T_B
                    show: ['TA', 'TA-label', 'TB', 'TB-label', 'dash-TA'],
                    hide: ['fAB', 'fB', 'fAB-label', 'fB-label', 'decrease', 'increase', 'dash-fAB', 'dash-fB', 'conclusion']
                },
                3: {
                    // 标注 A、B 间静摩擦力 f_AB'
                    show: ['TA', 'TA-label', 'TB', 'TB-label', 'fAB', 'fAB-label', 'dash-TA', 'dash-fAB', 'decrease'],
                    hide: ['fB', 'fB-label', 'increase', 'dash-fB', 'conclusion']
                },
                4: {
                    // 标注 B 与实验台间静摩擦力 f_B台'
                    show: ['TA', 'TA-label', 'TB', 'TB-label', 'fAB', 'fAB-label', 'fB', 'fB-label', 'dash-TA', 'dash-fAB', 'dash-fB', 'decrease', 'increase', 'conclusion']
                }
            },

            // 获取元素 ID 映射
            getElementId: function(type) {
                const map = {
                    'TA': 'scene2-arrow-TA',
                    'TA-head': 'scene2-arrow-TA-head',
                    'TA-label': 'scene2-label-TA',
                    'TB': 'scene2-arrow-TB',
                    'TB-head': 'scene2-arrow-TB-head',
                    'TB-label': 'scene2-label-TB',
                    'fAB': 'scene2-arrow-fAB',
                    'fAB-head': 'scene2-arrow-fAB-head',
                    'fAB-label': 'scene2-label-fAB',
                    'fB': 'scene2-arrow-fB',
                    'fB-head': 'scene2-arrow-fB-head',
                    'fB-label': 'scene2-label-fB',
                    'dash-TA': 'scene2-dash-TA',
                    'dash-TA-arrow': 'scene2-dash-TA-arrow',
                    'dash-fAB': 'scene2-dash-fAB',
                    'dash-fAB-arrow': 'scene2-dash-fAB-arrow',
                    'dash-fB': 'scene2-dash-fB',
                    'dash-fB-arrow': 'scene2-dash-fB-arrow',
                    'decrease': 'scene2-label-decrease',
                    'increase': 'scene2-label-increase',
                    'conclusion': 'scene2-conclusion'
                };
                return map[type] || null;
            },

            // 显示元素
            showElement: function(type) {
                const id = this.getElementId(type);
                if (!id) return;
                const el = document.getElementById(id);
                if (el) {
                    el.style.display = 'block';
                    el.style.opacity = '1';
                }
            },

            // 隐藏元素
            hideElement: function(type) {
                const id = this.getElementId(type);
                if (!id) return;
                const el = document.getElementById(id);
                if (el) {
                    el.style.display = 'none';
                    el.style.opacity = '0';
                }
            },

            // 更新场景显示
            updateScene: function() {
                const config = this.stepConfig[this.currentStep];

                // 先隐藏所有可能显示的元素
                const allElements = ['TA', 'TA-head', 'TA-label', 'TB', 'TB-head', 'TB-label',
                    'fAB', 'fAB-head', 'fAB-label', 'fB', 'fB-head', 'fB-label',
                    'dash-TA', 'dash-TA-arrow', 'dash-fAB', 'dash-fAB-arrow', 'dash-fB', 'dash-fB-arrow',
                    'decrease', 'increase', 'conclusion'];

                allElements.forEach(el => this.hideElement(el));

                // 再显示当前步骤需要的元素
                if (config.show) {
                    config.show.forEach(el => this.showElement(el));
                }

                // 更新步骤指示器
                const stepText = `步骤 ${this.currentStep}/${this.totalSteps}`;
                document.getElementById('scene2-step-indicator').textContent = stepText;

                // 更新按钮状态
                const prevDisabled = (this.currentStep === 0);
                const nextDisabled = (this.currentStep === this.totalSteps);
                
                document.getElementById('scene2-btn-prev').disabled = prevDisabled;
                document.getElementById('scene2-btn-next').disabled = nextDisabled;

                // 显示结论框
                const conclusionEl = document.getElementById('scene2-conclusion');
                if (this.currentStep === this.totalSteps) {
                    conclusionEl.style.display = 'block';
                    conclusionEl.style.opacity = '1';
                } else {
                    conclusionEl.style.display = 'none';
                    conclusionEl.style.opacity = '0';
                }
            },

            // 上一步
            prevStep: function() {
                if (this.currentStep > 0) {
                    this.currentStep--;
                    this.updateScene();
                }
            },

            // 下一步
            nextStep: function() {
                if (this.currentStep < this.totalSteps) {
                    this.currentStep++;
                    this.updateScene();
                }
            },

            // 初始化
            init: function() {
                // 绑定按钮事件
                document.getElementById('scene2-btn-prev').addEventListener('click', () => this.prevStep());
                document.getElementById('scene2-btn-next').addEventListener('click', () => this.nextStep());

                // 初始更新显示
                this.updateScene();
            }
        };

        // 启动场景
        scene2.init();
    })();
    </script>
</body>
</html>
