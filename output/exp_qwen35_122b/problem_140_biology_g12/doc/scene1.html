<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雄果蝇 M 的染色体组型</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene1-controls button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #000; border-radius: 4px; background: #fff; }
        #scene1-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 14px; line-height: 30px; min-width: 100px; text-align: center; }
        #scene1-summary { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); font-size: 14px; color: #2e7d32; font-weight: bold; display: none; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500">
            <!-- 标题 -->
            <text id="scene1-title" x="400" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000">雄果蝇 M 的染色体组型</text>
            
            <!-- 同源连线（虚线） -->
            <path id="scene1-link-12" d="M 360 360 Q 400 370 440 350" stroke="#888888" stroke-width="1" fill="none" stroke-dasharray="5,5"/>
            <path id="scene1-link-34" d="M 220 220 L 280 180" stroke="#888888" stroke-width="1" fill="none" stroke-dasharray="5,5"/>
            <path id="scene1-link-56" d="M 520 250 L 580 150" stroke="#888888" stroke-width="1" fill="none" stroke-dasharray="5,5"/>
            <path id="scene1-link-78" d="M 392 100 L 408 100" stroke="#888888" stroke-width="1" fill="none" stroke-dasharray="5,5"/>
            
            <!-- 染色体 1（X 染色体，棒状） -->
            <path id="scene1-chrom-1" d="M 340 320 L 345 400 L 355 400 L 360 320 Q 350 310 340 320" fill="#e3f2fd" fill-opacity="0.3" stroke="#000000" stroke-width="2"/>
            
            <!-- 染色体 2（Y 染色体，J 形） -->
            <path id="scene1-chrom-2" d="M 440 320 Q 445 350 450 360 L 460 320 Q 455 310 440 320" fill="#e3f2fd" fill-opacity="0.3" stroke="#000000" stroke-width="2"/>
            
            <!-- 染色体 3（V 形，左上） -->
            <path id="scene1-chrom-3" d="M 150 150 L 185 200 L 220 220 L 200 210 L 170 170 L 160 155 Z" fill="#e3f2fd" fill-opacity="0.3" stroke="#000000" stroke-width="2"/>
            
            <!-- 染色体 4（V 形，中上偏左） -->
            <path id="scene1-chrom-4" d="M 280 180 L 315 220 L 350 250 L 330 240 L 305 210 L 290 190 Z" fill="#e3f2fd" fill-opacity="0.3" stroke="#000000" stroke-width="2"/>
            
            <!-- 染色体 5（V 形，中上偏右） -->
            <path id="scene1-chrom-5" d="M 450 180 L 485 220 L 520 250 L 500 240 L 475 210 L 460 190 Z" fill="#e3f2fd" fill-opacity="0.3" stroke="#000000" stroke-width="2"/>
            
            <!-- 染色体 6（V 形，右上） -->
            <path id="scene1-chrom-6" d="M 580 150 L 615 200 L 650 220 L 630 210 L 605 170 L 590 155 Z" fill="#e3f2fd" fill-opacity="0.3" stroke="#000000" stroke-width="2"/>
            
            <!-- 染色体 7（点状） -->
            <circle id="scene1-chrom-7" cx="380" cy="100" r="6" fill="#e3f2fd" fill-opacity="0.3" stroke="#000000" stroke-width="2"/>
            
            <!-- 染色体 8（点状） -->
            <circle id="scene1-chrom-8" cx="408" cy="100" r="6" fill="#e3f2fd" fill-opacity="0.3" stroke="#000000" stroke-width="2"/>
            
            <!-- 基因符号（调整位置避免与染色体重叠） -->
            <text id="scene1-gene-E" x="325" y="350" font-size="14" font-weight="bold" fill="#2e7d32">E</text>
            <text id="scene1-gene-v" x="135" y="165" font-size="14" font-weight="bold" fill="#2e7d32">v</text>
            <text id="scene1-gene-B" x="155" y="145" font-size="14" font-weight="bold" fill="#2e7d32">B</text>
            <text id="scene1-gene-V" x="275" y="240" font-size="14" font-weight="bold" fill="#2e7d32">V</text>
            <text id="scene1-gene-b" x="365" y="195" font-size="14" font-weight="bold" fill="#2e7d32">b</text>
            <text id="scene1-gene-r" x="580" y="165" font-size="14" font-weight="bold" fill="#2e7d32">r</text>
            <text id="scene1-gene-R" x="445" y="180" font-size="14" font-weight="bold" fill="#2e7d32">R</text>
            
            <!-- 性染色体标识 -->
            <text id="scene1-sex-X" x="345" y="305" font-size="14" font-weight="bold" fill="#c62828" style="display: none;">X</text>
            <text id="scene1-sex-Y" x="445" y="305" font-size="14" font-weight="bold" fill="#c62828" style="display: none;">Y</text>
            
            <!-- 染色体编号 -->
            <text id="scene1-label-1" x="345" y="420" font-size="16" fill="#000000">1</text>
            <text id="scene1-label-2" x="445" y="400" font-size="16" fill="#000000">2</text>
            <text id="scene1-label-3" x="125" y="145" font-size="16" fill="#000000">3</text>
            <text id="scene1-label-4" x="255" y="175" font-size="16" fill="#000000">4</text>
            <text id="scene1-label-5" x="425" y="175" font-size="16" fill="#000000">5</text>
            <text id="scene1-label-6" x="660" y="145" font-size="16" fill="#000000">6</text>
            <text id="scene1-label-7" x="375" y="85" font-size="16" fill="#000000">7</text>
            <text id="scene1-label-8" x="413" y="85" font-size="16" fill="#000000">8</text>
        </svg>
        
        <!-- 总结文字 -->
        <div id="scene1-summary">基因在染色体上呈线性分布，同源染色体携带等位基因</div>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 0/4</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        const currentStep = { value: 0 };
        const totalSteps = 4;
        
        // 染色体高亮颜色
        const HIGHLIGHT_FILL = '#1565c0';
        const DEFAULT_FILL = '#e3f2fd';
        const HIGHLIGHT_GENE_COLOR = '#1b5e20';
        const DEFAULT_GENE_COLOR = '#2e7d32';
        const HIGHLIGHT_LINK_COLOR = '#1565c0';
        const DEFAULT_LINK_COLOR = '#888888';
        
        // 染色体分组（同源染色体对）
        const chromGroups = {
            1: [1, 2],      // 性染色体
            2: [3, 4],      // 第一对常染色体
            3: [5, 6],      // 第二对常染色体
            4: [7, 8]       // 点状染色体
        };
        
        // 基因与染色体的对应关系
        const geneToChrom = {
            'E': 1,
            'v': 3, 'B': 3,
            'V': 4, 'b': 4,
            'r': 5,
            'R': 6
        };
        
        function setChromHighlight(chromIds, highlight) {
            chromIds.forEach(id => {
                const el = document.getElementById('scene1-chrom-' + id);
                if (el) {
                    el.setAttribute('fill', highlight ? HIGHLIGHT_FILL : DEFAULT_FILL);
                }
            });
        }
        
        function setGeneHighlight(geneIds, highlight) {
            geneIds.forEach(id => {
                const el = document.getElementById('scene1-gene-' + id);
                if (el) {
                    el.setAttribute('fill', highlight ? HIGHLIGHT_GENE_COLOR : DEFAULT_GENE_COLOR);
                    if (highlight) {
                        el.setAttribute('font-weight', '900');
                    } else {
                        el.setAttribute('font-weight', 'bold');
                    }
                }
            });
        }
        
        function setLinkHighlight(linkId, highlight) {
            const el = document.getElementById('scene1-link-' + linkId);
            if (el) {
                el.setAttribute('stroke', highlight ? HIGHLIGHT_LINK_COLOR : DEFAULT_LINK_COLOR);
            }
        }
        
        function showSexChromLabels(show) {
            document.getElementById('scene1-sex-X').style.display = show ? 'block' : 'none';
            document.getElementById('scene1-sex-Y').style.display = show ? 'block' : 'none';
        }
        
        function showSummary(show) {
            document.getElementById('scene1-summary').style.display = show ? 'block' : 'none';
        }
        
        function renderStep(step) {
            // 重置所有高亮
            for (let i = 1; i <= 8; i++) {
                setChromHighlight([i], false);
            }
            for (const gene in geneToChrom) {
                setGeneHighlight([gene], false);
            }
            setLinkHighlight('12', false);
            setLinkHighlight('34', false);
            setLinkHighlight('56', false);
            setLinkHighlight('78', false);
            showSexChromLabels(false);
            showSummary(false);
            
            // 根据步骤高亮对应染色体
            if (step >= 1) {
                // 步骤 1：性染色体
                setChromHighlight(chromGroups[1], true);
                setGeneHighlight(['E'], true);
                showSexChromLabels(true);
            }
            if (step >= 2) {
                // 步骤 2：第一对常染色体
                setChromHighlight(chromGroups[2], true);
                setGeneHighlight(['v', 'B', 'V', 'b'], true);
                setLinkHighlight('34', true);
            }
            if (step >= 3) {
                // 步骤 3：第二对常染色体
                setChromHighlight(chromGroups[3], true);
                setGeneHighlight(['R', 'r'], true);
                setLinkHighlight('56', true);
            }
            if (step >= 4) {
                // 步骤 4：点状染色体
                setChromHighlight(chromGroups[4], true);
                setLinkHighlight('78', true);
                showSummary(true);
            }
            
            // 更新步骤指示
            document.getElementById('scene1-step-indicator').textContent = '步骤 ' + step + '/' + totalSteps;
            
            // 更新按钮状态
            const prevBtn = document.getElementById('scene1-btn-prev');
            const nextBtn = document.getElementById('scene1-btn-next');
            prevBtn.disabled = (step === 0);
            if (step === totalSteps) {
                nextBtn.textContent = '重播';
                nextBtn.disabled = false;
            } else {
                nextBtn.textContent = '下一步 ▶';
                nextBtn.disabled = false;
            }
        }
        
        function prevStep() {
            if (currentStep.value > 0) {
                currentStep.value--;
                renderStep(currentStep.value);
            }
        }
        
        function nextStep() {
            if (currentStep.value < totalSteps) {
                currentStep.value++;
                renderStep(currentStep.value);
                // 如果到达最后一步，点击重播
                if (currentStep.value === totalSteps) {
                    document.getElementById('scene1-btn-next').textContent = '重播';
                }
            } else {
                // 重播
                currentStep.value = 0;
                renderStep(currentStep.value);
            }
        }
        
        // 绑定事件
        document.getElementById('scene1-btn-prev').addEventListener('click', prevStep);
        document.getElementById('scene1-btn-next').addEventListener('click', nextStep);
        
        // 初始渲染
        renderStep(0);
    })();
    </script>
</body>
</html>
