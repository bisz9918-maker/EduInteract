<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>陆地棉抗黄萎病基因 S 整合类型对比</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene1-step-indicator { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); font-size: 16px; font-weight: bold; color: #333; }
        .scene1-btn { padding: 8px 20px; font-size: 14px; background: #e0e0e0; border: 1px solid #999; border-radius: 4px; cursor: pointer; }
        .scene1-btn:hover:not(:disabled) { background: #bdbdbd; }
        .scene1-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene1-highlight { fill: none; stroke: #2e7d32; stroke-width: 3; opacity: 0; transition: opacity 0.3s ease; }
        .scene1-highlight.visible { opacity: 1; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500">
            <!-- 箭头标记定义 -->
            <defs>
                <marker id="scene1-arrow" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
                    <path d="M0,0 L6,3 L0,6 Z" fill="#1565c0"/>
                </marker>
            </defs>

            <!-- 细胞 a 轮廓 -->
            <circle id="scene1-cell-a" cx="100" cy="180" r="30" fill="none" stroke="#000000" stroke-width="2"/>
            <!-- 细胞 b 轮廓 -->
            <circle id="scene1-cell-b" cx="220" cy="180" r="30" fill="none" stroke="#000000" stroke-width="2"/>
            <!-- 细胞 c 轮廓 -->
            <circle id="scene1-cell-c" cx="340" cy="180" r="30" fill="none" stroke="#000000" stroke-width="2"/>
            <!-- 细胞 d 轮廓 -->
            <circle id="scene1-cell-d" cx="460" cy="180" r="30" fill="none" stroke="#000000" stroke-width="2"/>
            <!-- 细胞 e 轮廓 -->
            <circle id="scene1-cell-e" cx="580" cy="180" r="30" fill="none" stroke="#000000" stroke-width="2"/>
            <!-- 细胞 f 轮廓 -->
            <circle id="scene1-cell-f" cx="700" cy="180" r="30" fill="none" stroke="#000000" stroke-width="2"/>

            <!-- 高亮框（初始隐藏） -->
            <circle id="scene1-highlight-a" class="scene1-highlight" cx="100" cy="180" r="33"/>
            <circle id="scene1-highlight-b" class="scene1-highlight" cx="220" cy="180" r="33"/>
            <circle id="scene1-highlight-c" class="scene1-highlight" cx="340" cy="180" r="33"/>
            <circle id="scene1-highlight-d" class="scene1-highlight" cx="460" cy="180" r="33"/>
            <circle id="scene1-highlight-e" class="scene1-highlight" cx="580" cy="180" r="33"/>
            <circle id="scene1-highlight-f" class="scene1-highlight" cx="700" cy="180" r="33"/>

            <!-- 染色体 a-1（未整合，黑色） -->
            <line x1="92" y1="165" x2="92" y2="195" stroke="#000000" stroke-width="2"/>
            <!-- 染色体 a-2（已整合，蓝色带箭头） -->
            <line id="scene1-chrom-a-2" x1="108" y1="165" x2="108" y2="195" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow)"/>

            <!-- 染色体 b-1（未整合，黑色） -->
            <line x1="212" y1="165" x2="212" y2="195" stroke="#000000" stroke-width="2"/>
            <!-- 染色体 b-2（已整合，蓝色带箭头） -->
            <line id="scene1-chrom-b-2" x1="228" y1="165" x2="228" y2="195" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow)"/>

            <!-- 染色体 c-1（未整合，黑色） -->
            <line x1="332" y1="165" x2="332" y2="195" stroke="#000000" stroke-width="2"/>
            <!-- 染色体 c-2（未整合，黑色） -->
            <line x1="348" y1="165" x2="348" y2="195" stroke="#000000" stroke-width="2"/>

            <!-- 染色体 d-1（已整合，蓝色带箭头） -->
            <line id="scene1-chrom-d-1" x1="452" y1="165" x2="452" y2="195" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow)"/>
            <!-- 染色体 d-2（已整合，蓝色带箭头） -->
            <line id="scene1-chrom-d-2" x1="468" y1="165" x2="468" y2="195" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow)"/>

            <!-- 染色体 e-1（未整合，黑色） -->
            <line x1="572" y1="165" x2="572" y2="195" stroke="#000000" stroke-width="2"/>
            <!-- 染色体 e-2（已整合，蓝色带箭头） -->
            <line id="scene1-chrom-e-2" x1="588" y1="165" x2="588" y2="195" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow)"/>

            <!-- 染色体 f-1（未整合，黑色） -->
            <line x1="692" y1="165" x2="692" y2="195" stroke="#000000" stroke-width="2"/>
            <!-- 染色体 f-2（未整合，黑色） -->
            <line x1="708" y1="165" x2="708" y2="195" stroke="#000000" stroke-width="2"/>

            <!-- 线粒体 a（已整合，红色实心） -->
            <circle id="scene1-mito-a" cx="100" cy="205" r="6" fill="#c62828"/>
            <!-- 线粒体 b（已整合，红色实心） -->
            <circle id="scene1-mito-b" cx="220" cy="205" r="6" fill="#c62828"/>
            <!-- 线粒体 c（已整合，红色实心） -->
            <circle id="scene1-mito-c" cx="340" cy="205" r="6" fill="#c62828"/>
            <!-- 线粒体 d（未整合，黑色空心） -->
            <circle id="scene1-mito-d" cx="460" cy="205" r="6" fill="none" stroke="#000000" stroke-width="1.5"/>
            <!-- 线粒体 e（未整合，黑色空心） -->
            <circle id="scene1-mito-e" cx="580" cy="205" r="6" fill="none" stroke="#000000" stroke-width="1.5"/>
            <!-- 线粒体 f（未整合，黑色空心） -->
            <circle id="scene1-mito-f" cx="700" cy="205" r="6" fill="none" stroke="#000000" stroke-width="1.5"/>

            <!-- 类型标签 -->
            <text id="scene1-label-a" x="100" y="245" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">a</text>
            <text id="scene1-label-b" x="220" y="245" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">b</text>
            <text id="scene1-label-c" x="340" y="245" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">c</text>
            <text id="scene1-label-d" x="460" y="245" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">d</text>
            <text id="scene1-label-e" x="580" y="245" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">e</text>
            <text id="scene1-label-f" x="700" y="245" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">f</text>

            <!-- 图例说明 -->
            <text x="100" y="285" font-size="14" font-weight="bold" fill="#000000">图例说明</text>

            <!-- 图例 1：未整合染色体 -->
            <line x1="100" y1="310" x2="100" y2="330" stroke="#000000" stroke-width="2"/>
            <text x="115" y="325" font-size="12" fill="#000000">未整合基因 S 的 2 号染色体 DNA</text>

            <!-- 图例 2：已整合染色体（右移，x=320） -->
            <line id="scene1-legend-chrom" x1="320" y1="310" x2="320" y2="330" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow)"/>
            <text x="335" y="325" font-size="12" fill="#000000">已整合基因 S 的 2 号染色体 DNA</text>

            <!-- 图例 3：未整合线粒体 -->
            <circle id="scene1-legend-mito-un" cx="100" cy="360" r="6" fill="none" stroke="#000000" stroke-width="1.5"/>
            <text x="115" y="365" font-size="12" fill="#000000">未整合基因 S 的线粒体环状 DNA</text>

            <!-- 图例 4：已整合线粒体（右移，x=320） -->
            <circle id="scene1-legend-mito-int" cx="320" cy="360" r="6" fill="#c62828"/>
            <text x="335" y="365" font-size="12" fill="#000000">已整合基因 S 的线粒体环状 DNA</text>
        </svg>

        <!-- 步骤指示器 -->
        <div id="scene1-step-indicator">步骤 0/7</div>

        <!-- 控件按钮 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn">◀ 上一步</button>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现：六种幼苗类型的遗传组成对比
        // 布局坐标表（对照实现）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 备注 |
        // | 细胞 a-f 轮廓 | 圆形 | 中心 x=100/220/340/460/580/700, y=180 | 直径 60px | 黑色实线 2px |
        // | 染色体 | 竖线 | 各细胞内左右两侧 (x±8, y=165-195) | 3×30px | 黑色/蓝色带箭头 |
        // | 线粒体 | 实心/空心圆 | 各细胞内下方 (cx, y=205) | 直径 12px | 红色实心/黑色空心 |
        // | 类型标签 | text | 各细胞正下方 (cx, y=245) | 16×16px | 粗体黑色 |
        // | 图例 | 图形 + 文字 | y=285-370 区域 | - | 说明符号含义 |
        // | 高亮框 | 圆形 | 与各细胞同心，r=33 | 绿色 3px | 仅当前步骤显示 |
        // | 按钮 | button | (280,450)/(440,450) | 80×30px | 上一步/下一步 |
        // | 步骤指示器 | text | (400,410) | - | 显示当前步骤 |

        const sceneId = 'scene1';
        const totalSteps = 7;
        let currentStep = 0;

        // 高亮框元素映射
        const highlightElements = {
            1: document.getElementById(sceneId + '-highlight-a'),
            2: document.getElementById(sceneId + '-highlight-b'),
            3: document.getElementById(sceneId + '-highlight-c'),
            4: document.getElementById(sceneId + '-highlight-d'),
            5: document.getElementById(sceneId + '-highlight-e'),
            6: document.getElementById(sceneId + '-highlight-f')
        };

        // 按钮元素
        const btnPrev = document.getElementById(sceneId + '-btn-prev');
        const btnNext = document.getElementById(sceneId + '-btn-next');
        const stepIndicator = document.getElementById(sceneId + '-step-indicator');

        // 更新场景显示
        function updateScene() {
            // 隐藏所有高亮框
            Object.values(highlightElements).forEach(el => {
                el.classList.remove('visible');
            });

            // 根据当前步骤显示对应高亮框
            if (currentStep >= 1 && currentStep <= 6) {
                highlightElements[currentStep].classList.add('visible');
            } else if (currentStep === 7) {
                // 步骤 7：同时显示全部高亮框
                Object.values(highlightElements).forEach(el => {
                    el.classList.add('visible');
                });
            }

            // 更新步骤指示器
            stepIndicator.textContent = '步骤 ' + currentStep + '/' + totalSteps;

            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps);
        }

        // 上一步按钮点击
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        // 下一步按钮点击
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateScene();
            }
        });

        // 初始化场景
        updateScene();
    })();
    </script>
</body>
</html>
