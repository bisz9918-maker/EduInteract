<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三种突变体染色体组成对比</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 5px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .control-btn { padding: 5px 14px; font-size: 12px; background: #1976d2; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .control-btn:disabled { background: #bdbdbd; cursor: not-allowed; }
        .control-btn:hover:not(:disabled) { background: #1565c0; }
        .highlight { stroke: #2e7d32 !important; stroke-width: 4px !important; }
        .chromosome { stroke: #000000; stroke-width: 2px; fill: none; }
        .gene-c { fill: #1565c0; }
        .gene-c-lower { fill: #c62828; }
        .gamete-box { stroke: #888888; stroke-width: 1px; stroke-dasharray: 4,2; fill: none; }
        .table-header { fill: #e8f5e9; }
        .table-row-a { fill: #e3f2fd; }
        .table-row-b { fill: #e8f5e9; }
        .table-row-c { fill: #fffde7; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500">
            <!-- 标题 (y=45 确保不裁切) -->
            <text x="400" y="45" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">三种突变体染色体组成对比</text>
            
            <!-- 突变体甲框 (y=85 下移) -->
            <rect id="scene2-mutant-a" x="50" y="85" width="180" height="110" fill="none" stroke="#000000" stroke-width="2"/>
            <text x="140" y="210" text-anchor="middle" font-size="10" fill="#000000">突变体甲</text>
            <!-- 甲染色体 -->
            <line id="scene2-chrom-a1" x1="80" y1="105" x2="80" y2="145" class="chromosome"/>
            <line id="scene2-chrom-a2" x1="120" y1="105" x2="120" y2="145" class="chromosome"/>
            <line id="scene2-chrom-a3" x1="160" y1="125" x2="160" y2="145" class="chromosome"/>
            <!-- 甲基因点 -->
            <circle id="scene2-gene-a-C1" cx="80" cy="125" r="3.5" class="gene-c"/>
            <circle id="scene2-gene-a-c1" cx="120" cy="125" r="3.5" class="gene-c-lower"/>
            <circle id="scene2-gene-a-c2" cx="160" cy="140" r="3.5" class="gene-c-lower"/>
            
            <!-- 突变体乙框 -->
            <rect id="scene2-mutant-b" x="310" y="85" width="180" height="110" fill="none" stroke="#000000" stroke-width="2"/>
            <text x="400" y="210" text-anchor="middle" font-size="10" fill="#000000">突变体乙</text>
            <!-- 乙染色体 -->
            <line id="scene2-chrom-b1" x1="340" y1="105" x2="340" y2="145" class="chromosome"/>
            <line id="scene2-chrom-b2" x1="380" y1="105" x2="380" y2="145" class="chromosome"/>
            <line id="scene2-chrom-b3" x1="420" y1="105" x2="420" y2="140" class="chromosome"/>
            <!-- 乙基因点 -->
            <circle id="scene2-gene-b-C1" cx="340" cy="125" r="3.5" class="gene-c"/>
            <circle id="scene2-gene-b-c1" cx="380" cy="125" r="3.5" class="gene-c-lower"/>
            <circle id="scene2-gene-b-c2" cx="420" cy="125" r="3.5" class="gene-c-lower"/>
            
            <!-- 突变体丙框 -->
            <rect id="scene2-mutant-c" x="570" y="85" width="180" height="110" fill="none" stroke="#000000" stroke-width="2"/>
            <text x="660" y="210" text-anchor="middle" font-size="10" fill="#000000">突变体丙</text>
            <!-- 丙染色体 -->
            <line id="scene2-chrom-c1" x1="600" y1="105" x2="600" y2="145" class="chromosome"/>
            <line id="scene2-chrom-c2" x1="640" y1="105" x2="640" y2="145" class="chromosome"/>
            <line id="scene2-chrom-c3" x1="680" y1="125" x2="680" y2="145" class="chromosome"/>
            <!-- 丙基因点 -->
            <circle id="scene2-gene-c-C1" cx="600" cy="125" r="3.5" class="gene-c"/>
            <circle id="scene2-gene-c-C2" cx="640" cy="125" r="3.5" class="gene-c"/>
            <circle id="scene2-gene-c-c1" cx="680" cy="140" r="3.5" class="gene-c-lower"/>
            
            <!-- 配子区标题 (y=225 下移) -->
            <text x="400" y="225" text-anchor="middle" font-size="10" font-weight="bold" fill="#000000">配子形成分析</text>
            
            <!-- 配子框 (y=245 下移) -->
            <rect id="scene2-gamete-1" x="270" y="245" width="50" height="30" class="gamete-box"/>
            <rect id="scene2-gamete-2" x="350" y="245" width="50" height="30" class="gamete-box"/>
            <rect id="scene2-gamete-3" x="430" y="245" width="50" height="30" class="gamete-box"/>
            <rect id="scene2-gamete-4" x="510" y="245" width="50" height="30" class="gamete-box"/>
            
            <!-- 配子内容容器 -->
            <g id="scene2-gamete-content"></g>
            
            <!-- 配子比例标签 (y=285 下移) -->
            <text id="scene2-gamete-ratio" x="400" y="285" text-anchor="middle" font-size="8" fill="#000000" opacity="0"></text>
            
            <!-- 杂交表标题 (y=300 下移) -->
            <text x="400" y="300" text-anchor="middle" font-size="10" font-weight="bold" fill="#000000">与 aabbcc 杂交结果</text>
            
            <!-- 杂交结果表 (y=315 下移，高度增加) -->
            <rect id="scene2-hybrid-table" x="100" y="315" width="600" height="65" fill="none" stroke="#2e7d32" stroke-width="2"/>
            <!-- 表头 (y=325 在表格内部) -->
            <text x="200" y="325" text-anchor="middle" font-size="7" fill="#000000">突变体类型</text>
            <text x="400" y="325" text-anchor="middle" font-size="7" fill="#000000">配子比例</text>
            <text x="600" y="325" text-anchor="middle" font-size="7" fill="#000000">子代表现型比例</text>
            <!-- 表格分隔线 -->
            <line x1="300" y1="315" x2="300" y2="380" stroke="#2e7d32" stroke-width="1"/>
            <line x1="500" y1="315" x2="500" y2="380" stroke="#2e7d32" stroke-width="1"/>
            <line x1="100" y1="332" x2="700" y2="332" stroke="#2e7d32" stroke-width="1"/>
            
            <!-- 表格数据行（初始隐藏） -->
            <g id="scene2-table-data" opacity="0">
                <rect x="100" y="332" width="200" height="15" class="table-row-a"/>
                <rect x="100" y="347" width="200" height="15" class="table-row-b"/>
                <rect x="100" y="362" width="200" height="15" class="table-row-c"/>
                <text id="scene2-table-row1" x="200" y="343" text-anchor="middle" font-size="6" fill="#000000"></text>
                <text id="scene2-table-ratio1" x="400" y="343" text-anchor="middle" font-size="6" fill="#000000"></text>
                <text id="scene2-table-phenotype1" x="600" y="343" text-anchor="middle" font-size="6" fill="#000000"></text>
                <text id="scene2-table-row2" x="200" y="358" text-anchor="middle" font-size="6" fill="#000000"></text>
                <text id="scene2-table-ratio2" x="400" y="358" text-anchor="middle" font-size="6" fill="#000000"></text>
                <text id="scene2-table-phenotype2" x="600" y="358" text-anchor="middle" font-size="6" fill="#000000"></text>
                <text id="scene2-table-row3" x="200" y="373" text-anchor="middle" font-size="6" fill="#000000"></text>
                <text id="scene2-table-ratio3" x="400" y="373" text-anchor="middle" font-size="6" fill="#000000"></text>
                <text id="scene2-table-phenotype3" x="600" y="373" text-anchor="middle" font-size="6" fill="#000000"></text>
            </g>
            
            <!-- 结论提示（最终步骤显示，y=460 上移避免裁切） -->
            <text id="scene2-conclusion" x="400" y="460" text-anchor="middle" font-size="7" fill="#2e7d32" opacity="0">通过子代表现型比例可区分突变体类型</text>
        </svg>
        
        <div id="scene2-controls">
            <button id="scene2-btn-prev" class="control-btn" disabled>◀ 上一步</button>
            <button id="scene2-btn-next" class="control-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现
        // 坐标表对照（调整后）：
        // 标题区：(400,45) 居中，字体 13px
        // 突变体甲框：(50,85)-(230,195)
        // 突变体乙框：(310,85)-(490,195)
        // 突变体丙框：(570,85)-(750,195)
        // 突变体标签 y=210
        // 配子区标题 y=225
        // 配子框 y=245-275
        // 配子比例 y=285
        // 杂交表标题 y=300
        // 杂交表 y=315-380
        // 结论 y=460
        // 按钮 y=470 附近
        
        const currentStep = { value: 0 };
        const totalSteps = 5;
        
        // 突变体数据
        const mutantData = {
            a: { name: '突变体甲', ratio: 'C:c=1:2', phenotype: '黑色：黑青=1:2' },
            b: { name: '突变体乙', ratio: 'C:c=1:2', phenotype: '黑色：黑青=1:2' },
            c: { name: '突变体丙', ratio: 'C:c=2:1', phenotype: '黑色：黑青=2:1' }
        };
        
        // 配子内容数据
        const gameteData = {
            a: [
                { genes: ['C', 'c'], ratio: '1' },
                { genes: ['c'], ratio: '1' },
                { genes: ['c'], ratio: '1' },
                { genes: ['C'], ratio: '1' }
            ],
            b: [
                { genes: ['C'], ratio: '1' },
                { genes: ['c'], ratio: '1' },
                { genes: ['C', 'c'], ratio: '1' },
                { genes: ['c'], ratio: '1' }
            ],
            c: [
                { genes: ['C', 'c'], ratio: '1' },
                { genes: ['C'], ratio: '1' },
                { genes: ['C', 'c'], ratio: '1' },
                { genes: ['C'], ratio: '1' }
            ]
        };
        
        function getEl(id) {
            return document.getElementById(id);
        }
        
        function show(el) {
            if (el) { el.style.display = 'block'; el.style.opacity = '1'; }
        }
        
        function hide(el) {
            if (el) { el.style.display = 'none'; el.style.opacity = '0'; }
        }
        
        function drawGameteContent(mutantType) {
            const container = getEl('scene2-gamete-content');
            container.innerHTML = '';
            
            const data = gameteData[mutantType];
            const positions = [295, 375, 455, 535];
            
            data.forEach((item, idx) => {
                const x = positions[idx];
                
                // 基因点 - 垂直排列，间距加大
                item.genes.forEach((gene, gIdx) => {
                    const cy = 252 + gIdx * 12;  // 增加垂直间距
                    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    circle.setAttribute('cx', x + 25);
                    circle.setAttribute('cy', cy);
                    circle.setAttribute('r', '3');
                    circle.setAttribute('fill', gene === 'C' ? '#1565c0' : '#c62828');
                    container.appendChild(circle);
                    
                    // 基因标签 - 放在圆点右侧
                    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    text.setAttribute('x', x + 30);
                    text.setAttribute('y', cy + 3);
                    text.setAttribute('text-anchor', 'middle');
                    text.setAttribute('font-size', '6');
                    text.setAttribute('fill', gene === 'C' ? '#1565c0' : '#c62828');
                    text.textContent = gene;
                    container.appendChild(text);
                });
            });
        }
        
        function updateStep() {
            const step = currentStep.value;
            
            // 重置所有高亮
            ['scene2-mutant-a', 'scene2-mutant-b', 'scene2-mutant-c'].forEach(id => {
                getEl(id).classList.remove('highlight');
            });
            
            // 重置配子内容和比例
            getEl('scene2-gamete-content').innerHTML = '';
            getEl('scene2-gamete-ratio').textContent = '';
            getEl('scene2-gamete-ratio').setAttribute('opacity', '0');
            
            // 重置表格
            getEl('scene2-table-data').setAttribute('opacity', '0');
            getEl('scene2-conclusion').setAttribute('opacity', '0');
            
            if (step >= 1) {
                // 步骤 1：突变体甲
                getEl('scene2-mutant-a').classList.add('highlight');
                drawGameteContent('a');
                getEl('scene2-gamete-ratio').textContent = '配子比例：C : c = 1 : 2';
                getEl('scene2-gamete-ratio').setAttribute('opacity', '1');
                getEl('scene2-table-row1').textContent = mutantData.a.name;
                getEl('scene2-table-ratio1').textContent = mutantData.a.ratio;
                getEl('scene2-table-phenotype1').textContent = mutantData.a.phenotype;
                getEl('scene2-table-data').setAttribute('opacity', '1');
            }
            
            if (step >= 2) {
                // 步骤 2：突变体乙
                getEl('scene2-mutant-b').classList.add('highlight');
                drawGameteContent('b');
                getEl('scene2-gamete-ratio').textContent = '配子比例：C : c = 1 : 2';
                getEl('scene2-gamete-ratio').setAttribute('opacity', '1');
                getEl('scene2-table-row2').textContent = mutantData.b.name;
                getEl('scene2-table-ratio2').textContent = mutantData.b.ratio;
                getEl('scene2-table-phenotype2').textContent = mutantData.b.phenotype;
            }
            
            if (step >= 3) {
                // 步骤 3：突变体丙
                getEl('scene2-mutant-c').classList.add('highlight');
                drawGameteContent('c');
                getEl('scene2-gamete-ratio').textContent = '配子比例：C : c = 2 : 1';
                getEl('scene2-gamete-ratio').setAttribute('opacity', '1');
                getEl('scene2-table-row3').textContent = mutantData.c.name;
                getEl('scene2-table-ratio3').textContent = mutantData.c.ratio;
                getEl('scene2-table-phenotype3').textContent = mutantData.c.phenotype;
            }
            
            if (step >= 4) {
                // 步骤 4：最终对比
                getEl('scene2-gamete-ratio').textContent = '对比：甲 C:c=1:2 | 乙 C:c=1:2 | 丙 C:c=2:1';
                getEl('scene2-gamete-ratio').setAttribute('opacity', '1');
                getEl('scene2-conclusion').setAttribute('opacity', '1');
            }
            
            // 更新按钮状态
            getEl('scene2-btn-prev').disabled = (step === 0);
            getEl('scene2-btn-next').disabled = (step === totalSteps - 1);
        }
        
        // 按钮事件
        getEl('scene2-btn-prev').addEventListener('click', function() {
            if (currentStep.value > 0) {
                currentStep.value--;
                updateStep();
            }
        });
        
        getEl('scene2-btn-next').addEventListener('click', function() {
            if (currentStep.value < totalSteps - 1) {
                currentStep.value++;
                updateStep();
            }
        });
        
        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
