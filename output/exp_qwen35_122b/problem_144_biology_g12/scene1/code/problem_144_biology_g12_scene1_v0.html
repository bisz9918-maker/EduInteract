<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>果蝇眼型杂交实验 - Scene 1</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene1-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #666; border-radius: 4px; background: #f5f5f5; }
        .scene1-btn:hover:not(:disabled) { background: #e0e0e0; }
        .scene1-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene1-control-bg { fill: rgba(240, 240, 240, 0.9); }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 箭头标记定义 -->
            <defs>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#000000" />
                </marker>
                <marker id="scene1-arrowhead-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#999999" />
                </marker>
            </defs>

            <!-- ============ P 层 ============ -->
            <!-- P 层世代标签 -->
            <text id="scene1-p-label" class="scene1-step-0 scene1-step-1 scene1-step-2 scene1-step-3" x="50" y="60" font-size="18" font-weight="bold" fill="#000000">P</text>
            
            <!-- ♀棒眼 (P 代雌) -->
            <ellipse id="scene1-p-female" class="scene1-step-0 scene1-step-1 scene1-step-2 scene1-step-3" cx="230" cy="90" rx="30" ry="20" fill="#c62828" fill-opacity="0.2" stroke="#c62828" stroke-width="2"/>
            <text id="scene1-p-female-label" class="scene1-step-0 scene1-step-1 scene1-step-2 scene1-step-3" x="230" y="65" font-size="14" fill="#c62828" text-anchor="middle">♀棒眼</text>
            
            <!-- P 代交配符号 -->
            <text id="scene1-p-cross" class="scene1-step-0 scene1-step-1 scene1-step-2 scene1-step-3" x="280" y="95" font-size="18" fill="#000000">×</text>
            
            <!-- ♂圆眼 (P 代雄) -->
            <ellipse id="scene1-p-male" class="scene1-step-0 scene1-step-1 scene1-step-2 scene1-step-3" cx="370" cy="90" rx="30" ry="20" fill="#1565c0" fill-opacity="0.2" stroke="#1565c0" stroke-width="2"/>
            <text id="scene1-p-male-label" class="scene1-step-0 scene1-step-1 scene1-step-2 scene1-step-3" x="370" y="65" font-size="14" fill="#1565c0" text-anchor="middle">♂圆眼</text>
            
            <!-- P→F₁箭头 (初始虚线灰色) -->
            <line id="scene1-p-to-f1" class="scene1-step-0 scene1-step-1 scene1-step-2 scene1-step-3" x1="270" y1="130" x2="270" y2="170" stroke="#999999" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#scene1-arrowhead-gray)"/>

            <!-- ============ F₁层 ============ -->
            <!-- F₁层世代标签 -->
            <text id="scene1-f1-label" class="scene1-step-1 scene1-step-2 scene1-step-3" x="50" y="190" font-size="18" font-weight="bold" fill="#000000">F₁</text>
            
            <!-- F₁统一表现型椭圆 -->
            <ellipse id="scene1-f1-ellipse" class="scene1-step-1 scene1-step-2 scene1-step-3" cx="270" cy="220" rx="40" ry="25" fill="#1565c0" fill-opacity="0.2" stroke="#1565c0" stroke-width="2"/>
            <text id="scene1-f1-label-text" class="scene1-step-1 scene1-step-2 scene1-step-3" x="270" y="195" font-size="14" fill="#1565c0" text-anchor="middle">圆眼</text>
            
            <!-- F₁性别符号 -->
            <text id="scene1-f1-gender" class="scene1-step-1 scene1-step-2 scene1-step-3" x="270" y="280" font-size="16" fill="#000000" text-anchor="middle">♀♂</text>
            
            <!-- F₁→F₂箭头 (初始虚线灰色) -->
            <line id="scene1-f1-to-f2" class="scene1-step-1 scene1-step-2 scene1-step-3" x1="270" y1="300" x2="270" y2="330" stroke="#999999" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#scene1-arrowhead-gray)"/>
            
            <!-- F₁交配说明 -->
            <text id="scene1-f1-mating" class="scene1-step-2 scene1-step-3" x="350" y="315" font-size="14" fill="#000000">F₁雌雄交配</text>

            <!-- ============ F₂层 ============ -->
            <!-- F₂层世代标签 -->
            <text id="scene1-f2-label" class="scene1-step-3" x="50" y="350" font-size="18" font-weight="bold" fill="#000000">F₂</text>
            
            <!-- F₂♀圆眼 -->
            <ellipse id="scene1-f2-female-round" class="scene1-step-3" cx="175" cy="390" rx="25" ry="17.5" fill="#1565c0" fill-opacity="0.2" stroke="#1565c0" stroke-width="2"/>
            <text id="scene1-f2-female-round-label" class="scene1-step-3" x="175" y="368" font-size="13" fill="#1565c0" text-anchor="middle">♀圆眼</text>
            
            <!-- F₂♀棒眼 -->
            <ellipse id="scene1-f2-female-bar" class="scene1-step-3" cx="305" cy="390" rx="25" ry="17.5" fill="#c62828" fill-opacity="0.2" stroke="#c62828" stroke-width="2"/>
            <text id="scene1-f2-female-bar-label" class="scene1-step-3" x="305" y="368" font-size="13" fill="#c62828" text-anchor="middle">♀棒眼</text>
            
            <!-- F₂♂圆眼 -->
            <ellipse id="scene1-f2-male-round" class="scene1-step-3" cx="435" cy="390" rx="25" ry="17.5" fill="#1565c0" fill-opacity="0.2" stroke="#1565c0" stroke-width="2"/>
            <text id="scene1-f2-male-round-label" class="scene1-step-3" x="435" y="368" font-size="13" fill="#1565c0" text-anchor="middle">♂圆眼</text>
            
            <!-- F₂♂棒眼 -->
            <ellipse id="scene1-f2-male-bar" class="scene1-step-3" cx="565" cy="390" rx="25" ry="17.5" fill="#c62828" fill-opacity="0.2" stroke="#c62828" stroke-width="2"/>
            <text id="scene1-f2-male-bar-label" class="scene1-step-3" x="565" y="368" font-size="13" fill="#c62828" text-anchor="middle">♂棒眼</text>
            
            <!-- F₂比例标注 -->
            <text id="scene1-f2-ratio" class="scene1-step-3" x="270" y="430" font-size="16" fill="#2e7d32" font-weight="bold" text-anchor="middle">1 : 1 : 1 : 1</text>

            <!-- ============ 结论框 ============ -->
            <!-- 结论框：移到文字下方，作为底部装饰框 -->
            <text id="scene1-conclusion-text1" class="scene1-step-3" x="690" y="365" font-size="10" fill="#000000" text-anchor="middle">根据 F₂性状在</text>
            <text id="scene1-conclusion-text2" class="scene1-step-3" x="690" y="380" font-size="10" fill="#000000" text-anchor="middle">雌雄中均匀分布</text>
            <text id="scene1-conclusion-text3" class="scene1-step-3" x="690" y="395" font-size="10" fill="#000000" text-anchor="middle">判断为常染色体遗传</text>
            <!-- 结论框移到文字下方 -->
            <rect id="scene1-conclusion-box" class="scene1-step-3" x="600" y="405" width="180" height="25" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>

            <!-- ============ 控件栏背景 ============ -->
            <rect id="scene1-controls-bg" class="scene1-step-3" x="250" y="450" width="300" height="40" class="scene1-control-bg"/>
        </svg>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-prev-btn" class="scene1-btn">◀ 上一步</button>
            <button id="scene1-next-btn" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1: 果蝇眼型杂交实验
        // 布局坐标表（实现对照依据）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // | P 层世代标签 | text | (50,60) | 30×20 | - | 左侧对齐 |
        // | ♀棒眼 (P 代雌) | 椭圆 | (230,90) | 60×40 | 上方 | 红色填充 |
        // | P 代交配符号 | text | (280,95) | 20×20 | - | ×符号 |
        // | ♂圆眼 (P 代雄) | 椭圆 | (370,90) | 60×40 | 上方 | 蓝色填充 |
        // | P→F₁箭头 | 线段 | (270,130)-(270,170) | 4×40 | - | 垂直向下 |
        // | F₁层世代标签 | text | (50,190) | 30×20 | - | 左侧对齐 |
        // | F₁统一表现型椭圆 | 椭圆 | (270,220) | 80×50 | 上方 | 蓝色填充 |
        // | F₁性别符号 | text | (270,280) | 60×20 | - | ♀♂并列 |
        // | F₁→F₂箭头 | 线段 | (270,300)-(270,330) | 4×30 | - | 垂直向下 |
        // | F₁交配说明 | text | (350,315) | 80×16 | - | "F₁雌雄交配" |
        // | F₂层世代标签 | text | (50,350) | 30×20 | - | 左侧对齐 |
        // | F₂♀圆眼 | 椭圆 | (175,390) | 50×35 | 上方 | 蓝色填充 |
        // | F₂♀棒眼 | 椭圆 | (305,390) | 50×35 | 上方 | 红色填充 |
        // | F₂♂圆眼 | 椭圆 | (435,390) | 50×35 | 上方 | 蓝色填充 |
        // | F₂♂棒眼 | 椭圆 | (565,390) | 50×35 | 上方 | 红色填充 |
        // | F₂比例标注 | text | (270,430) | 200×18 | - | "1 : 1 : 1 : 1"绿色 |
        // | 结论框 | 矩形 | (600,405) | 180×25 | - | 灰色虚线框，无填充 |

        // 状态变量
        var currentStep = 0;
        var totalSteps = 4; // 步骤 0-3

        // 工具函数：显示元素
        function show(el) {
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }

        // 工具函数：隐藏元素
        function hide(el) {
            if (el) {
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }

        // 更新箭头样式
        function updateArrow(arrowId, isSolid) {
            var arrow = document.getElementById(arrowId);
            if (arrow) {
                if (isSolid) {
                    arrow.setAttribute('stroke', '#000000');
                    arrow.setAttribute('stroke-dasharray', '0');
                    arrow.setAttribute('marker-end', 'url(#scene1-arrowhead)');
                } else {
                    arrow.setAttribute('stroke', '#999999');
                    arrow.setAttribute('stroke-dasharray', '5,5');
                    arrow.setAttribute('marker-end', 'url(#scene1-arrowhead-gray)');
                }
            }
        }

        // 更新按钮状态
        function updateButtons() {
            var prevBtn = document.getElementById('scene1-prev-btn');
            var nextBtn = document.getElementById('scene1-next-btn');
            
            if (prevBtn) {
                prevBtn.disabled = (currentStep === 0);
            }
            if (nextBtn) {
                nextBtn.disabled = (currentStep === totalSteps - 1);
            }
        }

        // 渲染当前步骤
        function renderStep() {
            // 获取所有带 scene1-step-X 类的元素
            var allElements = document.querySelectorAll('[class*="scene1-step-"]');
            
            allElements.forEach(function(el) {
                var className = el.className.baseVal || el.className.value || '';
                var shouldShow = false;
                
                // 检查该元素是否在当前步骤显示
                for (var i = 0; i < totalSteps; i++) {
                    if (className.indexOf('scene1-step-' + i) !== -1 && i === currentStep) {
                        shouldShow = true;
                        break;
                    }
                }
                
                if (shouldShow) {
                    show(el);
                } else {
                    hide(el);
                }
            });

            // 特殊处理：F₁→F₂箭头在步骤 2 变为实线
            if (currentStep >= 2) {
                updateArrow('scene1-f1-to-f2', true);
            } else {
                updateArrow('scene1-f1-to-f2', false);
            }

            // 更新按钮状态
            updateButtons();
        }

        // 下一步
        function nextStep() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                renderStep();
            }
        }

        // 上一步
        function prevStep() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        }

        // 初始化
        function init() {
            var prevBtn = document.getElementById('scene1-prev-btn');
            var nextBtn = document.getElementById('scene1-next-btn');

            if (prevBtn) {
                prevBtn.addEventListener('click', prevStep);
            }
            if (nextBtn) {
                nextBtn.addEventListener('click', nextStep);
            }

            // 初始渲染
            renderStep();
        }

        // 页面加载完成后初始化
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>
</body>
</html>
