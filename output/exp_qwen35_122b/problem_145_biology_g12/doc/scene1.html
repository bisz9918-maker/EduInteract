<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>遗传系谱图分析与遗传类型判断</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; gap: 20px; z-index: 10; }
        .scene1-btn { padding: 10px 20px; font-size: 14px; cursor: pointer; border: 2px solid #1976d2; border-radius: 6px; background: #fff; color: #1976d2; transition: all 0.3s; }
        .scene1-btn:hover:not(:disabled) { background: #1976d2; color: #fff; }
        .scene1-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene1-title { position: absolute; top: 10px; left: 20px; font-size: 18px; font-weight: bold; color: #333; }
        
        .scene1-generation-label { font-size: 16px; font-weight: bold; fill: #333; }
        .scene1-individual-label { font-size: 14px; fill: #333; }
        .scene1-connection { stroke: #333; stroke-width: 2; fill: none; }
        .scene1-legend-box { fill: #fff; stroke: #888; stroke-width: 1; }
        .scene1-legend-text { font-size: 13px; fill: #333; }
        .scene1-reasoning-box { fill: #e3f2fd; fill-opacity: 0.5; stroke: #888; stroke-width: 1.5; stroke-dasharray: 5,5; }
        .scene1-reasoning-text { font-size: 12px; fill: #333; }
        .scene1-highlight { stroke: #2e7d32; stroke-width: 3px !important; }
        .scene1-question-mark { font-size: 18px; font-weight: bold; fill: #666; }
        .scene1-path-diagonal { fill: url(#scene1-pattern-diagonal); }
        .scene1-path-grid { fill: url(#scene1-pattern-grid); }
        .scene1-normal { fill: #fff; stroke: #333; stroke-width: 2; }
        .scene1-guide-line { stroke: #ff9800; stroke-width: 2; stroke-dasharray: 5,5; fill: none; }
        .scene1-guide-text { font-size: 13px; fill: #333; font-weight: bold; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <div class="scene1-title">遗传系谱图分析与遗传类型判断</div>
        
        <svg width="800" height="500">
            <defs>
                <pattern id="scene1-pattern-diagonal" patternUnits="userSpaceOnUse" width="10" height="10">
                    <rect width="10" height="10" fill="#1565c0" fill-opacity="0.2"/>
                    <line x1="0" y1="0" x2="10" y2="10" stroke="#1565c0" stroke-width="1"/>
                    <line x1="10" y1="0" x2="0" y2="10" stroke="#1565c0" stroke-width="1"/>
                </pattern>
                <pattern id="scene1-pattern-grid" patternUnits="userSpaceOnUse" width="8" height="8">
                    <rect width="8" height="8" fill="#c62828" fill-opacity="0.2"/>
                    <line x1="0" y1="0" x2="0" y2="8" stroke="#c62828" stroke-width="1"/>
                    <line x1="4" y1="0" x2="4" y2="8" stroke="#c62828" stroke-width="1"/>
                    <line x1="0" y1="0" x2="8" y2="0" stroke="#c62828" stroke-width="1"/>
                    <line x1="0" y1="4" x2="8" y2="4" stroke="#c62828" stroke-width="1"/>
                </pattern>
            </defs>
            
            <!-- 世代标记 -->
            <text id="scene1-gen-I" class="scene1-generation-label" x="50" y="65">Ⅰ</text>
            <text id="scene1-gen-II" class="scene1-generation-label" x="50" y="185">Ⅱ</text>
            <text id="scene1-gen-III" class="scene1-generation-label" x="50" y="305">Ⅲ</text>
            
            <!-- 第一代个体 -->
            <rect id="scene1-individual-1" class="scene1-normal scene1-path-diagonal" x="150" y="40" width="40" height="40"/>
            <text id="scene1-label-1" class="scene1-individual-label" x="168" y="88">1</text>
            
            <circle id="scene1-individual-2" class="scene1-normal" cx="250" cy="60" r="20"/>
            <text id="scene1-label-2" class="scene1-individual-label" x="248" y="88">2</text>
            
            <line id="scene1-line-spouse-1-2" class="scene1-connection" x1="190" y1="60" x2="230" y2="60"/>
            <line id="scene1-line-child-1-2" class="scene1-connection" x1="210" y1="60" x2="210" y2="100"/>
            
            <!-- 第二代个体 -->
            <rect id="scene1-individual-3" class="scene1-normal scene1-path-diagonal" x="100" y="160" width="40" height="40"/>
            <text id="scene1-label-3" class="scene1-individual-label" x="118" y="208">3</text>
            
            <circle id="scene1-individual-4" class="scene1-normal" cx="200" cy="180" r="20"/>
            <text id="scene1-label-4" class="scene1-individual-label" x="198" y="208">4</text>
            
            <circle id="scene1-individual-5" class="scene1-normal scene1-path-grid" cx="300" cy="180" r="20"/>
            <text id="scene1-label-5" class="scene1-individual-label" x="298" y="208">5</text>
            
            <circle id="scene1-individual-6" class="scene1-normal" cx="400" cy="180" r="20"/>
            <text id="scene1-label-6" class="scene1-individual-label" x="398" y="208">6</text>
            
            <rect id="scene1-individual-7" class="scene1-normal" x="500" y="160" width="40" height="40"/>
            <text id="scene1-label-7" class="scene1-individual-label" x="518" y="208">7</text>
            
            <line id="scene1-line-spouse-3-4" class="scene1-connection" x1="140" y1="180" x2="180" y2="180"/>
            <line id="scene1-line-spouse-6-7" class="scene1-connection" x1="440" y1="180" x2="480" y2="180"/>
            <line id="scene1-line-child-3-4" class="scene1-connection" x1="160" y1="180" x2="160" y2="220"/>
            <line id="scene1-line-child-6-7" class="scene1-connection" x1="460" y1="180" x2="460" y2="220"/>
            
            <line id="scene1-line-to-3" class="scene1-connection" x1="210" y1="100" x2="210" y2="140"/>
            <line id="scene1-line-horiz-2" class="scene1-connection" x1="120" y1="140" x2="520" y2="140"/>
            <line id="scene1-line-to-4" class="scene1-connection" x1="200" y1="140" x2="200" y2="160"/>
            <line id="scene1-line-to-5" class="scene1-connection" x1="300" y1="140" x2="300" y2="160"/>
            <line id="scene1-line-to-6" class="scene1-connection" x1="400" y1="140" x2="400" y2="160"/>
            
            <!-- 第三代个体 -->
            <circle id="scene1-individual-8" class="scene1-normal" cx="160" cy="280" r="20"/>
            <text id="scene1-question-8" class="scene1-question-mark" x="153" y="285">?</text>
            <text id="scene1-label-8" class="scene1-individual-label" x="155" y="310">8</text>
            
            <rect id="scene1-individual-9" class="scene1-normal" x="440" y="280" width="40" height="40"/>
            <text id="scene1-label-9" class="scene1-individual-label" x="458" y="328">9</text>
            
            <!-- 图例框 -->
            <rect id="scene1-legend-box" class="scene1-legend-box" x="600" y="40" width="180" height="100"/>
            <text id="scene1-legend-title" class="scene1-legend-text" x="610" y="60" font-weight="bold">图例</text>
            
            <rect id="scene1-legend-1-shape" class="scene1-path-diagonal" x="620" y="70" width="30" height="25"/>
            <text id="scene1-legend-1-text" class="scene1-legend-text" x="658" y="87">患甲病男性</text>
            
            <circle id="scene1-legend-2-shape" class="scene1-path-grid" cx="635" cy="110" r="12"/>
            <text id="scene1-legend-2-text" class="scene1-legend-text" x="658" y="115">患乙病女性</text>
            
            <rect id="scene1-legend-3-shape" class="scene1-normal" x="620" y="130" width="30" height="25"/>
            <text id="scene1-legend-3-text" class="scene1-legend-text" x="658" y="147">正常男/女</text>
            
            <!-- 推理结论框 -->
            <rect id="scene1-reasoning-1" class="scene1-reasoning-box hidden" x="580" y="200" width="210" height="55"/>
            <text id="scene1-reasoning-1-text" class="scene1-reasoning-text hidden" x="590" y="218">观察：父亲患病，儿子患病，女儿正常</text>
            <text id="scene1-reasoning-1-detail" class="scene1-reasoning-text hidden" x="590" y="238">Ⅰ-1(患甲)×Ⅰ-2(正常)→Ⅱ-5(正常)</text>
            
            <rect id="scene1-reasoning-2" class="scene1-reasoning-box hidden" x="580" y="270" width="210" height="50"/>
            <text id="scene1-reasoning-2-text" class="scene1-reasoning-text hidden" x="590" y="288">甲病：伴 X 染色体显性遗传</text>
            
            <rect id="scene1-reasoning-3" class="scene1-reasoning-box hidden" x="580" y="340" width="210" height="60"/>
            <text id="scene1-reasoning-3-text" class="scene1-reasoning-text hidden" x="590" y="358">乙病：无中生有为隐性</text>
            <text id="scene1-reasoning-3-detail" class="scene1-reasoning-text hidden" x="590" y="378">Ⅱ-5 女患者，父正常→伴 X 隐性</text>
            
            <!-- 高亮边框 -->
            <rect id="scene1-highlight-1" class="scene1-highlight hidden" x="147" y="37" width="46" height="46" fill="none"/>
            <rect id="scene1-highlight-3" class="scene1-highlight hidden" x="97" y="157" width="46" height="46" fill="none"/>
            <circle id="scene1-highlight-5" class="scene1-highlight hidden" cx="300" cy="180" r="23" fill="none"/>
            <circle id="scene1-highlight-8" class="scene1-highlight hidden" cx="160" cy="280" r="23" fill="none"/>
            
            <!-- 引导线 -->
            <line id="scene1-guide-1" class="scene1-guide-line hidden" x1="170" y1="80" x2="570" y2="150"/>
            <text id="scene1-guide-text-1" class="scene1-guide-text hidden" x="575" y="155">甲病传递特征</text>
            
            <line id="scene1-guide-2" class="scene1-guide-line hidden" x1="300" y1="160" x2="570" y2="240"/>
            <text id="scene1-guide-text-2" class="scene1-guide-text hidden" x="575" y="245">乙病传递特征</text>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn">◀ 上一步</button>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        const MAX_STEP = 5;
        let currentStep = 0;
        
        function $(id) { return document.getElementById(id); }
        function show(el) { if (el) { el.classList.remove('hidden'); } }
        function hide(el) { if (el) { el.classList.add('hidden'); } }
        
        function updateButtons() {
            $('scene1-btn-prev').disabled = (currentStep === 0);
            $('scene1-btn-next').disabled = (currentStep === MAX_STEP);
        }
        
        function renderStep0() {
            hide($('scene1-reasoning-1')); hide($('scene1-reasoning-1-text')); hide($('scene1-reasoning-1-detail'));
            hide($('scene1-reasoning-2')); hide($('scene1-reasoning-2-text'));
            hide($('scene1-reasoning-3')); hide($('scene1-reasoning-3-text')); hide($('scene1-reasoning-3-detail'));
            hide($('scene1-highlight-1')); hide($('scene1-highlight-3')); hide($('scene1-highlight-5')); hide($('scene1-highlight-8'));
            hide($('scene1-guide-1')); hide($('scene1-guide-text-1'));
            hide($('scene1-guide-2')); hide($('scene1-guide-text-2'));
        }
        
        function renderStep1() {
            renderStep0();
            show($('scene1-highlight-1')); show($('scene1-highlight-3'));
            show($('scene1-guide-1')); show($('scene1-guide-text-1'));
        }
        
        function renderStep2() {
            renderStep1();
            show($('scene1-reasoning-1')); show($('scene1-reasoning-1-text')); show($('scene1-reasoning-1-detail'));
        }
        
        function renderStep3() {
            hide($('scene1-highlight-1')); hide($('scene1-highlight-3'));
            hide($('scene1-guide-1')); hide($('scene1-guide-text-1'));
            hide($('scene1-reasoning-1')); hide($('scene1-reasoning-1-text')); hide($('scene1-reasoning-1-detail'));
            show($('scene1-highlight-5'));
            show($('scene1-guide-2')); show($('scene1-guide-text-2'));
        }
        
        function renderStep4() {
            renderStep3();
            show($('scene1-reasoning-2')); show($('scene1-reasoning-2-text'));
            show($('scene1-reasoning-3')); show($('scene1-reasoning-3-text')); show($('scene1-reasoning-3-detail'));
        }
        
        function renderStep5() {
            hide($('scene1-guide-2')); hide($('scene1-guide-text-2'));
            show($('scene1-highlight-8'));
        }
        
        function render() {
            switch(currentStep) {
                case 0: renderStep0(); break;
                case 1: renderStep1(); break;
                case 2: renderStep2(); break;
                case 3: renderStep3(); break;
                case 4: renderStep4(); break;
                case 5: renderStep5(); break;
            }
            updateButtons();
        }
        
        $('scene1-btn-prev').addEventListener('click', function() {
            if (currentStep > 0) { currentStep--; render(); }
        });
        
        $('scene1-btn-next').addEventListener('click', function() {
            if (currentStep < MAX_STEP) { currentStep++; render(); }
        });
        
        render();
    })();
    </script>
</body>
</html>
