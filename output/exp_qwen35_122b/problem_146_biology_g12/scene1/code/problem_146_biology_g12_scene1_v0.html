<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>果蝇性染色体异常类型对比</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene1-btn {
            width: 100px;
            height: 35px;
            font-size: 16px;
            font-weight: bold;
            border: 2px solid #999;
            border-radius: 6px;
            background: #f5f5f5;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .scene1-btn:hover { background: #e0e0e0; }
        .scene1-btn.active {
            border: 4px solid #2e7d32;
            background: #e8f5e9;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- 顶部标题 -->
            <text id="scene1-title" x="400" y="50" text-anchor="middle" font-size="20" font-weight="bold" fill="#000000">XXY</text>
            
            <!-- 细胞轮廓 -->
            <ellipse id="scene1-cell" cx="400" cy="200" rx="120" ry="120" fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 常染色体对 1（左上） -->
            <polyline id="scene1-const1" points="360,160 380,180 400,160" fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 常染色体对 2（右上） -->
            <polyline id="scene1-const2" points="400,160 420,180 440,160" fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 常染色体对 3（中下） -->
            <polyline id="scene1-const3" points="380,180 400,200 420,180" fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- XXY 状态染色体 -->
            <g id="scene1-xxl-group">
                <line id="scene1-xxl-x1" x1="370" y1="220" x2="370" y2="250" stroke="#1565c0" stroke-width="3"/>
                <text id="scene1-xxl-x1-label" x="355" y="240" font-size="14" fill="#1565c0">X</text>
                <line id="scene1-xxl-x2" x1="390" y1="220" x2="390" y2="250" stroke="#1565c0" stroke-width="3"/>
                <text id="scene1-xxl-x2-label" x="375" y="240" font-size="14" fill="#1565c0">X</text>
                <path id="scene1-xxl-y" d="M 410,220 Q 420,230 420,250" fill="none" stroke="#c62828" stroke-width="3"/>
                <text id="scene1-xxl-y-label" x="435" y="240" font-size="14" fill="#c62828">Y</text>
            </g>
            
            <!-- XO 状态染色体 -->
            <g id="scene1-xo-group" style="display: none;">
                <line id="scene1-xo-x" x1="390" y1="220" x2="390" y2="250" stroke="#1565c0" stroke-width="3"/>
                <text id="scene1-xo-x-label" x="375" y="240" font-size="14" fill="#1565c0">X</text>
            </g>
            
            <!-- XXX 状态染色体 -->
            <g id="scene1-xxx-group" style="display: none;">
                <line id="scene1-xxx-x1" x1="355" y1="220" x2="355" y2="250" stroke="#1565c0" stroke-width="3"/>
                <text id="scene1-xxx-x1-label" x="340" y="240" font-size="14" fill="#1565c0">X</text>
                <line id="scene1-xxx-x2" x1="385" y1="220" x2="385" y2="250" stroke="#1565c0" stroke-width="3"/>
                <text id="scene1-xxx-x2-label" x="370" y="240" font-size="14" fill="#1565c0">X</text>
                <line id="scene1-xxx-x3" x1="415" y1="220" x2="415" y2="250" stroke="#1565c0" stroke-width="3"/>
                <text id="scene1-xxx-x3-label" x="400" y="240" font-size="14" fill="#1565c0">X</text>
            </g>
            
            <!-- OY 状态染色体 -->
            <g id="scene1-oy-group" style="display: none;">
                <path id="scene1-oy-y" d="M 390,220 Q 400,230 400,250" fill="none" stroke="#c62828" stroke-width="3"/>
                <text id="scene1-oy-y-label" x="415" y="240" font-size="14" fill="#c62828">Y</text>
            </g>
            
            <!-- 底部状态标签 -->
            <text id="scene1-status" x="400" y="350" text-anchor="middle" font-size="18" fill="#000000">雌性，可育</text>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button class="scene1-btn active" id="scene1-btn-xxl">XXY</button>
            <button class="scene1-btn" id="scene1-btn-xo">XO</button>
            <button class="scene1-btn" id="scene1-btn-xxx">XXX</button>
            <button class="scene1-btn" id="scene1-btn-oy">OY</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现：果蝇性染色体异常类型对比
        // 布局坐标表：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // |------|------|-----------|------|-------------|------|
        // | 细胞轮廓 | 椭圆 | 圆心 (400,200) | 半径 120px | - | 黑色实线 2px |
        // | 常染色体对 1 | V 形线 | (360,160)-(380,180)-(400,160) | 40×20 | - | 左上常染色体 |
        // | 常染色体对 2 | V 形线 | (400,160)-(420,180)-(440,160) | 40×20 | - | 右上常染色体 |
        // | 常染色体对 3 | V 形线 | (380,180)-(400,200)-(420,180) | 40×20 | - | 中下常染色体 |
        // | XXY 状态-X 染色体 1 | 棒状线 | (370,220)-(370,250) | 4×30 | 左 | 蓝色 |
        // | XXY 状态-X 染色体 2 | 棒状线 | (390,220)-(390,250) | 4×30 | 左 | 蓝色 |
        // | XXY 状态-Y 染色体 | J 形线 | (410,220)-(420,230)-(420,250) | 15×30 | 右 | 红色 |
        // | XO 状态-X 染色体 | 棒状线 | (390,220)-(390,250) | 4×30 | 左 | 蓝色 |
        // | XXX 状态-X 染色体 1 | 棒状线 | (355,220)-(355,250) | 4×30 | 左 | 蓝色 |
        // | XXX 状态-X 染色体 2 | 棒状线 | (385,220)-(385,250) | 4×30 | 左 | 蓝色 |
        // | XXX 状态-X 染色体 3 | 棒状线 | (415,220)-(415,250) | 4×30 | 左 | 蓝色 |
        // | OY 状态-Y 染色体 | J 形线 | (390,220)-(400,230)-(400,250) | 15×30 | 右 | 红色 |
        // | 顶部标题 | text | (400,50) 居中 | ~80×20 | - | 居中显示染色体组成 |
        // | 底部状态标签 | text | (400,350) 居中 | ~100×20 | - | 居中显示性别/育性 |
        // | 按钮 1(XXY) | button | (150,450) | 100×35 | - | 绿色边框高亮当前 |
        // | 按钮 2(XO) | button | (300,450) | 100×35 | - | - |
        // | 按钮 3(XXX) | button | (450,450) | 100×35 | - | - |
        // | 按钮 4(OY) | button | (600,450) | 100×35 | - | - |
        
        // 状态数据
        const stateData = {
            0: {
                title: 'XXY',
                status: '雌性，可育',
                group: 'scene1-xxl-group',
                btnId: 'scene1-btn-xxl'
            },
            1: {
                title: 'XO',
                status: '雄性，不育',
                group: 'scene1-xo-group',
                btnId: 'scene1-btn-xo'
            },
            2: {
                title: 'XXX',
                status: '死亡',
                group: 'scene1-xxx-group',
                btnId: 'scene1-btn-xxx'
            },
            3: {
                title: 'OY',
                status: '死亡',
                group: 'scene1-oy-group',
                btnId: 'scene1-btn-oy'
            }
        };
        
        let currentScene = 0;
        
        // 工具函数：隐藏元素（同时处理 display 和 opacity）
        function hide(el) {
            if (el) {
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }
        
        // 工具函数：显示元素（同时处理 display 和 opacity）
        function show(el) {
            if (el) {
                el.style.display = '';
                // 使用 requestAnimationFrame 确保 opacity 过渡
                requestAnimationFrame(() => {
                    el.style.opacity = '1';
                });
            }
        }
        
        // 切换状态
        function switchScene(newState) {
            if (newState === currentScene) return;
            
            // 隐藏当前状态组
            const currentGroup = document.getElementById(stateData[currentScene].group);
            hide(currentGroup);
            
            // 更新按钮样式
            const currentBtn = document.getElementById(stateData[currentScene].btnId);
            if (currentBtn) {
                currentBtn.classList.remove('active');
            }
            
            // 更新状态
            currentScene = newState;
            
            // 显示新状态组
            const newGroup = document.getElementById(stateData[newState].group);
            show(newGroup);
            
            // 更新按钮样式
            const newBtn = document.getElementById(stateData[newState].btnId);
            if (newBtn) {
                newBtn.classList.add('active');
            }
            
            // 更新标题和状态标签（带淡入效果）
            const titleEl = document.getElementById('scene1-title');
            const statusEl = document.getElementById('scene1-status');
            
            titleEl.style.opacity = '0';
            statusEl.style.opacity = '0';
            
            requestAnimationFrame(() => {
                titleEl.textContent = stateData[newState].title;
                statusEl.textContent = stateData[newState].status;
                titleEl.style.opacity = '1';
                statusEl.style.opacity = '1';
            });
        }
        
        // 初始化
        function init() {
            // 绑定按钮事件
            document.getElementById('scene1-btn-xxl').addEventListener('click', () => switchScene(0));
            document.getElementById('scene1-btn-xo').addEventListener('click', () => switchScene(1));
            document.getElementById('scene1-btn-xxx').addEventListener('click', () => switchScene(2));
            document.getElementById('scene1-btn-oy').addEventListener('click', () => switchScene(3));
            
            // 初始显示 XXY 状态
            show(document.getElementById('scene1-xxl-group'));
        }
        
        // 页面加载完成后初始化
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>
</body>
</html>
