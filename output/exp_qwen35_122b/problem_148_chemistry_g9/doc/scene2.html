<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 甲烷与水反应分析</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        
        .option-btn {
            width: 140px;
            height: 50px;
            background: #e0e0e0;
            border: 2px solid #000000;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            color: #000000;
            transition: all 0.3s ease;
        }
        .option-btn:hover { background: #bdbdbd; }
        .option-btn.active {
            background: #1565c0;
            color: #ffffff;
            border-color: #0d47a1;
        }
        
        .analysis-content {
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .analysis-content.show {
            display: block;
            opacity: 1;
        }
        
        .result-text {
            font-size: 18px;
            font-weight: bold;
        }
        .result-correct { color: #2e7d32; }
        .result-wrong { color: #c62828; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500">
            <!-- 化学方程式标题 -->
            <text x="400" y="45" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000">
                CH₄ + H₂O → CO + 3H₂
            </text>
            
            <!-- 选项按钮背景 -->
            <rect id="scene2-rect-A" x="80" y="80" width="140" height="50" rx="8" fill="#e0e0e0" stroke="#000000" stroke-width="2"/>
            <rect id="scene2-rect-B" x="240" y="80" width="140" height="50" rx="8" fill="#e0e0e0" stroke="#000000" stroke-width="2"/>
            <rect id="scene2-rect-C" x="400" y="80" width="140" height="50" rx="8" fill="#e0e0e0" stroke="#000000" stroke-width="2"/>
            <rect id="scene2-rect-D" x="560" y="80" width="140" height="50" rx="8" fill="#e0e0e0" stroke="#000000" stroke-width="2"/>
            
            <!-- 选项标签 -->
            <text id="scene2-label-A" x="150" y="110" text-anchor="middle" font-size="20" font-weight="bold" fill="#000000">A</text>
            <text id="scene2-label-B" x="310" y="110" text-anchor="middle" font-size="20" font-weight="bold" fill="#000000">B</text>
            <text id="scene2-label-C" x="470" y="110" text-anchor="middle" font-size="20" font-weight="bold" fill="#000000">C</text>
            <text id="scene2-label-D" x="630" y="110" text-anchor="middle" font-size="20" font-weight="bold" fill="#000000">D</text>
            
            <!-- 分析内容区边框 -->
            <rect id="scene2-analysis-bg" x="50" y="160" width="700" height="280" fill="#ffffff" stroke="#000000" stroke-width="2"/>
            
            <!-- 初始提示文字 -->
            <text id="scene2-prompt" x="400" y="300" text-anchor="middle" font-size="16" fill="#666666">请点击选项按钮查看分析</text>
            
            <!-- A 分析内容：化合价表 -->
            <g id="scene2-content-A" class="analysis-content">
                <text x="70" y="190" font-size="15" font-weight="bold" fill="#000000">选项 A：反应前后各元素的化合价均不变</text>
                <text x="70" y="220" font-size="13" fill="#000000">元素化合价变化分析：</text>
                <text x="70" y="245" font-size="13" fill="#000000">• C（碳）：反应前 -4 → 反应后 +2 → 变化</text>
                <text x="70" y="265" font-size="13" fill="#000000">• H（氢）：反应前 +1 → 反应后 +1 → 不变</text>
                <text x="70" y="285" font-size="13" fill="#000000">• O（氧）：反应前 -2 → 反应后 -2 → 不变</text>
                <text x="400" y="320" text-anchor="middle" class="result-text result-wrong">错误</text>
                <text x="400" y="340" text-anchor="middle" font-size="12" fill="#000000">C 元素化合价发生变化</text>
            </g>
            
            <!-- B 分析内容：含氢化合物列表 -->
            <g id="scene2-content-B" class="analysis-content">
                <text x="70" y="190" font-size="15" font-weight="bold" fill="#000000">选项 B：该反应中含氢元素的化合物有 3 种</text>
                <text x="70" y="220" font-size="13" fill="#000000">含氢物质分析：</text>
                <text x="70" y="245" font-size="13" fill="#000000">化合物（含氢）：CH₄、H₂O（共 2 种）</text>
                <text x="70" y="265" font-size="13" fill="#000000">单质（含氢）：H₂</text>
                <text x="70" y="285" font-size="13" fill="#000000">注意：CO 不含氢元素</text>
                <text x="400" y="320" text-anchor="middle" class="result-text result-wrong">错误</text>
                <text x="400" y="340" text-anchor="middle" font-size="12" fill="#000000">含氢化合物只有 2 种</text>
            </g>
            
            <!-- C 分析内容：质量比计算 -->
            <g id="scene2-content-C" class="analysis-content">
                <text x="70" y="190" font-size="15" font-weight="bold" fill="#000000">选项 C：该反应中乙和丁的质量比为 3:1</text>
                <text x="70" y="220" font-size="13" fill="#000000">乙 = H₂O，丁 = H₂</text>
                <text x="70" y="245" font-size="13" fill="#000000">乙质量 = 18 × 1 = 18，丁质量 = 2 × 3 = 6</text>
                <text x="70" y="265" font-size="13" fill="#000000">质量比 乙:丁 = 18:6 = 3:1</text>
                <text x="400" y="320" text-anchor="middle" class="result-text result-correct">正确</text>
                <text x="400" y="340" text-anchor="middle" font-size="12" fill="#000000">计算正确</text>
            </g>
            
            <!-- D 分析内容：分子个数比 -->
            <g id="scene2-content-D" class="analysis-content">
                <text x="70" y="190" font-size="15" font-weight="bold" fill="#000000">选项 D：该反应中丙和丁的分子个数比为 1:3</text>
                <text x="70" y="220" font-size="13" fill="#000000">丙 = CO，丁 = H₂</text>
                <text x="70" y="245" font-size="13" fill="#000000">从图中数出：丙（CO）= 1 个，丁（H₂）= 3 个</text>
                <text x="70" y="265" font-size="13" font-weight="bold" fill="#000000">分子个数比 丙:丁 = 1:3</text>
                <text x="400" y="320" text-anchor="middle" class="result-text result-correct">正确</text>
                <text x="400" y="340" text-anchor="middle" font-size="12" fill="#000000">从图中可直接数出</text>
            </g>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-btn-A" class="option-btn">A</button>
            <button id="scene2-btn-B" class="option-btn">B</button>
            <button id="scene2-btn-C" class="option-btn">C</button>
            <button id="scene2-btn-D" class="option-btn">D</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现 - 甲烷与水反应选项分析
        
        // 状态变量
        let currentOption = null;
        
        // DOM 元素引用
        const buttons = {
            A: document.getElementById('scene2-btn-A'),
            B: document.getElementById('scene2-btn-B'),
            C: document.getElementById('scene2-btn-C'),
            D: document.getElementById('scene2-btn-D')
        };
        
        const contentDivs = {
            A: document.getElementById('scene2-content-A'),
            B: document.getElementById('scene2-content-B'),
            C: document.getElementById('scene2-content-C'),
            D: document.getElementById('scene2-content-D')
        };
        
        const promptText = document.getElementById('scene2-prompt');
        
        // 按钮点击处理函数
        function handleOptionClick(option) {
            // 如果点击已选中的选项，则取消选中
            if (currentOption === option) {
                currentOption = null;
                // 清除所有按钮的 active 状态
                Object.values(buttons).forEach(btn => btn.classList.remove('active'));
                // 清除所有标签的 fill 颜色
                document.getElementById('scene2-label-A').setAttribute('fill', '#000000');
                document.getElementById('scene2-label-B').setAttribute('fill', '#000000');
                document.getElementById('scene2-label-C').setAttribute('fill', '#000000');
                document.getElementById('scene2-label-D').setAttribute('fill', '#000000');
                // 隐藏所有分析内容
                Object.values(contentDivs).forEach(div => {
                    div.classList.remove('show');
                    setTimeout(() => {
                        if (!div.classList.contains('show')) {
                            div.style.display = 'none';
                        }
                    }, 300);
                });
                // 显示提示文字
                promptText.style.display = 'block';
                promptText.style.opacity = '1';
                return;
            }
            
            // 切换到新选项
            currentOption = option;
            
            // 清除所有按钮的 active 状态
            Object.values(buttons).forEach(btn => btn.classList.remove('active'));
            // 设置当前按钮为 active
            buttons[option].classList.add('active');
            
            // 更新按钮标签颜色
            Object.keys(buttons).forEach(key => {
                const label = document.getElementById('scene2-label-' + key);
                if (key === option) {
                    label.setAttribute('fill', '#ffffff');
                } else {
                    label.setAttribute('fill', '#000000');
                }
            });
            
            // 隐藏提示文字
            promptText.style.display = 'none';
            
            // 隐藏所有分析内容
            Object.values(contentDivs).forEach(div => {
                div.classList.remove('show');
                setTimeout(() => {
                    if (!div.classList.contains('show')) {
                        div.style.display = 'none';
                    }
                }, 300);
            });
            
            // 显示当前分析内容
            const currentContent = contentDivs[option];
            currentContent.style.display = 'block';
            // 使用 requestAnimationFrame 确保 display 生效后再设置 opacity
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    currentContent.classList.add('show');
                });
            });
        }
        
        // 绑定按钮事件
        buttons.A.addEventListener('click', () => handleOptionClick('A'));
        buttons.B.addEventListener('click', () => handleOptionClick('B'));
        buttons.C.addEventListener('click', () => handleOptionClick('C'));
        buttons.D.addEventListener('click', () => handleOptionClick('D'));
        
        // 初始化：所有分析内容隐藏
        Object.values(contentDivs).forEach(div => {
            div.style.display = 'none';
        });
        
    })();
    </script>
</body>
</html>
