<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>化学反应微观模拟 - 置换反应</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene1-btn { padding: 8px 20px; font-size: 14px; border: 2px solid #333; border-radius: 6px; cursor: pointer; background: #f5f5f5; transition: all 0.2s; }
        .scene1-btn:hover:not(:disabled) { background: #e0e0e0; }
        .scene1-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene1-hidden { opacity: 0; display: none; }
        svg text { font-family: "Microsoft YaHei", sans-serif; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- 图例区背景 -->
            <rect id="scene1-legend-bg" x="20" y="50" width="100" height="200" fill="#f9f9f9" stroke="#ccc" stroke-width="1"/>
            
            <!-- 原子图例 -->
            <circle id="scene1-atom-a" cx="40" cy="80" r="8" fill="#000000"/>
            <text id="scene1-label-a" x="130" y="84" font-size="14" fill="#000000">a</text>
            
            <circle id="scene1-atom-b" cx="40" cy="130" r="12" fill="#000000"/>
            <text id="scene1-label-b" x="131" y="134" font-size="14" fill="#000000">b</text>
            
            <circle id="scene1-atom-c" cx="40" cy="190" r="16" fill="#000000"/>
            <text id="scene1-label-c" x="139" y="194" font-size="14" fill="#000000">c</text>
            
            <!-- 图甲框（反应前）- 缩小框的尺寸，给标签留出空间 -->
            <rect id="scene1-box-a" x="150" y="80" width="240" height="150" fill="none" stroke="#000000" stroke-width="2"/>
            <text id="scene1-label-box-a" x="270" y="300" font-size="14" fill="#000000" text-anchor="middle">图甲（反应前）</text>
            
            <!-- 图甲中的 a₂分子（4 个）- 标签移到框外下方更远 -->
            <g id="scene1-mol-a2-1">
                <circle cx="175" cy="100" r="6" fill="#000000"/>
                <circle cx="189" cy="100" r="6" fill="#000000"/>
            </g>
            <text id="scene1-label-a2-1" x="182" y="250" font-size="12" fill="#000000" text-anchor="middle">a₂</text>
            
            <g id="scene1-mol-a2-2">
                <circle cx="175" cy="140" r="6" fill="#000000"/>
                <circle cx="189" cy="140" r="6" fill="#000000"/>
            </g>
            <text id="scene1-label-a2-2" x="182" y="265" font-size="12" fill="#000000" text-anchor="middle">a₂</text>
            
            <g id="scene1-mol-a2-3">
                <circle cx="335" cy="100" r="6" fill="#000000"/>
                <circle cx="349" cy="100" r="6" fill="#000000"/>
            </g>
            <text id="scene1-label-a2-3" x="342" y="250" font-size="12" fill="#000000" text-anchor="middle">a₂</text>
            
            <g id="scene1-mol-a2-4">
                <circle cx="335" cy="140" r="6" fill="#000000"/>
                <circle cx="349" cy="140" r="6" fill="#000000"/>
            </g>
            <text id="scene1-label-a2-4" x="342" y="265" font-size="12" fill="#000000" text-anchor="middle">a₂</text>
            
            <!-- 图甲中的 cb 分子（2 个）- 标签移到框外下方更远 -->
            <g id="scene1-mol-cb-1">
                <circle cx="255" cy="100" r="12" fill="#000000"/>
                <circle cx="283" cy="100" r="8" fill="#000000"/>
            </g>
            <text id="scene1-label-cb-1" x="269" y="250" font-size="12" fill="#000000" text-anchor="middle">cb</text>
            
            <g id="scene1-mol-cb-2">
                <circle cx="255" cy="140" r="12" fill="#000000"/>
                <circle cx="283" cy="140" r="8" fill="#000000"/>
            </g>
            <text id="scene1-label-cb-2" x="269" y="265" font-size="12" fill="#000000" text-anchor="middle">cb</text>
            
            <!-- 反应箭头 -->
            <defs>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#000000"/>
                </marker>
            </defs>
            <line id="scene1-arrow" x1="395" y1="150" x2="445" y2="150" stroke="#000000" stroke-width="3" marker-end="url(#scene1-arrowhead)"/>
            
            <!-- 图乙框（反应后）- 缩小框的尺寸，给标签留出空间 -->
            <rect id="scene1-box-b" x="445" y="80" width="240" height="150" fill="none" stroke="#000000" stroke-width="2"/>
            <text id="scene1-label-box-b" x="565" y="300" font-size="14" fill="#000000" text-anchor="middle">图乙（反应后）</text>
            
            <!-- 图乙中的问号（初始显示）- 移到框内中央但不压边框 -->
            <text id="scene1-question-mark" x="565" y="155" font-size="36" fill="#888888" text-anchor="middle">?</text>
            
            <!-- 图乙中的 a₂分子剩余物（2 个，步骤 2 显示）- 标签在框外 -->
            <g id="scene1-mol-a2-remain-1" class="scene1-hidden">
                <circle cx="475" cy="100" r="6" fill="#888888"/>
                <circle cx="489" cy="100" r="6" fill="#888888"/>
            </g>
            <text id="scene1-label-a2-remain-1" class="scene1-hidden" x="482" y="250" font-size="12" fill="#888888" text-anchor="middle">a₂</text>
            
            <g id="scene1-mol-a2-remain-2" class="scene1-hidden">
                <circle cx="475" cy="140" r="6" fill="#888888"/>
                <circle cx="489" cy="140" r="6" fill="#888888"/>
            </g>
            <text id="scene1-label-a2-remain-2" class="scene1-hidden" x="482" y="265" font-size="12" fill="#888888" text-anchor="middle">a₂</text>
            
            <!-- 图乙中的 a₂b 分子（2 个，步骤 2 显示）- 标签在框外 -->
            <g id="scene1-mol-a2b-1" class="scene1-hidden">
                <circle cx="545" cy="90" r="6" fill="#000000"/>
                <circle cx="559" cy="90" r="6" fill="#000000"/>
                <circle cx="552" cy="105" r="8" fill="#000000"/>
            </g>
            <text id="scene1-label-a2b-1" class="scene1-hidden" x="552" y="250" font-size="12" fill="#000000" text-anchor="middle">a₂b</text>
            
            <g id="scene1-mol-a2b-2" class="scene1-hidden">
                <circle cx="545" cy="130" r="6" fill="#000000"/>
                <circle cx="559" cy="130" r="6" fill="#000000"/>
                <circle cx="552" cy="145" r="8" fill="#000000"/>
            </g>
            <text id="scene1-label-a2b-2" class="scene1-hidden" x="552" y="265" font-size="12" fill="#000000" text-anchor="middle">a₂b</text>
            
            <!-- 图乙中的 c 原子（2 个，步骤 2 显示）- 标签在框外 -->
            <g id="scene1-atom-c-prod-1" class="scene1-hidden">
                <circle cx="615" cy="100" r="12" fill="#000000"/>
            </g>
            <text id="scene1-label-c-prod-1" class="scene1-hidden" x="615" y="250" font-size="12" fill="#000000" text-anchor="middle">c</text>
            
            <g id="scene1-atom-c-prod-2" class="scene1-hidden">
                <circle cx="615" cy="140" r="12" fill="#000000"/>
            </g>
            <text id="scene1-label-c-prod-2" class="scene1-hidden" x="615" y="265" font-size="12" fill="#000000" text-anchor="middle">c</text>
            
            <!-- 高亮框（步骤 1 显示）- 调整位置避免与标签重叠 -->
            <rect id="scene1-highlight-box" class="scene1-hidden" x="165" y="85" width="140" height="70" fill="none" stroke="#1565c0" stroke-width="2" stroke-dasharray="5,5"/>
            <text id="scene1-label-reactant" class="scene1-hidden" x="235" y="75" font-size="14" fill="#1565c0" text-anchor="middle">反应物</text>
            
            <!-- 生成物标签（步骤 3 显示） -->
            <text id="scene1-label-product" class="scene1-hidden" x="565" y="70" font-size="14" fill="#2e7d32" text-anchor="middle">生成物</text>
            
            <!-- 结论区（步骤 4 显示）- 调整位置避免重叠 -->
            <rect id="scene1-conclusion-box" class="scene1-hidden" x="550" y="400" width="230" height="70" fill="#f9f9f9" stroke="#2e7d32" stroke-width="2"/>
            <text id="scene1-equation" class="scene1-hidden" x="665" y="430" font-size="14" fill="#000000" text-anchor="middle">a₂ + cb → a₂b + c</text>
            <text id="scene1-reaction-type" class="scene1-hidden" x="665" y="455" font-size="14" fill="#2e7d32" text-anchor="middle" font-weight="bold">置换反应</text>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn" disabled>◀ 上一步</button>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1: 化学反应微观过程模拟（置换反应）
        // 坐标表对照：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // |------|------|-----------|------|-------------|------|
        // | 图例区背景 | 矩形 | (20,50)-(120,250) | 100×200 | - | 左侧图例区域 |
        // | 原子 a | 圆 | (40,80) | 10px 直径 | 右方 | 小黑色圆 |
        // | 原子 b | 圆 | (40,130) | 16px 直径 | 右方 | 中黑色圆 |
        // | 原子 c | 圆 | (40,190) | 24px 直径 | 右方 | 大黑色圆 |
        // | 图甲框 | 矩形 | (150,80)-(390,260) | 240×180 | - | 反应前区域 |
        // | 图乙框 | 矩形 | (445,80)-(685,260) | 240×180 | - | 反应后区域 |
        
        const TOTAL_STEPS = 5;
        let currentStep = 0;
        
        // 工具函数：显示元素
        function show(el) {
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }
        
        // 工具函数：隐藏元素
        function hide(el) {
            if (el) {
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }
        
        // 获取元素引用
        const els = {
            // 图甲分子
            molA2_1: document.getElementById('scene1-mol-a2-1'),
            molA2_2: document.getElementById('scene1-mol-a2-2'),
            molA2_3: document.getElementById('scene1-mol-a2-3'),
            molA2_4: document.getElementById('scene1-mol-a2-4'),
            molCb_1: document.getElementById('scene1-mol-cb-1'),
            molCb_2: document.getElementById('scene1-mol-cb-2'),
            // 图甲分子标签
            labelA2_1: document.getElementById('scene1-label-a2-1'),
            labelA2_2: document.getElementById('scene1-label-a2-2'),
            labelA2_3: document.getElementById('scene1-label-a2-3'),
            labelA2_4: document.getElementById('scene1-label-a2-4'),
            labelCb_1: document.getElementById('scene1-label-cb-1'),
            labelCb_2: document.getElementById('scene1-label-cb-2'),
            // 图乙产物
            molA2Remain_1: document.getElementById('scene1-mol-a2-remain-1'),
            molA2Remain_2: document.getElementById('scene1-mol-a2-remain-2'),
            molA2b_1: document.getElementById('scene1-mol-a2b-1'),
            molA2b_2: document.getElementById('scene1-mol-a2b-2'),
            atomCProd_1: document.getElementById('scene1-atom-c-prod-1'),
            atomCProd_2: document.getElementById('scene1-atom-c-prod-2'),
            // 图乙产物标签
            labelA2Remain_1: document.getElementById('scene1-label-a2-remain-1'),
            labelA2Remain_2: document.getElementById('scene1-label-a2-remain-2'),
            labelA2b_1: document.getElementById('scene1-label-a2b-1'),
            labelA2b_2: document.getElementById('scene1-label-a2b-2'),
            labelCProd_1: document.getElementById('scene1-label-c-prod-1'),
            labelCProd_2: document.getElementById('scene1-label-c-prod-2'),
            // 高亮元素
            highlightBox: document.getElementById('scene1-highlight-box'),
            labelReactant: document.getElementById('scene1-label-reactant'),
            labelProduct: document.getElementById('scene1-label-product'),
            // 结论区
            conclusionBox: document.getElementById('scene1-conclusion-box'),
            equation: document.getElementById('scene1-equation'),
            reactionType: document.getElementById('scene1-reaction-type'),
            // 问号
            questionMark: document.getElementById('scene1-question-mark'),
            // 按钮
            btnPrev: document.getElementById('scene1-btn-prev'),
            btnNext: document.getElementById('scene1-btn-next')
        };
        
        // 更新场景显示
        function updateScene() {
            // 重置所有状态
            hide(els.highlightBox);
            hide(els.labelReactant);
            hide(els.labelProduct);
            hide(els.conclusionBox);
            hide(els.equation);
            hide(els.reactionType);
            hide(els.molA2Remain_1);
            hide(els.labelA2Remain_1);
            hide(els.molA2Remain_2);
            hide(els.labelA2Remain_2);
            hide(els.molA2b_1);
            hide(els.labelA2b_1);
            hide(els.molA2b_2);
            hide(els.labelA2b_2);
            hide(els.atomCProd_1);
            hide(els.labelCProd_1);
            hide(els.atomCProd_2);
            hide(els.labelCProd_2);
            
            // 重置所有高亮
            [els.molA2_1, els.molA2_2, els.molA2_3, els.molA2_4].forEach(el => {
                el.querySelectorAll('circle').forEach(c => c.style.fill = '#000000');
            });
            [els.molCb_1, els.molCb_2].forEach(el => {
                el.querySelectorAll('circle').forEach(c => c.style.fill = '#000000');
            });
            
            // 步骤 0：初始状态 - 显示反应前粒子
            if (currentStep === 0) {
                show(els.questionMark);
                els.btnPrev.disabled = true;
                els.btnNext.disabled = false;
            }
            // 步骤 1：反应进行中 - 高亮反应物
            else if (currentStep === 1) {
                hide(els.questionMark);
                show(els.highlightBox);
                show(els.labelReactant);
                
                // 高亮左侧 2 个 a₂分子（蓝色）
                [els.molA2_1, els.molA2_2].forEach(mol => {
                    mol.querySelectorAll('circle').forEach(c => c.style.fill = '#1565c0');
                });
                // 高亮 2 个 cb 分子（红色）
                [els.molCb_1, els.molCb_2].forEach(mol => {
                    mol.querySelectorAll('circle').forEach(c => c.style.fill = '#c62828');
                });
                
                els.btnPrev.disabled = false;
                els.btnNext.disabled = false;
            }
            // 步骤 2：反应完成 - 显示产物
            else if (currentStep === 2) {
                hide(els.highlightBox);
                hide(els.labelReactant);
                hide(els.questionMark);
                
                // 图甲中剩余 2 个 a₂分子变灰色
                [els.molA2_3, els.molA2_4].forEach(mol => {
                    mol.querySelectorAll('circle').forEach(c => c.style.fill = '#888888');
                });
                
                // 显示图乙中的产物
                show(els.molA2Remain_1);
                show(els.labelA2Remain_1);
                show(els.molA2Remain_2);
                show(els.labelA2Remain_2);
                show(els.molA2b_1);
                show(els.labelA2b_1);
                show(els.molA2b_2);
                show(els.labelA2b_2);
                show(els.atomCProd_1);
                show(els.labelCProd_1);
                show(els.atomCProd_2);
                show(els.labelCProd_2);
                
                els.btnPrev.disabled = false;
                els.btnNext.disabled = false;
            }
            // 步骤 3：生成物识别 - 高亮生成物
            else if (currentStep === 3) {
                hide(els.highlightBox);
                hide(els.labelReactant);
                hide(els.questionMark);
                show(els.labelProduct);
                
                // 图甲中剩余 2 个 a₂分子保持灰色
                [els.molA2_3, els.molA2_4].forEach(mol => {
                    mol.querySelectorAll('circle').forEach(c => c.style.fill = '#888888');
                });
                
                // 显示图乙中的产物
                show(els.molA2Remain_1);
                show(els.labelA2Remain_1);
                show(els.molA2Remain_2);
                show(els.labelA2Remain_2);
                show(els.molA2b_1);
                show(els.labelA2b_1);
                show(els.molA2b_2);
                show(els.labelA2b_2);
                show(els.atomCProd_1);
                show(els.labelCProd_1);
                show(els.atomCProd_2);
                show(els.labelCProd_2);
                
                // 高亮生成物（绿色）
                [els.molA2b_1, els.molA2b_2].forEach(mol => {
                    mol.querySelectorAll('circle').forEach(c => c.style.fill = '#2e7d32');
                });
                [els.atomCProd_1, els.atomCProd_2].forEach(atom => {
                    atom.querySelector('circle').style.fill = '#2e7d32';
                });
                
                els.btnPrev.disabled = false;
                els.btnNext.disabled = false;
            }
            // 步骤 4：反应类型 - 显示结论
            else if (currentStep === 4) {
                hide(els.highlightBox);
                hide(els.labelReactant);
                hide(els.labelProduct);
                hide(els.questionMark);
                show(els.conclusionBox);
                show(els.equation);
                show(els.reactionType);
                
                // 图甲中剩余 2 个 a₂分子保持灰色
                [els.molA2_3, els.molA2_4].forEach(mol => {
                    mol.querySelectorAll('circle').forEach(c => c.style.fill = '#888888');
                });
                
                // 显示图乙中的产物
                show(els.molA2Remain_1);
                show(els.labelA2Remain_1);
                show(els.molA2Remain_2);
                show(els.labelA2Remain_2);
                show(els.molA2b_1);
                show(els.labelA2b_1);
                show(els.molA2b_2);
                show(els.labelA2b_2);
                show(els.atomCProd_1);
                show(els.labelCProd_1);
                show(els.atomCProd_2);
                show(els.labelCProd_2);
                
                // 高亮生成物（绿色）
                [els.molA2b_1, els.molA2b_2].forEach(mol => {
                    mol.querySelectorAll('circle').forEach(c => c.style.fill = '#2e7d32');
                });
                [els.atomCProd_1, els.atomCProd_2].forEach(atom => {
                    atom.querySelector('circle').style.fill = '#2e7d32';
                });
                
                els.btnPrev.disabled = false;
                els.btnNext.disabled = true;
            }
        }
        
        // 上一步
        function prevStep() {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        }
        
        // 下一步
        function nextStep() {
            if (currentStep < TOTAL_STEPS - 1) {
                currentStep++;
                updateScene();
            }
        }
        
        // 绑定事件
        els.btnPrev.addEventListener('click', prevStep);
        els.btnNext.addEventListener('click', nextStep);
        
        // 初始化
        updateScene();
    })();
    </script>
</body>
</html>
