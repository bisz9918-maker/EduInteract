<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>化学气相传输提纯 Co</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-controls button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #333; border-radius: 4px; background: #f5f5f5; }
        #scene1-controls button:hover { background: #e0e0e0; }
        #scene1-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 14px; color: #333; min-width: 80px; text-align: center; }
        .option-text { font-size: 11px; fill: #333; }
        .option-correct { fill: #2e7d32 !important; font-weight: bold; }
        .option-incorrect { fill: #c62828 !important; font-weight: bold; }
        .highlight { stroke: #1565c0 !important; stroke-width: 3 !important; }
        .flow-arrow { stroke: #1565c0; stroke-width: 2; fill: none; }
        .flow-arrow-dashed { stroke: #1565c0; stroke-width: 2; fill: none; stroke-dasharray: 5,5; }
        .molecule { opacity: 0; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 容器 1 主体 -->
            <rect id="scene1-container1-body" x="150" y="180" width="170" height="100" fill="none" stroke="#000" stroke-width="2"/>
            <!-- 容器 1 左颈 -->
            <rect id="scene1-container1-left" x="130" y="220" width="20" height="40" fill="none" stroke="#000" stroke-width="2"/>
            <!-- 容器 1 右颈 -->
            <rect id="scene1-container1-right" x="320" y="220" width="20" height="40" fill="none" stroke="#000" stroke-width="2"/>
            
            <!-- 容器 2 主体 -->
            <rect id="scene1-container2-body" x="450" y="180" width="170" height="100" fill="none" stroke="#000" stroke-width="2"/>
            <!-- 容器 2 左颈 -->
            <rect id="scene1-container2-left" x="430" y="220" width="20" height="40" fill="none" stroke="#000" stroke-width="2"/>
            <!-- 容器 2 右颈 -->
            <rect id="scene1-container2-right" x="620" y="220" width="20" height="40" fill="none" stroke="#000" stroke-width="2"/>
            
            <!-- 连接管道 -->
            <rect id="scene1-connector-pipe" x="350" y="230" width="70" height="20" fill="none" stroke="#000" stroke-width="1.5"/>
            
            <!-- 气体入口箭头 -->
            <g id="scene1-arrow-inlet">
                <line x1="30" y1="235" x2="125" y2="235" stroke="#000" stroke-width="2"/>
                <polygon points="130,235 120,230 120,240" fill="#000"/>
            </g>
            
            <!-- 气体出口箭头 -->
            <g id="scene1-arrow-outlet">
                <line x1="640" y1="235" x2="735" y2="235" stroke="#000" stroke-width="2"/>
                <polygon points="740,235 730,230 730,240" fill="#000"/>
            </g>
            
            <!-- 容器 1 内固体点状图案 -->
            <g id="scene1-solid1">
                <rect x="160" y="200" width="150" height="60" fill="#e0e0e0" fill-opacity="0.2"/>
                <!-- 杂质点（橙色） -->
                <g id="scene1-impurity-dots" style="display:none;">
                    <circle cx="180" cy="215" r="3" fill="#ff5722"/>
                    <circle cx="200" cy="230" r="3" fill="#ff5722"/>
                    <circle cx="220" cy="220" r="3" fill="#ff5722"/>
                    <circle cx="240" cy="235" r="3" fill="#ff5722"/>
                    <circle cx="260" cy="225" r="3" fill="#ff5722"/>
                    <circle cx="280" cy="240" r="3" fill="#ff5722"/>
                    <circle cx="300" cy="215" r="3" fill="#ff5722"/>
                    <circle cx="190" cy="245" r="3" fill="#ff5722"/>
                    <circle cx="210" cy="250" r="3" fill="#ff5722"/>
                    <circle cx="230" cy="240" r="3" fill="#ff5722"/>
                    <circle cx="250" cy="255" r="3" fill="#ff5722"/>
                    <circle cx="270" cy="245" r="3" fill="#ff5722"/>
                    <circle cx="290" cy="250" r="3" fill="#ff5722"/>
                    <circle cx="175" cy="225" r="3" fill="#ff5722"/>
                    <circle cx="295" cy="230" r="3" fill="#ff5722"/>
                    <circle cx="205" cy="210" r="3" fill="#ff5722"/>
                    <circle cx="255" cy="210" r="3" fill="#ff5722"/>
                    <circle cx="285" cy="255" r="3" fill="#ff5722"/>
                    <circle cx="225" cy="255" r="3" fill="#ff5722"/>
                    <circle cx="245" cy="220" r="3" fill="#ff5722"/>
                </g>
            </g>
            
            <!-- 容器 2 内固体点状图案 -->
            <g id="scene1-solid2">
                <rect x="460" y="200" width="150" height="60" fill="#e0e0e0" fill-opacity="0.2"/>
                <!-- 纯净 Co 点（绿色） -->
                <g id="scene1-pure-co-dots" style="display:none;">
                    <circle cx="480" cy="215" r="3" fill="#4caf50"/>
                    <circle cx="500" cy="230" r="3" fill="#4caf50"/>
                    <circle cx="520" cy="220" r="3" fill="#4caf50"/>
                    <circle cx="540" cy="235" r="3" fill="#4caf50"/>
                    <circle cx="560" cy="225" r="3" fill="#4caf50"/>
                    <circle cx="580" cy="240" r="3" fill="#4caf50"/>
                    <circle cx="600" cy="215" r="3" fill="#4caf50"/>
                    <circle cx="490" cy="245" r="3" fill="#4caf50"/>
                    <circle cx="510" cy="250" r="3" fill="#4caf50"/>
                    <circle cx="530" cy="240" r="3" fill="#4caf50"/>
                    <circle cx="550" cy="255" r="3" fill="#4caf50"/>
                    <circle cx="570" cy="245" r="3" fill="#4caf50"/>
                    <circle cx="590" cy="250" r="3" fill="#4caf50"/>
                    <circle cx="475" cy="225" r="3" fill="#4caf50"/>
                    <circle cx="595" cy="230" r="3" fill="#4caf50"/>
                    <circle cx="505" cy="210" r="3" fill="#4caf50"/>
                    <circle cx="555" cy="210" r="3" fill="#4caf50"/>
                    <circle cx="585" cy="255" r="3" fill="#4caf50"/>
                    <circle cx="525" cy="255" r="3" fill="#4caf50"/>
                    <circle cx="545" cy="220" r="3" fill="#4caf50"/>
                </g>
            </g>
            
            <!-- 标签 -->
            <text id="scene1-label-container1" x="235" y="170" text-anchor="middle" font-size="14" fill="#333">容器 1</text>
            <text id="scene1-label-container2" x="535" y="170" text-anchor="middle" font-size="14" fill="#333">容器 2</text>
            <text id="scene1-label-solid1" x="235" y="305" text-anchor="middle" font-size="14" fill="#333">固体 X(Co+ 杂质)</text>
            <text id="scene1-label-solid2" x="535" y="305" text-anchor="middle" font-size="14" fill="#333">固体 X</text>
            <text id="scene1-label-inlet" x="75" y="215" text-anchor="middle" font-size="12" fill="#333">气体 Y(HCl) 进入</text>
            <text id="scene1-label-outlet" x="690" y="215" text-anchor="middle" font-size="12" fill="#333">气体 Y(HCl) 导出</text>
            
            <!-- 温度标签（初始隐藏） -->
            <text id="scene1-label-temp1" x="235" y="150" text-anchor="middle" font-size="14" fill="#333" style="display:none;">900℃</text>
            <text id="scene1-label-temp2" x="535" y="150" text-anchor="middle" font-size="14" fill="#333" style="display:none;">600℃</text>
            
            <!-- 反应式（初始隐藏） -->
            <text id="scene1-reaction-forward" x="235" y="335" text-anchor="middle" font-size="11" fill="#333" style="display:none;">Co(固)+2HCl(气)→CoCl₂(气)+H₂(气)</text>
            <text id="scene1-reaction-reverse" x="535" y="335" text-anchor="middle" font-size="11" fill="#333" style="display:none;">CoCl₂(气)+H₂(气)→Co(固)+2HCl(气)</text>
            
            <!-- 流向箭头（初始隐藏） -->
            <g id="scene1-arrow-flow1" style="display:none;">
                <line x1="320" y1="240" x2="430" y2="240" class="flow-arrow"/>
                <polygon points="435,240 425,235 425,245" class="flow-arrow"/>
                <text x="375" y="225" text-anchor="middle" font-size="9" fill="#1565c0">CoCl₂+H₂</text>
            </g>
            <g id="scene1-arrow-flow2" style="display:none;">
                <line x1="640" y1="240" x2="735" y2="240" class="flow-arrow-dashed"/>
                <polygon points="740,240 730,235 730,245" class="flow-arrow-dashed"/>
                <text x="705" y="232" text-anchor="middle" font-size="9" fill="#1565c0">HCl</text>
            </g>
            
            <!-- 气体分子动画（初始隐藏） -->
            <g id="scene1-molecules" style="display:none;">
                <!-- CoCl₂分子（蓝色） -->
                <circle id="scene1-mol-cocl2-1" class="molecule" cx="330" cy="240" r="5" fill="#1976d2"/>
                <circle id="scene1-mol-cocl2-2" class="molecule" cx="340" cy="235" r="5" fill="#1976d2"/>
                <circle id="scene1-mol-cocl2-3" class="molecule" cx="350" cy="245" r="5" fill="#1976d2"/>
                <!-- H₂分子（绿色） -->
                <circle id="scene1-mol-h2-1" class="molecule" cx="335" cy="245" r="4" fill="#388e3c"/>
                <circle id="scene1-mol-h2-2" class="molecule" cx="345" cy="238" r="4" fill="#388e3c"/>
                <!-- HCl 分子（灰色） -->
                <circle id="scene1-mol-hcl-1" class="molecule" cx="440" cy="240" r="4" fill="#757575"/>
                <circle id="scene1-mol-hcl-2" class="molecule" cx="450" cy="235" r="4" fill="#757575"/>
                <circle id="scene1-mol-hcl-3" class="molecule" cx="460" cy="245" r="4" fill="#757575"/>
            </g>
            
            <!-- 选项（初始隐藏）- 两行布局，每行 2 个选项 -->
            <g id="scene1-options" style="display:none;">
                <text id="scene1-option-a" class="option-text" x="25" y="380">A．固体 Co 从容器 1 到容器 2 的过程为物理变化</text>
                <text id="scene1-option-b" class="option-text" x="420" y="380">B．容器 2 中的固体是纯净的 Co</text>
                <text id="scene1-option-c" class="option-text" x="25" y="410">C．该装置最终导出的气体是 CoCl₂和 H₂</text>
                <text id="scene1-option-d" class="option-text" x="420" y="410">D．容器 1 为 900℃，容器 2 为 600℃</text>
                <!-- 判断标记 -->
                <text id="scene1-mark-a" style="display:none;" x="300" y="380" font-size="11" fill="#c62828">× 错</text>
                <text id="scene1-mark-b" style="display:none;" x="630" y="380" font-size="11" fill="#2e7d32">√ 对</text>
                <text id="scene1-mark-c" style="display:none;" x="300" y="410" font-size="11" fill="#c62828">× 错</text>
                <text id="scene1-mark-d" style="display:none;" x="630" y="410" font-size="11" fill="#2e7d32">√ 对</text>
            </g>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 0/5</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // 布局坐标表（实现对照依据）
        // 容器 1 主体：(150,180)-(320,280) | 容器 2 主体：(450,180)-(620,280)
        // 连接管道：(350,230)-(420,250)
        // 容器 1 标签：(235,170) | 容器 2 标签：(535,170)
        // 900℃标签：(235,150) | 600℃标签：(535,150)
        // 固体 X 标签：(235,305) 和 (535,305)
        // 反应式：(235,335) 和 (535,335)
        // 选项：第一行 (25,380), (420,380) | 第二行 (25,410), (420,410)
        
        const sceneId = 'scene1';
        let currentStep = 0;
        const totalSteps = 5;
        
        // 元素引用
        const elements = {
            // 容器
            container1Body: document.getElementById('scene1-container1-body'),
            container1Left: document.getElementById('scene1-container1-left'),
            container1Right: document.getElementById('scene1-container1-right'),
            container2Body: document.getElementById('scene1-container2-body'),
            container2Left: document.getElementById('scene1-container2-left'),
            container2Right: document.getElementById('scene1-container2-right'),
            connectorPipe: document.getElementById('scene1-connector-pipe'),
            // 箭头
            arrowInlet: document.getElementById('scene1-arrow-inlet'),
            arrowOutlet: document.getElementById('scene1-arrow-outlet'),
            arrowFlow1: document.getElementById('scene1-arrow-flow1'),
            arrowFlow2: document.getElementById('scene1-arrow-flow2'),
            // 固体
            solid1: document.getElementById('scene1-solid1'),
            solid2: document.getElementById('scene1-solid2'),
            impurityDots: document.getElementById('scene1-impurity-dots'),
            pureCoDots: document.getElementById('scene1-pure-co-dots'),
            // 标签
            labelContainer1: document.getElementById('scene1-label-container1'),
            labelContainer2: document.getElementById('scene1-label-container2'),
            labelSolid1: document.getElementById('scene1-label-solid1'),
            labelSolid2: document.getElementById('scene1-label-solid2'),
            labelInlet: document.getElementById('scene1-label-inlet'),
            labelOutlet: document.getElementById('scene1-label-outlet'),
            labelTemp1: document.getElementById('scene1-label-temp1'),
            labelTemp2: document.getElementById('scene1-label-temp2'),
            // 反应式
            reactionForward: document.getElementById('scene1-reaction-forward'),
            reactionReverse: document.getElementById('scene1-reaction-reverse'),
            // 分子动画
            molecules: document.getElementById('scene1-molecules'),
            // 选项
            options: document.getElementById('scene1-options'),
            optionA: document.getElementById('scene1-option-a'),
            optionB: document.getElementById('scene1-option-b'),
            optionC: document.getElementById('scene1-option-c'),
            optionD: document.getElementById('scene1-option-d'),
            markA: document.getElementById('scene1-mark-a'),
            markB: document.getElementById('scene1-mark-b'),
            markC: document.getElementById('scene1-mark-c'),
            markD: document.getElementById('scene1-mark-d'),
            // 控件
            btnPrev: document.getElementById('scene1-btn-prev'),
            btnNext: document.getElementById('scene1-btn-next'),
            stepIndicator: document.getElementById('scene1-step-indicator')
        };
        
        // 工具函数
        function show(el) {
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }
        
        function hide(el) {
            if (el) {
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }
        
        function highlight(el) {
            if (el) {
                el.classList.add('highlight');
            }
        }
        
        function removeHighlight(el) {
            if (el) {
                el.classList.remove('highlight');
            }
        }
        
        // 更新场景状态
        function updateScene() {
            // 重置所有高亮
            removeHighlight(elements.container1Body);
            removeHighlight(elements.container2Body);
            removeHighlight(elements.connectorPipe);
            
            // 步骤 0：基础装置
            show(elements.arrowInlet);
            show(elements.arrowOutlet);
            show(elements.solid1);
            show(elements.solid2);
            show(elements.labelContainer1);
            show(elements.labelContainer2);
            show(elements.labelSolid1);
            show(elements.labelSolid2);
            show(elements.labelInlet);
            show(elements.labelOutlet);
            
            // 步骤 1：+ 温度 1 + 反应式 1 + 高亮容器 1 + 杂质点
            if (currentStep >= 1) {
                show(elements.labelTemp1);
                show(elements.reactionForward);
                highlight(elements.container1Body);
                show(elements.impurityDots);
            }
            
            // 步骤 2：+ 流向箭头 1 + 气体动画
            if (currentStep >= 2) {
                show(elements.arrowFlow1);
                show(elements.connectorPipe);
                highlight(elements.connectorPipe);
                show(elements.molecules);
                animateMolecules();
            }
            
            // 步骤 3：+ 温度 2 + 反应式 2 + 高亮容器 2 + 纯净 Co 点
            if (currentStep >= 3) {
                show(elements.labelTemp2);
                show(elements.reactionReverse);
                highlight(elements.container2Body);
                show(elements.pureCoDots);
            }
            
            // 步骤 4：+ 流向箭头 2 + HCl 动画
            if (currentStep >= 4) {
                show(elements.arrowFlow2);
                show(elements.molecules);
            }
            
            // 步骤 5：+ 选项 + 判断标记
            if (currentStep >= 5) {
                show(elements.options);
                show(elements.markA);
                show(elements.markB);
                show(elements.markC);
                show(elements.markD);
                elements.optionA.classList.add('option-incorrect');
                elements.optionB.classList.add('option-correct');
                elements.optionC.classList.add('option-incorrect');
                elements.optionD.classList.add('option-correct');
            }
            
            // 更新按钮状态
            elements.btnPrev.disabled = (currentStep === 0);
            elements.btnNext.disabled = (currentStep === totalSteps);
            
            // 更新步骤指示器
            elements.stepIndicator.textContent = `步骤 ${currentStep}/${totalSteps}`;
        }
        
        // 分子动画
        let animationId = null;
        function animateMolecules() {
            if (animationId) {
                cancelAnimationFrame(animationId);
            }
            
            const molecules = [
                { el: document.getElementById('scene1-mol-cocl2-1'), start: 330, end: 460, speed: 2 },
                { el: document.getElementById('scene1-mol-cocl2-2'), start: 340, end: 470, speed: 2.2 },
                { el: document.getElementById('scene1-mol-cocl2-3'), start: 350, end: 480, speed: 1.8 },
                { el: document.getElementById('scene1-mol-h2-1'), start: 335, end: 465, speed: 2.1 },
                { el: document.getElementById('scene1-mol-h2-2'), start: 345, end: 475, speed: 1.9 },
                { el: document.getElementById('scene1-mol-hcl-1'), start: 440, end: 570, speed: 2 },
                { el: document.getElementById('scene1-mol-hcl-2'), start: 450, end: 580, speed: 2.2 },
                { el: document.getElementById('scene1-mol-hcl-3'), start: 460, end: 590, speed: 1.8 }
            ];
            
            molecules.forEach(m => {
                m.el.style.opacity = '1';
                m.pos = m.start;
            });
            
            function step() {
                molecules.forEach(m => {
                    if (m.pos < m.end) {
                        m.pos += m.speed;
                        m.el.setAttribute('cx', m.pos);
                    } else {
                        m.pos = m.start;
                    }
                });
                animationId = requestAnimationFrame(step);
            }
            step();
        }
        
        // 事件绑定
        elements.btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });
        
        elements.btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateScene();
            }
        });
        
        // 初始化
        updateScene();
    })();
    </script>
</body>
</html>
