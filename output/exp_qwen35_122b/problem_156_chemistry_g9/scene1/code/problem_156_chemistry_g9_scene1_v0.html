<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>化学反应微观示意图 - 反应前后分子变化分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border: 2px solid #1565c0;
            background: #ffffff;
            color: #1565c0;
            border-radius: 4px;
            transition: all 0.2s ease;
        }
        #scene1-controls button:hover {
            background: #1565c0;
            color: #ffffff;
        }
        #scene1-controls button:disabled {
            border-color: #ccc;
            color: #ccc;
            cursor: not-allowed;
            background: #f5f5f5;
        }
        .highlight-border { stroke: #1565c0; stroke-width: 3px !important; }
        .remaining-border { stroke: #c62828; stroke-width: 2px; stroke-dasharray: 5,5; }
        .product-fill { fill: #2e7d32; opacity: 0.2; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- 反应前方框 -->
            <rect id="scene1-box-left" x="80" y="60" width="240" height="240" fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 反应后方框 -->
            <rect id="scene1-box-right" x="480" y="60" width="240" height="240" fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 反应箭头 -->
            <defs>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
                </marker>
            </defs>
            <line id="scene1-arrow" x1="330" y1="180" x2="460" y2="180" stroke="#000000" stroke-width="3" marker-end="url(#scene1-arrowhead)"/>
            
            <!-- 反应前标签 -->
            <text id="scene1-label-left" x="200" y="330" text-anchor="middle" font-size="16" fill="#000000">反应前</text>
            
            <!-- 反应后标签 -->
            <text id="scene1-label-right" x="600" y="330" text-anchor="middle" font-size="16" fill="#000000">反应后</text>
            
            <!-- 反应前分子 -->
            <!-- A₂分子 1 (左上) - 参加反应 -->
            <g id="scene1-a2-1" class="scene1-molecule">
                <circle cx="120" cy="100" r="12" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                <circle cx="140" cy="100" r="12" fill="#ffffff" stroke="#000000" stroke-width="2"/>
            </g>
            <!-- A₂分子 2 (中上) - 参加反应 -->
            <g id="scene1-a2-2" class="scene1-molecule">
                <circle cx="220" cy="100" r="12" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                <circle cx="240" cy="100" r="12" fill="#ffffff" stroke="#000000" stroke-width="2"/>
            </g>
            <!-- A₂分子 3 (左下) - 剩余 -->
            <g id="scene1-a2-3" class="scene1-molecule">
                <circle cx="120" cy="200" r="12" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                <circle cx="140" cy="200" r="12" fill="#ffffff" stroke="#000000" stroke-width="2"/>
            </g>
            <!-- A₂分子 4 (右下) - 剩余 -->
            <g id="scene1-a2-4" class="scene1-molecule">
                <circle cx="260" cy="200" r="12" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                <circle cx="280" cy="200" r="12" fill="#ffffff" stroke="#000000" stroke-width="2"/>
            </g>
            <!-- B₂分子 (中央) - 参加反应 -->
            <g id="scene1-b2" class="scene1-molecule">
                <circle cx="190" cy="150" r="12" fill="#000000" stroke="#000000" stroke-width="2"/>
                <circle cx="210" cy="150" r="12" fill="#000000" stroke="#000000" stroke-width="2"/>
            </g>
            
            <!-- 反应后分子 (初始隐藏) -->
            <!-- AB₂分子 1 (左上) - 生成物 -->
            <g id="scene1-ab2-1" class="scene1-molecule" style="display: none;">
                <circle cx="520" cy="100" r="12" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                <circle cx="540" cy="100" r="12" fill="#000000" stroke="#000000" stroke-width="2"/>
                <circle cx="530" cy="120" r="12" fill="#ffffff" stroke="#000000" stroke-width="2"/>
            </g>
            <!-- AB₂分子 2 (右下) - 生成物 -->
            <g id="scene1-ab2-2" class="scene1-molecule" style="display: none;">
                <circle cx="660" cy="200" r="12" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                <circle cx="680" cy="200" r="12" fill="#000000" stroke="#000000" stroke-width="2"/>
                <circle cx="670" cy="220" r="12" fill="#ffffff" stroke="#000000" stroke-width="2"/>
            </g>
            <!-- A₂剩余 1 (左下) - 未反应 -->
            <g id="scene1-a2-remain-1" class="scene1-molecule" style="display: none;">
                <circle cx="520" cy="200" r="12" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                <circle cx="540" cy="200" r="12" fill="#ffffff" stroke="#000000" stroke-width="2"/>
            </g>
            <!-- A₂剩余 2 (右上) - 未反应 -->
            <g id="scene1-a2-remain-2" class="scene1-molecule" style="display: none;">
                <circle cx="620" cy="100" r="12" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                <circle cx="640" cy="100" r="12" fill="#ffffff" stroke="#000000" stroke-width="2"/>
            </g>
            
            <!-- 图例区 -->
            <g id="scene1-legend">
                <circle cx="100" cy="400" r="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                <text x="120" y="405" font-size="14" fill="#000000">A 原子</text>
                <circle cx="200" cy="400" r="10" fill="#000000" stroke="#000000" stroke-width="2"/>
                <text x="220" y="405" font-size="14" fill="#000000">B 原子</text>
            </g>
            
            <!-- 方程式和结论 (步骤 3 显示) -->
            <text id="scene1-equation" x="400" y="355" text-anchor="middle" font-size="18" fill="#000000" style="display: none;">2A₂ + B₂ → 2AB₂</text>
            <text id="scene1-conclusion" x="400" y="390" text-anchor="middle" font-size="16" fill="#000000" style="display: none;">化合反应：两种物质生成一种物质</text>
            
            <!-- 高亮边框层 (步骤 2 显示) -->
            <g id="scene1-highlights" style="display: none;">
                <!-- 参加反应的 A₂分子高亮边框 -->
                <rect id="scene1-highlight-a2-1" x="108" y="88" width="44" height="24" fill="none" stroke="#1565c0" stroke-width="3" style="display: none;"/>
                <rect id="scene1-highlight-a2-2" x="208" y="88" width="44" height="24" fill="none" stroke="#1565c0" stroke-width="3" style="display: none;"/>
                <!-- 参加反应的 B₂分子高亮边框 -->
                <rect id="scene1-highlight-b2" x="178" y="138" width="44" height="24" fill="none" stroke="#1565c0" stroke-width="3" style="display: none;"/>
                <!-- 剩余的 A₂分子虚线边框 -->
                <rect id="scene1-remain-a2-3" x="108" y="188" width="44" height="24" fill="none" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5" style="display: none;"/>
                <rect id="scene1-remain-a2-4" x="248" y="188" width="44" height="24" fill="none" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5" style="display: none;"/>
                <!-- 生成物 AB₂半透明填充 -->
                <rect id="scene1-product-fill-1" x="508" y="88" width="44" height="44" fill="#2e7d32" opacity="0.2" style="display: none;"/>
                <rect id="scene1-product-fill-2" x="648" y="188" width="44" height="44" fill="#2e7d32" opacity="0.2" style="display: none;"/>
                <!-- 剩余的 A₂分子虚线边框 (反应后) -->
                <rect id="scene1-remain-a2-r1" x="508" y="188" width="44" height="24" fill="none" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5" style="display: none;"/>
                <rect id="scene1-remain-a2-r2" x="608" y="88" width="44" height="24" fill="none" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5" style="display: none;"/>
            </g>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现 - 化学反应微观示意图
        // 布局坐标表对照：
        // | 元素 | 类型 | 位置/范围 | 大小 | 备注 |
        // |------|------|-----------|------|------|
        // | 反应前方框 | rect | (80,60)-(320,300) | 240×240 | 左侧容器 |
        // | 反应后方框 | rect | (480,60)-(720,300) | 240×240 | 右侧容器 |
        // | 反应箭头 | line | (330,180)-(460,180) | 130×3 | 中间连接 |
        // | 反应前标签 | text | (200,330) | - | 左框下方 |
        // | 反应后标签 | text | (600,330) | - | 右框下方 |
        // | A₂分子 1 | circle 组 | (120-140,100) | - | 左上，参加反应 |
        // | A₂分子 2 | circle 组 | (220-240,100) | - | 中上，参加反应 |
        // | A₂分子 3 | circle 组 | (120-140,200) | - | 左下，剩余 |
        // | A₂分子 4 | circle 组 | (260-280,200) | - | 右下，剩余 |
        // | B₂分子 | circle 组 | (190-210,150) | - | 中央，参加反应 |
        // | AB₂分子 1 | circle 组 | (520-540,100-120) | - | 左上，生成物 |
        // | AB₂分子 2 | circle 组 | (660-680,200-220) | - | 右下，生成物 |
        // | A₂剩余 1 | circle 组 | (520-540,200) | - | 左下，未反应 |
        // | A₂剩余 2 | circle 组 | (620-640,100) | - | 右上，未反应 |
        // | A 原子图例 | circle+text | (100,400) | - | 图例区 |
        // | B 原子图例 | circle+text | (200,400) | - | 图例区 |
        // | 方程式文本 | text | (400,355) | - | 步骤 3 显示 |
        // | 结论文本 | text | (400,390) | - | 步骤 3 显示 |
        
        const MAX_STEP = 3;
        let currentStep = 0;
        
        // 工具函数：显示元素
        function show(el) {
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }
        
        // 工具函数：隐藏元素
        function hide(el) {
            if (el) {
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }
        
        // 更新步骤显示
        function updateStep() {
            // 步骤 0: 只显示反应前
            // 步骤 1: 显示反应后分子
            // 步骤 2: 高亮实际反应分子
            // 步骤 3: 显示方程式和结论
            
            // 反应后分子 - 步骤 1 开始显示
            const showStep1 = currentStep >= 1;
            ['ab2-1', 'ab2-2', 'a2-remain-1', 'a2-remain-2'].forEach(id => {
                const el = document.getElementById('scene1-' + id);
                if (showStep1) show(el);
                else hide(el);
            });
            
            // 高亮效果 - 步骤 2 开始显示
            const showHighlights = currentStep >= 2;
            const highlightGroup = document.getElementById('scene1-highlights');
            if (showHighlights) {
                show(highlightGroup);
                // 显示所有高亮元素
                ['highlight-a2-1', 'highlight-a2-2', 'highlight-b2', 
                 'remain-a2-3', 'remain-a2-4', 'product-fill-1', 'product-fill-2',
                 'remain-a2-r1', 'remain-a2-r2'].forEach(id => {
                    show(document.getElementById('scene1-' + id));
                });
            } else {
                hide(highlightGroup);
            }
            
            // 方程式和结论 - 步骤 3 显示
            const showConclusion = currentStep >= 3;
            if (showConclusion) {
                show(document.getElementById('scene1-equation'));
                show(document.getElementById('scene1-conclusion'));
            } else {
                hide(document.getElementById('scene1-equation'));
                hide(document.getElementById('scene1-conclusion'));
            }
            
            // 更新按钮状态
            document.getElementById('scene1-btn-prev').disabled = (currentStep === 0);
            document.getElementById('scene1-btn-next').disabled = (currentStep === MAX_STEP);
        }
        
        // 按钮事件绑定
        document.getElementById('scene1-btn-prev').addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });
        
        document.getElementById('scene1-btn-next').addEventListener('click', function() {
            if (currentStep < MAX_STEP) {
                currentStep++;
                updateStep();
            }
        });
        
        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
