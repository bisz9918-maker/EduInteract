<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 3 - 高温煅烧 CaCO₃分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene3-btn {
            padding: 8px 20px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .scene3-btn-primary {
            background-color: #1565c0;
            color: white;
        }
        .scene3-btn-primary:hover:not(:disabled) {
            background-color: #0d47a1;
        }
        .scene3-btn:disabled {
            background-color: #bdbdbd;
            cursor: not-allowed;
        }
        svg { display: block; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg width="800" height="500" id="scene3-svg">
            <!-- 状态标题 - y 坐标 45 -->
            <text id="scene3-status-title" x="320" y="45" font-size="18" fill="#333" text-anchor="middle">原图曲线</text>

            <!-- 坐标系边框 -->
            <rect x="50" y="60" width="450" height="300" fill="none" stroke="#333" stroke-width="1"/>

            <!-- 横轴 -->
            <line x1="60" y1="350" x2="490" y2="350" stroke="#333" stroke-width="2"/>
            <!-- 横轴箭头 -->
            <polygon points="490,350 478,345 478,355" fill="#333"/>

            <!-- 纵轴 -->
            <line x1="60" y1="70" x2="60" y2="350" stroke="#333" stroke-width="2"/>
            <!-- 纵轴箭头 -->
            <polygon points="60,70 55,82 65,82" fill="#333"/>

            <!-- 横轴标签"时间" - 放在横轴右侧外部 -->
            <text x="470" y="375" font-size="14" fill="#333" text-anchor="middle">时间</text>

            <!-- 纵轴标签"固体质量/g"（垂直排列） - 调整 x 坐标到 40，避免裁剪 -->
            <text x="40" y="200" font-size="14" fill="#333" text-anchor="middle" transform="rotate(-90 40 200)">固体质量/g</text>

            <!-- 原点"0" -->
            <text x="45" y="355" font-size="12" fill="#333" text-anchor="middle">0</text>

            <!-- 曲线段①（水平）- 加热初期 -->
            <line id="scene3-curve-seg1" x1="80" y1="140" x2="190" y2="140" stroke="#1565c0" stroke-width="3" opacity="1"/>

            <!-- 曲线段②（下降）- 分解进行 -->
            <line id="scene3-curve-seg2" x1="190" y1="140" x2="330" y2="260" stroke="#1565c0" stroke-width="3" opacity="1"/>

            <!-- 曲线段③（水平）- 反应完成 -->
            <line id="scene3-curve-seg3" x1="330" y1="260" x2="460" y2="260" stroke="#1565c0" stroke-width="3" opacity="1"/>

            <!-- 阶段①标注框 - 文字放在框上方，框下移到 235 -->
            <rect id="scene3-stage1-box" x="120" y="235" width="60" height="30" fill="#f5f5f5" stroke="#888888" stroke-width="1" stroke-dasharray="4,2" opacity="0"/>
            <text id="scene3-stage1-text" x="150" y="230" font-size="12" fill="#333" opacity="0" text-anchor="middle">①加热初期</text>

            <!-- 阶段②标注框 - 文字放在框上方，框下移到 270 -->
            <rect id="scene3-stage2-box" x="250" y="270" width="80" height="35" fill="#f5f5f5" stroke="#888888" stroke-width="1" stroke-dasharray="4,2" opacity="0"/>
            <text id="scene3-stage2-text" x="290" y="265" font-size="12" fill="#333" opacity="0" text-anchor="middle">②分解进行</text>

            <!-- 阶段③标注框 - 文字放在框上方，框下移到 300 -->
            <rect id="scene3-stage3-box" x="360" y="300" width="80" height="30" fill="#f5f5f5" stroke="#888888" stroke-width="1" stroke-dasharray="4,2" opacity="0"/>
            <text id="scene3-stage3-text" x="400" y="295" font-size="12" fill="#333" opacity="0" text-anchor="middle">③反应完成</text>

            <!-- 化学方程式区域 - 放在右侧，y 起始 90，文字在框内居中 -->
            <rect id="scene3-equation-box" x="540" y="90" width="230" height="100" fill="#f9f9f9" stroke="#ddd" stroke-width="1" opacity="0"/>
            <text id="scene3-equation" x="655" y="135" font-size="14" fill="#333" opacity="0" text-anchor="middle">
                <tspan x="600" y="135">CaCO</tspan>
                <tspan baseline-shift="sub" font-size="10">3</tspan>
                <tspan x="645" y="135"> </tspan>
                <tspan x="660" y="135">△</tspan>
                <tspan x="680" y="135"> → </tspan>
                <tspan x="710" y="135">CaO + CO</tspan>
                <tspan baseline-shift="sub" font-size="10">2</tspan>
                <tspan x="775" y="135">↑</tspan>
            </text>

            <!-- CO₂逸出标注 - 放在方程式下方，y=155，x 左移避免重叠 -->
            <text id="scene3-co2-label" x="555" y="155" font-size="12" fill="#c62828" opacity="0">注：CO₂气体逸出</text>

            <!-- 正确标记"✓" - 调整位置 -->
            <text id="scene3-correct-mark" x="720" y="230" font-size="28" fill="#2e7d32" text-anchor="middle" opacity="0">✓</text>
        </svg>

        <!-- 控件栏 -->
        <div id="scene3-controls">
            <button id="scene3-btn-prev" class="scene3-btn scene3-btn-primary" disabled>◀ 上一步</button>
            <button id="scene3-btn-next" class="scene3-btn scene3-btn-primary">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 3 实现 - 高温煅烧 CaCO₃分析
        // 布局坐标表（实现对照依据）：
        // | 元素 | 位置/范围 | 备注 |
        // | 坐标系边框 | (50,60)-(500,360) | 450×300 |
        // | 横轴 | (60,350)-(490,350) | 带箭头向右 |
        // | 纵轴 | (60,70)-(60,350) | 带箭头向上 |
        // | 曲线段①（水平） | (80,140)-(190,140) | 加热初期，质量不变 |
        // | 曲线段②（下降） | (190,140)-(330,260) | 分解进行，质量减少 |
        // | 曲线段③（水平） | (330,260)-(460,260) | 反应完成，质量恒定 |
        // | 阶段①标注框 | (120,235)-(180,265) | 浅灰填充，虚线边框，文字在上方 |
        // | 阶段②标注框 | (250,270)-(330,305) | 浅灰填充，虚线边框，文字在上方 |
        // | 阶段③标注框 | (360,300)-(440,330) | 浅灰填充，虚线边框，文字在上方 |
        // | 化学方程式区域 | (540,90)-(770,190) | 右侧方程式展示区 |
        // | 正确标记"✓" | (720,230) | 绿色，表示正确选项 |

        // 状态机
        var currentState = 0;
        var totalStates = 5;

        // 元素引用
        var statusTitle = document.getElementById('scene3-status-title');
        var btnPrev = document.getElementById('scene3-btn-prev');
        var btnNext = document.getElementById('scene3-btn-next');

        // 曲线段
        var curveSeg1 = document.getElementById('scene3-curve-seg1');
        var curveSeg2 = document.getElementById('scene3-curve-seg2');
        var curveSeg3 = document.getElementById('scene3-curve-seg3');

        // 阶段标注
        var stage1Box = document.getElementById('scene3-stage1-box');
        var stage1Text = document.getElementById('scene3-stage1-text');
        var stage2Box = document.getElementById('scene3-stage2-box');
        var stage2Text = document.getElementById('scene3-stage2-text');
        var stage3Box = document.getElementById('scene3-stage3-box');
        var stage3Text = document.getElementById('scene3-stage3-text');

        // 化学方程式
        var equationBox = document.getElementById('scene3-equation-box');
        var equation = document.getElementById('scene3-equation');
        var co2Label = document.getElementById('scene3-co2-label');

        // 正确标记
        var correctMark = document.getElementById('scene3-correct-mark');

        // 工具函数：显示元素
        function show(el) {
            el.style.display = 'block';
            el.style.opacity = '1';
        }

        // 工具函数：隐藏元素
        function hide(el) {
            el.style.display = 'none';
            el.style.opacity = '0';
        }

        // 工具函数：高亮曲线段（加粗）
        function highlightSegment(segElement) {
            segElement.style.strokeWidth = '4';
        }

        // 工具函数：取消高亮
        function unhighlightSegment(segElement) {
            segElement.style.strokeWidth = '3';
        }

        // 更新显示状态
        function updateDisplay() {
            // 更新标题
            var titles = ['原图曲线', '化学方程式', '阶段 1 分析', '阶段 2 分析', '阶段 3 分析'];
            statusTitle.textContent = titles[currentState];

            // 重置所有曲线段高亮
            unhighlightSegment(curveSeg1);
            unhighlightSegment(curveSeg2);
            unhighlightSegment(curveSeg3);

            // 根据状态显示/隐藏元素
            switch(currentState) {
                case 0: // 原图曲线
                    hide(stage1Box);
                    hide(stage1Text);
                    hide(stage2Box);
                    hide(stage2Text);
                    hide(stage3Box);
                    hide(stage3Text);
                    hide(equationBox);
                    hide(equation);
                    hide(co2Label);
                    hide(correctMark);
                    break;

                case 1: // 化学方程式
                    hide(stage1Box);
                    hide(stage1Text);
                    hide(stage2Box);
                    hide(stage2Text);
                    hide(stage3Box);
                    hide(stage3Text);
                    show(equationBox);
                    show(equation);
                    hide(co2Label);
                    hide(correctMark);
                    break;

                case 2: // 阶段 1 分析
                    show(stage1Box);
                    show(stage1Text);
                    hide(stage2Box);
                    hide(stage2Text);
                    hide(stage3Box);
                    hide(stage3Text);
                    show(equationBox);
                    show(equation);
                    hide(co2Label);
                    hide(correctMark);
                    highlightSegment(curveSeg1);
                    break;

                case 3: // 阶段 2 分析
                    show(stage1Box);
                    show(stage1Text);
                    show(stage2Box);
                    show(stage2Text);
                    hide(stage3Box);
                    hide(stage3Text);
                    show(equationBox);
                    show(equation);
                    show(co2Label);
                    hide(correctMark);
                    highlightSegment(curveSeg2);
                    break;

                case 4: // 阶段 3 分析
                    show(stage1Box);
                    show(stage1Text);
                    show(stage2Box);
                    show(stage2Text);
                    show(stage3Box);
                    show(stage3Text);
                    show(equationBox);
                    show(equation);
                    show(co2Label);
                    show(correctMark);
                    highlightSegment(curveSeg3);
                    break;
            }

            // 更新按钮禁用状态
            btnPrev.disabled = (currentState === 0);
            btnNext.disabled = (currentState === totalStates - 1);
        }

        // 事件绑定
        btnPrev.addEventListener('click', function() {
            if (currentState > 0) {
                currentState--;
                updateDisplay();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentState < totalStates - 1) {
                currentState++;
                updateDisplay();
            }
        });

        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
