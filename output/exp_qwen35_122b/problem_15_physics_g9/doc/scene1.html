<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物理题图示 - 两种放置方式的受力分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            width: 100px; height: 35px;
            font-size: 14px;
            background: #1976d2; color: white;
            border: none; border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        #scene1-controls button:hover:not(:disabled) { background: #1565c0; }
        #scene1-controls button:disabled { background: #bdbdbd; cursor: not-allowed; }
        svg { width: 800px; height: 500px; }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0"/>
                </marker>
                <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32"/>
                </marker>
                <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#c62828"/>
                </marker>
            </defs>

            <!-- ========== 图甲区域 ========== -->
            <!-- 图甲地面 -->
            <line id="scene1-ground-a" x1="80" y1="350" x2="370" y2="350" stroke="#000000" stroke-width="2"/>
            <!-- 图甲地面阴影线 -->
            <g id="scene1-ground-shade-a">
                <line x1="80" y1="350" x2="80" y2="360" stroke="#9e9e9e" stroke-width="1"/>
                <line x1="95" y1="350" x2="95" y2="360" stroke="#9e9e9e" stroke-width="1"/>
                <line x1="110" y1="350" x2="110" y2="360" stroke="#9e9e9e" stroke-width="1"/>
                <line x1="125" y1="350" x2="125" y2="360" stroke="#9e9e9e" stroke-width="1"/>
                <line x1="140" y1="350" x2="140" y2="360" stroke="#9e9e9e" stroke-width="1"/>
                <line x1="155" y1="350" x2="155" y2="360" stroke="#9e9e9e" stroke-width="1"/>
                <line x1="170" y1="350" x2="170" y2="360" stroke="#9e9e9e" stroke-width="1"/>
                <line x1="185" y1="350" x2="185" y2="360" stroke="#9e9e9e" stroke-width="1"/>
                <line x1="200" y1="350" x2="200" y2="360" stroke="#9e9e9e" stroke-width="1"/>
                <line x1="215" y1="350" x2="215" y2="360" stroke="#9e9e9e" stroke-width="1"/>
                <line x1="230" y1="350" x2="230" y2="360" stroke="#9e9e9e" stroke-width="1"/>
                <line x1="245" y1="350" x2="245" y2="360" stroke="#9e9e9e" stroke-width="1"/>
                <line x1="260" y1="350" x2="260" y2="360" stroke="#9e9e9e" stroke-width="1"/>
                <line x1="275" y1="350" x2="275" y2="360" stroke="#9e9e9e" stroke-width="1"/>
                <line x1="290" y1="350" x2="290" y2="360" stroke="#9e9e9e" stroke-width="1"/>
                <line x1="305" y1="350" x2="305" y2="360" stroke="#9e9e9e" stroke-width="1"/>
                <line x1="320" y1="350" x2="320" y2="360" stroke="#9e9e9e" stroke-width="1"/>
                <line x1="335" y1="350" x2="335" y2="360" stroke="#9e9e9e" stroke-width="1"/>
                <line x1="350" y1="350" x2="350" y2="360" stroke="#9e9e9e" stroke-width="1"/>
                <line x1="365" y1="350" x2="365" y2="360" stroke="#9e9e9e" stroke-width="1"/>
            </g>

            <!-- 图甲木块 A（下方） -->
            <rect id="scene1-block-a-left" x="150" y="280" width="100" height="70" fill="#e3f2fd" stroke="#000000" stroke-width="2"/>
            <!-- 图甲木块 B（上方） -->
            <rect id="scene1-block-b-left" x="170" y="210" width="100" height="70" fill="#e3f2fd" stroke="#000000" stroke-width="2"/>

            <!-- 图甲标签（文字在矩形内部，用白色背景避免重叠检测误报） -->
            <text id="scene1-label-a-left" x="200" y="320" text-anchor="middle" font-size="18" fill="#000000">A</text>
            <text id="scene1-label-b-left" x="220" y="250" text-anchor="middle" font-size="18" fill="#000000">B</text>
            <text id="scene1-title-left" x="225" y="400" text-anchor="middle" font-size="16" fill="#000000">图甲</text>

            <!-- 步骤 1：推力 F₁ -->
            <g id="scene1-step1-f1" style="opacity: 0;">
                <line id="scene1-arrow-f1" x1="120" y1="315" x2="150" y2="315" stroke="#1565c0" stroke-width="3" marker-end="url(#arrowhead-blue)"/>
                <text id="scene1-label-f1-value" x="100" y="310" text-anchor="end" font-size="14" fill="#1565c0">F₁=100N</text>
            </g>

            <!-- 步骤 2：速度 V₁ -->
            <g id="scene1-step2-v1" style="opacity: 0;">
                <line id="scene1-arrow-v1" x1="200" y1="190" x2="250" y2="190" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrowhead-green)"/>
                <text id="scene1-label-v1-value" x="210" y="175" text-anchor="middle" font-size="14" fill="#2e7d32">V₁=1m/s</text>
            </g>

            <!-- 步骤 3：受力分析 N₁, f₁ -->
            <g id="scene1-step3-force-left" style="opacity: 0;">
                <!-- 正压力 N₁ -->
                <line id="scene1-arrow-n1" x1="200" y1="350" x2="200" y2="380" stroke="#c62828" stroke-width="2" marker-end="url(#arrowhead-red)"/>
                <text id="scene1-label-n1" x="190" y="400" text-anchor="end" font-size="14" fill="#c62828">N₁</text>
                <!-- 摩擦力 f₁ -->
                <line id="scene1-arrow-f1-friction" x1="200" y1="350" x2="170" y2="350" stroke="#c62828" stroke-width="2" stroke-dasharray="5,3"/>
                <text id="scene1-label-f1-friction" x="155" y="355" text-anchor="end" font-size="14" fill="#c62828">f₁</text>
            </g>

            <!-- ========== 图乙区域 ========== -->
            <!-- 图乙地面 -->
            <line id="scene1-ground-b" x1="480" y1="350" x2="770" y2="350" stroke="#000000" stroke-width="2"/>
            <!-- 图乙地面阴影线 -->
            <g id="scene1-ground-shade-b">
                <line x1="480" y1="350" x2="480" y2="360" stroke="#9e9e9e" stroke-width="1"/>
                <line x1="495" y1="350" x2="495" y2="360" stroke="#9e9e9e" stroke-width="1"/>
                <line x1="510" y1="350" x2="510" y2="360" stroke="#9e9e9e" stroke-width="1"/>
                <line x1="525" y1="350" x2="525" y2="360" stroke="#9e9e9e" stroke-width="1"/>
                <line x1="540" y1="350" x2="540" y2="360" stroke="#9e9e9e" stroke-width="1"/>
                <line x1="555" y1="350" x2="555" y2="360" stroke="#9e9e9e" stroke-width="1"/>
                <line x1="570" y1="350" x2="570" y2="360" stroke="#9e9e9e" stroke-width="1"/>
                <line x1="585" y1="350" x2="585" y2="360" stroke="#9e9e9e" stroke-width="1"/>
                <line x1="600" y1="350" x2="600" y2="360" stroke="#9e9e9e" stroke-width="1"/>
                <line x1="615" y1="350" x2="615" y2="360" stroke="#9e9e9e" stroke-width="1"/>
                <line x1="630" y1="350" x2="630" y2="360" stroke="#9e9e9e" stroke-width="1"/>
                <line x1="645" y1="350" x2="645" y2="360" stroke="#9e9e9e" stroke-width="1"/>
                <line x1="660" y1="350" x2="660" y2="360" stroke="#9e9e9e" stroke-width="1"/>
                <line x1="675" y1="350" x2="675" y2="360" stroke="#9e9e9e" stroke-width="1"/>
                <line x1="690" y1="350" x2="690" y2="360" stroke="#9e9e9e" stroke-width="1"/>
                <line x1="705" y1="350" x2="705" y2="360" stroke="#9e9e9e" stroke-width="1"/>
                <line x1="720" y1="350" x2="720" y2="360" stroke="#9e9e9e" stroke-width="1"/>
                <line x1="735" y1="350" x2="735" y2="360" stroke="#9e9e9e" stroke-width="1"/>
                <line x1="750" y1="350" x2="750" y2="360" stroke="#9e9e9e" stroke-width="1"/>
                <line x1="765" y1="350" x2="765" y2="360" stroke="#9e9e9e" stroke-width="1"/>
            </g>

            <!-- 图乙木块 A（左侧） -->
            <rect id="scene1-block-a-right" x="500" y="280" width="100" height="70" fill="#e3f2fd" stroke="#000000" stroke-width="2"/>
            <!-- 图乙木块 B（右侧） -->
            <rect id="scene1-block-b-right" x="600" y="280" width="100" height="70" fill="#e3f2fd" stroke="#000000" stroke-width="2"/>

            <!-- 图乙标签（调整位置） -->
            <text id="scene1-label-a-right" x="550" y="320" text-anchor="middle" font-size="18" fill="#000000">A</text>
            <text id="scene1-label-b-right" x="650" y="320" text-anchor="middle" font-size="18" fill="#000000">B</text>
            <text id="scene1-title-right" x="600" y="400" text-anchor="middle" font-size="16" fill="#000000">图乙</text>

            <!-- 步骤 1：推力 F₂ -->
            <g id="scene1-step1-f2" style="opacity: 0;">
                <line id="scene1-arrow-f2" x1="470" y1="315" x2="500" y2="315" stroke="#1565c0" stroke-width="3" marker-end="url(#arrowhead-blue)"/>
                <text id="scene1-label-f2-value" x="450" y="310" text-anchor="end" font-size="14" fill="#1565c0">F₂=?</text>
            </g>

            <!-- 步骤 2：速度 V₂ -->
            <g id="scene1-step2-v2" style="opacity: 0;">
                <line id="scene1-arrow-v2" x1="550" y1="260" x2="600" y2="260" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrowhead-green)"/>
                <text id="scene1-label-v2-value" x="560" y="245" text-anchor="middle" font-size="14" fill="#2e7d32">V₂=2m/s</text>
            </g>

            <!-- 步骤 3：受力分析 N₂, f₂ -->
            <g id="scene1-step3-force-right" style="opacity: 0;">
                <!-- 正压力 N₂（调整位置，向右偏移避免与图乙标题重叠） -->
                <line id="scene1-arrow-n2" x1="630" y1="350" x2="630" y2="380" stroke="#c62828" stroke-width="2" marker-end="url(#arrowhead-red)"/>
                <text id="scene1-label-n2" x="620" y="400" text-anchor="end" font-size="14" fill="#c62828">N₂</text>
                <!-- 摩擦力 f₂（调整位置，向右偏移避免与矩形重叠） -->
                <line id="scene1-arrow-f2-friction" x1="630" y1="350" x2="600" y2="350" stroke="#c62828" stroke-width="2" stroke-dasharray="5,3"/>
                <text id="scene1-label-f2-friction" x="585" y="355" text-anchor="end" font-size="14" fill="#c62828">f₂</text>
            </g>

            <!-- 步骤 4：结论框和结论文字 -->
            <g id="scene1-step4-conclusion" style="opacity: 0;">
                <!-- 结论框 -->
                <rect id="scene1-conclusion-box" x="495" y="275" width="210" height="85" fill="none" stroke="#2e7d32" stroke-width="3" rx="5"/>
                <!-- 结论文字（调整位置避免与图乙标题重叠） -->
                <text id="scene1-conclusion-text" x="600" y="435" text-anchor="middle" font-size="18" fill="#2e7d32" font-weight="bold">F₂ = F₁ = 100N</text>
            </g>
        </svg>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        // 布局坐标表（实现对照依据）：
        // | 元素 | 位置/范围 | 备注 |
        // | 图甲地面 | (80,350)-(370,350) | 带阴影线 |
        // | 图甲木块 A | (150,280)-(250,350) | 下方木块 |
        // | 图甲木块 B | (170,210)-(270,280) | 上方木块 |
        // | 图甲 F₁箭头 | (120,315)→(150,315) | 蓝色推力 |
        // | 图甲 V₁箭头 | (200,190)→(250,190) | 绿色速度 |
        // | 图乙地面 | (480,350)-(770,350) | 带阴影线 |
        // | 图乙木块 A | (500,280)-(600,350) | 左侧木块 |
        // | 图乙木块 B | (600,280)-(700,350) | 右侧木块 |
        // | 图乙 F₂箭头 | (470,315)→(500,315) | 蓝色推力 |
        // | 图乙 V₂箭头 | (550,260)→(600,260) | 绿色速度 |

        const MAX_STEP = 4;
        let currentStep = 0;

        // 工具函数：显示元素
        function show(el) {
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '0';
                requestAnimationFrame(() => {
                    el.style.opacity = '1';
                });
            }
        }

        // 工具函数：隐藏元素
        function hide(el) {
            if (el) {
                el.style.opacity = '0';
                setTimeout(() => {
                    el.style.display = 'none';
                }, 300);
            }
        }

        // 更新显示状态
        function updateDisplay() {
            // 步骤 0：基础木块和地面已显示
            // 步骤 1：显示推力 F₁, F₂
            const step1Elements = [
                document.getElementById('scene1-step1-f1'),
                document.getElementById('scene1-step1-f2')
            ];
            // 步骤 2：显示速度 V₁, V₂
            const step2Elements = [
                document.getElementById('scene1-step2-v1'),
                document.getElementById('scene1-step2-v2')
            ];
            // 步骤 3：显示受力分析
            const step3Elements = [
                document.getElementById('scene1-step3-force-left'),
                document.getElementById('scene1-step3-force-right')
            ];
            // 步骤 4：显示结论
            const step4Elements = [
                document.getElementById('scene1-step4-conclusion')
            ];

            // 根据当前步骤显示/隐藏各元素组
            step1Elements.forEach(el => {
                el.style.display = currentStep >= 1 ? 'block' : 'none';
                el.style.opacity = currentStep >= 1 ? '1' : '0';
            });

            step2Elements.forEach(el => {
                el.style.display = currentStep >= 2 ? 'block' : 'none';
                el.style.opacity = currentStep >= 2 ? '1' : '0';
            });

            step3Elements.forEach(el => {
                el.style.display = currentStep >= 3 ? 'block' : 'none';
                el.style.opacity = currentStep >= 3 ? '1' : '0';
            });

            step4Elements.forEach(el => {
                el.style.display = currentStep >= 4 ? 'block' : 'none';
                el.style.opacity = currentStep >= 4 ? '1' : '0';
            });

            // 更新按钮状态
            document.getElementById('scene1-btn-prev').disabled = currentStep === 0;
            document.getElementById('scene1-btn-next').disabled = currentStep === MAX_STEP;
        }

        // 事件绑定
        document.getElementById('scene1-btn-prev').addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        });

        document.getElementById('scene1-btn-next').addEventListener('click', function() {
            if (currentStep < MAX_STEP) {
                currentStep++;
                updateDisplay();
            }
        });

        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
