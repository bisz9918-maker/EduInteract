<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 滑动摩擦力公式推导</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene2-btn { padding: 8px 20px; font-size: 14px; background: #1565c0; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .scene2-btn:disabled { background: #90a4ae; cursor: not-allowed; }
        .scene2-btn:hover:not(:disabled) { background: #0d47a1; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" viewBox="0 0 800 500">
            <!-- 标题 -->
            <text x="400" y="22" font-size="16" fill="#000000" text-anchor="middle">滑动摩擦力公式推导</text>
            
            <!-- 滑动摩擦力公式 -->
            <text x="400" y="48" font-size="20" fill="#000000" text-anchor="middle">f = μN</text>
            
            <!-- 图甲区域框 -->
            <rect x="30" y="65" width="340" height="220" fill="none" stroke="#cccccc" stroke-width="1"/>
            <text x="195" y="55" font-size="14" fill="#000000" text-anchor="middle">图甲</text>
            
            <!-- 地面甲 -->
            <line x1="30" y1="275" x2="370" y2="275" stroke="#000000" stroke-width="2"/>
            <!-- 地面斜线阴影 -->
            <defs>
                <pattern id="scene2-hatch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
                    <line x1="0" y1="0" x2="0" y2="10" stroke="#000000" stroke-width="0.5"/>
                </pattern>
            </defs>
            <rect x="30" y="275" width="340" height="8" fill="url(#scene2-hatch)"/>
            
            <!-- 木块 A（甲）- 下层 -->
            <rect id="scene2-block-a-1" x="130" y="190" width="140" height="85" fill="#e3f2fd" stroke="#000000" stroke-width="2"/>
            <text x="200" y="232" font-size="20" fill="#000000" text-anchor="middle">A</text>
            
            <!-- 木块 B（甲）- 上层 -->
            <rect id="scene2-block-b-1" x="130" y="105" width="140" height="85" fill="#e3f2fd" stroke="#000000" stroke-width="2"/>
            <text x="200" y="147" font-size="20" fill="#000000" text-anchor="middle">B</text>
            
            <!-- F₁箭头（初始隐藏） -->
            <line id="scene2-arrow-f1" x1="50" y1="232" x2="130" y2="232" stroke="#1565c0" stroke-width="3" opacity="0"/>
            <polygon id="scene2-arrow-f1-head" points="130,232 120,227 120,237" fill="#1565c0" opacity="0"/>
            <text id="scene2-label-f1" x="90" y="215" font-size="12" fill="#1565c0" text-anchor="middle" opacity="0">F₁=100N</text>
            
            <!-- V₁箭头（初始隐藏） -->
            <line id="scene2-arrow-v1" x1="150" y1="90" x2="270" y2="90" stroke="#1565c0" stroke-width="3" opacity="0"/>
            <polygon id="scene2-arrow-v1-head" points="270,90 260,85 260,95" fill="#1565c0" opacity="0"/>
            <text id="scene2-label-v1" x="210" y="75" font-size="12" fill="#1565c0" text-anchor="middle" opacity="0">V₁=1m/s</text>
            
            <!-- N₁箭头（初始隐藏） -->
            <line id="scene2-arrow-n1" x1="200" y1="275" x2="200" y2="190" stroke="#c62828" stroke-width="2" opacity="0"/>
            <polygon id="scene2-arrow-n1-head" points="200,190 195,202 205,202" fill="#c62828" opacity="0"/>
            <text id="scene2-label-n1" x="218" y="232" font-size="12" fill="#c62828" opacity="0">N₁</text>
            
            <!-- f₁箭头（初始隐藏） -->
            <line id="scene2-arrow-f1-fric" x1="200" y1="275" x2="280" y2="275" stroke="#c62828" stroke-width="2" opacity="0"/>
            <polygon id="scene2-arrow-f1-fric-head" points="280,275 270,270 270,280" fill="#c62828" opacity="0"/>
            <text id="scene2-label-f1-fric" x="240" y="292" font-size="12" fill="#c62828" text-anchor="middle" opacity="0">f₁</text>
            
            <!-- 图乙区域框 -->
            <rect x="430" y="65" width="340" height="220" fill="none" stroke="#cccccc" stroke-width="1"/>
            <text x="595" y="55" font-size="14" fill="#000000" text-anchor="middle">图乙</text>
            
            <!-- 地面乙 -->
            <line x1="430" y1="275" x2="770" y2="275" stroke="#000000" stroke-width="2"/>
            <rect x="430" y="275" width="340" height="8" fill="url(#scene2-hatch)"/>
            
            <!-- 木块 A（乙） -->
            <rect id="scene2-block-a-2" x="480" y="190" width="140" height="85" fill="#e3f2fd" stroke="#000000" stroke-width="2"/>
            <text x="550" y="232" font-size="20" fill="#000000" text-anchor="middle">A</text>
            
            <!-- 木块 B（乙） -->
            <rect id="scene2-block-b-2" x="620" y="190" width="140" height="85" fill="#e3f2fd" stroke="#000000" stroke-width="2"/>
            <text x="690" y="232" font-size="20" fill="#000000" text-anchor="middle">B</text>
            
            <!-- F₂箭头（初始隐藏） -->
            <line id="scene2-arrow-f2" x1="460" y1="232" x2="480" y2="232" stroke="#1565c0" stroke-width="3" opacity="0"/>
            <polygon id="scene2-arrow-f2-head" points="480,232 470,227 470,237" fill="#1565c0" opacity="0"/>
            <text id="scene2-label-f2" x="470" y="215" font-size="12" fill="#1565c0" text-anchor="middle" opacity="0">F₂=?</text>
            
            <!-- V₂箭头（初始隐藏） -->
            <line id="scene2-arrow-v2" x1="550" y1="175" x2="690" y2="175" stroke="#1565c0" stroke-width="3" opacity="0"/>
            <polygon id="scene2-arrow-v2-head" points="690,175 680,170 680,180" fill="#1565c0" opacity="0"/>
            <text id="scene2-label-v2" x="620" y="160" font-size="12" fill="#1565c0" text-anchor="middle" opacity="0">V₂=2m/s</text>
            
            <!-- N₂箭头（初始隐藏） -->
            <line id="scene2-arrow-n2" x1="550" y1="275" x2="550" y2="190" stroke="#c62828" stroke-width="2" opacity="0"/>
            <polygon id="scene2-arrow-n2-head" points="550,190 545,202 555,202" fill="#c62828" opacity="0"/>
            <text id="scene2-label-n2" x="568" y="232" font-size="12" fill="#c62828" opacity="0">N₂</text>
            
            <!-- N₂'箭头（初始隐藏） -->
            <line id="scene2-arrow-n2p" x1="690" y1="275" x2="690" y2="190" stroke="#c62828" stroke-width="2" opacity="0"/>
            <polygon id="scene2-arrow-n2p-head" points="690,190 685,202 695,202" fill="#c62828" opacity="0"/>
            <text id="scene2-label-n2p" x="708" y="232" font-size="12" fill="#c62828" opacity="0">N₂'</text>
            
            <!-- f₂箭头（初始隐藏） -->
            <line id="scene2-arrow-f2-fric" x1="550" y1="275" x2="620" y2="275" stroke="#c62828" stroke-width="2" opacity="0"/>
            <polygon id="scene2-arrow-f2-fric-head" points="620,275 610,270 610,280" fill="#c62828" opacity="0"/>
            <text id="scene2-label-f2-fric" x="585" y="292" font-size="12" fill="#c62828" text-anchor="middle" opacity="0">f₂</text>
            
            <!-- f₂'箭头（初始隐藏） -->
            <line id="scene2-arrow-f2p-fric" x1="690" y1="275" x2="760" y2="275" stroke="#c62828" stroke-width="2" opacity="0"/>
            <polygon id="scene2-arrow-f2p-fric-head" points="760,275 750,270 750,280" fill="#c62828" opacity="0"/>
            <text id="scene2-label-f2p-fric" x="725" y="292" font-size="12" fill="#c62828" text-anchor="middle" opacity="0">f₂'</text>
            
            <!-- 推导区背景 -->
            <rect x="30" y="305" width="740" height="110" fill="#f5f5f5" stroke="#cccccc" stroke-width="1"/>
            
            <!-- 推导区等式链（逐步显示） -->
            <text id="scene2-eq-0" x="50" y="328" font-size="13" fill="#000000" opacity="0">匀速运动 → 推力 F = 摩擦力 f</text>
            <text id="scene2-eq-1" x="50" y="350" font-size="13" fill="#1565c0" font-weight="bold" opacity="0">图甲：匀速运动 → F₁ = f₁ = 100N</text>
            <text id="scene2-eq-2" x="50" y="372" font-size="13" fill="#000000" opacity="0">图甲正压力 N₁ = (m_A + m_B)g</text>
            <text id="scene2-eq-3" x="410" y="350" font-size="13" fill="#1565c0" font-weight="bold" opacity="0">图乙：匀速运动 → F₂ = f₂</text>
            <text id="scene2-eq-4" x="410" y="372" font-size="13" fill="#1565c0" font-weight="bold" opacity="0">图乙正压力 N₂ + N₂' = (m_A + m_B)g = N₁</text>
            <text id="scene2-eq-5a" x="50" y="328" font-size="13" fill="#000000" opacity="0">f = μN</text>
            <text id="scene2-eq-5b" x="50" y="350" font-size="13" fill="#000000" opacity="0">f₁ = μN₁ = 100N</text>
            <text id="scene2-eq-5c" x="50" y="372" font-size="13" fill="#000000" opacity="0">f₂ = μ(N₂ + N₂') = μN₁ = f₁ = 100N</text>
            <text id="scene2-eq-5d" x="410" y="372" font-size="14" fill="#2e7d32" font-weight="bold" opacity="0">→ F₂ = f₂ = 100N</text>
            
            <!-- 结论框（初始隐藏） -->
            <rect id="scene2-conclusion-box" x="280" y="415" width="240" height="50" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3" opacity="0"/>
            <text id="scene2-conclusion-text" x="400" y="440" font-size="18" fill="#2e7d32" font-weight="bold" text-anchor="middle" opacity="0">F₂ = 100N (选项 B)</text>
            
            <!-- N₁ = N₂ + N₂' 连接标注（最终步骤显示） -->
            <line id="scene2-connect-line" x1="200" y1="290" x2="600" y2="290" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5,5" opacity="0"/>
            <text id="scene2-connect-label" x="400" y="305" font-size="12" fill="#2e7d32" text-anchor="middle" opacity="0">N₁ = N₂ + N₂'</text>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-prev-btn" class="scene2-btn" disabled>◀ 上一步</button>
            <button id="scene2-next-btn" class="scene2-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现 - 滑动摩擦力公式推导
        
        const currentStepMax = 5;
        let currentStep = 0;
        
        // 元素显示/隐藏工具函数
        function show(elId) {
            const el = document.getElementById(elId);
            if (el) {
                el.style.opacity = '1';
                el.style.display = 'block';
            }
        }
        
        function hide(elId) {
            const el = document.getElementById(elId);
            if (el) {
                el.style.opacity = '0';
                el.style.display = 'none';
            }
        }
        
        // 更新场景显示
        function updateScene() {
            // 重置所有动态元素
            const dynamicElements = [
                'scene2-arrow-f1', 'scene2-arrow-f1-head', 'scene2-label-f1',
                'scene2-arrow-v1', 'scene2-arrow-v1-head', 'scene2-label-v1',
                'scene2-arrow-n1', 'scene2-arrow-n1-head', 'scene2-label-n1',
                'scene2-arrow-f1-fric', 'scene2-arrow-f1-fric-head', 'scene2-label-f1-fric',
                'scene2-arrow-f2', 'scene2-arrow-f2-head', 'scene2-label-f2',
                'scene2-arrow-v2', 'scene2-arrow-v2-head', 'scene2-label-v2',
                'scene2-arrow-n2', 'scene2-arrow-n2-head', 'scene2-label-n2',
                'scene2-arrow-n2p', 'scene2-arrow-n2p-head', 'scene2-label-n2p',
                'scene2-arrow-f2-fric', 'scene2-arrow-f2-fric-head', 'scene2-label-f2-fric',
                'scene2-arrow-f2p-fric', 'scene2-arrow-f2p-fric-head', 'scene2-label-f2p-fric',
                'scene2-eq-0', 'scene2-eq-1', 'scene2-eq-2', 'scene2-eq-3', 'scene2-eq-4',
                'scene2-eq-5a', 'scene2-eq-5b', 'scene2-eq-5c', 'scene2-eq-5d',
                'scene2-conclusion-box', 'scene2-conclusion-text',
                'scene2-connect-line', 'scene2-connect-label'
            ];
            dynamicElements.forEach(id => hide(id));
            
            // 根据当前步骤显示对应元素
            switch(currentStep) {
                case 0:
                    show('scene2-eq-0');
                    break;
                case 1:
                    show('scene2-eq-0');
                    show('scene2-arrow-f1');
                    show('scene2-arrow-f1-head');
                    show('scene2-label-f1');
                    show('scene2-arrow-v1');
                    show('scene2-arrow-v1-head');
                    show('scene2-label-v1');
                    show('scene2-eq-1');
                    break;
                case 2:
                    show('scene2-eq-0');
                    show('scene2-arrow-f1');
                    show('scene2-arrow-f1-head');
                    show('scene2-label-f1');
                    show('scene2-arrow-v1');
                    show('scene2-arrow-v1-head');
                    show('scene2-label-v1');
                    show('scene2-arrow-n1');
                    show('scene2-arrow-n1-head');
                    show('scene2-label-n1');
                    show('scene2-arrow-f1-fric');
                    show('scene2-arrow-f1-fric-head');
                    show('scene2-label-f1-fric');
                    show('scene2-eq-1');
                    show('scene2-eq-2');
                    break;
                case 3:
                    show('scene2-eq-0');
                    show('scene2-arrow-f1');
                    show('scene2-arrow-f1-head');
                    show('scene2-label-f1');
                    show('scene2-arrow-v1');
                    show('scene2-arrow-v1-head');
                    show('scene2-label-v1');
                    show('scene2-arrow-n1');
                    show('scene2-arrow-n1-head');
                    show('scene2-label-n1');
                    show('scene2-arrow-f1-fric');
                    show('scene2-arrow-f1-fric-head');
                    show('scene2-label-f1-fric');
                    show('scene2-arrow-f2');
                    show('scene2-arrow-f2-head');
                    show('scene2-label-f2');
                    show('scene2-arrow-v2');
                    show('scene2-arrow-v2-head');
                    show('scene2-label-v2');
                    show('scene2-eq-1');
                    show('scene2-eq-2');
                    show('scene2-eq-3');
                    break;
                case 4:
                    show('scene2-eq-0');
                    show('scene2-arrow-f1');
                    show('scene2-arrow-f1-head');
                    show('scene2-label-f1');
                    show('scene2-arrow-v1');
                    show('scene2-arrow-v1-head');
                    show('scene2-label-v1');
                    show('scene2-arrow-n1');
                    show('scene2-arrow-n1-head');
                    show('scene2-label-n1');
                    show('scene2-arrow-f1-fric');
                    show('scene2-arrow-f1-fric-head');
                    show('scene2-label-f1-fric');
                    show('scene2-arrow-f2');
                    show('scene2-arrow-f2-head');
                    show('scene2-label-f2');
                    show('scene2-arrow-v2');
                    show('scene2-arrow-v2-head');
                    show('scene2-label-v2');
                    show('scene2-arrow-n2');
                    show('scene2-arrow-n2-head');
                    show('scene2-label-n2');
                    show('scene2-arrow-n2p');
                    show('scene2-arrow-n2p-head');
                    show('scene2-label-n2p');
                    show('scene2-arrow-f2-fric');
                    show('scene2-arrow-f2-fric-head');
                    show('scene2-label-f2-fric');
                    show('scene2-arrow-f2p-fric');
                    show('scene2-arrow-f2p-fric-head');
                    show('scene2-label-f2p-fric');
                    show('scene2-eq-1');
                    show('scene2-eq-2');
                    show('scene2-eq-3');
                    show('scene2-eq-4');
                    break;
                case 5:
                    show('scene2-eq-5a');
                    show('scene2-eq-5b');
                    show('scene2-eq-5c');
                    show('scene2-eq-5d');
                    show('scene2-conclusion-box');
                    show('scene2-conclusion-text');
                    show('scene2-connect-line');
                    show('scene2-connect-label');
                    // 保留图甲和图乙的基本元素
                    show('scene2-arrow-f1');
                    show('scene2-arrow-f1-head');
                    show('scene2-label-f1');
                    show('scene2-arrow-n1');
                    show('scene2-arrow-n1-head');
                    show('scene2-label-n1');
                    show('scene2-arrow-f1-fric');
                    show('scene2-arrow-f1-fric-head');
                    show('scene2-label-f1-fric');
                    show('scene2-arrow-f2');
                    show('scene2-arrow-f2-head');
                    show('scene2-label-f2');
                    show('scene2-arrow-n2');
                    show('scene2-arrow-n2-head');
                    show('scene2-label-n2');
                    show('scene2-arrow-n2p');
                    show('scene2-arrow-n2p-head');
                    show('scene2-label-n2p');
                    show('scene2-arrow-f2-fric');
                    show('scene2-arrow-f2-fric-head');
                    show('scene2-label-f2-fric');
                    show('scene2-arrow-f2p-fric');
                    show('scene2-arrow-f2p-fric-head');
                    show('scene2-label-f2p-fric');
                    break;
            }
            
            // 更新按钮状态
            const prevBtn = document.getElementById('scene2-prev-btn');
            const nextBtn = document.getElementById('scene2-next-btn');
            prevBtn.disabled = (currentStep === 0);
            nextBtn.disabled = (currentStep === currentStepMax);
        }
        
        // 按钮事件绑定
        document.getElementById('scene2-prev-btn').addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });
        
        document.getElementById('scene2-next-btn').addEventListener('click', function() {
            if (currentStep < currentStepMax) {
                currentStep++;
                updateScene();
            }
        });
        
        // 初始化
        updateScene();
    })();
    </script>
</body>
</html>
