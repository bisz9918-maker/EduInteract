<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三角形的高 - 教学图示</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            padding: 8px 20px;
            font-size: 14px;
            border: 2px solid #1565c0;
            border-radius: 6px;
            background: #ffffff;
            color: #1565c0;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        #scene1-controls button:hover:not(:disabled) {
            background: #1565c0;
            color: #ffffff;
        }
        #scene1-controls button:disabled {
            border-color: #bdbdbd;
            color: #bdbdbd;
            cursor: not-allowed;
        }
        .scene1-option-box {
            fill: #e0e0e0;
            stroke: #9e9e9e;
            stroke-width: 1;
            transition: all 0.3s ease;
        }
        .scene1-option-text {
            font-size: 14px;
            fill: #333333;
        }
        .scene1-mark {
            font-size: 20px;
            font-weight: bold;
        }
        .scene1-mark-correct {
            fill: #2e7d32;
        }
        .scene1-mark-wrong {
            fill: #c62828;
        }
        .scene1-triangle {
            stroke: #000000;
            stroke-width: 2;
            fill: none;
        }
        .scene1-ab-edge {
            stroke: #1565c0;
            stroke-width: 3;
            transition: all 0.3s ease;
        }
        .scene1-height {
            stroke: #2e7d32;
            stroke-width: 3;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .scene1-interference {
            stroke: #c62828;
            stroke-width: 2;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .scene1-extend-line {
            stroke: #888888;
            stroke-width: 1;
            stroke-dasharray: 5,5;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .scene1-vertex {
            fill: #000000;
        }
        .scene1-label {
            font-size: 14px;
            fill: #000000;
        }
        .scene1-right-angle {
            stroke: #000000;
            stroke-width: 1;
            fill: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .scene1-conclusion {
            font-size: 16px;
            fill: #1565c0;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .scene1-prompt {
            font-size: 14px;
            fill: #1565c0;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .scene1-height-label {
            font-size: 14px;
            fill: #2e7d32;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500">
            <!-- 主图形区 (50,50)-(550,400) -->
            
            <!-- AB 延长线 (步骤 1 显示) -->
            <line id="scene1-extend-line" class="scene1-extend-line" x1="250" y1="350" x2="400" y2="350"/>
            
            <!-- 三角形 ABC -->
            <line id="scene1-tri-ab" class="scene1-triangle scene1-ab-edge" x1="100" y1="350" x2="250" y2="350"/>
            <line id="scene1-tri-bc" class="scene1-triangle" x1="250" y1="350" x2="400" y2="150"/>
            <line id="scene1-tri-ac" class="scene1-triangle" x1="100" y1="350" x2="400" y2="150"/>
            
            <!-- 高 CD (步骤 2 显示) -->
            <line id="scene1-height-cd" class="scene1-height" x1="400" y1="150" x2="400" y2="350"/>
            
            <!-- 干扰线段 EB (步骤 2 显示) -->
            <line id="scene1-interference-eb" class="scene1-interference" x1="250" y1="250" x2="250" y2="350"/>
            
            <!-- 直角符号 (步骤 2 显示) -->
            <polyline id="scene1-right-angle" class="scene1-right-angle" points="385,335 400,350 400,335"/>
            
            <!-- 顶点 A -->
            <circle id="scene1-vertex-a" class="scene1-vertex" cx="100" cy="350" r="4"/>
            <!-- 顶点 B -->
            <circle id="scene1-vertex-b" class="scene1-vertex" cx="250" cy="350" r="4"/>
            <!-- 顶点 C -->
            <circle id="scene1-vertex-c" class="scene1-vertex" cx="400" cy="150" r="4"/>
            <!-- 顶点 D (步骤 1 显示) -->
            <circle id="scene1-vertex-d" class="scene1-vertex" cx="400" cy="350" r="4" opacity="0"/>
            <!-- 顶点 E (步骤 2 显示) -->
            <circle id="scene1-vertex-e" class="scene1-vertex" cx="250" cy="250" r="4" opacity="0"/>
            
            <!-- 标签 A -->
            <text id="scene1-label-a" class="scene1-label" x="85" y="365">A</text>
            <!-- 标签 B -->
            <text id="scene1-label-b" class="scene1-label" x="245" y="370">B</text>
            <!-- 标签 C -->
            <text id="scene1-label-c" class="scene1-label" x="415" y="145">C</text>
            <!-- 标签 D (步骤 1 显示) -->
            <text id="scene1-label-d" class="scene1-label" x="415" y="365" opacity="0">D</text>
            <!-- 标签 E (步骤 2 显示) -->
            <text id="scene1-label-e" class="scene1-label" x="235" y="245" opacity="0">E</text>
            
            <!-- AB 边提示文字 (步骤 1 显示) -->
            <text id="scene1-prompt-ab" class="scene1-prompt" x="150" y="385">AB 边所在直线</text>
            
            <!-- 高标注 (步骤 3 显示) -->
            <text id="scene1-height-label" class="scene1-height-label" x="420" y="220">高</text>
            
            <!-- 结论文字 (步骤 4 显示) -->
            <text id="scene1-conclusion" class="scene1-conclusion" x="200" y="420">正确答案：B．CD</text>
            
            <!-- 选项区 (580,100)-(780,380) -->
            <!-- 选项 1: A.CB -->
            <rect id="scene1-option1-box" class="scene1-option-box" x="580" y="100" width="200" height="60"/>
            <text id="scene1-option1-text" class="scene1-option-text" x="600" y="130">A．CB</text>
            <text id="scene1-option1-mark" class="scene1-mark scene1-mark-wrong" x="760" y="130" opacity="0">✗</text>
            
            <!-- 选项 2: B.CD -->
            <rect id="scene1-option2-box" class="scene1-option-box" x="580" y="170" width="200" height="60"/>
            <text id="scene1-option2-text" class="scene1-option-text" x="600" y="200">B．CD</text>
            <text id="scene1-option2-mark" class="scene1-mark scene1-mark-correct" x="760" y="200" opacity="0">✓</text>
            
            <!-- 选项 3: C.EB -->
            <rect id="scene1-option3-box" class="scene1-option-box" x="580" y="240" width="200" height="60"/>
            <text id="scene1-option3-text" class="scene1-option-text" x="600" y="270">C．EB</text>
            <text id="scene1-option3-mark" class="scene1-mark scene1-mark-wrong" x="760" y="270" opacity="0">✗</text>
        </svg>
        
        <!-- 控件区 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现
        // 布局坐标表对照：
        // | 元素 | 位置/范围 | 备注 |
        // | A 点 | (100,350) | 顶点 |
        // | B 点 | (250,350) | 顶点 |
        // | C 点 | (400,150) | 顶点 |
        // | D 点 | (400,350) | 垂足 |
        // | E 点 | (250,250) | 辅助点 |
        // | 线段 AB | (100,350)-(250,350) | 三角形底边 |
        // | 线段 BC | (250,350)-(400,150) | 三角形斜边 |
        // | 线段 AC | (100,350)-(400,150) | 三角形斜边 |
        // | 线段 CD | (400,150)-(400,350) | 高（垂线段） |
        // | 线段 EB | (250,250)-(250,350) | 干扰线段 |
        
        const scene1 = {
            currentStep: 0,
            totalSteps: 4,
            
            elements: {
                // 图形元素
                extendLine: document.getElementById('scene1-extend-line'),
                triAb: document.getElementById('scene1-tri-ab'),
                triBc: document.getElementById('scene1-tri-bc'),
                triAc: document.getElementById('scene1-tri-ac'),
                heightCd: document.getElementById('scene1-height-cd'),
                interferenceEb: document.getElementById('scene1-interference-eb'),
                rightAngle: document.getElementById('scene1-right-angle'),
                
                // 顶点
                vertexA: document.getElementById('scene1-vertex-a'),
                vertexB: document.getElementById('scene1-vertex-b'),
                vertexC: document.getElementById('scene1-vertex-c'),
                vertexD: document.getElementById('scene1-vertex-d'),
                vertexE: document.getElementById('scene1-vertex-e'),
                
                // 标签
                labelA: document.getElementById('scene1-label-a'),
                labelB: document.getElementById('scene1-label-b'),
                labelC: document.getElementById('scene1-label-c'),
                labelD: document.getElementById('scene1-label-d'),
                labelE: document.getElementById('scene1-label-e'),
                
                // 提示文字
                promptAb: document.getElementById('scene1-prompt-ab'),
                heightLabel: document.getElementById('scene1-height-label'),
                conclusion: document.getElementById('scene1-conclusion'),
                
                // 选项标记
                option1Mark: document.getElementById('scene1-option1-mark'),
                option2Mark: document.getElementById('scene1-option2-mark'),
                option3Mark: document.getElementById('scene1-option3-mark'),
                
                // 按钮
                btnPrev: document.getElementById('scene1-btn-prev'),
                btnNext: document.getElementById('scene1-btn-next')
            },
            
            // 工具函数：显示元素
            show: function(el) {
                if (el) {
                    el.style.display = 'block';
                    el.style.opacity = '1';
                    el.setAttribute('opacity', '1');
                }
            },
            
            // 工具函数：隐藏元素
            hide: function(el) {
                if (el) {
                    el.style.display = 'none';
                    el.style.opacity = '0';
                    el.setAttribute('opacity', '0');
                }
            },
            
            // 工具函数：设置元素可见性（SVG 用 opacity 属性）
            setVisibility: function(el, visible) {
                if (el) {
                    if (visible) {
                        el.style.opacity = '1';
                        el.setAttribute('opacity', '1');
                    } else {
                        el.style.opacity = '0';
                        el.setAttribute('opacity', '0');
                    }
                }
            },
            
            // 更新场景状态
            updateScene: function() {
                const el = this.elements;
                
                // 重置所有动态元素
                this.setVisibility(el.extendLine, false);
                this.setVisibility(el.heightCd, false);
                this.setVisibility(el.interferenceEb, false);
                this.setVisibility(el.rightAngle, false);
                this.setVisibility(el.vertexD, false);
                this.setVisibility(el.vertexE, false);
                this.setVisibility(el.labelD, false);
                this.setVisibility(el.labelE, false);
                this.setVisibility(el.promptAb, false);
                this.setVisibility(el.heightLabel, false);
                this.setVisibility(el.conclusion, false);
                this.setVisibility(el.option1Mark, false);
                this.setVisibility(el.option2Mark, false);
                this.setVisibility(el.option3Mark, false);
                
                // 重置 AB 边高亮
                el.triAb.classList.remove('scene1-ab-edge');
                
                // 根据步骤设置显示状态
                switch(this.currentStep) {
                    case 0:
                        // 初始状态：只显示三角形 ABC 和选项
                        break;
                        
                    case 1:
                        // 高亮 AB 边，显示延长线和 D 点
                        el.triAb.classList.add('scene1-ab-edge');
                        this.setVisibility(el.extendLine, true);
                        this.setVisibility(el.vertexD, true);
                        this.setVisibility(el.labelD, true);
                        this.setVisibility(el.promptAb, true);
                        break;
                        
                    case 2:
                        // 显示高 CD 和干扰线段 EB
                        el.triAb.classList.add('scene1-ab-edge');
                        this.setVisibility(el.extendLine, true);
                        this.setVisibility(el.vertexD, true);
                        this.setVisibility(el.labelD, true);
                        this.setVisibility(el.heightCd, true);
                        this.setVisibility(el.rightAngle, true);
                        this.setVisibility(el.interferenceEb, true);
                        this.setVisibility(el.vertexE, true);
                        this.setVisibility(el.labelE, true);
                        break;
                        
                    case 3:
                        // 标注"高"字
                        el.triAb.classList.add('scene1-ab-edge');
                        this.setVisibility(el.extendLine, true);
                        this.setVisibility(el.vertexD, true);
                        this.setVisibility(el.labelD, true);
                        this.setVisibility(el.heightCd, true);
                        this.setVisibility(el.rightAngle, true);
                        this.setVisibility(el.interferenceEb, true);
                        this.setVisibility(el.vertexE, true);
                        this.setVisibility(el.labelE, true);
                        this.setVisibility(el.heightLabel, true);
                        break;
                        
                    case 4:
                        // 最终状态：显示答案和标记
                        el.triAb.classList.add('scene1-ab-edge');
                        this.setVisibility(el.extendLine, true);
                        this.setVisibility(el.vertexD, true);
                        this.setVisibility(el.labelD, true);
                        this.setVisibility(el.heightCd, true);
                        this.setVisibility(el.rightAngle, true);
                        this.setVisibility(el.interferenceEb, true);
                        this.setVisibility(el.vertexE, true);
                        this.setVisibility(el.labelE, true);
                        this.setVisibility(el.heightLabel, true);
                        this.setVisibility(el.conclusion, true);
                        this.setVisibility(el.option1Mark, true);
                        this.setVisibility(el.option2Mark, true);
                        this.setVisibility(el.option3Mark, true);
                        break;
                }
                
                // 更新按钮状态
                el.btnPrev.disabled = (this.currentStep === 0);
                if (this.currentStep === this.totalSteps) {
                    el.btnNext.textContent = '完成';
                    el.btnNext.disabled = true;
                } else {
                    el.btnNext.textContent = '下一步 ▶';
                    el.btnNext.disabled = false;
                }
            },
            
            // 下一步
            nextStep: function() {
                if (this.currentStep < this.totalSteps) {
                    this.currentStep++;
                    this.updateScene();
                }
            },
            
            // 上一步
            prevStep: function() {
                if (this.currentStep > 0) {
                    this.currentStep--;
                    this.updateScene();
                }
            },
            
            // 初始化
            init: function() {
                el.btnPrev.addEventListener('click', () => this.prevStep());
                el.btnNext.addEventListener('click', () => this.nextStep());
                this.updateScene();
            }
        };
        
        // 启动场景
        scene1.init();
    })();
    </script>
</body>
</html>
