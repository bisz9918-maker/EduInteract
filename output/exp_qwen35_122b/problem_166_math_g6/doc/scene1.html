<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 1 - 三个图形面积比较</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; gap: 20px; z-index: 10; }
        .scene1-btn { padding: 10px 20px; font-size: 14px; border: none; border-radius: 5px; cursor: pointer; transition: background-color 0.3s; }
        .scene1-btn:disabled { background-color: #cccccc; cursor: not-allowed; }
        .scene1-btn:not(:disabled) { background-color: #1565c0; color: white; }
        .scene1-btn:not(:disabled):hover { background-color: #0d47a1; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 上平行线 -->
            <line x1="100" y1="150" x2="700" y2="150" stroke="#000000" stroke-width="2"/>
            <!-- 下平行线 -->
            <line x1="100" y1="350" x2="700" y2="350" stroke="#000000" stroke-width="2"/>
            
            <!-- 上刻度线及数字 -->
            <line x1="100" y1="140" x2="100" y2="160" stroke="#000000" stroke-width="2"/>
            <text x="100" y="130" text-anchor="middle" font-size="14" fill="#000000">0</text>
            <line x1="220" y1="140" x2="220" y2="160" stroke="#000000" stroke-width="2"/>
            <text x="220" y="130" text-anchor="middle" font-size="14" fill="#000000">1</text>
            <line x1="340" y1="140" x2="340" y2="160" stroke="#000000" stroke-width="2"/>
            <text x="340" y="130" text-anchor="middle" font-size="14" fill="#000000">2</text>
            <line x1="460" y1="140" x2="460" y2="160" stroke="#000000" stroke-width="2"/>
            <text x="460" y="130" text-anchor="middle" font-size="14" fill="#000000">3</text>
            <line x1="580" y1="140" x2="580" y2="160" stroke="#000000" stroke-width="2"/>
            <text x="580" y="130" text-anchor="middle" font-size="14" fill="#000000">4</text>
            <line x1="700" y1="140" x2="700" y2="160" stroke="#000000" stroke-width="2"/>
            <text x="700" y="130" text-anchor="middle" font-size="14" fill="#000000">5</text>
            
            <!-- 下刻度线及数字 -->
            <line x1="100" y1="340" x2="100" y2="360" stroke="#000000" stroke-width="2"/>
            <text x="100" y="380" text-anchor="middle" font-size="14" fill="#000000">0</text>
            <line x1="220" y1="340" x2="220" y2="360" stroke="#000000" stroke-width="2"/>
            <text x="220" y="380" text-anchor="middle" font-size="14" fill="#000000">1</text>
            <line x1="340" y1="340" x2="340" y2="360" stroke="#000000" stroke-width="2"/>
            <text x="340" y="380" text-anchor="middle" font-size="14" fill="#000000">2</text>
            <line x1="460" y1="340" x2="460" y2="360" stroke="#000000" stroke-width="2"/>
            <text x="460" y="380" text-anchor="middle" font-size="14" fill="#000000">3</text>
            <line x1="580" y1="340" x2="580" y2="360" stroke="#000000" stroke-width="2"/>
            <text x="580" y="380" text-anchor="middle" font-size="14" fill="#000000">4</text>
            <line x1="700" y1="340" x2="700" y2="360" stroke="#000000" stroke-width="2"/>
            <text x="700" y="380" text-anchor="middle" font-size="14" fill="#000000">5</text>
            
            <!-- 图 1 三角形 -->
            <polygon id="scene1-tri1" points="220,150 100,350 340,350" fill="none" stroke="#000000" stroke-width="2" style="transition: fill 0.3s ease;"/>
            <!-- 图 2 平行四边形 -->
            <polygon id="scene1-para2" points="340,350 460,350 580,150 460,150" fill="none" stroke="#000000" stroke-width="2" style="transition: fill 0.3s ease;"/>
            <!-- 图 3 三角形 -->
            <polygon id="scene1-tri3" points="580,150 460,350 700,350" fill="none" stroke="#000000" stroke-width="2" style="transition: fill 0.3s ease;"/>
            
            <!-- 图 1 编号标签（移到图形上方，避免与图形重叠） -->
            <text id="scene1-label1" x="170" y="120" text-anchor="middle" font-size="16" fill="#000000">图 1</text>
            <!-- 图 2 编号标签（移到图形上方，避免与图形重叠） -->
            <text id="scene1-label2" x="400" y="120" text-anchor="middle" font-size="16" fill="#000000">图 2</text>
            <!-- 图 3 编号标签（移到图形上方，避免与图形重叠） -->
            <text id="scene1-label3" x="640" y="120" text-anchor="middle" font-size="16" fill="#000000">图 3</text>
            
            <!-- 高 h 标注线 -->
            <line id="scene1-height-line" x1="720" y1="150" x2="720" y2="350" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>
            <!-- 高 h 标签 -->
            <text id="scene1-height-label" x="740" y="240" text-anchor="middle" font-size="14" fill="#888888">h</text>
            
            <!-- 底边标注（步骤 1-4 显示） -->
            <text id="scene1-base1" x="170" y="375" text-anchor="middle" font-size="12" fill="#000000" display="none">底边=2</text>
            <text id="scene1-base2" x="400" y="375" text-anchor="middle" font-size="12" fill="#000000" display="none">底边=1</text>
            <text id="scene1-base3" x="640" y="375" text-anchor="middle" font-size="12" fill="#000000" display="none">底边=2</text>
            
            <!-- 面积公式（步骤 1-4 显示）- 调整 y 坐标增加间距 -->
            <text id="scene1-area1" x="170" y="415" text-anchor="middle" font-size="12" fill="#000000" display="none">面积=½×2×h=h</text>
            <text id="scene1-area2" x="400" y="415" text-anchor="middle" font-size="12" fill="#000000" display="none">面积=1×h=h</text>
            <text id="scene1-area3" x="640" y="415" text-anchor="middle" font-size="12" fill="#000000" display="none">面积=½×2×h=h</text>
            
            <!-- 结论标签（步骤 4 显示）- 调整 y 坐标增加间距（从 445 改为 450） -->
            <text id="scene1-conclusion" x="400" y="450" text-anchor="middle" font-size="14" fill="#c62828" font-weight="bold" display="none">三个图形面积相等</text>
            
            <!-- 图 2 红色边框（步骤 4 显示） -->
            <polygon id="scene1-para2-red" points="340,350 460,350 580,150 460,150" fill="none" stroke="#c62828" stroke-width="3" display="none"/>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn" disabled>◀ 上一步</button>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现
        // 坐标表对照：
        // 上平行线：(100,150)-(700,150)
        // 下平行线：(100,350)-(700,350)
        // 上刻度：x=100,220,340,460,580,700 (对应数字 0-5)
        // 下刻度：x=100,220,340,460,580,700 (对应数字 0-5)
        // 图 1 三角形：(220,150)-(100,350)-(340,350)
        // 图 2 平行四边形：(340,350)-(460,350)-(580,150)-(460,150)
        // 图 3 三角形：(580,150)-(460,350)-(700,350)
        // 图 1 编号标签：(170,120) - 移到图形上方
        // 图 2 编号标签：(400,120) - 移到图形上方
        // 图 3 编号标签：(640,120) - 移到图形上方
        // 图 1 底边标注：(170,375)
        // 图 2 底边标注：(400,375)
        // 图 3 底边标注：(640,375)
        // 图 1 面积公式：(170,415) - 调整 y 坐标增加间距
        // 图 2 面积公式：(400,415) - 调整 y 坐标增加间距
        // 图 3 面积公式：(640,415) - 调整 y 坐标增加间距
        // 结论标签：(400,450) - 调整 y 坐标增加间距（从 445 改为 450）
        
        const HIGHLIGHT_COLOR = "rgba(21, 101, 192, 0.2)";
        const NORMAL_FILL = "none";
        
        let currentStep = 0;
        const maxStep = 4;
        
        // 获取 DOM 元素
        const tri1 = document.getElementById("scene1-tri1");
        const para2 = document.getElementById("scene1-para2");
        const tri3 = document.getElementById("scene1-tri3");
        const label1 = document.getElementById("scene1-label1");
        const label2 = document.getElementById("scene1-label2");
        const label3 = document.getElementById("scene1-label3");
        const base1 = document.getElementById("scene1-base1");
        const base2 = document.getElementById("scene1-base2");
        const base3 = document.getElementById("scene1-base3");
        const area1 = document.getElementById("scene1-area1");
        const area2 = document.getElementById("scene1-area2");
        const area3 = document.getElementById("scene1-area3");
        const conclusion = document.getElementById("scene1-conclusion");
        const para2Red = document.getElementById("scene1-para2-red");
        const btnPrev = document.getElementById("scene1-btn-prev");
        const btnNext = document.getElementById("scene1-btn-next");
        
        // 工具函数：显示元素
        function show(el) {
            el.style.display = "block";
            el.style.opacity = "1";
        }
        
        // 工具函数：隐藏元素
        function hide(el) {
            el.style.display = "none";
            el.style.opacity = "0";
        }
        
        // 工具函数：设置填充色
        function setFill(el, color) {
            el.style.fill = color;
        }
        
        // 工具函数：设置字体粗细
        function setBold(el, bold) {
            el.style.fontWeight = bold ? "bold" : "normal";
        }
        
        // 更新场景显示
        function updateScene() {
            // 重置所有状态
            setFill(tri1, NORMAL_FILL);
            setFill(para2, NORMAL_FILL);
            setFill(tri3, NORMAL_FILL);
            setBold(label1, false);
            setBold(label2, false);
            setBold(label3, false);
            hide(base1);
            hide(base2);
            hide(base3);
            hide(area1);
            hide(area2);
            hide(area3);
            hide(conclusion);
            hide(para2Red);
            
            // 根据当前步骤更新显示
            switch(currentStep) {
                case 0:
                    // 初始状态：只显示基础图形
                    break;
                case 1:
                    // 高亮图 1
                    setFill(tri1, HIGHLIGHT_COLOR);
                    setBold(label1, true);
                    show(base1);
                    show(area1);
                    break;
                case 2:
                    // 高亮图 2
                    setFill(para2, HIGHLIGHT_COLOR);
                    setBold(label2, true);
                    show(base2);
                    show(area2);
                    break;
                case 3:
                    // 高亮图 3
                    setFill(tri3, HIGHLIGHT_COLOR);
                    setBold(label3, true);
                    show(base3);
                    show(area3);
                    break;
                case 4:
                    // 对比结论
                    show(base1);
                    show(base2);
                    show(base3);
                    show(area1);
                    show(area2);
                    show(area3);
                    show(conclusion);
                    show(para2Red);
                    break;
            }
            
            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === maxStep);
        }
        
        // 按钮事件绑定
        btnPrev.addEventListener("click", function() {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });
        
        btnNext.addEventListener("click", function() {
            if (currentStep < maxStep) {
                currentStep++;
                updateScene();
            }
        });
        
        // 初始化场景
        updateScene();
    })();
    </script>
</body>
</html>
