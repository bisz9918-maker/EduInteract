<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>概念关系图示分析 - Scene 2</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene2-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 2px solid #333; border-radius: 4px; background: #f5f5f5; }
        .scene2-btn:hover:not(:disabled) { background: #e0e0e0; }
        .scene2-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 标题 (y=30) -->
            <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#000">概念关系图示分析</text>
            
            <!-- 选项表格 - 使用外部边框，文字在单元格内居中 -->
            <g id="scene2-table">
                <!-- 外边框 -->
                <rect x="50" y="45" width="700" height="135" fill="#fff" stroke="#000" stroke-width="2"/>
                
                <!-- 表头行 -->
                <line x1="50" y1="68" x2="750" y2="68" stroke="#000" stroke-width="1.5"/>
                <text x="115" y="62" text-anchor="middle" font-size="13" fill="#000">选项</text>
                <text x="255" y="62" text-anchor="middle" font-size="13" fill="#000">Ⅰ</text>
                <text x="405" y="62" text-anchor="middle" font-size="13" fill="#000">Ⅱ</text>
                <text x="555" y="62" text-anchor="middle" font-size="13" fill="#000">Ⅲ</text>
                <text x="690" y="62" text-anchor="middle" font-size="13" fill="#000">Ⅳ</text>
                
                <!-- 列分隔线 -->
                <line x1="180" y1="68" x2="180" y2="180" stroke="#000" stroke-width="1"/>
                <line x1="330" y1="68" x2="330" y2="180" stroke="#000" stroke-width="1"/>
                <line x1="480" y1="68" x2="480" y2="180" stroke="#000" stroke-width="1"/>
                <line x1="630" y1="68" x2="630" y2="180" stroke="#000" stroke-width="1"/>
                
                <!-- 行分隔线 -->
                <line x1="50" y1="93" x2="750" y2="93" stroke="#000" stroke-width="1"/>
                <line x1="50" y1="118" x2="750" y2="118" stroke="#000" stroke-width="1"/>
                <line x1="50" y1="143" x2="750" y2="143" stroke="#000" stroke-width="1"/>
                <line x1="50" y1="168" x2="750" y2="168" stroke="#000" stroke-width="1"/>
                
                <!-- 选项 A 行 -->
                <g id="scene2-row-a">
                    <text x="115" y="87" text-anchor="middle" font-size="13" fill="#000">A</text>
                    <text x="255" y="87" text-anchor="middle" font-size="13" fill="#000">鱼类</text>
                    <text x="405" y="87" text-anchor="middle" font-size="13" fill="#000">爬行类</text>
                    <text x="555" y="87" text-anchor="middle" font-size="13" fill="#000">鸟类</text>
                    <text x="690" y="87" text-anchor="middle" font-size="13" fill="#000">哺乳类</text>
                </g>
                
                <!-- 选项 B 行 -->
                <g id="scene2-row-b">
                    <text x="115" y="112" text-anchor="middle" font-size="13" fill="#000">B</text>
                    <text x="255" y="112" text-anchor="middle" font-size="13" fill="#000">染色体</text>
                    <text x="405" y="112" text-anchor="middle" font-size="13" fill="#000">DNA</text>
                    <text x="555" y="112" text-anchor="middle" font-size="13" fill="#000">基因</text>
                    <text x="690" y="112" text-anchor="middle" font-size="13" fill="#000">细胞核</text>
                </g>
                
                <!-- 选项 C 行 -->
                <g id="scene2-row-c">
                    <text x="115" y="137" text-anchor="middle" font-size="13" fill="#000">C</text>
                    <text x="255" y="137" text-anchor="middle" font-size="13" fill="#000">种子</text>
                    <text x="405" y="137" text-anchor="middle" font-size="13" fill="#000">胚</text>
                    <text x="555" y="137" text-anchor="middle" font-size="13" fill="#000">子叶</text>
                    <text x="690" y="137" text-anchor="middle" font-size="13" fill="#000">种皮</text>
                </g>
                
                <!-- 选项 D 行 -->
                <g id="scene2-row-d">
                    <text x="115" y="162" text-anchor="middle" font-size="13" fill="#000">D</text>
                    <text x="255" y="162" text-anchor="middle" font-size="13" fill="#000">微生物</text>
                    <text x="405" y="162" text-anchor="middle" font-size="13" fill="#000">病毒</text>
                    <text x="555" y="162" text-anchor="middle" font-size="13" fill="#000">细菌</text>
                    <text x="690" y="162" text-anchor="middle" font-size="13" fill="#000">真菌</text>
                </g>
            </g>
            
            <!-- 图示区标题 (y=195) -->
            <text x="400" y="195" text-anchor="middle" font-size="15" fill="#000">各选项概念关系分析</text>
            
            <!-- 选项 A 示意图 - 简化：只画圆，不加内部文字标签 -->
            <g id="scene2-diagram-a" style="display: none;">
                <!-- 大圆 I -->
                <circle cx="80" cy="230" r="40" fill="rgba(198, 40, 40, 0.15)" stroke="#c62828" stroke-width="2"/>
                <!-- 小圆 II -->
                <circle cx="80" cy="215" r="15" fill="rgba(255,255,255,0.9)" stroke="#c62828" stroke-width="1.5"/>
                <!-- 小圆 III -->
                <circle cx="65" cy="245" r="15" fill="rgba(255,255,255,0.9)" stroke="#c62828" stroke-width="1.5"/>
                <!-- 小圆 IV -->
                <circle cx="95" cy="245" r="15" fill="rgba(255,255,255,0.9)" stroke="#c62828" stroke-width="1.5"/>
                <!-- 标签 (移到右侧更远，y 坐标错开) -->
                <text x="140" y="225" font-size="13" fill="#c62828">A: 四者并列</text>
                <text x="140" y="248" font-size="18" fill="#c62828">✗</text>
            </g>
            
            <!-- 选项 B 示意图 -->
            <g id="scene2-diagram-b" style="display: none;">
                <!-- 大圆 I -->
                <circle cx="230" cy="230" r="40" fill="rgba(198, 40, 40, 0.15)" stroke="#c62828" stroke-width="2"/>
                <!-- 小圆 II -->
                <circle cx="230" cy="215" r="15" fill="rgba(255,255,255,0.9)" stroke="#c62828" stroke-width="1.5"/>
                <!-- 小圆 III -->
                <circle cx="215" cy="245" r="15" fill="rgba(255,255,255,0.9)" stroke="#c62828" stroke-width="1.5"/>
                <!-- 小圆 IV -->
                <circle cx="245" cy="245" r="15" fill="rgba(255,255,255,0.9)" stroke="#c62828" stroke-width="1.5"/>
                <!-- 标签 -->
                <text x="290" y="225" font-size="13" fill="#c62828">B: 层层包含</text>
                <text x="290" y="248" font-size="18" fill="#c62828">✗</text>
            </g>
            
            <!-- 选项 C 示意图 -->
            <g id="scene2-diagram-c" style="display: none;">
                <!-- 大圆 I -->
                <circle cx="380" cy="230" r="40" fill="rgba(198, 40, 40, 0.15)" stroke="#c62828" stroke-width="2"/>
                <!-- 小圆 II -->
                <circle cx="380" cy="215" r="15" fill="rgba(255,255,255,0.9)" stroke="#c62828" stroke-width="1.5"/>
                <!-- 小圆 III -->
                <circle cx="365" cy="245" r="15" fill="rgba(255,255,255,0.9)" stroke="#c62828" stroke-width="1.5"/>
                <!-- 小圆 IV -->
                <circle cx="395" cy="245" r="15" fill="rgba(255,255,255,0.9)" stroke="#c62828" stroke-width="1.5"/>
                <!-- 标签 -->
                <text x="440" y="225" font-size="13" fill="#c62828">C: 关系复杂</text>
                <text x="440" y="248" font-size="18" fill="#c62828">✗</text>
            </g>
            
            <!-- 选项 D 示意图 -->
            <g id="scene2-diagram-d" style="display: none;">
                <!-- 大圆 I -->
                <circle cx="530" cy="230" r="40" fill="rgba(21, 101, 192, 0.15)" stroke="#1565c0" stroke-width="2"/>
                <!-- 小圆 II -->
                <circle cx="530" cy="215" r="15" fill="rgba(255,255,255,0.9)" stroke="#1565c0" stroke-width="1.5"/>
                <!-- 小圆 III -->
                <circle cx="515" cy="245" r="15" fill="rgba(255,255,255,0.9)" stroke="#1565c0" stroke-width="1.5"/>
                <!-- 小圆 IV -->
                <circle cx="545" cy="245" r="15" fill="rgba(255,255,255,0.9)" stroke="#1565c0" stroke-width="1.5"/>
                <!-- 标签 -->
                <text x="590" y="225" font-size="13" fill="#1565c0">D: 包含并列</text>
                <text x="590" y="248" font-size="18" fill="#2e7d32">✓</text>
            </g>
            
            <!-- 解释文本区 (y=280) -->
            <g id="scene2-explanation" style="display: none;">
                <text x="50" y="280" font-size="13" fill="#333" id="scene2-explanation-text"></text>
            </g>
            
            <!-- 结论区 (y=310) -->
            <g id="scene2-conclusion" style="display: none;">
                <rect x="280" y="310" width="240" height="45" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3" rx="5"/>
                <text x="400" y="338" text-anchor="middle" font-size="17" font-weight="bold" fill="#2e7d32">正确答案：D</text>
            </g>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-btn-prev" class="scene2-btn">◀ 上一步</button>
            <button id="scene2-btn-next" class="scene2-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现
        // 布局坐标表对照：
        // 标题 (400,30) | 表格 (50,45) | 图示区标题 (400,195)
        // A 示意图 (80,230) | B 示意图 (230,230) | C 示意图 (380,230) | D 示意图 (530,230)
        // 解释文本 (50,280) | 结论区 (280,310) 240×45 | 控件栏底部
        
        const currentStepMax = 5;
        let currentStep = 0;
        
        const explanations = [
            "",
            "A: 鱼类、爬行类、鸟类、哺乳类是脊椎动物的四个并列类别，没有大概念包含关系，与图示不符",
            "B: 细胞核包含染色体，染色体包含 DNA，DNA 包含基因，是层层包含而非并列，与图示不符",
            "C: 种子包含胚和种皮，胚又包含子叶，关系复杂不符合简单的一包含三并列结构",
            "D: 微生物包含病毒、细菌、真菌，三者是并列的微生物类别，与图示完全相符",
            "总结：图示表示一个大概念Ⅰ包含三个并列子概念Ⅱ、Ⅲ、Ⅳ。只有选项 D 符合这种关系。"
        ];
        
        function updateStep() {
            // 隐藏所有示意图、解释、结论
            document.getElementById('scene2-diagram-a').style.display = 'none';
            document.getElementById('scene2-diagram-b').style.display = 'none';
            document.getElementById('scene2-diagram-c').style.display = 'none';
            document.getElementById('scene2-diagram-d').style.display = 'none';
            document.getElementById('scene2-conclusion').style.display = 'none';
            document.getElementById('scene2-explanation').style.display = 'none';
            
            // 清除所有高亮（重置行背景色）
            const rows = ['a', 'b', 'c', 'd'];
            rows.forEach(r => {
                const row = document.getElementById(`scene2-row-${r}`);
                // 移除可能存在的背景 rect
                const existingRect = row.querySelector('rect');
                if (existingRect) existingRect.remove();
            });
            
            // 根据步骤显示对应内容
            if (currentStep >= 1) {
                document.getElementById('scene2-diagram-a').style.display = 'block';
                addHighlight('scene2-row-a', '#ffebee');
            }
            if (currentStep >= 2) {
                document.getElementById('scene2-diagram-b').style.display = 'block';
                addHighlight('scene2-row-b', '#ffebee');
            }
            if (currentStep >= 3) {
                document.getElementById('scene2-diagram-c').style.display = 'block';
                addHighlight('scene2-row-c', '#ffebee');
            }
            if (currentStep >= 4) {
                document.getElementById('scene2-diagram-d').style.display = 'block';
                addHighlight('scene2-row-d', '#e8f5e9');
            }
            if (currentStep >= 5) {
                document.getElementById('scene2-conclusion').style.display = 'block';
                // 将 D 的边框改为绿色
                const dCircles = document.querySelectorAll('#scene2-diagram-d circle');
                dCircles.forEach(circle => {
                    circle.style.stroke = '#2e7d32';
                });
                const dTexts = document.querySelectorAll('#scene2-diagram-d text');
                dTexts.forEach(text => {
                    if (text.textContent.trim() !== '✓') {
                        text.style.fill = '#2e7d32';
                    }
                });
            }
            
            // 显示解释文本
            if (currentStep > 0) {
                document.getElementById('scene2-explanation').style.display = 'block';
                document.getElementById('scene2-explanation-text').textContent = explanations[currentStep];
            }
            
            // 更新按钮状态
            document.getElementById('scene2-btn-prev').disabled = (currentStep === 0);
            document.getElementById('scene2-btn-next').disabled = (currentStep === currentStepMax);
            if (currentStep === currentStepMax) {
                document.getElementById('scene2-btn-next').textContent = '完成';
            } else {
                document.getElementById('scene2-btn-next').textContent = '下一步 ▶';
            }
        }
        
        function addHighlight(rowId, color) {
            const row = document.getElementById(rowId);
            // 在行组内添加背景矩形
            const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            const rowNum = rowId.replace('scene2-row-', '');
            const yOffsets = { 'a': 75, 'b': 100, 'c': 125, 'd': 150 };
            rect.setAttribute('x', '50');
            rect.setAttribute('y', yOffsets[rowNum]);
            rect.setAttribute('width', '700');
            rect.setAttribute('height', '25');
            rect.setAttribute('fill', color);
            rect.setAttribute('style', 'pointer-events: none;');
            row.insertBefore(rect, row.firstChild);
        }
        
        document.getElementById('scene2-btn-prev').addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });
        
        document.getElementById('scene2-btn-next').addEventListener('click', function() {
            if (currentStep < currentStepMax) {
                currentStep++;
                updateStep();
            }
        });
        
        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
