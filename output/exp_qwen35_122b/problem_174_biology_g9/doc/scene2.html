<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 抑制性递质作用机制</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene2-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 2px solid #333; border-radius: 6px; background: #f5f5f5; transition: all 0.3s; }
        .scene2-btn:hover { background: #e0e0e0; }
        .scene2-btn.active { background: #1976d2; color: white; border-color: #1976d2; }
        #scene2-status-text { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); font-size: 16px; color: #333; background: rgba(255,255,255,0.9); padding: 8px 20px; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" id="scene2-svg">
            <!-- 标题 -->
            <text x="320" y="20" font-size="18" font-weight="bold" text-anchor="middle">抑制性递质作用机制</text>
            
            <!-- 电流计 -->
            <circle cx="400" cy="80" r="20" fill="none" stroke="#333" stroke-width="2"/>
            <line x1="400" y1="70" x2="400" y2="90" stroke="#333" stroke-width="2" id="scene2-gauge-pointer"/>
            <text x="400" y="85" font-size="12" text-anchor="middle" fill="#333">G</text>
            
            <!-- 电流计导线 -->
            <line x1="100" y1="120" x2="100" y2="230" stroke="#333" stroke-width="1.5" id="scene2-wire-a"/>
            <line x1="700" y1="120" x2="700" y2="230" stroke="#333" stroke-width="1.5" id="scene2-wire-d"/>
            
            <!-- 神经元 A（抑制性）- 左下斜向 -->
            <path d="M 80 350 Q 100 380 140 360 L 160 350 L 140 340 Q 100 320 80 340 Z" fill="none" stroke="#333" stroke-width="2" id="scene2-neuron-a-body"/>
            <line x1="140" y1="350" x2="200" y2="300" stroke="#333" stroke-width="3" id="scene2-neuron-a-axon"/>
            
            <!-- 神经元 A 突触小泡（红色） -->
            <circle cx="180" cy="290" r="4" fill="#c62828" opacity="0.6" id="scene2-vesicle-a1"/>
            <circle cx="190" cy="300" r="4" fill="#c62828" opacity="0.6" id="scene2-vesicle-a2"/>
            <circle cx="200" cy="310" r="4" fill="#c62828" opacity="0.6" id="scene2-vesicle-a3"/>
            <circle cx="210" cy="295" r="4" fill="#c62828" opacity="0.6" id="scene2-vesicle-a4"/>
            <circle cx="215" cy="305" r="4" fill="#c62828" opacity="0.6" id="scene2-vesicle-a5"/>
            
            <!-- 神经元 B（中间）- 中央偏左 -->
            <path d="M 250 230 Q 250 180 300 180 Q 350 180 350 230 Q 350 280 300 280 Q 250 280 250 230 Z" fill="none" stroke="#333" stroke-width="2" id="scene2-neuron-b-body"/>
            <line x1="350" y1="230" x2="500" y2="230" stroke="#333" stroke-width="3" id="scene2-neuron-b-axon"/>
            
            <!-- 神经元 B 突触小泡（蓝色） -->
            <circle cx="320" cy="220" r="4" fill="#1565c0" opacity="0.6" id="scene2-vesicle-b1"/>
            <circle cx="330" cy="210" r="4" fill="#1565c0" opacity="0.6" id="scene2-vesicle-b2"/>
            <circle cx="340" cy="220" r="4" fill="#1565c0" opacity="0.6" id="scene2-vesicle-b3"/>
            <circle cx="350" cy="230" r="4" fill="#1565c0" opacity="0.6" id="scene2-vesicle-b4"/>
            <circle cx="340" cy="240" r="4" fill="#1565c0" opacity="0.6" id="scene2-vesicle-b5"/>
            <circle cx="330" cy="235" r="4" fill="#1565c0" opacity="0.6" id="scene2-vesicle-b6"/>
            
            <!-- 神经元 C（后级）- 中央偏右 -->
            <path d="M 520 230 Q 520 180 570 180 Q 620 180 620 230 Q 620 280 570 280 Q 520 280 520 230 Z" fill="none" stroke="#333" stroke-width="2" id="scene2-neuron-c-body"/>
            <line x1="620" y1="230" x2="750" y2="230" stroke="#333" stroke-width="3" id="scene2-neuron-c-axon"/>
            
            <!-- 突触间隙（虚线） -->
            <line x1="220" y1="300" x2="250" y2="280" stroke="#888" stroke-width="2" stroke-dasharray="4,4" id="scene2-synapse-ab"/>
            <line x1="500" y1="230" x2="520" y2="230" stroke="#888" stroke-width="2" stroke-dasharray="4,4" id="scene2-synapse-bc"/>
            
            <!-- 电极接触点 -->
            <circle cx="100" cy="230" r="4" fill="#333" id="scene2-electrode-a"/>
            <circle cx="700" cy="230" r="4" fill="#333" id="scene2-electrode-d"/>
            
            <!-- 刺激点 -->
            <circle cx="280" cy="160" r="6" fill="#333" id="scene2-stim-b"/>
            <circle cx="570" cy="160" r="6" fill="#333" id="scene2-stim-c"/>
            
            <!-- 标签 -->
            <text x="70" y="350" font-size="16" font-weight="bold" fill="#333">A</text>
            <text x="230" y="230" font-size="16" font-weight="bold" fill="#333">B</text>
            <text x="630" y="230" font-size="16" font-weight="bold" fill="#333">C</text>
            <text x="80" y="230" font-size="14" fill="#333">a</text>
            <text x="720" y="230" font-size="14" fill="#333">d</text>
            <text x="280" y="145" font-size="14" fill="#333">b</text>
            <text x="570" y="145" font-size="14" fill="#333">c</text>
            
            <!-- 递质标签 -->
            <text x="150" y="260" font-size="12" fill="#c62828" id="scene2-label-inhibitory">抑制性递质</text>
            <text x="420" y="200" font-size="12" fill="#1565c0" id="scene2-label-excitatory">兴奋性递质</text>
            
            <!-- 状态 1 元素（B 单独刺激）- 初始隐藏 -->
            <g id="scene2-state1-elements" style="display: none;">
                <!-- B 神经元高亮 -->
                <path d="M 250 230 Q 250 180 300 180 Q 350 180 350 230 Q 350 280 300 280 Q 250 280 250 230 Z" fill="none" stroke="#2e7d32" stroke-width="4" opacity="0.5"/>
                <!-- 兴奋性递质分子（蓝色小圆点） -->
                <circle cx="380" cy="230" r="3" fill="#1565c0" id="scene2-neurotransmitter-b1"/>
                <circle cx="410" cy="230" r="3" fill="#1565c0" id="scene2-neurotransmitter-b2"/>
                <circle cx="440" cy="230" r="3" fill="#1565c0" id="scene2-neurotransmitter-b3"/>
                <circle cx="470" cy="230" r="3" fill="#1565c0" id="scene2-neurotransmitter-b4"/>
                <!-- Na+ 内流箭头（绿色） -->
                <line x1="520" y1="220" x2="520" y2="240" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrowhead-green)" id="scene2-na-inflow"/>
                <polygon points="520,240 515,230 525,230" fill="#2e7d32" id="scene2-na-arrow"/>
                <!-- C 神经元兴奋标记 -->
                <text x="570" y="270" font-size="14" fill="#2e7d32" font-weight="bold" id="scene2-c-excited">C 兴奋</text>
                <!-- 膜电位变化 -->
                <text x="550" y="200" font-size="12" fill="#2e7d32" id="scene2-membrane-potential">+/-</text>
            </g>
            
            <!-- 状态 2 元素（A+B 同时刺激）- 初始隐藏 -->
            <g id="scene2-state2-elements" style="display: none;">
                <!-- A 神经元高亮 -->
                <path d="M 80 350 Q 100 380 140 360 L 160 350 L 140 340 Q 100 320 80 340 Z" fill="none" stroke="#c62828" stroke-width="4" opacity="0.5"/>
                <!-- 抑制性递质分子（红色小圆点） -->
                <circle cx="160" cy="320" r="3" fill="#c62828" id="scene2-neurotransmitter-a1"/>
                <circle cx="175" cy="305" r="3" fill="#c62828" id="scene2-neurotransmitter-a2"/>
                <circle cx="190" cy="295" r="3" fill="#c62828" id="scene2-neurotransmitter-a3"/>
                <circle cx="205" cy="290" r="3" fill="#c62828" id="scene2-neurotransmitter-a4"/>
                <!-- Cl-内流箭头（红色） -->
                <line x1="280" y1="220" x2="280" y2="240" stroke="#c62828" stroke-width="2" id="scene2-cl-inflow"/>
                <polygon points="280,240 275,230 285,230" fill="#c62828" id="scene2-cl-arrow"/>
                <!-- B 神经元超极化标记 -->
                <text x="260" y="160" font-size="14" fill="#c62828" font-weight="bold" id="scene2-b-hyperpolarized">B 超极化</text>
                <!-- C 神经元静息标记 -->
                <text x="550" y="270" font-size="14" fill="#888" id="scene2-c-resting">C 静息</text>
            </g>
            
            <!-- 状态 3 元素（机制总结）- 初始隐藏 -->
            <g id="scene2-state3-elements" style="display: none;">
                <!-- A→B 突触红色虚线框 -->
                <rect x="140" y="280" width="120" height="80" fill="none" stroke="#c62828" stroke-width="2" stroke-dasharray="6,4" id="scene2-inhibitory-synapse-box"/>
                <text x="200" y="270" font-size="12" fill="#c62828" font-weight="bold" id="scene2-inhibitory-label">抑制性突触</text>
                <!-- B→C 突触绿色虚线框 -->
                <rect x="480" y="200" width="60" height="60" fill="none" stroke="#2e7d32" stroke-width="2" stroke-dasharray="6,4" id="scene2-excitatory-synapse-box"/>
                <text x="510" y="190" font-size="12" fill="#2e7d32" font-weight="bold" id="scene2-excitatory-label">兴奋性突触</text>
            </g>
            
            <!-- 箭头标记定义 -->
            <defs>
                <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32"/>
                </marker>
            </defs>
        </svg>
        
        <!-- 状态说明区 -->
        <div id="scene2-status-text">请选择状态观察</div>
        
        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button class="scene2-btn" id="scene2-btn-state1">状态 1</button>
            <button class="scene2-btn" id="scene2-btn-state2">状态 2</button>
            <button class="scene2-btn" id="scene2-btn-state3">状态 3</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现 - 抑制性递质作用机制
        // 布局坐标表（参考）：
        // | 元素 | 位置 | 备注 |
        // | 标题 | (320,20) | 顶部居中 |
        // | 神经元 A | (80,320)-(140,380) | 左下斜向 |
        // | 神经元 B | (250,180)-(350,280) | 中央偏左 |
        // | 神经元 C | (520,180)-(620,280) | 中央偏右 |
        // | 电流计 | (400,80) | 顶部中央 |
        // | a 点 | (100,230) | 电极 |
        // | d 点 | (700,230) | 电极 |
        // | b 点 | (280,160) | 刺激点 |
        // | c 点 | (570,160) | 刺激点 |
        
        var currentStatus = 0; // 0=初始，1=状态 1，2=状态 2，3=状态 3
        
        // 获取 DOM 元素
        var svg = document.getElementById('scene2-svg');
        var statusText = document.getElementById('scene2-status-text');
        var gaugePointer = document.getElementById('scene2-gauge-pointer');
        
        var btnState1 = document.getElementById('scene2-btn-state1');
        var btnState2 = document.getElementById('scene2-btn-state2');
        var btnState3 = document.getElementById('scene2-btn-state3');
        
        var state1Elements = document.getElementById('scene2-state1-elements');
        var state2Elements = document.getElementById('scene2-state2-elements');
        var state3Elements = document.getElementById('scene2-state3-elements');
        
        // 工具函数：隐藏元素（同时设置 display 和 opacity）
        function hide(el) {
            if (el) {
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }
        
        // 工具函数：显示元素
        function show(el) {
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }
        
        // 工具函数：切换按钮状态
        function setActiveButton(btn) {
            btnState1.classList.remove('active');
            btnState2.classList.remove('active');
            btnState3.classList.remove('active');
            if (btn) btn.classList.add('active');
        }
        
        // 状态 1：B 单独刺激
        function showState1() {
            currentStatus = 1;
            hide(state2Elements);
            hide(state3Elements);
            show(state1Elements);
            setActiveButton(btnState1);
            statusText.textContent = '状态 1：刺激 B→兴奋性递质释放→Na+内流→C 兴奋';
            
            // 电流计指针偏转（向右 15 度）
            gaugePointer.setAttribute('transform', 'rotate(15, 400, 80)');
            
            // 递质分子动画
            animateNeurotransmitters('scene2-neurotransmitter-b', 380, 470, 230, 230, 500);
        }
        
        // 状态 2：A+B 同时刺激
        function showState2() {
            currentStatus = 2;
            hide(state1Elements);
            hide(state3Elements);
            show(state2Elements);
            setActiveButton(btnState2);
            statusText.textContent = '状态 2：A+B 同时刺激→A 释放抑制性递质→B 超极化→C 不兴奋';
            
            // 电流计指针不偏转
            gaugePointer.setAttribute('transform', 'rotate(0, 400, 80)');
            
            // 递质分子动画
            animateNeurotransmitters('scene2-neurotransmitter-a', 160, 205, 320, 290, 500);
        }
        
        // 状态 3：机制总结
        function showState3() {
            currentStatus = 3;
            hide(state1Elements);
            hide(state2Elements);
            show(state3Elements);
            setActiveButton(btnState3);
            statusText.textContent = '机制总结：抑制性递质使突触后膜超极化，阻断兴奋传递';
            
            // 电流计指针复位
            gaugePointer.setAttribute('transform', 'rotate(0, 400, 80)');
        }
        
        // 递质分子动画函数
        function animateNeurotransmitters(prefix, startX, endX, y, duration) {
            var molecules = [];
            for (var i = 1; i <= 4; i++) {
                var el = document.getElementById(prefix + i);
                if (el) {
                    molecules.push({
                        el: el,
                        startX: startX + (i - 1) * 30,
                        endX: endX + (i - 1) * 30,
                        y: y,
                        progress: 0
                    });
                }
            }
            
            var startTime = null;
            function animate(timestamp) {
                if (!startTime) startTime = timestamp;
                var elapsed = timestamp - startTime;
                var progress = Math.min(elapsed / duration, 1);
                
                molecules.forEach(function(mol) {
                    var x = mol.startX + (mol.endX - mol.startX) * progress;
                    mol.el.setAttribute('cx', x);
                    mol.el.setAttribute('cy', mol.y);
                });
                
                if (progress < 1) {
                    requestAnimationFrame(animate);
                }
            }
            requestAnimationFrame(animate);
        }
        
        // 事件绑定
        btnState1.addEventListener('click', showState1);
        btnState2.addEventListener('click', showState2);
        btnState3.addEventListener('click', showState3);
        
        // 初始化：所有状态元素隐藏
        hide(state1Elements);
        hide(state2Elements);
        hide(state3Elements);
        gaugePointer.setAttribute('transform', 'rotate(0, 400, 80)');
    })();
    </script>
</body>
</html>
