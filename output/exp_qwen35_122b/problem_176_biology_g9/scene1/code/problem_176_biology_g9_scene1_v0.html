<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 1 - 丝带扎紧上臂血管分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Microsoft YaHei', sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 16px; z-index: 10; }
        .scene1-btn { padding: 8px 20px; font-size: 14px; background: #1976d2; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .scene1-btn:disabled { background: #bdbdbd; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 14px; color: #424242; min-width: 100px; text-align: center; }
        .scene1-highlight { stroke-width: 6 !important; filter: drop-shadow(0 0 4px currentColor); }
        .scene1-fade-in { animation: scene1-fadeIn 0.4s ease-in-out; }
        @keyframes scene1-fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .scene1-blink { animation: scene1-blink 1s ease-in-out infinite; }
        @keyframes scene1-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 背景 -->
            <rect width="800" height="500" fill="#ffffff"/>
            
            <!-- 丝带上区域高亮背景 (步骤 4) - 缩小范围避免与文字重叠 -->
            <rect id="scene1-top-highlight" x="0" y="0" width="800" height="240" fill="#ffebee" opacity="0" style="pointer-events: none;"/>
            
            <!-- 丝带下方区域高亮背景 (步骤 3) - 缩小范围避免与文字重叠 -->
            <rect id="scene1-bottom-highlight" x="0" y="260" width="800" height="240" fill="#e8f5e9" opacity="0" style="pointer-events: none;"/>
            
            <!-- 左血管 (静脉，蓝色) -->
            <line id="scene1-left-vein" x1="250" y1="100" x2="250" y2="400" stroke="#1565c0" stroke-width="4" stroke-linecap="round"/>
            
            <!-- 右血管 (动脉，红色) -->
            <line id="scene1-right-artery" x1="550" y1="100" x2="550" y2="400" stroke="#c62828" stroke-width="4" stroke-linecap="round"/>
            
            <!-- 丝带 (灰色) -->
            <line id="scene1-band" x1="150" y1="250" x2="650" y2="250" stroke="#888888" stroke-width="4" stroke-linecap="round"/>
            
            <!-- 左血管向上箭头 (静脉血流方向) -->
            <g id="scene1-left-arrow" transform="translate(250, 100)">
                <line x1="0" y1="0" x2="0" y2="-30" stroke="#1565c0" stroke-width="3" stroke-linecap="round"/>
                <polygon points="0,-35 -6,-25 6,-25" fill="#1565c0"/>
            </g>
            
            <!-- 右血管向下箭头 (动脉血流方向) -->
            <g id="scene1-right-arrow" transform="translate(550, 400)">
                <line x1="0" y1="0" x2="0" y2="30" stroke="#c62828" stroke-width="3" stroke-linecap="round"/>
                <polygon points="0,35 -6,25 6,25" fill="#c62828"/>
            </g>
            
            <!-- 标注① (左血管下方，纯文字) -->
            <text id="scene1-label-1" x="235" y="355" fill="#1565c0" font-size="18" font-weight="bold">①</text>
            
            <!-- 标注④ (左血管上方，纯文字) -->
            <text id="scene1-label-4" x="235" y="155" fill="#1565c0" font-size="18" font-weight="bold">④</text>
            
            <!-- 标注② (右血管下方，纯文字) -->
            <text id="scene1-label-2" x="565" y="355" fill="#c62828" font-size="18" font-weight="bold">②</text>
            
            <!-- 标注③ (右血管上方，纯文字) -->
            <text id="scene1-label-3" x="565" y="155" fill="#c62828" font-size="18" font-weight="bold">③</text>
            
            <!-- 丝带文字标注 - 移到更右侧 -->
            <text id="scene1-band-text" x="700" y="255" fill="#888888" font-size="16">丝带</text>
            
            <!-- 静脉标签 (步骤 1 显示) -->
            <g id="scene1-vein-label" opacity="0">
                <text x="140" y="255" fill="#1565c0" font-size="14" font-weight="bold">静脉：血液向心脏流动</text>
            </g>
            
            <!-- 动脉标签 (步骤 2 显示) - 移到更右侧，避开丝带文字 -->
            <g id="scene1-artery-label" opacity="0">
                <text x="620" y="285" fill="#c62828" font-size="14" font-weight="bold">动脉：血液离心脏流动</text>
            </g>
            
            <!-- ①膨胀提示框 (步骤 3 显示) - 使用文字直接显示，无背景框 -->
            <text id="scene1-expand-1" opacity="0" x="150" y="390" fill="#2e7d32" font-size="14" font-weight="bold">①膨胀：静脉血积聚</text>
            
            <!-- ②变扁提示框 (步骤 3 显示) - 使用文字直接显示，无背景框 -->
            <text id="scene1-flatten-2" opacity="0" x="510" y="390" fill="#888888" font-size="14" font-weight="bold">②变扁：动脉血流空</text>
            
            <!-- ③膨胀提示框 (步骤 4 显示) - 使用文字直接显示，无背景框 -->
            <text id="scene1-expand-3" opacity="0" x="510" y="130" fill="#2e7d32" font-size="14" font-weight="bold">③膨胀：动脉血积聚</text>
            
            <!-- ④变扁提示框 (步骤 4 显示) - 使用文字直接显示，无背景框 -->
            <text id="scene1-flatten-4" opacity="0" x="150" y="130" fill="#888888" font-size="14" font-weight="bold">④变扁：静脉血流空</text>
            
            <!-- 结论框 (步骤 5 显示) - 使用文字直接显示，无背景框，移到更上方避开按钮，增加行间距 -->
            <g id="scene1-conclusion" opacity="0">
                <text x="200" y="405" fill="#1565c0" font-size="14" font-weight="bold">结论：左血管=静脉，右血管=动脉</text>
                <text x="200" y="440" fill="#424242" font-size="13">①④为静脉血 (蓝色)，②③为动脉血 (红色)</text>
                <text x="200" y="475" fill="#2e7d32" font-size="13" font-weight="bold">正确选项：C．血管①含氧量比血管③低</text>
            </g>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-prev-btn" class="scene1-btn" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/6</span>
            <button id="scene1-next-btn" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现 - 丝带扎紧上臂血管分析
        // 布局坐标表对照：
        // | 元素 | 位置/范围 | 备注 |
        // | 左血管 | x=250, y=100-400 | 静脉，蓝色系 #1565c0 |
        // | 右血管 | x=550, y=100-400 | 动脉，红色系 #c62828 |
        // | 丝带 | x=150-650, y=250 | 灰色 #888888 |
        // | 标注① | (235,355) | 左血管下方 |
        // | 标注④ | (235,155) | 左血管上方 |
        // | 标注② | (565,355) | 右血管下方 |
        // | 标注③ | (565,155) | 右血管上方 |
        
        const scene1 = {
            currentStep: 0,
            totalSteps: 6,
            
            // 获取 DOM 元素
            elements: {
                leftVein: document.getElementById('scene1-left-vein'),
                rightArtery: document.getElementById('scene1-right-artery'),
                band: document.getElementById('scene1-band'),
                leftArrow: document.getElementById('scene1-left-arrow'),
                rightArrow: document.getElementById('scene1-right-arrow'),
                label1: document.getElementById('scene1-label-1'),
                label2: document.getElementById('scene1-label-2'),
                label3: document.getElementById('scene1-label-3'),
                label4: document.getElementById('scene1-label-4'),
                bandText: document.getElementById('scene1-band-text'),
                veinLabel: document.getElementById('scene1-vein-label'),
                arteryLabel: document.getElementById('scene1-artery-label'),
                expand1: document.getElementById('scene1-expand-1'),
                flatten2: document.getElementById('scene1-flatten-2'),
                expand3: document.getElementById('scene1-expand-3'),
                flatten4: document.getElementById('scene1-flatten-4'),
                conclusion: document.getElementById('scene1-conclusion'),
                topHighlight: document.getElementById('scene1-top-highlight'),
                bottomHighlight: document.getElementById('scene1-bottom-highlight'),
                prevBtn: document.getElementById('scene1-prev-btn'),
                nextBtn: document.getElementById('scene1-next-btn'),
                stepIndicator: document.getElementById('scene1-step-indicator')
            },
            
            // 显示元素
            show: function(el) {
                if (el) {
                    el.style.opacity = '1';
                    el.style.display = 'block';
                }
            },
            
            // 隐藏元素
            hide: function(el) {
                if (el) {
                    el.style.opacity = '0';
                    el.style.display = 'none';
                }
            },
            
            // 更新步骤显示
            updateScene: function() {
                const el = this.elements;
                
                // 重置所有状态
                el.leftVein.classList.remove('scene1-highlight');
                el.rightArtery.classList.remove('scene1-highlight');
                el.leftArrow.classList.remove('scene1-blink');
                el.rightArrow.classList.remove('scene1-blink');
                el.topHighlight.style.opacity = '0';
                el.bottomHighlight.style.opacity = '0';
                
                // 隐藏所有标签和提示框
                this.hide(el.veinLabel);
                this.hide(el.arteryLabel);
                this.hide(el.expand1);
                this.hide(el.flatten2);
                this.hide(el.expand3);
                this.hide(el.flatten4);
                this.hide(el.conclusion);
                
                // 根据步骤显示对应内容
                switch(this.currentStep) {
                    case 0: // 初始状态
                        el.stepIndicator.textContent = '步骤 1/6';
                        el.prevBtn.disabled = true;
                        break;
                        
                    case 1: // 高亮左血管 (静脉)
                        el.stepIndicator.textContent = '步骤 2/6';
                        el.leftVein.classList.add('scene1-highlight');
                        el.leftArrow.classList.add('scene1-blink');
                        this.show(el.veinLabel);
                        el.prevBtn.disabled = false;
                        break;
                        
                    case 2: // 高亮右血管 (动脉)
                        el.stepIndicator.textContent = '步骤 3/6';
                        el.rightArtery.classList.add('scene1-highlight');
                        el.rightArrow.classList.add('scene1-blink');
                        this.show(el.arteryLabel);
                        el.prevBtn.disabled = false;
                        break;
                        
                    case 3: // 丝带下方阻断效果
                        el.stepIndicator.textContent = '步骤 4/6';
                        el.bottomHighlight.style.opacity = '0.5';
                        this.show(el.expand1);
                        this.show(el.flatten2);
                        el.prevBtn.disabled = false;
                        break;
                        
                    case 4: // 丝带上阻断效果
                        el.stepIndicator.textContent = '步骤 5/6';
                        el.topHighlight.style.opacity = '0.5';
                        this.show(el.expand3);
                        this.show(el.flatten4);
                        el.prevBtn.disabled = false;
                        break;
                        
                    case 5: // 结论
                        el.stepIndicator.textContent = '步骤 6/6';
                        this.show(el.conclusion);
                        el.leftVein.classList.add('scene1-highlight');
                        el.rightArtery.classList.add('scene1-highlight');
                        el.prevBtn.disabled = false;
                        el.nextBtn.disabled = true;
                        break;
                }
                
                // 更新按钮状态
                if (this.currentStep === 0) {
                    el.prevBtn.disabled = true;
                }
                if (this.currentStep === this.totalSteps - 1) {
                    el.nextBtn.disabled = true;
                } else {
                    el.nextBtn.disabled = false;
                }
            },
            
            // 下一步
            next: function() {
                if (this.currentStep < this.totalSteps - 1) {
                    this.currentStep++;
                    this.updateScene();
                }
            },
            
            // 上一步
            prev: function() {
                if (this.currentStep > 0) {
                    this.currentStep--;
                    this.updateScene();
                }
            },
            
            // 初始化
            init: function() {
                el.prevBtn.addEventListener('click', () => this.prev());
                el.nextBtn.addEventListener('click', () => this.next());
                this.updateScene();
            }
        };
        
        const el = scene1.elements;
        scene1.init();
    })();
    </script>
</body>
</html>
