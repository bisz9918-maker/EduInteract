<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>南瓜花色遗传杂交实验</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene1-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #333; border-radius: 4px; background: #f5f5f5; }
        .scene1-btn:hover:not(:disabled) { background: #e0e0e0; }
        .scene1-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene1-genotype { fill: #e3f2fd; stroke: #1565c0; stroke-width: 1; opacity: 0; transition: opacity 0.3s; }
        .scene1-ratio { fill: #f5f5f5; stroke: #888; stroke-width: 1; stroke-dasharray: 4,2; opacity: 0; transition: opacity 0.3s; }
        .scene1-option { opacity: 0; transition: opacity 0.3s; }
        .scene1-highlight-blue { stroke: #1565c0; stroke-width: 3; }
        .scene1-highlight-red { stroke: #c62828; stroke-width: 3; }
        .scene1-arrow-highlight { stroke: #c62828; stroke-width: 3; }
        text { font-size: 14px; }
        .scene1-title { font-size: 16px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- 标题 -->
            <text x="400" y="35" text-anchor="middle" class="scene1-title">南瓜花色遗传杂交实验</text>
            
            <!-- P 代标签 -->
            <text x="50" y="80" class="scene1-label">P</text>
            
            <!-- P-黄花：矩形框 + 下方文字 -->
            <rect id="scene1-p-yellow" x="180" y="50" width="60" height="40" fill="#fff9c4" stroke="#333" stroke-width="2"/>
            <text x="210" y="100" text-anchor="middle" class="scene1-label">黄花</text>
            
            <!-- P-白花：矩形框 + 下方文字 -->
            <rect id="scene1-p-white" x="500" y="50" width="60" height="40" fill="#ffffff" stroke="#333" stroke-width="2"/>
            <text x="530" y="100" text-anchor="middle" class="scene1-label">白花</text>
            
            <!-- P 代×符号 -->
            <text x="360" y="78" text-anchor="middle" class="scene1-label">×</text>
            
            <!-- 过程①箭头（P→F₁） -->
            <path id="scene1-arrow-1a" d="M 240 70 L 320 70 L 320 110 L 400 110 L 480 70" fill="none" stroke="#000" stroke-width="2"/>
            <path id="scene1-arrow-1b" d="M 320 110 L 240 150" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
            <path id="scene1-arrow-1c" d="M 320 110 L 480 150" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
            
            <!-- 过程①编号圆圈 -->
            <circle id="scene1-circ-1" cx="320" cy="90" r="12" fill="#fff" stroke="#333" stroke-width="1"/>
            <text x="320" y="95" text-anchor="middle" class="scene1-label">①</text>
            
            <!-- F₁代标签 -->
            <text x="50" y="180" class="scene1-label">F₁</text>
            
            <!-- F₁-黄花：矩形框 + 下方文字 -->
            <rect id="scene1-f1-yellow" x="180" y="150" width="60" height="40" fill="#fff9c4" stroke="#333" stroke-width="2"/>
            <text x="210" y="200" text-anchor="middle" class="scene1-label">黄花</text>
            
            <!-- F₁-白花：矩形框 + 下方文字 -->
            <rect id="scene1-f1-white" x="500" y="150" width="60" height="40" fill="#ffffff" stroke="#333" stroke-width="2"/>
            <text x="530" y="200" text-anchor="middle" class="scene1-label">白花</text>
            
            <!-- 过程②箭头（F₁黄花→F₂） -->
            <path id="scene1-arrow-2" d="M 210 190 L 210 250" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
            
            <!-- 过程②编号圆圈 -->
            <circle id="scene1-circ-2" cx="210" cy="220" r="12" fill="#fff" stroke="#333" stroke-width="1"/>
            <text x="210" y="225" text-anchor="middle" class="scene1-label">②</text>
            
            <!-- 过程③箭头（F₁白花→F₂） -->
            <path id="scene1-arrow-3" d="M 530 190 L 530 230" fill="none" stroke="#000" stroke-width="2"/>
            <path id="scene1-arrow-3a" d="M 530 230 L 450 270" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
            <path id="scene1-arrow-3b" d="M 530 230 L 610 270" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
            
            <!-- 过程③编号圆圈 -->
            <circle id="scene1-circ-3" cx="530" cy="210" r="12" fill="#fff" stroke="#333" stroke-width="1"/>
            <text x="530" y="215" text-anchor="middle" class="scene1-label">③</text>
            
            <!-- F₂代标签 -->
            <text x="50" y="300" class="scene1-label">F₂</text>
            
            <!-- F₂-黄花 1（来自 F₁黄花）：矩形框 + 下方文字 -->
            <rect id="scene1-f2-yellow-1" x="180" y="270" width="60" height="40" fill="#fff9c4" stroke="#333" stroke-width="2"/>
            <text x="210" y="320" text-anchor="middle" class="scene1-label">黄花</text>
            
            <!-- F₂-黄花 2（来自 F₁白花）：矩形框 + 下方文字 -->
            <rect id="scene1-f2-yellow-2" x="420" y="270" width="60" height="40" fill="#fff9c4" stroke="#333" stroke-width="2"/>
            <text x="450" y="320" text-anchor="middle" class="scene1-label">黄花</text>
            
            <!-- F₂-白花（来自 F₁白花）：矩形框 + 下方文字 -->
            <rect id="scene1-f2-white" x="580" y="270" width="60" height="40" fill="#ffffff" stroke="#333" stroke-width="2"/>
            <text x="610" y="320" text-anchor="middle" class="scene1-label">白花</text>
            
            <!-- 箭头标记定义 -->
            <defs>
                <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
                </marker>
            </defs>
            
            <!-- 基因型标注框（步骤 2 显示）- 放在对应矩形下方 -->
            <rect id="scene1-gen-p-yellow" class="scene1-genotype" x="180" y="110" width="60" height="20" rx="3"/>
            <text id="scene1-gen-p-yellow-text" class="scene1-genotype" x="210" y="124" text-anchor="middle" fill="#c62828">aa</text>
            
            <rect id="scene1-gen-p-white" class="scene1-genotype" x="500" y="110" width="60" height="20" rx="3"/>
            <text id="scene1-gen-p-white-text" class="scene1-genotype" x="530" y="124" text-anchor="middle" fill="#1565c0">Aa</text>
            
            <rect id="scene1-gen-f1-yellow" class="scene1-genotype" x="180" y="210" width="60" height="20" rx="3"/>
            <text id="scene1-gen-f1-yellow-text" class="scene1-genotype" x="210" y="224" text-anchor="middle" fill="#c62828">aa</text>
            
            <rect id="scene1-gen-f1-white" class="scene1-genotype" x="500" y="210" width="60" height="20" rx="3"/>
            <text id="scene1-gen-f1-white-text" class="scene1-genotype" x="530" y="224" text-anchor="middle" fill="#1565c0">Aa</text>
            
            <rect id="scene1-gen-f2-yellow-2" class="scene1-genotype" x="420" y="330" width="60" height="20" rx="3"/>
            <text id="scene1-gen-f2-yellow-2-text" class="scene1-genotype" x="450" y="344" text-anchor="middle" fill="#1565c0">AA/Aa</text>
            
            <rect id="scene1-gen-f2-white" class="scene1-genotype" x="580" y="330" width="60" height="20" rx="3"/>
            <text id="scene1-gen-f2-white-text" class="scene1-genotype" x="610" y="344" text-anchor="middle" fill="#c62828">aa</text>
            
            <!-- 比例计算框（步骤 3 显示） -->
            <rect id="scene1-ratio-1" class="scene1-ratio" x="280" y="130" width="80" height="25" rx="3"/>
            <text id="scene1-ratio-1-text" class="scene1-ratio" x="320" y="146" text-anchor="middle" fill="#333">1:1</text>
            
            <rect id="scene1-ratio-3" class="scene1-ratio" x="480" y="240" width="80" height="25" rx="3"/>
            <text id="scene1-ratio-3-text" class="scene1-ratio" x="520" y="256" text-anchor="middle" fill="#333">3:1</text>
            
            <rect id="scene1-ratio-total" class="scene1-ratio" x="650" y="350" width="80" height="25" rx="3"/>
            <text id="scene1-ratio-total-text" class="scene1-ratio" x="690" y="366" text-anchor="middle" fill="#333">5:3</text>
            
            <!-- 显性提示框（步骤 1 显示） -->
            <rect id="scene1-dom-hint" x="650" y="160" width="120" height="30" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" rx="5" opacity="0"/>
            <text id="scene1-dom-hint-text" x="710" y="180" text-anchor="middle" fill="#1565c0" font-size="12" opacity="0">显性：白花</text>
            
            <!-- 选项分析区（步骤 4 显示） -->
            <rect id="scene1-option-area" x="50" y="380" width="700" height="60" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="5" opacity="0"/>
            
            <text id="scene1-option-a" class="scene1-option" x="70" y="405" fill="#2e7d32">✓ A．可验证分离定律</text>
            <text id="scene1-option-b" class="scene1-option" x="70" y="425" fill="#2e7d32">✓ B．白花是显性</text>
            <text id="scene1-option-c" class="scene1-option" x="280" y="405" fill="#2e7d32">✓ C．F₂比例 5:3</text>
            <text id="scene1-option-d" class="scene1-option" x="280" y="425" fill="#c62828">✗ D．F₁与 F₂白花基因型相同</text>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn" disabled>◀ 上一步</button>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
            <button id="scene1-btn-reset" class="scene1-btn">重置</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1: 南瓜花色遗传杂交实验
        // 布局坐标表（参考）：
        // | 元素 | 类型 | 位置/范围 | 备注 |
        // | P-黄花 | rect+text | (180, 50)-(240, 90) + 文字 (210,100) | 左侧亲本 |
        // | P-白花 | rect+text | (500, 50)-(560, 90) + 文字 (530,100) | 右侧亲本 |
        // | F₁-黄花 | rect+text | (180, 150)-(240, 190) + 文字 (210,200) | 左侧子一代 |
        // | F₁-白花 | rect+text | (500, 150)-(560, 190) + 文字 (530,200) | 右侧子一代 |
        // | F₂-黄花 1 | rect+text | (180, 270)-(240, 310) + 文字 (210,320) | F₁黄花自交后代 |
        // | F₂-黄花 2 | rect+text | (420, 270)-(480, 310) + 文字 (450,320) | F₁白花自交后代 |
        // | F₂-白花 | rect+text | (580, 270)-(640, 310) + 文字 (610,320) | F₁白花自交后代 |
        
        const scene1 = {
            currentStep: 0,
            maxStep: 4,
            
            // 工具函数：显示元素（同时设置 display 和 opacity）
            show: function(el) {
                if (el) {
                    el.style.display = 'block';
                    el.style.opacity = '1';
                }
            },
            
            // 工具函数：隐藏元素
            hide: function(el) {
                if (el) {
                    el.style.opacity = '0';
                    setTimeout(() => { if(el) el.style.display = 'none'; }, 300);
                }
            },
            
            // 工具函数：添加高亮类
            addHighlight: function(el, className) {
                if (el && !el.classList.contains(className)) {
                    el.classList.add(className);
                }
            },
            
            // 工具函数：移除高亮类
            removeHighlight: function(el, className) {
                if (el) {
                    el.classList.remove(className);
                }
            },
            
            // 更新显示状态
            updateDisplay: function() {
                const s = scene1;
                
                // 重置所有高亮
                s.removeHighlight(document.getElementById('scene1-f1-white'), 'scene1-highlight-blue');
                s.removeHighlight(document.getElementById('scene1-arrow-3'), 'scene1-arrow-highlight');
                s.removeHighlight(document.getElementById('scene1-arrow-3a'), 'scene1-arrow-highlight');
                s.removeHighlight(document.getElementById('scene1-arrow-3b'), 'scene1-arrow-highlight');
                
                // 步骤 0: 初始状态 - 只显示基础杂交图谱
                if (s.currentStep === 0) {
                    // 隐藏所有基因型、比例、选项
                    const genotypeEls = ['scene1-gen-p-yellow', 'scene1-gen-p-yellow-text',
                                         'scene1-gen-p-white', 'scene1-gen-p-white-text',
                                         'scene1-gen-f1-yellow', 'scene1-gen-f1-yellow-text',
                                         'scene1-gen-f1-white', 'scene1-gen-f1-white-text',
                                         'scene1-gen-f2-yellow-2', 'scene1-gen-f2-yellow-2-text',
                                         'scene1-gen-f2-white', 'scene1-gen-f2-white-text'];
                    genotypeEls.forEach(id => s.hide(document.getElementById(id)));
                    
                    const ratioEls = ['scene1-ratio-1', 'scene1-ratio-1-text',
                                      'scene1-ratio-3', 'scene1-ratio-3-text',
                                      'scene1-ratio-total', 'scene1-ratio-total-text'];
                    ratioEls.forEach(id => s.hide(document.getElementById(id)));
                    
                    s.hide(document.getElementById('scene1-dom-hint'));
                    s.hide(document.getElementById('scene1-dom-hint-text'));
                    s.hide(document.getElementById('scene1-option-area'));
                    ['scene1-option-a', 'scene1-option-b', 'scene1-option-c', 'scene1-option-d']
                        .forEach(id => s.hide(document.getElementById(id)));
                    
                    document.getElementById('scene1-btn-next').textContent = '下一步 ▶';
                }
                
                // 步骤 1: 显示显性判断
                if (s.currentStep >= 1) {
                    s.show(document.getElementById('scene1-dom-hint'));
                    s.show(document.getElementById('scene1-dom-hint-text'));
                    s.addHighlight(document.getElementById('scene1-f1-white'), 'scene1-highlight-blue');
                    s.addHighlight(document.getElementById('scene1-arrow-3'), 'scene1-arrow-highlight');
                    s.addHighlight(document.getElementById('scene1-arrow-3a'), 'scene1-arrow-highlight');
                    s.addHighlight(document.getElementById('scene1-arrow-3b'), 'scene1-arrow-highlight');
                }
                
                // 步骤 2: 显示所有基因型
                if (s.currentStep >= 2) {
                    const genotypeEls = ['scene1-gen-p-yellow', 'scene1-gen-p-yellow-text',
                                         'scene1-gen-p-white', 'scene1-gen-p-white-text',
                                         'scene1-gen-f1-yellow', 'scene1-gen-f1-yellow-text',
                                         'scene1-gen-f1-white', 'scene1-gen-f1-white-text',
                                         'scene1-gen-f2-yellow-2', 'scene1-gen-f2-yellow-2-text',
                                         'scene1-gen-f2-white', 'scene1-gen-f2-white-text'];
                    genotypeEls.forEach(id => s.show(document.getElementById(id)));
                }
                
                // 步骤 3: 显示比例计算
                if (s.currentStep >= 3) {
                    const ratioEls = ['scene1-ratio-1', 'scene1-ratio-1-text',
                                      'scene1-ratio-3', 'scene1-ratio-3-text',
                                      'scene1-ratio-total', 'scene1-ratio-total-text'];
                    ratioEls.forEach(id => s.show(document.getElementById(id)));
                }
                
                // 步骤 4: 显示选项分析
                if (s.currentStep >= 4) {
                    s.show(document.getElementById('scene1-option-area'));
                    s.show(document.getElementById('scene1-option-a'));
                    s.show(document.getElementById('scene1-option-b'));
                    s.show(document.getElementById('scene1-option-c'));
                    s.show(document.getElementById('scene1-option-d'));
                    document.getElementById('scene1-btn-next').textContent = '完成';
                }
                
                // 更新按钮状态
                document.getElementById('scene1-btn-prev').disabled = (s.currentStep === 0);
                if (s.currentStep === s.maxStep) {
                    document.getElementById('scene1-btn-next').disabled = true;
                } else {
                    document.getElementById('scene1-btn-next').disabled = false;
                }
            },
            
            // 下一步
            nextStep: function() {
                if (scene1.currentStep < scene1.maxStep) {
                    scene1.currentStep++;
                    scene1.updateDisplay();
                }
            },
            
            // 上一步
            prevStep: function() {
                if (scene1.currentStep > 0) {
                    scene1.currentStep--;
                    scene1.updateDisplay();
                }
            },
            
            // 重置
            reset: function() {
                scene1.currentStep = 0;
                scene1.updateDisplay();
            },
            
            // 初始化
            init: function() {
                document.getElementById('scene1-btn-next').addEventListener('click', () => scene1.nextStep());
                document.getElementById('scene1-btn-prev').addEventListener('click', () => scene1.prevStep());
                document.getElementById('scene1-btn-reset').addEventListener('click', () => scene1.reset());
                
                // 初始显示
                scene1.updateDisplay();
            }
        };
        
        // 启动
        scene1.init();
    })();
    </script>
</body>
</html>
