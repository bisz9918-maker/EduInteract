<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 3 - 经纬距离计算对比</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene3-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 2px solid #1565c0; border-radius: 4px; background: #ffffff; color: #1565c0; }
        .scene3-btn:hover { background: #e3f2fd; }
        .scene3-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene3-step-indicator { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); font-size: 14px; color: #333; }
        .scene3-fade-in { animation: scene3FadeIn 0.3s ease-in-out; }
        @keyframes scene3FadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg width="800" height="500" id="scene3-svg">
            <!-- 经线网格：7 条竖线，x 坐标分别为 50, 183, 316, 450, 583, 716, 850，y 范围 50-450 -->
            <line id="scene3-meridian-0" x1="50" y1="50" x2="50" y2="450" stroke="#000000" stroke-width="2"/>
            <line id="scene3-meridian-1" x1="183" y1="50" x2="183" y2="450" stroke="#000000" stroke-width="2"/>
            <line id="scene3-meridian-2" x1="316" y1="50" x2="316" y2="450" stroke="#000000" stroke-width="2"/>
            <line id="scene3-meridian-3" x1="450" y1="50" x2="450" y2="450" stroke="#000000" stroke-width="2"/>
            <line id="scene3-meridian-4" x1="583" y1="50" x2="583" y2="450" stroke="#000000" stroke-width="2"/>
            <line id="scene3-meridian-5" x1="716" y1="50" x2="716" y2="450" stroke="#000000" stroke-width="2"/>
            <line id="scene3-meridian-6" x1="850" y1="50" x2="850" y2="450" stroke="#000000" stroke-width="2"/>

            <!-- 纬线网格：7 条横线，y 坐标分别为 50, 117, 183, 250, 317, 383, 450，x 范围 50-750 -->
            <line id="scene3-parallel-0" x1="50" y1="50" x2="750" y2="50" stroke="#000000" stroke-width="2"/>
            <line id="scene3-parallel-1" x1="50" y1="117" x2="750" y2="117" stroke="#000000" stroke-width="2"/>
            <line id="scene3-parallel-2" x1="50" y1="183" x2="750" y2="183" stroke="#000000" stroke-width="2"/>
            <line id="scene3-parallel-3" x1="50" y1="250" x2="750" y2="250" stroke="#000000" stroke-width="2"/>
            <line id="scene3-parallel-4" x1="50" y1="317" x2="750" y2="317" stroke="#000000" stroke-width="2"/>
            <line id="scene3-parallel-5" x1="50" y1="383" x2="750" y2="383" stroke="#000000" stroke-width="2"/>
            <line id="scene3-parallel-6" x1="50" y1="450" x2="750" y2="450" stroke="#000000" stroke-width="2"/>

            <!-- B、C、D、E 四个点（蓝色实心圆）- 初始显示 -->
            <circle id="scene3-point-B" cx="450" cy="317" r="10" fill="#1565c0"/>
            <circle id="scene3-point-C" cx="450" cy="250" r="10" fill="#1565c0"/>
            <circle id="scene3-point-D" cx="583" cy="117" r="10" fill="#1565c0"/>
            <circle id="scene3-point-E" cx="716" cy="117" r="10" fill="#1565c0"/>

            <!-- 点标签 - 初始显示 -->
            <text id="scene3-label-B" x="465" y="322" font-size="16" fill="#000000">B</text>
            <text id="scene3-label-C" x="465" y="255" font-size="16" fill="#000000">C</text>
            <text id="scene3-label-D" x="598" y="112" font-size="16" fill="#000000">D</text>
            <text id="scene3-label-E" x="731" y="112" font-size="16" fill="#000000">E</text>

            <!-- 经度标注 - 初始显示（调整位置避免超出边界，字体缩小，移到更下方） -->
            <text x="50" y="478" font-size="9" fill="#000000" text-anchor="middle">180°W</text>
            <text x="183" y="478" font-size="9" fill="#000000" text-anchor="middle">120°W</text>
            <text x="316" y="478" font-size="9" fill="#000000" text-anchor="middle">60°W</text>
            <text x="450" y="478" font-size="9" fill="#000000" text-anchor="middle">0°</text>
            <text x="583" y="478" font-size="9" fill="#000000" text-anchor="middle">60°E</text>
            <text x="716" y="478" font-size="9" fill="#000000" text-anchor="middle">120°E</text>
            <text x="850" y="478" font-size="9" fill="#000000" text-anchor="middle">180°E</text>

            <!-- 纬度标注 - 初始显示（调整位置避免超出边界，字体缩小，移到更右侧） -->
            <text x="42" y="55" font-size="9" fill="#000000" text-anchor="end">90°N</text>
            <text x="42" y="122" font-size="9" fill="#000000" text-anchor="end">60°N</text>
            <text x="42" y="188" font-size="9" fill="#000000" text-anchor="end">30°N</text>
            <text x="42" y="255" font-size="9" fill="#000000" text-anchor="end">0°</text>
            <text x="42" y="322" font-size="9" fill="#000000" text-anchor="end">30°S</text>
            <text x="42" y="388" font-size="9" fill="#000000" text-anchor="end">60°S</text>
            <text x="42" y="455" font-size="9" fill="#000000" text-anchor="end">90°S</text>

            <!-- B→C 路径（红色线段）- 步骤 1 后显示 -->
            <line id="scene3-path-BC" x1="450" y1="317" x2="450" y2="250" stroke="#c62828" stroke-width="4" opacity="0"/>

            <!-- 纬度差 30°标签 - 步骤 1 后显示（调整位置避免与 C 点标签拥挤） -->
            <text id="scene3-label-lat-diff" x="400" y="283" font-size="14" fill="#c62828" opacity="0">纬度差 30°</text>

            <!-- 经线距离计算框（红色边框）- 步骤 2 后显示（调整位置到左侧中间，增加行距） -->
            <rect id="scene3-box-meridian" x="60" y="300" width="200" height="130" fill="rgba(198, 40, 40, 0.2)" stroke="#c62828" stroke-width="2" opacity="0"/>
            <text id="scene3-box-meridian-text1" x="70" y="325" font-size="11" fill="#000000" opacity="0">经线距离公式：</text>
            <text id="scene3-box-meridian-text2" x="70" y="348" font-size="11" fill="#000000" opacity="0">距离 = 纬度差 × 111km</text>
            <text id="scene3-box-meridian-text3" x="70" y="380" font-size="11" fill="#c62828" font-weight="bold" opacity="0">B→C 距离 = 30° × 111km</text>
            <text id="scene3-box-meridian-text4" x="70" y="403" font-size="11" fill="#c62828" font-weight="bold" opacity="0">= 3330km</text>

            <!-- D→E 路径（绿色线段）- 步骤 4 后显示 -->
            <line id="scene3-path-DE" x1="583" y1="117" x2="716" y2="117" stroke="#2e7d32" stroke-width="4" opacity="0"/>

            <!-- 经度差 60°标签 - 步骤 4 后显示 -->
            <text id="scene3-label-lon-diff" x="650" y="100" font-size="14" fill="#2e7d32" opacity="0">经度差 60°</text>

            <!-- 纬度 60°N 标签 - 步骤 4 后显示（调整位置避免拥挤） -->
            <text id="scene3-label-lat-60n" x="650" y="75" font-size="14" fill="#2e7d32" opacity="0">纬度 60°N</text>

            <!-- 纬线距离计算框（绿色边框）- 步骤 5 后显示（调整位置到右侧中间，增加行距） -->
            <rect id="scene3-box-parallel" x="540" y="140" width="200" height="130" fill="rgba(46, 125, 50, 0.2)" stroke="#2e7d32" stroke-width="2" opacity="0"/>
            <text id="scene3-box-parallel-text1" x="550" y="165" font-size="11" fill="#000000" opacity="0">纬线距离公式：</text>
            <text id="scene3-box-parallel-text2" x="550" y="188" font-size="11" fill="#000000" opacity="0">距离 = 经度差 × 111 × cos(纬度)</text>
            <text id="scene3-box-parallel-text3" x="550" y="220" font-size="11" fill="#2e7d32" font-weight="bold" opacity="0">D→E 距离 = 60° × 111 × cos60°</text>
            <text id="scene3-box-parallel-text4" x="550" y="243" font-size="11" fill="#2e7d32" font-weight="bold" opacity="0">= 60 × 111 × 0.5 = 3330km</text>

            <!-- 速度计算框（蓝色边框）- 步骤 7 后显示（调整位置到左下角，避免与经度标注重叠） -->
            <rect id="scene3-box-speed" x="60" y="440" width="200" height="50" fill="rgba(21, 101, 192, 0.2)" stroke="#1565c0" stroke-width="2" opacity="0"/>
            <text id="scene3-box-speed-text1" x="70" y="460" font-size="11" fill="#000000" opacity="0">飞机速度 = 3330km ÷ 3h</text>
            <text id="scene3-box-speed-text2" x="70" y="478" font-size="11" fill="#1565c0" font-weight="bold" opacity="0">= 1110km/h</text>

            <!-- 时间计算框（绿色边框）- 步骤 8 后显示（调整位置到右下角） -->
            <rect id="scene3-box-time" x="540" y="270" width="200" height="50" fill="rgba(46, 125, 50, 0.2)" stroke="#2e7d32" stroke-width="2" opacity="0"/>
            <text id="scene3-box-time-text1" x="550" y="290" font-size="11" fill="#000000" opacity="0">D→E 时间 = 3330km ÷ 1110km/h</text>
            <text id="scene3-box-time-text2" x="550" y="308" font-size="11" fill="#2e7d32" font-weight="bold" opacity="0">= 3 小时</text>
        </svg>

        <div id="scene3-step-indicator">步骤 1/9</div>
        <div id="scene3-controls">
            <button id="scene3-btn-prev" class="scene3-btn">◀ 上一步</button>
            <button id="scene3-btn-next" class="scene3-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 3 实现 - 经纬距离计算对比
        // 布局坐标表对照：
        // 经线 x 坐标：50, 183, 316, 450, 583, 716, 850
        // 纬线 y 坐标：50, 117, 183, 250, 317, 383, 450
        // B 点 (450, 317), C 点 (450, 250), D 点 (583, 117), E 点 (716, 117)

        const currentStepMax = 8;  // 步骤 0-8，共 9 个步骤
        let currentStep = 0;

        // 工具函数：显示元素（同时设置 display 和 opacity）
        function show(el) {
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '1';
                el.classList.add('scene3-fade-in');
            }
        }

        // 工具函数：隐藏元素
        function hide(el) {
            if (el) {
                el.style.opacity = '0';
                setTimeout(() => {
                    if (el) el.style.display = 'none';
                }, 300);
                el.classList.remove('scene3-fade-in');
            }
        }

        // 更新步骤显示
        function updateStepDisplay() {
            const indicator = document.getElementById('scene3-step-indicator');
            const prevBtn = document.getElementById('scene3-btn-prev');
            const nextBtn = document.getElementById('scene3-btn-next');

            // 更新步骤指示器
            indicator.textContent = '步骤 ' + (currentStep + 1) + '/9';

            // 更新按钮状态
            prevBtn.disabled = (currentStep === 0);
            nextBtn.disabled = (currentStep === currentStepMax);

            // 根据当前步骤显示/隐藏元素
            // 步骤 0：初始状态 - 只显示网格和点
            // 步骤 1：显示 B→C 路径和纬度差标签
            // 步骤 2：显示经线距离公式
            // 步骤 3：显示 B→C 距离计算结果
            // 步骤 4：显示 D→E 路径和经度差、纬度标签
            // 步骤 5：显示纬线距离公式
            // 步骤 6：显示 D→E 距离计算结果
            // 步骤 7：显示速度计算框
            // 步骤 8：显示时间计算框

            // 步骤 1：B→C 路径和纬度差标签
            if (currentStep >= 1) {
                show(document.getElementById('scene3-path-BC'));
                show(document.getElementById('scene3-label-lat-diff'));
            } else {
                hide(document.getElementById('scene3-path-BC'));
                hide(document.getElementById('scene3-label-lat-diff'));
            }

            // 步骤 2：经线距离公式
            if (currentStep >= 2) {
                show(document.getElementById('scene3-box-meridian'));
                show(document.getElementById('scene3-box-meridian-text1'));
                show(document.getElementById('scene3-box-meridian-text2'));
            } else if (currentStep === 1) {
                hide(document.getElementById('scene3-box-meridian'));
                hide(document.getElementById('scene3-box-meridian-text1'));
                hide(document.getElementById('scene3-box-meridian-text2'));
            }

            // 步骤 3：B→C 距离计算结果
            if (currentStep >= 3) {
                show(document.getElementById('scene3-box-meridian-text3'));
                show(document.getElementById('scene3-box-meridian-text4'));
            } else if (currentStep < 3) {
                hide(document.getElementById('scene3-box-meridian-text3'));
                hide(document.getElementById('scene3-box-meridian-text4'));
            }

            // 步骤 4：D→E 路径和标签
            if (currentStep >= 4) {
                show(document.getElementById('scene3-path-DE'));
                show(document.getElementById('scene3-label-lon-diff'));
                show(document.getElementById('scene3-label-lat-60n'));
            } else if (currentStep < 4) {
                hide(document.getElementById('scene3-path-DE'));
                hide(document.getElementById('scene3-label-lon-diff'));
                hide(document.getElementById('scene3-label-lat-60n'));
            }

            // 步骤 5：纬线距离公式
            if (currentStep >= 5) {
                show(document.getElementById('scene3-box-parallel'));
                show(document.getElementById('scene3-box-parallel-text1'));
                show(document.getElementById('scene3-box-parallel-text2'));
            } else if (currentStep < 5) {
                hide(document.getElementById('scene3-box-parallel'));
                hide(document.getElementById('scene3-box-parallel-text1'));
                hide(document.getElementById('scene3-box-parallel-text2'));
            }

            // 步骤 6：D→E 距离计算结果
            if (currentStep >= 6) {
                show(document.getElementById('scene3-box-parallel-text3'));
                show(document.getElementById('scene3-box-parallel-text4'));
            } else if (currentStep < 6) {
                hide(document.getElementById('scene3-box-parallel-text3'));
                hide(document.getElementById('scene3-box-parallel-text4'));
            }

            // 步骤 7：速度计算框
            if (currentStep >= 7) {
                show(document.getElementById('scene3-box-speed'));
                show(document.getElementById('scene3-box-speed-text1'));
                show(document.getElementById('scene3-box-speed-text2'));
            } else if (currentStep < 7) {
                hide(document.getElementById('scene3-box-speed'));
                hide(document.getElementById('scene3-box-speed-text1'));
                hide(document.getElementById('scene3-box-speed-text2'));
            }

            // 步骤 8：时间计算框
            if (currentStep >= 8) {
                show(document.getElementById('scene3-box-time'));
                show(document.getElementById('scene3-box-time-text1'));
                show(document.getElementById('scene3-box-time-text2'));
            } else if (currentStep < 8) {
                hide(document.getElementById('scene3-box-time'));
                hide(document.getElementById('scene3-box-time-text1'));
                hide(document.getElementById('scene3-box-time-text2'));
            }
        }

        // 按钮事件绑定
        document.getElementById('scene3-btn-prev').addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStepDisplay();
            }
        });

        document.getElementById('scene3-btn-next').addEventListener('click', function() {
            if (currentStep < currentStepMax) {
                currentStep++;
                updateStepDisplay();
            }
        });

        // 初始化显示
        updateStepDisplay();
    })();
    </script>
</body>
</html>
