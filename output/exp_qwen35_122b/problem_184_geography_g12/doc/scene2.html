<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 日照图判读与地理现象分析</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Microsoft YaHei', sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; background: #f5f5f5; padding: 8px 20px; border-radius: 8px; }
        .scene2-btn { padding: 8px 20px; font-size: 14px; cursor: pointer; border: none; border-radius: 4px; background: #1976d2; color: white; transition: background 0.3s; }
        .scene2-btn:hover:not(:disabled) { background: #1565c0; }
        .scene2-btn:disabled { background: #bdbdbd; cursor: not-allowed; }
        .scene2-step-indicator { font-size: 14px; color: #333333; font-weight: bold; min-width: 80px; text-align: center; }
        svg { display: block; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" id="scene2-svg">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene2-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#c62828"/>
                </marker>
            </defs>
            
            <!-- 夜半球阴影（左侧半圆） -->
            <path id="scene2-night-hemisphere" d="M 400,250 L 220,70 A 180,180 0 0,0 220,430 Z" fill="#1565c0" opacity="0.3" style="display: block;"/>
            
            <!-- 赤道纬线圈 -->
            <circle id="scene2-circle-equator" cx="400" cy="250" r="180" fill="none" stroke="#888888" stroke-width="1"/>
            <!-- 30°纬线圈 -->
            <circle id="scene2-circle-30" cx="400" cy="250" r="120" fill="none" stroke="#888888" stroke-width="1"/>
            <!-- 60°纬线圈 -->
            <circle id="scene2-circle-60" cx="400" cy="250" r="60" fill="none" stroke="#888888" stroke-width="1"/>
            
            <!-- 经线 -->
            <line id="scene2-line-0" x1="400" y1="250" x2="400" y2="70" stroke="#888888" stroke-width="1"/>
            <line id="scene2-line-180" x1="400" y1="250" x2="400" y2="430" stroke="#888888" stroke-width="1"/>
            <line id="scene2-line-90E" x1="400" y1="250" x2="580" y2="250" stroke="#888888" stroke-width="1"/>
            <line id="scene2-line-90W" x1="400" y1="250" x2="220" y2="250" stroke="#888888" stroke-width="1"/>
            
            <!-- 晨昏线（步骤 1 显示） -->
            <line id="scene2-line-terminator" x1="220" y1="70" x2="580" y2="430" stroke="#000000" stroke-width="3" style="display: none;"/>
            
            <!-- 太阳光线（步骤 2 显示） -->
            <line id="scene2-line-sunray-1" x1="650" y1="180" x2="580" y2="180" stroke="#c62828" stroke-width="2" marker-end="url(#scene2-arrowhead)" style="display: none;"/>
            <line id="scene2-line-sunray-2" x1="650" y1="250" x2="580" y2="250" stroke="#c62828" stroke-width="2" marker-end="url(#scene2-arrowhead)" style="display: none;"/>
            <line id="scene2-line-sunray-3" x1="650" y1="320" x2="580" y2="320" stroke="#c62828" stroke-width="2" marker-end="url(#scene2-arrowhead)" style="display: none;"/>
            
            <!-- 北极点 -->
            <circle id="scene2-point-northpole" cx="400" cy="250" r="4" fill="#000000"/>
            
            <!-- E、F、G 点 -->
            <circle id="scene2-point-E" cx="320" cy="190" r="6" fill="#000000"/>
            <circle id="scene2-point-F" cx="460" cy="250" r="6" fill="#000000"/>
            <circle id="scene2-point-G" cx="580" cy="250" r="6" fill="#000000"/>
            
            <!-- 直射点（步骤 2 显示，与 G 点重合但更大） -->
            <circle id="scene2-point-subpoint" cx="580" cy="250" r="8" fill="#2e7d32" style="display: none;"/>
            
            <!-- 标签 -->
            <!-- 经度标签 -->
            <text id="scene2-label-0" x="385" y="55" font-size="14" fill="#000000">0°</text>
            <text id="scene2-label-180" x="385" y="445" font-size="14" fill="#000000">180°</text>
            
            <!-- 纬度标签 -->
            <text id="scene2-label-60N" x="340" y="190" font-size="14" fill="#000000">60°N</text>
            <text id="scene2-label-equator" x="590" y="250" font-size="14" fill="#000000">赤道</text>
            
            <!-- 点标签 -->
            <text id="scene2-label-northpole" x="400" y="230" font-size="14" fill="#000000" text-anchor="middle">北极点</text>
            <text id="scene2-label-E" x="300" y="180" font-size="14" fill="#000000">E</text>
            <text id="scene2-label-F" x="470" y="235" font-size="14" fill="#000000">F</text>
            <text id="scene2-label-G" x="590" y="235" font-size="14" fill="#000000">G</text>
            
            <!-- 步骤 1：晨昏线标签 -->
            <text id="scene2-label-terminator" x="200" y="100" font-size="14" fill="#000000" style="display: none;">晨昏线</text>
            
            <!-- 步骤 2：直射点标签 -->
            <text id="scene2-label-subpoint" x="570" y="220" font-size="14" fill="#2e7d32" style="display: none;">直射点(23°26'N,90°E)</text>
            
            <!-- 步骤 2：太阳光线标签 -->
            <text id="scene2-label-sunray" x="660" y="250" font-size="14" fill="#c62828" style="display: none;">太阳光线</text>
            
            <!-- 步骤 3：昼夜半球标签 -->
            <text id="scene2-label-night" x="250" y="250" font-size="14" fill="#1565c0" style="display: none;">夜半球</text>
            <text id="scene2-label-day" x="550" y="250" font-size="14" fill="#ff6f00" style="display: none;">昼半球</text>
            
            <!-- 步骤 3：时间标注 -->
            <text id="scene2-label-time" x="590" y="270" font-size="16" fill="#c62828" font-weight="bold" style="display: none;">12:00</text>
            
            <!-- 步骤 4：昼夜长短说明 -->
            <text id="scene2-label-daylength" x="200" y="400" font-size="14" fill="#333333" style="display: none;">E 点：昼夜等长；F 点：昼夜等长；G 点：昼夜等长</text>
            
            <!-- 结论：答案框 -->
            <rect id="scene2-rect-answer" x="150" y="320" width="500" height="120" fill="#fff9c4" stroke="#fbc02d" stroke-width="2" rx="8" style="display: none;"/>
            <text id="scene2-label-answer" x="400" y="345" font-size="13" fill="#333333" text-anchor="middle" style="display: none;">节气：春分或秋分（二分日）</text>
            <text id="scene2-label-answer2" x="400" y="365" font-size="13" fill="#333333" text-anchor="middle" style="display: none;">直射点坐标：(0°, 90°E)</text>
            <text id="scene2-label-answer3" x="400" y="385" font-size="13" fill="#333333" text-anchor="middle" style="display: none;">北京时间：14 时（90°E 为 12 时，120°E 为 14 时）</text>
            <text id="scene2-label-answer4" x="400" y="405" font-size="13" fill="#333333" text-anchor="middle" style="display: none;">正午太阳高度公式：H = 90° - |φ - δ|</text>
            <text id="scene2-label-answer5" x="400" y="425" font-size="13" fill="#333333" text-anchor="middle" style="display: none;">自转线速度：G > F > E（纬度越低线速度越大）</text>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-prev-btn" class="scene2-btn" disabled>◀ 上一步</button>
            <span id="scene2-step-indicator" class="scene2-step-indicator">步骤 1/5</span>
            <button id="scene2-next-btn" class="scene2-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现
        // 布局坐标表（对照实现）：
        // 日照图中心：(400,250)
        // 赤道半径：180, 30°纬线圈半径：120, 60°纬线圈半径：60
        // 晨昏线：(220,70)-(580,430)
        // E 点：(320,190) - 60°纬线上, F 点：(460,250) - 30°纬线上, G 点：(580,250) - 赤道上
        // 直射点：(580,250) 与 G 点重合
        
        const currentStepMax = 5; // 0-5 共 6 个状态（0=初始，5=结论）
        let currentStep = 0;
        
        // 元素 ID 映射
        const elements = {
            // 晨昏线相关（步骤 1）
            terminator: ['scene2-line-terminator', 'scene2-label-terminator'],
            // 太阳光线和直射点（步骤 2）
            sunray: ['scene2-line-sunray-1', 'scene2-line-sunray-2', 'scene2-line-sunray-3', 'scene2-label-sunray', 'scene2-point-subpoint', 'scene2-label-subpoint'],
            // 昼夜半球和时间（步骤 3）
            hemisphere: ['scene2-label-night', 'scene2-label-day', 'scene2-label-time'],
            // 昼夜长短说明（步骤 4）
            daylength: ['scene2-label-daylength'],
            // 答案框（步骤 5/结论）
            answer: ['scene2-rect-answer', 'scene2-label-answer', 'scene2-label-answer2', 'scene2-label-answer3', 'scene2-label-answer4', 'scene2-label-answer5']
        };
        
        // 步骤描述
        const stepDescriptions = [
            '步骤 1/5',
            '步骤 2/5',
            '步骤 3/5',
            '步骤 4/5',
            '步骤 5/5',
            '结论'
        ];
        
        // 显示元素
        function show(elementIds) {
            if (Array.isArray(elementIds)) {
                elementIds.forEach(id => {
                    const el = document.getElementById(id);
                    if (el) {
                        el.style.display = 'block';
                        el.style.opacity = '1';
                    }
                });
            } else {
                const el = document.getElementById(elementIds);
                if (el) {
                    el.style.display = 'block';
                    el.style.opacity = '1';
                }
            }
        }
        
        // 隐藏元素
        function hide(elementIds) {
            if (Array.isArray(elementIds)) {
                elementIds.forEach(id => {
                    const el = document.getElementById(id);
                    if (el) {
                        el.style.display = 'none';
                        el.style.opacity = '0';
                    }
                });
            } else {
                const el = document.getElementById(elementIds);
                if (el) {
                    el.style.display = 'none';
                    el.style.opacity = '0';
                }
            }
        }
        
        // 渲染当前步骤
        function renderStep() {
            // 重置所有动态元素
            for (const key in elements) {
                hide(elements[key]);
            }
            
            // 根据当前步骤显示对应元素
            if (currentStep >= 1) {
                show(elements.terminator);
            }
            if (currentStep >= 2) {
                show(elements.sunray);
            }
            if (currentStep >= 3) {
                show(elements.hemisphere);
            }
            if (currentStep >= 4) {
                show(elements.daylength);
            }
            if (currentStep >= 5) {
                show(elements.answer);
            }
            
            // 更新步骤指示器
            document.getElementById('scene2-step-indicator').textContent = stepDescriptions[currentStep];
            
            // 更新按钮状态
            const prevBtn = document.getElementById('scene2-prev-btn');
            const nextBtn = document.getElementById('scene2-next-btn');
            
            prevBtn.disabled = (currentStep === 0);
            
            if (currentStep === currentStepMax) {
                nextBtn.textContent = '重播';
            } else {
                nextBtn.textContent = '下一步 ▶';
            }
        }
        
        // 下一步
        function nextStep() {
            if (currentStep < currentStepMax) {
                currentStep++;
                if (currentStep === currentStepMax) {
                    currentStep = 0; // 重播
                }
                renderStep();
            }
        }
        
        // 上一步
        function prevStep() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        }
        
        // 绑定事件
        document.getElementById('scene2-next-btn').addEventListener('click', nextStep);
        document.getElementById('scene2-prev-btn').addEventListener('click', prevStep);
        
        // 初始化
        renderStep();
    })();
    </script>
</body>
</html>
