<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四季形成机制流程图 - Scene 3</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 560px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 20px; z-index: 10; }
        .scene3-btn { padding: 8px 20px; font-size: 14px; background: #1976d2; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .scene3-btn:disabled { background: #bdbdbd; cursor: not-allowed; }
        .scene3-btn:hover:not(:disabled) { background: #1565c0; }
        #scene3-step-indicator { font-size: 14px; color: #424242; font-weight: bold; }
        
        /* 矩形框样式 */
        .scene3-box { fill: #ffffff; stroke: #000000; stroke-width: 2; }
        
        /* 文字样式 */
        .scene3-text { font-size: 13px; fill: #000000; text-anchor: middle; dominant-baseline: middle; }
        .scene3-text-parenthesis { font-size: 13px; fill: #c62828; font-weight: bold; }
        .scene3-text-answer { font-size: 13px; fill: #1565c0; font-weight: bold; }
        
        /* 箭头样式 */
        .scene3-arrow { stroke: #888880; stroke-width: 2; fill: none; stroke-dasharray: 5,3; }
        .scene3-arrow-highlight { stroke: #2e7d32; stroke-width: 3; fill: none; }
        
        /* 图标样式 */
        .scene3-icon { opacity: 0; transition: opacity 0.3s; }
        
        /* 渐变定义 */
        #scene3-four-seasons-gradient { stop-color: #4caf50; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg width="800" height="560">
            <defs>
                <!-- 四季渐变色 -->
                <linearGradient id="scene3-four-seasons-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#4caf50;stop-opacity:1" />
                    <stop offset="25%" style="stop-color:#f44336;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#ffeb3b;stop-opacity:1" />
                    <stop offset="75%" style="stop-color:#2196f3;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#4caf50;stop-opacity:1" />
                </linearGradient>
                <!-- 箭头标记 -->
                <marker id="scene3-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#888880" />
                </marker>
                <marker id="scene3-arrowhead-highlight" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32" />
                </marker>
            </defs>
            
            <!-- 第 1 层：自转和公转 -->
            <rect id="scene3-box-self-rotate" class="scene3-box" x="150" y="30" width="80" height="40" />
            <text id="scene3-text-self-rotate" class="scene3-text" x="190" y="55">自转</text>
            
            <rect id="scene3-box-orbit" class="scene3-box" x="570" y="30" width="80" height="40" />
            <text id="scene3-text-orbit" class="scene3-text" x="610" y="55">公转</text>
            
            <!-- 箭头 1、2：自转/公转 → 平面 -->
            <line id="scene3-arrow-1" class="scene3-arrow" x1="190" y1="70" x2="190" y2="100" marker-end="url(#scene3-arrowhead)" />
            <line id="scene3-arrow-2" class="scene3-arrow" x1="610" y1="70" x2="610" y2="100" marker-end="url(#scene3-arrowhead)" />
            
            <!-- 第 2 层：赤道平面和黄道平面 -->
            <rect id="scene3-box-equator-plane" class="scene3-box" x="130" y="100" width="120" height="40" />
            <text id="scene3-text-equator" class="scene3-text-parenthesis" x="190" y="125">( ) 平面</text>
            
            <rect id="scene3-box-ecliptic-plane" class="scene3-box" x="550" y="100" width="120" height="40" />
            <text id="scene3-text-ecliptic" class="scene3-text-parenthesis" x="610" y="125">( ) 平面</text>
            
            <!-- 箭头 3、4：平面 → 黄赤交角（斜向汇聚） -->
            <line id="scene3-arrow-3" class="scene3-arrow" x1="250" y1="140" x2="350" y2="170" marker-end="url(#scene3-arrowhead)" />
            <line id="scene3-arrow-4" class="scene3-arrow" x1="550" y1="140" x2="450" y2="170" marker-end="url(#scene3-arrowhead)" />
            
            <!-- 第 3 层：黄赤交角 -->
            <rect id="scene3-box-obliquity" class="scene3-box" x="350" y="170" width="150" height="40" />
            <text id="scene3-text-obliquity" class="scene3-text-parenthesis" x="425" y="195">( ) 交角</text>
            
            <!-- 箭头 5：黄赤交角 → 直射点回归 -->
            <line id="scene3-arrow-5" class="scene3-arrow" x1="425" y1="210" x2="425" y2="240" marker-end="url(#scene3-arrowhead)" />
            
            <!-- 第 4 层：直射点回归 -->
            <rect id="scene3-box-solar-zenith" class="scene3-box" x="320" y="240" width="210" height="40" />
            <text id="scene3-text-solar-zenith" class="scene3-text" x="425" y="265">直射点回归</text>
            
            <!-- 箭头 6、7：直射点回归 → 左右分支 -->
            <line id="scene3-arrow-6" class="scene3-arrow" x1="320" y1="280" x2="200" y2="310" marker-end="url(#scene3-arrowhead)" />
            <line id="scene3-arrow-7" class="scene3-arrow" x1="530" y1="280" x2="650" y2="310" marker-end="url(#scene3-arrowhead)" />
            
            <!-- 第 5 层：正午太阳高度和昼夜长短 -->
            <rect id="scene3-box-solar-height" class="scene3-box" x="100" y="310" width="200" height="40" />
            <text id="scene3-text-solar-height" class="scene3-text-parenthesis" x="200" y="335">( ) 变化</text>
            
            <rect id="scene3-box-day-night" class="scene3-box" x="500" y="310" width="200" height="40" />
            <text id="scene3-text-day-night" class="scene3-text-parenthesis" x="600" y="335">( ) 变化</text>
            
            <!-- 箭头 8、9：左右分支 → 地面受热 -->
            <line id="scene3-arrow-8" class="scene3-arrow" x1="200" y1="350" x2="280" y2="380" marker-end="url(#scene3-arrowhead)" />
            <line id="scene3-arrow-9" class="scene3-arrow" x1="650" y1="350" x2="520" y2="380" marker-end="url(#scene3-arrowhead)" />
            
            <!-- 第 6 层：地面受热多少变化 -->
            <rect id="scene3-box-heat" class="scene3-box" x="280" y="380" width="240" height="40" />
            <text id="scene3-text-heat" class="scene3-text" x="400" y="405">地面受热多少变化</text>
            
            <!-- 箭头 10：地面受热 → 季节变化 -->
            <line id="scene3-arrow-10" class="scene3-arrow" x1="400" y1="420" x2="400" y2="440" marker-end="url(#scene3-arrowhead)" />
            
            <!-- 第 7 层：季节变化 -->
            <rect id="scene3-box-season" class="scene3-box" x="330" y="440" width="140" height="35" />
            <text id="scene3-text-season" class="scene3-text-parenthesis" x="400" y="458">( ) 变化</text>
            
            <!-- 温度计图标 -->
            <g id="scene3-icon-thermometer" class="scene3-icon" transform="translate(450, 445)">
                <rect x="0" y="0" width="24" height="35" fill="#ffe0b2" stroke="#e65100" stroke-width="1" rx="3"/>
                <line x1="12" y1="5" x2="12" y2="25" stroke="#e65100" stroke-width="2"/>
                <circle cx="12" cy="28" r="6" fill="#e65100"/>
            </g>
            
            <!-- 箭头 11：季节变化 → 四季交替 -->
            <line id="scene3-arrow-11" class="scene3-arrow" x1="400" y1="475" x2="400" y2="490" marker-end="url(#scene3-arrowhead)" />
            
            <!-- 第 8 层：四季交替 -->
            <rect id="scene3-box-four-seasons" class="scene3-box" x="330" y="490" width="140" height="35" />
            <text id="scene3-text-four-seasons" class="scene3-text" x="400" y="512">四季交替</text>
            
            <!-- 日历图标 -->
            <g id="scene3-icon-calendar" class="scene3-icon" transform="translate(450, 495)">
                <rect x="0" y="0" width="24" height="30" fill="#e3f2fd" stroke="#1976d2" stroke-width="1" rx="2"/>
                <line x1="4" y1="8" x2="20" y2="8" stroke="#1976d2" stroke-width="1"/>
                <line x1="8" y1="12" x2="10" y2="18" stroke="#1976d2" stroke-width="1"/>
                <line x1="14" y1="12" x2="16" y2="18" stroke="#1976d2" stroke-width="1"/>
                <line x1="20" y1="12" x2="22" y2="18" stroke="#1976d2" stroke-width="1"/>
            </g>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene3-controls">
            <button id="scene3-btn-prev" class="scene3-btn" disabled>◀ 上一步</button>
            <span id="scene3-step-indicator">步骤 1/5</span>
            <button id="scene3-btn-next" class="scene3-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 3 实现 - 四季形成机制流程图
        
        // 状态变量
        var currentStep = 0;
        var totalSteps = 5;
        
        // 答案映射表
        var answers = {
            'equator': '赤道',
            'ecliptic': '黄道',
            'obliquity': '黄赤',
            'solarHeight': '正午太阳高度',
            'dayNight': '昼夜长短',
            'season': '季节'
        };
        
        // 元素引用缓存
        var elements = {};
        
        // 初始化：缓存所有 DOM 元素
        function initElements() {
            elements = {
                // 按钮
                prevBtn: document.getElementById('scene3-btn-prev'),
                nextBtn: document.getElementById('scene3-btn-next'),
                indicator: document.getElementById('scene3-step-indicator'),
                
                // 答案文本元素（整体文本）
                equator: document.getElementById('scene3-text-equator'),
                ecliptic: document.getElementById('scene3-text-ecliptic'),
                obliquity: document.getElementById('scene3-text-obliquity'),
                solarHeight: document.getElementById('scene3-text-solar-height'),
                dayNight: document.getElementById('scene3-text-day-night'),
                season: document.getElementById('scene3-text-season'),
                
                // 箭头元素
                arrow3: document.getElementById('scene3-arrow-3'),
                arrow4: document.getElementById('scene3-arrow-4'),
                arrow6: document.getElementById('scene3-arrow-6'),
                arrow7: document.getElementById('scene3-arrow-7'),
                arrow8: document.getElementById('scene3-arrow-8'),
                arrow9: document.getElementById('scene3-arrow-9'),
                arrow10: document.getElementById('scene3-arrow-10'),
                
                // 图标
                thermometer: document.getElementById('scene3-icon-thermometer'),
                calendar: document.getElementById('scene3-icon-calendar'),
                
                // 四季交替框
                fourSeasonsBox: document.getElementById('scene3-box-four-seasons')
            };
        }
        
        // 显示答案文本
        function showAnswer(element, answer) {
            // 将 ( ) 替换为答案，保持后缀
            var textContent = element.textContent;
            var suffix = textContent.split(')')[1] || '';
            element.textContent = answer + suffix;
            element.classList.remove('scene3-text-parenthesis');
            element.classList.add('scene3-text-answer');
        }
        
        // 高亮箭头
        function highlightArrow(arrowEl) {
            arrowEl.classList.remove('scene3-arrow');
            arrowEl.classList.add('scene3-arrow-highlight');
            arrowEl.setAttribute('marker-end', 'url(#scene3-arrowhead-highlight)');
        }
        
        // 更新步骤指示器
        function updateIndicator() {
            elements.indicator.textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;
            elements.prevBtn.disabled = (currentStep === 0);
            elements.nextBtn.disabled = (currentStep === totalSteps - 1);
        }
        
        // 更新显示状态
        function updateDisplay() {
            // 步骤 0：初始状态（已显示框架）
            // 步骤 1：揭示赤道平面、黄道平面、黄赤交角答案，高亮箭头 3、4
            if (currentStep >= 1) {
                showAnswer(elements.equator, answers.equator);
                showAnswer(elements.ecliptic, answers.ecliptic);
                showAnswer(elements.obliquity, answers.obliquity);
                highlightArrow(elements.arrow3);
                highlightArrow(elements.arrow4);
            }
            
            // 步骤 2：揭示正午太阳高度变化，高亮箭头 6，显示温度计图标
            if (currentStep >= 2) {
                showAnswer(elements.solarHeight, answers.solarHeight);
                highlightArrow(elements.arrow6);
                elements.thermometer.style.opacity = '1';
            }
            
            // 步骤 3：揭示昼夜长短变化，高亮箭头 7、8、9
            if (currentStep >= 3) {
                showAnswer(elements.dayNight, answers.dayNight);
                highlightArrow(elements.arrow7);
                highlightArrow(elements.arrow8);
                highlightArrow(elements.arrow9);
            }
            
            // 步骤 4：揭示季节变化，高亮箭头 10，显示日历图标，四季交替框渐变背景
            if (currentStep >= 4) {
                showAnswer(elements.season, answers.season);
                highlightArrow(elements.arrow10);
                elements.calendar.style.opacity = '1';
                elements.fourSeasonsBox.style.fill = 'url(#scene3-four-seasons-gradient)';
            }
            
            updateIndicator();
        }
        
        // 事件绑定
        function bindEvents() {
            elements.prevBtn.addEventListener('click', function() {
                if (currentStep > 0) {
                    currentStep--;
                    resetAndRender();
                }
            });
            
            elements.nextBtn.addEventListener('click', function() {
                if (currentStep < totalSteps - 1) {
                    currentStep++;
                    updateDisplay();
                }
            });
        }
        
        // 重置并重新渲染（用于上一步按钮）
        function resetAndRender() {
            // 重置所有答案文本
            var answerElements = [
                { el: elements.equator, default: '( ) 平面' },
                { el: elements.ecliptic, default: '( ) 平面' },
                { el: elements.obliquity, default: '( ) 交角' },
                { el: elements.solarHeight, default: '( ) 变化' },
                { el: elements.dayNight, default: '( ) 变化' },
                { el: elements.season, default: '( ) 变化' }
            ];
            answerElements.forEach(function(item) {
                item.el.textContent = item.default;
                item.el.classList.remove('scene3-text-answer');
                item.el.classList.add('scene3-text-parenthesis');
            });
            
            // 重置所有箭头
            var arrowElements = [
                elements.arrow3, elements.arrow4, elements.arrow6, elements.arrow7,
                elements.arrow8, elements.arrow9, elements.arrow10
            ];
            arrowElements.forEach(function(el) {
                el.classList.remove('scene3-arrow-highlight');
                el.classList.add('scene3-arrow');
                el.setAttribute('marker-end', 'url(#scene3-arrowhead)');
            });
            
            // 重置图标
            elements.thermometer.style.opacity = '0';
            elements.calendar.style.opacity = '0';
            
            // 重置四季交替框
            elements.fourSeasonsBox.style.fill = '#ffffff';
            
            // 重新应用当前步骤
            updateDisplay();
        }
        
        // 初始化
        function init() {
            initElements();
            bindEvents();
            updateDisplay();
        }
        
        // 页面加载完成后初始化
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>
</body>
</html>
