<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四季形成原理 - 地球运动与平面交角</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene1-btn { width: 100px; height: 30px; background: #1565c0; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .scene1-btn:hover { background: #0d47a1; }
        .scene1-btn:disabled { background: #90a4ae; cursor: not-allowed; opacity: 0.5; }
        .scene1-box { fill: rgba(245, 245, 245, 0.2); stroke: #000000; stroke-width: 2; }
        .scene1-arrow { stroke: #000000; stroke-width: 3; fill: none; marker-end: url(#scene1-arrowhead); }
        .scene1-text-blue { fill: #1565c0; font-size: 16px; font-weight: bold; }
        .scene1-text-red { fill: #c62828; font-size: 16px; font-weight: bold; }
        .scene1-text-black { fill: #000000; font-size: 16px; }
        .scene1-dashed { stroke: #888880; stroke-width: 2; stroke-dasharray: 5,5; fill: none; }
        .scene1-element { opacity: 0; transition: opacity 0.3s ease; }
        .scene1-element.visible { opacity: 1; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500">
            <defs>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#000000" />
                </marker>
                <marker id="scene1-arrowhead-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#1565c0" />
                </marker>
            </defs>

            <!-- 自转框组（框 + 文字组合） -->
            <g id="scene1-group-rotate" class="scene1-element">
                <rect id="scene1-box-rotate" class="scene1-box" x="150" y="40" width="100" height="50" />
                <text id="scene1-text-rotate" class="scene1-text-blue" x="200" y="70" text-anchor="middle" dominant-baseline="middle">自转</text>
            </g>

            <!-- 公转框组（框 + 文字组合） -->
            <g id="scene1-group-revolve" class="scene1-element">
                <rect id="scene1-box-revolve" class="scene1-box" x="550" y="40" width="100" height="50" />
                <text id="scene1-text-revolve" class="scene1-text-blue" x="600" y="70" text-anchor="middle" dominant-baseline="middle">公转</text>
            </g>

            <!-- 自转→箭头 -->
            <path id="scene1-arrow-rotate-down" class="scene1-arrow scene1-element" d="M 200 90 L 200 130" />

            <!-- 公转→箭头 -->
            <path id="scene1-arrow-revolve-down" class="scene1-arrow scene1-element" d="M 600 90 L 600 130" />

            <!-- 赤道平面框组（框 + 文字组合） -->
            <g id="scene1-group-equator" class="scene1-element">
                <rect id="scene1-box-equator" class="scene1-box" x="100" y="140" width="150" height="50" />
                <text id="scene1-text-equator" x="175" y="170" text-anchor="middle" dominant-baseline="middle"></text>
            </g>

            <!-- 黄道平面框组（框 + 文字组合） -->
            <g id="scene1-group-ecliptic" class="scene1-element">
                <rect id="scene1-box-ecliptic" class="scene1-box" x="550" y="140" width="150" height="50" />
                <text id="scene1-text-ecliptic" x="625" y="170" text-anchor="middle" dominant-baseline="middle"></text>
            </g>

            <!-- 左→箭头（斜向右下） -->
            <path id="scene1-arrow-left-down" class="scene1-arrow scene1-element" d="M 250 190 L 380 230" />

            <!-- 右→箭头（斜向左下） -->
            <path id="scene1-arrow-right-down" class="scene1-arrow scene1-element" d="M 550 190 L 420 230" />

            <!-- 黄赤交角框组（框 + 文字组合） -->
            <g id="scene1-group-obliquity" class="scene1-element">
                <rect id="scene1-box-obliquity" class="scene1-box" x="325" y="240" width="150" height="50" />
                <text id="scene1-text-obliquity" x="400" y="270" text-anchor="middle" dominant-baseline="middle"></text>
            </g>

            <!-- 左地球示意（自转辅助图） -->
            <g id="scene1-group-rotate-demo" class="scene1-element">
                <circle cx="100" cy="330" r="40" class="scene1-dashed" />
                <line x1="100" y1="290" x2="100" y2="370" class="scene1-dashed" />
                <text x="100" y="385" text-anchor="middle" class="scene1-text-black" style="font-size: 12px;">自转示意</text>
            </g>

            <!-- 右地球示意（公转辅助图） -->
            <g id="scene1-group-revolve-demo" class="scene1-element">
                <circle cx="700" cy="330" r="40" class="scene1-dashed" />
                <ellipse cx="700" cy="330" rx="50" ry="30" class="scene1-dashed" />
                <text x="700" y="385" text-anchor="middle" class="scene1-text-black" style="font-size: 12px;">公转示意</text>
            </g>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-prev-btn" class="scene1-btn" disabled>◀ 上一步</button>
            <button id="scene1-next-btn" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现：地球运动与平面交角（四季形成原理的第一步）
        // 布局坐标表对照：
        // | 元素 | 位置/范围 | 大小 |
        // | 自转框组 | (150,40)-(250,90) | 100×50 |
        // | 公转框组 | (550,40)-(650,90) | 100×50 |
        // | 自转→箭头 | (200,90)-(200,130) | 4×40 |
        // | 公转→箭头 | (600,90)-(600,130) | 4×40 |
        // | 赤道平面框组 | (100,140)-(250,190) | 150×50 |
        // | 黄道平面框组 | (550,140)-(700,190) | 150×50 |
        // | 左→箭头 | (250,190)-(380,230) | 斜向右下 |
        // | 右→箭头 | (550,190)-(420,230) | 斜向左下 |
        // | 黄赤交角框组 | (325,240)-(475,290) | 150×50 |
        // | 左地球示意 | (50,280)-(150,380) | 100×100 |
        // | 右地球示意 | (650,280)-(750,380) | 100×100 |
        // | 控件栏 | (250,420)-(550,470) | 300×50 |

        const currentStepMax = 3;
        let currentStep = 0;

        // 元素分组：按步骤显示（使用 group 元素）
        const stepElements = {
            0: [
                'scene1-group-rotate', 'scene1-group-revolve',
                'scene1-group-equator', 'scene1-group-ecliptic', 'scene1-group-obliquity',
                'scene1-arrow-rotate-down', 'scene1-arrow-revolve-down',
                'scene1-arrow-left-down', 'scene1-arrow-right-down',
                'scene1-group-rotate-demo', 'scene1-group-revolve-demo'
            ],
            1: [
                'scene1-group-rotate', 'scene1-group-revolve',
                'scene1-arrow-rotate-down', 'scene1-arrow-revolve-down'
            ],
            2: [
                'scene1-group-equator', 'scene1-group-ecliptic',
                'scene1-arrow-left-down', 'scene1-arrow-right-down'
            ],
            3: [
                'scene1-group-obliquity'
            ]
        };

        // 文本内容配置
        const textContents = {
            'scene1-text-rotate': { type: 'blue', content: '自转' },
            'scene1-text-revolve': { type: 'blue', content: '公转' },
            'scene1-text-equator': { type: 'redblue', content: '()', suffix: '平面' },
            'scene1-text-ecliptic': { type: 'redblue', content: '()', suffix: '平面' },
            'scene1-text-obliquity': { type: 'redblue', content: '()', suffix: '交角' }
        };

        // 工具函数：显示元素
        function showElement(elementId) {
            const el = document.getElementById(elementId);
            if (el) {
                el.classList.add('visible');
                el.style.opacity = '1';
            }
        }

        // 工具函数：隐藏元素
        function hideElement(elementId) {
            const el = document.getElementById(elementId);
            if (el) {
                el.classList.remove('visible');
                el.style.opacity = '0';
            }
        }

        // 设置文本内容
        function setTextContent(elementId) {
            const config = textContents[elementId];
            if (!config) return;

            const el = document.getElementById(elementId);
            if (!el) return;

            if (config.type === 'blue') {
                el.textContent = config.content;
                el.className = 'scene1-text-blue';
            } else if (config.type === 'redblue') {
                el.innerHTML = `<span class="scene1-text-red">${config.content}</span><span class="scene1-text-blue">${config.suffix}</span>`;
            }
        }

        // 更新当前步骤
        function updateStep(step) {
            currentStep = step;

            // 隐藏所有步骤相关元素
            for (let s = 0; s <= currentStepMax; s++) {
                stepElements[s].forEach(id => hideElement(id));
            }

            // 显示当前步骤及之前步骤的元素
            for (let s = 0; s <= currentStep; s++) {
                stepElements[s].forEach(id => showElement(id));
            }

            // 设置文本内容
            Object.keys(textContents).forEach(id => {
                if (id === 'scene1-text-rotate' || id === 'scene1-text-revolve') {
                    if (currentStep >= 1) setTextContent(id);
                } else if (id === 'scene1-text-equator' || id === 'scene1-text-ecliptic') {
                    if (currentStep >= 2) setTextContent(id);
                } else if (id === 'scene1-text-obliquity') {
                    if (currentStep >= 3) setTextContent(id);
                }
            });

            // 更新按钮状态
            const prevBtn = document.getElementById('scene1-prev-btn');
            const nextBtn = document.getElementById('scene1-next-btn');

            prevBtn.disabled = (currentStep === 0);
            nextBtn.disabled = (currentStep === currentStepMax);
        }

        // 事件绑定
        document.getElementById('scene1-prev-btn').addEventListener('click', function() {
            if (currentStep > 0) {
                updateStep(currentStep - 1);
            }
        });

        document.getElementById('scene1-next-btn').addEventListener('click', function() {
            if (currentStep < currentStepMax) {
                updateStep(currentStep + 1);
            }
        });

        // 初始化：显示步骤 0
        updateStep(0);
    })();
    </script>
</body>
</html>
