<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太阳直射点的回归运动 - Scene 1</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            padding: 8px 20px;
            font-size: 14px;
            cursor: pointer;
            border: 2px solid #1565c0;
            background: #ffffff;
            color: #1565c0;
            border-radius: 4px;
            transition: all 0.3s;
        }
        #scene1-controls button:hover:not(:disabled) {
            background: #1565c0;
            color: #ffffff;
        }
        #scene1-controls button:disabled {
            border-color: #ccc;
            color: #ccc;
            cursor: not-allowed;
        }
        .scene1-info-box {
            position: absolute;
            background: #fff9c4;
            border: 2px solid #f57f17;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 12px;
            line-height: 1.5;
            display: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 5;
            width: 100px;
        }
        .scene1-info-box.visible {
            display: block;
            opacity: 1;
        }
        .scene1-title {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 18px;
            font-weight: bold;
            color: #1565c0;
            display: none;
        }
        .scene1-title.visible {
            display: block;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <!-- 标题 -->
        <div id="scene1-title" class="scene1-title">太阳直射点的回归运动</div>

        <!-- SVG 图示区：固定 800×500px -->
        <svg width="800" height="500" id="scene1-svg">
            <!-- 北回归线 -->
            <line id="scene1-line-tropic-north" x1="100" y1="120" x2="700" y2="120" 
                  stroke="#666" stroke-width="1" stroke-dasharray="5,5"/>
            <!-- 赤道 -->
            <line id="scene1-line-equator" x1="100" y1="250" x2="700" y2="250" 
                  stroke="#666" stroke-width="2"/>
            <!-- 南回归线 -->
            <line id="scene1-line-tropic-south" x1="100" y1="380" x2="700" y2="380" 
                  stroke="#666" stroke-width="1" stroke-dasharray="5,5"/>

            <!-- 纬线标签（移到更右侧） -->
            <text id="scene1-label-tropic-north" x="720" y="125" font-size="14" fill="#333" text-anchor="start">北回归线</text>
            <text id="scene1-label-equator" x="720" y="255" font-size="14" fill="#333" text-anchor="start">赤道</text>
            <text id="scene1-label-tropic-south" x="720" y="385" font-size="14" fill="#333" text-anchor="start">南回归线</text>

            <!-- 运动轨迹 -->
            <polyline id="scene1-path-trajectory" points="100,250 250,120 400,250 550,380 700,250" 
                      fill="none" stroke="#1565c0" stroke-width="2"/>

            <!-- 四个关键点 -->
            <circle id="scene1-point-1" cx="100" cy="250" r="6" fill="#d32f2f"/>
            <circle id="scene1-point-2" cx="250" cy="120" r="6" fill="#d32f2f"/>
            <circle id="scene1-point-3" cx="400" cy="250" r="6" fill="#d32f2f"/>
            <circle id="scene1-point-4" cx="550" cy="380" r="6" fill="#d32f2f"/>

            <!-- 高亮外圈（初始隐藏） -->
            <circle id="scene1-highlight-1" cx="100" cy="250" r="10" fill="none" stroke="#2e7d32" stroke-width="3" opacity="0"/>
            <circle id="scene1-highlight-2" cx="250" cy="120" r="10" fill="none" stroke="#2e7d32" stroke-width="3" opacity="0"/>
            <circle id="scene1-highlight-3" cx="400" cy="250" r="10" fill="none" stroke="#2e7d32" stroke-width="3" opacity="0"/>
            <circle id="scene1-highlight-4" cx="550" cy="380" r="10" fill="none" stroke="#2e7d32" stroke-width="3" opacity="0"/>

            <!-- 序号标签（移到点的外侧，远离轨迹线） -->
            <text id="scene1-label-1" x="75" y="255" font-size="16" fill="#d32f2f" font-weight="bold">①</text>
            <text id="scene1-label-2" x="245" y="105" font-size="16" fill="#d32f2f" font-weight="bold">②</text>
            <text id="scene1-label-3" x="375" y="285" font-size="16" fill="#d32f2f" font-weight="bold">③</text>
            <text id="scene1-label-4" x="545" y="395" font-size="16" fill="#d32f2f" font-weight="bold">④</text>

            <!-- 移动方向箭头（初始隐藏） -->
            <defs>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#1565c0"/>
                </marker>
            </defs>
            <line id="scene1-arrow-1" x1="120" y1="240" x2="200" y2="150" 
                  stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrowhead)" opacity="0"/>
            <line id="scene1-arrow-2" x1="270" y1="150" x2="350" y2="240" 
                  stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrowhead)" opacity="0"/>
            <line id="scene1-arrow-3" x1="420" y1="240" x2="500" y2="350" 
                  stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrowhead)" opacity="0"/>
            <line id="scene1-arrow-4" x1="570" y1="350" x2="650" y2="240" 
                  stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrowhead)" opacity="0"/>
        </svg>

        <!-- 信息标注框（移到右侧空白区域，避免与图形重叠） -->
        <div id="scene1-info-1" class="scene1-info-box" style="left: 640px; top: 170px;">
            <strong>① 春分</strong><br>
            3 月 21 日前后<br>
            直射赤道，向北
        </div>
        <div id="scene1-info-2" class="scene1-info-box" style="left: 640px; top: 40px;">
            <strong>② 夏至</strong><br>
            6 月 22 日前后<br>
            直射北回归线
        </div>
        <div id="scene1-info-3" class="scene1-info-box" style="left: 640px; top: 250px;">
            <strong>③ 秋分</strong><br>
            9 月 23 日前后<br>
            直射赤道，向南
        </div>
        <div id="scene1-info-4" class="scene1-info-box" style="left: 640px; top: 380px;">
            <strong>④ 冬至</strong><br>
            12 月 22 日前后<br>
            直射南回归线
        </div>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1: 太阳直射点回归运动示意图
        // 坐标表对照：
        // 北回归线：(100,120)-(700,120)
        // 赤道：(100,250)-(700,250)
        // 南回归线：(100,380)-(700,380)
        // 点①：(100,250) 春分
        // 点②：(250,120) 夏至
        // 点③：(400,250) 秋分
        // 点④：(550,380) 冬至

        const scene1 = {
            currentStep: 0,
            totalSteps: 6, // 0-5 共 6 个状态

            // DOM 元素缓存
            elements: {
                highlights: [
                    document.getElementById('scene1-highlight-1'),
                    document.getElementById('scene1-highlight-2'),
                    document.getElementById('scene1-highlight-3'),
                    document.getElementById('scene1-highlight-4')
                ],
                infoBoxes: [
                    document.getElementById('scene1-info-1'),
                    document.getElementById('scene1-info-2'),
                    document.getElementById('scene1-info-3'),
                    document.getElementById('scene1-info-4')
                ],
                arrows: [
                    document.getElementById('scene1-arrow-1'),
                    document.getElementById('scene1-arrow-2'),
                    document.getElementById('scene1-arrow-3'),
                    document.getElementById('scene1-arrow-4')
                ],
                title: document.getElementById('scene1-title'),
                btnPrev: document.getElementById('scene1-btn-prev'),
                btnNext: document.getElementById('scene1-btn-next')
            },

            // 显示元素
            show: function(el) {
                if (el) {
                    el.style.display = 'block';
                    el.style.opacity = '1';
                }
            },

            // 隐藏元素
            hide: function(el) {
                if (el) {
                    el.style.display = 'none';
                    el.style.opacity = '0';
                }
            },

            // 更新场景显示
            updateScene: function() {
                const { highlights, infoBoxes, arrows, title, btnPrev, btnNext } = this.elements;

                // 重置所有高亮
                highlights.forEach(h => h.style.opacity = '0');
                // 重置所有信息框
                infoBoxes.forEach(b => this.hide(b));
                // 重置所有箭头
                arrows.forEach(a => a.style.opacity = '0');

                // 根据步骤更新显示
                switch(this.currentStep) {
                    case 0: // 初始状态 - 只显示基础图形
                        btnPrev.disabled = true;
                        btnNext.textContent = '下一步 ▶';
                        break;

                    case 1: // 高亮①点
                        highlights[0].style.opacity = '1';
                        this.show(infoBoxes[0]);
                        arrows[0].style.opacity = '1';
                        btnPrev.disabled = false;
                        btnNext.textContent = '下一步 ▶';
                        break;

                    case 2: // 高亮②点
                        highlights[1].style.opacity = '1';
                        this.show(infoBoxes[1]);
                        arrows[1].style.opacity = '1';
                        btnPrev.disabled = false;
                        btnNext.textContent = '下一步 ▶';
                        break;

                    case 3: // 高亮③点
                        highlights[2].style.opacity = '1';
                        this.show(infoBoxes[2]);
                        arrows[2].style.opacity = '1';
                        btnPrev.disabled = false;
                        btnNext.textContent = '下一步 ▶';
                        break;

                    case 4: // 高亮④点
                        highlights[3].style.opacity = '1';
                        this.show(infoBoxes[3]);
                        arrows[3].style.opacity = '1';
                        btnPrev.disabled = false;
                        btnNext.textContent = '下一步 ▶';
                        break;

                    case 5: // 最终步骤 - 全部显示
                        title.classList.add('visible');
                        highlights.forEach(h => h.style.opacity = '0');
                        infoBoxes.forEach(b => this.show(b));
                        arrows.forEach(a => a.style.opacity = '1');
                        btnPrev.disabled = false;
                        btnNext.textContent = '完成';
                        btnNext.disabled = true;
                        break;
                }
            },

            // 下一步
            next: function() {
                if (this.currentStep < this.totalSteps - 1) {
                    this.currentStep++;
                    this.updateScene();
                }
            },

            // 上一步
            prev: function() {
                if (this.currentStep > 0) {
                    this.currentStep--;
                    this.updateScene();
                }
            },

            // 初始化
            init: function() {
                this.elements.btnNext.addEventListener('click', () => this.next());
                this.elements.btnPrev.addEventListener('click', () => this.prev());
                this.updateScene();
            }
        };

        // 启动场景
        scene1.init();
    })();
    </script>
</body>
</html>
