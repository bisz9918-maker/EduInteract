<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>定滑轮系统受力分析 - 场景 1</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene1-btn { padding: 8px 20px; font-size: 14px; border: 2px solid #333; border-radius: 4px; background: #f5f5f5; cursor: pointer; transition: all 0.2s; }
        .scene1-btn:hover:not(:disabled) { background: #e0e0e0; }
        .scene1-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene1-btn.active { background: #1976d2; color: white; border-color: #1976d2; }
        .scene1-anim { transition: opacity 0.3s ease-in-out; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- 固定支架 -->
            <line x1="200" y1="40" x2="600" y2="40" stroke="#333" stroke-width="2"/>
            <!-- 支架阴影线 -->
            <g id="scene1-shadows">
                <line x1="200" y1="20" x2="210" y2="40" stroke="#666" stroke-width="1"/>
                <line x1="220" y1="20" x2="230" y2="40" stroke="#666" stroke-width="1"/>
                <line x1="240" y1="20" x2="250" y2="40" stroke="#666" stroke-width="1"/>
                <line x1="260" y1="20" x2="270" y2="40" stroke="#666" stroke-width="1"/>
                <line x1="280" y1="20" x2="290" y2="40" stroke="#666" stroke-width="1"/>
                <line x1="300" y1="20" x2="310" y2="40" stroke="#666" stroke-width="1"/>
                <line x1="320" y1="20" x2="330" y2="40" stroke="#666" stroke-width="1"/>
                <line x1="340" y1="20" x2="350" y2="40" stroke="#666" stroke-width="1"/>
                <line x1="360" y1="20" x2="370" y2="40" stroke="#666" stroke-width="1"/>
                <line x1="380" y1="20" x2="390" y2="40" stroke="#666" stroke-width="1"/>
                <line x1="400" y1="20" x2="410" y2="40" stroke="#666" stroke-width="1"/>
                <line x1="420" y1="20" x2="430" y2="40" stroke="#666" stroke-width="1"/>
                <line x1="440" y1="20" x2="450" y2="40" stroke="#666" stroke-width="1"/>
                <line x1="460" y1="20" x2="470" y2="40" stroke="#666" stroke-width="1"/>
                <line x1="480" y1="20" x2="490" y2="40" stroke="#666" stroke-width="1"/>
                <line x1="500" y1="20" x2="510" y2="40" stroke="#666" stroke-width="1"/>
                <line x1="520" y1="20" x2="530" y2="40" stroke="#666" stroke-width="1"/>
                <line x1="540" y1="20" x2="550" y2="40" stroke="#666" stroke-width="1"/>
                <line x1="560" y1="20" x2="570" y2="40" stroke="#666" stroke-width="1"/>
                <line x1="580" y1="20" x2="590" y2="40" stroke="#666" stroke-width="1"/>
            </g>
            
            <!-- 定滑轮 -->
            <circle cx="400" cy="100" r="50" fill="none" stroke="#333" stroke-width="2" id="scene1-pulley"/>
            <!-- 滑轮轴 -->
            <line x1="395" y1="100" x2="405" y2="100" stroke="#333" stroke-width="2"/>
            <circle cx="400" cy="100" r="3" fill="#333"/>
            
            <!-- 左侧绳子（调整位置，避开 B 标签） -->
            <line x1="350" y1="100" x2="310" y2="200" stroke="#333" stroke-width="2" id="scene1-rope-left"/>
            <!-- 右侧绳子 -->
            <line x1="450" y1="100" x2="500" y2="150" stroke="#333" stroke-width="2" id="scene1-rope-right"/>
            
            <!-- 物体 B -->
            <rect x="280" y="200" width="60" height="60" fill="#e3f2fd" fill-opacity="0.2" stroke="#333" stroke-width="2" id="scene1-obj-B"/>
            <!-- B 标签（移到更左侧，避开绳子） -->
            <text x="260" y="225" font-size="16" fill="#333" text-anchor="middle" id="scene1-label-B">B</text>
            
            <!-- 弹簧测力计外壳 -->
            <rect x="470" y="150" width="60" height="30" fill="none" stroke="#333" stroke-width="2" id="scene1-spring-case"/>
            <!-- 弹簧（锯齿线） -->
            <polyline points="500,180 490,195 510,210 490,225 510,240 500,250" fill="none" stroke="#333" stroke-width="2" id="scene1-spring"/>
            <!-- 弹簧测力计挂钩 -->
            <path d="M495,250 Q500,265 505,250 L500,280" fill="none" stroke="#333" stroke-width="2" id="scene1-spring-hook"/>
            
            <!-- 示数标签框（初始隐藏，移到右侧不重叠位置） -->
            <rect x="580" y="160" width="70" height="25" fill="#fff9c4" id="scene1-reading-box" style="opacity: 0;"/>
            <text x="615" y="177" font-size="14" fill="#333" text-anchor="middle" id="scene1-reading-text" style="opacity: 0;">19.6N</text>
            
            <!-- 物体 A -->
            <rect x="470" y="320" width="120" height="60" fill="#e3f2fd" fill-opacity="0.2" stroke="#333" stroke-width="2" id="scene1-obj-A"/>
            <!-- A 标签（移到更上方） -->
            <text x="530" y="290" font-size="16" fill="#333" text-anchor="middle" id="scene1-label-A">A</text>
            
            <!-- 盛水容器 -->
            <line x1="350" y1="380" x2="350" y2="480" stroke="#333" stroke-width="2"/>
            <line x1="650" y1="380" x2="650" y2="480" stroke="#333" stroke-width="2"/>
            <line x1="350" y1="480" x2="650" y2="480" stroke="#333" stroke-width="2"/>
            
            <!-- 水区域 -->
            <rect x="350" y="400" width="300" height="80" fill="#b3e5fc" fill-opacity="0.15" id="scene1-water-area"/>
            <!-- 水面线 -->
            <line x1="350" y1="400" x2="650" y2="400" stroke="#1976d2" stroke-width="2" id="scene1-water-surface"/>
            <!-- 水波纹线 -->
            <line x1="350" y1="410" x2="650" y2="410" stroke="#1976d2" stroke-width="1" stroke-dasharray="10,5" id="scene1-water-wave1"/>
            <line x1="350" y1="420" x2="650" y2="420" stroke="#1976d2" stroke-width="1" stroke-dasharray="10,5" id="scene1-water-wave2"/>
            <!-- 水面标签 -->
            <text x="660" y="395" font-size="14" fill="#333" id="scene1-label-water">水面</text>
            
            <!-- 力箭头组（初始全部隐藏） -->
            <!-- G_B 箭头 -->
            <g id="scene1-arrow-Gb" style="opacity: 0;">
                <line x1="310" y1="230" x2="310" y2="270" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrowhead-red)"/>
                <text x="320" y="275" font-size="14" fill="#c62828">G_B</text>
            </g>
            <!-- T_B 箭头 -->
            <g id="scene1-arrow-Tb" style="opacity: 0;">
                <line x1="310" y1="230" x2="310" y2="190" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrowhead-blue)"/>
                <text x="280" y="185" font-size="14" fill="#1565c0">T_B</text>
            </g>
            <!-- T_A 箭头（调整位置，与 A 标签拉开距离） -->
            <g id="scene1-arrow-Ta" style="opacity: 0;">
                <line x1="530" y1="320" x2="530" y2="280" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrowhead-blue)"/>
                <text x="545" y="270" font-size="14" fill="#1565c0">T_A</text>
            </g>
            <!-- G_A 箭头 -->
            <g id="scene1-arrow-Ga" style="opacity: 0;">
                <line x1="530" y1="350" x2="530" y2="390" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrowhead-red)"/>
                <text x="515" y="395" font-size="14" fill="#c62828">G_A</text>
            </g>
            <!-- F_浮 箭头（调整位置，与 T_A 标签拉开距离） -->
            <g id="scene1-arrow-Fbuoy" style="opacity: 0;">
                <line x1="550" y1="350" x2="550" y2="310" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene1-arrowhead-green)"/>
                <text x="565" y="300" font-size="14" fill="#2e7d32">F_浮</text>
            </g>
            
            <!-- 质量标注（初始隐藏，调整位置避免重叠） -->
            <text x="250" y="265" font-size="14" fill="#333" text-anchor="middle" id="scene1-mB-label" style="opacity: 0;">m_B=2kg</text>
            <text x="600" y="300" font-size="14" fill="#333" text-anchor="middle" id="scene1-mA-label" style="opacity: 0;">m_A=3kg</text>
            
            <!-- 弹簧测力计示数标注（初始隐藏，移到右侧） -->
            <text x="660" y="177" font-size="14" fill="#333" id="scene1-T-label" style="opacity: 0;">T=19.6N</text>
            
            <!-- 结论文字（初始隐藏，移到更下方避免重叠） -->
            <text x="200" y="450" font-size="14" fill="#333" id="scene1-conclusion1" style="opacity: 0;">T = G_B = 19.6N</text>
            <text x="400" y="450" font-size="14" fill="#333" id="scene1-conclusion2" style="opacity: 0;">G_A = T + F_浮</text>
            <text x="600" y="450" font-size="14" fill="#333" id="scene1-conclusion3" style="opacity: 0;">A 处于平衡状态</text>
            
            <!-- 箭头标记定义 -->
            <defs>
                <marker id="scene1-arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#c62828"/>
                </marker>
                <marker id="scene1-arrowhead-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#1565c0"/>
                </marker>
                <marker id="scene1-arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#2e7d32"/>
                </marker>
            </defs>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button class="scene1-btn" id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button class="scene1-btn" id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现 - 定滑轮系统受力分析
        // 布局坐标表（参考）：
        // | 元素 | 位置/范围 | 备注 |
        // | 固定支架 | (200,40)-(600,40) | 顶部居中 |
        // | 定滑轮 | (400,100) r=50 | 滑轮轴心 |
        // | 物体 B | (280,200)-(340,260) | 左侧悬挂 |
        // | 弹簧测力计 | (470,150)-(530,180) | 右侧 |
        // | 物体 A | (470,320)-(590,380) | 浸在水中 |
        // | 盛水容器 | (350,380)-(650,480) | U 形容器 |
        // | 水面 | y=400 | 水平线 |
        
        const scene1 = {
            currentStep: 0,
            totalSteps: 5,
            
            // 元素 ID 映射
            elements: {
                // 物体
                objB: 'scene1-obj-B',
                objA: 'scene1-obj-A',
                springCase: 'scene1-spring-case',
                
                // 力箭头
                arrowGb: 'scene1-arrow-Gb',
                arrowTb: 'scene1-arrow-Tb',
                arrowTa: 'scene1-arrow-Ta',
                arrowGa: 'scene1-arrow-Ga',
                arrowFbuoy: 'scene1-arrow-Fbuoy',
                
                // 标注
                readingBox: 'scene1-reading-box',
                readingText: 'scene1-reading-text',
                mBLabel: 'scene1-mB-label',
                mALabel: 'scene1-mA-label',
                TLabel: 'scene1-T-label',
                
                // 结论
                conclusion1: 'scene1-conclusion1',
                conclusion2: 'scene1-conclusion2',
                conclusion3: 'scene1-conclusion3'
            },
            
            // 工具函数
            show: function(id) {
                const el = document.getElementById(id);
                if (el) {
                    el.style.display = 'block';
                    el.style.opacity = '1';
                }
            },
            
            hide: function(id) {
                const el = document.getElementById(id);
                if (el) {
                    el.style.opacity = '0';
                    setTimeout(() => {
                        if (el) el.style.display = 'none';
                    }, 300);
                }
            },
            
            highlight: function(id, highlight) {
                const el = document.getElementById(id);
                if (el) {
                    if (highlight) {
                        el.style.strokeWidth = '3px';
                        el.style.stroke = '#1976d2';
                    } else {
                        el.style.strokeWidth = '2px';
                        el.style.stroke = '#333';
                    }
                }
            },
            
            // 更新场景状态
            updateScene: function() {
                const e = this.elements;
                
                // 重置所有高亮
                this.highlight(e.objB, false);
                this.highlight(e.objA, false);
                this.highlight(e.springCase, false);
                
                // 步骤 0: 初始状态 - 只显示装置结构
                if (this.currentStep === 0) {
                    this.hide(e.arrowGb);
                    this.hide(e.arrowTb);
                    this.hide(e.arrowTa);
                    this.hide(e.arrowGa);
                    this.hide(e.arrowFbuoy);
                    this.hide(e.readingBox);
                    this.hide(e.readingText);
                    this.hide(e.mBLabel);
                    this.hide(e.mALabel);
                    this.hide(e.TLabel);
                    this.hide(e.conclusion1);
                    this.hide(e.conclusion2);
                    this.hide(e.conclusion3);
                }
                
                // 步骤 1: 分析物体 B 受力
                if (this.currentStep >= 1) {
                    this.highlight(e.objB, true);
                    this.show(e.mBLabel);
                    this.show(e.arrowGb);
                    this.show(e.arrowTb);
                } else {
                    this.hide(e.mBLabel);
                    this.hide(e.arrowGb);
                    this.hide(e.arrowTb);
                }
                
                // 步骤 2: 弹簧测力计示数
                if (this.currentStep >= 2) {
                    this.highlight(e.springCase, true);
                    this.show(e.readingBox);
                    this.show(e.readingText);
                    this.show(e.TLabel);
                } else if (this.currentStep < 2) {
                    this.hide(e.readingBox);
                    this.hide(e.readingText);
                    this.hide(e.TLabel);
                }
                
                // 步骤 3: 分析物体 A 受力
                if (this.currentStep >= 3) {
                    this.highlight(e.objA, true);
                    this.show(e.mALabel);
                    this.show(e.arrowTa);
                    this.show(e.arrowGa);
                    this.show(e.arrowFbuoy);
                } else if (this.currentStep < 3) {
                    this.hide(e.mALabel);
                    this.hide(e.arrowTa);
                    this.hide(e.arrowGa);
                    this.hide(e.arrowFbuoy);
                }
                
                // 步骤 4: 总结
                if (this.currentStep >= 4) {
                    this.highlight(e.objB, false);
                    this.highlight(e.objA, false);
                    this.highlight(e.springCase, false);
                    this.show(e.conclusion1);
                    this.show(e.conclusion2);
                    this.show(e.conclusion3);
                } else if (this.currentStep < 4) {
                    this.hide(e.conclusion1);
                    this.hide(e.conclusion2);
                    this.hide(e.conclusion3);
                }
                
                // 更新按钮状态
                const prevBtn = document.getElementById('scene1-btn-prev');
                const nextBtn = document.getElementById('scene1-btn-next');
                prevBtn.disabled = (this.currentStep === 0);
                if (this.currentStep === this.totalSteps - 1) {
                    nextBtn.textContent = '完成 ✓';
                    nextBtn.disabled = true;
                } else {
                    nextBtn.textContent = '下一步 ▶';
                    nextBtn.disabled = false;
                }
            },
            
            // 下一步
            nextStep: function() {
                if (this.currentStep < this.totalSteps - 1) {
                    this.currentStep++;
                    this.updateScene();
                }
            },
            
            // 上一步
            prevStep: function() {
                if (this.currentStep > 0) {
                    this.currentStep--;
                    this.updateScene();
                }
            },
            
            // 初始化
            init: function() {
                document.getElementById('scene1-btn-next').addEventListener('click', () => this.nextStep());
                document.getElementById('scene1-btn-prev').addEventListener('click', () => this.prevStep());
                this.updateScene();
            }
        };
        
        // 启动场景
        scene1.init();
    })();
    </script>
</body>
</html>
