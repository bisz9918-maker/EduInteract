<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 四棱锥平面关系分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Microsoft YaHei', sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; background: #f0f0f0; padding: 8px 20px; border-radius: 8px; }
        .scene2-btn { padding: 6px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; transition: all 0.2s; }
        .scene2-btn:disabled { background: #cccccc; cursor: not-allowed; opacity: 0.6; }
        .scene2-btn:not(:disabled) { background: #1976d2; color: white; }
        .scene2-btn:not(:disabled):hover { background: #1565c0; }
        #scene2-step-indicator { font-size: 14px; color: #333; min-width: 80px; text-align: center; }
        svg { display: block; }
        .scene2-text { font-size: 14px; font-family: 'Microsoft YaHei', sans-serif; }
        .scene2-text-small { font-size: 12px; }
        .scene2-text-bold { font-weight: bold; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" id="scene2-svg">
            <!-- 平面 PAB 填充（蓝色半透明 20%） -->
            <polygon id="scene2-plane-pab-fill" points="400,80 150,350 350,380" fill="#1565c0" fill-opacity="0.2" stroke="none"/>
            
            <!-- 平面 PDC 填充（红色半透明 20%） -->
            <polygon id="scene2-plane-pdc-fill" points="400,80 450,300 650,360" fill="#c62828" fill-opacity="0.2" stroke="none"/>
            
            <!-- 被遮挡棱（虚线） -->
            <line id="scene2-edge-pd" x1="400" y1="80" x2="450" y2="300" stroke="#888888" stroke-width="2" stroke-dasharray="6,4"/>
            <line id="scene2-edge-ad" x1="150" y1="350" x2="450" y2="300" stroke="#888888" stroke-width="2" stroke-dasharray="6,4"/>
            <line id="scene2-edge-dc" x1="450" y1="300" x2="650" y2="360" stroke="#888888" stroke-width="2" stroke-dasharray="6,4"/>
            
            <!-- 可见棱（实线） -->
            <line id="scene2-edge-pa" x1="400" y1="80" x2="150" y2="350" stroke="#000000" stroke-width="2"/>
            <line id="scene2-edge-pb" x1="400" y1="80" x2="350" y2="380" stroke="#000000" stroke-width="2"/>
            <line id="scene2-edge-pc" x1="400" y1="80" x2="650" y2="360" stroke="#000000" stroke-width="2"/>
            <line id="scene2-edge-ab" x1="150" y1="350" x2="350" y2="380" stroke="#000000" stroke-width="2"/>
            <line id="scene2-edge-bc" x1="350" y1="380" x2="650" y2="360" stroke="#000000" stroke-width="2"/>
            
            <!-- DC 高亮线段（步骤 1 显示） -->
            <line id="scene2-dc-highlight" x1="450" y1="300" x2="650" y2="360" stroke="#c62828" stroke-width="3" opacity="0"/>
            
            <!-- 平面 PAB 内示例直线（步骤 3 显示） -->
            <line id="scene2-example-line" x1="250" y1="220" x2="300" y2="365" stroke="#1565c0" stroke-width="2" opacity="0"/>
            
            <!-- 平面 PDC 法向箭头（步骤 3 显示） -->
            <g id="scene2-normal-arrow" opacity="0">
                <line x1="550" y1="330" x2="580" y2="300" stroke="#2e7d32" stroke-width="2"/>
                <polygon points="580,300 570,305 575,295" fill="#2e7d32"/>
            </g>
            
            <!-- 顶点标记 -->
            <circle id="scene2-vertex-p" cx="400" cy="80" r="4" fill="#000000"/>
            <circle id="scene2-vertex-a" cx="150" cy="350" r="4" fill="#000000"/>
            <circle id="scene2-vertex-b" cx="350" cy="380" r="4" fill="#000000"/>
            <circle id="scene2-vertex-c" cx="650" cy="360" r="4" fill="#000000"/>
            <circle id="scene2-vertex-d" cx="450" cy="300" r="4" fill="#000000"/>
            
            <!-- 顶点标签 - 调整位置避免与图形重叠 -->
            <text id="scene2-label-p" class="scene2-text" x="390" y="65" fill="#000000">P</text>
            <text id="scene2-label-a" class="scene2-text" x="125" y="375" fill="#000000">A</text>
            <text id="scene2-label-b" class="scene2-text" x="345" y="405" fill="#000000">B</text>
            <text id="scene2-label-c" class="scene2-text" x="675" y="385" fill="#000000">C</text>
            <text id="scene2-label-d" class="scene2-text" x="505" y="265" fill="#000000">D</text>
            
            <!-- 平面标签 - 调整位置到平面外部，避免与棱线重叠 -->
            <text id="scene2-label-plane-pab" class="scene2-text scene2-text-bold" x="100" y="240" fill="#1565c0">平面 PAB</text>
            <text id="scene2-label-plane-pdc" class="scene2-text scene2-text-bold" x="640" y="260" fill="#c62828">平面 PDC</text>
            
            <!-- DC 标签（步骤 1 显示）- 调整位置在线段上方偏移 -->
            <text id="scene2-label-dc" class="scene2-text scene2-text-bold" x="600" y="245" fill="#c62828" opacity="0">DC</text>
            
            <!-- 命题①结论标记（步骤 2 显示）- 调整位置到左上角空白区域 -->
            <text id="scene2-conclusion-1" class="scene2-text scene2-text-bold" x="50" y="140" fill="#c62828" font-size="18" opacity="0">× 命题①错误</text>
            
            <!-- 命题②结论标记（步骤 4 显示）- 调整位置到右上角空白区域 -->
            <text id="scene2-conclusion-2" class="scene2-text scene2-text-bold" x="630" y="140" fill="#2e7d32" font-size="18" opacity="0">√ 命题②正确</text>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-prev-btn" class="scene2-btn" disabled>◀ 上一步</button>
            <span id="scene2-step-indicator">步骤 0/4</span>
            <button id="scene2-next-btn" class="scene2-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现
        // 布局坐标表：
        // 顶点 P(400,80)、A(150,350)、B(350,380)、C(650,360)、D(450,300)
        // 平面 PAB 填充：(400,80)-(150,350)-(350,380)
        // 平面 PDC 填充：(400,80)-(450,300)-(650,360)
        // DC 高亮：(450,300)-(650,360)
        // 示例直线：(250,220)-(300,365)
        // 法向箭头：(550,330)→(580,300)
        
        const currentStepMax = 4;
        let currentStep = 0;
        
        // 获取 DOM 元素
        const prevBtn = document.getElementById('scene2-prev-btn');
        const nextBtn = document.getElementById('scene2-next-btn');
        const stepIndicator = document.getElementById('scene2-step-indicator');
        
        // 元素 ID 列表
        const elements = {
            dcHighlight: document.getElementById('scene2-dc-highlight'),
            labelDc: document.getElementById('scene2-label-dc'),
            exampleLine: document.getElementById('scene2-example-line'),
            normalArrow: document.getElementById('scene2-normal-arrow'),
            conclusion1: document.getElementById('scene2-conclusion-1'),
            conclusion2: document.getElementById('scene2-conclusion-2')
        };
        
        // 显示/隐藏工具函数
        function show(el) {
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }
        
        function hide(el) {
            if (el) {
                el.style.opacity = '0';
                // 对于 SVG 元素，使用 display 控制
                if (el.tagName === 'line' || el.tagName === 'text' || el.tagName === 'circle') {
                    el.style.display = 'none';
                } else if (el.tagName === 'g') {
                    el.style.display = 'none';
                }
            }
        }
        
        // 更新场景状态
        function updateScene() {
            // 更新按钮状态
            prevBtn.disabled = (currentStep === 0);
            nextBtn.disabled = (currentStep === currentStepMax);
            
            // 更新步骤指示器
            stepIndicator.textContent = `步骤 ${currentStep}/${currentStepMax}`;
            
            // 根据步骤显示/隐藏元素
            // 步骤 0: 基础结构（已默认显示）
            // 步骤 1: 显示 DC 高亮和标签
            if (currentStep >= 1) {
                show(elements.dcHighlight);
                show(elements.labelDc);
            } else {
                hide(elements.dcHighlight);
                hide(elements.labelDc);
            }
            
            // 步骤 2: 显示命题①结论
            if (currentStep >= 2) {
                show(elements.conclusion1);
            } else {
                hide(elements.conclusion1);
            }
            
            // 步骤 3: 显示示例直线和法向箭头
            if (currentStep >= 3) {
                show(elements.exampleLine);
                show(elements.normalArrow);
            } else {
                hide(elements.exampleLine);
                hide(elements.normalArrow);
            }
            
            // 步骤 4: 显示命题②结论
            if (currentStep >= 4) {
                show(elements.conclusion2);
            } else {
                hide(elements.conclusion2);
            }
        }
        
        // 按钮事件绑定
        prevBtn.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });
        
        nextBtn.addEventListener('click', function() {
            if (currentStep < currentStepMax) {
                currentStep++;
                updateScene();
            }
        });
        
        // 初始化场景
        updateScene();
    })();
    </script>
</body>
</html>
