<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>牛顿调和三角形 - 场景 1</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene1-btn {
            padding: 8px 20px;
            font-size: 14px;
            background: #1565c0;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .scene1-btn:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }
        .scene1-btn:hover:not(:disabled) {
            background: #0d47a1;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500">
            <!-- 坐标表注释：
                第 1 行元素：(400,80) 50×50
                第 2 行左元素：(320,140) 50×50
                第 2 行右元素：(480,140) 50×50
                第 3 行左元素：(260,200) 50×50
                第 3 行中元素：(400,200) 50×50
                第 3 行右元素：(540,200) 50×50
                第 4 行第 1 元素：(220,260) 50×50
                第 4 行第 2 元素：(340,260) 50×50
                第 4 行第 3 元素：(460,260) 50×50
                第 4 行第 4 元素：(580,260) 50×50
                第 5 行第 1 元素：(190,320) 50×50
                第 5 行第 2 元素：(280,320) 50×50
                第 5 行第 3 元素：(400,320) 50×50
                第 5 行第 4 元素：(520,320) 50×50
                第 5 行第 5 元素：(610,320) 50×50
            -->
            
            <!-- 行号标签 -->
            <text id="scene1-row-label-1" x="380" y="50" font-size="14" fill="#666666">第 1 行</text>
            <text id="scene1-row-label-2" x="280" y="110" font-size="14" fill="#666666">第 2 行</text>
            <text id="scene1-row-label-3" x="220" y="170" font-size="14" fill="#666666">第 3 行</text>
            <text id="scene1-row-label-4" x="180" y="230" font-size="14" fill="#666666">第 4 行</text>
            <text id="scene1-row-label-5" x="150" y="290" font-size="14" fill="#666666">第 5 行</text>
            
            <!-- 第 1 行 -->
            <circle id="scene1-circle-1-1" cx="400" cy="80" r="25" stroke="#000000" stroke-width="2" fill="#ffffff"/>
            <text id="scene1-label-1-1" x="400" y="85" font-size="16" text-anchor="middle">$\\frac{1}{1}$</text>
            
            <!-- 第 2 行 -->
            <circle id="scene1-circle-2-1" cx="320" cy="140" r="25" stroke="#000000" stroke-width="2" fill="#ffffff"/>
            <text id="scene1-label-2-1" x="320" y="145" font-size="16" text-anchor="middle">$\\frac{1}{2}$</text>
            <circle id="scene1-circle-2-2" cx="480" cy="140" r="25" stroke="#000000" stroke-width="2" fill="#ffffff"/>
            <text id="scene1-label-2-2" x="480" y="145" font-size="16" text-anchor="middle">$\\frac{1}{2}$</text>
            
            <!-- 第 3 行 -->
            <circle id="scene1-circle-3-1" cx="260" cy="200" r="25" stroke="#000000" stroke-width="2" fill="#ffffff"/>
            <text id="scene1-label-3-1" x="260" y="205" font-size="16" text-anchor="middle">$\\frac{1}{3}$</text>
            <circle id="scene1-circle-3-2" cx="400" cy="200" r="25" stroke="#000000" stroke-width="2" fill="#ffffff"/>
            <text id="scene1-label-3-2" x="400" y="205" font-size="16" text-anchor="middle">$\\frac{1}{6}$</text>
            <circle id="scene1-circle-3-3" cx="540" cy="200" r="25" stroke="#000000" stroke-width="2" fill="#ffffff"/>
            <text id="scene1-label-3-3" x="540" y="205" font-size="16" text-anchor="middle">$\\frac{1}{3}$</text>
            
            <!-- 第 4 行 -->
            <circle id="scene1-circle-4-1" cx="220" cy="260" r="25" stroke="#000000" stroke-width="2" fill="#ffffff"/>
            <text id="scene1-label-4-1" x="220" y="265" font-size="14" text-anchor="middle">$\\frac{1}{4}$</text>
            <circle id="scene1-circle-4-2" cx="340" cy="260" r="25" stroke="#000000" stroke-width="2" fill="#ffffff"/>
            <text id="scene1-label-4-2" x="340" y="265" font-size="14" text-anchor="middle">$\\frac{1}{12}$</text>
            <circle id="scene1-circle-4-3" cx="460" cy="260" r="25" stroke="#000000" stroke-width="2" fill="#ffffff"/>
            <text id="scene1-label-4-3" x="460" y="265" font-size="14" text-anchor="middle">$\\frac{1}{12}$</text>
            <circle id="scene1-circle-4-4" cx="580" cy="260" r="25" stroke="#000000" stroke-width="2" fill="#ffffff"/>
            <text id="scene1-label-4-4" x="580" y="265" font-size="14" text-anchor="middle">$\\frac{1}{4}$</text>
            
            <!-- 第 5 行 -->
            <circle id="scene1-circle-5-1" cx="190" cy="320" r="25" stroke="#000000" stroke-width="2" fill="#ffffff"/>
            <text id="scene1-label-5-1" x="190" y="325" font-size="14" text-anchor="middle">$\\frac{1}{5}$</text>
            <circle id="scene1-circle-5-2" cx="280" cy="320" r="25" stroke="#000000" stroke-width="2" fill="#ffffff"/>
            <text id="scene1-label-5-2" x="280" y="325" font-size="14" text-anchor="middle">$\\frac{1}{20}$</text>
            <circle id="scene1-circle-5-3" cx="400" cy="320" r="25" stroke="#000000" stroke-width="2" fill="#ffffff"/>
            <text id="scene1-label-5-3" x="400" y="325" font-size="14" text-anchor="middle">$\\frac{1}{30}$</text>
            <circle id="scene1-circle-5-4" cx="520" cy="320" r="25" stroke="#000000" stroke-width="2" fill="#ffffff"/>
            <text id="scene1-label-5-4" x="520" y="325" font-size="14" text-anchor="middle">$\\frac{1}{20}$</text>
            <circle id="scene1-circle-5-5" cx="610" cy="320" r="25" stroke="#000000" stroke-width="2" fill="#ffffff"/>
            <text id="scene1-label-5-5" x="610" y="325" font-size="14" text-anchor="middle">$\\frac{1}{5}$</text>
            
            <!-- 递推箭头（初始隐藏） -->
            <line id="scene1-arrow-1" x1="400" y1="105" x2="320" y2="125" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" opacity="0"/>
            <line id="scene1-arrow-2" x1="400" y1="105" x2="480" y2="125" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" opacity="0"/>
            <line id="scene1-arrow-3" x1="320" y1="165" x2="260" y2="185" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" opacity="0"/>
            <line id="scene1-arrow-4" x1="320" y1="165" x2="400" y2="185" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" opacity="0"/>
            <line id="scene1-arrow-5" x1="480" y1="165" x2="400" y2="185" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" opacity="0"/>
            <line id="scene1-arrow-6" x1="480" y1="165" x2="540" y2="185" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" opacity="0"/>
            
            <!-- 递推关系说明 -->
            <text id="scene1-relation-text" x="50" y="400" font-size="14" fill="#333333">每个数=下一行左右相邻两数之和</text>
            
            <!-- 步骤 1 关系式标注（初始隐藏） -->
            <text id="scene1-relation-1" x="520" y="130" font-size="14" fill="#1565c0" opacity="0">$\\frac{1}{1} = \\frac{1}{2} + \\frac{1}{2}$</text>
            
            <!-- 步骤 2 关系式标注（初始隐藏） -->
            <text id="scene1-relation-2a" x="180" y="190" font-size="14" fill="#1565c0" opacity="0">$\\frac{1}{2} = \\frac{1}{3} + \\frac{1}{6}$</text>
            <text id="scene1-relation-2b" x="540" y="190" font-size="14" fill="#1565c0" opacity="0">$\\frac{1}{2} = \\frac{1}{6} + \\frac{1}{3}$</text>
            
            <!-- 步骤 3 公式总结框（初始隐藏） -->
            <rect id="scene1-formula-box" x="600" y="150" width="180" height="80" fill="rgba(21,101,192,0.1)" stroke="#1565c0" stroke-width="2" opacity="0"/>
            <text id="scene1-formula-title" x="610" y="170" font-size="14" fill="#1565c0" opacity="0">递推公式：</text>
            <text id="scene1-formula-1" x="610" y="195" font-size="14" fill="#333333" opacity="0">L(n,k) = L(n+1,k)</text>
            <text id="scene1-formula-2" x="610" y="215" font-size="14" fill="#333333" opacity="0">+ L(n+1,k+1)</text>
            <text id="scene1-boundary" x="610" y="235" font-size="13" fill="#666666" opacity="0">边界：L(n,1) = L(n,n) = 1/n</text>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-prev-btn" class="scene1-btn" disabled>◀ 上一步</button>
            <button id="scene1-next-btn" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        const sceneId = 1;
        let currentStep = 0;
        const totalSteps = 3;
        
        // 元素引用
        const prevBtn = document.getElementById('scene1-prev-btn');
        const nextBtn = document.getElementById('scene1-next-btn');
        
        // 高亮圆形（用于步骤 1 和 2）
        const highlightCircles = {
            step1: ['scene1-circle-1-1', 'scene1-circle-2-1', 'scene1-circle-2-2'],
            step2a: ['scene1-circle-2-1', 'scene1-circle-3-1', 'scene1-circle-3-2'],
            step2b: ['scene1-circle-2-2', 'scene1-circle-3-2', 'scene1-circle-3-3']
        };
        
        // 工具函数：显示元素
        function show(el) {
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }
        
        // 工具函数：隐藏元素
        function hide(el) {
            if (el) {
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }
        
        // 工具函数：设置圆形高亮
        function setHighlight(circleId, highlighted) {
            const circle = document.getElementById(circleId);
            if (circle) {
                if (highlighted) {
                    circle.style.fill = 'rgba(21,101,192,0.2)';
                } else {
                    circle.style.fill = '#ffffff';
                }
            }
        }
        
        // 更新场景状态
        function updateScene() {
            // 重置所有高亮
            for (let i = 1; i <= 5; i++) {
                for (let j = 1; j <= i; j++) {
                    setHighlight(`scene1-circle-${i}-${j}`, false);
                }
            }
            
            // 重置所有箭头
            for (let i = 1; i <= 6; i++) {
                const arrow = document.getElementById(`scene1-arrow-${i}`);
                if (arrow) {
                    arrow.style.stroke = '#888888';
                    arrow.style.strokeWidth = '2';
                    arrow.style.strokeDasharray = '5,5';
                    arrow.style.opacity = '0';
                }
            }
            
            // 隐藏所有关系式标注
            hide(document.getElementById('scene1-relation-1'));
            hide(document.getElementById('scene1-relation-2a'));
            hide(document.getElementById('scene1-relation-2b'));
            hide(document.getElementById('scene1-formula-box'));
            hide(document.getElementById('scene1-formula-title'));
            hide(document.getElementById('scene1-formula-1'));
            hide(document.getElementById('scene1-formula-2'));
            hide(document.getElementById('scene1-boundary'));
            
            // 根据当前步骤更新显示
            switch (currentStep) {
                case 0:
                    // 初始状态：只显示三角形和行号
                    prevBtn.disabled = true;
                    nextBtn.disabled = false;
                    break;
                    
                case 1:
                    // 高亮第 1 行递推关系
                    prevBtn.disabled = false;
                    nextBtn.disabled = false;
                    
                    // 高亮圆形
                    highlightCircles.step1.forEach(id => setHighlight(id, true));
                    
                    // 显示箭头 1、2（蓝色实线）
                    const arrow1 = document.getElementById('scene1-arrow-1');
                    const arrow2 = document.getElementById('scene1-arrow-2');
                    if (arrow1) {
                        arrow1.style.stroke = '#1565c0';
                        arrow1.style.strokeWidth = '3';
                        arrow1.style.opacity = '1';
                    }
                    if (arrow2) {
                        arrow2.style.stroke = '#1565c0';
                        arrow2.style.strokeWidth = '3';
                        arrow2.style.opacity = '1';
                    }
                    
                    // 显示关系式标注
                    show(document.getElementById('scene1-relation-1'));
                    break;
                    
                case 2:
                    // 显示更多递推关系
                    prevBtn.disabled = false;
                    nextBtn.disabled = false;
                    
                    // 高亮第 2 行左元素及其子元素
                    highlightCircles.step2a.forEach(id => setHighlight(id, true));
                    // 高亮第 2 行右元素及其子元素
                    highlightCircles.step2b.forEach(id => setHighlight(id, true));
                    
                    // 显示箭头 3-6（灰色虚线）
                    for (let i = 3; i <= 6; i++) {
                        const arrow = document.getElementById(`scene1-arrow-${i}`);
                        if (arrow) {
                            arrow.style.stroke = '#888888';
                            arrow.style.strokeWidth = '2';
                            arrow.style.strokeDasharray = '5,5';
                            arrow.style.opacity = '1';
                        }
                    }
                    
                    // 显示关系式标注
                    show(document.getElementById('scene1-relation-2a'));
                    show(document.getElementById('scene1-relation-2b'));
                    break;
                    
                case 3:
                    // 显示所有递推箭头和公式总结
                    prevBtn.disabled = false;
                    nextBtn.disabled = false;
                    
                    // 显示所有箭头
                    for (let i = 1; i <= 6; i++) {
                        const arrow = document.getElementById(`scene1-arrow-${i}`);
                        if (arrow) {
                            arrow.style.stroke = '#888888';
                            arrow.style.strokeWidth = '2';
                            arrow.style.strokeDasharray = '5,5';
                            arrow.style.opacity = '1';
                        }
                    }
                    
                    // 显示公式总结框
                    show(document.getElementById('scene1-formula-box'));
                    show(document.getElementById('scene1-formula-title'));
                    show(document.getElementById('scene1-formula-1'));
                    show(document.getElementById('scene1-formula-2'));
                    show(document.getElementById('scene1-boundary'));
                    break;
            }
        }
        
        // 按钮事件绑定
        prevBtn.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });
        
        nextBtn.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateScene();
            }
        });
        
        // 初始化场景
        updateScene();
    })();
    </script>
</body>
</html>
