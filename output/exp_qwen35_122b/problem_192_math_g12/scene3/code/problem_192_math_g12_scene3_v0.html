<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>牛顿调和三角形 - 第 3 个数通项公式推导</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene3-controls button { padding: 8px 16px; font-size: 14px; background: #e0e0e0; border: none; border-radius: 4px; cursor: pointer; transition: background 0.2s; }
        #scene3-controls button:hover:not(:disabled) { background: #bdbdbd; }
        #scene3-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene3-step-indicator { font-size: 14px; color: #666; }
        .math-text { font-size: 16px; }
        .row-label { font-size: 12px; color: #888888; }
        .highlight-blue { fill: #1565c0 !important; font-weight: bold; }
        .highlight-red { fill: #c62828 !important; font-weight: bold; }
        .highlight-green { fill: #2e7d32 !important; font-weight: bold; }
        .highlight-bg { fill: rgba(21, 101, 192, 0.3); }
        .box-border-blue { stroke: #1565c0; fill: rgba(21, 101, 192, 0.1); }
        .box-border-green { stroke: #2e7d32; fill: rgba(46, 125, 50, 0.1); }
        .box-border-red { stroke: #c62828; fill: rgba(198, 40, 40, 0.1); }
        .hidden { display: none; opacity: 0; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg width="800" height="500" id="scene3-svg">
            <!-- 三角形数阵 -->
            <!-- 第 1 行 -->
            <text id="scene3-row-1" x="400" y="45" text-anchor="middle" class="math-text">
                <tspan>$\frac{1}{1}$</tspan>
            </text>
            
            <!-- 第 2 行 -->
            <text id="scene3-row-2-col-1" x="350" y="85" text-anchor="middle" class="math-text">
                <tspan>$\frac{1}{2}$</tspan>
            </text>
            <text id="scene3-row-2-col-2" x="450" y="85" text-anchor="middle" class="math-text">
                <tspan>$\frac{1}{2}$</tspan>
            </text>
            
            <!-- 第 3 行 -->
            <text id="scene3-row-3-col-1" x="300" y="125" text-anchor="middle" class="math-text">
                <tspan>$\frac{1}{3}$</tspan>
            </text>
            <text id="scene3-row-3-col-2" x="400" y="125" text-anchor="middle" class="math-text">
                <tspan>$\frac{1}{6}$</tspan>
            </text>
            <text id="scene3-row-3-col-3" x="500" y="125" text-anchor="middle" class="math-text">
                <tspan>$\frac{1}{3}$</tspan>
            </text>
            
            <!-- 第 4 行 -->
            <text id="scene3-row-4-col-1" x="250" y="165" text-anchor="middle" class="math-text">
                <tspan>$\frac{1}{4}$</tspan>
            </text>
            <text id="scene3-row-4-col-2" x="333" y="165" text-anchor="middle" class="math-text">
                <tspan>$\frac{1}{12}$</tspan>
            </text>
            <text id="scene3-row-4-col-3" x="467" y="165" text-anchor="middle" class="math-text">
                <tspan>$\frac{1}{12}$</tspan>
            </text>
            <text id="scene3-row-4-col-4" x="550" y="165" text-anchor="middle" class="math-text">
                <tspan>$\frac{1}{4}$</tspan>
            </text>
            
            <!-- 第 5 行 -->
            <text id="scene3-row-5-col-1" x="200" y="205" text-anchor="middle" class="math-text">
                <tspan>$\frac{1}{5}$</tspan>
            </text>
            <text id="scene3-row-5-col-2" x="280" y="205" text-anchor="middle" class="math-text">
                <tspan>$\frac{1}{20}$</tspan>
            </text>
            <text id="scene3-row-5-col-3" x="400" y="205" text-anchor="middle" class="math-text">
                <tspan>$\frac{1}{30}$</tspan>
            </text>
            <text id="scene3-row-5-col-4" x="520" y="205" text-anchor="middle" class="math-text">
                <tspan>$\frac{1}{20}$</tspan>
            </text>
            <text id="scene3-row-5-col-5" x="600" y="205" text-anchor="middle" class="math-text">
                <tspan>$\frac{1}{5}$</tspan>
            </text>
            
            <!-- 行号标注 -->
            <text id="scene3-row-label-1" x="170" y="45" text-anchor="end" class="row-label">第 1 行</text>
            <text id="scene3-row-label-2" x="170" y="85" text-anchor="end" class="row-label">第 2 行</text>
            <text id="scene3-row-label-3" x="170" y="125" text-anchor="end" class="row-label">第 3 行</text>
            <text id="scene3-row-label-4" x="170" y="165" text-anchor="end" class="row-label">第 4 行</text>
            <text id="scene3-row-label-5" x="170" y="205" text-anchor="end" class="row-label">第 5 行</text>
            
            <!-- 第 3 列标注（步骤 1 显示） -->
            <text id="scene3-col3-label" x="520" y="125" text-anchor="start" class="row-label highlight-blue" style="opacity: 0;">第 3 列</text>
            <line id="scene3-col3-line" x1="510" y1="120" x2="520" y2="120" stroke="#1565c0" stroke-width="2" style="opacity: 0;"/>
            
            <!-- 第 3 个数高亮框（步骤 1 显示） -->
            <rect id="scene3-highlight-box" x="380" y="105" width="40" height="20" class="box-border-blue" style="opacity: 0;"/>
            <rect id="scene3-highlight-box-2" x="457" y="145" width="40" height="20" class="box-border-blue" style="opacity: 0;"/>
            <rect id="scene3-highlight-box-3" x="380" y="185" width="40" height="20" class="box-border-blue" style="opacity: 0;"/>
            
            <!-- 右侧信息区 -->
            <!-- 第 3 个数序列框 -->
            <rect id="scene3-seq-box" x="620" y="100" width="140" height="120" class="box-border-blue" style="opacity: 1;"/>
            <text id="scene3-seq-title" x="630" y="120" class="row-label" style="font-weight: bold;">第 3 个数序列</text>
            <text id="scene3-seq-1" x="640" y="145" class="math-text" style="fill: #1565c0;">$\frac{1}{6}$</text>
            <text id="scene3-seq-2" x="640" y="170" class="math-text" style="fill: #1565c0;">$\frac{1}{12}$</text>
            <text id="scene3-seq-3" x="640" y="195" class="math-text" style="fill: #1565c0;">$\frac{1}{30}$</text>
            
            <!-- 分母规律框（步骤 2 显示） -->
            <rect id="scene3-pattern-box" x="620" y="240" width="140" height="60" class="box-border-green" style="opacity: 0;"/>
            <text id="scene3-pattern-title" x="630" y="260" class="row-label" style="font-weight: bold; opacity: 0;">分母规律</text>
            <text id="scene3-pattern-content" x="630" y="280" class="math-text" style="opacity: 0;">6, 12, 30, ...</text>
            <text id="scene3-pattern-hint" x="630" y="300" class="row-label" style="opacity: 0;">观察：6=3×2, 12=4×3</text>
            
            <!-- 通项公式框（步骤 3 显示） -->
            <rect id="scene3-formula-box" x="620" y="320" width="140" height="60" class="box-border-red" style="opacity: 0;"/>
            <text id="scene3-formula-title" x="630" y="340" class="row-label" style="font-weight: bold; opacity: 0;">通项公式</text>
            <text id="scene3-formula-text" x="630" y="365" class="math-text" style="fill: #c62828; font-weight: bold; font-size: 18px; opacity: 0;">$\frac{2}{n(n-1)}$</text>
            
            <!-- 验证框（步骤 4 显示） -->
            <rect id="scene3-verify-box" x="620" y="390" width="140" height="40" class="box-border-green" style="opacity: 0;"/>
            <text id="scene3-verify-text" x="630" y="415" class="math-text" style="fill: #2e7d32; font-weight: bold; opacity: 0;">n=6 时：$\frac{1}{15}$</text>
            
            <!-- 第 6 行虚线框（步骤 4 显示） -->
            <line id="scene3-row-6-line" x1="180" y1="245" x2="620" y2="245" stroke="#888" stroke-width="1" stroke-dasharray="5,5" style="opacity: 0;"/>
            <text id="scene3-row-6-placeholder" x="400" y="245" text-anchor="middle" class="row-label" style="opacity: 0;">第 6 行...</text>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene3-controls">
            <button id="scene3-btn-prev" disabled>◀ 上一步</button>
            <span id="scene3-step-indicator">步骤 1/5</span>
            <button id="scene3-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 3: 牛顿调和三角形 - 第 3 个数通项公式推导
        // 布局坐标表（参考）：
        // 三角形第 1 行：(400,40) 居中 1/1
        // 三角形第 2 行：(350,80)-(450,80) 1/2, 1/2
        // 三角形第 3 行：(300,120)-(500,120) 1/3, 1/6, 1/3
        // 三角形第 4 行：(250,160)-(550,160) 1/4, 1/12, 1/12, 1/4
        // 三角形第 5 行：(200,200)-(600,200) 1/5, 1/20, 1/30, 1/20, 1/5
        // 右侧信息区：x=620~760
        // 控件栏：y=440~490
        
        const scene3 = {
            currentStep: 0,
            totalSteps: 5,
            
            elements: {
                // 第 3 列标注
                col3Label: document.getElementById('scene3-col3-label'),
                col3Line: document.getElementById('scene3-col3-line'),
                // 高亮框
                highlightBox1: document.getElementById('scene3-highlight-box'),
                highlightBox2: document.getElementById('scene3-highlight-box-2'),
                highlightBox3: document.getElementById('scene3-highlight-box-3'),
                // 分母规律框
                patternBox: document.getElementById('scene3-pattern-box'),
                patternTitle: document.getElementById('scene3-pattern-title'),
                patternContent: document.getElementById('scene3-pattern-content'),
                patternHint: document.getElementById('scene3-pattern-hint'),
                // 通项公式框
                formulaBox: document.getElementById('scene3-formula-box'),
                formulaTitle: document.getElementById('scene3-formula-title'),
                formulaText: document.getElementById('scene3-formula-text'),
                // 验证框
                verifyBox: document.getElementById('scene3-verify-box'),
                verifyText: document.getElementById('scene3-verify-text'),
                // 第 6 行
                row6Line: document.getElementById('scene3-row-6-line'),
                row6Placeholder: document.getElementById('scene3-row-6-placeholder'),
                // 按钮和指示器
                btnPrev: document.getElementById('scene3-btn-prev'),
                btnNext: document.getElementById('scene3-btn-next'),
                stepIndicator: document.getElementById('scene3-step-indicator')
            },
            
            // 显示元素
            show: function(el) {
                if (el) {
                    el.style.display = 'block';
                    el.style.opacity = '1';
                }
            },
            
            // 隐藏元素
            hide: function(el) {
                if (el) {
                    el.style.display = 'none';
                    el.style.opacity = '0';
                }
            },
            
            // 更新步骤显示
            updateScene: function() {
                const e = this.elements;
                
                // 更新步骤指示器
                e.stepIndicator.textContent = '步骤 ' + (this.currentStep + 1) + '/' + this.totalSteps;
                
                // 更新按钮状态
                e.btnPrev.disabled = (this.currentStep === 0);
                e.btnNext.disabled = (this.currentStep === this.totalSteps - 1);
                
                // 根据步骤显示/隐藏元素
                if (this.currentStep >= 1) {
                    // 步骤 1：显示第 3 列标注和高亮框
                    this.show(e.col3Label);
                    this.show(e.col3Line);
                    this.show(e.highlightBox1);
                    this.show(e.highlightBox2);
                    this.show(e.highlightBox3);
                } else {
                    this.hide(e.col3Label);
                    this.hide(e.col3Line);
                    this.hide(e.highlightBox1);
                    this.hide(e.highlightBox2);
                    this.hide(e.highlightBox3);
                }
                
                if (this.currentStep >= 2) {
                    // 步骤 2：显示分母规律框
                    this.show(e.patternBox);
                    this.show(e.patternTitle);
                    this.show(e.patternContent);
                    this.show(e.patternHint);
                } else {
                    this.hide(e.patternBox);
                    this.hide(e.patternTitle);
                    this.hide(e.patternContent);
                    this.hide(e.patternHint);
                }
                
                if (this.currentStep >= 3) {
                    // 步骤 3：显示通项公式框
                    this.show(e.formulaBox);
                    this.show(e.formulaTitle);
                    this.show(e.formulaText);
                } else {
                    this.hide(e.formulaBox);
                    this.hide(e.formulaTitle);
                    this.hide(e.formulaText);
                }
                
                if (this.currentStep >= 4) {
                    // 步骤 4：显示验证框和第 6 行
                    this.show(e.verifyBox);
                    this.show(e.verifyText);
                    this.show(e.row6Line);
                    this.show(e.row6Placeholder);
                } else {
                    this.hide(e.verifyBox);
                    this.hide(e.verifyText);
                    this.hide(e.row6Line);
                    this.hide(e.row6Placeholder);
                }
                
                // 触发 MathJax 重新渲染
                if (window.MathJax) {
                    MathJax.typesetPromise();
                }
            },
            
            // 下一步
            nextStep: function() {
                if (this.currentStep < this.totalSteps - 1) {
                    this.currentStep++;
                    this.updateScene();
                }
            },
            
            // 上一步
            prevStep: function() {
                if (this.currentStep > 0) {
                    this.currentStep--;
                    this.updateScene();
                }
            },
            
            // 初始化
            init: function() {
                // 绑定按钮事件
                e.btnPrev.addEventListener('click', () => this.prevStep());
                e.btnNext.addEventListener('click', () => this.nextStep());
                
                // 初始更新
                this.updateScene();
            }
        };
        
        const e = scene3.elements;
        scene3.init();
    })();
    </script>
</body>
</html>
