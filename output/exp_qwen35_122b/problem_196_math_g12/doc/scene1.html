<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圆的切线与割线几何关系 - Scene 1</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Microsoft YaHei', sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            width: 120px;
            height: 36px;
            font-size: 14px;
            cursor: pointer;
            border: 2px solid #333;
            border-radius: 6px;
            background: #f5f5f5;
            transition: all 0.2s;
        }
        #scene1-controls button:hover:not(:disabled) {
            background: #e0e0e0;
        }
        #scene1-controls button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- 圆 O -->
            <circle id="scene1-circle-o" cx="550" cy="250" r="100" fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 切线 AP -->
            <line id="scene1-line-ap" x1="100" y1="250" x2="520" y2="160" stroke="#000000" stroke-width="2"/>
            
            <!-- 割线 AC -->
            <line id="scene1-line-ac" x1="100" y1="250" x2="620" y2="320" stroke="#000000" stroke-width="2"/>
            
            <!-- 弦 BC -->
            <line id="scene1-line-bc" x1="450" y1="275" x2="620" y2="320" stroke="#000000" stroke-width="2"/>
            
            <!-- 辅助线 OP (步骤 1 显示) -->
            <line id="scene1-line-op" class="step1-element" x1="550" y1="250" x2="520" y2="160" stroke="#1565c0" stroke-width="2" style="display: none; opacity: 0;"/>
            
            <!-- 辅助线 OM (步骤 2 显示) -->
            <line id="scene1-line-om" class="step2-element" x1="550" y1="250" x2="535" y2="298" stroke="#1565c0" stroke-width="2" style="display: none; opacity: 0;"/>
            
            <!-- 直角标记 1: OP⊥AP (步骤 1 显示) -->
            <path id="scene1-right-angle-1" class="step1-element" d="M 520 172 L 520 184 L 532 184" fill="none" stroke="#000000" stroke-width="1.5" style="display: none; opacity: 0;"/>
            
            <!-- 直角标记 2: OM⊥BC (步骤 2 显示) -->
            <path id="scene1-right-angle-2" class="step2-element" d="M 535 298 L 523 298 L 523 310" fill="none" stroke="#000000" stroke-width="1.5" style="display: none; opacity: 0;"/>
            
            <!-- 角度弧 OAM (步骤 3 显示) -->
            <path id="scene1-arc-oam" class="step3-element" d="M 130 230 A 40 40 0 0 1 125 285" fill="none" stroke="#c62828" stroke-width="2" style="display: none; opacity: 0;"/>
            
            <!-- 角度弧 APM (步骤 3 显示) -->
            <path id="scene1-arc-apm" class="step3-element" d="M 480 180 A 40 40 0 0 1 505 220" fill="none" stroke="#c62828" stroke-width="2" style="display: none; opacity: 0;"/>
            
            <!-- 点 A -->
            <circle id="scene1-point-a" cx="100" cy="250" r="4" fill="#000000"/>
            
            <!-- 点 P -->
            <circle id="scene1-point-p" cx="520" cy="160" r="4" fill="#000000"/>
            
            <!-- 点 B -->
            <circle id="scene1-point-b" cx="450" cy="275" r="4" fill="#000000"/>
            
            <!-- 点 C -->
            <circle id="scene1-point-c" cx="620" cy="320" r="4" fill="#000000"/>
            
            <!-- 点 M -->
            <circle id="scene1-point-m" cx="535" cy="298" r="4" fill="#000000"/>
            
            <!-- 点 O -->
            <circle id="scene1-point-o" cx="550" cy="250" r="4" fill="#000000"/>
            
            <!-- 标签 A -->
            <text id="scene1-label-a" x="70" y="255" font-size="16" fill="#000000">A</text>
            
            <!-- 标签 P -->
            <text id="scene1-label-p" x="515" y="135" font-size="16" fill="#000000">P</text>
            
            <!-- 标签 B (向左上方移动远离割线) -->
            <text id="scene1-label-b" x="345" y="225" font-size="16" fill="#000000">B</text>
            
            <!-- 标签 C (向右下方移动远离圆) -->
            <text id="scene1-label-c" x="715" y="385" font-size="16" fill="#000000">C</text>
            
            <!-- 标签 M (向左下方移动远离圆和 OM 线) -->
            <text id="scene1-label-m" x="460" y="385" font-size="16" fill="#000000">M</text>
            
            <!-- 标签 O (向右移动远离圆) -->
            <text id="scene1-label-o" x="655" y="255" font-size="16" fill="#000000">O</text>
            
            <!-- 角度标签 ∠OAM (步骤 3 显示) -->
            <text id="scene1-label-angle-oam" class="step3-element" x="185" y="270" font-size="14" fill="#c62828" style="display: none; opacity: 0;">∠OAM</text>
            
            <!-- 角度标签 ∠APM (步骤 3 显示) -->
            <text id="scene1-label-angle-apm" class="step3-element" x="450" y="140" font-size="14" fill="#c62828" style="display: none; opacity: 0;">∠APM</text>
            
            <!-- 结论标签 (步骤 3 显示) -->
            <text id="scene1-label-conclusion" class="step3-element" x="350" y="400" font-size="18" fill="#c62828" font-weight="bold" style="display: none; opacity: 0;">∠OAM + ∠APM = 90°</text>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-prev-btn" disabled>◀ 上一步</button>
            <button id="scene1-next-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现
        // 布局坐标表（参考）：
        // 圆 O: 圆心 (550,250)，半径 100
        // 点 A: (100,250)
        // 点 P: (520,160)
        // 点 B: (450,275)
        // 点 C: (620,320)
        // 点 M: (535,298)
        // 点 O: (550,250)
        
        const currentScene = 1;
        let currentStep = 0;
        const totalSteps = 3;
        
        // 获取 DOM 元素
        const prevBtn = document.getElementById('scene1-prev-btn');
        const nextBtn = document.getElementById('scene1-next-btn');
        
        // 步骤 1 元素
        const step1Elements = document.querySelectorAll('.step1-element');
        
        // 步骤 2 元素
        const step2Elements = document.querySelectorAll('.step2-element');
        
        // 步骤 3 元素
        const step3Elements = document.querySelectorAll('.step3-element');
        
        // 更新按钮状态
        function updateButtonState() {
            prevBtn.disabled = (currentStep === 0);
            nextBtn.disabled = (currentStep === totalSteps);
        }
        
        // 显示元素（同时设置 display 和 opacity）
        function showElement(el) {
            el.style.display = '';
            el.style.opacity = '1';
        }
        
        // 隐藏元素（同时设置 display 和 opacity）
        function hideElement(el) {
            el.style.display = 'none';
            el.style.opacity = '0';
        }
        
        // 更新显示
        function updateDisplay() {
            // 步骤 0: 只显示基础图形（已默认显示）
            // 步骤 1: 显示辅助线 OP 和直角标记 1
            // 步骤 2: 显示辅助线 OM 和直角标记 2
            // 步骤 3: 显示角度弧和结论
            
            // 处理步骤 1 元素
            step1Elements.forEach(el => {
                if (currentStep >= 1) {
                    showElement(el);
                } else {
                    hideElement(el);
                }
            });
            
            // 处理步骤 2 元素
            step2Elements.forEach(el => {
                if (currentStep >= 2) {
                    showElement(el);
                } else {
                    hideElement(el);
                }
            });
            
            // 处理步骤 3 元素
            step3Elements.forEach(el => {
                if (currentStep >= 3) {
                    showElement(el);
                } else {
                    hideElement(el);
                }
            });
            
            updateButtonState();
        }
        
        // 上一步按钮点击
        prevBtn.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        });
        
        // 下一步按钮点击
        nextBtn.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateDisplay();
            }
        });
        
        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
