<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 1 - 三角形中位线结构</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 16px; z-index: 10; }
        .scene1-btn { padding: 8px 16px; font-size: 14px; background: #1976d2; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .scene1-btn:disabled { background: #bdbdbd; cursor: not-allowed; }
        .scene1-btn:hover:not(:disabled) { background: #1565c0; }
        #scene1-step-indicator { font-size: 14px; color: #424242; min-width: 100px; text-align: center; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-canvas" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 坐标表对照：
                A(400,80) 顶点
                B(120,380) 左下
                C(680,380) 右下
                D(260,230) AB 中点 = ((400+120)/2, (80+380)/2)
                E(540,230) AC 中点 = ((400+680)/2, (80+380)/2)
            -->
            
            <!-- 步骤 0: 三角形 ABC -->
            <g id="scene1-step-0">
                <!-- 三角形填充 -->
                <polygon points="400,80 120,380 680,380" fill="#f0f0f0" fill-opacity="0.3" stroke="#000000" stroke-width="2"/>
                <!-- 边 AB -->
                <line x1="400" y1="80" x2="120" y2="380" stroke="#000000" stroke-width="2"/>
                <!-- 边 BC -->
                <line x1="120" y1="380" x2="680" y2="380" stroke="#000000" stroke-width="2"/>
                <!-- 边 AC -->
                <line x1="400" y1="80" x2="680" y2="380" stroke="#000000" stroke-width="2"/>
                <!-- 顶点标签 -->
                <text id="scene1-label-a" x="400" y="60" text-anchor="middle" font-size="20" fill="#000000">A</text>
                <text id="scene1-label-b" x="100" y="400" text-anchor="middle" font-size="20" fill="#000000">B</text>
                <text id="scene1-label-c" x="700" y="400" text-anchor="middle" font-size="20" fill="#000000">C</text>
            </g>
            
            <!-- 步骤 1: 角度标注 -->
            <g id="scene1-step-1" style="display: none;">
                <!-- ∠A 弧线 -->
                <path id="scene1-ang-a-arc" d="M 420,90 A 40,40 0 0 1 385,115" fill="none" stroke="#1565c0" stroke-width="2"/>
                <!-- ∠A 数值 - 调整位置到三角形外部上方 -->
                <text id="scene1-ang-a-val" x="400" y="120" text-anchor="middle" font-size="14" fill="#1565c0">26°</text>
                <!-- ∠C 弧线 -->
                <path id="scene1-ang-c-arc" d="M 640,365 A 40,40 0 0 1 620,340" fill="none" stroke="#1565c0" stroke-width="2"/>
                <!-- ∠C 数值 - 调整位置到三角形外部右侧 -->
                <text id="scene1-ang-c-val" x="720" y="350" text-anchor="start" font-size="14" fill="#1565c0">120°</text>
            </g>
            
            <!-- 步骤 2: 中位线 DE -->
            <g id="scene1-step-2" style="display: none;">
                <!-- 中位线 DE -->
                <line id="scene1-line-de" x1="260" y1="230" x2="540" y2="230" stroke="#000000" stroke-width="2"/>
                <!-- 点 D -->
                <circle id="scene1-point-d" cx="260" cy="230" r="4" fill="#000000"/>
                <!-- 点 E -->
                <circle id="scene1-point-e" cx="540" cy="230" r="4" fill="#000000"/>
                <!-- 标签 D - 调整位置到三角形外部左侧，远离边 AB -->
                <text id="scene1-label-d" x="200" y="230" text-anchor="end" font-size="18" fill="#000000">D</text>
                <!-- 标签 E - 调整位置到三角形外部右侧，远离边 AC -->
                <text id="scene1-label-e" x="600" y="230" text-anchor="start" font-size="18" fill="#000000">E</text>
                <!-- 中点标记 AD -->
                <line id="scene1-mark-ad" x1="330" y1="150" x2="342" y2="160" stroke="#000000" stroke-width="1"/>
                <!-- 中点标记 DB -->
                <line id="scene1-mark-db" x1="195" y1="300" x2="207" y2="310" stroke="#000000" stroke-width="1"/>
                <!-- 中点标记 AE -->
                <line id="scene1-mark-ae" x1="470" y1="150" x2="458" y2="160" stroke="#000000" stroke-width="1"/>
                <!-- 中点标记 EC -->
                <line id="scene1-mark-ec" x1="610" y1="300" x2="598" y2="310" stroke="#000000" stroke-width="1"/>
            </g>
            
            <!-- 步骤 3: 平行标记 -->
            <g id="scene1-step-3" style="display: none;">
                <!-- DE 上的平行标记（双短线） -->
                <line id="scene1-parallel-de1" x1="388" y1="216" x2="396" y2="218" stroke="#c62828" stroke-width="2"/>
                <line id="scene1-parallel-de2" x1="396" y1="218" x2="404" y2="220" stroke="#c62828" stroke-width="2"/>
                <!-- BC 上的平行标记（双短线） -->
                <line id="scene1-parallel-bc1" x1="388" y1="366" x2="396" y2="368" stroke="#c62828" stroke-width="2"/>
                <line id="scene1-parallel-bc2" x1="396" y1="368" x2="404" y2="370" stroke="#c62828" stroke-width="2"/>
            </g>
        </svg>
        
        <div id="scene1-controls">
            <span id="scene1-step-indicator">步骤 1/4</span>
            <button id="scene1-btn-prev" class="scene1-btn" disabled>◀ 上一步</button>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现 - 三角形中位线结构
        let currentStep = 0;  // 当前步骤 (0-3)
        const totalSteps = 4;
        
        // 工具函数：显示元素
        function show(el) {
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }
        
        // 工具函数：隐藏元素
        function hide(el) {
            if (el) {
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }
        
        // 更新步骤显示
        function updateStep(step) {
            // 隐藏所有步骤组
            for (let i = 0; i < totalSteps; i++) {
                const group = document.getElementById('scene1-step-' + i);
                if (group) {
                    hide(group);
                }
            }
            
            // 显示当前步骤及之前的所有步骤
            for (let i = 0; i <= step; i++) {
                const group = document.getElementById('scene1-step-' + i);
                if (group) {
                    show(group);
                }
            }
            
            // 更新步骤指示器
            const indicator = document.getElementById('scene1-step-indicator');
            if (indicator) {
                indicator.textContent = '步骤 ' + (step + 1) + '/' + totalSteps;
            }
            
            // 更新按钮状态
            const prevBtn = document.getElementById('scene1-btn-prev');
            const nextBtn = document.getElementById('scene1-btn-next');
            if (prevBtn) {
                prevBtn.disabled = (step === 0);
            }
            if (nextBtn) {
                nextBtn.disabled = (step === totalSteps - 1);
            }
        }
        
        // 初始化
        function init() {
            // 初始显示步骤 0
            updateStep(currentStep);
            
            // 绑定按钮事件
            const prevBtn = document.getElementById('scene1-btn-prev');
            const nextBtn = document.getElementById('scene1-btn-next');
            
            if (prevBtn) {
                prevBtn.addEventListener('click', function() {
                    if (currentStep > 0) {
                        currentStep--;
                        updateStep(currentStep);
                    }
                });
            }
            
            if (nextBtn) {
                nextBtn.addEventListener('click', function() {
                    if (currentStep < totalSteps - 1) {
                        currentStep++;
                        updateStep(currentStep);
                    }
                });
            }
        }
        
        init();
    })();
    </script>
</body>
</html>
