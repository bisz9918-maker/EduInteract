<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 三角形折叠问题</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        .scene2-btn { padding: 8px 16px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; background: #f5f5f5; cursor: pointer; }
        .scene2-btn:hover { background: #e0e0e0; }
        .scene2-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene2-step-indicator { font-size: 14px; color: #666; }
        .scene2-hint { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); font-size: 14px; color: #333; background: #fff9e6; padding: 6px 12px; border-radius: 4px; border: 1px solid #ffd54f; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" id="scene2-svg">
            <!-- 定义 -->
            <defs>
                <marker id="scene2-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#000" />
                </marker>
            </defs>
            
            <!-- 原三角形 ABC -->
            <line id="scene2-line-AB" x1="100" y1="380" x2="280" y2="120" stroke="#000000" stroke-width="2" />
            <line id="scene2-line-BC" x1="100" y1="380" x2="400" y2="380" stroke="#000000" stroke-width="2" />
            <line id="scene2-line-AC" x1="280" y1="120" x2="400" y2="380" stroke="#000000" stroke-width="2" />
            
            <!-- 中位线 DE (虚线) -->
            <line id="scene2-line-DE" x1="240" y1="250" x2="340" y2="250" stroke="#888880" stroke-width="2" stroke-dasharray="5,5" />
            
            <!-- 折叠后的三角形 A'DE -->
            <line id="scene2-line-A'DE1" x1="240" y1="250" x2="280" y2="380" stroke="#000000" stroke-width="2" opacity="0" />
            <line id="scene2-line-A'DE2" x1="280" y1="380" x2="340" y2="250" stroke="#000000" stroke-width="2" opacity="0" />
            
            <!-- 顶点标签 - 调整位置避免与线段重叠 -->
            <text id="scene2-label-A" x="280" y="105" font-size="18" fill="#000" text-anchor="middle">A</text>
            <text id="scene2-label-B" x="70" y="400" font-size="18" fill="#000" text-anchor="middle">B</text>
            <text id="scene2-label-C" x="415" y="400" font-size="18" fill="#000" text-anchor="middle">C</text>
            <text id="scene2-label-D" x="240" y="275" font-size="18" fill="#000" text-anchor="middle">D</text>
            <text id="scene2-label-E" x="340" y="275" font-size="18" fill="#000" text-anchor="middle">E</text>
            <text id="scene2-label-A'" x="280" y="405" font-size="18" fill="#000" text-anchor="middle" opacity="0">A'</text>
            
            <!-- 角度标注 -->
            <!-- ∠A = 26° -->
            <path id="scene2-arc-A" d="M 295,120 A 30,30 0 0 0 275,145" stroke="#1565c0" stroke-width="2" fill="none" opacity="0" />
            <text id="scene2-text-angle-A" x="300" y="110" font-size="14" fill="#1565c0" opacity="0">∠A=26°</text>
            
            <!-- ∠B = 34° - 调整位置避免与线段重叠 -->
            <path id="scene2-arc-B" d="M 120,380 A 30,30 0 0 0 135,355" stroke="#000" stroke-width="2" fill="none" />
            <text id="scene2-text-angle-B" x="95" y="365" font-size="14" fill="#000">∠B=34°</text>
            
            <!-- ∠C = 120° -->
            <path id="scene2-arc-C" d="M 385,380 A 30,30 0 0 1 370,355" stroke="#000" stroke-width="2" fill="none" />
            <text id="scene2-text-angle-C" x="420" y="365" font-size="14" fill="#000">∠C=120°</text>
            
            <!-- ∠A' = 26° (步骤 2) -->
            <path id="scene2-arc-A'" d="M 295,380 A 30,30 0 0 0 275,405" stroke="#1565c0" stroke-width="2" fill="none" opacity="0" />
            <text id="scene2-text-angle-A'" x="300" y="390" font-size="14" fill="#1565c0" opacity="0">∠A'=26°</text>
            
            <!-- ∠ADE (步骤 2, 蓝色高亮) -->
            <path id="scene2-arc-ADE" d="M 265,250 A 25,25 0 0 0 250,270" stroke="#1565c0" stroke-width="2" fill="none" opacity="0" />
            <text id="scene2-text-angle-ADE" x="220" y="230" font-size="14" fill="#1565c0" opacity="0">∠ADE</text>
            
            <!-- ∠A'DE (步骤 2, 绿色高亮) -->
            <path id="scene2-arc-A'DE" d="M 265,250 A 35,35 0 0 1 280,285" stroke="#2e7d32" stroke-width="2" fill="none" opacity="0" />
            <text id="scene2-text-angle-A'DE" x="220" y="280" font-size="14" fill="#2e7d32" opacity="0">∠A'DE</text>
            
            <!-- ∠A'DB (步骤 3, 红色高亮) -->
            <path id="scene2-arc-A'DB" d="M 265,250 A 45,45 0 0 1 220,290" stroke="#c62828" stroke-width="2" fill="none" opacity="0" />
            <text id="scene2-text-angle-A'DB" x="180" y="320" font-size="14" fill="#c62828" opacity="0">∠A'DB</text>
            
            <!-- 辅助标签 -->
            <text id="scene2-text-de-midline" x="290" y="235" font-size="14" fill="#888" text-anchor="middle" opacity="0">DE 中位线</text>
            <text id="scene2-text-fold" x="290" y="270" font-size="14" fill="#ff9800" text-anchor="middle" opacity="0">折叠</text>
            
            <!-- 推导文字 -->
            <text id="scene2-text-fold-prop" x="450" y="260" font-size="14" fill="#2e7d32" opacity="0">∠A'DE = ∠ADE</text>
            <text id="scene2-text-parallel" x="450" y="285" font-size="14" fill="#1565c0" opacity="0">DE∥AB ⇒ ∠ADE = ∠B = 34°</text>
            
            <!-- 计算过程 (步骤 3) -->
            <text id="scene2-text-calc" x="450" y="320" font-size="14" fill="#c62828" opacity="0">∠A'DB = 180° - 34° - 34°</text>
            <text id="scene2-text-calc2" x="450" y="345" font-size="14" fill="#c62828" opacity="0">= 112°</text>
            
            <!-- 答案框 (步骤 3) -->
            <rect id="scene2-answer-box" x="440" y="360" width="140" height="35" fill="#fff9e6" stroke="#c62828" stroke-width="2" rx="4" opacity="0" />
            <text id="scene2-answer-text" x="510" y="382" font-size="16" fill="#c62828" text-anchor="middle" font-weight="bold" opacity="0">答案：112°</text>
        </svg>
        
        <!-- 提示文字 -->
        <div id="scene2-hint" class="scene2-hint">原三角形及中位线</div>
        
        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-prev-btn" class="scene2-btn" disabled>◀ 上一步</button>
            <span id="scene2-step-indicator" class="scene2-step-indicator">步骤 1/4</span>
            <button id="scene2-next-btn" class="scene2-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2: 三角形折叠问题
        // 布局坐标表对照：
        // | 元素 | 位置 | 备注 |
        // |------|------|------|
        // | B | (100,380) | 左下角 |
        // | C | (400,380) | 右下角 |
        // | A | (280,120) | 顶点（折叠前） |
        // | D | (240,250) | BC 中点 |
        // | E | (340,250) | AC 中点 |
        // | A' | (280,380) | 折叠后 A 的位置 |
        
        const scene2 = {
            currentStep: 0,
            totalSteps: 4,
            
            // 工具函数：显示元素
            show: function(id) {
                const el = document.getElementById(id);
                if (el) {
                    el.style.display = 'block';
                    el.style.opacity = '1';
                }
            },
            
            // 工具函数：隐藏元素
            hide: function(id) {
                const el = document.getElementById(id);
                if (el) {
                    el.style.opacity = '0';
                }
            },
            
            // 渲染当前步骤
            renderStep: function() {
                // 重置所有动态元素
                this.hide('scene2-label-A');
                this.hide('scene2-text-angle-A');
                this.hide('scene2-arc-A');
                this.hide('scene2-label-A\'');
                this.hide('scene2-line-A\'DE1');
                this.hide('scene2-line-A\'DE2');
                this.hide('scene2-text-de-midline');
                this.hide('scene2-text-fold');
                this.hide('scene2-text-angle-A\'');
                this.hide('scene2-arc-A\'');
                this.hide('scene2-arc-ADE');
                this.hide('scene2-text-angle-ADE');
                this.hide('scene2-arc-A\'DE');
                this.hide('scene2-text-angle-A\'DE');
                this.hide('scene2-text-fold-prop');
                this.hide('scene2-text-parallel');
                this.hide('scene2-arc-A\'DB');
                this.hide('scene2-text-angle-A\'DB');
                this.hide('scene2-text-calc');
                this.hide('scene2-text-calc2');
                this.hide('scene2-answer-box');
                this.hide('scene2-answer-text');
                
                // 根据步骤显示对应元素
                switch(this.currentStep) {
                    case 0:
                        // 显示原三角形
                        this.show('scene2-label-A');
                        this.show('scene2-text-angle-A');
                        this.show('scene2-arc-A');
                        document.getElementById('scene2-hint').textContent = '原三角形及中位线';
                        break;
                        
                    case 1:
                        // 显示折叠后的 A'
                        this.show('scene2-label-A\'');
                        this.show('scene2-line-A\'DE1');
                        this.show('scene2-line-A\'DE2');
                        this.show('scene2-text-de-midline');
                        this.show('scene2-text-fold');
                        document.getElementById('scene2-hint').textContent = '沿中位线 DE 折叠，A 点落到 A\'';
                        break;
                        
                    case 2:
                        // 显示角度关系
                        this.show('scene2-label-A\'');
                        this.show('scene2-line-A\'DE1');
                        this.show('scene2-line-A\'DE2');
                        this.show('scene2-text-angle-A\'');
                        this.show('scene2-arc-A\'');
                        this.show('scene2-arc-ADE');
                        this.show('scene2-text-angle-ADE');
                        this.show('scene2-arc-A\'DE');
                        this.show('scene2-text-angle-A\'DE');
                        this.show('scene2-text-fold-prop');
                        this.show('scene2-text-parallel');
                        document.getElementById('scene2-hint').textContent = '折叠后角度关系';
                        break;
                        
                    case 3:
                        // 显示待求角和答案
                        this.show('scene2-label-A\'');
                        this.show('scene2-line-A\'DE1');
                        this.show('scene2-line-A\'DE2');
                        this.show('scene2-arc-A\'DB');
                        this.show('scene2-text-angle-A\'DB');
                        this.show('scene2-text-calc');
                        this.show('scene2-text-calc2');
                        this.show('scene2-answer-box');
                        this.show('scene2-answer-text');
                        document.getElementById('scene2-hint').textContent = '待求角 ∠A\'DB = 112°';
                        break;
                }
                
                // 更新按钮状态
                document.getElementById('scene2-prev-btn').disabled = (this.currentStep === 0);
                document.getElementById('scene2-next-btn').disabled = (this.currentStep === this.totalSteps - 1);
                document.getElementById('scene2-step-indicator').textContent = '步骤 ' + (this.currentStep + 1) + '/' + this.totalSteps;
            },
            
            // 初始化
            init: function() {
                // 绑定按钮事件
                document.getElementById('scene2-prev-btn').addEventListener('click', function() {
                    if (scene2.currentStep > 0) {
                        scene2.currentStep--;
                        scene2.renderStep();
                    }
                });
                
                document.getElementById('scene2-next-btn').addEventListener('click', function() {
                    if (scene2.currentStep < scene2.totalSteps - 1) {
                        scene2.currentStep++;
                        scene2.renderStep();
                    }
                });
                
                // 初始渲染
                this.renderStep();
            }
        };
        
        // 启动
        scene2.init();
    })();
    </script>
</body>
</html>
