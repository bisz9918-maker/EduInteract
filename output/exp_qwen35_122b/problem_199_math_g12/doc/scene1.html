<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 1 - 正六边形几何特征</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Microsoft YaHei', sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 50px; right: 50px; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        #scene1-controls button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #333; border-radius: 4px; background: #f5f5f5; }
        #scene1-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 14px; font-weight: bold; color: #333; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 坐标轴组 (步骤 2) -->
            <g id="scene1-coordinate-axes" style="display: none;">
                <!-- x 轴 -->
                <line x1="100" y1="250" x2="700" y2="250" stroke="#000000" stroke-width="1.5" />
                <polygon points="700,250 690,245 690,255" fill="#000000" />
                <text x="690" y="240" font-size="14" fill="#000000">x</text>
                <!-- y 轴 -->
                <line x1="400" y1="80" x2="400" y2="420" stroke="#000000" stroke-width="1.5" />
                <polygon points="400,80 395,90 405,90" fill="#000000" />
                <text x="405" y="70" font-size="14" fill="#000000">y</text>
            </g>

            <!-- 正六边形轮廓 (步骤 0) -->
            <polygon id="scene1-hexagon-outline" points="550,250 475,120.1 325,120.1 250,250 325,379.9 475,379.9" 
                     fill="none" stroke="#000000" stroke-width="2" />

            <!-- 顶点标签组 (步骤 1) -->
            <g id="scene1-vertex-labels" style="display: none;">
                <text x="635" y="255" font-size="14" fill="#000000">C</text>
                <text x="485" y="105" font-size="14" fill="#000000">D</text>
                <text x="315" y="105" font-size="14" fill="#000000">E</text>
                <text x="165" y="255" font-size="14" fill="#000000">F</text>
                <text x="315" y="395" font-size="14" fill="#000000">A</text>
                <text x="485" y="395" font-size="14" fill="#000000">B</text>
                <!-- 原点 O 标签：调整位置到六边形外部下方，避免与轮廓重叠 -->
                <text x="410" y="280" font-size="14" fill="#000000" font-weight="bold">O</text>
            </g>

            <!-- 边长标注 (步骤 1) -->
            <text id="scene1-side-label" x="400" y="410" font-size="14" fill="#c62828" text-anchor="middle" style="display: none;">边长 = a</text>

            <!-- 高亮元素组 (步骤 3) -->
            <g id="scene1-highlight-elements" style="display: none;">
                <!-- AB 边高亮 -->
                <line x1="325" y1="379.9" x2="475" y2="379.9" stroke="#1565c0" stroke-width="3" />
                <!-- AB∥Ox 标注：向下移动以避免与边长标注重叠 -->
                <text x="400" y="435" font-size="14" fill="#2e7d32" text-anchor="middle">AB ∥ Ox</text>
            </g>
        </svg>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/4</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        // 布局坐标表对照：
        // 画布尺寸：800×500px，中心点 (400, 250)
        // 正六边形顶点（边长 a=150px）：
        //   C: (550, 250), D: (475, 120.1), E: (325, 120.1)
        //   F: (250, 250), A: (325, 379.9), B: (475, 379.9)
        // 标签位置：C(635,250), D(485,105), E(315,105), F(165,250), A(315,395), B(485,395), O(410,280)
        // 边长标注：(400,410) 红色，AB∥Ox 标注：(400,435) 绿色

        const currentStepMax = 3; // 步骤 0-3，共 4 步
        let currentStep = 0;

        // 获取 DOM 元素
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        const coordinateAxes = document.getElementById('scene1-coordinate-axes');
        const vertexLabels = document.getElementById('scene1-vertex-labels');
        const sideLabel = document.getElementById('scene1-side-label');
        const highlightElements = document.getElementById('scene1-highlight-elements');

        // 更新显示状态
        function updateDisplay() {
            // 步骤 0: 仅显示六边形轮廓
            // 步骤 1: 新增顶点标签、边长标注
            // 步骤 2: 新增坐标轴
            // 步骤 3: 新增高亮元素

            // 顶点标签组 (步骤 1+)
            vertexLabels.style.display = currentStep >= 1 ? 'block' : 'none';
            vertexLabels.style.opacity = currentStep >= 1 ? '1' : '0';

            // 边长标注 (步骤 1+)
            sideLabel.style.display = currentStep >= 1 ? 'block' : 'none';
            sideLabel.style.opacity = currentStep >= 1 ? '1' : '0';

            // 坐标轴组 (步骤 2+)
            coordinateAxes.style.display = currentStep >= 2 ? 'block' : 'none';
            coordinateAxes.style.opacity = currentStep >= 2 ? '1' : '0';

            // 高亮元素组 (步骤 3)
            highlightElements.style.display = currentStep >= 3 ? 'block' : 'none';
            highlightElements.style.opacity = currentStep >= 3 ? '1' : '0';

            // 更新步骤指示器
            stepIndicator.textContent = `步骤 ${currentStep + 1}/4`;

            // 更新按钮状态
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === currentStepMax;
        }

        // 按钮事件
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < currentStepMax) {
                currentStep++;
                updateDisplay();
            }
        });

        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
