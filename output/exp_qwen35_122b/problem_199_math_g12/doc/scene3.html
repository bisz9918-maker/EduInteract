<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 3 - 函数 S=f(t) 奇偶性验证</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Microsoft YaHei', sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene3-controls button {
            padding: 8px 20px;
            font-size: 14px;
            border: 2px solid #333;
            border-radius: 4px;
            background: #f5f5f5;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        #scene3-controls button:hover { background: #e0e0e0; }
        #scene3-controls button.active { background: #4caf50; color: white; border-color: #4caf50; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg id="scene3-canvas" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义 -->
            <defs>
                <marker id="scene3-arrow-x" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#000000" />
                </marker>
                <marker id="scene3-arrow-y" markerWidth="10" markerHeight="10" refX="3" refY="9" orient="auto">
                    <path d="M0,0 L6,0 L3,9 z" fill="#000000" />
                </marker>
            </defs>

            <!-- 正六边形 ABCDEF (半透明) -->
            <path id="scene3-hexagon" d="M 520,250 L 460,353.9 L 340,353.9 L 280,250 L 340,146.1 L 460,146.1 Z"
                  fill="none" stroke="#000000" stroke-width="2" opacity="0.3" />

            <!-- x 轴 -->
            <line id="scene3-axis-x" x1="150" y1="250" x2="650" y2="250" stroke="#000000" stroke-width="2" marker-end="url(#scene3-arrow-x)" />
            <text id="scene3-label-x" x="680" y="298" font-size="16" fill="#000000">x</text>

            <!-- y 轴 -->
            <line id="scene3-axis-y" x1="400" y1="100" x2="400" y2="400" stroke="#000000" stroke-width="2" marker-end="url(#scene3-arrow-y)" />
            <text id="scene3-label-y" x="405" y="95" font-size="16" fill="#000000">y</text>

            <!-- 原点 O -->
            <circle id="scene3-point-O" cx="400" cy="250" r="4" fill="#000000" />
            <text id="scene3-label-O" x="442" y="310" font-size="16" fill="#000000">O</text>

            <!-- 顶点标签 (调整位置避免重叠) -->
            <text id="scene3-label-A" x="325" y="420" font-size="16" fill="#000000">A</text>
            <text id="scene3-label-B" x="520" y="420" font-size="16" fill="#000000">B</text>
            <text id="scene3-label-C" x="572" y="255" font-size="16" fill="#000000">C</text>
            <text id="scene3-label-D" x="520" y="100" font-size="16" fill="#000000">D</text>
            <text id="scene3-label-E" x="325" y="100" font-size="16" fill="#000000">E</text>
            <text id="scene3-label-F" x="210" y="255" font-size="16" fill="#000000">F</text>

            <!-- 直线 t=0 (与 x 轴重合) -->
            <line id="scene3-line-t0" x1="100" y1="250" x2="700" y2="250" stroke="#000000" stroke-width="2" />
            <text id="scene3-label-t0" x="620" y="298" font-size="16" fill="#000000">t=0</text>

            <!-- 直线 t>0 (蓝色) -->
            <line id="scene3-line-t-pos" x1="100" y1="180" x2="700" y2="320" stroke="#1565c0" stroke-width="2" opacity="0" />
            <text id="scene3-label-t-pos" x="620" y="102" font-size="16" fill="#1565c0" opacity="0">t>0</text>

            <!-- 直线 t<0 (红色) -->
            <line id="scene3-line-t-neg" x1="100" y1="320" x2="700" y2="180" stroke="#c62828" stroke-width="2" opacity="0" />
            <text id="scene3-label-t-neg" x="620" y="398" font-size="16" fill="#c62828" opacity="0">t<0</text>

            <!-- 交点 M1, N1 (t>0 时) -->
            <circle id="scene3-point-M1" cx="280" cy="250" r="6" fill="#1565c0" opacity="0" />
            <text id="scene3-label-M1" x="202" y="298" font-size="16" fill="#1565c0" opacity="0">M₁</text>
            <circle id="scene3-point-N1" cx="460" cy="353.9" r="6" fill="#1565c0" opacity="0" />
            <text id="scene3-label-N1" x="526" y="430" font-size="16" fill="#1565c0" opacity="0">N₁</text>

            <!-- 交点 M2, N2 (t<0 时) -->
            <circle id="scene3-point-M2" cx="280" cy="250" r="6" fill="#c62828" opacity="0" />
            <text id="scene3-label-M2" x="202" y="204" font-size="16" fill="#c62828" opacity="0">M₂</text>
            <circle id="scene3-point-N2" cx="460" cy="146.1" r="6" fill="#c62828" opacity="0" />
            <text id="scene3-label-N2" x="520" y="80" font-size="16" fill="#c62828" opacity="0">N₂</text>

            <!-- 三角形 OM1N1 (蓝色填充) -->
            <polygon id="scene3-tri-OM1N1" points="400,250 280,250 460,353.9" fill="#1565c0" opacity="0" />

            <!-- 三角形 OM2N2 (红色填充) -->
            <polygon id="scene3-tri-OM2N2" points="400,250 280,250 460,146.1" fill="#c62828" opacity="0" />

            <!-- x 轴对称轴虚线 -->
            <line id="scene3-symmetry-axis" x1="150" y1="250" x2="650" y2="250" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" opacity="0" />

            <!-- 面积标签 (调整位置避免重叠) -->
            <text id="scene3-label-S1" x="650" y="122" font-size="18" fill="#2e7d32" font-weight="bold" opacity="0">S₁=1200</text>
            <text id="scene3-label-S2" x="650" y="338" font-size="18" fill="#2e7d32" font-weight="bold" opacity="0">S₂=1200</text>

            <!-- 结论标签 -->
            <text id="scene3-label-conclusion" x="620" y="452" font-size="18" fill="#2e7d32" font-weight="bold" opacity="0">f(t)=f(-t)，偶函数</text>
        </svg>

        <!-- 控件栏 -->
        <div id="scene3-controls">
            <button id="scene3-btn-state0" class="active">t=0</button>
            <button id="scene3-btn-state1">t>0</button>
            <button id="scene3-btn-state2">t<0</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 3 实现
        // 坐标表对照：
        // 原点 O: (400, 250)
        // 正六边形顶点：A(340,353.9), B(460,353.9), C(520,250), D(460,146.1), E(340,146.1), F(280,250)
        // 交点 M1/M2: (280, 250) - 与 F 点重合
        // 交点 N1: (460, 353.9) - 与 D 点对称位置
        // 交点 N2: (460, 146.1) - 与 B 点对称位置

        let currentState = 0;

        // 工具函数：显示元素
        function show(elId) {
            const el = document.getElementById(elId);
            if (el) {
                el.style.opacity = '1';
                el.style.display = 'block';
            }
        }

        // 工具函数：隐藏元素
        function hide(elId) {
            const el = document.getElementById(elId);
            if (el) {
                el.style.opacity = '0';
                el.style.display = 'none';
            }
        }

        // 状态切换函数
        function setState(state) {
            currentState = state;

            // 更新按钮状态
            document.querySelectorAll('#scene3-controls button').forEach((btn, idx) => {
                btn.classList.toggle('active', idx === state);
            });

            // 基础元素始终显示
            show('scene3-hexagon');
            show('scene3-axis-x');
            show('scene3-axis-y');
            show('scene3-point-O');
            show('scene3-label-O');
            show('scene3-label-A');
            show('scene3-label-B');
            show('scene3-label-C');
            show('scene3-label-D');
            show('scene3-label-E');
            show('scene3-label-F');
            show('scene3-label-x');
            show('scene3-label-y');

            // 根据状态显示不同元素
            if (state === 0) {
                // t=0 状态
                show('scene3-line-t0');
                show('scene3-label-t0');
                hide('scene3-line-t-pos');
                hide('scene3-line-t-neg');
                hide('scene3-point-M1');
                hide('scene3-point-N1');
                hide('scene3-point-M2');
                hide('scene3-point-N2');
                hide('scene3-tri-OM1N1');
                hide('scene3-tri-OM2N2');
                hide('scene3-label-M1');
                hide('scene3-label-N1');
                hide('scene3-label-M2');
                hide('scene3-label-N2');
                hide('scene3-label-t-pos');
                hide('scene3-label-t-neg');
                hide('scene3-label-S1');
                hide('scene3-label-S2');
                hide('scene3-label-conclusion');
                hide('scene3-symmetry-axis');
            } else if (state === 1) {
                // t>0 状态
                hide('scene3-line-t0');
                hide('scene3-label-t0');
                show('scene3-line-t-pos');
                hide('scene3-line-t-neg');
                show('scene3-point-M1');
                show('scene3-point-N1');
                hide('scene3-point-M2');
                hide('scene3-point-N2');
                show('scene3-tri-OM1N1');
                hide('scene3-tri-OM2N2');
                show('scene3-label-M1');
                show('scene3-label-N1');
                hide('scene3-label-M2');
                hide('scene3-label-N2');
                show('scene3-label-t-pos');
                hide('scene3-label-t-neg');
                show('scene3-label-S1');
                hide('scene3-label-S2');
                hide('scene3-label-conclusion');
                show('scene3-symmetry-axis');
            } else if (state === 2) {
                // t<0 状态
                hide('scene3-line-t0');
                hide('scene3-label-t0');
                hide('scene3-line-t-pos');
                show('scene3-line-t-neg');
                hide('scene3-point-M1');
                hide('scene3-point-N1');
                show('scene3-point-M2');
                show('scene3-point-N2');
                hide('scene3-tri-OM1N1');
                show('scene3-tri-OM2N2');
                hide('scene3-label-M1');
                hide('scene3-label-N1');
                show('scene3-label-M2');
                show('scene3-label-N2');
                hide('scene3-label-t-pos');
                show('scene3-label-t-neg');
                hide('scene3-label-S1');
                show('scene3-label-S2');
                show('scene3-label-conclusion');
                show('scene3-symmetry-axis');
            }
        }

        // 初始化
        setState(0);

        // 绑定按钮事件
        document.getElementById('scene3-btn-state0').addEventListener('click', function() {
            setState(0);
        });
        document.getElementById('scene3-btn-state1').addEventListener('click', function() {
            setState(1);
        });
        document.getElementById('scene3-btn-state2').addEventListener('click', function() {
            setState(2);
        });
    })();
    </script>
</body>
</html>
