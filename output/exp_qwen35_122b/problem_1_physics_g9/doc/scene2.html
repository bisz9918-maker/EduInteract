<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 杠杆力臂对比</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; z-index: 10; }
        #scene2-controls button {
            padding: 8px 16px;
            font-size: 14px;
            border: 2px solid #1565c0;
            background: #ffffff;
            color: #1565c0;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        #scene2-controls button:hover {
            background: #e3f2fd;
        }
        #scene2-controls button.active {
            background: #1565c0;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" id="scene2-svg">
            <!-- 状态提示框 -->
            <text id="scene2-status-text" x="400" y="50" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e7d32">
                F₃的力臂 L₃=OB，是最长的
            </text>

            <!-- 杠杆 -->
            <line x1="120" y1="280" x2="680" y2="280" stroke="#000000" stroke-width="3" id="scene2-lever"/>

            <!-- 支点三角形 -->
            <polygon points="120,280 110,300 130,300" fill="none" stroke="#000000" stroke-width="2" id="scene2-pivot"/>

            <!-- O 点标签 -->
            <text x="105" y="275" font-size="16" fill="#000000" id="scene2-label-O">O</text>

            <!-- A 点标签（向上移动更多，避免与杠杆重叠） -->
            <text x="320" y="230" font-size="16" fill="#000000" id="scene2-label-A">A</text>

            <!-- B 点标签（向上移动更多，避免与杠杆重叠） -->
            <text x="665" y="230" font-size="16" fill="#000000" id="scene2-label-B">B</text>

            <!-- 重物 G 矩形 -->
            <rect x="310" y="310" width="40" height="40" fill="#e0e0e0" stroke="#000000" stroke-width="2" id="scene2-weight-rect"/>

            <!-- G 标签（移到矩形下方，避免重叠） -->
            <text x="330" y="365" font-size="18" fill="#000000" text-anchor="middle" id="scene2-label-G">G</text>

            <!-- G 力箭头（向下） -->
            <line x1="330" y1="350" x2="330" y2="390" stroke="#c62828" stroke-width="2" id="scene2-force-G-line"/>
            <polygon points="330,390 325,380 335,380" fill="#c62828" id="scene2-force-G-arrow"/>

            <!-- F₁箭头（向右下） -->
            <line x1="680" y1="280" x2="740" y2="340" stroke="#1565c0" stroke-width="2" id="scene2-force-F1-line"/>
            <polygon points="740,340 730,335 735,345" fill="#1565c0" id="scene2-force-F1-arrow"/>
            <text x="750" y="350" font-size="14" fill="#1565c0" id="scene2-label-F1">F₁</text>

            <!-- F₂箭头（向右上） -->
            <line x1="680" y1="280" x2="740" y2="220" stroke="#1565c0" stroke-width="2" id="scene2-force-F2-line"/>
            <polygon points="740,220 730,225 735,215" fill="#1565c0" id="scene2-force-F2-arrow"/>
            <text x="750" y="220" font-size="14" fill="#1565c0" id="scene2-label-F2">F₂</text>

            <!-- F₃箭头（竖直向上） -->
            <line x1="680" y1="280" x2="680" y2="200" stroke="#1565c0" stroke-width="2" id="scene2-force-F3-line"/>
            <polygon points="680,200 675,210 685,210" fill="#1565c0" id="scene2-force-F3-arrow"/>
            <text x="670" y="190" font-size="14" fill="#1565c0" id="scene2-label-F3">F₃</text>

            <!-- F₄箭头（向左上） -->
            <line x1="680" y1="280" x2="620" y2="200" stroke="#1565c0" stroke-width="2" id="scene2-force-F4-line"/>
            <polygon points="620,200 625,210 615,210" fill="#1565c0" id="scene2-force-F4-arrow"/>
            <text x="600" y="195" font-size="14" fill="#1565c0" id="scene2-label-F4">F₄</text>

            <!-- L₁力臂（F₁的力臂，虚线） -->
            <line x1="120" y1="280" x2="720" y2="320" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" opacity="0.5" id="scene2-arm-L1"/>
            <text x="420" y="345" font-size="14" fill="#000000" text-anchor="middle" id="scene2-label-L1">L₁</text>

            <!-- L₂力臂（F₂的力臂，虚线） -->
            <line x1="120" y1="280" x2="720" y2="240" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" opacity="0.5" id="scene2-arm-L2"/>
            <text x="420" y="215" font-size="14" fill="#000000" text-anchor="middle" id="scene2-label-L2">L₂</text>

            <!-- L₃力臂（F₃的力臂，与杠杆重合）- 标签移到更上方避免重叠 -->
            <line x1="120" y1="280" x2="680" y2="280" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" opacity="0.5" id="scene2-arm-L3"/>
            <text x="400" y="235" font-size="14" fill="#000000" text-anchor="middle" id="scene2-label-L3">L₃</text>

            <!-- L₄力臂（F₄的力臂，虚线） -->
            <line x1="120" y1="280" x2="640" y2="220" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" opacity="0.5" id="scene2-arm-L4"/>
            <text x="380" y="200" font-size="14" fill="#000000" text-anchor="middle" id="scene2-label-L4">L₄</text>
        </svg>

        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-btn-F1">F₁</button>
            <button id="scene2-btn-F2">F₂</button>
            <button id="scene2-btn-F3">F₃</button>
            <button id="scene2-btn-F4">F₄</button>
            <button id="scene2-btn-all" class="active">全部对比</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2 实现 - 杠杆力臂对比
        // 布局坐标表（修复后 v2）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // |------|------|-----------|------|-------------|------|
        // | 杠杆 | 线段 | (120,280)-(680,280) | 560×6 | - | 水平居中，y=280 |
        // | 支点 | 三角形 | (120,280) | 20×20 | 下方 | O 点处，顶点向上 |
        // | O 点 | 文本标签 | (105,275) | 16×16 | 左上方 | 支点左侧 |
        // | A 点 | 文本标签 | (320,230) | 16×16 | 上方 | 杠杆上方，向上移动避免重叠 |
        // | B 点 | 文本标签 | (665,230) | 16×16 | 上方 | 杠杆上方，向上移动避免重叠 |
        // | 重物 G 矩形 | 矩形 | (310,310)-(350,350) | 40×40 | - | A 点正下方 |
        // | G 力箭头 | 箭头 | (330,350)-(330,390) | 40×3 | 右侧 | 向下红色箭头 |
        // | G 标签 | 文本 | (330,365) | 20×16 | 下方 | 矩形下方，避免重叠 |
        // | F₁箭头 | 箭头 | (680,280)-(740,340) | 70×3 | 右下方 | 从 B 点向右下 |
        // | F₂箭头 | 箭头 | (680,280)-(740,220) | 70×3 | 右上方 | 从 B 点向右上 |
        // | F₃箭头 | 箭头 | (680,280)-(680,200) | 80×3 | 上方 | 从 B 点竖直向上 |
        // | F₄箭头 | 箭头 | (680,280)-(620,200) | 80×3 | 左上方 | 从 B 点向左上 |
        // | L₁力臂 | 虚线 | (120,280)-(720,320) | 约 600 | 下方 | F₁力臂，灰色虚线 |
        // | L₂力臂 | 虚线 | (120,280)-(720,240) | 约 600 | 上方 | F₂力臂，灰色虚线 |
        // | L₃力臂 | 虚线 | (120,280)-(680,280) | 560 | 上方 | F₃力臂=OB，与杠杆重合 |
        // | L₄力臂 | 虚线 | (120,280)-(640,220) | 约 520 | 上方 | F₄力臂，灰色虚线 |
        // | L₃标签 | 文本 | (400,235) | 24×16 | 上方 | L₃力臂中点上方，向上移动避免重叠 |

        // 状态定义
        // 状态 0（默认/全部对比）：所有力臂显示为灰色虚线
        // 状态 1（F₁）：F₁箭头和 L₁力臂高亮
        // 状态 2（F₂）：F₂箭头和 L₂力臂高亮
        // 状态 3（F₃）：F₃箭头和 L₃力臂高亮
        // 状态 4（F₄）：F₄箭头和 L₄力臂高亮
        // 状态 5（全部对比）：同状态 0

        let currentState = 0; // 0=全部对比，1=F₁, 2=F₂, 3=F₃, 4=F₄, 5=全部对比

        // 获取 DOM 元素
        const statusText = document.getElementById('scene2-status-text');
        const buttons = {
            F1: document.getElementById('scene2-btn-F1'),
            F2: document.getElementById('scene2-btn-F2'),
            F3: document.getElementById('scene2-btn-F3'),
            F4: document.getElementById('scene2-btn-F4'),
            all: document.getElementById('scene2-btn-all')
        };

        const forceLines = {
            F1: document.getElementById('scene2-force-F1-line'),
            F2: document.getElementById('scene2-force-F2-line'),
            F3: document.getElementById('scene2-force-F3-line'),
            F4: document.getElementById('scene2-force-F4-line')
        };

        const forceArrows = {
            F1: document.getElementById('scene2-force-F1-arrow'),
            F2: document.getElementById('scene2-force-F2-arrow'),
            F3: document.getElementById('scene2-force-F3-arrow'),
            F4: document.getElementById('scene2-force-F4-arrow')
        };

        const arms = {
            L1: document.getElementById('scene2-arm-L1'),
            L2: document.getElementById('scene2-arm-L2'),
            L3: document.getElementById('scene2-arm-L3'),
            L4: document.getElementById('scene2-arm-L4')
        };

        const lever = document.getElementById('scene2-lever');

        // 状态文本映射
        const statusMessages = {
            0: 'F₃的力臂 L₃=OB，是最长的',
            1: 'L₁ < OB（F₁力臂最短）',
            2: 'L₂ < OB（F₂力臂较短）',
            3: 'L₃ = OB（最大）',
            4: 'L₄ < OB（F₄力臂较短）',
            5: 'F₃的力臂 L₃=OB，是最长的'
        };

        // 高亮颜色
        const HIGHLIGHT_COLOR = '#2e7d32';
        const NORMAL_COLOR = '#1565c0';
        const ARM_HIGHLIGHT_COLOR = '#2e7d32';
        const ARM_NORMAL_COLOR = '#888888';

        // 更新显示状态
        function updateDisplay() {
            // 更新状态文本
            statusText.textContent = statusMessages[currentState];

            // 重置所有按钮为未激活状态
            Object.values(buttons).forEach(btn => btn.classList.remove('active'));

            if (currentState === 0 || currentState === 5) {
                // 全部对比状态
                buttons.all.classList.add('active');

                // 所有力臂恢复灰色虚线，透明度 50%
                Object.values(arms).forEach(arm => {
                    arm.setAttribute('stroke', ARM_NORMAL_COLOR);
                    arm.setAttribute('stroke-width', '1');
                    arm.setAttribute('stroke-dasharray', '5,5');
                    arm.setAttribute('opacity', '0.5');
                });

                // 所有力箭头恢复蓝色
                Object.values(forceLines).forEach(line => {
                    line.setAttribute('stroke', NORMAL_COLOR);
                    line.setAttribute('stroke-width', '2');
                });
                Object.values(forceArrows).forEach(arrow => {
                    arrow.setAttribute('fill', NORMAL_COLOR);
                });

                // 恢复杠杆为黑色
                lever.setAttribute('stroke', '#000000');
                lever.setAttribute('stroke-width', '3');

            } else {
                // 单个力高亮状态
                const forceKey = 'F' + currentState;
                const armKey = 'L' + currentState;

                // 激活对应按钮
                buttons[forceKey].classList.add('active');

                // 重置所有力臂为灰色虚线，透明度 30%
                Object.values(arms).forEach(arm => {
                    arm.setAttribute('stroke', ARM_NORMAL_COLOR);
                    arm.setAttribute('stroke-width', '1');
                    arm.setAttribute('stroke-dasharray', '5,5');
                    arm.setAttribute('opacity', '0.3');
                });

                // 重置所有力箭头为蓝色
                Object.values(forceLines).forEach(line => {
                    line.setAttribute('stroke', NORMAL_COLOR);
                    line.setAttribute('stroke-width', '2');
                });
                Object.values(forceArrows).forEach(arrow => {
                    arrow.setAttribute('fill', NORMAL_COLOR);
                });

                // 高亮当前力臂
                arms[armKey].setAttribute('stroke', ARM_HIGHLIGHT_COLOR);
                arms[armKey].setAttribute('stroke-width', '3');
                arms[armKey].setAttribute('stroke-dasharray', 'none');
                arms[armKey].setAttribute('opacity', '1');

                // 高亮当前力箭头
                forceLines[forceKey].setAttribute('stroke', HIGHLIGHT_COLOR);
                forceLines[forceKey].setAttribute('stroke-width', '3');
                forceArrows[forceKey].setAttribute('fill', HIGHLIGHT_COLOR);

                // 特殊处理：如果当前是 F₃，L₃与杠杆重合，需要覆盖杠杆为绿色
                if (currentState === 3) {
                    lever.setAttribute('stroke', ARM_HIGHLIGHT_COLOR);
                    lever.setAttribute('stroke-width', '3');
                } else {
                    lever.setAttribute('stroke', '#000000');
                    lever.setAttribute('stroke-width', '3');
                }
            }
        }

        // 绑定按钮事件
        buttons.F1.addEventListener('click', function() {
            currentState = 1;
            updateDisplay();
        });

        buttons.F2.addEventListener('click', function() {
            currentState = 2;
            updateDisplay();
        });

        buttons.F3.addEventListener('click', function() {
            currentState = 3;
            updateDisplay();
        });

        buttons.F4.addEventListener('click', function() {
            currentState = 4;
            updateDisplay();
        });

        buttons.all.addEventListener('click', function() {
            currentState = 5;
            updateDisplay();
        });

        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
