<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 1 - 初始状态压强分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        .scene1-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; background: #1976d2; color: white; border: none; border-radius: 4px; }
        .scene1-btn:disabled { background: #bdbdbd; cursor: not-allowed; }
        .scene1-step-indicator { font-size: 14px; color: #424242; }
        /* 过渡动画 */
        .scene1-fade { transition: opacity 0.3s ease; }
        .scene1-highlight { animation: scene1-pulse 1s ease-in-out; }
        @keyframes scene1-pulse {
            0%, 100% { stroke-width: 2; }
            50% { stroke-width: 4; }
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <!-- SVG 图示区：固定 800×500px -->
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义斜线纹理 -->
            <defs>
                <pattern id="scene1-hatch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
                    <line x1="0" y1="0" x2="0" y2="10" stroke="#1565c0" stroke-width="1" opacity="0.5"/>
                </pattern>
            </defs>

            <!-- A 管左壁 -->
            <line id="scene1-tubeA-left" x1="280" y1="80" x2="280" y2="350" stroke="black" stroke-width="2"/>
            <!-- A 管右壁 -->
            <line id="scene1-tubeA-right" x1="520" y1="80" x2="520" y2="350" stroke="black" stroke-width="2"/>
            <!-- A 管底左（过渡段左） -->
            <line id="scene1-tubeA-bottom-left" x1="280" y1="200" x2="370" y2="200" stroke="black" stroke-width="2"/>
            <!-- A 管底右（过渡段右） -->
            <line id="scene1-tubeA-bottom-right" x1="430" y1="200" x2="520" y2="200" stroke="black" stroke-width="2"/>
            <!-- B 管左壁 -->
            <line id="scene1-tubeB-left" x1="370" y1="200" x2="370" y2="450" stroke="black" stroke-width="2"/>
            <!-- B 管右壁 -->
            <line id="scene1-tubeB-right" x1="430" y1="200" x2="430" y2="450" stroke="black" stroke-width="2"/>
            <!-- B 管底（封闭端） -->
            <line id="scene1-tubeB-bottom" x1="370" y1="450" x2="430" y2="450" stroke="black" stroke-width="2"/>

            <!-- 活塞 -->
            <rect id="scene1-piston" x="285" y="100" width="230" height="30" fill="#424242" class="scene1-fade" style="opacity: 1;"/>

            <!-- A 管水银 -->
            <rect id="scene1-mercury-A" x="285" y="130" width="230" height="70" fill="url(#scene1-hatch)" class="scene1-fade" style="opacity: 1;"/>
            <!-- B 管水银 -->
            <rect id="scene1-mercury-B" x="375" y="200" width="50" height="100" fill="url(#scene1-hatch)" class="scene1-fade" style="opacity: 1;"/>

            <!-- 封闭气柱 -->
            <rect id="scene1-gas" x="375" y="300" width="50" height="145" fill="#e3f2fd" class="scene1-fade" style="opacity: 1;"/>

            <!-- A 管标签 -->
            <text id="scene1-label-A" x="250" y="150" font-size="18" font-weight="bold" fill="black" class="scene1-fade" style="opacity: 1;">A</text>
            <!-- B 管标签 -->
            <text id="scene1-label-B" x="250" y="300" font-size="18" font-weight="bold" fill="black" class="scene1-fade" style="opacity: 1;">B</text>

            <!-- h₁标注线 -->
            <line id="scene1-h1-line" x1="550" y1="130" x2="550" y2="200" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" class="scene1-fade" style="opacity: 1;"/>
            <!-- h₁尺寸线（上端点） -->
            <line id="scene1-h1-top" x1="540" y1="130" x2="560" y2="130" stroke="#888888" stroke-width="1" class="scene1-fade" style="opacity: 1;"/>
            <!-- h₁尺寸线（下端点） -->
            <line id="scene1-h1-bottom" x1="540" y1="200" x2="560" y2="200" stroke="#888888" stroke-width="1" class="scene1-fade" style="opacity: 1;"/>
            <!-- h₁=5cm -->
            <text id="scene1-h1-text" x="570" y="165" font-size="14" fill="black" class="scene1-fade" style="opacity: 1;">h₁=5cm</text>

            <!-- h₂标注线 -->
            <line id="scene1-h2-line" x1="550" y1="200" x2="550" y2="300" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" class="scene1-fade" style="opacity: 1;"/>
            <!-- h₂尺寸线（上端点） -->
            <line id="scene1-h2-top" x1="540" y1="200" x2="560" y2="200" stroke="#888888" stroke-width="1" class="scene1-fade" style="opacity: 1;"/>
            <!-- h₂尺寸线（下端点） -->
            <line id="scene1-h2-bottom" x1="540" y1="300" x2="560" y2="300" stroke="#888888" stroke-width="1" class="scene1-fade" style="opacity: 1;"/>
            <!-- h₂=10cm -->
            <text id="scene1-h2-text" x="570" y="250" font-size="14" fill="black" class="scene1-fade" style="opacity: 1;">h₂=10cm</text>

            <!-- L 标注线 -->
            <line id="scene1-L-line" x1="550" y1="300" x2="550" y2="445" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" class="scene1-fade" style="opacity: 1;"/>
            <!-- L 尺寸线（上端点） -->
            <line id="scene1-L-top" x1="540" y1="300" x2="560" y2="300" stroke="#888888" stroke-width="1" class="scene1-fade" style="opacity: 1;"/>
            <!-- L 尺寸线（下端点） -->
            <line id="scene1-L-bottom" x1="540" y1="445" x2="560" y2="445" stroke="#888888" stroke-width="1" class="scene1-fade" style="opacity: 1;"/>
            <!-- L=112cm -->
            <text id="scene1-L-text" x="570" y="372" font-size="14" fill="black" class="scene1-fade" style="opacity: 1;">L=112cm</text>

            <!-- p₀箭头（步骤 1 显示） -->
            <line id="scene1-p0-arrow-line" x1="400" y1="60" x2="400" y2="100" stroke="#c62828" stroke-width="3" opacity="0" class="scene1-fade"/>
            <!-- p₀箭头头（步骤 1 显示） -->
            <polygon id="scene1-p0-arrow-head" points="395,90 405,90 400,100" fill="#c62828" opacity="0" class="scene1-fade"/>
            <!-- p₀=75cmHg（步骤 1 显示） -->
            <text id="scene1-p0-text" x="360" y="50" font-size="14" fill="#c62828" font-weight="bold" opacity="0" class="scene1-fade">p₀=75cmHg</text>

            <!-- S_A=4S_B（步骤 0 显示） -->
            <text id="scene1-SA-text" x="280" y="55" font-size="14" fill="black" class="scene1-fade" style="opacity: 1;">S_A=4S_B</text>

            <!-- p_气标签（步骤 2 显示） -->
            <text id="scene1-pgas-text" x="440" y="372" font-size="14" fill="#c62828" font-weight="bold" opacity="0" class="scene1-fade">p_气</text>

            <!-- 水银总高度标注（步骤 2 显示） -->
            <text id="scene1-h-total-text" x="570" y="210" font-size="14" fill="#c62828" opacity="0" class="scene1-fade">h₁+h₂=15cm</text>

            <!-- 压强平衡公式（步骤 3 显示） -->
            <text id="scene1-formula-text" x="250" y="220" font-size="16" fill="#c62828" font-weight="bold" opacity="0" class="scene1-fade">p_气 = p₀ + h₁ + h₂</text>

            <!-- 最终压强标签（步骤 4 显示）- 替代 p_气标签 -->
            <text id="scene1-pgas-result" x="440" y="372" font-size="14" fill="#c62828" font-weight="bold" opacity="0" class="scene1-fade">p_气 = 90cmHg</text>

            <!-- 结果框（上移至 y=420，避免与按钮重叠） -->
            <rect id="scene1-result-box" x="200" y="390" width="400" height="30" fill="white" stroke="#1976d2" stroke-width="2"/>
            <!-- 结果文本（y=438，居中于结果框内部） -->
            <text id="scene1-result-text" x="400" y="408" font-size="14" fill="#1976d2" font-weight="bold" text-anchor="middle">初始状态</text>
        </svg>

        <!-- 控件栏叠在 SVG 底部 -->
        <div id="scene1-controls">
            <button id="scene1-prev-btn" class="scene1-btn" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator" class="scene1-step-indicator">步骤 1/5</span>
            <button id="scene1-next-btn" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        // 布局坐标表对照：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // | A 管左壁 | 线段 | (280,80)-(280,350) | 4×270 | - | 粗管左侧 |
        // | A 管右壁 | 线段 | (520,80)-(520,350) | 4×270 | - | 粗管右侧 |
        // | B 管左壁 | 线段 | (370,200)-(370,450) | 4×250 | - | 细管左侧 |
        // | B 管右壁 | 线段 | (430,200)-(430,450) | 4×250 | - | 细管右侧 |
        // | 活塞 | 矩形 | (285,100)-(515,130) | 230×30 | - | 深灰色填充 |
        // | A 管水银 | 矩形 | (285,130)-(515,200) | 230×70 | - | 蓝色斜线填充 |
        // | B 管水银 | 矩形 | (375,200)-(425,300) | 50×100 | - | 蓝色斜线填充 |
        // | 封闭气柱 | 矩形 | (375,300)-(425,445) | 50×145 | - | 浅蓝色填充 |

        const TOTAL_STEPS = 5;
        let currentStep = 0;

        // 元素 ID 映射（按步骤分组）
        const stepElements = {
            // 步骤 0：初始状态全览（基础元素）
            step0: {
                show: [
                    'scene1-tubeA-left', 'scene1-tubeA-right', 'scene1-tubeA-bottom-left', 'scene1-tubeA-bottom-right',
                    'scene1-tubeB-left', 'scene1-tubeB-right', 'scene1-tubeB-bottom',
                    'scene1-piston', 'scene1-mercury-A', 'scene1-mercury-B', 'scene1-gas',
                    'scene1-label-A', 'scene1-label-B',
                    'scene1-h1-line', 'scene1-h1-top', 'scene1-h1-bottom', 'scene1-h1-text',
                    'scene1-h2-line', 'scene1-h2-top', 'scene1-h2-bottom', 'scene1-h2-text',
                    'scene1-L-line', 'scene1-L-top', 'scene1-L-bottom', 'scene1-L-text',
                    'scene1-SA-text',
                    'scene1-result-box', 'scene1-result-text'
                ],
                hide: [
                    'scene1-p0-arrow-line', 'scene1-p0-arrow-head', 'scene1-p0-text',
                    'scene1-pgas-text', 'scene1-h-total-text', 'scene1-formula-text', 'scene1-pgas-result'
                ],
                result: '初始状态'
            },
            // 步骤 1：高亮大气压作用
            step1: {
                show: [
                    'scene1-tubeA-left', 'scene1-tubeA-right', 'scene1-tubeA-bottom-left', 'scene1-tubeA-bottom-right',
                    'scene1-tubeB-left', 'scene1-tubeB-right', 'scene1-tubeB-bottom',
                    'scene1-piston', 'scene1-mercury-A', 'scene1-mercury-B', 'scene1-gas',
                    'scene1-label-A', 'scene1-label-B',
                    'scene1-h1-line', 'scene1-h1-top', 'scene1-h1-bottom', 'scene1-h1-text',
                    'scene1-h2-line', 'scene1-h2-top', 'scene1-h2-bottom', 'scene1-h2-text',
                    'scene1-L-line', 'scene1-L-top', 'scene1-L-bottom', 'scene1-L-text',
                    'scene1-SA-text',
                    'scene1-p0-arrow-line', 'scene1-p0-arrow-head', 'scene1-p0-text',
                    'scene1-result-box', 'scene1-result-text'
                ],
                hide: [
                    'scene1-pgas-text', 'scene1-h-total-text', 'scene1-formula-text', 'scene1-pgas-result'
                ],
                result: 'p₀ 作用于活塞上方'
            },
            // 步骤 2：高亮水银柱压强
            step2: {
                show: [
                    'scene1-tubeA-left', 'scene1-tubeA-right', 'scene1-tubeA-bottom-left', 'scene1-tubeA-bottom-right',
                    'scene1-tubeB-left', 'scene1-tubeB-right', 'scene1-tubeB-bottom',
                    'scene1-piston', 'scene1-mercury-A', 'scene1-mercury-B', 'scene1-gas',
                    'scene1-label-A', 'scene1-label-B',
                    'scene1-h1-line', 'scene1-h1-top', 'scene1-h1-bottom', 'scene1-h1-text',
                    'scene1-h2-line', 'scene1-h2-top', 'scene1-h2-bottom', 'scene1-h2-text',
                    'scene1-L-line', 'scene1-L-top', 'scene1-L-bottom', 'scene1-L-text',
                    'scene1-SA-text',
                    'scene1-p0-arrow-line', 'scene1-p0-arrow-head', 'scene1-p0-text',
                    'scene1-pgas-text', 'scene1-h-total-text',
                    'scene1-result-box', 'scene1-result-text'
                ],
                hide: [
                    'scene1-formula-text', 'scene1-pgas-result'
                ],
                result: '水银柱压强 = h₁ + h₂ = 15cmHg'
            },
            // 步骤 3：显示压强平衡公式
            step3: {
                show: [
                    'scene1-tubeA-left', 'scene1-tubeA-right', 'scene1-tubeA-bottom-left', 'scene1-tubeA-bottom-right',
                    'scene1-tubeB-left', 'scene1-tubeB-right', 'scene1-tubeB-bottom',
                    'scene1-piston', 'scene1-mercury-A', 'scene1-mercury-B', 'scene1-gas',
                    'scene1-label-A', 'scene1-label-B',
                    'scene1-h1-line', 'scene1-h1-top', 'scene1-h1-bottom', 'scene1-h1-text',
                    'scene1-h2-line', 'scene1-h2-top', 'scene1-h2-bottom', 'scene1-h2-text',
                    'scene1-L-line', 'scene1-L-top', 'scene1-L-bottom', 'scene1-L-text',
                    'scene1-SA-text',
                    'scene1-p0-arrow-line', 'scene1-p0-arrow-head', 'scene1-p0-text',
                    'scene1-pgas-text', 'scene1-h-total-text', 'scene1-formula-text',
                    'scene1-result-box', 'scene1-result-text'
                ],
                hide: [
                    'scene1-pgas-result'
                ],
                result: 'p_气 = p₀ + h₁ + h₂'
            },
            // 步骤 4：显示计算结果
            step4: {
                show: [
                    'scene1-tubeA-left', 'scene1-tubeA-right', 'scene1-tubeA-bottom-left', 'scene1-tubeA-bottom-right',
                    'scene1-tubeB-left', 'scene1-tubeB-right', 'scene1-tubeB-bottom',
                    'scene1-piston', 'scene1-mercury-A', 'scene1-mercury-B', 'scene1-gas',
                    'scene1-label-A', 'scene1-label-B',
                    'scene1-h1-line', 'scene1-h1-top', 'scene1-h1-bottom', 'scene1-h1-text',
                    'scene1-h2-line', 'scene1-h2-top', 'scene1-h2-bottom', 'scene1-h2-text',
                    'scene1-L-line', 'scene1-L-top', 'scene1-L-bottom', 'scene1-L-text',
                    'scene1-SA-text',
                    'scene1-p0-arrow-line', 'scene1-p0-arrow-head', 'scene1-p0-text',
                    'scene1-h-total-text', 'scene1-formula-text', 'scene1-pgas-result',
                    'scene1-result-box', 'scene1-result-text'
                ],
                hide: [
                    'scene1-pgas-text'  // 隐藏单独的 p_气标签，只显示 p_气 = 90cmHg
                ],
                result: 'p_气 = 75 + 5 + 10 = 90cmHg'
            }
        };

        // 工具函数：显示元素
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }

        // 工具函数：隐藏元素
        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }

        // 更新场景显示
        function updateScene() {
            const stepData = stepElements['step' + currentStep];

            // 先隐藏所有可能显示的元素
            Object.values(stepElements).forEach(step => {
                step.hide.forEach(id => hideElement(id));
            });

            // 显示当前步骤需要的元素
            stepData.show.forEach(id => showElement(id));

            // 更新结果文本
            document.getElementById('scene1-result-text').textContent = stepData.result;

            // 更新步骤指示器
            document.getElementById('scene1-step-indicator').textContent = '步骤 ' + (currentStep + 1) + '/' + TOTAL_STEPS;

            // 更新按钮状态
            document.getElementById('scene1-prev-btn').disabled = (currentStep === 0);
            document.getElementById('scene1-next-btn').disabled = (currentStep === TOTAL_STEPS - 1);
        }

        // 初始化
        function init() {
            updateScene();

            // 绑定按钮事件
            document.getElementById('scene1-prev-btn').addEventListener('click', function() {
                if (currentStep > 0) {
                    currentStep--;
                    updateScene();
                }
            });

            document.getElementById('scene1-next-btn').addEventListener('click', function() {
                if (currentStep < TOTAL_STEPS - 1) {
                    currentStep++;
                    updateScene();
                }
            });
        }

        // 页面加载完成后初始化
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>
</body>
</html>
