<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 3 - 拉力 F 随位移 x 的变化规律</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Microsoft YaHei', sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene3-btn {
            padding: 8px 20px;
            font-size: 14px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .scene3-btn:hover { background: #1565c0; }
        .scene3-btn.active { background: #0d47a1; box-shadow: 0 0 8px rgba(13, 71, 161, 0.5); }
        .scene3-btn:disabled { background: #bdbdbd; cursor: not-allowed; }
        #scene3-status-text {
            position: absolute;
            bottom: 55px;
            left: 20px;
            font-size: 16px;
            font-weight: bold;
            color: #424242;
        }
        .scene3-fade { transition: opacity 0.3s ease; }
        @keyframes scene3-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.5); }
        }
        .scene3-pulse { animation: scene3-pulse 1s infinite; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <!-- SVG 图示区：固定 800×500px -->
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 坐标系背景 (缩小范围，留出标签空间) -->
            <rect id="scene3-bg" x="140" y="100" width="520" height="280" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1"/>
            
            <!-- 网格线 -->
            <g id="scene3-grid">
                <!-- 垂直网格线 (x 方向) -->
                <line x1="192" y1="100" x2="192" y2="380" stroke="#e0e0e0" stroke-width="0.5" stroke-dasharray="4,4"/>
                <line x1="244" y1="100" x2="244" y2="380" stroke="#e0e0e0" stroke-width="0.5" stroke-dasharray="4,4"/>
                <line x1="296" y1="100" x2="296" y2="380" stroke="#e0e0e0" stroke-width="0.5" stroke-dasharray="4,4"/>
                <line x1="348" y1="100" x2="348" y2="380" stroke="#e0e0e0" stroke-width="0.5" stroke-dasharray="4,4"/>
                <line x1="400" y1="100" x2="400" y2="380" stroke="#e0e0e0" stroke-width="0.5" stroke-dasharray="4,4"/>
                <line x1="452" y1="100" x2="452" y2="380" stroke="#e0e0e0" stroke-width="0.5" stroke-dasharray="4,4"/>
                <line x1="504" y1="100" x2="504" y2="380" stroke="#e0e0e0" stroke-width="0.5" stroke-dasharray="4,4"/>
                <line x1="556" y1="100" x2="556" y2="380" stroke="#e0e0e0" stroke-width="0.5" stroke-dasharray="4,4"/>
                <line x1="608" y1="100" x2="608" y2="380" stroke="#e0e0e0" stroke-width="0.5" stroke-dasharray="4,4"/>
                <!-- 水平网格线 (F 方向) -->
                <line x1="140" y1="140" x2="660" y2="140" stroke="#e0e0e0" stroke-width="0.5" stroke-dasharray="4,4"/>
                <line x1="140" y1="180" x2="660" y2="180" stroke="#e0e0e0" stroke-width="0.5" stroke-dasharray="4,4"/>
                <line x1="140" y1="220" x2="660" y2="220" stroke="#e0e0e0" stroke-width="0.5" stroke-dasharray="4,4"/>
                <line x1="140" y1="260" x2="660" y2="260" stroke="#e0e0e0" stroke-width="0.5" stroke-dasharray="4,4"/>
                <line x1="140" y1="300" x2="660" y2="300" stroke="#e0e0e0" stroke-width="0.5" stroke-dasharray="4,4"/>
                <line x1="140" y1="340" x2="660" y2="340" stroke="#e0e0e0" stroke-width="0.5" stroke-dasharray="4,4"/>
            </g>
            
            <!-- 坐标轴 -->
            <g id="scene3-axis">
                <!-- 横轴 x -->
                <line x1="140" y1="380" x2="660" y2="380" stroke="#000000" stroke-width="1.5"/>
                <polygon points="660,380 650,375 650,385" fill="#000000"/>
                <!-- 纵轴 F -->
                <line x1="140" y1="100" x2="140" y2="380" stroke="#000000" stroke-width="1.5"/>
                <polygon points="140,100 135,110 145,110" fill="#000000"/>
            </g>
            
            <!-- 横轴刻度线 -->
            <g id="scene3-x-ticks">
                <line x1="140" y1="380" x2="140" y2="386" stroke="#000000" stroke-width="1"/>
                <line x1="192" y1="380" x2="192" y2="386" stroke="#000000" stroke-width="1"/>
                <line x1="244" y1="380" x2="244" y2="386" stroke="#000000" stroke-width="1"/>
                <line x1="296" y1="380" x2="296" y2="386" stroke="#000000" stroke-width="1"/>
                <line x1="348" y1="380" x2="348" y2="386" stroke="#000000" stroke-width="1"/>
                <line x1="400" y1="380" x2="400" y2="386" stroke="#000000" stroke-width="1"/>
                <line x1="452" y1="380" x2="452" y2="386" stroke="#000000" stroke-width="1"/>
                <line x1="504" y1="380" x2="504" y2="386" stroke="#000000" stroke-width="1"/>
                <line x1="556" y1="380" x2="556" y2="386" stroke="#000000" stroke-width="1"/>
                <line x1="608" y1="380" x2="608" y2="386" stroke="#000000" stroke-width="1"/>
                <line x1="660" y1="380" x2="660" y2="386" stroke="#000000" stroke-width="1"/>
            </g>
            
            <!-- 横轴刻度数值 -->
            <g id="scene3-x-labels" font-size="12" fill="#000000">
                <text x="140" y="398" text-anchor="middle">0</text>
                <text x="192" y="398" text-anchor="middle">5</text>
                <text x="244" y="398" text-anchor="middle">10</text>
                <text x="296" y="398" text-anchor="middle">15</text>
                <text x="348" y="398" text-anchor="middle">20</text>
                <text x="400" y="398" text-anchor="middle">25</text>
                <text x="452" y="398" text-anchor="middle">30</text>
            </g>
            
            <!-- F-x 曲线 (二次贝塞尔曲线模拟) -->
            <path id="scene3-curve" d="M 140,280 Q 245,130 350,180 T 660,380" fill="none" stroke="#1565c0" stroke-width="2" class="scene3-fade" opacity="1"/>
            
            <!-- 关键点标记 -->
            <g id="scene3-points">
                <!-- 起点 -->
                <circle id="scene3-point-start" cx="140" cy="280" r="3" fill="#c62828" class="scene3-fade" opacity="1"/>
                <!-- 极值点 -->
                <circle id="scene3-point-max" cx="350" cy="180" r="3" fill="#c62828" class="scene3-fade" opacity="1"/>
                <!-- 零点 -->
                <circle id="scene3-point-zero" cx="660" cy="380" r="3" fill="#c62828" class="scene3-fade scene3-pulse" opacity="0"/>
            </g>
            
            <!-- 坐标轴标签 (移出背景区域) -->
            <text id="scene3-label-x" x="670" y="405" font-size="14" fill="#000000">x (cm)</text>
            <text id="scene3-label-f" x="100" y="100" font-size="14" fill="#000000">F (N)</text>
            
            <!-- 起点坐标标注 (移出背景区域) -->
            <text id="scene3-text-start" x="95" y="280" font-size="12" fill="#000000" class="scene3-fade" opacity="1">x=0, F&lt;0</text>
            
            <!-- 零点坐标标注 (移出背景区域，向右移动避免与 x (cm) 拥挤) -->
            <text id="scene3-text-zero" x="705" y="375" font-size="12" fill="#000000" class="scene3-fade" opacity="0">x≈28cm, F=0</text>
            
            <!-- 趋势箭头和文字 (状态 3 显示，移出背景区域上方) -->
            <g id="scene3-trend-increase" class="scene3-fade" opacity="0">
                <text x="230" y="90" font-size="14" fill="#2e7d32" font-weight="bold">增大</text>
                <line x1="260" y1="95" x2="280" y2="80" stroke="#2e7d32" stroke-width="1.5"/>
                <polygon points="280,80 275,85 278,78" fill="#2e7d32"/>
            </g>
            <g id="scene3-trend-decrease" class="scene3-fade" opacity="0">
                <text x="480" y="90" font-size="14" fill="#2e7d32" font-weight="bold">减小</text>
                <line x1="510" y1="95" x2="530" y2="110" stroke="#2e7d32" stroke-width="1.5"/>
                <polygon points="530,110 525,105 528,112" fill="#2e7d32"/>
            </g>
        </svg>
        
        <!-- 状态说明文本 -->
        <div id="scene3-status-text">拉力 F 随活塞位移 x 的变化规律</div>
        
        <!-- 控件栏叠在 SVG 底部 -->
        <div id="scene3-controls">
            <button id="scene3-btn-1" class="scene3-btn">全览</button>
            <button id="scene3-btn-2" class="scene3-btn">临界点</button>
            <button id="scene3-btn-3" class="scene3-btn">趋势分析</button>
        </div>
    </div>
    <script>
    (function() {
        // Scene 3 实现
        // 布局坐标表对照：
        // 坐标系背景：(140,100)-(660,380) 520×280 (缩小以留出标签空间)
        // 横轴 x：(140,380)-(660,380)
        // 纵轴 F：(140,100)-(140,380)
        // 起点：(140,280)
        // 极值点：(350,180)
        // 零点：(660,380)
        // 横轴标签"x (cm)"：(670,405) - 移出背景
        // 纵轴标签"F (N)"：(100,100) - 移出背景
        // 起点坐标标注：(95,280) - 移出背景
        // 零点坐标标注：(705,375) - 移出背景，向右移动避免拥挤
        // 趋势箭头"增大"：(230,90) - 移出背景上方
        // 趋势箭头"减小"：(480,90) - 移出背景上方
        // 状态按钮：底部居中
        // 状态说明文本：bottom: 55px, left: 20px

        const scene3 = {
            currentStatus: 0,
            elements: {}
        };

        // 工具函数：显示元素
        function show(el) {
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }

        // 工具函数：隐藏元素
        function hide(el) {
            if (el) {
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }

        // 初始化
        function init() {
            // 获取 DOM 元素
            scene3.elements = {
                btn1: document.getElementById('scene3-btn-1'),
                btn2: document.getElementById('scene3-btn-2'),
                btn3: document.getElementById('scene3-btn-3'),
                statusText: document.getElementById('scene3-status-text'),
                curve: document.getElementById('scene3-curve'),
                pointStart: document.getElementById('scene3-point-start'),
                pointMax: document.getElementById('scene3-point-max'),
                pointZero: document.getElementById('scene3-point-zero'),
                textStart: document.getElementById('scene3-text-start'),
                textZero: document.getElementById('scene3-text-zero'),
                trendIncrease: document.getElementById('scene3-trend-increase'),
                trendDecrease: document.getElementById('scene3-trend-decrease')
            };

            // 绑定按钮事件
            scene3.elements.btn1.addEventListener('click', () => updateStatus(1));
            scene3.elements.btn2.addEventListener('click', () => updateStatus(2));
            scene3.elements.btn3.addEventListener('click', () => updateStatus(3));

            // 初始状态：显示全览
            updateStatus(1);
        }

        // 更新状态
        function updateStatus(status) {
            scene3.currentStatus = status;

            // 更新按钮状态
            [scene3.elements.btn1, scene3.elements.btn2, scene3.elements.btn3].forEach((btn, i) => {
                if (i + 1 === status) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            // 根据状态更新显示内容
            switch (status) {
                case 1: // 全览
                    scene3.elements.statusText.textContent = '完整曲线：F 从负值开始，先增大后减小至零';
                    show(scene3.elements.curve);
                    show(scene3.elements.pointStart);
                    show(scene3.elements.pointMax);
                    hide(scene3.elements.pointZero);
                    show(scene3.elements.textStart);
                    hide(scene3.elements.textZero);
                    hide(scene3.elements.trendIncrease);
                    hide(scene3.elements.trendDecrease);
                    break;

                case 2: // 临界点
                    scene3.elements.statusText.textContent = '临界点：x≈28cm 时 F=0，此时无需外力即可保持平衡';
                    show(scene3.elements.curve);
                    show(scene3.elements.pointStart);
                    show(scene3.elements.pointMax);
                    show(scene3.elements.pointZero);
                    // 高亮零点：放大并闪烁
                    scene3.elements.pointZero.setAttribute('r', '5');
                    scene3.elements.pointZero.classList.add('scene3-pulse');
                    hide(scene3.elements.textStart);
                    show(scene3.elements.textZero);
                    hide(scene3.elements.trendIncrease);
                    hide(scene3.elements.trendDecrease);
                    break;

                case 3: // 趋势分析
                    scene3.elements.statusText.textContent = '变化趋势：F 先增大（0<x<12cm）后减小（12cm<x<28cm）';
                    show(scene3.elements.curve);
                    show(scene3.elements.pointStart);
                    show(scene3.elements.pointMax);
                    show(scene3.elements.pointZero);
                    scene3.elements.pointZero.setAttribute('r', '3');
                    scene3.elements.pointZero.classList.remove('scene3-pulse');
                    hide(scene3.elements.textStart);
                    hide(scene3.elements.textZero);
                    show(scene3.elements.trendIncrease);
                    show(scene3.elements.trendDecrease);
                    break;
            }
        }

        // 页面加载完成后初始化
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>
</body>
</html>
