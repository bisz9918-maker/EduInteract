<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>带电粒子在组合场中的运动 - Scene 1</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene1-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #333; border-radius: 4px; background: #f5f5f5; }
        .scene1-btn:hover { background: #e0e0e0; }
        .scene1-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-step-display { font-size: 14px; line-height: 34px; min-width: 100px; text-align: center; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
                </marker>
                <marker id="scene1-arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0"/>
                </marker>
            </defs>

            <!-- 步骤 0: 坐标系基础 -->
            <g id="scene1-group-step0">
                <!-- x 轴 -->
                <line id="scene1-axis-x" x1="100" y1="250" x2="750" y2="250" stroke="#000" stroke-width="2" marker-end="url(#scene1-arrowhead)"/>
                <!-- y 轴 -->
                <line id="scene1-axis-y" x1="600" y1="50" x2="600" y2="450" stroke="#000" stroke-width="2" marker-end="url(#scene1-arrowhead)"/>
                <!-- 原点 O -->
                <circle id="scene1-point-O" cx="600" cy="250" r="3" fill="#000"/>
                <text id="scene1-label-O" x="610" y="260" font-size="14" fill="#000">O</text>
                <!-- x 轴标签 -->
                <text id="scene1-label-x" x="730" y="240" font-size="14" fill="#000">x</text>
                <!-- y 轴标签 -->
                <text id="scene1-label-y" x="590" y="60" font-size="14" fill="#000">y</text>
                <!-- 边界线 x=-2L (虚线) -->
                <line id="scene1-boundary" x1="200" y1="50" x2="200" y2="450" stroke="#666" stroke-width="1.5" stroke-dasharray="5,5"/>
                <text id="scene1-label-boundary" x="150" y="45" font-size="14" fill="#000">x=-2L</text>
            </g>

            <!-- 步骤 1: 电场区域 -->
            <g id="scene1-group-step1" style="display: none;">
                <!-- 第Ⅱ象限电场箭头（向下） -->
                <line id="scene1-e-field-1" x1="250" y1="100" x2="250" y2="180" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrowhead-blue)"/>
                <line id="scene1-e-field-2" x1="350" y1="100" x2="350" y2="180" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrowhead-blue)"/>
                <line id="scene1-e-field-3" x1="450" y1="100" x2="450" y2="180" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrowhead-blue)"/>
                <line id="scene1-e-field-4" x1="550" y1="100" x2="550" y2="180" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrowhead-blue)"/>
                <!-- 第Ⅲ象限电场箭头（向上） -->
                <line id="scene1-e-field-5" x1="250" y1="320" x2="250" y2="240" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrowhead-blue)"/>
                <line id="scene1-e-field-6" x1="350" y1="320" x2="350" y2="240" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrowhead-blue)"/>
                <line id="scene1-e-field-7" x1="450" y1="320" x2="450" y2="240" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrowhead-blue)"/>
                <line id="scene1-e-field-8" x1="550" y1="320" x2="550" y2="240" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrowhead-blue)"/>
                <!-- 电场标识 E -->
                <text id="scene1-label-E1" x="280" y="90" font-size="14" fill="#1565c0">E</text>
                <text id="scene1-label-E2" x="280" y="390" font-size="14" fill="#1565c0">E</text>
            </g>

            <!-- 步骤 2: 磁场区域 -->
            <g id="scene1-group-step2" style="display: none;">
                <!-- 磁场×符号网格 - 远离 x 标签，放在更右侧，减少列数，加大间距 -->
                <g id="scene1-magnetic-cross" fill="#000" font-size="14" text-anchor="middle" dominant-baseline="middle">
                    <!-- 3 列 × 6 行，x 坐标从 680 开始，避开 x 标签，间距加大 -->
                    <text x="680" y="90">×</text><text x="730" y="90">×</text><text x="760" y="90">×</text>
                    <text x="680" y="145">×</text><text x="730" y="145">×</text><text x="760" y="145">×</text>
                    <text x="680" y="200">×</text><text x="730" y="200">×</text><text x="760" y="200">×</text>
                    <text x="680" y="255">×</text><text x="730" y="255">×</text><text x="760" y="255">×</text>
                    <text x="680" y="310">×</text><text x="730" y="310">×</text><text x="760" y="310">×</text>
                    <text x="680" y="365">×</text><text x="730" y="365">×</text><text x="760" y="365">×</text>
                    <text x="680" y="420">×</text><text x="730" y="420">×</text><text x="760" y="420">×</text>
                </g>
                <!-- 磁场标识 B -->
                <text id="scene1-label-B" x="775" y="90" font-size="14" fill="#000">B</text>
            </g>

            <!-- 步骤 3: 发射线和关键点 -->
            <g id="scene1-group-step3" style="display: none;">
                <!-- 发射线 AC (绿色) -->
                <line id="scene1-line-AC" x1="200" y1="150" x2="200" y2="250" stroke="#2e7d32" stroke-width="2"/>
                <!-- A 点 -->
                <circle id="scene1-point-A" cx="200" cy="150" r="4" fill="#c62828"/>
                <text id="scene1-label-A" x="185" y="135" font-size="14" fill="#000">A</text>
                <!-- C 点 -->
                <circle id="scene1-point-C" cx="200" cy="250" r="4" fill="#c62828"/>
                <text id="scene1-label-C" x="185" y="265" font-size="14" fill="#000">C</text>
                <!-- A'点 -->
                <circle id="scene1-point-Ap" cx="600" cy="350" r="4" fill="#c62828"/>
                <text id="scene1-label-Ap" x="615" y="365" font-size="14" fill="#000">A'</text>
                <!-- v₀箭头 -->
                <line id="scene1-v0-line" x1="210" y1="150" x2="260" y2="150" stroke="#000" stroke-width="2" marker-end="url(#scene1-arrowhead)"/>
                <text id="scene1-label-v0" x="235" y="135" font-size="14" fill="#000">v₀</text>
                <!-- L 标签 -->
                <text id="scene1-label-L" x="170" y="200" font-size="14" fill="#000">L</text>
            </g>

            <!-- 步骤 4: 运动轨迹 -->
            <g id="scene1-group-step4" style="display: none;">
                <!-- 轨迹（电场段）- 抛物线，红色虚线 -->
                <path id="scene1-traj-electric" d="M 200 150 Q 300 250 400 250 T 600 350" fill="none" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5"/>
                <!-- 轨迹（磁场段）- 圆弧，红色实线，避开标签 -->
                <path id="scene1-traj-magnetic" d="M 600 350 A 100 100 0 0 1 680 420" fill="none" stroke="#c62828" stroke-width="2"/>
                <!-- OC 中点 -->
                <circle id="scene1-point-mid" cx="400" cy="250" r="4" fill="#c62828"/>
                <text id="scene1-label-mid" x="400" y="285" font-size="14" fill="#000" text-anchor="middle">OC 中点</text>
                <!-- 2L 标签 -->
                <text id="scene1-label-2L" x="400" y="305" font-size="14" fill="#000" text-anchor="middle">2L</text>
            </g>

            <!-- 步骤 5: 高亮和辅助线 -->
            <g id="scene1-group-step5" style="display: none;">
                <!-- 高亮轨迹（加粗） -->
                <path id="scene1-traj-highlight" d="M 200 150 Q 300 250 400 250 T 600 350 A 100 100 0 0 1 680 420" fill="none" stroke="#c62828" stroke-width="3" opacity="0.5"/>
                <!-- 对称性辅助线（虚线） -->
                <line id="scene1-sym-line1" x1="200" y1="150" x2="400" y2="250" stroke="#ff9800" stroke-width="1" stroke-dasharray="3,3"/>
                <line id="scene1-sym-line2" x1="400" y1="250" x2="600" y2="350" stroke="#ff9800" stroke-width="1" stroke-dasharray="3,3"/>
            </g>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn">◀ 上一步</button>
            <span id="scene1-step-display">步骤 0/5</span>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        // 坐标映射规则：
        // - 原点 O 映射到画布坐标 (600, 250)
        // - x 轴：画布 y=250，从 x=100 到 x=750
        // - y 轴：画布 x=600，从 y=50 到 y=450
        // - x=-2L 线：画布 x=200（距离原点 400px，代表 2L 长度）
        // - L 长度映射：200px（因此 2L=400px）

        const scene1 = {
            currentStep: 0,
            totalSteps: 5,
            elements: {
                // 步骤 0
                step0: ['scene1-axis-x', 'scene1-axis-y', 'scene1-point-O', 'scene1-label-O', 
                        'scene1-label-x', 'scene1-label-y', 'scene1-boundary', 'scene1-label-boundary'],
                // 步骤 1
                step1: ['scene1-group-step1'],
                // 步骤 2
                step2: ['scene1-group-step2'],
                // 步骤 3
                step3: ['scene1-group-step3'],
                // 步骤 4
                step4: ['scene1-group-step4'],
                // 步骤 5
                step5: ['scene1-group-step5']
            },
            stepNames: ['坐标系', '电场', '磁场', '发射点', '轨迹', '高亮'],

            init: function() {
                this.bindEvents();
                this.updateScene();
            },

            bindEvents: function() {
                const prevBtn = document.getElementById('scene1-btn-prev');
                const nextBtn = document.getElementById('scene1-btn-next');

                prevBtn.addEventListener('click', () => {
                    if (this.currentStep > 0) {
                        this.currentStep--;
                        this.updateScene();
                    }
                });

                nextBtn.addEventListener('click', () => {
                    if (this.currentStep < this.totalSteps) {
                        this.currentStep++;
                        this.updateScene();
                    }
                });
            },

            updateScene: function() {
                // 更新步骤显示
                document.getElementById('scene1-step-display').textContent = 
                    `步骤 ${this.currentStep}/${this.totalSteps} (${this.stepNames[this.currentStep]})`;

                // 更新按钮状态
                document.getElementById('scene1-btn-prev').disabled = (this.currentStep === 0);
                document.getElementById('scene1-btn-next').disabled = (this.currentStep === this.totalSteps);

                // 显示/隐藏各步骤元素
                for (let i = 0; i <= this.totalSteps; i++) {
                    const shouldShow = i <= this.currentStep;
                    const groupIds = this.elements['step' + i];
                    
                    groupIds.forEach(id => {
                        const el = document.getElementById(id);
                        if (el) {
                            if (shouldShow) {
                                el.style.display = 'block';
                                el.style.opacity = '1';
                            } else {
                                el.style.display = 'none';
                                el.style.opacity = '0';
                            }
                        }
                    });
                }
            }
        };

        // 初始化场景
        scene1.init();
    })();
    </script>
</body>
</html>
