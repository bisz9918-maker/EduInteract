<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 3 - 从 M 到 L 的能量转化与动能定理应用</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 0; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; pointer-events: none; }
        #scene3-slider-container { pointer-events: auto; background: rgba(255,255,255,0.95); padding: 4px 10px; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); display: flex; align-items: center; }
        #scene3-slider { width: 380px; cursor: pointer; margin: 0 6px; }
        #scene3-slider-label { font-size: 13px; color: #333; white-space: nowrap; }
        #scene3-slider-value { font-size: 15px; font-weight: bold; color: #1565c0; margin-left: 6px; white-space: nowrap; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg width="800" height="500" id="scene3-svg">
            <!-- 电场线 -->
            <g id="scene3-electric-field">
                <line x1="50" y1="100" x2="450" y2="100" stroke="#000000" stroke-width="1" marker-end="url(#arrowhead)"/>
                <line x1="50" y1="130" x2="450" y2="130" stroke="#000000" stroke-width="1" marker-end="url(#arrowhead)"/>
                <line x1="50" y1="160" x2="450" y2="160" stroke="#000000" stroke-width="1" marker-end="url(#arrowhead)"/>
                <line x1="50" y1="190" x2="450" y2="190" stroke="#000000" stroke-width="1" marker-end="url(#arrowhead)"/>
                <line x1="50" y1="220" x2="450" y2="220" stroke="#000000" stroke-width="1" marker-end="url(#arrowhead)"/>
                <line x1="50" y1="250" x2="450" y2="250" stroke="#000000" stroke-width="1" marker-end="url(#arrowhead)"/>
                <text x="380" y="120" font-size="16" font-weight="bold">E</text>
            </g>

            <!-- 箭头标记定义 -->
            <defs>
                <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
                </marker>
            </defs>

            <!-- 半圆轨道 -->
            <path d="M 350 350 A 80 80 0 0 1 270 270" stroke="#000000" stroke-width="2" fill="none"/>
            
            <!-- 水平轨道 MN -->
            <line id="scene3-track-mn" x1="150" y1="350" x2="350" y2="350" stroke="#000000" stroke-width="3"/>

            <!-- 轨道标签 - 调整位置避免重叠 -->
            <text id="scene3-label-n" x="345" y="378" font-size="14" fill="#000000">N</text>
            <text id="scene3-label-p" x="250" y="340" font-size="14" fill="#000000">P</text>
            <text id="scene3-label-l" x="365" y="255" font-size="14" fill="#000000">L</text>

            <!-- 物块 -->
            <rect id="scene3-block" x="250" y="320" width="30" height="30" fill="#1565c0" fill-opacity="0.2" stroke="#1565c0" stroke-width="2"/>
            <text id="scene3-label-vm" x="160" y="310" font-size="14" fill="#000000">v_M=0</text>

            <!-- 速度标签 - 分散排列在底部，避免重叠，移到滑块轨道上方 -->
            <text id="scene3-label-vn" x="340" y="415" font-size="14" fill="#000000">v_N=<tspan id="scene3-vn-val">0.00</tspan></text>
            <text id="scene3-label-vp" x="230" y="435" font-size="14" fill="#000000">v_P=<tspan id="scene3-vp-val">0.00</tspan></text>
            <text id="scene3-label-vl" x="365" y="455" font-size="14" fill="#000000">v_L=<tspan id="scene3-vl-val">0.00</tspan></text>

            <!-- 能量条区域 - 调整数值位置到能量条右侧外部，增加间距，确保不超出画布 -->
            <!-- 动能 Ek 条 -->
            <rect id="scene3-ek-bar" x="560" y="80" width="0" height="40" fill="#1565c0" fill-opacity="0.3"/>
            <text id="scene3-label-ek" x="540" y="100" font-size="14" fill="#000000">E_k:</text>
            <text id="scene3-ek-val" x="775" y="100" font-size="14" fill="#000000" text-anchor="end">0.00 J</text>

            <!-- 电势能 Ep电 条 -->
            <rect id="scene3-epel-bar" x="560" y="140" width="0" height="40" fill="#2e7d32" fill-opacity="0.3"/>
            <text id="scene3-label-epel" x="520" y="160" font-size="14" fill="#000000">E_p电:</text>
            <text id="scene3-epel-val" x="775" y="160" font-size="14" fill="#000000" text-anchor="end">0.00 J</text>

            <!-- 重力势能 Ep重 条 -->
            <rect id="scene3-epg-bar" x="560" y="200" width="0" height="40" fill="#c62828" fill-opacity="0.3"/>
            <text id="scene3-label-epg" x="520" y="220" font-size="14" fill="#000000">E_p重:</text>
            <text id="scene3-epg-val" x="775" y="220" font-size="14" fill="#000000" text-anchor="end">0.00 J</text>

            <!-- 摩擦损耗 Wf 条 -->
            <rect id="scene3-wf-bar" x="560" y="260" width="0" height="40" fill="#888888" fill-opacity="0.3"/>
            <text id="scene3-label-wf" x="540" y="280" font-size="14" fill="#000000">W_f:</text>
            <text id="scene3-wf-val" x="775" y="280" font-size="14" fill="#000000" text-anchor="end">0.00 J</text>

            <!-- 能量转化箭头 -->
            <line id="scene3-arrow-1" x1="400" y1="350" x2="480" y2="100" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
            <line id="scene3-arrow-2" x1="400" y1="350" x2="480" y2="220" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
            <line id="scene3-arrow-3" x1="400" y1="350" x2="480" y2="280" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>

            <!-- S 滑块轨道 -->
            <line id="scene3-slider-track" x1="150" y1="450" x2="750" y2="450" stroke="#1565c0" stroke-width="3"/>
            <circle id="scene3-slider-knob" cx="350" cy="450" r="12" fill="#1565c0" stroke="#0d47a1" stroke-width="2" style="cursor: pointer;"/>
            <text id="scene3-label-s" x="150" y="475" font-size="13" fill="#000000">0.5m</text>
            <text id="scene3-label-s-mid" x="450" y="475" font-size="13" fill="#000000">1.0m</text>
            <text id="scene3-label-s-end" x="745" y="475" font-size="13" fill="#000000">2.0m</text>
            <text id="scene3-s-value" x="450" y="435" font-size="15" font-weight="bold" fill="#1565c0" text-anchor="middle">S=1.00m</text>

            <!-- 临界状态提示 -->
            <text id="scene3-critical-hint" x="400" y="50" font-size="14" fill="#c62828" text-anchor="middle" opacity="0">临界 S≈1.6m (v_L=0)</text>
        </svg>

        <div id="scene3-controls">
            <div id="scene3-slider-container">
                <span id="scene3-slider-label">S 值:</span>
                <input type="range" id="scene3-slider" min="50" max="200" value="100" step="1">
                <span id="scene3-slider-value">S=1.00m</span>
            </div>
        </div>
    </div>

    <script>
    (function() {
        // Scene 3 实现 - 从 M 到 L 的能量转化与动能定理应用
        // 布局坐标表对照：
        // | 元素 | 位置/范围 | 备注 |
        // | 水平轨道 MN | (150,350)-(350,350) | 长度随 S 值变化 |
        // | 半圆轨道 | 圆心 (350,350)，半径 80px | 从 N 到 L 的 1/4 圆 |
        // | N 点 | (345,378) | 轨道连接点 |
        // | P 点 | (250,340) | 半圆中点 |
        // | L 点 | (365,255) | 最高点 |
        // | 速度标签 | vN(340,415), vP(230,435), vL(365,455) | 分散排列在底部 |
        // | 物块 | 随 S 值在 (150~350, 320) 移动 | 蓝色填充 20% 透明度 |
        // | 电场线 | y=100,130,160,190,220,250 | 水平向左箭头 |
        // | E 标签 | (380,120) | 电场标识 |
        // | 能量条 | 右侧垂直排列 | 4 个能量条 |
        // | S 滑块 | (150,450)-(750,450) | 滑块轨道 |

        // 物理常量
        const m = 0.08;        // 质量 80g = 0.08kg
        const q = 2e-4;        // 电荷 2×10^-4 C
        const E = 1e3;         // 电场强度 10^3 V/m
        const mu = 0.2;        // 摩擦系数
        const R = 0.4;         // 半径 40cm = 0.4m
        const g = 10;          // 重力加速度

        // 计算力
        const F_electric = q * E;           // 电场力 = 0.2N
        const F_friction = mu * m * g;      // 摩擦力 = 0.16N
        const F_net = F_electric - F_friction;  // 净力 = 0.04N

        // S 值范围 (m)
        const S_MIN = 0.5;
        const S_MAX = 2.0;
        const S_CRITICAL = 1.6;  // 临界 S 值

        // 滑块像素范围
        const SLIDER_X_MIN = 150;
        const SLIDER_X_MAX = 750;
        const SLIDER_WIDTH = SLIDER_X_MAX - SLIDER_X_MIN;  // 600px

        // 当前状态
        let currentS = 1.0;  // 初始 S=1.0m
        let isDragging = false;

        // DOM 元素引用
        const svg = document.getElementById('scene3-svg');
        const block = document.getElementById('scene3-block');
        const trackMN = document.getElementById('scene3-track-mn');
        const sliderKnob = document.getElementById('scene3-slider-knob');
        const sliderInput = document.getElementById('scene3-slider');
        const sliderValueDisplay = document.getElementById('scene3-slider-value');
        const sValueDisplay = document.getElementById('scene3-s-value');
        const criticalHint = document.getElementById('scene3-critical-hint');

        // 能量条引用
        const ekBar = document.getElementById('scene3-ek-bar');
        const epelBar = document.getElementById('scene3-epel-bar');
        const epgBar = document.getElementById('scene3-epg-bar');
        const wfBar = document.getElementById('scene3-wf-bar');

        // 能量值显示引用
        const ekVal = document.getElementById('scene3-ek-val');
        const epelVal = document.getElementById('scene3-epel-val');
        const epgVal = document.getElementById('scene3-epg-val');
        const wfVal = document.getElementById('scene3-wf-val');

        // 速度值显示引用
        const vnVal = document.getElementById('scene3-vn-val');
        const vpVal = document.getElementById('scene3-vp-val');
        const vlVal = document.getElementById('scene3-vl-val');

        // 坐标转换函数
        function sToPixel(s) {
            return SLIDER_X_MIN + (s - S_MIN) / (S_MAX - S_MIN) * SLIDER_WIDTH;
        }

        function pixelToS(pixelX) {
            const clamped = Math.max(SLIDER_X_MIN, Math.min(SLIDER_X_MAX, pixelX));
            return S_MIN + (clamped - SLIDER_X_MIN) / SLIDER_WIDTH * (S_MAX - S_MIN);
        }

        function blockXFromS(s) {
            return 150 + (s - S_MIN) / (S_MAX - S_MIN) * 200;
        }

        // 能量计算函数
        function calculateEnergy(s) {
            const ekN = F_net * s * 100;
            const epel = -F_electric * s * 100;
            const epgN = 0;
            const epgP = m * g * R;
            const epgL = m * g * 2 * R;
            const wf = F_friction * s * 100;
            return { ekN, epel, epgN, epgP, epgL, wf };
        }

        // 速度计算函数
        function calculateVelocity(s) {
            const energy = calculateEnergy(s);
            const vn = Math.sqrt(2 * energy.ekN / m);
            const ekP = energy.ekN - m * g * R;
            const vp = ekP > 0 ? Math.sqrt(2 * ekP / m) : 0;
            const ekL = energy.ekN - m * g * 2 * R;
            const vl = ekL > 0 ? Math.sqrt(2 * ekL / m) : 0;
            return { vn, vp, vl, ekL };
        }

        // 更新界面
        function updateDisplay() {
            const energy = calculateEnergy(currentS);
            const velocity = calculateVelocity(currentS);

            // 更新物块位置
            const bx = blockXFromS(currentS);
            block.setAttribute('x', bx);

            // 更新水平轨道长度
            trackMN.setAttribute('x2', 350);

            // 更新滑块位置
            const sliderX = sToPixel(currentS);
            sliderKnob.setAttribute('cx', sliderX);
            sliderInput.value = currentS;

            // 更新 S 值显示
            sliderValueDisplay.textContent = 'S=' + currentS.toFixed(2) + 'm';
            sValueDisplay.textContent = 'S=' + currentS.toFixed(2) + 'm';

            // 更新能量条 (最大能量参考值 8J)
            const maxEnergy = 8.0;
            const ekWidth = Math.min(180, (energy.ekN / maxEnergy) * 180);
            const epelWidth = Math.min(180, (Math.abs(energy.epel) / maxEnergy) * 180);
            const epgWidth = Math.min(180, (energy.epgL / maxEnergy) * 180);
            const wfWidth = Math.min(180, (energy.wf / maxEnergy) * 180);

            ekBar.setAttribute('width', ekWidth);
            epelBar.setAttribute('width', epelWidth);
            epgBar.setAttribute('width', epgWidth);
            wfBar.setAttribute('width', wfWidth);

            // 更新能量数值
            ekVal.textContent = energy.ekN.toFixed(2) + ' J';
            epelVal.textContent = energy.epel.toFixed(2) + ' J';
            epgVal.textContent = energy.epgL.toFixed(2) + ' J';
            wfVal.textContent = energy.wf.toFixed(2) + ' J';

            // 更新速度数值
            vnVal.textContent = velocity.vn.toFixed(2);
            vpVal.textContent = velocity.vp.toFixed(2);
            vlVal.textContent = velocity.vl.toFixed(2);

            // 临界状态高亮
            if (Math.abs(currentS - S_CRITICAL) < 0.1) {
                block.setAttribute('stroke', '#c62828');
                block.setAttribute('stroke-width', '3');
                criticalHint.setAttribute('opacity', '1');
            } else {
                block.setAttribute('stroke', '#1565c0');
                block.setAttribute('stroke-width', '2');
                criticalHint.setAttribute('opacity', '0');
            }
        }

        // 滑块交互处理
        function handleSliderMove(clientX) {
            const rect = sliderInput.getBoundingClientRect();
            const pixelX = SLIDER_X_MIN + (clientX - rect.left) / rect.width * SLIDER_WIDTH;
            currentS = pixelToS(pixelX);
            updateDisplay();
        }

        // 鼠标事件
        sliderKnob.addEventListener('mousedown', function(e) {
            isDragging = true;
            e.preventDefault();
        });

        document.addEventListener('mousemove', function(e) {
            if (isDragging) {
                handleSliderMove(e.clientX);
            }
        });

        document.addEventListener('mouseup', function() {
            isDragging = false;
        });

        // 滑块输入事件
        sliderInput.addEventListener('input', function() {
            currentS = parseFloat(this.value);
            updateDisplay();
        });

        // 触摸事件支持
        sliderKnob.addEventListener('touchstart', function(e) {
            isDragging = true;
            e.preventDefault();
        });

        document.addEventListener('touchmove', function(e) {
            if (isDragging && e.touches.length > 0) {
                handleSliderMove(e.touches[0].clientX);
            }
        });

        document.addEventListener('touchend', function() {
            isDragging = false;
        });

        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
