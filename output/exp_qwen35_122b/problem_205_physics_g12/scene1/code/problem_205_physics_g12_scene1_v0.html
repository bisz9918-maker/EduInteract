<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>带电物块在复合场中的运动 - 场景 1</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        .scene1-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 2px solid #1565c0; border-radius: 4px; background: #ffffff; color: #1565c0; transition: all 0.2s; }
        .scene1-btn:hover { background: #1565c0; color: #ffffff; }
        .scene1-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 14px; font-weight: bold; color: #333; min-width: 80px; text-align: center; }
        svg { display: block; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#888888"/>
                </marker>
                <marker id="scene1-arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0"/>
                </marker>
                <marker id="scene1-arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#c62828"/>
                </marker>
                <marker id="scene1-arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32"/>
                </marker>
            </defs>

            <!-- 电场线 (7 条平行箭头线) -->
            <g id="scene1-electric-field">
                <line x1="50" y1="80" x2="400" y2="80" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#scene1-arrowhead)"/>
                <line x1="50" y1="140" x2="400" y2="140" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#scene1-arrowhead)"/>
                <line x1="50" y1="200" x2="400" y2="200" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#scene1-arrowhead)"/>
                <line x1="50" y1="260" x2="400" y2="260" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#scene1-arrowhead)"/>
                <line x1="50" y1="320" x2="400" y2="320" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#scene1-arrowhead)"/>
                <line x1="50" y1="380" x2="400" y2="380" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#scene1-arrowhead)"/>
                <line x1="50" y1="440" x2="400" y2="440" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#scene1-arrowhead)"/>
            </g>

            <!-- 电场 E 标签 -->
            <text id="scene1-label-E" x="60" y="60" font-size="16" font-weight="bold" fill="#000000">E</text>

            <!-- 水平轨道 MN -->
            <line id="scene1-track-horiz" x1="150" y1="350" x2="550" y2="350" stroke="#000000" stroke-width="2"/>
            <line id="scene1-track-horiz-highlight" x1="150" y1="350" x2="550" y2="350" stroke="#1565c0" stroke-width="4" opacity="0"/>

            <!-- 半圆轨道 NL (圆心 550,350，半径 120，角度 0°→180°) -->
            <path id="scene1-track-semi" d="M 550 350 A 120 120 0 0 1 550 230" stroke="#000000" stroke-width="2" fill="none"/>
            <path id="scene1-track-semi-highlight" d="M 550 350 A 120 120 0 0 1 550 230" stroke="#1565c0" stroke-width="4" fill="none" opacity="0"/>

            <!-- 物块 (初始在 M 点) -->
            <rect id="scene1-block" x="510" y="320" width="30" height="30" fill="#1565c0" fill-opacity="0.2" stroke="#1565c0" stroke-width="2"/>

            <!-- 关键点标注 -->
            <text id="scene1-label-M" x="700" y="370" font-size="16" fill="#000000">M</text>
            <text id="scene1-label-N" x="530" y="385" font-size="16" fill="#000000">N</text>
            <text id="scene1-label-P" x="305" y="355" font-size="16" fill="#1565c0" font-weight="bold">P</text>
            <text id="scene1-label-L" x="545" y="215" font-size="16" fill="#1565c0" font-weight="bold">L</text>

            <!-- 距离 S 标注 -->
            <text id="scene1-label-S" x="350" y="330" font-size="14" fill="#000000">S</text>

            <!-- 半径 R 标注 -->
            <text id="scene1-label-R" x="480" y="370" font-size="14" fill="#000000">R</text>

            <!-- 物块参数标签 (移到右侧更远处) -->
            <text id="scene1-label-m" x="700" y="335" font-size="14" fill="#000000">m=80g</text>
            <text id="scene1-label-q" x="700" y="355" font-size="14" fill="#000000">q=2×10⁻⁴C</text>

            <!-- 摩擦系数μ标签 -->
            <text id="scene1-label-mu" x="250" y="390" font-size="14" fill="#000000">μ=0.2</text>

            <!-- 重力加速度 g 标签 -->
            <text id="scene1-label-g" x="650" y="450" font-size="14" fill="#000000">g=10m/s²</text>

            <!-- 电场强度 E 参数标签 -->
            <text id="scene1-label-E-param" x="650" y="430" font-size="14" fill="#000000">E=10³V/m</text>

            <!-- 半径 R 参数标签 -->
            <text id="scene1-label-R-param" x="650" y="410" font-size="14" fill="#000000">R=40cm</text>

            <!-- 受力分析箭头 (初始隐藏) -->
            <!-- 电场力 F_E (向左，蓝色) -->
            <g id="scene1-force-fe" opacity="0">
                <line x1="525" y1="335" x2="485" y2="335" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrowhead-blue)"/>
                <text x="465" y="330" font-size="14" fill="#1565c0">F_E</text>
                <text x="465" y="348" font-size="12" fill="#1565c0">=qE</text>
            </g>

            <!-- 摩擦力 f (向右，红色) -->
            <g id="scene1-force-f" opacity="0">
                <line x1="525" y1="335" x2="565" y2="335" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrowhead-red)"/>
                <text x="570" y="325" font-size="14" fill="#c62828">f</text>
                <text x="570" y="343" font-size="12" fill="#c62828">=μmg</text>
            </g>

            <!-- 重力 G (向下，红色) -->
            <g id="scene1-force-g" opacity="0">
                <line x1="525" y1="335" x2="525" y2="375" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrowhead-red)"/>
                <text x="515" y="390" font-size="14" fill="#c62828">G</text>
            </g>

            <!-- 支持力 N (向上，绿色) -->
            <g id="scene1-force-n" opacity="0">
                <line x1="525" y1="335" x2="525" y2="295" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene1-arrowhead-green)"/>
                <text x="515" y="290" font-size="14" fill="#2e7d32">N</text>
            </g>

            <!-- 临界速度 v (向右，蓝色) -->
            <g id="scene1-velocity-v" opacity="0">
                <line x1="550" y1="225" x2="580" y2="225" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrowhead-blue)"/>
                <text x="585" y="225" font-size="14" fill="#1565c0">v</text>
            </g>

            <!-- 最高点 L 标记 (步骤 3 显示) -->
            <circle id="scene1-l-mark" cx="550" cy="230" r="5" fill="#c62828" opacity="0"/>

            <!-- 临界条件公式 (步骤 3 显示) -->
            <text id="scene1-critical-condition" x="450" y="180" font-size="16" fill="#c62828" opacity="0">mg = mv²/R</text>
        </svg>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/4</span>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        // 坐标表对照：
        // 水平轨道 MN: (150,350)-(550,350)
        // 半圆轨道 NL: 圆心 (550,350)，半径 120，角度 0°→180°
        // 物块初始位置：(510,320)-(540,350)
        // 点 M: (700,370), 点 N: (530,385), 点 P: (305,355), 点 L: (545,215)
        // 电场力 F_E: 从 (525,335) 向左
        // 摩擦力 f: 从 (525,335) 向右
        // 重力 G: 从 (525,335) 向下
        // 支持力 N: 从 (525,335) 向上
        // 临界速度 v: 从 (550,225) 向右

        const currentStepMax = 3;
        let currentStep = 0;

        // 元素引用
        const block = document.getElementById('scene1-block');
        const trackHorizHighlight = document.getElementById('scene1-track-horiz-highlight');
        const trackSemiHighlight = document.getElementById('scene1-track-semi-highlight');
        const forceFe = document.getElementById('scene1-force-fe');
        const forceF = document.getElementById('scene1-force-f');
        const forceG = document.getElementById('scene1-force-g');
        const forceN = document.getElementById('scene1-force-n');
        const velocityV = document.getElementById('scene1-velocity-v');
        const lMark = document.getElementById('scene1-l-mark');
        const criticalCondition = document.getElementById('scene1-critical-condition');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');

        // 工具函数：显示元素
        function show(el) {
            el.style.display = 'block';
            el.style.opacity = '1';
        }

        // 工具函数：隐藏元素
        function hide(el) {
            el.style.display = 'none';
            el.style.opacity = '0';
        }

        // 更新步骤指示器
        function updateStepIndicator() {
            stepIndicator.textContent = '步骤 ' + (currentStep + 1) + '/4';
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === currentStepMax);
        }

        // 更新场景状态
        function updateScene() {
            // 重置所有高亮和受力箭头
            trackHorizHighlight.style.opacity = '0';
            trackSemiHighlight.style.opacity = '0';
            hide(forceFe);
            hide(forceF);
            hide(forceG);
            hide(forceN);
            hide(velocityV);
            hide(lMark);
            hide(criticalCondition);

            // 根据当前步骤显示对应元素
            switch(currentStep) {
                case 0:
                    // 初始状态：只显示轨道、电场、物块、标注
                    block.setAttribute('x', '510');
                    block.setAttribute('y', '320');
                    break;

                case 1:
                    // 水平段受力：显示电场力 F_E 和摩擦力 f，高亮水平轨道
                    trackHorizHighlight.style.opacity = '0.6';
                    block.setAttribute('x', '510');
                    block.setAttribute('y', '320');
                    show(forceFe);
                    show(forceF);
                    break;

                case 2:
                    // 圆周段受力：显示重力 G 和支持力 N，高亮半圆轨道，物块移动到 P 点
                    trackSemiHighlight.style.opacity = '0.6';
                    block.setAttribute('x', '310');
                    block.setAttribute('y', '340');
                    show(forceG);
                    show(forceN);
                    break;

                case 3:
                    // 最高点临界：显示临界速度 v，标记最高点 L，物块移动到 L 点
                    trackSemiHighlight.style.opacity = '0.6';
                    block.setAttribute('x', '535');
                    block.setAttribute('y', '220');
                    show(forceFe);
                    show(forceF);
                    show(forceG);
                    show(forceN);
                    show(velocityV);
                    show(lMark);
                    show(criticalCondition);
                    break;
            }

            updateStepIndicator();
        }

        // 按钮事件绑定
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < currentStepMax) {
                currentStep++;
                updateScene();
            }
        });

        // 初始化
        updateScene();
    })();
    </script>
</body>
</html>
