<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>场景 1：滑块沿斜面下滑受力分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene1-btn { padding: 8px 20px; font-size: 14px; cursor: pointer; border: 1px solid #666; border-radius: 4px; background: #f5f5f5; }
        .scene1-btn:hover { background: #e0e0e0; }
        .scene1-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene1-step-indicator { font-size: 14px; color: #666; line-height: 35px; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
                </marker>
                <marker id="scene1-arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#c62828"/>
                </marker>
                <marker id="scene1-arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0"/>
                </marker>
                <marker id="scene1-arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32"/>
                </marker>
            </defs>

            <!-- 斜面三角形 -->
            <polygon id="scene1-slope" points="100,100 500,400 100,400" fill="none" stroke="#000000" stroke-width="2"/>

            <!-- 角度弧线 -->
            <path id="scene1-angle-arc" d="M 470,380 A 20,20 0 0 0 485,395" fill="none" stroke="#888888" stroke-width="1"/>
            <text id="scene1-angle-label" x="490" y="410" font-size="14" fill="#000000">α=37°</text>

            <!-- 斜面长度标注线 -->
            <line id="scene1-length-line" x1="280" y1="220" x2="320" y2="250" stroke="#000000" stroke-width="1"/>
            <line id="scene1-length-line-perp1" x1="277" y1="216" x2="283" y2="224" stroke="#000000" stroke-width="1"/>
            <line id="scene1-length-line-perp2" x1="317" y1="246" x2="323" y2="254" stroke="#000000" stroke-width="1"/>
            <text id="scene1-length-label" x="330" y="240" font-size="14" fill="#000000">9m</text>

            <!-- 滑块 A -->
            <rect id="scene1-block" x="115" y="115" width="30" height="30" fill="#1565c0" fill-opacity="0.2" stroke="#1565c0" stroke-width="2"/>
            <text id="scene1-block-label" x="105" y="135" font-size="14" fill="#1565c0" font-weight="bold">A</text>

            <!-- 步骤 1：重力 mg -->
            <g id="scene1-step1" style="display: none;">
                <line id="scene1-gravity" x1="130" y1="130" x2="130" y2="210" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrowhead-red)"/>
                <text id="scene1-gravity-label" x="110" y="225" font-size="14" fill="#c62828">mg</text>
            </g>

            <!-- 步骤 2：重力分量 -->
            <g id="scene1-step2" style="display: none;">
                <line id="scene1-mgsin" x1="130" y1="130" x2="170" y2="160" stroke="#c62828" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#scene1-arrowhead-red)"/>
                <text id="scene1-mgsin-label" x="180" y="175" font-size="14" fill="#c62828">mgsinα</text>
                <line id="scene1-mgcos" x1="130" y1="130" x2="160" y2="155" stroke="#c62828" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#scene1-arrowhead-red)"/>
                <text id="scene1-mgcos-label" x="165" y="145" font-size="14" fill="#c62828">mgcosα</text>
            </g>

            <!-- 步骤 3：支持力与摩擦力 -->
            <g id="scene1-step3" style="display: none;">
                <line id="scene1-normal" x1="130" y1="130" x2="160" y2="105" stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrowhead)"/>
                <text id="scene1-normal-label" x="170" y="100" font-size="14" fill="#000000">N₁</text>
                <line id="scene1-friction" x1="130" y1="130" x2="110" y2="115" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene1-arrowhead-green)"/>
                <text id="scene1-friction-label" x="85" y="115" font-size="14" fill="#2e7d32">f₁</text>
            </g>

            <!-- 步骤 4：速度矢量 -->
            <g id="scene1-step4" style="display: none;">
                <line id="scene1-velocity" x1="170" y1="180" x2="210" y2="210" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrowhead-blue)"/>
                <text id="scene1-velocity-label" x="220" y="220" font-size="14" fill="#1565c0">v₁</text>
            </g>

            <!-- 计算结果框（移到右侧，避开图形） -->
            <rect id="scene1-result-box" x="580" y="80" width="200" height="320" fill="#e0e0e0" stroke="#9e9e9e" stroke-width="1"/>
            <text id="scene1-result-title" x="590" y="105" font-size="14" fill="#000000" font-weight="bold">计算过程：</text>
            <text id="scene1-result-content" x="590" y="130" font-size="11" fill="#333333"></text>

            <!-- 控件栏 -->
            <div id="scene1-controls">
                <button id="scene1-prev-btn" class="scene1-btn" disabled>◀ 上一步</button>
                <span id="scene1-step-indicator" class="scene1-step-indicator">步骤 1/5</span>
                <button id="scene1-next-btn" class="scene1-btn">下一步 ▶</button>
            </div>
        </svg>
    </div>

    <script>
    (function() {
        // 场景 1：滑块沿斜面下滑受力分析
        // 布局坐标表（参考）：
        // 斜面：polygon (100,100)-(500,400)-(100,400)
        // 滑块 A：rect (115,115)-(145,145)
        // 重力 mg：line (130,130)-(130,210)
        // mgsinα：line (130,130)-(170,160)
        // mgcosα：line (130,130)-(160,155)
        // 支持力 N₁：line (130,130)-(160,105)
        // 摩擦力 f₁：line (130,130)-(110,115)
        // 速度 v₁：line (170,180)-(210,210)
        // 角度α：arc (470,380) 半径 20
        // 斜面长度：line (280,220)-(320,250)
        // 计算结果框：rect (580,80)-(780,400)

        const totalSteps = 5;
        let currentStep = 0;

        // 步骤内容配置（使用数组存储每行文本，缩短文本）
        const stepContents = [
            [],  // 步骤 0：初始状态，无计算内容
            ["已知：α=37°, L=9m", "μ₁=0.5, g=10m/s²"],
            ["重力分解：", "mgsinα=0.6mg", "mgcosα=0.8mg"],
            ["支持力：N₁=0.8mg", "摩擦力：f₁=0.4mg"],
            ["加速度：a=2m/s²", "底端速度：v₁=6m/s"]
        ];

        // DOM 元素引用
        const prevBtn = document.getElementById('scene1-prev-btn');
        const nextBtn = document.getElementById('scene1-next-btn');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        const resultContent = document.getElementById('scene1-result-content');

        // 步骤元素组
        const stepGroups = [
            null,  // 步骤 0：基础元素（斜面、滑块、角度、长度标注）
            document.getElementById('scene1-step1'),
            document.getElementById('scene1-step2'),
            document.getElementById('scene1-step3'),
            document.getElementById('scene1-step4')
        ];

        // 更新显示状态
        function updateDisplay() {
            // 更新步骤指示器
            stepIndicator.textContent = `步骤 ${currentStep + 1}/${totalSteps}`;

            // 更新按钮状态
            prevBtn.disabled = currentStep === 0;
            nextBtn.disabled = currentStep === totalSteps - 1;

            // 更新计算结果框内容（使用 tspan 实现多行，用 y 属性设置绝对位置）
            // 清除旧的 tspan
            while (resultContent.firstChild) {
                resultContent.removeChild(resultContent.firstChild);
            }
            
            const lines = stepContents[currentStep];
            const baseY = 130;  // 第一行的 y 坐标
            const lineHeight = 16;  // 行高
            
            lines.forEach((line, idx) => {
                const tspan = document.createElementNS('http://www.w3.org/2000/svg', 'tspan');
                tspan.setAttribute('x', '590');
                tspan.setAttribute('y', (baseY + idx * lineHeight).toString());
                tspan.textContent = line;
                resultContent.appendChild(tspan);
            });

            // 控制各步骤元素组的显示/隐藏
            for (let i = 1; i <= 4; i++) {
                if (stepGroups[i]) {
                    if (i <= currentStep) {
                        stepGroups[i].style.display = 'block';
                        stepGroups[i].style.opacity = '1';
                    } else {
                        stepGroups[i].style.display = 'none';
                        stepGroups[i].style.opacity = '0';
                    }
                }
            }
        }

        // 按钮事件绑定
        prevBtn.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        });

        nextBtn.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateDisplay();
            }
        });

        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
