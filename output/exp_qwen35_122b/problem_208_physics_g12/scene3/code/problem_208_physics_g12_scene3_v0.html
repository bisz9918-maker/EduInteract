<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 3 - 离子在磁场中的圆周运动</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 50px; box-sizing: border-box; z-index: 10; }
        .scene3-btn { padding: 8px 20px; font-size: 14px; background: #1976d2; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .scene3-btn:disabled { background: #bdbdbd; cursor: not-allowed; }
        #scene3-step-indicator { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); font-size: 16px; font-weight: bold; color: #333; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg width="800" height="500" id="scene3-svg">
            <!-- 磁场区域矩形边界（虚线） -->
            <rect id="scene3-magnet-rect" x="350" y="150" width="350" height="300" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,5"/>
            
            <!-- 磁场符号（稀疏分布，避免重叠） -->
            <g id="scene3-magnet-dots">
                <text x="400" y="200" font-size="14" fill="#000000">·</text>
                <text x="500" y="200" font-size="14" fill="#000000">·</text>
                <text x="600" y="200" font-size="14" fill="#000000">·</text>
                <text x="700" y="200" font-size="14" fill="#000000">·</text>
                <text x="400" y="280" font-size="14" fill="#000000">·</text>
                <text x="500" y="280" font-size="14" fill="#000000">·</text>
                <text x="600" y="280" font-size="14" fill="#000000">·</text>
                <text x="700" y="280" font-size="14" fill="#000000">·</text>
                <text x="400" y="360" font-size="14" fill="#000000">·</text>
                <text x="500" y="360" font-size="14" fill="#000000">·</text>
                <text x="600" y="360" font-size="14" fill="#000000">·</text>
                <text x="700" y="360" font-size="14" fill="#000000">·</text>
                <text x="400" y="440" font-size="14" fill="#000000">·</text>
                <text x="500" y="440" font-size="14" fill="#000000">·</text>
                <text x="600" y="440" font-size="14" fill="#000000">·</text>
                <text x="700" y="440" font-size="14" fill="#000000">·</text>
            </g>
            
            <!-- 磁场宽度标注 d -->
            <g id="scene3-width-d" style="display: block;">
                <line x1="720" y1="150" x2="720" y2="450" stroke="#000000" stroke-width="1.5"/>
                <line x1="715" y1="150" x2="725" y2="150" stroke="#000000" stroke-width="1.5"/>
                <line x1="715" y1="450" x2="725" y2="450" stroke="#000000" stroke-width="1.5"/>
                <text x="730" y="305" font-size="16" fill="#000000">d</text>
            </g>
            
            <!-- M/N/P/Q 顶点 -->
            <circle id="scene3-point-m" cx="350" cy="150" r="4" fill="#d32f2f" style="display: none;"/>
            <text x="330" y="140" font-size="14" fill="#000000" id="scene3-label-m" style="display: none;">M</text>
            
            <circle id="scene3-point-n" cx="700" cy="150" r="4" fill="#000000" style="display: none;"/>
            <text x="705" y="140" font-size="14" fill="#000000" id="scene3-label-n" style="display: none;">N</text>
            
            <circle id="scene3-point-p" cx="350" cy="450" r="4" fill="#000000" style="display: none;"/>
            <text x="330" y="470" font-size="14" fill="#000000" id="scene3-label-p" style="display: none;">P</text>
            
            <circle id="scene3-point-q" cx="700" cy="450" r="4" fill="#000000" style="display: none;"/>
            <text x="705" y="470" font-size="14" fill="#000000" id="scene3-label-q" style="display: none;">Q</text>
            
            <!-- 入射速度 v' 和入射角 30° -->
            <g id="scene3-velocity-in" style="display: none;">
                <line x1="350" y1="150" x2="402" y2="120" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene3-arrowhead)"/>
                <text x="410" y="115" font-size="14" fill="#2e7d32" font-weight="bold">v'</text>
            </g>
            <g id="scene3-angle-30" style="display: none;">
                <path d="M 380 150 A 30 30 0 0 1 374 176" fill="none" stroke="#c62828" stroke-width="2"/>
                <text x="365" y="185" font-size="14" fill="#c62828">30°</text>
            </g>
            
            <!-- 运动轨迹圆弧 -->
            <path id="scene3-trajectory" d="" fill="none" stroke="#1565c0" stroke-width="2" style="display: none;"/>
            <path id="scene3-trajectory-fill" d="" fill="#1565c0" fill-opacity="0.15" stroke="none" style="display: none;"/>
            
            <!-- 射出点 S -->
            <circle id="scene3-point-s" cx="550" cy="450" r="4" fill="#d32f2f" style="display: none;"/>
            <text x="545" y="470" font-size="14" fill="#000000" id="scene3-label-s" style="display: none;">S</text>
            
            <!-- 圆心 O 和半径 -->
            <circle id="scene3-point-o" cx="200" cy="100" r="5" fill="#d32f2f" style="display: none;"/>
            <text x="185" y="90" font-size="14" fill="#000000" id="scene3-label-o" style="display: none;">O</text>
            
            <line id="scene3-radius-om" x1="200" y1="100" x2="350" y2="150" stroke="#888888" stroke-width="1" stroke-dasharray="5,3" style="display: none;"/>
            <line id="scene3-radius-os" x1="200" y1="100" x2="550" y2="450" stroke="#888888" stroke-width="1" stroke-dasharray="5,3" style="display: none;"/>
            
            <!-- 轨迹半径 R 标注 -->
            <text id="scene3-label-r" x="260" y="115" font-size="14" fill="#888888" font-weight="bold" style="display: none;">R</text>
            
            <!-- 射出速度 -->
            <g id="scene3-velocity-out" style="display: none;">
                <line x1="550" y1="450" x2="595" y2="485" stroke="#2e7d32" stroke-width="2" marker-end="url(#scene3-arrowhead)"/>
                <text x="600" y="480" font-size="14" fill="#2e7d32" font-weight="bold">v</text>
            </g>
            
            <!-- 磁感应强度公式 -->
            <text id="scene3-formula" x="50" y="480" font-size="16" fill="#1565c0" font-weight="bold" style="display: none;">B = mv'/(qR)</text>
            
            <!-- 箭头标记定义 -->
            <defs>
                <marker id="scene3-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#2e7d32"/>
                </marker>
            </defs>
        </svg>
        
        <div id="scene3-step-indicator">步骤 0/5</div>
        <div id="scene3-controls">
            <button id="scene3-btn-prev" class="scene3-btn" disabled>◀ 上一步</button>
            <button id="scene3-btn-next" class="scene3-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 3 实现
        // 布局坐标表对照：
        // 磁场区域矩形：(350,150)-(700,450)，宽度 350，高度 300
        // M 点：(350,150) - 入射点
        // N 点：(700,150)
        // P 点：(350,450)
        // Q 点：(700,450)
        // 圆心 O：(200,100)
        // 射出点 S：(550,450)
        // 半径 R = √[(350-200)² + (150-100)²] = √25000 ≈ 158px
        
        const scene3CurrentStep = { value: 0 };
        const scene3TotalSteps = 5;
        
        // 计算圆弧路径
        function getArcPath(cx, cy, radius, startAngle, endAngle) {
            const startRad = (startAngle - 90) * Math.PI / 180;
            const endRad = (endAngle - 90) * Math.PI / 180;
            const x1 = cx + radius * Math.cos(startRad);
            const y1 = cy + radius * Math.sin(startRad);
            const x2 = cx + radius * Math.cos(endRad);
            const y2 = cy + radius * Math.sin(endRad);
            const largeArc = (endAngle - startAngle) > 180 ? 1 : 0;
            return `M ${x1} ${y1} A ${radius} ${radius} 0 ${largeArc} 1 ${x2} ${y2}`;
        }
        
        // 计算扇形路径
        function getSectorPath(cx, cy, radius, startAngle, endAngle) {
            const arcPath = getArcPath(cx, cy, radius, startAngle, endAngle);
            const endRad = (endAngle - 90) * Math.PI / 180;
            const x2 = cx + radius * Math.cos(endRad);
            const y2 = cy + radius * Math.sin(endRad);
            return `${arcPath} L ${cx} ${cy} Z`;
        }
        
        // 更新显示
        function updateDisplay() {
            const step = scene3CurrentStep.value;
            
            // 步骤 0：磁场区域
            document.getElementById('scene3-magnet-rect').style.display = 'block';
            document.getElementById('scene3-magnet-dots').style.display = 'block';
            document.getElementById('scene3-width-d').style.display = 'block';
            
            // 步骤 1：入射状态
            if (step >= 1) {
                document.getElementById('scene3-point-m').style.display = 'block';
                document.getElementById('scene3-label-m').style.display = 'block';
                document.getElementById('scene3-velocity-in').style.display = 'block';
                document.getElementById('scene3-angle-30').style.display = 'block';
            }
            
            // 步骤 2：运动轨迹
            if (step >= 2) {
                document.getElementById('scene3-point-s').style.display = 'block';
                document.getElementById('scene3-label-s').style.display = 'block';
                document.getElementById('scene3-trajectory').style.display = 'block';
                document.getElementById('scene3-trajectory-fill').style.display = 'block';
            }
            
            // 步骤 3：圆心确定
            if (step >= 3) {
                document.getElementById('scene3-point-o').style.display = 'block';
                document.getElementById('scene3-label-o').style.display = 'block';
                document.getElementById('scene3-radius-om').style.display = 'block';
                document.getElementById('scene3-radius-os').style.display = 'block';
            }
            
            // 步骤 4：射出速度和几何关系
            if (step >= 4) {
                document.getElementById('scene3-velocity-out').style.display = 'block';
                document.getElementById('scene3-label-r').style.display = 'block';
            }
            
            // 步骤 5：最终公式
            if (step >= 5) {
                document.getElementById('scene3-point-n').style.display = 'block';
                document.getElementById('scene3-label-n').style.display = 'block';
                document.getElementById('scene3-point-p').style.display = 'block';
                document.getElementById('scene3-label-p').style.display = 'block';
                document.getElementById('scene3-point-q').style.display = 'block';
                document.getElementById('scene3-label-q').style.display = 'block';
                document.getElementById('scene3-formula').style.display = 'block';
            }
            
            // 更新步骤指示器
            document.getElementById('scene3-step-indicator').textContent = `步骤 ${step}/${scene3TotalSteps}`;
            
            // 更新按钮状态
            document.getElementById('scene3-btn-prev').disabled = (step === 0);
            document.getElementById('scene3-btn-next').disabled = (step === scene3TotalSteps);
        }
        
        // 步骤变化
        function stepChange(delta) {
            const newStep = scene3CurrentStep.value + delta;
            if (newStep >= 0 && newStep <= scene3TotalSteps) {
                scene3CurrentStep.value = newStep;
                
                // 重新计算轨迹（根据步骤动态显示）
                if (newStep >= 2) {
                    const cx = 200, cy = 100, radius = 158;
                    // M 点角度：从圆心到 M(350,150)
                    const startAngle = Math.atan2(150 - 100, 350 - 200) * 180 / Math.PI + 90;
                    // S 点角度：从圆心到 S(550,450)
                    const endAngle = Math.atan2(450 - 100, 550 - 200) * 180 / Math.PI + 90;
                    
                    const arcPath = getArcPath(cx, cy, radius, startAngle, endAngle);
                    const sectorPath = getSectorPath(cx, cy, radius, startAngle, endAngle);
                    
                    document.getElementById('scene3-trajectory').setAttribute('d', arcPath);
                    document.getElementById('scene3-trajectory-fill').setAttribute('d', sectorPath);
                }
                
                updateDisplay();
            }
        }
        
        // 初始化
        function init() {
            // 绑定按钮事件
            document.getElementById('scene3-btn-prev').addEventListener('click', () => stepChange(-1));
            document.getElementById('scene3-btn-next').addEventListener('click', () => stepChange(1));
            
            // 初始显示
            updateDisplay();
        }
        
        init();
    })();
    </script>
</body>
</html>
