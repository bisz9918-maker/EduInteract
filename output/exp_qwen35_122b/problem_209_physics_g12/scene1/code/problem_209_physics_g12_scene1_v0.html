<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v-t 图线分析 - 物块斜面运动</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; z-index: 10; }
        #scene1-btn-prev, #scene1-btn-next {
            padding: 8px 16px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        #scene1-btn-prev { background: #e0e0e0; color: #666; }
        #scene1-btn-prev:enabled { background: #757575; color: white; }
        #scene1-btn-prev:enabled:hover { background: #616161; }
        #scene1-btn-next { background: #1976d2; color: white; }
        #scene1-btn-next:hover { background: #1565c0; }
        #scene1-btn-next:disabled { background: #e0e0e0; color: #9e9e9e; cursor: not-allowed; }
        .formula-box {
            background: #fff9c4;
            border: 1px solid #fbc02d;
            border-radius: 4px;
            padding: 8px 12px;
            font-size: 13px;
        }
        .summary-box {
            background: #e3f2fd;
            border: 1px solid #2196f3;
            border-radius: 4px;
            padding: 10px 15px;
            font-size: 13px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- 横轴 t -->
            <line x1="100" y1="320" x2="750" y2="320" stroke="#000" stroke-width="2" id="scene1-axis-t"/>
            <polygon points="750,320 740,315 740,325" fill="#000" id="scene1-arrow-t"/>
            
            <!-- 纵轴 v -->
            <line x1="180" y1="80" x2="180" y2="450" stroke="#000" stroke-width="2" id="scene1-axis-v"/>
            <polygon points="180,80 175,90 185,90" fill="#000" id="scene1-arrow-v"/>
            
            <!-- 原点 O -->
            <circle cx="180" cy="320" r="4" fill="#000" id="scene1-point-O"/>
            
            <!-- 上滑段图线 (初始黑色，步骤 1 高亮蓝色) -->
            <line x1="180" y1="150" x2="350" y2="320" stroke="#000000" stroke-width="2" id="scene1-line-up"/>
            
            <!-- 下滑段图线 (初始黑色，步骤 2 高亮红色) -->
            <line x1="350" y1="320" x2="650" y2="380" stroke="#000000" stroke-width="2" id="scene1-line-down"/>
            
            <!-- 关键点 A, B, C -->
            <circle cx="180" cy="150" r="6" fill="#2e7d32" id="scene1-point-A"/>
            <circle cx="350" cy="320" r="6" fill="#2e7d32" id="scene1-point-B"/>
            <circle cx="650" cy="380" r="6" fill="#2e7d32" id="scene1-point-C"/>
            
            <!-- 上滑斜率三角形 (步骤 1 显示) -->
            <line x1="180" y1="320" x2="350" y2="320" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5" id="scene1-triangle-up-h" style="display:none; opacity: 0;"/>
            <line x1="350" y1="320" x2="350" y2="150" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5" id="scene1-triangle-up-v" style="display:none; opacity: 0;"/>
            
            <!-- 下滑斜率三角形 (步骤 2 显示) -->
            <line x1="350" y1="320" x2="650" y2="320" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5" id="scene1-triangle-down-h" style="display:none; opacity: 0;"/>
            <line x1="650" y1="320" x2="650" y2="380" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5" id="scene1-triangle-down-v" style="display:none; opacity: 0;"/>
            
            <!-- 标签 -->
            <text x="730" y="305" font-size="14" fill="#000" id="scene1-label-t">t</text>
            <text x="165" y="95" font-size="14" fill="#000" id="scene1-label-v">v</text>
            <text x="170" y="335" font-size="14" fill="#000" id="scene1-label-O">O</text>
            <text x="150" y="155" font-size="16" fill="#000" id="scene1-label-v0">v₀</text>
            <text x="340" y="340" font-size="14" fill="#000" id="scene1-label-t1">t₁</text>
            <text x="625" y="395" font-size="14" fill="#000" id="scene1-label-3t1">3t₁</text>
            <text x="665" y="385" font-size="14" fill="#000" id="scene1-label-negv1">-v₁</text>
            
            <!-- 加速度标签 (步骤 1/2 显示) - 调整位置避免与图线重叠 -->
            <text x="250" y="135" font-size="16" fill="#1565c0" id="scene1-label-a1" style="display:none; opacity: 0;">a₁</text>
            <text x="490" y="310" font-size="16" fill="#c62828" id="scene1-label-a2" style="display:none; opacity: 0;">a₂</text>
            
            <!-- 公式文本 (步骤 1/2 显示) - 调整位置 -->
            <foreignObject x="190" y="200" width="200" height="40" id="scene1-formula-a1" style="display:none; opacity: 0;">
                <div xmlns="http://www.w3.org/1999/xhtml" class="formula-box">
                    $$a_1 = \frac{\Delta v}{\Delta t} = \frac{0 - v_0}{t_1} = -\frac{v_0}{t_1}$$
                </div>
            </foreignObject>
            
            <foreignObject x="360" y="320" width="220" height="40" id="scene1-formula-a2" style="display:none; opacity: 0;">
                <div xmlns="http://www.w3.org/1999/xhtml" class="formula-box">
                    $$a_2 = \frac{\Delta v}{\Delta t} = \frac{-v_1 - 0}{3t_1 - t_1} = -\frac{v_1}{2t_1}$$
                </div>
            </foreignObject>
            
            <!-- 总结文本框 (步骤 3 显示) -->
            <foreignObject x="250" y="400" width="500" height="70" id="scene1-summary" style="display:none; opacity: 0;">
                <div xmlns="http://www.w3.org/1999/xhtml" class="summary-box">
                    <div>上滑加速度大小：$$|a_1| = \frac{v_0}{t_1}$$</div>
                    <div>下滑加速度大小：$$|a_2| = \frac{v_1}{2t_1}$$</div>
                    <div style="margin-top:5px; color:#c62828;">由于上滑减速、下滑加速，且 $$|a_1| > |a_2|$$（因摩擦力方向改变）</div>
                </div>
            </foreignObject>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1: v-t 图线分析
        // 布局坐标表对照：
        // 横轴 t: (100,320)-(750,320)
        // 纵轴 v: (180,80)-(180,450)
        // 原点 O: (180,320)
        // 点 A(0,v₀): (180,150)
        // 点 B(t₁,0): (350,320)
        // 点 C(3t₁,-v₁): (650,380)
        // 上滑段图线：(180,150)-(350,320)
        // 下滑段图线：(350,320)-(650,380)
        
        let stepState = 0;
        
        // 工具函数：显示元素（同时设置 display 和 opacity）
        function show(el) {
            if (el) {
                el.style.display = '';
                // 使用 requestAnimationFrame 确保 opacity 过渡
                requestAnimationFrame(() => {
                    el.style.opacity = '1';
                });
            }
        }
        
        // 工具函数：隐藏元素
        function hide(el) {
            if (el) {
                el.style.opacity = '0';
                setTimeout(() => {
                    el.style.display = 'none';
                }, 200);
            }
        }
        
        // 更新场景状态
        function updateScene() {
            const btnPrev = document.getElementById('scene1-btn-prev');
            const btnNext = document.getElementById('scene1-btn-next');
            const lineUp = document.getElementById('scene1-line-up');
            const lineDown = document.getElementById('scene1-line-down');
            
            // 斜率三角形元素
            const triUpH = document.getElementById('scene1-triangle-up-h');
            const triUpV = document.getElementById('scene1-triangle-up-v');
            const triDownH = document.getElementById('scene1-triangle-down-h');
            const triDownV = document.getElementById('scene1-triangle-down-v');
            
            // 标签和公式
            const labelA1 = document.getElementById('scene1-label-a1');
            const labelA2 = document.getElementById('scene1-label-a2');
            const formulaA1 = document.getElementById('scene1-formula-a1');
            const formulaA2 = document.getElementById('scene1-formula-a2');
            const summary = document.getElementById('scene1-summary');
            
            // 重置所有状态
            lineUp.setAttribute('stroke', '#000000');
            lineUp.setAttribute('stroke-width', '2');
            lineDown.setAttribute('stroke', '#000000');
            lineDown.setAttribute('stroke-width', '2');
            
            // 根据步骤更新显示
            switch(stepState) {
                case 0: // 初始状态
                    hide(triUpH); hide(triUpV);
                    hide(triDownH); hide(triDownV);
                    hide(labelA1); hide(labelA2);
                    hide(formulaA1); hide(formulaA2);
                    hide(summary);
                    btnPrev.disabled = true;
                    btnNext.disabled = false;
                    break;
                    
                case 1: // 高亮上滑段
                    lineUp.setAttribute('stroke', '#1565c0');
                    lineUp.setAttribute('stroke-width', '3');
                    show(triUpH); show(triUpV);
                    show(labelA1);
                    show(formulaA1);
                    hide(triDownH); hide(triDownV);
                    hide(labelA2);
                    hide(formulaA2);
                    hide(summary);
                    btnPrev.disabled = false;
                    btnNext.disabled = false;
                    break;
                    
                case 2: // 高亮下滑段
                    lineUp.setAttribute('stroke', '#1565c0');
                    lineUp.setAttribute('stroke-width', '3');
                    lineDown.setAttribute('stroke', '#c62828');
                    lineDown.setAttribute('stroke-width', '3');
                    show(triUpH); show(triUpV);
                    show(labelA1);
                    show(formulaA1);
                    show(triDownH); show(triDownV);
                    show(labelA2);
                    show(formulaA2);
                    hide(summary);
                    btnPrev.disabled = false;
                    btnNext.disabled = false;
                    break;
                    
                case 3: // 总结
                    lineUp.setAttribute('stroke', '#1565c0');
                    lineUp.setAttribute('stroke-width', '3');
                    lineDown.setAttribute('stroke', '#c62828');
                    lineDown.setAttribute('stroke-width', '3');
                    show(triUpH); show(triUpV);
                    show(labelA1);
                    show(formulaA1);
                    show(triDownH); show(triDownV);
                    show(labelA2);
                    show(formulaA2);
                    show(summary);
                    btnPrev.disabled = false;
                    btnNext.disabled = true;
                    break;
            }
            
            // 触发 MathJax 重新渲染
            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }
        
        // 按钮事件绑定
        document.getElementById('scene1-btn-prev').addEventListener('click', function() {
            if (stepState > 0) {
                stepState--;
                updateScene();
            }
        });
        
        document.getElementById('scene1-btn-next').addEventListener('click', function() {
            if (stepState < 3) {
                stepState++;
                updateScene();
            }
        });
        
        // 初始化
        updateScene();
    })();
    </script>
</body>
</html>
