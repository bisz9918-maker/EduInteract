<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二次函数图像分析 - Scene 1</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Microsoft YaHei', sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene1-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 2px solid #1565c0; border-radius: 4px; background: #fff; color: #1565c0; }
        .scene1-btn:hover { background: #e3f2fd; }
        .scene1-btn:disabled { border-color: #ccc; color: #ccc; cursor: not-allowed; }
        #scene1-step-indicator { position: absolute; bottom: 45px; left: 50%; transform: translateX(-50%); font-size: 14px; color: #666; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- 坐标系 -->
            <line x1="50" y1="250" x2="750" y2="250" stroke="#000" stroke-width="1.5" id="scene1-xaxis"/>
            <line x1="170" y1="50" x2="170" y2="470" stroke="#000" stroke-width="1.5" id="scene1-yaxis"/>
            <!-- x 轴箭头 -->
            <polygon points="750,250 740,245 740,255" fill="#000" id="scene1-xarrow"/>
            <!-- y 轴箭头 -->
            <polygon points="170,50 165,60 175,60" fill="#000" id="scene1-yarrow"/>
            
            <!-- 抛物线 y = x² - 2x - 3 (x∈[0.2, 2.8]，只画中间部分避免与标签重叠) -->
            <polyline id="scene1-parabola" fill="none" stroke="#000" stroke-width="2" points=""/>
            
            <!-- 对称轴 x=1 (步骤 3 显示) -->
            <line x1="255" y1="50" x2="255" y2="470" stroke="#888" stroke-width="1.5" stroke-dasharray="5,5" id="scene1-symaxis" style="display:none; opacity: 0;"/>
            
            <!-- 点 A (步骤 1 显示) -->
            <circle id="scene1-pointA" cx="85" cy="250" r="3" fill="#c62828" style="display:none; opacity: 0;"/>
            <!-- 点 B (步骤 1 显示) -->
            <circle id="scene1-pointB" cx="425" cy="250" r="3" fill="#c62828" style="display:none; opacity: 0;"/>
            <!-- 点 C (步骤 1 显示) -->
            <circle id="scene1-pointC" cx="170" cy="400" r="3" fill="#c62828" style="display:none; opacity: 0;"/>
            <!-- 原点 O (步骤 1 显示) -->
            <circle id="scene1-pointO" cx="170" cy="250" r="2" fill="#000" style="display:none; opacity: 0;"/>
            
            <!-- AB 线段 (步骤 2 显示) -->
            <line x1="85" y1="250" x2="425" y2="250" stroke="#1565c0" stroke-width="3" id="scene1-abline" style="display:none; opacity: 0;"/>
            
            <!-- x>1 区域填充 (步骤 3 显示) -->
            <path id="scene1-region" fill="#2e7d32" fill-opacity="0.15" style="display:none; opacity: 0;"/>
            
            <!-- 标签 -->
            <text id="scene1-label-x" x="730" y="240" font-size="14" fill="#000">x</text>
            <text id="scene1-label-y" x="160" y="40" font-size="14" fill="#000">y</text>
            
            <!-- 点标签 (步骤 1 显示) - 移到远离抛物线的位置 -->
            <text id="scene1-label-A" x="55" y="270" font-size="14" fill="#000" style="display:none; opacity: 0;">A</text>
            <text id="scene1-label-B" x="445" y="270" font-size="14" fill="#000" style="display:none; opacity: 0;">B</text>
            <text id="scene1-label-C" x="155" y="425" font-size="14" fill="#000" style="display:none; opacity: 0;">C</text>
            <text id="scene1-label-O" x="178" y="240" font-size="14" fill="#000" style="display:none; opacity: 0;">O</text>
            
            <!-- 坐标标签 (步骤 1 显示) - 移到远离抛物线的位置，B 坐标移到 B 标签下方 -->
            <text id="scene1-label-Acoord" x="20" y="285" font-size="12" fill="#c62828" style="display:none; opacity: 0;">A(-1,0)</text>
            <text id="scene1-label-Bcoord" x="445" y="295" font-size="12" fill="#c62828" style="display:none; opacity: 0;">B(3,0)</text>
            <text id="scene1-label-Ccoord" x="140" y="445" font-size="12" fill="#c62828" style="display:none; opacity: 0;">C(0,-3)</text>
            
            <!-- 对称轴标签 (步骤 3 显示) - 移到顶部空白区域 -->
            <text id="scene1-label-symaxis" x="260" y="35" font-size="14" fill="#888" style="display:none; opacity: 0;">x=1</text>
            
            <!-- AB 长度标签 (步骤 2 显示) - 移到 x 轴上方 -->
            <text id="scene1-label-ablen" x="255" y="220" font-size="14" fill="#1565c0" style="display:none; opacity: 0;">AB=4</text>
            
            <!-- 顶点标签 (步骤 4 显示) - 移到更下方，按钮上方 -->
            <text id="scene1-label-vertex" x="265" y="460" font-size="12" fill="#000" style="display:none; opacity: 0;">顶点 (1,-4)</text>
            
            <!-- 结论展示区 (步骤 4 显示) - 移到右侧空白区域，远离抛物线，增加行间距 -->
            <rect id="scene1-conclusion-bg" x="580" y="20" width="200" height="180" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="5" style="display:none; opacity: 0;"/>
            <text id="scene1-conclusion-title" x="595" y="45" font-size="14" fill="#000" font-weight="bold" style="display:none; opacity: 0;">结论验证：</text>
            <text id="scene1-conclusion-1" x="595" y="70" font-size="12" fill="#2e7d32" style="display:none; opacity: 0;">✓ ① AB=4 正确</text>
            <text id="scene1-conclusion-2" x="595" y="95" font-size="12" fill="#c62828" style="display:none; opacity: 0;">✗ ② ∠ABC=45° 错误</text>
            <text id="scene1-conclusion-3" x="595" y="120" font-size="12" fill="#c62828" style="display:none; opacity: 0;">✗ ③ 0<x<2 时 -4≤y<-3 错误</text>
            <text id="scene1-conclusion-4" x="595" y="145" font-size="12" fill="#2e7d32" style="display:none; opacity: 0;">✓ ④ x>1 时 y 增大 正确</text>
            <text id="scene1-conclusion-answer" x="595" y="175" font-size="14" fill="#1565c0" font-weight="bold" style="display:none; opacity: 0;">答案：C（2 个正确）</text>
        </svg>
        
        <div id="scene1-step-indicator">步骤 1/5</div>
        <div id="scene1-controls">
            <button class="scene1-btn" id="scene1-btn-prev">◀ 上一步</button>
            <button class="scene1-btn" id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现
        // 坐标映射：px = 170 + x*85, py = 250 - y*50
        // A(-1,0) → (85, 250), B(3,0) → (425, 250), C(0,-3) → (170, 400)
        // 对称轴 x=1 → (255, 50)-(255, 470)
        
        const scene1Svg = document.getElementById('scene1-svg');
        const scene1Parabola = document.getElementById('scene1-parabola');
        const scene1StepIndicator = document.getElementById('scene1-step-indicator');
        const scene1BtnPrev = document.getElementById('scene1-btn-prev');
        const scene1BtnNext = document.getElementById('scene1-btn-next');
        
        let currentStep = 0;
        const totalSteps = 5;
        
        // 生成抛物线路径 (只画中间部分 [0.2, 2.8]，避免与标签重叠)
        function generateParabolaPath() {
            let points = '';
            for (let x = 0.2; x <= 2.8; x += 0.1) {
                const y = x * x - 2 * x - 3;
                const px = 170 + x * 85;
                const py = 250 - y * 50;
                points += (points ? ' ' : '') + px + ',' + py;
            }
            return points;
        }
        
        // 生成 x>1 区域填充路径
        function generateRegionPath() {
            let points = '255,250 ';  // 对称轴与 x 轴交点
            for (let x = 1; x <= 2.8; x += 0.1) {
                const y = x * x - 2 * x - 3;
                const px = 170 + x * 85;
                const py = 250 - y * 50;
                points += px + ',' + py + ' ';
            }
            points += '408,470 408,250';  // 右下角和右上角闭合
            return points;
        }
        
        // 初始化抛物线
        scene1Parabola.setAttribute('points', generateParabolaPath());
        document.getElementById('scene1-region').setAttribute('points', generateRegionPath());
        
        // 显示/隐藏工具函数
        function show(el) {
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '0';
                setTimeout(() => { el.style.opacity = '1'; }, 50);
            }
        }
        
        function hide(el) {
            if (el) {
                el.style.opacity = '0';
                setTimeout(() => { el.style.display = 'none'; }, 300);
            }
        }
        
        // 更新步骤显示
        function updateStep() {
            // 更新步骤指示器
            scene1StepIndicator.textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;
            
            // 按钮状态
            scene1BtnPrev.disabled = (currentStep === 0);
            scene1BtnNext.disabled = (currentStep === totalSteps - 1);
            
            // 步骤 0: 初始状态 - 只显示坐标系和抛物线
            if (currentStep === 0) {
                hide(document.getElementById('scene1-pointA'));
                hide(document.getElementById('scene1-pointB'));
                hide(document.getElementById('scene1-pointC'));
                hide(document.getElementById('scene1-pointO'));
                hide(document.getElementById('scene1-label-A'));
                hide(document.getElementById('scene1-label-B'));
                hide(document.getElementById('scene1-label-C'));
                hide(document.getElementById('scene1-label-O'));
                hide(document.getElementById('scene1-label-Acoord'));
                hide(document.getElementById('scene1-label-Bcoord'));
                hide(document.getElementById('scene1-label-Ccoord'));
                hide(document.getElementById('scene1-abline'));
                hide(document.getElementById('scene1-label-ablen'));
                hide(document.getElementById('scene1-symaxis'));
                hide(document.getElementById('scene1-label-symaxis'));
                hide(document.getElementById('scene1-region'));
                hide(document.getElementById('scene1-label-vertex'));
                hide(document.getElementById('scene1-conclusion-bg'));
                hide(document.getElementById('scene1-conclusion-title'));
                hide(document.getElementById('scene1-conclusion-1'));
                hide(document.getElementById('scene1-conclusion-2'));
                hide(document.getElementById('scene1-conclusion-3'));
                hide(document.getElementById('scene1-conclusion-4'));
                hide(document.getElementById('scene1-conclusion-answer'));
            }
            
            // 步骤 1: 显示点 A、B、C 和原点 O
            if (currentStep >= 1) {
                show(document.getElementById('scene1-pointA'));
                show(document.getElementById('scene1-pointB'));
                show(document.getElementById('scene1-pointC'));
                show(document.getElementById('scene1-pointO'));
                show(document.getElementById('scene1-label-A'));
                show(document.getElementById('scene1-label-B'));
                show(document.getElementById('scene1-label-C'));
                show(document.getElementById('scene1-label-O'));
                show(document.getElementById('scene1-label-Acoord'));
                show(document.getElementById('scene1-label-Bcoord'));
                show(document.getElementById('scene1-label-Ccoord'));
            }
            
            // 步骤 2: 显示 AB 线段和长度
            if (currentStep >= 2) {
                show(document.getElementById('scene1-abline'));
                show(document.getElementById('scene1-label-ablen'));
            }
            
            // 步骤 3: 显示对称轴和 x>1 区域
            if (currentStep >= 3) {
                show(document.getElementById('scene1-symaxis'));
                show(document.getElementById('scene1-label-symaxis'));
                show(document.getElementById('scene1-region'));
                show(document.getElementById('scene1-label-vertex'));
            }
            
            // 步骤 4: 显示结论
            if (currentStep >= 4) {
                show(document.getElementById('scene1-conclusion-bg'));
                show(document.getElementById('scene1-conclusion-title'));
                show(document.getElementById('scene1-conclusion-1'));
                show(document.getElementById('scene1-conclusion-2'));
                show(document.getElementById('scene1-conclusion-3'));
                show(document.getElementById('scene1-conclusion-4'));
                show(document.getElementById('scene1-conclusion-answer'));
            }
        }
        
        // 事件绑定
        scene1BtnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });
        
        scene1BtnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateStep();
            }
        });
        
        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
