<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二次函数图像性质验证 - Scene 2</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Microsoft YaHei', sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        .scene2-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #333; border-radius: 4px; background: #f5f5f5; }
        .scene2-btn:hover { background: #e0e0e0; }
        .scene2-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene2-step-indicator { font-size: 14px; color: #333; }
        svg { display: block; }
        .scene2-text { font-size: 14px; font-family: 'Microsoft YaHei', sans-serif; }
        .scene2-axis { stroke: #000; stroke-width: 1.5; }
        .scene2-parabola { stroke: #000; stroke-width: 2; fill: none; }
        .scene2-point { fill: #c62828; }
        .scene2-vertex { fill: #2e7d32; }
        .scene2-line-bc { stroke: #1565c0; stroke-width: 2; }
        .scene2-line-assist { stroke: #888888; stroke-width: 1; }
        .scene2-dashed { stroke: #888888; stroke-width: 1; stroke-dasharray: 5,5; }
        .scene2-shadow { fill: #2e7d32; opacity: 0.2; }
        .scene2-angle-arc { stroke: #1565c0; stroke-width: 1.5; fill: none; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500">
            <!-- 坐标轴 -->
            <g id="scene2-axes">
                <!-- x 轴 -->
                <line x1="150" y1="100" x2="750" y2="100" class="scene2-axis"/>
                <polygon points="750,100 740,95 740,105" fill="#000"/>
                <!-- y 轴 -->
                <line x1="350" y1="0" x2="350" y2="450" class="scene2-axis"/>
                <polygon points="350,0 345,10 355,10" fill="#000"/>
            </g>

            <!-- 抛物线 y = x² - 2x - 3 -->
            <!-- 使用精确的数学计算绘制，x 范围 [-2, 5]，1 单位=80px，原点 (350,100) -->
            <!-- x=-2: y=4+4-3=5 → (190, -300) 超出画布 -->
            <!-- x=-1: y=1+2-3=0 → (270, 100) 点 A -->
            <!-- x=0: y=-3 → (350, 340) 点 C -->
            <!-- x=1: y=1-2-3=-4 → (430, 420) 顶点 -->
            <!-- x=2: y=4-4-3=-3 → (510, 340) -->
            <!-- x=3: y=9-6-3=0 → (590, 100) 点 B -->
            <!-- x=4: y=16-8-3=5 → (670, -300) 超出画布 -->
            <!-- 只绘制可见部分 x∈[-1, 4] -->
            <path id="scene2-parabola" class="scene2-parabola" d="M 270,100 C 310,180 350,340 430,420 C 510,340 550,180 590,100 C 610,60 630,30 670,-30"/>

            <!-- 点 A(-1,0) -->
            <circle id="scene2-point-a" class="scene2-point" cx="270" cy="100" r="3"/>
            <text id="scene2-label-a" class="scene2-text" x="200" y="170">A</text>

            <!-- 点 B(3,0) -->
            <circle id="scene2-point-b" class="scene2-point" cx="590" cy="100" r="3"/>
            <text id="scene2-label-b" class="scene2-text" x="640" y="170">B</text>

            <!-- 点 C(0,-3) -->
            <circle id="scene2-point-c" class="scene2-point" cx="350" cy="340" r="3"/>
            <text id="scene2-label-c" class="scene2-text" x="280" y="410">C</text>

            <!-- 点 O(0,0) -->
            <circle id="scene2-point-o" class="scene2-point" cx="350" cy="100" r="3"/>
            <text id="scene2-label-o" class="scene2-text" x="360" y="85">O</text>

            <!-- 坐标轴标签 -->
            <text id="scene2-label-x" class="scene2-text" x="755" y="95">x</text>
            <text id="scene2-label-y" class="scene2-text" x="345" y="-80">y</text>

            <!-- 步骤 1: 三角形 OBC 的边 -->
            <line id="scene2-line-bc" class="scene2-line-bc" x1="590" y1="100" x2="350" y2="340" style="opacity: 0;"/>
            <line id="scene2-line-ob" class="scene2-line-assist" x1="350" y1="100" x2="590" y2="100" style="opacity: 0;"/>
            <line id="scene2-line-oc" class="scene2-line-assist" x1="350" y1="100" x2="350" y2="340" style="opacity: 0;"/>

            <!-- 步骤 1: 边长标签 -->
            <text id="scene2-label-ob" class="scene2-text" x="470" y="85" style="opacity: 0;">OB=3</text>
            <text id="scene2-label-oc" class="scene2-text" x="260" y="220" style="opacity: 0;">OC=3</text>

            <!-- 步骤 2: 角度弧线 -->
            <path id="scene2-angle-arc" class="scene2-angle-arc" d="M 550,100 A 40,40 0 0,0 565,125" style="opacity: 0;"/>
            <text id="scene2-label-angle" class="scene2-text" x="520" y="50" style="opacity: 0;">∠ABC=45°</text>

            <!-- 步骤 3: 顶点 V(1,-4) -->
            <circle id="scene2-point-v" class="scene2-vertex" cx="430" cy="420" r="4" style="opacity: 0;"/>
            <text id="scene2-label-v" class="scene2-text" x="440" y="440" style="opacity: 0;">V</text>

            <!-- 步骤 3: 区间边界 -->
            <line id="scene2-boundary-left" class="scene2-dashed" x1="350" y1="100" x2="350" y2="420" style="opacity: 0;"/>
            <line id="scene2-boundary-right" class="scene2-dashed" x1="510" y1="100" x2="510" y2="420" style="opacity: 0;"/>
            <text id="scene2-label-range" class="scene2-text" x="390" y="85" style="opacity: 0;">0<x<2</text>

            <!-- 步骤 4: 范围阴影 -->
            <rect id="scene2-shadow" class="scene2-shadow" x="270" y="340" width="240" height="80" style="opacity: 0;"/>
            <text id="scene2-label-yrange" class="scene2-text" x="230" y="380" style="opacity: 0;">-4≤y&lt;-3</text>

            <!-- 步骤 5: 结论文本 -->
            <text id="scene2-conclusion" class="scene2-text" x="200" y="480" style="opacity: 0; font-size: 16px;">结论②正确，结论③正确，共 2 个正确，选 B</text>
        </svg>

        <div id="scene2-controls">
            <button id="scene2-btn-prev" class="scene2-btn">◀ 上一步</button>
            <span id="scene2-step-indicator">步骤 0/5</span>
            <button id="scene2-btn-next" class="scene2-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2: 二次函数 y = x² - 2x - 3 图像性质验证
        // 坐标系统：原点 O(0,0) 像素位置 (350, 100)，1 单位 = 80px
        // x_px = 350 + x * 80, y_px = 100 - y * 80

        const scene2States = {
            0: {
                show: ['scene2-axes', 'scene2-parabola', 'scene2-point-a', 'scene2-point-b', 'scene2-point-c', 'scene2-point-o',
                       'scene2-label-a', 'scene2-label-b', 'scene2-label-c', 'scene2-label-o', 'scene2-label-x', 'scene2-label-y'],
                hide: ['scene2-line-bc', 'scene2-line-ob', 'scene2-line-oc', 'scene2-label-ob', 'scene2-label-oc',
                       'scene2-angle-arc', 'scene2-label-angle', 'scene2-point-v', 'scene2-label-v',
                       'scene2-boundary-left', 'scene2-boundary-right', 'scene2-label-range',
                       'scene2-shadow', 'scene2-label-yrange', 'scene2-conclusion']
            },
            1: {
                show: ['scene2-axes', 'scene2-parabola', 'scene2-point-a', 'scene2-point-b', 'scene2-point-c', 'scene2-point-o',
                       'scene2-label-a', 'scene2-label-b', 'scene2-label-c', 'scene2-label-o', 'scene2-label-x', 'scene2-label-y',
                       'scene2-line-bc', 'scene2-line-ob', 'scene2-line-oc', 'scene2-label-ob', 'scene2-label-oc'],
                hide: ['scene2-angle-arc', 'scene2-label-angle', 'scene2-point-v', 'scene2-label-v',
                       'scene2-boundary-left', 'scene2-boundary-right', 'scene2-label-range',
                       'scene2-shadow', 'scene2-label-yrange', 'scene2-conclusion']
            },
            2: {
                show: ['scene2-axes', 'scene2-parabola', 'scene2-point-a', 'scene2-point-b', 'scene2-point-c', 'scene2-point-o',
                       'scene2-label-a', 'scene2-label-b', 'scene2-label-c', 'scene2-label-o', 'scene2-label-x', 'scene2-label-y',
                       'scene2-line-bc', 'scene2-line-ob', 'scene2-line-oc', 'scene2-label-ob', 'scene2-label-oc',
                       'scene2-angle-arc', 'scene2-label-angle'],
                hide: ['scene2-point-v', 'scene2-label-v',
                       'scene2-boundary-left', 'scene2-boundary-right', 'scene2-label-range',
                       'scene2-shadow', 'scene2-label-yrange', 'scene2-conclusion']
            },
            3: {
                show: ['scene2-axes', 'scene2-parabola', 'scene2-point-a', 'scene2-point-b', 'scene2-point-c', 'scene2-point-o',
                       'scene2-label-a', 'scene2-label-b', 'scene2-label-c', 'scene2-label-o', 'scene2-label-x', 'scene2-label-y',
                       'scene2-line-bc', 'scene2-line-ob', 'scene2-line-oc', 'scene2-label-ob', 'scene2-label-oc',
                       'scene2-angle-arc', 'scene2-label-angle',
                       'scene2-point-v', 'scene2-label-v',
                       'scene2-boundary-left', 'scene2-boundary-right', 'scene2-label-range'],
                hide: ['scene2-shadow', 'scene2-label-yrange', 'scene2-conclusion']
            },
            4: {
                show: ['scene2-axes', 'scene2-parabola', 'scene2-point-a', 'scene2-point-b', 'scene2-point-c', 'scene2-point-o',
                       'scene2-label-a', 'scene2-label-b', 'scene2-label-c', 'scene2-label-o', 'scene2-label-x', 'scene2-label-y',
                       'scene2-line-bc', 'scene2-line-ob', 'scene2-line-oc', 'scene2-label-ob', 'scene2-label-oc',
                       'scene2-angle-arc', 'scene2-label-angle',
                       'scene2-point-v', 'scene2-label-v',
                       'scene2-boundary-left', 'scene2-boundary-right', 'scene2-label-range',
                       'scene2-shadow', 'scene2-label-yrange'],
                hide: ['scene2-conclusion']
            },
            5: {
                show: ['scene2-axes', 'scene2-parabola', 'scene2-point-a', 'scene2-point-b', 'scene2-point-c', 'scene2-point-o',
                       'scene2-label-a', 'scene2-label-b', 'scene2-label-c', 'scene2-label-o', 'scene2-label-x', 'scene2-label-y',
                       'scene2-line-bc', 'scene2-line-ob', 'scene2-line-oc', 'scene2-label-ob', 'scene2-label-oc',
                       'scene2-angle-arc', 'scene2-label-angle',
                       'scene2-point-v', 'scene2-label-v',
                       'scene2-boundary-left', 'scene2-boundary-right', 'scene2-label-range',
                       'scene2-shadow', 'scene2-label-yrange', 'scene2-conclusion'],
                hide: []
            }
        };

        let currentStep = 0;
        const totalSteps = 5;

        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.display = '';
                el.style.opacity = '1';
            }
        }

        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.opacity = '0';
                // 延迟隐藏 display 以支持动画
                setTimeout(() => {
                    if (el.style.opacity === '0') {
                        el.style.display = 'none';
                    }
                }, 300);
            }
        }

        function updateScene() {
            const state = scene2States[currentStep];

            // 先隐藏所有元素
            Object.values(scene2States).forEach(s => {
                s.hide.forEach(id => hideElement(id));
            });

            // 再显示当前步骤需要的元素
            state.show.forEach(id => showElement(id));

            // 更新步骤指示器
            document.getElementById('scene2-step-indicator').textContent = '步骤 ' + currentStep + '/' + totalSteps;

            // 更新按钮状态
            document.getElementById('scene2-btn-prev').disabled = (currentStep === 0);
            document.getElementById('scene2-btn-next').disabled = (currentStep === totalSteps);
        }

        document.getElementById('scene2-btn-prev').addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        document.getElementById('scene2-btn-next').addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateScene();
            }
        });

        // 初始化
        updateScene();
    })();
    </script>
</body>
</html>
