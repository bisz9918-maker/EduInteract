<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>夏至日太阳光照图及昼夜半球判读</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        .scene1-btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .scene1-btn:disabled { background: #cccccc; cursor: not-allowed; }
        .scene1-btn-prev { background: #6c757d; color: white; }
        .scene1-btn-next { background: #007bff; color: white; }
        .scene1-step-indicator { font-size: 14px; color: #333; }
        svg { display: block; }
        .scene1-text { font-size: 14px; }
        .scene1-label { font-size: 14px; font-weight: bold; }
        .scene1-green { fill: #28a745; }
        .scene1-red { fill: #dc3545; }
        .scene1-black { fill: #000000; }
        .scene1-italic { font-style: italic; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- 定义斜线填充图案 -->
            <defs>
                <pattern id="scene1-hatch" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(45)">
                    <line x1="0" y1="0" x2="0" y2="5" stroke="#4a90d9" stroke-width="1" opacity="0.3"/>
                </pattern>
            </defs>
            
            <!-- 经纬网 -->
            <!-- 经线 -->
            <line x1="150" y1="50" x2="150" y2="430" stroke="#000" stroke-width="2"/>
            <line x1="400" y1="50" x2="400" y2="430" stroke="#000" stroke-width="2"/>
            <line x1="650" y1="50" x2="650" y2="430" stroke="#000" stroke-width="2"/>
            
            <!-- 纬线 -->
            <line x1="150" y1="50" x2="650" y2="50" stroke="#000" stroke-width="2"/>
            <line x1="150" y1="125" x2="650" y2="125" stroke="#000" stroke-width="2"/>
            <line x1="150" y1="200" x2="650" y2="200" stroke="#000" stroke-width="2"/>
            <line x1="150" y1="275" x2="650" y2="275" stroke="#000" stroke-width="2"/>
            <line x1="150" y1="350" x2="650" y2="350" stroke="#000" stroke-width="2"/>
            <line x1="150" y1="425" x2="650" y2="425" stroke="#000" stroke-width="2"/>
            
            <!-- 晨昏线 EDF -->
            <line id="scene1-晨昏线-ED" x1="150" y1="425" x2="400" y2="125" stroke="#000" stroke-width="3"/>
            <line id="scene1-晨昏线-DF" x1="400" y1="125" x2="650" y2="425" stroke="#000" stroke-width="3"/>
            
            <!-- 夜半球区域（步骤 1 显示） -->
            <polygon id="scene1-夜半球区域" points="150,50 150,425 400,125" fill="url(#scene1-hatch)" opacity="0" style="display:none"/>
            
            <!-- A/B/C/D 四点 -->
            <circle id="scene1-点-A" cx="225" cy="425" r="6" class="scene1-green"/>
            <circle id="scene1-点-B" cx="400" cy="275" r="6" class="scene1-green"/>
            <circle id="scene1-点-C" cx="650" cy="200" r="6" class="scene1-green"/>
            <circle id="scene1-点-D" cx="400" cy="125" r="6" class="scene1-green"/>
            
            <!-- 太阳直射点（步骤 2 显示） -->
            <text id="scene1-直射点" x="525" y="205" font-size="24" class="scene1-red" opacity="0" style="display:none">✱</text>
            
            <!-- 经线标签（向上移动避开边缘，y=12 确保顶部有足够边距） -->
            <text x="150" y="12" text-anchor="middle" class="scene1-text scene1-black">135°W</text>
            <text x="400" y="12" text-anchor="middle" class="scene1-text scene1-black">45°E</text>
            <text x="650" y="12" text-anchor="middle" class="scene1-text scene1-black">135°E</text>
            
            <!-- 纬线标签 -->
            <text x="670" y="55" class="scene1-text scene1-black">90°N</text>
            <text x="670" y="130" class="scene1-text scene1-black">66.5°N</text>
            <text x="670" y="205" class="scene1-text scene1-black">23.5°N</text>
            <text x="670" y="280" class="scene1-text scene1-black">赤道</text>
            <text x="670" y="355" class="scene1-text scene1-black">23.5°S</text>
            <text x="670" y="430" class="scene1-text scene1-black">66.5°S</text>
            
            <!-- 点标签（调整位置避开重叠） -->
            <text id="scene1-标签-A" x="235" y="440" class="scene1-label scene1-green">A</text>
            <text id="scene1-标签-B" x="410" y="300" class="scene1-label scene1-green">B</text>
            <text id="scene1-标签-C" x="670" y="185" class="scene1-label scene1-green">C</text>
            <text id="scene1-标签-D" x="420" y="110" class="scene1-label scene1-green">D</text>
            
            <!-- 晨昏线标签（调整位置避开重叠） -->
            <text id="scene1-标签-E" x="130" y="440" class="scene1-text scene1-black">E</text>
            <text id="scene1-标签-D-晨昏" x="380" y="105" class="scene1-text scene1-black">D</text>
            <text id="scene1-标签-F" x="690" y="440" class="scene1-text scene1-black">F</text>
            
            <!-- 晨昏线性质标签（步骤 3 显示） -->
            <text id="scene1-标签 -ED" x="275" y="275" text-anchor="middle" class="scene1-text scene1-black scene1-italic" opacity="0" style="display:none">ED（晨线）</text>
            <text id="scene1-标签 -DF" x="525" y="275" text-anchor="middle" class="scene1-text scene1-black scene1-italic" opacity="0" style="display:none">DF（昏线）</text>
            
            <!-- 夜半球标签（步骤 1 显示）- 移到更安全的位置 -->
            <text id="scene1-标签 - 夜半球" x="250" y="200" text-anchor="middle" class="scene1-text scene1-black" opacity="0" style="display:none">夜半球</text>
            
            <!-- 直射点标签（步骤 2 显示）- 移到更安全的位置 -->
            <text id="scene1-标签 - 直射点" x="550" y="230" class="scene1-text scene1-red" opacity="0" style="display:none">太阳直射点 (45°E, 23.5°N)</text>
            
            <!-- 对比表格（步骤 3 显示）- 重新设计布局，缩小表格，移到右侧 -->
            <g id="scene1-对比表格" opacity="0" style="display:none">
                <!-- 表格边框 -->
                <rect x="570" y="310" width="200" height="90" fill="none" stroke="#000" stroke-width="1"/>
                <!-- 表头 -->
                <text x="580" y="330" class="scene1-text">点</text>
                <text x="610" y="330" class="scene1-text">正午太阳高度</text>
                <text x="675" y="330" class="scene1-text">地方时</text>
                <text x="720" y="330" class="scene1-text">线速度</text>
                <text x="755" y="330" class="scene1-text">昼夜</text>
                <!-- 分隔线 -->
                <line x1="570" y1="335" x2="770" y2="335" stroke="#000" stroke-width="1"/>
                <!-- A 行 -->
                <text x="580" y="355" class="scene1-text">A</text>
                <text x="610" y="355" class="scene1-text">0°</text>
                <text x="675" y="355" class="scene1-text">0:00</text>
                <text x="720" y="355" class="scene1-text">最小</text>
                <text x="755" y="355" class="scene1-text">极夜</text>
                <line x1="570" y1="360" x2="770" y2="360" stroke="#000" stroke-width="0.5"/>
                <!-- B 行 -->
                <text x="580" y="380" class="scene1-text">B</text>
                <text x="610" y="380" class="scene1-text">66.5°</text>
                <text x="675" y="380" class="scene1-text">12:00</text>
                <text x="720" y="380" class="scene1-text">最大</text>
                <text x="755" y="380" class="scene1-text">平分</text>
                <line x1="570" y1="385" x2="770" y2="385" stroke="#000" stroke-width="0.5"/>
                <!-- C 行 -->
                <text x="580" y="405" class="scene1-text">C</text>
                <text x="610" y="405" class="scene1-text">83.5°</text>
                <text x="675" y="405" class="scene1-text">12:00</text>
                <text x="720" y="405" class="scene1-text">较大</text>
                <text x="755" y="405" class="scene1-text">昼长</text>
                <line x1="570" y1="410" x2="770" y2="410" stroke="#000" stroke-width="0.5"/>
                <!-- D 行 -->
                <text x="580" y="430" class="scene1-text">D</text>
                <text x="610" y="430" class="scene1-text">47°</text>
                <text x="675" y="430" class="scene1-text">12:00</text>
                <text x="720" y="430" class="scene1-text">较小</text>
                <text x="755" y="430" class="scene1-text">极昼</text>
            </g>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-按钮 - 上一步" class="scene1-btn scene1-btn-prev" disabled>◀ 上一步</button>
            <span id="scene1-步骤指示器" class="scene1-step-indicator">步骤 1/4</span>
            <button id="scene1-按钮 - 下一步" class="scene1-btn scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现
        // 布局坐标表对照：
        // 经线：135°W(150), 45°E(400), 135°E(650)
        // 纬线：90°N(50), 66.5°N(125), 23.5°N(200), 赤道 (275), 23.5°S(350), 66.5°S(425)
        // A 点 (225,425), B 点 (400,275), C 点 (650,200), D 点 (400,125)
        // 晨昏线 ED: (150,425)-(400,125), DF: (400,125)-(650,425)
        // 太阳直射点 (525,200)
        
        const scene1 = {
            currentStep: 0,
            totalSteps: 4,
            
            elements: {
                // 步骤 1 显示的元素
                step1: ['scene1-夜半球区域', 'scene1-标签 - 夜半球'],
                // 步骤 2 显示的元素
                step2: ['scene1-直射点', 'scene1-标签 - 直射点'],
                // 步骤 3 显示的元素
                step3: ['scene1-标签 -ED', 'scene1-标签 -DF', 'scene1-对比表格']
            },
            
            init: function() {
                this.updateScene();
                this.bindEvents();
            },
            
            show: function(id) {
                const el = document.getElementById(id);
                if (el) {
                    el.style.display = 'block';
                    el.style.opacity = '0';
                    setTimeout(() => {
                        el.style.transition = 'opacity 300ms';
                        el.style.opacity = '1';
                    }, 10);
                }
            },
            
            hide: function(id) {
                const el = document.getElementById(id);
                if (el) {
                    el.style.transition = 'opacity 300ms';
                    el.style.opacity = '0';
                    setTimeout(() => {
                        el.style.display = 'none';
                    }, 300);
                }
            },
            
            updateScene: function() {
                // 更新步骤指示器
                document.getElementById('scene1-步骤指示器').textContent = '步骤 ' + (this.currentStep + 1) + '/4';
                
                // 更新按钮状态
                document.getElementById('scene1-按钮 - 上一步').disabled = (this.currentStep === 0);
                document.getElementById('scene1-按钮 - 下一步').disabled = (this.currentStep === this.totalSteps - 1);
                
                // 根据当前步骤显示/隐藏元素
                // 步骤 0: 只显示基础元素
                // 步骤 1: 显示夜半球
                // 步骤 2: 显示夜半球 + 直射点
                // 步骤 3: 显示夜半球 + 直射点 + 晨昏线标签 + 对比表格
                
                // 步骤 1 元素
                if (this.currentStep >= 1) {
                    this.show('scene1-夜半球区域');
                    this.show('scene1-标签 - 夜半球');
                }
                
                // 步骤 2 元素
                if (this.currentStep >= 2) {
                    this.show('scene1-直射点');
                    this.show('scene1-标签 - 直射点');
                }
                
                // 步骤 3 元素
                if (this.currentStep >= 3) {
                    this.show('scene1-标签 -ED');
                    this.show('scene1-标签 -DF');
                    this.show('scene1-对比表格');
                }
            },
            
            bindEvents: function() {
                const self = this;
                document.getElementById('scene1-按钮 - 上一步').addEventListener('click', function() {
                    if (self.currentStep > 0) {
                        self.currentStep--;
                        self.updateScene();
                    }
                });
                
                document.getElementById('scene1-按钮 - 下一步').addEventListener('click', function() {
                    if (self.currentStep < self.totalSteps - 1) {
                        self.currentStep++;
                        self.updateScene();
                    }
                });
            }
        };
        
        scene1.init();
    })();
    </script>
</body>
</html>
