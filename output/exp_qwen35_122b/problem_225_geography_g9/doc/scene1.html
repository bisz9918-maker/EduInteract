<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>经纬网坐标系统 - 场景 1</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene1-controls button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #333; border-radius: 4px; background: #f5f5f5; }
        #scene1-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene1-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 14px; color: #333; }
        #scene1-answer-area { position: absolute; left: 10px; bottom: 15px; font-size: 12px; line-height: 1.5; color: #333; max-width: 350px; }
        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- 经度标签 (顶部 y=50) -->
            <text x="90" y="50" font-size="12" fill="#1565c0" text-anchor="middle">120°E</text>
            <text x="190" y="50" font-size="12" fill="#1565c0" text-anchor="middle">140°E</text>
            <text x="290" y="50" font-size="12" fill="#1565c0" text-anchor="middle">160°E</text>
            <text x="390" y="50" font-size="12" fill="#1565c0" text-anchor="middle">180°</text>
            <text x="490" y="50" font-size="12" fill="#1565c0" text-anchor="middle">160°W</text>
            <text x="590" y="50" font-size="12" fill="#1565c0" text-anchor="middle">140°W</text>

            <!-- 纬度标签 (左侧 x=15，更靠左) -->
            <text x="15" y="85" font-size="12" fill="#c62828" text-anchor="end">80°N</text>
            <text x="15" y="145" font-size="12" fill="#c62828" text-anchor="end">60°N</text>
            <text x="15" y="205" font-size="12" fill="#c62828" text-anchor="end">40°N</text>
            <text x="15" y="265" font-size="12" fill="#c62828" text-anchor="end">20°N</text>
            <text x="20" y="325" font-size="12" fill="#c62828" text-anchor="end">0°</text>
            <text x="10" y="385" font-size="12" fill="#c62828" text-anchor="end">20°S</text>

            <!-- 经线 (竖线 x=100/200/300/400/500/600, y=80~400) -->
            <line x1="100" y1="80" x2="100" y2="400" stroke="#000000" stroke-width="1" id="scene1-meridian-1"/>
            <line x1="200" y1="80" x2="200" y2="400" stroke="#000000" stroke-width="1" id="scene1-meridian-2"/>
            <line x1="300" y1="80" x2="300" y2="400" stroke="#000000" stroke-width="1" id="scene1-meridian-3"/>
            <line x1="400" y1="80" x2="400" y2="400" stroke="#000000" stroke-width="1" id="scene1-meridian-4"/>
            <line x1="500" y1="80" x2="500" y2="400" stroke="#000000" stroke-width="1" id="scene1-meridian-5"/>
            <line x1="600" y1="80" x2="600" y2="400" stroke="#000000" stroke-width="1" id="scene1-meridian-6"/>

            <!-- 纬线 (横线 y=80/140/200/260/320/380, x=100~680) -->
            <line x1="100" y1="80" x2="680" y2="80" stroke="#000000" stroke-width="1" id="scene1-latitude-1"/>
            <line x1="100" y1="140" x2="680" y2="140" stroke="#000000" stroke-width="1" id="scene1-latitude-2"/>
            <line x1="100" y1="200" x2="680" y2="200" stroke="#000000" stroke-width="1" id="scene1-latitude-3"/>
            <line x1="100" y1="260" x2="680" y2="260" stroke="#000000" stroke-width="1" id="scene1-latitude-4"/>
            <line x1="100" y1="320" x2="680" y2="320" stroke="#000000" stroke-width="1" id="scene1-latitude-5"/>
            <line x1="100" y1="380" x2="680" y2="380" stroke="#000000" stroke-width="1" id="scene1-latitude-6"/>

            <!-- 赤道标注 -->
            <text x="690" y="325" font-size="10" fill="#666">赤道</text>

            <!-- 四个点 (A(200,80)、B(600,200)、C(200,260)、D(600,380)) -->
            <circle cx="200" cy="80" r="5" fill="#2e7d32" id="scene1-point-A"/>
            <circle cx="600" cy="200" r="5" fill="#2e7d32" id="scene1-point-B"/>
            <circle cx="200" cy="260" r="5" fill="#2e7d32" id="scene1-point-C"/>
            <circle cx="600" cy="380" r="5" fill="#2e7d32" id="scene1-point-D"/>

            <!-- 点标签 (A、B、C、D) - 调整位置避免重叠 -->
            <text x="215" y="95" font-size="14" fill="#2e7d32" font-weight="bold" id="scene1-label-A">A</text>
            <text x="585" y="185" font-size="14" fill="#2e7d32" font-weight="bold" text-anchor="end" id="scene1-label-B">B</text>
            <text x="215" y="275" font-size="14" fill="#2e7d32" font-weight="bold" id="scene1-label-C">C</text>
            <text x="585" y="395" font-size="14" fill="#2e7d32" font-weight="bold" text-anchor="end" id="scene1-label-D">D</text>

            <!-- 步骤 1: 坐标标签 - 移到点的右侧，与点标签在同一侧 -->
            <text x="235" y="95" font-size="10" fill="#000" id="scene1-coord-A" class="hidden">A:140°E,80°N</text>
            <text x="545" y="185" font-size="10" fill="#000" text-anchor="end" id="scene1-coord-B" class="hidden">B:140°W,40°N</text>
            <text x="235" y="275" font-size="10" fill="#000" id="scene1-coord-C" class="hidden">C:140°E,20°N</text>
            <text x="545" y="395" font-size="10" fill="#000" text-anchor="end" id="scene1-coord-D" class="hidden">D:140°W,20°S</text>

            <!-- 步骤 2: 方向箭头 - 调整位置 -->
            <line x1="200" y1="105" x2="200" y2="235" stroke="#c62828" stroke-width="2" id="scene1-arrow-AC" class="hidden"/>
            <polygon points="200,235 195,225 205,225" fill="#c62828" id="scene1-arrow-AC-head" class="hidden"/>
            <text x="215" y="170" font-size="10" fill="#c62828" id="scene1-arrow-AC-label" class="hidden">正北</text>

            <line x1="585" y1="195" x2="215" y2="255" stroke="#c62828" stroke-width="2" id="scene1-arrow-BC" class="hidden"/>
            <polygon points="215,255 210,245 225,250" fill="#c62828" id="scene1-arrow-BC-head" class="hidden"/>
            <text x="400" y="220" font-size="10" fill="#c62828" id="scene1-arrow-BC-label" class="hidden">东北</text>

            <!-- 步骤 3: 半球区域 - 使用极低透明度，仅作为背景提示 -->
            <!-- 北半球 (y=80~320) -->
            <rect x="100" y="80" width="580" height="240" fill="#1565c0" fill-opacity="0.03" id="scene1-hemisphere-north" class="hidden"/>
            <!-- 南半球 (y=320~400) -->
            <rect x="100" y="320" width="580" height="80" fill="#c62828" fill-opacity="0.03" id="scene1-hemisphere-south" class="hidden"/>
            <!-- 东西半球分界线 (20°W 和 160°E) -->
            <line x1="350" y1="80" x2="350" y2="400" stroke="#666" stroke-width="1" stroke-dasharray="5,5" id="scene1-hemisphere-line-1" class="hidden"/>
            <line x1="450" y1="80" x2="450" y2="400" stroke="#666" stroke-width="1" stroke-dasharray="5,5" id="scene1-hemisphere-line-2" class="hidden"/>
            <text x="350" y="65" font-size="10" fill="#666" text-anchor="middle" id="scene1-hemisphere-label-1" class="hidden">20°W</text>
            <text x="450" y="65" font-size="10" fill="#666" text-anchor="middle" id="scene1-hemisphere-label-2" class="hidden">160°E</text>
            <!-- 东半球区域 (x=100~400) -->
            <rect x="100" y="80" width="300" height="320" fill="#1565c0" fill-opacity="0.02" id="scene1-hemisphere-east" class="hidden"/>
            <!-- 西半球区域 (x=400~680) -->
            <rect x="400" y="80" width="280" height="320" fill="#c62828" fill-opacity="0.02" id="scene1-hemisphere-west" class="hidden"/>

            <!-- 步骤 4: 纬度带区域 - 使用极低透明度 -->
            <!-- 低纬度 (0°-30°, y=260~380) -->
            <rect x="100" y="260" width="580" height="120" fill="#2e7d32" fill-opacity="0.03" id="scene1-latitude-zone-low" class="hidden"/>
            <!-- 中纬度 (30°-60°, y=140~260) -->
            <rect x="100" y="140" width="580" height="120" fill="#ef6c00" fill-opacity="0.03" id="scene1-latitude-zone-mid" class="hidden"/>
            <!-- 高纬度 (60°-90°, y=80~140) -->
            <rect x="100" y="80" width="580" height="60" fill="#7b1fa2" fill-opacity="0.03" id="scene1-latitude-zone-high" class="hidden"/>
            <!-- 纬度带分界线 (30°和 60°) -->
            <line x1="100" y1="230" x2="680" y2="230" stroke="#666" stroke-width="1" stroke-dasharray="5,5" id="scene1-latitude-line-30" class="hidden"/>
            <line x1="100" y1="110" x2="680" y2="110" stroke="#666" stroke-width="1" stroke-dasharray="5,5" id="scene1-latitude-line-60" class="hidden"/>
            <text x="690" y="235" font-size="10" fill="#666" id="scene1-latitude-label-30" class="hidden">30°</text>
            <text x="690" y="115" font-size="10" fill="#666" id="scene1-latitude-label-60" class="hidden">60°</text>

            <!-- 步骤 5: 答案区已在 HTML 中定义 -->
        </svg>

        <!-- 答案显示区 -->
        <div id="scene1-answer-area" class="hidden">
            <strong>答案：</strong><br>
            （1）A(140°E, 80°N)、B(140°W, 40°N)<br>
            &nbsp;&nbsp;&nbsp;&nbsp;C(140°E, 20°N)、D(140°W, 20°S)<br>
            （2）A 在 C 的正北方<br>
            （3）B 在 C 的东北方<br>
            （4）北半球：A、B、C；南半球：D<br>
            &nbsp;&nbsp;&nbsp;&nbsp;东半球：A、C；西半球：B、D<br>
            （5）低纬度：C、D；中纬度：B；高纬度：A
        </div>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-prev-btn" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/6</span>
            <button id="scene1-next-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // 场景 1：经纬网坐标系统
        const sceneId = 'scene1';
        const totalSteps = 6;
        let currentStep = 0;

        // 获取 DOM 元素
        const prevBtn = document.getElementById(sceneId + '-prev-btn');
        const nextBtn = document.getElementById(sceneId + '-next-btn');
        const stepIndicator = document.getElementById(sceneId + '-step-indicator');
        const answerArea = document.getElementById(sceneId + '-answer-area');

        // 步骤 1 元素：坐标标签
        const coordElements = [
            document.getElementById(sceneId + '-coord-A'),
            document.getElementById(sceneId + '-coord-B'),
            document.getElementById(sceneId + '-coord-C'),
            document.getElementById(sceneId + '-coord-D')
        ];

        // 步骤 2 元素：方向箭头
        const arrowElements = [
            document.getElementById(sceneId + '-arrow-AC'),
            document.getElementById(sceneId + '-arrow-AC-head'),
            document.getElementById(sceneId + '-arrow-AC-label'),
            document.getElementById(sceneId + '-arrow-BC'),
            document.getElementById(sceneId + '-arrow-BC-head'),
            document.getElementById(sceneId + '-arrow-BC-label')
        ];

        // 步骤 3 元素：半球区域
        const hemisphereElements = [
            document.getElementById(sceneId + '-hemisphere-north'),
            document.getElementById(sceneId + '-hemisphere-south'),
            document.getElementById(sceneId + '-hemisphere-line-1'),
            document.getElementById(sceneId + '-hemisphere-line-2'),
            document.getElementById(sceneId + '-hemisphere-label-1'),
            document.getElementById(sceneId + '-hemisphere-label-2'),
            document.getElementById(sceneId + '-hemisphere-east'),
            document.getElementById(sceneId + '-hemisphere-west')
        ];

        // 步骤 4 元素：纬度带区域
        const latitudeZoneElements = [
            document.getElementById(sceneId + '-latitude-zone-low'),
            document.getElementById(sceneId + '-latitude-zone-mid'),
            document.getElementById(sceneId + '-latitude-zone-high'),
            document.getElementById(sceneId + '-latitude-line-30'),
            document.getElementById(sceneId + '-latitude-line-60'),
            document.getElementById(sceneId + '-latitude-label-30'),
            document.getElementById(sceneId + '-latitude-label-60')
        ];

        // 工具函数：显示元素
        function show(el) {
            if (el) {
                el.classList.remove('hidden');
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }

        // 工具函数：隐藏元素
        function hide(el) {
            if (el) {
                el.classList.add('hidden');
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }

        // 更新场景显示
        function updateScene() {
            // 更新步骤指示器
            stepIndicator.textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;

            // 更新按钮状态
            prevBtn.disabled = (currentStep === 0);
            nextBtn.disabled = (currentStep === totalSteps - 1);

            // 根据步骤显示/隐藏元素
            if (currentStep >= 1) {
                coordElements.forEach(show);
            } else {
                coordElements.forEach(hide);
            }

            if (currentStep >= 2) {
                arrowElements.forEach(show);
            } else {
                arrowElements.forEach(hide);
            }

            if (currentStep >= 3) {
                hemisphereElements.forEach(show);
            } else {
                hemisphereElements.forEach(hide);
            }

            if (currentStep >= 4) {
                latitudeZoneElements.forEach(show);
            } else {
                latitudeZoneElements.forEach(hide);
            }

            if (currentStep >= 5) {
                show(answerArea);
            } else {
                hide(answerArea);
            }
        }

        // 事件监听
        prevBtn.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        nextBtn.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateScene();
            }
        });

        // 初始化
        updateScene();
    })();
    </script>
</body>
</html>
