<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>经纬网基础框架与点位标注</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene1-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 2px solid #1565c0; border-radius: 4px; background: #fff; color: #1565c0; }
        .scene1-btn:hover { background: #e3f2fd; }
        .scene1-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene1-step-indicator { font-size: 14px; color: #333; line-height: 34px; }
        svg { display: block; }
        .scene1-meridian { fill: none; stroke: #000; stroke-width: 2; }
        .scene1-parallel { fill: none; stroke: #000; stroke-width: 2; }
        .scene1-point { fill: #1565c0; }
        .scene1-label { font-size: 14px; fill: #000; }
        .scene1-coord-label { font-size: 11px; fill: #000; }
        .scene1-arrow { fill: none; stroke: #c62828; stroke-width: 3; marker-end: url(#scene1-arrowhead); }
        .scene1-meridian-180 { fill: none; stroke: #2e7d32; stroke-width: 4; }
        .scene1-meridian-0 { fill: none; stroke: #888; stroke-width: 2; stroke-dasharray: 5,5; }
        .scene1-hemisphere-boundary { fill: none; stroke: #c62828; stroke-width: 3; }
        .scene1-east-hemisphere { fill: #1565c0; fill-opacity: 0.15; }
        .scene1-west-hemisphere { fill: #c62828; fill-opacity: 0.15; }
        .scene1-hidden { opacity: 0; }
        .scene1-visible { opacity: 1; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500">
            <defs>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#c62828"/>
                </marker>
            </defs>
            
            <!-- 半球填充区域 -->
            <path id="scene1-east-hemisphere" class="scene1-east-hemisphere scene1-hidden" 
                  d="M 80 80 L 280 80 L 280 420 L 80 420 Z"/>
            <path id="scene1-west-hemisphere" class="scene1-west-hemisphere scene1-hidden"
                  d="M 280 80 L 720 80 L 720 420 L 280 420 Z"/>
            
            <!-- 经线（5 条） -->
            <path id="scene1-meridian-140e" class="scene1-meridian" d="M 120 80 Q 120 250 120 420"/>
            <path id="scene1-meridian-160e" class="scene1-meridian" d="M 280 80 Q 280 250 280 420"/>
            <path id="scene1-meridian-180" class="scene1-meridian-180 scene1-hidden" d="M 440 80 Q 440 250 440 420"/>
            <path id="scene1-meridian-180-base" class="scene1-meridian" d="M 440 80 Q 440 250 440 420"/>
            <path id="scene1-meridian-160w" class="scene1-meridian" d="M 600 80 Q 600 250 600 420"/>
            <path id="scene1-meridian-140w" class="scene1-meridian" d="M 720 80 Q 720 250 720 420"/>
            
            <!-- 0°经线（与 180°相对） -->
            <path id="scene1-meridian-0" class="scene1-meridian-0 scene1-hidden" d="M 440 80 Q 440 250 440 420"/>
            
            <!-- 纬线（3 条） -->
            <path id="scene1-parallel-60n" class="scene1-parallel" d="M 80 120 Q 440 100 800 120"/>
            <path id="scene1-parallel-50n" class="scene1-parallel" d="M 80 250 Q 440 230 800 250"/>
            <path id="scene1-parallel-40n" class="scene1-parallel" d="M 80 380 Q 440 360 800 380"/>
            
            <!-- 160°E 半球分界线 -->
            <path id="scene1-hemisphere-boundary" class="scene1-hemisphere-boundary scene1-hidden" d="M 280 80 Q 280 250 280 420"/>
            
            <!-- 经度标签 -->
            <text id="scene1-lon-140e" class="scene1-label scene1-hidden" x="120" y="55" text-anchor="middle">140°E</text>
            <text id="scene1-lon-160e" class="scene1-label scene1-hidden" x="280" y="55" text-anchor="middle">160°E</text>
            <text id="scene1-lon-180" class="scene1-label scene1-hidden" x="440" y="55" text-anchor="middle">180°</text>
            <text id="scene1-lon-160w" class="scene1-label scene1-hidden" x="600" y="55" text-anchor="middle">160°W</text>
            <text id="scene1-lon-140w" class="scene1-label scene1-hidden" x="720" y="55" text-anchor="middle">140°W</text>
            
            <!-- 纬度标签 -->
            <text id="scene1-lat-60n" class="scene1-label scene1-hidden" x="775" y="105" text-anchor="end">60°N</text>
            <text id="scene1-lat-50n" class="scene1-label scene1-hidden" x="775" y="235" text-anchor="end">50°N</text>
            <text id="scene1-lat-40n" class="scene1-label scene1-hidden" x="775" y="365" text-anchor="end">40°N</text>
            
            <!-- 点标记 -->
            <circle id="scene1-point-d" class="scene1-point scene1-hidden" cx="120" cy="120" r="4"/>
            <circle id="scene1-point-a" class="scene1-point scene1-hidden" cx="440" cy="120" r="4"/>
            <circle id="scene1-point-e" class="scene1-point scene1-hidden" cx="280" cy="380" r="4"/>
            <circle id="scene1-point-f" class="scene1-point scene1-hidden" cx="540" cy="250" r="4"/>
            
            <!-- 点标签（调整位置避开经线/纬线） -->
            <text id="scene1-label-d" class="scene1-label scene1-hidden" x="100" y="100">D</text>
            <text id="scene1-label-a" class="scene1-label scene1-hidden" x="445" y="155">A</text>
            <text id="scene1-label-e" class="scene1-label scene1-hidden" x="255" y="405">E</text>
            <text id="scene1-label-f" class="scene1-label scene1-hidden" x="560" y="230">F</text>
            
            <!-- 坐标标签（简化显示，移到空白区域，使用白色背景框） -->
            <rect id="scene1-coord-d-bg" class="scene1-hidden" x="50" y="180" width="100" height="18" fill="#fff" fill-opacity="0.95" stroke="#ccc" stroke-width="1"/>
            <text id="scene1-coord-d" class="scene1-coord-label scene1-hidden" x="55" y="192">D: 140°E, 60°N</text>
            
            <rect id="scene1-coord-a-bg" class="scene1-hidden" x="50" y="205" width="100" height="18" fill="#fff" fill-opacity="0.95" stroke="#ccc" stroke-width="1"/>
            <text id="scene1-coord-a" class="scene1-coord-label scene1-hidden" x="55" y="217">A: 180°, 60°N</text>
            
            <rect id="scene1-coord-e-bg" class="scene1-hidden" x="50" y="230" width="100" height="18" fill="#fff" fill-opacity="0.95" stroke="#ccc" stroke-width="1"/>
            <text id="scene1-coord-e" class="scene1-coord-label scene1-hidden" x="55" y="242">E: 160°E, 40°N</text>
            
            <rect id="scene1-coord-f-bg" class="scene1-hidden" x="50" y="255" width="100" height="18" fill="#fff" fill-opacity="0.95" stroke="#ccc" stroke-width="1"/>
            <text id="scene1-coord-f" class="scene1-coord-label scene1-hidden" x="55" y="267">F: 170°W, 50°N</text>
            
            <!-- 方向箭头 -->
            <path id="scene1-arrow-da" class="scene1-arrow scene1-hidden" d="M 130 120 L 430 120"/>
            <text id="scene1-arrow-da-label" class="scene1-label scene1-hidden" x="280" y="75" text-anchor="middle" fill="#c62828">正东</text>
            
            <path id="scene1-arrow-ef" class="scene1-arrow scene1-hidden" d="M 290 370 L 530 260"/>
            <text id="scene1-arrow-ef-label" class="scene1-label scene1-hidden" x="420" y="245" text-anchor="middle" fill="#c62828">东北</text>
            
            <!-- 经线圈标注（移到更上方 y=25） -->
            <text id="scene1-meridian-circle-label" class="scene1-label scene1-hidden" x="440" y="25" text-anchor="middle" fill="#2e7d32">经线圈</text>
            
            <!-- 半球标注（移到填充区域上方空白处） -->
            <text id="scene1-east-hemisphere-label" class="scene1-label scene1-hidden" x="180" y="100" text-anchor="middle" fill="#1565c0" font-weight="bold">东半球</text>
            <text id="scene1-west-hemisphere-label" class="scene1-label scene1-hidden" x="520" y="100" text-anchor="middle" fill="#c62828" font-weight="bold">西半球</text>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn">◀ 上一步</button>
            <span id="scene1-step-indicator" class="scene1-step-indicator">步骤 1/5</span>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现
        // 布局坐标表：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // | 经线 140°E | 弧线 | x=120, y=80~420 | - | - | 最左侧经线 |
        // | 经线 160°E | 弧线 | x=280, y=80~420 | - | - | 左二经线 |
        // | 经线 180° | 弧线 | x=440, y=80~420 | - | - | 中央经线 |
        // | 经线 160°W | 弧线 | x=600, y=80~420 | - | - | 右二经线 |
        // | 经线 140°W | 弧线 | x=720, y=80~420 | - | - | 最右侧经线（调整） |
        // | 纬线 60°N | 弧线 | y=120, x=80~800 | - | - | 最上方纬线 |
        // | 纬线 50°N | 弧线 | y=250, x=80~800 | - | - | 中间纬线 |
        // | 纬线 40°N | 弧线 | y=380, x=80~800 | - | - | 最下方纬线 |
        // | 点 D | 圆点 | (120,120) | 8px 直径 | 左上方 | 140°E 与 60°N 交点 |
        // | 点 A | 圆点 | (440,120) | 8px 直径 | 下方 | 180°与 60°N 交点 |
        // | 点 E | 圆点 | (280,380) | 8px 直径 | 左下方 | 160°E 与 40°N 交点 |
        // | 点 F | 圆点 | (540,250) | 8px 直径 | 右上方 | 170°W 与 50°N 交点 |
        
        const scene1 = {
            currentStep: 1,
            totalSteps: 5,
            
            // 显示元素
            show: function(elId) {
                const el = document.getElementById(elId);
                if (el) {
                    el.classList.remove('scene1-hidden');
                    el.classList.add('scene1-visible');
                    el.style.opacity = '1';
                }
            },
            
            // 隐藏元素
            hide: function(elId) {
                const el = document.getElementById(elId);
                if (el) {
                    el.classList.remove('scene1-visible');
                    el.classList.add('scene1-hidden');
                    el.style.opacity = '0';
                }
            },
            
            // 更新显示状态
            updateDisplay: function() {
                // 步骤 1：经度纬度标注
                const step1Elements = [
                    'scene1-lon-140e', 'scene1-lon-160e', 'scene1-lon-180', 'scene1-lon-160w', 'scene1-lon-140w',
                    'scene1-lat-60n', 'scene1-lat-50n', 'scene1-lat-40n'
                ];
                
                // 步骤 2：点位标注（包括坐标标签）
                const step2Elements = [
                    'scene1-point-d', 'scene1-point-a', 'scene1-point-e', 'scene1-point-f',
                    'scene1-label-d', 'scene1-label-a', 'scene1-label-e', 'scene1-label-f',
                    'scene1-coord-d', 'scene1-coord-a', 'scene1-coord-e', 'scene1-coord-f',
                    'scene1-coord-d-bg', 'scene1-coord-a-bg', 'scene1-coord-e-bg', 'scene1-coord-f-bg'
                ];
                
                // 步骤 3：方向箭头
                const step3Elements = [
                    'scene1-arrow-da', 'scene1-arrow-da-label',
                    'scene1-arrow-ef', 'scene1-arrow-ef-label'
                ];
                
                // 步骤 4：经线圈
                const step4Elements = [
                    'scene1-meridian-180', 'scene1-meridian-0',
                    'scene1-meridian-circle-label'
                ];
                
                // 步骤 5：半球划分
                const step5Elements = [
                    'scene1-hemisphere-boundary',
                    'scene1-east-hemisphere', 'scene1-west-hemisphere',
                    'scene1-east-hemisphere-label', 'scene1-west-hemisphere-label'
                ];
                
                // 重置所有步骤元素
                [...step1Elements, ...step2Elements, ...step3Elements, ...step4Elements, ...step5Elements].forEach(id => this.hide(id));
                
                // 根据当前步骤显示对应元素
                if (this.currentStep >= 1) {
                    step1Elements.forEach(id => this.show(id));
                }
                if (this.currentStep >= 2) {
                    step2Elements.forEach(id => this.show(id));
                }
                if (this.currentStep >= 3) {
                    step3Elements.forEach(id => this.show(id));
                }
                if (this.currentStep >= 4) {
                    step4Elements.forEach(id => this.show(id));
                }
                if (this.currentStep >= 5) {
                    step5Elements.forEach(id => this.show(id));
                }
                
                // 更新步骤指示器
                document.getElementById('scene1-step-indicator').textContent = '步骤 ' + this.currentStep + '/' + this.totalSteps;
                
                // 更新按钮状态
                document.getElementById('scene1-btn-prev').disabled = (this.currentStep <= 1);
                document.getElementById('scene1-btn-next').disabled = (this.currentStep >= this.totalSteps);
            },
            
            // 下一步
            nextStep: function() {
                if (this.currentStep < this.totalSteps) {
                    this.currentStep++;
                    this.updateDisplay();
                }
            },
            
            // 上一步
            prevStep: function() {
                if (this.currentStep > 1) {
                    this.currentStep--;
                    this.updateDisplay();
                }
            },
            
            // 初始化
            init: function() {
                document.getElementById('scene1-btn-next').addEventListener('click', () => this.nextStep());
                document.getElementById('scene1-btn-prev').addEventListener('click', () => this.prevStep());
                this.updateDisplay();
            }
        };
        
        scene1.init();
    })();
    </script>
</body>
</html>
