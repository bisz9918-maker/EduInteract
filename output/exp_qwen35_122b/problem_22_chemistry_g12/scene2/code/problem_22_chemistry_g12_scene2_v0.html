<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 电解池连接方式对比</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene2-btn {
            padding: 8px 16px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .scene2-btn-active {
            background: #1976d2;
            color: white;
        }
        .scene2-btn-inactive {
            background: #e0e0e0;
            color: #333;
        }
        .scene2-btn-active:hover { background: #1565c0; }
        .scene2-btn-inactive:hover { background: #bdbdbd; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" id="scene2-svg">
            <!-- 直流电源（移到顶部，符号在框外两侧） -->
            <rect id="scene2-power-source" x="370" y="15" width="60" height="25" 
                  fill="#fff" stroke="#000" stroke-width="2"/>
            <text id="scene2-power-plus" x="355" y="32" text-anchor="end" font-size="18" fill="#000">+</text>
            <text id="scene2-power-minus" x="445" y="32" text-anchor="start" font-size="18" fill="#000">-</text>
            
            <!-- 接线柱 -->
            <circle id="scene2-terminal-a" cx="270" cy="95" r="10" 
                    fill="none" stroke="#000" stroke-width="2"/>
            <text id="scene2-label-a" x="270" y="80" text-anchor="middle" font-size="16" fill="#000">a</text>
            
            <circle id="scene2-terminal-b" cx="530" cy="95" r="10" 
                    fill="none" stroke="#000" stroke-width="2"/>
            <text id="scene2-label-b" x="530" y="80" text-anchor="middle" font-size="16" fill="#000">b</text>
            
            <!-- 状态 1 连接线（实线，当前状态）- 连接到电源框两侧 -->
            <line id="scene2-line-state1-1" x1="270" y1="95" x2="370" y2="28" 
                  stroke="#000" stroke-width="2"/>
            <line id="scene2-line-state1-2" x1="530" y1="95" x2="430" y2="28" 
                  stroke="#000" stroke-width="2"/>
            
            <!-- 状态 2 连接线（虚线，备用） -->
            <line id="scene2-line-state2-1" x1="270" y1="95" x2="430" y2="28" 
                  stroke="#888" stroke-width="2" stroke-dasharray="5,5"/>
            <line id="scene2-line-state2-2" x1="530" y1="95" x2="370" y2="28" 
                  stroke="#888" stroke-width="2" stroke-dasharray="5,5"/>
            
            <!-- 电极引线 -->
            <line id="scene2-cu-wire" x1="270" y1="105" x2="270" y2="150" 
                  stroke="#000" stroke-width="2"/>
            <line id="scene2-fe-wire" x1="530" y1="105" x2="530" y2="150" 
                  stroke="#000" stroke-width="2"/>
            
            <!-- 电极极性标签（移到电极上方，接线柱下方） -->
            <text id="scene2-cu-polarity" x="270" y="125" text-anchor="middle" font-size="14" fill="#c62828" font-weight="bold">阳极</text>
            <text id="scene2-fe-polarity" x="530" y="125" text-anchor="middle" font-size="14" fill="#2e7d32" font-weight="bold">阴极</text>
            
            <!-- Cu 电极 -->
            <rect id="scene2-cu-electrode" x="250" y="150" width="40" height="200" 
                  fill="#b87333" fill-opacity="0.3" stroke="#b87333" stroke-width="2"/>
            <text id="scene2-cu-label" x="270" y="140" text-anchor="middle" font-size="16" fill="#000">Cu</text>
            
            <!-- Fe 电极 -->
            <rect id="scene2-fe-electrode" x="510" y="150" width="40" height="200" 
                  fill="#808080" fill-opacity="0.3" stroke="#808080" stroke-width="2"/>
            <text id="scene2-fe-label" x="530" y="140" text-anchor="middle" font-size="16" fill="#000">Fe</text>
            
            <!-- 烧杯 -->
            <polygon id="scene2-beaker" points="200,150 600,150 580,400 220,400" 
                     fill="none" stroke="#000" stroke-width="2"/>
            
            <!-- 溶液 -->
            <rect id="scene2-solution" x="210" y="220" width="380" height="170" 
                  fill="#64b5f6" fill-opacity="0.2"/>
            
            <!-- 离子标签（移到烧杯上方空白处） -->
            <text id="scene2-cu2-plus" x="350" y="185" text-anchor="middle" font-size="16" fill="#1565c0">Cu²⁺</text>
            <text id="scene2-so4-2-minus" x="350" y="205" text-anchor="middle" font-size="16" fill="#616161">SO₄²⁻</text>
            
            <!-- Cu²⁺移动箭头（状态 1 向左，状态 2 向右） -->
            <g id="scene2-cu2-arrow-group" transform="scaleX(-1) translate(-700,0)">
                <line id="scene2-cu2-arrow-line" x1="350" y1="275" x2="270" y2="275" 
                      stroke="#1565c0" stroke-width="3" marker-end="url(#scene2-arrowhead-blue)"/>
                <polygon id="scene2-cu2-arrow-head" points="270,275 260,270 260,280" 
                         fill="#1565c0"/>
            </g>
            
            <!-- SO₄²⁻移动箭头（状态 1 向右，状态 2 向左） -->
            <line id="scene2-so4-arrow-line" x1="350" y1="315" x2="530" y2="315" 
                  stroke="#616161" stroke-width="3" stroke-dasharray="5,3" marker-end="url(#scene2-arrowhead-gray)"/>
            <polygon id="scene2-so4-arrow-head" points="530,315 520,310 520,320" 
                     fill="#616161"/>
            
            <!-- 箭头定义 -->
            <defs>
                <marker id="scene2-arrowhead-blue" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto">
                    <polygon points="0,0 10,5 0,10" fill="#1565c0"/>
                </marker>
                <marker id="scene2-arrowhead-gray" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto">
                    <polygon points="0,0 10,5 0,10" fill="#616161"/>
                </marker>
            </defs>
            
            <!-- 电极反应框 -->
            <rect id="scene2-cu-reaction-box" x="180" y="410" width="160" height="60" 
                  fill="#fff" stroke="#000" stroke-width="1"/>
            <rect id="scene2-fe-reaction-box" x="460" y="410" width="160" height="60" 
                  fill="#fff" stroke="#000" stroke-width="1"/>
            
            <!-- 电极反应文本（在框内正确位置） -->
            <text id="scene2-cu-reaction" x="190" y="435" font-size="13" fill="#000">Cu → Cu²⁺ + 2e⁻</text>
            <text id="scene2-cu-reaction-type" x="190" y="455" font-size="12" fill="#c62828">（阳极氧化）</text>
            
            <text id="scene2-fe-reaction" x="470" y="435" font-size="13" fill="#000">Cu²⁺ + 2e⁻ → Cu</text>
            <text id="scene2-fe-reaction-type" x="470" y="455" font-size="12" fill="#2e7d32">（阴极还原）</text>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-btn-state1" class="scene2-btn scene2-btn-active">状态 1：a 接正</button>
            <button id="scene2-btn-state2" class="scene2-btn scene2-btn-inactive">状态 2：b 接正</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现
        // 布局坐标表对照：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // |------|------|-----------|------|-------------|------|
        // | 直流电源 | 矩形 | (370,15)-(430,40) | 60×25 | - | 电源符号框 |
        // | 电源正极 | 文本 | (355,32) | ~16×16 | 左侧 | "+"符号 |
        // | 电源负极 | 文本 | (445,32) | ~16×16 | 右侧 | "-"符号 |
        // | 接线柱 a | 圆圈 | (270,95) | 10×10 | 上方 | 标注"a" |
        // | 接线柱 b | 圆圈 | (530,95) | 10×10 | 上方 | 标注"b" |
        // | 状态 1 连接线 1 | 线段 | (270,95)-(370,28) | - | - | 实线，a 接正极 |
        // | 状态 1 连接线 2 | 线段 | (530,95)-(430,28) | - | - | 实线，b 接负极 |
        // | 状态 2 连接线 1 | 线段 | (270,95)-(430,28) | - | - | 虚线，备用 |
        // | 状态 2 连接线 2 | 线段 | (530,95)-(370,28) | - | - | 虚线，备用 |
        // | Cu 电极引线 | 线段 | (270,105)-(270,150) | 2×45 | - | 连接接线柱 a |
        // | Fe 电极引线 | 线段 | (530,105)-(530,150) | 2×45 | - | 连接接线柱 b |
        // | Cu 电极极性标签 | 文本 | (270,125) | ~40×16 | 上方 | 阳极/阴极 |
        // | Fe 电极极性标签 | 文本 | (530,125) | ~40×16 | 上方 | 阳极/阴极 |
        // | Cu 电极标签 | 文本 | (270,140) | ~30×16 | 上方 | Cu |
        // | Fe 电极标签 | 文本 | (530,140) | ~30×16 | 上方 | Fe |
        // | Cu 电极 | 矩形 | (250,150)-(290,350) | 40×200 | 上方 | 铜色填充，透明度 30% |
        // | Fe 电极 | 矩形 | (510,150)-(550,350) | 40×200 | 上方 | 灰色填充，透明度 30% |
        // | 烧杯 | 多边形 | (200,150)-(600,150)-(580,400)-(220,400) | 400×250 | - | 玻璃容器轮廓 |
        // | 溶液 | 矩形 | (210,220)-(590,390) | 380×170 | - | 蓝色填充，透明度 20% |
        // | Cu²⁺离子标签 | 文本 | (350,185) | ~40×16 | - | 烧杯上方 |
        // | SO₄²⁻离子标签 | 文本 | (350,205) | ~50×16 | - | 烧杯上方 |
        // | Cu²⁺移动箭头 | 箭头 | (350,275)→(270,275) | 80×4 | - | 状态 1 向左，状态 2 向右 |
        // | SO₄²⁻移动箭头 | 箭头 | (350,315)→(530,315) | 180×4 | - | 状态 1 向右，状态 2 向左 |
        // | Cu 电极反应框 | 矩形 | (180,410)-(340,470) | 160×60 | - | 白色填充 |
        // | Fe 电极反应框 | 矩形 | (460,410)-(620,470) | 160×60 | - | 白色填充 |
        // | Cu 电极反应文本 | 文本 | (190,435) | ~140×20 | - | 反应方程式 |
        // | Fe 电极反应文本 | 文本 | (470,435) | ~140×20 | - | 反应方程式 |
        // | 状态切换按钮 1 | 按钮 | (280,485) | 120×35 | - | "状态 1：a 接正" |
        // | 状态切换按钮 2 | 按钮 | (460,485) | 120×35 | - | "状态 2：b 接正" |
        
        // 状态机变量
        let currentState = 1;
        
        // 获取 DOM 元素
        const btnState1 = document.getElementById('scene2-btn-state1');
        const btnState2 = document.getElementById('scene2-btn-state2');
        
        // 连接线元素
        const lineState1_1 = document.getElementById('scene2-line-state1-1');
        const lineState1_2 = document.getElementById('scene2-line-state1-2');
        const lineState2_1 = document.getElementById('scene2-line-state2-1');
        const lineState2_2 = document.getElementById('scene2-line-state2-2');
        
        // 电极极性标签
        const cuPolarity = document.getElementById('scene2-cu-polarity');
        const fePolarity = document.getElementById('scene2-fe-polarity');
        
        // 电极反应文本
        const cuReaction = document.getElementById('scene2-cu-reaction');
        const cuReactionType = document.getElementById('scene2-cu-reaction-type');
        const feReaction = document.getElementById('scene2-fe-reaction');
        const feReactionType = document.getElementById('scene2-fe-reaction-type');
        
        // 离子移动箭头
        const cu2ArrowGroup = document.getElementById('scene2-cu2-arrow-group');
        const cu2ArrowLine = document.getElementById('scene2-cu2-arrow-line');
        const cu2ArrowHead = document.getElementById('scene2-cu2-arrow-head');
        const so4ArrowLine = document.getElementById('scene2-so4-arrow-line');
        const so4ArrowHead = document.getElementById('scene2-so4-arrow-head');
        
        // 切换状态函数
        function switchState(newState) {
            if (currentState === newState) return;
            
            currentState = newState;
            
            // 更新按钮样式
            if (newState === 1) {
                btnState1.className = 'scene2-btn scene2-btn-active';
                btnState2.className = 'scene2-btn scene2-btn-inactive';
                
                // 状态 1 连接线为实线
                lineState1_1.setAttribute('stroke', '#000');
                lineState1_1.setAttribute('stroke-width', '2');
                lineState1_1.setAttribute('stroke-dasharray', '');
                lineState1_2.setAttribute('stroke', '#000');
                lineState1_2.setAttribute('stroke-width', '2');
                lineState1_2.setAttribute('stroke-dasharray', '');
                
                // 状态 2 连接线为虚线
                lineState2_1.setAttribute('stroke', '#888');
                lineState2_1.setAttribute('stroke-width', '2');
                lineState2_1.setAttribute('stroke-dasharray', '5,5');
                lineState2_2.setAttribute('stroke', '#888');
                lineState2_2.setAttribute('stroke-width', '2');
                lineState2_2.setAttribute('stroke-dasharray', '5,5');
                
                // 电极极性：Cu 为阳极，Fe 为阴极
                cuPolarity.textContent = '阳极';
                cuPolarity.setAttribute('fill', '#c62828');
                fePolarity.textContent = '阴极';
                fePolarity.setAttribute('fill', '#2e7d32');
                
                // 电极反应
                cuReaction.textContent = 'Cu → Cu²⁺ + 2e⁻';
                cuReactionType.textContent = '（阳极氧化）';
                cuReactionType.setAttribute('fill', '#c62828');
                feReaction.textContent = 'Cu²⁺ + 2e⁻ → Cu';
                feReactionType.textContent = '（阴极还原）';
                feReactionType.setAttribute('fill', '#2e7d32');
                
                // 离子移动方向：Cu²⁺向左（指向 Fe），SO₄²⁻向右（指向 Cu）
                // Cu²⁺箭头向左
                cu2ArrowGroup.setAttribute('transform', 'scaleX(-1) translate(-700,0)');
                cu2ArrowLine.setAttribute('x1', '350');
                cu2ArrowLine.setAttribute('x2', '270');
                cu2ArrowHead.setAttribute('points', '270,275 260,270 260,280');
                
                // SO₄²⁻箭头向右
                so4ArrowLine.setAttribute('x1', '350');
                so4ArrowLine.setAttribute('x2', '530');
                so4ArrowHead.setAttribute('points', '530,315 520,310 520,320');
                
            } else {
                // newState === 2
                btnState1.className = 'scene2-btn scene2-btn-inactive';
                btnState2.className = 'scene2-btn scene2-btn-active';
                
                // 状态 1 连接线为虚线
                lineState1_1.setAttribute('stroke', '#888');
                lineState1_1.setAttribute('stroke-width', '2');
                lineState1_1.setAttribute('stroke-dasharray', '5,5');
                lineState1_2.setAttribute('stroke', '#888');
                lineState1_2.setAttribute('stroke-width', '2');
                lineState1_2.setAttribute('stroke-dasharray', '5,5');
                
                // 状态 2 连接线为实线
                lineState2_1.setAttribute('stroke', '#000');
                lineState2_1.setAttribute('stroke-width', '2');
                lineState2_1.setAttribute('stroke-dasharray', '');
                lineState2_2.setAttribute('stroke', '#000');
                lineState2_2.setAttribute('stroke-width', '2');
                lineState2_2.setAttribute('stroke-dasharray', '');
                
                // 电极极性：Cu 为阴极，Fe 为阳极
                cuPolarity.textContent = '阴极';
                cuPolarity.setAttribute('fill', '#2e7d32');
                fePolarity.textContent = '阳极';
                fePolarity.setAttribute('fill', '#c62828');
                
                // 电极反应
                cuReaction.textContent = 'Cu²⁺ + 2e⁻ → Cu';
                cuReactionType.textContent = '（阴极还原）';
                cuReactionType.setAttribute('fill', '#2e7d32');
                feReaction.textContent = 'Fe → Fe²⁺ + 2e⁻';
                feReactionType.textContent = '（阳极氧化）';
                feReactionType.setAttribute('fill', '#c62828');
                
                // 离子移动方向：Cu²⁺向右（指向 Cu），SO₄²⁻向左（指向 Fe）
                // Cu²⁺箭头向右
                cu2ArrowGroup.setAttribute('transform', 'scaleX(1) translate(0,0)');
                cu2ArrowLine.setAttribute('x1', '350');
                cu2ArrowLine.setAttribute('x2', '430');
                cu2ArrowHead.setAttribute('points', '430,275 420,270 420,280');
                
                // SO₄²⁻箭头向左
                so4ArrowLine.setAttribute('x1', '350');
                so4ArrowLine.setAttribute('x2', '270');
                so4ArrowHead.setAttribute('points', '270,315 280,310 280,320');
            }
        }
        
        // 绑定按钮事件
        btnState1.addEventListener('click', function() {
            switchState(1);
        });
        
        btnState2.addEventListener('click', function() {
            switchState(2);
        });
        
        // 初始化：默认显示状态 1
        switchState(1);
    })();
    </script>
</body>
</html>
