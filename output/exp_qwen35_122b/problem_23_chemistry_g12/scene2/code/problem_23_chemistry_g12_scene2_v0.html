<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 晶体 X 的结构单元</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene2-controls button { padding: 8px 16px; font-size: 14px; cursor: pointer; background: #1976d2; color: white; border: none; border-radius: 4px; }
        #scene2-controls button:disabled { background: #bdbdbd; cursor: not-allowed; }
        #scene2-controls button:hover:not(:disabled) { background: #1565c0; }
        #scene2-step-display { font-size: 14px; line-height: 35px; font-weight: bold; color: #333; }
        
        /* 默认隐藏所有动态元素 */
        .dynamic-element { display: none !important; opacity: 0 !important; }
        .show { display: block !important; opacity: 1 !important; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <!-- SVG 图示区：固定 800×500px -->
        <svg id="scene2-svg" width="800" height="500">
            <!-- 标题 -->
            <text id="scene2-title" x="400" y="50" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">晶体 X 的结构单元</text>
            
            <!-- 晶胞框架（12 条棱） -->
            <g id="scene2-cube-frame">
                <!-- 前侧面（可见） -->
                <line x1="220" y1="180" x2="380" y2="180" stroke="#000000" stroke-width="2"/>
                <line x1="380" y1="180" x2="380" y2="280" stroke="#000000" stroke-width="2"/>
                <line x1="380" y1="280" x2="220" y2="280" stroke="#000000" stroke-width="2"/>
                <line x1="220" y1="280" x2="220" y2="180" stroke="#000000" stroke-width="2"/>
                
                <!-- 后侧面（部分可见） -->
                <line x1="290" y1="80" x2="450" y2="80" stroke="#000000" stroke-width="2"/>
                <line x1="450" y1="80" x2="450" y2="380" stroke="#000000" stroke-width="2"/>
                <line x1="450" y1="380" x2="290" y2="380" stroke="#000000" stroke-width="2"/>
                
                <!-- 连接前后面的棱 -->
                <line x1="220" y1="180" x2="290" y2="80" stroke="#000000" stroke-width="2"/>
                <line x1="380" y1="180" x2="450" y2="80" stroke="#000000" stroke-width="2"/>
                <line x1="220" y1="280" x2="290" y2="380" stroke="#000000" stroke-width="2"/>
                <line x1="380" y1="280" x2="450" y2="380" stroke="#000000" stroke-width="2"/>
                
                <!-- 被遮挡的棱（虚线） -->
                <line x1="290" y1="380" x2="290" y2="80" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>
            </g>
            
            <!-- 图例（移到右侧，增加垂直间距） -->
            <g id="scene2-legend">
                <circle cx="650" cy="105" r="6" fill="#1565c0"/>
                <text x="665" y="110" font-size="14" fill="#333">A 离子</text>
                <circle cx="650" cy="145" r="6" fill="white" stroke="#c62828" stroke-width="2"/>
                <text x="665" y="150" font-size="14" fill="#333">B 离子</text>
            </g>
            
            <!-- A 离子（4 个实心蓝点，步骤 1 显示） -->
            <g id="scene2-ions-a" class="dynamic-element">
                <circle id="scene2-ion-a1" cx="220" cy="180" r="8" fill="#1565c0"/>
                <circle id="scene2-ion-a2" cx="380" cy="280" r="8" fill="#1565c0"/>
                <circle id="scene2-ion-a3" cx="290" cy="80" r="8" fill="#1565c0"/>
                <circle id="scene2-ion-a4" cx="450" cy="380" r="8" fill="#1565c0"/>
            </g>
            
            <!-- A 离子标签（步骤 1 显示，移到更外侧） -->
            <g id="scene2-labels-a" class="dynamic-element">
                <text id="scene2-label-a1" x="100" y="195" font-size="14" fill="#1565c0" font-weight="bold">A</text>
                <text id="scene2-label-a2" x="400" y="295" font-size="14" fill="#1565c0" font-weight="bold">A</text>
                <text id="scene2-label-a3" x="290" y="60" text-anchor="middle" font-size="14" fill="#1565c0" font-weight="bold">A</text>
                <text id="scene2-label-a4" x="470" y="395" font-size="14" fill="#1565c0" font-weight="bold">A</text>
            </g>
            
            <!-- B 离子（4 个空心红圈，步骤 2 显示） -->
            <g id="scene2-ions-b" class="dynamic-element">
                <circle id="scene2-ion-b1" cx="380" cy="180" r="8" fill="white" stroke="#c62828" stroke-width="2"/>
                <circle id="scene2-ion-b2" cx="220" cy="280" r="8" fill="white" stroke="#c62828" stroke-width="2"/>
                <circle id="scene2-ion-b3" cx="290" cy="380" r="8" fill="white" stroke="#c62828" stroke-width="2"/>
                <circle id="scene2-ion-b4" cx="450" cy="80" r="8" fill="white" stroke="#c62828" stroke-width="2"/>
            </g>
            
            <!-- B 离子标签（步骤 2 显示，移到更外侧） -->
            <g id="scene2-labels-b" class="dynamic-element">
                <text id="scene2-label-b1" x="395" y="195" font-size="14" fill="#c62828" font-weight="bold">B</text>
                <text id="scene2-label-b2" x="195" y="295" font-size="14" fill="#c62828" font-weight="bold">B</text>
                <text id="scene2-label-b3" x="290" y="400" text-anchor="middle" font-size="14" fill="#c62828" font-weight="bold">B</text>
                <text id="scene2-label-b4" x="470" y="95" font-size="14" fill="#c62828" font-weight="bold">B</text>
            </g>
            
            <!-- 晶胞边长标注（步骤 3 显示，增加垂直间距） -->
            <g id="scene2-edge-label" class="dynamic-element">
                <text x="300" y="230" text-anchor="middle" font-size="16" fill="#333" font-style="italic">a</text>
                <text x="300" y="265" text-anchor="middle" font-size="12" fill="#666">晶胞边长</text>
            </g>
            
            <!-- 化学式计算说明（步骤 3 显示，移到安全位置，增加行间距） -->
            <g id="scene2-formula-calc" class="dynamic-element">
                <text x="50" y="200" font-size="13" fill="#333">晶胞中 A 离子个数 = 4×1/8 = 0.5</text>
                <text x="50" y="235" font-size="13" fill="#333">晶胞中 B 离子个数 = 4×1/8 = 0.5</text>
                <text x="50" y="275" font-size="14" fill="#1565c0" font-weight="bold">化学式：AB</text>
            </g>
            
            <!-- 最近邻连线（步骤 4 显示） -->
            <g id="scene2-nearest-neighbor" class="dynamic-element">
                <line x1="220" y1="180" x2="380" y2="180" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5,3"/>
                <line x1="220" y1="180" x2="220" y2="280" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5,3"/>
                <line x1="220" y1="180" x2="290" y2="80" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5,3"/>
                <text x="165" y="160" font-size="12" fill="#2e7d32" font-weight="bold">最近邻</text>
            </g>
            
            <!-- 配位数说明（步骤 4 显示，移到左侧下方，增加行间距） -->
            <g id="scene2-coordination" class="dynamic-element">
                <text x="50" y="310" font-size="14" fill="#2e7d32" font-weight="bold">配位数分析：</text>
                <text x="50" y="345" font-size="13" fill="#333">每个 A 离子周围有 12 个最近邻 B 离子</text>
                <text x="50" y="380" font-size="13" fill="#333">每个 B 离子周围有 12 个最近邻 A 离子</text>
            </g>
            
            <!-- 结论文字框（步骤 5 显示，覆盖右侧区域） -->
            <g id="scene2-conclusion" class="dynamic-element">
                <rect x="500" y="180" width="280" height="180" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1" rx="5"/>
                <text x="640" y="210" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">结论汇总</text>
                <line x1="510" y1="225" x2="770" y2="225" stroke="#9e9e9e" stroke-width="1"/>
                <text x="520" y="250" font-size="13" fill="#333">• 化学式：AB</text>
                <text x="520" y="275" font-size="13" fill="#333">• A 的配位数 = 12</text>
                <text x="520" y="300" font-size="13" fill="#333">• B 的配位数 = 12</text>
                <text x="520" y="325" font-size="13" fill="#333">• 晶体类型：离子晶体</text>
            </g>
        </svg>
        
        <!-- 控件栏（绝对定位叠在 SVG 上） -->
        <div id="scene2-controls">
            <button id="scene2-btn-prev">◀上一步</button>
            <span id="scene2-step-display">步骤 0/5</span>
            <button id="scene2-btn-next">下一步▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2 - 晶体 X 的结构单元
        const MAX_STEP = 5;
        let currentStep = 0;
        
        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        const stepDisplay = document.getElementById('scene2-step-display');
        
        // 各步骤需要显示的元素组
        const stepElements = {
            0: [],  // 初始状态：只显示框架、图例、标题
            1: ['scene2-ions-a', 'scene2-labels-a'],
            2: ['scene2-ions-b', 'scene2-labels-b'],
            3: ['scene2-edge-label', 'scene2-formula-calc'],
            4: ['scene2-nearest-neighbor', 'scene2-coordination'],
            5: ['scene2-conclusion']
        };
        
        // 更新步骤显示
        function updateStepDisplay() {
            stepDisplay.textContent = `步骤 ${currentStep}/${MAX_STEP}`;
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === MAX_STEP);
            
            // 重置所有动态元素
            document.querySelectorAll('.dynamic-element').forEach(el => {
                el.classList.remove('show');
            });
            
            // 显示对应步骤及之前的元素
            for (let step = 1; step <= currentStep; step++) {
                const elements = stepElements[step];
                elements.forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.classList.add('show');
                });
            }
        }
        
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStepDisplay();
            }
        });
        
        btnNext.addEventListener('click', function() {
            if (currentStep < MAX_STEP) {
                currentStep++;
                updateStepDisplay();
            }
        });
        
        // 初始化
        updateStepDisplay();
    })();
    </script>
</body>
</html>
