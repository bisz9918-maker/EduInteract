<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2: 甲与丙的等效平衡分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene2-controls button {
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            border: 2px solid #1565c0;
            border-radius: 6px;
            background: #ffffff;
            color: #1565c0;
            font-weight: bold;
        }
        #scene2-controls button:hover:not(:disabled) {
            background: #1565c0;
            color: #ffffff;
        }
        #scene2-controls button:disabled {
            border-color: #cccccc;
            color: #cccccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <!-- SVG 图示区：固定 800×500px -->
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 坐标表注释：
                甲容器：矩形 (100,100)-(300,350) | 标签"甲" (190,80)
                丙容器：矩形 (500,100)-(700,350) | 标签"丙" (590,80)
                甲初始 NO₂: (160,180) "0.2 mol NO₂"
                丙初始 N₂O₄: (530,180) "0.1 mol N₂O₄"
                甲反应箭头：(180,260)-(220,260)
                丙反应箭头：(580,260)-(620,260)
                等效双向箭头：(320,225)-(480,225)
                等效标注：(390,200) "等效平衡"
                甲平衡 NO₂: (140,290)
                甲平衡 N₂O₄: (140,315)
                丙平衡 N₂O₄: (520,290)
                丙平衡 NO₂: (520,315)
                平衡结论：(400,380)
            -->

            <!-- 甲容器（添加白色填充避免与文字重叠） -->
            <rect id="scene2-container-jia" x="100" y="100" width="200" height="250" 
                  fill="#ffffff" stroke="#000000" stroke-width="2"/>
            
            <!-- 丙容器（添加白色填充避免与文字重叠） -->
            <rect id="scene2-container-bing" x="500" y="100" width="200" height="250" 
                  fill="#ffffff" stroke="#000000" stroke-width="2"/>

            <!-- 甲容器标签 -->
            <text id="scene2-label-jia" x="190" y="80" font-size="20" font-weight="bold" fill="#000000">甲</text>
            
            <!-- 丙容器标签 -->
            <text id="scene2-label-bing" x="590" y="80" font-size="20" font-weight="bold" fill="#000000">丙</text>

            <!-- 甲初始 NO₂ -->
            <text id="scene2-jia-initial" x="160" y="180" font-size="16" fill="#1565c0">0.2 mol NO₂</text>
            
            <!-- 丙初始 N₂O₄ -->
            <text id="scene2-bing-initial" x="530" y="180" font-size="16" fill="#2e7d32">0.1 mol N₂O₄</text>

            <!-- 等效双向箭头（虚线） -->
            <line id="scene2-equiv-arrow" x1="320" y1="225" x2="480" y2="225" 
                  stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>
            <!-- 双向箭头头部 -->
            <polygon id="scene2-equiv-arrow-left" points="320,225 310,220 310,230" fill="#888888"/>
            <polygon id="scene2-equiv-arrow-right" points="480,225 490,220 490,230" fill="#888888"/>

            <!-- 等效标注 -->
            <text id="scene2-equiv-label" x="390" y="200" font-size="14" fill="#000000" text-anchor="middle">等效平衡</text>

            <!-- 甲反应箭头（初始隐藏） -->
            <line id="scene2-arrow-jia" x1="180" y1="260" x2="220" y2="260" 
                  stroke="#c62828" stroke-width="3" opacity="0"/>
            <polygon id="scene2-arrow-jia-head" points="220,260 210,255 210,265" fill="#c62828" opacity="0"/>

            <!-- 丙反应箭头（初始隐藏） -->
            <line id="scene2-arrow-bing" x1="580" y1="260" x2="620" y2="260" 
                  stroke="#c62828" stroke-width="3" opacity="0"/>
            <polygon id="scene2-arrow-bing-head" points="620,260 610,255 610,265" fill="#c62828" opacity="0"/>

            <!-- 甲平衡组成（初始隐藏） -->
            <text id="scene2-jia-eq-no2" x="140" y="290" font-size="14" fill="#1565c0" opacity="0">NO₂: x mol</text>
            <text id="scene2-jia-eq-n2o4" x="140" y="315" font-size="14" fill="#2e7d32" opacity="0">N₂O₄: y mol</text>

            <!-- 丙平衡组成（初始隐藏） -->
            <text id="scene2-bing-eq-n2o4" x="520" y="290" font-size="14" fill="#2e7d32" opacity="0">N₂O₄: y mol</text>
            <text id="scene2-bing-eq-no2" x="520" y="315" font-size="14" fill="#1565c0" opacity="0">NO₂: x mol</text>

            <!-- 平衡结论（初始隐藏） -->
            <text id="scene2-conclusion" x="400" y="380" font-size="16" fill="#1565c0" 
                  text-anchor="middle" opacity="0">平衡时 c(NO₂) 甲 = c(NO₂) 丙，c(N₂O₄) 甲 = c(N₂O₄) 丙</text>
        </svg>

        <!-- 控件栏叠在 SVG 底部 -->
        <div id="scene2-controls">
            <button id="scene2-prev" disabled>◀ 上一步</button>
            <button id="scene2-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2: 甲与丙的等效平衡分析
        // 状态机：currentStep (0-4)
        let currentStep = 0;
        const totalSteps = 5;

        // 获取 DOM 元素
        const containerJia = document.getElementById('scene2-container-jia');
        const containerBing = document.getElementById('scene2-container-bing');
        const arrowJia = document.getElementById('scene2-arrow-jia');
        const arrowJiaHead = document.getElementById('scene2-arrow-jia-head');
        const arrowBing = document.getElementById('scene2-arrow-bing');
        const arrowBingHead = document.getElementById('scene2-arrow-bing-head');
        const jiaInitial = document.getElementById('scene2-jia-initial');
        const bingInitial = document.getElementById('scene2-bing-initial');
        const jiaEqNo2 = document.getElementById('scene2-jia-eq-no2');
        const jiaEqN2o4 = document.getElementById('scene2-jia-eq-n2o4');
        const bingEqN2o4 = document.getElementById('scene2-bing-eq-n2o4');
        const bingEqNo2 = document.getElementById('scene2-bing-eq-no2');
        const conclusion = document.getElementById('scene2-conclusion');
        const equivArrow = document.getElementById('scene2-equiv-arrow');
        const equivArrowLeft = document.getElementById('scene2-equiv-arrow-left');
        const equivArrowRight = document.getElementById('scene2-equiv-arrow-right');
        const prevBtn = document.getElementById('scene2-prev');
        const nextBtn = document.getElementById('scene2-next');

        // 工具函数：显示元素
        function show(el) {
            el.style.display = 'block';
            el.style.opacity = '1';
        }

        // 工具函数：隐藏元素
        function hide(el) {
            el.style.display = 'none';
            el.style.opacity = '0';
        }

        // 更新场景状态
        function updateScene(step) {
            // 重置所有元素到基础状态
            // 容器边框重置
            containerJia.setAttribute('stroke', '#000000');
            containerJia.setAttribute('stroke-width', '2');
            containerBing.setAttribute('stroke', '#000000');
            containerBing.setAttribute('stroke-width', '2');

            // 等效箭头重置
            equivArrow.setAttribute('stroke', '#888888');
            equivArrow.setAttribute('stroke-width', '2');
            equivArrowLeft.setAttribute('fill', '#888888');
            equivArrowRight.setAttribute('fill', '#888888');

            // 初始内容始终显示
            show(jiaInitial);
            show(bingInitial);

            // 根据步骤更新状态
            switch(step) {
                case 0: // 初始状态
                    hide(arrowJia);
                    hide(arrowJiaHead);
                    hide(arrowBing);
                    hide(arrowBingHead);
                    hide(jiaEqNo2);
                    hide(jiaEqN2o4);
                    hide(bingEqN2o4);
                    hide(bingEqNo2);
                    hide(conclusion);
                    break;

                case 1: // 甲中反应开始
                    show(arrowJia);
                    show(arrowJiaHead);
                    hide(arrowBing);
                    hide(arrowBingHead);
                    hide(jiaEqNo2);
                    hide(jiaEqN2o4);
                    hide(bingEqN2o4);
                    hide(bingEqNo2);
                    hide(conclusion);
                    // 甲容器边框变蓝加粗
                    containerJia.setAttribute('stroke', '#1565c0');
                    containerJia.setAttribute('stroke-width', '3');
                    break;

                case 2: // 丙中反应开始
                    show(arrowJia);
                    show(arrowJiaHead);
                    show(arrowBing);
                    show(arrowBingHead);
                    hide(jiaEqNo2);
                    hide(jiaEqN2o4);
                    hide(bingEqN2o4);
                    hide(bingEqNo2);
                    hide(conclusion);
                    // 甲容器边框变蓝加粗，丙容器边框变绿加粗
                    containerJia.setAttribute('stroke', '#1565c0');
                    containerJia.setAttribute('stroke-width', '3');
                    containerBing.setAttribute('stroke', '#2e7d32');
                    containerBing.setAttribute('stroke-width', '3');
                    break;

                case 3: // 达到平衡
                    // 箭头变为灰色虚线（表示反应停止）
                    arrowJia.setAttribute('stroke', '#888888');
                    arrowJia.setAttribute('stroke-width', '2');
                    arrowJia.setAttribute('stroke-dasharray', '5,5');
                    arrowJiaHead.setAttribute('fill', '#888888');
                    arrowBing.setAttribute('stroke', '#888888');
                    arrowBing.setAttribute('stroke-width', '2');
                    arrowBing.setAttribute('stroke-dasharray', '5,5');
                    arrowBingHead.setAttribute('fill', '#888888');
                    show(arrowJia);
                    show(arrowJiaHead);
                    show(arrowBing);
                    show(arrowBingHead);
                    // 显示平衡组成
                    show(jiaEqNo2);
                    show(jiaEqN2o4);
                    show(bingEqN2o4);
                    show(bingEqNo2);
                    hide(conclusion);
                    // 两容器边框均变为蓝色加粗（表示平衡状态）
                    containerJia.setAttribute('stroke', '#1565c0');
                    containerJia.setAttribute('stroke-width', '3');
                    containerBing.setAttribute('stroke', '#1565c0');
                    containerBing.setAttribute('stroke-width', '3');
                    break;

                case 4: // 结论
                    // 箭头保持灰色虚线
                    arrowJia.setAttribute('stroke', '#888888');
                    arrowJia.setAttribute('stroke-width', '2');
                    arrowJia.setAttribute('stroke-dasharray', '5,5');
                    arrowJiaHead.setAttribute('fill', '#888888');
                    arrowBing.setAttribute('stroke', '#888888');
                    arrowBing.setAttribute('stroke-width', '2');
                    arrowBing.setAttribute('stroke-dasharray', '5,5');
                    arrowBingHead.setAttribute('fill', '#888888');
                    show(arrowJia);
                    show(arrowJiaHead);
                    show(arrowBing);
                    show(arrowBingHead);
                    // 显示平衡组成
                    show(jiaEqNo2);
                    show(jiaEqN2o4);
                    show(bingEqN2o4);
                    show(bingEqNo2);
                    // 显示结论
                    show(conclusion);
                    // 等效双向箭头变为蓝色加粗
                    equivArrow.setAttribute('stroke', '#1565c0');
                    equivArrow.setAttribute('stroke-width', '3');
                    equivArrowLeft.setAttribute('fill', '#1565c0');
                    equivArrowRight.setAttribute('fill', '#1565c0');
                    break;
            }

            // 更新按钮状态
            prevBtn.disabled = (step === 0);
            nextBtn.disabled = (step === totalSteps - 1);
        }

        // 事件监听
        prevBtn.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateScene(currentStep);
            }
        });

        nextBtn.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateScene(currentStep);
            }
        });

        // 初始化场景
        updateScene(currentStep);
    })();
    </script>
</body>
</html>
