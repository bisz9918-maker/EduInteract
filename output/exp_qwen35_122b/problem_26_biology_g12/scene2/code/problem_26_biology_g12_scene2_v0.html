<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F₂表型比例与基因型对应关系分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        .scene2-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 2px solid #333; border-radius: 4px; background: #f5f5f5; }
        .scene2-btn:hover { background: #e0e0e0; }
        .scene2-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene2-step-indicator { font-size: 14px; font-weight: bold; }
        
        /* 颜色类 */
        .scene2-long-wing { fill: #1565c0; }
        .scene2-small-wing { fill: #c62828; }
        .scene2-vestigial { fill: #2e7d32; }
        .scene2-cell-fill { fill-opacity: 0.25; }
        
        /* 过渡动画 */
        .scene2-transition { transition: fill-opacity 0.3s ease, stroke-width 0.3s ease; }
        
        /* 高亮边框 */
        .scene2-highlight { stroke: #ff9800; stroke-width: 2px; }
        .scene2-male-highlight { stroke: #c62828; stroke-width: 2px; stroke-dasharray: 4,2; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 标题 (y=45，留出 20px 边距) -->
            <text x="400" y="45" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000">F₂表型比例与基因型对应</text>
            
            <!-- 染色体示意图区域 -->
            <g id="scene2-chromosome-group">
                <!-- 常染色体 -->
                <line id="scene2-chrom-const" x1="80" y1="80" x2="120" y2="80" stroke="#000000" stroke-width="3" class="scene2-transition"/>
                <text id="scene2-chrom-const-label" x="70" y="70" font-size="12" fill="#000000" opacity="0">常染色体 A/a</text>
                
                <!-- X 染色体 -->
                <line id="scene2-chrom-x" x1="180" y1="80" x2="220" y2="80" stroke="#000000" stroke-width="3" class="scene2-transition"/>
                <text id="scene2-chrom-x-label" x="170" y="70" font-size="12" fill="#000000" opacity="0">X 染色体 B/b</text>
            </g>
            
            <!-- 棋盘格区域 -->
            <g id="scene2-chessboard">
                <!-- 行标签：雌配子 (从 x=15 改为 x=25，留出 20px 边距) -->
                <text id="scene2-row-label" x="25" y="185" font-size="11" fill="#666" opacity="0">雌配子</text>
                
                <!-- 列标签：雄配子 -->
                <text id="scene2-col-label" x="210" y="155" font-size="11" fill="#666" opacity="0">雄配子</text>
                
                <!-- 16 个单元格 (4 行×4 列) -->
                <!-- 第 0 行：蓝色 (长翅) -->
                <rect id="scene2-cell-0-0" x="55" y="165" width="35" height="35" fill="none" stroke="#333" stroke-width="1" class="scene2-cell-fill scene2-long-wing scene2-transition"/>
                <rect id="scene2-cell-0-1" x="95" y="165" width="35" height="35" fill="none" stroke="#333" stroke-width="1" class="scene2-cell-fill scene2-long-wing scene2-transition"/>
                <rect id="scene2-cell-0-2" x="135" y="165" width="35" height="35" fill="none" stroke="#333" stroke-width="1" class="scene2-cell-fill scene2-long-wing scene2-transition"/>
                <rect id="scene2-cell-0-3" x="175" y="165" width="35" height="35" fill="none" stroke="#333" stroke-width="1" class="scene2-cell-fill scene2-long-wing scene2-transition"/>
                
                <!-- 第 1 行：蓝色 (长翅) -->
                <rect id="scene2-cell-1-0" x="215" y="165" width="35" height="35" fill="none" stroke="#333" stroke-width="1" class="scene2-cell-fill scene2-long-wing scene2-transition"/>
                <rect id="scene2-cell-1-1" x="255" y="165" width="35" height="35" fill="none" stroke="#333" stroke-width="1" class="scene2-cell-fill scene2-long-wing scene2-transition"/>
                <rect id="scene2-cell-1-2" x="295" y="165" width="35" height="35" fill="none" stroke="#333" stroke-width="1" class="scene2-cell-fill scene2-long-wing scene2-transition"/>
                <rect id="scene2-cell-1-3" x="335" y="165" width="35" height="35" fill="none" stroke="#333" stroke-width="1" class="scene2-cell-fill scene2-long-wing scene2-transition"/>
                
                <!-- 第 2 行：红色 (小翅 - 仅雄性) -->
                <rect id="scene2-cell-2-0" x="55" y="210" width="35" height="35" fill="none" stroke="#333" stroke-width="1" class="scene2-cell-fill scene2-small-wing scene2-transition"/>
                <rect id="scene2-cell-2-1" x="95" y="210" width="35" height="35" fill="none" stroke="#333" stroke-width="1" class="scene2-cell-fill scene2-small-wing scene2-transition"/>
                <rect id="scene2-cell-2-2" x="135" y="210" width="35" height="35" fill="none" stroke="#333" stroke-width="1" class="scene2-cell-fill scene2-small-wing scene2-transition"/>
                <rect id="scene2-cell-2-3" x="175" y="210" width="35" height="35" fill="none" stroke="#333" stroke-width="1" class="scene2-cell-fill scene2-small-wing scene2-transition"/>
                
                <!-- 第 3 行：绿色 (残翅) -->
                <rect id="scene2-cell-3-0" x="215" y="210" width="35" height="35" fill="none" stroke="#333" stroke-width="1" class="scene2-cell-fill scene2-vestigial scene2-transition"/>
                <rect id="scene2-cell-3-1" x="255" y="210" width="35" height="35" fill="none" stroke="#333" stroke-width="1" class="scene2-cell-fill scene2-vestigial scene2-transition"/>
                <rect id="scene2-cell-3-2" x="295" y="210" width="35" height="35" fill="none" stroke="#333" stroke-width="1" class="scene2-cell-fill scene2-vestigial scene2-transition"/>
                <rect id="scene2-cell-3-3" x="335" y="210" width="35" height="35" fill="none" stroke="#333" stroke-width="1" class="scene2-cell-fill scene2-vestigial scene2-transition"/>
                
                <!-- 第 4 行：绿色 (残翅) -->
                <rect id="scene2-cell-4-0" x="55" y="255" width="35" height="35" fill="none" stroke="#333" stroke-width="1" class="scene2-cell-fill scene2-vestigial scene2-transition"/>
                <rect id="scene2-cell-4-1" x="95" y="255" width="35" height="35" fill="none" stroke="#333" stroke-width="1" class="scene2-cell-fill scene2-vestigial scene2-transition"/>
                <rect id="scene2-cell-4-2" x="135" y="255" width="35" height="35" fill="none" stroke="#333" stroke-width="1" class="scene2-cell-fill scene2-vestigial scene2-transition"/>
                <rect id="scene2-cell-4-3" x="175" y="255" width="35" height="35" fill="none" stroke="#333" stroke-width="1" class="scene2-cell-fill scene2-vestigial scene2-transition"/>
                
                <!-- 第 5 行：绿色 (残翅) -->
                <rect id="scene2-cell-5-0" x="215" y="255" width="35" height="35" fill="none" stroke="#333" stroke-width="1" class="scene2-cell-fill scene2-vestigial scene2-transition"/>
                <rect id="scene2-cell-5-1" x="255" y="255" width="35" height="35" fill="none" stroke="#333" stroke-width="1" class="scene2-cell-fill scene2-vestigial scene2-transition"/>
                <rect id="scene2-cell-5-2" x="295" y="255" width="35" height="35" fill="none" stroke="#333" stroke-width="1" class="scene2-cell-fill scene2-vestigial scene2-transition"/>
                <rect id="scene2-cell-5-3" x="335" y="255" width="35" height="35" fill="none" stroke="#333" stroke-width="1" class="scene2-cell-fill scene2-vestigial scene2-transition"/>
                
                <!-- 第 6 行：绿色 (残翅) -->
                <rect id="scene2-cell-6-0" x="55" y="300" width="35" height="35" fill="none" stroke="#333" stroke-width="1" class="scene2-cell-fill scene2-vestigial scene2-transition"/>
                <rect id="scene2-cell-6-1" x="95" y="300" width="35" height="35" fill="none" stroke="#333" stroke-width="1" class="scene2-cell-fill scene2-vestigial scene2-transition"/>
                <rect id="scene2-cell-6-2" x="135" y="300" width="35" height="35" fill="none" stroke="#333" stroke-width="1" class="scene2-cell-fill scene2-vestigial scene2-transition"/>
                <rect id="scene2-cell-6-3" x="175" y="300" width="35" height="35" fill="none" stroke="#333" stroke-width="1" class="scene2-cell-fill scene2-vestigial scene2-transition"/>
                
                <!-- 第 7 行：绿色 (残翅) -->
                <rect id="scene2-cell-7-0" x="215" y="300" width="35" height="35" fill="none" stroke="#333" stroke-width="1" class="scene2-cell-fill scene2-vestigial scene2-transition"/>
                <rect id="scene2-cell-7-1" x="255" y="300" width="35" height="35" fill="none" stroke="#333" stroke-width="1" class="scene2-cell-fill scene2-vestigial scene2-transition"/>
                <rect id="scene2-cell-7-2" x="295" y="300" width="35" height="35" fill="none" stroke="#333" stroke-width="1" class="scene2-cell-fill scene2-vestigial scene2-transition"/>
                <rect id="scene2-cell-7-3" x="335" y="300" width="35" height="35" fill="none" stroke="#333" stroke-width="1" class="scene2-cell-fill scene2-vestigial scene2-transition"/>
                
                <!-- 性别标注 (步骤 4 显示) -->
                <text id="scene2-female-label" x="385" y="190" font-size="12" fill="#666" opacity="0">♀</text>
                <text id="scene2-male-label" x="385" y="235" font-size="12" fill="#666" opacity="0">♂</text>
                <text id="scene2-female-label-2" x="385" y="280" font-size="12" fill="#666" opacity="0">♀</text>
                <text id="scene2-male-label-2" x="385" y="325" font-size="12" fill="#666" opacity="0">♂</text>
                <text id="scene2-female-label-3" x="385" y="370" font-size="12" fill="#666" opacity="0">♀</text>
                <text id="scene2-male-label-3" x="385" y="415" font-size="12" fill="#666" opacity="0">♂</text>
            </g>
            
            <!-- 图例区 -->
            <g id="scene2-legend">
                <!-- 长翅图例 -->
                <rect id="scene2-legend-long-bg" x="430" y="65" width="20" height="20" fill="#1565c0" fill-opacity="0.25" class="scene2-transition" opacity="0"/>
                <text id="scene2-legend-long-text" x="455" y="80" font-size="12" fill="#000000">长翅 A_X^B_</text>
                
                <!-- 小翅图例 -->
                <rect id="scene2-legend-small-bg" x="430" y="100" width="20" height="20" fill="#c62828" fill-opacity="0.25" class="scene2-transition" opacity="0"/>
                <text id="scene2-legend-small-text" x="455" y="115" font-size="12" fill="#000000">小翅 A_X^bY(♂)</text>
                
                <!-- 残翅图例 -->
                <rect id="scene2-legend-vestigial-bg" x="430" y="135" width="20" height="20" fill="#2e7d32" fill-opacity="0.25" class="scene2-transition" opacity="0"/>
                <text id="scene2-legend-vestigial-text" x="455" y="150" font-size="12" fill="#000000">残翅 aa__</text>
            </g>
            
            <!-- 基因型 - 表型对应表 -->
            <g id="scene2-genotype-table">
                <text id="scene2-genotype-title" x="420" y="195" font-size="14" font-weight="bold" fill="#000000">基因型 - 表型对应</text>
                
                <!-- 行 1: A_X^B_ → 长翅 -->
                <g id="scene2-genotype-row-1" class="scene2-transition" opacity="0">
                    <text x="420" y="225" font-size="12" fill="#000000">A_X^B_</text>
                    <text x="500" y="225" font-size="12" fill="#1565c0" font-weight="bold">→ 长翅</text>
                </g>
                
                <!-- 行 2: A_X^bY → 小翅 -->
                <g id="scene2-genotype-row-2" class="scene2-transition" opacity="0">
                    <text x="420" y="260" font-size="12" fill="#000000">A_X^bY</text>
                    <text x="500" y="260" font-size="12" fill="#c62828" font-weight="bold">→ 小翅</text>
                    <text x="570" y="260" font-size="10" fill="#c62828">(仅雄性)</text>
                </g>
                
                <!-- 行 3: aa__ → 残翅 -->
                <g id="scene2-genotype-row-3" class="scene2-transition" opacity="0">
                    <text x="420" y="295" font-size="12" fill="#000000">aa__</text>
                    <text x="500" y="295" font-size="12" fill="#2e7d32" font-weight="bold">→ 残翅</text>
                </g>
            </g>
            
            <!-- 比例统计柱状图 (调整位置，避免文字重叠) -->
            <g id="scene2-bar-chart">
                <text id="scene2-bar-title" x="580" y="330" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">表型比例</text>
                
                <!-- 长翅柱 (9/16) - 调整 y 坐标，柱子从 y=370 开始，留出上方空间给标签 -->
                <rect id="scene2-bar-long" x="450" y="370" width="80" height="0" fill="#1565c0" fill-opacity="0.7" class="scene2-transition"/>
                <text id="scene2-bar-long-label" x="490" y="365" font-size="11" fill="#000000" text-anchor="middle" opacity="0">9/16</text>
                <text x="490" y="430" font-size="10" fill="#666" text-anchor="middle">长翅</text>
                
                <!-- 小翅柱 (3/16) -->
                <rect id="scene2-bar-small" x="570" y="370" width="80" height="0" fill="#c62828" fill-opacity="0.7" class="scene2-transition"/>
                <text id="scene2-bar-small-label" x="610" y="365" font-size="11" fill="#000000" text-anchor="middle" opacity="0">3/16</text>
                <text x="610" y="430" font-size="10" fill="#666" text-anchor="middle">小翅</text>
                
                <!-- 残翅柱 (4/16) -->
                <rect id="scene2-bar-vestigial" x="690" y="370" width="80" height="0" fill="#2e7d32" fill-opacity="0.7" class="scene2-transition"/>
                <text id="scene2-bar-vestigial-label" x="730" y="365" font-size="11" fill="#000000" text-anchor="middle" opacity="0">4/16</text>
                <text x="730" y="430" font-size="10" fill="#666" text-anchor="middle">残翅</text>
            </g>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-prev-btn" class="scene2-btn" disabled>◀ 上一步</button>
            <span id="scene2-step-indicator">步骤 0/5</span>
            <button id="scene2-next-btn" class="scene2-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2: F₂表型比例与基因型对应关系分析
        // 布局坐标表（参考）：
        // | 元素 | 位置/范围 | 备注 |
        // | 标题 | (300,45) | 顶部居中，留出 20px 边距 |
        // | 染色体示意图 | (50,50)-(250,130) | 常染色体 + X 染色体 |
        // | 棋盘格 | (50,160)-(370,400) | 4×4 网格，9 蓝 3 红 4 绿 |
        // | 图例区 | (420,50)-(750,150) | 长翅/小翅/残翅 |
        // | 基因型表 | (420,180)-(750,310) | 3 行对应关系 |
        // | 柱状图 | (420,320)-(750,430) | 9/16, 3/16, 4/16 |
        // | 控件栏 | (250,440)-(550,490) | 上一步/下一步 |
        
        const currentStepMax = 4;
        let currentStep = 0;
        
        // 工具函数：显示/隐藏元素
        function show(el) {
            if (el) { el.style.display = 'block'; el.style.opacity = '1'; }
        }
        function hide(el) {
            if (el) { el.style.display = 'none'; el.style.opacity = '0'; }
        }
        function showSVG(el) {
            if (el) { el.style.opacity = '1'; }
        }
        function hideSVG(el) {
            if (el) { el.style.opacity = '0'; }
        }
        
        // 更新场景显示
        function updateScene() {
            // 更新步骤指示器
            document.getElementById('scene2-step-indicator').textContent = '步骤 ' + currentStep + '/5';
            
            // 更新按钮状态
            const prevBtn = document.getElementById('scene2-prev-btn');
            const nextBtn = document.getElementById('scene2-next-btn');
            prevBtn.disabled = (currentStep === 0);
            nextBtn.disabled = (currentStep === currentStepMax);
            
            // 步骤 0：初始状态 - 仅显示框架
            // 步骤 1：展开 9:3:4 = 9:3:3:1 的变形
            // 步骤 2：标注基因位置
            // 步骤 3：展示基因型与表型对应关系
            // 步骤 4：高亮伴性遗传特征
            
            // 步骤 1：显示棋盘格填充、图例色块、柱状图
            if (currentStep >= 1) {
                // 棋盘格填充颜色
                for (let i = 0; i < 8; i++) {
                    for (let j = 0; j < 4; j++) {
                        const cell = document.getElementById('scene2-cell-' + i + '-' + j);
                        if (cell) {
                            cell.style.fill = cell.classList.contains('scene2-long-wing') ? '#1565c0' :
                                              cell.classList.contains('scene2-small-wing') ? '#c62828' : '#2e7d32';
                            cell.style.fillOpacity = '0.25';
                        }
                    }
                }
                
                // 图例色块
                showSVG(document.getElementById('scene2-legend-long-bg'));
                showSVG(document.getElementById('scene2-legend-small-bg'));
                showSVG(document.getElementById('scene2-legend-vestigial-bg'));
                
                // 柱状图
                const barLong = document.getElementById('scene2-bar-long');
                const barSmall = document.getElementById('scene2-bar-small');
                const barVestigial = document.getElementById('scene2-bar-vestigial');
                
                if (barLong) { barLong.style.height = '40px'; barLong.setAttribute('height', '40'); }
                if (barSmall) { barSmall.style.height = '13.33px'; barSmall.setAttribute('height', '13.33'); }
                if (barVestigial) { barVestigial.style.height = '17.78px'; barVestigial.setAttribute('height', '17.78'); }
                
                // 柱状图标签
                showSVG(document.getElementById('scene2-bar-long-label'));
                showSVG(document.getElementById('scene2-bar-small-label'));
                showSVG(document.getElementById('scene2-bar-vestigial-label'));
            }
            
            // 步骤 2：显示染色体标签
            if (currentStep >= 2) {
                showSVG(document.getElementById('scene2-chrom-const-label'));
                showSVG(document.getElementById('scene2-chrom-x-label'));
                showSVG(document.getElementById('scene2-row-label'));
                showSVG(document.getElementById('scene2-col-label'));
            }
            
            // 步骤 3：显示基因型表
            if (currentStep >= 3) {
                showSVG(document.getElementById('scene2-genotype-row-1'));
                showSVG(document.getElementById('scene2-genotype-row-2'));
                showSVG(document.getElementById('scene2-genotype-row-3'));
            }
            
            // 步骤 4：显示性别标注和伴性遗传高亮
            if (currentStep >= 4) {
                showSVG(document.getElementById('scene2-female-label'));
                showSVG(document.getElementById('scene2-male-label'));
                showSVG(document.getElementById('scene2-female-label-2'));
                showSVG(document.getElementById('scene2-male-label-2'));
                showSVG(document.getElementById('scene2-female-label-3'));
                showSVG(document.getElementById('scene2-male-label-3'));
                
                // 高亮小翅格子（仅雄性）
                for (let j = 0; j < 4; j++) {
                    const cell = document.getElementById('scene2-cell-2-' + j);
                    if (cell) {
                        cell.style.stroke = '#c62828';
                        cell.style.strokeWidth = '2';
                        cell.style.strokeDasharray = '4,2';
                    }
                }
            }
        }
        
        // 按钮事件绑定
        document.getElementById('scene2-prev-btn').addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });
        
        document.getElementById('scene2-next-btn').addEventListener('click', function() {
            if (currentStep < currentStepMax) {
                currentStep++;
                updateScene();
            }
        });
        
        // 初始化
        updateScene();
    })();
    </script>
</body>
</html>
