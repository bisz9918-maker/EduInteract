<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>遗传方式判断 - 6 组交配实验数据</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene1-btn { padding: 8px 20px; font-size: 14px; border: none; border-radius: 4px; cursor: pointer; }
        .scene1-btn:disabled { background: #cccccc; cursor: not-allowed; }
        .scene1-btn-enabled { background: #1976d2; color: white; }
        .scene1-btn-disabled { background: #cccccc; color: #666666; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 标题 -->
            <text id="scene1-title" x="400" y="45" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000">6 组交配实验数据与遗传方式判断</text>
            
            <!-- 表头背景（浅蓝色） -->
            <rect id="scene1-header-bg" x="100" y="60" width="600" height="60" fill="#e3f2fd"/>
            
            <!-- 表头文字 -->
            <text id="scene1-header-1" x="140" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">交配组合编号</text>
            <text id="scene1-header-2-1" x="230" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">♀</text>
            <text id="scene1-header-2-2" x="330" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">♂</text>
            <text id="scene1-header-2-3" x="410" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">产仔次数</text>
            <text id="scene1-header-2-4" x="510" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">子代有毛</text>
            <text id="scene1-header-2-5" x="640" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">子代无毛</text>
            
            <!-- 表格竖线 -->
            <line x1="180" y1="60" x2="180" y2="300" stroke="#000000" stroke-width="1"/>
            <line x1="280" y1="60" x2="280" y2="300" stroke="#000000" stroke-width="1"/>
            <line x1="380" y1="60" x2="380" y2="300" stroke="#000000" stroke-width="1"/>
            <line x1="460" y1="60" x2="460" y2="300" stroke="#000000" stroke-width="1"/>
            <line x1="580" y1="60" x2="580" y2="300" stroke="#000000" stroke-width="1"/>
            
            <!-- 表格横线 -->
            <line x1="100" y1="60" x2="700" y2="60" stroke="#000000" stroke-width="2"/>
            <line x1="100" y1="90" x2="700" y2="90" stroke="#000000" stroke-width="1"/>
            <line x1="100" y1="120" x2="700" y2="120" stroke="#000000" stroke-width="1"/>
            <line x1="100" y1="150" x2="700" y2="150" stroke="#000000" stroke-width="1"/>
            <line x1="100" y1="180" x2="700" y2="180" stroke="#000000" stroke-width="1"/>
            <line x1="100" y1="210" x2="700" y2="210" stroke="#000000" stroke-width="1"/>
            <line x1="100" y1="240" x2="700" y2="240" stroke="#000000" stroke-width="1"/>
            <line x1="100" y1="270" x2="700" y2="270" stroke="#000000" stroke-width="1"/>
            <line x1="100" y1="300" x2="700" y2="300" stroke="#000000" stroke-width="2"/>
            
            <!-- 数据文字 -->
            <!-- 组合 1 -->
            <text id="scene1-data-1-1" x="140" y="140" text-anchor="middle" font-size="12" fill="#000000">1</text>
            <text id="scene1-data-1-2" x="230" y="140" text-anchor="middle" font-size="12" fill="#000000">无毛</text>
            <text id="scene1-data-1-3" x="330" y="140" text-anchor="middle" font-size="12" fill="#000000">有毛</text>
            <text id="scene1-data-1-4" x="410" y="140" text-anchor="middle" font-size="12" fill="#000000">6</text>
            <text id="scene1-data-1-5" x="510" y="140" text-anchor="middle" font-size="12" fill="#000000">12(6+6)</text>
            <text id="scene1-data-1-6" x="640" y="140" text-anchor="middle" font-size="12" fill="#000000">9(3+3)</text>
            
            <!-- 组合 2 -->
            <text id="scene1-data-2-1" x="140" y="170" text-anchor="middle" font-size="12" fill="#000000">2</text>
            <text id="scene1-data-2-2" x="230" y="170" text-anchor="middle" font-size="12" fill="#000000">有毛</text>
            <text id="scene1-data-2-3" x="330" y="170" text-anchor="middle" font-size="12" fill="#000000">无毛</text>
            <text id="scene1-data-2-4" x="410" y="170" text-anchor="middle" font-size="12" fill="#000000">6</text>
            <text id="scene1-data-2-5" x="510" y="170" text-anchor="middle" font-size="12" fill="#000000">27(14+13)</text>
            <text id="scene1-data-2-6" x="640" y="170" text-anchor="middle" font-size="12" fill="#000000">20(10+10)</text>
            
            <!-- 组合 3 -->
            <text id="scene1-data-3-1" x="140" y="200" text-anchor="middle" font-size="12" fill="#000000">3</text>
            <text id="scene1-data-3-2" x="230" y="200" text-anchor="middle" font-size="12" fill="#000000">有毛</text>
            <text id="scene1-data-3-3" x="330" y="200" text-anchor="middle" font-size="12" fill="#000000">有毛</text>
            <text id="scene1-data-3-4" x="410" y="200" text-anchor="middle" font-size="12" fill="#000000">17</text>
            <text id="scene1-data-3-5" x="510" y="200" text-anchor="middle" font-size="12" fill="#000000">110(56+54)</text>
            <text id="scene1-data-3-6" x="640" y="200" text-anchor="middle" font-size="12" fill="#000000">29(14+15)</text>
            
            <!-- 组合 4 -->
            <text id="scene1-data-4-1" x="140" y="230" text-anchor="middle" font-size="12" fill="#000000">4</text>
            <text id="scene1-data-4-2" x="230" y="230" text-anchor="middle" font-size="12" fill="#000000">无毛</text>
            <text id="scene1-data-4-3" x="330" y="230" text-anchor="middle" font-size="12" fill="#000000">无毛</text>
            <text id="scene1-data-4-4" x="410" y="230" text-anchor="middle" font-size="12" fill="#000000">4</text>
            <text id="scene1-data-4-5" x="510" y="230" text-anchor="middle" font-size="12" fill="#000000">0</text>
            <text id="scene1-data-4-6" x="640" y="230" text-anchor="middle" font-size="12" fill="#000000">11(6+5)</text>
            
            <!-- 组合 5 -->
            <text id="scene1-data-5-1" x="140" y="260" text-anchor="middle" font-size="12" fill="#000000">5</text>
            <text id="scene1-data-5-2" x="230" y="260" text-anchor="middle" font-size="12" fill="#000000">无毛</text>
            <text id="scene1-data-5-3" x="330" y="260" text-anchor="middle" font-size="12" fill="#000000">有毛</text>
            <text id="scene1-data-5-4" x="410" y="260" text-anchor="middle" font-size="12" fill="#000000">6</text>
            <text id="scene1-data-5-5" x="510" y="260" text-anchor="middle" font-size="12" fill="#000000">13(6+7)</text>
            <text id="scene1-data-5-6" x="640" y="260" text-anchor="middle" font-size="12" fill="#000000">0</text>
            
            <!-- 组合 6 -->
            <text id="scene1-data-6-1" x="140" y="290" text-anchor="middle" font-size="12" fill="#000000">6</text>
            <text id="scene1-data-6-2" x="230" y="290" text-anchor="middle" font-size="12" fill="#000000">有毛</text>
            <text id="scene1-data-6-3" x="330" y="290" text-anchor="middle" font-size="12" fill="#000000">无毛</text>
            <text id="scene1-data-6-4" x="410" y="290" text-anchor="middle" font-size="12" fill="#000000">6</text>
            <text id="scene1-data-6-5" x="510" y="290" text-anchor="middle" font-size="12" fill="#000000">40(21+19)</text>
            <text id="scene1-data-6-6" x="640" y="290" text-anchor="middle" font-size="12" fill="#000000">0</text>
            
            <!-- 高亮框（初始隐藏） -->
            <rect id="scene1-highlight-3" x="95" y="175" width="610" height="30" fill="none" stroke="#1565c0" stroke-width="3" style="display: none;"/>
            <rect id="scene1-highlight-4" x="95" y="205" width="610" height="30" fill="none" stroke="#c62828" stroke-width="3" style="display: none;"/>
            <rect id="scene1-highlight-1-2" x="95" y="115" width="610" height="60" fill="none" stroke="#2e7d32" stroke-width="3" style="display: none;"/>
            
            <!-- 推导说明框（初始隐藏） -->
            <rect id="scene1-reasoning-box" x="50" y="320" width="300" height="80" fill="#ffffff" stroke="#9e9e9e" stroke-width="2" style="display: none;"/>
            <text id="scene1-reasoning-text" x="65" y="345" font-size="13" fill="#000000" style="display: none;"></text>
            
            <!-- 结论框（初始隐藏） -->
            <rect id="scene1-conclusion-box" x="200" y="320" width="400" height="80" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3" style="display: none;"/>
            <text id="scene1-conclusion-text" x="400" y="350" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000" style="display: none;"></text>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn scene1-btn-disabled">◀ 上一步</button>
            <button id="scene1-btn-next" class="scene1-btn scene1-btn-enabled">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现
        // 布局坐标表对照：
        // 标题：(400,45) 居中
        // 表头背景：(100,60)-(700,120) 600×60
        // 表头文字：各表头位置
        // 数据行：120-300，每行 30px 高
        // 推导说明框：(50,320)-(350,400)
        // 结论框：(200,320)-(600,400)
        // 按钮：底部居中
        
        const currentStepMax = 4;
        let currentStep = 0;
        
        // 步骤配置
        const stepConfig = [
            {
                step: 0,
                reasoningText: "",
                conclusionText: "",
                highlight3: false,
                highlight4: false,
                highlight12: false,
                reasoningBox: false,
                conclusionBox: false
            },
            {
                step: 1,
                reasoningText: "关键发现：组合 3（有毛♀×有毛♂）→ 子代出现无毛个体",
                conclusionText: "",
                highlight3: true,
                highlight4: false,
                highlight12: false,
                reasoningBox: true,
                conclusionBox: false
            },
            {
                step: 2,
                reasoningText: "验证：组合 4（无毛♀×无毛♂）→ 子代全无毛，符合隐性纯合特征",
                conclusionText: "",
                highlight3: false,
                highlight4: true,
                highlight12: false,
                reasoningBox: true,
                conclusionBox: false
            },
            {
                step: 3,
                reasoningText: "性别关联：组合 1（无毛♀×有毛♂）子代无毛均为雄性；组合 2（有毛♀×无毛♂）子代无毛雌雄均有",
                conclusionText: "",
                highlight3: false,
                highlight4: false,
                highlight12: true,
                reasoningBox: true,
                conclusionBox: false
            },
            {
                step: 4,
                reasoningText: "",
                conclusionText: "遗传方式判断结论：\n无毛基因为隐性基因，位于 X 染色体上（伴 X 隐性遗传）",
                highlight3: false,
                highlight4: false,
                highlight12: false,
                reasoningBox: false,
                conclusionBox: true
            }
        ];
        
        function updateDisplay() {
            const config = stepConfig[currentStep];
            
            // 更新高亮框
            document.getElementById('scene1-highlight-3').style.display = config.highlight3 ? 'block' : 'none';
            document.getElementById('scene1-highlight-4').style.display = config.highlight4 ? 'block' : 'none';
            document.getElementById('scene1-highlight-1-2').style.display = config.highlight12 ? 'block' : 'none';
            
            // 更新推导说明框
            const reasoningBox = document.getElementById('scene1-reasoning-box');
            const reasoningText = document.getElementById('scene1-reasoning-text');
            if (config.reasoningBox) {
                reasoningBox.style.display = 'block';
                reasoningText.style.display = 'block';
                reasoningText.textContent = config.reasoningText;
            } else {
                reasoningBox.style.display = 'none';
                reasoningText.style.display = 'none';
            }
            
            // 更新结论框
            const conclusionBox = document.getElementById('scene1-conclusion-box');
            const conclusionText = document.getElementById('scene1-conclusion-text');
            if (config.conclusionBox) {
                conclusionBox.style.display = 'block';
                conclusionText.style.display = 'block';
                conclusionText.textContent = config.conclusionText;
            } else {
                conclusionBox.style.display = 'none';
                conclusionText.style.display = 'none';
            }
            
            // 更新按钮状态
            const prevBtn = document.getElementById('scene1-btn-prev');
            const nextBtn = document.getElementById('scene1-btn-next');
            
            prevBtn.disabled = (currentStep === 0);
            prevBtn.className = 'scene1-btn ' + (currentStep === 0 ? 'scene1-btn-disabled' : 'scene1-btn-enabled');
            
            nextBtn.disabled = (currentStep === currentStepMax);
            nextBtn.className = 'scene1-btn ' + (currentStep === currentStepMax ? 'scene1-btn-disabled' : 'scene1-btn-enabled');
        }
        
        // 按钮事件绑定
        document.getElementById('scene1-btn-prev').addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        });
        
        document.getElementById('scene1-btn-next').addEventListener('click', function() {
            if (currentStep < currentStepMax) {
                currentStep++;
                updateDisplay();
            }
        });
        
        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
