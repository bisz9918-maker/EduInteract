<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCR 放射性标记分布规律</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-title { position: absolute; top: 25px; left: 50%; transform: translateX(-50%); font-size: 20px; font-weight: bold; color: #333; }
        #scene2-controls { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; z-index: 10; }
        #scene2-btn-prev, #scene2-btn-next, #scene2-btn-summary {
            padding: 10px 20px; font-size: 14px; border: 2px solid #4a90d9; border-radius: 6px;
            background: #f0f7ff; cursor: pointer; transition: all 0.2s;
        }
        #scene2-btn-prev:hover, #scene2-btn-next:hover, #scene2-btn-summary:hover {
            background: #4a90d9; color: white;
        }
        #scene2-btn-prev:disabled, #scene2-btn-next:disabled {
            opacity: 0.5; cursor: not-allowed; background: #e0e0e0; border-color: #ccc;
        }
        #scene2-stats { position: absolute; top: 350px; left: 50%; transform: translateX(-50%); font-size: 16px; color: #333; text-align: center; }
        #scene2-formula { position: absolute; top: 390px; left: 50%; transform: translateX(-50%); font-size: 18px; color: #c62828; font-weight: bold; }
        #scene2-legend { position: absolute; top: 90px; right: 20px; background: #f9f9f9; border: 1px solid #ddd; padding: 10px; border-radius: 5px; font-size: 13px; }
        #scene2-legend-item { display: flex; align-items: center; margin: 5px 0; }
        #scene2-legend-color { width: 20px; height: 4px; margin-right: 8px; }
        #scene2-svg { width: 800px; height: 500px; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <div id="scene2-title">循环 0 次：原始 DNA</div>
        
        <svg id="scene2-svg" width="800" height="500">
            <!-- DNA 分子显示区 -->
            <g id="scene2-dna-group"></g>
            
            <!-- 图例区（文字在矩形外部右侧） -->
            <g id="scene2-legend-svg">
                <rect x="580" y="90" width="180" height="60" fill="#f9f9f9" stroke="#ddd" stroke-width="1" rx="5"/>
                <line x1="590" y1="110" x2="630" y2="110" stroke="#000000" stroke-width="4"/>
                <text x="640" y="114" font-size="13" fill="#333">母链（无放射性）</text>
                <line x1="590" y1="130" x2="630" y2="130" stroke="#2e7d32" stroke-width="4"/>
                <text x="640" y="134" font-size="13" fill="#333">新链（含<sup>32</sup>P）</text>
            </g>
        </svg>
        
        <div id="scene2-stats">链数：2 条 | 无放射性链：2 条 | 比例：2/2 = 1</div>
        <div id="scene2-formula"></div>
        
        <div id="scene2-controls">
            <button id="scene2-btn-prev" disabled>◀ 上一步</button>
            <button id="scene2-btn-next">下一步 ▶</button>
            <button id="scene2-btn-summary">总结</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2: PCR 放射性标记分布规律
        // 布局坐标表（参考）：
        // | 元素 | 位置 | 备注 |
        // |------|------|------|
        // | 标题 | (400,25) | 居中，距顶部 25px |
        // | DNA 容器 | (150,80) | 500×300 |
        // | 统计区 | (400,350) | 居中 |
        // | 公式区 | (400,390) | 居中，与统计区间距 40px |
        // | 控件栏 | (400,450) | 居中 |
        // | 图例区 | (580,90) | 右侧，文字在矩形外 |
        
        const svg = document.getElementById('scene2-svg');
        const dnaGroup = document.getElementById('scene2-dna-group');
        const titleEl = document.getElementById('scene2-title');
        const statsEl = document.getElementById('scene2-stats');
        const formulaEl = document.getElementById('scene2-formula');
        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        const btnSummary = document.getElementById('scene2-btn-summary');
        
        let currentStep = 0;
        
        // 状态数据
        const states = [
            {
                title: "循环 0 次：原始 DNA",
                dnaType: "original",
                stats: "链数：2 条 | 无放射性链：2 条 | 比例：2/2 = 1",
                formula: ""
            },
            {
                title: "循环 1 次后",
                dnaType: "cycle1",
                stats: "链数：4 条 | 无放射性链：2 条 | 比例：2/4 = 1/2",
                formula: ""
            },
            {
                title: "循环 2 次后",
                dnaType: "cycle2",
                stats: "链数：8 条 | 无放射性链：2 条 | 比例：2/8 = 1/4",
                formula: ""
            },
            {
                title: "循环 n 次后（规律总结）",
                dnaType: "cyclemn",
                stats: "链数：2<sup>(n+1)</sup> 条 | 无放射性链：2 条",
                formula: "不含放射性单链比例 = $\\frac{1}{2^n}$"
            }
        ];
        
        // 绘制 DNA 双链
        function drawDNADoubleStrand(x, y, topColor, bottomColor, width, withLabel) {
            const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
            const strandHeight = 4;
            const gap = 16;
            
            // 上链
            const topLine = document.createElementNS("http://www.w3.org/2000/svg", "line");
            topLine.setAttribute("x1", x);
            topLine.setAttribute("y1", y);
            topLine.setAttribute("x2", x + width);
            topLine.setAttribute("y2", y);
            topLine.setAttribute("stroke", topColor);
            topLine.setAttribute("stroke-width", strandHeight);
            topLine.setAttribute("stroke-linecap", "round");
            group.appendChild(topLine);
            
            // 下链
            const bottomLine = document.createElementNS("http://www.w3.org/2000/svg", "line");
            bottomLine.setAttribute("x1", x);
            bottomLine.setAttribute("y1", y + gap);
            bottomLine.setAttribute("x2", x + width);
            bottomLine.setAttribute("y2", y + gap);
            bottomLine.setAttribute("stroke", bottomColor);
            bottomLine.setAttribute("stroke-width", strandHeight);
            bottomLine.setAttribute("stroke-linecap", "round");
            group.appendChild(bottomLine);
            
            // 氢键（虚线）
            const numBonds = Math.floor(width / 30);
            for (let i = 0; i < numBonds; i++) {
                const bondX = x + 20 + i * 30;
                const bond = document.createElementNS("http://www.w3.org/2000/svg", "line");
                bond.setAttribute("x1", bondX);
                bond.setAttribute("y1", y);
                bond.setAttribute("x2", bondX);
                bond.setAttribute("y2", y + gap);
                bond.setAttribute("stroke", "#888888");
                bond.setAttribute("stroke-width", 1);
                bond.setAttribute("stroke-dasharray", "2,2");
                group.appendChild(bond);
            }
            
            return group;
        }
        
        // 绘制循环 0 次（原始 DNA）
        function drawOriginal() {
            dnaGroup.innerHTML = "";
            
            // 原始 DNA 双链（黑色母链）
            const dna = drawDNADoubleStrand(250, 180, "#000000", "#000000", 300, true);
            dnaGroup.appendChild(dna);
        }
        
        // 绘制循环 1 次后
        function drawCycle1() {
            dnaGroup.innerHTML = "";
            
            // DNA1（左侧）：上黑下绿
            const dna1 = drawDNADoubleStrand(150, 180, "#000000", "#2e7d32", 150, false);
            dnaGroup.appendChild(dna1);
            
            // DNA2（右侧）：上绿下黑
            const dna2 = drawDNADoubleStrand(350, 180, "#2e7d32", "#000000", 150, false);
            dnaGroup.appendChild(dna2);
            
            // ³²P 标记
            const p32_1 = document.createElementNS("http://www.w3.org/2000/svg", "text");
            p32_1.setAttribute("x", 280);
            p32_1.setAttribute("y", 210);
            p32_1.setAttribute("font-size", "12");
            p32_1.setAttribute("fill", "#c62828");
            p32_1.textContent = "³²P";
            dnaGroup.appendChild(p32_1);
            
            const p32_2 = document.createElementNS("http://www.w3.org/2000/svg", "text");
            p32_2.setAttribute("x", 480);
            p32_2.setAttribute("y", 210);
            p32_2.setAttribute("font-size", "12");
            p32_2.setAttribute("fill", "#c62828");
            p32_2.textContent = "³²P";
            dnaGroup.appendChild(p32_2);
        }
        
        // 绘制循环 2 次后
        function drawCycle2() {
            dnaGroup.innerHTML = "";
            
            const dnaWidth = 150;
            const dnaHeight = 24;
            const positions = [
                { x: 100, y: 180 },
                { x: 270, y: 180 },
                { x: 440, y: 180 },
                { x: 100, y: 220 }
            ];
            
            positions.forEach((pos, idx) => {
                // 交替：黑绿、绿黑、黑绿、绿黑
                const topColor = idx % 2 === 0 ? "#000000" : "#2e7d32";
                const bottomColor = idx % 2 === 0 ? "#2e7d32" : "#000000";
                const dna = drawDNADoubleStrand(pos.x, pos.y, topColor, bottomColor, dnaWidth, false);
                dnaGroup.appendChild(dna);
                
                // ³²P 标记（绿色链）
                const p32Y = pos.y + dnaHeight;
                const p32X = pos.x + dnaWidth - 20;
                const p32 = document.createElementNS("http://www.w3.org/2000/svg", "text");
                p32.setAttribute("x", p32X);
                p32.setAttribute("y", p32Y);
                p32.setAttribute("font-size", "11");
                p32.setAttribute("fill", "#c62828");
                p32.textContent = "³²P";
                dnaGroup.appendChild(p32);
            });
        }
        
        // 绘制循环 n 次后（规律总结）
        function drawCycleN() {
            dnaGroup.innerHTML = "";
            
            // 左侧：2 条黑色母链示意
            const leftDna = drawDNADoubleStrand(100, 180, "#000000", "#000000", 100, false);
            dnaGroup.appendChild(leftDna);
            
            // 中间省略号
            const ellipsis = document.createElementNS("http://www.w3.org/2000/svg", "text");
            ellipsis.setAttribute("x", 220);
            ellipsis.setAttribute("y", 200);
            ellipsis.setAttribute("font-size", "24");
            ellipsis.setAttribute("fill", "#666");
            ellipsis.textContent = "...";
            dnaGroup.appendChild(ellipsis);
            
            // 右侧：多个绿色新链示意
            const rightDna1 = drawDNADoubleStrand(280, 180, "#2e7d32", "#2e7d32", 100, false);
            dnaGroup.appendChild(rightDna1);
            
            const rightDna2 = drawDNADoubleStrand(400, 180, "#2e7d32", "#2e7d32", 100, false);
            dnaGroup.appendChild(rightDna2);
            
            // 标签说明
            const label1 = document.createElementNS("http://www.w3.org/2000/svg", "text");
            label1.setAttribute("x", 110);
            label1.setAttribute("y", 220);
            label1.setAttribute("font-size", "12");
            label1.setAttribute("fill", "#333");
            label1.textContent = "2 条母链";
            dnaGroup.appendChild(label1);
            
            const label2 = document.createElementNS("http://www.w3.org/2000/svg", "text");
            label2.setAttribute("x", 320);
            label2.setAttribute("y", 220);
            label2.setAttribute("font-size", "12");
            label2.setAttribute("fill", "#333");
            label2.textContent = "2^(n+1)-2 条新链";
            dnaGroup.appendChild(label2);
        }
        
        // 更新显示
        function updateDisplay() {
            const state = states[currentStep];
            titleEl.textContent = state.title;
            statsEl.innerHTML = state.stats;
            formulaEl.innerHTML = state.formula;
            
            // 重绘 DNA
            switch(state.dnaType) {
                case "original": drawOriginal(); break;
                case "cycle1": drawCycle1(); break;
                case "cycle2": drawCycle2(); break;
                case "cyclemn": drawCycleN(); break;
            }
            
            // 按钮状态
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === states.length - 1;
            
            // MathJax 重新渲染
            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }
        
        // 事件绑定
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        });
        
        btnNext.addEventListener('click', function() {
            if (currentStep < states.length - 1) {
                currentStep++;
                updateDisplay();
            }
        });
        
        btnSummary.addEventListener('click', function() {
            currentStep = states.length - 1;
            updateDisplay();
        });
        
        // 初始化
        updateDisplay();
    })();
    </script>
</body>
</html>
