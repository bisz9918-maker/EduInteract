<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCR 技术三阶段循环过程</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: Arial, sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        
        /* SVG 元素样式 */
        .dna-raw { stroke: #000000; stroke-width: 3; fill: none; transition: all 0.3s ease-in-out; }
        .primer { stroke: #1565c0; stroke-width: 3; fill: none; transition: all 0.3s ease-in-out; }
        .primer-dashed { stroke: #1565c0; stroke-width: 3; fill: none; stroke-dasharray: 5,5; transition: all 0.3s ease-in-out; }
        .newchain { stroke: #2e7d32; stroke-width: 3; fill: none; transition: all 0.3s ease-in-out; }
        .base-pair { stroke: #888888; stroke-width: 1; stroke-dasharray: 3,3; transition: all 0.3s ease-in-out; }
        .temp-box { fill: #c62828; opacity: 0.2; stroke: #c62828; stroke-width: 2; transition: all 0.3s ease-in-out; }
        .temp-box.highlight { stroke: #ffd700; stroke-width: 3; opacity: 0.4; }
        .indicator { fill: #e0e0e0; stroke: #9e9e9e; stroke-width: 1; transition: all 0.3s ease-in-out; }
        .indicator.active { fill: #fff9c4; stroke: #fbc02d; stroke-width: 2; }
        .label { font-family: Arial, sans-serif; font-size: 14px; fill: #000000; }
        .label-small { font-family: Arial, sans-serif; font-size: 12px; fill: #000000; }
        .label-bold { font-family: Arial, sans-serif; font-size: 14px; fill: #000000; font-weight: bold; }
        .step-title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #000000; }
        .polymerase { font-family: Arial, sans-serif; font-size: 14px; fill: #6a1b9a; font-weight: bold; }
        
        /* 控件样式 */
        #scene1-controls { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; z-index: 10; }
        .control-btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; transition: all 0.2s; }
        .btn-prev { background: #e0e0e0; color: #424242; }
        .btn-prev:hover:not(:disabled) { background: #bdbdbd; }
        .btn-next { background: #1976d2; color: white; }
        .btn-next:hover:not(:disabled) { background: #1565c0; }
        .btn-complete { background: #388e3c; color: white; }
        .btn-complete:hover:not(:disabled) { background: #2e7d32; }
        .control-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* 阶段指示器 */
        #scene1-indicators { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 10px; }
        .indicator-label { font-family: Arial, sans-serif; font-size: 12px; fill: #000000; }
        
        /* 隐藏/显示控制 */
        .hidden { opacity: 0; visibility: hidden; }
        .visible { opacity: 1; visibility: visible; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <!-- SVG 图示区：固定 800×500px -->
        <svg width="800" height="500" id="scene1-svg">
            <!-- 阶段标题 (y=40 确保顶部边缘>=20px) -->
            <text id="scene1-title" x="400" y="40" text-anchor="middle" class="step-title">步骤 0：原始 DNA 模板</text>
            
            <!-- 温度标签框 (文字放在框外左侧，x=25 确保左边缘>=20px) -->
            <rect id="scene1-temp95" x="50" y="80" width="80" height="60" class="temp-box" rx="5"/>
            <text x="25" y="115" text-anchor="end" class="label-bold">95°C</text>
            
            <rect id="scene1-temp55" x="50" y="200" width="80" height="60" class="temp-box" rx="5"/>
            <text x="25" y="235" text-anchor="end" class="label-bold">55°C</text>
            
            <rect id="scene1-temp72" x="50" y="320" width="80" height="60" class="temp-box" rx="5"/>
            <text x="25" y="355" text-anchor="end" class="label-bold">72°C</text>
            
            <!-- 阶段箭头 -->
            <line x1="140" y1="140" x2="140" y2="180" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
            <line x1="140" y1="260" x2="140" y2="300" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
            <line x1="140" y1="380" x2="140" y2="420" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
            
            <!-- 箭头标记定义 -->
            <defs>
                <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
                </marker>
            </defs>
            
            <!-- 原始 DNA a 链 (5'→3') -->
            <line id="scene1-dna-a" x1="150" y1="120" x2="650" y2="120" class="dna-raw"/>
            <text x="135" y="115" class="label-bold">5'</text>
            <text x="660" y="115" class="label-bold">3'</text>
            
            <!-- 原始 DNA b 链 (3'→5') -->
            <line id="scene1-dna-b" x1="150" y1="160" x2="650" y2="160" class="dna-raw"/>
            <text x="135" y="165" class="label-bold">3'</text>
            <text x="660" y="165" class="label-bold">5'</text>
            
            <!-- 碱基配对虚线 -->
            <line x1="180" y1="120" x2="180" y2="160" class="base-pair" id="scene1-base1"/>
            <line x1="210" y1="120" x2="210" y2="160" class="base-pair" id="scene1-base2"/>
            <line x1="240" y1="120" x2="240" y2="160" class="base-pair" id="scene1-base3"/>
            <line x1="270" y1="120" x2="270" y2="160" class="base-pair" id="scene1-base4"/>
            <line x1="300" y1="120" x2="300" y2="160" class="base-pair" id="scene1-base5"/>
            <line x1="330" y1="120" x2="330" y2="160" class="base-pair" id="scene1-base6"/>
            <line x1="360" y1="120" x2="360" y2="160" class="base-pair" id="scene1-base7"/>
            <line x1="390" y1="120" x2="390" y2="160" class="base-pair" id="scene1-base8"/>
            <line x1="420" y1="120" x2="420" y2="160" class="base-pair" id="scene1-base9"/>
            <line x1="450" y1="120" x2="450" y2="160" class="base-pair" id="scene1-base10"/>
            <line x1="480" y1="120" x2="480" y2="160" class="base-pair" id="scene1-base11"/>
            <line x1="510" y1="120" x2="510" y2="160" class="base-pair" id="scene1-base12"/>
            <line x1="540" y1="120" x2="540" y2="160" class="base-pair" id="scene1-base13"/>
            <line x1="570" y1="120" x2="570" y2="160" class="base-pair" id="scene1-base14"/>
            <line x1="600" y1="120" x2="600" y2="160" class="base-pair" id="scene1-base15"/>
            <line x1="630" y1="120" x2="630" y2="160" class="base-pair" id="scene1-base16"/>
            
            <!-- 引物Ⅰ (与 b 链 3'端配对) -->
            <line id="scene1-primer1" x1="580" y1="190" x2="650" y2="190" class="primer"/>
            <text x="615" y="215" text-anchor="middle" class="label">引物Ⅰ</text>
            
            <!-- 引物Ⅱ (与 a 链 3'端配对，初始为虚线框 + 问号) -->
            <line id="scene1-primer2" x1="150" y1="90" x2="220" y2="90" class="primer-dashed"/>
            <text id="scene1-primer2-text" x="185" y="70" text-anchor="middle" class="label-bold">?</text>
            <text x="185" y="115" text-anchor="middle" class="label">引物Ⅱ</text>
            
            <!-- DNA 聚合酶图标 (延伸阶段显示，位置调整避免重叠) -->
            <text id="scene1-polymerase" x="200" y="140" text-anchor="middle" class="polymerase hidden">DNA 聚合酶</text>
            <text id="scene1-polymerase2" x="580" y="175" text-anchor="middle" class="polymerase hidden">DNA 聚合酶</text>
            
            <!-- 新合成链 1 (从引物Ⅱ延伸，与 a 链互补) -->
            <line id="scene1-newchain1" x1="220" y1="120" x2="650" y2="120" class="newchain hidden"/>
            
            <!-- 新合成链 2 (从引物Ⅰ延伸，与 b 链互补) -->
            <line id="scene1-newchain2" x1="150" y1="160" x2="580" y2="160" class="newchain hidden"/>
            
            <!-- 循环完成后的标注 (调整位置避免重叠，移到控件栏上方) -->
            <text id="scene1-label-dna1" x="280" y="425" text-anchor="middle" class="label hidden">DNA 分子 1</text>
            <text id="scene1-label-dna2" x="520" y="425" text-anchor="middle" class="label hidden">DNA 分子 2</text>
            <text id="scene1-label-desc1" x="280" y="440" text-anchor="middle" class="label-small hidden">一条原始链 + 一条新链</text>
            <text id="scene1-label-desc2" x="520" y="440" text-anchor="middle" class="label-small hidden">一条原始链 + 一条新链</text>
        </svg>
        
        <!-- 阶段指示器 -->
        <div id="scene1-indicators">
            <rect id="scene1-indicator1" x="0" y="0" width="110" height="40" class="indicator active"/>
            <text x="55" y="25" text-anchor="middle" class="indicator-label">步骤 0：模板</text>
            
            <rect id="scene1-indicator2" x="0" y="50" width="110" height="40" class="indicator"/>
            <text x="55" y="75" text-anchor="middle" class="indicator-label">步骤 1：变性</text>
            
            <rect id="scene1-indicator3" x="0" y="100" width="110" height="40" class="indicator"/>
            <text x="55" y="125" text-anchor="middle" class="indicator-label">步骤 2：复性</text>
            
            <rect id="scene1-indicator4" x="0" y="150" width="110" height="40" class="indicator"/>
            <text x="55" y="175" text-anchor="middle" class="indicator-label">步骤 3：延伸</text>
            
            <rect id="scene1-indicator-done" x="0" y="200" width="110" height="40" class="indicator"/>
            <text x="55" y="225" text-anchor="middle" class="indicator-label">完成</text>
        </div>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="control-btn btn-prev">◀ 上一步</button>
            <button id="scene1-btn-next" class="control-btn btn-next">下一步 ▶</button>
            <button id="scene1-btn-complete" class="control-btn btn-complete">完成</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1: PCR 技术三阶段循环过程
        // 布局坐标表（参考）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 备注 |
        // |------|------|-----------|------|------|
        // | 阶段标题 | text | (400,40) | ~200×20 | 顶部居中 |
        // | 原始 DNA a 链 | 线段 | (150,120)-(650,120) | 500×3 | 黑色实线，5'在左 |
        // | 原始 DNA b 链 | 线段 | (150,160)-(650,160) | 500×3 | 黑色实线，3'在左 |
        // | 引物Ⅰ | 线段 | (580,190)-(650,190) | 70×3 | 蓝色，与 b 链配对 |
        // | 引物Ⅱ | 线段 | (150,90)-(220,90) | 70×3 | 蓝色，与 a 链配对 |
        // | 新合成链 1 | 线段 | (220,120)-(650,120) | 430×3 | 绿色，延伸阶段显示 |
        // | 新合成链 2 | 线段 | (150,160)-(580,160) | 430×3 | 绿色，延伸阶段显示 |
        
        // 状态机设计
        const state = {
            currentStep: 0,
            maxStep: 4,
            steps: [
                { 
                    title: '步骤 0：原始 DNA 模板', 
                    showPrimer2: false, 
                    showNewChain: false, 
                    tempHighlight: null,
                    bChainOffset: 0,
                    showPolymerase: false,
                    showFinal: false
                },
                { 
                    title: '步骤 1：95°C 变性', 
                    showPrimer2: false, 
                    showNewChain: false, 
                    tempHighlight: '95',
                    bChainOffset: 20,
                    showPolymerase: false,
                    showFinal: false
                },
                { 
                    title: '步骤 2：55°C 复性', 
                    showPrimer2: true, 
                    showNewChain: false, 
                    tempHighlight: '55',
                    bChainOffset: 20,
                    showPolymerase: false,
                    showFinal: false
                },
                { 
                    title: '步骤 3：72°C 延伸', 
                    showPrimer2: true, 
                    showNewChain: true, 
                    tempHighlight: '72',
                    bChainOffset: 20,
                    showPolymerase: true,
                    showFinal: false
                },
                { 
                    title: '完成：循环一次后的两个 DNA 分子', 
                    showPrimer2: true, 
                    showNewChain: true, 
                    tempHighlight: null,
                    bChainOffset: 0,
                    showPolymerase: false,
                    showFinal: true
                }
            ]
        };
        
        // DOM 元素引用
        const elements = {
            title: document.getElementById('scene1-title'),
            dnaA: document.getElementById('scene1-dna-a'),
            dnaB: document.getElementById('scene1-dna-b'),
            primer1: document.getElementById('scene1-primer1'),
            primer2: document.getElementById('scene1-primer2'),
            primer2Text: document.getElementById('scene1-primer2-text'),
            newChain1: document.getElementById('scene1-newchain1'),
            newChain2: document.getElementById('scene1-newchain2'),
            polymerase: document.getElementById('scene1-polymerase'),
            polymerase2: document.getElementById('scene1-polymerase2'),
            temp95: document.getElementById('scene1-temp95'),
            temp55: document.getElementById('scene1-temp55'),
            temp72: document.getElementById('scene1-temp72'),
            btnPrev: document.getElementById('scene1-btn-prev'),
            btnNext: document.getElementById('scene1-btn-next'),
            btnComplete: document.getElementById('scene1-btn-complete'),
            indicator1: document.getElementById('scene1-indicator1'),
            indicator2: document.getElementById('scene1-indicator2'),
            indicator3: document.getElementById('scene1-indicator3'),
            indicator4: document.getElementById('scene1-indicator4'),
            indicatorDone: document.getElementById('scene1-indicator-done'),
            labelDna1: document.getElementById('scene1-label-dna1'),
            labelDna2: document.getElementById('scene1-label-dna2'),
            labelDesc1: document.getElementById('scene1-label-desc1'),
            labelDesc2: document.getElementById('scene1-label-desc2'),
            bases: [
                'scene1-base1', 'scene1-base2', 'scene1-base3', 'scene1-base4',
                'scene1-base5', 'scene1-base6', 'scene1-base7', 'scene1-base8',
                'scene1-base9', 'scene1-base10', 'scene1-base11', 'scene1-base12',
                'scene1-base13', 'scene1-base14', 'scene1-base15', 'scene1-base16'
            ].map(id => document.getElementById(id))
        };
        
        // 工具函数：显示/隐藏元素
        function show(el) {
            if (el) {
                el.classList.remove('hidden');
                el.classList.add('visible');
                el.style.opacity = '1';
                el.style.visibility = 'visible';
            }
        }
        
        function hide(el) {
            if (el) {
                el.classList.remove('visible');
                el.classList.add('hidden');
                el.style.opacity = '0';
                el.style.visibility = 'hidden';
            }
        }
        
        // 更新温度框高亮
        function updateTempHighlight(temp) {
            elements.temp95.classList.remove('highlight');
            elements.temp55.classList.remove('highlight');
            elements.temp72.classList.remove('highlight');
            
            if (temp === '95') elements.temp95.classList.add('highlight');
            else if (temp === '55') elements.temp55.classList.add('highlight');
            else if (temp === '72') elements.temp72.classList.add('highlight');
        }
        
        // 更新阶段指示器
        function updateIndicators(step) {
            elements.indicator1.classList.remove('active');
            elements.indicator2.classList.remove('active');
            elements.indicator3.classList.remove('active');
            elements.indicator4.classList.remove('active');
            elements.indicatorDone.classList.remove('active');
            
            if (step === 0) elements.indicator1.classList.add('active');
            else if (step === 1) elements.indicator2.classList.add('active');
            else if (step === 2) elements.indicator3.classList.add('active');
            else if (step === 3) elements.indicator4.classList.add('active');
            else if (step === 4) elements.indicatorDone.classList.add('active');
        }
        
        // 更新按钮状态
        function updateButtons() {
            elements.btnPrev.disabled = state.currentStep === 0;
            elements.btnNext.disabled = state.currentStep === state.maxStep;
            elements.btnComplete.disabled = state.currentStep === state.maxStep;
        }
        
        // 渲染当前步骤
        function renderStep() {
            const step = state.steps[state.currentStep];
            
            // 更新标题
            elements.title.textContent = step.title;
            
            // 更新温度框高亮
            updateTempHighlight(step.tempHighlight);
            
            // 更新阶段指示器
            updateIndicators(state.currentStep);
            
            // 更新 b 链位置（变性时向下移动）
            if (step.bChainOffset > 0) {
                elements.dnaB.setAttribute('y1', 160 + step.bChainOffset);
                elements.dnaB.setAttribute('y2', 160 + step.bChainOffset);
            } else {
                elements.dnaB.setAttribute('y1', 160);
                elements.dnaB.setAttribute('y2', 160);
            }
            
            // 更新碱基配对虚线可见性（变性时消失）
            if (step.bChainOffset > 0) {
                elements.bases.forEach(base => hide(base));
            } else {
                elements.bases.forEach(base => show(base));
            }
            
            // 更新引物Ⅱ可见性
            if (step.showPrimer2) {
                show(elements.primer2);
                show(elements.primer2Text);
                elements.primer2.classList.remove('primer-dashed');
                elements.primer2.classList.add('primer');
                elements.primer2Text.textContent = '3\'-C-C-...-A-G-5\'';
            } else {
                show(elements.primer2);
                show(elements.primer2Text);
                elements.primer2.classList.add('primer-dashed');
                elements.primer2.classList.remove('primer');
                elements.primer2Text.textContent = '?';
            }
            
            // 更新新合成链可见性
            if (step.showNewChain) {
                show(elements.newChain1);
                show(elements.newChain2);
            } else {
                hide(elements.newChain1);
                hide(elements.newChain2);
            }
            
            // 更新 DNA 聚合酶可见性
            if (step.showPolymerase) {
                show(elements.polymerase);
                show(elements.polymerase2);
            } else {
                hide(elements.polymerase);
                hide(elements.polymerase2);
            }
            
            // 更新完成标注
            if (step.showFinal) {
                show(elements.labelDna1);
                show(elements.labelDna2);
                show(elements.labelDesc1);
                show(elements.labelDesc2);
            } else {
                hide(elements.labelDna1);
                hide(elements.labelDna2);
                hide(elements.labelDesc1);
                hide(elements.labelDesc2);
            }
            
            // 更新按钮状态
            updateButtons();
        }
        
        // 步骤变更
        function stepChange(direction) {
            const newStep = state.currentStep + direction;
            if (newStep >= 0 && newStep <= state.maxStep) {
                state.currentStep = newStep;
                renderStep();
            }
        }
        
        // 跳转到完成
        function goToComplete() {
            state.currentStep = state.maxStep;
            renderStep();
        }
        
        // 事件绑定
        elements.btnPrev.addEventListener('click', () => stepChange(-1));
        elements.btnNext.addEventListener('click', () => stepChange(1));
        elements.btnComplete.addEventListener('click', goToComplete);
        
        // 初始化
        renderStep();
    })();
    </script>
</body>
</html>
