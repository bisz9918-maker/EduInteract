<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 3 - 体心立方与面心立方晶胞对比</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene3-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #333; border-radius: 4px; background: #f5f5f5; }
        .scene3-btn:hover { background: #e0e0e0; }
        .scene3-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene3-step-indicator { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); font-size: 14px; color: #666; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg width="800" height="500" id="scene3-svg">
            <!-- BCC 晶胞标签 -->
            <text id="scene3-bcc-label" x="180" y="80" font-size="16" fill="#1565c0" font-weight="bold">BCC</text>
            
            <!-- FCC 晶胞标签 -->
            <text id="scene3-fcc-label" x="530" y="80" font-size="16" fill="#2e7d32" font-weight="bold">FCC</text>
            
            <!-- BCC 晶胞线框 (12 条棱边) -->
            <g id="scene3-bcc-cube">
                <!-- 前面 -->
                <line x1="150" y1="125" x2="300" y2="125" stroke="#1565c0" stroke-width="2"/>
                <line x1="300" y1="125" x2="300" y2="275" stroke="#1565c0" stroke-width="2"/>
                <line x1="300" y1="275" x2="150" y2="275" stroke="#1565c0" stroke-width="2"/>
                <line x1="150" y1="275" x2="150" y2="125" stroke="#1565c0" stroke-width="2"/>
                <!-- 后面 -->
                <line x1="175" y1="150" x2="325" y2="150" stroke="#1565c0" stroke-width="2"/>
                <line x1="325" y1="150" x2="325" y2="300" stroke="#1565c0" stroke-width="2"/>
                <line x1="325" y1="300" x2="175" y2="300" stroke="#1565c0" stroke-width="2"/>
                <line x1="175" y1="300" x2="175" y2="150" stroke="#1565c0" stroke-width="2"/>
                <!-- 连接前后 -->
                <line x1="150" y1="125" x2="175" y2="150" stroke="#1565c0" stroke-width="2"/>
                <line x1="300" y1="125" x2="325" y2="150" stroke="#1565c0" stroke-width="2"/>
                <line x1="300" y1="275" x2="325" y2="300" stroke="#1565c0" stroke-width="2"/>
                <line x1="150" y1="275" x2="175" y2="300" stroke="#1565c0" stroke-width="2"/>
            </g>
            
            <!-- FCC 晶胞线框 (12 条棱边) -->
            <g id="scene3-fcc-cube">
                <!-- 前面 -->
                <line x1="500" y1="125" x2="650" y2="125" stroke="#2e7d32" stroke-width="2"/>
                <line x1="650" y1="125" x2="650" y2="275" stroke="#2e7d32" stroke-width="2"/>
                <line x1="650" y1="275" x2="500" y2="275" stroke="#2e7d32" stroke-width="2"/>
                <line x1="500" y1="275" x2="500" y2="125" stroke="#2e7d32" stroke-width="2"/>
                <!-- 后面 -->
                <line x1="525" y1="150" x2="675" y2="150" stroke="#2e7d32" stroke-width="2"/>
                <line x1="675" y1="150" x2="675" y2="300" stroke="#2e7d32" stroke-width="2"/>
                <line x1="675" y1="300" x2="525" y2="300" stroke="#2e7d32" stroke-width="2"/>
                <line x1="525" y1="300" x2="525" y2="150" stroke="#2e7d32" stroke-width="2"/>
                <!-- 连接前后 -->
                <line x1="500" y1="125" x2="525" y2="150" stroke="#2e7d32" stroke-width="2"/>
                <line x1="650" y1="125" x2="675" y2="150" stroke="#2e7d32" stroke-width="2"/>
                <line x1="650" y1="275" x2="675" y2="300" stroke="#2e7d32" stroke-width="2"/>
                <line x1="500" y1="275" x2="525" y2="300" stroke="#2e7d32" stroke-width="2"/>
            </g>
            
            <!-- BCC 体对角线 (步骤 1 显示) -->
            <line id="scene3-bcc-diagonal" x1="150" y1="125" x2="325" y2="300" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5" opacity="0"/>
            
            <!-- FCC 面对角线 (步骤 1 显示) -->
            <line id="scene3-fcc-diagonal" x1="500" y1="125" x2="675" y2="300" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5" opacity="0"/>
            
            <!-- BCC 原子半径标注 (步骤 1 显示) - 移到对角线左侧避免重叠 -->
            <text id="scene3-bcc-radius" x="120" y="200" font-size="14" fill="#c62828" opacity="0">r</text>
            
            <!-- FCC 原子半径标注 (步骤 1 显示) - 移到对角线右侧避免重叠 -->
            <text id="scene3-fcc-radius" x="705" y="200" font-size="14" fill="#c62828" opacity="0">r</text>
            
            <!-- 半径相同标注 (步骤 1 显示) -->
            <text id="scene3-radius-same" x="380" y="200" font-size="14" fill="#c62828" text-anchor="middle" opacity="0">r 相同</text>
            
            <!-- BCC 边长公式 (步骤 2 显示) - 移到晶胞下方更靠下位置避免与对角线重叠 -->
            <text id="scene3-bcc-edge-formula" x="225" y="315" font-size="14" fill="#1565c0" text-anchor="middle" opacity="0">$$\sqrt{3}a_1 = 4r$$</text>
            
            <!-- FCC 边长公式 (步骤 2 显示) - 移到晶胞下方更靠下位置避免与对角线重叠 -->
            <text id="scene3-fcc-edge-formula" x="575" y="315" font-size="14" fill="#2e7d32" text-anchor="middle" opacity="0">$$2\sqrt{2}a_2 = 4r$$</text>
            
            <!-- BCC 边长 a₁标注 (步骤 3 显示) - 移到更下方 -->
            <text id="scene3-bcc-edge" x="225" y="355" font-size="14" fill="#1565c0" text-anchor="middle" opacity="0">a₁</text>
            
            <!-- FCC 边长 a₂标注 (步骤 3 显示) - 移到更下方 -->
            <text id="scene3-fcc-edge" x="575" y="355" font-size="14" fill="#2e7d32" text-anchor="middle" opacity="0">a₂</text>
            
            <!-- BCC 原子数标注 (步骤 4 显示) - 移到更下方，与边长标注间距 35px -->
            <text id="scene3-bcc-atoms" x="225" y="395" font-size="14" fill="#1565c0" text-anchor="middle" opacity="0">n₁ = 2</text>
            
            <!-- FCC 原子数标注 (步骤 4 显示) - 移到更下方，与边长标注间距 35px -->
            <text id="scene3-fcc-atoms" x="575" y="395" font-size="14" fill="#2e7d32" text-anchor="middle" opacity="0">n₂ = 4</text>
            
            <!-- 边长比公式 (步骤 3 显示) - 移到更下方，与原子数标注间距 30px -->
            <text id="scene3-edge-ratio" x="225" y="430" font-size="14" fill="#000000" text-anchor="middle" opacity="0">$$a_1 : a_2 = \sqrt{3} : 2\sqrt{2}$$</text>
            
            <!-- 密度比公式 (步骤 5 显示) - 移到更下方，与原子数标注间距 30px -->
            <text id="scene3-density-ratio" x="575" y="430" font-size="14" fill="#000000" text-anchor="middle" opacity="0">$$\rho_1 : \rho_2 = \sqrt{3} : \sqrt{2}$$</text>
        </svg>
        
        <div id="scene3-step-indicator">步骤 0/5</div>
        
        <div id="scene3-controls">
            <button id="scene3-step-btn-prev" class="scene3-btn" disabled>◀ 上一步</button>
            <button id="scene3-step-btn-next" class="scene3-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 3 实现
        // 坐标表对照：
        // BCC 晶胞：中心 (225,200)，边长 150px
        // FCC 晶胞：中心 (575,200)，边长 150px
        // BCC 标签：(180,80) 蓝色
        // FCC 标签：(530,80) 绿色
        // BCC 体对角线：(150,125)-(325,300) 红色虚线
        // FCC 面对角线：(500,125)-(675,300) 红色虚线
        // 半径标注：(120,200) 和 (705,200) 红色 - 移到对角线两侧避免重叠
        // 半径相同：(380,200) 红色
        // 边长公式：(225,315) 和 (575,315) - 移低避免与对角线重叠
        // 边长标注：(225,355) 和 (575,355) - 移低
        // 原子数：(225,395) 和 (575,395) - 移低，与边长标注间距 40px
        // 边长比：(225,430) 黑色 - 移低，与原子数标注间距 35px
        // 密度比：(575,430) 黑色 - 移低，与原子数标注间距 35px
        // 控件栏：y=455
        
        const TOTAL_STEPS = 5;
        let currentStep = 0;
        
        // 元素显示/隐藏控制
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.opacity = '1';
                el.style.display = 'block';
            }
        }
        
        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.opacity = '0';
                if (el.tagName === 'text') {
                    el.style.display = 'block'; // text 元素保持 display
                }
            }
        }
        
        // 更新步骤显示
        function updateStep() {
            // 重置所有动态元素
            const dynamicElements = [
                'scene3-bcc-diagonal',
                'scene3-fcc-diagonal',
                'scene3-bcc-radius',
                'scene3-fcc-radius',
                'scene3-radius-same',
                'scene3-bcc-edge-formula',
                'scene3-fcc-edge-formula',
                'scene3-bcc-edge',
                'scene3-fcc-edge',
                'scene3-edge-ratio',
                'scene3-bcc-atoms',
                'scene3-fcc-atoms',
                'scene3-density-ratio'
            ];
            
            dynamicElements.forEach(id => hideElement(id));
            
            // 根据当前步骤显示元素
            if (currentStep >= 1) {
                showElement('scene3-bcc-diagonal');
                showElement('scene3-fcc-diagonal');
                showElement('scene3-bcc-radius');
                showElement('scene3-fcc-radius');
                showElement('scene3-radius-same');
            }
            
            if (currentStep >= 2) {
                showElement('scene3-bcc-edge-formula');
                showElement('scene3-fcc-edge-formula');
            }
            
            if (currentStep >= 3) {
                showElement('scene3-bcc-edge');
                showElement('scene3-fcc-edge');
                showElement('scene3-edge-ratio');
            }
            
            if (currentStep >= 4) {
                showElement('scene3-bcc-atoms');
                showElement('scene3-fcc-atoms');
            }
            
            if (currentStep >= 5) {
                showElement('scene3-density-ratio');
            }
            
            // 更新步骤指示器
            document.getElementById('scene3-step-indicator').textContent = `步骤 ${currentStep}/${TOTAL_STEPS}`;
            
            // 更新按钮状态
            document.getElementById('scene3-step-btn-prev').disabled = (currentStep === 0);
            document.getElementById('scene3-step-btn-next').disabled = (currentStep === TOTAL_STEPS);
            
            // 触发 MathJax 重新渲染
            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }
        
        // 按钮事件绑定
        document.getElementById('scene3-step-btn-prev').addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });
        
        document.getElementById('scene3-step-btn-next').addEventListener('click', function() {
            if (currentStep < TOTAL_STEPS) {
                currentStep++;
                updateStep();
            }
        });
        
        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
