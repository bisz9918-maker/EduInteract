<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 面心立方晶胞 (FCC) 配位数分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene2-controls button {
            padding: 8px 20px;
            font-size: 14px;
            cursor: pointer;
            border: 2px solid #333;
            border-radius: 4px;
            background: #f5f5f5;
            transition: all 0.2s;
        }
        #scene2-controls button:hover:not(:disabled) {
            background: #e0e0e0;
        }
        #scene2-controls button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .scene2-atom { transition: all 0.3s ease; }
        .scene2-conn-line { transition: all 0.3s ease; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <!-- SVG 图示区：固定 800×500px -->
        <svg id="scene2-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 标题 (调整 y 坐标至 60，确保顶部边缘 >= 20px) -->
            <text id="scene2-title" x="400" y="60" text-anchor="middle" font-size="24" font-weight="bold">面心立方晶胞 (FCC)</text>
            
            <!-- 立方体棱边 (12 条) -->
            <!-- 前方面 4 条 -->
            <line id="scene2-cube-edge-0" x1="200" y1="350" x2="400" y2="350" stroke="#000000" stroke-width="4"/>
            <line id="scene2-cube-edge-1" x1="400" y1="350" x2="400" y2="200" stroke="#000000" stroke-width="4"/>
            <line id="scene2-cube-edge-2" x1="400" y1="200" x2="200" y2="200" stroke="#000000" stroke-width="4"/>
            <line id="scene2-cube-edge-3" x1="200" y1="200" x2="200" y2="350" stroke="#000000" stroke-width="4"/>
            <!-- 后方面 4 条 -->
            <line id="scene2-cube-edge-4" x1="320" y1="420" x2="520" y2="420" stroke="#000000" stroke-width="4"/>
            <line id="scene2-cube-edge-5" x1="520" y1="420" x2="520" y2="270" stroke="#000000" stroke-width="4"/>
            <line id="scene2-cube-edge-6" x1="520" y1="270" x2="320" y2="270" stroke="#000000" stroke-width="4"/>
            <line id="scene2-cube-edge-7" x1="320" y1="270" x2="320" y2="420" stroke="#000000" stroke-width="4"/>
            <!-- 连接前后 4 条 -->
            <line id="scene2-cube-edge-8" x1="200" y1="350" x2="320" y2="420" stroke="#000000" stroke-width="4"/>
            <line id="scene2-cube-edge-9" x1="400" y1="350" x2="520" y2="420" stroke="#000000" stroke-width="4"/>
            <line id="scene2-cube-edge-10" x1="200" y1="200" x2="320" y2="270" stroke="#000000" stroke-width="4"/>
            <line id="scene2-cube-edge-11" x1="400" y1="200" x2="520" y2="270" stroke="#000000" stroke-width="4"/>
            
            <!-- 顶点原子 (8 个) -->
            <circle id="scene2-vertex-atom-0" class="scene2-atom" cx="200" cy="350" r="6" fill="#000000"/>
            <circle id="scene2-vertex-atom-1" class="scene2-atom" cx="400" cy="350" r="6" fill="#000000"/>
            <circle id="scene2-vertex-atom-2" class="scene2-atom" cx="400" cy="200" r="6" fill="#000000"/>
            <circle id="scene2-vertex-atom-3" class="scene2-atom" cx="200" cy="200" r="6" fill="#000000"/>
            <circle id="scene2-vertex-atom-4" class="scene2-atom" cx="320" cy="420" r="6" fill="#000000"/>
            <circle id="scene2-vertex-atom-5" class="scene2-atom" cx="520" cy="420" r="6" fill="#000000"/>
            <circle id="scene2-vertex-atom-6" class="scene2-atom" cx="520" cy="270" r="6" fill="#000000"/>
            <circle id="scene2-vertex-atom-7" class="scene2-atom" cx="320" cy="270" r="6" fill="#000000"/>
            
            <!-- 面心原子 (6 个) -->
            <circle id="scene2-face-atom-0" class="scene2-atom" cx="300" cy="275" r="6" fill="#000000"/>
            <circle id="scene2-face-atom-1" class="scene2-atom" cx="420" cy="345" r="6" fill="#000000"/>
            <circle id="scene2-face-atom-2" class="scene2-atom" cx="300" cy="235" r="6" fill="#000000"/>
            <circle id="scene2-face-atom-3" class="scene2-atom" cx="300" cy="385" r="6" fill="#000000"/>
            <circle id="scene2-face-atom-4" class="scene2-atom" cx="260" cy="310" r="6" fill="#000000"/>
            <circle id="scene2-face-atom-5" class="scene2-atom" cx="460" cy="310" r="6" fill="#000000"/>
            
            <!-- 连接虚线 (步骤 2 显示，从选定顶点 (200,350) 到 12 个面心原子) -->
            <line id="scene2-conn-line-0" class="scene2-conn-line" x1="200" y1="350" x2="300" y2="275" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" style="display:none;opacity:0"/>
            <line id="scene2-conn-line-1" class="scene2-conn-line" x1="200" y1="350" x2="420" y2="345" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" style="display:none;opacity:0"/>
            <line id="scene2-conn-line-2" class="scene2-conn-line" x1="200" y1="350" x2="300" y2="235" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" style="display:none;opacity:0"/>
            <line id="scene2-conn-line-3" class="scene2-conn-line" x1="200" y1="350" x2="300" y2="385" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" style="display:none;opacity:0"/>
            <line id="scene2-conn-line-4" class="scene2-conn-line" x1="200" y1="350" x2="260" y2="310" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" style="display:none;opacity:0"/>
            <line id="scene2-conn-line-5" class="scene2-conn-line" x1="200" y1="350" x2="460" y2="310" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" style="display:none;opacity:0"/>
            <line id="scene2-conn-line-6" class="scene2-conn-line" x1="200" y1="350" x2="340" y2="295" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" style="display:none;opacity:0"/>
            <line id="scene2-conn-line-7" class="scene2-conn-line" x1="200" y1="350" x2="340" y2="405" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" style="display:none;opacity:0"/>
            <line id="scene2-conn-line-8" class="scene2-conn-line" x1="200" y1="350" x2="220" y2="265" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" style="display:none;opacity:0"/>
            <line id="scene2-conn-line-9" class="scene2-conn-line" x1="200" y1="350" x2="220" y2="435" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" style="display:none;opacity:0"/>
            <line id="scene2-conn-line-10" class="scene2-conn-line" x1="200" y1="350" x2="180" y2="285" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" style="display:none;opacity:0"/>
            <line id="scene2-conn-line-11" class="scene2-conn-line" x1="200" y1="350" x2="180" y2="415" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" style="display:none;opacity:0"/>
            
            <!-- 标签 (将边长标注"a"移到更左侧，远离连接虚线) -->
            <text id="scene2-edge-label" x="165" y="330" font-size="16">a</text>
            <text id="scene2-vertex-label" x="175" y="375" font-size="14" style="display:none;opacity:0">Fe(顶点)</text>
            <text id="scene2-face-label" x="475" y="315" font-size="14">Fe(面心)</text>
            <text id="scene2-coordination-label" x="580" y="180" font-size="20" fill="#c62828" font-weight="bold" style="display:none;opacity:0">配位数 = 12</text>
            
            <!-- 步骤提示文字 -->
            <text id="scene2-step-hint" x="400" y="485" text-anchor="middle" font-size="14" fill="#666" style="display:none;opacity:0">分析顶点原子的最近邻原子</text>
        </svg>
        
        <!-- 控件栏叠在 SVG 底部 -->
        <div id="scene2-controls">
            <button id="scene2-prev-btn">◀ 上一步</button>
            <button id="scene2-next-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现 - 面心立方晶胞 (FCC) 配位数分析
        // 布局坐标表 (从 spec.json 提取):
        // | 元素 | 位置 |
        // | 立方体前下左顶点 | (200,350) |
        // | 立方体前下右顶点 | (400,350) |
        // | 立方体前上左顶点 | (200,200) |
        // | 立方体前上右顶点 | (400,200) |
        // | 立方体后下左顶点 | (320,420) |
        // | 立方体后下右顶点 | (520,420) |
        // | 立方体后上左顶点 | (320,270) |
        // | 立方体后上右顶点 | (520,270) |
        // | 前方面心 | (300,275) |
        // | 后方面心 | (420,345) |
        // | 上方面心 | (300,235) |
        // | 下方面心 | (300,385) |
        // | 左方面心 | (260,310) |
        // | 右方面心 | (460,310) |
        
        const maxStep = 3;
        
        // 工具函数：显示元素 (同时处理 display 和 opacity)
        function show(el) {
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }
        
        // 工具函数：隐藏元素
        function hide(el) {
            if (el) {
                el.style.opacity = '0';
                setTimeout(() => {
                    if (el) el.style.display = 'none';
                }, 300);
            }
        }
        
        // 更新场景显示
        function updateScene() {
            const prevBtn = document.getElementById('scene2-prev-btn');
            const nextBtn = document.getElementById('scene2-next-btn');
            const vertexLabel = document.getElementById('scene2-vertex-label');
            const vertexAtom0 = document.getElementById('scene2-vertex-atom-0');
            const connLines = document.querySelectorAll('.scene2-conn-line');
            const faceAtoms = document.querySelectorAll('.scene2-atom[id^="scene2-face-atom-"]');
            const coordinationLabel = document.getElementById('scene2-coordination-label');
            const stepHint = document.getElementById('scene2-step-hint');
            
            // 重置所有高亮
            vertexAtom0.setAttribute('fill', '#000000');
            vertexAtom0.setAttribute('r', '6');
            faceAtoms.forEach(atom => {
                atom.setAttribute('fill', '#000000');
                atom.setAttribute('r', '6');
            });
            
            // 隐藏所有连接线和标签
            connLines.forEach(line => {
                line.style.display = 'none';
                line.style.opacity = '0';
            });
            hide(vertexLabel);
            hide(coordinationLabel);
            hide(stepHint);
            
            // 根据当前步骤更新显示
            switch(window.scene2CurrentStep) {
                case 0:
                    // 初始状态：显示完整晶胞
                    prevBtn.disabled = true;
                    nextBtn.textContent = '下一步 ▶';
                    break;
                    
                case 1:
                    // 步骤 1：高亮选定顶点原子
                    vertexAtom0.setAttribute('fill', '#1565c0');
                    vertexAtom0.setAttribute('r', '7');
                    show(vertexLabel);
                    show(stepHint);
                    prevBtn.disabled = false;
                    nextBtn.textContent = '下一步 ▶';
                    break;
                    
                case 2:
                    // 步骤 2：高亮 12 个最近邻面心原子，显示连接虚线
                    vertexAtom0.setAttribute('fill', '#1565c0');
                    vertexAtom0.setAttribute('r', '7');
                    show(vertexLabel);
                    
                    // 高亮 6 个可见的面心原子
                    for (let i = 0; i < 6; i++) {
                        const atom = document.getElementById('scene2-face-atom-' + i);
                        atom.setAttribute('fill', '#c62828');
                        atom.setAttribute('r', '7');
                    }
                    
                    // 显示 12 条连接虚线
                    for (let i = 0; i < 12; i++) {
                        const line = document.getElementById('scene2-conn-line-' + i);
                        show(line);
                    }
                    
                    show(stepHint);
                    prevBtn.disabled = false;
                    nextBtn.textContent = '下一步 ▶';
                    break;
                    
                case 3:
                    // 步骤 3：显示配位数结论
                    vertexAtom0.setAttribute('fill', '#1565c0');
                    vertexAtom0.setAttribute('r', '7');
                    show(vertexLabel);
                    
                    // 保持面心原子高亮
                    for (let i = 0; i < 6; i++) {
                        const atom = document.getElementById('scene2-face-atom-' + i);
                        atom.setAttribute('fill', '#c62828');
                        atom.setAttribute('r', '7');
                    }
                    
                    // 保持连接虚线显示
                    for (let i = 0; i < 12; i++) {
                        const line = document.getElementById('scene2-conn-line-' + i);
                        show(line);
                    }
                    
                    show(coordinationLabel);
                    show(stepHint);
                    prevBtn.disabled = false;
                    nextBtn.textContent = '完成';
                    break;
            }
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            window.scene2CurrentStep = 0;
            updateScene();
            
            document.getElementById('scene2-prev-btn').addEventListener('click', function() {
                if (window.scene2CurrentStep > 0) {
                    window.scene2CurrentStep--;
                    updateScene();
                }
            });
            
            document.getElementById('scene2-next-btn').addEventListener('click', function() {
                if (window.scene2CurrentStep < maxStep) {
                    window.scene2CurrentStep++;
                    updateScene();
                }
            });
        });
    })();
    </script>
</body>
</html>
