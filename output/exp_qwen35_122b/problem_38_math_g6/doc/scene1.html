<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>立体图形对比 - Scene 1</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-svg { width: 800px; height: 500px; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene1-btn { padding: 8px 16px; font-size: 14px; border: 2px solid #333333; border-radius: 4px; background: #ffffff; cursor: pointer; transition: all 0.2s; }
        .scene1-btn:hover:not(:disabled) { background: #f5f5f5; }
        .scene1-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .scene1-step-indicator { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); font-size: 14px; color: #666666; }
        .scene1-label { font-size: 16px; font-weight: bold; }
        .scene1-cube-face { stroke: #000000; stroke-width: 1.5; }
        /* 立方体面样式 */
        .scene1-face-top { fill: #bbdefb; }
        .scene1-face-front { fill: #e3f2fd; }
        .scene1-face-right { fill: #90caf9; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <!-- 左图标签 -->
            <text id="scene1-label-left" class="scene1-label" x="160" y="180" fill="#1565c0" style="display: none;">左图</text>
            
            <!-- 右图标签 -->
            <text id="scene1-label-right" class="scene1-label" x="510" y="180" fill="#c62828" style="display: none;">右图</text>
            
            <!-- 左图立体图形 - 底层 (z=0) -->
            <g id="scene1-left-layer0">
                <!-- 正方体 1: (140,320,0) -->
                <g id="scene1-cube-left-1-0">
                    <polygon class="scene1-cube-face scene1-face-top" points="140,300 160,280 180,300 160,320"/>
                    <polygon class="scene1-cube-face scene1-face-front" points="140,320 180,320 180,360 140,360"/>
                    <polygon class="scene1-cube-face scene1-face-right" points="180,320 200,300 200,340 180,360"/>
                </g>
                <!-- 正方体 2: (180,320,0) -->
                <g id="scene1-cube-left-2-0">
                    <polygon class="scene1-cube-face scene1-face-top" points="180,300 200,280 220,300 200,320"/>
                    <polygon class="scene1-cube-face scene1-face-front" points="180,320 220,320 220,360 180,360"/>
                    <polygon class="scene1-cube-face scene1-face-right" points="220,320 240,300 240,340 220,360"/>
                </g>
                <!-- 正方体 3: (220,320,0) -->
                <g id="scene1-cube-left-3-0">
                    <polygon class="scene1-cube-face scene1-face-top" points="220,300 240,280 260,300 240,320"/>
                    <polygon class="scene1-cube-face scene1-face-front" points="220,320 260,320 260,360 220,360"/>
                    <polygon class="scene1-cube-face scene1-face-right" points="260,320 280,300 280,340 260,360"/>
                </g>
            </g>
            
            <!-- 左图立体图形 - 中层 (z=1) -->
            <g id="scene1-left-layer1">
                <!-- 正方体 4: (140,280,1) -->
                <g id="scene1-cube-left-1-1">
                    <polygon class="scene1-cube-face scene1-face-top" points="140,260 160,240 180,260 160,280"/>
                    <polygon class="scene1-cube-face scene1-face-front" points="140,280 180,280 180,320 140,320"/>
                    <polygon class="scene1-cube-face scene1-face-right" points="180,280 200,260 200,300 180,320"/>
                </g>
                <!-- 正方体 5: (180,280,1) -->
                <g id="scene1-cube-left-2-1">
                    <polygon class="scene1-cube-face scene1-face-top" points="180,260 200,240 220,260 200,280"/>
                    <polygon class="scene1-cube-face scene1-face-front" points="180,280 220,280 220,320 180,320"/>
                    <polygon class="scene1-cube-face scene1-face-right" points="220,280 240,260 240,300 220,320"/>
                </g>
            </g>
            
            <!-- 左图立体图形 - 顶层 (z=2) -->
            <g id="scene1-left-layer2">
                <!-- 正方体 6: (140,240,2) -->
                <g id="scene1-cube-left-1-2">
                    <polygon class="scene1-cube-face scene1-face-top" points="140,220 160,200 180,220 160,240"/>
                    <polygon class="scene1-cube-face scene1-face-front" points="140,240 180,240 180,280 140,280"/>
                    <polygon class="scene1-cube-face scene1-face-right" points="180,240 200,220 200,260 180,280"/>
                </g>
            </g>
            
            <!-- 右图立体图形 - 底层 (z=0) -->
            <g id="scene1-right-layer0" style="display: none;">
                <!-- 正方体 1: (490,320,0) -->
                <g id="scene1-cube-right-1-0">
                    <polygon class="scene1-cube-face scene1-face-top" points="490,300 510,280 530,300 510,320"/>
                    <polygon class="scene1-cube-face scene1-face-front" points="490,320 530,320 530,360 490,360"/>
                    <polygon class="scene1-cube-face scene1-face-right" points="530,320 550,300 550,340 530,360"/>
                </g>
                <!-- 正方体 2: (530,320,0) -->
                <g id="scene1-cube-right-2-0">
                    <polygon class="scene1-cube-face scene1-face-top" points="530,300 550,280 570,300 550,320"/>
                    <polygon class="scene1-cube-face scene1-face-front" points="530,320 570,320 570,360 530,360"/>
                    <polygon class="scene1-cube-face scene1-face-right" points="570,320 590,300 590,340 570,360"/>
                </g>
                <!-- 正方体 3: (570,320,0) -->
                <g id="scene1-cube-right-3-0">
                    <polygon class="scene1-cube-face scene1-face-top" points="570,300 590,280 610,300 590,320"/>
                    <polygon class="scene1-cube-face scene1-face-front" points="570,320 610,320 610,360 570,360"/>
                    <polygon class="scene1-cube-face scene1-face-right" points="610,320 630,300 630,340 610,360"/>
                </g>
            </g>
            
            <!-- 右图立体图形 - 中层 (z=1) -->
            <g id="scene1-right-layer1" style="display: none;">
                <!-- 正方体 4: (490,280,1) -->
                <g id="scene1-cube-right-1-1">
                    <polygon class="scene1-cube-face scene1-face-top" points="490,260 510,240 530,260 510,280"/>
                    <polygon class="scene1-cube-face scene1-face-front" points="490,280 530,280 530,320 490,320"/>
                    <polygon class="scene1-cube-face scene1-face-right" points="530,280 550,260 550,300 530,320"/>
                </g>
                <!-- 正方体 5: (570,280,1) -->
                <g id="scene1-cube-right-3-1">
                    <polygon class="scene1-cube-face scene1-face-top" points="570,260 590,240 610,260 590,280"/>
                    <polygon class="scene1-cube-face scene1-face-front" points="570,280 610,280 610,320 570,320"/>
                    <polygon class="scene1-cube-face scene1-face-right" points="610,280 630,260 630,300 610,320"/>
                </g>
            </g>
            
            <!-- 右图立体图形 - 顶层 (z=2) -->
            <g id="scene1-right-layer2" style="display: none;">
                <!-- 正方体 6: (570,240,2) -->
                <g id="scene1-cube-right-3-2">
                    <polygon class="scene1-cube-face scene1-face-top" points="570,220 590,200 610,220 590,240"/>
                    <polygon class="scene1-cube-face scene1-face-front" points="570,240 610,240 610,280 570,280"/>
                    <polygon class="scene1-cube-face scene1-face-right" points="610,240 630,220 630,260 610,280"/>
                </g>
            </g>
        </svg>
        
        <!-- 步骤指示器 -->
        <div id="scene1-step-indicator" class="scene1-step-indicator">步骤 1/3</div>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn">◀ 上一步</button>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现
        // 布局坐标表：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // |------|------|-----------|------|-------------|------|
        // | 左图立体图形 | 等轴测立方体组合 | 中心点 (200,280) | 约 180×140 | - | 阶梯状，6 个正方体 |
        // | 左图标签 | text | (160,180) | 40×20 | 上方 | 左图标题，蓝色 |
        // | 右图立体图形 | 等轴测立方体组合 | 中心点 (550,280) | 约 180×140 | - | U 型，6 个正方体 |
        // | 右图标签 | text | (510,180) | 40×20 | 上方 | 右图标题，红色 |
        // | 上一步按钮 | button | (320,460) | 80×30 | - | 控件栏左侧 |
        // | 下一步按钮 | button | (440,460) | 80×30 | - | 控件栏右侧 |
        // | 步骤指示器 | text | (380,420) | 60×16 | - | 显示当前步骤 |
        
        const TOTAL_STEPS = 3;
        let currentStep = 0;
        
        // DOM 元素引用
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        const labelLeft = document.getElementById('scene1-label-left');
        const labelRight = document.getElementById('scene1-label-right');
        
        // 左图各层元素
        const leftLayer0 = document.getElementById('scene1-left-layer0');
        const leftLayer1 = document.getElementById('scene1-left-layer1');
        const leftLayer2 = document.getElementById('scene1-left-layer2');
        
        // 右图各层元素
        const rightLayer0 = document.getElementById('scene1-right-layer0');
        const rightLayer1 = document.getElementById('scene1-right-layer1');
        const rightLayer2 = document.getElementById('scene1-right-layer2');
        
        // 工具函数：显示元素
        function show(el) {
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '0';
                setTimeout(() => {
                    el.style.transition = 'opacity 0.3s';
                    el.style.opacity = '1';
                }, 10);
            }
        }
        
        // 工具函数：隐藏元素
        function hide(el) {
            if (el) {
                el.style.transition = 'opacity 0.3s';
                el.style.opacity = '0';
                setTimeout(() => {
                    el.style.display = 'none';
                    el.style.opacity = '1';
                    el.style.transition = '';
                }, 300);
            }
        }
        
        // 更新步骤显示
        function render() {
            // 更新步骤指示器
            stepIndicator.textContent = `步骤 ${currentStep + 1}/${TOTAL_STEPS}`;
            
            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === TOTAL_STEPS - 1);
            
            // 根据步骤显示/隐藏元素
            switch(currentStep) {
                case 0:
                    // 步骤 0：仅显示左图
                    show(leftLayer0);
                    show(leftLayer1);
                    show(leftLayer2);
                    hide(rightLayer0);
                    hide(rightLayer1);
                    hide(rightLayer2);
                    hide(labelLeft);
                    hide(labelRight);
                    break;
                    
                case 1:
                    // 步骤 1：显示左右两图
                    show(leftLayer0);
                    show(leftLayer1);
                    show(leftLayer2);
                    show(rightLayer0);
                    show(rightLayer1);
                    show(rightLayer2);
                    hide(labelLeft);
                    hide(labelRight);
                    break;
                    
                case 2:
                    // 步骤 2：显示两图及标签
                    show(leftLayer0);
                    show(leftLayer1);
                    show(leftLayer2);
                    show(rightLayer0);
                    show(rightLayer1);
                    show(rightLayer2);
                    show(labelLeft);
                    show(labelRight);
                    break;
            }
        }
        
        // 事件绑定
        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                render();
            }
        });
        
        btnNext.addEventListener('click', () => {
            if (currentStep < TOTAL_STEPS - 1) {
                currentStep++;
                render();
            }
        });
        
        // 初始化
        render();
    })();
    </script>
</body>
</html>
