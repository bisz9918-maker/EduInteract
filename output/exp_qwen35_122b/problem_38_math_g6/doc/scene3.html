<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 3 - 从上面观察</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene3-btn {
            padding: 8px 20px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .scene3-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #scene3-prev-btn { background: #1976d2; color: white; }
        #scene3-next-btn { background: #1976d2; color: white; }
        .scene3-option-btn {
            position: absolute;
            width: 100px;
            height: 40px;
            border: 2px solid #888888;
            border-radius: 4px;
            background: #ffffff;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .scene3-option-btn.active {
            border-color: #2e7d32;
            background: #e8f5e9;
        }
        .scene3-option-text {
            position: absolute;
            font-size: 14px;
            color: #000000;
            text-align: center;
            line-height: 40px;
        }
        .scene3-highlight {
            stroke: #2e7d32 !important;
            stroke-width: 3px !important;
        }
        .scene3-highlight-text {
            fill: #2e7d32 !important;
            font-weight: bold !important;
        }
        .scene3-answer-text {
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .scene3-answer-text.visible {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 标题 -->
            <text id="scene3-title" x="400" y="25" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000">从上面观察</text>
            
            <!-- 左图标签 -->
            <text id="scene3-left-label" x="200" y="90" text-anchor="middle" font-size="14" fill="#000000">左图</text>
            
            <!-- 左图俯视图容器 -->
            <rect id="scene3-left-container" x="100" y="100" width="200" height="150" fill="none" stroke="none"/>
            
            <!-- 左图俯视图 - 3 个正方形 -->
            <rect id="scene3-left-square1" x="120" y="120" width="50" height="50" fill="#e3f2fd" stroke="#000000" stroke-width="2"/>
            <rect id="scene3-left-square2" x="170" y="120" width="50" height="50" fill="#e3f2fd" stroke="#000000" stroke-width="2"/>
            <rect id="scene3-left-square3" x="220" y="120" width="50" height="50" fill="#e3f2fd" stroke="#000000" stroke-width="2"/>
            
            <!-- 右图标签 -->
            <text id="scene3-right-label" x="600" y="90" text-anchor="middle" font-size="14" fill="#000000">右图</text>
            
            <!-- 右图俯视图容器 -->
            <rect id="scene3-right-container" x="500" y="100" width="200" height="150" fill="none" stroke="none"/>
            
            <!-- 右图俯视图 - 3 个正方形 -->
            <rect id="scene3-right-square1" x="520" y="120" width="50" height="50" fill="#e3f2fd" stroke="#000000" stroke-width="2"/>
            <rect id="scene3-right-square2" x="570" y="120" width="50" height="50" fill="#e3f2fd" stroke="#000000" stroke-width="2"/>
            <rect id="scene3-right-square3" x="620" y="120" width="50" height="50" fill="#e3f2fd" stroke="#000000" stroke-width="2"/>
            
            <!-- 形状相同标识 -->
            <text id="scene3-same-label" x="400" y="185" text-anchor="middle" font-size="16" fill="#000000">形状相同</text>
            
            <!-- 正确答案文字 -->
            <text id="scene3-answer" x="400" y="405" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e7d32" class="scene3-answer-text">正确答案：C.上面</text>
        </svg>
        
        <!-- 选项按钮 -->
        <div id="scene3-option-a" class="scene3-option-btn" style="left: 150px; top: 320px;"></div>
        <div id="scene3-option-a-text" class="scene3-option-text" style="left: 150px; top: 320px;">A.左面</div>
        
        <div id="scene3-option-b" class="scene3-option-btn" style="left: 350px; top: 320px;"></div>
        <div id="scene3-option-b-text" class="scene3-option-text" style="left: 350px; top: 320px;">B.前面</div>
        
        <div id="scene3-option-c" class="scene3-option-btn" style="left: 550px; top: 320px;"></div>
        <div id="scene3-option-c-text" class="scene3-option-text" style="left: 550px; top: 320px;">C.上面</div>
        
        <!-- 控件栏 -->
        <div id="scene3-controls">
            <button id="scene3-prev-btn" class="scene3-btn" disabled>◀上一步</button>
            <button id="scene3-next-btn" class="scene3-btn">下一步▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 3 实现
        // 布局坐标表：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // |------|------|-----------|------|-------------|------|
        // | 标题 | text | (300,25) | ~200×20 | - | 顶部居中 |
        // | 左图俯视图容器 | rect | (100,100)-(300,250) | 200×150 | - | 左侧视图区域 |
        // | 左图俯视图 - 方块 1 | rect | (120,120)-(170,170) | 50×50 | - | 俯视图左方块 |
        // | 左图俯视图 - 方块 2 | rect | (170,120)-(220,170) | 50×50 | - | 俯视图中方块 |
        // | 左图俯视图 - 方块 3 | rect | (220,120)-(270,170) | 50×50 | - | 俯视图右方块 |
        // | 左图标签 | text | (180,90) | ~40×16 | 上方 | "左图" |
        // | 右图俯视图容器 | rect | (500,100)-(700,250) | 200×150 | - | 右侧视图区域 |
        // | 右图俯视图 - 方块 1 | rect | (520,120)-(570,170) | 50×50 | - | 俯视图左方块 |
        // | 右图俯视图 - 方块 2 | rect | (570,120)-(620,170) | 50×50 | - | 俯视图中方块 |
        // | 右图俯视图 - 方块 3 | rect | (620,120)-(670,170) | 50×50 | - | 俯视图右方块 |
        // | 右图标签 | text | (580,90) | ~40×16 | 上方 | "右图" |
        // | 形状相同标识 | text | (380,185) | ~80×20 | - | 中间连接标识 |
        // | 选项 A 按钮 | rect | (150,320)-(250,360) | 100×40 | - | 左面选项 |
        // | 选项 A 文字 | text | (200,340) | ~60×16 | - | "A.左面" |
        // | 选项 B 按钮 | rect | (350,320)-(450,360) | 100×40 | - | 前面选项 |
        // | 选项 B 文字 | text | (400,340) | ~60×16 | - | "B.前面" |
        // | 选项 C 按钮 | rect | (550,320)-(650,360) | 100×40 | - | 上面选项 |
        // | 选项 C 文字 | text | (600,340) | ~60×16 | - | "C.上面" |
        // | 正确答案文字 | text | (320,405) | ~160×20 | - | "正确答案：C.上面" |
        // | 上一步按钮 | button | (280,450)-(380,480) | 100×30 | - | 控件栏左侧 |
        // | 下一步按钮 | button | (420,450)-(520,480) | 100×30 | - | 控件栏右侧 |

        // 状态变量
        var currentStep = 0;
        var totalSteps = 3;

        // DOM 元素引用
        var prevBtn = document.getElementById('scene3-prev-btn');
        var nextBtn = document.getElementById('scene3-next-btn');
        var answerText = document.getElementById('scene3-answer');
        
        // 左图方块
        var leftSquares = [
            document.getElementById('scene3-left-square1'),
            document.getElementById('scene3-left-square2'),
            document.getElementById('scene3-left-square3')
        ];
        
        // 右图方块
        var rightSquares = [
            document.getElementById('scene3-right-square1'),
            document.getElementById('scene3-right-square2'),
            document.getElementById('scene3-right-square3')
        ];
        
        // 形状相同标识
        var sameLabel = document.getElementById('scene3-same-label');
        
        // 选项按钮
        var optionA = document.getElementById('scene3-option-a');
        var optionB = document.getElementById('scene3-option-b');
        var optionC = document.getElementById('scene3-option-c');

        // 更新按钮状态
        function updateButtonStates() {
            prevBtn.disabled = (currentStep === 0);
            nextBtn.disabled = (currentStep === totalSteps - 1);
        }

        // 更新视图
        function updateView() {
            // 步骤 0：初始状态
            if (currentStep === 0) {
                // 移除所有高亮
                leftSquares.forEach(function(sq) {
                    sq.classList.remove('scene3-highlight');
                });
                rightSquares.forEach(function(sq) {
                    sq.classList.remove('scene3-highlight');
                });
                
                // 恢复形状相同标识颜色
                sameLabel.classList.remove('scene3-highlight-text');
                
                // 移除选项高亮
                optionA.classList.remove('active');
                optionB.classList.remove('active');
                optionC.classList.remove('active');
                
                // 隐藏正确答案
                answerText.classList.remove('visible');
            }
            
            // 步骤 1：高亮显示
            if (currentStep >= 1) {
                // 高亮左图方块
                leftSquares.forEach(function(sq) {
                    sq.classList.add('scene3-highlight');
                });
                
                // 高亮右图方块
                rightSquares.forEach(function(sq) {
                    sq.classList.add('scene3-highlight');
                });
                
                // 高亮形状相同标识
                sameLabel.classList.add('scene3-highlight-text');
                
                // 高亮选项 C
                optionC.classList.add('active');
            }
            
            // 步骤 2：显示正确答案
            if (currentStep >= 2) {
                answerText.classList.add('visible');
            }
            
            updateButtonStates();
        }

        // 上一步按钮点击
        prevBtn.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateView();
            }
        });

        // 下一步按钮点击
        nextBtn.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateView();
            }
        });

        // 初始化视图
        updateView();
    })();
    </script>
</body>
</html>
