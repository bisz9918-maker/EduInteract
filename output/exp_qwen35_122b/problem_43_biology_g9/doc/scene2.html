<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>昆虫生长发育阶段 - 完全变态与不完全变态发育对比</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene2-btn { padding: 8px 16px; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; font-weight: bold; transition: all 0.3s ease; }
        .scene2-btn:hover { transform: scale(1.05); }
        .scene2-btn.active { box-shadow: 0 0 10px rgba(0,0,0,0.3); }
        #scene2-btn-1 { background: #1565c0; color: white; }
        #scene2-btn-1.active { background: #0d47a1; }
        #scene2-btn-2 { background: #c62828; color: white; }
        #scene2-btn-2.active { background: #b71c1c; }
        #scene2-btn-3 { background: #2e7d32; color: white; }
        #scene2-btn-3.active { background: #1b5e20; }
        .scene2-ellipse { transition: opacity 0.3s ease, fill 0.3s ease; }
        .scene2-arrow { transition: opacity 0.3s ease; }
        .scene2-text { transition: opacity 0.3s ease; }
        .scene2-highlight { filter: drop-shadow(0 0 5px #4caf50); }
        .scene2-pupa-label { opacity: 0; transition: opacity 0.3s ease; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- 箭头标记定义 -->
                <marker id="scene2-arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#1565c0" />
                </marker>
                <marker id="scene2-arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#c62828" />
                </marker>
            </defs>

            <!-- 左侧完全变态发育区域 -->
            <text id="scene2-title-left" class="scene2-text" x="200" y="45" text-anchor="middle" font-size="18" font-weight="bold" fill="#1565c0">完全变态发育</text>
            
            <!-- 左侧四阶段椭圆 -->
            <ellipse id="scene2-ellipse-left-A" class="scene2-ellipse" cx="200" cy="115" rx="15" ry="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
            <text id="scene2-label-left-A" class="scene2-text" x="200" y="90" text-anchor="middle" font-size="14" fill="#1565c0">A(卵)</text>
            
            <ellipse id="scene2-ellipse-left-B" class="scene2-ellipse" cx="120" cy="215" rx="20" ry="12.5" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
            <text id="scene2-label-left-B" class="scene2-text" x="75" y="220" text-anchor="middle" font-size="14" fill="#1565c0">B(幼虫)</text>
            
            <ellipse id="scene2-ellipse-left-D" class="scene2-ellipse" cx="200" cy="315" rx="15" ry="12.5" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
            <text id="scene2-label-left-D" class="scene2-text" x="200" y="345" text-anchor="middle" font-size="14" fill="#1565c0">D(蛹)</text>
            
            <ellipse id="scene2-ellipse-left-C" class="scene2-ellipse" cx="280" cy="215" rx="20" ry="12.5" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
            <text id="scene2-label-left-C" class="scene2-text" x="325" y="220" text-anchor="middle" font-size="14" fill="#1565c0">C(成虫)</text>
            
            <!-- 左侧四箭头 -->
            <path id="scene2-arrow-left-AB" class="scene2-arrow" d="M185,130 L135,200" stroke="#1565c0" stroke-width="2" fill="none" marker-end="url(#scene2-arrow-blue)"/>
            <path id="scene2-arrow-left-BD" class="scene2-arrow" d="M135,240 L185,290" stroke="#1565c0" stroke-width="2" fill="none" marker-end="url(#scene2-arrow-blue)"/>
            <path id="scene2-arrow-left-DC" class="scene2-arrow" d="M215,300 L265,230" stroke="#1565c0" stroke-width="2" fill="none" marker-end="url(#scene2-arrow-blue)"/>
            <path id="scene2-arrow-left-CA" class="scene2-arrow" d="M265,200 L215,130" stroke="#1565c0" stroke-width="2" fill="none" marker-end="url(#scene2-arrow-blue)"/>
            
            <!-- 左侧实例标签和关键提示 -->
            <text id="scene2-example-left" class="scene2-text" x="200" y="365" text-anchor="middle" font-size="14" fill="#333">例：蚊、家蚕</text>
            <text id="scene2-hint-left" class="scene2-text" x="200" y="400" text-anchor="middle" font-size="14" fill="#2e7d32" font-weight="bold">家蚕吐丝在幼虫期(B)</text>
            
            <!-- 右侧不完全变态发育区域 -->
            <text id="scene2-title-right" class="scene2-text" x="600" y="45" text-anchor="middle" font-size="18" font-weight="bold" fill="#c62828">不完全变态发育</text>
            
            <!-- 右侧三阶段椭圆 -->
            <ellipse id="scene2-ellipse-right-A" class="scene2-ellipse" cx="600" cy="165" rx="15" ry="10" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
            <text id="scene2-label-right-A" class="scene2-text" x="600" y="140" text-anchor="middle" font-size="14" fill="#c62828">A(卵)</text>
            
            <ellipse id="scene2-ellipse-right-B" class="scene2-ellipse" cx="520" cy="295" rx="20" ry="12.5" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
            <text id="scene2-label-right-B" class="scene2-text" x="470" y="300" text-anchor="middle" font-size="14" fill="#c62828">B(若虫)</text>
            
            <ellipse id="scene2-ellipse-right-C" class="scene2-ellipse" cx="680" cy="295" rx="20" ry="12.5" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
            <text id="scene2-label-right-C" class="scene2-text" x="725" y="300" text-anchor="middle" font-size="14" fill="#c62828">C/D(成虫)</text>
            
            <!-- 右侧三箭头 -->
            <path id="scene2-arrow-right-AB" class="scene2-arrow" d="M585,180 L535,270" stroke="#c62828" stroke-width="2" fill="none" marker-end="url(#scene2-arrow-red)"/>
            <path id="scene2-arrow-right-BC" class="scene2-arrow" d="M555,295 L655,295" stroke="#c62828" stroke-width="2" fill="none" marker-end="url(#scene2-arrow-red)"/>
            <path id="scene2-arrow-right-CA" class="scene2-arrow" d="M665,280 L615,190" stroke="#c62828" stroke-width="2" fill="none" marker-end="url(#scene2-arrow-red)"/>
            
            <!-- 右侧实例标签 -->
            <text id="scene2-example-right" class="scene2-text" x="600" y="365" text-anchor="middle" font-size="14" fill="#333">例：蝗虫、蟋蟀</text>
            
            <!-- 中间分隔线 -->
            <line id="scene2-divider" class="scene2-text" x1="400" y1="65" x2="400" y2="415" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
            
            <!-- 对比模式额外标注 -->
            <rect id="scene2-pupa-highlight" class="scene2-pupa-label" x="180" y="295" width="40" height="40" fill="none" stroke="#4caf50" stroke-width="3" stroke-dasharray="5,3"/>
            <text id="scene2-pupa-note" class="scene2-pupa-label" x="200" y="430" text-anchor="middle" font-size="12" fill="#4caf50" font-weight="bold">关键：完全变态有蛹期</text>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-btn-1" class="scene2-btn active">完全变态发育</button>
            <button id="scene2-btn-2" class="scene2-btn">不完全变态发育</button>
            <button id="scene2-btn-3" class="scene2-btn">对比模式</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现 - 完全变态与不完全变态发育对比
        
        // 状态变量
        var currentState = 0; // 0=完全变态, 1=不完全变态, 2=对比模式
        
        // 元素分组
        var leftElements = [
            'scene2-title-left',
            'scene2-ellipse-left-A', 'scene2-label-left-A',
            'scene2-ellipse-left-B', 'scene2-label-left-B',
            'scene2-ellipse-left-D', 'scene2-label-left-D',
            'scene2-ellipse-left-C', 'scene2-label-left-C',
            'scene2-arrow-left-AB', 'scene2-arrow-left-BD', 'scene2-arrow-left-DC', 'scene2-arrow-left-CA',
            'scene2-example-left', 'scene2-hint-left'
        ];
        
        var rightElements = [
            'scene2-title-right',
            'scene2-ellipse-right-A', 'scene2-label-right-A',
            'scene2-ellipse-right-B', 'scene2-label-right-B',
            'scene2-ellipse-right-C', 'scene2-label-right-C',
            'scene2-arrow-right-AB', 'scene2-arrow-right-BC', 'scene2-arrow-right-CA',
            'scene2-example-right'
        ];
        
        var dividerElement = 'scene2-divider';
        var pupaHighlightElements = ['scene2-pupa-highlight', 'scene2-pupa-note'];
        
        // 工具函数：显示元素
        function show(elId) {
            var el = document.getElementById(elId);
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }
        
        // 工具函数：隐藏元素
        function hide(elId) {
            var el = document.getElementById(elId);
            if (el) {
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }
        
        // 工具函数：设置元素透明度
        function setOpacity(elId, opacity) {
            var el = document.getElementById(elId);
            if (el) {
                el.style.opacity = opacity;
            }
        }
        
        // 更新显示状态
        function updateDisplay() {
            // 重置所有元素
            leftElements.forEach(function(id) { hide(id); });
            rightElements.forEach(function(id) { hide(id); });
            hide(dividerElement);
            pupaHighlightElements.forEach(function(id) { hide(id); });
            
            // 根据状态显示对应元素
            if (currentState === 0) {
                // 完全变态发育
                leftElements.forEach(function(id) { show(id); });
                setOpacity('scene2-ellipse-left-A', 0.2);
                setOpacity('scene2-ellipse-left-B', 0.2);
                setOpacity('scene2-ellipse-left-D', 0.2);
                setOpacity('scene2-ellipse-left-C', 0.2);
            } else if (currentState === 1) {
                // 不完全变态发育
                rightElements.forEach(function(id) { show(id); });
                setOpacity('scene2-ellipse-right-A', 0.2);
                setOpacity('scene2-ellipse-right-B', 0.2);
                setOpacity('scene2-ellipse-right-C', 0.2);
            } else if (currentState === 2) {
                // 对比模式
                leftElements.forEach(function(id) { show(id); });
                rightElements.forEach(function(id) { show(id); });
                show(dividerElement);
                pupaHighlightElements.forEach(function(id) { show(id); });
                setOpacity('scene2-ellipse-left-A', 0.2);
                setOpacity('scene2-ellipse-left-B', 0.2);
                setOpacity('scene2-ellipse-left-D', 0.2);
                setOpacity('scene2-ellipse-left-C', 0.2);
                setOpacity('scene2-ellipse-right-A', 0.2);
                setOpacity('scene2-ellipse-right-B', 0.2);
                setOpacity('scene2-ellipse-right-C', 0.2);
            }
            
            // 更新按钮状态
            document.getElementById('scene2-btn-1').classList.toggle('active', currentState === 0);
            document.getElementById('scene2-btn-2').classList.toggle('active', currentState === 1);
            document.getElementById('scene2-btn-3').classList.toggle('active', currentState === 2);
        }
        
        // 状态切换函数
        function setState(newState) {
            if (currentState !== newState) {
                currentState = newState;
                updateDisplay();
            }
        }
        
        // 初始化
        function init() {
            // 绑定按钮事件
            document.getElementById('scene2-btn-1').addEventListener('click', function() {
                setState(0);
            });
            document.getElementById('scene2-btn-2').addEventListener('click', function() {
                setState(1);
            });
            document.getElementById('scene2-btn-3').addEventListener('click', function() {
                setState(2);
            });
            
            // 初始显示完全变态发育
            setState(0);
        }
        
        // 页面加载完成后初始化
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>
</body>
</html>
