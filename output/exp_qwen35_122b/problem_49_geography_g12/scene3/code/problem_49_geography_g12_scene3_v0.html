<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 3 - 正午太阳高度角计算</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene3-controls button { padding: 8px 20px; font-size: 14px; cursor: pointer; border: 1px solid #333; border-radius: 4px; background: #f5f5f5; }
        #scene3-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene3-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene3-element { transition: opacity 0.3s ease; }
        .scene3-fade-in { animation: scene3FadeIn 0.3s ease; }
        @keyframes scene3FadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 公式标题 - 调整 y 坐标从 30 改为 50，确保顶部边缘有足够间距 (≥20px) -->
            <text id="scene3-title" class="scene3-element" x="400" y="50" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000">正午太阳高度角计算</text>
            
            <!-- 公式主体 - 调整 y 坐标从 70 改为 95，确保与标题间距≥12px (95-50=45px，减去字体高度约 18px，实际间距约 27px) -->
            <text id="scene3-formula" class="scene3-element" x="400" y="95" text-anchor="middle" font-size="24" fill="#000000">H = 90° - |φ - δ|</text>
            
            <!-- 地球轮廓 -->
            <circle id="scene3-earth" class="scene3-element" cx="200" cy="280" r="100" fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 赤道线 -->
            <line id="scene3-equator" class="scene3-element" x1="100" y1="280" x2="300" y2="280" stroke="#000000" stroke-width="1"/>
            
            <!-- 地轴 -->
            <line id="scene3-axis" class="scene3-element" x1="200" y1="180" x2="200" y2="380" stroke="#000000" stroke-width="1"/>
            
            <!-- 太阳直射点 -->
            <circle id="scene3-sun-point" class="scene3-element" cx="320" cy="320" r="8" fill="#c62828" opacity="0"/>
            <text id="scene3-sun-point-label" class="scene3-element" x="335" y="325" font-size="12" fill="#c62828" opacity="0">20°S</text>
            
            <!-- 观测点 -->
            <circle id="scene3-obs-point" class="scene3-element" cx="260" cy="240" r="8" fill="#1565c0" opacity="0"/>
            <!-- 观测点标签 - 调整位置到点正上方 (260,175)，确保与圆 (260,240,r=8) 不重叠 -->
            <text id="scene3-obs-point-label" class="scene3-element" x="260" y="175" text-anchor="middle" font-size="12" fill="#1565c0" opacity="0">30.5°N</text>
            
            <!-- 直射点纬度线 -->
            <line id="scene3-latitude-sun" class="scene3-element" x1="200" y1="320" x2="380" y2="320" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" opacity="0"/>
            
            <!-- 观测点纬度线 -->
            <line id="scene3-latitude-obs" class="scene3-element" x1="200" y1="240" x2="340" y2="240" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" opacity="0"/>
            
            <!-- 纬度差弧线 - 调整位置到地球左侧空白区 (150,280) 到 (150,320)，避免与地球圆重叠 -->
            <path id="scene3-latitude-diff" class="scene3-element" d="M 150 280 Q 130 300 150 320" fill="none" stroke="#888888" stroke-width="2" opacity="0"/>
            
            <!-- 纬度差标签 - 调整位置到地球左侧 (60,300)，确保与地球圆 (200,280,r=100) 左边缘 x=100 不重叠 -->
            <!-- 地球左边缘 x=100，标签需要向左偏移，放在 x=60 位置，使用 text-anchor="end" -->
            <text id="scene3-latitude-diff-label" class="scene3-element" x="60" y="300" text-anchor="end" font-size="14" fill="#888888" opacity="0">|φ-δ| = 50.5°</text>
            
            <!-- 步骤文本区 -->
            <text id="scene3-step-0" class="scene3-element" x="380" y="200" font-size="16" fill="#000000" opacity="0">步骤 0: H = 90° - |φ - δ|</text>
            <text id="scene3-step-1" class="scene3-element" x="380" y="240" font-size="16" fill="#000000" opacity="0">步骤 1: 已知 φ = 30.5°N，δ = 20°S</text>
            <text id="scene3-step-2" class="scene3-element" x="380" y="280" font-size="16" fill="#000000" opacity="0">步骤 2: H = 90° - |30.5° - (-20°)|</text>
            <text id="scene3-step-3" class="scene3-element" x="380" y="320" font-size="16" fill="#000000" opacity="0">步骤 3: H = 90° - 50.5° = 39.5°</text>
            <text id="scene3-step-4" class="scene3-element" x="380" y="360" font-size="16" fill="#000000" opacity="0">步骤 4: 地方时：114.5°E 与 120°E 相差 22 分钟</text>
            
            <!-- 结果框 - 调整 y 坐标从 400 改为 415，增加高度到 50，确保内边距充足 -->
            <rect id="scene3-result-box" class="scene3-element" x="550" y="415" width="200" height="50" fill="#ffffff" stroke="#2e7d32" stroke-width="3" opacity="0"/>
            <!-- 结果文本 - 调整 y 坐标到框内居中位置 (445)，确保与边框间距≥15px -->
            <text id="scene3-result-text" class="scene3-element" x="650" y="445" text-anchor="middle" font-size="20" font-weight="bold" fill="#2e7d32" opacity="0">H = 39.5°</text>
            
            <!-- 纬度差箭头（步骤 2 动画） -->
            <line id="scene3-latitude-arrow" class="scene3-element" x1="260" y1="240" x2="320" y2="320" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" opacity="0"/>
            <polygon id="scene3-latitude-arrow-head" class="scene3-element" points="320,320 310,310 315,315" fill="#888888" opacity="0"/>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene3-controls">
            <button id="scene3-btn-prev">◀ 上一步</button>
            <button id="scene3-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 3 实现 - 正午太阳高度角计算
        
        const MAX_STEP = 4;
        let currentStep = 0;
        
        // 元素 ID 映射
        const elements = {
            title: 'scene3-title',
            formula: 'scene3-formula',
            earth: 'scene3-earth',
            equator: 'scene3-equator',
            axis: 'scene3-axis',
            sunPoint: 'scene3-sun-point',
            sunPointLabel: 'scene3-sun-point-label',
            obsPoint: 'scene3-obs-point',
            obsPointLabel: 'scene3-obs-point-label',
            latitudeSun: 'scene3-latitude-sun',
            latitudeObs: 'scene3-latitude-obs',
            latitudeDiff: 'scene3-latitude-diff',
            latitudeDiffLabel: 'scene3-latitude-diff-label',
            step0: 'scene3-step-0',
            step1: 'scene3-step-1',
            step2: 'scene3-step-2',
            step3: 'scene3-step-3',
            step4: 'scene3-step-4',
            resultBox: 'scene3-result-box',
            resultText: 'scene3-result-text',
            latitudeArrow: 'scene3-latitude-arrow',
            latitudeArrowHead: 'scene3-latitude-arrow-head'
        };
        
        // 步骤配置：每个步骤需要显示/隐藏的元素
        const steps = [
            // 步骤 0：初始状态 - 公式和地球轮廓
            {
                show: ['title', 'formula', 'earth', 'equator', 'axis'],
                hide: ['sunPoint', 'sunPointLabel', 'obsPoint', 'obsPointLabel', 'latitudeSun', 'latitudeObs', 'latitudeDiff', 'latitudeDiffLabel', 'step0', 'step1', 'step2', 'step3', 'step4', 'resultBox', 'resultText', 'latitudeArrow', 'latitudeArrowHead']
            },
            // 步骤 1：显示太阳直射点和观测点
            {
                show: ['title', 'formula', 'earth', 'equator', 'axis', 'sunPoint', 'sunPointLabel', 'obsPoint', 'obsPointLabel', 'latitudeSun', 'latitudeObs', 'step0', 'step1'],
                hide: ['latitudeDiff', 'latitudeDiffLabel', 'step2', 'step3', 'step4', 'resultBox', 'resultText', 'latitudeArrow', 'latitudeArrowHead']
            },
            // 步骤 2：显示纬度差计算
            {
                show: ['title', 'formula', 'earth', 'equator', 'axis', 'sunPoint', 'sunPointLabel', 'obsPoint', 'obsPointLabel', 'latitudeSun', 'latitudeObs', 'latitudeDiff', 'latitudeDiffLabel', 'step0', 'step1', 'step2', 'latitudeArrow', 'latitudeArrowHead'],
                hide: ['step3', 'step4', 'resultBox', 'resultText']
            },
            // 步骤 3：显示计算结果
            {
                show: ['title', 'formula', 'earth', 'equator', 'axis', 'sunPoint', 'sunPointLabel', 'obsPoint', 'obsPointLabel', 'latitudeSun', 'latitudeObs', 'latitudeDiff', 'latitudeDiffLabel', 'step0', 'step1', 'step2', 'step3', 'latitudeArrow', 'latitudeArrowHead', 'resultBox', 'resultText'],
                hide: ['step4']
            },
            // 步骤 4：完整状态
            {
                show: ['title', 'formula', 'earth', 'equator', 'axis', 'sunPoint', 'sunPointLabel', 'obsPoint', 'obsPointLabel', 'latitudeSun', 'latitudeObs', 'latitudeDiff', 'latitudeDiffLabel', 'step0', 'step1', 'step2', 'step3', 'step4', 'resultBox', 'resultText', 'latitudeArrow', 'latitudeArrowHead'],
                hide: []
            }
        ];
        
        // 显示元素
        function showElement(key) {
            const el = document.getElementById(elements[key]);
            if (el) {
                el.style.opacity = '1';
                el.style.display = 'block';
                el.classList.add('scene3-fade-in');
            }
        }
        
        // 隐藏元素
        function hideElement(key) {
            const el = document.getElementById(elements[key]);
            if (el) {
                el.style.opacity = '0';
                el.style.display = 'none';
                el.classList.remove('scene3-fade-in');
            }
        }
        
        // 渲染当前步骤
        function renderStep() {
            const step = steps[currentStep];
            
            // 先隐藏所有可能需要的元素
            step.hide.forEach(key => hideElement(key));
            
            // 再显示当前步骤需要的元素
            step.show.forEach(key => showElement(key));
            
            // 更新按钮状态
            const prevBtn = document.getElementById('scene3-btn-prev');
            const nextBtn = document.getElementById('scene3-btn-next');
            
            prevBtn.disabled = (currentStep === 0);
            
            if (currentStep === MAX_STEP) {
                nextBtn.textContent = '完成';
                nextBtn.disabled = true;
            } else {
                nextBtn.textContent = '下一步 ▶';
                nextBtn.disabled = false;
            }
        }
        
        // 下一步
        function nextStep() {
            if (currentStep < MAX_STEP) {
                currentStep++;
                renderStep();
            }
        }
        
        // 上一步
        function prevStep() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        }
        
        // 初始化
        function init() {
            // 绑定按钮事件
            document.getElementById('scene3-btn-prev').addEventListener('click', prevStep);
            document.getElementById('scene3-btn-next').addEventListener('click', nextStep);
            
            // 初始渲染
            renderStep();
        }
        
        // 页面加载完成后初始化
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>
</body>
</html>
