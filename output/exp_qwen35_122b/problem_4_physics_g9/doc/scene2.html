<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 电路改造对比（串联与并联）</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Microsoft YaHei', sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; gap: 15px; z-index: 10; }
        #scene2-status { position: absolute; bottom: 55px; left: 50%; transform: translateX(-50%); font-size: 16px; font-weight: bold; color: #1565c0; z-index: 10; }
        .scene2-btn { padding: 8px 16px; font-size: 14px; border: 2px solid #1565c0; border-radius: 6px; background: #ffffff; color: #1565c0; cursor: pointer; transition: all 0.3s; font-family: 'Microsoft YaHei', sans-serif; }
        .scene2-btn:hover { background: #e3f2fd; }
        .scene2-btn.active { background: #1565c0; color: #ffffff; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" id="scene2-svg">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene2-arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
                    <polygon points="0,0 10,5 0,10" fill="#1565c0" />
                </marker>
            </defs>
            
            <!-- 电池组 -->
            <g id="scene2-battery-group">
                <rect x="80" y="60" width="180" height="50" fill="#cccccc" stroke="#333333" stroke-width="2" rx="5"/>
                <circle cx="80" cy="85" r="8" fill="#666666"/>
                <circle cx="260" cy="85" r="8" fill="#ff9800"/>
                <!-- 正负极标签向外偏移，远离圆形和导线 -->
                <text x="50" y="90" font-size="14" fill="#333333" font-weight="bold">−</text>
                <text x="325" y="90" font-size="14" fill="#333333" font-weight="bold">+</text>
                <text x="170" y="45" font-size="14" fill="#333333" text-anchor="middle">电池</text>
            </g>
            
            <!-- 开关 S -->
            <g id="scene2-switch-group">
                <rect x="80" y="360" width="100" height="40" fill="#eeeeee" stroke="#333333" stroke-width="2" rx="3"/>
                <circle cx="80" cy="380" r="6" fill="#666666"/>
                <circle cx="180" cy="380" r="6" fill="#666666"/>
                <!-- 开关触点（可动） -->
                <line x1="80" y1="380" x2="160" y2="365" stroke="#666666" stroke-width="3" id="scene2-switch-arm"/>
                <text x="130" y="350" font-size="14" fill="#333333" text-anchor="middle" font-weight="bold">S</text>
            </g>
            
            <!-- 灯泡 L2 -->
            <g id="scene2-lamp2-group">
                <!-- 发光效果（初始隐藏） -->
                <circle cx="550" cy="140" r="55" fill="#2e7d32" opacity="0" id="scene2-lamp2-glow"/>
                <!-- 灯泡玻璃泡 -->
                <circle cx="550" cy="140" r="35" fill="#ffffff" fill-opacity="0.15" stroke="#666666" stroke-width="2"/>
                <!-- 灯丝 -->
                <path d="M 535,140 Q 542,125 550,140 Q 558,155 565,140" stroke="#ff9800" stroke-width="2" fill="none"/>
                <!-- 灯座 -->
                <rect x="535" y="155" width="30" height="15" fill="#888888" stroke="#333333" stroke-width="1"/>
                <!-- 接线柱 -->
                <circle cx="510" cy="140" r="6" fill="#666666" id="scene2-terminal-C"/>
                <circle cx="590" cy="140" r="6" fill="#666666" id="scene2-terminal-D"/>
                <!-- 接线柱标签（向外偏移更多，远离导线 a） -->
                <text x="425" y="145" font-size="12" fill="#333333">C</text>
                <text x="620" y="145" font-size="12" fill="#333333">D</text>
                <!-- 灯泡标签（向上偏移更多，远离导线） -->
                <text x="550" y="80" font-size="14" fill="#333333" text-anchor="middle" font-weight="bold">L₂</text>
            </g>
            
            <!-- 灯泡 L1 -->
            <g id="scene2-lamp1-group">
                <!-- 发光效果（初始隐藏） -->
                <circle cx="550" cy="320" r="55" fill="#2e7d32" opacity="0" id="scene2-lamp1-glow"/>
                <!-- 灯泡玻璃泡 -->
                <circle cx="550" cy="320" r="35" fill="#ffffff" fill-opacity="0.15" stroke="#666666" stroke-width="2"/>
                <!-- 灯丝 -->
                <path d="M 535,320 Q 542,305 550,320 Q 558,335 565,320" stroke="#ff9800" stroke-width="2" fill="none"/>
                <!-- 灯座 -->
                <rect x="535" y="335" width="30" height="15" fill="#888888" stroke="#333333" stroke-width="1"/>
                <!-- 接线柱 -->
                <circle cx="510" cy="320" r="6" fill="#666666" id="scene2-terminal-A"/>
                <circle cx="590" cy="320" r="6" fill="#666666" id="scene2-terminal-B"/>
                <!-- 接线柱标签（向外偏移更多，远离导线 a） -->
                <text x="425" y="325" font-size="12" fill="#333333">A</text>
                <text x="620" y="325" font-size="12" fill="#333333">B</text>
                <!-- 灯泡标签（向上偏移更多） -->
                <text x="550" y="260" font-size="14" fill="#333333" text-anchor="middle" font-weight="bold">L₁</text>
            </g>
            
            <!-- 导线：电池正极 → D（调整起点避开 + 标签） -->
            <line x1="260" y1="75" x2="590" y2="140" stroke="#000000" stroke-width="2" id="scene2-wire-positive-to-D"/>
            
            <!-- 导线 b：D → B（垂直） -->
            <line x1="590" y1="140" x2="590" y2="320" stroke="#000000" stroke-width="2" id="scene2-wire-b"/>
            <text x="625" y="235" font-size="12" fill="#333333" id="scene2-label-b">b</text>
            
            <!-- 导线 a：C → A（垂直，调整位置避开 C、A 标签） -->
            <line x1="490" y1="140" x2="490" y2="320" stroke="#000000" stroke-width="2" id="scene2-wire-a"/>
            <text x="450" y="235" font-size="12" fill="#333333" id="scene2-label-a">a</text>
            
            <!-- 导线 M：B → 开关右接线柱（原位置） -->
            <line x1="590" y1="320" x2="180" y2="380" stroke="#000000" stroke-width="2" id="scene2-wire-m-original"/>
            <!-- 导线 M 标签向上偏移更多，远离导线 -->
            <text x="385" y="310" font-size="12" fill="#333333" id="scene2-label-m">M</text>
            
            <!-- 导线 M 新位置：A → 开关右接线柱（并联改造用） -->
            <line x1="490" y1="320" x2="180" y2="380" stroke="#000000" stroke-width="2" opacity="0" id="scene2-wire-m-new"/>
            
            <!-- 导线：开关左接线柱 → 电池负极 -->
            <line x1="80" y1="380" x2="80" y2="85" stroke="#000000" stroke-width="2" id="scene2-wire-switch-to-negative"/>
            
            <!-- 电流箭头组（初始隐藏） -->
            <g id="scene2-current-arrows" opacity="0">
                <!-- 状态 1 串联电流路径箭头 -->
                <polygon points="590,145 600,140 590,135" fill="#1565c0" id="scene2-arrow-1"/>
                <polygon points="490,145 500,140 490,135" fill="#1565c0" id="scene2-arrow-2"/>
                <polygon points="495,230 500,235 495,240" fill="#1565c0" id="scene2-arrow-3"/>
                <polygon points="495,315 500,320 495,325" fill="#1565c0" id="scene2-arrow-4"/>
                <polygon points="585,320 595,325 585,330" fill="#1565c0" id="scene2-arrow-5"/>
                <polygon points="385,350 395,355 385,360" fill="#1565c0" id="scene2-arrow-6"/>
                <polygon points="185,380 195,385 185,390" fill="#1565c0" id="scene2-arrow-7"/>
                <polygon points="85,235 95,240 85,245" fill="#1565c0" id="scene2-arrow-8"/>
                
                <!-- 状态 2 并联电流路径箭头（支路 1） -->
                <polygon points="590,145 600,140 590,135" fill="#1565c0" id="scene2-arrow-p1-1"/>
                <polygon points="490,145 500,140 490,135" fill="#1565c0" id="scene2-arrow-p1-2"/>
                <polygon points="495,230 500,235 495,240" fill="#1565c0" id="scene2-arrow-p1-3"/>
                <polygon points="495,315 500,320 495,325" fill="#1565c0" id="scene2-arrow-p1-4"/>
                <polygon points="355,355 365,360 355,365" fill="#1565c0" id="scene2-arrow-p1-5"/>
                <polygon points="185,380 195,385 185,390" fill="#1565c0" id="scene2-arrow-p1-6"/>
                <polygon points="85,235 95,240 85,245" fill="#1565c0" id="scene2-arrow-p1-7"/>
                
                <!-- 状态 2 并联电流路径箭头（支路 2） -->
                <polygon points="590,145 600,140 590,135" fill="#1565c0" id="scene2-arrow-p2-1"/>
                <polygon points="595,230 600,235 595,240" fill="#1565c0" id="scene2-arrow-p2-2"/>
                <polygon points="585,315 595,320 585,325" fill="#1565c0" id="scene2-arrow-p2-3"/>
            </g>
            
            <!-- 短路警告（状态 0 显示） -->
            <g id="scene2-shortcut-warning" opacity="0">
                <text x="400" y="220" font-size="20" fill="#d32f2f" text-anchor="middle" font-weight="bold">⚠ 短路！</text>
                <text x="400" y="255" font-size="14" fill="#d32f2f" text-anchor="middle">电流不经过灯泡</text>
            </g>
        </svg>
        
        <div id="scene2-status">原电路</div>
        
        <div id="scene2-controls">
            <button class="scene2-btn active" id="scene2-btn-state0">原电路</button>
            <button class="scene2-btn" id="scene2-btn-state1">串联改造</button>
            <button class="scene2-btn" id="scene2-btn-state2">并联改造</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现
        // 布局坐标表（根据原图调整）：
        // 电池组：(80,60)-(260,110) | 左负右正
        // 开关 S：(80,360)-(180,400) | 左下
        // 灯泡 L2：(510,105)-(590,170) | 右上，接线柱 C(510,140), D(590,140)
        // 灯泡 L1：(510,285)-(590,350) | 右下，接线柱 A(510,320), B(590,320)
        // 导线：正极→D, D→B(导线 b), C→A(导线 a), B→开关 (导线 M), 开关→负极
        
        const stateLabels = ['原电路', '串联改造', '并联改造'];
        let currentState = 0;
        
        // 获取 DOM 元素
        const svg = document.getElementById('scene2-svg');
        const statusEl = document.getElementById('scene2-status');
        const btns = [
            document.getElementById('scene2-btn-state0'),
            document.getElementById('scene2-btn-state1'),
            document.getElementById('scene2-btn-state2')
        ];
        
        // 导线元素
        const wireB = document.getElementById('scene2-wire-b');
        const wireMOriginal = document.getElementById('scene2-wire-m-original');
        const wireMNew = document.getElementById('scene2-wire-m-new');
        const labelB = document.getElementById('scene2-label-b');
        const labelM = document.getElementById('scene2-label-m');
        
        // 灯泡发光效果
        const lamp1Glow = document.getElementById('scene2-lamp1-glow');
        const lamp2Glow = document.getElementById('scene2-lamp2-glow');
        
        // 电流箭头组
        const arrowsGroup = document.getElementById('scene2-current-arrows');
        const shortcutWarning = document.getElementById('scene2-shortcut-warning');
        
        // 状态更新函数
        function updateScene(state) {
            currentState = state;
            
            // 更新按钮状态
            btns.forEach((btn, idx) => {
                btn.classList.toggle('active', idx === state);
            });
            
            // 更新状态标签
            statusEl.textContent = stateLabels[state];
            
            // 根据状态更新电路
            switch(state) {
                case 0: // 原电路（短路）
                    // 导线 b 实线
                    wireB.setAttribute('stroke', '#000000');
                    wireB.setAttribute('stroke-dasharray', 'none');
                    wireB.setAttribute('opacity', '1');
                    labelB.setAttribute('opacity', '1');
                    
                    // 导线 M 原位置实线
                    wireMOriginal.setAttribute('stroke', '#000000');
                    wireMOriginal.setAttribute('opacity', '1');
                    labelM.setAttribute('opacity', '1');
                    
                    // 导线 M 新位置隐藏
                    wireMNew.setAttribute('opacity', '0');
                    
                    // 隐藏电流箭头和发光效果
                    arrowsGroup.setAttribute('opacity', '0');
                    lamp1Glow.setAttribute('opacity', '0');
                    lamp2Glow.setAttribute('opacity', '0');
                    
                    // 显示短路警告
                    shortcutWarning.setAttribute('opacity', '1');
                    break;
                    
                case 1: // 串联改造（去掉导线 b）
                    // 导线 b 虚线（移除）
                    wireB.setAttribute('stroke', '#888888');
                    wireB.setAttribute('stroke-dasharray', '5,5');
                    wireB.setAttribute('opacity', '0.5');
                    labelB.setAttribute('opacity', '0.5');
                    
                    // 导线 M 原位置实线
                    wireMOriginal.setAttribute('stroke', '#000000');
                    wireMOriginal.setAttribute('opacity', '1');
                    labelM.setAttribute('opacity', '1');
                    
                    // 导线 M 新位置隐藏
                    wireMNew.setAttribute('opacity', '0');
                    
                    // 显示串联电流箭头
                    arrowsGroup.setAttribute('opacity', '1');
                    // 只显示串联箭头（arrow-1 到 arrow-8）
                    for (let i = 1; i <= 8; i++) {
                        const arrow = document.getElementById(`scene2-arrow-${i}`);
                        if (arrow) arrow.setAttribute('opacity', '1');
                    }
                    // 隐藏并联箭头
                    for (let i = 1; i <= 3; i++) {
                        const arrow1 = document.getElementById(`scene2-arrow-p1-${i}`);
                        const arrow2 = document.getElementById(`scene2-arrow-p2-${i}`);
                        if (arrow1) arrow1.setAttribute('opacity', '0');
                        if (arrow2) arrow2.setAttribute('opacity', '0');
                    }
                    
                    // 灯泡发光
                    lamp1Glow.setAttribute('opacity', '0.3');
                    lamp2Glow.setAttribute('opacity', '0.3');
                    
                    // 隐藏短路警告
                    shortcutWarning.setAttribute('opacity', '0');
                    break;
                    
                case 2: // 并联改造（导线 M 从 B 改接到 A）
                    // 导线 b 恢复实线
                    wireB.setAttribute('stroke', '#000000');
                    wireB.setAttribute('stroke-dasharray', 'none');
                    wireB.setAttribute('opacity', '1');
                    labelB.setAttribute('opacity', '1');
                    
                    // 导线 M 原位置虚线（移除）
                    wireMOriginal.setAttribute('stroke', '#888888');
                    wireMOriginal.setAttribute('stroke-dasharray', '5,5');
                    wireMOriginal.setAttribute('opacity', '0.5');
                    labelM.setAttribute('opacity', '0.5');
                    
                    // 导线 M 新位置实线
                    wireMNew.setAttribute('opacity', '1');
                    
                    // 显示并联电流箭头
                    arrowsGroup.setAttribute('opacity', '1');
                    // 隐藏串联箭头
                    for (let i = 1; i <= 8; i++) {
                        const arrow = document.getElementById(`scene2-arrow-${i}`);
                        if (arrow) arrow.setAttribute('opacity', '0');
                    }
                    // 显示并联支路 1 箭头
                    for (let i = 1; i <= 7; i++) {
                        const arrow = document.getElementById(`scene2-arrow-p1-${i}`);
                        if (arrow) arrow.setAttribute('opacity', '1');
                    }
                    // 显示并联支路 2 箭头
                    for (let i = 1; i <= 3; i++) {
                        const arrow = document.getElementById(`scene2-arrow-p2-${i}`);
                        if (arrow) arrow.setAttribute('opacity', '1');
                    }
                    
                    // 灯泡发光
                    lamp1Glow.setAttribute('opacity', '0.3');
                    lamp2Glow.setAttribute('opacity', '0.3');
                    
                    // 隐藏短路警告
                    shortcutWarning.setAttribute('opacity', '0');
                    break;
            }
        }
        
        // 绑定按钮事件
        btns.forEach((btn, idx) => {
            btn.addEventListener('click', () => {
                updateScene(idx);
            });
        });
        
        // 初始化
        updateScene(0);
    })();
    </script>
</body>
</html>
