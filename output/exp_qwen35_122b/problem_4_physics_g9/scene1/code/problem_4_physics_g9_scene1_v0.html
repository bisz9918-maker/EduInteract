<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电路短路分析 - Scene 1</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 15px; z-index: 10; }
        #scene1-prev-btn, #scene1-next-btn { padding: 8px 20px; font-size: 14px; border: none; border-radius: 4px; cursor: pointer; transition: background 0.2s; }
        #scene1-prev-btn { background: #9e9e9e; color: white; }
        #scene1-prev-btn:hover { background: #757575; }
        #scene1-prev-btn:disabled { background: #bdbdbd; cursor: not-allowed; }
        #scene1-next-btn { background: #1976d2; color: white; }
        #scene1-next-btn:hover { background: #1565c0; }
        #scene1-step-text { font-size: 14px; color: #424242; font-weight: bold; }
        svg { display: block; }
        .wire { transition: stroke 0.3s ease, stroke-width 0.3s ease; }
        .wire-highlight { stroke: #1565c0 !important; stroke-width: 3px !important; }
        .wire-short { stroke: #c62828 !important; stroke-width: 3px !important; }
        .filament { transition: stroke 0.3s ease; }
        .filament-off { stroke: #9e9e9e !important; }
        .bulb-glow { transition: fill 0.3s ease; }
        .bulb-off { fill: #e0e0e0 !important; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <defs>
                <marker id="scene1-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#888888" />
                </marker>
                <marker id="scene1-arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#1565c0" />
                </marker>
                <marker id="scene1-arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#c62828" />
                </marker>
            </defs>

            <!-- 电池组 -->
            <g id="scene1-battery">
                <!-- 电池底座 -->
                <rect x="260" y="40" width="280" height="70" fill="#d7ccc8" rx="5" />
                <!-- 左电池圆柱 -->
                <ellipse cx="310" cy="75" rx="40" ry="25" fill="#efebe9" />
                <rect x="270" y="50" width="80" height="50" fill="#efebe9" />
                <ellipse cx="310" cy="100" rx="40" ry="25" fill="#d7ccc8" />
                <!-- 右电池圆柱 -->
                <ellipse cx="470" cy="75" rx="40" ry="25" fill="#efebe9" />
                <rect x="430" y="50" width="80" height="50" fill="#efebe9" />
                <ellipse cx="470" cy="100" rx="40" ry="25" fill="#d7ccc8" />
                <!-- 负极柱头 -->
                <rect x="250" y="60" width="25" height="35" fill="#757575" rx="3" />
                <!-- 正极柱头 -->
                <rect x="525" y="60" width="25" height="35" fill="#757575" rx="3" />
                <!-- 极性标签 -->
                <text x="245" y="55" font-size="18" font-weight="bold" fill="#000000">−</text>
                <text x="540" y="55" font-size="18" font-weight="bold" fill="#000000">+</text>
            </g>

            <!-- L₂灯泡（右上方） -->
            <g id="scene1-lamp2">
                <!-- 玻璃泡 -->
                <ellipse cx="550" cy="140" rx="30" ry="25" fill="#fff9c4" opacity="0.15" class="bulb-glow" id="scene1-lamp2-glass"/>
                <!-- 灯丝 -->
                <path d="M540,140 L545,135 L550,140 L555,135 L560,140" stroke="#ff6f00" stroke-width="2" fill="none" class="filament" id="scene1-lamp2-filament"/>
                <!-- 底座 -->
                <rect x="530" y="140" width="40" height="40" fill="#bdbdbd" rx="3" />
                <!-- 接线柱 C -->
                <circle cx="510" cy="160" r="6" fill="#424242" id="scene1-terminal-c"/>
                <text x="490" y="165" font-size="14" fill="#000000">C</text>
                <!-- 接线柱 D -->
                <circle cx="590" cy="160" r="6" fill="#424242" id="scene1-terminal-d"/>
                <text x="600" y="165" font-size="14" fill="#000000">D</text>
                <!-- 标签 L₂ -->
                <text x="570" y="120" font-size="16" font-weight="bold" fill="#000000">L₂</text>
            </g>

            <!-- L₁灯泡（下方中央） -->
            <g id="scene1-lamp1">
                <!-- 玻璃泡 -->
                <ellipse cx="400" cy="300" rx="30" ry="25" fill="#fff9c4" opacity="0.15" class="bulb-glow" id="scene1-lamp1-glass"/>
                <!-- 灯丝 -->
                <path d="M390,300 L395,295 L400,300 L405,295 L410,300" stroke="#ff6f00" stroke-width="2" fill="none" class="filament" id="scene1-lamp1-filament"/>
                <!-- 底座 -->
                <rect x="380" y="300" width="40" height="40" fill="#bdbdbd" rx="3" />
                <!-- 接线柱 A -->
                <circle cx="350" cy="320" r="6" fill="#424242" id="scene1-terminal-a"/>
                <text x="330" y="340" font-size="14" fill="#000000">A</text>
                <!-- 接线柱 B -->
                <circle cx="450" cy="320" r="6" fill="#424242" id="scene1-terminal-b"/>
                <text x="460" y="340" font-size="14" fill="#000000">B</text>
                <!-- 标签 L₁ -->
                <text x="380" y="280" font-size="16" font-weight="bold" fill="#000000">L₁</text>
            </g>

            <!-- 开关 S（左下方） -->
            <g id="scene1-switch">
                <!-- 底座 -->
                <rect x="100" y="360" width="120" height="30" fill="#bdbdbd" rx="3" />
                <!-- 左接线点 -->
                <circle cx="120" cy="375" r="5" fill="#424242" id="scene1-switch-left"/>
                <!-- 右接线点 -->
                <circle cx="200" cy="375" r="5" fill="#424242" id="scene1-switch-right"/>
                <!-- 闸刀（初始断开状态） -->
                <line x1="120" y1="375" x2="180" y2="330" stroke="#757575" stroke-width="4" id="scene1-switch-blade" />
                <!-- 开关手柄 -->
                <circle cx="180" cy="330" r="6" fill="#424242" id="scene1-switch-handle" />
                <!-- 标签 S -->
                <text x="155" y="350" font-size="16" font-weight="bold" fill="#000000">S</text>
            </g>

            <!-- 导线 2：电池负极 → 开关左端 -->
            <path d="M262,75 Q230,75 210,120 Q180,200 120,375" stroke="#000000" stroke-width="2" fill="none" class="wire" id="scene1-wire2" />

            <!-- 导线 M：开关右端 → 接线柱 B -->
            <path d="M200,375 Q280,380 380,370 Q420,365 450,320" stroke="#000000" stroke-width="2" fill="none" class="wire" id="scene1-wire-m" />

            <!-- 导线 1：电池正极 → 接线柱 D -->
            <path d="M537,75 Q580,75 610,120 Q620,140 590,160" stroke="#000000" stroke-width="2" fill="none" class="wire" id="scene1-wire1" />

            <!-- 导线 a：接线柱 C → 接线柱 A -->
            <path d="M510,160 Q450,200 400,280 Q370,300 350,320" stroke="#000000" stroke-width="2" fill="none" class="wire" id="scene1-wire-a" />

            <!-- 导线 b：接线柱 D → 接线柱 B -->
            <path d="M590,160 Q580,220 520,280 Q490,300 450,320" stroke="#000000" stroke-width="2" fill="none" class="wire" id="scene1-wire-b" />

            <!-- 导线标签 -->
            <text x="420" y="240" font-size="14" fill="#000000" font-weight="bold">a</text>
            <text x="530" y="270" font-size="14" fill="#000000" font-weight="bold">b</text>
            <text x="280" y="350" font-size="14" fill="#000000" font-weight="bold">M</text>

            <!-- 电流箭头（初始隐藏） -->
            <path d="M537,85 Q550,95 565,115" stroke="#888888" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#scene1-arrow)" opacity="0" id="scene1-arrow1" />
            <path d="M590,160 Q585,190 540,240" stroke="#888888" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#scene1-arrow)" opacity="0" id="scene1-arrow2" />
            <path d="M450,320 Q420,340 350,360 Q280,375 220,375" stroke="#888888" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#scene1-arrow)" opacity="0" id="scene1-arrow3" />

            <!-- 短路警告文字（初始隐藏） -->
            <text x="250" y="440" font-size="16" fill="#c62828" font-weight="bold" opacity="0" id="scene1-warning1">灯泡被短路，无电流通过</text>
            <text x="260" y="465" font-size="18" fill="#c62828" font-weight="bold" opacity="0" id="scene1-warning2">电路短路——选项 B 错误</text>

            <!-- 控件栏 -->
            <div id="scene1-controls">
                <button id="scene1-prev-btn" disabled>◀ 上一步</button>
                <span id="scene1-step-text">步骤 1/5</span>
                <button id="scene1-next-btn">下一步 ▶</button>
            </div>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 1 实现 - 电路短路分析
        // 布局坐标表（参考）：
        // 电池组：(260,40)-(540,110)
        // L₂灯泡：(510,115)-(590,200)，接线柱 C(510,160)、D(590,160)
        // L₁灯泡：(350,275)-(450,360)，接线柱 A(350,320)、B(450,320)
        // 开关 S：(100,360)-(220,390)
        // 导线 2：负极→开关左端
        // 导线 M：开关右端→B
        // 导线 1：正极→D
        // 导线 a：C→A
        // 导线 b：D→B

        const scene1 = {
            currentStep: 0,
            totalSteps: 5,

            // 获取元素
            elements: {
                prevBtn: document.getElementById('scene1-prev-btn'),
                nextBtn: document.getElementById('scene1-next-btn'),
                stepText: document.getElementById('scene1-step-text'),
                switchBlade: document.getElementById('scene1-switch-blade'),
                switchHandle: document.getElementById('scene1-switch-handle'),
                wire1: document.getElementById('scene1-wire1'),
                wireB: document.getElementById('scene1-wire-b'),
                wireM: document.getElementById('scene1-wire-m'),
                wire2: document.getElementById('scene1-wire2'),
                arrow1: document.getElementById('scene1-arrow1'),
                arrow2: document.getElementById('scene1-arrow2'),
                arrow3: document.getElementById('scene1-arrow3'),
                warning1: document.getElementById('scene1-warning1'),
                warning2: document.getElementById('scene1-warning2'),
                lamp1Filament: document.getElementById('scene1-lamp1-filament'),
                lamp2Filament: document.getElementById('scene1-lamp2-filament'),
                lamp1Glass: document.getElementById('scene1-lamp1-glass'),
                lamp2Glass: document.getElementById('scene1-lamp2-glass')
            },

            // 更新场景状态
            updateScene: function() {
                const el = this.elements;
                const step = this.currentStep;

                // 更新按钮状态
                el.prevBtn.disabled = (step === 0);
                el.nextBtn.disabled = (step === this.totalSteps);
                el.stepText.textContent = '步骤 ' + (step + 1) + '/' + this.totalSteps;

                // 步骤 0：初始状态 - 开关断开，无高亮
                if (step === 0) {
                    // 开关断开
                    el.switchBlade.setAttribute('x2', '180');
                    el.switchBlade.setAttribute('y2', '330');
                    el.switchHandle.setAttribute('cx', '180');
                    el.switchHandle.setAttribute('cy', '330');
                    // 所有导线黑色
                    el.wire1.classList.remove('wire-highlight', 'wire-short');
                    el.wireB.classList.remove('wire-highlight', 'wire-short');
                    el.wireM.classList.remove('wire-highlight', 'wire-short');
                    el.wire2.classList.remove('wire-highlight', 'wire-short');
                    // 箭头隐藏
                    el.arrow1.style.opacity = '0';
                    el.arrow2.style.opacity = '0';
                    el.arrow3.style.opacity = '0';
                    // 警告隐藏
                    el.warning1.style.opacity = '0';
                    el.warning2.style.opacity = '0';
                    // 灯泡正常
                    el.lamp1Filament.classList.remove('filament-off');
                    el.lamp2Filament.classList.remove('filament-off');
                    el.lamp1Glass.classList.remove('bulb-off');
                    el.lamp2Glass.classList.remove('bulb-off');
                }
                // 步骤 1：开关闭合，高亮正极→D
                else if (step === 1) {
                    // 开关闭合
                    el.switchBlade.setAttribute('x2', '200');
                    el.switchBlade.setAttribute('y2', '365');
                    el.switchHandle.setAttribute('cx', '200');
                    el.switchHandle.setAttribute('cy', '365');
                    // 高亮导线 1（蓝色）
                    el.wire1.classList.add('wire-highlight');
                    el.wireB.classList.remove('wire-highlight', 'wire-short');
                    el.wireM.classList.remove('wire-highlight', 'wire-short');
                    el.wire2.classList.remove('wire-highlight', 'wire-short');
                    // 显示箭头 1
                    el.arrow1.style.opacity = '1';
                    el.arrow2.style.opacity = '0';
                    el.arrow3.style.opacity = '0';
                    // 警告隐藏
                    el.warning1.style.opacity = '0';
                    el.warning2.style.opacity = '0';
                    // 灯泡正常
                    el.lamp1Filament.classList.remove('filament-off');
                    el.lamp2Filament.classList.remove('filament-off');
                    el.lamp1Glass.classList.remove('bulb-off');
                    el.lamp2Glass.classList.remove('bulb-off');
                }
                // 步骤 2：高亮导线 b（D→B，红色短路路径）
                else if (step === 2) {
                    // 开关保持闭合
                    el.switchBlade.setAttribute('x2', '200');
                    el.switchBlade.setAttribute('y2', '365');
                    el.switchHandle.setAttribute('cx', '200');
                    el.switchHandle.setAttribute('cy', '365');
                    // 高亮导线 b（红色）
                    el.wire1.classList.add('wire-highlight');
                    el.wireB.classList.add('wire-short');
                    el.wireM.classList.remove('wire-highlight', 'wire-short');
                    el.wire2.classList.remove('wire-highlight', 'wire-short');
                    // 显示箭头 1 和 2
                    el.arrow1.style.opacity = '1';
                    el.arrow2.style.opacity = '1';
                    el.arrow3.style.opacity = '0';
                    // 警告隐藏
                    el.warning1.style.opacity = '0';
                    el.warning2.style.opacity = '0';
                    // 灯泡正常
                    el.lamp1Filament.classList.remove('filament-off');
                    el.lamp2Filament.classList.remove('filament-off');
                    el.lamp1Glass.classList.remove('bulb-off');
                    el.lamp2Glass.classList.remove('bulb-off');
                }
                // 步骤 3：高亮导线 M（B→开关→负极，完成短路回路）
                else if (step === 3) {
                    // 开关保持闭合
                    el.switchBlade.setAttribute('x2', '200');
                    el.switchBlade.setAttribute('y2', '365');
                    el.switchHandle.setAttribute('cx', '200');
                    el.switchHandle.setAttribute('cy', '365');
                    // 高亮导线 b 和 M（红色）
                    el.wire1.classList.add('wire-highlight');
                    el.wireB.classList.add('wire-short');
                    el.wireM.classList.add('wire-short');
                    el.wire2.classList.remove('wire-highlight', 'wire-short');
                    // 显示箭头 1、2、3
                    el.arrow1.style.opacity = '1';
                    el.arrow2.style.opacity = '1';
                    el.arrow3.style.opacity = '1';
                    // 警告隐藏
                    el.warning1.style.opacity = '0';
                    el.warning2.style.opacity = '0';
                    // 灯泡正常
                    el.lamp1Filament.classList.remove('filament-off');
                    el.lamp2Filament.classList.remove('filament-off');
                    el.lamp1Glass.classList.remove('bulb-off');
                    el.lamp2Glass.classList.remove('bulb-off');
                }
                // 步骤 4：灯泡变灰，显示警告
                else if (step === 4) {
                    // 开关保持闭合
                    el.switchBlade.setAttribute('x2', '200');
                    el.switchBlade.setAttribute('y2', '365');
                    el.switchHandle.setAttribute('cx', '200');
                    el.switchHandle.setAttribute('cy', '365');
                    // 高亮导线 b 和 M（红色）
                    el.wire1.classList.add('wire-highlight');
                    el.wireB.classList.add('wire-short');
                    el.wireM.classList.add('wire-short');
                    el.wire2.classList.remove('wire-highlight', 'wire-short');
                    // 显示箭头 1、2、3
                    el.arrow1.style.opacity = '1';
                    el.arrow2.style.opacity = '1';
                    el.arrow3.style.opacity = '1';
                    // 显示警告 1
                    el.warning1.style.opacity = '1';
                    el.warning2.style.opacity = '0';
                    // 灯泡熄灭
                    el.lamp1Filament.classList.add('filament-off');
                    el.lamp2Filament.classList.add('filament-off');
                    el.lamp1Glass.classList.add('bulb-off');
                    el.lamp2Glass.classList.add('bulb-off');
                }
                // 步骤 5：最终结论
                else if (step === 5) {
                    // 开关保持闭合
                    el.switchBlade.setAttribute('x2', '200');
                    el.switchBlade.setAttribute('y2', '365');
                    el.switchHandle.setAttribute('cx', '200');
                    el.switchHandle.setAttribute('cy', '365');
                    // 高亮导线 b 和 M（红色）
                    el.wire1.classList.add('wire-highlight');
                    el.wireB.classList.add('wire-short');
                    el.wireM.classList.add('wire-short');
                    el.wire2.classList.remove('wire-highlight', 'wire-short');
                    // 显示箭头 1、2、3
                    el.arrow1.style.opacity = '1';
                    el.arrow2.style.opacity = '1';
                    el.arrow3.style.opacity = '1';
                    // 显示警告 2（结论）
                    el.warning1.style.opacity = '0';
                    el.warning2.style.opacity = '1';
                    // 灯泡熄灭
                    el.lamp1Filament.classList.add('filament-off');
                    el.lamp2Filament.classList.add('filament-off');
                    el.lamp1Glass.classList.add('bulb-off');
                    el.lamp2Glass.classList.add('bulb-off');
                }
            },

            // 上一步
            prevScene: function() {
                if (this.currentStep > 0) {
                    this.currentStep--;
                    this.updateScene();
                }
            },

            // 下一步
            nextScene: function() {
                if (this.currentStep < this.totalSteps) {
                    this.currentStep++;
                    this.updateScene();
                }
            },

            // 初始化
            init: function() {
                this.elements.prevBtn.addEventListener('click', this.prevScene.bind(this));
                this.elements.nextBtn.addEventListener('click', this.nextScene.bind(this));
                this.updateScene();
            }
        };

        // 启动场景
        scene1.init();
    })();
    </script>
</body>
</html>
