<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>场景 3：地转偏向力与自转线速度比较</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene3-btn { padding: 8px 20px; font-size: 14px; cursor: pointer; border: 2px solid #1565c0; border-radius: 6px; background: #fff; color: #1565c0; transition: all 0.3s; }
        .scene3-btn:hover { background: #e3f2fd; }
        .scene3-btn.active { background: #1565c0; color: #fff; }
        #scene3-canvas { width: 800px; height: 500px; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg id="scene3-canvas" width="800" height="500">
            <!-- 地球椭圆 -->
            <ellipse id="scene3-ellipse-earth" cx="400" cy="250" rx="180" ry="100" fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 赤道线 -->
            <line id="scene3-line-equator" x1="220" y1="250" x2="580" y2="250" stroke="#000000" stroke-width="2"/>
            
            <!-- 北纬 30°线 -->
            <line id="scene3-line-lat30" x1="260" y1="200" x2="540" y2="200" stroke="#888880" stroke-width="2" stroke-dasharray="5,5"/>
            
            <!-- 北纬 60°线 -->
            <line id="scene3-line-lat60" x1="310" y1="150" x2="490" y2="150" stroke="#888880" stroke-width="2" stroke-dasharray="5,5"/>
            
            <!-- A 点（北纬 60°） -->
            <circle id="scene3-point-a" cx="310" cy="150" r="6" fill="#1565c0"/>
            
            <!-- B 点（北纬 30°） -->
            <circle id="scene3-point-b" cx="400" cy="200" r="6" fill="#1565c0"/>
            
            <!-- C 点（赤道） -->
            <circle id="scene3-point-c" cx="490" cy="250" r="6" fill="#1565c0"/>
            
            <!-- 标签（调整位置避免与椭圆重叠，移到椭圆外部） -->
            <text id="scene3-label-a" x="285" y="125" font-size="16" fill="#1565c0" font-weight="bold">A</text>
            <text id="scene3-label-b" x="380" y="175" font-size="16" fill="#1565c0" font-weight="bold">B</text>
            <text id="scene3-label-c" x="465" y="225" font-size="16" fill="#1565c0" font-weight="bold">C</text>
            
            <text id="scene3-label-lat60" x="500" y="150" font-size="14" fill="#888880">北纬 60°</text>
            <text id="scene3-label-lat30" x="550" y="200" font-size="14" fill="#888880">北纬 30°</text>
            <text id="scene3-label-equator" x="590" y="250" font-size="14" fill="#000000">赤道</text>
            
            <!-- 地转偏向力箭头组（红色，状态 1 显示） -->
            <g id="scene3-group-coriolis" style="display: none;">
                <!-- A 点偏向力箭头（最长 40px，垂直向外） -->
                <line id="scene3-arrow-coriolis-a" x1="310" y1="150" x2="310" y2="110" stroke="#c62828" stroke-width="4" marker-end="url(#scene3-arrowhead-red)"/>
                <line id="scene3-arrow-coriolis-b" x1="400" y1="200" x2="400" y2="175" stroke="#c62828" stroke-width="4" marker-end="url(#scene3-arrowhead-red)"/>
                <line id="scene3-arrow-coriolis-c" x1="490" y1="250" x2="490" y2="245" stroke="#c62828" stroke-width="4" marker-end="url(#scene3-arrowhead-red)"/>
            </g>
            
            <!-- 自转线速度箭头组（绿色，状态 2 显示） -->
            <g id="scene3-group-velocity" style="display: none;">
                <!-- A 点线速度箭头（最短 20px，切线方向向右） -->
                <line id="scene3-arrow-velocity-a" x1="310" y1="150" x2="330" y2="150" stroke="#2e7d32" stroke-width="4" marker-end="url(#scene3-arrowhead-green)"/>
                <line id="scene3-arrow-velocity-b" x1="400" y1="200" x2="435" y2="200" stroke="#2e7d32" stroke-width="4" marker-end="url(#scene3-arrowhead-green)"/>
                <line id="scene3-arrow-velocity-c" x1="490" y1="250" x2="540" y2="250" stroke="#2e7d32" stroke-width="4" marker-end="url(#scene3-arrowhead-green)"/>
            </g>
            
            <!-- 箭头标记定义 -->
            <defs>
                <marker id="scene3-arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#c62828"/>
                </marker>
                <marker id="scene3-arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#2e7d32"/>
                </marker>
            </defs>
            
            <!-- 右侧信息区（调整位置避免超出边界，x 从 620 开始） -->
            <text id="scene3-title" x="620" y="100" font-size="18" fill="#000000" font-weight="bold">请选择模式查看</text>
            
            <text id="scene3-conclusion" x="620" y="180" font-size="13" fill="#000000">点击按钮查看不同物理量</text>
            
            <text id="scene3-formula" x="620" y="320" font-size="14" fill="#000000"></text>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene3-controls">
            <button id="scene3-btn-coriolis" class="scene3-btn">地转偏向力</button>
            <button id="scene3-btn-velocity" class="scene3-btn">自转线速度</button>
        </div>
    </div>
    
    <script>
    (function() {
        // 场景 3：地转偏向力与自转线速度比较
        // 状态机：currentMode ∈ {0: 初始，1: 地转偏向力，2: 自转线速度}
        
        const currentMode = { value: 0 };
        
        // DOM 元素引用
        const groupCoriolis = document.getElementById('scene3-group-coriolis');
        const groupVelocity = document.getElementById('scene3-group-velocity');
        const titleEl = document.getElementById('scene3-title');
        const conclusionEl = document.getElementById('scene3-conclusion');
        const formulaEl = document.getElementById('scene3-formula');
        const btnCoriolis = document.getElementById('scene3-btn-coriolis');
        const btnVelocity = document.getElementById('scene3-btn-velocity');
        
        // 更新显示状态
        function updateDisplay(mode) {
            // 隐藏所有箭头组
            groupCoriolis.style.display = 'none';
            groupVelocity.style.display = 'none';
            
            // 重置按钮状态
            btnCoriolis.classList.remove('active');
            btnVelocity.classList.remove('active');
            
            switch(mode) {
                case 0: // 初始状态
                    titleEl.textContent = '请选择模式查看';
                    conclusionEl.textContent = 'A、B、C 三点位于不同纬度';
                    formulaEl.textContent = '';
                    break;
                    
                case 1: // 地转偏向力模式
                    groupCoriolis.style.display = 'block';
                    btnCoriolis.classList.add('active');
                    titleEl.textContent = '地转偏向力';
                    conclusionEl.innerHTML = 'f = 2ωv sinφ<br>纬度越高偏向力越大：<br><b style="color:#c62828">A > B > C</b>';
                    formulaEl.innerHTML = 'f = 2ωv sinφ';
                    break;
                    
                case 2: // 自转线速度模式
                    groupVelocity.style.display = 'block';
                    btnVelocity.classList.add('active');
                    titleEl.textContent = '自转线速度';
                    conclusionEl.innerHTML = 'v = ωR cosφ<br>纬度越高线速度越小：<br><b style="color:#2e7d32">C > B > A</b>';
                    formulaEl.innerHTML = 'v = ωR cosφ';
                    break;
            }
            
            // 触发 MathJax 重新渲染
            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise();
            }
        }
        
        // 按钮事件绑定
        btnCoriolis.addEventListener('click', function() {
            currentMode.value = 1;
            updateDisplay(1);
        });
        
        btnVelocity.addEventListener('click', function() {
            currentMode.value = 2;
            updateDisplay(2);
        });
        
        // 初始化显示
        updateDisplay(0);
    })();
    </script>
</body>
</html>
