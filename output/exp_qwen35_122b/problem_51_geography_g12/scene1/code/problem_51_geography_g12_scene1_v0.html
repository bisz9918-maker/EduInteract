<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地球光照图基础认知 - 场景 1</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Microsoft YaHei', sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 20px; z-index: 10; }
        .scene1-btn { padding: 8px 20px; font-size: 14px; background: #1976d2; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .scene1-btn:disabled { background: #bdbdbd; cursor: not-allowed; }
        .scene1-btn:hover:not(:disabled) { background: #1565c0; }
        #scene1-step-indicator { font-size: 14px; color: #424242; min-width: 80px; text-align: center; }
        .scene1-hidden { display: none !important; }
        .scene1-fade-in { animation: scene1-fadeIn 0.3s ease-in; }
        @keyframes scene1-fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .scene1-pulse { animation: scene1-pulse 1s ease-in-out infinite; }
        @keyframes scene1-pulse { 0%, 100% { fill: #1565c0; } 50% { fill: #64b5f6; } }
        #scene1-conclusion-box { position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%); background: #fff3e0; border: 2px solid #ff9800; border-radius: 8px; padding: 12px 24px; font-size: 15px; color: #e65100; display: none; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32"/>
                </marker>
            </defs>
            
            <!-- 地球椭圆轮廓 -->
            <ellipse id="scene1-earth-ellipse" cx="400" cy="250" rx="280" ry="180" fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 夜半球填充（左半部分） -->
            <path id="scene1-night-hemisphere" d="M 120,250 A 280,180 0 0,1 120,250 L 120,250 Z" fill="#000000" fill-opacity="0.3" class="scene1-hidden"/>
            
            <!-- 昼半球填充（右半部分） -->
            <path id="scene1-day-hemisphere" d="M 120,250 A 280,180 0 0,0 680,250 L 680,250 Z" fill="#ffffff" stroke="none" class="scene1-hidden"/>
            
            <!-- 0°经线（左侧弧线） -->
            <path id="scene1-prime-meridian" d="M 120,70 Q 100,250 120,430" fill="none" stroke="#c62828" stroke-width="2" stroke-dasharray="5,3"/>
            
            <!-- 晨昏线（虚线） -->
            <path id="scene1-terminator" d="M 180,120 Q 200,250 180,380" fill="none" stroke="#000000" stroke-width="2" stroke-dasharray="8,4" class="scene1-hidden"/>
            
            <!-- A-B-C 连线 -->
            <line id="scene1-abc-line" x1="180" y1="120" x2="650" y2="250" stroke="#888880" stroke-width="1.5" stroke-dasharray="4,2"/>
            
            <!-- 自转箭头（左侧外部弧线） -->
            <path id="scene1-rotation-arrow" d="M 60,180 Q 30,250 60,320" fill="none" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#scene1-arrowhead)" class="scene1-hidden"/>
            
            <!-- O 点（地心） -->
            <circle id="scene1-point-o" cx="650" cy="250" r="5" fill="#000000"/>
            
            <!-- A 点 -->
            <circle id="scene1-point-a" cx="180" cy="120" r="5" fill="#1565c0" class="scene1-hidden"/>
            
            <!-- B 点 -->
            <circle id="scene1-point-b" cx="415" cy="185" r="5" fill="#1565c0" class="scene1-hidden"/>
            
            <!-- C 点 -->
            <circle id="scene1-point-c" cx="540" cy="218" r="5" fill="#1565c0" class="scene1-hidden"/>
            
            <!-- 标签：0° -->
            <text id="scene1-label-0" x="100" y="65" font-size="16" fill="#c62828" font-weight="bold">0°</text>
            
            <!-- 标签：A -->
            <text id="scene1-label-a" x="170" y="110" font-size="16" fill="#1565c0" font-weight="bold" class="scene1-hidden">A</text>
            
            <!-- 标签：B -->
            <text id="scene1-label-b" x="405" y="175" font-size="16" fill="#1565c0" font-weight="bold" class="scene1-hidden">B</text>
            
            <!-- 标签：C -->
            <text id="scene1-label-c" x="530" y="208" font-size="16" fill="#1565c0" font-weight="bold" class="scene1-hidden">C</text>
            
            <!-- 标签：O（移到椭圆右侧外部，x=700 确保不重叠） -->
            <text id="scene1-label-o" x="700" y="255" font-size="16" fill="#000000" font-weight="bold">O</text>
            
            <!-- 标签：晨昏线 -->
            <text id="scene1-label-terminator" x="200" y="100" font-size="14" fill="#000000" class="scene1-hidden">晨昏线</text>
            
            <!-- 标签：夜半球 -->
            <text id="scene1-label-night" x="140" y="280" font-size="14" fill="#000000" class="scene1-hidden">夜半球</text>
            
            <!-- 标签：昼半球 -->
            <text id="scene1-label-day" x="520" y="280" font-size="14" fill="#000000" class="scene1-hidden">昼半球</text>
            
            <!-- 标签：自转方向 -->
            <text id="scene1-label-rotation" x="20" y="255" font-size="14" fill="#2e7d32" class="scene1-hidden">自转方向</text>
        </svg>
        
        <!-- 结论框 -->
        <div id="scene1-conclusion-box">晨昏线特征：晨昏线是昼夜半球的分界线，与太阳光线垂直</div>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 0/4</span>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现
        // 布局坐标表（根据原图调整）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 备注 |
        // | 地球椭圆 | 椭圆 | 中心 (400,250) | 280×180 | 主图形，居中 |
        // | 0°经线 | 弧线 | x≈120, y=70~430 | - | 红色虚线，左侧 |
        // | 晨昏线 | 路径 | (180,120) 至 (180,380) 弧线 | - | 黑色虚线 |
        // | A 点 | 圆点 | (180,120) | 5px 半径 | 蓝色，晨昏线上 |
        // | B 点 | 圆点 | (415,185) | 5px 半径 | 蓝色，中间位置 |
        // | C 点 | 圆点 | (540,218) | 5px 半径 | 蓝色，右侧位置 |
        // | O 点 | 圆点 | (650,250) | 5px 半径 | 黑色，地心 |
        // | A-B-C 连线 | 直线 | (180,120)-(650,250) | - | 灰色虚线 |
        // | 自转箭头 | 弧线 | (60,180) 至 (60,320) | - | 绿色，左侧外部 |
        
        const scene1 = {
            currentStep: 0,
            totalSteps: 4,
            
            // 元素 ID 映射
            elements: {
                // 步骤 0 显示
                step0: ['scene1-earth-ellipse', 'scene1-prime-meridian', 'scene1-abc-line', 'scene1-point-o', 'scene1-label-0', 'scene1-label-o'],
                // 步骤 1 新增
                step1: ['scene1-terminator', 'scene1-night-hemisphere', 'scene1-day-hemisphere', 'scene1-label-terminator', 'scene1-label-night', 'scene1-label-day'],
                // 步骤 2 新增
                step2: ['scene1-rotation-arrow', 'scene1-label-rotation'],
                // 步骤 3 新增
                step3: ['scene1-point-a', 'scene1-point-b', 'scene1-point-c', 'scene1-label-a', 'scene1-label-b', 'scene1-label-c'],
                // 步骤 4 结论
                step4: ['scene1-conclusion-box']
            },
            
            // 显示指定步骤的元素
            showStep: function(step) {
                // 隐藏所有步骤元素
                for (let i = 0; i <= this.totalSteps; i++) {
                    const stepElements = this.elements['step' + i] || [];
                    stepElements.forEach(id => {
                        const el = document.getElementById(id);
                        if (el) {
                            if (i === 4 && id === 'scene1-conclusion-box') {
                                el.style.display = (step >= 4) ? 'block' : 'none';
                            } else {
                                el.style.display = (step >= i) ? 'block' : 'none';
                                el.style.opacity = (step >= i) ? '1' : '0';
                            }
                        }
                    });
                }
                
                // 步骤 4 时添加脉冲动画到 A/B/C 点
                if (step === 4) {
                    ['scene1-point-a', 'scene1-point-b', 'scene1-point-c'].forEach(id => {
                        const el = document.getElementById(id);
                        if (el) el.classList.add('scene1-pulse');
                    });
                } else {
                    ['scene1-point-a', 'scene1-point-b', 'scene1-point-c'].forEach(id => {
                        const el = document.getElementById(id);
                        if (el) el.classList.remove('scene1-pulse');
                    });
                }
                
                // 更新状态指示器
                document.getElementById('scene1-step-indicator').textContent = '步骤 ' + step + '/' + this.totalSteps;
                
                // 更新按钮状态
                document.getElementById('scene1-btn-prev').disabled = (step === 0);
                document.getElementById('scene1-btn-next').disabled = (step === this.totalSteps);
            },
            
            // 下一步
            nextStep: function() {
                if (this.currentStep < this.totalSteps) {
                    this.currentStep++;
                    this.showStep(this.currentStep);
                }
            },
            
            // 上一步
            prevStep: function() {
                if (this.currentStep > 0) {
                    this.currentStep--;
                    this.showStep(this.currentStep);
                }
            },
            
            // 初始化
            init: function() {
                document.getElementById('scene1-btn-next').addEventListener('click', this.nextStep.bind(this));
                document.getElementById('scene1-btn-prev').addEventListener('click', this.prevStep.bind(this));
                this.showStep(this.currentStep);
            }
        };
        
        // 绑定方法到对象
        scene1.nextStep = scene1.nextStep.bind(scene1);
        scene1.prevStep = scene1.prevStep.bind(scene1);
        
        // 页面加载后初始化
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', scene1.init.bind(scene1));
        } else {
            scene1.init();
        }
    })();
    </script>
</body>
</html>
