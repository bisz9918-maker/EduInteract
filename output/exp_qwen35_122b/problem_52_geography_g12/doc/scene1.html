<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>东西半球与南北半球划分 - 经度标注</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Microsoft YaHei', sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; gap: 16px; z-index: 10; }
        #scene1-step-indicator { position: absolute; bottom: 55px; left: 0; right: 0; text-align: center; font-size: 16px; color: #333; }
        button { padding: 8px 20px; font-size: 14px; cursor: pointer; border: 2px solid #1565c0; border-radius: 6px; background: #fff; color: #1565c0; transition: all 0.2s; }
        button:hover { background: #1565c0; color: #fff; }
        button:disabled { border-color: #ccc; color: #ccc; cursor: not-allowed; }
        .conclusion-text { position: absolute; bottom: 90px; left: 0; right: 0; text-align: center; font-size: 18px; font-weight: bold; color: #c62828; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- 定义斜线填充图案 -->
            <defs>
                <pattern id="scene1-hatch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
                    <line x1="0" y1="0" x2="0" y2="10" stroke="#888888" stroke-width="1"/>
                </pattern>
            </defs>

            <!-- 左半圆轮廓（南半球/西半球） -->
            <path id="scene1-left-hemisphere" d="M 100 250 A 150 150 0 0 1 400 250" fill="none" stroke="#000000" stroke-width="2"/>

            <!-- 右半圆轮廓（北半球/东半球） -->
            <path id="scene1-right-hemisphere" d="M 400 250 A 150 150 0 0 1 700 250" fill="none" stroke="#000000" stroke-width="2"/>

            <!-- 赤道线 -->
            <line id="scene1-equator" x1="100" y1="250" x2="700" y2="250" stroke="#000000" stroke-width="2"/>

            <!-- 左半圆经线组（从南极点 S 放射） -->
            <line id="scene1-line-s-0" x1="250" y1="400" x2="250" y2="250" stroke="#999999" stroke-width="1" stroke-dasharray="4,4"/>
            <line id="scene1-line-s-30l" x1="250" y1="400" x2="175" y2="250" stroke="#999999" stroke-width="1" stroke-dasharray="4,4"/>
            <line id="scene1-line-s-60l" x1="250" y1="400" x2="125" y2="250" stroke="#999999" stroke-width="1" stroke-dasharray="4,4"/>
            <line id="scene1-line-s-90l" x1="250" y1="400" x2="100" y2="250" stroke="#999999" stroke-width="1" stroke-dasharray="4,4"/>
            <line id="scene1-line-s-30r" x1="250" y1="400" x2="325" y2="250" stroke="#999999" stroke-width="1" stroke-dasharray="4,4"/>
            <line id="scene1-line-s-60r" x1="250" y1="400" x2="375" y2="250" stroke="#999999" stroke-width="1" stroke-dasharray="4,4"/>
            <line id="scene1-line-s-90r" x1="250" y1="400" x2="400" y2="250" stroke="#999999" stroke-width="1" stroke-dasharray="4,4"/>

            <!-- 右半圆经线组（从北极点 N 放射） -->
            <line id="scene1-line-n-0" x1="550" y1="100" x2="550" y2="250" stroke="#999999" stroke-width="1" stroke-dasharray="4,4"/>
            <line id="scene1-line-n-30r" x1="550" y1="100" x2="625" y2="250" stroke="#999999" stroke-width="1" stroke-dasharray="4,4"/>
            <line id="scene1-line-n-60r" x1="550" y1="100" x2="675" y2="250" stroke="#999999" stroke-width="1" stroke-dasharray="4,4"/>
            <line id="scene1-line-n-90r" x1="550" y1="100" x2="700" y2="250" stroke="#999999" stroke-width="1" stroke-dasharray="4,4"/>
            <line id="scene1-line-n-30l" x1="550" y1="100" x2="475" y2="250" stroke="#999999" stroke-width="1" stroke-dasharray="4,4"/>
            <line id="scene1-line-n-60l" x1="550" y1="100" x2="425" y2="250" stroke="#999999" stroke-width="1" stroke-dasharray="4,4"/>
            <line id="scene1-line-n-90l" x1="550" y1="100" x2="400" y2="250" stroke="#999999" stroke-width="1" stroke-dasharray="4,4"/>

            <!-- 纬线组（虚线） -->
            <!-- 北半球纬线 -->
            <path id="scene1-latitude-n-50" d="M 500 250 A 50 50 0 0 1 600 250" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
            <path id="scene1-latitude-n-25" d="M 525 250 A 25 25 0 0 1 575 250" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
            <!-- 南半球纬线 -->
            <path id="scene1-latitude-s-50" d="M 200 250 A 50 50 0 0 0 300 250" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
            <path id="scene1-latitude-s-25" d="M 225 250 A 25 25 0 0 0 275 250" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>

            <!-- 阴影区域（左半圆黑夜部分） -->
            <path id="scene1-shadow" d="M 100 250 A 150 150 0 0 1 400 250 L 400 250 A 150 150 0 0 0 100 250 Z" fill="url(#scene1-hatch)" opacity="0"/>

            <!-- 20°W 经线（高亮线，初始隐藏） -->
            <line id="scene1-line-20w-n" x1="550" y1="100" x2="400" y2="250" stroke="#1565c0" stroke-width="3" opacity="0"/>
            <line id="scene1-line-20w-s" x1="250" y1="400" x2="400" y2="250" stroke="#1565c0" stroke-width="3" opacity="0"/>

            <!-- 160°E 经线（高亮线，初始隐藏） -->
            <line id="scene1-line-160e" x1="550" y1="100" x2="700" y2="250" stroke="#1565c0" stroke-width="3" opacity="0"/>

            <!-- 极点 -->
            <circle id="scene1-circle-n" cx="550" cy="100" r="4" fill="#000000"/>
            <circle id="scene1-circle-s" cx="250" cy="400" r="4" fill="#000000"/>

            <!-- 点 A（初始隐藏） -->
            <circle id="scene1-point-a" cx="700" cy="250" r="6" fill="#c62828" opacity="0"/>
            <!-- 点 B（初始隐藏） -->
            <circle id="scene1-point-b" cx="200" cy="250" r="6" fill="#c62828" opacity="0"/>
            <!-- 点 甲（初始隐藏） -->
            <circle id="scene1-point-jia" cx="180" cy="235" r="6" fill="#ffffff" stroke="#000000" stroke-width="2" opacity="0"/>
            <!-- 点 乙（初始隐藏） -->
            <circle id="scene1-point-yi" cx="550" cy="140" r="6" fill="#c62828" opacity="0"/>
            <!-- 点 C（初始隐藏） -->
            <circle id="scene1-point-c" cx="550" cy="250" r="6" fill="#c62828" opacity="0"/>

            <!-- 标签 -->
            <text id="scene1-label-n" x="545" y="90" font-size="14" fill="#000000">N</text>
            <text id="scene1-label-s" x="245" y="415" font-size="14" fill="#000000">S</text>
            <!-- 北半球/南半球标签移到更空旷的位置 - 放在半圆外部 -->
            <text id="scene1-label-north-hemisphere" x="650" y="200" font-size="12" fill="#2e7d32" text-anchor="middle">北半球</text>
            <text id="scene1-label-south-hemisphere" x="150" y="300" font-size="12" fill="#2e7d32" text-anchor="middle">南半球</text>

            <!-- 点标签（初始隐藏） -->
            <text id="scene1-label-a" x="710" y="245" font-size="14" fill="#000000" opacity="0">A</text>
            <text id="scene1-label-b" x="200" y="275" font-size="14" fill="#000000" opacity="0">B</text>
            <text id="scene1-label-jia" x="180" y="215" font-size="14" fill="#000000" opacity="0">甲</text>
            <text id="scene1-label-yi" x="560" y="135" font-size="14" fill="#000000" opacity="0">乙</text>
            <text id="scene1-label-c" x="550" y="275" font-size="14" fill="#000000" opacity="0">C</text>

            <!-- 经度标签（初始隐藏）- 移到半圆外部，远离经线 -->
            <text id="scene1-label-20w-top" x="320" y="80" font-size="14" fill="#1565c0" opacity="0">20°W</text>
            <text id="scene1-label-20w-bottom" x="320" y="310" font-size="14" fill="#1565c0" opacity="0">20°W</text>
            <text id="scene1-label-160e" x="680" y="80" font-size="14" fill="#1565c0" opacity="0">160°E</text>
        </svg>

        <div id="scene1-step-indicator">步骤 0/6</div>
        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
        <div id="scene1-conclusion" class="conclusion-text" style="display: none;">A = 160°E，B = 20°W</div>
    </div>

    <script>
    (function() {
        // Scene 1 实现：东西半球与南北半球划分及经度标注
        // 布局坐标表对照：
        // | 元素 | 位置 | 备注 |
        // |------|------|------|
        // | 右半圆轮廓 | 圆心 (550,250)，半径 150 | 北半球/东半球 |
        // | 左半圆轮廓 | 圆心 (250,250)，半径 150 | 南半球/西半球 |
        // | 赤道线 | (100,250)-(700,250) | 水平中线 |
        // | 北极点 N | (550,100) | 右半圆顶部 |
        // | 南极点 S | (250,400) | 左半圆底部 |
        // | 点 A | (700,250) | 160°E 与赤道交点 |
        // | 点 B | (200,250) | 20°W 与赤道交点 |
        // | 点 甲 | (180,235) | 西半球赤道上方 |
        // | 点 乙 | (550,140) | 东半球北极下方 |
        // | 点 C | (550,250) | 东半球中心 |

        const TOTAL_STEPS = 6;
        let currentStep = 0;

        // 步骤配置
        const stepConfig = [
            // 步骤 0：基础半球图
            {
                show: ['left-hemisphere', 'right-hemisphere', 'equator', 'line-s-0', 'line-s-30l', 'line-s-60l', 'line-s-90l',
                       'line-s-30r', 'line-s-60r', 'line-s-90r', 'line-n-0', 'line-n-30r', 'line-n-60r', 'line-n-90r',
                       'line-n-30l', 'line-n-60l', 'line-n-90l', 'latitude-n-50', 'latitude-n-25', 'latitude-s-50', 'latitude-s-25',
                       'circle-n', 'circle-s', 'label-n', 'label-s', 'label-north-hemisphere', 'label-south-hemisphere'],
                hide: ['shadow', 'line-20w-n', 'line-20w-s', 'line-160e', 'point-a', 'point-b', 'point-jia', 'point-yi', 'point-c',
                       'label-a', 'label-b', 'label-jia', 'label-yi', 'label-c', 'label-20w-top', 'label-20w-bottom', 'label-160e'],
                conclusion: false
            },
            // 步骤 1：标注 20°W 经线
            {
                show: ['left-hemisphere', 'right-hemisphere', 'equator', 'line-s-0', 'line-s-30l', 'line-s-60l', 'line-s-90l',
                       'line-s-30r', 'line-s-60r', 'line-s-90r', 'line-n-0', 'line-n-30r', 'line-n-60r', 'line-n-90r',
                       'line-n-30l', 'line-n-60l', 'line-n-90l', 'latitude-n-50', 'latitude-n-25', 'latitude-s-50', 'latitude-s-25',
                       'circle-n', 'circle-s', 'label-n', 'label-s', 'label-north-hemisphere', 'label-south-hemisphere',
                       'line-20w-n', 'line-20w-s', 'label-20w-top', 'label-20w-bottom'],
                hide: ['shadow', 'line-160e', 'point-a', 'point-b', 'point-jia', 'point-yi', 'point-c',
                       'label-a', 'label-b', 'label-jia', 'label-yi', 'label-c', 'label-160e'],
                conclusion: false
            },
            // 步骤 2：标注 160°E 经线
            {
                show: ['left-hemisphere', 'right-hemisphere', 'equator', 'line-s-0', 'line-s-30l', 'line-s-60l', 'line-s-90l',
                       'line-s-30r', 'line-s-60r', 'line-s-90r', 'line-n-0', 'line-n-30r', 'line-n-60r', 'line-n-90r',
                       'line-n-30l', 'line-n-60l', 'line-n-90l', 'latitude-n-50', 'latitude-n-25', 'latitude-s-50', 'latitude-s-25',
                       'circle-n', 'circle-s', 'label-n', 'label-s', 'label-north-hemisphere', 'label-south-hemisphere',
                       'line-20w-n', 'line-20w-s', 'label-20w-top', 'label-20w-bottom', 'line-160e', 'label-160e'],
                hide: ['shadow', 'point-a', 'point-b', 'point-jia', 'point-yi', 'point-c',
                       'label-a', 'label-b', 'label-jia', 'label-yi', 'label-c'],
                conclusion: false
            },
            // 步骤 3：高亮 A 点经度
            {
                show: ['left-hemisphere', 'right-hemisphere', 'equator', 'line-s-0', 'line-s-30l', 'line-s-60l', 'line-s-90l',
                       'line-s-30r', 'line-s-60r', 'line-s-90r', 'line-n-0', 'line-n-30r', 'line-n-60r', 'line-n-90r',
                       'line-n-30l', 'line-n-60l', 'line-n-90l', 'latitude-n-50', 'latitude-n-25', 'latitude-s-50', 'latitude-s-25',
                       'circle-n', 'circle-s', 'label-n', 'label-s', 'label-north-hemisphere', 'label-south-hemisphere',
                       'line-20w-n', 'line-20w-s', 'label-20w-top', 'label-20w-bottom', 'line-160e', 'label-160e',
                       'point-a', 'label-a'],
                hide: ['shadow', 'point-b', 'point-jia', 'point-yi', 'point-c',
                       'label-b', 'label-jia', 'label-yi', 'label-c'],
                conclusion: false
            },
            // 步骤 4：高亮 B 点经度
            {
                show: ['left-hemisphere', 'right-hemisphere', 'equator', 'line-s-0', 'line-s-30l', 'line-s-60l', 'line-s-90l',
                       'line-s-30r', 'line-s-60r', 'line-s-90r', 'line-n-0', 'line-n-30r', 'line-n-60r', 'line-n-90r',
                       'line-n-30l', 'line-n-60l', 'line-n-90l', 'latitude-n-50', 'latitude-n-25', 'latitude-s-50', 'latitude-s-25',
                       'circle-n', 'circle-s', 'label-n', 'label-s', 'label-north-hemisphere', 'label-south-hemisphere',
                       'line-20w-n', 'line-20w-s', 'label-20w-top', 'label-20w-bottom', 'line-160e', 'label-160e',
                       'point-a', 'label-a', 'point-b', 'label-b'],
                hide: ['shadow', 'point-jia', 'point-yi', 'point-c',
                       'label-jia', 'label-yi', 'label-c'],
                conclusion: false
            },
            // 步骤 5：显示所有点和阴影
            {
                show: ['left-hemisphere', 'right-hemisphere', 'equator', 'line-s-0', 'line-s-30l', 'line-s-60l', 'line-s-90l',
                       'line-s-30r', 'line-s-60r', 'line-s-90r', 'line-n-0', 'line-n-30r', 'line-n-60r', 'line-n-90r',
                       'line-n-30l', 'line-n-60l', 'line-n-90l', 'latitude-n-50', 'latitude-n-25', 'latitude-s-50', 'latitude-s-25',
                       'circle-n', 'circle-s', 'label-n', 'label-s', 'label-north-hemisphere', 'label-south-hemisphere',
                       'line-20w-n', 'line-20w-s', 'label-20w-top', 'label-20w-bottom', 'line-160e', 'label-160e',
                       'point-a', 'label-a', 'point-b', 'label-b', 'point-jia', 'label-jia', 'point-yi', 'label-yi', 'point-c', 'label-c',
                       'shadow'],
                hide: [],
                conclusion: false
            },
            // 步骤 6：结论
            {
                show: ['left-hemisphere', 'right-hemisphere', 'equator', 'line-s-0', 'line-s-30l', 'line-s-60l', 'line-s-90l',
                       'line-s-30r', 'line-s-60r', 'line-s-90r', 'line-n-0', 'line-n-30r', 'line-n-60r', 'line-n-90r',
                       'line-n-30l', 'line-n-60l', 'line-n-90l', 'latitude-n-50', 'latitude-n-25', 'latitude-s-50', 'latitude-s-25',
                       'circle-n', 'circle-s', 'label-n', 'label-s', 'label-north-hemisphere', 'label-south-hemisphere',
                       'line-20w-n', 'line-20w-s', 'label-20w-top', 'label-20w-bottom', 'line-160e', 'label-160e',
                       'point-a', 'label-a', 'point-b', 'label-b', 'point-jia', 'label-jia', 'point-yi', 'label-yi', 'point-c', 'label-c',
                       'shadow'],
                hide: [],
                conclusion: true
            }
        ];

        // 工具函数：显示元素
        function showElement(id) {
            const el = document.getElementById('scene1-' + id);
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }

        // 工具函数：隐藏元素
        function hideElement(id) {
            const el = document.getElementById('scene1-' + id);
            if (el) {
                el.style.opacity = '0';
                // 对于 text 元素，用 display 控制
                if (el.tagName === 'text' || el.nodeName === 'text') {
                    setTimeout(() => { el.style.display = 'none'; }, 300);
                }
            }
        }

        // 渲染当前步骤
        function renderStep() {
            const config = stepConfig[currentStep];

            // 先隐藏所有可能隐藏的元素
            config.hide.forEach(id => hideElement(id));

            // 再显示需要显示的元素
            config.show.forEach(id => showElement(id));

            // 更新步骤指示器
            document.getElementById('scene1-step-indicator').textContent = '步骤 ' + currentStep + '/' + TOTAL_STEPS;

            // 更新按钮状态
            document.getElementById('scene1-btn-prev').disabled = (currentStep === 0);
            document.getElementById('scene1-btn-next').disabled = (currentStep === TOTAL_STEPS);

            // 显示/隐藏结论文字
            const conclusionEl = document.getElementById('scene1-conclusion');
            if (config.conclusion) {
                conclusionEl.style.display = 'block';
            } else {
                conclusionEl.style.display = 'none';
            }
        }

        // 下一步
        function nextStep() {
            if (currentStep < TOTAL_STEPS) {
                currentStep++;
                renderStep();
            }
        }

        // 上一步
        function prevStep() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        }

        // 初始化
        function init() {
            document.getElementById('scene1-btn-next').addEventListener('click', nextStep);
            document.getElementById('scene1-btn-prev').addEventListener('click', prevStep);
            renderStep();
        }

        init();
    })();
    </script>
</body>
</html>
