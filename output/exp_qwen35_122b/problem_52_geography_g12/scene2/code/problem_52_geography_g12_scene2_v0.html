<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 晨昏线与昼夜分布及日期判断</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene2-controls button {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #333;
            border-radius: 4px;
            background: #f5f5f5;
        }
        #scene2-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene2-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" viewBox="0 0 800 500">
            <defs>
                <pattern id="scene2-hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
                    <line x1="0" y1="0" x2="0" y2="8" stroke="#888888" stroke-width="1"/>
                </pattern>
                <pattern id="scene2-hatch-red" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
                    <line x1="0" y1="0" x2="0" y2="8" stroke="#c62828" stroke-width="1"/>
                </pattern>
            </defs>
            
            <!-- 左半球轮廓（南半球，下半圆） -->
            <path id="scene2-hemisphere-left" d="M 100 300 A 150 150 0 0 1 400 300" fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 右半球轮廓（北半球，上半圆） -->
            <path id="scene2-hemisphere-right" d="M 400 200 A 150 150 0 0 0 700 200" fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 左半球赤道 -->
            <line id="scene2-equator-left" x1="100" y1="300" x2="400" y2="300" stroke="#000000" stroke-width="2"/>
            
            <!-- 右半球赤道 -->
            <line id="scene2-equator-right" x1="400" y1="200" x2="700" y2="200" stroke="#000000" stroke-width="2"/>
            
            <!-- 左半球经线（5 条，从南极点 S 辐射） -->
            <line id="scene2-meridian-left-1" x1="250" y1="450" x2="130" y2="330" stroke="#000000" stroke-width="1" opacity="0.6"/>
            <line id="scene2-meridian-left-2" x1="250" y1="450" x2="180" y2="310" stroke="#000000" stroke-width="1" opacity="0.6"/>
            <line id="scene2-meridian-left-3" x1="250" y1="450" x2="250" y2="300" stroke="#000000" stroke-width="1" opacity="0.6"/>
            <line id="scene2-meridian-left-4" x1="250" y1="450" x2="320" y2="310" stroke="#000000" stroke-width="1" opacity="0.6"/>
            <line id="scene2-meridian-left-5" x1="250" y1="450" x2="370" y2="330" stroke="#000000" stroke-width="1" opacity="0.6"/>
            
            <!-- 右半球经线（5 条，从北极点 N 辐射） -->
            <line id="scene2-meridian-right-1" x1="550" y1="50" x2="430" y2="170" stroke="#000000" stroke-width="1" opacity="0.6"/>
            <line id="scene2-meridian-right-2" x1="550" y1="50" x2="500" y2="190" stroke="#000000" stroke-width="1" opacity="0.6"/>
            <line id="scene2-meridian-right-3" x1="550" y1="50" x2="550" y2="200" stroke="#000000" stroke-width="1" opacity="0.6"/>
            <line id="scene2-meridian-right-4" x1="550" y1="50" x2="600" y2="190" stroke="#000000" stroke-width="1" opacity="0.6"/>
            <line id="scene2-meridian-right-5" x1="550" y1="50" x2="650" y2="170" stroke="#000000" stroke-width="1" opacity="0.6"/>
            
            <!-- 南极圈（蓝色虚线） -->
            <path id="scene2-antarctic-circle" d="M 160 300 A 90 90 0 0 1 340 300" fill="none" stroke="#1565c0" stroke-width="2" stroke-dasharray="5,5" opacity="0"/>
            
            <!-- 北极圈（蓝色虚线） -->
            <path id="scene2-arctic-circle" d="M 460 200 A 90 90 0 0 0 640 200" fill="none" stroke="#1565c0" stroke-width="2" stroke-dasharray="5,5" opacity="0"/>
            
            <!-- 晨昏线（初始为虚线，步骤 1 变为实线） -->
            <path id="scene2-terminator" d="M 400 200 Q 400 250 400 300" fill="none" stroke="#c62828" stroke-width="3" stroke-dasharray="5,5" opacity="0"/>
            
            <!-- 南半球阴影区域（晨昏线左侧，步骤 1 显示） -->
            <path id="scene2-shadow-south" d="M 100 300 Q 250 300 400 300 L 400 280 Q 300 280 100 300 Z" fill="url(#scene2-hatch)" opacity="0"/>
            
            <!-- 北半球阴影区域（晨昏线右侧，步骤 2 显示） -->
            <path id="scene2-shadow-north" d="M 400 200 Q 550 200 700 200 L 700 220 Q 500 220 400 200 Z" fill="url(#scene2-hatch)" opacity="0"/>
            
            <!-- 北极圈内极夜阴影（步骤 2 显示） -->
            <path id="scene2-shadow-arctic-night" d="M 460 200 A 90 90 0 0 0 640 200 L 640 210 A 90 90 0 0 1 460 210 Z" fill="url(#scene2-hatch-red)" opacity="0"/>
            
            <!-- 南极点 S -->
            <circle id="scene2-point-s" cx="250" cy="450" r="4" fill="#000000"/>
            
            <!-- 北极点 N -->
            <circle id="scene2-point-n" cx="550" cy="50" r="4" fill="#000000"/>
            
            <!-- 标签：S -->
            <text id="scene2-label-s" x="242" y="470" font-size="14" fill="#000000">S</text>
            
            <!-- 标签：N（调整位置，避免被裁切） -->
            <text id="scene2-label-n" x="546" y="40" font-size="14" fill="#000000">N</text>
            
            <!-- 标签：赤道（调整位置到赤道线右侧末端上方） -->
            <text id="scene2-label-equator" x="680" y="185" font-size="12" fill="#000000">赤道</text>
            
            <!-- 标签：南极圈 66.5°S（步骤 3 显示，调整位置到左侧空白处） -->
            <text id="scene2-label-antarctic" x="100" y="410" font-size="12" fill="#1565c0" opacity="0">南极圈 66.5°S</text>
            
            <!-- 标签：北极圈 66.5°N（步骤 3 显示，调整位置到右侧空白处） -->
            <text id="scene2-label-arctic" x="680" y="100" font-size="12" fill="#1565c0" opacity="0">北极圈 66.5°N</text>
            
            <!-- 标签：晨昏线（步骤 1 显示，调整位置到晨昏线右侧下方） -->
            <text id="scene2-label-terminator" x="420" y="280" font-size="12" fill="#c62828" opacity="0">晨昏线</text>
            
            <!-- 标签：极昼（步骤 2 显示，调整位置到左侧空白处） -->
            <text id="scene2-label-polar-day" x="100" y="370" font-size="14" fill="#2e7d32" opacity="0">极昼</text>
            
            <!-- 标签：极夜（步骤 2 显示，调整位置到右侧空白处） -->
            <text id="scene2-label-polar-night" x="680" y="140" font-size="14" fill="#000000" opacity="0">极夜</text>
            
            <!-- 日期结论（步骤 4 显示） -->
            <text id="scene2-label-date" x="320" y="465" font-size="16" fill="#c62828" font-weight="bold" opacity="0">日期：12 月 22 日前后（冬至日）</text>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-prev-btn">◀ 上一步</button>
            <button id="scene2-next-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        const TOTAL_STEPS = 5;
        let currentStep = 0;
        
        function show(elId) {
            const el = document.getElementById(elId);
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '1';
                el.classList.add('fade-in');
            }
        }
        
        function hide(elId) {
            const el = document.getElementById(elId);
            if (el) {
                el.style.display = 'none';
                el.style.opacity = '0';
                el.classList.remove('fade-in');
            }
        }
        
        function setOpacity(elId, opacity) {
            const el = document.getElementById(elId);
            if (el) {
                el.style.opacity = opacity;
            }
        }
        
        function updateScene() {
            if (currentStep >= 0) {
                setOpacity('scene2-terminator', 0.5);
                document.getElementById('scene2-terminator').setAttribute('stroke-dasharray', '5,5');
            }
            
            if (currentStep >= 1) {
                setOpacity('scene2-terminator', 1);
                document.getElementById('scene2-terminator').setAttribute('stroke-dasharray', 'none');
                show('scene2-shadow-south');
                show('scene2-label-terminator');
            }
            
            if (currentStep >= 2) {
                show('scene2-shadow-north');
                show('scene2-label-polar-day');
                show('scene2-label-polar-night');
                show('scene2-shadow-arctic-night');
            }
            
            if (currentStep >= 3) {
                show('scene2-antarctic-circle');
                show('scene2-arctic-circle');
                show('scene2-label-antarctic');
                show('scene2-label-arctic');
            }
            
            if (currentStep >= 4) {
                show('scene2-label-date');
            }
            
            const prevBtn = document.getElementById('scene2-prev-btn');
            const nextBtn = document.getElementById('scene2-next-btn');
            prevBtn.disabled = (currentStep === 0);
            nextBtn.disabled = (currentStep === TOTAL_STEPS - 1);
        }
        
        function init() {
            hide('scene2-terminator');
            hide('scene2-shadow-south');
            hide('scene2-shadow-north');
            hide('scene2-shadow-arctic-night');
            hide('scene2-label-terminator');
            hide('scene2-label-polar-day');
            hide('scene2-label-polar-night');
            hide('scene2-antarctic-circle');
            hide('scene2-arctic-circle');
            hide('scene2-label-antarctic');
            hide('scene2-label-arctic');
            hide('scene2-label-date');
            
            document.getElementById('scene2-prev-btn').addEventListener('click', function() {
                if (currentStep > 0) {
                    currentStep--;
                    updateScene();
                }
            });
            
            document.getElementById('scene2-next-btn').addEventListener('click', function() {
                if (currentStep < TOTAL_STEPS - 1) {
                    currentStep++;
                    updateScene();
                }
            });
            
            updateScene();
        }
        
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>
</body>
</html>
