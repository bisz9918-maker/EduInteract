<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四棱锥 P-ABCD 线面平行与比例关系</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Microsoft YaHei', sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene1-step-indicator { position: absolute; bottom: 45px; left: 50%; transform: translateX(-50%); font-size: 14px; color: #666; }
        .scene1-btn { padding: 8px 20px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; background: #f5f5f5; cursor: pointer; }
        .scene1-btn:hover:not(:disabled) { background: #e0e0e0; }
        .scene1-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene1-vertex { fill: #000000; }
        .scene1-label { font-size: 14px; fill: #000000; }
        .scene1-edge { fill: none; stroke: #000000; stroke-width: 2; }
        .scene1-dashed { stroke-dasharray: 5,5; }
        .scene1-mn { stroke: #1565c0; stroke-width: 3; }
        .scene1-pa-highlight { stroke: #c62828; stroke-width: 3; }
        .scene1-proportion { font-size: 14px; fill: #2e7d32; font-weight: bold; }
        .scene1-parallel { font-size: 18px; fill: #000000; }
        .scene1-plane-fill { fill: #1565c0; opacity: 0.2; }
        .scene1-point-m, .scene1-point-n { fill: #1565c0; }
        .scene1-point-m { r: 5; }
        .scene1-point-n { r: 5; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500">
            <!-- 底边（先画底面，再画棱） -->
            <!-- 底边 AB：实线 -->
            <line id="scene1-edge-ab" class="scene1-edge" x1="150" y1="380" x2="350" y2="400"/>
            <!-- 底边 BC：实线 -->
            <line id="scene1-edge-bc" class="scene1-edge" x1="350" y1="400" x2="600" y2="360"/>
            <!-- 底边 CD：虚线（被遮挡） -->
            <line id="scene1-edge-cd" class="scene1-edge scene1-dashed" x1="600" y1="360" x2="250" y2="340"/>
            <!-- 底边 DA：虚线（被遮挡） -->
            <line id="scene1-edge-da" class="scene1-edge scene1-dashed" x1="250" y1="340" x2="150" y2="380"/>
            
            <!-- 对角线 AC：虚线（底面内部） -->
            <line id="scene1-edge-ac" class="scene1-edge scene1-dashed" x1="150" y1="380" x2="600" y2="360"/>
            
            <!-- 棱（从后到前） -->
            <!-- 棱 PD：虚线（被遮挡） -->
            <line id="scene1-edge-pd" class="scene1-edge scene1-dashed" x1="400" y1="80" x2="250" y2="340"/>
            <!-- 棱 PA：实线 -->
            <line id="scene1-edge-pa" class="scene1-edge" x1="400" y1="80" x2="150" y2="380"/>
            <!-- 棱 PB：实线 -->
            <line id="scene1-edge-pb" class="scene1-edge" x1="400" y1="80" x2="350" y2="400"/>
            <!-- 棱 PC：实线 -->
            <line id="scene1-edge-pc" class="scene1-edge" x1="400" y1="80" x2="600" y2="360"/>
            
            <!-- 平面 PAD 填充（步骤 2 显示） -->
            <polygon id="scene1-plane-pad" class="scene1-plane-fill" points="400,80 150,380 250,340" style="display: none;"/>
            
            <!-- 线段 MN（步骤 2 显示） -->
            <line id="scene1-seg-mn" class="scene1-mn" x1="510" y1="364" x2="560" y2="304" style="display: none;"/>
            
            <!-- 辅助线 PA 高亮（步骤 3 显示） -->
            <line id="scene1-pa-highlight" class="scene1-pa-highlight" x1="400" y1="80" x2="150" y2="380" style="display: none;"/>
            
            <!-- 顶点 -->
            <circle id="scene1-pt-p" class="scene1-vertex" cx="400" cy="80" r="3"/>
            <circle id="scene1-pt-a" class="scene1-vertex" cx="150" cy="380" r="3"/>
            <circle id="scene1-pt-b" class="scene1-vertex" cx="350" cy="400" r="3"/>
            <circle id="scene1-pt-c" class="scene1-vertex" cx="600" cy="360" r="3"/>
            <circle id="scene1-pt-d" class="scene1-vertex" cx="250" cy="340" r="3"/>
            
            <!-- 点 M、N（步骤 1 显示） -->
            <circle id="scene1-pt-m" class="scene1-point-m" cx="510" cy="364" style="display: none;"/>
            <circle id="scene1-pt-n" class="scene1-point-n" cx="560" cy="304" style="display: none;"/>
            
            <!-- 顶点标签 -->
            <text id="scene1-label-p" class="scene1-label" x="390" y="60">P</text>
            <text id="scene1-label-a" class="scene1-label" x="130" y="400">A</text>
            <text id="scene1-label-b" class="scene1-label" x="350" y="425">B</text>
            <text id="scene1-label-c" class="scene1-label" x="620" y="360">C</text>
            <text id="scene1-label-d" class="scene1-label" x="210" y="310">D</text>
            
            <!-- 点 M、N 标签（步骤 1 显示） -->
            <text id="scene1-label-m" class="scene1-label" x="530" y="375">M</text>
            <text id="scene1-label-n" class="scene1-label" x="575" y="295">N</text>
            
            <!-- 比例标注（步骤 4 显示） -->
            <text id="scene1-text-cm-ma" class="scene1-proportion" x="320" y="415">CM:MA=1:4</text>
            <text id="scene1-text-nc-np" class="scene1-proportion" x="590" y="220">NC:NP=1:4</text>
            
            <!-- 平行符号（步骤 2 显示） -->
            <text id="scene1-symbol-parallel" class="scene1-parallel" x="545" y="320">∥</text>
        </svg>
        
        <!-- 步骤指示器 -->
        <div id="scene1-step-indicator">步骤 1/5</div>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn" disabled>◀ 上一步</button>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // 场景 1：四棱锥 P-ABCD 线面平行与比例关系推导
        // 布局坐标表（实现对照依据）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // |------|------|-----------|------|-------------|------|
        // | 顶点 P | 点 | (400, 80) | 4×4 | 上方 (390, 60) | 四棱锥顶点 |
        // | 底点 A | 点 | (150, 380) | 4×4 | 左下 (130, 400) | 底面左前顶点 |
        // | 底点 B | 点 | (350, 400) | 4×4 | 下方 (350, 425) | 底面右前顶点 |
        // | 底点 C | 点 | (600, 360) | 4×4 | 右侧 (620, 360) | 底面右后顶点 |
        // | 底点 D | 点 | (250, 340) | 4×4 | 左上 (210, 310) | 底面左后顶点（虚线） |
        // | 点 M | 点 | (510, 364) | 5×5 | 右下 (530, 375) | AC 上，CM:MA=1:4 |
        // | 点 N | 点 | (560, 304) | 5×5 | 右上 (575, 295) | PC 上，对应位置 |
        
        const MAX_STEP = 4;  // 步骤 0-4，共 5 步
        let currentStep = 0;
        
        // 元素 ID 映射（按步骤分组）
        const stepElements = {
            1: ['scene1-pt-m', 'scene1-pt-n', 'scene1-label-m', 'scene1-label-n', 'scene1-text-cm-ma'],
            2: ['scene1-seg-mn', 'scene1-plane-pad', 'scene1-symbol-parallel'],
            3: ['scene1-pa-highlight'],
            4: ['scene1-text-nc-np']
        };
        
        // 工具函数：显示元素
        function show(elId) {
            const el = document.getElementById(elId);
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '0';
                setTimeout(() => {
                    el.style.opacity = '1';
                }, 10);
            }
        }
        
        // 工具函数：隐藏元素
        function hide(elId) {
            const el = document.getElementById(elId);
            if (el) {
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }
        
        // 更新场景状态
        function updateScene() {
            // 更新步骤指示器
            document.getElementById('scene1-step-indicator').textContent = '步骤 ' + (currentStep + 1) + '/5';
            
            // 更新按钮状态
            document.getElementById('scene1-btn-prev').disabled = (currentStep === 0);
            document.getElementById('scene1-btn-next').disabled = (currentStep === MAX_STEP);
            
            // 根据当前步骤显示/隐藏元素
            for (let step = 1; step <= MAX_STEP; step++) {
                const elements = stepElements[step];
                elements.forEach(elId => {
                    if (currentStep >= step) {
                        show(elId);
                    } else {
                        hide(elId);
                    }
                });
            }
        }
        
        // 绑定按钮事件
        document.getElementById('scene1-btn-prev').addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });
        
        document.getElementById('scene1-btn-next').addEventListener('click', function() {
            if (currentStep < MAX_STEP) {
                currentStep++;
                updateScene();
            }
        });
        
        // 初始化
        updateScene();
    })();
    </script>
</body>
</html>
