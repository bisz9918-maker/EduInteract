<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抛物线几何结构 - 场景 1</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Microsoft YaHei', sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene1-controls button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #333; border-radius: 4px; background: #f5f5f5; }
        #scene1-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene1-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-step-indicator { padding: 8px 16px; font-size: 14px; display: flex; align-items: center; }
        .element { opacity: 0; transition: opacity 0.3s ease; }
        .element.visible { opacity: 1; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- 坐标轴 -->
            <line id="scene1-axis-x" class="element" x1="100" y1="250" x2="750" y2="250" stroke="black" stroke-width="2"/>
            <polygon id="scene1-axis-x-arrow" class="element" points="750,250 740,245 740,255" fill="black"/>
            <line id="scene1-axis-y" class="element" x1="400" y1="50" x2="400" y2="450" stroke="black" stroke-width="2"/>
            <polygon id="scene1-axis-y-arrow" class="element" points="400,50 395,60 405,60" fill="black"/>
            
            <!-- 轴标签 -->
            <text id="scene1-label-x" class="element" x="755" y="245" font-size="16" fill="black">x</text>
            <text id="scene1-label-y" class="element" x="380" y="40" font-size="16" fill="black">y</text>
            
            <!-- 抛物线 y²=2px, p=200 (焦点在 (100,0) 相对顶点) -->
            <!-- 顶点 (400,250), 开口向右 - 缩小范围避免与标签重叠 -->
            <path id="scene1-parabola" class="element" d="M 400,250 C 415,230 435,200 460,165 C 485,130 515,95 550,65 M 400,250 C 415,270 435,300 460,335 C 485,370 515,405 550,435" stroke="black" stroke-width="2" fill="none"/>
            
            <!-- 抛物线标签 - 移到右上角 -->
            <text id="scene1-label-parabola" class="element" x="680" y="60" font-size="14" fill="black">y²=2px</text>
            
            <!-- 原点 O -->
            <circle id="scene1-point-O" class="element" cx="400" cy="250" r="3" fill="black"/>
            <text id="scene1-label-O" class="element" x="385" y="265" font-size="16" fill="black">O</text>
            
            <!-- 焦点 F -->
            <circle id="scene1-point-F" class="element" cx="500" cy="250" r="4" fill="red"/>
            <text id="scene1-label-F" class="element" x="500" y="355" font-size="16" fill="black">F</text>
            
            <!-- 点 A (580, 111) - 在抛物线上 -->
            <circle id="scene1-point-A" class="element" cx="580" cy="111" r="3" fill="blue"/>
            <text id="scene1-label-A" class="element" x="595" y="106" font-size="16" fill="black">A</text>
            
            <!-- 点 N (400, 111) - A 在 y 轴投影 -->
            <circle id="scene1-point-N" class="element" cx="400" cy="111" r="3" fill="blue"/>
            <text id="scene1-label-N" class="element" x="380" y="106" font-size="16" fill="black">N</text>
            
            <!-- 点 B (525, 207) - 圆与 AF 交点 -->
            <circle id="scene1-point-B" class="element" cx="525" cy="207" r="3" fill="blue"/>
            <text id="scene1-label-B" class="element" x="580" y="202" font-size="16" fill="black">B</text>
            
            <!-- 直线 AF -->
            <line id="scene1-line-AF" class="element" x1="580" y1="111" x2="500" y2="250" stroke="black" stroke-width="1.5"/>
            
            <!-- 线段 AN (灰色虚线) -->
            <line id="scene1-line-AN" class="element" x1="400" y1="111" x2="580" y2="111" stroke="gray" stroke-width="1" stroke-dasharray="5,5"/>
            
            <!-- 线段 ON -->
            <line id="scene1-line-ON" class="element" x1="400" y1="250" x2="400" y2="111" stroke="black" stroke-width="1.5"/>
            
            <!-- 线段 NB -->
            <line id="scene1-line-NB" class="element" x1="400" y1="111" x2="525" y2="207" stroke="black" stroke-width="1.5"/>
            
            <!-- 线段 OB -->
            <line id="scene1-line-OB" class="element" x1="400" y1="250" x2="525" y2="207" stroke="black" stroke-width="1.5"/>
            
            <!-- 圆 (圆心 F, 半径 50) -->
            <circle id="scene1-circle" class="element" cx="500" cy="250" r="50" stroke="blue" stroke-width="1.5" fill="none"/>
            
            <!-- 角度弧 60° - 在 F 点右侧，移到 x 轴下方 -->
            <path id="scene1-arc-60" class="element" d="M 530,250 A 30,30 0 0,-1 515,276" stroke="green" stroke-width="1" fill="none"/>
            <text id="scene1-label-60" class="element" x="545" y="270" font-size="14" fill="green">60°</text>
            
            <!-- 角度弧 90° - 在 N 点右侧，移到三角形内部 -->
            <path id="scene1-arc-90" class="element" d="M 420,111 A 20,20 0 0,1 400,131" stroke="green" stroke-width="1" fill="none"/>
            <text id="scene1-label-90" class="element" x="440" y="150" font-size="14" fill="green">90°</text>
            
            <!-- △ONB 高亮填充 -->
            <polygon id="scene1-highlight-ONB" class="element" points="400,250 400,111 525,207" fill="green" fill-opacity="0.2" stroke="none"/>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/5</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // 场景 1 实现 - 抛物线几何结构
        // 坐标表对照 (SVG 坐标系，原点 O 在 (400,250))：
        // 原点 O: (400, 250)
        // 焦点 F: (500, 250) - p/2 = 100
        // 点 A: (580, 111) - 在抛物线上，∠AFx = 60°
        // 点 N: (400, 111) - A 在 y 轴投影
        // 点 B: (525, 207) - 圆与 AF 交点，FB = 50
        // p = 200
        
        // 分步序列：
        // 步骤 0: 坐标系、抛物线、原点 O、焦点 F
        // 步骤 1: 添加点 A、直线 AF、60°标注
        // 步骤 2: 添加点 N、线段 AN、线段 ON
        // 步骤 3: 添加圆、点 B
        // 步骤 4: 添加线段 NB、OB、高亮△ONB、90°标注
        
        const currentStepMax = 4;
        let currentStep = 0;
        
        // 元素分组 - 每个步骤需要显示的元素 ID 列表
        const stepElements = {
            0: [
                'scene1-axis-x', 'scene1-axis-x-arrow',
                'scene1-axis-y', 'scene1-axis-y-arrow',
                'scene1-label-x', 'scene1-label-y',
                'scene1-parabola', 'scene1-label-parabola',
                'scene1-point-O', 'scene1-label-O',
                'scene1-point-F', 'scene1-label-F'
            ],
            1: [
                'scene1-point-A', 'scene1-label-A',
                'scene1-line-AF',
                'scene1-arc-60', 'scene1-label-60'
            ],
            2: [
                'scene1-point-N', 'scene1-label-N',
                'scene1-line-AN', 'scene1-line-ON'
            ],
            3: [
                'scene1-circle',
                'scene1-point-B', 'scene1-label-B'
            ],
            4: [
                'scene1-line-NB', 'scene1-line-OB',
                'scene1-arc-90', 'scene1-label-90',
                'scene1-highlight-ONB'
            ]
        };
        
        // 工具函数：显示元素
        function showElement(elementId) {
            const el = document.getElementById(elementId);
            if (el) {
                el.classList.add('visible');
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }
        
        // 工具函数：隐藏元素
        function hideElement(elementId) {
            const el = document.getElementById(elementId);
            if (el) {
                el.classList.remove('visible');
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }
        
        // 更新当前步骤的显示
        function updateStep() {
            // 隐藏所有步骤 1-4 的元素
            for (let step = 1; step <= currentStepMax; step++) {
                stepElements[step].forEach(id => hideElement(id));
            }
            
            // 显示当前步骤及之前步骤的所有元素
            for (let step = 0; step <= currentStep; step++) {
                stepElements[step].forEach(id => showElement(id));
            }
            
            // 更新步骤指示器
            document.getElementById('scene1-step-indicator').textContent = `步骤 ${currentStep + 1}/5`;
            
            // 更新按钮状态
            const prevBtn = document.getElementById('scene1-btn-prev');
            const nextBtn = document.getElementById('scene1-btn-next');
            prevBtn.disabled = (currentStep === 0);
            nextBtn.disabled = (currentStep === currentStepMax);
        }
        
        // 事件绑定
        document.getElementById('scene1-btn-prev').addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });
        
        document.getElementById('scene1-btn-next').addEventListener('click', function() {
            if (currentStep < currentStepMax) {
                currentStep++;
                updateStep();
            }
        });
        
        // 初始化：显示步骤 0
        updateStep();
    })();
    </script>
</body>
</html>
