<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>并联电路电流表测量分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Microsoft YaHei', sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 20px; z-index: 10; }
        .scene1-btn { padding: 10px 20px; font-size: 16px; border: 2px solid #333; border-radius: 8px; cursor: pointer; background: #f5f5f5; transition: all 0.3s; }
        .scene1-btn:hover { background: #e0e0e0; }
        .scene1-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene1-step-indicator { font-size: 16px; font-weight: bold; color: #333; }
        
        /* 发光效果滤镜 */
        .glow-blue { filter: drop-shadow(0 0 5px #1565c0); }
        .glow-red { filter: drop-shadow(0 0 5px #c62828); }
        
        /* 导线高亮过渡 */
        .scene1-wire { transition: stroke 0.3s ease, stroke-width 0.3s ease; }
        .scene1-wire.highlight { stroke: #1565c0; stroke-width: 3px; }
        .scene1-wire.highlight-ammeter { stroke: #c62828; stroke-width: 3px; }
        
        /* 元件高亮 */
        .scene1-component { transition: stroke 0.3s ease, filter 0.3s ease; }
        .scene1-component.highlight { filter: drop-shadow(0 0 8px #1565c0); }
        .scene1-component.highlight-ammeter { filter: drop-shadow(0 0 8px #c62828); }
        
        /* 电流箭头 */
        .scene1-arrow { opacity: 0; transition: opacity 0.3s ease; }
        .scene1-arrow.visible { opacity: 1; }
        
        /* 结论文字 */
        #scene1-conclusion { opacity: 0; transition: opacity 0.5s ease; font-size: 16px; font-weight: bold; fill: #2e7d32; }
        #scene1-conclusion.visible { opacity: 1; }
        
        /* 标注文字 */
        #scene1-annotation { opacity: 0; transition: opacity 0.3s ease; font-size: 14px; fill: #c62828; font-weight: bold; }
        #scene1-annotation.visible { opacity: 1; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- 箭头标记定义 -->
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#888888"/>
                </marker>
                <marker id="scene1-arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0"/>
                </marker>
            </defs>
            
            <!-- 导线层（底层） -->
            <!-- 导线：电源正极到电流表 -->
            <line id="scene1-wire1" class="scene1-wire" x1="160" y1="230" x2="350" y2="130" stroke="#000000" stroke-width="2"/>
            <!-- 导线：电流表到分支点 -->
            <line id="scene1-wire2" class="scene1-wire" x1="410" y1="130" x2="540" y2="130" stroke="#000000" stroke-width="2"/>
            <!-- 导线：分支点到 L₁ -->
            <line id="scene1-wire3" class="scene1-wire" x1="540" y1="130" x2="170" y2="390" stroke="#000000" stroke-width="2"/>
            <!-- 导线：L₁ 到汇合点 -->
            <line id="scene1-wire4" class="scene1-wire" x1="170" y1="390" x2="570" y2="390" stroke="#000000" stroke-width="2"/>
            <!-- 导线：汇合点到 L₂ -->
            <line id="scene1-wire5" class="scene1-wire" x1="570" y1="390" x2="570" y2="390" stroke="#000000" stroke-width="2"/>
            <!-- 导线：L₂ 到开关 -->
            <line id="scene1-wire6" class="scene1-wire" x1="570" y1="390" x2="680" y2="160" stroke="#000000" stroke-width="2"/>
            <!-- 导线：开关到电源负极（折线路径避免重叠） -->
            <polyline id="scene1-wire7" class="scene1-wire" points="720,130 720,270 160,270" stroke="#000000" stroke-width="2" fill="none"/>
            
            <!-- 电流箭头层 -->
            <!-- 箭头 1：电源到电流表 -->
            <line id="scene1-arrow1" class="scene1-arrow" x1="250" y1="180" x2="290" y2="155" stroke="#888888" stroke-width="2" marker-end="url(#scene1-arrowhead)" stroke-dasharray="5,3"/>
            <!-- 箭头 2：电流表到分支点 -->
            <line id="scene1-arrow2" class="scene1-arrow" x1="450" y1="130" x2="490" y2="130" stroke="#888888" stroke-width="2" marker-end="url(#scene1-arrowhead)" stroke-dasharray="5,3"/>
            <!-- 箭头 3：分支点到 L₁ -->
            <line id="scene1-arrow3" class="scene1-arrow" x1="400" y1="230" x2="360" y2="280" stroke="#888888" stroke-width="2" marker-end="url(#scene1-arrowhead)" stroke-dasharray="5,3"/>
            <!-- 箭头 4：分支点到 L₂ -->
            <line id="scene1-arrow4" class="scene1-arrow" x1="540" y1="230" x2="560" y2="300" stroke="#888888" stroke-width="2" marker-end="url(#scene1-arrowhead)" stroke-dasharray="5,3"/>
            
            <!-- 元件层 -->
            <!-- 电源（电池组） -->
            <g id="scene1-battery" class="scene1-component">
                <!-- 电池组外壳 -->
                <rect x="80" y="180" width="80" height="100" fill="#f0f0f0" stroke="#000000" stroke-width="2"/>
                <!-- 电池内部线条 -->
                <line x1="100" y1="180" x2="100" y2="280" stroke="#000000" stroke-width="2"/>
                <line x1="120" y1="180" x2="120" y2="280" stroke="#000000" stroke-width="2"/>
                <line x1="140" y1="180" x2="140" y2="280" stroke="#000000" stroke-width="2"/>
                <!-- 正极 -->
                <line x1="160" y1="200" x2="170" y2="200" stroke="#000000" stroke-width="3"/>
                <!-- 负极 -->
                <line x1="160" y1="260" x2="165" y2="260" stroke="#000000" stroke-width="2"/>
            </g>
            
            <!-- 电源正负极标签（向右移动避免重叠） -->
            <text id="scene1-plus" x="300" y="205" font-size="16" fill="#d32f2f" font-weight="bold">+</text>
            <text id="scene1-minus" x="300" y="275" font-size="16" fill="#d32f2f" font-weight="bold">−</text>
            
            <!-- 电流表 -->
            <g id="scene1-ammeter" class="scene1-component">
                <!-- 电流表外壳 -->
                <ellipse cx="380" cy="130" rx="35" ry="30" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                <!-- 表盘刻度 -->
                <line x1="350" y1="120" x2="355" y2="120" stroke="#000000" stroke-width="1"/>
                <line x1="355" y1="110" x2="360" y2="112" stroke="#000000" stroke-width="1"/>
                <line x1="365" y1="105" x2="370" y2="107" stroke="#000000" stroke-width="1"/>
                <line x1="380" y1="103" x2="380" y2="108" stroke="#000000" stroke-width="1"/>
                <line x1="395" y1="105" x2="390" y2="107" stroke="#000000" stroke-width="1"/>
                <line x1="405" y1="110" x2="400" y2="112" stroke="#000000" stroke-width="1"/>
                <line x1="410" y1="120" x2="405" y2="120" stroke="#000000" stroke-width="1"/>
                <!-- 指针 -->
                <line x1="380" y1="130" x2="385" y2="115" stroke="#000000" stroke-width="2"/>
                <circle cx="380" cy="130" r="3" fill="#000000"/>
                <!-- 接线柱 -->
                <circle cx="360" cy="155" r="5" fill="#d32f2f"/>
                <circle cx="380" cy="160" r="5" fill="#000000"/>
                <circle cx="400" cy="155" r="5" fill="#000000"/>
            </g>
            
            <!-- 电流表标识 -->
            <text id="scene1-ammeter-label" x="375" y="90" font-size="18" fill="#000000" font-weight="bold">A</text>
            
            <!-- 开关 -->
            <g id="scene1-switch" class="scene1-component">
                <!-- 开关底座 -->
                <rect x="640" y="140" width="80" height="20" fill="#f0f0f0" stroke="#000000" stroke-width="2"/>
                <!-- 开关刀（断开状态） -->
                <line x1="650" y1="140" x2="680" y2="100" stroke="#000000" stroke-width="3"/>
                <!-- 接线点 -->
                <circle cx="650" cy="150" r="4" fill="#000000"/>
                <circle cx="720" cy="150" r="4" fill="#000000"/>
            </g>
            
            <!-- L₁ 灯泡 -->
            <g id="scene1-lamp1" class="scene1-component">
                <!-- 灯泡底座 -->
                <rect x="120" y="380" width="60" height="20" fill="#f0f0f0" stroke="#000000" stroke-width="2"/>
                <!-- 灯泡符号（圆形带叉） -->
                <circle cx="150" cy="360" r="25" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                <line x1="135" y1="345" x2="165" y2="375" stroke="#000000" stroke-width="2"/>
                <line x1="165" y1="345" x2="135" y2="375" stroke="#000000" stroke-width="2"/>
                <!-- 接线点 -->
                <circle cx="120" cy="390" r="4" fill="#000000"/>
                <circle cx="180" cy="390" r="4" fill="#000000"/>
            </g>
            
            <!-- L₁ 标签 -->
            <text id="scene1-lamp1-label" x="140" y="430" font-size="18" fill="#000000" font-weight="bold">L₁</text>
            
            <!-- L₂ 灯泡 -->
            <g id="scene1-lamp2" class="scene1-component">
                <!-- 灯泡底座 -->
                <rect x="540" y="380" width="60" height="20" fill="#f0f0f0" stroke="#000000" stroke-width="2"/>
                <!-- 灯泡符号（圆形带叉） -->
                <circle cx="570" cy="360" r="25" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                <line x1="555" y1="345" x2="585" y2="375" stroke="#000000" stroke-width="2"/>
                <line x1="585" y1="345" x2="555" y2="375" stroke="#000000" stroke-width="2"/>
                <!-- 接线点 -->
                <circle cx="540" cy="390" r="4" fill="#000000"/>
                <circle cx="600" cy="390" r="4" fill="#000000"/>
            </g>
            
            <!-- L₂ 标签 -->
            <text id="scene1-lamp2-label" x="560" y="430" font-size="18" fill="#000000" font-weight="bold">L₂</text>
            
            <!-- 分支点标记 -->
            <circle id="scene1-branch-point" cx="540" cy="130" r="5" fill="#1565c0" opacity="0"/>
            
            <!-- 结论文字（上移避免与按钮重叠） -->
            <text id="scene1-conclusion" x="400" y="445" text-anchor="middle" font-size="16" fill="#2e7d32" font-weight="bold">
                ✓ 电流表与 L₂ 串联，测量通过 L₂ 的电流
            </text>
            
            <!-- 电流表标注 -->
            <text id="scene1-annotation" x="420" y="100" font-size="14" fill="#c62828" font-weight="bold">
                A 测量 L₂ 电流
            </text>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-prev-btn" class="scene1-btn">◀ 上一步</button>
            <span id="scene1-step-indicator" class="scene1-step-indicator">步骤 1/6</span>
            <button id="scene1-next-btn" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1: 并联电路电流表测量分析
        // 坐标表对照：
        // | 元素 | 类型 | 位置/范围 | 大小 | 备注 |
        // | 电源 | 电池组 | (80,180)-(160,280) | 80×100 | 左侧中央 |
        // | 电流表 | 圆形 | (380,100) | 60×60 | 中上部 |
        // | 开关 | 开关符号 | (640,100)-(720,160) | 80×60 | 右上角 |
        // | L₁灯泡 | 灯泡符号 | (140,360)-(200,420) | 60×60 | 左下角 |
        // | L₂灯泡 | 灯泡符号 | (540,360)-(600,420) | 60×60 | 右下角 |
        
        const currentStepMax = 5;
        let currentStep = 0;
        
        // 获取 DOM 元素
        const prevBtn = document.getElementById('scene1-prev-btn');
        const nextBtn = document.getElementById('scene1-next-btn');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        
        // 导线元素
        const wires = {
            wire1: document.getElementById('scene1-wire1'),  // 电源到电流表
            wire2: document.getElementById('scene1-wire2'),  // 电流表到分支点
            wire3: document.getElementById('scene1-wire3'),  // 分支点到 L₁
            wire4: document.getElementById('scene1-wire4'),  // L₁到汇合点
            wire5: document.getElementById('scene1-wire5'),  // 汇合点到 L₂
            wire6: document.getElementById('scene1-wire6'),  // L₂到开关
            wire7: document.getElementById('scene1-wire7')   // 开关到电源（折线）
        };
        
        // 箭头元素
        const arrows = {
            arrow1: document.getElementById('scene1-arrow1'),
            arrow2: document.getElementById('scene1-arrow2'),
            arrow3: document.getElementById('scene1-arrow3'),
            arrow4: document.getElementById('scene1-arrow4')
        };
        
        // 元件元素
        const components = {
            battery: document.getElementById('scene1-battery'),
            ammeter: document.getElementById('scene1-ammeter'),
            switch: document.getElementById('scene1-switch'),
            lamp1: document.getElementById('scene1-lamp1'),
            lamp2: document.getElementById('scene1-lamp2')
        };
        
        // 标注元素
        const conclusion = document.getElementById('scene1-conclusion');
        const annotation = document.getElementById('scene1-annotation');
        const branchPoint = document.getElementById('scene1-branch-point');
        
        // 更新步骤显示
        function updateStep() {
            // 重置所有高亮
            Object.values(wires).forEach(w => {
                w.classList.remove('highlight', 'highlight-ammeter');
            });
            Object.values(components).forEach(c => {
                c.classList.remove('highlight', 'highlight-ammeter');
            });
            Object.values(arrows).forEach(a => {
                a.classList.remove('visible');
            });
            conclusion.classList.remove('visible');
            annotation.classList.remove('visible');
            branchPoint.setAttribute('opacity', '0');
            
            // 根据步骤设置高亮
            switch(currentStep) {
                case 0: // 初始状态
                    stepIndicator.textContent = '步骤 1/6';
                    prevBtn.disabled = true;
                    break;
                    
                case 1: // 高亮干路（电源到电流表到分支点）
                    stepIndicator.textContent = '步骤 2/6';
                    wires.wire1.classList.add('highlight');
                    wires.wire2.classList.add('highlight');
                    components.battery.classList.add('highlight');
                    components.ammeter.classList.add('highlight');
                    arrows.arrow1.classList.add('visible');
                    arrows.arrow2.classList.add('visible');
                    branchPoint.setAttribute('opacity', '1');
                    prevBtn.disabled = false;
                    break;
                    
                case 2: // 高亮 L₁ 支路
                    stepIndicator.textContent = '步骤 3/6';
                    wires.wire3.classList.add('highlight');
                    wires.wire4.classList.add('highlight');
                    components.lamp1.classList.add('highlight');
                    arrows.arrow3.classList.add('visible');
                    prevBtn.disabled = false;
                    break;
                    
                case 3: // 高亮 L₂ 支路
                    stepIndicator.textContent = '步骤 4/6';
                    wires.wire2.classList.add('highlight');
                    wires.wire6.classList.add('highlight');
                    components.ammeter.classList.add('highlight');
                    components.lamp2.classList.add('highlight');
                    arrows.arrow2.classList.add('visible');
                    arrows.arrow4.classList.add('visible');
                    prevBtn.disabled = false;
                    break;
                    
                case 4: // 电流表特殊高亮
                    stepIndicator.textContent = '步骤 5/6';
                    components.ammeter.classList.add('highlight-ammeter');
                    annotation.classList.add('visible');
                    prevBtn.disabled = false;
                    break;
                    
                case 5: // 显示结论
                    stepIndicator.textContent = '步骤 6/6';
                    conclusion.classList.add('visible');
                    nextBtn.disabled = true;
                    prevBtn.disabled = false;
                    break;
            }
        }
        
        // 按钮事件
        prevBtn.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });
        
        nextBtn.addEventListener('click', () => {
            if (currentStep < currentStepMax) {
                currentStep++;
                updateStep();
            }
        });
        
        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
