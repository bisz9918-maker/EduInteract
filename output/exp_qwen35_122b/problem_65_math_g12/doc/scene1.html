<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 1 - 直角三角形与圆的综合几何关系</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene1-controls button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #666; border-radius: 4px; background: #f0f0f0; }
        #scene1-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene1-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- 布局坐标表对照：
                A(550,180), B(150,380), C(550,380)
                圆心 O(550,280), 半径 100
                D(390,300) - 圆与 AB 交点
                标签调整（避开图形重叠）：
                A(565,170), B(135,395), C(565,395)
                D(360,310) - D 点标签移到右下方，避开三角形边
                O(565,280)
                AC 标注 (570,230)
                BC 标注 (350,400)
                AB 标注 (340,260)
                BD 结果 (260,340)
                ∠ADC=90°标注 (355,265) - D 点左上方
                CD⊥AB 标注 (480,360) - CD 线段右下方
                相似标记：△ABC(420,320), △CBD(300,360)
                计算框：x=60, y=60, width=260, height=100
            -->
            
            <!-- 三角形 ABC -->
            <polygon id="scene1-tri-abc" points="550,180 150,380 550,380" fill="none" stroke="black" stroke-width="2" class="fade-in"/>
            
            <!-- 圆（以 AC 为直径） -->
            <circle id="scene1-circle" cx="550" cy="280" r="100" fill="none" stroke="black" stroke-width="2" style="display:none;" class="fade-in"/>
            
            <!-- 圆心 O -->
            <circle id="scene1-point-o" cx="550" cy="280" r="4" fill="black" style="display:none;" class="fade-in"/>
            
            <!-- 线段 CD（辅助线，虚线） -->
            <line id="scene1-line-cd" x1="550" y1="380" x2="390" y2="300" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5" style="display:none;" class="fade-in"/>
            
            <!-- 直角符号∠C -->
            <path id="scene1-right-angle-c" d="M 535,365 L 550,365 L 550,380" fill="none" stroke="black" stroke-width="1" class="fade-in"/>
            
            <!-- 直角符号∠ADC（步骤 3 显示） -->
            <path id="scene1-right-angle-d" d="M 375,285 L 390,285 L 390,300" fill="none" stroke="black" stroke-width="1" style="display:none;" class="fade-in"/>
            
            <!-- D 点（圆与 AB 交点） -->
            <circle id="scene1-point-d" cx="390" cy="300" r="4" fill="black" style="display:none;" class="fade-in"/>
            
            <!-- 顶点标签 -->
            <text id="scene1-label-a" x="565" y="170" font-size="16" fill="black">A</text>
            <text id="scene1-label-b" x="135" y="395" font-size="16" fill="black">B</text>
            <text id="scene1-label-c" x="565" y="395" font-size="16" fill="black">C</text>
            <text id="scene1-label-d" x="360" y="310" font-size="16" fill="black" style="display:none;">D</text>
            <text id="scene1-label-o" x="565" y="280" font-size="16" fill="black" style="display:none;">O</text>
            
            <!-- 长度标注 -->
            <text id="scene1-label-ac" x="570" y="230" font-size="14" fill="#1565c0">AC=6cm</text>
            <text id="scene1-label-bc" x="350" y="400" font-size="14" fill="#1565c0">BC=8cm</text>
            <text id="scene1-label-ab" x="340" y="260" font-size="14" fill="black" style="display:none;">AB=10cm</text>
            <text id="scene1-label-bd-result" x="260" y="340" font-size="16" fill="#c62828" font-weight="bold" style="display:none;">BD=6.4cm</text>
            
            <!-- 垂直关系标注（步骤 3） -->
            <text id="scene1-label-cd-perp" x="480" y="360" font-size="14" fill="#c62828" style="display:none;">CD⊥AB</text>
            <text id="scene1-label-adc-90" x="355" y="265" font-size="14" fill="#c62828" style="display:none;">∠ADC=90°</text>
            
            <!-- 相似标记（步骤 4） -->
            <text id="scene1-similarity-abc" x="420" y="320" font-size="20" fill="#2e7d32" style="display:none;">∽</text>
            <text id="scene1-similarity-cbd" x="300" y="360" font-size="20" fill="#2e7d32" style="display:none;">∽</text>
            
            <!-- 计算过程文本框（步骤 5） -->
            <rect id="scene1-calc-box" x="60" y="60" width="260" height="100" fill="#f5f5f5" stroke="#666" stroke-width="1" rx="5" style="display:none;"/>
            <text id="scene1-calc-title" x="75" y="82" font-size="14" font-weight="bold" fill="#333" style="display:none;">计算过程：</text>
            <text id="scene1-calc-1" x="75" y="102" font-size="12" fill="#333" style="display:none;">1. 勾股定理：AB = √(6²+8²) = 10cm</text>
            <text id="scene1-calc-2" x="75" y="122" font-size="12" fill="#333" style="display:none;">2. 相似：△ABC∽△CBD</text>
            <text id="scene1-calc-3" x="75" y="142" font-size="12" fill="#333" style="display:none;">   BC/AB = BD/BC ⇒ BD = 8²/10 = 6.4cm</text>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-prev-btn" disabled>◀ 上一步</button>
            <button id="scene1-next-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现 - 直角三角形与圆的综合几何关系
        // 状态机：currentStep (0-5)
        
        const scene1 = {
            currentStep: 0,
            totalSteps: 6,
            
            // 元素 ID 映射
            elements: {
                // 步骤 0（初始）
                triABC: 'scene1-tri-abc',
                rightAngleC: 'scene1-right-angle-c',
                labelA: 'scene1-label-a',
                labelB: 'scene1-label-b',
                labelC: 'scene1-label-c',
                labelAC: 'scene1-label-ac',
                labelBC: 'scene1-label-bc',
                
                // 步骤 1
                circle: 'scene1-circle',
                pointO: 'scene1-point-o',
                labelD: 'scene1-label-d',
                labelO: 'scene1-label-o',
                
                // 步骤 2
                pointD: 'scene1-point-d',
                lineCD: 'scene1-line-cd',
                
                // 步骤 3
                rightAngleD: 'scene1-right-angle-d',
                labelADC90: 'scene1-label-adc-90',
                labelCDPerp: 'scene1-label-cd-perp',
                
                // 步骤 4
                similarityABC: 'scene1-similarity-abc',
                similarityCBD: 'scene1-similarity-cbd',
                
                // 步骤 5
                labelAB: 'scene1-label-ab',
                labelBDResult: 'scene1-label-bd-result',
                calcBox: 'scene1-calc-box',
                calcTitle: 'scene1-calc-title',
                calc1: 'scene1-calc-1',
                calc2: 'scene1-calc-2',
                calc3: 'scene1-calc-3'
            },
            
            // 步骤元素分组
            stepElements: {
                0: ['triABC', 'rightAngleC', 'labelA', 'labelB', 'labelC', 'labelAC', 'labelBC'],
                1: ['circle', 'pointO', 'labelD', 'labelO'],
                2: ['pointD', 'lineCD'],
                3: ['rightAngleD', 'labelADC90', 'labelCDPerp'],
                4: ['similarityABC', 'similarityCBD'],
                5: ['labelAB', 'labelBDResult', 'calcBox', 'calcTitle', 'calc1', 'calc2', 'calc3']
            },
            
            init: function() {
                this.updateButtons();
                this.bindEvents();
            },
            
            bindEvents: function() {
                const prevBtn = document.getElementById('scene1-prev-btn');
                const nextBtn = document.getElementById('scene1-next-btn');
                
                prevBtn.addEventListener('click', () => this.prevStep());
                nextBtn.addEventListener('click', () => this.nextStep());
            },
            
            updateButtons: function() {
                const prevBtn = document.getElementById('scene1-prev-btn');
                const nextBtn = document.getElementById('scene1-next-btn');
                
                prevBtn.disabled = (this.currentStep === 0);
                nextBtn.disabled = (this.currentStep === this.totalSteps - 1);
            },
            
            prevStep: function() {
                if (this.currentStep > 0) {
                    this.currentStep--;
                    this.updateDisplay();
                    this.updateButtons();
                }
            },
            
            nextStep: function() {
                if (this.currentStep < this.totalSteps - 1) {
                    this.currentStep++;
                    this.updateDisplay();
                    this.updateButtons();
                }
            },
            
            updateDisplay: function() {
                // 显示当前步骤及之前所有步骤的元素
                for (let step = 0; step <= this.currentStep; step++) {
                    const elements = this.stepElements[step];
                    if (elements) {
                        elements.forEach(key => {
                            const el = document.getElementById(this.elements[key]);
                            if (el) {
                                el.style.display = 'block';
                                // 触发重绘以应用 fade-in 动画
                                el.style.opacity = '0';
                                setTimeout(() => {
                                    el.style.opacity = '1';
                                }, 10);
                            }
                        });
                    }
                }
            }
        };
        
        // 初始化
        scene1.init();
    })();
    </script>
</body>
</html>
