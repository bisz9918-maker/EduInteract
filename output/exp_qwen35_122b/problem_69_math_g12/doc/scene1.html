<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三棱柱结构分析与底面边长计算</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene1-controls button {
            padding: 8px 20px;
            font-size: 14px;
            border: 2px solid #1565c0;
            border-radius: 6px;
            background: #ffffff;
            color: #1565c0;
            cursor: pointer;
            transition: all 0.2s;
        }
        #scene1-controls button:hover:not(:disabled) {
            background: #1565c0;
            color: #ffffff;
        }
        #scene1-controls button:disabled {
            border-color: #ccc;
            color: #ccc;
            cursor: not-allowed;
        }
        .scene1-label { font-size: 14px; fill: #000000; }
        .scene1-annotation { font-size: 13px; font-weight: bold; }
        .scene1-blue { fill: #1565c0; }
        .scene1-red { fill: #c62828; }
        .scene1-green { fill: #2e7d32; }
        .scene1-hidden { display: none; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- 定义 -->
            <defs>
                <filter id="scene1-shadow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
                    <feOffset dx="1" dy="1" result="offsetblur"/>
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.3"/>
                    </feComponentTransfer>
                    <feMerge>
                        <feMergeNode/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
            </defs>

            <!-- 底面高亮填充 (步骤 3) -->
            <polygon id="scene1-base-fill" class="scene1-hidden" points="480,320 320,300 200,100" fill="#1565c0" opacity="0.2"/>

            <!-- 推导框 (步骤 3) -->
            <g id="scene1-deduction-box" class="scene1-hidden">
                <rect x="600" y="80" width="180" height="200" fill="#ffffff" stroke="#1565c0" stroke-width="2" rx="5"/>
                <text x="610" y="105" class="scene1-label" font-weight="bold" fill="#1565c0">底面△A₁B₁C₁为直角三角形</text>
                <text x="610" y="130" class="scene1-label">已知：A₁B₁=6，A₁C₁=2√34</text>
                <text x="610" y="155" class="scene1-label">由勾股定理：</text>
                <text x="610" y="180" class="scene1-label">B₁C₁² = A₁C₁² - A₁B₁²</text>
                <text x="630" y="205" class="scene1-label">= (2√34)² - 6²</text>
                <text x="630" y="230" class="scene1-label">= 136 - 36 = 100</text>
                <text x="610" y="255" class="scene1-label" font-weight="bold" fill="#c62828">∴ B₁C₁ = 10</text>
                <text id="scene1-deduction-extra" class="scene1-label scene1-hidden" x="610" y="290">六个顶点 A,B,C,A₁,B₁,C₁ 共球</text>
                <text id="scene1-deduction-extra2" class="scene1-label scene1-hidden" x="610" y="310">球心 O 为三棱柱外接球球心</text>
            </g>

            <!-- 棱 (按绘制顺序：先虚线后实线，实线覆盖虚线) -->
            <!-- 虚线棱 (被遮挡) -->
            <line id="scene1-edge-A1C1" x1="480" y1="320" x2="200" y2="100" stroke="#888888" stroke-width="1.5" stroke-dasharray="6,4"/>
            <line id="scene1-edge-AC" x1="480" y1="120" x2="200" y2="140" stroke="#888888" stroke-width="1.5" stroke-dasharray="6,4"/>

            <!-- 实线棱 (可见) -->
            <line id="scene1-edge-A1B1" x1="480" y1="320" x2="320" y2="300" stroke="#000000" stroke-width="2"/>
            <line id="scene1-edge-B1C1" x1="320" y1="300" x2="200" y2="100" stroke="#000000" stroke-width="2"/>
            <line id="scene1-edge-AB" x1="480" y1="120" x2="320" y2="100" stroke="#000000" stroke-width="2"/>
            <line id="scene1-edge-BC" x1="320" y1="100" x2="200" y2="140" stroke="#000000" stroke-width="2"/>
            <line id="scene1-edge-AA1" x1="480" y1="120" x2="480" y2="320" stroke="#000000" stroke-width="2"/>
            <line id="scene1-edge-BB1" x1="320" y1="100" x2="320" y2="300" stroke="#000000" stroke-width="2"/>
            <line id="scene1-edge-CC1" x1="200" y1="140" x2="200" y2="100" stroke="#000000" stroke-width="2"/>

            <!-- 整体轮廓高亮 (步骤 4) -->
            <g id="scene1-highlight" class="scene1-hidden">
                <line x1="480" y1="320" x2="320" y2="300" stroke="#2e7d32" stroke-width="3"/>
                <line x1="320" y1="300" x2="200" y2="100" stroke="#2e7d32" stroke-width="3"/>
                <line x1="480" y1="320" x2="480" y2="120" stroke="#2e7d32" stroke-width="3"/>
                <line x1="480" y1="120" x2="320" y2="100" stroke="#2e7d32" stroke-width="3"/>
                <line x1="320" y1="100" x2="200" y2="140" stroke="#2e7d32" stroke-width="3"/>
                <line x1="200" y1="140" x2="200" y2="100" stroke="#2e7d32" stroke-width="3"/>
                <line x1="480" y1="120" x2="200" y2="140" stroke="#2e7d32" stroke-width="3"/>
                <line x1="480" y1="120" x2="200" y2="100" stroke="#2e7d32" stroke-width="3"/>
            </g>

            <!-- 顶点 -->
            <circle id="scene1-vertex-A1" cx="480" cy="320" r="4" fill="#000000"/>
            <circle id="scene1-vertex-B1" cx="320" cy="300" r="4" fill="#000000"/>
            <circle id="scene1-vertex-C1" cx="200" cy="100" r="4" fill="#000000"/>
            <circle id="scene1-vertex-A" cx="480" cy="120" r="4" fill="#000000"/>
            <circle id="scene1-vertex-B" cx="320" cy="100" r="4" fill="#000000"/>
            <circle id="scene1-vertex-C" cx="200" cy="140" r="4" fill="#000000"/>

            <!-- 顶点标签 (调整 B₁ 位置避免与棱重叠) -->
            <text id="scene1-label-A1" x="490" y="330" class="scene1-label">A₁</text>
            <text id="scene1-label-B1" x="295" y="330" class="scene1-label">B₁</text>
            <text id="scene1-label-C1" x="185" y="90" class="scene1-label">C₁</text>
            <text id="scene1-label-A" x="490" y="110" class="scene1-label">A</text>
            <text id="scene1-label-B" x="310" y="85" class="scene1-label">B</text>
            <text id="scene1-label-C" x="185" y="145" class="scene1-label">C</text>

            <!-- 长度标注 (步骤 1) -->
            <text id="scene1-annotation-AA1" class="scene1-annotation scene1-blue scene1-hidden" x="510" y="220">AA₁=8</text>
            <text id="scene1-annotation-A1B1" class="scene1-annotation scene1-blue scene1-hidden" x="400" y="335">A₁B₁=6</text>
            <text id="scene1-annotation-A1C1" class="scene1-annotation scene1-blue scene1-hidden" x="340" y="200">A₁C₁=2√34</text>
            <text id="scene1-annotation-B1C1" class="scene1-annotation scene1-red scene1-hidden" x="250" y="190">B₁C₁=10</text>

            <!-- 直角符号 (步骤 2) -->
            <!-- ∠A₁B₁C₁ 直角符号在 B₁ 点内侧 -->
            <polyline id="scene1-rightangle-A1B1C1" class="scene1-red scene1-hidden" points="335,285 335,295 345,295" fill="none" stroke="#c62828" stroke-width="2"/>
            <!-- ∠AA₁B₁ 直角符号在 A₁ 点内侧 -->
            <polyline id="scene1-rightangle-AA1B1" class="scene1-red scene1-hidden" points="465,305 465,315 475,315" fill="none" stroke="#c62828" stroke-width="2"/>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1: 三棱柱结构分析与底面边长计算
        // 坐标表对照：
        // A₁(480,320), B₁(320,300), C₁(200,100)
        // A(480,120), B(320,100), C(200,140)

        const scene1 = {
            currentStep: 0,
            totalSteps: 4,

            // 获取元素
            get: function(id) {
                return document.getElementById('scene1-' + id);
            },

            // 显示元素 (同时设置 display 和 opacity)
            show: function(el) {
                if (el) {
                    el.style.display = '';
                    el.style.opacity = '1';
                }
            },

            // 隐藏元素
            hide: function(el) {
                if (el) {
                    el.style.display = 'none';
                    el.style.opacity = '0';
                }
            },

            // 更新按钮状态
            updateButtons: function() {
                const prevBtn = this.get('btn-prev');
                const nextBtn = this.get('btn-next');
                prevBtn.disabled = (this.currentStep === 0);
                nextBtn.disabled = (this.currentStep >= this.totalSteps);
                nextBtn.textContent = (this.currentStep >= this.totalSteps) ? '完成' : '下一步 ▶';
            },

            // 渲染当前步骤
            render: function() {
                const s = this.currentStep;

                // 步骤 0: 初始状态 - 只显示框架和标签
                // 步骤 1: 显示 3 个长度标注 (蓝)
                // 步骤 2: 显示 2 个直角符号 (红)
                // 步骤 3: 显示底面高亮、推导框、B₁C₁=10 标注
                // 步骤 4: 显示整体轮廓高亮、推导框额外文字

                // 长度标注 (步骤 1+)
                this.show(this.get('annotation-AA1'));
                this.show(this.get('annotation-A1B1'));
                this.show(this.get('annotation-A1C1'));
                if (s >= 3) {
                    this.show(this.get('annotation-B1C1'));
                } else {
                    this.hide(this.get('annotation-B1C1'));
                }

                // 直角符号 (步骤 2+)
                if (s >= 2) {
                    this.show(this.get('rightangle-A1B1C1'));
                    this.show(this.get('rightangle-AA1B1'));
                } else {
                    this.hide(this.get('rightangle-A1B1C1'));
                    this.hide(this.get('rightangle-AA1B1'));
                }

                // 底面高亮 (步骤 3+)
                if (s >= 3) {
                    this.show(this.get('base-fill'));
                    this.show(this.get('deduction-box'));
                } else {
                    this.hide(this.get('base-fill'));
                    this.hide(this.get('deduction-box'));
                }

                // 推导框额外文字 (步骤 4+)
                if (s >= 4) {
                    this.show(this.get('deduction-extra'));
                    this.show(this.get('deduction-extra2'));
                    this.show(this.get('highlight'));
                } else {
                    this.hide(this.get('deduction-extra'));
                    this.hide(this.get('deduction-extra2'));
                    this.hide(this.get('highlight'));
                }

                this.updateButtons();
            },

            // 下一步
            next: function() {
                if (this.currentStep < this.totalSteps) {
                    this.currentStep++;
                    this.render();
                }
            },

            // 上一步
            prev: function() {
                if (this.currentStep > 0) {
                    this.currentStep--;
                    this.render();
                }
            },

            // 初始化
            init: function() {
                const prevBtn = this.get('btn-prev');
                const nextBtn = this.get('btn-next');

                prevBtn.addEventListener('click', function() {
                    scene1.prev();
                });

                nextBtn.addEventListener('click', function() {
                    scene1.next();
                });

                this.render();
            }
        };

        // 启动
        scene1.init();
    })();
    </script>
</body>
</html>
