<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 3 - 电磁铁磁性变化与弹簧测力计示数关系</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Microsoft YaHei', sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        .scene3-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 2px solid #1565c0; border-radius: 6px; background: #fff; color: #1565c0; transition: all 0.2s; }
        .scene3-btn:hover { background: #1565c0; color: #fff; }
        .scene3-btn:disabled { border-color: #ccc; color: #ccc; cursor: not-allowed; }
        #scene3-step-display { font-size: 14px; color: #333; font-weight: bold; }
        svg { display: block; }
        .scene3-text { font-size: 13px; fill: #333; }
        .scene3-label { font-size: 12px; fill: #333; }
        .scene3-value { font-size: 14px; fill: #1565c0; font-weight: bold; }
        .scene3-conclusion { font-size: 14px; fill: #2e7d32; font-weight: bold; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg id="scene3-svg" width="800" height="500">
            <!-- 左侧电路图区域边框 -->
            <rect id="scene3-circuit-border" x="20" y="30" width="360" height="370" fill="none" stroke="#333" stroke-width="2"/>
            
            <!-- 右侧装置区域边框 -->
            <rect id="scene3-device-border" x="420" y="30" width="360" height="370" fill="none" stroke="#333" stroke-width="2"/>
            
            <!-- ========== 左侧电路图 ========== -->
            <!-- 电源 -->
            <g id="scene3-power">
                <line x1="220" y1="370" x2="220" y2="355" stroke="#000" stroke-width="3"/>
                <line x1="210" y1="370" x2="230" y2="370" stroke="#000" stroke-width="2"/>
                <line x1="215" y1="355" x2="225" y2="355" stroke="#000" stroke-width="2"/>
            </g>
            
            <!-- 开关 -->
            <g id="scene3-switch">
                <line x1="250" y1="370" x2="265" y2="370" stroke="#000" stroke-width="2"/>
                <line id="scene3-switch-line" x1="268" y1="370" x2="290" y2="370" stroke="#000" stroke-width="2"/>
                <line id="scene3-switch-open" x1="268" y1="370" x2="285" y2="355" stroke="#000" stroke-width="2"/>
                <circle id="scene3-switch-dot1" cx="268" cy="370" r="3" fill="#000"/>
                <circle id="scene3-switch-dot2" cx="290" cy="370" r="3" fill="#000"/>
            </g>
            
            <!-- 滑动变阻器 -->
            <g id="scene3-rheostat">
                <rect x="100" y="330" width="80" height="20" fill="none" stroke="#000" stroke-width="2"/>
                <line id="scene3-rheostat-slider" x1="130" y1="320" x2="130" y2="350" stroke="#1565c0" stroke-width="3"/>
                <polygon id="scene3-rheostat-arrow" points="130,315 125,320 135,320" fill="#1565c0"/>
            </g>
            
            <!-- 定值电阻 -->
            <rect id="scene3-resistor" x="100" y="210" width="80" height="20" fill="none" stroke="#000" stroke-width="2"/>
            
            <!-- 电流表 -->
            <g id="scene3-ammeter">
                <circle cx="65" cy="280" r="15" fill="#fff" stroke="#1565c0" stroke-width="2"/>
                <text x="65" y="285" text-anchor="middle" font-size="14" fill="#1565c0" font-weight="bold">A</text>
            </g>
            
            <!-- 电磁铁线圈 -->
            <g id="scene3-coil">
                <path id="scene3-coil-path" d="M330,260 Q325,265 330,270 Q335,275 330,280 Q325,285 330,290 Q335,295 330,300 Q325,305 330,310 Q335,315 330,320 Q325,325 330,330 Q335,335 330,340 Q325,345 330,350" fill="none" stroke="#1565c0" stroke-width="2"/>
                <line x1="330" y1="260" x2="330" y2="255" stroke="#000" stroke-width="2"/>
                <line x1="330" y1="350" x2="330" y2="355" stroke="#000" stroke-width="2"/>
            </g>
            
            <!-- 导线连接 -->
            <g id="scene3-wires">
                <!-- 电源正极到开关 -->
                <line x1="230" y1="365" x2="250" y2="365" stroke="#000" stroke-width="2"/>
                <!-- 开关到变阻器 -->
                <line x1="290" y1="370" x2="310" y2="370" stroke="#000" stroke-width="2"/>
                <line x1="310" y1="370" x2="310" y2="340" stroke="#000" stroke-width="2"/>
                <line x1="310" y1="340" x2="180" y2="340" stroke="#000" stroke-width="2"/>
                <!-- 变阻器到电阻 -->
                <line x1="100" y1="340" x2="80" y2="340" stroke="#000" stroke-width="2"/>
                <line x1="80" y1="340" x2="80" y2="220" stroke="#000" stroke-width="2"/>
                <line x1="80" y1="220" x2="100" y2="220" stroke="#000" stroke-width="2"/>
                <!-- 电阻到电流表 -->
                <line x1="100" y1="220" x2="80" y2="220" stroke="#000" stroke-width="2"/>
                <line x1="80" y1="220" x2="80" y2="280" stroke="#000" stroke-width="2"/>
                <!-- 电流表到电磁铁 -->
                <line x1="50" y1="280" x2="30" y2="280" stroke="#000" stroke-width="2"/>
                <line x1="30" y1="280" x2="30" y2="250" stroke="#000" stroke-width="2"/>
                <line x1="30" y1="250" x2="330" y2="250" stroke="#000" stroke-width="2"/>
                <!-- 电磁铁到电源负极 -->
                <line x1="330" y1="355" x2="330" y2="380" stroke="#000" stroke-width="2"/>
                <line x1="330" y1="380" x2="220" y2="380" stroke="#000" stroke-width="2"/>
            </g>
            
            <!-- 电流值显示（移到电流表下方，避免重叠） -->
            <text id="scene3-current-value" x="40" y="320" class="scene3-value">I = 0.0 A</text>
            
            <!-- ========== 右侧装置 ========== -->
            <!-- 固定支架 -->
            <line id="scene3-support" x1="600" y1="50" x2="700" y2="50" stroke="#000" stroke-width="3"/>
            <line id="scene3-support-hatch1" x1="620" y1="45" x2="620" y2="55" stroke="#000" stroke-width="1"/>
            <line id="scene3-support-hatch2" x1="640" y1="45" x2="640" y2="55" stroke="#000" stroke-width="1"/>
            <line id="scene3-support-hatch3" x1="660" y1="45" x2="660" y2="55" stroke="#000" stroke-width="1"/>
            <line id="scene3-support-hatch4" x1="680" y1="45" x2="680" y2="55" stroke="#000" stroke-width="1"/>
            
            <!-- 弹簧测力计外壳 -->
            <rect id="scene3-spring-case" x="635" y="60" width="30" height="120" fill="none" stroke="#000" stroke-width="2"/>
            
            <!-- 弹簧（锯齿线） -->
            <polyline id="scene3-spring" points="650,60 645,70 655,70 650,80 645,80 650,90 645,90 650,100 645,100 650,110 645,110 650,120 645,120 650,130 645,130 650,140 645,140 650,150 645,150 650,160 645,160 650,170 645,170 650,180 645,180 650,190 645,190 650,200" fill="none" stroke="#000" stroke-width="2"/>
            
            <!-- 指针 -->
            <line id="scene3-pointer" x1="667" y1="120" x2="680" y2="120" stroke="#c62828" stroke-width="2"/>
            
            <!-- 刻度盘 -->
            <line id="scene3-scale" x1="675" y1="80" x2="675" y2="160" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
            <line id="scene3-scale-mark1" x1="670" y1="90" x2="680" y2="90" stroke="#999" stroke-width="1"/>
            <line id="scene3-scale-mark2" x1="670" y1="110" x2="680" y2="110" stroke="#999" stroke-width="1"/>
            <line id="scene3-scale-mark3" x1="670" y1="130" x2="680" y2="130" stroke="#999" stroke-width="1"/>
            <line id="scene3-scale-mark4" x1="670" y1="150" x2="680" y2="150" stroke="#999" stroke-width="1"/>
            
            <!-- 挂钩 -->
            <path id="scene3-hook" d="M650,200 Q650,210 655,215" fill="none" stroke="#000" stroke-width="2"/>
            
            <!-- 铁球 -->
            <circle id="scene3-iron-ball" cx="650" cy="230" r="12" fill="#9e9e9e" fill-opacity="0.5" stroke="#616161" stroke-width="2"/>
            
            <!-- 电磁铁铁芯 -->
            <rect id="scene3-iron-core" x="620" y="280" width="60" height="100" fill="#9e9e9e" fill-opacity="0.3" stroke="#616161" stroke-width="2"/>
            
            <!-- 磁力线（贝塞尔曲线） -->
            <g id="scene3-magnetic-lines">
                <path id="scene3-line1" d="M650,280 Q640,250 650,242" fill="none" stroke="#c62828" stroke-width="2" opacity="0"/>
                <path id="scene3-line2" d="M635,300 Q625,260 650,242" fill="none" stroke="#c62828" stroke-width="2" opacity="0"/>
                <path id="scene3-line3" d="M665,300 Q675,260 650,242" fill="none" stroke="#c62828" stroke-width="2" opacity="0"/>
            </g>
            
            <!-- 标签（移到边框内部更右侧） -->
            <text id="scene3-label-ball" x="670" y="235" class="scene3-label">铁球</text>
            <text id="scene3-label-magnet" x="690" y="335" class="scene3-label">电磁铁</text>
            
            <!-- 测力计示数显示（移到边框内部更左侧，避免超出画布） -->
            <text id="scene3-force-value" x="720" y="120" class="scene3-value">F = 2.0 N</text>
            
            <!-- 结论标注（移到边框内部更下方且更左侧） -->
            <text id="scene3-conclusion" x="670" y="230" class="scene3-conclusion" opacity="0">示数变小</text>
        </svg>
        
        <div id="scene3-controls">
            <button id="scene3-prev" class="scene3-btn">◀ 上一步</button>
            <span id="scene3-step-display">步骤 1/6</span>
            <button id="scene3-next" class="scene3-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 3 实现
        // 布局坐标表（参考）：
        // | 元素 | 位置/范围 | 备注 |
        // | 电路图区域 | (20,30)-(380,400) | 左侧区域 |
        // | 右侧装置区域 | (420,30)-(780,400) | 右侧区域 |
        // | 电源 | (200,350)-(240,380) | 右下角 |
        // | 开关 | (250,350)-(290,380) | 电源左侧 |
        // | 滑动变阻器 | (100,320)-(180,350) | 滑片可移动 |
        // | 定值电阻 | (100,200)-(180,230) | 上方 |
        // | 电流表 | (50,265)-(80,295) | 左侧显示电流值 |
        // | 电磁铁线圈 | (320,250)-(340,350) | 右侧竖直 |
        // | 弹簧测力计外壳 | (640,60)-(660,180) | 竖直 |
        // | 弹簧 | (650,60)-(650,200) | 可伸缩 |
        // | 指针 | (662,120)-(675,120) | 可移动 |
        // | 铁球 | (650,230) | 悬挂 |
        // | 电磁铁铁芯 | (620,280)-(680,380) | 铁球下方 |
        
        const TOTAL_STEPS = 6;
        let currentStep = 0;
        
        // 状态数据
        const stepData = [
            // 步骤 0：初始状态（开关断开）
            {
                switchClosed: false,
                current: 0.0,
                springLength: 140,
                pointerY: 120,
                force: 2.0,
                magneticLines: [0, 0, 0],
                coilHighlight: 0,
                sliderX: 130,
                conclusion: false
            },
            // 步骤 1：闭合开关，电流产生
            {
                switchClosed: true,
                current: 0.5,
                springLength: 140,
                pointerY: 120,
                force: 2.0,
                magneticLines: [0, 0, 0],
                coilHighlight: 0,
                sliderX: 130,
                conclusion: false
            },
            // 步骤 2：电磁铁产生磁性，吸引铁球
            {
                switchClosed: true,
                current: 0.5,
                springLength: 155,
                pointerY: 135,
                force: 2.5,
                magneticLines: [0.8, 0.8, 0.8],
                coilHighlight: 1,
                sliderX: 130,
                conclusion: false
            },
            // 步骤 3：滑片右移，电流减小
            {
                switchClosed: true,
                current: 0.3,
                springLength: 155,
                pointerY: 135,
                force: 2.5,
                magneticLines: [0.8, 0.8, 0.8],
                coilHighlight: 1,
                sliderX: 160,
                conclusion: false
            },
            // 步骤 4：磁性减弱，吸引力减小
            {
                switchClosed: true,
                current: 0.3,
                springLength: 148,
                pointerY: 128,
                force: 2.2,
                magneticLines: [0.5, 0.5, 0],
                coilHighlight: 0.5,
                sliderX: 160,
                conclusion: false
            },
            // 步骤 5：结论（示数变小）
            {
                switchClosed: true,
                current: 0.3,
                springLength: 142,
                pointerY: 122,
                force: 2.0,
                magneticLines: [0.2, 0, 0],
                coilHighlight: 0.2,
                sliderX: 160,
                conclusion: true
            }
        ];
        
        // 获取 DOM 元素
        const els = {
            switchLine: document.getElementById('scene3-switch-line'),
            switchOpen: document.getElementById('scene3-switch-open'),
            switchDot1: document.getElementById('scene3-switch-dot1'),
            switchDot2: document.getElementById('scene3-switch-dot2'),
            rheostatSlider: document.getElementById('scene3-rheostat-slider'),
            rheostatArrow: document.getElementById('scene3-rheostat-arrow'),
            coilPath: document.getElementById('scene3-coil-path'),
            spring: document.getElementById('scene3-spring'),
            pointer: document.getElementById('scene3-pointer'),
            ironBall: document.getElementById('scene3-iron-ball'),
            magneticLines: [
                document.getElementById('scene3-line1'),
                document.getElementById('scene3-line2'),
                document.getElementById('scene3-line3')
            ],
            currentValue: document.getElementById('scene3-current-value'),
            forceValue: document.getElementById('scene3-force-value'),
            conclusion: document.getElementById('scene3-conclusion'),
            stepDisplay: document.getElementById('scene3-step-display'),
            prevBtn: document.getElementById('scene3-prev'),
            nextBtn: document.getElementById('scene3-next')
        };
        
        // 渲染当前步骤
        function renderStep() {
            const data = stepData[currentStep];
            
            // 开关状态
            if (data.switchClosed) {
                els.switchOpen.style.opacity = '0';
                els.switchLine.style.opacity = '1';
                els.switchLine.setAttribute('x2', '290');
                els.switchLine.setAttribute('y2', '370');
            } else {
                els.switchOpen.style.opacity = '1';
                els.switchLine.style.opacity = '1';
                els.switchLine.setAttribute('x2', '268');
                els.switchLine.setAttribute('y2', '370');
            }
            
            // 滑片位置
            els.rheostatSlider.setAttribute('x1', data.sliderX);
            els.rheostatSlider.setAttribute('x2', data.sliderX);
            els.rheostatArrow.setAttribute('points', `${data.sliderX},315 ${data.sliderX-5},320 ${data.sliderX+5},320`);
            
            // 线圈高亮
            els.coilPath.setAttribute('stroke', '#1565c0');
            els.coilPath.setAttribute('stroke-opacity', data.coilHighlight);
            els.coilPath.setAttribute('stroke-width', 2 + data.coilHighlight * 2);
            
            // 弹簧长度（通过 points 调整）
            const springBase = '650,60 645,70 655,70 650,80 645,80 650,90 645,90 650,100 645,100 650,110 645,110 650,120 645,120 650,130 645,130 650,140 645,140 650,150 645,150 650,160 645,160 650,170 645,170 650,180 645,180 650,190 645,190 650,200';
            const springExtended = '650,60 645,75 655,75 650,90 645,90 650,105 645,105 650,120 645,120 650,135 645,135 650,150 645,150 650,165 645,165 650,180 645,180 650,195 645,195 650,210 645,210 650,225 645,225 650,240 645,240 650,255 645,255 650,270 645,270 650,285';
            if (data.springLength > 145) {
                els.spring.setAttribute('points', springExtended);
            } else {
                els.spring.setAttribute('points', springBase);
            }
            
            // 指针位置
            els.pointer.setAttribute('y1', data.pointerY);
            els.pointer.setAttribute('y2', data.pointerY);
            
            // 铁球位置
            els.ironBall.setAttribute('cy', 230 + (data.springLength - 140) / 2);
            
            // 磁力线
            els.magneticLines.forEach((line, i) => {
                line.setAttribute('opacity', data.magneticLines[i]);
            });
            
            // 数值显示
            els.currentValue.textContent = `I = ${data.current.toFixed(1)} A`;
            els.forceValue.textContent = `F = ${data.force.toFixed(1)} N`;
            
            // 结论标注
            els.conclusion.style.opacity = data.conclusion ? '1' : '0';
            
            // 步骤显示
            els.stepDisplay.textContent = `步骤 ${currentStep + 1}/${TOTAL_STEPS}`;
            
            // 按钮状态
            els.prevBtn.disabled = currentStep === 0;
            els.nextBtn.disabled = currentStep === TOTAL_STEPS - 1;
        }
        
        // 事件绑定
        els.prevBtn.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        });
        
        els.nextBtn.addEventListener('click', function() {
            if (currentStep < TOTAL_STEPS - 1) {
                currentStep++;
                renderStep();
            }
        });
        
        // 初始化
        renderStep();
    })();
    </script>
</body>
</html>
