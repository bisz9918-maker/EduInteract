<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四棱锥 P-ABCD 几何结构分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: Arial, sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene1-controls button { width: 80px; height: 30px; font-size: 14px; cursor: pointer; border: 1px solid #333; border-radius: 4px; background: #f5f5f5; }
        #scene1-controls button:hover:not(:disabled) { background: #e0e0e0; }
        #scene1-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-step-indicator { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); font-size: 14px; color: #333; }
        .fade-in { animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- 平面填充（底层） -->
            <polygon id="scene1-plane-mbd" points="420,380 280,280 420,180" fill="#1565c0" opacity="0" style="display: none;"/>
            <polygon id="scene1-plane-pcd" points="150,80 620,280 280,280" fill="#c62828" opacity="0" style="display: none;"/>
            
            <!-- 底面对角线（虚线） -->
            <line id="scene1-diagonal-ac" x1="150" y1="380" x2="620" y2="280" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" style="display: none;"/>
            <line id="scene1-diagonal-bd" x1="420" y1="380" x2="280" y2="280" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" style="display: none;"/>
            
            <!-- 不可见棱（虚线） -->
            <line id="scene1-edge-pd" x1="150" y1="80" x2="280" y2="280" stroke="#888880" stroke-width="2" stroke-dasharray="5,5"/>
            <line id="scene1-edge-cd" x1="620" y1="280" x2="280" y2="280" stroke="#888880" stroke-width="2" stroke-dasharray="5,5"/>
            <line id="scene1-edge-da" x1="280" y1="280" x2="150" y2="380" stroke="#888880" stroke-width="2" stroke-dasharray="5,5"/>
            
            <!-- 可见棱（实线） -->
            <line id="scene1-edge-pa" x1="150" y1="80" x2="150" y2="380" stroke="#000000" stroke-width="3"/>
            <line id="scene1-edge-pb" x1="150" y1="80" x2="420" y2="380" stroke="#000000" stroke-width="3"/>
            <line id="scene1-edge-pc" x1="150" y1="80" x2="620" y2="280" stroke="#000000" stroke-width="3"/>
            <line id="scene1-edge-ab" x1="150" y1="380" x2="420" y2="380" stroke="#000000" stroke-width="3"/>
            <line id="scene1-edge-bc" x1="420" y1="380" x2="620" y2="280" stroke="#000000" stroke-width="3"/>
            
            <!-- 内部线段 DM、BM（虚线） -->
            <line id="scene1-segment-dm" x1="280" y1="280" x2="420" y2="180" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" style="display: none;"/>
            <line id="scene1-segment-bm" x1="420" y1="380" x2="420" y2="180" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" style="display: none;"/>
            
            <!-- 直角标记 -->
            <path id="scene1-right-angle-pa" d="M 165 380 L 165 365 L 180 365" stroke="#000000" stroke-width="1.5" fill="none" style="display: none;"/>
            <path id="scene1-right-angle-acbd" d="M 380 345 L 380 330 L 395 330" stroke="#000000" stroke-width="1.5" fill="none" style="display: none;"/>
            <path id="scene1-right-angle-dmpc" d="M 410 190 L 410 175 L 425 175" stroke="#000000" stroke-width="1.5" fill="none" style="display: none;"/>
            
            <!-- 顶点 -->
            <circle id="scene1-vertex-p" cx="150" cy="80" r="4" fill="#000000"/>
            <circle id="scene1-vertex-a" cx="150" cy="380" r="4" fill="#000000"/>
            <circle id="scene1-vertex-b" cx="420" cy="380" r="4" fill="#000000"/>
            <circle id="scene1-vertex-c" cx="620" cy="280" r="4" fill="#000000"/>
            <circle id="scene1-vertex-d" cx="280" cy="280" r="4" fill="#000000"/>
            <circle id="scene1-vertex-m" cx="420" cy="180" r="4" fill="#000000" style="display: none;"/>
            
            <!-- 顶点标签 -->
            <text id="scene1-label-p" x="130" y="70" font-size="16" fill="#000000">P</text>
            <text id="scene1-label-a" x="130" y="395" font-size="16" fill="#000000">A</text>
            <text id="scene1-label-b" x="430" y="395" font-size="16" fill="#000000">B</text>
            <text id="scene1-label-c" x="635" y="285" font-size="16" fill="#000000">C</text>
            <text id="scene1-label-d" x="255" y="285" font-size="16" fill="#000000">D</text>
            <text id="scene1-label-m" x="435" y="175" font-size="16" fill="#000000" style="display: none;">M</text>
            
            <!-- 标注文字 -->
            <text id="scene1-annotation-pa" x="170" y="230" font-size="12" fill="#000000">PA⊥底面</text>
            <text id="scene1-annotation-acbd" x="395" y="360" font-size="12" fill="#000000" style="display: none;">AC⊥BD</text>
            <text id="scene1-annotation-dmpc" x="440" y="200" font-size="12" fill="#000000" style="display: none;">DM⊥PC</text>
            
            <!-- 结论文字（最终步骤） -->
            <text id="scene1-conclusion" x="400" y="40" font-size="16" fill="#000000" text-anchor="middle" style="display: none;">平面 MBD⊥平面 PCD</text>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-prev">◀ 上一步</button>
            <button id="scene1-next">下一步 ▶</button>
        </div>
        <div id="scene1-step-indicator">步骤 0/7</div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现 - 四棱锥 P-ABCD 几何结构分析
        // 布局坐标表：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // |------|------|-----------|------|-------------|------|
        // | 顶点 P | 点 | (150,80) | 4 | 左上(-10,-10) | 四棱锥顶点 |
        // | 顶点 A | 点 | (150,380) | 4 | 左下(-10,+10) | 底面左前 |
        // | 顶点 B | 点 | (420,380) | 4 | 右下(+10,+10) | 底面右前 |
        // | 顶点 C | 点 | (620,280) | 4 | 右(+15,0) | 底面右后 |
        // | 顶点 D | 点 | (280,280) | 4 | 左(-15,0) | 底面左后 |
        // | 动点 M | 点 | (420,180) | 4 | 右上(+10,-10) | PC 上的点 |
        
        const TOTAL_STEPS = 7;
        let currentStep = 0;
        
        // 状态对象：每个步骤应显示/高亮的元素
        const stepStates = [
            // 步骤 0：初始状态 - 四棱锥基本结构
            {
                show: ['edge-pa', 'edge-pb', 'edge-pc', 'edge-pd', 'edge-ab', 'edge-bc', 'edge-cd', 'edge-da',
                       'vertex-p', 'vertex-a', 'vertex-b', 'vertex-c', 'vertex-d',
                       'label-p', 'label-a', 'label-b', 'label-c', 'label-d',
                       'annotation-pa'],
                highlight: {},
                hide: ['diagonal-ac', 'diagonal-bd', 'segment-dm', 'segment-bm', 'vertex-m',
                       'label-m', 'right-angle-pa', 'right-angle-acbd', 'right-angle-dmpc',
                       'annotation-acbd', 'annotation-dmpc', 'plane-mbd', 'plane-pcd', 'conclusion']
            },
            // 步骤 1：显示底面对角线 AC、BD，直角标记 AC⊥BD
            {
                show: ['edge-pa', 'edge-pb', 'edge-pc', 'edge-pd', 'edge-ab', 'edge-bc', 'edge-cd', 'edge-da',
                       'diagonal-ac', 'diagonal-bd',
                       'vertex-p', 'vertex-a', 'vertex-b', 'vertex-c', 'vertex-d',
                       'label-p', 'label-a', 'label-b', 'label-c', 'label-d',
                       'annotation-pa', 'right-angle-acbd', 'annotation-acbd'],
                highlight: { 'edge-ab': { stroke: '#000000', strokeWidth: 5 },
                            'edge-bc': { stroke: '#000000', strokeWidth: 5 },
                            'edge-cd': { stroke: '#888880', strokeWidth: 5 },
                            'edge-da': { stroke: '#888880', strokeWidth: 5 } },
                hide: ['segment-dm', 'segment-bm', 'vertex-m', 'label-m', 'right-angle-pa', 'right-angle-dmpc',
                       'annotation-dmpc', 'plane-mbd', 'plane-pcd', 'conclusion']
            },
            // 步骤 2：PA 加粗高亮，显示直角标记 PA⊥底面
            {
                show: ['edge-pa', 'edge-pb', 'edge-pc', 'edge-pd', 'edge-ab', 'edge-bc', 'edge-cd', 'edge-da',
                       'diagonal-ac', 'diagonal-bd',
                       'vertex-p', 'vertex-a', 'vertex-b', 'vertex-c', 'vertex-d',
                       'label-p', 'label-a', 'label-b', 'label-c', 'label-d',
                       'annotation-pa', 'right-angle-pa'],
                highlight: { 'edge-pa': { stroke: '#1565c0', strokeWidth: 5 } },
                hide: ['segment-dm', 'segment-bm', 'vertex-m', 'label-m', 'right-angle-acbd', 'right-angle-dmpc',
                       'annotation-acbd', 'annotation-dmpc', 'plane-mbd', 'plane-pcd', 'conclusion']
            },
            // 步骤 3：BD 加粗高亮，显示 BD⊥平面 PAC
            {
                show: ['edge-pa', 'edge-pb', 'edge-pc', 'edge-pd', 'edge-ab', 'edge-bc', 'edge-cd', 'edge-da',
                       'diagonal-ac', 'diagonal-bd',
                       'vertex-p', 'vertex-a', 'vertex-b', 'vertex-c', 'vertex-d',
                       'label-p', 'label-a', 'label-b', 'label-c', 'label-d',
                       'annotation-pa', 'right-angle-pa'],
                highlight: { 'edge-pa': { stroke: '#1565c0', strokeWidth: 5 },
                            'diagonal-ac': { stroke: '#1565c0', strokeWidth: 5 },
                            'diagonal-bd': { stroke: '#2e7d32', strokeWidth: 4 } },
                hide: ['segment-dm', 'segment-bm', 'vertex-m', 'label-m', 'right-angle-acbd', 'right-angle-dmpc',
                       'annotation-acbd', 'annotation-dmpc', 'plane-mbd', 'plane-pcd', 'conclusion']
            },
            // 步骤 4：显示动点 M，线段 DM、BM
            {
                show: ['edge-pa', 'edge-pb', 'edge-pc', 'edge-pd', 'edge-ab', 'edge-bc', 'edge-cd', 'edge-da',
                       'diagonal-ac', 'diagonal-bd',
                       'segment-dm', 'segment-bm', 'vertex-m',
                       'vertex-p', 'vertex-a', 'vertex-b', 'vertex-c', 'vertex-d',
                       'label-p', 'label-a', 'label-b', 'label-c', 'label-d', 'label-m',
                       'annotation-pa', 'right-angle-pa'],
                highlight: { 'edge-pa': { stroke: '#1565c0', strokeWidth: 5 },
                            'diagonal-ac': { stroke: '#1565c0', strokeWidth: 5 },
                            'diagonal-bd': { stroke: '#2e7d32', strokeWidth: 4 } },
                hide: ['right-angle-acbd', 'right-angle-dmpc', 'annotation-acbd', 'annotation-dmpc',
                       'plane-mbd', 'plane-pcd', 'conclusion']
            },
            // 步骤 5：显示直角标记 DM⊥PC，标注 DM⊥PC
            {
                show: ['edge-pa', 'edge-pb', 'edge-pc', 'edge-pd', 'edge-ab', 'edge-bc', 'edge-cd', 'edge-da',
                       'diagonal-ac', 'diagonal-bd',
                       'segment-dm', 'segment-bm', 'vertex-m',
                       'vertex-p', 'vertex-a', 'vertex-b', 'vertex-c', 'vertex-d',
                       'label-p', 'label-a', 'label-b', 'label-c', 'label-d', 'label-m',
                       'annotation-pa', 'right-angle-pa', 'right-angle-dmpc', 'annotation-dmpc'],
                highlight: { 'edge-pa': { stroke: '#1565c0', strokeWidth: 5 },
                            'diagonal-ac': { stroke: '#1565c0', strokeWidth: 5 },
                            'diagonal-bd': { stroke: '#2e7d32', strokeWidth: 4 },
                            'segment-dm': { stroke: '#2e7d32', strokeWidth: 3 },
                            'edge-pc': { stroke: '#2e7d32', strokeWidth: 4 } },
                hide: ['right-angle-acbd', 'annotation-acbd', 'plane-mbd', 'plane-pcd', 'conclusion']
            },
            // 步骤 6：显示平面 MBD 和平面 PCD 填充，结论
            {
                show: ['edge-pa', 'edge-pb', 'edge-pc', 'edge-pd', 'edge-ab', 'edge-bc', 'edge-cd', 'edge-da',
                       'diagonal-ac', 'diagonal-bd',
                       'segment-dm', 'segment-bm', 'vertex-m',
                       'vertex-p', 'vertex-a', 'vertex-b', 'vertex-c', 'vertex-d',
                       'label-p', 'label-a', 'label-b', 'label-c', 'label-d', 'label-m',
                       'annotation-pa', 'right-angle-pa', 'right-angle-dmpc', 'annotation-dmpc',
                       'plane-mbd', 'plane-pcd', 'conclusion'],
                highlight: { 'edge-pa': { stroke: '#1565c0', strokeWidth: 5 },
                            'diagonal-ac': { stroke: '#1565c0', strokeWidth: 5 },
                            'diagonal-bd': { stroke: '#2e7d32', strokeWidth: 4 },
                            'segment-dm': { stroke: '#2e7d32', strokeWidth: 3 },
                            'edge-pc': { stroke: '#2e7d32', strokeWidth: 4 } },
                hide: ['right-angle-acbd', 'annotation-acbd']
            }
        ];
        
        // 工具函数：显示元素
        function showElement(id) {
            const el = document.getElementById('scene1-' + id);
            if (el) {
                el.style.display = '';
                el.style.opacity = '1';
                el.classList.add('fade-in');
            }
        }
        
        // 工具函数：隐藏元素
        function hideElement(id) {
            const el = document.getElementById('scene1-' + id);
            if (el) {
                el.style.display = 'none';
                el.style.opacity = '0';
                el.classList.remove('fade-in');
            }
        }
        
        // 工具函数：高亮元素
        function highlightElement(id, props) {
            const el = document.getElementById('scene1-' + id);
            if (el) {
                if (props.stroke) el.style.stroke = props.stroke;
                if (props.strokeWidth) el.style.strokeWidth = props.strokeWidth;
            }
        }
        
        // 工具函数：恢复元素默认样式
        function resetElement(id) {
            const el = document.getElementById('scene1-' + id);
            if (el) {
                el.style.stroke = '';
                el.style.strokeWidth = '';
            }
        }
        
        // 更新场景显示
        function updateScene() {
            const state = stepStates[currentStep];
            
            // 先重置所有元素的高亮
            const allElements = ['edge-pa', 'edge-pb', 'edge-pc', 'edge-pd', 'edge-ab', 'edge-bc', 'edge-cd', 'edge-da',
                                 'diagonal-ac', 'diagonal-bd', 'segment-dm', 'segment-bm'];
            allElements.forEach(id => resetElement(id));
            
            // 显示当前步骤的元素
            state.show.forEach(id => showElement(id));
            
            // 隐藏当前步骤不需要的元素
            state.hide.forEach(id => hideElement(id));
            
            // 应用高亮
            for (const [id, props] of Object.entries(state.highlight)) {
                highlightElement(id, props);
            }
            
            // 更新步骤指示器
            document.getElementById('scene1-step-indicator').textContent = '步骤 ' + currentStep + '/' + TOTAL_STEPS;
            
            // 更新按钮状态
            document.getElementById('scene1-prev').disabled = (currentStep === 0);
            document.getElementById('scene1-next').disabled = (currentStep === TOTAL_STEPS);
        }
        
        // 事件绑定
        document.getElementById('scene1-prev').addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });
        
        document.getElementById('scene1-next').addEventListener('click', function() {
            if (currentStep < TOTAL_STEPS) {
                currentStep++;
                updateScene();
            }
        });
        
        // 初始化：显示步骤 0
        updateScene();
    })();
    </script>
</body>
</html>
