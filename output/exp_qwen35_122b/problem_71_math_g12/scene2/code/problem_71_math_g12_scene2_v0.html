<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 正六边形内接圆与向量夹角</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Microsoft YaHei', sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 12px; z-index: 10; }
        #scene2-slider { width: 400px; }
        #scene2-slider-label { font-size: 14px; color: #666; }
        .scene2-vertex-label { font-size: 15px; fill: #000; font-weight: bold; }
        .scene2-angle-label { font-size: 13px; fill: #1565c0; font-weight: bold; }
        .scene2-point-label { font-size: 14px; fill: #000; }
        .scene2-p-label { font-size: 15px; fill: #d32f2f; font-weight: bold; }
        #scene2-数列框 { fill: #e3f2fd; stroke: #1565c0; stroke-width: 2; }
        .scene2-数列标题 { font-size: 15px; fill: #000; font-weight: bold; }
        .scene2-数列值 { font-size: 14px; fill: #000; }
        .scene2-α3-highlight { font-size: 17px; fill: #2e7d32; font-weight: bold; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" id="scene2-svg">
            <defs>
                <marker id="scene2-arrow-black" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#000" />
                </marker>
                <marker id="scene2-arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#d32f2f" />
                </marker>
            </defs>

            <!-- 圆 O -->
            <circle id="scene2-circle" cx="400" cy="250" r="150" fill="none" stroke="#000" stroke-width="2" />

            <!-- 正六边形 -->
            <polygon id="scene2-polygon" points="550,250 475,120 325,120 250,250 325,380 475,380" fill="none" stroke="#000" stroke-width="2" />

            <!-- 向量 OA₁~OA₆ -->
            <line id="scene2-vec-oa1" x1="400" y1="250" x2="550" y2="250" stroke="#000" stroke-width="1.5" marker-end="url(#scene2-arrow-black)" />
            <line id="scene2-vec-oa2" x1="400" y1="250" x2="475" y2="120" stroke="#000" stroke-width="1.5" marker-end="url(#scene2-arrow-black)" />
            <line id="scene2-vec-oa3" x1="400" y1="250" x2="325" y2="120" stroke="#000" stroke-width="1.5" marker-end="url(#scene2-arrow-black)" />
            <line id="scene2-vec-oa4" x1="400" y1="250" x2="250" y2="250" stroke="#000" stroke-width="1.5" marker-end="url(#scene2-arrow-black)" />
            <line id="scene2-vec-oa5" x1="400" y1="250" x2="325" y2="380" stroke="#000" stroke-width="1.5" marker-end="url(#scene2-arrow-black)" />
            <line id="scene2-vec-oa6" x1="400" y1="250" x2="475" y2="380" stroke="#000" stroke-width="1.5" marker-end="url(#scene2-arrow-black)" />

            <!-- 圆心 O -->
            <circle id="scene2-point-o" cx="400" cy="250" r="4" fill="#000" />
            <text id="scene2-label-o" x="400" y="295" text-anchor="middle" class="scene2-point-label">O</text>

            <!-- 顶点 A₁~A₆ (标签移到圆外更远处) -->
            <circle id="scene2-point-a1" cx="550" cy="250" r="4" fill="#000" />
            <text id="scene2-label-a1" x="590" y="255" text-anchor="start" class="scene2-vertex-label">A₁</text>
            <circle id="scene2-point-a2" cx="475" cy="120" r="4" fill="#000" />
            <text id="scene2-label-a2" x="510" y="95" text-anchor="start" class="scene2-vertex-label">A₂</text>
            <circle id="scene2-point-a3" cx="325" cy="120" r="4" fill="#000" />
            <text id="scene2-label-a3" x="290" y="95" text-anchor="end" class="scene2-vertex-label">A₃</text>
            <circle id="scene2-point-a4" cx="250" cy="250" r="4" fill="#000" />
            <text id="scene2-label-a4" x="210" y="255" text-anchor="end" class="scene2-vertex-label">A₄</text>
            <circle id="scene2-point-a5" cx="325" cy="380" r="4" fill="#000" />
            <text id="scene2-label-a5" x="290" y="425" text-anchor="end" class="scene2-vertex-label">A₅</text>
            <circle id="scene2-point-a6" cx="475" cy="380" r="4" fill="#000" />
            <text id="scene2-label-a6" x="510" y="425" text-anchor="start" class="scene2-vertex-label">A₆</text>

            <!-- 动点 P -->
            <circle id="scene2-point-p" cx="550" cy="250" r="7" fill="#d32f2f" />
            <text id="scene2-label-p" x="575" y="240" text-anchor="start" class="scene2-p-label">P</text>

            <!-- 向量 OP -->
            <line id="scene2-vector-op" x1="400" y1="250" x2="550" y2="250" stroke="#d32f2f" stroke-width="2.5" marker-end="url(#scene2-arrow-red)" />

            <!-- 夹角 θ₁~θ₆ 标签 (移到圆外右侧固定位置，增加行间距) -->
            <text id="scene2-label-theta1" x="640" y="170" text-anchor="start" class="scene2-angle-label">θ₁=</text>
            <text id="scene2-label-theta2" x="640" y="205" text-anchor="start" class="scene2-angle-label">θ₂=</text>
            <text id="scene2-label-theta3" x="640" y="240" text-anchor="start" class="scene2-angle-label">θ₃=</text>
            <text id="scene2-label-theta4" x="640" y="275" text-anchor="start" class="scene2-angle-label">θ₄=</text>
            <text id="scene2-label-theta5" x="640" y="310" text-anchor="start" class="scene2-angle-label">θ₅=</text>
            <text id="scene2-label-theta6" x="640" y="345" text-anchor="start" class="scene2-angle-label">θ₆=</text>

            <!-- 数列显示框 (移到左侧空白区域，增加内边距) -->
            <rect id="scene2-数列框" x="30" y="360" width="300" height="110" rx="5" />
            <text id="scene2-数列标题" x="50" y="385" class="scene2-数列标题">排序后：</text>
            <text id="scene2-α1" x="50" y="405" class="scene2-数列值">α₁=</text>
            <text id="scene2-α2" x="195" y="405" class="scene2-数列值">α₂=</text>
            <text id="scene2-α3" x="50" y="430" class="scene2-数列值">α₃=</text>
            <text id="scene2-α4" x="195" y="430" class="scene2-数列值">α₄=</text>
            <text id="scene2-α5" x="50" y="455" class="scene2-数列值">α₅=</text>
            <text id="scene2-α6" x="195" y="455" class="scene2-数列值">α₆=</text>
            <text id="scene2-α3-highlight" x="180" y="490" text-anchor="middle" class="scene2-α3-highlight">α₃ = </text>
        </svg>

        <!-- 控件栏 -->
        <div id="scene2-controls">
            <span id="scene2-slider-label">拖动点 P 沿圆周移动</span>
            <input type="range" id="scene2-slider" min="0" max="360" value="0" step="1" />
        </div>
    </div>

    <script>
    (function() {
        const svg = document.getElementById('scene2-svg');
        const slider = document.getElementById('scene2-slider');

        const vertices = [
            { id: 'a1', angle: 0 },
            { id: 'a2', angle: 60 },
            { id: 'a3', angle: 120 },
            { id: 'a4', angle: 180 },
            { id: 'a5', angle: 240 },
            { id: 'a6', angle: 300 }
        ];

        const centerX = 400, centerY = 250, radius = 150;

        function degToRad(deg) {
            return deg * Math.PI / 180;
        }

        function getPointP(angle) {
            return {
                x: centerX + radius * Math.cos(degToRad(angle)),
                y: centerY + radius * Math.sin(degToRad(angle))
            };
        }

        function minAngleDiff(angle1, angle2) {
            let diff = Math.abs(angle1 - angle2) % 360;
            return Math.min(diff, 360 - diff);
        }

        function updateDisplay() {
            const pAngle = parseFloat(slider.value);
            const p = getPointP(pAngle);

            document.getElementById('scene2-point-p').setAttribute('cx', p.x);
            document.getElementById('scene2-point-p').setAttribute('cy', p.y);
            document.getElementById('scene2-vector-op').setAttribute('x2', p.x);
            document.getElementById('scene2-vector-op').setAttribute('y2', p.y);

            const pLabelX = p.x + 25;
            const pLabelY = p.y - 10;
            document.getElementById('scene2-label-p').setAttribute('x', pLabelX);
            document.getElementById('scene2-label-p').setAttribute('y', pLabelY);

            const theta = [];
            for (let i = 0; i < 6; i++) {
                theta.push(minAngleDiff(pAngle, vertices[i].angle));
            }

            // 更新夹角标签 (移到圆外右侧固定位置)
            const labelYStart = 170;
            for (let i = 0; i < 6; i++) {
                const label = document.getElementById(`scene2-label-theta${i+1}`);
                label.textContent = `θ${i+1}=${Math.round(theta[i])}°`;
                label.setAttribute('y', labelYStart + i * 35);
            }

            // 排序角度
            const sorted = [...theta].sort((a, b) => a - b);

            // 更新数列显示
            const alphaLabels = ['α1', 'α2', 'α3', 'α4', 'α5', 'α6'];
            const xPositions = [50, 195, 50, 195, 50, 195];
            const yPositions = [405, 405, 430, 430, 455, 455];

            for (let i = 0; i < 6; i++) {
                const el = document.getElementById(`scene2-${alphaLabels[i]}`);
                el.textContent = `α${i+1}=${Math.round(sorted[i])}°`;
                el.setAttribute('x', xPositions[i]);
                el.setAttribute('y', yPositions[i]);
            }

            const highlight = document.getElementById('scene2-α3-highlight');
            highlight.textContent = `α₃ = ${Math.round(sorted[2])}°`;
        }

        slider.addEventListener('input', updateDisplay);
        updateDisplay();
    })();
    </script>
</body>
</html>
