<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>能量转化与电量计算 - Scene 2</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene2-btn {
            padding: 8px 20px;
            font-size: 14px;
            border: 2px solid #1565c0;
            border-radius: 6px;
            background: #ffffff;
            color: #1565c0;
            cursor: pointer;
            transition: all 0.2s;
        }
        .scene2-btn:hover:not(:disabled) {
            background: #1565c0;
            color: #ffffff;
        }
        .scene2-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" viewBox="0 0 800 500">
            <!-- 标题（y 从 40 改为 45，满足 20px 边缘间距） -->
            <text id="scene2-title" x="400" y="45" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000">能量转化与电量计算</text>

            <!-- 文字元素先定义（这样会在矩形上方显示） -->
            <!-- 重力势能框内容 -->
            <text id="scene2-text-gpe-label" x="95" y="117" font-size="14" fill="#000000" opacity="0">重力势能</text>
            <text id="scene2-text-gpe-formula" x="95" y="137" font-size="14" fill="#000000" opacity="0">ΔE<sub>p</sub> = mgh</text>

            <!-- 动能框内容 -->
            <text id="scene2-text-ke-label" x="95" y="237" font-size="14" fill="#000000" opacity="0">动能</text>
            <text id="scene2-text-ke-formula" x="95" y="257" font-size="14" fill="#000000" opacity="0">ΔE<sub>k</sub> = ½mv<sub>m</sub>²</text>

            <!-- 电能框内容 -->
            <text id="scene2-text-elec-label" x="275" y="237" font-size="14" fill="#000000" opacity="0">电能</text>
            <text id="scene2-text-elec-formula" x="275" y="257" font-size="14" fill="#c62828" font-weight="bold" opacity="0">Q<sub>电</sub> = 1.5J</text>

            <!-- 能量守恒关系文字 -->
            <text id="scene2-text-conservation" x="400" y="195" text-anchor="middle" font-size="14" fill="#2e7d32" font-weight="bold" opacity="0">ΔE<sub>p</sub> = ΔE<sub>k</sub> + Q<sub>电</sub></text>

            <!-- 电功率框内容 -->
            <text id="scene2-text-power-title" x="495" y="97" font-size="14" fill="#000000" opacity="0">电功率 P</text>
            <text id="scene2-text-power-formula1" x="495" y="122" font-size="14" fill="#000000" opacity="0">P = I²R</text>
            <text id="scene2-text-power-formula2" x="495" y="147" font-size="14" fill="#000000" opacity="0">= B²L²v<sub>m</sub>²/R</text>
            <text id="scene2-text-power-hint" x="600" y="170" text-anchor="middle" font-size="12" fill="#c62828" opacity="0">当 v = v<sub>m</sub> 时，P 最大</text>

            <!-- 电量框内容 -->
            <text id="scene2-text-charge-title" x="495" y="237" font-size="14" fill="#000000" opacity="0">电量 q</text>
            <text id="scene2-text-charge-formula1" x="495" y="262" font-size="14" fill="#000000" opacity="0">q = It = ΔΦ/R</text>
            <text id="scene2-text-charge-formula2" x="495" y="287" font-size="14" fill="#000000" opacity="0">= BLx/R</text>

            <!-- 下滑示意区文字 -->
            <text id="scene2-text-x" x="600" y="320" text-anchor="middle" font-size="14" fill="#000000" opacity="0">x</text>
            <text id="scene2-text-deltaPhi" x="600" y="395" text-anchor="middle" font-size="14" fill="#000000" opacity="0">ΔΦ = BLx</text>

            <!-- 最终结论 -->
            <text id="scene2-text-conclusion" x="600" y="420" text-anchor="middle" font-size="14" fill="#1565c0" font-weight="bold" opacity="0">q = ΔΦ/R = BLx/R</text>

            <!-- 矩形框后定义（在文字下方） -->
            <!-- 重力势能框 -->
            <rect id="scene2-rect-gpe" x="80" y="95" width="120" height="60" fill="#1565c0" fill-opacity="0.15" stroke="#1565c0" stroke-width="2"/>

            <!-- 动能框 -->
            <rect id="scene2-rect-ke" x="80" y="215" width="120" height="60" fill="#1565c0" fill-opacity="0.15" stroke="#1565c0" stroke-width="2"/>

            <!-- 电能框 -->
            <rect id="scene2-rect-elec" x="260" y="215" width="120" height="60" fill="#1565c0" fill-opacity="0.15" stroke="#1565c0" stroke-width="2"/>

            <!-- 电功率框 -->
            <rect id="scene2-rect-power" x="480" y="75" width="240" height="100" fill="#c62828" fill-opacity="0.1" stroke="#c62828" stroke-width="2"/>

            <!-- 电量框 -->
            <rect id="scene2-rect-charge" x="480" y="215" width="240" height="100" fill="#c62828" fill-opacity="0.1" stroke="#c62828" stroke-width="2"/>

            <!-- 转化箭头 1：重力势能→中间 -->
            <path id="scene2-arrow1" d="M 200 125 L 240 125" stroke="#2e7d32" stroke-width="2" fill="none" opacity="0"/>
            <polygon id="scene2-arrow1-head" points="240,125 235,122 235,128" fill="#2e7d32" opacity="0"/>

            <!-- 转化箭头 2：重力势能→动能 -->
            <path id="scene2-arrow2" d="M 140 155 L 140 215" stroke="#2e7d32" stroke-width="2" fill="none" opacity="0"/>
            <polygon id="scene2-arrow2-head" points="140,215 137,210 143,210" fill="#2e7d32" opacity="0"/>

            <!-- 转化箭头 3：重力势能→电能 -->
            <path id="scene2-arrow3" d="M 140 155 L 260 245" stroke="#2e7d32" stroke-width="2" fill="none" opacity="0"/>
            <polygon id="scene2-arrow3-head" points="260,245 255,240 258,247" fill="#2e7d32" opacity="0"/>

            <!-- 下滑示意区线条 -->
            <line id="scene2-line-slope" x1="530" y1="380" x2="670" y2="340" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" opacity="0"/>
            <line id="scene2-line-x" x1="540" y1="370" x2="660" y2="330" stroke="#888888" stroke-width="1" opacity="0"/>
        </svg>

        <div id="scene2-controls">
            <button id="scene2-btn-prev" class="scene2-btn">◀ 上一步</button>
            <button id="scene2-btn-next" class="scene2-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2: 能量转化与电量计算
        // 布局坐标表（参考）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 备注 |
        // |------|------|-----------|------|------|
        // | 标题 | text | (400, 45) | ~160×20 | 顶部居中 |
        // | 重力势能框 | rect | (80, 95)-(200, 155) | 120×60 | 左上能量框 |
        // | GPE 标签 | text | (95, 117) | ~60×16 | 框内文字 |
        // | ΔEp 公式 | text | (95, 137) | ~80×16 | 框内公式 |
        // | 动能框 | rect | (80, 215)-(200, 275) | 120×60 | 左下能量框 |
        // | KE 标签 | text | (95, 237) | ~40×16 | 框内文字 |
        // | ΔEk 公式 | text | (95, 257) | ~80×16 | 框内公式 |
        // | 电能框 | rect | (260, 215)-(380, 275) | 120×60 | 右下能量框 |
        // | Eelec 标签 | text | (275, 237) | ~40×16 | 框内文字 |
        // | Q 电 公式 | text | (275, 257) | ~100×16 | 框内公式 |
        // | 箭头 1 | path | (200, 125)-(240, 125) | 40×4 | 重力势能→中间 |
        // | 箭头 2 | path | (140, 155)-(140, 215) | 4×60 | 向下指向动能 |
        // | 箭头 3 | path | (140, 155)-(260, 245) | 斜向 | 向右下指向电能 |
        // | 电功率框 | rect | (480, 75)-(720, 175) | 240×100 | 右上公式框 |
        // | P 标题 | text | (495, 97) | ~40×16 | 框内文字 |
        // | P 公式 1 | text | (495, 122) | ~220×16 | P = I²R |
        // | P 公式 2 | text | (495, 147) | ~220×16 | = B²L²v_m²/R |
        // | 电量框 | rect | (480, 215)-(720, 315) | 240×100 | 右下公式框 |
        // | q 标题 | text | (495, 237) | ~40×16 | 框内文字 |
        // | q 公式 1 | text | (495, 262) | ~220×16 | q = It = ΔΦ/R |
        // | q 公式 2 | text | (495, 287) | ~220×16 | = BLx/R |
        // | 下滑示意区 | group | (520, 340)-(680, 410) | 160×70 | 下滑距离示意 |
        // | 上一步按钮 | button | (280, 450)-(380, 480) | 100×30 | 控件栏左侧 |
        // | 下一步按钮 | button | (480, 450)-(580, 480) | 100×30 | 控件栏右侧 |

        const TOTAL_STEPS = 6;
        let currentStep = 0;

        // 工具函数：显示元素
        function show(el) {
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }

        // 工具函数：隐藏元素
        function hide(el) {
            if (el) {
                el.style.opacity = '0';
            }
        }

        // 获取元素引用
        const elements = {
            gpeLabel: document.getElementById('scene2-text-gpe-label'),
            gpeFormula: document.getElementById('scene2-text-gpe-formula'),
            keLabel: document.getElementById('scene2-text-ke-label'),
            keFormula: document.getElementById('scene2-text-ke-formula'),
            elecLabel: document.getElementById('scene2-text-elec-label'),
            elecFormula: document.getElementById('scene2-text-elec-formula'),
            arrow1: document.getElementById('scene2-arrow1'),
            arrow1Head: document.getElementById('scene2-arrow1-head'),
            arrow2: document.getElementById('scene2-arrow2'),
            arrow2Head: document.getElementById('scene2-arrow2-head'),
            arrow3: document.getElementById('scene2-arrow3'),
            arrow3Head: document.getElementById('scene2-arrow3-head'),
            conservation: document.getElementById('scene2-text-conservation'),
            powerTitle: document.getElementById('scene2-text-power-title'),
            powerFormula1: document.getElementById('scene2-text-power-formula1'),
            powerFormula2: document.getElementById('scene2-text-power-formula2'),
            powerHint: document.getElementById('scene2-text-power-hint'),
            chargeTitle: document.getElementById('scene2-text-charge-title'),
            chargeFormula1: document.getElementById('scene2-text-charge-formula1'),
            chargeFormula2: document.getElementById('scene2-text-charge-formula2'),
            slopeLine: document.getElementById('scene2-line-slope'),
            xLine: document.getElementById('scene2-line-x'),
            xLabel: document.getElementById('scene2-text-x'),
            deltaPhiLabel: document.getElementById('scene2-text-deltaPhi'),
            conclusion: document.getElementById('scene2-text-conclusion'),
            prevBtn: document.getElementById('scene2-btn-prev'),
            nextBtn: document.getElementById('scene2-btn-next')
        };

        function renderStep() {
            // 隐藏所有内容
            hide(elements.gpeLabel);
            hide(elements.gpeFormula);
            hide(elements.keLabel);
            hide(elements.keFormula);
            hide(elements.elecLabel);
            hide(elements.elecFormula);
            hide(elements.arrow1);
            hide(elements.arrow1Head);
            hide(elements.arrow2);
            hide(elements.arrow2Head);
            hide(elements.arrow3);
            hide(elements.arrow3Head);
            hide(elements.conservation);
            hide(elements.powerTitle);
            hide(elements.powerFormula1);
            hide(elements.powerFormula2);
            hide(elements.powerHint);
            hide(elements.chargeTitle);
            hide(elements.chargeFormula1);
            hide(elements.chargeFormula2);
            hide(elements.slopeLine);
            hide(elements.xLine);
            hide(elements.xLabel);
            hide(elements.deltaPhiLabel);
            hide(elements.conclusion);

            // 步骤 1：显示重力势能框内容 + 箭头 1
            if (currentStep >= 1) {
                show(elements.gpeLabel);
                show(elements.gpeFormula);
                show(elements.arrow1);
                show(elements.arrow1Head);
            }

            // 步骤 2：显示动能框内容 + 箭头 2
            if (currentStep >= 2) {
                show(elements.keLabel);
                show(elements.keFormula);
                show(elements.arrow2);
                show(elements.arrow2Head);
            }

            // 步骤 3：显示电能框内容 + 箭头 3 + 能量守恒关系
            if (currentStep >= 3) {
                show(elements.elecLabel);
                show(elements.elecFormula);
                show(elements.arrow3);
                show(elements.arrow3Head);
                show(elements.conservation);
            }

            // 步骤 4：显示电功率框内容
            if (currentStep >= 4) {
                show(elements.powerTitle);
                show(elements.powerFormula1);
                show(elements.powerFormula2);
                show(elements.powerHint);
            }

            // 步骤 5：显示电量框内容 + 下滑示意区 + 最终结论
            if (currentStep >= 5) {
                show(elements.chargeTitle);
                show(elements.chargeFormula1);
                show(elements.chargeFormula2);
                show(elements.slopeLine);
                show(elements.xLine);
                show(elements.xLabel);
                show(elements.deltaPhiLabel);
                show(elements.conclusion);
            }

            // 更新按钮状态
            elements.prevBtn.disabled = (currentStep === 0);
            elements.nextBtn.disabled = (currentStep === TOTAL_STEPS - 1);
        }

        elements.prevBtn.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        });

        elements.nextBtn.addEventListener('click', function() {
            if (currentStep < TOTAL_STEPS - 1) {
                currentStep++;
                renderStep();
            }
        });

        renderStep();
    })();
    </script>
</body>
</html>
