<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 电磁感应中的受力分析与能量转化</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene2-btn { padding: 8px 20px; background: #1976d2; color: white; border: none; border-radius: 4px; font-size: 14px; cursor: pointer; }
        .scene2-btn:disabled { background: #bdbdbd; cursor: not-allowed; }
        .scene2-btn:hover:not(:disabled) { background: #1565c0; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene2-arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32"/>
                </marker>
                <marker id="scene2-arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#c62828"/>
                </marker>
                <marker id="scene2-arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0"/>
                </marker>
            </defs>

            <!-- 磁场区域 (70,90)-(270,190) -->
            <rect id="scene2-magnetic-field" x="70" y="90" width="200" height="100" fill="#e3f2fd" stroke="#000000" stroke-width="2" stroke-dasharray="5,5"/>
            <!-- 磁场标签 B (170,75) - 在磁场区域上方外部 -->
            <text id="scene2-label-B" x="170" y="75" font-size="20" fill="#000000" font-weight="bold">B</text>

            <!-- 磁场宽度 h 标注线 (55,90)-(55,190) -->
            <line id="scene2-h-line" x1="55" y1="90" x2="55" y2="190" stroke="#000000" stroke-width="2"/>
            <line x1="50" y1="90" x2="60" y2="90" stroke="#000000" stroke-width="2"/>
            <line x1="50" y1="190" x2="60" y2="190" stroke="#000000" stroke-width="2"/>
            <text id="scene2-label-h" x="35" y="145" font-size="16" fill="#000000">h</text>

            <!-- 滑轮系统 (300,30)-(470,30) -->
            <line id="scene2-pulley-top" x1="300" y1="30" x2="470" y2="30" stroke="#000000" stroke-width="3"/>
            <!-- 左滑轮 -->
            <circle id="scene2-pulley-left" cx="340" cy="50" r="18" fill="none" stroke="#000000" stroke-width="2"/>
            <!-- 右滑轮 -->
            <circle id="scene2-pulley-right" cx="430" cy="50" r="18" fill="none" stroke="#000000" stroke-width="2"/>
            <!-- 绳子 -->
            <line id="scene2-rope-left" x1="340" y1="68" x2="340" y2="250" stroke="#000000" stroke-width="2"/>
            <line id="scene2-rope-top" x1="340" y1="50" x2="430" y2="50" stroke="#000000" stroke-width="2"/>
            <line id="scene2-rope-right" x1="430" y1="68" x2="430" y2="140" stroke="#000000" stroke-width="2"/>

            <!-- 砝码 m₂ (400,120)-(440,160) -->
            <rect id="scene2-weight" x="400" y="120" width="40" height="40" fill="#fff3e0" stroke="#000000" stroke-width="2"/>
            <!-- m₂ 标签移到砝码右侧外部 -->
            <text id="scene2-label-m2" x="445" y="145" font-size="16" fill="#000000">m₂</text>

            <!-- 线圈 abcd (140,220)-(240,320) -->
            <rect id="scene2-coil" x="140" y="220" width="100" height="100" fill="none" stroke="#1565c0" stroke-width="3"/>
            <!-- 线圈顶点标签 - 放在外部 -->
            <text id="scene2-label-a" x="135" y="220" font-size="14" fill="#000000">a</text>
            <text id="scene2-label-b" x="240" y="220" font-size="14" fill="#000000">b</text>
            <text id="scene2-label-c" x="240" y="330" font-size="14" fill="#000000">c</text>
            <text id="scene2-label-d" x="135" y="330" font-size="14" fill="#000000">d</text>

            <!-- 线圈边长 l 标注线 (255,220)-(255,320) -->
            <line id="scene2-l-line" x1="255" y1="220" x2="255" y2="320" stroke="#000000" stroke-width="2"/>
            <line x1="250" y1="220" x2="260" y2="220" stroke="#000000" stroke-width="2"/>
            <line x1="250" y1="320" x2="260" y2="320" stroke="#000000" stroke-width="2"/>
            <text id="scene2-label-l" x="265" y="275" font-size="16" fill="#000000">l</text>

            <!-- 速度矢量 v (190,160)-(190,210) - 向上移动避免与磁场重叠 -->
            <line id="scene2-velocity" x1="190" y1="160" x2="190" y2="210" stroke="#2e7d32" stroke-width="3" marker-end="url(#scene2-arrowhead-green)"/>
            <text id="scene2-label-v" x="195" y="155" font-size="16" fill="#2e7d32" font-weight="bold">v</text>

            <!-- 步骤 1: ab 边高亮 (140,220)-(240,220) -->
            <line id="scene2-ab-highlight" x1="140" y1="220" x2="240" y2="220" stroke="#fff176" stroke-width="6" opacity="0"/>

            <!-- 步骤 1: 感应电动势公式 (300,100) -->
            <text id="scene2-emf-formula" x="300" y="100" font-size="16" fill="#000000" opacity="0">E = Blv</text>

            <!-- 步骤 2: 感应电流回路 (沿线圈边框) -->
            <path id="scene2-current-loop" d="M 140 225 L 235 225 L 235 315 L 140 315 Z" fill="none" stroke="#2e7d32" stroke-width="2" opacity="0"/>
            <!-- 电流方向箭头 -->
            <path id="scene2-current-arrows" d="M 190 225 L 190 225 M 235 270 L 235 270 M 190 315 L 190 315 M 140 270 L 140 270" stroke="#2e7d32" stroke-width="2" opacity="0"/>

            <!-- 步骤 2: 感应电流公式 (300,140) -->
            <text id="scene2-current-formula" x="300" y="140" font-size="16" fill="#000000" opacity="0">I = E/R = Blv/R</text>

            <!-- 步骤 3: 安培力 F_A (190,260)-(190,300) -->
            <line id="scene2-force-fa" x1="190" y1="260" x2="190" y2="300" stroke="#c62828" stroke-width="3" marker-end="url(#scene2-arrowhead-red)" opacity="0"/>
            <!-- F_A 标签移到更右侧，远离 l 标签 -->
            <text id="scene2-label-fa" x="295" y="285" font-size="14" fill="#c62828" opacity="0">F_A = BIl</text>

            <!-- 步骤 4: 线圈重力 m₁g (190,260)-(190,290) -->
            <line id="scene2-force-m1g" x1="190" y1="260" x2="190" y2="290" stroke="#c62828" stroke-width="3" marker-end="url(#scene2-arrowhead-red)" opacity="0"/>
            <!-- m₁g 标签移到线圈外部左侧 -->
            <text id="scene2-label-m1g" x="100" y="285" font-size="14" fill="#c62828" opacity="0">m₁g</text>

            <!-- 步骤 4: 线圈拉力 T (190,260)-(190,225) -->
            <line id="scene2-force-t-coil" x1="190" y1="260" x2="190" y2="225" stroke="#1565c0" stroke-width="3" marker-end="url(#scene2-arrowhead-blue)" opacity="0"/>
            <text id="scene2-label-t-coil" x="165" y="220" font-size="14" fill="#1565c0" opacity="0">T</text>

            <!-- 步骤 4: 砝码重力 m₂g (420,140)-(420,175) -->
            <line id="scene2-force-m2g" x1="420" y1="140" x2="420" y2="175" stroke="#c62828" stroke-width="3" marker-end="url(#scene2-arrowhead-red)" opacity="0"/>
            <text id="scene2-label-m2g" x="435" y="185" font-size="14" fill="#c62828" opacity="0">m₂g</text>

            <!-- 步骤 4: 砝码拉力 T (420,140)-(420,105) -->
            <line id="scene2-force-t-weight" x1="420" y1="140" x2="420" y2="105" stroke="#1565c0" stroke-width="3" marker-end="url(#scene2-arrowhead-blue)" opacity="0"/>
            <text id="scene2-label-t-weight" x="395" y="100" font-size="14" fill="#1565c0" opacity="0">T</text>

            <!-- 步骤 6: 能量转化区 (470,200)-(770,320) -->
            <rect id="scene2-energy-box" x="470" y="200" width="300" height="100" fill="#f5f5f5" stroke="#888888" stroke-width="1" opacity="0"/>
            <!-- 能量转化文字 - 移到能量框外部上方 -->
            <text id="scene2-energy-text1" x="490" y="180" font-size="14" fill="#000000" opacity="0">m₂gh ↓</text>
            <line id="scene2-energy-arrow1" x1="560" y1="172" x2="590" y2="172" stroke="#888888" stroke-width="2" opacity="0"/>
            <polygon id="scene2-energy-arrowhead1" points="590,167 600,172 590,177" fill="#888888" opacity="0"/>
            <text id="scene2-energy-text2" x="610" y="180" font-size="14" fill="#000000" opacity="0">m₁gh ↑</text>
            <text id="scene2-energy-plus" x="690" y="180" font-size="14" fill="#000000" opacity="0">+</text>
            <text id="scene2-energy-text3" x="710" y="180" font-size="14" fill="#000000" opacity="0">Q</text>

            <!-- 底部公式区标题 - 向右移动避免与 d 标签拥挤 -->
            <text id="scene2-formula-title" x="70" y="360" font-size="16" fill="#000000" font-weight="bold">平衡方程与求解</text>

            <!-- 步骤 5: 平衡方程 (70,385) - 增加垂直间距 -->
            <text id="scene2-balance-equation" x="70" y="385" font-size="14" fill="#000000" opacity="0">平衡方程：m₂g = m₁g + B²l²v/R</text>

            <!-- 步骤 5: 速度解 (70,410) -->
            <text id="scene2-velocity-solution" x="70" y="410" font-size="14" fill="#000000" opacity="0">速度解：v = (m₂ - m₁)gR / (B²l²) = 2.0 m/s</text>

            <!-- 步骤 6: 热量公式 (380,385) -->
            <text id="scene2-heat-formula" x="380" y="385" font-size="14" fill="#000000" opacity="0">热量公式：Q = (m₂ - m₁)gh = 0.078 J</text>
        </svg>

        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-btn-prev" class="scene2-btn" disabled>◀ 上一步</button>
            <button id="scene2-btn-next" class="scene2-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2 实现
        // 布局坐标表（实现对照依据）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // |------|------|-----------|------|-------------|------|
        // | 磁场区域 | 矩形 | (70,90)-(270,190) | 200×100 | - | 左侧上部，浅蓝色背景 + 虚线边框表示磁场 |
        // | 磁场标签 B | text | (170,75) | ~30×16 | 上方 | 磁场区域上方外部 |
        // | 磁场宽度 h | 标注线 | (55,90)-(55,190) | 4×100 | 左侧 | 左侧标注 |
        // | 线圈 abcd | 矩形 | (140,220)-(240,320) | 100×100 | - | 线圈边长 l=0.20m（缩放比例 1:2） |
        // | 线圈边长 l | 标注线 | (255,220)-(255,320) | 4×100 | 右侧 | 右侧标注 |
        // | 线圈速度 v | 箭头 | (190,160)-(190,210) | 2×50 | 上方 | 绿色向上箭头（向上移动避免重叠） |
        // | 感应电动势 E | text | (300,100) | ~80×16 | 右侧 | 步骤 1 显示 |
        // | 感应电流 I | text | (300,140) | ~80×16 | 右侧 | 步骤 2 显示 |
        // | 电流回路箭头 | 曲线 | 沿线圈边框 | - | - | 绿色带箭头闭合曲线，步骤 2 显示 |
        // | 安培力 F_A | 箭头 | (190,260)-(190,300) | 3×40 | 右侧 | 红色向下箭头，从线圈中心出发 |
        // | 线圈重力 m₁g | 箭头 | (190,260)-(190,290) | 3×30 | 左侧 | 红色向下箭头，从线圈中心出发 |
        // | 拉力 T | 箭头 | (190,260)-(190,225) | 3×35 | 左侧 | 蓝色向上箭头，从线圈中心出发 |
        // | 滑轮系统 | 线条 | (300,30)-(470,30) | - | - | 顶部滑轮示意 |
        // | 砝码 m₂ | 矩形 | (400,120)-(440,160) | 40×40 | - | 右侧砝码 |
        // | 砝码重力 m₂g | 箭头 | (420,140)-(420,175) | 3×35 | 右侧 | 红色向下箭头 |
        // | 砝码拉力 T | 箭头 | (420,140)-(420,105) | 3×35 | 左侧 | 蓝色向上箭头 |
        // | 能量转化区 | 区域 | (470,200)-(770,320) | 300×100 | - | 右侧下方能量流程图 |
        // | 砝码势能减少 | text | (490,180) | ~80×16 | - | m₂gh ↓（能量框外上方） |
        // | 能量转化箭头 1 | 箭头 | (560,172)-(590,172) | 2×30 | - | 灰色向右箭头 |
        // | 线圈势能增加 | text | (610,180) | ~80×16 | - | m₁gh ↑（能量框外上方） |
        // | 加号 | text | (690,180) | ~16×16 | - | + |
        // | 焦耳热 Q | text | (710,180) | ~60×16 | - | Q |
        // | 公式区标题 | text | (70,360) | ~100×16 | - | 平衡方程与求解（向右移动） |
        // | 平衡方程 | text | (70,385) | ~200×18 | - | 步骤 5 显示 |
        // | 速度解 | text | (70,410) | ~250×18 | - | 步骤 5 显示 |
        // | 热量公式 | text | (380,385) | ~200×18 | - | 步骤 6 显示 |

        // 状态变量
        var currentStep = 0;
        var totalSteps = 6;

        // 工具函数：显示元素（同时设置 display 和 opacity）
        function scene2Show(el) {
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }

        // 工具函数：隐藏元素
        function scene2Hide(el) {
            if (el) {
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }

        // 更新显示状态
        function scene2UpdateDisplay() {
            // 步骤 0: 初始状态 - 已显示磁场、线圈、砝码、速度矢量
            // 步骤 1: 高亮 ab 边，显示感应电动势公式
            var abHighlight = document.getElementById('scene2-ab-highlight');
            var emfFormula = document.getElementById('scene2-emf-formula');
            if (currentStep >= 1) {
                scene2Show(abHighlight);
                scene2Show(emfFormula);
            } else {
                scene2Hide(abHighlight);
                scene2Hide(emfFormula);
            }

            // 步骤 2: 显示感应电流回路和公式
            var currentLoop = document.getElementById('scene2-current-loop');
            var currentArrows = document.getElementById('scene2-current-arrows');
            var currentFormula = document.getElementById('scene2-current-formula');
            if (currentStep >= 2) {
                scene2Show(currentLoop);
                scene2Show(currentArrows);
                scene2Show(currentFormula);
            } else {
                scene2Hide(currentLoop);
                scene2Hide(currentArrows);
                scene2Hide(currentFormula);
            }

            // 步骤 3: 显示安培力
            var forceFa = document.getElementById('scene2-force-fa');
            var labelFa = document.getElementById('scene2-label-fa');
            if (currentStep >= 3) {
                scene2Show(forceFa);
                scene2Show(labelFa);
            } else {
                scene2Hide(forceFa);
                scene2Hide(labelFa);
            }

            // 步骤 4: 显示全部受力分析
            var forceM1g = document.getElementById('scene2-force-m1g');
            var labelM1g = document.getElementById('scene2-label-m1g');
            var forceTCoil = document.getElementById('scene2-force-t-coil');
            var labelTCoil = document.getElementById('scene2-label-t-coil');
            var forceM2g = document.getElementById('scene2-force-m2g');
            var labelM2g = document.getElementById('scene2-label-m2g');
            var forceTWeight = document.getElementById('scene2-force-t-weight');
            var labelTWeight = document.getElementById('scene2-label-t-weight');
            if (currentStep >= 4) {
                scene2Show(forceM1g);
                scene2Show(labelM1g);
                scene2Show(forceTCoil);
                scene2Show(labelTCoil);
                scene2Show(forceM2g);
                scene2Show(labelM2g);
                scene2Show(forceTWeight);
                scene2Show(labelTWeight);
            } else {
                scene2Hide(forceM1g);
                scene2Hide(labelM1g);
                scene2Hide(forceTCoil);
                scene2Hide(labelTCoil);
                scene2Hide(forceM2g);
                scene2Hide(labelM2g);
                scene2Hide(forceTWeight);
                scene2Hide(labelTWeight);
            }

            // 步骤 5: 显示平衡方程和速度解
            var balanceEq = document.getElementById('scene2-balance-equation');
            var velocitySol = document.getElementById('scene2-velocity-solution');
            if (currentStep >= 5) {
                scene2Show(balanceEq);
                scene2Show(velocitySol);
            } else {
                scene2Hide(balanceEq);
                scene2Hide(velocitySol);
            }

            // 步骤 6: 显示能量转化区和热量公式
            var energyBox = document.getElementById('scene2-energy-box');
            var energyText1 = document.getElementById('scene2-energy-text1');
            var energyArrow1 = document.getElementById('scene2-energy-arrow1');
            var energyArrowhead1 = document.getElementById('scene2-energy-arrowhead1');
            var energyText2 = document.getElementById('scene2-energy-text2');
            var energyPlus = document.getElementById('scene2-energy-plus');
            var energyText3 = document.getElementById('scene2-energy-text3');
            var heatFormula = document.getElementById('scene2-heat-formula');
            if (currentStep >= 6) {
                scene2Show(energyBox);
                scene2Show(energyText1);
                scene2Show(energyArrow1);
                scene2Show(energyArrowhead1);
                scene2Show(energyText2);
                scene2Show(energyPlus);
                scene2Show(energyText3);
                scene2Show(heatFormula);
            } else {
                scene2Hide(energyBox);
                scene2Hide(energyText1);
                scene2Hide(energyArrow1);
                scene2Hide(energyArrowhead1);
                scene2Hide(energyText2);
                scene2Hide(energyPlus);
                scene2Hide(energyText3);
                scene2Hide(heatFormula);
            }

            // 更新按钮状态
            var btnPrev = document.getElementById('scene2-btn-prev');
            var btnNext = document.getElementById('scene2-btn-next');
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps);
        }

        // 下一步按钮点击
        function scene2NextStep() {
            if (currentStep < totalSteps) {
                currentStep++;
                scene2UpdateDisplay();
            }
        }

        // 上一步按钮点击
        function scene2PrevStep() {
            if (currentStep > 0) {
                currentStep--;
                scene2UpdateDisplay();
            }
        }

        // 初始化
        function scene2Init() {
            var btnNext = document.getElementById('scene2-btn-next');
            var btnPrev = document.getElementById('scene2-btn-prev');
            btnNext.addEventListener('click', scene2NextStep);
            btnPrev.addEventListener('click', scene2PrevStep);
            scene2UpdateDisplay();
        }

        // 页面加载完成后初始化
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', scene2Init);
        } else {
            scene2Init();
        }
    })();
    </script>
</body>
</html>
