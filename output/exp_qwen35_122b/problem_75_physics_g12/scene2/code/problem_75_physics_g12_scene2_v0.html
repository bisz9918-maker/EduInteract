<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 能量转化与做功分析</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Segoe UI', Arial, sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 15px; z-index: 10; }
        .scene2-btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold; transition: all 0.2s; }
        .scene2-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene2-prev-btn { background: #9e9e9e; color: white; }
        #scene2-next-btn { background: #1565c0; color: white; }
        #scene2-prev-btn:hover:not(:disabled) { background: #757575; }
        #scene2-next-btn:hover:not(:disabled) { background: #0d47a1; }
        #scene2-step-indicator { font-size: 14px; color: #424242; font-weight: bold; }
        svg { display: block; }
        .scene2-text { font-size: 14px; fill: #000000; }
        .scene2-text-small { font-size: 12px; fill: #000000; }
        .scene2-text-bold { font-size: 14px; fill: #000000; font-weight: bold; }
        .scene2-text-blue { font-size: 14px; fill: #1565c0; font-weight: bold; }
        .scene2-text-green { font-size: 14px; fill: #2e7d32; }
        .scene2-text-red { font-size: 14px; fill: #c62828; }
        .scene2-fade-in { animation: scene2FadeIn 0.4s ease-out; }
        @keyframes scene2FadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" id="scene2-svg">
            <!-- ==================== 左侧：三球系统 ==================== -->
            
            <!-- 上极板（带缺口） -->
            <line id="scene2-plate-top-left" x1="30" y1="100" x2="140" y2="100" stroke="#000000" stroke-width="2"/>
            <line id="scene2-plate-top-right" x1="160" y1="100" x2="250" y2="100" stroke="#000000" stroke-width="2"/>
            
            <!-- 下极板 -->
            <line id="scene2-plate-bottom" x1="30" y1="250" x2="250" y2="250" stroke="#000000" stroke-width="2"/>
            
            <!-- 板间距离标注线 -->
            <line id="scene2-distance-line" x1="25" y1="100" x2="25" y2="250" stroke="#000000" stroke-width="1"/>
            <!-- 距离标注上箭头 -->
            <line id="scene2-distance-arrow-top" x1="20" y1="100" x2="30" y2="100" stroke="#000000" stroke-width="1"/>
            <line id="scene2-distance-arrow-top-diag1" x1="22" y1="95" x2="28" y2="100" stroke="#000000" stroke-width="1"/>
            <line id="scene2-distance-arrow-top-diag2" x1="28" y1="95" x2="22" y2="100" stroke="#000000" stroke-width="1"/>
            <!-- 距离标注下箭头 -->
            <line id="scene2-distance-arrow-bottom" x1="20" y1="250" x2="30" y2="250" stroke="#000000" stroke-width="1"/>
            <line id="scene2-distance-arrow-bottom-diag1" x1="22" y1="245" x2="28" y2="250" stroke="#000000" stroke-width="1"/>
            <line id="scene2-distance-arrow-bottom-diag2" x1="28" y1="245" x2="22" y2="250" stroke="#000000" stroke-width="1"/>
            
            <!-- 距离标签 d（右移以避免裁切） -->
            <text id="scene2-label-d" class="scene2-text" x="32" y="175">d</text>
            
            <!-- 球 1（最上） -->
            <circle id="scene2-ball1" cx="150" cy="40" r="15" fill="#1565c0" fill-opacity="0.2" stroke="#1565c0" stroke-width="2"/>
            
            <!-- 球 2（中间） -->
            <circle id="scene2-ball2" cx="150" cy="85" r="15" fill="#1565c0" fill-opacity="0.2" stroke="#1565c0" stroke-width="2"/>
            
            <!-- 球 3（最下） -->
            <circle id="scene2-ball3" cx="150" cy="130" r="15" fill="#1565c0" fill-opacity="0.2" stroke="#1565c0" stroke-width="2"/>
            
            <!-- 连接杆 1-2（虚线） -->
            <line id="scene2-rod-12" x1="150" y1="55" x2="150" y2="70" stroke="#1565c0" stroke-width="1" stroke-dasharray="3,2"/>
            
            <!-- 连接杆 2-3（虚线） -->
            <line id="scene2-rod-23" x1="150" y1="100" x2="150" y2="115" stroke="#1565c0" stroke-width="1" stroke-dasharray="3,2"/>
            
            <!-- 杆长标签 L（两处） -->
            <text id="scene2-label-L1" class="scene2-text-small" x="165" y="67">L</text>
            <text id="scene2-label-L2" class="scene2-text-small" x="165" y="112">L</text>
            
            <!-- ==================== 右侧：能量转化分析区域 ==================== -->
            
            <!-- 标题 -->
            <text id="scene2-title" class="scene2-text-bold" x="360" y="35" text-anchor="middle">能量转化与做功分析</text>
            
            <!-- 重力做功箭头（绿色向下） -->
            <line id="scene2-arrow-gravity" x1="350" y1="80" x2="350" y2="140" stroke="#2e7d32" stroke-width="2" style="display: none;"/>
            <polygon id="scene2-arrow-gravity-head" points="350,140 345,130 355,130" fill="#2e7d32" style="display: none;"/>
            <text id="scene2-label-WG" class="scene2-text-green" x="360" y="115" style="display: none;">W_G = 3mgd</text>
            
            <!-- 电场力做功箭头（红色向上） -->
            <line id="scene2-arrow-electric" x1="500" y1="80" x2="500" y2="140" stroke="#c62828" stroke-width="2" style="display: none;"/>
            <polygon id="scene2-arrow-electric-head" points="500,80 495,90 505,90" fill="#c62828" style="display: none;"/>
            <text id="scene2-label-WE" class="scene2-text-red" x="510" y="115" style="display: none;">W_E = -qE[d+(d-L)+(d-2L)]</text>
            
            <!-- 能量守恒框（扩大高度，文字移到框上方） -->
            <rect id="scene2-energy-box" x="350" y="180" width="300" height="40" fill="#1565c0" fill-opacity="0.1" stroke="#1565c0" stroke-width="2" style="display: none;"/>
            <text id="scene2-energy-text" class="scene2-text-blue" x="365" y="170" style="display: none;">初始状态：系统静止，动能为 0</text>
            
            <!-- 公式推导区域（增加行间距，标题下移） -->
            <text id="scene2-formula-title" class="scene2-text" x="360" y="280" style="display: none;">公式推导：</text>
            <text id="scene2-formula-wg" class="scene2-text-green" x="360" y="305" style="display: none;">W_G = mg·d + mg·d + mg·d = 3mgd</text>
            <text id="scene2-formula-we" class="scene2-text-red" x="360" y="335" style="display: none;">W_E = -qE·d - qE·(d-L) - qE·(d-2L)</text>
            <text id="scene2-formula-conservation" class="scene2-text-blue" x="360" y="365" style="display: none;">ΔE_k = W_G + W_E = 0</text>
            <text id="scene2-formula-e" class="scene2-text" x="360" y="395" style="display: none;">E = U/d</text>
            <text id="scene2-formula-u" class="scene2-text-blue" x="360" y="425" style="display: none;">U = 3mgd/q - 3mgL/q</text>
            
            <!-- ==================== 控件栏 ==================== -->
            <div id="scene2-controls">
                <button id="scene2-prev-btn" class="scene2-btn" disabled>◀ 上一步</button>
                <text id="scene2-step-indicator" x="0" y="0">步骤 1/5</text>
                <button id="scene2-next-btn" class="scene2-btn">下一步 ▶</button>
            </div>
        </svg>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现 - 能量转化与做功分析
        
        // 状态管理
        let currentStep = 0;
        const totalSteps = 5;
        
        // DOM 元素引用
        const prevBtn = document.getElementById('scene2-prev-btn');
        const nextBtn = document.getElementById('scene2-next-btn');
        const stepIndicator = document.getElementById('scene2-step-indicator');
        
        // 重力做功相关元素
        const arrowGravity = document.getElementById('scene2-arrow-gravity');
        const arrowGravityHead = document.getElementById('scene2-arrow-gravity-head');
        const labelWG = document.getElementById('scene2-label-WG');
        const formulaWG = document.getElementById('scene2-formula-wg');
        
        // 电场力做功相关元素
        const arrowElectric = document.getElementById('scene2-arrow-electric');
        const arrowElectricHead = document.getElementById('scene2-arrow-electric-head');
        const labelWE = document.getElementById('scene2-label-WE');
        const formulaWE = document.getElementById('scene2-formula-we');
        
        // 能量守恒相关元素
        const energyBox = document.getElementById('scene2-energy-box');
        const energyText = document.getElementById('scene2-energy-text');
        const formulaConservation = document.getElementById('scene2-formula-conservation');
        const formulaTitle = document.getElementById('scene2-formula-title');
        
        // 最终公式相关元素
        const formulaE = document.getElementById('scene2-formula-e');
        const formulaU = document.getElementById('scene2-formula-u');
        
        // 更新步骤显示
        function updateStepDisplay() {
            stepIndicator.textContent = `步骤 ${currentStep + 1}/${totalSteps}`;
            prevBtn.disabled = (currentStep === 0);
            nextBtn.disabled = (currentStep === totalSteps - 1);
            
            // 根据步骤更新显示内容
            switch(currentStep) {
                case 0:
                    // 初始状态
                    hideAllFormulas();
                    energyText.textContent = '初始状态：系统静止，动能为 0';
                    energyText.style.display = 'block';
                    energyBox.style.display = 'block';
                    break;
                    
                case 1:
                    // 重力做功
                    showWithFade(arrowGravity);
                    showWithFade(arrowGravityHead);
                    showWithFade(labelWG);
                    showWithFade(formulaWG);
                    energyText.textContent = '重力做功：W_G = 3mgd（三球总重力做功）';
                    break;
                    
                case 2:
                    // 电场力做功
                    showWithFade(arrowElectric);
                    showWithFade(arrowElectricHead);
                    showWithFade(labelWE);
                    showWithFade(formulaWE);
                    energyText.textContent = '电场力做功：W_E = -qE[d+(d-L)+(d-2L)]';
                    break;
                    
                case 3:
                    // 能量守恒
                    showWithFade(formulaTitle);
                    showWithFade(formulaConservation);
                    energyText.textContent = '能量守恒：ΔE_k = W_G + W_E = 0';
                    energyText.style.fill = '#1565c0';
                    energyText.style.fontWeight = 'bold';
                    break;
                    
                case 4:
                    // 最终结论
                    showWithFade(formulaE);
                    showWithFade(formulaU);
                    energyText.textContent = '最终结果：U = 3mgd/q - 3mgL/q';
                    formulaU.style.display = 'block';
                    break;
            }
        }
        
        // 隐藏所有公式元素
        function hideAllFormulas() {
            arrowGravity.style.display = 'none';
            arrowGravityHead.style.display = 'none';
            labelWG.style.display = 'none';
            arrowElectric.style.display = 'none';
            arrowElectricHead.style.display = 'none';
            labelWE.style.display = 'none';
            formulaWG.style.display = 'none';
            formulaWE.style.display = 'none';
            formulaConservation.style.display = 'none';
            formulaTitle.style.display = 'none';
            formulaE.style.display = 'none';
            formulaU.style.display = 'none';
            energyText.style.fill = '#1565c0';
            energyText.style.fontWeight = 'normal';
        }
        
        // 淡入显示元素
        function showWithFade(element) {
            element.style.display = 'block';
            element.style.opacity = '0';
            setTimeout(() => {
                element.style.transition = 'opacity 0.4s ease-out';
                element.style.opacity = '1';
            }, 10);
        }
        
        // 按钮事件处理
        prevBtn.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                hideAllFormulas();
                updateStepDisplay();
            }
        });
        
        nextBtn.addEventListener('click', () => {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateStepDisplay();
            }
        });
        
        // 初始化显示
        updateStepDisplay();
    })();
    </script>
</body>
</html>
