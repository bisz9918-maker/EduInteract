<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分阶段动量守恒方程推导 - 物理题 76 场景 2</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene2-btn { width: 100px; height: 25px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
        #scene2-prevBtn { background: #9e9e9e; color: white; }
        #scene2-prevBtn:disabled { background: #bdbdbd; cursor: not-allowed; }
        #scene2-nextBtn { background: #1976d2; color: white; }
        #scene2-nextBtn:disabled { background: #64b5f6; cursor: not-allowed; }
        .scene2-box { stroke: #000000; stroke-width: 2; fill: none; }
        .scene2-arrow { stroke: #888888; stroke-width: 3; fill: none; marker-end: url(#scene2-arrowhead); }
        .scene2-title { fill: #c62828; font-size: 20px; font-weight: bold; text-anchor: middle; }
        .scene2-section-title { fill: #c62828; font-size: 14px; font-weight: bold; }
        .scene2-text { fill: #000000; font-size: 13px; }
        .scene2-text-small { fill: #666666; font-size: 11px; }
        .scene2-text-small2 { fill: #000000; font-size: 12px; }
        .scene2-known-text { fill: #000000; font-size: 13px; }
        .scene2-unknown-text { fill: #1565c0; font-size: 13px; font-weight: bold; }
        .scene2-answer-text { fill: #2e7d32; font-size: 15px; font-weight: bold; }
        .scene2-fade-in { opacity: 0; transition: opacity 0.3s ease; }
        .scene2-fade-in.visible { opacity: 1; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500">
            <defs>
                <marker id="scene2-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#888888"/>
                </marker>
            </defs>
            
            <!-- 标题栏 (y=45 确保顶部安全边距) -->
            <text id="scene2-title" class="scene2-title" x="400" y="45">分阶段动量守恒方程推导</text>
            
            <!-- 第一阶段标题 -->
            <text id="scene2-phase1-title" class="scene2-section-title scene2-fade-in" x="120" y="80">第一阶段：C 在 A 上滑动</text>
            
            <!-- 第一阶段方程框 (无填充，文字在框内，y 从框顶 +20 开始) -->
            <rect id="scene2-eq1-box" class="scene2-box scene2-fade-in" x="60" y="100" width="220" height="110"/>
            <text id="scene2-eq1-line1" class="scene2-text-small2 scene2-fade-in" x="75" y="125">系统：A + B + C</text>
            <text id="scene2-eq1-line2" class="scene2-text scene2-fade-in" x="75" y="150">动量守恒：m₀v₀ = m_A·v_A + (m_B+m₀)·v_C1</text>
            <text id="scene2-eq1-line3" class="scene2-text-small scene2-fade-in" x="75" y="175">（C 滑离 A 瞬时）</text>
            <!-- 代入数值行（步骤 3 显示） -->
            <text id="scene2-eq1-substitute" class="scene2-text scene2-fade-in" x="75" y="200" style="display: none;">代入：0.08×25 = 0.5·v_A + 0.38·v_C1</text>
            
            <!-- 推导箭头 -->
            <path id="scene2-arrow1" class="scene2-arrow scene2-fade-in" d="M 290 155 L 370 155" style="display: none;"/>
            
            <!-- 第二阶段标题 -->
            <text id="scene2-phase2-title" class="scene2-section-title scene2-fade-in" x="540" y="80">第二阶段：C 在 B 上滑动</text>
            
            <!-- 第二阶段方程框 (无填充，文字在框内) -->
            <rect id="scene2-eq2-box" class="scene2-box scene2-fade-in" x="480" y="100" width="220" height="110"/>
            <text id="scene2-eq2-line1" class="scene2-text-small2 scene2-fade-in" x="495" y="125">系统：B + C</text>
            <text id="scene2-eq2-line2" class="scene2-text scene2-fade-in" x="495" y="150">m_B·v_A + m₀·v_C1 = (m_B+m₀)·v</text>
            <text id="scene2-eq2-line3" class="scene2-text-small scene2-fade-in" x="495" y="175">（C 停在 B 上）</text>
            <!-- 代入数值行（步骤 3 显示） -->
            <text id="scene2-eq2-substitute" class="scene2-text scene2-fade-in" x="495" y="200" style="display: none;">代入：0.3·v_A + 0.08·v_C1 = 0.38×2.5</text>
            
            <!-- 已知量标注区 (无填充边框，文字在框内) -->
            <rect id="scene2-known-box" class="scene2-box scene2-fade-in" x="60" y="250" width="330" height="80"/>
            <text id="scene2-known-title" class="scene2-text" x="75" y="272" font-weight="bold">已知量：</text>
            <text id="scene2-known-line1" class="scene2-known-text scene2-fade-in" x="75" y="290">m_A = 0.5 kg</text>
            <text id="scene2-known-line2" class="scene2-known-text scene2-fade-in" x="75" y="308">m_B = 0.3 kg</text>
            <text id="scene2-known-line3" class="scene2-known-text scene2-fade-in" x="75" y="326">m₀ = 0.08 kg</text>
            <text id="scene2-known-line4" class="scene2-known-text scene2-fade-in" x="75" y="344">v₀ = 25 m/s, v = 2.5 m/s</text>
            
            <!-- 待求量标注区 (无填充边框，文字在框内) -->
            <rect id="scene2-unknown-box" class="scene2-box scene2-fade-in" x="410" y="250" width="330" height="80" stroke="#1565c0"/>
            <text id="scene2-unknown-title" class="scene2-unknown-text scene2-fade-in" x="425" y="272">待求量：</text>
            <text id="scene2-unknown-line1" class="scene2-unknown-text scene2-fade-in" x="425" y="290">v_A = ?</text>
            <text id="scene2-unknown-line2" class="scene2-unknown-text scene2-fade-in" x="425" y="308">v_C1 = ?</text>
            
            <!-- 最终答案框 (绿色边框，无填充，文字在框内) -->
            <rect id="scene2-answer-box" class="scene2-box scene2-fade-in" x="200" y="370" width="400" height="70" stroke="#2e7d32" stroke-width="3" style="display: none;"/>
            <text id="scene2-answer-line1" class="scene2-answer-text scene2-fade-in" x="215" y="398" style="display: none;">（1）v_A = 2.0 m/s</text>
            <text id="scene2-answer-line2" class="scene2-answer-text scene2-fade-in" x="215" y="423" style="display: none;">（2）v_C1 = 15.0 m/s</text>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-prevBtn" class="scene2-btn" disabled>◀ 上一步</button>
            <button id="scene2-nextBtn" class="scene2-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2: 分阶段动量守恒方程推导
        // 布局坐标表对照：
        // | 元素 | 位置/范围 |
        // | 标题栏 | (400,45) 居中 |
        // | 第一阶段标题 | (120,80) |
        // | 第一阶段方程框 | (60,100)-(280,210) |
        // | 推导箭头 | (290,155)-(370,155) |
        // | 第二阶段标题 | (540,80) |
        // | 第二阶段方程框 | (480,100)-(700,210) |
        // | 已知量标注区 | (60,250)-(390,330) |
        // | 待求量标注区 | (410,250)-(740,330) |
        // | 最终答案框 | (200,370)-(600,440) |
        // | 控件栏 | (250,450)-(550,485) |
        
        const currentStepMax = 5;
        let currentStep = 0;
        
        // 元素 ID 映射
        const elements = {
            title: 'scene2-title',
            phase1Title: 'scene2-phase1-title',
            eq1Box: 'scene2-eq1-box',
            eq1Line1: 'scene2-eq1-line1',
            eq1Line2: 'scene2-eq1-line2',
            eq1Line3: 'scene2-eq1-line3',
            eq1Substitute: 'scene2-eq1-substitute',
            arrow1: 'scene2-arrow1',
            phase2Title: 'scene2-phase2-title',
            eq2Box: 'scene2-eq2-box',
            eq2Line1: 'scene2-eq2-line1',
            eq2Line2: 'scene2-eq2-line2',
            eq2Line3: 'scene2-eq2-line3',
            eq2Substitute: 'scene2-eq2-substitute',
            knownBox: 'scene2-known-box',
            knownTitle: 'scene2-known-title',
            knownLine1: 'scene2-known-line1',
            knownLine2: 'scene2-known-line2',
            knownLine3: 'scene2-known-line3',
            knownLine4: 'scene2-known-line4',
            unknownBox: 'scene2-unknown-box',
            unknownTitle: 'scene2-unknown-title',
            unknownLine1: 'scene2-unknown-line1',
            unknownLine2: 'scene2-unknown-line2',
            answerBox: 'scene2-answer-box',
            answerLine1: 'scene2-answer-line1',
            answerLine2: 'scene2-answer-line2',
            prevBtn: 'scene2-prevBtn',
            nextBtn: 'scene2-nextBtn'
        };
        
        // 步骤定义：每个步骤需要显示的元素
        const stepDefinitions = [
            // 步骤 0：系统分析（初始状态）
            {
                show: ['title', 'knownBox', 'knownTitle', 'knownLine1', 'knownLine2', 'knownLine3', 'knownLine4', 'unknownBox', 'unknownTitle', 'unknownLine1', 'unknownLine2'],
                hide: ['phase1Title', 'eq1Box', 'eq1Line1', 'eq1Line2', 'eq1Line3', 'eq1Substitute', 'arrow1', 'phase2Title', 'eq2Box', 'eq2Line1', 'eq2Line2', 'eq2Line3', 'eq2Substitute', 'answerBox', 'answerLine1', 'answerLine2']
            },
            // 步骤 1：第一阶段动量守恒方程
            {
                show: ['title', 'knownBox', 'knownTitle', 'knownLine1', 'knownLine2', 'knownLine3', 'knownLine4', 'unknownBox', 'unknownTitle', 'unknownLine1', 'unknownLine2', 'phase1Title', 'eq1Box', 'eq1Line1', 'eq1Line2', 'eq1Line3'],
                hide: ['eq1Substitute', 'arrow1', 'phase2Title', 'eq2Box', 'eq2Line1', 'eq2Line2', 'eq2Line3', 'eq2Substitute', 'answerBox', 'answerLine1', 'answerLine2']
            },
            // 步骤 2：第二阶段动量守恒方程
            {
                show: ['title', 'knownBox', 'knownTitle', 'knownLine1', 'knownLine2', 'knownLine3', 'knownLine4', 'unknownBox', 'unknownTitle', 'unknownLine1', 'unknownLine2', 'phase1Title', 'eq1Box', 'eq1Line1', 'eq1Line2', 'eq1Line3', 'arrow1', 'phase2Title', 'eq2Box', 'eq2Line1', 'eq2Line2', 'eq2Line3'],
                hide: ['eq1Substitute', 'eq2Substitute', 'answerBox', 'answerLine1', 'answerLine2']
            },
            // 步骤 3：代入已知数据
            {
                show: ['title', 'knownBox', 'knownTitle', 'knownLine1', 'knownLine2', 'knownLine3', 'knownLine4', 'unknownBox', 'unknownTitle', 'unknownLine1', 'unknownLine2', 'phase1Title', 'eq1Box', 'eq1Line1', 'eq1Line2', 'eq1Line3', 'eq1Substitute', 'arrow1', 'phase2Title', 'eq2Box', 'eq2Line1', 'eq2Line2', 'eq2Line3', 'eq2Substitute'],
                hide: ['answerBox', 'answerLine1', 'answerLine2']
            },
            // 步骤 4：求解 v_A
            {
                show: ['title', 'knownBox', 'knownTitle', 'knownLine1', 'knownLine2', 'knownLine3', 'knownLine4', 'unknownBox', 'unknownTitle', 'unknownLine1', 'unknownLine2', 'phase1Title', 'eq1Box', 'eq1Line1', 'eq1Line2', 'eq1Line3', 'eq1Substitute', 'arrow1', 'phase2Title', 'eq2Box', 'eq2Line1', 'eq2Line2', 'eq2Line3', 'eq2Substitute', 'answerBox', 'answerLine1'],
                hide: ['answerLine2']
            },
            // 步骤 5：求解 v_C1（最终步骤）
            {
                show: ['title', 'knownBox', 'knownTitle', 'knownLine1', 'knownLine2', 'knownLine3', 'knownLine4', 'unknownBox', 'unknownTitle', 'unknownLine1', 'unknownLine2', 'phase1Title', 'eq1Box', 'eq1Line1', 'eq1Line2', 'eq1Line3', 'eq1Substitute', 'arrow1', 'phase2Title', 'eq2Box', 'eq2Line1', 'eq2Line2', 'eq2Line3', 'eq2Substitute', 'answerBox', 'answerLine1', 'answerLine2'],
                hide: []
            }
        ];
        
        // 工具函数：显示元素
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.display = '';
                // 添加可见类以触发淡入动画
                setTimeout(() => {
                    if (el.classList.contains('scene2-fade-in')) {
                        el.classList.add('visible');
                    }
                }, 10);
            }
        }
        
        // 工具函数：隐藏元素
        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('visible');
                el.style.display = 'none';
            }
        }
        
        // 更新显示状态
        function updateDisplay() {
            const stepDef = stepDefinitions[currentStep];
            
            // 先隐藏所有可能需要的元素
            stepDef.hide.forEach(key => {
                hideElement(elements[key]);
            });
            
            // 再显示当前步骤需要的元素
            stepDef.show.forEach(key => {
                showElement(elements[key]);
            });
            
            // 更新按钮状态
            document.getElementById(elements.prevBtn).disabled = (currentStep === 0);
            document.getElementById(elements.nextBtn).disabled = (currentStep === currentStepMax);
        }
        
        // 下一步按钮点击
        document.getElementById(elements.nextBtn).addEventListener('click', function() {
            if (currentStep < currentStepMax) {
                currentStep++;
                updateDisplay();
            }
        });
        
        // 上一步按钮点击
        document.getElementById(elements.prevBtn).addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        });
        
        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
