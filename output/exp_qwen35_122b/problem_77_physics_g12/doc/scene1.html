<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>平行板电容器装置</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Microsoft YaHei', sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 0 50px; z-index: 10; }
        .scene1-btn { padding: 8px 20px; font-size: 14px; background: #1565c0; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .scene1-btn:disabled { background: #999; cursor: not-allowed; }
        .scene1-step-indicator { font-size: 14px; color: #333; }
        svg { display: block; }
        .scene1-element { transition: opacity 0.3s ease; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500">
            <!-- 标题 -->
            <text x="400" y="45" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000">平行板电容器装置</text>
            
            <!-- 步骤 1：上极板 A 和下极板 B -->
            <g id="scene1-step1" class="scene1-element" style="opacity: 0;">
                <!-- 上极板 A -->
                <rect id="scene1-plate-a" x="100" y="150" width="450" height="20" fill="#e0e0e0" stroke="#000000" stroke-width="2"/>
                <text id="scene1-label-a" x="80" y="145" font-size="14" fill="#000000">A</text>
                
                <!-- 下极板 B -->
                <rect id="scene1-plate-b" x="100" y="330" width="450" height="20" fill="#e0e0e0" stroke="#000000" stroke-width="2"/>
                <text id="scene1-label-b" x="80" y="360" font-size="14" fill="#000000">B</text>
                
                <!-- 板间距 d -->
                <line id="scene1-d-line" x1="70" y1="170" x2="70" y2="330" stroke="#000000" stroke-width="1.5"/>
                <!-- 双箭头 -->
                <line id="scene1-d-arrow-top" x1="65" y1="170" x2="75" y2="170" stroke="#000000" stroke-width="1.5"/>
                <line id="scene1-d-arrow-bottom" x1="65" y1="330" x2="75" y2="330" stroke="#000000" stroke-width="1.5"/>
                <text id="scene1-label-d" x="55" y="240" font-size="14" fill="#000000">d</text>
            </g>
            
            <!-- 步骤 2：靶板 MN、中心轴线 OO′、靶中心 O′ -->
            <g id="scene1-step2" class="scene1-element" style="opacity: 0;">
                <!-- 靶板 MN -->
                <rect id="scene1-target" x="650" y="120" width="20" height="260" fill="#e0e0e0" stroke="#000000" stroke-width="2"/>
                <text id="scene1-label-m" x="690" y="120" font-size="14" fill="#000000">M</text>
                <text id="scene1-label-n" x="690" y="380" font-size="14" fill="#000000">N</text>
                
                <!-- 中心轴线 OO′ -->
                <line id="scene1-axis" x1="100" y1="250" x2="680" y2="250" stroke="#888888" stroke-width="1" stroke-dasharray="5,5"/>
                
                <!-- 靶中心 O′ -->
                <circle id="scene1-point-o-prime" cx="680" cy="250" r="4" fill="#000000"/>
                <text id="scene1-label-o-prime" x="700" y="250" font-size="14" fill="#000000">O′</text>
            </g>
            
            <!-- 步骤 3：入射点 O、初速度 v₀ -->
            <g id="scene1-step3" class="scene1-element" style="opacity: 0;">
                <!-- 入射点 O -->
                <circle id="scene1-point-o" cx="100" cy="250" r="4" fill="#000000"/>
                <text id="scene1-label-o" x="80" y="250" font-size="14" fill="#000000">O</text>
                
                <!-- 初速度 v₀ 箭头 -->
                <line id="scene1-v0-line" x1="120" y1="250" x2="200" y2="250" stroke="#1565c0" stroke-width="2"/>
                <polygon id="scene1-v0-arrow" points="200,250 190,245 190,255" fill="#1565c0"/>
                <text id="scene1-label-v0" x="160" y="235" font-size="14" fill="#1565c0">v₀</text>
            </g>
            
            <!-- 步骤 4：电场线 E、受力 F -->
            <g id="scene1-step4" class="scene1-element" style="opacity: 0;">
                <!-- 电场线 E（5 条垂直向下箭头） -->
                <g id="scene1-field-lines">
                    <!-- x=200 -->
                    <line x1="200" y1="180" x2="200" y2="300" stroke="#c62828" stroke-width="1.5"/>
                    <polygon points="200,300 195,290 205,290" fill="#c62828"/>
                    <!-- x=300 -->
                    <line x1="300" y1="180" x2="300" y2="300" stroke="#c62828" stroke-width="1.5"/>
                    <polygon points="300,300 295,290 305,290" fill="#c62828"/>
                    <!-- x=400 -->
                    <line x1="400" y1="180" x2="400" y2="300" stroke="#c62828" stroke-width="1.5"/>
                    <polygon points="400,300 395,290 405,290" fill="#c62828"/>
                    <!-- x=500 -->
                    <line x1="500" y1="180" x2="500" y2="300" stroke="#c62828" stroke-width="1.5"/>
                    <polygon points="500,300 495,290 505,290" fill="#c62828"/>
                    <!-- x=600 -->
                    <line x1="600" y1="180" x2="600" y2="300" stroke="#c62828" stroke-width="1.5"/>
                    <polygon points="600,300 595,290 605,290" fill="#c62828"/>
                </g>
                <text id="scene1-label-e" x="620" y="240" font-size="14" fill="#c62828">E</text>
                
                <!-- 受力 F 箭头 -->
                <line id="scene1-f-line" x1="300" y1="250" x2="300" y2="300" stroke="#c62828" stroke-width="2"/>
                <polygon id="scene1-f-arrow" points="300,300 295,290 305,290" fill="#c62828"/>
                <text id="scene1-label-f" x="315" y="275" font-size="14" fill="#c62828">F</text>
            </g>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-step-btn-prev" class="scene1-btn" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator" class="scene1-step-indicator">步骤 0/4</span>
            <button id="scene1-step-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现
        // 布局坐标表（800×500 画布）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // |------|------|-----------|------|-------------|------|
        // | 上极板 A | 矩形 | (100,150)-(550,170) | 450×20 | - | 水平放置 |
        // | 下极板 B | 矩形 | (100,330)-(550,350) | 450×20 | - | 与 A 平行 |
        // | 板间距 d | 双箭头线段 | (70,170)-(70,330) | 2×160 | 左侧 | 垂直标注 |
        // | 靶板 MN | 矩形 | (650,120)-(670,380) | 20×260 | - | 垂直放置于右端 |
        // | 中心轴线 OO′ | 虚线 | (100,250)-(680,250) | 580×1 | - | 水平贯穿板间中点 |
        // | 入射点 O | 圆点 | (100,250) | 4×4 | 左侧 | 轴线左端点 |
        // | 靶中心 O′ | 圆点 | (680,250) | 4×4 | 右侧 | 轴线右端点 |
        // | 初速度 v₀ | 箭头 | (120,250)-(200,250) | 80×1 | 上方 | 从 O 点向右 |
        // | 电场线 E | 箭头组 | (200,180)-(200,320) 等 5 条 | 各 140×1 | 右侧 | t=0 时刻向下 |
        // | 受力 F | 箭头 | (300,250)-(300,300) | 1×50 | 右侧 | 正电荷受力向下 |
        
        const TOTAL_STEPS = 4;
        let currentStep = 0;
        
        // 工具函数：显示元素
        function show(el) {
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }
        
        // 工具函数：隐藏元素
        function hide(el) {
            if (el) {
                el.style.opacity = '0';
                setTimeout(() => {
                    if (el) el.style.display = 'none';
                }, 300);
            }
        }
        
        // 更新步骤显示
        function updateStepDisplay() {
            // 隐藏所有步骤组
            for (let i = 1; i <= TOTAL_STEPS; i++) {
                const stepGroup = document.getElementById('scene1-step' + i);
                if (stepGroup) {
                    if (i <= currentStep) {
                        show(stepGroup);
                    } else {
                        hide(stepGroup);
                    }
                }
            }
            
            // 更新步骤指示器
            const indicator = document.getElementById('scene1-step-indicator');
            if (indicator) {
                indicator.textContent = '步骤 ' + currentStep + '/' + TOTAL_STEPS;
            }
            
            // 更新按钮状态
            const prevBtn = document.getElementById('scene1-step-btn-prev');
            const nextBtn = document.getElementById('scene1-step-btn-next');
            if (prevBtn) {
                prevBtn.disabled = (currentStep === 0);
            }
            if (nextBtn) {
                nextBtn.disabled = (currentStep === TOTAL_STEPS);
            }
        }
        
        // 下一步按钮点击
        function handleNext() {
            if (currentStep < TOTAL_STEPS) {
                currentStep++;
                updateStepDisplay();
            }
        }
        
        // 上一步按钮点击
        function handlePrev() {
            if (currentStep > 0) {
                currentStep--;
                updateStepDisplay();
            }
        }
        
        // 初始化
        function init() {
            const prevBtn = document.getElementById('scene1-step-btn-prev');
            const nextBtn = document.getElementById('scene1-step-btn-next');
            
            if (prevBtn) {
                prevBtn.addEventListener('click', handlePrev);
            }
            if (nextBtn) {
                nextBtn.addEventListener('click', handleNext);
            }
            
            // 初始显示步骤 0
            updateStepDisplay();
        }
        
        // 页面加载完成后初始化
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>
</body>
</html>
