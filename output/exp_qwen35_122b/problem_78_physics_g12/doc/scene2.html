<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 匀速运动受力平衡分析与速度比推导</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene2-btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .scene2-btn:disabled { background: #cccccc; cursor: not-allowed; }
        .scene2-btn:not(:disabled) { background: #1976d2; color: white; }
        .scene2-btn:not(:disabled):hover { background: #1565c0; }
        #scene2-step-indicator { position: absolute; bottom: 20px; right: 20px; font-size: 14px; color: #666; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- ==================== 左侧图示区 ==================== -->
            
            <!-- 左导轨 -->
            <line id="scene2-rail-left" x1="60" y1="50" x2="60" y2="350" stroke="#000000" stroke-width="4"/>
            
            <!-- 右导轨 -->
            <line id="scene2-rail-right" x1="360" y1="50" x2="360" y2="350" stroke="#000000" stroke-width="4"/>
            
            <!-- 顶部电阻连接线 -->
            <line id="scene2-rail-top" x1="60" y1="50" x2="360" y2="50" stroke="#000000" stroke-width="4"/>
            
            <!-- 电阻 R 框 - 上移避免裁切 -->
            <rect id="scene2-resistor-box" x="150" y="40" width="120" height="15" fill="#ffffff" stroke="#000000" stroke-width="2"/>
            <text id="scene2-resistor-label" x="210" y="37" text-anchor="middle" font-size="16" fill="#000000">R</text>
            
            <!-- 导体棒 a -->
            <line id="scene2-rod-a" x1="60" y1="140" x2="360" y2="140" stroke="#000000" stroke-width="4"/>
            <text id="scene2-rod-a-label" x="210" y="130" text-anchor="middle" font-size="16" fill="#000000">a</text>
            <text id="scene2-M-label" x="380" y="145" text-anchor="start" font-size="16" fill="#000000">M</text>
            
            <!-- 导体棒 b -->
            <line id="scene2-rod-b" x1="60" y1="190" x2="360" y2="190" stroke="#000000" stroke-width="4"/>
            <text id="scene2-rod-b-label" x="210" y="180" text-anchor="middle" font-size="16" fill="#000000">b</text>
            <text id="scene2-N-label" x="380" y="195" text-anchor="start" font-size="16" fill="#000000">N</text>
            
            <!-- 磁场区域 -->
            <rect id="scene2-magnetic-field" x="60" y="250" width="300" height="100" fill="#1565c0" fill-opacity="0.15"/>
            
            <!-- L1 虚线 -->
            <line id="scene2-L1" x1="60" y1="250" x2="360" y2="250" stroke="#1565c0" stroke-width="1" stroke-dasharray="5,5"/>
            <text id="scene2-L1-label" x="370" y="255" text-anchor="start" font-size="16" fill="#1565c0">L₁</text>
            
            <!-- L2 虚线 -->
            <line id="scene2-L2" x1="60" y1="350" x2="360" y2="350" stroke="#1565c0" stroke-width="1" stroke-dasharray="5,5"/>
            <text id="scene2-L2-label" x="370" y="355" text-anchor="start" font-size="16" fill="#1565c0">L₂</text>
            
            <!-- d 标注双向箭头 - 右移避免裁切 -->
            <line id="scene2-d-arrow" x1="40" y1="250" x2="40" y2="350" stroke="#000000" stroke-width="2"/>
            <line id="scene2-d-arrow-top" x1="35" y1="250" x2="45" y2="250" stroke="#000000" stroke-width="2"/>
            <line id="scene2-d-arrow-bottom" x1="35" y1="350" x2="45" y2="350" stroke="#000000" stroke-width="2"/>
            <text id="scene2-d-label" x="30" y="305" text-anchor="middle" font-size="14" fill="#000000">d=0.5m</text>
            
            <!-- B 标签（移到磁场区域右侧） -->
            <text id="scene2-B-label" x="370" y="305" text-anchor="start" font-size="16" fill="#1565c0">B</text>
            
            <!-- ×符号组（磁场方向）- 减少数量，均匀分布 -->
            <g id="scene2-cross-group">
                <text x="80" y="275" font-size="14" fill="#1565c0">×</text>
                <text x="130" y="275" font-size="14" fill="#1565c0">×</text>
                <text x="180" y="275" font-size="14" fill="#1565c0">×</text>
                <text x="230" y="275" font-size="14" fill="#1565c0">×</text>
                <text x="280" y="275" font-size="14" fill="#1565c0">×</text>
                <text x="330" y="275" font-size="14" fill="#1565c0">×</text>
                <text x="80" y="305" font-size="14" fill="#1565c0">×</text>
                <text x="130" y="305" font-size="14" fill="#1565c0">×</text>
                <text x="180" y="305" font-size="14" fill="#1565c0">×</text>
                <text x="230" y="305" font-size="14" fill="#1565c0">×</text>
                <text x="280" y="305" font-size="14" fill="#1565c0">×</text>
                <text x="330" y="305" font-size="14" fill="#1565c0">×</text>
            </g>
            
            <!-- 重力 mg 箭头（从 a 棒中心向下） -->
            <line id="scene2-mg-arrow" x1="210" y1="140" x2="210" y2="185" stroke="#c62828" stroke-width="3" opacity="0"/>
            <polygon id="scene2-mg-arrow-head" points="210,185 205,172 215,172" fill="#c62828" opacity="0"/>
            <text id="scene2-mg-label" x="220" y="165" font-size="16" fill="#c62828" opacity="0">mg</text>
            
            <!-- 安培力 F_安箭头（从 a 棒中心向上，与 mg 等长）- 移到更右侧 -->
            <line id="scene2-famp-arrow" x1="250" y1="185" x2="250" y2="140" stroke="#2e7d32" stroke-width="3" opacity="0"/>
            <polygon id="scene2-famp-arrow-head" points="250,140 245,153 255,153" fill="#2e7d32" opacity="0"/>
            <text id="scene2-famp-label" x="260" y="165" font-size="16" fill="#2e7d32" opacity="0">F_安</text>
            
            <!-- 速度 v 箭头（从 a 棒右侧向下，较小）- 移到更右侧 -->
            <line id="scene2-v-arrow" x1="285" y1="140" x2="285" y2="165" stroke="#1565c0" stroke-width="2" opacity="0"/>
            <polygon id="scene2-v-arrow-head" points="285,165 281,154 289,154" fill="#1565c0" opacity="0"/>
            <text id="scene2-v-label" x="295" y="155" font-size="16" fill="#1565c0" opacity="0">v</text>
            
            <!-- ==================== 右侧公式区 ==================== -->
            
            <!-- 公式标题 -->
            <text id="scene2-formula-title" x="430" y="50" font-size="18" font-weight="bold" fill="#000000">公式推导</text>
            
            <!-- 步骤 1 公式 -->
            <text id="scene2-formula-1" x="430" y="90" font-size="15" fill="#000000" opacity="0">匀速运动：mg = F_安</text>
            
            <!-- 步骤 2 公式 -->
            <text id="scene2-formula-2" x="430" y="125" font-size="15" fill="#000000" opacity="0">感应电动势：ε = BLv</text>
            
            <!-- 步骤 3 公式 -->
            <text id="scene2-formula-3" x="430" y="160" font-size="15" fill="#000000" opacity="0">感应电流：I = ε/R_总 = BLv/R_总</text>
            
            <!-- 步骤 4 公式 -->
            <text id="scene2-formula-4" x="430" y="195" font-size="15" fill="#000000" opacity="0">安培力：F_安 = BIL = B²L²v/R_总</text>
            
            <!-- 步骤 5 公式 -->
            <text id="scene2-formula-5" x="430" y="230" font-size="15" fill="#000000" opacity="0">速度公式：v = mgR_总/(B²L²)</text>
            
            <!-- 步骤 6 公式 -->
            <text id="scene2-formula-6" x="430" y="265" font-size="15" fill="#000000" opacity="0">R_总 a = R∥R_a = 1.5Ω</text>
            <text id="scene2-formula-6b" x="430" y="285" font-size="15" fill="#000000" opacity="0">R_总 b = R∥R_b = 2Ω</text>
            
            <!-- 步骤 7 公式 -->
            <text id="scene2-formula-7" x="430" y="320" font-size="15" fill="#000000" opacity="0">vₐ/vᵦ = (mₐR_总 a)/(mᵦR_总 b)</text>
            <text id="scene2-formula-7b" x="430" y="340" font-size="15" fill="#000000" opacity="0">= (0.2×1.5)/(0.1×2) = 1.5</text>
            
            <!-- 步骤 8 公式 - 合并为一行，避免重叠 -->
            <text id="scene2-formula-8" x="430" y="375" font-size="15" fill="#000000" opacity="0">Q_R = (R/(R+R_b))×mᵦgd = 0.3J</text>
            
            <!-- 参数表格（初始隐藏）- 移到更下方，避免与公式重叠，同时避免与按钮重叠 -->
            <g id="scene2-table-group" opacity="0">
                <!-- 表格边框 -->
                <rect id="scene2-table-border" x="430" y="425" width="340" height="35" fill="#ffffff" stroke="#888888" stroke-width="1"/>
                <!-- 表头 -->
                <rect id="scene2-table-header" x="430" y="425" width="340" height="14" fill="#1565c0" fill-opacity="0.2"/>
                <text id="scene2-table-header-text" x="600" y="436" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565c0">参数对比</text>
                <!-- 表格内容 -->
                <line id="scene2-table-line1" x1="430" y1="448" x2="770" y2="448" stroke="#888888" stroke-width="1"/>
                <line id="scene2-table-line2" x1="500" y1="425" x2="500" y2="460" stroke="#888888" stroke-width="1"/>
                <line id="scene2-table-line3" x1="580" y1="425" x2="580" y2="460" stroke="#888888" stroke-width="1"/>
                <line id="scene2-table-line4" x1="660" y1="425" x2="660" y2="460" stroke="#888888" stroke-width="1"/>
                <line id="scene2-table-line5" x1="740" y1="425" x2="740" y2="460" stroke="#888888" stroke-width="1"/>
                <text id="scene2-table-row1" x="450" y="442" font-size="10" fill="#000000">棒</text>
                <text id="scene2-table-row2" x="540" y="442" text-anchor="middle" font-size="10" fill="#000000">m(kg)</text>
                <text id="scene2-table-row3" x="620" y="442" text-anchor="middle" font-size="10" fill="#000000">R_b(Ω)</text>
                <text id="scene2-table-row4" x="700" y="442" text-anchor="middle" font-size="10" fill="#000000">R_总 (Ω)</text>
                <text id="scene2-table-data1" x="450" y="460" font-size="10" fill="#000000">a</text>
                <text id="scene2-table-data2" x="540" y="460" text-anchor="middle" font-size="10" fill="#000000">0.2</text>
                <text id="scene2-table-data3" x="620" y="460" text-anchor="middle" font-size="10" fill="#000000">3</text>
                <text id="scene2-table-data4" x="700" y="460" text-anchor="middle" font-size="10" fill="#000000">1.5</text>
                <text id="scene2-table-data5" x="450" y="472" font-size="10" fill="#000000">b</text>
                <text id="scene2-table-data6" x="540" y="472" text-anchor="middle" font-size="10" fill="#000000">0.1</text>
                <text id="scene2-table-data7" x="620" y="472" text-anchor="middle" font-size="10" fill="#000000">6</text>
                <text id="scene2-table-data8" x="700" y="472" text-anchor="middle" font-size="10" fill="#000000">2.0</text>
            </g>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-prev-btn" class="scene2-btn" disabled>◀ 上一步</button>
            <button id="scene2-next-btn" class="scene2-btn">下一步 ▶</button>
        </div>
        <div id="scene2-step-indicator">步骤 0/8</div>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现
        const TOTAL_STEPS = 8;
        let currentStep = 0;
        
        // 工具函数：显示元素
        function show(el) {
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '1';
                el.setAttribute('opacity', '1');
            }
        }
        
        // 工具函数：隐藏元素
        function hide(el) {
            if (el) {
                el.style.display = 'none';
                el.style.opacity = '0';
                el.setAttribute('opacity', '0');
            }
        }
        
        // 工具函数：显示 SVG 元素
        function showSvg(el) {
            if (el) {
                el.style.opacity = '1';
                el.setAttribute('opacity', '1');
            }
        }
        
        // 工具函数：隐藏 SVG 元素
        function hideSvg(el) {
            if (el) {
                el.style.opacity = '0';
                el.setAttribute('opacity', '0');
            }
        }
        
        // 更新场景显示
        function updateScene() {
            // 重置所有力矢量和公式
            hideSvg(document.getElementById('scene2-mg-arrow'));
            hideSvg(document.getElementById('scene2-mg-arrow-head'));
            hideSvg(document.getElementById('scene2-mg-label'));
            hideSvg(document.getElementById('scene2-famp-arrow'));
            hideSvg(document.getElementById('scene2-famp-arrow-head'));
            hideSvg(document.getElementById('scene2-famp-label'));
            hideSvg(document.getElementById('scene2-v-arrow'));
            hideSvg(document.getElementById('scene2-v-arrow-head'));
            hideSvg(document.getElementById('scene2-v-label'));
            
            for (let i = 1; i <= 8; i++) {
                hide(document.getElementById('scene2-formula-' + i));
                hide(document.getElementById('scene2-formula-' + i + 'b'));
            }
            hide(document.getElementById('scene2-table-group'));
            
            // 根据当前步骤显示对应元素
            if (currentStep >= 1) {
                showSvg(document.getElementById('scene2-mg-arrow'));
                showSvg(document.getElementById('scene2-mg-arrow-head'));
                showSvg(document.getElementById('scene2-mg-label'));
                show(document.getElementById('scene2-formula-1'));
            }
            
            if (currentStep >= 2) {
                showSvg(document.getElementById('scene2-famp-arrow'));
                showSvg(document.getElementById('scene2-famp-arrow-head'));
                showSvg(document.getElementById('scene2-famp-label'));
                show(document.getElementById('scene2-formula-2'));
            }
            
            if (currentStep >= 3) {
                showSvg(document.getElementById('scene2-v-arrow'));
                showSvg(document.getElementById('scene2-v-arrow-head'));
                showSvg(document.getElementById('scene2-v-label'));
                show(document.getElementById('scene2-formula-3'));
            }
            
            if (currentStep >= 4) {
                show(document.getElementById('scene2-formula-4'));
            }
            
            if (currentStep >= 5) {
                show(document.getElementById('scene2-formula-5'));
                document.getElementById('scene2-formula-5').setAttribute('font-weight', 'bold');
            }
            
            if (currentStep >= 6) {
                show(document.getElementById('scene2-formula-6'));
                show(document.getElementById('scene2-formula-6b'));
                show(document.getElementById('scene2-table-group'));
            }
            
            if (currentStep >= 7) {
                show(document.getElementById('scene2-formula-7'));
                show(document.getElementById('scene2-formula-7b'));
                document.getElementById('scene2-formula-7b').setAttribute('font-weight', 'bold');
                document.getElementById('scene2-formula-7b').setAttribute('fill', '#2e7d32');
            }
            
            if (currentStep >= 8) {
                show(document.getElementById('scene2-formula-8'));
                // 高亮最终结果
                document.getElementById('scene2-formula-8').setAttribute('font-weight', 'bold');
                document.getElementById('scene2-formula-8').setAttribute('font-size', '18');
                document.getElementById('scene2-formula-8').setAttribute('fill', '#2e7d32');
            }
            
            // 更新按钮状态
            document.getElementById('scene2-prev-btn').disabled = (currentStep === 0);
            document.getElementById('scene2-next-btn').disabled = (currentStep === TOTAL_STEPS);
            
            // 更新步骤指示器
            document.getElementById('scene2-step-indicator').textContent = '步骤 ' + currentStep + '/' + TOTAL_STEPS;
        }
        
        // 事件绑定
        document.getElementById('scene2-prev-btn').addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });
        
        document.getElementById('scene2-next-btn').addEventListener('click', function() {
            if (currentStep < TOTAL_STEPS) {
                currentStep++;
                updateScene();
            }
        });
        
        // 初始化
        updateScene();
    })();
    </script>
</body>
</html>
