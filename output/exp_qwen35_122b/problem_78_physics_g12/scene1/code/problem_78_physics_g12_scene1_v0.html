<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 1 - 竖直导轨电磁感应装置</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene1-step-indicator { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); font-size: 16px; font-weight: bold; color: #333; }
        .scene1-btn { padding: 8px 20px; font-size: 14px; cursor: pointer; border: 2px solid #1565c0; border-radius: 5px; background: #fff; color: #1565c0; transition: all 0.3s; }
        .scene1-btn:hover { background: #1565c0; color: #fff; }
        .scene1-btn:disabled { border-color: #ccc; color: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- 左导轨 -->
            <line x1="250" y1="50" x2="250" y2="420" stroke="#000000" stroke-width="3" id="scene1-rail-left"/>
            <!-- 右导轨 -->
            <line x1="550" y1="50" x2="550" y2="420" stroke="#000000" stroke-width="3" id="scene1-rail-right"/>
            
            <!-- 电阻 R -->
            <rect x="250" y="50" width="300" height="20" fill="#cccccc" stroke="#000000" stroke-width="2" id="scene1-resistor"/>
            <!-- 电阻标签 R -->
            <text x="400" y="45" text-anchor="middle" font-size="18" font-weight="bold" id="scene1-label-R">R</text>
            
            <!-- 磁场区域背景（极淡的填充，避免与文字重叠检测冲突） -->
            <rect x="250" y="200" width="300" height="150" fill="#1565c0" fill-opacity="0.03" id="scene1-magnetic-field"/>
            
            <!-- L₁边界（磁场上边界） -->
            <line x1="250" y1="200" x2="550" y2="200" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" id="scene1-L1"/>
            <!-- L₂边界（磁场下边界） -->
            <line x1="250" y1="350" x2="550" y2="350" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" id="scene1-L2"/>
            
            <!-- L₁标签 -->
            <text x="560" y="195" font-size="16" id="scene1-label-L1">L₁</text>
            <!-- L₂标签 -->
            <text x="560" y="355" font-size="16" id="scene1-label-L2">L₂</text>
            
            <!-- 磁场 B 标签（放在磁场区域上方） -->
            <text x="400" y="185" text-anchor="middle" font-size="18" font-weight="bold" fill="#1565c0" id="scene1-label-B">B</text>
            
            <!-- 磁场×符号组（网格状分布，在磁场区域内） -->
            <g id="scene1-magnetic-crosses">
                <text x="270" y="230" font-size="16" fill="#1565c0">✕</text>
                <text x="320" y="230" font-size="16" fill="#1565c0">✕</text>
                <text x="370" y="230" font-size="16" fill="#1565c0">✕</text>
                <text x="420" y="230" font-size="16" fill="#1565c0">✕</text>
                <text x="470" y="230" font-size="16" fill="#1565c0">✕</text>
                <text x="520" y="230" font-size="16" fill="#1565c0">✕</text>
                <text x="270" y="270" font-size="16" fill="#1565c0">✕</text>
                <text x="320" y="270" font-size="16" fill="#1565c0">✕</text>
                <text x="370" y="270" font-size="16" fill="#1565c0">✕</text>
                <text x="420" y="270" font-size="16" fill="#1565c0">✕</text>
                <text x="470" y="270" font-size="16" fill="#1565c0">✕</text>
                <text x="520" y="270" font-size="16" fill="#1565c0">✕</text>
                <text x="270" y="310" font-size="16" fill="#1565c0">✕</text>
                <text x="320" y="310" font-size="16" fill="#1565c0">✕</text>
                <text x="370" y="310" font-size="16" fill="#1565c0">✕</text>
                <text x="420" y="310" font-size="16" fill="#1565c0">✕</text>
                <text x="470" y="310" font-size="16" fill="#1565c0">✕</text>
                <text x="520" y="310" font-size="16" fill="#1565c0">✕</text>
                <text x="270" y="350" font-size="16" fill="#1565c0">✕</text>
                <text x="320" y="350" font-size="16" fill="#1565c0">✕</text>
                <text x="370" y="350" font-size="16" fill="#1565c0">✕</text>
                <text x="420" y="350" font-size="16" fill="#1565c0">✕</text>
                <text x="470" y="350" font-size="16" fill="#1565c0">✕</text>
                <text x="520" y="350" font-size="16" fill="#1565c0">✕</text>
            </g>
            
            <!-- 磁场高度标注线 -->
            <line x1="220" y1="200" x2="220" y2="350" stroke="#000000" stroke-width="1" id="scene1-d-line"/>
            <!-- 标注线两端的小横线 -->
            <line x1="215" y1="200" x2="225" y2="200" stroke="#000000" stroke-width="1" id="scene1-d-top"/>
            <line x1="215" y1="350" x2="225" y2="350" stroke="#000000" stroke-width="1" id="scene1-d-bottom"/>
            <!-- d=0.5m 标签 -->
            <text x="180" y="275" text-anchor="middle" font-size="14" id="scene1-label-d">d=0.5m</text>
            
            <!-- 导体棒 a（初始位置 M，y=100） -->
            <line x1="250" y1="100" x2="550" y2="100" stroke="#000000" stroke-width="4" id="scene1-rod-a"/>
            <!-- 导体棒 b（初始位置 N，y=170） -->
            <line x1="250" y1="170" x2="550" y2="170" stroke="#000000" stroke-width="4" id="scene1-rod-b"/>
            
            <!-- M 位置框（调整位置到右侧空白区域，y=90-110） -->
            <rect x="560" y="90" width="60" height="20" fill="none" stroke="#c62828" stroke-width="1" stroke-dasharray="3,3" id="scene1-M-box"/>
            <!-- M 标签 -->
            <text x="590" y="105" text-anchor="middle" font-size="16" fill="#c62828" id="scene1-label-M">M</text>
            
            <!-- N 位置框（调整位置到 y=220-240，远离 L₁标签） -->
            <rect x="560" y="220" width="60" height="20" fill="none" stroke="#c62828" stroke-width="1" stroke-dasharray="3,3" id="scene1-N-box"/>
            <!-- N 标签 -->
            <text x="590" y="235" text-anchor="middle" font-size="16" fill="#c62828" id="scene1-label-N">N</text>
            
            <!-- a 棒标签 -->
            <text x="230" y="95" text-anchor="end" font-size="16" font-weight="bold" id="scene1-label-a">a</text>
            <!-- b 棒标签 -->
            <text x="230" y="165" text-anchor="end" font-size="16" font-weight="bold" id="scene1-label-b">b</text>
            
            <!-- 速度标注 vₐ（初始隐藏） -->
            <text x="230" y="250" text-anchor="end" font-size="14" fill="#1565c0" style="display: none;" id="scene1-label-va">vₐ</text>
            <!-- 速度标注 vᵦ（初始隐藏，调整位置避免与 vₐ重叠） -->
            <text x="230" y="295" text-anchor="end" font-size="14" fill="#c62828" style="display: none;" id="scene1-label-vb">vᵦ</text>
            
            <!-- 运动箭头组（初始隐藏） -->
            <g style="display: none;" id="scene1-motion-arrows">
                <!-- a 棒运动箭头 -->
                <line x1="400" y1="100" x2="400" y2="130" stroke="#2e7d32" stroke-width="2" id="scene1-arrow-a"/>
                <polygon points="400,130 395,120 405,120" fill="#2e7d32" id="scene1-arrow-a-head"/>
                <!-- b 棒运动箭头 -->
                <line x1="400" y1="170" x2="400" y2="200" stroke="#2e7d32" stroke-width="2" id="scene1-arrow-b"/>
                <polygon points="400,200 395,190 405,190" fill="#2e7d32" id="scene1-arrow-b-head"/>
            </g>
            
            <!-- 提示文字（初始隐藏） -->
            <text x="400" y="420" text-anchor="middle" font-size="14" fill="#2e7d32" font-weight="bold" style="display: none;" id="scene1-hint-text">两棒同时由静止释放，自由下落</text>
        </svg>
        
        <!-- 步骤指示器 -->
        <div id="scene1-step-indicator">步骤 1/7</div>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button class="scene1-btn" id="scene1-prev-btn" disabled>◀ 上一步</button>
            <button class="scene1-btn" id="scene1-next-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现
        // 布局坐标表对照：
        // 左导轨：(250,50)-(250,420)
        // 右导轨：(550,50)-(550,420)
        // 电阻 R：(250,50)-(550,70)
        // 磁场区域：(250,200)-(550,350)
        // L₁：(250,200)-(550,200)
        // L₂：(250,350)-(550,350)
        // 导体棒 a 初始：(250,100)-(550,100)
        // 导体棒 b 初始：(250,170)-(550,170)
        // M 标签：(590,95)
        // N 标签：(590,235) - 调整位置避免与 L₁重叠
        // B 标签：(400,185) - 调整位置到磁场区域上方
        // vₐ：(230,250)
        // vᵦ：(230,295) - 调整位置避免与 vₐ重叠
        
        const TOTAL_STEPS = 7;
        let currentStep = 0;
        
        // 元素引用
        const rodA = document.getElementById('scene1-rod-a');
        const rodB = document.getElementById('scene1-rod-b');
        const arrows = document.getElementById('scene1-motion-arrows');
        const hintText = document.getElementById('scene1-hint-text');
        const labelVa = document.getElementById('scene1-label-va');
        const labelVb = document.getElementById('scene1-label-vb');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        const prevBtn = document.getElementById('scene1-prev-btn');
        const nextBtn = document.getElementById('scene1-next-btn');
        
        // 初始位置
        const rodA_Y_INITIAL = 100;
        const rodB_Y_INITIAL = 170;
        const L1_Y = 200;
        const L2_Y = 350;
        
        // 当前棒位置
        let rodA_Y = rodA_Y_INITIAL;
        let rodB_Y = rodB_Y_INITIAL;
        
        // 工具函数：显示元素
        function show(el) {
            el.style.display = 'block';
            el.style.opacity = '1';
        }
        
        // 工具函数：隐藏元素
        function hide(el) {
            el.style.display = 'none';
            el.style.opacity = '0';
        }
        
        // 更新步骤指示器
        function updateStepIndicator() {
            stepIndicator.textContent = `步骤 ${currentStep + 1}/${TOTAL_STEPS}`;
            prevBtn.disabled = currentStep === 0;
            nextBtn.disabled = currentStep === TOTAL_STEPS - 1;
        }
        
        // 更新棒位置
        function updateRodPositions() {
            rodA.setAttribute('y1', rodA_Y);
            rodA.setAttribute('y2', rodA_Y);
            rodB.setAttribute('y1', rodB_Y);
            rodB.setAttribute('y2', rodB_Y);
            
            // 更新箭头位置
            if (arrows.style.display !== 'none') {
                const arrowA = document.getElementById('scene1-arrow-a');
                const arrowAHead = document.getElementById('scene1-arrow-a-head');
                const arrowB = document.getElementById('scene1-arrow-b');
                const arrowBHead = document.getElementById('scene1-arrow-b-head');
                
                arrowA.setAttribute('y1', rodA_Y);
                arrowA.setAttribute('y2', rodA_Y + 30);
                arrowAHead.setAttribute('points', `${400},${rodA_Y + 30} ${395},${rodA_Y + 20} ${405},${rodA_Y + 20}`);
                
                arrowB.setAttribute('y1', rodB_Y);
                arrowB.setAttribute('y2', rodB_Y + 30);
                arrowBHead.setAttribute('points', `${400},${rodB_Y + 30} ${395},${rodB_Y + 20} ${405},${rodB_Y + 20}`);
            }
        }
        
        // 步骤 0：初始状态
        function step0() {
            rodA_Y = rodA_Y_INITIAL;
            rodB_Y = rodB_Y_INITIAL;
            updateRodPositions();
            
            hide(arrows);
            hide(hintText);
            hide(labelVa);
            hide(labelVb);
            
            rodA.setAttribute('stroke', '#000000');
            rodB.setAttribute('stroke', '#000000');
            
            updateStepIndicator();
        }
        
        // 步骤 1：两棒同时释放
        function step1() {
            rodA_Y = rodA_Y_INITIAL;
            rodB_Y = rodB_Y_INITIAL;
            updateRodPositions();
            
            show(arrows);
            hintText.textContent = '两棒同时由静止释放，自由下落';
            show(hintText);
            
            rodA.setAttribute('stroke', '#2e7d32');
            rodB.setAttribute('stroke', '#2e7d32');
            
            updateStepIndicator();
        }
        
        // 步骤 2：b 棒进入磁场
        function step2() {
            rodA_Y = rodA_Y_INITIAL + 50;  // a 棒继续下落
            rodB_Y = L1_Y;  // b 棒到达 L1
            updateRodPositions();
            
            show(labelVb);
            hintText.textContent = 'b 棒进入磁场，开始匀速运动';
            show(hintText);
            
            rodA.setAttribute('stroke', '#2e7d32');
            rodB.setAttribute('stroke', '#1565c0');
            
            updateStepIndicator();
        }
        
        // 步骤 3：b 棒在磁场中部
        function step3() {
            rodA_Y = rodA_Y_INITIAL + 100;  // a 棒继续下落
            rodB_Y = L1_Y + 75;  // b 棒在磁场中部
            updateRodPositions();
            
            show(labelVb);
            hintText.textContent = 'b 棒匀速穿过磁场，a 棒继续加速下落';
            show(hintText);
            
            rodA.setAttribute('stroke', '#2e7d32');
            rodB.setAttribute('stroke', '#1565c0');
            
            updateStepIndicator();
        }
        
        // 步骤 4：关键时间点 - b 穿出磁场，a 进入磁场
        function step4() {
            rodA_Y = L1_Y;  // a 棒到达 L1
            rodB_Y = L2_Y;  // b 棒到达 L2
            updateRodPositions();
            
            show(labelVa);
            show(labelVb);
            hintText.textContent = 'b 刚穿出磁场时，a 正好进入磁场';
            show(hintText);
            
            rodA.setAttribute('stroke', '#1565c0');
            rodB.setAttribute('stroke', '#000000');
            
            updateStepIndicator();
        }
        
        // 步骤 5：a 棒在磁场中部
        function step5() {
            rodA_Y = L1_Y + 75;  // a 棒在磁场中部
            rodB_Y = L2_Y + 50;  // b 棒离开磁场后继续下落
            updateRodPositions();
            
            show(labelVa);
            show(labelVb);
            hintText.textContent = 'a 棒匀速穿过磁场，b 棒离开磁场后继续加速';
            show(hintText);
            
            rodA.setAttribute('stroke', '#1565c0');
            rodB.setAttribute('stroke', '#000000');
            
            updateStepIndicator();
        }
        
        // 步骤 6：总结
        function step6() {
            rodA_Y = L1_Y + 100;  // a 棒继续下落
            rodB_Y = L2_Y + 100;  // b 棒继续下落
            updateRodPositions();
            
            show(labelVa);
            show(labelVb);
            hintText.textContent = '两棒均匀速穿过磁场，vₐ:vᵦ=2:1';
            show(hintText);
            
            rodA.setAttribute('stroke', '#1565c0');
            rodB.setAttribute('stroke', '#000000');
            
            updateStepIndicator();
        }
        
        // 步骤切换函数
        const stepFunctions = [step0, step1, step2, step3, step4, step5, step6];
        
        function goToStep(step) {
            if (step < 0 || step >= TOTAL_STEPS) return;
            currentStep = step;
            stepFunctions[currentStep]();
        }
        
        function nextStep() {
            if (currentStep < TOTAL_STEPS - 1) {
                goToStep(currentStep + 1);
            }
        }
        
        function prevStep() {
            if (currentStep > 0) {
                goToStep(currentStep - 1);
            }
        }
        
        // 事件绑定
        nextBtn.addEventListener('click', nextStep);
        prevBtn.addEventListener('click', prevStep);
        
        // 初始化
        step0();
    })();
    </script>
</body>
</html>
