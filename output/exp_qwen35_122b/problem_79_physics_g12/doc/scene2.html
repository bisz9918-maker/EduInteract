<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 2 - 临界状态分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        #scene2-controls button { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #333; border-radius: 4px; background: #f5f5f5; }
        #scene2-controls button:hover { background: #e0e0e0; }
        #scene2-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene2-step-indicator { position: absolute; bottom: 45px; left: 50%; transform: translateX(-50%); font-size: 14px; color: #666; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" id="scene2-svg">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene2-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#333" />
                </marker>
                <marker id="scene2-arrowhead-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#1565c0" />
                </marker>
                <marker id="scene2-arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#c62828" />
                </marker>
                <marker id="scene2-arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#2e7d32" />
                </marker>
            </defs>

            <!-- 地面 -->
            <line id="scene2-ground-line" x1="100" y1="300" x2="700" y2="300" stroke="#333" stroke-width="2" />
            <!-- 地面阴影线 -->
            <g id="scene2-ground-shading">
                <line x1="100" y1="300" x2="120" y2="320" stroke="#999" stroke-width="1" />
                <line x1="120" y1="300" x2="140" y2="320" stroke="#999" stroke-width="1" />
                <line x1="140" y1="300" x2="160" y2="320" stroke="#999" stroke-width="1" />
                <line x1="160" y1="300" x2="180" y2="320" stroke="#999" stroke-width="1" />
                <line x1="180" y1="300" x2="200" y2="320" stroke="#999" stroke-width="1" />
                <line x1="200" y1="300" x2="220" y2="320" stroke="#999" stroke-width="1" />
                <line x1="220" y1="300" x2="240" y2="320" stroke="#999" stroke-width="1" />
                <line x1="240" y1="300" x2="260" y2="320" stroke="#999" stroke-width="1" />
                <line x1="260" y1="300" x2="280" y2="320" stroke="#999" stroke-width="1" />
                <line x1="280" y1="300" x2="300" y2="320" stroke="#999" stroke-width="1" />
                <line x1="300" y1="300" x2="320" y2="320" stroke="#999" stroke-width="1" />
                <line x1="320" y1="300" x2="340" y2="320" stroke="#999" stroke-width="1" />
                <line x1="340" y1="300" x2="360" y2="320" stroke="#999" stroke-width="1" />
                <line x1="360" y1="300" x2="380" y2="320" stroke="#999" stroke-width="1" />
                <line x1="380" y1="300" x2="400" y2="320" stroke="#999" stroke-width="1" />
                <line x1="400" y1="300" x2="420" y2="320" stroke="#999" stroke-width="1" />
                <line x1="420" y1="300" x2="440" y2="320" stroke="#999" stroke-width="1" />
                <line x1="440" y1="300" x2="460" y2="320" stroke="#999" stroke-width="1" />
                <line x1="460" y1="300" x2="480" y2="320" stroke="#999" stroke-width="1" />
                <line x1="480" y1="300" x2="500" y2="320" stroke="#999" stroke-width="1" />
                <line x1="500" y1="300" x2="520" y2="320" stroke="#999" stroke-width="1" />
                <line x1="520" y1="300" x2="540" y2="320" stroke="#999" stroke-width="1" />
                <line x1="540" y1="300" x2="560" y2="320" stroke="#999" stroke-width="1" />
                <line x1="560" y1="300" x2="580" y2="320" stroke="#999" stroke-width="1" />
                <line x1="580" y1="300" x2="600" y2="320" stroke="#999" stroke-width="1" />
                <line x1="600" y1="300" x2="620" y2="320" stroke="#999" stroke-width="1" />
                <line x1="620" y1="300" x2="640" y2="320" stroke="#999" stroke-width="1" />
                <line x1="640" y1="300" x2="660" y2="320" stroke="#999" stroke-width="1" />
                <line x1="660" y1="300" x2="680" y2="320" stroke="#999" stroke-width="1" />
                <line x1="680" y1="300" x2="700" y2="320" stroke="#999" stroke-width="1" />
            </g>

            <!-- 木板 M -->
            <rect id="scene2-rect-M" x="150" y="240" width="500" height="60" fill="#e3f2fd" stroke="#333" stroke-width="2" />
            <text id="scene2-label-M" x="380" y="265" font-size="18" fill="#333" text-anchor="middle" font-weight="bold">M</text>

            <!-- 物块 m -->
            <rect id="scene2-rect-m" x="570" y="190" width="80" height="50" fill="#e8f5e9" stroke="#333" stroke-width="2" />
            <text id="scene2-label-m" x="610" y="215" font-size="18" fill="#333" text-anchor="middle" font-weight="bold">m</text>

            <!-- L 标注线 -->
            <line id="scene2-line-L" x1="150" y1="315" x2="650" y2="315" stroke="#666" stroke-width="1" stroke-dasharray="5,5" />
            <line id="scene2-line-L-left" x1="150" y1="310" x2="150" y2="320" stroke="#666" stroke-width="1" />
            <line id="scene2-line-L-right" x1="650" y1="310" x2="650" y2="320" stroke="#666" stroke-width="1" />
            <text id="scene2-label-L" x="400" y="325" font-size="14" fill="#666" text-anchor="middle">L = 1.6m</text>

            <!-- 拉力 F 箭头 (步骤 1 显示) -->
            <line id="scene2-arrow-F" x1="650" y1="215" x2="730" y2="215" stroke="#1565c0" stroke-width="4" marker-end="url(#scene2-arrowhead-blue)" opacity="0" style="display: none;" />
            <text id="scene2-label-F" x="735" y="210" font-size="16" fill="#1565c0" opacity="0" style="display: none;">F</text>

            <!-- 摩擦力 f 箭头 (步骤 1 显示) -->
            <line id="scene2-arrow-f" x1="570" y1="225" x2="520" y2="225" stroke="#c62828" stroke-width="4" marker-end="url(#scene2-arrowhead-red)" opacity="0" style="display: none;" />
            <text id="scene2-label-f" x="515" y="210" font-size="16" fill="#c62828" opacity="0" style="display: none;">f</text>

            <!-- a_M 加速度箭头 (步骤 1 显示) -->
            <line id="scene2-arrow-aM" x1="400" y1="270" x2="500" y2="270" stroke="#1565c0" stroke-width="4" marker-end="url(#scene2-arrowhead-blue)" opacity="0" style="display: none;" />
            <text id="scene2-label-aM" x="450" y="255" font-size="14" fill="#1565c0" opacity="0" style="display: none;">a_M</text>

            <!-- a_m 加速度箭头 (步骤 1 显示) -->
            <line id="scene2-arrow-am" x1="610" y1="215" x2="670" y2="215" stroke="#2e7d32" stroke-width="4" marker-end="url(#scene2-arrowhead-green)" opacity="0" style="display: none;" />
            <text id="scene2-label-am" x="640" y="200" font-size="14" fill="#2e7d32" opacity="0" style="display: none;">a_m</text>

            <!-- 公式框 (步骤 1 显示) -->
            <rect id="scene2-formula-box" x="100" y="360" width="600" height="120" fill="none" stroke="#888" stroke-width="2" stroke-dasharray="5,5" opacity="0" style="display: none;" />

            <!-- 步骤文字 -->
            <text id="scene2-text-step0" x="120" y="380" font-size="14" fill="#333">初始状态：系统静止，物块在木板最右端</text>
            <text id="scene2-text-step1" x="120" y="400" font-size="14" fill="#333" opacity="0" style="display: none;">临界条件：a_M = a_m</text>
            <text id="scene2-text-step2" x="120" y="420" font-size="14" fill="#333" opacity="0" style="display: none;">a_m = μg = 0.1×10 = 1m/s²</text>
            <text id="scene2-text-step3" x="120" y="440" font-size="14" fill="#333" opacity="0" style="display: none;">F_min = (M+m)a_m = 4×1 = 4N</text>
            <text id="scene2-text-conclusion" x="120" y="460" font-size="16" fill="#c62828" font-weight="bold" opacity="0" style="display: none;">结论：F > 4N 才能抽离</text>
        </svg>

        <div id="scene2-step-indicator">步骤 1 / 5</div>
        <div id="scene2-controls">
            <button id="scene2-btn-prev">◀ 上一步</button>
            <button id="scene2-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 2 实现 - 临界状态分析
        const scene2 = {
            currentStep: 0,
            totalSteps: 5,
            
            // 元素显示/隐藏配置
            stepElements: {
                0: { // 初始状态
                    show: ['ground-line', 'ground-shading', 'rect-M', 'label-M', 'rect-m', 'label-m', 'line-L', 'line-L-left', 'line-L-right', 'label-L', 'text-step0'],
                    hide: ['arrow-F', 'label-F', 'arrow-f', 'label-f', 'arrow-aM', 'label-aM', 'arrow-am', 'label-am', 'formula-box', 'text-step1', 'text-step2', 'text-step3', 'text-conclusion']
                },
                1: { // 临界条件
                    show: ['ground-line', 'ground-shading', 'rect-M', 'label-M', 'rect-m', 'label-m', 'line-L', 'line-L-left', 'line-L-right', 'label-L', 'text-step0', 'arrow-F', 'label-F', 'arrow-f', 'label-f', 'arrow-aM', 'label-aM', 'arrow-am', 'label-am', 'formula-box', 'text-step1'],
                    hide: ['text-step2', 'text-step3', 'text-conclusion']
                },
                2: { // 物块加速度
                    show: ['ground-line', 'ground-shading', 'rect-M', 'label-M', 'rect-m', 'label-m', 'line-L', 'line-L-left', 'line-L-right', 'label-L', 'text-step0', 'arrow-F', 'label-F', 'arrow-f', 'label-f', 'arrow-aM', 'label-aM', 'arrow-am', 'label-am', 'formula-box', 'text-step1', 'text-step2'],
                    hide: ['text-step3', 'text-conclusion']
                },
                3: { // 最小拉力计算
                    show: ['ground-line', 'ground-shading', 'rect-M', 'label-M', 'rect-m', 'label-m', 'line-L', 'line-L-left', 'line-L-right', 'label-L', 'text-step0', 'arrow-F', 'label-F', 'arrow-f', 'label-f', 'arrow-aM', 'label-aM', 'arrow-am', 'label-am', 'formula-box', 'text-step1', 'text-step2', 'text-step3'],
                    hide: ['text-conclusion']
                },
                4: { // 结论
                    show: ['ground-line', 'ground-shading', 'rect-M', 'label-M', 'rect-m', 'label-m', 'line-L', 'line-L-left', 'line-L-right', 'label-L', 'text-step0', 'arrow-F', 'label-F', 'arrow-f', 'label-f', 'arrow-aM', 'label-aM', 'arrow-am', 'label-am', 'formula-box', 'text-step1', 'text-step2', 'text-step3', 'text-conclusion']
                }
            },

            // 显示元素
            showElement: function(id) {
                const el = document.getElementById('scene2-' + id);
                if (el) {
                    el.style.display = '';
                    el.style.opacity = '0';
                    // 使用 requestAnimationFrame 触发过渡
                    requestAnimationFrame(() => {
                        setTimeout(() => {
                            el.style.opacity = '1';
                        }, 50);
                    });
                }
            },

            // 隐藏元素
            hideElement: function(id) {
                const el = document.getElementById('scene2-' + id);
                if (el) {
                    el.style.opacity = '0';
                    setTimeout(() => {
                        el.style.display = 'none';
                    }, 300);
                }
            },

            // 更新场景显示
            updateScene: function() {
                const config = this.stepElements[this.currentStep];
                
                // 先隐藏所有需要隐藏的元素
                config.hide.forEach(id => {
                    this.hideElement(id);
                });
                
                // 再显示需要显示的元素
                config.show.forEach(id => {
                    this.showElement(id);
                });

                // 更新步骤指示器
                document.getElementById('scene2-step-indicator').textContent = '步骤 ' + (this.currentStep + 1) + ' / ' + this.totalSteps;

                // 更新按钮状态
                document.getElementById('scene2-btn-prev').disabled = (this.currentStep === 0);
                document.getElementById('scene2-btn-next').disabled = (this.currentStep === this.totalSteps - 1);
            },

            // 下一步
            nextStep: function() {
                if (this.currentStep < this.totalSteps - 1) {
                    this.currentStep++;
                    this.updateScene();
                }
            },

            // 上一步
            prevStep: function() {
                if (this.currentStep > 0) {
                    this.currentStep--;
                    this.updateScene();
                }
            },

            // 初始化
            init: function() {
                // 绑定按钮事件
                document.getElementById('scene2-btn-prev').addEventListener('click', () => this.prevStep());
                document.getElementById('scene2-btn-next').addEventListener('click', () => this.nextStep());

                // 初始显示步骤 0
                this.updateScene();
            }
        };

        // 启动场景
        scene2.init();
    })();
    </script>
</body>
</html>
