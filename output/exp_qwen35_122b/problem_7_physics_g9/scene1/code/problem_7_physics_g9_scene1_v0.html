<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 1 - 甲物块浮力对比分析</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 16px; z-index: 10; }
        #scene1-controls button { padding: 8px 20px; font-size: 14px; background: #1976d2; color: white; border: none; border-radius: 4px; cursor: pointer; }
        #scene1-controls button:disabled { background: #bdbdbd; cursor: not-allowed; }
        #scene1-controls button:hover:not(:disabled) { background: #1565c0; }
        #scene1-step-indicator { font-size: 14px; color: #424242; min-width: 80px; text-align: center; }
        .step-group { opacity: 0; transition: opacity 0.3s ease; }
        .step-group.visible { opacity: 1; }
        .highlight-box { fill: none; stroke: #1565c0; stroke-width: 3; opacity: 0; }
        .highlight-box.visible { opacity: 1; }
        .formula-text { font-size: 16px; fill: #424242; }
        .conclusion-text { font-size: 18px; fill: #1565c0; font-weight: bold; }
        .arrow-line { stroke-width: 2; }
        .arrow-head { fill: currentColor; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene1-arrowhead-up" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
                    <polygon points="0,0 10,5 0,10" class="arrow-head" fill="#1565c0"/>
                </marker>
                <marker id="scene1-arrowhead-down-blue" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
                    <polygon points="0,0 10,5 0,10" class="arrow-head" fill="#1565c0"/>
                </marker>
                <marker id="scene1-arrowhead-down-red" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
                    <polygon points="0,0 10,5 0,10" class="arrow-head" fill="#c62828"/>
                </marker>
                <marker id="scene1-arrowhead-down-green" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
                    <polygon points="0,0 10,5 0,10" class="arrow-head" fill="#2e7d32"/>
                </marker>
            </defs>

            <!-- ========== 步骤 0：基础图形 ========== -->
            <!-- 左图水面线 -->
            <line x1="50" y1="150" x2="390" y2="150" stroke="#424242" stroke-width="2"/>
            <!-- 右图水面线 -->
            <line x1="450" y1="150" x2="750" y2="150" stroke="#424242" stroke-width="2"/>

            <!-- 左图甲物块 -->
            <rect id="scene1-block-jia-left" x="150" y="150" width="100" height="70" fill="#e3f2fd" fill-opacity="0.6" stroke="#424242" stroke-width="2"/>
            <!-- 右图甲物块 -->
            <rect id="scene1-block-jia-right" x="550" y="150" width="100" height="70" fill="#e3f2fd" fill-opacity="0.6" stroke="#424242" stroke-width="2"/>

            <!-- 左图乙物块 -->
            <rect id="scene1-block-yi" x="170" y="260" width="60" height="60" fill="#e3f2fd" fill-opacity="0.6" stroke="#424242" stroke-width="2"/>
            <!-- 右图丙物块 -->
            <rect id="scene1-block-bing" x="570" y="90" width="60" height="60" fill="#e3f2fd" fill-opacity="0.6" stroke="#424242" stroke-width="2"/>

            <!-- 左图绳子 -->
            <line id="scene1-rope" x1="200" y1="220" x2="200" y2="260" stroke="#757575" stroke-width="1" stroke-dasharray="3,3"/>

            <!-- 物块标签 -->
            <text id="scene1-label-jia-left" x="200" y="188" text-anchor="middle" font-size="18" fill="#424242">甲</text>
            <text id="scene1-label-yi" x="200" y="293" text-anchor="middle" font-size="18" fill="#424242">乙</text>
            <text id="scene1-label-jia-right" x="600" y="188" text-anchor="middle" font-size="18" fill="#424242">甲</text>
            <text id="scene1-label-bing" x="600" y="123" text-anchor="middle" font-size="18" fill="#424242">丙</text>

            <!-- ========== 步骤 1：高亮甲物块 ========== -->
            <g id="scene1-step1-group" class="step-group">
                <!-- 左图甲高亮框 -->
                <rect id="scene1-highlight-jia-left" class="highlight-box" x="150" y="150" width="100" height="70"/>
                <!-- 右图甲高亮框 -->
                <rect id="scene1-highlight-jia-right" class="highlight-box" x="550" y="150" width="100" height="70"/>
            </g>

            <!-- ========== 步骤 2：浮力箭头 ========== -->
            <g id="scene1-step2-group" class="step-group">
                <!-- 左图 F_浮甲箭头（向上） -->
                <line id="scene1-arrow-fu-left" class="arrow-line" x1="200" y1="300" x2="200" y2="230" stroke="#1565c0" marker-end="url(#scene1-arrowhead-up)"/>
                <!-- 右图 F_浮甲箭头（向上） -->
                <line id="scene1-arrow-fu-right" class="arrow-line" x1="600" y1="300" x2="600" y2="230" stroke="#1565c0" marker-end="url(#scene1-arrowhead-up)"/>
                <!-- 左图 F_浮甲标签 -->
                <text id="scene1-label-fu-left" x="230" y="268" font-size="14" fill="#1565c0">F_浮甲</text>
                <!-- 右图 F_浮甲标签 -->
                <text id="scene1-label-fu-right" x="630" y="268" font-size="14" fill="#1565c0">F_浮甲</text>
            </g>

            <!-- ========== 步骤 3：重力与拉力箭头 ========== -->
            <g id="scene1-step3-group" class="step-group">
                <!-- 左图 G_甲箭头（向下） -->
                <line id="scene1-arrow-gjia-left" class="arrow-line" x1="200" y1="185" x2="200" y2="220" stroke="#c62828" marker-end="url(#scene1-arrowhead-down-red)"/>
                <!-- 右图 G_甲箭头（向下） -->
                <line id="scene1-arrow-gjia-right" class="arrow-line" x1="600" y1="185" x2="600" y2="220" stroke="#c62828" marker-end="url(#scene1-arrowhead-down-red)"/>
                <!-- 左图 T 箭头（向下） -->
                <line id="scene1-arrow-t-left" class="arrow-line" x1="200" y1="220" x2="200" y2="245" stroke="#2e7d32" marker-end="url(#scene1-arrowhead-down-green)"/>
                <!-- 右图 G_丙箭头（向下） -->
                <line id="scene1-arrow-gbing-right" class="arrow-line" x1="600" y1="120" x2="600" y2="150" stroke="#c62828" marker-end="url(#scene1-arrowhead-down-red)"/>
                <!-- 左图 G_甲标签（移到箭头左侧，远离甲物块） -->
                <text id="scene1-label-gjia-left" x="155" y="205" font-size="14" fill="#c62828">G_甲</text>
                <!-- 右图 G_甲标签（移到箭头左侧，远离甲物块） -->
                <text id="scene1-label-gjia-right" x="555" y="205" font-size="14" fill="#c62828">G_甲</text>
                <!-- 左图 T 标签（移到箭头左侧） -->
                <text id="scene1-label-t-left" x="155" y="238" font-size="14" fill="#2e7d32">T</text>
                <!-- 右图 G_丙标签 -->
                <text id="scene1-label-gbing-right" x="630" y="138" font-size="14" fill="#c62828">G_丙</text>
            </g>

            <!-- ========== 步骤 4：公式与结论 ========== -->
            <g id="scene1-step4-group" class="step-group">
                <!-- 左图公式 -->
                <text id="scene1-formula-left" x="80" y="385" class="formula-text">F_浮甲 = G_甲 + T</text>
                <!-- 右图公式 -->
                <text id="scene1-formula-right" x="480" y="385" class="formula-text">F_浮甲 = G_甲 + G_丙</text>
                <!-- 结论文本 -->
                <text id="scene1-conclusion" x="400" y="425" class="conclusion-text" text-anchor="middle">结论：A 正确（浮力相等）B 正确（T = G_丙）</text>
            </g>

            <!-- 说明文字 -->
            <text id="scene1-explanation" x="400" y="465" text-anchor="middle" font-size="13" fill="#616161" opacity="0">根据阿基米德原理，F_浮 = ρ_水 g V_排，V_排相同 → F_浮甲相同</text>
        </svg>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/5</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        // 布局坐标表（参考）：
        // | 元素 | 位置/范围 | 大小 |
        // |------|-----------|------|
        // | 左图水面线 | (50,150)-(390,150) | 340×2 |
        // | 右图水面线 | (450,150)-(750,150) | 300×2 |
        // | 左图甲物块 | (150,150)-(250,220) | 100×70 |
        // | 右图甲物块 | (550,150)-(650,220) | 100×70 |
        // | 左图乙物块 | (170,260)-(230,320) | 60×60 |
        // | 右图丙物块 | (570,90)-(630,150) | 60×60 |
        // | 左图绳子 | (200,220)-(200,260) | 2×40 |

        const TOTAL_STEPS = 5;
        let currentStep = 0;

        // 获取 DOM 元素
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        const explanationText = document.getElementById('scene1-explanation');

        // 步骤组元素
        const stepGroups = {
            1: document.getElementById('scene1-step1-group'),
            2: document.getElementById('scene1-step2-group'),
            3: document.getElementById('scene1-step3-group'),
            4: document.getElementById('scene1-step4-group')
        };

        // 高亮框元素
        const highlightBoxes = {
            left: document.getElementById('scene1-highlight-jia-left'),
            right: document.getElementById('scene1-highlight-jia-right')
        };

        // 更新步骤显示
        function updateStepDisplay() {
            // 更新步骤指示器
            stepIndicator.textContent = `步骤 ${currentStep + 1}/${TOTAL_STEPS}`;

            // 更新按钮状态
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === TOTAL_STEPS - 1;

            // 隐藏所有步骤组
            Object.values(stepGroups).forEach(group => {
                if (group) group.classList.remove('visible');
            });

            // 根据当前步骤显示对应组
            if (currentStep >= 1 && stepGroups[1]) {
                stepGroups[1].classList.add('visible');
                highlightBoxes.left.classList.add('visible');
                highlightBoxes.right.classList.add('visible');
            }
            if (currentStep >= 2 && stepGroups[2]) {
                stepGroups[2].classList.add('visible');
            }
            if (currentStep >= 3 && stepGroups[3]) {
                stepGroups[3].classList.add('visible');
            }
            if (currentStep >= 4 && stepGroups[4]) {
                stepGroups[4].classList.add('visible');
            }

            // 更新说明文字
            if (currentStep === 2) {
                explanationText.textContent = '根据阿基米德原理，F_浮 = ρ_水 g V_排，V_排相同 → F_浮甲相同';
                explanationText.setAttribute('opacity', '1');
            } else if (currentStep === 3) {
                explanationText.textContent = '受力平衡 → T = G_丙';
                explanationText.setAttribute('opacity', '1');
            } else {
                explanationText.setAttribute('opacity', '0');
            }

            // 触发 MathJax 重新渲染公式
            if (window.MathJax && currentStep >= 4) {
                MathJax.typesetPromise();
            }
        }

        // 按钮事件绑定
        btnPrev.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                updateStepDisplay();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStep < TOTAL_STEPS - 1) {
                currentStep++;
                updateStepDisplay();
            }
        });

        // 初始化显示
        updateStepDisplay();
    })();
    </script>
</body>
</html>
