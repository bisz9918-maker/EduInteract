<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双气缸系统初始状态 - Scene 1</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Microsoft YaHei', sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene1-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #333; border-radius: 4px; background: #f5f5f5; }
        .scene1-btn:hover { background: #e0e0e0; }
        .scene1-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-step-indicator { padding: 8px 16px; font-size: 14px; display: flex; align-items: center; }
        svg text { font-family: 'Microsoft YaHei', sans-serif; }
        .scene1-element { transition: opacity 0.3s ease; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 坐标表对照：
                气缸 A 左壁：(120,80)-(120,380)
                气缸 A 右壁：(280,80)-(280,380)
                气缸 A 顶壁：(120,80)-(280,80)
                气缸 B 左壁：(480,80)-(480,380)
                气缸 B 右壁：(560,80)-(560,380)
                底部连通管：(120,380)-(560,390)
                活塞 a：(125,155)-(275,155)
                活塞 b：(485,230)-(555,230)
                氧气区域：(122,84)-(278,151)
                氮气区域：活塞下方连通区 (y>157)
                气缸 A 标签：(200,55)
                气缸 B 标签：(520,55)
                活塞 a 标签：(195,145) - 活塞上方
                活塞 b 标签：(520,220) - 活塞上方
                氧气标签：(200,35) - 移到更上方，与 A 标签错开
                氮气标签：(340,340) - 氮气区域底部外部
                高度 H 标注：(100,80)-(100,380)
                H 文字：(85,230)
                面积关系标注：(340,420)
                大气压 P₀：(620,150)
                初始温度 T₀：(620,195)
                导热符号：(120,60)-(280,60)
                开口符号"大气"：(560,65)
                电阻丝：(200,350)-(280,370)
            -->

            <!-- 气缸壁斜线填充（始终显示） -->
            <defs>
                <pattern id="scene1-hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
                    <line x1="0" y1="0" x2="0" y2="8" stroke="#888880" stroke-width="1"/>
                </pattern>
            </defs>

            <!-- 气缸 A 左壁填充 -->
            <rect id="scene1-hatch-a-left" x="116" y="80" width="4" height="300" fill="url(#scene1-hatch)" class="scene1-element"/>
            <!-- 气缸 A 右壁填充 -->
            <rect id="scene1-hatch-a-right" x="280" y="80" width="4" height="300" fill="url(#scene1-hatch)" class="scene1-element"/>
            <!-- 气缸 A 顶壁填充 -->
            <rect id="scene1-hatch-a-top" x="120" y="76" width="164" height="4" fill="url(#scene1-hatch)" class="scene1-element"/>
            <!-- 气缸 B 左壁填充 -->
            <rect id="scene1-hatch-b-left" x="476" y="80" width="4" height="300" fill="url(#scene1-hatch)" class="scene1-element"/>
            <!-- 气缸 B 右壁填充 -->
            <rect id="scene1-hatch-b-right" x="560" y="80" width="4" height="300" fill="url(#scene1-hatch)" class="scene1-element"/>
            <!-- 底部连通管填充 -->
            <rect id="scene1-hatch-connect" x="120" y="380" width="444" height="14" fill="url(#scene1-hatch)" class="scene1-element"/>

            <!-- 步骤 0：气缸轮廓 + 连通管 -->
            <!-- 气缸 A 左壁 -->
            <line id="scene1-cyl-a-left" x1="120" y1="80" x2="120" y2="380" stroke="#000000" stroke-width="2" class="scene1-element" display="none"/>
            <!-- 气缸 A 右壁 -->
            <line id="scene1-cyl-a-right" x1="280" y1="80" x2="280" y2="380" stroke="#000000" stroke-width="2" class="scene1-element" display="none"/>
            <!-- 气缸 A 顶壁 -->
            <line id="scene1-cyl-a-top" x1="120" y1="80" x2="280" y2="80" stroke="#000000" stroke-width="2" class="scene1-element" display="none"/>
            <!-- 气缸 B 左壁 -->
            <line id="scene1-cyl-b-left" x1="480" y1="80" x2="480" y2="380" stroke="#000000" stroke-width="2" class="scene1-element" display="none"/>
            <!-- 气缸 B 右壁 -->
            <line id="scene1-cyl-b-right" x1="560" y1="80" x2="560" y2="380" stroke="#000000" stroke-width="2" class="scene1-element" display="none"/>
            <!-- 底部连通管 -->
            <line id="scene1-connect-pipe" x1="120" y1="385" x2="560" y2="385" stroke="#000000" stroke-width="2" class="scene1-element" display="none"/>

            <!-- 步骤 0 标签：气缸 A、B -->
            <text id="scene1-label-a" x="200" y="55" text-anchor="middle" font-size="16" fill="#000000" class="scene1-element" display="none">A</text>
            <text id="scene1-label-b" x="520" y="55" text-anchor="middle" font-size="16" fill="#000000" class="scene1-element" display="none">B</text>

            <!-- 步骤 1：活塞 a、b -->
            <line id="scene1-piston-a" x1="125" y1="155" x2="275" y2="155" stroke="#000000" stroke-width="4" class="scene1-element" display="none"/>
            <line id="scene1-piston-b" x1="485" y1="230" x2="555" y2="230" stroke="#000000" stroke-width="4" class="scene1-element" display="none"/>
            <text id="scene1-label-piston-a" x="195" y="145" text-anchor="middle" font-size="14" fill="#000000" class="scene1-element" display="none">a</text>
            <text id="scene1-label-piston-b" x="520" y="220" text-anchor="middle" font-size="14" fill="#000000" class="scene1-element" display="none">b</text>

            <!-- 步骤 2：气体区域 -->
            <rect id="scene1-oxygen-area" x="122" y="84" width="156" height="67" fill="#1565c0" opacity="0.15" class="scene1-element" display="none"/>
            <polygon id="scene1-nitrogen-area" points="122,157 278,157 278,388 482,388 482,388 558,388 558,230 485,230 485,388 282,388 282,157" fill="#2e7d32" opacity="0.15" class="scene1-element" display="none"/>
            <text id="scene1-label-oxygen" x="200" y="35" text-anchor="middle" font-size="14" fill="#1565c0" class="scene1-element" display="none">氧气</text>
            <text id="scene1-label-nitrogen" x="340" y="340" text-anchor="middle" font-size="14" fill="#2e7d32" class="scene1-element" display="none">氮气</text>

            <!-- 步骤 3：条件标注 -->
            <line id="scene1-height-line" x1="100" y1="80" x2="100" y2="380" stroke="#000000" stroke-width="1" class="scene1-element" display="none"/>
            <line id="scene1-height-top" x1="95" y1="80" x2="105" y2="80" stroke="#000000" stroke-width="1" class="scene1-element" display="none"/>
            <line id="scene1-height-bottom" x1="95" y1="380" x2="105" y2="380" stroke="#000000" stroke-width="1" class="scene1-element" display="none"/>
            <text id="scene1-label-H" x="85" y="230" text-anchor="end" font-size="14" fill="#000000" class="scene1-element" display="none">H</text>
            <text id="scene1-label-area" x="340" y="420" text-anchor="middle" font-size="14" fill="#000000" class="scene1-element" display="none">S_A = 4S_B</text>
            <text id="scene1-label-P0" x="620" y="150" text-anchor="start" font-size="14" fill="#000000" class="scene1-element" display="none">P₀</text>
            <text id="scene1-label-T0" x="620" y="195" text-anchor="start" font-size="14" fill="#000000" class="scene1-element" display="none">T₀ = 280K</text>

            <!-- 步骤 4：特殊符号 -->
            <!-- 导热符号：波浪线 -->
            <path id="scene1-heat-conduct" d="M 120,60 Q 140,55 160,60 Q 180,65 200,60 Q 220,55 240,60 Q 260,65 280,60" stroke="#c62828" stroke-width="2" fill="none" class="scene1-element" display="none"/>
            <!-- 开口符号"大气" -->
            <text id="scene1-label-atmosphere" x="560" y="65" text-anchor="middle" font-size="14" fill="#000000" class="scene1-element" display="none">大气</text>
            <!-- 电阻丝：锯齿线 -->
            <path id="scene1-resistor" d="M 200,360 L 210,355 L 220,365 L 230,355 L 240,365 L 250,355 L 260,365 L 270,355 L 280,360" stroke="#c62828" stroke-width="2" fill="none" class="scene1-element" display="none"/>
            <!-- 电阻丝引线 -->
            <line id="scene1-resistor-line1" x1="200" y1="360" x2="200" y2="385" stroke="#c62828" stroke-width="1" class="scene1-element" display="none"/>
            <line id="scene1-resistor-line2" x1="280" y1="360" x2="280" y2="385" stroke="#c62828" stroke-width="1" class="scene1-element" display="none"/>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 0/4</span>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        const MAX_STEP = 4;
        let currentStep = 0;

        // 元素分组：按步骤显示
        const stepElements = {
            0: [
                'scene1-cyl-a-left', 'scene1-cyl-a-right', 'scene1-cyl-a-top',
                'scene1-cyl-b-left', 'scene1-cyl-b-right', 'scene1-connect-pipe',
                'scene1-label-a', 'scene1-label-b',
                'scene1-hatch-a-left', 'scene1-hatch-a-right', 'scene1-hatch-a-top',
                'scene1-hatch-b-left', 'scene1-hatch-b-right', 'scene1-hatch-connect'
            ],
            1: [
                'scene1-piston-a', 'scene1-piston-b',
                'scene1-label-piston-a', 'scene1-label-piston-b'
            ],
            2: [
                'scene1-oxygen-area', 'scene1-nitrogen-area',
                'scene1-label-oxygen', 'scene1-label-nitrogen'
            ],
            3: [
                'scene1-height-line', 'scene1-height-top', 'scene1-height-bottom',
                'scene1-label-H', 'scene1-label-area', 'scene1-label-P0', 'scene1-label-T0'
            ],
            4: [
                'scene1-heat-conduct', 'scene1-label-atmosphere',
                'scene1-resistor', 'scene1-resistor-line1', 'scene1-resistor-line2'
            ]
        };

        function getElement(id) {
            return document.getElementById(id);
        }

        function showElement(id) {
            const el = getElement(id);
            if (el) {
                el.style.display = 'block';
                el.style.opacity = '0';
                setTimeout(() => {
                    if (el) el.style.opacity = '1';
                }, 10);
            }
        }

        function hideElement(id) {
            const el = getElement(id);
            if (el) {
                el.style.opacity = '0';
                setTimeout(() => {
                    if (el) el.style.display = 'none';
                }, 300);
            }
        }

        function updateDisplay() {
            // 更新步骤指示器
            const indicator = getElement('scene1-step-indicator');
            if (indicator) {
                indicator.textContent = '步骤 ' + currentStep + '/' + MAX_STEP;
            }

            // 更新按钮状态
            const prevBtn = getElement('scene1-btn-prev');
            const nextBtn = getElement('scene1-btn-next');
            if (prevBtn) prevBtn.disabled = (currentStep === 0);
            if (nextBtn) nextBtn.disabled = (currentStep === MAX_STEP);

            // 显示当前步骤及之前所有步骤的元素
            for (let step = 0; step <= currentStep; step++) {
                const elements = stepElements[step];
                if (elements) {
                    elements.forEach(id => showElement(id));
                }
            }

            // 隐藏当前步骤之后的元素
            for (let step = currentStep + 1; step <= MAX_STEP; step++) {
                const elements = stepElements[step];
                if (elements) {
                    elements.forEach(id => hideElement(id));
                }
            }
        }

        function prevStep() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        }

        function nextStep() {
            if (currentStep < MAX_STEP) {
                currentStep++;
                updateDisplay();
            }
        }

        // 初始化
        function init() {
            const prevBtn = getElement('scene1-btn-prev');
            const nextBtn = getElement('scene1-btn-next');

            if (prevBtn) {
                prevBtn.addEventListener('click', prevStep);
            }
            if (nextBtn) {
                nextBtn.addEventListener('click', nextStep);
            }

            // 初始显示步骤 0
            updateDisplay();
        }

        // 页面加载完成后初始化
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>
</body>
</html>
