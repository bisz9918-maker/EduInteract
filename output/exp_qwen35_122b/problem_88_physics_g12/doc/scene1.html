<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圆弧轨道电磁感应装置 - Scene 1</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Segoe UI', Arial, sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; gap: 20px; z-index: 10; }
        #scene1-btn-prev, #scene1-btn-next {
            padding: 10px 20px;
            font-size: 16px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        #scene1-btn-prev:hover, #scene1-btn-next:hover { background: #1565c0; }
        #scene1-btn-prev:disabled, #scene1-btn-next:disabled {
            background: #bdbdbd;
            cursor: not-allowed;
        }
        .scene1-label { font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene1-arrow-up" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
                    <polygon points="0,10 10,5 0,0" fill="#1565c0" />
                </marker>
                <marker id="scene1-arrow-right" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
                    <polygon points="0,0 10,5 0,10" fill="#c62828" />
                </marker>
            </defs>

            <!-- 磁场线 B（始终显示） -->
            <line id="scene1-mag1" x1="180" y1="150" x2="180" y2="400" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-up)" />
            <line id="scene1-mag2" x1="250" y1="150" x2="250" y2="400" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-up)" />
            <line id="scene1-mag3" x1="320" y1="150" x2="320" y2="400" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-up)" />
            <line id="scene1-mag4" x1="450" y1="150" x2="450" y2="400" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-up)" />
            <line id="scene1-mag5" x1="520" y1="150" x2="520" y2="400" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-up)" />
            <text id="scene1-label-B" x="165" y="145" class="scene1-label" fill="#1565c0" font-size="16" font-weight="bold">B</text>

            <!-- 左圆弧轨道 -->
            <path id="scene1-left-arc" d="M 200 350 A 150 150 0 0 1 350 350" fill="none" stroke="#000000" stroke-width="3" />
            
            <!-- 右圆弧轨道 -->
            <path id="scene1-right-arc" d="M 500 350 A 150 150 0 0 1 650 350" fill="none" stroke="#000000" stroke-width="3" />

            <!-- 圆心 O -->
            <circle id="scene1-center-O" cx="200" cy="350" r="4" fill="#2e7d32" />
            <text id="scene1-label-O" x="175" y="345" class="scene1-label" fill="#2e7d32" font-size="16">O</text>

            <!-- 半径 r 标注 -->
            <text id="scene1-label-r" x="195" y="310" class="scene1-label" fill="#000000" font-size="14">r</text>
            <line id="scene1-radius-line" x1="200" y1="350" x2="200" y2="200" stroke="#2e7d32" stroke-width="1" stroke-dasharray="3,3" opacity="0" />

            <!-- 金属棒 cd（初始位置，实线） -->
            <line id="scene1-rod-cd" x1="200" y1="350" x2="350" y2="350" stroke="#000000" stroke-width="4" />
            <text id="scene1-label-c" x="185" y="380" class="scene1-label" fill="#000000">c</text>
            <text id="scene1-label-d" x="355" y="380" class="scene1-label" fill="#000000">d</text>

            <!-- 金属棒 ab（最终位置，虚线） -->
            <line id="scene1-rod-ab" x1="200" y1="200" x2="350" y2="200" stroke="#000000" stroke-width="4" stroke-dasharray="5,5" opacity="0" />
            <text id="scene1-label-a" x="185" y="185" class="scene1-label" fill="#000000" opacity="0">a</text>
            <text id="scene1-label-b" x="355" y="185" class="scene1-label" fill="#000000" opacity="0">b</text>

            <!-- 运动轨迹（虚线弧） -->
            <path id="scene1-trajectory" d="M 200 350 A 150 150 0 0 1 350 350" fill="none" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" opacity="0" />

            <!-- 速度矢量 v₀ -->
            <line id="scene1-velocity" x1="275" y1="350" x2="310" y2="315" stroke="#c62828" stroke-width="3" opacity="0" />
            <polygon id="scene1-velocity-arrow" points="310,315 300,320 305,305" fill="#c62828" opacity="0" />
            <text id="scene1-label-v0" x="315" y="315" class="scene1-label" fill="#c62828" font-size="14" opacity="0">v₀</text>

            <!-- 电阻 R 及连接线 -->
            <line id="scene1-resistor-line1" x1="350" y1="200" x2="420" y2="200" stroke="#000000" stroke-width="2" />
            <line id="scene1-resistor-line2" x1="350" y1="350" x2="420" y2="350" stroke="#000000" stroke-width="2" />
            <rect id="scene1-resistor" x="420" y="220" width="60" height="40" fill="none" stroke="#000000" stroke-width="2" />
            <text id="scene1-label-R" x="440" y="215" class="scene1-label" fill="#000000" font-size="16">R</text>

            <!-- 轨道间距 L 标注 -->
            <line id="scene1-spacing-line" x1="360" y1="365" x2="490" y2="365" stroke="#000000" stroke-width="1" />
            <line id="scene1-spacing-line1" x1="360" y1="360" x2="360" y2="370" stroke="#000000" stroke-width="1" />
            <line id="scene1-spacing-line2" x1="490" y1="360" x2="490" y2="370" stroke="#000000" stroke-width="1" />
            <text id="scene1-label-L" x="415" y="385" class="scene1-label" fill="#000000" font-size="14">L</text>

            <!-- 角度 θ 标注（步骤 1 显示） -->
            <path id="scene1-angle-arc" d="M 230 350 A 30 30 0 0 0 230 320" fill="none" stroke="#ff9800" stroke-width="2" opacity="0" />
            <text id="scene1-label-theta" x="245" y="330" class="scene1-label" fill="#ff9800" font-size="14" opacity="0">θ</text>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        // 布局坐标表（参考）：
        // | 元素 | 位置 | 备注 |
        // |------|------|------|
        // | 左圆弧轨道 | 圆心 (200,350)，半径 150 | 四分之一圆弧 |
        // | 右圆弧轨道 | 圆心 (500,350)，半径 150 | 与左轨道平行 |
        // | 圆心 O | (200,350) | 绿色实心圆 |
        // | 金属棒 cd | (200,350)-(350,350) | 初始位置 |
        // | 金属棒 ab | (200,200)-(350,200) | 最终位置（虚线） |
        // | 电阻 R | (420,220)-(480,260) | 连接在轨道顶端 |
        // | 磁场线 B | 竖直向上箭头 | 蓝色 |
        // | 速度矢量 v₀ | 切线方向 | 红色 |

        const scene1 = {
            currentStep: 0,
            totalSteps: 4,
            elements: {
                // 金属棒
                rodCd: document.getElementById('scene1-rod-cd'),
                rodAb: document.getElementById('scene1-rod-ab'),
                // 标签
                labelA: document.getElementById('scene1-label-a'),
                labelB: document.getElementById('scene1-label-b'),
                labelC: document.getElementById('scene1-label-c'),
                labelD: document.getElementById('scene1-label-d'),
                // 轨迹
                trajectory: document.getElementById('scene1-trajectory'),
                // 速度
                velocity: document.getElementById('scene1-velocity'),
                velocityArrow: document.getElementById('scene1-velocity-arrow'),
                labelV0: document.getElementById('scene1-label-v0'),
                // 角度
                angleArc: document.getElementById('scene1-angle-arc'),
                labelTheta: document.getElementById('scene1-label-theta'),
                // 半径线
                radiusLine: document.getElementById('scene1-radius-line'),
                // 按钮
                btnPrev: document.getElementById('scene1-btn-prev'),
                btnNext: document.getElementById('scene1-btn-next')
            },

            // 显示元素
            show: function(el) {
                if (el) {
                    el.style.display = 'block';
                    el.style.opacity = '1';
                }
            },

            // 隐藏元素
            hide: function(el) {
                if (el) {
                    el.style.opacity = '0';
                    setTimeout(() => {
                        if (el.style.opacity === '0') {
                            el.style.display = 'none';
                        }
                    }, 200);
                }
            },

            // 更新步骤显示
            updateStep: function() {
                const el = this.elements;

                // 步骤 0：初始状态
                if (this.currentStep === 0) {
                    this.show(el.rodCd);
                    this.hide(el.rodAb);
                    this.hide(el.trajectory);
                    this.hide(el.velocity);
                    this.hide(el.velocityArrow);
                    this.hide(el.labelV0);
                    this.hide(el.angleArc);
                    this.hide(el.labelTheta);
                    this.hide(el.radiusLine);
                    this.show(el.labelC);
                    this.show(el.labelD);
                    this.hide(el.labelA);
                    this.hide(el.labelB);
                }
                // 步骤 1：中间位置（显示 ab 和轨迹）
                else if (this.currentStep === 1) {
                    this.show(el.rodCd);
                    this.show(el.rodAb);
                    this.show(el.trajectory);
                    this.hide(el.velocity);
                    this.hide(el.velocityArrow);
                    this.hide(el.labelV0);
                    this.show(el.angleArc);
                    this.show(el.labelTheta);
                    this.hide(el.radiusLine);
                    this.show(el.labelC);
                    this.show(el.labelD);
                    this.show(el.labelA);
                    this.show(el.labelB);
                }
                // 步骤 2：最终位置（显示速度矢量）
                else if (this.currentStep === 2) {
                    this.show(el.rodCd);
                    this.show(el.rodAb);
                    this.show(el.trajectory);
                    this.show(el.velocity);
                    this.show(el.velocityArrow);
                    this.show(el.labelV0);
                    this.show(el.angleArc);
                    this.show(el.labelTheta);
                    this.hide(el.radiusLine);
                    this.show(el.labelC);
                    this.show(el.labelD);
                    this.show(el.labelA);
                    this.show(el.labelB);
                }
                // 步骤 3：完整展示（高亮轨迹，显示半径）
                else if (this.currentStep === 3) {
                    this.show(el.rodCd);
                    this.show(el.rodAb);
                    el.trajectory.style.display = 'block';
                    el.trajectory.style.opacity = '1';
                    el.trajectory.style.strokeWidth = '3';
                    this.show(el.velocity);
                    this.show(el.velocityArrow);
                    this.show(el.labelV0);
                    this.show(el.angleArc);
                    this.show(el.labelTheta);
                    this.show(el.radiusLine);
                    this.show(el.labelC);
                    this.show(el.labelD);
                    this.show(el.labelA);
                    this.show(el.labelB);
                }

                // 更新按钮状态
                el.btnPrev.disabled = (this.currentStep === 0);
                el.btnNext.disabled = (this.currentStep === this.totalSteps - 1);
            },

            // 上一步
            prevStep: function() {
                if (this.currentStep > 0) {
                    this.currentStep--;
                    this.updateStep();
                }
            },

            // 下一步
            nextStep: function() {
                if (this.currentStep < this.totalSteps - 1) {
                    this.currentStep++;
                    this.updateStep();
                }
            },

            // 初始化
            init: function() {
                this.elements.btnPrev.addEventListener('click', () => this.prevStep());
                this.elements.btnNext.addEventListener('click', () => this.nextStep());
                this.updateStep();
            }
        };

        scene1.init();
    })();
    </script>
</body>
</html>
