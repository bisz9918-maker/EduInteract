<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电磁感应过程分析 - Scene 2</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: "Microsoft YaHei", sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene2-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #333; border-radius: 4px; background: #f5f5f5; }
        .scene2-btn:hover:not(:disabled) { background: #e0e0e0; }
        .scene2-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene2-hidden { display: none !important; }
        .scene2-formula { font-family: "Times New Roman", serif; font-style: italic; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 标题 - 调整 y 坐标至 60，确保顶部留白≥20px -->
            <text x="320" y="60" font-size="18" font-weight="bold" text-anchor="middle">电磁感应过程分析</text>
            
            <!-- 左侧示意图区 -->
            <!-- 圆弧轨道左轨：圆心 (150,300)，半径 120，从 270°到 0° -->
            <path id="scene2-track-left" d="M 150 300 A 120 120 0 0 1 270 180" fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 圆弧轨道右轨：圆心 (280,300)，半径 120，从 270°到 0° -->
            <path id="scene2-track-right" d="M 280 300 A 120 120 0 0 1 400 180" fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 金属棒 cd（初始位置，实线） -->
            <line id="scene2-rod-cd" x1="150" y1="300" x2="280" y2="300" stroke="#000000" stroke-width="4"/>
            
            <!-- 金属棒 ab（终点位置，虚线，步骤 1 后显示） -->
            <line id="scene2-rod-ab" class="scene2-hidden" x1="150" y1="180" x2="280" y2="180" stroke="#000000" stroke-width="4" stroke-dasharray="5,5"/>
            
            <!-- 磁场 B 箭头（竖直向上）- 只保留一个 B 箭头，避免拥挤 -->
            <g id="scene2-field-group">
                <!-- 单个 B 箭头 - 移到轨道左侧中间位置 -->
                <line x1="120" y1="260" x2="120" y2="200" stroke="#1565c0" stroke-width="3"/>
                <polygon points="120,200 116,210 124,210" fill="#1565c0"/>
                <text x="100" y="195" font-size="14" fill="#1565c0" font-weight="bold">B</text>
            </g>
            
            <!-- 速度 v₀箭头（初始时刻切向速度）- 调整位置到轨道右侧，远离轨道 -->
            <line id="scene2-velocity-v0" x1="380" y1="295" x2="400" y2="295" stroke="#c62828" stroke-width="3"/>
            <polygon points="400,295 390,291 390,299" fill="#c62828"/>
            <text id="scene2-velocity-label" x="405" y="298" font-size="14" fill="#c62828" font-weight="bold">v₀</text>
            
            <!-- 半径 r 标注（虚线） -->
            <line id="scene2-radius-r" class="scene2-hidden" x1="150" y1="300" x2="150" y2="180" stroke="#888888" stroke-width="2" stroke-dasharray="4,4"/>
            <text id="scene2-radius-label" class="scene2-hidden" x="135" y="245" font-size="14" fill="#888888" font-style="italic">r</text>
            
            <!-- 间距 L 标注 -->
            <line x1="105" y1="300" x2="105" y2="310" stroke="#000000" stroke-width="2"/>
            <text x="85" y="310" font-size="14" fill="#000000" font-style="italic">L</text>
            
            <!-- cd 标签 - 调整位置到轨道下方 -->
            <text x="145" y="330" font-size="14" fill="#000000">c</text>
            <text x="275" y="330" font-size="14" fill="#000000">d</text>
            
            <!-- ab 标签（步骤 1 后显示）- 调整位置到轨道上方 -->
            <text id="scene2-ab-label" class="scene2-hidden" x="145" y="170" font-size="14" fill="#000000">a</text>
            <text id="scene2-ab-label2" class="scene2-hidden" x="275" y="170" font-size="14" fill="#000000">b</text>
            
            <!-- 电动势 E 标注（步骤 1 后显示）- 调整位置到轨道右侧，远离轨道 -->
            <text id="scene2-emf-E" class="scene2-hidden" x="410" y="245" font-size="16" fill="#2e7d32" font-weight="bold" font-style="italic">E</text>
            
            <!-- 电动势公式（步骤 1 后显示）- 调整位置到左侧图上方，远离标题 -->
            <text id="scene2-emf-formula" class="scene2-hidden" x="200" y="90" font-size="16" fill="#2e7d32" font-family="Times New Roman" font-style="italic">E = BLv₀</text>
            
            <!-- 右侧电路图区 -->
            <!-- 电阻 R 矩形 -->
            <rect id="scene2-resistor-R" class="scene2-hidden" x="550" y="80" width="50" height="40" fill="none" stroke="#000000" stroke-width="2"/>
            <text id="scene2-resistor-R-label" class="scene2-hidden" x="565" y="70" font-size="14" fill="#000000" font-style="italic">R</text>
            
            <!-- 内阻 r 矩形 -->
            <rect id="scene2-resistor-r" class="scene2-hidden" x="550" y="200" width="50" height="40" fill="none" stroke="#000000" stroke-width="2"/>
            <text id="scene2-resistor-r-label" class="scene2-hidden" x="555" y="190" font-size="14" fill="#000000" font-family="Times New Roman">r=R/3</text>
            
            <!-- 电路连线 -->
            <g id="scene2-circuit-wires" class="scene2-hidden">
                <!-- 上边连线 -->
                <line x1="400" y1="180" x2="550" y2="100" stroke="#000000" stroke-width="2"/>
                <line x1="600" y1="100" x2="750" y2="100" stroke="#000000" stroke-width="2"/>
                <!-- 下边连线 -->
                <line x1="400" y1="300" x2="550" y2="220" stroke="#000000" stroke-width="2"/>
                <line x1="600" y1="220" x2="750" y2="220" stroke="#000000" stroke-width="2"/>
                <!-- 左侧竖线 -->
                <line x1="550" y1="100" x2="550" y2="220" stroke="#000000" stroke-width="2"/>
                <!-- 右侧竖线 -->
                <line x1="750" y1="100" x2="750" y2="220" stroke="#000000" stroke-width="2"/>
            </g>
            
            <!-- 电流 I 箭头（步骤 2 后显示） -->
            <g id="scene2-current-I" class="scene2-hidden">
                <line x1="630" y1="100" x2="630" y2="150" stroke="#c62828" stroke-width="2"/>
                <polygon points="630,150 626,140 634,140" fill="#c62828"/>
                <text x="640" y="130" font-size="14" fill="#c62828" font-weight="bold" font-style="italic">I</text>
            </g>
            
            <!-- 电流公式（步骤 2 后显示） -->
            <text id="scene2-current-formula" class="scene2-hidden" x="470" y="90" font-size="16" fill="#c62828" font-family="Times New Roman" font-style="italic">I = E/(R+r)</text>
            
            <!-- 下方曲线区 -->
            <!-- 坐标轴 -->
            <line id="scene2-axis-x" class="scene2-hidden" x1="100" y1="400" x2="730" y2="400" stroke="#000000" stroke-width="2"/>
            <line id="scene2-axis-y" class="scene2-hidden" x1="100" y1="380" x2="100" y2="420" stroke="#000000" stroke-width="2"/>
            
            <!-- 电流变化曲线（步骤 3 后显示） -->
            <path id="scene2-curve" class="scene2-hidden" d="M 100 410 Q 415 400 730 390" fill="none" stroke="#c62828" stroke-width="2"/>
            
            <!-- 曲线标签 -->
            <text id="scene2-curve-label-x" class="scene2-hidden" x="740" y="405" font-size="14" fill="#000000" font-style="italic">θ</text>
            <text id="scene2-curve-label-y" class="scene2-hidden" x="85" y="405" font-size="14" fill="#000000" font-style="italic">I</text>
            
            <!-- 曲线公式（步骤 3 后显示） -->
            <text id="scene2-curve-formula" class="scene2-hidden" x="350" y="370" font-size="16" fill="#c62828" font-family="Times New Roman" font-style="italic">I(θ) = BLv₀cosθ/(R+r)</text>
            
            <!-- 坐标轴箭头 -->
            <polygon id="scene2-axis-x-arrow" class="scene2-hidden" points="730,400 720,395 720,405" fill="#000000"/>
            <polygon id="scene2-axis-y-arrow" class="scene2-hidden" points="100,380 95,390 105,390" fill="#000000"/>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-prev-btn" class="scene2-btn" disabled>◀ 上一步</button>
            <button id="scene2-next-btn" class="scene2-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现 - 电磁感应过程分析
        
        // 状态变量
        var currentStep = 0;
        var maxStep = 4;
        
        // 元素显示控制函数
        function showElement(id) {
            var el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene2-hidden');
                el.style.display = '';
                el.style.opacity = '1';
            }
        }
        
        function hideElement(id) {
            var el = document.getElementById(id);
            if (el) {
                el.classList.add('scene2-hidden');
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }
        
        // 更新按钮状态
        function updateButtonState() {
            var prevBtn = document.getElementById('scene2-prev-btn');
            var nextBtn = document.getElementById('scene2-next-btn');
            
            if (prevBtn) {
                prevBtn.disabled = (currentStep === 0);
            }
            if (nextBtn) {
                nextBtn.disabled = (currentStep === maxStep);
            }
        }
        
        // 更新显示状态
        function updateDisplay() {
            // 步骤 0：初始状态 - 只显示基础元素
            // 步骤 1：显示金属棒 ab、电动势 E、公式
            // 步骤 2：显示电路图、电流 I
            // 步骤 3：显示电流变化曲线
            // 步骤 4：最终状态 - 高亮所有关键元素
            
            // 重置所有可选显示的元素
            var elementsToReset = [
                'scene2-rod-ab', 'scene2-radius-r', 'scene2-radius-label',
                'scene2-ab-label', 'scene2-ab-label2', 'scene2-emf-E',
                'scene2-emf-formula', 'scene2-resistor-R', 'scene2-resistor-R-label',
                'scene2-resistor-r', 'scene2-resistor-r-label', 'scene2-circuit-wires',
                'scene2-current-I', 'scene2-current-formula', 'scene2-axis-x',
                'scene2-axis-y', 'scene2-curve', 'scene2-curve-label-x',
                'scene2-curve-label-y', 'scene2-curve-formula', 'scene2-axis-x-arrow',
                'scene2-axis-y-arrow'
            ];
            
            elementsToReset.forEach(function(id) {
                hideElement(id);
            });
            
            // 根据当前步骤显示相应元素
            if (currentStep >= 1) {
                showElement('scene2-rod-ab');
                showElement('scene2-ab-label');
                showElement('scene2-ab-label2');
                showElement('scene2-emf-E');
                showElement('scene2-emf-formula');
            }
            
            if (currentStep >= 2) {
                showElement('scene2-resistor-R');
                showElement('scene2-resistor-R-label');
                showElement('scene2-resistor-r');
                showElement('scene2-resistor-r-label');
                showElement('scene2-circuit-wires');
                showElement('scene2-current-I');
                showElement('scene2-current-formula');
            }
            
            if (currentStep >= 3) {
                showElement('scene2-axis-x');
                showElement('scene2-axis-y');
                showElement('scene2-curve');
                showElement('scene2-curve-label-x');
                showElement('scene2-curve-label-y');
                showElement('scene2-curve-formula');
                showElement('scene2-axis-x-arrow');
                showElement('scene2-axis-y-arrow');
            }
            
            if (currentStep >= 4) {
                // 最终状态 - 高亮关键元素（通过加粗或改变颜色）
                var emfE = document.getElementById('scene2-emf-E');
                var currentI = document.getElementById('scene2-current-I');
                var resistorR = document.getElementById('scene2-resistor-R');
                var resistorRLabel = document.getElementById('scene2-resistor-R-label');
                
                if (emfE) {
                    emfE.style.fontWeight = 'bold';
                    emfE.style.fontSize = '20px';
                }
                if (currentI) {
                    currentI.querySelector('line').setAttribute('stroke-width', '4');
                    currentI.querySelector('text').style.fontSize = '18px';
                }
                if (resistorR) {
                    resistorR.setAttribute('stroke-width', '4');
                }
                if (resistorRLabel) {
                    resistorRLabel.style.fontWeight = 'bold';
                }
            }
            
            updateButtonState();
        }
        
        // 下一步按钮点击事件
        document.getElementById('scene2-next-btn').addEventListener('click', function() {
            if (currentStep < maxStep) {
                currentStep++;
                updateDisplay();
            }
        });
        
        // 上一步按钮点击事件
        document.getElementById('scene2-prev-btn').addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        });
        
        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
