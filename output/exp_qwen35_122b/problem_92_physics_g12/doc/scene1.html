<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>带电粒子在电场中的运动 - 场景 1</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Segoe UI', Arial, sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 16px; z-index: 10; }
        .scene1-btn { padding: 8px 20px; font-size: 14px; background: #4a90d9; color: white; border: none; border-radius: 4px; cursor: pointer; transition: background 0.2s; }
        .scene1-btn:hover { background: #357abd; }
        .scene1-btn:disabled { background: #ccc; cursor: not-allowed; }
        #scene1-step-indicator { font-size: 14px; color: #333; font-weight: bold; }
        svg { display: block; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
                </marker>
                <marker id="scene1-arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
                </marker>
                <marker id="scene1-arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/>
                </marker>
                <marker id="scene1-arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#3498db"/>
                </marker>
            </defs>

            <!-- 中心线 RO (始终显示) -->
            <line id="scene1-centerline" x1="100" y1="250" x2="750" y2="250" stroke="#999" stroke-width="1" stroke-dasharray="5,5"/>
            <text id="scene1-label-R" x="95" y="245" font-size="14" fill="#333" font-weight="bold">R</text>
            <text id="scene1-label-O" x="755" y="245" font-size="14" fill="#333" font-weight="bold">O</text>

            <!-- 平行板 A (始终显示) -->
            <rect id="scene1-plate-top" x="150" y="178" width="200" height="4" fill="#333"/>
            <text id="scene1-label-A" x="130" y="183" font-size="14" fill="#333" font-weight="bold">A</text>

            <!-- 平行板 B (始终显示) -->
            <rect id="scene1-plate-bottom" x="150" y="318" width="200" height="4" fill="#333"/>
            <text id="scene1-label-B" x="130" y="323" font-size="14" fill="#333" font-weight="bold">B</text>

            <!-- 入射点 R (始终显示) - 用带加号的圆表示正电荷，加号在圆内 -->
            <circle id="scene1-point-R" cx="120" cy="250" r="10" fill="#e74c3c"/>
            <text id="scene1-plus-sign" x="115" y="255" font-size="16" fill="white" font-weight="bold">+</text>

            <!-- 初速度 v₀ 箭头 (始终显示) - 从圆右侧开始 -->
            <line id="scene1-arrow-v0" x1="135" y1="250" x2="185" y2="250" stroke="#333" stroke-width="2" marker-end="url(#scene1-arrowhead)"/>
            <text id="scene1-label-v0" x="150" y="235" font-size="14" fill="#333" font-weight="bold">v₀</text>

            <!-- 距离标注 l (始终显示) -->
            <line id="scene1-line-l" x1="150" y1="335" x2="350" y2="335" stroke="#333" stroke-width="1"/>
            <line id="scene1-line-l-left" x1="150" y1="330" x2="150" y2="340" stroke="#333" stroke-width="1"/>
            <line id="scene1-line-l-right" x1="350" y1="330" x2="350" y2="340" stroke="#333" stroke-width="1"/>
            <text id="scene1-label-l" x="245" y="355" font-size="14" fill="#333" font-weight="bold">l</text>

            <!-- 距离标注 d (始终显示) - 调整位置远离 R 点 -->
            <line id="scene1-line-d" x1="70" y1="180" x2="70" y2="320" stroke="#333" stroke-width="1"/>
            <line id="scene1-line-d-top" x1="65" y1="180" x2="75" y2="180" stroke="#333" stroke-width="1"/>
            <line id="scene1-line-d-bottom" x1="65" y1="320" x2="75" y2="320" stroke="#333" stroke-width="1"/>
            <text id="scene1-label-d" x="40" y="255" font-size="14" fill="#333" font-weight="bold">d</text>

            <!-- 界面 MN (始终显示) -->
            <line id="scene1-boundary-MN" x1="350" y1="150" x2="350" y2="350" stroke="#999" stroke-width="1" stroke-dasharray="5,5"/>
            <text id="scene1-label-M" x="358" y="160" font-size="14" fill="#333" font-weight="bold">M</text>
            <text id="scene1-label-N" x="358" y="345" font-size="14" fill="#333" font-weight="bold">N</text>

            <!-- 界面 PS (始终显示) -->
            <line id="scene1-boundary-PS" x1="550" y1="150" x2="550" y2="350" stroke="#999" stroke-width="1" stroke-dasharray="5,5"/>
            <text id="scene1-label-P" x="558" y="145" font-size="14" fill="#333" font-weight="bold">P</text>
            <text id="scene1-label-S" x="558" y="360" font-size="14" fill="#333" font-weight="bold">S</text>

            <!-- 距离标注 L (始终显示) -->
            <line id="scene1-line-L" x1="350" y1="200" x2="550" y2="200" stroke="#333" stroke-width="1"/>
            <line id="scene1-line-L-left" x1="350" y1="195" x2="350" y2="205" stroke="#333" stroke-width="1"/>
            <line id="scene1-line-L-right" x1="550" y1="195" x2="550" y2="205" stroke="#333" stroke-width="1"/>
            <text id="scene1-label-L" x="445" y="190" font-size="14" fill="#333" font-weight="bold">L</text>

            <!-- 匀强电场 E 箭头组 (步骤 1 显示) -->
            <g id="scene1-field-E" style="display: none; opacity: 0;">
                <line x1="200" y1="200" x2="200" y2="300" stroke="#e74c3c" stroke-width="2" marker-end="url(#scene1-arrowhead-red)"/>
                <line x1="240" y1="200" x2="240" y2="300" stroke="#e74c3c" stroke-width="2" marker-end="url(#scene1-arrowhead-red)"/>
                <line x1="280" y1="200" x2="280" y2="300" stroke="#e74c3c" stroke-width="2" marker-end="url(#scene1-arrowhead-red)"/>
                <line x1="320" y1="200" x2="320" y2="300" stroke="#e74c3c" stroke-width="2" marker-end="url(#scene1-arrowhead-red)"/>
                <text x="260" y="185" font-size="14" fill="#e74c3c" font-weight="bold">E</text>
            </g>

            <!-- 粒子轨迹 - 板间抛物线 (步骤 1 显示) -->
            <path id="scene1-trajectory-parabola" d="M 120,250 Q 235,265 350,280" stroke="#3498db" stroke-width="2" fill="none" style="display: none; opacity: 0;"/>

            <!-- 粒子轨迹 - MN 到 PS 直线 (步骤 3 显示) -->
            <line id="scene1-trajectory-line" x1="350" y1="280" x2="550" y2="310" stroke="#3498db" stroke-width="2" stroke-dasharray="5,3" style="display: none; opacity: 0;"/>

            <!-- 速度分解 - v_x (步骤 2 显示) - 调整标签位置远离轨迹线和θ标签 -->
            <g id="scene1-velocity-vx" style="display: none; opacity: 0;">
                <line x1="350" y1="280" x2="420" y2="280" stroke="#27ae60" stroke-width="2" marker-end="url(#scene1-arrowhead-green)"/>
                <text x="385" y="260" font-size="13" fill="#27ae60" font-weight="bold">vₓ</text>
            </g>

            <!-- 速度分解 - v_y (步骤 2 显示) - 调整标签位置 -->
            <g id="scene1-velocity-vy" style="display: none; opacity: 0;">
                <line x1="350" y1="280" x2="350" y2="230" stroke="#27ae60" stroke-width="2" marker-end="url(#scene1-arrowhead-green)"/>
                <text x="315" y="245" font-size="13" fill="#27ae60" font-weight="bold">vᵧ</text>
            </g>

            <!-- 速度分解 - 合速度 v (步骤 2 显示) -->
            <g id="scene1-velocity-v" style="display: none; opacity: 0;">
                <line x1="350" y1="280" x2="410" y2="240" stroke="#27ae60" stroke-width="2" marker-end="url(#scene1-arrowhead-green)"/>
                <text x="415" y="235" font-size="13" fill="#27ae60" font-weight="bold">v</text>
            </g>

            <!-- 偏转角 θ 圆弧 (步骤 2 显示) - 调整标签位置远离 v_x 标签 -->
            <g id="scene1-angle-theta" style="display: none; opacity: 0;">
                <path d="M 375,280 A 25,25 0 0 0 368,261" stroke="#27ae60" stroke-width="2" fill="none"/>
                <text x="395" y="250" font-size="13" fill="#27ae60" font-weight="bold">θ</text>
            </g>

            <!-- 偏离距离 y 标注 (步骤 4 显示) - 调整标签位置 -->
            <g id="scene1-offset-y" style="display: none; opacity: 0;">
                <line x1="565" y1="250" x2="565" y2="310" stroke="#e74c3c" stroke-width="2"/>
                <line x1="560" y1="250" x2="570" y2="250" stroke="#e74c3c" stroke-width="2"/>
                <line x1="560" y1="310" x2="570" y2="310" stroke="#e74c3c" stroke-width="2"/>
                <text x="575" y="270" font-size="14" fill="#e74c3c" font-weight="bold">y</text>
                <text x="575" y="288" font-size="12" fill="#e74c3c">= 6cm</text>
            </g>

            <!-- 出射点标记 (步骤 2 显示) -->
            <circle id="scene1-exit-point" cx="350" cy="280" r="4" fill="#27ae60" style="display: none; opacity: 0;"/>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/5</span>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1: 带电粒子在平行板电场及无电场区域的运动轨迹分析
        // 布局坐标表对照：
        // | 元素 | 类型 | 位置/范围 | 大小 |
        // |------|------|-----------|------|
        // | 平行板 A | 矩形 | (150,178)-(350,182) | 200×4 |
        // | 平行板 B | 矩形 | (150,318)-(350,322) | 200×4 |
        // | 中心线 RO | 虚线 | (100,250)-(750,250) | 650×1 |
        // | 入射点 R | 圆点 | (120,250) | 10 |
        // | 初速度 v₀ | 箭头 | (135,250)-(185,250) | 50×2 |
        // | 界面 MN | 虚线 | (350,150)-(350,350) | 1×200 |
        // | 界面 PS | 虚线 | (550,150)-(550,350) | 1×200 |
        // | 粒子轨迹（板间） | 抛物线 | (120,250)-(350,280) | - |
        // | 粒子轨迹（MN-PS） | 直线 | (350,280)-(550,310) | - |
        // | 速度 v_x | 箭头 | (350,280)-(420,280) | 70×2 |
        // | 速度 v_y | 箭头 | (350,280)-(350,230) | 50×2 |
        // | 速度 v | 箭头 | (350,280)-(410,240) | - |
        // | 角度θ圆弧 | 圆弧 | (350,280) 半径 25 | - |
        // | 偏离距离 y | 双箭头竖线 | (565,250)-(565,310) | 1×60 |

        const scene1 = {
            currentStep: 0,
            totalSteps: 5,

            // 元素显示/隐藏配置
            stepElements: {
                0: { show: [], hide: ['scene1-field-E', 'scene1-trajectory-parabola', 'scene1-trajectory-line', 'scene1-velocity-vx', 'scene1-velocity-vy', 'scene1-velocity-v', 'scene1-angle-theta', 'scene1-exit-point', 'scene1-offset-y'] },
                1: { show: ['scene1-field-E', 'scene1-trajectory-parabola'], hide: ['scene1-trajectory-line', 'scene1-velocity-vx', 'scene1-velocity-vy', 'scene1-velocity-v', 'scene1-angle-theta', 'scene1-exit-point', 'scene1-offset-y'] },
                2: { show: ['scene1-field-E', 'scene1-trajectory-parabola', 'scene1-velocity-vx', 'scene1-velocity-vy', 'scene1-velocity-v', 'scene1-angle-theta', 'scene1-exit-point'], hide: ['scene1-trajectory-line', 'scene1-offset-y'] },
                3: { show: ['scene1-field-E', 'scene1-trajectory-parabola', 'scene1-velocity-vx', 'scene1-velocity-vy', 'scene1-velocity-v', 'scene1-angle-theta', 'scene1-exit-point', 'scene1-trajectory-line'], hide: ['scene1-offset-y'] },
                4: { show: ['scene1-field-E', 'scene1-trajectory-parabola', 'scene1-velocity-vx', 'scene1-velocity-vy', 'scene1-velocity-v', 'scene1-angle-theta', 'scene1-exit-point', 'scene1-trajectory-line', 'scene1-offset-y'], hide: [] }
            },

            // 步骤描述
            stepDescriptions: [
                '初始状态：平行板电场结构',
                '步骤 1：匀强电场与板间轨迹',
                '步骤 2：出射速度分解',
                '步骤 3：无电场区域匀速运动',
                '步骤 4：偏离距离 y'
            ],

            // 初始化
            init: function() {
                this.updateDisplay();
                this.bindEvents();
            },

            // 更新显示
            updateDisplay: function() {
                const config = this.stepElements[this.currentStep];

                // 显示元素
                config.show.forEach(id => {
                    const el = document.getElementById(id);
                    if (el) {
                        el.style.display = 'block';
                        // 使用 requestAnimationFrame 实现淡入效果
                        requestAnimationFrame(() => {
                            el.style.opacity = '1';
                        });
                    }
                });

                // 隐藏元素
                config.hide.forEach(id => {
                    const el = document.getElementById(id);
                    if (el) {
                        el.style.opacity = '0';
                        // 等待过渡完成后再设置 display
                        setTimeout(() => {
                            el.style.display = 'none';
                        }, 200);
                    }
                });

                // 更新步骤指示器
                document.getElementById('scene1-step-indicator').textContent = 
                    `步骤 ${this.currentStep + 1}/${this.totalSteps}`;

                // 更新按钮状态
                document.getElementById('scene1-btn-prev').disabled = (this.currentStep === 0);
                document.getElementById('scene1-btn-next').disabled = (this.currentStep === this.totalSteps - 1);
            },

            // 绑定事件
            bindEvents: function() {
                const prevBtn = document.getElementById('scene1-btn-prev');
                const nextBtn = document.getElementById('scene1-btn-next');

                prevBtn.addEventListener('click', () => {
                    if (this.currentStep > 0) {
                        this.currentStep--;
                        this.updateDisplay();
                    }
                });

                nextBtn.addEventListener('click', () => {
                    if (this.currentStep < this.totalSteps - 1) {
                        this.currentStep++;
                        this.updateDisplay();
                    }
                });
            }
        };

        // 启动场景
        scene1.init();
    })();
    </script>
</body>
</html>
