<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三棱柱的立体结构</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Microsoft YaHei', sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene1-btn { padding: 8px 20px; font-size: 14px; border: 2px solid #1565c0; border-radius: 6px; background: #ffffff; color: #1565c0; cursor: pointer; transition: all 0.3s; }
        .scene1-btn:hover { background: #e3f2fd; }
        .scene1-btn:disabled { border-color: #ccc; color: #ccc; cursor: not-allowed; }
        .scene1-btn:disabled:hover { background: #ffffff; }
        #scene1-step-indicator { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); font-size: 16px; color: #666; }
        .scene1-info-box { fill: #f5f5f5; stroke: #ddd; stroke-width: 1; rx: 8; }
        .scene1-face { transition: all 0.3s ease; }
        .scene1-label { font-size: 14px; fill: #000000; }
        .scene1-title { font-size: 18px; font-weight: bold; fill: #000000; }
        .scene1-info-text { font-size: 14px; fill: #333; }
        .scene1-unfold-group { opacity: 0; transition: opacity 0.5s ease; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500">
            <!-- 标题（向下移动，避免顶部裁切） -->
            <text id="scene1-title" x="30" y="40" class="scene1-title">三棱柱的立体结构</text>
            
            <!-- 三棱柱立体图 -->
            <!-- 上底面三角形 -->
            <polygon id="scene1-top-face" class="scene1-face" points="130,100 230,100 180,160" fill="#e3f2fd" stroke="#000000" stroke-width="2"/>
            <!-- 下底面三角形 -->
            <polygon id="scene1-bottom-face" class="scene1-face" points="130,360 230,360 180,420" fill="#e3f2fd" stroke="#000000" stroke-width="2"/>
            <!-- 侧面 1（左前） -->
            <polygon id="scene1-side-1" class="scene1-face" points="130,100 180,160 180,420 130,360" fill="#bbdefb" stroke="#000000" stroke-width="2"/>
            <!-- 侧面 2（右前） -->
            <polygon id="scene1-side-2" class="scene1-face" points="180,160 230,100 230,360 180,420" fill="#bbdefb" stroke="#000000" stroke-width="2"/>
            <!-- 侧面 3（背面） -->
            <polygon id="scene1-side-3" class="scene1-face" points="130,100 230,100 230,360 130,360" fill="#90caf9" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>
            
            <!-- 标签（调整位置避免重叠） -->
            <text id="scene1-label-top" x="170" y="85" class="scene1-label" text-anchor="middle">上底面</text>
            <text id="scene1-label-bottom" x="170" y="440" class="scene1-label" text-anchor="middle">下底面</text>
            <text id="scene1-label-side1" x="100" y="260" class="scene1-label">侧面 1</text>
            <text id="scene1-label-side2" x="260" y="260" class="scene1-label">侧面 2</text>
            <text id="scene1-label-side3" x="180" y="280" class="scene1-label" text-anchor="middle">侧面 3</text>
            
            <!-- 右侧说明区背景（向上移动，避免与标题重叠） -->
            <rect id="scene1-info-box" class="scene1-info-box" x="420" y="100" width="350" height="280"/>
            
            <!-- 说明文字（调整 y 坐标，增加间距） -->
            <text id="scene1-info-title" x="440" y="130" class="scene1-label" font-weight="bold">面的组成</text>
            <text id="scene1-info-item1" x="440" y="170" class="scene1-info-text">• 3 个矩形侧面</text>
            <text id="scene1-info-item2" x="440" y="210" class="scene1-info-text">• 2 个三角形底面</text>
            <text id="scene1-info-item3" x="440" y="250" class="scene1-info-text">• 共 5 个面</text>
            <text id="scene1-info-item4" x="440" y="300" class="scene1-info-text" style="opacity: 0;">• 展开图：3 个矩形 + 2 个三角形</text>
            
            <!-- 展开图示意（步骤 3 显示，调整位置） -->
            <g id="scene1-unfold-group" class="scene1-unfold-group">
                <!-- 展开矩形 1 -->
                <rect id="scene1-unfold-rect-1" x="440" y="320" width="80" height="60" fill="#bbdefb" stroke="#000000" stroke-width="2"/>
                <!-- 展开矩形 2 -->
                <rect id="scene1-unfold-rect-2" x="520" y="320" width="80" height="60" fill="#bbdefb" stroke="#000000" stroke-width="2"/>
                <!-- 展开矩形 3 -->
                <rect id="scene1-unfold-rect-3" x="600" y="320" width="80" height="60" fill="#bbdefb" stroke="#000000" stroke-width="2"/>
                <!-- 展开上三角 -->
                <polygon id="scene1-unfold-tri-top" points="480,300 520,300 500,320" fill="#e3f2fd" stroke="#000000" stroke-width="2"/>
                <!-- 展开下三角 -->
                <polygon id="scene1-unfold-tri-bottom" points="480,380 520,380 500,400" fill="#e3f2fd" stroke="#000000" stroke-width="2"/>
            </g>
        </svg>
        
        <!-- 步骤指示器 -->
        <div id="scene1-step-indicator">步骤 1/4</div>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-prev-btn" class="scene1-btn">◀ 上一步</button>
            <button id="scene1-next-btn" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现 - 三棱柱的立体结构
        
        // 状态管理
        let currentStep = 0;
        const totalSteps = 4;
        
        // 元素引用
        const titleEl = document.getElementById('scene1-title');
        const topFaceEl = document.getElementById('scene1-top-face');
        const bottomFaceEl = document.getElementById('scene1-bottom-face');
        const side1El = document.getElementById('scene1-side-1');
        const side2El = document.getElementById('scene1-side-2');
        const side3El = document.getElementById('scene1-side-3');
        
        const labelTopEl = document.getElementById('scene1-label-top');
        const labelBottomEl = document.getElementById('scene1-label-bottom');
        const labelSide1El = document.getElementById('scene1-label-side1');
        const labelSide2El = document.getElementById('scene1-label-side2');
        const labelSide3El = document.getElementById('scene1-label-side3');
        
        const infoItem1El = document.getElementById('scene1-info-item1');
        const infoItem2El = document.getElementById('scene1-info-item2');
        const infoItem3El = document.getElementById('scene1-info-item3');
        const infoItem4El = document.getElementById('scene1-info-item4');
        
        const unfoldGroupEl = document.getElementById('scene1-unfold-group');
        const unfoldRect1El = document.getElementById('scene1-unfold-rect-1');
        const unfoldRect2El = document.getElementById('scene1-unfold-rect-2');
        const unfoldRect3El = document.getElementById('scene1-unfold-rect-3');
        const unfoldTriTopEl = document.getElementById('scene1-unfold-tri-top');
        const unfoldTriBottomEl = document.getElementById('scene1-unfold-tri-bottom');
        
        const stepIndicatorEl = document.getElementById('scene1-step-indicator');
        const prevBtn = document.getElementById('scene1-prev-btn');
        const nextBtn = document.getElementById('scene1-next-btn');
        
        // 颜色常量
        const COLOR_NORMAL = '#000000';
        const COLOR_SIDE_HIGHLIGHT = '#1565c0';
        const COLOR_BOTTOM_HIGHLIGHT = '#c62828';
        const COLOR_UNFOLD_HIGHLIGHT = '#2e7d32';
        
        // 工具函数：设置元素高亮样式
        function setFaceHighlight(element, isHighlighted, color) {
            if (isHighlighted) {
                element.setAttribute('stroke', color);
                element.setAttribute('stroke-width', '3');
                element.setAttribute('fill-opacity', '0.3');
            } else {
                // 恢复原始样式
                const id = element.id;
                if (id === 'scene1-top-face' || id === 'scene1-bottom-face') {
                    element.setAttribute('stroke', '#000000');
                    element.setAttribute('stroke-width', '2');
                    element.setAttribute('fill-opacity', '1');
                } else if (id === 'scene1-side-1' || id === 'scene1-side-2') {
                    element.setAttribute('stroke', '#000000');
                    element.setAttribute('stroke-width', '2');
                    element.setAttribute('fill-opacity', '1');
                } else if (id === 'scene1-side-3') {
                    element.setAttribute('stroke', '#888888');
                    element.setAttribute('stroke-width', '2');
                    element.setAttribute('fill-opacity', '1');
                }
            }
        }
        
        function setLabelHighlight(element, isHighlighted, color) {
            element.setAttribute('fill', isHighlighted ? color : COLOR_NORMAL);
        }
        
        // 更新步骤显示
        function updateStep() {
            // 重置所有高亮
            setFaceHighlight(topFaceEl, false);
            setFaceHighlight(bottomFaceEl, false);
            setFaceHighlight(side1El, false);
            setFaceHighlight(side2El, false);
            setFaceHighlight(side3El, false);
            
            setLabelHighlight(labelTopEl, false);
            setLabelHighlight(labelBottomEl, false);
            setLabelHighlight(labelSide1El, false);
            setLabelHighlight(labelSide2El, false);
            setLabelHighlight(labelSide3El, false);
            
            setLabelHighlight(infoItem1El, false);
            setLabelHighlight(infoItem2El, false);
            setLabelHighlight(infoItem3El, false);
            setLabelHighlight(infoItem4El, false);
            
            // 隐藏展开图
            unfoldGroupEl.style.opacity = '0';
            infoItem4El.style.opacity = '0';
            
            // 根据步骤设置高亮
            switch(currentStep) {
                case 0: // 初始状态
                    stepIndicatorEl.textContent = '步骤 1/4';
                    prevBtn.disabled = true;
                    nextBtn.disabled = false;
                    break;
                    
                case 1: // 高亮侧面
                    setFaceHighlight(side1El, true, COLOR_SIDE_HIGHLIGHT);
                    setFaceHighlight(side2El, true, COLOR_SIDE_HIGHLIGHT);
                    setFaceHighlight(side3El, true, COLOR_SIDE_HIGHLIGHT);
                    setLabelHighlight(labelSide1El, true, COLOR_SIDE_HIGHLIGHT);
                    setLabelHighlight(labelSide2El, true, COLOR_SIDE_HIGHLIGHT);
                    setLabelHighlight(labelSide3El, true, COLOR_SIDE_HIGHLIGHT);
                    setLabelHighlight(infoItem1El, true, COLOR_SIDE_HIGHLIGHT);
                    
                    stepIndicatorEl.textContent = '步骤 2/4';
                    prevBtn.disabled = false;
                    nextBtn.disabled = false;
                    break;
                    
                case 2: // 高亮底面
                    setFaceHighlight(topFaceEl, true, COLOR_BOTTOM_HIGHLIGHT);
                    setFaceHighlight(bottomFaceEl, true, COLOR_BOTTOM_HIGHLIGHT);
                    setLabelHighlight(labelTopEl, true, COLOR_BOTTOM_HIGHLIGHT);
                    setLabelHighlight(labelBottomEl, true, COLOR_BOTTOM_HIGHLIGHT);
                    setLabelHighlight(infoItem2El, true, COLOR_BOTTOM_HIGHLIGHT);
                    
                    stepIndicatorEl.textContent = '步骤 3/4';
                    prevBtn.disabled = false;
                    nextBtn.disabled = false;
                    break;
                    
                case 3: // 显示展开图
                    unfoldGroupEl.style.opacity = '1';
                    infoItem4El.style.opacity = '1';
                    
                    // 展开图高亮
                    unfoldRect1El.setAttribute('stroke', COLOR_UNFOLD_HIGHLIGHT);
                    unfoldRect2El.setAttribute('stroke', COLOR_UNFOLD_HIGHLIGHT);
                    unfoldRect3El.setAttribute('stroke', COLOR_UNFOLD_HIGHLIGHT);
                    unfoldTriTopEl.setAttribute('stroke', COLOR_UNFOLD_HIGHLIGHT);
                    unfoldTriBottomEl.setAttribute('stroke', COLOR_UNFOLD_HIGHLIGHT);
                    unfoldRect1El.setAttribute('stroke-width', '3');
                    unfoldRect2El.setAttribute('stroke-width', '3');
                    unfoldRect3El.setAttribute('stroke-width', '3');
                    unfoldTriTopEl.setAttribute('stroke-width', '3');
                    unfoldTriBottomEl.setAttribute('stroke-width', '3');
                    
                    setLabelHighlight(infoItem4El, true, COLOR_UNFOLD_HIGHLIGHT);
                    
                    stepIndicatorEl.textContent = '步骤 4/4';
                    prevBtn.disabled = false;
                    nextBtn.disabled = true;
                    break;
            }
        }
        
        // 按钮事件
        prevBtn.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });
        
        nextBtn.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateStep();
            }
        });
        
        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
