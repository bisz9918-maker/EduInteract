<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正方体展开图折叠演示</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Microsoft YaHei', sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 100; }
        #scene1-controls button {
            padding: 8px 16px;
            font-size: 13px;
            background: #1565c0;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        #scene1-controls button:disabled {
            background: #bdbdbd;
            cursor: not-allowed;
        }
        #scene1-controls button:hover:not(:disabled) {
            background: #0d47a1;
        }
        .scene1-step-text { font-size: 16px; font-weight: bold; fill: #333; }
        .scene1-fold-line { stroke-dasharray: 5,5; stroke: #888; stroke-width: 1.5; }
        .scene1-square { fill: none; stroke: #000; stroke-width: 2; }
        .scene1-circle { fill: none; stroke: #000; stroke-width: 1.5; }
        .scene1-shadow { fill: #c62828; opacity: 0.3; }
        .scene1-option-correct { stroke: #2e7d32; stroke-width: 3; }
        .scene1-option-wrong { stroke: #c62828; stroke-width: 2; stroke-dasharray: 5,5; }
        .scene1-check { font-size: 24px; font-weight: bold; fill: #2e7d32; }
        .scene1-cross { font-size: 24px; font-weight: bold; fill: #c62828; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- 步骤指示器 -->
            <text id="scene1-step-indicator" class="scene1-step-text" x="400" y="45" text-anchor="middle">步骤 0/6</text>

            <!-- 展开图区域（步骤 0-4） -->
            <g id="scene1-net-group">
                <!-- 上方圆圈面 -->
                <rect id="scene1-square-top" class="scene1-square" x="350" y="80" width="100" height="100"/>
                <circle id="scene1-circle" class="scene1-circle" cx="400" cy="130" r="25"/>

                <!-- 左侧阴影面 -->
                <rect id="scene1-square-left" class="scene1-square" x="250" y="180" width="100" height="100"/>
                <polygon id="scene1-shadow-left" class="scene1-shadow" points="260,270 340,270 260,190"/>

                <!-- 中心空白面 -->
                <rect id="scene1-square-center" class="scene1-square" x="350" y="180" width="100" height="100"/>

                <!-- 右侧阴影面 -->
                <rect id="scene1-square-right" class="scene1-square" x="450" y="180" width="100" height="100"/>
                <polygon id="scene1-shadow-right" class="scene1-shadow" points="460,270 540,270 540,190"/>

                <!-- 下方空白面 -->
                <rect id="scene1-square-bottom" class="scene1-square" x="350" y="280" width="100" height="100"/>

                <!-- 最下方空白面 -->
                <rect id="scene1-square-bottom2" class="scene1-square" x="350" y="380" width="100" height="100"/>

                <!-- 折叠线 -->
                <line id="scene1-fold-line-1" class="scene1-fold-line" x1="350" y1="180" x2="450" y2="180"/>
                <line id="scene1-fold-line-2" class="scene1-fold-line" x1="350" y1="280" x2="450" y2="280"/>
                <line id="scene1-fold-line-3" class="scene1-fold-line" x1="350" y1="180" x2="350" y2="280"/>
                <line id="scene1-fold-line-4" class="scene1-fold-line" x1="450" y1="180" x2="450" y2="280"/>
                <line id="scene1-fold-line-5" class="scene1-fold-line" x1="350" y1="380" x2="450" y2="380"/>

                <!-- 折叠箭头（动态显示） -->
                <g id="scene1-fold-arrows" style="display: none;">
                    <path id="scene1-arrow-left" d="M 250 230 L 200 230 L 210 220 M 200 230 L 210 240" stroke="#1565c0" stroke-width="2" fill="none" style="display: none;"/>
                    <path id="scene1-arrow-right" d="M 550 230 L 600 230 L 590 220 M 600 230 L 590 240" stroke="#1565c0" stroke-width="2" fill="none" style="display: none;"/>
                    <path id="scene1-arrow-bottom" d="M 400 380 L 400 430 L 390 420 M 400 430 L 410 420" stroke="#1565c0" stroke-width="2" fill="none" style="display: none;"/>
                    <path id="scene1-arrow-top" d="M 400 80 L 400 30 L 390 40 M 400 30 L 410 40" stroke="#1565c0" stroke-width="2" fill="none" style="display: none;"/>
                </g>
            </g>

            <!-- 最终正方体区域（步骤 5-6） -->
            <g id="scene1-cube-final" style="display: none;">
                <!-- 顶面（有圆圈） -->
                <polygon id="scene1-cube-top" points="340,150 460,170 420,190 300,170" fill="#fff5f5" stroke="#000" stroke-width="2"/>
                <circle id="scene1-cube-circle" cx="380" cy="170" r="15" fill="none" stroke="#000" stroke-width="1.5"/>

                <!-- 正面（左侧阴影面折叠过来） -->
                <polygon id="scene1-cube-front" points="300,170 420,190 420,270 300,250" fill="#fff5f5" stroke="#000" stroke-width="2"/>
                <polygon id="scene1-cube-shadow-front" class="scene1-shadow" points="305,245 385,265 305,185"/>

                <!-- 右侧面（右侧阴影面） -->
                <polygon id="scene1-cube-right" points="420,190 460,170 460,250 420,270" fill="#fff5f5" stroke="#000" stroke-width="2"/>
                <polygon id="scene1-cube-shadow-right" class="scene1-shadow" points="425,260 455,245 455,185"/>
            </g>

            <!-- 选项区域（步骤 6） - 向上移动以避免与按钮重叠 -->
            <g id="scene1-options" style="display: none;">
                <!-- 选项 A -->
                <g id="scene1-option-a">
                    <rect id="scene1-option-a-frame" x="50" y="320" width="100" height="100" fill="none" stroke="#000" stroke-width="2"/>
                    <!-- 3D 立方体 A -->
                    <polygon points="70,340 130,350 130,410 70,400" fill="#fff5f5" stroke="#000" stroke-width="1.5"/>
                    <polygon points="70,340 130,350 110,330 50,320" fill="#fff5f5" stroke="#000" stroke-width="1.5"/>
                    <polygon points="130,350 150,340 150,400 130,410" fill="#fff5f5" stroke="#000" stroke-width="1.5"/>
                    <!-- A 的图案：正面左下角阴影，顶面有圆，右侧面竖条纹 -->
                    <polygon class="scene1-shadow" points="72,395 128,405 72,355"/>
                    <circle cx="100" cy="335" r="8" fill="none" stroke="#000" stroke-width="1"/>
                    <line x1="135" y1="355" x2="135" y2="395" stroke="#000" stroke-width="1"/>
                    <line x1="140" y1="355" x2="140" y2="395" stroke="#000" stroke-width="1"/>
                    <line x1="145" y1="355" x2="145" y2="395" stroke="#000" stroke-width="1"/>
                    <text x="100" y="455" text-anchor="middle" font-size="18" font-weight="bold" fill="#000">A</text>
                </g>

                <!-- 选项 B -->
                <g id="scene1-option-b">
                    <rect id="scene1-option-b-frame" x="190" y="320" width="100" height="100" fill="none" stroke="#000" stroke-width="2"/>
                    <!-- 3D 立方体 B -->
                    <polygon points="210,340 270,350 270,410 210,400" fill="#fff5f5" stroke="#000" stroke-width="1.5"/>
                    <polygon points="210,340 270,350 250,330 190,320" fill="#fff5f5" stroke="#000" stroke-width="1.5"/>
                    <polygon points="270,350 290,340 290,400 270,410" fill="#fff5f5" stroke="#000" stroke-width="1.5"/>
                    <!-- B 的图案：正面左下角阴影，顶面空白，右侧面右下角阴影 -->
                    <polygon class="scene1-shadow" points="212,395 268,405 212,355"/>
                    <polygon class="scene1-shadow" points="272,395 288,385 288,355"/>
                    <text x="250" y="455" text-anchor="middle" font-size="18" font-weight="bold" fill="#000">B</text>
                    <text id="scene1-check-b" class="scene1-check" x="250" y="310" text-anchor="middle" style="display: none;">✓</text>
                </g>

                <!-- 选项 C -->
                <g id="scene1-option-c">
                    <rect id="scene1-option-c-frame" x="330" y="320" width="100" height="100" fill="none" stroke="#000" stroke-width="2"/>
                    <!-- 3D 立方体 C -->
                    <polygon points="350,340 410,350 410,410 350,400" fill="#fff5f5" stroke="#000" stroke-width="1.5"/>
                    <polygon points="350,340 410,350 390,330 330,320" fill="#fff5f5" stroke="#000" stroke-width="1.5"/>
                    <polygon points="410,350 430,340 430,400 410,410" fill="#fff5f5" stroke="#000" stroke-width="1.5"/>
                    <!-- C 的图案：正面有圆，右侧面右下角阴影 -->
                    <circle cx="380" cy="375" r="12" fill="none" stroke="#000" stroke-width="1"/>
                    <polygon class="scene1-shadow" points="412,395 428,385 428,355"/>
                    <text x="380" y="455" text-anchor="middle" font-size="18" font-weight="bold" fill="#000">C</text>
                    <text id="scene1-cross-c" class="scene1-cross" x="380" y="310" text-anchor="middle" style="display: none;">✗</text>
                </g>

                <!-- 选项 D -->
                <g id="scene1-option-d">
                    <rect id="scene1-option-d-frame" x="470" y="320" width="100" height="100" fill="none" stroke="#000" stroke-width="2"/>
                    <!-- 3D 立方体 D -->
                    <polygon points="490,340 550,350 550,410 490,400" fill="#fff5f5" stroke="#000" stroke-width="1.5"/>
                    <polygon points="490,340 550,350 530,330 470,320" fill="#fff5f5" stroke="#000" stroke-width="1.5"/>
                    <polygon points="550,350 570,340 570,400 550,410" fill="#fff5f5" stroke="#000" stroke-width="1.5"/>
                    <!-- D 的图案：正面左下角阴影，顶面斜条纹，右侧面有圆 -->
                    <polygon class="scene1-shadow" points="492,395 548,405 492,355"/>
                    <line x1="500" y1="330" x2="520" y2="345" stroke="#000" stroke-width="1"/>
                    <line x1="510" y1="325" x2="530" y2="340" stroke="#000" stroke-width="1"/>
                    <line x1="520" y1="320" x2="540" y2="335" stroke="#000" stroke-width="1"/>
                    <circle cx="560" cy="375" r="10" fill="none" stroke="#000" stroke-width="1"/>
                    <text x="520" y="455" text-anchor="middle" font-size="18" font-weight="bold" fill="#000">D</text>
                    <text id="scene1-cross-d" class="scene1-cross" x="520" y="310" text-anchor="middle" style="display: none;">✗</text>
                </g>
            </g>
        </svg>

        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev">◀ 上一步</button>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现 - 正方体展开图折叠演示
        // 布局坐标表（来自 spec.json）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 备注 |
        // |------|------|-----------|------|------|
        // | 展开图中心空白面 | 正方形 | (350,180)-(450,280) | 100×100 | 十字中心 |
        // | 展开图上方圆圈面 | 正方形 | (350,80)-(450,180) | 100×100 | 顶部 |
        // | 展开图左侧阴影面 | 正方形 | (250,180)-(350,280) | 100×100 | 左侧 |
        // | 展开图右侧阴影面 | 正方形 | (450,180)-(550,280) | 100×100 | 右侧 |
        // | 展开图下方空白面 | 正方形 | (350,280)-(450,380) | 100×100 | 底部 |
        // | 展开图最下方空白面 | 正方形 | (350,380)-(450,480) | 100×100 | 十字底部延伸 |
        // | 圆圈 | 圆形 | (400,130) | r=25 | 在上方正方形中心 |
        // | 左阴影三角形 | 多边形 | (260,270)-(340,270)-(260,190) | - | 左下角阴影 |
        // | 右阴影三角形 | 多边形 | (460,270)-(540,270)-(540,190) | - | 右下角阴影 |
        // | 选项 A/B/C/D | 3D 立方体 | 见坐标表 | 100×100 | 选项区 |

        const scene1 = {
            currentStep: 0,
            totalSteps: 6,

            // DOM 元素缓存
            elements: {
                stepIndicator: document.getElementById('scene1-step-indicator'),
                netGroup: document.getElementById('scene1-net-group'),
                cubeFinal: document.getElementById('scene1-cube-final'),
                options: document.getElementById('scene1-options'),
                foldArrows: document.getElementById('scene1-fold-arrows'),
                arrowLeft: document.getElementById('scene1-arrow-left'),
                arrowRight: document.getElementById('scene1-arrow-right'),
                arrowBottom: document.getElementById('scene1-arrow-bottom'),
                arrowTop: document.getElementById('scene1-arrow-top'),
                btnPrev: document.getElementById('scene1-btn-prev'),
                btnNext: document.getElementById('scene1-btn-next'),
                optionBFrame: document.getElementById('scene1-option-b-frame'),
                optionAFrame: document.getElementById('scene1-option-a-frame'),
                optionCFrame: document.getElementById('scene1-option-c-frame'),
                optionDFrame: document.getElementById('scene1-option-d-frame'),
                checkB: document.getElementById('scene1-check-b'),
                crossC: document.getElementById('scene1-cross-c'),
                crossD: document.getElementById('scene1-cross-d')
            },

            // 初始化
            init: function() {
                this.updateStepDisplay();
                this.updateButtons();
                this.bindEvents();
            },

            // 绑定事件
            bindEvents: function() {
                const self = this;
                this.elements.btnPrev.addEventListener('click', function() {
                    if (self.currentStep > 0) {
                        self.currentStep--;
                        self.renderStep();
                    }
                });
                this.elements.btnNext.addEventListener('click', function() {
                    if (self.currentStep < self.totalSteps) {
                        self.currentStep++;
                        self.renderStep();
                    }
                });
            },

            // 更新步骤显示
            updateStepDisplay: function() {
                this.elements.stepIndicator.textContent = '步骤 ' + this.currentStep + '/' + this.totalSteps;
            },

            // 更新按钮状态
            updateButtons: function() {
                this.elements.btnPrev.disabled = (this.currentStep === 0);
                this.elements.btnNext.disabled = (this.currentStep === this.totalSteps);
            },

            // 渲染当前步骤
            renderStep: function() {
                this.updateStepDisplay();
                this.updateButtons();

                const netGroup = this.elements.netGroup;
                const cubeFinal = this.elements.cubeFinal;
                const options = this.elements.options;
                const foldArrows = this.elements.foldArrows;
                const arrowLeft = this.elements.arrowLeft;
                const arrowRight = this.elements.arrowRight;
                const arrowBottom = this.elements.arrowBottom;
                const arrowTop = this.elements.arrowTop;
                const optionBFrame = this.elements.optionBFrame;
                const optionAFrame = this.elements.optionAFrame;
                const optionCFrame = this.elements.optionCFrame;
                const optionDFrame = this.elements.optionDFrame;
                const checkB = this.elements.checkB;
                const crossC = this.elements.crossC;
                const crossD = this.elements.crossD;

                // 步骤 0-4：显示展开图
                if (this.currentStep <= 4) {
                    netGroup.style.display = 'block';
                    cubeFinal.style.display = 'none';
                    options.style.display = 'none';

                    // 显示对应的折叠箭头
                    foldArrows.style.display = 'block';
                    arrowLeft.style.display = (this.currentStep === 1) ? 'block' : 'none';
                    arrowRight.style.display = (this.currentStep === 2) ? 'block' : 'none';
                    arrowBottom.style.display = (this.currentStep === 3) ? 'block' : 'none';
                    arrowTop.style.display = (this.currentStep === 4) ? 'block' : 'none';
                }
                // 步骤 5：显示最终正方体
                else if (this.currentStep === 5) {
                    netGroup.style.display = 'none';
                    cubeFinal.style.display = 'block';
                    options.style.display = 'none';
                    foldArrows.style.display = 'none';
                }
                // 步骤 6：显示选项对比
                else if (this.currentStep === 6) {
                    netGroup.style.display = 'none';
                    cubeFinal.style.display = 'block';
                    options.style.display = 'block';
                    foldArrows.style.display = 'none';

                    // 高亮正确答案 B
                    optionBFrame.setAttribute('class', 'scene1-option-correct');
                    optionAFrame.setAttribute('class', 'scene1-option-wrong');
                    optionCFrame.setAttribute('class', 'scene1-option-wrong');
                    optionDFrame.setAttribute('class', 'scene1-option-wrong');
                    checkB.style.display = 'block';
                    crossC.style.display = 'block';
                    crossD.style.display = 'block';
                }
            }
        };

        // 初始化场景
        scene1.init();
    })();
    </script>
</body>
</html>
