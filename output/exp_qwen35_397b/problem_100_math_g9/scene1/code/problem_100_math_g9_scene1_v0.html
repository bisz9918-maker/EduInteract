<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正三棱柱的立体结构与展开图特征</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene1-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: #f5f5f5; }
        .scene1-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene1-btn:not(:disabled):hover { background: #e0e0e0; }
        .scene1-btn-primary { background: #1565c0; color: white; border-color: #1565c0; }
        .scene1-btn-primary:not(:disabled):hover { background: #0d47a1; }
        #scene1-step-indicator { font-size: 14px; color: #666; margin-left: 10px; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <!-- SVG 图示区：固定 800×500px -->
        <svg width="800" height="500" id="scene1-svg">
            <!-- 立体三棱柱 - 左侧 x=20~220, y=160~370 -->
            
            <!-- 步骤0: 立体三棱柱线框 -->
            <!-- 后侧棱线（虚线） -->
            <line id="scene1-edge-back" x1="110" y1="230" x2="130" y2="370" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" class="scene1-step0"/>
            
            <!-- 可见棱线（实线） -->
            <!-- 上底面三角形 -->
            <polygon id="scene1-prism-top-outline" points="80,180 140,180 110,230" fill="none" stroke="#000000" stroke-width="2" class="scene1-step0"/>
            <!-- 下底面三角形 -->
            <polygon id="scene1-prism-bottom-outline" points="100,320 160,320 130,370" fill="none" stroke="#000000" stroke-width="2" class="scene1-step0"/>
            <!-- 侧棱 -->
            <line id="scene1-edge-left" x1="80" y1="180" x2="100" y2="320" stroke="#000000" stroke-width="2" class="scene1-step0"/>
            <line id="scene1-edge-right" x1="140" y1="180" x2="160" y2="320" stroke="#000000" stroke-width="2" class="scene1-step0"/>
            <line id="scene1-edge-front" x1="110" y1="230" x2="130" y2="370" stroke="#000000" stroke-width="2" class="scene1-step0"/>
            
            <!-- 步骤1: 底面填充 -->
            <polygon id="scene1-prism-top-base" points="80,180 140,180 110,230" fill="#1565c0" fill-opacity="0.2" stroke="#1565c0" stroke-width="2" class="scene1-step1" style="display:none;opacity:0;"/>
            <polygon id="scene1-prism-bottom-base" points="100,320 160,320 130,370" fill="#1565c0" fill-opacity="0.2" stroke="#1565c0" stroke-width="2" class="scene1-step1" style="display:none;opacity:0;"/>
            
            <!-- 底面标签 -->
            <text id="scene1-label-base-top" x="100" y="150" font-size="14" fill="#1565c0" font-weight="bold" class="scene1-step1" style="display:none;opacity:0;">底面</text>
            <text id="scene1-label-base-bottom" x="130" y="390" font-size="14" fill="#1565c0" font-weight="bold" class="scene1-step1" style="display:none;opacity:0;">底面</text>
            
            <!-- 步骤2: 侧面填充 -->
            <!-- 前侧面 -->
            <polygon id="scene1-prism-side1" points="80,180 100,320 160,320 140,180" fill="#2e7d32" fill-opacity="0.2" stroke="#2e7d32" stroke-width="2" class="scene1-step2" style="display:none;opacity:0;"/>
            <!-- 右侧面 -->
            <polygon id="scene1-prism-side2" points="140,180 160,320 220,300 200,160" fill="#2e7d32" fill-opacity="0.2" stroke="#2e7d32" stroke-width="2" class="scene1-step2" style="display:none;opacity:0;"/>
            <!-- 左侧面（虚线表示隐藏） -->
            <polygon id="scene1-prism-side3" points="80,180 100,320 40,300 20,160" fill="#2e7d32" fill-opacity="0.2" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5,5" class="scene1-step2" style="display:none;opacity:0;"/>
            
            <!-- 侧面标签 -->
            <text id="scene1-label-side" x="180" y="250" font-size="14" fill="#2e7d32" font-weight="bold" class="scene1-step2" style="display:none;opacity:0;">侧面</text>
            
            <!-- 步骤3: 展开箭头和展开图 -->
            <!-- 展开箭头 -->
            <defs>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#000000" />
                </marker>
            </defs>
            <line id="scene1-arrow" x1="370" y1="240" x2="430" y2="240" stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrowhead)" class="scene1-step3" style="display:none;opacity:0;"/>
            
            <!-- 展开图 - 右侧 x=400~640, y=120~400 -->
            <!-- 三个侧面矩形 -->
            <rect id="scene1-net-side1" x="400" y="200" width="80" height="120" fill="#2e7d32" fill-opacity="0.2" stroke="#2e7d32" stroke-width="2" class="scene1-step3" style="display:none;opacity:0;"/>
            <rect id="scene1-net-side2" x="480" y="200" width="80" height="120" fill="#2e7d32" fill-opacity="0.2" stroke="#2e7d32" stroke-width="2" class="scene1-step3" style="display:none;opacity:0;"/>
            <rect id="scene1-net-side3" x="560" y="200" width="80" height="120" fill="#2e7d32" fill-opacity="0.2" stroke="#2e7d32" stroke-width="2" class="scene1-step3" style="display:none;opacity:0;"/>
            
            <!-- 上下底面三角形 -->
            <polygon id="scene1-net-top-base" points="440,140 520,140 480,200" fill="#1565c0" fill-opacity="0.2" stroke="#1565c0" stroke-width="2" class="scene1-step3" style="display:none;opacity:0;"/>
            <polygon id="scene1-net-bottom-base" points="440,320 520,320 480,380" fill="#1565c0" fill-opacity="0.2" stroke="#1565c0" stroke-width="2" class="scene1-step3" style="display:none;opacity:0;"/>
            
            <!-- 展开图标签 -->
            <text id="scene1-label-net-base-top" x="480" y="120" font-size="14" fill="#1565c0" font-weight="bold" text-anchor="middle" class="scene1-step3" style="display:none;opacity:0;">底面（正三角形）</text>
            <text id="scene1-label-net-base-bottom" x="480" y="400" font-size="14" fill="#1565c0" font-weight="bold" text-anchor="middle" class="scene1-step3" style="display:none;opacity:0;">底面（正三角形）</text>
            <text id="scene1-label-net-side" x="560" y="260" font-size="14" fill="#2e7d32" font-weight="bold" class="scene1-step3" style="display:none;opacity:0;">侧面（矩形）</text>
        </svg>
        
        <!-- 控件栏叠在 SVG 底部 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn" disabled>◀ 上一步</button>
            <button id="scene1-btn-next" class="scene1-btn scene1-btn-primary">下一步 ▶</button>
            <span id="scene1-step-indicator">步骤 1/4</span>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现 - 正三棱柱的立体结构与展开图特征
        
        // 布局坐标表（实现对照依据）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // |------|------|-----------|------|-------------|------|
        // | 立体三棱柱-底面1 | 多边形 | (80,180)-(140,180)-(110,230) | ~60×50 | 左上方 | 上底面正三角形 |
        // | 立体三棱柱-底面2 | 多边形 | (100,320)-(160,320)-(130,370) | ~60×50 | 左下方 | 下底面正三角形 |
        // | 立体三棱柱-侧面1 | 多边形 | (80,180)-(100,320)-(160,320)-(140,180) | ~80×140 | - | 前侧面矩形 |
        // | 立体三棱柱-侧面2 | 多边形 | (140,180)-(160,320)-(220,300)-(200,160) | ~80×140 | - | 右侧面矩形 |
        // | 立体三棱柱-侧面3 | 多边形 | (80,180)-(100,320)-(40,300)-(20,160) | ~80×140 | - | 左侧面矩形（虚线） |
        // | 展开箭头 | 箭头 | (370,240)-(430,240) | 60×20 | 上方 | 指向右侧 |
        // | 展开图-侧面矩形1 | 矩形 | (400,200)-(480,320) | 80×120 | - | 左侧矩形 |
        // | 展开图-侧面矩形2 | 矩形 | (480,200)-(560,320) | 80×120 | - | 中间矩形 |
        // | 展开图-侧面矩形3 | 矩形 | (560,200)-(640,320) | 80×120 | - | 右侧矩形 |
        // | 展开图-上底面 | 三角形 | (440,140)-(520,140)-(480,200) | ~80×60 | 上方 | 上底面正三角形 |
        // | 展开图-下底面 | 三角形 | (440,320)-(520,320)-(480,380) | ~80×60 | 下方 | 下底面正三角形 |
        
        let currentStep = 0;
        const totalSteps = 4;
        
        // 获取 DOM 元素
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        
        // 步骤配置：每个步骤需要显示的元素
        const stepConfig = {
            0: {
                show: ['scene1-step0'],
                hide: ['scene1-step1', 'scene1-step2', 'scene1-step3']
            },
            1: {
                show: ['scene1-step0', 'scene1-step1'],
                hide: ['scene1-step2', 'scene1-step3']
            },
            2: {
                show: ['scene1-step0', 'scene1-step1', 'scene1-step2'],
                hide: ['scene1-step3']
            },
            3: {
                show: ['scene1-step0', 'scene1-step1', 'scene1-step2', 'scene1-step3'],
                hide: []
            }
        };
        
        // 显示/隐藏工具函数
        function showElement(el) {
            el.style.display = '';
            el.style.opacity = '1';
        }
        
        function hideElement(el) {
            el.style.display = 'none';
            el.style.opacity = '0';
        }
        
        // 渲染步骤
        function renderStep(step) {
            const config = stepConfig[step];
            
            // 显示指定元素
            config.show.forEach(className => {
                const elements = document.querySelectorAll('.' + className);
                elements.forEach(el => showElement(el));
            });
            
            // 隐藏指定元素
            config.hide.forEach(className => {
                const elements = document.querySelectorAll('.' + className);
                elements.forEach(el => hideElement(el));
            });
            
            // 更新按钮状态
            btnPrev.disabled = (step === 0);
            btnNext.disabled = (step === totalSteps - 1);
            
            // 更新步骤指示器
            stepIndicator.textContent = '步骤 ' + (step + 1) + '/' + totalSteps;
        }
        
        // 按钮事件处理
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                renderStep(currentStep);
            }
        });
        
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                renderStep(currentStep);
            }
        });
        
        // 初始化
        renderStep(currentStep);
        
    })();
    </script>
</body>
</html>
