<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正三棱柱展开图折叠演示</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', sans-serif;
        }
        #scene3-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene3-svg {
            width: 800px;
            height: 500px;
        }
        .scene3-btn {
            fill: #1976d2;
            cursor: pointer;
            transition: fill 0.2s;
        }
        .scene3-btn:hover {
            fill: #1565c0;
        }
        .scene3-btn-text {
            fill: #ffffff;
            font-size: 13px;
            font-weight: bold;
            pointer-events: none;
        }
        .scene3-title {
            font-size: 15px;
            font-weight: bold;
            fill: #333333;
        }
        .scene3-label {
            font-size: 13px;
            fill: #666666;
        }
        .scene3-step-text {
            font-size: 15px;
            font-weight: bold;
            fill: #1976d2;
        }
        .scene3-status-text {
            font-size: 13px;
            fill: #555555;
        }
        .scene3-success {
            font-size: 16px;
            font-weight: bold;
            fill: #2e7d32;
        }
        .scene3-fail {
            font-size: 16px;
            font-weight: bold;
            fill: #c62828;
        }
        .scene3-fold-face {
            fill: rgba(21, 101, 192, 0.3);
        }
        .scene3-done-face {
            fill: rgba(46, 125, 50, 0.2);
        }
        .scene3-arrow {
            fill: none;
            stroke: #888888;
            stroke-width: 2;
        }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg id="scene3-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 标题 (调整 y 从 42 到 45，确保 top edge >= 20px) -->
            <text id="scene3-title" x="400" y="45" text-anchor="middle" class="scene3-title">正三棱柱展开图折叠演示</text>
            
            <!-- 图③展开图区域 (50,80) 180×140 -->
            <g id="scene3-net-fig3" transform="translate(50,80)">
                <!-- 三个矩形侧面（平行四边形网格） -->
                <rect id="scene3-fig3-side1" x="0" y="40" width="40" height="80" fill="#ffffff" stroke="#000000" stroke-width="1"/>
                <rect id="scene3-fig3-side2" x="40" y="40" width="40" height="80" fill="#ffffff" stroke="#000000" stroke-width="1"/>
                <rect id="scene3-fig3-side3" x="80" y="40" width="40" height="80" fill="#ffffff" stroke="#000000" stroke-width="1"/>
                <!-- 上底面三角形（锐角三角形，60°角） -->
                <polygon id="scene3-fig3-top-tri" points="40,40 20,10 60,10" fill="#ffffff" stroke="#000000" stroke-width="1"/>
                <!-- 下底面三角形（锐角三角形，60°角） -->
                <polygon id="scene3-fig3-bottom-tri" points="40,120 20,150 60,150" fill="#ffffff" stroke="#000000" stroke-width="1"/>
            </g>
            
            <!-- 图④展开图区域 (280,80) 180×140 -->
            <g id="scene3-net-fig4" transform="translate(280,80)">
                <!-- 三个矩形侧面（矩形网格） -->
                <rect id="scene3-fig4-side1" x="0" y="40" width="40" height="80" fill="#ffffff" stroke="#000000" stroke-width="1"/>
                <rect id="scene3-fig4-side2" x="40" y="40" width="40" height="80" fill="#ffffff" stroke="#000000" stroke-width="1"/>
                <rect id="scene3-fig4-side3" x="80" y="40" width="40" height="80" fill="#ffffff" stroke="#000000" stroke-width="1"/>
                <!-- 上底面三角形（锐角三角形，60°角） -->
                <polygon id="scene3-fig4-top-tri" points="40,40 20,10 60,10" fill="#ffffff" stroke="#000000" stroke-width="1"/>
                <!-- 下底面三角形（锐角三角形，60°角） -->
                <polygon id="scene3-fig4-bottom-tri" points="40,120 20,150 60,150" fill="#ffffff" stroke="#000000" stroke-width="1"/>
            </g>
            
            <!-- 图③标签 (调整 y 从 235 到 240) -->
            <text id="scene3-label-fig3" x="140" y="240" text-anchor="middle" class="scene3-label">图③</text>
            
            <!-- 图④标签 (调整 y 从 235 到 240) -->
            <text id="scene3-label-fig4" x="370" y="240" text-anchor="middle" class="scene3-label">图④</text>
            
            <!-- 立体图区域 (500,80) 280×200 -->
            <g id="scene3-prism-3d" transform="translate(500,80)">
                <!-- 正三棱柱线框图 -->
                <!-- 下底面三角形 -->
                <polygon id="scene3-prism-bottom" points="140,160 60,140 220,140" fill="#e3f2fd" stroke="#000000" stroke-width="1.5" opacity="0"/>
                <!-- 上底面三角形 -->
                <polygon id="scene3-prism-top" points="140,80 60,60 220,60" fill="#e3f2fd" stroke="#000000" stroke-width="1.5" opacity="0"/>
                <!-- 侧棱 -->
                <line id="scene3-prism-edge1" x1="60" y1="60" x2="60" y2="140" stroke="#000000" stroke-width="1.5" opacity="0"/>
                <line id="scene3-prism-edge2" x1="140" y1="80" x2="140" y2="160" stroke="#000000" stroke-width="1.5" opacity="0"/>
                <line id="scene3-prism-edge3" x1="220" y1="60" x2="220" y2="140" stroke="#000000" stroke-width="1.5" opacity="0"/>
                <!-- 侧面（可见面） -->
                <polygon id="scene3-prism-face1" points="60,60 140,80 140,160 60,140" fill="#e3f2fd" stroke="#000000" stroke-width="1" opacity="0"/>
                <polygon id="scene3-prism-face2" points="140,80 220,60 220,140 140,160" fill="#bbdefb" stroke="#000000" stroke-width="1" opacity="0"/>
                <polygon id="scene3-prism-face3" points="220,60 60,60 60,140 220,140" fill="#e3f2fd" stroke="#000000" stroke-width="1" opacity="0"/>
            </g>
            
            <!-- 立体图标签 (调整 y 从 300 到 305) -->
            <text id="scene3-label-prism" x="640" y="305" text-anchor="middle" class="scene3-label">正三棱柱</text>
            
            <!-- 成功/失败标记 (调整 y 从 335 到 340，增加与立体图标签的间距至 20px) -->
            <text id="scene3-result-mark" x="640" y="340" text-anchor="middle" class="scene3-success" opacity="0">✓能围成</text>
            
            <!-- 步骤指示器 (调整 y 从 380 到 385) -->
            <text id="scene3-step-indicator" x="400" y="385" text-anchor="middle" class="scene3-step-text">步骤 0/6</text>
            
            <!-- 状态说明 (调整 y 从 410 到 415，增加与步骤指示器的间距至 15px) -->
            <text id="scene3-status-text" x="400" y="415" text-anchor="middle" class="scene3-status-text">观察展开图</text>
            
            <!-- 控件栏（SVG 内部底部，调整 transform y 从 468 到 465，确保按钮 bottom edge <= 480） -->
            <g id="scene3-controls" transform="translate(0,465)">
                <!-- 上一步按钮 -->
                <rect id="scene3-btn-prev-bg" x="280" y="0" width="80" height="30" rx="5" class="scene3-btn"/>
                <text id="scene3-btn-prev-text" x="320" y="19" text-anchor="middle" class="scene3-btn-text">◀ 上一步</text>
                
                <!-- 重置按钮 -->
                <rect id="scene3-btn-reset-bg" x="380" y="0" width="60" height="30" rx="5" class="scene3-btn"/>
                <text id="scene3-btn-reset-text" x="410" y="19" text-anchor="middle" class="scene3-btn-text">重置</text>
                
                <!-- 下一步按钮 -->
                <rect id="scene3-btn-next-bg" x="440" y="0" width="80" height="30" rx="5" class="scene3-btn"/>
                <text id="scene3-btn-next-text" x="480" y="19" text-anchor="middle" class="scene3-btn-text">下一步 ▶</text>
            </g>
        </svg>
    </div>
    
    <script>
    (function() {
        // Scene 3: 正三棱柱展开图折叠演示
        // 布局坐标表（实现对照依据）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 备注 |
        // |------|------|-----------|------|------|
        // | 标题区 | text | (400,45) | ~200×20 | "正三棱柱展开图折叠演示" |
        // | 展开图区-图③ | g | (50,80) | 180×140 | 左侧展示图③展开图 |
        // | 展开图区-图④ | g | (280,80) | 180×140 | 右侧展示图④展开图 |
        // | 图③标签 | text | (140,240) | ~30×16 | "图③" |
        // | 图④标签 | text | (370,240) | ~30×16 | "图④" |
        // | 立体图区 | g | (500,80) | 280×200 | 右侧展示折叠后立体图 |
        // | 立体图标签 | text | (640,305) | ~60×16 | "正三棱柱" |
        // | 成功标记 | text | (640,340) | ~50×24 | "✓能围成"（绿色） |
        // | 步骤指示器 | text | (400,385) | ~150×20 | "步骤 1/6" |
        // | 状态说明 | text | (400,415) | ~200×18 | 当前步骤说明文字 |
        // | 上一步按钮 | rect+text | (280,465) | 80×30 | 控件栏左侧 |
        // | 重置按钮 | rect+text | (380,465) | 60×30 | 控件栏中间 |
        // | 下一步按钮 | rect+text | (440,465) | 80×30 | 控件栏右侧 |
        
        const state = {
            currentStep: 0,
            currentFigure: 3, // 3=图③, 4=图④
            maxSteps: 6
        };
        
        // 步骤说明文字
        const stepDescriptions = [
            "观察展开图",
            "第一个侧面折叠",
            "第二个侧面折叠",
            "第三个侧面折叠完成",
            "上底面折叠",
            "下底面折叠完成",
            "✓ 能围成正三棱柱"
        ];
        
        // 获取 DOM 元素
        const stepIndicator = document.getElementById('scene3-step-indicator');
        const statusText = document.getElementById('scene3-status-text');
        const resultMark = document.getElementById('scene3-result-mark');
        
        // 图③元素
        const netFig3 = document.getElementById('scene3-net-fig3');
        
        // 图④元素
        const netFig4 = document.getElementById('scene3-net-fig4');
        
        // 立体图元素
        const prismBottom = document.getElementById('scene3-prism-bottom');
        const prismTop = document.getElementById('scene3-prism-top');
        const prismEdge1 = document.getElementById('scene3-prism-edge1');
        const prismEdge2 = document.getElementById('scene3-prism-edge2');
        const prismEdge3 = document.getElementById('scene3-prism-edge3');
        const prismFace1 = document.getElementById('scene3-prism-face1');
        const prismFace2 = document.getElementById('scene3-prism-face2');
        const prismFace3 = document.getElementById('scene3-prism-face3');
        
        // 按钮元素
        const btnPrev = document.getElementById('scene3-btn-prev-bg');
        const btnReset = document.getElementById('scene3-btn-reset-bg');
        const btnNext = document.getElementById('scene3-btn-next-bg');
        
        // 更新显示状态
        function updateDisplay() {
            stepIndicator.textContent = `步骤 ${state.currentStep}/${state.maxSteps}`;
            statusText.textContent = stepDescriptions[state.currentStep];
            
            // 更新图③和图④的可见性
            if (state.currentFigure === 3) {
                netFig3.style.display = 'block';
                netFig4.style.display = 'none';
                document.getElementById('scene3-label-fig3').style.display = 'block';
                document.getElementById('scene3-label-fig4').style.display = 'none';
            } else {
                netFig3.style.display = 'none';
                netFig4.style.display = 'block';
                document.getElementById('scene3-label-fig3').style.display = 'none';
                document.getElementById('scene3-label-fig4').style.display = 'block';
            }
            
            // 更新立体图透明度
            const prismOpacity = state.currentStep >= 1 ? state.currentStep / 6 : 0;
            [prismBottom, prismTop, prismEdge1, prismEdge2, prismEdge3, prismFace1, prismFace2, prismFace3].forEach(el => {
                el.style.opacity = prismOpacity;
            });
            
            // 更新成功标记
            if (state.currentStep >= 6) {
                resultMark.style.opacity = 1;
            } else {
                resultMark.style.opacity = 0;
            }
            
            // 更新按钮状态
            updateButtonStates();
        }
        
        // 更新按钮状态
        function updateButtonStates() {
            // 上一步按钮
            if (state.currentStep <= 0 && state.currentFigure === 3) {
                btnPrev.style.opacity = 0.5;
                btnPrev.style.cursor = 'not-allowed';
            } else {
                btnPrev.style.opacity = 1;
                btnPrev.style.cursor = 'pointer';
            }
            
            // 下一步按钮
            if (state.currentStep >= state.maxSteps && state.currentFigure === 4) {
                btnNext.style.opacity = 0.5;
                btnNext.style.cursor = 'not-allowed';
            } else {
                btnNext.style.opacity = 1;
                btnNext.style.cursor = 'pointer';
            }
        }
        
        // 上一步
        function stepBack() {
            if (state.currentStep > 0) {
                state.currentStep--;
                updateDisplay();
            } else if (state.currentFigure === 4) {
                state.currentFigure = 3;
                state.currentStep = 6;
                updateDisplay();
            }
        }
        
        // 重置
        function reset() {
            state.currentStep = 0;
            state.currentFigure = 3;
            updateDisplay();
        }
        
        // 下一步
        function stepForward() {
            if (state.currentStep < state.maxSteps) {
                state.currentStep++;
                updateDisplay();
            } else if (state.currentFigure === 3) {
                state.currentFigure = 4;
                state.currentStep = 0;
                updateDisplay();
            }
        }
        
        // 绑定按钮事件
        btnPrev.addEventListener('click', stepBack);
        btnReset.addEventListener('click', reset);
        btnNext.addEventListener('click', stepForward);
        
        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
