<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抛物线与直线交点 - 参数 b 变化演示</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #scene2-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene2-svg {
            width: 800px;
            height: 500px;
        }
        .scene2-axis {
            stroke: #000000;
            stroke-width: 2;
            fill: none;
        }
        .scene2-line-ab {
            stroke: #000000;
            stroke-width: 2;
            fill: none;
        }
        .scene2-parabola {
            stroke: #1565c0;
            stroke-width: 2;
            fill: none;
        }
        .scene2-critical-line {
            stroke: #c62828;
            stroke-width: 2;
            stroke-dasharray: 5, 5;
            fill: none;
        }
        .scene2-point {
            fill: #000000;
        }
        .scene2-point-p1 {
            fill: #1565c0;
        }
        .scene2-point-p2 {
            fill: #2e7d32;
        }
        .scene2-label {
            font-size: 14px;
            fill: #000000;
            font-family: 'Times New Roman', serif;
        }
        .scene2-equation {
            font-size: 16px;
            fill: #333333;
            font-family: 'Times New Roman', serif;
        }
        .scene2-critical-label {
            font-size: 12px;
            fill: #c62828;
            font-family: sans-serif;
        }
        .scene2-slider-track {
            fill: #cccccc;
        }
        .scene2-slider-handle {
            fill: #1565c0;
            cursor: pointer;
        }
        .scene2-slider-handle:hover {
            fill: #0d47a1;
        }
        .scene2-b-value {
            font-size: 14px;
            fill: #333333;
            font-family: sans-serif;
        }
        .scene2-coords {
            font-size: 12px;
            fill: #666666;
            font-family: sans-serif;
        }
        .scene2-tick {
            stroke: #000000;
            stroke-width: 1;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 坐标轴 -->
            <line id="scene2-x-axis" class="scene2-axis" x1="80" y1="360" x2="680" y2="360" />
            <line id="scene2-y-axis" class="scene2-axis" x1="280" y1="60" x2="280" y2="420" />
            
            <!-- 坐标轴刻度 -->
            <g id="scene2-x-ticks">
                <line class="scene2-tick" x1="80" y1="355" x2="80" y2="365" />
                <line class="scene2-tick" x1="180" y1="355" x2="180" y2="365" />
                <line class="scene2-tick" x1="280" y1="355" x2="280" y2="365" />
                <line class="scene2-tick" x1="380" y1="355" x2="380" y2="365" />
                <line class="scene2-tick" x1="480" y1="355" x2="480" y2="365" />
                <line class="scene2-tick" x1="580" y1="355" x2="580" y2="365" />
                <line class="scene2-tick" x1="680" y1="355" x2="680" y2="365" />
            </g>
            <g id="scene2-y-ticks">
                <line class="scene2-tick" x1="275" y1="420" x2="285" y2="420" />
                <line class="scene2-tick" x1="275" y1="360" x2="285" y2="360" />
                <line class="scene2-tick" x1="275" y1="300" x2="285" y2="300" />
                <line class="scene2-tick" x1="275" y1="240" x2="285" y2="240" />
                <line class="scene2-tick" x1="275" y1="180" x2="285" y2="180" />
                <line class="scene2-tick" x1="275" y1="120" x2="285" y2="120" />
                <line class="scene2-tick" x1="275" y1="60" x2="285" y2="60" />
            </g>
            
            <!-- 坐标轴标签 -->
            <g id="scene2-axis-labels">
                <text class="scene2-label" x="75" y="380">-2</text>
                <text class="scene2-label" x="175" y="380">-1</text>
                <text class="scene2-label" x="270" y="380">0</text>
                <text class="scene2-label" x="375" y="380">1</text>
                <text class="scene2-label" x="475" y="380">2</text>
                <text class="scene2-label" x="575" y="380">3</text>
                <text class="scene2-label" x="675" y="380">4</text>
                <text class="scene2-label" x="260" y="425">-1</text>
                <text class="scene2-label" x="265" y="365">0</text>
                <text class="scene2-label" x="265" y="305">1</text>
                <text class="scene2-label" x="265" y="245">2</text>
                <text class="scene2-label" x="265" y="185">3</text>
                <text class="scene2-label" x="265" y="125">4</text>
                <text class="scene2-label" x="265" y="65">5</text>
            </g>
            
            <!-- 直线 AB: y = -x + 3 -->
            <line id="scene2-line-ab" class="scene2-line-ab" x1="80" y1="420" x2="680" y2="60" />
            
            <!-- 临界线 b=5/2 (x=430) -->
            <line id="scene2-critical-1" class="scene2-critical-line" x1="430" y1="60" x2="430" y2="420" />
            <text id="scene2-critical-label-1" class="scene2-critical-label" x="430" y="45" text-anchor="middle">b=5/2</text>
            
            <!-- 临界线 b=11/3 (x≈547) -->
            <line id="scene2-critical-2" class="scene2-critical-line" x1="547" y1="60" x2="547" y2="420" />
            <text id="scene2-critical-label-2" class="scene2-critical-label" x="547" y="45" text-anchor="middle">b=11/3</text>
            
            <!-- 抛物线 (动态绘制) -->
            <path id="scene2-parabola" class="scene2-parabola" d="" />
            
            <!-- 固定点 -->
            <circle id="scene2-point-a" class="scene2-point" cx="180" cy="120" r="4" />
            <text class="scene2-label" x="165" y="105">A</text>
            
            <circle id="scene2-point-b" class="scene2-point" cx="480" cy="300" r="4" />
            <text class="scene2-label" x="490" y="320">B</text>
            
            <circle id="scene2-point-n" class="scene2-point" cx="280" cy="180" r="4" />
            <text class="scene2-label" x="290" y="165">N</text>
            
            <circle id="scene2-point-m" class="scene2-point" cx="580" cy="360" r="4" />
            <text class="scene2-label" x="590" y="380">M</text>
            
            <text class="scene2-label" x="265" y="375">O</text>
            
            <!-- 交点 P1 (动态) -->
            <circle id="scene2-intersect-p1" class="scene2-point-p1" cx="0" cy="0" r="6" />
            <text id="scene2-label-p1" class="scene2-label" x="0" y="0" text-anchor="middle" fill="#1565c0">P₁</text>
            
            <!-- 交点 P2 (动态) -->
            <circle id="scene2-intersect-p2" class="scene2-point-p2" cx="0" cy="0" r="6" />
            <text id="scene2-label-p2" class="scene2-label" x="0" y="0" text-anchor="middle" fill="#2e7d32">P₂</text>
            
            <!-- 方程标签 -->
            <text id="scene2-equation-parabola" class="scene2-equation" x="100" y="80">y=x²-bx+2</text>
            <text id="scene2-equation-line" class="scene2-equation" x="600" y="100">y=-x+3</text>
            
            <!-- 滑块轨道 -->
            <rect id="scene2-slider-track" class="scene2-slider-track" x="150" y="465" width="500" height="20" rx="10" />
            
            <!-- 滑块手柄 (动态) -->
            <circle id="scene2-slider-handle" class="scene2-slider-handle" cx="275" cy="475" r="12" />
            
            <!-- b 值显示 -->
            <text id="scene2-b-value" class="scene2-b-value" x="680" y="475">b = 2.50</text>
            
            <!-- 交点坐标显示 -->
            <text id="scene2-coords-display" class="scene2-coords" x="680" y="450">P₁( , )  P₂( , )</text>
        </svg>
    </div>
    
    <script>
    (function() {
        // Scene 2: 抛物线与直线交点随参数 b 变化的动态演示
        
        // 坐标映射函数
        // x 轴范围 [-2, 4] → 像素 [80, 680]，比例尺 100px/单位
        // y 轴范围 [-1, 5] → 像素 [420, 60]，比例尺 60px/单位
        function mathToPixel(x, y) {
            const px = 80 + (x + 2) * 100;
            const py = 420 - (y + 1) * 60;
            return { px, py };
        }
        
        function pixelToMath(px, py) {
            const x = (px - 80) / 100 - 2;
            const y = (420 - py) / 60 - 1;
            return { x, y };
        }
        
        // 计算抛物线与直线的交点
        // 抛物线: y = x² - bx + 2
        // 直线: y = -x + 3
        // 联立: x² - bx + 2 = -x + 3
        // 整理: x² - (b-1)x - 1 = 0
        function calculateIntersections(b) {
            const a = 1;
            const bb = -(b - 1);
            const c = -1;
            
            const discriminant = bb * bb - 4 * a * c;
            
            if (discriminant < 0) {
                return null;
            }
            
            const sqrtDisc = Math.sqrt(discriminant);
            const x1 = (-bb - sqrtDisc) / (2 * a);
            const x2 = (-bb + sqrtDisc) / (2 * a);
            
            const y1 = -x1 + 3;
            const y2 = -x2 + 3;
            
            return { x1, y1, x2, y2 };
        }
        
        // 绘制抛物线
        function drawParabola(b) {
            const path = document.getElementById('scene2-parabola');
            let d = '';
            
            // 采样 x 从 -2 到 4，共 200 点
            for (let i = 0; i <= 200; i++) {
                const x = -2 + (i / 200) * 6;
                const y = x * x - b * x + 2;
                const { px, py } = mathToPixel(x, y);
                
                if (i === 0) {
                    d += `M ${px} ${py}`;
                } else {
                    d += ` L ${px} ${py}`;
                }
            }
            
            path.setAttribute('d', d);
        }
        
        // 更新交点位置
        function updateIntersections(b) {
            const intersections = calculateIntersections(b);
            
            if (intersections) {
                const { x1, y1, x2, y2 } = intersections;
                
                const p1 = document.getElementById('scene2-intersect-p1');
                const labelP1 = document.getElementById('scene2-label-p1');
                const p2 = document.getElementById('scene2-intersect-p2');
                const labelP2 = document.getElementById('scene2-label-p2');
                
                const pos1 = mathToPixel(x1, y1);
                const pos2 = mathToPixel(x2, y2);
                
                p1.setAttribute('cx', pos1.px);
                p1.setAttribute('cy', pos1.py);
                labelP1.setAttribute('x', pos1.px);
                labelP1.setAttribute('y', pos1.py - 15);
                
                p2.setAttribute('cx', pos2.px);
                p2.setAttribute('cy', pos2.py);
                labelP2.setAttribute('x', pos2.px);
                labelP2.setAttribute('y', pos2.py + 20);
                
                // 更新坐标显示
                const coordsDisplay = document.getElementById('scene2-coords-display');
                coordsDisplay.textContent = `P₁(${x1.toFixed(2)}, ${y1.toFixed(2)})  P₂(${x2.toFixed(2)}, ${y2.toFixed(2)})`;
            }
        }
        
        // 更新滑块位置
        function updateSlider(b) {
            const handle = document.getElementById('scene2-slider-handle');
            const bValue = document.getElementById('scene2-b-value');
            
            // b 范围 0~4，对应像素 x 150~650
            const handleX = 150 + (b / 4) * 500;
            handle.setAttribute('cx', handleX);
            
            bValue.textContent = `b = ${b.toFixed(2)}`;
        }
        
        // 主更新函数
        function update(b) {
            drawParabola(b);
            updateIntersections(b);
            updateSlider(b);
        }
        
        // 滑块拖拽逻辑
        let isDragging = false;
        const sliderHandle = document.getElementById('scene2-slider-handle');
        const sliderTrack = document.getElementById('scene2-slider-track');
        
        function getBFromX(clientX) {
            const rect = sliderTrack.getBoundingClientRect();
            const svgRect = document.getElementById('scene2-svg').getBoundingClientRect();
            let x = clientX - svgRect.left;
            x = Math.max(150, Math.min(650, x));
            const b = ((x - 150) / 500) * 4;
            return b;
        }
        
        sliderHandle.addEventListener('mousedown', function(e) {
            isDragging = true;
            e.preventDefault();
        });
        
        document.addEventListener('mousemove', function(e) {
            if (!isDragging) return;
            
            const b = getBFromX(e.clientX);
            update(b);
        });
        
        document.addEventListener('mouseup', function() {
            isDragging = false;
        });
        
        // 触摸事件支持
        sliderHandle.addEventListener('touchstart', function(e) {
            isDragging = true;
            e.preventDefault();
        });
        
        document.addEventListener('touchmove', function(e) {
            if (!isDragging) return;
            
            const touch = e.touches[0];
            const b = getBFromX(touch.clientX);
            update(b);
        });
        
        document.addEventListener('touchend', function() {
            isDragging = false;
        });
        
        // 点击轨道直接跳转
        sliderTrack.addEventListener('click', function(e) {
            const b = getBFromX(e.clientX);
            update(b);
        });
        
        // 初始化：b = 2.5 (临界状态)
        let currentB = 2.5;
        update(currentB);
        
    })();
    </script>
</body>
</html>
