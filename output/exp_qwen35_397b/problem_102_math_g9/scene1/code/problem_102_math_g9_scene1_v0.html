<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>直线 AB 与坐标轴交点及线段范围</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        /* 元素显隐控制 */
        .scene1-hidden {
            opacity: 0;
            display: none;
        }
        .scene1-visible {
            opacity: 1;
            display: block;
        }
        /* 按钮样式 */
        .scene1-btn {
            width: 80px;
            height: 30px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .scene1-btn-prev {
            background-color: #9e9e9e;
            color: white;
        }
        .scene1-btn-prev:enabled {
            background-color: #616161;
        }
        .scene1-btn-prev:disabled {
            background-color: #e0e0e0;
            cursor: not-allowed;
        }
        .scene1-btn-next {
            background-color: #1565c0;
            color: white;
        }
        .scene1-btn-next:enabled {
            background-color: #0d47a1;
        }
        .scene1-btn-next:disabled {
            background-color: #e0e0e0;
            cursor: not-allowed;
        }
        /* 线段 AN 和 BM 的描边动画 */
        .scene1-segment-an, .scene1-segment-bm {
            stroke-dasharray: 200;
            stroke-dashoffset: 200;
            transition: stroke-dashoffset 0.5s ease-out;
        }
        .scene1-segment-an.drawn, .scene1-segment-bm.drawn {
            stroke-dashoffset: 0;
        }
        /* 淡入动画 */
        .scene1-fade-in {
            animation: scene1FadeIn 0.3s ease-out forwards;
        }
        @keyframes scene1FadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        /* 缩放动画 */
        .scene1-scale-in {
            animation: scene1ScaleIn 0.3s ease-out forwards;
        }
        @keyframes scene1ScaleIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 坐标轴组 -->
            <g id="scene1-axes-group">
                <!-- x 轴 -->
                <line id="scene1-x-axis" x1="50" y1="400" x2="550" y2="400" 
                      stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrow-x)"/>
                <!-- y 轴 -->
                <line id="scene1-y-axis" x1="150" y1="450" x2="150" y2="50" 
                      stroke="#000000" stroke-width="2" marker-end="url(#scene1-arrow-y)"/>
                <!-- 箭头定义 -->
                <defs>
                    <marker id="scene1-arrow-x" markerWidth="10" markerHeight="10" refX="9" refY="3" 
                            orient="auto" markerUnits="strokeWidth">
                        <path d="M0,0 L0,6 L9,3 z" fill="#000000"/>
                    </marker>
                    <marker id="scene1-arrow-y" markerWidth="10" markerHeight="10" refX="9" refY="3" 
                            orient="auto" markerUnits="strokeWidth">
                        <path d="M0,0 L0,6 L9,3 z" fill="#000000"/>
                    </marker>
                </defs>
                <!-- 原点 O -->
                <circle id="scene1-origin" cx="150" cy="400" r="3" fill="#000000"/>
                <text id="scene1-label-o" x="135" y="415" font-size="12px" fill="#000000">O</text>
                <!-- 轴标签 -->
                <text id="scene1-label-x" x="535" y="385" font-size="12px" fill="#000000">x</text>
                <text id="scene1-label-y" x="165" y="15" font-size="12px" fill="#000000">y</text>
            </g>

            <!-- 点组 -->
            <g id="scene1-points-group">
                <!-- 点 A -->
                <g id="scene1-point-a-group">
                    <circle id="scene1-point-a" cx="50" cy="80" r="5" fill="#000000"/>
                    <text id="scene1-label-a" x="40" y="70" font-size="12px" fill="#000000">A</text>
                </g>
                <!-- 点 B -->
                <g id="scene1-point-b-group">
                    <circle id="scene1-point-b" cx="350" cy="320" r="5" fill="#000000"/>
                    <text id="scene1-label-b" x="360" y="310" font-size="12px" fill="#000000">B</text>
                </g>
                <!-- 点 M -->
                <g id="scene1-point-m-group" class="scene1-hidden">
                    <circle id="scene1-point-m" cx="450" cy="400" r="5" fill="#1565c0"/>
                    <text id="scene1-label-m" x="460" y="415" font-size="12px" fill="#1565c0">M</text>
                </g>
                <!-- 点 N -->
                <g id="scene1-point-n-group" class="scene1-hidden">
                    <circle id="scene1-point-n" cx="150" cy="160" r="5" fill="#1565c0"/>
                    <text id="scene1-label-n" x="160" y="150" font-size="12px" fill="#1565c0">N</text>
                </g>
            </g>

            <!-- 线组 -->
            <g id="scene1-lines-group">
                <!-- 直线 AB（延长线） -->
                <line id="scene1-line-ab" x1="0" y1="450" x2="600" y2="-50" 
                      stroke="#000000" stroke-width="1.5" class="scene1-hidden"/>
                <!-- 线段 AN（蓝色加粗） -->
                <line id="scene1-segment-an" x1="50" y1="80" x2="150" y2="160" 
                      stroke="#1565c0" stroke-width="4" class="scene1-segment-an scene1-hidden"/>
                <!-- 线段 BM（绿色加粗） -->
                <line id="scene1-segment-bm" x1="350" y1="320" x2="450" y2="400" 
                      stroke="#2e7d32" stroke-width="4" class="scene1-segment-bm scene1-hidden"/>
            </g>

            <!-- 坐标值标签组 -->
            <g id="scene1-coords-group" class="scene1-hidden">
                <text id="scene1-coord-a" x="40" y="55" font-size="11px" fill="#555555">(-1,4)</text>
                <text id="scene1-coord-b" x="360" y="295" font-size="11px" fill="#555555">(2,1)</text>
                <text id="scene1-coord-m" x="460" y="430" font-size="11px" fill="#555555">(3,0)</text>
                <text id="scene1-coord-n" x="160" y="135" font-size="11px" fill="#555555">(0,3)</text>
            </g>

            <!-- 控件栏 -->
            <g id="scene1-controls-group">
                <!-- 背景条 -->
                <rect x="0" y="455" width="800" height="40" fill="#f5f5f5" opacity="0.8"/>
                <!-- 上一步按钮 -->
                <foreignObject x="280" y="465" width="80" height="30">
                    <button id="scene1-btn-prev" class="scene1-btn scene1-btn-prev" disabled>◀ 上一步</button>
                </foreignObject>
                <!-- 步骤指示器 -->
                <text id="scene1-step-indicator" x="400" y="488" font-size="14px" fill="#000000" text-anchor="middle">步骤 1/5</text>
                <!-- 下一步按钮 -->
                <foreignObject x="440" y="465" width="80" height="30">
                    <button id="scene1-btn-next" class="scene1-btn scene1-btn-next">下一步 ▶</button>
                </foreignObject>
            </g>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        // 布局坐标表（数学坐标 → 像素坐标）：
        // px = 150 + x * 100, py = 400 - y * 80
        // A(-1,4) → (50,80), B(2,1) → (350,320), M(3,0) → (450,400), N(0,3) → (150,160)

        let currentStep = 0;
        const totalSteps = 5;

        // 获取 DOM 元素
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');

        // 元素引用
        const lineAb = document.getElementById('scene1-line-ab');
        const pointMGroup = document.getElementById('scene1-point-m-group');
        const pointNGroup = document.getElementById('scene1-point-n-group');
        const segmentAn = document.getElementById('scene1-segment-an');
        const segmentBm = document.getElementById('scene1-segment-bm');
        const coordsGroup = document.getElementById('scene1-coords-group');

        // 显示/隐藏工具函数
        function show(el) {
            el.classList.remove('scene1-hidden');
            el.classList.add('scene1-visible');
            el.style.display = '';
            el.style.opacity = '1';
        }

        function hide(el) {
            el.classList.remove('scene1-visible');
            el.classList.add('scene1-hidden');
            el.style.display = 'none';
            el.style.opacity = '0';
        }

        // 更新场景状态
        function updateScene() {
            // 更新步骤指示器
            stepIndicator.textContent = `步骤 ${currentStep + 1}/${totalSteps}`;

            // 更新按钮状态
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps - 1;

            // 根据步骤显示/隐藏元素
            switch (currentStep) {
                case 0:
                    // 初始状态：只显示坐标系和点 A、B
                    hide(lineAb);
                    hide(pointMGroup);
                    hide(pointNGroup);
                    hide(segmentAn);
                    hide(segmentBm);
                    hide(coordsGroup);
                    break;

                case 1:
                    // 显示直线 AB
                    show(lineAb);
                    lineAb.classList.add('scene1-fade-in');
                    hide(pointMGroup);
                    hide(pointNGroup);
                    hide(segmentAn);
                    hide(segmentBm);
                    hide(coordsGroup);
                    break;

                case 2:
                    // 显示点 M、N
                    show(lineAb);
                    show(pointMGroup);
                    show(pointNGroup);
                    pointMGroup.classList.add('scene1-scale-in');
                    pointNGroup.classList.add('scene1-scale-in');
                    hide(segmentAn);
                    hide(segmentBm);
                    hide(coordsGroup);
                    break;

                case 3:
                    // 显示线段 AN、BM
                    show(lineAb);
                    show(pointMGroup);
                    show(pointNGroup);
                    show(segmentAn);
                    show(segmentBm);
                    // 触发动画
                    setTimeout(() => {
                        segmentAn.classList.add('scene1-segment-an', 'drawn');
                        segmentBm.classList.add('scene1-segment-bm', 'drawn');
                    }, 50);
                    hide(coordsGroup);
                    break;

                case 4:
                    // 显示所有坐标值
                    show(lineAb);
                    show(pointMGroup);
                    show(pointNGroup);
                    show(segmentAn);
                    show(segmentBm);
                    segmentAn.classList.add('drawn');
                    segmentBm.classList.add('drawn');
                    show(coordsGroup);
                    coordsGroup.classList.add('scene1-fade-in');
                    break;
            }
        }

        // 按钮事件绑定
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateScene();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateScene();
            }
        });

        // 初始化
        updateScene();
    })();
    </script>
</body>
</html>
