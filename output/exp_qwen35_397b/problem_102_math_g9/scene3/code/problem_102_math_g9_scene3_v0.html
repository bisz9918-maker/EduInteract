<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>根的分布条件——端点函数值符号分析</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-svg { width: 800px; height: 500px; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene3-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border: none; border-radius: 4px; }
        .scene3-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene3-btn-prev { background: #e0e0e0; color: #333; }
        #scene3-btn-next { background: #1565c0; color: #fff; }
        #scene3-step-indicator { font-size: 14px; color: #666; margin: 0 10px; }
        .scene3-hidden { opacity: 0; }
        .scene3-visible { opacity: 1; transition: opacity 300ms; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg id="scene3-svg" width="800" height="500">
            <!-- 标题 -->
            <text id="scene3-title" x="400" y="25" text-anchor="middle" font-size="16" font-weight="bold">根的分布条件——端点函数值符号分析</text>
            
            <!-- 坐标系 -->
            <g id="scene3-coord-system">
                <!-- x 轴 -->
                <line x1="50" y1="250" x2="750" y2="250" stroke="#000000" stroke-width="2"/>
                <!-- y 轴 -->
                <line x1="400" y1="50" x2="400" y2="320" stroke="#000000" stroke-width="2"/>
                <!-- 箭头 -->
                <polygon points="750,250 740,245 740,255" fill="#000000"/>
                <polygon points="400,50 395,60 405,60" fill="#000000"/>
                <!-- 轴标签 -->
                <text x="760" y="255" font-size="14">x</text>
                <text x="410" y="45" font-size="14">y</text>
                <text x="385" y="270" font-size="14">O</text>
            </g>
            
            <!-- 函数曲线 (b=2 示例) -->
            <path id="scene3-func-curve" d="" stroke="#1565c0" stroke-width="2" fill="none"/>
            
            <!-- x 轴关键点 -->
            <circle id="scene3-point-x1" cx="225" cy="250" r="4" fill="#000000"/>
            <circle id="scene3-point-x0" cx="400" cy="250" r="4" fill="#000000"/>
            <circle id="scene3-point-x2" cx="575" cy="250" r="4" fill="#000000"/>
            <circle id="scene3-point-x3" cx="662" cy="250" r="4" fill="#000000"/>
            
            <!-- x 标签 -->
            <text id="scene3-label-x1" x="225" y="270" text-anchor="middle" font-size="12">-1</text>
            <text id="scene3-label-x0" x="400" y="270" text-anchor="middle" font-size="12">0</text>
            <text id="scene3-label-x2" x="575" y="270" text-anchor="middle" font-size="12">2</text>
            <text id="scene3-label-x3" x="662" y="270" text-anchor="middle" font-size="12">3</text>
            
            <!-- 辅助虚线 -->
            <line id="scene3-dash-1" x1="225" y1="250" x2="225" y2="200" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" class="scene3-hidden"/>
            <line id="scene3-dash-2" x1="400" y1="250" x2="400" y2="280" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" class="scene3-hidden"/>
            <line id="scene3-dash-3" x1="575" y1="250" x2="575" y2="200" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" class="scene3-hidden"/>
            <line id="scene3-dash-4" x1="662" y1="250" x2="662" y2="180" stroke="#888888" stroke-width="1" stroke-dasharray="4,4" class="scene3-hidden"/>
            
            <!-- 函数值标签 -->
            <text id="scene3-label-f1" x="225" y="190" text-anchor="middle" font-size="12" class="scene3-hidden">f(-1)</text>
            <text id="scene3-label-f0" x="400" y="300" text-anchor="middle" font-size="12" class="scene3-hidden">f(0)</text>
            <text id="scene3-label-f2" x="575" y="190" text-anchor="middle" font-size="12" class="scene3-hidden">f(2)</text>
            <text id="scene3-label-f3" x="662" y="170" text-anchor="middle" font-size="12" class="scene3-hidden">f(3)</text>
            
            <!-- 函数值表达式标签 -->
            <text id="scene3-label-f1-expr" x="225" y="175" text-anchor="middle" font-size="11" fill="#2e7d32" class="scene3-hidden">b-1</text>
            <text id="scene3-label-f0-expr" x="400" y="315" text-anchor="middle" font-size="11" fill="#c62828" class="scene3-hidden">-1</text>
            <text id="scene3-label-f2-expr" x="575" y="175" text-anchor="middle" font-size="11" fill="#2e7d32" class="scene3-hidden">5-2b</text>
            <text id="scene3-label-f3-expr" x="662" y="155" text-anchor="middle" font-size="11" fill="#2e7d32" class="scene3-hidden">11-3b</text>
            
            <!-- 推导区背景 -->
            <rect id="scene3-derive-bg" x="50" y="340" width="700" height="90" fill="#f5f5f5" stroke="#e0e0e0"/>
            
            <!-- 推导步骤文本 -->
            <text id="scene3-derive-text" x="70" y="365" font-size="13" class="scene3-hidden"></text>
            <text id="scene3-derive-text2" x="70" y="390" font-size="13" class="scene3-hidden"></text>
            
            <!-- 答案框 -->
            <rect id="scene3-answer-box" x="250" y="400" width="300" height="30" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" class="scene3-hidden"/>
            <text id="scene3-answer-text" x="400" y="422" text-anchor="middle" font-size="14" font-weight="bold" class="scene3-hidden"></text>
            
            <!-- 控件栏 -->
            <g id="scene3-controls">
                <rect x="250" y="450" width="300" height="40" fill="none"/>
                <button id="scene3-btn-prev" class="scene3-btn" x="280" y="455">◀ 上一步</button>
                <text id="scene3-step-indicator" x="400" y="475" text-anchor="middle" font-size="14">步骤 0/5</text>
                <button id="scene3-btn-next" class="scene3-btn" x="440" y="455">下一步 ▶</button>
            </g>
        </svg>
    </div>
    
    <script>
    (function() {
        // Scene 3 实现
        const currentState = { value: 0 };
        const TOTAL_STEPS = 5;
        
        // 坐标转换函数：数学坐标 -> SVG 坐标
        // 原点 (0,0) -> (400, 250), 比例尺 87.5px/单位
        function toSvgX(x) { return 400 + x * 87.5; }
        function toSvgY(y) { return 250 - y * 45; }
        
        // 计算函数 f(x) = x² - (b-1)x - 1 在给定 b 值时的 SVG 路径
        function computeCurvePath(b) {
            let path = "";
            for (let x = -2; x <= 4; x += 0.1) {
                const y = x * x - (b - 1) * x - 1;
                const svgX = toSvgX(x);
                const svgY = toSvgY(y);
                if (path === "") {
                    path += `M ${svgX} ${svgY}`;
                } else {
                    path += ` L ${svgX} ${svgY}`;
                }
            }
            return path;
        }
        
        // 计算 f(x) 值
        function f(x, b) {
            return x * x - (b - 1) * x - 1;
        }
        
        // 显示/隐藏元素
        function show(el) {
            if (el) {
                el.classList.remove('scene3-hidden');
                el.classList.add('scene3-visible');
            }
        }
        
        function hide(el) {
            if (el) {
                el.classList.remove('scene3-visible');
                el.classList.add('scene3-hidden');
            }
        }
        
        // 更新状态
        function updateState(step) {
            currentState.value = step;
            
            // 更新步骤指示器
            document.getElementById('scene3-step-indicator').textContent = `步骤 ${step}/${TOTAL_STEPS}`;
            
            // 更新按钮状态
            document.getElementById('scene3-btn-prev').disabled = (step === 0);
            document.getElementById('scene3-btn-next').disabled = (step === TOTAL_STEPS);
            
            // 根据步骤显示/隐藏元素
            const dash1 = document.getElementById('scene3-dash-1');
            const dash2 = document.getElementById('scene3-dash-2');
            const dash3 = document.getElementById('scene3-dash-3');
            const dash4 = document.getElementById('scene3-dash-4');
            
            const labelF1 = document.getElementById('scene3-label-f1');
            const labelF0 = document.getElementById('scene3-label-f0');
            const labelF2 = document.getElementById('scene3-label-f2');
            const labelF3 = document.getElementById('scene3-label-f3');
            
            const labelF1Expr = document.getElementById('scene3-label-f1-expr');
            const labelF0Expr = document.getElementById('scene3-label-f0-expr');
            const labelF2Expr = document.getElementById('scene3-label-f2-expr');
            const labelF3Expr = document.getElementById('scene3-label-f3-expr');
            
            const deriveText = document.getElementById('scene3-derive-text');
            const deriveText2 = document.getElementById('scene3-derive-text2');
            
            const answerBox = document.getElementById('scene3-answer-box');
            const answerText = document.getElementById('scene3-answer-text');
            
            // 步骤 0: 只显示基础图形
            // 步骤 1: 显示虚线
            // 步骤 2: 显示函数值标签和表达式
            // 步骤 3: 显示根的分布条件
            // 步骤 4: 显示计算过程
            // 步骤 5: 显示答案
            
            if (step >= 1) {
                show(dash1); show(dash2); show(dash3); show(dash4);
            } else {
                hide(dash1); hide(dash2); hide(dash3); hide(dash4);
            }
            
            if (step >= 2) {
                show(labelF1); show(labelF0); show(labelF2); show(labelF3);
                show(labelF1Expr); show(labelF0Expr); show(labelF2Expr); show(labelF3Expr);
            } else {
                hide(labelF1); hide(labelF0); hide(labelF2); hide(labelF3);
                hide(labelF1Expr); hide(labelF0Expr); hide(labelF2Expr); hide(labelF3Expr);
            }
            
            if (step >= 3) {
                deriveText.textContent = "根的分布条件：f(-1)·f(0) ≤ 0 且 f(2)·f(3) ≤ 0";
                show(deriveText);
            } else {
                hide(deriveText);
            }
            
            if (step >= 4) {
                deriveText.textContent = "根的分布条件：f(-1)·f(0) ≤ 0 且 f(2)·f(3) ≤ 0";
                deriveText2.textContent = "代入得：(b-1)·(-1) ≤ 0 → b ≥ 1；(5-2b)·(11-3b) ≤ 0 → 5/2 ≤ b ≤ 11/3";
                show(deriveText);
                show(deriveText2);
            } else {
                hide(deriveText2);
            }
            
            if (step >= 5) {
                show(answerBox);
                answerText.textContent = "5/2 ≤ b ≤ 11/3";
                show(answerText);
            } else {
                hide(answerBox);
                hide(answerText);
            }
        }
        
        // 初始化
        function init() {
            // 绘制初始曲线 (b=2)
            const curve = document.getElementById('scene3-func-curve');
            curve.setAttribute('d', computeCurvePath(2));
            
            // 绑定按钮事件
            document.getElementById('scene3-btn-prev').addEventListener('click', function() {
                if (currentState.value > 0) {
                    updateState(currentState.value - 1);
                }
            });
            
            document.getElementById('scene3-btn-next').addEventListener('click', function() {
                if (currentState.value < TOTAL_STEPS) {
                    updateState(currentState.value + 1);
                }
            });
            
            // 初始状态
            updateState(0);
        }
        
        init();
    })();
    </script>
</body>
</html>
