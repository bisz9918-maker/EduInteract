<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正方形序列图示</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-svg { width: 800px; height: 500px; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene1-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #333; border-radius: 4px; background: #f0f0f0; }
        .scene1-btn:hover { background: #e0e0e0; }
        .scene1-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene1-step-indicator { font-size: 14px; color: #333; }
        /* 元素显隐控制 */
        .scene1-hidden { display: none; opacity: 0; }
        .scene1-visible { display: block; opacity: 1; }
        .scene1-visible-path { display: block; opacity: 1; }
        .scene1-hidden-path { display: none; opacity: 0; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义箭头 marker -->
            <defs>
                <marker id="scene1-arrow-x" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#333" />
                </marker>
                <marker id="scene1-arrow-y" markerWidth="10" markerHeight="10" refX="3" refY="9" orient="auto">
                    <path d="M0,0 L6,0 L3,9 z" fill="#333" />
                </marker>
                <marker id="scene1-parallel-arrow" markerWidth="12" markerHeight="8" refX="6" refY="4" orient="auto">
                    <path d="M0,0 L12,4 L0,8 z" fill="#c62828" />
                </marker>
            </defs>

            <!-- 坐标轴 -->
            <line id="scene1-xaxis" x1="70" y1="430" x2="760" y2="430" stroke="#333" stroke-width="2" marker-end="url(#scene1-arrow-x)" />
            <line id="scene1-yaxis" x1="70" y1="430" x2="70" y2="40" stroke="#333" stroke-width="2" marker-end="url(#scene1-arrow-y)" />

            <!-- 坐标轴标签 -->
            <text id="scene1-label-o" x="55" y="450" font-size="16" fill="#333">O</text>
            <text id="scene1-label-x" x="755" y="425" font-size="16" fill="#333">x</text>
            <text id="scene1-label-y" x="55" y="35" font-size="16" fill="#333">y</text>

            <!-- 正方形1 A₁B₁C₁D₁ -->
            <polygon id="scene1-square1" class="scene1-hidden-path" points="70,280 175,430 220,395 115,245" fill="#cccccc33" stroke="#000" stroke-width="1.5" />
            
            <!-- 正方形2 A₂B₂C₂D₂ -->
            <polygon id="scene1-square2" class="scene1-hidden-path" points="305,395 365,430 395,380 335,345" fill="#cccccc33" stroke="#000" stroke-width="1.5" />
            
            <!-- 正方形3 A₃B₃C₃D₃ -->
            <polygon id="scene1-square3" class="scene1-hidden-path" points="485,415 525,430 545,400 505,385" fill="#cccccc33" stroke="#000" stroke-width="1.5" />

            <!-- 小正方形1 D₁E₁E₂B₂ -->
            <rect id="scene1-rect1" class="scene1-hidden-path" x="220" y="395" width="85" height="35" fill="#e0e0e033" stroke="#000" stroke-width="1.5" />
            
            <!-- 小正方形2 D₂E₃E₄B₃ -->
            <rect id="scene1-rect2" class="scene1-hidden-path" x="395" y="380" width="90" height="50" fill="#e0e0e033" stroke="#000" stroke-width="1.5" />

            <!-- 角度弧线 ∠C₁B₁O -->
            <path id="scene1-angle-arc" class="scene1-hidden-path" d="M 70,305 A 25,25 0 0,1 88,290" fill="none" stroke="#1565c0" stroke-width="2" />
            <text id="scene1-angle-label" class="scene1-hidden" x="85" y="295" font-size="14" fill="#1565c0">30°</text>

            <!-- 平行箭头 -->
            <!-- B₁C₁ 中点附近，方向从 B₁ 到 C₁ -->
            <line id="scene1-parallel1" class="scene1-hidden-path" x1="115" y1="345" x2="135" y2="370" stroke="#c62828" stroke-width="3" marker-end="url(#scene1-parallel-arrow)" />
            <!-- B₂C₂ 中点附近 -->
            <line id="scene1-parallel2" class="scene1-hidden-path" x1="330" y1="405" x2="345" y2="420" stroke="#c62828" stroke-width="2.5" marker-end="url(#scene1-parallel-arrow)" />
            <!-- B₃C₃ 中点附近 -->
            <line id="scene1-parallel3" class="scene1-hidden-path" x1="500" y1="420" x2="512" y2="428" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-parallel-arrow)" />

            <!-- 顶点标签 -->
            <text id="scene1-label-a1" class="scene1-hidden" x="115" y="230" font-size="16" fill="#333">A₁</text>
            <text id="scene1-label-b1" class="scene1-hidden" x="50" y="275" font-size="16" fill="#333">B₁</text>
            <text id="scene1-label-c1" class="scene1-hidden" x="175" y="450" font-size="16" fill="#333">C₁</text>
            <text id="scene1-label-d1" class="scene1-hidden" x="225" y="385" font-size="16" fill="#333">D₁</text>
            
            <text id="scene1-label-a2" class="scene1-hidden" x="335" y="330" font-size="14" fill="#333">A₂</text>
            <text id="scene1-label-b2" class="scene1-hidden" x="295" y="380" font-size="14" fill="#333">B₂</text>
            <text id="scene1-label-c2" class="scene1-hidden" x="365" y="450" font-size="14" fill="#333">C₂</text>
            <text id="scene1-label-d2" class="scene1-hidden" x="400" y="370" font-size="14" fill="#333">D₂</text>
            
            <text id="scene1-label-a3" class="scene1-hidden" x="505" y="370" font-size="12" fill="#333">A₃</text>
            <text id="scene1-label-b3" class="scene1-hidden" x="475" y="400" font-size="12" fill="#333">B₃</text>
            <text id="scene1-label-c3" class="scene1-hidden" x="525" y="450" font-size="12" fill="#333">C₃</text>
            
            <text id="scene1-label-e1" class="scene1-hidden" x="215" y="450" font-size="12" fill="#333">E₁</text>
            <text id="scene1-label-e2" class="scene1-hidden" x="300" y="450" font-size="12" fill="#333">E₂</text>
            <text id="scene1-label-e3" class="scene1-hidden" x="390" y="450" font-size="12" fill="#333">E₃</text>
            <text id="scene1-label-e4" class="scene1-hidden" x="480" y="450" font-size="12" fill="#333">E₄</text>

            <!-- x 轴上的点标记（步骤 4 显示） -->
            <circle id="scene1-point-c1" class="scene1-hidden-path" cx="175" cy="430" r="4" fill="#1565c0" />
            <circle id="scene1-point-e1" class="scene1-hidden-path" cx="220" cy="430" r="4" fill="#1565c0" />
            <circle id="scene1-point-e2" class="scene1-hidden-path" cx="305" cy="430" r="4" fill="#1565c0" />
            <circle id="scene1-point-c2" class="scene1-hidden-path" cx="365" cy="430" r="4" fill="#1565c0" />
            <circle id="scene1-point-e3" class="scene1-hidden-path" cx="395" cy="430" r="4" fill="#1565c0" />
            <circle id="scene1-point-e4" class="scene1-hidden-path" cx="485" cy="430" r="4" fill="#1565c0" />
            <circle id="scene1-point-c3" class="scene1-hidden-path" cx="525" cy="430" r="4" fill="#1565c0" />

            <!-- 控件栏 -->
            <g id="scene1-controls-group">
                <rect x="310" y="455" width="200" height="35" fill="#f5f5f5" stroke="#ddd" rx="4" />
                <text id="scene1-step-indicator" x="410" y="445" font-size="14" fill="#333" text-anchor="middle">步骤 1/5</text>
            </g>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn" disabled>◀ 上一步</button>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        // 布局坐标表参考：
        // 画布尺寸：800×500px
        // x轴：(70,430)-(760,430)，y轴：(70,430)-(70,40)
        // 正方形1：B₁(70,280), C₁(175,430), D₁(220,395), A₁(115,245)
        // 正方形2：B₂(305,395), C₂(365,430), D₂(395,380), A₂(335,345)
        // 正方形3：B₃(485,415), C₃(525,430), D₃(545,400), A₃(505,385)
        // 小正方形1：D₁(220,395), E₁(220,430), E₂(305,430), B₂(305,395)
        // 小正方形2：D₂(395,380), E₃(395,430), E₄(485,430), B₃(485,380)

        let currentStep = 0;
        const totalSteps = 5;

        // 工具函数：显示元素
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                if (el.tagName === 'text') {
                    el.classList.remove('scene1-hidden');
                    el.classList.add('scene1-visible');
                } else {
                    el.classList.remove('scene1-hidden-path');
                    el.classList.add('scene1-visible-path');
                }
            }
        }

        // 工具函数：隐藏元素
        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                if (el.tagName === 'text') {
                    el.classList.remove('scene1-visible');
                    el.classList.add('scene1-hidden');
                } else {
                    el.classList.remove('scene1-visible-path');
                    el.classList.add('scene1-hidden-path');
                }
            }
        }

        // 更新步骤显示
        function updateStepDisplay() {
            // 步骤 0：仅坐标系
            // 步骤 1：正方形 1 + 角度标注
            // 步骤 2：完整正方形序列
            // 步骤 3：平行关系高亮
            // 步骤 4：x 轴上的点高亮

            const step1Elements = [
                'scene1-square1', 'scene1-label-a1', 'scene1-label-b1', 'scene1-label-c1', 'scene1-label-d1',
                'scene1-angle-arc', 'scene1-angle-label'
            ];
            const step2Elements = [
                'scene1-square2', 'scene1-square3', 'scene1-rect1', 'scene1-rect2',
                'scene1-label-a2', 'scene1-label-b2', 'scene1-label-c2', 'scene1-label-d2',
                'scene1-label-a3', 'scene1-label-b3', 'scene1-label-c3',
                'scene1-label-e1', 'scene1-label-e2', 'scene1-label-e3', 'scene1-label-e4'
            ];
            const step3Elements = ['scene1-parallel1', 'scene1-parallel2', 'scene1-parallel3'];
            const step4Elements = [
                'scene1-point-c1', 'scene1-point-e1', 'scene1-point-e2', 'scene1-point-c2',
                'scene1-point-e3', 'scene1-point-e4', 'scene1-point-c3'
            ];

            // 根据当前步骤显示/隐藏元素
            if (currentStep >= 1) {
                step1Elements.forEach(id => showElement(id));
            } else {
                step1Elements.forEach(id => hideElement(id));
            }

            if (currentStep >= 2) {
                step2Elements.forEach(id => showElement(id));
            } else {
                step2Elements.forEach(id => hideElement(id));
            }

            if (currentStep >= 3) {
                step3Elements.forEach(id => showElement(id));
            } else {
                step3Elements.forEach(id => hideElement(id));
            }

            if (currentStep >= 4) {
                step4Elements.forEach(id => showElement(id));
            } else {
                step4Elements.forEach(id => hideElement(id));
            }

            // 更新步骤指示器
            document.getElementById('scene1-step-indicator').textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;

            // 更新按钮状态
            document.getElementById('scene1-btn-prev').disabled = (currentStep === 0);
            document.getElementById('scene1-btn-next').disabled = (currentStep === totalSteps - 1);
        }

        // 按钮事件绑定
        document.getElementById('scene1-btn-prev').addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStepDisplay();
            }
        });

        document.getElementById('scene1-btn-next').addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateStepDisplay();
            }
        });

        // 初始化
        updateStepDisplay();
    })();
    </script>
</body>
</html>
