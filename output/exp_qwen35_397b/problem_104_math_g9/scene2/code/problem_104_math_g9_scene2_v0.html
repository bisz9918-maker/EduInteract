<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正方形递推关系推导</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene2-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene2-svg {
            width: 800px;
            height: 500px;
        }
        #scene2-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 12px;
            z-index: 10;
        }
        .scene2-btn {
            padding: 8px 20px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        #scene2-btn-prev {
            background: #9e9e9e;
            color: white;
        }
        #scene2-btn-prev:hover {
            background: #757575;
        }
        #scene2-btn-prev:disabled {
            background: #bdbdbd;
            cursor: not-allowed;
        }
        #scene2-btn-next {
            background: #1565c0;
            color: white;
        }
        #scene2-btn-next:hover {
            background: #0d47a1;
        }
        #scene2-btn-next:disabled {
            background: #90caf9;
            cursor: not-allowed;
        }
        #scene2-step-indicator {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            color: #333;
        }
        .scene2-element {
            transition: opacity 0.3s ease;
        }
        .scene2-hidden {
            opacity: 0;
            display: none;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500">
            <!-- 坐标轴 -->
            <defs>
                <marker id="scene2-arrow-x" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#000"/>
                </marker>
                <marker id="scene2-arrow-y" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#000"/>
                </marker>
            </defs>
            
            <!-- x轴 -->
            <line id="scene2-x-axis" x1="50" y1="400" x2="750" y2="400" stroke="#000" stroke-width="2" marker-end="url(#scene2-arrow-x)"/>
            <!-- y轴 -->
            <line id="scene2-y-axis" x1="50" y1="400" x2="50" y2="50" stroke="#000" stroke-width="2" marker-end="url(#scene2-arrow-y)"/>
            <!-- 原点标签 -->
            <text id="scene2-label-o" x="35" y="415" font-size="14" fill="#000">O</text>
            <!-- x轴标签 -->
            <text id="scene2-label-x" x="735" y="395" font-size="14" fill="#000">x</text>
            <!-- y轴标签 -->
            <text id="scene2-label-y" x="35" y="60" font-size="14" fill="#000">y</text>
            
            <!-- 正方形1 A₁B₁C₁D₁ -->
            <polygon id="scene2-square1" class="scene2-element" 
                points="50,280 136,220 222,340 136,400" 
                fill="#1565c0" fill-opacity="0.2" 
                stroke="#000" stroke-width="2"/>
            
            <!-- 小正方形 D₁E₁E₂B₂ -->
            <polygon id="scene2-small-square" class="scene2-element scene2-hidden"
                points="222,340 222,400 282,400 282,340" 
                fill="#e0e0e0" fill-opacity="0.3" 
                stroke="#000" stroke-width="2"/>
            
            <!-- 正方形2 A₂B₂C₂D₂ -->
            <polygon id="scene2-square2" class="scene2-element scene2-hidden"
                points="282,340 354,280 426,340 354,400" 
                fill="#1565c0" fill-opacity="0.2" 
                stroke="#000" stroke-width="2"/>
            
            <!-- 辅助线1 D₁到x轴垂线 -->
            <line id="scene2-aux-line1" class="scene2-element scene2-hidden"
                x1="222" y1="340" x2="222" y2="400" 
                stroke="#888" stroke-width="2" stroke-dasharray="5,5"/>
            
            <!-- 辅助线2 B₂到x轴垂线 -->
            <line id="scene2-aux-line2" class="scene2-element scene2-hidden"
                x1="282" y1="340" x2="282" y2="400" 
                stroke="#888" stroke-width="2" stroke-dasharray="5,5"/>
            
            <!-- 角度弧线 60° at C₁ -->
            <path id="scene2-angle-arc1" class="scene2-element scene2-hidden"
                d="M 136 400 L 150 385" 
                stroke="#c62828" stroke-width="2" fill="none"/>
            <text id="scene2-label-60deg1" class="scene2-element scene2-hidden" 
                x="150" y="385" font-size="14" fill="#c62828">60°</text>
            
            <!-- 角度弧线 60° at C₂ -->
            <path id="scene2-angle-arc2" class="scene2-element scene2-hidden"
                d="M 354 400 L 368 385" 
                stroke="#c62828" stroke-width="2" fill="none"/>
            <text id="scene2-label-60deg2" class="scene2-element scene2-hidden" 
                x="368" y="385" font-size="14" fill="#c62828">60°</text>
            
            <!-- 标签 A₁ -->
            <text id="scene2-label-a1" x="136" y="205" font-size="14" fill="#000" text-anchor="middle">A₁</text>
            <!-- 标签 B₁ -->
            <text id="scene2-label-b1" x="35" y="280" font-size="14" fill="#000" text-anchor="end">B₁</text>
            <!-- 标签 C₁ -->
            <text id="scene2-label-c1" x="136" y="420" font-size="14" fill="#000" text-anchor="middle">C₁</text>
            <!-- 标签 D₁ -->
            <text id="scene2-label-d1" x="222" y="325" font-size="14" fill="#000" text-anchor="middle">D₁</text>
            
            <!-- 标签 A₂ -->
            <text id="scene2-label-a2-point" x="354" y="265" font-size="14" fill="#000" text-anchor="middle" class="scene2-element scene2-hidden">A₂</text>
            <!-- 标签 B₂ -->
            <text id="scene2-label-b2" x="282" y="325" font-size="14" fill="#000" text-anchor="middle" class="scene2-element scene2-hidden">B₂</text>
            <!-- 标签 C₂ -->
            <text id="scene2-label-c2" x="354" y="420" font-size="14" fill="#000" text-anchor="middle" class="scene2-element scene2-hidden">C₂</text>
            <!-- 标签 E₁ -->
            <text id="scene2-label-e1" x="222" y="420" font-size="14" fill="#000" text-anchor="middle" class="scene2-element scene2-hidden">E₁</text>
            <!-- 标签 E₂ -->
            <text id="scene2-label-e2" x="282" y="420" font-size="14" fill="#000" text-anchor="middle" class="scene2-element scene2-hidden">E₂</text>
            
            <!-- 标签 a₁=1 -->
            <text id="scene2-label-a1-len" x="100" y="250" font-size="16" fill="#000">a₁=1</text>
            <!-- 标签 a₂ -->
            <text id="scene2-label-a2-len" x="320" y="310" font-size="16" fill="#c62828" font-weight="bold" class="scene2-element scene2-hidden">a₂</text>
            
            <!-- 推导公式框 -->
            <rect id="scene2-formula-box" class="scene2-element scene2-hidden"
                x="550" y="150" width="230" height="100" 
                fill="#fff" stroke="#2e7d32" stroke-width="2"/>
            <text id="scene2-formula-text" class="scene2-element scene2-hidden"
                x="665" y="190" font-size="16" fill="#2e7d32" text-anchor="middle">边长比:</text>
            <text id="scene2-formula-math" class="scene2-element scene2-hidden"
                x="665" y="220" font-size="18" fill="#2e7d32" text-anchor="middle">a₂/a₁ = √3/3</text>
            <text id="scene2-formula-q" class="scene2-element scene2-hidden"
                x="665" y="245" font-size="14" fill="#2e7d32" text-anchor="middle">公比 q = √3/3</text>
        </svg>
        
        <div id="scene2-controls">
            <button id="scene2-btn-prev" class="scene2-btn">◀ 上一步</button>
            <span id="scene2-step-indicator">步骤 0/5</span>
            <button id="scene2-btn-next" class="scene2-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2: 正方形递推关系推导
        // 布局坐标表:
        // | 元素 | 位置 |
        // | x轴 | (50,400)-(750,400) |
        // | y轴 | (50,400)-(50,50) |
        // | 正方形1 | B₁(50,280), C₁(136,400), D₁(222,340), A₁(136,220) |
        // | 小正方形 | D₁(222,340), E₁(222,400), E₂(282,400), B₂(282,340) |
        // | 正方形2 | B₂(282,340), C₂(354,400), D₂(426,340), A₂(354,280) |
        
        let currentStep = 0;
        const totalSteps = 5;
        
        // 每步可见元素配置
        const stepConfig = {
            0: {
                // 初始状态：坐标轴、正方形1、小正方形轮廓、标签A₁B₁C₁D₁E₁E₂、a₁=1
                show: ['scene2-square1', 'scene2-label-a1', 'scene2-label-b1', 'scene2-label-c1', 'scene2-label-d1', 'scene2-label-a1-len', 'scene2-label-e1', 'scene2-label-e2']
            },
            1: {
                // 步骤1：显示正方形2、标签A₂B₂C₂、a₂
                show: ['scene2-square1', 'scene2-label-a1', 'scene2-label-b1', 'scene2-label-c1', 'scene2-label-d1', 'scene2-label-a1-len', 'scene2-label-e1', 'scene2-label-e2',
                       'scene2-square2', 'scene2-label-a2-point', 'scene2-label-b2', 'scene2-label-c2', 'scene2-label-a2-len']
            },
            2: {
                // 步骤2：高亮小正方形
                show: ['scene2-square1', 'scene2-label-a1', 'scene2-label-b1', 'scene2-label-c1', 'scene2-label-d1', 'scene2-label-a1-len', 'scene2-label-e1', 'scene2-label-e2',
                       'scene2-square2', 'scene2-label-a2-point', 'scene2-label-b2', 'scene2-label-c2', 'scene2-label-a2-len',
                       'scene2-small-square']
            },
            3: {
                // 步骤3：添加辅助线
                show: ['scene2-square1', 'scene2-label-a1', 'scene2-label-b1', 'scene2-label-c1', 'scene2-label-d1', 'scene2-label-a1-len', 'scene2-label-e1', 'scene2-label-e2',
                       'scene2-square2', 'scene2-label-a2-point', 'scene2-label-b2', 'scene2-label-c2', 'scene2-label-a2-len',
                       'scene2-small-square',
                       'scene2-aux-line1', 'scene2-aux-line2']
            },
            4: {
                // 步骤4：添加角度标注
                show: ['scene2-square1', 'scene2-label-a1', 'scene2-label-b1', 'scene2-label-c1', 'scene2-label-d1', 'scene2-label-a1-len', 'scene2-label-e1', 'scene2-label-e2',
                       'scene2-square2', 'scene2-label-a2-point', 'scene2-label-b2', 'scene2-label-c2', 'scene2-label-a2-len',
                       'scene2-small-square',
                       'scene2-aux-line1', 'scene2-aux-line2',
                       'scene2-angle-arc1', 'scene2-label-60deg1', 'scene2-angle-arc2', 'scene2-label-60deg2']
            },
            5: {
                // 步骤5：显示推导公式
                show: ['scene2-square1', 'scene2-label-a1', 'scene2-label-b1', 'scene2-label-c1', 'scene2-label-d1', 'scene2-label-a1-len', 'scene2-label-e1', 'scene2-label-e2',
                       'scene2-square2', 'scene2-label-a2-point', 'scene2-label-b2', 'scene2-label-c2', 'scene2-label-a2-len',
                       'scene2-small-square',
                       'scene2-aux-line1', 'scene2-aux-line2',
                       'scene2-angle-arc1', 'scene2-label-60deg1', 'scene2-angle-arc2', 'scene2-label-60deg2',
                       'scene2-formula-box', 'scene2-formula-text', 'scene2-formula-math', 'scene2-formula-q']
            }
        };
        
        // 工具函数：显示元素
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene2-hidden');
                el.style.display = '';
                el.style.opacity = '1';
            }
        }
        
        // 工具函数：隐藏元素
        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.add('scene2-hidden');
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }
        
        // 更新步骤显示
        function updateStep(step) {
            const config = stepConfig[step];
            const allElements = [
                'scene2-square1', 'scene2-square2', 'scene2-small-square',
                'scene2-label-a1', 'scene2-label-b1', 'scene2-label-c1', 'scene2-label-d1',
                'scene2-label-a2-point', 'scene2-label-b2', 'scene2-label-c2',
                'scene2-label-e1', 'scene2-label-e2',
                'scene2-label-a1-len', 'scene2-label-a2-len',
                'scene2-aux-line1', 'scene2-aux-line2',
                'scene2-angle-arc1', 'scene2-label-60deg1', 'scene2-angle-arc2', 'scene2-label-60deg2',
                'scene2-formula-box', 'scene2-formula-text', 'scene2-formula-math', 'scene2-formula-q'
            ];
            
            // 先隐藏所有
            allElements.forEach(id => hideElement(id));
            
            // 显示当前步骤需要的元素
            config.show.forEach(id => showElement(id));
            
            // 更新步骤指示器
            document.getElementById('scene2-step-indicator').textContent = `步骤 ${step}/${totalSteps}`;
            
            // 更新按钮状态
            document.getElementById('scene2-btn-prev').disabled = (step === 0);
            document.getElementById('scene2-btn-next').disabled = (step === totalSteps);
            
            // 小正方形高亮处理
            const smallSquare = document.getElementById('scene2-small-square');
            if (step >= 2) {
                smallSquare.setAttribute('fill-opacity', '0.5');
            } else {
                smallSquare.setAttribute('fill-opacity', '0.3');
            }
        }
        
        // 下一步
        function stepForward() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateStep(currentStep);
            }
        }
        
        // 上一步
        function stepBack() {
            if (currentStep > 0) {
                currentStep--;
                updateStep(currentStep);
            }
        }
        
        // 绑定事件
        document.getElementById('scene2-btn-next').addEventListener('click', stepForward);
        document.getElementById('scene2-btn-prev').addEventListener('click', stepBack);
        
        // 初始化
        updateStep(0);
    })();
    </script>
</body>
</html>
