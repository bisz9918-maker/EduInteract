<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>几何题目图示 - Scene 1</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }
        #scene1-controls button {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #333;
            border-radius: 4px;
            background: #f5f5f5;
        }
        #scene1-controls button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #scene1-status {
            font-size: 14px;
            color: #333;
            min-width: 80px;
            text-align: center;
        }
        .scene1-line {
            stroke: #000;
            stroke-width: 2;
            fill: none;
        }
        .scene1-label {
            font-size: 14px;
            fill: #000;
        }
        .scene1-mark {
            stroke-width: 2;
            fill: none;
        }
        .scene1-angle-arc {
            stroke: #2e7d32;
            stroke-width: 2;
            fill: none;
        }
        .scene1-angle-text {
            font-size: 16px;
            fill: #2e7d32;
        }
        .scene1-right-angle {
            stroke: #000;
            stroke-width: 1.5;
            fill: none;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 线段组 -->
            <g id="scene1-lines">
                <line id="scene1-line-ab" class="scene1-line" x1="400" y1="120" x2="220" y2="380"/>
                <line id="scene1-line-ac" class="scene1-line" x1="400" y1="120" x2="580" y2="380"/>
                <line id="scene1-line-bc" class="scene1-line" x1="220" y1="380" x2="580" y2="380"/>
                <line id="scene1-line-ad" class="scene1-line" x1="400" y1="120" x2="520" y2="380"/>
                <line id="scene1-line-ae" class="scene1-line" x1="400" y1="120" x2="320" y2="380"/>
                <line id="scene1-line-af" class="scene1-line" x1="400" y1="120" x2="180" y2="220"/>
                <line id="scene1-line-bf" class="scene1-line" x1="220" y1="380" x2="180" y2="220"/>
                <line id="scene1-line-ef" class="scene1-line" x1="320" y1="380" x2="180" y2="220"/>
            </g>

            <!-- 等边标记组 -->
            <g id="scene1-marks-equal" style="display: none;">
                <!-- AB 中点单短线 (蓝色) -->
                <line id="scene1-mark-equal-ab" class="scene1-mark" stroke="#1565c0"
                      x1="306" y1="246" x2="314" y2="254"
                      transform="rotate(-55, 310, 250)"/>
                <!-- AC 中点单短线 (蓝色) -->
                <line id="scene1-mark-equal-ac" class="scene1-mark" stroke="#1565c0"
                      x1="486" y1="246" x2="494" y2="254"
                      transform="rotate(55, 490, 250)"/>
                <!-- AD 中点双短线 (红色) -->
                <line id="scene1-mark-equal-ad1" class="scene1-mark" stroke="#c62828"
                      x1="456" y1="246" x2="464" y2="254"
                      transform="rotate(-65, 460, 250)"/>
                <line id="scene1-mark-equal-ad2" class="scene1-mark" stroke="#c62828"
                      x1="458" y1="248" x2="466" y2="256"
                      transform="rotate(-65, 462, 252)"/>
                <!-- AF 中点双短线 (红色) -->
                <line id="scene1-mark-equal-af1" class="scene1-mark" stroke="#c62828"
                      x1="286" y1="166" x2="294" y2="174"
                      transform="rotate(65, 290, 170)"/>
                <line id="scene1-mark-equal-af2" class="scene1-mark" stroke="#c62828"
                      x1="288" y1="168" x2="296" y2="176"
                      transform="rotate(65, 292, 172)"/>
            </g>

            <!-- 直角符号组 -->
            <g id="scene1-right-angles" style="display: none;">
                <!-- ∠BAC 直角符号 (20x20) -->
                <path id="scene1-angle-bac" class="scene1-right-angle"
                      d="M 400 140 L 420 140 L 420 120"/>
                <!-- ∠DAF 直角符号 (16x16, 内层) -->
                <path id="scene1-angle-daf" class="scene1-right-angle"
                      d="M 400 136 L 416 136 L 416 120"/>
            </g>

            <!-- 角度弧线组 -->
            <g id="scene1-angle-arcs" style="display: none;">
                <!-- ∠DAE 绿色弧线 (半径 50) -->
                <path id="scene1-angle-dae" class="scene1-angle-arc"
                      d="M 443 148 A 50 50 0 0 0 365 155"/>
                <text id="scene1-angle-dae-text" class="scene1-angle-text" x="410" y="180">45°</text>
            </g>

            <!-- 角度数值组 -->
            <g id="scene1-angle-values" style="display: none;">
                <text id="scene1-angle-bac-text" class="scene1-label" x="420" y="150">90°</text>
            </g>

            <!-- 顶点标签组 -->
            <g id="scene1-labels">
                <text id="scene1-label-a" class="scene1-label" x="400" y="105" text-anchor="middle">A</text>
                <text id="scene1-label-b" class="scene1-label" x="220" y="405" text-anchor="middle">B</text>
                <text id="scene1-label-c" class="scene1-label" x="580" y="405" text-anchor="middle">C</text>
                <text id="scene1-label-d" class="scene1-label" x="520" y="405" text-anchor="middle">D</text>
                <text id="scene1-label-e" class="scene1-label" x="320" y="405" text-anchor="middle">E</text>
                <text id="scene1-label-f" class="scene1-label" x="160" y="220" text-anchor="end">F</text>
            </g>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" disabled>◀ 上一步</button>
            <span id="scene1-status">步骤 0/6</span>
            <button id="scene1-btn-next">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        // 布局坐标表参考：
        // A(400,120), B(220,380), C(580,380), D(520,380), E(320,380), F(180,220)
        // 标签：A(400,105), B(220,405), C(580,405), D(520,405), E(320,405), F(160,220)
        // 角度值：90°(420,150), 45°(410,180)

        let currentState = 0;
        const totalSteps = 6;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const statusEl = document.getElementById('scene1-status');

        // 元素引用
        const lineAB = document.getElementById('scene1-line-ab');
        const lineAC = document.getElementById('scene1-line-ac');
        const lineAD = document.getElementById('scene1-line-ad');
        const lineAF = document.getElementById('scene1-line-af');
        const marksEqual = document.getElementById('scene1-marks-equal');
        const rightAngles = document.getElementById('scene1-right-angles');
        const angleArcs = document.getElementById('scene1-angle-arcs');
        const angleValues = document.getElementById('scene1-angle-values');

        function updateDisplay() {
            // 重置所有高亮
            lineAB.style.stroke = '#000';
            lineAC.style.stroke = '#000';
            lineAD.style.stroke = '#000';
            lineAF.style.stroke = '#000';
            marksEqual.style.display = 'none';
            rightAngles.style.display = 'none';
            angleArcs.style.display = 'none';
            angleValues.style.display = 'none';

            // 根据当前状态显示相应元素
            if (currentState >= 1) {
                // 步骤 1：高亮 AB=AC
                lineAB.style.stroke = '#1565c0';
                lineAC.style.stroke = '#1565c0';
                marksEqual.style.display = 'block';
            }
            if (currentState >= 2) {
                // 步骤 2：高亮 AD=AF
                lineAD.style.stroke = '#c62828';
                lineAF.style.stroke = '#c62828';
            }
            if (currentState >= 3) {
                // 步骤 3：标注∠BAC=90°
                rightAngles.style.display = 'block';
                angleValues.style.display = 'block';
            }
            if (currentState >= 4) {
                // 步骤 4：标注∠DAF=90°（直角符号已显示）
            }
            if (currentState >= 5) {
                // 步骤 5：标注∠DAE=45°
                angleArcs.style.display = 'block';
            }
            if (currentState >= 6) {
                // 步骤 6：恢复线段为黑色，保留标记
                lineAB.style.stroke = '#000';
                lineAC.style.stroke = '#000';
                lineAD.style.stroke = '#000';
                lineAF.style.stroke = '#000';
            }

            // 更新状态文本
            statusEl.textContent = `步骤 ${currentState}/${totalSteps}`;

            // 更新按钮状态
            btnPrev.disabled = (currentState === 0);
            btnNext.disabled = (currentState === totalSteps);
        }

        function nextState() {
            if (currentState < totalSteps) {
                currentState++;
                updateDisplay();
            }
        }

        function prevState() {
            if (currentState > 0) {
                currentState--;
                updateDisplay();
            }
        }

        btnPrev.addEventListener('click', prevState);
        btnNext.addEventListener('click', nextState);

        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
