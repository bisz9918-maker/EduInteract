<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旋转变换与结论③④的几何解释</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-svg { width: 800px; height: 500px; }
        .scene3-btn { position: absolute; bottom: 15px; padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #333; border-radius: 4px; background: #f0f0f0; }
        #scene3-btn-prev { left: 280px; }
        #scene3-btn-next { left: 420px; }
        #scene3-step-indicator { position: absolute; bottom: 20px; left: 400px; transform: translateX(-50%); font-size: 14px; }
        .scene3-hidden { display: none; }
        .scene3-visible { display: block; }
        .scene3-bg { display: none; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg id="scene3-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 背景（隐藏） -->
            <rect class="scene3-bg" width="800" height="440" fill="#ffffff"/>
            
            <!-- △ACD 填充区域（步骤 1 显示） -->
            <path id="scene3-tri-acd-fill" class="scene3-hidden" d="M 400 100 L 580 350 L 500 350 Z" fill="#1565c0" opacity="0.2"/>
            
            <!-- △ABF 填充区域（步骤 2 后显示） -->
            <path id="scene3-tri-abf-fill" class="scene3-hidden" d="M 400 100 L 220 350 L 220 200 Z" fill="#2e7d32" opacity="0.2"/>
            
            <!-- △ABC 主三角形 -->
            <path id="scene3-tri-abc" d="M 400 100 L 220 350 L 580 350 Z" fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- △ADF 三角形 -->
            <path id="scene3-tri-adf" d="M 400 100 L 500 350 L 220 200 Z" fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 线段 AE -->
            <line id="scene3-line-ae" x1="400" y1="100" x2="340" y2="350" stroke="#000000" stroke-width="2"/>
            
            <!-- 线段 AF -->
            <line id="scene3-line-af" x1="400" y1="100" x2="220" y2="200" stroke="#000000" stroke-width="2"/>
            
            <!-- 线段 EF -->
            <line id="scene3-line-ef" x1="340" y1="350" x2="220" y2="200" stroke="#000000" stroke-width="2"/>
            
            <!-- 线段 BF -->
            <line id="scene3-line-bf" x1="220" y1="350" x2="220" y2="200" stroke="#000000" stroke-width="2"/>
            
            <!-- △BEF 三边（步骤 4 高亮） -->
            <line id="scene3-line-be-highlight" class="scene3-hidden" x1="220" y1="350" x2="340" y2="350" stroke="#1565c0" stroke-width="3"/>
            <line id="scene3-line-bf-highlight" class="scene3-hidden" x1="220" y1="350" x2="220" y2="200" stroke="#1565c0" stroke-width="3"/>
            <line id="scene3-line-ef-highlight" class="scene3-hidden" x1="340" y1="350" x2="220" y2="200" stroke="#1565c0" stroke-width="3"/>
            
            <!-- 旋转箭头（步骤 2 显示） -->
            <path id="scene3-rot-arrow" class="scene3-hidden" d="M 450 180 A 60 60 0 0 1 510 240" fill="none" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>
            
            <!-- 点 -->
            <circle id="scene3-point-a" cx="400" cy="100" r="4" fill="#000000"/>
            <circle id="scene3-point-b" cx="220" cy="350" r="4" fill="#000000"/>
            <circle id="scene3-point-c" cx="580" cy="350" r="4" fill="#000000"/>
            <circle id="scene3-point-d" cx="500" cy="350" r="4" fill="#000000"/>
            <circle id="scene3-point-e" cx="340" cy="350" r="4" fill="#000000"/>
            <circle id="scene3-point-f" cx="220" cy="200" r="4" fill="#000000"/>
            
            <!-- 标签 -->
            <text id="scene3-label-a" x="400" y="85" font-size="14" text-anchor="middle" fill="#000000">A</text>
            <text id="scene3-label-b" x="205" y="365" font-size="14" text-anchor="middle" fill="#000000">B</text>
            <text id="scene3-label-c" x="595" y="365" font-size="14" text-anchor="middle" fill="#000000">C</text>
            <text id="scene3-label-d" x="500" y="370" font-size="14" text-anchor="middle" fill="#000000">D</text>
            <text id="scene3-label-e" x="340" y="370" font-size="14" text-anchor="middle" fill="#000000">E</text>
            <text id="scene3-label-f" x="200" y="200" font-size="14" text-anchor="middle" fill="#000000">F</text>
            
            <!-- 直角符号∠BAC -->
            <path id="scene3-rightangle-bac" d="M 385 100 L 400 100 L 400 115" fill="none" stroke="#c62828" stroke-width="1.5"/>
            
            <!-- 直角符号∠DAF -->
            <path id="scene3-rightangle-daf" d="M 385 115 L 400 100 L 415 115" fill="none" stroke="#c62828" stroke-width="1.5"/>
            
            <!-- 直角符号∠EBF（步骤 4 显示） -->
            <path id="scene3-rightangle-ebf" class="scene3-hidden" d="M 235 335 L 220 350 L 235 350" fill="none" stroke="#c62828" stroke-width="1.5"/>
            
            <!-- BF=DC 标注（步骤 3 显示）- 移到左侧空白区域 -->
            <text id="scene3-label-bfdc" class="scene3-hidden" x="160" y="260" font-size="14" text-anchor="middle" fill="#c62828">BF=DC</text>
            
            <!-- DE=EF 标注（步骤 3 显示）- 移到右侧空白区域，远离填充三角形 -->
            <text id="scene3-label-deef" class="scene3-hidden" x="620" y="250" font-size="14" text-anchor="middle" fill="#c62828">DE=EF</text>
            
            <!-- ∠EBF=90°标注（步骤 4 显示）- 移到下方空白区域，远离结论公式 -->
            <text id="scene3-label-ebf90" class="scene3-hidden" x="280" y="370" font-size="14" text-anchor="middle" fill="#c62828">∠EBF=90°</text>
            
            <!-- 提示文字（步骤 1 显示） -->
            <text id="scene3-hint-text" class="scene3-hidden" x="400" y="50" font-size="14" text-anchor="middle" fill="#000000">将△ACD 绕 A 逆时针旋转 90°</text>
            
            <!-- 结论③公式（步骤 5 显示）- 向左下移动 -->
            <text id="scene3-formula-3" class="scene3-hidden" x="200" y="410" font-size="14" text-anchor="middle" fill="#000000">BE+DC&gt;DE</text>
            
            <!-- 结论④公式（步骤 6 显示） -->
            <text id="scene3-formula-4" class="scene3-hidden" x="550" y="410" font-size="14" text-anchor="middle" fill="#000000">BE²+DC²=DE²</text>
            
            <!-- 控件栏背景 -->
            <rect x="0" y="440" width="800" height="60" fill="#f5f5f5"/>
        </svg>
        
        <!-- 控件栏 -->
        <button id="scene3-btn-prev" class="scene3-btn">◀ 上一步</button>
        <button id="scene3-btn-next" class="scene3-btn">下一步 ▶</button>
        <div id="scene3-step-indicator">步骤 0/6</div>
    </div>
    
    <script>
    (function() {
        // Scene 3 实现：旋转变换与结论③④的几何解释
        
        // 布局坐标表（实现对照依据）：
        // | 元素 | 位置 | 备注 |
        // |------|------|------|
        // | A | (400,100) | 顶点 |
        // | B | (220,350) | 底边左端点 |
        // | C | (580,350) | 底边右端点 |
        // | D | (500,350) | BC 上点 |
        // | E | (340,350) | BC 上点 |
        // | F | (220,200) | 旋转后 D 的位置 |
        
        let currentState = 0;
        const totalSteps = 6;
        
        // 获取 DOM 元素
        const btnPrev = document.getElementById('scene3-btn-prev');
        const btnNext = document.getElementById('scene3-btn-next');
        const stepIndicator = document.getElementById('scene3-step-indicator');
        
        // 各步骤需要显示的元素
        const stepElements = {
            0: [], // 初始状态：只显示基础图形
            1: ['scene3-tri-acd-fill', 'scene3-hint-text'],
            2: ['scene3-rot-arrow', 'scene3-tri-abf-fill'],
            3: ['scene3-label-bfdc', 'scene3-label-deef'],
            4: ['scene3-rightangle-ebf', 'scene3-label-ebf90', 'scene3-line-be-highlight', 'scene3-line-bf-highlight', 'scene3-line-ef-highlight'],
            5: ['scene3-formula-3'],
            6: ['scene3-formula-4']
        };
        
        // 显示元素
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene3-hidden');
                el.classList.add('scene3-visible');
            }
        }
        
        // 隐藏元素
        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene3-visible');
                el.classList.add('scene3-hidden');
            }
        }
        
        // 渲染当前状态
        function renderState() {
            // 更新步骤指示器
            stepIndicator.textContent = '步骤 ' + currentState + '/' + totalSteps;
            
            // 更新按钮状态
            btnPrev.disabled = currentState === 0;
            btnNext.disabled = currentState === totalSteps;
            
            // 根据当前状态显示/隐藏元素
            for (let step = 1; step <= totalSteps; step++) {
                const elements = stepElements[step];
                for (let i = 0; i < elements.length; i++) {
                    if (step <= currentState) {
                        showElement(elements[i]);
                    } else {
                        hideElement(elements[i]);
                    }
                }
            }
        }
        
        // 上一步
        function stepBackward() {
            if (currentState > 0) {
                currentState--;
                renderState();
            }
        }
        
        // 下一步
        function stepForward() {
            if (currentState < totalSteps) {
                currentState++;
                renderState();
            }
        }
        
        // 绑定事件
        btnPrev.addEventListener('click', stepBackward);
        btnNext.addEventListener('click', stepForward);
        
        // 初始渲染
        renderState();
        
    })();
    </script>
</body>
</html>
