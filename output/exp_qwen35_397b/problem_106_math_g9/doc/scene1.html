<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圆内接等腰直角三角形与相似三角形关系</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }
        .scene1-btn {
            width: 100px;
            height: 35px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: opacity 0.2s;
        }
        #scene1-btn-prev {
            background: #e0e0e0;
        }
        #scene1-btn-prev:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #scene1-btn-next {
            background: #1565c0;
            color: white;
        }
        #scene1-btn-next:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #scene1-step-indicator {
            color: #333;
            font-size: 14px;
            min-width: 80px;
            text-align: center;
        }
        .scene1-step-element {
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .scene1-visible {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 圆⊙O -->
            <circle id="scene1-circle-o" cx="400" cy="260" r="150" fill="none" stroke="#000000" stroke-width="1.5"/>
            
            <!-- 直径AB -->
            <line id="scene1-line-ab" x1="250" y1="260" x2="550" y2="260" stroke="#000000" stroke-width="1.5"/>
            
            <!-- 等腰Rt△ABC的边AC和BC -->
            <line id="scene1-line-ac" x1="250" y1="260" x2="400" y2="110" stroke="#000000" stroke-width="1.5"/>
            <line id="scene1-line-bc" x1="550" y1="260" x2="400" y2="110" stroke="#000000" stroke-width="1.5"/>
            
            <!-- 线段BD -->
            <line id="scene1-line-bd" x1="550" y1="260" x2="295" y2="155" stroke="#000000" stroke-width="1.5"/>
            
            <!-- 线段AD -->
            <line id="scene1-line-ad" x1="250" y1="260" x2="295" y2="155" stroke="#000000" stroke-width="1.5"/>
            
            <!-- 点A, B, C, D, E, O -->
            <circle id="scene1-point-a" cx="250" cy="260" r="3" fill="#000000"/>
            <circle id="scene1-point-b" cx="550" cy="260" r="3" fill="#000000"/>
            <circle id="scene1-point-c" cx="400" cy="110" r="3" fill="#000000"/>
            <circle id="scene1-point-d" cx="295" cy="155" r="3" fill="#000000"/>
            <circle id="scene1-point-e" cx="340" cy="175" r="3" fill="#000000"/>
            <circle id="scene1-point-o" cx="400" cy="260" r="4" fill="#000000"/>
            
            <!-- 标签A, B, C, D, E, O -->
            <text id="scene1-label-a" x="235" y="280" font-size="14" fill="#000000" text-anchor="middle">A</text>
            <text id="scene1-label-b" x="565" y="280" font-size="14" fill="#000000" text-anchor="middle">B</text>
            <text id="scene1-label-c" x="400" y="95" font-size="14" fill="#000000" text-anchor="middle">C</text>
            <text id="scene1-label-d" x="280" y="140" font-size="14" fill="#000000" text-anchor="middle">D</text>
            <text id="scene1-label-e" x="355" y="165" font-size="14" fill="#000000" text-anchor="middle">E</text>
            <text id="scene1-label-o" x="400" y="280" font-size="14" fill="#000000" text-anchor="middle">O</text>
            
            <!-- 步骤1元素：已知条件标注 -->
            <g id="scene1-step1-group" class="scene1-step-element">
                <text id="scene1-label-bc4" x="490" y="190" font-size="14" fill="#000000" text-anchor="middle">BC=4</text>
                <text id="scene1-label-ad45" x="260" y="200" font-size="14" fill="#000000" text-anchor="middle">AD=$\frac{4}{5}$</text>
                <!-- 直角符号在C点 -->
                <path id="scene1-right-angle" d="M 390 120 L 390 110 L 400 110" fill="none" stroke="#000000" stroke-width="1.5"/>
            </g>
            
            <!-- 步骤2元素：圆周角∠DAC与∠DBC（蓝色弧线） -->
            <g id="scene1-step2-group" class="scene1-step-element">
                <!-- 以A为圆心的弧线 -->
                <path id="scene1-arc-dac" d="M 275 260 A 25 25 0 0 1 268 245" fill="none" stroke="#1565c0" stroke-width="2"/>
                <!-- 以B为圆心的弧线 -->
                <path id="scene1-arc-dbc" d="M 525 260 A 25 25 0 0 0 532 245" fill="none" stroke="#1565c0" stroke-width="2"/>
                <text id="scene1-text-arc1" x="400" y="80" font-size="14" fill="#1565c0" text-anchor="middle">同弧DC所对圆周角</text>
            </g>
            
            <!-- 步骤3元素：圆周角∠ADE与∠BCE（绿色弧线） -->
            <g id="scene1-step3-group" class="scene1-step-element">
                <!-- 以D为圆心的弧线 -->
                <path id="scene1-arc-ade" d="M 315 155 A 20 20 0 0 1 305 165" fill="none" stroke="#2e7d32" stroke-width="2"/>
                <!-- 以C为圆心的弧线 -->
                <path id="scene1-arc-bce" d="M 380 110 A 20 20 0 0 0 390 120" fill="none" stroke="#2e7d32" stroke-width="2"/>
                <text id="scene1-text-arc2" x="400" y="320" font-size="14" fill="#2e7d32" text-anchor="middle">同弧AB所对圆周角</text>
            </g>
            
            <!-- 步骤4元素：三角形填充 -->
            <g id="scene1-step4-group" class="scene1-step-element">
                <!-- △ADE填充 -->
                <polygon id="scene1-tri-ade" points="250,260 295,155 340,175" fill="#1565c0" fill-opacity="0.2"/>
                <!-- △BCE填充 -->
                <polygon id="scene1-tri-bce" points="550,260 400,110 340,175" fill="#c62828" fill-opacity="0.2"/>
                <text id="scene1-text-similar" x="400" y="240" font-size="16" fill="#000000" text-anchor="middle" font-weight="bold">△ADE∽△BCE</text>
            </g>
            
            <!-- 步骤5元素：比例关系 -->
            <g id="scene1-step5-group" class="scene1-step-element">
                <text id="scene1-text-ratio" x="400" y="360" font-size="16" fill="#000000" text-anchor="middle">$\frac{AD}{BC} = \frac{AE}{BE}$</text>
                <!-- 高亮对应边 -->
                <line id="scene1-line-ad-highlight" x1="250" y1="260" x2="295" y2="155" stroke="#1565c0" stroke-width="3" opacity="0.6"/>
                <line id="scene1-line-bc-highlight" x1="550" y1="260" x2="400" y2="110" stroke="#1565c0" stroke-width="3" opacity="0.6"/>
                <line id="scene1-line-ae-highlight" x1="250" y1="260" x2="340" y2="175" stroke="#c62828" stroke-width="3" opacity="0.6"/>
                <line id="scene1-line-be-highlight" x1="550" y1="260" x2="340" y2="175" stroke="#c62828" stroke-width="3" opacity="0.6"/>
            </g>
        </svg>
        
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 0/5</span>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现：圆内接等腰直角三角形与相似三角形关系
        
        // 布局坐标表（实现对照依据）：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // |------|------|-----------|------|-------------|------|
        // | 圆⊙O | circle | 圆心(400,260) | r=150 | - | 黑色细线居中 |
        // | 直径AB | line | (250,260)-(550,260) | 300×2 | - | 水平穿过圆心 |
        // | 点A | circle | (250,260) | r=3 | - | 黑色实心点 |
        // | 点B | circle | (550,260) | r=3 | - | 黑色实心点 |
        // | 点C | circle | (400,110) | r=3 | - | 圆顶部 |
        // | 点D | circle | (295,155) | r=3 | - | 弧AC上左上位置 |
        // | 点E | circle | (340,175) | r=3 | - | BD与AC交点 |
        // | 点O | circle | (400,260) | r=4 | - | 圆心黑色实心点 |
        
        let currentStep = 0;
        const totalSteps = 5;
        
        // 每步需要显示的元素ID列表
        const stepElements = {
            0: [],
            1: ['scene1-step1-group'],
            2: ['scene1-step2-group'],
            3: ['scene1-step3-group'],
            4: ['scene1-step4-group'],
            5: ['scene1-step5-group']
        };
        
        // 显示/隐藏元素的工具函数
        function showElement(elementId) {
            const el = document.getElementById(elementId);
            if (el) {
                el.classList.add('scene1-visible');
            }
        }
        
        function hideElement(elementId) {
            const el = document.getElementById(elementId);
            if (el) {
                el.classList.remove('scene1-visible');
            }
        }
        
        // 更新步骤显示
        function updateStep() {
            // 隐藏所有步骤元素
            for (let step = 1; step <= totalSteps; step++) {
                stepElements[step].forEach(id => hideElement(id));
            }
            
            // 显示当前步骤及之前所有步骤的元素
            for (let step = 1; step <= currentStep; step++) {
                stepElements[step].forEach(id => showElement(id));
            }
            
            // 更新步骤指示器
            document.getElementById('scene1-step-indicator').textContent = `步骤 ${currentStep}/${totalSteps}`;
            
            // 更新按钮状态
            const prevBtn = document.getElementById('scene1-btn-prev');
            const nextBtn = document.getElementById('scene1-btn-next');
            prevBtn.disabled = (currentStep === 0);
            nextBtn.disabled = (currentStep === totalSteps);
            
            // 重新渲染MathJax公式
            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }
        
        // 按钮事件绑定
        document.getElementById('scene1-btn-prev').addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        });
        
        document.getElementById('scene1-btn-next').addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateStep();
            }
        });
        
        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
