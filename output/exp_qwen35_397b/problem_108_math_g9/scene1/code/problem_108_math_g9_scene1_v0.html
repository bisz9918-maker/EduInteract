<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>几何角度关系推导 - ∠MCN</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-svg { width: 800px; height: 500px; }
        .scene1-hidden { display: none; opacity: 0; }
        .scene1-visible { display: block; opacity: 1; transition: opacity 0.3s ease; }
        .scene1-btn-bg { cursor: pointer; }
        .scene1-btn-bg.disabled { cursor: not-allowed; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 底边 MN -->
            <line id="scene1-line-mn" x1="150" y1="300" x2="650" y2="300" stroke="#000000" stroke-width="2"/>
            
            <!-- △AMN 边 AM -->
            <line id="scene1-line-am" x1="150" y1="300" x2="300" y2="100" stroke="#000000" stroke-width="2"/>
            
            <!-- △AMN 边 AN -->
            <line id="scene1-line-an" x1="300" y1="100" x2="650" y2="300" stroke="#000000" stroke-width="2"/>
            
            <!-- △BMN 边 BM (初始黑色，步骤 1 变蓝色加粗) -->
            <line id="scene1-line-bm" x1="550" y1="120" x2="150" y2="300" stroke="#000000" stroke-width="2"/>
            
            <!-- △BMN 边 BN -->
            <line id="scene1-line-bn" x1="550" y1="120" x2="650" y2="300" stroke="#000000" stroke-width="2"/>
            
            <!-- 交点 C -->
            <circle id="scene1-point-c" cx="430" cy="174" r="4" fill="#000000" class="scene1-hidden"/>
            
            <!-- 点标签 -->
            <text id="scene1-label-m" x="130" y="325" font-size="16" fill="#000000">M</text>
            <text id="scene1-label-n" x="665" y="325" font-size="16" fill="#000000">N</text>
            <text id="scene1-label-a" x="300" y="85" font-size="16" fill="#000000">A</text>
            <text id="scene1-label-b" x="565" y="110" font-size="16" fill="#000000">B</text>
            <text id="scene1-label-c" x="450" y="165" font-size="16" fill="#000000" class="scene1-hidden">C</text>
            
            <!-- 角度标记弧线 -->
            <!-- ∠AMB 弧线 (以 M 为圆心 r=30) -->
            <path id="scene1-angle-amb" d="M 180,300 A 30,30 0 0,0 173,282" fill="none" stroke="#2e7d32" stroke-width="2" class="scene1-hidden"/>
            <!-- ∠NMB 弧线 (以 M 为圆心 r=30) -->
            <path id="scene1-angle-nmb" d="M 173,282 A 30,30 0 0,0 165,265" fill="none" stroke="#2e7d32" stroke-width="2" class="scene1-hidden"/>
            <!-- ∠MNC 弧线 (以 N 为圆心 r=30) -->
            <path id="scene1-angle-mnc" d="M 620,300 A 30,30 0 0,1 628,282" fill="none" stroke="#2e7d32" stroke-width="2" class="scene1-hidden"/>
            <!-- ∠BNC 弧线 (以 N 为圆心 r=30) -->
            <path id="scene1-angle-bnc" d="M 628,282 A 30,30 0 0,1 635,265" fill="none" stroke="#2e7d32" stroke-width="2" class="scene1-hidden"/>
            
            <!-- ∠A=α° 标签 -->
            <text id="scene1-angle-alpha" x="290" y="130" font-size="16" fill="#2e7d32" class="scene1-hidden">α°</text>
            <!-- ∠B=β° 标签 -->
            <text id="scene1-angle-beta" x="520" y="150" font-size="16" fill="#2e7d32" class="scene1-hidden">β°</text>
            
            <!-- △MCN 高亮边 (步骤 5 显示) -->
            <line id="scene1-line-mc" x1="150" y1="300" x2="430" y2="174" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5" class="scene1-hidden"/>
            <line id="scene1-line-nc" x1="650" y1="300" x2="430" y2="174" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5" class="scene1-hidden"/>
            
            <!-- 公式框 -->
            <rect id="scene1-formula-box" x="40" y="370" width="380" height="70" fill="#f5f5f5" stroke="#cccccc" stroke-width="1" rx="5"/>
            <text id="scene1-formula-text" x="55" y="395" font-size="14" fill="#000000">已知：BM 平分∠AMN，AN 平分∠BNM</text>
            <text id="scene1-formula-text2" x="55" y="420" font-size="14" fill="#000000" class="scene1-hidden"></text>
            
            <!-- 控件栏 (放在 SVG 内部底部) -->
            <g id="scene1-controls">
                <!-- 上一步按钮 -->
                <rect id="scene1-btn-prev-bg" x="260" y="450" width="120" height="40" fill="#1565c0" rx="5" class="scene1-btn-bg"/>
                <text id="scene1-btn-prev-text" x="320" y="475" font-size="15" fill="#ffffff" text-anchor="middle">◀ 上一步</text>
                <!-- 步骤指示器 -->
                <text id="scene1-step-indicator" x="400" y="475" font-size="15" fill="#424242" text-anchor="middle">步骤 0/6</text>
                <!-- 下一步按钮 -->
                <rect id="scene1-btn-next-bg" x="440" y="450" width="120" height="40" fill="#1565c0" rx="5" class="scene1-btn-bg"/>
                <text id="scene1-btn-next-text" x="500" y="475" font-size="15" fill="#ffffff" text-anchor="middle">下一步 ▶</text>
            </g>
        </svg>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现 - 几何角度关系推导
        
        // 状态管理
        let currentStep = 0;
        const totalSteps = 6;
        
        // 各步骤配置
        const stepConfig = {
            0: {
                show: [],
                hide: ['scene1-point-c', 'scene1-label-c', 'scene1-angle-amb', 'scene1-angle-nmb', 
                       'scene1-angle-mnc', 'scene1-angle-bnc', 'scene1-angle-alpha', 'scene1-angle-beta', 
                       'scene1-line-mc', 'scene1-line-nc', 'scene1-formula-text2'],
                formula1: '已知：BM 平分∠AMN，AN 平分∠BNM',
                formula2: '',
                bmStyle: { stroke: '#000000', strokeWidth: 2 },
                anStyle: { stroke: '#000000', strokeWidth: 2 }
            },
            1: {
                show: ['scene1-angle-amb', 'scene1-angle-nmb'],
                hide: ['scene1-formula-text2'],
                formula1: '∵ BM 平分∠AMN',
                formula2: '∴ ∠AMB = ∠NMB',
                bmStyle: { stroke: '#1565c0', strokeWidth: 3 },
                anStyle: { stroke: '#000000', strokeWidth: 2 }
            },
            2: {
                show: ['scene1-point-c', 'scene1-label-c', 'scene1-angle-mnc', 'scene1-angle-bnc'],
                hide: ['scene1-formula-text2'],
                formula1: '∵ AN 平分∠BNM',
                formula2: '∴ ∠MNC = ∠BNC',
                bmStyle: { stroke: '#1565c0', strokeWidth: 3 },
                anStyle: { stroke: '#1565c0', strokeWidth: 3 }
            },
            3: {
                show: ['scene1-angle-alpha'],
                hide: ['scene1-formula-text2'],
                formula1: '在△AMN 中：∠A + ∠AMN + ∠ANM = 180°',
                formula2: '⇒ ∠AMN + ∠ANM = 180° - α°',
                bmStyle: { stroke: '#1565c0', strokeWidth: 3 },
                anStyle: { stroke: '#1565c0', strokeWidth: 3 }
            },
            4: {
                show: ['scene1-angle-beta'],
                hide: ['scene1-formula-text2'],
                formula1: '在△BMN 中：∠B + ∠BMN + ∠BNM = 180°',
                formula2: '⇒ ∠BMN + ∠BNM = 180° - β°',
                bmStyle: { stroke: '#1565c0', strokeWidth: 3 },
                anStyle: { stroke: '#1565c0', strokeWidth: 3 }
            },
            5: {
                show: ['scene1-line-mc', 'scene1-line-nc'],
                hide: ['scene1-formula-text2'],
                formula1: '在△MCN 中：∠MCN = 180° - (∠CMN + ∠CNM)',
                formula2: '= 180° - (∠NMB + ∠MNC)',
                bmStyle: { stroke: '#1565c0', strokeWidth: 3 },
                anStyle: { stroke: '#1565c0', strokeWidth: 3 }
            },
            6: {
                show: ['scene1-formula-text2'],
                hide: [],
                formula1: '∠MCN = 90° + (α+β)/4',
                formula2: '选项 C：∠MCN = (α+β)/3 + 60°  ❌',
                bmStyle: { stroke: '#1565c0', strokeWidth: 3 },
                anStyle: { stroke: '#1565c0', strokeWidth: 3 }
            }
        };
        
        // 工具函数：显示元素
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene1-hidden');
                el.classList.add('scene1-visible');
                el.style.display = 'block';
                el.style.opacity = '1';
            }
        }
        
        // 工具函数：隐藏元素
        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene1-visible');
                el.classList.add('scene1-hidden');
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }
        
        // 更新步骤显示
        function updateStep(step) {
            const config = stepConfig[step];
            
            // 显示该步骤需要显示的元素
            config.show.forEach(id => showElement(id));
            
            // 隐藏该步骤需要隐藏的元素
            config.hide.forEach(id => hideElement(id));
            
            // 更新公式文本
            const formulaText1 = document.getElementById('scene1-formula-text');
            const formulaText2 = document.getElementById('scene1-formula-text2');
            if (formulaText1) formulaText1.textContent = config.formula1;
            if (formulaText2) {
                formulaText2.textContent = config.formula2;
                if (config.formula2) {
                    showElement('scene1-formula-text2');
                }
            }
            
            // 更新 BM 线段样式
            const bmLine = document.getElementById('scene1-line-bm');
            if (bmLine) {
                bmLine.setAttribute('stroke', config.bmStyle.stroke);
                bmLine.setAttribute('stroke-width', config.bmStyle.strokeWidth);
            }
            
            // 更新 AN 线段样式
            const anLine = document.getElementById('scene1-line-an');
            if (anLine) {
                anLine.setAttribute('stroke', config.anStyle.stroke);
                anLine.setAttribute('stroke-width', config.anStyle.strokeWidth);
            }
            
            // 更新步骤指示器
            const indicator = document.getElementById('scene1-step-indicator');
            if (indicator) {
                indicator.textContent = '步骤 ' + step + '/' + totalSteps;
            }
            
            // 更新按钮状态
            const prevBtnBg = document.getElementById('scene1-btn-prev-bg');
            const prevBtnText = document.getElementById('scene1-btn-prev-text');
            const nextBtnBg = document.getElementById('scene1-btn-next-bg');
            const nextBtnText = document.getElementById('scene1-btn-next-text');
            
            if (prevBtnBg && prevBtnText) {
                if (step === 0) {
                    prevBtnBg.setAttribute('fill', '#bdbdbd');
                    prevBtnText.setAttribute('fill', '#757575');
                    prevBtnBg.classList.add('disabled');
                } else {
                    prevBtnBg.setAttribute('fill', '#1565c0');
                    prevBtnText.setAttribute('fill', '#ffffff');
                    prevBtnBg.classList.remove('disabled');
                }
            }
            
            if (nextBtnBg && nextBtnText) {
                if (step === totalSteps) {
                    nextBtnBg.setAttribute('fill', '#bdbdbd');
                    nextBtnText.setAttribute('fill', '#757575');
                    nextBtnBg.classList.add('disabled');
                } else {
                    nextBtnBg.setAttribute('fill', '#1565c0');
                    nextBtnText.setAttribute('fill', '#ffffff');
                    nextBtnBg.classList.remove('disabled');
                }
            }
        }
        
        // 上一步
        function stepBack() {
            if (currentStep > 0) {
                currentStep--;
                updateStep(currentStep);
            }
        }
        
        // 下一步
        function stepForward() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateStep(currentStep);
            }
        }
        
        // 绑定按钮点击事件
        document.getElementById('scene1-btn-prev-bg').addEventListener('click', stepBack);
        document.getElementById('scene1-btn-next-bg').addEventListener('click', stepForward);
        
        // 初始化
        updateStep(0);
        
    })();
    </script>
</body>
</html>
