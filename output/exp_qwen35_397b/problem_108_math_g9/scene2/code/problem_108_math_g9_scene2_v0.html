<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>选项验证 - 几何图示</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene2-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: #f5f5f5; }
        .scene2-btn.active { background: #1565c0; color: white; border-color: #1565c0; }
        .scene2-label { font-size: 16px; fill: #000000; }
        .scene2-angle-label { font-size: 14px; fill: #1565c0; }
        .scene2-hidden { display: none; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg width="800" height="500" id="scene2-svg">
            <!-- 底边 MN -->
            <line id="scene2-mn" x1="120" y1="380" x2="680" y2="380" stroke="#000000" stroke-width="2"/>
            
            <!-- 三角形 AMN 边框 -->
            <line id="scene2-am" x1="120" y1="380" x2="280" y2="120" stroke="#000000" stroke-width="2"/>
            <line id="scene2-an" x1="280" y1="120" x2="680" y2="380" stroke="#000000" stroke-width="2"/>
            
            <!-- 三角形 BMN 边框 -->
            <line id="scene2-bm" x1="120" y1="380" x2="560" y2="160" stroke="#000000" stroke-width="2"/>
            <line id="scene2-bn" x1="560" y1="160" x2="680" y2="380" stroke="#000000" stroke-width="2"/>
            
            <!-- 垂直平分线（状态 1） -->
            <line id="scene2-perp-bisector" x1="400" y1="380" x2="400" y2="80" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" class="scene2-hidden"/>
            
            <!-- 延长线 MA、NB（状态 3） -->
            <line id="scene2-ma-extend" x1="280" y1="120" x2="400" y2="40" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" class="scene2-hidden"/>
            <line id="scene2-nb-extend" x1="560" y1="160" x2="400" y2="40" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" class="scene2-hidden"/>
            
            <!-- 等长标记（状态 3） -->
            <line id="scene2-oa-mark" x1="234" y1="244" x2="246" y2="256" stroke="#2e7d32" stroke-width="3" class="scene2-hidden"/>
            <line id="scene2-ob-mark" x1="514" y1="264" x2="526" y2="276" stroke="#2e7d32" stroke-width="3" class="scene2-hidden"/>
            
            <!-- 角度弧 -->
            <path id="scene2-angle-a" d="M 295 145 A 25 25 0 0 1 305 135" fill="none" stroke="#1565c0" stroke-width="2" class="scene2-hidden"/>
            <path id="scene2-angle-b" d="M 545 175 A 25 25 0 0 1 555 165" fill="none" stroke="#1565c0" stroke-width="2" class="scene2-hidden"/>
            <path id="scene2-angle-mcn" d="M 405 295 A 30 30 0 0 1 435 295" fill="none" stroke="#e65100" stroke-width="2" class="scene2-hidden"/>
            
            <!-- 顶点标签 -->
            <text id="scene2-label-m" x="105" y="395" class="scene2-label">M</text>
            <text id="scene2-label-n" x="695" y="395" class="scene2-label">N</text>
            <text id="scene2-label-a" x="280" y="105" class="scene2-label">A</text>
            <text id="scene2-label-b" x="560" y="145" class="scene2-label">B</text>
            <text id="scene2-label-c" x="435" y="280" class="scene2-label">C</text>
            <text id="scene2-label-o" x="400" y="25" class="scene2-label scene2-hidden">O</text>
            
            <!-- 角度数值标签 -->
            <text id="scene2-alpha" x="295" y="90" class="scene2-angle-label scene2-hidden">α°</text>
            <text id="scene2-beta" x="575" y="130" class="scene2-angle-label scene2-hidden">β°</text>
            <text id="scene2-mcn-val" x="430" y="260" class="scene2-angle-label scene2-hidden" style="fill: #e65100;">120°</text>
            
            <!-- 选项判断标签 -->
            <text id="scene2-judge" x="650" y="100" font-size="16px" fill="#2e7d32" class="scene2-hidden"></text>
            
            <!-- 结论说明区 -->
            <text id="scene2-explanation" x="620" y="200" font-size="13px" fill="#333333" class="scene2-hidden">
                <tspan x="620" dy="0">说明文字</tspan>
            </text>
            
            <!-- 控件栏（放在 SVG 内部底部） -->
            <g id="scene2-controls" transform="translate(0, 450)">
                <rect id="scene2-btn-optionA" x="150" y="0" width="100" height="30" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" class="scene2-btn-rect"/>
                <text x="200" y="20" text-anchor="middle" font-size="14px" class="scene2-btn-text">选项 A</text>
                
                <rect id="scene2-btn-optionB" x="270" y="0" width="100" height="30" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" class="scene2-btn-rect"/>
                <text x="320" y="20" text-anchor="middle" font-size="14px" class="scene2-btn-text">选项 B</text>
                
                <rect id="scene2-btn-optionD" x="390" y="0" width="100" height="30" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" class="scene2-btn-rect"/>
                <text x="440" y="20" text-anchor="middle" font-size="14px" class="scene2-btn-text">选项 D</text>
                
                <rect id="scene2-btn-base" x="510" y="0" width="100" height="30" fill="#1565c0" stroke="#1565c0" stroke-width="1" rx="4" class="scene2-btn-rect"/>
                <text x="560" y="20" text-anchor="middle" font-size="14px" fill="white" class="scene2-btn-text">基础图形</text>
            </g>
        </svg>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现 - 选项验证多状态切换
        
        const currentState = { value: 0 }; // 0=基础，1=选项 A，2=选项 B，3=选项 D
        
        // 工具函数：显示/隐藏元素
        function show(el) {
            if (el) {
                el.classList.remove('scene2-hidden');
                el.style.display = '';
                el.style.opacity = '1';
            }
        }
        
        function hide(el) {
            if (el) {
                el.classList.add('scene2-hidden');
                el.style.display = 'none';
                el.style.opacity = '0';
            }
        }
        
        // 更新按钮高亮
        function updateButtons(activeIndex) {
            const btns = ['scene2-btn-optionA', 'scene2-btn-optionB', 'scene2-btn-optionD', 'scene2-btn-base'];
            btns.forEach((id, idx) => {
                const rect = document.getElementById(id);
                if (rect) {
                    if (idx === activeIndex - 1 || (activeIndex === 0 && idx === 3)) {
                        rect.setAttribute('fill', '#1565c0');
                        rect.setAttribute('stroke', '#1565c0');
                    } else {
                        rect.setAttribute('fill', '#f5f5f5');
                        rect.setAttribute('stroke', '#ccc');
                    }
                }
            });
        }
        
        // 更新状态显示
        function updateState(state) {
            currentState.value = state;
            
            // 隐藏所有状态相关元素
            hide(document.getElementById('scene2-perp-bisector'));
            hide(document.getElementById('scene2-ma-extend'));
            hide(document.getElementById('scene2-nb-extend'));
            hide(document.getElementById('scene2-oa-mark'));
            hide(document.getElementById('scene2-ob-mark'));
            hide(document.getElementById('scene2-label-o'));
            hide(document.getElementById('scene2-angle-a'));
            hide(document.getElementById('scene2-angle-b'));
            hide(document.getElementById('scene2-angle-mcn'));
            hide(document.getElementById('scene2-alpha'));
            hide(document.getElementById('scene2-beta'));
            hide(document.getElementById('scene2-mcn-val'));
            hide(document.getElementById('scene2-judge'));
            hide(document.getElementById('scene2-explanation'));
            
            // 根据状态显示相应元素
            if (state === 0) {
                // 基础图形 - 不显示额外元素
                updateButtons(0);
            } else if (state === 1) {
                // 选项 A: α=β=60°
                show(document.getElementById('scene2-perp-bisector'));
                show(document.getElementById('scene2-angle-a'));
                show(document.getElementById('scene2-angle-b'));
                show(document.getElementById('scene2-alpha'));
                show(document.getElementById('scene2-beta'));
                document.getElementById('scene2-alpha').textContent = '60°';
                document.getElementById('scene2-beta').textContent = '60°';
                
                const judge = document.getElementById('scene2-judge');
                judge.textContent = '选项 A：✓正确';
                judge.setAttribute('fill', '#2e7d32');
                show(judge);
                
                const exp = document.getElementById('scene2-explanation');
                exp.innerHTML = '<tspan x="620" dy="0">当α=β时，△AMN≌△BMN</tspan><tspan x="620" dy="18">C 在 MN 垂直平分线上</tspan>';
                show(exp);
                
                updateButtons(1);
            } else if (state === 2) {
                // 选项 B: α+β=180°
                show(document.getElementById('scene2-angle-a'));
                show(document.getElementById('scene2-angle-b'));
                show(document.getElementById('scene2-alpha'));
                show(document.getElementById('scene2-beta'));
                document.getElementById('scene2-alpha').textContent = '100°';
                document.getElementById('scene2-beta').textContent = '80°';
                
                const judge = document.getElementById('scene2-judge');
                judge.textContent = '选项 B：✗错误';
                judge.setAttribute('fill', '#c62828');
                show(judge);
                
                const exp = document.getElementById('scene2-explanation');
                exp.innerHTML = '<tspan x="620" dy="0">α+β=180°时，∠AMB≠∠NMB</tspan><tspan x="620" dy="18">BM 平分∠AMN 不意味着</tspan><tspan x="620" dy="18">∠AMB=∠NMB</tspan>';
                show(exp);
                
                updateButtons(2);
            } else if (state === 3) {
                // 选项 D: ∠MCN=120°
                show(document.getElementById('scene2-ma-extend'));
                show(document.getElementById('scene2-nb-extend'));
                show(document.getElementById('scene2-oa-mark'));
                show(document.getElementById('scene2-ob-mark'));
                show(document.getElementById('scene2-label-o'));
                show(document.getElementById('scene2-angle-mcn'));
                show(document.getElementById('scene2-mcn-val'));
                
                const judge = document.getElementById('scene2-judge');
                judge.textContent = '选项 D：✓正确';
                judge.setAttribute('fill', '#2e7d32');
                show(judge);
                
                const exp = document.getElementById('scene2-explanation');
                exp.innerHTML = '<tspan x="620" dy="0">当∠MCN=120°时</tspan><tspan x="620" dy="18">△OAB 为等腰三角形</tspan><tspan x="620" dy="18">OA=OB</tspan>';
                show(exp);
                
                updateButtons(3);
            }
        }
        
        // 绑定按钮事件
        document.getElementById('scene2-btn-optionA').addEventListener('click', function() {
            updateState(1);
        });
        
        document.getElementById('scene2-btn-optionB').addEventListener('click', function() {
            updateState(2);
        });
        
        document.getElementById('scene2-btn-optionD').addEventListener('click', function() {
            updateState(3);
        });
        
        document.getElementById('scene2-btn-base').addEventListener('click', function() {
            updateState(0);
        });
        
        // 初始化
        updateState(0);
    })();
    </script>
</body>
</html>
