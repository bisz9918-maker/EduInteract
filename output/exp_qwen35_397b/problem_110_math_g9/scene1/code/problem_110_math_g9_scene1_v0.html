<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台球反射问题 - 角度关系推导</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-svg { width: 800px; height: 500px; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene1-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #333; border-radius: 4px; background: #f5f5f5; }
        .scene1-btn:hover { background: #e0e0e0; }
        .scene1-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene1-step-indicator { font-size: 14px; padding: 8px 16px; }
        .hidden { display: none; }
        .fade-in { animation: scene1-fade-in 0.3s ease-in; }
        @keyframes scene1-fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 箭头定义 -->
            <defs>
                <marker id="scene1-arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
                    <path d="M0,0 L10,5 L0,10 Z" fill="#1565c0" />
                </marker>
                <marker id="scene1-arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
                    <path d="M0,0 L10,5 L0,10 Z" fill="#2e7d32" />
                </marker>
            </defs>

            <!-- 台球桌边框 -->
            <rect id="scene1-table" x="100" y="80" width="600" height="300" stroke="#000000" stroke-width="2" fill="none" />

            <!-- 6 个袋口 -->
            <circle id="scene1-pocket-tl" cx="100" cy="80" r="12" fill="#ffffff" stroke="#888888" stroke-width="2" />
            <circle id="scene1-pocket-tm" cx="400" cy="80" r="12" fill="#ffffff" stroke="#888888" stroke-width="2" />
            <circle id="scene1-pocket-tr" cx="700" cy="80" r="12" fill="#ffffff" stroke="#888888" stroke-width="2" />
            <circle id="scene1-pocket-bl" cx="100" cy="380" r="12" fill="#ffffff" stroke="#888888" stroke-width="2" />
            <circle id="scene1-pocket-bm" cx="400" cy="380" r="12" fill="#ffffff" stroke="#888888" stroke-width="2" />
            <circle id="scene1-pocket-br" cx="700" cy="380" r="12" fill="#ffffff" stroke="#888888" stroke-width="2" />

            <!-- 白球 -->
            <circle id="scene1-white-ball" cx="280" cy="240" r="14" fill="#ffffff" stroke="#000000" stroke-width="2" />

            <!-- 黑球 -->
            <circle id="scene1-black-ball" cx="540" cy="220" r="14" fill="#000000" />

            <!-- 入射轨迹：白球→反射点 -->
            <line id="scene1-trajectory-in" x1="280" y1="240" x2="450" y2="80" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-blue)" />

            <!-- 反射轨迹：反射点→黑球 -->
            <line id="scene1-trajectory-out" x1="450" y1="80" x2="540" y2="220" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-blue)" />

            <!-- 黑球入袋轨迹：黑球→右下角袋口 -->
            <line id="scene1-trajectory-pocket" x1="540" y1="220" x2="700" y2="380" stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-blue)" />

            <!-- 法线（虚线） -->
            <line id="scene1-normal" x1="450" y1="80" x2="450" y2="50" stroke="#888888" stroke-width="1" stroke-dasharray="5,5" />

            <!-- ∠1 弧线（入射角） -->
            <path id="scene1-angle-arc-1" class="hidden" d="M 450,105 A 25,25 0 0,1 432,90" stroke="#c62828" stroke-width="1.5" fill="none" />

            <!-- ∠2 弧线（反射角） -->
            <path id="scene1-angle-arc-2" class="hidden" d="M 450,105 A 25,25 0 0,0 468,90" stroke="#c62828" stroke-width="1.5" fill="none" />

            <!-- ∠3 弧线（右下角） -->
            <path id="scene1-angle-arc-3" d="M 675,380 A 25,25 0 0,1 700,355" stroke="#c62828" stroke-width="1.5" fill="none" />

            <!-- 直角标记（右上角） -->
            <polyline id="scene1-right-angle" class="hidden" points="685,95 685,110 700,110" stroke="#888888" stroke-width="1" fill="none" />

            <!-- 标签 -->
            <!-- ∠3=30° 始终显示 -->
            <text id="scene1-angle-label-3" x="680" y="355" font-size="14" fill="#000000">∠3=30°</text>

            <!-- 90°标签（步骤 1 显示） -->
            <text id="scene1-label-90" class="hidden" x="690" y="125" font-size="14" fill="#000000">90°</text>

            <!-- ∠2 标签（步骤 2 显示） -->
            <text id="scene1-angle-label-2" class="hidden" x="475" y="75" font-size="14" fill="#000000">∠2</text>

            <!-- 60°计算式（步骤 2 显示） -->
            <text id="scene1-calc-60" class="hidden" x="465" y="50" font-size="13" fill="#2e7d32">∠2 = 90° - 30° = 60°</text>

            <!-- ∠1 标签（步骤 4 显示） -->
            <text id="scene1-angle-label-1" class="hidden" x="415" y="75" font-size="14" fill="#000000">∠1</text>

            <!-- 反射定律说明（步骤 3 显示） -->
            <text id="scene1-reflection-law" class="hidden" x="450" y="35" font-size="13" fill="#2e7d32" text-anchor="middle">入射角 = 反射角</text>

            <!-- 答案文本（步骤 4 显示） -->
            <text id="scene1-answer" class="hidden" x="400" y="430" font-size="16" fill="#2e7d32" text-anchor="middle">∠1 = ∠2 = 60°，答案：B</text>

            <!-- 控件栏（SVG 内部底部） -->
            <g id="scene1-controls" transform="translate(0, 450)">
                <rect x="0" y="0" width="800" height="50" fill="#ffffff" opacity="0.9" />
                <button id="scene1-btn-prev" class="scene1-btn" x="320" y="10">◀ 上一步</button>
                <text id="scene1-step-indicator" x="400" y="32" font-size="14" text-anchor="middle">步骤 1/5</text>
                <button id="scene1-btn-next" class="scene1-btn" x="480" y="10">下一步 ▶</button>
            </g>
        </svg>
    </div>

    <script>
    (function() {
        // Scene 1 实现 - 台球反射问题角度推导

        // 状态变量
        let currentStep = 0;
        const totalSteps = 5;

        // DOM 元素引用
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');

        // 各步骤需要显示的元素 ID 列表
        const stepElements = {
            0: {
                show: ['scene1-angle-label-3'],
                hide: ['scene1-angle-arc-1', 'scene1-angle-arc-2', 'scene1-right-angle', 'scene1-label-90', 
                       'scene1-angle-label-2', 'scene1-calc-60', 'scene1-reflection-law', 'scene1-angle-label-1', 'scene1-answer']
            },
            1: {
                show: ['scene1-right-angle', 'scene1-label-90'],
                hide: ['scene1-angle-arc-1', 'scene1-angle-arc-2', 'scene1-angle-label-2', 'scene1-calc-60', 
                       'scene1-reflection-law', 'scene1-angle-label-1', 'scene1-answer']
            },
            2: {
                show: ['scene1-angle-arc-2', 'scene1-angle-label-2', 'scene1-calc-60'],
                hide: ['scene1-angle-arc-1', 'scene1-reflection-law', 'scene1-angle-label-1', 'scene1-answer']
            },
            3: {
                show: ['scene1-reflection-law'],
                hide: ['scene1-angle-arc-1', 'scene1-angle-label-1', 'scene1-answer']
            },
            4: {
                show: ['scene1-angle-arc-1', 'scene1-angle-label-1', 'scene1-answer'],
                hide: []
            }
        };

        // 显示元素函数
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('hidden');
                el.classList.add('fade-in');
            }
        }

        // 隐藏元素函数
        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.add('hidden');
                el.classList.remove('fade-in');
            }
        }

        // 更新步骤显示
        function updateStep() {
            // 显示当前步骤需要的元素
            const step = stepElements[currentStep];
            step.show.forEach(id => showElement(id));
            step.hide.forEach(id => hideElement(id));

            // 更新步骤指示器
            stepIndicator.textContent = `步骤 ${currentStep + 1}/${totalSteps}`;

            // 更新按钮状态
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps - 1;

            // 步骤 3 高亮法线
            const normal = document.getElementById('scene1-normal');
            if (currentStep === 3) {
                normal.setAttribute('stroke', '#2e7d32');
            } else {
                normal.setAttribute('stroke', '#888888');
            }
        }

        // 下一步
        function stepForward() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateStep();
            }
        }

        // 上一步
        function stepBackward() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        }

        // 事件绑定
        btnPrev.addEventListener('click', stepBackward);
        btnNext.addEventListener('click', stepForward);

        // 初始化
        updateStep();

    })();
    </script>
</body>
</html>
