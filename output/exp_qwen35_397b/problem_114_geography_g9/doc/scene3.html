<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极地俯视图 - A、B 点经纬度定位与东西半球判断</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-svg { width: 800px; height: 500px; }
        .scene3-step-element { opacity: 0; transition: opacity 0.3s ease; }
        .scene3-visible { opacity: 1; }
        .scene3-hidden { opacity: 0; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg id="scene3-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 左图：北极俯视图 -->
            <!-- 外圆 -->
            <circle id="scene3-left-outer" cx="200" cy="150" r="80" fill="none" stroke="#000000" stroke-width="2"/>
            <!-- 内圆 -->
            <circle id="scene3-left-inner" cx="200" cy="150" r="25" fill="none" stroke="#000000" stroke-width="2"/>
            <!-- 经线 1: 180°-0°轴线 -->
            <line id="scene3-left-line1" x1="200" y1="70" x2="200" y2="230" stroke="#000000" stroke-width="1"/>
            <!-- 经线 2: 90°W-90°E 轴线 -->
            <line id="scene3-left-line2" x1="120" y1="150" x2="280" y2="150" stroke="#000000" stroke-width="1"/>
            <!-- 经线 3: 135°W-45°E 轴线 -->
            <line id="scene3-left-line3" x1="143" y1="93" x2="257" y2="207" stroke="#000000" stroke-width="1"/>
            <!-- 经线 4: 45°W-135°E 轴线 -->
            <line id="scene3-left-line4" x1="257" y1="93" x2="143" y2="207" stroke="#000000" stroke-width="1"/>
            <!-- 0°标签 -->
            <text id="scene3-left-0deg" x="200" y="245" text-anchor="middle" font-size="14" fill="#000000">0°</text>
            <!-- 180°标签 -->
            <text id="scene3-left-180deg" x="200" y="55" text-anchor="middle" font-size="14" fill="#000000">180°</text>
            <!-- 自转箭头（逆时针） -->
            <path id="scene3-left-arrow" d="M 90 120 A 30 30 0 0 1 90 180" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#scene3-arrowhead-left)"/>
            <!-- 自转文字 -->
            <text id="scene3-left-rottext" x="55" y="150" text-anchor="middle" font-size="12" fill="#000000" writing-mode="tb">地球自转方向</text>
            <!-- A 点 -->
            <circle id="scene3-point-a" cx="143" cy="93" r="5" fill="#9e9e9e"/>
            <!-- A 点标签 -->
            <text id="scene3-label-a" x="125" y="75" font-size="14" fill="#000000" class="scene3-step-element">135°E</text>
            <!-- 步骤 1 提示：左图 -->
            <text id="scene3-hint-left" x="200" y="270" text-anchor="middle" font-size="12" fill="#1565c0" class="scene3-step-element">逆时针→东经增加</text>

            <!-- 右图：南极俯视图 -->
            <!-- 外圆 -->
            <circle id="scene3-right-outer" cx="600" cy="150" r="80" fill="none" stroke="#000000" stroke-width="2"/>
            <!-- 内圆 -->
            <circle id="scene3-right-inner" cx="600" cy="150" r="25" fill="none" stroke="#000000" stroke-width="2"/>
            <!-- 经线 1: 180°-0°轴线 -->
            <line id="scene3-right-line1" x1="600" y1="70" x2="600" y2="230" stroke="#000000" stroke-width="1"/>
            <!-- 经线 2: 90°E-90°W 轴线 -->
            <line id="scene3-right-line2" x1="520" y1="150" x2="680" y2="150" stroke="#000000" stroke-width="1"/>
            <!-- 经线 3: 135°E-45°W 轴线 -->
            <line id="scene3-right-line3" x1="543" y1="93" x2="657" y2="207" stroke="#000000" stroke-width="1"/>
            <!-- 经线 4: 45°E-135°W 轴线 -->
            <line id="scene3-right-line4" x1="657" y1="93" x2="543" y2="207" stroke="#000000" stroke-width="1"/>
            <!-- 0°标签 -->
            <text id="scene3-right-0deg" x="600" y="245" text-anchor="middle" font-size="14" fill="#000000">0°</text>
            <!-- 180°标签 -->
            <text id="scene3-right-180deg" x="600" y="55" text-anchor="middle" font-size="14" fill="#000000">180°</text>
            <!-- 自转箭头（顺时针） -->
            <path id="scene3-right-arrow" d="M 690 120 A 30 30 0 0 0 690 180" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#scene3-arrowhead-right)"/>
            <!-- 自转文字 -->
            <text id="scene3-right-rottext" x="725" y="150" text-anchor="middle" font-size="12" fill="#000000" writing-mode="tb">地球自转方向</text>
            <!-- B 点 -->
            <circle id="scene3-point-b" cx="657" cy="207" r="5" fill="#9e9e9e"/>
            <!-- B 点标签 -->
            <text id="scene3-label-b" x="675" y="225" font-size="14" fill="#000000" class="scene3-step-element">45°W</text>
            <!-- 步骤 1 提示：右图 -->
            <text id="scene3-hint-right" x="600" y="270" text-anchor="middle" font-size="12" fill="#2e7d32" class="scene3-step-element">顺时针→西经增加</text>

            <!-- 半球划分区域 -->
            <!-- 标题 -->
            <text id="scene3-hemi-title" x="400" y="290" text-anchor="middle" font-size="14" fill="#000000" class="scene3-step-element">东西半球划分</text>
            <!-- 数轴基线 -->
            <line id="scene3-hemi-axis" x1="100" y1="320" x2="700" y2="320" stroke="#000000" stroke-width="2"/>
            <!-- 20°W 刻度 -->
            <line id="scene3-hemi-20w-tick" x1="200" y1="315" x2="200" y2="325" stroke="#000000" stroke-width="2"/>
            <text id="scene3-hemi-20w" x="200" y="345" text-anchor="middle" font-size="14" fill="#000000" class="scene3-step-element">20°W</text>
            <!-- 0°刻度 -->
            <line id="scene3-hemi-0-tick" x1="350" y1="315" x2="350" y2="325" stroke="#000000" stroke-width="2"/>
            <text id="scene3-hemi-0" x="350" y="345" text-anchor="middle" font-size="14" fill="#000000" class="scene3-step-element">0°</text>
            <!-- 160°E 刻度 -->
            <line id="scene3-hemi-160e-tick" x1="550" y1="315" x2="550" y2="325" stroke="#000000" stroke-width="2"/>
            <text id="scene3-hemi-160e" x="550" y="345" text-anchor="middle" font-size="14" fill="#000000" class="scene3-step-element">160°E</text>
            <!-- 180°刻度 -->
            <line id="scene3-hemi-180-tick" x1="650" y1="315" x2="650" y2="325" stroke="#000000" stroke-width="2"/>
            <text id="scene3-hemi-180" x="650" y="345" text-anchor="middle" font-size="14" fill="#000000" class="scene3-step-element">180°</text>
            <!-- 东半球区域 -->
            <rect id="scene3-hemi-east" x="200" y="305" width="350" height="30" fill="#2e7d32" opacity="0.2" class="scene3-step-element"/>
            <text id="scene3-hemi-east-label" x="375" y="285" text-anchor="middle" font-size="14" fill="#2e7d32" class="scene3-step-element">东半球</text>
            <!-- 西半球区域（左） -->
            <rect id="scene3-hemi-west-left" x="100" y="305" width="100" height="30" fill="#c62828" opacity="0.2" class="scene3-step-element"/>
            <text id="scene3-hemi-west-left-label" x="150" y="285" text-anchor="middle" font-size="14" fill="#c62828" class="scene3-step-element">西半球</text>
            <!-- 西半球区域（右） -->
            <rect id="scene3-hemi-west-right" x="550" y="305" width="100" height="30" fill="#c62828" opacity="0.2" class="scene3-step-element"/>
            <text id="scene3-hemi-west-right-label" x="600" y="285" text-anchor="middle" font-size="14" fill="#c62828" class="scene3-step-element">西半球</text>

            <!-- 步骤 4：判断结论 -->
            <text id="scene3-conclusion-a" x="200" y="380" text-anchor="middle" font-size="14" fill="#1565c0" class="scene3-step-element">A(135°E)→东半球</text>
            <text id="scene3-conclusion-b" x="600" y="380" text-anchor="middle" font-size="14" fill="#2e7d32" class="scene3-step-element">B(45°W)→西半球</text>

            <!-- 箭头定义 -->
            <defs>
                <marker id="scene3-arrowhead-left" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M 0 0 L 10 3 L 0 6 Z" fill="#000000"/>
                </marker>
                <marker id="scene3-arrowhead-right" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <path d="M 0 0 L 10 3 L 0 6 Z" fill="#000000"/>
                </marker>
            </defs>

            <!-- 控件栏 -->
            <g id="scene3-controls">
                <rect id="scene3-btn-prev" x="280" y="445" width="100" height="35" fill="#1976d2" rx="5" style="cursor: pointer;"/>
                <text id="scene3-btn-prev-text" x="330" y="467" text-anchor="middle" font-size="14" fill="#ffffff">◀ 上一步</text>
                <rect id="scene3-btn-next" x="420" y="445" width="100" height="35" fill="#1976d2" rx="5" style="cursor: pointer;"/>
                <text id="scene3-btn-next-text" x="470" y="467" text-anchor="middle" font-size="14" fill="#ffffff">下一步 ▶</text>
                <text id="scene3-step-indicator" x="400" y="475" text-anchor="middle" font-size="13" fill="#000000">步骤 1/5</text>
            </g>
        </svg>
    </div>
    <script>
    (function() {
        // Scene 3 实现：A、B 点经纬度定位与东西半球判断

        // 状态管理
        let currentState = 0;
        const totalSteps = 5;

        // 每步需要显示的元素 ID 列表
        const steps = [
            // 步骤 0：基础框架（无额外元素）
            [],
            // 步骤 1：自转方向提示
            ['scene3-hint-left', 'scene3-hint-right'],
            // 步骤 2：A、B 点标签
            ['scene3-hint-left', 'scene3-hint-right', 'scene3-label-a', 'scene3-label-b'],
            // 步骤 3：半球划分
            ['scene3-hint-left', 'scene3-hint-right', 'scene3-label-a', 'scene3-label-b',
             'scene3-hemi-title', 'scene3-hemi-axis', 'scene3-hemi-20w-tick', 'scene3-hemi-20w',
             'scene3-hemi-0-tick', 'scene3-hemi-0', 'scene3-hemi-160e-tick', 'scene3-hemi-160e',
             'scene3-hemi-180-tick', 'scene3-hemi-180', 'scene3-hemi-east', 'scene3-hemi-east-label',
             'scene3-hemi-west-left', 'scene3-hemi-west-left-label', 'scene3-hemi-west-right', 'scene3-hemi-west-right-label'],
            // 步骤 4：判断结论
            ['scene3-hint-left', 'scene3-hint-right', 'scene3-label-a', 'scene3-label-b',
             'scene3-hemi-title', 'scene3-hemi-axis', 'scene3-hemi-20w-tick', 'scene3-hemi-20w',
             'scene3-hemi-0-tick', 'scene3-hemi-0', 'scene3-hemi-160e-tick', 'scene3-hemi-160e',
             'scene3-hemi-180-tick', 'scene3-hemi-180', 'scene3-hemi-east', 'scene3-hemi-east-label',
             'scene3-hemi-west-left', 'scene3-hemi-west-left-label', 'scene3-hemi-west-right', 'scene3-hemi-west-right-label',
             'scene3-conclusion-a', 'scene3-conclusion-b']
        ];

        // 工具函数：显示元素
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene3-hidden');
                el.classList.add('scene3-visible');
            }
        }

        // 工具函数：隐藏元素
        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('scene3-visible');
                el.classList.add('scene3-hidden');
            }
        }

        // 渲染当前步骤
        function renderStep() {
            // 获取所有需要显示的元素
            const visibleElements = steps[currentState];

            // 所有可显隐元素列表
            const allStepElements = [
                'scene3-hint-left', 'scene3-hint-right', 'scene3-label-a', 'scene3-label-b',
                'scene3-hemi-title', 'scene3-hemi-axis', 'scene3-hemi-20w-tick', 'scene3-hemi-20w',
                'scene3-hemi-0-tick', 'scene3-hemi-0', 'scene3-hemi-160e-tick', 'scene3-hemi-160e',
                'scene3-hemi-180-tick', 'scene3-hemi-180', 'scene3-hemi-east', 'scene3-hemi-east-label',
                'scene3-hemi-west-left', 'scene3-hemi-west-left-label', 'scene3-hemi-west-right', 'scene3-hemi-west-right-label',
                'scene3-conclusion-a', 'scene3-conclusion-b'
            ];

            // 更新每个元素的可见性
            allStepElements.forEach(id => {
                if (visibleElements.includes(id)) {
                    showElement(id);
                } else {
                    hideElement(id);
                }
            });

            // 更新步骤指示器
            const indicator = document.getElementById('scene3-step-indicator');
            if (indicator) {
                indicator.textContent = '步骤 ' + (currentState + 1) + '/' + totalSteps;
            }

            // 更新按钮状态
            const prevBtn = document.getElementById('scene3-btn-prev');
            const nextBtn = document.getElementById('scene3-btn-next');
            if (prevBtn) {
                prevBtn.style.opacity = currentState === 0 ? '0.5' : '1';
                prevBtn.style.cursor = currentState === 0 ? 'not-allowed' : 'pointer';
            }
            if (nextBtn) {
                nextBtn.style.opacity = currentState === totalSteps - 1 ? '0.5' : '1';
                nextBtn.style.cursor = currentState === totalSteps - 1 ? 'not-allowed' : 'pointer';
            }

            // 更新自转箭头颜色（步骤 1 开始高亮）
            const leftArrow = document.getElementById('scene3-left-arrow');
            const rightArrow = document.getElementById('scene3-right-arrow');
            if (currentState >= 1) {
                if (leftArrow) leftArrow.setAttribute('stroke', '#1565c0');
                if (rightArrow) rightArrow.setAttribute('stroke', '#2e7d32');
            } else {
                if (leftArrow) leftArrow.setAttribute('stroke', '#000000');
                if (rightArrow) rightArrow.setAttribute('stroke', '#000000');
            }

            // 更新 A、B 点颜色（步骤 2 开始高亮）
            const pointA = document.getElementById('scene3-point-a');
            const pointB = document.getElementById('scene3-point-b');
            if (currentState >= 2) {
                if (pointA) pointA.setAttribute('fill', '#1565c0');
                if (pointB) pointB.setAttribute('fill', '#2e7d32');
            } else {
                if (pointA) pointA.setAttribute('fill', '#9e9e9e');
                if (pointB) pointB.setAttribute('fill', '#9e9e9e');
            }
        }

        // 事件处理：上一步
        function handlePrev() {
            if (currentState > 0) {
                currentState--;
                renderStep();
            }
        }

        // 事件处理：下一步
        function handleNext() {
            if (currentState < totalSteps - 1) {
                currentState++;
                renderStep();
            }
        }

        // 绑定事件
        document.getElementById('scene3-btn-prev').addEventListener('click', handlePrev);
        document.getElementById('scene3-btn-next').addEventListener('click', handleNext);

        // 初始化
        renderStep();
    })();
    </script>
</body>
</html>
