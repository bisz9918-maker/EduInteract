<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极地俯视图的南北半球判读</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        /* 元素样式 */
        .scene1-circle {
            fill: none;
            stroke: #000000;
            stroke-width: 2;
        }
        .scene1-radial-line {
            stroke: #000000;
            stroke-width: 2;
        }
        .scene1-point {
            fill: #888888;
        }
        .scene1-point-highlight {
            fill: #1565c0;
        }
        .scene1-point-b-highlight {
            fill: #2e7d32;
        }
        .scene1-arrow {
            fill: none;
            stroke: #888888;
            stroke-width: 2;
        }
        .scene1-arrow-highlight {
            stroke: #1565c0;
            stroke-width: 3;
        }
        .scene1-label {
            font-size: 14px;
            fill: #000000;
        }
        .scene1-title {
            font-size: 16px;
            font-weight: bold;
        }
        .scene1-title-left {
            fill: #1565c0;
        }
        .scene1-title-right {
            fill: #2e7d32;
        }
        .scene1-direction-label {
            font-size: 14px;
            fill: #1565c0;
        }
        .scene1-hemisphere-label {
            font-size: 14px;
            font-weight: bold;
        }
        .scene1-mnemonic {
            font-size: 16px;
            font-weight: bold;
            fill: #1565c0;
        }
        .scene1-conclusion {
            font-size: 18px;
            font-weight: bold;
            fill: #2e7d32;
        }
        /* 控件样式 */
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }
        .scene1-btn {
            padding: 8px 20px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        #scene1-btn-prev {
            background-color: #e0e0e0;
            color: #333;
        }
        #scene1-btn-prev:hover {
            background-color: #c0c0c0;
        }
        #scene1-btn-prev:disabled {
            background-color: #f0f0f0;
            color: #aaa;
            cursor: not-allowed;
        }
        #scene1-btn-next {
            background-color: #1565c0;
            color: #fff;
        }
        #scene1-btn-next:hover {
            background-color: #0d47a1;
        }
        #scene1-btn-next:disabled {
            background-color: #90caf9;
            cursor: not-allowed;
        }
        #scene1-step-indicator {
            font-size: 14px;
            color: #666;
            min-width: 80px;
            text-align: center;
        }
        /* 过渡动画 */
        .scene1-fade {
            transition: opacity 0.3s ease-out;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <!-- 左图标题 -->
            <text id="scene1-title-left" x="240" y="40" text-anchor="middle" class="scene1-title scene1-title-left" opacity="0">北半球俯视图</text>
            
            <!-- 右图标题 -->
            <text id="scene1-title-right" x="560" y="40" text-anchor="middle" class="scene1-title scene1-title-right" opacity="0">南半球俯视图</text>
            
            <!-- 左图（北半球俯视图）中心(240,220) -->
            <!-- 外圆 -->
            <circle id="scene1-left-outer" cx="240" cy="220" r="120" class="scene1-circle"/>
            <!-- 内圆 -->
            <circle id="scene1-left-inner" cx="240" cy="220" r="40" class="scene1-circle"/>
            
            <!-- 左图经线（8条放射状，45°间隔） -->
            <!-- 0°经线（竖直向下） -->
            <line id="scene1-left-0deg" x1="240" y1="260" x2="240" y2="340" class="scene1-radial-line"/>
            <!-- 45°经线 -->
            <line x1="240" y1="220" x2="324.85" y2="304.85" class="scene1-radial-line"/>
            <!-- 90°经线（水平向右） -->
            <line x1="240" y1="220" x2="360" y2="220" class="scene1-radial-line"/>
            <!-- 135°经线 -->
            <line x1="240" y1="220" x2="324.85" y2="135.15" class="scene1-radial-line"/>
            <!-- 180°经线（竖直向上） -->
            <line id="scene1-left-180deg" x1="240" y1="180" x2="240" y2="100" class="scene1-radial-line"/>
            <!-- 225°经线 -->
            <line x1="240" y1="220" x2="155.15" y2="135.15" class="scene1-radial-line"/>
            <!-- 270°经线（水平向左） -->
            <line x1="240" y1="220" x2="120" y2="220" class="scene1-radial-line"/>
            <!-- 315°经线 -->
            <line x1="240" y1="220" x2="155.15" y2="304.85" class="scene1-radial-line"/>
            
            <!-- 左图0°标签 -->
            <text id="scene1-left-0-label" x="240" y="365" text-anchor="middle" class="scene1-label">0°</text>
            <!-- 左图180°标签 -->
            <text id="scene1-left-180-label" x="240" y="75" text-anchor="middle" class="scene1-label">180°</text>
            
            <!-- 左图自转箭头（逆时针，左侧外围） -->
            <path id="scene1-arrow-left" d="M 100 180 A 60 80 0 0 1 100 260" class="scene1-arrow" fill="none"/>
            <polygon id="scene1-arrow-left-head" points="100,180 95,190 105,190" fill="#888888"/>
            
            <!-- 左图逆时针标签 -->
            <text id="scene1-left-direction" x="100" y="140" text-anchor="middle" class="scene1-direction-label" opacity="0">逆时针</text>
            
            <!-- 左图北逆标注 -->
            <text id="scene1-left-mnemonic" x="240" y="180" text-anchor="middle" class="scene1-mnemonic" opacity="0">北逆</text>
            
            <!-- A点 -->
            <circle id="scene1-point-a" cx="185" cy="165" r="6" class="scene1-point"/>
            <!-- A点半球标注 -->
            <text id="scene1-point-a-label" x="155" y="145" class="scene1-hemisphere-label scene1-title-left" opacity="0">北半球</text>
            
            <!-- 右图（南半球俯视图）中心(560,220) -->
            <!-- 外圆 -->
            <circle id="scene1-right-outer" cx="560" cy="220" r="120" class="scene1-circle"/>
            <!-- 内圆 -->
            <circle id="scene1-right-inner" cx="560" cy="220" r="40" class="scene1-circle"/>
            
            <!-- 右图经线（8条放射状，45°间隔） -->
            <!-- 0°经线（竖直向下） -->
            <line id="scene1-right-0deg" x1="560" y1="260" x2="560" y2="340" class="scene1-radial-line"/>
            <!-- 45°经线 -->
            <line x1="560" y1="220" x2="644.85" y2="304.85" class="scene1-radial-line"/>
            <!-- 90°经线（水平向右） -->
            <line x1="560" y1="220" x2="680" y2="220" class="scene1-radial-line"/>
            <!-- 135°经线 -->
            <line x1="560" y1="220" x2="644.85" y2="135.15" class="scene1-radial-line"/>
            <!-- 180°经线（竖直向上） -->
            <line id="scene1-right-180deg" x1="560" y1="180" x2="560" y2="100" class="scene1-radial-line"/>
            <!-- 225°经线 -->
            <line x1="560" y1="220" x2="475.15" y2="135.15" class="scene1-radial-line"/>
            <!-- 270°经线（水平向左） -->
            <line x1="560" y1="220" x2="440" y2="220" class="scene1-radial-line"/>
            <!-- 315°经线 -->
            <line x1="560" y1="220" x2="475.15" y2="304.85" class="scene1-radial-line"/>
            
            <!-- 右图0°标签 -->
            <text id="scene1-right-0-label" x="560" y="365" text-anchor="middle" class="scene1-label">0°</text>
            <!-- 右图180°标签 -->
            <text id="scene1-right-180-label" x="560" y="75" text-anchor="middle" class="scene1-label">180°</text>
            
            <!-- 右图自转箭头（顺时针，右侧外围） -->
            <path id="scene1-arrow-right" d="M 700 180 A 60 80 0 0 0 700 260" class="scene1-arrow" fill="none"/>
            <polygon id="scene1-arrow-right-head" points="700,260 695,250 705,250" fill="#888888"/>
            
            <!-- 右图顺时针标签 -->
            <text id="scene1-right-direction" x="660" y="280" text-anchor="middle" class="scene1-direction-label" opacity="0">顺时针</text>
            
            <!-- 右图南顺标注 -->
            <text id="scene1-right-mnemonic" x="560" y="260" text-anchor="middle" class="scene1-mnemonic" opacity="0">南顺</text>
            
            <!-- B点 -->
            <circle id="scene1-point-b" cx="615" cy="275" r="6" class="scene1-point"/>
            <!-- B点半球标注 -->
            <text id="scene1-point-b-label" x="585" y="295" class="scene1-hemisphere-label scene1-title-right" opacity="0">南半球</text>
            
            <!-- 结论文字 -->
            <text id="scene1-conclusion" x="400" y="420" text-anchor="middle" class="scene1-conclusion" opacity="0">答案：C正确（B点在南半球）</text>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/5</span>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现：极地俯视图的南北半球判读
        
        // 状态变量
        let currentStep = 0;
        const totalSteps = 5;
        
        // 获取DOM元素
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        
        // 需要控制的元素
        const titleLeft = document.getElementById('scene1-title-left');
        const titleRight = document.getElementById('scene1-title-right');
        const arrowLeft = document.getElementById('scene1-arrow-left');
        const arrowLeftHead = document.getElementById('scene1-arrow-left-head');
        const arrowRight = document.getElementById('scene1-arrow-right');
        const arrowRightHead = document.getElementById('scene1-arrow-right-head');
        const leftDirection = document.getElementById('scene1-left-direction');
        const rightDirection = document.getElementById('scene1-right-direction');
        const leftMnemonic = document.getElementById('scene1-left-mnemonic');
        const rightMnemonic = document.getElementById('scene1-right-mnemonic');
        const pointA = document.getElementById('scene1-point-a');
        const pointB = document.getElementById('scene1-point-b');
        const pointALabel = document.getElementById('scene1-point-a-label');
        const pointBLabel = document.getElementById('scene1-point-b-label');
        const conclusion = document.getElementById('scene1-conclusion');
        
        // 工具函数：显示元素
        function show(el) {
            el.style.opacity = '1';
            el.style.display = '';
        }
        
        // 工具函数：隐藏元素
        function hide(el) {
            el.style.opacity = '0';
            el.style.display = 'none';
        }
        
        // 更新步骤显示
        function updateStep() {
            // 更新步骤指示器
            stepIndicator.textContent = `步骤 ${currentStep + 1}/${totalSteps}`;
            
            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps - 1);
            
            // 根据步骤显示/隐藏元素
            switch(currentStep) {
                case 0:
                    // 初始状态：只显示基础图形
                    hide(titleLeft);
                    hide(titleRight);
                    hide(leftDirection);
                    hide(rightDirection);
                    hide(leftMnemonic);
                    hide(rightMnemonic);
                    hide(pointALabel);
                    hide(pointBLabel);
                    hide(conclusion);
                    // 箭头恢复默认样式
                    arrowLeft.classList.remove('scene1-arrow-highlight');
                    arrowLeftHead.setAttribute('fill', '#888888');
                    arrowRight.classList.remove('scene1-arrow-highlight');
                    arrowRightHead.setAttribute('fill', '#888888');
                    // 点恢复默认样式
                    pointA.classList.remove('scene1-point-highlight');
                    pointB.classList.remove('scene1-point-b-highlight');
                    break;
                    
                case 1:
                    // 步骤1：高亮左图逆时针箭头
                    show(titleLeft);
                    hide(titleRight);
                    show(leftDirection);
                    hide(rightDirection);
                    show(leftMnemonic);
                    hide(rightMnemonic);
                    hide(pointALabel);
                    hide(pointBLabel);
                    hide(conclusion);
                    // 左箭头高亮
                    arrowLeft.classList.add('scene1-arrow-highlight');
                    arrowLeftHead.setAttribute('fill', '#1565c0');
                    // 右箭头默认
                    arrowRight.classList.remove('scene1-arrow-highlight');
                    arrowRightHead.setAttribute('fill', '#888888');
                    // 点默认
                    pointA.classList.remove('scene1-point-highlight');
                    pointB.classList.remove('scene1-point-b-highlight');
                    break;
                    
                case 2:
                    // 步骤2：高亮右图顺时针箭头
                    show(titleLeft);
                    show(titleRight);
                    show(leftDirection);
                    show(rightDirection);
                    show(leftMnemonic);
                    show(rightMnemonic);
                    hide(pointALabel);
                    hide(pointBLabel);
                    hide(conclusion);
                    // 左右箭头都高亮
                    arrowLeft.classList.add('scene1-arrow-highlight');
                    arrowLeftHead.setAttribute('fill', '#1565c0');
                    arrowRight.classList.add('scene1-arrow-highlight');
                    arrowRightHead.setAttribute('fill', '#1565c0');
                    // 点默认
                    pointA.classList.remove('scene1-point-highlight');
                    pointB.classList.remove('scene1-point-b-highlight');
                    break;
                    
                case 3:
                    // 步骤3：高亮A、B点并标注半球
                    show(titleLeft);
                    show(titleRight);
                    show(leftDirection);
                    show(rightDirection);
                    show(leftMnemonic);
                    show(rightMnemonic);
                    show(pointALabel);
                    show(pointBLabel);
                    hide(conclusion);
                    // 箭头保持高亮
                    arrowLeft.classList.add('scene1-arrow-highlight');
                    arrowLeftHead.setAttribute('fill', '#1565c0');
                    arrowRight.classList.add('scene1-arrow-highlight');
                    arrowRightHead.setAttribute('fill', '#1565c0');
                    // 点高亮
                    pointA.classList.add('scene1-point-highlight');
                    pointB.classList.add('scene1-point-b-highlight');
                    break;
                    
                case 4:
                    // 步骤4：显示结论
                    show(titleLeft);
                    show(titleRight);
                    show(leftDirection);
                    show(rightDirection);
                    show(leftMnemonic);
                    show(rightMnemonic);
                    show(pointALabel);
                    show(pointBLabel);
                    show(conclusion);
                    // 箭头保持高亮
                    arrowLeft.classList.add('scene1-arrow-highlight');
                    arrowLeftHead.setAttribute('fill', '#1565c0');
                    arrowRight.classList.add('scene1-arrow-highlight');
                    arrowRightHead.setAttribute('fill', '#1565c0');
                    // 点保持高亮
                    pointA.classList.add('scene1-point-highlight');
                    pointB.classList.add('scene1-point-b-highlight');
                    break;
            }
        }
        
        // 前进一步
        function stepForward() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateStep();
            }
        }
        
        // 后退一步
        function stepBackward() {
            if (currentStep > 0) {
                currentStep--;
                updateStep();
            }
        }
        
        // 绑定事件
        btnPrev.addEventListener('click', stepBackward);
        btnNext.addEventListener('click', stepForward);
        
        // 初始化
        updateStep();
    })();
    </script>
</body>
</html>
