<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安培定则判断螺线管磁极极性</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-svg { width: 800px; height: 500px; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 螺线管铁芯 -->
            <rect id="scene2-solenoid-core" x="460" y="150" width="80" height="200" fill="#f5f5f5" stroke="#000000" stroke-width="2"/>
            
            <!-- 线圈绕线 (6 匝) -->
            <path id="scene2-coil-path" d="M 460 350 L 540 350 L 540 333 L 460 333 L 460 317 L 540 317 L 540 300 L 460 300 L 460 283 L 540 283 L 540 267 L 460 267 L 460 250 L 540 250 L 540 233 L 460 233 L 460 217 L 540 217 L 540 200 L 460 200 L 460 183 L 540 183 L 540 167 L 460 167 L 460 150" 
                  fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
            
            <!-- 电流流入标注 -->
            <text id="scene2-label-current-in" x="430" y="365" font-size="14" fill="#333">电流流入</text>
            <path id="scene2-arrow-current-in" d="M 445 360 L 455 360 L 455 355 L 460 360 L 455 365 L 455 360 Z" fill="#333"/>
            
            <!-- 电流方向箭头 (步骤 1 显示) -->
            <g id="scene2-current-arrows" style="display: none;">
                <path id="scene2-current-arrow-1" d="M 465 320 L 480 320 L 480 315 L 490 320 L 480 325 L 480 320 Z" fill="#1565c0"/>
                <path id="scene2-current-arrow-2" d="M 465 250 L 480 250 L 480 245 L 490 250 L 480 255 L 480 250 Z" fill="#1565c0"/>
                <path id="scene2-current-arrow-3" d="M 465 180 L 480 180 L 480 175 L 490 180 L 480 185 L 480 180 Z" fill="#1565c0"/>
            </g>
            
            <!-- 右手示意图 (步骤 2 显示) -->
            <g id="scene2-right-hand" style="display: none;">
                <!-- 手掌轮廓 -->
                <path d="M 580 280 Q 570 240 580 200 Q 600 170 640 170 Q 680 170 700 200 Q 710 240 700 280 Q 680 320 640 320 Q 600 320 580 280 Z" 
                      fill="#2e7d32" fill-opacity="0.3" stroke="#2e7d32" stroke-width="2"/>
                <!-- 四指弯曲示意 -->
                <path d="M 590 260 Q 610 240 640 240 Q 670 240 690 260" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round"/>
                <path d="M 590 280 Q 610 260 640 260 Q 670 260 690 280" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round"/>
                <path d="M 590 300 Q 610 280 640 280 Q 670 280 690 300" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round"/>
            </g>
            
            <!-- 大拇指 (步骤 3 显示) -->
            <g id="scene2-thumb" style="display: none;">
                <line x1="640" y1="200" x2="640" y2="130" stroke="#2e7d32" stroke-width="8" stroke-linecap="round"/>
                <polygon points="640,120 630,135 650,135" fill="#2e7d32"/>
            </g>
            
            <!-- N 极标注 (步骤 3 显示) -->
            <text id="scene2-label-n" x="500" y="110" font-size="28" font-weight="bold" fill="#c62828" style="display: none;">N</text>
            
            <!-- S 极标注 (步骤 4 显示) -->
            <text id="scene2-label-s" x="500" y="395" font-size="28" font-weight="bold" fill="#c62828" style="display: none;">S</text>
            
            <!-- 磁感线 (步骤 4 显示) -->
            <g id="scene2-magnetic-lines" style="display: none;">
                <!-- 左侧磁感线 -->
                <path d="M 480 130 Q 420 180 420 250 Q 420 320 480 370" fill="none" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5"/>
                <!-- 右侧磁感线 -->
                <path d="M 520 130 Q 580 180 580 250 Q 580 320 520 370" fill="none" stroke="#888888" stroke-width="1.5" stroke-dasharray="5,5"/>
                <!-- 磁感线方向箭头 -->
                <polygon points="420,250 415,240 425,240" fill="#888888"/>
                <polygon points="580,250 575,240 585,240" fill="#888888"/>
            </g>
            
            <!-- 控件栏 -->
            <g id="scene2-controls">
                <rect id="scene2-btn-prev-bg" x="310" y="440" width="90" height="30" fill="#f0f0f0" stroke="#333" stroke-width="1" rx="4"/>
                <text id="scene2-btn-prev-text" x="355" y="460" font-size="14" text-anchor="middle" fill="#333">◀ 上一步</text>
                
                <rect id="scene2-btn-next-bg" x="420" y="440" width="90" height="30" fill="#f0f0f0" stroke="#333" stroke-width="1" rx="4"/>
                <text id="scene2-btn-next-text" x="465" y="460" font-size="14" text-anchor="middle" fill="#333">下一步 ▶</text>
                
                <text id="scene2-step-indicator" x="540" y="460" font-size="14" text-anchor="middle" fill="#333">步骤 0/4</text>
            </g>
        </svg>
    </div>
    
    <script>
    (function() {
        // Scene 2: 安培定则判断螺线管磁极极性
        let currentState = 0;
        const totalSteps = 4;
        
        // 获取 DOM 元素
        const currentArrows = document.getElementById('scene2-current-arrows');
        const rightHand = document.getElementById('scene2-right-hand');
        const thumb = document.getElementById('scene2-thumb');
        const labelN = document.getElementById('scene2-label-n');
        const labelS = document.getElementById('scene2-label-s');
        const magneticLines = document.getElementById('scene2-magnetic-lines');
        const stepIndicator = document.getElementById('scene2-step-indicator');
        
        // 按钮点击区域 (SVG 内的矩形)
        const prevBtnBg = document.getElementById('scene2-btn-prev-bg');
        const nextBtnBg = document.getElementById('scene2-btn-next-bg');
        const prevBtnText = document.getElementById('scene2-btn-prev-text');
        const nextBtnText = document.getElementById('scene2-btn-next-text');
        
        // 更新显示状态
        function updateDisplay() {
            // 根据当前状态显示/隐藏元素
            if (currentState >= 1) {
                currentArrows.style.display = 'block';
            } else {
                currentArrows.style.display = 'none';
            }
            
            if (currentState >= 2) {
                rightHand.style.display = 'block';
            } else {
                rightHand.style.display = 'none';
            }
            
            if (currentState >= 3) {
                thumb.style.display = 'block';
                labelN.style.display = 'block';
            } else {
                thumb.style.display = 'none';
                labelN.style.display = 'none';
            }
            
            if (currentState >= 4) {
                labelS.style.display = 'block';
                magneticLines.style.display = 'block';
            } else {
                labelS.style.display = 'none';
                magneticLines.style.display = 'none';
            }
            
            // 更新步骤指示
            stepIndicator.textContent = '步骤 ' + currentState + '/' + totalSteps;
            
            // 更新按钮状态
            prevBtnBg.style.opacity = currentState > 0 ? '1' : '0.5';
            prevBtnText.style.opacity = currentState > 0 ? '1' : '0.5';
            
            nextBtnBg.style.opacity = currentState < totalSteps ? '1' : '0.5';
            nextBtnText.style.opacity = currentState < totalSteps ? '1' : '0.5';
        }
        
        // 按钮点击事件
        prevBtnBg.addEventListener('click', function() {
            if (currentState > 0) {
                currentState--;
                updateDisplay();
            }
        });
        
        nextBtnBg.addEventListener('click', function() {
            if (currentState < totalSteps) {
                currentState++;
                updateDisplay();
            }
        });
        
        // 设置按钮光标
        prevBtnBg.style.cursor = 'pointer';
        nextBtnBg.style.cursor = 'pointer';
        
        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
