<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>串联电路结构分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-svg { width: 800px; height: 500px; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene1-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #333; border-radius: 4px; background: #f5f5f5; }
        .scene1-btn:hover { background: #e0e0e0; }
        .scene1-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene1-step-indicator { font-size: 14px; color: #333; margin-left: 10px; }
        /* 高亮样式 */
        .scene1-highlight-blue { stroke: #1565c0 !important; stroke-width: 3px; }
        .scene1-highlight-green { stroke: #2e7d32 !important; stroke-width: 3px; }
        .scene1-highlight-red { stroke: #c62828 !important; stroke-width: 3px; }
        /* 隐藏类 */
        .scene1-hidden { display: none; opacity: 0; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene1-arrow-blue" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
                    <path d="M0,0 L10,5 L0,10 Z" fill="#1565c0" />
                </marker>
                <marker id="scene1-arrow-green" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
                    <path d="M0,0 L10,5 L0,10 Z" fill="#2e7d32" />
                </marker>
                <marker id="scene1-arrow-red" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
                    <path d="M0,0 L10,5 L0,10 Z" fill="#c62828" />
                </marker>
            </defs>

            <!-- 导线 -->
            <!-- 导线1: 电源→电流表 -->
            <line id="scene1-wire1" x1="180" y1="250" x2="220" y2="250" stroke="#000000" stroke-width="2" fill="none" />
            <!-- 导线2: 电流表→变阻器左端 -->
            <line id="scene1-wire2" x1="240" y1="250" x2="240" y2="350" stroke="#000000" stroke-width="2" fill="none" />
            <!-- 导线3: 变阻器右端→灯泡 -->
            <line id="scene1-wire3" x1="520" y1="350" x2="620" y2="350" stroke="#000000" stroke-width="2" fill="none" />
            <!-- 导线4: 灯泡下→上 -->
            <line id="scene1-wire4" x1="620" y1="350" x2="620" y2="250" stroke="#000000" stroke-width="2" fill="none" />
            <!-- 导线5: 灯泡→开关 -->
            <line id="scene1-wire5" x1="620" y1="250" x2="620" y2="150" stroke="#000000" stroke-width="2" fill="none" />
            <!-- 导线6: 开关→电源 -->
            <line id="scene1-wire6" x1="520" y1="150" x2="440" y2="150" stroke="#000000" stroke-width="2" fill="none" />
            <!-- 导线7: 开关左→电源上 -->
            <line id="scene1-wire7" x1="440" y1="150" x2="180" y2="150" stroke="#000000" stroke-width="2" fill="none" />
            <!-- 导线8: 电源上→下 -->
            <line id="scene1-wire8" x1="180" y1="150" x2="180" y2="250" stroke="#000000" stroke-width="2" fill="none" />
            <!-- 电压表引线1: 变阻器左→电压表 -->
            <line id="scene1-wire-v1" x1="240" y1="350" x2="240" y2="290" stroke="#000000" stroke-width="2" fill="none" />
            <!-- 电压表引线2: 滑片→电压表 -->
            <line id="scene1-wire-v2" x1="400" y1="350" x2="400" y2="290" stroke="#000000" stroke-width="2" fill="none" />

            <!-- 电源 (电池符号) -->
            <g id="scene1-power">
                <!-- 长线(正极) -->
                <line x1="150" y1="235" x2="150" y2="265" stroke="#000000" stroke-width="2" />
                <!-- 短线(负极) -->
                <line x1="170" y1="240" x2="170" y2="260" stroke="#000000" stroke-width="3" />
                <!-- 虚线表示电池组 -->
                <line x1="155" y1="250" x2="165" y2="250" stroke="#000000" stroke-width="1" stroke-dasharray="3,3" />
                <text id="scene1-label-u" x="160" y="220" text-anchor="middle" font-size="16" fill="#000000">U</text>
            </g>

            <!-- 电流表 A -->
            <g id="scene1-ammeter">
                <circle id="scene1-ammeter-circle" cx="220" cy="250" r="20" stroke="#000000" stroke-width="2" fill="none" />
                <text x="220" y="255" text-anchor="middle" font-size="18" fill="#000000">A</text>
                <text id="scene1-label-a" x="250" y="255" text-anchor="start" font-size="14" fill="#000000">A</text>
            </g>

            <!-- 开关 S -->
            <g id="scene1-switch">
                <!-- 开关底座 -->
                <line x1="480" y1="150" x2="500" y2="150" stroke="#000000" stroke-width="2" />
                <line x1="520" y1="150" x2="540" y2="150" stroke="#000000" stroke-width="2" />
                <!-- 开关臂(断开状态) -->
                <line id="scene1-switch-arm" x1="500" y1="150" x2="520" y2="135" stroke="#000000" stroke-width="2" />
                <text id="scene1-label-s" x="510" y="125" text-anchor="middle" font-size="14" fill="#000000">S</text>
            </g>

            <!-- 灯泡 L -->
            <g id="scene1-bulb">
                <circle id="scene1-bulb-circle" cx="620" cy="250" r="20" stroke="#000000" stroke-width="2" fill="none" />
                <!-- 灯泡内的× -->
                <line x1="610" y1="240" x2="630" y2="260" stroke="#000000" stroke-width="2" />
                <line x1="630" y1="240" x2="610" y2="260" stroke="#000000" stroke-width="2" />
                <text id="scene1-label-l" x="650" y="255" text-anchor="start" font-size="14" fill="#000000">L</text>
            </g>

            <!-- 滑动变阻器 -->
            <g id="scene1-rheostat">
                <!-- 电阻丝(长方形) -->
                <rect id="scene1-rheostat-rect" x="280" y="350" width="240" height="20" stroke="#000000" stroke-width="2" fill="none" />
                <!-- 滑片 P -->
                <g id="scene1-slider">
                    <!-- 滑片箭头 -->
                    <polygon id="scene1-slider-arrow" points="400,330 393,345 407,345" fill="#000000" />
                    <line x1="400" y1="330" x2="400" y2="350" stroke="#000000" stroke-width="2" />
                    <text id="scene1-label-p" x="400" y="315" text-anchor="middle" font-size="14" fill="#000000">P</text>
                </g>
                <text id="scene1-label-r" x="400" y="390" text-anchor="middle" font-size="16" fill="#000000">R</text>
            </g>

            <!-- 电压表 V -->
            <g id="scene1-voltmeter">
                <circle id="scene1-voltmeter-circle" cx="400" cy="290" r="20" stroke="#000000" stroke-width="2" fill="none" />
                <text x="400" y="295" text-anchor="middle" font-size="18" fill="#000000">V</text>
                <text id="scene1-label-v" x="400" y="265" text-anchor="middle" font-size="14" fill="#000000">V</text>
            </g>

            <!-- 步骤1: 电流路径高亮(蓝色) - 初始隐藏 -->
            <g id="scene1-step1-highlights" class="scene1-hidden">
                <!-- 电流方向箭头 -->
                <circle cx="200" cy="250" r="5" fill="#1565c0" opacity="0.6" />
                <circle cx="240" cy="300" r="5" fill="#1565c0" opacity="0.6" />
                <circle cx="570" cy="350" r="5" fill="#1565c0" opacity="0.6" />
                <circle cx="620" cy="300" r="5" fill="#1565c0" opacity="0.6" />
                <circle cx="620" cy="200" r="5" fill="#1565c0" opacity="0.6" />
                <circle cx="530" cy="150" r="5" fill="#1565c0" opacity="0.6" />
                <circle cx="350" cy="150" r="5" fill="#1565c0" opacity="0.6" />
                <circle cx="180" cy="200" r="5" fill="#1565c0" opacity="0.6" />
                <text x="400" y="80" text-anchor="middle" font-size="14" fill="#1565c0">电流表串联在干路中，测量整个电路的电流</text>
            </g>

            <!-- 步骤2: 电压表高亮(绿色) - 初始隐藏 -->
            <g id="scene1-step2-highlights" class="scene1-hidden">
                <!-- 电压表引线高亮 -->
                <line x1="240" y1="350" x2="240" y2="290" stroke="#2e7d32" stroke-width="3" />
                <line x1="400" y1="350" x2="400" y2="290" stroke="#2e7d32" stroke-width="3" />
                <!-- 连接点高亮 -->
                <circle cx="240" cy="350" r="6" fill="#2e7d32" opacity="0.6" />
                <circle cx="400" cy="350" r="6" fill="#2e7d32" opacity="0.6" />
                <text x="400" y="80" text-anchor="middle" font-size="14" fill="#2e7d32">电压表并联在滑动变阻器两端，测量变阻器两端电压</text>
            </g>

            <!-- 步骤3: 滑片移动示意(红色) - 初始隐藏 -->
            <g id="scene1-step3-highlights" class="scene1-hidden">
                <!-- 底部双向箭头 -->
                <line x1="300" y1="420" x2="500" y2="420" stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrow-red)" marker-start="url(#scene1-arrow-red)" />
                <!-- 左移标签 -->
                <text x="285" y="440" text-anchor="middle" font-size="14" fill="#c62828">R 增大</text>
                <!-- 右移标签 -->
                <text x="515" y="440" text-anchor="middle" font-size="14" fill="#c62828">R 减小</text>
                <text x="400" y="80" text-anchor="middle" font-size="14" fill="#c62828">滑片左移时接入电阻增大，右移时接入电阻减小</text>
            </g>

            <!-- 控制按钮区 -->
            <g id="scene1-controls-group">
                <rect x="280" y="455" width="240" height="35" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="4" />
            </g>
        </svg>

        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn" disabled>◀ 上一步</button>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
            <span id="scene1-step-indicator" class="scene1-step-indicator">步骤 1/4</span>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现 - 串联电路结构分析

        // 状态变量
        let currentStep = 0;
        const totalSteps = 4;

        // DOM 元素
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');

        // 高亮组
        const step1Highlights = document.getElementById('scene1-step1-highlights');
        const step2Highlights = document.getElementById('scene1-step2-highlights');
        const step3Highlights = document.getElementById('scene1-step3-highlights');

        // 元件元素
        const ammeterCircle = document.getElementById('scene1-ammeter-circle');
        const voltmeterCircle = document.getElementById('scene1-voltmeter-circle');
        const wires = document.querySelectorAll('[id^="scene1-wire"]');

        // 更新显示状态
        function updateDisplay() {
            // 隐藏所有高亮
            step1Highlights.classList.add('scene1-hidden');
            step2Highlights.classList.add('scene1-hidden');
            step3Highlights.classList.add('scene1-hidden');

            // 重置元件样式
            ammeterCircle.setAttribute('stroke', '#000000');
            ammeterCircle.setAttribute('stroke-width', '2');
            voltmeterCircle.setAttribute('stroke', '#000000');
            voltmeterCircle.setAttribute('stroke-width', '2');
            wires.forEach(wire => {
                wire.setAttribute('stroke', '#000000');
                wire.setAttribute('stroke-width', '2');
            });

            // 根据当前步骤显示对应高亮
            switch (currentStep) {
                case 0:
                    // 初始状态 - 无高亮
                    break;
                case 1:
                    // 步骤1: 电流表高亮
                    step1Highlights.classList.remove('scene1-hidden');
                    ammeterCircle.setAttribute('stroke', '#1565c0');
                    ammeterCircle.setAttribute('stroke-width', '3');
                    break;
                case 2:
                    // 步骤2: 电压表高亮
                    step2Highlights.classList.remove('scene1-hidden');
                    voltmeterCircle.setAttribute('stroke', '#2e7d32');
                    voltmeterCircle.setAttribute('stroke-width', '3');
                    break;
                case 3:
                    // 步骤3: 滑片移动示意
                    step3Highlights.classList.remove('scene1-hidden');
                    break;
            }

            // 更新按钮状态
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps - 1;

            // 更新步骤指示器
            stepIndicator.textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;
        }

        // 按钮事件
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateDisplay();
            }
        });

        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
