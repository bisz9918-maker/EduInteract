<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>凸透镜成像规律 - 物距变化演示</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-svg { width: 800px; height: 500px; }
        .scene2-label { font-size: 14px; fill: #000000; }
        .scene2-value { font-size: 13px; fill: #000000; }
        .scene2-axis { stroke: #000000; stroke-width: 3; fill: none; }
        .scene2-lens { stroke: #000000; stroke-width: 2; fill: none; }
        .scene2-candle-body { fill: #8d6e63; }
        .scene2-candle-flame { fill: #ff9800; }
        .scene2-screen { fill: #bdbdbd; fill-opacity: 0.3; stroke: #757575; stroke-width: 1; }
        .scene2-real-image { stroke: #c62828; stroke-width: 2; fill: none; }
        .scene2-virtual-image { stroke: #1565c0; stroke-width: 2; fill: none; stroke-dasharray: 5,5; }
        .scene2-distance-arrow { stroke: #1565c0; stroke-width: 2; fill: none; }
        .scene2-distance-label { font-size: 12px; fill: #1565c0; font-weight: bold; }
        .scene2-point { fill: #000000; }
        .scene2-slider-track { stroke: #888888; stroke-width: 6; fill: none; }
        .scene2-slider-handle { fill: #1565c0; cursor: pointer; }
        .scene2-display-box { fill: #e3f2fd; stroke: #90caf9; stroke-width: 1; }
        .scene2-type-box { fill: #e3f2fd; stroke: #90caf9; stroke-width: 1; }
        .scene2-warning { fill: #fff3e0; stroke: #ffb74d; stroke-width: 1; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 主光轴 -->
            <line id="scene2-axis" x1="80" y1="300" x2="720" y2="300" class="scene2-axis"/>
            
            <!-- 凸透镜 -->
            <ellipse id="scene2-lens" cx="400" cy="300" rx="10" ry="60" class="scene2-lens"/>
            
            <!-- 焦点和2F点 -->
            <circle id="scene2-point-f-left" cx="320" cy="300" r="3" class="scene2-point"/>
            <text id="scene2-label-f-left" x="320" y="320" text-anchor="middle" class="scene2-label">F</text>
            
            <circle id="scene2-point-2f-left" cx="240" cy="300" r="3" class="scene2-point"/>
            <text id="scene2-label-2f-left" x="240" y="320" text-anchor="middle" class="scene2-label">2F</text>
            
            <circle id="scene2-point-f-right" cx="480" cy="300" r="3" class="scene2-point"/>
            <text id="scene2-label-f-right" x="480" y="320" text-anchor="middle" class="scene2-label">F</text>
            
            <circle id="scene2-point-2f-right" cx="560" cy="300" r="3" class="scene2-point"/>
            <text id="scene2-label-2f-right" x="560" y="320" text-anchor="middle" class="scene2-label">2F</text>
            
            <!-- 光心标签 -->
            <text id="scene2-label-o" x="400" y="325" text-anchor="middle" class="scene2-label">O</text>
            
            <!-- 蜡烛组 -->
            <g id="scene2-candle">
                <rect id="scene2-candle-body" x="0" y="260" width="12" height="40" class="scene2-candle-body"/>
                <polygon id="scene2-candle-flame" points="0,260 6,245 12,260" class="scene2-candle-flame"/>
            </g>
            
            <!-- 光屏 -->
            <g id="scene2-screen">
                <rect id="scene2-screen-rect" x="0" y="260" width="8" height="80" class="scene2-screen"/>
            </g>
            
            <!-- 实像（倒立箭头） -->
            <g id="scene2-real-image">
                <line id="scene2-real-image-line" x1="0" y1="300" x2="0" y2="300" class="scene2-real-image"/>
                <polygon id="scene2-real-image-arrow" points="0,300 -5,290 5,290" class="scene2-real-image"/>
            </g>
            
            <!-- 虚像（正立虚线箭头） -->
            <g id="scene2-virtual-image">
                <line id="scene2-virtual-image-line" x1="0" y1="300" x2="0" y2="300" class="scene2-virtual-image"/>
                <polygon id="scene2-virtual-image-arrow" points="0,300 -5,310 5,310" class="scene2-virtual-image"/>
            </g>
            
            <!-- 物距标注 -->
            <g id="scene2-label-u-group">
                <line id="scene2-u-arrow" x1="0" y1="275" x2="0" y2="275" class="scene2-distance-arrow"/>
                <text id="scene2-label-u" x="0" y="270" text-anchor="middle" class="scene2-distance-label">u</text>
            </g>
            
            <!-- 像距标注 -->
            <g id="scene2-label-v-group">
                <line id="scene2-v-arrow" x1="0" y1="275" x2="0" y2="275" class="scene2-distance-arrow"/>
                <text id="scene2-label-v" x="0" y="270" text-anchor="middle" class="scene2-distance-label">v</text>
            </g>
            
            <!-- 数值显示区 -->
            <rect id="scene2-display-bg" x="50" y="360" width="200" height="60" class="scene2-display-box"/>
            <text id="scene2-display-u" x="60" y="385" class="scene2-value">u = 2.5f</text>
            <text id="scene2-display-v" x="60" y="405" class="scene2-value">v = 1.67f</text>
            <text id="scene2-display-m" x="60" y="425" class="scene2-value">m = 0.67</text>
            
            <!-- 成像性质提示 -->
            <rect id="scene2-type-bg" x="550" y="360" width="200" height="40" class="scene2-type-box"/>
            <text id="scene2-display-type" x="650" y="385" text-anchor="middle" class="scene2-value">倒立缩小实像</text>
            
            <!-- 警告提示（u=f 时显示） -->
            <rect id="scene2-warning-bg" x="250" y="360" width="300" height="40" class="scene2-warning" style="display:none;"/>
            <text id="scene2-warning-text" x="400" y="385" text-anchor="middle" class="scene2-value">u = f 时不成像（平行光）</text>
            
            <!-- 滑块轨道 -->
            <line id="scene2-slider-track" x1="100" y1="460" x2="700" y2="460" class="scene2-slider-track"/>
            
            <!-- 滑块刻度 -->
            <line x1="160" y1="455" x2="160" y2="465" stroke="#888888" stroke-width="2"/>
            <text x="160" y="480" text-anchor="middle" class="scene2-label">3f</text>
            
            <line x1="240" y1="455" x2="240" y2="465" stroke="#888888" stroke-width="2"/>
            <text x="240" y="480" text-anchor="middle" class="scene2-label">2f</text>
            
            <line x1="320" y1="455" x2="320" y2="465" stroke="#888888" stroke-width="2"/>
            <text x="320" y="480" text-anchor="middle" class="scene2-label">f</text>
            
            <!-- 滑块手柄 -->
            <circle id="scene2-slider-handle" cx="200" cy="460" r="10" class="scene2-slider-handle"/>
        </svg>
    </div>
    
    <script>
    (function() {
        // 常量定义
        const LENS_X = 400;
        const AXIS_Y = 300;
        const F = 80; // 焦距（像素）
        const CANDLE_HEIGHT = 40;
        const CANDLE_WIDTH = 12;
        const SCREEN_WIDTH = 8;
        const SCREEN_HEIGHT = 80;
        
        // 滑块范围
        const SLIDER_MIN_X = 100;
        const SLIDER_MAX_X = 700;
        const SLIDER_MIN_U = 4 * F; // u 最大 4f
        const SLIDER_MAX_U = 1.1 * F; // u 最小 1.1f
        
        // 状态
        let state = {
            u: 2.5 * F, // 初始物距
            isDragging: false
        };
        
        // DOM 元素
        const candle = document.getElementById('scene2-candle');
        const candleBody = document.getElementById('scene2-candle-body');
        const candleFlame = document.getElementById('scene2-candle-flame');
        const screen = document.getElementById('scene2-screen');
        const screenRect = document.getElementById('scene2-screen-rect');
        const realImage = document.getElementById('scene2-real-image');
        const realImageLine = document.getElementById('scene2-real-image-line');
        const realImageArrow = document.getElementById('scene2-real-image-arrow');
        const virtualImage = document.getElementById('scene2-virtual-image');
        const virtualImageLine = document.getElementById('scene2-virtual-image-line');
        const virtualImageArrow = document.getElementById('scene2-virtual-image-arrow');
        const uArrow = document.getElementById('scene2-u-arrow');
        const labelU = document.getElementById('scene2-label-u');
        const vArrow = document.getElementById('scene2-v-arrow');
        const labelV = document.getElementById('scene2-label-v');
        const displayU = document.getElementById('scene2-display-u');
        const displayV = document.getElementById('scene2-display-v');
        const displayM = document.getElementById('scene2-display-m');
        const displayType = document.getElementById('scene2-display-type');
        const warningBg = document.getElementById('scene2-warning-bg');
        const warningText = document.getElementById('scene2-warning-text');
        const sliderHandle = document.getElementById('scene2-slider-handle');
        const displayBg = document.getElementById('scene2-display-bg');
        const typeBg = document.getElementById('scene2-type-bg');
        
        // 计算像距 v = uf/(u-f)
        function calculateV(u) {
            if (u <= F) return null; // 虚像
            return (u * F) / (u - F);
        }
        
        // 计算放大率 m = v/u
        function calculateM(u, v) {
            if (v === null) return F / (F - u); // 虚像放大率
            return v / u;
        }
        
        // 更新显示
        function updateDisplay() {
            const u = state.u;
            const v = calculateV(u);
            const m = calculateM(u, v);
            
            // 更新数值显示
            displayU.textContent = `u = ${(u/F).toFixed(2)}f`;
            
            if (v === null) {
                displayV.textContent = 'v = ∞';
                displayM.textContent = `m = ${Math.abs(m).toFixed(2)}`;
            } else {
                displayV.textContent = `v = ${(v/F).toFixed(2)}f`;
                displayM.textContent = `m = ${m.toFixed(2)}`;
            }
            
            // 更新成像性质
            if (u > 2 * F) {
                displayType.textContent = '倒立缩小实像';
            } else if (Math.abs(u - 2 * F) < 0.01 * F) {
                displayType.textContent = '倒立等大实像';
            } else if (u > F) {
                displayType.textContent = '倒立放大实像';
            } else {
                displayType.textContent = '正立放大虚像';
            }
            
            // 警告提示
            if (Math.abs(u - F) < 0.05 * F) {
                warningBg.style.display = 'block';
                displayBg.style.display = 'none';
                typeBg.style.display = 'none';
            } else {
                warningBg.style.display = 'none';
                displayBg.style.display = 'block';
                typeBg.style.display = 'block';
            }
        }
        
        // 更新所有元素位置
        function updateElements() {
            const u = state.u;
            const v = calculateV(u);
            const m = calculateM(u, v);
            
            // 蜡烛位置（左侧）
            const candleX = LENS_X - u;
            candle.setAttribute('transform', `translate(${candleX}, ${AXIS_Y - CANDLE_HEIGHT})`);
            
            // 滑块手柄位置
            const sliderRatio = (SLIDER_MAX_U - u) / (SLIDER_MAX_U - SLIDER_MIN_U);
            const handleX = SLIDER_MIN_X + sliderRatio * (SLIDER_MAX_X - SLIDER_MIN_X);
            sliderHandle.setAttribute('cx', handleX);
            
            // 物距标注箭头
            const uMidX = (candleX + LENS_X) / 2;
            uArrow.setAttribute('x1', candleX);
            uArrow.setAttribute('x2', LENS_X);
            uArrow.setAttribute('y1', 275);
            uArrow.setAttribute('y2', 275);
            labelU.setAttribute('x', uMidX);
            
            // 像的位置
            if (v !== null) {
                // 实像
                const screenX = LENS_X + v;
                const imageHeight = CANDLE_HEIGHT * Math.abs(m);
                
                // 光屏位置
                screen.setAttribute('transform', `translate(${screenX - SCREEN_WIDTH/2}, ${AXIS_Y - SCREEN_HEIGHT/2})`);
                
                // 实像（倒立）
                realImage.setAttribute('transform', `translate(${screenX}, ${AXIS_Y})`);
                realImageLine.setAttribute('x1', 0);
                realImageLine.setAttribute('y1', 0);
                realImageLine.setAttribute('x2', 0);
                realImageLine.setAttribute('y2', -imageHeight);
                realImageArrow.setAttribute('points', `-5,${-imageHeight} 0,${-imageHeight - 10} 5,${-imageHeight}`);
                
                // 显示实像，隐藏虚像
                realImage.style.display = 'block';
                virtualImage.style.display = 'none';
                
                // 像距标注箭头
                const vMidX = (LENS_X + screenX) / 2;
                vArrow.setAttribute('x1', LENS_X);
                vArrow.setAttribute('x2', screenX);
                vArrow.setAttribute('y1', 275);
                vArrow.setAttribute('y2', 275);
                labelV.setAttribute('x', vMidX);
                
                // 显示光屏和像距标注
                screen.style.display = 'block';
                document.getElementById('scene2-label-v-group').style.display = 'block';
            } else {
                // 虚像（u < f）
                const virtualV = calculateM(u, null) * u; // 虚像距离
                const virtualX = LENS_X - Math.abs(virtualV);
                const imageHeight = CANDLE_HEIGHT * Math.abs(m);
                
                // 虚像（正立）
                virtualImage.setAttribute('transform', `translate(${virtualX}, ${AXIS_Y})`);
                virtualImageLine.setAttribute('x1', 0);
                virtualImageLine.setAttribute('y1', 0);
                virtualImageLine.setAttribute('x2', 0);
                virtualImageLine.setAttribute('y2', -imageHeight);
                virtualImageArrow.setAttribute('points', `-5,${-imageHeight - 10} 0,${-imageHeight - 10} 5,${-imageHeight - 10}`);
                
                // 显示虚像，隐藏实像和光屏
                virtualImage.style.display = 'block';
                realImage.style.display = 'none';
                screen.style.display = 'none';
                
                // 隐藏像距标注
                document.getElementById('scene2-label-v-group').style.display = 'none';
            }
            
            updateDisplay();
        }
        
        // 滑块拖拽处理
        function handleSliderStart(e) {
            state.isDragging = true;
            e.preventDefault();
        }
        
        function handleSliderMove(e) {
            if (!state.isDragging) return;
            
            const svg = document.getElementById('scene2-svg');
            const rect = svg.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let x = clientX - rect.left;
            
            // 限制范围
            x = Math.max(SLIDER_MIN_X, Math.min(SLIDER_MAX_X, x));
            
            // 计算对应的 u 值
            const sliderRatio = (x - SLIDER_MIN_X) / (SLIDER_MAX_X - SLIDER_MIN_X);
            state.u = SLIDER_MAX_U - sliderRatio * (SLIDER_MAX_U - SLIDER_MIN_U);
            
            updateElements();
        }
        
        function handleSliderEnd() {
            state.isDragging = false;
        }
        
        // 事件绑定
        sliderHandle.addEventListener('mousedown', handleSliderStart);
        sliderHandle.addEventListener('touchstart', handleSliderStart);
        
        document.addEventListener('mousemove', handleSliderMove);
        document.addEventListener('touchmove', handleSliderMove);
        
        document.addEventListener('mouseup', handleSliderEnd);
        document.addEventListener('touchend', handleSliderEnd);
        
        // 初始化
        updateElements();
    })();
    </script>
</body>
</html>
