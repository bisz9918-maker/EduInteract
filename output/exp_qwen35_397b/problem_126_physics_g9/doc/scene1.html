<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>滑轮组结构与绳子段数分析</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; pointer-events: none; }
        #scene1-controls button, #scene1-controls span { pointer-events: auto; }
        .scene1-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: #f5f5f5; }
        .scene1-btn:hover:not(:disabled) { background: #e0e0e0; }
        .scene1-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene1-step-indicator { padding: 8px 16px; font-size: 14px; color: #333; }
        .fade-in { animation: scene1-fade-in 0.3s ease-out forwards; }
        @keyframes scene1-fade-in { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" id="scene1-svg">
            <!-- 箭头定义 -->
            <defs>
                <marker id="scene1-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#000000" />
                </marker>
                <marker id="scene1-arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#c62828" />
                </marker>
                <marker id="scene1-arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#2e7d32" />
                </marker>
            </defs>

            <!-- 桌面 (50,380)-(280,380) -->
            <line x1="50" y1="380" x2="280" y2="380" stroke="#000000" stroke-width="4" />
            <!-- 桌面阴影 -->
            <g id="scene1-table-shadow">
                <line x1="50" y1="380" x2="55" y2="390" stroke="#000000" stroke-width="1" />
                <line x1="60" y1="380" x2="65" y2="390" stroke="#000000" stroke-width="1" />
                <line x1="70" y1="380" x2="75" y2="390" stroke="#000000" stroke-width="1" />
                <line x1="80" y1="380" x2="85" y2="390" stroke="#000000" stroke-width="1" />
                <line x1="90" y1="380" x2="95" y2="390" stroke="#000000" stroke-width="1" />
                <line x1="100" y1="380" x2="105" y2="390" stroke="#000000" stroke-width="1" />
                <line x1="110" y1="380" x2="115" y2="390" stroke="#000000" stroke-width="1" />
                <line x1="120" y1="380" x2="125" y2="390" stroke="#000000" stroke-width="1" />
                <line x1="130" y1="380" x2="135" y2="390" stroke="#000000" stroke-width="1" />
                <line x1="140" y1="380" x2="145" y2="390" stroke="#000000" stroke-width="1" />
                <line x1="150" y1="380" x2="155" y2="390" stroke="#000000" stroke-width="1" />
                <line x1="160" y1="380" x2="165" y2="390" stroke="#000000" stroke-width="1" />
                <line x1="170" y1="380" x2="175" y2="390" stroke="#000000" stroke-width="1" />
                <line x1="180" y1="380" x2="185" y2="390" stroke="#000000" stroke-width="1" />
                <line x1="190" y1="380" x2="195" y2="390" stroke="#000000" stroke-width="1" />
                <line x1="200" y1="380" x2="205" y2="390" stroke="#000000" stroke-width="1" />
                <line x1="210" y1="380" x2="215" y2="390" stroke="#000000" stroke-width="1" />
                <line x1="220" y1="380" x2="225" y2="390" stroke="#000000" stroke-width="1" />
                <line x1="230" y1="380" x2="235" y2="390" stroke="#000000" stroke-width="1" />
                <line x1="240" y1="380" x2="245" y2="390" stroke="#000000" stroke-width="1" />
                <line x1="250" y1="380" x2="255" y2="390" stroke="#000000" stroke-width="1" />
                <line x1="260" y1="380" x2="265" y2="390" stroke="#000000" stroke-width="1" />
                <line x1="270" y1="380" x2="275" y2="390" stroke="#000000" stroke-width="1" />
            </g>

            <!-- 物体 A (100,310) 80×70 -->
            <rect id="scene1-objectA" x="100" y="310" width="80" height="70" fill="#e3f2fd" fill-opacity="0.2" stroke="#000000" stroke-width="2" />
            <!-- 标签 A (140,295) -->
            <text id="scene1-label-A" x="140" y="295" text-anchor="middle" font-size="16" fill="#000000">A</text>

            <!-- 动滑轮组左轮 (320,345) r=25 -->
            <circle id="scene1-pulley-moving-left" cx="320" cy="345" r="25" fill="#f5f5f5" stroke="#000000" stroke-width="2" />
            <!-- 动滑轮组右轮 (370,345) r=25 -->
            <circle id="scene1-pulley-moving-right" cx="370" cy="345" r="25" fill="#f5f5f5" stroke="#000000" stroke-width="2" />
            <!-- 动滑轮轴 (320,345)-(370,345) -->
            <line id="scene1-pulley-axle" x1="320" y1="345" x2="370" y2="345" stroke="#000000" stroke-width="4" />

            <!-- 定滑轮 (550,345) r=25 -->
            <circle id="scene1-pulley-fixed" cx="550" cy="345" r="25" fill="#f5f5f5" stroke="#000000" stroke-width="2" />

            <!-- 墙面 (600,280)-(600,410) -->
            <line x1="600" y1="280" x2="600" y2="410" stroke="#000000" stroke-width="4" />
            <!-- 墙面阴影 -->
            <g id="scene1-wall-shadow">
                <line x1="600" y1="280" x2="610" y2="285" stroke="#000000" stroke-width="1" />
                <line x1="600" y1="290" x2="610" y2="295" stroke="#000000" stroke-width="1" />
                <line x1="600" y1="300" x2="610" y2="305" stroke="#000000" stroke-width="1" />
                <line x1="600" y1="310" x2="610" y2="315" stroke="#000000" stroke-width="1" />
                <line x1="600" y1="320" x2="610" y2="325" stroke="#000000" stroke-width="1" />
                <line x1="600" y1="330" x2="610" y2="335" stroke="#000000" stroke-width="1" />
                <line x1="600" y1="340" x2="610" y2="345" stroke="#000000" stroke-width="1" />
                <line x1="600" y1="350" x2="610" y2="355" stroke="#000000" stroke-width="1" />
                <line x1="600" y1="360" x2="610" y2="365" stroke="#000000" stroke-width="1" />
                <line x1="600" y1="370" x2="610" y2="375" stroke="#000000" stroke-width="1" />
                <line x1="600" y1="380" x2="610" y2="385" stroke="#000000" stroke-width="1" />
                <line x1="600" y1="390" x2="610" y2="395" stroke="#000000" stroke-width="1" />
                <line x1="600" y1="400" x2="610" y2="405" stroke="#000000" stroke-width="1" />
            </g>

            <!-- 绳子路径（黑色实线） -->
            <!-- 绳子段1: 物体A到动滑轮左轮 (180,345)-(320,345) -->
            <line id="scene1-rope-seg1" x1="180" y1="345" x2="320" y2="345" stroke="#000000" stroke-width="3" />
            <!-- 绳子段2: 绕动滑轮和定滑轮 -->
            <path id="scene1-rope-seg2" d="M 320 320 L 320 320 A 25 25 0 0 1 345 295 L 345 295 L 525 295 L 525 320 A 25 25 0 0 1 550 345" stroke="#000000" stroke-width="3" fill="none" />
            <!-- 绳子段3: 从定滑轮出来到拉力端 -->
            <path id="scene1-rope-seg3" d="M 550 345 L 550 370 A 25 25 0 0 0 525 395 L 525 395 L 490 360" stroke="#000000" stroke-width="3" fill="none" />

            <!-- 3段绳高亮（蓝色，步骤1显示） -->
            <g id="scene1-rope-highlight" style="opacity: 0;">
                <line x1="180" y1="345" x2="320" y2="345" stroke="#1565c0" stroke-width="5" stroke-opacity="0.5" />
                <path d="M 320 320 L 320 320 A 25 25 0 0 1 345 295 L 345 295 L 525 295 L 525 320 A 25 25 0 0 1 550 345" stroke="#1565c0" stroke-width="5" stroke-opacity="0.5" fill="none" />
                <path d="M 550 345 L 550 370 A 25 25 0 0 0 525 395 L 525 395 L 490 360" stroke="#1565c0" stroke-width="5" stroke-opacity="0.5" fill="none" />
            </g>

            <!-- n=3 标签 (345,380) 步骤1显示 -->
            <text id="scene1-label-n3" x="345" y="380" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565c0" style="opacity: 0;">n=3</text>

            <!-- 拉力 F 箭头 (520,310)-(490,280) -->
            <line id="scene1-arrow-F" x1="520" y1="310" x2="490" y2="280" stroke="#c62828" stroke-width="4" marker-end="url(#scene1-arrowhead-red)" />
            <!-- 标签 F (505,265) -->
            <text id="scene1-label-F" x="505" y="265" text-anchor="middle" font-size="16" fill="#c62828">F</text>

            <!-- 摩擦力 f 箭头 (80,345)-(50,345) 步骤4显示 -->
            <line id="scene1-arrow-f" x1="80" y1="345" x2="50" y2="345" stroke="#c62828" stroke-width="4" marker-end="url(#scene1-arrowhead-red)" style="opacity: 0;" />
            <!-- 标签 f (65,330) 步骤4显示 -->
            <text id="scene1-label-f" x="65" y="330" text-anchor="middle" font-size="14" fill="#c62828" style="opacity: 0;">f</text>

            <!-- 距离 S 标注 (100,400)-(180,400) 步骤2显示 -->
            <g id="scene1-distance-S" style="opacity: 0;">
                <line x1="100" y1="400" x2="180" y2="400" stroke="#2e7d32" stroke-width="2" marker-start="url(#scene1-arrowhead-green)" marker-end="url(#scene1-arrowhead-green)" />
                <text x="140" y="415" text-anchor="middle" font-size="14" fill="#2e7d32">S</text>
            </g>

            <!-- 距离 3S 标注 (320,400)-(520,400) 步骤2显示 -->
            <g id="scene1-distance-3S" style="opacity: 0;">
                <line x1="320" y1="400" x2="520" y2="400" stroke="#2e7d32" stroke-width="2" marker-start="url(#scene1-arrowhead-green)" marker-end="url(#scene1-arrowhead-green)" />
                <text x="420" y="415" text-anchor="middle" font-size="14" fill="#2e7d32">3S</text>
            </g>

            <!-- 速度 υ 标注 (140,260) 步骤3显示 -->
            <g id="scene1-velocity-v" style="opacity: 0;">
                <line x1="125" y1="260" x2="155" y2="260" stroke="#2e7d32" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#scene1-arrowhead-green)" />
                <text x="140" y="245" text-anchor="middle" font-size="14" fill="#2e7d32">υ</text>
            </g>

            <!-- 速度 3υ 标注 (520,260) 步骤3显示 -->
            <g id="scene1-velocity-3v" style="opacity: 0;">
                <line x1="505" y1="260" x2="535" y2="260" stroke="#2e7d32" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#scene1-arrowhead-green)" />
                <text x="520" y="245" text-anchor="middle" font-size="14" fill="#2e7d32">3υ</text>
            </g>

            <!-- 控件栏 -->
            <g id="scene1-controls">
                <rect x="250" y="450" width="300" height="40" fill="#ffffff" fill-opacity="0.9" />
                <text id="scene1-step-text" x="400" y="475" text-anchor="middle" font-size="14" fill="#333333">步骤 0/4</text>
            </g>
        </svg>
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn">◀ 上一步</button>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现
        // 布局坐标表参考：
        // | 元素 | 位置 | 备注 |
        // | 桌面 | (50,380)-(280,380) | 水平线 |
        // | 物体A | (100,310) 80×70 | 矩形 |
        // | 标签A | (140,295) | 物体A上方 |
        // | 动滑轮左 | (320,345) r=25 | 圆 |
        // | 动滑轮右 | (370,345) r=25 | 圆 |
        // | 定滑轮 | (550,345) r=25 | 圆 |
        // | 墙面 | (600,280)-(600,410) | 竖直线 |
        // | 拉力F | (520,310)-(490,280) | 红色箭头 |
        // | 距离S | (100,400)-(180,400) | 绿色双箭头 |
        // | 距离3S | (320,400)-(520,400) | 绿色双箭头 |
        // | 速度υ | (140,260) | 绿色虚线箭头 |
        // | 速度3υ | (520,260) | 绿色虚线箭头 |
        // | n=3 | (345,380) | 蓝色 |

        let currentStep = 0;
        const totalSteps = 4;

        // 每步需要显示的元素ID列表
        const stepElements = {
            0: [],  // 初始状态：只显示基础结构（默认显示）
            1: ['scene1-rope-highlight', 'scene1-label-n3'],
            2: ['scene1-distance-S', 'scene1-distance-3S'],
            3: ['scene1-velocity-v', 'scene1-velocity-3v'],
            4: ['scene1-arrow-f', 'scene1-label-f']
        };

        // 显示元素函数
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.opacity = '1';
                el.style.display = '';
                el.classList.add('fade-in');
            }
        }

        // 隐藏元素函数
        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.opacity = '0';
                el.classList.remove('fade-in');
            }
        }

        // 更新状态
        function updateState() {
            // 更新步骤文本
            document.getElementById('scene1-step-text').textContent = '步骤 ' + currentStep + '/' + totalSteps;

            // 更新按钮状态
            document.getElementById('scene1-btn-prev').disabled = (currentStep === 0);
            document.getElementById('scene1-btn-next').disabled = (currentStep === totalSteps);

            // 根据当前步骤显示/隐藏元素
            for (let step = 1; step <= totalSteps; step++) {
                const elements = stepElements[step];
                if (elements) {
                    elements.forEach(function(id) {
                        if (step <= currentStep) {
                            showElement(id);
                        } else {
                            hideElement(id);
                        }
                    });
                }
            }
        }

        // 按钮事件绑定
        document.getElementById('scene1-btn-prev').addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateState();
            }
        });

        document.getElementById('scene1-btn-next').addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateState();
            }
        });

        // 初始化
        updateState();
    })();
    </script>
</body>
</html>
