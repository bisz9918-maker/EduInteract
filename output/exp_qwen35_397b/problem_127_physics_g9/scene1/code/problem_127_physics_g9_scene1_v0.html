<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>光通过平行玻璃砖的折射规律</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 12px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 玻璃砖 -->
            <rect id="scene1-glass-rect" x="200" y="200" width="400" height="120" 
                  fill="#e3f2fd" fill-opacity="0.3" stroke="#1565c0" stroke-width="2"/>
            
            <!-- 上法线 -->
            <line id="scene1-normal-top" x1="350" y1="140" x2="350" y2="260" 
                  stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
            
            <!-- 下法线 -->
            <line id="scene1-normal-bottom" x1="430" y1="260" x2="430" y2="380" 
                  stroke="#888888" stroke-width="1" stroke-dasharray="4,4"/>
            
            <!-- 入射光线 -->
            <g id="scene1-incident-ray-group">
                <line id="scene1-incident-ray" x1="220" y1="100" x2="350" y2="200" 
                      stroke="#000000" stroke-width="2"/>
                <!-- 箭头 -->
                <polygon id="scene1-incident-arrow" points="350,200 342,194 346,204" 
                         fill="#000000"/>
            </g>
            
            <!-- 折射光线 -->
            <g id="scene1-refracted-ray-group">
                <line id="scene1-refracted-ray" x1="350" y1="200" x2="430" y2="320" 
                      stroke="#1565c0" stroke-width="2"/>
                <!-- 箭头 -->
                <polygon id="scene1-refracted-arrow" points="430,320 422,314 426,324" 
                         fill="#1565c0"/>
            </g>
            
            <!-- 出射光线 -->
            <g id="scene1-exit-ray-group">
                <line id="scene1-exit-ray" x1="430" y1="320" x2="560" y2="420" 
                      stroke="#000000" stroke-width="2"/>
                <!-- 箭头 -->
                <polygon id="scene1-exit-arrow" points="560,420 552,414 556,424" 
                         fill="#000000"/>
            </g>
            
            <!-- 入射角弧线 -->
            <path id="scene1-incident-arc" d="" 
                  fill="none" stroke="#2e7d32" stroke-width="1.5"/>
            
            <!-- 折射角弧线 -->
            <path id="scene1-refracted-arc" d="" 
                  fill="none" stroke="#2e7d32" stroke-width="1.5"/>
            
            <!-- 标签 -->
            <text id="scene1-air-top" x="350" y="125" text-anchor="middle" 
                  fill="#000000" font-size="14">空气</text>
            <text id="scene1-glass-label" x="520" y="250" text-anchor="middle" 
                  fill="#000000" font-size="14">玻璃</text>
            <text id="scene1-air-bottom" x="350" y="390" text-anchor="middle" 
                  fill="#000000" font-size="14">空气</text>
            
            <text id="scene1-theta1-label" x="380" y="165" text-anchor="middle" 
                  fill="#000000" font-size="14">θ₁</text>
            <text id="scene1-theta2-label" x="375" y="235" text-anchor="middle" 
                  fill="#000000" font-size="14">θ₂</text>
            
            <text id="scene1-normal-label1" x="365" y="145" text-anchor="start" 
                  fill="#888888" font-size="12">法线</text>
            <text id="scene1-normal-label2" x="365" y="375" text-anchor="start" 
                  fill="#888888" font-size="12">法线</text>
            
            <!-- 角度数值面板 -->
            <g id="scene1-angle-display">
                <rect x="650" y="120" width="130" height="60" 
                      fill="#f5f5f5" stroke="#cccccc" stroke-width="1"/>
                <text id="scene1-theta1-value" x="715" y="145" text-anchor="middle" 
                      fill="#000000" font-size="14">θ₁ = 30°</text>
                <text id="scene1-theta2-value" x="715" y="165" text-anchor="middle" 
                      fill="#000000" font-size="14">θ₂ = 19°</text>
            </g>
            
            <!-- 滑块标签 -->
            <text id="scene1-slider-label" x="400" y="440" text-anchor="middle" 
                  fill="#000000" font-size="14">入射角调节</text>
        </svg>
        
        <div id="scene1-controls">
            <input type="range" id="scene1-angle-slider" min="0" max="60" value="30" 
                   style="width: 400px;"/>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1: 光通过平行玻璃砖的折射规律
        
        // 常量定义
        const GLASS_TOP_Y = 200;
        const GLASS_BOTTOM_Y = 320;
        const GLASS_THICKNESS = 120;
        const INCIDENT_POINT_X = 350;
        const REFRACTIVE_INDEX = 1.5; // 玻璃折射率
        
        // 获取 DOM 元素
        const slider = document.getElementById('scene1-angle-slider');
        const incidentRay = document.getElementById('scene1-incident-ray');
        const incidentArrow = document.getElementById('scene1-incident-arrow');
        const refractedRay = document.getElementById('scene1-refracted-ray');
        const refractedArrow = document.getElementById('scene1-refracted-arrow');
        const exitRay = document.getElementById('scene1-exit-ray');
        const exitArrow = document.getElementById('scene1-exit-arrow');
        const incidentArc = document.getElementById('scene1-incident-arc');
        const refractedArc = document.getElementById('scene1-refracted-arc');
        const theta1Value = document.getElementById('scene1-theta1-value');
        const theta2Value = document.getElementById('scene1-theta2-value');
        const normalBottom = document.getElementById('scene1-normal-bottom');
        const normalLabel2 = document.getElementById('scene1-normal-label2');
        
        // 计算折射角（斯涅尔定律）
        function calculateRefractionAngle(theta1Deg) {
            const theta1Rad = theta1Deg * Math.PI / 180;
            const sinTheta2 = Math.sin(theta1Rad) / REFRACTIVE_INDEX;
            const theta2Rad = Math.asin(sinTheta2);
            return theta2Rad * 180 / Math.PI;
        }
        
        // 更新光路
        function updateLightPath(theta1Deg) {
            const theta2Deg = calculateRefractionAngle(theta1Deg);
            const theta1Rad = theta1Deg * Math.PI / 180;
            const theta2Rad = theta2Deg * Math.PI / 180;
            
            // 入射光线：从左上到入射点
            const incidentLength = 130;
            const incidentStartX = INCIDENT_POINT_X - incidentLength * Math.sin(theta1Rad);
            const incidentStartY = GLASS_TOP_Y - incidentLength * Math.cos(theta1Rad);
            
            incidentRay.setAttribute('x1', incidentStartX);
            incidentRay.setAttribute('y1', incidentStartY);
            incidentRay.setAttribute('x2', INCIDENT_POINT_X);
            incidentRay.setAttribute('y2', GLASS_TOP_Y);
            
            // 入射光线箭头（指向入射点）
            const arrowAngle = Math.atan2(GLASS_TOP_Y - incidentStartY, INCIDENT_POINT_X - incidentStartX);
            const arrowDist = 8;
            const arrowX = INCIDENT_POINT_X - arrowDist * Math.cos(arrowAngle);
            const arrowY = GLASS_TOP_Y - arrowDist * Math.sin(arrowAngle);
            const arrowPerpX = arrowDist * Math.sin(arrowAngle) * 0.5;
            const arrowPerpY = -arrowDist * Math.cos(arrowAngle) * 0.5;
            incidentArrow.setAttribute('points', 
                `${INCIDENT_POINT_X},${GLASS_TOP_Y} ${arrowX - arrowPerpX},${arrowY - arrowPerpY} ${arrowX + arrowPerpX},${arrowY + arrowPerpY}`);
            
            // 折射光线：从入射点到出射点
            const horizontalShift = GLASS_THICKNESS * Math.tan(theta2Rad);
            const exitPointX = INCIDENT_POINT_X + horizontalShift;
            
            refractedRay.setAttribute('x1', INCIDENT_POINT_X);
            refractedRay.setAttribute('y1', GLASS_TOP_Y);
            refractedRay.setAttribute('x2', exitPointX);
            refractedRay.setAttribute('y2', GLASS_BOTTOM_Y);
            
            // 折射光线箭头
            const refractedAngle = Math.atan2(GLASS_BOTTOM_Y - GLASS_TOP_Y, exitPointX - INCIDENT_POINT_X);
            const rArrowDist = 8;
            const rArrowX = exitPointX - rArrowDist * Math.cos(refractedAngle);
            const rArrowY = GLASS_BOTTOM_Y - rArrowDist * Math.sin(refractedAngle);
            const rArrowPerpX = rArrowDist * Math.sin(refractedAngle) * 0.5;
            const rArrowPerpY = -rArrowDist * Math.cos(refractedAngle) * 0.5;
            refractedArrow.setAttribute('points',
                `${exitPointX},${GLASS_BOTTOM_Y} ${rArrowX - rArrowPerpX},${rArrowY - rArrowPerpY} ${rArrowX + rArrowPerpX},${rArrowY + rArrowPerpY}`);
            
            // 出射光线：从出射点向右下，与入射光线平行
            const exitLength = 130;
            const exitEndX = exitPointX + exitLength * Math.sin(theta1Rad);
            const exitEndY = GLASS_BOTTOM_Y + exitLength * Math.cos(theta1Rad);
            
            exitRay.setAttribute('x1', exitPointX);
            exitRay.setAttribute('y1', GLASS_BOTTOM_Y);
            exitRay.setAttribute('x2', exitEndX);
            exitRay.setAttribute('y2', exitEndY);
            
            // 出射光线箭头
            const exitArrowDist = 8;
            const eArrowX = exitEndX - exitArrowDist * Math.sin(theta1Rad);
            const eArrowY = exitEndY - exitArrowDist * Math.cos(theta1Rad);
            const eArrowPerpX = exitArrowDist * Math.cos(theta1Rad) * 0.5;
            const eArrowPerpY = -exitArrowDist * Math.sin(theta1Rad) * 0.5;
            exitArrow.setAttribute('points',
                `${exitEndX},${exitEndY} ${eArrowX - eArrowPerpX},${eArrowY - eArrowPerpY} ${eArrowX + eArrowPerpX},${eArrowY + eArrowPerpY}`);
            
            // 更新下法线位置
            normalBottom.setAttribute('x1', exitPointX);
            normalBottom.setAttribute('y1', GLASS_BOTTOM_Y - 60);
            normalBottom.setAttribute('x2', exitPointX);
            normalBottom.setAttribute('y2', GLASS_BOTTOM_Y + 60);
            normalLabel2.setAttribute('x', exitPointX + 5);
            normalLabel2.setAttribute('y', GLASS_BOTTOM_Y + 55);
            
            // 更新角度弧线
            updateArcs(theta1Rad, theta2Rad, exitPointX);
            
            // 更新数值显示
            theta1Value.textContent = `θ₁ = ${theta1Deg.toFixed(0)}°`;
            theta2Value.textContent = `θ₂ = ${theta2Deg.toFixed(1)}°`;
        }
        
        // 更新角度弧线
        function updateArcs(theta1Rad, theta2Rad, exitPointX) {
            const arcRadius1 = 35;
            const arcRadius2 = 25;
            
            // 入射角弧线：从法线（垂直向上）到入射光线
            // 法线方向是 -90°（向上），入射光线方向是 -90°+theta1
            const startAngle1 = -Math.PI / 2;
            const endAngle1 = -Math.PI / 2 + theta1Rad;
            
            const x1_1 = INCIDENT_POINT_X + arcRadius1 * Math.cos(startAngle1);
            const y1_1 = GLASS_TOP_Y + arcRadius1 * Math.sin(startAngle1);
            const x2_1 = INCIDENT_POINT_X + arcRadius1 * Math.cos(endAngle1);
            const y2_1 = GLASS_TOP_Y + arcRadius1 * Math.sin(endAngle1);
            
            const arcPath1 = `M ${x1_1} ${y1_1} A ${arcRadius1} ${arcRadius1} 0 0 1 ${x2_1} ${y2_1}`;
            incidentArc.setAttribute('d', arcPath1);
            
            // 折射角弧线：从法线（垂直向下）到折射光线
            // 法线方向是 90°（向下），折射光线方向是 90°-theta2
            const startAngle2 = Math.PI / 2;
            const endAngle2 = Math.PI / 2 - theta2Rad;
            
            const x1_2 = INCIDENT_POINT_X + arcRadius2 * Math.cos(startAngle2);
            const y1_2 = GLASS_TOP_Y + arcRadius2 * Math.sin(startAngle2);
            const x2_2 = INCIDENT_POINT_X + arcRadius2 * Math.cos(endAngle2);
            const y2_2 = GLASS_TOP_Y + arcRadius2 * Math.sin(endAngle2);
            
            const arcPath2 = `M ${x1_2} ${y1_2} A ${arcRadius2} ${arcRadius2} 0 0 0 ${x2_2} ${y2_2}`;
            refractedArc.setAttribute('d', arcPath2);
            
            // 更新角度标签位置
            const theta1LabelX = INCIDENT_POINT_X + (arcRadius1 + 15) * Math.cos((startAngle1 + endAngle1) / 2);
            const theta1LabelY = GLASS_TOP_Y + (arcRadius1 + 15) * Math.sin((startAngle1 + endAngle1) / 2);
            document.getElementById('scene1-theta1-label').setAttribute('x', theta1LabelX);
            document.getElementById('scene1-theta1-label').setAttribute('y', theta1LabelY);
            
            const theta2LabelX = INCIDENT_POINT_X + (arcRadius2 + 12) * Math.cos((startAngle2 + endAngle2) / 2);
            const theta2LabelY = GLASS_TOP_Y + (arcRadius2 + 12) * Math.sin((startAngle2 + endAngle2) / 2);
            document.getElementById('scene1-theta2-label').setAttribute('x', theta2LabelX);
            document.getElementById('scene1-theta2-label').setAttribute('y', theta2LabelY);
        }
        
        // 事件监听
        slider.addEventListener('input', function() {
            const theta1 = parseFloat(this.value);
            updateLightPath(theta1);
        });
        
        // 初始化
        updateLightPath(30);
        
    })();
    </script>
</body>
</html>
