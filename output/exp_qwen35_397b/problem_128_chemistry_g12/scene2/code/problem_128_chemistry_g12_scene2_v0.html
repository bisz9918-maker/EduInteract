<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正三棱柱晶胞堆积方式与分摊系数</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene2-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene2-svg { width: 800px; height: 500px; }
        .scene2-hidden { display: none; opacity: 0; }
        .scene2-visible { display: block; opacity: 1; }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 背景 -->
            <rect width="800" height="500" fill="#ffffff"/>
            
            <!-- 标题 -->
            <text x="400" y="35" text-anchor="middle" font-size="16" font-weight="bold">正三棱柱晶胞堆积方式与分摊系数</text>
            
            <!-- 中心三棱柱组 -->
            <g id="scene2-prism-center">
                <!-- 上底面三角形 -->
                <polygon id="scene2-top-face" points="300,80 500,80 400,180" fill="none" stroke="#000" stroke-width="2"/>
                <!-- 下底面三角形 - 前两边实线 -->
                <line x1="300" y1="240" x2="500" y2="240" stroke="#000" stroke-width="2"/>
                <line x1="500" y1="240" x2="400" y2="340" stroke="#000" stroke-width="2"/>
                <!-- 下底面后边虚线 -->
                <line id="scene2-bottom-back" x1="400" y1="340" x2="300" y2="240" stroke="#000" stroke-width="2" stroke-dasharray="5,5"/>
                <!-- 侧棱 -->
                <line x1="300" y1="80" x2="300" y2="240" stroke="#000" stroke-width="2"/>
                <line x1="500" y1="80" x2="500" y2="240" stroke="#000" stroke-width="2"/>
                <line x1="400" y1="180" x2="400" y2="340" stroke="#000" stroke-width="2"/>
            </g>
            
            <!-- 顶点 A 粒子 (6 个) -->
            <g id="scene2-particles-a">
                <circle cx="300" cy="80" r="6" fill="#000"/>
                <circle cx="500" cy="80" r="6" fill="#000"/>
                <circle cx="400" cy="180" r="6" fill="#000"/>
                <circle cx="300" cy="240" r="6" fill="#000"/>
                <circle cx="500" cy="240" r="6" fill="#000"/>
                <circle cx="400" cy="340" r="6" fill="#000"/>
            </g>
            
            <!-- 棱上 B 粒子 (9 个) -->
            <g id="scene2-particles-b">
                <!-- 上底面 3 条棱中点 -->
                <circle cx="400" cy="80" r="4" fill="#000"/>
                <circle cx="450" cy="130" r="4" fill="#000"/>
                <circle cx="350" cy="130" r="4" fill="#000"/>
                <!-- 下底面 3 条棱中点 -->
                <circle cx="400" cy="240" r="4" fill="#000"/>
                <circle cx="450" cy="290" r="4" fill="#000"/>
                <circle cx="350" cy="290" r="4" fill="#000"/>
                <!-- 3 条侧棱中点 -->
                <circle cx="300" cy="160" r="4" fill="#000"/>
                <circle cx="500" cy="160" r="4" fill="#000"/>
                <circle cx="400" cy="260" r="4" fill="#000"/>
            </g>
            
            <!-- 体心 C 粒子 -->
            <g id="scene2-particle-c">
                <circle cx="400" cy="210" r="7" fill="#fff" stroke="#000" stroke-width="2"/>
            </g>
            
            <!-- 相邻晶胞组 (状态 1: 顶点共享) -->
            <g id="scene2-neighbor-vertex" class="scene2-hidden">
                <!-- 围绕上底面顶点 (400,180) 的 11 个相邻晶胞示意 - 简化为小三角形 -->
            </g>
            
            <!-- 相邻晶胞组 (状态 2: 棱共享) -->
            <g id="scene2-neighbor-edge" class="scene2-hidden">
                <!-- 围绕侧棱的 5 个相邻晶胞示意 -->
            </g>
            
            <!-- 高亮顶点 (状态 1) -->
            <g id="scene2-highlight-vertex" class="scene2-hidden">
                <circle cx="400" cy="180" r="8" fill="#c62828"/>
            </g>
            
            <!-- 高亮棱 (状态 2) -->
            <g id="scene2-highlight-edge" class="scene2-hidden">
                <line x1="400" y1="180" x2="400" y2="340" stroke="#2e7d32" stroke-width="4"/>
            </g>
            
            <!-- 高亮体心 (状态 3) -->
            <g id="scene2-highlight-center" class="scene2-hidden">
                <circle cx="400" cy="210" r="10" fill="#1565c0"/>
            </g>
            
            <!-- 分摊系数文本 - 移到中间区域 -->
            <text id="scene2-coefficient" x="400" y="380" text-anchor="middle" font-size="18" font-weight="bold">分摊系数：1/12</text>
            
            <!-- 图例 - 移到左上角 -->
            <g id="scene2-legend">
                <circle cx="50" cy="70" r="6" fill="#000"/>
                <text x="65" y="75" font-size="13">A (顶点)</text>
                <circle cx="50" cy="95" r="4" fill="#000"/>
                <text x="65" y="100" font-size="13">B (棱上)</text>
                <circle cx="50" cy="120" r="7" fill="#fff" stroke="#000" stroke-width="2"/>
                <text x="65" y="125" font-size="13">C (体心)</text>
            </g>
            
            <!-- 控件栏 - 按钮组 -->
            <g id="scene2-controls">
                <!-- 按钮 1: 顶点共享 -->
                <rect id="scene2-btn1-bg" x="220" y="420" width="100" height="32" fill="#333" rx="4"/>
                <text id="scene2-btn1" x="270" y="441" text-anchor="middle" font-size="13" fill="#fff" style="cursor:pointer">顶点共享</text>
                
                <!-- 按钮 2: 棱共享 -->
                <rect id="scene2-btn2-bg" x="350" y="420" width="100" height="32" fill="#fff" stroke="#333" stroke-width="2" rx="4"/>
                <text id="scene2-btn2" x="400" y="441" text-anchor="middle" font-size="13" fill="#333" style="cursor:pointer">棱共享</text>
                
                <!-- 按钮 3: 体心独占 -->
                <rect id="scene2-btn3-bg" x="480" y="420" width="100" height="32" fill="#fff" stroke="#333" stroke-width="2" rx="4"/>
                <text id="scene2-btn3" x="530" y="441" text-anchor="middle" font-size="13" fill="#333" style="cursor:pointer">体心独占</text>
            </g>
        </svg>
    </div>
    
    <script>
    (function() {
        // Scene 2 实现 - 正三棱柱晶胞堆积方式与分摊系数
        
        let currentState = 1; // 1: 顶点共享, 2: 棱共享, 3: 体心独占
        
        // 获取 DOM 元素
        const neighborVertex = document.getElementById('scene2-neighbor-vertex');
        const neighborEdge = document.getElementById('scene2-neighbor-edge');
        const highlightVertex = document.getElementById('scene2-highlight-vertex');
        const highlightEdge = document.getElementById('scene2-highlight-edge');
        const highlightCenter = document.getElementById('scene2-highlight-center');
        const coefficientText = document.getElementById('scene2-coefficient');
        const btn1Bg = document.getElementById('scene2-btn1-bg');
        const btn2Bg = document.getElementById('scene2-btn2-bg');
        const btn3Bg = document.getElementById('scene2-btn3-bg');
        
        // 更新按钮样式
        function updateButtons() {
            if (currentState === 1) {
                btn1Bg.setAttribute('fill', '#333');
                btn2Bg.setAttribute('fill', '#fff');
                btn3Bg.setAttribute('fill', '#fff');
            } else if (currentState === 2) {
                btn1Bg.setAttribute('fill', '#fff');
                btn2Bg.setAttribute('fill', '#333');
                btn3Bg.setAttribute('fill', '#fff');
            } else {
                btn1Bg.setAttribute('fill', '#fff');
                btn2Bg.setAttribute('fill', '#fff');
                btn3Bg.setAttribute('fill', '#333');
            }
        }
        
        // 渲染状态 1: 顶点共享
        function renderState1() {
            // 隐藏其他状态元素
            neighborEdge.classList.add('scene2-hidden');
            highlightEdge.classList.add('scene2-hidden');
            highlightCenter.classList.add('scene2-hidden');
            
            // 显示状态 1 元素
            neighborVertex.classList.remove('scene2-hidden');
            highlightVertex.classList.remove('scene2-hidden');
            
            // 更新文本
            coefficientText.textContent = '分摊系数：1/12';
            
            updateButtons();
        }
        
        // 渲染状态 2: 棱共享
        function renderState2() {
            // 隐藏其他状态元素
            neighborVertex.classList.add('scene2-hidden');
            highlightVertex.classList.add('scene2-hidden');
            highlightCenter.classList.add('scene2-hidden');
            
            // 显示状态 2 元素
            neighborEdge.classList.remove('scene2-hidden');
            highlightEdge.classList.remove('scene2-hidden');
            
            // 更新文本
            coefficientText.textContent = '分摊系数：1/6';
            
            updateButtons();
        }
        
        // 渲染状态 3: 体心独占
        function renderState3() {
            // 隐藏所有相邻晶胞和高亮
            neighborVertex.classList.add('scene2-hidden');
            neighborEdge.classList.add('scene2-hidden');
            highlightVertex.classList.add('scene2-hidden');
            highlightEdge.classList.add('scene2-hidden');
            highlightCenter.classList.remove('scene2-hidden');
            
            // 更新文本
            coefficientText.textContent = '分摊系数：1';
            
            updateButtons();
        }
        
        // 渲染函数
        function render() {
            if (currentState === 1) {
                renderState1();
            } else if (currentState === 2) {
                renderState2();
            } else {
                renderState3();
            }
        }
        
        // 事件绑定
        document.getElementById('scene2-btn1').addEventListener('click', function() {
            currentState = 1;
            render();
        });
        
        document.getElementById('scene2-btn2').addEventListener('click', function() {
            currentState = 2;
            render();
        });
        
        document.getElementById('scene2-btn3').addEventListener('click', function() {
            currentState = 3;
            render();
        });
        
        // 初始化
        render();
        
    })();
    </script>
</body>
</html>
