<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>偏二甲肼-四氧化二氮原电池工作原理</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }
        .scene1-btn {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border: 2px solid #333;
            border-radius: 6px;
            background: #f5f5f5;
            transition: all 0.2s;
        }
        .scene1-btn:hover:not(:disabled) {
            background: #e0e0e0;
        }
        .scene1-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #scene1-step-indicator {
            font-size: 14px;
            font-weight: bold;
            color: #333;
            min-width: 80px;
            text-align: center;
        }
        /* 步骤元素初始隐藏 */
        .scene1-step-element {
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .scene1-step-visible {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 电解质区域 (淡蓝色半透明背景) -->
            <rect id="scene1-electrolyte-bg" x="300" y="160" width="200" height="180" fill="#bbdefb" fill-opacity="0.4" stroke="none"/>
            
            <!-- 电极 A (左侧灰色矩形) -->
            <rect id="scene1-electrode-a" x="320" y="150" width="40" height="200" fill="#888888" stroke="#555555" stroke-width="2"/>
            
            <!-- 电极 B (右侧灰色矩形) -->
            <rect id="scene1-electrode-b" x="440" y="150" width="40" height="200" fill="#888888" stroke="#555555" stroke-width="2"/>
            
            <!-- 外电路导线 (黑色折线) -->
            <polyline id="scene1-wire" points="340,150 340,100 460,100 460,150" fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 灯泡 (黄色圆形+灯丝) -->
            <circle id="scene1-bulb" cx="400" cy="65" r="15" fill="#ffd54f" stroke="#333" stroke-width="2"/>
            <path id="scene1-bulb-filament" d="M393,65 Q396,60 400,65 Q404,60 407,65" fill="none" stroke="#333" stroke-width="1.5"/>
            <rect id="scene1-bulb-base" x="395" y="78" width="10" height="8" fill="#666"/>
            
            <!-- 入口 a 箭头 (左下，指向电极 A 底部) -->
            <line id="scene1-arrow-a-line" x1="220" y1="380" x2="275" y2="380" stroke="#000000" stroke-width="2"/>
            <polygon id="scene1-arrow-a-head" points="275,380 265,375 265,385" fill="#000000"/>
            
            <!-- 入口 b 箭头 (右下，指向电极 B 底部) -->
            <line id="scene1-arrow-b-line" x1="580" y1="380" x2="525" y2="380" stroke="#000000" stroke-width="2"/>
            <polygon id="scene1-arrow-b-head" points="525,380 535,375 535,385" fill="#000000"/>
            
            <!-- 出口 c 箭头 (左上，从电极 A 顶部向左) -->
            <line id="scene1-arrow-c-line" x1="300" y1="120" x2="245" y2="120" stroke="#000000" stroke-width="2"/>
            <polygon id="scene1-arrow-c-head" points="245,120 255,115 255,125" fill="#000000"/>
            
            <!-- 出口 d 箭头 (右上，从电极 B 顶部向右) -->
            <line id="scene1-arrow-d-line" x1="500" y1="120" x2="555" y2="120" stroke="#000000" stroke-width="2"/>
            <polygon id="scene1-arrow-d-head" points="555,120 545,115 545,125" fill="#000000"/>
            
            <!-- 步骤 1: 电子流向箭头 (蓝色，沿外电路从 B 到 A) -->
            <g id="scene1-step1-electron" class="scene1-step-element">
                <!-- 右侧箭头 (B 极上方) -->
                <line x1="460" y1="130" x2="460" y2="105" stroke="#1565c0" stroke-width="3" marker-end="url(#scene1-arrowhead-blue)"/>
                <!-- 上方箭头 (从右向左) -->
                <line x1="445" y1="100" x2="355" y2="100" stroke="#1565c0" stroke-width="3" marker-end="url(#scene1-arrowhead-blue)"/>
                <!-- 左侧箭头 (A 极上方) -->
                <line x1="340" y1="105" x2="340" y2="130" stroke="#1565c0" stroke-width="3" marker-end="url(#scene1-arrowhead-blue)"/>
                <!-- e⁻ 标签 -->
                <text x="445" y="90" font-size="16" fill="#1565c0" font-weight="bold">e⁻</text>
                <text x="325" y="90" font-size="16" fill="#1565c0" font-weight="bold">e⁻</text>
            </g>
            
            <!-- 步骤 2: 正负极标注 -->
            <g id="scene1-step2-polarity" class="scene1-step-element">
                <text id="scene1-label-positive" x="305" y="200" font-size="18" fill="#c62828" font-weight="bold">正极</text>
                <text id="scene1-label-negative" x="460" y="200" font-size="18" fill="#c62828" font-weight="bold">负极</text>
            </g>
            
            <!-- 步骤 3: 燃料/氧化剂标签 -->
            <g id="scene1-step3-fuel" class="scene1-step-element">
                <text id="scene1-label-c2h8n2" x="210" y="405" font-size="16" fill="#1565c0" font-weight="bold">C₂H₈N₂</text>
                <text id="scene1-label-n2o4" x="590" y="405" font-size="16" fill="#1565c0" font-weight="bold">N₂O₄</text>
            </g>
            
            <!-- 步骤 4: H⁺移动箭头 -->
            <g id="scene1-step4-hplus" class="scene1-step-element">
                <line x1="460" y1="280" x2="370" y2="280" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#scene1-arrowhead-green)"/>
                <text x="400" y="265" font-size="16" fill="#2e7d32" font-weight="bold" text-anchor="middle">H⁺</text>
            </g>
            
            <!-- 步骤 5: 产物标签 -->
            <g id="scene1-step5-products" class="scene1-step-element">
                <text id="scene1-label-co2-n2" x="210" y="95" font-size="14" fill="#2e7d32" font-weight="bold">CO₂+N₂</text>
                <text id="scene1-label-h2o" x="590" y="95" font-size="16" fill="#2e7d32" font-weight="bold">H₂O</text>
            </g>
            
            <!-- 基础标签 (始终显示) -->
            <text id="scene1-label-a" x="305" y="250" font-size="18" fill="#333" font-weight="bold">A</text>
            <text id="scene1-label-b" x="495" y="250" font-size="18" fill="#333" font-weight="bold">B</text>
            <text id="scene1-label-h2so4" x="400" y="320" font-size="16" fill="#333">H₂SO₄</text>
            <text id="scene1-label-a-in" x="210" y="385" font-size="16" fill="#333">a</text>
            <text id="scene1-label-b-in" x="590" y="385" font-size="16" fill="#333">b</text>
            <text id="scene1-label-c-out" x="210" y="115" font-size="16" fill="#333">c</text>
            <text id="scene1-label-d-out" x="590" y="115" font-size="16" fill="#333">d</text>
            
            <!-- 箭头标记定义 -->
            <defs>
                <marker id="scene1-arrowhead-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#1565c0"/>
                </marker>
                <marker id="scene1-arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#2e7d32"/>
                </marker>
            </defs>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn">◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 0/5</span>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1: 偏二甲肼-四氧化二氮原电池工作原理
        
        let currentState = 0;
        const totalSteps = 5;
        
        // 获取 DOM 元素
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');
        
        // 步骤元素
        const step1Element = document.getElementById('scene1-step1-electron');
        const step2Element = document.getElementById('scene1-step2-polarity');
        const step3Element = document.getElementById('scene1-step3-fuel');
        const step4Element = document.getElementById('scene1-step4-hplus');
        const step5Element = document.getElementById('scene1-step5-products');
        
        // 更新显示状态
        function updateDisplay() {
            // 更新步骤指示器
            stepIndicator.textContent = `步骤 ${currentState}/${totalSteps}`;
            
            // 更新按钮状态
            btnPrev.disabled = (currentState === 0);
            btnNext.disabled = (currentState === totalSteps);
            
            // 根据当前状态显示/隐藏元素
            updateStepVisibility(step1Element, 1);
            updateStepVisibility(step2Element, 2);
            updateStepVisibility(step3Element, 3);
            updateStepVisibility(step4Element, 4);
            updateStepVisibility(step5Element, 5);
        }
        
        // 辅助函数：更新单个步骤元素的可见性
        function updateStepVisibility(element, stepNumber) {
            if (currentState >= stepNumber) {
                element.classList.add('scene1-step-visible');
            } else {
                element.classList.remove('scene1-step-visible');
            }
        }
        
        // 下一步
        function nextStep() {
            if (currentState < totalSteps) {
                currentState++;
                updateDisplay();
            }
        }
        
        // 上一步
        function prevStep() {
            if (currentState > 0) {
                currentState--;
                updateDisplay();
            }
        }
        
        // 事件绑定
        btnNext.addEventListener('click', nextStep);
        btnPrev.addEventListener('click', prevStep);
        
        // 初始化
        updateDisplay();
    })();
    </script>
</body>
</html>
