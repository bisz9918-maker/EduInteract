<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>原电池与电解池组合装置</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene1-btn { padding: 8px 16px; font-size: 14px; cursor: pointer; border: none; border-radius: 4px; }
        .scene1-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #scene1-btn-prev { background: #e0e0e0; }
        #scene1-btn-next { background: #1976d2; color: white; }
        #scene1-step-indicator { font-size: 14px; color: #666; align-self: center; }
        .scene1-hidden { display: none; opacity: 0; }
        .scene1-visible { display: block; opacity: 1; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 定义箭头标记 -->
            <defs>
                <marker id="scene1-arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#c62828" />
                </marker>
                <marker id="scene1-arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#1565c0" />
                </marker>
                <marker id="scene1-arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#2e7d32" />
                </marker>
            </defs>

            <!-- 左烧杯容器 (电解池) -->
            <path id="scene1-beaker-left" d="M120,220 L120,400 Q120,420 140,420 L260,420 Q280,420 280,400 L280,220" 
                  fill="none" stroke="#000000" stroke-width="2"/>
            
            <!-- 右烧杯容器 (原电池) -->
            <path id="scene1-beaker-right" d="M520,220 L520,400 Q520,420 540,420 L660,420 Q680,420 680,400 L680,220" 
                  fill="none" stroke="#000000" stroke-width="2"/>

            <!-- 左烧杯溶液液面 -->
            <line x1="130" y1="340" x2="270" y2="340" stroke="#64b5f6" stroke-width="2" stroke-dasharray="5,5"/>
            <line x1="135" y1="355" x2="265" y2="355" stroke="#64b5f6" stroke-width="2" stroke-dasharray="5,5"/>
            <line x1="140" y1="370" x2="260" y2="370" stroke="#64b5f6" stroke-width="2" stroke-dasharray="5,5"/>

            <!-- 右烧杯溶液液面 -->
            <line x1="530" y1="340" x2="670" y2="340" stroke="#64b5f6" stroke-width="2" stroke-dasharray="5,5"/>
            <line x1="535" y1="355" x2="665" y2="355" stroke="#64b5f6" stroke-width="2" stroke-dasharray="5,5"/>
            <line x1="540" y1="370" x2="660" y2="370" stroke="#64b5f6" stroke-width="2" stroke-dasharray="5,5"/>

            <!-- Pt 电极 -->
            <rect id="scene1-electrode-pt" x="140" y="200" width="20" height="120" fill="#9e9e9e" stroke="#000000" stroke-width="2"/>
            <!-- Cu 电极 -->
            <rect id="scene1-electrode-cu" x="240" y="200" width="20" height="120" fill="#9e9e9e" stroke="#000000" stroke-width="2"/>
            <!-- Zn 电极 -->
            <rect id="scene1-electrode-zn" x="540" y="200" width="20" height="120" fill="#9e9e9e" stroke="#000000" stroke-width="2"/>
            <!-- C 电极 -->
            <rect id="scene1-electrode-c" x="640" y="200" width="20" height="120" fill="#9e9e9e" stroke="#000000" stroke-width="2"/>

            <!-- 导线 -->
            <!-- Pt → 电流表 -->
            <path id="scene1-wire-1" d="M150,200 L150,150 L400,150" fill="none" stroke="#000000" stroke-width="2"/>
            <!-- Cu → 开关左侧 -->
            <path id="scene1-wire-2" d="M250,200 L250,170 L400,170" fill="none" stroke="#000000" stroke-width="2"/>
            <!-- 开关右侧 → Zn -->
            <path id="scene1-wire-3" d="M450,170 L450,170 L450,170 L550,170 L550,200" fill="none" stroke="#000000" stroke-width="2"/>
            <!-- C → 电流表 -->
            <path id="scene1-wire-4" d="M650,200 L650,150 L425,150" fill="none" stroke="#000000" stroke-width="2"/>

            <!-- 电流表 -->
            <circle id="scene1-ammeter" cx="400" cy="135" r="25" fill="#ffffff" stroke="#000000" stroke-width="2"/>
            <text x="400" y="142" text-anchor="middle" font-size="18" font-weight="bold">A</text>

            <!-- 开关 (断开状态) -->
            <path id="scene1-switch" d="M400,170 L435,170 M445,170 L450,165" fill="none" stroke="#000000" stroke-width="2"/>
            <circle cx="400" cy="170" r="3" fill="#000000"/>
            <circle cx="450" cy="170" r="3" fill="#000000"/>

            <!-- 电极标签 -->
            <text id="scene1-label-pt" x="125" y="260" font-size="14" fill="#000000">Pt</text>
            <text id="scene1-label-cu" x="275" y="260" font-size="14" fill="#000000">Cu</text>
            <text id="scene1-label-zn" x="520" y="260" font-size="14" fill="#000000">Zn</text>
            <text id="scene1-label-c" x="675" y="260" font-size="14" fill="#000000">C</text>

            <!-- 溶液标签 -->
            <text id="scene1-label-nacl" x="200" y="450" text-anchor="middle" font-size="14" fill="#000000">NaCl 溶液</text>
            <text id="scene1-label-h2so4" x="600" y="450" text-anchor="middle" font-size="14" fill="#000000">稀 H₂SO₄</text>

            <!-- 区域框 (步骤 1 显示) -->
            <g id="scene1-region-group" class="scene1-hidden">
                <!-- 电解池区域框 (蓝色) -->
                <rect id="scene1-region-electrolytic" x="100" y="180" width="200" height="240" 
                      fill="none" stroke="#1565c0" stroke-width="2" opacity="0.3"/>
                <!-- 原电池区域框 (绿色) -->
                <rect id="scene1-region-galvanic" x="500" y="180" width="200" height="240" 
                      fill="none" stroke="#2e7d32" stroke-width="2" opacity="0.3"/>
                <!-- 区域标签 -->
                <text id="scene1-label-electrolytic" x="200" y="475" text-anchor="middle" font-size="14" fill="#1565c0">电解池</text>
                <text id="scene1-label-galvanic" x="600" y="475" text-anchor="middle" font-size="14" fill="#2e7d32">原电池</text>
            </g>

            <!-- 电子流向箭头 (步骤 2 显示) -->
            <g id="scene1-electron-flow-group" class="scene1-hidden">
                <!-- Cu → 开关 -->
                <line id="scene1-electron-flow-1" x1="250" y1="185" x2="250" y2="155" 
                      stroke="#c62828" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#scene1-arrow-red)"/>
                <line x1="250" y1="155" x2="390" y2="155" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#scene1-arrow-red)"/>
                <text x="230" y="150" font-size="12" fill="#c62828">e⁻</text>
                
                <!-- 开关 → Zn -->
                <line id="scene1-electron-flow-2" x1="460" y1="155" x2="460" y2="170" 
                      stroke="#c62828" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#scene1-arrow-red)"/>
                <line x1="460" y1="170" x2="540" y2="170" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#scene1-arrow-red)"/>
                <text x="470" y="150" font-size="12" fill="#c62828">e⁻</text>
                
                <!-- Pt → 电流表 -->
                <line id="scene1-electron-flow-3" x1="150" y1="185" x2="150" y2="150" 
                      stroke="#c62828" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#scene1-arrow-red)"/>
                <line x1="150" y1="150" x2="375" y2="150" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#scene1-arrow-red)"/>
                
                <!-- 电流表 → C -->
                <line id="scene1-electron-flow-4" x1="425" y1="150" x2="650" y2="150" 
                      stroke="#c62828" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#scene1-arrow-red)"/>
                <line x1="650" y1="150" x2="650" y2="185" stroke="#c62828" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#scene1-arrow-red)"/>
            </g>

            <!-- 离子移动箭头 (步骤 3 显示) -->
            <g id="scene1-ion-flow-group" class="scene1-hidden">
                <!-- 左烧杯：Na⁺ → Cu -->
                <line id="scene1-ion-na" x1="180" y1="350" x2="230" y2="350" 
                      stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-blue)"/>
                <text x="190" y="340" font-size="12" fill="#1565c0">Na⁺</text>
                
                <!-- 左烧杯：Cl⁻ → Pt -->
                <line id="scene1-ion-cl" x1="220" y1="380" x2="170" y2="380" 
                      stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrow-red)"/>
                <text x="210" y="400" font-size="12" fill="#c62828">Cl⁻</text>
                
                <!-- 右烧杯：H⁺ → C -->
                <line id="scene1-ion-h" x1="580" y1="350" x2="630" y2="350" 
                      stroke="#1565c0" stroke-width="2" marker-end="url(#scene1-arrow-blue)"/>
                <text x="590" y="340" font-size="12" fill="#1565c0">H⁺</text>
                
                <!-- 右烧杯：SO₄²⁻ → Zn -->
                <line id="scene1-ion-so4" x1="620" y1="380" x2="570" y2="380" 
                      stroke="#c62828" stroke-width="2" marker-end="url(#scene1-arrow-red)"/>
                <text x="600" y="400" font-size="12" fill="#c62828">SO₄²⁻</text>
            </g>

            <!-- 电极极性标注 (步骤 4 显示) -->
            <g id="scene1-polarity-group" class="scene1-hidden">
                <!-- Zn: 负极 (绿色) -->
                <text id="scene1-polarity-zn" x="550" y="185" text-anchor="middle" font-size="12" fill="#2e7d32" font-weight="bold">负极</text>
                <!-- C: 正极 (红色) -->
                <text id="scene1-polarity-c" x="650" y="185" text-anchor="middle" font-size="12" fill="#c62828" font-weight="bold">正极</text>
                <!-- Pt: 阳极 (红色) -->
                <text id="scene1-polarity-pt" x="150" y="185" text-anchor="middle" font-size="12" fill="#c62828" font-weight="bold">阳极</text>
                <!-- Cu: 阴极 (绿色) -->
                <text id="scene1-polarity-cu" x="250" y="185" text-anchor="middle" font-size="12" fill="#2e7d32" font-weight="bold">阴极</text>
            </g>

            <!-- 控件栏 -->
            <g id="scene1-controls">
                <rect x="300" y="460" width="200" height="30" fill="#f5f5f5" stroke="#e0e0e0" rx="4"/>
                <text id="scene1-step-indicator" x="400" y="480" text-anchor="middle" font-size="14" fill="#666">步骤 1/5</text>
            </g>
        </svg>

        <!-- HTML 按钮控件 -->
        <div style="position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px;">
            <button id="scene1-btn-prev" class="scene1-btn" disabled>◀ 上一步</button>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1 实现：原电池与电解池组合装置

        let currentStep = 0;
        const totalSteps = 5;

        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');

        // 各步骤需要显示的元素组
        const stepGroups = {
            0: [], // 初始状态：只显示基础元素
            1: ['scene1-region-group'], // 显示区域框
            2: ['scene1-region-group', 'scene1-electron-flow-group'], // 显示电子流向
            3: ['scene1-region-group', 'scene1-electron-flow-group', 'scene1-ion-flow-group'], // 显示离子移动
            4: ['scene1-region-group', 'scene1-electron-flow-group', 'scene1-ion-flow-group', 'scene1-polarity-group'] // 显示电极极性
        };

        function updateDisplay() {
            // 更新步骤指示器
            stepIndicator.textContent = `步骤 ${currentStep + 1}/${totalSteps}`;

            // 更新按钮状态
            btnPrev.disabled = currentStep === 0;
            btnNext.disabled = currentStep === totalSteps - 1;

            // 更新各元素组的显隐
            const groupsToShow = stepGroups[currentStep];

            // 隐藏所有组
            ['scene1-region-group', 'scene1-electron-flow-group', 'scene1-ion-flow-group', 'scene1-polarity-group'].forEach(groupId => {
                const el = document.getElementById(groupId);
                if (el) {
                    el.classList.add('scene1-hidden');
                    el.classList.remove('scene1-visible');
                }
            });

            // 显示当前步骤需要的组
            groupsToShow.forEach(groupId => {
                const el = document.getElementById(groupId);
                if (el) {
                    el.classList.remove('scene1-hidden');
                    el.classList.add('scene1-visible');
                }
            });
        }

        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateDisplay();
            }
        });

        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
