<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>燃烧反应方程式配平</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #scene2-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene2-svg {
            width: 800px;
            height: 500px;
        }
        .scene2-step-label {
            font-size: 14px;
            fill: #555555;
            font-weight: bold;
        }
        .scene2-step-content {
            font-size: 14px;
            fill: #555555;
        }
        .scene2-equation {
            font-size: 18px;
            fill: #000000;
        }
        .scene2-coefficient {
            font-size: 18px;
            fill: #999999;
        }
        .scene2-coefficient.highlight {
            fill: #1565c0;
            font-weight: bold;
        }
        .scene2-coefficient.final {
            fill: #c62828;
            font-weight: bold;
        }
        .scene2-oxygen-equation {
            font-size: 20px;
            fill: #2e7d32;
        }
        .scene2-solution {
            font-size: 18px;
            fill: #555555;
        }
        .scene2-result-text {
            font-size: 22px;
            fill: #c62828;
            font-weight: bold;
        }
        .scene2-title {
            font-size: 20px;
            fill: #333333;
            font-weight: bold;
        }
        .scene2-arrow {
            font-size: 24px;
            fill: #888888;
        }
        .scene2-hidden {
            opacity: 0;
        }
        .scene2-visible {
            opacity: 1;
            transition: opacity 0.3s ease;
        }
        #scene2-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }
        .scene2-btn {
            padding: 8px 16px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        #scene2-btn-prev {
            background-color: #e0e0e0;
            color: #333;
        }
        #scene2-btn-prev:hover {
            background-color: #d0d0d0;
        }
        #scene2-btn-prev:disabled {
            background-color: #f0f0f0;
            color: #bbb;
            cursor: not-allowed;
        }
        #scene2-btn-next {
            background-color: #1565c0;
            color: white;
        }
        #scene2-btn-next:hover {
            background-color: #0d47a1;
        }
        #scene2-btn-next:disabled {
            background-color: #90caf9;
            cursor: not-allowed;
        }
        #scene2-step-indicator {
            font-size: 14px;
            color: #555;
            min-width: 60px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500">
            <!-- 标题 -->
            <text id="scene2-title" x="400" y="35" text-anchor="middle" class="scene2-title">燃烧反应方程式配平</text>
            
            <!-- 方程式框架 y=130 -->
            <!-- C₂₀H₂₁NO₄ + xO₂ → aCO₂ + bH₂O + cN₂ -->
            <text id="scene2-reactant" x="150" y="130" class="scene2-equation">C₂₀H₂₁NO₄</text>
            <text x="265" y="130" class="scene2-equation">+</text>
            <text x="290" y="130" class="scene2-equation"><tspan id="scene2-coef-x" class="scene2-coefficient">x</tspan>O₂</text>
            <text x="370" y="130" class="scene2-arrow">→</text>
            <text x="410" y="130" class="scene2-equation"><tspan id="scene2-coef-a" class="scene2-coefficient">a</tspan>CO₂</text>
            <text x="510" y="130" class="scene2-equation">+</text>
            <text x="535" y="130" class="scene2-equation"><tspan id="scene2-coef-b" class="scene2-coefficient">b</tspan>H₂O</text>
            <text x="625" y="130" class="scene2-equation">+</text>
            <text x="650" y="130" class="scene2-equation"><tspan id="scene2-coef-c" class="scene2-coefficient">c</tspan>N₂</text>
            
            <!-- 步骤1：配平C原子 (左侧) -->
            <text id="scene2-step1-label" x="100" y="200" class="scene2-step-label scene2-hidden">步骤1：配平C原子</text>
            <text id="scene2-step1-content" x="100" y="225" class="scene2-step-content scene2-hidden">a = 20（20个C→20CO₂）</text>
            
            <!-- 步骤2：配平H原子 (左侧) -->
            <text id="scene2-step2-label" x="100" y="260" class="scene2-step-label scene2-hidden">步骤2：配平H原子</text>
            <text id="scene2-step2-content" x="100" y="285" class="scene2-step-content scene2-hidden">b = 10.5（21个H→10.5H₂O）</text>
            
            <!-- 步骤3：配平N原子 (右侧) -->
            <text id="scene2-step3-label" x="450" y="200" class="scene2-step-label scene2-hidden">步骤3：配平N原子</text>
            <text id="scene2-step3-content" x="450" y="225" class="scene2-step-content scene2-hidden">c = 0.5（1个N→0.5N₂）</text>
            
            <!-- 步骤4：计算右侧O原子 (右侧) -->
            <text id="scene2-step4-label" x="450" y="260" class="scene2-step-label scene2-hidden">步骤4：计算右侧O原子</text>
            <text id="scene2-step4-content" x="450" y="285" class="scene2-step-content scene2-hidden">O总数=20×2+10.5=50.5</text>
            
            <!-- 氧原子守恒方程 -->
            <text id="scene2-oxygen-title" x="200" y="340" class="scene2-step-label scene2-hidden">氧原子守恒方程：</text>
            <text id="scene2-oxygen-equation" x="480" y="370" text-anchor="middle" class="scene2-oxygen-equation scene2-hidden">4 + 2x = 50.5</text>
            <text id="scene2-solution" x="480" y="400" text-anchor="middle" class="scene2-solution scene2-hidden">2x = 46.5 → x = 23.25</text>
            
            <!-- 最终结果框 -->
            <rect id="scene2-result-box" x="550" y="330" width="200" height="80" fill="#ffebee" stroke="#c62828" stroke-width="2" rx="8" class="scene2-hidden"/>
            <text id="scene2-result-text" x="650" y="375" text-anchor="middle" class="scene2-result-text scene2-hidden">耗氧量=23.25 mol</text>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene2-controls">
            <button id="scene2-btn-prev" class="scene2-btn">◀ 上一步</button>
            <span id="scene2-step-indicator">步骤 1/7</span>
            <button id="scene2-btn-next" class="scene2-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2: 燃烧反应方程式配平
        
        const totalSteps = 7; // 步骤 0-6
        let currentStep = 0;
        
        // 获取所有需要控制的元素
        const elements = {
            step1Label: document.getElementById('scene2-step1-label'),
            step1Content: document.getElementById('scene2-step1-content'),
            step2Label: document.getElementById('scene2-step2-label'),
            step2Content: document.getElementById('scene2-step2-content'),
            step3Label: document.getElementById('scene2-step3-label'),
            step3Content: document.getElementById('scene2-step3-content'),
            step4Label: document.getElementById('scene2-step4-label'),
            step4Content: document.getElementById('scene2-step4-content'),
            oxygenTitle: document.getElementById('scene2-oxygen-title'),
            oxygenEquation: document.getElementById('scene2-oxygen-equation'),
            solution: document.getElementById('scene2-solution'),
            resultBox: document.getElementById('scene2-result-box'),
            resultText: document.getElementById('scene2-result-text'),
            coefA: document.getElementById('scene2-coef-a'),
            coefB: document.getElementById('scene2-coef-b'),
            coefC: document.getElementById('scene2-coef-c'),
            coefX: document.getElementById('scene2-coef-x'),
            btnPrev: document.getElementById('scene2-btn-prev'),
            btnNext: document.getElementById('scene2-btn-next'),
            stepIndicator: document.getElementById('scene2-step-indicator')
        };
        
        // 显示/隐藏工具函数
        function show(el) {
            if (el) {
                el.classList.remove('scene2-hidden');
                el.classList.add('scene2-visible');
                el.style.opacity = '1';
                el.style.display = '';
            }
        }
        
        function hide(el) {
            if (el) {
                el.classList.remove('scene2-visible');
                el.classList.add('scene2-hidden');
                el.style.opacity = '0';
            }
        }
        
        // 重置系数样式
        function resetCoefficients() {
            elements.coefA.textContent = 'a';
            elements.coefA.className.baseVal = 'scene2-coefficient';
            elements.coefB.textContent = 'b';
            elements.coefB.className.baseVal = 'scene2-coefficient';
            elements.coefC.textContent = 'c';
            elements.coefC.className.baseVal = 'scene2-coefficient';
            elements.coefX.textContent = 'x';
            elements.coefX.className.baseVal = 'scene2-coefficient';
        }
        
        // 更新按钮状态
        function updateButtons() {
            elements.btnPrev.disabled = (currentStep === 0);
            elements.btnNext.disabled = (currentStep >= totalSteps - 1);
            elements.stepIndicator.textContent = `步骤 ${currentStep + 1}/${totalSteps}`;
        }
        
        // 渲染当前步骤
        function render() {
            // 先隐藏所有步骤相关元素
            hide(elements.step1Label);
            hide(elements.step1Content);
            hide(elements.step2Label);
            hide(elements.step2Content);
            hide(elements.step3Label);
            hide(elements.step3Content);
            hide(elements.step4Label);
            hide(elements.step4Content);
            hide(elements.oxygenTitle);
            hide(elements.oxygenEquation);
            hide(elements.solution);
            hide(elements.resultBox);
            hide(elements.resultText);
            
            // 重置系数
            resetCoefficients();
            
            // 根据当前步骤显示相应内容
            switch(currentStep) {
                case 0:
                    // 初始状态：只显示方程式框架
                    break;
                    
                case 1:
                    // 步骤1：配平C原子
                    show(elements.step1Label);
                    show(elements.step1Content);
                    elements.coefA.textContent = '20';
                    elements.coefA.classList.add('highlight');
                    break;
                    
                case 2:
                    // 步骤2：配平H原子
                    show(elements.step1Label);
                    show(elements.step1Content);
                    show(elements.step2Label);
                    show(elements.step2Content);
                    elements.coefA.textContent = '20';
                    elements.coefA.classList.add('highlight');
                    elements.coefB.textContent = '10.5';
                    elements.coefB.classList.add('highlight');
                    break;
                    
                case 3:
                    // 步骤3：配平N原子
                    show(elements.step1Label);
                    show(elements.step1Content);
                    show(elements.step2Label);
                    show(elements.step2Content);
                    show(elements.step3Label);
                    show(elements.step3Content);
                    elements.coefA.textContent = '20';
                    elements.coefA.classList.add('highlight');
                    elements.coefB.textContent = '10.5';
                    elements.coefB.classList.add('highlight');
                    elements.coefC.textContent = '0.5';
                    elements.coefC.classList.add('highlight');
                    break;
                    
                case 4:
                    // 步骤4：计算右侧O原子
                    show(elements.step1Label);
                    show(elements.step1Content);
                    show(elements.step2Label);
                    show(elements.step2Content);
                    show(elements.step3Label);
                    show(elements.step3Content);
                    show(elements.step4Label);
                    show(elements.step4Content);
                    elements.coefA.textContent = '20';
                    elements.coefA.classList.add('highlight');
                    elements.coefB.textContent = '10.5';
                    elements.coefB.classList.add('highlight');
                    elements.coefC.textContent = '0.5';
                    elements.coefC.classList.add('highlight');
                    break;
                    
                case 5:
                    // 步骤5：显示氧守恒方程
                    show(elements.step1Label);
                    show(elements.step1Content);
                    show(elements.step2Label);
                    show(elements.step2Content);
                    show(elements.step3Label);
                    show(elements.step3Content);
                    show(elements.step4Label);
                    show(elements.step4Content);
                    show(elements.oxygenTitle);
                    show(elements.oxygenEquation);
                    show(elements.solution);
                    elements.coefA.textContent = '20';
                    elements.coefA.classList.add('highlight');
                    elements.coefB.textContent = '10.5';
                    elements.coefB.classList.add('highlight');
                    elements.coefC.textContent = '0.5';
                    elements.coefC.classList.add('highlight');
                    break;
                    
                case 6:
                    // 步骤6：显示最终结果
                    show(elements.step1Label);
                    show(elements.step1Content);
                    show(elements.step2Label);
                    show(elements.step2Content);
                    show(elements.step3Label);
                    show(elements.step3Content);
                    show(elements.step4Label);
                    show(elements.step4Content);
                    show(elements.oxygenTitle);
                    show(elements.oxygenEquation);
                    show(elements.solution);
                    show(elements.resultBox);
                    show(elements.resultText);
                    elements.coefA.textContent = '20';
                    elements.coefA.classList.add('highlight');
                    elements.coefB.textContent = '10.5';
                    elements.coefB.classList.add('highlight');
                    elements.coefC.textContent = '0.5';
                    elements.coefC.classList.add('highlight');
                    elements.coefX.textContent = '23.25';
                    elements.coefX.classList.add('final');
                    break;
            }
            
            updateButtons();
        }
        
        // 事件绑定
        elements.btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                render();
            }
        });
        
        elements.btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                render();
            }
        });
        
        // 初始化
        render();
        
    })();
    </script>
</body>
</html>
