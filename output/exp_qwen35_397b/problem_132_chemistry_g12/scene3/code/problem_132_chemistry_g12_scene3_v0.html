<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>罂粟碱苯环取代位点分析</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #scene3-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene3-svg {
            width: 800px;
            height: 500px;
        }
        .scene3-fade {
            transition: opacity 0.3s ease;
        }
        .scene3-hidden {
            opacity: 0;
            display: none;
        }
        .scene3-visible {
            opacity: 1;
            display: block;
        }
        #scene3-btn-prev, #scene3-btn-next, #scene3-btn-reset {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #333;
            border-radius: 4px;
            background: #f0f0f0;
            transition: background 0.2s;
        }
        #scene3-btn-prev:hover, #scene3-btn-next:hover, #scene3-btn-reset:hover {
            background: #e0e0e0;
        }
        #scene3-btn-prev:disabled, #scene3-btn-next:disabled, #scene3-btn-reset:disabled {
            background: #ccc;
            cursor: not-allowed;
            opacity: 0.6;
        }
        #scene3-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 12px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg id="scene3-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 标题 -->
            <text id="scene3-title" x="400" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000">苯环取代位点分析</text>

            <!-- 左侧苯环高亮区 (步骤 1 显示) -->
            <polygon id="scene3-left-ring-highlight" 
                     points="160,180 300,180 300,260 160,260" 
                     fill="#1565c0" opacity="0" class="scene3-fade"/>

            <!-- 右侧苯环高亮区 (步骤 3 显示) -->
            <polygon id="scene3-right-ring-highlight" 
                     points="410,140 570,140 570,220 410,220" 
                     fill="#2e7d32" opacity="0" class="scene3-fade"/>

            <!-- 分子骨架 -->
            <g id="scene3-molecule-skeleton">
                <!-- 左侧异喹啉苯环 -->
                <polygon id="scene3-left-ring-poly" 
                         points="180,180 280,180 300,220 280,260 180,260 160,220" 
                         fill="none" stroke="#000000" stroke-width="2"/>
                
                <!-- 左侧异喹啉吡啶环 -->
                <polygon id="scene3-pyridine-ring" 
                         points="280,180 350,190 370,230 350,270 280,260" 
                         fill="none" stroke="#000000" stroke-width="2"/>
                
                <!-- 右侧苯环 -->
                <polygon id="scene3-right-ring-poly" 
                         points="450,140 530,140 570,180 530,220 450,220 410,180" 
                         fill="none" stroke="#000000" stroke-width="2"/>
                
                <!-- 亚甲基桥 -->
                <line id="scene3-methylene-bridge" 
                      x1="350" y1="230" x2="410" y2="180" 
                      stroke="#000000" stroke-width="2"/>
            </g>

            <!-- 甲氧基标签 -->
            <g id="scene3-methoxy-groups">
                <!-- 左侧甲氧基 1 -->
                <line x1="180" y1="200" x2="150" y2="200" stroke="#000000" stroke-width="2"/>
                <text x="130" y="205" font-size="14" fill="#000000">CH₃O</text>
                
                <!-- 左侧甲氧基 2 -->
                <line x1="180" y1="240" x2="150" y2="240" stroke="#000000" stroke-width="2"/>
                <text x="130" y="245" font-size="14" fill="#000000">CH₃O</text>
                
                <!-- 右侧甲氧基 1 -->
                <line x1="530" y1="160" x2="560" y2="160" stroke="#000000" stroke-width="2"/>
                <text x="570" y="165" font-size="14" fill="#000000">OCH₃</text>
                
                <!-- 右侧甲氧基 2 -->
                <line x1="530" y1="200" x2="560" y2="200" stroke="#000000" stroke-width="2"/>
                <text x="570" y="205" font-size="14" fill="#000000">OCH₃</text>
            </g>

            <!-- 氮原子标签 - 移到吡啶环内部中心位置 -->
            <text id="scene3-nitrogen" x="335" y="235" font-size="16" font-weight="bold" fill="#000000">N</text>

            <!-- 不可取代标记 (甲氧基占据位置) -->
            <g id="scene3-blocked-sites">
                <circle cx="150" cy="200" r="6" fill="#888888"/>
                <circle cx="150" cy="240" r="6" fill="#888888"/>
                <circle cx="560" cy="160" r="6" fill="#888888"/>
                <circle cx="560" cy="200" r="6" fill="#888888"/>
            </g>

            <!-- 左侧苯环标签组 (步骤 1 显示) - 调整位置远离位点 -->
            <g id="scene3-left-labels" class="scene3-fade scene3-hidden">
                <text x="230" y="135" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565c0">左侧苯环</text>
                <text x="230" y="325" text-anchor="middle" font-size="13" fill="#1565c0">2 个可取代 H</text>
            </g>

            <!-- 右侧苯环标签组 (步骤 3 显示) - 调整位置远离位点 -->
            <g id="scene3-right-labels" class="scene3-fade scene3-hidden">
                <text x="490" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e7d32">右侧苯环</text>
                <text x="490" y="290" text-anchor="middle" font-size="13" fill="#2e7d32">3 个可取代 H</text>
            </g>

            <!-- 可取代位点 - 编号放在圆圈内，白色背景 -->
            <g id="scene3-site-1" class="scene3-fade scene3-hidden">
                <circle cx="185" cy="155" r="12" fill="#ffffff" stroke="#c62828" stroke-width="2"/>
                <text x="185" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#c62828">①</text>
            </g>
            
            <g id="scene3-site-2" class="scene3-fade scene3-hidden">
                <circle cx="240" cy="305" r="12" fill="#ffffff" stroke="#c62828" stroke-width="2"/>
                <text x="240" y="310" text-anchor="middle" font-size="12" font-weight="bold" fill="#c62828">②</text>
            </g>
            
            <g id="scene3-site-3" class="scene3-fade scene3-hidden">
                <circle cx="490" cy="100" r="12" fill="#ffffff" stroke="#c62828" stroke-width="2"/>
                <text x="490" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#c62828">③</text>
            </g>
            
            <g id="scene3-site-4" class="scene3-fade scene3-hidden">
                <circle cx="585" cy="130" r="12" fill="#ffffff" stroke="#c62828" stroke-width="2"/>
                <text x="585" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="#c62828">④</text>
            </g>
            
            <g id="scene3-site-5" class="scene3-fade scene3-hidden">
                <circle cx="490" cy="270" r="12" fill="#ffffff" stroke="#c62828" stroke-width="2"/>
                <text x="490" y="275" text-anchor="middle" font-size="12" font-weight="bold" fill="#c62828">⑤</text>
            </g>

            <!-- 步骤指示器 -->
            <text id="scene3-step-indicator" x="400" y="425" text-anchor="middle" font-size="14" fill="#666666">步骤 0/5</text>

            <!-- 汇总标签 (步骤 5 显示) - 调整位置避免与按钮重叠 -->
            <text id="scene3-summary" x="400" y="455" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000" class="scene3-fade scene3-hidden">共 5 种一溴代物同分异构体</text>
        </svg>

        <!-- 控件栏 -->
        <div id="scene3-controls">
            <button id="scene3-btn-prev">◀ 上一步</button>
            <button id="scene3-btn-next">下一步 ▶</button>
            <button id="scene3-btn-reset">重置</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 3: 罂粟碱苯环取代位点分析
        
        let currentState = 0;
        const totalSteps = 5;

        // 元素引用
        const leftHighlight = document.getElementById('scene3-left-ring-highlight');
        const rightHighlight = document.getElementById('scene3-right-ring-highlight');
        const leftLabels = document.getElementById('scene3-left-labels');
        const rightLabels = document.getElementById('scene3-right-labels');
        const site1 = document.getElementById('scene3-site-1');
        const site2 = document.getElementById('scene3-site-2');
        const site3 = document.getElementById('scene3-site-3');
        const site4 = document.getElementById('scene3-site-4');
        const site5 = document.getElementById('scene3-site-5');
        const summary = document.getElementById('scene3-summary');
        const stepIndicator = document.getElementById('scene3-step-indicator');
        const btnPrev = document.getElementById('scene3-btn-prev');
        const btnNext = document.getElementById('scene3-btn-next');
        const btnReset = document.getElementById('scene3-btn-reset');

        // 工具函数：显示元素
        function show(el) {
            el.classList.remove('scene3-hidden');
            el.classList.add('scene3-visible');
            if (el.tagName === 'polygon') {
                el.setAttribute('opacity', '0.2');
            } else {
                el.setAttribute('opacity', '1');
            }
        }

        // 工具函数：隐藏元素
        function hide(el) {
            el.classList.remove('scene3-visible');
            el.classList.add('scene3-hidden');
            if (el.tagName === 'polygon') {
                el.setAttribute('opacity', '0');
            } else {
                el.setAttribute('opacity', '0');
            }
        }

        // 更新状态显示
        function updateState(step) {
            // 隐藏所有动态元素
            hide(leftHighlight);
            hide(rightHighlight);
            hide(leftLabels);
            hide(rightLabels);
            hide(site1);
            hide(site2);
            hide(site3);
            hide(site4);
            hide(site5);
            hide(summary);

            // 根据步骤显示相应元素
            if (step >= 1) {
                show(leftHighlight);
                show(leftLabels);
            }
            if (step >= 2) {
                show(site1);
                show(site2);
            }
            if (step >= 3) {
                show(rightHighlight);
                show(rightLabels);
            }
            if (step >= 4) {
                show(site3);
                show(site4);
                show(site5);
            }
            if (step >= 5) {
                show(summary);
            }

            // 更新步骤指示器
            stepIndicator.textContent = '步骤 ' + step + '/5';

            // 更新按钮状态
            btnPrev.disabled = (step === 0);
            btnNext.disabled = (step === 5);
        }

        // 事件处理
        btnPrev.addEventListener('click', function() {
            if (currentState > 0) {
                currentState--;
                updateState(currentState);
            }
        });

        btnNext.addEventListener('click', function() {
            if (currentState < totalSteps) {
                currentState++;
                updateState(currentState);
            }
        });

        btnReset.addEventListener('click', function() {
            currentState = 0;
            updateState(currentState);
        });

        // 初始化
        updateState(currentState);
    })();
    </script>
</body>
</html>
