<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>有机物烃 A、B 和 C 的结构对比</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        #scene1-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }
        .scene1-btn {
            width: 80px;
            height: 30px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #333;
            border-radius: 4px;
            background: #f0f0f0;
        }
        .scene1-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .scene1-btn:not(:disabled):hover {
            background: #e0e0e0;
        }
        #scene1-step-indicator {
            font-size: 14px;
            min-width: 80px;
            text-align: center;
        }
        /* 元素可见性控制 */
        .scene1-hidden {
            opacity: 0;
            display: none;
        }
        .scene1-visible {
            opacity: 1;
            display: block;
        }
        /* 高亮样式 */
        .scene1-highlight-a {
            stroke: #1565c0;
            stroke-width: 2;
        }
        .scene1-highlight-b {
            stroke: #2e7d32;
            stroke-width: 2;
        }
        .scene1-highlight-c {
            stroke: #c62828;
            stroke-width: 2;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 结构 A（正四面体烷） -->
            <g id="scene1-struct-a">
                <!-- 棱（碳碳键） -->
                <!-- 实线：V1-V2, V1-V3, V2-V3（可见的前面三角形） -->
                <line id="scene1-a-edge-1" x1="180" y1="160" x2="140" y2="270" stroke="#000000" stroke-width="2"/>
                <line id="scene1-a-edge-2" x1="180" y1="160" x2="220" y2="270" stroke="#000000" stroke-width="2"/>
                <line id="scene1-a-edge-3" x1="140" y1="270" x2="220" y2="270" stroke="#000000" stroke-width="2"/>
                <!-- 实线：V1-V4（顶部到后方） -->
                <line id="scene1-a-edge-4" x1="180" y1="160" x2="180" y2="230" stroke="#000000" stroke-width="2"/>
                <!-- 虚线：V2-V4, V3-V4（被遮挡的后方棱） -->
                <line id="scene1-a-edge-5" x1="140" y1="270" x2="180" y2="230" stroke="#888888" stroke-width="2" stroke-dasharray="4,4"/>
                <line id="scene1-a-edge-6" x1="220" y1="270" x2="180" y2="230" stroke="#888888" stroke-width="2" stroke-dasharray="4,4"/>
                
                <!-- 碳原子圆点（4 个） -->
                <circle id="scene1-a-dot-1" cx="180" cy="160" r="4" fill="#000000" class="scene1-hidden"/>
                <circle id="scene1-a-dot-2" cx="140" cy="270" r="4" fill="#000000" class="scene1-hidden"/>
                <circle id="scene1-a-dot-3" cx="220" cy="270" r="4" fill="#000000" class="scene1-hidden"/>
                <circle id="scene1-a-dot-4" cx="180" cy="230" r="4" fill="#000000" class="scene1-hidden"/>
                
                <!-- C-H 键短线（4 条） -->
                <line id="scene1-a-ch-1" x1="180" y1="160" x2="180" y2="145" stroke="#000000" stroke-width="1.5" class="scene1-hidden"/>
                <line id="scene1-a-ch-2" x1="140" y1="270" x2="125" y2="285" stroke="#000000" stroke-width="1.5" class="scene1-hidden"/>
                <line id="scene1-a-ch-3" x1="220" y1="270" x2="235" y2="285" stroke="#000000" stroke-width="1.5" class="scene1-hidden"/>
                <line id="scene1-a-ch-4" x1="180" y1="230" x2="180" y2="245" stroke="#000000" stroke-width="1.5" class="scene1-hidden"/>
                
                <!-- 分子式 -->
                <text id="scene1-a-formula" x="180" y="110" text-anchor="middle" font-size="14" fill="#000000" class="scene1-hidden">C₄H₄</text>
                
                <!-- 结构标签 -->
                <text id="scene1-a-label" x="180" y="350" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">A</text>
                
                <!-- 最简式 -->
                <text id="scene1-simple-a" x="180" y="385" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565c0" class="scene1-hidden">CH</text>
            </g>
            
            <!-- 结构 B（三棱柱烷） -->
            <g id="scene1-struct-b">
                <!-- 棱（碳碳键） -->
                <!-- 上底面三角形 -->
                <line id="scene1-b-edge-1" x1="360" y1="170" x2="440" y2="170" stroke="#000000" stroke-width="2"/>
                <line id="scene1-b-edge-2" x1="440" y1="170" x2="400" y2="145" stroke="#000000" stroke-width="2"/>
                <line id="scene1-b-edge-3" x1="400" y1="145" x2="360" y2="170" stroke="#000000" stroke-width="2"/>
                <!-- 下底面前棱 -->
                <line id="scene1-b-edge-4" x1="360" y1="270" x2="440" y2="270" stroke="#000000" stroke-width="2"/>
                <!-- 前侧竖棱 -->
                <line id="scene1-b-edge-5" x1="360" y1="170" x2="360" y2="270" stroke="#000000" stroke-width="2"/>
                <line id="scene1-b-edge-6" x1="440" y1="170" x2="440" y2="270" stroke="#000000" stroke-width="2"/>
                <!-- 虚线：被遮挡的棱 -->
                <line id="scene1-b-edge-7" x1="360" y1="270" x2="400" y2="245" stroke="#888888" stroke-width="2" stroke-dasharray="4,4"/>
                <line id="scene1-b-edge-8" x1="440" y1="270" x2="400" y2="245" stroke="#888888" stroke-width="2" stroke-dasharray="4,4"/>
                <line id="scene1-b-edge-9" x1="400" y1="145" x2="400" y2="245" stroke="#888888" stroke-width="2" stroke-dasharray="4,4"/>
                
                <!-- 碳原子圆点（6 个） -->
                <circle id="scene1-b-dot-1" cx="360" cy="170" r="4" fill="#000000" class="scene1-hidden"/>
                <circle id="scene1-b-dot-2" cx="440" cy="170" r="4" fill="#000000" class="scene1-hidden"/>
                <circle id="scene1-b-dot-3" cx="400" cy="145" r="4" fill="#000000" class="scene1-hidden"/>
                <circle id="scene1-b-dot-4" cx="360" cy="270" r="4" fill="#000000" class="scene1-hidden"/>
                <circle id="scene1-b-dot-5" cx="440" cy="270" r="4" fill="#000000" class="scene1-hidden"/>
                <circle id="scene1-b-dot-6" cx="400" cy="245" r="4" fill="#000000" class="scene1-hidden"/>
                
                <!-- C-H 键短线（6 条） -->
                <line id="scene1-b-ch-1" x1="360" y1="170" x2="345" y2="155" stroke="#000000" stroke-width="1.5" class="scene1-hidden"/>
                <line id="scene1-b-ch-2" x1="440" y1="170" x2="455" y2="155" stroke="#000000" stroke-width="1.5" class="scene1-hidden"/>
                <line id="scene1-b-ch-3" x1="400" y1="145" x2="400" y2="130" stroke="#000000" stroke-width="1.5" class="scene1-hidden"/>
                <line id="scene1-b-ch-4" x1="360" y1="270" x2="345" y2="285" stroke="#000000" stroke-width="1.5" class="scene1-hidden"/>
                <line id="scene1-b-ch-5" x1="440" y1="270" x2="455" y2="285" stroke="#000000" stroke-width="1.5" class="scene1-hidden"/>
                <line id="scene1-b-ch-6" x1="400" y1="245" x2="400" y2="260" stroke="#000000" stroke-width="1.5" class="scene1-hidden"/>
                
                <!-- 分子式 -->
                <text id="scene1-b-formula" x="400" y="110" text-anchor="middle" font-size="14" fill="#000000" class="scene1-hidden">C₆H₆</text>
                
                <!-- 结构标签 -->
                <text id="scene1-b-label" x="400" y="350" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">B</text>
                
                <!-- 最简式 -->
                <text id="scene1-simple-b" x="400" y="385" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565c0" class="scene1-hidden">CH</text>
            </g>
            
            <!-- 结构 C（立方烷） -->
            <g id="scene1-struct-c">
                <!-- 棱（碳碳键） -->
                <!-- 前方面正方形 -->
                <line id="scene1-c-edge-1" x1="570" y1="180" x2="670" y2="180" stroke="#000000" stroke-width="2"/>
                <line id="scene1-c-edge-2" x1="670" y1="180" x2="670" y2="280" stroke="#000000" stroke-width="2"/>
                <line id="scene1-c-edge-3" x1="670" y1="280" x2="570" y2="280" stroke="#000000" stroke-width="2"/>
                <line id="scene1-c-edge-4" x1="570" y1="280" x2="570" y2="180" stroke="#000000" stroke-width="2"/>
                <!-- 可见的连接棱 -->
                <line id="scene1-c-edge-5" x1="570" y1="180" x2="600" y2="150" stroke="#000000" stroke-width="2"/>
                <line id="scene1-c-edge-6" x1="670" y1="180" x2="700" y2="150" stroke="#000000" stroke-width="2"/>
                <line id="scene1-c-edge-7" x1="670" y1="280" x2="700" y2="250" stroke="#000000" stroke-width="2"/>
                <!-- 后方面可见棱 -->
                <line id="scene1-c-edge-8" x1="600" y1="150" x2="700" y2="150" stroke="#000000" stroke-width="2"/>
                <line id="scene1-c-edge-9" x1="700" y1="150" x2="700" y2="250" stroke="#000000" stroke-width="2"/>
                <!-- 虚线：被遮挡的棱 -->
                <line id="scene1-c-edge-10" x1="570" y1="280" x2="600" y2="250" stroke="#888888" stroke-width="2" stroke-dasharray="4,4"/>
                <line id="scene1-c-edge-11" x1="600" y1="250" x2="700" y2="250" stroke="#888888" stroke-width="2" stroke-dasharray="4,4"/>
                <line id="scene1-c-edge-12" x1="600" y1="250" x2="600" y2="150" stroke="#888888" stroke-width="2" stroke-dasharray="4,4"/>
                
                <!-- 碳原子圆点（8 个） -->
                <circle id="scene1-c-dot-1" cx="570" cy="180" r="4" fill="#000000" class="scene1-hidden"/>
                <circle id="scene1-c-dot-2" cx="670" cy="180" r="4" fill="#000000" class="scene1-hidden"/>
                <circle id="scene1-c-dot-3" cx="670" cy="280" r="4" fill="#000000" class="scene1-hidden"/>
                <circle id="scene1-c-dot-4" cx="570" cy="280" r="4" fill="#000000" class="scene1-hidden"/>
                <circle id="scene1-c-dot-5" cx="600" cy="150" r="4" fill="#000000" class="scene1-hidden"/>
                <circle id="scene1-c-dot-6" cx="700" cy="150" r="4" fill="#000000" class="scene1-hidden"/>
                <circle id="scene1-c-dot-7" cx="700" cy="250" r="4" fill="#000000" class="scene1-hidden"/>
                <circle id="scene1-c-dot-8" cx="600" cy="250" r="4" fill="#000000" class="scene1-hidden"/>
                
                <!-- C-H 键短线（8 条） -->
                <line id="scene1-c-ch-1" x1="570" y1="180" x2="555" y2="165" stroke="#000000" stroke-width="1.5" class="scene1-hidden"/>
                <line id="scene1-c-ch-2" x1="670" y1="180" x2="685" y2="165" stroke="#000000" stroke-width="1.5" class="scene1-hidden"/>
                <line id="scene1-c-ch-3" x1="670" y1="280" x2="685" y2="295" stroke="#000000" stroke-width="1.5" class="scene1-hidden"/>
                <line id="scene1-c-ch-4" x1="570" y1="280" x2="555" y2="295" stroke="#000000" stroke-width="1.5" class="scene1-hidden"/>
                <line id="scene1-c-ch-5" x1="600" y1="150" x2="600" y2="135" stroke="#000000" stroke-width="1.5" class="scene1-hidden"/>
                <line id="scene1-c-ch-6" x1="700" y1="150" x2="715" y2="135" stroke="#000000" stroke-width="1.5" class="scene1-hidden"/>
                <line id="scene1-c-ch-7" x1="700" y1="250" x2="715" y2="265" stroke="#000000" stroke-width="1.5" class="scene1-hidden"/>
                <line id="scene1-c-ch-8" x1="600" y1="250" x2="585" y2="265" stroke="#000000" stroke-width="1.5" class="scene1-hidden"/>
                
                <!-- 分子式 -->
                <text id="scene1-c-formula" x="620" y="110" text-anchor="middle" font-size="14" fill="#000000" class="scene1-hidden">C₈H₈</text>
                
                <!-- 结构标签 -->
                <text id="scene1-c-label" x="620" y="350" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">C</text>
                
                <!-- 最简式 -->
                <text id="scene1-simple-c" x="620" y="385" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565c0" class="scene1-hidden">CH</text>
            </g>
        </svg>
        
        <!-- 控件栏 -->
        <div id="scene1-controls">
            <button id="scene1-prev-btn" class="scene1-btn" disabled>◀ 上一步</button>
            <span id="scene1-step-indicator">步骤 1/5</span>
            <button id="scene1-next-btn" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 1 实现
        let currentStep = 0;
        const totalSteps = 5;
        
        // 工具函数：显示元素
        function show(el) {
            if (el) {
                el.classList.remove('scene1-hidden');
                el.classList.add('scene1-visible');
            }
        }
        
        // 工具函数：隐藏元素
        function hide(el) {
            if (el) {
                el.classList.remove('scene1-visible');
                el.classList.add('scene1-hidden');
            }
        }
        
        // 更新显示状态
        function updateDisplay() {
            // 更新步骤指示器
            const indicator = document.getElementById('scene1-step-indicator');
            indicator.textContent = '步骤 ' + (currentStep + 1) + '/5';
            
            // 更新按钮状态
            const prevBtn = document.getElementById('scene1-prev-btn');
            const nextBtn = document.getElementById('scene1-next-btn');
            prevBtn.disabled = (currentStep === 0);
            nextBtn.disabled = (currentStep === totalSteps - 1);
            
            // 步骤 0：初始状态 - 只显示线框和标签
            // 步骤 1：高亮 A，显示 A 的碳原子、C-H 键、分子式
            // 步骤 2：高亮 B，显示 B 的碳原子、C-H 键、分子式
            // 步骤 3：高亮 C，显示 C 的碳原子、C-H 键、分子式
            // 步骤 4：显示所有最简式
            
            // 结构 A 相关元素
            const aFormula = document.getElementById('scene1-a-formula');
            const aDots = [
                document.getElementById('scene1-a-dot-1'),
                document.getElementById('scene1-a-dot-2'),
                document.getElementById('scene1-a-dot-3'),
                document.getElementById('scene1-a-dot-4')
            ];
            const aChBonds = [
                document.getElementById('scene1-a-ch-1'),
                document.getElementById('scene1-a-ch-2'),
                document.getElementById('scene1-a-ch-3'),
                document.getElementById('scene1-a-ch-4')
            ];
            const aEdges = [
                document.getElementById('scene1-a-edge-1'),
                document.getElementById('scene1-a-edge-2'),
                document.getElementById('scene1-a-edge-3'),
                document.getElementById('scene1-a-edge-4'),
                document.getElementById('scene1-a-edge-5'),
                document.getElementById('scene1-a-edge-6')
            ];
            const simpleA = document.getElementById('scene1-simple-a');
            
            // 结构 B 相关元素
            const bFormula = document.getElementById('scene1-b-formula');
            const bDots = [
                document.getElementById('scene1-b-dot-1'),
                document.getElementById('scene1-b-dot-2'),
                document.getElementById('scene1-b-dot-3'),
                document.getElementById('scene1-b-dot-4'),
                document.getElementById('scene1-b-dot-5'),
                document.getElementById('scene1-b-dot-6')
            ];
            const bChBonds = [
                document.getElementById('scene1-b-ch-1'),
                document.getElementById('scene1-b-ch-2'),
                document.getElementById('scene1-b-ch-3'),
                document.getElementById('scene1-b-ch-4'),
                document.getElementById('scene1-b-ch-5'),
                document.getElementById('scene1-b-ch-6')
            ];
            const bEdges = [
                document.getElementById('scene1-b-edge-1'),
                document.getElementById('scene1-b-edge-2'),
                document.getElementById('scene1-b-edge-3'),
                document.getElementById('scene1-b-edge-4'),
                document.getElementById('scene1-b-edge-5'),
                document.getElementById('scene1-b-edge-6'),
                document.getElementById('scene1-b-edge-7'),
                document.getElementById('scene1-b-edge-8'),
                document.getElementById('scene1-b-edge-9')
            ];
            const simpleB = document.getElementById('scene1-simple-b');
            
            // 结构 C 相关元素
            const cFormula = document.getElementById('scene1-c-formula');
            const cDots = [
                document.getElementById('scene1-c-dot-1'),
                document.getElementById('scene1-c-dot-2'),
                document.getElementById('scene1-c-dot-3'),
                document.getElementById('scene1-c-dot-4'),
                document.getElementById('scene1-c-dot-5'),
                document.getElementById('scene1-c-dot-6'),
                document.getElementById('scene1-c-dot-7'),
                document.getElementById('scene1-c-dot-8')
            ];
            const cChBonds = [
                document.getElementById('scene1-c-ch-1'),
                document.getElementById('scene1-c-ch-2'),
                document.getElementById('scene1-c-ch-3'),
                document.getElementById('scene1-c-ch-4'),
                document.getElementById('scene1-c-ch-5'),
                document.getElementById('scene1-c-ch-6'),
                document.getElementById('scene1-c-ch-7'),
                document.getElementById('scene1-c-ch-8')
            ];
            const cEdges = [
                document.getElementById('scene1-c-edge-1'),
                document.getElementById('scene1-c-edge-2'),
                document.getElementById('scene1-c-edge-3'),
                document.getElementById('scene1-c-edge-4'),
                document.getElementById('scene1-c-edge-5'),
                document.getElementById('scene1-c-edge-6'),
                document.getElementById('scene1-c-edge-7'),
                document.getElementById('scene1-c-edge-8'),
                document.getElementById('scene1-c-edge-9'),
                document.getElementById('scene1-c-edge-10'),
                document.getElementById('scene1-c-edge-11'),
                document.getElementById('scene1-c-edge-12')
            ];
            const simpleC = document.getElementById('scene1-simple-c');
            
            // 重置所有高亮
            function resetHighlight(edges, color) {
                edges.forEach(function(edge) {
                    if (edge) {
                        if (edge.getAttribute('stroke-dasharray')) {
                            edge.setAttribute('stroke', '#888888');
                        } else {
                            edge.setAttribute('stroke', '#000000');
                        }
                        edge.setAttribute('stroke-width', '2');
                    }
                });
            }
            
            // 应用高亮
            function applyHighlight(edges, color) {
                edges.forEach(function(edge) {
                    if (edge) {
                        edge.setAttribute('stroke', color);
                        edge.setAttribute('stroke-width', '2.5');
                    }
                });
            }
            
            // 步骤 0：初始状态
            if (currentStep === 0) {
                // 隐藏所有分子式、碳原子、C-H 键、最简式
                hide(aFormula);
                aDots.forEach(hide);
                aChBonds.forEach(hide);
                hide(simpleA);
                
                hide(bFormula);
                bDots.forEach(hide);
                bChBonds.forEach(hide);
                hide(simpleB);
                
                hide(cFormula);
                cDots.forEach(hide);
                cChBonds.forEach(hide);
                hide(simpleC);
                
                // 重置所有高亮
                resetHighlight(aEdges, '#1565c0');
                resetHighlight(bEdges, '#2e7d32');
                resetHighlight(cEdges, '#c62828');
            }
            
            // 步骤 1：高亮 A
            if (currentStep >= 1) {
                show(aFormula);
                aDots.forEach(show);
                aChBonds.forEach(show);
                applyHighlight(aEdges, '#1565c0');
            }
            
            // 步骤 2：高亮 B
            if (currentStep >= 2) {
                show(bFormula);
                bDots.forEach(show);
                bChBonds.forEach(show);
                applyHighlight(bEdges, '#2e7d32');
            }
            
            // 步骤 3：高亮 C
            if (currentStep >= 3) {
                show(cFormula);
                cDots.forEach(show);
                cChBonds.forEach(show);
                applyHighlight(cEdges, '#c62828');
            }
            
            // 步骤 4：显示最简式
            if (currentStep >= 4) {
                show(simpleA);
                show(simpleB);
                show(simpleC);
            }
        }
        
        // 事件绑定
        document.getElementById('scene1-prev-btn').addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        });
        
        document.getElementById('scene1-next-btn').addEventListener('click', function() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateDisplay();
            }
        });
        
        // 初始化
        updateDisplay();
    })();
    </script>
</body>
</html>
