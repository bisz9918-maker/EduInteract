<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>立方烷与苯乙烯同分异构体</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene3-btn {
            padding: 8px 16px;
            font-size: 14px;
            border: 2px solid #333;
            border-radius: 6px;
            background: #f5f5f5;
            cursor: pointer;
            transition: all 0.2s;
        }
        .scene3-btn:hover { background: #e0e0e0; }
        .scene3-btn.active { background: #1976d2; color: white; border-color: #1976d2; }
        .scene3-element { transition: opacity 0.3s ease; }
        .scene3-hidden { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg width="800" height="500" id="scene3-svg">
            <!-- 立方烷结构 (步骤 0) -->
            <g id="scene3-cubane" class="scene3-element">
                <!-- 立方体线框：前方面 -->
                <line x1="140" y1="100" x2="260" y2="100" stroke="#000" stroke-width="2"/>
                <line x1="260" y1="100" x2="260" y2="220" stroke="#000" stroke-width="2"/>
                <line x1="260" y1="220" x2="140" y2="220" stroke="#000" stroke-width="2"/>
                <line x1="140" y1="220" x2="140" y2="100" stroke="#000" stroke-width="2"/>
                <!-- 立方体线框：后方面（偏移） -->
                <line x1="170" y1="70" x2="290" y2="70" stroke="#000" stroke-width="2"/>
                <line x1="290" y1="70" x2="290" y2="190" stroke="#000" stroke-width="2"/>
                <line x1="290" y1="190" x2="170" y2="190" stroke="#000" stroke-width="2"/>
                <line x1="170" y1="190" x2="170" y2="70" stroke="#000" stroke-width="2"/>
                <!-- 连接线 -->
                <line x1="140" y1="100" x2="170" y2="70" stroke="#000" stroke-width="2"/>
                <line x1="260" y1="100" x2="290" y2="70" stroke="#000" stroke-width="2"/>
                <line x1="260" y1="220" x2="290" y2="190" stroke="#000" stroke-width="2"/>
                <!-- 被遮挡的边（虚线） -->
                <line x1="140" y1="220" x2="170" y2="190" stroke="#888" stroke-width="2" stroke-dasharray="5,5"/>
                <line x1="170" y1="190" x2="170" y2="70" stroke="#888" stroke-width="2" stroke-dasharray="5,5"/>
                <line x1="170" y1="70" x2="140" y2="100" stroke="#888" stroke-width="2" stroke-dasharray="5,5"/>
                <!-- 标签：调整垂直间距至 15px (y 差值=28) -->
                <text x="200" y="245" text-anchor="middle" font-size="16" fill="#000">立方烷</text>
                <text x="200" y="280" text-anchor="middle" font-size="14" fill="#000">C₈H₈</text>
            </g>

            <!-- 苯乙烯结构 (步骤 1, 2) -->
            <g id="scene3-styrene" class="scene3-element scene3-hidden">
                <!-- 苯环六边形 (中心约 550, 160) -->
                <polygon points="550,120 593,145 593,195 550,220 507,195 507,145" 
                         fill="none" stroke="#1565c0" stroke-width="3"/>
                <!-- 苯环内部双键示意 -->
                <line x1="550" y1="135" x2="580" y2="152" stroke="#1565c0" stroke-width="2"/>
                <line x1="580" y1="152" x2="580" y2="188" stroke="#1565c0" stroke-width="2"/>
                <line x1="550" y1="205" x2="520" y2="188" stroke="#1565c0" stroke-width="2"/>
                <!-- 乙烯基 -CH=CH₂ (从苯环右侧延伸) -->
                <!-- C-C 单键 -->
                <line x1="593" y1="145" x2="630" y2="145" stroke="#000" stroke-width="2"/>
                <!-- C=C 双键 (红色加粗) -->
                <line x1="630" y1="145" x2="670" y2="145" stroke="#c62828" stroke-width="4"/>
                <line x1="630" y1="152" x2="670" y2="152" stroke="#c62828" stroke-width="4"/>
                <!-- 末端 H 示意 -->
                <line x1="670" y1="145" x2="685" y2="130" stroke="#000" stroke-width="1.5"/>
                <line x1="670" y1="145" x2="685" y2="160" stroke="#000" stroke-width="1.5"/>
                <!-- 标签：调整垂直间距至 15px (y 差值=28) -->
                <text x="550" y="245" text-anchor="middle" font-size="16" fill="#000">苯乙烯</text>
                <text x="550" y="280" text-anchor="middle" font-size="14" fill="#000">C₈H₈</text>
            </g>

            <!-- 高锰酸钾褪色反应示意 (步骤 2) -->
            <g id="scene3-reaction" class="scene3-element scene3-hidden">
                <!-- 反应前溶液瓶 (左侧) -->
                <rect x="150" y="330" width="130" height="100" fill="none" stroke="#333" stroke-width="2" rx="5"/>
                <!-- 紫色溶液 -->
                <rect x="160" y="360" width="110" height="60" fill="#9c27b0" fill-opacity="0.6" rx="3"/>
                <!-- 标签上移至瓶口上方 -->
                <text x="215" y="315" text-anchor="middle" font-size="14" fill="#000">KMnO₄(紫色)</text>
                
                <!-- 反应箭头 -->
                <defs>
                    <marker id="scene3-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                        <polygon points="0 0, 10 3, 0 6" fill="#000"/>
                    </marker>
                </defs>
                <line x1="300" y1="375" x2="480" y2="375" stroke="#000" stroke-width="2" marker-end="url(#scene3-arrowhead)"/>
                
                <!-- 反应后溶液瓶 (右侧) -->
                <rect x="520" y="330" width="130" height="100" fill="none" stroke="#333" stroke-width="2" rx="5"/>
                <!-- 无色溶液 (浅灰) -->
                <rect x="530" y="360" width="110" height="60" fill="#e0e0e0" rx="3"/>
                <!-- 标签上移至瓶口上方 -->
                <text x="585" y="315" text-anchor="middle" font-size="14" fill="#000">Mn²⁺(无色)</text>
            </g>

            <!-- 控件栏 (SVG 内部底部) -->
            <g id="scene3-controls-svg" style="position: absolute; bottom: 10px; left: 0; right: 0;">
                <!-- 按钮由 HTML 控件实现 -->
            </g>
        </svg>
        
        <!-- HTML 控件栏 -->
        <div id="scene3-controls">
            <button id="scene3-btn1" class="scene3-btn active">立方烷</button>
            <button id="scene3-btn2" class="scene3-btn">苯乙烯</button>
            <button id="scene3-btn3" class="scene3-btn">褪色反应</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 3: 立方烷与苯乙烯同分异构体
        let currentState = 0;

        const cubaneEl = document.getElementById('scene3-cubane');
        const styreneEl = document.getElementById('scene3-styrene');
        const reactionEl = document.getElementById('scene3-reaction');
        const btn1 = document.getElementById('scene3-btn1');
        const btn2 = document.getElementById('scene3-btn2');
        const btn3 = document.getElementById('scene3-btn3');

        function updateState(state) {
            currentState = state;
            
            // 更新按钮状态
            btn1.classList.remove('active');
            btn2.classList.remove('active');
            btn3.classList.remove('active');

            // 隐藏所有元素
            cubaneEl.classList.add('scene3-hidden');
            styreneEl.classList.add('scene3-hidden');
            reactionEl.classList.add('scene3-hidden');

            if (state === 0) {
                // 步骤 0: 显示立方烷
                cubaneEl.classList.remove('scene3-hidden');
                btn1.classList.add('active');
            } else if (state === 1) {
                // 步骤 1: 显示苯乙烯
                styreneEl.classList.remove('scene3-hidden');
                btn2.classList.add('active');
            } else if (state === 2) {
                // 步骤 2: 显示苯乙烯 + 褪色反应
                styreneEl.classList.remove('scene3-hidden');
                reactionEl.classList.remove('scene3-hidden');
                btn3.classList.add('active');
            }
        }

        btn1.addEventListener('click', () => updateState(0));
        btn2.addEventListener('click', () => updateState(1));
        btn3.addEventListener('click', () => updateState(2));
    })();
    </script>
</body>
</html>
