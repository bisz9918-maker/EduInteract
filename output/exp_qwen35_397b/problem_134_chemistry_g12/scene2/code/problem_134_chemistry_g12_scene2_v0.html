<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四面体烷的二氯代物分析</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene2-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene2-svg {
            width: 800px;
            height: 500px;
        }
        .scene2-btn {
            padding: 8px 16px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .scene2-btn-prev {
            background-color: #e0e0e0;
            color: #666;
        }
        .scene2-btn-prev:enabled {
            background-color: #9e9e9e;
            color: #fff;
        }
        .scene2-btn-next {
            background-color: #1565c0;
            color: #fff;
        }
        .scene2-btn-next:hover {
            background-color: #0d47a1;
        }
        .scene2-step-indicator {
            font-size: 14px;
            color: #666;
            min-width: 40px;
            text-align: center;
        }
        #scene2-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="scene2-container">
        <svg id="scene2-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 四面体碳架结构 -->
            <g id="scene2-tetrahedron">
                <!-- 前棱（实线） -->
                <line id="scene2-tetrahedron-front-edge-1" x1="150" y1="280" x2="250" y2="150" stroke="#000000" stroke-width="2" fill="none"/>
                <line id="scene2-tetrahedron-front-edge-2" x1="250" y1="150" x2="350" y2="280" stroke="#000000" stroke-width="2" fill="none"/>
                <line id="scene2-tetrahedron-front-edge-3" x1="150" y1="280" x2="350" y2="280" stroke="#000000" stroke-width="2" fill="none"/>
                
                <!-- 后棱（虚线，被遮挡） -->
                <line id="scene2-tetrahedron-back-edge-1" x1="250" y1="150" x2="250" y2="320" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" fill="none"/>
                <line id="scene2-tetrahedron-back-edge-2" x1="150" y1="280" x2="250" y2="320" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" fill="none"/>
                <line id="scene2-tetrahedron-back-edge-3" x1="350" y1="280" x2="250" y2="320" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" fill="none"/>
                
                <!-- 顶点圆点 -->
                <circle id="scene2-vertex-top" cx="250" cy="150" r="6" fill="#000000"/>
                <circle id="scene2-vertex-left" cx="150" cy="280" r="6" fill="#000000"/>
                <circle id="scene2-vertex-right" cx="350" cy="280" r="6" fill="#000000"/>
                <circle id="scene2-vertex-back" cx="250" cy="320" r="6" fill="#000000"/>
            </g>
            
            <!-- 高亮顶点（步骤 1-2 显示） -->
            <g id="scene2-highlight-group" style="display: none;">
                <circle id="scene2-highlight-top" cx="250" cy="150" r="8" fill="#1565c0" opacity="0.7"/>
                <circle id="scene2-highlight-left" cx="150" cy="280" r="8" fill="#1565c0" opacity="0.7"/>
                <text id="scene2-label-pos1" x="240" y="135" font-size="12" fill="#1565c0" text-anchor="middle">位置 1</text>
                <text id="scene2-label-pos2" x="140" y="265" font-size="12" fill="#1565c0" text-anchor="middle">位置 2</text>
            </g>
            
            <!-- 旋转箭头（步骤 2 显示） -->
            <g id="scene2-rotate-arrow" style="display: none;">
                <path d="M 380 200 A 40 40 0 1 1 430 250" stroke="#888888" stroke-width="3" fill="none" marker-end="url(#scene2-arrowhead)"/>
                <defs>
                    <marker id="scene2-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                        <polygon points="0 0, 10 3, 0 6" fill="#888888"/>
                    </marker>
                </defs>
                <text x="405" y="260" font-size="11" fill="#888888" text-anchor="middle">对称旋转</text>
            </g>
            
            <!-- 氯原子（步骤 3-4 显示） -->
            <g id="scene2-chlorine-group" style="display: none;">
                <circle id="scene2-cl-atom-1" cx="250" cy="150" r="8" fill="#2e7d32"/>
                <circle id="scene2-cl-atom-2" cx="150" cy="280" r="8" fill="#2e7d32"/>
                <text id="scene2-cl-label-1" x="250" y="130" font-size="12" fill="#2e7d32" text-anchor="middle">Cl</text>
                <text id="scene2-cl-label-2" x="135" y="260" font-size="12" fill="#2e7d32" text-anchor="middle">Cl</text>
            </g>
            
            <!-- 二氯代物结构（右侧，步骤 3-4 显示） -->
            <g id="scene2-dichloro-structure" style="display: none;">
                <!-- 四面体结构 -->
                <line x1="550" y1="180" x2="500" y2="280" stroke="#000000" stroke-width="2"/>
                <line x1="550" y1="180" x2="600" y2="280" stroke="#000000" stroke-width="2"/>
                <line x1="500" y1="280" x2="600" y2="280" stroke="#000000" stroke-width="2"/>
                <line x1="550" y1="180" x2="550" y2="320" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>
                <line x1="500" y1="280" x2="550" y2="320" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>
                <line x1="600" y1="280" x2="550" y2="320" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>
                
                <!-- 氯原子 -->
                <circle cx="550" cy="180" r="8" fill="#2e7d32"/>
                <circle cx="500" cy="280" r="8" fill="#2e7d32"/>
                <text x="550" y="165" font-size="12" fill="#2e7d32" text-anchor="middle">Cl</text>
                <text x="485" y="265" font-size="12" fill="#2e7d32" text-anchor="middle">Cl</text>
                
                <!-- 标题 -->
                <text x="550" y="150" font-size="14" fill="#000000" text-anchor="middle" font-weight="bold">二氯代物结构</text>
            </g>
            
            <!-- 结论文本框（步骤 4 显示） -->
            <g id="scene2-conclusion-group" style="display: none;">
                <rect id="scene2-conclusion-box" x="480" y="360" width="270" height="60" fill="#ffffff" stroke="#c62828" stroke-width="2"/>
                <text id="scene2-conclusion-text" x="615" y="395" font-size="16" fill="#c62828" text-anchor="middle" font-weight="bold">二氯代物只有 1 种</text>
            </g>
            
            <!-- 控件栏背景 -->
            <rect x="0" y="440" width="800" height="60" fill="#f5f5f5" opacity="0.8"/>
        </svg>
        
        <div id="scene2-controls">
            <button id="scene2-btn-prev" class="scene2-btn scene2-btn-prev" disabled>◀ 上一步</button>
            <span id="scene2-step-indicator" class="scene2-step-indicator">1/5</span>
            <button id="scene2-btn-next" class="scene2-btn scene2-btn-next">下一步 ▶</button>
        </div>
    </div>
    
    <script>
    (function() {
        // Scene 2: 四面体烷的二氯代物分析
        // 布局坐标表：
        // | 元素 | 类型 | 位置/范围 | 大小 | 标签偏移方向 | 备注 |
        // |------|------|-----------|------|-------------|------|
        // | 四面体 - 前棱 1 | 线段 | (150,280)-(250,150) | 2px 实线 | - | 左前棱 |
        // | 四面体 - 前棱 2 | 线段 | (250,150)-(350,280) | 2px 实线 | - | 右前棱 |
        // | 四面体 - 前棱 3 | 线段 | (150,280)-(350,280) | 2px 实线 | - | 底前棱 |
        // | 四面体 - 后棱 1 | 线段 | (250,150)-(250,320) | 2px 虚线 | - | 顶点到底面中心 |
        // | 四面体 - 后棱 2 | 线段 | (150,280)-(250,320) | 2px 虚线 | - | 左后棱 |
        // | 四面体 - 后棱 3 | 线段 | (350,280)-(250,320) | 2px 虚线 | - | 右后棱 |
        // | 顶点 - 上 | 圆点 | (250,150) | r=6 | 上方 10px | 碳原子位置 |
        // | 顶点 - 左下 | 圆点 | (150,280) | r=6 | 左下 10px | 碳原子位置 |
        // | 顶点 - 右下 | 圆点 | (350,280) | r=6 | 右下 10px | 碳原子位置 |
        // | 顶点 - 后 | 圆点 | (250,320) | r=6 | 下方 10px | 碳原子位置 |
        // | 标签 - 位置 1 | text | (240,135) | ~35×14 | 上方 | 高亮顶点时用 |
        // | 标签 - 位置 2 | text | (140,265) | ~35×14 | 左下 | 高亮顶点时用 |
        // | 氯原子-Cl1 | 圆点 | (250,150) | r=8, 绿色 | 上方 12px | 二氯代物展示用 |
        // | 氯原子-Cl2 | 圆点 | (150,280) | r=8, 绿色 | 左下 12px | 二氯代物展示用 |
        // | 标签-Cl1 | text | (250,130) | ~20×14 | 上方 | "Cl" |
        // | 标签-Cl2 | text | (135,260) | ~20×14 | 左下 | "Cl" |
        // | 旋转箭头 | 弧形箭头 | (380,200)-(430,250) | 半径 40px | - | 表示对称操作 |
        // | 二氯代物结构 | 线段组 | (500,150)-(650,320) | 2px 实线 | - | 右侧展示最终结构 |
        // | 结论文本框 | rect | (480,360)-(750,420) | 270×60 | - | 红色边框 |
        // | 结论文字 | text | (615,395) | ~240×30 | - | "二氯代物只有 1 种" |
        
        const TOTAL_STEPS = 5;
        let currentStep = 0;
        
        // 获取 DOM 元素
        const highlightGroup = document.getElementById('scene2-highlight-group');
        const rotateArrow = document.getElementById('scene2-rotate-arrow');
        const chlorineGroup = document.getElementById('scene2-chlorine-group');
        const dichloroStructure = document.getElementById('scene2-dichloro-structure');
        const conclusionGroup = document.getElementById('scene2-conclusion-group');
        const btnPrev = document.getElementById('scene2-btn-prev');
        const btnNext = document.getElementById('scene2-btn-next');
        const stepIndicator = document.getElementById('scene2-step-indicator');
        
        // 更新步骤显示
        function updateStepDisplay() {
            stepIndicator.textContent = (currentStep + 1) + '/' + TOTAL_STEPS;
            
            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            if (currentStep === TOTAL_STEPS - 1) {
                btnNext.textContent = '完成';
            } else {
                btnNext.textContent = '下一步 ▶';
            }
        }
        
        // 渲染步骤
        function renderStep(step) {
            // 隐藏所有动态元素
            highlightGroup.style.display = 'none';
            rotateArrow.style.display = 'none';
            chlorineGroup.style.display = 'none';
            dichloroStructure.style.display = 'none';
            conclusionGroup.style.display = 'none';
            
            // 根据步骤显示相应元素
            // 步骤 1-2: 显示高亮顶点和位置标签
            if (step === 1 || step === 2) {
                highlightGroup.style.display = 'block';
            }
            // 步骤 2: 显示旋转箭头
            if (step === 2) {
                rotateArrow.style.display = 'block';
            }
            // 步骤 3-4: 显示氯原子和二氯代物结构（不显示位置标签）
            if (step >= 3) {
                chlorineGroup.style.display = 'block';
                dichloroStructure.style.display = 'block';
            }
            // 步骤 4: 显示结论
            if (step >= 4) {
                conclusionGroup.style.display = 'block';
            }
            
            updateStepDisplay();
        }
        
        // 下一步
        function stepForward() {
            if (currentStep < TOTAL_STEPS - 1) {
                currentStep++;
                renderStep(currentStep);
            }
        }
        
        // 上一步
        function stepBack() {
            if (currentStep > 0) {
                currentStep--;
                renderStep(currentStep);
            }
        }
        
        // 绑定事件
        btnPrev.addEventListener('click', stepBack);
        btnNext.addEventListener('click', stepForward);
        
        // 初始化
        renderStep(0);
    })();
    </script>
</body>
</html>
