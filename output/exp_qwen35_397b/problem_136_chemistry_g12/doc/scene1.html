<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星际有机分子结构展示</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: sans-serif;
        }
        #scene1-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #ffffff;
            margin: 0 auto;
            overflow: hidden;
        }
        #scene1-svg {
            width: 800px;
            height: 500px;
        }
        .scene1-atom {
            transition: opacity 0.3s ease;
        }
        .scene1-bond {
            transition: opacity 0.3s ease;
        }
        .scene1-label {
            transition: opacity 0.3s ease;
        }
        .scene1-mark {
            transition: opacity 0.3s ease;
        }
        .scene1-carbon-num {
            transition: opacity 0.3s ease;
        }
        .scene1-legend {
            opacity: 1;
        }
        .scene1-btn {
            background: #1565c0;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .scene1-btn:hover {
            background: #0d47a1;
        }
        .scene1-btn:disabled {
            background: #bdbdbd;
            cursor: not-allowed;
        }
        .scene1-step-indicator {
            font-size: 14px;
            color: #333;
            min-width: 80px;
            text-align: center;
        }
        .scene1-controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500">
            <!-- 定义条纹填充图案 -->
            <defs>
                <pattern id="scene1-stripe-pattern" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
                    <line x1="0" y1="0" x2="0" y2="6" stroke="#666666" stroke-width="2"/>
                </pattern>
            </defs>

            <!-- 图例区 (始终显示) -->
            <g id="scene1-legend-group" class="scene1-legend">
                <!-- 图例-H -->
                <circle id="scene1-legend-h-circle" cx="100" cy="400" r="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
                <text id="scene1-legend-h-text" x="120" y="405" font-size="14" fill="#000000">= H</text>
                <!-- 图例-C -->
                <circle id="scene1-legend-c-circle" cx="160" cy="400" r="10" fill="#000000" stroke="#000000" stroke-width="2"/>
                <text id="scene1-legend-c-text" x="180" y="405" font-size="14" fill="#000000">= C</text>
                <!-- 图例-未知 -->
                <circle id="scene1-legend-unknown-circle" cx="220" cy="400" r="10" fill="url(#scene1-stripe-pattern)" stroke="#000000" stroke-width="2"/>
                <text id="scene1-legend-unknown-text" x="240" y="405" font-size="14" fill="#000000">= 未知</text>
                <!-- 图例标题 -->
                <text id="scene1-legend-title" x="80" y="375" font-size="14" fill="#666666">图例:</text>
            </g>

            <!-- 分子链区域 -->
            <!-- H 原子 -->
            <circle id="scene1-h-atom" class="scene1-atom" cx="100" cy="250" r="15" fill="#ffffff" stroke="#000000" stroke-width="2" opacity="0"/>
            <text id="scene1-label-h" class="scene1-label" x="100" y="295" font-size="14" fill="#000000" text-anchor="middle" opacity="0">氢原子</text>

            <!-- C1-C9 原子 -->
            <circle id="scene1-c1" class="scene1-atom" cx="150" cy="250" r="15" fill="#000000" stroke="#000000" stroke-width="2" opacity="0"/>
            <circle id="scene1-c2" class="scene1-atom" cx="200" cy="250" r="15" fill="#000000" stroke="#000000" stroke-width="2" opacity="0"/>
            <circle id="scene1-c3" class="scene1-atom" cx="250" cy="250" r="15" fill="#000000" stroke="#000000" stroke-width="2" opacity="0"/>
            <circle id="scene1-c4" class="scene1-atom" cx="300" cy="250" r="15" fill="#000000" stroke="#000000" stroke-width="2" opacity="0"/>
            <circle id="scene1-c5" class="scene1-atom" cx="350" cy="250" r="15" fill="#000000" stroke="#000000" stroke-width="2" opacity="0"/>
            <circle id="scene1-c6" class="scene1-atom" cx="400" cy="250" r="15" fill="#000000" stroke="#000000" stroke-width="2" opacity="0"/>
            <circle id="scene1-c7" class="scene1-atom" cx="450" cy="250" r="15" fill="#000000" stroke="#000000" stroke-width="2" opacity="0"/>
            <circle id="scene1-c8" class="scene1-atom" cx="500" cy="250" r="15" fill="#000000" stroke="#000000" stroke-width="2" opacity="0"/>
            <circle id="scene1-c9" class="scene1-atom" cx="550" cy="250" r="15" fill="#000000" stroke="#000000" stroke-width="2" opacity="0"/>

            <!-- 未知原子 -->
            <circle id="scene1-unknown-atom" class="scene1-atom" cx="600" cy="250" r="15" fill="url(#scene1-stripe-pattern)" stroke="#000000" stroke-width="2" opacity="0"/>

            <!-- 碳原子标签 -->
            <text id="scene1-label-c" class="scene1-label" x="200" y="295" font-size="14" fill="#000000" text-anchor="middle" opacity="0">碳原子</text>

            <!-- 化学键 (连接相邻原子) -->
            <line id="scene1-bond1" class="scene1-bond" x1="115" y1="250" x2="135" y2="250" stroke="#000000" stroke-width="2" opacity="0"/>
            <line id="scene1-bond2" class="scene1-bond" x1="165" y1="250" x2="185" y2="250" stroke="#000000" stroke-width="2" opacity="0"/>
            <line id="scene1-bond3" class="scene1-bond" x1="215" y1="250" x2="235" y2="250" stroke="#000000" stroke-width="2" opacity="0"/>
            <line id="scene1-bond4" class="scene1-bond" x1="265" y1="250" x2="285" y2="250" stroke="#000000" stroke-width="2" opacity="0"/>
            <line id="scene1-bond5" class="scene1-bond" x1="315" y1="250" x2="335" y2="250" stroke="#000000" stroke-width="2" opacity="0"/>
            <line id="scene1-bond6" class="scene1-bond" x1="365" y1="250" x2="385" y2="250" stroke="#000000" stroke-width="2" opacity="0"/>
            <line id="scene1-bond7" class="scene1-bond" x1="415" y1="250" x2="435" y2="250" stroke="#000000" stroke-width="2" opacity="0"/>
            <line id="scene1-bond8" class="scene1-bond" x1="465" y1="250" x2="485" y2="250" stroke="#000000" stroke-width="2" opacity="0"/>
            <line id="scene1-bond9" class="scene1-bond" x1="515" y1="250" x2="535" y2="250" stroke="#000000" stroke-width="2" opacity="0"/>
            <line id="scene1-bond10" class="scene1-bond" x1="565" y1="250" x2="585" y2="250" stroke="#000000" stroke-width="2" opacity="0"/>

            <!-- 标注①②③ -->
            <!-- 标注①: 第 5-6 碳之间 (C5-C6 之间，x=375) -->
            <g id="scene1-mark1" class="scene1-mark" opacity="0">
                <circle cx="375" cy="330" r="12" fill="none" stroke="#1565c0" stroke-width="2"/>
                <text x="375" y="335" font-size="14" fill="#1565c0" text-anchor="middle">①</text>
            </g>
            <!-- 标注②: 第 8-9 碳之间 (C8-C9 之间，x=525) -->
            <g id="scene1-mark2" class="scene1-mark" opacity="0">
                <circle cx="525" cy="330" r="12" fill="none" stroke="#1565c0" stroke-width="2"/>
                <text x="525" y="335" font-size="14" fill="#1565c0" text-anchor="middle">②</text>
            </g>
            <!-- 标注③: 未知原子处 (x=600) -->
            <g id="scene1-mark3" class="scene1-mark" opacity="0">
                <circle cx="600" cy="330" r="12" fill="none" stroke="#1565c0" stroke-width="2"/>
                <text x="600" y="335" font-size="14" fill="#1565c0" text-anchor="middle">③</text>
            </g>

            <!-- 碳编号 C1-C9 (步骤 3 显示) -->
            <text id="scene1-carbon-num1" class="scene1-carbon-num" x="150" y="225" font-size="12" fill="#000000" text-anchor="middle" opacity="0">C1</text>
            <text id="scene1-carbon-num2" class="scene1-carbon-num" x="200" y="225" font-size="12" fill="#000000" text-anchor="middle" opacity="0">C2</text>
            <text id="scene1-carbon-num3" class="scene1-carbon-num" x="250" y="225" font-size="12" fill="#000000" text-anchor="middle" opacity="0">C3</text>
            <text id="scene1-carbon-num4" class="scene1-carbon-num" x="300" y="225" font-size="12" fill="#000000" text-anchor="middle" opacity="0">C4</text>
            <text id="scene1-carbon-num5" class="scene1-carbon-num" x="350" y="225" font-size="12" fill="#000000" text-anchor="middle" opacity="0">C5</text>
            <text id="scene1-carbon-num6" class="scene1-carbon-num" x="400" y="225" font-size="12" fill="#000000" text-anchor="middle" opacity="0">C6</text>
            <text id="scene1-carbon-num7" class="scene1-carbon-num" x="450" y="225" font-size="12" fill="#000000" text-anchor="middle" opacity="0">C7</text>
            <text id="scene1-carbon-num8" class="scene1-carbon-num" x="500" y="225" font-size="12" fill="#000000" text-anchor="middle" opacity="0">C8</text>
            <text id="scene1-carbon-num9" class="scene1-carbon-num" x="550" y="225" font-size="12" fill="#000000" text-anchor="middle" opacity="0">C9</text>
        </svg>

        <!-- 控件栏 -->
        <div id="scene1-controls" class="scene1-controls">
            <button id="scene1-btn-prev" class="scene1-btn">◀ 上一步</button>
            <span id="scene1-step-indicator" class="scene1-step-indicator">步骤 1/4</span>
            <button id="scene1-btn-next" class="scene1-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 1: 星际有机分子结构展示

        // 状态变量
        let currentStep = 0;
        const totalSteps = 4;

        // 元素引用
        const btnPrev = document.getElementById('scene1-btn-prev');
        const btnNext = document.getElementById('scene1-btn-next');
        const stepIndicator = document.getElementById('scene1-step-indicator');

        // 步骤 0 显示的元素（图例区始终显示）
        const step0Elements = [];

        // 步骤 1 显示的元素（分子骨架）
        const step1Elements = [
            'scene1-h-atom', 'scene1-label-h',
            'scene1-c1', 'scene1-c2', 'scene1-c3', 'scene1-c4', 'scene1-c5',
            'scene1-c6', 'scene1-c7', 'scene1-c8', 'scene1-c9',
            'scene1-unknown-atom', 'scene1-label-c',
            'scene1-bond1', 'scene1-bond2', 'scene1-bond3', 'scene1-bond4', 'scene1-bond5',
            'scene1-bond6', 'scene1-bond7', 'scene1-bond8', 'scene1-bond9', 'scene1-bond10'
        ];

        // 步骤 2 显示的元素（标注①②③）
        const step2Elements = [
            'scene1-mark1', 'scene1-mark2', 'scene1-mark3'
        ];

        // 步骤 3 显示的元素（碳编号）
        const step3Elements = [
            'scene1-carbon-num1', 'scene1-carbon-num2', 'scene1-carbon-num3',
            'scene1-carbon-num4', 'scene1-carbon-num5', 'scene1-carbon-num6',
            'scene1-carbon-num7', 'scene1-carbon-num8', 'scene1-carbon-num9'
        ];

        // 显示元素函数
        function showElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.opacity = '1';
                el.style.display = '';
            }
        }

        // 隐藏元素函数
        function hideElement(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.opacity = '0';
                el.style.display = '';
            }
        }

        // 更新显示状态
        function updateDisplay() {
            // 隐藏所有步骤元素
            step1Elements.forEach(id => hideElement(id));
            step2Elements.forEach(id => hideElement(id));
            step3Elements.forEach(id => hideElement(id));

            // 根据当前步骤显示相应元素
            if (currentStep >= 1) {
                step1Elements.forEach(id => showElement(id));
            }
            if (currentStep >= 2) {
                step2Elements.forEach(id => showElement(id));
            }
            if (currentStep >= 3) {
                step3Elements.forEach(id => showElement(id));
            }

            // 更新按钮状态
            btnPrev.disabled = (currentStep === 0);
            btnNext.disabled = (currentStep === totalSteps - 1);

            // 更新步骤指示器
            stepIndicator.textContent = '步骤 ' + (currentStep + 1) + '/' + totalSteps;
        }

        // 下一步
        function stepForward() {
            if (currentStep < totalSteps - 1) {
                currentStep++;
                updateDisplay();
            }
        }

        // 上一步
        function stepBackward() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        }

        // 绑定事件
        btnPrev.addEventListener('click', stepBackward);
        btnNext.addEventListener('click', stepForward);

        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
