<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>有机化合物 A 的分子结构与官能团分析</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: 'Segoe UI', Arial, sans-serif; }
        #scene1-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene1-svg { width: 800px; height: 500px; }
        .scene1-highlight-ester { fill: #c62828; fill-opacity: 0.15; stroke: #c62828; stroke-width: 2; }
        .scene1-highlight-bond { fill: #1565c0; fill-opacity: 0.15; stroke: #1565c0; stroke-width: 2; }
        .scene1-chiral-mark { fill: #2e7d32; stroke: #2e7d32; stroke-width: 1; }
        .scene1-info-text { font-size: 13px; fill: #333333; }
        .scene1-info-title { font-size: 15px; font-weight: bold; fill: #333333; }
        .scene1-btn-rect { fill: #e0e0e0; rx: 5; }
        .scene1-btn-text { font-size: 14px; fill: #333333; pointer-events: none; }
        .scene1-btn-group { cursor: pointer; }
        .scene1-btn-group:hover .scene1-btn-rect { fill: #bdbdbd; }
        .scene1-btn-disabled { opacity: 0.5; pointer-events: none; cursor: not-allowed; }
        .scene1-hidden { opacity: 0; }
        .scene1-visible { opacity: 1; }
    </style>
</head>
<body>
    <div id="scene1-container">
        <svg id="scene1-svg" width="800" height="500" viewBox="0 0 800 500">
            <!-- 信息框背景 -->
            <rect id="scene1-info-bg" x="540" y="70" width="240" height="340" fill="#f9f9f9" stroke="#dddddd" stroke-width="1"/>
            
            <!-- 分子骨架路径 - 根据原图精确绘制 -->
            <!-- 原图结构：从左到右依次是乙酸酯基、双键、手性碳1(连乙酸酯基)、手性碳2(连乙酸酯基)、四个共轭双键 -->
            <g id="scene1-molecule-group" stroke="#000000" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <!-- 左侧乙酸酯基：CH3-CO-O- -->
                <path d="M 70 280 L 95 265"/> <!-- CH3 到羰基碳 -->
                <path d="M 95 265 L 90 245"/> <!-- 羰基双键氧 -->
                <path d="M 95 265 L 115 275"/> <!-- 羰基碳到酯氧 -->
                <path d="M 115 275 L 140 265"/> <!-- 酯氧到双键碳1 -->
                
                <!-- 第一个双键 C=C -->
                <path d="M 140 265 L 175 275"/>
                <path d="M 142 272 L 173 282"/> <!-- 双键第二条线 -->
                
                <!-- 双键到手性碳1 -->
                <path d="M 175 275 L 205 255"/>
                
                <!-- 手性碳1 向上分支到乙酸酯基 -->
                <path d="M 205 255 L 205 225"/>
                <path d="M 205 225 L 225 210"/> <!-- 酯氧 -->
                <path d="M 225 210 L 250 200"/> <!-- 酯氧到羰基碳 -->
                <path d="M 250 200 L 250 180"/> <!-- 羰基双键氧 -->
                <path d="M 250 200 L 270 195"/> <!-- 羰基碳到甲基 -->
                
                <!-- 手性碳1 到手性碳2 -->
                <path d="M 205 255 L 250 265"/>
                
                <!-- 手性碳2 向下分支到乙酸酯基 -->
                <path d="M 250 265 L 250 295"/>
                <path d="M 250 295 L 270 310"/> <!-- 酯氧 -->
                <path d="M 270 310 L 295 305"/> <!-- 酯氧到羰基碳 -->
                <path d="M 295 305 L 300 325"/> <!-- 羰基双键氧 -->
                <path d="M 295 305 L 315 310"/> <!-- 羰基碳到甲基 -->
                
                <!-- 手性碳2 到第二个双键 -->
                <path d="M 250 265 L 290 255"/>
                
                <!-- 第二个双键 -->
                <path d="M 290 255 L 330 245"/>
                <path d="M 293 262 L 327 252"/> <!-- 双键第二条线 -->
                
                <!-- 第二个双键到第三个双键 -->
                <path d="M 330 245 L 370 250"/>
                
                <!-- 第三个双键 -->
                <path d="M 370 250 L 410 240"/>
                <path d="M 373 257 L 407 247"/> <!-- 双键第二条线 -->
                
                <!-- 第三个双键到第四个双键 -->
                <path d="M 410 240 L 450 245"/>
                
                <!-- 第四个双键 -->
                <path d="M 450 245 L 485 235"/>
                <path d="M 453 252 L 482 242"/> <!-- 双键第二条线 -->
                
                <!-- 第四个双键到末端甲基 -->
                <path d="M 485 235 L 515 230"/>
            </g>
            
            <!-- 酯基高亮区 (3 个) - 红色半透明框 -->
            <rect id="scene1-ester-1" class="scene1-highlight-ester scene1-hidden" x="65" y="240" width="55" height="45"/>
            <rect id="scene1-ester-2" class="scene1-highlight-ester scene1-hidden" x="200" y="175" width="75" height="55"/>
            <rect id="scene1-ester-3" class="scene1-highlight-ester scene1-hidden" x="245" y="290" width="75" height="50"/>
            
            <!-- 双键高亮区 (4 个) - 蓝色半透明框 -->
            <rect id="scene1-bond-1" class="scene1-highlight-bond scene1-hidden" x="135" y="260" width="45" height="30"/>
            <rect id="scene1-bond-2" class="scene1-highlight-bond scene1-hidden" x="285" y="240" width="50" height="30"/>
            <rect id="scene1-bond-3" class="scene1-highlight-bond scene1-hidden" x="365" y="235" width="50" height="30"/>
            <rect id="scene1-bond-4" class="scene1-highlight-bond scene1-hidden" x="445" y="230" width="45" height="30"/>
            
            <!-- 手性碳标记 (2 个) - 绿色圆点 -->
            <circle id="scene1-chiral-1" class="scene1-chiral-mark scene1-hidden" cx="205" cy="255" r="4"/>
            <circle id="scene1-chiral-2" class="scene1-chiral-mark scene1-hidden" cx="250" cy="265" r="4"/>
            
            <!-- 信息文本 - 使用 tspan 换行控制宽度 -->
            <text id="scene1-info-title" x="555" y="95" class="scene1-info-title">分子结构</text>
            <text id="scene1-info-content" x="555" y="125" class="scene1-info-text">
                <tspan x="555" dy="0">观察有机化合物 A 的</tspan>
                <tspan x="555" dy="18">完整骨架结构</tspan>
            </text>
            
            <!-- 上一步按钮 -->
            <g id="scene1-btn-prev-group" class="scene1-btn-group scene1-btn-disabled">
                <rect x="280" y="450" width="100" height="35" class="scene1-btn-rect"/>
                <text x="330" y="473" text-anchor="middle" class="scene1-btn-text">◀ 上一步</text>
            </g>
            
            <!-- 下一步按钮 -->
            <g id="scene1-btn-next-group" class="scene1-btn-group">
                <rect x="420" y="450" width="100" height="35" class="scene1-btn-rect"/>
                <text x="470" y="473" text-anchor="middle" class="scene1-btn-text">下一步 ▶</text>
            </g>
        </svg>
    </div>
    
    <script>
    (function() {
        // Scene 1: 有机化合物 A 的分子结构与官能团分析
        // 布局坐标表参考:
        // | 元素 | 位置 | 备注 |
        // | 分子骨架 | (70,180)-(520,330) | 居中偏左 |
        // | 酯基高亮 | 3 个红色框 | 左侧/上方/下方 |
        // | 双键高亮 | 4 个蓝色框 | 沿碳链分布 |
        // | 手性碳 | 2 个绿色圆点 | 分支点 (205,255) 和 (250,265) |
        // | 信息框 | (540,70)-(780,410) | 右侧 |
        // | 按钮 | (280,450)和(420,450) | 底部 |
        
        let currentStep = 0;
        const totalSteps = 5;
        
        // 步骤内容配置 - 使用短文本避免溢出
        const stepContent = [
            { title: "步骤 0：分子结构", content: "观察有机化合物 A 的\n完整骨架结构" },
            { title: "步骤 1：酯基识别", content: "酯基 × 3\n三个乙酸酯基" },
            { title: "步骤 2：双键识别", content: "碳碳双键 × 4\n四个 C=C 双键" },
            { title: "步骤 3：手性碳定位", content: "手性碳 × 2\n两个手性中心" },
            { title: "步骤 4：反应计量", content: "H₂ 加成：4 mol\nNaOH 水解：3 mol" },
            { title: "步骤 5：结论", content: "分子式：C₂₁H₂₆O₆\nA✓ B✓ C✗ D✓ 答案：C" }
        ];
        
        // 元素引用
        const esterHighlights = [
            document.getElementById('scene1-ester-1'),
            document.getElementById('scene1-ester-2'),
            document.getElementById('scene1-ester-3')
        ];
        
        const bondHighlights = [
            document.getElementById('scene1-bond-1'),
            document.getElementById('scene1-bond-2'),
            document.getElementById('scene1-bond-3'),
            document.getElementById('scene1-bond-4')
        ];
        
        const chiralMarks = [
            document.getElementById('scene1-chiral-1'),
            document.getElementById('scene1-chiral-2')
        ];
        
        const infoTitle = document.getElementById('scene1-info-title');
        const infoContent = document.getElementById('scene1-info-content');
        const btnPrev = document.getElementById('scene1-btn-prev-group');
        const btnNext = document.getElementById('scene1-btn-next-group');
        
        // 隐藏所有高亮元素
        function hideAllHighlights() {
            esterHighlights.forEach(el => {
                el.classList.remove('scene1-visible');
                el.classList.add('scene1-hidden');
            });
            bondHighlights.forEach(el => {
                el.classList.remove('scene1-visible');
                el.classList.add('scene1-hidden');
            });
            chiralMarks.forEach(el => {
                el.classList.remove('scene1-visible');
                el.classList.add('scene1-hidden');
            });
        }
        
        // 更新显示状态
        function updateDisplay() {
            hideAllHighlights();
            
            // 根据步骤显示对应的高亮
            if (currentStep === 1) {
                esterHighlights.forEach(el => {
                    el.classList.remove('scene1-hidden');
                    el.classList.add('scene1-visible');
                });
            } else if (currentStep === 2) {
                bondHighlights.forEach(el => {
                    el.classList.remove('scene1-hidden');
                    el.classList.add('scene1-visible');
                });
            } else if (currentStep === 3) {
                chiralMarks.forEach(el => {
                    el.classList.remove('scene1-hidden');
                    el.classList.add('scene1-visible');
                });
            }
            
            // 更新信息文本
            infoTitle.textContent = stepContent[currentStep].title;
            
            // 使用 tspan 方式更新多行文本
            const lines = stepContent[currentStep].content.split('\n');
            infoContent.innerHTML = '';
            lines.forEach((line, i) => {
                const tspan = document.createElementNS('http://www.w3.org/2000/svg', 'tspan');
                tspan.setAttribute('x', '555');
                tspan.setAttribute('dy', i === 0 ? '0' : '18');
                tspan.textContent = line;
                infoContent.appendChild(tspan);
            });
            
            // 更新按钮状态
            if (currentStep === 0) {
                btnPrev.classList.add('scene1-btn-disabled');
            } else {
                btnPrev.classList.remove('scene1-btn-disabled');
            }
            
            if (currentStep === totalSteps) {
                btnNext.classList.add('scene1-btn-disabled');
            } else {
                btnNext.classList.remove('scene1-btn-disabled');
            }
            
            // 触发 MathJax 重新渲染
            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }
        
        // 按钮事件处理
        btnPrev.addEventListener('click', function() {
            if (currentStep > 0) {
                currentStep--;
                updateDisplay();
            }
        });
        
        btnNext.addEventListener('click', function() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateDisplay();
            }
        });
        
        // 初始化显示
        updateDisplay();
    })();
    </script>
</body>
</html>
