<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F₂代遗传分析与比例计算</title>
    <style>
        body { margin: 0; padding: 0; background: #ffffff; font-family: sans-serif; }
        #scene3-container { position: relative; width: 800px; height: 500px; background: #ffffff; margin: 0 auto; overflow: hidden; }
        #scene3-controls { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .scene3-btn { padding: 6px 16px; font-size: 14px; cursor: pointer; border: 1px solid #333; border-radius: 4px; background: #f5f5f5; }
        .scene3-btn:hover { background: #e0e0e0; }
        .scene3-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .scene3-step-indicator { font-size: 14px; color: #333; padding: 6px 12px; }
    </style>
</head>
<body>
    <div id="scene3-container">
        <svg id="scene3-svg" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
            <!-- 背景 -->
            <rect width="800" height="500" fill="#ffffff"/>

            <!-- P 代标题 -->
            <text id="scene3-p-title" x="400" y="35" text-anchor="middle" font-size="16" font-weight="bold" opacity="0">P 代</text>

            <!-- 亲本紫花矩形 -->
            <rect id="scene3-parent-purple" x="250" y="50" width="80" height="30" fill="#9c27b0" fill-opacity="0.2" stroke="#9c27b0" stroke-width="1" opacity="0"/>
            <text id="scene3-p-label" x="290" y="45" text-anchor="middle" font-size="14" opacity="0">P</text>
            <text id="scene3-aabb-label" x="290" y="85" text-anchor="middle" font-size="14" opacity="0">AAbb</text>

            <!-- 亲本蓝花矩形 -->
            <rect id="scene3-parent-blue" x="470" y="50" width="80" height="30" fill="#1565c0" fill-opacity="0.2" stroke="#1565c0" stroke-width="1" opacity="0"/>
            <text id="scene3-aabb-blue-label" x="510" y="85" text-anchor="middle" font-size="14" opacity="0">aaBB</text>

            <!-- 杂交箭头 P→F₁ -->
            <line id="scene3-hybrid-arrow" x1="330" y1="65" x2="390" y2="65" stroke="#000" stroke-width="2" opacity="0"/>
            <polygon id="scene3-hybrid-arrow-head" points="390,65 380,60 380,70" fill="#000" opacity="0"/>

            <!-- F₁标题 -->
            <text id="scene3-f1-title" x="400" y="110" text-anchor="middle" font-size="16" font-weight="bold" opacity="0">F₁</text>

            <!-- F₁个体矩形 -->
            <rect id="scene3-f1-rect" x="360" y="125" width="80" height="30" fill="#f5f5f5" stroke="#333" stroke-width="1" opacity="0"/>
            <text id="scene3-f1-label" x="400" y="145" text-anchor="middle" font-size="14" opacity="0">AaBb</text>

            <!-- 自交箭头 F₁→F₂ -->
            <line id="scene3-self-arrow" x1="400" y1="160" x2="400" y2="190" stroke="#000" stroke-width="2" opacity="0"/>
            <polygon id="scene3-self-arrow-head" points="400,190 395,180 405,180" fill="#000" opacity="0"/>

            <!-- F₂标题 -->
            <text id="scene3-f2-title" x="400" y="200" text-anchor="middle" font-size="16" font-weight="bold" opacity="0">F₂</text>

            <!-- 棋盘格区域 (300,215)-(500,415) 每格50×50 -->
            <g id="scene3-grid" opacity="0">
                <!-- 格子 (0,0) AABB 紫花 -->
                <rect id="scene3-grid-0-0" x="300" y="215" width="50" height="50" fill="#9c27b0" fill-opacity="0.2" stroke="#333" stroke-width="1"/>
                <text id="scene3-grid-0-0-text" x="325" y="240" text-anchor="middle" font-size="11">AABB</text>

                <!-- 格子 (0,1) AABb 紫花 -->
                <rect id="scene3-grid-0-1" x="350" y="215" width="50" height="50" fill="#9c27b0" fill-opacity="0.2" stroke="#333" stroke-width="1"/>
                <text id="scene3-grid-0-1-text" x="375" y="240" text-anchor="middle" font-size="11">AABb</text>

                <!-- 格子 (0,2) AaBB 紫花 -->
                <rect id="scene3-grid-0-2" x="400" y="215" width="50" height="50" fill="#9c27b0" fill-opacity="0.2" stroke="#333" stroke-width="1"/>
                <text id="scene3-grid-0-2-text" x="425" y="240" text-anchor="middle" font-size="11">AaBB</text>

                <!-- 格子 (0,3) AaBb 紫花 -->
                <rect id="scene3-grid-0-3" x="450" y="215" width="50" height="50" fill="#9c27b0" fill-opacity="0.2" stroke="#333" stroke-width="1"/>
                <text id="scene3-grid-0-3-text" x="475" y="240" text-anchor="middle" font-size="11">AaBb</text>

                <!-- 格子 (1,0) AABb 紫花 -->
                <rect id="scene3-grid-1-0" x="300" y="265" width="50" height="50" fill="#9c27b0" fill-opacity="0.2" stroke="#333" stroke-width="1"/>
                <text id="scene3-grid-1-0-text" x="325" y="290" text-anchor="middle" font-size="11">AABb</text>

                <!-- 格子 (1,1) AAbb 白花 -->
                <rect id="scene3-grid-1-1" x="350" y="265" width="50" height="50" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
                <text id="scene3-grid-1-1-text" x="375" y="290" text-anchor="middle" font-size="11">AAbb</text>

                <!-- 格子 (1,2) AaBb 紫花 -->
                <rect id="scene3-grid-1-2" x="400" y="265" width="50" height="50" fill="#9c27b0" fill-opacity="0.2" stroke="#333" stroke-width="1"/>
                <text id="scene3-grid-1-2-text" x="425" y="290" text-anchor="middle" font-size="11">AaBb</text>

                <!-- 格子 (1,3) Aabb 白花 -->
                <rect id="scene3-grid-1-3" x="450" y="265" width="50" height="50" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
                <text id="scene3-grid-1-3-text" x="475" y="290" text-anchor="middle" font-size="11">Aabb</text>

                <!-- 格子 (2,0) AaBB 紫花 -->
                <rect id="scene3-grid-2-0" x="300" y="315" width="50" height="50" fill="#9c27b0" fill-opacity="0.2" stroke="#333" stroke-width="1"/>
                <text id="scene3-grid-2-0-text" x="325" y="340" text-anchor="middle" font-size="11">AaBB</text>

                <!-- 格子 (2,1) AaBb 紫花 -->
                <rect id="scene3-grid-2-1" x="350" y="315" width="50" height="50" fill="#9c27b0" fill-opacity="0.2" stroke="#333" stroke-width="1"/>
                <text id="scene3-grid-2-1-text" x="375" y="340" text-anchor="middle" font-size="11">AaBb</text>

                <!-- 格子 (2,2) aaBB 蓝花 -->
                <rect id="scene3-grid-2-2" x="400" y="315" width="50" height="50" fill="#1565c0" fill-opacity="0.2" stroke="#333" stroke-width="1"/>
                <text id="scene3-grid-2-2-text" x="425" y="340" text-anchor="middle" font-size="11">aaBB</text>

                <!-- 格子 (2,3) aaBb 蓝花 -->
                <rect id="scene3-grid-2-3" x="450" y="315" width="50" height="50" fill="#1565c0" fill-opacity="0.2" stroke="#333" stroke-width="1"/>
                <text id="scene3-grid-2-3-text" x="475" y="340" text-anchor="middle" font-size="11">aaBb</text>

                <!-- 格子 (3,0) AaBb 紫花 -->
                <rect id="scene3-grid-3-0" x="300" y="365" width="50" height="50" fill="#9c27b0" fill-opacity="0.2" stroke="#333" stroke-width="1"/>
                <text id="scene3-grid-3-0-text" x="325" y="390" text-anchor="middle" font-size="11">AaBb</text>

                <!-- 格子 (3,1) Aabb 白花 -->
                <rect id="scene3-grid-3-1" x="350" y="365" width="50" height="50" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
                <text id="scene3-grid-3-1-text" x="375" y="390" text-anchor="middle" font-size="11">Aabb</text>

                <!-- 格子 (3,2) aaBb 蓝花 -->
                <rect id="scene3-grid-3-2" x="400" y="365" width="50" height="50" fill="#1565c0" fill-opacity="0.2" stroke="#333" stroke-width="1"/>
                <text id="scene3-grid-3-2-text" x="425" y="390" text-anchor="middle" font-size="11">aaBb</text>

                <!-- 格子 (3,3) aabb 白花 -->
                <rect id="scene3-grid-3-3" x="450" y="365" width="50" height="50" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
                <text id="scene3-grid-3-3-text" x="475" y="390" text-anchor="middle" font-size="11">aabb</text>
            </g>

            <!-- 右侧比例标注 -->
            <text id="scene3-ratio-9" x="520" y="240" font-size="14" opacity="0">9 A_B_</text>
            <text id="scene3-ratio-3-white" x="520" y="290" font-size="14" opacity="0">3 A_bb</text>
            <text id="scene3-ratio-3-blue" x="520" y="340" font-size="14" opacity="0">3 aaB_</text>
            <text id="scene3-ratio-1" x="520" y="390" font-size="14" opacity="0">1 aabb</text>

            <!-- 白花高亮框 -->
            <g id="scene3-white-highlight" opacity="0">
                <rect id="scene3-white-border-1-1" x="350" y="265" width="50" height="50" fill="none" stroke="#c62828" stroke-width="2"/>
                <rect id="scene3-white-border-1-3" x="450" y="265" width="50" height="50" fill="none" stroke="#c62828" stroke-width="2"/>
                <rect id="scene3-white-border-3-1" x="350" y="365" width="50" height="50" fill="none" stroke="#c62828" stroke-width="2"/>
                <rect id="scene3-white-border-3-3" x="450" y="365" width="50" height="50" fill="none" stroke="#c62828" stroke-width="2"/>
                <text id="scene3-white-count" x="400" y="425" text-anchor="middle" font-size="14" fill="#c62828">白花 10/16</text>
            </g>

            <!-- 株系分类 -->
            <g id="scene3-lineage" opacity="0">
                <text id="scene3-lineage-title" x="400" y="455" text-anchor="middle" font-size="14" font-weight="bold">白花株系分类</text>
                <text id="scene3-lineage-aabb" x="100" y="475" text-anchor="middle" font-size="12">AABB</text>
                <text id="scene3-lineage-aabb2" x="180" y="475" text-anchor="middle" font-size="12">AABb</text>
                <text id="scene3-lineage-aabb3" x="260" y="475" text-anchor="middle" font-size="12">AaBB</text>
                <rect id="scene3-lineage-aabb4-bg" x="310" y="462" width="60" height="20" fill="#c62828" fill-opacity="0.2" stroke="#c62828" stroke-width="1"/>
                <text id="scene3-lineage-aabb4" x="340" y="475" text-anchor="middle" font-size="12" fill="#c62828" font-weight="bold">AaBb</text>
                <text id="scene3-lineage-aabb5" x="420" y="475" text-anchor="middle" font-size="12">aabb</text>
                <text id="scene3-ratio-3-3-10" x="550" y="475" text-anchor="middle" font-size="14" font-weight="bold" fill="#c62828" opacity="0">紫:蓝:白 = 3:3:10</text>
            </g>
        </svg>

        <div id="scene3-controls">
            <button id="scene3-prev-btn" class="scene3-btn">◀ 上一步</button>
            <span id="scene3-step-indicator" class="scene3-step-indicator">步骤 0/5</span>
            <button id="scene3-next-btn" class="scene3-btn">下一步 ▶</button>
        </div>
    </div>

    <script>
    (function() {
        // Scene 3: F₂代遗传分析与比例计算
        const currentState = { step: 0 };
        const totalSteps = 5;

        // 工具函数：显示元素
        function show(el) {
            if (el) {
                el.style.opacity = '1';
                el.style.display = '';
            }
        }

        // 工具函数：隐藏元素
        function hide(el) {
            if (el) {
                el.style.opacity = '0';
                el.style.display = '';
            }
        }

        // 获取元素
        function getEl(id) {
            return document.getElementById(id);
        }

        // 更新步骤指示器
        function updateIndicator() {
            const indicator = getEl('scene3-step-indicator');
            indicator.textContent = `步骤 ${currentState.step}/${totalSteps}`;
            const prevBtn = getEl('scene3-prev-btn');
            const nextBtn = getEl('scene3-next-btn');
            prevBtn.disabled = currentState.step === 0;
            nextBtn.disabled = currentState.step === totalSteps;
        }

        // 渲染函数
        function render() {
            // 步骤 0: 显示 P 代
            if (currentState.step >= 0) {
                show(getEl('scene3-p-title'));
                show(getEl('scene3-parent-purple'));
                show(getEl('scene3-p-label'));
                show(getEl('scene3-aabb-label'));
                show(getEl('scene3-parent-blue'));
                show(getEl('scene3-aabb-blue-label'));
                show(getEl('scene3-hybrid-arrow'));
                show(getEl('scene3-hybrid-arrow-head'));
            }

            // 步骤 1: 显示 F₁代
            if (currentState.step >= 1) {
                show(getEl('scene3-f1-title'));
                show(getEl('scene3-f1-rect'));
                show(getEl('scene3-f1-label'));
                show(getEl('scene3-self-arrow'));
                show(getEl('scene3-self-arrow-head'));
            } else {
                hide(getEl('scene3-f1-title'));
                hide(getEl('scene3-f1-rect'));
                hide(getEl('scene3-f1-label'));
                hide(getEl('scene3-self-arrow'));
                hide(getEl('scene3-self-arrow-head'));
            }

            // 步骤 2: 显示 F₂棋盘格
            if (currentState.step >= 2) {
                show(getEl('scene3-grid'));
                show(getEl('scene3-f2-title'));
                show(getEl('scene3-ratio-9'));
                show(getEl('scene3-ratio-3-white'));
                show(getEl('scene3-ratio-3-blue'));
                show(getEl('scene3-ratio-1'));
            } else {
                hide(getEl('scene3-grid'));
                hide(getEl('scene3-f2-title'));
                hide(getEl('scene3-ratio-9'));
                hide(getEl('scene3-ratio-3-white'));
                hide(getEl('scene3-ratio-3-blue'));
                hide(getEl('scene3-ratio-1'));
            }

            // 步骤 3: 高亮白花个体
            if (currentState.step >= 3) {
                show(getEl('scene3-white-highlight'));
            } else {
                hide(getEl('scene3-white-highlight'));
            }

            // 步骤 4: 显示株系分类
            if (currentState.step >= 4) {
                show(getEl('scene3-lineage'));
            } else {
                hide(getEl('scene3-lineage'));
            }

            // 步骤 5: 显示目标株系后代比例
            if (currentState.step >= 5) {
                show(getEl('scene3-ratio-3-3-10'));
            } else {
                hide(getEl('scene3-ratio-3-3-10'));
            }

            updateIndicator();
        }

        // 事件绑定
        getEl('scene3-prev-btn').addEventListener('click', function() {
            if (currentState.step > 0) {
                currentState.step--;
                render();
            }
        });

        getEl('scene3-next-btn').addEventListener('click', function() {
            if (currentState.step < totalSteps) {
                currentState.step++;
                render();
            }
        });

        // 初始渲染
        render();
    })();
    </script>
</body>
</html>
